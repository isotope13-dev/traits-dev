# The command binding must feed the JSON request; a Run-key example beside
# unrelated networking is insufficient. The functions need not be called for
# this static capability claim, and no helper response is assumed.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1547.001,T1564.003
traits:
  - id: json-forwarded-headless-run-command
    desc: Forwards a headless Run-key install command
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (program
          (lexical_declaration (variable_declarator
            name: (identifier) @helper
            value: (string (string_fragment) @endpoint)))
          (function_declaration body: (statement_block
            (lexical_declaration (variable_declarator
              name: (identifier) @command
              value: (_) @construction))
            (return_statement (call_expression
              function: (identifier) @fetch
              arguments: (arguments (identifier) @destination
                (object
                  (pair key: (property_identifier) @method
                    value: (string (string_fragment) @post))
                  (pair key: (property_identifier) @body
                    value: (call_expression
                      function: (member_expression object: (identifier) @json
                        property: (property_identifier) @stringify)
                      arguments: (arguments (object
                        (shorthand_property_identifier) @forwarded))))))))))
          (#eq? @helper @destination)
          (#eq? @command @forwarded)
          (#eq? @forwarded "command")
          (#eq? @fetch "fetch")
          (#eq? @method "method")
          (#eq? @post "POST")
          (#eq? @body "body")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#match? @endpoint "^http://(127\\.0\\.0\\.1|localhost):[0-9]+/")
          (#match? @construction "(?i)reg[ ]+add.{0,120}\\\\Run.{0,100}conhost\\.exe[ ]+--headless")
          (#match? @construction "--allow-run")
        ) @autorun
composite_rules:
  - id: socket-survey-headless-run-key
    desc: Socket survey forwards headless Run-key install
    crit: hostile
    conf: 0.98
    all:
      - id: json-forwarded-headless-run-command
      - id: objectives/discovery/network/enumeration::socket-open-loopback-network-survey
      - id: objectives/discovery/process::socket-open-loopback-process-survey
