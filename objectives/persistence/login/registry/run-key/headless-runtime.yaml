             left: (binary_expression left: (string) @prefix operator: "+" right: (_))
             operator: "+" right: (string) @allow)
           operator: "+" right: (_))
         operator: "+" right: (string))))
         . (return_statement (call_expression function: (identifier) @fetch
         arguments: (arguments . (identifier) @destination . [(object . (pair key: [(property_identifier) @method (string (string_fragment) @method)] value: (string (string_fragment) @post)) . (pair key: [(property_identifier) @body (string (string_fragment) @body)] value: (call_expression
         function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
         arguments: [(arguments . (object . [(shorthand_property_identifier) @field @forwarded (pair key: [(property_identifier) @field (string (string_fragment) @field)] value: (identifier) @forwarded)] .) .) (arguments . (object . [(shorthand_property_identifier) @field @forwarded (pair key: [(property_identifier) @field (string (string_fragment) @field)] value: (identifier) @forwarded)] .) . (null))])) .) (object . (pair key: [(property_identifier) @body (string (string_fragment) @body)] value: (call_expression
         function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
         arguments: [(arguments . (object . [(shorthand_property_identifier) @field @forwarded (pair key: [(property_identifier) @field (string (string_fragment) @field)] value: (identifier) @forwarded)] .) .) (arguments . (object . [(shorthand_property_identifier) @field @forwarded (pair key: [(property_identifier) @field (string (string_fragment) @field)] value: (identifier) @forwarded)] .) . (null))])) . (pair key: [(property_identifier) @method (string (string_fragment) @method)] value: (string (string_fragment) @post)) .)])) @evidence))))
         (#eq? @fetch "fetch")
         (#eq? @field "command")
         (#eq? @method "method")
         (#eq? @post "POST")
         (#eq? @body "body")
         (#eq? @json "JSON")
         (#eq? @stringify "stringify")
         (#eq? @binding @forwarded)
         (#match? @endpoint "^http://(127\\.0\\.0\\.1|localhost):[0-9]+/")
         (#match? @prefix "(?i)^['\"]reg[ ]+add.{0,120}\\\\Run.{0,100}conhost\\.exe[ ]+--headless ")
         (#match? @allow "^['\"] --allow-run ['\"]$")
         (#eq? @helper @destination)
        )
        ((function_declaration body: (statement_block
         . (lexical_declaration "const" (variable_declarator name: (identifier) @binding value: (binary_expression
         left: (binary_expression
           left: (binary_expression
             left: (binary_expression left: (string) @prefix operator: "+" right: (_))
             operator: "+" right: (string) @allow)
           operator: "+" right: (_))
         operator: "+" right: (string))))
         . (return_statement (call_expression function: (identifier) @fetch
         arguments: (arguments . (string (string_fragment) @endpoint) . [(object . (pair key: [(property_identifier) @method (string (string_fragment) @method)] value: (string (string_fragment) @post)) . (pair key: [(property_identifier) @body (string (string_fragment) @body)] value: (call_expression
