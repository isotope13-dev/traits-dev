composite_rules:
  - id: socket-survey-headless-run-key
    desc: Socket survey forwards headless Run-key install
    crit: hostile
    conf: 0.98
    all:
      - id: json-forwarded-headless-run-command
      - id: objectives/discovery/network/enumeration::socket-open-loopback-network-survey
      - id: objectives/discovery/process::socket-open-loopback-process-survey
