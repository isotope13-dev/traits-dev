# The command binding must feed the JSON request; a Run-key example beside
# unrelated networking is insufficient. The functions need not be called for
# this static capability claim, and no helper response is assumed.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1547.001,T1564.003
traits:
  - id: json-forwarded-headless-run-command
    desc: Forwards a headless Run-key install command
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
