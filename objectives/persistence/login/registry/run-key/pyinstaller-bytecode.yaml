defaults:
  platforms: [windows]
  for: [pyc]

composite_rules:
  - id: pyinstaller-bytecode-run-key-persistence
    desc: Bytecode has Run key, value-write, and nsedge.exe names
    crit: suspicious
    conf: 0.9
    attack: T1547.001
    all:
      - id: micro-behaviors/os/registry/keys::pyc-hkcu-run-key
      - id: micro-behaviors/os/registry/access::pyc-setvalueex-name
      - id: micro-behaviors/fs/path/basename::pyc-nsedge-filename
