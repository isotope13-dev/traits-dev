# An unsigned program that fetches content with WinINet, builds a Run-key
# entry, and imports it silently with regedit while moving and running files
# installs its own persistence from outside the registry APIs. Security
# tools that hook the registry calls do not see a regedit import.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1547.001,T1112,T1105
composite_rules:
  - id: wininet-backdoor-with-regedit-import-run-key
    desc: WinINet backdoor persisting by silent regedit import
    crit: hostile
    conf: 0.85
    all:
      - id: micro-behaviors/communications/http/client/wininet::wininet-openurl-with-run-key-reference
      - id: micro-behaviors/os/registry/write::regedit-silent-import
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/fs/file/move::movefile-a-rewrite-api
    unless:
      - id: metadata/signed/platform/
