# Win32 Registry Persistence via API
# Detects PE binaries that write registry values and copy themselves
# ATT&CK: T1547.001 (Boot or Logon Autostart Execution: Registry Run Keys)
defaults:
  for: [pe]
  platforms: [windows]
traits:
  # reg.exe command text adding a value under a hive-qualified
  # CurrentVersion\Run key. Run-key registration is login persistence;
  # compiled installers normally use the registry API rather than reg.exe.
  - id: reg-add-hive-run-key-command
    desc: Embeds reg add command for Run key
    crit: suspicious
    conf: 0.88
    attack: T1547.001
    for: [pe, python]
    if:
      type: text
      regex: '(?i)\breg(\.exe)?"?\s+add\s+"?HK\w*\\Software\\[^"]{0,30}CurrentVersion\\Run\b'
composite_rules:
  - id: autoit-iexpress-runonce-persistence
    desc: IExpress AutoIt payload with RunOnce persistence
    crit: hostile
    conf: 0.98
    attack: "T1027,T1547.001"
    all:
      - id: metadata/binary/installer/sfx::cabinet-fdi-extraction
      - id: metadata/lang/compiled::autoit-script-resource-entry
      - id: metadata/lang/compiled::autoit-runtime-resource-entry
      - id: micro-behaviors/os/registry/manipulate::run-key-file-operation-api-profile
    unless:
      - id: metadata/signed/platform/
  - id: dotnet-run-key-autostart-persistence
    desc: Managed stealer has Run-key write and remote-thread API references
    crit: hostile
    conf: 0.98
    attack: "T1547.001,T1112"
    all:
      - id: micro-behaviors/os/registry/write::dotnet-registry-key-write
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
      - id: micro-behaviors/process/inject/runtime/call::remote-alloc-write-thread-api-set
      - id: objectives/exfiltration/stealer/input::dotnet-hook-keylogger-http-upload
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/

