# Win32 Registry Persistence via API
# Detects PE binaries that write registry values and copy themselves
# ATT&CK: T1547.001 (Boot or Logon Autostart Execution: Registry Run Keys)
defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: autoit-iexpress-runonce-persistence
    desc: IExpress AutoIt payload with RunOnce persistence
    crit: hostile
    conf: 0.98
    attack: "T1027,T1547.001"
    all:
      - id: micro-behaviors/data/archive/extract/cab::fdi-api-name-reference
      - id: metadata/lang/compiled::autoit-script-resource-entry
      - id: metadata/lang/compiled::autoit-runtime-resource-entry
      - id: micro-behaviors/os/registry/autostart/write::run-key-file-operation-api-profile

  - id: native-clipboard-clipper-run-key-persistence
    desc: Cryptocurrency clipboard hijacker with Run-key self-copy persistence
    crit: hostile
    conf: 0.98
    attack: "T1547.001,T1115"
    all:
      - id: objectives/impact/crypto-manipulation/clipboard::native-clipboard-crypto-clipper
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run
      - id: micro-behaviors/os/registry/autostart/write::run-key-copy-own-path-api-profile
