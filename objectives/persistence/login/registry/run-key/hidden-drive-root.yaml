defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: hidden-drive-root-run-registry-writer
    desc: Hidden root executable and Run-key writer
    crit: hostile
    conf: 0.96
    attack: T1547.001,T1564.001
    all:
      - id: micro-behaviors/fs/attributes/flags::attrib-system-hidden-root-executable-command
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
