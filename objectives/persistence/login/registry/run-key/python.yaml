defaults:
  platforms: [windows]
  # pyc: the persistence code ships as bytecode inside PyInstaller bundles.
  for: [python, pyc]
  attack: T1547.001

composite_rules:
  - id: python-run-key-launches-pythonw
    desc: Run key launches hidden pythonw
    crit: hostile
    conf: 0.98
    near_lines: 90
    all:
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
      - id: micro-behaviors/fs/path/basename::pythonw-executable-reference
    # Source reaches the value write through the winreg module; bundled
    # bytecode reaches it through the constant names the marshal keeps.
    any:
      - id: micro-behaviors/os/registry/manipulate::winreg-setvalue
      - id: micro-behaviors/os/registry/access::pyc-setvalueex-name
      - id: micro-behaviors/os/registry/access::python-bytecode-winreg-value-write
    unless:
      # An installer module shipping both install and uninstall paths is
      # transparent autostart management, not stealth persistence.
      - id: micro-behaviors/os/registry/manipulate::run-key-write-with-uninstaller
