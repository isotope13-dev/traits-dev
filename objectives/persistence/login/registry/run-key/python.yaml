defaults:
  platforms: [windows]
  for: [python]
  attack: T1547.001

composite_rules:
  - id: python-winreg-run-key-persistence
    desc: Python writes a Windows login command to the CurrentVersion Run key
    crit: notable
    conf: 0.96
    near_lines: 90
    all:
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/os/registry/manipulate::winreg-setvalue

  - id: python-run-key-launches-pythonw
    desc: Run key launches hidden pythonw
    crit: hostile
    conf: 0.98
    near_lines: 90
    all:
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/os/registry/manipulate::winreg-setvalue
      - id: micro-behaviors/process/interpreter/python::pythonw-launch
