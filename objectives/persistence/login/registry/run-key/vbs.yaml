defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1547.001
  mbc: F0012

traits:
  - id: vbs-regwrite-run-wscript
    desc: Run key launches wscript.exe
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bRegWrite\b[^\r\n]{0,160}CurrentVersion\\Run[^\r\n]{0,120}wscript\.exe'

composite_rules:
  - id: vbs-runkey-wscript-persistence
    desc: VBScript persists wscript via Run key
    crit: hostile
    conf: 0.97
    all:
      - id: vbs-regwrite-run-wscript
      - id: micro-behaviors/os/registry/keys::currentversion-run
