defaults:
  platforms: [windows]
composite_rules:
  - id: run-key-persistence-ps
    desc: Run-key write with concealed payload execution
    crit: hostile
    conf: 0.95
    for:
    - powershell
    all:
    - id: micro-behaviors/os/autorun/login-items::run-key-write-ps
    - id: objectives/evasion/masquerade/path::whitespace-system-path-fetch-and-launch
    attack: T1547.001
  - id: msi-hidden-powershell-run-key-persistence
    desc: MSI hides encoded PowerShell behind a Run key
    crit: hostile
    conf: 0.99
    for: [oledoc]
    attack: T1059.001,T1547.001
    all:
      - id: 'micro-behaviors/process/create/installer::msi-powershell-encoded-window-option-raw'
      - id: "micro-behaviors/os/registry/keys/autostart::ansi-run-key-path"
  - id: silent-regedit-run-key-import
    desc: Silently imports a Run-key file staged in the temporary directory
    crit: hostile
    conf: 0.97
    for: [pe]
    attack: T1112,T1547.001
    all:
      - id: micro-behaviors/os/registry/write::regedit-silent-import
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/fs/temp/file::get-temp-file-name
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
