defaults:
  platforms: [windows]
composite_rules:
  - id: run-key-persistence-ps
    desc: Run-key write with concealed payload execution
    crit: hostile
    conf: 0.95
    for:
    - powershell
    all:
    - id: micro-behaviors/os/autorun/login-items::run-key-write-ps
    - id: objectives/evasion/masquerade/path::whitespace-system-path-fetch-and-launch
    attack: T1547.001
  - id: msi-hidden-powershell-run-key-persistence
    desc: MSI hides encoded PowerShell behind a Run key
    crit: hostile
    conf: 0.99
    for: [oledoc]
    attack: T1059.001,T1547.001
    all:
      - id: micro-behaviors/process/argument/interpreter::msi-powershell-encoded-window-option-raw
      - id: "micro-behaviors/os/registry/autostart/reference::ansi-run-key-path"
  - id: silent-regedit-run-key-import
    desc: Silently imports a Run-key file staged in the temporary directory
    crit: hostile
    conf: 0.97
    for: [pe]
    attack: T1112,T1547.001
    all:
      - id: micro-behaviors/os/registry/import::regedit-silent-import
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path
      - id: metadata/binary/symbols/name/process::winexec
      - id: micro-behaviors/fs/temp/file::get-temp-file-name
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
      - id: metadata/signature/absent::unsigned-missing-signature-record
  - id: python-run-key-dropper-persistence
    desc: Python dropper installs Windows Run key persistence
    crit: hostile
    conf: 0.97
    for: [python]
    attack: T1547.001,T1105
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/os/registry/autostart/write::python-run-key-write-pythonw-reference
      - id: micro-behaviors/communications/http/get::requests-get
    any:
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-text
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-content
      - id: micro-behaviors/fs/file/io-mode::write-append-create-mode
