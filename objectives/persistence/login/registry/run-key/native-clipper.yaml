defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: native-clipboard-hijacker-run-key
    desc: Native clipboard hijacker with Run-key writer
    crit: hostile
    conf: 0.99
    attack: T1547.001
    all:
      - id: objectives/impact/crypto-manipulation/clipboard::native-clipboard-crypto-clipper
      - id: micro-behaviors/os/registry/keys/autostart::utf16-currentversion-run-key
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-w
