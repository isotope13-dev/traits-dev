# Script-form counterpart of dll-startup-approval.yaml. Run keys and rundll32
# are common; a DLL export autorun that also writes the StartupApproved\Run
# state (so Task Manager still shows it enabled) warrants review. Proximity
# does not prove the DLL path or the approval bytes reach the registry.
defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1547.001
composite_rules:
  - id: script-dll-autorun-startup-approval
    desc: Script DLL autorun with StartupApproved state
    crit: suspicious
    conf: 0.9
    near_lines: 30
    all:
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run
      - id: metadata/lang/source/syntax/command/launch::rundll32-command-syntax-reference
      - id: micro-behaviors/os/registry/autostart/reference::startup-approved-run-key-path-script
  - id: script-programdata-dll-runkey-autorun
    desc: Script copies DLL to ProgramData for Run-key
    crit: suspicious
    conf: 0.85
    for: [powershell]
    near_lines: 30
    all:
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run
      - id: metadata/lang/source/syntax/command/launch::rundll32-command-syntax-reference
      - id: micro-behaviors/os/env/path::programdata-env-lookup
      - id: micro-behaviors/fs/file/copy/command::powershell-copy-item-command
