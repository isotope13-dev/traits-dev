# PE binaries that carry the VB/WSH string form of Run-key persistence.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1112,T1547.001

traits:
  # Packed VB6 samples may expose decoded values instead of a parsed COM or
  # source fact, so these are context-specific building blocks for the
  # persistence composite below.
  - id: wscript-shell-token
    desc: WScript.Shell COM token
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)^WScript\.Shell$'
  - id: regwrite-token
    desc: WScript RegWrite token
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)^RegWrite$'

composite_rules:
  - id: wscript-run-key-registry-persistence
    desc: WScript Run-key registry persistence
    crit: hostile
    conf: 0.99
    near_bytes: 384
    all:
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: wscript-shell-token
      - id: regwrite-token
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
