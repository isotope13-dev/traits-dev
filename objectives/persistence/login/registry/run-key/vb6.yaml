# PE binaries that carry the VB/WSH string form of Run-key persistence.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1112,T1547.001

composite_rules:
  - id: wscript-run-key-registry-persistence
    desc: WScript Run-key registry persistence
    crit: hostile
    conf: 0.99
    near_bytes: 384
    all:
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
      - id: metadata/file/profile/com-progid::wscript-shell-literal
      - id: micro-behaviors/os/registry/write::regwrite-pe-token
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
