# Generic WSH/Run/RegWrite co-occurrence remains a notable capability.
# The malicious conclusion additionally requires the self-copy autorun worm.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1112,T1547.001

composite_rules:
  - id: wscript-run-key-registry-persistence
    desc: Self-copy worm has WScript Run-key registration
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/registry/autostart/write::wscript-run-key-write-references
      - id: objectives/lateral-movement/usb-worm/autorun::vb6-autorun-runkey-worm
    unless:
      - id: metadata/installer/product/
