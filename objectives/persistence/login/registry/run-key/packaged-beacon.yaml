# Registration alone is neutral. These chains require a staged Node network
# callback, a launcher, and a concrete registry writer in the package.
defaults:
  platforms: [windows]
  crit: hostile
  conf: 0.98
  attack: T1547.001
composite_rules:
  - id: packaged-source-run-key-node-beacon
    desc: Package stages a Node beacon and registers Run-key launch
    for: [ruby, gem, powershell, zip]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/request/client::embedded-node-https-get-with-timeout
      - id: micro-behaviors/fs/path/application/executable::node-executable-name-reference
      - id: micro-behaviors/fs/write/file/full/
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
    any:
      - id: micro-behaviors/os/registry/write::ruby-system-run-key-command
      - id: micro-behaviors/os/registry/write::ruby-system-run-key-argv
      - id: micro-behaviors/os/registry/write::powershell-reg-add-run-key
      - id: micro-behaviors/os/registry/write::powershell-literal-run-key-property
      - id: micro-behaviors/os/registry/write::powershell-assigned-run-key-property
  - id: jvm-bytecode-run-key-node-beacon
    desc: JVM stages a Node beacon and starts Run-key registration
    for: [class, jar]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/request/client::embedded-node-https-get-with-timeout
      - id: micro-behaviors/process/info/name::node-executable-name-bytecode
      - id: micro-behaviors/fs/write/file/full::jvm-files-write-bytecode
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
      - id: micro-behaviors/os/registry/manipulate::jvm-reg-command-argument
      - id: micro-behaviors/os/registry/manipulate::jvm-add-command-argument
      - id: micro-behaviors/os/registry/manipulate::jvm-reg-sz-token
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode
