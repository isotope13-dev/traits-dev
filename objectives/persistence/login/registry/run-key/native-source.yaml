defaults:
  crit: suspicious
  platforms: [windows]
  for: [c, cpp]
  attack: T1547.001

composite_rules:
- id: default-user-hive-run-persistence
  desc: Run key planted in default user hive
  crit: hostile
  conf: 0.95
  all:
    - id: micro-behaviors/os/registry/autostart/reference::native-run-key-write-profile
    - id: micro-behaviors/os/registry/hive/load::regloadkey-call-source
    - id: micro-behaviors/os/registry/hive/reference::default-user-ntuser-hive-path
  near_bytes: 900

- id: native-run-key-script-dropper-persistence
  desc: Native code drops script and registers Run key persistence
  crit: hostile
  conf: 0.98
  for: [c, cpp, source, tar, zip]
  scope: archive
  attack: T1547.001,T1059
  all:
    - id: micro-behaviors/os/registry/autostart/write::reg-add-run-command
    - id: micro-behaviors/fs/file/open/write::c-fopen-overwrite-mode
    - id: micro-behaviors/process/create/shell/variable-command::c-system-command-call
  any:
    - id: micro-behaviors/os/application/target/development::node-executable-name-reference
    - id: micro-behaviors/communications/http/client/reference::embedded-node-https-get-with-timeout
    - id: micro-behaviors/fs/path/application/executable::appdata-exe-path

