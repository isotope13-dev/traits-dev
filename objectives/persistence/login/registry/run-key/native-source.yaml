defaults:
  crit: suspicious
  platforms: [windows]
  for: [c, cpp]
  attack: T1547.001

composite_rules:
- id: run-key-persistence-source
  desc: Run key persistence in native source
  conf: 0.95
  all:
    - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
    - id: micro-behaviors/os/registry/access::registry-set-value-source
  near_bytes: 1200
  unless:
    - id: well-known/app/security/keepass::source-copyright-header

# Loading the Default user hive and writing CurrentVersion\Run plants
# startup for every account created afterward. The value name is not
# required: attackers rename it.
- id: default-user-hive-run-persistence
  desc: Run key planted in default user hive
  crit: hostile
  conf: 0.95
  all:
    - id: run-key-persistence-source
    - id: micro-behaviors/os/registry/hive::regloadkey-call-source
    - id: micro-behaviors/os/registry/hive::default-user-ntuser-hive-path
  near_bytes: 900
