defaults:
  crit: suspicious
  platforms: [windows]
  for: [c, cpp]
  attack: T1547.001

composite_rules:
- id: default-user-hive-run-persistence
  desc: Run key planted in default user hive
  crit: hostile
  conf: 0.95
  all:
    - id: micro-behaviors/os/registry/keys/autostart::native-run-key-write-profile
    - id: micro-behaviors/os/registry/hive::regloadkey-call-source
    - id: micro-behaviors/os/registry/hive::default-user-ntuser-hive-path
  near_bytes: 900
