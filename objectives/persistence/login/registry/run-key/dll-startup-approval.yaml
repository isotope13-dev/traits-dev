# Run keys are common installer behavior. The abnormal 08 approval state from
# the report, a binary setter consuming that array, and a DLL/export autorun
# command warrant review. Proximity does not prove the command was installed
# or bind the registry handle to the approval key.
defaults:
  platforms: [windows]
  for: [c, cpp]
composite_rules:
  - id: dll-autorun-startup-approval-clues
    desc: DLL autorun with protected approval state
    crit: suspicious
    conf: 0.93
    attack: T1547.001
    near_bytes: 1536
    all:
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run
      - id: metadata/lang/source/syntax/command/launch::rundll32-command-syntax-reference
      - id: micro-behaviors/os/registry/autostart/write::startup-approved-binary-write-clues
      - id: micro-behaviors/os/registry/value/write::leading-eight-zero-array-binary-write
