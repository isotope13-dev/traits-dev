# Persistence written through a .reg file the script generates and deletes.
#
# `reg add ...Run /v Name /d payload` puts the whole change on a command line
# for anything reading process arguments. Echoing the same change into a .reg
# file, importing it with `regedit /s` and deleting the file leaves no command
# line to read and no file to find. The registry ends up in the same state.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1547.001,T1112
  mbc: F0012

composite_rules:
  - id: generated-reg-file-run-key-install
    desc: Installs a Run key via a generated .reg file
    crit: hostile
    conf: 0.94
    all:
      - id: objectives/command-and-control/dropper/execution/batch::grouped-echo-stage-redirect
      - id: micro-behaviors/os/registry/keys::run-value-name
      - id: micro-behaviors/os/registry/write/property::regedit-silent-import
