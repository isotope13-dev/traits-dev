defaults:
  platforms: [windows]
  for: [pe]
  attack: T1547.001

composite_rules:
  - id: disguised-system-subdirectory-run-key
    desc: Disguised autorun command; Run-key write APIs
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/evasion/masquerade/process/path::system-process-subdirectory-autorun-command
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
      - id: micro-behaviors/process/create/shellexec::shell-execute-call
    any:
      # A scanner can carry malware strings as inert signatures. Require
      # an active value write API and an anomalous execution layout:
      # entry in the relocation section, resource section, or a writable-and-executable one.
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-w
      - id: micro-behaviors/os/registry/access::reg-set-value-ex-text
      - id: micro-behaviors/os/registry/access::reg-create-key-a
      - id: metadata/binary/section/header::pe-entry-in-reloc-section
      - id: metadata/binary/section/header::writable-entry-with-wx-section
      - id: metadata/binary/section/header::pe-entry-in-resource-section
    needs: 2
