defaults:
  platforms: [windows]
  for: [pe]
  attack: T1547.001

composite_rules:
  - id: disguised-system-subdirectory-run-key
    desc: Disguised autorun command; Run-key write APIs
    crit: hostile
    conf: 0.96
    all:
      # A scanner can carry malware strings as inert signatures. Require
      # redirected execution into the relocation section as well.
      - id: metadata/binary/section/header::pe-entry-in-reloc-section
      - id: objectives/evasion/masquerade/process/path::system-process-subdirectory-autorun-command
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
      - id: micro-behaviors/process/create/shellexec::shell-execute-a
