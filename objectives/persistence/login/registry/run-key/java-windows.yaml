defaults:
  platforms: [windows]
  for: [java, kotlin, class, jar]
  attack: T1547.001

composite_rules:
  - id: java-run-key-persistence
    desc: Java Run key persistence
    crit: hostile
    conf: 0.98
    for: [java]
    all:
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/os/registry/manipulate::jvm-reg-add-reg-sz-force-command

  - id: kotlin-run-key-persistence
    desc: Kotlin Run key persistence
    crit: hostile
    conf: 0.98
    for: [kotlin]
    all:
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/os/registry/manipulate::jvm-reg-add-reg-sz-force-command

  - id: jvm-run-key-persistence
    desc: JVM Run key persistence
    crit: hostile
    conf: 0.98
    for: [class, jar]
    all:
      - id: micro-behaviors/os/registry/keys::jvm-currentversion-run-bytes
      - id: micro-behaviors/os/registry/manipulate::jvm-reg-sz-token
    any:
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol
    unless:
      - id: metadata/file/magic/identity::gzip
      - id: metadata/file/metrics::high-entropy-archive

  - id: jvm-runtimeexec-run-key-persistence
    desc: JVM Runtime.exec Run key persistence
    crit: hostile
    conf: 0.98
    for: [class, jar]
    all:
      - id: micro-behaviors/os/registry/keys::jvm-currentversion-run-bytes
      - id: micro-behaviors/os/registry/manipulate::jvm-reg-sz-token
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol
    unless:
      - id: metadata/file/magic/identity::gzip
      - id: metadata/file/metrics::high-entropy-archive
