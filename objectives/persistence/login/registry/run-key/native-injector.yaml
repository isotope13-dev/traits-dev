defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1547.001
composite_rules:
  - id: run-key-section-injector
    desc: Run-key mutation in a section injector
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/registry/autostart/reference::windows-run-key-path
      - id: micro-behaviors/os/registry/value/write::registry-set-value-api
      - id: objectives/execution/payload/process-inject/remote-thread::section-map-thread-context-injector

  - id: run-key-remote-thread-injector
    desc: Unsigned PE writes Run-key persistence with remote-thread injection
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/os/registry/autostart/write::run-path-write-api-references
      - id: micro-behaviors/process/info/current::self-process-or-module-query
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
    unless:
      - id: metadata/installer/product/
    # A stock Electron/Chromium runtime carries the Run-key write and the
    # remote-thread API set in its own code (its sandbox and autostart paths),
    # and unsigned upstream or rebranded builds lack a signature record. Such a
    # shell is not itself an injector: stepping the finding down keeps it
    # reportable while its payload is judged from the app bundle.
    downgrade:
      any:
        - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
