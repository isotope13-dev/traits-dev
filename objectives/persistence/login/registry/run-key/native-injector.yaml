defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1547.001
composite_rules:
  - id: run-key-section-injector
    desc: Run-key mutation in a section injector
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/registry/keys/autostart::windows-run-key-path
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
      - id: objectives/execution/payload/process-inject/remote-thread::section-map-thread-context-injector
