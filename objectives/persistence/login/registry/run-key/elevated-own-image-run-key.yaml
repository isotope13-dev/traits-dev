# Persisting the running image through HKLM Run while explicitly demanding
# elevation with the runas verb is the updater that installs itself: the
# elevation prompt names the operation, but the image persists from
# wherever it currently runs, not from an installed location.
defaults:
  for: [pe]
  platforms: [windows]
  attack: T1547.001
composite_rules:
  - id: elevated-own-image-run-key
    desc: Elevated Run key persists the running image
    crit: suspicious
    conf: 0.8
    all:
      - id: micro-behaviors/os/registry/manipulate::own-image-hklm-run-write-success
      - id: micro-behaviors/os/privilege/elevation::runas-verb-token
      - id: micro-behaviors/os/registry/manipulate::run-key-file-operation-api-profile
