defaults:
  for: [powershell]
  platforms: [windows]
composite_rules:
  - id: compressed-profile-run-key-registration
    desc: Concealed profile with Run-key registration
    crit: hostile
    conf: 0.97
    attack: T1547.001
    all:
      - id: objectives/persistence/login/shell/config::powershell-compressed-profile-persistence
      # The installer generates command strings. Bind the Run key to its
      # setter rather than combining an unrelated property write and a path.
      - id: metadata/lang/source/syntax/command/invocation::powershell-run-key-setter-command-literal
