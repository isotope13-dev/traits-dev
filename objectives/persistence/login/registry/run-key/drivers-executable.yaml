defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: drivers-executable-run-key-copy-profile
    desc: Drivers EXE path with Run-key writer and self-copy APIs
    crit: suspicious
    conf: 0.95
    attack: T1547.001
    all:
      - id: micro-behaviors/fs/path/system/driver::drivers-directory-executable
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path
      - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-a
      - id: micro-behaviors/fs/file/copy/call::copyfile-module-path-api-pair
