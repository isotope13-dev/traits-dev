defaults:
  platforms: [windows]
  for: [pe]
  attack: T1547.001
  mbc: B0028

composite_rules:
  - id: go-self-copy-run-key-persistence
    desc: Go self-copy with registry Run-key persistence
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/symbols/name/qualified::go-main-autorun-name
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
      - id: metadata/lang/source/syntax/member::go-native-exec-command-reference
