defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1547.001

composite_rules:
  - id: gator-run-key-persistence
    desc: Gator installer writes Windows Run key
    crit: hostile
    conf: 0.99
    attack: T1547.001,T1112
    all:
      - id: well-known/unwanted/gator::gator-install-routine-marker
      - id: objectives/persistence/login/registry/autostart::currentversion-run-key-path
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
