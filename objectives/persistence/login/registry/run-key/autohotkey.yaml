# Run-key autostart written from a script that also reconstructs its strings
# from decimal character codes. An installer may register a legitimate
# autostart entry, but it has no reason to build the surrounding strings
# through a character-code decoder; the concealment is what admits the
# hostile persistence claim.
defaults:
  platforms: [windows]
  for: [pe, text]
  attack: T1547.001,T1027

composite_rules:
  - id: autohotkey-charcode-runkey-persistence
    desc: Char-code decoder writes Run-key autostart
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/registry/keys/autostart::autohotkey-regwrite-run-key
      - id: micro-behaviors/data/decode/char-code::autohotkey-charcode-decode-loop
