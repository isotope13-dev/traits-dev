defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1547.001
  mbc: B0022

composite_rules:
  - id: powershell-appdata-run-key-persistence
    desc: PowerShell persists an AppData executable through an HKCU Run key
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/os/registry/write/property::powershell-registry-property-cmd
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
    near_lines: 20
