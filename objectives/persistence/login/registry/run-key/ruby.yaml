defaults:
  platforms: [windows]
  for: [ruby]
  attack: T1547.001

composite_rules:
  - id: ruby-reg-add-run-key-persistence
    desc: Ruby writes Registry Run key
    crit: hostile
    conf: 0.98
    unless:
      - id: metadata/package/testing/presence/path::benign-testdata-directory-path
    all:
      - id: micro-behaviors/process/create/system::system-process-call
    any:
      - id: micro-behaviors/os/registry/write::ruby-system-run-key-command
      - id: micro-behaviors/os/registry/write::ruby-system-run-key-argv
  - id: ruby-packaged-exe-run-key-install
    desc: Copies itself and writes a Run key
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: ruby-copy-packaged-exe
traits:
  - id: ruby-copy-packaged-exe
    desc: Copies its packaged executable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bfcopy\(\s*RUBYSCRIPT2EXE_APPEXE\b'
