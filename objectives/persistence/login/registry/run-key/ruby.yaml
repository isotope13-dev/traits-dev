defaults:
  platforms: [windows]
  for: [ruby]
  attack: T1547.001

composite_rules:
  - id: ruby-reg-add-run-key-persistence
    desc: Ruby writes Registry Run key
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/system::system-process-call
    any:
      - id: micro-behaviors/os/registry/write/run-key::ruby-system-run-key-command
      - id: micro-behaviors/os/registry/write/run-key::ruby-system-run-key-argv
