defaults:
  platforms: [windows]
  for: [html, vbs, javascript]
  attack: T1547.001
composite_rules:
  - id: locked-browser-homepage-autorun
    desc: Autoruns IE at an HTTP URL while locking the rewritten homepage
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/registry/write::regwrite-browser-run-url
      - id: micro-behaviors/os/registry/write::regwrite-ie-start-page
      - id: micro-behaviors/os/registry/write::regwrite-lock-ie-homepage
      - id: micro-behaviors/os/registry/write::regwrite-disable-registry-tools
