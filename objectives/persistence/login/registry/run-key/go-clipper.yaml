defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: go-clipboard-clipper-run-key-installer
  desc: Crypto clipper with Run-key installer
  crit: hostile
  conf: 0.98
  attack: T1547.001
  all:
  - id: objectives/impact/crypto-manipulation/clipboard::go-ethereum-clipboard-overwrite
  - id: metadata/binary/symbols/name::go-main-autorun-name
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
  - id: metadata/binary/symbols/name::go-registry-persistence-installer-name
  - id: metadata/binary/instruction/sequence::x64-hkcu-hklm-write-access-arguments
  # Obfuscated-name variant of the sibling installer composite: the swap
  # composite already establishes the clipper, so persistence needs only the
  # Run key, the HKCU/HKLM write arguments, and the registry package path.
- id: go-ethereum-clipper-run-key-routine
  desc: Clipper includes a Run-key installer routine
  crit: suspicious
  conf: 0.98
  attack: T1115,T1547.001
  all:
  - id: objectives/impact/crypto-manipulation/clipboard::go-ethereum-clipboard-swap
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
  - id: metadata/binary/instruction/sequence::x64-hkcu-hklm-write-access-arguments
  - id: micro-behaviors/os/registry/access::go-registry-package-path-reference
