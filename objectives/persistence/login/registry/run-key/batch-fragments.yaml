defaults:
  platforms: [windows]
  for: [batch]
  attack: T1547.001
composite_rules:
  - id: batch-fragmented-autostart-command
    desc: Short command fragments accompany Run-key path
    crit: suspicious
    conf: 0.93
    near_lines: 12
    all:
      - id: objectives/anti-static/obfuscation/string/concat::batch-short-set-fragments
      - id: objectives/anti-static/obfuscation/string/concat::batch-adjacent-expansion-chain
      - id: micro-behaviors/os/registry/autostart/reference::windows-run-key-path
