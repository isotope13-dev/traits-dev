defaults:
  platforms: [windows]
  for: [pyc]

composite_rules:
  - id: ransomware-run-key-persistence
    desc: Python ransomware writes Windows Run-key persistence
    crit: hostile
    conf: 0.99
    attack: T1547.001,T1112,T1486
    all:
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
      - id: micro-behaviors/os/registry/access::python-bytecode-winreg-value-write
      - id: metadata/binary/code/bytecode::python-bytecode-recursive-encrypt-helper
      - id: metadata/binary/code/bytecode::python-bytecode-encrypt-file-helper
      - id: objectives/impact/ransom/encrypt/bytecode::readme-decrypt-note
    any:
      - id: objectives/impact/ransom/encrypt/bytecode::cryptor-extension
      - id: objectives/impact/ransom/encrypt/bytecode::enc-extension
