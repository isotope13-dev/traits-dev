defaults:
  platforms: [windows]
  for: [pe, dll]


composite_rules:
  - id: sslip-runkey-service-reference-clues
    desc: SSLIP, Run-key and service-reference clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/url/host/domain-http::sslip-io-ip-hostname
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path"
      - id: micro-behaviors/os/service/create::create-service-w-reference
    unless:
      - id: metadata/installer/product/
