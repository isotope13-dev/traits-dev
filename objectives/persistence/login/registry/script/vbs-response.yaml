defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1547.001,T1105
composite_rules:
  - id: vbs-response-save-run-key
    desc: Saves HTTP response near AppData executable Run-key registration
    crit: hostile
    conf: 0.96
    near_bytes: 1800
    all:
      - id: micro-behaviors/fs/write/stream::vbs-write-http-response-body
      - id: micro-behaviors/fs/write/stream::wsh-savetofile
      - id: micro-behaviors/os/registry/value/write::wscript-regwrite
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
