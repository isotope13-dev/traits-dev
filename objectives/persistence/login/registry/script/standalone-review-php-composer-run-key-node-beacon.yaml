defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1552.001,T1041
composite_rules:
  - id: composer-runkey-node-http-persistence
    desc: Composer Run-key and Node HTTP context
    crit: hostile
    conf: 0.99
    for: [php, zip]
    scope: archive
    all:
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
      - id: micro-behaviors/os/registry/command::php-reg-variable-command
      - id: micro-behaviors/communications/http/client/reference::embedded-node-https-get-with-timeout
      - id: micro-behaviors/os/application/target/development::node-executable-name-reference
