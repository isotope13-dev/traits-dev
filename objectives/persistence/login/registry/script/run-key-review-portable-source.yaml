defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
  attack: T1547.001

composite_rules:
  - id: run-key-node-beacon-persistence
    desc: Run-key registration with Node HTTP context
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/registry/value/write::reg-exe-add-command
      - id: micro-behaviors/communications/http/client/reference::embedded-node-https-get-with-timeout
      - id: micro-behaviors/os/application/target/development::node-executable-name-reference
    # Go raw strings are covered by a separate atom because the generic
    # source matcher normalizes backslashes differently for that parser.
    any:
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
      - id: "micro-behaviors/os/registry/autostart/reference::windows-run-key-path"

  - id: perl-run-key-node-beacon
    desc: Run-key registration with Node HTTP context
    crit: hostile
    conf: 0.99
    for: [perl, tar]
    scope: archive
    all:
      - id: micro-behaviors/os/registry/autostart/reference::perl-currentversion-run-text
      - id: micro-behaviors/communications/http/client/reference::embedded-node-https-get-with-timeout
      - id: micro-behaviors/os/application/target/development::node-executable-name-reference
      - id: micro-behaviors/process/create/exec::system-process-call
    any:
      - id: micro-behaviors/os/registry/value/write::reg-exe-add-command
      - id: micro-behaviors/os/registry/value/write::structured-reg-add-command
      - id: micro-behaviors/os/registry/permission::perl-registry-key-write
  - id: elixir-run-key-node-beacon
    desc: Run-key registration with Node HTTP context
    crit: hostile
    conf: 0.99
    for: [elixir, tar]
    scope: archive
    all:
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
      - id: micro-behaviors/os/registry/value/write::structured-reg-add-command
      - id: micro-behaviors/communications/http/client/reference::embedded-node-https-get-with-timeout
      - id: micro-behaviors/os/application/target/development::node-executable-name-reference
      - id: micro-behaviors/process/create/exec::elixir-system-cmd

  - id: kotlin-run-key-node-beacon
    desc: Run-key registration with Node HTTP context
    crit: hostile
    conf: 0.99
    for: [kotlin, jar]
    scope: archive
    all:
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
      - id: micro-behaviors/os/registry/value/write::structured-reg-add-command
      - id: micro-behaviors/communications/http/client/reference::embedded-node-https-get-with-timeout
      - id: micro-behaviors/os/application/target/development::node-executable-name-reference
      - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-source

  - id: typescript-run-key-node-beacon
    desc: Run-key registration with Node HTTP context
    crit: hostile
    conf: 0.99
    for: [typescript, npm]
    scope: archive
    all:
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
      - id: micro-behaviors/os/registry/value/write::structured-reg-add-command
      - id: micro-behaviors/communications/http/client/reference::embedded-node-https-get-with-timeout
      - id: micro-behaviors/os/application/target/development::node-executable-name-reference
      - id: micro-behaviors/process/create/exec::js-execfile-call

  - id: csharp-run-key-node-beacon
    desc: Run-key registration with Node HTTP context
    crit: hostile
    conf: 0.99
    for: [csharp, nupkg]
    scope: archive
    all:
      - id: micro-behaviors/os/registry/value/write::registry-setvalue-executable
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path"
      - id: micro-behaviors/communications/http/client/reference::embedded-node-https-get-with-timeout
