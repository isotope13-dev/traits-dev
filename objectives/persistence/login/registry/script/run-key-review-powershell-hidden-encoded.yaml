defaults:
  for: [powershell]
  platforms: [windows]
composite_rules:
  - id: powershell-run-key-hidden-encoded-command
    desc: Registry Run key installs a hidden encoded PowerShell launcher
    crit: hostile
    conf: 0.97
    attack: T1547.001
    all:
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
      - id: micro-behaviors/data/property/write::powershell-provider-property-command-text
      - id: micro-behaviors/process/create/hidden::hidden-encoded-variable-command
    near_lines: 2
