defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, typescript, vbs, html]
  attack: T1105
  mbc: B0024


composite_rules:
  - id: node-run-key-script-host-command
    desc: Node command execution with Run-key and script-host clues
    crit: hostile
    conf: 0.99
    attack: T1059.005,T1059.007,T1547.001
    for: [javascript, typescript]
    near_bytes: 900
    all:
      - id: objectives/persistence/login/registry/script::node-run-key-temp-script-host-clues
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
