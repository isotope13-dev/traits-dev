# A .reg script whose Run value starts PowerShell on an encoded command that
# PowerShell first reads back out of another registry value. The autostart
# entry holds no payload of its own: the code lives in the registry and is
# only reassembled at logon, a fileless persistence shape. Installers that
# register PowerShell at logon point at a script file, not a registry blob.
defaults:
  platforms: [windows]
  for: [reg]
  attack: T1547.001,T1112,T1059.001

traits:
  - id: reg-run-value-encoded-powershell-variable
    desc: Reg value runs PowerShell on encoded variable
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)"="powershell(\.exe)?\s[^"\r\n]{0,240}-e(nc|ncodedcommand)?\s+\$\w'
  - id: reg-value-powershell-registry-property-read
    desc: Reg value data reads a registry property
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)"="powershell[^"\r\n]{0,80}Get-ItemProperty\s+(-Path\s+)?HK(CU|LM):'

composite_rules:
  - id: reg-run-registry-resident-encoded-powershell
    desc: Run value rebuilds PowerShell from registry data
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/file/format/structured::reg-script-header-and-key-section
      - id: micro-behaviors/os/registry/autostart/reference::windows-run-key-path
      - id: reg-run-value-encoded-powershell-variable
      - id: reg-value-powershell-registry-property-read
