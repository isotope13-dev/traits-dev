defaults:
  platforms: [windows]
  for: [reg]
  attack: T1547.001,T1112,T1036

traits:
  - id: reg-delete-user-run-key
    desc: Registry deletes current user Run key
    crit: notable
    if:
      type: text
      regex: '(?im)^\[-HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\]'
  - id: regedit-silent-certificate-path
    desc: Registry imports certificate-named file
    crit: notable
    if:
      type: text
      regex: '(?im)regedit\s+-s\s+[^"\r\n]{1,180}\.cer\b'
  - id: registry-browser-start-page
    desc: Registry sets a browser start page
    crit: notable
    if:
      type: text
      regex: '(?i)"Start Page"\s*=\s*"https?://'

composite_rules:
  - id: registry-autostart-cert-camouflage-and-redirect
    desc: Registry replaces autostarts and stages disguised import
    crit: hostile
    conf: 0.97
    all:
      - id: reg-delete-user-run-key
      - id: regedit-silent-certificate-path
      - id: registry-browser-start-page
      - id: micro-behaviors/os/registry/autostart/reference::windows-run-key-path
