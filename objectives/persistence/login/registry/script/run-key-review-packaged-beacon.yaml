defaults:
  platforms:
    - windows
  crit: hostile
  conf: 0.98
  attack: T1547.001
composite_rules:
  - id: packaged-source-run-key-node-beacon
    desc: Run-key registration with Node HTTP context
    for:
      - ruby
      - gem
      - powershell
      - zip
    scope: archive
    all:
      - id: micro-behaviors/communications/http/client/reference::embedded-node-https-get-with-timeout
      - id: micro-behaviors/os/application/target/development::node-executable-name-reference
      - id: micro-behaviors/fs/write/file/unspecified::file-write-operation-or-reference
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run
    any:
      - id: micro-behaviors/os/registry/autostart/write::ruby-system-run-key-command
      - id: micro-behaviors/os/registry/autostart/write::ruby-system-run-key-argv
      - id: micro-behaviors/os/registry/autostart/write::powershell-reg-add-run-key
      - id: micro-behaviors/os/registry/autostart/write::powershell-literal-run-key-property
      - id: micro-behaviors/os/registry/autostart/write::powershell-assigned-run-key-property
  - id: jvm-bytecode-run-key-node-beacon
    desc: Run-key registration with Node HTTP context
    for:
      - class
      - jar
    scope: archive
    all:
      - id: micro-behaviors/communications/http/client/reference::embedded-node-https-get-with-timeout
      - id: micro-behaviors/os/application/target/development::node-executable-name-bytecode
      - id: micro-behaviors/fs/write/file/unspecified::jvm-files-write-bytecode
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run
      - id: metadata/binary/code/bytecode::jvm-reg-command-argument
      - id: metadata/binary/code/bytecode::jvm-add-command-argument
      - id: micro-behaviors/os/registry/value-type::jvm-reg-sz-token
      - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-bytecode
