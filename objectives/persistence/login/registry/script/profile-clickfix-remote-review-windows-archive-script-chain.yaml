defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, typescript, vbs, html]


composite_rules:
  - id: node-run-key-temp-script-host-clues
    desc: Run-key and temporary script-host clues
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    near_bytes: 700
    all:
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
      - id: micro-behaviors/process/interpreter/scripting::temp-script-host-path
