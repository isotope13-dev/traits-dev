# Huntress observed a Global Administrator grant and new credentials on
# other applications. No mailbox/file collection was confirmed. Detect that
# privilege/credential combination without assuming exfiltration, self-grant,
# a particular vendor identity, or malicious intent for routine secret rotation.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]

composite_rules:
  - id: entra-privileged-role-credential-add
    desc: Adds Entra credentials alongside Global Administrator grant
    crit: suspicious
    conf: 0.94
    attack: T1098.001
    all:
      - id: micro-behaviors/os/security/auth/rbac::entra-global-admin-role-grant
      - id: micro-behaviors/communications/http/services/microsoft::graph-identity-credential-add
    near_bytes: 4096
    scope: leaf
