# OAuth persistence in an unmanaged or otherwise unmonitored cloud tenant.
# The provider-neutral shape is application registration, delegated permission
# grant, and a token flow that survives a password reset through offline access.
defaults:
  platforms: [unix, windows]
  for: [scripts, html, binaries]

traits:
  - id: graph-applications-endpoint
    desc: Calls the Graph applications endpoint
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)graph\.microsoft\.com.{0,80}/applications\b'

  - id: oauth-permission-grant-endpoint
    desc: Calls an OAuth permission-grant endpoint
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: /oauth2PermissionGrants

  - id: oauth-registration-wording
    desc: References OAuth application registration
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)register.{0,50}oauth application'

  - id: delegated-permission-field
    desc: References delegated OAuth permissions
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(delegatedPermissions?|requiredResourceAccess)'

  - id: all-principals-consent
    desc: Grants consent to all tenant principals
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)consentType.{0,70}AllPrincipals'

  - id: mailbox-scope-grant
    desc: Requests a mailbox OAuth scope
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Mail.Read

composite_rules:
  - id: cloud-oauth-application-registration-api
    desc: Calls a cloud OAuth registration API
    crit: notable
    conf: 0.92
    any:
      - id: graph-applications-endpoint
      - id: oauth-permission-grant-endpoint
      - id: oauth-registration-wording

  - id: cloud-oauth-delegated-permission-grant
    desc: Grants delegated OAuth permissions to an app
    crit: notable
    conf: 0.92
    any:
      - id: oauth-permission-grant-endpoint
      - id: delegated-permission-field
      - id: all-principals-consent
      - id: micro-behaviors/communications/http/oauth::oauth-offline-access-scope
      - id: mailbox-scope-grant

  - id: cloud-oauth-application-registration
    desc: Registers a cloud OAuth application
    crit: suspicious
    conf: 0.95
    all:
      - id: cloud-oauth-application-registration-api
      - id: micro-behaviors/communications/http/oauth::oauth-office365

  - id: cloud-oauth-delegated-persistent-consent
    desc: Cloud OAuth app receives persistent consent
    crit: suspicious
    conf: 0.97
    all:
      - id: cloud-oauth-application-registration
      - id: cloud-oauth-delegated-permission-grant
    any:
      - id: micro-behaviors/communications/http/oauth::refresh-token
      - id: micro-behaviors/communications/http/oauth::oauth-offline-access-url
      - id: micro-behaviors/communications/http/oauth::oauth-consent-prompt-parameter
