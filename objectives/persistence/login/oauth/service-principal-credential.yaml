# Backdoor persistence by stamping a credential onto an Entra identity.
#
# After compromising a session, the operator adds a new secret or certificate
# to a service principal or app registration (`addPassword` / `addKey`, or the
# equivalent PowerShell-SDK / AzureAD cmdlets).  The planted credential lets the
# attacker re-authenticate as that non-human identity even after the original
# token is revoked or the user's password is reset (ATT&CK T1098.001).
#
# Rotating an app secret is a normal admin action, so the credential-addition
# capability alone is only notable.  Paired with the tenant enumeration that
# precedes an identity-plane pivot, it is the backdoor step of the attack chain.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1098.001

composite_rules:
  - id: entra-service-principal-backdoor
    desc: Backdoor credential planted after Entra directory recon
    crit: hostile
    conf: 0.95
    attack: T1098.001,T1087.004
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-identity-credential-add
      - id: objectives/discovery/cloud/directory::entra-directory-enumeration
    scope: leaf
