# Backdoor persistence by stamping a credential onto an Entra identity.
#
# After compromising a session, the operator adds a new secret or certificate
# to a service principal or app registration (`addPassword` / `addKey`, or the
# equivalent PowerShell-SDK / AzureAD cmdlets).  The planted credential lets the
# attacker re-authenticate as that non-human identity even after the original
# token is revoked or the user's password is reset (ATT&CK T1098.001).
#
# Rotating an app secret is a normal admin action, so the credential-addition
# capability alone is only notable.  Paired with the tenant enumeration that
# precedes an identity-plane pivot, it is the backdoor step of the attack chain.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1098.001

composite_rules:
  - id: entra-service-principal-backdoor
    desc: Backdoor credential planted after Entra directory recon
    crit: hostile
    conf: 0.95
    attack: T1098.001,T1087.004
    all:
    - id: micro-behaviors/os/security/auth/cloud::graph-identity-credential-add-reference
    - id: objectives/discovery/cloud/directory::entra-directory-enumeration
    scope: leaf
    unless:
    - id: well-known/app/infrastructure/azure-cli::azure-cli-context
    - id: well-known/app/infrastructure/azure-cli::azure-cli-source-tree
    - id: "metadata/file/naming::test-directory-component"
    - id: metadata/file/profile/markup::assessment-playbook-examples
  # Granting Global Admin and adding a credential can be provisioning.
  # Writing the addPassword response to stdout is the operator collecting
  # the new secretText.
  - id: entra-grant-prints-planted-credential
    desc: Prints secret after Global Admin grant
    crit: suspicious
    conf: 0.94
    for: [python, javascript, typescript, powershell, php, ruby, csharp, go]
    all:
    - id: micro-behaviors/os/security/auth/rbac::entra-global-admin-role-grant
    - id: micro-behaviors/os/security/auth/cloud::graph-identity-credential-add-reference
    # secretText field prints are already covered as notable response
    # evidence. This leg is the client that writes the raw addPassword
    # body, which is how the C# and Go callers surface the new secret.
    any:
    - id: micro-behaviors/os/console/io::prints-http-response-body
    - id: micro-behaviors/os/console/io::go-prints-read-http-body
    needs: 1
    near_bytes: 2400
    scope: leaf
