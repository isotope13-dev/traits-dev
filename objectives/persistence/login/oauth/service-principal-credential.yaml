# Backdoor persistence by stamping a credential onto an Entra identity.
#
# After compromising a session, the operator adds a new secret or certificate
# to a service principal or app registration (`addPassword` / `addKey`, or the
# equivalent PowerShell-SDK / AzureAD cmdlets).  The planted credential lets the
# attacker re-authenticate as that non-human identity even after the original
# token is revoked or the user's password is reset (ATT&CK T1098.001).
#
# Rotating an app secret and enumerating a tenant are also normal admin
# actions; their combination warrants review but does not prove a backdoor.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1098.001

composite_rules:
  # The two writes establish a privilege/credential-change cluster. Static
  # co-location does not prove self-assignment, the same token, execution order,
  # or unauthorized persistence. Authorized provisioning remains plausible.
  - id: entra-admin-grant-with-credential-creation
    desc: Entra admin grant near credential creation
    crit: suspicious
    conf: 0.94
    for: [scripts, source]
    attack: T1098.001,T1098.003
    all:
      - id: micro-behaviors/os/security/auth/rbac::entra-privileged-admin-role-grant
      - id: micro-behaviors/os/security/auth/cloud::graph-identity-credential-create
    near_bytes: 2400
    scope: leaf

  - id: entra-service-principal-backdoor
    desc: Entra credential API with directory enumeration
    crit: suspicious
    conf: 0.95
    attack: T1098.001,T1087.004
    all:
    - id: micro-behaviors/os/security/auth/cloud::graph-identity-credential-add-reference
    - id: objectives/discovery/cloud/directory::entra-directory-enumeration
    scope: leaf
  # Granting Global Admin and adding a credential can be provisioning.
  # A nearby response print is useful triage context. Proximity does not
  # prove it is the credential response or that a secret was collected.
  - id: entra-grant-with-response-print
    desc: Admin grant, credential API and response print
    crit: suspicious
    conf: 0.94
    for: [python, javascript, typescript, powershell, php, ruby, csharp, go]
    all:
    - id: micro-behaviors/os/security/auth/rbac::entra-privileged-admin-role-grant
    - id: micro-behaviors/os/security/auth/cloud::graph-identity-credential-add-reference
    # These legs observe an HTTP response body being printed. They do not
    # bind that response to the credential action.
    any:
    - id: micro-behaviors/os/console/io::prints-http-response-body
    - id: micro-behaviors/os/console/io::prints-script-http-response-body
    - id: micro-behaviors/os/console/io::go-prints-read-http-body
    needs: 1
    near_bytes: 2400
    scope: leaf
  # Attempting both certificate (addKey) and client-secret (addPassword)
  # credential creation alongside a privileged administrator role grant reflects
  # multi-mechanism application credential persistence rather than single-secret
  # rotation.
  - id: entra-grant-key-and-password-credential
    desc: Key and password creation near admin role grant
    crit: suspicious
    conf: 0.94
    for: [scripts, source]
    all:
    - id: micro-behaviors/os/security/auth/rbac::entra-privileged-admin-role-grant
    - id: micro-behaviors/os/security/auth/cloud::graph-identity-key-credential-create
    - id: micro-behaviors/os/security/auth/cloud::graph-identity-password-credential-create
    near_bytes: 2400
    scope: leaf
