# Bulk replay plus DRS redemption and an actual registration POST request.
# This detects attempted retained access, not successful tenant/device join.
defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - typescript
  - powershell
composite_rules:
- id: replayed-token-device-registration
  desc: Bulk token replay with device-registration POST
  crit: hostile
  conf: 0.97
  attack: T1098.005,T1550.001
  all:
  - id: objectives/credential-access/cloud/token/oauth::bulk-first-party-refresh-token-replay
  - id: objectives/credential-access/cloud/token/oauth::device-registration-refresh-token-redemption
  any:
  - id: micro-behaviors/communications/http/post::python-device-enrollment-post
  - id: micro-behaviors/communications/http/post::fetch-graph-device-registration-post
  - id: micro-behaviors/communications/http/post::powershell-device-enrollment-post
  near_bytes: 8192
