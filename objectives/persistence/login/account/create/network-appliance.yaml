defaults:
  platforms: [appliance]
  for: [javascript, typescript, text, python, pyc, go]
  attack: T1136
  mbc: OB0007

traits:
  - id: fortios-super-admin
    desc: super_admin near FortiOS admin API
    crit: notable
    conf: 0.9
    platforms: [fortios]
    if:
      type: text
      regex: '(/cmdb/system/admin[\s\S]{0,1000}super_admin|super_admin[\s\S]{0,1000}/cmdb/system/admin)'
  - id: routeros-go-user-add-call
    desc: Go RouterOS user add call
    crit: suspicious
    conf: 0.94
    platforms: [routeros]
    for: [go]
    if:
      type: text
      regex: 'RunSynt\([\s\S]{0,260}resolveCmd\("add"\)'
  - id: routeros-go-full-group-arg
    desc: Go RouterOS full group arg
    crit: suspicious
    conf: 0.94
    platforms: [routeros]
    for: [go]
    if:
      type: text
      regex: 'argEq\(resolveCmd\("group"\),\s*"full"\)'
  - id: routeros-go-password-arg
    desc: Go RouterOS password arg
    crit: suspicious
    conf: 0.94
    platforms: [routeros]
    for: [go]
    if:
      type: text
      substr: 'argRaw(resolveCmd("password")'

composite_rules:
  - id: netscaler-superuser-account-backdoor
    desc: Superuser creation alongside PHP webshell
    crit: hostile
    conf: 0.99
    platforms: [appliance, unix]
    for: [perl, shell, python]
    all:
      - id: micro-behaviors/os/user/account::netscaler-bind-superuser
      - id: micro-behaviors/os/user/account::netscaler-add-system-user
      - id: objectives/command-and-control/backdoor/webshell/embedded::embedded-php-request-command

  - id: fortios-super-admin-account
    for: [python, javascript, go]
    desc: FortiOS super-admin account creation
    crit: hostile
    conf: 0.98
    platforms: [fortios]
    all:
      - id: micro-behaviors/communications/http/services/fortios::admin-api-path
      - id: fortios-super-admin
      - id: micro-behaviors/data/format/credentials::password-field-source-value
  - id: fortinet-unrestricted-admin-account-create
    for: [python]
    desc: FortiWeb bypass with unrestricted admin creation
    crit: hostile
    conf: 0.99
    platforms: [fortios, unix, windows]
    all:
      - id: objectives/execution/exploit/network-service/service-api-abuse::fortiweb-cgiinfo-traversal-bypass
      - id: micro-behaviors/communications/http/services/fortios::admin-api-path
      - id: micro-behaviors/os/user/account::fortinet-privileged-admin-profile
      - id: micro-behaviors/os/user/account::fortinet-unrestricted-trusthost-field
      - id: micro-behaviors/communications/http/post::session-post-call
    any:
      - id: micro-behaviors/data/format/credentials::password-field-source-value
      - id: "metadata/lang/source/syntax/key-value::password-field-name"
  - id: routeros-go-full-admin-account
    desc: Go RouterOS full admin account
    crit: hostile
    conf: 0.98
    platforms: [routeros]
    for: [go]
    all:
      - id: routeros-go-user-add-call
      - id: routeros-go-full-group-arg
      - id: routeros-go-password-arg
  - id: dahua-go-admin-account-backdoor
    desc: Dahua rogue administrator account creation with auth bypass
    crit: hostile
    conf: 0.98
    platforms: [unix, windows]
    for: [go]
    attack: T1136.001
    all:
      - id: micro-behaviors/os/user/account::dahua-admin-user-add
    any:
      - id: objectives/lateral-movement/exploit/network-device/auth-bypass::dahua-go-loopback-auth-bypass
      - id: objectives/lateral-movement/exploit/network-device/auth-bypass::dahua-go-netkeyboard-auth-bypass
