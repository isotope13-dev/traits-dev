# Unsigned Windows tools that provision a hidden local administrator via
# `net user` / `net localgroup` and also install keyboard or GDI input
# surveillance are hacktools (Flystudio-class), not fleet installers.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: net-admin-account-input-surveillance-tool
    desc: Net admin user plus input surveillance hooks
    crit: hostile
    conf: 0.98
    attack: T1136.001,T1056.001,T1113
    all:
      - id: micro-behaviors/os/user/account::net-administrator-account-provisioning
    any:
      - id: objectives/collection/keylog/hook::keyboard-hook-form-header
      - id: objectives/collection/screenshot::gdi-input-hook-surveillance
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
