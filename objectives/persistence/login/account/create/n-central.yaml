# A second durable outcome of the N-central access-control bypass is creation
# of a privileged account made to resemble a trusted support identity.  The
# observed mutation appended the RFC-reserved `.invalid` suffix to an existing
# email address.  Pairing that syntax with the N-central probe, administrator
# role assignment, and an HTTP mutation separates the attack from dummy email
# addresses in fixtures and documentation.
defaults:
  platforms: [windows, unix, appliance]
  for: [scripts, source]
  attack: T1136.001,T1098

composite_rules:
  - id: ncentral-deceptive-admin-account-creation
    desc: N-central client creates deceptive administrator account
    crit: hostile
    conf: 0.98
    all:
      - id: well-known/dual-use/remote-admin/n-central::get-pier-details-request
      - id: micro-behaviors/os/user/account::email-appended-invalid-suffix
      - id: micro-behaviors/os/user/account::administrator-role-field
    any:
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/communications/http/curl::curl-post-flag
      - id: micro-behaviors/communications/http/post/
    needs: 1
