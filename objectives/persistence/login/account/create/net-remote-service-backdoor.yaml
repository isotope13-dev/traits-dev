# Unsigned Windows binaries that provision a local administrator via
# `net user` / `net localgroup` (or the `net1` evasion spelling, the on-disk
# implementation behind `net.exe`) and also enable remote access through the
# Terminal Services service are remote-access backdoors, not fleet installers.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: net-admin-account-remote-service-backdoor
    desc: Net admin account with remote service enablement
    crit: hostile
    conf: 0.97
    attack: "T1136.001,T1021.001"
    all:
      - id: micro-behaviors/os/user/account::net-administrator-account-provisioning
    any:
      - id: "micro-behaviors/os/registry/keys/service::system-services-registry-path"
      - id: "micro-behaviors/os/registry/keys/autostart::winlogon-registry-path"
      - id: micro-behaviors/os/service/host::svchost-netsvcs-group-name
      - id: micro-behaviors/os/service/configure::change-service-config
      - id: micro-behaviors/os/service/control::open-sc-manager
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: net-admin-promotion-telnet-backdoor
    desc: Net admin promotion with Telnet service start
    crit: hostile
    conf: 0.96
    attack: "T1098,T1021.004"
    # No account has to be created: promoting an existing one (the built-in
    # helpassistant, say) and opening Telnet is the same remote-access setup.
    all:
      - id: micro-behaviors/os/group/membership::net-localgroup-administrators-add-text
      - id: micro-behaviors/os/service/start::net-start-telnet-service
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
