defaults:
  platforms: [unix, windows]
  for: [scripts, source]

composite_rules:
  # A normal authenticated user-management client is insufficient. Require
  # construction of an authentication-bypass payload in the same file.
  - id: dahua-auth-bypass-rpc-account-creation
    desc: Dahua auth bypass with RPC account creation
    crit: hostile
    conf: 0.98
    attack: T1136.001
    all:
      - id: micro-behaviors/os/user/account::dahua-rpc-add-user-method
    any:
      - id: objectives/lateral-movement/exploit/network-device/auth-bypass::dahua-netkeyboard-auth-bypass
      - id: objectives/lateral-movement/exploit/network-device/auth-bypass::dahua-loopback-auth-bypass
