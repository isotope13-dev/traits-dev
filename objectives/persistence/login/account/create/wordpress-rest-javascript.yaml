# Rogue WordPress administrator creation from client-side JavaScript.
#
# Injected CDN/skimmer payloads (e.g. the OptinMonster supply-chain attack,
# Sansec 2026) silently mint an attacker-controlled administrator by POSTing
# to the WordPress REST users endpoint with the harvested admin nonce. A
# browser script that hits `/wp-json/wp/v2/users` and assigns the
# `administrator` role is account takeover — legitimate WordPress UIs create
# users server-side through wp-admin forms, never by hardcoding the role next
# to the REST endpoint in a delivered script.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1136.001
  mbc: F0011

traits:
  - id: hostname-hash-conversion
    desc: Converts hostname to hash form
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)(hostname|location\.host).{0,120}(toString\s*\(\s*36\s*\)|hash\s*\(|digest\s*\()'

  - id: account-field-assignment
    desc: Assigns account credential field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\b(username|user_login|password)\s*:'

  - id: wp-admin-user-new-form-endpoint
    desc: WordPress new-user admin form endpoint
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)/wp-admin/user-new\.php\b'

  - id: wp-create-user-form-action
    desc: WordPress user-creation form action
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)(^|[&?"''])action=createuser([&"'']|$)'

  - id: wp-form-administrator-role
    desc: WordPress user form assigns administrator role
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '(?i)(^|[&?])role=administrator([&"'']|$)'

composite_rules:
  - id: hostname-derived-credential-fields
    desc: Hostname-derived credentials
    crit: component
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/url/path::browser-location-host-read
      - id: hostname-hash-conversion
      - id: account-field-assignment
    near_bytes: 1800

  - id: js-wordpress-rogue-admin-create
    desc: Hardcoded WordPress administrator created via REST
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/request/wordpress::rest-users-endpoint-url
      - id: micro-behaviors/os/user/account::administrator-role-field
      - id: micro-behaviors/os/user/account::hardcoded-account-credential-triplet
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    near_bytes: 1200

  - id: js-wordpress-rogue-admin-create-form
    desc: Client JS submits WordPress user form for an administrator account
    crit: hostile
    conf: 0.97
    attack: T1136.001,T1098
    all:
      - id: wp-admin-user-new-form-endpoint
      - id: wp-create-user-form-action
      - id: wp-form-administrator-role
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    near_bytes: 1800

  - id: js-wordpress-hostname-derived-admin-create
    desc: Hostname-derived WordPress admin creation
    crit: hostile
    conf: 0.99
    attack: T1136.001,T1098
    all:
      - id: micro-behaviors/communications/http/request/wordpress::rest-users-endpoint-url
      - id: micro-behaviors/os/user/account::administrator-role-field
      - id: hostname-derived-credential-fields
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    near_bytes: 3500
