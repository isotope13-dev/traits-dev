# Rogue WordPress administrator creation from client-side JavaScript.
#
# Injected CDN/skimmer payloads (e.g. the OptinMonster supply-chain attack,
# Sansec 2026) silently mint an attacker-controlled administrator by POSTing
# to the WordPress REST users endpoint with the harvested admin nonce. A
# browser script that hits `/wp-json/wp/v2/users` and assigns the
# `administrator` role is account takeover — legitimate WordPress UIs create
# users server-side through wp-admin forms, never by hardcoding the role next
# to the REST endpoint in a delivered script.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1136.001
  mbc: F0011

traits:
  - id: account-field-assignment
    desc: Assigns account credential field
    # Username/password object keys also occur in HTTP-client Basic-auth
    # adapters and ordinary application forms. The WordPress takeover
    # composites provide the meaningful classification.
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\b(username|user_login|password)\s*:'

  - id: wp-admin-user-new-form-endpoint
    desc: WordPress new-user admin form endpoint
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)/wp-admin/user-new\.php\b'

  - id: wp-create-user-form-action
    desc: WordPress user-creation form action
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(^|[&?"''])action=createuser([&"'']|$)'

  - id: wp-form-administrator-role
    desc: WordPress user form assigns administrator role
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)(^|[&?])role=administrator([&"'']|$)'

  # Session-riding implants (the x.js class) drive wp-admin through the
  # victim's browser session with FormData posts rather than query
  # strings: user_login/role appends mint the rogue account while
  # pluginzip appends stage the backdoor plugin.
  - id: wp-formdata-user-login-append
    desc: Form data appends WordPress username
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\.append\s*\(\s*["'']user_login["'']\s*,'
  - id: wp-formdata-administrator-role-append
    desc: Form data assigns administrator role
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\.append\s*\(\s*["'']role["'']\s*,\s*["'']administrator["'']'

composite_rules:
  - id: hostname-derived-credential-fields
    desc: Hostname-derived credentials
    crit: component
    conf: 0.95
    all:
      - id: micro-behaviors/communications/url/navigation-http::browser-location-host-read
      - id: micro-behaviors/crypto/hash/digest/unnamed-algorithm::hostname-hash-conversion
      - id: account-field-assignment
    near_bytes: 1800

  - id: js-wordpress-rogue-admin-create
    desc: Hardcoded WordPress administrator created via REST
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/request/wordpress::rest-users-endpoint-url
      - id: micro-behaviors/os/user/account::administrator-role-field
      - id: micro-behaviors/os/user/account::hardcoded-account-credential-triplet
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    near_bytes: 1200

  - id: js-wordpress-rogue-admin-create-form
    desc: Client JS submits WordPress user form for an administrator account
    crit: hostile
    conf: 0.97
    attack: T1136.001,T1098
    all:
      - id: wp-admin-user-new-form-endpoint
      - id: wp-create-user-form-action
      - id: wp-form-administrator-role
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    near_bytes: 1800

  - id: js-wordpress-hostname-derived-admin-create
    desc: Hostname-derived WordPress admin creation
    crit: hostile
    conf: 0.99
    attack: T1136.001,T1098
    all:
      - id: micro-behaviors/communications/http/request/wordpress::rest-users-endpoint-url
      - id: micro-behaviors/os/user/account::administrator-role-field
      - id: hostname-derived-credential-fields
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    near_bytes: 3500

  # A browser script that rides an administrator session to mint a rogue
  # account via the user form and install a plugin from an external
  # archive in the same file is a session-riding compromise implant:
  # legitimate administration never bundles account creation with a
  # remote plugin install inside delivered script.
  - id: js-session-riding-rogue-admin-create
    desc: Session-ridden script creates rogue admin
    crit: hostile
    conf: 0.97
    attack: T1136.001,T1098
    all:
      - id: wp-admin-user-new-form-endpoint
      - id: wp-formdata-user-login-append
      - id: wp-formdata-administrator-role-append
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    near_bytes: 2048

  # fetch() as a symbol records one call site. A script that fingerprints
  # first and uploads a plugin later keeps that symbol on the earlier call,
  # while the upload itself is a fetch POST beside the form fields. Either
  # shape is the client that drives the install.
  - id: js-session-riding-plugin-install
    desc: Session-ridden script installs remote plugin
    crit: hostile
    conf: 0.97
    attack: T1505.003,T1098
    all:
      - id: micro-behaviors/communications/http/request/plugin-install::plugin-upload-action-endpoint
      - id: micro-behaviors/communications/http/request/plugin-install::plugin-archive-form-field
      - id: micro-behaviors/communications/http/download/url::archive-url-reference-text
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/post::js-fetch-post-request
      - id: micro-behaviors/communications/http/client/exchange::js-relative-route-fetch
    needs: 1
    near_bytes: 2048
