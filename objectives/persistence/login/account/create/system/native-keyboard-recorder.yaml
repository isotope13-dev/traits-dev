defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Recording supplies the hostile context. The registry key alone also
  # belongs to ordinary logon-screen management and remains notable.
  - id: native-keylogger-account-provisioning-logon-concealment
    desc: Keylogger with user creation and logon-list registry modification APIs
    crit: hostile
    conf: 0.98
    attack: T1136.001,T1564.002
    all:
      - id: objectives/collection/keylog/hook::native-keyboard-hook-recording
      - id: micro-behaviors/os/user/account::net-user-add-api
      - id: micro-behaviors/os/group/membership::windows-group-membership-api
      - id: micro-behaviors/os/registry/policy/reference::winlogon-special-accounts-user-list
      - id: metadata/binary/symbols/name/registry/write::reg-set-value-ex-w
  - id: polling-key-recorder-account-provisioning
    desc: Polling key recorder with account and group provisioning APIs
    crit: hostile
    conf: 0.98
    attack: T1136.001,T1098
    all:
      - id: objectives/collection/keylog/polling::native-xor-key-recording
      - id: micro-behaviors/os/user/account::net-user-add-api
      - id: micro-behaviors/os/group/membership::windows-group-membership-api
