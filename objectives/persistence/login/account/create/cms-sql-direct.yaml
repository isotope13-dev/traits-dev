defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  - text
  attack: T1136.001,T1505
  mbc: F0007
  conf: 0.97
traits:
- id: serialized-administrator-capability
  desc: Serialized administrator capability blob
  crit: suspicious
  if:
    type: text
    regex: a:\d+:\{s:\d{1,3}:.{0,4}(administrator|super_admin|editor).{0,4};b:1;\}
  unless:
  - id: metadata/path::test-directory-component
  - id: well-known/tool/detection/pattern-catalog::php-scanner-signature-rule-table
composite_rules:
- id: cms-admin-account-written-by-sql
  desc: Administrator account written straight to SQL
  crit: hostile
  all:
  - id: serialized-administrator-capability
  - id: micro-behaviors/data/db/write/row::sql-insert-into-users-table
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
