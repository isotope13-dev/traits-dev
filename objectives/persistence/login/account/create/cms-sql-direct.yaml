# A CMS administrator created by writing the database directly.
#
# WordPress has `wp_insert_user()`; a plugin that instead builds
# `INSERT INTO {prefix}users` and then writes the serialized capability blob
#
#   'a:1:{s:13:"administrator";b:1;}'
#
# into `{prefix}usermeta` is deliberately bypassing every hook, audit log and
# capability check the platform provides. The serialized literal is the part
# that cannot be renamed: it is the on-disk encoding WordPress requires, so it
# appears verbatim in every variant of this campaign (social-warfare,
# blaze-widget, contact-form-7-multi-step and wrapper-link-element all carry
# it) whatever the account name or table prefix.
defaults:
  platforms: [unix, windows]
  for: [php, text]
  attack: T1136.001,T1505
  mbc: F0007

traits:
  - id: serialized-administrator-capability
    desc: Serialized administrator capability blob
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: 'a:\d+:\{s:\d{1,3}:.{0,4}(administrator|super_admin|editor).{0,4};b:1;\}'

  - id: sql-insert-into-users-table
    desc: SQL inserts into a users table
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)INSERT\s+INTO\s+[^\n(]{0,40}users\s*\('

composite_rules:
  - id: cms-admin-account-written-by-sql
    desc: Administrator account written straight to SQL
    crit: hostile
    conf: 0.97
    all:
      - id: serialized-administrator-capability
      - id: sql-insert-into-users-table
    unless:
      - id: metadata/package/testing/
