# An IAM user plus a second access key is a persistence pattern only when it
# is combined with another account-control operation from the attack chain.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  attack: T1098

composite_rules:
  - id: aws-iam-access-key-created-by-assumed-role
    desc: AWS IAM access key created by assumed role
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/services/aws::iam-access-key-create-event
      - id: micro-behaviors/communications/http/services/aws::aws-assumed-role-identity-event
    near_bytes: 512

  - id: aws-iam-backdoor-account-chain
    desc: AWS IAM backdoor account chain
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/aws::iam-user-create-operation
      - id: micro-behaviors/communications/http/services/aws::iam-access-key-create-operation
    any:
      - id: micro-behaviors/communications/http/services/aws::serial-console-enable-operation
      - id: micro-behaviors/communications/http/services/aws::iam-password-policy-update-operation
    needs: 1
