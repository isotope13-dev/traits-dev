# An IAM user plus a second access key is a persistence pattern only when it
# is combined with another account-control operation from the attack chain.
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [scripts, source, json]
  attack: T1098

composite_rules:
  - id: aws-iam-access-key-created-by-assumed-role
    for: [json]
    desc: AWS IAM access key created by assumed role
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/services/aws-iam::iam-access-key-create-event
      - id: micro-behaviors/communications/http/services/aws-iam::aws-assumed-role-identity-event
    near_bytes: 512

  - id: aws-iam-backdoor-account-chain
    for: [python, javascript, java, go, php, csharp]
    desc: AWS IAM backdoor account chain
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/aws-iam::iam-user-create-operation
      - id: micro-behaviors/communications/http/services/aws-iam::iam-access-key-create-operation
    any:
      - id: micro-behaviors/communications/http/services/aws-iam::serial-console-enable-operation
      - id: micro-behaviors/communications/http/services/aws-iam::iam-password-policy-update-operation
    needs: 1
