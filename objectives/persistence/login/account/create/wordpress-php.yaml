defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1136.001,T1564
  mbc: B0030

composite_rules:
  - id: wordpress-dashboard-excluded-user
    desc: Creates user alongside dashboard login exclusion
    crit: suspicious
    conf: 0.95
    near_bytes: 2000
    all:
      - id: micro-behaviors/os/user/account::wordpress-create-user
      - id: micro-behaviors/process/hook/event::wordpress-admin-user-list-filter
      - id: micro-behaviors/data/db/query::wp-user-query-exclusion

  - id: wordpress-dashboard-excluded-administrator
    desc: Creates admin alongside dashboard login hiding
    crit: suspicious
    conf: 0.98
    near_bytes: 2000
    all:
      - id: wp-rogue-admin-creation
      - id: wordpress-dashboard-excluded-user

  - id: wp-rogue-admin-creation
    desc: Programmatic WordPress administrator account creation
    crit: suspicious
    conf: 0.98
    attack: T1136.001
    all:
    - id: micro-behaviors/os/user/account::wordpress-create-user
    - id: micro-behaviors/os/user/account::wordpress-admin-role-assignment
    unless:
    # `wordpress-context` includes every file importing a wp_* API, which made
    # this rule exclude the exact plugin code it is meant to inspect. Keep the
    # concrete core and test contexts while allowing third-party plugins through.
    - id: well-known/lib/web/wordpress-core::wordpress-core-package-doc
    - id: well-known/lib/web/wordpress-core::wordpress-core-include-bootstrap
    - id: well-known/lib/web/wordpress-core::wordpress-phpunit-test-case
    - id: well-known/app/publishing/wordpress-plugins/security::dominoguard-security-context
    - id: well-known/app/publishing/wordpress-plugins/site-admin::manage-system-user-context
    - id: well-known/app/publishing/wordpress-plugins/commerce::woo-razorpay-test-context
  - id: wordpress-hidden-administrator-persistence
    desc: Creates a WordPress administrator hidden from UI and REST listings
    crit: hostile
    conf: 0.99
    near_bytes: 6000
    all:
      - id: objectives/persistence/login/account/create::wp-rogue-admin-creation
      - id: objectives/command-and-control/backdoor/webshell/hide::wp-user-hiding
      - id: objectives/evasion/file-hiding/plugin::wordpress-rest-user-hiding
