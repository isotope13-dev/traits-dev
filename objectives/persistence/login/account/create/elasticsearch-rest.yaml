# Elasticsearch/X-Pack security-API abuse for backdoor accounts and
# self-healing persistence (SpiderLabs "RAVEN", 2026).
#
# Post-exploitation tooling against an exposed Elasticsearch cluster (port
# 9200) plants persistence through the X-Pack security REST API: a rogue
# superuser account, a long-lived cluster-wide API key that survives password
# rotation, and a Watcher that re-creates the account/key on a schedule so that
# ordinary incident response (delete-the-user) is undone on the next interval.
#
# The atoms live with the Elasticsearch data/API capabilities that they
# actually match. Intent lives here in composites that combine endpoint,
# privilege, schedule, condition, and webhook request structure. The same REST
# paths and JSON fields appear in Python, shell/curl, Go, or raw JSON.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  attack: T1136.001

composite_rules:
  - id: es-elasticsearch-rogue-superuser
    desc: Creates an Elasticsearch superuser account via the security API
    crit: suspicious
    conf: 0.92
    attack: T1136.001,T1098
    all:
      - id: micro-behaviors/data/db/elasticsearch::es-security-user-endpoint
      - id: micro-behaviors/data/db/elasticsearch::es-superuser-role-grant
    near_bytes: 500

  - id: es-elasticsearch-backdoor-api-key
    desc: Mints an Elasticsearch API key with cluster-wide privileges
    crit: suspicious
    conf: 0.88
    attack: T1098.001
    all:
      - id: micro-behaviors/data/db/elasticsearch::es-security-apikey-endpoint
      - id: micro-behaviors/data/db/elasticsearch::es-cluster-all-privilege-grant
    near_bytes: 400

  - id: es-watcher-recreates-superuser
    desc: Scheduled Elasticsearch Watcher recreates a superuser account
    crit: hostile
    conf: 0.98
    attack: T1546,T1136.001
    all:
      - id: micro-behaviors/data/db/elasticsearch::es-watcher-definition-endpoint
      - id: micro-behaviors/data/db/elasticsearch::es-watcher-scheduled-trigger
      - id: micro-behaviors/data/db/elasticsearch::es-watcher-always-condition
      - id: micro-behaviors/data/db/elasticsearch::es-watcher-user-webhook-path
      - id: micro-behaviors/communications/http/webhook::webhook-put-method-field
      - id: micro-behaviors/data/db/elasticsearch::es-superuser-role-grant

  - id: es-watcher-recreates-api-key
    desc: Scheduled Elasticsearch Watcher repeatedly mints API keys
    crit: hostile
    conf: 0.98
    attack: T1546,T1098.001
    all:
      - id: micro-behaviors/data/db/elasticsearch::es-watcher-definition-endpoint
      - id: micro-behaviors/data/db/elasticsearch::es-watcher-scheduled-trigger
      - id: micro-behaviors/data/db/elasticsearch::es-watcher-always-condition
      - id: micro-behaviors/data/db/elasticsearch::es-watcher-apikey-webhook-path
      - id: micro-behaviors/communications/http/webhook::webhook-post-method-field

  - id: es-elasticsearch-layered-persistence
    desc: Layers privileged Elasticsearch access with Watcher-based recreation
    crit: hostile
    conf: 0.98
    attack: T1136.001,T1098,T1546
    all:
      - id: es-elasticsearch-rogue-superuser
      - id: es-elasticsearch-backdoor-api-key
      - id: es-watcher-recreates-superuser
      - id: es-watcher-recreates-api-key
