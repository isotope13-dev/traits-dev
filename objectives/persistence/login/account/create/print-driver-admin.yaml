defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: print-driver-admin-user-result
  desc: Reports a new local administrator account
  if:
    type: text
    substr: added user $NewUser as local administrator
- id: embedded-admin-username-patch
  desc: Patches an account-creation payload username
  if:
    type: text
    substr: BlockCopy($NewUserBytes, 0, $nightmare_data,
composite_rules:
- id: print-driver-local-admin-account
  desc: Printer exploit creates a local administrator
  crit: hostile
  all:
  - id: print-driver-admin-user-result
  - id: embedded-admin-username-patch
  - id: objectives/privilege-escalation/exploit/print-spooler::powershell-print-driver-dll-replacement
