# Artifactory backdoor administrator accounts (Wiz, September 2026).
#
# After escalating a token (CVE-2026-42016 chain or CVE-2026-82329), actors
# created persistent administrator accounts through the user-management API —
# PUT /api/security/users/<name> or /access/api/ui/users/<name> — carrying the
# artifactory_admin grant alongside a set password. Names observed ranged from
# proof-of-concept boilerplate (svc_<random>, labadmin_<random>, 0xTerror,
# Nxploited_<random>) to service-impersonating names (jfrog-distribution,
# jfrog-insight, repo-service, migration-tool); matching on the route plus the
# admin grant field instead of the names keeps future variants covered. The
# accounts survive a software upgrade, so they must be removed by hand.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: "T1136.001"

composite_rules:
  - id: artifactory-admin-account-api-create
    desc: Artifactory administrator account created through users API
    crit: hostile
    conf: 0.95
    attack: "T1136.001,T1098"
    all:
      - id: micro-behaviors/communications/http/services/artifactory::users-api-route
      - id: micro-behaviors/communications/http/services/artifactory::admin-grant-field
    near_bytes: 2048
