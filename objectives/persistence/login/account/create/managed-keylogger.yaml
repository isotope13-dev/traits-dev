defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # Ordinary provisioning templates alone are neutral. Recording keystrokes
  # supplies attack admission; this describes co-occurrence, not a same-account
  # data-flow proof or successful creation under a privileged token.
  - id: managed-keylogger-admin-account-arguments
    desc: Managed keylogger carries account-create and admin-add arguments
    crit: hostile
    conf: 0.95
    attack: T1136.001
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: micro-behaviors/os/user/account::net-user-create-password-arguments
      - id: micro-behaviors/os/group/membership::net-local-admin-add-arguments
      - id: micro-behaviors/process/create/hidden::dotnet-hidden-process-launch-setup
