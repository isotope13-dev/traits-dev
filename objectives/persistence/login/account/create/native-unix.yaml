defaults:
  platforms: [netbsd, unix]
  for: [objc, elf]
  attack: T1136.001

traits:
  - id: native-useradd-chpasswd-account
    desc: Native useradd and chpasswd account
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'useradd -m[\s\S]{0,220}chpasswd'

composite_rules:
  - id: native-unix-backdoor-account
    desc: Native Unix backdoor account creation
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/lateral-movement/ssh/backdoor::native-backdoor-user-name
      - id: native-useradd-chpasswd-account
