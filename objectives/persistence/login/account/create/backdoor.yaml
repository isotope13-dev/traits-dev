defaults:
  platforms: [unix, windows, macos]
composite_rules:
  - id: hostile-account-takeover
    desc: Revokes admin rights from users while creating a new backdoor admin account
    crit: hostile
    conf: 0.95
    attack: "T1531"
    all:
      - id: micro-behaviors/os/user/account::new-local-user
      - id: micro-behaviors/os/user/account::add-local-group-member
      - id: micro-behaviors/os/user/account::remove-local-group-member
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
  - id: backdoor-admin-account
    desc: Creates backdoor administrator account via net commands
    crit: hostile
    conf: 0.97
    attack: "T1136.001"
    platforms: [windows]
    all:
      - id: micro-behaviors/os/user/account::net-user-create
      - id: micro-behaviors/os/user/account::net-localgroup-administrators-add
    unless:
      # Official Go builder images provision tokend/swarming/buildlet admins.
      - id: well-known/tool/development/go-x-build::go-x-build-infra-context
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-script
      - id: metadata/build/ci/agent::packer-windows-ci-image-context
  - id: powershell-admin-account-backdoor
    desc: Creates administrator via New-LocalUser and Add-LocalGroupMember
    crit: hostile
    conf: 0.97
    attack: "T1136.001,T1098"
    platforms: [windows]
    for: [powershell]
    all:
      - id: micro-behaviors/os/user/account::new-local-user
      - id: micro-behaviors/os/group/membership::powershell-privileged-group-add
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
  - id: native-admin-account-backdoor
    desc: Creates a local administrator through Windows account APIs
    crit: hostile
    conf: 0.98
    attack: T1136.001,T1098
    platforms: [windows]
    for: [c, cpp, csharp, rust, pe, dll]
    all:
      - id: micro-behaviors/os/user/account::net-user-add-api
      - id: micro-behaviors/os/group/membership::windows-group-membership-api
      # NetLocalGroupAddMembers can target any local group.  Require evidence
      # that the target is actually privileged before claiming an admin
      # backdoor rather than ordinary account provisioning.
      - id: micro-behaviors/os/group/membership::privileged-local-group-name
    unless:
      - id: well-known/tool/development/wix::firegiant-utilca-context
      # Advanced Installer's userAccounts helper legitimately creates and
      # assigns installer-managed accounts and groups during setup.
      - id: well-known/lib/platform/advanced-installer::advanced-installer-helper-context
