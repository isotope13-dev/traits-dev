defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-admin-membership-replacement
    desc: Creates an admin while removing other privileged group members
    crit: suspicious
    conf: 0.94
    attack: "T1136.001,T1098,T1531"
    near_lines: 30
    all:
      - id: micro-behaviors/os/user/account::new-local-user
      - id: micro-behaviors/os/group/membership::powershell-privileged-group-add
      - id: micro-behaviors/os/group/membership::powershell-privileged-group-remove
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
      - id: metadata/build/docker::dockerfile-basename

  - id: powershell-admin-account-backdoor
    desc: Creates administrator via New-LocalUser and Add-LocalGroupMember
    crit: hostile
    conf: 0.97
    attack: "T1136.001,T1098"
    all:
      - id: micro-behaviors/os/user/account::new-local-user
      - id: micro-behaviors/os/group/membership::powershell-privileged-group-add
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
      - id: well-known/tool/development/toolchain/go-x-build::go-x-build-infra-context
      - id: well-known/tool/development/ci/skia-buildbot/
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-script
      - id: metadata/build/ci/agent::packer-windows-ci-image-context
      - id: "metadata/file/naming::test-directory-component"
      - id: well-known/tool/development/crabbox::crabbox-context
      - id: metadata/build/docker::dockerfile-basename
