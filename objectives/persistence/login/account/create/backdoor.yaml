defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-admin-membership-replacement
    desc: Creates an admin while removing other privileged group members
    crit: suspicious
    conf: 0.94
    attack: "T1136.001,T1098,T1531"
    near_lines: 30
    all:
      - id: micro-behaviors/os/user/account::new-local-user
      - id: micro-behaviors/os/group/membership::powershell-privileged-group-add
      - id: micro-behaviors/os/group/membership::powershell-privileged-group-remove
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
      - id: metadata/build/docker::dockerfile-basename
