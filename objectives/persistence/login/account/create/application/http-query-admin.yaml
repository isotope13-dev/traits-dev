# Account-creation payloads delivered entirely in a URL.  The method override
# makes a browser navigation state-changing; the credential and role fields
# establish that the request creates a privileged attacker-controlled account.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, html, text]
  attack: "T1136,T1204.001"

composite_rules:
  - id: method-override-admin-account-create
    desc: Cross-route URL creates administrator account
    crit: hostile
    conf: 0.98
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/request/verb::query-method-override-write
      - id: micro-behaviors/communications/http/request/params::account-credential-query-triplet
      - id: micro-behaviors/communications/http/request/params::namespaced-route-query-value
      - id: micro-behaviors/os/user/account::administrator-role-query-parameter

  - id: wordpress-rest-method-override-admin-create
    desc: WordPress REST override creates administrator account
    crit: hostile
    conf: 0.99
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/request/wordpress::rest-users-endpoint-url
      - id: micro-behaviors/communications/http/request/verb::query-method-override-write
      - id: micro-behaviors/communications/http/request/params::account-credential-query-triplet
      - id: micro-behaviors/os/user/account::administrator-role-query-parameter

  - id: wordpress-cross-route-csrf-admin-create
    desc: Cross-route WordPress CSRF creates administrator account
    crit: hostile
    conf: 0.995
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/request/wordpress::rest-users-endpoint-url
      - id: micro-behaviors/communications/http/request/verb::query-method-override-write
      - id: micro-behaviors/communications/http/request/params::account-credential-query-triplet
      - id: micro-behaviors/communications/http/request/params::namespaced-route-query-value
      - id: micro-behaviors/os/user/account::administrator-role-query-parameter
