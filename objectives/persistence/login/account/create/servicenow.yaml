# ServiceNow backdoor account creation via Glide script.
#
# Attackers with tenant access re-create a hidden ServiceNow user from a
# backdoored business rule or scheduled job: insert into sys_user, reset
# its password, re-activate/unlock it, and grant it the admin role, so the
# account returns every day even after deletion (MDSec, "When it Snows it
# Pours", 2026).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json, text, data]
  attack: T1136.001
  mbc: F0011

composite_rules:
  - id: servicenow-backdoor-user-account
    desc: ServiceNow user recreated with reset password and re-enabled
    crit: hostile
    conf: 0.95
    attack: T1136.001,T1098
    all:
      - id: micro-behaviors/os/user/account::servicenow-user-table-write
      - id: micro-behaviors/os/user/account::servicenow-user-password-set
      - id: micro-behaviors/os/user/account::servicenow-account-re-enable
    near_bytes: 1500
