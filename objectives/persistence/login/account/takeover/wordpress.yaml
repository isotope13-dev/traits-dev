defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1098,T1110.003
  mbc: B0030

composite_rules:
  # Updating a WordPress account email can be legitimate.  Doing so with a
  # harvested account nonce and immediately invoking the password-reset route
  # is the takeover chain; requiring an OOB collector removes ordinary account
  # settings clients and recovery pages from consideration.
  - id: browser-wordpress-email-reset-takeover
    desc: Browser payload changes WordPress email then resets password
    crit: hostile
    conf: 0.99
    near_bytes: 16000
    all:
      - id: micro-behaviors/communications/http/form::wordpress-account-email-field-any
      - id: micro-behaviors/communications/http/form::wordpress-account-details-nonce-field-any
      - id: micro-behaviors/communications/http/url/path::wordpress-lost-password-route-any
      - id: micro-behaviors/communications/http/request/credentials::fetch-credentials-include-any
      - id: objectives/exfiltration/oob/endpoint::oob-endpoint-any
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/
