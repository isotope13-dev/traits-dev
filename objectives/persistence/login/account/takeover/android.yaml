# Session-token account takeover against an identity or account management API.
# An Android app acquires an authentication token via interprocess ContentProvider
# and immediately dispatches an authenticated HTTP request to modify the user's
# account profile.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1098
  mbc: B0030

composite_rules:
  - id: android-session-token-account-takeover
    desc: Android app uses harvested session token to modify account profile
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/memory::android-content-provider-credential-read
      - id: micro-behaviors/communications/http/header/security::android-custom-token-header-source
      - id: micro-behaviors/communications/http/url/endpoint::user-info-endpoint
      - id: micro-behaviors/communications/http/client/library::android-okhttp-client-reference
