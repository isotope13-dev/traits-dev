defaults:
  crit: suspicious
  for: [scripts, binaries]
  platforms:
  - unix
  size_max: 104857600
composite_rules:
- id: js-cross-platform-ssh-key-path-clues
  for: [javascript]
  desc: JavaScript SSH key and cross-platform path clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/crypto/asymmetric/ssh::hardcoded-public-key
  - id: micro-behaviors/fs/path/public-key::js-cross-platform-ssh-homes
  - id: micro-behaviors/fs/path/public-key::js-authorized-keys-path-variable
  any:
  - id: micro-behaviors/fs/chmod/modify::js-ssh-chmod-owner-only-mode-cooccurrence
  - id: micro-behaviors/fs/directory/create::mkdir-ssh-reference
