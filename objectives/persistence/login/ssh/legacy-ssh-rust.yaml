defaults:
  platforms: [unix]
  for: [rust, crate]

composite_rules:
  - id: rust-ssh-key-path-open-clues
    desc: Rust SSH key, path and file-open clues
    crit: suspicious
    conf: 0.99
    scope: archive
    # Archive-wide evidence can come from unrelated files; retain the
    # established bounds while treating this as context, not a key write.
    size_max: 33554432
    all:
      - id: micro-behaviors/communications/ssh/keys::ed25519-key-text-fragment
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
      - id: micro-behaviors/fs/file/open/unspecified::rust-open-options
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::set-permissions-call
      - id: micro-behaviors/fs/file/open/unspecified::native-open-file-call
    unless:
      - id: metadata/path/directory::test-directory-component
