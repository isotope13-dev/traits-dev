defaults:
  platforms: [unix]
  for: [rust]
traits:
  - id: rust-restores-ssh-key-file-times
    desc: Rust restores SSH key file times
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      language: rust
      query: |
        ((function_item body: (block
          (let_declaration pattern: (identifier) @auth
            value: (call_expression function: (field_expression field: (field_identifier) @join)
              arguments: (arguments (string_literal (string_content) @keys))))
          (let_declaration pattern: (identifier) @stamp
            value: (call_expression function: (field_expression
              value: (call_expression function: (field_expression
                value: (call_expression function: (scoped_identifier) @metadata
                  arguments: (arguments (reference_expression value: (identifier) @metadata_path)))
                field: (field_identifier) @ok) arguments: (arguments))
              field: (field_identifier) @and_then) arguments: (arguments (closure_expression) @closure)))
          (expression_statement (if_expression
            condition: (let_condition pattern: (tuple_struct_pattern (tuple_pattern (identifier) @atime (identifier) @mtime))
              value: (identifier) @stampuse)
            consequence: (block (expression_statement (if_expression
              condition: (let_condition pattern: (tuple_struct_pattern (identifier) @handle)
                value: (call_expression function: (field_expression field: (field_identifier) @open)
                  arguments: (arguments (reference_expression value: (identifier) @openpath))))
              consequence: (block (let_declaration value: (call_expression
                function: (field_expression value: (identifier) @handleuse field: (field_identifier) @set_times)
                arguments: (arguments (call_expression function: (field_expression
                  value: (call_expression function: (field_expression
                    value: (call_expression function: (scoped_identifier) @new)
                    field: (field_identifier) @set_accessed) arguments: (arguments (identifier) @atimeuse))
                  field: (field_identifier) @set_modified) arguments: (arguments (identifier) @mtimeuse)))))))))))))
          (#eq? @join "join") (#eq? @keys "authorized_keys")
          (#match? @metadata "(^|::)fs::metadata$") (#eq? @metadata_path @auth)
          (#eq? @ok "ok") (#eq? @and_then "and_then")
          (#match? @closure "accessed\\(\\).*modified\\(\\)")
          (#eq? @stamp @stampuse) (#eq? @open "open") (#eq? @openpath @auth)
          (#eq? @handle @handleuse) (#eq? @set_times "set_times")
          (#match? @new "(^|::)FileTimes::new$")
          (#eq? @set_accessed "set_accessed") (#eq? @set_modified "set_modified")
          (#eq? @atime @atimeuse) (#eq? @mtime @mtimeuse))
composite_rules:
  - id: rust-concealed-ssh-key-injection
    desc: Injects SSH key and restores timestamps
    crit: hostile
    conf: 0.98
    attack: T1098.004
    all:
      - id: rust-restores-ssh-key-file-times
      - id: micro-behaviors/fs/write/file/target::rust-appends-literal-ssh-key
