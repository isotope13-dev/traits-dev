defaults:
  platforms: [unix]
  for: [elf, macho, go, rust, c, cpp]

composite_rules:
  # Static co-occurrence: a native program carries the sshd_config path, a
  # ForceCommand directive and a forwarding-disable config block, so it can
  # route every SSH login through its own command while closing forwarding.
  - id: native-sshd-force-command-gate
    desc: Binary can force all SSH logins through a command
    crit: suspicious
    conf: 0.9
    attack: T1098,T1546.004
    all:
      - id: micro-behaviors/os/service/config::sshd-config-path
      - id: micro-behaviors/os/service/config::sshd-forwarding-disable-template
      - id: micro-behaviors/os/service/config::sshd-force-command-directive
