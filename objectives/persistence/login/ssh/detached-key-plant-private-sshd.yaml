# Container entrypoints may copy a test key and start dropbear in the
# foreground. Detaching the script from its terminal session first is what an
# implant does to outlive the shell that ran it.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1098.004,T1543

composite_rules:
  - id: detached-key-plant-private-sshd
    desc: Detached script plants an SSH login key and starts its own SSH daemon
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/ssh/keys::authorized-keys-write-operation
      - id: micro-behaviors/os/service/remote::dropbear-server-args
      - id: micro-behaviors/process/daemonize/detach::setsid-command
