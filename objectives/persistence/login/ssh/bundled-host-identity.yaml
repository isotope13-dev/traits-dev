defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.94

traits:
  - id: shell-copies-bundled-ssh-key-material
    desc: Shell copies bundled SSH key material
    if:
      type: text
      regex: '\b(cp|install)\s+(-[\w]+\s+)?["'']?[\w.-]*ssh[\w.-]*key[\w.-]*/'

  - id: shell-openssh-host-key-inventory
    desc: Shell references OpenSSH host keys
    if:
      type: text
      regex: '\bssh_host_(rsa|dsa|ed25519|ecdsa)_key\b'

  - id: shell-system-ssh-config-path
    desc: Shell references system SSH directory
    if:
      type: text
      regex: '[/]etc/ssh\b'

composite_rules:
  - id: shell-installs-bundled-ssh-host-keys-with-timestomp
    desc: Shell installs bundled SSH host keys and copies unrelated file timestamps
    crit: hostile
    conf: 0.96
    attack: T1070.006
    near_lines: 55
    all:
      - id: shell-copies-bundled-ssh-key-material
      - id: shell-openssh-host-key-inventory
      - id: shell-system-ssh-config-path
      - id: objectives/evasion/indicator-removal/timestamps::touch-reference-system-path
