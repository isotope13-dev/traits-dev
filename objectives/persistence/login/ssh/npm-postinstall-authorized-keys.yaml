# An install hook that creates ~/.ssh and appends a key to authorized_keys
# grants SSH login to whoever holds the matching private key on every
# machine that installs the package. Nothing a dependency needs at install
# time touches the user's SSH trust store; a placeholder key still proves the
# planting path.
defaults:
  platforms: [unix]
  for: [npm, package.json]
  attack: T1098.004

composite_rules:
  - id: npm-install-hook-authorized-keys-persistence
    desc: Install hook appends key to authorized_keys
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/fs/write/file/target::postinstall-authorized-keys-append
      - id: micro-behaviors/fs/write/file/target::postinstall-ssh-directory-create
