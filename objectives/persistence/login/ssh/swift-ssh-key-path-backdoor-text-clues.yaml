defaults:
  crit: suspicious
  for: [scripts, binaries]
  platforms:
  - unix
  size_max: 104857600
composite_rules:
- id: swift-ssh-key-path-backdoor-text-clues
  desc: Swift SSH key, path and backdoor text clues
  crit: suspicious
  conf: 0.96
  for: [swift]
  all:
  - id: micro-behaviors/fs/path/public-key::swift-authorized-keys-path
  - id: objectives/command-and-control/backdoor/account::swift-backdoor-at-text
  - id: micro-behaviors/crypto/asymmetric/ssh::hardcoded-public-key
