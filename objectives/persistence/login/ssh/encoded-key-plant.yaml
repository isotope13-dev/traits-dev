# A public key is public: nothing is gained by Base64-wrapping one except
# hiding the operator's login key from someone reading the installer. An
# encoded key next to an authorized_keys target is an SSH backdoor plant.
defaults:
  platforms: [unix]
  attack: T1098.004
  mbc: E1098
composite_rules:
  - id: encoded-key-authorized-keys-plant
    desc: Concealed SSH key written to authorized_keys
    crit: hostile
    conf: 0.95
    for: [shell, python]
    all:
      - id: micro-behaviors/communications/ssh/keys::encoded-ssh-public-key
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
