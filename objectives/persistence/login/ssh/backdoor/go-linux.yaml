defaults:
  platforms: [unix]
  for: [go]
  attack: T1098.004

traits:
  - id: go-writes-ssh-rsa-prefix
    desc: Go writes ssh-rsa key prefix
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: 'WriteString("ssh-rsa ")'

composite_rules:
  - id: go-ssh-authorized-key-backdoor
    desc: Go SSH authorized key backdoor
    crit: hostile
    conf: 0.98
    near_bytes: 256
    all:
      - id: micro-behaviors/crypto/asymmetric/key::go-rsa-generate-key
      - id: go-writes-ssh-rsa-prefix
      - id: micro-behaviors/fs/write/file/append::append-ssh-authorized-keys
