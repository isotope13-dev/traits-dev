defaults:
  for: [scripts, elf, pe]
  platforms: [unix, windows]
  attack: T1098.004
traits:
  - id: redis-ssh-key-set-value
    desc: Redis SET value contains SSH public key
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '\bSET\s+\S+\s+.{0,12}ssh-(rsa|ed25519)\s+AAAA'
      case_insensitive: true
  - id: redis-dump-authorized-keys-filename
    desc: Redis dump filename targets authorized_keys
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '\bCONFIG\s+SET\s+dbfilename\s+["'']?authorized_keys(2)?\b'
      case_insensitive: true
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
  - id: redis-dump-ssh-directory
    desc: Redis dump directory targets .ssh
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '\bCONFIG\s+SET\s+dir\s+["'']?[^\s"'']{0,160}/\.ssh([/"''\s]|\\r|$)'
      case_insensitive: true
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
composite_rules:
  - id: redis-replication-ssh-dump-redirection
    desc: Redis replication with SSH authorized_keys dump redirection
    crit: suspicious
    conf: 0.99
    all:
      - id: redis-dump-authorized-keys-filename
      - id: redis-dump-ssh-directory
      - id: micro-behaviors/data/db/redis::redis-replication-endpoint-command
  - id: redis-authorized-keys-backdoor
    desc: Redis key payload saves into SSH authorized_keys
    crit: hostile
    conf: 0.98
    all:
      - id: redis-dump-authorized-keys-filename
      - id: redis-dump-ssh-directory
      - id: redis-ssh-key-set-value
      - id: micro-behaviors/data/db/redis::redis-save-command
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
