defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]

composite_rules:
  - id: aws-ec2-ssh-key-persistence
    desc: AWS EC2 SSH access established with a new key pair
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/services/aws::aws-key-pair-creation-operation
    any:
      - id: micro-behaviors/communications/http/services/aws::aws-ssh-public-key-operation
