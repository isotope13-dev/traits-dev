defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]

composite_rules:
  - id: aws-ec2-ssh-key-persistence
    desc: AWS EC2 SSH access established with a new key pair
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/services/aws::ec2-create-key-pair-operation
    any:
      - id: micro-behaviors/communications/http/services/aws::ec2-send-ssh-public-key-operation
      - id: micro-behaviors/communications/http/services/aws::ec2-send-serial-console-ssh-public-key-operation
