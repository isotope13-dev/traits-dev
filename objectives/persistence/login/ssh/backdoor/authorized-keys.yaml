# The article's actual finding: the tell is not the key install, it is the
# eviction around it. Provisioning appends a key; this playbook destroys the
# existing trust store first so no previously authorized operator survives,
# then takes away the fallbacks — the root password and the tcp_wrappers deny
# list that a fail2ban jail would otherwise use to evict it. `ssh-trust-store-
# reset` above covers the same eviction but requires the key literal to be
# recognized; these fire on the eviction-plus-lockout shape alone, so a rotated
# or unparsed key does not buy the operator invisibility.
- id: ssh-trust-store-eviction
  desc: Wipes the SSH trust store before installing an authorized key
  crit: hostile
  conf: 0.97
  attack: T1098.004,T1531
  mbc: E1098
  all:
  - id: reset-ssh-dir
  any:
  - id: authorized-keys-append
  - id: authorized-keys-shell-append
  - id: micro-behaviors/communications/ssh/keys::authorized-keys-append-redirect
  unless:
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: well-known/tool/sysadmin/automatedlab/

- id: ssh-key-install-with-operator-lockout
  desc: Installs an SSH key and revokes the operator's own access
  crit: hostile
  conf: 0.96
  attack: T1098.004,T1531
  all:
  - id: ssh-trust-store-eviction
  any:
  - id: micro-behaviors/os/user/account::chpasswd-command
  - id: objectives/impact/degrade/firewall::tcp-wrappers-deny-list-cleared

# Same technique expressed through a language runtime rather than a shell
# one-liner: rmtree the trust store, rebuild it, write the key back.
- id: python-ssh-trust-store-eviction
  desc: Python deletes and rebuilds the SSH authorized_keys trust store
  crit: hostile
  conf: 0.96
  for: [python]
  mbc: E1098
  near_bytes: 1024
  all:
  - id: micro-behaviors/fs/directory/delete::shutil-rmtree
  - id: micro-behaviors/communications/ssh/keys::authorized-keys-path-construction
  - id: micro-behaviors/fs/file/open::write-append-create-mode
  unless:
  - id: metadata/build/recognized-contexts::benign-build-tooling-context

- id: python-ssh-key-install-with-operator-lockout
  desc: Python replaces SSH trust and clears host access controls
  crit: hostile
  conf: 0.96
  for: [python]
  attack: T1098.004,T1562.004
  all:
  - id: python-ssh-trust-store-eviction
  - id: objectives/impact/degrade/firewall::tcp-wrappers-deny-list-cleared
