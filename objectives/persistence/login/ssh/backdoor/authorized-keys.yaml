defaults:
  crit: suspicious
  attack: T1098.004
  for: [scripts, binaries]
  platforms:
  - unix
  size_max: 104857600
traits:
- id: vagrant-user-marker
  desc: Vagrant user marker
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: Vagrant User
- id: vagrant-insecure-key-marker
  desc: Vagrant insecure public key marker
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: vagrant insecure public key
  unless:
  - id: well-known/app/system/kiwi::kiwi-vagrant-image-bootstrap
  - id: well-known/app/system/kiwi::kiwi-appliance-builder-package
- id: authorized-keys-append
  desc: Append to SSH authorized_keys
  crit: notable
  conf: 0.8
  # A workflow `run:` block is a shell script that happens to live in YAML, and
  # planting a key in the runner's authorized_keys is a real CI-compromise move
  # (as well as a real debug-access feature); without github-actions in `for:`
  # the whole technique was invisible in pipeline definitions.
  for: [scripts, binaries, github-actions]
  if:
    type: text
    # `^ *echo` only saw a command that starts its own line. The most common
    # form of this technique in the wild chains off `&&`
    # (`cd ~ && rm -rf .ssh && mkdir .ssh && echo "ssh-rsa ..." >> ...`), so the
    # anchor is command-leading, not line-leading. The length budget has to clear
    # a full RSA public key (~372 chars for 2048-bit, ~716 for 4096-bit) sitting
    # between the echo and the redirect.
    regex: '(?m)(^|[;&|]) *(echo|cat)[^\n]{0,800}[>]+[^\n]{0,100}authorized_keys'
  unless:
  - type: text
    substr: machine.communicate
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: well-known/tool/sysadmin/automatedlab/
  - id: well-known/app/system/kiwi::kiwi-build-helper-context
  # Qt Creator RemoteLinux deploys the developer's pubkey to a device (ssh-copy-id
  # idiom) — legitimate IDE remote-deployment, not a backdoor.
  - id: well-known/app/development/qtcreator/
  - id: well-known/app/development/vscode/
  - type: text
    regex: 'grep\s+-qxF[^\n]{0,120}authorized_keys'
- id: authorized-keys-shell-append
  desc: Shell command appends to SSH authorized_keys
  crit: notable
  conf: 0.94
  for: [shell, javascript, typescript]
  if:
    type: text
    regex: '(?s)(?m)(^|[;&|]) *echo\s+[^\n]{0,800}>>\s*[^ \n]{0,100}authorized_keys\b'
  unless:
  - id: metadata/package/testing/
  - id: metadata/build/ci/
  - id: well-known/app/development/vscode/
  - type: text
    regex: 'grep\s+-qxF[^\n]{0,120}authorized_keys'
- id: root-authorized-keys-path
  desc: Root SSH authorized_keys path
  crit: notable
  conf: 0.95
  for: [shell]
  if:
    type: text
    regex: '/root/\.ssh/authorized_keys\b'
- id: authorized-keys-echo-append
  desc: Echo to authorized_keys file
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?m)(^|[;&|]) *echo.{0,800}>>.{0,50}authorized_keys'
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/sysadmin/virtualization::lima-virtualization-tool
  - type: basename
    exact: limactl.exe
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: well-known/tool/sysadmin/automatedlab/
  - id: well-known/app/development/vscode/
  - id: well-known/tool/development/runspec-console/
- id: shell-echo-authorized-key
  desc: Shell appends a literal authorized key
  crit: component
  conf: 0.99
  for: [shell]
  if:
    type: text
    regex: '(?m)^ *echo ["'']ssh-\S+ [A-Za-z0-9+/=]{40,800}.{0,120}>> *\S*authorized_keys'
- id: mkdir-ssh
  desc: Creates .ssh directory
  crit: component
  conf: 0.7
  if:
    type: text
    regex: mkdir.{0,30}\.ssh
  unless:
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: well-known/tool/sysadmin/automatedlab/
  - id: well-known/app/network/dropbear::source-tree
  - id: well-known/tool/development/runspec-console/
- id: reset-ssh-dir
  desc: Recreates .ssh after deletion
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: rm\s+-rf\s+\.ssh\s*&&\s*mkdir\s+\.ssh
- id: chmod-ssh-dir
  desc: Sets permissions on .ssh directory
  crit: component
  conf: 0.7
  if:
    type: text
    regex: chmod\s+[0-9]+.{0,30}\.ssh
  unless:
  - id: well-known/tool/sysadmin/automatedlab/
  - id: well-known/app/network/dropbear::source-tree
- id: chmod-ssh-go-eq
  desc: Restricts group other SSH perms
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: chmod\s+-R\s+go=\s+~?/?\.ssh
- id: js-authorized-keys-write
  desc: Node.js writes to SSH authorized_keys
  crit: suspicious
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: (appendFile|writeFile|appendFileSync|writeFileSync)\s*\(.{0,200}authorized_keys
  unless:
  - id: well-known/tool/development/vmactions-freebsd/
  - id: well-known/tool/development/cross-platform-actions::cross-platform-actions-context
  - type: text
    substr: tmate-io/tmate/releases
- id: js-authorized-keys-short-variable-append
  desc: Node writes short authorized_keys var
  crit: suspicious
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: "(appendFile|writeFile)(Sync)?\\s*\\(\\s*(authKeys|authorizedKeys)\\w*"
  unless:
  - id: well-known/tool/development/vmactions-freebsd/
  - id: well-known/tool/development/cross-platform-actions::cross-platform-actions-context
  - type: text
    substr: tmate-io/tmate/releases
- id: js-authorized-keys-resolve-path
  desc: Node resolve/join of authorized_keys path
  crit: component
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: '(resolve|join)\s*\([^\n;]{0,80}authorized_keys'
- id: js-authorized-keys-binder
  desc: Node binds an authorizedKeys path variable
  crit: component
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: '(const|let|var)\s+authorizedKeys\w*\s*='
- id: js-authorized-keys-join-variable
  desc: Node builds authorized_keys path variable
  crit: component
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: "(\\b(const|let|var)\\s+)?(authKeys|authorizedKeys)\\s*=\\s*path\\.join\\("
- id: js-fetch-ssh-key-task
  desc: Node fetches SSH key task
  crit: suspicious
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: '/api/ssh-key([/?#"''`]|$)'
  unless:
  - id: well-known/app/security/bitwarden::bitwarden-app
  - id: well-known/app/security/bitwarden::bitwarden-text-marker
- id: js-public-key-variable
  desc: JavaScript public key variable
  crit: component
  conf: 0.82
  for: [javascript, typescript]
  if:
    type: text
    substr: fullPublicKey
- id: js-linux-gated-ssh-backdoor
  desc: Linux-gated SSH key install logic
  crit: component
  conf: 0.86
  for: [javascript, typescript]
  if:
    type: text
    substr: os.platform() === 'linux'
- id: js-unix-ssh-home-path
  desc: JavaScript SSH configuration path reference
  crit: component
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: '(?i)([/\\]\.ssh[/\\]|authorized_keys|id_(rsa|ed25519|ecdsa)(\.pub)?\b)'
- id: js-windows-drive-enumeration
  desc: Contains Windows drive-letter enumeration string
  crit: component
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    substr: CDEFGHIJKLMNOPQRSTUVWXYZ
- id: js-chmod-ssh-path
  desc: Node chmod targets SSH path
  crit: component
  conf: 0.86
  for: [javascript, typescript]
  if:
    type: text
    regex: "chmodSync\\s*\\([^)]{0,120}(\\.ssh|authorized_keys|ssh)"
- id: js-chmod-ssh-mode
  desc: Node chmod sets SSH mode
  crit: component
  conf: 0.86
  for: [javascript, typescript]
  if:
    type: text
    regex: "chmodSync\\s*\\([^)]{0,220}(448|384|0o700|0o600)"
- id: swift-backdoor-key-comment
  desc: Swift backdoor SSH key comment
  crit: suspicious
  conf: 0.9
  for: [swift]
  if:
    type: text
    substr: backdoor@
- id: swift-authkeys-path
  desc: Swift authorized_keys path
  crit: suspicious
  conf: 0.86
  for: [swift]
  if:
    type: text
    substr: authorized_keys

