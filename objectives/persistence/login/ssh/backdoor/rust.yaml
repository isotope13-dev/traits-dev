defaults:
  platforms: [unix]
  for: [rust, crate]
  attack: T1098.004,T1195.002

composite_rules:
  - id: rust-ssh-authorized-key-backdoor
    desc: Rust library installs an embedded SSH key into authorized_keys
    crit: hostile
    conf: 0.99
    scope: archive
    # Archive scope is right for a backdoored *crate* -- the embedded key and
    # the writer can sit in different modules -- but it has to be bounded, or a
    # distro source tree satisfies every leg from unrelated files. Ubuntu's
    # rustc 1.75 tarball scored hostile this way, with the match surfacing on
    # cargo's own tests/testsuite/ssh.rs. A backdoored library crate is small.
    size_max: 33554432
    all:
      - id: micro-behaviors/communications/ssh/keys::ed25519-key-text-fragment
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
      - id: micro-behaviors/fs/file/open::rust-open-options
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::set-permissions-call
      - id: micro-behaviors/fs/file/open::native-open-file-call
    unless:
      # An SSH client's test suite writes authorized_keys with a throwaway key
      # on purpose; that is the fixture, not the backdoor.
      - id: metadata/package/testing/
