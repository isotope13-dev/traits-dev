defaults:
  platforms: [unix]
  for: [rust, archives]
  attack: T1098.004,T1195.002

composite_rules:
  - id: rust-ssh-authorized-key-backdoor
    desc: Rust library installs an embedded SSH key into authorized_keys
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/communications/ssh/keys::ed25519-key-text-fragment
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
      - id: micro-behaviors/fs/file/open::rust-open-options
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::set-permissions-call
      - id: micro-behaviors/fs/file/open::native-open-file-call
