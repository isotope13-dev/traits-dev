defaults:
  for: [scripts, source]
  platforms: [unix, windows]
  attack: T1098.004
composite_rules:
  - id: database-query-authorized-keys-write
    desc: Remote file-writing database query targets SSH authorized_keys
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/db/sql::remote-file-query-submit
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys-path-literal
