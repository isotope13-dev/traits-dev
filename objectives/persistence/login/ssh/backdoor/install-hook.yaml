# A trust-store write is unusual in an npm installer, but does not prove a
# working backdoor: fixtures can append invalid placeholder key material.
# Require a public-key-shaped blob before inferring retained login access.
defaults:
  platforms: [unix]
  for: [package.json]

composite_rules:
  - id: postinstall-authorized-keys-append
    desc: Postinstall appends to SSH authorized_keys
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/fs/write/file/target::postinstall-authorized-keys-append

  - id: postinstall-ssh-trust-store-plant
    desc: Postinstall appends an Ed25519 login key
    crit: hostile
    conf: 0.95
    attack: T1098.004
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/fs/write/file/target::postinstall-ed25519-key-append
