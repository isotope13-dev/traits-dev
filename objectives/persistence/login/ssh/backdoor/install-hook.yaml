# An npm lifecycle hook that writes into the SSH login trust store. The
# postinstall command runs on every machine that installs the package, and
# appending a key line to authorized_keys grants login access to whoever
# holds the matching private key — persistence for an attacker-controlled
# credential. Provisioning tooling manages authorized_keys through config
# management and image builds, not from a package install hook.
defaults:
  platforms: [unix]
  attack: T1098.004
  mbc: E1098

traits:
  - id: authorized-keys-append-command
    desc: Appends a key line to authorized_keys
    crit: suspicious
    conf: 0.95
    for: [package.json, shell]
    if:
      type: text
      regex: '(>>|tee\s+-a\s+)\s*[^|;&\n]{0,80}authorized_keys\b'
    unless:
      - id: metadata/package/testing/harness/benchmark::adversarial-benchmark-corpus
      - id: "metadata/file/naming::test-directory-component"

  - id: ssh-dir-mkdir-command
    desc: Creates the .ssh directory
    crit: suspicious
    conf: 0.9
    for: [package.json, shell]
    if:
      type: text
      regex: 'mkdir\s+[^|;&\n]{0,20}\.ssh\b'
    unless:
      - id: metadata/package/testing/harness/benchmark::adversarial-benchmark-corpus
      - id: "metadata/file/naming::test-directory-component"
      # A README full of shell listings is sniffed as shell. The mkdir is
      # documentation of a Vagrant base box, not a script that creates .ssh.
      - id: metadata/file/extension/identity::markdown-file-basename

composite_rules:
  - id: postinstall-authorized-keys-append
    desc: Install hook appends a key to authorized_keys
    crit: hostile
    conf: 0.97
    for: [package.json, npm, tar, zip, json]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: authorized-keys-append-command

  - id: postinstall-ssh-trust-store-plant
    desc: Install hook prepares .ssh and plants a key
    crit: hostile
    conf: 0.98
    for: [package.json, npm, tar, zip, json]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: ssh-dir-mkdir-command
      - id: authorized-keys-append-command
