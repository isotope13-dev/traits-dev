# A complete key supports retained login access. A malformed key still
# supports detecting an attempted trust-store persistence write.
defaults:
  platforms: [unix]
  for: [package.json]

composite_rules:
  - id: postinstall-authorized-keys-append
    desc: Postinstall appends to SSH authorized_keys
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/fs/write/file/target::postinstall-authorized-keys-append

  - id: postinstall-ssh-trust-store-plant
    desc: Postinstall appends an Ed25519 login key
    crit: hostile
    conf: 0.95
    attack: T1098.004
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/fs/write/file/target::postinstall-ed25519-key-append

  - id: postinstall-attempted-ssh-trust-store-plant
    desc: Postinstall attempts SSH key persistence
    crit: hostile
    conf: 0.95
    attack: T1098.004
    for: [npm]
    all:
      - id: micro-behaviors/fs/write/file/target::postinstall-ed25519-key-line-attempt
      - id: micro-behaviors/fs/write/file/target::postinstall-ssh-directory-create

