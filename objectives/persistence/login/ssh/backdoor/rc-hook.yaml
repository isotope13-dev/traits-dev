defaults:
  platforms: [unix]
  for: [scripts]
  attack: T1037.004

traits:
  - id: ssh-rc-write-path
    desc: Writes an SSH rc hook path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(\b(cp|install|mv|chmod|touch)\s+.{0,60}|>>?\s*["'']?[^\s>"'']{0,60})(/\.ssh/rc|/sshrc)\b'
