defaults:
  platforms: [unix]
  for: [scripts]
  attack: T1037.004

traits:
  - id: ssh-rc-write-path
    desc: Writes an SSH rc hook path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(>>?|cp|install|mv|touch|chmod)\s+.{0,60}(/\.ssh/rc|/sshrc)\b'
    unless:
      - id: metadata/package/files/ecosystem::conda-shell-activation-layout
      - id: well-known/tool/development/toolchain/darling/
      # Recovery tests use ~/.ssh/rc to bootstrap ephemeral hosts; the hook
      # is not part of the installed package in a test-tree source file.
      - id: metadata/package/testing/presence/harness::test-directory-path
