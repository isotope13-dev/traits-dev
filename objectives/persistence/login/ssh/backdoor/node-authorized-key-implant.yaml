# A runtime implant appends an embedded SSH public key to the current user's
# authorized_keys and configures the local SSH server for remote access.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
  attack: T1098.004

composite_rules:
  - id: node-embedded-key-ssh-backdoor
    desc: Plants SSH key and enables server
    crit: hostile
    conf: 0.99
    near_bytes: 2600
    all:
      - id: micro-behaviors/crypto/asymmetric/ssh::ed25519-public-key-literal
      - id: micro-behaviors/fs/path/public-key::js-authorized-keys-resolve-path
      - id: micro-behaviors/fs/write/file/append::append-file-sync
    any:
      - id: micro-behaviors/os/service/control::node-systemctl-enable-ssh
      - id: micro-behaviors/os/service/remote::node-macos-enable-remote-login
      - id: micro-behaviors/os/service/remote::node-windows-install-openssh-server

