defaults:
  platforms: [linux]
  for: [go]
composite_rules:
  - id: encoded-ssh-key-multi-startup
    desc: Concealed SSH key installation with redundant agent startup
    crit: hostile
    attack: T1098.004
    all:
      - id: micro-behaviors/communications/ssh/keys::encoded-authorized-keys-append
      - id: objectives/persistence/login/shell/profile::root-rc-detached-python
      - id: micro-behaviors/os/service/config::encoded-systemd-unit-write
