# Persistent agent identity / memory files (OpenClaw SOUL.md, MEMORY.md, and
# peers) reinjected into the system prompt each session. When those files carry
# download-exec pipelines or destructive shell, they act as a durable control
# channel across context wipes — the structural half of "mind virus" action
# payloads. Match artifact structure (basename + shell commands), never the
# surrounding English persuasion text.
defaults:
  platforms: [unix, windows]
  for: [markdown, shell]
  attack: T1546,T1105

traits:
  - id: agent-soul-md-basename
    desc: File is named SOUL.md
    crit: notable
    conf: 0.95
    for: [markdown, text, html]
    if:
      type: path
      basename: true
      exact: SOUL.md

  - id: agent-memory-md-basename
    desc: File is named MEMORY.md
    crit: notable
    conf: 0.92
    for: [markdown, text, html]
    if:
      type: path
      basename: true
      exact: MEMORY.md

  - id: agent-soul-md-path-write
    desc: Appends or writes SOUL.md path
    crit: notable
    conf: 0.93
    for: [shell, python, javascript, typescript, markdown]
    if:
      type: text
      regex: '(?i)>>\s*["'']?[^"''\n]{0,60}SOUL\.md\b'

  - id: agent-memory-md-path-write
    desc: Appends or writes MEMORY.md path
    crit: notable
    conf: 0.92
    for: [shell, python, javascript, typescript, markdown]
    if:
      type: text
      regex: '(?i)>>\s*["'']?[^"''\n]{0,60}MEMORY\.md\b'

  - id: github-raw-install-sh-pipe
    desc: GitHub raw install.sh piped to shell
    crit: suspicious
    conf: 0.94
    for: [markdown, shell, html, python, javascript, typescript]
    if:
      type: text
      regex: '(?i)raw\.githubusercontent\.com/[^\s|/]{1,120}/install\.sh\s*\|\s*(bash|sh)\b'

composite_rules:
  - id: agent-persistent-prompt-file
    desc: Agent persistent prompt identity or memory file
    crit: notable
    conf: 0.94
    any:
      - id: agent-soul-md-basename
      - id: agent-memory-md-basename

  - id: agent-soul-curl-pipe-bootstrap
    desc: Agent SOUL.md bootstraps via curl-pipe-shell
    crit: hostile
    conf: 0.98
    attack: T1546,T1105,T1059.004
    all:
      - id: agent-soul-md-basename
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text

  - id: agent-memory-curl-pipe-bootstrap
    desc: Agent MEMORY.md bootstraps via curl-pipe-shell
    crit: hostile
    conf: 0.97
    attack: T1546,T1105,T1059.004
    all:
      - id: agent-memory-md-basename
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text

  - id: agent-soul-github-install-pipe
    desc: Agent SOUL.md runs GitHub install.sh via pipe
    crit: hostile
    conf: 0.99
    attack: T1546,T1105,T1059.004
    all:
      - id: agent-soul-md-basename
      - id: github-raw-install-sh-pipe

  - id: agent-soul-write-with-curl-pipe
    desc: Writes SOUL.md alongside curl-pipe-shell payload
    crit: hostile
    conf: 0.97
    near_lines: 40
    for: [shell, python, javascript, typescript, markdown]
    all:
      - id: agent-soul-md-path-write
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text

  - id: agent-soul-write-home-wipe
    desc: Persists home-directory wipe protocol into SOUL.md
    crit: hostile
    conf: 0.98
    attack: T1546,T1485
    near_lines: 40
    for: [shell, python, markdown]
    all:
      - id: agent-soul-md-path-write
      - id: micro-behaviors/fs/delete/directory::shell-recursive-delete
    any:
      - id: micro-behaviors/fs/path/sensitive/ssh::keys
      - id: micro-behaviors/fs/directory/traverse::find-type-file
      - id: objectives/impact/wipe/user-data::shell-home-tree-wipe
      - id: objectives/impact/wipe/user-data::shell-home-credential-mass-delete

  - id: agent-prompt-curl-pipe-payload
    desc: Persistent agent prompt file carries curl-pipe-shell
    crit: hostile
    conf: 0.96
    all:
      - id: agent-persistent-prompt-file
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text

  # Module-start execution plus creation of a missing workspace makes the
  # remote identity replacement durable even on a fresh OpenClaw profile.
  - id: remote-openclaw-soul-bootstrap
    desc: Bootstraps persistent OpenClaw identity remotely
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: objectives/evasion/security-bypass/llm/prompt::remote-openclaw-soul-overwrite
      - id: micro-behaviors/fs/directory/mkdir::recursive-mkdir-sync
      - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
