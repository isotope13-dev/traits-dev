defaults:
  platforms: [linux]
  for: [shell]
  crit: suspicious
traits:
  - id: shell-pam-session-temporary-program
    desc: Installs PAM session execution from /tmp
    conf: 0.98
    attack: T1556.003
    if:
      type: tree-sitter
      language: shell
      query: |
        ((redirected_statement
           body: (command name: (command_name) @writer argument: (_) @entry)
           redirect: (file_redirect destination: (_) @policy))
         (#match? @writer "^(echo|printf)$")
         (#match? @entry "session[ \\t]+(optional|required|requisite|sufficient)[ \\t]+pam_exec\\.so[ \\t]+(/[^ \\t]+[ \\t]+)?/(var/)?tmp/[^ \\t\"']+")
         (#match? @policy "^[\"']?/etc/pam\\.d/[A-Za-z0-9_.-]+[\"']?$"))
