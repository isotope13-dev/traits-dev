# Cloud-account persistence through an attacker-enrolled passkey. Passkey
# management is legitimate on its own; the hostile inference requires the
# authenticated session to have come from a live browser-in-the-middle relay
# and the same CDP workflow to navigate and click inside passkey settings.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1098

composite_rules:
  - id: phished-session-passkey-enrollment
    desc: Plants a Google passkey through a relayed authenticated session
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/credential-access/phishing/mfa-relay::cdp-google-bitm-input-relay
      - id: micro-behaviors/communications/http/services/google::google-passkey-settings-navigation
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-page-navigate
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-input-dispatch-mouse-event
    near_lines: 260
