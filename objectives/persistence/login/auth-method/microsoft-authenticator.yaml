# MFA-method replacement on a Microsoft account
# (Huntress, token-replay-spray, 2026-10-22).
#
# In 19 organizations the victim's existing MFA methods were wiped through
# the security-info / Graph authentication-method APIs and a new
# authenticator registered within three hours of the first replayed
# sign-in, so attacker access survived session revocation and password
# resets.  A help desk can legitimately delete and re-register a method,
# so the wipe-and-register shape alone is suspicious; it is hostile when
# the same file obtains its session by bulk-replaying stolen refresh
# tokens as a first-party client.
#
# ATT&CK: T1556.006, T1098.005, T1550.001
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1556.006

composite_rules:
  - id: authenticator-method-wipe-and-register
    desc: Deletes authentication methods and registers an authenticator
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/entra-directory::graph-authentication-method-delete
    any:
      - id: micro-behaviors/communications/http/services/entra-directory::microsoft-authenticator-method-odata-type
      - id: micro-behaviors/communications/http/services/entra-directory::graph-microsoft-authenticator-methods-endpoint
    near_lines: 80

  - id: replayed-token-authenticator-replacement
    desc: Replaces MFA methods using bulk-replayed refresh tokens
    crit: hostile
    conf: 0.98
    attack: T1556.006,T1550.001,T1528
    all:
      - id: authenticator-method-wipe-and-register
      - id: objectives/credential-access/cloud/token/oauth::bulk-first-party-refresh-token-replay
    near_bytes: 8192
