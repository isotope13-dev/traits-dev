# A DELETE endpoint mention or GET alone does not establish replacement.
# Require an attempted registration POST; API success is not asserted.
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  attack: T1556.006
composite_rules:
- id: authentication-method-replacement-requests
  desc: MFA DELETE and Authenticator POST co-occur
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/delete::mfa-method-delete-request
  any:
  - id: micro-behaviors/communications/http/post::authenticator-registration-post-call
  - id: micro-behaviors/communications/http/post::fetch-authenticator-registration-post
  - id: micro-behaviors/communications/http/post::powershell-authenticator-registration-post
  near_lines: 80
- id: replayed-token-authenticator-replacement
  desc: Bulk token replay with MFA replacement requests
  crit: hostile
  conf: 0.98
  attack: T1556.006,T1550.001,T1528
  all:
  - id: authentication-method-replacement-requests
  - id: objectives/credential-access/cloud/token/oauth::bulk-first-party-refresh-token-replay
  near_bytes: 8192
