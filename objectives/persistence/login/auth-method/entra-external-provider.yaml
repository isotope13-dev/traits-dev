# Registering an external authentication method makes Entra accept the
# provider's id_tokens as MFA for every user in scope. Pairing that
# registration with a provider that captures passwords or mints fabricated
# hardware-key claims is a tenant MFA backdoor, not an integration.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1556.006,T1098
composite_rules:
  - id: rogue-entra-external-mfa-provider-registration
    desc: Registers credential-capturing provider as Entra MFA
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/services/entra-directory::graph-external-auth-method-config-type
    any:
      - id: objectives/credential-access/phishing/external-provider::entra-external-auth-password-file-capture
      - id: objectives/credential-access/phishing/external-provider::entra-external-auth-fabricated-hardware-mfa
