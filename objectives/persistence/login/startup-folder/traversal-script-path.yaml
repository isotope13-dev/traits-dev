# A traversal target in an automatic-execution directory is an intent clue;
# this path observation does not assert that a transfer or write succeeded.
defaults:
  platforms: [windows]
  for: [json, batch]
traits:
  - id: traversal-startup-script-path
    desc: Traversal path names a Startup payload
    crit: suspicious
    conf: 0.95
    attack: T1547.001
    if:
      type: text
      exclude_comments: true
      case_insensitive: true
      regex: '(\.\.[\\/]+){2,}[^"\n]{0,180}Programs[\\/]+Startup[\\/]+[^"\\/]{1,80}\.(bat|cmd|ps1)"'
