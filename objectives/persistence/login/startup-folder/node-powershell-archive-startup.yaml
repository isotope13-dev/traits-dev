defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1059.001,T1105,T1547.001

traits:
  - id: node-powershell-archive-startup-command
    desc: Stages archive download and startup copy
    crit: notable
    if:
      type: tree-sitter
      query: |
        ((call_expression function: (identifier) @spawn
          arguments: (arguments (string (string_fragment) @powershell)
            (array (binary_expression) @command))) @evidence
          (#eq? @spawn "spawn")
          (#eq? @powershell "powershell")
          (#match? @command "(?i)\\biwr\\s+['\"]https?://")
          (#match? @command "(?i)Expand-Archive")
          (#match? @command "(?i)Copy-Item")
          (#match? @command "(?i)Start Menu.*Programs.*Startup"))

composite_rules:
  - id: node-powershell-archive-startup
    desc: Stages downloaded archives and startup script
    crit: hostile
    conf: 0.99
    all:
      - id: node-powershell-archive-startup-command
      - id: metadata/import/builtin::child-process-module-reference
