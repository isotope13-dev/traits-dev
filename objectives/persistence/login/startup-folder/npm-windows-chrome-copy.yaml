defaults:
  for: [javascript]
  platforms: [windows]
  attack: T1547.001,T1036.005

traits:
  - id: windows-chrome-source
    desc: Selects fixed disguised executable
    crit: notable
    if:
      type: text
      substr: 'GooglK\\Chrome.exe'
  - id: windows-chrome-startup
    desc: Selects user startup folder
    crit: notable
    if:
      type: text
      substr: 'Microsoft\\Windows\\Start Menu\\Programs\\Startup'
  - id: windows-chrome-name
    desc: Names startup copy as browser executable
    crit: notable
    if:
      type: text
      substr: 'resolve(startupFolder,"Chrome.exe")'
  # A bare existsSync(sourceFile); only the startup-copy composite gives it meaning.
  - id: windows-chrome-check
    desc: Checks for preexisting source executable
    crit: component
    if:
      type: text
      substr: 'existsSync(sourceFile)'
  - id: windows-chrome-copy
    desc: Copies executable into startup folder
    crit: notable
    if:
      type: text
      substr: 'copyFileSync(sourceFile,destFile)'
  - id: windows-chrome-exec
    desc: Executes copied startup executable
    crit: notable
    if:
      type: text
      substr: 'g7h8i9(`"${destFile}"`'

composite_rules:
  - id: windows-chrome-startup-copy
    desc: Copies and runs disguised startup executable
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/files/included::javascript-index-basename
      - id: windows-chrome-source
      - id: windows-chrome-startup
      - id: windows-chrome-name
      - id: windows-chrome-check
      - id: windows-chrome-copy
      - id: windows-chrome-exec
      - id: micro-behaviors/time/schedule/delay::settimeout-arrow-callback-text
  - id: npm-windows-chrome-startup-copy
    desc: Package import installs disguised startup executable
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: metadata/package/entrypoint/module::has-index-entry
      - id: windows-chrome-startup-copy
