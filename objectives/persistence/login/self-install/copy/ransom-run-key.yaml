defaults:
  platforms: [windows]
  for: [pe]
  attack: T1547.001

composite_rules:
  - id: ransom-self-copy-run-key
    desc: Ransom demand with self-copy and Run-key write APIs
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/impact/ransom/note::native-encryption-recovery-demand
      - id: micro-behaviors/fs/file/copy/call
      - id: micro-behaviors/process/info/current::get-module-filename
      - id: micro-behaviors/os/registry/value/write::registry-set-value-api
    any:
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path
      - id: micro-behaviors/os/registry/autostart/reference::utf16-currentversion-run-key
