# A Ruby program packaged into an executable copies that executable to a fixed
# path and then writes the copy into the Windows Run key, so the script
# reinstalls itself at every logon.
defaults:
  for: [ruby]
  platforms: [windows]
  attack: T1547.001

traits:
  - id: ruby-registry-run-value-write
    desc: Ruby opens the Run key for writing
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'Registry\.open\([^\n]{0,80}CurrentVersion\\Run[''"][^\n]{0,80}KEY_WRITE'

composite_rules:
  - id: ruby-packaged-exe-self-copy-run-key
    desc: Ruby self-copies and registers Run persistence
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/registry/keys/autostart::ruby-self-copy-run-key-reference-context
      - id: ruby-registry-run-value-write
