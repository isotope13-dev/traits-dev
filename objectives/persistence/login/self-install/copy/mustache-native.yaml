defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1547.001

traits:
  - id: mustache-reg-path-placeholder
    desc: Mustache registry-path install placeholder
    crit: component
    conf: 0.95
    if:
      type: text
      exact: '{{REG_PATH}}'
  - id: mustache-reg-name-placeholder
    desc: Mustache registry-name install placeholder
    crit: component
    conf: 0.95
    if:
      type: text
      exact: '{{REG_NAME}}'
  - id: mustache-base-var-placeholder
    desc: Mustache base-directory install placeholder
    crit: component
    conf: 0.94
    if:
      type: text
      exact: '{{BASE_VAR}}'
  - id: mustache-sub-fld-placeholder
    desc: Mustache install subdirectory placeholder
    crit: component
    conf: 0.94
    if:
      type: text
      exact: '{{SUB_FLD}}'
  - id: mustache-sub-nam-placeholder
    desc: Mustache installed-filename placeholder
    crit: component
    conf: 0.94
    if:
      type: text
      exact: '{{SUB_NAM}}'

composite_rules:
  - id: pe-mustache-install-template-cluster
    desc: PE embeds clustered mustache install-path templates
    crit: suspicious
    conf: 0.96
    needs: 2
    any:
      - id: mustache-reg-path-placeholder
      - id: mustache-reg-name-placeholder
      - id: mustache-base-var-placeholder
      - id: mustache-sub-fld-placeholder
      - id: mustache-sub-nam-placeholder

  - id: mustache-templated-registry-self-install
    desc: Native RAT copies itself and registers a templated install path
    crit: hostile
    conf: 0.99
    attack: T1547.001,T1105
    all:
      - id: pe-mustache-install-template-cluster
      - id: micro-behaviors/fs/file/copy::copyfile-a
      - id: micro-behaviors/fs/path/check::get-module-filename
      - id: micro-behaviors/os/registry/manipulate::reg-create-key-ex-a
      - id: micro-behaviors/os/registry/access::reg-set-value-ex-text
      - id: objectives/command-and-control/backdoor/binary::native-profile-file-control-rat
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/
