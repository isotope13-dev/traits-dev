defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1547.001

composite_rules:
  - id: windows-appdata-self-copy
    desc: Self-copy into Windows AppData
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/fs/file/copy::copyfile-w
      - id: micro-behaviors/fs/path/check::get-module-filename
      - id: micro-behaviors/fs/shell-ops::shell-get-folder-path
      - id: micro-behaviors/time/query::get-tick-count
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/
      - id: metadata/binary/resource/identity::pe-version-resource
    downgrade:
      any:
        - id: metadata/signed/developer
        - id: metadata/binary/symbols/count::many-imports

  - id: windows-systemdir-self-copy-run-key
    desc: Self-copy into Windows system directory with Run key
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/file/copy::copyfile-a
      - id: micro-behaviors/fs/path/check::get-module-filename
      - id: micro-behaviors/fs/path/system::windows-system-drop-template
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path"
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/

  - id: windir-copy-winexec-dropper
    desc: Drop into Windows directory and WinExec
    crit: suspicious
    conf: 0.92
    size_max: 1048576
    all:
      - id: micro-behaviors/os/sysinfo/directories::get-windows-directory
      - id: micro-behaviors/fs/file/copy::copyfile-a
      - id: micro-behaviors/process/create/exec::winexec
    any:
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
      - id: micro-behaviors/fs/file/open::file-create-win
      - id: micro-behaviors/fs/write/file/handle::write-file
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/native/pywin32::pywin32-binding-module
    downgrade:
      any:
        - id: metadata/binary/resource/identity::pe-version-resource
        - id: metadata/binary/symbols/count::many-imports

  - id: windir-copy-winexec-drive-walker-worm
    desc: Windows-directory dropper that walks drives
    crit: hostile
    conf: 0.93
    attack: T1547.001,T1091
    size_max: 1048576
    all:
      - id: windir-copy-winexec-dropper
      - id: micro-behaviors/fs/traversal/drives::logical-drive-type-enumeration
      - id: micro-behaviors/fs/file/timestamp::set-file-time-with-walk-and-self-path
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  # Run-key APIs plus hash rotation prove no unwanted activation. The
  # registry/autorun observations remain notable, and deliberate image
  # padding remains suspicious in fs/write/file/executable.
