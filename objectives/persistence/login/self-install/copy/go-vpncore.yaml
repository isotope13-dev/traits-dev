defaults:
  platforms: [windows]
  for: [pe]
  attack: T1547.001
  mbc: F0012
traits:
  - id: go-path-relocation-and-background-launch
    desc: Go self-relocation and background launch
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: main.relocateAndLaunchBackground
  - id: go-currentversion-run-autostart-routine
    desc: Go Windows Run-key autostart routine
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: main.ensureAutoStartForPath
composite_rules:
  - id: go-self-relocation-autostart
    desc: Go program relocates itself and installs logon autostart
    crit: hostile
    conf: 0.98
    all:
      - id: go-path-relocation-and-background-launch
      - id: go-currentversion-run-autostart-routine
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
