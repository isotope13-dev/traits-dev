defaults:
  platforms: [windows]
  for: [javascript, vbs]
  attack: T1547.001,T1047,T1059.007

composite_rules:
  # A Windows Script Host script that copies itself under the Public profile
  # and hands a command to WMI with a hidden startup window installs itself
  # and launches a payload with no visible process of its own. Ordinary
  # utilities do not combine a self-path copy into C:\Users\Public with a
  # hidden Win32_Process.Create.
  - id: wsh-self-copy-public-wmi-hidden-launch
    desc: WSH script copies itself to Public, launches via WMI
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/fs/file/copy::wsh-copy-with-selfpath-reference
      - id: micro-behaviors/fs/path/personal::windows-public-path
      - id: micro-behaviors/process/create/hidden::wmi-hidden-execmethod-process-create
    unless:
      - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
