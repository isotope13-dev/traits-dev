# Windows Script Host self-installation: the running script copies itself
# with FileSystemObject CopyFile fed by WScript.ScriptFullName and RegWrites
# a CurrentVersion\Run value that launches the copy. Classic VBS/JScript worm
# installation (Agui family): the self-copy leg is what separates a worm
# installing itself from an installer script registering a fixed helper.
defaults:
  platforms: [windows]
  for: [vbs, javascript]
  attack: T1547.001
  mbc: F0012

composite_rules:
  - id: wsh-selfcopy-runkey-install
    desc: WSH script installs its own copy via Run key
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/file/copy/source-destination::wsh-copy-with-selfpath-reference
      - id: micro-behaviors/os/registry/value/write::wscript-regwrite
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"

  # Same installation after string-table obfuscation: every member is reached
  # by subscript (`sh["RegWrite"](...)`, `f["Copy"](...)`) and the WScript
  # object is aliased, so the dotted legs above miss. Call facts recover the
  # RegWrite and Copy calls; the self-path survives as a property literal.
  - id: wsh-subscript-selfcopy-runkey-install
    desc: JScript copies itself and writes Run key
    crit: hostile
    conf: 0.94
    for: [javascript]
    all:
      - id: micro-behaviors/fs/file/copy/source-destination::wsh-subscript-copy-with-selfpath-literal
      - id: micro-behaviors/os/registry/value/write::js-regwrite-method-call
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
