# Downloaded response content is written to disk and a repeating scheduled
# task is registered with a PowerShell execution-policy bypass launcher.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1053.005,T1105

composite_rules:
  - id: powershell-download-write-scheduled-task
    desc: Downloads and schedules a PowerShell payload
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/property/access::powershell-content-property-access
      - id: micro-behaviors/fs/write/file/full/string::write-all-text
      - id: micro-behaviors/os/autorun/scheduled::register-scheduledtask
      - id: micro-behaviors/os/security/execution-policy::powershell-policy-bypass-switch-text
    near_lines: 120
    unless:
      - id: well-known/tool/sysadmin/winutil::winutil-utility-context
