# Minute-interval schtasks that launch rundll32 against DllRegisterServer —
# loader persistence rather than ordinary admin scripts.
defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll, batch, powershell]
  attack: T1053.005,T1218.011
  mbc: F0012

traits:
  - id: schtasks-rundll32-dllregister
    desc: schtasks runs rundll32 DllRegisterServer
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?is)schtasks.{0,200}/sc\s+MINUTE.{0,120}rundll32.{0,160}DllRegisterServer'

composite_rules:
  - id: repeating-user-profile-rundll32-persist
    desc: Repeating scheduled task loads a user-profile DLL
    crit: hostile
    conf: 0.99
    for: [batch, powershell, vbs, javascript, python, csharp, pe, dll]
    all:
      - id: objectives/execution/lolbin/os::scheduled-user-profile-rundll32-execution
      - id: micro-behaviors/os/autorun/scheduled::schtasks-short-repeat-schedule
    near_bytes: 2048

  - id: minute-rundll32-loader-persist
    desc: Minute schtasks rundll32 loader persist
    crit: hostile
    conf: 0.97
    all:
      - id: schtasks-rundll32-dllregister
    any:
      - id: objectives/persistence/login/scheduled-task/interval::schtasks-minute-short-interval
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-source
    near_bytes: 2048
