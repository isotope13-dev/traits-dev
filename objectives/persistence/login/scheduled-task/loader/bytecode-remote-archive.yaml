defaults:
  for: [pyc]
  platforms: [windows]
composite_rules:
  - id: bytecode-remote-archive-dual-autostart-bot
    desc: Archive launcher with dual autostart and bot
    crit: hostile
    conf: 0.95
    attack: T1053.005,T1547.001,T1105
    all:
      - id: micro-behaviors/os/autorun/task-trigger::bytecode-schtasks-hourly-create
      - id: micro-behaviors/os/registry/keys/autostart::pyc-hkcu-run-key
      - id: micro-behaviors/communications/http/services/telegram::bytecode-telegram-bot-url
      - id: micro-behaviors/communications/http/services/file-hosting::bytecode-pastebin-raw-url
      - id: micro-behaviors/data/archive/extract/capability::bytecode-archive-extractall-name
      - id: micro-behaviors/process/create/shellexec::bytecode-shell-execute-name
