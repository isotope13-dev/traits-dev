defaults:
  platforms: [windows]
  for: [javascript]
composite_rules:
  # These operations coexist in one source file; the rule does not claim
  # downloads, elevation, or task registration succeeded.
  - id: node-elevated-boot-task-hidden-jar-stage
    desc: Elevated boot task and hidden Java stage
    crit: hostile
    conf: 0.97
    attack: T1053.005,T1105,T1059.007,T1548.002
    near_bytes: 6000
    all:
      - id: micro-behaviors/os/privilege/elevation::node-powershell-start-process-runas
      - id: micro-behaviors/os/autorun/task-registration::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/task-principal::schtasks-system-runas
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-onstart-schedule
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: micro-behaviors/data/archive/extract/zip::js-zip-extract-all-to
      - id: micro-behaviors/process/argument/interpreter::node-jar-launch-argument
      - id: micro-behaviors/process/create/hidden::detached-silent-hidden-spawn
