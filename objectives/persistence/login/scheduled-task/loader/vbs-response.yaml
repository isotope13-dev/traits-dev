defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1053.005,T1105
composite_rules:
  - id: vbs-response-save-appdata-task
    desc: Saves HTTP response beside AppData executable task creation
    crit: hostile
    conf: 0.96
    near_bytes: 1800
    all:
      - id: micro-behaviors/fs/write/stream::vbs-write-http-response-body
      - id: micro-behaviors/fs/write/stream::wsh-savetofile
      - id: micro-behaviors/os/autorun/scheduled::schtasks-appdata-executable-command
