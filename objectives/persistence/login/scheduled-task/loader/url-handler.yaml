defaults:
  for: [text, xml]
  platforms: [windows]
  crit: hostile
  conf: 0.98
  attack: T1053.005,T1218.011

composite_rules:
  - id: logon-url-handler-executable
    desc: Logon task proxies executable launch through rundll32 URL handler
    all:
      - id: micro-behaviors/os/autorun/task-xml-scheduled::task-xml-namespace-reference
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-logon-trigger-xml
      - id: objectives/execution/lolbin/rundll32::task-url-handler-exe-action
