defaults:
  platforms: [windows]
  for: [scripts, source, binaries, lnk]
  crit: suspicious
  conf: 0.98
  attack: T1053.005,T1218.002,T1105
composite_rules:
  - id: remote-applet-task
    desc: Scheduled task creation accompanies remote Control Panel applet loading
    near_lines: 2
    all:
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
    any:
      - id: objectives/execution/lolbin/control::unc-applet-command
      - id: objectives/execution/lolbin/rundll32::control-rundll-unc-applet
