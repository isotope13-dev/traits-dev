# Scheduled-task persistence pointing at a user-writable Lua sidecar loader.
defaults:
  crit: suspicious
  platforms: [windows]
  for: [batch, lua, text]
  attack: T1053.005,T1105

traits:
composite_rules:
  - id: scheduled-task-user-writable-sidecar
    desc: User-writable scheduled sidecar loader
    conf: 0.96
    all:
      - id: micro-behaviors/os/autorun/control::scheduled-task-user-path
      - id: micro-behaviors/process/argument/file::executable-data-or-script-file-argument
    any:
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
    needs: 1

  - id: scheduled-task-sidecar-loader
    for: [batch]
    desc: Downloaded scheduled sidecar loader
    conf: 0.98
    all:
      - id: scheduled-task-user-writable-sidecar
      - id: micro-behaviors/communications/http/download/curl::batch-curl-download-to-temp
