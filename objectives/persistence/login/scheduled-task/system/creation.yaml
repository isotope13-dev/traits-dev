# Malformed PE carrier with repeating SYSTEM task creation commands.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1053.005
  mbc: F0012

composite_rules:
  - id: non-installer-repeating-system-task-carrier
    desc: Malformed PE carrier creates a repeating SYSTEM task
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-minute-or-hourly-option
      - id: micro-behaviors/os/autorun/scheduled::schtasks-system-runas
      - id: metadata/binary/header/malformed::malformed-pe-structure
      - id: metadata/binary/layout/embedded::embedded-pe-three-plus
    unless:
      - id: well-known/lib/platform/wine/
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
