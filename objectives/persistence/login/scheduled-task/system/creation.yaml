# SYSTEM-level scheduled task creation tokens.
#
# A binary that uses the Task Scheduler 2.0 API (ITaskService /
# RegisterTaskDefinition) AND references the elevation tokens
# `TASK_LOGON_SERVICE_ACCOUNT` + `TASK_RUNLEVEL_HIGHEST` is
# programmatically creating a scheduled task that runs as
# NT AUTHORITY\SYSTEM. Combined with a `TASK_TRIGGER_BOOT` or
# `TASK_TRIGGER_LOGON` trigger this is SYSTEM-level boot persistence.
#
# Legitimate installers (MSI, Inno, NSIS, Squirrel) do this — the
# composite excludes those contexts. Anything else creating a SYSTEM
# task at install time is a malware-class persistence pattern.
defaults:
  platforms: [windows]
  for: [pe]
  attack: "T1053.005"
  mbc: "F0012"

traits:
  - id: task-logon-service-account-token
    desc: TASK_LOGON_SERVICE_ACCOUNT enum reference
    crit: notable
    conf: 0.93
    if:
      type: text
      word: TASK_LOGON_SERVICE_ACCOUNT
    unless:
      - id: metadata/library/generated::winmd-metadata

  - id: task-runlevel-highest-token
    desc: TASK_RUNLEVEL_HIGHEST elevation token
    crit: notable
    conf: 0.92
    if:
      type: text
      word: TASK_RUNLEVEL_HIGHEST
    unless:
      - id: metadata/library/generated::winmd-metadata

  - id: task-trigger-boot-token
    desc: TASK_TRIGGER_BOOT trigger token
    crit: notable
    conf: 0.92
    if:
      type: text
      word: TASK_TRIGGER_BOOT
    unless:
      - id: metadata/library/generated::winmd-metadata

  - id: task-trigger-logon-token
    desc: TASK_TRIGGER_LOGON trigger token
    crit: notable
    conf: 0.9
    if:
      type: text
      word: TASK_TRIGGER_LOGON
    unless:
      - id: metadata/library/generated::winmd-metadata

composite_rules:
  - id: non-installer-repeating-system-task-carrier
    desc: Malformed PE carrier creates a repeating SYSTEM task
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/scheduled::schtasks-short-repeat-schedule
      - id: micro-behaviors/os/autorun/scheduled::schtasks-system-runas
      - id: metadata/binary/metrics/structural::malformed-pe-structure
      - id: metadata/binary/metrics/structural::embedded-pe-three-plus
    unless:
      - id: well-known/lib/platform/wine/
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/


  - id: system-scheduled-task-creation
    desc: Programmatic SYSTEM-level scheduled-task creation
    crit: suspicious
    conf: 0.95
    needs: 3
    any:
      - id: objectives/persistence/login/scheduled-task/system::batch-panos-highest-task-runlevel
      - id: objectives/persistence/login/scheduled-task/system::batch-panos-system-logon-task
      - id: micro-behaviors/os/autorun/scheduled::itaskservice-interface
      - id: micro-behaviors/os/autorun/scheduled::register-task-definition
      - id: objectives/persistence/login/scheduled-task/system::task-logon-service-account-token
      - id: objectives/persistence/login/scheduled-task/system::task-runlevel-highest-token
      - id: objectives/persistence/login/scheduled-task/system::task-trigger-boot-token
      - id: objectives/persistence/login/scheduled-task/system::task-trigger-logon-token
    unless:
      - id: well-known/lib/platform/wine/
      - id: metadata/signed/platform/
      - id: metadata/signed/platform::microsoft-windows
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/
      - id: metadata/binary/installer/script/
      - id: metadata/binary/installer/sfx/

  - id: non-installer-system-task-boot-persistence
    desc: Non-installer binary creates SYSTEM boot-persisted task
    crit: hostile
    conf: 0.97
    all:
      - id: system-scheduled-task-creation
    any:
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/platform::microsoft-windows
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/
      - id: metadata/binary/installer/script/
      - id: metadata/binary/installer/sfx/
