# PowerShell ScheduledTasks cmdlet persistence
# ATT&CK: T1053.005 (Scheduled Task/Job: Scheduled Task)
defaults:
  platforms: [windows]
  for: [powershell, batch, go]
  attack: T1053.005
  mbc: F0012
traits:
- id: schtask-where-object-taskname
  desc: Where-Object filtering by TaskName
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: Where-Object\s+\{\s*\$\_.TaskName\s+-like
    case_insensitive: true
- id: software-protection-task-name
  desc: 'Software Protection task name'
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: Software Protection
    case_insensitive: true
composite_rules:
# A hidden at-logon task whose action is an executable just downloaded by
# Invoke-WebRequest. Highest run level is the privilege leg. Administrators
# who only schedule maintenance do not pair that task with a remote EXE fetch.
- id: hidden-logon-task-for-downloaded-exe
  desc: Hidden logon task runs a downloaded executable
  crit: hostile
  conf: 0.97
  for: [powershell, pe]
  attack: T1053.005,T1105
  near_bytes: 8192
  all:
  - id: micro-behaviors/os/autorun/scheduled::register-scheduledtask
  - id: micro-behaviors/os/autorun/scheduled::schtask-trigger-at-logon
  - id: micro-behaviors/os/autorun/scheduled::scheduledtask-hidden-settings
  - id: micro-behaviors/os/autorun/scheduled::schtask-runlevel-highest
  - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
  any:
  - id: micro-behaviors/communications/http/url/scheme::http-executable-url-in-binary
  - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: schtask-explorer-lnk-launcher
  for: [powershell]
  desc: Scheduled task proxies via explorer.exe LNK launcher
  crit: hostile
  conf: 0.95
  all:
  - id: schtask-launches-explorer-arg
  - id: micro-behaviors/os/autorun/scheduled::register-scheduledtask
- id: schtask-system-multi-trigger
  for: [powershell]
  desc: Scheduled task as SYSTEM with multiple triggers
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/os/autorun/scheduled::register-scheduledtask
  - id: micro-behaviors/os/autorun/scheduled::scheduledtask-system-principal
  any:
  - id: micro-behaviors/os/autorun/scheduled::schtask-trigger-at-startup
  - id: micro-behaviors/os/autorun/scheduled::schtask-trigger-at-logon
  - id: micro-behaviors/os/autorun/scheduled::scheduledtask-repeating-trigger
  needs: 2
  unless:
  - id: well-known/app/system/open-endpoint-events::administration-uploader-context
  - id: well-known/tool/sysadmin/kubernetes
# SYSTEM, highest run level and an at-startup trigger are how administrators
# schedule driver and network-adapter maintenance as much as how a payload
# persists; with no payload or concealment leg the pairing is a privileged
# persistence surface, not an attack.
- id: schtask-system-startup-persistence
  for: [powershell]
  desc: Scheduled task as SYSTEM at startup
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/os/autorun/scheduled::register-scheduledtask
  - id: micro-behaviors/os/autorun/scheduled::scheduledtask-system-principal
  - id: micro-behaviors/os/autorun/scheduled::schtask-runlevel-highest
  - id: micro-behaviors/os/autorun/scheduled::schtask-trigger-at-startup
  unless:
  - id: well-known/app/system/open-endpoint-events::administration-uploader-context
  - id: well-known/tool/sysadmin/kubernetes
  # Same file as the Packer Windows runner image: the task starts the
  # baked-in actions-runner script. The notable registration atoms remain.
  - id: metadata/build/ci/agent::ci-runner-windows-configuration-context
- id: hidden-encoded-repeating-task-persistence
  for: [powershell]
  desc: Hidden encoded PowerShell task persistence
  crit: hostile
  conf: 0.98
  attack: T1053.005,T1059.001,T1564.003
  all:
  - id: micro-behaviors/process/create/hidden::encodedcommand-bypass
  - id: micro-behaviors/os/autorun/scheduled::register-scheduledtask
  - id: micro-behaviors/os/autorun/scheduled::scheduledtask-repeating-trigger
  - id: micro-behaviors/os/autorun/scheduled::scheduledtask-hidden-settings
  - id: micro-behaviors/process/create/hidden::powershell-hidden-window
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/sysadmin/kubernetes
- id: software-protection-periodic-task
  desc: Software Protection periodic task
  crit: suspicious
  conf: 0.93
  all:
  - id: software-protection-task-name
  - id: micro-behaviors/os/autorun/control::schtask-trigger-periodic-repeat
  any:
  - id: micro-behaviors/os/autorun/scheduled::register-scheduledtask
  - id: micro-behaviors/os/autorun/scheduled::new-scheduledtaskaction
  unless:
  - id: well-known/tool/development/toolchain/go-x-build::go-x-build-infra-context
- id: schtask-launches-explorer-arg
  for: [powershell]
  desc: Scheduled task launches explorer.exe with argument
  crit: suspicious
  conf: 0.92
  attack: T1202
  all:
  - id: micro-behaviors/os/autorun/scheduled::new-scheduledtaskaction
  - id: micro-behaviors/os/autorun/control::scheduled-task-action-execute-explorer
  - id: micro-behaviors/os/autorun/control::scheduled-task-action-argument-option
  near_bytes: 4096
