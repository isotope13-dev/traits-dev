defaults:
  platforms: [windows]
  for: [powershell, batch]
composite_rules:
  # A task that re-runs hidden, Base64-encoded PowerShell every few minutes
  # keeps a fileless stage alive; admin tasks call a script path or a plain
  # command and have no reason to encode or hide it. Triaged as hostile.
  - id: short-interval-hidden-encoded-system-task
    desc: SYSTEM task schedules hidden encoded PowerShell
    crit: hostile
    conf: 0.95
    attack: T1053.005
    near_lines: 1
    all:
      - id: micro-behaviors/os/autorun/task-registration::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/task-principal::schtasks-system-runas
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-minute-short-interval
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-window
      - id: micro-behaviors/process/argument/option::powershell-encoded-command-text
  # Cmdlet form of the same observation: New-ScheduledTaskAction runs hidden
  # -EncodedCommand PowerShell on a New-ScheduledTaskTrigger repetition.
  # Seen in the Vinci RAT stager (eSentire, 2026-11): 10-minute repetition.
  - id: repeating-cmdlet-task-hidden-encoded-powershell
    desc: Repeating task cmdlets schedule hidden encoded PowerShell
    crit: hostile
    conf: 0.93
    attack: T1053.005,T1059.001,T1027
    for: [powershell]
    near_lines: 12
    all:
      - id: micro-behaviors/os/autorun/task-action::new-scheduledtaskaction-powershell-execute
      - id: micro-behaviors/os/autorun/task-trigger::scheduledtask-repeating-trigger
      - id: metadata/lang/source/syntax/command/launch::encoded-command-line
      - id: micro-behaviors/process/argument/visibility
