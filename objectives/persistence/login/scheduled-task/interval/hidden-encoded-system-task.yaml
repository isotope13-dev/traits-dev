defaults:
  platforms: [windows]
  for: [powershell, batch]
composite_rules:
  - id: short-interval-hidden-encoded-system-task
    desc: SYSTEM task schedules hidden encoded PowerShell
    crit: suspicious
    conf: 0.95
    attack: T1053.005
    near_lines: 1
    all:
      - id: micro-behaviors/os/autorun/task-registration::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/task-principal::schtasks-system-runas
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-minute-short-interval
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-window
      - id: micro-behaviors/process/argument/option::powershell-encoded-command-text
