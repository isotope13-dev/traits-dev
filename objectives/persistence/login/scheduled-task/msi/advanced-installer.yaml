defaults:
  platforms: [windows]
  for: [oledoc, msi]
  attack: T1053.005
  mbc: F0012
traits:
  - id: msi-taskxml-marker
    desc: MSI embeds task XML data
    crit: component
    conf: 0.96
    for: [msi]
    if:
      type: text
      substr: TaskXml
  - id: msi-pythonw-task-script-reference
    desc: MSI task invokes a Python script
    crit: component
    conf: 0.96
    for: [msi]
    if:
      type: text
      regex: '(?i)pythonw\.exe.{0,240}\.py'
  - id: msi-task-register-delete-sequence
    desc: MSI task is created, run, and deleted
    crit: component
    conf: 0.96
    for: [msi]
    if:
      type: text
      regex: '(?i)schtasks.{0,160}/create.{0,160}/xml.{0,240}/run.{0,200}/delete'
  - id: msi-embedded-usercustomize-hook
    desc: MSI stages Python usercustomize startup hook
    crit: suspicious
    conf: 0.95
    attack: T1059.006,T1574
    for: [msi]
    if:
      type: text
      substr: usercustomize.py
  - id: advanced-installer-task-schema
    desc: MSI scheduled task schema
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: AI_ScheduledTasksUser
  - id: advanced-installer-task-actions
    desc: MSI schedules local task
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: AI_ScheduledTasksUser.{0,40}local computer
  - id: named-update-config-tasks
    desc: Named update config tasks
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: AI_ScheduledTasksUser.{0,40}CheatSpaceUpdateTaskCheatSpaceConfigTask
composite_rules:
  - id: msi-taskxml-python-startup-launcher
    desc: MSI embeds Python startup task XML
    crit: suspicious
    conf: 0.96
    attack: T1053.005,T1059.006,T1027
    for: [msi]
    near_bytes: 16000
    all:
      - id: msi-taskxml-marker
      - id: msi-pythonw-task-script-reference
      - id: msi-task-register-delete-sequence
  - id: msi-named-scheduled-task-persistence
    desc: MSI persists with named tasks
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/package/files/msi::msi-installation-database-title
      - id: advanced-installer-task-schema
      - id: advanced-installer-task-actions
      - id: named-update-config-tasks
  - id: msi-repeating-hidden-powershell-persistence
    desc: MSI persists through a repeating hidden encoded PowerShell task
    crit: hostile
    conf: 0.99
    attack: T1053.005,T1059.001,T1027
    all:
      - id: metadata/package/files/msi::msi-installation-database-title
      - id: micro-behaviors/os/autorun/scheduled::new-scheduledtasktrigger-encoded
      - id: micro-behaviors/os/autorun/scheduled::scheduledtask-repetition-interval-encoded
      - id: micro-behaviors/os/autorun/scheduled::new-scheduledtaskaction-encoded
      - id: micro-behaviors/process/create/installer::msi-powershell-executable-encoded
      - id: micro-behaviors/process/create/installer::msi-encoded-command-option
  - id: msi-taskxml-python-startup-persistence
    desc: MSI runs a staged Python startup hook through a task XML action
    crit: hostile
    conf: 0.98
    attack: T1053.005,T1059.006,T1027,T1195.002
    for: [msi]
    all:
      - id: metadata/package/files/msi::msi-installation-database-title
      - id: msi-taskxml-python-startup-launcher
      - id: msi-embedded-usercustomize-hook
