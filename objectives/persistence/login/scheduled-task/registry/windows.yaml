# Registry-backed scheduled-task persistence.  The path and executable-value
# combination is the concrete behavior shown in the threat-monitoring article's
# TI Lookup example; the matchers intentionally accept native APIs and common
# scripting-language registry writers rather than one implementation.
defaults:
  platforms: [windows]
  for: [binaries, scripts, oledoc, batch, powershell, vbs, javascript, typescript, c, cpp, csharp, go, rust, python, java, ruby, php, perl, shell]
  attack: T1053.005,T1112
  mbc: F0012

composite_rules:
  - id: registry-scheduled-task-executable-write
    desc: Scheduled-task registry path receives an executable value
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/registry/keys::task-scheduler-registry-path
      - id: micro-behaviors/os/registry/keys::registry-executable-value-write
    near_lines: 8
