# Registering a hidden repeating task whose action is in a writable data tree
# warrants investigation, but legitimate updaters can share this shape.
# XML supplies the action target, rather than an unrelated ProgramData string.
# Timing, task names and executable basenames are deliberately not identities.
defaults:
  platforms: [windows]
  for: [scripts, source, pe, dll]
  attack: T1053.005

composite_rules:
  - id: hidden-recurring-programdata-action
    desc: COM registration with hidden repeating ProgramData task XML
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-hidden-xml
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-minute-interval-xml
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-programdata-command
    any:
      - id: micro-behaviors/os/autorun/control::task-scheduler-register-task-call
      - id: micro-behaviors/os/autorun/control::register-task-definition
