# A Windows binary that uses Task Scheduler COM interfaces (ITaskService,
# RegisterTaskDefinition, TimeTrigger) to register a repeating task whose
# action launches conhost.exe --headless cmd /c to run BITSAdmin or WSH
# scripts establishes concealed scheduled-task persistence.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: com-headless-download-scheduled-task
    desc: COM scheduled task executes headless downloader or script
    crit: hostile
    conf: 0.97
    attack: T1053.005,T1564.003
    mbc: F0012
    all:
      - id: micro-behaviors/os/autorun/scheduled::itaskservice-interface
      - id: micro-behaviors/os/autorun/task-registration::register-task-definition
      - id: micro-behaviors/process/create/hidden::conhost-split-headless-cmd
    any:
      - id: micro-behaviors/communications/http/download/cli/utility::bitsadmin-transfer-command-text
      - id: micro-behaviors/process/info/name::windows-script-host-switch-invocation
      - id: micro-behaviors/process/info/name::windows-script-host-executable-reference
    needs: 1
    unless:
      - id: metadata/signature/verified/platform/
