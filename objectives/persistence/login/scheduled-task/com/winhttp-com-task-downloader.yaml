defaults:
  platforms: [windows]
  for: [pe]
  attack: T1053.005,T1105
  mbc: F0012

composite_rules:
  - id: unsigned-winhttp-com-scheduled-task-dropper
    desc: Unsigned WinHTTP downloader registers COM scheduled task hidden
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/os/autorun/scheduled::task-scheduler-com-clsid
      - id: micro-behaviors/os/com/instantiation::co-create-instance
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-response-flow
      - id: micro-behaviors/process/config/window::x64-createprocess-no-window
    any:
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe
      - id: micro-behaviors/communications/url/resource-path/archive::executable-remote-archive-url
    unless:
      - id: metadata/installer/product/
