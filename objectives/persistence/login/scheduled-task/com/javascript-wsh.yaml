defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1053.005
traits:
- id: register-task-fragment
  desc: RegisterTask/RegisterTaskDefinition fragment
    # Composite vocabulary: the Task Scheduler registration token alone is
    # meaningless (it substringed out of Arrow's `RegisterTabularFunction`),
    # so it stays a component leg of the obfuscated-task composite.
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\bRegisterTask(Definition)?\b'
- id: task-actions-token
  desc: Task Scheduler Actions token
    # `Actions` is a common object/property name in browser bundles. Keep it
    # as a composite leg with the complete COM scheduler shape.
  crit: component
  conf: 0.86
  if:
    type: text
    word: Actions
- id: task-startwhenavailable-fragment
  desc: StartWhenAvailable task setting fragment
  crit: notable
  conf: 0.88
  if:
    type: text
    substr: StartWhenA
- id: task-triggers-token
  desc: Task Scheduler Triggers token
  crit: component
  conf: 0.86
  if:
    type: text
    word: Triggers
- id: unicode-shifted-schedule-fragment
  desc: Unicode-shifted Schedule fragment
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: "سكوم"
- id: unicode-shifted-service-fragment
  desc: Unicode-shifted Service fragment
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: "سمْٖ"
- id: unicode-shifted-register-fragment
  desc: Unicode-shifted Register fragment
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: "زمهىٓ"
- id: unicode-shifted-logon-trigger-fragment
  desc: Unicode-shifted LogonTrigger fragment
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: "شْىههمْ؞"
- id: unicode-shifted-hidden-true-fragment
  desc: Unicode-shifted Hidden true XML fragment
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: "للمَ؞ْٕٔ"
composite_rules:
- id: jscript-self-copy-hidden-logon-task
  desc: JScript persists a self-copy as a hidden logon task
  crit: hostile
  conf: 0.99
  attack: T1053.005,T1547
  all:
  - id: micro-behaviors/os/autorun/scheduled::task-scheduler-com-progid
  - id: micro-behaviors/os/autorun/control::task-scheduler-register-task-call
  - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-logon-trigger-xml
  - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-hidden-xml
  - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
  # The self-copy leg (not the proximity-gated fso-copyfile): junk padding
  # separates the FSO factory from the CopyFile call in padded droppers.
  - id: micro-behaviors/fs/file/copy::wsh-copy-with-selfpath-reference
  - id: micro-behaviors/process/info/name::windows-script-host-executable-reference
- id: obfuscated-jscript-hidden-scheduled-task
  desc: Obfuscated JScript creates a PowerShell scheduled task
  crit: hostile
  conf: 0.97
  attack: T1053.005, T1059.001
  mbc: F0012
  all:
  - id: micro-behaviors/os/autorun/scheduled::task-scheduler-com-progid
  - id: register-task-fragment
  - id: micro-behaviors/os/autorun/control::task-scheduler-newtask-token
  - id: task-triggers-token
  - id: task-actions-token
  - id: task-startwhenavailable-fragment
  - id: micro-behaviors/process/argument/option::escaped-noprofile-policy-bypass-fragment
  - id: micro-behaviors/os/com/automation::activex-constructor-call
  any:
  - id: objectives/anti-static/obfuscation/syntax::js-while-switch-state-machine
  - id: metadata/lang/javascript-features::pipe-delimited-digit-literal
- id: utf16-shifted-hidden-logon-scheduled-task
  desc: Unicode-shifted JScript registers hidden logon persistence
  crit: hostile
  conf: 0.99
  attack: T1027,T1053.005
  all:
  - id: unicode-shifted-schedule-fragment
  - id: unicode-shifted-service-fragment
  - id: unicode-shifted-register-fragment
  - id: unicode-shifted-logon-trigger-fragment
  - id: unicode-shifted-hidden-true-fragment
  - id: objectives/anti-static/obfuscation/string/conceal::js-utf16-arabic-printable-shift-map
- id: task-scheduler-script-drop-registration
  desc: JScript task registration for written script
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/os/autorun/control::register-task-definition
  - id: micro-behaviors/os/autorun/scheduled::task-scheduler-newtask-call
  - id: micro-behaviors/os/autorun/scheduled::task-scheduler-action-create-call
  - id: micro-behaviors/fs/write/content::create-text-file-method-name
  - id: micro-behaviors/os/com/automation::activex-constructor-call
- id: powershell-bypass-scheduled-task-persistence
  desc: JScript registers scheduled task for hidden PowerShell stager
  crit: hostile
  conf: 0.98
  attack: T1053.005,T1059.001
  all:
  - id: micro-behaviors/os/autorun/control::register-task-definition
  - id: micro-behaviors/os/autorun/scheduled::task-scheduler-newtask-call
  - id: micro-behaviors/os/autorun/scheduled::task-scheduler-action-create-call
  - id: micro-behaviors/os/security/policy::execution-policy-bypass
  - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
  - id: micro-behaviors/fs/write/content::create-text-file-method-name
  - id: micro-behaviors/communications/http/client/xmlhttp::xhr-sync-get
  - id: micro-behaviors/communications/http/client/response-body::response-text
