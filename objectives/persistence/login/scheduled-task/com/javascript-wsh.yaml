defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1053.005
traits:
  - id: schedule-service-fragment
    desc: Task Scheduler COM service fragment
    crit: component
    conf: 0.9
    if:
      type: text
      substr: Schedule.S
  - id: register-task-fragment
    desc: RegisterTaskDefinition fragment
    crit: component
    conf: 0.9
    if:
      type: text
      substr: RegisterTa
  - id: new-task-token
    desc: NewTask task scheduler token
    crit: component
    conf: 0.88
    if:
      type: text
      word: NewTask
  - id: task-triggers-token
    desc: Task Scheduler Triggers token
    crit: component
    conf: 0.86
    if:
      type: text
      word: Triggers
  - id: task-actions-token
    desc: Task Scheduler Actions token
    crit: component
    conf: 0.86
    if:
      type: text
      word: Actions
  - id: task-startwhenavailable-fragment
    desc: StartWhenAvailable task setting fragment
    crit: component
    conf: 0.88
    if:
      type: text
      substr: StartWhenA
  - id: unicode-shifted-schedule-fragment
    desc: Unicode-shifted Schedule fragment
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: "سكوم"
  - id: unicode-shifted-service-fragment
    desc: Unicode-shifted Service fragment
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: "سمْٖ"
  - id: unicode-shifted-register-fragment
    desc: Unicode-shifted Register fragment
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: "زمهىٓ"
  - id: unicode-shifted-logon-trigger-fragment
    desc: Unicode-shifted LogonTrigger fragment
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: "شْىههمْ؞"
  - id: unicode-shifted-hidden-true-fragment
    desc: Unicode-shifted Hidden true XML fragment
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: "للمَ؞ْٕٔ"
composite_rules:
  - id: obfuscated-jscript-hidden-scheduled-task
    desc: Obfuscated JScript creates a PowerShell scheduled task
    crit: hostile
    conf: 0.97
    attack: T1053.005, T1059.001
    mbc: F0012
    all:
      - id: schedule-service-fragment
      - id: register-task-fragment
      - id: new-task-token
      - id: task-triggers-token
      - id: task-actions-token
      - id: task-startwhenavailable-fragment
      - id: objectives/command-and-control/dropper/execution/string-reconstruct::token-array-powershell-nop-ep-bypass-escaped
      - id: micro-behaviors/process/interpreter/jscript::activex-object
    any:
      - id: objectives/anti-static/obfuscation/syntax::js-while-switch-state-machine
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::cfg-flatten-state-list
  - id: utf16-shifted-hidden-logon-scheduled-task
    desc: Unicode-shifted JScript registers hidden logon persistence
    crit: hostile
    conf: 0.99
    attack: T1027,T1053.005
    all:
      - id: unicode-shifted-schedule-fragment
      - id: unicode-shifted-service-fragment
      - id: unicode-shifted-register-fragment
      - id: unicode-shifted-logon-trigger-fragment
      - id: unicode-shifted-hidden-true-fragment
      - id: objectives/anti-static/obfuscation/string/conceal::js-utf16-arabic-printable-shift-map
