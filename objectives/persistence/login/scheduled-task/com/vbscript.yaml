defaults:
  platforms: [windows]
  for: [vbs, html, scripts, mp3]
  attack: T1053.005
  mbc: F0012

composite_rules:
  # The service ProgID may be visible or reconstructed from hex fragments.
  # Requiring the task definition, trigger, action, and hidden HTA context
  # keeps ordinary Task Scheduler wrappers below hostile while catching WSH
  # persistence that deliberately hides its API names.
  - id: obfuscated-vbs-hta-scheduled-task-persistence
    desc: Obfuscated HTA registers a scheduled task
    crit: hostile
    conf: 0.99
    attack: T1027,T1053.005,T1218.005,T1564.003
    all:
      - id: micro-behaviors/os/autorun/scheduled::register-task-definition
      - id: micro-behaviors/os/autorun/scheduled::task-scheduler-newtask-call
      - id: micro-behaviors/os/autorun/scheduled::task-scheduler-time-trigger-call
      - id: micro-behaviors/os/autorun/scheduled::task-scheduler-action-create-call
      - id: objectives/evasion/process/hidden/execution::hta-taskbar-hidden
      - id: objectives/anti-static/obfuscation/wsh::vbs-createobject-variable-arg
    any:
      - id: micro-behaviors/os/autorun/scheduled::task-scheduler-com-progid
      - id: micro-behaviors/os/autorun/scheduled::hex-task-scheduler-service
      - id: micro-behaviors/os/autorun/scheduled::hex-task-scheduler-time-trigger
