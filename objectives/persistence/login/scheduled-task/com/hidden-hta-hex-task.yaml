defaults:
  platforms: [windows]
  for: [vbs, html, mp3]
  attack: T1053.005,T1027

composite_rules:
  - id: hidden-hta-registers-obfuscated-task
    desc: Hidden HTA with encoded fragments registers a scheduled task
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: micro-behaviors/ui/window/control::hta-taskbar-hidden
      - id: objectives/anti-static/obfuscation/encoding/hex::vbs-hex-fragment-accumulator
      - id: micro-behaviors/data/property/access::msxml-node-typed-value
    any:
      - id: micro-behaviors/os/autorun/task-registration::register-task-definition
      - id: micro-behaviors/os/autorun/task-registration::task-scheduler-register-task-call
    needs: 1
