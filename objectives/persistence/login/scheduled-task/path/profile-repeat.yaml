defaults:
  platforms: [windows]
  for: [pe, dll, batch, powershell, javascript, typescript, python, go]
  attack: T1053.005
composite_rules:
  - id: short-interval-profile-executable
    desc: Frequent task with AppData executable action
    crit: suspicious
    conf: 0.9
    near_bytes: 512
    all:
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-minute-short-interval
      - id: micro-behaviors/os/autorun/scheduled::schtasks-appdata-executable-command
  - id: forced-short-interval-profile-executable
    for: [pe, dll, batch, powershell, python, go]
    desc: Forced frequent task with AppData executable action
    crit: hostile
    conf: 0.95
    near_bytes: 512
    all:
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-minute-short-interval
      - id: micro-behaviors/os/autorun/scheduled::schtasks-appdata-executable-command
      - id: micro-behaviors/os/autorun/scheduled::schtasks-force-flag
