defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-temp-task-scriptblock-profile
    desc: TEMP scheduled task with ScriptBlock clues
    attack: T1053.005
    all:
      - id: micro-behaviors/process/interpreter/eval/constructed::powershell-webclient-scriptblock-profile
      - id: micro-behaviors/os/autorun/control::schtasks-action-temp-path
      - id: micro-behaviors/os/autorun/scheduled::scheduled-task-registration
    near_bytes: 8192
