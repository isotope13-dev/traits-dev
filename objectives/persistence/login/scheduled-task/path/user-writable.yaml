# Scheduled-task creation pointing into a user-writable path.
#
# `schtasks /create` (or `Register-ScheduledTask`, or `ITaskService::*`)
# creating a task whose action runs a binary out of a user-writable
# directory — %TEMP%, %APPDATA%, %ProgramData%, C:\Users\Public\, or
# raw C:\Users\<name>\... — is post-exploitation persistence.
#
# Legitimate scheduled tasks live under C:\Program Files, C:\Windows,
# or are MSI-managed. A task whose action references a user-writable
# directory is a classic loader/dropper persistence pattern.
defaults:
  platforms: [windows]
  for: [pe, batch, powershell, scripts]
  attack: "T1053.005"
  mbc: "F0012"

traits:
composite_rules:
  - id: schtasks-system-user-writable-path
    for: [pe, batch, python, powershell]
    desc: SYSTEM task executes user-writable target
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/autorun/scheduled::windows-schtasks-create
      - id: micro-behaviors/os/autorun/scheduled::schtasks-system-runas
    any:
      - id: micro-behaviors/os/autorun/control::register-scheduledtask-appdata-target
      - id: micro-behaviors/os/autorun/control::register-scheduledtask-public-target
      - id: micro-behaviors/os/autorun/control::register-scheduledtask-temp-target
      - id: micro-behaviors/os/autorun/control::schtasks-action-appdata-path
      - id: micro-behaviors/os/autorun/control::schtasks-action-programdata-path
      - id: micro-behaviors/os/autorun/control::schtasks-action-public-path
      - id: micro-behaviors/os/autorun/control::schtasks-action-temp-path
      - id: micro-behaviors/os/autorun/control::schtasks-action-userprofile-path
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
