defaults:
  platforms:
  - windows
  for:
  - batch
composite_rules:
- id: excluded-curl-base64-temp-exe-logon-task
  desc: Highest logon task targets the remote-decoded executable in excluded TEMP
  crit: hostile
  conf: 0.99
  attack: T1053.005
  all:
  - id: micro-behaviors/os/autorun/control::curl-base64-temp-exe-logon-highest
  - id: micro-behaviors/os/security/defender::temp-directory-and-process-exclusions
