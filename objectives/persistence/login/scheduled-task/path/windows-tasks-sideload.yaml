# A script downloads DLLs into C:\Windows\Tasks and registers a scheduled task
# that runs an executable from the same folder: a DLL side-load set (a signed
# host EXE beside the malicious DLL it loads) staged where Windows keeps only
# legacy .job files, then relaunched on a schedule. No installer puts
# programs there. APT-C-09 (Patchwork) 2026: msdtc32.exe + msdtctcm.dll,
# relaunched every five minutes as the task "chromeudpate".
defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1053.005,T1105,T1574.002

composite_rules:
  - id: script-web-download-to-file
    desc: Script downloads a URL to a file
    crit: notable
    any:
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::iwr-outfile-download
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::powershell-restmethod-outfile
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call

  - id: script-registers-scheduled-task
    desc: Script registers a scheduled task
    crit: notable
    any:
      - id: micro-behaviors/os/autorun/scheduled::register-scheduledtask
      - id: micro-behaviors/os/autorun/task-registration::register-task-definition
      - id: micro-behaviors/os/autorun/task-registration::schtasks-create-cmd

  - id: windows-tasks-sideload-scheduled
    desc: Downloads DLLs to Windows Tasks and schedules them
    crit: hostile
    conf: 0.96
    all:
      - id: script-web-download-to-file
      - id: micro-behaviors/fs/path/system/state::windows-tasks-dll-file
      - id: micro-behaviors/fs/path/system/state::windows-tasks-exe-file
      - id: script-registers-scheduled-task
