# Scheduled task registered inside the OS-reserved task namespace.
#
# `\Microsoft\Windows\...` is where Windows keeps its own maintenance tasks
# (Defrag\ScheduledDefrags, UpdateOrchestrator\..., Maintenance\...).  Product
# installers register under their own vendor folder or the task-store root;
# they do not write into the Microsoft namespace.  Malware does, precisely
# because an operator scrolling the Task Scheduler reads those names as stock
# OS entries — Interlock hid a Node.js implant behind ScheduledDefrags.
#
# The namespace alone is only half the signal: what convicts is a task wearing
# a built-in OS name whose action runs out of a user-writable staging
# directory, which no genuine Microsoft task ever does.
defaults:
  platforms: [windows]
  for: [batch, powershell, pe, dll, csharp, python, go, rust]
  crit: notable
  conf: 0.92
  attack: T1053.005,T1036.005
  mbc: F0012

traits:
  - id: schtasks-builtin-namespace-name
    desc: Task registered in the Microsoft task namespace
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)schtasks(\.exe)?\s+/create\b.{0,300}/tn\s+"?\\?Microsoft\\Windows\\\S{2,80}'
    unless:
      - id: well-known/app/system/windows-migration::mighost-binary-identity

  - id: powershell-microsoft-taskpath-argument
    desc: PowerShell Microsoft task namespace argument
    crit: suspicious
    conf: 0.96
    for: [powershell]
    if:
      type: text
      regex: '(?i)-TaskPath\s+["'']?\\Microsoft\\Windows\\[A-Za-z0-9_. -]{2,80}'

composite_rules:
  - id: register-scheduledtask-builtin-namespace-path
    desc: PowerShell task uses Microsoft task namespace
    crit: suspicious
    conf: 0.96
    for: [powershell]
    all:
      - id: powershell-microsoft-taskpath-argument
      - id: micro-behaviors/os/autorun/scheduled::register-scheduledtask
    near_bytes: 600

  # Built-in OS task name + payload staged in a user-writable directory.
  - id: builtin-task-namespace-masquerade
    desc: Payload hidden as a built-in Windows task
    crit: hostile
    conf: 0.95
    all:
      - id: schtasks-builtin-namespace-name
    any:
      - id: objectives/persistence/login/scheduled-task/path::schtasks-action-appdata-path
      - id: objectives/persistence/login/scheduled-task/path::schtasks-action-programdata-path
      - id: objectives/persistence/login/scheduled-task/path::schtasks-action-temp-path
    needs: 1
    # The task switches and action are separate parser leaves in batch and
    # PowerShell source, but must remain close within one command/file.
    scope: file
    near_bytes: 2048

  - id: microsoft-namespace-repeating-system-task
    desc: Repeating SYSTEM task masquerades in the Microsoft namespace
    crit: hostile
    conf: 0.995
    all:
      - id: schtasks-builtin-namespace-name
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/scheduled::schtasks-short-repeat-schedule
      - id: micro-behaviors/os/autorun/scheduled::schtasks-system-runas
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/system/windows-migration::mighost-binary-identity

  - id: powershell-microsoft-namespace-repeating-system-task
    desc: Repeating SYSTEM task uses Microsoft namespace
    crit: hostile
    conf: 0.995
    for: [powershell]
    all:
      - id: register-scheduledtask-builtin-namespace-path
      - id: micro-behaviors/os/autorun/scheduled::scheduledtask-system-principal
      - id: micro-behaviors/os/autorun/scheduled::schtask-trigger-at-startup
      - id: micro-behaviors/os/autorun/scheduled::scheduledtask-repeating-trigger
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/system/open-endpoint-events::administration-uploader-context
