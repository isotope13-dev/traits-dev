# Scheduled task registered inside the OS-reserved task namespace.
#
# `\Microsoft\Windows\...` is where Windows keeps its own maintenance tasks
# (Defrag\ScheduledDefrags, UpdateOrchestrator\..., Maintenance\...).  Product
# installers register under their own vendor folder or the task-store root;
# they do not write into the Microsoft namespace.  Malware does, precisely
# because an operator scrolling the Task Scheduler reads those names as stock
# OS entries — Interlock hid a Node.js implant behind ScheduledDefrags.
#
# The namespace alone is only half the signal: what convicts is a task wearing
# a built-in OS name whose action runs out of a user-writable staging
# directory, which no genuine Microsoft task ever does.
defaults:
  platforms: [windows]
  for: [batch, powershell, pe, dll, csharp, python, go, rust]
  crit: notable
  conf: 0.92
  attack: T1053.005,T1036.005
  mbc: F0012

traits:
  - id: schtasks-builtin-namespace-name
    desc: Task registered in the Microsoft task namespace
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)/tn\s+"?\\?Microsoft\\Windows\\\S{2,80}'

  - id: schtasks-action-user-writable-payload
    desc: Task action runs from writable staging dir
    conf: 0.9
    if:
      type: text
      regex: '(?i)/tr\s+"?[^"\r\n]{0,120}\\(AppData|Temp|ProgramData)\\'

  - id: schtasks-run-as-system
    desc: Task scheduled to run as SYSTEM
    conf: 0.9
    if:
      type: text
      regex: '(?i)/ru\s+"?(system|nt authority\\system)"?'

composite_rules:
  # Built-in OS task name + payload staged in a user-writable directory.
  - id: builtin-task-namespace-masquerade
    desc: Payload hidden as a built-in Windows task
    crit: hostile
    conf: 0.95
    all:
      - id: schtasks-builtin-namespace-name
      - id: schtasks-action-user-writable-payload
    # The task switches and action are separate parser leaves in batch and
    # PowerShell source, but must remain close within one command/file.
    scope: file
    near_bytes: 2048
