defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: credential-scanner-edge-task-name
    desc: Credential-list scanner carries Edge updater task name
    crit: suspicious
    conf: 0.98
    attack: T1036.005
    all:
      - id: objectives/lateral-movement/brute-force/database::scanner-stages-credential-lists
      - id: micro-behaviors/os/autorun/keyword::edge-update-machine-task-name

  - id: credential-scanner-edge-task-installer
    desc: Credential-list scanner installs task under Edge updater name
    crit: hostile
    conf: 0.98
    attack: T1053.005,T1036.005
    all:
      - id: credential-scanner-edge-task-name
      - id: micro-behaviors/os/autorun/task-registration::go-install-schedule-task-routine
      - id: objectives/execution/payload/file-exec/download/script-host::go-boot-download-script-runner
