defaults:
  platforms: [windows]
  for: [pe, batch, powershell]
traits:
- id: tpmprofiler-task
  desc: TPMProfiler scheduled task name (QEMU abuse)
  crit: suspicious
  conf: 0.95
  if:
    type: text
    word: TPMProfiler
- id: defrag-suffixed-task-name
  desc: Defrag-tree task with Defrag suffix
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '(?i)\\Windows\\Defrag\\[A-Za-z][A-Za-z0-9_-]{2,40}Defrag\b'
  not:
    - substr: '\Windows\Defrag\ScheduledDefrag'
composite_rules:
- id: windows-defrag-scheduled-persistence
  desc: Masqueraded Defrag scheduled task persistence
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/os/autorun/task-config::windows-defrag-task-path
  - id: defrag-suffixed-task-name
  any:
  - id: micro-behaviors/os/autorun/task-registration::schtasks-create-cmd
  - id: micro-behaviors/os/autorun/scheduled::scheduled-task-registration
