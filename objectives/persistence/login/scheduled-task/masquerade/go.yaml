defaults:
  mbc: F0012
  attack: T1053.005
  platforms: [windows]
  for: [go, pe, dll]
traits:
  # NOTE: the bare `schtasks /create` command lives in its canonical neutral
  # home, micro-behaviors/os/autorun/scheduled:: (schtasks-create-cmd for
  # binaries and scripts, schtasks-create-source for source trees). It used to
  # be duplicated here as a `suspicious` trait, which both split one signal
  # across two matchers and filed a neutral registration command under
  # masquerade/. The composites below reference the canonical atoms instead.
  - id: task-hidden-pattern
    desc: Hidden task pattern
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: '(?i)(schtasks|scheduledtask).{0,64}hidden.{0,10}(true|\$true)'
    downgrade:
      all:
        - id: micro-behaviors/data/embedded/certificate::microsoft-timestamp-chain
        - id: metadata/binary/vendor/
  - id: task-runlevel-highest
    desc: Task RunLevel Highest
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'RunLevel.{0,10}Highest'
    unless:
      - id: well-known/app/storage/onedrive::signed-onedrive-standalone-updater
  - id: task-highest-available
    desc: HighestAvailable privilege
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '<RunLevel>HighestAvailable</RunLevel>|RunLevel.{0,20}HighestAvailable'
    unless:
      - id: well-known/app/storage/onedrive::signed-onedrive-standalone-updater
  - id: fake-microsoft-author-xml
    desc: Fake Microsoft Corporation author XML
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: '<Author>Microsoft Corporation</Author>'
    unless:
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - type: text
        regex: '<(CodeSnippets?|CodeSnippetCollection|Shortcut|SnippetTypes?)>'
  - id: fake-microsoft-author-string
    desc: Task code assigns Microsoft author
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?is)(RegisterTask|TaskDefinition).{0,500}Author.{0,16}Microsoft'
    unless:
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - type: text
        regex: '<(CodeSnippets?|CodeSnippetCollection|Shortcut|SnippetTypes?)>'
  - id: task-name-marker
    desc: schtasks task-name switch
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?i)/tn\s+'
  - id: task-name-microsoft-edge
    desc: MicrosoftEdge task name
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '\\MicrosoftEdge\\b'
  - id: task-name-msedge-diagnostic
    desc: MsEdge diagnostic task name
    crit: component
    conf: 0.82
    if:
      type: text
      regex: '(?i)(\\Diagnostic\\Microsoft\\MsEdgeDiagnostic\b|\bMsEdgeDiagnostic\b)'
  - id: task-name-windows-defender
    desc: WindowsDefender task name
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '\\WindowsDefender\\b'
  - id: task-name-onedrive-update
    desc: OneDriveUpdate task name
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '\\OneDriveUpdate\\b'
  - id: task-name-security-health
    desc: SecurityHealth task name
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '\\SecurityHealth\\b'
  - id: task-restart-count
    desc: Task restart count setting
    crit: suspicious
    conf: 0.7
    if:
      type: text
      regex: '<RestartCount>\s*\d+\s*</RestartCount>|-RestartCount\s+\d'
    unless:
      - type: path
        regex: '(^|[\\/])KubernetesClient\.dll$'
  - id: task-restart-interval
    desc: Windows task restart interval markup or switch
    crit: suspicious
    conf: 0.7
    if:
      type: text
      regex: '<RestartInterval>.{1,64}</RestartInterval>|-RestartInterval\s+\S+'
    unless:
      - type: text
        substr: outerleaf
      - type: text
        substr: leafPrefixRestartInterval
      - type: text
        substr: iteratorLeafRestartInterval
      - type: text
        regex: 'restart (key|table|offset)'
      - type: text
        regex: 'restart(Count|Raw)s?'
      - id: well-known/app/network/ze::ze-source-tree
  - id: task-conhost-command-xml
    desc: Scheduled task conhost command
    crit: component
    conf: 0.9
    for: [powershell, batch, pe, dll, html]
    if:
      type: text
      substr: '<Command>conhost</Command>'
  - id: task-headless-argument-xml
    desc: Scheduled task headless argument
    crit: suspicious
    conf: 0.9
    for: [powershell, batch, pe, dll, html]
    if:
      type: text
      regex: '<(Arguments|Command)>[^<]{0,200}--headless'
  - id: task-appdata-config-exe-xml
    desc: Task launches AppData configured EXE
    crit: suspicious
    conf: 0.88
    for: [powershell, batch, pe, dll, html]
    if:
      type: text
      regex: (?i)%AppData%.{0,80}\.exe\s+-f\s+
  - id: go-taskmaster-package
    desc: Go taskmaster scheduled-task package
    crit: component
    conf: 0.86
    for: [go, pe]
    if:
      type: text
      substr: github.com/capnspacehook/taskmaster
  - id: task-time-trigger
    desc: Scheduled task time trigger
    crit: component
    conf: 0.74
    if:
      type: text
      regex: 'TimeTrigger|<TimeTrigger>'
  - id: task-exec-action
    desc: Scheduled task executable action
    crit: component
    conf: 0.76
    if:
      type: text
      regex: 'ExecAction|<Exec>|<Command>'
  - id: task-repeat-30-minute-xml
    desc: Scheduled task 30 minute XML interval
    crit: component
    conf: 0.78
    if:
      type: text
      substr: PT30M
  - id: task-repeat-30-minute-multiplier
    desc: Go 30 minute task multiplier
    crit: component
    conf: 0.78
    for: [go]
    if:
      type: text
      regex: '30\s*\*\s*time\.Minute'
composite_rules:
  - id: task-repeat-30-minute-code
    desc: Go scheduled task 30 minute repeat code
    crit: component
    conf: 0.78
    for: [go]
    all:
      - id: task-repeat-marker
      - id: task-repeat-30-minute-multiplier
    near_bytes: 112
  - id: task-repeat-marker
    desc: Task Scheduler time trigger and executable action markers
    crit: component
    conf: 0.78
    for: [go]
    all:
      - id: task-time-trigger
      - id: task-exec-action
  - id: task-repeat-30-minutes
    desc: Scheduled task 30 minute repeat interval
    crit: component
    conf: 0.78
    any:
      - id: task-repeat-30-minute-xml
      - id: task-repeat-30-minute-code
  - id: task-hidden
    desc: Hidden scheduled task
    crit: suspicious
    conf: 0.85
    any:
      - id: micro-behaviors/os/autorun/scheduled::scheduled-task-hidden-xml
      - id: task-hidden-pattern
    downgrade:
      all:
        - id: micro-behaviors/data/embedded/certificate::microsoft-timestamp-chain
        - id: metadata/binary/vendor/
    unless:
      - id: well-known/lib/platform/microsoft-restart-manager::restart-manager-system-context
      - id: well-known/tool/reverse-engineering/joern::source-archive-context
  - id: task-highest-privilege
    desc: Task runs with highest privileges
    crit: suspicious
    conf: 0.8
    any:
      - id: task-runlevel-highest
      - id: task-highest-available
  - id: fake-microsoft-author
    desc: Fake Microsoft Corporation author
    crit: suspicious
    conf: 0.9
    any:
      - id: fake-microsoft-author-xml
      - id: fake-microsoft-author-string
    downgrade:
      any:
        - id: metadata/signed/platform/
  - id: masquerade-task-name
    desc: Masqueraded scheduled task name
    crit: suspicious
    conf: 0.85
    all:
      - id: task-name-marker
    any:
      - id: task-name-microsoft-edge
      - id: task-name-msedge-diagnostic
      - id: task-name-windows-defender
      - id: task-name-onedrive-update
      - id: task-name-security-health
  - id: task-evasion
    desc: Task evasion techniques
    crit: suspicious
    conf: 0.85
    any:
      - id: masquerade-task-name
      - id: task-hidden
    downgrade:
      all:
        - id: micro-behaviors/data/embedded/certificate::microsoft-timestamp-chain
        - id: metadata/binary/vendor/
  - id: go-taskmaster-hidden-logon-task
    desc: Go taskmaster hidden logon scheduled task
    crit: suspicious
    conf: 0.9
    for: [go, pe]
    all:
      - id: go-taskmaster-package
      - id: micro-behaviors/os/autorun/task-trigger::scheduled-task-logon-trigger
      - id: task-hidden
    any:
      - id: task-time-trigger
      - id: task-exec-action
      - id: task-repeat-30-minutes
    needs: 1
  - id: schtask-masquerade
    desc: Scheduled task with Microsoft masquerading
    crit: hostile
    conf: 0.95
    all:
      - id: fake-microsoft-author
      - id: task-evasion
    any:
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-source
  - id: schtask-elevated
    desc: Elevated scheduled task with persistence
    crit: hostile
    conf: 0.95
    all:
      - id: task-highest-privilege
      - id: micro-behaviors/os/autorun/task-trigger::scheduled-task-startup-trigger
      - id: task-evasion
    any:
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-source
  - id: hidden-logon-headless-appdata-task
    desc: Hidden logon AppData headless task
    crit: hostile
    conf: 0.96
    for: [powershell, batch, pe, dll, html]
    all:
      - id: micro-behaviors/os/autorun/scheduled::scheduled-task-hidden-xml
      - id: micro-behaviors/os/autorun/scheduled::scheduled-task-logon-trigger-xml
      - id: task-conhost-command-xml
      - id: task-headless-argument-xml
      - id: task-appdata-config-exe-xml
