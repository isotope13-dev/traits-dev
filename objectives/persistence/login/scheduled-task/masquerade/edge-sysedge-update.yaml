# Edge-update masquerade persistence used by NodeEdgeRAT-style Node.js implants.
# The durable markers are the SysEdgeUpdate* task/script names under the Edge
# Extensions path — not English prose describing Microsoft Edge updates.
defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1053.005,T1036
  mbc: F0012

traits:
  - id: sysedge-update-task-name
    desc: SysEdgeUpdateTaskMachineCore scheduled task
    crit: suspicious
    conf: 0.97
    if:
      type: text
      word: SysEdgeUpdateTaskMachineCore

  - id: sysedge-update-vbs-path
    desc: SysEdgeUpdate.vbs under Edge Extensions
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)Microsoft[\\/]Edge[\\/]User Data[\\/]Default[\\/]Extensions[\\/]SysEdgeUpdate\.vbs'

  - id: sysedge-update-script-name
    desc: SysEdgeUpdate script basename
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bSysEdgeUpdate\.(vbs|js|wsf)\b'

composite_rules:
  - id: sysedge-update-persistence
    desc: Edge-masquerade SysEdgeUpdate persistence
    crit: hostile
    conf: 0.98
    all:
      - id: sysedge-update-task-name
    any:
      - id: sysedge-update-vbs-path
      - id: sysedge-update-script-name
      - id: micro-behaviors/os/autorun/scheduled::schtasks-action-argument
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
    near_bytes: 8192

  - id: sysedge-update-remote-agent
    desc: SysEdgeUpdate persistence with remote agent
    crit: hostile
    conf: 0.99
    all:
      - id: sysedge-update-persistence
    any:
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/process/create/shell/local::node-exec-command-variable
      - id: objectives/anti-static/obfuscation/payload/encrypted::change-this-key-placeholder
    near_bytes: 16000
