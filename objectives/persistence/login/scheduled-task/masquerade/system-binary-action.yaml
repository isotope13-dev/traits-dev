# A scheduled task whose action is a Windows host-process image name.
#
# The install shape this catches: drop a copy of yourself somewhere writable
# under the file name of a Windows host process (RuntimeBroker.exe,
# svchost.exe, SearchProtocolHost.exe, ApplicationFrameHost.exe), register a
# schtasks entry that re-launches it every minute or hour, and start it through
# `cmd /c start` so the shell detaches it and no console appears. Anyone
# reading Task Manager or the task list sees a familiar Windows name.
#
# The three required legs are the whole install: the registration command, the
# sub-daily repeat that makes it an implant rather than a maintenance job, and
# the detached launcher. The host-process name is what turns it into a
# masquerade. Real Windows components do not build this command line at all;
# Microsoft-signed binaries are excluded outright.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1053.005,T1036.005
  mbc: F0012

composite_rules:
  - id: recurring-task-starts-host-process-name
    desc: Recurring task detach-launches a Windows host-process name
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/scheduled::schtasks-short-repeat-schedule
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-start-launch
    any:
      - id: micro-behaviors/fs/path/host-process
    unless:
      - id: metadata/signed/platform/
