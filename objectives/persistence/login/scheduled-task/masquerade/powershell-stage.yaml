defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1053.005
  mbc: F0012

composite_rules:
  - id: hidden-logon-wscript-task-stage
    desc: Hidden logon task launches a WScript stage
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/autorun/scheduled::powershell-schtasks-xml-create
      - id: micro-behaviors/os/autorun/scheduled::scheduled-task-hidden-xml
      - id: micro-behaviors/os/autorun/scheduled::scheduled-task-logon-trigger-xml
      - id: micro-behaviors/process/create/shell/script-host::wscript-host-exec
