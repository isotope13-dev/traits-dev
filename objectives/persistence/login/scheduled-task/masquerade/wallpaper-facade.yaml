defaults:
  platforms: [windows]
  for: [whl, python-sdist, pkginfo, python]
composite_rules:
  - id: wallpaper-facade-scheduled-task-persistence
    desc: Wallpaper facade installs scheduled task persistence
    crit: hostile
    conf: 0.99
    attack: T1036,T1053.005
    scope: archive
    all:
      - id: metadata/package/description/function::wallpaper-rotator-summary
      - id: micro-behaviors/process/interpreter/python::pythonw-subprocess-no-window-profile
      - id: micro-behaviors/os/autorun/scheduled::python-schtasks-create-command
