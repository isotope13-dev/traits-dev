# Scheduled task masquerading as a Microsoft .NET Framework NGEN maintenance
# job while launching a script host or user-writable payload.
# Genuine .NET NGEN tasks invoke %windir%\Microsoft.NET\Framework*\v*\mscorsvw.exe;
# malware imitates or typosquats the ".NET ... NGEN" task name to hide
# PowerShell or user-profile script persistence in Task Scheduler.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1053.005,T1036.004
  mbc: F0012

traits:
  - id: dotnet-ngen-task-name
    desc: Scheduled task name imitates .NET Framework NGEN
    crit: notable
    conf: 0.93
    if:
      type: text
      exclude_comments: true
      regex: '(?i)(-TaskName|/tn)\s+["''][^"''\r\n]{0,40}\.NET[^\r\n"'']{0,60}\bNGEN\b'
    unless:
      - id: micro-behaviors/fs/path/dotnet-framework::mscorsvw-ngen-binary

composite_rules:
  - id: dotnet-ngen-task-registration
    desc: Registers scheduled task named .NET NGEN
    crit: suspicious
    conf: 0.95
    all:
      - id: dotnet-ngen-task-name
    any:
      - id: micro-behaviors/os/autorun/scheduled::register-scheduledtask
      - id: micro-behaviors/os/autorun/task-registration::schtasks-create-cmd
    unless:
      - id: micro-behaviors/fs/path/dotnet-framework::mscorsvw-ngen-binary

  - id: dotnet-ngen-script-task-masquerade
    desc: .NET NGEN task masquerade runs script
    crit: hostile
    conf: 0.98
    all:
      - id: dotnet-ngen-task-registration
    any:
      - id: micro-behaviors/os/autorun/task-action::new-scheduledtaskaction-powershell-execute
      - id: micro-behaviors/os/autorun/task-action::new-scheduledtaskaction-appdata-path
      - id: micro-behaviors/os/autorun/task-action::new-scheduledtaskaction-temp-path
      - id: micro-behaviors/os/autorun/task-action::schtasks-action-appdata-path
      - id: micro-behaviors/os/autorun/control::schtasks-action-temp-path
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product/
