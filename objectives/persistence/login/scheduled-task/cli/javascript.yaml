defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1053.005
traits:
  - id: delimiter-split-minute-schtasks-create
    desc: Split repeating schtasks persistence command
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'k,+s /c,+r,+ea,+te /sc minute /mo [0-9]{1,3} /tn'
  - id: split-task-target-copyfile-table
    desc: Task target and CopyFile string table
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '/tr .{0,100}CopyFile'
  - id: schtasks-create-daily
    desc: schtasks daily create command
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)schtasks\s*/create.{0,32}/sc\s+daily
  - id: schtasks-task-name
    desc: schtasks task name field
    crit: component
    conf: 0.88
    if:
      type: text
      regex: (?i)/tn\s+"[^"\n]{3,64}"
  - id: schtasks-force-start-time
    desc: schtasks force with start time
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)/f\s+/st\s+\d{2}:\d{2}
  - id: pipe-delimited-schtasks-minute-tokens
    desc: Pipe-split schtasks minute token table
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: "|sch|mi|nute|"
  - id: comma-gap-schtasks-minute-command
    desc: Comma-gap schtasks minute create command
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'W /c.{0,160}/sc minute'
  - id: wsh-sch-full-stager-variable
    desc: WSH SCH_FULL schtasks stager variable
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: SCH_FULL
  - id: wsh-copyfile-staging-literal
    desc: WSH CopyFile self-staging API literal
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(\.CopyFile\b|["'']CopyFile["''])'
composite_rules:
  - id: obfuscated-jscript-self-scheduled-persistence
    desc: JScript installs an obfuscated repeating task
    crit: hostile
    conf: 0.99
    all:
      - id: delimiter-split-minute-schtasks-create
      - id: split-task-target-copyfile-table
  - id: obfuscated-jscript-pipe-minute-schtasks-persistence
    desc: Pipe-table JScript minute schtasks with CopyFile staging
    crit: hostile
    conf: 0.99
    all:
      - id: pipe-delimited-schtasks-minute-tokens
      - id: wsh-sch-full-stager-variable
      - id: wsh-copyfile-staging-literal

  - id: javascript-schtasks-xml-persistence
    desc: JavaScript creates XML scheduled task
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/autorun/scheduled::javascript-schtasks-xml-create
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run

  - id: js-schtasks-daily-persistence
    desc: JavaScript creates daily scheduled task
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: metadata/import/builtin::require-child-process
      - id: schtasks-create-daily
      - id: schtasks-task-name
      - id: micro-behaviors/os/autorun/scheduled::schtasks-action-argument
      - id: schtasks-force-start-time
