defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: unsigned-rar-elevated-logon-task
  desc: Unsigned PE with RAR data creates elevated logon task
  crit: hostile
  conf: 0.99
  attack: T1027.009,T1053.005,T1105
  all:
  - id: micro-behaviors/data/embedded/payload/archive::rar-magic
  - id: metadata/build/manifest::pe-requires-admin
  - id: micro-behaviors/os/autorun/control::windows-schtasks-onlogon-highest
  - id: metadata/signature/absent::unsigned
