defaults:
  platforms: [windows]
  for: [python]
composite_rules:
  - id: python-minute-hidden-download-task
    desc: Minute task launches hidden encoded downloader
    crit: hostile
    conf: 0.99
    attack: T1053.005,T1105
    all:
      - id: micro-behaviors/os/autorun/scheduled::python-schtasks-create-command
      - id: micro-behaviors/os/autorun/scheduled::schtasks-action-argument
      - id: micro-behaviors/os/autorun/scheduled::schtasks-minute-create-sequence
      - id: objectives/command-and-control/dropper/download::hidden-encoded-powershell-execution

  - id: python-browser-decryptor-logon-task
    desc: Browser password decryptor registers logon task
    crit: hostile
    conf: 0.98
    attack: T1053.005,T1555.003
    all:
      - id: objectives/credential-access/browser/chromium::python-dpapi-chromium-login-decrypt
      - id: micro-behaviors/os/autorun/scheduled::python-schtasks-create-command
      - id: micro-behaviors/os/autorun/task-trigger::python-schtasks-logon-schedule
      - id: micro-behaviors/os/autorun/scheduled::schtasks-action-argument
