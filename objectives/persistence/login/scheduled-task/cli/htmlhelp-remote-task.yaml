defaults:
  platforms: [windows]
  for: [html]

traits:
  - id: htmlhelp-caret-msiexec-token
    desc: Carets split a Windows installer command
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bm\^?s\^?i\^?e\^?x\^?e\^?c\b'

  - id: htmlhelp-task-caret-http-url
    desc: Carets split an HTTP command target
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bh\^?t\^?t\^?p\^?s?:\^?/\^?/'

  - id: htmlhelp-shortcut-minute-create-action
    desc: Shortcut creates recurring command task
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)Item1[^>]{0,80}\bschtasks\b[^>]{0,24}/create[^>]{0,120}/sc\s+minute\b'

composite_rules:
  - id: htmlhelp-shortcut-remote-installer-task
    desc: Auto-activated Help shortcut schedules a recurring remote installer
    crit: hostile
    conf: 0.99
    attack: T1218.001,T1053.005,T1105
    all:
      - id: micro-behaviors/os/com/automation::htmlhelp-shortcut-command-param
      - id: htmlhelp-shortcut-minute-create-action
      - id: htmlhelp-caret-msiexec-token
      - id: htmlhelp-task-caret-http-url
    any:
      - id: micro-behaviors/ui/controls/widget::html-object-click-call
      - id: micro-behaviors/ui/controls/widget::html-obfuscated-click-call
    near_bytes: 1600
