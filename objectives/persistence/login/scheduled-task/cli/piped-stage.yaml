defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1053.005
  mbc: F0012

composite_rules:
  - id: scheduled-task-piped-file-interpreter
    desc: Scheduled task pipes local stage file into command interpreter
    crit: hostile
    conf: 0.98
    attack: T1053.005,T1059.003
    all:
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/scheduled::schtasks-action-argument
      - id: micro-behaviors/process/create/shell/pipeline::more-or-type-pipe-to-cmd

  - id: scheduled-task-headless-conhost-runner
    desc: Repeating scheduled task hides execution via headless conhost
    crit: hostile
    conf: 0.97
    attack: T1053.005,T1564.003
    all:
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-minute-or-hourly-option
      - id: micro-behaviors/process/create/hidden::conhost-headless
