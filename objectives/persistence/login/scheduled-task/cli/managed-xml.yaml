defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-hidden-logon-task-xml
    desc: Hidden task creation with logon-trigger XML
    crit: suspicious
    conf: 0.95
    attack: T1053.005
    # Available task-creation code, not a claim the entry point enables it.
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-task-name
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-logon-trigger-xml
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-highest-runlevel-xml
      - id: micro-behaviors/fs/write/file/full::dotnet-writealltext-token
      - id: micro-behaviors/process/create/hidden::dotnet-hidden-process-launch-setup
