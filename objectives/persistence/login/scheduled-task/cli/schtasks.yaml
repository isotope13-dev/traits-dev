defaults:
  attack: T1053.005
  crit: suspicious
  for: [scripts, binaries, source, oledoc]
  platforms:
    - windows
traits:
  - id: schtasks-query-task-name
    desc: schtasks query task name
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: /query /TN "
  - id: cleanup-reboot-task-name
    desc: cleanup_reboot scheduled task name
    crit: notable
    conf: 0.95
    if:
      type: text
      word: cleanup_reboot
  - id: jenkins-cleanup-reboot-payload
    desc: Jenkins cleanup reboot payload path
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: windows_cleanup_and_reboot.ps1
  - id: disable-cleanup-reboot-task
    desc: Disables cleanup_reboot scheduled task
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Disable-ScheduledTask -TaskName cleanup_reboot
  - id: schtasks-minute-repeating-trigger
    desc: Minute-repeating schtasks trigger
    crit: notable
    conf: 0.97
    for: [javascript]
    if:
      type: text
      regex: '(?i)\bschtasks\s+/create\b[\s\S]{0,260}/sc\s+MINUTE\b[\s\S]{0,40}/mo\s+1\b'
composite_rules:
  - id: htmlhelp-shortcut-minute-task
    desc: HTML Help Shortcut creates a repeating task
    crit: hostile
    conf: 0.99
    attack: T1053.005,T1218.001
    for: [html]
    all:
      - id: micro-behaviors/os/autorun/task-registration::htmlhelp-shortcut-minute-schtasks
      - id: objectives/execution/trigger/document::htmlhelp-shortcut-obfuscated-auto-fire
  - id: jenkins-cleanup-reboot-task
    desc: Jenkins cleanup reboot scheduled task
    crit: notable
    conf: 0.95
    all:
      - id: cleanup-reboot-task-name
      - id: jenkins-cleanup-reboot-payload
      - id: disable-cleanup-reboot-task
  - id: hidden-minute-resurrector-task
    desc: Hidden disguised Node process is resurrected by a repeating scheduled task
    crit: hostile
    conf: 0.99
    attack: T1053.005,T1036
    mbc: F0012
    for: [javascript]
    scope: file
    all:
      - id: schtasks-minute-repeating-trigger
      - id: objectives/evasion/masquerade/process/title::process-title-windows-system-component
      - id: micro-behaviors/process/daemonize/detach::detached-true
      - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
      - id: micro-behaviors/process/stdio/configure::child-stdio-ignore-option
    near_lines: 140
  - id: schtasks-logon-query-create
    for: [pe, class, batch, python, java, csharp, powershell]
    desc: Queries then creates logon scheduled task
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/autorun/scheduled::schtasks-utility-token
      - id: schtasks-query-task-name
      - id: micro-behaviors/os/autorun/task-registration::schtasks-create-task-name
    any:
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-logon-trigger
      - id: micro-behaviors/os/autorun/control::schtasks-onlogon-highest-flags
  - id: windows-schtasks-onstart-highest
    for: [pe, batch, csharp, powershell]
    desc: Creates elevated startup scheduled task
    conf: 0.95
    crit: suspicious
    all:
      - id: micro-behaviors/os/autorun/task-registration::windows-schtasks-create
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-boot-trigger
      - id: micro-behaviors/os/autorun/task-principal::schtasks-runlevel-highest
  - id: backdoor-logon-task-persistence
    desc: Schedules an explicitly named backdoor at user logon
    crit: hostile
    conf: 0.99
    for: [csharp]
    all:
      - id: micro-behaviors/os/autorun/task-trigger::windows-schtasks-startup-creation
      - id: objectives/command-and-control/backdoor/keywords::backdoor-executable-name-source
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start
    near_lines: 40
  - id: elevated-logon-self-persistence
    for: [pe, batch, python, powershell]
    desc: Elevated logon task launches itself
    crit: hostile
    conf: 0.98
    mbc: F0012
    all:
      - id: micro-behaviors/os/autorun/control::schtasks-elevated-logon-action-format
      - id: micro-behaviors/os/autorun/scheduled::schtasks-utility-token
      - id: micro-behaviors/os/privilege/elevation::runas-elevation-token
    any:
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: metadata/binary/symbols/name/process::create-process-w

# The task command alone is ordinary administration. Recorded keyboard input
# provides attack admission; the command and launch setup remain co-occurrence
# evidence rather than proof that task registration succeeded.
  - id: managed-keylogger-logon-task
    desc: Managed keylogger with startup-task command and process-launch setup
    crit: hostile
    conf: 0.97
    for: [pe]
    all:
      - id: micro-behaviors/os/autorun/task-trigger::windows-schtasks-startup-creation
      - id: micro-behaviors/process/config/window::dotnet-console-launch-config-references
    any:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: objectives/collection/keylog/hook::managed-low-level-hook-file-keylogger
      - id: objectives/exfiltration/stealer/input::managed-ransom-hook-keylog-form-post

  - id: repeating-hidden-powershell-scheduled-task
    desc: Repeating task runs hidden PowerShell command
    crit: hostile
    conf: 0.98
    attack: T1053.005,T1059.001
    for: [java, kotlin, jar, class, java_class]
    scope: archive
    all:
      - id: micro-behaviors/os/autorun/task-registration::schtasks-minute-create-sequence
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text

  - id: schtasks-hidden-powershell-logon-persistence
    desc: Scheduled task runs hidden PowerShell at logon
    crit: hostile
    conf: 0.98
    attack: T1053.005,T1059.001,T1564.003
    all:
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-logon-trigger
      - id: micro-behaviors/os/autorun/task-action::schtasks-hidden-powershell-action
    any:
      - id: micro-behaviors/os/autorun/task-registration::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/task-registration::schtasks-split-exe-create
    # Bind trigger and hidden-PowerShell action to one registration command.
    near_bytes: 2048
    unless:
      - id: well-known/tool/detection/falconet::falconet-defensive-scanner-context
