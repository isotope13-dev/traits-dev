defaults:
  attack: T1053.005
  crit: suspicious
  for:
  - pe
  - oledoc
  - powershell
  - batch
  - csharp
  - python
  - java
  - class
  - java_class
  platforms:
  - windows
traits:
- id: schtasks-query-task-name
  desc: schtasks query task name
  crit: notable
  conf: 0.96
  if:
    type: text
    exact: /query /TN "
- id: schtasks-self-task-name-format
  desc: Scheduled task name format placeholder
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: (?i)schtasks\.exe\s+/create\s+/tn\s+"%s"
- id: schtasks-self-payload-format
  desc: Task action contains payload placeholder
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: (?i)/tr\s+".{0,24}%s.{0,24}"
- id: schtasks-self-logon-highest-force
  desc: Logon task uses highest run level
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: (?i)/sc\s+onlogon\s+/rl\s+highest\s+/f
- id: schtasks-onlogon-highest-flags
  desc: Scheduled task ONLOGON highest flags
  crit: suspicious
  conf: 0.97
  if:
    type: text
    exact: '" /SC ONLOGON /RL HIGHEST /F'
- id: cleanup-reboot-task-name
  desc: cleanup_reboot scheduled task name
  crit: notable
  conf: 0.95
  if:
    type: text
    word: cleanup_reboot
- id: jenkins-cleanup-reboot-payload
  desc: Jenkins cleanup reboot payload path
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: windows_cleanup_and_reboot.ps1
- id: disable-cleanup-reboot-task
  desc: Disables cleanup_reboot scheduled task
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: Disable-ScheduledTask -TaskName cleanup_reboot
- id: schtasks-minute-repeating-trigger
  desc: Minute-repeating schtasks trigger
  crit: notable
  conf: 0.97
  for: [javascript]
  if:
    type: text
    regex: '(?i)\bschtasks\s+/create\b[\s\S]{0,260}/sc\s+MINUTE\b[\s\S]{0,40}/mo\s+1\b'
composite_rules:
- id: schtasks-self-payload-command
  desc: Elevated logon task carries payload
  crit: suspicious
  conf: 0.97
  all:
  - id: schtasks-self-payload-format
  - id: schtasks-self-logon-highest-force
  any:
  - id: schtasks-self-task-name-format
  - id: micro-behaviors/os/autorun/scheduled::schtasks-create-task-name
  near_bytes: 128
- id: jenkins-cleanup-reboot-task
  desc: Jenkins cleanup reboot scheduled task
  crit: notable
  conf: 0.95
  all:
  - id: cleanup-reboot-task-name
  - id: jenkins-cleanup-reboot-payload
  - id: disable-cleanup-reboot-task
- id: hidden-minute-resurrector-task
  desc: Hidden disguised Node process is resurrected by a repeating scheduled task
  crit: hostile
  conf: 0.99
  attack: T1053.005,T1036
  mbc: F0012
  for: [javascript]
  scope: file
  all:
  - id: schtasks-minute-repeating-trigger
  - id: objectives/evasion/masquerade/process/title::process-title-windows-system-component
  - id: micro-behaviors/process/create/spawn::detached-true
  - id: micro-behaviors/process/create/spawn::windowshide-option
  - id: micro-behaviors/process/create/spawn::stdio-ignore
  near_lines: 140
- id: schtasks-logon-query-create
  for: [pe, class, batch, python, java, csharp, powershell]
  desc: Queries then creates logon scheduled task
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/os/autorun/scheduled::schtasks-utility-token
  - id: schtasks-query-task-name
  - id: micro-behaviors/os/autorun/scheduled::schtasks-create-task-name
  any:
  - id: micro-behaviors/os/autorun/task-trigger::schtasks-logon-trigger
  - id: schtasks-onlogon-highest-flags
- id: windows-schtasks-onstart-highest
  for: [pe, batch, csharp, powershell]
  desc: Creates elevated startup scheduled task
  conf: 0.95
  crit: suspicious
  all:
  - id: micro-behaviors/os/autorun/scheduled::windows-schtasks-create
  - id: micro-behaviors/os/autorun/task-trigger::schtasks-boot-trigger
  - id: micro-behaviors/os/autorun/scheduled::schtasks-runlevel-highest
- id: windows-schtasks-onlogon-highest
  for: [pe, batch, csharp, powershell]
  desc: Contains an elevated logon scheduled-task creation command
  conf: 0.95
  crit: suspicious
  all:
  - id: micro-behaviors/os/autorun/scheduled::windows-schtasks-create
  - id: micro-behaviors/os/autorun/task-trigger::schtasks-logon-trigger
  any:
  - id: schtasks-onlogon-highest-flags
  - id: micro-behaviors/os/autorun/scheduled::schtasks-runlevel-highest
  unless:
  - id: well-known/app/development/calvyn-code
- id: windows-schtasks-startup-persistence
  desc: Contains a logon or startup scheduled-task creation command
  crit: suspicious
  conf: 0.9
  for: [pe, csharp]
  all:
  - id: micro-behaviors/os/autorun/scheduled::windows-schtasks-create
  - id: micro-behaviors/os/autorun/task-trigger::scheduled-task-startup-trigger
  unless:
  - id: well-known/app/ai/coding-agent/anthropic-claude-code::native-cli-member
  - id: well-known/app/storage/peazip::peazip-main-executable
  - id: well-known/tool/development/toolchain/nvm-windows::nvm4w-registration-task-name
  - id: well-known/app/system/iobit::iobit-component-context
  - id: well-known/tool/detection/sigmashake::sigmashake-scheduled-task-context
- id: backdoor-logon-task-persistence
  desc: Schedules an explicitly named backdoor at user logon
  crit: hostile
  conf: 0.99
  for: [csharp]
  all:
  - id: windows-schtasks-startup-persistence
  - id: objectives/command-and-control/backdoor/keywords::backdoor-executable-name-source
  - id: micro-behaviors/process/create/spawn::start
  near_lines: 40
- id: elevated-logon-self-persistence
  for: [pe, batch, python, powershell]
  desc: Elevated logon task launches itself
  crit: hostile
  conf: 0.98
  mbc: F0012
  all:
  - id: schtasks-self-payload-command
  - id: micro-behaviors/os/autorun/scheduled::schtasks-utility-token
  - id: micro-behaviors/os/privilege/elevation::runas-elevation-token
  any:
  - id: micro-behaviors/process/create/spawn::create-process-a
  - id: micro-behaviors/process/create/spawn::create-process-w
