# The payment-address replacement template supplies unwanted-client context.
# Task XML alone is a normal administration mechanism.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1053.005
composite_rules:
  - id: managed-clipper-hidden-logon-task-template
    desc: Clipper includes hidden logon script task
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/crypto-manipulation/clipboard::managed-multicoin-clipboard-replacement-template
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-logon-trigger-xml
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-hidden-xml
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-script-host-command-xml
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-task-name
