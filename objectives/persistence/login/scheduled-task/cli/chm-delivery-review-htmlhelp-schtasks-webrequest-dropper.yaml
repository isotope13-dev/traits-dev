defaults:
  platforms: [windows]
  for: [html]

composite_rules:
- id: htmlhelp-schtasks-webrequest-dropper
  desc: HTML Help scheduled WebRequest dropper
  crit: hostile
  conf: 0.99
  all:
    - id: micro-behaviors/os/com/automation::htmlhelp-shortcut-command-param
    - id: micro-behaviors/os/autorun/task-registration::schtasks-create-cmd
    - id: micro-behaviors/process/argument/visibility::htmlhelp-hidden-powershell
    - id: micro-behaviors/process/interpreter/eval/source::htmlhelp-powershell-webrequest-iex
  any:
    - id: micro-behaviors/ui/controls/widget::html-object-click-call
    - id: micro-behaviors/ui/controls/widget::html-onerror-click-call

