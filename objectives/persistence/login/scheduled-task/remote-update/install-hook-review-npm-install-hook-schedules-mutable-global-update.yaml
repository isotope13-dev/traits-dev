defaults:
  platforms: [unix]
  for: [npm, tar, tgz, package.json, shell, javascript]
  attack: T1195.002,T1053.003,T1543.004
composite_rules:
- id: npm-install-hook-schedules-mutable-global-update
  crit: hostile
  desc: npm install hook schedules mutable global package replacement
  conf: 0.99
  scope: archive
  all:
    - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
    - id: micro-behaviors/os/autorun/cron/unspecified::crontab-file-install
    - id: micro-behaviors/os/service/start::launchctl-load-command-text
    - id: micro-behaviors/os/package-manager/install::global-latest-package-install
  unless:
    - id: well-known/app/ai/coding-agent/claude-multiacc::archive-context
