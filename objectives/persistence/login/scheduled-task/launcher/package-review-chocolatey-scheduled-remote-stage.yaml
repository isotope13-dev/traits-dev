defaults:
  platforms: [windows]
  for: [nupkg]
  attack: T1195.002
composite_rules:
  - id: chocolatey-scheduled-remote-stage
    desc: Chocolatey hook schedules a remote PowerShell stage
    crit: hostile
    conf: 0.99
    scope: archive
    for: [source, '!objectivec', batch, class, javascript, lua, nupkg, pe, perl, php, powershell, python, ruby, vbs]
    all:
      - id: metadata/package/files/nuget::chocolatey-install-script-member
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/scheduled::schtasks-minute-create-sequence
      - id: metadata/file/profile/script/network::powershell-web-response-piped-eval-text

