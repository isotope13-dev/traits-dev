defaults:
  platforms: [windows]
  for: [nupkg]
  attack: T1053.005,T1105,T1059.001
composite_rules:
  - id: scheduled-task-remote-powershell-stage
    desc: Recurring scheduled task downloads and evaluates a PowerShell stage
    crit: hostile
    conf: 0.99
    scope: archive
    for: [source, '!objectivec', batch, class, javascript, lua, nupkg, pe, perl, php, powershell, python, ruby, vbs]
    all:
      - id: micro-behaviors/os/autorun/task-registration::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/task-registration::schtasks-minute-create-sequence
      - id: objectives/execution/payload/script-eval/network/response-body::powershell-web-response-piped-eval-text

