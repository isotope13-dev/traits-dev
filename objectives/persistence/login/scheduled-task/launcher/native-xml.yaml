defaults:
  platforms: [windows]
  for: [pe]
  attack: T1053.005,T1564.003
  mbc: F0012

composite_rules:
  - id: native-hidden-logon-task-xml-schtasks
    desc: Unsigned PE registers hidden unlimited-runtime logon task XML
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/autorun/scheduled::schtasks-utility-token
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-logon-trigger-xml
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-hidden-xml
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-unlimited-runtime-xml
      - id: micro-behaviors/process/create/exec::child-process-creation-evidence
      - id: metadata/signature/absent::unsigned
