defaults:
  for: [powershell]
  platforms: [windows]
  crit: hostile
  conf: 0.96
  attack: T1053.005,T1059.001

composite_rules:
  - id: powershell-hidden-com-scheduled-task-loader
    desc: PowerShell registers hidden scheduled task with reflective .NET load
    all:
      - id: micro-behaviors/os/autorun/task-registration
      - id: micro-behaviors/os/autorun/task-xml-scheduled
      - id: micro-behaviors/process/interpreter/runtime/clr
