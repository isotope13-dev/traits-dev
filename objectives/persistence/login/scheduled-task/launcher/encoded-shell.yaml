defaults:
  for: [rust]
  platforms: [windows, unix]
composite_rules:
  - id: recurring-task-hidden-encoded-shell
    desc: Recurring task and hidden encoded shell indicators
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/autorun/scheduled::schtasks-minute-create-sequence
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
      - id: metadata/lang/source/syntax/command/launch::powershell-encoded-payload-command-text
      - id: metadata/file/profile/execution-api::rust-command-new-call
