defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1053.005
composite_rules:
  # The task action runs conhost.exe --headless powershell -Enc <payload>:
  # headless conhost keeps the console window from ever appearing, and the
  # encoded command keeps the loader out of the task definition. Registering
  # that action as a repeating task is persistence for a hidden loader.
  - id: scheduled-task-headless-conhost-encoded-powershell
    desc: Scheduled task runs hidden encoded PowerShell via conhost
    crit: hostile
    conf: 0.97
    attack: T1053.005,T1059.001,T1027,T1564.003
    near_lines: 12
    all:
      - id: micro-behaviors/os/autorun/task-action::new-scheduledtaskaction
      - id: micro-behaviors/process/create/hidden::conhost-headless-powershell-invocation
      - id: micro-behaviors/process/argument/option::powershell-encoded-command-text
      - id: micro-behaviors/os/autorun/scheduled::register-scheduledtask
