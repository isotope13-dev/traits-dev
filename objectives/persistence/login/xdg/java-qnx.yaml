defaults:
  platforms: [qnx, unix]
  for: [java, class, jar]
  attack: T1547.013

traits:
  - id: qnx-java-autostart-desktop
    desc: QNX Java autostart desktop
    crit: suspicious
    conf: 0.94
    for: [java]
    if:
      type: text
      regex: '\.config/autostart/[^"''\s]{1,80}\.desktop'

  - id: qnx-java-jar-autostart-exec
    desc: QNX Java jar autostart exec
    crit: suspicious
    conf: 0.94
    for: [java]
    if:
      type: text
      regex: 'Exec=java -jar [^"''\n]{1,120}\.jar'

  - id: qnx-java-bytecode-xdg-autostart
    desc: Java bytecode references XDG autostart desktop
    crit: suspicious
    conf: 0.94
    for: [class, jar]
    if:
      type: text
      regex: '(?i)\.config/autostart/[^"''\s]{1,80}\.desktop'
    unless:
      - type: path
        regex: '\.zip$'

  - id: qnx-java-bytecode-jar-exec
    desc: Java bytecode contains jar autostart command
    crit: suspicious
    conf: 0.94
    for: [class, jar]
    if:
      type: text
      regex: '(?i)Exec=java -jar [^"''\n]{1,120}\.jar'
    unless:
      - type: path
        regex: '\.zip$'

composite_rules:
  - id: qnx-java-xdg-miner-persistence
    desc: QNX Java XDG miner persistence
    crit: hostile
    conf: 0.98
    all:
      - id: qnx-java-autostart-desktop
      - id: qnx-java-jar-autostart-exec
      - id: micro-behaviors/os/autorun/login-items::gnome-autostart-enabled-marker

  - id: qnx-java-bytecode-xdg-persistence
    desc: QNX Java bytecode XDG persistence
    crit: hostile
    conf: 0.98
    for: [class, jar]
    all:
      - id: qnx-java-bytecode-xdg-autostart
      - id: qnx-java-bytecode-jar-exec
      - id: micro-behaviors/os/autorun/login-items::gnome-autostart-enabled-marker
