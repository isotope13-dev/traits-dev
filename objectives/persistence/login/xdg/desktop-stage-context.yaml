# Autostart is required. The delivery and hidden-stage rules supply context,
# but the matcher does not bind their staged paths to this autostart entry.
defaults:
  platforms: [linux]
  for: [desktop-entry]
  attack: T1547.013

composite_rules:
  - id: desktop-autostart-download-launch-profile
    desc: XDG autostart with desktop download/launch clues
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/file/format/structured::desktop-type-application
      - id: metadata/file/format/structured::desktop-exec-present
      - id: metadata/file/format/structured::desktop-terminal-hidden
      - id: objectives/persistence/login/xdg::autostart-enabled
      - id: objectives/command-and-control/dropper/delivery/desktop::desktop-entry-native-download-execute

  - id: desktop-autostart-hidden-stage-profile
    desc: XDG autostart with desktop and hidden-stage clues
    crit: suspicious
    conf: 0.99
    all:
      - id: desktop-autostart-download-launch-profile
      - id: micro-behaviors/process/create/local-exec::hidden-stage-chmod-execute
