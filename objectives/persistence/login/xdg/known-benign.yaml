defaults:
  platforms: [linux, macos]
  for: [binaries, scripts, c, cpp, go, typescript]

traits:
  - id: package-build-root-autostart-path
    desc: Package build root XDG autostart path
    crit: notable
    conf: 0.95
    for: [shell]
    if:
      type: text
      regex: '(?i)\$\{?[A-Z_]*pkgdir\}?/etc/xdg/autostart/'

composite_rules:
  - id: known-benign-xdg-javascript-context
    desc: Recognized benign JavaScript XDG autostart context
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    any:
      - id: well-known/app/communication/mattermost-desktop::macos-app-bundle
      - id: well-known/app/communication/mattermost-desktop::asar-resource
      - id: well-known/app/communication/mattermost-desktop::product-marker
      - id: well-known/app/security/bitwarden::bitwarden-app
      - id: well-known/lib/runtime/stacksjs-desktop::package-context
      - id: well-known/lib/runtime/stacksjs-desktop::bundle-context

  - id: known-benign-xdg-shell-context
    desc: Recognized benign shell XDG autostart context
    crit: exception
    conf: 0.99
    for: [shell]
    any:
      - id: well-known/app/communication/mattermost-desktop::asar-resource
      - id: well-known/app/communication/mattermost-desktop::product-marker
      - id: well-known/dual-use/transfer/rclone-wiz::rclone-wiz-application
      - id: well-known/app/storage/clonezilla::package-context
      - id: well-known/app/storage/clonezilla::clonezilla-script-context
      - id: well-known/app/system/raspi-config::raspi-config-persistence-context
      - id: well-known/app/system/openbox::package-code
      - id: well-known/app/infrastructure/open-vm-tools::product-marker
      - id: well-known/app/system/archlinuxcn::repository-archive-context
      - id: well-known/app/utility/full-upgrade::full-upgrade-context
      - id: well-known/app/system/pachul::pachul-context
      - id: package-build-root-autostart-path

  - id: known-benign-xdg-other-context
    desc: Recognized benign native XDG autostart context
    crit: exception
    conf: 0.99
    for: [binaries, scripts, c, cpp, go, -shell, -javascript]
    any:
      - id: well-known/app/communication/mattermost-desktop::macos-app-bundle
      - id: well-known/app/communication/mattermost-desktop::product-marker
      - id: well-known/dual-use/transfer/rclone-wiz::rclone-wiz-application
      - id: well-known/app/utility/shrike::desktop-utility-suite-context
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/app/storage/clonezilla::package-context
      - id: well-known/app/storage/clonezilla::clonezilla-script-context
      - id: metadata/file/profile/identity::generated-attack-map-context
      - id: well-known/app/infrastructure/open-vm-tools::product-marker
      - id: well-known/app/system/archlinuxcn::repository-archive-context
      - id: well-known/app/system/pachul::pachul-context
