defaults:
  platforms: [qnx, unix]
  for: [java, class, jar]
  attack: T1547.013

composite_rules:
  - id: java-bytecode-xdg-autostart-persistence
    desc: Java bytecode carries an enabled XDG autostart entry
    crit: suspicious
    conf: 0.98
    for: [class, jar]
    all:
      - id: micro-behaviors/os/autorun/login-items::xdg-user-autostart-path
      - id: micro-behaviors/os/autorun/login-items::embedded-desktop-entry-exec
      - id: micro-behaviors/os/autorun/login-items::gnome-autostart-enabled-marker
