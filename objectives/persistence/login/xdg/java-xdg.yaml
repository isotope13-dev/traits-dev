defaults:
  platforms: [qnx, unix]
  for: [java, class, jar]
  attack: T1547.013

traits:
  - id: java-xdg-autostart-desktop
    desc: Java source names an XDG autostart path
    crit: suspicious
    conf: 0.94
    for: [java]
    if:
      type: text
      regex: '\.config/autostart/[^"''\s]{1,80}\.desktop'

  - id: java-xdg-jar-autostart-exec
    desc: XDG autostart launches a Java JAR
    crit: suspicious
    conf: 0.94
    for: [java]
    if:
      type: text
      regex: 'Exec=java -jar [^"''\n]{1,120}\.jar'

  - id: java-bytecode-xdg-autostart-path
    desc: Bytecode has XDG autostart path
    crit: suspicious
    conf: 0.94
    for: [class]
    if:
      type: text
      regex: '(?i)\.config/autostart/[^"''\s]{1,80}\.desktop'
    unless:
      - type: path
        regex: '\.zip$'

  - id: java-bytecode-xdg-jar-autostart-exec
    desc: Bytecode has Java JAR autostart command
    crit: suspicious
    conf: 0.94
    for: [class]
    if:
      type: text
      regex: '(?i)Exec=java -jar [^"''\n]{1,120}\.jar'
    unless:
      - type: path
        regex: '\.zip$'

composite_rules:
  - id: java-xdg-autostart-persistence
    desc: Java XDG autostart persistence
    crit: suspicious
    conf: 0.98
    all:
      - id: java-xdg-autostart-desktop
      - id: java-xdg-jar-autostart-exec
      - id: micro-behaviors/os/autorun/login-items::gnome-autostart-enabled-marker

  - id: java-bytecode-xdg-autostart-persistence
    desc: Bytecode XDG autostart persistence
    crit: suspicious
    conf: 0.98
    for: [class, jar]
    all:
      - id: java-bytecode-xdg-autostart-path
      - id: java-bytecode-xdg-jar-autostart-exec
      - id: micro-behaviors/os/autorun/login-items::gnome-autostart-enabled-marker
