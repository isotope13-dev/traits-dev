defaults:
  platforms: [unix]
  for: [c, ruby, elf, python]
  attack: T1547.013

composite_rules:
  - id: source-xdg-autostart-write
    desc: Source writes an XDG autostart entry
    crit: notable
    conf: 0.94
    near_bytes: 512
    all:
      - id: micro-behaviors/os/autorun/login-items::source-xdg-autostart-path
      - id: objectives/persistence/system/init/boot::desktop-entry-header

  - id: source-xdg-autostart-persistence
    desc: Source hides an executable XDG autostart entry
    crit: hostile
    conf: 0.98
    all:
      - id: source-xdg-autostart-write
      - id: micro-behaviors/os/autorun/login-items::source-desktop-entry-exec
    any:
      - id: micro-behaviors/os/autorun/login-items::source-nodisplay-desktop-entry
      - id: micro-behaviors/os/autorun/login-items::source-terminal-false-desktop-entry
    unless:
      - id: metadata/package/testing/presence/harness/
