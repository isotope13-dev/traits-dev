defaults:
  mbc: F0012
  attack: T1547.013
  platforms: [linux, macos]
  for: [binaries, scripts, c, cpp, go, typescript]

composite_rules:
  # An autostart path plus an embedded desktop entry establishes the login
  # persistence mechanism. Applications that visibly offer this as a user
  # setting are ordinary login-start utilities, so suppress that known-good
  # context instead of treating every XDG autostart implementation as suspect.
  - id: xdg-persistence
    desc: XDG autostart persistence
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/autorun/login-items::desktop-entry-header
    any:
      - id: micro-behaviors/os/autorun/login-items::xdg-user-autostart-path
      - id: micro-behaviors/os/autorun/login-items::xdg-system-autostart-path
      - id: micro-behaviors/os/autorun/login-items::xdg-config-home-autostart-path
    unless:
      - id: well-known/app/system/bridge::documented-system-control-context
      - id: well-known/app/system/pachul::pachul-context
      - id: micro-behaviors/os/autorun/login-items::user-controlled-xdg-autostart
