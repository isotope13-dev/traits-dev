defaults:
  mbc: F0012
  attack: T1547.013
  platforms:
    - linux
    - macos
traits:
  - id: xdg-autostart-user
    desc: XDG user autostart directory with tilde
    crit: component
    conf: 0.8
    for:
      - go
      - elf
      - macho
    if:
      type: text
      substr: ~/.config/autostart
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: xdg-autostart-self-config
      - id: well-known/app/system/bridge::documented-system-control-context
  - id: xdg-autostart-self-config
    desc: App declares own autostart path
    crit: notable
    conf: 0.8
    for:
      - go
      - elf
      - macho
    if:
      type: text
      regex: '"autostart_path"\s*:\s*"~/\.config/autostart'
  - id: xdg-autostart-dir-text
    desc: XDG autostart directory text
    crit: component
    conf: 0.8
    for: [binaries, scripts, c, cpp, go, typescript]
    if:
      type: text
      regex: '(\.config/autostart|/etc/xdg/autostart|XDG_CONFIG_HOME.{0,50}autostart)'
  - id: desktop-file-suffix
    desc: Desktop file suffix
    crit: component
    conf: 0.75
    for: [binaries, scripts, c, cpp, go, typescript]
    if:
      type: text
      substr: .desktop
  - id: file-write-word
    desc: XDG desktop write context
    crit: component
    conf: 0.75
    for: [binaries, scripts, c, cpp, go, typescript]
    if:
      type: text
      regex: '(?i)(write.{0,160}(\.desktop|autostart)|(\.desktop|autostart).{0,160}write)'
    unless:
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: desktop-entry-exec
    desc: Desktop entry Exec directive
    crit: component
    conf: 0.75
    for: [binaries, scripts, c, cpp, go, typescript]
    if:
      type: text
      regex: Exec=.{0,100}/
composite_rules:
  - id: desktop-file-write
    desc: XDG autostart desktop file creation
    crit: suspicious
    conf: 0.8
    for: [binaries, scripts, c, cpp, go, typescript]
    all:
      - id: xdg-autostart-dir-text
      - id: desktop-file-suffix
      - id: file-write-word
    near_bytes: 160
    unless:
      - id: well-known/app/system/bridge::documented-system-control-context
      - id: well-known/app/system/pachul::pachul-context
  - id: kde-autostart-script-persistence
    desc: Writes a KDE Plasma autostart scripts directory
    crit: suspicious
    conf: 0.88
    for: [binaries, scripts, c, cpp, go, typescript]
    all:
      - id: micro-behaviors/fs/path/application/config::kde-autostart-scripts-path
      - id: file-write-word
    near_bytes: 160
  - id: xdg-autostart-path-javascript
    desc: JavaScript references XDG autostart directory
    crit: component
    conf: 0.8
    for: [javascript, typescript]
    any:
      - id: xdg-autostart-user
      - id: xdg-autostart-dir-text
      - id: micro-behaviors/os/autorun/login-items::source-xdg-autostart-path
    unless:
      - id: known-benign-xdg-javascript-context
  - id: xdg-autostart-path-shell
    desc: Shell references XDG autostart directory
    crit: component
    conf: 0.8
    for: [shell]
    any:
      - id: xdg-autostart-user
      - id: xdg-autostart-dir-text
      - id: micro-behaviors/os/autorun/login-items::source-xdg-autostart-path
    unless:
      - id: known-benign-xdg-shell-context
  - id: xdg-autostart-path-other
    desc: Native code references XDG autostart directory
    crit: component
    conf: 0.8
    for: [binaries, scripts, c, cpp, go, -shell, -javascript]
    any:
      - id: xdg-autostart-user
      - id: xdg-autostart-dir-text
      - id: micro-behaviors/os/autorun/login-items::source-xdg-autostart-path
    unless:
      - id: known-benign-xdg-other-context
  - id: xdg-autostart-path
    desc: XDG autostart directory
    crit: component
    conf: 0.8
    for: [binaries, scripts, c, cpp, go, typescript]
    any:
      - id: xdg-autostart-path-javascript
      - id: xdg-autostart-path-shell
      - id: xdg-autostart-path-other
  - id: desktop-entry-content
    desc: XDG desktop entry content
    crit: component
    conf: 0.75
    for: [binaries, scripts, c, cpp, go, typescript]
    any:
      - id: desktop-file-write
      - id: desktop-entry-exec
      - id: micro-behaviors/os/autorun/login-items::source-desktop-entry-header
    unless:
      - id: well-known/app/system/bridge::documented-system-control-context
      - id: well-known/app/system/pachul::pachul-context
  - id: xdg-persistence
    desc: XDG autostart persistence
    crit: suspicious
    conf: 0.9
    for: [binaries, scripts, c, cpp, go, typescript]
    all:
      - id: xdg-autostart-path
      - id: desktop-entry-content
    unless:
      - id: well-known/app/system/bridge::documented-system-control-context
      - id: well-known/app/system/pachul::pachul-context
