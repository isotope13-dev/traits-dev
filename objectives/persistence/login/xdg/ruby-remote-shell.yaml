defaults:
  platforms: [linux]
  for: [ruby]
  attack: T1547.013

traits:
  - id: ruby-bound-hidden-remote-shell-autostart
    desc: Ruby binds hidden remote shell autostart
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (body_statement
          (assignment left: (identifier) @content right: (heredoc_beginning))
          . (heredoc_body) @desktop
          (assignment left: (identifier) @dir right: (call
            receiver: (constant) @file1 method: (identifier) @expand
            arguments: (argument_list (string) @path)))
          (assignment left: (identifier) @output right: (string
            (interpolation (identifier) @dir_use)))
          (call receiver: (constant) @file2 method: (identifier) @write
            arguments: (argument_list (identifier) @output_use (identifier) @content_use))
          (#eq? @file1 "File") (#eq? @file2 "File")
          (#eq? @expand "expand_path") (#eq? @write "write")
          (#eq? @dir @dir_use) (#eq? @output @output_use)
          (#eq? @content @content_use)
          (#match? @path "[.]config/autostart")
          (#match? @desktop "Exec=[^\\n]*curl[^\\n]*https?://[^\\n]*[|] *bash")
          (#match? @desktop "NoDisplay=true")) @install

composite_rules:
  - id: ruby-hidden-remote-shell-autostart
    desc: Ruby installs hidden remote shell autostart
    crit: hostile
    conf: 0.98
    all:
      - id: ruby-bound-hidden-remote-shell-autostart
      - id: metadata/lang/source/syntax/member::ruby-file-write-reference
