# An autostart entry whose name impersonates a Windows system component
# ("WindowsUpdate", "svchost", "lsass", "Realtek") is disguising its
# persistence -- legitimate software registers autostart under its own product
# name, not a system one. Pairing that masquerade string with an actual
# autostart install (a CurrentVersion\Run value write, or a schtasks task
# creation) in one file is the K7 "Stealer Factory" dual-persistence shape and
# generalizes to any Python implant that hides its Run key / scheduled task
# behind a system name. Neither leg alone convicts: the name is just a string,
# and autostart writes have benign uses; together they have none.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1547.001,T1053.005,T1036.004
  mbc: F0012

composite_rules:
  - id: python-masqueraded-autostart-install
    desc: Autostart installed under a system name
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/process/create/shell/lang::system-masquerade
    any:
      - id: objectives/persistence/login/registry/run-key::python-winreg-run-key-persistence
      - id: micro-behaviors/os/autorun/scheduled::python-schtasks-create-command
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
