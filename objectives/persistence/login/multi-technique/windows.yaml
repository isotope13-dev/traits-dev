defaults:
  crit: hostile
  platforms: [windows]
  for: [scripts, binaries, source]
  attack: T1547.001

composite_rules:
  - id: multi-location-windows-startup
    for: [batch, powershell]
    desc: Multiple Windows startup persistence mechanisms
    conf: 0.95
    all:
      - id: objectives/persistence/login/scheduled-task/interval::network-event-appdata-task
    any:
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path"
      - id: micro-behaviors/fs/path/autostart::windows-startup-directory
      - id: micro-behaviors/fs/file/create::create-shortcut
    needs: 2

  - id: batch-multi-mechanism-self-persistence
    for: [batch]
    desc: Batch installs self into run key and schtasks
    crit: hostile
    conf: 0.98
    attack: "T1547.001,T1053.005"
    all:
      - id: micro-behaviors/fs/path/script::batch-current-script-copy-or-call-input
      - id: micro-behaviors/os/registry/autostart/write::batch-reg-add-run-key-direct
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-minute-short-interval

  - id: elevated-logon-embedded-proxy-installer
    for: [pe]
    desc: Elevated logon task launches hidden embedded proxy
    conf: 0.98
    attack: T1053.005,T1027.009,T1564.003
    all:
      - id: micro-behaviors/os/autorun/control::schtasks-onlogon-highest-flags
      - id: micro-behaviors/process/config/window::dotnet-console-window-option-reference
      - id: micro-behaviors/process/fd/stdio::dotnet-child-stdio-config-references
      - id: micro-behaviors/data/embedded/resource::dotnet-getmanifestresourcestream
      - id: metadata/binary/resource/size::clr-resource-large
      - id: micro-behaviors/communications/proxy/reverse::reverse-proxy

  - id: elevated-logon-hidden-embedded-payload
    for: [pe]
    desc: Elevated logon task hides embedded payload launch
    conf: 0.99
    attack: T1053.005,T1027.009,T1564.003
    mbc: F0006
    all:
      - id: micro-behaviors/os/autorun/control::schtasks-onlogon-highest-flags
      - id: micro-behaviors/data/embedded/resource::dotnet-getmanifestresourcestream
      - id: micro-behaviors/process/create/exec::create-process-api-name
      - id: micro-behaviors/ui/window/visibility::hide-all-windows-for-process-token

  - id: dual-service-and-task-script-persistence
    desc: Dual service and scheduled task persistence
    crit: hostile
    conf: 0.98
    attack: T1543.003,T1053.005,T1059.001
    all:
      - id: micro-behaviors/os/service/create::sc-create-command
      - id: micro-behaviors/os/autorun/task-registration::schtasks-create-cmd
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
    unless:
      - id: well-known/tool/detection/falconet::falconet-defensive-scanner-context
