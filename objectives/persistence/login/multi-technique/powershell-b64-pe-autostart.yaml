defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1547.001,T1027

composite_rules:
  - id: powershell-b64-pe-drop-run-key-exec
    desc: Decodes Base64 PE, sets Run key, and executes
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/embedded/payload/native::line-wrapped-base64-pe-image
      - id: micro-behaviors/data/decode/base64/unspecified::powershell-frombase64string
      - id: micro-behaviors/fs/write/file/full/bytes::write-all-bytes
      - id: micro-behaviors/os/registry/autostart/reference::windows-run-key-path
      - id: micro-behaviors/os/registry/value/write::powershell-registry-property-write
    any:
      - id: micro-behaviors/os/com/automation::shell-application-progid
      - id: micro-behaviors/process/create/subprocess/configure::powershell-processstartinfo-object
