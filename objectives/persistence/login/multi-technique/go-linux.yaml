# Linux Go agents that install several independent login/startup mechanisms.
# One persistence API can be legitimate; authoring three different autorun
# surfaces in one agent is the attack-specific signal.
defaults:
  platforms: [linux]
  for: [go, elf]
  attack: T1053.003,T1543.002,T1547.013,T1546.004
  mbc: F0012

traits:
  - id: go-shell-startup-script-path
    desc: Go references a user shell startup script
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(\$HOME|~)/\.[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]{1,64}/(startup|init)\.sh'

  - id: go-rc-local-persistence-routine
    desc: Go routine configures rc.local persistence
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b[A-Za-z0-9_.]*(AddToRcLocal|ConfigureRcLocal|InstallRcLocal|SetupRcLocal)\b'

  - id: go-systemd-persistence-routine
    desc: Go routine configures systemd persistence
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b[A-Za-z0-9_.]*(ConfigureSystemd|InstallSystemd|SetupSystemd|SystemdManager)\b'

  - id: go-cron-persistence-routine
    desc: Go routine configures cron persistence
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b[A-Za-z0-9_.]*(ConfigureCron|InstallCron|SetupCron|CronManager)\b'

  - id: go-login-script-persistence-routine
    desc: Go routine configures login script persistence
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b[A-Za-z0-9_.]*(ConfigureLogin|InstallLogin|SetupLogin|LoginManager)\b'


composite_rules:
  - id: go-cron-schedule-install
    for: [go]
    desc: Go installs an every-minute cron job
    crit: suspicious
    conf: 0.92
    # Help text can quote both the schedule and the word crontab. Running
    # crontab in the same file is the install.
    near_lines: 120
    all:
      - id: micro-behaviors/os/autorun/cron::go-cron-schedule-literal
      - id: micro-behaviors/os/autorun/cron::go-exec-crontab-command
    unless:
      # CRD/API integration tests embed cronSpec / crontab schema fixtures
      # (e.g. Kubernetes CEL type-resolution tests) without installing cron.
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/package/testing/presence/harness::go-test-file
      - id: well-known/tool/offensive/raxuiscli::source-tree-path

  - id: go-linux-multi-surface-persistence
    for: [go]
    desc: Go agent installs multiple Linux persistence surfaces
    crit: hostile
    conf: 0.99
    near_lines: 120
    all:
      - id: micro-behaviors/fs/write/file/full::go-os-writefile
    needs: 3
    any:
      - id: micro-behaviors/os/service/config::systemd-etc-unit-path
      - id: go-cron-schedule-install
      - id: micro-behaviors/os/autorun/login-items::user-autostart-desktop-file-path
      - id: go-shell-startup-script-path

  - id: go-elf-rc-local-persistence-surface
    desc: Go ELF binary references rc.local persistence
    crit: component
    conf: 0.95
    for: [elf]
    any:
      - id: go-rc-local-persistence-routine
      - id: micro-behaviors/os/service/config::etc-rc-local
      - id: micro-behaviors/os/service/config::rc-local-path-marker

  - id: go-elf-systemd-persistence-surface
    desc: Go ELF binary references systemd persistence
    crit: component
    conf: 0.95
    for: [elf]
    any:
      - id: go-systemd-persistence-routine
      - id: micro-behaviors/fs/path/binary::systemctl-utility-path

  - id: go-elf-cron-persistence-surface
    desc: Go ELF binary references cron persistence
    crit: component
    conf: 0.95
    for: [elf]
    any:
      - id: go-cron-persistence-routine
      - id: micro-behaviors/fs/path/binary::crontab-utility-path

  - id: go-elf-login-script-persistence-surface
    desc: Go ELF binary references shell login script persistence
    crit: component
    conf: 0.95
    for: [elf]
    any:
      - id: go-login-script-persistence-routine
      - id: go-shell-startup-script-path

  - id: go-elf-multi-surface-persistence
    desc: Go ELF binary installs across multiple Linux persistence surfaces
    crit: hostile
    conf: 0.99
    for: [elf]
    all:
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/binary/symbols/name::go-os-exec-package-reference
    needs: 3
    any:
      - id: go-elf-rc-local-persistence-surface
      - id: go-elf-systemd-persistence-surface
      - id: go-elf-cron-persistence-surface
      - id: go-elf-login-script-persistence-surface
    unless:
      - id: well-known/tool/sysadmin/unix-benign/
      - id: metadata/package/testing/


