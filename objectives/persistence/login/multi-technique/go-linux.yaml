# Linux Go agents that install several independent login/startup mechanisms.
# One persistence API can be legitimate; authoring three different autorun
# surfaces in one agent is the attack-specific signal.
defaults:
  platforms: [linux]
  for: [go, elf]
  attack: T1053.003,T1543.002,T1547.013,T1546.004
  mbc: F0012

traits:
  # Agent CLIs bundle built-in skill documents as embedded strings; their
  # rc-file and crontab examples are prose, not a persistence routine.
  - id: go-embedded-agent-skill-docs
    desc: Go binary embeds built-in agent skill documents
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'builtin_skills/|SKILL\.md'

  - id: go-shell-startup-script-path
    desc: Go references a user shell startup script
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(\$HOME|~)/\.[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]{1,64}/(startup|init)\.sh'


composite_rules:
  - id: go-cron-schedule-install
    for: [go]
    desc: Go installs an every-minute cron job
    crit: suspicious
    conf: 0.92
    # Help text can quote both the schedule and the word crontab. Running
    # crontab in the same file is the install.
    near_lines: 120
    all:
      - id: micro-behaviors/os/autorun/cron/entry::go-cron-schedule-literal
      - id: micro-behaviors/os/autorun/cron/reference::go-exec-crontab-command
    unless:
      # CRD/API integration tests embed cronSpec / crontab schema fixtures
      # (e.g. Kubernetes CEL type-resolution tests) without installing cron.
      - id: well-known/tool/offensive/raxuiscli::source-tree-path

  - id: go-linux-multi-surface-persistence
    for: [go]
    desc: Go agent installs multiple Linux persistence surfaces
    crit: hostile
    conf: 0.99
    near_lines: 120
    all:
      - id: micro-behaviors/fs/write/file/full/call::go-os-writefile
    needs: 3
    any:
      - id: micro-behaviors/os/service/config::systemd-etc-unit-path
      - id: go-cron-schedule-install
      - id: micro-behaviors/os/autorun/login-items::user-autostart-desktop-file-path
      - id: go-shell-startup-script-path

  - id: go-elf-multi-surface-persistence
    for: [elf]
    desc: Go ELF agent combines multiple Linux persistence surfaces
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/compiler/systems::go-binary
      - id: micro-behaviors/os/autorun/cron/reference::cron-reference-clues
    needs: 2
    any:
      - id: micro-behaviors/fs/path/config/shell::native-bashrc-path
      - id: micro-behaviors/fs/path/config/shell::zshrc-filename
      - id: micro-behaviors/os/service/config::systemd-timer-enable-string
    unless:
      # Linguist language tables name rc files and crontab as file types.
      - id: well-known/lib/development/go-enry::go-enry-module
      # The verified kitten build embeds editor and lexer filename tables.
      - id: well-known/app/utility/kitty::kitten-arch-release
      # The scanner embeds rules containing startup-file and cron indicators.
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
    # Keep S, not silence: a real implant could also carry a SKILL.md string.
    downgrade:
      any:
        - id: go-embedded-agent-skill-docs
