defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: unsigned-explorer-run-winlogon-api-profile
  desc: Explorer Run and Winlogon paths with registry-open/create APIs
  crit: notable
  conf: 0.98
  all:
  - id: "micro-behaviors/os/registry/autostart/reference::policies-explorer-run-key-path"
  - id: "micro-behaviors/os/registry/autostart/reference::winlogon-registry-path"
  - id: metadata/signature/absent::unsigned-missing-signature-record
  any:
  - id: micro-behaviors/os/registry/create::reg-create-key-ex-a
  - id: micro-behaviors/os/registry/open::registry-open-key-api
