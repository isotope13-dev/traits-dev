# AWS control-plane persistence can combine an EC2 SSH key surface with a
# federated identity-provider change. A single administrative operation is
# only notable; the hostile finding requires both persistence surfaces.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  attack: T1098

composite_rules:
  - id: aws-multi-surface-persistence
    desc: AWS SSH and identity-provider persistence
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/services/aws::aws-key-pair-creation-operation
      - id: micro-behaviors/communications/http/services/aws::aws-ssh-public-key-operation
      - id: micro-behaviors/communications/http/services/aws::aws-identity-provider-operation

  - id: aws-ssh-access-persistence
    desc: AWS key-pair SSH access setup
    crit: suspicious
    conf: 0.94
    attack: T1098.004
    all:
      - id: micro-behaviors/communications/http/services/aws::aws-key-pair-creation-operation
      - id: micro-behaviors/communications/http/services/aws::aws-ssh-public-key-operation
