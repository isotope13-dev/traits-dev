# AWS control-plane persistence can combine an EC2 SSH key surface with a
# federated identity-provider change. A single administrative operation is
# only notable; the hostile finding requires both persistence surfaces.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  attack: T1098

composite_rules:
  - id: aws-multi-surface-persistence
    desc: AWS SSH and identity-provider persistence
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/services/aws-iam::aws-key-pair-creation-operation
      - id: micro-behaviors/communications/http/services/aws-iam::aws-ssh-public-key-operation
      - id: micro-behaviors/communications/http/services/aws-control::aws-identity-provider-operation

  - id: aws-ssh-access-persistence
    desc: AWS key-pair SSH access setup
    crit: suspicious
    conf: 0.94
    attack: T1098.004
    all:
      - id: micro-behaviors/communications/http/services/aws-iam::aws-key-pair-creation-operation
      - id: micro-behaviors/communications/http/services/aws-iam::aws-ssh-public-key-operation

  # An open trust policy alone can be a reviewed break-glass change; minting
  # IAM user keys right after is the attacker step that turns it into a
  # usable, long-lived backdoor (the wfx "AWS role open to everyone" stage).
  - id: aws-trust-policy-backdoor-with-key-issuance
    desc: Opens an AWS role then mints IAM keys
    crit: hostile
    conf: 0.97
    attack: T1098,T1136.003
    all:
      - id: micro-behaviors/communications/http/services/aws-iam::assume-role-trust-policy-open-to-all
      - id: micro-behaviors/communications/http/services/aws-iam::iam-access-key-create-operation
