defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: "T1547.001,T1547.009,T1053.005"

traits:
  - id: hive-run-user-field
    desc: User Run-hive field
    crit: notable
    conf: 0.98
    if:
      type: text
      word: HiveRunUser

  - id: hive-run-machine-field
    desc: Machine Run-hive field
    crit: notable
    conf: 0.98
    if:
      type: text
      word: HiveRunMachine

  - id: task-template-field
    desc: Scheduled-task template field
    crit: notable
    conf: 0.98
    if:
      type: text
      word: TaskTemplate

  - id: link-template-field
    desc: Shell-link template field
    crit: notable
    conf: 0.98
    if:
      type: text
      word: LinkTemplate

  - id: registry-writer-type
    desc: Registry writer type
    crit: notable
    conf: 0.99
    if:
      type: text
      word: RegistryWriter

  - id: scheduler-writer-type
    desc: Scheduled-task writer type
    crit: notable
    conf: 0.99
    if:
      type: text
      word: SchedulerWriter

  - id: shell-link-writer-type
    desc: Shell-link writer type
    crit: notable
    conf: 0.99
    if:
      type: text
      word: ShellLinkWriter

  - id: heartbeat-loop-method
    desc: Heartbeat persistence loop method
    crit: notable
    conf: 0.96
    if:
      type: text
      word: HeartbeatLoop

  - id: persistence-bootstrap-type
    desc: Managed persistence bootstrap type
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\b(BootstrapLoader|StartupFramework)\b'

composite_rules:
  - id: run-hive-field-pair
    desc: User and machine Run-hive fields
    crit: component
    conf: 0.98
    all:
      - id: hive-run-user-field
      - id: hive-run-machine-field

  - id: task-link-template-pair
    desc: Task and shortcut persistence templates
    crit: component
    conf: 0.98
    all:
      - id: task-template-field
      - id: link-template-field

  - id: persistence-writer-type-set
    desc: Three managed persistence writers
    crit: component
    conf: 0.99
    all:
      - id: registry-writer-type
      - id: scheduler-writer-type
      - id: shell-link-writer-type

  - id: dotnet-heartbeat-multivector-persistence
    desc: Managed loader maintains Run-key, task, and shortcut persistence
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: run-hive-field-pair
      - id: task-link-template-pair
      - id: persistence-writer-type-set
      - id: heartbeat-loop-method
      - id: persistence-bootstrap-type
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
