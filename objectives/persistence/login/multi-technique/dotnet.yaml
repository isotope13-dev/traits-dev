defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1547.001,T1053.005

composite_rules:
  - id: dotnet-obfuscated-dual-login-persistence
    desc: Unsigned .NET embeds task and reversed Run-key persistence
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/layout::pe-no-signature-record
      - id: objectives/anti-static/obfuscation/string/reverse::reversed-currentversion-run-path
      - id: micro-behaviors/data/encode/string::dotnet-strreverse
      - id: objectives/persistence/login/scheduled-task/cli::windows-schtasks-onlogon-highest
