defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1547.001,T1053.005

composite_rules:
  # A managed RAT can keep both autostart mechanisms in one install routine:
  # an encoded Run-key path written through RegistryKey.SetValue and a forced
  # highest-privilege task triggered at logon. Tie the persistence claim to
  # the already established MessagePack plugin backdoor so ordinary managed
  # software that registers a task or Run value is not convicted.
  - id: managed-plugin-dual-logon-persistence
    desc: Plugin backdoor Run-key/logon-task options
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/command-and-control/backdoor/dispatch/module::messagepack-managed-plugin-tasking
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
      - id: micro-behaviors/os/registry/access::dotnet-registrykey-setvalue-references
      - id: micro-behaviors/os/autorun/control::windows-schtasks-onlogon-highest

  - id: dotnet-obfuscated-dual-login-persistence
    desc: Unsigned .NET embeds task and reversed Run-key registration code
    # These are alternative registration routines, not evidence that both run.
    # The implant configuration can disable installation altogether.
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: objectives/anti-static/obfuscation/string/reverse::reversed-currentversion-run-path
      - id: micro-behaviors/data/string/reverse::dotnet-strreverse
      - id: micro-behaviors/os/autorun/control::windows-schtasks-onlogon-highest
      - id: micro-behaviors/os/registry/access::dotnet-registrykey-setvalue-references
