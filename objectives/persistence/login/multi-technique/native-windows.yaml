defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1547.001,T1547.004

traits:
  - id: policies-explorer-run-key-path
    desc: Explorer Policies Run autorun key path
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)CurrentVersion[\\/]Policies[\\/]Explorer[\\/]Run'

  - id: winlogon-notify-key-path
    desc: Winlogon Notify package key path
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)Windows NT[\\/]CurrentVersion[\\/]Winlogon[\\/]Notify[\\/]'

composite_rules:
  - id: self-deleting-multi-surface-login-persistence
    desc: Self-deleting PE targets three login autoruns
    crit: hostile
    conf: 0.99
    all:
      - id: policies-explorer-run-key-path
      - id: winlogon-notify-key-path
      - id: objectives/persistence/login/registry/autostart::currentversion-run-key-path
      - id: micro-behaviors/os/registry/access::registry-set-value-api
      - id: objectives/evasion/self-delete/file/delay::copied-ping-helper-delete-loop
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/
