defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1547.001,T1547.004

traits:
composite_rules:
  - id: self-deleting-multi-surface-login-persistence
    desc: Self-deleting PE targets three login autoruns
    crit: hostile
    conf: 0.99
    all:
      - id: "micro-behaviors/os/registry/autostart/reference::policies-explorer-run-key-path"
      - id: "micro-behaviors/os/registry/autostart/reference::winlogon-notify-subkey"
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path"
      - id: micro-behaviors/os/registry/value/write::registry-set-value-api
      - id: objectives/evasion/self-delete/file/delay::copied-ping-helper-delete-loop
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/installer/product/

