defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1053.005,T1547.001

composite_rules:
  # Several independent autostart methods attached to a remote PowerShell
  # stager establish redundant login persistence, rather than mere API use.
  - id: wsh-remote-stage-redundant-login-persistence
    desc: WSH remote PowerShell stager installs redundant login persistence
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: objectives/execution/payload/file-exec/command/script-host-download::wsh-xmlhttp-fso-execute-dropper
      - id: micro-behaviors/os/autorun/control::register-task-definition
      - id: micro-behaviors/os/registry/write::wscript-regwrite
      - id: micro-behaviors/os/autorun/login-items::startup-shortcut-creation
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
