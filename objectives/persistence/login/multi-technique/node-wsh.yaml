defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1547.001,T1547.009,T1070.004

composite_rules:
  # Redundant Run/UserInit and Startup persistence plus cleanup of the
  # persistence script is a durable malware installation pattern, not a
  # generic shortcut or registry capability.
  - id: node-wsh-redundant-logon-persistence
    desc: Node payload installs redundant WSH persistence and self-cleans
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/os/autorun/login-items::windows-logon-script-reference
      - id: micro-behaviors/os/autorun/login-items::shortcut-creation-startup-reference
      - id: micro-behaviors/fs/delete/file/self::js-self-delete-literal
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
    unless:
      - id: metadata/build/
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
