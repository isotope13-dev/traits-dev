defaults:
  platforms: [windows]
  for: [go]

composite_rules:
  - id: go-multi-mechanism-persistence
    desc: "Go redundant service and login persistence"
    crit: hostile
    conf: 0.98
    attack: T1543.003,T1547.001,T1053.005
    all:
      - id: micro-behaviors/os/service/create::go-sc-create-command
      - id: objectives/persistence/login/registry/write::go-run-key-reg-command-clues
      - id: micro-behaviors/os/autorun/task-registration::go-schtasks-create-command
      - id: micro-behaviors/fs/write/file/full/unspecified::go-missing-path-write-pair
    any:
      - id: micro-behaviors/communications/http/post::go-http-post-method
      - id: micro-behaviors/hardware/display/screenshot/unspecified::go-screen-capture
    near_bytes: 4096
