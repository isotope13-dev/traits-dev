defaults:
  platforms: [unix, windows, macos]
  for: [scripts, binaries, source]
composite_rules:
- id: sensitive-source-or-operator-token
  desc: Sensitive source or operator token
  crit: component
  conf: 0.9
  unless:
  - id: well-known/tool/development/ci/changesets-action::official-changesets-action-context
  any:
  - id: micro-behaviors/communications/http/auth::hardcoded-telegram-bot-token-literal
  - id: objectives/exfiltration/messaging/telegram::sensitive-document-name-targets
  - id: micro-behaviors/fs/path/credential::any-credential-path

- id: python-elevated-telegram-archive-staging
  desc: Python stages Telegram data after elevation
  crit: hostile
  conf: 0.99
  attack: T1005,T1539,T1560.001,T1548.002
  for: [python]
  scope: file
  all:
  - id: micro-behaviors/fs/path/token::telegram-session-data-location
  - id: micro-behaviors/os/privilege/elevation::python-self-elevation-relaunch
  - id: micro-behaviors/data/archive/create/zip::python-shutil-make-archive

- id: python-android-storage-zip-staging
  desc: Python stages Android storage files into a ZIP archive
  crit: hostile
  conf: 0.98
  attack: T1005,T1560.001
  platforms: [unix]
  for: [python]
  scope: file
  all:
  - id: micro-behaviors/fs/path/personal::android-storage-emulated
  - id: micro-behaviors/data/archive/create/zip::python-zipfile-writer
- id: rust-sensitive-appdata-zip-staging
  desc: Rust app-data paths with traversal and ZIP writer
  crit: suspicious
  conf: 0.96
  attack: T1005,T1560.001
  for: [rust, crate, binaries]
  scope: file
  all:
  - id: micro-behaviors/fs/directory/traverse::rust-walkdir-capability
  - id: micro-behaviors/data/archive/zip::rust-zipwriter-capability
  any:
  - id: micro-behaviors/fs/path/token::telegram-session-data-location
  - id: micro-behaviors/fs/path/app-data::chromium-local-extension-settings-path
