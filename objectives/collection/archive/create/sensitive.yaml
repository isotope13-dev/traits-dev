# Archive creation applied to credential material: the writer capability, the
# sensitive-path reference, and the composite that pairs them. Kept with the
# other archive-creation rules rather than under a `data/` heading, which
# named the contents rather than the act.
defaults:
  platforms: [unix, windows, macos]
  for: [scripts, binaries, source]
# Collection of sensitive files into archives
# ATT&CK: T1560 (Archive Collected Data)
composite_rules:
  - id: archive-writer
    desc: Archive creation capability
    crit: component
    any:
      - id: micro-behaviors/data/archive/zip::zip-writer
      - id: micro-behaviors/data/archive/zip::zip-create
      - id: micro-behaviors/data/archive/zip::miniz-zip-writer-api
      - id: micro-behaviors/data/archive/library::archiver

  - id: sensitive-credentials
    desc: "Reference to sensitive credentials"
    crit: component
    any:
      - id: objectives/credential-access/ssh/key::id-rsa
      - id: micro-behaviors/fs/path/token::gcloud-credentials
      - id: metadata/file/string/cloud::gcp-default-credentials
  # Relocated (2026-09-17) from objectives/exfiltration/messaging/telegram, where
  # it was named `telegram-archive-sensitive-source`. Two of its three legs --
  # a credential path and sensitive document names -- have nothing to do with
  # Telegram, so it is not the attack-context-specific fragment RULES.md requires
  # of a `component` in objectives/. Sitting under exfiltration/messaging/ it was
  # swept in wholesale by any composite referencing that directory: it satisfied
  # the `any:` leg of the hostile `npm-token-theft` on npm's own
  # scripts/create-node-pr.js, which reads GITHUB_TOKEN to open a release PR.
  # The Telegram composites still reference it across directories, where their
  # own bot-API legs supply the Telegram context.
  - id: sensitive-source-or-operator-token
    desc: Sensitive source or operator token
    crit: component
    conf: 0.9
    unless:
      - id: well-known/tool/development/ci/changesets-action::official-changesets-action-context
    any:
      - id: objectives/command-and-control/channel/messaging::hardcoded-telegram-bot-token-literal
      - id: objectives/exfiltration/messaging/telegram::sensitive-document-name-targets
      - id: micro-behaviors/fs/path/credential::any-credential-path

  - id: sensitive-archiving
    desc: "Archiving of sensitive credentials or keys"
    crit: suspicious
    conf: 0.95
    attack: "T1560"
    all:
      - id: archive-writer
      - id: micro-behaviors/os/user/
      - id: micro-behaviors/fs/file/
      - id: sensitive-credentials
    scope: leaf
    unless:
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-cloud-native-tool-binary

  - id: python-elevated-telegram-archive-staging
    desc: Python stages Telegram data after elevation
    crit: hostile
    conf: 0.99
    attack: T1005,T1539,T1560.001,T1548.002
    for: [python]
    scope: file
    all:
      - id: objectives/collection/messaging/app::telegram-tdata-desktop-win
      - id: micro-behaviors/os/privilege/elevation::python-self-elevation-relaunch
      - id: micro-behaviors/data/archive/create/zip::python-shutil-make-archive
