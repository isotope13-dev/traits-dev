defaults:
  for:
    - shell
    - applescript
    - python
  attack: T1560.001
  platforms:
    - macos
  crit: notable
traits:
  - id: ditto-keepparent
    desc: ditto --keepParent compression
    crit: notable
    conf: 0.75
    if:
      type: string_literal
      regex: ditto.{0,30}--keepParent.{0,30}-c
  - id: ditto-rsrc-flag
    desc: ditto -rsrc flag
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: ditto.{0,30}-rsrc
  - id: zip-recursive-quiet
    desc: zip -r or -q flag
    crit: notable
    conf: 0.6
    if:
      type: string_literal
      regex: \bzip\s+-[rq]
  - id: zip-output-file
    desc: zip command output file
    crit: notable
    conf: 0.65
    if:
      type: string_literal
      regex: \bzip\s+-[A-Za-z0-9qr-]*\s+\S{1,80}\.zip\b

  - id: ditto-copy
    desc: macOS ditto directory copy
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: (?i)\bditto\s+([~./]|\$[A-Za-z_]|\"[~./]|'[~./])
  - id: hdiutil-create-cmd
    desc: hdiutil create command
    crit: notable
    conf: 0.65
    if:
      type: string_literal
      regex: hdiutil\s+create
  - id: hdiutil-format-flag
    desc: hdiutil -format flag
    crit: notable
    conf: 0.65
    if:
      type: string_literal
      regex: hdiutil.{0,30}-format
  - id: tar-create-flag
    desc: tar create flag
    crit: component
    conf: 0.5
    if:
      type: string_literal
      regex: tar\s+-[a-z]*c[a-z]*
  - id: tar-create-long
    desc: tar --create long option
    crit: notable
    conf: 0.5
    if:
      type: string_literal
      substr: tar --create
  - id: gzip-compress
    desc: gzip command compression flag
    crit: component
    conf: 0.5
    if:
      type: string_literal
      regex: gzip\s+-
    unless:
      - id: well-known/app/system/drivers/nvidia::linux-driver-script-basename
  - id: zip-flags
    desc: zip with flags
    crit: notable
    conf: 0.55
    if:
      type: string_literal
      regex: \bzip\s+-[r0-9]
composite_rules:
  - id: ditto-compress-comp
    desc: ditto archive creation with compression
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/data/archive/create/utility::macos-ditto-compress-flags
      - id: ditto-keepparent
  - id: ditto-sequester-comp
    desc: ditto with resource fork handling
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/data/archive/create/utility::macos-ditto-sequester-resources
      - id: ditto-rsrc-flag
  - id: zip-create-comp
    desc: zip archive creation
    crit: notable
    conf: 0.75
    all:
      - id: zip-recursive-quiet
      - id: zip-output-file
  - id: tmp-archive
    desc: Archive creation in /tmp
    crit: suspicious
    conf: 0.8
    any:
      - id: zip-create-comp
      - id: ditto-compress-comp
    all:
      - id: micro-behaviors/fs/path/temp::tmp-zip-path
    unless:
      - id: well-known/app/infrastructure/skypilot::skypilot-source-file
  - id: ditto-staging
    desc: macOS data staging via ditto
    crit: suspicious
    conf: 0.9
    any:
      - id: ditto-compress-comp
      - id: ditto-sequester-comp
    all:
      - id: tmp-archive

  - id: hdiutil-create
    desc: macOS disk image creation
    crit: notable
    conf: 0.75
    any:
      - id: hdiutil-create-cmd
      - id: hdiutil-format-flag
  - id: tar-compress
    desc: tar archive creation
    crit: notable
    conf: 0.6
    any:
      - id: tar-create-flag
      - id: tar-create-long
      - id: gzip-compress
    unless:
      # Autotools configure scripts probe tar/gzip as build tooling, not staging.
      - id: metadata/build/autotools::autoconf-generated-script
      - id: objectives/supply-chain/install-hook/build/autotools::configure-context-name
      - id: objectives/supply-chain/install-hook/build/autotools::configure-context-marker
