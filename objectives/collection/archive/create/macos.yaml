defaults:
  for:
  - shell
  - applescript
  - python
  attack: T1560.001
  platforms:
  - macos
  crit: notable
traits:
- id: ditto-copy
  desc: macOS ditto directory copy
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: (?i)\bditto\s+([~./]|\$[A-Za-z_]|\"[~./]|'[~./])
- id: hdiutil-create-cmd
  desc: hdiutil create command
  crit: notable
  conf: 0.65
  if:
    type: string_literal
    regex: hdiutil\s+create
- id: hdiutil-format-flag
  desc: hdiutil -format flag
  crit: notable
  conf: 0.65
  if:
    type: string_literal
    regex: hdiutil.{0,30}-format
- id: zip-flags
  desc: zip with flags
  crit: notable
  conf: 0.55
  if:
    type: string_literal
    regex: \bzip\s+-[r0-9]
composite_rules:
- id: hdiutil-create
  desc: macOS disk image creation
  crit: notable
  conf: 0.75
  any:
  - id: hdiutil-create-cmd
  - id: hdiutil-format-flag
