defaults:
  platforms: [macos]
  for: [applescript, shell]
  attack: T1005
  mbc: B0028

composite_rules:
# Only that an AppleScript builds an archive under /tmp: report tools and
# backup scripts do the same. The grabber reading comes from composites that
# add what was collected and where it goes.
- id: applescript-tmp-archive-create
  desc: AppleScript creates an archive in /tmp
  crit: notable
  conf: 0.93
  attack: T1560.001
  for: [applescript]
  any:
  - id: tmp-archive
  - id: zip-create-comp
  - id: micro-behaviors/data/archive/zip::zip-cli-create
