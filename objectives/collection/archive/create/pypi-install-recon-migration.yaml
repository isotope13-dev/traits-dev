defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1195.002
composite_rules:
- id: python-zips-walked-extension-files
  desc: Archive walked extension-matched files
  crit: suspicious
  conf: 0.96
  attack: T1560,T1083
  scope: file
  all:
  - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
  - id: micro-behaviors/data/archive/zip::python-zipfile-writer
  - id: micro-behaviors/fs/path/extension::python-path-endswith-variable
  - id: micro-behaviors/data/parse/vocabulary::private-key-field-name
