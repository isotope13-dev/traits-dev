defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  crit: notable
composite_rules:
  - conf: 0.95
    id: python-user-dir-locale-beside-popen-zip-password-text
    desc: Python user-dir/locale references beside Popen/ZIP/password text
    all:
      - id: micro-behaviors/fs/path/user-directory::python-user-directory-refs
      - id: micro-behaviors/data/format/locale::locale-or-translation-evidence
      - id: "metadata/lang/source/syntax/command/launch::python-popen-zip-password-text-pattern"
  - conf: 0.95
    id: python-user-dir-wallet-beside-popen-zip-password-text
    desc: Python user-dir/wallet references beside Popen/ZIP/password text
    all:
      - id: micro-behaviors/fs/path/user-directory::python-user-directory-refs
      - id: objectives/credential-access/wallet/mnemonic::wallet-marker
      - id: "metadata/lang/source/syntax/command/launch::python-popen-zip-password-text-pattern"
