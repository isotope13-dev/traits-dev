defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  - id: network-agent-filesystem-archive-command
    desc: Network agent acquires filesystem archive
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?m)^\s*(sudo\s+)?\S+\s+agent\s+tar\s+-i\s+\S+\s+-o\s+\S+'
