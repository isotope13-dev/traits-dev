# Agent configs that stage account-identity command output to a local file.
defaults:
  platforms: [unix, windows]
  for: [json]
  attack: T1074

composite_rules:
  - id: agent-config-identity-capture
    desc: Agent config captures identity to staged file
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/shell/agent-config::process-adapter-type
      - id: micro-behaviors/process/create/shell/agent-config::shell-interpreter-command
      - id: micro-behaviors/process/create/shell/agent-config::shell-command-flag
      - id: micro-behaviors/process/create/shell/agent-config::shell-command-operators
      - id: objectives/discovery/account/lookup::agent-config-id-command
    any:
      - id: objectives/discovery/account/lookup::agent-config-whoami-command
    unless:
      - id: metadata/package/config::agent-inventory-process-adapter
