# Agent configs that stage command output to a local file path.
defaults:
  platforms: [unix, windows]
  for: [json]
  attack: T1074

traits:
  - id: agent-embedded-id-command
    desc: Agent config embeds id command
    crit: suspicious
    conf: 0.92
    if:
      type: value
      path: agents.*.adapter.config.args[*]
      regex: '\bid\b'

  - id: agent-embedded-whoami-command
    desc: Agent config embeds whoami command
    crit: suspicious
    conf: 0.92
    if:
      type: value
      path: agents.*.adapter.config.args[*]
      regex: '\bwhoami\b'

  - id: agent-staged-output-path
    desc: Agent config writes to staged file path
    crit: suspicious
    conf: 0.93
    if:
      type: value
      path: agents.*.adapter.config.args[*]
      regex: '/tmp/[^\s"]+'

composite_rules:
  - id: agent-config-identity-capture
    desc: Agent config captures identity to staged file
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/execution/automation/agent::agent-process-adapter-type
      - id: agent-embedded-id-command
      - id: agent-staged-output-path
    any:
      - id: agent-embedded-whoami-command
