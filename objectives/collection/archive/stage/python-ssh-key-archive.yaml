# A private SSH key path is passed to a ZIP writer, so this detects targeted
# staging of a credential rather than general archive creation.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1074.001
  mbc: B0030

composite_rules:
  - id: python-ssh-private-key-archive-staging
    desc: Stages an SSH private key in a ZIP archive
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/private-key::ssh-private-key
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-writer
    scope: file
    near_bytes: 512
