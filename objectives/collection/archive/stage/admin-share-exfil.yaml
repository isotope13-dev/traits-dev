# Admin-share document harvest and archive staging (SilkLurk-class).
defaults:
  platforms: [windows]
  for: [batch, powershell, scripts]
  attack: T1021.002,T1560.001,T1005

traits:
  - id: batch-net-use-admin-credentials
    desc: net use with admin share credentials
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)net\s+use\s+\\\\[^\\\r\n]{1,80}\\[a-z]\$\s+/user:'

  - id: ps-admin-share-enumeration
    desc: PowerShell lists admin share path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)Get-ChildItem\s+\\\\[^\\\r\n]{1,80}\\[a-z]\$'

  - id: ps-sensitive-document-include
    desc: PowerShell includes office document globs
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)-Include\s+\*\.(docx|xlsx|pdf)'

  - id: ps-copy-item-destination
    desc: PowerShell Copy-Item destination
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)Copy-Item\s+-Destination'

  - id: batch-disguised-programdata-exe
    desc: Batch runs exe from disguised ProgramData path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)ProgramData\\[^\\\r\n]{1,80}\\[^\\\r\n]{1,80}\.exe'

  - id: batch-vendor-dll-copy
    desc: Batch copies DLL into vendor tree path
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)copy\s+[^\r\n]{1,120}ProgramData\\Symantec\\[^\r\n]{1,80}\.dll'

composite_rules:
  - id: ps-admin-share-document-recurse-copy
    desc: PowerShell copies documents from admin share
    crit: notable
    conf: 0.96
    all:
      - id: ps-admin-share-enumeration
      - id: ps-sensitive-document-include
      - id: ps-copy-item-destination
    near_lines: 3

  - id: admin-share-document-exfil-staging
    desc: Admin share document harvest with archive
    crit: hostile
    conf: 0.98
    all:
      - id: batch-net-use-admin-credentials
      - id: ps-admin-share-document-recurse-copy
    any:
      - id: objectives/collection/archive/upload::sevenzip-archive-command
      - id: objectives/collection/archive/upload::rar-archive-command
      - id: objectives/collection/archive/stage::network-share-archive-staging

  - id: batch-post-exfil-payload-staging
    desc: Batch stages disguised malware after exfil
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/evasion/masquerade/file/suspicious-path::exe-in-public-folder
    any:
      - id: batch-vendor-dll-copy
      - id: batch-disguised-programdata-exe
