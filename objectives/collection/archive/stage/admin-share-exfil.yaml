# Admin-share document harvest and archive staging (SilkLurk-class).
defaults:
  platforms: [windows]
  for: [batch, powershell, scripts]
  attack: T1021.002,T1560.001,T1005

traits:
  - id: ps-admin-share-enumeration
    desc: PowerShell lists admin share path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)Get-ChildItem\s+\\\\[^\\\r\n]{1,80}\\[a-z]\$'

  - id: ps-sensitive-document-include
    desc: PowerShell includes office document globs
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)-Include\s+\*\.(docx|xlsx|pdf)'

  - id: ps-copy-item-destination
    desc: PowerShell Copy-Item destination
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)Copy-Item\s+-Destination'

composite_rules:
  - id: ps-admin-share-document-recurse-copy
    desc: PowerShell copies documents from admin share
    crit: notable
    conf: 0.96
    all:
      - id: ps-admin-share-enumeration
      - id: ps-sensitive-document-include
      - id: ps-copy-item-destination
    near_lines: 3

  - id: admin-share-document-archive-staging
    desc: Admin-share document harvest and archive staging
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/network/share::net-use-admin-share-credentials
      - id: ps-admin-share-document-recurse-copy
    any:
      - id: micro-behaviors/data/archive/create/utility::archive-7z-create
      - id: micro-behaviors/data/archive/create/utility::archive-rar-create
      - id: objectives/collection/archive/stage::network-share-archive-staging
