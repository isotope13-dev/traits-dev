# Archive staging from a mounted or directly addressed Windows network share.
# A share reference and an archive utility are both common on their own; the
# combination is useful triage context for collection activity.
defaults:
  platforms: [windows, unix]
  for: [powershell, batch, shell]
  attack: T1021.002,T1560.001

composite_rules:
  - id: network-share-archive-staging
    desc: Archives data from a Windows network share
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/os/network/share::unc-path-reference
      - id: micro-behaviors/data/archive/create/utility::archive-utility-create
