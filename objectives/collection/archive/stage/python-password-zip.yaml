# Python generic stealer behaviors
# ATT&CK: T1005 (Data from Local System)
defaults:
  conf: 0.95
  platforms: [unix, windows]
  for: [python]
  attack: "T1005"
  crit: hostile
composite_rules:
  # objectives/collection/app-data/metadata::user-directory-enum inherits its
  # own file's `for: [macho, objc, swift, applescript]` even though all four
  # of its `any:` legs are already declared for: [scripts, ...] (scripts
  # includes python) or explicitly for: [python, ...]. Re-pool the same legs
  # here with a python-scoped wrapper instead of the narrower macOS one.
  - id: python-user-directory-enum
    desc: Enumerates user directories
    crit: notable
    conf: 0.8
    needs: 2
    any:
      - id: micro-behaviors/fs/path/location::user-library-path
      - id: micro-behaviors/fs/path/location::downloads-folder-target
      - id: micro-behaviors/fs/path/location::documents-folder-target
      - id: micro-behaviors/os/env/user-info::home-var
  - id: python-zip-stealer-wallet
    desc: Enumerates user dirs, seeks wallet data, makes password-protected zip
    all:
      - id: python-user-directory-enum
      - id: objectives/credential-access/wallet/mnemonic::wallet-marker
      - id: micro-behaviors/process/create/subprocess::popen-zip-password
  - id: python-zip-stealer-french
    desc: Enumerates user dirs, seeks French security data, makes password-protected zip
    all:
      - id: python-user-directory-enum
      - id: metadata/lang/locale/
      - id: micro-behaviors/process/create/subprocess::popen-zip-password
