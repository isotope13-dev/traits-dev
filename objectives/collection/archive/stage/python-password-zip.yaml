defaults:
  conf: 0.95
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1005
  crit: hostile
composite_rules:
  - id: python-android-storage-archive-stage
    desc: Python stages Android shared storage files into an archive
    conf: 0.98
    attack: T1005,T1560.001
    mbc: E1005,E1560
    all:
      - id: micro-behaviors/fs/path/personal::android-storage-emulated
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-writer
    any:
      - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
      - id: micro-behaviors/fs/directory/readdir::python-directory-listing
