# The wallet process termination is a decoded call with a known argument.
# The staging and sensitive-store references co-occur; their data flow is not
# established by this rule.
defaults:
  for: [applescript]
  platforms: [macos]
composite_rules:
  - id: obfuscated-wallet-staging-with-wallet-process-stop
    desc: Obfuscated script stops wallet apps with staging references
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/encoding/arithmetic::scpt-arithmetic-character-decoders
      - id: objectives/collection/archive/stage::filegrabber-staging-bucket
      - id: micro-behaviors/fs/path/app-data::browser-wallet-storage-references
      - id: micro-behaviors/process/terminate/command::scpt-pkill-wallet-application
