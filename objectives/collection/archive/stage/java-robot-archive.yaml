defaults:
  crit: hostile
  conf: 0.99
  platforms: [unix, windows]
  for: [jar, zip]
  attack: T1041

composite_rules:
  - id: obfuscated-java-archive-form-staging
    for: [jar, zip, class]
    desc: "Obfuscated Java archive and multipart staging"
    scope: archive
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/class-name::java-deep-lookalike-identifier-namespace
      - id: micro-behaviors/hardware/input/robot::jvm-awt-robot-class-ref
      - id: micro-behaviors/data/archive/create/zip::jvm-zip-output-stream-class-ref
      - id: micro-behaviors/communications/http/form::jvm-okhttp-multipart-builder-class-ref

  - id: obfuscated-java-zip-multipart-staging
    desc: Obfuscated Java zip and multipart staging
    crit: hostile
    conf: 0.98
    for: [jar, zip, class]
    scope: archive
    attack: T1560.001,T1041
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/class-folder::java-archive-lookalike-class-tree
      - id: micro-behaviors/data/archive/create/zip::jvm-zip-output-stream-class-ref
      - id: micro-behaviors/communications/http/form::jvm-okhttp-multipart-builder-class-ref
      - id: metadata/package/dependencies/archive::bundled-okhttp-multipart
