defaults:
  crit: hostile
  conf: 0.99
  platforms: [unix, windows]
  for: [jar, zip]
  attack: T1041

composite_rules:
  - id: obfuscated-java-archive-form-staging
    for: [jar, zip, class]
    desc: "Obfuscated Java archive and multipart staging"
    scope: archive
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/class-name::java-deep-lookalike-identifier-namespace
      - id: micro-behaviors/hardware/input/robot::jvm-awt-robot-class-ref
      - id: micro-behaviors/data/archive/create/zip::jvm-zip-output-stream-class-ref
      - id: micro-behaviors/communications/http/form::jvm-okhttp-multipart-builder-class-ref
