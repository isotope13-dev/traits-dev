# Require close source proximity; distant configuration reads are unrelated.
defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: data-staging
    desc: "Sensitive paths near archive creation"
    crit: suspicious
    conf: 0.98
    mbc: "B0030"
    attack: "T1074"
    near_bytes: 512
    all:
      - id: micro-behaviors/fs/path/credential::archive-sensitive-file-path-reference
    any:
      # Archive writers only. walk-skips-dotfiles lives under fs/search/ and is the
      # opposite signal: a walk that leaves ~/.ssh and browser profiles behind.
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-writer
      - id: micro-behaviors/data/archive/create/zip::python-shutil-make-archive
      - id: micro-behaviors/data/archive/create/tar/
    unless:
      - id: micro-behaviors/data/archive/create/zip::hidden-excluding-archive-walk

  - id: python-browser-credential-archive-stage
    desc: Python stages browser credentials in tar archive
    crit: hostile
    conf: 0.98
    platforms: [unix, macos, windows]
    attack: T1555.003,T1560.001
    all:
      - id: micro-behaviors/data/archive/create/tar::python-tar-gz-write-mode
      - id: micro-behaviors/fs/path/password-store::login-data
    any:
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
      - id: micro-behaviors/fs/path/cookie::safari-binary-cookies
      - id: micro-behaviors/fs/path/cookie::cookies-path
      - id: micro-behaviors/fs/path/application/browser/profile::chrome-google-profile-path
