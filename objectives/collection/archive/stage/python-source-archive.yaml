defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: data-staging
    desc: "Sensitive paths near archive creation"
    crit: suspicious
    conf: 0.98
    mbc: "B0030"
    attack: "T1074"
    near_lines: 100
    all:
      - id: micro-behaviors/fs/path/credential::archive-sensitive-file-path-reference
    any:
      # Archive writers only. walk-skips-dotfiles lives under zip/ and is the
      # opposite signal: a walk that leaves ~/.ssh and browser profiles behind.
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-writer
      - id: micro-behaviors/data/archive/create/zip::python-shutil-make-archive
      - id: micro-behaviors/data/archive/create/tar/
    unless:
      - id: micro-behaviors/data/archive/create/zip::hidden-excluding-archive-walk
      - id: well-known/lib/crypto/google-auth::python-package-context
      - id: well-known/lib/ai/ibm-watsonx-ai::ibm-watsonx-ai-sdk-context
      - id: "metadata/file/naming::test-directory-component"
      - id: well-known/tool/detection/
      # gVisor's website rule packages rendered docs into a tarball; docs
      # publishing, not exfiltration staging.
      - id: well-known/lib/platform/gvisor::gvisor-module-root-path
      - id: metadata/build/bazel/
