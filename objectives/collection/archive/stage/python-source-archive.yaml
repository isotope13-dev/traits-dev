defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: data-staging
    desc: "Data staging for exfiltration"
    crit: suspicious
    conf: 0.98
    mbc: "B0030"
    attack: "T1074"
    near_lines: 100
    all:
      - id: objectives/credential-access/theft/multi-store::stealer-data-source-marker
    any:
      - id: micro-behaviors/data/archive/create/zip/
      - id: micro-behaviors/data/archive/create/tar/
    unless:
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: well-known/tool/detection/proxy-sandbox
      - id: well-known/lib/crypto/google-auth::python-package-context
      - id: well-known/lib/ai/ibm-watsonx-ai::ibm-watsonx-ai-sdk-context
      - id: metadata/package/testing/presence/harness::test-directory-path
