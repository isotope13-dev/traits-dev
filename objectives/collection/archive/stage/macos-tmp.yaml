# Temporary artifacts a macOS archive run leaves behind -- the .dmg or zip in
# /tmp that the loot is assembled into before upload. Split from the archive
# *commands*, which are in ../create/macos.yaml.
defaults:
  crit: notable
  for:
    - shell
    - applescript
  attack: T1560
  platforms:
    - macos
traits:
  - id: tmp-dmg-file
    desc: .dmg file in /tmp
    conf: 0.6
    attack: T1074.001
    if:
      type: string_literal
      regex: /tmp/.{0,50}\.dmg
  - id: tmp-out-file
    desc: /tmp/out. output file
    conf: 0.6
    attack: T1074.001
    if:
      type: string_literal
      substr: /tmp/out.
  - id: tmp-zip-staging
    desc: Zip staged in /tmp
    conf: 0.7
    attack: T1074.001
    if:
      type: string_literal
      regex: /tmp/[^\s]{1,50}\.zip
composite_rules:
  - id: tmp-directory
    desc: Staging in /tmp
    conf: 0.7
    attack: T1074.001
    any:
      - id: tmp-zip-staging
      - id: tmp-dmg-file
      - id: tmp-out-file
