# The article describes a repeatable collection-to-exfiltration workflow:
# selectively find valuable files, regroup them into an archive, then move the
# archive through a cloud, HTTP, or file-transfer channel.  The individual
# capabilities remain notable; the conjunctions express the malicious goal.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  attack: T1005,T1074.001,T1560.001,T1041,T1567.002

traits:
  - id: rar-archive-command
    desc: RAR archive command
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(rar|winrar)(\.exe)?\s+[a-z-]*a\b'
    unless:
      - id: metadata/file/profile/metrics::powershell-no-parsed-call-sites

  - id: passworded-sevenzip-command
    desc: Passworded 7-Zip command
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b7z[a]?\b[^\r\n]{0,100}\s[a-z-]*a\b[^\r\n]{0,100}\s-p\S*'

  - id: passworded-rar-command
    desc: Passworded RAR command
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(rar|winrar)\b[^\r\n]{0,100}\s[a-z-]*a\b[^\r\n]{0,100}\s-h?p\S*'

  - id: azcopy-transfer-command
    desc: AzCopy transfer command
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bazcopy(\.exe)?\s+copy\b'

  - id: megacmd-transfer-command
    desc: MEGAcmd transfer command
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bmegacmd\b[^\r\n]{0,120}\b(put|upload|copy)\b'

  - id: s5cmd-copy-command
    desc: s5cmd copy command
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bs5cmd(\.exe)?\s+cp\b'
    unless:
      - id: metadata/file/profile/metrics::powershell-no-parsed-call-sites

  - id: s5cmd-local-source
    desc: s5cmd local source preceding an S3 destination
    crit: notable
    conf: 0.97
    if:
      type: text
      # `s5cmd cp` is bidirectional. Require the local filesystem operand to
      # precede the S3 URI so an S3-to-local download cannot satisfy the
      # upload composite below.
      regex: '(?i)\bs5cmd(\.exe)?\s+cp\b[^\r\n]{0,160}([A-Za-z]:[\\/]|/)[^\r\n]{1,180}\s+["'']?s3://'
    unless:
      - id: metadata/file/profile/metrics::powershell-no-parsed-call-sites

  # Akira/SonicWall affiliates recursively archive UNC file shares with a
  # distinctive WinRAR flag cluster before cloud upload (Huntress Safe Mode case).
  - id: winrar-unc-share-archive
    desc: WinRAR archives a UNC network share
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(rar|winrar)(\.exe)?\b[^\r\n]{0,220}\\\\[^\\\r\n]{1,80}\\[^"\r\n]{1,120}'
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module

  - id: winrar-ep1-r0-flag-cluster
    desc: WinRAR exclude-path recursive archive flags
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(rar|winrar)(\.exe)?\s+[^\r\n]{0,40}\ba\b[^\r\n]{0,100}-ep1\b[^\r\n]{0,100}-r0\b'

  - id: winrar-scul-flag
    desc: WinRAR -scul charset flag
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\s-scul\b'

  - id: winrar-iext-flag
    desc: WinRAR -iext extension flag
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\s-iext\b'

  - id: winrar-imon1-flag
    desc: WinRAR -imon1 monitor flag
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\s-imon1\b'

  - id: s5cmd-show-progress-flag
    desc: s5cmd copy with show-progress flag
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bs5cmd(\.exe)?\s+cp\s+--sp\b'
    unless:
      - id: metadata/file/profile/metrics::powershell-no-parsed-call-sites

composite_rules:
  - id: archive-transfer-command
    desc: Archive transfer command
    crit: notable
    conf: 0.95
    any:
      - id: well-known/dual-use/transfer/rclone::rclone-copy-cmd
      - id: azcopy-transfer-command
      - id: megacmd-transfer-command
      - id: s5cmd-s3-upload-command
      - id: micro-behaviors/communications/http/upload::curl-upload-file
      - id: micro-behaviors/communications/ftp/upload::ftp-script-upload-command
      - id: micro-behaviors/communications/ftp/upload::ftp-script-upload-command-reverse

  - id: s5cmd-s3-upload-command
    desc: s5cmd local-to-S3 upload command
    crit: notable
    conf: 0.96
    # s5cmd's `cp` is bidirectional. `s5cmd-local-source` encodes operand
    # ordering, while the other legs retain independently useful command and
    # destination findings.
    all:
      - id: s5cmd-copy-command
      - id: s5cmd-local-source
      - id: micro-behaviors/communications/http/url/cloud::s3-bucket-uri
    near_lines: 1

  - id: unc-share-winrar-staging
    desc: Stages UNC file shares into a WinRAR archive
    crit: suspicious
    conf: 0.97
    all:
      - id: rar-archive-command
      - id: winrar-unc-share-archive
      - id: winrar-ep1-r0-flag-cluster
    near_lines: 2

  - id: winrar-akira-flag-cluster
    desc: WinRAR Akira-style share-archive flag cluster
    crit: notable
    conf: 0.97
    all:
      - id: winrar-ep1-r0-flag-cluster
      - id: winrar-scul-flag
      - id: winrar-iext-flag
      - id: winrar-imon1-flag
    near_lines: 1

  - id: s5cmd-show-progress-s3-upload
    desc: s5cmd show-progress upload to S3
    crit: suspicious
    conf: 0.96
    all:
      - id: s5cmd-show-progress-flag
      - id: s5cmd-s3-upload-command
    near_lines: 1

  # UNC share staging followed immediately by s5cmd S3 upload is the
  # pre-encryption double-extortion collection chain (Akira affiliates).
  - id: unc-share-archive-s3-exfil
    desc: Archives UNC shares then uploads the stage to S3
    crit: hostile
    conf: 0.98
    attack: T1560.001,T1567.002
    all:
      - id: unc-share-winrar-staging
      - id: s5cmd-show-progress-s3-upload
    near_lines: 10

  - id: ad-recon-cloud-archive-exfil
    desc: ProgramData AD dumps paired with S3 archive upload
    crit: hostile
    conf: 0.97
    attack: T1087.002,T1567.002
    all:
      - id: objectives/discovery/account/ad::programdata-ad-recon-export
      - id: s5cmd-show-progress-s3-upload
    near_lines: 20

  - id: password-protected-archive-option
    desc: Password-protected archive option
    crit: notable
    conf: 0.96
    any:
      - id: passworded-sevenzip-command
      - id: passworded-rar-command

  - id: passworded-rar-archive-creation
    desc: Creates a password-protected RAR archive
    crit: suspicious
    conf: 0.96
    all:
      - id: rar-archive-command
      - id: passworded-rar-command
    near_lines: 2

  - id: archive-creation-for-collection
    desc: Targets high-value files for archive creation
    crit: suspicious
    conf: 0.92
    all:
      - id: objectives/collection/file-targeting/filter::targeted-high-value-file-discovery
    any:
      - id: micro-behaviors/data/archive/create/tar::tar-create
      - id: micro-behaviors/data/archive/create/tar::tar-from-file-list
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-writer
      - id: micro-behaviors/data/archive/create/utility::archive-utility-create
      - id: micro-behaviors/data/archive/create/utility::shell-7z-create
      - id: objectives/collection/archive/compress::tar-current-dir
    near_lines: 20

  - id: targeted-sensitive-archive-staging
    desc: Stages targeted files in an archive
    crit: hostile
    conf: 0.98
    attack: T1005,T1074.001,T1560.001
    all:
      - id: objectives/collection/file-targeting/filter::targeted-high-value-file-discovery
      - id: archive-creation-for-collection
      - id: micro-behaviors/fs/path/archive::archive-staging-location

  - id: targeted-sensitive-archive-transfer
    desc: Transfers a targeted-file archive
    crit: hostile
    conf: 0.99
    attack: T1005,T1041,T1560.001,T1567.002
    all:
      - id: targeted-sensitive-archive-staging
      - id: archive-transfer-command

  - id: passworded-sensitive-archive-transfer
    desc: Transfers a passworded targeted-file archive
    crit: hostile
    conf: 0.99
    attack: T1005,T1041,T1560.001,T1567.002
    all:
      - id: targeted-sensitive-archive-transfer
      - id: password-protected-archive-option
