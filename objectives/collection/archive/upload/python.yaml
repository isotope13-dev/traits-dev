# Python Archive Exfiltration
# Detects Python scripts that archive a sensitive tree and upload it
# ATT&CK: T1560.001 (Archive Collected Data: Archive via Utility)
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
composite_rules:
  # Walking a tree, zipping it and POSTing it is equally the shape of every
  # report/log/support-bundle uploader (CI artifact publishers, crash
  # reporters, a linter mailing its own report folder), so the tree being
  # archived has to be a sensitive one — a credential store, browser profile,
  # keychain, wallet, mail store, or SSH key directory — before the chain
  # reads as collection for exfiltration rather than shipping a work product.
  - id: sensitive-tree-zip-upload
    desc: Python zips a sensitive directory tree and uploads it
    crit: hostile
    conf: 0.9
    attack: "T1048.003"
    all:
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-writer
      - id: micro-behaviors/fs/directory/traverse::traverse-walk
      - id: micro-behaviors/fs/file/write/direct::py-write
      - id: micro-behaviors/fs/path/sensitive/
    any:
      - id: micro-behaviors/communications/http/request/client::py-post-generic
      - id: micro-behaviors/communications/http/lib/requests::requests-post
    unless:
      - id: metadata/build/archive::versioned-source-tree-archive-member
      - id: well-known/app/infrastructure/azure-cli::azure-cli-context
