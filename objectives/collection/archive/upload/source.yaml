# Source-level archive exfiltration
# ATT&CK: T1560.001 (Archive Collected Data), T1041 (Exfiltration Over C2 Channel)
defaults:
  platforms: [linux, macos, windows, unix]
  for: [c, cpp, csharp, rust, go]
composite_rules:
  - id: source-zip-upload
    desc: Source recursively archives files and uploads the resulting ZIP
    crit: hostile
    conf: 0.94
    attack: T1560.001,T1041
    all:
      - id: objectives/collection/archive/data::archive-writer
      - id: micro-behaviors/fs/directory/traverse::recursive-directory-traversal
      - id: micro-behaviors/communications/http/upload::zip-upload
