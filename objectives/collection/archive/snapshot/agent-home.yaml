# Archive-wide collection of an AI agent's credential and session state.
# A normal source package may contain agent tooling, but publishing an auth file
# together with live session databases is a collection/exfiltration signal.
defaults:
  platforms: [unix, windows]
  for: [archive, tar]
  attack: T1119

traits:
  - id: codex-auth-file-member
    desc: Archive contains Codex auth file
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)root/\.codex/auth\.json$|(^|/)\.codex/auth\.json$'

  - id: codex-logs-database-member
    desc: Archive contains Codex logs database
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)root/\.codex/logs_[^/]+\.sqlite(-wal|-shm)?$'

  - id: codex-state-database-member
    desc: Archive contains Codex state database
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)root/\.codex/state_[^/]+\.sqlite(-wal|-shm)?$'

  - id: codex-memory-database-member
    desc: Archive contains Codex memory database
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)root/\.codex/memories_[^/]+\.sqlite(-wal|-shm)?$'

  - id: codex-goals-database-member
    desc: Archive contains Codex goals database
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)root/\.codex/goals_[^/]+\.sqlite(-wal|-shm)?$'

  - id: codex-skills-or-plugins-member
    desc: Archive contains Codex skill or plugin tree
    crit: notable
    conf: 0.95
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)root/\.codex/(skills|plugins)/'

  - id: codex-skills-member
    desc: Archive contains Codex skill tree
    crit: notable
    conf: 0.95
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)root/\.codex/skills/'

  - id: codex-plugins-member
    desc: Archive contains Codex plugin tree
    crit: notable
    conf: 0.95
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)root/\.codex/plugins/'

composite_rules:
  - id: codex-credential-skills-snapshot
    desc: Archive bundles Codex credentials and skill source
    crit: hostile
    conf: 0.99
    attack: T1005,T1119
    scope: outer
    all:
      - id: codex-auth-file-member
      - id: codex-skills-member

  - id: codex-credential-plugins-snapshot
    desc: Archive bundles Codex credentials and plugin source
    crit: hostile
    conf: 0.99
    attack: T1005,T1119
    scope: outer
    all:
      - id: codex-auth-file-member
      - id: codex-plugins-member
