defaults:
  platforms: [windows, unix]
  for: [powershell]
traits:
  - id: powershell-compress-archive
    desc: PowerShell Compress-Archive
    crit: notable
    conf: 0.8
    for: [powershell, vbs]
    if:
      type: text
      word: Compress-Archive
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
