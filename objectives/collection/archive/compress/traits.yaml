defaults:
  for: [scripts, binaries]
  attack: T1560
  platforms:
    - linux
    - unix
    - windows
    - macos
    - ios
    - android
traits:
  - id: tar-append
    desc: Appends files to tar archive
    crit: notable
    conf: 0.7
    platforms:
      - unix
    for:
      - shell
      - python
      - javascript
      - elf
    if:
      type: text
      regex: '(^|[\n;&|({\[=:"''`])\s*tar\s+-[A-Za-z]*r'
