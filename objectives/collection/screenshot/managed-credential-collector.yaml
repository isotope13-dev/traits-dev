defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1113

composite_rules:
  - id: managed-credential-collector-png-screen-capture
    desc: Credential collector with PNG screen capture
    crit: hostile
    conf: 0.97
    # Acquisition only: these same-file observations do not bind a screenshot
    # to the sender, even though the reviewed collector archives and sends it.
    all:
      - id: objectives/exfiltration/stealer/credential/value/token::dotnet-discord-token-stealer
      - id: objectives/credential-access/wallet/crypto::managed-cold-wallet-file-stealer
      - id: micro-behaviors/hardware/display/screenshot::copyfromscreen-dotnet
      - id: micro-behaviors/data/encode/image/gdiplus::dotnet-imageformat-png
