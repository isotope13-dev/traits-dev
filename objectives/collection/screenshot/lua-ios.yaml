defaults:
  platforms: [ios]
  for: [lua]
  attack: T1113

composite_rules:
  - id: lua-ios-screenshot-capture
    desc: Lua iOS screenshot capture
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/ui/graphics/draw::lua-ios-image-context
      - id: micro-behaviors/data/encode/image/png::lua-ios-png-representation
      - id: micro-behaviors/hardware/display/screenshot::lua-ios-keywindow-render
