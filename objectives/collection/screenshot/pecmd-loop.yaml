defaults:
  platforms: [windows]
  for: [pe]
  attack: T1113

traits:
  - id: pecmd-looped-screen-capture
    desc: PECMD resource loops screenshot capture
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule pecmd_looped_screen_capture {
          strings:
            $loop = "LOOP #1=1," ascii nocase
            $capture = "SCRN -cap" ascii nocase
            $png = ".png" ascii nocase
          condition:
            all of them
        }
  - id: pecmd-screen-capture-cache-path
    desc: PECMD screenshot uses NativeImages path
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule pecmd_screen_capture_cache_path {
          strings:
            $path = "\\WINDOWS\\assembly\\NativeImages" ascii nocase
            $capture = "SCRN -cap" ascii nocase
            $png = ".png" ascii nocase
          condition:
            all of them
        }

composite_rules:
  - id: pecmd-repeated-screenshot-cache-spy
    desc: Repeated screenshot capture in hidden cache
    crit: hostile
    conf: 0.98
    all:
      - id: pecmd-looped-screen-capture
      - id: pecmd-screen-capture-cache-path
