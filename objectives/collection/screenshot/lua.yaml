# LuaJIT FFI screen capture followed by a multipart beacon.
defaults:
  platforms: [windows]
  for: [lua, text]
  attack: T1113,T1041
  mbc: C0014

composite_rules:

  - id: lua-gdi-screenshot-beacon
    for: [lua]
    desc: LuaJIT captures a screenshot and sends it in an XOR multipart beacon
    crit: hostile
    conf: 0.99
    attack: T1113,T1041,T1573.001
    all:
      - id: micro-behaviors/hardware/display/screenshot::lua-gdi-capture-api-set
      - id: micro-behaviors/communications/http/form::multipart-form
      - id: micro-behaviors/crypto/symmetric/xor/term::lua-xor-named-routine

  # Obfuscated variants rename every local, so an XOR-named routine cannot be
  # required. A GDI capture uploaded as multipart through WinInet to a raw-IP
  # endpoint is the same surveillance exfiltration without that name.
  - id: lua-gdi-screenshot-wininet-multipart
    for: [lua]
    desc: LuaJIT GDI screenshot uploaded via WinInet multipart
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/hardware/display/screenshot::lua-gdi-capture-api-set
      - id: micro-behaviors/communications/http/form::multipart-form
      - id: micro-behaviors/communications/http/client/wininet::lua-wininet-url-opener
    any:
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-script
      - id: micro-behaviors/communications/ip/literal::http-ip-url
