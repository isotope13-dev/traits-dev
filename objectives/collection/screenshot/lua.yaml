# LuaJIT FFI screen capture followed by a multipart beacon.
defaults:
  platforms: [windows]
  for: [lua, text]
  attack: T1113,T1041
  mbc: C0014

composite_rules:
  - id: lua-gdi-dib-screen-capture
    desc: LuaJIT FFI captures a desktop image through the GDI DIB pipeline
    crit: suspicious
    conf: 0.98
    attack: T1113
    all:
      - id: micro-behaviors/hardware/display/state::gdi-screen-dimensions-source
      - id: micro-behaviors/ui/graphics/image::gdi-dib-section-source
      - id: micro-behaviors/ui/graphics/draw::gdi-bitblt-source

  - id: lua-gdi-screenshot-beacon
    for: [lua]
    desc: LuaJIT captures a screenshot and sends it in an XOR multipart beacon
    crit: hostile
    conf: 0.99
    attack: T1113,T1041,T1573.001
    all:
      - id: lua-gdi-dib-screen-capture
      - id: micro-behaviors/communications/http/form::multipart-form
      - id: micro-behaviors/crypto/symmetric/xor/term::lua-xor-named-routine
