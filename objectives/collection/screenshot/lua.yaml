# LuaJIT FFI screen capture and multipart markers in obfuscated source.
defaults:
  platforms: [windows]
  for: [lua, text]
  attack: T1113,T1041
  mbc: C0014

composite_rules:

  - id: lua-gdi-screenshot-beacon
    for: [lua]
    desc: Obfuscated Lua references screen capture and multipart form data
    crit: suspicious
    conf: 0.99
    attack: T1113
    all:
      - id: micro-behaviors/hardware/display/screenshot/display::lua-gdi-capture-api-set
      - id: micro-behaviors/communications/http/form::multipart-form
    any:
      # Obfuscators rename the decoder, so an XOR-named routine is one
      # sufficient witness; a decimal-escape string table is the other.
      - id: metadata/lang/source/naming/function/cryptography::lua-xor-named-routine
      - id: metadata/lang/encoding/shape/escape::lua-decimal-escape-count

  # GDI, multipart, and an IP URL alone do not bind captured pixels to a send.
  # The neutral API observations remain independently visible; do not infer
  # surveillance exfiltration from their file-wide co-occurrence.
