defaults:
  platforms: [unix]
  for: [rust, macho, elf]
  attack: T1113

# The `screencapture` CLI invocation itself is a neutral capability and is
# defined once, in micro-behaviors/hardware/display/screenshot. Only the
# staging path below is specific enough to imply covert capture.
composite_rules:
  - id: macos-tmp-snap-screenshot-capture
    for: [macho]
    desc: macOS screencapture staged under /tmp/snap_
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/display/screenshot::macos-screencapture-command
      - id: micro-behaviors/fs/temp/reference::tmp-snap-path-prefix
    unless:
      - id: objectives/supply-chain/trojanized/app/debug-probe/
