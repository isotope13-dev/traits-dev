# The recording matcher follows raw input through translation, scrambling and
# WriteFile. This adds the distinct GDI acquisition profile; it claims no send.
defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: native-raw-input-keylogger-gdi-capture
    desc: Raw-input keylogger with GDI capture APIs
    crit: hostile
    conf: 0.98
    attack: T1113
    all:
      - id: objectives/collection/keylog/device::native-translated-scrambled-key-write-code
      - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
      - id: micro-behaviors/ui/window/probe::get-desktop-window
