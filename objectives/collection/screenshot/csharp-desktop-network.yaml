# Co-occurring APIs do not prove alternate-desktop capture or frame delivery.
defaults:
  for: [csharp]
  platforms: [windows]
  attack: T1113

composite_rules:
  - id: csharp-desktop-capture-with-network-apis
    desc: Screen capture with alternate desktop and network APIs
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/ui/window/station::create-desktop-source-call
      - id: micro-behaviors/hardware/display/screenshot/display::csharp-copy-from-screen-capture
    any:
      - id: micro-behaviors/communications/websocket/client::dotnet-client-websocket
      - id: micro-behaviors/communications/socket/create::tcpclient-create
      - id: micro-behaviors/communications/http/post::postasync
