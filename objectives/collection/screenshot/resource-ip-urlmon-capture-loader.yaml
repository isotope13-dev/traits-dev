# Screen-capture primitives (a compatible bitmap and DIB transfer) inside a
# program that also hides a megabyte of cipher-entropy data in a resource,
# keeps an external IPv4 literal in a resource string, names the URL moniker
# library and deletes files is a stealer or spyware loader: it captures the
# desktop, fetches or reports to a fixed address and cleans up after itself.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1113,T1105,T1070.004
composite_rules:
  - id: capture-primitives-with-resource-ip-and-urlmon
    desc: Screen capture with resource IP, urlmon and cleanup
    crit: hostile
    conf: 0.78
    all:
      - id: micro-behaviors/hardware/display/screen::gdi-create-compatible-bitmap
      - id: micro-behaviors/hardware/display/screen::gdi-dib-bitmap-transfer-primitives
      - id: micro-behaviors/communications/ip/literal::external-ipv4-pe-resource-string
      - id: micro-behaviors/communications/http/client/urlmon::urlmon-dll-reference
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
    unless:
      - id: metadata/signed/platform/
