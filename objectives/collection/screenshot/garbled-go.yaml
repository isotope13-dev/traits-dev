# An obfuscated Go agent that carries remote screenshot-tasking messages.
# Garble-style identifier obfuscation plus a display-capture tasking interface
# is the collection side of a remote-access agent; the message names describe
# the tasking interface, not a completed capture.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
composite_rules:
  - id: garbled-go-screenshot-tasking
    desc: Obfuscated agent with screenshot tasking
    crit: hostile
    conf: 0.9
    attack: T1113
    mbc: B0034
    all:
      - id: metadata/lang/compiler/systems::go-binary
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garble-indicators
      - id: micro-behaviors/hardware/display/screenshot/reference::remote-capture-tasking-message
