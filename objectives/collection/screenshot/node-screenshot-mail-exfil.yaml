# Node spyware loop: grabs the whole desktop, names the image after the host
# and mails it out as an attachment. Desktop capture tools save or upload on
# request; they do not silently mail host-tagged screenshots from a script.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1113,T1048.003

composite_rules:
  - id: node-desktop-screenshot-mailed-out
    desc: Mails host-tagged desktop screenshots
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/hardware/display/screenshot/unspecified::node-desktop-screenshot-capture
      - id: metadata/import/npm/nodemailer
      - id: micro-behaviors/communications/email/send/smtp::node-mail-attachment-file-path
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
