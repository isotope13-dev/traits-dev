defaults:
  for:
  - pe
  platforms:
  - windows
  mbc: C0014,B0032
composite_rules:
- id: encrypted-pe-desktop-duplication
  desc: Encrypted PE embeds DXGI desktop duplication
  crit: hostile
  conf: 0.96
  attack: T1113,T1027
  all:
  - id: micro-behaviors/communications/socket/lib::unsigned-pe-high-entropy-winsock-clues
  - id: micro-behaviors/hardware/display/directx/calls::dxgi-output1-iid

# DXGI Desktop Duplication needs only the IIDs, so an obfuscated PE can hide
# every API name: it walks the PEB and matches export-name hashes instead of
# importing. Signed screen recorders import normally and carry a signature.
- id: hashed-api-pe-desktop-duplication
  desc: Unsigned PE hashes API names and embeds DXGI duplication
  crit: hostile
  conf: 0.93
  attack: T1113,T1027.007
  all:
  - id: micro-behaviors/hardware/display/directx/calls::dxgi-output1-iid
  - id: micro-behaviors/os/api-resolution/manual::gs-peb-ldr-access-x64
  - id: micro-behaviors/os/api-resolution/digest-export/targets
  - id: metadata/signature/absent::unsigned-missing-signature-record
