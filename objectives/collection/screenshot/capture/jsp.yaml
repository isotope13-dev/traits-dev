# A JSP page that grabs the desktop with AWT Robot and writes the image
# back down the HTTP response is a screen-spy webshell, not a chart renderer.
defaults:
  platforms: [unix, windows]
  for: [jsp, java, html, javascript, python]
  attack: T1113
  mbc: C0014
traits:
  - id: java-robot-screen-capture-call
    desc: Java Robot captures the screen
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'new\s+Robot\s*\(\s*\)\s*\.\s*createScreenCapture\s*\('
  - id: java-imageio-write-call
    desc: Java ImageIO writes an image
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: ImageIO.write
composite_rules:
  - id: jsp-desktop-image-response
    desc: JSP returns a captured desktop
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: java-robot-screen-capture-call
      - id: java-imageio-write-call
