# A host script (batch, VBS, Python, ...) that carries a complete embedded
# PowerShell screen-capture command AND an HTTP upload primitive in the same
# file is not a benign automation helper describing a screenshot feature --
# it is staging desktop surveillance for exfiltration. The embedded-capture
# atom alone (micro-behaviors/hardware/display/screenshot) only says the text
# is present; pairing it with an upload primitive is what turns "can capture
# the screen" into "captures and sends the screen".
defaults:
  platforms: [windows]
  for: [batch, vbs]
  attack: T1113,T1041
  mbc: C0014

composite_rules:
  - id: embedded-powershell-screenshot-exfil
    desc: Embedded PowerShell screen capture with HTTP exfiltration
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/hardware/display/screenshot::embedded-powershell-screen-capture
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-upload
