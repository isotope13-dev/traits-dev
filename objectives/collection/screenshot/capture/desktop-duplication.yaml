# DXGI Desktop Duplication capture (T1113).
#
# Previously this rule inferred "desktop duplication" from a D3D/DXGI device
# plus any GDI blit, which matched every GUI toolkit that renders through
# Direct2D and also happens to call BitBlt. It now keys on the Desktop
# Duplication interfaces themselves, so it means what its name says.
defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
- id: directx-desktop-duplication-capture
  desc: Captures the desktop framebuffer via the DXGI Desktop Duplication API
  crit: notable
  conf: 0.9
  attack: T1113
  mbc: C0014
  any:
  - id: micro-behaviors/hardware/display/directx/calls::dxgi-output-duplication-iid
  - id: micro-behaviors/hardware/display/directx/calls::dxgi-output1-iid
  - id: micro-behaviors/hardware/display/directx/calls::dxgi-duplication-interface-name
