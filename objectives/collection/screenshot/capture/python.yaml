defaults:
  platforms: [windows, unix]
  for:
    - python
  attack: T1113
  mbc: B0002
traits:
  - id: screenshot-name-artifact
    desc: Screenshot filename artifact
    crit: notable
    conf: 0.7
    if:
      type: string_literal
      exact: scrn.jpg
  - id: screenshot-image-extension
    desc: Screenshot filename artifact
    crit: notable
    conf: 0.65
    if:
      type: text
      regex: screenshot.{0,30}\.(jpg|jpeg|png)
  - id: python-framebuffer-capture
    desc: Python framebuffer capture
    crit: suspicious
    conf: 0.94
    for: [python, pyc]
    # `/dev/fb0` is just the Linux framebuffer node — guests and display
    # tests write images to it. Capture intent is the capture_framebuffer API.
    if:
      type: text
      substr: capture_framebuffer
  - id: python-collect-screenshots-name
    desc: Python collect_screenshots name
    crit: notable
    conf: 0.9
    for: [python, pyc]
    if:
      type: text
      substr: collect_screenshots
  - id: python-exfiltrate-raw-name
    desc: Python exfiltrate_raw name
    crit: notable
    conf: 0.9
    for: [python, pyc]
    if:
      type: text
      substr: exfiltrate_raw
composite_rules:
  - id: python-temp-screen-staging
    desc: Python temp screenshot staging
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/display/screen::python-grab-save-image
      - id: micro-behaviors/fs/temp/directory::temp-directory
      - id: screenshot-name-artifact
      - id: screenshot-image-extension
  - id: python-screenshot-exfil
    desc: Python screenshot capture with network exfiltration
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/display/screen::python-grab-save-image
    any:
      - id: micro-behaviors/communications/http/post::session-post
      - id: micro-behaviors/communications/http/upload/
  - id: python-overlay-screenshot-vercel-exfil
    desc: Borderless overlay uploads screenshots to Vercel
    # Screen-to-service upload is privacy-sensitive, but can be an explicit
    # user action in support and AI-assistant overlays. It is not hostile until
    # automatic or deceptive capture is independently established.
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/display/screenshot::screen-capture
      - id: micro-behaviors/communications/http/post::session-post
      - id: micro-behaviors/communications/http/services/cloud::vercel-app
      - id: micro-behaviors/ui/window/visibility::tkinter-topmost
      - id: micro-behaviors/ui/window/visibility::tkinter-overrideredirect
    any:
      - id: micro-behaviors/os/clipboard/read::pyperclip-paste
      - id: micro-behaviors/hardware/display/screen::pil-imagegrab
  - id: python-device-screenshot-exfil
    desc: Python device screenshot exfil
    crit: hostile
    conf: 0.98
    for: [python, pyc]
    all:
      - id: python-framebuffer-capture
      - id: python-collect-screenshots-name
      - id: python-exfiltrate-raw-name

  - id: python-remote-surveillance-collection-agent
    desc: Python remote command agent with screen and clipboard collection
    crit: hostile
    conf: 0.995
    for: [whl, python-sdist, python]
    scope: package
    attack: T1113,T1115,T1071.001
    mbc: B0022
    all:
      - id: objectives/command-and-control/backdoor/rat/multi::python-command-dispatch-handler-cluster
      - id: objectives/command-and-control/infrastructure/paste::npoint
      - id: micro-behaviors/hardware/display/screenshot::screen-capture
      - id: micro-behaviors/os/clipboard/read::python-get-clipboard-data-call

  - id: python-xor-endpoint-posts-screenshot
    desc: Posts a screenshot to a decoded URL
    crit: hostile
    conf: 0.96
    attack: T1113,T1041
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/crypto/symmetric/xor/loop::python-xor-bytes-comprehension
      - id: micro-behaviors/communications/http/upload::requests-post-files-parameter
      - id: micro-behaviors/ui/graphics/image::python-screenshot-image-method

  - id: python-xor-endpoint-posts-shell-output
    desc: Posts shell output to a decoded URL
    crit: hostile
    conf: 0.95
    attack: T1041,T1059.003
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/crypto/symmetric/xor/loop::python-xor-bytes-comprehension
      - id: micro-behaviors/communications/http/upload::requests-post-files-parameter
      - id: micro-behaviors/process/create/exec::cmd-exe-reference
