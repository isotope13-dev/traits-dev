# Whole-desktop capture written straight to a file, the shape a PowerShell
# collection stage has when the exfiltration lives in a different component.
#
# The composites in windows.yaml describe capture that keeps the image in
# memory (`ToBase64String`, a MemoryStream) or that targets one window. A
# capture that saves a PNG and exits leaves no network or encoding evidence in
# the file at all, so nothing there fires -- and this is the smaller and more
# common half of a screenshot stealer, since the uploader is usually the
# implant that dropped the script.
#
# `VirtualScreen` rather than a window rectangle is the discriminating leg: an
# application screenshotting itself asks for its own bounds, while a collector
# wants every monitor.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1113
  mbc: C0014

composite_rules:
  - id: powershell-full-desktop-capture-to-file
    desc: Captures every monitor and saves a PNG
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/display/state::powershell-virtual-screen-bounds
      - id: objectives/collection/screenshot/capture::powershell-copyfromscreen
      - id: objectives/collection/screenshot/capture::powershell-png-image
    unless:
      - id: well-known/tool/
      - id: well-known/app/

  # Where the image lands decides whether this reads as a utility or as
  # staging. %ProgramData% is machine-wide, writable by any user, and not a
  # place a person looks for their own screenshots -- which is exactly why
  # collectors stage there and why no screenshot tool offers it as a default.
  - id: powershell-desktop-capture-staged-machine-wide
    desc: Desktop capture staged under ProgramData
    crit: suspicious
    conf: 0.96
    attack: T1113,T1074.001
    all:
      - id: powershell-full-desktop-capture-to-file
    any:
      - id: micro-behaviors/fs/path/system::programdata-env-lookup
      - id: micro-behaviors/fs/path/system::programdata-directory-path
    needs: 1
