defaults:
  for:
    - macho
    - shell
  platforms:
    - macos
  attack: T1113
  mbc: C0014
traits:
  - id: ffmpeg-avfoundation-frame-capture
    desc: ffmpeg captures macOS AVFoundation frame
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'ffmpeg\s+-f\s+avfoundation\b.{0,180}-frames:v\s+1'
  - id: private-etc-screen-staging
    desc: Screen capture staged under private etc
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: '/private/etc/[^ \t\r\n]{1,80}\.(jpg|jpeg|png)'
composite_rules:
  # Screen capture installed as a launchd service is also what every
  # legitimate screen-recording, remote-support, kiosk and employee-monitoring
  # installer does, and those disclose themselves: vendor-labelled service,
  # payload under /Applications. The surveillance inference needs the install
  # to be covert as well, so this defers to the covert-launchd composite for
  # the hiding/masquerade evidence.
  - id: macos-screenshot-launchd-surveillance
    desc: macOS screenshot capture installed as covert launchd persistence
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/hardware/display/screenshot::macos-screencapture-command
      - id: objectives/persistence/system/launchd/interpreter::shell-macos-covert-launchd-persistence
  - id: macos-ffmpeg-stealth-screenshot
    desc: Silent ffmpeg macOS screenshot capture
    crit: hostile
    conf: 0.97
    all:
      - id: ffmpeg-avfoundation-frame-capture
      - id: private-etc-screen-staging
      - id: micro-behaviors/os/console/io::null-redirect-stdout-stderr
