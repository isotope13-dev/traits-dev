# Windows Screenshot Capture via GDI + GDI+ Encoding
# Full screenshot pipeline: GDI capture -> GDI+ PNG encode -> exfil
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1113
  mbc: "C0014"
traits:
- id: screenshot-jpg-artifact
  desc: Screenshot JPEG artifact name
  crit: notable
  conf: 0.86
  if:
    type: text
    exact: screenshot.jpg
- id: powershell-window-bounds
  desc: PowerShell queries window bounds
  crit: notable
  conf: 0.92
  for: [powershell]
  if:
    type: text
    word: GetWindowRect
  unless:
  # The symbol records the API being used; this also sees the name sitting in
  # data. Standing down there keeps one use from counting twice.
  - id: micro-behaviors/ui/window/control::get-window-rect
- id: powershell-copyfromscreen
  desc: PowerShell uses GDI+ CopyFromScreen
  crit: notable
  conf: 0.96
  for: [powershell]
  if:
    type: text
    word: CopyFromScreen
- id: powershell-png-image
  desc: PowerShell encodes an image as PNG
  crit: notable
  conf: 0.94
  for: [powershell]
  if:
    type: text
    regex: 'ImageFormat\]\s*::\s*Png'
- id: powershell-base64-image
  desc: PowerShell base64-encodes image data
  crit: notable
  conf: 0.94
  for: [powershell]
  if:
    type: text
    regex: '(?i)(ImageFormat|CopyFromScreen)[\s\S]{0,300}ToBase64String'
- id: powershell-enum-child-windows
  desc: PowerShell enumerates child windows
  crit: notable
  conf: 0.95
  for: [powershell]
  if:
    type: text
    word: EnumChildWindows
- id: powershell-find-webview-child
  desc: PowerShell finds WebView child
  crit: notable
  conf: 0.95
  for: [powershell]
  if:
    type: text
    word: FindWebViewChild
- id: powershell-chrome-widget-class
  desc: PowerShell identifies Chrome widget
  crit: suspicious
  conf: 0.97
  for: [powershell]
  if:
    type: text
    word: Chrome_WidgetWin_1
- id: powershell-chrome-render-class
  desc: PowerShell identifies Chrome render child
  crit: suspicious
  conf: 0.97
  for: [powershell]
  if:
    type: text
    word: Chrome_RenderWidgetHostHWND
# Retired: `powershell-webview-class` matched the bare word `WebView`, which is
# the product name, not a window class. Every installer, updater and
# cache-clearing script for a WebView2-hosted desktop app says it, and it
# carried `crit: suspicious` on its own. `Chrome_WidgetWin_1` and
# `Chrome_RenderWidgetHostHWND` below are the actual class names a capture tool
# looks up, so the marker composite keeps its meaning without it.
- id: powershell-printwindow-call
  desc: PowerShell invokes PrintWindow
  crit: notable
  conf: 0.95
  for: [powershell]
  if:
    type: text
    word: PrintWindow
composite_rules:
- id: gdi-screen-network-file-cleanup
  desc: GDI screen capture with network activity and file cleanup
  crit: suspicious
  conf: 0.94
  attack: T1113,T1071
  all:
  - id: micro-behaviors/hardware/display/screen::gdi-create-compatible-dc
  - id: micro-behaviors/ui/window/probe::get-desktop-window
  - id: micro-behaviors/communications/socket/init::wsa-startup
  - id: micro-behaviors/fs/delete/file/library::deletefile-w
  any:
  - id: micro-behaviors/fs/file/timestamp::set-file-time
  - id: micro-behaviors/process/create/exec::shell-execute
  - id: micro-behaviors/communications/ipc/named-pipe::pipe-path-prefix
  unless:
  - id: well-known/lib/
  - id: well-known/app/
  - id: well-known/tool/
  - id: metadata/lang/compiler/native::mingw-pseudo-reloc-runtime
  downgrade:
    any:
    # Every leg here is a plain PE import, so there is no location to bound
    # with proximity: an 86 MB desktop application creates a DC, asks for
    # the desktop window, opens a socket to check for updates, deletes a
    # temp file and calls ShellExecute -- all of it somewhere, none of it
    # together. A verified vendor signature is the evidence that separates
    # that from a screen-stealer; AMS Software's InteriorDesign 3D matched
    # all five. Downgraded, not suppressed -- certificates get stolen.
    - id: metadata/signed/certificate/identity::pe-signature-verified
    # ...and the signer-cryptography reading. They are separate observations:
    # `pe-signature-verified` is image-digest integrity, `-kv` is the PKCS#7
    # signed attributes. A DLL carved out of an installer (AOMEI's Inno bundle
    # ships botva2.dll, the splash-screen plugin) verifies on the latter.
    - id: metadata/signed/certificate/identity::pe-signature-verified-kv
- id: dotnet-active-and-multiscreen-capture
  desc: .NET active-window screenshot with display enumeration
  crit: notable
  conf: 0.94
  all:
  - id: dotnet-gdi-active-window-png-capture
  - id: micro-behaviors/hardware/display/screen::dotnet-dpi-aware-display-enumeration
  unless:
  - id: well-known/app/
  - id: well-known/lib/
- id: powershell-foreground-window-screenshot
  desc: PowerShell captures a window as base64 PNG
  crit: suspicious
  conf: 0.98
  for: [powershell]
  all:
  - id: micro-behaviors/ui/window/enumerate::get-foreground-window-source
  - id: powershell-window-bounds
  - id: powershell-copyfromscreen
  - id: micro-behaviors/data/buffer/alloc::powershell-memory-stream-constructor
  - id: powershell-png-image
  - id: powershell-base64-image
- id: powershell-protected-webview-capture
  desc: PowerShell bypasses protected WebView rendering to capture its contents
  crit: hostile
  conf: 0.99
  attack: T1113,T1027.003
  mbc: B0015
  for: [powershell]
  all:
  - id: powershell-child-window-enumeration
  - id: powershell-webview-class-marker
  - id: powershell-printwindow-call
  - id: micro-behaviors/hardware/display/screen::print-window-full-content
  - id: powershell-window-bounds
  near_lines: 100
- id: powershell-child-window-enumeration
  desc: PowerShell enumerates window children
  crit: notable
  conf: 0.97
  for: [powershell]
  any:
  - id: powershell-enum-child-windows
  - id: powershell-find-webview-child
- id: powershell-webview-class-marker
  desc: PowerShell identifies embedded WebView
  crit: suspicious
  conf: 0.98
  for: [powershell]
  any:
  - id: powershell-chrome-widget-class
  - id: powershell-chrome-render-class
- id: gdi-input-hook-surveillance
  desc: GDI desktop capture combined with input-hook capability
  crit: suspicious
  conf: 0.92
  attack: T1113,T1056.001
  mbc: B0015
  all:
  - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
  - id: micro-behaviors/ui/window/probe::get-desktop-window
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-hook-lifecycle
  any:
  - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
  - id: micro-behaviors/hardware/input/keyboard/poll::foreground-window-input-state
  - id: micro-behaviors/hardware/input/keyboard/hook::map-virtual-key
  needs: 1
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/lang/compiler/managed::delphi
  # Catalogued applications, tools, and runtimes are allowed to expose GUI
  # painting and hook lifecycle APIs as framework surface.
  - id: well-known/app/
  - id: well-known/tool/
  - id: well-known/lib/
  - id: objectives/collection/keylog/capture::known-gui-runtime-input-exception
- id: gdi-window-capture
  desc: GDI window capture with screen context
  crit: suspicious
  conf: 0.92
  all:
  - id: micro-behaviors/hardware/display/screen::gdi-bitmap-transfer-primitives
  any:
  - id: micro-behaviors/ui/window/enumerate::get-foreground-window
  - id: micro-behaviors/ui/window/enumerate::get-window-text
  - id: micro-behaviors/ui/window/enumerate::get-window-text-length
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: metadata/binary/installer/family::inno-uninstaller-runtime
  - id: metadata/binary/symbols/count::many-exports
  - id: well-known/app/utility/siw::siw-family-identity
  downgrade:
    any:
    - id: metadata/binary/symbols/count::many-imports
    - id: metadata/package/versioning/scheme::pe-version-resource
- id: dotnet-gdi-active-window-png-capture
  desc: .NET active window screenshot saved as PNG
  crit: notable
  conf: 0.95
  ref: sha256:102dd32a30d7a0cf86955e6045e0426a26dfef393ce946d49c006d19c4c036e9
  all:
  - id: micro-behaviors/hardware/display/screenshot::dotnet-pinvoke-gdi-capture-primitives
  - id: micro-behaviors/ui/window/enumerate::get-foreground-window-pinvoke
  - id: micro-behaviors/ui/window/control::get-window-rect-pinvoke
  - id: micro-behaviors/data/encode/image/gdiplus::dotnet-hbitmap-png-save
  unless:
  - id: well-known/app/
  - id: well-known/lib/
- id: gdi-gdiplus-capture
  desc: GDI screen capture with GDI+ image encoding
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/hardware/display/screen::gdi-bitblt
  any:
  - id: micro-behaviors/data/encode/image/gdiplus::save-image-to-stream
  - id: micro-behaviors/data/encode/image/gdiplus::save-image-to-file
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: metadata/binary/symbols/count::many-exports
  downgrade:
    any:
    - id: well-known/lib/platform/browser-automation/
- id: printwindow-jpeg-capture
  desc: PrintWindow capture encoded as JPEG for storage or streaming
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/hardware/display/screenshot::printwindow-capture-primitives
  any:
  - id: micro-behaviors/hardware/display/screen::imageformat-jpeg-str
  - id: micro-behaviors/communications/http/server/managed::mjpeg-stream-content-type
  downgrade:
