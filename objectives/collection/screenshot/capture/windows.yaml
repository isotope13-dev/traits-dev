    - id: metadata/binary/vendor/
    - id: well-known/app/browser/internet-explorer/
- id: screenshot-exfil
  desc: Screenshot capture with network exfiltration
  crit: hostile
  conf: 0.95
  all:
  - id: gdi-gdiplus-capture
  any:
  - id: micro-behaviors/communications/http/post/
  - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
  - id: micro-behaviors/communications/http/upload/
  unless:
  - id: well-known/lib/platform/browser-automation/
  - id: well-known/app/productivity/winmerge/
  - id: well-known/app/productivity/sumatrapdf/
- id: raw-gdi-screenshot-exfil
  desc: Embedded GDI screenshot source paired with outbound HTTP and TLS bypass
  crit: hostile
  conf: 0.98
  attack: T1113,T1041,T1573
  all:
  - id: micro-behaviors/hardware/display/screenshot::raw-gdi-screen-capture-primitives
  - id: objectives/evasion/security-bypass/tls::reject-unauthorized-false-native
  - id: micro-behaviors/communications/http/content-length::raw-content-length-header
  unless:
  - id: well-known/lib/platform/browser-automation/
  # Official Bun runtime bundles Chromium/HTTP stacks that trip this triad.
  - id: well-known/lib/runtime/scripted/bun-runtime::runtime-context
- id: screenshot-dib-exfil
  desc: BMP screenshot capture with network exfiltration
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/hardware/display/screen::gdi-dib-bitmap-transfer-primitives
  any:
  - id: micro-behaviors/communications/http/post/
  - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
  - id: micro-behaviors/communications/http/upload/
  unless:
  - id: well-known/tool/
  - id: well-known/app/
  - id: metadata/binary/installer/family/
  - id: well-known/lib/
  # DesktopMania renders and transfers wallpaper images; its GDI and HTTP
  # stacks coexist without establishing screenshot exfiltration.
  - id: well-known/unwanted/desktopmania/
  downgrade:
    any:
    - id: metadata/signed/platform/
    # A verified Authenticode signature from an identifiable vendor, not
    # only a platform one. Screen capture plus an upload path is the shape
    # of many legitimate signed Windows applications -- AMS Software's
    # InteriorDesign 3D renders to a DIB and has a share feature, and scored
    # hostile here. Downgraded rather than suppressed: a certificate can be
    # stolen or revoked, so the finding should get quieter, not vanish.
    - id: metadata/signed/certificate/identity::pe-signature-verified
    # ...and the signer-cryptography reading. They are separate observations:
    # `pe-signature-verified` is image-digest integrity, `-kv` is the PKCS#7
    # signed attributes. A DLL carved out of an installer (AOMEI's Inno bundle
    # ships botva2.dll, the splash-screen plugin) verifies on the latter.
    - id: metadata/signed/certificate/identity::pe-signature-verified-kv
