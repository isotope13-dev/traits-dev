defaults:
  platforms: [windows, unix, android]
  for:
    - java
    - class
    - jar
    - zip
traits:
  - id: java-screenshot-capture
    desc: Java screen capture methods
    crit: notable
    conf: 0.8
    mbc: C0014
    attack: T1113
    if:
      type: symbol
      kind: call
      exact: createScreenCapture
  - id: jvm-screenshot-capture-method
    desc: JVM captures desktop with AWT Robot
    crit: notable
    conf: 0.97
    mbc: C0014
    attack: T1113
    for: [class, java_class, jar, zip]
    if:
      type: symbol
      kind: import
      exact: createScreenCapture
  - id: jvm-multipart-form-disposition
    desc: JVM multipart form disposition
    crit: component
    for: [class, java_class, jar, zip]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)Content-Disposition: form-data;'
  - id: jvm-multipart-image-filename
    desc: JVM multipart image filename
    crit: component
    for: [class, java_class, jar, zip]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)filename="[^"]{1,120}\.(jpe?g|png|bmp)"'
composite_rules:
  - id: jvm-multipart-image-form-field
    desc: JVM multipart image file field
    crit: notable
    conf: 0.94
    scope: file
    all:
      - id: jvm-multipart-form-disposition
      - id: jvm-multipart-image-filename

  - id: java-awt-robot-ref
    desc: Java AWT Robot reference
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/hardware/input/robot::java-awt-robot-import
      - id: micro-behaviors/hardware/input/robot::java-awt-robot

  - id: java-screenshot-png-output
    desc: Java screen capture with PNG output
    crit: notable
    conf: 0.9
    mbc: C0014
    attack: T1113
    all:
      - id: java-awt-robot-ref
    any:
      - id: micro-behaviors/ui/graphics/image::java-png-write
      - id: micro-behaviors/fs/path/temp::java-temp-png-output-path

  - id: java-screenshot-http-exfil
    desc: Java captures and uploads desktop images over HTTP
    crit: hostile
    conf: 0.995
    attack: T1041,T1113
    mbc: C0014
    for: [class, java_class, jar]
    scope: archive
    all:
      - id: jvm-screenshot-capture-method
      - id: jvm-multipart-image-form-field
      - id: micro-behaviors/communications/http/lib/httpclient::java-http-request-post-bytecode
      - id: micro-behaviors/communications/http/lib/httpclient::java-httpclient-send
