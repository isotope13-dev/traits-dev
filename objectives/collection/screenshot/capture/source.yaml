# Screenshot capture in source code
# ATT&CK: T1113 (Screen Capture)
defaults:
  attack: T1113
  mbc: C0014

traits:
  # C# / Windows GDI screenshot traits
- id: bitblt-dllimport
  desc: BitBlt GDI screen capture via DllImport
  crit: notable
  conf: 0.9
  for: [csharp]
  platforms: [windows]
  if:
    type: text
    substr: BitBlt(IntPtr

- id: screen-primaryscreen
  desc: Screen.PrimaryScreen bounds access
  crit: notable
  conf: 0.8
  for: [csharp]
  platforms: [windows]
  if:
    type: text
    substr: Screen.PrimaryScreen

- id: cursor-position-draw
  desc: Mouse cursor capture on screenshot
  crit: notable
  conf: 0.7
  for: [csharp]
  platforms: [windows]
  if:
    type: text
    substr: Cursor.Position

- id: ps-save-screenshot-function
  desc: PowerShell Save-Screenshot function
  crit: notable
  conf: 0.92
  for: [powershell]
  platforms: [windows]
  if:
    type: text
    regex: '(?i)\bfunction\s+Save-Screenshot\b'

- id: ps-addtype-drawing-screenshot--rx-1
  desc: "Matches 'System.Drawing'"
  crit: notable
  conf: 0.9
  for: [powershell]
  platforms: [windows]
  if:
    type: text
    regex: '(?is)\bAdd-Type\b.{0,400}(System\.Drawing|Graphics)'

- id: ps-addtype-drawing-screenshot--rx-2
  desc: "Matches 'CopyFromScreen'"
  crit: notable
  conf: 0.9
  for: [powershell]
  platforms: [windows]
  if:
    type: text
    regex: '(?is)\bAdd-Type\b.{0,400}(Bitmap|CopyFromScreen)'

- id: ps-addtype-drawing-screenshot--rx-3
  desc: "Matches 'bAdd-Typeb.'"
  crit: notable
  conf: 0.9
  for: [powershell]
  platforms: [windows]
  if:
    type: text
    regex: '(?is)\bAdd-Type\b.{0,400}(BitBlt)'

- id: ps-virtual-screen-capture--rx-4
  desc: "Matches 'SystemInformation.Virtual...'"
  crit: notable
  conf: 0.9
  for: [powershell]
  platforms: [windows]
  if:
    type: text
    regex: '(?is)(SystemInformation\.VirtualScreen|Screen\.AllScreens).{0,400}(CopyFromScreen|BitBlt)'

- id: ps-virtual-screen-capture--rx-5
  desc: "Matches 'SystemInformation.Virtual...'"
  crit: notable
  conf: 0.9
  for: [powershell]
  platforms: [windows]
  if:
    type: text
    regex: '(?is)(SystemInformation\.VirtualScreen|Screen\.AllScreens).{0,400}(Graphics)'

- id: ps-virtual-screen-capture--rx-6
  desc: "Matches 'Screen.PrimaryScreen'"
  crit: notable
  conf: 0.9
  for: [powershell]
  platforms: [windows]
  if:
    type: text
    regex: '(?is)(Screen\.PrimaryScreen).{0,400}(CopyFromScreen|BitBlt|Graphics)'

- id: ps-screenshot-loop--rx-7
  desc: "Matches 'Save-Screenshot'"
  crit: notable
  conf: 0.86
  for: [powershell]
  platforms: [windows]
  if:
    type: text
    regex: '(?is)while\s*\(\s*\$true\s*\).{0,800}(Save-Screenshot|CopyFromScreen).{0,800}Start-Sleep'

  # Go: server-side code that retrieves screenshots from a remote client via RPC
  # and saves them as PNG files under a screenshots/ directory (RAT pattern).
- id: ps-screenshot-loop--rx-8
  desc: "Matches 'Start-Sleep'"
  crit: notable
  conf: 0.86
  for: [powershell]
  platforms: [windows]
  if:
    type: text
    regex: '(?is)while\s*\(\s*\$true\s*\).{0,800}(BitBlt).{0,800}Start-Sleep'

  # Go: server-side code that retrieves screenshots from a remote client via RPC
  # and saves them as PNG files under a screenshots/ directory (RAT pattern).
- id: go-rpc-screen-api
  desc: Go RPC Screen API call (remote)
  crit: notable
  conf: 0.85
  for: [go]
  platforms: [windows, unix]
  if:
    type: text
    substr: "API.Screen"

- id: go-screenshots-dir
  desc: screenshots/ subdirectory for captured images
  crit: notable
  conf: 0.75
  for: [go]
  platforms: [windows, unix]
  if:
    type: text
    substr: "/screenshots/"

- id: rust-randomized-png-filename
  desc: Randomized PNG filename format
  crit: notable
  conf: 0.9
  for: [rust]
  platforms: [windows, unix]
  if:
    type: string_literal
    exact: "{}.png"

- id: rust-save-image-error
  desc: Screenshot save failure string
  crit: notable
  conf: 0.93
  for: [rust]
  platforms: [windows, unix]
  if:
    type: string_literal
    exact: "Failed to save image!"

- id: rust-capture-frame-error
  desc: Frame capture failure string
  crit: notable
  conf: 0.93
  for: [rust]
  platforms: [windows, unix]
  if:
    type: string_literal
    exact: "Failed to capture frame"

composite_rules:
- id: csharp-screenshot
  desc: C# GDI screenshot capture pattern
  crit: suspicious
  conf: 0.9
  for: [csharp]
  platforms: [windows]
  all:
  - id: screen-primaryscreen
  - id: cursor-position-draw
  any:
  - id: bitblt-dllimport
  - id: micro-behaviors/hardware/display/screen::gdi-bitblt

- id: powershell-addtype-screenshot
  desc: PowerShell compiled screenshot capture
  crit: suspicious
  conf: 0.95
  for: [powershell]
  platforms: [windows]
  all:
  - id: ps-addtype-drawing-screenshot
  - id: ps-virtual-screen-capture
  any:
  - id: ps-save-screenshot-function
  - id: micro-behaviors/process/interpreter/eval/direct::powershell-add-type
  - id: metadata/lang/scripted::add-type-definition

- id: powershell-screenshot-timer
  desc: PowerShell repeated screenshot capture
  crit: suspicious
  conf: 0.93
  for: [powershell]
  platforms: [windows]
  all:
  - id: powershell-addtype-screenshot
  - id: ps-screenshot-loop

- id: powershell-screenshot-upload
  desc: PowerShell screenshot C2 upload
  crit: hostile
  conf: 0.96
  for: [powershell]
  platforms: [windows]
  all:
  - id: powershell-addtype-screenshot
  - id: micro-behaviors/communications/http/upload::curl-upload
  - id: micro-behaviors/communications/ip/literal::http-ip-url

- id: powershell-screenshot-surveillance-upload
  desc: PowerShell screenshot loop upload
  crit: hostile
  conf: 0.97
  for: [powershell]
  platforms: [windows]
  all:
  - id: powershell-screenshot-timer
  - id: powershell-screenshot-upload

- id: go-rpc-screenshot-capture
  desc: Go RAT remote screenshot capture via RPC
  crit: suspicious
  conf: 0.9
  for: [go]
  platforms: [windows, unix]
  all:
  - id: go-rpc-screen-api
  - id: go-screenshots-dir
  - id: micro-behaviors/fs/write/file/full::os-write-file
- id: rust-temp-png-screenshot
  desc: Rust randomized temp PNG screenshot
  crit: suspicious
  conf: 0.95
  for: [rust]
  platforms: [windows, unix]
  all:
  - id: micro-behaviors/hardware/display/screenshot::scrap-screen-capture
  - id: micro-behaviors/fs/path/temp::rust-temp-dir
  - id: micro-behaviors/data/encode/image/buffer::rust-png-image-save
  - id: rust-randomized-png-filename
  any:
  - id: metadata/file/naming::rust-random-name-module
  - id: rust-save-image-error
  - id: rust-capture-frame-error
- id: ps-addtype-drawing-screenshot
  desc: PowerShell Add-Type drawing capture
  crit: component
  conf: 0.9
  for: [powershell]
  platforms: [windows]
  any:
  - id: ps-addtype-drawing-screenshot--rx-1
  - id: ps-addtype-drawing-screenshot--rx-2
  - id: ps-addtype-drawing-screenshot--rx-3
- id: ps-virtual-screen-capture
  desc: PowerShell virtual screen capture
  crit: component
  conf: 0.9
  for: [powershell]
  platforms: [windows]
  any:
  - id: ps-virtual-screen-capture--rx-4
  - id: ps-virtual-screen-capture--rx-5
  - id: ps-virtual-screen-capture--rx-6
- id: ps-screenshot-loop
  desc: PowerShell repeated screenshot loop
  crit: component
  conf: 0.86
  for: [powershell]
  platforms: [windows]
  any:
  - id: ps-screenshot-loop--rx-7
  - id: ps-screenshot-loop--rx-8

# `csharp-screenshot` above requires `Screen.PrimaryScreen` and
# `Cursor.Position` -- the managed .NET screenshot API. Code that declares the
# GDI calls itself through `[DllImport]` has neither, so the composite could
# not see it, and four JetBrains-decompiled screen-grabber classes from a
# single RAT (`43.exe`) scored nothing at all.
#
# The atoms for the P/Invoke spelling already existed in
# `hardware/display/screenshot/windows-gdi-source.yaml` and were consumed only
# by two Lua composites, so this is a wiring gap rather than a coverage one.
#
# Reaching past the managed API to raw gdi32 is the discriminating part: a
# program that wants a screenshot uses `Graphics.CopyFromScreen`, and one that
# declares `BitBlt` plus a DIB section or a screen measurement is assembling
# the pipeline by hand, which is what you do when you want it to work without
# a window and without System.Drawing being an obvious dependency.
# Notable, not suspicious. The benign corpus is full of the programs that
# *implement* this: SDL, Wine, CPython, GHC and MonoDevelop all declare the
# GDI capture chain, because a cross-platform toolkit has to. Assembling the
# pipeline is a capability, and the reason to record it is so the surveillance
# and stealer composites can reach a source file at all -- they could not
# before. Intent belongs to whatever reads this.
- id: pinvoke-gdi-screenshot-source
  desc: Source assembles a GDI screen grab
  crit: notable
  conf: 0.92
  for: [csharp, cpp, c, source]
  platforms: [windows]
#
# Stated as the three parts of the pipeline rather than as a list of API
# names, because each part has more than one spelling and a build picks
# whichever it likes: `BitBlt` or `StretchBlt` for the copy, `CreateDIBSection`
# or `CreateCompatibleBitmap` for the destination, and three different ways to
# ask for the screen's device context. Requiring one specific spelling of each
# is how the first draft of this rule matched one of the four classes.
  all:
  - id: micro-behaviors/hardware/display/screenshot::gdi-screen-device-context-source
  any:
  - id: micro-behaviors/hardware/display/screenshot::gdi-bitblt-source
  - id: micro-behaviors/hardware/display/screen::gdi-stretchblt
  - id: micro-behaviors/hardware/display/screenshot::gdi-dib-section-source
