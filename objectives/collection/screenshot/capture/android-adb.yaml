# ADB screen capture is also used by developers and test harnesses. It becomes
# hostile here only when the same program automates local Wireless ADB pairing
# through Accessibility and receives ADB shell tasks over a WebSocket C2.
defaults:
  platforms: [android]
  for: [java, kotlin, apk, zip, dex]
  attack: T1113

composite_rules:
  - id: android-wireless-adb-c2-screenshot
    desc: Wireless ADB C2 captures device screen
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/command-and-control/remote-command/control::android-wireless-adb-c2-shell
      - id: micro-behaviors/hardware/display/screenshot::android-adb-screencap-service-request
