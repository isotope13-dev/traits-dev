defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1113

composite_rules:
  # The response-dispatch helper may be damaged. Require capture and response
  # construction, but do not claim successful transmission or network exfil.
  - id: shell-task-backdoor-jpeg-screen-response
    desc: Shell-task backdoor constructs JPEG screen replies
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/remote-command/shell::cil-encrypted-task-shell-dispatch
      - id: micro-behaviors/hardware/display/screenshot::cil-jpeg-base64-response-construction

  - id: managed-plugin-backdoor-screen-capture
    desc: Plugin backdoor with screen capture and JPEG encoding references
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/backdoor/dispatch/module::managed-plugin-tasking-backdoor
      - id: micro-behaviors/hardware/display/screenshot::dotnet-copyfromscreen-capture
      - id: micro-behaviors/data/encode/image/jpeg::dotnet-jpeg-encoder-reference
      - id: micro-behaviors/data/encode/base64::dotnet-to-base64string-text

  - id: managed-screen-recording
    desc: Managed keylogger with screen capture record APIs
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: micro-behaviors/hardware/display/screen::screen-data-record-prefix
      - id: micro-behaviors/data/encode/base64::dotnet-to-base64string-text
      - id: micro-behaviors/hardware/display/screenshot::dotnet-copyfromscreen-capture
      - id: micro-behaviors/data/encode/image/jpeg::dotnet-jpeg-encoder-reference
    unless:
      - id: metadata/signed/platform/
