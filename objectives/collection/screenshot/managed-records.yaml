defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: managed-screen-record-upload-api-references
    desc: Screen capture records and upload APIs
    crit: hostile
    conf: 0.96
    attack: T1113
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-upload-api-references
      - id: micro-behaviors/hardware/display/screen::screen-data-record-prefix
      - id: micro-behaviors/data/encode/base64::dotnet-to-base64string-text
      - id: micro-behaviors/hardware/display/screenshot::dotnet-copyfromscreen-capture
      - id: micro-behaviors/hardware/display/screen::imageformat-jpeg-str
      - id: micro-behaviors/communications/http/client/managed::uploadstring
    unless:
      - id: metadata/signed/platform/
