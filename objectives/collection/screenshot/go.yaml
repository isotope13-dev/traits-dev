defaults:
  platforms: [linux, macos, windows]
  attack: T1113
  mbc: C0014
  for: [go]

traits:
  - id: go-main-screenshare-routine
    desc: Go routine name for starting screen sharing
    crit: suspicious
    conf: 0.94
    for: [pe]
    if:
      type: text
      exact: main.startScreenshare
  - id: go-main-send-photo-routine
    desc: Go routine name for sending captured images
    crit: suspicious
    conf: 0.92
    for: [pe]
    if:
      type: text
      exact: main.sendPhoto
  - id: go-windows-desktop-capture-reset
    desc: Go Windows desktop capture reset path
    crit: notable
    conf: 0.93
    if:
      id: micro-behaviors/hardware/display/screenshot::windows-desktop-capture-reset

composite_rules:
  - id: go-telegram-controlled-screen-sharing
    desc: Go screen capture sent through Telegram bot
    crit: hostile
    conf: 0.98
    attack: T1113,T1041,T1071.001
    mbc: C0014,E1041
    for: [pe]
    all:
      - id: go-main-screenshare-routine
      - id: metadata/lang/source/naming/action::go-main-capture-screen-routine
      - id: go-main-send-photo-routine
      - id: micro-behaviors/hardware/display/screenshot::screenshot-string
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
  - id: go-stealth-screenshot-capture
    desc: Go stealth screenshot capture (panic suppression)
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/control-flow/error-handling::go-empty-recover
      - id: micro-behaviors/hardware/display/screenshot::screenshot-string
