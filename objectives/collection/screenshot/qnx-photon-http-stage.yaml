defaults:
  for: [c, objective_c]
  platforms: [unix]
  attack: T1113,T1041

traits:
  - id: photon-screenshot-http-hidden-stage
    desc: Photon screenshot upload and hidden stage
    crit: hostile
    conf: 0.97
    if:
      type: yara
      source: |
        rule photon_screenshot_http_hidden_stage {
          strings:
            $attach = /PhScreenAttach[ \t]*\(/
            $image = /PhGetImage[ \t]*\(/
            $post = "POST %s HTTP/1.1"
            $send = /send[ \t]*\(/
            $hidden = /\/tmp\/\.[A-Za-z_]+%d/
            $decode = /base64_decode[ \t]*\(/
          condition:
            all of them
        }
