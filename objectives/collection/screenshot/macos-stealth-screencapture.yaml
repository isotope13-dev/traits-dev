defaults:
  platforms:
    - unix
    - windows
    - macos

composite_rules:
  - id: stealth-screenshot
    desc: Stealth screenshot with volume muting
    crit: hostile
    conf: 0.95
    attack: T1113
    for: [macho, shell]
    all:
      - id: micro-behaviors/hardware/display/screenshot::macos-screencapture-command
      - id: micro-behaviors/ui/controls/volume::applescript-mute
