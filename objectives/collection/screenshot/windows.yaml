defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  attack: T1113
  mbc: C0014
composite_rules:
- id: powershell-foreground-window-screenshot
  desc: PowerShell captures a window as base64 PNG
  crit: suspicious
  conf: 0.98
  for:
  - powershell
  all:
  - id: micro-behaviors/ui/window/enumerate::get-foreground-window-source
  - id: micro-behaviors/ui/window/region::powershell-window-bounds
  - id: micro-behaviors/hardware/display/screenshot/unspecified::powershell-copyfromscreen
  - id: micro-behaviors/data/buffer/alloc::powershell-memory-stream-constructor
  - id: micro-behaviors/data/encode/image/png::powershell-png-image
  - id: micro-behaviors/data/encode/base64/content::powershell-base64-image
- id: powershell-webview-window-capture
  desc: PowerShell captures a WebView window
  crit: suspicious
  conf: 0.99
  attack: T1113,T1027.003
  mbc: B0015
  for:
  - powershell
  all:
  - id: micro-behaviors/ui/window/enumerate::powershell-child-window-enumeration
  - id: micro-behaviors/ui/window/webview::powershell-webview-class-marker
  - id: micro-behaviors/hardware/display/screenshot/unspecified::powershell-printwindow-call
  - id: micro-behaviors/hardware/display/screenshot/window::print-window-full-content
  - id: micro-behaviors/ui/window/region::powershell-window-bounds
  near_lines: 100
- id: printwindow-window-capture
  desc: PrintWindow selected window capture
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/hardware/display/screenshot/window::printwindow-capture-primitives
  - id: micro-behaviors/ui/window/enumerate::desktop-window-enumeration
  any:
  - id: micro-behaviors/ui/window/control::get-window-rect
  - id: micro-behaviors/communications/http/server/managed::mjpeg-stream-content-type
  downgrade:
    any:
    - id: well-known/app/browser/internet-explorer/
  unless:
  - id: well-known/lib/platform/vanara::vanara-binding-assembly
- id: gdi-clipboard-socks5-executable-loader
  desc: Screen and clipboard collection with SOCKS5 loader
  crit: hostile
  conf: 0.97
  all:
  - id: objectives/collection/multi-source::gdi-bitmap-clipboard-desktop-api-set
  - id: micro-behaviors/communications/proxy/socks/wire::socks5-noauth-greeting-stack-store-x86-64
  - id: metadata/binary/instruction/sequence/unspecified::allocation-like-argument-patterns
  - id: micro-behaviors/process/control/info::process-info-class-7-constant
  - id: metadata/binary/instruction/operand::x64-load-edx-31
  unless:
  - id: metadata/binary/symbols/count::many-exports
- id: gdi-capture-clipboard-hook-surveillance
  desc: GDI screen capture with clipboard access and keyboard hooks
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/hardware/display/screenshot/unspecified::gdi-screen-capture-primitives
  - id: micro-behaviors/os/clipboard/read::get-clipboard-data
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  any:
  - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
  - id: micro-behaviors/ui/window/enumerate::get-foreground-window
  - id: micro-behaviors/ui/window/enumerate::get-window-text
  needs: 2
  unless:
  - id: metadata/installer/product/
  - id: metadata/lang/compiler/managed::borland-section-code
- id: gdi-keyboard-capture-through-tunnel
  desc: GDI screen and keyboard capture through tunnel service
  crit: hostile
  conf: 0.99
  attack: T1113,T1056.001,T1090
  all:
  - id: micro-behaviors/hardware/display/screenshot/unspecified::gdi-screen-capture-primitives
  - id: micro-behaviors/hardware/input/keyboard/poll::polling-keyboard-api-cluster
  - id: micro-behaviors/communications/url/host/name::ngrok-io-endpoint
- id: unsigned-obfuscated-screen-clipboard-surveillance
  desc: Unsigned obfuscated PE captures screen and clipboard data
  crit: hostile
  conf: 0.99
  attack: T1027,T1113,T1115
  all:
  - id: objectives/collection/multi-source::gdi-bitmap-clipboard-desktop-api-set
  - id: metadata/binary/layout/checksum::pe-checksum-zeroed
  - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
  - id: metadata/binary/instruction/operand::x86-pointer-load-displacement-3c
  - id: micro-behaviors/data/bitwise/xor-forms/instruction::x64-xor-imm8-widen-loop
  unless:
  - id: metadata/installer/product/
