# Tasked screen capture from JVM Android source: a broker subscriber that
# captures the display through the hidden SurfaceControl API and publishes
# the image back over MQTT is a remote-desktop monitor, not a screenshot
# feature. (XCPE pairs this with Instrumentation key injection for full
# remote control; the capture-and-publish loop alone is the collection
# behavior, so key injection is not required here.)
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1113

composite_rules:
  - id: android-mqtt-hidden-screen-stream
    desc: Streams hidden-API screen captures over MQTT
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/hardware/display/screenshot/unspecified::android-hidden-api-screen-capture
      - id: micro-behaviors/communications/messaging/mqtt::java-mqtt-subscriber
      - id: micro-behaviors/communications/messaging/mqtt::java-mqtt-publisher
