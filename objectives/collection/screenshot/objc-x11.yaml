defaults:
  platforms: [unix]
  for: [objc, elf]
  attack: T1113
  mbc: C0014

composite_rules:
  - id: objc-x11-getimage
    for: [elf]
    desc: ObjC X11 XGetImage capture
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/hardware/display/screen::xgetimage-symbol
      - id: micro-behaviors/process/interpreter/runtime/dynamic::objc-runtime-msgsend

  - id: objc-x11-screenshot-capture
    for: [elf]
    desc: ObjC X11 screenshot capture
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/ui/window/probe::objc-x11-root-window
      - id: micro-behaviors/hardware/display/screen::xgetimage-symbol
      - id: micro-behaviors/fs/path/media::objc-ppm-screenshot-temp
