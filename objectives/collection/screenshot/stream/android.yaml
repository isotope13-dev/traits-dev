# Fuyao-like screen streaming combines local display capture with a remote
# WebRTC/WebSocket channel.  Screen sharing is not hostile by itself, so the
# remote-stream composite is suspicious; adding phone-identity spoofing makes
# the article's abuse-oriented cluster hostile without naming one campaign.
defaults:
  platforms: [android]
  for: [java, kotlin, apk, zip]
  attack: T1036,T1113,T1041
  mbc: B0002

composite_rules:
  - id: android-screen-stream-to-c2
    desc: Android screen capture streamed through WebRTC to a remote endpoint
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/websocket/media::android-webrtc-screen-stream
      - id: micro-behaviors/communications/websocket/endpoints::android-wss-endpoint

  - id: android-phone-spoofed-screen-stream
    desc: Android phone-identity spoofing paired with remote screen streaming
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/evasion/masquerade/identity/device::android-phone-profile-spoofing
      - id: android-screen-stream-to-c2
