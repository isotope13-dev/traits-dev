defaults:
  platforms: [android]
  for: [dex]
  attack: T1027,T1041,T1113

composite_rules:
  - id: android-dump-screenshot-obfuscated
    desc: Obfuscated APK dumps screen via accessibility
    crit: hostile
    conf: 0.96
    for: [apk, zip, xml, dex]
    scope: archive
    all:
      - id: micro-behaviors/os/privilege/manifest::dump-permission
      - id: micro-behaviors/hardware/display/screenshot::android-accessibility-screenshot-api
      - id: objectives/anti-static/obfuscation/name-mangling/class-folder::android-deep-long-package-namespace
  - id: android-admin-dump-screenshot
    desc: Device-admin APK dumps accessibility screenshots
    crit: hostile
    conf: 0.97
    for: [apk, zip, xml, dex]
    scope: archive
    all:
      - id: micro-behaviors/os/privilege/manifest::bind-device-admin
      - id: micro-behaviors/os/privilege/manifest::dump-permission
      - id: micro-behaviors/hardware/display/screenshot::android-accessibility-screenshot-api
