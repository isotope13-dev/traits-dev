# Source reconstruction of the collection and SMTP behaviors described in
# https://asec.ahnlab.com/en/96698/. This establishes co-occurrence, not a
# proven flow of the captured image into the SMTP message.
defaults:
  for: [csharp]
  platforms: [windows]
  attack: T1113
  mbc: C0014

composite_rules:
  - id: csharp-keylogger-smtp-screen-capture
    desc: Screen capture accompanies keylogging and SMTP sending
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/display/screenshot/display::csharp-copy-from-screen-capture
      - id: objectives/collection/keylog/capture::csharp-key-name-file-keylogger
      - id: micro-behaviors/communications/email/send/smtp::smtp-client-send-message
