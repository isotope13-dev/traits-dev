defaults:
  platforms:
    - unix
    - windows
    - macos

composite_rules:
  - id: screencapture-with-creds
    desc: Screenshot capture with credential theft
    crit: hostile
    conf: 0.95
    attack: T1113
    mbc: B0028
    for:
    - macho
    - shell
    all:
    - id: micro-behaviors/hardware/display/screenshot::macos-screencapture-command
    any:
    - id: micro-behaviors/fs/file/open::wallet-dat-path
    - id: objectives/credential-access/validation/check::csidentity-password-auth
    - id: objectives/collection/file-targeting/filter::credential-files
    - id: objectives/collection/file-targeting/filter::wallet-files
    - id: objectives/credential-access/browser/chromium/
    - id: objectives/credential-access/browser/app-bound/
    - id: objectives/credential-access/browser/devtools/
    - id: objectives/credential-access/browser/loot::browsers-info-artifact
    - id: objectives/credential-access/browser/loot::appbound-key-artifact
    - id: objectives/credential-access/browser/loot::decrypted-browser-key-artifact
    - id: objectives/credential-access/browser/loot::browser-secret-record-tags
    downgrade:
      any:
      - id: metadata/signed/platform/
      - id: well-known/tool/detection/
    unless:
    - id: well-known/tool/detection/cleave::cleave-static-analysis-context
