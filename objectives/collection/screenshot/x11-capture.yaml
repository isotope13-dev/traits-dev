defaults:
  platforms: [linux]
  attack: T1113
  mbc: C0014
  for: [go, c, cpp, rust]

composite_rules:
  - id: x11-desktop-capture-reset-behavior
    platforms: [linux, macos, windows]
    desc: Resets X11 desktop capture (stealth/cleanup)
    crit: suspicious
    conf: 0.85
    # reset-desktop-capture (screenshot/go.yaml) is a Go-source, Windows-only
    # `ResetDesktopCapture` function name -- unrelated to X11 and structurally
    # impossible to pair with an X11 leg. Both real X11 legs (the capture API
    # and the reset-function text marker) live in screen/x11.yaml as
    # `for: [binaries]`.
    for: [binaries]
    all:
    - id: micro-behaviors/hardware/display/screen::x11-reset-symbol
    - id: micro-behaviors/hardware/display/screen::xgetimage-symbol
