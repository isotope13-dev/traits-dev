# A hooking engine inside the app's own process strips the window
# capture-exclusion flag, re-admitting a protected screen (for example a
# banking app's) to screenshots and remote viewing. Clearing FLAG_SECURE
# is ordinary in video players; armed alongside a method hook it turns
# the app's defenses against it.
# ATT&CK: T1113 (Screen Capture)
# MBC: C0014
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1113
  mbc: C0014

composite_rules:
  - id: hooked-capture-protection-strip
    desc: Hook engine strips window capture protection
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/hook/keywords::yahfa-method-hook-call
      - id: micro-behaviors/ui/window/overlay::android-secure-flag-clear
    near_bytes: 4096
