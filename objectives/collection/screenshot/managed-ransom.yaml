defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # The established ransom recorder supplies abuse context. This is a
  # file-scoped capture/API profile, not proof that screenshots are uploaded.
  - id: managed-ransom-keylogger-screen-capture
    desc: Ransom keylogger with screen-capture and JPEG references
    crit: hostile
    conf: 0.96
    attack: T1113
    all:
      - id: objectives/exfiltration/stealer/input::managed-ransom-hook-keylog-form-post
      - id: micro-behaviors/hardware/display/screenshot::dotnet-copyfromscreen-capture
      - id: micro-behaviors/data/encode/image/jpeg::dotnet-jpeg-encoder-reference
