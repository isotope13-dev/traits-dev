# Desktop capture with machine-wide staging path references.
# The neutral capture capability also supports in-memory PNG encoding.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1113
  mbc: C0014

composite_rules:
  # Where the image lands decides whether this reads as a utility or as
  # staging. %ProgramData% is machine-wide, writable by any user, and not a
  # place a person looks for their own screenshots -- which is exactly why
  # collectors stage there and why no screenshot tool offers it as a default.
  - id: powershell-desktop-capture-staged-machine-wide
    desc: Desktop capture staged under ProgramData
    crit: suspicious
    conf: 0.96
    attack: T1113,T1074.001
    all:
      - id: micro-behaviors/hardware/display/screenshot::powershell-full-desktop-png-capture
    any:
      - id: micro-behaviors/fs/path/system::programdata-env-lookup
      - id: micro-behaviors/fs/path/system::programdata-directory-path
    needs: 1

  - id: powershell-copyfromscreen-programdata-png
    desc: CopyFromScreen PNG staged under ProgramData
    crit: hostile
    conf: 0.96
    attack: T1113,T1074.001
    all:
      - id: micro-behaviors/hardware/display/screenshot::powershell-copyfromscreen
      - id: micro-behaviors/data/encode/image/png::powershell-png-image
      - id: micro-behaviors/fs/path/system::programdata-env-lookup

  - id: powershell-virtualscreen-programdata-png
    desc: Full-desktop PNG staged under ProgramData
    crit: hostile
    conf: 0.96
    attack: T1113,T1074.001
    all:
      - id: micro-behaviors/hardware/display/state::powershell-virtual-screen-bounds
      - id: micro-behaviors/data/encode/image/png::powershell-png-image
      - id: micro-behaviors/fs/path/system::programdata-env-lookup

  - id: powershell-virtualscreen-copyfromscreen-programdata
    desc: VirtualScreen capture staged under ProgramData
    crit: hostile
    conf: 0.96
    attack: T1113,T1074.001
    all:
      - id: micro-behaviors/hardware/display/state::powershell-virtual-screen-bounds
      - id: micro-behaviors/hardware/display/screenshot::powershell-copyfromscreen
      - id: micro-behaviors/fs/path/system::programdata-env-lookup
