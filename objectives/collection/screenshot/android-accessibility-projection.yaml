defaults:
  platforms: [android]
  for: [apk, zip]

composite_rules:
  - id: android-accessibility-screen-capture
    for: [apk, zip, dex, xml]
    desc: Android accessibility screen capture
    crit: suspicious
    conf: 0.94
    unless:
      - id: well-known/dual-use/remote-admin/rustdesk::rustdesk-android-package
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-config
      - id: micro-behaviors/hardware/display/screenshot::android-media-projection-screen-capture
    any:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-request-layout
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-settings-intent
  - id: android-a11y-settings-screen-rat
    desc: RAT prompts accessibility then captures screen
    crit: hostile
    conf: 0.94
    scope: outer
    for: [android_apk, zip, dex]
    unless:
      - id: well-known/dual-use/remote-admin/rustdesk::rustdesk-android-package
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-class
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-settings-intent
      - id: micro-behaviors/hardware/display/screenshot::android-media-projection-screen-capture
