# The same-file observations do not bind sensitive paths to the duplicate
# source or establish TCC authorization, prompting, or bypass. Preserve the
# combination as suspicious collection context. Validated password phishing
# supplies independent attack admission for the hostile collection profile.
defaults:
  platforms: [macos]
  for: [scripts, source, macho]

composite_rules:
  - id: finder-copy-sensitive-store-references
    desc: Finder copy with multiple sensitive-store references
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/file/copy::applescript-duplicate-to-location
      - id: micro-behaviors/os/application/target/system::finder-applescript-target
      - id: micro-behaviors/fs/path/credential::multi-sensitive-store-references

  - id: password-phishing-finder-store-copy-profile
    desc: Password phishing with Finder sensitive-store copy profile
    crit: hostile
    conf: 0.97
    attack: T1005,T1056.002
    all:
      - id: finder-copy-sensitive-store-references
      - id: objectives/credential-access/phishing/lure::applescript-credential-phish-hostile
