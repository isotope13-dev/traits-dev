defaults:
  platforms: [macos]
  for: [applescript, shell]
composite_rules:
  - id: password-phishing-document-secret-find-copy
    desc: Password phish with document/secret copies
    crit: hostile
    conf: 0.97
    attack: T1005,T1119
    all:
      - id: objectives/credential-access/phishing/lure::applescript-credential-phish-hostile
      - id: objectives/collection/file-targeting/filter::office-secret-extension-list
      - id: micro-behaviors/fs/file/copy/command::find-exec-copy-command
