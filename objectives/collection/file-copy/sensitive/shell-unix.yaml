defaults:
  platforms: [linux, android]
  for: [shell]
  attack: T1074.001

composite_rules:
  - id: shell-proc-environ-secret-temp-staging
    desc: Stages proc-environment secrets in temp files
    crit: hostile
    conf: 0.98
    near_lines: 64
    all:
      - id: objectives/credential-access/env/harvesting::shell-proc-environ-secret-file-harvest
      - id: micro-behaviors/fs/path/temp::unix-temp
      - id: micro-behaviors/fs/file/write/redirect::shell-file-write-command
