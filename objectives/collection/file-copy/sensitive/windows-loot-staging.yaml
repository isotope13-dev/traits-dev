# Sensitive-root collection staging: a copy command pulls a file from another
# user's profile Desktop while the same script dumps Windows credential hives.
# Each ingredient is a capability on its own - migration and backup scripts
# copy profile Desktops, and forensic acquisition saves hives - so the claim
# stays at collection (staging selected by sensitive roots) rather than
# theft; the credential story is carried by the hive-dump objectives.
defaults:
  platforms: [windows]
  for: [scripts, batch]
  attack: T1005
composite_rules:
- id: desktop-copy-with-hive-dump
  desc: Copies a profile Desktop file while dumping hives
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/fs/file/copy/source-destination::user-profile-desktop-copy-source
  any:
  - id: objectives/credential-access/registry/access::reg-save-sam-hive
  - id: objectives/credential-access/registry/access::reg-save-system-hive
  - id: objectives/credential-access/registry/access::reg-save-security-hive
