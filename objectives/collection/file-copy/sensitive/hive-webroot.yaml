defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: registry-hive-export-iis-webroot-copy
    desc: Registry hive exports with hive file copied to IIS webroot
    crit: hostile
    attack: T1003.002,T1074.001
    all:
      - id: objectives/credential-access/registry/access::sam-system-security-hive-dump
      - id: micro-behaviors/fs/file/copy/source-destination::batch-copy-hive-to-iis-webroot
