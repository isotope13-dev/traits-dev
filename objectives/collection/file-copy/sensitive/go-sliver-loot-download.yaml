defaults:
  for: [go]
  platforms: [unix, windows]
traits:
  - id: go-sliver-download-save-loot
    desc: Decodes Sliver file download and saves loot
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule go_sliver_download_save_loot {
          strings:
            $framework = "github.com/bishopfox/sliver/protobuf/sliverpb"
            $rpc = "con.Rpc.Download(context.Background(), &sliverpb.DownloadReq{"
            $file = "RestrictedToFile: true"
            $gzip = "new(encoders.Gzip).Decode(download.Data)"
            $loot = "loot.LootDownload(download, lootName, fileType, cmd, con)"
          condition:
            all of them
        }
