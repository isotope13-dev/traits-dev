# The source rule binds the sensitive root to the copy's SOURCE argument.
# A copy into a VPN configuration directory is not collection from that root.
# Native facts do not recover those arguments: keep their co-occurrence
# classification separate and explicitly suspicious.
defaults:
  platforms: [windows, linux, macos]
  crit: suspicious
  attack: T1005

traits:
  - id: openvpn-configuration-copy
    desc: Copies from an OpenVPN configuration directory
    conf: 0.95
    for: [python, c, cpp]
    if:
      type: symbol
      kind: call
      regex: '^(shutil\.(copytree|copyfile)|CopyFile[AW]?)$'
      arg:
        index: 0
        from:
          value: '(?i)OpenVPN[/\\]+config([/\\]|$)'

composite_rules:
  - id: native-openvpn-config-copy-clues
    desc: OpenVPN path with enumeration and copy APIs
    conf: 0.9
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: micro-behaviors/fs/path/application/vpn::openvpn-config-dir
      - id: micro-behaviors/fs/directory/readdir/native::find-first-file
      - id: micro-behaviors/fs/file/copy/call::copyfile-w
