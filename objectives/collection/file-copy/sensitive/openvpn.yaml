# The source rule binds the sensitive root to the copy's SOURCE argument.
# A copy into a VPN configuration directory is not collection from that root.
# Native facts do not recover those arguments: keep their co-occurrence
# classification separate and explicitly suspicious.
defaults:
  platforms: [windows, linux, macos]
  crit: suspicious
  attack: T1005

traits:
  # The C/C++ facts producer leaves wide-string initializers opaque. Bind the
  # adjacent declaration and copy source structurally rather than falling back
  # to a path anywhere beside a generic CopyFile call.
  - id: native-openvpn-wide-source-copy
    desc: Copies from a wide-string OpenVPN config path
    conf: 0.97
    for: [c, cpp]
    platforms: [windows]
    if:
      type: tree-sitter
      query: |
        ((compound_statement
          (declaration declarator: (init_declarator
            declarator: (pointer_declarator declarator: (identifier) @path)
            value: (string_literal) @source))
          . (expression_statement (call_expression function: (identifier) @copy
            arguments: (argument_list . (identifier) @input . (_) . (_) .)))) @copying
          (#set! cleave.ignore-comments "true")
          (#match? @source "^L\"")
          (#match? @source "(?i)[/\\\\]OpenVPN[/\\\\]+config([/\\\\]|\")")
          (#eq? @path @input)
          (#eq? @copy "CopyFileW"))
        ((call_expression function: (identifier) @copy
          arguments: (argument_list . (string_literal) @source . (_) . (_) .)) @copying
          (#match? @source "^L\"")
          (#match? @source "(?i)[/\\\\]OpenVPN[/\\\\]+config([/\\\\]|\")")
          (#eq? @copy "CopyFileW"))

  - id: openvpn-configuration-copy
    desc: Copies from an OpenVPN configuration directory
    conf: 0.95
    for: [python, c, cpp]
    if:
      type: symbol
      kind: call
      regex: '^(shutil\.(copytree|copyfile)|CopyFile[AW]?)$'
      arg:
        index: 0
        from:
          value: '(?i)(^|[/\\])OpenVPN[/\\]+config([/\\]|$)'

