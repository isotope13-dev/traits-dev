defaults:
  platforms: [linux]
  for: [shell]
  attack: T1552.004
traits:
  - id: shell-copy-root-ssh-directory
    desc: Copies the root SSH credential directory
    crit: suspicious
    if:
      type: text
      regex: '\bcp\s+(-[a-zA-Z]+\s+){0,2}["'']?/root/\.ssh/?["'']?\s+'
      exclude_comments: true
