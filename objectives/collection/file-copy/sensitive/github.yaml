# Bulk private-source collection over GitHub's archive and Git transports.
# Requiring the private organization inventory and recursive tree walk keeps
# normal one-off clones and release downloads out of these findings.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  attack: T1213.003

composite_rules:
  - id: github-private-repository-archive-harvest
    desc: Downloads inventoried private repo archives
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/services/github::github-paginated-private-org-repository-list
      - id: micro-behaviors/communications/http/services/github::github-git-trees-recursive-api
      - id: micro-behaviors/communications/http/services/github::github-repository-archive-api-endpoint
    near_bytes: 8192

  - id: github-private-repository-dual-collection
    desc: Collects private repos as archives and mirrors
    crit: hostile
    conf: 0.99
    all:
      - id: github-private-repository-archive-harvest
      - id: micro-behaviors/process/create/vcs/git::git-mirror-clone
      - id: micro-behaviors/os/env/vcs::github-token-name-reference
    near_bytes: 8192
