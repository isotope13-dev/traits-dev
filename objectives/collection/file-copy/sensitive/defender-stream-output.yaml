# The service pivot supplies the access-bypass evidence. Independently bind
# both copy operands to mapped file views and require a mapped-view flush.
# This is a source-local capability profile, not proof that the exploit ran
# successfully or that the arbitrary target contains credentials.
defaults:
  platforms: [windows]
  for: [c, cpp]

composite_rules:
  - id: defender-stream-file-collection
    desc: Defender stream pivot with file-copy output
    crit: hostile
    conf: 0.98
    attack: T1005
    all:
      - id: objectives/privilege-escalation/exploit/vulnerabilities/service::defender-shadow-object-stream-read
      - id: micro-behaviors/mem/copy::mapped-file-view-copy
      - id: micro-behaviors/mem/copy::mapped-file-view-flush
