defaults:
  platforms: [macos]
  for: [applescript, shell, javascript, typescript, python]

composite_rules:
  - id: phished-secret-store-copies
    desc: Password phish with three secret-store copies
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1555.001,T1552.001,T1552.004
    all:
      - id: objectives/credential-access/phishing/lure::applescript-credential-phish-hostile
      - id: objectives/credential-access/keychain/theft::keychain-directory-copy-to-tmp
      - id: objectives/credential-access/cloud/local-credentials::aws-directory-copy-to-tmp
      - id: objectives/credential-access/ssh/key::ssh-directory-copy-to-tmp
  - id: password-phishing-credential-store-copy
    desc: Password phish with sensitive store copying
    crit: hostile
    conf: 0.98
    attack: T1056.002,T1555,T1005
    all:
      - id: objectives/credential-access/phishing/lure::applescript-credential-phish-hostile
      - id: micro-behaviors/fs/file/copy::cp-command-text
      - id: micro-behaviors/fs/path/credential::multi-sensitive-store-references
    any:
      - id: objectives/collection/file-targeting/filter::office-secret-extension-list
      - id: micro-behaviors/fs/path/temp::temp-path-segment
      - id: micro-behaviors/fs/directory/create::applescript-shell-mkdir-parent
