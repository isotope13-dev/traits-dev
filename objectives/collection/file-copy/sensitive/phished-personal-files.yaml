defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
composite_rules:
  # Same-file collection profile, not a static data-flow join. Both folder
  # populations, extension filtering and a password-store suffix are required.
  - id: password-phishing-filtered-personal-file-copy
    desc: Password phishing with filtered personal-file copying
    crit: hostile
    conf: 0.97
    attack: T1005,T1056.002
    all:
      - id: objectives/credential-access/phishing/lure::applescript-credential-phish-hostile
      - id: micro-behaviors/fs/directory/readdir::desktop-file-enumeration
      - id: micro-behaviors/fs/directory/readdir::documents-file-enumeration
      - id: micro-behaviors/fs/path-ops/parse::applescript-extension-membership-filter
      - id: micro-behaviors/fs/path/password-store::kdbx-extension-reference
      - id: micro-behaviors/fs/file/copy::duplicate-file-into-folder
