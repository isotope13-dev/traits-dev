defaults:
  for: [shell]
  platforms: [unix]
composite_rules:
  - id: snmp-cleartext-config-export
    desc: Configures running configuration export over unencrypted TFTP
    crit: suspicious
    attack: T1602.002
    ref: https://www.picussecurity.com/resource/blog/fsb-center-16-how-russian-hackers-exploit-routers-via-snmp-and-cisco-smart-install
    near_lines: 10
    all:
      - id: micro-behaviors/communications/ip/services::snmp-set-command
      - id: micro-behaviors/communications/ip/services::snmp-copy-tftp
      - id: micro-behaviors/communications/ip/services::snmp-copy-running-config
      - id: micro-behaviors/communications/ip/services::snmp-copy-network-destination
      - id: micro-behaviors/communications/ip/services::snmp-copy-create-and-go
