defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  mbc: E1510
  attack: T1115
  crit: suspicious
traits:
  - id: win32-get-clipboard
    desc: win32clipboard.GetClipboardData
    crit: notable
    conf: 0.7
    platforms:
      - windows
    if:
      type: string_literal
      substr: win32clipboard.GetClipboardData
  - id: win32-set-clipboard
    desc: win32clipboard.SetClipboardData
    crit: notable
    conf: 0.6
    platforms:
      - windows
    if:
      type: string_literal
      substr: win32clipboard.SetClipboardData
  - id: win32-open-clipboard
    desc: win32clipboard.OpenClipboard
    crit: notable
    conf: 0.6
    platforms:
      - windows
    if:
      type: string_literal
      substr: win32clipboard.OpenClipboard
  - id: wx-clipboard
    desc: wx.Clipboard
    crit: notable
    conf: 0.6
    if:
      type: string_literal
      substr: wx.Clipboard
  - id: clipboard-getdata
    desc: clipboard.GetData
    crit: notable
    conf: 0.6
    if:
      type: string_literal
      substr: clipboard.GetData
  - id: wx-theclipboard
    desc: wx.TheClipboard
    crit: notable
    conf: 0.6
    if:
      type: string_literal
      substr: wx.TheClipboard
  - id: set-clipboard-viewer
    desc: SetClipboardViewer function
    crit: notable
    conf: 0.8
    platforms:
      - windows
    if:
      type: symbol
      exact: SetClipboardViewer
  - id: wm-drawclipboard
    desc: WM_DRAWCLIPBOARD message
    crit: notable
    conf: 0.8
    platforms:
      - windows
    if:
      type: string_literal
      substr: WM_DRAWCLIPBOARD
  - id: wm-changecbchain
    desc: WM_CHANGECBCHAIN message
    crit: notable
    conf: 0.7
    platforms:
      - windows
    if:
      type: string_literal
      substr: WM_CHANGECBCHAIN
  - id: pynput-import-clipboard
    desc: from pynput import clipboard
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: from pynput import clipboard
  - id: pynput-clipboard-mod
    desc: pynput.clipboard module
    crit: notable
    conf: 0.6
    if:
      type: string_literal
      substr: pynput.clipboard
  - id: requests-post-clip
    desc: requests.post with clipboard
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: clipboard.{0,50}requests\.post|requests\.post.{0,50}clipboard
  - id: requests-get-clip
    desc: requests.get with clipboard
    crit: notable
    conf: 0.4
    if:
      type: text
      regex: clipboard.{0,50}requests\.get|requests\.get.{0,50}clipboard
  - id: urllib-clip
    desc: urllib with clipboard
    crit: notable
    conf: 0.4
    if:
      type: text
      regex: clipboard.{0,50}urllib|urllib.{0,50}clipboard
  - id: socket-clip
    desc: socket with clipboard
    crit: notable
    conf: 0.4
    if:
      type: text
      regex: clipboard.{0,50}socket|socket.{0,50}clipboard
  - id: schedule-clipboard
    desc: schedule with clipboard
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: schedule.{0,50}clipboard|clipboard.{0,50}schedule
  - id: time-sleep-clipboard
    desc: time.sleep with clipboard
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: time\.sleep.{0,50}clipboard|clipboard.{0,50}time\.sleep
  - id: message-loop-str
    desc: '"message loop" string'
    crit: component
    conf: 0.5
    platforms:
      - windows
    if:
      type: string_literal
      substr: message loop
composite_rules:
  - id: python-win32clipboard
    desc: Windows clipboard read via win32clipboard
    conf: 0.8
    crit: notable
    platforms:
      - windows
    any:
      - id: win32-get-clipboard
      - id: micro-behaviors/os/clipboard/access::python-win32-get-clipboard-data
  # Bare pyperclip.paste() is a neutral clipboard-read capability already
  # emitted as micro-behaviors/os/clipboard/access::pyperclip-paste. Do not
  # re-emit it under collection/monitor — TUI paste helpers and clippers share
  # that atom; intent lives in the composites below that add more legs.
  - id: python-wx-clipboard
    desc: Clipboard access (wxPython)
    conf: 0.75
    crit: notable
    any:
      - id: wx-clipboard
      - id: clipboard-getdata
      - id: wx-theclipboard
  - id: python-tkinter-clipboard
    desc: Clipboard access (tkinter)
    conf: 0.65
    crit: notable
    any:
      - id: micro-behaviors/os/clipboard/access::tkinter-clipboard-get-method
      - id: micro-behaviors/os/clipboard/access::tkinter-clipboard-clear-method
  - id: python-clipboard-change
    desc: Clipboard change notification handler
    conf: 0.9
    crit: suspicious
    platforms:
      - windows
    any:
      - id: wm-drawclipboard
      - id: wm-changecbchain
  - id: python-pynput-clipboard
    desc: Clipboard monitoring via pynput
    conf: 0.75
    any:
      - id: pynput-import-clipboard
      - id: pynput-clipboard-mod
  - id: python-clipboard-access-any
    desc: Clipboard access via any library
    conf: 0.7
    crit: notable
    any:
      - id: python-win32clipboard
      - id: micro-behaviors/os/clipboard/access::pyperclip-paste
      - id: python-wx-clipboard
      - id: micro-behaviors/os/clipboard/access::tkinter-clipboard-get-method
  - id: python-network-exfil
    desc: Network communication for potential exfiltration
    conf: 0.6
    crit: suspicious
    any:
      - id: requests-post-clip
      - id: requests-get-clip
      - id: urllib-clip
      - id: socket-clip
  - id: python-overlay-clipboard-vercel-exfil
    desc: Borderless overlay continuously posts clipboard to Vercel
    conf: 0.97
    crit: hostile
    all:
      - id: micro-behaviors/os/clipboard/access::pyperclip-paste
      - id: micro-behaviors/os/clipboard/access::pyperclip-copy
      - id: micro-behaviors/communications/http/post::session-post
      - id: micro-behaviors/communications/http/endpoints::vercel-serverless
      - id: micro-behaviors/ui/window/manage/visibility::tkinter-topmost
      - id: micro-behaviors/ui/window/manage/visibility::tkinter-overrideredirect
      - id: micro-behaviors/time/schedule/interval::tkinter-monitor-callback-schedule
  - id: python-clipboard-viewer-notify
    desc: Clipboard viewer or change notification
    conf: 0.85
    crit: suspicious
    platforms:
      - windows
    any:
      - id: set-clipboard-viewer
      - id: wm-drawclipboard
  - id: python-clipboard-get-data
    desc: Clipboard data retrieval function
    conf: 0.8
    crit: notable
    any:
      - id: micro-behaviors/os/clipboard/monitor::python-get-clipboard-data-call
      - id: micro-behaviors/os/clipboard/access::get-clipboard-data
      - id: clipboard-getdata
  - id: python-realtime-monitor
    desc: Real-time clipboard monitoring
    conf: 0.9
    crit: hostile
    all:
      - id: python-clipboard-viewer-notify
      - id: python-clipboard-get-data
      - id: message-loop-str
  - id: python-win32-format-listener-monitor
    desc: Python reads clipboard contents from a Win32 change listener
    conf: 0.94
    # A listener plus GetClipboardData proves continuous clipboard access, but
    # not theft: clipboard managers, automation frameworks, and accessibility
    # tools implement this exact mechanism. Keep the observable behavior
    # analyst-visible; elevate only when a separate rule proves misuse.
    crit: notable
    platforms: [windows]
    all:
      - id: micro-behaviors/os/clipboard/monitor::python-add-clipboard-format-listener
      - id: micro-behaviors/os/clipboard/monitor::python-get-clipboard-data-call
      - id: micro-behaviors/os/clipboard/monitor::python-get-message-call
  - id: python-background-clipboard-capture-with-key-hook
    desc: Background clipboard capture paired with a global keyboard hook
    conf: 0.98
    crit: hostile
    attack: T1056.001,T1115
    all:
      - id: micro-behaviors/hardware/input/keyboard/listener::pynput-listener-constructor
      - id: micro-behaviors/os/clipboard/monitor::python-start-clipboard-watcher
      - id: python-clipboard-get-data
      - id: micro-behaviors/os/clipboard/monitor::python-save-clipboard-files-or-images
