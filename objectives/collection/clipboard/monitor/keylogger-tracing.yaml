defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: hidden-clipboard-keyboard-api-cluster
    desc: Clipboard, keyboard hook and memory API references
    crit: notable
    conf: 0.94
    attack: T1056.001,T1115
    all:
      - id: micro-behaviors/os/clipboard/reference::dynamic-clipboard-readwrite-hook-api-set
      - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state-str
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-string-text-section
      - id: micro-behaviors/os/api-resolution/dynamic::get-proc-address-resolved-name
      - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
    unless:
      # Strings in an inert image are not evidence of capture execution.
      - id: metadata/binary/code/entry::return-only-no-directories
  - id: keylogger-clipboard-file-tracing
    desc: Keyboard surveillance logs clipboard content
    crit: hostile
    conf: 0.98
    attack: T1115
    all:
      - id: dotnet-clipboard-file-tracing
      - id: objectives/collection/keylog/hook::wiretap-keystroke-recording
