defaults:
  platforms: [windows, unix]
  attack: T1115
  mbc: B0014
  for:
    - javascript
    - typescript
composite_rules:
  - id: operator-clipboard-keyword-watch
    desc: Operator panel watches clipboard and keywords
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/clipboard/monitor::clipboard-enabled-config-field
      - id: micro-behaviors/communications/messaging/configure::telegram-bot-token-config-field
      - id: objectives/exfiltration/messaging/telegram/channel-control::bank-password-admin-keywords
      - id: micro-behaviors/communications/messaging/configure::javascript-telegram-enabled-field

  # Obfuscated clipboard polling is suspicious on its own, but clipboard
  # managers and browser utilities can legitimately do it, so keep this below
  # hostile and require both computed access and a repeat timer.
  - id: browser-obfuscated-clipboard-polling
    desc: Escaped clipboard access with change-tracked polling
    crit: suspicious
    conf: 0.93
    scope: file
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/clipboard/reference::browser-computed-clipboard-member-call
      - id: micro-behaviors/os/clipboard/monitor::browser-clipboard-state-tracking
      - id: micro-behaviors/time/schedule/interval::setInterval
      - id: metadata/lang/encoding/unicode-escape::js-four-unicode-escapes

  # Combining escaped change-tracked clipboard polling with chunk-slice
  # staging, reversed strings, and XOR expression arrays has no legitimate
  # clipboard-manager use.
  - id: browser-obfuscated-clipboard-chunk-staging
    desc: Obfuscated clipboard polling slices text into chunks
    crit: hostile
    conf: 0.96
    scope: file
    near_bytes: 4096
    all:
      - id: browser-obfuscated-clipboard-polling
      - id: micro-behaviors/data/buffer/chunk::js-slice-chunk-push
      - id: micro-behaviors/data/string/reverse::split-reverse-join-string
      - id: micro-behaviors/data/bitwise/xor-forms/scalar::js-xor-expression-array

  # Extension-only storage makes this specific to browser extensions: page
  # scripts cannot call chrome.storage. Clipboard-history managers do this
  # legitimately, so it stays notable and records what was copied, not an
  # exfiltration claim. Any send needs its own exfiltration evidence.
  - id: browser-copy-text-persisted
    desc: Browser copy handler stores copied text in extension storage
    crit: notable
    conf: 0.85
    scope: file
    all:
      - id: micro-behaviors/os/clipboard/event::browser-copy-cut-event-handler
      - id: micro-behaviors/data/db/write::chrome-storage-local-set

