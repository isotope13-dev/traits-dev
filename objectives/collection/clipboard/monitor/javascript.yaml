defaults:
  platforms: [windows, unix]
  attack: T1115
  mbc: B0014
  for:
    - javascript
composite_rules:
  # A browser extension that periodically reads clipboard text, URL-encodes
  # it, and sends it with fetch is an exfiltration workflow.  Evaluate this
  # only on parsed JavaScript; compressed package bytes are not a valid
  # evidence surface for JavaScript behavior.
  - id: browser-clipboard-http-exfil
    desc: Browser clipboard data sent over HTTP
    crit: hostile
    conf: 0.98
    attack: T1041,T1115
    # Clipboard reads in a browser UI and HTTP requests elsewhere in a bundle
    # are common.  Require the encoding and transport evidence to be in the
    # same short expression-sized window as the read; a broad file window
    # incorrectly joined ChromeShip's license-key paste handler to unrelated
    # local API requests.
    scope: file
    near_bytes: 512
    all:
      - id: micro-behaviors/os/clipboard/access::browser-clipboard-read
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
  # Obfuscated clipboard polling is suspicious on its own, but clipboard
  # managers and browser utilities can legitimately do it, so keep this below
  # hostile and require both computed access and a repeat timer.
  - id: browser-obfuscated-clipboard-polling
    desc: Obfuscated browser clipboard polling
    crit: suspicious
    conf: 0.93
    scope: file
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/clipboard/access-obfuscated::browser-computed-navigator-call
      - id: micro-behaviors/os/clipboard/access-obfuscated::browser-clipboard-state-tracking
      - id: micro-behaviors/time/schedule/interval::setInterval-reference
