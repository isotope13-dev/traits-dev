# macOS Clipboard Monitoring/Stealing
# ATT&CK: T1115 (Clipboard Data)
defaults:
  attack: T1115
  for: [macho]
  platforms: [macos]
traits:
# Placeholder for macos specific atomic traits if needed
composite_rules:
  - id: macos-clipboard-monitor
    desc: macOS clipboard monitoring
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/os/clipboard/access::macos-nspasteboard-access
      - id: micro-behaviors/os/clipboard/access::macos-pasteboard-items
      - id: micro-behaviors/os/clipboard/access::macos-pasteboard-change-count
    downgrade:
      any:
        - id: metadata/binary/vendor/
        - id: metadata/signed/platform::apple
    unless:
      - id: well-known/lib/core/sogen/
      - id: well-known/app/development/codewhale::codewhale-application-context
      - id: well-known/app/development/hammerspoon::hammerspoon-application-context
  - id: macos-clipboard-app-context-monitor
    desc: macOS clipboard monitoring with frontmost-app context
    crit: notable
    conf: 0.9
    mbc: "B0042" # System Information Discovery
    all:
      - id: micro-behaviors/ui/window/manage/enumerate::get-frontmost-application
      - id: macos-clipboard-monitor
    downgrade:
      any:
        - id: metadata/binary/vendor/
    unless:
      # First-party Apple apps (Finder, etc.) legitimately combine pasteboard
      # monitoring with frontmostApplication.
      - id: metadata/signed/platform::apple
      - id: well-known/lib/core/sogen/
      - id: well-known/app/development/codewhale::codewhale-application-context
      - id: well-known/app/development/hammerspoon::hammerspoon-application-context
