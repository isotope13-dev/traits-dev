defaults:
  platforms: [windows]
  for: [pe, dll]
  conf: 0.96
  attack: T1115

composite_rules:
  - id: dotnet-clipboard-file-tracing
    desc: Clipboard listener with content file tracing
    crit: suspicious
    all:
      - id: micro-behaviors/os/clipboard/monitor::add-clipboard-format-listener-reference
      - id: micro-behaviors/os/clipboard/monitor::copied-content-log-label
      - id: micro-behaviors/os/telemetry/logging/configure::dotnet-textwriter-trace-listener
