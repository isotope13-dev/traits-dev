defaults:
  platforms: [windows]
  for: [pe, dll]
  conf: 0.96
  attack: T1115

traits:
  - id: clipboard-copied-log-label
    desc: Log label for copied clipboard content
    crit: notable
    if:
      type: text
      regex: '(?i)clipboard[ :]+copied[ :]+|copied[ :]+clipboard[ :]+content'
      section: .text

composite_rules:
  - id: dotnet-clipboard-file-tracing
    desc: Clipboard listener with content file tracing
    crit: suspicious
    all:
      - id: micro-behaviors/os/clipboard/monitor::dotnet-add-clipboard-listener
      - id: clipboard-copied-log-label
      - id: micro-behaviors/os/telemetry/logging/configure::dotnet-textwriter-trace-listener
