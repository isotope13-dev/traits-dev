defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # Plain clipboard sharing remains neutral. Here actual CF_TEXT acquisition
  # and record copying coexist with the polling keystroke recorder; generic
  # GDI and injection API references establish neither additional source.
  - id: polling-key-recorder-clipboard-copy
    desc: Clipboard text copy alongside key recorder
    crit: hostile
    conf: 0.98
    attack: T1115
    mbc: B0047
    all:
      - id: micro-behaviors/os/clipboard/read::x86-cf-text-tagged-copy
      - id: objectives/collection/keylog/polling::native-xor-key-recording
