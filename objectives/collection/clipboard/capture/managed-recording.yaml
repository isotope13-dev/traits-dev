defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Recording context distinguishes surveillance from a paste operation.
  # This is collection evidence; the network APIs do not bind the data to a send.
  - id: managed-keylogger-clipboard-recording
    desc: Managed keylogger with clipboard recording APIs
    crit: hostile
    conf: 0.97
    attack: T1115
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: micro-behaviors/os/clipboard/reference::open-clipboard-text
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data-text
      - id: micro-behaviors/os/clipboard/reference::clipboard-data-record-prefix
      - id: micro-behaviors/fs/write/file/append::dotnet-appendalltext-token
