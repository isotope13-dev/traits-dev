defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Recording context distinguishes surveillance from a paste operation.
  # These references support collection, not successful network delivery.
  # File appends elsewhere do not prove that clipboard content reaches a file.
  - id: managed-keylogger-clipboard-recording
    desc: Managed keylogger with clipboard-read and record references
    crit: hostile
    conf: 0.97
    attack: T1115
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: micro-behaviors/os/clipboard/reference::clipboard-data-record-prefix
      - id: micro-behaviors/data/encode/base64::dotnet-to-base64string-text
    # Imported P/Invoke names suppress the text-only fallback. Both forms
    # establish the same reader; opening the clipboard alone does not.
    any:
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data-text
