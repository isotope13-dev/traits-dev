# Clipboard access granted to a browser extension across every site it can
# reach. The manifest is where this is decided: `clipboardRead` plus a
# content script that runs at `document_start` on `<all_urls>` means the
# extension sees whatever the user copies, on every page, before the page's
# own code runs.
#
# Read alone has an honest reading -- a note-taker or a paste-helper wants it.
# Read *and* write together do not: that pair is the ability to take what was
# copied and put something else in its place, which is the clipboard-hijack
# primitive (a wallet address swapped between copy and paste). The manifest
# cannot show what gets substituted, so this stops at suspicious and leaves
# the crypto-specific call to objectives/impact/crypto-manipulation/.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, xpi, zip]
  attack: T1115
  mbc: E1115

composite_rules:
  - id: extension-all-site-clipboard-substitution
    desc: Extension reads and rewrites the clipboard
    crit: suspicious
    conf: 0.92
    scope: archive
    all:
      - id: metadata/permission/clipboard::all-url-clipboard-early-content-script
      - id: metadata/permission/clipboard::permission-clipboard-write
    unless:
      - id: well-known/app/browser-extension/

  - id: extension-injected-clipboard-paste
    desc: Extension injects clipboard paste command into tab
    crit: hostile
    conf: 0.98
    for: [crx, xpi, zip, javascript, typescript]
    all:
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
      - id: micro-behaviors/os/clipboard/read::browser-execcommand-paste
    near_bytes: 512

  - id: extension-polled-clipboard-crypto-monitor
    desc: Extension polls clipboard for crypto addresses
    crit: hostile
    conf: 0.98
    for: [javascript, typescript, crx]
    all:
      - id: micro-behaviors/os/clipboard/read::browser-clipboard-read
      - id: micro-behaviors/os/clipboard/monitor::javascript-clipboard-polling
    any:
      - id: micro-behaviors/data/format/crypto-address::embedded-btc-address-regex
      - id: micro-behaviors/data/format/crypto-address::eth-address-regex

