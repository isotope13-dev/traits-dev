defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  # Independent ransom/key-recording evidence supplies attack admission.
  # These file-scoped clues describe clipboard collection code, not a bound
  # clipboard buffer-to-file or clipboard buffer-to-network flow.
  - id: managed-ransom-keylogger-clipboard-read-append
    desc: Ransom keylogger clipboard-read and append code
    crit: hostile
    conf: 0.96
    attack: T1115
    all:
      - id: objectives/exfiltration/stealer/input::managed-ransom-hook-keylog-form-post
      - id: micro-behaviors/os/clipboard/read::managed-clipboard-handle-string-read
      - id: micro-behaviors/fs/write/file/append::dotnet-appendalltext-token
