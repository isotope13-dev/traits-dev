# Clipboard collection is only hostile here when the opaque ISO also carries
# the keyboard-hook and file-output cluster of a logger.
#
# The API-name legs live in their behavioral directories (keyboard hook/poll,
# clipboard access, file open) rather than under a file-format metadata path:
# a bare "SetWindowsHookExA" run is a hook capability wherever it is found.
# The ISO context has always come from the primary-volume-descriptor leg.
defaults:
  platforms: [windows]
  for: [all]
  attack: T1115,T1056.001

composite_rules:
  - id: iso-hook-clipboard-file-collector
    desc: ISO embeds a keyboard hook with clipboard file collection
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: micro-behaviors/hardware/input/keyboard/hook::set-windows-hook-a-container-string
      - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state-container-string
      - id: micro-behaviors/os/clipboard/access::get-clipboard-data-text
      - id: micro-behaviors/fs/file/open::createfile-a-container-string
