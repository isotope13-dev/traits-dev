# Clipboard collection is only hostile here when the opaque ISO also carries
# the keyboard-hook and file-output cluster of a logger.
defaults:
  platforms: [windows]
  for: [all]
  attack: T1115,T1056.001

composite_rules:
  - id: iso-hook-clipboard-file-collector
    desc: ISO embeds a keyboard hook with clipboard file collection
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-setwindowshookexa
      - id: metadata/file/format/iso::iso-getkeystate
      - id: metadata/file/format/iso::iso-registerclipboardformata
      - id: metadata/file/format/iso::iso-getclipboarddata
      - id: metadata/file/format/iso::iso-createfilea
