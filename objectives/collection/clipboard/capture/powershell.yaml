# A PowerShell loop that watches for the copy/cut shortcut and reads the
# clipboard when it sees it. Clipboard managers do this natively through
# AddClipboardFormatListener; a script polling Ctrl+C/Ctrl+X to grab each copy
# is collecting what the user copies, not managing it.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1115,T1056.001
  mbc: E1510
composite_rules:
  - id: powershell-copy-shortcut-clipboard-capture
    desc: PowerShell grabs the clipboard on copy keys
    crit: suspicious
    conf: 0.88
    scope: file
    near_bytes: 1024
    all:
      - id: micro-behaviors/os/clipboard/read::powershell-clipboard-read
    any:
      - id: micro-behaviors/hardware/input/keyboard/poll::wpf-keyboard-is-key-down
      - id: micro-behaviors/hardware/input/keyboard/poll::forms-control-modifier-keys
      - id: micro-behaviors/hardware/input/keyboard/poll::pinvoke-async-key-state
