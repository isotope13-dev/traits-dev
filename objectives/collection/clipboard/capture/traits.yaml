defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.7
composite_rules:

  # These runtimes link clipboard, named-pipe, and process APIs for the
  # engine itself. One aggregator stays inside the suppression budget.
  - id: clipboard-loader-runtime-context
    for: [pe]
    desc: GUI or scripted runtime with clipboard, pipe, and process APIs
    crit: exception
    conf: 0.95
    any:
      - id: well-known/app/media/godot::godot-windows-runtime-context
      - id: well-known/lib/runtime/scripted/solidrt::solidrt-windows-runtime-binary
      - id: well-known/lib/ui/cef::cef-runtime-binary-context
      - id: well-known/lib/runtime/scripted/electron::chromium-engine-capability-context
      - id: well-known/lib/runtime/scripted/electron::chromium-engine-binary-context
      - id: well-known/lib/ui/sciter::sciter-api-export
      # Atomic Bun markers only. The runtime composite expands past the
      # suppression budget; a `.bun` section or the compile trailer is enough.
      - id: metadata/binary/section/name::bun-section-name
      - id: well-known/lib/runtime/scripted/bun-runtime::bun-standalone-graph-trailer

  # Clipboard polling becomes a payload-delivery primitive when the same
  # native image exposes a named-pipe server and launches a child process.
  # This is broader than any one clipper family and avoids treating a simple
  # clipboard utility as hostile.
  - id: clipboard-monitored-command-loader
    for: [pe]
    desc: Clipboard monitor feeds a named-pipe command loader
    crit: hostile
    conf: 0.97
    attack: T1115,T1059.003,T1105
    all:
      - id: micro-behaviors/os/clipboard/monitor::windows-clipboard-read-monitor-api-set
      - id: micro-behaviors/communications/ipc/named-pipe::named-pipe-server
      - id: micro-behaviors/process/create/spawn::create-process-w
    unless:
      - id: metadata/signed/platform/
      # AI developer assistants and coding agents interact with the clipboard for
      # clipboard assistance / paste and spawn processes / run child commands.
      - id: well-known/app/ai/
      - id: well-known/dual-use/transfer/winscp/
      - id: clipboard-loader-runtime-context

  - id: irc-browser-clipboard-trojan
    for: [pe]
    desc: IRC bot targets browsers and clipboard
    crit: hostile
    conf: 0.98
    attack: T1071.001,T1115,T1555.003
    all:
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data
      - id: micro-behaviors/process/info/name::multi-browser-process-name-roster
      - id: micro-behaviors/communications/irc/command::pe-irc-protocol
