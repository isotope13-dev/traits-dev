defaults:
  for: [macho]
  platforms: [macos]
composite_rules:
  - id: reverse-shell-agent-pasteboard-read
    desc: Interactive reverse-shell agent also references pasteboard text reads
    crit: hostile
    conf: 0.98
    attack: T1115
    # Co-occurrence establishes clipboard acquisition in a hostile agent;
    # it does not by itself establish a clipboard-to-network data flow.
    all:
      - id: objectives/command-and-control/reverse-shell/fd-redirect::xor-zsh-socket-stdio-relay
      - id: micro-behaviors/os/clipboard/reference::macos-general-pasteboard
      - id: micro-behaviors/os/clipboard/read::macos-pasteboard-string-read-selector
