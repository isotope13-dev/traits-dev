defaults:
  platforms: [unix, windows, macos]
  for: [java, class]
  attack: T1115
  mbc: B0014
composite_rules:
  - id: java-clipboard-capture
    desc: Java captures clipboard text
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/os/clipboard/access::java-clipboard-text-read
    any:
      - id: micro-behaviors/os/clipboard/access::clipboard-keyword
      - id: objectives/credential-access/files/config::clipboard-read-command
    unless:
      # Grouped carve-outs, each one semantic: test fixtures exercising the
      # capture API, and known libraries/applications whose clipboard use is
      # product behavior (diagram editors, core utility libraries, creative-
      # coding IDEs).
      - id: metadata/package/testing/
      - id: well-known/app/media/plantuml/
      - id: well-known/lib/core/hutool/
      - id: well-known/app/development/processing/
      # jEdit-syntax text-editor component inside a bundled IDE/simulator
      # (Exercism MIPS track's MARS): paste support reads the clipboard and
      # copy support writes it; the read+write pair is user-directed
      # copy/paste, not covert capture.
      - id: java-copy-paste-clipboard-pair

  # Benign context: a class that reads AND writes the clipboard is doing
  # user-directed copy/paste (every Java text editor, including the jEdit
  # syntax area embedded in MARS). Covert capture records clipboard contents
  # without a matching user-directed write path.
  - id: java-copy-paste-clipboard-pair
    desc: Clipboard read and write pair for copy/paste
    crit: exception
    conf: 0.9
    all:
      - id: micro-behaviors/os/clipboard/access::java-clipboard-text-read
      - id: micro-behaviors/os/clipboard/write::java-clipboard-text-write
