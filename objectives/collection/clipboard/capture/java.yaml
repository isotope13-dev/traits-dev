defaults:
  platforms: [unix, windows]
  for: [java, class]
  attack: T1115
  mbc: B0014
traits:
  - id: java-clipboard-task-dispatch
    desc: Sends remote clipboard request
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'clipboard:'

  - id: java-clipboard-response-display
    desc: Displays returned clipboard text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'setText\s*\(\s*response\s*\.\s*replace\s*\('

composite_rules:
  # getContents plus a stringFlavor name does not extract text. Require
  # actual Transferable data access and a file-output operation/reference.
  # This is a suspicious co-occurrence, not proof of a bound recording flow.
  - id: java-clipboard-capture
    desc: Clipboard data and file-output APIs cooccur
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/os/clipboard/read::java-clipboard-text-flavor-context
      - id: micro-behaviors/os/clipboard/read::java-transferable-data-read
    any:
      - id: micro-behaviors/fs/write/file/handle::jvm-filewriter-write-bytecode
      - id: micro-behaviors/fs/write/file/handle::java-filewriter-source
    unless:
      - id: metadata/package/testing/
      - id: well-known/app/media/plantuml/
      - id: well-known/lib/media/lwjgl/
      - id: well-known/lib/stdlib/hutool/
      - id: well-known/tool/development/toolchain/processing/
      - id: java-copy-paste-clipboard-pair
      - id: java-swing-paste-menu-component
      - id: java-swing-text-paste-action
      - id: metadata/path::test-directory-component
  - id: java-clipboard-collection-operator
    desc: Receives and copies remote clipboard text
    crit: suspicious
    conf: 0.96
    all:
      - id: java-clipboard-task-dispatch
      - id: java-clipboard-response-display
      - id: micro-behaviors/os/clipboard/write::java-clipboard-set-contents

  # Benign context: a class that reads AND writes the clipboard is doing
  # user-directed copy/paste (every Java text editor, including the jEdit
  # syntax area embedded in MARS). Covert capture records clipboard contents
  # without a matching user-directed write path.
  - id: java-copy-paste-clipboard-pair
    desc: Clipboard read and write pair for copy/paste
    crit: exception
    conf: 0.9
    all:
      - id: micro-behaviors/os/clipboard/read::java-clipboard-text-flavor-context
      - id: micro-behaviors/os/clipboard/write::java-clipboard-text-write

  # Benign context: a Swing component with its own popup menu and a Paste
  # entry reads the clipboard because the user chose Paste; NetBeans' profiler
  # HTMLTextArea is one. Capture code has no menu for the user to pick from.
  - id: java-swing-paste-menu-component
    desc: Swing component with paste menu reading clipboard
    crit: exception
    conf: 0.9
    all:
      - id: micro-behaviors/os/clipboard/read::java-clipboard-text-flavor-context
      - id: micro-behaviors/os/clipboard/reference::java-swing-popup-menu-reference
      - id: micro-behaviors/os/clipboard/reference::java-paste-menu-label

  # Swing's Paste action may read the system clipboard from isEnabled() to
  # decide whether the menu item is available. Its handler then delegates to
  # JTextComponent.paste() after the user selects that action.
  - id: java-swing-text-paste-action
    desc: Swing text component paste action reads clipboard for availability
    crit: exception
    conf: 0.94
    all:
      - id: micro-behaviors/os/clipboard/read::java-clipboard-text-flavor-context
      - id: micro-behaviors/os/clipboard/reference::java-text-component-reference
      - id: micro-behaviors/os/clipboard/reference::java-paste-token-reference
