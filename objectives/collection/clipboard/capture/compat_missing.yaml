defaults:
  for: [pe, macho, python, javascript, powershell, shell]
  platforms: [windows, linux, macos]
composite_rules:
- id: clipboard-session-transfer
  desc: Clipboard read or write transfer behavior
  crit: notable
  conf: 0.88
  all:
  - id: micro-behaviors/os/clipboard/reference::clipboard-marker
  any:
  - id: micro-behaviors/os/clipboard/read::get-clipboard-data
  - id: micro-behaviors/os/clipboard/write::set-clipboard-data
  - id: objectives/impact/crypto-manipulation/clipboard::replace-wallet-address
  unless:
  - id: micro-behaviors/os/module/load::uninstall-exe-basename
  - id: well-known/tool/reverse-engineering/armnf::marker
  - id: objectives/collection/keylog/capture::p-user-proxy-dll
  downgrade:
    any:
    - id: metadata/package/versioning/scheme::pe-version-resource
    - id: metadata/signed/developer/
    - id: metadata/binary/symbols/count::many-imports
    - id: metadata/lang/compiler/managed/
