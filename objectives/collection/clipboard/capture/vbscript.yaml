defaults:
  platforms:
    - windows
    - unix
  crit: notable
  conf: 1.0
  for:
    - vbs
traits:
  - id: inline__vbs-clipboard-loop__any_1
    desc: VBScript clipboard polling loop
    if:
      type: text
      regex: '(?is)\bDo\b.{0,120}\b(Clipboard|GetClipboardData|ClipboardData)\b.{0,120}\bLoop\b'
  - id: inline__vbs-clipboard-loop__any_2
    desc: VBScript clipboard polling loop
    if:
      type: text
      regex: \bWhile\b.{0,30}\bTrue\b.{0,30}Clipboard
  - id: inline__vbs-clipboard-loop__any_3
    desc: VBScript clipboard polling loop
    if:
      type: text
      regex: Clipboard.{0,30}sleep
  # Generators emit the loop as separate WriteLine strings, so Do and Loop
  # sit farther apart than the polling regex above allows. The HTMLFile
  # clipboard read and the echo-to-clip replacement are still adjacent.
  - id: vbs-htmlfile-clipboard-read
    desc: VBScript reads the clipboard via HTMLFile
    if:
      type: text
      regex: 'HTMLFile[\s\S]{0,80}ClipboardData|ClipboardData\.GetData'
  - id: vbs-echo-pipe-clip
    desc: VBScript replaces the clipboard with echo
    if:
      type: text
      regex: 'echo [\s\S]{0,80}\| clip'
composite_rules:
  - id: vbs-htmlfile-clipboard-clipper
    desc: VBScript swaps clipboard crypto addresses
    crit: hostile
    conf: 0.97
    for: [vbs, scripts]
    attack: T1115
    all:
      - id: vbs-htmlfile-clipboard-read
      - id: vbs-echo-pipe-clip
      - id: micro-behaviors/data/format/crypto-address::hardcoded-btc-addr
