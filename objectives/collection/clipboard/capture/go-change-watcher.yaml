defaults:
  for: [go]
  platforms: [windows]
traits:
  - id: go-clipboard-change-watcher
    desc: Monitors and returns clipboard text changes
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule go_clipboard_change_watcher {
          strings:
            $watch = "func Watch(ctx context.Context, pollInterval time.Duration) <-chan string"
            $sequence = "procGetClipboardSequenceNumber.Call()"
            $timer = "time.NewTicker(pollInterval)"
            $read = "text, err := ReadText()"
            $send = "case ch <- text:"
          condition:
            all of them
        }
