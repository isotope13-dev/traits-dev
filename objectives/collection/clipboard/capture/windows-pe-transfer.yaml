defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1056.001

traits:
  - id: encoded-clipboard-monitoring
    desc: Encoded payload contains clipboard monitoring
    crit: suspicious
    conf: 0.94
    for: [data]
    if:
      type: encoded
      encoding: base64
      regex: '(?is)\bclipboard\b.{0,180}\b(monitor|capture|watch|record)'

composite_rules:
# clipboard-session-transfer (objectives/collection/clipboard/capture) is
# explicitly for: [shell, python, javascript, powershell] -- its own `all:`
# leg, clipboard-marker, is in turn scoped to that file's script-only
# default even though clipboard-marker's own clipboard-keyword member
# supports pe. Re-pool the pe/dll-compatible primitives directly instead of
# widening either external composite's own type list.
- id: pe-clipboard-transfer
  desc: Clipboard read or write transfer behavior
  crit: notable
  conf: 0.88
  all:
  - id: micro-behaviors/os/clipboard/reference::clipboard-keyword
  any:
  - id: micro-behaviors/os/clipboard/read::get-clipboard-data
  - id: micro-behaviors/os/clipboard/write::set-clipboard-data
- id: windows-browser-clipboard-stealer
  desc: Browser local storage and clipboard stealer
  crit: suspicious
  conf: 0.95
  for: [dll]
  all:
  - id: objectives/discovery/host/browser/identity::local-storage
  - id: pe-clipboard-transfer
  needs: 2
  any:
  - id: micro-behaviors/fs/config/system::ini-read-write-cycle
  - id: metadata/binary/section/permission::multiple-random-zero-perm-sections
  - id: objectives/anti-static/obfuscation/string/junking::chromium-proxy-source-path
  - id: objectives/evasion/masquerade/versioninfo::networked-fake-version-resource
  unless:
  - id: metadata/binary/vendor/
  - id: metadata/signed/platform/
