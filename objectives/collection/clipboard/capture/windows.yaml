defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1115
  mbc: B0047

composite_rules:
- id: clipboard-runtime-known-benign-context
  desc: Recognized GUI runtime or clipboard library
  crit: exception
  conf: 0.95
  any:
  - id: well-known/lib/platform/wine/
  - id: well-known/app/utility/
  - id: well-known/game/pvzlauncher::plants-vs-zombies-steam-target
  - id: well-known/lib/media/sdl/
  - id: well-known/app/infrastructure/
  - id: well-known/app/browser-extension/
  - id: well-known/app/system/
  - id: well-known/app/productivity/wetype/
  - id: well-known/app/productivity/eqnedit64/
  - id: well-known/lib/platform/clipboard-rs::clipboard-rs-listener-constructor
  # Godot game engine exposes clipboard read/write APIs as part of its windowing/GUI runtime.
  - id: well-known/app/media/godot::godot-native-runtime
  # Bun implements navigator.clipboard in the runtime, so every
  # `bun build --compile` binary imports GetClipboardData and
  # GetClipboardSequenceNumber whether the bundled app watches the clipboard
  # or merely copies text into it. hunk.exe (Bun 1.3.14, a terminal diff
  # viewer whose copy-to-clipboard button is ordinary app behavior) carries
  # both imports with no change-notification consumer.
  - id: well-known/lib/runtime/scripted/bun-runtime::bun-windows-runtime-binary
  # Desktop applications below were carve-outs of
  # windows-clipboard-capture-with-user-monitoring only.
  # mpv's Windows media-player UI exposes clipboard and input APIs as part of
  # normal playback/control functionality; it is not a clipboard collector.
  - id: well-known/app/media/mpv::windows-build-provenance
  # Chromium's recognized binary basenames and Electron's integration symbol.
  - id: well-known/lib/runtime/scripted/electron::chromium-engine-binary-basename
  - id: well-known/lib/runtime/scripted/electron::electron-node-symbol
  # The ConPTY console host Windows Terminal ships -- vendored by node-pty as
  # `OpenConsole.exe` -- is Microsoft's own console implementation.
  - id: metadata/signed/certificate/subject::microsoft-corp-marker-cert
  # Anthropic's Claude Code native helper reads the clipboard for paste
  # support; product, publisher and member-path markers identify the binary.
  - id: well-known/app/ai/coding-agent/anthropic-claude-code::native-windows-package-context
  # GitHub Copilot Computer Use desktop automation helper
  - id: well-known/app/ai/coding-agent/github-copilot-runtime::copilot-computer-use-binary-context
  # The verified TightVNC Viewer is a remote-control client: clipboard
  # monitoring supports its actual remote desktop session.
  - id: well-known/dual-use/remote-admin/tightvnc::tightvnc-viewer-verified-identity
# Slim twin of the exception above, minus the scripted-runtime and
# desktop-application carve-outs.
# Surveillance-grade rules (keyboard AND screen AND clipboard) additionally
# require hook/screenshot legs that a scripted runtime's import surface
# cannot satisfy on its own, so they do not need the Bun leg -- and they
# cannot afford it either: sharing the full 12-leaf exception pushes
# windows-clipboard-screen-hook-surveillance past the suppression budget.
# Keep the two members in sync when adding non-scripted contexts.
- id: clipboard-screen-hook-native-runtime-context
  desc: Recognized OS GUI runtime or clipboard library
  crit: exception
  conf: 0.95
  any:
  - id: well-known/lib/platform/wine/
  - id: well-known/app/utility/
  - id: well-known/game/pvzlauncher::plants-vs-zombies-steam-target
  - id: well-known/lib/media/sdl/
  - id: well-known/app/infrastructure/
  - id: well-known/app/browser-extension/
  - id: well-known/app/system/
  - id: well-known/app/productivity/wetype/
  - id: well-known/lib/platform/clipboard-rs::clipboard-rs-listener-constructor
# `RegisterClipboardFormat` was the second `all:` leg and is not monitoring at
# all -- it registers a custom format NAME, which is what any program that puts
# its own data type on the clipboard does. Watching the clipboard means asking
# to be told when it changes: `AddClipboardFormatListener`, or polling
# `GetClipboardSequenceNumber`. Those now carry the monitoring half.
#
# The `any:` legs were directory references wide enough to be satisfied by the
# clipboard access itself: `objectives/collection/clipboard/monitor/` includes
# a `component` that matches the substring "WndProc" (in every Windows GUI
# binary), and `objectives/credential-access/` includes `clipboard/crypto::
# clipboard-rw`, which is a clipboard read plus a clipboard write. IObit
# Unlocker and filename-lister's `flister.exe` are ordinary GUI tools that copy
# a path to the clipboard; nothing in either watches it.
- id: windows-clipboard-capture-with-user-monitoring
  desc: Clipboard read with monitoring or theft context
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/os/clipboard/read::get-clipboard-data
  any:
  - id: micro-behaviors/os/clipboard/monitor::clipboard-sequence-number
  - id: micro-behaviors/os/clipboard/monitor::dotnet-add-clipboard-listener
  # Named directly rather than as a directory reference: the directory also
  # holds `windows-surveillance-known-benign-context`, a `crit: exception` composite
  # meant to be consumed only from unless:/downgrade: elsewhere in its own
  # file. `surv-keylog-present` is the actual keylog-capability atom (and
  # already carries its own well-known/lib/media/ffmpeg exclusion, so a large
  # media binary's unrelated GDI/input surface doesn't pair with clipboard
  # access here either).
  - id: objectives/collection/keylog/capture::surv-keylog-present
  - id: objectives/exfiltration/stealer/input::browser-clipboard-http-exfil
  - id: objectives/exfiltration/stealer/input::js-clipboard-exfil
  - id: objectives/exfiltration/stealer/input::js-clipboard-exfil-external-ip
  - id: objectives/exfiltration/stealer/input::python-clipboard-exfil
  unless:
  # A compiled AutoIt script carries the whole AutoIt runtime, and that runtime
  # is a Windows automation library: clipboard read/write, keyboard and mouse
  # state polling, window enumeration, host and locale queries, and temp-file
  # extraction of its own embedded script. Every compiled .au3 therefore shows
  # the full API surface regardless of what the script does -- Closure
  # Library's CI helper is 30 lines that close a dialog box.
  - id: metadata/lang/compiled::autoit-compiled-script
  # Recognized GUI runtimes, clipboard libraries and desktop applications
  # carry these APIs as part of their public feature surface, whether or not
  # a consumer starts a watch.
  - id: clipboard-runtime-known-benign-context
  # FFmpeg statically links a broad USER32 surface (its gdigrab/vfwcap
  # screen- and video-capture input devices touch the same GDI/clipboard
  # bitmap-transfer family), so its Windows builds import the full clipboard
  # API including GetClipboardSequenceNumber. A batch CLI transcoder with no
  # message loop or background persistence isn't watching the clipboard for
  # typed secrets.
  - id: well-known/lib/media/ffmpeg::ffmpeg-lib-marker
  # Stripped player builds trip no lib marker; basename plus fftools paths
  # identifies the same vendor code.
  - id: well-known/lib/media/ffmpeg::ffmpeg-player-binary-context
  - id: well-known/tool/sysadmin/autohotkey/
- id: windows-clipboard-screen-hook-surveillance
  desc: Windows clipboard access with keyboard and screen capture
  crit: suspicious
  conf: 0.95
  attack: "T1113,T1115,T1056.001"
  mbc: "B0047,B0015"
  scope: leaf
  all:
  - id: micro-behaviors/os/clipboard/read::get-clipboard-data
  # Generic hook lifecycles also cover WH_GETMESSAGE and mouse hooks used
  # by GUI runtimes; require an actual keyboard hook type here.
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  any:
  - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
  - id: micro-behaviors/hardware/display/screen::gdi-bitmap-transfer-primitives
  - id: micro-behaviors/hardware/display/screen::gdi-dib-bitmap-transfer-primitives
  - id: objectives/collection/screenshot::gdi-window-capture
  unless:
  # The native twin, not the full benign-runtime-context: the Bun leg lives
  # only in the latter (see above), and sharing it would push this rule past
  # the suppression budget for a carve-out it cannot need -- Bun's import
  # surface supplies no keyboard hook or screenshot primitive.
  - id: clipboard-screen-hook-native-runtime-context
  # Microsoft-signed Windows Terminal/ConPTY hosts legitimately use these
  # APIs for terminal input, rendering, and clipboard integration.
  - id: metadata/signed/platform::microsoft
  # Installer runtimes built on the Delphi VCL (Inno Setup's Setup.exe and
  # unins000.exe above all) link GetClipboardData/SetClipboardData
  # (Vcl.Clipbrd), the SetWindowsHookEx/CallNextHookEx/UnhookWindowsHookEx
  # trio (Vcl.Forms modal loop) and BitBlt/GetDIBits/CreateDIBSection
  # (Vcl.Graphics) into every build regardless of what the script does, so
  # stock installers and uninstallers matched on framework imports alone.
  - id: metadata/binary/installer/family::inno-delphi-installer-foundation
  - id: well-known/tool/sysadmin/sandboxie::sandboxie-known-signed-context
- id: windows-clipboard-screen-hook-injection
  desc: Windows surveillance APIs combined with remote-process injection
  crit: hostile
  conf: 0.99
  attack: "T1113,T1115,T1056.001,T1055"
  mbc: "B0047,B0015,B0033"
  all:
  - id: windows-clipboard-screen-hook-surveillance
  - id: micro-behaviors/process/inject/runtime/call::remote-alloc-write-thread-api-set
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family::inno-delphi-installer-foundation
  - id: well-known/tool/reverse-engineering/
  - id: well-known/app/
  - id: well-known/lib/
- id: windows-clipboard-screen-keyboard-collector
  desc: Windows clipboard and screen collection with keyboard polling
  crit: hostile
  conf: 0.98
  attack: "T1113,T1115,T1056.001"
  mbc: "B0047,B0015"
  for: [iso, pe, dll]
  all:
  - id: windows-clipboard-screen-hook-surveillance
  - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state
  - id: micro-behaviors/hardware/input/keyboard/layout::map-virtual-key
  unless:
  - id: objectives/collection/keylog/capture::windows-hook-keyboard-state-exception
  - id: metadata/binary/installer/script::inno-setup-installer-data
  - id: well-known/game/pvzlauncher::plants-vs-zombies-steam-target
  - id: well-known/app/browser-extension/
- id: windows-clipboard-screen-polling-surveillance
  desc: Windows clipboard and screen collection with polling key capture
  crit: hostile
  conf: 0.99
  attack: "T1113,T1115,T1056.001"
  mbc: "B0047,B0015"
  all:
  - id: micro-behaviors/os/clipboard/read::get-clipboard-data
  - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
  - id: micro-behaviors/hardware/input/keyboard/poll::polling-keylogger-api-cluster
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: windows-surveillance-network-exfil
  desc: Windows input, screen, and clipboard surveillance with network exfiltration
  crit: hostile
  conf: 0.97
  attack: "T1113,T1115,T1041"
  all:
  - id: windows-clipboard-screen-hook-surveillance
  any:
  - id: micro-behaviors/communications/http/post/
  - id: micro-behaviors/communications/http/upload/
  - id: micro-behaviors/communications/socket/init::wsa-send
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
  - id: metadata/binary/installer/family::inno-delphi-installer-foundation
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: packed-clipboard-keylogger-surveillance
  desc: Packed binary combines clipboard, screen, and keyboard surveillance
  crit: hostile
  conf: 0.98
  attack: "T1115,T1113,T1056.001,T1027"
  all:
  - id: windows-clipboard-screen-hook-surveillance
  - id: micro-behaviors/hardware/input/keyboard/poll::polling-keylogger-api-cluster
  any:
  - id: objectives/anti-static/pack/detect::upx-marker
  - id: metadata/hardening/memory::extreme-wx-section-count-10
  - id: metadata/binary/section/layout::large-low-entropy-rwx-section
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app/media/stationplaylist::track-tool-identity
  - id: well-known/app/productivity/comfort-software::comfort-clipboard-family
  - id: well-known/tool/reverse-engineering/
- id: clipboard-capture-recognized-marker
  desc: Recognized marker for Windows clipboard capture
  crit: notable
  conf: 0.9
  any:
  - id: metadata/signed/platform::microsoft
  - id: metadata/binary/vendor::microsoft-corp-marker
  - id: metadata/binary/vendor::benign-unsigned-microsoft-import-heavy-context
  - id: well-known/app/browser/internet-explorer::internet-explorer-frame-component
  - id: well-known/tool/reverse-engineering/
  - id: well-known/tool/sysadmin/sandboxie::sandboxie-component
  - id: well-known/lib/media/sdl::sdl-runtime-component
  - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
  - id: well-known/tool/sysadmin/conemu::conemu-setup-signature
  - id: well-known/tool/sysadmin/winrar::winrar-component
  - id: well-known/tool/sysadmin/atuin::atuin-binary
  - id: metadata/file/string/application-name::tool-identity-notepadplusplus
# Unicode clipboard reads are a neutral capability, already represented by
# micro-behaviors/os/clipboard/read::win32-unicode-clipboard-read. A Rust
# Clipboard identifier adds no evidence of surveillance or unauthorized capture.
- id: clipboard-stealer-with-c2
  desc: Clipboard stealer with C2 endpoints
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/os/clipboard/reference::open-clipboard
  - id: micro-behaviors/os/clipboard/read::get-clipboard-data
  any:
  - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-rsrc-pair
  - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-pe
  needs: 1

# Unsigned RATs that read the clipboard, capture bitmaps, and POST uploads
# through a runtime-resolved WinHTTP table (screenshot.bmp / X-Filename).
- id: clipboard-bitmap-winhttp-exfil
  desc: Clipboard and bitmap capture with WinHTTP upload exfil
  crit: hostile
  conf: 0.98
  attack: "T1115,T1113,T1041"
  mbc: "B0047,B0015"
  all:
  - id: micro-behaviors/os/clipboard/read::get-clipboard-data
  - id: micro-behaviors/hardware/display/screen::gdi-bitmap-transfer-primitives
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-api-table
  - id: micro-behaviors/communications/http/header/custom::pe-filename-header
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
