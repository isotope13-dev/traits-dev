defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1115
  mbc: B0047

composite_rules:
- id: clipboard-screen-hook-benign-runtime-context
  desc: GUI runtime with built-in clipboard, screen, and hook support
  crit: exception
  conf: 0.95
  any:
  - id: well-known/lib/platform/wine/
  - id: well-known/app/utility/
  - id: well-known/game/pvzlauncher::plants-vs-zombies-steam-target
  - id: well-known/lib/media/sdl/
  - id: well-known/app/infrastructure/
  - id: well-known/app/browser-extension/
  - id: well-known/app/system/
  - id: well-known/app/productivity/wetype/
# `RegisterClipboardFormat` was the second `all:` leg and is not monitoring at
# all -- it registers a custom format NAME, which is what any program that puts
# its own data type on the clipboard does. Watching the clipboard means asking
# to be told when it changes: `AddClipboardFormatListener`, or polling
# `GetClipboardSequenceNumber`. Those now carry the monitoring half.
#
# The `any:` legs were directory references wide enough to be satisfied by the
# clipboard access itself: `objectives/collection/clipboard/monitor/` includes
# a `component` that matches the substring "WndProc" (in every Windows GUI
# binary), and `objectives/credential-access/` includes `clipboard/crypto::
# clipboard-rw`, which is a clipboard read plus a clipboard write. IObit
# Unlocker and filename-lister's `flister.exe` are ordinary GUI tools that copy
# a path to the clipboard; nothing in either watches it.
- id: windows-clipboard-capture-with-user-monitoring
  desc: Clipboard read with change-notification watch
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/os/clipboard/access::get-clipboard-data
  any:
  - id: micro-behaviors/os/clipboard/access::clipboard-sequence-number
  - id: micro-behaviors/os/clipboard/access::dotnet-add-clipboard-listener
  - id: objectives/collection/keylog/capture/
  - id: objectives/exfiltration/stealer/credential/clipboard/
  unless:
  # Wine's user32/ole32 implement the clipboard API itself, and CEF is the
  # same Chromium clipboard path as Electron above.
  - id: well-known/lib/platform/wine::wine-builtin-dll-marker
  - id: well-known/lib/runtime/electron::cef-engine-binary-basename
  # `clipboard-capture-recognized-marker` below collects the GUI runtimes whose
  # job includes the clipboard, but referencing it expands past the suppression
  # budget, so the two that matter here are named directly: Chromium/Electron
  # registers a clipboard-change listener for its renderers (Notion.exe), and
  # SDL exposes clipboard change tracking as public API (mednafen's SDL2.dll).
  - id: well-known/lib/runtime/electron::electron-node-symbol
  - id: well-known/lib/media/sdl::sdl-runtime-component
  # Plain Chromium carries the same clipboard-change listener without any
  # Electron marker (ChromiumPortable's `chrome.dll`), and the ConPTY console
  # host Windows Terminal ships -- vendored by node-pty as `OpenConsole.exe` --
  # is Microsoft's own console implementation.
  - id: well-known/lib/runtime/electron::chrome-engine-binary-basename
  - id: metadata/binary/vendor::microsoft-corp-marker-cert
- id: windows-clipboard-screen-hook-surveillance
  desc: Windows clipboard access with keyboard and screen capture
  crit: suspicious
  conf: 0.95
  attack: "T1113,T1115,T1056.001"
  mbc: "B0047,B0015"
  scope: leaf
  all:
  - id: micro-behaviors/os/clipboard/access::get-clipboard-data
  # Generic hook lifecycles also cover WH_GETMESSAGE and mouse hooks used
  # by GUI runtimes; require an actual keyboard hook type here.
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  any:
  - id: micro-behaviors/hardware/display/screen::gdi-screen-capture-primitives
  - id: micro-behaviors/hardware/display/screen::gdi-bitmap-transfer-primitives
  - id: micro-behaviors/hardware/display/screen::gdi-dib-bitmap-transfer-primitives
  - id: objectives/collection/screenshot/capture::gdi-window-capture
  unless:
  - id: clipboard-screen-hook-benign-runtime-context
  # Microsoft-signed Windows Terminal/ConPTY hosts legitimately use these
  # APIs for terminal input, rendering, and clipboard integration.
  - id: metadata/signed/platform::microsoft
  # Installer runtimes built on the Delphi VCL (Inno Setup's Setup.exe and
  # unins000.exe above all) link GetClipboardData/SetClipboardData
  # (Vcl.Clipbrd), the SetWindowsHookEx/CallNextHookEx/UnhookWindowsHookEx
  # trio (Vcl.Forms modal loop) and BitBlt/GetDIBits/CreateDIBSection
  # (Vcl.Graphics) into every build regardless of what the script does, so
  # stock installers and uninstallers matched on framework imports alone.
  - id: metadata/binary/installer/family::inno-delphi-installer-foundation
  - id: well-known/tool/sysadmin/sandboxie::sandboxie-known-signed-context
- id: windows-clipboard-screen-hook-injection
  desc: Windows surveillance APIs combined with remote-process injection
  crit: hostile
  conf: 0.99
  attack: "T1113,T1115,T1056.001,T1055"
  mbc: "B0047,B0015,B0033"
  all:
  - id: windows-clipboard-screen-hook-surveillance
  - id: objectives/evasion/process/injection/memory::remote-thread-injection-api-chain
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family::inno-delphi-installer-foundation
  - id: well-known/tool/reverse-engineering/
  - id: well-known/app/
  - id: well-known/lib/
- id: windows-clipboard-screen-keyboard-collector
  desc: Windows clipboard and screen collection with keyboard polling
  crit: hostile
  conf: 0.98
  attack: "T1113,T1115,T1056.001"
  mbc: "B0047,B0015"
  for: [iso, pe, dll]
  all:
  - id: windows-clipboard-screen-hook-surveillance
  - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state
  - id: micro-behaviors/hardware/input/keyboard/hook::map-virtual-key
  unless:
  - id: objectives/collection/keylog/capture::windows-hook-keyboard-state-exception
  - id: metadata/binary/installer/script::inno-setup-installer-data
  - id: well-known/game/pvzlauncher::plants-vs-zombies-steam-target
  - id: well-known/app/browser-extension/
- id: windows-clipboard-screen-polling-surveillance
  desc: Windows clipboard and screen collection with polling key capture
  crit: hostile
  conf: 0.99
  attack: "T1113,T1115,T1056.001"
  mbc: "B0047,B0015"
  all:
  - id: micro-behaviors/os/clipboard/access::get-clipboard-data
  - id: micro-behaviors/hardware/display/screen::gdi-screen-capture-primitives
  - id: micro-behaviors/hardware/input/keyboard/poll::polling-keylogger-api-cluster
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: windows-surveillance-network-exfil
  desc: Windows input, screen, and clipboard surveillance with network exfiltration
  crit: hostile
  conf: 0.97
  attack: "T1113,T1115,T1041"
  all:
  - id: windows-clipboard-screen-hook-surveillance
  any:
  - id: micro-behaviors/communications/http/post/
  - id: micro-behaviors/communications/http/upload/
  - id: micro-behaviors/communications/socket/init::wsa-send
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
  - id: metadata/binary/installer/family::inno-delphi-installer-foundation
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: packed-clipboard-keylogger-surveillance
  desc: Packed binary combines clipboard, screen, and keyboard surveillance
  crit: hostile
  conf: 0.98
  attack: "T1115,T1113,T1056.001,T1027"
  all:
  - id: windows-clipboard-screen-hook-surveillance
  - id: micro-behaviors/hardware/input/keyboard/poll::polling-keylogger-api-cluster
  any:
  - id: objectives/anti-static/pack/detect::upx-marker
  - id: metadata/hardening/memory::extreme-wx-section-count-10
  - id: metadata/binary/section/metrics::large-low-entropy-rwx-section
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app/media/stationplaylist::track-tool-identity
  - id: well-known/app/productivity/comfort-software::comfort-clipboard-family
  - id: well-known/tool/reverse-engineering/
- id: clipboard-capture-recognized-marker
  desc: Recognized marker for Windows clipboard capture
  crit: notable
  conf: 0.9
  any:
  - id: metadata/signed/platform::microsoft
  - id: metadata/binary/vendor::microsoft-corp-marker
  - id: metadata/binary/vendor::benign-unsigned-microsoft-import-heavy-context
  - id: well-known/app/browser/internet-explorer::internet-explorer-frame-component
  - id: well-known/tool/reverse-engineering/
  - id: well-known/tool/sysadmin/sandboxie::sandboxie-component
  - id: well-known/lib/media/sdl::sdl-runtime-component
  - id: well-known/lib/runtime/electron::electron-chromium-runtime-strong
