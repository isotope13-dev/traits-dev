defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1115
  mbc: B0047

composite_rules:
- id: string-resolved-clipboard-clipper
  desc: Clipboard hijacker with dynamically resolved imports
  # EmptyClipboard + GetClipboardData + SetClipboardData is the clipper
  # sequence: read the victim clipboard, clear it, plant attacker content
  # (classically a swapped cryptocurrency address). Every API arrives as a
  # bare string because the import table is hidden (packed or dynamically
  # resolved via GetProcAddress); ordinary clipboard users import these APIs,
  # so the *-text atoms (which fire only where the import does not) keep them
  # out. A keylogging or hook context leg is required so a lone clipboard
  # helper cannot satisfy the rule.
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/os/clipboard/read::get-clipboard-data-text
  - id: micro-behaviors/os/clipboard/write::set-clipboard-data-text
  - id: micro-behaviors/os/clipboard/write::empty-clipboard-text
  - id: micro-behaviors/os/api-resolution/dynamic::get-proc-address-resolved-name
  any:
  - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state-str
  - id: micro-behaviors/ui/window/hook::windows-hook-install
  needs: 1
  unless:
  - id: well-known/tool/reverse-engineering/
  - id: well-known/tool/sysadmin/
  - id: well-known/lib/
  - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-remote-control-client-context
  # A .winmd declares the clipboard APIs as metadata signatures for a
  # whole SDK; it reads and writes no clipboard.
  - id: metadata/build/generated::winmd-metadata
