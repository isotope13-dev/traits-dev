# Covert microphone capture encoded with libmp3lame and POSTed to a C2 path.
# Class covered by Still Audio: speech VAD → MP3 via embedded lame → HTTP POST.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, python, pe, dll]
  attack: T1123,T1041

composite_rules:
  - id: lame-mp3-microphone-capture
    desc: libmp3lame encodes captured microphone audio
    crit: suspicious
    conf: 0.95
    attack: T1123
    all:
      - id: micro-behaviors/data/format/media/audio::libmp3lame-dll-name
    any:
      - id: micro-behaviors/hardware/input/audio::waveinopen-api-name
      - id: micro-behaviors/hardware/input/audio::go-wasapi-microphone-capture
      - id: micro-behaviors/hardware/input/audio::python-microphone-capture
      - id: micro-behaviors/hardware/input/audio::rust-cpal-audio-recording
