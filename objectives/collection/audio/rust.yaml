defaults:
  attack: T1123
  platforms: [windows, unix]
  for: [rust]

composite_rules:
  - id: rust-random-temp-wav-recording
    desc: Rust randomized temp WAV recording
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/input/audio::rust-cpal-audio-recording
      - id: micro-behaviors/fs/path/temp::rust-temp-dir
      - id: micro-behaviors/fs/path/media::wav-filename-template
    any:
      - id: micro-behaviors/os/random/generator::rust-random-name-reference
      - id: micro-behaviors/data/format/media/audio::hound-wav-writer
  - id: rust-covert-timed-mic-wav
    desc: Timed mic capture to randomized temp WAV
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/collection/audio::rust-random-temp-wav-recording
      - id: micro-behaviors/data/stream/record::rust-timed-record-declaration
      - id: micro-behaviors/os/random/generator::rust-random-name-reference
