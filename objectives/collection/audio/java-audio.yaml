defaults:
  platforms: [windows, unix]
  for: [java]
  attack: T1123
  mbc: F0009

composite_rules:
  - id: java-microphone-capture-to-file
    desc: Java microphone capture to file
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/hardware/input/audio::java-target-data-line-source
      - id: micro-behaviors/data/format/media/audio::audioinputstream-type
      - id: micro-behaviors/data/format/media/audio::audiosystem-write-file
