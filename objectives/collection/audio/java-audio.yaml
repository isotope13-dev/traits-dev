defaults:
  platforms: [windows, unix]
  for: [java]
  attack: T1123
  mbc: F0009

composite_rules:
  - id: java-microphone-capture-to-file
    desc: Java microphone capture to file
    crit: suspicious
    conf: 0.94
    unless:
      # A visible start/stop toggle puts the capture under the user's hand:
      # a desktop assistant's voice-input panel (user clicks Record, clicks
      # again to stop) is disclosed recording, not covert collection.
      - id: micro-behaviors/ui/controls/audio-recording::audio-recording-toggle-control
    all:
      - id: micro-behaviors/hardware/input/audio::java-target-data-line-source
      - id: micro-behaviors/data/format/media/audio::audioinputstream-type
      - id: micro-behaviors/data/format/media/audio::audiosystem-write-file
