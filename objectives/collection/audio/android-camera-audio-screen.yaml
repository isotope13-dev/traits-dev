defaults:
  platforms: [android]
  for: [apk, zip]

composite_rules:
  - id: android-sideload-audio-recorder
    desc: Sideloadable app records microphone audio
    crit: hostile
    conf: 0.96
    scope: archive
    for: [apk, zip, android_apk, xml]
    all:
      - id: micro-behaviors/os/privilege/manifest::request-install-packages-binary-manifest
      - id: micro-behaviors/hardware/input/audio::android-record-audio-permission
