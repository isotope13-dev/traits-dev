# A raw input monitor is dual-use by itself. Combining its getevent device
# capture with the kernel's X/Y multitouch codes establishes coordinate
# collection; pairing that capture with a remotely tasked self-enrolled ADB
# shell supports touch collection. Typed keys require separate mapping evidence.
defaults:
  platforms: [android]
  for: [source, binaries]
  attack: T1056.001,T1417.001

composite_rules:
  - id: android-wireless-adb-touch-collector
    desc: "Wireless ADB agent collects touch coordinates"
    crit: hostile
    conf: 0.995
    for: [java, kotlin, apk, zip, dex]
    all:
      - id: objectives/command-and-control/remote-command/control/adb::android-wireless-adb-c2-shell
      - id: micro-behaviors/hardware/input/device::android-raw-touch-coordinate-capture
