# Win16 AOL program that records incoming instant messages. It finds the AOL
# frame, reads the "Instant Message From:" sender label that AOL prints in each
# incoming IM, and names a log manager that writes the text to a file. Logging
# another member's messages is collection of a conversation. The frame lookup
# is shared with the harassment leaf.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1005

traits:
  - id: aol-incoming-im-label
    desc: Win16 AOL reads incoming IM sender label
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      substr: 'Instant Message From'

  - id: aol-log-manager-ui
    desc: AOL log manager and logging window text
    crit: notable
    conf: 0.88
    if:
      type: text
      case_insensitive: true
      regex: 'log manager|&logging'

composite_rules:
  - id: win16-aol-im-logger
    desc: Win16 AOL program logs incoming instant messages to a file
    crit: hostile
    conf: 0.93
    all:
      - id: objectives/impact/ui/manipulation/harassment/chat::aol-frame-window-lookup
      - id: aol-incoming-im-label
      - id: aol-log-manager-ui
