# Account-record field projections.
#
# When a program serialises user records it names the columns: an identity key,
# a handle, and the account-lifecycle timestamps. Any application defines this
# over its own users, so each field name alone is an incomplete fragment; three
# or more co-located is the shape of a member-record projection, which is what
# a directory dump writes out. Conviction belongs to composites that pair this
# with where the records came from.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, -applescript, -vbs, -beam, -clojure, -staticlib, -pyc]
  crit: component
  conf: 0.8
  attack: T1213
  mbc: C0055

traits:
  - id: account-id-field
    desc: Account identity key field name
    if:
      type: text
      regex: '(?i)["'']user_?id["'']'

  - id: account-handle-field
    desc: Account handle field name
    if:
      type: text
      regex: '(?i)["'']user_?name["'']'

  - id: account-created-field
    desc: Account creation timestamp field name
    if:
      type: text
      regex: '(?i)["''](member_since|joined_at|registered_at)["'']'

  - id: account-last-seen-field
    desc: Account last-activity timestamp field name
    if:
      type: text
      regex: '(?i)["''](last_login|last_seen|last_active)["'']'

composite_rules:
  - id: account-record-field-schema
    desc: Dense account-record field-name projection
    crit: notable
    conf: 0.85
    any:
      - id: account-id-field
      - id: account-handle-field
      - id: account-created-field
      - id: account-last-seen-field
    needs: 3
