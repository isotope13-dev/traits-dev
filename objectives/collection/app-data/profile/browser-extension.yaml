defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, chrome-manifest]
  crit: component
  conf: 0.86
  attack: T1119

traits:
  - id: linkedin-profile-content-script
    crit: notable
    desc: LinkedIn profile content script
    for: [chrome-manifest]
    if:
      type: value
      path: content_scripts.matches
      substr: 'linkedin.com/in/'

  - id: linkedin-page-url-field
    crit: notable
    desc: LinkedIn profile URL field
    for: [javascript, typescript]
    if:
      type: text
      substr: linkedin_page_url

  - id: linkedin-profile-card-selector
    crit: notable
    desc: LinkedIn profile card selector
    for: [javascript, typescript]
    if:
      type: text
      substr: '[componentkey*="com.linkedin.sdui.profile.card"]'

  - id: linkedin-experience-section-selector
    crit: notable
    desc: LinkedIn experience section selector
    for: [javascript, typescript]
    if:
      type: text
      substr: '[componentkey*="ExperienceTopLevelSection"]'

  - id: linkedin-full-name-field
    crit: component
    desc: LinkedIn full-name field
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']?full_name["'']?\s*:'

  - id: linkedin-headline-field
    crit: component
    desc: LinkedIn headline field
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']?headline["'']?\s*:'

  - id: linkedin-company-field
    crit: component
    desc: LinkedIn company field
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']?companyName["'']?\s*:'

composite_rules:
  - id: linkedin-profile-data-fields
    desc: LinkedIn profile data fields
    crit: component
    conf: 0.88
    for: [javascript, typescript]
    needs: 3
    any:
      - id: linkedin-page-url-field
      - id: linkedin-full-name-field
      - id: linkedin-headline-field
      - id: linkedin-company-field

  - id: linkedin-profile-dom-collection
    desc: LinkedIn profile DOM collection
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    all:
      - id: linkedin-profile-data-fields
      - id: linkedin-profile-card-selector
      - id: linkedin-experience-section-selector

  - id: linkedin-profile-collection-extension
    desc: LinkedIn profile collection extension
    crit: notable
    conf: 0.92
    all:
      - id: linkedin-profile-content-script
      - id: linkedin-profile-data-fields

  # The atoms above are the field names and component keys of one LinkedIn
  # scraper, so a scraper that reads the same pages through different selectors
  # produced no collection finding at all — VaidikVivah Astro Check runs on
  # Instagram, Facebook, LinkedIn and X, pulls the profile name out of the
  # og:title tag and the visible page text, and parks the result in extension
  # storage on every page load. This states the shape instead: a content script
  # on social-profile hosts that reads page identity and persists it. Where the
  # data then goes is a separate question, which is why this is notable and not
  # an exfiltration verdict.
  - id: social-profile-page-harvest
    desc: Social-page script reads metadata and writes extension storage
    crit: notable
    conf: 0.9
    # Keep the page read and storage write in one script. Archive scope joined
    # an Instagram downloader's content-script Open Graph media lookup to an
    # unrelated background-script license/settings write.
    scope: file
    for: [xpi, crx, zip, javascript, chrome-manifest]
    all:
      - id: metadata/permission/host::content-script-social-media
      - id: micro-behaviors/data/db/web-storage::chrome-storage-local-set
    any:
      - id: micro-behaviors/ui/window/enumerate::browser-body-innertext-read
      - id: micro-behaviors/ui/window/enumerate::browser-og-meta-read
    needs: 1
