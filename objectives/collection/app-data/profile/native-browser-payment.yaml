defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: native-browser-stealer-payment-query
    desc: Multi-browser credential harvester also queries encrypted payment cards
    crit: hostile
    conf: 0.96
    attack: T1005
    all:
      - id: objectives/credential-access/browser/recovery::multi-browser-store-decryption
      - id: micro-behaviors/data/db/read/column::chromium-credit-card-sql
      - id: micro-behaviors/data/db/schema/relational::chromium-encrypted-card-number-column
