# A content script that lifts the signed-in student's name from Canvas and
# ships page content to a hard-coded Discord webhook is collecting the
# user's identity and coursework for a third party's channel. Webhook
# uploads are not a delivery path a reviewer-facing study tool needs.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, xpi, crx, zip]
  attack: T1213,T1567.004

composite_rules:
  - id: lms-user-identity-discord-webhook-upload
    desc: LMS user name and page data sent to Discord webhook
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: micro-behaviors/data/collection/dom::canvas-env-current-user-name
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
      - id: micro-behaviors/communications/http/form::javascript-formdata-file-field
