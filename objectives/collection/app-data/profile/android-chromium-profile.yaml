defaults:
  platforms: [android, unix]
  for: [c, cpp]
  attack: T1555.003,T1539,T1217
  crit: hostile
  conf: 0.96

composite_rules:
  - id: android-chromium-full-profile-collection
    desc: Collects Android Chrome cookies and history
    near_bytes: 2048
    all:
      - id: micro-behaviors/fs/path/cookie::browser-cookies-source-path
      - id: micro-behaviors/fs/path/password-store::native-chromium-login-data
      - id: micro-behaviors/fs/path/application/browser/storage::android-chromium-history-store-path
      - id: micro-behaviors/fs/read/file/content/unspecified::source-file-content-read-api
