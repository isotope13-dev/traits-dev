defaults:
  platforms: [linux, macos, windows]
  for: [scripts, binaries, source]
composite_rules:
- id: chromium-credential-schema-signals
  desc: Chromium credential schema or query references
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/data/db/read/column::chromium-login-sql
  - id: micro-behaviors/data/db/read/column::chromium-cookie-select-query
  - id: micro-behaviors/communications/http/cookie-store::chromium-cookie-query-with-browser-path
  - id: micro-behaviors/data/config/browser-preference::chromium-encrypted-key-metadata
