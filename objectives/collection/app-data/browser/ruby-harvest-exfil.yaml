defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-harvest-browser-credential-exfil
    desc: Collects browser credentials for exfiltration
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule ruby_harvest_browser_credential_exfil {
          strings:
            $cred = "CredentialHarvester.collect_credentials"
            $browser = "CredentialHarvester.harvest_browser_data"
            $sensitive = "SystemRecon.find_sensitive_files"
            $encoded = "obfuscate_data(data)"
            $send = "C2.exfiltrate(session_id, obfuscated)"
            $run = "run_financial_exfil(payload)"
          condition:
            all of them
        }
