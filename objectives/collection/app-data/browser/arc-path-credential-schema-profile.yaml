defaults:
  platforms: [linux, macos, windows]
  for: [scripts, binaries, source]
composite_rules:
- id: arc-path-credential-schema-profile
  desc: Arc profile path and credential schema
  crit: notable
  conf: 0.7
  all:
  - id: micro-behaviors/fs/path/application/browser/profile::arc-profile-path
  any:
  - id: micro-behaviors/fs/path/password-store::login-data-string
  - id: micro-behaviors/data/db/read/column::chromium-cookie-select-query
  - id: micro-behaviors/data/config/schema::encrypted-key-field-reference
  - id: micro-behaviors/data/config/browser-preference::chromium-os-crypt-reference
