defaults:
  platforms: [linux, macos, windows]
  for: [scripts, binaries, source]
composite_rules:
- id: multi-browser-credential-schema-paths
  desc: Multiple browser paths and credential schema
  crit: notable
  conf: 0.95
  all:
  - id: objectives/collection/app-data/browser::chromium-credential-schema-signals
  needs: 3
  any:
  - id: micro-behaviors/fs/path/application/browser/storage::chrome-path
  - id: micro-behaviors/fs/path/application/browser/profile::brave-path
  - id: micro-behaviors/fs/path/application/browser/profile::edge-path
  - id: micro-behaviors/fs/path/application/browser/profile::opera-path
  - id: micro-behaviors/fs/path/application/browser/profile::operagx-path
  - id: micro-behaviors/fs/path/application/browser/profile::vivaldi-path
  - id: objectives/collection/app-data/browser::arc-path-credential-schema-profile
  - id: micro-behaviors/fs/path/application/browser/profile::yandex-path
