# The CORS and default bind observations are linked to the same Hono app.
# This is an exposure signal, not proof that any client accessed the server.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97
traits:
  - id: hono-serve-without-hostname
    desc: Serves Hono app with no hostname option
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression function: (identifier) @serve
          arguments: (arguments . (object .
            (pair key: (property_identifier) @fetch value: (member_expression
              object: (identifier) @app property: (property_identifier) @fetch2)) .
            (pair key: (property_identifier) @port value: (member_expression)) .) .))
          (#eq? @serve "serve")
          (#eq? @app "app")
          (#eq? @fetch "fetch")
          (#eq? @fetch2 "fetch")
          (#eq? @port "port"))
  - id: hono-app-constructor
    desc: Constructs Hono application
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((variable_declarator name: (identifier) @app
          value: (new_expression constructor: (identifier) @hono))
          (#eq? @app "app")
          (#match? @hono "^Hono[0-9]*$"))
  - id: hono-default-cors
    desc: Enables default CORS for app
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression object: (identifier) @app property: (property_identifier) @use)
          arguments: (arguments . (string (string_fragment) @star)
            (call_expression function: (identifier) @cors arguments: (arguments) @cors_args) .))
          (#eq? @app "app")
          (#eq? @use "use")
          (#eq? @star "*")
          (#eq? @cors "cors")
          (#eq? @cors_args "()"))
  - id: conversation-route
    desc: App exposes conversation response route
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression object: (identifier) @app property: (property_identifier) @get)
          arguments: (arguments . (string (string_fragment) @route) (arrow_function) .))
          (#eq? @app "app")
          (#eq? @get "get")
          (#eq? @route "/conversations/:id"))
composite_rules:
  - id: conversation-bridge-unrestricted-listener
    desc: Conversation bridge listens without hostname and enables CORS
    crit: suspicious
    all:
      - id: hono-serve-without-hostname
      - id: hono-app-constructor
      - id: hono-default-cors
      - id: conversation-route
