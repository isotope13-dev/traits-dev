# Collection of local AI-agent session and chat stores. Merely recognizing a
# path remains a neutral filesystem fact; this objective requires a content
# read and remains notable because compaction, indexing, and import are common.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source]
  attack: T1005

traits:
  - id: conversation-prompt-field
    desc: Conversation prompt-history field
    crit: notable
    conf: 0.9
    for: [source, html, markdown, text]
    if:
      type: text
      regex: '["''](conversation|chat)[_-](prompts?|history)["'']'
      case_insensitive: true

  - id: session-user-name-field
    desc: Session user-name field
    crit: component
    conf: 0.86
    for: [source, html, markdown, text]
    if:
      type: text
      regex: '["'']user[_-]name["'']'
      case_insensitive: true

  - id: session-user-location-field
    desc: Session user-location field
    crit: notable
    conf: 0.9
    for: [source, html, markdown, text]
    if:
      type: text
      regex: '["'']user[_-](location|region)["'']'
      case_insensitive: true

  - id: session-subscription-tier-field
    desc: Session subscription-tier field
    crit: component
    conf: 0.9
    for: [source, html, markdown, text]
    if:
      type: text
      regex: '["''](user[_-])?(subscription[_-])?(tier|plan)["'']'
      case_insensitive: true

  - id: recurring-all-transcript-archive
    desc: Archives every transcript each run
    crit: suspicious
    conf: 0.98
    for: [python]
    if:
      type: literal
      kind: string
      regex: '(?i)\barchiv\w*.{0,16}\bevery transcript file.{0,16}\bevery run\b'

  - id: cross-profile-file-read
    desc: Reads another user profile
    crit: suspicious
    conf: 0.97
    for: [python]
    if:
      type: literal
      kind: string
      regex: '(?i)\bread\w*.{0,24}\b(another|other) user profile\b'

composite_rules:
  - id: private-chat-context-field-cluster
    desc: Chat history and private session profile fields
    crit: notable
    conf: 0.97
    for: [source, html, markdown, text]
    all:
      - id: conversation-prompt-field
      - id: session-user-name-field
      - id: session-user-location-field
      - id: session-subscription-tier-field

  - id: ai-agent-session-artifact-read
    desc: Reads local AI-agent sessions or chat databases
    crit: notable
    conf: 0.98
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/agent-artifacts/sessions
    any:
      # Four-plus legs from one leaf, since the two read directories merged.
      - id: micro-behaviors/fs/read/file/

  - id: scheduled-cross-profile-transcript-harvest
    desc: Schedules recurring cross-profile transcript harvesting
    crit: hostile
    conf: 0.99
    for: [python]
    attack: T1005,T1053.003,T1053.005
    all:
      - id: recurring-all-transcript-archive
      - id: cross-profile-file-read
    any:
      - id: micro-behaviors/os/autorun/scheduled::crontab-install-command
      - id: micro-behaviors/os/autorun/scheduled::python-schtasks-create-command
