# Browser-session export and replay is dual-use: account thieves replay stolen
# sessions, while migration, testing, and automation tools transfer sessions the
# operator already controls.  Descriptive claims stay notable; the complete
# multi-store collection and replay implementation is the review signal.
defaults:
  platforms: [windows, unix]
  attack: T1539
  conf: 0.97

traits:
  - id: browser-session-extraction-description
    desc: Package describes browser-session extraction
    crit: notable
    for: [pkginfo]
    if:
      type: text
      substr: Extract browser sessions

  - id: portable-browser-session-description
    desc: Package describes portable browser sessions
    crit: notable
    for: [pkginfo]
    if:
      type: text
      regex: '(?i)\bportable browser sessions?\b'

  - id: donor-session-replay-description
    desc: Package describes donor-session replay
    crit: notable
    for: [pkginfo]
    if:
      type: text
      regex: '(?i)browse as the donor|logged in as donor'

composite_rules:
  - id: package-advertises-browser-session-replay
    desc: Package advertises browser-session portability
    crit: notable
    for: [pkginfo]
    any:
      - id: browser-session-extraction-description
      - id: portable-browser-session-description
      - id: donor-session-replay-description
    needs: 2

  - id: python-browser-session-portability
    desc: Python collects and replays browser sessions
    crit: suspicious
    conf: 0.98
    for: [python]
    all:
      - id: objectives/credential-access/browser/chromium::browser-creds-table-sql
      - id: micro-behaviors/fs/path/sensitive/browser::firefox-cookies
      - id: micro-behaviors/data/db/web-storage::dom-localstorage
      - id: micro-behaviors/data/serialize/json::browser-session-state-json-fields
    any:
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-runtime-evaluate
      - id: micro-behaviors/communications/http/devtools/client::cdp-protocol-surface
      - id: micro-behaviors/communications/http/service-worker::intercept-all
      - id: micro-behaviors/communications/http/request/credentials::fetch-credentials-include
