# PlantUML source is encoded, not encrypted, in a URL used as an image source.
# This records a conditional remote rendering flow, not an observed transfer.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: suspicious
  conf: 0.97
traits:
  - id: markdown-plantuml-public-render
    desc: Markdown diagrams use public PlantUML render
    if:
      type: yara
      source: |
        rule markdown_plantuml_public_render {
          strings:
            $service = "https://www.plantuml.com/plantuml" ascii
            $encode = "C.encode64(C.zip_deflate(unescape(encodeURIComponent(\"@start\"+A+" ascii
            $url = "return k+\"/\"+_+\"/\"+E" ascii
            $image = "F.attrs=[[\"src\",f(O,n)]" ascii
            $plugin = "qce=nk()" ascii
            $use = ".use(qce)" ascii
            $browser = "require(\"puppeteer-core\").launch(u)" ascii
            $open = "m.goto(e$.file(s).toString()" ascii
          condition:
            all of them and @encode > @service and @encode - @service < 250 and
            @url > @encode and @url - @encode < 250 and
            @image > @url and @image - @url < 2500 and
            @use > @plugin and @use - @plugin < 5000 and
            @open > @browser and @open - @browser < 600
        }
