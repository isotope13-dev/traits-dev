# This exposes a path, not the contents of the workspace.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: suspicious
  conf: 0.95
traits:
  - id: external-social-share-workspace-path
    desc: Social share URL includes local workspace path
    if:
      type: yara
      source: |
        rule external_social_share_workspace_path {
          strings:
            $linkedin = "https://www.linkedin.com/sharing/share-offsite/?url=" ascii
            $telegram = "https://t.me/share/url?url=" ascii
            $path = /encodeURIComponent\([A-Za-z_$][A-Za-z0-9_$]*\.workspace\.workspaceFolders\?\.\[0\]\?\.uri\.fsPath/
            $open = ".env.openExternal(" ascii
          condition:
            for any i in (1..#path) : (
              (for any j in (1..#linkedin) : (@path[i] > @linkedin[j] and @path[i] - @linkedin[j] < 160) or
               for any j in (1..#telegram) : (@path[i] > @telegram[j] and @path[i] - @telegram[j] < 160)) and
              for any k in (1..#open) : (@open[k] > @path[i] and @open[k] - @path[i] < 400)
            )
        }
