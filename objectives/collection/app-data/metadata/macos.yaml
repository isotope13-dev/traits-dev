defaults:
  for:
    - macho
    - objc
    - swift
    - applescript
  platforms:
    - macos
  attack: T1083
  crit: notable
traits:
  - id: localized-folder
    desc: .localized folder marker
    crit: notable
    conf: 0.5
    # Match the macOS `.localized` folder as a path component or standalone
    # filename only. A bare substring also hits Swift/ObjC i18n APIs
    # (`error.localizedDescription`, `"key".localized`) which are unrelated to
    # app-data folder enumeration.
    if:
      type: text
      regex: '/\.localized\b|["'']\.localized["'']'
composite_rules:
  - id: user-directory-enum
    desc: Enumerates macOS user directories
    crit: notable
    conf: 0.8
    needs: 2
    any:
      - id: micro-behaviors/fs/path/location::user-library-path
      - id: micro-behaviors/fs/path/location::downloads-folder-target
      - id: micro-behaviors/fs/path/location::documents-folder-target
      - id: micro-behaviors/os/env/vars/user-info::home-var
    unless:
      - id: well-known/app/ai/opencode::opencode-binary-path
      - id: well-known/app/ai/opencode::opencode-bun-runtime
      - id: well-known/lib/runtime/bun-runtime::bun-source-repository-reference
  - id: metadata-collection
    desc: Filesystem traversal with macOS file filtering
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/fs/path/library::ds-store-path
      - id: user-directory-enum
      - id: micro-behaviors/fs/directory/traverse/
    unless:
      - id: well-known/app/storage/carbon-copy-cloner::official-carbon-copy-cloner-member
      - id: well-known/app/ai/anthropic-claude-code::macos-native-signed-binary
      - id: well-known/app/ai/anthropic-claude-code::native-npm-package-name
      - id: well-known/lib/runtime/bun-runtime::bun-source-repository-reference
