defaults:
  for: [scripts, binaries]
  attack: T1005
  platforms:
    - macos
  crit: suspicious
composite_rules:
  - id: notes-theft
    desc: Apple Notes data collection
    crit: suspicious
    conf: 0.9
    for:
      - shell
      - python
      - applescript
      - macho
    all:
      - id: micro-behaviors/fs/path/personal::notes-database-location-reference
      - id: micro-behaviors/fs/file/copy/call::applescript-duplicate-to-location
    any:
      - id: micro-behaviors/fs/path/personal::notestore-wal
      - id: micro-behaviors/fs/path/personal::notestore-shm
      - id: micro-behaviors/fs/path/personal::notes-accounts
      - id: micro-behaviors/fs/path/personal::notes-media
    downgrade:
      any:
        - id: metadata/signed/platform::apple
