defaults:
  platforms: [macos]
  for: [applescript, shell, macho]

composite_rules:
  # Notes exporters can legitimately read these properties. Require the
  # independently detected password-phishing behavior before inferring abuse.
  # The property observation accepts plain source and escaped command strings;
  # it is independent of handler names, variable names and output filenames.
  - id: password-phishing-notes-property-collection
    desc: Password phishing with bulk Notes-property reads
    # Co-occurrence does not bind the dialog result to the Notes reads or
    # establish that those reads are unauthorized. Keep this investigative
    # signal suspicious; the ordinary bulk-property observation is notable.
    crit: suspicious
    conf: 0.96
    attack: T1005
    all:
      - id: objectives/credential-access/phishing/lure::password-phishing-comp
      - id: micro-behaviors/data/property/enumerate::applescript-notes-bulk-properties
