defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
- id: scanned-code-string-capture-upload-client
  desc: Scanned-code string capture with upload client
  crit: hostile
  conf: 0.97
  attack: T1056,T1119
  # The first leg binds the scanned target, installed handler, patch writer
  # and protection-changing import. Query strings alone cannot convict.
  # This profile does not assert that the Windows hook callbacks log keys.
  all:
  - id: micro-behaviors/process/inject/runtime/inline-hook::x86-scanned-callsite-string-capture-patch
  - id: metadata/file/profile/network::native-query-mode-data-field-fragments
  any:
  - id: micro-behaviors/communications/socket/send::send-api
  - id: micro-behaviors/communications/socket/send::send-api-ordinal
