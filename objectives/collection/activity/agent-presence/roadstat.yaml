# Roadstat "presence" collector: a native daemon that installs hooks into
# AI coding agents and reports their session activity to a configured server.
#
# The identifiers below are specimen-specific (token prefix, env overrides,
# hook block marker, upload scope). The composite requires the native agent
# hook-event literal from micro-behaviors so a lone string cannot convict.
defaults:
  platforms: [windows, unix]
  for: [macho, elf, pe]
  attack: T1119,T1041

traits:
  - id: roadstat-presence-token-prefix
    desc: Presence API token prefix sk_roadstat_
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: sk_roadstat_

  - id: roadstat-presence-env-override
    desc: Presence collector endpoint or config override
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'MY_STATUS_PRESENCE_(URL|CONFIG)'

  - id: roadstat-presence-hook-block-marker
    desc: Presence hook block start marker in configs
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: MY_STATUS_PRESENCE_START

  - id: roadstat-presence-upload-scope
    desc: Presence upload scope and events endpoint
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'presence:write|/v1/agents/events'

composite_rules:
  - id: roadstat-presence-collector-binary
    desc: Roadstat presence collector reports agent sessions to a server
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-native-event-literal
    any:
      - id: roadstat-presence-token-prefix
      - id: roadstat-presence-env-override
      - id: roadstat-presence-hook-block-marker
      - id: roadstat-presence-upload-scope
    needs: 2
