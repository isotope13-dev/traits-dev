# Shopping, coupon and toolbar extensions commonly log every page the user
# opens: an all-URLs content script hands the page address and its referrer
# to the background, which reports it to the vendor. Disclosed in privacy
# policies, but it is a full browsing-history feed, so it is suspicious.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, xpi, javascript, typescript, zip]
  attack: T1217

composite_rules:
  - id: all-sites-page-view-report
    desc: All-sites content script reports each page URL and referrer
    crit: suspicious
    conf: 0.85
    scope: archive
    all:
      - id: metadata/permission/dom::content-script-all-urls
      - id: micro-behaviors/communications/ipc/extension-message::runtime-message-page-url-and-referrer
