# C# ad-fraud and affiliate-conversion emulation.
defaults:
  for: [csharp]
  platforms: [windows]
  attack: T1496
  mbc: B0029

traits:
  - id: csharp-browser-emulation-agent
    desc: Browser-emulating HTTP agent
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: "agent.EmulateBrowser();"
  - id: csharp-http-download-start-delete
    desc: Download execute then delete helper
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'getURL2File[\s\S]{0,180}Process\.Start[\s\S]{0,120}File\.Delete'

composite_rules:
  - id: csharp-affiliate-conversion-fraud
    desc: C# affiliate conversion fraud emulator
    crit: hostile
    conf: 0.96
    all:
      - id: csharp-browser-emulation-agent
      - id: micro-behaviors/data/parse/html::recursive-pixel-method-reference
    any:
      - id: micro-behaviors/data/parse/html::html-image-source-extraction
      - id: micro-behaviors/communications/http/services/analytics::csharp-google-conversion-builder
      - id: micro-behaviors/communications/http/cookies::csharp-utm-cookie-creation
      - id: micro-behaviors/communications/http/services/analytics::csharp-utm-gif-tracker
    needs: 3
  - id: csharp-adware-download-exec-helper
    desc: C# adware download execute helper
    crit: suspicious
    conf: 0.92
    all:
      - id: csharp-browser-emulation-agent
      - id: csharp-http-download-start-delete
