# Local browser observation, scheduled identity reporting, and legacy
# collection classifiers still awaiting individual source/control-role review.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  crit: notable
  conf: 0.9

traits:
  # These partial data-path markers are combined with neutral API and
  # transport traits below; none makes an intent claim by itself.
  - id: navigation-host-stored
    desc: Navigation host stored by tab
    crit: component
    conf: 0.96
    if:
      type: text
      regex: 'tabHost\.set\(detail\.tabId,\s*host\)'
  - id: blocked-host-added-to-report
    desc: Blocked tab host added to report
    crit: component
    conf: 0.96
    if:
      type: text
      regex: 'domainTally\.set\(host,\s*true\)'
  - id: domain-activity-in-report-body
    desc: Domain activity included in report body
    crit: component
    conf: 0.96
    if:
      type: text
      regex: 'adblock:\s*adblock'

composite_rules:
  # The background observes top-level navigation hosts, associates a host
  # with each tab that triggered one of the extension's blocking rules, and
  # uploads the accumulated per-domain timestamps as JSON. This is narrower
  # than general pageview telemetry: the report is specifically built from
  # browser navigation state and matched blocking activity.
  - id: extension-blocked-site-host-telemetry-upload
    desc: Extension uploads navigated site hosts associated with blocked activity
    crit: hostile
    conf: 0.97
    attack: T1119,T1041,T1176
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript]
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-webnavigation-api
      - id: micro-behaviors/process/hook/webextension::chrome-declarative-net-request
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/data/serialize/json::json-stringify-payload-call
      - id: navigation-host-stored
      - id: blocked-host-added-to-report
      - id: domain-activity-in-report-body

  # ===================== ARCHIVE-SCOPE: pool manifest + code ==================

  # All-URL extension whose background code harvests visited hosts and uploads
  # them: manifest breadth + code behavior together, evaluated across the crx.
  - id: content-script-all-urls-visit-tracking
    desc: All-URL extension observes page hosts during navigation
    crit: notable
    conf: 0.9
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript]
    all:
      - id: metadata/permission/host::content-script-all-urls
      - id: micro-behaviors/communications/http/url/navigation::browser-location-host-read
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-send-message
      - id: micro-behaviors/browser-extension/lifecycle::chrome-webnavigation-before-navigate
    unless:
      - id: well-known/app/ai/usage/safetrace::safetrace-extension-context
      - id: well-known/app/ai/usage/safetrace::safetrace-extension-name
      - id: well-known/dual-use/tunnel/vpn-browser::vpn-browser-extension-context

  # ===================== NOTABLE: individual characteristics ==================

  # Dormant kill switch: a capability gated behind a gating array that ships
  # empty, so it stays inert until the operator populates it remotely.
  - id: extension-proxy-request-history-buffer
    desc: Buffers intercepted proxy-request history
    crit: suspicious
    conf: 0.96
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/hook/webextension::browser-proxy-request-listener
      - id: micro-behaviors/communications/http/url/navigation::url-object-host-read
      - id: micro-behaviors/data/db/web-storage::array-push-local-anal-storage
