# Local browser observation, scheduled identity reporting, and legacy
# collection classifiers still awaiting individual source/control-role review.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  crit: notable
  conf: 0.9

composite_rules:
  - id: extension-scheduled-fingerprint-beacon
    desc: Scheduled fingerprinted remote beacon
    crit: suspicious
    conf: 0.9
    attack: T1029
    all:
      - id: micro-behaviors/crypto/hash/digest::browser-identity-timestamp-digest-context
      - id: micro-behaviors/time/schedule/webextension::chrome-alarms-create
      - id: micro-behaviors/communications/http/request/client::javascript-http-request-channel
    unless:
      - id: well-known/app/ai/usage/safetrace::safetrace-extension-context
      - id: well-known/app/ai/usage/safetrace::safetrace-extension-name

  # Legacy classifier: an empty allowlist/index miss does not prove an
  # early return or dormant control flow. Requires separate control-flow review.
  - id: extension-dormant-surveillance-pipeline
    desc: Dormant browsing surveillance pipeline
    crit: suspicious
    conf: 0.92
    attack: T1480
    all:
      - id: micro-behaviors/data/collection/array::empty-allowlist-index-miss
      - id: micro-behaviors/browser-extension/tabs::extension-navigation-observation-interfaces
      - id: micro-behaviors/communications/http/request/client::javascript-http-request-channel

  # ===================== ARCHIVE-SCOPE: pool manifest + code ==================

  # All-URL extension whose background code harvests visited hosts and uploads
  # them: manifest breadth + code behavior together, evaluated across the crx.
  - id: content-script-all-urls-visit-tracking
    desc: All-URL extension observes page hosts during navigation
    crit: notable
    conf: 0.9
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript]
    all:
      - id: metadata/permission/host::content-script-all-urls
      - id: micro-behaviors/communications/http/url/navigation::browser-location-host-read
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-send-message
      - id: micro-behaviors/browser-extension/lifecycle::chrome-webnavigation-before-navigate
    unless:
      - id: well-known/app/ai/usage/safetrace::safetrace-extension-context
      - id: well-known/app/ai/usage/safetrace::safetrace-extension-name
      - id: well-known/dual-use/tunnel/vpn-browser::vpn-browser-extension-context

  # ===================== NOTABLE: individual characteristics ==================

  # Dormant kill switch: a capability gated behind a gating array that ships
  # empty, so it stays inert until the operator populates it remotely.
  - id: extension-proxy-request-history-buffer
    desc: Buffers intercepted proxy-request history
    crit: suspicious
    conf: 0.96
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/hook/webextension::browser-proxy-request-listener
      - id: micro-behaviors/communications/http/url/navigation::url-object-host-read
      - id: micro-behaviors/data/db/web-storage::array-push-local-anal-storage
