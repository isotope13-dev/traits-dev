# Address-bar scraping through Android Accessibility.  A banker that only
# renders overlays has to ship one fake screen per targeted institution; an
# agent that reads the browser's URL bar instead learns every site the victim
# visits, including ones it never prepared an overlay for, and it keeps working
# when the bank ships a redesign.
#
# The atoms match browser address-bar resource ids and the accessibility node
# text getters, not any description of the behaviour, so a future family that
# renames its classes but still has to name `:id/url_bar` remains covered.
defaults:
  platforms: [android]
  for: [java, kotlin, apk, zip, dex]
  attack: T1417.001

composite_rules:
  # Reading rendered node text is ordinary for an accessibility service.
  # Aiming that read at a browser's address bar is not: the address bar is the
  # one field an assistive tool has no reason to single out by resource id.
  - id: android-accessibility-browser-url-capture
    desc: Accessibility service reads browser address-bar text
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-text-extraction
      - id: micro-behaviors/hardware/input/accessibility::android-browser-url-bar-view-target

  # A table of address-bar ids across several vendors' browser packages is a
  # target list, and only surveillance code needs one.
  - id: android-accessibility-multi-browser-url-surveillance
    desc: Accessibility service scrapes several browsers' URLs
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-node-tree-read-source
      - id: micro-behaviors/hardware/input/accessibility::android-browser-url-bar-target-set

  # Browsing captured by an accessibility service and a remotely tasked ADB
  # shell on the same device: the collection has an operator and a channel.
  - id: android-adb-agent-browser-url-theft
    desc: Wireless ADB agent scrapes browser URLs
    crit: hostile
    conf: 0.995
    attack: T1417.001,T1636
    all:
      - id: objectives/command-and-control/remote-command/control::android-wireless-adb-c2-shell
    any:
      - id: android-accessibility-browser-url-capture
      - id: android-accessibility-multi-browser-url-surveillance
