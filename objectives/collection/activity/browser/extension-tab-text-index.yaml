defaults:
  for: [javascript]
  platforms: [unix, windows]
traits:
  - id: extension-tab-page-text-word-index
    desc: Extracts page words for tab search index
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule extension_tab_page_text_word_index {
          strings:
            $command = "message.command === 'update_search_tree'"
            $clone = "$('body').clone()"
            $scripts = "body.find('script').remove()"
            $text = "let text = body.text()"
            $words = "const words = text.split(' ')"
            $response = "sendResponse(keys.join(' '))"
          condition:
            all of them
        }
