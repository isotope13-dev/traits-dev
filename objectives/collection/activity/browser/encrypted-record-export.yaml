defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1217,T1119

composite_rules:
  # Collection is unconditional even if export has an empty-allowlist gate.
  # Follow the stored records into the POST body; unrelated telemetry or an
  # encryption API elsewhere does not establish this collection/export path.
  - id: all-url-transformed-domain-record-export
    desc: All-URL domain collector stages transformed records for off-site export
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/hook/webextension::chrome-webrequest-pre-request
      - id: micro-behaviors/data/collection/array::navigation-host-staged-with-transform
      - id: micro-behaviors/communications/http/request/body/application-state::offsite-fetch-indexeddb-json-body
      - id: micro-behaviors/data/collection/array::empty-allowlist-index-miss
      - id: micro-behaviors/crypto/hash/digest/unnamed-algorithm::js-timestamp-hash
