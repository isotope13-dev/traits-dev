# Copying a browser history database for domain-filtered queries can also be
# performed by an authorized forensic collector: suspicious until corroborated.
defaults:
  platforms: [unix, windows]
  for: [source, scripts, binaries]
  attack: T1217
  conf: 0.95
composite_rules:
  - id: staged-chromium-domain-profiling
    desc: Copies browser data for domain profiling
    crit: suspicious
    any:
      - id: micro-behaviors/fs/path/app-data::chromium-profile-user-data-path
      - id: micro-behaviors/fs/path/app-data::chromium-profile-user-data-path-built
    all:
      - id: micro-behaviors/data/db/sql::chromium-history-domain-query
      - id: micro-behaviors/fs/file/copy
  - id: websocket-chromium-domain-profiling
    desc: Browser profiling with WebSocket transmission
    crit: suspicious
    attack: T1217,T1041
    all:
      - id: staged-chromium-domain-profiling
    any:
      - id: micro-behaviors/communications/websocket/send::python-websocket-send-method
      - id: micro-behaviors/communications/websocket/send::websocket-instance-send-call
  - id: remote-shell-chromium-domain-profiling
    desc: WebSocket shell agent profiles browser visits
    crit: hostile
    conf: 0.98
    all:
      - id: staged-chromium-domain-profiling
      - id: objectives/command-and-control/backdoor/shell/socket::python-websocket-shell-client
