# Every completed tab load is reported off-host as {url, install id}, with
# the user's cookies attached (credentials: include). That is a browsing
# history feed keyed to one browser, sent from the privileged worker.
defaults:
  platforms: [unix, windows]
  attack: T1217,T1041

composite_rules:
  - id: completed-tab-url-id-remote-post
    desc: Each completed tab URL POSTed with install ID to remote host
    crit: hostile
    conf: 0.86
    scope: leaf
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-on-updated
      - id: micro-behaviors/browser-extension/tabs::completed-tab-url-with-install-id
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/request/credentials/literal::fetch-credentials-include
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
