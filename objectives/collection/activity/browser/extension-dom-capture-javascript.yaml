defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: "T1539"

composite_rules:
- id: extension-sends-page-form-values-to-http-ip
  desc: Extension sends page form values over HTTP
  crit: suspicious
  conf: 0.96
  attack: T1119
  scope: archive
  for: [crx, xpi, zip, javascript, chrome-manifest]
  all:
  - id: metadata/permission/host::host-permission-all-urls
  - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
  - id: micro-behaviors/ui/window/form-input::input-value-copied-to-form-record
  - id: micro-behaviors/communications/http/request/json::http-post-json
  - id: micro-behaviors/communications/ip/literal::javascript-external-http-ip-url

- id: all-url-extension-active-page-dom-capture
  desc: All-site extension captures page DOM
  crit: hostile
  conf: 0.96
  attack: "T1119"
  ref: sha256:da7012fa6e7ae7403af3635e14bd7f7bf1d43f985fbc83aaead59095ce4b96db
  scope: archive
  for: [javascript, chrome-manifest, crx]
  all:
  - id: micro-behaviors/ui/window/dom-access::extension-active-page-html-read
  - id: metadata/permission/host::host-permission-all-urls
  - id: metadata/permission/debugger::permission-debugger
  any:
  - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
  - id: metadata/permission/manifest::permission-scripting
  - id: metadata/permission/history::permission-history
