defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
# User Activity Exfiltration
traits:
  - id: extension-user-guid-field
    desc: Extension telemetry user GUID field
    crit: component
    conf: 0.9
    if:
      type: text
      word: userGuid
  - id: extension-event-name-field
    desc: Extension telemetry event-name field
    crit: component
    conf: 0.9
    if:
      type: text
      word: eventName
  - id: extension-attribution-field
    desc: Click-attribution parameter field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\b(gclid|msclkid|fbclid|aff_sub[2-5]?)\b'

  - id: webextension-api-marker
    desc: WebExtension API context
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\b(chrome|browser)\.(tabs|storage|runtime|cookies|alarms)\b'
  - id: extension-session-identity-fields
    desc: Extension user or session identity fields
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\b(sessionGuid|user_session_(guid|id)|userGuid)\b'
      case_insensitive: true
  - id: extension-search-activity-fields--counter
    desc: Extension search field (search_counter)
    crit: component
    conf: 0.94
    if:
      type: text
      word: search_counter
  - id: extension-search-activity-fields--searched
    desc: Extension search field (hasSearched)
    crit: component
    conf: 0.94
    if:
      type: text
      word: hasSearched
  - id: extension-search-activity-fields--alive
    desc: Extension search field (Extension_Alive)
    crit: component
    conf: 0.94
    if:
      type: text
      word: Extension_Alive
  - id: extension-heartbeat-path
    desc: Extension heartbeat endpoint path
    crit: component
    conf: 0.8
    if:
      type: literal
      kind: string
      exact: /hb
  - id: extension-hourly-alarm
    desc: Extension schedules hourly alarm
    crit: component
    conf: 0.88
    if:
      type: text
      regex: 'periodInMinutes\s*:\s*60'
  - id: extension-uninstall-endpoint
    desc: Extension uninstall telemetry endpoint
    crit: component
    conf: 0.9
    if: { type: text, substr: /un/?uninstall=true }
  - id: netflix-viewing-activity-api
    desc: Netflix viewing activity API harvest
    crit: suspicious
    conf: 0.96
    unless:
      - id: well-known/unwanted/qvi::qvi-viewing-panel-sdk
      - id: well-known/unwanted/qvi/
    if:
      type: text
      regex: netflix\.com/api/aui/pathEvaluator/.{0,80}viewingActivity
  - id: disney-userstate-api
    desc: Disney userState API harvest
    crit: suspicious
    conf: 0.95
    unless:
      - id: well-known/unwanted/qvi::qvi-viewing-panel-sdk
      - id: well-known/unwanted/qvi/
    if:
      type: text
      substr: disney.api.edge.bamgrid.com/explore/v1.3/userState
  - id: disney-graphql-api
    desc: Disney GraphQL profile harvest
    crit: suspicious
    conf: 0.92
    unless:
      - id: well-known/unwanted/qvi::qvi-viewing-panel-sdk
      - id: well-known/unwanted/qvi/
    if:
      type: text
      substr: disney.api.edge.bamgrid.com/v1/public/graphql
  - id: paramount-profile-api
    desc: Paramount profile API harvest
    crit: suspicious
    conf: 0.94
    unless:
      - id: well-known/unwanted/qvi::qvi-viewing-panel-sdk
      - id: well-known/unwanted/qvi/
    if:
      type: text
      substr: /api/user-profiles/graphql
  - id: peacock-subscription-api
    desc: Peacock subscription GraphQL harvest
    crit: suspicious
    conf: 0.94
    unless:
      - id: well-known/unwanted/qvi::qvi-viewing-panel-sdk
      - id: well-known/unwanted/qvi/
    if:
      type: text
      substr: sas.peacocktv.com/graphql
composite_rules:
  - id: extension-click-attribution-fields
    desc: Extension click-attribution fields
    crit: notable
    conf: 0.9
    near_bytes: 1600
    all:
      - id: extension-attribution-field
      - id: webextension-api-marker

  - id: extension-search-activity-fields
    desc: Extension records search activity fields
    crit: notable
    conf: 0.94
    # Omit first_search/last_search — common debounce locals in admin UIs.
    any:
      - id: extension-search-activity-fields--counter
      - id: extension-search-activity-fields--searched
      - id: extension-search-activity-fields--alive
  # Retention/date arithmetic is common in ordinary applications. Keep the
  # duration as a weak atom, and require the browser cookie setter plus its
  # expiration field nearby before calling it a persistent tracking cookie.
  - id: extension-long-lived-cookie
    desc: Extension creates long-lived tracking cookie
    crit: notable
    conf: 0.94
    # The duration is computed in setUserCookie(), while the generic cookie
    # setter lives in the utility closure above it.  Keep the correlation
    # inside one source file, but allow that small helper boundary.
    near_lines: 120
    all:
      - id: micro-behaviors/time/timing/check::js-multi-year-duration-arithmetic
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-set
      - id: objectives/collection/monitor/tracking::extension-cookie-expiration-field

  - id: extension-image-event-telemetry
    desc: Browser extension sends event telemetry by image request
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/request/client::image-src-network-request
      - id: extension-user-guid-field
      - id: extension-event-name-field
      - id: extension-click-attribution-fields
  - id: extension-periodic-heartbeat
    desc: Browser extension sends hourly heartbeat
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/request/client::image-src-network-request
      - id: micro-behaviors/time/schedule/webextension::chrome-alarms-create
      - id: extension-heartbeat-path
      - id: extension-hourly-alarm
  - id: extension-uninstall-telemetry
    desc: Browser extension registers uninstall telemetry URL
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/browser-extension/lifecycle::runtime-set-uninstall-url
      - id: extension-uninstall-endpoint
  - id: extension-persistent-affiliate-tracking
    desc: Browser extension persists affiliate tracking identifiers
    crit: suspicious
    conf: 0.96
    all:
      - id: extension-user-guid-field
      - id: extension-click-attribution-fields
      - id: extension-long-lived-cookie
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-set
      - id: micro-behaviors/data/db/web-storage::chrome-storage-local-set
    any:
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-on-changed-listener
      - id: micro-behaviors/data/db/web-storage::dom-storage-getitem

  # Reading the active tab's URL is neutral by itself: search helpers and
  # attribution flows commonly inspect query parameters.  Combined with the
  # extension's persistent click/user identifiers and cookie state, it is a
  # cross-site tracking capability rather than a simple local search feature.
  - id: extension-active-tab-attribution-tracking
    desc: Persistent extension tracking correlates active-tab URL data
    crit: suspicious
    conf: 0.95
    attack: T1217,T1041
    scope: archive
    for: [crx, xpi, zip, archives]
    all:
      - id: extension-persistent-affiliate-tracking
      - id: extension-session-identity-fields
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-query-active-url

  # A content script that counts trusted keyboard/pointer events on arbitrary
  # sites is materially different from a page-local analytics listener when
  # it is joined to Chrome profile identity and a remote upload path.
  - id: extension-broad-input-activity-telemetry
    desc: Broad extension uploads cross-site input activity
    crit: hostile
    conf: 0.97
    scope: archive
    for: [javascript, typescript, crx, zip]
    all:
      - id: metadata/permission/host::broad-host-access
      - id: micro-behaviors/process/inject/webextension::broad-content-script-injection
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-send-message
      - id: micro-behaviors/communications/http/services/supabase::rest-api-endpoint
    any:
      - id: micro-behaviors/os/telemetry/activity::trusted-keyboard-activity-listener
      - id: micro-behaviors/os/telemetry/activity::trusted-pointer-activity-listener

  - id: extension-profile-linked-activity-upload
    desc: Extension links browser identity to activity upload
    crit: hostile
    conf: 0.97
    scope: archive
    for: [javascript, typescript, crx, zip]
    all:
      - id: micro-behaviors/os/security/webextension::chrome-identity-profile-info
      - id: micro-behaviors/communications/http/services/supabase::rest-api-endpoint
      - id: micro-behaviors/communications/http/request/client::http-post-json
      - id: micro-behaviors/data/db/web-storage::chrome-storage-sync-set
    any:
      - id: micro-behaviors/os/telemetry/activity::trusted-keyboard-activity-listener
      - id: micro-behaviors/os/telemetry/activity::trusted-pointer-activity-listener

  - id: extension-search-affiliate-heartbeat-tracking
    desc: Search takeover with cookie tracking heartbeat
    crit: hostile
    conf: 0.98
    attack: T1176,T1041,T1539
    scope: archive
    # Evaluate on archive children so scope: archive can correlate the
    # manifest authority with the JavaScript tracking behavior.  An archive
    # container has no child symbols or values of its own.
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/host::broad-host-access
      - id: metadata/permission/cookie::permission-cookies
      - id: objectives/collection/activity/browser::extension-persistent-affiliate-tracking
      - id: extension-periodic-heartbeat
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get

  - id: extension-search-host-profile-telemetry
    desc: Search hijacker uploads host and search telemetry
    crit: hostile
    conf: 0.98
    attack: T1176,T1041,T1119
    scope: archive
    # See extension-search-affiliate-heartbeat-tracking above: archive-level
    # composites must run against a child file to see its manifest siblings.
    all:
      - id: metadata/permission/manifest::chrome-search-provider-override
      - id: metadata/permission/manifest::chrome-default-search-provider
      - id: metadata/permission/manifest::chrome-search-terms-template
      - id: metadata/file/string/telemetry::extension-os-profile-fields
      - id: metadata/file/string/telemetry::extension-runtime-identity-fields
      - id: extension-search-activity-fields
      - id: micro-behaviors/communications/http/request/client::http-post-json
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
  - id: browser-push-subscription-upload
    desc: Browser push subscription upload
    crit: suspicious
    conf: 0.9
    attack: T1041
    all:
      - id: micro-behaviors/communications/http/service-worker::push-subscribe
      - id: micro-behaviors/communications/http/service-worker::notification-request-permission
      - id: micro-behaviors/communications/http/request/client::xmlhttprequest-word
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-script
    any:
      - id: micro-behaviors/communications/http/service-worker::push-get-subscription
      - id: micro-behaviors/communications/http/service-worker::api-register
  - id: activity-exfiltration
    desc: Coordinated exfiltration of user activity tracking
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/telemetry/activity::activity-tracker
      - id: micro-behaviors/os/telemetry/logging/analytics::hardware-id-context
    any:
      - id: objectives/command-and-control/remote-command/config::remote-config-service
      - id: micro-behaviors/os/telemetry/logging/analytics::telemetry-send
  - id: streaming-account-api-harvest
    desc: Harvests streaming account activity APIs
    crit: suspicious
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    any:
      - id: netflix-viewing-activity-api
      - id: disney-userstate-api
      - id: disney-graphql-api
      - id: paramount-profile-api
      - id: peacock-subscription-api
    unless:
      - id: well-known/unwanted/qvi::disclosed-qvi-panel-context
  # Reading the streaming site's own activity APIs and keying the result to a
  # per-install id is the shape of an audience-measurement panel as much as of
  # a covert harvester — disclosed, opt-out-able panel SDKs (see
  # well-known/unwanted/qvi) do exactly this — so it stays suspicious. Hostile
  # needs the undisclosed leg: credential/session material leaving the origin,
  # or the data going somewhere the extension has no relationship with.
  - id: streaming-account-cache-and-exfil
    desc: Caches streaming activity before exfiltration
    crit: suspicious
    conf: 0.96
    scope: archive
    all:
      - id: streaming-account-api-harvest
      - id: micro-behaviors/browser-extension/lifecycle::extension-install-user-id-key
    any:
      - id: micro-behaviors/data/db/web-storage::indexeddb-open
      - id: micro-behaviors/communications/http/request/client::post-method-text
    unless:
      - id: well-known/unwanted/qvi::disclosed-qvi-panel-context

  - id: browser-page-context-remote-code-channel
    desc: Browser page context shared with remote code channel
    crit: hostile
    conf: 0.98
    attack: T1119,T1041,T1059.007
    all:
      - id: micro-behaviors/communications/http/url/path::browser-page-url-referrer-read
      - id: micro-behaviors/communications/ipc/message::postmessage-to-iframe
      - id: objectives/command-and-control/remote-command/control::js-postmessage-body-eval
