defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
# User Activity Exfiltration
traits:
  - id: netflix-viewing-activity-api
    desc: Netflix viewing activity API harvest
    crit: suspicious
    conf: 0.96
    unless:
      - id: well-known/unwanted/qvi/
    if:
      type: text
      regex: netflix\.com/api/aui/pathEvaluator/.{0,80}viewingActivity
  - id: disney-userstate-api
    desc: Disney userState API harvest
    crit: suspicious
    conf: 0.95
    unless:
      - id: well-known/unwanted/qvi/
    if:
      type: text
      substr: disney.api.edge.bamgrid.com/explore/v1.3/userState
  - id: disney-graphql-api
    desc: Disney GraphQL profile harvest
    crit: suspicious
    conf: 0.92
    unless:
      - id: well-known/unwanted/qvi/
    if:
      type: text
      substr: disney.api.edge.bamgrid.com/v1/public/graphql
  - id: paramount-profile-api
    desc: Paramount profile API harvest
    crit: suspicious
    conf: 0.94
    unless:
      - id: well-known/unwanted/qvi/
    if:
      type: text
      substr: /api/user-profiles/graphql
  - id: peacock-subscription-api
    desc: Peacock subscription GraphQL harvest
    crit: suspicious
    conf: 0.94
    unless:
      - id: well-known/unwanted/qvi/
    if:
      type: text
      substr: sas.peacocktv.com/graphql

  - id: ext-config-cookie-name
    desc: Extension config cookie name ext_config
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: '"ext_config"'

  - id: ext-install-api-v2-json-path
    desc: Extension install API v2 JSON path
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: /api/v2/json/install?

  - id: yahoo-serp-ad-and-natural-click-tracker
    desc: Tracks Yahoo SERP ad clicks
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)result-click-ad[\s\S]{0,120}result-click-natural[\s\S]{0,600}querySelectorAll'

  # Yahoo hosted-search partners receive their own SERPs tagged with an
  # hsimp code. Comparing the page's hsimp to one value limits click
  # counting to the partner's own sold traffic.
  - id: yahoo-serp-own-partner-tag-gate
    desc: Gates script on own Yahoo hsimp tag
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bhsimp\b[^;\n]{0,40}(===?|!==?)\s*["''][\w-]{3,60}["'']'

composite_rules:
  - id: extension-install-cookie-config-and-telemetry-beacon
    desc: Newtab extension harvests ext_config cookie and reports install telemetry
    crit: hostile
    conf: 0.98
    attack: T1176,T1041
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript, typescript]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: ext-config-cookie-name
      - id: ext-install-api-v2-json-path

  - id: extension-hourly-os-profile-and-gclid-telemetry
    desc: Extension POSTs throttled host and attribution telemetry
    # OS/browser profile plus ad-click attribution is vendor telemetry of the
    # kind search-monetization extensions send; no account or content data.
    crit: suspicious
    conf: 0.98
    attack: T1176,T1082,T1041
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript, typescript]
    all:
      - id: micro-behaviors/os/telemetry/attribution::hourly-inline-alive-os-profile-map
      - id: micro-behaviors/communications/http/request/json::http-post-json

  - id: extension-yahoo-serp-ad-and-organic-click-tracker
    desc: Search hijack extension monitors Yahoo SERP DOM to track ad and natural clicks
    # Click counting confined to the partner's own hsimp-tagged SERPs is
    # revenue attribution for traffic it was paid for, not page surveillance.
    crit: hostile
    conf: 0.98
    attack: T1176,T1119
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript, typescript]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: yahoo-serp-ad-and-natural-click-tracker
    unless:
      - id: yahoo-serp-own-partner-tag-gate
  - id: extension-image-event-telemetry
    desc: Browser extension sends event telemetry by image request
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/request/client::image-src-network-request
      - id: micro-behaviors/communications/http/services/analytics::extension-user-guid-field
      - id: micro-behaviors/os/telemetry/logging/event::event-name-label
      - id: micro-behaviors/communications/http/services/analytics::extension-click-attribution-fields
  - id: extension-persistent-affiliate-tracking
    desc: Browser extension persists affiliate tracking identifiers
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/services/analytics::extension-user-guid-field
      - id: micro-behaviors/communications/http/services/analytics::extension-click-attribution-fields
      - id: micro-behaviors/communications/http/cookies::extension-long-lived-cookie
      - id: micro-behaviors/data/db/write::chrome-storage-local-set
    any:
      - id: micro-behaviors/communications/http/cookie-store::chrome-cookies-on-changed-listener
      - id: micro-behaviors/data/db/read/key-value::dom-storage-getitem

  # A deleted tracking cookie that comes back is evercookie-shaped
  # persistence: the onChanged removal branch exists only to rewrite the
  # identifier the user just cleared. Cookie-manager extensions handle
  # removal too, but they do not mint persistent affiliate identifiers, so
  # gating on extension-persistent-affiliate-tracking (GUID + click IDs +
  # multi-year cookie + extension storage) keeps this off them.
  - id: extension-tracking-cookie-respawn
    desc: Extension recreates its deleted tracking cookie
    crit: hostile
    conf: 0.97
    all:
      - id: extension-persistent-affiliate-tracking
      - id: micro-behaviors/communications/http/cookie-store::cookies-removed-change-handler
  # Reading the active tab's URL is neutral by itself: search helpers and
  # attribution flows commonly inspect query parameters.  Combined with the
  # extension's persistent click/user identifiers and cookie state, it is a
  # cross-site tracking capability rather than a simple local search feature.
  - id: extension-active-tab-attribution-tracking
    desc: Persistent extension tracking correlates active-tab URL data
    crit: suspicious
    conf: 0.95
    attack: T1217,T1041
    scope: archive
    for: [crx, xpi, zip, javascript]
    all:
      - id: extension-persistent-affiliate-tracking
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-query-active-url

  # A content script that counts trusted keyboard/pointer events on arbitrary
  # sites is materially different from a page-local analytics listener when
  # it is joined to Chrome profile identity and a remote upload path.
  - id: extension-broad-input-activity-telemetry
    desc: Broad extension uploads cross-site input activity
    crit: hostile
    conf: 0.97
    scope: archive
    for: [javascript, typescript, crx, zip, chrome-manifest]
    all:
      - id: metadata/permission/host::broad-host-access
      - id: "metadata/permission/host::broad-content-script-matches"
      - id: micro-behaviors/communications/ipc/extension-message::chrome-runtime-send-message
      - id: micro-behaviors/communications/http/services/supabase::rest-api-endpoint
    any:
      - id: micro-behaviors/os/telemetry/activity::trusted-keyboard-activity-listener
      - id: micro-behaviors/os/telemetry/activity::trusted-pointer-activity-listener

  - id: extension-profile-linked-activity-upload
    desc: Extension links browser identity to activity upload
    crit: hostile
    conf: 0.97
    scope: archive
    for: [javascript, typescript, crx, zip]
    all:
      - id: micro-behaviors/os/security/webextension::chrome-identity-profile-info
      - id: micro-behaviors/communications/http/services/supabase::rest-api-endpoint
      - id: micro-behaviors/communications/http/request/json::http-post-json
      - id: micro-behaviors/data/db/write::chrome-storage-sync-set
    any:
      - id: micro-behaviors/os/telemetry/activity::trusted-keyboard-activity-listener
      - id: micro-behaviors/os/telemetry/activity::trusted-pointer-activity-listener

  - id: extension-search-affiliate-heartbeat-tracking
    for: [javascript, typescript, chrome-manifest, crx, xpi, zip]
    desc: Search takeover with cookie tracking heartbeat
    crit: hostile
    conf: 0.98
    attack: T1176,T1041,T1539
    scope: archive
    # Evaluate on archive children so scope: archive can correlate the
    # manifest authority with the JavaScript tracking behavior.  An archive
    # container has no child symbols or values of its own.
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/host::broad-host-access
      - id: metadata/permission/cookie::permission-cookies
      - id: extension-persistent-affiliate-tracking
      - id: micro-behaviors/communications/http/telemetry::extension-periodic-heartbeat
      - id: micro-behaviors/communications/http/cookie-store::chrome-cookies-get

  - id: extension-search-host-profile-telemetry
    for: [javascript, typescript, chrome-manifest, crx, xpi, zip]
    desc: Search override reports host and search-activity telemetry
    # Host profile and extension status from a declared search provider is
    # monetization telemetry, intrusive but not theft.
    crit: suspicious
    conf: 0.98
    attack: T1176,T1041,T1119
    scope: archive
    # See extension-search-affiliate-heartbeat-tracking above: archive-level
    # composites must run against a child file to see its manifest siblings.
    all:
      - id: metadata/permission/manifest::chrome-search-provider-override
      - id: metadata/permission/manifest::chrome-default-search-provider
      - id: metadata/permission/manifest::chrome-search-terms-template
      - id: micro-behaviors/os/sysinfo/platform/string::extension-os-profile-fields
      - id: metadata/lang/source/naming/extension::extension-runtime-identity-fields
      - id: micro-behaviors/os/telemetry/activity::search-or-extension-status-labels
      - id: micro-behaviors/communications/http/request/json::http-post-json
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  - id: browser-push-subscription-upload
    desc: Browser push subscription upload
    crit: suspicious
    conf: 0.9
    attack: T1041
    all:
      - id: micro-behaviors/communications/http/service-worker::push-subscribe
      - id: micro-behaviors/communications/http/service-worker::notification-request-permission
      - id: micro-behaviors/communications/http/request/client::xmlhttprequest-constructor-text
      - id: micro-behaviors/communications/url/resource-path/file::url-php-endpoint-script
    any:
      - id: micro-behaviors/communications/http/service-worker::push-get-subscription
      - id: micro-behaviors/communications/http/service-worker::api-register
  - id: activity-exfiltration
    desc: Coordinated exfiltration of user activity tracking
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/telemetry/activity::activity-tracker
      - id: micro-behaviors/os/sysinfo/profile::hardware-id-field-names
    any:
      - id: micro-behaviors/data/config/schema::remote-config-reference
      - id: micro-behaviors/os/telemetry/logging/analytics::telemetry-send
  - id: streaming-account-api-harvest
    for: [javascript, typescript, crx, zip, xpi]
    desc: Harvests streaming account activity APIs
    crit: suspicious
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    any:
      - id: netflix-viewing-activity-api
      - id: disney-userstate-api
      - id: disney-graphql-api
      - id: paramount-profile-api
      - id: peacock-subscription-api
    unless:
      - id: well-known/unwanted/qvi::disclosed-qvi-panel-context
  # Reading the streaming site's own activity APIs and keying the result to a
  # per-install id is the shape of an audience-measurement panel as much as of
  # a covert harvester — disclosed, opt-out-able panel SDKs (see
  # well-known/unwanted/qvi) do exactly this — so it stays suspicious. Hostile
  # needs the undisclosed leg: credential/session material leaving the origin,
  # or the data going somewhere the extension has no relationship with.
  - id: streaming-account-cache-and-exfil
    for: [javascript, typescript, crx, zip, xpi]
    desc: Caches streaming activity before exfiltration
    crit: suspicious
    conf: 0.96
    scope: archive
    all:
      - id: streaming-account-api-harvest
      - id: micro-behaviors/browser-extension/lifecycle::extension-install-user-id-key
    any:
      - id: micro-behaviors/data/db/access::indexeddb-open
      - id: micro-behaviors/communications/http/request/verb::post-method-text
    unless:
      - id: well-known/unwanted/qvi::disclosed-qvi-panel-context

  - id: browser-page-context-remote-code-channel
    desc: Browser page context shared with remote code channel
    crit: hostile
    conf: 0.98
    attack: T1119,T1041,T1059.007
    all:
      - id: micro-behaviors/communications/url/navigation-http::browser-page-url-referrer-read
      - id: micro-behaviors/communications/ipc/message::postmessage-to-iframe
      - id: objectives/command-and-control/remote-command/dispatch/eval::js-postmessage-body-eval
