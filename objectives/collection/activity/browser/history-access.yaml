defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

composite_rules:
  - id: extension-sensitive-browsing-data-access
    desc: Extension reads multiple sensitive browsing datasets
    needs: 2
    any:
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get-all
      - id: micro-behaviors/data/db/access::history-search
      - id: micro-behaviors/data/db/access::history-get-visits
      - id: micro-behaviors/data/db/access::top-sites-get
      - id: micro-behaviors/data/db/access::webextension-bookmarks-get-tree

  - id: extension-startup-history-collection
    desc: Extension collects history on startup
    crit: hostile
    conf: 0.98
    for: [javascript, typescript, crx, xpi]
    scope: archive
    attack: T1217,T1119
    all:
      - id: micro-behaviors/data/db/access::history-search
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-startup
      - id: micro-behaviors/data/serialize/json::json-stringify-call
