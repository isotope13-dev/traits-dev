defaults:
  platforms: [windows]
  for: [pe, source]
  attack: T1217
traits:
- id: browser-history-controller-cpp
  desc: Browser history controller source marker
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: BrowserHistoryController.cpp
- id: history-reader-cpp
  desc: History reader source marker
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: HistoryReader.cpp
- id: browser-profile-cpp
  desc: Browser profile source marker
  crit: notable
  conf: 0.96
  if:
    type: text
    substr: BrowserProfile.cpp
- id: browser-history-parse-exception
  desc: Browser history parsing exception class
  crit: suspicious
  conf: 0.98
  if:
    type: text
    substr: BrowserHistoryParseException
- id: chrome-reader-exception
  desc: Chromium history reader exception class
  crit: suspicious
  conf: 0.98
  if:
    type: text
    substr: ChromeReaderException
- id: firefox-profile-exception
  desc: Firefox profile parsing exception class
  crit: suspicious
  conf: 0.98
  if:
    type: text
    substr: FirefoxProfileException
composite_rules:
- id: firefox-history-and-formhistory-collection
  desc: Firefox history and form-history collection
  crit: hostile
  conf: 0.99
  attack: T1114,T1555.003,T1119
  for: [rust]
  all:
  - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
  - id: micro-behaviors/data/db/query::firefox-history-sql-query
  - id: micro-behaviors/data/db/access::moz-formhistory-sql
  - id: micro-behaviors/fs/file/copy::rust-fs-copy
  - id: objectives/anti-static/obfuscation/string/conceal::obfuscate-macro-strings
- id: browser-history-parser-components
  desc: Browser history parsing implementation markers
  crit: notable
  conf: 0.97
  any:
  - id: browser-history-controller-cpp
  - id: history-reader-cpp
  - id: browser-profile-cpp
  needs: 2
- id: browser-history-collection
  desc: Multi-browser history collection via embedded parser
  crit: suspicious
  conf: 0.95
  all:
  - id: browser-history-parser-components
  - id: micro-behaviors/data/db/access::sqlite-api-or-format-reference
  any:
  - id: browser-history-parse-exception
  - id: chrome-reader-exception
  - id: firefox-profile-exception
- id: browser-history-with-http-client
  desc: "Browser history collection with an HTTP client"
  crit: suspicious
  conf: 0.96
  all:
  - id: browser-history-collection
  any:
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-session-connect-flow
  - id: micro-behaviors/communications/http/client/wininet::internet-open
- id: browser-addressbar-ui-automation
  desc: Foreground browser address bar monitoring through UI Automation
  crit: suspicious
  conf: 0.92
  for: [pe]
  all:
  - id: micro-behaviors/ui/window/enumerate::get-foreground-window
  - id: micro-behaviors/ui/window/automation::ui-automation-edit-value-read
  any:
  - id: micro-behaviors/fs/path/basename::browser-process-name-main
  - id: micro-behaviors/fs/path/basename::browser-process-name-alt
