# A content script that wraps history.pushState/replaceState and reports
# the page URL plus referrer to the extension on each change records the
# user's in-app navigation (SPA routes) as well as full page loads.
defaults:
  platforms: [unix, windows]
  attack: T1217

composite_rules:
  - id: spa-route-change-url-relay
    desc: Content script hooks SPA route changes and relays page URL and referrer
    crit: hostile
    conf: 0.88
    scope: leaf
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/ui/window/history::history-push-state-override
      - id: micro-behaviors/communications/ipc/extension-message::runtime-message-page-url
      - id: micro-behaviors/communications/url/navigation-http::browser-document-referrer-read
