# An all-site extension that listens for every click in the capture phase, reads
# the clicked anchor's URL and hands it to its background worker as a message.
# The navigation-hijack verdict lives in objectives/impact/ui/manipulation/
# traffic; this one records the other half of the same handler, which is that
# the destination of every link the user follows leaves the page.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip]
  attack: T1185,T1217

composite_rules:
  - id: extension-global-clicked-url-forwarding
    desc: All-site extension forwards every clicked URL
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: micro-behaviors/ui/window/click::browser-global-click-listener
      - id: micro-behaviors/ui/window/click::clicked-anchor-url-read
      - id: micro-behaviors/communications/ipc/message::cancelled-event-url-runtime-message
      - id: metadata/permission/host::broad-host-access
    unless:
      - id: objectives/impact/ui/manipulation/traffic::download-gated-click-interception-context
