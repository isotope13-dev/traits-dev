defaults:
  platforms:
  - windows
  for:
  - pe
  - vbs
  attack: T1213
traits:
- id: phone-link-phone-db-locator-template
  desc: Template locates Phone Link phone.db
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: FindDb("phone.db")
- id: phone-link-sms-database-copy-template
  desc: Template copies database for SMS extraction
  crit: suspicious
  conf: 0.98
  if:
    type: text
    substr: SafeCopyDb(dbPath, "sms")
composite_rules:
- id: phone-link-sms-database-export-template
  desc: Phone Link SMS database export template
  crit: suspicious
  conf: 0.99
  all:
  - id: phone-link-phone-db-locator-template
  - id: phone-link-sms-database-copy-template
  near_bytes: 8192
