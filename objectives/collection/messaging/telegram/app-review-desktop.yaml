defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - javascript
  - package.json
  - pe
  - elf
  - macho
  - python
  attack: T1005
  crit: suspicious

traits:
  - id: go-main-find-tdata-routine
    desc: Go routine name for locating Telegram tdata
    crit: suspicious
    conf: 0.94
    for: [pe]
    if:
      type: text
      exact: main.findTdata
  - id: go-main-zip-tdata-routine
    desc: Go routine name for archiving Telegram tdata
    crit: suspicious
    conf: 0.94
    for: [pe]
    if:
      type: text
      exact: main.zipTdataChunked
  - id: telegram-go-collector-symbol
    desc: Go Telegram collection routine
    crit: notable
    conf: 0.9
    platforms: [macos]
    for: [macho]
    if:
      type: text
      exact: GetTelegram

composite_rules:
  - id: go-telegram-tdata-archive-exfiltration
    desc: Go Telegram session archive upload
    crit: hostile
    conf: 0.99
    attack: T1005,T1041
    mbc: B0047,E1041
    for: [pe]
    platforms: [windows]
    all:
      - id: objectives/collection/messaging/telegram::go-main-find-tdata-routine
      - id: objectives/collection/messaging/telegram::go-main-zip-tdata-routine
      - id: objectives/collection/messaging/app::go-main-grab-send-routine
      - id: micro-behaviors/communications/messaging/send::telegram-bot-api-file-upload
  - id: telegram-go-stealer-routine
    desc: Telegram collector with keychain theft
    crit: suspicious
    conf: 0.95
    platforms: [macos]
    for: [macho]
    all:
      - id: objectives/collection/messaging/telegram::telegram-go-collector-symbol
      - id: objectives/credential-access/keychain/extract::go-dump-keychain-symbol
