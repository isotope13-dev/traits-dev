defaults:
  platforms: [windows, unix]
  for: [class]
  conf: 0.96
traits:
  - id: jvm-telegram-appdata-copy-identifiers
    desc: JVM names Telegram app-data copying methods
    crit: suspicious
    if:
      type: yara
      source: |
        rule jvm_telegram_appdata_copy_identifiers {
          strings:
            $copy = "copyTelegramData" ascii
            $appdata = "GetTelegramAppdata" ascii
            $directory = "copyDirectoryRecursively" ascii
          condition:
            uint32be(0) == 0xcafebabe and all of them
        }
  - id: jvm-declared-telegram-data-copy
    desc: Declares a Telegram data-copy method
    crit: suspicious
    if:
      type: function
      exact: copyTelegramData
composite_rules:
  - id: jvm-credential-theft-telegram-collection-bundle
    desc: Credential-theft bundle declares Telegram data collection
    crit: hostile
    conf: 0.98
    for: [jar, zip]
    scope: archive
    all:
      - id: objectives/credential-access/browser/multi-target::jvm-declared-cookie-password-theft
      - id: jvm-telegram-appdata-copy-identifiers
      - id: jvm-declared-telegram-data-copy
