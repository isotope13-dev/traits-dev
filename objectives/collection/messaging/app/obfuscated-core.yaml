defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1195.002,T1059.007
composite_rules:
  # These are literal references, not reconstructed method calls. Describe
  # the combined obfuscated payload and its mandatory application target.
  - id: obfuscated-discord-executable-core-payload
    desc: Obfuscated filesystem payload targets Discord core
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/collection/messaging/app::discord-core-index-js
      - id: micro-behaviors/fs/write/file/full::writefilesync-name-literal
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime
      - id: metadata/import/builtin::require-https
  - id: fragmented-discord-executable-core-payload
    desc: Obfuscated file payload targets split Discord core
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/lang/source/literal/fragment::discord-versioned-core-path-fragments
      - id: metadata/import/builtin::require-fs
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
    any:
      - id: metadata/lang/source/literal/fragment::write-file-sync-string-prefix
      - id: metadata/lang/source/syntax/argument::computed-method-truncate-write-options

  - id: concealed-discord-core-write-target-profile
    desc: Concealed Discord core and file-write targets
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/source/literal/fragment::discord-desktop-core-name-parts
      - id: metadata/lang/source/literal/fragment::synchronous-file-write-name-parts
      - id: metadata/import/builtin::require-fs
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime
