defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  - id: hardcoded-qq-recipient
    desc: Hardcoded QQ recipient identifier
    crit: suspicious
    conf: 0.99
    if:
      type: string_literal
      exact: '1821181277'
  - id: eight-hex-code-filter
    desc: Filters messages for 8 hex codes
    crit: component
    conf: 0.97
    count_min: 2
    unless:
      - id: well-known/tool/development/vscode-extension/atlascode/
      # A JSON-schema document quotes this pattern as schema text, not as a
      # message filter. That is a fact about the file, so it cannot live in
      # `not:`, which tests the matched string itself.
      - type: text
        substr: "json-schema.org"
      # Bundles that carry this pattern as their own payload rather than as a
      # message filter: the Ace editor's syntax modes, an atlascode webpack
      # chunk, and UUID URNs. All are facts about the file.
      - type: text
        regex: 'ace/mode/(gherkin|python)_highlight_rules|define\("ace/(mode|snippets)/'
      - type: text
        substr: "urn:uuid"
    if:
      type: text
      substr: '[0-9A-Fa-f]{8}'
    # Only the two legs that extend the matched text belong here: `not:` tests
    # the matched string, so it can express "the match was part of a \uXXXX
    # escape" and nothing about the rest of the file.
    not:
      - substr: "U[0-9A-Fa-f]{8}"
      - substr: "u[0-9A-Fa-f]{8}"
  - id: message-space-stripping
    desc: Strips spaces before message matching
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: session\.content\.replace\(\s*["'] ["']\s*,\s*["']["']\s*\)
  - id: extracted-first-hex-code
    desc: Exfiltrates first extracted hex code
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: extractAll8DigitHex\(.{0,80}\)\[0\]
  - id: helper-extracts-all-hex-codes
    desc: Helper extracts all matching hex codes
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: function\s+extractAll8DigitHex|extractAll8DigitHex\s*=
composite_rules:
  - id: koishi-chat-code-surveillance
    desc: Koishi plugin monitors messages for hex codes
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/ipc/message::koishi-message-event-hook
      - id: eight-hex-code-filter
    any:
      - id: message-space-stripping
      - id: helper-extracts-all-hex-codes
  - id: koishi-private-message-code-exfil
    desc: Koishi plugin exfiltrates intercepted chat codes
    crit: hostile
    conf: 0.995
    attack: T1041
    all:
      - id: koishi-chat-code-surveillance
      - id: micro-behaviors/communications/ipc/message::koishi-private-message-hardcoded-user
    any:
      - id: micro-behaviors/communications/ipc/message::koishi-private-message-send
      - id: hardcoded-qq-recipient
      - id: extracted-first-hex-code
