defaults:
  platforms: [windows, linux, macos]
  for: [javascript, package.json, pe, elf, macho, python]
  attack: T1005
  crit: suspicious
traits:
  - id: go-main-find-tdata-routine
    desc: Go routine name for locating Telegram tdata
    crit: suspicious
    conf: 0.94
    for: [pe]
    if:
      type: text
      exact: main.findTdata
  - id: go-main-zip-tdata-routine
    desc: Go routine name for archiving Telegram tdata
    crit: suspicious
    conf: 0.94
    for: [pe]
    if:
      type: text
      exact: main.zipTdataChunked
  - id: go-main-grab-send-routine
    desc: Go routine name for collecting and sending
    crit: suspicious
    conf: 0.92
    for: [pe]
    if:
      type: text
      exact: main.grabAndSend
  - id: telegram-key-datas
    desc: References Telegram key_datas session storage
    crit: suspicious
    conf: 0.9
    if:
      type: text
      # `key_datas` is also a normal internal variable name in wallet and
      # keychain software.  Require the Telegram context asserted by this
      # objective instead of matching the generic token alone.
      regex: '(?i)(telegram.{0,160}key_datas|key_datas.{0,160}telegram)'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: telegram-go-collector-symbol
    desc: Go Telegram collection routine
    crit: notable
    conf: 0.9
    platforms: [macos]
    for: [macho]
    if:
      type: text
      exact: GetTelegram
  - id: discord-core-module-versioned
    desc: Discord versioned core module path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)modules[/\\]{1,2}discord_desktop_core-'
  - id: discord-core-index-js
    desc: Discord desktop core index.js path
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'discord_desktop_core-.{1,40}[/\\]{1,2}discord_desktop_core[/\\]{1,2}index\.js'
      case_insensitive: true
  - id: discord-core-remote-injection-source
    desc: Remote GitHub Discord injection script source
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)raw\.githubusercontent\.com/[^\s"'']{1,180}/Injection/injection\b'
  - id: discord-core-webhook-placeholder
    desc: Injection script webhook placeholder
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: '%WEBHOOK_LINK%'
  - id: discord-core-infect-routine
    desc: Discord core infection routine marker
    crit: notable
    conf: 0.9
    if:
      type: function
      exact: Infect
  - id: discord-core-injection-target-list
    desc: Collected Discord core index targets
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)injectPath\s*\.forEach\s*\(\s*file'
  - id: discord-core-protection-library
    desc: Discord core protection DLL artifact
    crit: suspicious
    conf: 0.94
    for: [javascript, typescript, pe, dll, c, cpp]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)ProtectionPayload\.dll'
  - id: discord-core-secure-state
    desc: Discord core secure state artifact
    crit: suspicious
    conf: 0.94
    for: [javascript, typescript, pe, dll, c, cpp]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)(^|[/\\]|["''])secure\.dat([^A-Za-z0-9_.-]|$)'
  - id: discord-session-storage
    desc: Discord session storage path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)discord[/\\]Session Storage'
  - id: discord-local-state-json
    desc: Discord local state dump artifact
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)discord[/\\].{0,40}_Local_State\.json'
  - id: discord-masterkey-dump
    desc: Discord master key dump artifact
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)discord[/\\].{0,40}_masterkey\.txt'
  - id: discord-backup-codes
    desc: Discord backup code artifact
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)discord_backup_codes\.txt'
  - id: discord-info-artifact
    desc: Discord collection artifact name
    crit: notable
    conf: 0.8
    if:
      type: text
      word: DISCORD_INFO
  - id: discord-core-eval-loader
    desc: Discord core eval loader payload
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: core\.asar.{0,120}eval\([A-Za-z_$][A-Za-z0-9_$]*\)
  - id: whatsapp-indexeddb-path
    desc: WhatsApp IndexedDB path
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: WhatsApp/IndexedDB
  - id: whatsapp-localstorage-path
    desc: WhatsApp local storage path
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: WhatsApp/Local Storage
  - id: whatsapp-sessionstorage-path
    desc: WhatsApp session storage path
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: WhatsApp/Session Storage
  - id: whatsapp-cookies-path
    desc: WhatsApp network cookies path
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: (?i)WhatsApp[/\\]Network[/\\]Cookies
  - id: whatsapp-cookies-file
    desc: WhatsApp cookies storage path
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: (?i)WhatsApp[/\\]Cookies
  - id: whatsapp-web-indexeddb-leveldb
    desc: WhatsApp Web IndexedDB LevelDB profile path
    crit: suspicious
    conf: 0.92
    for: [source, scripts, pe]
    if:
      type: text
      substr: https_web.whatsapp.com_0.indexeddb.leveldb
  - id: telegram-web-indexeddb-leveldb
    desc: Telegram Web IndexedDB LevelDB profile path
    conf: 0.92
    for: [source, scripts, pe]
    if:
      type: text
      substr: https_web.telegram.org_0.indexeddb.leveldb
  - id: teams-web-indexeddb-leveldb
    desc: Teams Web IndexedDB LevelDB profile path
    conf: 0.92
    for: [source, scripts, pe]
    if:
      type: text
      substr: https_teams.microsoft.com_0.indexeddb.leveldb
    unless:
      - id: well-known/tool/forensics/forensicnomicon::forensicnomicon-context
  - id: chatwork-indexeddb-leveldb
    desc: Chatwork IndexedDB LevelDB profile path
    conf: 0.92
    for: [source, scripts, pe]
    if:
      type: text
      substr: https_www.chatwork.com_0.indexeddb.leveldb
  - id: whatsapp-desktop-packaged-localstate
    desc: WhatsApp Desktop packaged LocalState directory
    crit: notable
    conf: 0.92
    for: [pe, dll, csharp, javascript, package.json, data]
    if:
      type: text
      regex: 'WhatsAppDesktop_[^/\\]{1,80}[/\\]LocalState'
      case_insensitive: true
  - id: whatsapp-desktop-settings-db-name
    desc: settings.db SQLite filename
    crit: component
    conf: 0.92
    for: [pe, dll, csharp, javascript, package.json, data]
    if:
      type: text
      regex: 'settings\.db([^A-Za-z0-9_.-]|$)'
      case_insensitive: true
  - id: whatsapp-desktop-settings-db-shm-name
    desc: settings.db-shm SQLite sidecar filename
    crit: notable
    conf: 0.92
    for: [pe, dll, csharp, javascript, package.json, data]
    if:
      type: text
      regex: 'settings\.db-shm([^A-Za-z0-9_.-]|$)'
      case_insensitive: true
  - id: whatsapp-desktop-settings-db-wal-name
    desc: settings.db-wal SQLite sidecar filename
    crit: notable
    conf: 0.92
    for: [pe, dll, csharp, javascript, package.json, data]
    if:
      type: text
      regex: 'settings\.db-wal([^A-Za-z0-9_.-]|$)'
      case_insensitive: true
composite_rules:
  - id: go-telegram-tdata-archive-exfiltration
    desc: Go Telegram session archive upload
    crit: hostile
    conf: 0.99
    attack: T1005,T1041
    mbc: B0047,E1041
    for: [pe]
    platforms: [windows]
    all:
      - id: go-main-find-tdata-routine
      - id: go-main-zip-tdata-routine
      - id: go-main-grab-send-routine
      - id: micro-behaviors/communications/messaging/send::telegram-bot-api-file-upload
  - id: whatsapp-desktop-settings-db
    desc: WhatsApp Desktop settings SQLite database
    crit: notable
    conf: 0.9
    near_bytes: 1024
    for: [pe, dll, csharp, javascript, package.json, data]
    all:
      - id: whatsapp-desktop-packaged-localstate
      - id: whatsapp-desktop-settings-db-name
  - id: whatsapp-desktop-settings-db-shm
    desc: WhatsApp SQLite shared-memory sidecar
    crit: notable
    conf: 0.9
    near_bytes: 1024
    for: [pe, dll, csharp, javascript, package.json, data]
    all:
      - id: whatsapp-desktop-packaged-localstate
      - id: whatsapp-desktop-settings-db-shm-name
  - id: whatsapp-desktop-settings-db-wal
    desc: WhatsApp SQLite write-ahead-log sidecar
    crit: notable
    conf: 0.9
    near_bytes: 1024
    for: [pe, dll, csharp, javascript, package.json, data]
    all:
      - id: whatsapp-desktop-packaged-localstate
      - id: whatsapp-desktop-settings-db-wal-name
  - id: signal-desktop-sqlcipher-harvest
    desc: Signal SQLCipher message harvesting
    crit: hostile
    conf: 0.98
    mbc: E1005
    ref: sha256:2c2ea9613e294962bd4145978ab0a9b61b7cbe8ad3f7b29ae25e678d55b28a1f
    all:
      - id: micro-behaviors/fs/path/app-data::signal-desktop-database-path
      - id: micro-behaviors/fs/path/password-store::signal-safe-storage-item
    any:
      - id: micro-behaviors/data/db/sql::sql-messages-table-query
      - id: objectives/credential-access/keychain/extract::find-generic-password
      - id: micro-behaviors/crypto/kdf/algorithm::chrome-compatible-kdf-salt
    needs: 2
  - id: imessage-chatdb-message-harvest
    for: [macho, python, javascript]
    desc: iMessage chat.db message harvesting
    crit: hostile
    conf: 0.96
    mbc: E1005
    ref: sha256:2c2ea9613e294962bd4145978ab0a9b61b7cbe8ad3f7b29ae25e678d55b28a1f
    all:
      - id: micro-behaviors/fs/path/personal::imessage-chat-db
    any:
      - id: micro-behaviors/data/db/sql::imessage-message-table-query
      - id: objectives/collection/messaging/imessage::attributed-body-parser
      - id: objectives/collection/messaging/imessage::chatdb-temp-copy
    needs: 2
    unless:
      - id: well-known/app/ai/knowledge/topos::topos-logger-namespace
  - id: telegram-go-stealer-routine
    desc: Telegram collector with keychain theft
    crit: suspicious
    conf: 0.95
    platforms: [macos]
    for: [macho]
    all:
      - id: telegram-go-collector-symbol
      - id: objectives/credential-access/keychain/extract::go-dump-keychain-symbol
  - id: whatsapp-storage
    desc: WhatsApp Desktop storage
    crit: suspicious
    conf: 0.85
    any:
      - id: whatsapp-indexeddb-path
      - id: whatsapp-localstorage-path
      - id: whatsapp-sessionstorage-path
      - id: whatsapp-cookies-path
      - id: whatsapp-cookies-file
      - id: whatsapp-web-indexeddb-leveldb
  - id: browser-messenger-indexeddb-targeting
    desc: Targets Telegram and WhatsApp Web IndexedDB stores
    crit: suspicious
    conf: 0.99
    for: [source, scripts, pe]
    all:
      - id: telegram-web-indexeddb-leveldb
      - id: whatsapp-web-indexeddb-leveldb
  - id: whatsapp-desktop-sqlite-staging
    for: [pe]
    desc: WhatsApp SQLite sidecars staged for collection
    crit: suspicious
    conf: 0.96
    all:
      - id: whatsapp-desktop-settings-db
      - id: whatsapp-desktop-settings-db-shm
      - id: whatsapp-desktop-settings-db-wal
      - id: micro-behaviors/fs/file/copy::copyfile-w
  - id: whatsapp-desktop-sqlite-remote-injection
    for: [pe]
    desc: WhatsApp SQLite staging with remote injection
    crit: hostile
    conf: 0.98
    attack: T1005,T1055,T1074.001
    all:
      - id: whatsapp-desktop-sqlite-staging
      - id: micro-behaviors/process/inject/runtime/call::remote-thread-resource-api-profile
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
  - id: multi-messenger
    desc: Messaging store paths and file-read APIs
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/read/file
    needs: 2
    any:
      - id: micro-behaviors/fs/path/token::telegram-session-data-location
      - id: micro-behaviors/fs/path/app-data::discord-local-storage-path
      - id: micro-behaviors/fs/path/app-data::signal-data-path
      - id: whatsapp-web-indexeddb-leveldb
      - id: telegram-web-indexeddb-leveldb
      - id: teams-web-indexeddb-leveldb
      - id: chatwork-indexeddb-leveldb
  - id: discord-session-theft
    desc: Discord session data harvesting
    crit: suspicious
    conf: 0.95
    needs: 2
    any:
      - id: micro-behaviors/fs/path/app-data::discord-local-storage-path
      - id: discord-session-storage
      - id: discord-local-state-json
      - id: discord-masterkey-dump
      - id: discord-backup-codes
      - id: discord-info-artifact
  - id: discord-core-backdoor
    desc: Discord desktop core trojanization
    crit: hostile
    conf: 0.97
    near_bytes: 512
    all:
      - id: micro-behaviors/fs/path/app-data::discord-core-module
      - id: discord-core-module-versioned
      - id: micro-behaviors/fs/path/app-data::discord-index-js
    any:
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: discord-core-eval-loader
      - id: well-known/app/communication/discord::discord-core-asar-bridge
      - id: micro-behaviors/fs/path/app-data::slack-data-path
      - id: whatsapp-storage
  - id: extension-discord-idle-keepalive
    desc: Extension fakes Discord activity to prevent idle logout
    crit: hostile
    conf: 0.97
    for: [javascript, typescript, crx]
    all:
      - id: micro-behaviors/communications/http/services/discord::discord-web-host-url
      - id: well-known/app/communication/discord::discord-app-mount-element
      - id: micro-behaviors/ui/window/automation::dom-dispatch-mousemove-call
    any:
      - id: well-known/app/communication/discord::discord-layer-container-selector
  - id: discord-core-index-modified
    desc: Discord core index module modified
    crit: suspicious
    conf: 0.97
    for: [pe, javascript]
    platforms: [windows]
    all:
      - id: discord-core-module-versioned
      - id: discord-core-index-js
    any:
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync
      - id: micro-behaviors/fs/write/file/handle::write-file-source
      - id: micro-behaviors/fs/write/file/handle::write-file
  - id: discord-core-protection-artifact-set
    desc: Discord core protection artifact set
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript, pe, dll, c, cpp]
    platforms: [windows]
    any:
      - id: discord-core-protection-library
      - id: discord-core-secure-state
  - id: discord-core-protection-removed
    desc: Discord core protection files removed
    crit: suspicious
    conf: 0.97
    for: [pe, javascript]
    platforms: [windows]
    all:
      - id: discord-core-module-versioned
      - id: discord-core-protection-artifact-set
    any:
      - id: micro-behaviors/fs/delete/file/library::fs-unlinkSync
      - id: micro-behaviors/fs/delete/file/library::deletefile
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
  - id: discord-core-integrity-tamper
    desc: Discord core integrity artifacts tampered
    crit: hostile
    conf: 0.99
    attack: T1555.003,T1562.001,T1070.004
    for: [pe, javascript]
    platforms: [windows]
    all:
      - id: discord-core-index-modified
      - id: discord-core-protection-removed
  - id: discord-leveldb-token-scan
    desc: Reads Discord tokens from Chromium LevelDB files
    crit: hostile
    conf: 0.99
    attack: T1555.003,T1005
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/fs/path/app-data::discord-core-module
      - id: micro-behaviors/data/format/credentials::discord-token-regex-source-variants
      - id: micro-behaviors/fs/path/app-data::chromium-leveldb-local-storage
      - id: micro-behaviors/fs/read/file/full::read-node
    any:
      - id: micro-behaviors/fs/directory/readdir::node-readdir-sync-call
      - id: micro-behaviors/fs/directory/async-enumeration::node-readdir-async-call
  - id: discord-core-remote-script-fetch
    desc: Fetches a remote script intended for Discord core injection
    crit: hostile
    conf: 0.99
    attack: T1105,T1195.002
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/fs/path/app-data::discord-core-module
      - id: discord-core-index-js
      - id: discord-core-remote-injection-source
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
  - id: discord-core-script-overwrite
    desc: Replaces Discord desktop core with a webhook-configured script
    crit: hostile
    conf: 0.99
    attack: T1059.007,T1195.002,T1565.001
    for: [javascript, typescript]
    all:
      - id: discord-core-index-js
      - id: discord-core-injection-target-list
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: discord-core-webhook-placeholder
      - id: discord-core-infect-routine
  - id: discord-core-process-kill-activation
    desc: Force-kills Discord clients before core injection
    crit: hostile
    conf: 0.98
    attack: T1489,T1059.007
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/fs/path/app-data::discord-core-module
      - id: discord-core-remote-injection-source
      - id: micro-behaviors/process/terminate/command::js-taskkill-force-command
    any:
      - id: discord-core-infect-routine
      - id: discord-core-injection-target-list
  - id: messaging-data-staging
    for: [python]
    desc: Staging stolen messaging app credentials
    crit: hostile
    conf: 0.95
    attack: T1074.001
    mbc: E1074
    all:
      - id: micro-behaviors/fs/path/token::telegram-session-data-location
      - id: micro-behaviors/process/identity/query::python-current-username
      - id: micro-behaviors/os/sysinfo/directories::python-temp-directory-lookup
      - id: micro-behaviors/fs/directory/mkdir::mkdir-python
