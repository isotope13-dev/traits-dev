defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1119

traits:
  # Business CRM extensions may intentionally sync WhatsApp conversations,
  # but this is a high-sensitivity collection path worth surfacing separately
  # from extensions that only send messages.
  - id: whatsapp-inbound-message-text-field
    desc: Received WhatsApp text object field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["''](mensagem|message|text)["'']\s*:\s*(data|message|msg)\.(content|body|text)\b'

  - id: ai-chat-dom-scrape--chatgpt-claude-after
    desc: AI chat DOM scrape selector context
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?is)(chatgpt|claude).{0,500}(data-message-author-role|conversation-turn)'
  - id: ai-chat-dom-scrape--gemini-copilot-after
    desc: AI chat DOM scrape selector context
    # Product-name and generic DOM-selector co-occurrence also appears in
    # Gmail UI integrations; extension and messaging context belongs in the
    # higher-level rule.
    crit: component
    conf: 0.88
    if:
      type: text
      regex: (gemini|copilot)[\s\S]{0,500}(MutationObserver|querySelectorAll)
  - id: ai-chat-dom-scrape--perplexity-poe-after
    desc: AI chat DOM scrape selector context
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: (perplexity|poe\.com)[\s\S]{0,500}(MutationObserver|querySelectorAll)
  - id: ai-chat-dom-scrape--character-after
    desc: AI chat DOM scrape selector context
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: (character\.ai|data-message-author-role)[\s\S]{0,500}(MutationObserver|querySelectorAll)
  - id: ai-chat-dom-scrape--conversation-after
    desc: AI chat DOM scrape selector context
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: (conversation-turn)[\s\S]{0,500}(MutationObserver|querySelectorAll)
  - id: ai-chat-dom-scrape--chatgpt-claude-before
    desc: AI chat DOM scrape selector context
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?is)(data-message-author-role|conversation-turn).{0,500}(chatgpt|claude)'
  - id: ai-chat-dom-scrape--gemini-copilot-before
    desc: AI chat DOM scrape selector context
    # Product-name and generic DOM-selector co-occurrence also appears in
    # Gmail UI integrations; extension and messaging context belongs in the
    # higher-level rule.
    crit: component
    conf: 0.88
    if:
      type: text
      regex: (MutationObserver|querySelectorAll)[\s\S]{0,500}(gemini|copilot)
  - id: ai-chat-dom-scrape--perplexity-poe-before
    desc: AI chat DOM scrape selector context
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: (MutationObserver|querySelectorAll)[\s\S]{0,500}(perplexity|poe\.com)
  - id: ai-chat-dom-scrape--character-before
    desc: AI chat DOM scrape selector context
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: (MutationObserver|querySelectorAll)[\s\S]{0,500}(character\.ai|data-message-author-role)
  - id: ai-chat-dom-scrape--conversation-before
    desc: AI chat DOM scrape selector context
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: (MutationObserver|querySelectorAll)[\s\S]{0,500}(conversation-turn)

composite_rules:
  - id: whatsapp-extension-inbound-message-sync
    desc: WhatsApp extension syncs received message content over HTTP
    crit: notable
    conf: 0.93
    for: [crx, zip, chrome-manifest, javascript]
    scope: archive
    all:
      - id: metadata/permission/host::content-script-matches-im-web-app
      - id: whatsapp-inbound-message-text-field
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern

  - id: ai-chat-dom-scrape
    desc: AI chat DOM scraping
    crit: component
    conf: 0.88
    any:
      - id: ai-chat-dom-scrape--chatgpt-claude-after
      - id: ai-chat-dom-scrape--gemini-copilot-after
      - id: ai-chat-dom-scrape--perplexity-poe-after
      - id: ai-chat-dom-scrape--character-after
      - id: ai-chat-dom-scrape--conversation-after
      - id: ai-chat-dom-scrape--chatgpt-claude-before
      - id: ai-chat-dom-scrape--gemini-copilot-before
      - id: ai-chat-dom-scrape--perplexity-poe-before
      - id: ai-chat-dom-scrape--character-before
      - id: ai-chat-dom-scrape--conversation-before

  - id: extension-ai-chat-monitor
    desc: Extension observes AI chat page DOM
    crit: notable
    conf: 0.94
    all:
      - id: metadata/permission/runtime::is-extension
      - id: ai-chat-dom-scrape
    any:
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-send-message
      - id: micro-behaviors/ui/window/event::browser-mutation-observer
