# Python Discord bots that harvest OAuth refresh tokens and beacon via webhooks.
defaults:
  platforms: [unix, windows]
  for: [python, whl, python-sdist, zip]
  attack: T1528,T1041,T1567.002
  crit: notable
  conf: 0.95

composite_rules:
  - id: python-leveldb-discord-token-harvest
    desc: Harvests Discord tokens from LevelDB
    crit: hostile
    conf: 0.95
    attack: T1539,T1552.001
    scope: file
    all:
      - id: discord-token-regex-source
      - id: micro-behaviors/fs/path/app-data::chromium-leveldb-local-storage
