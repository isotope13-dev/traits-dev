defaults:
  platforms: [android]
  for: [dex]
  attack: T1417.001
traits:
  - id: dex-whatsapp-message-view-test
    desc: DEX tests WhatsApp message view identifier
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Lkotlin/jvm/internal/Intrinsics;->areEqual'
      arg: {index: 1, kind: string, exact: 'com.whatsapp:id/message_text'}
  - id: dex-viber-message-view-lookup
    desc: DEX looks up Viber message view
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Landroid/view/accessibility/AccessibilityNodeInfo;->findAccessibilityNodeInfosByViewId'
      arg: {index: 0, kind: string, exact: 'com.viber.voip:id/textMessageView'}
composite_rules:
  # Call sites show messaging-view inspection near text reads, rather than
  # proving where any particular message was stored or transmitted.
  - id: android-accessibility-multiple-message-views
    desc: Accessibility message-view inspection across messaging apps
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: dex-whatsapp-message-view-test
      - id: dex-viber-message-view-lookup
      - id: micro-behaviors/hardware/input/accessibility::dex-accessibility-node-text-read
