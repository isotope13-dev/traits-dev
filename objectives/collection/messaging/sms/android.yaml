defaults:
  platforms: [android]
  for: [apk, zip]

traits:
  - id: android-sms-inbox-content-uri
    desc: References Android SMS inbox content URI
    crit: notable
    conf: 0.98
    for: [java, kotlin]
    if:
      type: text
      substr: content://sms/inbox

  - id: android-telephony-sms-inbox-uri
    desc: References Telephony SMS inbox URI
    crit: notable
    conf: 0.98
    for: [java, kotlin]
    if:
      type: text
      substr: Telephony.Sms.Inbox.CONTENT_URI

  - id: android-smsc-resource-member
    desc: Android APK embeds SMSC resource file
    crit: component
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: '^res/raw/smsc\.txt$'

  - id: android-mccmnc-resource-member
    desc: Android APK embeds MCC/MNC resource file
    crit: component
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: '^res/raw/mccmnc\.txt$'

  - id: android-operator-localized-text-assets
    desc: Android APK localized operator text assets
    crit: component
    conf: 0.88
    if:
      type: value
      path: "archive.members[*].path"
      regex: '^assets/texts/(ru_megafon|ru|ua)/rules_activity\.txt$'

  # Source-level variants request the same SMS control surface before
  # packaging a manifest. Keep these separate from manifest declarations.
  - id: android-source-send-sms-permission
    desc: Android source requests SMS send permission
    crit: notable
    conf: 0.9
    for: [java, kotlin]
    if:
      type: text
      substr: android.permission.SEND_SMS

  - id: android-source-receive-sms-permission
    desc: Android source requests SMS receive permission
    crit: notable
    conf: 0.9
    for: [java, kotlin]
    if:
      type: text
      substr: android.permission.RECEIVE_SMS

  - id: android-source-read-sms-permission
    desc: Android source requests SMS read permission
    crit: notable
    conf: 0.9
    for: [java, kotlin]
    if:
      type: text
      substr: android.permission.READ_SMS

  - id: android-source-sensitive-phone-permission
    desc: Android source requests phone data permission
    crit: notable
    conf: 0.9
    for: [java, kotlin]
    if:
      type: text
      regex: 'android\.permission\.(READ_CONTACTS|READ_PHONE_STATE|READ_PHONE_NUMBERS)'

  - id: android-compact-read-sms-token
    desc: Compact Android READ_SMS-style token
    crit: component
    conf: 0.94
    for: [apk, zip, dex]
    if:
      type: text
      regex: '(?i)\brea?dsms\b'

  - id: android-compact-send-sms-token
    desc: Compact Android SEND_SMS-style token
    crit: component
    conf: 0.94
    for: [apk, zip, dex]
    if:
      type: text
      regex: '(?i)\bsms_?send\b'

composite_rules:
  - id: android-compact-sms-tokens
    desc: Paired compact Android read/send SMS tokens
    crit: notable
    conf: 0.98
    for: [apk, zip, dex]
    all:
      - id: android-compact-read-sms-token
      - id: android-compact-send-sms-token

  - id: android-content-uri-sms-inbox-query
    desc: Queries the Android SMS inbox content URI
    crit: notable
    conf: 0.96
    for: [java, kotlin]
    all:
      - id: android-sms-inbox-content-uri
      - id: micro-behaviors/data/db/access::jvm-query-method-call
    near_bytes: 1400

  - id: android-telephony-sms-inbox-query
    desc: Queries the Telephony SMS inbox URI
    crit: notable
    conf: 0.97
    for: [java, kotlin]
    all:
      - id: android-telephony-sms-inbox-uri
      - id: micro-behaviors/data/db/access::jvm-query-method-call
    near_bytes: 500

  - id: android-source-sms-inbox-query
    desc: Queries the Android SMS inbox provider
    crit: notable
    conf: 0.96
    for: [java, kotlin]
    any:
      - id: android-content-uri-sms-inbox-query
      - id: android-telephony-sms-inbox-query

  - id: android-operator-sms-config-apk
    desc: Android APK bundles SMSC and MCC/MNC operator config resources
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: android-smsc-resource-member
      - id: android-mccmnc-resource-member
      - id: android-operator-localized-text-assets

  - id: android-sms-phone-permission-cluster
    desc: Android SMS and phone permission cluster
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/privilege/manifest::send-sms
      - id: micro-behaviors/os/privilege/manifest::receive-sms
    any:
      - id: micro-behaviors/os/privilege/manifest::read-sms
      - id: micro-behaviors/os/privilege/manifest::read-phone-numbers
      - id: micro-behaviors/os/privilege/manifest::read-phone-state
    needs: 2
    unless:
      - id: well-known/app/communication/sms-forwarder::smsforwarder-application
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-package

  - id: android-sms-loader-permission-cluster
    desc: Android staged loader requests SMS control
    crit: hostile
    conf: 0.98
    all:
      - id: android-sms-phone-permission-cluster
      - id: objectives/command-and-control/dropper/staged-loader::android-native-encrypted-stage-writer

  # Accessibility plus SEND/READ SMS and boot persistence is the banker
  # control surface (OTP theft + silent sends). Does not require
  # RECEIVE_SMS, which some packs omit while still reading the inbox.
  - id: android-accessibility-sms-banker-control
    desc: Android accessibility service with SMS send/read and boot persistence
    crit: hostile
    conf: 0.97
    attack: T1417.001,T1636.004,T1624.001
    mbc: F0004
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-config
      - id: micro-behaviors/os/privilege/manifest::send-sms
      - id: micro-behaviors/os/privilege/manifest::read-sms
      - id: micro-behaviors/os/service/daemon::android-boot-completed-action
    any:
      - id: micro-behaviors/os/privilege/manifest::sms-manager-class
      - id: micro-behaviors/os/privilege/manifest::sms-inbox-provider

  - id: android-source-sms-phone-permission-cluster
    desc: Android source requests SMS control and phone data access
    crit: suspicious
    conf: 0.96
    for: [java, kotlin]
    unless:
      - id: well-known/app/system/maestro::android-test-driver-context
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-package
    all:
      - id: android-source-send-sms-permission
      - id: android-source-receive-sms-permission
      - id: android-source-read-sms-permission
      - id: android-source-sensitive-phone-permission

  - id: android-profile-sms-rat
    desc: Android SMS-control source with encrypted public-profile C2
    crit: hostile
    conf: 0.995
    for: [java, kotlin]
    attack: T1636.004,T1102.001,T1573.001
    mbc: F0004,B0030
    all:
      - id: android-source-sms-phone-permission-cluster
      - id: objectives/command-and-control/channel/deaddrop/public-service::public-profile-encrypted-c2-resolver
