defaults:
  platforms: [android]
  for: [apk, zip]

composite_rules:
  - id: android-sms-sideload-hidden-iframe
    desc: SMS sideload kit hides an iframe
    crit: hostile
    conf: 0.94
    scope: outer
    for: [zip, android_apk, xml, html, javascript]
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::request-install-packages-binary-manifest
      - id: micro-behaviors/data/format/html::hidden-iframe
  - id: android-sms-overlay-sideload
    desc: SMS sideload kit draws overlay windows
    crit: hostile
    conf: 0.95
    scope: outer
    for: [zip, android_apk, xml]
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::request-install-packages-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::system-alert-window-binary-manifest
  - id: android-sms-overlay-contact-harvest
    desc: Overlay kit reads SMS and contacts
    crit: hostile
    conf: 0.95
    for: [xml]
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::system-alert-window-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::read-contacts-binary-manifest
  - id: android-sms-overlay-call-harvest
    desc: Overlay kit reads SMS and places calls
    crit: hostile
    conf: 0.95
    for: [xml]
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::system-alert-window-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::call-phone-binary-manifest
  - id: android-sms-overlay-send-harvest
    desc: Overlay kit reads and sends SMS
    crit: hostile
    conf: 0.95
    for: [xml]
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::system-alert-window-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::send-sms-binary-manifest
  - id: android-sms-overlay-receive-harvest
    desc: Overlay kit reads and receives SMS
    crit: hostile
    conf: 0.95
    for: [xml]
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::system-alert-window-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::receive-sms-binary-manifest
  - id: android-sms-contact-call-harvest
    desc: Manifest grants SMS contacts and calls
    crit: hostile
    conf: 0.94
    for: [xml]
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::read-contacts-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::call-phone-binary-manifest
  - id: android-sms-send-contact-harvest
    desc: Manifest grants SMS send and contacts
    crit: hostile
    conf: 0.94
    for: [xml]
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::send-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::read-contacts-binary-manifest
  - id: android-sms-send-receive-kit
    desc: Manifest grants SMS read send receive
    crit: hostile
    conf: 0.94
    for: [xml]
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::send-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::receive-sms-binary-manifest
  - id: android-sms-phone-harvest
    desc: Manifest grants SMS send and phone state
    crit: hostile
    conf: 0.94
    for: [xml]
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::send-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::read-phone-state-binary-manifest
  - id: android-sms-call-send-harvest
    desc: Manifest grants SMS send and phone calls
    crit: hostile
    conf: 0.94
    for: [xml]
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::send-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::call-phone-binary-manifest
  - id: android-sms-boot-persist
    desc: Manifest grants SMS send after reboot
    crit: hostile
    conf: 0.94
    for: [xml]
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::send-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::receive-boot-completed-binary-manifest
  - id: android-sms-write-harvest
    desc: Manifest grants SMS read send write
    crit: hostile
    conf: 0.94
    for: [xml]
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::send-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::write-sms-binary-manifest
  - id: android-sms-write-forward
    desc: Manifest grants SMS send receive write
    crit: hostile
    conf: 0.94
    for: [xml]
    all:
      - id: micro-behaviors/os/privilege/manifest::send-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::receive-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::write-sms-binary-manifest
  - id: android-sms-forward-boot
    desc: Manifest grants SMS send receive at boot
    crit: hostile
    conf: 0.94
    for: [xml]
    all:
      - id: micro-behaviors/os/privilege/manifest::send-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::receive-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::receive-boot-completed-binary-manifest
  - id: android-sms-contact-call-log-harvest
    desc: Manifest grants SMS contacts and call log
    crit: hostile
    conf: 0.94
    for: [xml]
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::read-contacts-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::read-call-log-binary-manifest
  - id: android-sms-send-contact-call
    desc: Manifest grants SMS send contacts and calls
    crit: hostile
    conf: 0.94
    for: [xml]
    all:
      - id: micro-behaviors/os/privilege/manifest::send-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::read-contacts-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::call-phone-binary-manifest
  - id: android-sms-outgoing-phone-harvest
    desc: Manifest grants SMS and outgoing-call watch
    crit: hostile
    conf: 0.94
    for: [xml]
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::read-phone-state-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::process-outgoing-calls-binary-manifest
  - id: android-sms-receive-phone-harvest
    desc: Manifest grants SMS receive and phone state
    crit: hostile
    conf: 0.93
    for: [xml]
    unless:
      - id: well-known/app/communication/sms-forwarder::smsforwarder-application
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-application
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-package
    all:
      - id: micro-behaviors/os/privilege/manifest::receive-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::read-phone-state-binary-manifest
  - id: android-sms-read-receive-kit
    desc: Manifest grants SMS read and receive
    crit: hostile
    conf: 0.93
    for: [xml]
    unless:
      - id: well-known/app/communication/sms-forwarder::smsforwarder-application
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-application
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-package
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::receive-sms-binary-manifest
  - id: android-sms-read-receive-phone
    desc: Manifest grants SMS read receive and phone
    crit: hostile
    conf: 0.94
    for: [xml]
    unless:
      - id: well-known/app/communication/sms-forwarder::smsforwarder-application
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-application
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-package
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::receive-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::read-phone-state-binary-manifest
