defaults:
  platforms: [android]
  for: [apk, zip]

composite_rules:
  - id: android-sms-sideload-hidden-iframe
    desc: SMS sideload kit hides an iframe
    crit: hostile
    conf: 0.94
    scope: outer
    for: [zip, android_apk, xml, html, javascript]
    unless:
      - id: metadata/file/naming::test-directory-component
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-declared-grant
      - id: metadata/permission/management::android-request-install-packages-request
      - id: micro-behaviors/ui/window/visibility::hidden-iframe
  - id: android-sms-overlay-sideload
    desc: SMS sideload kit draws overlay windows
    crit: hostile
    conf: 0.95
    scope: outer
    for: [zip, android_apk, xml]
    unless:
      - id: well-known/app/communication/sms-forwarder::smsforwarder-manifest-identity
      - id: well-known/app/communication/android-incallui::incallui-manifest-identity
      - id: metadata/permission/manifest::android-framework-manifest
      - id: metadata/file/naming::test-directory-component
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-declared-grant
      - id: metadata/permission/management::android-request-install-packages-request
      - id: metadata/permission/manifest::android-system-alert-window-request
  - id: android-sms-overlay-contact-harvest
    desc: Overlay kit reads SMS and contacts
    crit: hostile
    conf: 0.95
    for: [zip, android_apk, xml]
    scope: outer
    unless:
      - id: well-known/app/communication/sms-forwarder::smsforwarder-manifest-identity
      - id: well-known/app/communication/android-incallui::incallui-manifest-identity
      - id: metadata/permission/manifest::android-framework-manifest
      - id: metadata/file/naming::test-directory-component
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-declared-grant
      - id: metadata/permission/manifest::android-system-alert-window-request
      - id: micro-behaviors/os/privilege/manifest::read-contacts-declared-grant
  - id: android-sms-overlay-call-harvest
    desc: Overlay kit reads SMS and places calls
    crit: hostile
    conf: 0.95
    for: [zip, android_apk, xml]
    scope: outer
    unless:
      - id: well-known/app/communication/sms-forwarder::smsforwarder-manifest-identity
      - id: well-known/app/communication/android-incallui::incallui-manifest-identity
      - id: metadata/permission/manifest::android-framework-manifest
      - id: metadata/file/naming::test-directory-component
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-declared-grant
      - id: metadata/permission/manifest::android-system-alert-window-request
      - id: micro-behaviors/os/privilege/manifest::call-phone-declared-grant
  - id: android-sms-overlay-send-harvest
    desc: Overlay kit reads and sends SMS
    crit: hostile
    conf: 0.95
    for: [zip, android_apk, xml]
    scope: outer
    unless:
      - id: well-known/app/communication/sms-forwarder::smsforwarder-manifest-identity
      - id: well-known/app/communication/android-incallui::incallui-manifest-identity
      - id: metadata/permission/manifest::android-framework-manifest
      - id: metadata/file/naming::test-directory-component
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-declared-grant
      - id: metadata/permission/manifest::android-system-alert-window-request
      - id: micro-behaviors/os/privilege/manifest::send-sms-declared-grant
  - id: android-sms-overlay-receive-harvest
    desc: Overlay kit reads and receives SMS
    crit: hostile
    conf: 0.95
    for: [zip, android_apk, xml]
    scope: outer
    unless:
      - id: well-known/app/communication/sms-forwarder::smsforwarder-manifest-identity
      - id: well-known/app/communication/android-incallui::incallui-manifest-identity
      - id: metadata/permission/manifest::android-framework-manifest
      - id: metadata/file/naming::test-directory-component
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-declared-grant
      - id: metadata/permission/manifest::android-system-alert-window-request
      - id: micro-behaviors/os/privilege/manifest::receive-sms-declared-grant
  # Full SMS interception and reply rights together with the ability to ask
  # for apps to be uninstalled and to place calls. Messaging clients need the
  # SMS cluster; none of them need to remove other packages. SMS-stealing
  # banking trojans use removal to get rid of the real banking app or of
  # security tools while they relay one-time codes.
  - id: android-sms-control-with-package-removal
    desc: Reads, sends and receives SMS, can remove packages
    crit: hostile
    conf: 0.92
    attack: T1636.004,T1629.001
    for: [zip, android_apk, apk_android, xml]
    scope: outer
    unless:
      - id: well-known/app/communication/sms-forwarder::smsforwarder-manifest-identity
      - id: well-known/app/communication/android-incallui::incallui-manifest-identity
      - id: metadata/permission/manifest::android-framework-manifest
      - id: metadata/file/naming::test-directory-component
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-declared-grant
      - id: micro-behaviors/os/privilege/manifest::send-sms-declared-grant
      - id: micro-behaviors/os/privilege/manifest::receive-sms-declared-grant
      - id: micro-behaviors/os/package-manager/sideload::delete-packages-apk-manifest-grant
      - id: micro-behaviors/os/privilege/manifest::call-phone-declared-grant
