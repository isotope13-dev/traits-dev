defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.95
traits:
  - id: dex-remote-delete-sms-command
    desc: DELETE_SMS command token
    if:
      type: text
      exact: DELETE_SMS
  - id: dex-remote-send-sms-command
    desc: SEND_SMS command token
    if:
      type: text
      exact: SEND_SMS
  - id: dex-remote-app-list-command
    desc: GET_APP_LIST command token
    if:
      type: text
      exact: GET_APP_LIST
composite_rules:
  # Calls are nearby in DEX code; they alone do not establish network delivery.
  - id: dex-sms-structured-record-cluster
    desc: Phone, content and SMS list builder call cluster
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/messaging/send::dex-sms-record-phone-setter
      - id: micro-behaviors/communications/messaging/send::dex-sms-record-content-setter
      - id: micro-behaviors/communications/messaging/send::dex-sms-record-list-adder
  - id: android-sms-records-with-remote-command-clues
    desc: Structured SMS records and device command vocabulary
    crit: hostile
    conf: 0.96
    for: [android_apk, apk_android, apk, zip, dex]
    scope: archive
    all:
      - id: dex-sms-structured-record-cluster
      - id: micro-behaviors/communications/messaging/send::dex-sms-root-content-uri
      - id: dex-remote-delete-sms-command
      - id: dex-remote-send-sms-command
      - id: dex-remote-app-list-command
      - id: metadata/permission/storage::android-read-sms-apk-request
