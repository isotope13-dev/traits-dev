# A default-SMS handler that also holds device admin can read, send and
# hide every message, including banking one-time codes, and resist removal.
# Phone-sync tools take the SMS role with accessibility but not device admin.
defaults:
  platforms: [android]
  for: [xml]
  attack: T1636.004,T1582

composite_rules:
  - id: android-manifest-sms-role-with-control
    desc: Default-SMS manifest also holds device admin
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/os/privilege/manifest::axml-sms-deliver-action
      - id: metadata/permission/network::android-receive-sms-request-axml
      - id: metadata/permission/network::android-send-sms-request-axml
      - id: micro-behaviors/os/privilege/manifest::axml-device-admin-receiver-binding
