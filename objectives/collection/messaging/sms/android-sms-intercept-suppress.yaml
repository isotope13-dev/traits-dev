# Receivers that read each incoming SMS, abort the ordered SMS_RECEIVED
# broadcast so the message never reaches the inbox, and ship it to a server.
# Spam filters abort broadcasts too, but do not also hide their own launcher
# icon or report to a bare-IP server.
defaults:
  platforms: [android]
  for: [dex]
  crit: hostile
  attack: T1636.004,T1517

composite_rules:
  - id: android-sms-intercept-suppress-upload
    desc: Reads incoming SMS, hides it from the inbox and uploads it
    conf: 0.94
    all:
      - id: micro-behaviors/os/message/intent::dex-abort-broadcast-call
      - id: micro-behaviors/os/message/intent::android-dex-sms-pdu-message-read
      - id: micro-behaviors/communications/http/request/client::dex-url-open-connection-call
    any:
      - id: micro-behaviors/os/application/config::dex-component-disable-call
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
