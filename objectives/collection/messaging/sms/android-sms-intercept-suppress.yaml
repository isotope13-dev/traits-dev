# Receivers that read each incoming SMS, abort the ordered SMS_RECEIVED
# broadcast so the message never reaches the inbox, and communicate with a
# remote service. Pair the interception with transport and concealment clues.
defaults:
  platforms: [android]
  for: [dex]
  crit: hostile
  attack: T1636.004,T1517

traits:
  - id: dex-sms-upload-route
    desc: DEX names an SMS upload route
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)^(/[\w-]{1,28}){0,2}/(save|upload)[_/](sms|msg|messages?)$'

  - id: dex-companion-media-upload-route
    desc: DEX names a media upload route
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)^(/[\w-]{1,28}){0,2}/(save|upload)[_/](photos?|images?|capture)$'

composite_rules:
  - id: android-sms-intercept-suppress-upload
    desc: Reads incoming SMS, hides it from the inbox and uploads it
    conf: 0.94
    all:
      - id: micro-behaviors/os/message/intent::dex-abort-broadcast-call
      - id: micro-behaviors/os/message/intent::android-dex-sms-pdu-message-read
      - id: micro-behaviors/communications/http/request/client::dex-url-open-connection-call
    any:
      - id: micro-behaviors/os/application/config::dex-component-disable-call
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url

  - id: android-sms-intercept-suppress-socket
    desc: Suppresses received SMS and disables a component with socket I/O
    conf: 0.96
    all:
      - id: micro-behaviors/os/message/intent::dex-abort-broadcast-call
      - id: micro-behaviors/os/message/intent::android-dex-sms-pdu-message-read
      - id: micro-behaviors/os/application/config::dex-component-disable-call
      - id: micro-behaviors/communications/messaging/send::dex-socket-input-call
      - id: micro-behaviors/communications/messaging/send::dex-socket-output-call

  # Interface-based HTTP clients can retain endpoint strings after stripping
  # the framework names and direct URLConnection calls from application code.
  - id: android-sms-intercept-suppress-annotated-upload
    desc: Android suppresses incoming SMS and carries separate SMS and media routes
    conf: 0.95
    all:
      - id: micro-behaviors/os/message/intent::dex-abort-broadcast-call
      - id: micro-behaviors/os/message/intent::android-dex-sms-pdu-message-read
      - id: micro-behaviors/data/decode/base64/call::dex-base64-decode-call
      - id: dex-sms-upload-route
      - id: dex-companion-media-upload-route

  - id: android-source-sms-intercept-suppress-socket
    desc: Suppresses received SMS and disables a component with a TCP connection
    conf: 0.94
    for: [java, kotlin]
    all:
      - id: micro-behaviors/os/message/intent::android-sms-message-collection-source
      - id: micro-behaviors/os/package-manager/config::android-component-disable
      - id: micro-behaviors/communications/socket/connect/tcp::java-socket-connect
    any:
      - id: micro-behaviors/os/message/intent::java-abort-broadcast-call
      - id: micro-behaviors/os/message/intent::kotlin-abort-broadcast-call
