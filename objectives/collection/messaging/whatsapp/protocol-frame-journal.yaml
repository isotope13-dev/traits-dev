# A WhatsApp protocol capture helper that records both directions and writes
# serialized records to a local file. The feature is opt-in, so this reports
# suspicious collection capability rather than treating diagnostics as theft.
defaults:
  platforms: [unix, windows]
  for: [javascript]

traits:
  - id: whatsapp-frame-capture-in
    desc: Captures incoming WhatsApp frames
    crit: notable
    if:
      type: text
      substr: 'frameIn(frame, handled)'

  - id: whatsapp-frame-capture-out
    desc: Captures outgoing WhatsApp frames
    crit: notable
    if:
      type: text
      substr: 'frameOut(frame)'

  - id: whatsapp-frame-journal-json
    desc: Serializes captured records as JSON
    crit: notable
    if:
      type: text
      substr: 'JSON.stringify(entry)'

  - id: whatsapp-frame-journal-append
    desc: Appends records to a local file
    crit: notable
    if:
      type: text
      substr: 'appendFileSync(currentFile, line)'

composite_rules:
  - id: whatsapp-protocol-frame-local-journal
    desc: WhatsApp frames are captured and journaled locally
    crit: suspicious
    conf: 0.91
    scope: file
    all:
      - id: whatsapp-frame-capture-in
      - id: whatsapp-frame-capture-out
      - id: whatsapp-frame-journal-json
      - id: whatsapp-frame-journal-append
