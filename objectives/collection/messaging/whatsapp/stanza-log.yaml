# A WhatsApp library that keeps its own journal of who messages the host
# account.
#
# The message decoder of @nyzzpediaa/baileys-new 1.0.8 (lib/Utils/
# decode-wa-message.js) appends the raw attribute block of every incoming
# stanza -- the fields that carry each correspondent's phone-number/LID pair,
# sender_pn, participant_lid, addressing_mode -- to a JSON array file under
# the process working directory (HikariTmp/message-attrs-log.json), reading
# the file back and keeping the last thirty entries across runs.
#
# Nothing is sent anywhere, and the module's own comment calls it temporary
# debugging, which is why this stays suspicious rather than hostile: a
# published dependency silently maintaining a correspondent-metadata journal
# of the host account's conversations crosses a privacy boundary no bot
# author opted into, but a developer branch debugging protocol fields reads
# the same shape.
#
# Evidence is same-file co-occurrence, not a proven data flow: the decoder
# that reads the addressing pair is the module that performs the
# JSON.stringify write, within one file's span. A decoder that reads the
# addressing pair with no working-directory JSON write, or a config writer
# with no WhatsApp addressing material, stays silent -- both legs are
# required, bound by proximity.
#
# Worked example: @nyzzpediaa/baileys-new 1.0.8 lib/Utils/decode-wa-message.js
# (absent from that family's 1.0.6 and 1.0.7).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: whatsapp-message-attrs-json-log
    desc: Message decoder journals stanza attrs as JSON
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-stanza-addressing-attr-read
      - id: micro-behaviors/fs/write/file/full::json-stringify-write-sync
      - id: micro-behaviors/fs/directory/cwd::process-cwd-call
    # The addressing reads sit in extractAddressingContext near the top of
    # the decoder; the logger block sits a few kilobytes below. The bound
    # keeps the three legs in one decoder module without reading two
    # unrelated modules of the same file as one journal.
    near_bytes: 4600
