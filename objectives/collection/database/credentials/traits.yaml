defaults:
  platforms: [unix, windows]
  for: [php, c, cpp, python, shell]
  attack: T1552
composite_rules:
  - id: database-credential-harvesting
    desc: Harvesting database credentials
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/config/web::database-config-path
      - id: micro-behaviors/data/db/config::multiple-database-credential-keys
      # Both legs above are strings, and every MySQL client, ORM, backup
      # script, and admin tool names `my.cnf` next to a user/password/host
      # parameter -- Ansible's mysql_user and mysql_db modules did, and were
      # convicted as harvesters. Harvesting means the program *reads* the
      # config file; without a read there is no collection, only configuration.
      - id: micro-behaviors/fs/file/read/
    # A config-path mention and credential-shaped prose are common in web
    # plugin documentation. Credential harvesting needs these signals close
    # together in the same source region; distant documentation sections do
    # not establish a read or collection operation.
    near_bytes: 4096
    # Keep the config path, credential keys, and read operation in one small
    # code block. This excludes honeypot/fake-filesystem tables where a MySQL
    # path is merely simulated near unrelated login input handling.
    near_lines: 32
    unless:
      - id: micro-behaviors/crypto/library/blockchain/
      - id: well-known/lib/format/deb-package/
      - id: well-known/app/publishing/civicrm/
      - id: well-known/tool/offensive/sic-security/
      - id: well-known/tool/development/charm-tools::charm-tools-test-layer-path
      - id: well-known/app/publishing/wordpress-plugins/
      - id: metadata/library/runtime::upstream-php-source
      - id: micro-behaviors/data/db/mysql::pymysql
      - id: well-known/lib/data/pymysql::pymysql-package-path
