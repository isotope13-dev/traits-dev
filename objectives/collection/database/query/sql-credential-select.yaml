defaults:
  platforms: [netscaler, appliance, unix]
  for: [scripts, binaries, go, java, kotlin, csharp, swift, zig, elf]
  attack: T1041

traits:
  - id: netscaler-credential-sql-query-source
    desc: SQL query selecting credential fields
    crit: notable
    conf: 0.88
    for: [class, java, kotlin]
    if:
      type: text
      regex: '(?i)SELECT .{0,80}(username|password|credentials)'
