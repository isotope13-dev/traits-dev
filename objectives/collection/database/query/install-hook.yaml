# Migrated from the legacy install-hook trigger bucket; database query output is
# a query collection technique.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, shell]
  attack: T1195.002
  mbc: E1041


composite_rules:
  - id: database-query-output-to-data
    desc: Database query output to /data
    crit: suspicious
    conf: 0.97
    for: [shell]
    all:
      - id: micro-behaviors/fs/write/file/redirect::shell-output-redirect-to-data
    any:
      - id: objectives/discovery/host/software::mysql-client-name
      - id: objectives/discovery/host/software::mongo-client-name
      - id: objectives/discovery/host/software::psql-client-name
      - id: objectives/discovery/host/software::redis-client-name
      - id: objectives/discovery/host/software::sqlite-client-name
