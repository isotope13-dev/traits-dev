# Bulk export of whole Elasticsearch indices to a local NDJSON dump
# (SpiderLabs "RAVEN" data-heist module, 2026).
#
# The exfil path opens a Point-in-Time (or a Scroll) and walks it with
# search_after, streaming every document's _source to a newline-delimited JSON
# file on disk -- a full-index dumper rather than an application query. Ordinary
# clients paginate, but writing an entire index verbatim to a raw .ndjson dump
# is the collection stage of a data heist. The pagination markers (_pit /
# _search/scroll, search_after) and the .ndjson sink are the artifact tokens;
# the composite requires all three together so normal paginated reads that
# never dump to disk do not match.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1005

composite_rules:
  - id: es-elasticsearch-bulk-index-dump
    desc: Paginates an entire Elasticsearch index to a local NDJSON dump
    crit: suspicious
    conf: 0.86
    all:
      - id: micro-behaviors/data/db/elasticsearch::es-pit-or-scroll-cursor
      - id: micro-behaviors/data/db/elasticsearch::es-search-after-pagination
      - id: micro-behaviors/data/serialize/json::ndjson-filename-reference
    near_bytes: 1400
