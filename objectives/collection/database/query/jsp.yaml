# A server page that takes a SQL string from the request and runs it is a
# database console webshell. The parameter name and the execute() argument
# are the two halves; either one alone is just JDBC.
defaults:
  platforms: [unix, windows]
  for: [jsp, java, html, javascript, python]
  attack: T1005
traits:
  - id: jsp-sql-request-parameter
    desc: JSP reads a SQL parameter
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'getParameter\s*\(\s*["'']sql\w*["'']\s*\)'
composite_rules:
  - id: jsp-request-sql-console
    desc: JSP runs a request SQL query
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: jsp-sql-request-parameter
      - id: micro-behaviors/data/db/query::execute-sql-variable
  - id: jsp-oracle-database-bulk-export
    for: [jsp]
    desc: JSP dumps Oracle database contents to local disk
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: objectives/command-and-control/backdoor/webshell/recon::jsp-oracle-all-table-dump-source
      - id: micro-behaviors/data/serialize/sql::jsp-insert-row-text
      - id: micro-behaviors/fs/write/file/handle::java-fileoutputstream-source

