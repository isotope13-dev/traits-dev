defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1005

traits:
  - id: sql-insert-feedback-whois-application-content
    desc: SQL insert feedback whois application content
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'whois,.{0,6}application,.{0,6}content'
    not:
      - substr: application/whoispp
