# A whole-table Snowflake unload compressed into a named stage. This captures
# database collection and staging without relying on an attacker-chosen stage,
# database, schema, or table name.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, pe, class]

composite_rules:
  - id: compressed-whole-table-stage-unload
    desc: Snowflake whole-table GZIP stage unload
    crit: suspicious
    conf: 0.94
    attack: T1530,T1074.002,T1560.001
    all:
      - id: micro-behaviors/data/db/snowflake::stage-unload
      - id: micro-behaviors/data/db/sql::sql-select-all-qualified-table
      - id: micro-behaviors/data/db/snowflake::gzip-unload-option
    near_bytes: 1200
