# The required bypass distinguishes unauthorized reads from ordinary clients.
# No particular table, field, SQL restriction, or credential source is required:
# the disclosed workflow reads any Archibus-managed table.
defaults:
  platforms: [unix, windows]
  for: [python, powershell, shell, javascript, java, text, jsp]

composite_rules:
  - id: archibus-unauthenticated-record-query
    desc: Queries database records through the DWR authentication bypass
    crit: hostile
    conf: 0.99
    attack: T1213
    all:
      - id: objectives/evasion/security-bypass/auth::archibus-dwr-session-inheritance
      - id: micro-behaviors/communications/rpc::archibus-record-query-call
    near_bytes: 2048
