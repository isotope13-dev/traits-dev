# Authenticated harvesting through Firestore rules that expose a whole user
# collection. The response-field matcher is tied to Firestore's typed REST JSON
# representation and requires multiple user-data fields, avoiding generic prose
# or a lone `email` property.
defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript, go]
  attack: T1005

composite_rules:
  - id: low-priv-firestore-user-directory-harvest
    for: [shell, python, javascript]
    desc: Creates a Firebase user then harvests the users collection
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/services/firebase::firebase-rest-signup-token-flow
      - id: micro-behaviors/communications/http/services/firebase::firestore-rest-project-root
      - id: micro-behaviors/communications/http/services/firebase::firestore-rest-users-collection
      - id: micro-behaviors/communications/http/authorization-header::bearer-prefix
      - id: metadata/lang/source/syntax/member::firestore-multiple-user-pii-field-access
