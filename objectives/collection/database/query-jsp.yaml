# A server page that takes a SQL string from the request and runs it is a
# database console webshell. The parameter name and the execute() argument
# are the two halves; either one alone is just JDBC.
defaults:
  platforms: [unix, windows]
  for: [jsp, java, html, javascript, python]
  attack: T1005
traits:
  - id: jsp-webapps-root-directory
    desc: JSP references Java webapps root directory
    for: [jsp]
    crit: notable
    if:
      type: text
      regex: '(?i)[/\\]webapps[/\\]ROOT[/\\]'
  - id: jsp-credential-column-list
    desc: JSP selects username and password columns
    for: [jsp]
    crit: notable
    if:
      type: text
      regex: '(?i)username\s*,\s*password'
  - id: jsp-jdbc-variable-query
    desc: JSP executes a variable JDBC query
    for: [jsp]
    crit: notable
    if:
      type: text
      regex: '\.executeQuery\s*\(\s*[A-Za-z_$][\w$]*\s*\)'
composite_rules:
  - id: jsp-jdbc-webroot-table-dump
    for: [jsp]
    desc: JSP dumps database tables into webroot
    crit: hostile
    conf: 0.98
    all:
      - id: jsp-webapps-root-directory
      - id: micro-behaviors/data/db/schema/introspection::jdbc-all-tables-metadata-source
      - id: micro-behaviors/data/db/schema/introspection::jdbc-show-create-table-source
      - id: micro-behaviors/data/db/read/records::jdbc-select-all-source
      - id: micro-behaviors/fs/write/file/stream::java-fileoutputstream-source

  - id: jsp-jdbc-credential-column-response
    for: [jsp]
    desc: JSP sends queried credential columns in response
    crit: hostile
    conf: 0.97
    all:
      - id: jsp-credential-column-list
      - id: jsp-jdbc-variable-query
      - id: micro-behaviors/data/db/read/column::jsp-resultset-string-read
      - id: micro-behaviors/communications/http/response::jsp-response-print-syntax

  - id: jsp-oracle-database-bulk-export
    for: [jsp]
    desc: JSP dumps Oracle database contents to local disk
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/source/language::jsp-server-page
      - id: objectives/command-and-control/backdoor/webshell/recon::jsp-oracle-all-table-dump-source
      - id: micro-behaviors/data/serialize/sql::jsp-insert-row-text
      - id: micro-behaviors/fs/write/file/stream::java-fileoutputstream-source
