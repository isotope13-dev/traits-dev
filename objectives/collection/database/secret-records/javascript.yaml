defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1005

traits:
  - id: sql-selects-encrypted-key-fields
    desc: SQL query selects encrypted key fields
    crit: suspicious
    conf: 0.95
    if:
      type: literal
      regex: '(?i)\bSELECT\b.{0,160}\bencrypted[_ -]?(key|value)\b'
