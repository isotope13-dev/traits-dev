# Daemon-style Outlook mailbox harvesting in the office-cli pattern from
# AA26-281A: an OAuth client-credentials identity pulls another user's mailbox
# in bulk date windows. Co-occurrence only; no unauthorized-destination claim
# is asserted.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: suspicious
  conf: 0.9
  attack: T1114.002
composite_rules:
  - id: graph-daemon-mailbox-harvest
    desc: Daemon credentials pull another mailbox across date windows
    all:
      - id: micro-behaviors/communications/http/oauth::oauth-client-credentials-grant-type
      - id: micro-behaviors/communications/http/services/microsoft::graph-target-user-mailbox-path
      - id: micro-behaviors/communications/http/services/microsoft::graph-mail-received-date-filter
    near_bytes: 8192
