# Exchange audit-log shapes associated with automated mailbox collection.
# The individual fields are neutral log facts; the suspicious composites
# require the unusual client and successful message-content access together.
defaults:
  platforms: [unix, windows]
  for: [json, text]
  attack: T1114.002

traits:
  - id: mailitems-access-exfil-api-id
    desc: Reported mail-harvest API identifier
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: c999ed3e-27ae-4cb3-b3a2-46b056af63d3

  # This GUID is a first-party Microsoft application id, not an attacker-owned
  # one: the campaign report names it because the operator rode a stolen OAuth
  # token for that app. So it means nothing on its own -- it appears verbatim in
  # every first-party allowlist (Elastic's own "M365 Exchange Mailbox Accessed by
  # Unusual Client" detection rule excludes it by name), and a bare-substring
  # match at `suspicious` mislabels those catalogs. Anchored to the audit-log
  # field that actually carries a ClientAppId, and left as one leg of the
  # `mailitems-access-exfil-toolkit` pair signature.
  - id: mailitems-access-exfil-client-app-id
    desc: Mail access by reported campaign GUID
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)ClientAppId[^\n]{0,24}9199bf20-a13f-4107-85dc-02114787ef48'

composite_rules:
  - id: mailitems-access-exfil-toolkit
    desc: Exchange message harvesting uses the reported client and API identifier pair
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/telemetry/logging/event::mailitems-accessed-operation
      - id: micro-behaviors/os/telemetry/logging/event::mailitems-access-bind
      - id: mailitems-access-exfil-api-id
      - id: mailitems-access-exfil-client-app-id
    near_bytes: 1800
