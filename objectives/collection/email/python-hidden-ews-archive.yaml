# Equivalent implementation of the reported EWS collector. Protocol operations
# and archive APIs survive changes to the program's name, key, host and labels.
# These are co-occurring capabilities, not a proven source-to-archive flow.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: suspicious
  conf: 0.9
  attack: T1114.002,T1074.001
composite_rules:
  - id: python-ews-hidden-archive-staging
    desc: EWS reads with hidden in-memory ZIP staging
    all:
      - id: micro-behaviors/communications/email/access/exchange::ews-soap-mailbox-read
      - id: micro-behaviors/fs/path/archive::hidden-archive-path
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-writer
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-write-string
