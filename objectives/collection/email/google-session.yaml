defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: "T1539,T1114"

composite_rules:
  - id: google-session-mailbox-recon
    desc: "Mailbox reconnaissance with Google session clues"
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/cookie-store::browser-page-cookie-read
      - id: micro-behaviors/communications/http/services/google::google-mail-sync-endpoint
      - id: micro-behaviors/communications/http/services/google::google-security-account-navigation

  - id: gmail-session-feed-message-relay
    desc: Gmail session feed and raw-message reads with HTTP POST
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/google::gmail-atom-feed-url
      - id: micro-behaviors/communications/http/services/google::gmail-raw-message-view-url
      - id: micro-behaviors/communications/http/request/credentials/literal::fetch-credentials-include-any
      - id: micro-behaviors/communications/http/post::js-fetch-post-request
  - id: gmail-extension-scheduled-mailbox-harvest
    desc: Scheduled Gmail feed and raw-message session reads
    # Mail clients and local backups can perform all four operations.
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/time/schedule/webextension::chrome-alarms-on-alarm
      - id: micro-behaviors/communications/http/services/google::gmail-atom-feed-url
      - id: micro-behaviors/communications/http/services/google::gmail-raw-message-view-url
      - id: micro-behaviors/communications/http/request/credentials/literal::fetch-credentials-include-any
