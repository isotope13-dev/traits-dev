defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: "T1539,T1114"

composite_rules:
  - id: google-session-mailbox-recon
    desc: "Mailbox reconnaissance with Google session clues"
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/cookie-store::browser-page-cookie-read
      - id: micro-behaviors/communications/http/services/google::google-mail-sync-endpoint
      - id: micro-behaviors/communications/http/services/google::google-security-account-navigation
