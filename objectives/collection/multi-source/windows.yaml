defaults:
  for: [pe, dll]
  platforms: [windows]

composite_rules:
- id: windows-polling-key-clipboard-screen-surveillance
  desc: Polled keystroke and clipboard recording with screen capture
  crit: hostile
  conf: 0.97
  attack: T1056.001,T1113,T1115
  mbc: B0015,B0047
  all:
  - id: objectives/collection/clipboard/capture::polling-key-recorder-clipboard-copy
  - id: micro-behaviors/hardware/display/screenshot::gdi-bitmap-and-window-api-set
- id: windows-user-activity-collection-triad
  desc: Keylogging screenshot clipboard collection
  crit: hostile
  conf: 0.95
  attack: T1056.001
  mbc: B0015
  all:
  - id: objectives/collection/keylog/hook::windows-hook-window-title-keylogger
  - id: micro-behaviors/hardware/display/screenshot::gdi-bitmap-and-window-api-set
  - id: objectives/collection/clipboard/capture::windows-clipboard-read-with-input-theft
  any:
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/process/sync/mutex::mutex-instance-check
  - id: micro-behaviors/hardware/input/keyboard/poll::key-state-ui-timer-pe-api-set
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
  - id: well-known/tool/reverse-engineering/resource-hacker/
  - id: well-known/tool/sysadmin/sandboxie/
