defaults:
  platforms: [android]
  for: [apk, zip]

composite_rules:
  - id: android-camera-screen-capture
    desc: Android camera and screen capture
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/hardware/display/camera::android-camera-capture-capability
      - id: micro-behaviors/hardware/display/screenshot::android-screen-capture-capability
  - id: android-sms-camera-screen-spyware
    for: [android_apk, zip, java, kotlin]
    desc: Android staged spyware captures camera, screen, and SMS data
    crit: hostile
    conf: 0.995
    mbc: "F0004"
    all:
      - id: objectives/collection/multi-source::android-camera-screen-capture
      - id: micro-behaviors/os/message/intent::android-sms-originating-address-read
      - id: micro-behaviors/os/message/intent::android-sms-message-body-read
      - id: micro-behaviors/process/interpreter/webview::webview-remote-content-shell
  - id: android-audio-video-spyware
    desc: Android audio video spyware
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/hardware/display/camera::android-camera-capture-capability
      - id: micro-behaviors/hardware/input/media::android-recording-api-or-audio-authority
      - id: micro-behaviors/hardware/display/screenshot::android-screen-capture-capability
  # Sideload permission plus microphone capture. Live-stream apps may record
  # audio, but requesting the ability to install other packages beside the
  # mic is the dropper/surveillance pairing.
