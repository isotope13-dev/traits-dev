defaults:
  platforms: [windows, unix]
  for: [pyc]
composite_rules:
  - id: pyc-keylog-screen-clipboard-agent
    desc: Channel keylogger includes screen and clipboard collection references
    crit: hostile
    conf: 0.97
    attack: T1056.001,T1113,T1115
    all:
      - id: objectives/exfiltration/stealer/multi-item::pyc-discord-buffered-keystroke-exfiltration
      - id: well-known/lib/ui/pyautogui::pyc-pyautogui-reference
      - id: micro-behaviors/hardware/display/screenshot::pyc-screenshot-name
      - id: micro-behaviors/os/clipboard/read::pyc-clipboard-read-description
