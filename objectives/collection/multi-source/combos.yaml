# Keylogger Behavioral Composites
# Generic keylogger detection patterns (not family-specific)
# ATT&CK: T1056.001 (Keylogging)
defaults:
  attack: T1056.001
  platforms: [macos]
  for: [macho]

composite_rules:
  - id: windows-keylogger-microphone-capture
    desc: Keylogging and audio APIs with C2 upload status
    crit: hostile
    conf: 0.97
    attack: T1056.001,T1123
    platforms: [windows]
    for: [pe]
    # Each source is independently required. This claims co-occurrence, not
    # that the network routine sends audio or that recording is enabled.
    all:
      - id: objectives/collection/keylog/hook::keyboard-hook-winsock-client
      - id: micro-behaviors/hardware/input/audio::wave-input-capture-api-profile
      - id: micro-behaviors/communications/transfer::controller-file-upload-status
  - id: windows-keylogger-clipboard-recording
    desc: Keylogger recording coexists with clipboard-content logging
    crit: hostile
    conf: 0.93
    platforms: [windows]
    for: [pe]
    all:
      - id: objectives/collection/clipboard/capture::clipboard-content-recording-label
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data
    any:
      - id: objectives/collection/keylog/hook::windows-hook-keyboard-state-window-surveillance
      - id: objectives/collection/keylog/hook::keyboard-hook-winsock-client
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: well-known/app/browser/internet-explorer/
      - id: well-known/lib/runtime/scripted/electron/
      - id: well-known/lib/media/videolan/
      - id: well-known/dual-use/transfer/winscp/
  # Generalized keylogger with clipboard
  - id: windows-input-screen-clipboard-surveillance
    desc: Windows input, screen, and clipboard surveillance
    crit: hostile
    conf: 0.93
    platforms: [windows]
    for: [pe]
    all:
      - id: objectives/collection/keylog/capture::surv-keylog-present
      - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data
    unless:
      - id: objectives/collection/keylog/capture::windows-surveillance-known-benign-context
  - id: windows-foreground-input-screen-surveillance
    desc: Foreground-window input with screen capture
    crit: suspicious
    conf: 0.92
    platforms: [windows]
    for: [pe]
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::foreground-window-input-state
      - id: objectives/collection/keylog/capture::surv-keylog-present
      - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
    unless:
      - id: objectives/collection/keylog/capture::windows-surveillance-known-benign-context
  - id: windows-surveillance-target-launch
    desc: Windows surveillance capture with target launch
    crit: suspicious
    conf: 0.9
    platforms: [windows]
    for: [pe]
    all:
      - id: objectives/collection/keylog/capture::surv-keylog-present
      - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
      - id: micro-behaviors/process/create/shellexec::shell-execute
    unless:
      - id: objectives/collection/keylog/capture::windows-surveillance-known-benign-context
