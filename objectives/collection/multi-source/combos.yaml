# Keylogger Behavioral Composites
# Generic keylogger detection patterns (not family-specific)
# ATT&CK: T1056.001 (Keylogging)
defaults:
  attack: T1056.001
  platforms: [macos]
  for: [macho]

composite_rules:
  - id: windows-keylogger-clipboard-stealer
    desc: Windows keylogger with clipboard and data theft
    crit: hostile
    conf: 0.93
    platforms: [windows]
    for: [pe]
    all:
      - id: objectives/collection/keylog/hook::windows-hook-window-title-keylogger
      - id: objectives/collection/clipboard/capture::windows-clipboard-capture-with-user-monitoring
    any:
      - id: micro-behaviors/data/db/sqlite
      - id: objectives/command-and-control/dropper/staging/image-map::self-map-extract-execute
      - id: objectives/evasion/self-delete/file/script::module-path-delete
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
      - id: micro-behaviors/fs/traversal/drives::get-logical-drive-strings
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: well-known/app/browser/internet-explorer/
      - id: well-known/lib/runtime/scripted/electron/
      - id: well-known/lib/media/videolan/
      - id: well-known/dual-use/transfer/winscp/
  # Generalized keylogger with clipboard
  - id: windows-input-screen-clipboard-surveillance
    desc: Windows input, screen, and clipboard surveillance
    crit: hostile
    conf: 0.93
    platforms: [windows]
    for: [pe]
    all:
      - id: objectives/collection/keylog/capture::surv-keylog-present
      - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data
    unless:
      - id: objectives/collection/keylog/capture::windows-surveillance-known-benign-context
  # Some older spyware polls virtual keys directly instead of installing a
  # keyboard hook. Require the independent screen and clipboard collectors,
  # remote-thread injection chain, and a forged Microsoft identity before
  # treating that broad GUI API surface as hostile surveillance.
  - id: microsoft-masquerading-injected-surveillance
    desc: Microsoft-masquerading DLL injects keyboard, screen, and clipboard collection
    crit: hostile
    conf: 0.99
    platforms: [windows]
    for: [pe, dll]
    attack: T1036.005,T1055,T1056.001,T1113,T1115
    mbc: B0033,B0015,B0047
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
      - id: micro-behaviors/hardware/display/screen::gdi-bitmap-transfer-primitives
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data-text
      - id: micro-behaviors/process/inject/dll::enumerated-remote-thread-api-profile
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/
  - id: windows-foreground-input-screen-surveillance
    desc: Foreground-window input with screen capture
    crit: suspicious
    conf: 0.92
    platforms: [windows]
    for: [pe]
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::foreground-window-input-state
      - id: objectives/collection/keylog/capture::surv-keylog-present
      - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
    unless:
      - id: objectives/collection/keylog/capture::windows-surveillance-known-benign-context
  - id: windows-surveillance-target-launch
    desc: Windows surveillance capture with target launch
    crit: suspicious
    conf: 0.9
    platforms: [windows]
    for: [pe]
    all:
      - id: objectives/collection/keylog/capture::surv-keylog-present
      - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
      - id: micro-behaviors/process/create/shellexec::shell-execute
    unless:
      - id: objectives/collection/keylog/capture::windows-surveillance-known-benign-context

  # A PE that combines hidden API resolution, an encrypted writable payload,
  # keyboard polling, clipboard read/write, GDI capture, and temp-file staging
  # is a surveillance-loader profile. The payload-section and staging legs
  # avoid flagging ordinary GUI code that happens to use one capture API.
