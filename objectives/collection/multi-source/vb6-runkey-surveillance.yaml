defaults:
  platforms: [windows]
  for: [pe]
  attack: T1056.001,T1123,T1547.001

composite_rules:
  - id: vb6-runkey-audio-keyboard-surveillance
    desc: VB6 Run-key key polling with microphone recording
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::vb6-runkey-shell-key-poll
      - id: micro-behaviors/hardware/input/audio::mci-recsound-record
      - id: micro-behaviors/hardware/input/audio::mci-recsound-save
    unless:
      - id: well-known/app/
      - id: well-known/lib/
