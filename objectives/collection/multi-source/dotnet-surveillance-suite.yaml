# A .NET program polling key state with foreground-window context while
# also capturing the screen, enumerating video capture devices, holding a
# TCP client channel, and referencing autostart is a surveillance RAT
# capability suite. This is a static profile: autostart references do not
# prove installation, and device enumeration does not prove video capture.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1056.001,T1113,T1095

composite_rules:
  - id: dotnet-keylog-screen-camera-enum-tcp-suite
    # capGetDriverDescriptionA enumerates cameras; it does not capture video.
    desc: .NET keylog/screen suite with camera enumeration and TCP references
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/hardware/display/screenshot::dotnet-copyfromscreen-capture
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
      - id: micro-behaviors/ui/window/enumerate::managed-active-window-title-api-set
      - id: micro-behaviors/hardware/input/video::avicap32-device-enum
      - id: micro-behaviors/communications/socket/tcp::dotnet-tcpclient-stream-references
    any:
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: well-known/app/
      - id: well-known/lib/
