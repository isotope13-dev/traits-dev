defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell]

composite_rules:
- id: github-secret-source
  desc: Sensitive file or environment source clues
  crit: component
  conf: 0.92
  any:
  - id: objectives/credential-access/files/secret-sweep::credential-inventory-wording
  - id: objectives/credential-access/files/secret-sweep::child-process-credential-search-wording
  - id: micro-behaviors/data/serialize/json::process-env-json-stringify
  - id: micro-behaviors/fs/read/file/content/configuration::node-npmrc-read-reference
  - id: micro-behaviors/fs/read/file/target::github-token-pattern-file-operations
  - id: micro-behaviors/fs/read/file/target::github-npm-pattern-file-operations
