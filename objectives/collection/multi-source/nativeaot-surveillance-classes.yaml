# A .NET Native AOT executable keeps its own type and member names in a string
# table beside the compiled framework.  A service whose own classes are a VM
# check, a clipboard monitor, a screenshot helper and a password provider is
# built to watch the host, not to serve it: those four roles together are the
# collection capability of an info-stealer or RAT.  The names are matched as
# bytes because the multi-megabyte table is not reached by string extraction.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 1048576
  size_max: 104857600
  attack: T1115,T1113,T1555

traits:
  - id: nativeaot-vm-exit-check-method
    desc: Native AOT VM check and exit method
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .rdata
      pattern: "43 68 65 63 6B 41 6E 64 45 78 69 74 49 66 56 4D"

  - id: nativeaot-clipboard-monitor-class
    desc: Native AOT clipboard monitor class
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .rdata
      pattern: "43 6C 69 70 62 6F 61 72 64 4D 6F 6E 69 74 6F 72"

  - id: nativeaot-screenshot-helper-class
    desc: Native AOT screenshot helper class
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .rdata
      pattern: "53 63 72 65 65 6E 73 68 6F 74 48 65 6C 70 65 72"

  - id: nativeaot-password-provider-interface
    desc: Native AOT password provider interface
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .rdata
      pattern: "49 50 61 73 73 77 6F 72 64 50 72 6F 76 69 64 65 72"

composite_rules:
  - id: nativeaot-host-surveillance-service
    desc: Native AOT service with VM check and capture classes
    crit: hostile
    conf: 0.93
    all:
      - id: nativeaot-vm-exit-check-method
      - id: nativeaot-clipboard-monitor-class
      - id: nativeaot-screenshot-helper-class
      - id: nativeaot-password-provider-interface
