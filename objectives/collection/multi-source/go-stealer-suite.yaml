# Go stealer toolkit suite: keylogging, screen capture, credential theft.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: go-keylogger-screen-browser-stealer-suite
    desc: Go keylogging and browser theft with screen-capture code
    crit: hostile
    conf: 0.97
    attack: T1056.001,T1113,T1555.003
    all:
      - id: objectives/credential-access/browser/chromium::go-browser-login-query-with-keylogging
      - id: micro-behaviors/hardware/display/screen::gdi-create-compatible-bitmap
      - id: micro-behaviors/hardware/display/screen::gdi-stretchblt
      - id: metadata/binary/symbols/name::go-main-run-keylogger-name
      - id: metadata/binary/symbols/name::go-main-steal-name
      - id: metadata/binary/symbols/name::go-main-send-screen-name
      - id: metadata/binary/symbols/name::chromium-master-key-routine-name
