# Go stealer toolkit suite: keylogging, screen capture, credential theft.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: go-keylogger-screen-browser-stealer-suite
    desc: Go keylogging and browser theft with screen-capture code
    crit: hostile
    conf: 0.97
    attack: T1056.001,T1113,T1555.003
    all:
      # Keep this suite focused on its stated Go browser-stealer profile. The
      # Telegram tdata-location requirement belongs to the more specific
      # browser/session composite and would suppress binaries that carry a
      # Telegram session-file marker without a literal tdata path.
      - id: micro-behaviors/data/db/query::chromium-login-query-reference
      - id: micro-behaviors/fs/path/app-data::browser-wallet-storage-references
      - id: micro-behaviors/data/config/browser-preference::chromium-app-bound-encrypted-key-field
      - id: objectives/collection/keylog/hook::go-keyboard-hook-recording-profile
      - id: micro-behaviors/hardware/display/screen::gdi-create-compatible-bitmap
      - id: micro-behaviors/hardware/display/screen::gdi-stretchblt
      - id: metadata/binary/symbols/name/qualified::go-main-run-keylogger-name
      - id: metadata/binary/symbols/name/qualified::go-main-steal-name
      - id: metadata/binary/symbols/name/qualified::go-main-send-screen-name
      - id: metadata/binary/symbols/name/token::chromium-master-key-routine-name
