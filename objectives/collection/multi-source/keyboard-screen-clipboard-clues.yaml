defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # The polling cluster also requires ToUnicodeEx. A native recorder that
  # reads key state and translates names with GetKeyNameText lacks it, so
  # any one key-state import supplies the keyboard leg.
  - id: keyboard-screen-clipboard-api-set
    desc: Keyboard polling, screen and clipboard APIs co-occur
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/hardware/display/screenshot/display::gdi-screen-capture-primitives
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data
    any:
      - id: micro-behaviors/hardware/input/keyboard/poll::polling-keyboard-api-cluster
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
      - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
    needs: 1
    unless:
      - id: well-known/tool/detection/cleave::cleave-static-analysis-context
      - id: well-known/lib/ui/codejock::xtreme-toolkit-pro-runtime-component
      - id: well-known/dual-use/remote-admin/tightvnc::tightvnc-viewer-verified-identity
      - id: well-known/lib/runtime/scripted/electron::chromium-engine-capability-context
  # Input and screen capture that resolves its server through several public
  # DoH resolvers is a surveillance-and-egress combination, not a single
  # documented client setting. Benign remote-support tools are excluded above.
  - id: keyboard-screen-clipboard-doh-egress
    desc: Input, screen and clipboard capture with multi-resolver DoH lookup
    crit: hostile
    conf: 0.85
    attack: T1056.001
    all:
      - id: keyboard-screen-clipboard-api-set
      - id: micro-behaviors/communications/dns/doh::doh-resolver-list
    unless:
      - id: well-known/tool/detection/cleave::cleave-static-analysis-context
      - id: well-known/lib/ui/codejock::xtreme-toolkit-pro-runtime-component
      - id: well-known/dual-use/remote-admin/tightvnc::tightvnc-viewer-verified-identity
      - id: well-known/lib/runtime/scripted/electron::chromium-engine-capability-context
