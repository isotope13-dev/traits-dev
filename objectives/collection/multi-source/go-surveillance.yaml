defaults:
  platforms: [windows]
  for: [go]

composite_rules:
  - id: go-multi-sensor-surveillance-collection
    desc: Go multi-sensor surveillance collection
    crit: hostile
    conf: 0.98
    attack: T1113,T1125,T1123,T1056.001,T1115
    all:
      - id: micro-behaviors/hardware/display/screenshot::go-screen-capture
      - id: micro-behaviors/hardware/input/audio::go-wasapi-microphone-capture
      - id: objectives/collection/keylog/polling::go-windows-keylogger-foreground
      - id: micro-behaviors/os/clipboard/reference::open-clipboard-text
    near_bytes: 4096
