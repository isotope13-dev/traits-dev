# A native program that captures the screen with GDI, polls keyboard state
# from a runtime-resolved API, touches clipboard formats and writes a Run
# key. Each leg exists in remote-support and accessibility tools; the four
# together with no visible UI purpose are a spyware implant.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1113,T1056.001,T1115,T1547.001
composite_rules:
  - id: native-screen-keyboard-clipboard-run-key-spyware
    desc: Screen capture, key polling, clipboard and Run key
    crit: hostile
    conf: 0.88
    scope: outer
    all:
      - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
      - id: micro-behaviors/hardware/input/keyboard/poll::keyboard-state-with-runtime-resolution
      - id: micro-behaviors/os/clipboard/reference::register-clipboard-format-a
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
    unless:
      - id: metadata/signed/platform/
      - id: metadata/package/testing/
      # A recognized download manager ships every leg deliberately: clipboard
      # URL monitoring, login autostart, framework keyboard handling and GDI
      # capture in its grabber. The identity exception covers repacks whose
      # vendor signature was stripped.
      - id: well-known/tool/browser::idm-unsigned-application-identity
