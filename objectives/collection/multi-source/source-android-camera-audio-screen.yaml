defaults:
  platforms: [android]
  for: [apk, zip]

composite_rules:
  - id: android-accessibility-sensor-spyware
    for: [apk, zip, dex, xml]
    desc: Android accessibility sensor spyware
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-config
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-request-layout
      - id: metadata/file/profile/screen-capture-context::android-screen-capture-capability
      - id: micro-behaviors/hardware/display/camera::android-camera-capture-capability
    any:
      - id: micro-behaviors/ui/window/overlay::floating-window-layouts
      - id: micro-behaviors/os/privilege/manifest::device-admin-policy
      - id: metadata/file/profile/screen-capture-api::android-screen-lock-layout
