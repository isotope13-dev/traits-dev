defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # File-recording variants need neither KEYLOG:/SCREEN: message prefixes
  # nor a Base64 encoder to collect these sources. The recorder establishes
  # surveillance context; the other legs require both additional sources.
  # This is same-file capability evidence, not a source-to-network binding.
  - id: managed-file-keylogger-screen-clipboard
    desc: Keylogger with screen and clipboard APIs
    crit: hostile
    conf: 0.97
    attack: T1056.001,T1113,T1115
    all:
      - id: objectives/collection/keylog/polling::managed-keylog-file-polling-profile
      - id: micro-behaviors/hardware/display/screenshot::dotnet-copyfromscreen-capture
      - id: micro-behaviors/os/clipboard/reference::open-clipboard-text
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data-text
