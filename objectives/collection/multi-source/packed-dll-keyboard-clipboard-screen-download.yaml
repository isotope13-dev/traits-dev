# A DLL with a blank-named packed code section that polls keyboard state, reads
# the clipboard, captures the screen with GDI, enables SeDebugPrivilege and
# downloads files with URLMon combines surveillance and staging in one module.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1056.001,T1115,T1113,T1105
composite_rules:
  - id: packed-module-with-keyboard-clipboard-screen-capture-and-download
    desc: Packed key, clipboard, screen, download module
    crit: hostile
    conf: 0.8
    all:
      - id: metadata/binary/section/label::blank-named-section
      - id: micro-behaviors/hardware/input/keyboard/poll::polling-keyboard-api-cluster
      - id: micro-behaviors/os/clipboard/write::set-clipboard-data
      - id: micro-behaviors/hardware/display/screen::gdi-stretchblt
      - id: micro-behaviors/os/privilege/token::sedebug-privilege-name
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-import
    unless:
      - id: metadata/signed/platform/
