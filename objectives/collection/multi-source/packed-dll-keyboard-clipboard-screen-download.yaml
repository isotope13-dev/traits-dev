# A DLL with a blank-named packed code section that polls keyboard state, reads
# the clipboard, captures the screen with GDI, enables SeDebugPrivilege and
# downloads files with URLMon combines surveillance and staging in one module.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1056.001,T1115,T1113,T1105
composite_rules:
  - id: packed-module-with-keyboard-clipboard-screen-capture-and-download
    desc: Packed key, clipboard, screen, download module
    crit: hostile
    conf: 0.8
    all:
      - id: metadata/binary/section/label::blank-named-section
      - id: micro-behaviors/hardware/input/keyboard/poll::polling-keyboard-api-cluster
      - id: micro-behaviors/os/clipboard/write::set-clipboard-data
      - id: micro-behaviors/hardware/display/screen::gdi-stretchblt
      - id: micro-behaviors/os/privilege/token::sedebug-privilege-name
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-import
    unless:
      - id: metadata/signed/platform/
  - id: hook-debugpriv-process-control-network-channel
    desc: Window hook with debug-privilege process kill and network channel
    # A full hook lifecycle plus SeDebugPrivilege-gated process access and
    # process termination plus a Winsock channel in one unsigned binary is
    # hook-based spyware with teeth: it watches other processes' messages,
    # can open them with debug privilege, kills processes, and talks to the
    # network. Debuggers and admin tools do this openly and signed.
    crit: hostile
    conf: 0.9
    attack: T1056.001,T1071.001
    all:
      - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
      - id: micro-behaviors/os/privilege/token::debug-privilege-process-access
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: micro-behaviors/communications/socket/init::wsock32-dll-marker
      - id: micro-behaviors/process/create/thread::create-thread
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/windows-debugger/
      - id: well-known/tool/reverse-engineering/nanomite/
