defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  attack: T1056.001
  crit: hostile
composite_rules:
- id: windows-native-surveillance-stealer
  desc: Native Windows input clipboard stealer
  conf: 0.96
  for:
  - dll
  all:
  - id: objectives/collection/keylog/hook::windows-hook-state-keylogger
  - id: micro-behaviors/os/clipboard/reference::pe-clipboard-data-access
  unless:
  - id: metadata/binary/vendor/
  - id: metadata/signed/platform/
- id: polling-screen-hidden-c2-surveillance
  desc: Polling keylogger with screen capture and hidden C2
  conf: 0.97
  attack: T1056.001,T1113,T1071
  all:
  - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
  - id: micro-behaviors/hardware/input/keyboard/poll::foreground-window-input-state
  - id: micro-behaviors/ui/window/enumerate::get-window-text
  - id: micro-behaviors/hardware/display/screen::gdi-stretchblt
  - id: micro-behaviors/ui/window/probe::get-desktop-window
  - id: micro-behaviors/data/encode/image/gdiplus::save-image-to-file
  - id: metadata/binary/section/entropy::large-near-random-writable-data
  any:
  - id: micro-behaviors/communications/socket/connect::connect-api-ordinal
  - id: micro-behaviors/communications/socket/receive::recv-api-ordinal
  - id: micro-behaviors/communications/socket/init::winsock-startup-ordinal
  - id: micro-behaviors/data/buffer/integer-codec::htons-api-ordinal
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
