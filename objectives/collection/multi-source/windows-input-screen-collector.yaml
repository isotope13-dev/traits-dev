defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
  attack: T1056.001
  crit: hostile
composite_rules:
  # This PE combines Telegram long-poll tasking, a WinHTTP exchange, local
  # process launch, and keyboard/clipboard/window surveillance. Each API family
  # has benign uses alone; their conjunction describes an operator-controlled
  # input surveillance agent.
  - id: telegram-tasking-input-surveillance-agent
    desc: Telegram-tasked process launcher with input surveillance
    conf: 0.97
    attack: T1102.002,T1059.003,T1056.001,T1115
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: micro-behaviors/communications/http/services/telegram::telegram-get-updates-path
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-response-flow
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
      - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data
      - id: micro-behaviors/ui/window/enumerate::get-foreground-window
      - id: micro-behaviors/ui/window/enumerate::get-window-text

  - id: windows-native-surveillance-stealer
    desc: Native Windows input clipboard stealer
    conf: 0.96
    for:
      - dll
    all:
      - id: objectives/collection/keylog/hook::windows-hook-state-keylogger
      - id: micro-behaviors/os/clipboard/reference::pe-clipboard-data-access
  - id: polling-screen-hidden-c2-surveillance
    desc: Polling keylogger with screen capture and hidden C2
    conf: 0.97
    attack: T1056.001,T1113,T1071
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
      - id: micro-behaviors/hardware/input/keyboard/poll::foreground-window-input-state
      - id: micro-behaviors/ui/window/enumerate::get-window-text
      - id: micro-behaviors/ui/graphics/draw::gdi-stretchblt
      - id: micro-behaviors/ui/window/probe::get-desktop-window
      - id: micro-behaviors/data/encode/image/gdiplus::save-image-to-file
      - id: metadata/binary/section/entropy::large-near-random-writable-data
    any:
      - id: micro-behaviors/communications/socket/connect/attempt::connect-api-ordinal
      - id: micro-behaviors/communications/socket/receive::recv-api-ordinal
      - id: micro-behaviors/communications/socket/init::winsock-startup-ordinal
      - id: micro-behaviors/data/buffer/integer-codec::htons-api-ordinal
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
    needs: 2
    unless:
      - id: metadata/installer/product/
