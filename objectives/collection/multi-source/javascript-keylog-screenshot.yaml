defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript]

composite_rules:
  # Either the FormData constructor or the form-data module import marks the
  # multipart upload path these collectors use for screenshots and logs.
  - id: js-multipart-upload-capability
    desc: FormData upload class or module
    crit: component
    any:
      - id: micro-behaviors/communications/http/form::formdata-class
      - id: metadata/import/npm/form-data::form-data
  - id: js-keyboard-screen-wallet-collector
    desc: "Keyboard and screen collection with wallet context"
    crit: hostile
    conf: 0.96
    attack: "T1056, T1552"
    all:
      - id: micro-behaviors/hardware/input/keyboard/listener::global-keyboard-listener
      - id: well-known/lib/media/screenshot::node-screenshots-import
      - id: js-multipart-upload-capability
    any:
      - id: metadata/lang/source/literal/string/credential::mnemonic-word
      - id: micro-behaviors/os/application/target/wallet::wallet-brand-metamask
