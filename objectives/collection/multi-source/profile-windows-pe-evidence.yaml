defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: api-resolved-keyboard-clipboard-ip-clues
    attack: T1027.007,T1056.001,T1115
    desc: API resolution, keyboard, clipboard and IP clues
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::multiply-shift-xor-export-walk
      - id: metadata/binary/instruction/sequence/unspecified::allocation-like-argument-patterns
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data-text
      - id: micro-behaviors/communications/ip/literal::external-ipv4-pe-resource-string
