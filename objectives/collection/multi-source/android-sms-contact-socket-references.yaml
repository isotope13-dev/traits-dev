---
defaults:
  platforms:
  - android
  for:
  - apk
  - zip
composite_rules:
- id: android-sms-socket-contact-references
  desc: SMS, socket and contacts API references
  crit: notable
  conf: 0.95
  for:
  - dex
  all:
  - id: metadata/binary/symbols/descriptor::android-sms-manager-descriptor
  - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
  - id: micro-behaviors/os/user/lookup::android-dex-contacts-phone-descriptor
- id: android-call-log-socket-contact-references
  desc: Call-log, contacts and socket references
  crit: notable
  conf: 0.95
  for:
  - dex
  all:
  - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
  - id: micro-behaviors/os/user/lookup::android-dex-contacts-phone-descriptor
  any:
  - id: micro-behaviors/os/user/lookup::android-dex-call-log-provider
  - id: micro-behaviors/os/user/lookup::android-dex-call-log-uri
