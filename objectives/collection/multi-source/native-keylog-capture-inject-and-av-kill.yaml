# A native Windows program that logs keys, captures video-for-windows frames,
# injects into other processes with remote threads and force-kills a Chinese
# security product by image name combines the surveillance, injection and
# defense-evasion set of the Gh0st-family remote access trojans.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1056.001,T1125,T1055,T1562.001
composite_rules:
  - id: native-keylog-camera-remote-thread-and-security-product-kill
    desc: Native keylog, camera capture, injection, AV kill
    crit: hostile
    conf: 0.85
    all:
      - id: micro-behaviors/hardware/input/keyboard/label::keylog-keyboard-context
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
      - id: micro-behaviors/hardware/display/camera::vfw-capture-window
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-text
      - id: micro-behaviors/process/terminate/command::native-taskkill-force-image
      - id: micro-behaviors/os/security/product::qihoo-360-safe-term
