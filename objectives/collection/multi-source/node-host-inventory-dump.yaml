# Writes the full process environment to a Desktop JSON file alongside a
# process listing and local account enumeration: a host inventory dump.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1005,T1082,T1057
composite_rules:
  - id: node-env-process-account-inventory-dump
    desc: Dumps environment, process list and account inventory to files
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/fs/write/file/inventory::desktop-full-environment-json
      - id: micro-behaviors/process/enumerate/shell::node-ps-exec-command
    any:
      - id: micro-behaviors/os/user/lookup::js-exec-net-user-localgroup-list
      - id: micro-behaviors/os/privilege/query::js-exec-whoami-privileges
      - id: micro-behaviors/fs/path/account-db::node-passwd-path-reference

  - id: node-env-host-inventory-with-key-probes
    desc: Returns raw environment alongside host probes and AI key checks
    crit: hostile
    conf: 0.98
    attack: T1005,T1082
    all:
      - id: micro-behaviors/os/sysinfo/profile::node-host-information-query-set
      - id: micro-behaviors/fs/path/token::aws-credentials-path-components
      - id: micro-behaviors/fs/path/secret-store::kubernetes-secret-directory-text
      - id: objectives/credential-access/validation/check::node-multi-provider-env-key-validation
    any:
      - id: micro-behaviors/os/env/read/collection::node-env-entries-copy-return
      - id: micro-behaviors/os/env/read/collection::node-env-direct-object-return
