defaults:
  platforms: [windows, unix]
  for: [pyc]
  crit: notable
  conf: 0.95

traits:
  - id: pyc-native-screen-readback-api
    desc: Python bytecode names screen capture APIs
    if:
      type: symbol
      kind: identifier
      regex: '^(GetDIBits|XGetImage|CGWindowListCreateImage)$'

  - id: pyc-native-keyboard-observation-api
    desc: Python bytecode names keyboard observation APIs
    if:
      type: symbol
      kind: identifier
      regex: '^(SetWindowsHookEx[AW]|GetAsyncKeyState|CGEventTapCreate)$'

  - id: pyc-keylogging-routine-name
    desc: Python bytecode names a keylogging routine
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^_?(linux_|mac_|win_)?keylog(ger)?(_thread|_worker|_loop)?$'

  - id: pyc-native-clipboard-read-api
    desc: Python bytecode names clipboard read APIs
    if:
      type: symbol
      kind: identifier
      regex: '^(GetClipboardData|XGetSelectionOwner|NSPasteboard)$'

composite_rules:
  - id: pyc-native-screen-keyboard-clipboard-collector
    desc: Bytecode names keylogging and screen and clipboard APIs
    crit: suspicious
    conf: 0.92
    attack: T1056.001,T1113,T1115
    all:
      - id: pyc-native-screen-readback-api
      - id: pyc-native-keyboard-observation-api
      - id: pyc-keylogging-routine-name
      - id: pyc-native-clipboard-read-api
