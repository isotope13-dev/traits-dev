defaults:
  platforms: [windows]
  for: [shellcode]
  attack: T1113,T1115,T1562.001

composite_rules:
  - id: shellcode-hook-clipboard-uac-disable
    desc: Shellcode hooks input reads clipboard disables UAC
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/ui/window/hook::set-windows-hook-a-container-string
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data-text
      - id: micro-behaviors/os/security/policy::enablelua-zero-disable
