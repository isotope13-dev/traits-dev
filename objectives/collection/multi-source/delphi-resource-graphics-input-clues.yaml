---
defaults:
  platforms:
  - windows
  for:
  - pe
  crit: suspicious
composite_rules:
- id: delphi-resource-graphics-hook-input-clues
  desc: Delphi resource, graphics and input-hook clues
  conf: 0.95
  all:
  - id: micro-behaviors/data/embedded/payload/resource::unsigned-delphi-resource-access
  - id: micro-behaviors/ui/graphics/draw::gdi-dib-bitmap-transfer-primitives
  - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
  any:
  - id: micro-behaviors/hardware/input/monitor::input-and-window-api-profile
  - id: micro-behaviors/hardware/input/keyboard/poll::key-state-ui-timer-pe-api-set
  - id: micro-behaviors/hardware/input/keyboard/poll::polling-keyboard-api-cluster
  unless:
  - id: well-known/lib/runtime/native-platform/slint/
