# Windows keylogging intent composites
# ATT&CK: T1056.001 (Input Capture: Keylogging)
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: "T1056.001"
  mbc: "B0015"

composite_rules:
- id: packed-upx-hook-screen-collector
  desc: Packed UPX keyboard and screen collector
  crit: hostile
  conf: 0.97
  all:
  - id: objectives/anti-static/pack/upx::scrambled-upx-header
  - id: metadata/binary/section/entropy::compact-rwx-upx1-section
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
  any:
  - id: micro-behaviors/os/clipboard/reference::open-clipboard
  - id: micro-behaviors/os/message/dde::dde-client-transaction
  - id: micro-behaviors/os/registry/access::registry-set-value-api
  needs: 1
  unless:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: metadata/signed/platform/
  - id: well-known/tool/reverse-engineering/
  - id: well-known/app/utility/siw::siw-family-identity
- id: api-resolved-keyboard-clipboard-surveillance
  desc: API-resolved keyboard and clipboard surveillance
  crit: hostile
  conf: 0.98
  attack: T1056.001,T1115,T1027.007
  all:
  - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
  - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state-str
  - id: micro-behaviors/os/clipboard/read::get-clipboard-data-text
  - id: micro-behaviors/os/clipboard/write::set-clipboard-data-text
  - id: micro-behaviors/os/api-resolution/hash-based::multiplicative-hash-loop
  - id: micro-behaviors/mem/alloc/executable::executable-allocation-indicator
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
- id: opaque-api-resolved-keyboard-clipboard-screen-loader
  desc: Opaque loader with keyboard clipboard and screen collection
  crit: hostile
  conf: 0.99
  attack: T1027,T1027.007,T1056.001,T1113,T1115
  for: [pe]
  all:
  - id: micro-behaviors/os/api-resolution/hash-based::multiplicative-hash-loop
  - id: metadata/binary/section/entropy::large-high-entropy-writable-data-section
  - id: micro-behaviors/fs/temp/directory::temp-file-staging-primitives
  - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
  - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state-str
  - id: micro-behaviors/os/clipboard/read::get-clipboard-data-text
  - id: micro-behaviors/os/clipboard/write::set-clipboard-data-text
  - id: micro-behaviors/hardware/display/screen::gdi-getdibits
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework/
  - id: metadata/binary/installer/
- id: windows-global-hook-screen-clipboard-collector
  desc: Global keyboard hook with screen and clipboard collection
  crit: hostile
  conf: 0.98
  attack: "T1056.001,T1113,T1115"
  mbc: "B0015,B0047"
  for: [pe]
  scope: leaf
  all:
  - id: objectives/collection/clipboard/capture::windows-clipboard-screen-hook-surveillance
  - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state
  - id: micro-behaviors/hardware/input/keyboard/layout::map-virtual-key
  - id: micro-behaviors/ui/window/hook::windows-hook-chain-api-cluster
  - id: micro-behaviors/hardware/display/screen::gdi-bitmap-transfer-primitives
  - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
  - id: micro-behaviors/os/clipboard/read::get-clipboard-data
  unless:
  - id: objectives/collection/keylog/capture::windows-hook-keyboard-state-exception
  - id: metadata/binary/installer/family/
