# --- Variant-independent AMOS (Atomic Stealer) behaviors ---
# The family-tuned composites above key on specific upload shapes (chunked,
# /tmp/out.zip, upload.php), specific lure titles, and named handler functions.
# Numerically-obfuscated AMOS variants delivered as a single-line
# `osascript -e 'run script "..."'` blob (functions renamed to f<digits>, paths
# built by concatenation, AST string literals not cleanly exposed) slip past
# them while performing the identical kill chain. These three text-based
# composites detect the behaviors directly, regardless of the carrier wrapping.
- id: applescript-credential-phish-hostile
  desc: Fake auth dialog harvests and validates login password
  crit: hostile
  conf: 0.97
  attack: T1056.002
  # Impersonation lure + masked password entry + dscl validation of the entered
  # password is the complete credential-phish-and-verify loop; `dscl . authonly`
  # to check a user-typed password against the local directory service has no
  # legitimate use behind a hand-rolled dialog (real tools use Authorization
  # Services / `with administrator privileges`).
  all:
  - id: objectives/credential-access/validation/check::dscl-authonly-comp
  - id: objectives/credential-access/phishing/lure::hidden-answer
  any:
  - id: objectives/credential-access/phishing/lure::macos-password-prompt
  - id: objectives/credential-access/phishing/lure::password-prompt-wording-fragment
  unless:
  - id: objectives/credential-access/keychain/theft::login-keychain-phish-signal
- id: applescript-buildid-databinary-exfil
  desc: Campaign-tagged curl upload of collected data
  crit: hostile
  conf: 0.96
  attack: T1041
  # AMOS C2 protocol: a curl request carrying the `buildid:` campaign header that
  # binary-uploads a staged file. The buildid header + --data-binary file upload
  # + (POST or a hardcoded-IP endpoint) is the exf* leg, independent of whether
  # the archive is chunked or named out.zip.
  all:
  - id: objectives/exfiltration/http/upload::buildid-upload-header
  - id: micro-behaviors/communications/http/curl::curl-data-binary-file
  any:
  - id: micro-behaviors/communications/http/curl::curl-post-flag
  - id: micro-behaviors/communications/ip/literal::http-ip-url
# Handler-independent full-infostealer verdict. The family composite above
# (applescript-macsync-style-stealer) requires helper-handler-bundle — three
# NAMED handler functions (filegrabber, chromium,
# uploadToC2 ...) that numerically-obfuscated variants rename out of reach. This
# capstone drops the function-name leg and rests on four independent behavioral
# clusters that all describe a stealer: mass app-data collection, /tmp staging
# layout, credential phishing, and exfiltration. Their co-occurrence in one
# script has no benign explanation regardless of how handlers are named.
- id: applescript-complete-infostealer
  desc: Infostealer collects, stages, and exfiltrates data
  crit: hostile
  conf: 0.98
  all:
  - id: applescript-browser-wallet-collection
  - id: applescript-staging-layout
  - id: applescript-password-phishing
  - id: applescript-exfiltration
- id: applescript-staged-credential-stealer
  desc: AppleScript staged credential stealer
  crit: hostile
  conf: 0.97
  attack: T1555
  all:
  - id: applescript-browser-wallet-collection
  - id: tmp-infostealer-layout
  - id: applescript-password-phish-validate
  any:
  - id: objectives/evasion/indicator-removal/cleanup::killall-terminal
  - id: micro-behaviors/process/create/script/osascript::do-shell-rm-binary
  - id: objectives/credential-access/theft/keywords::stealer-word
  needs: 1
# Victim-registration beacon: a full system_profiler hardware/software profile
# (or the SPHardware UUID query) shipped to C2 under a campaign buildid header.
# Legitimate diagnostics read system_profiler, but they do not POST the profile
# to a host tagged with an attacker campaign id — that pairing is the stealer
# check-in that registers the victim before/with data theft.
- id: applescript-fingerprint-c2-beacon
  desc: System fingerprint beaconed to campaign C2
  crit: hostile
  conf: 0.95
  attack: T1082
  all:
  - id: applescript-buildid-databinary-exfil
  any:
  - id: objectives/collection/stealer/host-profile::full-system-profile
  - id: objectives/collection/stealer/host-profile::uuid-query-command
