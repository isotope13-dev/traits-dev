# Gradle-era APKs store permission names in the AXML UTF-8 string pool.
# Pair SMS/overlay grants with network sockets so UTF-8 manifests convict.
defaults:
  platforms: [android]
  for: [apk, zip, xml, dex]
  attack: T1636
composite_rules:
  - id: sms-utf8-internet-grant
    desc: UTF-8 manifest grants SMS and INTERNET
    crit: hostile
    conf: 0.95
    scope: outer
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-utf8-manifest
      - id: micro-behaviors/os/privilege/manifest::internet-utf8-manifest
  - id: sms-utf8-socket-exfil
    desc: UTF-8 SMS grant with a Java socket
    crit: hostile
    conf: 0.95
    scope: outer
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-utf8-manifest
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
