# JavaScript bundles that capture live activity -- keystrokes, screenshots, tab
# captures, clipboard contents -- rather than reading a stored credential file.
# That split is the axis this directory is named for; the stored-store half of
# this file is ../data/javascript.yaml.
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript]
composite_rules:
  # === Helpers ===
  # === Hostile Rules ===
  - id: js-spyware-bundle
    desc: JavaScript spyware bundle (Keylogging + Screenshots + Network)
    crit: hostile
    conf: 0.95
    attack: "T1056"
    all:
      - id: micro-behaviors/hardware/input/keyboard/listener::global-keyboard-listener
      - id: micro-behaviors/hardware/display/screenshot::node-screenshots-import
      - id: micro-behaviors/communications/http/lib/axios::axios
  - id: js-wallet-spyware-collector
    desc: JavaScript wallet spyware collection bundle
    crit: hostile
    conf: 0.96
    attack: "T1056, T1552"
    all:
      - id: micro-behaviors/hardware/input/keyboard/listener::global-keyboard-listener
      - id: micro-behaviors/hardware/display/screenshot::node-screenshots-import
      - id: micro-behaviors/communications/http/form::formdata-class
    any:
      - id: objectives/credential-access/wallet/keywords::mnemonic-word
      - id: objectives/credential-access/wallet/keywords::metamask-word
  - id: obfuscated-browser-stealer
    desc: Obfuscated browser/credential stealer
    crit: hostile
    conf: 0.95
    attack: "T1555.003"
    all:
      - id: objectives/discovery/host/browser/identity::browser-names
      - id: objectives/anti-static/obfuscation/string/dynamic::arithmetic-decoder-wrapper-call
    any:
      - id: objectives/credential-access/discord/token::appdata-ref
      - id: objectives/credential-access/discord/token::ldb-extension
      - id: micro-behaviors/fs/write/file/full::js-file-write
  - id: browser-cookie-screen-websocket-collection
    desc: Extension combines cookies, tab captures, and WebSocket sends
    # The combination is high-risk and merits review, but a WebSocket send
    # does not prove that either captured data type is sent to an attacker.
    # Browser automation and testing bridges legitimately combine all four.
    crit: suspicious
    conf: 0.95
    attack: T1539,T1113
    all:
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get-all
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-capture-visible
      - id: micro-behaviors/communications/websocket/handler::websocket-javascript-constructor
      - id: micro-behaviors/communications/socket/send::javascript-socket-send
    # A loopback WebSocket endpoint is the automation bridge the note above
    # describes: a CDP-free driver pairs an extension with a local server it
    # ships, and the cookies and screenshots it forwards never leave the host.
    # The capture-plus-send observation still deserves an analyst's eye, so
    # this steps the finding down rather than dropping it.
    downgrade:
      any:
        - id: micro-behaviors/communications/websocket/client::loopback-websocket-service-url
        - id: micro-behaviors/communications/http/websocket::loopback-websocket-endpoint
  - id: browser-crypto-clipboard-hijacker
    desc: Extension replaces pasted cryptocurrency addresses
    crit: hostile
    conf: 0.99
    attack: T1115
    near_bytes: 1024
    all:
      - id: micro-behaviors/os/clipboard/read::browser-paste-event-handler
      - id: micro-behaviors/os/clipboard/read::browser-clipboarddata-get
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: micro-behaviors/data/format/crypto-address::eth-address-regex
