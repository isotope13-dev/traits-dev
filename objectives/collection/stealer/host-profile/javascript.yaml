defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1592.004,T1027
  mbc: E1071

composite_rules:
  - id: obfuscated-vscode-host-profile-identity-collection
    desc: Obfuscated VS Code host identity collection
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/discovery/system/profile::js-host-profile-fields
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
      - id: micro-behaviors/process/create/shell/bridge::js-spawnsync
      - id: micro-behaviors/data/source/dynamic/load::node-computed-require-call
      - id: micro-behaviors/data/encode/char-code::fromcharcode-call
