defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1119
  mbc: E1119

traits:
- id: sentry-default-pii-enabled
  desc: Sentry default PII enabled
  crit: notable
  conf: 0.94
  if:
    type: tree-sitter
    query: |
      ((pair
        key: (property_identifier) @key
        value: (true) @value)
       (#eq? @key "sendDefaultPii"))

- id: sentry-ip-address-user-field
  desc: IP field passed in a Sentry.setUser object
  crit: notable
  conf: 0.9
  unless:
  - id: well-known/lib/core/sentry-js::sentry-js-sdk
  if:
    type: tree-sitter
    query: |
      (call_expression
        function: (member_expression
          object: (identifier) @object
          property: (property_identifier) @method)
        arguments: (arguments
          (object
            (pair
              key: (property_identifier) @key)))
        (#eq? @object "Sentry")
        (#eq? @method "setUser")
        (#eq? @key "ip_address"))

composite_rules:
- id: sentry-hardcoded-ip-pii-telemetry
  desc: Hardcoded Sentry collects public IP
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/telemetry::sentry-ingest-dsn
  - id: sentry-default-pii-enabled
  - id: well-known/lib/core/sentry-js::sentry-set-user-call
  - id: sentry-ip-address-user-field
  - id: micro-behaviors/communications/http/endpoints::cloudflare-trace-ip-endpoint
