defaults:
  platforms: [unix, windows]
  for: [scripts]

# Capturing flags is expected in CTF tooling. These atoms describe the
# mechanics; only complete automated collection workflows are suspicious.

traits:
  - id: ctf-flag-stealer-regex
    desc: CTF flag-format pattern in source
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b(HTB|flag)\{[A-Za-z0-9_]{1,80}\}'
      case_insensitive: true
  - id: ctf-flag-buffer-append
    desc: Appends a captured flag value
    crit: notable
    conf: 0.94
    attack: T1005
    if:
      type: text
      # Require a CTF/vulnbox exchange marker in the same source window. A
      # generic CLI telemetry list such as `flags.append(flag)` is not CTF
      # collection by itself.
      regex: '(?is)(ctf|vulnbox).{0,120}flags\.append\s*\(\s*flag\b'
  - id: ctf-flag-submission-request
    desc: HTTP request submits buffered CTF flags
    crit: notable
    conf: 0.94
    attack: T1041
    for: [python]
    if:
      type: text
      # Require HTTP-shaped headers and a JSON flag buffer on the same put()
      # call. A bare put(flags=...) also occurs in database bindings.
      regex: '(?is)\bput\s*\(.{0,220}\bheaders\s*=.{0,220}\bjson\s*=\s*(self\.)?flags\b'

composite_rules:
  - id: ctf-flag-stealer-behavior
    desc: Automated stealing of CTF flags
    crit: suspicious
    conf: 0.95
    attack: T1005
    all:
      - id: ctf-flag-stealer-regex
      - id: micro-behaviors/process/create/shell/bridge::js-execfilesync
  - id: ctf-flag-harvest-and-submit
    desc: Automates CTF flag collection and authenticated submission
    crit: suspicious
    conf: 0.98
    attack: T1005,T1041
    all:
      - id: objectives/execution/exploit/network-service/exploit-automation::ctf-flag-id-marker
      - id: objectives/execution/exploit/network-service/exploit-automation::ctf-team-token-marker
      - id: ctf-flag-buffer-append
      - id: ctf-flag-submission-request
