defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: telegram-tdata-access
    desc: "Access to Telegram tdata dir"
    crit: suspicious
    conf: 0.95
    attack: T1539
    if:
      type: text
      regex: (?i)Telegram Desktop\\tdata
  - id: telegram-session-file-targets
    desc: Targets Telegram client session files
    crit: suspicious
    conf: 0.96
    for: [python]
    if:
      type: text
      regex: '(?i)endswith\s*\(\s*["'']\.(session|pyrogram)["'']'
  - id: telegram-tdata-directory-target
    desc: Targets Telegram Desktop tdata directory
    crit: suspicious
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '(?i)["'']tdata["'']\s+in\s+\w+'
composite_rules:
  - id: python-telegram-session-artifact-harvest
    desc: Recursively harvests and validates Telegram session artifacts
    crit: suspicious
    conf: 0.99
    attack: T1539,T1083
    for: [python, whl, zip, archives]
    scope: archive
    all:
      - id: telegram-session-file-targets
      - id: telegram-tdata-directory-target
      - id: micro-behaviors/communications/http/services/telegram::telegram-session-client-validation
      - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
