# Vidar's worker pool scales from processor and memory measurements before
# sweeping browser stores. The APIs are common individually; this combination
# is the technique-level signal.
defaults:
  platforms: [windows]
  for: [source]
  attack: T1082,T1555.003
  mbc: B0028

composite_rules:
  - id: hardware-scaled-browser-stealer-workers
    desc: Hardware-scaled worker pool for browser credential collection
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/sysinfo/hardware::get-system-info-source
      - id: micro-behaviors/os/sysinfo/hardware::global-memory-status-source
      - id: micro-behaviors/process/thread/create::create-thread-source
      - id: objectives/credential-access/browser/chromium::chromium-browser-store-set
    near_lines: 180
