# Desktop wallet application paths an AppleScript stealer reads. Split out of
# a macOS stealer file that had collected seven subjects under one name; the
# wallet targets belong with the other wallet rules.
defaults:
  crit: suspicious
  platforms: [macos]
  for: [applescript, shell]
  attack: T1005
  mbc: B0028
traits:
- id: electrum-wallet-path
  desc: Electrum wallet path target
  crit: suspicious
  conf: 0.85
  attack: T1555.005
  if:
    type: text
    substr: .electrum/wallets/
- id: coinomi-wallet-path
  desc: Coinomi wallet path target
  crit: suspicious
  conf: 0.85
  attack: T1555.005
  if:
    type: text
    substr: Coinomi/wallets/
- id: exodus-wallet-path
  desc: Exodus wallet path target
  crit: suspicious
  conf: 0.85
  attack: T1555.005
  if:
    type: text
    substr: Exodus/
- id: atomic-wallet-path
  desc: Atomic wallet path target
  crit: suspicious
  conf: 0.85
  attack: T1555.005
  if:
    type: text
    substr: atomic/Local Storage/
- id: trezor-suite-path
  desc: Trezor Suite path target
  crit: suspicious
  conf: 0.85
  attack: T1555.005
  if:
    type: text
    substr: "@trezor/suite-desktop/"
composite_rules:
  - id: wallet-target-bundle
    desc: Multiple desktop wallet targets
    conf: 0.95
    attack: T1555.005
    needs: 4
    any:
    - id: electrum-wallet-path
    - id: coinomi-wallet-path
    - id: exodus-wallet-path
    - id: atomic-wallet-path
    - id: trezor-suite-path
