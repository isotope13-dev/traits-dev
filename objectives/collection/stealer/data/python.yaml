# Python Infostealer and Staging Detection
# Aggregates micro-behaviors into high-level stealer narratives
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: ai-gateway-preferred-adapter
    desc: Gateway preferred adapter env var
    crit: component
    conf: 0.9
    if:
      type: text
      substr: GATEWAY_PREFERRED_ADAPTER
composite_rules:
  - id: ai-gateway-env-marker
    desc: AI gateway environment setup marker
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/os/env/vars/access::anthropic-auth-token-variable
      - id: micro-behaviors/os/env/vars/access::anthropic-base-url-variable
      - id: ai-gateway-preferred-adapter
  - id: infostealer
    desc: "Python infostealer behavior"
    crit: suspicious
    conf: 0.95
    mbc: "OB0003"
    attack: "T1041"
    near_lines: 160
    needs: 3
    all:
      - id: objectives/discovery/system/
      - id: micro-behaviors/communications/http/request/
    any:
      - id: objectives/credential-access/browser/
      - id: objectives/credential-access/cloud/session/
      - id: objectives/credential-access/discord/
      - id: objectives/credential-access/files/config/
      - id: objectives/credential-access/keychain/
      - id: objectives/credential-access/ssh/key/
      - id: objectives/credential-access/wallet/
      - id: objectives/collection/stealer/browser/
      - id: objectives/collection/stealer/session/
      - id: objectives/collection/stealer/wallet/
      - id: objectives/exfiltration/stealer/
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/tool/detection/proxy-sandbox
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/package/quality/benign-context::benign-app-fp-context
      - id: well-known/app/infrastructure/kubeflow-community::notebook-scripts
      - id: well-known/app/ai/agent-runtime/feral-ai/
      - id: metadata/package/testing/

  - id: mcp-workspace-document-harvesting
    desc: MCP prompt directs harvesting of local documents
    crit: hostile
    conf: 0.99
    attack: T1005
    all:
      - id: objectives/evasion/security-bypass/llm/prompt::mcp-agent-instruction-poisoning
      - id: micro-behaviors/data/format/pdf::read-fitz
      - id: micro-behaviors/data/format/pdf::read-pypdf
  - id: stealer-data-source-marker
    desc: Python stealer data source marker
    crit: component
    conf: 0.85
    any:
      - id: objectives/credential-access/browser/
      - id: objectives/credential-access/cloud/session/
      - id: objectives/credential-access/discord/
      - id: objectives/credential-access/files/config/
      - id: objectives/credential-access/keychain/
      - id: objectives/credential-access/ssh/key/
      - id: objectives/credential-access/wallet/
      - id: objectives/collection/stealer/browser/
      - id: objectives/collection/stealer/session/
      - id: objectives/collection/stealer/wallet/
    unless:
      - id: objectives/exfiltration/stealer/credential/token/
      - id: micro-behaviors/crypto/library/blockchain/
  - id: dynamic-dropper
    desc: Stealer data source near staged payload
    crit: notable
    conf: 0.98
    mbc: "B0023"
    attack: "T1059"
    near_lines: 120
    all:
      - id: stealer-data-source-marker
    any:
      - id: objectives/command-and-control/dropper/staging/
      - id: objectives/supply-chain/hidden-payload/
    unless:
      - id: well-known/lib/ai/pyaigis/
      - id: well-known/lib/native/glibc
      - id: well-known/tool/detection/proxy-sandbox
      - id: micro-behaviors/crypto/library/blockchain/
      - id: objectives/exfiltration/stealer/credential/token/
  - id: data-staging
    desc: "Data staging for exfiltration"
    crit: suspicious
    conf: 0.98
    mbc: "B0030"
    attack: "T1074"
    near_lines: 100
    needs: 3
    all:
      - id: objectives/discovery/system/
    any:
      - id: micro-behaviors/fs/file/write/
      - id: objectives/collection/archive/
      - id: micro-behaviors/communications/http/request/
    unless:
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: well-known/tool/detection/proxy-sandbox
      - id: well-known/lib/crypto/google-auth::python-package-context
      - id: well-known/lib/ai/ibm-watsonx-ai::ibm-watsonx-ai-sdk-context

  # Managed notebook runtimes mount user uploads under /mnt/data. Stealers that
  # walk that mount and pull OOXML text via stdlib zipfile are collecting
  # documents for later exfiltration, not parsing charts.
  - id: python-notebook-datadir-office-harvest
    desc: Harvests Office content from notebook data directory
    crit: hostile
    conf: 0.97
    attack: "T1005,T1083"
    mbc: "E1005"
    # Walk + OOXML extractors span the whole module (readers then scanner).
    near_bytes: 20000
    all:
      - id: micro-behaviors/fs/path/location::python-mnt-data-path
      - id: micro-behaviors/fs/enumerate/directory::python-directory-listing
      - id: micro-behaviors/data/archive/zip::python-zipfile-handle
    any:
      - id: micro-behaviors/data/format/office/extract::python-xlsx-shared-strings-member
      - id: micro-behaviors/data/format/office/extract::python-docx-document-xml-member
      - id: micro-behaviors/data/format/office/extract::python-pptx-slide-xml-member
    needs: 2

# A Telegram exfiltrator that carries infostealer harvesting. The telegram
# rules under exfiltration/messaging convict the channel; this states the
# harvest -- wallet-process targeting beside the file exfil is a stealer
# whose transport happens to be a bot.
  - id: telegram-exfil-stealer-harvest
    desc: Telegram exfil carries stealer harvest
    crit: hostile
    conf: 0.96
    attack: T1005,T1041
    scope: archive
    all:
      - id: objectives/credential-access/wallet/crypto::wallet-process-targeting
      - id: objectives/exfiltration/messaging/telegram::python-telegram-file-exfiltration
