# HTTP Server-based Data Collection/Stealer
# Detects exfiltration data collection via HTTP endpoints
# MBC: OB0003 (Stealer)
# ATT&CK: T1041 (Exfiltration Over C2 Channel)
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  attack: "T1041"
  mbc: "OB0003"
  for: [python]
traits:
  - id: llm-provider-router-env
    desc: LLM provider router env
    crit: component
    conf: 0.95
    platforms: [unix, windows]
    if:
      type: text
      regex: 'ROUTER_(LEADER|TEAMMATE)_URL'
composite_rules:
  # Future coverage: flags an all-interface Python server that maps an
  # untrusted request path into the working directory and returns the file.
  # This is a distinct disclosure primitive from credential collection and
  # catches unsafe static-file handlers even when filenames change.
  - id: network-http-request-path-file-disclosure
    desc: HTTP request path exposes local files
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/socket/bind/address::python-http-server-all-interfaces
      - id: micro-behaviors/communications/http/server/request::python-http-request-path-strip
      - id: micro-behaviors/fs/path/construct::python-cwd-variable-path-join
      - id: micro-behaviors/fs/file/open::binary-read-mode
      - id: micro-behaviors/communications/http/server/request::python-http-file-response
    near_lines: 120
  # Data collection with HTTP server storage
  - id: data-collection-with-storage
    desc: Collects and stores exfiltrated data on HTTP server
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/server/request::http-post-endpoint
      - id: micro-behaviors/fs/file/open::write-append-create-mode
    any:
      - id: micro-behaviors/communications/http/server/request::extract-from-request-json
      - id: micro-behaviors/communications/http/server/request::extract-from-request-form
      - id: micro-behaviors/communications/http/server/request::extract-from-request-data
    near_lines: 80
    unless:
      - id: metadata/file/extension/identity::jsonl-data-file
      - id: llm-provider-router-env
      - id: well-known/lib/ai/praisonaiagents::authenticated-agent-endpoint
