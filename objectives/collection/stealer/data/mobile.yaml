# iOS dumpers commonly stage several native data stores under short, fixed
# filenames before sending the collected material to a remote panel. These are
# artifact paths, not family names; the composite requires multiple stores.
defaults:
  platforms: [ios]
  for: [javascript, typescript, swift, objc, html, cpp, macho]
  attack: T1005,T1074.001

traits:
  - id: ios-installed-apps-staging-path
    desc: iOS installed-app inventory staging path
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(^|["''/])installed_apps\.txt(["''/]|$)'

  - id: ios-icloud-dump-staging-prefix
    desc: iOS iCloud dump staging filename prefix
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(^|["''/])icloud_dump_[A-Za-z0-9_.-]*'

composite_rules:
  - id: ios-multi-source-data-staging
    desc: Stages data from multiple iOS stores
    crit: suspicious
    conf: 0.96
    needs: 2
    any:
      - id: objectives/credential-access/wifi::ios-wifi-password-staging-artifact
      - id: ios-installed-apps-staging-path
      - id: ios-icloud-dump-staging-prefix
