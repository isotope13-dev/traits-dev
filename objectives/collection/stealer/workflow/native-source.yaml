# Native information-stealer workflow: browser credentials plus host profiling
# and outbound HTTP, with screen capture or anti-analysis as corroboration.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1555.003,T1082,T1041,T1113,T1497.001

composite_rules:
  - id: native-browser-host-profile-http-stealer
    desc: Native browser stealer profiles the host and sends collected data over HTTP
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/credential-access/browser/chromium::password-sql
      - id: objectives/discovery/host/fingerprint::native-host-profile
      - id: micro-behaviors/communications/http/get::wininet-http-client-src
    any:
      - id: micro-behaviors/hardware/display/native-capture::source-gdi-screen-capture-primitives
      - id: objectives/anti-analysis/vm-detect/process::native-vm-process-check
      - id: micro-behaviors/communications/http/upload::octet-stream-upload-header

  # Mars and related native stealers fetch helper DLLs from /request, then
  # wipe themselves with a delayed cmd delete after exfil.
  - id: native-stealer-request-stage-self-delete
    desc: Native stealer stages /request helpers and delayed self-deletes
    crit: hostile
    conf: 0.98
    attack: T1105,T1070.004,T1041
    all:
      - id: objectives/credential-access/browser/chromium::password-sql
      - id: micro-behaviors/communications/http/get::wininet-staged-request-source
      - id: objectives/evasion/self-delete/file/delay::native-timeout-del-self
      - id: micro-behaviors/communications/http/get::wininet-http-client-src
