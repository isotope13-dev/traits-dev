# Browser extensions that combine broad page access with credential, screen,
# keyboard, or clipboard collection. These are technique-level rules: the
# extension name and C2 infrastructure are intentionally not part of them.
defaults:
  platforms: [windows, unix]
  for: [chrome-manifest]
  attack: T1185,T1539,T1113,T1056.001,T1115

composite_rules:
  - id: broad-cookie-screen-spyware-authority
    desc: Broad extension authority for cookie and screen spyware
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/permission/manifest::is-chrome-manifest
      - id: metadata/permission/host::broad-host-access
      - id: metadata/permission/cookie::permission-cookies
      - id: metadata/permission/manifest::background-service-worker
      - id: micro-behaviors/process/inject/webextension::content-script-all-frames

  - id: broad-clipboard-spyware-authority
    desc: Broad extension authority for clipboard surveillance
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/permission/manifest::is-chrome-manifest
      - id: metadata/permission/host::broad-host-access
      - id: metadata/permission/clipboard::permission-clipboard-read
      - id: metadata/permission/activation::content-script-run-at-start
      - id: micro-behaviors/process/inject/webextension::content-script-all-frames
