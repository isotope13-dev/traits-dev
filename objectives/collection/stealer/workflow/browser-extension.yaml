# Browser extensions that combine broad page access with clipboard collection.
# These are technique-level rules: extension identity and C2 infrastructure
# are intentionally not part of them.
defaults:
  platforms: [windows, unix]
  for: [chrome-manifest]
  attack: T1185,T1539,T1113,T1056.001,T1115

composite_rules:
  - id: broad-clipboard-spyware-authority
    desc: Broad extension authority for clipboard surveillance
    # Permissions alone (clipboardRead + all_urls + early all-frames content
    # script) are shared by password managers, PDF readers, and form fillers.
    # Keep the observation but do not treat the grant set as suspicion without
    # a behavioral clipboard leg from a referencing composite.
    crit: notable
    conf: 0.9
    all:
      - id: metadata/permission/manifest::is-chrome-manifest
      - id: metadata/permission/host::broad-host-access
      - id: metadata/permission/clipboard::permission-clipboard-read
      - id: metadata/permission/activation::content-script-run-at-start
      - id: micro-behaviors/process/inject/webextension::content-script-all-frames
