defaults:
  platforms: [android]
  for: [apk, zip]

traits:
  - id: cleaner-location-privacy-module
    desc: Cleaner location privacy module
    crit: component
    conf: 0.9
    if:
      type: text
      substr: "res/mipmap-xxhdpi-v4/ic_home_location_privacy_clean.webp"

  - id: cleaner-social-clean-module
    desc: Cleaner social app module
    crit: component
    conf: 0.88
    if:
      type: text
      substr: "res/mipmap-xxhdpi-v4/ic_home_social_clean.webp"

  - id: cleaner-app-uninstall-module
    desc: Cleaner app inventory module
    crit: component
    conf: 0.88
    if:
      type: text
      substr: "res/mipmap-xxhdpi-v4/ic_home_app_uninstall.webp"

  - id: cleaner-app-scan-animation
    desc: Cleaner app scan animation
    crit: component
    conf: 0.86
    if:
      type: text
      substr: "res/raw/loader_animation_scan_app.json"

  - id: cleaner-location-scan-animation
    desc: Cleaner location scan animation
    crit: component
    conf: 0.86
    if:
      type: text
      substr: "res/raw/loader_animation_scan_location.json"

composite_rules:
  - id: android-sensitive-location-file-collection
    desc: Android app requests location contacts and file access
    crit: suspicious
    conf: 0.98
    unless:
      - id: well-known/app/system/android-x86::phonesky-system-app
      - id: well-known/app/communication/sms-forwarder::smsforwarder-application
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-application
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-package
      - id: metadata/package/testing/presence/manifest::android-example-manifest
    all:
      - id: micro-behaviors/os/privilege/manifest::read-location
      - id: micro-behaviors/os/privilege/manifest::read-contacts
      - id: micro-behaviors/os/privilege/manifest::read-external-storage
      - id: micro-behaviors/os/privilege/manifest::internet-access
    scope: outer

  - id: android-webview-location-file-spyware
    desc: Android WebView location contact and file spyware
    crit: hostile
    conf: 0.995
    unless:
      - id: well-known/app/system/android-x86::phonesky-system-app
    all:
      - id: android-sensitive-location-file-collection
      - id: micro-behaviors/process/interpreter/webview::webview-remote-content-shell
      - id: micro-behaviors/data/encode/base64::android-base64-class-reference
    scope: outer

  - id: android-accessibility-screen-capture
    desc: Android accessibility screen capture
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-config
      - id: micro-behaviors/hardware/display/screen::android-media-projection-screen-capture
    any:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-request-layout
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-settings-intent

  - id: android-accessibility-transaction-spyware
    desc: Android accessibility transaction spyware
    crit: hostile
    conf: 0.98
    all:
      - id: android-accessibility-screen-capture
      - id: objectives/command-and-control/backdoor/rat/control::android-transaction-control-protocol
    any:
      - id: micro-behaviors/os/sysinfo/platform/mobile::android-persistent-id-collection
      - id: micro-behaviors/process/interpreter/webview::webview-js-bridge

  - id: android-camera-screen-capture
    desc: Android camera and screen capture
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/hardware/display/camera::android-camera-capture-capability
      - id: micro-behaviors/hardware/display/screen::android-screen-capture-capability

  - id: android-sms-camera-screen-spyware
    desc: Android staged spyware captures camera, screen, and SMS data
    crit: hostile
    conf: 0.995
    mbc: "F0004"
    all:
      - id: android-camera-screen-capture
      - id: micro-behaviors/os/message/intent::android-sms-originating-address-read
      - id: micro-behaviors/os/message/intent::android-sms-message-body-read
      - id: micro-behaviors/process/interpreter/webview::webview-remote-content-shell

  - id: android-audio-video-spyware
    desc: Android audio video spyware
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/hardware/display/camera::android-camera-capture-capability
      - id: micro-behaviors/hardware/input/audio::android-audio-recording-capability
      - id: micro-behaviors/hardware/display/screen::android-screen-capture-capability

  # A recording API can be legitimate. The combination below additionally
  # exposes paired SMS-operation tokens and dedicated remote-screen sender
  # fields inside a heavily randomized DEX namespace.
  - id: android-obfuscated-screen-sms-surveillance-rat
    desc: Obfuscated Android RAT captures screen/audio and controls SMS
    crit: hostile
    conf: 0.995
    for: [apk, zip, dex]
    attack: T1027,T1113,T1123,T1636.004
    all:
      - id: micro-behaviors/hardware/input/audio::android-media-recorder-reference
      - id: micro-behaviors/hardware/display/screen::android-media-projection-screen-capture
      - id: objectives/collection/messaging/sms::android-compact-sms-tokens
      - id: micro-behaviors/os/privilege/manifest::sms-manager-class
      - id: objectives/command-and-control/backdoor/rat/control::android-screen-sender-fields
      - id: objectives/anti-static/obfuscation/name-mangling/class-folder::android-wide-random-package-namespace

  - id: android-accessibility-sensor-spyware
    desc: Android accessibility sensor spyware
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-config
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-request-layout
      - id: micro-behaviors/hardware/display/screen::android-screen-capture-capability
      - id: micro-behaviors/hardware/display/camera::android-camera-capture-capability
    any:
      - id: micro-behaviors/ui/window/manage/overlay::floating-window-layouts
      - id: micro-behaviors/os/privilege/manifest::device-admin-policy-resource
      - id: micro-behaviors/hardware/display/screen::android-screen-lock-layout

  - id: android-notification-usage-surveillance
    desc: Android notification usage surveillance
    crit: suspicious
    conf: 0.95
    unless:
      # SmsForwarder deliberately exposes notification forwarding and device
      # inventory controls; these same declarations are spyware-like only in
      # an unrecognized application.
      - id: well-known/app/communication/sms-forwarder::smsforwarder-application
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-application
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-package
    scope: outer
    all:
      - id: micro-behaviors/os/privilege/manifest::bind-notification-listener
      - id: micro-behaviors/os/privilege/manifest::notification-listener-service
      - id: micro-behaviors/os/privilege/manifest::package-usage-stats
    any:
      - id: micro-behaviors/os/privilege/manifest::query-all-packages
      - id: micro-behaviors/os/privilege/manifest::get-installed-apps

  - id: android-loader-backed-notification-surveillance
    desc: Opaque-loader Android notification and device surveillance
    crit: hostile
    conf: 0.995
    all:
      - id: android-notification-usage-surveillance
      - id: micro-behaviors/os/sysinfo/platform/mobile::android-persistent-id-collection
      - id: micro-behaviors/os/sysinfo/platform/mobile::android-hardware-id-collection
      - id: objectives/command-and-control/dropper/staged-loader::android-opaque-asset-dex-loader
    any:
      - id: micro-behaviors/os/clipboard/access::clipboard-manager
      - id: micro-behaviors/os/privilege/manifest::manage-external-storage

  - id: android-cleaner-privacy-scan-modules
    desc: Android cleaner privacy scan modules
    crit: suspicious
    conf: 0.94
    all:
      - id: cleaner-location-privacy-module
      - id: cleaner-social-clean-module
      - id: cleaner-app-uninstall-module
    any:
      - id: cleaner-app-scan-animation
      - id: cleaner-location-scan-animation
      - id: metadata/package/files/mobile-package::apk-multiple-secondary-dex

  - id: android-cleaner-surveillance-riskware
    desc: Android cleaner surveillance riskware
    crit: hostile
    conf: 0.98
    all:
      - id: android-notification-usage-surveillance
      - id: micro-behaviors/os/sysinfo/platform/mobile::android-persistent-id-collection
      - id: micro-behaviors/os/telemetry/activity::android-attribution-tracking-sdks
      - id: objectives/command-and-control/channel/http/uri::android-cleaner-signed-backend-channel
    any:
      - id: objectives/persistence/system/service/mobile::android-boot-jobservice-persistence
#      - id: objectives/impact/wipe/disk/mass-delete::android-full-storage-file-shredder

  # Accessibility plus a WebView form sniffer bridge is the banker
  # "webinject" shape: inject JS that posts field values to
  # Android.snifferData while the accessibility service controls the UI.
  - id: android-accessibility-webview-form-sniffer
    desc: Android accessibility WebView form sniffer
    crit: hostile
    conf: 0.98
    attack: T1417.001,T1417.002
    mbc: F0006
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-config
      - id: micro-behaviors/process/interpreter/webview::webview-form-sniffer-bridge
      - id: micro-behaviors/process/interpreter/webview::add-javascript-interface
    any:
      - id: micro-behaviors/process/interpreter/webview::webview-sniffer-guard
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-settings-intent
