defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp]
  attack: T1005,T1113

traits:
  - id: teamserver-screenshot-loot-call
    desc: Teamserver routes screenshot into loot view
    crit: suspicious
    conf: 0.99
    if:
      type: symbol
      kind: call
      regex: '(^|\.)LootWidget\.AddScreenshot$'

  - id: teamserver-download-loot-call
    desc: Teamserver routes download into loot view
    crit: suspicious
    conf: 0.99
    if:
      type: symbol
      kind: call
      regex: '(^|\.)LootWidget\.AddDownload$'

composite_rules:
  - id: teamserver-agent-loot-dispatch
    desc: Teamserver collects agent screenshots and downloads
    crit: hostile
    conf: 0.999
    scope: leaf
    near_lines: 20
    all:
      - id: teamserver-screenshot-loot-call
      - id: teamserver-download-loot-call
