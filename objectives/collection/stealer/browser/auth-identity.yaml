defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1119

traits:
  - id: browser-auth-route-pattern-name
    desc: Names an authentication route matcher
    crit: notable
    conf: 0.9
    if:
      type: text
      word: AUTH_URL_PATTERN

  # `browser-auth-route-terms` moved to
  # micro-behaviors/data/parse/vocabulary::auth-route-vocabulary -- four
  # occurrences of auth/login/session/token is vocabulary, not browser theft.

  - id: auth-provider-store-key
    desc: References a named authentication-provider store
    crit: notable
    conf: 0.94
    if:
      type: literal
      kind: string
      exact: okta-token-storage

  - id: auth-storage-read-call
    desc: Reads entries from enumerated browser storage
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'getItem\(\s*["\x27](access_token|refresh_token|okta-token-storage)["\x27]'

  - id: identity-normalizer-call
    desc: Normalizes identities from browser data
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: normalizeIdentity

composite_rules:
  # `auth-provider-store-key` and `auth-storage-read-call` are useful markers
  # on their own, but an all-site content script that reads the Okta store,
  # places the result in a Bearer header, and makes HTTP requests is a distinct
  # credential-reuse capability. Keep this suspicious rather than hostile:
  # ticket and identity integrations may intentionally call their own APIs.
  - id: broad-extension-auth-storage-bearer-reuse
    desc: Broad-access extension reuses stored auth tokens in HTTP requests
    crit: suspicious
    conf: 0.97
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript, html]
    all:
      - id: metadata/permission/host::broad-host-access
      - id: metadata/permission/host::content-script-all-urls
      - id: auth-provider-store-key
      - id: auth-storage-read-call
      - id: micro-behaviors/communications/http/request/credentials::js-bearer-header-from-auth-token
      - id: micro-behaviors/communications/http/request/client::js-fetch-call

  - id: browser-auth-response-identity-interception
    desc: Intercepts authentication responses to harvest user identity
    crit: suspicious
    conf: 0.98
    all:
      - id: browser-auth-route-pattern-name
      - id: micro-behaviors/data/parse/vocabulary::auth-route-vocabulary
      - id: metadata/file/string/telemetry::identity-name-fields
      - id: metadata/file/string/telemetry::identity-email-fields
      - id: micro-behaviors/process/hook/xhr::fetch-hook
      - id: micro-behaviors/communications/http/client/response-body::fetch-response-clone-json
    any:
      - id: micro-behaviors/process/hook/xhr::xhr-response-json-intercept
      - id: micro-behaviors/process/hook/xhr::open-hook
      - id: micro-behaviors/process/hook/xhr::send-hook

  - id: browser-auth-storage-identity-scan
    desc: Scans browser auth stores for user identity
    crit: suspicious
    conf: 0.98
    attack: T1119,T1539
    all:
      - id: micro-behaviors/communications/http/oauth::access-token
      - id: micro-behaviors/communications/http/oauth::refresh-token
      - id: auth-provider-store-key
      - id: auth-storage-read-call
    any:
      - id: micro-behaviors/data/db/web-storage::browser-storage-sweep-loop
      - id: micro-behaviors/communications/http/cookie-store::document-cookie-split-iterate
