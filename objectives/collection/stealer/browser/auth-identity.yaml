defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1119

traits:
  - id: browser-auth-route-pattern-name
    desc: Names an authentication route matcher
    crit: component
    conf: 0.9
    if:
      type: text
      word: AUTH_URL_PATTERN

  # `browser-auth-route-terms` moved to
  # micro-behaviors/data/parse/vocabulary::auth-route-vocabulary -- four
  # occurrences of auth/login/session/token is vocabulary, not browser theft.

  - id: auth-response-first-name-field
    desc: Authentication firstName response field
    crit: component
    if:
      type: text
      word: firstName
  - id: auth-response-last-name-field
    desc: Authentication lastName response field
    crit: component
    if:
      type: text
      word: lastName
  - id: auth-response-user-name-field
    desc: Authentication userName response field
    crit: component
    if:
      type: text
      word: userName
  - id: auth-response-email-address-field
    desc: Authentication emailAddress response field
    crit: component
    if:
      type: text
      word: emailAddress
  - id: auth-response-primary-email-field
    desc: Authentication primaryEmail response field
    crit: component
    if:
      type: text
      word: primaryEmail
  - id: auth-response-work-email-field
    desc: Authentication workEmail response field
    crit: component
    if:
      type: text
      word: workEmail

  - id: auth-provider-store-key
    desc: References a named authentication-provider store
    crit: notable
    conf: 0.94
    if:
      type: literal
      kind: string
      exact: okta-token-storage

  - id: auth-storage-read-call
    desc: Reads entries from enumerated browser storage
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'getItem\(\s*["\x27](access_token|refresh_token|okta-token-storage)["\x27]'

  - id: identity-normalizer-call
    desc: Normalizes identities from browser data
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: normalizeIdentity

composite_rules:
  - id: auth-response-name-fields
    desc: References multiple explicit user-name fields
    crit: component
    conf: 0.92
    any:
      - id: auth-response-first-name-field
      - id: auth-response-last-name-field
      - id: auth-response-user-name-field
  - id: auth-response-email-fields
    desc: References user-email response fields
    crit: component
    conf: 0.92
    any:
      - id: metadata/file/string/telemetry::telemetry-email-field-useremail
      - id: auth-response-email-address-field
      - id: auth-response-primary-email-field
      - id: auth-response-work-email-field
  - id: browser-auth-response-identity-interception
    desc: Intercepts authentication responses to harvest user identity
    crit: suspicious
    conf: 0.98
    all:
      - id: browser-auth-route-pattern-name
      - id: micro-behaviors/data/parse/vocabulary::auth-route-vocabulary
      - id: auth-response-name-fields
      - id: auth-response-email-fields
      - id: micro-behaviors/process/hook/xhr::fetch-hook
      - id: micro-behaviors/communications/http/client/response-body::fetch-response-clone-json
    any:
      - id: micro-behaviors/process/hook/xhr::xhr-response-json-intercept
      - id: micro-behaviors/process/hook/xhr::open-hook
      - id: micro-behaviors/process/hook/xhr::send-hook

  - id: browser-auth-storage-identity-scan
    desc: Scans browser auth stores for user identity
    crit: suspicious
    conf: 0.98
    attack: T1119,T1539
    all:
      - id: micro-behaviors/communications/http/oauth::access-token
      - id: micro-behaviors/communications/http/oauth::refresh-token
      - id: auth-provider-store-key
      - id: auth-storage-read-call
    any:
      - id: micro-behaviors/data/db/web-storage::browser-storage-sweep-loop
      - id: micro-behaviors/communications/http/cookies::document-cookie-split-iterate
