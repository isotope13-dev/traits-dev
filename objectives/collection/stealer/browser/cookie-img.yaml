# Cookie theft that reconstructs an image beacon or MSXML POST. Plaintext
# worms are often collected as .txt, so text is in scope with JavaScript.
defaults:
  platforms: [windows, unix]
  for: [javascript, html, text]
  attack: T1539,T1041
  mbc: C0002

traits:
  - id: cookie-img-src-beacon
    desc: Writes an image URL built from cookies
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'document\.cookie[\s\S]{0,500}<img src='

composite_rules:
  - id: cookie-image-beacon-exfil
    desc: Cookies beacon through an image URL
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/cookie-store::html-document-cookie-read
      - id: cookie-img-src-beacon

  - id: zip-cookie-image-beacon
    desc: Zip stages a cookie-image beacon worm
    crit: hostile
    conf: 0.95
    scope: outer
    for: [zip, text, javascript]
    all:
      - id: micro-behaviors/communications/http/cookie-store::html-document-cookie-read
      - id: cookie-img-src-beacon

  - id: cookie-msxml-exfil
    desc: Cookies are read then posted via MSXML
    crit: hostile
    conf: 0.94
    for: [javascript, text]
    all:
      - id: micro-behaviors/communications/http/cookie-store::html-document-cookie-read
      - id: micro-behaviors/communications/http/client/xmlhttp::msxml-xmlhttp-progid-text

  - id: zip-cookie-msxml-exfil
    desc: Zip stages an MSXML cookie thief
    crit: hostile
    conf: 0.94
    scope: outer
    for: [zip, text, javascript]
    all:
      - id: micro-behaviors/communications/http/cookie-store::html-document-cookie-read
      - id: micro-behaviors/communications/http/client/xmlhttp::msxml-xmlhttp-progid-text

  - id: msxml-image-cookie-worm
    desc: MSXML worm beacons cookies with an image
    crit: hostile
    conf: 0.94
    for: [javascript, text]
    all:
      - id: cookie-img-src-beacon
      - id: micro-behaviors/communications/http/client/xmlhttp::msxml-xmlhttp-progid-text

  - id: zip-msxml-image-cookie-worm
    desc: Zip stages an MSXML cookie-image worm
    crit: hostile
    conf: 0.94
    scope: outer
    for: [zip, text, javascript]
    all:
      - id: cookie-img-src-beacon
      - id: micro-behaviors/communications/http/client/xmlhttp::msxml-xmlhttp-progid-text
