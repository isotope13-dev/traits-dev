defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1056.001,T1176

composite_rules:
  - id: browser-omnibox-search-bar-exfil
    desc: Windows hooks poll active browser search bar and exfiltrate omnibox queries
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/ui/window/hook::windows-hook-chain-api-cluster
      - id: micro-behaviors/ui/window/enumerate::managed-active-window-title-api-set
      - id: micro-behaviors/os/registry/policy/reference::chrome-extension-force-install-policy-key
      - id: objectives/impact/ui/manipulation/browser::omnibox-search-query-exfil-params
      - id: objectives/impact/ui/manipulation/browser::browser-search-bar-monitor-timer
