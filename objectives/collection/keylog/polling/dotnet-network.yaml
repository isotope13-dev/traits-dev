composite_rules:
- id: dotnet-polling-keylog-with-network-references
  desc: Polling keylog recording co-occurs with network client APIs
  crit: suspicious
  conf: 0.95
  all:
  - id: objectives/collection/keylog/polling::dotnet-polling-keylogger
  any:
  - id: micro-behaviors/communications/socket/tcp::dotnet-tcpclient-stream-references
  - id: micro-behaviors/communications/http/client/managed::webclient
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: well-known/tool/sysadmin/sandboxie/
    - id: well-known/lib/runtime/native-platform/slint/
    - id: well-known/lib/media/sdl/
  for:
  - pe
  - dll
  platforms:
  - windows
