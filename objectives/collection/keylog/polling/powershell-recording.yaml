defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
composite_rules:
- id: powershell-translated-keystroke-recording
  desc: Polls and records translated keystrokes
  crit: hostile
  all:
  - id: micro-behaviors/data/string/concat::powershell-append-object-string
  - id: micro-behaviors/hardware/input/keyboard/poll::pinvoke-async-key-state
  - id: micro-behaviors/hardware/input/keyboard/layout::powershell-tounicode-call
  - id: well-known/tool/offensive/powershell-empire::input-capture-module-functions
- id: powershell-foreground-keystroke-attribution
  desc: Records keys with foreground-window attribution
  crit: hostile
  all:
  - id: micro-behaviors/hardware/input/keyboard/poll::pinvoke-async-key-state
  - id: micro-behaviors/hardware/input/keyboard/layout::powershell-tounicode-call
  - id: micro-behaviors/ui/window/enumerate::get-foreground-window-source
  - id: micro-behaviors/data/string/concat::powershell-append-object-string
# Reflective variant: GetAsyncKeyState is resolved via GetMethod and
# invoked in a polling loop, and captured keys are appended to a file.
# No ::GetAsyncKeyState call, ToUnicode translation, or Empire helper
# ever appears, so the P/Invoke composites above cannot see it.
- id: powershell-reflective-keystroke-recording
  desc: Reflectively polls and records keystrokes to file
  crit: hostile
  all:
  - id: micro-behaviors/hardware/input/keyboard/poll::reflective-async-key-state
  - id: micro-behaviors/fs/write/file/full::out-file
