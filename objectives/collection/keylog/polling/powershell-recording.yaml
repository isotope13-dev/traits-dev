defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
composite_rules:
- id: powershell-translated-keystroke-recording
  desc: Polls and records translated keystrokes
  crit: hostile
  all:
  - id: micro-behaviors/data/string/concat::powershell-append-object-string
  - id: micro-behaviors/hardware/input/keyboard/poll::pinvoke-async-key-state
  - id: micro-behaviors/hardware/input/keyboard/layout::powershell-tounicode-call
  - id: well-known/tool/offensive/powershell-empire::input-capture-module-functions
- id: powershell-foreground-keystroke-attribution
  desc: Records keys with foreground-window attribution
  crit: hostile
  all:
  - id: micro-behaviors/hardware/input/keyboard/poll::pinvoke-async-key-state
  - id: micro-behaviors/hardware/input/keyboard/layout::powershell-tounicode-call
  - id: micro-behaviors/ui/window/enumerate::get-foreground-window-source
  - id: micro-behaviors/data/string/concat::powershell-append-object-string
