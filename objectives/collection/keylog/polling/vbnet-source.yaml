# VB.NET source (typed vbs) that polls every key's state and translates the
# keyboard state to characters is building a keystroke log.
# The recording sink varies (registry, file, socket), so this stays at the
# same severity as the compiled managed-polled-character-recording profile.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1056.001

composite_rules:
  - id: vbnet-polled-keystroke-translation
    desc: VB.NET polls key state and translates to text
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
      - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state-str
      - id: micro-behaviors/hardware/input/keyboard/layout::to-unicode-ex-str
