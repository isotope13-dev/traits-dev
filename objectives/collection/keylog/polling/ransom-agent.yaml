defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1056.001
composite_rules:
  - id: native-translated-key-recording-profile
    desc: Native key polling and translation with record labels
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::imported-polling-key-translation
      - id: micro-behaviors/hardware/input/keyboard/label::recorded-special-key-label
  # The control profile requires socket I/O, ransom controls, and distinct
  # keylogger start/stop controls. Translation and record labels supply the
  # acquisition evidence; no source-to-network data binding is asserted.
  - id: ransom-agent-polled-key-recording
    desc: Ransom-control agent with key polling and record labels
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/remote-command/task-schema::socket-ransom-surveillance-control-profile
      - id: native-translated-key-recording-profile
