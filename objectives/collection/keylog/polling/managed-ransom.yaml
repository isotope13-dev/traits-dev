defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # The recorder has both a hook and a key-state fallback. Capture the latter
  # from calls in the polling worker, independently of its chosen class names
  # or log path. Ransom input lockout supplies the abuse context.
  - id: managed-ransom-key-state-log-append
    desc: Ransom lockout with nearby key polling and log appends
    crit: hostile
    conf: 0.96
    attack: T1056.001
    all:
      - id: objectives/impact/ransom/extortion::managed-ransom-input-lockout
      - id: managed-key-state-log-append-calls
  - id: managed-key-state-log-append-calls
    desc: Nearby managed key polling and text append calls
    crit: suspicious
    conf: 0.94
    near_bytes: 128
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::resolved-getasynckeystate-call
      - id: micro-behaviors/fs/write/file/append::managed-appendalltext-call
