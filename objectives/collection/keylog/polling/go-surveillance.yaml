defaults:
  platforms: [windows]
  for: [go]
  attack: T1056.001

composite_rules:
  - id: go-windows-keylogger-foreground
    desc: Go keylogging with foreground context
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
      - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state-str
      - id: micro-behaviors/ui/window/enumerate::go-get-foreground-window-call
    any:
      - id: micro-behaviors/hardware/input/keyboard/layout::to-unicode-ex-str
      - id: micro-behaviors/hardware/input/keyboard/layout::map-virtual-key
    near_bytes: 1024

  - id: go-polling-keylogger
    desc: Go keylogger polls keystrokes via GetAsyncKeyState
    crit: hostile
    conf: 0.98
    for: [pe]
    mbc: B0015
    all:
      - id: metadata/lang/compiler/systems::go-binary-comp
      - id: metadata/binary/symbols/name/qualified::go-main-run-keylogger-name
      - id: micro-behaviors/hardware/input/keyboard/label::keylogger-string
    any:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
