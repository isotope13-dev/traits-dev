defaults:
  platforms: [windows]
  for: [go]

composite_rules:
  - id: go-windows-keylogger-foreground
    desc: Go keylogging with foreground context
    crit: suspicious
    conf: 0.95
    attack: T1056.001
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
      - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state-str
      - id: micro-behaviors/ui/window/enumerate::go-get-foreground-window-call
    any:
      - id: micro-behaviors/hardware/input/keyboard/layout::to-unicode-ex-str
      - id: micro-behaviors/hardware/input/keyboard/layout::map-virtual-key
    near_bytes: 1024
