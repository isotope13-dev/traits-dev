defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # Record-format evidence distinguishes this from ordinary GUI key polling.
  # This is a co-occurrence profile, not a proven source-to-file flow.
  - id: native-polling-record-label-profile
    desc: Key polling with record labels and write API
    crit: suspicious
    conf: 0.93
    attack: T1056.001
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
      - id: micro-behaviors/hardware/input/keyboard/label::enter-key-line-record
      - id: micro-behaviors/hardware/input/keyboard/label::recorded-special-key-label
      - id: micro-behaviors/fs/write/file/handle::writefile-api-text-reference
