defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: vb6-obfuscated-entry-recording
    desc: Obfuscated VB6 keyboard polling with window tracking and XML key-entry records
    crit: hostile
    conf: 0.97
    attack: T1056.001
    all:
      - id: objectives/anti-static/obfuscation/string/encoding::vb6-feedback-triplet-string-decoder
      - id: micro-behaviors/dylib/load/runtime::vb6-runtime-dll-reference
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
      - id: micro-behaviors/ui/window/enumerate::get-foreground-window-pinvoke
      - id: micro-behaviors/data/format/xml::xml-enter-record-delimiters
      - id: micro-behaviors/communications/email/send/smtp::cdo-smtp-mail-api-cluster
