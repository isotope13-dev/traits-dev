defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: runkey-key-polling-taskmgr-policy
    desc: Run-key, key polling, and Taskmgr indicators
    crit: suspicious
    attack: T1056.001,T1547.001,T1112
    all:
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
      - id: "micro-behaviors/os/registry/keys/policy::disable-taskmgr"
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

