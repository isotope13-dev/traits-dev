# Polling and autostart references need independent recording evidence.
# A key-state API can also service a hotkey beside an unrelated hook logger;
# require the high-bit test and byte-range loop layout as polling evidence.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1056.001,T1547.001
composite_rules:
  - id: dotnet-persisted-polling-keylog-recording
    desc: Managed keylog recording with polling and Run-key references
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/hardware/input/keyboard/label::keylog-record-label
      - id: metadata/binary/symbols/name::dotnet-append-method-name
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
      - id: micro-behaviors/data/control-flow/branch::cil-high-bit-byte-limit-checks
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
    unless:
      - id: metadata/signed/platform/
