# .NET polling keylogger that persists and exfiltrates. A managed stub
# polling GetAsyncKeyState, writing a CurrentVersion Run key, and moving
# data over TcpClient/WebClient is a collection implant: ordinary software
# that polls the keyboard (games, accessibility tools) does not install
# Run-key persistence and a network channel in the same binary.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1056.001,T1547.001,T1071
composite_rules:
  - id: dotnet-persisted-polling-keylog-exfil
    desc: .NET polling keylogger persists via Run key with network exfiltration
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
    any:
      - id: micro-behaviors/communications/socket/tcp::dotnet-tcpclient-stream-references
      - id: micro-behaviors/communications/http/client/managed::webclient
    unless:
      - id: metadata/signed/platform/
