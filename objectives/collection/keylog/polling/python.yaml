# Python polling keylogger composite.
# ATT&CK: T1056.001 (Input Capture: Keylogging)
#
# The polling shape is a virtual-key sweep (a range starting at 0x08, past
# the mouse-button codes) driven through GetAsyncKeyState — the structure
# of keystroke capture rather than a single hotkey check. The transmission
# legs require the captured state to leave the host over a socket or a
# Discord webhook; polling alone stays at the notable micro legs.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1056.001
  mbc: E1056.001

composite_rules:
  - id: python-polling-keylogger
    desc: Python key-state polling with keystroke transmission
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::python-async-key-state-poll
      - id: micro-behaviors/hardware/input/keyboard/poll::python-virtual-key-range
    any:
      - id: micro-behaviors/communications/socket/send::python-sendall
      - id: micro-behaviors/communications/http/webhook::python-discord-webhook-api-path
