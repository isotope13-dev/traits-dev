defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # The bytecode establishes a bounded high-bit polling-shaped loop; API,
  # character conversion and buffer/recorder names add recording context.
  # These observations do not bind the returned character to a send/write.
  - id: managed-polled-character-recording
    desc: Managed key-state loop with recording markers
    crit: suspicious
    conf: 0.96
    attack: T1056.001
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/data/control-flow/branch::cil-high-bit-byte-limit-backedge
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
      - id: micro-behaviors/hardware/input/keyboard/layout::to-unicode-str
      - id: micro-behaviors/hardware/input/keyboard/label::keylogger-string
      - id: micro-behaviors/data/string/concat::dotnet-stringbuilder-type
      - id: metadata/binary/symbols/name/token::dotnet-append-method-name
