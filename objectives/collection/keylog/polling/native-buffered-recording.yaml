defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1056.001
composite_rules:
  # Recording behavior, rather than unsigned Microsoft version fields,
  # establishes the claim. The transformed buffer feeds the write call.
  - id: native-xor-key-recording
    desc: Polling key recorder with XOR-to-write code
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
      - id: micro-behaviors/hardware/input/keyboard/poll::x86-key-state-high-bit-test
      - id: micro-behaviors/hardware/input/keyboard/label::enter-key-line-record
      - id: micro-behaviors/ui/window/enumerate::get-foreground-window
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/data/encode/xor::x86-xor-copy-write-handoff
