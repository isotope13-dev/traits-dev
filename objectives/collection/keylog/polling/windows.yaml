defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  attack: T1056.001
  mbc: B0015
  crit: hostile
composite_rules:
- id: api-resolved-input-window-surveillance
  desc: Hashed API resolution with keyboard polling and active-window tracking
  conf: 0.98
  attack: T1056.001,T1027.002,T1055
  all:
  - id: micro-behaviors/os/api-resolution/digest-export/resolution::multiply-shift-xor-export-walk
  - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
  - id: micro-behaviors/ui/window/enumerate::get-foreground-window
  - id: metadata/binary/instruction/sequence/unspecified::allocation-like-argument-patterns
  any:
  - id: micro-behaviors/hardware/input/mouse::get-cursor-pos
  - id: micro-behaviors/ui/window/enumerate::enum-windows
- id: hashed-polling-keylogger-window-surveillance
  desc: Hashed API polling keylogger with active-window tracking
  conf: 0.97
  attack: T1056.001,T1027.007
  all:
  - id: micro-behaviors/os/api-resolution/digest-export/resolution::multiply-shift-xor-export-walk
  - id: micro-behaviors/hardware/input/keyboard/poll::polling-keyboard-api-cluster
  - id: micro-behaviors/hardware/input/keyboard/poll::foreground-window-input-state
- id: packed-polling-key-translation-logger
  desc: Unsigned PE has high entropy and key polling and translation APIs
  crit: suspicious
  conf: 0.97
  attack: T1056.001,T1027.002
  all:
  - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
  - id: micro-behaviors/hardware/input/keyboard/layout::to-ascii-ex-import
  - id: metadata/signature/absent::unsigned-missing-signature-record
  any:
  - id: metadata/binary/code/entropy::code-entropy-over-7p4
  - id: metadata/binary/section/entropy::high-entropy-exec-section
