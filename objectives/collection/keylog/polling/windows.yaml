# Windows keylogging intent composites
# ATT&CK: T1056.001 (Input Capture: Keylogging)
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: "T1056.001"
  mbc: "B0015"

composite_rules:
- id: api-resolved-input-window-surveillance
  desc: Hashed API resolution with keyboard polling and active-window tracking
  crit: hostile
  conf: 0.98
  attack: T1056.001,T1027.002,T1055
  all:
  - id: micro-behaviors/os/api-resolution/hash-based::multiplicative-hash-loop
  - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
  - id: micro-behaviors/ui/window/enumerate::get-foreground-window
  - id: micro-behaviors/mem/alloc/executable::executable-allocation-indicator
  any:
  - id: micro-behaviors/hardware/input/mouse/position::get-cursor-pos
  - id: micro-behaviors/ui/window/enumerate::enum-windows
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
- id: hashed-polling-keylogger-window-surveillance
  desc: Hashed API polling keylogger with active-window tracking
  crit: hostile
  conf: 0.97
  attack: T1056.001,T1027.007
  all:
  - id: micro-behaviors/os/api-resolution/hash-based::multiplicative-hash-loop
  - id: micro-behaviors/hardware/input/keyboard/poll::polling-keyboard-api-cluster
  - id: micro-behaviors/hardware/input/keyboard/poll::foreground-window-input-state
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
  - id: well-known/game/
  - id: well-known/tool/sysadmin/
  - id: well-known/app/utility/siw::siw-family-identity
  - id: metadata/binary/installer/family::qt-installer-framework
# Older polling keyloggers skip hashing: a handful of static imports (key
# polling plus the loader triplet) with everything else resolved at runtime.
# The minimal-import plus dynamic-loading shape plus key polling convicts;
# games and admin tools are carved out like the hashed siblings above.
# The variant below covers the same no-hashing shape when the binary also
# translates polled virtual keys and carries an HTTP channel: polling proves
# capture, translation proves the keystrokes are interpreted, and the HTTP
# URL proves they can leave the host. Each role is required separately so
# hotkey handlers (polling without translation) and telemetry clients
# (HTTP without capture) do not convict.
- id: polling-keylogger-translation-exfil-channel
  desc: Polling keylogger translates keys with an HTTP channel
  crit: hostile
  conf: 0.94
  all:
  - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
  - id: micro-behaviors/hardware/input/keyboard/layout::map-virtual-key-str
  - id: micro-behaviors/communications/http/url/domain::http-url-binary
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
  - id: well-known/game/
  - id: well-known/tool/sysadmin/
  - id: well-known/lib/
  - id: metadata/binary/installer/family/
