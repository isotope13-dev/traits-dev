defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1056.001
  mbc: E1056.001
composite_rules:
  - id: ps-polling-keylogger
    desc: PowerShell polls and logs keyboard characters
    crit: hostile
    conf: 0.97
    near_lines: 30
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::pinvoke-async-key-state
      - id: micro-behaviors/hardware/input/keyboard/layout::powershell-tounicode-call
      - id: micro-behaviors/fs/write/file/append::powershell-dotnet-append-text
