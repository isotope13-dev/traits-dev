# .NET Polling Keylogger Composites
# Detects VB.NET/C# RATs using GetAsyncKeyState + ToUnicodeEx + window tracking
# ATT&CK: T1056.001 (Input Capture: Keylogging)
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1056.001
  mbc: E1056.001

composite_rules:
  - id: dotnet-polling-keylogger
    desc: .NET polling keylogger with window context
    # Local polling and window tracking establish covert input collection,
    # but remote-control tools can implement the same mechanism. Network
    # transport raises the child composite below to hostile.
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/hardware/input/keyboard/poll::polling-keylogger-api-cluster
      - id: micro-behaviors/ui/window/enumerate::get-window-thread-process-id
    any:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: well-known/tool/sysadmin/sandboxie/
        - id: well-known/lib/runtime/native-platform/slint/
    unless:
      - id: metadata/binary/resource/size::large-rsrc-section
      - id: well-known/lib/media/sdl/
      - id: metadata/lang/compiled/
      # User32 bindings declare GetAsyncKeyState beside window-thread queries.
      - id: well-known/lib/platform/vanara::vanara-user32-pinvoke
