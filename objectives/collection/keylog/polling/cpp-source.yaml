defaults:
  crit: hostile
  for: [c, cpp]
  platforms: [windows]
  attack: T1056.001
  mbc: E1056.001

composite_rules:
  - id: cpp-windows-polling-keylogger-source
    desc: C/C++ Windows polling keylogger source
    conf: 0.96
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
      - id: micro-behaviors/hardware/input/keyboard/poll::cpp-virtual-key-range-loop
      - id: micro-behaviors/hardware/input/keyboard/label::cpp-key-label-map-uppercase
      - id: micro-behaviors/fs/write/file/append::cpp-ofstream-append-mode
    any:
      - id: micro-behaviors/process/create/thread::cpp-dll-thread-entry
      - id: micro-behaviors/ui/window/enumerate::get-foreground-window
      - id: micro-behaviors/ui/window/enumerate::get-window-text
  - id: cpp-dll-thread-keylog-writer
    desc: C/C++ DLL thread keylog writer
    conf: 0.97
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
      - id: micro-behaviors/fs/write/file/append::cpp-ofstream-append-mode
      - id: micro-behaviors/process/create/thread::cpp-dll-thread-entry
