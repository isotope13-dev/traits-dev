# Polling-based input monitoring (without SetWindowsHookEx)
# Some malware and game cheats use polling APIs (GetKeyState, GetAsyncKeyState)
# combined with clipboard access and mouse monitoring for input capture.
# Unlike hook-based keyloggers, these don't install keyboard hooks.
# ATT&CK: T1056.001 (Input Capture: Keylogging)
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: "T1056.001"
  mbc: "B0015"

composite_rules:
  - id: packed-sparse-key-state-collector
    desc: Packed sparse-import keyboard state collector
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
      - id: objectives/anti-static/pack/detect::aspack-marker
      - id: objectives/anti-static/pack/runtime::pe-import-count-under-10
      - id: metadata/binary/section/permission::writable-text-section
    unless:
      - id: metadata/signed/platform/
      - id: well-known/game/
