defaults:
  for: [c, markdown]
  platforms: [linux]
  attack: T1056.001

traits:
  - id: kernel-key-notifier-registration
    desc: Registers a kernel keyboard notifier
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bregister_keyboard_notifier\s*\('
  - id: kernel-keycode-event-logging
    desc: Logs keycode events from keyboard notifier
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(pr_info|printk)\s*\([^;\n]{0,120}(param|event)->(value|keycode)'
  - id: kernel-keycode-event-filter
    desc: Filters keyboard notifier key events
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'code\s*==\s*KBD_KEYCODE'

composite_rules:
  - id: kernel-keyboard-notifier-keylogger
    desc: Kernel keyboard notifier logs keypress codes
    crit: hostile
    conf: 0.98
    all:
      - id: kernel-key-notifier-registration
      - id: kernel-keycode-event-logging
      - id: kernel-keycode-event-filter
