defaults:
  platforms: [unix]
  for: [php]
  attack: T1056.001
traits:
  # micro-behaviors/process/tty/terminal::stty-cmd is for: [elf, macho, pe, c]
  # only; a PHP script shells out to the same `stty` command line as text.
  - id: php-stty-cmd
    desc: stty command with an argument
    crit: notable
    conf: 0.4
    if:
      type: text
      regex: '(?i)\bstty\s+[-+]?\w'
composite_rules:
  - id: php-tty-keylog
    desc: PHP script capturing keystrokes from /dev/tty
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/spawn::php-exec
      - id: micro-behaviors/fs/write/file/handle::php-file-write
      - id: micro-behaviors/fs/path/device/terminal::dev-tty
      - id: php-stty-cmd
    unless:
      - id: well-known/tool/packaging/composer::composer-phar-cli
      - id: well-known/lib/web/laravel::laravel-context
      - id: well-known/lib/web/symfony::symfony-context
      - id: well-known/lib/web/symfony::symfony-framework
