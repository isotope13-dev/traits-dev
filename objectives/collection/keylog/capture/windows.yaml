# Windows keylogging intent composites
# ATT&CK: T1056.001 (Input Capture: Keylogging)
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: "T1056.001"
  mbc: "B0015"
composite_rules:
# GUI runtimes that legitimately combine a keyboard hook, key-state reads and
# foreground-window queries as ordinary input plumbing. Chromium/Electron is the
# largest such runtime: it installs hooks for the Keyboard Lock API and global
# shortcuts, translates keys via GetKeyboardState/MapVirtualKey, and tracks the
# active window for focus -- so every Electron app matched the surveillance
# composites below on framework code alone.
- id: known-gui-runtime-input-exception
  desc: GUI runtime input-hook exception
  crit: exception
  conf: 0.99
  any:
  - id: metadata/library/mfc/
  - id: well-known/app/communication/coremail/
  - id: well-known/lib/runtime/electron::electron-chromium-runtime-strong
  - id: well-known/lib/runtime/jvm::windows-jdk-awt-runtime
# Keep the broader GUI-runtime exception reusable by other capture rules, while
# grouping the additional known Windows tools that are specific to this detector.
- id: windows-hook-keyboard-state-exception
  desc: Known Windows input-hook software exception
  crit: exception
  conf: 0.99
  any:
  - id: known-gui-runtime-input-exception
  - id: well-known/tool/reverse-engineering/pe-explorer/
  - id: well-known/tool/sysadmin/iobit-unlocker/
  - id: well-known/lib/platform/swt::windows-native-library
  - id: well-known/lib/media/videolan/
  - id: well-known/dual-use/transfer/winscp/
  - id: well-known/app/storage/syncback/
  - id: well-known/app/productivity/comfort-software/
  - id: well-known/tool/reverse-engineering/resource-hacker/
  - id: well-known/dual-use/transfer/winscp::app
  - id: well-known/game/pvzlauncher::plants-vs-zombies-steam-target
  - id: well-known/app/infrastructure/vmware-workstation::workstation-ui-dll-identity
- id: windows-input-hook-key-state-monitor
  desc: Windows input hook with key-state and active-window capture
  # These APIs prove contextual input capture, but not theft: accessibility,
  # hotkey, and text-selection libraries expose the same mechanics openly.
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/hardware/input/keyboard/hook::set-windows-hook
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-low-level-keyboard-hook-const
  - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
  - id: micro-behaviors/ui/window/manage/control::get-foreground-window
  any:
  - id: micro-behaviors/hardware/input/keyboard/hook::map-virtual-key
  - id: micro-behaviors/hardware/input/keyboard/hook::get-keyboard-layout-str
  - id: micro-behaviors/hardware/input/keyboard/hook::call-next-hook-ex
  needs: 1
  unless:
  - id: metadata/binary/installer/family/
  - id: well-known/tool/reverse-engineering/
  - id: well-known/tool/sysadmin/
  # Known libraries expose hook and key-state APIs as reusable GUI plumbing;
  # the containing application needs stronger evidence before calling this
  # monitoring behavior.
  - id: well-known/lib/
  - id: well-known/app/system/cpuid::signer
  - id: well-known/app/productivity/wetype/
- id: windows-hook-keyboard-state-window-surveillance
  desc: Windows keyboard hook reads keys with active-window context
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/hardware/input/keyboard/hook::set-windows-hook
  # SetWindowsHookExW alone is common GUI plumbing; require a keyboard hook
  # type so ordinary Chromium/VCL hook lifecycle code does not imply capture.
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/hardware/input/keyboard/hook::call-next-hook-ex
  - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state
  - id: micro-behaviors/hardware/input/keyboard/hook::map-virtual-key
  - id: micro-behaviors/ui/window/manage/control::get-foreground-window
  - id: micro-behaviors/ui/window/manage/control::get-window-text
  unless:
  - id: windows-hook-keyboard-state-exception
- id: windows-hook-keypoll-foreground
  desc: Keyboard hook with key polling and foreground check
  crit: suspicious
  conf: 0.91
  all:
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
  - id: micro-behaviors/ui/window/manage/control::get-foreground-window
  - id: micro-behaviors/hardware/input/keyboard/hook::virtual-key-label-map
  any:
  - id: micro-behaviors/hardware/input/keyboard/hook::call-next-hook-ex
  - id: micro-behaviors/hardware/input/mouse/position::get-cursor-pos
  - id: micro-behaviors/ui/window/manage/control::get-message-pos
  needs: 1
  downgrade:
    any:
    - id: metadata/binary/metrics/structural::many-imports
    - id: metadata/package/versioning::pe-version-resource
    - id: metadata/build/manifest::pe-has-manifest
  unless:
  - id: well-known/tool/reverse-engineering/cff-explorer/
  - id: well-known/app/utility/siw::siw-family-identity
- id: windows-hook-keylogger
  desc: Keyboard hook with key state polling
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
  - id: micro-behaviors/hardware/input/keyboard/hook::virtual-key-label-map
  any:
  - id: micro-behaviors/hardware/input/keyboard/hook::call-next-hook-ex
  - id: micro-behaviors/ui/window/manage/control::get-foreground-window
  - id: micro-behaviors/ui/window/manage/control::get-window-text
  downgrade:
    all:
    - id: metadata/binary/metrics/structural::many-imports
    - id: metadata/package/versioning::pe-version-resource
  unless:
  - id: well-known/app/utility/siw::siw-family-identity
- id: windows-active-window-keylogger
  desc: Keyboard hook with active window context
  crit: suspicious
  conf: 0.92
  all:
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
  - id: micro-behaviors/ui/window/manage/control::get-foreground-window
  - id: micro-behaviors/ui/window/manage/control::get-window-text
  - id: micro-behaviors/hardware/input/keyboard/hook::virtual-key-label-map
  unless:
  - id: well-known/app/utility/siw::siw-family-identity
- id: windows-hook-state-keylogger
  desc: Windows hook with key state polling
  crit: suspicious
  conf: 0.93
  all:
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
  - id: micro-behaviors/hardware/input/keyboard/hook::virtual-key-label-map
  any:
  - id: micro-behaviors/ui/window/manage/control::get-foreground-window
  - id: micro-behaviors/ui/window/manage/control::get-window-text
  - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state-str
  - id: micro-behaviors/hardware/input/keyboard/layout::map-virtual-key-str
  needs: 2
  downgrade:
    all:
    - id: metadata/binary/metrics/structural::many-imports
    - id: metadata/package/versioning::pe-version-resource
  unless:
  - id: well-known/app/utility/siw::siw-family-identity
- id: windows-hook-window-title-keylogger
  desc: Keyboard hook records keys with foreground-window title
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
  - id: micro-behaviors/ui/window/manage/control::get-foreground-window
  - id: micro-behaviors/ui/window/manage/control::get-window-text
  any:
  - id: micro-behaviors/hardware/input/keyboard/hook::virtual-key-label-map
  - id: micro-behaviors/hardware/input/keyboard/hook::to-unicode-ex-str
  - id: micro-behaviors/hardware/input/keyboard/poll::polling-keylogger-api-cluster
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
  - id: well-known/tool/sysadmin/sandboxie/
  - id: well-known/tool/reverse-engineering/resource-hacker/
  - id: well-known/lib/media/videolan/
      # Cross-device input-forwarding tools (screen mirror, phone link)
      # legitimately combine keyboard hooks with active-window tracking.
  - id: metadata/signed/leaf::huawei-device-co.-ltd.
  - id: well-known/app/utility/siw::siw-family-identity
- id: keylogger-protected-by-defender-exclusion
  desc: Keylogger protected by Defender exclusion
  crit: hostile
  conf: 0.97
  all:
  - id: windows-hook-keypoll-foreground
  - id: micro-behaviors/os/security/defender::defender-exclusion-command
  any:
