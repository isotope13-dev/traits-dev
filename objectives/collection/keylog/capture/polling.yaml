# Polling-based input monitoring (without SetWindowsHookEx)
# Some malware and game cheats use polling APIs (GetKeyState, GetAsyncKeyState)
# combined with clipboard access and mouse monitoring for input capture.
# Unlike hook-based keyloggers, these don't install keyboard hooks.
# ATT&CK: T1056.001 (Input Capture: Keylogging)
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: "T1056.001"
  mbc: "B0015"
composite_rules:
  - id: polling-input-monitor
    desc: Polling-based input monitoring (keyboard + clipboard)
    crit: suspicious
    conf: 0.88
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
      - id: micro-behaviors/os/clipboard/access::get-clipboard-data
    any:
      - id: micro-behaviors/hardware/input/mouse/synthesis::mouse-event
      - id: micro-behaviors/hardware/input/mouse/position::get-cursor-pos
      - id: micro-behaviors/os/clipboard/access::set-clipboard-data
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: metadata/binary/vendor/
      - id: well-known/app/browser/internet-explorer/
      - id: well-known/lib/runtime/electron/
      # SDL's whole purpose is input and clipboard: `SDL_GetKeyboardState`,
      # `SDL_GetMouseState` and `SDL_GetClipboardText` are public API, so every
      # game and emulator that links it carries this cluster -- mednafen ships
      # the stock SDL2.dll.
      - id: well-known/lib/media/sdl/
    downgrade:
      any:
        - id: micro-behaviors/ui/framework/imgui/
  - id: recognized-polling-input-tool-marker
    desc: Recognized input polling tool marker
    crit: notable
    conf: 0.9
    any:
      - id: well-known/lib/media/sdl::sdl-runtime-component
      - id: well-known/tool/sysadmin/sandboxie::sandboxie-component
      - id: well-known/tool/sysadmin/disk-utility::winhex-xways
      - id: metadata/lang/compiled::autoit-binary
      - id: well-known/tool/sysadmin/systeminformer
      - id: well-known/tool/sysadmin/winrar::winrar-component
