# Polling-based input monitoring (without SetWindowsHookEx)
# Some malware and game cheats use polling APIs (GetKeyState, GetAsyncKeyState)
# combined with clipboard access and mouse monitoring for input capture.
# Unlike hook-based keyloggers, these don't install keyboard hooks.
# ATT&CK: T1056.001 (Input Capture: Keylogging)
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: "T1056.001"
  mbc: "B0015"
composite_rules:
  - id: polling-input-monitor
    desc: Polling-based input monitoring (keyboard + clipboard)
    crit: suspicious
    conf: 0.88
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
      - id: micro-behaviors/os/clipboard/access::get-clipboard-data
    any:
      - id: micro-behaviors/hardware/input/mouse/synthesis::mouse-event
      - id: micro-behaviors/hardware/input/mouse/position::get-cursor-pos
      - id: micro-behaviors/os/clipboard/access::set-clipboard-data
    needs: 1
    unless:
      # A compiled AutoIt script carries the whole AutoIt runtime, and that runtime
      # is a Windows automation library: clipboard read/write, keyboard and mouse
      # state polling, window enumeration, host and locale queries, and temp-file
      # extraction of its own embedded script. Every compiled .au3 therefore shows
      # the full API surface regardless of what the script does -- Closure
      # Library's CI helper is 30 lines that close a dialog box.
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: well-known/app/browser/internet-explorer/
      - id: well-known/lib/runtime/electron/
      - id: well-known/lib/media/sdl/
      # Umbrella for the compiled toolchain/runtime binaries whose public API
      # is itself keyboard + clipboard polling: Tcl/Tk widgets, GNU Readline
      # line editing, and GDB's console input layer. One reference instead of
      # one `unless:` line per runtime.
      - id: mingw-toolchain-input-polling-context
    downgrade:
      any:
        - id: micro-behaviors/ui/framework/imgui/
  - id: recognized-polling-input-tool-marker
    desc: Recognized input polling tool marker
    crit: notable
    conf: 0.9
    any:
      - id: well-known/lib/media/sdl::sdl-runtime-component
      - id: well-known/tool/sysadmin/sandboxie::sandboxie-component
      - id: well-known/tool/sysadmin/disk-utility::winhex-xways
      - id: metadata/lang/compiled::autoit-binary
      - id: well-known/tool/sysadmin/systeminformer
      - id: well-known/tool/sysadmin/winrar::winrar-component
  # Tk's whole widget/text-entry surface is built on GetKeyState /
  # GetAsyncKeyState / GetClipboardData / SetClipboardData / GetCursorPos --
  # tk86.dll ships this cluster in every Tcl/Tk GUI regardless of what the
  # script does, the same way SDL does for games. GNU Readline polls the same
  # keyboard APIs for line-editing key bindings and reads/writes the
  # clipboard for kill-ring yank/paste, and GDB's console/TUI input layer
  # polls both for command-line editing and copy-paste independent of its
  # debugger role (see the anti-analysis debugger-attach-loop exception).
  # Kept as its own small umbrella rather than folded into
  # recognized-polling-input-tool-marker above, whose other members already
  # carry a deep suppression-budget cost of their own.
  - id: mingw-toolchain-input-polling-context
    desc: MinGW-toolchain runtime with polling input surface
    crit: exception
    conf: 0.9
    any:
      - id: well-known/lib/runtime/tcl-tk::tcl-tk-runtime-component
      - id: well-known/lib/format/gnu-readline::gnu-readline-library
      - id: well-known/tool/reverse-engineering/windows-debugger::gnu-gdb-debugger-binary
