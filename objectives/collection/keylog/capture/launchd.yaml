defaults:
  platforms: [macos]
  for: [plist]
  attack: T1056.001
  mbc: E1056.001

composite_rules:
  - id: launchd-keylogger-job
    desc: Launchd job identifies and starts a keylogger
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/service/configure::launchd-label-keylogger
      - id: micro-behaviors/os/service/configure::launchd-program-keylogger
      - id: micro-behaviors/os/service/configure::launchd-run-at-load
