defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  attack: T1056.001
  mbc: E1056
  crit: hostile
composite_rules:
- id: extension-dom-input-keylogger
  desc: Extension re-arming DOM input keylogger
  conf: 0.96
  all:
  - id: micro-behaviors/ui/window/event::browser-mutation-observer
  - id: micro-behaviors/ui/window/form-input::input-textarea-field-selector
  any:
  - id: micro-behaviors/hardware/input/keyboard/label::keylogger-action-label
  - id: micro-behaviors/ui/window/form-input::ext-form-field-prefix
  needs: 1
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: dom-keystroke-recorder
  desc: Document key handler records typed characters
  conf: 0.95
  all:
  - id: micro-behaviors/hardware/input/keyboard/listener::document-key-handler-assignment
  - id: micro-behaviors/data/string/conversion::keyboard-event-code-to-character
  - id: micro-behaviors/hardware/input/event::key-value-recorded-to-event
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: capture-phase-dom-keystroke-recorder
  for:
  - javascript
  desc: Capture-phase DOM handler queues typed keys
  conf: 0.98
  near_bytes: 800
  all:
  - id: micro-behaviors/hardware/input/event::browser-keyboard-event-listener
  - id: micro-behaviors/hardware/input/event::capture-phase-event-listener
  - id: micro-behaviors/ui/window/form-input::browser-value-event-member-read
  - id: micro-behaviors/hardware/input/event::browser-key-event-object-queued
