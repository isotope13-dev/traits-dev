# A DOM keystroke recorder: the page installs a document-level key handler,
# turns the key code back into a character, and queues the result for sending.
#
# This is what a page-embedded keylogger looks like when it is not a form
# grabber -- it records typing anywhere, including outside form fields. The
# Great Suspender's post-sale build (2020) loaded exactly this from a remote
# analytics bundle: `document.onkeypress = function(e){...}` reading
# `e.keyCode ? e.keyCode : e.charCode`, converting with `String.fromCharCode`,
# and pushing `key_value` plus the target element's `value` into an upload
# queue.
#
# A page legitimately handles keys for shortcuts and input masks, so neither
# the handler nor the conversion is enough alone. Recording the character into
# a queue or event object is the step no shortcut handler takes.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1056.001
  mbc: E1056

traits:
  - id: document-key-handler-assignment
    desc: Assigns a document-level key handler
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b(document|window|body)\s*\.\s*on(keypress|keydown|keyup)\s*='

  - id: key-value-recorded-to-event
    desc: Stores explicitly named key-data field
    crit: notable
    conf: 0.9
    # Require an explicit key-data field name. A bare `set(key, value)` is the
    # universal key/value-store API shape and says nothing about keystrokes.
    if:
      type: text
      regex: '(set|push|append)\s*\(\s*["'']key[_-]?\w{0,5}["'']\s*[,)]'

  - id: browser-key-event-object-queued
    desc: Queues browser keyboard-event key data
    # Keyboard-shortcut and validation tools also queue key objects. This is
    # only a keylogger when the composite below ties it to capture-phase input
    # and typed-value collection.
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\.(push|append)\s*\(\s*\{[^}]{0,220}\b(key|code)\s*:\s*[A-Za-z_$][\w$]*\.(key|code)\b'

  # --- Extension content-script keylogger that re-arms on injected fields ---
  #
  # A page-injecting content script (KREMLIN "AVSync"/"FrameSync") attaches an
  # input handler to every <input>/<textarea>, then uses a MutationObserver to
  # re-attach the same handler to fields added later — so a login form rendered
  # after page load is still logged. Captured values are posted to the service
  # worker under a "KeyLogger" action, tagged with ext-prefixed field names.
  # These four literals survive the extension's obfuscation because they are
  # string constants, not call structure.

  - id: input-textarea-field-selector
    desc: Selector targeting input and textarea
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: 'input,\s*textarea'

  - id: keylogger-action-label
    desc: KeyLogger action message label
    crit: suspicious
    conf: 0.95
    if:
      type: literal
      kind: string
      exact: KeyLogger

  # Captured fields are relabeled extinput_/exttextarea_/extselect_ before being
  # reported. Any label of this exact shape is the capture-tagging scheme, not
  # an incidental identifier; it corroborates the observer + selector below.
  - id: ext-captured-field-prefix
    desc: Ext-prefixed captured field name
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '^ext(input|textarea|select)_$'

composite_rules:
  # A DOM-mutation-driven input logger inside an extension content script: it
  # watches for new input/textarea fields and reports typed values under the
  # KeyLogger action. The observer plus the field selector establish the
  # re-arming capture; the action label or the ext-prefixed field names confirm
  # the exfil channel.
  - id: extension-dom-input-keylogger
    desc: Extension re-arming DOM input keylogger
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/ui/window/event::browser-mutation-observer
      - id: input-textarea-field-selector
    any:
      - id: keylogger-action-label
      - id: ext-captured-field-prefix
    needs: 1
    unless:
      - id: metadata/package/testing/

  - id: dom-keystroke-recorder
    desc: Document key handler records typed characters
    crit: hostile
    conf: 0.95
    all:
      - id: document-key-handler-assignment
      - id: micro-behaviors/data/string/conversion::keyboard-event-code-to-character
      - id: key-value-recorded-to-event
    unless:
      - id: metadata/package/testing/

  - id: capture-phase-dom-keystroke-recorder
    for: [javascript]
    desc: Capture-phase DOM handler queues typed keys
    crit: hostile
    conf: 0.98
    near_lines: 8
    all:
      - id: micro-behaviors/hardware/input/event::browser-keyboard-event-listener
      - id: micro-behaviors/hardware/input/event::capture-phase-event-listener
      - id: micro-behaviors/ui/window/form-input::browser-value-event-member-read
      - id: browser-key-event-object-queued
