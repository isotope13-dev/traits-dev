# Keyboard capture API clusters preserved inside opaque ISO-9660 containers.
#
# The API-name legs live in their behavioral directories (keyboard hook/poll,
# file open) rather than under a file-format metadata path -- a bare
# "SetWindowsHookExA" run is a hook capability wherever it is found, and
# filing it under ISO metadata reported it as an ISO fact on ordinary PEs.
# The ISO context has always come from the primary-volume-descriptor leg.
defaults:
  platforms: [windows]
  for: [iso]
  attack: T1056.001

composite_rules:
  - id: iso-windows-hook-file-logger
    desc: ISO embeds keyboard hook file logger
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: micro-behaviors/hardware/input/keyboard/hook::set-windows-hook-a-container-string
      - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state-container-string
      - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state-container-string
      - id: micro-behaviors/fs/file/open::createfile-a-container-string
