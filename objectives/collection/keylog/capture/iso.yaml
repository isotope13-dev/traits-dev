# Keyboard capture API clusters preserved inside opaque ISO-9660 containers.
defaults:
  platforms: [windows]
  for: [all]
  attack: T1056.001

composite_rules:
  - id: iso-windows-hook-file-logger
    desc: ISO embeds keyboard hook file logger
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-setwindowshookexa
      - id: metadata/file/format/iso::iso-getkeyboardstate
      - id: metadata/file/format/iso::iso-getkeystate
      - id: metadata/file/format/iso::iso-createfilea
