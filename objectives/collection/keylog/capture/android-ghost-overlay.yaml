# GhostBat/GhostX "Ghost Overlay": instead of a fake login page, an
# AccessibilityService lays a transparent TYPE_ACCESSIBILITY_OVERLAY over the
# real PIN-entry screen (Google Pay, MobiKwik, UPI apps), captures each tap's
# coordinates, maps them to digits, and replays the identical touch into the
# legitimate app with dispatchGesture() so the transaction completes and the
# victim sees no fake UI. The capture-and-passthrough combination is what
# distinguishes it from a benign accessibility overlay (dimmers/readers never
# both intercept outside touches and re-inject them as gestures). Matched on
# API/structure, not family strings, so it carries across overlay generations.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: "T1453,T1056.002,T1417.001"

composite_rules:
  - id: ghost-overlay-tap-interception
    desc: Accessibility overlay intercepts and replays PIN taps
    crit: hostile
    conf: 0.98
    mbc: "E1056"
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: micro-behaviors/ui/window/overlay::android-accessibility-overlay-window-type
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-gesture-dispatch
    any:
      - id: micro-behaviors/hardware/input/event::android-view-touch-coordinate-capture
      - id: micro-behaviors/ui/window/overlay::android-source-touch-listener
