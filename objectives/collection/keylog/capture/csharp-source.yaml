defaults:
  for: [csharp]
  platforms: [windows]
  attack: T1056.001
  mbc: E1056.001

composite_rules:
  - id: csharp-low-level-keylogger-source
    desc: C# low-level keyboard capture source
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-hook-lifecycle
      - id: micro-behaviors/hardware/input/keyboard/hook::to-unicode-ex-str
      - id: micro-behaviors/hardware/input/keyboard/hook::get-keyboard-layout-str
    any:
      - id: micro-behaviors/hardware/input/keyboard/hook::map-virtual-key
      - id: micro-behaviors/hardware/input/keyboard/layout::map-virtual-key-str

  - id: csharp-low-level-keylogger-file-output
    desc: C# low-level keyboard hook records keystrokes to a file
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-low-level-keyboard-hook-numeric-code
      - id: micro-behaviors/fs/file/write/stream::streamwriter-file-write
      - id: micro-behaviors/ui/window/manage/control::get-foreground-window-source
      - id: micro-behaviors/ui/window/manage/enumerate::get-window-thread-process-id-source
