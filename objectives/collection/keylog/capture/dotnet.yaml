# .NET Polling Keylogger Composites
# Detects VB.NET/C# RATs using GetAsyncKeyState + ToUnicodeEx + window tracking
# ATT&CK: T1056.001 (Input Capture: Keylogging)
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1056.001
  mbc: E1056.001
traits:
  - id: dotnet-keylog-upload-record
    desc: Keylog record label for network transport
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bKEYLOG(_BULK)?:'
  - id: dotnet-continuous-data-exfiltration-routine
    desc: Continuous data-exfiltration routine name
    crit: suspicious
    conf: 0.96
    if:
      type: text
      word: ContinuousDataExfiltration
composite_rules:
  - id: dotnet-continuous-keylog-http-exfiltration
    desc: .NET keylogger continuously exfiltrates over HTTP
    crit: hostile
    conf: 0.99
    attack: T1056.001,T1041
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-hook-chain-api-cluster
      - id: micro-behaviors/hardware/input/keyboard/label::keylogger-string
      - id: micro-behaviors/fs/write/file/direct::dotnet-appendalltext-token
      - id: dotnet-continuous-data-exfiltration-routine
      - id: micro-behaviors/communications/http/client/managed::postasync
    unless:
      - id: metadata/signed/platform/

  - id: dotnet-hook-keylogger-http-upload
    desc: .NET low-level hook keylogger with HTTP upload
    crit: hostile
    conf: 0.98
    attack: T1056.001,T1041
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-hook-chain-api-cluster
      - id: micro-behaviors/hardware/input/keyboard/label::keylogger-string
      - id: dotnet-keylog-upload-record
    any:
      - id: micro-behaviors/communications/http/client/managed::uploadstring
      - id: micro-behaviors/communications/http/client/managed::postasync
    unless:
      - id: metadata/signed/platform/
  # Hook chain + the full ToUnicodeEx/MapVirtualKey/GetKeyboardState decode
  # cluster is a keystroke capture-and-render pipeline, not a hotkey check: the
  # binary installs a hook AND translates raw virtual keys into text. Paired
  # with an explicit keylogger label and an outbound delivery channel, that is
  # the Snake Keylogger / Agent Tesla class of managed keylogger. Delivery is an
  # `any:` because these builders let the operator pick SMTP, FTP or a Telegram
  # bot per build, and the sibling rules below only recognise HTTP/TCP paths
  # that also stage keystrokes to a file or a `KEYLOG:` record.
  - id: dotnet-hook-keylogger-mail-bot-exfil
    desc: .NET hook keylogger exfiltrates over mail, FTP, or bot API
    crit: hostile
    conf: 0.96
    attack: T1056.001,T1041
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-hook-chain-api-cluster
      - id: micro-behaviors/hardware/input/keyboard/poll::polling-keylogger-api-cluster
      - id: micro-behaviors/hardware/input/keyboard/label::keylogger-string
    any:
      - id: micro-behaviors/communications/email/send/smtp::dotnet-smtpclient-type
      - id: micro-behaviors/communications/ftp/client::dotnet-ftpwebrequest
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-operation
    unless:
      - id: metadata/signed/platform/
      # An anti-keylogger or endpoint product names the technique it defends
      # against and can carry the same input APIs for its own hook inspection.
      - id: well-known/tool/detection/
      - id: well-known/app/security/
  - id: dotnet-hook-keylogger-network-exfil
    desc: .NET hook keylogger stages and transmits captured keys
    crit: hostile
    conf: 0.98
    attack: T1056.001,T1041
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-hook-chain-api-cluster
      - id: micro-behaviors/hardware/input/keyboard/label::keylogger-string
      - id: micro-behaviors/fs/write/file/direct::dotnet-appendalltext-token
      - id: dotnet-keylog-upload-record
    any:
      - id: micro-behaviors/communications/socket/create::dotnet-tcpclient-channel
      - id: micro-behaviors/communications/http/client/managed::httpwebrequest
    unless:
      - id: metadata/signed/platform/
      - id: well-known/dual-use/remote-admin/
  - id: dotnet-polling-keylogger
    desc: .NET polling keylogger with window context
    # Local polling and window tracking establish covert input collection,
    # but remote-control tools can implement the same mechanism. Network
    # transport raises the child composite below to hostile.
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/hardware/input/keyboard/poll::polling-keylogger-api-cluster
      - id: micro-behaviors/ui/window/manage/enumerate::get-window-thread-process-id
    any:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: well-known/tool/sysadmin/sandboxie/
        - id: well-known/lib/runtime/slint/
    unless:
      - id: metadata/binary/framework::large-rsrc-section
      - id: well-known/lib/media/sdl/
      - id: metadata/lang/compiled/
  - id: dotnet-keylogger-with-exfil
    desc: .NET keylogger with network exfiltration capability
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/collection/keylog/capture::dotnet-polling-keylogger
    any:
      - id: micro-behaviors/communications/socket/create::dotnet-tcpclient-channel
      - id: micro-behaviors/communications/http/client/managed::webclient
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: well-known/tool/sysadmin/sandboxie/
        - id: well-known/lib/runtime/slint/
        - id: well-known/lib/media/sdl/
