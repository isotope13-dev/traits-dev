defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip]
  attack: T1056.001

traits:
  - id: keyboard-history-recorder-label
    desc: Declares keyboard history recording purpose
    crit: notable
    conf: 0.98
    for: [chrome-manifest]
    if:
      type: value
      path: name
      regex: '(?i)keyboard.{0,20}(history|record)'

  - id: input-textarea-node-watch-list
    desc: Watches input and textarea node values
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '\[\s*["'']INPUT["'']\s*,\s*["'']TEXTAREA["'']\s*\]'

composite_rules:
  - id: broad-extension-form-history-recorder
    desc: Broad extension records form history locally
    crit: suspicious
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/process/inject/webextension::broad-content-script-injection
      - id: micro-behaviors/hardware/input/event::browser-keyboard-event-listener
      - id: micro-behaviors/data/db/web-storage::chrome-storage-local-set
      - id: input-textarea-node-watch-list

  - id: declared-all-sites-keyboard-recorder
    desc: Declared keyboard recorder runs on all sites
    crit: suspicious
    conf: 0.99
    scope: archive
    all:
      - id: keyboard-history-recorder-label
      - id: metadata/permission/host::content-script-all-urls
      - id: metadata/permission/storage::permission-unlimited-storage

  # A content script that hooks focus-loss and Enter on every page, reads the
  # field the user just left, and appends it to extension local storage tagged
  # with the page origin is a form-value keylogger: the capture is passive,
  # covers any site the script is injected into, and the record is a per-site
  # log of what was typed rather than data the page asked for. Legitimate
  # form helpers (password managers, autofill) write back into controls and
  # store per-origin entries the user chose to save; none of them need a
  # document-wide focusout+keypress tap over an INPUT/TEXTAREA watch list.
  # Every leg is content-derived and free of handler, field or file names, so
  # renaming the script or its record keys does not evade it.
  - id: page-form-value-site-log
    desc: Logs page form input values per site to extension storage
    crit: hostile
    conf: 0.97
    scope: file
    for: [javascript, typescript]
    all:
      - id: input-textarea-node-watch-list
      - id: micro-behaviors/hardware/input/event::browser-focus-transition-listener
      - id: micro-behaviors/hardware/input/event::browser-keyboard-event-listener
      - id: micro-behaviors/communications/http/url/navigation::browser-location-origin-read
      - id: micro-behaviors/data/db/web-storage::chrome-storage-local-set
