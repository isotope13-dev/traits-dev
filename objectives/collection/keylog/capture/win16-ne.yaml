# Win16 keystroke log writer: bracketed special-key labels, a file opened via
# INT 21h, and a log directory in the Windows TEMP folder.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1056.001
  mbc: B0015

traits:
  - id: win16-keylog-temp-directory
    desc: Keystroke log stored in Windows TEMP directory
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      substr: 'C:\WINDOWS\TEMP\'

composite_rules:
  - id: win16-ne-keystroke-log-file
    desc: Win16 keystroke labels written to TEMP log file
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/hardware/input/keyboard/label::win16-ne-bracketed-key-label
      - id: micro-behaviors/fs/file/open/call::win16-ne-int21-open
      - id: win16-keylog-temp-directory
