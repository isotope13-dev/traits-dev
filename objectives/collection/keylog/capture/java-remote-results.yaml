defaults:
  for: [java]
  platforms: [windows, unix]
  attack: T1056.001,T1113

traits:
  - id: java-keylog-result-dispatch
    desc: Java dispatches keylog result messages
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: 'startsWith("KEYLOGS")'

  - id: java-screenshot-result-dispatch
    desc: Java dispatches screenshot result messages
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: 'startsWith("SCREENSHOT")'

composite_rules:
  - id: java-remote-keylog-screenshot-receiver
    desc: Remote client handler stores keylogs and screenshots
    crit: hostile
    conf: 0.97
    all:
      - id: java-keylog-result-dispatch
      - id: java-screenshot-result-dispatch
      - id: metadata/import/java/java/net/socket::java/net/socket
      - id: micro-behaviors/data/stream/read::java-input-stream-access
      - id: micro-behaviors/fs/write/file/stream::java-fileoutputstream-source
