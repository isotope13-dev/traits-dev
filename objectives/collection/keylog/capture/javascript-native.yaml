# JavaScript wrappers around native global keyboard listeners.
defaults:
  platforms: [windows, macos, linux]
  for: [javascript, typescript]
  attack: T1056.001
  mbc: B0015

traits:
  - id: global-keyboard-listener-description
    desc: Global keyboard listener or key logger marker
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)global\s+(keyboard|key)\s+listener|key-?loggers?'
  - id: keyboard-text-event-payload
    desc: Captured text keyboard event payload
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'source:\s*["'']keyboard["''],\s*text[,}]'
  - id: keyboard-buffer-character-append
    desc: Appends characters to keyboard buffer
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '\bkbdBuf\s*\+=\s*ch\b'
  - id: sync-client-event-send
    desc: Sends queued events through a sync client
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '\bclient\.createEvents?(Batch)?\s*\('

composite_rules:
  - id: javascript-native-global-key-capture
    desc: JavaScript launches a native global key capture helper
    crit: hostile
    conf: 0.98
    all:
      - id: global-keyboard-listener-description
      - id: micro-behaviors/process/io/stream::process-stdout-data-listener
      - id: micro-behaviors/process/create/system::js-execfile-call
  - id: node-global-keyboard-event-exfil
    desc: Node global key hook sends captured text through a sync client
    crit: hostile
    conf: 0.99
    attack: T1056.001,T1041
    scope: file
    all:
      - id: micro-behaviors/hardware/input/keyboard/listener::uiohook-global-input-listener
      - id: keyboard-text-event-payload
      - id: keyboard-buffer-character-append
      - id: sync-client-event-send
