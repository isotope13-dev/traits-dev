defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  attack: T1056.001
  mbc: E1056.001
traits:
  - id: keylog-filename-pattern
    desc: Timestamped keylog filename pattern
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: 'KL\d{12}\.dat'
  - id: clipboard-capture-pattern
    desc: Timestamped clipboard capture filename
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: CA\d{12}\.dat
composite_rules:
  - id: keylogger-with-clipboard
    platforms: [macos, unix, windows]
    for: [binaries, macho, scripts]
    desc: Keylogger with clipboard capture capability
    crit: suspicious
    conf: 0.95
    needs: 2
    any:
    - id: keylog-filename-pattern
    - id: clipboard-capture-pattern
    - id: micro-behaviors/hardware/input/event::mouse-state-tracking
