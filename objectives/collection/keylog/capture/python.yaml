defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  mbc: B0015
  attack: T1056.001
  crit: suspicious
composite_rules:
  - id: python-custom-keyboard-capture
    desc: Python captures a low-level keyboard event stream
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/input/keyboard/listener::python-key-event-type
      - id: micro-behaviors/hardware/input/keyboard/listener::python-keyboard-dispatcher
    any:
      - id: micro-behaviors/ui/window/hook::python-window-hook-install
      - id: micro-behaviors/hardware/input/keyboard/poll::python-async-key-state-poll
  - id: python-keylogger-file
    desc: Keylogger writing to file
    conf: 0.95
    crit: hostile
    mbc: B0015 - python
    all:
      - id: micro-behaviors/hardware/input/event::python-input-library-import
      - id: python-keylog-routine-file-write
    any:
      # Require an actual hook/listener operation.  Generic pynput imports,
      # on_press words in documentation, and unrelated file writes are common
      # in automation and UI libraries.
      - id: micro-behaviors/hardware/input/keyboard/listener::python-keyboard
      - id: micro-behaviors/hardware/input/keyboard/hook::python-hook-keyboard
      - id: micro-behaviors/hardware/input/keyboard/listener::python-keydown-handler
      - id: micro-behaviors/hardware/input/event::pynput-key-value-record
    # Bind the file write to the input-capture region. Without proximity, an
    # unrelated config or LaunchAgent write mislabeled an in-memory logger.
    near_lines: 80
    unless:
      # A macro recorder captures clicks beside the keys and ships a playback
      # function; a keylogger does neither.
      - id: micro-behaviors/hardware/input/macro::record-replay-macro
  # A ctypes polling loop needs no hook install, no message pump and no window
  # focus, so the pynput/keyboard-library legs above miss it. Polling
  # GetAsyncKeyState from a background thread is the console-less keylogger
  # shape: legitimate hotkey checks run on the caller's thread or through an
  # input library, not a daemon polling loop over the virtual-key range.
  - id: python-polling-keylogger
    desc: Python background thread polls async key state
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::python-async-key-state-poll
      - id: micro-behaviors/hardware/input/keyboard/poll::python-virtual-key-range
      - id: micro-behaviors/process/thread/create::python-daemon-thread
    near_lines: 80
