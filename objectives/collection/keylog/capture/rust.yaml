defaults:
  platforms: [windows]
  for: [pe]
  attack: T1056.001
  mbc: B0015

composite_rules:
  - id: rust-rat-key-label-collector
    desc: Rust RAT key label collector
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/input/keyboard/label::rust-special-key-label-run
      - id: well-known/lib/network/rust-socketio::rust-socketio-client-library
      - id: micro-behaviors/process/create/command-handler::execute-command-label
      - id: objectives/command-and-control/backdoor/dispatch/module::rat-auth-heartbeat-labels
