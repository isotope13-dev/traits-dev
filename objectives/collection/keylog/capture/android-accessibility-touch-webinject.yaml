defaults:
  platforms: [android]
  for: [apk, zip]

composite_rules:
  # Accessibility plus a WebView form sniffer bridge is the banker
  # "webinject" shape: inject JS that posts field values to
  # Android.snifferData while the accessibility service controls the UI.
  - id: android-accessibility-webview-form-sniffer
    desc: Android accessibility WebView form sniffer
    for: [apk, zip, dex, xml]
    crit: hostile
    conf: 0.98
    attack: T1417.001,T1417.002
    mbc: F0006
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-config
      - id: micro-behaviors/process/interpreter/webview::webview-form-sniffer-bridge
      - id: micro-behaviors/process/interpreter/webview::add-javascript-interface
    any:
      - id: micro-behaviors/process/interpreter/webview::webview-sniffer-guard
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-settings-intent
