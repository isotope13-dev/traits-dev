defaults:
  platforms: [android]
  for: [apk, zip]

composite_rules:
  # Accessibility plus a WebView form sniffer bridge is the banker
  # "webinject" shape: inject JS that posts field values to
  # Android.snifferData while the accessibility service controls the UI.
  - id: android-accessibility-webview-form-sniffer
    desc: Android accessibility WebView form sniffer
    for: [apk, zip, dex, xml]
    crit: hostile
    conf: 0.98
    attack: T1417.001,T1417.002
    mbc: F0006
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-surface-references
      - id: metadata/file/profile/mobile-collection::android-sniffer-data-reference
      - id: micro-behaviors/communications/ipc/bridge::add-javascript-interface
    any:
      - id: metadata/file/profile/mobile-collection::window-sniffer-property-reference
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-settings-intent
