defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, c, cpp]
  mbc: B0015
  attack: T1056.001
  crit: suspicious
composite_rules:
- id: keystroke-title-recognized-marker
  desc: Keystroke title recognized marker
  crit: notable
  conf: 1.0
  any:
  - id: well-known/lib/ui/jline::jline-jar-basename
  - id: well-known/lib/ui/jline::console-reader-context
  - id: well-known/lib/runtime/scripted/jruby::runtime-context
  - id: metadata/file/extension/identity::declaration-file-extension
  - id: metadata/file/format/structured::sourcemap
  - id: well-known/app/ai/coding-agent/tabby::tabby-basename
  - id: metadata/file/naming::hotkey-ts-basename
- id: bundled-native-global-keylogger
  desc: Package launches a native global keyboard-hook server
  crit: hostile
  conf: 0.98
  for: [npm, tar, zip, nupkg, pe, javascript, source]
  scope: archive
  all:
  - id: micro-behaviors/process/create/server::configured-server-executable-spawn
  - id: micro-behaviors/ui/window/hook::windows-hook-install
  - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
- id: linux-keylogger
  desc: Linux keylogger using multiple input paths
  conf: 0.85
  platforms: [linux]
  for: [elf]
  all:
  - id: micro-behaviors/hardware/input/keyboard/label::linux-input-device
  - id: micro-behaviors/hardware/input/keyboard/hook::x11-grab
  any:
  - id: micro-behaviors/hardware/display/screenshot::x11-display-screen-capture
  - id: micro-behaviors/hardware/input/keyboard/layout::x11-display-keymap-access
  unless:
  - id: well-known/dual-use/remote-admin/x11vnc::x11vnc-binary
  - id: micro-behaviors/hardware/input/gamepad::gamepad-input-keyword
  - id: well-known/lib/platform/wine::wine-debug-channel
  - id: well-known/tool/sysadmin/busybox::busybox-binary

# Relocated from objectives/evasion/kernel-hide/rootkit, where it was called
# `keylogging-ops`. Nothing in the matcher looks at kernel hiding: it is an
# `any:` over two keylogger LABEL atoms, so it fired on any program carrying a
# `KeyLogger` class name -- including a userland Cocoa backdoor with no kernel
# component at all, which then read back to an analyst as a rootkit finding and
# keyed the rootkit ML feature. A label by itself is only notable: generated
# threat-category enums and documentation also contain the word `keylogger`.
# Higher-level composites can still use the label beside concrete behavior.
# TAXONOMY puts the identity fact in collection/keylog/; the rootkit composite
# supplies the kernel-hiding legs itself.
