# Split by evidence regime. In a COMPILED PE the hook type is an integer
# argument, so the constant is unavailable and a bare SetWindowsHookEx plus the
# capture-API cluster is the best available evidence -- unchanged below. In
# SOURCE the hook type is right there in the text, and treating any
# SetWindowsHookEx as keyboard interception convicted every GUI toolkit:
# WH_CALLWNDPROC / WH_GETMESSAGE / WH_CBT / WH_MOUSE_LL are ordinary window
# plumbing, and GetKeyboardState + MapVirtualKey + GetAsyncKeyState is the
# mandatory WM_KEYDOWN-to-character path in JUCE, Qt, wxWidgets, SDL and every
# Chromium/Electron windowing back-end. See windows-keylogger-source below.
- id: windows-keylogger
  desc: Windows keyboard capture API cluster
  crit: suspicious
  conf: 0.85
  platforms: [windows]
  for: [pe]
  all:
  - id: micro-behaviors/hardware/input/keyboard/hook::set-windows-hook
  any:
  - id: micro-behaviors/hardware/input/raw::windows-raw-input
  - id: micro-behaviors/hardware/input/keyboard/poll::polling-keylogger-api-cluster
  - id: micro-behaviors/hardware/input/keyboard/hook::virtual-key-label-map
  unless:
  - id: p-user-proxy-dll
  - id: well-known/lib/
  - id: metadata/signed/
  - id: metadata/binary/vendor/
  - id: metadata/package/versioning::pe-version-resource
  - id: well-known/app/browser/internet-explorer/
- id: windows-keylogger-source
  desc: Windows keyboard hook with capture APIs
  crit: suspicious
  conf: 0.9
  platforms: [windows]
  for: [c, cpp]
  all:
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  any:
  - id: micro-behaviors/hardware/input/raw::windows-raw-input
  - id: micro-behaviors/hardware/input/keyboard/poll::polling-keylogger-api-cluster
  - id: micro-behaviors/hardware/input/keyboard/hook::virtual-key-label-map
  unless:
  - id: well-known/lib/
- id: bundled-native-global-keylogger
  desc: Package launches a native global keyboard-hook server
  crit: hostile
  conf: 0.98
  for: [archives]
  scope: archive
  all:
  - id: micro-behaviors/process/create/server::configured-server-executable-spawn
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-hook-install
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-hook-lifecycle
- id: linux-keylogger
  desc: Linux keylogger using multiple input paths
  conf: 0.85
  platforms: [linux]
  for: [elf, c, cpp]
  all:
  - id: micro-behaviors/hardware/input/keyboard/label::linux-input-device
  - id: x11-grab
  any:
  - id: micro-behaviors/hardware/display/screen::x11-display-screen-capture
  - id: micro-behaviors/hardware/input/keyboard/layout::x11-display-keymap-access
  unless:
  - id: well-known/dual-use/remote-admin/x11vnc::x11vnc-binary
  - id: micro-behaviors/hardware/input/gamepad::gamepad-input-keyword
  - id: well-known/lib/platform/wine::wine-debug-channel
  - id: well-known/tool/sysadmin/busybox::busybox-binary

# Relocated from objectives/evasion/kernel-hide/rootkit, where it was called
# `keylogging-ops`. Nothing in the matcher looks at kernel hiding: it is an
# `any:` over two keylogger LABEL atoms, so it fired on any program carrying a
# `KeyLogger` class name -- including a userland Cocoa backdoor with no kernel
# component at all, which then read back to an analyst as a rootkit finding and
# keyed the rootkit ML feature. TAXONOMY puts a detected keylogging capability
# in collection/keylog/; the rootkit composite still references it from here and
# supplies the kernel-hiding legs itself.
- id: keylogger-identity-label
  desc: Program labels itself a keylogger
  crit: suspicious
  conf: 0.8
  any:
  - id: micro-behaviors/hardware/input/keyboard/label::keylogger-string
  - id: micro-behaviors/hardware/input/keyboard/label::init-keylogger-sym
