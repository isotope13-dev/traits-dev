defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, c, cpp]
  mbc: B0015
  attack: T1056.001
  crit: suspicious
traits:
- id: p-user-proxy-dll
  desc: p_user USER32 proxy DLL marker
  crit: component
  conf: 0.9
  platforms: [windows]
  for: [pe]
  if:
    type: path
    basename: true
    exact: p_user.dll

- id: hotkey-ts-basename
  desc: Hotkey TypeScript basename
  crit: notable
  conf: 1.0
  if:
    type: path
    basename: true
    regex: ^(hotkeyInputModal\.component|hotkeys\.(service|util))\.ts$
- id: x11-grab
  desc: X11 global key grab
  crit: notable
  conf: 0.65
  platforms:
  - linux
  - macos
  for: [elf, macho, c, cpp]
  if:
    type: symbol
    exact: XGrabKey
  unless:
  - type: basename
    regex: ^lib.*\.(so|dylib)(\.\d+)*$
  - type: text
    substr: xorg
  - id: well-known/lib/platform/at-spi2-core::source-context
- id: go-gohook
  desc: Go robotn/gohook keyboard capture library
  conf: 0.75
  if:
    type: text
    substr: github.com/robotn/gohook
- id: pynput-import-keyboard
  desc: from pynput import keyboard
  conf: 0.5
  if:
    type: text
    substr: from pynput import keyboard
- id: pynput-keyboard-import
  desc: from pynput.keyboard import
  conf: 0.5
  if:
    type: text
    substr: from pynput.keyboard
- id: require-iohook
  desc: require("iohook")
  conf: 0.6
  if:
    type: text
    regex: require\(['"]iohook['"]\)
- id: import-iohook
  desc: from "iohook" import
  conf: 0.6
  if:
    type: text
    regex: from ['"]iohook['"]
- id: use-rdev
  desc: 'use rdev:: import statement'
  conf: 0.5
  if:
    type: text
    substr: 'use rdev::'
- id: extern-crate-rdev
  desc: extern crate rdev
  conf: 0.5
  if:
    type: text
    substr: extern crate rdev
- id: osascript-title
  desc: Osascript command (title case)
  crit: notable
  conf: 0.6
  if:
    type: text
    word: Osascript
- id: osascript-upper
  desc: OSASCRIPT command (uppercase)
  crit: notable
  conf: 0.6
  if:
    type: text
    word: OSASCRIPT
- id: keystroke-lower
  desc: keystroke keyword (lowercase)
  crit: notable
  conf: 0.7
  size_max: 10485760
  if:
    type: text
    word: keystroke
  unless:
  - id: objectives/anti-static/obfuscation/payload/container::source-map-extension
  - id: well-known/lib/format/jline::jline-jar-basename
  - id: well-known/lib/format/jline/
  - id: well-known/lib/runtime/jruby/
  - id: well-known/app/ai/coding-agent/tabby::tabby-basename
  - type: basename
    regex: ^(hotkeyInputModal\.component|hotkeys\.service)\.ts$
  not:
  - substr: '"name": "tabby-core"'
  - substr: 'Keystroke: '
  - substr: Observable<Keystroke>
  - substr: _keystroke = new Subject<Keystroke>()
  - substr: keyStroke
  - substr: pressedKeystroke
  - substr: lastKeystrokes
  - substr: getKeystrokeName(
- id: keystroke-title
  desc: Keystroke keyword (title case)
  crit: notable
  conf: 0.7
  size_max: 10485760
  count_min: 2
  if:
    type: text
    word: Keystroke
  unless:
  - id: objectives/collection/keylog/capture/
  - id: well-known/lib/runtime/jruby/
  not:
  - substr: '"name": "tabby-core"'
  - substr: 'Keystroke: '
  - substr: Observable<Keystroke>
  - substr: _keystroke = new Subject<Keystroke>()
  - substr: keyStroke
  - substr: pressedKeystroke
  - substr: lastKeystrokes
  - substr: getKeystrokeName(
  - substr: jline/console/ConsoleReader
  - substr: Ljline/console/ConsoleReader;
  - substr: Adobe
  - substr: Form
- id: keystroke-upper
  desc: KEYSTROKE keyword (uppercase)
  crit: notable
  conf: 0.7
  if:
    type: text
    word: KEYSTROKE
- id: key-down-lower
  desc: AppleScript key down phrase
  crit: component
  conf: 0.7
  platforms: [macos]
  for: [javascript, applescript, shell]
  size_max: 10485760
  if:
    type: text
    regex: '(?is)["'']System Events["''][\s\S]{0,160}\bkey down\b'
  not:
  - regex: (?i)event.{0,20}key down
  - regex: (?i)holding a key down
  - regex: (?i)mouse button.{0,40}key down
  - regex: (?i)\b(ctrl|shift|alt)\s+key down\b
  - regex: (?i)Page\.keyboardDown.{0,80}key down
  unless:
  - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: well-known/tool/reverse-engineering/resource-hacker/
  - id: well-known/dual-use/remote-admin/rdesktop/
  - id: well-known/lib/platform/browser-automation::playwright-trace-viewer-bundle
- id: key-down-title
  desc: AppleScript Key Down phrase
  crit: component
  conf: 0.7
  platforms: [macos]
  for: [javascript, applescript, shell]
  if:
    type: text
    regex: '(?s)["'']System Events["''][\s\S]{0,160}Key Down'
  unless:
  - id: well-known/lib/platform/browser-automation::playwright-trace-viewer-bundle
- id: key-down-upper
  desc: AppleScript KEY DOWN phrase
  crit: component
  conf: 0.7
  platforms: [macos]
  for: [javascript, applescript, shell]
  if:
    type: text
    regex: '(?s)["'']System Events["''][\s\S]{0,160}KEY DOWN'
  unless:
  - id: well-known/lib/platform/browser-automation::playwright-trace-viewer-bundle
- id: system-events-lower
  desc: system events phrase (lowercase)
  crit: notable
  conf: 0.7
  # Require the quoted AppleScript application reference. A bare "system events"
  # substring matched ordinary prose ("ignore file system events"); the macOS
  # automation target is always referenced as application "System Events".
  if:
    type: text
    substr: '"system events"'
- id: system-events-title
  desc: System Events phrase (title case)
  crit: component
  conf: 0.7
  if:
    type: text
    regex: (?i)tell\s+application\s+"System Events"
- id: system-events-upper
  desc: SYSTEM EVENTS phrase (uppercase)
  crit: notable
  conf: 0.7
  # Quoted AppleScript application reference (see system-events-lower).
  if:
    type: text
    substr: '"SYSTEM EVENTS"'
- id: keycode-camel
  desc: Reads JS keyCode of keypress
  crit: component
  conf: 0.7
  if:
    type: symbol
    exact: keyCode
# The Node AppleScript library atoms that used to live here matched a bare
# library reference and nothing about keystrokes, so they convicted every
# bundle that ships `run-applescript` (the `open`/`default-browser` dependency
# chain) as keylogging. They are now neutral capabilities under
# micro-behaviors/process/create/script/osascript, referenced below.
- id: node-global-keyboard-hook
  desc: Node global keyboard hook module
  crit: suspicious
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: '(?i)(require\s*\(\s*["'']iohook["'']\s*\)|from\s+["'']iohook["''])'
