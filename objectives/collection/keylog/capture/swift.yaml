defaults:
  for: [swift]
  platforms: [macos]
  attack: T1056.001
  mbc: B0015

traits:
  - id: swift-keylogger-class-launch
    desc: Swift launches keylogger class
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: '\bKeylogger\s*\(\)\s*'

  - id: swift-keylogger-instance-start
    desc: Swift starts instantiated keylogger object
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?s)Keylogger\s*\(\s*\).{0,64}?[\w)]\s*\.start\s*\(\s*\)'

composite_rules:
  - id: swift-keylogger-runloop-launcher
    desc: Swift keylogger run-loop launcher
    crit: hostile
    conf: 0.96
    all:
      - id: swift-keylogger-class-launch
      - id: micro-behaviors/os/event/trigger::swift-main-runloop-run

  - id: swift-keylogger-daemon-entrypoint
    desc: Swift entry point runs keylogger daemon
    crit: hostile
    conf: 0.95
    all:
      - id: swift-keylogger-instance-start
      - id: micro-behaviors/os/event/trigger::swift-main-runloop-run

