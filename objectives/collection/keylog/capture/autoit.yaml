defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: autoit-keylogger-profile
    desc: AutoIt keyboard capture profile
    crit: notable
    conf: 0.95
    all:
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: micro-behaviors/hardware/input/keyboard/label::keystroke-capture-string
    unless:
      - id: well-known/app/utility/installer::uniextract-installer
      - id: well-known/app/enterprise/delinea::centrify-management-services-benign-context

  - id: autoit-rat-input-network-profile
    desc: "AutoIt RAT profile: keyboard capture, FTP, and remote-process APIs"
    crit: hostile
    conf: 0.99
    attack: T1056.001,T1071.002,T1055
    mbc: B0033
    all:
      - id: autoit-keylogger-profile
      - id: micro-behaviors/communications/ftp/client::wininet-ftp-api
      - id: micro-behaviors/process/inject/runtime/call::remote-process-memory-api-cluster
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/app/utility/installer/
