# Keylogger Behavioral Composites
# Generic keylogger detection patterns (not family-specific)
# ATT&CK: T1056.001 (Keylogging)
defaults:
  attack: T1056.001
  platforms: [macos]
  for: [macho]
composite_rules:
  # Windows keylogger + clipboard + stealer combo
  # Fires hostile when a keylogger is combined with clipboard capture and
  # additional data-stealing indicators (dropper, SQLite, file enumeration).
  - id: keylogger-clipboard-stealer
    desc: Keylogger with clipboard and mouse tracking
    crit: hostile
    conf: 0.95
    all:
      - id: keylogger-with-clipboard
      - id: micro-behaviors/fs/path/cache::evt-marker-file
    any:
      - id: micro-behaviors/fs/path/cache::hidden-system-cache-file
      - id: micro-behaviors/fs/path/temp::tmp-hidden-file
  # Keylogger with structured data output
  - id: windows-surveillance-known-benign-context
    desc: Known benign Windows surveillance context
    crit: exception
    conf: 0.99
    platforms: [windows]
    for: [pe]
    any:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: well-known/app/browser/internet-explorer/
      - id: well-known/lib/runtime/scripted/electron/
      - id: well-known/lib/media/videolan/
      - id: well-known/app/storage/qbittorrent/
      - id: well-known/dual-use/transfer/winscp/
      - id: well-known/app/browser/tor-browser/
      - id: well-known/tool/reverse-engineering/resource-hacker/
      - id: well-known/tool/sysadmin/xserver/
      - id: well-known/app/productivity/clippy::clippy-binary
      - id: well-known/app/utility/vovsoft::ai-requester-known-app-context
      - id: well-known/app/utility/vovsoft::filename-lister-known-app-context
      - id: well-known/app/utility/everything::verified-everything-app-identity
      # A verified TightVNC Viewer collects local clipboard/input to relay a
      # remote desktop session; the same APIs do not imply covert capture.
      - id: well-known/dual-use/remote-admin/tightvnc::tightvnc-viewer-verified-identity
      - id: well-known/app/productivity/qlickprint/
      - id: well-known/lib/ui/
      - id: well-known/lib/platform/mfc::mfc-runtime-basename
      - id: well-known/tool/sysadmin/autohotkey::autohotkey-official-interpreter
      # AutoItX3.dll is a UI-automation control; its whole job is the
      # input/clipboard/screen API set these composites key on. Vendored by
      # RAutomation, PyAutoIt and the Selenium Ruby gem.
      - id: well-known/tool/sysadmin/autoit::autoitx-official-control
      - id: metadata/binary/installer/family::qt-installer-framework
  - id: surv-keylog-present
    desc: Keystroke capture capability present
    crit: component
    conf: 0.9
    platforms: [windows]
    for: [pe]
    any:
      - id: objectives/collection/keylog/hook::windows-hook-window-title-keylogger
      - id: objectives/collection/keylog/hook::windows-hook-keypoll-window-title
      - id: micro-behaviors/hardware/input/keyboard/poll::polling-keylogger-api-cluster
    unless:
      - id: well-known/lib/runtime/native-platform/tcl-tk/
      - id: well-known/lib/ui/
      - id: well-known/lib/media/sdl::sdl-runtime-component
      - id: well-known/lib/media/ffmpeg/
      - id: known-gui-runtime-input-exception
      - id: well-known/tool/reverse-engineering/resource-hacker/
      - id: well-known/app/productivity/clippy::clippy-binary
      - id: metadata/binary/installer/family::qt-installer-framework
  - id: windows-opaque-surveillance-loader
    desc: Obfuscated Windows surveillance loader with staged payload
    crit: hostile
    conf: 0.98
    platforms: [windows]
    for: [pe]
    attack: T1027,T1056.001,T1113,T1115
    all:
      - id: micro-behaviors/os/api-resolution/hash-based::multiplicative-hash-loop
      - id: metadata/binary/section/entropy::large-high-entropy-writable-data-section
      - id: micro-behaviors/fs/temp/directory::temp-file-staging-primitives
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
      - id: micro-behaviors/os/clipboard/reference::win32-clipboard-access
      - id: micro-behaviors/hardware/display/screen::gdi-getdibits
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/

  # A key-name table next to a remote-process write primitive.
  #
  # The keylogging composites above all require SetWindowsHookEx. This family
  # does not import it -- the evidence is the other half of a keylogger, the
  # printable labels it substitutes for keys that have no character: the
  # strings `BACKSPACE`, `CAPSLOCK`, `NUMLOCK`, `PRINTSCREEN`. A program keeps
  # that table for one reason, which is to write a readable transcript of
  # someone else's typing.
  #
  # On its own the table is only notable -- a keyboard-remapping utility has
  # the same words. What settles it is the company it keeps: the ability to
  # allocate and write memory inside another process, and a reference to
  # SeDebugPrivilege, which is what that write needs when the target belongs
  # to a different user. Surveillance software that says what it is does not
  # need to get there through another process's address space.
  - id: keylog-labels-with-remote-process-write
    desc: Key-label table with remote process writes
    crit: hostile
    conf: 0.95
    platforms: [windows]
    for: [pe, dll]
    attack: T1056.001,T1055
    all:
      - id: micro-behaviors/process/inject/runtime/call::remote-process-memory-api-cluster
      - id: micro-behaviors/os/privilege/token::sedebug-privilege-name
      # The table, not one word: `special-key-name` already requires a
      # lock-key label and an action-key label together, because `BACKSPACE`
      # alone appears in any program that names a key.
      - id: micro-behaviors/hardware/input/keyboard/label::special-key-name
    # Named exemptions, not whole directories. The first draft exempted
    # `well-known/tool/sysadmin/` and `well-known/tool/reverse-engineering/`,
    # which silently cleared this entire family: the droppers are WinRAR SFX
    # stubs whose icons were edited with Resource Hacker, so they carry both a
    # `winrar-component` marker and Resource Hacker's own strings. A directory
    # `unless:` over a tool tree exempts every carrier that merely bundles the
    # tool -- including the one the attacker used to build the carrier.
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: known-gui-runtime-input-exception
      # A compiled AutoIt script carries the whole AutoIt runtime: the Send-key
      # label table, the remote-process memory APIs, and the SeDebugPrivilege
      # string are present regardless of what the script does.
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: well-known/tool/reverse-engineering/pe-explorer/
      # The stock AutoIt3 interpreter. It exposes the whole Win32 surface to
      # scripts -- Send()/key-label tables, _WinAPI_WriteProcessMemory and
      # SeDebugPrivilege all live in the runtime whatever a script does -- so
      # scoop's autoit-v3.zip scored hostile on AutoIt3.exe and AutoIt3_x64.exe.
      # Keyed on the *leaf signer*, deliberately, not on the AutoIt tool tree:
      # a compiled AutoIt payload is the interpreter with a script appended and
      # does not carry AutoIt Consulting's Authenticode leaf, so this exempts the
      # genuine unmodified interpreter without exempting AutoIt-built droppers --
      # the carrier problem the note above describes.
      - id: metadata/signed/leaf::autoit-consulting-ltd
      - id: well-known/tool/sysadmin/iobit-unlocker/
      - id: well-known/dual-use/remote-admin/
