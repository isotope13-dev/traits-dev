defaults:
  platforms: [android]
  for: [dex]
composite_rules:
  - id: android-pattern-checks-touch-reads
    desc: Lock-pattern checks and touch reads coexist
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/hardware/input/accessibility::dex-pattern-view-id-check
      - id: micro-behaviors/hardware/input/accessibility::dex-accessibility-node-class-read
      - id: micro-behaviors/hardware/input/accessibility::dex-accessibility-password-flag-read
      - id: micro-behaviors/hardware/input/event::dex-touch-x-read
      - id: micro-behaviors/hardware/input/event::dex-touch-y-read
