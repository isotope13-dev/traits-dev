defaults:
  platforms: [windows, unix]
  for: [class]
traits:
  - id: jvm-reflected-key-packet-identifiers
    desc: JVM names reflected key-event packet reporting
    crit: suspicious
    conf: 0.96
    if:
      type: yara
      source: |
        rule jvm_reflected_key_packet_identifiers {
          strings:
            $logger = "disableJNHLogger" ascii
            $keycode = "keyCode" ascii
            $keytext = "keyText" ascii
            $proxy = "newProxyInstance" ascii
            $send = "sendPacket" ascii
          condition:
            uint32be(0) == 0xcafebabe and all of them
        }
