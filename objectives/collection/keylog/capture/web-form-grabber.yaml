# A browser form grabber: every value typed into any field on the page is read
# and shipped to a remote host.
#
# This is the web analogue of a keylogger and needs no keyboard hook at all --
# one document-level `input` listener sees every field of every form, including
# ones rendered after the listener was installed. The June 2024 WordPress.org
# source compromise (Blaze Widget, Wrapper Link Elementor, Contact Form 7
# Multi-Step and others) injected exactly this into `wp_footer`, base64-wrapped
# each captured value, and POSTed it with a per-visitor cookie id so the
# operator could reassemble one victim's session.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, php]
  attack: T1056.001
  mbc: E1056

composite_rules:
  # Listening for input is ordinary (validation, autosave, analytics). Reading
  # the value out of the event and sending it to a hardcoded external host is
  # not: a page that needs a field's value already has it locally.
  - id: browser-input-values-exfiltrated
    desc: Typed field values sent to a remote host
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/ui/window/form-input::browser-value-event-member-read
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    any:
      - id: micro-behaviors/ui/window/form-input::document-input-listener
      - id: micro-behaviors/ui/window/form-input::capture-phase-input-listener
    unless:
      - id: metadata/package/testing/
      - id: metadata/package/testing/presence/manifest::test-fixtures
