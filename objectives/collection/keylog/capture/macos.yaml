defaults:
  platforms: [macos]
  for: [macho]
  attack: T1056.001
  mbc: B0015

composite_rules:
  - id: macos-event-tap-keylogger
    desc: macOS CGEvent tap keylogger with telemetry
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/hardware/input/event::macos-cgevent-tap-create
      - id: metadata/signed/trust-level::unsigned-macho
    any:
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/http/client/initialize::cfhttp-create-request
      - id: metadata/binary/symbols/name/process::c-popen
      - id: metadata/file/profile/process/creation-api::system-command-api-clues
    unless:
      - id: metadata/signed/platform::apple
