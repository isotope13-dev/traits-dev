defaults:
  platforms: [macos]
  for: [macho]
  attack: T1056.001
  mbc: B0015

composite_rules:
  - id: macos-event-tap-keylogger
    desc: Mach-O infector with keyboard capture APIs
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/impact/infect/virus::macos-macho-file-infector
      - id: micro-behaviors/hardware/input/event::macos-cgevent-tap-create
      - id: micro-behaviors/hardware/input/keyboard/hid::native-iohid-input-value-callback
      - id: micro-behaviors/hardware/input/keyboard/hid::native-iohid-input-integer-value
