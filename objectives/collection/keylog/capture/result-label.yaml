defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1056.001

traits:
  - id: python-keylog-result-label
    desc: Labels buffered output as keylog data
    crit: component
    conf: 0.96
    if:
      type: text
      substr: '[KEYLOG]\n'

  - id: python-keylog-routine-file-write
    desc: Keylog routine opens an output file
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)def\s+(start_)?keylog\w*.{0,999}\bopen\(.{0,160},\s*["''][aw]'
