defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1056.001

traits:
  - id: python-keylog-routine-file-write
    desc: Keylog routine opens an output file
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)def\s+(start_)?keylog\w*.{0,999}\bopen\(.{0,160},\s*["''][aw]'
  - id: python-pynput-event-handler-key-value
    desc: Key character reference near event handler
    # Terminal widgets read ordinary key events too. Count this toward the
    # logger composite, which also requires a listener and a file sink.
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?is)\bdef\s+\w+\s*\(\s*self\s*,\s*event\b.{0,500}(event\.char\b|get_event_char\b)'
  - id: python-pynput-event-handler-saves
    desc: Event handler forwards input to save
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?is)\bdef\s+\w+\s*\(\s*self\s*,\s*event\b.{0,1000}\.save\s*\('
  - id: python-pynput-save-writes-file
    desc: Python save method writes to a file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\bdef\s+save\s*\(\s*self\b.{0,500}\.write\s*\('
