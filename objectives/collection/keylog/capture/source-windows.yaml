# Browser-targeted low-level keyboard hooks in native source.
# A global low-level hook is dual-use; pairing it with a browser window-class
# target list and foreground-window/title inspection identifies credential
# capture without relying on a family name or a prose label.
defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust, go, source]
  attack: T1056.001
  mbc: B0015

traits:
  # `xoff` is gone from the alternation. It is not a window class — it is XOFF,
  # the DC3 flow-control character every serial, UART and termios header in
  # existence names, so `count_min: 3` was met by ordinary comms code: Linux's
  # own `arch-x86/include/linux/serial_reg.h` has `Xoff` twice and `XOFF` once
  # and scored "Browser window-class target set" for it (7 headers in one
  # kernel-headers tarball clear the threshold). The remaining tokens are real
  # Win32 window classes — `IEFrame` is Internet Explorer's, `SunAwtFrame` is
  # Java AWT's — which is what the name and the keylog objective claim.
  - id: browser-window-class-target-set
    desc: Browser window-class target set
    crit: notable
    conf: 0.96
    count_min: 3
    if:
      type: text
      regex: '(?i)\b(ieframe|xdesk|xtrava|sunawtframe)\b'

composite_rules:
  - id: numeric-low-level-keyboard-hook-file-logger
    desc: Native low-level keyboard hook writes captured input to a file
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-low-level-keyboard-hook-numeric-code
      - id: micro-behaviors/fs/file/write/direct::write-file-source
    near_bytes: 4096

  - id: numeric-low-level-keyboard-hook-hidden-file-logger
    desc: Native keylogger hides its file output
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-low-level-keyboard-hook-numeric-code
      - id: micro-behaviors/fs/file/write/direct::write-file-source
      - id: micro-behaviors/fs/file/attributes::hidden-file-create-flag
    near_bytes: 4096

  - id: browser-gated-low-level-keylogger
    desc: Browser-targeted global low-level keyboard hook
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-low-level-keyboard-hook-const
      - id: browser-window-class-target-set
      - id: micro-behaviors/ui/window/manage/control::get-foreground-window-source
      - id: micro-behaviors/ui/window/manage/control::get-window-text-source
    near_bytes: 4096
