# Browser-targeted low-level keyboard hooks in native source.
# A global low-level hook is dual-use; pairing it with a browser window-class
# target list and foreground-window/title inspection identifies credential
# capture without relying on a family name or a prose label.
defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust, go, source]
  attack: T1056.001
  mbc: B0015

traits:
  - id: browser-window-class-target-set
    desc: Browser window-class target set
    crit: notable
    conf: 0.96
    count_min: 3
    if:
      type: text
      regex: '(?i)\b(ieframe|xoff|xdesk|xtrava|sunawtframe)\b'

composite_rules:
  - id: browser-gated-low-level-keylogger
    desc: Browser-targeted global low-level keyboard hook
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-low-level-keyboard-hook-const
      - id: browser-window-class-target-set
      - id: micro-behaviors/ui/window/manage/control::get-foreground-window-source
      - id: micro-behaviors/ui/window/manage/control::get-window-text-source
    near_bytes: 4096
