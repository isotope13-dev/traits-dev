defaults:
  crit: hostile
  platforms: [android]
  for: [android_apk, zip, xml]

composite_rules:
  # Text-change callbacks become a cross-application keylogging surface when
  # the service also records both the originating package and resource id.
  - id: android-accessibility-text-event-keylogging
    desc: Accessibility service captures contextualized text-change events
    crit: suspicious
    conf: 0.98
    for: [java, kotlin]
    attack: T1056.001,T1417.001
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-text-change-event
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-event-field-context
      - id: metadata/lang/source/syntax/call/member::java-kotlin-gettext-call-text
    near_lines: 24

