defaults:
  platforms: [android]
  for: [apk, zip, xml]

composite_rules:
  - id: android-accessibility-keyboard-capture
    desc: Android accessibility keyboard capture
    crit: hostile
    conf: 0.97
    for: [apk, zip]
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-config
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-request-layout
      - id: micro-behaviors/hardware/input/keyboard/layout::android-custom-keyboard-resources
      - id: micro-behaviors/os/privilege/manifest::device-admin-policy-resource
    any:
      - id: micro-behaviors/hardware/input/accessibility::android-miui-accessibility-layout
      - id: micro-behaviors/os/privilege/check::android-oppo-battery-settings-layout

  # Manifest-visible IME + accessibility pairing used by Android bankers to
  # capture keystrokes (custom "Simple Keyboard"-style IME) while the
  # accessibility service automates permission grants and UI clicks.
  - id: android-accessibility-ime-keylog-surface
    desc: Android accessibility IME keylog surface
    crit: hostile
    conf: 0.96
    attack: T1417.001
    all:
      - id: micro-behaviors/os/privilege/manifest::bind-accessibility-service
      - id: micro-behaviors/os/privilege/manifest::bind-input-method
    any:
      - id: micro-behaviors/os/privilege/manifest::system-alert-window
      - id: micro-behaviors/os/privilege/manifest::bind-device-admin
      - id: micro-behaviors/os/privilege/manifest::media-projection-service-type
    needs: 1
