# Migrated from the mixed Cargo package profile; the destination names the required claim.
defaults:
  platforms: [unix, windows]
  for: [cargo.toml]

composite_rules:
- id: cargo-keylogger-with-input-api
  desc: Cargo keylogger name with input API
  crit: suspicious
  conf: 0.88
  all:
  - id: objectives/supply-chain/impersonation/crate-name::cargo-name-keylogger
  - id: metadata/package/cargo-windows::cargo-winapi-collection-feature
- id: cargo-keylogger-with-network-crypto
  desc: Cargo input capture network crypto
  crit: suspicious
  conf: 0.88
  all:
  - id: metadata/package/dependencies/manifest/identity::cargo-dep-rdev
  - id: metadata/import/package::dep-reqwest
  any:
  - id: metadata/package/dependencies/manifest/identity::cargo-dep-aes-gcm
  - id: metadata/package/dependencies/manifest/presence::cargo-dep-rand
- id: cargo-input-capture-with-network
  desc: Cargo input capture with network
  crit: notable
  conf: 0.86
  all:
  - id: metadata/package/dependencies/manifest/identity::cargo-dep-rdev
  - id: metadata/import/package::dep-reqwest
  unless:
  - id: well-known/dual-use/remote-admin/rustdesk::rustdesk-source-tree
- id: cargo-input-capture-with-crypto
  desc: Cargo input capture with crypto
  crit: suspicious
  conf: 0.86
  all:
  - id: metadata/package/dependencies/manifest/identity::cargo-dep-rdev
  - id: metadata/package/dependencies/manifest/identity::cargo-dep-aes-gcm
