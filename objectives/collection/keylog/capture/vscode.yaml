# A VS Code extension that intercepts the editor's `type` command and turns
# the captured text into hex DNS labels sent through Node's resolver. Editor
# emulation extensions override `type` to implement key bindings, but never
# hex-encode the typed text into hostnames and resolve them.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]

composite_rules:
  - id: vscode-typed-text-dns-exfil
    desc: VS Code extension sends intercepted keystrokes in DNS lookups
    crit: hostile
    conf: 0.97
    attack: T1056.001,T1048.003,T1195.002
    near_bytes: 1024
    all:
      - id: micro-behaviors/hardware/input/keyboard/listener::vscode-type-command-override
      - id: micro-behaviors/data/encode/hex::js-to-string-hex
    any:
      - id: micro-behaviors/communications/dns/resolver::dns-lookup-call
      - id: micro-behaviors/communications/dns/resolver::dns-resolve-call
      - id: micro-behaviors/communications/dns/resolver::dns-resolve4
      - id: micro-behaviors/communications/dns/resolver::dns-resolve6
      - id: micro-behaviors/communications/dns/resolver::dns-promises-lookup
