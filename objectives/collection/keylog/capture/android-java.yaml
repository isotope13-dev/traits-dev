defaults:
  platforms: [android]
  for: [java]
  attack: T1056.001
  mbc: F0006

composite_rules:
  - id: android-keylogger-typed-text-store
    desc: Android keylogger typed text store
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/input/keyboard/label::android-keylogger-db-name
      - id: micro-behaviors/hardware/input/keyboard/label::android-keyevents-table
      - id: micro-behaviors/ui/window/form-input::typed-text-label
