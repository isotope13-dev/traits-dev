defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]
  attack: T1056.001

composite_rules:
  - id: native-terminal-raw-capture
    desc: Native terminal raw capture
    crit: component
    conf: 0.97
    # The bare termios symbol trio (ttyname + tcgetattr + tcsetattr/cfmakeraw) is
    # just interactive terminal control — every shell, editor, pager, and login
    # tool (bash, less, gpg, tset, sg, su) has it, so it is a pure false positive.
    # Genuine keylog capture is terminal echo being disabled plus a single-byte
    # stdin read loop, which the two atoms below detect; require both.
    all:
      - id: micro-behaviors/process/tty/terminal::source-terminal-echo-control
      - id: micro-behaviors/process/tty/terminal::source-stdin-byte-read
