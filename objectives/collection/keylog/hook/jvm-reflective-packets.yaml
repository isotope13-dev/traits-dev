defaults:
  platforms: [windows, unix]
  for: [class]
traits:
  - id: jvm-reflected-key-packet-identifiers
    desc: JVM names reflected key-event packet reporting
    crit: suspicious
    conf: 0.96
    if:
      type: yara
      source: |
        rule jvm_reflected_key_packet_identifiers {
          strings:
            $logger = "disableJNHLogger" ascii
            $keycode = "keyCode" ascii
            $keytext = "keyText" ascii
            $proxy = "newProxyInstance" ascii
            $send = "sendPacket" ascii
          condition:
            uint32be(0) == 0xcafebabe and all of them
        }
composite_rules:
  - id: jvm-reflected-live-keylog-packets
    desc: Reflected keylogger reports key-event packets
    crit: hostile
    conf: 0.98
    attack: T1056.001
    all:
      - id: jvm-reflected-key-packet-identifiers
      - id: metadata/lang/source/naming/declaration::jvm-keylogger-class-declaration
      - id: micro-behaviors/hardware/input/keyboard/hook::jnativehook-log-disable-method
      - id: metadata/import/jvm::proxy-newinstance-reference
      - id: metadata/import/jvm::sendpacket-member-reference
