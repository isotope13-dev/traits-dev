defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
- id: recording-keylogger-gdi-desktop-apis
  desc: Recording keylogger with GDI and desktop APIs
  crit: suspicious
  conf: 0.92
  scope: file
  attack: T1056.001
  mbc: B0015
  all:
  - id: keylogger-recording-start-status
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
  - id: micro-behaviors/ui/window/probe::get-desktop-window
  - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
  any:
  - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
  - id: micro-behaviors/hardware/input/keyboard/poll::foreground-window-input-state
  - id: micro-behaviors/hardware/input/keyboard/layout::map-virtual-key
  needs: 1
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/lang/compiler/managed::delphi
  # Catalogued applications, tools, and runtimes are allowed to expose GUI
  # painting and hook lifecycle APIs as framework surface.
  - id: well-known/app/
  - id: well-known/tool/
  - id: well-known/lib/
  - id: objectives/collection/keylog/capture::known-gui-runtime-input-exception
  - id: well-known/dual-use/remote-admin/tightvnc::tightvnc-viewer-verified-identity
  # Parser-library malware-fixture corpora (saferwall/pe test/): the
  # specimen is inert test data, not a shipped surveillance tool.
  - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
  downgrade:
    scope: archive
    any:
    - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
