defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1056.001
  mbc: E1056.001
composite_rules:
- id: keyboard-hook-raw-socket-exfiltration
  desc: Keyboard hook keylogger exfiltrates over a raw Winsock connection
  crit: hostile
  conf: 0.96
  attack: T1056.001,T1071,T1041
  mbc: E1056.001,E1041
  all:
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-hook-lifecycle
  - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
  - id: micro-behaviors/communications/socket/init::winsock-client-lifecycle
  - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
  any:
  - id: micro-behaviors/hardware/input/keyboard/poll::foreground-window-input-state
  - id: micro-behaviors/ui/window/manage/control::get-window-text
  - id: micro-behaviors/ui/window/probe::get-desktop-window
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: unsigned-staged-loader-keyboard-hook
  desc: Unsigned debugger-gated loader installs a Windows keyboard hook
  crit: hostile
  conf: 0.99
  attack: T1056.001,T1027,T1497.001
  all:
  - id: objectives/anti-analysis/debugger-detect/check::staged-pe-loader-with-debugger-check
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-hook-lifecycle
  - id: metadata/binary/layout::pe-no-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
  - id: well-known/app/

- id: windows-dll-keyboard-hook-lifecycle
  desc: Windows DLL keyboard hook lifecycle
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-hook-lifecycle
  - id: micro-behaviors/hardware/input/keyboard/hook::hookon-hookoff-export-pair
  unless:
  - id: metadata/signed/platform/
- id: windows-hook-ipc-keylogger-component
  desc: Windows keyboard hook IPC keylogger component
  crit: hostile
  conf: 0.94
  all:
  - id: windows-dll-keyboard-hook-lifecycle
  - id: micro-behaviors/communications/ipc/file-mapping::open-file-mapping-a
  - id: metadata/binary/metrics/structural::minimal-exports
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
- id: windows-hook-registry-persistence-keylogger
  desc: Keyboard hook with registry and process control
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/hardware/input/keyboard/hook::low-level-windows-keyboard-hook
  - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
  - id: micro-behaviors/process/terminate/kill::terminate-process
  any:
  - id: objectives/anti-analysis/sandbox-detect/tool-references::user-interaction-trigger-cluster
  - id: micro-behaviors/hardware/input/keyboard/poll::foreground-window-input-state
  - id: micro-behaviors/ui/window/manage/control::get-window-text
  - id: micro-behaviors/ui/window/probe::get-desktop-window
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
  - id: well-known/tool/sysadmin/sandboxie/
  - id: micro-behaviors/ui/framework/imgui/
  - id: well-known/app/
  - id: well-known/lib/runtime/electron::electron-chromium-runtime-strong
- id: windows-hook-foreground-registry-capture
  desc: Low-level keyboard hook with foreground-window and registry activity
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/hardware/input/keyboard/hook::low-level-windows-keyboard-hook
  - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
  - id: micro-behaviors/ui/window/manage/control::get-foreground-window
  - id: micro-behaviors/os/registry/access::registry-set-value-api
  any:
  - id: micro-behaviors/hardware/input/mouse/position::get-cursor-pos
  - id: micro-behaviors/ui/window/manage/control::get-window-text
  - id: micro-behaviors/ui/window/probe::get-desktop-window
  - id: objectives/anti-analysis/sandbox-detect/tool-references::user-interaction-trigger-cluster
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
  - id: well-known/tool/sysadmin/sandboxie/
  - id: micro-behaviors/ui/framework/imgui/
  - id: well-known/dual-use/transfer/winscp/
  - id: well-known/tool/sysadmin/conemu/
  - id: well-known/app/communication/telegram::telegram-desktop-product-identity
  - id: well-known/lib/runtime/electron::electron-chromium-runtime-strong
- id: windows-hook-clipboard-screen-surveillance
  desc: Windows hook collects clipboard and screen
  crit: hostile
  conf: 0.97
  all:
  # A generic Windows message hook is normal GUI plumbing; require a
  # keyboard-specific hook type before treating this cluster as surveillance.
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
  - id: micro-behaviors/os/clipboard/access::get-clipboard-data
  any:
  - id: micro-behaviors/hardware/display/screen::gdi-screen-capture-primitives
  - id: micro-behaviors/hardware/display/screen::gdi-bitmap-transfer-primitives
  - id: objectives/collection/screenshot/capture::gdi-window-capture
  needs: 1
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
  - id: well-known/app/
  - id: well-known/lib/
  - id: metadata/lang/compiler/managed::borland-section-code
  - id: metadata/binary/installer/family/
