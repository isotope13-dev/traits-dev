defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  attack: T1056.001
  mbc: E1056.001
composite_rules:
- id: unsigned-staged-loader-keyboard-hook
  desc: Unsigned debugger-gated loader installs a Windows keyboard hook
  crit: hostile
  conf: 0.99
  attack: T1056.001,T1027,T1497.001
  all:
  - id: objectives/anti-analysis/debugger-detect/loader::staged-pe-loader-with-debugger-check
  - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
  - id: metadata/signature/absent::unsigned-missing-signature-record
- id: global-keyboard-hook-ipc-capture
  desc: Global keyboard capture through mapped IPC
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/hardware/input/keyboard/hook::global-keyboard-hook-ipc-forwarding
  - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
- id: windows-hook-registry-persistence-keylogger
  desc: Keyboard hook, registry and process-control references
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/hardware/input/keyboard/hook::low-level-windows-keyboard-hook
  - id: micro-behaviors/os/registry/value/write::registry-set-value-api
  - id: micro-behaviors/process/terminate/kill::terminate-process
  any:
  - id: micro-behaviors/hardware/input/monitor::input-and-window-api-profile
  - id: micro-behaviors/hardware/input/keyboard/poll::foreground-window-input-state
  - id: micro-behaviors/ui/window/enumerate::get-window-text
  - id: micro-behaviors/ui/window/probe::get-desktop-window
  unless:
  - id: well-known/lib/ui/dear-imgui::imgui-interface-context
  - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
- id: windows-hook-chain-recording-keylogger
  desc: Keyboard recording with hook, registry and title APIs
  crit: hostile
  conf: 0.93
  all:
  - id: micro-behaviors/hardware/input/keyboard/hook::low-level-windows-keyboard-hook
  - id: micro-behaviors/hardware/input/keyboard/label::keyboard-recording-labels
  - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
  - id: micro-behaviors/os/registry/value/write::registry-set-value-api
  - id: micro-behaviors/process/terminate/kill::terminate-process
  any:
  - id: micro-behaviors/ui/window/enumerate::get-window-text
  - id: micro-behaviors/ui/window/probe::get-desktop-window
  unless:
  - id: well-known/lib/ui/dear-imgui::imgui-interface-context
  - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
- id: windows-hook-foreground-registry-capture
  desc: Low-level keyboard hook with foreground-window and registry activity
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/hardware/input/keyboard/hook::low-level-windows-keyboard-hook
  - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
  - id: micro-behaviors/ui/window/enumerate::get-foreground-window
  - id: micro-behaviors/os/registry/value/write::registry-set-value-api
  any:
  - id: micro-behaviors/hardware/input/mouse::get-cursor-pos
  - id: micro-behaviors/ui/window/enumerate::get-window-text
  - id: micro-behaviors/ui/window/probe::get-desktop-window
  - id: micro-behaviors/hardware/input/monitor::input-and-window-api-profile
  needs: 2
- id: windows-hook-clipboard-screen-surveillance
  desc: Keyboard, clipboard, and screen capture APIs
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
  - id: micro-behaviors/os/clipboard/read::get-clipboard-data
  any:
  - id: micro-behaviors/hardware/display/screenshot/unspecified::gdi-screen-capture-primitives
  - id: micro-behaviors/ui/graphics/draw::gdi-bitmap-transfer-primitives
  - id: micro-behaviors/hardware/display/screenshot/window::gdi-bitmap-and-window-api-set
  needs: 1
- id: node-addon-keyboard-hook-keylogger
  desc: Node addon hooks input, reads keyboard state
  crit: hostile
  conf: 0.98
  attack: T1056.001,T1059.007
  all:
    - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
    - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state
  # Addon shape only: host runtimes (node.exe, Electron) carry napi_* names
  # as exports and text, so name-text legs alone convicted stock Electron.
  any:
    - id: metadata/binary/symbols/imports::node-api-symbol-table-families
    - id: metadata/binary/symbols/exports::node-api-addon-export
  unless:
    - id: metadata/binary/symbols/exports::node-api-runtime-host-export
