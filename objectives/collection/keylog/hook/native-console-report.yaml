defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: native-hook-key-event-reporting
    desc: Windows hook with keyboard-event report fields
    # Console diagnostic utilities can record exactly this information. This
    # establishes input recording, not covert storage or exfiltration.
    crit: suspicious
    conf: 0.97
    attack: T1056.001
    all:
      - id: micro-behaviors/ui/window/hook::windows-hook-install
      - id: micro-behaviors/hardware/input/keyboard/label::native-key-event-report-fields
      - id: micro-behaviors/hardware/input/keyboard/label::key-system-up-report-label
