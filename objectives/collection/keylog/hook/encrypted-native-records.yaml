# This is a surveillance capability with concealment, not proof of an
# unauthorized operator. Privacy-oriented recorders remain a plausible use.
defaults:
  for: [c, cpp]
  platforms: [windows]
  crit: suspicious
  conf: 0.95
composite_rules:
  - id: encrypted-window-key-recording
    desc: Keyboard and window capture with XOR file writes
    attack: T1056.001
    near_bytes: 4096
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
      - id: micro-behaviors/hardware/input/keyboard/event::keyboard-event-code-read
      - id: micro-behaviors/ui/window/enumerate::get-foreground-window-source
      - id: micro-behaviors/ui/window/enumerate::get-window-text-source
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::c-for-loop-array-xor-assign
      - id: micro-behaviors/fs/write/file/handle/unspecified::write--fwrite
