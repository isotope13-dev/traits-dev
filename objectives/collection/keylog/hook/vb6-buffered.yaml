defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # The hook type and string-buffer operations distinguish this from a VB6
  # utility merely declaring input APIs. Authorized recorders remain possible.
  - id: vb6-keyboard-hook-buffered-recording
    desc: VB6 keyboard hook with Unicode translation and buffered window context
    crit: suspicious
    conf: 0.97
    attack: T1056.001
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: metadata/binary/instruction/operand::vb6-call-13-four-argument-slots
      - id: micro-behaviors/ui/window/hook::set-windows-hook-text
      - id: micro-behaviors/hardware/input/keyboard/layout::to-unicode-ex-str
      - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state-str
      - id: micro-behaviors/data/string/concat::vb6-pcode-field-concat-store
      - id: micro-behaviors/ui/window/enumerate::get-foreground-window-name-reference
