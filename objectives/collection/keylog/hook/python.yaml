defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  mbc: B0015
  attack: T1056.001
  crit: suspicious

composite_rules:
  - id: python-on-release-keyboard-wait
    desc: Waits on keyboard.on_release capture
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/input/keyboard/listener::import-keyboard
      - id: micro-behaviors/hardware/input/keyboard/listener::keyboard-on-release
      - id: micro-behaviors/hardware/input/keyboard/listener::keyboard-wait
