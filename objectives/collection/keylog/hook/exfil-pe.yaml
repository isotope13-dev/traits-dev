# Single-export keyboard-hook DLLs are keylog modules, not accessibility
# helpers: a lone export plus the hook lifecycle is the classic injector.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1056.001
  crit: hostile
  conf: 0.94

composite_rules:
  - id: hook-single-export
    desc: Single-export module installs a keyboard hook
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-hook-lifecycle
      - id: metadata/binary/symbols/exports::single-export
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/ui/sciter/
      - id: metadata/binary/installer/plugin::known-nsis-plugin-basename
