# Single-export keyboard-hook DLLs are keylog modules, not accessibility
# helpers: a lone export plus the hook lifecycle is the classic injector.
# The install leg requires the SetWindowsHookEx symbol (import/export/call),
# not a bare API-name string: mingw runtime/header text embeds the whole
# user32 API surface in ordinary binaries, which would convict every
# single-export Ruby/Python extension DLL otherwise.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1056.001
  crit: hostile
  conf: 0.94

composite_rules:
  - id: hook-single-export
    desc: Single-export module installs a keyboard hook
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
      - id: metadata/binary/symbols/exports::single-export
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/ui/sciter/
      - id: metadata/binary/installer/plugin::known-nsis-plugin-basename
