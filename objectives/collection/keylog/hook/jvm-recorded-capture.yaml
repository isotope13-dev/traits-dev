defaults:
  platforms: [windows, unix]
  for: [class]
  attack: T1056.001
  conf: 0.98
traits:
  - id: jvm-keylog-buffer-getter
    desc: Declares a captured-keylog retrieval method
    crit: suspicious
    if:
      type: function
      exact: getKeylogs
  - id: jvm-keylogger-report-loop
    desc: Declares a keylogger reporting loop
    crit: suspicious
    if:
      type: function
      exact: startKeyloggerLoop
  - id: jvm-keylogger-start-method
    desc: Declares keylogger start control
    crit: suspicious
    if:
      type: function
      exact: startKeylogger
  - id: jvm-global-keylog-buffer-identifiers
    desc: JVM names global hooking and keylog retrieval
    crit: suspicious
    if:
      type: yara
      source: |
        rule jvm_global_keylog_buffer_identifiers {
          strings:
            $listener = "/keyboard/NativeKeyListener" ascii
            $hook = "registerNativeHook" ascii
            $key = "getKeyText" ascii
            $logs = "getKeylogs" ascii
          condition:
            uint32be(0) == 0xcafebabe and all of them
        }
  - id: jvm-keylogger-report-loop-identifiers
    desc: JVM names keylog draining and message reporting
    crit: suspicious
    if:
      type: yara
      source: |
        rule jvm_keylogger_report_loop_identifiers {
          strings:
            $loop = "startKeyloggerLoop" ascii
            $drain = "drainQueue" ascii
            $send = "sendMessage" ascii
          condition:
            uint32be(0) == 0xcafebabe and all of them
        }
  - id: jvm-native-keylog-control-identifiers
    desc: JVM names native keylog control and transport
    crit: suspicious
    if:
      type: yara
      source: |
        rule jvm_native_keylog_control_identifiers {
          strings:
            $start = "startKeylogger" ascii
            $stop = "stopKeylogger" ascii
            $native = "JNIKeylog" ascii
            $output = "java/net/Socket" ascii
          condition:
            uint32be(0) == 0xcafebabe and all of them
        }
composite_rules:
  - id: jvm-global-hook-keylog-buffer
    desc: Global keyboard capture exposes collected keylogs
    crit: hostile
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::jnativehook-key-listener-interface
      - id: micro-behaviors/hardware/input/keyboard/hook::jnativehook-registration-reference
      - id: micro-behaviors/hardware/input/keyboard/listener::jnativehook-key-text-reference
      - id: jvm-keylog-buffer-getter
  - id: jvm-global-keylog-discord-reporting
    desc: Global key capture reports through Discord
    crit: hostile
    for: [class, jar, zip]
    scope: nest
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::jvm-windows-keyboard-hook-reference
      - id: micro-behaviors/hardware/input/keyboard/listener::jvm-tounicode-member-reference
      - id: micro-behaviors/communications/http/services/discord::jda-message-channel-send-reference
      - id: jvm-keylogger-report-loop
  - id: jvm-native-keylog-socket-reporting
    desc: Native keylogging has socket control and reporting
    crit: hostile
    for: [class, jar, zip]
    scope: nest
    all:
      - id: jvm-keylogger-start-method
      - id: metadata/import/jvm::native-keylog-helper-class-reference
      - id: metadata/import/jvm::getchar-member-reference
      - id: metadata/import/jvm::socket-input-stream-reference
      - id: metadata/import/jvm::socket-output-stream-reference
