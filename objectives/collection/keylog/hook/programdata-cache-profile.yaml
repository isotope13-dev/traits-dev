defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: programdata-cache-keylog-profile
    desc: Keylogger near ProgramData cache path
    crit: hostile
    conf: 0.95
    attack: T1056.001
    all:
      - id: micro-behaviors/fs/path/cache::programdata-cache-datestamp
      - id: objectives/collection/keylog/hook::windows-keylogger
    any:
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data
      - id: micro-behaviors/hardware/display/screen::gdi-bitblt
      - id: micro-behaviors/hardware/input/keyboard/poll::foreground-window-input-state
    unless:
      - id: metadata/signed/platform/
