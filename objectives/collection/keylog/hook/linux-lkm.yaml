defaults:
  platforms: [unix]
  for: [c, cpp]

composite_rules:
- id: lkm-keyboard-notifier-capture
  desc: LKM keyboard notifier capture
  crit: hostile
  conf: 0.98
  attack: T1056.001
  mbc: F0002
  all:
  - id: micro-behaviors/hardware/input/keyboard/listener::linux-keyboard-header
  - id: micro-behaviors/os/kernel/callback::keyboard-notifier-param-struct
  - id: micro-behaviors/os/kernel/callback::keyboard-notifier-register
  - id: micro-behaviors/os/kernel/callback::keyboard-notifier-unregister
  - id: micro-behaviors/hardware/input/keyboard/listener::kernel-keycode-event-gate
  - id: micro-behaviors/data/collection/array::keys-array-declaration
  - id: micro-behaviors/os/kernel/routines::copy-key-buffer-to-user
  - id: micro-behaviors/os/kernel/device::linux-register-chrdev
