# JavaScript wrappers around native global keyboard listeners.
defaults:
  platforms: [windows, macos, linux]
  for: [javascript, typescript]
  attack: T1056.001
  mbc: B0015

composite_rules:
  - id: javascript-native-global-key-capture
    desc: JavaScript launches a native global key capture helper
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/input/keyboard/listener::global-keyboard-listener-description
      - id: micro-behaviors/process/io/stream::process-stdout-data-listener
      - id: micro-behaviors/process/create/exec::js-execfile-call
    # A wrapper names the key-capture helper, spawns it and reads its stdout
    # in one module.  In a bundled CLI the same three atoms scatter across
    # unrelated modules (a refusal list that names "a keylogger" among
    # malware nouns sits hundreds of lines from any child-process code).
    near_lines: 120
