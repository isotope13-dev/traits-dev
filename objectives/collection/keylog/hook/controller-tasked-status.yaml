# A native agent that announces online/offline keylogger recording and also
# reports controller file upload/download/execute results is a remote-access
# trojan, not a standalone keyboard utility. Each leg is only suspicious alone;
# the pairing with Run-key persistence is the hostile signal.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1056.001,T1105,T1547.001

composite_rules:
  - id: keylogger-status-controller-file-tasking-run-key
    desc: Keylogger status with controller file tasking
    crit: hostile
    conf: 0.93
    all:
      - id: keylogger-recording-start-status
      - id: objectives/command-and-control/backdoor/tasking/filesystem::native-controller-file-tasking
      - id: micro-behaviors/os/registry/keys/autostart::windows-run-key-path
    unless:
      - id: metadata/signed/platform/
