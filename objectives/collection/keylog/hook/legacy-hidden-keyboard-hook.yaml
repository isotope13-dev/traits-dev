defaults:
  for: [ne]
  platforms: [windows]
  attack: T1056.001,T1547.001

traits:
  - id: legacy-hidden-startup-keyboard-logger
    desc: Hidden startup program records keyboard events
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule legacy_hidden_startup_keyboard_logger {
          strings:
            $basic = "WriteBasicKey" ascii
            $push = "WritePushKey" ascii
            $pop = "WritePopKey" ascii
            $hidden = "running in hiden mode" ascii nocase
            $startup = "Auto StartUp" ascii nocase
            $spy = "Spy program" ascii nocase
          condition:
            uint16(0) == 0x5a4d and all of them
        }

  - id: legacy-key-spy-log-writer
    desc: Legacy key spy writes a user log
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule legacy_key_spy_log_writer {
          strings:
            $app = "WinKeySpy" ascii nocase
            $window = "SpyWindow" ascii nocase
            $keys = "spykeys" ascii nocase
            $log = "user.log" ascii nocase
          condition:
            uint16(0) == 0x5a4d and all of them
        }

  - id: legacy-spykeys-hook-logger
    desc: Legacy hook library records intercepted keys
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule legacy_spykeys_hook_logger {
          strings:
            $hook = "WINHOOK.DLL" ascii nocase
            $keys = "SPYKEYS" ascii nocase
            $logging = "Logging Started:" ascii nocase
            $key = "KEY#" ascii
          condition:
            uint16(0) == 0x5a4d and all of them
        }
