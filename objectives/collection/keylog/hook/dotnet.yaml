# .NET Polling Keylogger Composites
# Detects VB.NET/C# RATs using GetAsyncKeyState + ToUnicodeEx + window tracking
# ATT&CK: T1056.001 (Input Capture: Keylogging)
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1056.001
  mbc: E1056.001

composite_rules:
  - id: dotnet-global-key-event-stream
    desc: Collects global keyboard events into JSON
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/ui/window/hook::windows-hook-chain-api-cluster
      - id: micro-behaviors/hardware/input/keyboard/hook::dotnet-low-level-keyboard-hook-structure
      - id: micro-behaviors/hardware/input/keyboard/listener::json-keyboard-action-event
