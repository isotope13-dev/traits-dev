defaults:
  platforms: [windows]
  for: [pe]
  attack: T1056.001
  crit: notable

traits:
  - id: native-keylogger-job-status
    desc: Keylogger background job start message
    if:
      type: text
      substr: 'keylogger started (job'

  - id: native-keyboard-hook-label
    desc: Native keyboard hook label
    if:
      type: text
      substr: native keyboard hook

composite_rules:
  - id: polling-agent-keyboard-recorder
    desc: Polling shell agent includes keyboard-hook recording jobs
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/remote-command/http-poll::native-polling-shell-agent
      - id: native-keylogger-job-status
      - id: native-keyboard-hook-label
      - id: micro-behaviors/ui/window/hook::windows-hook-install
