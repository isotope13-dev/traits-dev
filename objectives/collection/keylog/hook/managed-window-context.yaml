defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # Reviewed CIL polls the foreground title into a field and includes that
  # field in timestamped key records. File scope establishes the API/record
  # profile; it does not bind the metadata field to each individual record.
  - id: dotnet-keylogger-window-title-profile
    desc: Managed keylogger with foreground-title capture APIs
    crit: hostile
    conf: 0.97
    attack: T1056.001,T1010
    all:
      - id: dotnet-hook-keylog-recording
      - id: micro-behaviors/ui/window/enumerate::managed-active-window-title-api-set
