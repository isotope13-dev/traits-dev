defaults:
  platforms: [unix, windows]
  for: [class]
composite_rules:
  - id: jvm-cumulative-keystroke-buffer
    desc: JVM records key characters in a cumulative buffer
    crit: suspicious
    conf: 0.96
    attack: T1056.001
    all:
      - id: micro-behaviors/hardware/input/keyboard/label::keystroke-buffer-field
      - id: micro-behaviors/hardware/input/keyboard/listener::jvm-character-input-reference
