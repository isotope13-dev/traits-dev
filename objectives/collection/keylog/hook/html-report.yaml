defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1056.001
  mbc: E1056.001
composite_rules:
  - id: global-hook-html-keylog-report
    desc: Global keyboard hook beside keystroke report and log retrieval
    crit: hostile
    conf: 0.97
    # Recording and an explicit keylogger-log retrieval operation supply the
    # surveillance context; a keyboard-hook library alone cannot convict.
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::global-keyboard-hook-factory-reference
      - id: micro-behaviors/data/format/html::html-enter-key-report
      - id: micro-behaviors/fs/path/log/application::keylogger-log-directory-query
      # Quasar encrypts and appends the keystroke report; WriteAllText elsewhere
      # in the assembly is unrelated. The report and retrieval supply intent.
