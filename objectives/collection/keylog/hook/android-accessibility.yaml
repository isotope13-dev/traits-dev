# Live input capture streamed off the device. An accessibility service
# records key/text events and pushes them to the operator over a WebSocket
# session. The platform key-filter attribute is the format-mandated half of
# the capture claim; session command vocabulary corroborates the live-remote
# half, since an author can rename those protocol strings.
defaults:
  platforms: [android]
  for: [android_apk, zip, dex, xml]
  crit: notable
  conf: 0.9
  attack: T1056.001

traits:
  - id: android-live-keylog-session-command
    desc: Live keylog session start/stop command reference
    crit: component
    conf: 0.95
    for: [dex, xml]
    if:
      type: text
      regex: 'live_key(log|board|event)?_(start|stop|begin|end)'

composite_rules:
  # A keyboard helper can request key-event filtering; a chat client opens
  # WebSockets. Neither streams the device's input events to a remote
  # session. Requiring the accessibility service, the streaming channel, and
  # either the platform key-filter capability or live keylog session control
  # keeps each benign neighbor out while matching the capture tunnel itself.
  - id: android-accessibility-live-keylog-stream
    desc: Accessibility service streams live input events over WebSocket
    crit: hostile
    conf: 0.94
    scope: outer
    attack: T1056.001,T1056.002
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-class
      - id: micro-behaviors/communications/websocket/client::android-okhttp-websocket-client
    any:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-key-filter-request
      - id: android-live-keylog-session-command
