# Live-keylog command vocabulary alongside accessibility and WebSocket APIs.
# Co-occurrence does not by itself prove that input was transmitted.
defaults:
  platforms: [android]
  for: [android_apk, zip, dex, xml]
  crit: notable
  conf: 0.9
  attack: T1056.001

traits:
  - id: android-live-keylog-session-command
    desc: Live keylog session start/stop command reference
    crit: component
    conf: 0.95
    for: [dex, xml]
    if:
      type: text
      regex: 'live_key(log|board|event)?_(start|stop|begin|end)'

composite_rules:
  # Key filtering and a WebSocket can coexist in ordinary accessibility apps;
  # require the independent live-keylog control vocabulary as well.
  - id: android-accessibility-live-keylog-stream
    desc: Live keylog command with accessibility and WebSocket references
    crit: hostile
    conf: 0.94
    scope: outer
    attack: T1056.001,T1056.002
    all:
      - id: metadata/binary/symbols/descriptor::android-accessibility-service-descriptor
      - id: micro-behaviors/communications/websocket/client::android-okhttp-websocket-client
      - id: android-live-keylog-session-command
