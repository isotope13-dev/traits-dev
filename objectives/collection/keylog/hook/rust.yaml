defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1056.001
  mbc: B0015
composite_rules:
  - id: rust-windows-lowlevel-keylogger
    desc: Rust Windows low-level hook keylogger
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
    any:
      - id: micro-behaviors/ui/window/hook::windows-window-hook-api-call
      - id: micro-behaviors/data/format/string::formatted-heading-template
      - id: micro-behaviors/ui/window/enumerate::rust-foreground-window-api
      - id: micro-behaviors/ui/window/enumerate::rust-window-title-api
    needs: 2
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  - id: rust-macos-eventtap-keylogger
    desc: Rust macOS event tap keylogger
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/input/event::rust-swift-event-tap-reference
      - id: micro-behaviors/process/create/compile::rust-swiftc-command
  - id: rust-windows-window-title-keylogger
    desc: Rust keylogger with active window titles
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
      - id: micro-behaviors/ui/window/enumerate::get-foreground-window-source
      - id: micro-behaviors/ui/window/enumerate::rust-window-title-api
    any:
      - id: micro-behaviors/data/format/string::formatted-heading-template
      - id: micro-behaviors/ui/window/enumerate::rust-window-title-length-api
      - id: micro-behaviors/hardware/input/keyboard/label::virtual-key-label-map
      - id: micro-behaviors/os/message/queue::get-message-w
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  - id: rust-persistent-keyboard-hook-package
    desc: Rust package combines global keyboard hook with login persistence
    crit: hostile
    conf: 0.97
    for: [crate, rust]
    scope: archive
    attack: T1056.001, T1547.001
    all:
      - id: micro-behaviors/ui/window/hook::rust-window-hook-message-loop
    any:
      - id: objectives/persistence/system/supervised::rust-windows-hkcu-run-key
      - id: objectives/persistence/system/supervised::rust-winreg-hkcu-run-key
      - id: objectives/persistence/system/supervised::rust-schtasks-onlogon
      - id: micro-behaviors/os/service/config::systemd-user-unit
