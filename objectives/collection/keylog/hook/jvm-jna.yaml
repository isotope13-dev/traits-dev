# System-wide keystroke capture from the JVM: a class implementing JNA's
# WinUser.LowLevelKeyboardProc (the WH_KEYBOARD_LL callback) in an archive
# that also opens network connections. Hotkey libraries implement the same
# interface but ship without a transport; a jar that both hooks every key
# system-wide and talks to a socket or HTTP endpoint is collecting them.
defaults:
  for: [class, java_class, jar]
  platforms: [windows]
  attack: T1056.001
  mbc: F0002
composite_rules:
  - id: jvm-jna-keyboard-hook-networked
    desc: JVM low-level keyboard hook with network client
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::jna-low-level-keyboard-proc
    any:
      - id: micro-behaviors/communications/socket/create::jvm-socket-class-ref
      - id: micro-behaviors/communications/http/lib/urlconnection::jvm-http-urlconnection-class-ref
  # The same hook inside an HVNC client: keystrokes captured while the
  # operator drives a desktop the user cannot see.
  - id: jvm-hvnc-keyboard-hook
    desc: JVM HVNC client hooks every keystroke
    crit: hostile
    conf: 0.95
    scope: archive
    # Legs flattened rather than chaining the archive-scoped HVNC composite,
    # which resolves inconsistently when referenced from another scope.
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::jna-low-level-keyboard-proc
      - id: micro-behaviors/ui/window/station::jvm-create-desktop-name
      - id: micro-behaviors/ui/window/station::jvm-set-thread-desktop-name
    any:
      - id: micro-behaviors/hardware/display/screen::jvm-print-window-name
      - id: micro-behaviors/hardware/display/screen::jvm-getdibits-name
