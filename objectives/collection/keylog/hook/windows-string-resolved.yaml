# Windows keylogging intent composites
# ATT&CK: T1056.001 (Input Capture: Keylogging)
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: "T1056.001"
  mbc: "B0015"

composite_rules:
- id: windows-hook-keystroke-report-indicators
  desc: Keyboard and hook API names with a keystroke-log label
  # Native hook names also survive in CLR P/Invoke metadata. Their absence
  # from the native import table does not establish dynamic resolution. These
  # API names and a report label are useful keylogging indicators, but strings
  # alone do not establish that the program installs a hook or records input.
  # Require a recording label rather than clipboard APIs used by GUI apps.
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state-str
  - id: micro-behaviors/ui/window/hook::windows-hook-install
  - id: micro-behaviors/ui/window/hook::call-next-hook-ex-text
  - id: micro-behaviors/hardware/input/keyboard/label::keystroke-log-report-label
  unless:
  - id: well-known/tool/reverse-engineering/
  - id: well-known/tool/sysadmin/
  - id: metadata/lang/compiled::autohotkey-interpreter-message-table
  - id: well-known/lib/
  - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-remote-control-client-context
  # A .winmd declares hook and polling APIs as metadata signatures for a
  # whole SDK; it installs no hook and polls nothing.
  - id: metadata/build/generated::winmd-metadata
