# Windows keylogging intent composites
# ATT&CK: T1056.001 (Input Capture: Keylogging)
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: "T1056.001"
  mbc: "B0015"

composite_rules:
- id: string-resolved-hook-keylogger
  desc: Hook keylogger with dynamically resolved imports
  # Keyboard-state polling plus a windows hook install/chain pair, where every
  # API arrives as a bare string because the import table is hidden (packed or
  # dynamically resolved via GetProcAddress). Ordinary GUI plumbing imports
  # these APIs, so the *-str atoms (which fire only where the import does
  # not) keep protector-packed utilities and accessibility tools out.
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state-str
  - id: micro-behaviors/ui/window/hook::windows-hook-install
  - id: micro-behaviors/ui/window/hook::call-next-hook-ex-text
  - id: micro-behaviors/os/api-resolution/dynamic::get-proc-address-resolved-name
  any:
  - id: micro-behaviors/os/clipboard/read::get-clipboard-data-text
  - id: micro-behaviors/os/clipboard/write::set-clipboard-data-text
  needs: 1
  unless:
  - id: well-known/tool/reverse-engineering/
  - id: well-known/tool/sysadmin/
  - id: well-known/lib/
  - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-remote-control-client-context
