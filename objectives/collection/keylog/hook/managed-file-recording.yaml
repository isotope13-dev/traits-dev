defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1056.001

composite_rules:
  # Hook-based recorders use a distinct path from the GetAsyncKeyState
  # polling profile below: the managed callback labels keystrokes, appends
  # them to a file, and uses the low-level Windows hook chain.
  - id: managed-low-level-hook-file-keylogger
    desc: Managed low-level keyboard-hook keylogger that records to a file
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-low-level-keyboard-hook-const
      - id: micro-behaviors/ui/window/hook::windows-hook-chain-api-cluster
      - id: micro-behaviors/hardware/input/keyboard/label::keylog-word
      - id: micro-behaviors/fs/write/file/append::dotnet-appendalltext-token

  # Some recorders append each event directly to a file instead of using
  # a StringBuilder and KEYLOG: message records. Require independently
  # established file keylogging; hook declarations alone are insufficient.
  - id: managed-file-keylogger-with-hook
    desc: File-recording keylogger with low-level keyboard-hook APIs
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/collection/keylog/polling::managed-keylog-file-polling-profile
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-low-level-keyboard-hook-const
      - id: micro-behaviors/ui/window/hook::windows-hook-chain-api-cluster
