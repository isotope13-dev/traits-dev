# Low-level keyboard collection with file or foreground-window context.
# The class-name alternatives include general GUI windows, not only browsers.
defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust, go, source]
  attack: T1056.001
  mbc: B0015

composite_rules:
  - id: numeric-low-level-keyboard-hook-file-logger
    for: [c]
    desc: Native low-level keyboard hook writes captured input to a file
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-low-level-keyboard-hook-numeric-code
      - id: micro-behaviors/fs/write/file/handle::write-file-source
    near_bytes: 4096
  - id: numeric-low-level-keyboard-hook-hidden-file-logger
    for: [c]
    desc: Native keylogger hides its file output
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-low-level-keyboard-hook-numeric-code
      - id: micro-behaviors/fs/write/file/handle::write-file-source
      - id: micro-behaviors/fs/file/attributes::hidden-file-create-flag
    near_bytes: 4096
  - id: window-gated-low-level-keylogger
    for: [rust, c, csharp]
    desc: Window-targeted global low-level keyboard hook
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-low-level-keyboard-hook-const
      - id: micro-behaviors/ui/window/probe::gui-window-class-reference
      - id: micro-behaviors/ui/window/enumerate::get-foreground-window-source
      - id: micro-behaviors/ui/window/enumerate::get-window-text-source
    near_bytes: 4096
