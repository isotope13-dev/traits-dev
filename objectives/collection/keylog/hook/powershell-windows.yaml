defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1056.001
  mbc: E1056.001

traits:
  - id: ps-addtype-setwindowshookex
    desc: PowerShell compiles keyboard hook
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'Add-Type[\s\S]{0,900}SetWindowsHookEx'

  - id: ps-keylog-file-append
    desc: PowerShell appends captured keys
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'KBDLLHOOKSTRUCT[\s\S]{0,700}File\.AppendAllText'

  # A second, WinForms-based hook shape distinct from the SetWindowsHookEx
  # pattern above: binding a KeyPress event handler with no owning window
  # captures keystrokes application-wide rather than for one control. Also
  # matches the same string embedded as a `powershell -Command "..."`
  # argument inside a batch/VBS wrapper, which is how this shape is usually
  # smuggled in.
  - id: ps-registerobjectevent-keypress
    desc: PowerShell registers global KeyPress event hook
    crit: suspicious
    conf: 0.93
    for: [powershell, batch, vbs]
    if:
      type: text
      regex: 'Register-ObjectEvent[\s\S]{0,200}-EventName\s+KeyPress'

  - id: ps-eventargs-keychar-capture
    desc: PowerShell reads key char from event args
    crit: component
    conf: 0.85
    for: [powershell, batch, vbs]
    if:
      type: text
      regex: '\$EventArgs\.KeyChar\b'

composite_rules:
  - id: ps-inline-csharp-keylogger
    desc: PowerShell inline C# keylogger
    crit: hostile
    conf: 0.98
    all:
      - id: ps-addtype-setwindowshookex
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-low-level-keyboard-hook-const
      - id: ps-keylog-file-append

  - id: ps-winforms-keypress-keylogger-exfil
    desc: PowerShell WinForms keylogger exfiltrates keystrokes over HTTP
    crit: hostile
    conf: 0.97
    attack: T1056.001,T1041
    for: [powershell, batch, vbs]
    all:
      - id: ps-registerobjectevent-keypress
      - id: ps-eventargs-keychar-capture
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-upload
