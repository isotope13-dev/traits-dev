defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, c, cpp]
  mbc: B0015
  attack: T1056.001
  crit: suspicious

composite_rules:
- id: windows-keylogger
  desc: Windows keyboard capture API cluster
  crit: suspicious
  conf: 0.85
  platforms: [windows]
  for: [pe]
  all:
  - id: micro-behaviors/ui/window/hook::set-windows-hook
  any:
  - id: micro-behaviors/hardware/input/raw::windows-raw-input
  - id: micro-behaviors/hardware/input/keyboard/poll::polling-keylogger-api-cluster
  - id: micro-behaviors/hardware/input/keyboard/label::virtual-key-label-map
  unless:
  - id: metadata/file/naming::p-user-proxy-dll
  - id: well-known/lib/
  - id: metadata/signed/trust-level::signer-evidence-present
  - id: metadata/binary/vendor/
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: well-known/app/browser/internet-explorer/
- id: windows-keylogger-source
  desc: Windows keyboard hook with capture APIs
  crit: suspicious
  conf: 0.9
  platforms: [windows]
  for: [c, cpp]
  all:
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  any:
  - id: micro-behaviors/hardware/input/raw::windows-raw-input
  - id: micro-behaviors/hardware/input/keyboard/poll::polling-keylogger-api-cluster
  - id: micro-behaviors/hardware/input/keyboard/label::virtual-key-label-map
  unless:
  - id: well-known/lib/
