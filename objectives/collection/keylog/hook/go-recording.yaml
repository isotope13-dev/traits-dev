composite_rules:
- id: go-keyboard-hook-recording-profile
  desc: Go keylogger with keyboard hook and buffered recording
  crit: suspicious
  conf: 0.9
  unless:
  - id: well-known/dual-use/transfer/rclone::rclone-package-path
  all:
  - id: micro-behaviors/hardware/input/keyboard/label::keylogger-string
  - id: micro-behaviors/hardware/input/keyboard/hook::go-x86-keyboard-hook-profile
  - id: micro-behaviors/hardware/input/keyboard/layout::to-unicode-ex-str
  - id: metadata/binary/symbols/name::go-bufio-writestring-routine-name
  any:
  - id: micro-behaviors/communications/websocket/library::go-websocket-library
  - id: metadata/binary/symbols/name::go-os-exec-package-reference
  platforms:
  - windows
  for:
  - pe
  attack: T1056.001
