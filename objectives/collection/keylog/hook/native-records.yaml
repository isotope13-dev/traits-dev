defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: native-keyboard-hook-recording
    desc: Native keyboard hook with keystroke recording format
    crit: hostile
    conf: 0.97
    attack: T1056.001
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::x86-iat-low-level-keyboard-hook
      - id: micro-behaviors/hardware/input/keyboard/label::utf16-enter-key-line-record
      - id: micro-behaviors/hardware/input/keyboard/layout::to-unicode-str
      - id: micro-behaviors/ui/window/enumerate::get-foreground-window
      - id: micro-behaviors/fs/write/file/handle::write-file
