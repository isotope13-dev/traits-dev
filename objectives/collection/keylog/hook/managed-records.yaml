# Local key recording is collection even when network delivery is disabled.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: dotnet-hook-keylog-recording
    desc: Managed keyboard hook with buffered keylog records
    crit: hostile
    conf: 0.98
    attack: T1056.001
    all:
      - id: metadata/binary/symbols/name::dotnet-append-method-name
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-low-level-keyboard-hook-const
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/ui/window/hook::windows-hook-chain-api-cluster
      - id: micro-behaviors/hardware/input/keyboard/label::keylogger-string
    any:
      - id: micro-behaviors/hardware/input/keyboard/label::keylog-record-label
      - id: micro-behaviors/hardware/input/keyboard/label::recorded-special-key-label
    unless:
      - id: metadata/signed/platform/
      # A CLR header and nearby hook/log strings are not executable managed
      # code when the metadata root has no streams.
      - id: metadata/binary/header/malformed::dotnet-metadata-root-no-streams
