defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: managed-bank-page-keylogger
    desc: Bank-page digit recorder with keyboard hooks
    crit: hostile
    conf: 0.99
    attack: T1056.001
    all:
      - id: micro-behaviors/ui/window/probe::managed-bank-window-title-references
      - id: micro-behaviors/hardware/input/keyboard/listener::cil-digit-key-event-record
      - id: micro-behaviors/ui/window/hook::windows-hook-chain-api-cluster
