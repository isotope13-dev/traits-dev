# Game-thief / banker PEs that install a WH_KEYBOARD hook and also speak
# WinInet are not accessibility helpers: the hook harvests keystrokes while
# the HTTP client ships them.
#
# Wine's builtin DLLs (user32.dll, user.exe16, ...) are the Win32 API
# *implementation*: they export SetWindowsHookEx/CallNextHookEx/ToAscii and
# carry the whole hook vocabulary as a matter of course. The keyboard-hook
# composites below therefore exclude the Wine runtime identity.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1056.001,T1071.001
  crit: hostile
  conf: 0.94

composite_rules:
  - id: wininet-keyboard-hook-stealer
    desc: Keyboard hook exfiltrates over WinInet
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::call-next-hook-ex
      - id: micro-behaviors/communications/http/client/wininet::dynamic-wininet-api-set--internetopenurla
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: wininet-keyboard-hook-enum-windows
    desc: Keyboard hook enumerates windows for exfil
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::call-next-hook-ex
      - id: micro-behaviors/ui/window/enumerate::enum-windows
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/platform/wine/
  - id: keyboard-hook-create-thread
    desc: Keyboard hook starts from a new thread
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::call-next-hook-ex
      - id: micro-behaviors/process/create/thread::create-thread
    unless:
      - id: metadata/signed/platform/

  - id: runkey-async-key-taskmgr
    desc: Run-key implant polls keys and kills Taskmgr
    attack: T1056.001,T1547.001,T1112
    all:
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
      - id: micro-behaviors/os/registry/keys::disable-taskmgr
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: keyboard-hook-http-post
    desc: Keyboard hook posts harvested data over HTTP
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::call-next-hook-ex
      - id: micro-behaviors/communications/http/post::native-post-request-line
    unless:
      - id: metadata/signed/platform/
  - id: keyboard-hook-form-post
    desc: Keyboard hook posts form-urlencoded data
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::call-next-hook-ex
      - id: micro-behaviors/communications/http/post::form-urlencoded-post-template
    unless:
      - id: metadata/signed/platform/
  - id: keyboard-hook-winsock-client
    desc: Keyboard hook talks over a Winsock client
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::call-next-hook-ex
      - id: micro-behaviors/communications/socket/init::winsock-client-lifecycle
    unless:
      - id: metadata/signed/platform/
  - id: keyboard-hook-form-header
    desc: Keyboard hook builds a form-urlencoded POST
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::call-next-hook-ex
      - id: micro-behaviors/communications/http/post::form-urlencoded-header-pe
    unless:
      - id: metadata/signed/platform/
  - id: keyboard-hook-hidden-thread
    desc: Keyboard hook starts a hidden-window thread
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::call-next-hook-ex
      - id: micro-behaviors/process/create/flags::x86-create-no-window-immediate
    unless:
      - id: metadata/signed/platform/
  - id: keyboard-hook-openurl
    desc: Keyboard hook downloads via InternetOpenUrl
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::call-next-hook-ex
      - id: micro-behaviors/communications/http/client/wininet::internet-open-url
    unless:
      - id: metadata/signed/platform/
  - id: keyboard-hook-cleartext-url
    desc: Keyboard hook embeds a cleartext HTTP URL
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::call-next-hook-ex
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
    unless:
      - id: metadata/signed/platform/
  - id: dll-hook-wininet-openurl
    desc: Keyboard-hook DLL downloads via InternetOpenUrl
    all:
      - id: objectives/collection/keylog/hook::windows-dll-keyboard-hook-lifecycle
      - id: micro-behaviors/communications/http/client/wininet::internet-open-url
    unless:
      - id: metadata/signed/platform/
  - id: dll-hook-winsock-client
    desc: Keyboard-hook DLL talks over a Winsock client
    all:
      - id: objectives/collection/keylog/hook::windows-dll-keyboard-hook-lifecycle
      - id: micro-behaviors/communications/socket/init::winsock-client-lifecycle
    unless:
      - id: metadata/signed/platform/
  - id: dll-hook-cleartext-url
    desc: Keyboard-hook DLL embeds a cleartext HTTP URL
    all:
      - id: objectives/collection/keylog/hook::windows-dll-keyboard-hook-lifecycle
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
    unless:
      - id: metadata/signed/platform/
  - id: hook-export-wininet
    desc: HookOff export plus InternetOpenUrl downloader
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::hookoff-export-text
      - id: micro-behaviors/communications/http/client/wininet::internet-open-url
    unless:
      - id: metadata/signed/platform/
  # Switching onto another window station/desktop before installing a keyboard
  # hook is how implants capture logon and UAC desktops, not ordinary GUI input.
  - id: winsta-keyboard-hook-keystate
    desc: Window-station hook plus key-state capture
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::set-windows-hook
      - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state
      - id: micro-behaviors/ui/window/station::open-window-station
    unless:
      - id: metadata/signed/platform/
  - id: winsta-keyboard-hook-toascii
    desc: Window-station hook translates keystrokes
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::call-next-hook-ex
      - id: micro-behaviors/hardware/input/keyboard/layout::to-ascii-str
      - id: micro-behaviors/ui/window/station::open-window-station
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/platform/wine/
  - id: desktop-keyboard-hook-keystate
    desc: Alternate-desktop hook reads keyboard state
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::set-windows-hook
      - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state
      - id: micro-behaviors/ui/window/station::open-desktop-a
    unless:
      - id: metadata/signed/platform/
  - id: hook-keyboard-state
    desc: Keyboard hook also samples GetKeyboardState
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::set-windows-hook
      - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/platform/wine/

  - id: hook-to-ascii
    desc: Keyboard hook translates keys via ToAscii
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::set-windows-hook
      - id: micro-behaviors/hardware/input/keyboard/layout::to-ascii-str
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/platform/wine/
