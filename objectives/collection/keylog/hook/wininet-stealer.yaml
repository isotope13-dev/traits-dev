# Recording status supplies keylogging context. Hook and network APIs alone
# do not establish that captured keys are sent over that transport.
#
# Wine's builtin DLLs (user32.dll, user.exe16, ...) are the Win32 API
# *implementation*: they export SetWindowsHookEx/CallNextHookEx/ToAscii and
# carry the whole hook vocabulary as a matter of course. The keyboard-hook
# composites below therefore exclude the Wine runtime identity.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1056.001,T1071.001
  crit: hostile
  conf: 0.94

composite_rules:
- id: keyboard-hook-form-post
  desc: Recording keylogger with form POST template
  crit: suspicious
  all:
  - id: keylogger-recording-start-status
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/ui/window/hook::call-next-hook-ex
  - id: micro-behaviors/communications/http/post::form-urlencoded-post-template
  unless:
  - id: metadata/signed/platform/
- id: keyboard-hook-http-post
  desc: Recording keylogger with HTTP POST template
  crit: suspicious
  all:
  - id: keylogger-recording-start-status
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/ui/window/hook::call-next-hook-ex
  - id: micro-behaviors/communications/http/post::post-request-line
  unless:
  - id: metadata/signed/platform/
- id: wininet-keyboard-hook-enum-windows
  desc: Keylogger recording status with hook and WinInet APIs
  crit: suspicious
  all:
  - id: keylogger-recording-start-status
  - id: micro-behaviors/hardware/input/keyboard/label::keylogger-identity-label
  - id: micro-behaviors/ui/window/hook::call-next-hook-ex
  - id: micro-behaviors/ui/window/enumerate::enum-windows
  - id: micro-behaviors/communications/http/client/wininet::wininet-session-request-api-set
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/platform/wine/
- id: keyboard-hook-create-thread
  desc: Keylogger recording status with hook and thread-creation APIs
  crit: suspicious
  conf: 0.86
  all:
  - id: keylogger-recording-start-status
      # A generic Windows event hook may be WH_GETMESSAGE or a mouse hook.
      # CallNextHookEx plus a worker thread does not establish key capture.
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/ui/window/hook::call-next-hook-ex
  - id: micro-behaviors/process/create/thread::create-thread
  unless:
  - id: metadata/signed/platform/
      # Installer toolchains and installer binaries combine hook imports with
      # worker threads as a matter of course (Delphi VCL pulls the hook API
      # surface into every GUI installer); a keylogger claim needs more.
  - id: metadata/binary/installer/
      # signal-desktop-verified-context is an exception composite, so it never
      # suppressed this rule. The Electron host and chrome.dll both carry the
      # multi-marker runtime; that is the keyboard hook for the browser shell.
  - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
  - id: well-known/lib/native/pywin32::pywin32-module-basename
  - id: well-known/app/productivity/notepad-plus-plus/
  - id: well-known/tool/sysadmin/conemu/
  - id: well-known/lib/media/videolan/
      # Qt5Core and SDL install a hook from a worker thread for input dispatch.
  - id: keyboard-hook-toolkit-runtime
  - id: well-known/lib/platform/browser-automation/drivers/selenium::selenium-ie-driver-embedded-context

- id: keyboard-hook-winsock-client
  attack: T1056.001
  desc: Keylogger recording status with hook-chain and Winsock APIs
  all:
  - id: keylogger-recording-start-status
  - id: micro-behaviors/ui/window/hook::set-windows-hook
  - id: micro-behaviors/hardware/input/keyboard/label::keylogger-identity-label
  - id: micro-behaviors/ui/window/hook::call-next-hook-ex
  - id: micro-behaviors/communications/socket/connect::winsock-client-lifecycle
  any:
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/hardware/input/keyboard/hook::x64-zero-thread-keyboard-hook-call-setup
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/platform/mfc::mfc-runtime-basename
  - id: well-known/app/productivity/notepad-plus-plus/
  - id: well-known/lib/ui/sciter/
  - id: metadata/binary/debug::pdb-remcos-backdoor-tree
  - id: metadata/package/tooling::everything-binary
  - id: well-known/lib/platform/browser-automation/drivers/selenium::selenium-ie-driver-embedded-context
  - id: well-known/dual-use/remote-admin/tightvnc::tightvnc-viewer-verified-identity
      # Stripped FFmpeg player builds (ffplay.exe + fftools code paths) use
      # hooks for media-key handling and Winsock for streaming, not theft.
  - id: well-known/lib/media/ffmpeg::ffmpeg-player-binary-context
- id: keyboard-hook-form-header
  desc: Keyboard hook builds a form-urlencoded POST
  all:
  - id: micro-behaviors/ui/window/hook::call-next-hook-ex
  - id: "micro-behaviors/communications/http/header/content-type::form-urlencoded-header-pe"
  # A hook plus a POST header is only keylogging when keystroke-recording
  # evidence is present: hotkey handlers and analytics uploads carry the same
  # co-occurrence without capturing input.
  any:
  - id: micro-behaviors/hardware/input/keyboard/label::keylogger-string
  - id: micro-behaviors/hardware/input/keyboard/label::keylog-record-label
  unless:
  - id: well-known/lib/ui/cef::cef-browser-engine
  - id: metadata/signed/platform/
  - id: well-known/app/productivity/notepad-plus-plus::notepad-plus-plus-main-binary
  - id: well-known/app/productivity/notepad-plus-plus::notepad-plus-plus-gup-updater
- id: keyboard-hook-hidden-thread
  desc: Keyboard hook runs on a no-window thread
    # CREATE_NO_WINDOW is the immediate push 0x08000000, which appears all
    # over a large x86 image. The hook string has to sit with that push.
    # A keyboard hook type is required here: WH_CALLWNDPROC, WH_GETMESSAGE
    # and other message hooks are ordinary GUI plumbing, so CallNextHookEx
    # plus a worker thread does not establish key capture without one.
  near_bytes: 1048576
  all:
  - id: micro-behaviors/ui/window/hook::call-next-hook-ex
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/process/create/flags::x86-create-no-window-immediate
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/sysadmin/conemu/
  - id: metadata/package/tooling::cpuz-binary
  - id: well-known/tool/reverse-engineering/cff-explorer/
  - id: inno-setup-vcl-runtime
      # Trion uses the ordinary Windows hook/message APIs for its serial
      # terminal UI. The nearby no-window flag bytes are unrelated to a hidden
      # keylogging thread (the proximity window spans almost the whole image).
  - id: well-known/app/utility/trion::trion-application-context
  - id: keyboard-hook-winsock-client
  - id: well-known/tool/sysadmin/autohotkey/
  - id: well-known/lib/ui/qt/
- id: dll-hook-winsock-client
  desc: Keyboard-hook DLL talks over a Winsock client
  all:
  - id: objectives/collection/keylog/hook::global-keyboard-hook-ipc-capture
  - id: micro-behaviors/communications/socket/connect::winsock-client-lifecycle
  unless:
  - id: metadata/signed/platform/
- id: winsta-keyboard-hook-toascii
  desc: Window-station hook translates keystrokes
  all:
  - id: micro-behaviors/ui/window/hook::call-next-hook-ex
  - id: micro-behaviors/hardware/input/keyboard/layout::to-ascii-import
  - id: micro-behaviors/ui/window/station::open-window-station
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/platform/wine/
- id: digest-verified-signing-context
  desc: File digest matches its Authenticode signing evidence
  crit: exception
  conf: 0.96
    # The signature covers exactly these bytes (digest match) and signer
    # evidence is present. Concealment traits still fire on packed content
    # inside a signed binary; this context only quiets heuristics whose
    # claim is behavior the signed vendor binary performs openly.
  all:
  - id: metadata/signed/certificate/signature::pe-authenticode-digest-matches
  - id: metadata/signed/trust-level::signer-evidence-present
- id: keyboard-hook-toolkit-runtime
  desc: GUI toolkit keyboard dispatch thread
  crit: exception
  conf: 0.9
  any:
  - id: well-known/lib/media/sdl::sdl3-dll-basename
  - id: well-known/lib/ui/qt::qt5-core-binary
  - id: well-known/lib/ui/sciter::sciter-api-export
  - id: well-known/lib/ui/codejock::xtreme-toolkit-pro-runtime-component
  - id: well-known/lib/platform/mfc::mfc-runtime-basename
  # These recognized desktop runtimes and applications legitimately install
  # keyboard hooks while reading key state. Keep their identity evidence in a
  # reusable exception instead of making the detection fight a long allowlist.
  # Strong Wine and VideoLAN identities replace their former broad directory
  # suppressors so a lone weak marker cannot silence the keylogger signal.
- id: recognized-desktop-input-known-benign-context
  desc: Recognized desktop software with input-hook behavior
  crit: exception
  conf: 0.99
  any:
  - id: well-known/lib/platform/wine::wine-builtin-dll-marker
  - id: well-known/app/development/pyscripter::official-binary
  - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
  - id: well-known/lib/native/pywin32::pywin32-module-basename
  - id: well-known/app/productivity/notepad-plus-plus/
  - id: well-known/lib/media/videolan::videolan-codec-lib
  - id: well-known/lib/media/sdl::sdl3-dll-basename
  - id: well-known/game/playnite::reference-binary
  - id: well-known/lib/platform/mfc::mfc-runtime-basename
  - id: well-known/lib/runtime/native-platform/tcl-tk::signed-tcl-tk-product
  - id: well-known/tool/sysadmin/console::openconsole-basename
  # Inno Setup's Delphi VCL runtime (setup stub, IDE) installs thread-local
  # WH_GETMESSAGE/WH_MSGFILTER hooks on its own UI thread -- no WH_KEYBOARD or
  # WH_KEYBOARD_LL, so no other process's keystrokes reach it. The Inno Setup
  # identity directory names the setup stub (JR.Inno.Setup manifest) and the
  # IDE (product/manifest). Kept apart from recognized-desktop-input-known-benign-context
  # so the hidden-thread rule can use it without inheriting that list's weight;
  # the directory reference keeps it inside the suppression budget.
- id: inno-setup-vcl-runtime
  desc: Inno Setup runtime or IDE with VCL UI hooks
  crit: exception
  conf: 0.98
  any:
  - id: well-known/tool/packaging/inno-setup/
- id: hook-keyboard-state
  desc: Keylogger recording status with hook and keyboard-state APIs
  crit: suspicious
  conf: 0.9
  all:
  - id: keylogger-recording-start-status
  - id: micro-behaviors/ui/window/hook::set-windows-hook
      # GUI message hooks often coexist with ordinary keyboard-state reads;
      # require evidence that the installed hook is actually a keyboard hook.
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state
  unless:
  - id: metadata/signed/platform/
  - id: recognized-desktop-input-known-benign-context
  - id: metadata/package/tooling::cpuz-binary
  - id: metadata/package/tooling::everything-binary
  - id: metadata/package/tooling::lite-xl-binary
  - id: inno-setup-vcl-runtime
