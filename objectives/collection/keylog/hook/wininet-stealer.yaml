defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1056.001,T1071.001
  crit: hostile
  conf: 0.94
composite_rules:
- id: keyboard-hook-form-post
  desc: Recording keylogger with form POST template
  crit: suspicious
  all:
  - id: keylogger-recording-start-status
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/ui/window/hook::call-next-hook-ex
  - id: micro-behaviors/communications/http/post::form-urlencoded-post-template
- id: keyboard-hook-http-post
  desc: Recording keylogger with HTTP POST template
  crit: suspicious
  all:
  - id: keylogger-recording-start-status
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/ui/window/hook::call-next-hook-ex
  - id: micro-behaviors/communications/http/post::post-request-line
- id: wininet-keyboard-hook-enum-windows
  desc: Keylogger recording status with hook and WinInet APIs
  crit: suspicious
  all:
  - id: keylogger-recording-start-status
  - id: micro-behaviors/hardware/input/keyboard/label::keylogger-identity-label
  - id: micro-behaviors/ui/window/hook::call-next-hook-ex
  - id: micro-behaviors/ui/window/enumerate::enum-windows
  - id: micro-behaviors/communications/http/client/wininet::wininet-session-request-api-set
- id: keyboard-hook-create-thread
  desc: Keylogger recording status with hook and thread-creation APIs
  crit: suspicious
  conf: 0.86
  all:
  - id: keylogger-recording-start-status
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/ui/window/hook::call-next-hook-ex
  - id: micro-behaviors/process/thread/create::create-thread
- id: keyboard-hook-winsock-client
  attack: T1056.001
  desc: Keylogger recording status with hook-chain and Winsock APIs
  all:
  - id: keylogger-recording-start-status
  - id: micro-behaviors/ui/window/hook::set-windows-hook
  - id: micro-behaviors/hardware/input/keyboard/label::keylogger-identity-label
  - id: micro-behaviors/ui/window/hook::call-next-hook-ex
  - id: micro-behaviors/communications/socket/connect/attempt::winsock-client-lifecycle
  any:
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/hardware/input/keyboard/hook::x64-zero-thread-keyboard-hook-call-setup
- id: keyboard-hook-form-header
  desc: Keyboard hook builds a form-urlencoded POST
  all:
  - id: micro-behaviors/ui/window/hook::call-next-hook-ex
  - id: micro-behaviors/communications/http/header/content-type::form-urlencoded-header-pe
  any:
  - id: micro-behaviors/hardware/input/keyboard/label::keylogger-string
  - id: micro-behaviors/hardware/input/keyboard/label::keylog-record-label
  unless:
  - id: well-known/lib/ui/cef::cef-browser-engine
  - id: well-known/app/productivity/notepad-plus-plus::notepad-plus-plus-main-binary
  - id: well-known/app/productivity/notepad-plus-plus::notepad-plus-plus-gup-updater
- id: keyboard-hook-hidden-thread
  desc: Keyboard hook with no-window process creation
  crit: suspicious
  near_bytes: 1048576
  all:
  - id: micro-behaviors/ui/window/hook::call-next-hook-ex
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/process/config/launch::x86-create-no-window-immediate
- id: dll-hook-winsock-client
  desc: Keyboard-hook DLL talks over a Winsock client
  all:
  - id: objectives/collection/keylog/hook::global-keyboard-hook-ipc-capture
  - id: micro-behaviors/communications/socket/connect/attempt::winsock-client-lifecycle
- id: hook-keyboard-state
  desc: Keylogger recording status with hook and keyboard-state APIs
  crit: suspicious
  conf: 0.9
  all:
  - id: keylogger-recording-start-status
  - id: micro-behaviors/ui/window/hook::set-windows-hook
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state
