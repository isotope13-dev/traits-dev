defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-plugin-backdoor-keyboard-records
    desc: Plugin backdoor with keyboard-hook records
    crit: hostile
    conf: 0.97
    attack: T1056.001
    all:
      - id: micro-behaviors/ui/window/hook::windows-hook-chain-api-cluster
      - id: micro-behaviors/hardware/input/keyboard/layout::to-unicode-ex-str
      - id: micro-behaviors/hardware/input/keyboard/label::capslock-state-record
    # Older plugin implants use encrypted delimited tasks rather than
    # MessagePack; their keyboard callbacks still record translated keys.
    any:
      - id: objectives/command-and-control/backdoor/dispatch/module::messagepack-managed-plugin-tasking
      - id: objectives/command-and-control/backdoor/dispatch/module::managed-plugin-tasking-backdoor
