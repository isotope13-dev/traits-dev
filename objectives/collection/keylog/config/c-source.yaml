defaults:
  for: [c, cpp]
  platforms: [windows, unix]
  attack: T1056.001

traits:
  - id: auto-keylog-macro
    desc: Enables automatic keylogging via macro
    crit: suspicious
    if:
      type: text
      regex: '#define[ \t]+AUTO_KEYLOG\b'

  - id: no-keylog-toggle
    desc: Declares keylogger compile toggle
    crit: notable
    if:
      type: text
      regex: '#define[ \t]+NO_KEYLOG\b'
