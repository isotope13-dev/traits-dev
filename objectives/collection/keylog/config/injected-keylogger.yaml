defaults:
  for: [json]
  platforms: [windows]
  attack: T1056.001

traits:
  - id: keylogger-dump-interval-field
    desc: Declares keylog dump interval field
    crit: notable
    if:
      type: value
      path: keylogger_dump_mins
      exists: true

  - id: keylogger-injector-type
    desc: Declares keylogger injector type
    crit: notable
    if:
      type: value
      path: injector[*].type
      exact: keylogger

composite_rules:
  - id: scheduled-keylogger-injection-config
    desc: Configures keylogger injection and dumps
    crit: hostile
    conf: 0.98
    all:
      - id: keylogger-dump-interval-field
      - id: keylogger-injector-type
