defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
  attack: T1056.001
composite_rules:
- id: powershell-etw-usb-keystroke-capture
  desc: PowerShell starts ETW USB keylogging and drains captured keys
  crit: hostile
  all:
  - id: well-known/tool/offensive/etwkeylogger::usb-event-source-class
  - id: micro-behaviors/hardware/input/keyboard/listener::keylog-start-method-call
  - id: micro-behaviors/hardware/input/keyboard/listener::powershell-keypress-queue-dequeue
