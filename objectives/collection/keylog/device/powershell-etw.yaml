defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
  attack: T1056.001
traits:
- id: keylog-start-method
  desc: Invokes a keylogger start method
  if:
    type: text
    regex: (?i)\.startkeyLog\s*\(
- id: keypress-queue-dequeue
  desc: Consumes the captured keypress queue
  if:
    type: text
    regex: (?i)\.keysPressed\.Dequeue\s*\(
composite_rules:
- id: powershell-etw-usb-keystroke-capture
  desc: PowerShell starts ETW USB keylogging and drains captured keys
  crit: hostile
  all:
  - id: well-known/tool/offensive/etwkeylogger::usb-event-source-class
  - id: keylog-start-method
  - id: keypress-queue-dequeue
