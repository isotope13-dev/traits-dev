# Keystroke capture through a keyboard device node.
#
# The bare /dev/kbd path is NOT kept here: legitimate keyboard backends
# (SDL2's FreeBSD/Solaris console driver, X11, kbdcontrol) reference it too, so
# it lives as a neutral capability at
# micro-behaviors/fs/path/device/special::dev-kbd-path and is composed below
# with read-side evidence. The hex representation also belongs with the path;
# its encoding alone does not establish why the program includes it.
defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]
  attack: T1056.001

composite_rules:
  - id: native-dev-kbd-keylogger
    for: [elf, c]
    desc: Native /dev/kbd keylogger
    crit: suspicious
    conf: 0.98
    # Capture reads the keyboard node it just opened, so the path and the read
    # sit together. Requiring proximity keeps a driver that merely names the
    # device in one place (SDL2 opens /dev/kbd write-only to release the
    # console) from pairing with an unrelated read elsewhere in the file.
    near_lines: 40
    all:
      - id: micro-behaviors/fs/path/device/special::dev-kbd-path
      - id: micro-behaviors/fs/read/file/descriptor::read

  - id: native-hex-dev-kbd-keylogger
    desc: Hex /dev/kbd keylogger
    crit: hostile
    conf: 0.98
    for: [c, cpp, objc]
    all:
      - id: micro-behaviors/fs/path/device/special::native-hex-dev-kbd-path
      - id: micro-behaviors/fs/file/open::open-o-nonblock-source
