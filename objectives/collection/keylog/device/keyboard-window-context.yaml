defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: captured-key-window-timestamp-record
  desc: Key-record window and timestamp fields
  if:
    type: literal
    substr: '[=== $LastWindowTitle - $TimeStamp ===]'
composite_rules:
- id: powershell-keystroke-window-attribution
  desc: Tags captured keys with window and time
  crit: hostile
  all:
  - id: captured-key-window-timestamp-record
  - id: objectives/collection/keylog/device::powershell-etw-usb-keystroke-capture
  - id: micro-behaviors/ui/window/enumerate::get-foreground-window-source
