# An editor extension that scans workspace documents for address patterns and
# copies the collected set to the clipboard is a local data-harvest workflow.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1114,T1115

composite_rules:
  - id: vscode-workspace-email-harvester
    desc: Extension harvests workspace email addresses
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - type: trait
        id: well-known/lib/development/vscode::workspace-folders
      - type: trait
        id: metadata/permission/workspace::openTextDocument
      - type: trait
        id: metadata/permission/workspace::workspace-findFiles
      - type: trait
        id: metadata/permission/clipboard::clipboard-write
      - type: trait
        id: micro-behaviors/os/clipboard/write::email-list-clipboard-write
    any:
      - type: trait
        id: micro-behaviors/communications/email/address::email-address-text
      - type: trait
        id: micro-behaviors/communications/email/address::email-regex-structure
