# An editor extension that scans workspace documents for address patterns and
# copies the collected set to the clipboard is a local data-harvest workflow.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1114,T1115

traits:
  - id: vscode-email-regex-localpart
    desc: Regex contains an email local-part pattern
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\]\+\(\?:'

  - id: vscode-email-regex-domain
    desc: Regex contains an email domain pattern
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '@\(\?:'

  - id: vscode-email-regex-literal
    desc: Text contains a literal email pattern
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '[A-Za-z0-9._%+\-]{1,64}@[A-Za-z0-9.-]{1,96}\.[A-Za-z]{2,24}'

  - id: vscode-email-clipboard-output
    desc: Extension copies extracted emails
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?is)(uniqueEmails|allEmails|emailList).{0,260}(clipboard\.writeText|writeText\s*\()'

composite_rules:
  - id: vscode-workspace-email-harvester
    desc: Extension harvests workspace email addresses
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: metadata/library/vscode::workspace-folders
      - id: metadata/permission/workspace::openTextDocument
      - id: metadata/permission/workspace::workspace-findFiles
      - id: metadata/permission/clipboard::clipboard-write
      - id: vscode-email-regex-localpart
      - id: vscode-email-regex-domain
      - id: vscode-email-clipboard-output
