defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1114
composite_rules:
  - id: webmail-mailbox-harvest
    desc: Authenticated webmail mailbox harvesting
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/email/access/webmail::webmail-list-action-reference
      - id: micro-behaviors/communications/email/access/webmail::webmail-message-action-reference
    any:
      - id: micro-behaviors/data/parse/regex::uid-regex-matching
      - id: micro-behaviors/communications/http/url/build::same-origin-mail-url-build
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
