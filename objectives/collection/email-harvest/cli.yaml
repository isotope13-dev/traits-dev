# Authenticated command-line mailbox reads.  The combination of an IMAP/SMTP
# URL, explicit credentials, and a folder-selection command is materially
# different from a generic curl download and covers mailbox-collection plugins
# that delegate protocol handling to a system utility.
defaults:
  platforms: [unix, windows]
  for: [batch, powershell, shell]
  attack: T1114.002

traits:
  - id: imap-cli-url
    desc: Command-line IMAP URL
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: imap://
  - id: imap-cli-auth
    desc: IMAP URL with command-line user
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(imap://[^\r\n]{0,180}--user\s+\S+|--user\s+\S+[^\r\n]{0,180}imap://)'
  - id: imap-cli-folder-select
    desc: Command-line IMAP folder-selection command
    crit: notable
    conf: 0.9
    if:
      type: text
      # SELECT/EXAMINE is common in unrelated SQL and UI text.  Require the
      # protocol marker on the same command line before treating it as IMAP.
      regex: '(?i)\bimap://.{0,180}\b(SELECT|EXAMINE)\b|\b(SELECT|EXAMINE)\b.{0,180}\bimap://'
    unless:
      - id: metadata/file/string/identity::microsoft-activation-script-benign-context

composite_rules:
  - id: authenticated-imap-folder-read
    desc: Authenticated command-line mailbox read
    crit: suspicious
    conf: 0.91
    all:
      - id: imap-cli-url
      - id: imap-cli-auth
      - id: imap-cli-folder-select
    near_bytes: 256
