defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]
  attack: T1114

composite_rules:
  - id: native-email-harvest
    desc: Native email harvest
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/email/address::email-address-predicate-reference
    needs: 2
    any:
      - id: micro-behaviors/fs/path/personal::mailstore-path-set
      - id: micro-behaviors/fs/path/personal::mail-client-profile-or-config-path
      - id: micro-behaviors/communications/http/url/telemetry::collect-path
