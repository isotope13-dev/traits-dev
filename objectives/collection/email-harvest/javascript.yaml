defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1114
  mbc: E1114

composite_rules:
  - id: provider-email-harvest
    desc: Automates multi-provider email-address harvesting
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/email/address::provider-email-extractor-entrypoint
      - id: micro-behaviors/data/source/language::provider-label-table-identifier
      - id: micro-behaviors/communications/email/auth::provider-api-key-templates
      - id: micro-behaviors/communications/email/address::email-result-writer-reference

  - id: obfuscated-provider-email-harvester
    desc: Obfuscated multi-provider email harvester with persisted results
    crit: hostile
    conf: 0.98
    all:
      - id: provider-email-harvest
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::full-obfuscator-io-toolkit
