defaults:
  platforms: [windows]
  for: [vbs]
traits:
  - id: dbx-mail-harvest-vb6
    desc: Harvests addresses from DBX
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: ElseIf U83A9FuI = "dbx" Then
  - id: harvested-address-buffer-vb6
    desc: Accumulates harvested email list
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: jwJUsdKW = jwJUsdKW &
composite_rules:
  - id: filesystem-email-harvest-vb6
    desc: Harvests email from local files
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/enumerate/drives::vb6-drive-enumeration
      - id: harvested-address-buffer-vb6
    any:
      - id: micro-behaviors/communications/email/address::vb6-mailto-prefix-reference
      - id: dbx-mail-harvest-vb6
