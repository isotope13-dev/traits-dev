# A mailbox copier built entirely out of documented Exchange Web Services APIs.
#
# Enumerate every folder, enumerate every item in them, pull each message's raw
# MIME and write it out — driven by the logged-on user's own credentials, so
# nothing has to be stolen or prompted for first and the traffic is
# indistinguishable from the user's mail client.
#
# There is no obfuscation and no exploit here, which is the point: a scanner
# looking for either sees a small, clean .NET console app. What convicts is the
# shape — a program with no interface whose entire behaviour is "walk the whole
# mailbox and serialise it to disk". Backup and migration products do this too,
# and they say so, in a signed binary from a real vendor; the exclusions keep
# that case out.
#
# The ambient-credential leg is load-bearing, not decorative: the same four
# EWS capabilities appear in legitimate mail integrations (ERP archiving,
# migration agents) that authenticate with explicitly configured service
# credentials — an OAuth app or service account the tenant administrator
# consented to — and process only configured folders. Without ambient
# credentials the tool cannot be dropped on a workstation to silently walk
# the logged-on user's mailbox; it is a mail client, not a harvester. An
# unsigned line-of-business addon doing configured, UI-driven archiving
# matches the four API legs but supplies its own credentials, so it must
# not match this claim.
#
# Written from the EWS API surface rather than from any one tool's identifiers,
# so a reimplementation under another name still matches.
defaults:
  crit: hostile
  platforms: [windows]
  for: [csharp, pe, dll]
  attack: T1114.002
  mbc: E1114

composite_rules:
  - id: ews-mailbox-content-collection
    desc: "Enumerates mailbox folders and message content"
    conf: 0.96
    all:
      - id: micro-behaviors/communications/email/access/exchange::exchange-web-services-client
      - id: micro-behaviors/communications/email/access/exchange::exchange-folder-tree-enumeration
      - id: micro-behaviors/communications/email/access/exchange::exchange-item-enumeration
      - id: micro-behaviors/communications/email/access/exchange::exchange-mime-content-read
      - id: micro-behaviors/communications/http/auth::dotnet-default-network-credentials
    unless:
      - id: metadata/signed/platform/
      - id: metadata/package/testing/

  # The same ambient-credential collection trusting any TLS certificate the
  # endpoint presents. Together these are what let the tool be dropped on a
  # workstation and pointed at an arbitrary Exchange host: no credential to
  # supply, and no certificate to match.
      - id: "metadata/file/naming::test-directory-component"
  - id: ews-ambient-credential-mailbox-collection
    desc: "Mailbox reads, ambient credentials, TLS callback"
    conf: 0.95
    all:
      - id: ews-mailbox-content-collection
      - id: micro-behaviors/communications/tls/verify/callback::certificate-validation-callback-setter
