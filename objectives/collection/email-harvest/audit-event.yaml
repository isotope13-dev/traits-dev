# Exchange audit-log shapes associated with automated mailbox collection.
# The individual fields are neutral log facts; the suspicious composites
# require the unusual client and successful message-content access together.
defaults:
  platforms: [unix, windows]
  for: [json, text]
  attack: T1114.002

traits:
  - id: mailitems-accessed-operation
    desc: Exchange MailItemsAccessed audit operation
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)["'']Operation["'']\s*:\s*["'']MailItemsAccessed["'']'

  - id: mailitems-access-bind
    desc: Exchange message Bind access type
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)["'']Name["'']\s*:\s*["'']MailAccessType["'']\s*,\s*["'']Value["'']\s*:\s*["'']Bind["'']'

  - id: mailitems-access-api-id
    desc: Mail access API identifier field
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)["'']APIId["'']\s*:\s*["''][0-9a-f-]{36}["'']'

  - id: mailitems-access-api-id-property
    desc: Mail access API operation property
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)"Name"\s*:\s*"APIId".{0,24}"Value"\s*:\s*"[0-9a-f-]{36}"'

  - id: mailitems-access-client-app-id
    desc: Mail access client application field
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)["'']ClientAppId["'']\s*:\s*["''][0-9a-f-]{36}["'']'

  - id: mailitems-access-client-app-id-property
    desc: Mail access client operation property
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)"Name"\s*:\s*"ClientAppId".{0,24}"Value"\s*:\s*"[0-9a-f-]{36}"'

  - id: mailitems-access-exfil-api-id
    desc: Reported mail-harvest API identifier
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: c999ed3e-27ae-4cb3-b3a2-46b056af63d3

  # This GUID is a first-party Microsoft application id, not an attacker-owned
  # one: the campaign report names it because the operator rode a stolen OAuth
  # token for that app. So it means nothing on its own -- it appears verbatim in
  # every first-party allowlist (Elastic's own "M365 Exchange Mailbox Accessed by
  # Unusual Client" detection rule excludes it by name), and a bare-substring
  # match at `suspicious` mislabels those catalogs. Anchored to the audit-log
  # field that actually carries a ClientAppId, and left as one leg of the
  # `mailitems-access-exfil-toolkit` pair signature.
  - id: mailitems-access-exfil-client-app-id
    desc: Mail access by reported campaign GUID
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)ClientAppId[^\n]{0,24}9199bf20-a13f-4107-85dc-02114787ef48'

  - id: mailitems-access-rest-firefox
    desc: Mail access uses REST and Firefox
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)["'']ActorInfoString["'']\s*:\s*["''].{0,240}Client=REST;.{0,240}Firefox/[0-9.]+'

composite_rules:
  - id: mailitems-access-rest-firefox-anomaly
    desc: Mail access through REST Firefox
    crit: suspicious
    conf: 0.98
    attack: T1114.002,T1078
    all:
      - id: mailitems-accessed-operation
      - id: mailitems-access-bind
      - id: mailitems-access-rest-firefox
    near_bytes: 1800

  - id: mailitems-access-application-api
    desc: Mail Bind includes app and API IDs
    crit: suspicious
    conf: 0.96
    all:
      - id: mailitems-accessed-operation
      - id: mailitems-access-bind
      - id: mailitems-access-api-id-field
      - id: mailitems-access-client-app-id-field
    near_bytes: 1800

  - id: mailitems-access-api-id-field
    desc: Mail Bind includes an API identifier
    crit: notable
    conf: 0.93
    any:
      - id: mailitems-access-api-id
      - id: mailitems-access-api-id-property

  - id: mailitems-access-client-app-id-field
    desc: Mail Bind includes a client identifier
    crit: notable
    conf: 0.93
    any:
      - id: mailitems-access-client-app-id
      - id: mailitems-access-client-app-id-property

  - id: mailitems-access-exfil-toolkit
    desc: Exchange message harvesting uses the reported client and API identifier pair
    crit: hostile
    conf: 0.99
    all:
      - id: mailitems-accessed-operation
      - id: mailitems-access-bind
      - id: mailitems-access-exfil-api-id
      - id: mailitems-access-exfil-client-app-id
    near_bytes: 1800
