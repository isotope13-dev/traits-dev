# Reconstructed from AA26-281A: EWS collection, hidden ZIP staging.
# Co-occurrence supports suspicion; no source-to-archive binding is asserted.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: suspicious
  conf: 0.9
  attack: T1114.002,T1074.001
composite_rules:
  - id: php-ews-hidden-archive-staging
    desc: EWS reads with hidden ZIP creation and in-memory archive members
    all:
      - id: micro-behaviors/communications/email/access/exchange::ews-soap-mailbox-read
      - id: micro-behaviors/communications/http/curl::php-curl-request
      - id: micro-behaviors/fs/path/archive::hidden-archive-path
      - id: micro-behaviors/data/archive/create/zip::php-ziparchive-create
      - id: micro-behaviors/data/archive/create/zip::php-ziparchive-add-from-string
