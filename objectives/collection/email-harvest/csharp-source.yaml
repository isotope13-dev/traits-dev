defaults:
  platforms: [windows]
  for: [csharp]
traits:
  - id: obfuscated-html-glob
    desc: Obfuscated HTML file glob
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: "modem(\"(,jv(\")"
  - id: obfuscated-mailto-index
    desc: Obfuscated mailto index lookup
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'IndexOf\s*\(\s*\w+\.\w+\("ocknvm8"\)'
composite_rules:
  - id: internet-cache-mailto-harvest
    desc: Harvests email from cached HTML
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/cache::internet-cache-folder
      - id: micro-behaviors/data/decode/url::url-decoded-email-normalization
    any:
      - id: obfuscated-html-glob
      - id: obfuscated-mailto-index
