# Silent contact enrollment by WordPress plugins. The version callback proves
# that subscription runs as update plumbing rather than from an opt-in form;
# the two option reads identify the store contacts being gathered.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1114

traits:
  - id: version-callback-invokes-subscription
    desc: Version callback invokes subscription
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?is)function\s+\w*version\w*\s*\(.{0,600}\b\w*subscription\s*\('

composite_rules:
  - id: wordpress-contact-auto-enrollment
    desc: WordPress update silently enrolls store contacts
    crit: hostile
    conf: 0.98
    all:
      - id: version-callback-invokes-subscription
      - id: micro-behaviors/communications/email/address::wordpress-admin-email-option
      - id: micro-behaviors/communications/email/address::woocommerce-order-recipient-option
      - id: micro-behaviors/communications/http/url/path::email-subscription-endpoint
    scope: archive
