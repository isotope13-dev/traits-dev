# Microsoft Graph mailbox reconnaissance after token capture.  The path set
# is intentionally provider-specific because these are the concrete resource
# operations used to profile a compromised mailbox and its organization.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  attack: T1114,T1087,T1082

composite_rules:
  - id: microsoft-graph-token-backed-mailbox-recon
    desc: Token-backed Graph mailbox reconnaissance
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-account-recon-path-set
      - id: micro-behaviors/communications/http/oauth::microsoft-graph
    any:
      - id: micro-behaviors/communications/http/oauth::refresh-token
      - id: micro-behaviors/communications/http/auth::refresh-token-camel-field
    near_bytes: 8192
