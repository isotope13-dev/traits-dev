# Microsoft Graph mailbox reconnaissance after token capture.  The path set
# is intentionally provider-specific because these are the concrete resource
# operations used to profile a compromised mailbox and its organization.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  attack: T1114,T1087,T1082

composite_rules:
  # A credential-add operation followed by cross-user mailbox access is the
  # concrete Entra application takeover chain. Requiring the service-principal,
  # directory-role, and application-registration resources distinguishes it
  # from routine secret rotation in a single-purpose application.
  - id: entra-app-credential-mailbox-takeover
    desc: Adds Entra app secret then reads another mailbox
    crit: hostile
    conf: 0.99
    attack: T1098.001,T1114.002,T1087.004
    for: [scripts, binaries]
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-application-credential-add-path
      - id: micro-behaviors/communications/http/services/microsoft::graph-target-user-mailbox-token
      - id: micro-behaviors/communications/http/services/microsoft::graph-service-principals-path
      - id: micro-behaviors/communications/http/services/microsoft::graph-directory-roles-path
      - id: micro-behaviors/communications/http/services/microsoft::graph-applications-path
    near_bytes: 8192

  - id: graph-finance-personnel-mailbox-access
    desc: Graph mailbox access after finance-user search
    crit: hostile
    conf: 0.995
    for: [scripts, json, text]
    attack: T1114.002,T1087.004
    all:
      - id: objectives/discovery/cloud/directory::entra-finance-personnel-enumeration
      - id: micro-behaviors/communications/http/services/microsoft::graph-target-user-mailbox-path
    near_bytes: 8192

  - id: graph-finance-personnel-mailbox-collection
    desc: Graph harvests mailboxes after payroll and finance personnel reconnaissance
    crit: hostile
    conf: 0.995
    attack: T1114.002,T1087.004
    all:
      - id: objectives/discovery/cloud/directory::entra-finance-personnel-enumeration
      - id: micro-behaviors/communications/http/services/microsoft::graph-user-directory-skiptoken
      - id: micro-behaviors/communications/http/services/microsoft::graph-target-user-mailbox-path
      - id: micro-behaviors/communications/http/oauth::microsoft-graph-mail-api
    near_bytes: 8192

  - id: microsoft-graph-token-backed-mailbox-recon
    desc: Token-backed Graph mailbox reconnaissance
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-account-recon-path-set
      - id: micro-behaviors/communications/http/oauth::microsoft-graph
    any:
      - id: micro-behaviors/communications/http/oauth::refresh-token
      - id: micro-behaviors/communications/http/auth::refresh-token-camel-field
    near_bytes: 8192

  # Identity-plane pivot: after mapping the tenant's permission surface, a
  # non-human identity reaches into *other* users' mailboxes and drives
  # (`/users/{id}/...`, not `/me/`) to harvest at scale — the report's stage 4.
  # Directory enumeration + cross-identity mailbox access is the attack shape;
  # neither an eDiscovery tool (no directory-role recon) nor a self-service app
  # (`/me/` only) trips both legs.
  - id: entra-identity-plane-mailbox-pivot
    desc: App reads other users' mailboxes after directory recon
    crit: hostile
    conf: 0.95
    attack: T1114.002,T1087.004
    all:
      - id: objectives/discovery/cloud/directory::entra-directory-enumeration
      - id: micro-behaviors/communications/http/services/microsoft::graph-target-user-mailbox-path
    scope: leaf
