defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1119
composite_rules:
- id: telemetry-persistent-id-field-cluster
  desc: Persistent telemetry ID field cluster
  crit: component
  conf: 0.9
  needs: 2
  any:
  - id: metadata/file/string/telemetry::session-id-field-js
  - id: micro-behaviors/data/property/access::device-id-identifier-reference
  - id: micro-behaviors/os/telemetry/activity::telemetry-identifier-reference
- id: posthog-user-identity-telemetry
  desc: PostHog user identity telemetry fields
  crit: notable
  conf: 0.94
  all:
  - id: well-known/lib/data/posthog::posthog-telemetry-client
  - id: metadata/file/string/telemetry::telemetry-user-identity-fields
  any:
  - id: metadata/file/string/account::email-label-vocabulary
  - id: telemetry-persistent-id-field-cluster
- id: stored-profile-telemetry
  desc: Telemetry profile stored locally
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/fs/path/reference::telemetry-json-path-reference
  any:
  - id: micro-behaviors/os/telemetry/logging/analytics::telemetry-store-routine-label
  - id: metadata/file/string/telemetry::telemetry-user-identity-fields
  - id: telemetry-persistent-id-field-cluster
# A vendor analytics SDK, a stored profile file and an `extension_uninstalled`
# event is the shape PostHog and Segment document for uninstall analytics, and
# a large share of published extensions ship exactly it. That is a behaviour a
# reviewer wants surfaced, but it is not "rarely legitimate", so it reports at
# notable. The privacy escalation -- shipping the machine's hostname and login
# name along with the event -- stays suspicious in the rule below.
- id: uninstall-profile-telemetry
  desc: Uninstall sends telemetry profile
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/communications/http/services/analytics::posthog-host-reference
  - id: micro-behaviors/fs/path/reference::telemetry-json-path-reference
  - id: micro-behaviors/os/telemetry/logging/event::uninstall-telemetry-event
  any:
  - id: telemetry-persistent-id-field-cluster
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
- id: host-user-uninstall-telemetry-id
  desc: Uninstall telemetry includes host user ID
  crit: suspicious
  conf: 0.95
  all:
  - id: uninstall-profile-telemetry
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
  unless:
  - id: micro-behaviors/communications/http/services/analytics::posthog-host-reference
