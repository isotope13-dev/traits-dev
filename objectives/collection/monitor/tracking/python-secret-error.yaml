defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
  - id: secret-rpc-error-derived-visitor-identity
    desc: Secret-store request errors supply a tracking identity
    crit: suspicious
    conf: 0.98
    near_lines: 45
    all:
      - id: micro-behaviors/data/parse/regex::python-response-error-derived-visitor-id
      - id: micro-behaviors/communications/http/post::kaggle-api-key-secret-request-context
      - id: micro-behaviors/communications/rpc::secret-read-rpc-session-token-context


  - id: notebook-secret-error-fingerprint-tracking
    desc: Notebook fingerprinting also derives identity from secret-store errors
    crit: suspicious
    conf: 0.97
    all:
      - id: secret-rpc-error-derived-visitor-identity
      - id: micro-behaviors/os/sysinfo/profile::notebook-browser-host-identity-context
