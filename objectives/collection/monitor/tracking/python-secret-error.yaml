defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
  # This flow extracts an account identifier from an error, not a secret
  # value. Complete source review and synthetic success/error replays show
  # it is SDK tracking behavior. Keep the observations without treating
  # two overlapping identity profiles as independent suspicious signals.
  - id: secret-rpc-error-derived-visitor-identity
    desc: Secret-store errors supply a visitor identity
    crit: notable
    conf: 0.98
    near_lines: 45
    all:
      - id: micro-behaviors/data/parse/regex::python-response-error-derived-visitor-id
      - id: micro-behaviors/communications/http/post::kaggle-api-key-secret-request-context
      - id: micro-behaviors/communications/rpc::secret-read-rpc-session-token-context


  - id: notebook-secret-error-fingerprint-tracking
    desc: Notebook fingerprint with error-derived identity
    crit: notable
    conf: 0.97
    all:
      - id: secret-rpc-error-derived-visitor-identity
      - id: micro-behaviors/os/sysinfo/profile::notebook-browser-host-identity-context
