defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
  - id: canarytokens-execution-tracking
    desc: Python reports execution through CanaryTokens callback
    crit: hostile
    conf: 0.97
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/url/endpoint::canarytokens-traffic-path
      - id: micro-behaviors/communications/http/request/client::urllib3-explicit-method-request
