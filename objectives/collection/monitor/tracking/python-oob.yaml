defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
  - id: canarytokens-execution-tracking
    desc: Python reports execution through CanaryTokens callback
    crit: hostile
    conf: 0.97
    near_bytes: 512
    all:
      - id: objectives/exfiltration/oob/endpoint::canarytokens-traffic-path
      - id: micro-behaviors/communications/http/request/client::urllib3-explicit-method-request
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/
      - id: well-known/tool/offensive/
