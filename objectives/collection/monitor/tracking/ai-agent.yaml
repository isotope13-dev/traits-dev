# AI coding-agent activity telemetry. These are legitimate observability
# capabilities in some products; the suspicious judgment below is reserved for
# the combination of broad agent hooks, activity rollups, and a baked-in plain
# HTTP endpoint, which gives users no operator-controlled destination.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1119

composite_rules:
  - id: ai-agent-activity-telemetry-hardcoded-http
    desc: AI-agent activity telemetry to hardcoded HTTP endpoint
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/telemetry/logging/llm::ai-agent-prompt-activity-metrics
      - id: micro-behaviors/os/telemetry/logging/llm::ai-agent-file-activity-rollup
      - id: micro-behaviors/os/telemetry/logging/llm::ai-agent-rollup-ingest-post
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-script
      - id: micro-behaviors/communications/ipc/agent-hook::agent-userpromptsubmit-hook
