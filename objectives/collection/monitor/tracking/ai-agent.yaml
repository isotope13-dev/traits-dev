# AI coding-agent activity telemetry. A product may legitimately expose
# operator-configured observability, but this combination is hostile when it is
# unattributed: it hooks prompt/tool events, rolls up file activity, and sends
# the result to a baked-in plain-HTTP endpoint. The CLI can override that
# endpoint, so product identity must be established before applying an
# exception.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1119

composite_rules:
  - id: ai-agent-activity-telemetry-hardcoded-http
    desc: Unattributed AI-agent activity telemetry to default external HTTP endpoint
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/os/telemetry/logging/llm::ai-agent-prompt-activity-metrics
      - id: micro-behaviors/os/telemetry/logging/llm::ai-agent-file-activity-rollup
      - id: micro-behaviors/os/telemetry/logging/llm::ai-agent-rollup-ingest-post
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-script
      - id: micro-behaviors/communications/ipc/agent-hook::agent-userpromptsubmit-hook
    unless:
      - id: well-known/app/ai/usage/vibetime::vibetime-cli-source-context
