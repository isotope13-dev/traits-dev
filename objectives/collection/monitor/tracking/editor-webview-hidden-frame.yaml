# An editor extension's webview page that loads a remote document in an
# iframe every stylesheet rule collapses to zero size. Webviews are the
# extension's own UI; a frame nobody can see serves no interface purpose and
# reports each panel open from the developer's machine to a third-party host.
# Marketplace telemetry goes through the extension host, not an invisible
# frame. All legs are atoms so the archive scope can join the extension
# manifest to the bundled page.
defaults:
  platforms: [unix, windows]
  for: [vsix, zip, html, package.json]
  attack: T1564,T1041
composite_rules:
  - id: editor-extension-hidden-remote-frame
    desc: Editor extension webview loads a hidden remote tracking frame
    crit: hostile
    conf: 0.9
    scope: archive
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: micro-behaviors/ui/window/style::iframe-element-zero-size-rule
      - id: micro-behaviors/communications/http/client/frame::external-iframe-element-load
