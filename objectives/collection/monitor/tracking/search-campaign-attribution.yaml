# Bundled default-search extensions: the manifest makes a non-mainstream
# engine the default (every address-bar query goes to it), and the code
# carries the distribution campaign ID into telemetry and the uninstall URL
# so the pay-per-install partner is credited. Disclosed PUP monetization.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, xpi, javascript, typescript, zip]
  attack: T1176

composite_rules:
  - id: default-search-takeover-with-campaign-attribution
    desc: Default search takeover with campaign-attributed install telemetry
    crit: suspicious
    conf: 0.85
    scope: archive
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/manifest::extension-custom-search-endpoint
      - id: micro-behaviors/communications/url/query/tracking::uninstall-url-campaign-parameter-context
      - id: micro-behaviors/os/telemetry/logging/analytics::telemetry-send
