defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: fingerprintjs-visitor-id-result
    desc: Reads a FingerprintJS visitor identifier
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'result\s*=>\s*result\.visitorId'

  - id: python-hardware-id-hashed-as-visitor-id
    desc: Hashes hardware ID as visitor ID
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'sha256\s*\(\s*str\s*\(\s*getnode\s*\(\s*\)'

composite_rules:
  - id: notebook-visitor-and-ip-tracking
    desc: Collects a notebook browser fingerprint and public IP for user tracking
    crit: notable
    conf: 0.96
    attack: T1589
    all:
      - id: micro-behaviors/os/sysinfo/hardware::python-embedded-fingerprintjs-load
      - id: micro-behaviors/process/interpreter/eval/indirect::notebook-js-result-readback
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
      - id: fingerprintjs-visitor-id-result

  # The browser fingerprint is collected only in the Colab branch; username
  # and host name are added to the same profile before that branch is selected.
  - id: notebook-cross-layer-identity-harvesting
    desc: Adds notebook browser fingerprint and host details to a tracking profile
    crit: notable
    conf: 0.96
    near_lines: 120
    all:
      - id: notebook-visitor-and-ip-tracking
      - id: micro-behaviors/process/identity/query::python-current-username
      - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname

  # This combination creates a persistent cross-layer identity from a
  # hardware-derived ID, public IP, host login/name, and a remote browser
  # fingerprint. The underlying profile is useful telemetry on its own; the
  # stable hardware ID joining the browser and host identities is the tracking
  # behavior this hostile finding requires. No transfer is claimed here.
  - id: persistent-notebook-cross-layer-identity-tracking
    desc: Tracks notebook identity across browser and host
    crit: hostile
    conf: 0.96
    attack: T1589
    all:
      - id: notebook-cross-layer-identity-harvesting
      - id: python-hardware-id-hashed-as-visitor-id
