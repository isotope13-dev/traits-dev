# An editor extension that mints its own device identifier, hides it in the
# user's home directory and tags it with the editor session it was minted from.
#
# The behaviour by itself is licensing-shaped, so the rule is not built on it.
# What makes this a covert tracker is the packaging: the identifier logic is
# handed to an obfuscator (string table + rotation) while the rest of the
# extension ships as plain bundler output, and it reads the editor's instance
# environment (PID, IPC socket path) that the extension API never requires.
# Protecting product IP does not need the ID store hidden; re-identifying a user
# who uninstalled and reinstalled does.
#
# Legs are behavioural rather than named: the home-directory file names and the
# telemetry field names live inside the encrypted string table, so a rule keyed
# on them would only ever match the one sample it was written from.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
  attack: T1082,T1027

composite_rules:
  # An editor extension that explicitly watches AI-assistant session/config
  # trees and combines those observations with local hashing, event logging,
  # and an external JSON telemetry transport is privacy-sensitive.  Product
  # documentation and user opt-in can make this benign, so this stays
  # suspicious rather than hostile; the rule is behavioral and vendor-neutral.
  - id: editor-assistant-activity-telemetry
    desc: Editor extension sends hashed telemetry about AI-assistant activity
    crit: suspicious
    conf: 0.92
    attack: T1005,T1041
    all:
      - id: micro-behaviors/crypto/hash/hmac::node-createhmac-text-call
      - id: micro-behaviors/os/telemetry/logging/event::log-event-identifier
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
      - id: micro-behaviors/communications/http/request/client::http-post-json
    any:
      - id: micro-behaviors/fs/path/application/config::claude-session-projects-directory
      - id: micro-behaviors/fs/path/application/config::codex-config-directory
      - id: micro-behaviors/fs/path/application/config::gemini-config-directory

  - id: obfuscated-editor-identifier-implant
    desc: Obfuscated module hides a minted host identifier in the home directory
    crit: hostile
    conf: 0.99
    mbc: B0032
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      # Reference the env-var atoms directly: the `vscode-instance-env-read`
      # umbrella is a lone `any:/needs:1` composite and is filtered from scan
      # findings, so a parent that depends on it never sees the match.
      - id: micro-behaviors/os/env/vars/editor::vscode-instance-pid-env
      - id: micro-behaviors/os/env/vars/editor::vscode-ipc-hook-env
      - id: micro-behaviors/os/random/crypto::node-bracket-random-bytes-call
      - id: micro-behaviors/process/user/query::node-bracket-homedir-call
      - id: micro-behaviors/fs/file/write/direct::js-bracket-file-write
    unless:
      - id: metadata/package/testing/harness/runtime/
