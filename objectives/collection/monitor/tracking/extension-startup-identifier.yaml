defaults:
  platforms: [unix, windows]
  for: [vsix, zip, package.json, javascript, typescript]
  attack: T1005,T1041

composite_rules:
  - id: extension-startup-source-map-id-post
    desc: Startup extension posts local identifier
    crit: suspicious
    conf: 0.97
    scope: archive
    all:
      - id: metadata/permission/activation::on-startup-finished
      - id: micro-behaviors/communications/http/telemetry::source-map-trailer-identity-post
      - id: micro-behaviors/communications/http/telemetry::node-read-write-id-json-post
