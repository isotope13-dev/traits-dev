# Turning GPS on behind the user's back through the Settings power-control
# widget: a broadcast to com.android.settings.widget.SettingsAppWidgetProvider
# with category ALTERNATIVE toggles location (unchecked before Android 4.1).
# No app needs to address another app's widget provider to read location;
# stalkerware and SMS stealers used it to force a fix.
defaults:
  platforms: [android]
  for: [dex]
  crit: hostile
  attack: T1430

composite_rules:
  - id: android-settings-widget-silent-gps-enable
    desc: Forces GPS on through the Settings power-control widget
    conf: 0.93
    all:
      - id: micro-behaviors/os/application/control::dex-settings-widget-provider-target
      - id: micro-behaviors/os/application/control::dex-intent-alternative-category
      - id: micro-behaviors/os/application/control::dex-location-providers-allowed-setting
