# A startup-activated editor extension that keeps its own install identifier
# in an owner-only dotfile in the user's home directory and posts it. The
# editor already gives extensions per-install storage and a machine ID that
# telemetry settings govern; an identifier written outside that storage
# survives uninstall and reinstall and re-identifies the developer across
# every extension that reads the same file. All legs are atoms so the archive
# scope can join the manifest activation to the bundled code.
defaults:
  platforms: [unix, windows]
  for: [vsix, zip, package.json, javascript, typescript]
  attack: T1005,T1041
composite_rules:
  - id: startup-extension-home-dotfile-id-post
    desc: Startup extension posts an install ID kept in a home dotfile
    crit: hostile
    conf: 0.92
    scope: archive
    all:
      - id: metadata/permission/activation::on-startup-finished
      - id: micro-behaviors/communications/http/telemetry::node-read-write-id-json-post
      - id: micro-behaviors/fs/path/hidden::node-homedir-hidden-entry
      - id: micro-behaviors/fs/write/file/mode::node-write-owner-only-mode
