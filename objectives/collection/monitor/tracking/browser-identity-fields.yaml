# Personal-identity fields read out of a client-side application store
# (Pinia/Vuex/Redux state persisted to Web Storage, a decoded JWT payload, a
# cached profile object).
#
# These are the fields an application keeps about the *person* using it, not
# about the session: real name, phone number, account/login name. A page that
# reads them to render a header touches one or two; a collector reaches for the
# whole set, which is why the cluster rather than any single field is the
# signal. Credentials and tokens are a different target and live under
# credential-access/.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.85
  attack: T1005

traits:
  # `realName`/`real_name` name a person and nothing else, so they stand alone.
  # A bare `.fullName` does not: protobufjs stores the fully-qualified message
  # name there (`field.fullName`, `Root._fullyQualifiedObjects[object.fullName]`),
  # and GraphQL/class-metadata layers do the same, so `.fullName` on its own is a
  # type name far more often than a person's. Require a person-shaped receiver
  # for that spelling instead of claiming every qualified-name read is PII.
  - id: profile-real-name-field-read
    desc: Reads a person's real-name field
    if:
      type: text
      regex: '\.\s*(real_?[Nn]ame)\b|\b(user|profile|contact|person|account|customer)\.full_?[Nn]ame\b'

  # `mobile` alone is not a phone number: it is a breakpoint/user-agent flag
  # (`ua.mobile`, `breakpoints.mobile`) and, inside quoted media types, a
  # subtype (`application/vnd.dolby.mobile.1`, `video/vnd.dece.mobile` in
  # mime-db). Keep the spellings that only ever mean a telephone number.
  - id: profile-phone-field-read
    desc: Reads a profile phone-number field
    if:
      type: text
      regex: '\.\s*(phone|phoneNumber|phone_number|telephone|mobileNumber|mobilePhone)\b'

  # Matcher-faithful wording: this sees a login-handle property read. Whether
  # it belongs to an end user or to a device/service config is not visible here,
  # so the identity-record inference stays with the composite below.
  - id: profile-account-name-field-read
    desc: Reads an account or username field
    if:
      type: text
      regex: '\.\s*(account|username|userNo|userName)\b'

composite_rules:
  # Name plus phone plus login handle, pulled from the same object: that is a
  # person's identity record being assembled, not a UI field being rendered.
  #
  # Bounded in bytes rather than lines. "Same object" is a distance in
  # characters, and generated or minified JavaScript puts a megabyte on one
  # line -- a `near_lines: 12` window covered whole files. A GPT tokenizer's
  # BPE vocabulary (gpt-tokenizer's cl100k_base.js: 1 MB of quoted token
  # strings on 15 lines) lists ".fullName", ".phone" and ".username" as
  # ordinary learned tokens; those three sat 466 KB apart and still counted as
  # one record. An identity record actually being assembled fits easily inside
  # the window below.
  - id: client-store-identity-record-harvest
    desc: Harvests a full identity record from app state
    crit: suspicious
    conf: 0.9
    near_bytes: 512
    all:
      - id: profile-real-name-field-read
      - id: profile-phone-field-read
      - id: profile-account-name-field-read
