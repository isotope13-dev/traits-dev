# Personal-identity fields read out of a client-side application store
# (Pinia/Vuex/Redux state persisted to Web Storage, a decoded JWT payload, a
# cached profile object).
#
# These are the fields an application keeps about the *person* using it, not
# about the session: real name, phone number, account/login name. A page that
# reads them to render a header touches one or two; a collector reaches for the
# whole set, which is why the cluster rather than any single field is the
# signal. Credentials and tokens are a different target and live under
# credential-access/.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.85
  attack: T1005

traits:
  - id: profile-real-name-field-read
    desc: Reads a profile real-name field
    if:
      type: text
      regex: '\.\s*(realName|real_name|fullName|full_name)\b'

  - id: profile-phone-field-read
    desc: Reads a profile phone-number field
    if:
      type: text
      regex: '\.\s*(phone|phoneNumber|mobile|telephone)\b'

  - id: profile-account-name-field-read
    desc: Reads a profile account-name field
    if:
      type: text
      regex: '\.\s*(account|username|userNo|userName)\b'

composite_rules:
  # Name plus phone plus login handle, pulled from the same object: that is a
  # person's identity record being assembled, not a UI field being rendered.
  - id: client-store-identity-record-harvest
    desc: Harvests a full identity record from app state
    crit: suspicious
    conf: 0.9
    near_lines: 12
    all:
      - id: profile-real-name-field-read
      - id: profile-phone-field-read
      - id: profile-account-name-field-read
