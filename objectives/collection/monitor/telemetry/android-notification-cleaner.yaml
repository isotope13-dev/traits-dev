defaults:
  platforms: [android]
  for: [apk, zip]

traits:
  - id: cleaner-location-privacy-module
    desc: Cleaner location privacy module
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "res/mipmap-xxhdpi-v4/ic_home_location_privacy_clean.webp"
  - id: cleaner-social-clean-module
    desc: Cleaner social app module
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: "res/mipmap-xxhdpi-v4/ic_home_social_clean.webp"
  - id: cleaner-app-uninstall-module
    desc: Cleaner app inventory module
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: "res/mipmap-xxhdpi-v4/ic_home_app_uninstall.webp"
  - id: cleaner-app-scan-animation
    desc: Cleaner app scan animation
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: "res/raw/loader_animation_scan_app.json"
  - id: cleaner-location-scan-animation
    desc: Cleaner location scan animation
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: "res/raw/loader_animation_scan_location.json"

composite_rules:
  - id: android-notification-usage-surveillance
    for: [android_apk, zip, java, kotlin, xml]
    desc: Android notification usage surveillance
    crit: suspicious
    conf: 0.95
    unless:
      # SmsForwarder deliberately exposes notification forwarding and device
      # inventory controls; these same declarations are spyware-like only in
      # an unrecognized application.
      - id: well-known/app/communication/sms-forwarder::smsforwarder-application
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-application
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-package
    scope: outer
    all:
      - id: micro-behaviors/os/privilege/manifest::bind-notification-listener
      - id: micro-behaviors/os/privilege/manifest::notification-listener-service
      - id: micro-behaviors/os/privilege/manifest::package-usage-stats
    any:
      - id: micro-behaviors/os/privilege/manifest::query-all-packages
      - id: micro-behaviors/os/privilege/manifest::get-installed-apps
  - id: android-loader-backed-notification-surveillance
    desc: Opaque-loader Android notification and device surveillance
    for: [apk, zip, xml]
    crit: hostile
    conf: 0.995
    all:
      - id: android-notification-usage-surveillance
      - id: micro-behaviors/os/sysinfo/platform/mobile::android-persistent-id-collection
      - id: micro-behaviors/os/sysinfo/platform/mobile::android-hardware-id-collection
      - id: objectives/command-and-control/dropper/staged-loader::android-opaque-asset-dex-loader
    any:
      - id: micro-behaviors/os/clipboard/reference::clipboard-manager
      - id: micro-behaviors/os/privilege/manifest::manage-external-storage
  - id: android-cleaner-privacy-scan-modules
    desc: Android cleaner privacy scan modules
    crit: suspicious
    conf: 0.94
    all:
      - id: cleaner-location-privacy-module
      - id: cleaner-social-clean-module
      - id: cleaner-app-uninstall-module
    any:
      - id: cleaner-app-scan-animation
      - id: cleaner-location-scan-animation
      - id: metadata/package/files/mobile-package::apk-multiple-secondary-dex
