# Detects a cyber-physical endpoint exporting a broad sensor snapshot on a
# fixed cadence.  The matcher uses protocol/API structure and field clusters,
# not prose describing surveillance.
defaults:
  platforms: [windows, unix, android]
  for: [source, scripts]
  crit: notable
  conf: 0.9
  attack: T1041,T1071.003

traits:
  # The leading context word has to establish a *telemetry payload*. `capture`,
  # `microphone` and `camera` do not -- they are the vocabulary of any screen or
  # webcam recorder, so `capture_system_audio: bool` and
  # `cameraVideo: HTMLVideoElement` in a clip-recording app were being read as
  # robot sensor fields. Media capture itself belongs to
  # micro-behaviors/hardware/; what makes these robot telemetry is the payload.
  - id: sensor-audio-field
    desc: Audio sensor payload field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?is)\b(sensor|telemetry|payload).{0,80}["'']?audio["'']?\s*[:=]'

  - id: sensor-video-field
    desc: Video sensor payload field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?is)\b(sensor|telemetry|payload).{0,80}["'']?video["'']?\s*[:=]'

  - id: sensor-lidar-field
    desc: Lidar sensor payload field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?is)\b(sensor|telemetry|payload|capture|lidar).{0,80}["'']?lidar["'']?\s*[:=]'

  - id: sensor-gps-field
    desc: GPS sensor payload field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?is)\b(sensor|telemetry|payload|capture|gps|location).{0,80}["'']?gps["'']?\s*[:=]'

  - id: sensor-imu-field
    desc: IMU sensor payload field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?is)\b(sensor|telemetry|payload|capture|imu).{0,80}["'']?imu["'']?\s*[:=]'

  - id: five-minute-report-interval
    desc: Five-minute telemetry report interval
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(report[_-]?interval|telemetry[_-]?interval|report[_-]?period)\b\s*[:=]\s*300\b'

composite_rules:
  - id: multimodal-sensor-payload-fields
    desc: Multimodal sensor telemetry payload fields
    crit: notable
    conf: 0.93
    any:
      - id: sensor-audio-video-fields
      - id: sensor-spatial-fields
      - id: micro-behaviors/os/service/query::service-state-field
    needs: 2

  - id: sensor-audio-video-fields
    desc: Audio and video sensor fields
    crit: notable
    conf: 0.92
    all:
      - id: sensor-audio-field
      - id: sensor-video-field

  - id: sensor-spatial-fields
    desc: Spatial sensor payload fields
    crit: notable
    conf: 0.92
    any:
      - id: sensor-lidar-field
      - id: sensor-gps-field
      - id: sensor-imu-field
    needs: 2

  - id: pinned-multimodal-robot-telemetry
    desc: Periodic multimodal telemetry to pinned endpoint
    crit: suspicious
    conf: 0.98
    all:
      - id: multimodal-sensor-payload-fields
      - id: five-minute-report-interval
      - id: micro-behaviors/communications/messaging/mqtt::mqtt-context-publish-call
    any:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script

  - id: robot-telemetry-tls-bypass
    desc: Robot telemetry channel disables TLS verification
    crit: suspicious
    conf: 0.98
    all:
      - id: multimodal-sensor-payload-fields
      - id: micro-behaviors/communications/socket/ssl::verify-mode-none
    any:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
      - id: micro-behaviors/communications/ip/direct::external-ipv4-websocket-url
