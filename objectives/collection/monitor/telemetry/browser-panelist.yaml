# Panelist-style market-research analytics in browser extensions: a persistent
# panelist identifier paired with page-visit or settings telemetry uploaded to
# a remote analytics API.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1119,T1041

traits:
  - id: panelist-analytics-id-field
    desc: References panelist analytics identifier
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bpanelistId\b|\bpanelist_id\b'

  - id: panelist-settings-api-path
    desc: Panelist settings REST API path
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '/panelists/.{0,40}/settings'

  - id: safe-browsing-page-visited-message
    desc: SafeBrowsing page-visited event dispatch
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: SafeBrowsing.PageVisited

composite_rules:
  - id: extension-panelist-page-visit-analytics-exfil
    desc: Extension uploads panelist page-visit telemetry
    crit: hostile
    conf: 0.98
    scope: archive
    for: [crx, xpi, zip, archives]
    all:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: panelist-analytics-id-field
      - id: safe-browsing-page-visited-message
      - id: panelist-settings-api-path
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/post::fetch-post-call

  - id: vpn-extension-panelist-proxy-surveillance
    desc: VPN extension tracks panelists across all sites
    crit: hostile
    conf: 0.98
    attack: T1090,T1119,T1041
    scope: archive
    for: [crx, xpi, zip, archives]
    all:
      - id: micro-behaviors/os/network/webextension::chrome-proxy-settings-set
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: panelist-analytics-id-field
      - id: panelist-settings-api-path
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/post::fetch-post-call
