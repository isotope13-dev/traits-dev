defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1119,T1041

traits:
  # The "list the administrators" leg is not telemetry on its own — every
  # caching plugin runs it to skip the cache for logged-in admins.  It is now
  # the canonical neutral atom micro-behaviors/os/user/lookup::wordpress-list-
  # administrators, referenced from the composite below, where the JSON
  # site/admin payload and the outbound wp_remote_post supply the intent.
  - id: php-remote-metadata-payload
    desc: Remote PHP metadata request payload
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "wp_json_encode\\s*\\([\\s\\S]{0,900}\\b(admin_email|site_url|plugin_version|country_info)\\b"

composite_rules:
  - id: wp-admin-metadata-remote-telemetry
    desc: WordPress plugin sends administrator and site metadata to a remote service
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/user/lookup::wordpress-list-administrators
      - id: php-remote-metadata-payload
      - id: micro-behaviors/communications/http/request/wordpress::wp-remote-post
