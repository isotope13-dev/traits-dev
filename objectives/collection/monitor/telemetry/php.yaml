defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1119,T1041

composite_rules:
  - id: wp-admin-metadata-remote-telemetry
    desc: WordPress plugin queries administrators near a site-metadata POST
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/user/lookup::wordpress-list-administrators
      - id: micro-behaviors/data/serialize/json::php-json-site-metadata
      - id: micro-behaviors/communications/http/request/wordpress::wp-remote-post
    near_bytes: 2048
