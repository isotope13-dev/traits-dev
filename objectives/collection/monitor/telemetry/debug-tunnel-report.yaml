defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: hypothesis-and-run-debug-identifiers
    desc: Debug report includes run and hypothesis IDs
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?s)(hypothesisId.{0,350}runId|runId.{0,350}hypothesisId)'

  - id: debug-session-header-and-body-id
    desc: Debug session ID in header and body
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?s)X-Debug-Session-Id.{0,240}sessionId|sessionId.{0,240}X-Debug-Session-Id'

  - id: ble-position-debug-fields
    desc: Beacon signal and coordinates in debug payload
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?s)(rssi.{0,500}(beaconX|beaconZ)|beaconX.{0,500}beaconZ)'

composite_rules:
  - id: debug-session-telemetry-post
    desc: Posts debug-session reports to a remote endpoint
    crit: suspicious
    conf: 0.96
    scope: file
    near_lines: 40
    all:
      - id: hypothesis-and-run-debug-identifiers
      - id: debug-session-header-and-body-id
      - id: micro-behaviors/communications/http/post::fetch-post-call

  - id: beacon-location-debug-exfiltration
    desc: Sends beacon location data in debug telemetry
    crit: hostile
    conf: 0.97
    attack: T1041
    scope: file
    all:
      - id: debug-session-telemetry-post
      - id: ble-position-debug-fields
