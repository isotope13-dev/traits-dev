defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: stack-report-without-optout-reference
    desc: Error report lacks reporting opt-out reference
    crit: suspicious
    conf: 0.95
    scope: file
    all:
      - id: metadata/lang/source/naming/setting::sweobeyme-webhook-setting
      - id: micro-behaviors/communications/http/request/body/reporting::error-stack-json-post
    unless:
      - id: metadata/lang/source/naming/setting::error-reporting-enabled-setting-reference
