defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1119

traits:
  - id: ai-chat-context-capture-dispatch
    desc: Queues captured AI-chat context message
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'case\s+["'']SB_CONTEXT_CAPTURE["'']\s*:\s*\{[\s\S]{0,180}queueDirectContextCaptureMessage'

  - id: ai-chat-context-plaintext-queue
    desc: Queues AI-chat prompt or response text
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'content\s*:\s*capture\.text\s*,[\s\S]{0,360}role\s*:\s*capture\.role'

  - id: ai-chat-context-aes-gcm
    desc: Encrypts AI-chat context with AES-GCM
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'CONTEXT_ENCRYPTION_ALGORITHM\s*=\s*["'']AES-GCM["'']'

  - id: ai-chat-context-key-prefix
    desc: Defines AI-chat context encryption namespace
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: CONTEXT_ENCRYPTION_KEY_PREFIX

  - id: ai-chat-context-post-endpoint
    desc: Posts an AI-chat context batch remotely
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'postJson\s*\(\s*["'']/context["'']\s*,\s*(requestPayload|legacyPayload)'

composite_rules:
  - id: encrypted-ai-chat-context-batch
    desc: Encrypts queued AI-chat context with AES-GCM
    crit: notable
    conf: 0.98
    all:
      - id: ai-chat-context-aes-gcm
      - id: ai-chat-context-key-prefix
    near_bytes: 1000

  - id: encrypted-ai-chat-context-exfiltration
    desc: Captures and remotely uploads AI-chat prompts and responses
    crit: hostile
    conf: 0.995
    attack: T1119,T1041
    scope: archive
    for: [crx, xpi, zip, archives]
    all:
      - id: ai-chat-context-capture-dispatch
      - id: ai-chat-context-plaintext-queue
      - id: encrypted-ai-chat-context-batch
      - id: ai-chat-context-post-endpoint
