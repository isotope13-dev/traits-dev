# React Native npm modules that harvest AppsFlyer install attribution and ship
# it to a remote HTTP endpoint controlled outside the attribution SDK.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm]
  attack: T1195.002,T1412,T1041
  mbc: T1005

composite_rules:
  - id: react-native-appsflyer-attribution-http-exfil
    desc: React Native module posts AppsFlyer conversion data
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/os/telemetry/attribution::appsflyer-install-conversion-callback
      - id: micro-behaviors/communications/http/post::axios-post-source
    near_lines: 120
