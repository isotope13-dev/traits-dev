defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: browser-keystroke-timing-fields
    desc: Contains browser keystroke timing field names
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bkeystroke(FlightTimes|DwellTimes)\b'

composite_rules:
  - id: browser-behavioral-input-telemetry
    desc: Sends browser behavioral input timing telemetry
    crit: notable
    conf: 0.96
    all:
      - id: browser-keystroke-timing-fields
      - id: micro-behaviors/hardware/input/event::browser-keyboard-event-listener
      - id: micro-behaviors/hardware/input/event::browser-mousemove-listener
      - id: micro-behaviors/communications/http/request/payload::fetch-post-json-body
