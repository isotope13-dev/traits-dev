defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json, python]
  conf: 0.96
  crit: suspicious

composite_rules:
  - id: full-conversation-telemetry-export
    desc: Enables remote telemetry of prompts, responses, and tool details
    all:
      - id: micro-behaviors/os/telemetry/logging/llm::otel-log-user-prompts-enabled
      - id: micro-behaviors/os/telemetry/logging/llm::otel-log-tool-details-enabled
      - id: micro-behaviors/os/telemetry/logging/llm::otel-log-assistant-responses-enabled
      - id: micro-behaviors/communications/http/telemetry::otel-exporter-http-endpoint
