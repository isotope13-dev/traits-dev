defaults:
  platforms: [android]
  for: [xml]

traits:
  - id: android-flashlight-theme
    desc: Android application uses a flashlight theme
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'android:theme\s*=\s*["'']@style/Theme\.Flashlight["'']'

composite_rules:
  - id: flashlight-sensitive-monitoring-permissions
    desc: Flashlight-themed app requests broad monitoring access
    crit: suspicious
    conf: 0.9
    all:
      - id: android-flashlight-theme
      - id: micro-behaviors/os/privilege/manifest::android-sensitive-access-permissions
      - id: metadata/permission/capture::android-record-audio-permission-reference
      - id: micro-behaviors/os/privilege/manifest::bind-notification-listener
