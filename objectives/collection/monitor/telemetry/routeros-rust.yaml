defaults:
  platforms: [routeros, appliance, unix]
  for: [rust, elf]
  attack: T1041

composite_rules:
  - id: rust-routeros-collector
    desc: RouterOS telemetry collector indicators
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/user-agent::rust-routeros-agent-header
    any:
      - id: micro-behaviors/communications/url/transfer-path::rust-generic-collect-url
      - id: micro-behaviors/communications/url/transfer-path::routeros-collect-path-reference
      - id: micro-behaviors/communications/url/transfer-path::routeros-exfil-path-reference
      - id: micro-behaviors/os/sysinfo/platform/files::unix-release-and-proc-info-paths
      - id: micro-behaviors/network/status::rust-network-profile-command-set
    needs: 2
