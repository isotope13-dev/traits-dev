# Full-spectrum activity monitoring: one program keeping a separate log store
# for each category of what the user did -- keystrokes, screenshots, visited
# URLs, clipboard contents, chat messages, applications launched -- and shipping
# the set to an account it authenticates to on a schedule.
#
# The breadth is the signal. An application legitimately logs its own operation,
# and that is one log; a crash reporter uploads one kind of artefact. Naming a
# distinct store per category of human activity only makes sense if recording
# the human IS the product, which is what separates stalkerware and commercial
# "monitoring" agents from ordinary software with a log file.
#
# Deliberately keyed on the naming convention rather than on any one product's
# filenames: `keyLogPath`, `scrLogPath`, `urlLogPath`, `pasteLogPath` are what
# these agents call their stores, and the convention has outlived individual
# vendors. Each category is its own atom so the composite can require four
# genuinely different ones rather than four mentions of the same store.
defaults:
  platforms: [macos, windows, linux]
  for: [binaries, scripts]
  attack: T1056.001
  mbc: E1056
  crit: component
  conf: 0.9

traits:
  - id: keystroke-log-path
    desc: Keystroke log path property
    if:
      type: text
      regex: '(?i)\bkeyLogPath\b'
  - id: screen-log-path
    desc: Screenshot log path property
    if:
      type: text
      regex: '(?i)\bscr(een)?LogPath\b'
  - id: url-log-path
    desc: Visited-URL log path property
    if:
      type: text
      regex: '(?i)\b(url|web)LogPath\b'
  - id: clipboard-log-path
    desc: Clipboard log path property
    if:
      type: text
      regex: '(?i)\b(paste|clip)LogPath\b'
  - id: application-log-path
    desc: Application-usage log path property
    if:
      type: text
      regex: '(?i)\bappLogPath\b'
  - id: chat-log-path
    desc: Chat message log path property
    if:
      type: text
      regex: '(?i)\bchatLogPath\b'

  - id: upload-account-username
    desc: Log upload account username setting
    if:
      type: text
      regex: '(?i)\buploadUserName\b'
  - id: upload-account-password
    desc: Log upload account password setting
    if:
      type: text
      regex: '(?i)\buploadPassword\b'
  - id: upload-interval-setting
    desc: Log upload interval setting
    if:
      type: text
      regex: '(?i)\buploadInterval\b'

composite_rules:
  - id: multi-category-activity-log-paths
    desc: Separate log paths per activity category
    crit: notable
    conf: 0.93
    # Four distinct categories: two log paths is a program with two logs; a
    # keystroke store next to a screenshot store next to a clipboard store is a
    # surveillance product.
    needs: 4
    any:
      - id: keystroke-log-path
      - id: screen-log-path
      - id: url-log-path
      - id: clipboard-log-path
      - id: application-log-path
      - id: chat-log-path

  - id: credentialed-log-upload-settings
    desc: Log upload account and interval settings
    crit: notable
    conf: 0.92
    needs: 2
    any:
      - id: upload-account-username
      - id: upload-account-password
      - id: upload-interval-setting

  - id: credentialed-activity-monitor-upload
    desc: Activity monitor uploads logs to an account
    crit: hostile
    conf: 0.96
    all:
      - id: multi-category-activity-log-paths
      - id: credentialed-log-upload-settings
