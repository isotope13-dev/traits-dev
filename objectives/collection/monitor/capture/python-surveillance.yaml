# Remote surveillance collection in Python.
#
# The article describes spyware as a turnkey implant whose distinctive
# behavior is not a vendor string: it collects several device sensors and
# sends the results to operator infrastructure, often on a recurring beacon.
# Keep the sensor leaves in capability directories and infer the hostile
# objective only from their combination with an outbound HTTP client.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1113,T1123,T1125,T1041
  mbc: B0002

composite_rules:
  - id: documented-authorized-remote-admin
    desc: Documented remote administration enforces chat authorization
    crit: exception
    conf: 0.98
    all:
      - id: micro-behaviors/os/security/auth/verify::telegram-chat-authorization-gate
      - id: micro-behaviors/ui/help::documented-remote-admin-command-set

  - id: python-remote-multi-sensor-surveillance
    desc: Python remote multi-sensor surveillance
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/client::request-python
    any:
      - id: micro-behaviors/hardware/display/screen::screen-capture
      - id: micro-behaviors/hardware/display/camera::opencv-video-capture
      - id: micro-behaviors/hardware/input/audio::python-microphone-capture
    needs: 2
    near_bytes: 4096
    unless:
      - id: documented-authorized-remote-admin

  - id: python-periodic-surveillance-beacon
    desc: Python periodic multi-sensor surveillance beacon
    crit: hostile
    conf: 0.99
    all:
      - id: python-remote-multi-sensor-surveillance
      - id: micro-behaviors/time/sleep/interval::python-periodic-loop
    near_bytes: 4096
