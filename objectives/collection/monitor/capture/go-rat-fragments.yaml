defaults:
  platforms: [windows]
  for: [pe]
  attack: T1113

composite_rules:
- id: go-websocket-ffmpeg-audio-video-capture
  desc: Go WebSocket RAT can capture webcam and microphone through FFmpeg
  crit: hostile
  conf: 0.96
  attack: T1125,T1123
  all:
  - id: micro-behaviors/hardware/input/media::ffmpeg-dshow-audio-video-input-template
  - id: objectives/command-and-control/remote-command/control/websocket::go-websocket-rat-remote-control

- id: go-rat-remote-desktop-control
  desc: Go display control over websocket
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/ui/window/automation::remote-desktop-control-fragments
  any:
  - id: micro-behaviors/communications/websocket/library::go-websocket-library
  - id: metadata/binary/symbols/name/process::go-os-exec-package-reference
  unless:
  - id: well-known/lib/ui/gui::openfl-lime-cpp-rtti

- id: go-rat-webcam-microphone-capture
  desc: Go RAT webcam microphone capture
  crit: suspicious
  conf: 0.93
  all:
  - id: micro-behaviors/hardware/input/media::webcam-microphone-fragments
  any:
  - id: micro-behaviors/communications/websocket/library::go-websocket-library
  - id: metadata/binary/symbols/name/process::go-os-exec-package-reference
