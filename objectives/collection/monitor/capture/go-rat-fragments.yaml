defaults:
  platforms: [windows]
  for: [pe]
  attack: T1113

traits:
- id: remote-desktop-control-fragments--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.85
  count_min: 2
  if:
    type: text
    substr: rd_start
  count_max: 1031062
- id: remote-desktop-control-fragments--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.85
  count_min: 2
  if:
    type: text
    substr: rd_block
  count_max: 1031063
- id: remote-desktop-control-fragments--rx-3
  desc: Regex component marker
  crit: component
  conf: 0.85
  count_min: 2
  if:
    type: text
    substr: monitors
  count_max: 1031064
- id: remote-desktop-control-fragments--rx-4
  desc: Repeated _display identifier fragment
  crit: component
  conf: 0.85
  count_min: 2
  if:
    type: text
    substr: _display
  count_max: 1031065
  unless:
    - id: well-known/lib/runtime/unity::unity-xr-managed-module
- id: webcam-microphone-fragments
  desc: Webcam and microphone fragments
  crit: notable
  conf: 0.85
  if:
    type: text
    # Require the short `mic_` token to begin an identifier; otherwise this
    # matches ordinary runtime symbols such as `atomic_start`.
    regex: 'webcam_(s|l)|(^|[^A-Za-z0-9_])mic_(star|stop)'
  unless:
    - id: metadata/library/runtime::gnu-openmp-runtime-dll

composite_rules:
- id: go-rat-remote-desktop-control
  desc: Go display control over websocket
  crit: notable
  conf: 0.93
  all:
  - id: remote-desktop-control-fragments
  any:
  - id: objectives/command-and-control/remote-command/control::go-websocket-fragment
  - id: micro-behaviors/process/create/system::go-os-exec-pclntab
  unless:
  - id: metadata/library/gui::openfl-lime-cpp-rtti

- id: go-rat-webcam-microphone-capture
  desc: Go RAT webcam microphone capture
  crit: suspicious
  conf: 0.93
  all:
  - id: webcam-microphone-fragments
  any:
  - id: objectives/command-and-control/remote-command/control::go-websocket-fragment
  - id: micro-behaviors/process/create/system::go-os-exec-pclntab
- id: remote-desktop-control-fragments
  desc: Remote desktop control fragments
  crit: notable
  conf: 0.85
  needs: 2
  any:
  - id: remote-desktop-control-fragments--rx-1
  - id: remote-desktop-control-fragments--rx-2
  - id: remote-desktop-control-fragments--rx-3
  - id: remote-desktop-control-fragments--rx-4
  unless:
  - id: metadata/library/gui::openfl-lime-cpp-rtti

- id: go-session-multi-sensor-stream
  desc: Go session streams multiple surveillance sensors
  crit: suspicious
  conf: 0.99
  needs: 2
  any:
  - id: micro-behaviors/hardware/display/screen::go-session-tcp-screen-stream
  - id: micro-behaviors/hardware/input/audio::go-session-tcp-microphone-stream
  - id: micro-behaviors/hardware/display/camera::go-session-tcp-camera-stream
