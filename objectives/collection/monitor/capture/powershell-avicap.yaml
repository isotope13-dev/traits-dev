# PowerShell P/Invoke of Video for Windows webcam APIs. The PE-scoped
# vfw-capture-window atom excludes C-style declarations, which is exactly
# how Add-Type DllImport signatures are written, so script-hosted capture
# never fired.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1125
  mbc: C0014

traits:
  - id: powershell-avicap-dllimport
    desc: PowerShell P/Invokes avicap32 capture
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)DllImport\s*\(\s*"avicap32\.dll"'
  - id: powershell-vfw-savedib
    desc: VFW SaveDIB capture message
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)SendMessage.{0,32}0x419\b'
  - id: powershell-vfw-grab-frame
    desc: VFW GrabFrame capture message
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)SendMessage.{0,32}0x43c\b'

composite_rules:
  - id: powershell-avicap-savedib-capture
    desc: avicap32 SaveDIB webcam capture
    crit: hostile
    conf: 0.96
    all:
      - id: powershell-avicap-dllimport
      - id: powershell-vfw-savedib
  - id: powershell-avicap-grab-capture
    desc: avicap32 GrabFrame webcam capture
    crit: hostile
    conf: 0.96
    all:
      - id: powershell-avicap-dllimport
      - id: powershell-vfw-grab-frame
  - id: powershell-vfw-savedib-grab
    desc: VFW SaveDIB and GrabFrame capture
    crit: hostile
    conf: 0.95
    all:
      - id: powershell-vfw-savedib
      - id: powershell-vfw-grab-frame
