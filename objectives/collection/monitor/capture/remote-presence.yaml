# Covert remote presence: an out-of-band KVM-over-IP console (PiKVM) paired
# with camera or screen/stream redirection (a USB capture dongle registered as
# a webcam, or VDO.Ninja). The hardware remote-control leg plus the
# fake/detached video leg together describe an operator who controls the
# machine remotely while appearing present -- the remote-worker / laptop-farm /
# interview-fraud shape. Each leg is dual-use on its own (a KVM switch is
# normal server gear; Guermok and VDO.Ninja are normal streaming kit), so the
# co-occurrence is what earns the suspicion, not any single device.
defaults:
  platforms: [windows]
  for: [text]

composite_rules:
  - id: covert-hardware-remote-presence
    desc: KVM-over-IP console with camera or stream redirection
    crit: suspicious
    conf: 0.9
    attack: T1113
    all:
      - id: micro-behaviors/hardware/input/device::pikvm-kvm-over-ip-device
    any:
      - id: micro-behaviors/hardware/input/video::guermok-usb-video-capture
      - id: micro-behaviors/communications/http/services/vdo-ninja::vdo-ninja-url
