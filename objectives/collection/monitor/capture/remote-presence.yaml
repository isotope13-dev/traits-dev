# Hardware-assisted remote presence pairs a browser-operated KVM console with
# either a webcam-presenting capture device or an outbound browser screen
# relay. Each leg is dual-use by itself; these composites put suspicion on the
# co-occurrence that enables an off-site operator to control a workstation and
# substitute or observe its conference-media feed.
defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [scripts, source, binaries, data, reg, -text]

composite_rules:
  - id: hardware-assisted-camera-impersonation
    desc: KVM-over-IP console paired with webcam-presenting capture hardware
    conf: 0.9
    all:
      - id: micro-behaviors/hardware/input/device::browser-operated-kvm-over-ip-device
      - id: micro-behaviors/hardware/input/video::guermok-linked-usb-video-capture
