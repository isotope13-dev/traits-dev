defaults:
  platforms: [windows]
  for: [go]

composite_rules:
  - id: go-windows-keylogger-foreground
    desc: Go keylogging with foreground context
    crit: suspicious
    conf: 0.95
    attack: T1056.001
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
      - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state-str
      - id: micro-behaviors/ui/window/manage/control::go-get-foreground-window-call
    any:
      - id: micro-behaviors/hardware/input/keyboard/hook::to-unicode-ex-str
      - id: micro-behaviors/hardware/input/keyboard/hook::map-virtual-key
    near_bytes: 1024

  - id: go-multi-sensor-surveillance-collection
    desc: Go multi-sensor surveillance collection
    crit: hostile
    conf: 0.98
    attack: T1113,T1125,T1123,T1056.001,T1115
    all:
      - id: micro-behaviors/hardware/display/screen::go-screen-capture
      - id: micro-behaviors/hardware/input/audio::go-wasapi-microphone-capture
      - id: go-windows-keylogger-foreground
      - id: micro-behaviors/os/clipboard/access::open-clipboard-text
    near_bytes: 4096

  - id: go-redundant-persistence-watchdog
    desc: Go redundant persistence watchdog
    crit: hostile
    conf: 0.98
    attack: T1543.003,T1547.001,T1053.005
    all:
      - id: micro-behaviors/os/service/control::go-sc-create-command
      - id: objectives/persistence/login/registry/run-key::go-run-key-registry-write
      - id: micro-behaviors/os/autorun/scheduled::go-schtasks-create-command
      - id: micro-behaviors/fs/file/write/repair::go-missing-path-write-pair
    any:
      - id: micro-behaviors/communications/http/post::go-http-post-method
      - id: micro-behaviors/hardware/display/screen::go-screen-capture
    near_bytes: 4096
