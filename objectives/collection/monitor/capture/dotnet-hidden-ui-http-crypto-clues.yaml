defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
  crit: hostile
composite_rules:
  - id: dotnet-hidden-ui-http-crypto-clues
    desc: .NET hidden launch, UI and HTTP/crypto clues
    conf: 0.99
    all:
      - id: metadata/binary/symbols/compiler::dotnet-nonstandard-namespace-population
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/ui/window/automation::dotnet-capture-or-input-apis
      - id: micro-behaviors/communications/http/client/managed::dotnet-http-client-with-aes
      - id: micro-behaviors/process/config/window::dotnet-console-launch-config-references
    crit: suspicious
