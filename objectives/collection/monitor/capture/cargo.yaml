# A screen-capture or camera crate next to an HTTP client is the capability
# pair. It does not show that captures are sent off-box or that the crate hides
# a payload. Credential-store stealers stay in the stealer dependency cluster.
defaults:
  platforms: [unix, windows]
  for: [cargo.toml]

composite_rules:
  - id: cargo-screen-capture-http-client
    desc: Cargo screen capture with HTTP client
    crit: notable
    conf: 0.86
    all:
      - id: metadata/package/dependencies/identity::dep-reqwest
    any:
      - id: metadata/package/dependencies/presence::cargo-dep-screenshots
      - id: metadata/package/dependencies/presence::cargo-dep-nokhwa
