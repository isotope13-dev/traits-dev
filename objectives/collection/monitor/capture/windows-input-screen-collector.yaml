defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1056.001

traits:
  - id: encoded-surveillance-collection
    desc: Encoded keylogging and screenshot payload
    crit: suspicious
    conf: 0.97
    for: [data]
    if:
      type: encoded
      encoding: base64
      regex: '(?is)\b(keylog(ging|ger)?|keystrokes?)\b.{0,800}\b(screenshot|screen capture|clipboard)\b'

composite_rules:
- id: windows-keyscreen-timer-collector
  desc: Windows keylogger screenshot timer collector
  crit: hostile
  conf: 0.96
  all:
  - id: objectives/collection/keylog/capture::windows-keylogger
  - id: micro-behaviors/hardware/display/screen::gdi-dib-bitmap-transfer-primitives
  - id: objectives/anti-analysis/timing/evasion::ui-timer-keypoll-gate
  any:
  - id: micro-behaviors/ui/window/enumerate::get-window-text
  - id: micro-behaviors/ui/window/enumerate::get-foreground-window
  - id: micro-behaviors/os/sysinfo/hostname::get-user-name
  unless:
  - id: well-known/tool/sysadmin/sandboxie/
  - id: well-known/lib/runtime/native-platform/slint/
  - id: metadata/binary/resource/size::large-rsrc-section
- id: windows-input-screen-clipboard-collector
  desc: Input monitoring, bitmap and clipboard APIs
  crit: suspicious
  conf: 0.93
  all:
  - id: micro-behaviors/hardware/display/screen::gdi-dib-bitmap-transfer-primitives
  - id: micro-behaviors/os/clipboard/read::get-clipboard-data
  any:
  - id: micro-behaviors/hardware/input/raw::windows-raw-input
  - id: objectives/collection/keylog/capture::polling-input-monitor
  - id: objectives/collection/keylog/capture::windows-hook-state-keylogger
  - id: micro-behaviors/hardware/input/keyboard/poll::polling-keylogger-api-cluster
  # Generic Windows hook lifecycle APIs also implement ordinary GUI event
  # handling (the official Inno IDE is a control). Require keyboard-specific
  # hook/state evidence rather than adding another application exclusion.
  unless:
  - id: objectives/collection/clipboard/capture/
  - id: well-known/app/media/imagemagick::magick-native-dll-basename
  - id: well-known/tool/sysadmin/disk-utility::winhex-xways
  # Action1 remote helper is TightVNC-derived RMM (hooks/clipboard/screen).
  # A document viewer reaches for the same three APIs for entirely ordinary
  # reasons: BitBlt into a DIB section rasterises a page, GetClipboardData
  # backs copy/paste of selected text, and raw input is how a GUI reads the
  # keyboard. A signed Rust PDF viewer built on pdfium-render was reported as a
  # keyboard/screen/clipboard collector on exactly that basis. Tk and Scintilla
  # are the same class of component. Grouped in one exception composite to
  # stay within the written-suppression limit; each member keeps its identity.
  - id: windows-gui-input-component-context
  # AutoItX exposes clipboard, keyboard/mouse, and pixel/screen primitives as
  # an automation API. The official control therefore has this exact cluster
  # without collecting user activity covertly.
  - id: well-known/tool/sysadmin/autoit::autoitx-official-control
  # FFmpeg's Windows build statically links a broad USER32/GDI surface for
  # its gdigrab/vfwcap screen- and video-capture input devices (DIB bitmap
  # transfer) and the full clipboard API; a certificate-store lookup for its
  # TLS/HTTPS streaming support and a JPEG HTTP content-type string in its
  # muxer code satisfy the credential-access/upload directory legs by
  # coincidence. A batch CLI transcoder isn't a keystroke/screen/clipboard
  # collector.
  - id: well-known/lib/media/ffmpeg::ffmpeg-lib-marker
  downgrade:
    any:
    - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
- id: windows-evasive-native-surveillance-stealer
  desc: Evasive native input clipboard stealer
  crit: hostile
  conf: 0.96
  all:
  - id: windows-input-screen-clipboard-collector
  any:
  - id: objectives/anti-analysis/timing/evasion::waitable-timer-sleep-mask
  - id: objectives/command-and-control/dropper/execution/inject::self-map-extract-execute
  - id: objectives/anti-static/obfuscation/string/stack::stack-string-obfuscated-pe
  needs: 2
  unless:
  - id: metadata/binary/vendor/
  - id: metadata/signed/platform/
  - id: well-known/tool/sysadmin/sandboxie/
  - id: well-known/tool/sysadmin/disk-utility::winhex-xways
  - id: well-known/dual-use/remote-admin/action1::action1-remote-identity
- id: windows-native-surveillance-stealer
  desc: Native Windows input clipboard stealer
  crit: hostile
  conf: 0.96
  for: [dll]
  all:
  - id: objectives/collection/keylog/capture::windows-hook-state-keylogger
  - id: objectives/collection/clipboard/capture::pe-clipboard-transfer
  unless:
  - id: metadata/binary/vendor/
  - id: metadata/signed/platform/
# GUI/application components whose ordinary screen-drawing, clipboard, and
# input handling trips the collector rule above: a PDF viewer rasterises
# pages into DIBs, an RMM helper and an editor control read the keyboard and
# clipboard on purpose. Grouping them keeps the host rule's suppression list
# within the written-leg limit while preserving each identity's evidence.
- id: windows-gui-input-component-context
  desc: GUI component with ordinary input and clipboard handling
  crit: exception
  conf: 0.9
  any:
  - id: well-known/dual-use/remote-admin/action1::action1-remote-identity
  - id: well-known/lib/format/pdfium::pdfium-rendering-engine
  - id: well-known/lib/runtime/native-platform/tcl-tk::tcl-tk-runtime-component
  - id: well-known/lib/ui/scintilla::scintilla-edit-control
- id: pe-screen-cert-process-harvest
  desc: Captures screen, certs, and processes
  crit: hostile
  conf: 0.96
  attack: T1113,T1552.004,T1057
  for: [pe]
  all:
    - id: micro-behaviors/hardware/display/screen::gdi-getdibits
    - id: micro-behaviors/crypto/certificate/store::cert-enum-certificates
    - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
  unless:
    - id: well-known/lib/runtime/scripted/electron::chromium-engine-capability-context
    # Kachina's updater links GetDIBits for icons, certificate enumeration
    # for TLS, and Toolhelp to find the process it is replacing.
    - id: well-known/tool/packaging/kachina::kachina-installer-pdb
    # ClassIn's camera DLL grabs frames, enumerates certs for TLS, and
    # snapshots processes to find the classroom client.
    - id: well-known/app/communication/classin::eeo-camera-basename
