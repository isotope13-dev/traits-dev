defaults:
  platforms: [windows, unix]
  for: [java]
  attack: T1123
  mbc: F0009

traits:
  - id: java-target-data-line-source
    desc: Java microphone TargetDataLine source
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: identifier
      exact: TargetDataLine

composite_rules:
  # The capture line (TargetDataLine) is the discriminator: encoding an
  # AudioInputStream to a file on its own is ordinary audio output, which is why
  # those two atoms live in micro-behaviors/data/format/media/audio/.
  - id: java-microphone-capture-to-file
    desc: Java microphone capture to file
    crit: suspicious
    conf: 0.94
    all:
      - id: java-target-data-line-source
      - id: micro-behaviors/data/format/media/audio::audioinputstream-type
      - id: micro-behaviors/data/format/media/audio::audiosystem-write-file
