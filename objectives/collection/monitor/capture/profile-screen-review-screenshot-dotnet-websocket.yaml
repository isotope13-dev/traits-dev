defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: dotnet-websocket-screen-host-interaction
    desc: WebSocket and screen API clues
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/communications/websocket/client::dotnet-client-websocket
      - id: micro-behaviors/hardware/display/screenshot/unspecified::dotnet-copyfromscreen-capture
    any:
      - id: micro-behaviors/hardware/input/block::block-input-import
      - id: micro-behaviors/process/config/window::dotnet-console-window-option-reference
      - id: micro-behaviors/process/fd/stdio::dotnet-stdout-redirection-reference
