# Unsigned native program that walks every fixed drive and WNet share with
# Win32 find APIs and also reads back screen pixels through GDI. File
# discovery across network shares paired with display capture is spyware
# or worm tooling, not a screenshot utility or a file manager.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1113,T1135

composite_rules:
  - id: share-drive-walker-with-gdi-screen-capture
    desc: Drive and share walker with GDI screen readback
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/communications/socket/share::wnet-share-scan
      - id: micro-behaviors/fs/enumerate/drives::logical-drive-type-enumeration
      - id: micro-behaviors/fs/directory/readdir/native::find-file-walker
      - id: micro-behaviors/ui/graphics/image::gdi-getdibits
    unless:
      - id: metadata/signature/verified/platform::microsoft
