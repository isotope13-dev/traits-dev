defaults:
  platforms: [windows]
  for: [pe]
  attack: T1113
  mbc: E1113

composite_rules:
  - id: rust-rat-screen-webcam-streaming
    desc: Rust RAT screen webcam streaming
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/hardware/display/stream::screen-stream-control-labels
      - id: micro-behaviors/hardware/display/stream::screen-frame-label
    any:
      - id: micro-behaviors/hardware/display/stream::image-screen-frame-label
      - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
      - id: micro-behaviors/hardware/display/camera/
    needs: 1
  - id: rust-socketio-rat-surveillance
    desc: Rust Socket.IO RAT surveillance
    crit: hostile
    conf: 0.97
    all:
      - id: rust-rat-screen-webcam-streaming
      - id: well-known/lib/network/rust-socketio::rust-socketio-client-library
      - id: micro-behaviors/process/create/command-handler::execute-command-label
      - id: objectives/command-and-control/backdoor/dispatch/module::rat-auth-heartbeat-labels
  - id: rust-rat-collection-agent
    desc: Socket.IO command agent with multiple collection surfaces
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/backdoor/dispatch/module::rust-socketio-rat-control
    any:
      - id: micro-behaviors/hardware/display/camera::media-foundation-camera-device-enumeration
      - id: micro-behaviors/hardware/display/screen::gdi-getdibits
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data
      - id: objectives/credential-access/wifi::netsh-wlan-show-profiles
    needs: 2
