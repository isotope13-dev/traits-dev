# Covert microphone capture encoded with libmp3lame and POSTed to a C2 path.
# Class covered by Still Audio: speech VAD → MP3 via embedded lame → HTTP POST.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, python, pe, dll]
  attack: T1123,T1041

traits:
  - id: tgfrg-audio-upload-path
    desc: HTTP path used for MP3 audio upload
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)["''`]/s]/tgfrg["''`]|/tgfrg\b'

composite_rules:
  - id: lame-mp3-microphone-capture
    desc: libmp3lame encodes captured microphone audio
    crit: suspicious
    conf: 0.95
    attack: T1123
    all:
      - id: micro-behaviors/data/format/media/audio::libmp3lame-dll-name
    any:
      - id: micro-behaviors/data/format/media/audio::waveinopen-api-name
      - id: micro-behaviors/hardware/input/audio::go-wasapi-microphone-capture
      - id: micro-behaviors/hardware/input/audio::python-microphone-capture
      - id: micro-behaviors/hardware/input/audio::rust-cpal-audio-recording

  - id: lame-mp3-http-audio-exfil
    desc: Posts libmp3lame recordings over HTTP
    crit: hostile
    conf: 0.97
    all:
      - id: lame-mp3-microphone-capture
    any:
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/post/
      - id: tgfrg-audio-upload-path

  - id: client-id-mp3-upload-exfil
    desc: Client-Id header on MP3 audio upload
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/telemetry::client-id-request-header
      - id: micro-behaviors/data/format/media/audio::libmp3lame-dll-name
    any:
      - id: tgfrg-audio-upload-path
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/post/
