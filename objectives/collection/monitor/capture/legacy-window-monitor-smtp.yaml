defaults:
  for: [ne]
  platforms: [windows]
  attack: T1547.001

traits:
  - id: legacy-window-monitor-autostart-smtp
    desc: Window monitor bundles autostart and SMTP
    crit: suspicious
    conf: 0.95
    if:
      type: yara
      source: |
        rule legacy_window_monitor_autostart_smtp {
          strings:
            $window = "PROCESSCURRENTWINDOW" ascii nocase
            $filename = "GETFILENAME" ascii nocase
            $run = "SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run" ascii nocase
            $sender = "MAIL From:" ascii nocase
            $recipient = "RCPT To:" ascii nocase
          condition:
            uint16(0) == 0x5a4d and all of them
        }
