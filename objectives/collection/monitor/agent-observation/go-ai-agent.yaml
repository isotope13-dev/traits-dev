# Native Windows agents that observe multiple local AI coding products.  The
# function names are exposed by Go pclntab metadata, while the endpoint atoms
# establish that the observations are intended for an external telemetry
# service.  This is suspicious monitoring/collection behavior, not a generic
# verdict about every CLI that knows one AI tool's paths.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1005,T1041,T1119

traits:
  - id: promptster-api-host
    desc: Promptster telemetry API host
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: https://api.promptster.ai

  - id: promptster-agent-ingest-route
    desc: Promptster agent telemetry ingest route
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: /v1/teams/ingest

composite_rules:
  - id: go-cross-vendor-ai-agent-capture
    desc: Native agent watches multiple AI coding products
    crit: suspicious
    conf: 0.99
    needs: 3
    any:
      - id: micro-behaviors/data/source/function/agent-watcher::go-claude-agent-watcher-function
      - id: micro-behaviors/data/source/function/agent-watcher::go-codex-agent-watcher-function
      - id: micro-behaviors/data/source/function/agent-watcher::go-cursor-agent-watcher-function
      - id: micro-behaviors/data/source/function/agent-hook::go-cursor-agent-hook-function
      - id: micro-behaviors/data/source/function/agent-config::go-agent-config-census-function

  - id: go-ai-agent-telemetry-upload
    desc: Native multi-agent observations uploaded to telemetry service
    crit: suspicious
    conf: 0.99
    all:
      - id: go-cross-vendor-ai-agent-capture
      - id: micro-behaviors/communications/http/lib/netlib::go-http-client-do-string
      - id: promptster-api-host

  - id: go-agent-logon-autostart-manager
    desc: Native agent manages Windows logon autostart
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/source/function/names::go-windows-autostart-manager-function
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
