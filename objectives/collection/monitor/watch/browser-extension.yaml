# An extension granted the `debugger` permission alongside access to every
# site. `chrome.debugger` hands the extension the Chrome DevTools Protocol
# over a tab, which is a strictly larger capability than anything a content
# script has: it reads and rewrites the page from outside the isolated world,
# evaluates script in the page's own context, and sees every request and
# response body, headers and cookies included.
#
# The grant is the finding. Chrome shows an unmissable "started debugging this
# browser" banner while it is attached, so extensions that legitimately need
# CDP -- devtools panels, recorders, test-automation drivers -- ask for it and
# the user sees them use it. What distinguishes those is scope: they attach to
# a tab the user pointed them at. Holding `debugger` together with all-site
# host access is a standing warrant over the whole browser, and the manifest
# states it even when the code that uses it is bundled beyond reading.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, xpi, zip]
  attack: T1176
  mbc: E1113

composite_rules:
  - id: extension-debugger-grant-over-all-sites
    desc: Extension holds debugger access to all sites
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: metadata/permission/debugger::permission-debugger
    any:
      - id: metadata/permission/host::host-permission-all-http
      - id: metadata/permission/host::content-script-all-urls
      - id: metadata/permission/host::content-script-all-http
