# Monitoring - JavaScript/Node.js
# ATT&CK: T1113 (Screen Capture)
defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [javascript]
  mbc: "B0002"
  attack: "T1113"
composite_rules:
  - id: js-screenshot-exfil
    desc: "JavaScript screenshot capture exfiltration"
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/post::axios-post-call
    any:
      - id: micro-behaviors/hardware/display/screenshot
      - id: micro-behaviors/hardware/display/screen::monitor-get-displays
  - id: js-screenshot-file-write
    desc: Screen capture saved to file (potential exfil staging)
    conf: 0.85
    all:
      - id: micro-behaviors/fs/write/file/full::write-file-sync
    any:
      - id: micro-behaviors/hardware/display/screen::monitor-get-displays
      - id: micro-behaviors/hardware/display/screenshot::screenshot-capture-fn
      - id: micro-behaviors/hardware/display/screenshot::screenshot-counter-filename
