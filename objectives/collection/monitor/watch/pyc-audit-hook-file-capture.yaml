# A runtime audit hook (PEP 578) sees every file the interpreter opens. When
# the same bytecode re-opens files with low-level os.open/O_RDONLY reads,
# serializes them and holds an HTTP basic-auth opener, the hook is a file
# capture tap rather than a sandbox or profiler.
defaults:
  platforms: [unix, windows]
  for: [pyc]
  attack: T1005,T1119

composite_rules:
  - id: pyc-audit-hook-file-read-authenticated-send
    desc: Bytecode audit hook reads opened files for upload
    # Name co-occurrence only: route-near-miss.pyc carries every name but
    # routes the username, not the encoded content. Hostile needs the
    # bound bytecode flow (python314-audit-registry-content-egress).
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/code/bytecode::pyc-audit-registration-name
      - id: metadata/binary/code/bytecode::pyc-low-level-read-flag
      - id: micro-behaviors/data/serialize/json::json-dumps-pyc-name
      - id: metadata/binary/code/bytecode::pyc-basic-auth-handler-name
