defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  # Monitoring plus an encrypted bidirectional client is suspicious, not proof
  # that a particular title or idle-time value is transmitted.
  - id: encrypted-socket-foreground-idle-monitor
    desc: Encrypted socket client queries foreground titles and idle time
    crit: suspicious
    conf: 0.94
    attack: T1010
    all:
      - id: micro-behaviors/ui/window/enumerate::managed-active-window-title-api-set
      - id: micro-behaviors/hardware/input/idle-time::get-last-input-info
      - id: metadata/lang/source/naming/function/communication::dotnet-connect-async-method-token
      - id: micro-behaviors/communications/socket/receive::dotnet-receive-async-method-token
      - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
