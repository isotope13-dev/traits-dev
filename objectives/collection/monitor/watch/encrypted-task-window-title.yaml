defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1010

composite_rules:
  # Window-title references alone are ordinary UI inspection. The validated
  # encrypted shell-task backdoor provides attack admission. This does not
  # claim a binding between the returned title and a network send.
  - id: encrypted-shell-task-backdoor-window-title-references
    desc: Shell-task backdoor with window-title references
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/remote-command/shell::cil-encrypted-task-shell-dispatch
      - id: micro-behaviors/ui/window/enumerate::dotnet-main-window-title-getter-reference
