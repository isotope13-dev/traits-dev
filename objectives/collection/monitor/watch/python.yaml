defaults:
  platforms: [windows, unix]
  for:
    - python
traits:
  - id: pyperclip-paste-dup
    desc: pyperclip.paste() call
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: 'pyperclip.paste('
  - id: clipboard-get
    desc: clipboard.get() call
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: 'clipboard.get('
  - id: keyboard-on-press
    desc: keyboard.on_press hook
    crit: suspicious
    conf: 0.7
    mbc: F0002
    attack: T1056.001
    if:
      type: string_literal
      regex: keyboard\.on_press\s*\(
  - id: clipboard-library-path
    desc: Path under a vendored clipboard library
    crit: notable
    conf: 0.9
    if:
      type: path
      regex: '(^|/)clipboard/'
  - id: pyperclip-basename
    desc: pyperclip.py source file
    crit: notable
    conf: 0.9
    if:
      type: basename
      exact: pyperclip.py
composite_rules:
  - id: vendored-clipboard-library-context
    desc: Vendored clipboard library, not a consumer
    crit: exception
    conf: 0.9
    any:
      - id: clipboard-library-path
      - id: pyperclip-basename
  - id: clipboard-access
    desc: Accesses system clipboard (potential stealer)
    crit: suspicious
    conf: 0.9
    any:
      - id: objectives/collection/monitor/watch::pyperclip-paste-dup
      - id: clipboard-get
    unless:
      # The clipboard library itself, not a consumer of one: pandas ships
      # pandas/io/clipboard/__init__.py (a vendored pyperclip) and
      # prompt_toolkit ships clipboard/pyperclip.py. Reading the clipboard is
      # what they exist to do.
      - id: vendored-clipboard-library-context
    downgrade:
      any:
        - id: metadata/package/completeness/
  - id: keyboard-logger
    desc: Monitors keyboard input (potential keylogger)
    crit: notable
    conf: 0.9
    mbc: F0002
    attack: T1056.001
    any:
      - id: micro-behaviors/hardware/input/keyboard/listener::pynput-listener-constructor
      - id: keyboard-on-press
  - id: screen-capture-comp
    desc: Captures screen display
    crit: notable
    conf: 0.9
    mbc: B0002
    attack: T1113
    any:
      - id: micro-behaviors/hardware/display/screenshot::mss-screenshot
      - id: micro-behaviors/hardware/display/screen::pil-imagegrab
      - id: micro-behaviors/hardware/display/screenshot::pyautogui-screenshot
