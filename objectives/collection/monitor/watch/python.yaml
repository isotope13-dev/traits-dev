defaults:
  platforms: [windows, unix]
  for:
    - python
traits:
  # NOTE: bare pyperclip.paste() is intentionally NOT re-atomized here. The
  # canonical neutral capability micro-behaviors/os/clipboard/read::
  # pyperclip-paste already covers it; a duplicate matcher would double-count
  # one call site, and a bare paste is user copy/paste as often as theft
  # (e.g. androguard's Qt hex editor pasting hex on Shift+Insert).
  - id: keyboard-on-press
    desc: keyboard.on_press hook
    crit: suspicious
    conf: 0.7
    mbc: F0002
    attack: T1056.001
    if:
      type: string_literal
      regex: keyboard\.on_press\s*\(
composite_rules:
  # NOTE: there is intentionally no singleton "paste implies stealer" rule
  # here. A single pyperclip.paste()/clipboard.get() call is a neutral
  # capability (see micro-behaviors/os/clipboard/read/), and convicting on
  # it alone false-positives on ordinary GUI copy/paste. Stealer intent is
  # convicted by multi-leg composites elsewhere (polling loop + network
  # exfil in objectives/collection/clipboard/monitor/ and
  # objectives/exfiltration/stealer/input/).
  - id: keyboard-logger
    desc: Monitors keyboard input (potential keylogger)
    crit: notable
    conf: 0.9
    mbc: F0002
    attack: T1056.001
    any:
      - id: micro-behaviors/hardware/input/keyboard/listener::pynput-listener-constructor
      - id: keyboard-on-press
  - id: screen-capture-comp
    desc: Captures screen display
    crit: notable
    conf: 0.9
    mbc: B0002
    attack: T1113
    any:
      - id: micro-behaviors/hardware/display/screenshot::mss-screenshot
      - id: micro-behaviors/hardware/display/screen::pil-imagegrab
      - id: micro-behaviors/hardware/display/screenshot::pyautogui-screenshot
