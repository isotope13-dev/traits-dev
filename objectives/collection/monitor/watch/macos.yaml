defaults:
  platforms: [macos]
  for: [macho, dylib]

composite_rules:
  # Foreground-application and process-ID queries are ordinary window/input
  # plumbing. Requiring an idle/lock-state probe makes the observation an
  # actual user-activity monitor rather than labeling any UI helper as spying.
  - id: macos-user-activity-monitor
    desc: macOS monitors foreground application and user activity state
    crit: suspicious
    conf: 0.93
    attack: T1010
    mbc: B0042
    all:
      - id: micro-behaviors/ui/window/manage/enumerate::get-frontmost-application
      - id: micro-behaviors/process/info/query::macos-process-identifier
    any:
      - id: objectives/discovery/system/hardware/sysctl::ioreg-screen-lock
      - id: micro-behaviors/hardware/input/idle-time::macos-hid-idle-time
    unless:
      - id: well-known/tool/reverse-engineering/frida/
      - id: well-known/app/development/easycode::easycode-window-info-utility
      - id: well-known/app/storage/carbon-copy-cloner::official-carbon-copy-cloner-member
      - id: well-known/app/development/hammerspoon::hammerspoon-application-context
    downgrade:
      any:
        - id: metadata/binary/vendor/
        - id: metadata/signed/platform::apple
