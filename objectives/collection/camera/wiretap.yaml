# The tool roster identifies the keystroke and credential-phrase surveillance
# program; the DirectShow evidence adds video-frame acquisition capability.
defaults:
  for: [pe]
  platforms: [windows]
  crit: hostile
  conf: 0.97
  attack: T1125
composite_rules:
  - id: wiretap-video-frame-surveillance
    desc: WireTap surveillance with video frame capture
    all:
      - id: well-known/tool/offensive/wiretap::surveillance-command-roster
      - id: micro-behaviors/hardware/input/video::dotnet-directshow-frame-input
