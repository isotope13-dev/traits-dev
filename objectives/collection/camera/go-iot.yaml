defaults:
  platforms: [unix, windows]
  for: [go]
  attack: T1125

composite_rules:
  - id: go-auth-bypass-camera-snapshot
    for: [go, tar, zip]
    desc: Camera bypass with snapshot output indicators
    crit: hostile
    conf: 0.99
    attack: T1125,T1210
    scope: outer
    all:
      - id: micro-behaviors/communications/http/url/endpoint::camera-snapshot-cgi-endpoint
      - id: micro-behaviors/data/decode/jpeg::go-jpeg-decode
      - id: micro-behaviors/fs/path/media::go-jpeg-filename-template
      - id: micro-behaviors/fs/write/file/full::go-os-writefile
      - id: micro-behaviors/data/serialize/object::session-zero-field
    any:
      - id: objectives/lateral-movement/exploit/network-device/auth-bypass::dahua-netkeyboard-auth-bypass
      - id: objectives/lateral-movement/exploit/network-device/auth-bypass::dahua-loopback-auth-bypass
