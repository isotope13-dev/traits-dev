defaults:
  platforms: [unix, windows]
  for: [go]
  attack: T1123

composite_rules:
  - id: go-compromised-camera-snapshot
    for: [go, tar, zip]
    desc: Compromised IoT camera snapshot collection
    crit: hostile
    conf: 0.99
    attack: T1123,T1210
    scope: outer
    all:
      - id: micro-behaviors/communications/http/url/endpoint::camera-snapshot-cgi-endpoint
      - id: micro-behaviors/data/embedded/payload/image::go-jpeg-decoder-import
      - id: micro-behaviors/fs/path/media::go-jpeg-filename-template
      - id: metadata/file/function::go-cve-probe-function-name
      - id: micro-behaviors/data/serialize/object::session-zero-field
      - id: micro-behaviors/communications/http/url/endpoint::dahua-config-retrieval-endpoint
      - id: micro-behaviors/os/user/account::dahua-add-user-endpoint
    any:
      - id: micro-behaviors/os/user/account::admin-group-selection
      - id: micro-behaviors/os/user/account::primary-admin-group-selection
