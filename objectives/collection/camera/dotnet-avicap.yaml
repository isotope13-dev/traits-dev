# Webcam capture inside a remotely tasked .NET implant: avicap32 device
# enumeration and a Video for Windows capture window in an assembly that
# also runs an operator-tasked redirected shell. Webcam apps capture video
# too; the tasked-shell leg is what makes this covert collection.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1125
  mbc: E1125

composite_rules:
  - id: dotnet-tasked-implant-webcam-capture
    desc: Remotely tasked .NET implant captures the webcam
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/hardware/input/video::avicap32-device-enum
      - id: micro-behaviors/hardware/display/camera::vfw-capture-window
      - id: objectives/command-and-control/backdoor/dispatch/shell/interactive::managed-tasked-redirected-shell
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
  # Screen plus webcam capture with AES-backed HTTP in an unsigned
  # assembly: conferencing apps capture too, but not alongside encrypted
  # C2, staged downloads, and no signature. Distinct from the tasked-shell
  # sibling above: this is the capture-suite shape without shell tasking.
  - id: dotnet-screen-webcam-encrypted-capture-suite
    desc: Unsigned implant captures screen and webcam over encrypted C2
    crit: hostile
    conf: 0.94
    attack: T1113,T1125
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/hardware/display/screenshot::copyfromscreen-dotnet
      - id: micro-behaviors/hardware/input/video::avicap32-device-enum
      - id: micro-behaviors/hardware/display/camera::vfw-capture-window
      - id: micro-behaviors/communications/http/client/managed::dotnet-http-client-with-aes
      - id: micro-behaviors/communications/http/client/managed::dotnet-downloadfile-token
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
