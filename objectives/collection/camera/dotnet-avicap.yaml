# Require a frame-grab/save message as well as the remotely tasked shell.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1125
  mbc: E1125

composite_rules:
  - id: dotnet-tasked-implant-webcam-capture
    desc: Tasked .NET implant with VFW frame-capture references
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/hardware/input/video::avicap32-device-enum
      - id: micro-behaviors/hardware/display/camera::vfw-capture-window
      - id: micro-behaviors/hardware/display/camera::vfw-frame-grab-message
      - id: objectives/command-and-control/backdoor/dispatch/shell/interactive::managed-tasked-redirected-shell
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
