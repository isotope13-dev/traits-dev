defaults:
  for: [python, javascript, shell]
  platforms: [unix, windows]
traits:
  - id: font-api-nonfont-file-read
    desc: Font API reads non-font system path
    crit: hostile
    conf: 0.99
    if:
      type: text
      regex: 'GetFontBinary\s*\(\s*["\x27]/etc/(passwd|shadow|hostname)["\x27]'
