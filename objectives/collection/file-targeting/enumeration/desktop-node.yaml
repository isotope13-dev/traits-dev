defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
composite_rules:
  - id: desktop-dir-search
    for: [javascript]
    desc: Searching Desktop directory specifically
    conf: 0.8
    crit: suspicious
    attack: T1005
    near_lines: 35
    near_bytes: 2048
    all:
      - id: micro-behaviors/fs/path/app-data::desktop-path-token
      - id: micro-behaviors/process/user/query::os-homedir-call
      - id: micro-behaviors/fs/directory/readdir::node-readdir-repeated
