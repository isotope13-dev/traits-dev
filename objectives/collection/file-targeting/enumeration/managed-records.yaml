# Keylog recording supplies abuse context. Generic file reads and Base64
# alone also describe ordinary backup programs.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # File collection does not require a particular HTTP client or a send.
  # The references do not establish that the read bytes reach the network.
  - id: managed-keylogger-file-targeting-records
    desc: Managed keylogger with file-list, read and data-record references
    crit: hostile
    conf: 0.97
    attack: T1005
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: micro-behaviors/data/format/string::file-data-record-prefix
      - id: metadata/binary/symbols/name::dotnet-getfiles-method-name
      - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
      - id: micro-behaviors/data/encode/base64::dotnet-to-base64string-text
