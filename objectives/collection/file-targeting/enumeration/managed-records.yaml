# Keylog recording supplies abuse context. Generic file reads,
# Base64 and HTTP clients alone also describe ordinary backup programs.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-file-record-upload-api-references
    desc: File-data acquisition records and upload APIs
    crit: hostile
    conf: 0.97
    attack: T1005
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: micro-behaviors/data/format/string::file-data-record-prefix
      - id: micro-behaviors/fs/enumerate/directory::get-files-token
      - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
      - id: micro-behaviors/data/encode/base64::dotnet-to-base64string-text
      - id: micro-behaviors/communications/http/client/managed::uploadstring
