defaults:
  crit: suspicious
  platforms: [windows]
  for: [powershell]
  attack: T1083

traits:
  - id: powershell-placeholder-recursive-enumeration
    desc: PowerShell templated recursive file enumeration
    conf: 0.9
    if:
      type: text
      regex: 'Get-ChildItem\s+["'']~STARTDIR~["'']\s+-Recurse\s+-Depth\s+~DEPTH~'
      case_insensitive: true

composite_rules:
  - id: powershell-recent-recursive-file-filter
    desc: PowerShell finds recently modified files
    conf: 0.97
    attack: T1083,T1119
    near_bytes: 2200
    all:
      - id: micro-behaviors/time/query::powershell-past-date-cutoff
      - id: micro-behaviors/fs/directory/traverse::powershell-recursive-child-item
      - id: micro-behaviors/fs/file/timestamp::powershell-lastwrite-lower-bound

  - id: powershell-templated-file-enumeration
    desc: PowerShell templated file enumeration
    conf: 0.92
    all:
      - id: powershell-placeholder-recursive-enumeration
      - id: micro-behaviors/fs/enumerate/directory::powershell-fullname-collection
