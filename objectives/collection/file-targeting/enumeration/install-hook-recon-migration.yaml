defaults:
  platforms:
  - unix
  - windows
composite_rules:
- id: npm-oob-callback-recon
  desc: NPM package enumerates files and contacts OOB service
  crit: suspicious
  conf: 0.9
  attack: T1083
  mbc: E1041
  scope: leaf
  all:
  - id: metadata/package/scripts/lifecycle::install-hooks
  - id: metadata/file/size::javascript-small-file-5k
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/fs/directory/readdir/language::node-readdir-repeated
