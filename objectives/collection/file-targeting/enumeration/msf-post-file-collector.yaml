defaults:
  for: [ruby, makefile]
  platforms: [windows]

composite_rules:
  - id: msf-post-file-collector
    desc: Metasploit post module collects host files as loot
    crit: hostile
    conf: 0.97
    attack: T1005
    all:
      - id: well-known/tool/offensive/metasploit::post-exploit-class-declaration
      - id: well-known/tool/offensive/metasploit::msf-store-loot-call
      - id: micro-behaviors/fs/search/name::meterpreter-file-search
    any:
      - id: well-known/tool/offensive/metasploit::meterpreter-session-types
      - id: micro-behaviors/fs/enumerate/drives::meterpreter-railgun-logical-drives
