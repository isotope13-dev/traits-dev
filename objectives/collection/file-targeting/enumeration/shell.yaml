# A skill script that enumerates files for collection. The upload rules
# under exfiltration/http convict the transport; this states the collection
# -- walking the filesystem quietly (`find -type f` into curl -s) is
# reconnaissance for exfiltration, and a silent flag on the transfer is what
# keeps the victim from noticing the read.
#
# Worked examples: the firecrawl/vercel-deploy skill forks whose helpers
# enumerate files and hand each to a silent curl upload.
#
# The `find` and the transfer must be the same helper (near_bytes) and the
# curl must actually carry a local file out (`-T`/`-F`/`--upload-file`/
# `--data-binary @`). Without both, the rule convicted every release/install
# script in existence: they all fetch with `curl -fsSL` somewhere and all
# `find` the extracted tree for their binary somewhere else in the file --
# observed in slskdN's packaging/smoke/package-smoke, where `curl -fsSL "$url"
# -o ...` downloads the release archive and, 40 lines later, `find
# "$tmp_dir/archive" -type f ... -perm /111` locates the extracted executable.
# A download (`-o`/`-O`) is the opposite direction from collection.
defaults:
  platforms: [unix, windows]
  for: [shell, scripts, markdown, text]
  attack: T1005,T1083

composite_rules:
  - id: silent-find-file-enumeration-upload
    desc: Silent file enumeration feeding curl upload
    crit: hostile
    conf: 0.95
    near_bytes: 512
    all:
      - id: micro-behaviors/fs/directory/traverse::find-type-file
      - id: micro-behaviors/communications/http/download/curl::curl-silent
    any:
      - id: micro-behaviors/communications/http/upload::curl-upload-file
      - id: micro-behaviors/communications/http/upload::curl-post-data-binary-file
