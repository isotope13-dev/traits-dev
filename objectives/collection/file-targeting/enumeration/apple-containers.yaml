defaults:
  platforms: [ios, macos]
  for: [javascript, typescript, c, cpp, macho]
  crit: suspicious
  conf: 0.94

composite_rules:
  - id: apple-container-cookie-targeting
    desc: PID container lookup near Apple cookie-store paths
    # Discovery of other application containers is distinct from exporting
    # their contents. Neither a sandbox escape nor a successful read is claimed.
    near_bytes: 2048
    all:
      - id: micro-behaviors/fs/path/cookie::safari-binary-cookies
    any:
      - id: micro-behaviors/process/info/query::apple-pid-container-path
      - id: micro-behaviors/process/info/query::apple-pid-container-path-dispatch
