# File Enumeration Pattern
# Detects malware searching files for encryption/infection
# Generic indicator for ransomware, worms, data exfiltration
# file-find-api removed - use micro-behaviors/fs/enumerate/directory::find-first-file-ex instead
defaults:
  platforms: [windows]
  for: [pe]
  mbc: "C0000"
  attack: "T1083"
composite_rules:
  - id: sensitive-file-enumeration
    desc: File traversal and access targeting credential-bearing paths
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/enumerate/directory::file-enumeration-with-access
    any:
      - id: micro-behaviors/fs/path/sensitive/credentials/
      - id: micro-behaviors/fs/path/sensitive/browser/
      - id: micro-behaviors/fs/path/application/browser/
      - id: objectives/collection/file-targeting/filter::credential-file-path
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
      - id: metadata/binary/installer/family::inno-uninstaller-runtime
      - id: well-known/unwanted/amonetize::aminsis-plugin-library-context
