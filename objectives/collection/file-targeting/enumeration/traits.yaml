defaults:
  platforms:
  - windows
  for:
  - pe
  mbc: C0000
  attack: T1083
composite_rules:
- id: sensitive-file-enumeration
  desc: File traversal APIs with credential-path evidence
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/fs/directory/readdir/native::file-enumeration-with-access
  any:
  - id: micro-behaviors/fs/path/credential::any-credential-path
  - id: micro-behaviors/fs/path/credential::credential-path-or-filename
  unless:
  - id: well-known/tool/browser::chromium-browser-engine-runtime
  - id: well-known/lib/network/libssh2::credential-default-library-context
  - id: well-known/tool/packaging/inno-setup-runtime::inno-uninstaller-runtime
  - id: well-known/unwanted/amonetize::aminsis-plugin-library-context
  - id: well-known/lib/vendor-sdk/nsoftware-ipworks::ipworks-library-benign-context
  - id: well-known/lib/cloud/aws-sdk-rust::rust-aws-config-crate
  - id: metadata/file/catalog/file-type::extension-mime-table
  - id: metadata/file/catalog/file-type::packed-build-manifest-filename-table
  - id: well-known/lib/runtime/scripted/bun-runtime::bun-single-file-compile-context

