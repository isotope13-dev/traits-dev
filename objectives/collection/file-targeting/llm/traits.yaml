# LLM-driven collection prompts are useful intent evidence only when paired
# with the model-response execution boundary. Match the requested objective,
# not a malware-family name or a fixed prompt spelling.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, go, rust, lua, powershell, shell, batch]
  attack: T1005,T1083

traits:
  - id: host-profile-gather-computer
    desc: LLM prompt requests system details
    crit: suspicious
    conf: 0.94
    if:
      type: literal
      kind: string
      regex: '(?i)\bprompt\b.{0,60}\b(gather|collect)\b.{0,60}\b(computer|system|hardware)\b'

  - id: encoded-host-profile-gather-computer
    desc: Encoded host profiling prompt
    crit: suspicious
    conf: 0.96
    if:
      type: encoded
      encoding: [base64, base64-obf, hex, xor, base32, base85, stack, wide]
      # Require the prompt boundary used by the literal form.
      # Without it, decoded source maps match ordinary compiler prose such as
      # "gather information for the user's program".
      regex: '(?i)\bprompt\b.{0,60}\b(gather|collect)\b.{0,60}\b(computer|system|hardware)\b'

  - id: host-profile-enumerate-runtime
    desc: LLM prompt requests runtime enumeration
    crit: suspicious
    conf: 0.94
    if:
      type: literal
      kind: string
      regex: '(?i)\bprompt\b.{0,60}\b(collect|enumerate)\b.{0,60}\b(process|network|service)s?\b'

  - id: encoded-host-profile-enumerate-runtime
    desc: Encoded runtime enumeration prompt
    crit: suspicious
    conf: 0.96
    if:
      type: encoded
      encoding: [base64, base64-obf, hex, xor, base32, base85, stack, wide]
      regex: '(?i)\bprompt\b.{0,60}\b(gather|collect|enumerate)\b.{0,60}\b(process|network|service)s?'

  - id: host-profile-domain-enumeration
    desc: Prompt directs host account enumeration
    crit: suspicious
    conf: 0.94
    if:
      type: literal
      kind: string
      # Bind the enumeration verb to its account object. A UI docstring such
      # as "display selection prompt and collect user's choice" is not host
      # reconnaissance merely because those words occur in the same string.
      regex: '(?i)\bprompt\b.{0,60}\b(collect|enumerate)\s+(local users?|domain (users?|accounts?))\b'
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/

  - id: encoded-host-profile-domain-enumeration
    desc: Encoded host account-enumeration prompt
    crit: suspicious
    conf: 0.96
    if:
      type: encoded
      encoding: [base64, base64-obf, hex, xor, base32, base85, stack, wide]
      regex: '(?i)\bprompt\b.{0,60}\b(collect|enumerate)\s+(local users?|domain (users?|accounts?))\b'
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/

  - id: document-collection-command
    desc: LLM prompt requests document copying
    crit: suspicious
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '(?i)\bprompt\b.{0,60}\b(copy|collect)\b.{0,80}\b(office|pdf|txt)\b'

  - id: encoded-document-collection-command
    desc: Encoded document collection prompt
    crit: suspicious
    conf: 0.97
    if:
      type: encoded
      encoding: [base64, base64-obf, hex, xor, base32, base85, stack, wide]
      # Bundled source maps can decode ordinary copy helpers and file-format
      # names. Require the same explicit prompt marker as the literal rule.
      regex: '(?i)\bprompt\b.{0,80}\b(copy|collect)\b.{0,80}\b(office|pdf|txt)\b'

  # A model prompt that asks for both a search operation and developer
  # credential material is useful intent evidence. Keep it bounded to string
  # literals (including decoded literals) and combine it with model-output
  # execution and real credential paths before inferring a hostile objective.
  - id: credential-search-remote-key-prompt
    desc: AWS/SSH credential search instruction
    crit: suspicious
    conf: 0.97
    if:
      type: literal
      kind: string
      regex: '\bprompt\b.{0,80}\b(search|find|scan)\s+(for|in|from)\s+(AWS|SSH)\w*\s+(key|credential)'
      case_insensitive: true
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/lib/ai/pyaigis::pyaigis-context

  - id: credential-search-secret-prompt
    desc: Credential search instruction names secrets
    crit: suspicious
    conf: 0.97
    if:
      type: literal
      kind: string
      regex: '\bprompt\b.{0,80}\b(search|find|scan)\s+(for|in|from)\s+(credential|secret|token|password)'
      case_insensitive: true
    unless:
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/lib/ai/pyaigis::pyaigis-context
      - id: well-known/tool/detection/agent-glovebox::archive-context

  - id: encoded-credential-search-remote-key-prompt
    desc: Encoded AWS/SSH search instruction
    crit: suspicious
    conf: 0.98
    if:
      type: encoded
      encoding: [base64, base64-obf, hex, xor, base32, base85, stack, wide]
      regex: '\bprompt\b.{0,80}\b(search|find|scan)\s+(for|in|from)\s+(AWS|SSH)\w*\s+(key|credential)'
      case_insensitive: true
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/lib/ai/pyaigis::pyaigis-context

  - id: encoded-credential-search-secret-prompt
    desc: Encoded credential search instruction
    crit: suspicious
    conf: 0.98
    if:
      type: encoded
      encoding: [base64, base64-obf, hex, xor, base32, base85, stack, wide]
      regex: '\bprompt\b.{0,80}\b(search|find|scan)\s+(for|in|from)\s+(credential|secret|token|password)'
      case_insensitive: true
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/lib/ai/pyaigis::pyaigis-context

composite_rules:
  - id: llm-host-profile-collection-request
    desc: LLM requests host reconnaissance
    crit: suspicious
    conf: 0.96
    any:
      - id: host-profile-gather-computer
      - id: encoded-host-profile-gather-computer
      - id: host-profile-enumerate-runtime
      - id: encoded-host-profile-enumerate-runtime
      - id: host-profile-domain-enumeration
      - id: encoded-host-profile-domain-enumeration

  - id: llm-document-collection-request
    desc: LLM requests document harvesting
    crit: suspicious
    conf: 0.97
    any:
      - id: document-collection-command
      - id: encoded-document-collection-command

  - id: llm-credential-collection-request
    desc: LLM requests local cloud and SSH credential discovery
    crit: suspicious
    conf: 0.98
    any:
      - id: credential-search-remote-key-prompt
      - id: credential-search-secret-prompt
      - id: encoded-credential-search-remote-key-prompt
      - id: encoded-credential-search-secret-prompt

  - id: llm-generated-host-recon
    desc: Executes LLM-generated host reconnaissance
    crit: hostile
    conf: 0.99
    attack: T1007,T1012,T1016,T1049,T1057,T1082,T1087
    all:
      - id: objectives/execution/interpreter/eval/generated::llm-generated-command-execution
      - id: llm-host-profile-collection-request
    near_bytes: 4000

  - id: llm-generated-document-collection
    desc: Executes LLM-generated document collection
    crit: hostile
    conf: 0.99
    attack: T1005,T1083,T1059
    all:
      - id: objectives/execution/interpreter/eval/generated::llm-generated-command-execution
      - id: llm-document-collection-request
    near_bytes: 4000

  - id: llm-generated-credential-collection
    desc: Executes LLM-generated local credential collection
    crit: hostile
    conf: 0.99
    attack: T1005,T1059,T1552.001,T1552.004
    all:
      - id: objectives/execution/interpreter/eval/generated::llm-generated-command-execution
      - id: llm-credential-collection-request
    any:
      - id: micro-behaviors/fs/path/sensitive/cloud::aws-credentials
      - id: micro-behaviors/fs/path/sensitive/credentials::ssh-private-key
      - id: objectives/credential-access/ssh/key::private-key-path
    near_bytes: 6000
