defaults:
  platforms: [windows]
  for: [pe, c, cpp, csharp, source]
  attack: T1005
  mbc: B0030

traits:
  - id: server-file-table-token
    desc: Server-provided file table token
    crit: notable
    conf: 0.82
    if:
      type: text
      # `file_hashes` is a generic protobuf/JSON field (Grafeas provenance,
      # cloud APIs) and is not a C2 file-table token on its own.
      regex: '(?i)\b(getFileTable|FileHashTable)\b'
    unless:
      - id: well-known/lib/ui/
      - id: well-known/lib/network/go-telegram-bot-api::library-source-context
