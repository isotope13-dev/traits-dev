# Remote file-list-driven collection.
# Kimsuky's exfiltration module fetched a precise path list, copied only listed
# files, then staged and uploaded the result. These rules describe that flow,
# rather than naming a malware family or fixing one infrastructure IOC.
defaults:
  platforms: [unix, windows]
  for: [vbs, powershell, python, javascript, typescript]
  attack: T1005,T1071.001,T1560.001,T1041

traits:
  - id: vbs-http-get
    desc: VBScript HTTP GET request
    crit: notable
    conf: 0.95
    for: [vbs]
    platforms: [windows]
    if:
      type: text
      regex: '\b[A-Za-z_]\w*\s*\.\s*Open\s+["'']GET["'']'

  - id: vbs-response-split
    desc: VBScript splits response text
    crit: notable
    conf: 0.95
    for: [vbs]
    platforms: [windows]
    if:
      type: text
      regex: '\bSplit\s*\([^)]{0,120}\.\s*ResponseText\b'

  - id: vbs-path-loop
    desc: VBScript loops over paths
    crit: notable
    conf: 0.92
    for: [vbs]
    platforms: [windows]
    if:
      type: text
      regex: '\bFor\s+Each\s+[A-Za-z_]\w*\s+In\s+Split\s*\('

  - id: vbs-file-existence-check
    desc: VBScript checks a file path
    crit: notable
    conf: 0.92
    for: [vbs]
    platforms: [windows]
    if:
      type: text
      regex: '\.\s*FileExists\s*\('

  - id: vbs-file-copy
    desc: VBScript copies a file
    crit: notable
    conf: 0.92
    for: [vbs]
    platforms: [windows]
    if:
      type: text
      regex: '\.\s*CopyFile\b'

  - id: powershell-http-fetch
    desc: PowerShell downloads HTTP content
    crit: notable
    conf: 0.93
    for: [powershell]
    if:
      type: text
      regex: '\bInvoke-WebRequest\b|\bInvoke-RestMethod\b'

  - id: powershell-content-split
    desc: PowerShell splits downloaded content
    crit: notable
    conf: 0.93
    for: [powershell]
    if:
      type: text
      regex: '\.(Content|RawContent)\b[\s\S]{0,100}(-split|\.Split\s*\()'

  - id: powershell-path-loop
    desc: PowerShell loops over paths
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      regex: '\bforeach\s*\(\s*\$[A-Za-z_]\w*\s+in\b'

  - id: powershell-file-existence-check
    desc: PowerShell checks a file path
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: text
      word: Test-Path

  - id: powershell-file-copy
    desc: PowerShell copies a file
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: text
      word: Copy-Item

  - id: python-http-fetch
    desc: Python fetches HTTP content
    crit: notable
    conf: 0.93
    for: [python]
    if:
      type: text
      regex: '\b(requests|httpx)\.(get|post)\s*\('

  - id: python-path-split
    desc: Python splits downloaded content
    crit: notable
    conf: 0.93
    for: [python]
    if:
      type: text
      regex: '\.(text|content)\.(splitlines|split)\s*\('

  - id: python-file-selection
    desc: Python checks and copies a file
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: text
      regex: 'os\.path\.exists\s*\([^)]{0,80}\)[\s\S]{0,160}shutil\.copy2?\s*\('

  - id: javascript-response-split
    desc: JavaScript splits response text
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.text\s*\(\s*\)\s*\.\s*split\s*\('

  - id: javascript-file-selection
    desc: JavaScript checks and copies a file
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: 'existsSync\s*\(\s*[A-Za-z_$][\w$]*\s*\)[\s\S]{0,160}copyFile(Sync)?\s*\('

  - id: vbs-http-post
    desc: VBScript HTTP POST request
    crit: notable
    conf: 0.95
    for: [vbs]
    platforms: [windows]
    if:
      type: text
      regex: '\b[A-Za-z_]\w*\s*\.\s*Open\s+["'']POST["'']'

composite_rules:
  - id: vbs-remote-file-list
    desc: VBScript processes a remote path list
    crit: hostile
    conf: 0.99
    all:
      - id: vbs-http-get
      - id: vbs-response-split
      - id: vbs-path-loop
      - id: vbs-file-existence-check
      - id: vbs-file-copy
    near_bytes: 4096

  - id: powershell-remote-file-list
    desc: PowerShell processes a remote path list
    crit: hostile
    conf: 0.99
    all:
      - id: powershell-http-fetch
      - id: powershell-content-split
      - id: powershell-path-loop
      - id: powershell-file-existence-check
      - id: powershell-file-copy
    near_bytes: 4096

  - id: python-remote-file-list
    desc: Python processes a remote path list
    crit: hostile
    conf: 0.99
    all:
      - id: python-http-fetch
      - id: python-path-split
      - id: micro-behaviors/data/control-flow/analysis::for-loop-content
      - id: python-file-selection
    near_bytes: 4096

  - id: javascript-remote-file-list
    desc: JavaScript processes a remote path list
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: javascript-response-split
      - id: javascript-file-selection
    near_bytes: 4096

  - id: remote-file-list-targeted-collection
    desc: Selective collection from a remote path list
    crit: hostile
    conf: 0.995
    any:
      - id: vbs-remote-file-list
      - id: powershell-remote-file-list
      - id: python-remote-file-list
      - id: javascript-remote-file-list

  - id: archive-creation-for-remote-list
    desc: Archives remotely selected files
    crit: hostile
    conf: 0.995
    all:
      - id: remote-file-list-targeted-collection
    any:
      - id: objectives/collection/archive/compress::powershell-compress-archive
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-writer
      - id: micro-behaviors/data/archive/library::archiver
    near_bytes: 8192

  - id: archive-http-post
    desc: Sends an HTTP POST request
    crit: notable
    conf: 0.94
    any:
      - id: vbs-http-post
      - id: micro-behaviors/communications/http/request/result::http-post-client-call
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/post::powershell-post-method

  - id: remote-file-list-archive-upload
    desc: Uploads an archive of selected files
    crit: hostile
    conf: 0.995
    all:
      - id: archive-creation-for-remote-list
      - id: archive-http-post
    any:
      - id: micro-behaviors/communications/http/header/content-type::archive-media-type-reference
    near_bytes: 8192
