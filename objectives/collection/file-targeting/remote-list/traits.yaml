# Remote file-list-driven collection.
# Kimsuky's exfiltration module fetched a precise path list, copied only listed
# files, then staged and uploaded the result. These rules describe that flow,
# rather than naming a malware family or fixing one infrastructure IOC.
defaults:
  platforms: [unix, windows]
  for: [vbs, powershell, python, javascript, typescript]
  attack: T1005,T1071.001,T1560.001,T1041

traits:
  - id: vbs-http-get
    desc: VBScript HTTP GET request
    crit: notable
    conf: 0.95
    for: [vbs]
    platforms: [windows]
    if:
      type: text
      regex: '\b[A-Za-z_]\w*\s*\.\s*Open\s+["'']GET["'']'

  - id: vbs-response-split
    desc: VBScript splits response text
    crit: notable
    conf: 0.95
    for: [vbs]
    platforms: [windows]
    if:
      type: text
      regex: '\bSplit\s*\([^)]{0,120}\.\s*ResponseText\b'

  - id: vbs-path-loop
    desc: VBScript loops over paths
    crit: notable
    conf: 0.92
    for: [vbs]
    platforms: [windows]
    if:
      type: text
      regex: '\bFor\s+Each\s+[A-Za-z_]\w*\s+In\s+Split\s*\('

  - id: powershell-content-split
    desc: PowerShell splits downloaded content
    crit: notable
    conf: 0.93
    for: [powershell]
    unless:
      # Installer checksum lines use .Content.Split on a SHA256 hex string.
      - type: text
        regex: '(?i)(sha256|Get-FileHash|checksum)'
    if:
      type: text
      regex: '\.(Content|RawContent)\b[\s\S]{0,100}(-split|\.Split\s*\()'

  # `python-http-fetch` was a bare `requests|httpx . get|post (` regex living in
  # this collection objective. It duplicated the canonical requests/httpx call
  # atoms under micro-behaviors/communications/http/, so every library that
  # makes an ordinary HTTP call reported a file-targeting objective as well as
  # the capability. The composite below now references those atoms directly and
  # supplies the file-targeting intent from its own remaining legs.

  - id: javascript-response-split
    desc: JavaScript splits fetch response text
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.then\s*\([^)]{0,200}\.text\s*\(\s*\)\s*\.\s*split\s*\('
  - id: vbs-http-post
    desc: VBScript HTTP POST request
    crit: notable
    conf: 0.95
    for: [vbs]
    platforms: [windows]
    if:
      type: text
      regex: '\b[A-Za-z_]\w*\s*\.\s*Open\s+["'']POST["'']'

composite_rules:
  - id: vbs-remote-file-list
    desc: VBScript processes a remote path list
    crit: hostile
    conf: 0.99
    all:
      - id: vbs-http-get
      - id: vbs-response-split
      - id: vbs-path-loop
      - id: micro-behaviors/fs/path/check::fso-file-exists
      - id: micro-behaviors/fs/file/copy::fso-copyfile
    near_bytes: 4096

  - id: powershell-remote-file-list
    desc: PowerShell processes a remote path list
    crit: hostile
    conf: 0.99
    all:
      - id: powershell-content-split
      - id: micro-behaviors/data/control-flow/loop::powershell-foreach-loop
      - id: micro-behaviors/fs/path/check::test-path
      - id: micro-behaviors/fs/file/copy::powershell-copy-item-command
    any:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/communications/http/download/cli::iwr-response-content-access
    near_bytes: 4096

  - id: python-remote-file-list
    desc: Python processes a remote path list
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/string/split::python-content-field-split
      - id: micro-behaviors/data/control-flow/analysis::for-loop-content
      - id: micro-behaviors/fs/file/copy::python-exists-and-copy
    any:
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/communications/http/lib/requests::requests-post
    near_bytes: 4096

  - id: javascript-remote-file-list
    desc: JavaScript processes a remote path list
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: javascript-response-split
      - id: micro-behaviors/fs/file/copy::js-exists-and-copy
    near_bytes: 4096

  - id: remote-file-list-targeted-collection
    desc: Selective collection from a remote path list
    crit: hostile
    conf: 0.995
    any:
      - id: vbs-remote-file-list
      - id: powershell-remote-file-list
      - id: python-remote-file-list
      - id: javascript-remote-file-list

  - id: archive-creation-for-remote-list
    desc: Archives remotely selected files
    crit: hostile
    conf: 0.995
    all:
      - id: remote-file-list-targeted-collection
    any:
      - id: objectives/collection/archive/compress::powershell-compress-archive
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-writer
      - id: micro-behaviors/data/archive/library::archiver
    near_bytes: 8192

  - id: archive-post-upload-request
    desc: Posts an archive created from a remote file list
    crit: component
    conf: 0.94
    all:
      - id: archive-creation-for-remote-list
    any:
      - id: vbs-http-post
      - id: micro-behaviors/communications/http/request/result::http-post-client-call
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/post::powershell-post-method
    needs: 1
    near_bytes: 8192

  - id: remote-file-list-archive-upload
    desc: Uploads an archive of selected files
    crit: hostile
    conf: 0.995
    all:
      - id: archive-post-upload-request
    any:
      - id: micro-behaviors/communications/http/header/content-type::archive-media-type-reference
    near_bytes: 8192
