defaults:
  platforms: [unix]
  for: [javascript]

composite_rules:
  - id: local-file-fallback-targeting
    desc: Flag path and passwd file access
    crit: suspicious
    conf: 0.99
    attack: T1005
    all:
      - id: micro-behaviors/fs/path/challenge-flag::container-flag-path
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd-node-fs-call
