defaults:
  platforms: [macos]
  attack: "T1041"
  for: [macho]

traits: []

composite_rules:
  - id: macos-credential-file-targeting
    desc: Targets credential and remote-access files
    crit: notable
    conf: 0.85
    needs: 2
    any:
      - id: micro-behaviors/fs/path/private-key::putty-key-extension-reference
      - id: micro-behaviors/fs/path/certificate::pem-file-extension-reference
      - id: micro-behaviors/fs/path/config/app::rdp-file-reference
  # Credential targeting + hardware fingerprinting + network = stealer
