defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]

composite_rules:
- id: npm-install-dockerfile-profile
  for:
  - packagejson
  desc: Install hook profiles Dockerfiles
  crit: suspicious
  conf: 0.98
  attack: T1083
  all:
  - id: metadata/package/scripts/entrypoint::install-runs-node-local-script
  - id: micro-behaviors/fs/search/name::dockerfile-hunt-root
  any:
  - id: metadata/lang/source/naming/setting::dockerfile-workdir-keyword
  - id: micro-behaviors/fs/read/file/content/unspecified::read-node
  - id: metadata/lang/source/naming/target::typed-recon-callback-labels
