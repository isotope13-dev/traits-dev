defaults:
  platforms: [unix]
  for: [javascript, typescript, shell]
  attack: T1083

traits:
  - id: find-chat-name-glob
    desc: Find command targets chat-named files
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '-name\s+[''"]\*chat\*[''"]'
  - id: find-message-name-glob
    desc: Find command targets message-named files
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '-name\s+[''"]\*message\*[''"]'
  - id: find-conversation-name-glob
    desc: Find command targets conversation-named files
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '-name\s+[''"]\*conversation\*[''"]'

composite_rules:
  - id: messaging-file-root-sweep
    desc: Root filesystem sweep targets messaging files
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/search::find-from-filesystem-root
    any:
      - id: find-chat-name-glob
      - id: find-message-name-glob
      - id: find-conversation-name-glob
    needs: 3
