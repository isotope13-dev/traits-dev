defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell]

composite_rules:
- id: llm-cli-filesystem-inventory
  desc: LLM execution and filesystem inventory clues
  crit: suspicious
  conf: 0.985
  all:
  - id: micro-behaviors/data/llm/session::ai-agent-bypass-flag-near-process-exec
  any:
  - id: objectives/collection/file-targeting/filter::llm-cli-inventory-file-prompt
  - id: objectives/collection/file-targeting/filter::llm-inventory-file-instructions
- id: llm-cli-inventory-file-prompt
  desc: LLM CLI prompt assembles file inventory
  crit: suspicious
  conf: 0.94
  near_bytes: 240
    # Require both a distinctive inventory/LLM anchor and a filesystem
    # action cue so ambient API words like "search" or event names like
    # "locate" in declaration files do not self-satisfy the composite.
  all:
  - id: objectives/collection/file-targeting/filter::llm-inventory-prompt-anchor
  - id: micro-behaviors/ui/help/message::llm-inventory-action-cluster
  unless:
  - id: metadata/package/testing/presence/manifest::test-fixtures
- id: llm-inventory-file-instructions
  desc: LLM filesystem-inventory instruction prompt
  crit: notable
  conf: 0.9
  near_bytes: 240
    # Require an inventory-specific anchor in addition to the action cue.
  all:
  - id: micro-behaviors/ui/help/message::llm-inventory-instruction-anchor
  - id: micro-behaviors/ui/help/message::llm-inventory-action-cluster
  unless:
  - id: metadata/package/testing/presence/manifest::test-fixtures

- id: llm-inventory-prompt-anchor
  desc: File-inventory wording and context clues
  crit: component
  conf: 0.93
  needs: 2
  any:
  - id: micro-behaviors/fs/path/temp::prompt-tmp-inventory-path
  - id: metadata/lang/natural/phrasing/agent::prompt-environment-definition-phrase
  - id: objectives/credential-access/files/secret-sweep::prompt-amazon-credential-phrase
  - id: micro-behaviors/ui/help/message::prompt-search-enumeration-phrase
      # A prompt that names a browser credential store, or several wallet
      # products in a row, is describing what to collect. The nx "telemetry"
      # variant that hunted wallet key files rather than CI tokens carried
      # exactly these and no other anchor.
  - id: micro-behaviors/data/db/access::indexeddb-name-literal
  - id: micro-behaviors/os/application/target/wallet::wallet-app-name-cluster
