# Frappe removes one leading slash before opening embed paths. Double-rooted
# Unix paths, parent traversal, drive paths and UNC paths escape asset roots.
# This is a file-selection payload indicator, not proof that the file was read.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, json, html]

traits:
  - id: renderer-embed-external-path
    desc: Renderer embed selects external file paths
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\bembed=\\{0,3}["''](//|\.\.[/\\]|[A-Za-z]:[/\\]|\\\\)[^"''\r\n]{1,180}["'']'
