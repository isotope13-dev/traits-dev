defaults:
  platforms: [android]
  for: [java, kotlin]

composite_rules:
  - id: android-user-media-file-targeting
    desc: Android user media file targeting
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/os/privilege/manifest::read-external-storage
    needs: 2
    any:
      - id: micro-behaviors/fs/path/media::android-dcim-path
      - id: micro-behaviors/fs/path/media::android-media-store-images
      - id: micro-behaviors/fs/path/media::android-media-store-video

  - id: android-media-and-clipboard-access
    desc: Android media clipboard access
    crit: suspicious
    conf: 0.94
    all:
      - id: android-user-media-file-targeting
    any:
      - id: micro-behaviors/os/clipboard/reference::clipboard-manager
      - id: micro-behaviors/os/clipboard/write::set-primary-clip

  - id: android-mime-file-exfil-targeting
    desc: Android targets files by MIME category
    crit: suspicious
    conf: 0.96
    all:
      - id: android-external-storage-access
    any:
      - id: micro-behaviors/data/format/mime::pdf-word-mime-literal
      - id: micro-behaviors/data/format/mime::ooxml-mime-literal
      - id: micro-behaviors/data/format/mime::javascript-mime-literal
      - id: micro-behaviors/data/format/mime::image-mime-literal
      - id: micro-behaviors/data/format/mime::audio-mime-literal
      - id: micro-behaviors/data/format/mime::video-mime-literal
      - id: micro-behaviors/data/format/mime::zip-rar-mime-literal
      - id: micro-behaviors/data/format/mime::7z-tar-mime-literal
      - id: micro-behaviors/os/package-manager/sideload::android-apk-mime-type
    needs: 2
    unless:
      - id: well-known/app/communication/amethyst/

  - id: android-external-storage-access
    desc: Android external storage access
    crit: component
    conf: 0.95
    any:
      - id: micro-behaviors/os/privilege/manifest::read-external-storage
      - id: micro-behaviors/os/privilege/manifest::write-external-storage
      - id: micro-behaviors/os/privilege/manifest::manage-external-storage
