# Ransomware and extortion operators commonly pre-qualify data instead of
# copying an entire filesystem.  These atoms describe the selection pattern;
# the archive/upload composites add the intent gate so ordinary search tools
# are not treated as exfiltration by themselves.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  attack: T1005,T1083

traits:
  - id: financial-file-keywords
    desc: Financial term; target context required
    crit: component
    conf: 0.92
    if:
      type: literal
      kind: string
      # A path/glob delimiter is required before the term.  This keeps
      # ordinary option values such as Intl.NumberFormat's ``"accounting"``
      # from becoming file-targeting evidence.
      regex: '(?i)[/\\*][^"\x27\r\n]{0,40}\b(finance|accounting|insurance)\b'
    unless:
      - id: well-known/lib/pyaigis/

  - id: sensitive-record-file-keywords
    desc: Sensitive-record term; target context required
    crit: component
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '(?i)[/\\*][^"\x27\r\n]{0,40}\b(medical|patient|classified|confidential)\b'
    unless:
      - id: well-known/lib/pyaigis/

  - id: credential-file-path
    desc: Credential-like file path
    crit: component
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '(?i)[/\\~*][^"\r\n]{0,80}\b(password|credential)s?\b'
    unless:
      - id: well-known/lib/pyaigis/

  - id: credential-file-enumeration
    desc: Enumerates credential-like files
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(glob|rglob|walk)\s*\('
    unless:
      - id: well-known/lib/pyaigis/

  - id: source-code-file-target-keywords
    desc: Source-code term; target context required
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)(["*?/\\]source\s+code|(find|rglob|glob)\b[^\r\n]{0,80}source\s+code)'
    unless:
      - id: well-known/lib/pyaigis/

  - id: security-report-file-target-keywords
    desc: Security-report term; target context required
    crit: component
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '(?i)[/\\*][^"\x27\r\n]{0,40}\bsecurity[_ -]?reports?\b'
    unless:
      - id: well-known/lib/pyaigis/

  - id: network-file-keywords
    desc: Network term; target context required
    crit: component
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '(?i)[/\\*][^"\x27\r\n]{0,40}\bnetwork\s+architecture\b'
    unless:
      - id: well-known/lib/pyaigis/

  - id: office-document-extension-cluster
    desc: Office extension; target context required
    crit: component
    conf: 0.9
    if:
      type: text
      # Require a filename/glob delimiter.  A bare ``.doc`` also appears in
      # ordinary Python module and method names (for example
      # ``dna.extensions.doc`` and ``paths.doc(...)``), which are not file
      # targeting.  The surrounding filename may be a literal, glob, or path.
      regex: '(?i)["\x27*/\\s(][^"\x27\\s/\\\\]{0,80}\.(docx?|xlsx?|pptx?)(?=$|["\x27\\s,;)}\\]])'
    unless:
      - id: well-known/lib/pyaigis/

  - id: data-document-extension-cluster
    desc: Data extension; target context required
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)["\x27*/\\s(][^"\x27\\s/\\\\]{0,80}\.(txt|csv|sql)(?=$|["\x27\\s,;)}\\]])'
    unless:
      - id: well-known/lib/pyaigis/

  - id: powershell-recursive-file-enumeration
    desc: PowerShell recursively enumerates files
    crit: notable
    conf: 0.9
    for: [powershell]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)\b(Get-ChildItem|gci|dir)\b[^\r\n]{0,180}\s-Recurse\b'
    not:
      - regex: '(?i)-Include\s+"\*\.(ts|tsx|js|jsx)"'
    unless:
      - id: well-known/lib/pyaigis/
      - id: well-known/app/copilot-delegate::copilot-delegate-hook-script

composite_rules:
  - id: targeted-high-value-file-discovery
    desc: Targets high-value files recursively
    crit: suspicious
    conf: 0.97
    all:
      - id: high-value-file-keyword-cluster
      - id: high-value-document-extension-cluster
    any:
      - id: micro-behaviors/fs/directory/traverse::traverse-rglob-call
      - id: micro-behaviors/fs/directory/traverse::find-type-file
      - id: powershell-recursive-file-enumeration
    unless:
      - id: well-known/lib/pyaigis/

  - id: high-value-file-keyword-cluster
    desc: High-value targeting keyword cluster
    crit: notable
    conf: 0.94
    needs: 2
    any:
      - id: financial-file-keywords
      - id: sensitive-record-file-keywords
      - id: credential-file-targeting
      - id: source-code-file-target-keywords
      - id: security-report-file-target-keywords
      - id: network-file-keywords

  - id: high-value-document-extension-cluster
    desc: Multiple document extension references
    crit: notable
    conf: 0.92
    needs: 2
    any:
      - id: office-document-extension-cluster
      - id: data-document-extension-cluster

  - id: credential-file-targeting
    desc: Targets credential-like files
    crit: notable
    conf: 0.94
    all:
      - id: credential-file-path
      - id: credential-file-enumeration
    near_bytes: 600
    unless:
      - id: micro-behaviors/fs/path/sensitive/credentials::ruby-sensitive-file-guard
      - id: well-known/app/rails-ai-context/
