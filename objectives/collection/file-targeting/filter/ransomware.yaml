# Ransomware and extortion operators commonly pre-qualify data instead of
# copying an entire filesystem.  These atoms describe the selection pattern;
# the archive/upload composites add the intent gate so ordinary search tools
# are not treated as exfiltration by themselves.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  attack: T1005,T1083

traits:
  - id: source-code-directory-path
    desc: Path ending in a source-code directory
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)[/\\~](source\s+code|[^"\r\n/\\]{0,60}[/\\]source\s+code)'
    unless:
      - id: well-known/lib/ai/pyaigis/

  - id: network-file-keywords
    desc: Network term; target context required
    crit: notable
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '(?i)[/\\*][^"\x27\r\n]{0,40}\bnetwork\s+architecture\b'
    unless:
      - id: well-known/lib/ai/pyaigis/

  # powershell-recursive-file-enumeration moved to
  # micro-behaviors/fs/directory/traverse::powershell-recursive-child-item.
  # The composite below already folds in that whole directory, so the
  # recursive walk still counts toward targeted discovery from its
  # neutral home.

composite_rules:
  - id: targeted-high-value-file-discovery
    desc: Targets high-value files recursively
    crit: suspicious
    conf: 0.97
    all:
    - id: high-value-file-keyword-cluster
    - id: high-value-document-extension-cluster
    any:
    - id: micro-behaviors/fs/directory/traverse/
    - id: micro-behaviors/fs/search::find-app-bundle
    unless:
    - id: well-known/lib/ai/pyaigis/
  - id: high-value-file-keyword-cluster
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
    desc: High-value targeting keyword cluster
    # This is a fragment for the recursive-discovery composite.  Keywords
    # alone are common in application labels and do not establish targeting.
    crit: component
    conf: 0.94
    needs: 2
    any:
      - id: micro-behaviors/fs/path/document::financial-path-keyword
      - id: micro-behaviors/fs/path/document::sensitive-record-file-keywords
      - id: credential-file-targeting
      - id: micro-behaviors/fs/search::source-code-glob-argument
      - id: source-code-directory-path
      - id: micro-behaviors/fs/path/document::security-report-path-reference
      - id: network-file-keywords

  - id: high-value-document-extension-cluster
    desc: Multiple document extension references
    crit: component
    conf: 0.92
    needs: 2
    any:
      - id: micro-behaviors/fs/path/extension::office-document-extension-reference
      - id: micro-behaviors/fs/path/extension::data-document-extension-reference

  - id: credential-file-targeting
    desc: Targets credential-like files
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/credential::credential-path-or-filename
    any:
      - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
      - id: micro-behaviors/fs/directory/traverse::traverse-rglob-call
      - id: micro-behaviors/fs/directory/traverse::traverse-glob-call
    near_bytes: 600
    unless:
      - id: micro-behaviors/fs/path/credential::ruby-sensitive-file-guard
      - id: well-known/app/ai/tool-server/rails-ai-context/
