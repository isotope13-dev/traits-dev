# Ransomware and extortion operators commonly pre-qualify data instead of
# copying an entire filesystem.  These atoms describe the selection pattern;
# the archive/upload composites add the intent gate so ordinary search tools
# are not treated as exfiltration by themselves.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  attack: T1005,T1083

traits:
  - id: financial-file-keywords
    desc: Financial term; target context required
    crit: component
    conf: 0.92
    if:
      type: literal
      kind: string
      # A path/glob delimiter is required before the term.  This keeps
      # ordinary option values such as Intl.NumberFormat's ``"accounting"``
      # from becoming file-targeting evidence.
      regex: '(?i)[/\\*][^"\x27\r\n]{0,40}\b(finance|accounting|insurance)\b'
    not:
      - regex: '(?i)^application/[a-z0-9.*+-]+'
    unless:
      - id: well-known/lib/ai/pyaigis/

  - id: sensitive-record-file-keywords
    desc: Sensitive-record term; target context required
    crit: component
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '(?i)[/\\*][^"\x27\r\n]{0,40}\b(medical|patient|classified|confidential)\b'
    unless:
      - id: well-known/lib/ai/pyaigis/

  - id: credential-file-path-segment
    desc: Credential-like path segment
    crit: component
    conf: 0.92
    if:
      type: literal
      kind: string
      # A bare `password`/`credentials` property is common browser/API
      # vocabulary.  Require path context or a recognizable credential-file
      # extension before describing the literal as a file path.
      regex: '(?i)~?[/\\]([A-Za-z0-9._-]+[/\\]){0,5}(password|credentials?)([/\\.]|$)'
    unless:
      - id: well-known/lib/ai/pyaigis/
      - id: metadata/lang/scripted::dts-declaration-file

  - id: credential-file-extension
    desc: Credential-like filename extension
    crit: component
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '(?i)\b(password|credentials?)\.(json|ya?ml|ini|cfg|env|pem|key|p12|pfx)\b'
    unless:
      - id: well-known/lib/ai/pyaigis/
      - id: metadata/lang/scripted::dts-declaration-file

  # Split from a single alternation: a glob/find call naming "source code" and
  # a filesystem path whose last segment is "Source Code" are independent
  # signals, and the path branch needed the separator to actually delimit a
  # path segment. The old form accepted any backslash, so the C-style escape in
  # Bundler's `"\tSource Code: ..."` output template read as a Windows path.
  - id: source-code-glob-target
    desc: Glob or find call naming source code
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)(find|rglob|glob)\b[^\r\n]{0,80}source\s+code'
    unless:
      - id: well-known/lib/ai/pyaigis/

  - id: source-code-directory-path
    desc: Path ending in a source-code directory
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)[/\\~]([^"\r\n]{0,60}[/\\])?source\s+code'
    unless:
      - id: well-known/lib/ai/pyaigis/

  - id: security-report-file-target-keywords
    desc: Security-report term; target context required
    crit: component
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '(?i)[/\\*][^"\x27\r\n]{0,40}\bsecurity[_ -]?reports?\b'
    unless:
      - id: well-known/lib/ai/pyaigis/

  - id: network-file-keywords
    desc: Network term; target context required
    crit: component
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '(?i)[/\\*][^"\x27\r\n]{0,40}\bnetwork\s+architecture\b'
    unless:
      - id: well-known/lib/ai/pyaigis/

  # powershell-recursive-file-enumeration moved to
  # micro-behaviors/fs/directory/traverse::powershell-recursive-child-item.
  # The composite below already folds in that whole directory, so the
  # recursive walk still counts toward targeted discovery from its
  # neutral home.

composite_rules:
  - id: credential-file-path
    desc: Credential-like file path
    crit: component
    conf: 0.92
    any:
      - id: credential-file-path-segment
      - id: credential-file-extension

  - id: targeted-high-value-file-discovery
    desc: Targets high-value files recursively
    crit: suspicious
    conf: 0.97
    all:
      - id: high-value-file-keyword-cluster
      - id: high-value-document-extension-cluster
    any:
      - id: micro-behaviors/fs/directory/traverse/
    unless:
      - id: well-known/lib/ai/pyaigis/

  - id: high-value-file-keyword-cluster
    desc: High-value targeting keyword cluster
    # This is a fragment for the recursive-discovery composite.  Keywords
    # alone are common in application labels and do not establish targeting.
    crit: component
    conf: 0.94
    needs: 2
    any:
      - id: financial-file-keywords
      - id: sensitive-record-file-keywords
      - id: credential-file-targeting
      - id: source-code-glob-target
      - id: source-code-directory-path
      - id: security-report-file-target-keywords
      - id: network-file-keywords

  - id: high-value-document-extension-cluster
    desc: Multiple document extension references
    crit: component
    conf: 0.92
    needs: 2
    any:
      - id: micro-behaviors/fs/path/extension::office-document-extension-reference
      - id: micro-behaviors/fs/path/extension::data-document-extension-reference

  - id: credential-file-targeting
    desc: Targets credential-like files
    crit: notable
    conf: 0.94
    all:
      - id: credential-file-path
    any:
      - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
      - id: micro-behaviors/fs/directory/traverse::traverse-rglob-call
      - id: micro-behaviors/fs/directory/traverse::traverse-glob-call
    near_bytes: 600
    unless:
      - id: micro-behaviors/fs/path/sensitive/credentials::ruby-sensitive-file-guard
      - id: well-known/app/ai/tool-server/rails-ai-context/
