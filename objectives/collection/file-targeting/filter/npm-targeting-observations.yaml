defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]

composite_rules:
- id: opt-santa-file-targeting
  desc: Targets /opt Santa list files
  crit: suspicious
  conf: 0.985
  attack: T1005
  all:
  - id: micro-behaviors/fs/directory/readdir/target::opt-dir-enum
  any:
  - id: micro-behaviors/fs/read/file/target::santa-list-file-read
  - id: micro-behaviors/fs/path/reference::santa-list-path
