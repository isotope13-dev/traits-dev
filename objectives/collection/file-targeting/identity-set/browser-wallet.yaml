# Stealer behavior - Browser and Wallet File Access
# Detects accessing sensitive browser credential and cryptocurrency wallet files
# MBC: OB0009 (Collection)
# ATT&CK: T1555.003 (Credentials from Web Browsers), T1005 (Data from Local System)
defaults:
  crit: suspicious
  attack: T1555.003
  mbc: OB0009
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
composite_rules:
  # Helper: Any sensitive file path.
  #
  # `scope: file`, not `archive`. Under archive scope the composite reported
  # against a whole image rather than any member -- the Kibana container
  # finding listed no file at all -- because the browser-path leg could come
  # from one member (a bundled automation library, a detection rule, a browser
  # profile fixture) while the `for: [python]` typing came from another. A
  # program reading a browser credential store does it in one file, and the
  # `sensitive-file-access` consumer below already assumes that: it pairs this
  # with remote control inside a single sub-5KB script.
  - id: sensitive-paths
    desc: Browser or wallet file paths
    conf: 0.8
    scope: file
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/app/browser-extension/ronin-wallet::browser-extension
      - id: well-known/app/utility/siw::siw-family-identity
      - id: well-known/app/browser/mozilla-firefox::firefox-runtime-tree-path
      - id: well-known/app/browser/mozilla-firefox::firefox-known-source-module-context
      # `yt_dlp/cookies.py` is the implementation of `--cookies-from-browser`:
      # reading Chromium's Login Data and cookie database is the documented
      # feature, and third-party tools import this module rather than
      # reimplement the decryption.
      - id: well-known/tool/media/yt-dlp::yt-dlp-package-context
      # `browser_cookie3/__init__.py` is the same shape: loading browser
      # cookie stores into a cookiejar is the documented feature, so its own
      # Login Data and cookie database references are library identity.
      - id: well-known/lib/development/browser-cookie3::browser-cookie3-library-context
      # Automation code that drives a real browser over CDP names the same
      # profile files it manages (cookie jars, Login Data keep-lists for
      # profile shrink/clone) without reading their contents. Credential
      # stealers read the stores with SQL or file copy and never attach to a
      # live browser, so a Playwright CDP-attach call in the same file
      # exculpates the bare filename reference. A single atom (not the
      # 15-leaf cdp-protocol-surface roll-up) keeps this rule under the
      # suppression-expansion budget.
      - id: micro-behaviors/communications/http/devtools/client::playwright-connect-over-cdp
    any:
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: objectives/credential-access/browser/chromium::chromium-cookie-sql
      - id: objectives/credential-access/browser/safari::cookies-path
  - id: sensitive-file-access
    desc: Python stealer accessing sensitive browser or wallet files
    conf: 0.95
    # Stealth stealers are typically small
    size_max: 5000
    all:
      - id: objectives/command-and-control/remote-command/control::generic-dup
      - id: sensitive-paths
    unless:
      - id: micro-behaviors/fs/file/open::cookiejar-exclusion
