# The set of files a payload reads to learn who it landed on.
#
# The torchtriton binary that shipped in the malicious PyTorch nightly of
# December 2022 is described elsewhere by how the data left -- encoded into
# DNS queries. This states what it took, which is a separate question and the
# one a responder has to answer first.
#
# It reads `/etc/passwd` and `/etc/hosts` (the account list and whatever
# internal names this host resolves by hand), `~/.gitconfig` (the developer's
# name, email, and often a credential helper), and `~/.ssh` (the keys that
# reach everywhere that developer can reach). That is not a system inventory;
# it is the bundle that answers "whose machine is this and what does it get
# me", and it is why the response to this incident was rotating SSH keys
# rather than reinstalling a package.
#
# Kept apart from the exfiltration rule deliberately. A channel finding tells
# you to block a resolver. This tells you what to assume is already gone,
# which stays true whichever channel a future variant picks.
defaults:
  platforms: [unix]
  for: [elf, macho, shell, python, perl, ruby, text]
  attack: T1005,T1552.004,T1083
  mbc: E1005

composite_rules:
  - id: developer-identity-file-sweep
    desc: Collects the developer identity file set
    crit: hostile
    conf: 0.94
    # Three of the four. Any one of these paths appears in ordinary software --
    # an installer reads /etc/passwd, a git tool reads .gitconfig. Software
    # that wants all of them together is building a profile of the person.
    needs: 3
    any:
      - id: micro-behaviors/fs/path/sensitive/identity::etc-passwd-path-literal
      - id: micro-behaviors/fs/path/sensitive/identity::ssh-directory-literal
      - id: micro-behaviors/fs/path/sensitive/credentials::gitconfig-file
      - id: micro-behaviors/fs/path/config/system::config-hosts
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/
