defaults:
  platforms:
  - unix
  for:
  - elf
  - macho
  - shell
  - python
  - perl
  - ruby
  - text
  attack: T1005,T1552.004,T1083
  mbc: E1005
composite_rules:
- id: developer-identity-file-sweep
  for:
  - elf
  - macho
  - shell
  - python
  - ruby
  - perl
  desc: References SSH and developer account paths
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/fs/path/config/ssh::ssh-directory-literal
  - id: micro-behaviors/fs/path/secret-config::gitconfig-file
  needs: 1
  any:
  - id: micro-behaviors/fs/path/account-db::etc-passwd-path-literal
  - id: micro-behaviors/fs/path/config/network::config-hosts
