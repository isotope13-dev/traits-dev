defaults:
  platforms:
  - unix
  for:
  - elf
  - macho
  - shell
  - python
  - perl
  - ruby
  - text
  attack: T1005,T1552.004,T1083
  mbc: E1005
composite_rules:
- id: developer-identity-file-sweep
  for:
  - elf
  - macho
  - shell
  - python
  - ruby
  - perl
  desc: Collects the developer identity file set
  crit: hostile
  conf: 0.94
  all:
  - id: micro-behaviors/fs/path/config/ssh::ssh-directory-literal
  - id: micro-behaviors/fs/path/secret-config::gitconfig-file
  needs: 1
  any:
  - id: micro-behaviors/fs/path/account-db::etc-passwd-path-literal
  - id: micro-behaviors/fs/path/config/system::config-hosts
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool
  - id: well-known/lib/runtime/scripted/bun-runtime/
  - id: metadata/build/recognized-contexts::ssh-sandbox-account-provisioning
  - id: metadata/package/documentation/source::documentation-dir-path
  - id: metadata/lang/compiler/systems::go-binary
  - id: metadata/path::test-directory-component
  - id: well-known/app/ai/coding-agent/reason-machines::reason-machines-cli-context
