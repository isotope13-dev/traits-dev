defaults:
  crit: hostile
  platforms: [windows]
  for: [batch]
  attack: T1105,T1059.001
  mbc: B0030


composite_rules:
  - id: batch-remote-powershell-sensitive-collection
    desc: Batch remote PowerShell and sensitive collection switches
    conf: 0.99
    attack: T1005,T1059.001,T1105
    # The helper download is in the fallback routine, while its caller and
    # sensitive collection switches are near the main execution block.
    near_lines: 160
    all:
      - id: objectives/collection/file-targeting/command::sensitive-collection-switch
      - id: micro-behaviors/communications/http/download/webclient::downloadfile-method-name-batch
      - id: metadata/lang/source/syntax/command/launch::powershell-script-execution
