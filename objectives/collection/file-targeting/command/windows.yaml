defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1005

# Collection-mode switches describe what a script intends to gather.  They
# remain neutral capabilities; hostile intent requires a delivery or
# exfiltration conjunction in the objective traits that consume them.
traits:
  - id: secrets-only-collection-switch
    desc: Script selects secrets-only collection mode
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)-SecretsOnly\b'

  - id: documents-only-collection-switch
    desc: Script selects document-only collection mode
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)-DocsOnly\b'

  - id: removable-media-collection-switch
    desc: Script includes removable-media collection
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)-IncludeRemovable\b'

composite_rules:
  - id: sensitive-collection-switch
    desc: Script selects a sensitive collection mode
    crit: notable
    conf: 0.95
    any:
      - id: secrets-only-collection-switch
      - id: documents-only-collection-switch
      - id: removable-media-collection-switch
