defaults:
  platforms: [unix]
  for: [javascript, typescript]

composite_rules:
  - id: node-sensitive-find-command
    desc: Root file search targets credential paths
    crit: suspicious
    conf: 0.94
    near_bytes: 1024
    all:
      - id: micro-behaviors/fs/search::find-from-filesystem-root
    any:
      - id: micro-behaviors/fs/path/credential::any-credential-path
