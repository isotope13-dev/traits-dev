defaults:
  platforms: [unix]
  for: [javascript, typescript]

traits:
  - id: find-root-credential-filename
    desc: Root search filters credential filenames
    crit: component
    if:
      type: text
      regex: 'find\s+/\s+[^\n;]{0,120}-i?name\s+[^\n;]{0,20}\.(npmrc|pypirc|netrc)'

composite_rules:
  - id: node-root-credential-filename-search
    desc: Node shell execution and root search for credential files
    crit: suspicious
    all:
      - id: find-root-credential-filename
      - id: micro-behaviors/process/create/shell/command-string::execSync-call

  - id: node-sensitive-find-command
    desc: Root file search near credential path references
    crit: notable
    conf: 0.94
    near_bytes: 1024
    all:
      - id: micro-behaviors/fs/search/command::find-from-filesystem-root
    any:
      - id: micro-behaviors/fs/path/credential/collection::any-credential-path
    unless:
      - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
