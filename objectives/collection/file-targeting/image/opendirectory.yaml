# macOS account picture stored as JPEG data on the local Open Directory
# user record. `dscl . -read <user> JPEGPhoto` is not how an app loads the
# picture users see in System Settings; that file lives on disk. Piping the
# attribute through `xxd -r -p` turns the directory blob into an image file,
# which is collection of the account photo.
defaults:
  platforms: [macos]
  for: [scripts, source, macho]
  attack: T1005

traits:
  - id: dscl-jpegphoto-read
    desc: Reads macOS account JPEGPhoto via dscl
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\bdscl\b[^\n]{0,200}\bJPEGPhoto\b'

composite_rules:
  - id: opendirectory-jpegphoto-staged
    desc: Stages macOS account photo from Open Directory
    crit: hostile
    conf: 0.96
    near_bytes: 500
    all:
      - id: dscl-jpegphoto-read
      - id: micro-behaviors/data/decode/hex::xxd-hex-decode
