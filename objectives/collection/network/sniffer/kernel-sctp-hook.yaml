# Kernel-module interception of SCTP, the transport under SS7/SIGTRAN and
# Diameter signalling. A module that resolves the SCTP protocol's sendmsg and
# recvmsg handlers by name through kallsyms_lookup_name and the inetsw protocol
# switch table can replace those handlers to read or inject signalling on
# existing associations (SCTPE, tied by Enea to SilentAir). The in-tree sctp
# module defines these routines but never resolves them through kallsyms.
defaults:
  platforms: [linux]
  for: [elf, c]
  attack: T1040
traits:
  - id: inetsw-name-literal
    desc: Names the inetsw protocol switch table
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '(^|")inetsw("|$)'
  - id: sctp-sendmsg-name-literal
    desc: Names SCTP sendmsg handler string
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '(^|")sctp_sendmsg("|$)'
  - id: sctp-recvmsg-name-literal
    desc: Names SCTP recvmsg handler string
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '(^|")sctp_recvmsg("|$)'
composite_rules:
  - id: sctp-hook-target-names
    desc: SCTP handler and protocol table names
    crit: notable
    conf: 0.8
    all:
      - id: inetsw-name-literal
      - id: sctp-sendmsg-name-literal
      - id: sctp-recvmsg-name-literal
    near_bytes: 512
  - id: kernel-sctp-protocol-hook
    desc: Kernel module hooks SCTP send/recv
    crit: hostile
    conf: 0.9
    all:
      - id: sctp-hook-target-names
      - id: micro-behaviors/os/kernel/routines::kallsyms-lookup-name-reference
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
