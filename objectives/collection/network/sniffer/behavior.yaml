defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: log-file-regex-search
    desc: Searching for patterns in system logs
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '/var/log/[\w\.-]+_error\.log|sslvpn_ngx_error\.log'
composite_rules:
  - id: log-command-extraction
    desc: Extracting commands from log files
    crit: suspicious
    conf: 0.9
    attack: T1505
    all:
      - id: log-file-regex-search
      - id: micro-behaviors/data/decode/base64::b64decode-string
      - id: micro-behaviors/process/create/subprocess::os-popen-ast
  - id: filtered-raw-packet-forwarding
    desc: Filters and forwards raw captured frames
    crit: suspicious
    conf: 0.97
    attack: T1040,T1041
    for: [c, cpp]
    platforms: [linux]
    all:
      - id: micro-behaviors/communications/capture/packet-socket::raw-all-protocol-capture-loop
      - id: micro-behaviors/data/string/search::memmem
      - id: micro-behaviors/communications/socket/send::send-symbol
  - id: kernel-thread-masqueraded-packet-surveillance
    desc: Kworker-masqueraded packet surveillance
    crit: hostile
    conf: 0.99
    attack: T1036.004,T1040,T1041
    for: [c, cpp, elf]
    platforms: [linux]
    all:
      - id: micro-behaviors/os/bpf/program/network::af-packet-source
      - id: micro-behaviors/communications/socket/raw::raw-socket-creation-regex
      - id: micro-behaviors/communications/capture/packet-socket::eth-p-all-identifier
      - id: micro-behaviors/communications/socket/receive::recvfrom-symbol
      - id: micro-behaviors/data/string/search::memmem
      - id: micro-behaviors/communications/socket/send::send-symbol
      - id: micro-behaviors/process/info/current::set-process-name-prctl
      - id: metadata/file/string/process-name::source-kworker-name-literal
