defaults:
  crit: suspicious
  attack: "T1040"
  for: [c, cpp]
  platforms: [windows]
traits:
  - id: packet-sniffer-title
    desc: Packet Sniffer thread title
    conf: 0.94
    if:
      type: text
      substr: "Packet Sniffer"
  - id: irc-sniff-format
    desc: IRC traffic sniffer format
    conf: 0.95
    if:
      type: text
      substr: "IRC sniff"
  - id: ftp-sniff-format
    desc: FTP traffic sniffer format
    conf: 0.95
    if:
      type: text
      substr: "FTP sniff"
  - id: http-sniff-format
    desc: HTTP traffic sniffer format
    conf: 0.95
    if:
      type: text
      substr: "HTTP sniff"
  - id: vuln-sniff-format
    desc: Vulnerability sniffer format
    conf: 0.93
    if:
      type: text
      substr: "VULN sniff"
composite_rules:
  - id: winpcap-hook-network-spy-platform
    desc: WinPcap capture enumeration with hook interception and network channel
    # Adapter enumeration plus a WinPcap NPF device path is sniffer setup;
    # combined with a full Windows hook lifecycle and a Winsock channel in
    # one unsigned binary it is a dual-collection spy platform, not a
    # diagnostic: Wireshark and Nmap never install global hooks, and hotkey
    # or accessibility tools never enumerate capture devices.
    crit: hostile
    conf: 0.9
    attack: T1040,T1071.001
    for: [pe, dll]
    all:
    - id: micro-behaviors/network/interface::winpcap-npf-device-prefix
    - id: micro-behaviors/network/interface::get-adapters-info-text
    - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
    - id: micro-behaviors/communications/socket/init::wsock32-dll-marker
    - id: micro-behaviors/process/thread/create::create-thread
    - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
    - id: metadata/signed/platform/
    - id: metadata/binary/installer/family/
  - id: protocol-credential-sniffer
    desc: Multi-protocol credential sniffer
    conf: 0.98
    needs: 2
    any:
      - id: packet-sniffer-title
      - id: irc-sniff-format
      - id: ftp-sniff-format
      - id: http-sniff-format
      - id: vuln-sniff-format
