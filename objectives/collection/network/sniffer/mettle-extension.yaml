# Mettle's sniffer extension (mettle/mettle/extensions/sniffer) is a libpcap
# packet-capture component shipped as per-platform binaries inside the
# metasploit_payloads-mettle gem alongside the implant itself. A libpcap
# listener alone is dual-use (tcpdump qualifies), and a Mettle build path
# alone is only family identity; together they establish a C2 implant's
# packet-sniffing extension. The main implant binaries carry no pcap API
# surface, so they do not satisfy the listener leg.
# Scope is ELF/Linux: the shipped musl-static builds carry no usable section
# table, so their build paths land in the unattributed string pool the marker
# atom scopes to; Mach-O builds keep named sections and do not match it.
defaults:
  platforms: [linux]
  for: [elf]
  crit: hostile
  conf: 0.95
  attack: "T1040"
composite_rules:
  - id: mettle-sniffer-extension-capture
    desc: Mettle C2 implant packet-sniffing extension
    all:
      - id: micro-behaviors/communications/capture/pcap::listener
      - id: well-known/tool/offensive/mettle::implant-source-build-path
    # The published metasploit_payloads-mettle gem ships this extension under
    # build/<triple>/bin/sniffer.bin with the mettle source path embedded.
    # That package context is the same exception the Meterpreter implant
    # rules use. A copy outside bin/sniffer[.bin] stays hostile.
    unless:
      - id: well-known/tool/offensive/metasploit::metasploit-payload-package-context
