# Mettle's sniffer extension (mettle/mettle/extensions/sniffer) is a libpcap
# packet-capture component shipped as per-platform binaries inside the
# metasploit_payloads-mettle gem alongside the implant itself. A libpcap
# listener alone is dual-use (tcpdump qualifies), and a Mettle build path
# alone is only family identity; together they establish a C2 implant's
# packet-sniffing extension. The main implant binaries carry no pcap API
# surface, so they do not satisfy the listener leg.
# The canonical source-path identity covers both named constant sections and
# the unattributed strings in flat process-image builds. A package/member
# filename does not change this extension's packet-capture behavior.
defaults:
  platforms: [linux, macos]
  for: [elf, macho]
  crit: hostile
  conf: 0.95
  attack: "T1040"
composite_rules:
  - id: mettle-sniffer-extension-capture
    desc: Mettle C2 implant packet-sniffing extension
    all:
      - id: micro-behaviors/communications/capture::listener
      - id: well-known/tool/offensive/metasploit::mettle-source-path
