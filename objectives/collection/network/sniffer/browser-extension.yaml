defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx]
  attack: T1040

composite_rules:
  - id: extension-content-script-http-traffic-watcher
    desc: Extension watches page HTTP request traffic
    crit: hostile
    conf: 0.97
    attack: T1040,T1119
    scope: archive
    for: [crx, xpi, zip, javascript, chrome-manifest]
    all:
      - id: metadata/permission/host::host-permission-all-urls
      - id: metadata/permission/host::content-script-all-urls
      - id: micro-behaviors/process/hook/webextension::extension-http-watcher-handler-enum
    any:
      - id: micro-behaviors/process/hook/xhr::xhr-prototype-open-eq
      - id: micro-behaviors/process/hook/xhr::xhr-prototype-send-eq
      - id: micro-behaviors/process/hook/xhr::fetch-hook

  - id: extension-webrequest-body-header-capture
    desc: Extension captures request bodies and headers
    crit: suspicious
    conf: 0.96
    scope: archive
    all:
      - id: metadata/permission/runtime::is-extension
      - id: micro-behaviors/process/hook/webextension::chrome-webrequest-pre-request
      - id: micro-behaviors/process/hook/webextension::webrequest-before-send-headers-listener
      - id: micro-behaviors/process/hook/webextension::webrequest-request-body-access
      - id: micro-behaviors/process/hook/webextension::webrequest-request-header-access
      - id: micro-behaviors/data/db/web-storage::chrome-storage-local-set
    unless:
      - id: well-known/tool/offensive/hackbar::tool-context

  - id: extension-instagram-auth-header-sniffer
    desc: Extension sniffs Instagram API auth headers
    crit: hostile
    conf: 0.98
    attack: T1040,T1539
    scope: archive
    all:
      - id: micro-behaviors/process/hook/webextension::webrequest-request-header-capture
      - id: micro-behaviors/communications/http/header/custom::instagram-private-api-headers
      - id: micro-behaviors/data/db/web-storage::extension-http-headers-storage
