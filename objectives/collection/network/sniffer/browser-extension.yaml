defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx]
  attack: T1040

composite_rules:
  - id: extension-chatgpt-request-body-collection
    desc: Extension collects ChatGPT request bodies for remote context uploads
    crit: hostile
    conf: 0.995
    attack: T1040,T1119,T1041
    scope: archive
    for: [crx, xpi, zip, archives]
    all:
      - id: micro-behaviors/process/hook/webextension::webrequest-request-body-access
      - id: chatgpt-request-body-preview
      - id: chatgpt-network-diagnostic-dispatch
      - id: objectives/collection/monitor/telemetry::ai-chat-context-capture-dispatch
      - id: objectives/collection/monitor/telemetry::ai-chat-context-plaintext-queue
      - id: objectives/collection/monitor/telemetry::ai-chat-context-post-endpoint

  - id: extension-webrequest-body-header-capture
    desc: Extension captures request bodies and headers
    crit: suspicious
    conf: 0.96
    scope: archive
    all:
      - id: metadata/permission/runtime::is-extension
      - id: micro-behaviors/process/hook/webextension::chrome-webrequest-pre-request
      - id: micro-behaviors/process/hook/webextension::webrequest-before-send-headers-listener
      - id: micro-behaviors/process/hook/webextension::webrequest-request-body-access
      - id: micro-behaviors/process/hook/webextension::webrequest-request-header-access
      - id: micro-behaviors/data/db/web-storage::chrome-storage-local-set
    unless:
      - id: well-known/tool/offensive/hackbar::tool-context

  - id: extension-instagram-auth-header-sniffer
    desc: Extension sniffs Instagram API auth headers
    crit: hostile
    conf: 0.98
    attack: T1040,T1539
    scope: archive
    all:
      - id: micro-behaviors/process/hook/webextension::webrequest-request-header-capture
      - id: instagram-api-auth-header-marker
      - id: extension-captured-headers-storage

traits:
  - id: instagram-api-auth-header-marker
    desc: References Instagram API auth header names
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'x-instagram-ajax|x-ig-www-claim|x-asbd-id'

  - id: extension-captured-headers-storage
    desc: Persists captured HTTP headers locally
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'storage\.local\.set\s*\(\s*\{[^}]{0,60}\bheaders\b'

  - id: chatgpt-request-body-preview
    desc: Summarizes ChatGPT request-body content
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: 'function\s+summarizeChatgptNetworkRequestBody\s*\(.{1,100}\)[\s\S]{0,900}\bbodyPreview\s*:'

  - id: chatgpt-network-diagnostic-dispatch
    desc: ChatGPT network diagnostic dispatch tag
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: SB_CONTEXT_NETWORK_DIAGNOSTIC
