defaults:
  platforms: [linux, macos, windows, unix, android, ios]
composite_rules:
  - id: ebpf-ssl-sniffer
    desc: eBPF SSL/TLS traffic sniffer
    # SSL plaintext probes are also used by EDR/telemetry agents to detect
    # exfiltration; reserve hostile for a corroborated interception context.
    crit: suspicious
    conf: 0.95
    attack: T1040
    for: [c, elf]
    all:
      - id: "micro-behaviors/communications/socket/ssl::openssl-ssl-session-function"
      - id: "micro-behaviors/os/bpf/program/tracing::bpf-core-read-user"
    any:
      - id: "micro-behaviors/os/bpf/program/loader::bpf-ringbuf"
      - id: "micro-behaviors/os/bpf/program/loader::data-event-struct"
    # A datadog-agent/ directory is chosen by whoever writes the file, so it
    # may only lower this finding, never hide it.
    downgrade:
      any:
        - id: well-known/app/infrastructure/datadog-agent::install-path
