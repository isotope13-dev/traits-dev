defaults:
  platforms: [windows, unix]
traits:
  - id: ssl-attach-openssl
    desc: SSL attach to OpenSSL
    crit: suspicious
    conf: 0.85
    for:
      - c
      - elf
    if:
      type: text
      substr: ssl_attach_openssl
      case_insensitive: true
  - id: ssl-attach-gnutls
    desc: SSL attach to GnuTLS
    crit: suspicious
    conf: 0.85
    for:
      - c
      - elf
    if:
      type: text
      substr: ssl_attach_gnutls
      case_insensitive: true
  - id: ssl-attach-nss
    desc: SSL attach to NSS
    crit: suspicious
    conf: 0.85
    for:
      - c
      - elf
    if:
      type: text
      substr: ssl_attach_nss
      case_insensitive: true
  - id: ssl-attach-macro
    desc: SSL attach macro pattern
    crit: suspicious
    conf: 0.9
    for:
      - c
    if:
      type: text
      substr: ssl_attach_##
  - id: ebpf-loader-include
    desc: eBPF loader header include
    crit: notable
    conf: 0.85
    for:
      - c
    if:
      type: text
      substr: ebpf/loader
  - id: lib-resolver-include
    desc: Library resolver header include
    crit: notable
    conf: 0.75
    for:
      - c
    if:
      type: text
      substr: libresolver
  - id: ssl-listen-event
    desc: SSL event listener
    crit: notable
    conf: 0.8
    for:
      - c
      - elf
    if:
      type: text
      substr: ssl_listen_event
      case_insensitive: true
  - id: ssl-load-fn
    desc: SSL loader function
    crit: notable
    conf: 0.7
    for:
      - c
      - elf
    if:
      type: text
      regex: \bssl_load\s*\(
      case_insensitive: true
  - id: ssl-op-string
    desc: SSL operation indicator
    crit: notable
    conf: 0.75
    for:
      - c
      - elf
    if:
      type: text
      regex: SSL_OP_(READ|WRITE)
  - id: ssl-op-type
    desc: SSL operation type definition
    crit: notable
    conf: 0.8
    for:
      - c
      - elf
    if:
      type: text
      regex: \bssl_op(_t)?\b
      case_insensitive: true
composite_rules:
  - id: ssl-attach-targets
    desc: SSL library attach targets
    crit: suspicious
    conf: 0.85
    for:
      - c
      - elf
    any:
      - id: ssl-attach-openssl
      - id: ssl-attach-gnutls
      - id: ssl-attach-nss
  - id: ssl-sniffer-loader
    desc: SSL sniffer loader API
    crit: suspicious
    conf: 0.9
    attack: T1557
    for:
      - c
      - elf
    needs: 2
    any:
      - id: ssl-attach-openssl
      - id: ssl-attach-gnutls
      - id: ssl-attach-nss
      - id: ssl-listen-event
      - id: ssl-load-fn
      - id: ssl-attach-macro
  - id: ssl-intercept-infra
    desc: eBPF SSL interception infrastructure
    crit: suspicious
    conf: 0.9
    attack: T1557
    for:
      - c
      - elf
    all:
      - id: micro-behaviors/communications/socket/ssl::ssl-ctx-tracking
    any:
      - id: micro-behaviors/os/bpf/program/maps::bpf-map-ringbuf
      - id: micro-behaviors/os/bpf/program/loader::bpf-ring-buffer
      - id: micro-behaviors/os/bpf/program/loader::bpf-ringbuf
    unless:
      - id: well-known/tool/sysadmin/alpine-packages::alpine-datadog-agent-member
  - id: ssl-sniffer-header
    desc: eBPF SSL sniffer header pattern
    crit: suspicious
    conf: 0.85
    attack: T1557
    for:
      - c
    all:
      - id: ssl-op-string
    any:
      - id: micro-behaviors/os/bpf/program/loader::data-event-struct
      - id: ssl-op-type
      - id: micro-behaviors/os/bpf/program/loader::kernel-userspace-transfer
