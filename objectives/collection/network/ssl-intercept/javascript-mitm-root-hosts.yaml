# TLS interception kit in a JavaScript package: a root CA is trusted by the OS
# and the hosts file is rewritten so vendor API names resolve to loopback.
#
# Each leg is an atomic trait, so the composite does not depend on which
# archive member carries it. The trust-store install and the hosts rewrite
# often sit in different bundles of one package, which is why scope is archive.
# A legitimate local-HTTPS tool that trusts a dev CA usually leaves the system
# hosts file alone, so the hosts-rewrite leg is what separates interception
# from a developer certificate helper.
#
# The upstream 9Router gateway ships this interception as a documented opt-in
# dashboard feature (sudo prompt, ToS warning, hosts cleanup on stop). Its
# package identity downgrades each composite one step; unidentified or
# rebranded copies of the same kit stay at full severity.
defaults:
  platforms: [unix]
  for: [npm, tar, package.json, javascript, typescript]
  mbc: F0016
  attack: T1553.004,T1557

composite_rules:
  # The trust-store leg is either macOS keychain or Linux CA-bundle install.
  # The same kit ships both branches, so a single-platform leg misses the
  # Linux member. Named here because a disjunction cannot nest in `all`.
  - id: js-root-ca-trust-install
    desc: Installs a root CA into the OS trust store
    crit: notable
    for: [javascript, typescript]
    any:
      - id: micro-behaviors/crypto/certificate/install::security-add-trusted-cert
      - id: micro-behaviors/crypto/certificate/install::update-ca-certificates

  - id: js-mitm-root-hosts-redirect
    desc: Trusted root CA plus hosts redirection for TLS interception
    crit: hostile
    conf: 0.96
    scope: archive
    downgrade:
      scope: archive
      any:
        - id: well-known/app/ai/gateway/9router::npm-gateway-package
    all:
      - id: js-root-ca-trust-install
      - id: micro-behaviors/fs/write/file/hosts::javascript-etc-hosts-literal
      - id: micro-behaviors/fs/write/file/hosts::javascript-tee-overwrite-hosts-pipe
    any:
      - id: micro-behaviors/fs/write/file/hosts::javascript-loopback-hosts-entry-template
      - id: micro-behaviors/crypto/certificate/usage::forge-create-certificate-call

  # Windows branch of the same kit: certutil adds the root, and the hosts path
  # is built from System32\drivers\etc. No tee leg exists on Windows, so the
  # hosts write is not required here. Without that leg the composite stays
  # suspicious rather than hostile.
  - id: js-windows-mitm-root-hosts-redirect
    desc: Windows root CA install plus hosts loopback redirection
    crit: suspicious
    conf: 0.9
    platforms: [windows]
    scope: archive
    downgrade:
      scope: archive
      any:
        - id: well-known/app/ai/gateway/9router::npm-gateway-package
    all:
      - id: micro-behaviors/crypto/certificate/install::javascript-certutil-addstore-root
      - id: micro-behaviors/fs/write/file/hosts::javascript-windows-hosts-path
      - id: micro-behaviors/fs/write/file/hosts::javascript-loopback-hosts-entry-template

  # Trust injected through the session environment: NODE_EXTRA_CA_CERTS makes
  # the kit's root CA trusted by every Node process, not only the interceptor.
  - id: js-mitm-node-ca-env-trust
    desc: Root CA trusted by Node through a session environment variable
    crit: hostile
    conf: 0.96
    scope: archive
    downgrade:
      scope: archive
      any:
        - id: well-known/app/ai/gateway/9router::npm-gateway-package
    all:
      - id: js-root-ca-trust-install
      - id: micro-behaviors/os/env/runtime::node-extra-ca-certs-session-set

  # The same kit names AI coding-assistant API hosts beside a loopback hosts
  # write, so a model endpoint is redirected to the local interceptor.
  - id: js-ai-coding-vendor-hosts-loopback
    desc: Loopback hosts entries for AI coding-assistant API hosts
    crit: hostile
    conf: 0.96
    scope: archive
    downgrade:
      scope: archive
      any:
        - id: well-known/app/ai/gateway/9router::npm-gateway-package
    all:
      - id: micro-behaviors/fs/write/file/hosts::javascript-tee-overwrite-hosts-pipe
      - id: micro-behaviors/fs/write/file/hosts::javascript-loopback-hosts-entry-template
      - id: micro-behaviors/communications/url/host/domain-http::ai-coding-assistant-api-host
