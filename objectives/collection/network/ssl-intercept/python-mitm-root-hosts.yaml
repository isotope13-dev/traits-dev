# TLS interception kit written in Python (source or PyInstaller bytecode): a
# root CA is added to the Windows Root store, the hosts file is edited, and
# vendor API names resolve to loopback where a local HTTPS server answers.
# Seen in license-bypass emulators that fake an online license check. A
# developer certificate helper rarely rewrites hosts for third-party names.
defaults:
  platforms: [windows]
  for: [python, pyc]
  mbc: F0016
  attack: T1553.004,T1557

composite_rules:
  - id: python-mitm-root-hosts-redirect
    desc: Python adds Root CA and redirects hostnames to loopback via hosts
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/config/network::windows-hosts-file
      - id: micro-behaviors/fs/write/file/hosts::loopback-hosts-entry-dotted-names
    any:
      - id: micro-behaviors/crypto/certificate/install::python-certutil-addstore
      - id: micro-behaviors/crypto/certificate/install::pyc-certutil-addstore-root
