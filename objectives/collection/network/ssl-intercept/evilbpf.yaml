defaults:
  platforms: [linux, macos, windows, unix, android, ios]
composite_rules:
  # SSL plaintext probes alone are what observability tools (ptop, EDR and
  # telemetry agents) ship, often behind an explicit opt-in flag. The
  # interception family is told apart by also writing into user memory with
  # bpf_probe_write_user, which no read-only tracer needs.
  - id: evilbpf-ssl-sniffer
    desc: eBPF SSL sniffer that writes user memory
    crit: hostile
    conf: 1.0
    attack: T1557
    for: [c, elf]
    all:
      - id: objectives/collection/network/ssl::ebpf-ssl-sniffer
      - id: micro-behaviors/os/bpf/program/tracing::bpf-probe-write-user
    any:
      - id: micro-behaviors/communications/socket/ssl::openssl-ssl-session-function
      - id: micro-behaviors/os/bpf/program/tracing::uprobe-sec
    unless:
      - id: well-known/tool/sysadmin/alpine-packages/package::alpine-datadog-agent-member
