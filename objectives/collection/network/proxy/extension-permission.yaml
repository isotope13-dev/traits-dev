# An extension holding Firefox's `proxy` permission together with access to
# every site. That permission lets the extension install a proxy-resolution
# handler, so it decides -- per request, in JavaScript -- where the browser's
# traffic actually goes. Every page load, every API call, every credential the
# user submits can be routed through a server of the extension's choosing, and
# the browser shows nothing.
#
# Real proxy and VPN add-ons need exactly this, which is why it stops at
# suspicious rather than hostile: the permission does not distinguish the
# product from the abuse of it. What makes it worth reporting is that it is a
# standing grant over all traffic, and an add-on that has it is one update away
# from being an interception point.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, xpi, zip]
  attack: T1090
  mbc: B0030

composite_rules:
  - id: extension-proxy-control-all-sites
    desc: Extension can proxy all browser traffic
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: metadata/permission/extension-api::permission-proxy
    any:
      - id: metadata/permission/manifest::permission-all-urls
      - id: metadata/permission/host::content-script-all-urls
