# An extension that calls itself a VPN but routes the browser through
# fixed SOCKS5 servers. SOCKS5 carries no encryption of its own, so the link
# the user believes is a VPN tunnel is a plain relay: the operator (and the
# path to it) sees every destination and any non-TLS traffic.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, xpi, javascript, typescript, zip]
  attack: T1090,T1557

composite_rules:
  - id: vpn-named-extension-socks5-browser-relay
    desc: VPN-named extension relays browsing through fixed SOCKS5 servers
    crit: suspicious
    conf: 0.85
    scope: archive
    all:
      - id: metadata/package/description/function::extension-name-vpn-claim
      - id: micro-behaviors/communications/proxy/config::chrome-proxy-settings-set
      - id: micro-behaviors/communications/proxy/config::chrome-proxy-fixed-socks5-config
