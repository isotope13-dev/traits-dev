# Browser extensions that install a fixed SOCKS5 relay are dual-use at the
# capability level.  These composites surface the article's abuse pattern
# only when the proxy configuration is paired with broad browser routing or
# DNS-over-HTTPS host resolution that hides the relay hostname.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1090,T1040

traits:
  # These are attack-context fragments, not generic proxy capabilities. They
  # describe a server catalogue and handler shape used to sell unavailable
  # premium locations alongside a browser-wide relay.
  - id: premium-proxy-node-entry
    desc: Premium proxy node entry
    crit: component
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        (pair
          key: (property_identifier) @key
          value: (true) @value
          (#eq? @key "premium"))

  - id: non-routable-proxy-node
    desc: Proxy node uses a non-routable host
    crit: component
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        (pair
          key: (property_identifier) @key
          value: (string (string_fragment) @value)
          (#eq? @key "host")
          (#match? @value "^(0\\.0\\.0\\.0|127\\.0\\.0\\.1|::1)$"))

  - id: proxy-route-action
    desc: Proxy route action literal
    crit: component
    conf: 0.93
    if:
      type: literal
      kind: string
      regex: '^(ROUTE_APPLY|APPLY_ROUTE|CONNECT)$'

  - id: proxy-route-failure-call
    desc: Proxy route failure response
    crit: component
    conf: 0.94
    if:
      type: tree-sitter
      kind: call
      regex: '(?is)\b(sendResponse|respond)\s*\(.{0,120}\b(ok|success)\s*:\s*false\b'

  # A catalogue of bare IPv4 relay endpoints. A real VPN product addresses its
  # gateways by hostname — that is what lets it move capacity, fail over, and
  # present a certificate — so the node list reads `de-1.vendor.com`, not
  # `80.92.204.33`. A farm that rents its exits by the month pins the addresses
  # it currently holds, because there is no DNS estate behind them. Five is the
  # floor so a single hardcoded fallback address does not match; private and
  # loopback ranges are filtered out because those appear in test fixtures and
  # in the bypass lists of honest proxy code.
  - id: raw-ip-proxy-node-table
    desc: Proxy list pins raw IPv4 hosts
    crit: suspicious
    conf: 0.94
    count_min: 5
    unless:
      - id: metadata/package/testing/harness/unit::vitest-import
    if:
      type: tree-sitter
      query: |
        (pair
          key: (property_identifier) @key
          value: (string (string_fragment) @value)
          (#eq? @key "host")
          (#match? @value "^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$")
          (#not-match? @value "^(0|127|10)\\.")
          (#not-match? @value "^192\\.168\\.")
          (#not-match? @value "^169\\.254\\.")
          (#not-match? @value "^172\\.(1[6-9]|2[0-9]|3[01])\\."))

  - id: proxy-resolver-ip-selection
    desc: Proxy node opts into hostname-to-IP resolution
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        (pair
          key: (property_identifier) @key
          value: (true) @value
          (#eq? @key "useDnsResolve"))

  # A fleet of "servers" whose hosts are country-code subdomains of one apex —
  # `us.<apex>`, `de.<apex>`, `jp.<apex>`. Real providers do label endpoints by
  # country, so this is only a shape; what makes it worth pairing with the
  # relay composites is how cheap the shape is to fabricate. Wildcard DNS on one
  # domain produces a twenty-country "network" that is one box, and the user
  # picking Japan gets the same operator they would have got picking Germany.
  - id: proxy-endpoint-country-subdomain-fleet
    desc: Endpoint list uses country-code subdomains
    crit: notable
    conf: 0.9
    count_min: 5
    if:
      type: text
      regex: '"host"\s*:\s*"[a-z]{2}\.[a-z0-9-]{3,40}\.[a-z]{2,12}"'

composite_rules:
  - id: extension-fixed-socks5-browser-relay
    desc: Extension forces browser traffic through a fixed SOCKS5 relay
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/network/webextension::chrome-proxy-settings-set
      - id: micro-behaviors/os/network/webextension::chrome-proxy-fixed-socks5-config
      - id: micro-behaviors/os/network/webextension::chrome-proxy-loopback-bypass

  - id: extension-proxy-doh-endpoint
    desc: Extension configures proxy alongside public DNS-over-HTTPS
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/network/webextension::chrome-proxy-settings-set
    any:
      - id: micro-behaviors/communications/dns/doh::doh-cloudflare-json
      - id: micro-behaviors/communications/dns/doh::doh-google-json

  - id: extension-proxy-host-doh-resolution
    desc: Extension resolves a proxy host through public DNS-over-HTTPS
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/network/webextension::chrome-proxy-settings-set
      - id: micro-behaviors/os/network/webextension::proxy-host-assignment-from-call
      - id: proxy-resolver-ip-selection
    any:
      - id: micro-behaviors/communications/dns/doh::doh-cloudflare-json
      - id: micro-behaviors/communications/dns/doh::doh-google-json

  - id: extension-fake-premium-proxy-tier
    desc: Fake premium proxy tier rejects routes
    crit: hostile
    conf: 0.99
    attack: T1090,T1583.004
    all:
      - id: extension-fixed-socks5-browser-relay
      - id: premium-non-routable-proxy-node
      - id: proxy-route-denial-handler

  - id: premium-non-routable-proxy-node
    desc: Premium proxy node uses a non-routable host
    crit: suspicious
    conf: 0.98
    near_bytes: 256
    all:
      - id: premium-proxy-node-entry
      - id: non-routable-proxy-node

  - id: proxy-route-denial-handler
    desc: Proxy route returns an unsuccessful result
    crit: suspicious
    conf: 0.96
    near_lines: 8
    all:
      - id: proxy-route-action
      - id: proxy-route-failure-call

  # The residential/traffic-farm shape, and the one that survives a rewrite:
  # every request the browser makes is pushed through relays the extension
  # names by address, with only loopback exempted. The sibling
  # `extension-fake-premium-proxy-tier` catches the variant where the paid
  # nodes are deliberately unroutable; this one catches the variant where they
  # are real rented exits, which is the same abuse with working infrastructure.
  - id: extension-raw-ip-proxy-relay-farm
    desc: Extension routes browsers to raw-IP relays
    crit: hostile
    conf: 0.96
    attack: T1090,T1583.003
    all:
      - id: extension-fixed-socks5-browser-relay
      - id: raw-ip-proxy-node-table

  - id: extension-hidden-proxy-destination
    desc: Extension hides its fixed proxy destination behind DoH IP resolution
    crit: hostile
    conf: 0.98
    attack: T1090,T1071.004
    all:
      - id: extension-fixed-socks5-browser-relay
      - id: extension-proxy-host-doh-resolution

  # A "VPN" that is a bare `chrome.proxy` SOCKS5 setting. Chrome's proxy API
  # carries no credentials and no transport of its own, so an extension built
  # this way hands every request the browser makes — URLs, hosts, and the
  # contents of anything not already under TLS — to whoever runs the relay, with
  # nothing for the user to authenticate against and nothing to distinguish the
  # operator from an attacker. The user believes they bought privacy; what they
  # installed points their whole browser at one stranger.
  #
  # A country-labelled fleet plus a paid tier is what separates this from a
  # single-endpoint corporate proxy helper: the fleet is the sales pitch and the
  # paid tier is the reason the operator wants the traffic in the first place.
  - id: extension-paid-socks5-vpn-fleet
    desc: Extension sells an unauthenticated SOCKS5 fleet
    crit: hostile
    conf: 0.95
    attack: "T1176,T1090,T1040"
    scope: archive
    all:
      - id: extension-fixed-socks5-browser-relay
      - id: proxy-endpoint-country-subdomain-fleet
    any:
      - id: premium-proxy-node-entry
      - id: micro-behaviors/browser-extension/tabs::install-https-tab-open

  # Unlike an ordinary browser VPN, this extension presents another provider's
  # brand while sending nearly every browser destination to Prado's fixed
  # forward proxy. The cross-brand identity legs establish intent; the proxy
  # legs establish the separate traffic-diversion behavior.
  - id: impersonator-routes-browser-through-prado-proxy
    desc: VPN impostor diverts traffic through Prado
    crit: hostile
    conf: 0.99
    attack: T1176,T1090,T1557
    scope: archive
    all:
      - id: well-known/app/browser-extension/prado-vpn::extension-infrastructure
      - id: metadata/permission/extension-api::permission-proxy
      - id: micro-behaviors/os/network/webextension::chrome-proxy-settings-set
      - id: micro-behaviors/os/network/webextension::chrome-proxy-fixed-server-mode
      - id: micro-behaviors/os/network/webextension::chrome-proxy-https-scheme
      - id: micro-behaviors/os/network/webextension::chrome-proxy-local-token-only-bypass
    any:
      - id: well-known/app/browser-extension/vpnly::display-name
      - id: well-known/app/browser-extension/urban-vpn::display-name
