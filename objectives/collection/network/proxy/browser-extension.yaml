defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  attack: T1090,T1040
traits:
- id: proxy-config-github-pages
  desc: References a GitHub Pages URL
  crit: component
  attack: none
  conf: 0.97
  if:
    type: text
    regex: 'https?://[A-Za-z0-9.-]+\.github\.io/'
- id: proxy-config-blogspot
  desc: References a Blogspot URL
  crit: component
  attack: none
  conf: 0.97
  if:
    type: text
    regex: 'https?://[A-Za-z0-9.-]+\.blogspot\.com/'
- id: proxy-config-google-docs
  desc: References a Google Docs document URL
  crit: component
  attack: none
  conf: 0.97
  if:
    type: text
    regex: 'https?://docs\.google\.com/document/d/'
- id: windscribe-brand-claim
  desc: Extension presents itself as Windscribe VPN
  crit: suspicious
  conf: 0.97
  for:
  - chrome-manifest
  - json
  if:
    type: value
    path: name
    regex: '(?i)windscribe.{0,24}vpn'

- id: fastsoedinenie-proxy-endpoint
  desc: Proxy uses Fastsoedinenie infrastructure
  crit: suspicious
  conf: 0.99
  if:
    type: text
    substr: fastsoedinenie.space

composite_rules:
- id: windscribe-brand-proxy-impostor
  for:
  - chrome-manifest
  - javascript
  - crx
  - xpi
  - zip
  desc: Windscribe lookalike routes traffic through a proxy
  crit: hostile
  conf: 0.99
  attack: T1176,T1090,T1557
  scope: archive
  all:
  - id: windscribe-brand-claim
  - id: metadata/permission/extension-api::permission-proxy
  - id: micro-behaviors/communications/proxy/config::chrome-proxy-settings-set
  - id: micro-behaviors/communications/proxy/config::chrome-proxy-fixed-server-mode
  unless:
  - id: well-known/app/browser-extension/windscribe::official-extension-id
- id: impersonator-routes-browser-through-prado-proxy
  for:
  - javascript
  - typescript
  - chrome-manifest
  - crx
  - xpi
  - zip
  desc: VPN impostor diverts traffic through Prado
  crit: hostile
  conf: 0.99
  attack: T1176,T1090,T1557
  scope: archive
  all:
  - id: well-known/app/browser-extension/prado-vpn::extension-infrastructure
  - id: metadata/permission/extension-api::permission-proxy
  - id: micro-behaviors/communications/proxy/config::chrome-proxy-settings-set
  - id: micro-behaviors/communications/proxy/config::chrome-proxy-fixed-server-mode
  - id: micro-behaviors/communications/proxy/config::chrome-proxy-https-scheme
  - id: micro-behaviors/communications/proxy/config::chrome-proxy-local-token-only-bypass
  any:
  - id: well-known/app/browser-extension/vpnly::display-name
  - id: well-known/app/browser-extension/urban-vpn::display-name
  - id: well-known/app/browser-extension/uvpn::display-name

# The brand gate above keeps the impostor rule to known VPN names. A copy that
# renames the product keeps the same Prado relay identity and the same archive
# proxy configuration, so the Prado infrastructure leg alone carries the brand.
# Prado-branded VPN storefronts use the same relay and proxy code under their
# own VPN names; those are Prado's legitimate products (notable), so the VPN
# name claim exempts them. A generic-named relay client stays hostile.
- id: prado-relay-routes-browser-traffic
  for:
  - javascript
  - typescript
  - chrome-manifest
  - crx
  - xpi
  - zip
  desc: Generic-named Prado relay routes all browser traffic
  crit: hostile
  conf: 0.97
  attack: T1176,T1090,T1557
  scope: archive
  all:
  - id: well-known/app/browser-extension/prado-vpn::extension-infrastructure
  - id: metadata/permission/extension-api::permission-proxy
  - id: micro-behaviors/communications/proxy/config::chrome-proxy-fixed-https-config
  unless:
  - id: metadata/package/description/function::extension-name-vpn-claim

- id: remotely-configured-vpn-proxy-farm
  for:
  - javascript
  - typescript
  - chrome-manifest
  - crx
  - xpi
  - zip
  - json
  desc: VPN extension routes traffic via remote proxies
  crit: suspicious
  conf: 0.94
  attack: T1176,T1090
  scope: archive
  all:
  - id: metadata/package/description/function::extension-name-vpn-claim
  - id: metadata/permission/host::host-permission-all-urls
  - id: metadata/permission/extension-api::permission-proxy
  - id: micro-behaviors/communications/proxy/config::chrome-proxy-settings-set
  - id: micro-behaviors/communications/proxy/config::chrome-pac-script-config
  - id: micro-behaviors/communications/http/auth::webrequest-auth-required-listener
  - id: micro-behaviors/communications/http/auth::auth-credentials-response
  any:
  - id: proxy-config-github-pages
  - id: proxy-config-blogspot
  - id: proxy-config-google-docs
  needs: 2

- id: remotely-configured-fixed-vpn-proxy-farm
  for:
  - javascript
  - typescript
  - chrome-manifest
  - crx
  - xpi
  - zip
  - json
  desc: VPN configures a fixed proxy from remote sources
  crit: hostile
  conf: 0.98
  attack: T1176,T1090,T1557
  scope: archive
  all:
  - id: metadata/package/description/function::extension-name-vpn-claim
  - id: metadata/permission/host::broad-host-access
  - id: metadata/permission/extension-api::permission-proxy
  - id: micro-behaviors/communications/proxy/config::chrome-proxy-settings-set
  - id: micro-behaviors/communications/proxy/config::chrome-proxy-fixed-server-mode
  - id: micro-behaviors/communications/http/auth::webrequest-auth-required-listener
  - id: micro-behaviors/communications/http/auth::auth-credentials-response
  any:
  - id: proxy-config-github-pages
  - id: proxy-config-blogspot
  - id: proxy-config-google-docs
  needs: 2

- id: fake-vpn-farm-traffic-interception
  for:
  - javascript
  - typescript
  - chrome-manifest
  - crx
  - xpi
  - zip
  desc: Fake VPN diverts traffic via SOCKS5 proxy farm
  crit: hostile
  conf: 0.99
  attack: T1176,T1090,T1557
  scope: archive
  all:
  - id: metadata/permission/extension-api::permission-proxy
  - id: micro-behaviors/communications/proxy/config::extension-fixed-socks5-browser-relay
  - id: well-known/dual-use/tunnel/browser-relay-cluster::proxy-farm-domain-security-brands
  - id: micro-behaviors/communications/proxy/config::extension-raw-ip-proxy-relay
