defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  attack: T1090,T1040
traits:
- id: windscribe-brand-claim
  desc: Extension presents itself as Windscribe VPN
  crit: suspicious
  conf: 0.97
  for:
  - chrome-manifest
  - json
  if:
    type: value
    path: name
    regex: '(?i)windscribe.{0,24}vpn'

- id: fastsoedinenie-proxy-endpoint
  desc: Proxy uses Fastsoedinenie infrastructure
  crit: suspicious
  conf: 0.99
  if:
    type: text
    substr: fastsoedinenie.space

composite_rules:
- id: windscribe-brand-proxy-impostor
  for:
  - chrome-manifest
  - javascript
  - crx
  - xpi
  - zip
  desc: Windscribe lookalike routes traffic through a proxy
  crit: hostile
  conf: 0.99
  attack: T1176,T1090,T1557
  scope: archive
  all:
  - id: windscribe-brand-claim
  - id: metadata/permission/extension-api::permission-proxy
  - id: micro-behaviors/communications/proxy/config::chrome-proxy-settings-set
  - id: micro-behaviors/communications/proxy/config::chrome-proxy-fixed-server-mode
  unless:
  - id: well-known/app/browser-extension/windscribe::official-extension-id
- id: impersonator-routes-browser-through-prado-proxy
  for:
  - javascript
  - typescript
  - chrome-manifest
  - crx
  - xpi
  - zip
  desc: VPN impostor diverts traffic through Prado
  crit: hostile
  conf: 0.99
  attack: T1176,T1090,T1557
  scope: archive
  all:
  - id: well-known/app/browser-extension/prado-vpn::extension-infrastructure
  - id: metadata/permission/extension-api::permission-proxy
  - id: micro-behaviors/communications/proxy/config::chrome-proxy-settings-set
  - id: micro-behaviors/communications/proxy/config::chrome-proxy-fixed-server-mode
  - id: micro-behaviors/communications/proxy/config::chrome-proxy-https-scheme
  - id: micro-behaviors/communications/proxy/config::chrome-proxy-local-token-only-bypass
  any:
  - id: well-known/app/browser-extension/vpnly::display-name
  - id: well-known/app/browser-extension/urban-vpn::display-name
  - id: well-known/app/browser-extension/uvpn::display-name

- id: fake-vpn-farm-traffic-interception
  for:
  - javascript
  - typescript
  - chrome-manifest
  - crx
  - xpi
  - zip
  desc: Fake VPN diverts traffic via SOCKS5 proxy farm
  crit: hostile
  conf: 0.99
  attack: T1176,T1090,T1557
  scope: archive
  all:
  - id: metadata/permission/extension-api::permission-proxy
  - id: micro-behaviors/communications/proxy/config::extension-fixed-socks5-browser-relay
  - id: well-known/dual-use/tunnel/browser-relay-cluster::proxy-farm-domain-security-brands
  - id: micro-behaviors/communications/proxy/config::extension-raw-ip-proxy-relay
