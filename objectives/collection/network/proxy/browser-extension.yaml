defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  attack: T1090,T1040
traits: []
composite_rules:
- id: impersonator-routes-browser-through-prado-proxy
  for:
  - javascript
  - typescript
  - chrome-manifest
  - crx
  - xpi
  - zip
  desc: VPN impostor diverts traffic through Prado
  crit: hostile
  conf: 0.99
  attack: T1176,T1090,T1557
  scope: archive
  all:
  - id: well-known/app/browser-extension/prado-vpn::extension-infrastructure
  - id: metadata/permission/extension-api::permission-proxy
  - id: micro-behaviors/os/network/webextension::chrome-proxy-settings-set
  - id: micro-behaviors/os/network/webextension::chrome-proxy-fixed-server-mode
  - id: micro-behaviors/os/network/webextension::chrome-proxy-https-scheme
  - id: micro-behaviors/os/network/webextension::chrome-proxy-local-token-only-bypass
  any:
  - id: well-known/app/browser-extension/vpnly::display-name
  - id: well-known/app/browser-extension/urban-vpn::display-name
  - id: well-known/app/browser-extension/uvpn::display-name
# A VPN-style extension whose server list is a table of bare IPv4 SOCKS5 relays
# split into a free node and premium nodes, applied to the whole browser with
# only loopback bypassed. A provider with real infrastructure names its hosts;
# anonymous relays with no DNS identity see every unencrypted request and
# DNS lookup the user makes, and the Free/Pro split is the lure.
- id: fake-vpn-premium-raw-ip-socks5-relay-fleet
  for:
  - javascript
  - typescript
  - chrome-manifest
  - crx
  - xpi
  - zip
  desc: VPN extension relays browser through raw-IP SOCKS5
  crit: hostile
  conf: 0.95
  attack: T1090,T1557
  scope: archive
  all:
  - id: metadata/permission/extension-api::permission-proxy
  - id: micro-behaviors/os/network/webextension::chrome-proxy-settings-set
  - id: micro-behaviors/os/network/webextension::extension-premium-raw-ip-proxy-catalog
  - id: micro-behaviors/os/network/webextension::chrome-proxy-loopback-bypass-constant
