# An extension sold as a VPN whose whole network function is pointing
# chrome.proxy at one hardcoded host, with only <local> bypassed. Every
# site the user visits is relayed through that operator, who sees all
# destinations and any plaintext traffic.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, javascript, typescript, zip]
  attack: T1090,T1557

composite_rules:
  - id: vpn-named-single-hardcoded-proxy
    desc: VPN-named extension routes all traffic to one hardcoded proxy host
    crit: hostile
    conf: 0.85
    scope: archive
    all:
      - id: metadata/package/description/function::extension-name-vpn-claim
      - id: micro-behaviors/communications/proxy/config::chrome-proxy-settings-set
      - id: micro-behaviors/communications/proxy/config::chrome-proxy-fixed-server-mode
      - id: micro-behaviors/communications/proxy/config::chrome-proxy-literal-single-host
      - id: micro-behaviors/communications/proxy/config::chrome-proxy-local-token-only-bypass
    unless:
      - id: well-known/app/browser-extension/windscribe::official-extension-id
