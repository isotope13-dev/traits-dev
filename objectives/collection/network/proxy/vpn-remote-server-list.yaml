# A VPN-named extension whose fixed browser proxy host is read from a server
# list fetched at runtime. The operator picks the relay, so it can be changed
# without a store update. The sibling vpn-named-hardcoded-proxy covers a host
# written into the package. A remote relay list is also how legitimate VPN
# storefronts work, so this stays notable and does not reach hostile on its
# own. Known campaign backends join it into hostile composites elsewhere.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, javascript, typescript, zip]
  attack: T1090,T1557

composite_rules:
  - id: vpn-remote-server-list-proxy
    desc: VPN-named extension routes browsing via a fetched server list
    crit: notable
    conf: 0.85
    scope: archive
    all:
      - id: metadata/package/description/function::extension-name-vpn-claim
      - id: metadata/permission/extension-api::permission-proxy
      - id: micro-behaviors/communications/proxy/config::chrome-proxy-remote-server-list
    unless:
      - id: well-known/app/browser-extension/windscribe::official-extension-id
