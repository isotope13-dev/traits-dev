# An extension that sets a PAC script sending every request through HTTPS
# proxies drawn from an embedded pool of throwaway-TLD domains. The operator
# of those relays sees every destination; the pool is built so individual
# hosts can be blocked or lapse without the extension losing its relay.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, xpi, javascript, typescript, zip]
  attack: T1090,T1557

composite_rules:
  - id: extension-pac-relay-over-throwaway-domain-pool
    desc: Extension relays browsing through a PAC chain over throwaway-TLD hosts
    crit: suspicious
    conf: 0.85
    scope: archive
    all:
      - id: micro-behaviors/communications/proxy/config::chrome-proxy-settings-set
      - id: micro-behaviors/communications/proxy/pool::pac-https-chain-from-host-array
      - id: micro-behaviors/communications/url/host/name::cheap-tld-bare-domain-list
