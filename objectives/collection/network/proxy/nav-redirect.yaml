# Browser extensions that hijack every top-level page load into a remote
# URL-rewriting endpoint (rather than configuring the browser's native
# chrome.proxy API). Distinct from the fixed-SOCKS5-relay abuse pattern in
# browser-extension.yaml: no chrome.proxy call at all — navigation itself is
# intercepted and rewritten, so the remote endpoint terminates TLS and can
# observe or alter every page the user visits.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1090

composite_rules:
  - id: extension-all-nav-remote-proxy-redirect
    desc: All navigation redirected through remote proxy
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-webnavigation-before-navigate
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-update-with-url
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
