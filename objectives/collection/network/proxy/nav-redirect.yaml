# Browser extensions that hijack every top-level page load into a remote
# URL-rewriting endpoint (rather than configuring the browser's native
# chrome.proxy API). Distinct from the fixed-SOCKS5-relay abuse pattern in
# browser-extension.yaml: no chrome.proxy call at all — navigation itself is
# intercepted and rewritten, so the remote endpoint terminates TLS and can
# observe or alter every page the user visits.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1090

composite_rules:
  - id: extension-all-nav-remote-proxy-redirect
    for: [javascript, typescript, chrome-manifest, crx, xpi, zip]
    desc: All navigation redirected through remote proxy
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-webnavigation-before-navigate
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-update-with-url
      - id: metadata/permission/manifest::host-permission-all-urls
      # The leg that makes this a *proxy* rather than a redirector: the
      # destination is assembled by URL-encoding another value, i.e. the page
      # the user asked for is handed to the new endpoint as data. Without it
      # the rule was four ubiquitous legs -- intercept navigation, set a tab
      # URL, hold <all_urls>, call encodeURIComponent somewhere in the bundle
      # -- which every link-rewriting extension satisfies (a shortlink
      # unwrapper that navigates the tab to the resolved destination matched
      # all four and was reported as a remote proxy).
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-update-encoded-destination
