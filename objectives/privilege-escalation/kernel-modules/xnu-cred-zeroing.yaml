# Kernel extension that zeroes a chosen process's credential UIDs: the
# "give PID root" backdoor of macOS rootkits.
defaults:
  platforms: [macos]
  for: [c]
  crit: hostile
  attack: T1068,T1014

composite_rules:
  - id: xnu-kext-grants-root-to-process
    desc: Kernel extension rewrites a process credential to UID 0
    conf: 0.94
    all:
      - id: micro-behaviors/os/kernel/credential::posix-cred-uid-zeroed
      - id: micro-behaviors/os/kernel/credential::xnu-process-posix-cred-lookup
