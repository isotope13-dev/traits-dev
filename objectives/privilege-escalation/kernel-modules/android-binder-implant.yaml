# Post-root kernel-module implant delivered through a binder exploit. After the
# binder command-injection chain yields uid 0, the payload remounts the root
# filesystem read-write and inserts a kernel module (`mount -o rw,remount /;
# insmod x.ko`). The raw binder transaction distinguishes an exploit payload
# from a benign rooting-framework script that legitimately does remount+insmod.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1547.006

composite_rules:
  - id: binder-exploit-kernel-implant
    desc: Binder exploit remounts root and loads kernel module
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/communications/ipc/binder::servicemanager-reflection
      - id: micro-behaviors/communications/ipc/binder::binder-transact
      - id: micro-behaviors/fs/volume/mount::remount-root-writable
      - id: micro-behaviors/os/kernel/module::insmod-command
