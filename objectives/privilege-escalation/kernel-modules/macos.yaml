# Kernel Extensions - macOS Privilege Escalation
# MBC: F0010 (Kernel Modules and Extensions)
# ATT&CK: T1547.006 (Kernel Modules and Extensions)
#
# macOS kernel extensions (kexts) run with kernel privileges.
# Modern macOS requires SIP disabled or signed kexts, but malware
# may attempt to load unsigned kexts or abuse system extensions.
defaults:
  crit: suspicious
  mbc: "F0010"
  attack: "T1547.006"
  platforms: [macos]
traits:
  # coretls's own helper copies tlsnke.kext to /tmp and kextloads that copy.
  - id: coretls-loadkext-helper
    desc: coretls helper loads its test kext
    crit: notable
    conf: 0.95
    for: [shell]
    if:
      type: path
      regex: '(^|[\\/])loadkext\.sh$'
  # Scripts: the temp path must be the kextload/kextutil argument on the live
  # command line. File-wide pooling matched xnu kxld tests/loadtest.py, whose
  # only /tmp is a commented-out `kextload -ns /tmp/syms` beside loads of
  # installed kexts found by kextfind.
  - id: kext-load-temp-path-command
    desc: Kernel extension loaded from a temp path
    conf: 0.9
    for: [shell, python]
    if:
      type: text
      regex: 'kext(load|util)\b[^\n]{0,120}(/(private/)?(var/)?tmp/|\$\{?TMPDIR\}?/)'
      exclude_comments: true
    unless:
      - id: coretls-loadkext-helper
composite_rules:
  # kextload + shell exec = suspicious kext-based privesc
  - id: kext-shell-exec
    desc: Kernel extension load with shell execution
    conf: 0.85
    all:
      - id: micro-behaviors/os/kernel/module::macos-kext-load
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
    downgrade:
      any:
        - id: metadata/signature/verified/platform::apple
    unless:
      - id: well-known/tool/development/cli/zshrs::zshrs-test-corpus-path
      - id: well-known/tool/detection/pattern-catalog::command-pattern-guard-catalog
  # kextload from non-standard path
  - id: kext-from-temp
    desc: Kernel extension loaded with temp path reference
    conf: 0.9
    for: [macho]
    all:
      - id: micro-behaviors/os/kernel/module::macos-kext-load
    any:
      - id: micro-behaviors/fs/path/temp::any-temp-path
    downgrade:
      any:
        - id: metadata/signature/verified/platform::apple
    unless:
      - id: coretls-loadkext-helper
