defaults:
  platforms: [unix]
  for: [java, class, java_class, jar]
  attack: T1553.004

traits:
  - id: java-keytool-system-cacerts-import
    desc: Java keytool imports into cacerts
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'keytool[\s\S]{0,220}-importcert[\s\S]{0,220}-keystore[\s\S]{0,120}cacerts'

  - id: java-keytool-command-reference
    desc: Java bytecode references the keytool utility
    crit: notable
    conf: 0.94
    for: [java_class]
    if:
      # Byte-level: java_class files expose no extracted text runs, so this
      # must stay a raw-byte match. The trailing [^s] is what keeps it off
      # package names such as org.apache.parquet.crypto.keytools, a Parquet
      # key-material store rather than an invocation of the keytool binary.
      type: yara
      source: |
        rule java_keytool_command_reference {
          strings:
            $k = /keytool[^s]/
          condition:
            $k
        }
    unless:
      - id: metadata/library/structure::vscode-language-server-library
      - type: path
        substr: language-server/lib
      - type: text
        substr: io/netty/handler/ssl/util/KeytoolSelfSignedCertGenerator

  - id: java-cacerts-storepass
    desc: Java cacerts storepass
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'cacerts[\s\S]{0,180}(-storepass|storepass|STOREPASS)[\s\S]{0,60}changeit'

  - id: java-cacerts-changeit-bytes
    desc: Java cacerts changeit bytes
    crit: component
    conf: 0.92
    for: [java_class]
    if:
      type: hex
      pattern: 63 68 61 6E 67 65 69 74

composite_rules:
  - id: java-keytool-cacerts-import
    desc: Java cacerts cert import
    crit: hostile
    conf: 0.98
    all:
      - id: java-keytool-system-cacerts-import
      - id: java-cacerts-storepass

  - id: java-bytecode-cacerts-import
    desc: Java bytecode cert import
    crit: hostile
    conf: 0.98
    for: [java_class]
    all:
      - id: java-keytool-command-reference
      - id: java-cacerts-changeit-bytes
