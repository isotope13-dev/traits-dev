# .NET trust subversion.
#
# A program that carries a certificate as an embedded assembly resource and
# drops it straight into the machine-wide trusted root store makes Windows
# trust everything that certificate signs, for every user, with no prompt and
# no installer dialog. Legitimate agents that need a private CA install it from
# a policy/config file, not from a blob compiled into their own executable.
defaults:
  platforms: [windows]
  for: [csharp]
  mbc: "F0016"
  attack: "T1553.004"

composite_rules:
  - id: dotnet-embedded-root-ca-install
    desc: Embedded certificate installed into machine trusted root store
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/crypto/certificate/install::dotnet-machine-root-store-add
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-source-manifest-resource-stream-call
