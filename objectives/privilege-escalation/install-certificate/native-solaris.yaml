defaults:
  platforms: [solaris, unix]
  for: [c, cpp, objc, elf]
  attack: T1553.004

traits:
  - id: solaris-certutil-trust-add
    desc: Solaris certutil trust add
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: CTu,CTu,CTu

composite_rules:
  - id: solaris-native-root-ca-install
    desc: Solaris native root CA install
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/certificate/usage::openssl-self-signed-cert
      - id: solaris-certutil-trust-add
