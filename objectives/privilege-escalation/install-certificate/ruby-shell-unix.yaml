defaults:
  platforms: [unix]
  for: [ruby, shell]
  attack: T1553.004

traits:
  - id: shell-certutil-user-ca
    desc: Shell certutil user CA install
    crit: suspicious
    conf: 0.94
    for: [shell]
    if:
      type: text
      regex: 'certutil -A[\s\S]{0,160}Custom Root CA'

composite_rules:
  - id: ruby-unix-root-ca-mitm
    desc: Ruby Unix root CA MITM
    crit: hostile
    conf: 0.98
    for: [ruby]
    all:
      - id: micro-behaviors/crypto/certificate/install::update-ca-certificates
    any:
      - id: micro-behaviors/crypto/certificate/install::ca-certificates-path
      - id: micro-behaviors/fs/path/certificate::ssl-certs-path
      - id: micro-behaviors/crypto/certificate/extensions::ruby-server-certificate-extensions
    needs: 2
