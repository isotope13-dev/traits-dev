defaults:
  platforms: [unix]
  for: [rust, binaries]
  attack: T1553.004

composite_rules:
  - id: rust-rogue-ca-install
    desc: Installs rogue root CA into trust
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/certificate/usage::openssl-self-signed-cert
      - id: micro-behaviors/crypto/certificate/install::ca-certificates-path
    any:
      - id: micro-behaviors/crypto/certificate/install::update-ca-certificates
      - id: micro-behaviors/crypto/certificate/usage::openssl-ca-signing-profile
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::rust-crate-example-path
