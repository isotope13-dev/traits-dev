defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1134.001,T1055
  mbc: B0033

composite_rules:
  - id: rustaegis-debug-privilege-injector
    desc: RustAegis injector enables debug privilege for remote memory writes
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/lib/runtime/protection/rustaegis::rustaegis-protected-binary
      - id: micro-behaviors/os/privilege/token::encrypted-debug-privilege-adjustment
      - id: micro-behaviors/process/inject/runtime/ntapi::encrypted-nt-write-virtual-memory
      - id: micro-behaviors/process/inject/runtime/ntapi::encrypted-nt-open-process
