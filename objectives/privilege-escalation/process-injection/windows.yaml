defaults:
  mbc: E1055
  attack: T1055
  platforms:
    - windows
  for:
    - pe
    - dll
    - rust
composite_rules:
  - id: unsigned-template-debug-privilege-loader
    desc: Unsigned PE references thread and token APIs
    crit: hostile
    conf: 0.98
    attack: T1134.001,T1055.003
    for: [pe, dll]
    all:
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: micro-behaviors/os/privilege/token/use::adjust-token-privileges-any
      - id: micro-behaviors/process/attach/rights::open-process
      - id: micro-behaviors/process/enumerate/psapi::enum-processes
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
    downgrade:
      any:
        - id: metadata/lang/compiler/aot::nativeaot-runtime-token-surface-only
