defaults:
  mbc: E1055
  attack: T1055
  platforms:
    - windows
  for:
    - pe
    - dll
    - rust
composite_rules:
  - id: hollow-privileged-process
    for: [pe]
    desc: Process hollowing of privileged process
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/info/name::windows-service-process-references
      - id: objectives/evasion/process/injection/hollowing/process::hollowing-primitives
  - id: unsigned-template-debug-privilege-loader
    desc: Unsigned template PE enables debug privilege for thread hijacking
    crit: hostile
    conf: 0.98
    attack: T1134.001,T1055.003
    for: [pe, dll]
    all:
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: micro-behaviors/os/privilege/token::adjust-token-privileges-any
      - id: micro-behaviors/process/attach/rights::open-process
      - id: micro-behaviors/process/enumerate/psapi::enum-processes
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/
      # NativeAOT statically links the .NET runtime, whose startup/import
      # surface includes these process and privilege APIs without performing
      # thread hijacking. Preserve this chain for ordinary unsigned PEs.
      - id: metadata/lang/compiler/aot
