defaults:
  mbc: E1055
  attack: T1055
  platforms:
    - windows
  for:
    - pe
    - dll
    - rust
composite_rules:
  - id: module-stomping-payload-injector
    desc: Binary implements module stomping payload injection
    crit: hostile
    conf: 0.98
    attack: T1055.012
    for: [pe, dll]
    all:
      - id: micro-behaviors/process/inject/module-stomping::module-stomping-loader-log
      - id: metadata/signature/absent::unsigned-missing-signature-record

  - id: unsigned-template-debug-privilege-loader
    desc: Unsigned PE references thread and token APIs
    crit: hostile
    conf: 0.98
    attack: T1134.001,T1055.003
    for: [pe, dll]
    all:
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: micro-behaviors/os/privilege/token/use::adjust-token-privileges-any
      - id: micro-behaviors/process/attach/rights::open-process
      - id: micro-behaviors/process/enumerate/psapi::enum-processes
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
    unless:
      # NativeAOT's runtime imports thread-context and token APIs for GC
      # thread hijacking; the marker refuses binaries naming any privilege
      # beyond the runtime's own, so it only covers that runtime surface.
      - id: metadata/lang/compiler/aot::nativeaot-runtime-token-surface-only

  - id: node-addon-thread-context-injection
    desc: Node native addon accesses process and manipulates thread execution context
    crit: hostile
    conf: 0.95
    attack: T1055.003
    for: [pe, dll]
    all:
      - id: micro-behaviors/process/attach/rights::open-process
      - id: micro-behaviors/process/info/thread::thread-context-pair-get-set
    any:
      - id: metadata/binary/symbols/imports::node-api-symbol-table-families
      - id: metadata/binary/symbols/exports::node-api-addon-export

