defaults:
  platforms: [linux]
  for: [scripts, source]
  attack: T1548.003

composite_rules:
  - id: beyondtrust-passwordless-template-rebuild
    desc: Passwordless sudo template append and rebuild
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/config/sudo::beyondtrust-sudoers-template-append
      - id: micro-behaviors/fs/config/sudo::nopasswd-all-directive
      - id: micro-behaviors/fs/config/system::beyondtrust-misc-config-rebuild
    near_bytes: 1024

  # Provisioning can legitimately rebuild sudoers. Erasing both the vault's
  # audit trail and active appliance security logs around an unrestricted
  # grant distinguishes concealed root access from routine provisioning.
  # This detects the configuration change, not a successful sudo invocation
  # or installation of a startup hook absent from the retained script.
  - id: beyondtrust-passwordless-root-with-log-erasure
    desc: Passwordless root grant with appliance audit erasure
    crit: hostile
    conf: 0.99
    for: [shell]
    attack: T1548.003,T1070.002
    all:
      - id: micro-behaviors/fs/config/sudo::beyondtrust-unrestricted-template-append
      - id: micro-behaviors/fs/config/system::beyondtrust-misc-config-rebuild
      - id: objectives/evasion/indicator-removal/log-removal::beyondtrust-vault-audit-removal
    any:
      - id: objectives/evasion/indicator-removal/log-removal::appliance-active-security-log-removal
      - id: objectives/evasion/indicator-removal/log-removal::appliance-active-log-rm-command
    near_bytes: 2048
