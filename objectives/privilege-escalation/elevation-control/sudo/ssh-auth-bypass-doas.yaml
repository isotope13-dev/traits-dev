# Non-interactive sudo or passwordless doas root escalation over an SSH
# overlong-password authentication-bypass session (e.g., Alpine tiny-cloud
# passwordless `doas id` / `doas sh` / `doas -n` from default `*`-shadow
# accounts such as `alpine`).
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, -beam, -wasm, -static-lib]
  attack: T1548.003,T1021.004

traits:
  - id: doas-flag-or-path-cmd
    desc: Runs doas with flag or path
    crit: notable
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      regex: '(?m)(^|[''"`;|&][ \t]*)(/usr/bin/)?doas[ \t]+(-[nsu]\b|/[\w./-]+)'
    unless:
      - id: metadata/file/format/news::serialized-news-article-catalog

  - id: doas-shell-or-id-cmd
    desc: Runs doas shell, su, or id
    crit: notable
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      regex: '(?m)(^|[''"`;|&][ \t]*)(/usr/bin/)?doas[ \t]+(id|([bd]?a)?sh|su)\b'
    unless:
      - id: metadata/file/format/news::serialized-news-article-catalog

composite_rules:
  - id: doas-or-noninteractive-sudo-elevation
    desc: Invokes non-interactive sudo or OpenBSD/Alpine doas
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/os/privilege/elevation::sudo-noninteractive
      - id: micro-behaviors/os/privilege/elevation::doas-command
      - id: doas-flag-or-path-cmd
      - id: doas-shell-or-id-cmd

  - id: ssh-overlong-password-noninteractive-elevation
    desc: Sudo or passwordless doas over SSH auth bypass
    crit: hostile
    conf: 0.99
    all:
      - id: doas-or-noninteractive-sudo-elevation
    any:
      - id: objectives/lateral-movement/exploit/cve::ssh-askpass-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::sshpass-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::paramiko-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::asyncssh-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::go-ssh-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::go-binary-ssh-overlong-password-exec
      - id: objectives/lateral-movement/exploit/cve::c-libssh-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::native-libssh-overlong-password-exec
      - id: objectives/lateral-movement/exploit/cve::rust-ssh-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::node-ssh2-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::ruby-net-ssh-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::php-ssh-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::jvm-ssh-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::csharp-sshnet-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::posh-ssh-overlong-password-remote-exec
