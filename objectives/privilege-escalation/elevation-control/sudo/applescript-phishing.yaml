# A fake password dialog, dscl verification and Keychain-read profile provide
# theft context; sudo's -S option alone remains a neutral capability. An
# authentication helper without targeted store reads does not qualify.
# System LaunchDaemon commands through sudo attempt a higher-authority
# operation even when the daemon's UserName selects the original user.
# This rule records
# co-occurrence, not proven password-value flow or successful elevation.
defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
  attack: T1548.003

composite_rules:
  - id: keychain-phish-sudo-system-commands
    desc: Password phishing, Keychain reads and sudo daemon commands
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/credential-access/phishing/lure::applescript-credential-phish-hostile
      - id: objectives/credential-access/keychain/theft::password-phishing-keychain-store-read-profile
      - id: micro-behaviors/process/create/sudo::sudo-stdin-password
      - id: objectives/persistence/system/launchd/submit::sudo-pipe-launchdaemon
