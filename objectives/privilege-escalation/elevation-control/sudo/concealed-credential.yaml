defaults:
  platforms: [macos]
  for: [scripts, source]
composite_rules:
  - id: concealed-validated-password-sudo
    desc: Password verification and sudo stdin use with zero-width config encoding
    crit: suspicious
    conf: 0.96
    attack: T1548.003
    near_bytes: 4096
    all:
      - id: objectives/anti-static/obfuscation/steganography/invisible-unicode::zero-width-config-index
      - id: micro-behaviors/os/security/auth/verify::dscl-password-verification
      - id: micro-behaviors/process/create/sudo::sudo-password-on-stdin
