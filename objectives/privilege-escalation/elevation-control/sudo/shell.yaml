# Sudo Privilege Escalation Detection for Shell Scripts
# ATT&CK: T1548.003 (Abuse Elevation Control Mechanism: Sudo and Sudo Caching)
# Detects suspicious sudo usage patterns in dropper scripts
defaults:
  for: [shell]
  crit: suspicious
  attack: "T1548.003"
  platforms: [unix]
traits:
  # === Sudo Privilege Enumeration ===
  - id: sudo-list
    desc: sudo -l privilege enumeration
    crit: notable
    conf: 0.85
    attack: "T1033"
    if:
      type: text
      word: sudo -l
  # === Sudo with Execution Permissions ===
  - id: sudo-chmod-777-tmp
    desc: sudo chmod 777 in temp paths
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'sudo\s+chmod\s+777\s+(/tmp/|/var/tmp/|/dev/shm/|\./)'
  - id: sudo-chmod-777-user
    desc: sudo chmod 777 in user-writable paths
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'sudo\s+chmod\s+777\s+(/home/|/root/|/usr/local/bin/)'
  # === Sudo with Background Execution ===
  - id: sudo-nohup
    desc: sudo nohup background execution
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'sudo\s+nohup\s+'
  # === Sudo with Direct Execution ===
  - id: sudo-tmp-path
    desc: sudo invokes executable under /tmp
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'sudo\s+/tmp/\S+'
  - id: sudo-tmp-sh-installer
    desc: sudo runs /tmp shell installer script
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'sudo\s+/tmp/\S+\.sh\b'
  - id: ansible-role-files-path
    desc: Ansible role path
    crit: notable
    conf: 0.9
    if:
      type: path
      dirname: true
      regex: '(^|[\\/])roles[\\/]'
  - id: shared-hidden-file-sudo-replay
    desc: Hidden Shared file feeds sudo stdin
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: 'cat\s+/Users/Shared/\.[\w.-]+[\s\S]{0,400}\|\s*sudo\s+-S\b'
composite_rules:
  - id: sudo-tmp-exec
    desc: sudo execution from /tmp directory
    crit: suspicious
    conf: 0.9
    all:
      - id: sudo-tmp-path
    unless:
      - id: sudo-tmp-sh-installer
      - id: well-known/app/infrastructure/skypilot::skypilot-source-file
      - id: well-known/app/infrastructure/openshift::openshift-release-ci-step-context
  - id: sudo-chmod-777
    desc: sudo chmod 777 on writable execution paths
    crit: suspicious
    conf: 0.9
    any:
      - id: sudo-chmod-777-tmp
      - id: sudo-chmod-777-user
  - id: shared-file-sudo-password-replay
    desc: Replays a hidden Shared file as sudo password
    crit: hostile
    conf: 0.99
    all:
      - id: shared-hidden-file-sudo-replay
      - id: micro-behaviors/process/create/sudo::sudo-password-on-stdin
