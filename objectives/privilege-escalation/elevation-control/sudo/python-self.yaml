defaults:
  platforms: [unix]
  for: [python]
  attack: T1548.003

traits:
  - id: sudo-noninteractive-python-self-relaunch
    desc: Noninteractive sudo self-relaunch
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '[\[({]\s*["'']sudo["'']\s*,\s*["'']-n["'']\s*,\s*["'']python3?["'']\s*,\s*__file__'

composite_rules:
  - id: python-sudo-self-elevation
    desc: Python attempts unattended self-elevation through sudo
    crit: hostile
    conf: 0.99
    all:
      - id: sudo-noninteractive-python-self-relaunch
      - id: micro-behaviors/os/privilege/check::os-geteuid-root-check
      - id: micro-behaviors/process/create/subprocess::process-execution
