defaults:
  platforms: [unix]
  for: [scripts, source]
  attack: T1548.003

composite_rules:
  - id: passwordless-root-shell-dropin
    desc: Installs passwordless root shell access
    crit: hostile
    conf: 0.99
    near_lines: 12
    all:
      - id: micro-behaviors/fs/config/sudo::sudoers-nopasswd-shell-command
      - id: micro-behaviors/fs/config/sudo::writes-sudoers-dropin

  - id: passwordless-sudoers-dropin
    desc: Creates an unrestricted passwordless sudoers drop-in
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/config/privesc::etc-sudoers-d
      - id: micro-behaviors/fs/config/sudo::nopasswd-all-directive
    unless:
      - id: transient-passwordless-sudoers-dropin
      - id: managed-service-account-sudo
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: well-known/app/system/startos/
      - id: metadata/package/testing/
      - id: metadata/build/ci/
      - id: passwordless-sudo-build-provisioning
      - id: metadata/package/tooling::distrobox-source-tree
      - id: metadata/package/tooling::proxmoxve-community-scripts

  # `passwordless-sudoers-dropin` only proves the directive text is present --
  # a hardening checklist, a linter fixture and a README all contain it. This
  # adds the other half: something in the same file is *writing* that text into
  # the drop-in directory, by redirect, by `install`, or by piping into `tee`.
  # Text plus the write is an installation, and the build-provisioning and
  # test-fixture carve-outs on the leg still apply because they are inherited
  # through it.
  - id: installs-unrestricted-sudoers-dropin
    desc: Installs an unrestricted sudoers drop-in
    crit: hostile
    conf: 0.97
    near_lines: 12
    all:
      - id: passwordless-sudoers-dropin
      - id: micro-behaviors/fs/config/sudo::writes-sudoers-dropin

  - id: passwordless-sudo-build-provisioning
    desc: Recognized build-tool passwordless sudo provisioning
    crit: exception
    conf: 0.99
    any:
      - id: metadata/build/docker::shell-dockerfile-heredoc
      - id: metadata/build/ci/host::remote-wheel-build-host
      - id: well-known/app/infrastructure/aws-agent-toolkit::agent-toolkit-context
      - id: well-known/tool/development/vscode-devcontainers::devcontainer-passwordless-sudo-setup
      # A script that picks its package manager from `/etc/os-release` is
      # building an image, not running on one. HTCondor's
      # `build_condor_image.sh` grants the container user passwordless sudo
      # under the comment "Container users can sudo", three lines after
      # `$INSTALL lintian net-tools`, and was convicted hostile for it.
      - id: metadata/build/docker::os-release-distro-branch
      # Same reasoning, stated from the build invocation instead of the distro
      # branch: dbus's tools/ci-install.sh execs `docker build -t ci-image .`
      # and grants passwordless sudo only inside its `ci_in_docker` branch.
      # Vendored into the libdbus-sys crate, it scored hostile.
      - id: metadata/build/docker::shell-docker-image-build
      - id: well-known/app/infrastructure/ansible::ansible-test-bootstrap-context
      - id: well-known/lib/ai/ibm-watsonx-orchestrate::ibm-watsonx-orchestrate-context
      - id: well-known/tool/development/crabbox::crabbox-context

  - id: transient-passwordless-sudoers-dropin
    for: [shell]
    desc: Exit cleanup removes passwordless sudo drop-in
    crit: exception
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/config/privesc::etc-sudoers-d
      - id: micro-behaviors/fs/config/sudo::nopasswd-all-directive
      - id: micro-behaviors/fs/delete/file/command::sudoers-path-removal
      - id: micro-behaviors/process/exit/handler::shell-exit-trap

  - id: managed-service-account-sudo
    desc: Managed service account sudo provisioning
    crit: exception
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/config/privesc::etc-sudoers-d
      - id: micro-behaviors/fs/config/sudo::nopasswd-all-directive
    any:
      - id: well-known/app/infrastructure/gardener::gardener-user-sudoers-marker
      - id: well-known/app/infrastructure/jenkins::service-home-path

  - id: passwordless-sudoers-root-handoff
    for: [shell, python, rust, c, go]
    desc: Adds a passwordless sudo root handoff
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/config/privesc::etc-sudoers
      - id: micro-behaviors/fs/config/sudo::nopasswd-all-directive
      - id: micro-behaviors/process/create/sudo::sudo-noninteractive
      - id: micro-behaviors/process/create/sudo::sudo-root-shell
    unless:
      - id: well-known/tool/detection/agent-glovebox::archive-context
