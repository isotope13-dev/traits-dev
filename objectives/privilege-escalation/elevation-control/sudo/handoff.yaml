defaults:
  platforms: [unix]
  for: [scripts, source]
  attack: T1548.003

composite_rules:
  - id: passwordless-sudoers-dropin
    desc: Creates an unrestricted passwordless sudoers drop-in
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/config/privesc::etc-sudoers-d
      - id: micro-behaviors/fs/config/sudo::nopasswd-all-directive
    unless:
      - id: transient-passwordless-sudoers-dropin
      - id: managed-service-account-sudo
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: well-known/app/system/startos/
      - id: metadata/package/testing/
      - id: metadata/build/ci/
      - id: passwordless-sudo-build-provisioning

  - id: passwordless-sudo-build-provisioning
    desc: Recognized build-tool passwordless sudo provisioning
    crit: exception
    conf: 0.99
    any:
      - id: metadata/build/docker::shell-dockerfile-heredoc
      - id: metadata/build/ci/host::remote-wheel-build-host
      - id: well-known/app/infrastructure/aws-agent-toolkit::agent-toolkit-context
      - id: well-known/tool/development/vscode-devcontainers::devcontainer-passwordless-sudo-setup
      - id: well-known/app/infrastructure/ansible::ansible-test-bootstrap-context
      - id: well-known/lib/ai/ibm-watsonx-orchestrate::ibm-watsonx-orchestrate-context

  - id: transient-passwordless-sudoers-dropin
    desc: Exit cleanup removes passwordless sudo drop-in
    crit: exception
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/config/privesc::etc-sudoers-d
      - id: micro-behaviors/fs/config/sudo::nopasswd-all-directive
      - id: micro-behaviors/fs/delete/file::sudoers-path-removal
      - id: micro-behaviors/process/exit/handler::shell-exit-trap

  - id: managed-service-account-sudo
    desc: Managed service account sudo provisioning
    crit: exception
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/config/privesc::etc-sudoers-d
      - id: micro-behaviors/fs/config/sudo::nopasswd-all-directive
    any:
      - id: well-known/app/infrastructure/gardener::gardener-user-sudoers-marker
      - id: well-known/app/infrastructure/jenkins::service-home-path

  - id: passwordless-sudoers-root-handoff
    desc: Adds a passwordless sudo root handoff
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/config/privesc::etc-sudoers
      - id: micro-behaviors/fs/config/sudo::nopasswd-all-directive
      - id: micro-behaviors/process/create/sudo::sudo-noninteractive
      - id: micro-behaviors/process/create/sudo::sudo-root-shell
    unless:
      - id: well-known/tool/detection/agent-glovebox::archive-context
