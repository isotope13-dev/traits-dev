defaults:
  platforms: [unix]
  for: [scripts, source]
  attack: T1548.003

composite_rules:
  - id: passwordless-root-shell-dropin
    desc: Installs passwordless root shell access
    crit: hostile
    conf: 0.99
    near_lines: 12
    all:
      - id: micro-behaviors/fs/config/sudo::sudoers-nopasswd-shell-command
      - id: micro-behaviors/fs/config/sudo::writes-sudoers-dropin

  - id: passwordless-sudoers-root-handoff
    for: [shell, python, rust, c, go]
    desc: Adds a passwordless sudo root handoff
    crit: suspicious
    conf: 0.98
    # The grant and the sudo -n bash invocation are one handoff. Without a
    # bound, a deploy tool's error hint that quotes a sudoers line pools with
    # an unrelated sudo -n bash elsewhere in the same file.
    near_lines: 15
    all:
      - id: micro-behaviors/fs/path/config/privesc::etc-sudoers
      - id: micro-behaviors/fs/config/sudo::nopasswd-all-directive
      - id: micro-behaviors/process/create/sudo::sudo-noninteractive
      - id: micro-behaviors/process/create/sudo::sudo-root-shell
    unless:
      - id: well-known/tool/detection/agent-glovebox::archive-context
