# Tesseract Agent Passwordless Sudo Escalation
#
# Detects Tesseract agent's malicious behavior of creating a sudoers.d
# drop-in file to grant itself passwordless root privileges.

defaults:
  for: [shell, scripts, source]
  platforms: [unix]
  attack: T1548.003
  crit: hostile

traits:
  - id: tesseract-sudoers-dropin-write
    desc: Writes passwordless sudoers drop-in
    crit: hostile
    conf: 0.99
    if:
      type: text
      # Bounded regex to fix re-nested error
      regex: '(?m)printf.{0,200}NOPASSWD:ALL.{0,200}/etc/sudoers\.d/'

composite_rules:
  - id: tesseract-passwordless-sudo-grant
    desc: Tesseract agent grants itself passwordless root
    crit: hostile
    conf: 0.99
    all:
      - id: tesseract-sudoers-dropin-write
      - id: micro-behaviors/fs/config/sudo::installs-unrestricted-sudoers-dropin
