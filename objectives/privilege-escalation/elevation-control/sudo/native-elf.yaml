defaults:
  platforms: [unix, android]
  for: [elf]
  attack: T1548.003

traits:
  - id: native-sudo-relaunch-marker
    desc: Diagnostic announces attempted sudo elevation
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # Advice to the user ("not running as root, try again with sudo")
      # does not announce an automatic relaunch. Require an action marker.
      regex: '(?i)attempting to (re(start|launch)|escalate privileges)[^\n]{0,160}sudo'
    unless:
      - id: well-known/dual-use/remote-admin/rustdesk/
