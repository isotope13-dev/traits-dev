defaults:
  platforms: [android, unix]
  for: [shell]
  attack: T1548.003
traits:
  - id: exec-found-su-path
    desc: Executes discovered su binary
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bexec\s+\$\{?[A-Za-z0-9_]*[Ss][Uu][A-Za-z0-9_]*\}?\s+"\$@"'

  - id: su-app-private-native-exec
    desc: su launches native app payload
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?im)^\s*su\s+/data/(data|app-lib)/\S+/(\S+\.so)\s+(android|persisted)\s+exit\b'

  - id: su-app-private-data-variant
    desc: su launches native payload from app data
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\s*su\s+/data/data/\S+/\S+\.so\b'

  - id: su-app-private-app-lib-variant
    desc: su launches native payload from app-lib
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\s*su\s+/data/app-lib/\S+/\S+\.so\b'

composite_rules:
  - id: android-su-private-native-variants
    desc: Android su launches private native variants
    crit: suspicious
    conf: 0.98
    all:
      - id: su-app-private-data-variant
      - id: su-app-private-app-lib-variant

  - id: android-su-wrapper
    desc: Android su wrapper searches root paths
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/binary::android-su-root-binary-paths
      - id: exec-found-su-path
  - id: npm-package-ships-su-wrapper
    desc: npm package ships Android su wrapper
    crit: hostile
    conf: 0.98
    for: [archives]
    scope: archive
    all:
      - id: micro-behaviors/fs/path/binary::android-su-root-binary-paths
      - id: exec-found-su-path
      - id: metadata/package/files/included::package-json-basename
      - id: metadata/package/quality/empty::npm-has-name
      - id: metadata/package/files/included::su-basename
