# A script that pipes a hardcoded password into sudo or doas and, on the same
# few lines, writes the binfmt_misc register installs a root-level handler for
# every matching file. Either leg alone has ordinary administration uses
# (provisioning with a secret, registering an emulator). Together they show
# the elevation credential is embedded and the privileged action is a kernel
# execution hook.
defaults:
  platforms: [linux]
  for: [scripts]
  attack: T1548.003,T1552.001,T1546

composite_rules:
  - id: binfmt-handler-register-via-piped-password
    desc: Hardcoded password feeds elevated binfmt_misc handler registration
    crit: hostile
    conf: 0.95
    scope: file
    near_lines: 3
    all:
      - id: micro-behaviors/os/privilege/elevation::elevation-literal-password-pipe
      - id: micro-behaviors/os/kernel/control::linux-binfmt-misc-register-path
