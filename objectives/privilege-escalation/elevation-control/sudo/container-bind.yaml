defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1548.003,T1611
composite_rules:
  - id: privileged-sudoers-bind-passwordless-grant
    desc: Host sudoers mount with passwordless grant
    crit: suspicious
    conf: 0.97
    near_bytes: 1024
    # Grant text plus a privileged host-config mount is an escalation setup,
    # not proof that the container was started or the grant was installed.
    all:
      - id: micro-behaviors/os/container/runtime::javascript-privileged-sudoers-bind
      - id: micro-behaviors/fs/config/sudo::nopasswd-all-directive
