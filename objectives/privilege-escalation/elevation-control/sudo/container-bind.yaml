defaults:
  platforms:
  - unix
  for:
  - javascript
  - typescript
  attack: T1548.003,T1611
composite_rules:
- id: privileged-sudoers-bind-passwordless-grant
  desc: Host sudoers mount with passwordless grant
  crit: suspicious
  conf: 0.97
  near_bytes: 1024
  all:
  - id: micro-behaviors/os/container/runtime::javascript-privileged-sudoers-bind
  - id: micro-behaviors/fs/config/sudo::nopasswd-all-directive
- id: privileged-container-sudoers-escape
  desc: Runner secret scraper creates privileged host-sudoers container
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/os/container/runtime::javascript-privileged-sudoers-bind
  - id: micro-behaviors/os/container/runtime::docker-api-container-create-path
  - id: objectives/credential-access/memory::github-runner-process-memory-secret-dump
