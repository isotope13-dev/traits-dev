# KDE desktop launchers can request a different UID.  The declaration is a
# neutral capability; an explicit root target is the minimum context for an
# elevation signal, and concealment makes the combined behavior hostile.
defaults:
  platforms: [linux]
  for: [desktop-entry]
  attack: T1548

composite_rules:
  # Notable, not suspicious: `X-KDE-SubstituteUID` with `X-KDE-Username=root`
  # is the documented way to ship a graphical admin tool, and distributions
  # carry dozens of them -- nmapsi4, gparted, synaptic. The signal that turns
  # it into an attack is concealment, which `kde-hidden-root-launcher` below
  # already requires.
  - id: kde-root-launch-request
    desc: KDE desktop entry requests root launch
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/os/privilege/elevation::kde-substitute-uid
      - id: micro-behaviors/os/privilege/elevation::kde-root-launch-user

  - id: kde-hidden-root-launcher
    desc: Hidden KDE desktop entry requests root launch
    crit: hostile
    conf: 0.96
    all:
      - id: kde-root-launch-request
    any:
      - id: objectives/persistence/login/xdg::desktop-hidden-entry
      - id: metadata/file/format/structured::desktop-no-display
