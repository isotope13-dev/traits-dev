defaults:
  platforms: [android]
  for: [c, cpp, elf]
  attack: T1548

composite_rules:
  - id: android-platform-marker
    desc: Android platform marker
    crit: component
    conf: 0.92
    any:
      - id: metadata/file/string/identity::android-aid-platform-marker
      - id: micro-behaviors/fs/path/location::android-app-runtime-path-references
      - id: metadata/file/string/identity::android-property-platform-marker
      - id: metadata/file/string/identity::android-getprop-platform-marker
      - id: metadata/file/string/identity::android-lib-platform-marker
      - id: metadata/file/string/identity::android-java-platform-marker
    needs: 2

  # unix-root-setid-source is source-only (for: [c, cpp]) and
  # user-namespace-id-map-path is binary/script-only (for: [binaries,
  # scripts]) -- a single file can never be both, so the two could never
  # co-occur under one `all:`. Split by which corroborating signal the file
  # type can actually carry, joined by `any:` below.
  - id: android-root-identity-escalation-source
    desc: Android root identity escalation (source)
    crit: component
    conf: 0.9
    for: [cpp]
    all:
      - id: micro-behaviors/process/identity/setuid::root-setid-source
      - id: android-platform-marker
    any:
      - id: micro-behaviors/process/identity/uid::android-system-aid-reference
      - id: micro-behaviors/process/identity/setuid::setresid-1000-source
      - id: micro-behaviors/process/identity/setuid::setuid-dup
      - id: micro-behaviors/process/identity/setuid::setgid

  - id: android-root-identity-escalation-binary
    desc: Android root identity escalation (binary)
    crit: component
    conf: 0.9
    for: [elf]
    all:
      - id: micro-behaviors/fs/proc/info/path::user-namespace-id-map-path
      - id: android-platform-marker
    any:
      - id: micro-behaviors/process/identity/uid::android-system-aid-reference
      - id: micro-behaviors/process/identity/setuid::setresid-1000-source
      - id: micro-behaviors/process/identity/setuid::setuid-dup
      - id: micro-behaviors/process/identity/setuid::setgid

  - id: android-root-identity-escalation
    desc: Android root identity escalation
    crit: suspicious
    conf: 0.98
    any:
      - id: android-root-identity-escalation-source
      - id: android-root-identity-escalation-binary
