# Identity Change Syscalls - Privilege Escalation Composites
# Atomic syscall traits in micro-behaviors/process/identity/syscall/linux.yaml
# ATT&CK: T1548.001 (Setuid and Setgid)
defaults:
  platforms: [linux, unix]
  attack: "T1548.001"
composite_rules:
  - id: setuid-to-root-shell
    desc: Identity change syscall with shell execution
    crit: suspicious
    conf: 0.85
    for: [elf, shell, python]
    # The identity change and the shell must be the same piece of code. Without
    # a proximity bound this matched any binary that contains both anywhere:
    # a 73 MB Go container runtime carried the bare word "bash" at 32.6 MB and
    # a setuid reference at 61.8 MB -- 29 MB apart, in unrelated packages --
    # and scored privilege escalation. A real setuid-then-exec sequence sits
    # in one function.
    near_bytes: 8192
    all:
      - id: micro-behaviors/process/identity/syscall::setuid-comp
    any:
      - id: micro-behaviors/process/interpreter/shell::bin-sh
      - id: micro-behaviors/process/create/shell/native::bash-binary-name
    unless:
      - id: well-known/tool/sysadmin/busybox::busybox-binary
    downgrade:
      any:
        - id: micro-behaviors/process/fork/clone::daemon-dup
        - id: micro-behaviors/process/identity/setuid/
  - id: capset-shell-exec
    desc: Capability change with shell execution
    crit: suspicious
    conf: 0.88
    for: [elf, c]
    all:
      - id: micro-behaviors/process/identity/syscall::capset-syscall
      - id: micro-behaviors/process/interpreter/shell::bin-sh
