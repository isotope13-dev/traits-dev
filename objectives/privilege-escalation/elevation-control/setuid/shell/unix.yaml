defaults:
  crit: suspicious
  attack: T1548.001
  platforms:
    - linux
    - unix
    - android
    - macos
    - ios
    - windows
  for: [binaries, c]
traits:
  # Relocated from setuid/runtime/node-netbsd.yaml, where the same technique was
  # defined as `node-suid-shell-copy` under `for: [javascript, typescript]` and
  # `platforms: [netbsd]`. The matcher is a shell command sequence -- it says
  # nothing about JavaScript, and the carrier that matters most is a root-run
  # maintainer script (postinst/preinst), a post-exploitation shell script, or a
  # Python/Perl dropper. `cp /bin/sh /tmp/.x; chmod 4755 /tmp/.x` in a postinst
  # scored risk 2 before this; the identical line in a .js file scored suspicious.
  #
  # Widened from the original `cp /bin/sh ... chmod 4755` so the family is covered
  # rather than one sample's spelling: bash as well as sh, and `u+s` as well as a
  # numeric 4xxx mode. Legitimate packages do set the setuid bit -- on their OWN
  # binary (`chmod 4755 /usr/bin/mytool`), never on a copy of a shell, which is
  # what the /bin/sh|bash source anchors. Measured over 108,671 text files under
  # /usr/bin, /usr/share, /etc, /usr/lib, /usr/sbin and /opt: one file contains a
  # setuid grant at all (sudo's TROUBLESHOOTING.md) and zero pair it with a copy
  # of a shell.
  - id: suid-shell-copy
    desc: Setuid bit set on a shell copy
    conf: 0.95
    platforms:
    - unix
    for:
    - shell
    - python
    - perl
    - ruby
    - javascript
    - go
    - elf
    if:
      type: text
      regex: cp\s+[^\n]{0,40}/bin/(ba)?sh\b[\s\S]{0,160}chmod\s+[^\n]{0,20}(u\+s|4[0-7]{3})
    unless:
    - id: metadata/package/testing/presence/harness/
    - id: well-known/app/utility/cmdchamp/
    - id: well-known/tool/offensive/bingo/
    - id: metadata/file/naming::test-directory-component
    - id: micro-behaviors/metaprogramming/generation::configured-assessment-plugin
    - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
    - id: well-known/lib/cloud/datadog-cdk-constructs::sample-stack-context
    - id: well-known/tool/offensive/raxuiscli::source-tree-path
    - id: metadata/file/catalog/identity::cleave-trait-definition-file
composite_rules:
  - id: shell-setuid-shell-backdoor
    for: [shell]
    desc: Setuid shell alongside direct-IP HTTP or PHP webshell
    crit: hostile
    conf: 0.99
    platforms: [unix]
    all:
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-setuid-shell
    any:
      - id: micro-behaviors/communications/ip/literal::direct-ip-http-client
      - id: objectives/command-and-control/backdoor/webshell/embedded::shell-php-webshell-drop

  - id: perl-setuid-shell-backdoor
    for: [perl]
    desc: Setuid shell alongside embedded PHP webshell
    crit: hostile
    conf: 0.99
    platforms: [unix]
    all:
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-setuid-shell
      - id: objectives/command-and-control/backdoor/webshell/embedded::embedded-php-request-command


  # Size alone cannot distinguish a demonstration from a gated utility.
  # Require the complete unguarded main-body sequence as well.
  - id: minimal-setuid-root-shell-stub
    for: [c]
    desc: Minimal root-ID shell payload requires authority
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/shell/native::unguarded-root-shell-main
      - id: micro-behaviors/process/identity/setuid::root-setuid-call
      - id: metadata/file/size::tiny-c-source-file


