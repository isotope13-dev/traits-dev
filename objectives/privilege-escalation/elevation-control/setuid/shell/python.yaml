# Setting the set-user-ID bit directly on the system shell gives any local
# caller an effective-root command interpreter. Match structured call
# arguments so documentation and examples in comments do not qualify.
defaults:
  platforms: [unix]
  for: [python]
  attack: T1548.001

traits:
  - id: python-system-shell-suid-chmod
    desc: Python chmod makes system shell SUID
    crit: suspicious
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: os.chmod
      args:
        - kind: string
          exact: /bin/sh
        - kind: number
          value: 2541

  - id: shellcraft-system-shell-suid-chmod
    desc: Shellcode makes system shell SUID
    crit: suspicious
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: shellcraft.syscall
      args:
        - kind: identifier
          name: SYS_chmod
        - kind: string
          exact: /bin/sh
        - kind: number
          value: 2541

composite_rules:
  - id: shellcraft-webshell-suid-escalation
    desc: Shellcode webshell grants root shell access
    crit: hostile
    conf: 0.99
    all:
      - id: shellcraft-system-shell-suid-chmod
      - id: objectives/command-and-control/backdoor/webshell/embedded::shellcraft-php-webshell-drop
    near_bytes: 4096
