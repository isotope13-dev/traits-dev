defaults:
  for: [ruby, text]
  platforms: [unix]
  attack: T1548.001
traits:
  - id: asyncos-root-shell-command
    desc: AsyncOS helper launches a root shell
    crit: notable
    if:
      type: text
      exclude_comments: true
      regex: '/data/bin/runas\s+root\s+/bin/sh\s+-c\b'
composite_rules:
  - id: postgres-asyncos-root-shell
    desc: SQL command execution paired with AsyncOS root shell launcher
    crit: suspicious
    all:
      - id: asyncos-root-shell-command
      - id: micro-behaviors/data/db/postgresql::copy-to-program
