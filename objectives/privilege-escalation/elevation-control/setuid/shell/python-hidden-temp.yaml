# Preserve the copy/ownership/permission target relationship across a native
# Python implementation. Independent call facts cannot prove that relationship.
defaults:
  platforms: [unix]
  for: [python]
  attack: T1548.001
traits:
  - id: python-root-owned-hidden-temp-shell-install
    desc: Installs hidden root-owned setuid shell
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      language: python
      query: |
        ((_
          (expression_statement (call function: (attribute) @copy
            arguments: (argument_list . (string (string_content) @source)
              . (string (string_content) @destination) .))) .
          (expression_statement (call function: (attribute) @chown
            arguments: (argument_list . (string (string_content) @owned)
              . (integer) @uid . (integer) @gid .))) .
          (expression_statement (call function: (attribute) @chmod
            arguments: (argument_list . (string (string_content) @modified)
              . (integer) @mode .))))
          (#match? @copy "^shutil\\.(copy|copy2|copyfile)$")
          (#match? @source "^/(usr/)?bin/(sh|bash|dash|ksh|zsh)$")
          (#match? @destination "^/(var/)?tmp/\\.")
          (#eq? @chown "os.chown") (#eq? @uid "0") (#eq? @gid "0")
          (#eq? @chmod "os.chmod")
          (#match? @mode "^0[oO][4567][0-7]{3}$")
          (#eq? @destination @owned) (#eq? @destination @modified))
