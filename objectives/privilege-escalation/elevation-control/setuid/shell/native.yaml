defaults:
  platforms: [unix]
  for: [c]
  attack: T1548.001

traits:
  - id: native-system-shell-suid-chmod
    desc: Native chmod makes system shell SUID
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      kind: call
      regex: '\bchmod\s*\(\s*["'']/bin/sh["'']\s*,\s*0?4755\s*\)'

composite_rules:
  - id: native-php-webshell-suid
    desc: Native PHP webshell enables SUID shell access
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/command-and-control/backdoor/webshell/embedded::native-php-webshell-drop
      - id: native-system-shell-suid-chmod
    near_bytes: 4096
