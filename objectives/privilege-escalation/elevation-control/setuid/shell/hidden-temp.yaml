# Facts can identify each command, but proximity cannot bind their targets.
# Require consecutive operations on the same hidden temporary shell copy.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1548.001
traits:
  - id: root-owned-hidden-temp-shell-install
    desc: Installs hidden root-owned setuid shell
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      language: shell
      query: |
        ((_
          (command name: (command_name) @copy
            . argument: (_) @source . argument: (_) @destination .) .
          (command name: (command_name) @chown
            . argument: (_) @owner . argument: (_) @owned .) .
          (command name: (command_name) @chmod
            . argument: (_) @mode . argument: (_) @modified .))
          (#match? @copy "^(/(usr/)?bin/)?cp$")
          (#match? @source "^[\"']?/(usr/)?bin/(sh|bash|dash|ksh|zsh)[\"']?$")
          (#match? @destination "^[\"']?/((var/)?tmp|dev/shm)/\\.")
          (#match? @chown "^(/(usr/)?bin/)?chown$")
          (#match? @owner "^(root|0)(:(root|0))?$")
          (#match? @chmod "^(/(usr/)?bin/)?chmod$")
          (#match? @mode "^([ua]?\\+s|0?[4567][0-7]{3})$")
          (#eq? @destination @owned)
          (#eq? @destination @modified))

  # install(1) copies and sets the mode in one command, so the source, mode
  # and hidden destination are bound by a single parsed command.
  - id: hidden-temp-setuid-shell-install-command
    desc: install(1) makes hidden setuid shell copy
    crit: hostile
    conf: 0.98
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name) @install
           argument: (_) @mode
           argument: (_) @source . argument: (_) @destination .)
          (#match? @install "^(/(usr/)?bin/)?install$")
          (#match? @mode "^(-m|--mode=)?([ua]?\\+s|0?[4567][0-7]{3})$")
          (#match? @source "^[\"']?/(usr/)?bin/(sh|bash|dash|ksh|zsh)[\"']?$")
          (#match? @destination "^[\"']?/((var/)?tmp|dev/shm)/\\."))
