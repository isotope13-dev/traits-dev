defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: setuid-zero-call
    desc: C source requests root user identity
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'setuid\s*\(\s*0\s*\)'

  - id: exec-system-shell-path
    desc: C source execs a system shell path
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bexec(l|le|lp|v|ve|vp)\s*\(\s*["'']/(usr/)?bin/(ba|da|k|z)?sh["'']'

  - id: shell-setuid-permission-grant
    desc: Shell command grants a file setuid permission
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*chmod\s+([ua]?\+s|0?4[0-7]{3})\s+\S+'

composite_rules:
  - id: embedded-root-shell-source
    desc: Embedded source spawns root shell
    crit: suspicious
    conf: 0.94
    all:
      - id: setuid-zero-call
      - id: exec-system-shell-path
    near_bytes: 300

  - id: compiled-root-shell-history-suppression
    desc: Root shell source and setuid permission grant with shell history disabled
    crit: hostile
    conf: 0.95
    attack: T1548.001
    all:
      - id: embedded-root-shell-source
      - id: shell-setuid-permission-grant
      - id: micro-behaviors/metaprogramming/generation/compile::gcc-compilation-invocation
      - id: micro-behaviors/os/console/control::shell-history-disabled-command
