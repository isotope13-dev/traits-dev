defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: compiled-setuid-root-executable
    desc: Compiles root-owned setuid executable
    crit: suspicious
    conf: 0.94
    if:
      type: tree-sitter
      language: shell
      query: |
        ((compound_statement
          (command name: (command_name) @compiler
            argument: (word) @output_flag . argument: (word) @compiled)
          (command name: (command_name) @chown
            . argument: (word) @owner . argument: (word) @owned)
          (command name: (command_name) @chmod
            . argument: (word) @mode . argument: (word) @permitted))
          (#match? @compiler "(^|/)(gcc|cc|clang)$")
          (#eq? @output_flag "-o")
          (#eq? @chown "chown")
          (#match? @owner "^(root|0)(:(root|0))?$")
          (#eq? @chmod "chmod")
          (#match? @mode "^([ua]?\\+s|0?4[0-7]{3})$")
          (#eq? @compiled @owned)
          (#eq? @compiled @permitted))


composite_rules:
  - id: embedded-root-shell-source
    desc: Embedded source requests an unrestricted root shell
    crit: suspicious
    conf: 0.94
    near_bytes: 300
    all:
      - id: micro-behaviors/process/identity/setuid::shell-embedded-setuid-root
      - id: micro-behaviors/process/replace::shell-embedded-execl-shell

  - id: compiled-root-shell-history-suppression
    desc: Root shell source and setuid permission grant with shell history disabled
    crit: hostile
    conf: 0.95
    attack: T1548.001
    all:
      - id: embedded-root-shell-source
      - id: micro-behaviors/fs/chmod/executable/dangerous::chmod-setuid-file
      - id: micro-behaviors/metaprogramming/generation/compile::gcc-compilation-invocation
      - id: micro-behaviors/os/console/control::shell-history-disabled-command

  - id: compiled-setuid-root-shell
    desc: Root shell source with compiled setuid root executable
    crit: hostile
    conf: 0.95
    attack: T1548.001
    near_bytes: 1024
    all:
      - id: embedded-root-shell-source
      - id: compiled-setuid-root-executable
