defaults:
  platforms: [unix]
  for: [scripts, source, binaries]
  attack: T1548.001
traits:
  - id: chmod-system-shell-setuid
    desc: Grants setuid permissions to system shells
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '\bchmod\s+(u\+s|[4567][0-7]{3})\s+(/usr)?/bin/(sh|bash|dash|ksh|zsh)\b'
composite_rules:
  - id: header-webshell-setuid-shell-persistence
    desc: Header webshell installs setuid shell
    crit: hostile
    conf: 0.99
    for: [php]
    all:
      - id: chmod-system-shell-setuid
    any:
      - id: objectives/command-and-control/backdoor/webshell/request/eval::php-decoded-header-eval
      - id: objectives/command-and-control/backdoor/webshell/request/command::php-decoded-header-command
