defaults:
  platforms: [unix]
  for: [scripts, source, binaries]
  attack: T1548.001
composite_rules:
  # Permission grant beside the command endpoint; no claim that a particular
  # shell preserves effective UID or that privilege elevation succeeded.
  - id: cookie-webshell-setuid-shell-grant
    desc: Cookie webshell with setuid shell grant
    crit: hostile
    conf: 0.99
    for: [scripts, source]
    near_bytes: 4096
    all:
      - id: objectives/command-and-control/backdoor/webshell/request/command::php-decoded-cookie-shell-sink
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-setuid-shell
      - id: micro-behaviors/communications/http/server/route::apache-php-file-handler
    any:
      - id: micro-behaviors/communications/http/server/route::apache-static-asset-alias
      - id: micro-behaviors/communications/http/server/route::apache-static-asset-regex-alias

  - id: header-webshell-setuid-shell-grant
    desc: Header webshell grants setuid permission to system shell
    crit: hostile
    conf: 0.99
    for: [php]
    all:
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-setuid-shell
    any:
      - id: objectives/command-and-control/backdoor/webshell/request/eval::php-decoded-header-eval
      - id: objectives/command-and-control/backdoor/webshell/request/command::php-decoded-header-command
