# A setuid copy of a shell dropped into a system executable directory is a
# completed root backdoor, not just an escalation attempt: every local user can
# run it as root, and the system-path destination makes it masquerade as
# platform software (planted names imitate bus or auth daemons). Each leg binds
# a different required fact about the same install -- the setuid mode bit on a
# shell copy, and a destination inside /bin, /sbin or /usr/bin -- so the
# conjunction is one construction, not one observation counted twice.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1548.001,T1036.005

composite_rules:
  - id: setuid-shell-copy-system-path
    desc: Setuid shell copy planted in system executable directory
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/privilege-escalation/elevation-control/setuid/shell::suid-shell-copy
      - id: micro-behaviors/fs/file/copy::shell-copy-system-binary
    near_bytes: 400
