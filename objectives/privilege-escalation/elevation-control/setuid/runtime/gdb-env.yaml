defaults:
  platforms: [unix]
  for: [shell]
  attack: T1548.001
traits:
  - id: encoded-setuid-env
    desc: Encoded command grants setuid to env
    crit: suspicious
    if:
      type: encoded
      encoding: base64
      regex: 'chmod[ \t]+([ua]?\+s|0?4[0-7]{3})[ \t]+/(usr/)?bin/env\b'
composite_rules:
  - id: gdb-encoded-setuid-env
    desc: GDB process attach accompanies encoded setuid env command
    crit: hostile
    conf: 0.98
    near_bytes: 400
    all:
      - id: encoded-setuid-env
      - id: micro-behaviors/process/attach/debugger::gdb-pid-attach
      - id: micro-behaviors/process/attach/debugger::gdb-command-file
