defaults:
  platforms: [unix]
  for: [shell]
  attack: T1548.001
traits:
  - id: base64-setuid-env-payload
    desc: Base64 contains setuid env command
    crit: notable
    if:
      type: encoded
      encoding: base64
      regex: 'chmod[ \t]+([ua]?\+s|0?4[0-7]{3})[ \t]+/(usr/)?bin/env\b'
composite_rules:
  # Decoded text alone can be a commented example. Require an actual decoder
  # call before treating this payload as suspicious; proximity is co-occurrence.
  - id: encoded-setuid-env
    desc: Setuid env payload accompanies Base64 decoder
    crit: suspicious
    near_bytes: 400
    all:
      - id: base64-setuid-env-payload
      - id: micro-behaviors/data/decode/command::shell-base64-decode-call
  - id: gdb-encoded-setuid-env
    desc: GDB process attach accompanies encoded setuid env command
    crit: hostile
    conf: 0.98
    near_bytes: 400
    all:
      - id: encoded-setuid-env
      - id: micro-behaviors/process/attach/debugger::gdb-pid-attach
      - id: micro-behaviors/process/attach/debugger::gdb-command-file
