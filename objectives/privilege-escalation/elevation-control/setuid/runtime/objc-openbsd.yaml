defaults:
  platforms: [openbsd, bsd, unix]
  for: [objc, elf]
  attack: T1548.001

traits:
  - id: objc-openbsd-root-setid-source
    desc: ObjC OpenBSD root setid source
    crit: suspicious
    conf: 0.94
    for: [objc]
    if:
      type: text
      regex: 'setuid\(0\)[\s\S]{0,160}/bin/sh[\s\S]{0,520}setresuid\(0, 0, 0\)'

composite_rules:
  - id: objc-runtime-setid-root-shell
    desc: ObjC runtime setid root shell
    crit: suspicious
    conf: 0.94
    for: [elf]
    all:
      - id: metadata/lang/runtime::objc-runtime-marker
      - id: micro-behaviors/process/identity/setuid::uid-gid-cgo-api-reference
      - id: micro-behaviors/process/interpreter/shell::bin-sh

  - id: objc-openbsd-setid-root-shell
    desc: ObjC OpenBSD setid root shell
    crit: suspicious
    conf: 0.98
    any:
      - id: objc-openbsd-root-setid-source
      - id: objc-runtime-setid-root-shell
