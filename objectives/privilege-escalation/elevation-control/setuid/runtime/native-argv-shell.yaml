# A setuid-root helper whose entire job is to hand its caller a root shell: it
# sets uid 0 and then execs a shell with a command string lifted straight out
# of its own argv. sudo and doas authenticate first and exec the requested
# program directly; a wrapper that pastes argv[1] into `sh -c` after setuid(0)
# has nothing between an unprivileged caller and root.
defaults:
  platforms: [unix]
  for: [c, cpp]
  attack: T1548.001
  mbc: E1548

composite_rules:
  - id: setuid-root-argv-command-wrapper
    desc: Setuid root wrapper runs caller commands
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/shell/native::shell-c-caller-argv-reference
      # The OpenWrt-specific native-setid-root-source lives in the same
      # directory but is platform-gated to OpenWrt. This wrapper is a generic
      # Unix setuid-root command runner, so use the source-level Unix identity
      # capability instead of silently inheriting that appliance-only gate.
      - id: micro-behaviors/process/identity/setuid::simple-setid-call-source
