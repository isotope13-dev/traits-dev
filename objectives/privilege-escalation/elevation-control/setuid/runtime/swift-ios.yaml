defaults:
  platforms: [ios]
  for: [swift]
  attack: T1548

traits:
  - id: swift-ios-setuid-root
    desc: Swift iOS setuid root attempt
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'setuid\(0\)|setreuid\(0,\s*0\)'

  - id: swift-ios-root-shell-exec
    desc: Swift iOS root shell exec
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'execl\("/bin/sh"|/usr/bin/su'

  - id: swift-embedded-insmod
    desc: Swift runs insmod
    crit: suspicious
    conf: 0.94
    platforms: [ios, unix]
    if:
      type: text
      regex: \binsmod\s+

  - id: swift-embedded-modprobe
    desc: Swift runs modprobe
    crit: suspicious
    conf: 0.92
    platforms: [ios, unix]
    if:
      type: text
      regex: '(^|[\s;&|(])modprobe\s+'

composite_rules:
  - id: swift-ios-setuid-shell-privesc
    desc: Swift iOS setuid shell privesc
    crit: hostile
    conf: 0.98
    all:
      - id: swift-ios-setuid-root
      - id: swift-ios-root-shell-exec

  - id: swift-jailbreak-setuid-privesc
    desc: Setuid shell on a jailbroken device
    crit: hostile
    conf: 0.97
    all:
      - id: swift-ios-setuid-root
      - id: swift-ios-root-shell-exec
    any:
      - id: micro-behaviors/os/security/jailbreak::ios-cydia-artifact-path
      - id: micro-behaviors/os/security/jailbreak::ios-mobilesubstrate-artifact-path
      - id: micro-behaviors/os/security/jailbreak::ios-apt-artifact-path

  - id: swift-kmod-setuid-privesc
    desc: Loads a kernel module then setuid
    crit: hostile
    conf: 0.97
    all:
      - id: swift-embedded-insmod
      - id: swift-embedded-modprobe
      - id: swift-ios-setuid-root

  - id: swift-setuid-file-search-privesc
    desc: Hunts setuid files and retries root
    crit: hostile
    conf: 0.96
    all:
      - id: swift-ios-setuid-root
      - id: micro-behaviors/fs/search::find-setuid-files
      - id: micro-behaviors/process/create/sudo::sudo-stdin-password

  - id: swift-ps-ssh-key-post
    desc: Posts process list and SSH key
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/enumerate/shell::ps-aux
      - id: objectives/credential-access/ssh/path::swift-ssh-rsa-key-path
      - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method
