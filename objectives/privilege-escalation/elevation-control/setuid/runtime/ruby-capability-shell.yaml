# Grants CAP_SETUID to a Ruby interpreter with setcap, then uses that copy
# to switch to UID 0 and exec a shell: a capability-based root shell.
defaults:
  for: [ruby, shell]
  platforms: [linux]
  attack: T1548

composite_rules:
  - id: ruby-setcap-setuid-root-shell
    desc: Grants CAP_SETUID then spawns root shell
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/security/capabilities::setcap-capability-assignment
      - id: micro-behaviors/os/security/capabilities::cap-setuid
      - id: micro-behaviors/process/identity/setuid::ruby-setuid-root-call-text
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
