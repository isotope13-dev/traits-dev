defaults:
  platforms: [unix]
  for: [c, cpp, go, kotlin, objc, elf, class]
  attack: T1548.001

traits:
  - id: unix-hidden-root-useradd
    desc: Unix hidden root useradd
    crit: suspicious
    conf: 0.94
    # unix-hidden-root-escalation below (for: [cpp], i.e. C) requires this
    # leg; cpp/C source is the same plain-text substring match as go/elf, so
    # it belongs in this atom's own for: list rather than a duplicate copy.
    for: [go, elf, c, cpp]
    if:
      type: text
      substr: .hidden_root

  - id: unix-uid-map-write
    desc: Unix uid map write
    crit: suspicious
    conf: 0.94
    for: [kotlin, class]
    if:
      type: text
      substr: /proc/self/uid_map
    unless:
      - id: well-known/app/utility/util-linux::util-linux-translation-path

  - id: unix-sudo-n-id
    desc: Unix sudo noninteractive id
    crit: suspicious
    conf: 0.94
    for: [c, objc, elf]
    if:
      type: text
      substr: sudo -n id

composite_rules:
  - id: unix-hidden-root-escalation
    desc: Unix hidden root escalation
    crit: hostile
    conf: 0.98
    for: [cpp]
    all:
      - id: micro-behaviors/process/identity/setuid::root-setid-source
      - id: unix-hidden-root-useradd

  - id: unix-uid-map-escalation
    for: [class, kotlin]
    desc: Unix uid map escalation
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/identity/setuid::native-all-root-setresuid-reference
      - id: unix-uid-map-write

  - id: native-setuid-sudo-escalation
    for: [elf]
    desc: Native setuid sudo escalation
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/identity/setuid::setuid-root-retention-diagnostic
      - id: unix-sudo-n-id

  - id: native-setuid-shell-escalation
    desc: Minimal binary setuids and execs shell
    crit: hostile
    conf: 0.95
    for: [elf, macho]
    size_max: 262144
    all:
      - id: micro-behaviors/process/identity/setuid::setuid-dup
      - id: micro-behaviors/fs/path/binary::bin-sh-path-reference
    any:
      - id: micro-behaviors/process/create/exec::execve-import
      - id: micro-behaviors/process/create/execv::exec-variant-symbol-text
    needs: 1
    unless:
      - id: metadata/binary/symbols/count::many-imports-40
      - id: metadata/binary/section/prose::high-string-count-1000
      - id: micro-behaviors/ui/help/
      - id: metadata/signed/platform::apple

  - id: native-stripped-setuid-shell-wrapper
    desc: Stripped setuid binary executes a shell
    crit: hostile
    conf: 0.96
    for: [elf]
    size_max: 262144
    all:
      - id: objectives/privilege-escalation/elevation-control/setuid/syscall::setuid-to-root-shell
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"
      - id: micro-behaviors/process/create/execv::x86-64-syscall-execve

  # Source counterpart of the binary setuid-shell wrappers above: a C
  # program that requests root identity (setuid/setgid/setresuid/setresgid
  # with a literal zero ID) and then hands control to /bin/sh or /bin/bash
  # through system()/exec. Authentication tools request a target identity
  # held in a variable and run the caller's command; a literal root request
  # paired with a fixed shell launch has no gate between an unprivileged
  # caller and a root shell once the binary carries the setuid bit. Unlike
  # minimal-setuid-root-shell-stub this carries no size leg: the escalation
  # is the claim, at any source size.
  - id: native-root-setid-shell-escalation
    desc: Native root setid escalates to shell
    crit: hostile
    conf: 0.97
    for: [c, cpp]
    all:
      - id: micro-behaviors/process/identity/setuid::root-setid-source
      - id: micro-behaviors/process/create/shell/native::c-shell-execution-path
    unless:
      - id: well-known/lib/crypto/mit-krb5::source-tree-context
      - id: well-known/lib/web/server/passenger/
      - id: metadata/file/extension/identity::markdown-file-basename
