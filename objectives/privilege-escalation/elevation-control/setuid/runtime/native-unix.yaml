defaults:
  platforms: [unix]
  for: [c, cpp, go, kotlin, objc, elf, class]
  attack: T1548.001

traits:
  - id: unix-hidden-root-useradd
    desc: Unix hidden root useradd
    crit: suspicious
    conf: 0.94
    # unix-hidden-root-escalation below (for: [cpp], i.e. C) requires this
    # leg; cpp/C source is the same plain-text substring match as go/elf, so
    # it belongs in this atom's own for: list rather than a duplicate copy.
    for: [go, elf, c, cpp]
    if:
      type: text
      substr: .hidden_root

  - id: native-setresuid-root
    desc: Native setresuid root
    crit: suspicious
    conf: 0.94
    for: [c, elf, kotlin, class]
    if:
      type: text
      substr: setresuid(0,0,0)
    unless:
      - id: well-known/app/system/samba::samba-source-tree
      # An autoconf feature probe compiles `setresuid(0,0,0)` to find out
      # whether the platform has it -- OpenSSH's configure.ac carries the
      # snippet verbatim and never runs it as the shipped program.
      - id: well-known/app/network/openssh::source-tree-path
      # Cursor's agent sandbox calls setresuid(0,0,0) inside a user namespace
      # to drop to "root" in the sandbox — not host privilege escalation.
      - id: well-known/app/ai/coding-agent/cursor-sandbox::cursor-sandbox-context
      - id: well-known/app/ai/coding-agent/cursor-sandbox::linux-sandbox-context
  - id: unix-uid-map-write
    desc: Unix uid map write
    crit: suspicious
    conf: 0.94
    for: [kotlin, class]
    if:
      type: text
      substr: /proc/self/uid_map
    unless:
      - id: well-known/app/utility/util-linux::util-linux-translation-path

  - id: unix-sudo-n-id
    desc: Unix sudo noninteractive id
    crit: suspicious
    conf: 0.94
    for: [c, objc, elf]
    if:
      type: text
      substr: sudo -n id

composite_rules:
  - id: unix-hidden-root-escalation
    desc: Unix hidden root escalation
    crit: hostile
    conf: 0.98
    for: [cpp]
    all:
      - id: objectives/privilege-escalation/elevation-control/setuid/syscall::unix-root-setid-source
      - id: unix-hidden-root-useradd

  - id: native-setresuid-escalation
    for: [elf, class, c, kotlin]
    desc: Native setresuid escalation
    crit: hostile
    conf: 0.98
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-rules-directory
      - id: well-known/app/ai/coding-agent/cursor-sandbox::cursor-sandbox-context
      # OpenSSH's configure.ac probes setresuid/setresgid and calls them in
      # an AC_RUN_IFELSE to check the platform honours them; that is the
      # autoconf feature test, not an escalation.
      - id: well-known/app/network/openssh::source-tree-path
      - id: well-known/app/network/openssh::portable-dev-list-address
      - id: well-known/app/network/openssh::solaris-package-init-variable
    all:
      - id: native-setresuid-root
    any:
      - id: micro-behaviors/process/identity/setuid::setuid-dup
      - id: micro-behaviors/process/identity/setuid::setgid
      - id: micro-behaviors/fs/proc/info/memory::c-procfs-mem-template
    needs: 1

  - id: unix-uid-map-escalation
    for: [class, kotlin]
    desc: Unix uid map escalation
    crit: hostile
    conf: 0.98
    all:
      - id: native-setresuid-root
      - id: unix-uid-map-write

  - id: native-setuid-sudo-escalation
    for: [elf]
    desc: Native setuid sudo escalation
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/identity/setuid::setuid-root-retention-diagnostic
      - id: unix-sudo-n-id

  # C source that raises to UID 0 and then hands over a shell: the classic
  # setuid-root backdoor stub. Anchored on the literal `setuid(0)` /
  # `setresuid(0,0,0)` call, so ordinary privilege-dropping code (setuid to an
  # unprivileged uid) does not qualify.
  - id: native-root-setid-shell-escalation
    desc: setuid(0) source then shell exec
    crit: hostile
    conf: 0.98
    for: [c, cpp]
    all:
      - id: objectives/privilege-escalation/elevation-control/setuid/syscall::unix-root-setid-source
      - id: micro-behaviors/process/create/shell/native::c-shell-execution-path
    unless:
      - id: well-known/lib/crypto/mit-krb5::source-tree-context
      - id: well-known/lib/web/passenger/
      - id: metadata/file/extension/identity::markdown-file-basename

  # Compiled form of the same stub. A stripped ELF/Mach-O cannot show that the
  # setuid target is root, so the three legs below (a `setuid` import, the
  # string "/bin/sh", an exec* import) are on their own ordinary privileged
  # Unix userland — /bin/bash, /bin/tar, /sbin/init, su and login all carry
  # them, as do libraries that shell out under a dropped identity (libwrap).
  # What separates a dropped stub is shape: a small binary with a handful of
  # imports, no string corpus and no user-facing CLI surface.
  - id: native-setuid-shell-escalation
    desc: Minimal binary setuids and execs shell
    crit: hostile
    conf: 0.95
    for: [elf, macho]
    size_max: 262144
    all:
      - id: micro-behaviors/process/identity/setuid::setuid-dup
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text
    any:
      - id: micro-behaviors/process/create/direct::execve-import
      - id: micro-behaviors/process/create/execv::exec-variant-symbol-text
    needs: 1
    unless:
      - id: metadata/binary/symbols/count::many-imports-40
      - id: metadata/binary/section/prose::high-string-count-1000
      - id: micro-behaviors/ui/help/
      - id: metadata/signed/platform::apple

  - id: native-direct-setuid-bash-wrapper
    desc: Minimal native binary directly sets uid and executes Bash
    crit: hostile
    conf: 0.97
    for: [elf]
    size_max: 262144
    all:
      - id: micro-behaviors/process/identity/syscall::x86-64-setuid-number
      - id: micro-behaviors/process/create/shell/native::bash-binary-name
    any:
      - id: micro-behaviors/process/create/execv::x86-64-syscall-execve
      - id: micro-behaviors/process/create/execv::exec-variant-symbol-text
    needs: 1
    unless:
      - id: metadata/binary/symbols/count::many-imports-40
      - id: metadata/binary/section/prose::high-string-count-1000
      - id: metadata/signed/platform::apple

  - id: native-stripped-setuid-shell-wrapper
    desc: Stripped setuid binary executes a shell
    crit: hostile
    conf: 0.96
    for: [elf]
    size_max: 262144
    all:
      - id: objectives/privilege-escalation/elevation-control/setuid/syscall::setuid-to-root-shell
      - id: metadata/hardening/missing::stripped-binary
      - id: micro-behaviors/process/create/execv::x86-64-syscall-execve
