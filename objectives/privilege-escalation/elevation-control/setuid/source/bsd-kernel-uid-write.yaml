defaults:
  platforms: [unix]
  for: [c]

composite_rules:
  - id: bsd-module-credential-uid-write
    desc: BSD module writes kernel credential UID
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/kernel/credential::bsd-credential-uid-write
    any:
      - id: micro-behaviors/os/kernel/module::freebsd-sys-module-header
      - id: micro-behaviors/os/kernel/module::freebsd-sys-linker-header
