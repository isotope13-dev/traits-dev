# `if (current->uid = 0)` -- a single `=` where the reader expects `==`. The
# condition does not test the caller's identity, it *sets* it, so every caller
# that reaches the branch becomes root. The Linux CVS/BitKeeper intrusion of
# November 2003 planted exactly two lines of this in kernel/exit.c, guarded by
# an otherwise meaningless flag combination.
#
# `for:` includes `text` deliberately. Evidence of a source backdoor most often
# arrives as a patch, a fragment or an untyped excerpt, and a `.patch` types as
# text; a matcher this specific cannot fire on prose, so gating it to `c`
# would only lose the one form the artifact usually takes.
defaults:
  platforms: [unix]
  for: [c, cpp, text]
  attack: T1068
  mbc: F0002

traits:
  - id: privilege-field-assigned-in-condition
    desc: Condition assigns a uid/gid field zero
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(if|while)\s*\([^;\n]{0,80}(->|\.)\s*(e|s|fs)?[ug]id\s*=\s*0\s*[)&|]'

  # The other half of the same two-line change: the branch is reachable only
  # for a caller passing an exact bitwise-OR of flag macros -- a private knock,
  # not an interface. On its own this is ordinary flag testing, which is why it
  # carries no weight until the composite pairs it with the assignment.
  - id: exact-flag-mask-equality-guard
    desc: Guard tests an exact flag-mask value
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '==\s*\(\s*[A-Z_][A-Z0-9_]{2,30}\s*\|\s*[A-Z_][A-Z0-9_]{2,30}\s*\)'

composite_rules:
  - id: flag-gated-privilege-assignment
    desc: Flag-gated backdoor sets caller uid to zero
    crit: hostile
    conf: 0.97
    near_lines: 3
    all:
      - id: privilege-field-assigned-in-condition
      - id: exact-flag-mask-equality-guard
