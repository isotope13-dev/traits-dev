# Unprivileged user namespace + mount + fchown of the program's own image +
# setuid(0): the working part of namespace-based local root exploits, such as
# the glibc realpath() underflow exploit (CVE-2018-1000001). Each primitive is
# ordinary (container runtimes use the first, second and last); the program
# also resolving /proc/self/exe and chowning it is what turns the namespace
# into a root-owned setuid copy of itself.
defaults:
  platforms: [unix]
  for: [c, cpp]
  attack: T1068

traits:
  - id: self-exe-open-followed-by-fchown
    desc: Opens /proc/self/exe, then calls fchown
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'open\s*\([^;]{0,160}/proc/self/exe[^;]{0,100};[\s\S]{0,256}fchown\s*\('

composite_rules:
  - id: userns-mount-chown-self-exe-root
    desc: Namespace exploit makes its own binary root-owned
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/os/container/namespace::new-user-namespace-flag
      - id: micro-behaviors/fs/volume/mount::mount-fn
      - id: micro-behaviors/fs/chown::fchown-fn
      - id: self-exe-open-followed-by-fchown
      - id: micro-behaviors/process/identity/setuid::root-setuid-call
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
