# Disposable SYSTEM-task helpers. Task registration alone requires existing
# authority and does not demonstrate a privilege-boundary bypass.
defaults:
  platforms: [windows]
  attack: T1053.005
  mbc: F0012

composite_rules:
  - id: system-interpreter-task-policy-bypass
    desc: SYSTEM interpreter task plus policy bypass
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/autorun/scheduled::schtasks-system-runas
      - id: micro-behaviors/os/autorun/control::schtasks-interpreter-action
      - id: micro-behaviors/process/create/flags::execution-policy-override-flag
    unless:
      - id: metadata/package/testing/harness/runtime/

  # The create-run-delete sequence: the task is not persistence, it is a
  # disposable elevation vehicle. /Run fires it on demand and /Delete removes
  # the evidence within moments — no legitimate task lifecycle does this.
  - id: throwaway-system-task-elevation
    desc: Throwaway SYSTEM task elevates a command then deletes itself
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/autorun/scheduled::system-interpreter-task
      - id: micro-behaviors/os/autorun/control::schtasks-run-task-command
      - id: micro-behaviors/os/autorun/control::schtasks-delete-task-command
    near_lines: 40
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
