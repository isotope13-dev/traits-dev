# A transient GCP policy pivot: widen the organization member-domain
# constraint, grant an external editor, and then clean up the grant. The
# cleanup is a response-time detail; the structural policy-write chain is the
# reusable artifact.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  attack: T1098.003

composite_rules:
  - id: gcp-source-external-editor-binding
    for: [source, scripts, '!jcl']
    desc: GCP source external editor binding
    crit: notable
    all:
      - id: micro-behaviors/communications/http/services/gcp::gcp-external-editor-binding
      - id: micro-behaviors/communications/http/services/gcp::gcp-editor-role-literal

  - id: gcp-audit-external-editor-binding
    for: [json]
    desc: GCP audit external editor binding
    crit: notable
    all:
      - id: micro-behaviors/communications/http/services/gcp::gcp-editor-role-event
      - id: micro-behaviors/communications/http/services/gcp::gcp-external-member-event
    near_bytes: 4096

  - id: gcp-foreign-domain-editor-pivot
    desc: GCP foreign-domain editor policy pivot
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/services/gcp::gcp-org-policy-change-operation
      - id: micro-behaviors/communications/http/services/gcp::gcp-iam-policy-write-operation
      - id: micro-behaviors/communications/http/services/gcp::gcp-allowed-policy-member-domains
    any:
      - id: gcp-source-external-editor-binding
      - id: gcp-audit-external-editor-binding
    near_bytes: 4096

  # Config Connector confused-deputy grants (ConfigConfusion): a KCC IAM
  # resource (IAMPolicyMember, IAMPolicy, IAMPartialPolicy) is enacted by
  # KCC's own service account, so whoever can submit the manifest wields
  # KCC's GCP authority. The declaration composite is context; the role and
  # scope legs below decide the tier. Broad roles granted through this path
  # are suspicious; the top-tier roles and organization scope are hostile.
  - id: kcc-iam-binding-declaration
    for: [shell, json]
    desc: Config Connector IAM binding declaration
    crit: notable
    conf: 0.92
    all:
      - id: well-known/tool/sysadmin/kubernetes/iac::kcc-iam-kind
      - id: well-known/tool/sysadmin/kubernetes/iac::kcc-cnrm-apiversion

  - id: kcc-editor-role-binding
    for: [shell, json]
    desc: Config Connector editor role binding
    crit: suspicious
    conf: 0.9
    all:
      - id: kcc-iam-binding-declaration
    any:
      - id: micro-behaviors/communications/http/services/gcp::gcp-editor-role-binding-field
      - id: micro-behaviors/communications/http/services/gcp::gcp-editor-role-event
      - id: micro-behaviors/communications/http/services/gcp::gcp-editor-role-literal

  - id: kcc-hierarchy-scope-binding
    for: [shell, json]
    desc: Config Connector organization or folder binding
    crit: suspicious
    conf: 0.9
    all:
      - id: kcc-iam-binding-declaration
    any:
      - id: well-known/tool/sysadmin/kubernetes/iac::kcc-organization-scope-ref
      - id: well-known/tool/sysadmin/kubernetes/iac::kcc-folder-scope-ref

  - id: kcc-owner-role-grant
    for: [shell, json]
    desc: Config Connector grants owner role
    crit: hostile
    conf: 0.98
    all:
      - id: kcc-iam-binding-declaration
    any:
      - id: micro-behaviors/communications/http/services/gcp::gcp-owner-role-binding-field
      - id: micro-behaviors/communications/http/services/gcp::gcp-owner-role-event

  - id: kcc-organization-admin-grant
    for: [shell, json]
    desc: Config Connector grants organization admin
    crit: hostile
    conf: 0.98
    all:
      - id: kcc-iam-binding-declaration
    any:
      - id: micro-behaviors/communications/http/services/gcp::gcp-org-admin-role-binding-field
      - id: micro-behaviors/communications/http/services/gcp::gcp-org-admin-role-event

  - id: kcc-organization-privileged-grant
    for: [shell, json]
    desc: Config Connector privileged organization grant
    crit: hostile
    conf: 0.985
    all:
      - id: kcc-iam-binding-declaration
      - id: well-known/tool/sysadmin/kubernetes/iac::kcc-organization-scope-ref
    any:
      - id: micro-behaviors/communications/http/services/gcp::gcp-owner-role-binding-field
      - id: micro-behaviors/communications/http/services/gcp::gcp-owner-role-event
      - id: micro-behaviors/communications/http/services/gcp::gcp-org-admin-role-binding-field
      - id: micro-behaviors/communications/http/services/gcp::gcp-org-admin-role-event
