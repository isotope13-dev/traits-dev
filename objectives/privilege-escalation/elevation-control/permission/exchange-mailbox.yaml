# Bulk grants remain plausible in migration and recovery tools. Require
# the pipeline, loop-body grant and FullAccess command in a bounded span.
# These observations do not establish message collection or export.
defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1098.002
composite_rules:
  - id: exchange-bulk-mailbox-fullaccess
    desc: Bulk mailbox loop with FullAccess grants
    crit: suspicious
    conf: 0.96
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/email/access/exchange::all-mailboxes-pipeline-loop
      - id: micro-behaviors/communications/email/access/exchange::mailbox-permission-loop-body
      - id: micro-behaviors/communications/email/access/exchange::grant-mailbox-fullaccess
