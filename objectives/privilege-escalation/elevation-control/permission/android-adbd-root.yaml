# Root-adbd escalation into the system partition: restart adbd as root,
# remount a read-only partition writable, and write a privapp-permissions
# allowlist granting privileged permissions. Each step has a development
# use on userdebug builds; minting a new privileged-permission grant for an
# installed package is the step with no debugging purpose. This is the
# escalation half of the late XCPE dropper routine; the persistence result
# is composed separately under objectives/persistence/.
defaults:
  platforms: [android, unix]
  for: [scripts, source]
  attack: T1548

composite_rules:
  - id: android-adbd-root-privapp-grant
    desc: Roots adbd to mint privileged app permissions
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/os/privilege/elevation::android-adbd-root-request
      - id: micro-behaviors/fs/volume/mount::remount-writable
      - id: micro-behaviors/os/package-manager/sideload::android-privapp-permissions-file-reference
      - id: micro-behaviors/os/package-manager/sideload::android-privileged-permission-grant
