defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1548

composite_rules:
  # AOSP renders every Settings switch with the framework view id
  # `android:id/switch_widget`.  An accessibility service that locates that id
  # and clicks it is flipping a system setting on its own behalf -- the
  # self-enable step used to turn on developer options, unknown sources or the
  # malware's own accessibility binding without the user touching the screen.
  - id: android-accessibility-settings-toggle-automation
    desc: Accessibility service flips a settings toggle
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: micro-behaviors/hardware/input/accessibility::android-settings-toggle-widget-target
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-action-source

  - id: android-accessibility-wireless-adb-enrollment
    desc: Accessibility automates wireless ADB enrollment
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/message/intent::android-development-settings-intent
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-tree-source
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-action-source
      - id: micro-behaviors/communications/socket/tcp::android-local-adb-pairing-source

  - id: android-local-adb-permission-elevation
    desc: Accessibility-driven ADB grants secure settings
    crit: hostile
    conf: 0.99
    all:
      - id: android-accessibility-wireless-adb-enrollment
      - id: micro-behaviors/communications/socket/tcp::android-adb-shell-command-service-request
      - id: micro-behaviors/os/privilege/elevation::android-pm-grant
      - id: micro-behaviors/os/privilege/elevation::android-write-secure-settings-permission
