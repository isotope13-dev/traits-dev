defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1548

composite_rules:
  - id: android-accessibility-wireless-adb-enrollment
    desc: Accessibility automates wireless ADB enrollment
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/message/intent::android-development-settings-intent
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-tree-source
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-gesture-source
      - id: micro-behaviors/communications/socket/tcp::android-local-adb-pairing-source

  - id: android-local-adb-permission-elevation
    desc: Accessibility-driven ADB grants secure settings
    crit: hostile
    conf: 0.99
    all:
      - id: android-accessibility-wireless-adb-enrollment
      - id: micro-behaviors/communications/socket/tcp::android-adb-shell-command-service-request
      - id: micro-behaviors/os/privilege/elevation::android-pm-grant
      - id: micro-behaviors/os/privilege/elevation::android-write-secure-settings-permission
