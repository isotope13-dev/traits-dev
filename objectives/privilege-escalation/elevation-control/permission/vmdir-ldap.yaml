defaults:
  for: [python, shell, perl, go]
  platforms: [unix]
  attack: T1098.007

traits:
  - id: ldap-builtin-administrators-dn
    desc: LDAP built-in Administrators group DN
    crit: component
    if:
      type: text
      regex: '(?i)cn=Administrators,\s*cn=Builtin'
  - id: ldif-escaped-member-add
    desc: LDIF member-add record text
    crit: component
    if:
      type: text
      regex: '(?i)add:\s*member\\nmember:'

composite_rules:
  - id: vmdir-credential-admin-group-add
    desc: Vmdir credential query and LDAP administrator member-add record
    crit: hostile
    all:
      - id: objectives/credential-access/files/appliance::vmdir-credential-ldap-reuse
      - id: ldap-builtin-administrators-dn
      - id: ldif-escaped-member-add
