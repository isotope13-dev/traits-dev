# AdministratorAccess attachment crosses to full account authority. It can
# be authorized provisioning, so keep it suspicious rather than hostile.
# Match the policy value inside the attachment call, never a policy reference
# elsewhere in the file. Source-local provenance handles simple aliases.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: suspicious
  conf: 0.95
  attack: T1098.003

traits:
  - id: aws-iam-admin-policy-sdk
    desc: IAM attachment call supplies AdministratorAccess
    for: [python, javascript, typescript, ruby, go, java, csharp, php]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)attach[_-]?(user|role)[_-]?policy$'
      arg:
        from:
          field: PolicyArn
          whole_value: '^arn:aws(-us-gov|-cn)?:iam::aws:policy/AdministratorAccess$'

  - id: aws-iam-admin-policy-js-command
    desc: IAM SDK command supplies AdministratorAccess
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)Attach(User|Role)PolicyCommand$'
      arg:
        from:
          field: PolicyArn
          whole_value: '^arn:aws(-us-gov|-cn)?:iam::aws:policy/AdministratorAccess$'

  - id: aws-iam-admin-policy-cli
    desc: IAM CLI attaches AdministratorAccess policy
    for: [shell, batch, powershell]
    if:
      type: symbol
      kind: call
      exact: aws
      args:
        - name: iam
        - name_regex: '^attach-(user|role)-policy$'
        - name: --policy-arn
        - regex: '^arn:aws(-us-gov|-cn)?:iam::aws:policy/AdministratorAccess$'

composite_rules:
  - id: aws-iam-administrator-policy-grant
    desc: IAM principal granted account administrator policy
    any:
      - id: aws-iam-admin-policy-sdk
      - id: aws-iam-admin-policy-js-command
      - id: aws-iam-admin-policy-cli
