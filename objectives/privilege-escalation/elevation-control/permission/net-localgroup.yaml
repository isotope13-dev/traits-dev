defaults:
  platforms: [windows]
  for: [html, vbs, batch, javascript, makefile, powershell]
  crit: suspicious
  conf: 0.97
  attack: T1136.001
traits:
  - id: net-user-localgroup-admin-add
    desc: Net user then localgroup add
    crit: notable
    for: [html, vbs, javascript]
    if:
      type: text
      regex: '(?is)net\s+user\b.{0,80}/add.{0,240}net\s+localgroup\b.{0,60}/add'
composite_rules:
  - id: net-local-user-group-add
    desc: Net user is added into a group
    crit: hostile
    for: [html, vbs, javascript]
    all:
      - id: net-user-localgroup-admin-add
      - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
  - id: shellcode-local-account-add
    desc: Shellcode page also adds a local account
    crit: suspicious
    for: [html, javascript]
    all:
      - id: net-user-localgroup-admin-add
      - id: objectives/execution/exploit/shellcode::js-percent-byte-alpha2-getpc
    near_bytes: 4000
