defaults:
  platforms:
  - windows
  for:
  - html
  - vbs
  - batch
  - javascript
  - makefile
  - powershell
  crit: suspicious
  conf: 0.97
  attack: T1136.001
composite_rules:
- id: net-local-user-group-add
  desc: Net user is added into a group
  crit: hostile
  for:
  - html
  - vbs
  - javascript
  all:
  - id: micro-behaviors/os/user/account::net-user-localgroup-add
  - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
- id: shellcode-local-account-add
  desc: Shellcode page also adds a local account
  crit: suspicious
  for:
  - html
  - javascript
  all:
  - id: micro-behaviors/os/user/account::net-user-localgroup-add
  - id: objectives/execution/exploit/shellcode::js-percent-byte-alpha2-getpc
  near_bytes: 4000
- id: activex-shellcode-admin-account-add
  desc: ActiveX shellcode page adds an admin account
  crit: hostile
  for:
  - html
  all:
  - id: micro-behaviors/os/user/account::net-user-localgroup-add
  - id: objectives/execution/exploit/shellcode::js-percent-byte-alpha2-getpc
  - id: micro-behaviors/os/com/automation::html-activex-classid-object
  near_bytes: 6000
