# CVE-2026-123890 final stage: an administrative API session (forged or
# legitimate) creates a local account holding the superAdmin role, whose
# sudoers grant (%superAdmin ALL=PASSWD:ALL,NOPASSWD:OPERATOR_N,ADMINISTRATOR_N)
# reaches root once SSH or Bash access is enabled for it.
defaults:
  platforms: [unix, windows]
  for: [python, go, javascript, typescript, shell]
  crit: hostile
  conf: 0.97
  attack: T1136.001,T1548.003

composite_rules:
  - id: vcenter-superadmin-backdoor-account
    desc: Creates vCenter superAdmin account and enables shell access
    near_bytes: 3000
    all:
      - id: micro-behaviors/communications/http/services/vcenter-appliance::vcenter-local-account-create-path
      - id: micro-behaviors/communications/http/services/vcenter-appliance::vcenter-superadmin-role-assignment
    any:
      - id: micro-behaviors/communications/http/services/vcenter-appliance::vcenter-ssh-access-enable-path
      - id: micro-behaviors/communications/http/services/vcenter-appliance::vcenter-shell-access-enable-path
