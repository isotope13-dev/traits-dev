# WebView page bundled in a package whose JavaScript asks the native side to
# open the Accessibility settings. The page also reads the host app's label
# through the same JavaScript bridge so the prompt can wear the app's own name;
# the user is walked into granting the service that later drives gestures and
# reads the screen. Page copy varies by language, so the bridge calls are the
# evidence, not the pretext wording.
defaults:
  platforms: [android]
  for: [html]
  attack: T1626.001,T1417

traits:
  - id: webview-bridge-accessibility-enable-call
    desc: Page script calls accessibility bridge
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\bAndroid\.[a-z][A-Za-z]{0,20}Access(ibility)?[A-Za-z]{0,12}\('

  - id: webview-bridge-app-label-read
    desc: Page reads app label via bridge
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\bAndroid\.get(AppLabel|AppName)\('

composite_rules:
  - id: accessibility-enable-lure-page
    desc: WebView page personalises a prompt to enable accessibility
    crit: suspicious
    conf: 0.9
    all:
      - id: webview-bridge-accessibility-enable-call
      - id: webview-bridge-app-label-read
