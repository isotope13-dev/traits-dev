defaults:
  platforms: [unix, windows]
  for: [php]

composite_rules:
  # An editor normally cannot manage settings or install plugins. The existing
  # backdoor bootstrap supplies the abuse context; a normal role-customization
  # plugin with editor creation and add_cap alone must remain neutral.
  # Bounded co-occurrence supports this pattern, not a proved same-user flow
  # or a claim that the code reached these calls at runtime.
  - id: wordpress-token-backdoor-editor-elevation
    desc: Token backdoor creates editor alongside admin grants
    crit: hostile
    conf: 0.98
    attack: T1098
    near_bytes: 2000
    all:
      - id: objectives/persistence/login/account/create::wordpress-token-privileged-user-bootstrap
      - id: micro-behaviors/os/user/account::wordpress-create-editor
      - id: micro-behaviors/os/user/account::wordpress-privileged-cap-grant
