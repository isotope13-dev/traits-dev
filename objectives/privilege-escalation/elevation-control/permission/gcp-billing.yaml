# Personal billing administrators cross an organization authority boundary,
# but legitimate grants exist. Neither finding claims proven LLM abuse.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: suspicious
  conf: 0.92
  attack: T1098.003

traits:
  - id: gcp-billing-admin-gmail-grant-cli
    desc: Grants Gmail user GCP billing administrator
    for: [shell, powershell, batch]
    if:
      type: symbol
      kind: call
      exact: gcloud
      args:
        - name: billing
        - name: accounts
        - name: add-iam-policy-binding
        - name_regex: '^--role=roles/billing\.admin$'
        - name_regex: '^--member=user:[^@\s]+@gmail\.com$'

composite_rules:
  - id: gcp-billing-iam-write-with-gmail-admin-binding
    desc: Billing IAM write with Gmail admin binding
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/services/gcp::billing-account-api-literal
      - id: micro-behaviors/communications/http/services/gcp::billing-admin-gmail-binding-append
      - id: micro-behaviors/communications/http/services/gcp::iam-policy-rest-write
