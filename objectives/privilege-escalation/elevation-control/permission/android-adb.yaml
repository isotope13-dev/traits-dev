# Accessibility-driven Wireless ADB pairing can be legitimate in local
# developer tools, so pairing automation alone is suspicious. It becomes an
# attack when a WebSocket-tasked ADB shell uses the channel to grant privileges.
defaults:
  platforms: [android]
  for: [java, kotlin, android_apk, zip, dex]
  attack: T1548

composite_rules:
  # Pairing and permission grants are also used by developer tools. Keep the
  # combination suspicious; credential export supplies hostile intent below.
  - id: android-spake2-secure-settings-grant
    desc: ADB pairing and secure-settings grant references
    crit: suspicious
    conf: 0.98
    for: [source, scripts, binaries]
    all:
      - id: micro-behaviors/communications/socket/tcp::adb-spake2-pairing-protocol
      - id: micro-behaviors/os/privilege/grant::android-pm-grant
      - id: metadata/permission/management::android-write-secure-settings-permission

  - id: android-password-exporter-adb-elevation
    desc: Password exporter requests privileged settings access
    crit: hostile
    conf: 0.99
    for: [java, kotlin]
    all:
      - id: android-spake2-secure-settings-grant
      - id: objectives/exfiltration/stealer/credential/value/password::android-accessibility-password-record-export

  - id: android-wireless-adb-c2-permission-grant
    desc: Wireless ADB agent grants permissions
    crit: hostile
    conf: 0.995
    attack: T1548,T1417.001
    all:
      - id: objectives/command-and-control/remote-command/control/adb::android-wireless-adb-c2-shell
      - id: micro-behaviors/os/privilege/grant::android-pm-grant

  # Pairing plus UI reads is neutral until a received operator command is
  # bound to the ADB shell. The remote-command leg supplies that evidence.
  - id: android-accessibility-driven-adb-self-enrollment
    desc: ADB remote-shell agent writes enabled Accessibility services
    crit: hostile
    conf: 0.99
    attack: T1548,T1631,T1417.001
    all:
      - id: micro-behaviors/communications/socket/tcp::android-pairing-and-shell-stream
      - id: objectives/command-and-control/remote-command/control/adb::android-wireless-adb-c2-shell
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-text-extraction
      - id: micro-behaviors/os/application/desktop-settings::android-shell-set-accessibility-services

  # Local Wireless ADB pairing + Accessibility enablement + pm grant lives in
  # micro-behaviors/os/privilege/grant as notable; hostile intent is established
  # when combined with Accessibility UI text extraction plus removal-guard or
  # lockscreen PIN verification.
  - id: android-wireless-adb-protected-accessibility-enrollment
    desc: Wireless ADB self-enrolls Accessibility agent
    crit: hostile
    conf: 0.99
    for: [java, kotlin]
    attack: T1548,T1629
    all:
      - id: micro-behaviors/os/privilege/grant::android-wireless-adb-accessibility-permission-grant
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-text-extraction
    any:
      - id: objectives/evasion/anti-av/platform/removal-guard::android-removal-screen-back-navigation
      - id: objectives/credential-access/capture/lockscreen::android-adb-locksettings-verify
