# Accessibility-driven Wireless ADB pairing can be legitimate in local
# developer tools, so pairing automation alone is suspicious. It becomes an
# attack when a WebSocket-tasked ADB shell uses the channel to grant privileges.
defaults:
  platforms: [android]
  for: [java, kotlin, apk, zip, dex]
  attack: T1548

composite_rules:
  - id: android-accessibility-wireless-adb-pairing
    desc: Accessibility automates Wireless ADB pairing
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/message/intent::android-development-settings-intent
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-node-automation
      - id: micro-behaviors/communications/socket/tcp::android-wireless-adb-services

  - id: android-wireless-adb-c2-permission-grant
    desc: Wireless ADB agent grants permissions
    crit: hostile
    conf: 0.995
    attack: T1548,T1417.001
    all:
      - id: objectives/command-and-control/remote-command/control::android-wireless-adb-c2-shell
      - id: micro-behaviors/os/privilege/elevation::android-pm-grant
