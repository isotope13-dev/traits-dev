# Accessibility-driven Wireless ADB pairing can be legitimate in local
# developer tools, so pairing automation alone is suspicious. It becomes an
# attack when a WebSocket-tasked ADB shell uses the channel to grant privileges.
defaults:
  platforms: [android]
  for: [java, kotlin, android_apk, zip, dex]
  attack: T1548

composite_rules:
  - id: android-accessibility-wireless-adb-pairing
    desc: Accessibility automates Wireless ADB pairing
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/message/intent::android-development-settings-intent
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-node-automation
      - id: micro-behaviors/communications/socket/tcp::android-wireless-adb-services

  - id: android-wireless-adb-c2-permission-grant
    desc: Wireless ADB agent grants permissions
    crit: hostile
    conf: 0.995
    attack: T1548,T1417.001
    all:
      - id: objectives/command-and-control/remote-command/control::android-wireless-adb-c2-shell
      - id: micro-behaviors/os/privilege/elevation::android-pm-grant

  # The self-pairing step, independent of which library implements it.  A
  # workstation pairs with a phone by having a human read the six-digit code
  # off the Wireless Debugging dialog; an app that submits a pairing code and
  # then opens the `shell:` service is completing that handshake against the
  # device it is already running on, giving itself shell-UID execution with no
  # second machine and no user involvement.
  - id: android-in-app-adb-self-pairing-shell
    desc: App pairs with local ADB and opens a shell
    crit: suspicious
    conf: 0.97
    attack: T1548,T1631
    all:
      - id: micro-behaviors/communications/socket/tcp::android-in-app-adb-shell-stream
    any:
      - id: micro-behaviors/communications/socket/tcp::android-adb-pairing-code-submit
      - id: micro-behaviors/communications/socket/tcp::android-local-adb-pairing-source
      - id: well-known/dual-use/access-control/libadb-android::libadb-android-library

  # Accessibility supplies what the pairing handshake is missing.  The dialog
  # shows the code and the port; a service that reads the UI tree can take both
  # off the screen and hand them to its own ADB client, closing the loop
  # without the user ever seeing a prompt they had to answer.
  - id: android-accessibility-driven-adb-self-enrollment
    desc: Accessibility feeds the app's own ADB pairing
    crit: hostile
    conf: 0.99
    attack: T1548,T1631,T1417.001
    all:
      - id: android-in-app-adb-self-pairing-shell
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-text-extraction
      - id: micro-behaviors/communications/socket/tcp::android-wireless-adb-services
