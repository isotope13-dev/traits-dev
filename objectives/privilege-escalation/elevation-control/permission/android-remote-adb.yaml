defaults:
  platforms: [android]
composite_rules:
  - id: android-remote-adb-accessibility-grant
    desc: Remote ADB installer and Accessibility grants
    crit: hostile
    conf: 0.99
    for: [java, apk, zip]
    attack: T1548
    all:
      - id: micro-behaviors/os/privilege/elevation::android-install-attribution-accessibility-configuration
      - id: objectives/command-and-control/remote-command/control/adb::android-wireless-adb-c2-shell
