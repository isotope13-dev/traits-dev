defaults:
  platforms: [android]
  for: [kotlin]
  attack: T1548

composite_rules:
  - id: kotlin-android-permission-elevation
    desc: Kotlin Android permission elevation
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/privilege/elevation::android-pm-grant
    any:
      - id: micro-behaviors/os/privilege/elevation::android-dpm-set-active-admin-command
      - id: objectives/privilege-escalation/elevation-control/sudo::kotlin-android-su-execution

  - id: android-device-admin-permission-elevation
    desc: Android device admin self-enrollment and permission grant
    crit: hostile
    conf: 0.98
    for: [elf, dex, java, kotlin]
    all:
      - id: micro-behaviors/os/privilege/elevation::android-pm-grant
      - id: micro-behaviors/os/privilege/elevation::android-dpm-set-active-admin-command
