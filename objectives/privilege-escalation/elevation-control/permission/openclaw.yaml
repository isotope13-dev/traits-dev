defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1098

composite_rules:
  - id: paired-device-operator-scope-escalation
    desc: Escalates a paired OpenClaw device to operator.write
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/application/config::openclaw-paired-operator-state
      - id: micro-behaviors/fs/write/state::javascript-paired-device-state-write
    any:
      - id: micro-behaviors/os/privilege/elevation::operator-write-scope-append
      - id: micro-behaviors/os/privilege/elevation::operator-write-spread-add
