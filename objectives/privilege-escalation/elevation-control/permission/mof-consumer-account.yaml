# A permanent WMI consumer runs as LocalSystem, so a MOF that a low-privilege
# writer gets compiled (the MySQL dump-file MOF technique) can create users
# or add Administrators members it could not add itself.
defaults:
  platforms: [windows]
  for: [text, vbs]
  attack: T1546.003,T1136.001,T1098

composite_rules:
  - id: mof-system-consumer-account-grant
    desc: MOF consumer creates accounts as SYSTEM
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/wmi/event::mof-script-consumer-instance
      - id: micro-behaviors/os/wmi/event::mof-filter-consumer-binding-instance
    any:
      - id: micro-behaviors/os/user/create::net-user-create-text
      - id: micro-behaviors/os/group/membership::embedded-net-localgroup-admin-add
