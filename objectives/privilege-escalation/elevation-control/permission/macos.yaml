defaults:
  platforms: [macos]
  for: [scripts, source, binaries]

traits:
  - id: authorizationdb-allow-value
    desc: AuthorizationDB rule set to allow
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bsecurity\s+authorizationdb\s+write\b[^\r\n]{0,160}\ballow\b'

composite_rules:
  - id: authorizationdb-allow-policy-change
    desc: macOS AuthorizationDB rule allows access
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/os/security/policy::authorizationdb-write
      - id: authorizationdb-allow-value
    near_lines: 20
    # macOS CI runners grant system.privilege.taskport so debugger test
    # suites (rizin, lldb) can attach without a password prompt; on an
    # ephemeral, public runner that is build setup, not a host policy change.
    downgrade:
      any:
        - id: metadata/build/ci/github-actions::workflow-definition-path
