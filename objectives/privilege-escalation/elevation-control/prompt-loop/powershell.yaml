defaults:
  platforms: [windows]
  for: [pe, dll, csharp, powershell, batch, javascript]
  conf: 0.98
  attack: T1548.002

composite_rules:
  - id: downloaded-payload-elevation-prompt-loop
    desc: Repeated elevation prompts launch downloaded AppData payload
    crit: hostile
    all:
      - id: micro-behaviors/process/create/start-process::powershell-loop-retries-elevation
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-argument
