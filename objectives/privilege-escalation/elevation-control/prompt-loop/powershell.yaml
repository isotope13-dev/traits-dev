defaults:
  platforms: [windows]
  for: [pe, dll, csharp, powershell, batch, javascript]
  conf: 0.98
  attack: T1548.002

composite_rules:
  - id: downloaded-payload-elevation-prompt-loop
    for: [pe, batch, powershell]
    desc: Downloaded payload repeats elevation prompts
    crit: hostile
    all:
      - id: objectives/privilege-escalation/elevation-control/prompt-loop::powershell-loop-retries-elevation
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::iwr-outfile-download
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-argument
