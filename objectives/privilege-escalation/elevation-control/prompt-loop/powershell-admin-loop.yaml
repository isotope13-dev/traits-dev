defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1548.002

traits:
  - id: powershell-while-not-admin-loop
    desc: PowerShell loops until user has admin role
    crit: notable
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '(?is)while\s*\(\s*-not\b.{0,220}IsInRole.{0,80}Administrator'

  - id: powershell-psi-verb-runas
    desc: ProcessStartInfo sets Verb to RunAs
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\.Verb\s*=\s*["'']RunAs["'']'

composite_rules:
  - id: powershell-hidden-admin-elevation-loop
    desc: PowerShell loops hidden UAC RunAs elevation until admin
    crit: hostile
    conf: 0.97
    all:
      - id: powershell-while-not-admin-loop
      - id: micro-behaviors/os/privilege/check::powershell-administrator-role-check
      - id: micro-behaviors/process/create/subprocess/launch::powershell-diagnostics-process-start
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
    any:
      - id: powershell-psi-verb-runas
      - id: micro-behaviors/os/privilege/elevation::powershell-start-process-runas
