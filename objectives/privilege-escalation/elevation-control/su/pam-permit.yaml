defaults:
  platforms: [unix]
  for: [php]
composite_rules:
  - id: pam-permit-root-command
    desc: Attempts root execution after permissive su PAM write
    crit: hostile
    conf: 0.98
    attack: T1556.003,T1548
    all:
      - id: objectives/evasion/security-bypass/auth::pam-su-unconditional-auth-write
      - id: micro-behaviors/process/identity/switch::php-shell-su-root
