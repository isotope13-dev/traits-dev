# Tiny setuid helpers that print "Get Su" errno traces and drop /tmp/sh
# after a "root me" prompt.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1548.001

traits:
  - id: get-su-errno-banner
    desc: Get-Su errno status banner
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'Get Su:'
  - id: root-me-prompt
    desc: Root-me privilege prompt
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\broot\s+me\b'

composite_rules:
  - id: get-su-root-me
    desc: Get-Su banner with root-me prompt
    crit: hostile
    conf: 0.97
    all:
      - id: get-su-errno-banner
      - id: root-me-prompt
  - id: get-su-tmp-sh
    desc: Get-Su banner with /tmp/sh path reference
    crit: hostile
    conf: 0.96
    all:
      - id: get-su-errno-banner
      - id: micro-behaviors/fs/path/binary::tmp-sh-path-reference
  - id: root-me-tmp-sh
    desc: Root-me prompt with /tmp/sh path reference
    crit: hostile
    conf: 0.94
    all:
      - id: root-me-prompt
      - id: micro-behaviors/fs/path/binary::tmp-sh-path-reference
