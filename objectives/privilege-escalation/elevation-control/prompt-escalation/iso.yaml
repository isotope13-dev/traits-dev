defaults:
  platforms: [unix, windows]
  # ISO-9660 images currently arrive as opaque/unknown files.
  for: [all]
  attack: T1027.002,T1548.002,T1204.002

composite_rules:
  - id: iso-admin-prompt-packed-loader
    desc: ISO carries packed loader requesting administrator rights
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format::primary-volume-descriptor
      - id: metadata/file/format::embedded-themida-section
      - id: metadata/file/format::embedded-boot-section
      - id: metadata/file/format::embedded-smart-screen-guidance
      - id: metadata/file/format::embedded-admin-manifest-marker
