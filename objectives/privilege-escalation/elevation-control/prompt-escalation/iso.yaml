defaults:
  platforms: [unix, windows]
  # ISO-9660 images currently arrive as opaque/unknown files.
  for: [iso]
  attack: T1027.002,T1548.002,T1204.002

composite_rules:
  - id: iso-admin-prompt-packed-loader
    desc: ISO carries packed loader requesting administrator rights
    crit: hostile
    conf: 0.99
    for: [iso, data]
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/structure::embedded-themida-section
      - id: metadata/file/format/iso/structure::embedded-boot-section
      - id: metadata/file/format/iso/structure::embedded-admin-manifest-marker
      - id: metadata/file/format/iso/payload::iso-smart-screen-message
      - id: metadata/file/format/iso/payload::iso-run-anyway-guidance
