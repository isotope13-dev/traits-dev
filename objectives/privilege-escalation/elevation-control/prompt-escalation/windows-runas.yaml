defaults:
  platforms: [windows]
  for: [pe]
  attack: T1548.002

traits:
  - id: italian-admin-relaunch-message
    desc: Italian admin relaunch message
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: Riavvio con diritti di amministratore
  - id: go-default-uac-relaunch-function-text
    desc: Go default UAC relaunch function text
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: /uac.RunDefaultUAC
  - id: go-default-uac-relaunch-function-symbol
    desc: Go default UAC relaunch symbol
    crit: notable
    conf: 0.97
    if:
      type: symbol
      regex: /uac\.RunDefaultUAC(\.|$)
  - id: go-runas-admin-function-text
    desc: Go run-as-administrator function text
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: /uac.runAsAdmin
  - id: go-runas-admin-function-symbol
    desc: Go run-as-administrator symbol
    crit: notable
    conf: 0.97
    if:
      type: symbol
      regex: /uac\.runAsAdmin(\.|$)
  - id: runas-verb-pe-string
    desc: Windows PE runas elevation verb string
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)^[^a-z0-9_]?runas$'

composite_rules:
  - id: go-default-uac-relaunch-function
    desc: Go default UAC relaunch function
    crit: notable
    conf: 0.97
    any:
      - id: go-default-uac-relaunch-function-text
      - id: go-default-uac-relaunch-function-symbol

  - id: go-runas-admin-function
    desc: Go run-as-administrator function
    crit: notable
    conf: 0.97
    any:
      - id: go-runas-admin-function-text
      - id: go-runas-admin-function-symbol
  - id: windows-runas-admin-relaunch
    desc: Windows runas admin relaunch
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/privilege/elevation::runas-string
      - id: micro-behaviors/ui/dialog/error::italian-admin-required-message
      - id: italian-admin-relaunch-message
      - id: micro-behaviors/process/create/native-symbol::shell-execute-ex-a
    any:
      - id: micro-behaviors/os/privilege/token/use::open-process-token
      - id: micro-behaviors/os/privilege/token/use::get-token-information

  - id: native-token-checked-runas-relaunch
    desc: Checks process token and relaunches elevated with runas
    crit: suspicious
    conf: 0.93
    scope: file
    all:
      - id: runas-verb-pe-string
      - id: micro-behaviors/os/handler/open::win-shellexecute
      - id: micro-behaviors/os/privilege/token/use::open-process-token-any
      - id: micro-behaviors/os/privilege/token/use::get-token-information-any
    any:
      - id: micro-behaviors/process/info/current::get-module-filename-wide
      - id: micro-behaviors/process/info/current::get-module-filename-ansi
    unless:
      - id: metadata/vendor/identity::microsoft-corp-versioninfo
      - id: metadata/signature/verified/
      - id: metadata/lang/compiled::autoit-compiled-script
      # NirSoft AdvancedRun is a run-token-and-relaunch tool by design:
      # its "runas" strings are INI keys, and its token and remote-thread
      # imports are its documented function, not an attack chain.
      - id: well-known/tool/sysadmin/nirsoft::advancedrun-build-identity
    downgrade:
      any:
        - id: well-known/lib/platform/advanced-installer::advanced-installer-helper-context
        - id: metadata/installer/product/

  - id: runas-relaunch-with-process-injection
    desc: Runas elevation relaunch with remote process injection
    crit: hostile
    conf: 0.96
    attack: T1548.002,T1055
    all:
      - id: native-token-checked-runas-relaunch
      - id: micro-behaviors/process/inject/

  - id: runas-relaunch-with-persistent-task
    desc: Runas relaunch with persistent task
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/privilege/elevation::runas-elevation-token
      - id: micro-behaviors/os/handler/open::shell-execute-ex
      - id: objectives/persistence/login/scheduled-task/cli::elevated-logon-self-persistence
    unless:
      - id: metadata/vendor/identity::microsoft-corp-versioninfo

  - id: go-payload-runas-relaunch
    desc: Go UAC, payload container and stealth indicators co-occur
    crit: hostile
    conf: 0.99
    all:
      - id: go-default-uac-relaunch-function
      - id: go-runas-admin-function
      - id: micro-behaviors/data/string/container::payload-container-name-text
      - id: objectives/anti-analysis/sandbox-detect/routine-name::stealth-check-runner

  - id: python-admin-gated-telegram-exfil
    desc: Python elevates before exfiltrating Telegram data
    crit: hostile
    conf: 0.99
    attack: T1005,T1539,T1560.001,T1041,T1548.002
    for: [python]
    scope: file
    all:
      - id: micro-behaviors/os/privilege/elevation::python-self-elevation-relaunch
      - id: micro-behaviors/fs/path/application/messaging::telegram-session-data-location
      - id: micro-behaviors/data/archive/create/zip::python-shutil-make-archive
      - id: micro-behaviors/communications/http/upload/file::python-http-files-parameter

  - id: physical-drive-probe-powershell-runas
    desc: Raw-drive path with PowerShell RunAs
    crit: suspicious
    conf: 0.96
    for: [pe, go]
    all:
      - id: micro-behaviors/fs/path/device/storage::windows-physicaldrive-path
      - id: micro-behaviors/process/create/cmdlet::powershell-uac-start-process-any
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-any
    downgrade:
      any:
        - id: metadata/package/testing/compiled::go-compiled-test-binary

  - id: physical-drive-gated-runas-archive-dropper
    desc: Raw-drive path with RunAs ZIP dropper
    crit: hostile
    conf: 0.98
    for: [pe, go]
    attack: T1548.002,T1105
    all:
      - id: physical-drive-probe-powershell-runas
      - id: micro-behaviors/communications/http/get::go-http-get-any
      - id: micro-behaviors/communications/http/download/url::archive-url-reference-binary
      - id: micro-behaviors/data/archive/zip::go-zip-reader-any
    unless:
      - id: micro-behaviors/communications/http/download/url::github-source-archive-url
      - id: micro-behaviors/communications/url/external/github::github-archive-ref-download
      - id: metadata/signature/verified/
