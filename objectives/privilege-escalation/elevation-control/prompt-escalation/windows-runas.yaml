defaults:
  platforms: [windows]
  for: [pe]
  attack: T1548.002

traits:
  - id: italian-admin-relaunch-message
    desc: Italian admin relaunch message
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: Riavvio con diritti di amministratore
  - id: go-default-uac-relaunch-function
    desc: Go default UAC relaunch function
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: /uac.RunDefaultUAC
  - id: go-runas-admin-function
    desc: Go run-as-administrator function
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: /uac.runAsAdmin

composite_rules:
  - id: windows-runas-admin-relaunch
    desc: Windows runas admin relaunch
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/privilege/elevation::runas-string
      - id: micro-behaviors/ui/dialog/error::italian-admin-required-message
      - id: italian-admin-relaunch-message
      - id: metadata/binary/symbols/name/process::shell-execute-ex-a
    any:
      - id: micro-behaviors/os/privilege/token/use::open-process-token
      - id: micro-behaviors/os/privilege/token/use::get-token-information

  - id: runas-relaunch-with-persistent-task
    desc: Runas relaunch with persistent task
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/privilege/elevation::runas-elevation-token
      - id: micro-behaviors/os/handler/open::shell-execute-ex
      - id: objectives/persistence/login/scheduled-task/cli::elevated-logon-self-persistence
    unless:
      - id: metadata/vendor/identity::microsoft-corp-versioninfo

  - id: go-payload-runas-relaunch
    desc: Go UAC, payload container and stealth indicators co-occur
    crit: hostile
    conf: 0.99
    all:
      - id: go-default-uac-relaunch-function
      - id: go-runas-admin-function
      - id: micro-behaviors/data/string/container::payload-container-name-text
      - id: metadata/binary/symbols/name/analysis::stealth-check-runner

  - id: python-admin-gated-telegram-exfil
    desc: Python elevates before exfiltrating Telegram data
    crit: hostile
    conf: 0.99
    attack: T1005,T1539,T1560.001,T1041,T1548.002
    for: [python]
    scope: file
    all:
      - id: micro-behaviors/os/privilege/elevation::python-self-elevation-relaunch
      - id: micro-behaviors/fs/path/application/messaging::telegram-session-data-location
      - id: micro-behaviors/data/archive/create/zip::python-shutil-make-archive
      - id: micro-behaviors/communications/http/upload/file::python-http-files-parameter

  - id: physical-drive-probe-powershell-runas
    desc: Physical-drive admin probe with PowerShell RunAs
    crit: suspicious
    conf: 0.96
    for: [pe, go]
    all:
      - id: micro-behaviors/os/privilege/check::windows-physical-drive-admin-probe
      - id: micro-behaviors/process/create/cmdlet::powershell-uac-start-process-any
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-any

  - id: physical-drive-gated-runas-archive-dropper
    desc: Physical-drive admin check gates RunAs ZIP dropper
    crit: hostile
    conf: 0.98
    for: [pe, go]
    attack: T1548.002,T1105
    all:
      - id: physical-drive-probe-powershell-runas
      - id: micro-behaviors/communications/http/get::go-http-get-any
      - id: micro-behaviors/communications/http/download/url::archive-url-reference-binary
      - id: micro-behaviors/data/archive/zip::go-zip-reader-any
    unless:
      - id: micro-behaviors/communications/http/download/url::github-source-archive-url
      - id: micro-behaviors/communications/url/external/github::github-archive-ref-download
      - id: metadata/signature/verified/
