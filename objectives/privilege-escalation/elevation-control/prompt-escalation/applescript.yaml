defaults:
  for:
    - shell
    - python
    - javascript
  platforms:
    - macos
  attack: T1548.004
composite_rules:
  - id: macos-admin-prompt-persistence
    desc: AppleScript admin prompt with persistence
    crit: suspicious
    conf: 0.93
    all:
      - id: "micro-behaviors/os/privilege/elevation::applescript-shell-admin-request-embedded"
    any:
      - id: objectives/persistence/system/launchd/location::launchd
      - id: objectives/persistence/login/items::loginhook-persistence
      - id: objectives/persistence/login/items::tal-persistence
  - id: admin-prompt-loginhook
    desc: AppleScript admin prompt installs LoginHook
    crit: hostile
    conf: 0.96
    all:
      - id: "micro-behaviors/os/privilege/elevation::applescript-shell-admin-request-embedded"
      - id: objectives/persistence/login/items::loginhook-persistence
