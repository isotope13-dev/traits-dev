defaults:
  for: [scripts, source]
  platforms: [linux]
  crit: notable
  conf: 0.98
  attack: T1548.003
composite_rules:
  - id: pam-symlink-unrestricted-sudo
    desc: PAM symlink and execution hook accompany unrestricted sudo grant
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/link/symlink::sudo-pam-symlink-target
      - id: micro-behaviors/os/pam/auth::pam-exec-session-hook
      - id: micro-behaviors/fs/config/sudo::nopasswd-all-directive
      - id: micro-behaviors/fs/config/sudo::sudoers-output-redirection
