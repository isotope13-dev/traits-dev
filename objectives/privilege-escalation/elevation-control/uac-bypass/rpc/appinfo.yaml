# UAC bypass through the auto-elevating RPC interface behind the consent
# prompt. Rather than driving a COM elevation moniker, the caller binds the
# appinfo (Application Information) service's local RPC interface directly and
# asks it to launch an image elevated, so no consent dialog is shown and the
# launch is attributed to a trusted Windows caller.
#
# The interface UUID is a fixed Windows constant, so it identifies the
# technique across implementations and languages the same way the CMSTPLUA
# CLSID does for the COM route in ../com/cmstplua.yaml.
defaults:
  platforms: [windows]
  attack: T1548.002
  for: [pe, dll, c, cpp, csharp, go, rust, powershell]

traits:
  - id: appinfo-elevation-interface-uuid
    desc: Auto-elevation RPC interface UUID
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\{?201ef99a[-, ]+7fa0[-, ]+444c[-, ]+9399[-, ]+19ba84f12a1a\}?'
