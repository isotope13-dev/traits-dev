defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1548.002
  mbc: F0004
composite_rules:
- id: enumerated-consent-dialog-takeover
  desc: Hunts the UAC consent dialog and fronts it
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/ui/dialog/title::uac-consent-dialog-title
  - id: micro-behaviors/ui/window/enumerate::enum-windows
  - id: micro-behaviors/ui/window/enumerate::get-window-text
  - id: micro-behaviors/ui/window/enumerate::set-foreground-window
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app
  - id: well-known/tool
  - id: well-known/dual-use/remote-admin/
  - id: metadata/binary/installer/family/
