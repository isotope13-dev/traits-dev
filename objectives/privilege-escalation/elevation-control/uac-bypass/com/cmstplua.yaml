defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1548.002
traits:
  - id: go-main-cmstplua-elevation-routine
    desc: Go main CMSTPLUA elevation routine
    crit: suspicious
    conf: 0.98
    if:
      type: text
      exact: main.elevateCMSTPLUA

composite_rules:
  # The moniker atoms and the plain "binds an elevated COM object" composite
  # moved to micro-behaviors/os/com/elevate: they detect the documented
  # elevation API, which is not by itself a bypass. The class identifier is
  # also a neutral reference; only its activation is assessed here.
  - id: cmstplua-uac-bypass
    desc: CMSTPLUA UAC bypass via COM moniker
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/com/elevate::cmstplua-clsid
      - id: micro-behaviors/os/com/elevate::elevation-moniker
      - id: micro-behaviors/os/com/invoke::co-get-object
    unless:
      - id: metadata/signed/platform::microsoft
      - id: well-known/lib/platform/wireguard/

  # The import form above misses loaders that resolve CoGetObject through a
  # multiplicative hash and keep only the CMSTPLUA class and the
  # Elevation:Administrator moniker in clear text.
  - id: hashed-api-cmstplua-uac-bypass
    desc: Hidden API resolution activates CMSTPLUA elevation
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/com/elevate::cmstplua-clsid
      - id: micro-behaviors/os/com/elevate::elevation-administrator-moniker
      - id: micro-behaviors/os/api-resolution/hash-based::multiplicative-hash-loop-x64
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform::microsoft
      - id: well-known/lib/platform/wireguard/
      - id: well-known/lib/network/wireguard::windows-module-import

  - id: cmstplua-source-uac-bypass
    desc: Native source activates CMSTPLUA through elevation moniker
    crit: hostile
    conf: 0.98
    for: [c, cpp]
    all:
      - id: micro-behaviors/os/com/elevate::cmstplua-clsid-source
      - id: micro-behaviors/os/com/elevate::elevation-moniker-source
      - id: micro-behaviors/os/com/invoke::co-get-object-output-pointer-source
    unless:
      # WireGuard's EV-signed Windows client deliberately uses this interface
      # for its user-visible administrator launch path, with `runas` fallback.
      - id: well-known/lib/network/wireguard::windows-module-import
      - id: well-known/lib/platform/wireguard/
