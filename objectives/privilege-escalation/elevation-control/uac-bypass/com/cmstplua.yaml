defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1548.002
traits:
  - id: go-main-cmstplua-elevation-routine
    desc: Go main CMSTPLUA elevation routine
    crit: suspicious
    conf: 0.98
    if:
      type: text
      exact: main.elevateCMSTPLUA

  - id: cmstplua-clsid
    desc: CMSTPLUA COM CLSID for UAC bypass
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: "{3E5FC7F9-9A51-4367-9063-A120244FBEC7}"
  
  # Native source variants frequently carry the CLSID and moniker as text,
  # while the PE/DLL rules above use extracted binary strings.  These atoms
  # are source-scoped and require the complete COM identifiers.
  - id: cmstplua-clsid-source
    desc: Source embeds CMSTPLUA UAC CLSID
    crit: notable
    conf: 0.96
    for: [c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)\{?3e5fc7f9[-, ]+9a51[-, ]+4367[-, ]+9063[-, ]+a120244fbec7\}?'
    unless:
      - id: metadata/lang/generated/

composite_rules:
  # The moniker atoms and the plain "binds an elevated COM object" composite
  # moved to micro-behaviors/os/com/elevate: they detect the documented
  # elevation API, which is not by itself a bypass. What is filed here is the
  # auto-elevating CLSID that removes the consent prompt.
  - id: cmstplua-uac-bypass
    desc: CMSTPLUA UAC bypass via COM moniker
    crit: hostile
    conf: 0.98
    all:
      - id: cmstplua-clsid
      - id: micro-behaviors/os/com/elevate::elevation-moniker
      - id: micro-behaviors/os/com/invoke::co-get-object
    unless:
      - id: metadata/signed/platform::microsoft
      - id: well-known/lib/platform/wireguard/

  # The statically-visible bypass kit: the auto-elevate CLSID string plus both
  # elevation-moniker forms. Loaders that bind the moniker through a
  # manually-resolved COM call leave no CoGetObject import for the composite
  # above to require, so this rule covers the concealed shape: the moniker is
  # assembled at runtime (wide-string copy into
  # Elevation:Administrator!new:{CLSID}) and bound through an indirect call.
  # Legitimate elevation uses the moniker with the caller's own CLSID; the
  # CMSTPLUA auto-elevate CLSID is the bypass, and unsigned carriers have no
  # legitimate use for it.
  - id: cmstplua-elevation-kit-unsigned
    desc: Unsigned binary carries CMSTPLUA bypass kit
    crit: hostile
    conf: 0.96
    all:
      - id: cmstplua-clsid
      - id: micro-behaviors/os/com/elevate::elevation-moniker
      - id: micro-behaviors/os/com/elevate::elevation-administrator-moniker
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: cmstplua-source-uac-bypass
    desc: Native source activates CMSTPLUA through elevation moniker
    crit: hostile
    conf: 0.98
    for: [c, cpp]
    all:
      - id: cmstplua-clsid-source
      - id: micro-behaviors/os/com/elevate::elevation-moniker-source
      - id: micro-behaviors/os/com/invoke::co-get-object-output-pointer-source
    unless:
      # WireGuard's EV-signed Windows client deliberately uses this interface
      # for its user-visible administrator launch path, with `runas` fallback.
      - id: well-known/lib/network/wireguard::windows-module-import
      - id: well-known/lib/platform/wireguard/
