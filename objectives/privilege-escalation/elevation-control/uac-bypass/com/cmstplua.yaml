defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1548.002
traits:
  - id: go-main-cmstplua-elevation-routine
    desc: Go main CMSTPLUA elevation routine
    crit: suspicious
    conf: 0.98
    if:
      type: text
      exact: main.elevateCMSTPLUA

composite_rules:
  # The moniker atoms and the plain "binds an elevated COM object" composite
  # moved to micro-behaviors/os/com/elevate: they detect the documented
  # elevation API, which is not by itself a bypass. The class identifier is
  # also a neutral reference; only its activation is assessed here.
  - id: cmstplua-uac-bypass
    desc: CMSTPLUA UAC bypass via COM moniker
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/com/automation::cmstplua-clsid
      - id: micro-behaviors/os/com/elevate::elevation-moniker
      - id: micro-behaviors/os/com/instantiation::co-get-object
    unless:
      - id: metadata/signature/verified/platform::microsoft

  # The import form misses encrypted-name GetProcAddress resolution.
  # Integer mixing alone did not establish API-name hashing.
  - id: concealed-api-cmstplua-uac-bypass
    desc: Concealed CoGetObject with CMSTPLUA elevation moniker
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/com/automation::cmstplua-clsid
      - id: micro-behaviors/os/com/elevate::elevation-administrator-moniker
      - id: objectives/anti-static/obfuscation/imports/concealment::tls-rotate-xor-api-names
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/signature/verified/platform::microsoft

  - id: cmstplua-source-uac-bypass
    desc: Native source activates CMSTPLUA through elevation moniker
    crit: suspicious
    conf: 0.98
    for: [c, cpp]
    all:
      - id: well-known/app/system/microsoft/platform::cmstplua-clsid-source
      - id: micro-behaviors/os/com/elevate::elevation-moniker-source
      - id: micro-behaviors/os/com/invoke::co-get-object-output-pointer-source

  # JVM variant: a Java class binds the CMSTPLUA elevated object through the
  # same moniker, typically via JNA, and invokes the returned interface
  # pointer directly. The pe/dll composite above never sees class files.
  - id: cmstplua-uac-bypass-jvm
    desc: JVM class activates CMSTPLUA through elevation moniker
    crit: suspicious
    conf: 0.97
    for: [class]
    near_bytes: 600
    all:
      - id: micro-behaviors/os/com/automation::cmstplua-clsid
      - id: micro-behaviors/os/com/instantiation::co-get-object
    any:
      - id: micro-behaviors/os/com/elevate::elevation-moniker
      - id: micro-behaviors/os/com/elevate::elevation-highest-moniker
