defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Ordinary installers may elevate COM helpers. Here the elevated file
  # operation is paired with DLL staging and the pkgmgr/dismcore load surface.
  # File scope keeps an unrelated package member from supplying the APIs.
  - id: elevated-file-operation-pkgmgr-dll-staging
    desc: Elevated FileOperation with DISM DLL staging and pkgmgr launch APIs
    crit: hostile
    conf: 0.98
    attack: T1548.002,T1574.001
    all:
      - id: micro-behaviors/os/com/elevate::ifileoperation-elevation-moniker
      - id: micro-behaviors/os/com/invoke::co-get-object
      - id: micro-behaviors/os/com/invoke::shell-item-from-parsing-name
      - id: micro-behaviors/fs/path/binary::pkgmgr-executable-reference
      - id: micro-behaviors/fs/path/library::dismcore-library-reference
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/process/create/shellexec::shell-execute-ex
