# UAC bypass through the auto-elevating ICMLuaUtil COM interface (the UACME
# method-41 route). Same shape as the CMSTPLUA bypass in cmstplua.yaml: the
# caller binds the documented "Elevation:Administrator!new:" moniker to the
# Microsoft-whitelisted ICMLuaUtil interface via CoGetObject, receiving an
# elevated object with no consent prompt, then launches through it
# (ICMLuaUtil::ShellExec). The interface name is a fixed Windows SDK
# constant, so it identifies the technique across builds the way the
# CMSTPLUA CLSID does for the COM route next door.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1548.002
traits:
  - id: icmluautil-interface-name
    desc: ICMLuaUtil COM interface for UAC bypass
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: "ICMLuaUtil"

  # Native source variants carry the interface name as text, while the
  # PE/DLL rules above use extracted binary strings.
  - id: icmluautil-interface-name-source
    desc: Source references ICMLuaUtil elevation interface
    crit: notable
    conf: 0.96
    for: [c, cpp, csharp, go, rust]
    if:
      type: text
      substr: "ICMLuaUtil"
    unless:
      - id: metadata/lang/generated/

composite_rules:
  # The moniker atoms and the plain "binds an elevated COM object" composite
  # live in micro-behaviors/os/com/elevate: they detect the documented
  # elevation API, which is not by itself a bypass. What is filed here is the
  # auto-elevating interface that removes the consent prompt.
  - id: icmluautil-uac-bypass
    desc: ICMLuaUtil UAC bypass via COM moniker
    crit: hostile
    conf: 0.98
    all:
      - id: icmluautil-interface-name
      - id: micro-behaviors/os/com/elevate::elevation-moniker
      - id: micro-behaviors/os/com/invoke::co-get-object
    unless:
      - id: metadata/signed/platform::microsoft
      - id: well-known/lib/platform/wireguard/

  # A PE can carry the ICMLuaUtil IID and elevation moniker while importing
  # CoGetObject directly, even when it omits the interface's readable name.
  - id: icmluautil-iid-elevation-bypass
    desc: ICMLuaUtil IID activated through elevation moniker
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/com/elevate::icmluautil-iid-bytes
      - id: micro-behaviors/os/com/elevate::elevation-moniker
      - id: micro-behaviors/os/com/invoke::co-get-object
      - id: metadata/signed/trust-level::unsigned-missing-signature-record

  - id: icmluautil-source-uac-bypass
    desc: Native source activates ICMLuaUtil through elevation moniker
    crit: hostile
    conf: 0.98
    for: [c, cpp]
    all:
      - id: icmluautil-interface-name-source
      - id: micro-behaviors/os/com/elevate::elevation-moniker-source
      - id: micro-behaviors/os/com/invoke::co-get-object-output-pointer-source
    unless:
      - id: well-known/lib/network/wireguard::windows-module-import
      - id: well-known/lib/platform/wireguard/
