defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1548.002
composite_rules:
  # The ciphertext's particular key/moniker is deliberately not required.
  # This conservatively reports the concealed auto-elevation-interface code
  # profile; it does not assert that an arbitrary encrypted string names the
  # CMSTPLUA class or that elevation succeeds on the target machine.
  - id: concealed-icmluautil-shell-exec
    desc: Concealed strings with ICMLuaUtil call profile
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/com/invoke::icmluautil-shell-exec-code-profile
      - id: objectives/anti-static/obfuscation/string/encrypt::rc4-hex-string-concealment

  # The same profile in an unsigned binary: the interface identifier and the
  # local-server ShellExec vtable call are the working bypass, and the
  # encryption hides the elevation moniker from review. Signed software that
  # legitimately drives an auto-elevating interface does not need to conceal
  # it, and the hash-resolution CMSTPLUA composite next door requires the
  # same trust evidence.
  - id: unsigned-concealed-icmluautil-shell-exec
    desc: Unsigned binary conceals ICMLuaUtil ShellExec elevation
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/com/invoke::icmluautil-shell-exec-code-profile
      - id: objectives/anti-static/obfuscation/string/encrypt::rc4-hex-string-concealment
      - id: metadata/signed/trust-level::unsigned
    unless:
      - id: metadata/signed/platform::microsoft
