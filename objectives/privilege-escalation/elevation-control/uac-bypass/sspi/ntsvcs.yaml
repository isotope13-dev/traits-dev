# SSPI Datagram authentication against the SCM ntsvcs named pipe to obtain an
# elevated network token, then impersonate / create a service as LocalSystem.
# Used as a UAC elevation path when the process is already in Administrators
# but running at medium integrity (T1548.002).
#
# Distinct from the COM CMSTPLUA moniker route and from AppInfo RPC elevation:
# the artifact is Negotiate/NTLM SSPI with ISC_REQ_DATAGRAM plus a loopback
# open of \\127.0.0.1\Pipe\ntsvcs (or \\.\pipe\ntsvcs).
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, go, rust]
  attack: T1548.002

traits:
  - id: ntsvcs-scm-pipe-path
    desc: SCM ntsvcs named-pipe path
    crit: suspicious
    conf: 0.93
    if:
      type: text
      # Runtime and C-escaped forms of loopback / local ntsvcs SCM pipe.
      regex: '(?i)(\\\\|\\\\\\\\)(127\.0\.0\.1|\.)(\\|\\\\)[Pp]ipe(\\|\\\\)ntsvcs\b'

  # Call-site text in source. SDK headers declare the same names — excluded via
  # basename unless on the composite (and these atoms) rather than lookbehind.
  - id: sspi-acquire-creds-source
    desc: AcquireCredentialsHandle call in source
    crit: notable
    conf: 0.9
    for: [c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)\bAcquireCredentialsHandle[AW]?\s*\('
    unless:
      - id: metadata/lang/security::windows-sdk-security-header-declarations

  - id: sspi-init-context-source
    desc: InitializeSecurityContext call in source
    crit: notable
    conf: 0.9
    for: [c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)\bInitializeSecurityContext[AW]?\s*\('
    unless:
      - id: metadata/lang/security::windows-sdk-security-header-declarations

composite_rules:
  - id: sspi-datagram-client
    desc: SSPI Datagram client authentication
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/os/security/sspi::isc-req-datagram-flag
    any:
      - id: sspi-acquire-creds-source
      - id: sspi-init-context-source
      - id: micro-behaviors/os/security/sspi::sspi-acquire-credentials-handle
      - id: micro-behaviors/os/security/sspi::sspi-initialize-security-context
    unless:
      - id: metadata/lang/security::windows-sdk-security-header-declarations
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-binding-crate
      - id: well-known/lib/media/ffmpeg::ffmpeg-source-archive-path

  - id: sspi-ntsvcs-token-elevation
    desc: SSPI Datagram auth against ntsvcs for elevation
    crit: hostile
    conf: 0.98
    all:
      - id: ntsvcs-scm-pipe-path
      - id: sspi-datagram-client
    any:
      - id: micro-behaviors/os/privilege/token::impersonate-named-pipe-client
      - id: micro-behaviors/os/service/control::create-service
      - id: micro-behaviors/os/service/control::start-service
    unless:
      - id: metadata/lang/security::windows-sdk-security-header-declarations
