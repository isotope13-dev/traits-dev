# INF pre-setup commands and process termination alone are neutral operations.
# Their conjunction with an explicit UAC-disable command supplies bypass context.
defaults:
  platforms: [windows]
  for: [pe, dll, batch, powershell]
  attack: T1548.002

composite_rules:
  - id: cmstp-inf-presetup-bypass-kit
    desc: CMSTP installer executes pre-setup commands from a crafted INF
    crit: hostile
    conf: 0.95
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/package-manager/install::inf-presetup-commands-section
      - id: micro-behaviors/process/terminate/kill::taskkill-cmstp-process
      - id: micro-behaviors/os/security/policy::enablelua-zero-disable
    unless:
      - id: metadata/signed/platform/
