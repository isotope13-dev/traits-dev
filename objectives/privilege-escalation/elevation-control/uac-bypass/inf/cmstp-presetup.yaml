# INF-driven CMSTP elevation bypass. Unlike the COM-moniker variant in com/,
# this technique never touches the auto-elevate CLSID: it writes a crafted
# INF whose pre-setup section runs attacker commands, kills cmstp so the
# evil profile installs cleanly, and silences UAC policy. Corporate VPN
# provisioning never assembles all three at once.
defaults:
  platforms: [windows]
  for: [pe, dll, batch, powershell]
  attack: T1548.002

traits:
  - id: inf-presetup-commands-section
    desc: Setup INF pre-setup commands section
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)PreSetupCommandsSection|RunPreSetupCommands'

  - id: enablelua-zero-disable
    desc: UAC EnableLUA policy disabled to zero
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)EnableLUA.{0,60}?/d\s+0\b'

  - id: taskkill-cmstp-process
    desc: Taskkill targeting the CMSTP installer process
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\btaskkill\b[^\r\n]{0,40}\bcmstp(\.exe)?\b'

composite_rules:
  - id: cmstp-inf-presetup-bypass-kit
    desc: CMSTP installer executes pre-setup commands from a crafted INF
    crit: hostile
    conf: 0.95
    near_bytes: 8192
    all:
      - id: inf-presetup-commands-section
      - id: taskkill-cmstp-process
      - id: enablelua-zero-disable
    unless:
      - id: metadata/signed/platform/
