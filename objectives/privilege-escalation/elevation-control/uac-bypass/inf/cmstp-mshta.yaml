# CMSTP can run ordinary VPN installers. This requires the crafted profile
# template, a script-host shell launcher, and termination of the installer.
# Keep the existing EnableLUA-disable variant independently detectable.
defaults:
  platforms: [windows]
  for: [pe, dll, batch, powershell]
  attack: T1548.002,T1218.003
composite_rules:
  - id: cmstp-inf-mshta-shell-bypass
    desc: CMSTP INF shell launch with installer termination
    crit: hostile
    conf: 0.98
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/package-manager/install::inf-presetup-commands-section
      - id: micro-behaviors/os/registry/value-name::cmstp-profile-install-inf-reference
      - id: micro-behaviors/process/create/shell/script-host::mshta-vbscript-shell-run-command
      - id: micro-behaviors/process/terminate/kill::taskkill-cmstp-process
