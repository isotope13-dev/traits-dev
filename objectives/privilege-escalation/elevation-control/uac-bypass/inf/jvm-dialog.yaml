defaults:
  platforms: [windows]
  for: [class]
composite_rules:
  - id: jvm-cmstp-inf-dialog-bypass
    desc: CMSTP pre-setup execution with automated dialog confirmation
    crit: hostile
    conf: 0.99
    attack: T1548.002,T1218.003
    all:
      - id: micro-behaviors/os/package-manager/install::jvm-cmstp-autoinstall-command
      - id: metadata/lang/source/syntax/directive::jvm-inf-presetup-template
      - id: micro-behaviors/fs/write/file/full::jvm-files-writestring-bytecode
      - id: micro-behaviors/process/create/exec::java-runtime-exec-bytecode-reference
      - id: micro-behaviors/ui/window/message::jvm-sendmessage-reference
