# Windows Manifest Privilege Escalation
# ATT&CK: T1548.002 (Abuse Elevation Control Mechanism: UAC)
#
# Atomic manifest string traits in micro-behaviors/os/privilege/manifest/windows.yaml
# Composites detect suspicious use of manifest attributes combined with other indicators.
defaults:
  attack: T1548.002
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: unsigned-auto-elevate
    desc: Auto-elevation without trusted signature
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/build/manifest::auto-elevate
    unless:
      - id: metadata/vendor/string::microsoft-corp-marker-rsrc
      - id: metadata/vendor/string::microsoft-corp-marker-rdata
  - id: admin-manifest-network
    desc: Admin manifest with network activity
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/build/manifest::admin-manifest
      - id: micro-behaviors/communications/http/request/client::http-client
    downgrade:
      any:
        - id: metadata/vendor/string::microsoft-corp-marker-rsrc
        - id: metadata/binary/resource/identity::pe-version-resource
  # bin-sh (/bin/sh literal) is a POSIX-only signal -- every other
  # composite that references it targets Unix/native types (shell, elf,
  # macho, c). A Pe/dll admin manifest can never carry that string, so the
  # Windows-native shell indicator (cmd.exe / "cmd /c") is what this
  # composite actually needs.
  - id: admin-manifest-shell-no-version
    desc: Admin manifest with shell and no version info
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/build/manifest::admin-manifest
      - id: micro-behaviors/process/interpreter/shell::cmd-exe-reference
    unless:
      - id: metadata/binary/resource/identity::pe-version-resource
      - id: metadata/signature/verified/platform/

  # requireAdministrator on a magic-stripped UPX crypt stub is escalation
  # setup for the in-memory loader, not a normal installed helper.
  - id: admin-scrambled-upx-crypt-elevation
    desc: Admin elevation on magic-stripped UPX crypt loader
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/build/manifest::require-administrator
      - id: metadata/binary/layout/stub::upx-sections-without-early-magic
      - id: metadata/binary/section/entropy::large-rwx-upx1-section
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    unless:
      - id: metadata/binary/layout/stub::upx-early-magic
      - id: metadata/signature/verified/developer/

  # requireAdministrator on an ASPack-packed unsigned loader with sparse
  # imports and encrypted resources is escalation setup for the unpacked
  # payload, not a normal installed helper. Sibling of the UPX-crypt
  # composite above for the ASPack packer.
  - id: admin-aspack-packed-elevation
    desc: Admin elevation on ASPack-packed unsigned loader
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/build/manifest::require-administrator-level-attribute
      - id: metadata/build/protector::aspack-name-reference
      - id: micro-behaviors/dylib/lookup::sparse-pe-dynamic-linking
      - id: metadata/binary/resource/entropy::rsrc-entropy-at-least-66
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/installer/product/
