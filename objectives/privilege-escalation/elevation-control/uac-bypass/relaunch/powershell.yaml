defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1548.002,T1105,T1059.001
  mbc: F0015

composite_rules:
  # Downloading a script and running it elevated with the execution policy
  # bypassed is how both RMM installers and operator tasking deploy an agent.
  # The consent prompt and the plausible administrator use keep it below hostile.
  - id: powershell-download-script-elevated-policy-bypass
    desc: PowerShell downloads a script and runs it elevated, bypassing policy
    crit: suspicious
    conf: 0.9
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
      - id: micro-behaviors/os/privilege/elevation::powershell-start-process-runas
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-argument
