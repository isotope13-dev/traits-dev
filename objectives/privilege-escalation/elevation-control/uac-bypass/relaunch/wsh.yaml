# WSH script launches an elevated PowerShell process.
#
# A script-host dropper invokes PowerShell with `Start-Process ... -Verb RunAs`
# to trigger UAC elevation while hiding the window or bypassing policy.
defaults:
  platforms: [windows]
  for: [vbs, javascript]
  attack: T1548.002,T1059.001,T1059.005
  mbc: F0015

composite_rules:
  - id: wsh-elevated-powershell-runas-launch
    desc: WSH executes elevated PowerShell via Start-Process RunAs
    crit: hostile
    conf: 0.98
    # The elevated launch is one `Shell.Run` statement. A large Node bundle
    # that shows a consented UAC prompt in one module and has an unrelated
    # `shell.run "..."` string in another is not a WSH dropper.
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/privilege/elevation::powershell-start-process-runas
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-statement
    any:
      - id: micro-behaviors/process/create/flags::wscript-shell-hidden-run
      - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/argument/option::powershell-policy-bypass-argument
    unless:
      # vscode-vibrancy-continued's updater elevates a helper that copies its
      # own refreshed addon files into the VS Code install directory
      # (consented UAC prompt, user-facing errors, non-elevated relaunch).
      - id: well-known/tool/development/vscode-extension/vibrancy-continued::vibrancy-continued-extension-context
