# WSH script launches an elevated PowerShell process.
#
# A script-host dropper invokes PowerShell with `Start-Process ... -Verb RunAs`
# to trigger UAC elevation while hiding the window or bypassing policy.
defaults:
  platforms: [windows]
  for: [vbs, javascript]
  attack: T1548.002,T1059.001,T1059.005
  mbc: F0015

composite_rules:
  - id: wsh-elevated-powershell-runas-launch
    desc: WSH executes elevated PowerShell via Start-Process RunAs
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/privilege/elevation::powershell-start-process-runas
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-statement
    any:
      - id: micro-behaviors/process/create/hidden::wscript-shell-hidden-run
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-argument
