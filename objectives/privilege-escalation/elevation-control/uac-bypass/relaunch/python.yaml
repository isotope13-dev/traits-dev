defaults:
  platforms:
  - windows
  for:
  - python
  attack: T1548.002
  mbc: F0015

composite_rules:
  # A library that probes admin rights and, when absent, re-launches itself
  # elevated through ShellExecuteW runas. The consent prompt keeps this
  # below hostile: legitimate installers elevate the same way, but a
  # general-purpose library has no business re-launching the host elevated.
  - id: python-runas-elevated-relaunch
    desc: Python relaunches elevated after admin check
    crit: suspicious
    conf: 0.9
    near_lines: 50
    all:
      - id: micro-behaviors/os/privilege/check::ctypes-is-admin
      - id: micro-behaviors/os/privilege/elevation::python-ctypes-shell-execute-runas
