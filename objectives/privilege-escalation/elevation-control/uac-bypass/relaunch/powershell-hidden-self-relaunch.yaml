defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1548.002,T1564.003
  mbc: F0015

composite_rules:
  - id: powershell-hidden-console-self-elevation
    desc: PowerShell hides console and self-relaunches via hidden RunAs
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/evasion/process/hidden/console::powershell-hides-console-window
      - id: micro-behaviors/os/privilege/check::powershell-administrator-role-check
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
      - id: micro-behaviors/os/security/policy::powershell-policy-bypass-text
      - id: micro-behaviors/process/info/selfpath::powershell-script-path
    any:
      - id: objectives/privilege-escalation/elevation-control/prompt-loop::powershell-psi-verb-runas
      - id: micro-behaviors/os/privilege/elevation::powershell-start-process-runas
