# SYS010 shows a UAC prompt for PowerShell and, when it is declined, shows it
# again every three seconds up to 99 times until the user gives in. A loop
# around the elevation request that sleeps and swallows the refusal is that
# pressure tactic, not an installer asking once.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1548.002
  mbc: F0015

traits:
  - id: powershell-retry-loop-keyword
    desc: PowerShell loop construct
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?i)\b(while|for|do)\s*(\(|\{)'

  - id: powershell-sleep-between-attempts
    desc: PowerShell sleeps between attempts
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bStart-Sleep\b[^\r\n]{0,30}\d'

  - id: powershell-catch-refused-prompt
    desc: PowerShell catches a refused prompt
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bcatch\s*\{'

composite_rules:
  - id: powershell-elevation-prompt-retry-loop
    desc: PowerShell repeats a UAC prompt in a sleeping retry loop
    crit: suspicious
    conf: 0.85
    near_lines: 12
    all:
      - id: micro-behaviors/os/privilege/elevation::powershell-start-process-runas
      - id: powershell-retry-loop-keyword
      - id: powershell-sleep-between-attempts
      - id: powershell-catch-refused-prompt
