# Node.js application or packaged binary launches elevated PowerShell process.
defaults:
  platforms: [windows]
  for: [javascript, typescript, pe]
  attack: T1548.002,T1059.001
  mbc: F0015

composite_rules:
  - id: node-elevated-powershell-runas-launch
    desc: Node executes elevated process via PowerShell RunAs
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/spawn::node-spawn-powershell-process
      - id: micro-behaviors/os/privilege/elevation::node-powershell-start-process-runas
    unless:
      - id: "metadata/file/naming::test-directory-component"
