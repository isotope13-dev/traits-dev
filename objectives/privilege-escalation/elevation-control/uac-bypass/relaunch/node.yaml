# Node.js application or packaged binary asks for a UAC consent prompt.
# Start-Process -Verb RunAs shows the consent dialog; installers use it to
# launch msiexec and other setup programs. A bypass needs a separate technique.
defaults:
  platforms: [windows]
  for: [javascript, typescript, pe]
  attack: T1548,T1059.001
  mbc: F0015

composite_rules:
  - id: node-elevated-powershell-runas-launch
    desc: Node requests a UAC consent prompt through PowerShell RunAs
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/exec::node-powershell-launch
      - id: micro-behaviors/os/privilege/elevation::node-powershell-start-process-runas
    unless:
      - id: "metadata/file/naming::test-directory-component"
