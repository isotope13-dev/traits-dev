# .NET/C# elevation via Start-Process -Verb RunAs
# The single RunAs verb is an elevation prompt. Composites below add context
# before treating it as suspicious UAC abuse.
# ATT&CK: T1548.002 (Abuse Elevation Control: Bypass UAC)
defaults:
  for: [csharp, pe]
  platforms: [windows]
  attack: T1548.002
  crit: notable
  conf: 0.85

traits:
- id: uac-bypass-component-type
  desc: UAC-bypass component type name
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)\b(Cascading)?UacBypasser\b|\bShellExecuteRunasBypasser\b'
    section: .rdata

composite_rules:
- id: nativeaot-uac-bypass-loader
  for: [pe]
  desc: NativeAOT loader containing a UAC-bypass component and elevation flow
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/lang/compiler/aot::nativeaot-runtime-markers
  - id: uac-bypass-component-type
  any:
  - id: micro-behaviors/os/privilege/elevation::dotnet-shell-runas-text
  - id: micro-behaviors/os/privilege/elevation::administrator-check-with-consent-request
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/

- id: uac-consent-policy-gated-runas-relaunch
  for: [c, cpp]
  desc: Queries UAC policy before hidden runas relaunch
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/os/registry/keys/policy::uac-policies-system-key
  - id: micro-behaviors/os/registry/keys/policy::uac-consent-prompt-token
  - id: micro-behaviors/fs/path/self::null-handle-module-path-call
  - id: micro-behaviors/process/create/shellexec::shellexecute-runas-call
  - id: micro-behaviors/process/create/flags::sw-hide-token
