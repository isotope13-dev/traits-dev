# UAC Bypass via __COMPACT_LAYER Environment Variable
# Setting __COMPACT_LAYER=RunAsInvoker bypasses UAC elevation prompts
# ATT&CK: T1548.002 (Abuse Elevation Control Mechanism: Bypass User Account Control)
defaults:
  for: [pe, powershell, batch, vbs, python]
  platforms: [windows]
  attack: T1548.002
traits:
  - id: uac-bypass-compact-layer
    desc: UAC bypass via __COMPACT_LAYER=RunAsInvoker
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: "__COMPACT_LAYER=RunAsInvoker"
      case_insensitive: true

composite_rules:
  # Executes an executable command under the RunAsInvoker compatibility layer
  # to bypass UAC elevation prompts and run without administrator challenge.
  - id: compact-layer-uac-bypass-execution
    desc: Executes command under RunAsInvoker UAC bypass
    crit: hostile
    conf: 0.96
    for: [python]
    near_lines: 5
    all:
      - id: uac-bypass-compact-layer
      - id: micro-behaviors/process/create/launch::windows-start-command
