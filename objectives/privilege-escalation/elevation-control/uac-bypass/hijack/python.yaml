defaults:
  for: [python]
  platforms: [windows]
  crit: hostile
  conf: 0.98
  attack: T1548.002

composite_rules:
  - id: python-silentcleanup-windir-hijack
    desc: User windir write with SilentCleanup launch
    all:
      - id: micro-behaviors/os/registry/write::python-user-environment-create
      - id: micro-behaviors/os/registry/write::python-windir-value-write
      - id: micro-behaviors/os/autorun/scheduled::python-silentcleanup-task-launch
    near_lines: 4

  - id: python-sdclt-folder-command-hijack
    desc: User Folder command write with sdclt elevation
    all:
      - id: micro-behaviors/os/registry/write::python-user-folder-command-create
      - id: micro-behaviors/os/registry/manipulate::winreg-setvalue
      - id: micro-behaviors/os/privilege/elevation::sdclt-kickoff-elev-command
    near_lines: 4
