defaults:
  for: [python]
  platforms: [windows]
  crit: hostile
  conf: 0.98
  attack: T1548.002

composite_rules:
  - id: python-silentcleanup-windir-hijack
    desc: SilentCleanup windir command-hijack attempt
    all:
      - id: micro-behaviors/os/registry/write::python-user-environment-create
      - id: python-windir-shell-command-write
      - id: micro-behaviors/os/autorun/scheduled::python-silentcleanup-task-launch
    near_lines: 4

  - id: python-sdclt-folder-command-hijack
    desc: Folder command write with sdclt elevation attempt
    all:
      - id: python-folder-default-command-write
      - id: micro-behaviors/os/privilege/elevation::sdclt-kickoff-elev-command
    near_lines: 4
