defaults:
  platforms:
  - windows
  conf: 0.98
  attack: T1548.002
traits:
- id: powershell-piped-windir-shell-command-write
  desc: Piped windir write installs hidden PowerShell
  for: [powershell]
  crit: suspicious
  if:
    type: tree-sitter
    query: |
      (statement_list
        (pipeline (assignment_expression
          (left_assignment_expression) @key_binding
          value: (pipeline) @key_path))
        . (pipeline (assignment_expression
          (left_assignment_expression) @launcher_binding
          value: (pipeline) @launcher))
        . (if_statement
          (statement_block
            (statement_list
              (pipeline (pipeline_chain
                (command
                  command_name: (command_name) @create
                  command_elements: (command_elements
                    (array_literal_expression (unary_expression (variable) @key_target))))
                . (command
                  command_name: (command_name) @setter
                  command_elements: (command_elements
                    (command_parameter) @name_flag
                    . (command_argument_sep)
                    . (array_literal_expression (unary_expression (string_literal) @property))
                    . (command_argument_sep)
                    . (command_parameter) @value_flag
                    . (command_argument_sep)
                    . (array_literal_expression (unary_expression (variable) @value_target)))))))))
        (#eq? @key_binding @key_target)
        (#eq? @launcher_binding @value_target)
        (#match? @key_path "(?i)^['\"]HKCU:\\\\Environment['\"]$")
        (#match? @launcher "(?i)powershell[^\\n]{0,40}-w\\s+hidden\\b")
        (#match? @create "(?i)^New-Item$")
        (#match? @setter "(?i)^New-ItemProperty$")
        (#match? @name_flag "(?i)^-Name$")
        (#match? @property "(?i)^['\"]windir['\"]$")
        (#match? @value_flag "(?i)^-Value$")) @write
- id: python-windir-shell-command-write
  desc: windir setter adds shell command-tail syntax
  for:
  - python
  crit: suspicious
  if:
    type: tree-sitter
    query: |
      (call
        function: (attribute attribute: (identifier) @setter)
        arguments: (argument_list
          . (_)
          . (string) @name
          . (_)
          . (_)
          . (binary_operator operator: "+" right: (string) @tail))
        (#match? @setter "^SetValueEx$")
        (#match? @name "^['\"]windir['\"]$")
        (#match? @tail "(?i)[&|]\\s*rem\\b")
      ) @write
- id: powershell-windir-shell-command-write
  desc: Per-user windir setter adds shell command tail
  for:
  - powershell
  crit: suspicious
  if:
    type: tree-sitter
    query: |
      (command
        command_name: (command_name) @setter
        command_elements: (command_elements) @args
        (#match? @setter "(?i)^(Set|New)-ItemProperty$")
        (#match? @args "(?i)-Path\\s+['\"]HKCU:\\\\Environment['\"]")
        (#match? @args "(?i)-Name\\s+['\"]windir['\"]")
        (#match? @args "(?i)-Value\\s+['\"][^'\"\\r\\n]{0,120}[&|]\\s*rem\\b")
      ) @write
- id: python-folder-default-command-write
  desc: Writes default command through Folder key handle
  for:
  - python
  crit: suspicious
  if:
    type: tree-sitter
    query: |
      (with_statement
        (with_clause (with_item value: (as_pattern
          (call
            function: (attribute object: (identifier) @api attribute: (identifier) @create)
            arguments: (argument_list
              . (attribute object: (identifier) @hive_api attribute: (identifier) @hive)
              . (string) @path))
          alias: (as_pattern_target (identifier) @handle))))
        body: (block (expression_statement (call
          function: (attribute object: (identifier) @write_api attribute: (identifier) @setter)
          arguments: (argument_list . (identifier) @target . (string) @default))))
        (#match? @create "^CreateKey(Ex)?$")
        (#match? @hive "^HKEY_CURRENT_USER$")
        (#match? @path "^[rR]?['\"]Software\\\\Classes\\\\Folder\\\\shell\\\\open\\\\command['\"]$")
        (#match? @setter "^SetValueEx$")
        (#match? @default "^(''|\"\")$")
        (#eq? @api @hive_api)
        (#eq? @api @write_api)
        (#eq? @handle @target)) @write
