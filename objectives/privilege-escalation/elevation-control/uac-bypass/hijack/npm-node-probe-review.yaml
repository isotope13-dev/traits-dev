defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-install-windows-verdict-uac-beacon
    desc: UAC, task and verdict modification clues
    crit: hostile
    conf: 0.98
    attack: "T1195.002,T1548.002,T1565.001,T1041"
    all:
      - id: well-known/dual-use/tunnel/cloudflared::trycloudflare-domain
      - id: micro-behaviors/os/registry/association/reference::ms-settings-registry-key-reference
      - id: objectives/privilege-escalation/elevation-control/uac-bypass/hijack::delegateexecute-fodhelper-text-cooccurrence
      - id: micro-behaviors/os/autorun/task-principal::system-task-principal-webrequest-text
    any:
      - id: micro-behaviors/fs/write/file/unspecified::findings-verdict-write-clues
      - id: micro-behaviors/fs/path/reference::findings-xml-filename-reference
      - id: metadata/lang/source/naming/target::node-poisoned-verdict-marker
