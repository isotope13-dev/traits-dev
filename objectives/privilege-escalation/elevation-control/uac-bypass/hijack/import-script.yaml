# These are prepared hijacks. Import and an auto-elevated trigger are external.
defaults:
  for: [text, reg]
  platforms: [windows]
  attack: T1548.002

composite_rules:
  - id: reg-ms-settings-delegateexecute-hijack
    desc: Registry script prepares ms-settings DelegateExecute hijack
    crit: hostile
    conf: 0.99
    near_bytes: 512
    all:
      - id: micro-behaviors/os/registry/association/reference::reg-user-ms-settings-command-key
      - id: micro-behaviors/os/registry/association/write::reg-ms-settings-command-delegation

  - id: reg-mscfile-command-hijack
    desc: Registry script overrides per-user mscfile open command
    crit: suspicious
    conf: 0.98
    near_bytes: 512
    all:
      - id: micro-behaviors/os/registry/association/reference::reg-user-mscfile-command-key
      - id: micro-behaviors/os/registry/association/write::reg-mscfile-open-command
