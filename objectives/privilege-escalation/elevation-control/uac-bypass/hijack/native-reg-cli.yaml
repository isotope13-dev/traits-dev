defaults:
  for: [c, cpp]
  platforms: [windows]
  attack: T1548.002

composite_rules:
  - id: native-reg-computerdefaults-hijack
    desc: Native source configures class hijack and invokes ComputerDefaults
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/privilege-escalation/elevation-control/uac-bypass/hijack::source-uac-class-shell-open-command
      - id: micro-behaviors/os/registry/value/write::reg-exe-add-command
      - id: micro-behaviors/os/registry/value-name::delegateexecute-value-name
      - id: micro-behaviors/os/application/target/utility::computerdefaults-exe-reference
    near_lines: 15
