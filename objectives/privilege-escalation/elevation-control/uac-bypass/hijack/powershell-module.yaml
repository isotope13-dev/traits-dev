defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
composite_rules:
- id: powershell-uac-registry-override-module
  desc: UAC bypass module writes registry command or environment overrides
  crit: hostile
  all:
  - id: well-known/tool/offensive/powershell-empire::uac-bypass-module-functions
  - id: micro-behaviors/os/registry/write::powershell-registry-property-cmd
  - id: micro-behaviors/process/create/shell/interpreter::powershell-executable-token
