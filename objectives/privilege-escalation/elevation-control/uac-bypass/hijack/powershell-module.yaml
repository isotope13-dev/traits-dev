defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.98
  attack: T1548.002
composite_rules:
  - id: silentcleanup-windir-override
    desc: SilentCleanup task with a windir command override
    crit: hostile
    all:
      - id: micro-behaviors/os/registry/write::powershell-user-windir-write
      - id: micro-behaviors/data/property/write::powershell-set-item-property-call
      - id: micro-behaviors/os/autorun/scheduled::silentcleanup-task-invocation
    near_lines: 4

  - id: powershell-uac-registry-override-module
    desc: PowerShell overrides auto-elevation commands
    crit: hostile
    all:
      - id: micro-behaviors/os/registry/write::powershell-registry-property-cmd
      - id: micro-behaviors/data/property/write::powershell-set-item-property-call
      - id: micro-behaviors/fs/path/application/executable::powershell-executable-token
    any:
      - id: "micro-behaviors/os/registry/keys/execution::shell-association-command-path"
      - id: silentcleanup-windir-override
    needs: 1
