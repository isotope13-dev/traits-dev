defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.98
  attack: T1548.002
composite_rules:
  - id: powershell-uac-registry-override-module
    desc: PowerShell overrides auto-elevation commands
    crit: hostile
    all:
      - id: micro-behaviors/os/registry/write::powershell-registry-property-cmd
      - id: micro-behaviors/fs/path/application/executable::powershell-executable-token
    any:
      - id: micro-behaviors/os/registry/keys::per-user-msc-exe-shell-command-path
      - id: micro-behaviors/os/autorun/scheduled::silentcleanup-task-invocation
    needs: 1
