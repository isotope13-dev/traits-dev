defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.98
  attack: T1548.002
composite_rules:
  - id: silentcleanup-windir-override
    desc: SilentCleanup windir command-hijack attempt
    crit: hostile
    all:
      - id: powershell-windir-shell-command-write
      - id: micro-behaviors/os/autorun/scheduled::silentcleanup-task-invocation
    near_lines: 8

  - id: powershell-uac-registry-override-module
    desc: Overrides an auto-elevating command association
    crit: hostile
    all:
      - id: micro-behaviors/data/property/write::powershell-provider-property-command-text
      - id: micro-behaviors/data/property/write::powershell-set-item-property-call
      - id: micro-behaviors/fs/path/application/executable::powershell-executable-token
      - id: micro-behaviors/os/registry/keys/execution::shell-association-command-path
      - id: micro-behaviors/process/create/exec::start-process-call
    any:
      - id: micro-behaviors/fs/path/application/executable::eventvwr-exe-reference
      - id: micro-behaviors/fs/path/application/executable::sdclt-executable-reference
      - id: micro-behaviors/fs/path/system::fodhelper-exe-reference
    needs: 1
    near_lines: 80
