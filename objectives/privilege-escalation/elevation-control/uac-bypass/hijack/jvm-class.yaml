# UAC bypass shapes carried inside JVM class files. The Java side of these
# techniques is usually JNA-driven: registry edits arrive as reg argv
# arrays and auto-elevated helpers are spawned by name, so the classic
# command-text traits never see them. Each composite requires the full
# hijack shape - the rerouted association or the environment write next to
# the scheduled task - not the registry vocabulary alone.
defaults:
  platforms: [windows]
  for: [class]
  attack: T1548.002
composite_rules:
- id: jvm-silentcleanup-windir-hijack
  desc: JVM class hijacks SilentCleanup via per-user environment
  crit: suspicious
  conf: 0.9
  near_bytes: 300
  all:
  - id: micro-behaviors/os/autorun/control::jvm-silentcleanup-task-launch
  - id: micro-behaviors/os/registry/environment/reference::jvm-hkcu-environment-key-path
- id: jvm-ms-settings-delegateexecute-hijack
  desc: JVM class reroutes ms-settings open command
  crit: suspicious
  conf: 0.95
  near_bytes: 400
  # The rerouted Shell Open command key beside a DelegateExecute value
  # name is the fodhelper/computerdefaults auto-elevation hijack; the
  # class pool keeps both strings a few dozen bytes apart.
  all:
  - id: micro-behaviors/os/registry/association/reference::jvm-ms-settings-open-command-key
  - id: micro-behaviors/os/registry/association/reference::jvm-delegateexecute-value-name
