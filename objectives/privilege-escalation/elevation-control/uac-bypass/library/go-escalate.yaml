defaults:
  mbc: E1134
  attack: T1548.002
  platforms:
    - windows
    - linux
    - macos
traits:
  - id: go-escalate-import
    desc: lu4p/go-escalate privilege escalation library
    crit: suspicious
    conf: 0.95
    for:
      - go
    if:
      type: symbol
      kind: import
      regex: lu4p/go-escalate|go-escalate
  - id: go-escalate-string
    desc: go-escalate library string in binary
    crit: suspicious
    conf: 0.9
    for:
      - pe
    if:
      type: text
      regex: lu4p/go-escalate|escalate\.Elevate
  - id: go-escalate-dependency
    desc: go-escalate module dependency
    crit: notable
    conf: 0.9
    for: [go.mod]
    if:
      type: text
      substr: github.com/lu4p/go-escalate
  - id: is-elevated-call
    desc: Checks if running elevated (IsElevated)
    crit: suspicious
    conf: 0.8
    for:
      - go
    if:
      type: symbol
      kind: call
      exact: IsElevated
  - id: check-elevate-call
    desc: Calls CheckElevate before escalating
    crit: suspicious
    conf: 0.8
    for:
      - go
    if:
      type: symbol
      kind: call
      exact: CheckElevate
  - id: check-elevate-string
    desc: CheckElevate escalation string
    crit: suspicious
    conf: 0.75
    for:
      - pe
    if:
      type: text
      word: CheckElevate
  - id: elevate-call
    desc: Elevates via escalate.Escalate
    crit: suspicious
    conf: 0.9
    for:
      - go
    if:
      type: symbol
      kind: call
      exact: escalate.Escalate
  - id: elevate-call-bare
    desc: Calls Elevate to gain privileges
    crit: suspicious
    conf: 0.85
    for:
      - go
    if:
      type: symbol
      kind: call
      exact: Elevate
composite_rules:
  - id: escalate-library
    desc: Privilege escalation library
    crit: suspicious
    conf: 0.9
    for: [go, pe]
    any:
      - id: go-escalate-import
      - id: go-escalate-string
  - id: is-elevated-check
    desc: Elevation check operations
    crit: suspicious
    conf: 0.8
    any:
      - id: is-elevated-call
      - id: check-elevate-call
  - id: escalate-operations
    desc: Escalation operations
    crit: suspicious
    conf: 0.85
    any:
      - id: is-elevated-check
      - id: elevate-call
      - id: elevate-call-bare
  - id: uac-bypass-string
    desc: Auto-elevated Windows utility references
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/os/application/target/utility::fodhelper-go-name
      - id: micro-behaviors/os/application/target/utility::eventvwr-go-or-pe-name
  # Utility names alone do not establish a bypass. The bypass composite also
  # requires the escalation library and its elevation operations.
  - id: privilege-escalation
    desc: Privilege escalation attempt
    crit: suspicious
    conf: 0.9
    all:
      - id: escalate-library
    any:
      - id: escalate-operations
      - id: micro-behaviors/os/privilege/elevation::sudo-exec
  - id: uac-bypass
    desc: UAC bypass technique
    crit: suspicious
    conf: 0.95
    all:
      - id: uac-bypass-string
      - id: escalate-operations
      - id: escalate-library
