defaults:
  platforms:
  - windows
  for:
  - pe
  - python
  - c
  - csharp
  attack: T1559
  crit: suspicious
composite_rules:
- id: process-execution-request
  desc: Named-pipe client requests process execution
  conf: 0.94
  all:
  - id: metadata/lang/source/literal/string/label::process-execution-request-token
  any:
  - id: micro-behaviors/communications/ipc/named-pipe::dotnet-named-pipe-client-stream
  - id: micro-behaviors/communications/ipc/named-pipe::pywin32-named-pipe-client
  - id: micro-behaviors/communications/ipc/named-pipe::wait-named-pipe
  needs: 1
  near_bytes: 4096
- id: registry-write-request
  desc: Named-pipe client requests registry write
  conf: 0.95
  attack: T1559,T1112
  all:
  - id: metadata/lang/source/literal/string/label::registry-write-request-token
  any:
  - id: micro-behaviors/communications/ipc/named-pipe::dotnet-named-pipe-client-stream
  - id: micro-behaviors/communications/ipc/named-pipe::pywin32-named-pipe-client
  - id: micro-behaviors/communications/ipc/named-pipe::wait-named-pipe
  needs: 1
  near_bytes: 4096
