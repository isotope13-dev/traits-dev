defaults:
  platforms: [windows]
  for: [scripts, binaries, source]
  attack: T1559

composite_rules:
  - id: process-execution-request
    desc: Named-pipe client requests process execution
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/process/create/command-handler::process-execution-request-token
    any:
      - id: micro-behaviors/communications/ipc/named-pipe::dotnet-named-pipe-client-stream
      - id: micro-behaviors/communications/ipc/named-pipe::pywin32-named-pipe-client
      - id: micro-behaviors/communications/ipc/named-pipe::wait-named-pipe
    needs: 1
    near_bytes: 4096

  - id: file-write-request
    desc: Named-pipe client requests file write
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/fs/file/write/direct::file-write-request-token
    any:
      - id: micro-behaviors/communications/ipc/named-pipe::dotnet-named-pipe-client-stream
      - id: micro-behaviors/communications/ipc/named-pipe::pywin32-named-pipe-client
      - id: micro-behaviors/communications/ipc/named-pipe::wait-named-pipe
    needs: 1
    near_bytes: 4096

  - id: registry-write-request
    desc: Named-pipe client requests registry write
    crit: suspicious
    conf: 0.95
    attack: T1559,T1112
    all:
      - id: micro-behaviors/os/registry/manipulate::registry-write-request-token
    any:
      - id: micro-behaviors/communications/ipc/named-pipe::dotnet-named-pipe-client-stream
      - id: micro-behaviors/communications/ipc/named-pipe::pywin32-named-pipe-client
      - id: micro-behaviors/communications/ipc/named-pipe::wait-named-pipe
    needs: 1
    near_bytes: 4096

  - id: backdoor-admin-account-request
    desc: Named-pipe request creates backdoor administrator account
    crit: hostile
    conf: 0.99
    attack: T1559,T1136.001,T1098
    all:
      - id: objectives/persistence/login/account/create::backdoor-admin-account
    any:
      - id: micro-behaviors/communications/ipc/named-pipe::dotnet-named-pipe-client-stream
      - id: micro-behaviors/communications/ipc/named-pipe::pywin32-named-pipe-client
      - id: micro-behaviors/communications/ipc/named-pipe::wait-named-pipe
    needs: 1
    near_bytes: 4096
