# Veeam Agent exposes an elevated client session identifier in a readable log.
# An unprivileged client can replay that identifier over the local gRPC named
# pipe and then redirect the service's DISM command path to a shell. The atoms
# remain neutral product/API facts; these combinations identify the exploit.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, powershell, python, go, rust]
  attack: T1068
  mbc: E1055

composite_rules:
  - id: logged-privileged-session-replay
    desc: Replays a logged elevated session over the Veeam service pipe
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/log/system::veeam-endpoint-service-log-path
      - id: micro-behaviors/os/security/auth/session::veeam-elevated-client-log-event
      - id: micro-behaviors/os/security/auth/session::veeam-caller-session-metadata-field
      - id: micro-behaviors/communications/ipc/named-pipe::veeam-agent-service-connection-pipe
    near_bytes: 8192
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/

  - id: endpoint-dism-shell-path-hijack
    desc: Redirects Veeam's privileged DISM command handler to a shell
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/security/auth/session::veeam-caller-session-metadata-field
      - id: micro-behaviors/process/create/command-handler::veeam-endpoint-management-service
      - id: micro-behaviors/process/create/command-handler::veeam-dism-path-option
      - id: micro-behaviors/process/create/command-handler::veeam-run-dism-command-call
    any:
      - id: micro-behaviors/process/create/exec::cmd-exe-reference
      - id: micro-behaviors/process/create/exec::powershell-exe-reference
    needs: 1
    near_bytes: 4096
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
