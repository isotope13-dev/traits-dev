defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
composite_rules:
- id: powershell-system-pipe-impersonation
  desc: SYSTEM elevation module invokes named-pipe client impersonation
  crit: hostile
  all:
  - id: well-known/tool/offensive/powershell-empire::elevation-module-functions
  - id: micro-behaviors/os/privilege/token::powershell-pipe-impersonation-delegate
  - id: micro-behaviors/os/privilege/check::localsystem-account-name
