defaults:
  platforms:
    - windows
  crit: suspicious
  conf: 0.9
  for: [pe, dll]
traits:
  - id: lsass-pipe-name
    desc: LSASS named pipe path
    crit: component
    if:
      type: text
      regex: \\pipe\\lsass
    unless:
      - type: symbol
        exact: LsaIImpersonateClient
composite_rules:
  - id: system-pipe-lsass
    desc: Impersonating LSASS named pipe
    all:
      - id: lsass-pipe-name
    any:
      - id: micro-behaviors/communications/ipc/named-pipe::create-named-pipe
      - id: micro-behaviors/os/privilege/token::impersonate-named-pipe-client
  - id: system-service-pipe-impersonation
    desc: Impersonates a client of a Windows service RPC pipe
    all:
      - id: micro-behaviors/communications/ipc/named-pipe::windows-service-rpc-pipe-path
      - id: micro-behaviors/os/privilege/token::impersonate-named-pipe-client
    unless:
      - id: well-known/app/system/reactos::system-component
