defaults:
  for:
    - "pe"
  platforms:
    - "windows"
  arch:
    - "x86"
composite_rules:
  - id: "caller-directed-ssdt-replacement-interface"
    desc: "Exposes caller-directed syscall replacement"
    crit: "hostile"
    conf: 0.96
    attack: "T1068,T1014"
    all:
      - id: "micro-behaviors/os/kernel/syscall::x86-ssdt-pointer-write-protected-window"
      - id: "micro-behaviors/os/kernel/device::create-device-object"
      - id: "micro-behaviors/os/kernel/device::create-device-symbolic-link"
