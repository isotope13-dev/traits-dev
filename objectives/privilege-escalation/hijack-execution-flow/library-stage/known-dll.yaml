defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: known-dll-alias-protected-process-hijack
    desc: KnownDlls aliasing targets protected-process library loading
    crit: hostile
    conf: 0.97
    attack: T1574.001
    all:
      - id: micro-behaviors/os/module/lookup::known-dlls-object-path
      - id: micro-behaviors/os/kernel/control::define-dos-device-import
      - id: micro-behaviors/os/kernel/control::object-manager-symbolic-link-api
      - id: micro-behaviors/process/create/exec::create-process-as-user
      - id: micro-behaviors/os/security/policy::process-protection-terminology
