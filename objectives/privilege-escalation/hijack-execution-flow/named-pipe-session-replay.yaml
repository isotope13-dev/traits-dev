defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  - c
  - cpp
  - csharp
  - powershell
  - python
  - go
  - rust
  attack: T1068
  mbc: E1055
  crit: hostile
  conf: 0.99
composite_rules:
- id: logged-privileged-session-replay
  desc: Replays a logged elevated session over the Veeam service pipe
  all:
  - id: micro-behaviors/fs/path/log/system::veeam-endpoint-service-log-path
  - id: micro-behaviors/os/security/auth/session::veeam-caller-session-metadata-field
  - id: micro-behaviors/communications/ipc/named-pipe::veeam-agent-service-connection-pipe
  near_bytes: 8192
  unless:
  - id: metadata/signature/verified/developer/
- id: endpoint-dism-shell-path-hijack
  desc: Session-aware DISM and shell path clues
  crit: suspicious
  all:
  - id: micro-behaviors/os/security/auth/session::veeam-caller-session-metadata-field
  - id: metadata/lang/source/naming/interface/runtime::endpoint-management-service-interface
  - id: metadata/lang/source/literal/string/property::dism-path-option
  - id: metadata/lang/source/naming/function/command::run-dism-command-call
  any:
  - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
  - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
  needs: 1
  near_bytes: 4096
  unless:
  - id: metadata/signature/verified/developer/
