defaults:
  platforms:
  - windows
  for:
  - pyc
  attack: T1134.001
traits:
- id: pyc-winlogon-token-impersonation-evidence
  desc: Bytecode winlogon token impersonation
  crit: suspicious
  conf: 0.97
  if:
    type: yara
    source: "rule pyc_winlogon_token_impersonation {\n  strings:\n    $target = \"winlogon.exe\"\n    $token = \"OpenProcessToken\"\n    $duplicate = \"DuplicateTokenEx\"\
      \n    $impersonate = \"ImpersonateLoggedOnUser\"\n  condition:\n    all of them and\n    for any i in (1..#target): (\n      for any j in (1..#duplicate): (\n\
      \        @duplicate[j] > @target[i] and @duplicate[j] - @target[i] < 4096 and\n        for any k in (1..#impersonate): (\n          @impersonate[k] > @duplicate[j]\
      \ and @impersonate[k] - @duplicate[j] < 256\n        )\n      )\n    )\n}\n"
composite_rules:
- id: pyc-winlogon-token-impersonation
  desc: Bytecode winlogon token impersonation
  crit: hostile
  conf: 0.97
  all:
  - id: pyc-winlogon-token-impersonation-evidence
  - id: micro-behaviors/process/enumerate/snapshot::pyc-snapshot-process-open-profile
