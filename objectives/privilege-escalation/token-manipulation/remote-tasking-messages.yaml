# Remote privilege-escalation tasking interface names. Implants expose
# Windows token manipulation and get-system operations as tasked request
# messages (MakeTokenReq, ImpersonateReq, RevToSelf, InvokeGetSystemReq).
# The matched evidence is tasking vocabulary in the artifact, not an
# executed privilege change; consumers must supply the agent context.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries, go]
  crit: suspicious
  conf: 0.8
traits:
  - id: remote-token-impersonation-tasking-names
    desc: Token-impersonation tasking message names
    if:
      type: text
      regex: '\b(MakeToken|Impersonate|RevToSelf|RevertToSelf)(Req|Request|Cmd|Task|Command|Message)s?\b'
  - id: remote-get-system-tasking-names
    desc: Get-system tasking message names
    if:
      type: text
      regex: '\b(Invoke)?GetSystem(Req|Request|Cmd|Task|Command|Shell)s?\b'
