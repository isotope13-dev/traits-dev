defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-ransomware-token-relaunch
    desc: Ransom encryptor with token duplication and user-process launch APIs
    crit: hostile
    conf: 0.96
    attack: T1134.002
    all:
      - id: objectives/impact/ransom/encrypt/bulk-encryption::managed-ransom-stream-replacement
      - id: micro-behaviors/os/privilege/token/use::open-process-token
      - id: micro-behaviors/os/privilege/token/use::duplicate-token-ex
      - id: metadata/binary/symbols/name/process::create-process-as-user
      - id: micro-behaviors/process/info/selfpath::managed-executable-path-getter
