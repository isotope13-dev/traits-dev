defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-stealer-lsass-system-token-profile
    desc: Go stealer with LSASS token impersonation
    crit: hostile
    conf: 0.97
    attack: T1134.001
    # Binary function/call recovery is capped before late main routines in
    # large Go images. Retain the call matcher and admit a token-duplication
    # code profile with target/API and theft context.
    all:
      - id: objectives/credential-access/browser/chromium::go-browser-login-query-with-keylogging
      - id: micro-behaviors/process/info/name::lsass-target-token
      - id: micro-behaviors/os/privilege/token::open-process-token
      - id: micro-behaviors/os/privilege/token::duplicate-token-ex
    any:
      - id: micro-behaviors/os/privilege/token::go-system-impersonation-call
      - id: lsass-token-duplication-impersonation-profile
