defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
composite_rules:
- id: powershell-credential-token-impersonation
  desc: Credential-abuse module duplicates and impersonates Windows tokens
  crit: hostile
  all:
  - id: well-known/tool/offensive/powershell-empire::credential-abuse-module-functions
  - id: micro-behaviors/os/privilege/token::duplicate-token-ex-source
  - id: micro-behaviors/os/privilege/token::impersonate-logged-on-user-source

- id: powershell-lsass-token-impersonation
  desc: LSASS token access and impersonation code
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/process/enumerate/shell::powershell-get-process-lsass
  - id: micro-behaviors/os/privilege/token::open-process-token-source
  - id: micro-behaviors/os/privilege/token::impersonate-logged-on-user-source
