# A native launcher that accepts an operator-supplied command and runs it
# through CreateProcessWithLogonW with alternate credentials.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1134.002

composite_rules:
  - id: alternate-logon-command-launch
    desc: Command launcher runs with alternate credentials
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/launch::create-process-with-logon
      - id: micro-behaviors/process/info/commandline::get-command-line
      - id: micro-behaviors/process/create/launch::direct-create-process-with-logon-call

  - id: unsigned-alternate-logon-command-launch
    desc: Unsigned alternate-logon command launcher
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/launch::create-process-with-logon
      - id: micro-behaviors/process/info/commandline::get-command-line
      - id: micro-behaviors/process/create/launch::direct-create-process-with-logon-call
      - id: metadata/binary/layout::pe-no-signature-record
