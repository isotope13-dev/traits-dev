defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: hostile
  conf: 0.97
composite_rules:
  # A service or SYSTEM process steals the logged-on user's session token
  # (session id -> user token -> duplicated token) and launches a process
  # with it. Every API in the chain is resolved from an XOR-obfuscated
  # table, and the binary is unsigned: ordinary service launchers import
  # these APIs in the clear and carry a signature.
  - id: xor-obfuscated-session-token-launch
    desc: XOR-obfuscated session token theft launches process as logged-on user
    attack: T1134.001,T1027.002
    all:
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-wts-console-session-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-wts-session-token-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-duplicate-token-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-createprocess-api
      - id: objectives/anti-static/obfuscation/decoders::xor-encoded-api-table
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
