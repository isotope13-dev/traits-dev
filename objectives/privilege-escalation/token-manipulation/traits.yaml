defaults:
  for:
  - pe
  - dll
  - rust
  platforms:
  - windows
traits:
- id: urlmon-dll-basename
  desc: URLMon DLL filename
  crit: notable
  conf: 0.95
  if:
    type: path
    basename: true
    exact: urlmon.dll
- id: token-impersonation-module-source
  desc: Token impersonation command module in source
  crit: notable
  conf: 0.95
  for: [c, cpp]
  if:
    type: text
    substr: token manipulation and impersonation
- id: token-vault-steal-command-source
  desc: Token vault steal or impersonate command
  crit: notable
  conf: 0.94
  attack: T1134.001
  for: [c, cpp]
  if:
    type: text
    regex: steal token from specified process|impersonate stolen token
- id: token-credential-logon-command-source
  desc: Token creation from user credentials
  crit: notable
  conf: 0.94
  attack: T1134.003
  for: [c, cpp]
  if:
    type: text
    regex: make token from user credentials|LOGON_NEW_CREDENTIALS
- id: token-privilege-command-source
  desc: Token privilege enable or enumeration command
  crit: notable
  conf: 0.9
  attack: T1134
  for: [c, cpp]
  if:
    type: text
    regex: list all privileges from current token|enable a privilege
- id: kerberos-ticket-command-source
  desc: Kerberos ticket abuse command set in source
  crit: notable
  conf: 0.94
  attack: T1550.003
  for: [c, cpp]
  if:
    type: text
    regex: list Kerberos tickets|purge a Kerberos ticket|import Kerberos ticket into a logon session
composite_rules:
- id: debug-privilege-browser-process-stager
  desc: Enables debug privilege and opens encoded browser targets for staging
  crit: hostile
  conf: 0.99
  attack: T1134,T1057
  for: [pe, dll]
  all:
  - id: micro-behaviors/os/privilege/token::rtl-enable-debug-privilege-x64
  - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-symbol
  - id: micro-behaviors/process/attach/rights::open-process
  - id: objectives/anti-static/obfuscation/string/conceal::db-substitution-browser-target-set
  - id: metadata/binary/header/characteristics::pe-dll-characteristics
  any:
  - id: micro-behaviors/fs/memory/mmap::create-file-mapping-w
  - id: micro-behaviors/process/create/spawn::create-process-w
  needs: 2
  unless:
  - id: metadata/signed/platform/
- id: token-adjustment-benign-tool-context
  desc: Recognized admin or utility tool context
  crit: exception
  conf: 0.95
  any:
  - id: well-known/tool/sysadmin/
  - id: well-known/app/system/iobit/
  - id: well-known/app/utility/ccleaner::ccleaner-icarus-sfx-context
- id: privilege-launch-utility-vendor-markers
  desc: Recognized utility vendor identity
  crit: notable
  conf: 0.95
  any:
  - id: well-known/app/utility/sordum/
  - id: well-known/app/utility/360-file-guard/
- id: packed-anti-debug-token-adjustment
  desc: Packed PE adjusts token privileges while performing anti-debug loader setup
  crit: hostile
  conf: 0.97
  attack: T1134.001,T1027,T1622
  for: [pe, dll]
  all:
  - id: micro-behaviors/os/privilege/token::lookup-privilege-value-any
  - id: micro-behaviors/os/privilege/token::adjust-token-privileges-any
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: micro-behaviors/mem/protect/modify::allocation-protection-opaque-image
  - id: objectives/anti-static/obfuscation/payload/section/layout::large-high-entropy-gfx-section
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/sysadmin/

- id: anti-analysis-token-manipulation-suite
  desc: Elevated anti-analysis token manipulation suite
  crit: hostile
  conf: 0.98
  attack: T1134,T1622
  for: [pe, dll]
  all:
  - id: micro-behaviors/os/privilege/token::duplicate-token-ex
  - id: micro-behaviors/os/privilege/token::high-risk-privilege-name
  - id: micro-behaviors/os/privilege/manifest::require-administrator
  - id: objectives/anti-analysis/sandbox-detect/suite::named-native-anti-analysis-check-cluster

- id: runas-verb
  desc: ShellExecute or Start-Process runas elevation
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/os/privilege/elevation::runas-string
  any:
  - id: micro-behaviors/process/create/shellexec::lpverb-field
  - id: micro-behaviors/process/create/shellexec::shell-execute-call
  - id: micro-behaviors/process/create/shellexec::shell-executeex-call
  - id: micro-behaviors/process/create/start-process::start-process-call
  unless:
  - id: metadata/binary/symbols/count::many-exports-100
- id: rust-token-privilege-adjustment
  desc: Rust token privilege adjustment chain
  crit: notable
  conf: 0.9
  attack: T1134.001
  for: [rust]
  all:
  - id: micro-behaviors/os/privilege/token::high-risk-privilege-name
  - id: micro-behaviors/os/privilege/token::open-process-token-source
  - id: micro-behaviors/os/privilege/token::lookup-privilege-value-source
  - id: micro-behaviors/os/privilege/token::adjust-token-privileges-source
- id: privilege-adjustment-indicator
  desc: Token privilege adjustment indicator
  crit: component
  conf: 0.82
  unless:
  - id: metadata/binary/symbols/count::many-exports-100
  any:
  - id: micro-behaviors/os/privilege/token::lookup-privilege-value-any
  - id: micro-behaviors/os/privilege/token::adjust-token-privileges-any
  - id: micro-behaviors/os/privilege/token::rtl-adjust-privilege
  - id: runas-verb
- id: direct-ntdll-privilege-adjustment
  desc: Direct ntdll privilege adjustment
  crit: suspicious
  conf: 0.9
  attack: T1134.001
  for: [pe, dll]
  all:
  - id: micro-behaviors/os/privilege/token::rtl-adjust-privilege
  - id: micro-behaviors/os/syscall/invoke::ntdll-import
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: metadata/binary/vendor::microsoft-corp-versioninfo
  unless:
  - id: metadata/binary/symbols/count::many-exports-100
  - id: well-known/tool/sysadmin/chroot-win/
  - id: well-known/app/system/reactos::system-component
  # IObit Advanced SystemCare's boot-time RegistryDefrag helpers adjust
  # shutdown privileges to do their documented job; the verified vendor
  # identity marks the known-benign suite.
  - id: well-known/app/system/iobit::iobit-signed-component-context
- id: token-spawn-api-chain-binary
  desc: User-token process spawn chain (binary)
  crit: notable
  conf: 0.84
  attack: T1134
  for: [pe, dll]
  unless:
  - id: metadata/binary/symbols/count::many-exports-100
  all:
  - id: micro-behaviors/os/privilege/token::open-process-token
  - id: micro-behaviors/os/privilege/token::duplicate-token-ex
  - id: micro-behaviors/process/create/sudo::create-process-with-token
- id: token-spawn-api-chain-source
  desc: User-token process spawn chain (Rust source)
  crit: notable
  conf: 0.84
  attack: T1134
  for: [rust]
  unless:
  - id: metadata/binary/symbols/count::many-exports-100
  all:
  - id: micro-behaviors/os/privilege/token::open-process-token-source
  - id: micro-behaviors/os/privilege/token::duplicate-token-ex-source
  - id: micro-behaviors/process/create/sudo::create-process-with-token-source
# open-process-token-source/duplicate-token-ex-source/create-process-with-token-source
# are Rust-source-only (for: [rust]); the compiled-binary chain needs the
# symbol/text siblings instead (open-process-token, duplicate-token-ex,
# create-process-with-token, all for: [pe, dll]). Split by type, like
# duplicate-token-any and open-process-token-any already do a leg at a time.
- id: token-spawn-api-chain
  desc: User-token process spawn chain
  crit: notable
  conf: 0.84
  attack: T1134
  any:
  - id: token-spawn-api-chain-binary
  - id: token-spawn-api-chain-source
- id: source-token-impersonation-suite
  desc: Source code implements stolen-token impersonation
  crit: suspicious
  conf: 0.95
  attack: T1134
  for: [c, cpp]
  all:
  - id: token-impersonation-module-source
  any:
  - id: token-vault-steal-command-source
  - id: token-credential-logon-command-source
  - id: token-privilege-command-source
  needs: 2
- id: mimikatz-driver-native-token-duplication
  desc: Mimikatz driver duplicates process tokens
  crit: hostile
  conf: 0.99
  attack: T1134
  mbc: E1134
  for: [pe, dll]
  all:
  - id: well-known/tool/offensive/mimikatz::mimidrv-driver-identity
  - id: micro-behaviors/os/privilege/token::native-duplicate-token
  - id: micro-behaviors/process/attach/address-space::lookup-process-by-id
- id: source-token-and-kerberos-abuse-suite
  desc: Source code combines token abuse with Kerberos ticket actions
  crit: hostile
  conf: 0.97
  attack: T1134
  for: [c, cpp]
  all:
  - id: source-token-impersonation-suite
  - id: kerberos-ticket-command-source
- id: token-spawn-privilege-adjust
  desc: Token spawn with privilege manipulation
  crit: notable
  conf: 0.9
  attack: T1134
  all:
  - id: token-spawn-api-chain
  - id: privilege-adjustment-indicator
  - id: micro-behaviors/os/privilege/token::high-risk-privilege-name
  downgrade:
    any:
    - id: metadata/package/license
    - id: metadata/signed/platform/
    - id: metadata/lang/compiled::autoit-compiled-script
- id: interactive-user-token-spawn-cluster
  desc: Interactive user token spawn cluster
  crit: suspicious
  conf: 0.93
  attack: T1134
  for: [pe, dll]
  all:
  - id: micro-behaviors/process/create/sudo::create-process-with-token
  - id: micro-behaviors/os/env/block::create-environment-block
  - id: privilege-adjustment-indicator
  any:
  - id: micro-behaviors/os/env/block::destroy-environment-block
  - id: micro-behaviors/os/privilege/token::open-thread-token-any
  - id: micro-behaviors/os/privilege/token::get-token-information-any
  downgrade:
    any:
    - id: metadata/signed/platform::microsoft
    - id: metadata/lang/compiled::autoit-compiled-script
  unless:
  - id: micro-behaviors/os/privilege/token::query-session-user-token
  - id: metadata/signed/unknown::opera-norway-as
  - id: metadata/signed/unknown::google-llc
  - id: metadata/signed/unknown::adobe-inc.
  - id: well-known/tool/browser/
- id: system-token-theft-winlogon
  desc: SYSTEM token theft via winlogon
  crit: hostile
  conf: 0.97
  attack: T1134
  all:
  - id: token-spawn-api-chain
  - id: objectives/evasion/masquerade/process/name::winlogon-name
  - id: micro-behaviors/os/privilege/token::high-risk-privilege-name
  any:
  - id: micro-behaviors/os/privilege/token::token-privilege-adjustment-references
  - id: rust-token-privilege-adjustment
  needs: 1
  unless:
  - id: well-known/tool/sysadmin/sysinternals::process-explorer-build-identity
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: metadata/binary/vendor::microsoft-corp-versioninfo
- id: system-token-theft-lsass
  desc: Steals and impersonates a LocalSystem token obtained from LSASS
  crit: hostile
  conf: 0.98
  attack: T1134.001
  for: [pe, dll]
  all:
  - id: micro-behaviors/process/enumerate/wts::wts-enumerate-processes
  - id: micro-behaviors/process/info/name::lsass-executable-reference
  - id: micro-behaviors/os/privilege/token::open-process-token-any
  - id: micro-behaviors/os/privilege/token::duplicate-token-ex
  - id: micro-behaviors/os/privilege/token::high-risk-privilege-name
  any:
  - id: micro-behaviors/os/privilege/token::set-thread-token
  - id: micro-behaviors/process/create/sudo::create-process-as-user
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: token-adjustment-benign-tool-context

- id: source-system-token-impersonation
  desc: Steals and impersonates a token from a privileged Windows process
  crit: hostile
  conf: 0.98
  attack: T1134.001
  for: [csharp, powershell, python]
  all:
  - id: micro-behaviors/process/enumerate/managed::privileged-process-lookup-by-name
  - id: micro-behaviors/os/privilege/token::open-process-token-source
  - id: micro-behaviors/os/privilege/token::duplicate-token-ex-source
  - id: micro-behaviors/os/privilege/token::impersonate-logged-on-user-source
  unless:
  - id: well-known/tool/sysadmin/sysinternals::process-explorer-build-identity

- id: driver-backed-token-privilege-escalation
  desc: Driver-backed token privilege escalation
  crit: hostile
  conf: 0.98
  attack: T1134
  for: [pe, dll]
  all:
  - id: micro-behaviors/os/privilege/token::open-process-token-any
  - id: micro-behaviors/os/privilege/token::lookup-privilege-value-any
  - id: micro-behaviors/os/privilege/token::adjust-token-privileges-any
  - id: micro-behaviors/fs/file/handle::device-io-control-win
  - id: metadata/binary/layout/overlay::low-entropy-large-overlay
  any:
  - id: objectives/evasion/anti-av/driver::antivirus-process-enumeration-routine
  - id: micro-behaviors/os/privilege/check::is-elevated-property
  needs: 1
