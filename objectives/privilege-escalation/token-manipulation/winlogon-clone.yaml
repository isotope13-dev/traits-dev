defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: winlogon-system-token-clone-call
  desc: Clones Winlogon with a SYSTEM token
  if:
    type: text
    substr: Create-SuspendedWinLogon -hToken $SystemTokenInfo.hProcToken
composite_rules:
- id: powershell-system-winlogon-cloning
  desc: Clones Winlogon for injected credential logon
  crit: hostile
  all:
  - id: winlogon-system-token-clone-call
  - id: objectives/execution/payload/process-inject/remote-thread::winlogon-credential-logon-injection
  - id: micro-behaviors/os/privilege/token/use::duplicate-token-ex-source
