defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: winlogon-system-token-clone-call
  desc: Clones Winlogon with a SYSTEM token
  if:
    type: text
    substr: Create-SuspendedWinLogon -hToken $SystemTokenInfo.hProcToken
composite_rules:
- id: powershell-system-winlogon-cloning
  desc: Clones Winlogon for injected credential logon
  crit: hostile
  all:
  - id: winlogon-system-token-clone-call
  - id: objectives/execution/payload/process-inject/remote-thread::winlogon-credential-logon-injection
  - id: micro-behaviors/os/privilege/token/use::duplicate-token-ex-source

- id: python-winlogon-uiaccess-token-launch
  desc: Python impersonates winlogon token to launch UIAccess child process
  crit: hostile
  conf: 0.98
  for: [python]
  attack: T1134.001,T1134.002
  mbc: B0028
  all:
    - id: micro-behaviors/process/info/name::winlogon-executable-reference
    - id: micro-behaviors/os/privilege/reference::high-risk-privilege-name-beyond-debug
    - id: micro-behaviors/os/privilege/token/use::open-process-token-source
    - id: micro-behaviors/os/privilege/token/use::duplicate-token-ex-source
    - id: micro-behaviors/os/privilege/token/use::set-thread-token-source
    - id: micro-behaviors/os/privilege/token/use::token-uiaccess-class
    - id: micro-behaviors/os/privilege/token/use::set-token-information-source
    - id: micro-behaviors/os/privilege/token/use::create-process-as-user-source
