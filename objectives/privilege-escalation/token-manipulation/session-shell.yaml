defaults:
  platforms: [windows]
  for: [c, cpp]
composite_rules:
  - id: session-token-launch-shell-reference
    desc: Session token launch with shell reference
    crit: suspicious
    conf: 0.94
    attack: T1134.002
    all:
      - id: micro-behaviors/os/privilege/token::session-retargeted-token-process-launch
      - id: micro-behaviors/os/privilege/token::duplicate-token-ex
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
