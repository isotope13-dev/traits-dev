defaults:
  platforms: [windows]
  for: [c, cpp]
composite_rules:
  - id: session-token-launch-shell-reference
    desc: Session token launch with shell reference
    crit: suspicious
    conf: 0.94
    attack: T1134.002
    all:
      - id: micro-behaviors/os/privilege/token::session-retargeted-token-process-launch
      - id: micro-behaviors/os/privilege/token::duplicate-token-ex
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
  - id: enumforms-overflow-system-shell-spawn
    desc: Inspects SYSTEM token and spawns process
    crit: hostile
    conf: 0.97
    attack: T1068,T1059.003
    all:
      - id: micro-behaviors/os/privilege/token::open-process-token
      - id: micro-behaviors/os/privilege/token::get-token-information
      - id: micro-behaviors/os/group/lookup::convert-sid-to-string
      - id: micro-behaviors/os/group/lookup::lookup-account-sid
      - id: micro-behaviors/os/sysinfo/directories::system-directory-source-call
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
      - id: micro-behaviors/os/user/account::nt-authority-system-name
  - id: debug-privilege-system-service-dll-injection
    desc: Enables debug privilege for remote memory write
    crit: hostile
    conf: 0.97
    for: [c]
    attack: T1134,T1055.001
    all:
      - id: micro-behaviors/process/inject/remote-thread::source-remote-memory-thread-api-references
      - id: micro-behaviors/os/privilege/token::lookup-privilege-value
      - id: micro-behaviors/os/privilege/token::high-risk-privilege-name
      - id: micro-behaviors/os/privilege/token::adjust-token-privileges
