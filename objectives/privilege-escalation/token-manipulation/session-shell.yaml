defaults:
  platforms: [windows]
  for: [c, cpp]
composite_rules:
  - id: session-token-launch-shell-reference
    desc: Session token launch with shell reference
    crit: suspicious
    conf: 0.94
    attack: T1134.002
    all:
      - id: micro-behaviors/os/privilege/token/session::session-retargeted-token-process-launch
      - id: micro-behaviors/os/privilege/token/use::duplicate-token-ex
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
  - id: enumforms-overflow-system-shell-spawn
    desc: Inspects SYSTEM token and spawns process
    crit: hostile
    conf: 0.97
    attack: T1068,T1059.003
    all:
      - id: micro-behaviors/os/privilege/token/use::open-process-token
      - id: micro-behaviors/os/privilege/token/use::get-token-information
      - id: micro-behaviors/os/group/lookup::convert-sid-to-string
      - id: micro-behaviors/os/group/lookup::lookup-account-sid
      - id: micro-behaviors/os/sysinfo/directories::system-directory-source-call
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
      - id: metadata/lang/source/naming/account::nt-authority-system-name
# Enabling a high-risk token privilege beside cross-process memory-write
# APIs crosses a security boundary, but the same co-occurrence is ordinary
# in debuggers and system-inspection tooling, so it stays suspicious.
  - id: token-privilege-remote-memory-write-source
    desc: Enables high-risk token privilege alongside remote memory-write APIs
    crit: suspicious
    conf: 0.97
    attack: T1134,T1055
    all:
      - id: micro-behaviors/process/inject/remote-thread::source-remote-memory-thread-api-references
      - id: micro-behaviors/os/privilege/token/use::lookup-privilege-value
      - id: micro-behaviors/os/privilege/reference::high-risk-privilege-name
      - id: micro-behaviors/os/privilege/token/use::adjust-token-privileges
