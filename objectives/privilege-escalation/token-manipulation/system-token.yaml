defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: system-token-duplicate-call
  desc: Duplicates a selected SYSTEM process token
  if:
    type: text
    regex: ::DuplicateToken\(\$SystemToken,\s*2,
composite_rules:
- id: powershell-system-token-theft
  desc: Duplicates and impersonates a SYSTEM token
  crit: hostile
  all:
  - id: system-token-duplicate-call
  - id: micro-behaviors/os/privilege/token::powershell-set-thread-token-call
  - id: well-known/tool/offensive/powershell-empire::elevation-module-functions
