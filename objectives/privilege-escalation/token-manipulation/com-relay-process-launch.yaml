# Potato-family privilege escalation: a service-account process that holds
# SeImpersonate/SeAssignPrimaryToken coaxes a privileged COM client into
# authenticating to a listener it controls, then launches a process with the
# captured SYSTEM token. The tools announce each stage in their output.
defaults:
  for:
  - pe
  platforms:
  - windows
  crit: notable
  conf: 0.95

traits:
- id: impersonation-privilege-gate-message
  desc: Requires SeImpersonate or SeAssignPrimaryToken
  if:
    type: text
    regex: 'SeImpersonate[^\n]{0,30}SeAssignPrimaryToken'
- id: clsid-com-server-port-message
  desc: CLSID test against local COM server port
  if:
    type: text
    regex: 'CLSID[^\n]{0,30}COM server port'

composite_rules:
- id: com-relay-token-process-launcher
  desc: COM-server token relay launching a process as SYSTEM
  crit: hostile
  conf: 0.97
  attack: T1134.001,T1068
  all:
  - id: impersonation-privilege-gate-message
  - id: clsid-com-server-port-message
  - id: micro-behaviors/process/create/sudo::create-process-with-token
