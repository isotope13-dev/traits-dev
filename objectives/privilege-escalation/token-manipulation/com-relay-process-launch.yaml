# Potato-family privilege escalation: a service-account process that holds
# SeImpersonate/SeAssignPrimaryToken coaxes a privileged COM client into
# authenticating to a listener it controls, then launches a process with the
# captured SYSTEM token. The tools announce each stage in their output.
defaults:
  for:
    - pe
  platforms:
    - windows
  crit: notable
  conf: 0.95

traits:
  - id: system-token-capture-failure-message
    desc: Failed SYSTEM-token capture diagnostic
    if:
      type: text
      substr: Cannot capture a valid SYSTEM token

composite_rules:
  - id: com-relay-token-process-launcher
    desc: COM relay and SYSTEM-token launch diagnostics
  # Published impersonation research tools implement this same operation.
  # The diagnostics support escalation capability, not unauthorized use.
    crit: suspicious
    conf: 0.97
    attack: T1134.001
    all:
      - id: micro-behaviors/os/privilege/token::impersonation-privilege-gate-message
      - id: metadata/file/profile/rpc::clsid-com-server-port-message
      - id: system-token-capture-failure-message
      - id: metadata/binary/symbols/name/process::create-process-with-token
