defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
composite_rules:
- id: powershell-lsass-thread-token-theft
  desc: Assigns a duplicated LSASS token to a thread
  crit: hostile
  all:
  - id: micro-behaviors/process/enumerate/shell::powershell-get-process-lsass
  - id: micro-behaviors/os/privilege/token::powershell-duplicate-token-call
  - id: micro-behaviors/os/privilege/token::powershell-set-thread-token-call
