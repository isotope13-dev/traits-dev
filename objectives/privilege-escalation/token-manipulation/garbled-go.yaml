# An obfuscated Go agent carrying get-system and token-impersonation tasking
# messages. The paired operation vocabulary documents a Windows privilege and
# token-manipulation tasking interface; the names describe the interface, not
# an executed privilege change.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
composite_rules:
  - id: garbled-go-privilege-tasking
    desc: Obfuscated Go agent with privilege tasking
    crit: hostile
    conf: 0.9
    attack: T1134
    all:
      - id: metadata/lang/compiler/systems::go-binary
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garble-indicators
      - id: objectives/privilege-escalation/token-manipulation::remote-get-system-tasking-names
      - id: objectives/privilege-escalation/token-manipulation::remote-token-impersonation-tasking-names
