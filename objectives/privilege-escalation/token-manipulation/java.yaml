defaults:
  platforms: [windows]
  for: [java, class, jar]
traits:
  - id: java-lsass-process-reference
    desc: Java references LSASS process
    crit: suspicious
    conf: 0.9
    attack: T1003.001
    for: [java, class]
    if:
      type: text
      regex: '(?i)\blsass\.exe\b'
  - id: java-rtl-adjust-privilege
    desc: Java calls RtlAdjustPrivilege
    crit: suspicious
    conf: 0.92
    attack: T1134.001
    for: [java, class]
    if:
      type: text
      substr: RtlAdjustPrivilege
  - id: java-duplicate-token-api
    desc: Java uses token duplication API
    crit: notable
    conf: 0.9
    attack: T1134
    for: [java, class]
    if:
      type: text
      regex: 'DuplicateToken(Ex)?'
    unless:
      - id: well-known/lib/platform/jna
  - id: java-impersonate-user-api
    desc: Java impersonates logged-on user
    crit: suspicious
    conf: 0.9
    attack: T1134
    for: [java, class]
    if:
      type: text
      substr: ImpersonateLoggedOnUser
    unless:
      - id: well-known/lib/platform/jna
  - id: java-runas-ppl-registry
    desc: Java checks RunAsPPL registry
    crit: suspicious
    conf: 0.9
    attack: T1003.001
    for: [java, class]
    if:
      type: text
      substr: RunAsPPL

  - id: builtin-privilege-escalation-indicator
    desc: Built-in JVM privilege-escalation indicator hook
    crit: notable
    conf: 0.9
    for: [class, java_class]
    if:
      type: basename
      exact: __cleave_builtin_privilege_escalation_indicator_hook__
    unless:
      - id: well-known/tool/development/mobile/expo::expo-ui-android-class

composite_rules:
  - id: java-lsass-token-impersonation
    desc: Java LSASS token impersonation chain
    crit: hostile
    conf: 0.98
    attack: T1134
    all:
      - id: java-lsass-process-reference
    needs: 2
    any:
      - id: java-rtl-adjust-privilege
      - id: java-duplicate-token-api
      - id: java-impersonate-user-api
      - id: java-runas-ppl-registry
