# Stealing SYSTEM by duplicating the LSASS process token: open the lsass
# process token, DuplicateToken it, then SetThreadToken to impersonate it.
# Each atom alone is ordinary token handling; aimed at lsass and chained
# into thread impersonation, the sequence only serves privilege
# escalation / credential access. HTML is in scope for the same
# rendered-source reason as the reverse-shell bridge composite.
defaults:
  platforms: [windows]
  for: [powershell, html]
  attack: T1134.001

composite_rules:
  - id: powershell-lsass-token-duplication-impersonation
    desc: Duplicates LSASS token to impersonate SYSTEM
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/enumerate/shell::powershell-get-process-lsass
      - id: micro-behaviors/os/privilege/token::powershell-duplicate-token-text
      - id: micro-behaviors/os/privilege/token::powershell-set-thread-token-text
