# Stealing SYSTEM by duplicating the LSASS process token: open the lsass
# process token, DuplicateToken it, then SetThreadToken to impersonate it.
# Each atom alone is ordinary token handling; aimed at lsass and chained
# into thread impersonation, the sequence only serves privilege
# escalation / credential access. HTML is in scope for the same
# rendered-source reason as the reverse-shell bridge composite.
defaults:
  platforms: [windows]
  for: [powershell, html]
  attack: T1134.001

traits:
  - id: powershell-get-process-lsass-text
    desc: PowerShell Get-Process lsass text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)Get-Process\s+-Name\s+lsass'
  - id: powershell-duplicate-token-text
    desc: PowerShell DuplicateToken text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)DuplicateToken'
  - id: powershell-set-thread-token-text
    desc: PowerShell SetThreadToken text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)SetThreadToken'

composite_rules:
  - id: powershell-lsass-token-duplication-impersonation
    desc: Duplicates LSASS token to impersonate SYSTEM
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: powershell-get-process-lsass-text
      - id: powershell-duplicate-token-text
      - id: powershell-set-thread-token-text
