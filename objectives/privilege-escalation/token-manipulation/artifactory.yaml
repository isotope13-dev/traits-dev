# Artifactory token privilege escalation (Wiz, September 2026).
#
# CVE-2026-42018 returns the internal anonymous-user JWT to an unauthenticated
# caller through the trailing-slash variant of the AWS token route; CVE-2026-42016
# then lets that low-privilege JWT be exchanged at the Access token-creation
# endpoint for a token with administrator scope, because the server validates
# the token's signature and issuer but not its scope. The escalated token keeps
# the anonymous identity, so subsequent requests are logged as token:anonymous.
# CVE-2026-82329 is standalone: an unauthenticated POST to the registry join
# API returns an administrator-scoped token on default-configured instances.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: "T1190"

composite_rules:
  - id: anonymous-token-admin-exchange
    desc: Anonymous JWT exchanged for Artifactory admin token
    crit: hostile
    conf: 0.97
    attack: "T1190,T1550.001"
    all:
      - id: objectives/evasion/security-bypass/policy/web-admin::aws-token-trailing-slash-bypass
      - id: micro-behaviors/communications/http/services/artifactory::token-create-route
    near_bytes: 4096

  - id: registry-join-token-mint
    desc: Registry join API invoked to mint an Artifactory token
    crit: suspicious
    conf: 0.9
    # Legitimate cluster-join automation also posts here with a valid join key;
    # on its own this is an audit lead, not a confirmed bypass.
    all:
      - id: micro-behaviors/communications/http/services/artifactory::registry-join-route
    any:
      # The http/post/ directory misses the plain `requests.post(...)` idiom,
      # which carries no "POST" literal and lives under lib/requests; the
      # generic client-call atom covers urllib and fetch spellings.
      - id: micro-behaviors/communications/http/post/
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/communications/http/request/result::http-post-client-call
