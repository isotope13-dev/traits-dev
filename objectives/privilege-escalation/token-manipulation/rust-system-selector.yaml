defaults:
  platforms: [windows]
  for: [rust]
composite_rules:
  - id: rust-system-process-token-impersonation
    desc: Token cloning with SYSTEM-process selection
    crit: suspicious
    conf: 0.98
    attack: T1134.001
    # A string array of privileged process names is not process selection.
    # Require enumeration and a parsed name comparison as well as the APIs.
    all:
      - id: micro-behaviors/process/enumerate/psapi::rust-enum-processes-call
      - id: metadata/lang/source/syntax/operator::rust-system-process-name-comparison
      - id: micro-behaviors/os/privilege/token::open-process-token-source
      - id: micro-behaviors/os/privilege/token::rust-duplicate-token-call
      - id: micro-behaviors/os/privilege/token::impersonate-logged-on-user-source
