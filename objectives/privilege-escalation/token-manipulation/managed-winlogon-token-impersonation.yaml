# "getsystem" by token theft: open the Winlogon process, take its SYSTEM
# primary token, duplicate it and impersonate it on the current thread.
# Apollo's identity manager does this, as do most .NET implants with a
# getsystem command. "Run as SYSTEM" admin utilities do the same, so like the
# Winlogon parent-process launch next door this stays suspicious.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1134.001
  mbc: B0028

composite_rules:
  - id: managed-winlogon-token-impersonation
    desc: Managed code duplicates Winlogon's token for thread impersonation
    crit: suspicious
    conf: 0.88
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/process/info/name::winlogon-process-name-literal
      - id: micro-behaviors/os/privilege/token/use::managed-open-process-token-binding
      - id: micro-behaviors/os/privilege/token/use::managed-duplicate-token-ex-binding
      - id: micro-behaviors/os/privilege/token/use::managed-thread-impersonation-binding
