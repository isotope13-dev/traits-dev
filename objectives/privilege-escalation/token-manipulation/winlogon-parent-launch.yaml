# Parent-process spoofing to Winlogon: enable SeDebugPrivilege, open the
# Winlogon process and pass it as PROC_THREAD_ATTRIBUTE_PARENT_PROCESS, so
# the new child inherits Winlogon's SYSTEM token. "Run as SYSTEM" admin
# utilities do the same, so this stays suspicious; it is evidence of the
# capability, not of a completed elevation.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1134.004
composite_rules:
  - id: managed-winlogon-parent-process-launch
    desc: Managed debug-mode launch under a Winlogon parent
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/os/privilege/token/adjust::managed-enter-debug-mode-call
      - id: micro-behaviors/process/info/name::winlogon-process-name-literal
      - id: micro-behaviors/process/config/launch::proc-thread-attribute-list
      - id: micro-behaviors/process/create/exec::create-process-api-name
