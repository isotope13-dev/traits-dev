# RODC golden ticket. Once an attacker controls an RODC and its per-RODC
# krbtgt account key (linked via msDS-KrbTgtLink, named krbtgt_<number>), they
# forge a TGT for a privileged user and present it to a writable DC to act as
# domain Administrator (T1558.001). The forge step alone is a dual-use ticket
# tool; pairing it with an RODC krbtgt key is the escalation signal. It
# generalizes across Impacket ticketer, Rubeus /rodcNumber and mimikatz
# kerberos::golden, and across the chosen key, domain SID and impersonated user.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, pe, dll]
  attack: T1558.001

traits:
  - id: golden-ticket-forge-command
    desc: Kerberos golden-ticket forge command
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(\bticketer\.py\b|\bkerberos::golden\b|\bRubeus\b[^\r\n]{0,40}\bgolden\b)'

  - id: rubeus-rodc-number-flag
    desc: Rubeus RODC-number forge flag
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)/rodcNumber\b'

composite_rules:
  - id: rodc-golden-ticket-forge
    desc: Ticket-forging command with RODC key references
    crit: hostile
    conf: 0.97
    all:
      - id: golden-ticket-forge-command
    any:
      - id: micro-behaviors/os/security/directory-service::rodc-krbtgt-account-name
      - id: micro-behaviors/os/security/directory-service::krbtgt-link-attribute
      - id: rubeus-rodc-number-flag
    near_bytes: 1200