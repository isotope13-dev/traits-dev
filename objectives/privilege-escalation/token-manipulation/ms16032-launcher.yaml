defaults:
  for: [batch]
  platforms: [windows]
  conf: 0.97

traits:
  - id: batch-import-ms16032-invoke
    desc: Batch imports and invokes MS16-032 exploit
    crit: hostile
    if:
      type: text
      regex: '(?im)\bpowershell(\.exe)?[^\r\n]{0,160}import-module[^\r\n]{0,160}invoke-ms16-032\b'
