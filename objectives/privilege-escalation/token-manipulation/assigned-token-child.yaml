defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
composite_rules:
- id: powershell-stolen-token-child-execution
  desc: Spawns a child with a stolen security token
  crit: hostile
  all:
  - id: powershell-credential-token-impersonation
  - id: micro-behaviors/process/create/spawn::powershell-assigned-token-process-call
