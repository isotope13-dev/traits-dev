# Resource-Based Constrained Delegation (RBCD) privilege escalation: modifies
# msDS-AllowedToActOnBehalfOfOtherIdentity on a target computer object with an
# attacker-controlled security descriptor and requests a Kerberos S4U service
# ticket to impersonate a privileged user (T1134.001, T1098).
defaults:
  platforms: [windows, unix]
  for: [powershell, python, csharp, go, scripts, source, pe, dll]
  attack: T1134.001,T1098

traits:
  - id: rbcd-sddl-descriptor-string
    desc: SDDL descriptor granting RBCD delegation
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'O:BAD:\(A;;[A-Z]{6,40};;;'

  - id: kerberos-s4u-protocol-or-flag
    desc: Kerberos S4U or impersonation flag
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(\bs4u2(self|proxy)\b|\bs4u\b[^\r\n]{1,80}\bimpersonate)'

  - id: getst-impersonate-invocation
    desc: Impacket getST Kerberos impersonation invocation
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bgetST(\.py)?\b[^\r\n]{1,80}-impersonate\b'
    unless:
      - id: well-known/tool/offensive/impacket::source-tree-member

composite_rules:
  - id: rbcd-attribute-write-evidence
    desc: Writes security descriptor to msDS-AllowedToActOnBehalfOfOtherIdentity
    crit: component
    conf: 0.95
    all:
      - id: micro-behaviors/os/security/directory-service::resource-based-delegation-attribute
    any:
      - id: rbcd-sddl-descriptor-string
      - id: micro-behaviors/os/security/descriptor::dotnet-security-identifier
      - id: micro-behaviors/os/security/directory-service::rbcd-modification-reference

  - id: rbcd-s4u-account-impersonation
    desc: Modifies RBCD delegation attribute and impersonates user via S4U
    crit: hostile
    conf: 0.99
    all:
      - id: rbcd-attribute-write-evidence
    any:
      - id: kerberos-s4u-protocol-or-flag
      - id: getst-impersonate-invocation
      - id: micro-behaviors/os/security/auth/session::kerberos-tgs-request
      - id: micro-behaviors/os/security/auth/session::pass-the-ticket-command-syntax
