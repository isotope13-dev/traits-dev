# Duplicating a token from lsass/winlogon and impersonating it gives the
# caller SYSTEM's DPAPI context; aimed at Chromium's App-Bound key it exists
# only to unlock another user's browser secrets.
defaults:
  platforms: [windows]
  for: [tar, rust]
  attack: T1134.001,T1555.003
composite_rules:
  - id: system-token-impersonation-for-browser-key
    desc: Steals SYSTEM token to reach browser key
    crit: hostile
    conf: 0.94
    scope: archive
    all:
      - id: micro-behaviors/os/privilege/token/use::rust-duplicate-token-call
      - id: micro-behaviors/os/privilege/token/use::impersonate-logged-on-user-source
      - id: micro-behaviors/data/config/browser-preference::chromium-app-bound-encrypted-key-field
    any:
      - id: micro-behaviors/process/info/name::lsass-executable-reference
      - id: micro-behaviors/process/info/name::winlogon-executable-reference
