# Modify Existing Service - Linux Privilege Escalation
# MBC: F0011 (Modify Existing Service)
# ATT&CK: T1543.002 (Create or Modify System Process: Systemd Service)
#
# Modifying an existing systemd service or init script to execute
# attacker-controlled code with root privileges.
# Atomic service path/config traits are in micro-behaviors/os/service/config/linux.yaml
defaults:
  mbc: "F0011"
  attack: "T1543.002"
  platforms: [unix]
traits:
- id: systemd-temp-exec-payload--rx-6
  desc: Systemd command starts from /tmp
  crit: notable
  conf: 0.85
  for: [shell, python]
  if:
    type: text
    regex: '(?m)Exec(Start|Stop|StartPre)\s*=\s*[-@+!]*\s*/tmp/[^\s\n]{1,120}'
- id: systemd-temp-exec-payload--var-tmp
  desc: Systemd command starts from var-tmp
  crit: notable
  conf: 0.85
  for: [shell, python]
  if:
    type: text
    regex: '(?m)Exec(Start|Stop|StartPre)\s*=\s*[-@+!]*\s*/var/tmp/[^\s\n]{1,120}'
- id: systemd-temp-exec-payload--dev-shm
  desc: Systemd command starts from dev-shm
  crit: notable
  conf: 0.85
  for: [shell, python]
  if:
    type: text
    regex: '(?m)Exec(Start|Stop|StartPre)\s*=\s*[-@+!]*\s*/dev/shm/[^\s\n]{1,120}'
- id: vagrant-plugins-marker
  desc: Vagrant plugin source marker
  crit: notable
  conf: 0.9
  for: [shell, ruby]
  if:
    type: text
    substr: VagrantPlugins
- id: tmp-helper-script-write
  desc: Writes a helper script under tmp
  crit: notable
  conf: 0.9
  for: [shell]
  if:
    type: text
    regex: 'cat > \S*/tmp/\S*\.sh\b'
- id: crictl-pod-inspect-call
  desc: crictl inspects upgrade pods or containers
  crit: notable
  conf: 0.9
  for: [shell]
  if:
    type: text
    regex: '\bcrictl\s+(pods|ps|inspect)\b'
composite_rules:
- id: k8s-node-upgrade-job-script
  desc: Node-upgrade job pairs tmp helper with crictl
  crit: notable
  conf: 0.9
  all:
  - id: tmp-helper-script-write
  - id: crictl-pod-inspect-call
  near_lines: 40
  # Service path + daemon reload + systemctl: modifying system service state.
- id: systemd-service-modification
  desc: Systemd service modification and reload
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/os/service/config::systemd-unit-path
  - id: micro-behaviors/os/service/config::daemon-reload
  any:
  - id: systemd-temp-exec-payload
  - id: micro-behaviors/os/service/config::systemd-http-client-command-text
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: micro-behaviors/os/service/name::docker-service-unit-name
- id: systemd-temp-exec-payload
  desc: Systemd unit executes temp payload
  crit: suspicious
  conf: 0.85
  for: [shell, python]
  unless:
  - id: micro-behaviors/os/service/unit-field::devstack-stack-service-user
  downgrade:
    any:
    - id: micro-behaviors/os/package-manager/installer-script::installer-script
    - id: metadata/package/files/included::install-uninstall-shell-basename
    # The Kubernetes node-upgrade-job shape (Rancher system-upgrade-controller
    # and its users): the job script drops its own reboot/apply helper under
    # /tmp and the run/systemd unit that runs it, then drives crictl to watch
    # the upgrade pod. The payload author is the same script that registers
    # the unit - upgrade tooling on a node it already controls.
    - id: k8s-node-upgrade-job-script
  any:
  - id: systemd-temp-exec-payload--rx-6
  - id: systemd-temp-exec-payload--var-tmp
  - id: systemd-temp-exec-payload--dev-shm
