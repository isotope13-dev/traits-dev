# Modify Existing Service - Linux Privilege Escalation
# MBC: F0011 (Modify Existing Service)
# ATT&CK: T1543.002 (Create or Modify System Process: Systemd Service)
#
# Modifying an existing systemd service or init script to execute
# attacker-controlled code with root privileges.
# Atomic service path/config traits are in micro-behaviors/os/service/config/linux.yaml
defaults:
  mbc: "F0011"
  attack: "T1543.002"
  platforms: [unix]
traits:
- id: systemd-temp-exec-payload--rx-6
  desc: Systemd command starts from /tmp
  crit: component
  conf: 0.85
  for: [shell, python]
  if:
    type: text
    regex: '(?m)Exec(Start|Stop|StartPre)\s*=\s*[-@+!]*\s*/tmp/[^\s\n]{1,120}'
  count_max: 1015976
- id: systemd-temp-exec-payload--var-tmp
  desc: Systemd command starts from var-tmp
  crit: component
  conf: 0.85
  for: [shell, python]
  if:
    type: text
    regex: '(?m)Exec(Start|Stop|StartPre)\s*=\s*[-@+!]*\s*/var/tmp/[^\s\n]{1,120}'
- id: systemd-temp-exec-payload--dev-shm
  desc: Systemd command starts from dev-shm
  crit: component
  conf: 0.85
  for: [shell, python]
  if:
    type: text
    regex: '(?m)Exec(Start|Stop|StartPre)\s*=\s*[-@+!]*\s*/dev/shm/[^\s\n]{1,120}'
- id: systemd-download-exec-payload--rx-10
  desc: Systemd ExecStart curl payload
  crit: component
  conf: 0.85
  for: [shell, python]
  if:
    type: text
    regex: '(?m)Exec(Start|Stop|StartPre)\s*=\s*[^\n]{0,240}\bcurl\b'
  count_max: 1015980
- id: systemd-download-exec-payload--wget
  desc: Systemd ExecStart wget payload
  crit: component
  conf: 0.85
  for: [shell, python]
  if:
    type: text
    regex: '(?m)Exec(Start|Stop|StartPre)\s*=\s*[^\n]{0,240}\bwget\b'
- id: vagrant-plugins-marker
  desc: Vagrant plugin source marker
  crit: notable
  conf: 0.9
  for: [shell, ruby]
  if:
    type: text
    substr: VagrantPlugins
composite_rules:
  # Service path + daemon reload + systemctl: modifying system service state.
- id: systemd-service-modification
  desc: Systemd service modification and reload
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/os/service/config::systemd-unit-path
  - id: micro-behaviors/os/service/config::daemon-reload
  any:
  - id: systemd-temp-exec-payload
  - id: systemd-download-exec-payload
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: objectives/anti-analysis/emulator-detect/vendor-strings
    - type: text
      substr: "docker.service"
  # Init script write + shell execution
- id: init-script-hijack
  desc: Init script modification with execution
  crit: notable
  conf: 0.85
  # One program writing an init script and running a shell. Without leaf scope
  # the two legs pooled across a whole container image -- an /etc/init.d path
  # in one binary, /bin/sh in another -- so every Linux image matched. It fired
  # on longhorn-engine at the image node and on no file inside it.
  scope: leaf
  # `scope: leaf` alone did not stop the same pooling on an *archive* node: an
  # ansible-core wheel matched at the .whl itself (init-script-path from
  # module_utils/service.py, bin-sh from a dozen unrelated modules) with spans
  # pointing into compressed bytes. Constraining the composite to the file
  # types its two legs actually carry keeps it from being evaluated on the
  # container at all.
  for: [binaries, scripts]
  all:
  - id: micro-behaviors/os/service/config::init-script-path
  - id: micro-behaviors/process/create/shell/spawn::bin-sh
  unless:
  - id: micro-behaviors/os/service/config::sysv-init-script-header
  - id: objectives/persistence/system/init/boot::openrc-init-script-header
  - id: metadata/package/files/included::install-uninstall-shell-basename
  - id: vagrant-plugins-marker
  - id: well-known/app/enterprise/egroupware/
  - id: well-known/app/infrastructure/pihole::pihole-artifact
- id: systemd-temp-exec-payload
  desc: Systemd unit executes temp payload
  crit: suspicious
  conf: 0.85
  for: [shell, python]
  unless:
  - id: metadata/package/testing/presence/harness::test-directory
  downgrade:
    any:
    - id: micro-behaviors/os/service/legitimate::installer-script
    - id: metadata/package/files/included::install-uninstall-shell-basename
  any:
  - id: systemd-temp-exec-payload--rx-6
  - id: systemd-temp-exec-payload--var-tmp
  - id: systemd-temp-exec-payload--dev-shm
- id: systemd-download-exec-payload
  desc: Systemd unit downloads payload
  crit: suspicious
  conf: 0.85
  for: [shell, python]
  downgrade:
    any:
    - id: micro-behaviors/os/service/legitimate::installer-script
    - id: metadata/package/files/included::install-uninstall-shell-basename
  any:
  - id: systemd-download-exec-payload--rx-10
  - id: systemd-download-exec-payload--wget
