defaults:
  mbc: F0011
  attack: T1543.003
  platforms:
    - windows
traits:
  - id: sc-failure-command
    desc: sc failure with command execution
    crit: suspicious
    conf: 0.9
    for:
      - batch
      - powershell
      - pe
    if:
      type: text
      regex: (?i)sc(\.exe)?\s+failure\s+\S+\s+[^\n]{0,60}command=
composite_rules:
  # Publisher certificate names are metadata, while service configuration
  # remains the behavior in this rule. It used to be the
  # bare vendor list with no service evidence at all, which meant a `notable`
  # finding reading "Signed vendor service reconfiguration" on any binary those
  # publishers signed, whether or not it went near a service. The reconfiguration
  # evidence is now required.
  - id: signed-service-reconfig-vendor
    desc: Signed vendor service reconfiguration
    crit: notable
    conf: 0.8
    any:
      - id: metadata/signature/certificate/identity::game-publisher-signature
      - id: metadata/signature/certificate/identity::desktop-software-publisher-signature
    all:
      - id: micro-behaviors/os/service/configure::change-service-config
      - id: metadata/signature/certificate/integrity::pe-signature-verified-kv
  - id: sc-config-start-chain
    desc: Service binary path change then start
    crit: suspicious
    conf: 0.92
    for:
      - batch
      - powershell
    all:
      - id: micro-behaviors/os/service/configure::sc-config-binpath
    any:
      - id: micro-behaviors/os/service/start::sc-start-timeout
      - id: micro-behaviors/os/service/control::service-control
  - id: service-imagepath-hijack
    desc: Service ImagePath registry hijack
    crit: hostile
    conf: 0.95
    all:
      - id: "micro-behaviors/os/registry/service/reference::escaped-service-imagepath-registry-path"
    any:
      - id: micro-behaviors/process/interpreter/shell::cmd-exe-reference
      - id: micro-behaviors/process/argument/interpreter::powershell-command-options-text
