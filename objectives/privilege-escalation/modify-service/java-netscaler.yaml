defaults:
  platforms: [netscaler, appliance, unix]
  for: [java, class, jar]
  attack: T1543

traits:
  - id: java-netscaler-acl-paths
    desc: Java NetScaler ACL paths
    crit: suspicious
    conf: 0.92
    for: [java, class]
    if:
      type: text
      regex: '/netscaler/(flash/nsconfig|etc)|/var/netscaler'


composite_rules:
  - id: java-netscaler-acl-weakening
    desc: Java NetScaler ACL weakening
    crit: hostile
    conf: 0.98
    all:
      - id: java-netscaler-acl-paths
      - id: micro-behaviors/fs/chmod/executable/mode::java-world-readable-permission
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::java-world-executable-permission

