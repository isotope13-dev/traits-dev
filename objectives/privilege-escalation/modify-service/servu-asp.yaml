defaults:
  for: [asp]
  platforms: [windows]
composite_rules:
  - id: servu-http-maintenance-admin-grant
    desc: HTTP POST abuses local Serv-U maintenance to grant system administration
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/url/path::loopback-http-url-reference
      - id: micro-behaviors/communications/http/post::post
      - id: micro-behaviors/communications/http/client/vba::http-open-send
      - id: micro-behaviors/communications/ftp/control::servu-maintenance-command
      - id: micro-behaviors/communications/ftp/control::servu-user-setup-command
      - id: micro-behaviors/communications/ftp/control::servu-system-maintenance-grant
