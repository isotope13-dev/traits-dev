defaults:
  crit: suspicious
  conf: 0.6
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: pay-ransom
    desc: Ransom payment instruction phrase
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: metadata/package/documentation/page::static-html-shell
    if:
      type: text
      substr: pay the ransom
composite_rules:
  - id: generic_msg
    desc: Generic ransom note string
    any:
      - id: objectives/impact/ransom/encrypt/threat-text::files-encrypted-msg
      - id: objectives/impact/ransom/note::restore-files-msg
      - id: pay-ransom
