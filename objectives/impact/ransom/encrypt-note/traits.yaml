defaults:
  crit: suspicious
  conf: 0.6
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: pay-ransom
    desc: Ransom payment instruction phrase
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: metadata/document/html::html-root-at-start
    if:
      type: text
      # A note addresses the victim ("you must pay the ransom"). Up to two
      # preceding words are captured so a victim-side deliberation such as
      # "would we pay the ransom" in IR exercises is excluded.
      regex: '(?i)(\b[\w'']+\s+){0,2}pay the ransom'
      not:
        - regex: '(?i)\bwe\s+([\w'']+\s+)?pay the ransom'
composite_rules:
  - id: ransom-note-with-walk-encryption
    desc: Ransom note beside walk-and-delete file encryption
    crit: hostile
    conf: 0.97
    all:
    - id: generic_msg
    - id: micro-behaviors/crypto/symmetric/fernet::encrypt
    - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
    - id: micro-behaviors/fs/delete/file/library::py-remove
  - id: generic_msg
    desc: Encryption or ransom demand wording
    any:
    - id: objectives/impact/ransom/encrypt/threat-text::files-encrypted-msg
    - id: pay-ransom
    unless:
    - id: well-known/tool/offensive/psransom::recoverable-simulator-context
    - id: metadata/package/tooling::xscreensaver-program
    - id: micro-behaviors/metaprogramming/generation::configured-source-builder
    - id: well-known/tool/detection/security-scanner::eicar-test-string-reference
    # Parser-library malware-fixture corpora (saferwall/pe test/): the
    # specimen is inert test data, not a shipped ransom note.
    - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
    downgrade:
      scope: archive
      any:
      - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
