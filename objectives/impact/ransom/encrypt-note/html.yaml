defaults:
  platforms: [unix, windows]
  for: [html, text]
  attack: T1486

traits:
  - id: files-encrypted-notice
    desc: Files encrypted ransom notice
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)(all\s+)?(of\s+)?your\s+(\w+\s+)?files\s+(have\s+been|were)\s+encrypted'
      exclude_html_comments: true
    unless:
      - id: metadata/file/format/security-corpus::ransomnotes-record-field

  - id: restore-tamper-warning
    desc: Warns modifying files corrupts them
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)do\s+not\s+(modify|rename)\s+encrypted\s+files'
      exclude_html_comments: true
    unless:
      - id: metadata/file/format/security-corpus::ransomnotes-record-field

  - id: restore-third-party-warning
    desc: Warns third-party restore corrupts files
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)restore.{0,20}third-party.{0,20}corrupt'
      exclude_html_comments: true
    unless:
      - id: metadata/file/format/security-corpus::ransomnotes-record-field

  - id: free-decryption-test-offer
    desc: Free test decryption offer
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)decrypt\s+(it|them|[0-9-]+\s+files?)\s+for\s+free'
      exclude_html_comments: true
    unless:
      - id: metadata/file/format/security-corpus::ransomnotes-record-field

  - id: price-escalation-deadline
    desc: Ransom deadline with price escalation
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)(contact\s+us\s+within|\bwithin\s+[0-9]+\s+hours).{0,30}price\s+will\s+be\s+higher'
      exclude_html_comments: true
    unless:
      - id: metadata/file/format/security-corpus::ransomnotes-record-field

  - id: network-penetrated-banner
    desc: Network penetrated breach notice
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bnetwork\s+has\s+been\s+penetrated\b'
      exclude_html_comments: true
    unless:
      - id: metadata/file/format/security-corpus::ransomnotes-record-field

  - id: ransom-personal-id-blob
    desc: Personal victim ID key block
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(your\s+personal\s+id|victim\s+id)\b.{0,120}[0-9A-Fa-f]{64}'
      exclude_html_comments: true
    unless:
      - id: metadata/file/format/security-corpus::ransomnotes-record-field

  - id: private-key-decrypt-requirement
    desc: Decryption requires private key and program
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)private\s+key\s+and\s+decrypt\s+program'
      exclude_html_comments: true
    unless:
      - id: metadata/file/format/security-corpus::ransomnotes-record-field

composite_rules:
  - id: html-ransom-extortion-note
    desc: HTML ransom extortion note
    crit: hostile
    conf: 0.98
    needs: 2
    any:
      - id: files-encrypted-notice
      - id: restore-tamper-warning
      - id: restore-third-party-warning
      - id: free-decryption-test-offer
      - id: price-escalation-deadline
      - id: network-penetrated-banner
      - id: ransom-personal-id-blob
      - id: private-key-decrypt-requirement
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: metadata/file/format/security-corpus::ransomnotes-record-field
