# Cloud object-store extortion (the AWS SIRT CloudTrail guide's Scenario 1):
# a threat actor copies high-value S3 objects to a second, attacker-controlled
# bucket (REST.COPY.OBJECT) and then destroys the originals
# (REST.DELETE.OBJECT) so that recovery can be held for ransom. The
# copy-then-delete sequence is the ransomware tell -- data is stolen before
# destruction to enable extortion. Backup deletion is part of the same move:
# the anti-recovery step that removes the victim's way out.
#
# These composites are deliberately language- and surface-agnostic: the same
# chain expressed with boto3, the AWS CLI, or recorded as CloudTrail
# DeleteObject/CopyObject events all land here, because the legs are the
# operation umbrellas rather than per-API matchers.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  attack: T1486,T1567.002,T1485
  mbc: F0014,E1567.002

composite_rules:
  - id: s3-copy-then-delete-extortion
    desc: Copies S3 objects to another bucket then deletes the originals
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/aws-s3::s3-object-copy-operation
      - id: micro-behaviors/communications/http/services/aws-s3::s3-object-delete-operation

  - id: cross-account-s3-copy-then-delete
    desc: Assumed-role session copies S3 objects out then destroys the originals
    crit: hostile
    conf: 0.97
    # The assumed-role leg is what makes this the guide's cross-account
    # incident: a session established through a trusted role ARN (an
    # AssumeRole call, an AssumeRole event, or a recorded AssumedRole
    # identity) staging data out before destroying it.
    all:
      - id: micro-behaviors/communications/http/services/aws::aws-assume-role-operation
      - id: micro-behaviors/communications/http/services/aws-s3::s3-object-copy-operation
      - id: micro-behaviors/communications/http/services/aws-s3::s3-object-delete-operation
