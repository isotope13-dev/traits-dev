# Native Windows lockers can widen impact by evicting applications that hold
# files open and by enumerating both local volumes and network resources.
defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1486

composite_rules:
  - id: restart-manager-unlocking-native-locker
    desc: Native locker force-closes applications holding target files
    crit: hostile
    conf: 0.99
    attack: T1486,T1562
    all:
      - id: objectives/evasion/file-unlock/restart-manager::restart-manager-file-unlock
      - id: micro-behaviors/os/event/shutdown::restart-manager-get-list
    any:
      - id: objectives/impact/ransom/encrypt/bulk-encryption::windows-native-custom-suffix-locker
      - id: objectives/impact/ransom/encrypt/bulk-encryption::windows-native-file-encryptor-workflow
      - id: objectives/impact/ransom/encrypt/bulk-encryption::windows-native-locker-workflow

  - id: local-and-network-storage-native-locker
    desc: Native locker enumerates local volumes and network storage
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/enumerate/volume::volume-enumeration-workflow
      - id: micro-behaviors/communications/socket/share::network-disk-share-enumeration
    any:
      - id: objectives/impact/ransom/encrypt/bulk-encryption::windows-native-custom-suffix-locker
      - id: objectives/impact/ransom/encrypt/bulk-encryption::windows-native-file-encryptor-workflow
      - id: objectives/impact/ransom/encrypt/bulk-encryption::windows-native-locker-workflow
