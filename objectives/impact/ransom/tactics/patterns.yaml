defaults:
  platforms: [unix, windows]
  for: [scripts, source, documents]
  attack: T1486
traits:
  - id: glob-module
    desc: glob module
    crit: component
    conf: 0.4
    for: [scripts, binaries]
    if:
      type: string_literal
      exact: glob
  - id: open-paren
    desc: open( function for file write
    crit: component
    conf: 0.3
    for: [scripts, binaries]
    if:
      type: string_literal
      regex: open\([^)]{0,120}["'][wa]["']
  - id: pay-bitcoin-msg
    desc: Pay bitcoin message
    crit: suspicious
    conf: 0.7
    for: [scripts, binaries]
    if:
      type: string_literal
      substr: pay bitcoin
      case_insensitive: true
  - id: pay-btc-msg
    desc: Pay BTC message
    crit: suspicious
    conf: 0.7
    for: [scripts, binaries]
    if:
      type: string_literal
      substr: pay btc
      case_insensitive: true
  - id: decrypt-files-msg
    desc: Decrypt files message
    crit: suspicious
    conf: 0.7
    for: [scripts, binaries]
    if:
      type: string_literal
      substr: decrypt your files
      case_insensitive: true
  - id: bitcoin-wallet-msg
    desc: Bitcoin wallet payment-demand message
    crit: suspicious
    conf: 0.7
    for: [scripts, binaries]
    unless:
    - id: well-known/app/finance/sidesail/
    - id: well-known/app/finance/blockstream::blockstream-branding
    if:
      type: string_literal
      regex: '(?i)\bbitcoin\s+wallet\b.{0,60}\b(pay|ransom|decrypt)\b'
  - id: restore-files-msg
    desc: Restore files message
    crit: suspicious
    conf: 0.7
    for: [scripts, binaries]
    if:
      type: string_literal
      substr: restore your files
      case_insensitive: true
    unless:
      - id: well-known/app/publishing/wordpress-plugins::known-wordpress-plugin
  - id: send-payment-msg
    desc: Generic send payment text
    crit: component
    conf: 0.7
    for: [scripts, binaries]
    if:
      type: string_literal
      substr: send payment
      case_insensitive: true
  - id: rename-fn
    desc: "rename( function"
    crit: component
    conf: 0.4
    count_min: 2
    for: [scripts, binaries]
    if:
      type: text
      substr: "rename("
    unless:
    - type: trait
      id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: os-rename
    desc: os.rename function
    crit: component
    conf: 0.4
    for: [scripts, binaries]
    if:
      type: string_literal
      substr: os.rename

  - id: decrypt-readme-file
    desc: DECRYPT README note file
    crit: component
    conf: 0.9
    for: [scripts]
    if:
      type: literal
      substr: DECRYPT_README.txt
  - id: lua-os-remove-call
    desc: Lua removes original ransom target
    crit: component
    conf: 0.9
    for: [lua]
    if:
      type: text
      substr: os.remove(input_path)
  - id: lua-os-rename-call
    desc: Lua renames target to dfcrypt
    crit: component
    conf: 0.92
    for: [lua]
    if:
      type: text
      substr: os.rename(output_path, input_path .. ".dfcrypt")
  - id: lua-files-encrypted-msg
    desc: Lua files encrypted ransom message
    crit: component
    conf: 0.9
    for: [lua]
    if:
      type: text
      substr: your files have been encrypted
      case_insensitive: true
  - id: vssadmin-delete
    desc: vssadmin delete shadows
    crit: suspicious
    conf: 0.7
    attack: T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)\bvssadmin(\.exe)?\s+delete\s+shadows\b'
    unless:
      - id: metadata/library/sandbox-runtime::dangerous-command-registry
      - id: metadata/library/sandbox-runtime::permission-dangerous-command-registry
      - id: metadata/file/profile/identity::generated-attack-map-context
      - id: well-known/tool/offensive/bingo/
      # Impacket's secretsdump.py creates its own temporary VSS snapshot to
      # read the locked NTDS.dit file, then deletes only that snapshot
      # (`/For=%s`, not `/all`) as cleanup. Ransomware never creates a shadow
      # copy first -- it has nothing to gain from making one it is about to
      # destroy -- so the same file also creating a VSS snapshot is a strong
      # tell for "temporary snapshot for locked-file access", not "wipe
      # recovery points before encrypting".
      - id: micro-behaviors/fs/volume/shadow-copy::vssadmin-shadow-create-command
  - id: wmic-shadowcopy
    desc: wmic shadowcopy delete
    crit: suspicious
    conf: 0.7
    attack: T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)\bwmic(\.exe)?\s+shadowcopy\s+delete\b'
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/app/storage/peazip::peazip-zpaq-helper
      - id: metadata/library/sandbox-runtime::dangerous-command-registry
      - id: metadata/library/sandbox-runtime::permission-dangerous-command-registry
  - id: dotnet-vssadmin-image-literal
    desc: .NET metadata references the vssadmin executable
    crit: component
    conf: 0.9
    attack: T1490
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)^vssadmin(\.exe)?$'
  - id: dotnet-vssadmin-delete-arguments
    desc: .NET vssadmin shadow-delete arguments
    crit: component
    conf: 0.92
    attack: T1490
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)^delete\s+shadows(\s+/all)?(\s+/quiet)?$'
  - id: dotnet-wmic-image-literal
    desc: .NET metadata references the wmic executable
    crit: component
    conf: 0.9
    attack: T1490
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)^wmic(\.exe)?$'
  - id: dotnet-wmic-shadowcopy-delete-arguments
    desc: .NET WMIC shadow-copy delete arguments
    crit: component
    conf: 0.92
    attack: T1490
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)^shadowcopy\s+delete$'
  - id: wmic-shadowcopy-where-delete
    desc: WMI shadow copy deletion filtered by ID
    crit: suspicious
    conf: 0.95
    attack: T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)\bwmic(\.exe)?\s+shadowcopy\s+where\s+.{0,180}\bID\s*=\s*["''].{1,120}["'']\s+delete\b'
  - id: ps-wmi-or-cim-query
    desc: WMI/CIM query for a shadow-copy object
    crit: component
    conf: 0.88
    attack: T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    if:
      type: text
      regex: '(?is)\b(Get-WmiObject|Get-CimInstance)\b.{0,240}\bWin32_Shadowcopy\b'
  - id: ps-wmi-shadowcopy-class
    desc: Win32_Shadowcopy WMI class
    crit: notable
    conf: 0.92
    attack: T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)\bWin32_Shadowcopy\b'
  - id: ps-shadowcopy-delete-call
    desc: PowerShell invokes ShadowCopy Delete
    crit: suspicious
    conf: 0.95
    platforms: [windows]
    for: [powershell]
    if:
      type: text
      regex: '(?is)\bWin32_Shadowcopy\b.{0,240}\.Delete\s*\('
  - id: bcdedit-recovery
    desc: bcdedit recoveryenabled no
    crit: suspicious
    conf: 0.7
    attack: T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)\bbcdedit(\.exe)?[\s\S]{0,80}\brecoveryenabled[\s\S]{0,30}\bno\b'
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/app/utility/rufus::rufus-official-context
      - id: metadata/file/profile/identity::generated-attack-map-context
  - id: bcdedit-ignore-failures
    desc: Disables Windows boot failure recovery
    crit: suspicious
    conf: 0.92
    attack: T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)\bbcdedit(\.exe)?[\s\S]{0,80}\bbootstatuspolicy[\s:=/-]{0,12}ignoreallfailures\b'
  - id: wbadmin-delete-systemstate
    desc: wbadmin deletes system backups
    crit: suspicious
    conf: 0.8
    attack: T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)\bwbadmin(\.exe)?\s+delete\s+systemstatebackup\b'
    unless:
      - id: metadata/file/profile/identity::generated-attack-map-context
  - id: wbadmin-delete-catalog
    desc: Deletes Windows backup catalog
    crit: suspicious
    conf: 0.92
    attack: T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)\bwbadmin(\.exe)?\s+delete\s+catalog\b'
    unless:
      - id: metadata/file/profile/identity::generated-attack-map-context
  - id: python-open-rplusb
    desc: Python read-write binary file open
    # open(..., "r+b") is ordinary in-place binary I/O (resumable downloads,
    # file patching). It is only a ransom signal combined with crypto +
    # overwrite-in-loop in the inplace-overwrite/inplace-encrypt composites,
    # so it carries no standalone objective signal.
    crit: component
    conf: 0.72
    for:
      - python
    if:
      type: text
      regex: open\([^)]{0,140}['"]r\+b['"]
    downgrade:
      any:
        - id: metadata/package/testing/presence/harness/
        - id: metadata/package/testing/scripted/
  - id: python-seek-write-truncate
    desc: Seek write truncate overwrite sequence
    crit: component
    conf: 0.86
    for:
      - python
    size_max: 50000
    if:
      type: text
      regex: \.seek\(\s*0\s*\)[\s\S]{0,220}\.write\([\s\S]{0,220}\.truncate\(
    downgrade:
      any:
        - id: metadata/package/manifest/ecosystem::conda-index-metadata
        - id: metadata/package/manifest/ecosystem::conda-about-metadata
        - id: metadata/package/testing/presence/harness::python-test-file
        - id: metadata/package/testing/presence/harness/
        - id: metadata/package/testing/scripted/
    unless:
      - type: path
        regex: '(^|[\\/])site-packages[\\/]conda[\\/]'
  - id: python-loop-writeback
    desc: Loop variable reopened in wb mode
    crit: component
    conf: 0.83
    for:
      - python
    if:
      type: text
      regex: with\s+open\(\s*file\s*,\s*['"]wb['"]
    downgrade:
      any:
        - id: metadata/package/testing/presence/harness/
        - id: metadata/package/testing/scripted/
  - id: python-skip-self-and-key
    desc: Python skips script and key file
    crit: component
    conf: 0.82
    for:
      - python
    if:
      type: text
      regex: file == ['"][^"'\\]{1,32}\.py['"] or file == ['"][^"'\\]{1,32}\.key['"]
  # `closure-css-name-mapping-text` moved to
  # metadata/build/bundler::closure-compiler-css-renaming. It is a benign
  # build-toolchain marker used only from the `unless:` of rename-functions
  # below, so per RULES it belongs in metadata/ rather than being defined as a
  # local benign-context atom inside an attacker objective.
  - id: event-types-encrypted-marker
    desc: Recognized eventTypes encrypted state marker
    crit: notable
    conf: 0.85
    for: [scripts, binaries]
    if:
      type: text
      substr: "topEncrypted: eventTypes.encrypted"
composite_rules:
  - id: dotnet-vssadmin-shadow-delete
    desc: .NET launches vssadmin to delete shadow copies
    crit: suspicious
    conf: 0.97
    attack: T1490
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: dotnet-vssadmin-image-literal
      - id: dotnet-vssadmin-delete-arguments
    unless:
      - id: metadata/library/sandbox-runtime::dangerous-command-registry
      - id: metadata/library/sandbox-runtime::permission-dangerous-command-registry
      - id: metadata/file/profile/identity::generated-attack-map-context
  - id: dotnet-wmic-shadowcopy-delete
    desc: .NET launches WMIC to delete shadow copies
    crit: suspicious
    conf: 0.97
    attack: T1490
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: dotnet-wmic-image-literal
      - id: dotnet-wmic-shadowcopy-delete-arguments
    unless:
      - id: metadata/library/sandbox-runtime::dangerous-command-registry
      - id: metadata/library/sandbox-runtime::permission-dangerous-command-registry
      - id: metadata/file/profile/identity::generated-attack-map-context

  - id: python-recovery-copy-before-encryption
    desc: Python stages a recovery copy before encryption
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/symmetric/encrypt::python-encrypt-file-call
      - id: micro-behaviors/crypto/symmetric/encrypt::python-pyencryptor-import
      - id: micro-behaviors/fs/file/copy::python-write-file-helper-call
      - id: micro-behaviors/fs/file/copy::python-pycopyer-import
      - id: micro-behaviors/fs/path/application/interpreter::python-multiple-windows-user-paths
  - id: rsa-key-handling
    desc: RSA operations combined with ransomware indicators
    crit: suspicious
    conf: 0.8
    for: [scripts, binaries]
    all:
      - id: micro-behaviors/crypto/asymmetric/rsa::rsa-operation-cluster
    any:
      - id: ransom-note
      - id: rename-functions
      - id: objectives/impact/ransom/encrypt/threat-text::encrypt-comp
  - id: file-iteration
    desc: File iteration functions
    crit: component
    conf: 0.5
    for: [scripts, binaries]
    any:
      - id: micro-behaviors/fs/enumerate/directory::node-readdir-sync-call
      - id: micro-behaviors/fs/directory/traverse::js-walk-sync-call
      - id: glob-module
      - id: micro-behaviors/fs/directory/traverse::traverse-walk
  - id: file-write-functions
    desc: File write functions
    crit: component
    conf: 0.4
    for: [scripts, binaries]
    any:
      - id: micro-behaviors/fs/write/file/direct::write-file-sync
      - id: micro-behaviors/fs/write/file/direct::write-file-async
      - id: open-paren
  - id: file-encryption-loop-comp
    desc: File iteration with encryption
    crit: suspicious
    conf: 0.9
    for: [scripts, binaries]
    unless:
      - id: well-known/app/development/vscode-extension/tencent-codebuddy::codebuddy-marker
      - id: micro-behaviors/process/interpreter/vm::yarn-release-bundle
      - id: metadata/library/structure::js-webpack-bundle
      - id: metadata/library/structure::js-large-module-bundle
      - id: well-known/lib/runtime/bun-runtime/
    all:
      - id: file-iteration
      - id: micro-behaviors/crypto/library/keyword::encryption-algorithm-keyword
      - id: file-write-functions
    any:
      - id: rename-functions
      - id: metadata/file/extension/encrypted::encrypted-extensions
      - id: ransom-note
      - id: rsa-key-handling
    downgrade:
      any:
        - id: metadata/package/manifest/runtime::vscode-extension
        - id: micro-behaviors/process/interpreter/vm/
        - id: metadata/build/bundler::has-sourcemap
  - id: ransom-note
    desc: Ransom note text patterns
    crit: suspicious
    conf: 0.95
    for: [scripts, binaries]
    needs: 2
    any:
      - id: objectives/impact/ransom/encrypt/threat-text::files-encrypted-msg
      - id: pay-bitcoin-msg
      - id: pay-btc-msg
      - id: decrypt-files-msg
      - id: bitcoin-wallet-msg
      - id: restore-files-msg
      - id: send-payment-msg
  - id: rename-functions
    desc: File rename primitive
    crit: component
    conf: 0.4
    for: [scripts, binaries]
    any:
      - id: micro-behaviors/fs/file/rename::fs-rename-sync
      - id: rename-fn
      - id: os-rename
    unless:
      - id: well-known/app/development/kilocode::kilo-code-js-bundle
      - id: well-known/tool/reverse-engineering/frida/
      - id: metadata/library/structure::js-closure-compiled-bundle
      - id: metadata/library/structure/
      - id: metadata/build/bundler::closure-compiler-css-renaming
      - id: well-known/app/development/kilocode::kilo-code-native-runtime

  - id: extension-change
    desc: Renames files to encrypted extensions
    crit: suspicious
    conf: 0.85
    for: [scripts, binaries]
    all:
      - id: rename-functions
      - id: metadata/file/extension/encrypted::encrypted-extensions
    downgrade:
      any:
        - id: objectives/anti-static/obfuscation/code-metrics/structure/
        - id: metadata/package/manifest/runtime::vscode-extension
        # Documented/licensed runtimes (node) reference file extensions + rename
        # without being ransomware; real ransomware ships no help/license text.
        - id: micro-behaviors/ui/help/
  - id: ps-wmi-shadowcopy-delete
    desc: PowerShell deletes Win32_Shadowcopy instances
    crit: suspicious
    conf: 0.96
    attack: T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    all:
      - id: ps-wmi-or-cim-query
      - id: ps-wmi-shadowcopy-class
      - id: ps-shadowcopy-delete-call
    near_lines: 1
  - id: shadow-delete
    desc: Shadow copy deletion (ransomware preparation)
    crit: suspicious
    conf: 0.95
    attack: T1490
    for: [binaries, scripts, source]
    any:
      - id: vssadmin-delete
      - id: wmic-shadowcopy
      - id: dotnet-vssadmin-shadow-delete
      - id: dotnet-wmic-shadowcopy-delete
      - id: wmic-shadowcopy-where-delete
      - id: ps-wmi-shadowcopy-delete
      - id: bcdedit-recovery
      - id: bcdedit-ignore-failures
      - id: wbadmin-delete-systemstate
      - id: wbadmin-delete-catalog
  - id: raccine-and-shadow-prep
    desc: Disables Raccine then deletes shadow copies
    crit: hostile
    conf: 0.99
    attack: T1562.001,T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    all:
      - id: objectives/evasion/anti-av/raccine::raccine-defense-impairment
      - id: shadow-delete
  - id: wipe-delete-after-shadow-prep
    desc: Wipes payload after shadow-copy deletion
    crit: hostile
    conf: 0.99
    attack: T1490,T1070.004
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    all:
      - id: shadow-delete
      - id: objectives/evasion/self-delete/file/wipe::fsutil-zerodata-self-delete
  - id: recovery-inhibition-with-log-clear
    desc: Recovery inhibition with log clearing
    crit: suspicious
    conf: 0.95
    attack: T1490,T1070.001
    for: [binaries, scripts, source]
    all:
      - id: shadow-delete
    any:
      - id: objectives/evasion/indicator-removal/logs::log-clear-windows
      - id: objectives/evasion/indicator-removal/cleanup::windows-indicator-removal
  - id: recovery-and-forensic-history-destruction
    desc: Destroys recovery snapshots, event logs, and NTFS change history
    crit: hostile
    conf: 0.99
    attack: T1490,T1070.001,T1070.004
    platforms: [windows]
    for: [binaries, scripts, source]
    all:
      - id: shadow-delete
      - id: objectives/evasion/indicator-removal/logs::log-clear-windows
      - id: objectives/evasion/indicator-removal/logs::fsutil-usn-deletejournal
  - id: script-ransomware
    desc: Script-based ransomware behavior
    crit: hostile
    conf: 0.95
    all:
      - id: shadow-delete
    any:
      - id: objectives/impact/services/stop::sc-stop
      - id: objectives/impact/services/stop::net-stop
      - id: objectives/impact/degrade/firewall::netsh-firewall-off
      - id: objectives/impact/ransom/encrypt/threat-text::encrypt-comp

  - id: windows-ransomware-process-preparation
    desc: Windows ransomware recovery destruction and process preparation
    crit: hostile
    conf: 0.98
    attack: T1486,T1490
    platforms: [windows]
    for: [source, scripts, binaries]
    all:
      - id: shadow-delete
      - id: micro-behaviors/process/terminate/command::taskkill-sensitive-target-cluster
      - id: objectives/impact/ransom/encrypt/config::ransom-note-text

  - id: windows-ransomware-cleanup-shutdown
    desc: Windows ransomware cleanup and forced shutdown
    crit: hostile
    conf: 0.98
    attack: T1486,T1070.004,T1529
    platforms: [windows]
    for: [source, binaries]
    all:
      - id: windows-ransomware-process-preparation
      - id: micro-behaviors/os/event/shutdown::shutdown-command-source
      - id: micro-behaviors/fs/file/delete::deletefile-a

  - id: windows-ransomware-configured-locker
    desc: Windows XML-configured ransomware locker
    crit: hostile
    conf: 0.98
    attack: T1486,T1490
    platforms: [windows]
    for: [source, scripts, binaries]
    all:
      - id: shadow-delete
      - id: objectives/impact/ransom/encrypt/config::xml-locker-settings-schema
    any:
      - id: objectives/impact/ransom/encrypt/config::ransom-note-text
      - id: objectives/impact/ransom/encrypt/config::encoded-ransom-note-content

  - id: windows-ransomware-admin-preflight
    desc: Windows ransomware administrator preflight
    crit: suspicious
    conf: 0.96
    attack: T1033
    platforms: [windows]
    for: [source, binaries]
    all:
      - id: micro-behaviors/os/privilege/check::admin-sid-check
      - id: micro-behaviors/fs/file/write/redirect::disable-wow64-filesystem-redirection
      - id: objectives/impact/ransom/encrypt/config::xml-locker-settings-schema

  - id: lua-dfcrypt-ransomware
    desc: Lua dfcrypt ransomware workflow
    crit: hostile
    conf: 0.98
    for: [lua]
    all:
      - id: lua-os-remove-call
      - id: lua-os-rename-call
      - id: metadata/file/extension/encrypted::ext-dfcrypt
      - id: decrypt-readme-file
      - id: lua-files-encrypted-msg
  - id: python-file-iteration
    desc: Python file iteration for encryption
    crit: component
    conf: 0.7
    for:
      - python
    any:
      - id: micro-behaviors/fs/directory/traverse::traverse-walk
      - id: micro-behaviors/fs/directory/readdir::readdir-python
  - id: python-overwrite-path
    desc: Python overwrite sink for file encryption
    crit: component
    conf: 0.7
    for:
      - python
    any:
      - id: python-seek-write-truncate
      - id: python-open-rplusb
      - id: python-loop-writeback
  - id: inplace-encrypt
    desc: Python file encryption overwrite workflow
    crit: hostile
    conf: 0.95
    for:
      - python
    all:
      - id: python-file-iteration
      - id: micro-behaviors/fs/read/file::file-open-content
      - id: python-overwrite-path
      - id: micro-behaviors/crypto/symmetric/fernet::encrypt
