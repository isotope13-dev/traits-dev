# Cross-platform ransomware operator controls described in the INC article.
# These are structural command-line switches, not family names: the cluster
# expresses an encryptor that can target shares and stop processes/services.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1486,T1490,T1489

traits:
  - id: encrypt-network-shares-flag
    desc: Ransomware flag to encrypt network shares
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)(^|[\s"''`])--ens([\s"''`]|$)'
    unless:
      - id: metadata/library/structure::js-known-bundler-output
      - id: well-known/tool/development/ganache/

  - id: stop-file-holders-flag
    desc: Ransomware flag to stop file-holding processes
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)(^|[\s"''`])--sup(\s|$|[''"])'
    unless:
      - id: well-known/app/utility/iris::iris-autocomplete-context

  - id: encrypt-hidden-drives-flag
    desc: Hidden-drive encryption flag
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)(^|[\s"''`])--lhd\b'

  - id: process-mask-flag
    desc: Ransomware process-termination mask flag
    crit: suspicious
    conf: 0.94
    if:
      # A termination mask names the processes to kill, so require that shape:
      # a quoted list, a comma-separated list, a wildcarded name, or an
      # executable name. A bare `--proc <word>` is almost always an unrelated
      # CLI option -- util-linux eject documents
      # `-p, --proc  use /proc/mounts instead of /etc/mtab`, whose aligned help
      # text matched on the description, and bubblewrap takes `--proc /proc` to
      # mount a proc filesystem in a sandbox. Requiring a single separator
      # likewise keeps column-aligned usage output from reading as an argument.
      type: text
      regex: '(?i)(^|[\s"''`])--proc[ \t](["''][^"'']{1,80}["'']|\S{0,60}[*?]\S{0,40}|\S{1,36}\.exe)'

  - id: service-mask-flag
    desc: Ransomware service-termination mask flag
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)(^|[\s"''`])--serv\s+("[^"]{1,80}"|''[^'']{1,80}''|\S{1,80})'

composite_rules:
  - id: ransomware-locker-operator-flags
    desc: Ransomware operator flag cluster
    crit: hostile
    conf: 0.98
    needs: 3
    any:
      - id: encrypt-network-shares-flag
      - id: stop-file-holders-flag
      - id: encrypt-hidden-drives-flag
      - id: process-mask-flag
      - id: service-mask-flag
      - id: micro-behaviors/process/argument/option::speed-mode-option

  - id: ransomware-locker-process-service-controls
    desc: Ransomware process and service termination controls
    crit: hostile
    conf: 0.98
    all:
      - id: process-mask-flag
      - id: service-mask-flag
