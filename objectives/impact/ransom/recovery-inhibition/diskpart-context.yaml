# Script contents are unavailable: no partition deletion is inferred.
defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: winre-disable-diskpart-with-trace-destruction
    desc: WinRE disable, DiskPart script, trace destruction
    crit: hostile
    conf: 0.98
    attack: T1490,T1070.001,T1070.004
    all:
      - id: micro-behaviors/fs/disk/partition::diskpart-script-file
      - id: micro-behaviors/os/recovery::reagentc-disable-winre
    any:
      - id: micro-behaviors/fs/delete/secure::cipher-free-space-overwrite
      - id: micro-behaviors/os/event/log::clear-eventlog
