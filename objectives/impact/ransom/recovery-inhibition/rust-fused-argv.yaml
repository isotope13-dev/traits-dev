# Rust binaries store Command::arg literals back to back with no
# separator, so "delete" "shadows" "/all" "/quiet" sit in .rdata as one
# run. Word-boundary patterns written for scripts never match that run.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1490
traits:
  - id: rust-fused-shadow-delete-argv
    desc: Fused delete-shadows argument run
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: deleteshadows\W{0,2}/all\W{0,2}/quiet
      case_insensitive: true
  - id: rust-fused-service-disable-argv
    desc: Fused service stop and disable arguments
    crit: notable
    conf: 0.8
    attack: T1489
    if:
      type: text
      regex: stop\W{0,2}config\W{0,2}start=disabled
      case_insensitive: true
  - id: rust-vss-purge-service-toggle-log
    desc: Logs toggling VSS to purge shadows
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)VSS service to delete shadow copies|VSS service after shadow copies purge'
composite_rules:
  - id: rust-locker-shadow-copy-purge
    desc: Rust locker purges shadow copies and manipulates services
    crit: hostile
    conf: 0.98
    attack: T1490,T1489
    all:
      - id: objectives/impact/ransom/recovery-inhibition::native-vssadmin-delete-pooled-arguments
    any:
      - id: objectives/impact/ransom/recovery-inhibition::rust-vss-purge-service-toggle-log
      - id: objectives/impact/ransom/recovery-inhibition::rust-fused-service-disable-argv
    unless:
      - id: metadata/signed/platform/
  - id: rust-fused-shadow-delete-service-disable
    desc: Deletes shadow copies and disables services
    crit: hostile
    conf: 0.9
    attack: T1490,T1489
    all:
      - id: objectives/impact/ransom/recovery-inhibition::rust-fused-shadow-delete-argv
      - id: objectives/impact/ransom/recovery-inhibition::rust-fused-service-disable-argv
    unless:
      - id: metadata/signed/platform/
