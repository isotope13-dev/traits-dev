# Backup-repository destruction used before ransomware deployment. The
# atomic deletion rule is tied to Windows command grammar and backup-root
# paths; hostile conclusions require independent recovery-destruction steps.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1490

traits:
  - id: windows-backup-repository-recursive-delete
    desc: Recursively deletes a Windows backup repository
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(rd|rmdir)\s+/(s\s+/q|q\s+/s)\s+[A-Z]:\\{1,2}(Veeam)?Backup\b'

composite_rules:
  - id: veeam-backup-recovery-destruction
    desc: Stops Veeam and destroys its repository and Windows recovery data
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/services/stop::veeam-backup-service-stop
      - id: windows-backup-repository-recursive-delete
      - id: objectives/impact/ransom/recovery-inhibition::shadow-copy-delete
      - id: objectives/impact/ransom/recovery-inhibition::wbadmin-delete-catalog

  - id: multi-layer-windows-backup-destruction
    desc: Deletes backup repositories, shadow copies, and backup catalog
    crit: hostile
    conf: 0.99
    all:
      - id: windows-backup-repository-recursive-delete
      - id: objectives/impact/ransom/recovery-inhibition::shadow-copy-delete
      - id: objectives/impact/ransom/recovery-inhibition::wbadmin-delete-catalog
