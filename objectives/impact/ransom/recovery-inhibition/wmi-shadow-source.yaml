defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1490
traits:
  - id: wmi-shadow-query
    desc: WMI shadow copy query in source
    crit: suspicious
    conf: 0.95
    if:
      type: string_literal
      substr: Win32_ShadowCopy
composite_rules:
  - id: wmi-shadow-delete-source
    desc: WMI-based shadow copy deletion in source
    crit: suspicious
    conf: 0.95
    all:
      - id: wmi-shadow-query
      - id: micro-behaviors/os/wmi/manipulate::wmi-delete-instance
    any:
      - id: "metadata/lang/source/naming/declaration::iwbemlocator-type-reference"
      - id: "metadata/lang/source/naming/declaration::iwbemservices-type-reference"
