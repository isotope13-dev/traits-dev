# Batch scripts that switch off Defender realtime protection and delete volume
# shadow copies establish recovery inhibition with defense impairment. Either
# command alone has administrative or cleanup uses, so the composite requires
# both in one script and leaves the atoms neutral.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1490,T1562.001

composite_rules:
  - id: batch-defender-realtime-off-shadow-delete
    desc: Batch disables Defender realtime and deletes shadow copies
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/security/defender/policy::defender-disable-realtime
    any:
      - id: micro-behaviors/fs/volume/shadow-copy::vssadmin-shadow-delete-command
      - id: micro-behaviors/fs/volume/shadow-copy::wmic-shadowcopy-delete-command
    needs: 1
