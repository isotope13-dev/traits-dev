defaults:
  platforms: [windows]
  for: [binaries, source, scripts]
  attack: T1489,T1490

composite_rules:
  - id: service-stop-and-vss-shadow-delete
    desc: Stops Windows services and deletes VSS shadow copies
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/volume/shadow-copy::vssadmin-shadow-delete-command
      - id: micro-behaviors/process/create/exec::child-process-execution
    any:
      - id: micro-behaviors/os/service/stop::control-service-stop-named-call
      - id: micro-behaviors/os/service/stop::control-service-stop-request
      - id: micro-behaviors/os/service/stop::go-service-stop-control
