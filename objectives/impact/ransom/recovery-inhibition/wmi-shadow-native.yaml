defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1490
  crit: suspicious

traits:
  # MSVC can split a wide query between 16-byte vector constants and
  # immediate stack stores. Search the semantic WQL fragments, accepting
  # any nonzero byte key, and require that all three share that key.
  # Require COM setup and the four-argument IWbemServices slot-16 call.
  # The fragments alone are a query, and a vtable slot alone has no identity.
  - id: native-wmi-shadow-delete
    desc: XOR-hidden shadow-copy query and deletion ABI
    conf: 0.95
    if:
      type: yara
      source: |
        import "pe"
        rule native_wmi_shadow_delete {
          strings:
            $select = "SELECT *" wide xor(1-255)
            $from = " FROM Wi" wide xor(1-255)
            $class = "n32_Shad" wide xor(1-255)
            $delete = { (50|51|52|53|54|55|56|57)
                        (50|51|52|53|54|55|56|57)
                        (50|51|52|53|54|55|56|57) FF 75 ??
                        8B (00|01|02|03|06|07)
                        (50|51|52|53|54|55|56|57)
                        FF 50 40 85 C0 78 ?? }
          condition:
            pe.is_32bit() and
            pe.imports("ole32.dll", "CoCreateInstance") and
            pe.imports("ole32.dll", "CoSetProxyBlanket") and
            for any s in pe.sections : (
              s.name == ".text" and
              $delete in (s.raw_data_offset..s.raw_data_offset+s.raw_data_size) and
              for any a in (1..#select) : (
                @select[a] >= s.raw_data_offset and
                @select[a] + 16 <= s.raw_data_offset + s.raw_data_size and
                for any b in (1..#from) : (
                  @from[b] >= s.raw_data_offset and
                  @from[b] + 16 <= s.raw_data_offset + s.raw_data_size and
                  for any c in (1..#class) : (
                    @class[c] >= s.raw_data_offset and
                    @class[c] + 16 <= s.raw_data_offset + s.raw_data_size and
                    uint8(@select[a]+1) == uint8(@from[b]+1) and
                    uint8(@from[b]+1) == uint8(@class[c]+1)
                  )
                )
              )
            )
        }
