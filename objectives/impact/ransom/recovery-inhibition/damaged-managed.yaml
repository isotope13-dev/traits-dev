# Opaque or damaged managed images can retain .NET metadata and wide commands.
defaults:
  for: [data]
  platforms: [windows]
  crit: notable

traits:
  - id: wide-delete-shadows-in-data
    desc: Wide shadow deletion command in data
    if:
      type: hex
      pattern: '76 00 73 00 73 00 61 00 64 00 6D 00 69 00 6E 00 20 00 64 00 65 00 6C 00 65 00 74 00 65 00 20 00 73 00 68 00 61 00 64 00 6F 00 77 00 73 00'
  - id: wide-delete-backup-catalog-in-data
    desc: Wide backup catalog deletion command
    if:
      type: hex
      pattern: '77 00 62 00 61 00 64 00 6D 00 69 00 6E 00 20 00 64 00 65 00 6C 00 65 00 74 00 65 00 20 00 63 00 61 00 74 00 61 00 6C 00 6F 00 67 00'
  - id: managed-encryptor-in-data
    desc: Managed encryptor method in data
    if:
      type: text
      substr: CreateEncryptor

composite_rules:
  - id: opaque-managed-recovery-inhibition
    desc: Managed encryption references with multiple recovery deletion commands
    crit: hostile
    attack: T1490
    all:
      - id: metadata/file/format/managed-runtime::embedded-dotnet-metadata-signature
      - id: wide-delete-shadows-in-data
      - id: wide-delete-backup-catalog-in-data
      - id: managed-encryptor-in-data
      - id: micro-behaviors/crypto/symmetric/aes/reference::rijndael-managed-in-data
