# Ciphertext of "delete shadows /all /quiet", XORed with the 2c b6 98 0e
# dword used by the accompanying x86 decoder. This identifies the embedded
# command; it does not assert that the image itself executes it.
defaults:
  platforms: [windows]
  for: [bmp]
traits:
  - id: bmp-xor-shadow-delete-command
    desc: BMP embeds XOR-obfuscated shadow deletion
    crit: hostile
    conf: 0.99
    if:
      type: hex
      pattern: 'D2 FD 62 49 C2 FD 2E 5F DE F9 6A 43 C1 EB 2E 03 D7 F4 62 0C 99 E9 7B 45 D3 EC'
