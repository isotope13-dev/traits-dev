defaults:
  platforms: [unix, windows]
  for: [scripts, source, documents]
  attack: T1486
traits:
  - id: vssadmin-delete
    desc: Deletes Windows shadow copies with vssadmin
    crit: suspicious
    conf: 0.7
    attack: T1490
    platforms: [windows]
    for: [scripts, source, binaries]
    if:
      type: text
      # Widen the match window past "shadows" so `not:` below can see a
      # trailing /shadow=<id> qualifier.
      # Match both shell command lines and argv builders such as Go
      # exec.Command("vssadmin.exe", "delete", "shadows", ...). Keep each
      # separator short and non-alphanumeric so prose cannot bridge the
      # executable, destructive verb, and VSS object.
      regex: '(?i)\bvssadmin(\.exe)?\W{1,24}delete\W{1,24}shadows\b[^\r\n]{0,40}'
    not:
      # Ransomware nukes every shadow copy on the box (`/all`) to block
      # recovery. Targeting one specific shadow ID is the opposite shape: a
      # tool cleaning up the single snapshot it just created for itself, e.g.
      # impacket's secretsdump.py deletes only the VSS snapshot it made
      # moments earlier to read a locked NTDS.dit (`vssadmin delete shadows
      # /shadow="{<guid>}" /Quiet`), not every shadow copy on the host.
      - regex: '(?i)/shadow\s*='
    unless:
      - id: well-known/lib/runtime/scripted/sandbox-runtime::dangerous-command-registry
      - id: well-known/lib/runtime/scripted/sandbox-runtime::permission-dangerous-command-registry
      - id: metadata/file/naming::generated-attack-map-context
      - id: well-known/tool/offensive/bingo/
      # Impacket's secretsdump.py creates its own temporary VSS snapshot to
      # read the locked NTDS.dit file, then deletes only that snapshot
      # (`/For=%s`, not `/all`) as cleanup. Ransomware never creates a shadow
      # copy first -- it has nothing to gain from making one it is about to
      # destroy -- so the same file also creating a VSS snapshot is a strong
      # tell for "temporary snapshot for locked-file access", not "wipe
      # recovery points before encrypting".
      - id: micro-behaviors/fs/volume/shadow-copy::vssadmin-shadow-create-command
  - id: wmic-shadowcopy
    desc: wmic shadowcopy delete
    crit: suspicious
    conf: 0.7
    attack: T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)\bwmic(\.exe)?\s+shadowcopy\s+delete\b'
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/app/storage/peazip::peazip-zpaq-helper
      - id: well-known/lib/runtime/scripted/sandbox-runtime::dangerous-command-registry
      - id: well-known/lib/runtime/scripted/sandbox-runtime::permission-dangerous-command-registry
  - id: dotnet-vssadmin-image-literal
    desc: .NET metadata references the vssadmin executable
    crit: notable
    conf: 0.9
    attack: T1490
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)^vssadmin(\.exe)?$'
  - id: dotnet-vssadmin-delete-arguments
    desc: .NET vssadmin shadow-delete arguments
    crit: notable
    conf: 0.92
    attack: T1490
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)^delete\s+shadows(\s+/all)?(\s+/quiet)?$'
  - id: dotnet-wmic-shadowcopy-delete-arguments
    desc: .NET WMIC shadow-copy delete arguments
    crit: notable
    conf: 0.92
    attack: T1490
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)^shadowcopy\s+delete$'
  - id: wmic-shadowcopy-where-delete
    desc: WMI shadow copy deletion filtered by ID
    crit: suspicious
    conf: 0.95
    attack: T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)\bwmic(\.exe)?\s+shadowcopy\s+where\s+.{0,180}\bID\s*=\s*["''].{1,120}["'']\s+delete\b'
  - id: ps-wmi-or-cim-query
    desc: WMI/CIM query for a shadow-copy object
    crit: notable
    conf: 0.88
    attack: T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    if:
      type: text
      regex: '(?is)\b(Get-WmiObject|Get-CimInstance)\b.{0,240}\bWin32_Shadowcopy\b'
  - id: ps-wmi-shadowcopy-class
    desc: Win32_Shadowcopy WMI class
    crit: notable
    conf: 0.92
    attack: T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)\bWin32_Shadowcopy\b'
  - id: ps-shadowcopy-delete-call
    desc: PowerShell invokes ShadowCopy Delete
    crit: suspicious
    conf: 0.95
    platforms: [windows]
    for: [powershell]
    if:
      type: text
      regex: '(?is)\bWin32_Shadowcopy\b.{0,240}\.Delete\s*\('
  - id: bcdedit-recovery
    desc: Disables Windows boot recovery with bcdedit
    crit: suspicious
    conf: 0.7
    attack: T1490
    platforms: [windows]
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?i)\bbcdedit(\.exe)?.{0,40}/set.{0,40}\brecoveryenabled.{0,20}\bno\b'
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/app/utility/rufus::rufus-official-context
      - id: metadata/file/naming::generated-attack-map-context
  - id: bcdedit-ignore-failures
    desc: Disables Windows boot failure recovery
    crit: suspicious
    conf: 0.92
    attack: T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)\bbcdedit(\.exe)?.{0,40}/set.{0,40}\bbootstatuspolicy.{0,20}\bignoreallfailures\b'
  - id: wbadmin-delete-systemstate
    desc: wbadmin deletes system backups
    crit: suspicious
    conf: 0.8
    attack: T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)\bwbadmin(\.exe)?\s+delete\s+systemstatebackup\b'
    unless:
      - id: metadata/file/naming::generated-attack-map-context
  - id: wbadmin-delete-catalog
    desc: Deletes Windows backup catalog
    crit: suspicious
    conf: 0.92
    attack: T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)\bwbadmin(\.exe)?\s+delete\s+catalog\b'
    unless:
      - id: metadata/file/naming::generated-attack-map-context
composite_rules:
  - id: dotnet-vssadmin-shadow-delete
    desc: .NET launches vssadmin to delete shadow copies
    crit: suspicious
    conf: 0.97
    attack: T1490
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: dotnet-vssadmin-image-literal
      - id: dotnet-vssadmin-delete-arguments
    unless:
      - id: well-known/lib/runtime/scripted/sandbox-runtime::dangerous-command-registry
      - id: well-known/lib/runtime/scripted/sandbox-runtime::permission-dangerous-command-registry
      - id: metadata/file/naming::generated-attack-map-context
  - id: dotnet-wmic-shadowcopy-delete
    desc: .NET launches WMIC to delete shadow copies
    crit: suspicious
    conf: 0.97
    attack: T1490
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: objectives/impact/ransom/native::dotnet-wmic-image-literal
      - id: dotnet-wmic-shadowcopy-delete-arguments
    unless:
      - id: well-known/lib/runtime/scripted/sandbox-runtime::dangerous-command-registry
      - id: well-known/lib/runtime/scripted/sandbox-runtime::permission-dangerous-command-registry
      - id: metadata/file/naming::generated-attack-map-context
  - id: python-recovery-copy-before-encryption
    desc: Python stages a recovery copy before encryption
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/symmetric/encrypt::python-encrypt-file-call
      - id: micro-behaviors/crypto/symmetric/encrypt::python-pyencryptor-import
      - id: micro-behaviors/fs/file/copy::python-write-file-helper-call
      - id: micro-behaviors/fs/file/copy::python-pycopyer-import
      - id: micro-behaviors/fs/path/application/interpreter::python-multiple-windows-user-paths
  - id: ps-wmi-shadowcopy-delete
    desc: PowerShell deletes Win32_Shadowcopy instances
    crit: suspicious
    conf: 0.96
    attack: T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    all:
      - id: ps-wmi-or-cim-query
      - id: ps-wmi-shadowcopy-class
    any:
      - id: ps-shadowcopy-delete-call
      - id: micro-behaviors/os/wmi/manipulate::remove-wmi-cim-instance
    near_lines: 1
  - id: shadow-delete
    desc: Windows backup or recovery inhibition
    crit: suspicious
    conf: 0.95
    attack: T1490
    for: [binaries, scripts, source]
    any:
      - id: shadow-copy-delete
      - id: bcdedit-recovery
      - id: bcdedit-ignore-failures
      - id: wbadmin-delete-systemstate
      - id: wbadmin-delete-catalog
  - id: shadow-copy-delete
    desc: Deletes Windows Volume Shadow Copies
    crit: suspicious
    conf: 0.97
    attack: T1490
    platforms: [windows]
    for: [binaries, scripts, source]
    any:
      - id: vssadmin-delete
      - id: wmic-shadowcopy
      - id: dotnet-vssadmin-shadow-delete
      - id: dotnet-wmic-shadowcopy-delete
      - id: wmic-shadowcopy-where-delete
      - id: ps-wmi-shadowcopy-delete
  - id: multi-mechanism-recovery-inhibition
    desc: Deletes VSS snapshots and disables boot recovery
    crit: hostile
    conf: 0.99
    attack: T1490
    platforms: [windows]
    for: [scripts, source, binaries]
    all:
      - id: shadow-copy-delete
      - id: bcdedit-recovery
    near_lines: 5
  - id: comprehensive-recovery-inhibition
    desc: Destroys snapshots and boot recovery policies
    crit: hostile
    conf: 0.99
    attack: T1490
    platforms: [windows]
    for: [scripts, source, binaries]
    all:
      - id: shadow-copy-delete
      - id: bcdedit-recovery
      - id: bcdedit-ignore-failures
    near_lines: 6
  - id: recovery-and-defender-impairment
    desc: Destroys recovery mechanisms and stops Microsoft Defender
    crit: hostile
    conf: 0.99
    attack: T1490,T1562.001
    platforms: [windows]
    for: [scripts, source, binaries]
    all:
      - id: vssadmin-delete
      - id: bcdedit-recovery
      - id: objectives/evasion/anti-av/service::defender-service-stop-target
    near_lines: 4
  - id: raccine-and-shadow-prep
    desc: Disables Raccine then deletes shadow copies
    crit: hostile
    conf: 0.99
    attack: T1562.001,T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    all:
      - id: objectives/evasion/anti-av/raccine::raccine-defense-impairment
      - id: shadow-delete
  - id: wipe-delete-after-shadow-prep
    desc: Wipes payload after shadow-copy deletion
    crit: hostile
    conf: 0.99
    attack: T1490,T1070.004
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    all:
      - id: shadow-delete
      - id: objectives/evasion/self-delete/file/wipe::fsutil-zerodata-self-delete
  - id: recovery-inhibition-with-log-clear
    desc: Recovery inhibition with log clearing
    crit: suspicious
    conf: 0.95
    attack: T1490,T1070.001
    for: [binaries, scripts, source]
    all:
      - id: shadow-delete
    any:
      - id: objectives/evasion/indicator-removal/logs::log-clear-windows
      - id: objectives/evasion/indicator-removal/cleanup::windows-indicator-removal
  - id: recovery-and-forensic-history-destruction
    desc: Destroys recovery snapshots, event logs, and NTFS change history
    crit: hostile
    conf: 0.99
    attack: T1490,T1070.001,T1070.004
    platforms: [windows]
    for: [binaries, scripts, source]
    all:
      - id: shadow-delete
      - id: objectives/evasion/indicator-removal/logs::log-clear-windows
      - id: objectives/evasion/indicator-removal/logs::fsutil-usn-deletejournal
  - id: recovery-inhibition-with-service-stop
    desc: Recovery inhibition with service shutdown
    crit: suspicious
    conf: 0.95
    platforms: [windows]
    all:
      - id: shadow-delete
    any:
      - id: objectives/impact/services/stop::sc-stop
      - id: objectives/impact/services/stop::net-stop
      - id: objectives/impact/degrade/firewall::netsh-firewall-off
      - id: objectives/impact/ransom/encrypt/threat-text::encrypt-comp
