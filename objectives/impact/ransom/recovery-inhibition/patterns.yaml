defaults:
  platforms: [unix, windows]
  for: [scripts, source, documents]
  attack: T1486
traits:
  - id: dotnet-vssadmin-delete-arguments
    desc: .NET vssadmin shadow-delete arguments
    crit: notable
    conf: 0.92
    attack: T1490
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)^delete\s+shadows(\s+/all)?(\s+/quiet)?$'
  - id: dotnet-wmic-shadowcopy-delete-arguments
    desc: .NET WMIC shadow-copy delete arguments
    crit: notable
    conf: 0.92
    attack: T1490
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)^shadowcopy\s+delete$'
  - id: wmic-shadowcopy-where-delete
    desc: WMI shadow copy deletion filtered by ID
    crit: suspicious
    conf: 0.95
    attack: T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, go, pe, dll]
    if:
      type: text
      regex: '(?i)\bwmic(\.exe)?\s+shadowcopy\s+where\s+.{0,180}\bID\s*=\s*["''].{1,120}["'']\s+delete\b'
  - id: ps-shadowcopy-delete-call
    desc: PowerShell invokes ShadowCopy Delete
    crit: suspicious
    conf: 0.95
    platforms: [windows]
    for: [powershell]
    if:
      type: text
      regex: '(?is)\bWin32_Shadowcopy\b.{0,240}\.Delete\s*\('
    not:
      # A .Delete() on a snapshot the same flow .Create()d is extraction or
      # backup tooling cleaning up its own artifact (NTDS.dit dumping, VSS
      # helpers), not inhibition of the victim's existing recovery points.
      # Ransomware idioms delete queried/enumerated snapshots untouched.
      - substr: ".Create("
  - id: wbadmin-delete-systemstate
    desc: wbadmin deletes system backups
    crit: suspicious
    conf: 0.8
    attack: T1490
    platforms: [windows]
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?i)\bwbadmin(\.exe)?\s+delete\s+systemstatebackup\b'
    unless:
      - id: metadata/build/generated::generated-attack-map-context
  - id: wbadmin-delete-all-backups
    desc: Deletes Windows backups retaining zero versions
    crit: suspicious
    conf: 0.98
    attack: T1490
    platforms: [windows]
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?i)\bwbadmin(\.exe)?\s+delete\s+backup\s+-keepversions:0(\s|["'']|$)'
  - id: perl-shadow-delete-text
    desc: Perl source deletes volume shadows
    crit: notable
    conf: 0.98
    for: [perl]
    if:
      type: text
      regex: '(?is)vssadmin.{0,120}delete.{0,120}shadows'
  - id: perl-catalog-delete-text
    desc: Perl source deletes the backup catalog
    crit: notable
    conf: 0.98
    for: [perl]
    if:
      type: text
      regex: '(?is)wbadmin.{0,120}DELETE.{0,120}CATALOG'
  - id: perl-recovery-disable-text
    desc: Perl source disables Windows recovery
    crit: notable
    conf: 0.98
    for: [perl]
    if:
      type: text
      regex: '(?i)bcdedit.{0,100}recoveryenabled.{0,20}No'
  - id: perl-eventlog-clear-text
    desc: Perl source clears the System event log
    crit: notable
    conf: 0.98
    for: [perl]
    if:
      type: text
      regex: '(?is)wevtutil.{0,120}["'']?cl["'']?.{0,80}["'']?System'

  - id: jvm-vssadmin-string
    desc: JVM string names vssadmin
    crit: notable
    conf: 0.98
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)^vssadmin(\.exe)?$'
  - id: jvm-wbadmin-string
    desc: JVM string names wbadmin
    crit: notable
    conf: 0.98
    for: [class, java_class]
    # The tool name only. The alternation used to accept a bare `DELETE` or
    # `CATALOG` constant, so every class holding the HTTP method name read as
    # "names wbadmin catalog deletion" (a JNA HVNC RAT's HTTP client, 2026-09).
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)^wbadmin(\.exe)?$'
    unless:
      - id: well-known/tool/development/build/gradle-wrapper::gradle-wrapper-package-class
  - id: jvm-bcdedit-string
    desc: JVM string names bcdedit
    crit: notable
    conf: 0.98
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)^bcdedit(\.exe)?$'
  - id: jvm-wevtutil-string
    desc: JVM string names wevtutil
    crit: notable
    conf: 0.98
    for: [class, java_class]
    # Tool name only: a bare two-letter `cl` constant is not event-log clearing.
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)^wevtutil(\.exe)?$'

  - id: swift-vssadmin-command
    desc: Swift source names vssadmin recovery deletion
    crit: suspicious
    conf: 0.95
    for: [swift]
    platforms: [windows]
    if:
      type: text
      substr: vssadmin
  - id: swift-wbadmin-command
    desc: Swift source names wbadmin recovery deletion
    crit: suspicious
    conf: 0.95
    for: [swift]
    platforms: [windows]
    if:
      type: text
      substr: wbadmin
  - id: swift-bcdedit-command
    desc: Swift source names bcdedit recovery disablement
    crit: suspicious
    conf: 0.95
    for: [swift]
    platforms: [windows]
    if:
      type: text
      substr: bcdedit
  - id: swift-wevtutil-command
    desc: Swift source names wevtutil log clearing
    crit: suspicious
    conf: 0.95
    for: [swift]
    platforms: [windows]
    if:
      type: text
      substr: wevtutil

composite_rules:
  - id: managed-shadow-deletion-with-ransom-demand
    desc: Managed VSS deletion commands with a BTC ransom note
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/impact/ransom/recovery-inhibition::dotnet-vssadmin-delete-arguments
      - id: objectives/impact/ransom/recovery-inhibition::dotnet-wmic-shadowcopy-delete-arguments
      - id: objectives/impact/ransom/keywords::ransom-note-btc-payment-wide
      - id: micro-behaviors/os/security/defender::defender-disable-realtime

  # Two independent shadow-copy deletion command forms in a managed program
  # that also encrypts files and demands payment establish recovery inhibition
  # as part of a ransomware operation, rather than command text alone.
  - id: managed-ransomware-dual-shadow-copy-deletion
    desc: Managed ransomware references VSS and WMIC shadow-copy deletion
    crit: hostile
    conf: 0.98
    attack: T1490,T1486
    all:
      - id: metadata/binary/framework::clr-runtime-header
      - id: objectives/impact/ransom/keywords::ransom-note-btc-payment-wide
      - id: objectives/impact/ransom/recovery-inhibition::dotnet-vssadmin-delete-arguments
      - id: objectives/impact/ransom/recovery-inhibition::dotnet-wmic-shadowcopy-delete-arguments
      - id: micro-behaviors/crypto/encrypt::dotnet-create-encryptor
      - id: micro-behaviors/crypto/cipher::dotnet-cryptostream
      - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token

  - id: perl-multi-mechanism-recovery-inhibition
    desc: Perl package disables Windows recovery
    crit: hostile
    conf: 0.99
    for: [perl, tar, zip]
    scope: archive
    all:
      - id: objectives/impact/ransom/recovery-inhibition::perl-shadow-delete-text
      - id: objectives/impact/ransom/recovery-inhibition::perl-catalog-delete-text
      - id: objectives/impact/ransom/recovery-inhibition::perl-recovery-disable-text
      - id: objectives/impact/ransom/recovery-inhibition::perl-eventlog-clear-text

  - id: jvm-multi-mechanism-recovery-inhibition
    desc: JVM class disables Windows recovery
    crit: hostile
    conf: 0.99
    for: [class, java_class, jar]
    scope: archive
    all:
      - id: objectives/impact/ransom/recovery-inhibition::jvm-vssadmin-string
      - id: objectives/impact/ransom/recovery-inhibition::jvm-wbadmin-string
      - id: objectives/impact/ransom/recovery-inhibition::jvm-bcdedit-string
      - id: objectives/impact/ransom/recovery-inhibition::jvm-wevtutil-string
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode
  - id: dotnet-vssadmin-shadow-delete
    desc: .NET vssadmin shadow-delete command references
    crit: suspicious
    conf: 0.97
    attack: T1490
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/fs/path/basename::vssadmin-executable-name
      - id: dotnet-vssadmin-delete-arguments
    unless:
      - id: well-known/lib/runtime/scripted/sandbox-runtime::dangerous-command-registry
      - id: well-known/lib/runtime/scripted/sandbox-runtime::permission-dangerous-command-registry
      - id: metadata/build/generated::generated-attack-map-context
  - id: dotnet-wmic-shadowcopy-delete
    desc: .NET WMIC shadowcopy-delete command references
    crit: suspicious
    conf: 0.97
    attack: T1490
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/fs/path/basename::wmic-executable-reference
      - id: dotnet-wmic-shadowcopy-delete-arguments
    unless:
      - id: well-known/lib/runtime/scripted/sandbox-runtime::dangerous-command-registry
      - id: well-known/lib/runtime/scripted/sandbox-runtime::permission-dangerous-command-registry
      - id: metadata/build/generated::generated-attack-map-context
  - id: python-recovery-copy-before-encryption
    desc: Python stages a recovery copy before encryption
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/symmetric/encrypt::python-encrypt-file-call
      - id: micro-behaviors/crypto/symmetric/encrypt::python-pyencryptor-import
      - id: micro-behaviors/fs/write/file/handle::python-write-file-helper-call
      - id: metadata/import/package::python-pycopyer-import
      - id: micro-behaviors/fs/path/application/interpreter::python-multiple-windows-user-paths
  - id: ps-wmi-shadowcopy-delete
    desc: PowerShell deletes Win32_Shadowcopy instances
    crit: suspicious
    conf: 0.96
    attack: T1490
    platforms: [windows]
    for: [scripts, source, binaries]
    all:
      - id: micro-behaviors/os/wmi/query::shadowcopy-cmdlet-query
      - id: micro-behaviors/os/wmi/query::shadowcopy-class-reference
    any:
      - id: ps-shadowcopy-delete-call
      - id: micro-behaviors/os/wmi/manipulate::remove-wmi-cim-instance
    near_lines: 1
  # Bun and Rust test suites quote destructive commands as assertion inputs.
  - id: test-assertion-harness-contexts
    desc: Test assertion harness quoting attack inputs
    crit: exception
    conf: 0.95
    any:
    - id: metadata/package/testing/harness/runtime::bun-assertion-suite
    - id: metadata/package/testing/harness/unit::rust-test
    - id: metadata/package/testing/harness/unit::selftest-verdict-vector-table
  - id: recovery-and-defender-impairment
    desc: Destroys recovery mechanisms and stops Microsoft Defender
    crit: hostile
    conf: 0.99
    attack: T1490,T1562.001
    platforms: [windows]
    for: [scripts, source, binaries]
    all:
      - id: objectives/impact/degrade/system/recovery::vssadmin-delete
      - id: objectives/impact/degrade/system/recovery::bcdedit-recovery
    any:
      - id: objectives/impact/degrade/services::defender-service-stop-target
      - id: objectives/impact/degrade/services::defender-service-stop-target-native
    near_lines: 4
  - id: raccine-and-shadow-prep
    desc: Disables Raccine then deletes shadow copies
    crit: hostile
    conf: 0.99
    attack: T1562.001,T1490
    platforms: [windows]
    for: [batch, powershell, python, javascript, pe, dll]
    all:
      - id: objectives/evasion/anti-av/raccine::raccine-defense-impairment
      - id: objectives/impact/degrade/system/recovery::shadow-delete
  - id: reflective-loader-marker-shadow-delete
    desc: ReflectiveLoader marker and shadow deletion
    crit: hostile
    conf: 0.98
    attack: T1490,T1027.003,T1620
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: micro-behaviors/dylib/load/runtime::reflective-loader-name-string
      - id: objectives/impact/degrade/system/recovery::shadow-copy-delete

  - id: reflective-loader-marker-vssadmin-delete
    desc: ReflectiveLoader marker and vssadmin deletion
    crit: hostile
    conf: 0.98
    attack: T1490,T1027.003,T1620
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: micro-behaviors/dylib/load/runtime::reflective-loader-name-string
      - id: objectives/impact/degrade/system/recovery::vssadmin-delete

  - id: wipe-delete-after-shadow-prep
    desc: Wipes payload after shadow-copy deletion
    crit: hostile
    conf: 0.99
    attack: T1490,T1070.004
    platforms: [windows]
    for: [batch, powershell, python, javascript, pe, dll]
    all:
      - id: objectives/impact/degrade/system/recovery::shadow-delete
      - id: objectives/evasion/self-delete/file/wipe::fsutil-zerodata-self-delete
  - id: winre-disable-free-space-wipe-and-log-clear
    desc: Disables WinRE, overwrites recoverable data, and clears event logs
    crit: hostile
    conf: 0.99
    attack: T1490,T1070.001,T1070.004
    platforms: [windows]
    for: [binaries, scripts, source]
    all:
      - id: micro-behaviors/os/recovery::reagentc-disable-winre
      - id: micro-behaviors/fs/delete/secure::cipher-free-space-overwrite
      - id: micro-behaviors/os/event/log::windows-eventlog-clear-command-reference
  - id: winre-disable-with-log-clear
    desc: Disables WinRE and clears Windows event logs
    crit: hostile
    conf: 0.97
    attack: T1490,T1070.001
    platforms: [windows]
    for: [binaries, scripts, source]
    all:
      - id: micro-behaviors/os/recovery::reagentc-disable-winre
      - id: micro-behaviors/os/event/log::windows-eventlog-clear-command-reference
  - id: recovery-and-forensic-history-destruction
    desc: Destroys recovery snapshots, event logs, and NTFS change history
    crit: hostile
    conf: 0.99
    attack: T1490,T1070.001,T1070.004
    platforms: [windows]
    for: [binaries, scripts, source]
    all:
      - id: objectives/impact/degrade/system/recovery::shadow-delete
      - id: micro-behaviors/os/event/log::windows-eventlog-clear-command-reference
      - id: micro-behaviors/fs/delete/file/command::fsutil-usn-deletejournal
  - id: swift-multi-mechanism-recovery-inhibition
    desc: Swift disables recovery and clears event logs
    crit: hostile
    conf: 0.99
    for: [swift, zip, tar]
    platforms: [windows]
    scope: archive
    attack: T1490,T1070.001
    all:
      - id: swift-vssadmin-command
      - id: swift-wbadmin-command
      - id: swift-bcdedit-command
      - id: swift-wevtutil-command
      - id: micro-behaviors/process/create/subprocess::swift-source-process-run
