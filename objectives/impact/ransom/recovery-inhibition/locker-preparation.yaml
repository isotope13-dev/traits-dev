# A locker prepares the machine so the victim cannot recover or intervene:
# deleting shadow copies and disabling Windows Recovery are the recovery
# half; taking ownership of protected files and disabling Task Manager are
# the lock-in half. Each is a lone admin action; the four together are the
# preparation of a ransomware or screen locker.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1490,T1562.001
composite_rules:
  - id: shadow-delete-winre-disable-takeown-taskmgr-lock
    desc: Deletes recovery, takes ownership, disables Task Manager
    crit: hostile
    conf: 0.93
    all:
      - id: objectives/impact/ransom/recovery-inhibition::vssadmin-delete
      - id: micro-behaviors/os/recovery::reagentc-disable-winre
      - id: micro-behaviors/fs/chown::takeown-file-command
      - id: micro-behaviors/os/registry/keys/policy::disable-taskmgr
    unless:
      - id: metadata/signed/platform/
