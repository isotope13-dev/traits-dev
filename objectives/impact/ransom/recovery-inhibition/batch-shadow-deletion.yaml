defaults:
  platforms: [windows]
  for: [batch]
  attack: T1490
traits:
  - id: batch-vssadmin-delete-all-shadows
    desc: Deletes all volume shadow copies with vssadmin
    crit: suspicious
    conf: 0.96
    if:
      type: value
      path: source.batch.command_sites[*].text
      regex: '(?i)^vssadmin(\.exe)?\s+delete\s+shadows\b[^\r\n]{0,100}/all\b'
