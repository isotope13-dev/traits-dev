# Shadow-copy removal alongside browser-store and LSASS collection indicates
# recovery inhibition in a credential-theft operation, not ordinary cleanup.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1490,T1003.001,T1555.003

composite_rules:
  - id: powershell-credential-theft-with-shadow-delete
    desc: PowerShell credential theft with shadow-copy deletion
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/theft/multi-store::browser-and-lsass-credential-dump
      - id: objectives/impact/ransom/recovery-inhibition::ps-wmi-shadowcopy-delete
    near_lines: 10
