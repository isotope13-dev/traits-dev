defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: native-vssadmin-delete-pooled-arguments
    desc: Native image pools shadow-delete command words
    crit: suspicious
    conf: 0.94
    if:
      type: yara
      source: |
        import "pe"
        rule pooled_shadow_delete_arguments {
          strings:
            $program = "vssadmin" ascii
            $verb = "delete" ascii
            $target = "shadows" ascii
            $all = "/all" ascii
            $quiet = "/quiet" ascii
          condition:
            for any s in pe.sections : (
              s.name == ".rdata" and
              for all of them : (
                $ in (s.raw_data_offset .. s.raw_data_offset+s.raw_data_size-1)
              )
            )
        }
composite_rules:
  - id: go-ransom-split-shadow-deletion
    desc: Ransomware shadow-delete words and matching Go command layout
    crit: hostile
    conf: 0.97
    attack: T1490
    all:
      - id: native-vssadmin-delete-pooled-arguments
      - id: metadata/binary/code/arguments::go-four-shadow-delete-argument-lengths
      - id: objectives/impact/ransom/native::ransom-note-msg
