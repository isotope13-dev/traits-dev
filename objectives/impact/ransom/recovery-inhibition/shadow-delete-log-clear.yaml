# Deleting every shadow copy and clearing event logs are the recovery and
# forensic halves of a ransomware or wiper run. The two literal command lines
# together, with no detection-catalog context, are worth triage; either alone
# is routine administration.
defaults:
  platforms: [windows]
  for: [scripts, source]
  attack: T1490,T1070.001
composite_rules:
  - id: shadow-delete-with-eventlog-clear
    desc: Shadow-copy deletion paired with event-log clearing
    crit: suspicious
    conf: 0.9
    near_lines: 20
    all:
      - id: micro-behaviors/fs/volume/shadow-copy::vssadmin-shadow-delete-command
      - id: micro-behaviors/os/event/log::wevtutil-clear-log-command
    unless:
      - id: well-known/tool/forensics/forensicnomicon::forensicnomicon-context
      - id: metadata/file/catalog/threat-pattern::scan-report-quoted-code
    downgrade:
      any:
        - id: metadata/package/testing/corpus/security-tests/command::pytest-system-tool-policy-case
