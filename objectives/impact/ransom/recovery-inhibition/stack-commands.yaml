# Decoded x86 stack stores reconstruct shadow-copy removal commands. The
# strings alone remain suspicious; ransomware plus shell execution establishes
# the hostile recovery-inhibition profile. Displacements and IATs are unpinned.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  attack: T1490
traits:
  - id: x86-stack-shadowcopy-delete-command
    desc: x86 constructs shadowcopy delete command
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: 'C7 (44 24 ??|45 ??|84 24 ?? ?? ?? ??|85 ?? ?? ?? ??) 73 00 68 00 C7 (44 24 ??|45 ??|84 24 ?? ?? ?? ??|85 ?? ?? ?? ??) 61 00 64 00 C7 (44 24 ??|45 ??|84 24 ?? ?? ?? ??|85 ?? ?? ?? ??) 6F 00 77 00 C7 (44 24 ??|45 ??|84 24 ?? ?? ?? ??|85 ?? ?? ?? ??) 63 00 6F 00 C7 (44 24 ??|45 ??|84 24 ?? ?? ?? ??|85 ?? ?? ?? ??) 70 00 79 00 C7 (44 24 ??|45 ??|84 24 ?? ?? ?? ??|85 ?? ?? ?? ??) 20 00 64 00 C7 (44 24 ??|45 ??|84 24 ?? ?? ?? ??|85 ?? ?? ?? ??) 65 00 6C 00 C7 (44 24 ??|45 ??|84 24 ?? ?? ?? ??|85 ?? ?? ?? ??) 65 00 74 00 C7 (44 24 ??|45 ??|84 24 ?? ?? ?? ??|85 ?? ?? ?? ??) 65 00 00 00'
  - id: x86-stack-vssadmin-delete-shadows-command
    desc: x86 constructs vssadmin delete shadows command
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: 'C7 (44 24 ??|45 ??|84 24 ?? ?? ?? ??|85 ?? ?? ?? ??) 20 00 76 00 C7 (44 24 ??|45 ??|84 24 ?? ?? ?? ??|85 ?? ?? ?? ??) 73 00 73 00 C7 (44 24 ??|45 ??|84 24 ?? ?? ?? ??|85 ?? ?? ?? ??) 61 00 64 00 C7 (44 24 ??|45 ??|84 24 ?? ?? ?? ??|85 ?? ?? ?? ??) 6D 00 69 00 C7 (44 24 ??|45 ??|84 24 ?? ?? ?? ??|85 ?? ?? ?? ??) 6E 00 20 00 C7 (44 24 ??|45 ??|84 24 ?? ?? ?? ??|85 ?? ?? ?? ??) 64 00 65 00 C7 (44 24 ??|45 ??|84 24 ?? ?? ?? ??|85 ?? ?? ?? ??) 6C 00 65 00 C7 (44 24 ??|45 ??|84 24 ?? ?? ?? ??|85 ?? ?? ?? ??) 74 00 65 00 C7 (44 24 ??|45 ??|84 24 ?? ?? ?? ??|85 ?? ?? ?? ??) 20 00 73 00 C7 (44 24 ??|45 ??|84 24 ?? ?? ?? ??|85 ?? ?? ?? ??) 68 00 61 00 C7 (44 24 ??|45 ??|84 24 ?? ?? ?? ??|85 ?? ?? ?? ??) 64 00 6F 00 C7 (44 24 ??|45 ??|84 24 ?? ?? ?? ??|85 ?? ?? ?? ??) 77 00 73 00'
composite_rules:
  - id: native-ransomware-stack-shadow-removal
    desc: Ransomware with stack-built shadow removal and shell APIs
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/ransom/encrypt/capi::capi-rsaenh-file-encryptor
      - id: micro-behaviors/process/create/shellexec::shell-execute
    any:
      - id: x86-stack-shadowcopy-delete-command
      - id: x86-stack-vssadmin-delete-shadows-command
