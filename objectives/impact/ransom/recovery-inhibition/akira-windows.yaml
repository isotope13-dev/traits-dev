defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1490,T1486

composite_rules:
  - id: ransomware-shadowcopy-removal
    desc: Data-theft ransomware removes Windows shadow copies
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/ransom/native::company-data-theft-claim
      - id: micro-behaviors/fs/volume/shadow-copy::powershell-wmi-shadowcopy-pipeline
