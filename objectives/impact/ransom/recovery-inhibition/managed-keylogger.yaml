defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1490
composite_rules:
  # File-scoped evidence of recovery tampering in an established recorder.
  # These references do not bind a particular key handle to a delete call or
  # establish that deletion succeeds. In the reviewed CIL, OpenSubKey on
  # SafeBoot feeds DeleteSubKeyTree("Minimal") and ("Network").
  - id: managed-keylogger-safeboot-delete-references
    desc: Keylogger with SafeBoot and registry-tree deletion references
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/registry/keys/policy::safeboot-base-regpath
      - id: micro-behaviors/os/registry/delete::managed-registry-subtree-delete-references
    any:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: objectives/collection/keylog/hook::managed-low-level-hook-file-keylogger

  - id: managed-keylogger-shadow-copy-deletion
    desc: Keylogger with VSS and WMIC shadow deletion
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/ransom/recovery-inhibition::dotnet-vssadmin-shadow-delete
      - id: objectives/impact/ransom/recovery-inhibition::dotnet-wmic-shadowcopy-delete-arguments

    any:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: objectives/collection/keylog/hook::managed-low-level-hook-file-keylogger
