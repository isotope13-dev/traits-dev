defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1486
  mbc: E1486
  size_min: 256
  size_max: 1048576
traits:
  - id: ps-target-files-variable
    desc: PowerShell target file list variable
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "$TargetFiles"
  - id: ps-recursive-targetpath-enumeration
    desc: PowerShell recursive TargetPath enumeration
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'get-childitem\s+-path\s+\$TargetPath\\\*'
  - id: ps-locked-extension-append
    desc: PowerShell appends locked extension
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\$file\.Name\s*\+\s*["'']\.locked["'']'
      case_insensitive: true
  - id: ps-ransom-extension-literal
    desc: PowerShell appends ransom extension
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\$file\.Name\s*\+\s*["'']\.(ransom|crypt)["'']'
      case_insensitive: true
  - id: ps-enc-extension-append
    desc: PowerShell appends enc extension
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\$file\.Name\s*\+\s*["'']\.enc["'']'
      case_insensitive: true
  - id: ps-ransom-desktop-sweep
    desc: PowerShell sweeps user desktops
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: 'get-childitem\s+["'']C:\\users["''][\s\S]{0,240}\\desktop\\'
      case_insensitive: true
  - id: ps-ransom-rename-item-suffix
    desc: Renames files with a ransom suffix
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\$file\.Name\s*\+\s*["'']\.[A-Za-z0-9_]{3,}["'']'
composite_rules:
  - id: ps-ransom-extension-append
    desc: PowerShell appends ransomware extension
    crit: suspicious
    conf: 0.9
    any:
      - id: objectives/impact/ransom/encrypt/filesystem::ps-encrypted-extension-append
      - id: ps-locked-extension-append
      - id: ps-ransom-extension-literal
      - id: ps-enc-extension-append
      - id: ps-ransom-rename-item-suffix
  - id: ps-ransomware-recursive-targeting
    desc: PowerShell recursive ransomware targeting
    crit: suspicious
    conf: 0.94
    all:
      - id: ps-recursive-targetpath-enumeration
      - id: ps-target-files-variable
  - id: ps-ransomware-suffix-source-removal
    desc: PowerShell encrypted suffix source removal
    crit: suspicious
    conf: 0.94
    all:
      - id: objectives/impact/ransom/encrypt/filesystem::ps-encrypted-extension-default
      - id: objectives/impact/ransom/encrypt/filesystem::ps-remove-source-after-encrypt
