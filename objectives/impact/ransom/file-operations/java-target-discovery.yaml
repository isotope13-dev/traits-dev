# Java ransomware target inventory: this stage selects and scores candidate
# files, but does not perform encryption itself.
defaults:
  platforms: [unix, windows]
  for: [java]
  attack: T1486

traits:
  - id: java-ransomware-targets-user-home
    desc: Starts file search at user home
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'System\s*\.\s*getProperty\s*\(\s*["'']user\.home["'']\s*\)'

  - id: java-ransomware-recurses-file-tree
    desc: Recursively traverses file directories
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'traverse\s*\(\s*f\s*\.\s*getAbsolutePath\s*\(\s*\)\s*\)'

  - id: java-ransomware-filters-target-extensions
    desc: Filters files by configured target extensions
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: allowedFiles.contains

  - id: java-ransomware-normalizes-target-extension
    desc: Uppercases file extensions for target filtering
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'fileType\s*\.\s*toUpperCase\s*\(\s*\)'

  - id: java-ransomware-scores-target-files
    desc: Scores selected files before processing
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'calculateBeta\s*\(\s*f\s*\)'

  - id: java-ransomware-writes-target-inventory
    desc: Writes target paths and scores to file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'fileWriter\s*\.\s*write\s*\('

  - id: java-ransomware-records-target-path
    desc: Records absolute paths for selected files
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'f\s*\.\s*getAbsolutePath\s*\(\s*\)'

composite_rules:
  - id: java-ransomware-target-inventory
    desc: Java ransomware candidate file inventory
    crit: suspicious
    conf: 0.97
    all:
      - id: java-ransomware-targets-user-home
      - id: java-ransomware-recurses-file-tree
      - id: java-ransomware-filters-target-extensions
      - id: java-ransomware-normalizes-target-extension
      - id: java-ransomware-scores-target-files
      - id: java-ransomware-writes-target-inventory
      - id: java-ransomware-records-target-path
    near_bytes: 1800
