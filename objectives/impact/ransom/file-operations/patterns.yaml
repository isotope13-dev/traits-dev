defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - documents
  attack: T1486
traits:
- id: lua-os-remove-call
  desc: Lua removes original ransom target
  crit: notable
  conf: 0.9
  for:
  - lua
  if:
    type: text
    substr: os.remove(input_path)
- id: lua-os-rename-call
  desc: Lua renames target to dfcrypt
  crit: notable
  conf: 0.92
  for:
  - lua
  if:
    type: text
    substr: os.rename(output_path, input_path .. ".dfcrypt")
- id: python-skip-self-and-key
  desc: Python skips script and key file
  crit: notable
  conf: 0.82
  for:
  - python
  if:
    type: text
    regex: file == ['"][^"'\\]{1,32}\.py['"] or file == ['"][^"'\\]{1,32}\.key['"]
composite_rules:
- id: file-iteration
  desc: File iteration functions
  crit: component
  conf: 0.5
  for:
  - scripts
  - binaries
  any:
  - id: micro-behaviors/fs/directory/readdir/language::node-readdir-sync-call
  - id: micro-behaviors/fs/directory/traverse::js-walk-sync-call
  - id: metadata/lang/natural/vocabulary/content-word::glob-word-literal
  - id: micro-behaviors/fs/directory/traverse::traverse-walk
- id: file-write-functions
  desc: File write functions
  crit: component
  conf: 0.4
  for:
  - scripts
  - binaries
  any:
  - id: micro-behaviors/fs/write/file/full/unspecified::write-file-sync
  - id: micro-behaviors/fs/write/file/full/unspecified::write-file-async
  - id: micro-behaviors/data/embedded/script::python-open-write-in-string
- id: extension-change
  desc: Renames files to encrypted extensions
  crit: suspicious
  conf: 0.85
  for:
  - shell
  - batch
  - python
  all:
  - id: micro-behaviors/fs/file/rename::language-file-rename
  - id: metadata/file/extension/encrypted::encrypted-extensions
  downgrade:
    any:
    - id: objectives/anti-static/obfuscation/string/reconstruct/indexed::lua-nested-escaped-string-reassembly
    - id: metadata/package/runtime::vscode-extension
- id: python-file-iteration
  desc: Python file iteration for encryption
  crit: component
  conf: 0.7
  for:
  - python
  any:
  - id: micro-behaviors/fs/directory/traverse::traverse-walk
  - id: micro-behaviors/fs/directory/readdir/language::readdir-python
