# Ransomware file encryption patterns
# Detects drive enumeration + crypto + file operations characteristic of ransomware
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # === Drive encryption targeting ===
  - id: volume-targeting-ransomware
    desc: Ransom threats with volume-encryption APIs
    crit: hostile
    conf: 0.95
    attack: "T1486"
    mbc: "C0027"
    size_max: 1048576
    all:
      - id: micro-behaviors/fs/enumerate/volume::find-first-volume
      - id: micro-behaviors/crypto/encrypt::native-encryption-api
      - id: objectives/impact/ransom/encrypt/threat-text::ransom-demand-or-file-threat-wording
    # Two or more distinct file operations, inline rather than a named helper:
    # on its own the roll-up said only "this program touches files".
    any:
      - id: micro-behaviors/fs/file/move::move-file-ex
      - id: micro-behaviors/fs/delete/file/
      - id: micro-behaviors/fs/directory/readdir::find-first-file
    needs: 2
    unless:
      - id: well-known/app/infrastructure/vmware-disklib::vmware-disklib-context
