# Ransomware file encryption patterns
# Detects drive enumeration + crypto + file operations characteristic of ransomware
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # === Helper rules for crypto capabilities ===
  - id: has-crypto-capability
    desc: Has data-encryption API capability
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/crypto/library/provider::crypt-encrypt
      - id: micro-behaviors/crypto/symmetric/aes/cng::bcrypt-encrypt-api
      - id: micro-behaviors/crypto/symmetric/encrypt::symmetric-encryption-operation
  # NOTE: This is an internal helper rule used by ransomware composites.
  # Keep as a component so it does not show up by itself.
  - id: has-file-operations
    desc: Has file operation capabilities
    crit: component
    conf: 0.8
    any:
      - id: micro-behaviors/fs/file/move::move-file-ex
      - id: micro-behaviors/fs/file/delete/
      - id: micro-behaviors/fs/enumerate/directory::find-first-file
    needs: 2
  # === Drive encryption targeting ===
  - id: volume-targeting-ransomware
    desc: Volume enumeration with encryption and file operations
    crit: hostile
    conf: 0.95
    attack: "T1486"
    mbc: "C0027"
    size_max: 1048576
    all:
      - id: micro-behaviors/fs/enumerate/volume::find-first-volume
      - id: has-crypto-capability
      - id: has-file-operations
    downgrade:
      any:
        - id: metadata/binary/metrics/structural::many-exports
        - id: metadata/package/versioning::pe-version-resource
    unless:
      - id: well-known/app/infrastructure/vmware-disklib::vmware-disklib-context
