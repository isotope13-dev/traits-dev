# Locker that renames a victim's files into a private extension and registers
# that extension with its own icon (no encryption needed to make files unusable
# and to mark them as "locked"). Each leg alone is common: installers register
# file types, and utilities rename files. A managed sweep that renames user
# files together with a freshly registered extension class is a ransomware-style
# marker, so the composite requires both legs in one assembly.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1486
  mbc: C0027

traits:
  - id: hkcu-custom-extension-class-key
    desc: Registry class key for a custom extension
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'Software\\Classes\\\.[A-Za-z0-9_]{3,16}\b'

  - id: hkcu-progid-default-icon-key
    desc: Registry ProgID DefaultIcon key
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'Software\\Classes\\[A-Za-z0-9_.]{3,40}\\DefaultIcon'

  - id: managed-enumerate-files-name
    desc: Managed file-enumeration method name
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\b(EnumerateFiles|GetFiles)\b'

  - id: user-downloads-folder-name
    desc: User Downloads folder name
    crit: baseline
    conf: 0.8
    if:
      type: text
      exact: Downloads

composite_rules:
  - id: custom-extension-class-registration
    desc: Registers a custom file extension with its own icon
    crit: notable
    conf: 0.85
    all:
      - id: hkcu-custom-extension-class-key
      - id: hkcu-progid-default-icon-key
      - id: micro-behaviors/os/registry/create::dotnet-registry-create-subkey-member

  - id: managed-user-folder-file-rename-sweep
    desc: Enumerates files in Downloads and renames them
    crit: notable
    conf: 0.8
    all:
      - id: managed-enumerate-files-name
      - id: user-downloads-folder-name
      - id: micro-behaviors/fs/file/move::dotnet-file-move-call

  - id: managed-extension-takeover-rename
    desc: Renames user files into a newly registered extension
    crit: hostile
    conf: 0.9
    all:
      - id: custom-extension-class-registration
      - id: managed-user-folder-file-rename-sweep
