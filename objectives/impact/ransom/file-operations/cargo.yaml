# Migrated from the mixed Cargo package profile; the destination names the required claim.
defaults:
  platforms: [unix, windows]
  for: [cargo.toml]

composite_rules:
- id: cargo-ransomware-file-walk
  desc: Cargo ransomware walks filesystem
  crit: suspicious
  conf: 0.88
  all:
  - id: metadata/package/name/convention::cargo-package-name-ransomware
  - id: metadata/package/dependencies/manifest/presence::cargo-dep-walkdir
