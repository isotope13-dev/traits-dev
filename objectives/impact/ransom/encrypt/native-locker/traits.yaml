# Generalized native file-encryptor behavior inspired by cross-platform
# lockers that use the same public-key-wrapped AEAD design on Windows and
# Linux/ESXi. The rules intentionally avoid family names, ransom-note text,
# fixed extensions, and published hashes.
defaults:
  platforms: [linux, windows]
  for: [pe, elf, c, cpp, rust, go]
  attack: T1486
  mbc: B0040

traits:

  - id: percentage-encryption-setting
    desc: Percentage-based encryption setting
    # The token pair also occurs in benign native sampling/compression code.
    # It is only intent evidence when joined with the native encryption chain.
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)percentage.{0,64}(encrypt|chunk)|encrypt.{0,64}percentage'

  - id: chunk-sizing-after-encryption
    desc: Chunk sizing after encryption term
    crit: component
    conf: 0.86
    for: [source]
    if:
      type: text
      # A generic chunk-size parameter is common in digest, compression, and
      # network streaming code.  Match it only near encryption vocabulary;
      # the reverse-order atom below covers the other source layout.
      regex: '(?is)(encrypt|decrypt|cipher|aes|chacha).{0,96}\bchunk([-_ ]?(size|len|length)|sized)\b'

  - id: chunk-sizing-before-encryption
    desc: Chunk sizing before encryption term
    crit: component
    conf: 0.86
    for: [source]
    if:
      type: text
      regex: '(?is)\bchunk([-_ ]?(size|len|length)|sized)\b.{0,96}(encrypt|decrypt|cipher|aes|chacha)'

  - id: block-sizing-after-encryption
    desc: Block sizing after encryption term
    crit: component
    conf: 0.86
    for: [source]
    if:
      type: text
      regex: '(?is)(encrypt|decrypt|cipher|aes|chacha).{0,96}\bblock([-_ ]?(size|len|length)|sized)\b'

  - id: block-sizing-before-encryption
    desc: Block sizing before encryption term
    crit: component
    conf: 0.86
    for: [source]
    if:
      type: text
      regex: '(?is)\bblock([-_ ]?(size|len|length)|sized)\b.{0,96}(encrypt|decrypt|cipher|aes|chacha)'

composite_rules:
  - id: xchacha-file-crypto
    desc: XChaCha20 file-encryption primitive
    crit: suspicious
    conf: 0.95
    any:
      - id: micro-behaviors/crypto/symmetric/stream::xchacha20-poly1305-api
      - id: micro-behaviors/crypto/symmetric/stream::xchacha20-poly1305-reference

  - id: curve25519-key-wrapping
    desc: Curve25519 file-key wrapping primitive
    crit: suspicious
    conf: 0.95
    any:
      - id: micro-behaviors/crypto/asymmetric/curve25519::curve25519-xsalsa20-poly1305-api
      - id: micro-behaviors/crypto/asymmetric/curve25519::curve25519-xsalsa20-poly1305-reference

  - id: encrypted-file-lock-sidecar
    desc: Encryption routine formats a per-file lock sidecar
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/lock/file::printf-lock-sidecar-format
      - id: micro-behaviors/fs/file/encrypt::native-file-encryption-routine

  - id: encrypted-file-journal-sidecar
    desc: Encryption routine formats a per-file journal sidecar
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/lock/file::printf-journal-sidecar-format
      - id: micro-behaviors/fs/file/encrypt::native-file-encryption-routine

  - id: partial-random-chunk-encryption
    desc: Percentage-based random chunk encryption
    crit: suspicious
    conf: 0.94
    all:
      - id: percentage-encryption-setting
      - id: micro-behaviors/os/random/prng/stdlib::go-math-rand-int-call
      - id: chunk-sizing
      - id: micro-behaviors/fs/file/encrypt::native-file-encryption-routine
    unless:
      # Go's SSH forwarding tests intentionally send random-sized chunks over
      # a socket; that is transport testing, not file encryption.
      - id: metadata/package/testing/presence/harness::go-test-file

  - id: chunk-sizing
    desc: Encryption-related chunk or block sizing
    crit: component
    conf: 0.86
    any:
      - id: chunk-sizing-after-encryption
      - id: chunk-sizing-before-encryption
      - id: block-sizing-after-encryption
      - id: block-sizing-before-encryption

  - id: native-cross-platform-file-encryptor
    desc: Native public-key-wrapped AEAD file encryptor
    crit: hostile
    conf: 0.99
    all:
      - id: xchacha-file-crypto
      - id: curve25519-key-wrapping
      - id: micro-behaviors/fs/file/encrypt::native-file-encryption-routine
    any:
      - id: encrypted-file-lock-sidecar
      - id: encrypted-file-journal-sidecar
      - id: partial-random-chunk-encryption
    needs: 2

  - id: pre-encryption-process-service-disruption
    desc: File encryptor kills processes and services
    crit: hostile
    conf: 0.99
    all:
      - id: native-cross-platform-file-encryptor
      - id: micro-behaviors/process/terminate/kill::terminate-process-source
      - id: micro-behaviors/os/service/control::control-service

  - id: operator-gated-debugger-resistant-locker
    desc: Operator-gated file encryptor with watchdog
    crit: hostile
    conf: 0.99
    all:
      - id: native-cross-platform-file-encryptor
      - id: objectives/anti-analysis/environment-detect/check::hex-secret-digest-gate
      - id: objectives/anti-analysis/debugger-detect/check::debugger-text-integrity-watchdog

  - id: esxi-detached-volume-locker
    desc: Detached ESXi volume encryptor
    crit: hostile
    conf: 0.99
    platforms: [linux]
    for: [c, cpp, elf]
    all:
      - id: native-cross-platform-file-encryptor
      - id: micro-behaviors/os/sysinfo/vmware::vmfs-path
      - id: micro-behaviors/os/sysinfo/vmware::vmware-welcome-path
      - id: micro-behaviors/process/daemonize/detach::setsid-call
