# Cross-language source shape for lockers that combine an encrypted suffix
# with a per-directory ransom note.  The article gives the concrete filename
# and suffix, while these rules generalize their structure instead of naming a
# ransomware family.
defaults:
  platforms: [windows, unix]
  for: [source, binaries]
  attack: T1486
  mbc: B0040

traits:
  - id: encrypted-suffix-variable
    desc: Encrypted filename suffix variable
    crit: component
    conf: 0.94
    for: [source, scripts]
    if:
      type: text
      regex: '(?i)\b(encrypted[_-]?(suffix|extension))\b\s*(=|:)'

  - id: encrypted-suffix-value
    desc: Encrypted filename suffix value
    crit: component
    conf: 0.94
    for: [source, scripts]
    if:
      type: text
      regex: '(?i)["''`]\.(encrypted|locked|crypt|enc|encrt)["''`]'

composite_rules:
  - id: encrypted-suffix-assignment
    desc: Code assigns an encrypted filename suffix
    crit: suspicious
    conf: 0.94
    for: [source, scripts]
    all:
      - id: encrypted-suffix-variable
      - id: encrypted-suffix-value
    near_lines: 2

  - id: ransom-note-suffix-locker
    desc: Encrypted-file locker with ransom note
    crit: hostile
    conf: 0.98
    for: [source, scripts]
    all:
      - id: objectives/impact/ransom/note::ransom-note-filename-punctuated-readme
      - id: encrypted-suffix-assignment
    near_lines: 160

  - id: r-adm-suffix-locker
    desc: R-ADM ransom note with encrypted suffix
    crit: hostile
    conf: 0.98
    for: [source, scripts]
    all:
      - id: objectives/impact/ransom/note::ransom-note-filename-radm-pattern
      - id: encrypted-suffix-assignment
    near_lines: 160

  - id: recursive-r-adm-suffix-locker
    desc: Recursive R-ADM file-encrypting locker
    crit: hostile
    conf: 0.98
    for: [source, scripts]
    all:
      - id: r-adm-suffix-locker
      - id: micro-behaviors/fs/directory/traverse::recursive-directory-traversal
    near_lines: 160

  - id: recursive-ransom-note-file-encryptor
    desc: Recursive encrypted-file renamer that drops a punctuated ransom note
    crit: hostile
    conf: 0.98
    for: [source, scripts]
    all:
      - id: objectives/impact/ransom/note::ransom-note-filename-punctuated-readme
      - id: encrypted-suffix-assignment
      - id: micro-behaviors/fs/directory/traverse::recursive-directory-traversal
    near_lines: 160
