# Cross-language source shape for lockers that combine an encrypted suffix
# with a per-directory ransom note.  The article gives the concrete filename
# and suffix, while these rules generalize their structure instead of naming a
# ransomware family.
defaults:
  crit: hostile
  conf: 0.98
  platforms: [windows, unix]
  for: [source, binaries]
  attack: T1486
  mbc: B0040

composite_rules:
  - id: ransom-note-suffix-locker
    desc: Encrypted-file locker with ransom note
    for: [scripts, '!jcl', c, csharp, go, java, rust]
    all:
      - id: objectives/impact/ransom/note::ransom-note-filename-punctuated-readme
      - id: micro-behaviors/fs/path/extension::encrypted-filename-suffix-assignment
    near_lines: 160

  - id: ransom-note-direct-suffix-locker
    desc: Encrypted-file locker with direct suffix operation
    for: [scripts, '!jcl', c, csharp, go, java, rust]
    all:
      - id: objectives/impact/ransom/note::ransom-note-filename-punctuated-readme
    any:
      - id: micro-behaviors/fs/file/rename::encrypted-suffix-target
      - id: micro-behaviors/fs/path/construct::encrypted-suffix-path-construction
      - id: micro-behaviors/fs/write/file/target::encrypted-suffix-output
    near_lines: 160

  - id: recursive-ransom-note-direct-suffix-locker
    desc: Recursive locker using direct encrypted suffix operation
    for: [scripts, '!jcl', c, csharp, go, java, rust]
    all:
      - id: ransom-note-direct-suffix-locker
      - id: micro-behaviors/fs/directory/traverse::recursive-directory-traversal
    near_lines: 160

  - id: r-adm-suffix-locker
    desc: R-ADM ransom note with encrypted suffix
    for: [scripts, '!jcl', c, csharp, go, java, rust]
    all:
      - id: objectives/impact/ransom/note::ransom-note-filename-radm-pattern
      - id: micro-behaviors/fs/path/extension::encrypted-filename-suffix-assignment
    near_lines: 160

  - id: recursive-r-adm-suffix-locker
    desc: Recursive R-ADM file-encrypting locker
    for: [scripts, '!jcl', c, csharp, go, java, rust]
    all:
      - id: r-adm-suffix-locker
      - id: micro-behaviors/fs/directory/traverse::recursive-directory-traversal
    near_lines: 160

  - id: recursive-ransom-note-file-encryptor
    desc: Recursive encrypted-file renamer that drops a punctuated ransom note
    for: [scripts, '!jcl', c, csharp, go, java, rust]
    all:
      - id: objectives/impact/ransom/note::ransom-note-filename-punctuated-readme
      - id: micro-behaviors/fs/path/extension::encrypted-filename-suffix-assignment
      - id: micro-behaviors/fs/directory/traverse::recursive-directory-traversal
    near_lines: 160

  - id: recursive-variable-suffix-file-encryptor
    desc: Recursive file encryptor correlates an opaque suffix with its README note
    for: [python, javascript, typescript, c, cpp, csharp, go, java, rust]
    all:
      - id: objectives/impact/ransom/note::readme-encrypted-suffix-variable-note
      - id: micro-behaviors/fs/path/extension::opaque-encrypted-filename-suffix-assignment
      - id: micro-behaviors/fs/file/rename::encrypted-suffix-variable-target
      - id: micro-behaviors/crypto/symmetric/encrypt/
      - id: micro-behaviors/fs/write/file/
    any:
      - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
      - id: micro-behaviors/fs/directory/traverse::node-recursive-dirent-walk
      - id: micro-behaviors/fs/directory/traverse::filepath-walk
      - id: micro-behaviors/fs/directory/traverse::cpp-recursive-directory-iterator-source
      - id: micro-behaviors/fs/directory/traverse::rust-recursive-search
      - id: micro-behaviors/fs/directory/traverse::java-listfiles-directory-descent
    near_lines: 180

  - id: security-disabling-variable-suffix-file-encryptor
    desc: Recursive file encryptor force-kills security-product processes
    for: [python, javascript, typescript, c, cpp]
    all:
      - id: recursive-variable-suffix-file-encryptor
      - id: objectives/impact/degrade/edr/targeting::edr-security-process-termination
