# Cross-language source shape for lockers that combine an encrypted suffix
# with a per-directory ransom note.  The article gives the concrete filename
# and suffix, while these rules generalize their structure instead of naming a
# ransomware family.
defaults:
  platforms: [windows, unix]
  for: [source, binaries]
  attack: T1486
  mbc: B0040

traits:
  - id: encrypted-suffix-variable
    desc: Encrypted filename suffix variable
    crit: component
    conf: 0.94
    for: [source, scripts]
    if:
      type: text
      regex: '(?i)\b(encrypted[_-]?(suffix|extension))\b\s*(=|:)'

  - id: encrypted-suffix-value
    desc: Encrypted filename suffix value
    crit: component
    conf: 0.94
    for: [source, scripts]
    if:
      type: text
      regex: '(?i)["''`]\.(encrypted|locked|crypt|enc|encrt)["''`]'

  # Match the suffix in a file/path operation rather than in a comment or
  # prose. These atoms cover lockers that append it inline instead of
  # assigning it to an encrypted_suffix variable first.
  - id: encrypted-suffix-rename-operation
    desc: Rename operation uses encrypted suffix
    crit: suspicious
    conf: 0.94
    for: [source, scripts]
    if:
      type: text
      case_insensitive: true
      regex: '\b(rename\w*|replace|move\w*)\s*\([^;\n]{0,160}["''`]\.(encrypted|locked|crypt|enc)["''`]'

  - id: encrypted-suffix-path-operation
    desc: Path construction uses encrypted suffix
    crit: suspicious
    conf: 0.94
    for: [source, scripts]
    if:
      type: text
      case_insensitive: true
      regex: '\b(with[_-]?(name|suffix))\s*\([^;\n]{0,160}["''`]\.(encrypted|locked|crypt|enc)["''`]'

  - id: encrypted-suffix-output-operation
    desc: File output uses encrypted suffix
    crit: suspicious
    conf: 0.94
    for: [source, scripts]
    if:
      type: text
      case_insensitive: true
      regex: '\b(write\w*|open|ofstream)\s*\([^;\n]{0,160}["''`]\.(encrypted|locked|crypt|enc)["''`]'

composite_rules:
  - id: encrypted-suffix-file-operation
    desc: File operation uses encrypted suffix
    crit: suspicious
    conf: 0.94
    for: [source, scripts]
    any:
      - id: encrypted-suffix-rename-operation
      - id: encrypted-suffix-path-operation
      - id: encrypted-suffix-output-operation

  - id: encrypted-suffix-assignment
    desc: Code assigns an encrypted filename suffix
    crit: suspicious
    conf: 0.94
    for: [source, scripts]
    all:
      - id: encrypted-suffix-variable
      - id: encrypted-suffix-value
    near_lines: 2

  - id: ransom-note-suffix-locker
    desc: Encrypted-file locker with ransom note
    crit: hostile
    conf: 0.98
    for: [source, scripts]
    all:
      - id: objectives/impact/ransom/note::ransom-note-filename-punctuated-readme
      - id: encrypted-suffix-assignment
    near_lines: 160

  - id: ransom-note-direct-suffix-locker
    desc: Encrypted-file locker with direct suffix operation
    crit: hostile
    conf: 0.98
    for: [source, scripts]
    all:
      - id: objectives/impact/ransom/note::ransom-note-filename-punctuated-readme
      - id: encrypted-suffix-file-operation
    near_lines: 160

  - id: recursive-ransom-note-direct-suffix-locker
    desc: Recursive locker using direct encrypted suffix operation
    crit: hostile
    conf: 0.98
    for: [source, scripts]
    all:
      - id: ransom-note-direct-suffix-locker
      - id: micro-behaviors/fs/directory/traverse::recursive-directory-traversal
    near_lines: 160

  - id: r-adm-suffix-locker
    desc: R-ADM ransom note with encrypted suffix
    crit: hostile
    conf: 0.98
    for: [source, scripts]
    all:
      - id: objectives/impact/ransom/note::ransom-note-filename-radm-pattern
      - id: encrypted-suffix-assignment
    near_lines: 160

  - id: recursive-r-adm-suffix-locker
    desc: Recursive R-ADM file-encrypting locker
    crit: hostile
    conf: 0.98
    for: [source, scripts]
    all:
      - id: r-adm-suffix-locker
      - id: micro-behaviors/fs/directory/traverse::recursive-directory-traversal
    near_lines: 160

  - id: recursive-ransom-note-file-encryptor
    desc: Recursive encrypted-file renamer that drops a punctuated ransom note
    crit: hostile
    conf: 0.98
    for: [source, scripts]
    all:
      - id: objectives/impact/ransom/note::ransom-note-filename-punctuated-readme
      - id: encrypted-suffix-assignment
      - id: micro-behaviors/fs/directory/traverse::recursive-directory-traversal
    near_lines: 160
