# Windows file-encryptor workflow signals shared by native and script forms.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1486
  mbc: B0040

traits:
  - id: powershell-file-encryption
    desc: PowerShell AES file encryption operation
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bProtect-File\b[^\r\n]{0,100}-Algorithm\s+AES\b'

  - id: managed-recursive-file-targeting
    desc: Managed recursive file targeting API
    crit: notable
    conf: 0.9
    attack: T1083
    for: [csharp, java]
    if:
      type: symbol
      regex: '(?i)^Directory\.(GetFiles|EnumerateFiles)$'

  - id: powershell-file-rename-operation
    desc: PowerShell file rename operation
    crit: component
    conf: 0.93
    for: [powershell]
    if:
      type: symbol
      kind: call
      exact: Move-Item

  - id: win32-encrypted-suffix-rename
    desc: Win32 renames to encrypted suffix
    crit: suspicious
    conf: 0.93
    for: [c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)\bMoveFile[AW]?\b[^\r\n]{0,220}\.(encrypted|locked|crypt|enc|encrt)\b'

  - id: win32-encrypted-suffix-definition
    desc: Defines an encrypted filename suffix
    crit: suspicious
    conf: 0.94
    for: [c, cpp, pe, dll]
    if:
      type: text
      regex: '(?is)\bencrypted[_-]?suffix\b[\s\S]{0,120}["'']\.[a-z0-9]{2,16}["'']'

composite_rules:
  - id: powershell-encrypted-suffix-rename
    desc: PowerShell rename with ransomware suffix
    crit: suspicious
    conf: 0.93
    all:
      - id: powershell-file-rename-operation
    any:
      - id: objectives/impact/ransom/tactics::ps-ransom-extension-append
      - id: objectives/impact/ransom/tactics::ps-encrypted-extension-append

  - id: windows-file-encryption-operation
    desc: Windows file encryption operation
    crit: notable
    any:
      - id: powershell-file-encryption
      - id: micro-behaviors/crypto/symmetric/aes/cng::bcrypt-encrypt-api
      - id: micro-behaviors/crypto/symmetric/aes/cng::bcrypt-encrypt-source
      - id: micro-behaviors/crypto/symmetric/stream::xchacha20-poly1305-api

  - id: windows-recursive-file-targeting
    desc: Recursive traversal component for a Windows file-encryptor workflow
    crit: component
    any:
      - id: micro-behaviors/fs/directory/traverse::powershell-recursive-child-item
      - id: managed-recursive-file-targeting
      - id: micro-behaviors/fs/directory/traverse::filepath-walk

  - id: windows-encrypted-suffix-rename
    desc: Windows encrypted-suffix rename operation
    crit: suspicious
    any:
      - id: powershell-encrypted-suffix-rename
      - id: win32-encrypted-suffix-rename
      # The generic source-code operation is neutral on its own and already
      # has a canonical capability trait. Ransom intent comes from this file's
      # traversal/encryption/note composites, not from one rename call.
      - id: micro-behaviors/fs/file/rename::encrypted-suffix-target

  - id: windows-file-encryptor-workflow
    desc: Windows file-encryptor workflow with note
    crit: hostile
    conf: 0.98
    all:
      - id: windows-file-encryption-operation
      - id: windows-recursive-file-targeting
      - id: windows-encrypted-suffix-rename
    any:
      - id: objectives/impact/ransom/note::ultimatum-filename-a

  - id: windows-native-file-encryptor-workflow
    desc: Native file encryption, suffix rename, and directory walk
    crit: hostile
    conf: 0.98
    all:
      - id: windows-file-encryption-operation
      - id: windows-encrypted-suffix-rename
    any:
      - id: micro-behaviors/fs/enumerate/directory::find-file-walker-wide
      - id: micro-behaviors/fs/enumerate/directory::find-file-walker-wide-ex
      - id: micro-behaviors/fs/enumerate/directory::find-file-walker

  - id: windows-native-locker-workflow
    desc: Native Windows locker encrypts and rewrites files
    crit: hostile
    conf: 0.98
    for: [c, cpp, pe, dll]
    all:
      - id: windows-file-encryption-operation
      - id: micro-behaviors/fs/file/binary::source-file-content-io
      - id: win32-encrypted-suffix-definition

  - id: windows-native-recovery-inhibited-locker
    desc: Native recursive file locker destroys Windows recovery data
    crit: hostile
    conf: 0.99
    attack: T1486,T1490
    for: [c, cpp, pe, dll]
    all:
      - id: windows-file-encryption-operation
      - id: micro-behaviors/fs/directory/traverse::recursive-directory-traversal
      - id: win32-encrypted-suffix-definition
      - id: objectives/impact/ransom/tactics::shadow-delete

  - id: windows-native-custom-suffix-locker
    desc: Native encryptor rewrites files with custom suffix
    crit: hostile
    conf: 0.98
    for: [c, cpp, pe, dll]
    all:
      - id: windows-file-encryption-operation
      - id: micro-behaviors/fs/file/encrypt::native-file-encryption-routine
      - id: micro-behaviors/fs/file/extension::native-filename-extension-assignment
      - id: micro-behaviors/fs/file/move::move-file

  - id: native-ransomware-with-event-log-clearing
    desc: Native Windows ransomware clears event logs after encryption
    crit: hostile
    conf: 0.99
    attack: T1486,T1070.001
    all:
      - id: windows-native-file-encryptor-workflow
      - id: objectives/evasion/indicator-removal/logs::log-clear-windows

  - id: ransomware-with-event-log-clearing
    desc: Windows ransomware clears event logs after encryption
    crit: hostile
    conf: 0.99
    attack: T1486,T1070.001
    all:
      - id: windows-file-encryptor-workflow
      - id: objectives/evasion/indicator-removal/logs::log-clear-windows
