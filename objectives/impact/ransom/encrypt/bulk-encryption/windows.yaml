# Windows file-encryptor workflow signals shared by native and script forms.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1486
  mbc: B0040

traits:
  - id: powershell-file-encryption
    desc: PowerShell AES file encryption operation
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bProtect-File\b[^\r\n]{0,100}-Algorithm\s+AES\b'

  - id: powershell-recursive-file-targeting
    desc: Recursive Windows file targeting operation
    crit: notable
    conf: 0.9
    attack: T1083
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bget-childitem\b[^\r\n]{0,220}-recurse\b'
    not:
      - regex: '(?i)-Include\s+"\*\.(ts|tsx|js|jsx)"'
    unless:
      - id: well-known/app/copilot-delegate::copilot-delegate-hook-script

  - id: managed-recursive-file-targeting
    desc: Managed recursive file targeting API
    crit: notable
    conf: 0.9
    attack: T1083
    for: [csharp, java]
    if:
      type: symbol
      regex: '(?i)^Directory\.(GetFiles|EnumerateFiles)$'

  - id: powershell-file-rename-operation
    desc: PowerShell file rename operation
    crit: component
    conf: 0.93
    for: [powershell]
    if:
      type: symbol
      kind: call
      exact: Move-Item

  - id: win32-encrypted-suffix-rename
    desc: Win32 renames to encrypted suffix
    crit: suspicious
    conf: 0.93
    for: [c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)\bMoveFile[AW]?\b[^\r\n]{0,220}\.(encrypted|locked|crypt|enc)\b'

  - id: generic-encrypted-suffix-rename
    desc: Code renames to encrypted suffix
    crit: suspicious
    conf: 0.93
    for: [python, javascript, typescript, csharp, go, rust]
    if:
      type: text
      regex: '(?i)\brename\w*\s*\([^\r\n]{0,220}\.(encrypted|locked|crypt|enc)\b'

composite_rules:
  - id: powershell-encrypted-suffix-rename
    desc: PowerShell rename with ransomware suffix
    crit: suspicious
    conf: 0.93
    all:
      - id: powershell-file-rename-operation
    any:
      - id: objectives/impact/ransom/tactics::ps-ransom-extension-append
      - id: objectives/impact/ransom/tactics::ps-encrypted-extension-append

  - id: windows-file-encryption-operation
    desc: Windows file encryption operation
    crit: notable
    any:
      - id: powershell-file-encryption
      - id: micro-behaviors/crypto/symmetric/aes/cng::bcrypt-encrypt-api

  - id: windows-recursive-file-targeting
    desc: Recursive traversal component for a Windows file-encryptor workflow
    crit: component
    any:
      - id: powershell-recursive-file-targeting
      - id: managed-recursive-file-targeting
      - id: micro-behaviors/fs/read/directory::filepath-walk-dup

  - id: windows-encrypted-suffix-rename
    desc: Windows encrypted-suffix rename operation
    crit: suspicious
    any:
      - id: powershell-encrypted-suffix-rename
      - id: win32-encrypted-suffix-rename
      - id: generic-encrypted-suffix-rename

  - id: windows-file-encryptor-workflow
    desc: Windows file-encryptor workflow with note
    crit: hostile
    conf: 0.98
    all:
      - id: windows-file-encryption-operation
      - id: windows-recursive-file-targeting
      - id: windows-encrypted-suffix-rename
    any:
      - id: objectives/impact/ransom/note::ultimatum-filename-a

  - id: windows-native-file-encryptor-workflow
    desc: Native file encryption, suffix rename, and directory walk
    crit: hostile
    conf: 0.98
    all:
      - id: windows-file-encryption-operation
      - id: windows-encrypted-suffix-rename
    any:
      - id: micro-behaviors/fs/enumerate/directory::find-file-walker-wide
      - id: micro-behaviors/fs/enumerate/directory::find-file-walker-wide-ex
      - id: micro-behaviors/fs/enumerate/directory::find-file-walker

  - id: native-ransomware-with-event-log-clearing
    desc: Native Windows ransomware clears event logs after encryption
    crit: hostile
    conf: 0.99
    attack: T1486,T1070.001
    all:
      - id: windows-native-file-encryptor-workflow
      - id: objectives/evasion/indicator-removal/logs::log-clear-windows

  - id: ransomware-with-event-log-clearing
    desc: Windows ransomware clears event logs after encryption
    crit: hostile
    conf: 0.99
    attack: T1486,T1070.001
    all:
      - id: windows-file-encryptor-workflow
      - id: objectives/evasion/indicator-removal/logs::log-clear-windows
