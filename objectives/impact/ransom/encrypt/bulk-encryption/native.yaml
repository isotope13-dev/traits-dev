# Native Unix file-encryptor workflow signals for ELF/Mach-O and source.
defaults:
  platforms: [unix]
  for: [source, binaries]
  attack: T1486
  mbc: B0040

traits:
  - id: native-file-encryption-api
    desc: Native file encryption API
    crit: notable
    conf: 0.92
    for: [c, cpp, rust, go, elf, macho]
    if:
      type: symbol
      regex: '(?i)^EVP_(Encrypt|Cipher)Init_ex$'

  - id: native-aes-file-encryption
    desc: Native AES file encryption routine
    crit: notable
    conf: 0.92
    for: [c, cpp, rust, go, elf, macho]
    if:
      type: symbol
      regex: '(?i)^AES_(cbc_)?encrypt$'

  - id: native-mbedtls-file-encryption
    desc: Native mbedTLS file encryption routine
    crit: notable
    conf: 0.92
    for: [c, cpp, rust, go, elf, macho]
    if:
      type: symbol
      regex: '(?i)^mbedtls_aes_crypt_(cbc|ctr|ecb)$'

  - id: native-gcrypt-file-encryption
    desc: Native gcrypt file encryption routine
    crit: notable
    conf: 0.92
    for: [c, cpp, rust, go, elf, macho]
    if:
      type: symbol
      exact: gcry_cipher_encrypt

  - id: native-encrypted-suffix-literal
    desc: Native encrypted filename suffix
    crit: suspicious
    conf: 0.93
    for: [c, cpp, rust, go, elf, macho]
    if:
      type: literal
      regex: '(?i)\.(encrypted|locked|crypt|enc)\b'

composite_rules:
  - id: native-file-encryption-operation
    desc: Native file encryption operation
    crit: notable
    any:
      - id: native-file-encryption-api
      - id: native-aes-file-encryption
      - id: native-mbedtls-file-encryption
      - id: native-gcrypt-file-encryption

  - id: native-recursive-file-targeting
    desc: Native recursive file targeting operation
    crit: notable
    any:
      - id: micro-behaviors/fs/directory/readdir::readdir-opendir
      - id: micro-behaviors/fs/directory/readdir::readdir-readdir
      - id: micro-behaviors/fs/directory/readdir::readdir-readdir64

  - id: native-file-encryptor-workflow
    desc: Native recursive file-encryptor workflow
    crit: hostile
    conf: 0.98
    all:
      - id: native-file-encryption-operation
      - id: native-recursive-file-targeting
      - id: native-encrypted-suffix-rename
    any:
      - id: objectives/impact/ransom/encrypt/filesystem::native-ransom-note-encryptor
      - id: objectives/impact/ransom/note::ultimatum-filename-a

  - id: native-encrypted-suffix-rename
    desc: Native rename to encrypted suffix
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/fs/file/rename::rename-base
      - id: native-encrypted-suffix-literal
