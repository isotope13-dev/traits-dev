# Native Unix file-encryptor workflow signals for ELF/Mach-O and source.
defaults:
  platforms: [unix]
  for: [source, binaries]
  attack: T1486
  mbc: B0040

traits:
  # Anchored to the end of the literal, because a *suffix* is what the name
  # claims and what a file-encryptor actually writes: `".locked"`,
  # `"%s.encrypted"`, `".crypt"`. With `\b` instead, the marker matched
  # mid-token and any dotted config key containing one of these words scored
  # suspicious for ransomware — PipeWire's JACK shim was convicted on
  # `"jack.locked-process"`, and `"mount.crypt-device"` /
  # `"session.encrypted_len"` are the same shape. `-` and `_` both satisfy
  # `\b`, so there was nothing separating the two readings.
  #
  # A family that buries the marker mid-name (`file.locked.<victim-id>`) is a
  # different string shape and wants its own atom rather than relaxing this one
  # back to matching configuration keys.
  - id: native-encrypted-suffix-literal
    desc: Native encrypted filename suffix
    crit: suspicious
    conf: 0.93
    for: [c, cpp, rust, go, elf, macho]
    if:
      type: literal
      regex: '(?i)\.(encrypted|locked|crypt)$'

composite_rules:
  - id: native-file-encryptor-workflow
    desc: Native recursive file-encryptor workflow
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/symmetric/encrypt::symmetric-encryption-operation
      - id: micro-behaviors/fs/directory/traverse::recursive-directory-traversal
      - id: native-encrypted-suffix-rename
    any:
      - id: objectives/impact/ransom/encrypt/filesystem::native-ransom-note-encryptor
      - id: objectives/impact/ransom/note::ultimatum-filename-a

  - id: native-encrypted-suffix-rename
    desc: Native rename to encrypted suffix
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/fs/file/rename::rename-base
      - id: native-encrypted-suffix-literal
