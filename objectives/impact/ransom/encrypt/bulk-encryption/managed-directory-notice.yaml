defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: managed-directory-encryptor-with-victim-notice
    desc: Directory encryption and deletion APIs with victim encryption notice
    crit: hostile
    conf: 0.97
    attack: T1486
    all:
      - id: micro-behaviors/crypto/encrypt/file::managed-directory-stream-encryption-profile
    # Notes say "your files are encrypted" or "encrypted all your files".
    # The two wordings are separate atoms because the verb order differs.
    any:
      - id: objectives/impact/ransom/encrypt/threat-text::ransom-note-files-encrypted-state
      - id: objectives/impact/ransom/encrypt/threat-text::ransom-note-encrypted-all-your-files
