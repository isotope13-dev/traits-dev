defaults:
  platforms: [windows]
  for: [pe]
  attack: T1486
  mbc: B0040

composite_rules:
  # Some native folder-targeted encryptors use a custom cipher and keep its
  # opaque state in RCDATA rather than importing Windows crypto APIs or
  # retaining readable ransom text. Requiring the complete file rewrite,
  # source deletion, a folder-browse API reference, opaque resource state, and
  # a placeholder product identity ties the claim to the observed locker
  # profile. Static co-occurrence does not establish data flow between the
  # resource and the file operations.
  - id: native-folder-resource-file-encryptor
    desc: Native folder-selected ransomware with opaque resource and placeholder identity
    crit: hostile
    conf: 0.88
    all:
      - id: micro-behaviors/fs/shell-ops::browse-for-folder-name-reference
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/fs/temp/file::get-temp-file-name
      - id: micro-behaviors/fs/file/open::file-create-win
      - id: micro-behaviors/fs/file/handle::set-file-pointer
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
      - id: micro-behaviors/data/embedded/payload/resource::find-resource-any
      - id: micro-behaviors/data/embedded/payload/resource::load-resource
      - id: micro-behaviors/data/embedded/payload/resource::sizeof-resource
      - id: metadata/binary/resource/entropy::rsrc-entropy-at-least-66
      - id: objectives/evasion/masquerade/version-resource/claim::placeholder-assembly-identity
