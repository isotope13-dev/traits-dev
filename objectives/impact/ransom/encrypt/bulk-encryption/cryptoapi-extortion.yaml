# Extortion content distinguishes this from ordinary CryptoAPI file processing.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: cryptoapi-file-encryption-extortion
    desc: File enumeration and CryptoAPI encryption with a ransom demand
    crit: hostile
    conf: 0.98
    attack: T1486
    mbc: B0040
    all:
      - id: objectives/impact/ransom/encrypt/config::ransom-note-files-encrypted-state
      - id: objectives/impact/ransom/encrypt/config::ransom-note-recovery-request
      - id: micro-behaviors/crypto/library/cryptoapi::crypt-encrypt
      - id: micro-behaviors/fs/enumerate/directory::find-first-file
      - id: micro-behaviors/fs/enumerate/directory::find-next-file
