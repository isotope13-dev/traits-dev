defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1486
composite_rules:
  - id: managed-ransom-stream-replacement
    desc: Drive-encryption overwrite profile with extortion or malware notice
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/crypto/encrypt/file::managed-drive-stream-replacement-profile
    # A payment sentence is not essential to the attack: the retained notice
    # explicitly attributes bulk file encryption to malware. Neither notice
    # alone establishes an implemented encryptor; both require the API profile.
    any:
      - id: objectives/impact/ransom/extortion::russian-file-recovery-payment-guarantee
      - id: objectives/impact/ransom/note::russian-all-files-encrypted-by-malware
