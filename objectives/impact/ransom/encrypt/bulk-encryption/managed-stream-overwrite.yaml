defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1486
composite_rules:
  - id: managed-ransom-stream-replacement
    desc: Managed drive-encryption and stream-reset APIs with ransom demand
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/ransom/extortion::russian-file-recovery-payment-guarantee
      - id: micro-behaviors/crypto/encrypt/reference::dotnet-create-encryptor
      - id: micro-behaviors/crypto/cipher/io::dotnet-cryptostream
      - id: micro-behaviors/fs/enumerate/drives::get-drives-dotnet
    # Stream replacement is shown by resetting the same stream's length
    # before writing ciphertext back. The reset value is an attacker-chosen
    # constant (zero in the original, one in a variant that leaves a byte),
    # so accept the SetLength call itself or the original zero-length
    # instruction layout; neither leg alone claims replacement without the
    # encryptor, payment demand and drive-enumeration legs above.
    any:
      - id: micro-behaviors/fs/file/truncate::dotnet-stream-setlength
      - id: micro-behaviors/data/control-flow/sequence::cil-zero-int64-two-buffer-call-layout
