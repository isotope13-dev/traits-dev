defaults:
  platforms: [windows]
  for: [pyc]
  crit: hostile
  conf: 0.97
traits:
  - id: ransomware-module-encrypts-files-declaration
    desc: Declares ransomware module encrypts files
    crit: notable
    if:
      type: text
      regex: '(?i)ransomware module encrypts.{0,32}files'
composite_rules:
  - id: ransomware-cbc-glob-encrypt-remove-bytecode
    desc: Ransomware CBC file-encrypt/delete name cluster
    attack: T1486
    mbc: B0040
    # File-scoped: the explicit ransomware-purpose declaration admits the
    # attack claim. Crypto, globbing and removal alone are ordinary utilities.
    # These are serialized operation names, not an engine-recovered flow.
    all:
      - id: ransomware-module-encrypts-files-declaration
      - id: micro-behaviors/crypto/symmetric/aes/library::python-bytecode-cbc-mode-ref
      - id: micro-behaviors/crypto/symmetric/encrypt::python-bytecode-encrypt-file-helper
      - id: micro-behaviors/crypto/symmetric/encrypt::pyc-encrypt-name-record
      - id: micro-behaviors/fs/delete/file/library::pyc-remove-name-record
      - id: micro-behaviors/fs/search/content::pyc-iglob-name-record
