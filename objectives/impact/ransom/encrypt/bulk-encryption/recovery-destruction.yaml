# Recovery destruction supplies the attack context. ChaCha, file I/O,
# enumeration, or service control individually remain neutral capabilities.
# These are file-scoped static references; no runtime success is asserted.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1486,T1490
  crit: hostile

composite_rules:
  - id: chacha-shadow-recycle-destroying-file-walker
    desc: ChaCha walker with recovery destruction
    conf: 0.96
    all:
      - id: micro-behaviors/fs/volume/shadow-copy::native-wmi-shadow-delete
      - id: micro-behaviors/fs/delete/recycle-bin::sh-empty-recycle-bin
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-quarter-round-rotations-x86
      - id: micro-behaviors/fs/directory/readdir::find-file-walker-wide
      - id: micro-behaviors/fs/read/file/handle::read-file
      - id: micro-behaviors/fs/write/file/handle::write-file
