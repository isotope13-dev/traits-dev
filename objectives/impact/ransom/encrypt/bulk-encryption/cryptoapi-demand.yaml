defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # Explicit victim-directed ransom content supplies intent. CryptoAPI is
  # resolved at runtime, so import-only encryption rules miss this workflow.
  - id: native-cryptoapi-file-io-ransom-demand
    desc: File I/O and CryptoAPI with ransom demand
    crit: hostile
    conf: 0.97
    attack: T1486
    all:
      - id: micro-behaviors/crypto/encrypt::crypt-encrypt-api-name
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/fs/directory/readdir/native::find-file-walker
      - id: micro-behaviors/fs/read/file/handle::read-file
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: objectives/impact/ransom/encrypt/config::ransom-note-text
      - id: objectives/impact/ransom/encrypt-note::pay-ransom
