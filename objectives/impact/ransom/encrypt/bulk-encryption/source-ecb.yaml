defaults:
  platforms: [windows]
  for: [c, cpp, html, text]
  attack: T1486
  crit: hostile
  conf: 0.95

composite_rules:
  - id: ecb-encrypt-rename-with-note
    desc: ECB encrypt renames files beside a note
    near_bytes: 12000
    all:
      - id: micro-behaviors/crypto/encrypt::ecb-encrypt-call
      - id: micro-behaviors/fs/file/move::movefile-call-text
      - id: objectives/impact/ransom/encrypt-note::files-encrypted-notice
