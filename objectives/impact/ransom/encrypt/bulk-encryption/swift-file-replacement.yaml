defaults:
  platforms: [unix, windows]
  for: [swift]

composite_rules:
  - id: swift-xor-file-replacement-ransom-notice
    desc: XOR file replacement with ransom notice
    crit: hostile
    conf: 0.97
    attack: T1486
    all:
      - id: micro-behaviors/data/bitwise/mixed::source-xor-operation
      - id: micro-behaviors/fs/path/extension::encrypted-filename-suffix-literal
      - id: micro-behaviors/fs/delete/path::swift-remove-item-call
      - id: micro-behaviors/fs/write/file/full/unspecified::swift-file-url-write-call
      - id: objectives/impact/ransom/encrypt/threat-text::files-encrypted-msg
