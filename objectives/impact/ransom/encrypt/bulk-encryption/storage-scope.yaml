# Storage-scope enrichment for cross-language lockers. Local-drive and network
# share enumeration are neutral capabilities on their own; the ransomware
# objective is established by the recursive suffix-correlated encryptor leg.
defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1486

composite_rules:
  - id: local-and-network-storage-variable-suffix-locker
    desc: Recursive locker enumerates local drives and network storage
    for: [python]
    all:
      - id: objectives/impact/ransom/encrypt/bulk-encryption::recursive-variable-suffix-file-encryptor
      - id: micro-behaviors/fs/enumerate/drives/
      - id: micro-behaviors/communications/socket/share::network-disk-share-enumeration
