defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # A capability correlation, not proof of a particular file's data flow.
  # Encryption/deletion references plus HTML and an onion endpoint warrant
  # investigation. Ordinary encrypted backups must not be called ransomware.
  # Do not require a family name, ransom-note filename, suffix, host or key.
  - id: native-encryption-deletion-onion-html
    desc: Encryption/deletion references, HTML and onion endpoint
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/crypto/encrypt/reference::native-encryption-api
      - id: micro-behaviors/fs/directory/readdir/native::file-enumeration-with-access
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
      - id: micro-behaviors/communications/proxy/tor::onion-domain-reference
      - id: metadata/file/format/conformance::embedded-html-document
