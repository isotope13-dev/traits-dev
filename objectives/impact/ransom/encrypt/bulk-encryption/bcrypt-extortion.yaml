defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: bcrypt-file-encryption-payment-demand
    desc: BCrypt file processing with ransom demand
    crit: hostile
    conf: 0.99
    attack: T1486
    all:
      - id: objectives/impact/ransom/encrypt/config::ransom-note-files-encrypted-state
      - id: objectives/impact/ransom/note::decryptor-released-after-payment
      - id: micro-behaviors/crypto/library/cryptoapi::bcrypt-encrypt-api
      - id: micro-behaviors/crypto/library/cryptoapi::bcrypt-generate-symmetric-key
      - id: micro-behaviors/fs/directory/readdir::find-next-file
