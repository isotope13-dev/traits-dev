defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: bcrypt-file-encryption-recovery-withheld
    desc: BCrypt file processing with withheld recovery
    crit: hostile
    conf: 0.99
    attack: T1486
    all:
      - id: objectives/impact/ransom/encrypt/config::ransom-note-files-encrypted-state
      - id: micro-behaviors/crypto/provider/cryptoapi::bcrypt-encrypt-api
      - id: micro-behaviors/crypto/provider/cryptoapi::bcrypt-generate-symmetric-key
      - id: micro-behaviors/fs/directory/readdir/native::find-next-file
    # Payment wording is one admission, not a requirement for recognizing
    # encryption that reserves the recovery private key for the operator.
    any:
      - id: objectives/impact/ransom/note::decryptor-released-after-payment
      - id: objectives/impact/ransom/note::encrypted-files-operator-private-key-notice
