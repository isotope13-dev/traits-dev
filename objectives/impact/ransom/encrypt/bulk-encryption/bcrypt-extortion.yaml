defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: bcrypt-file-encryption-recovery-withheld
    desc: BCrypt file processing with withheld recovery
    crit: hostile
    conf: 0.99
    attack: T1486
    all:
      - id: objectives/impact/ransom/encrypt/threat-text::ransom-note-files-encrypted-state
      - id: micro-behaviors/crypto/encrypt/transform::bcrypt-encrypt-api
      - id: micro-behaviors/crypto/key/import::bcrypt-symmetric-key-api
      - id: micro-behaviors/fs/directory/readdir/native::find-next-file
    # Payment wording is one admission, not a requirement for recognizing
    # encryption that reserves the recovery private key for the operator.
    any:
      - id: objectives/impact/ransom/note::decryptor-released-after-payment
      - id: objectives/impact/ransom/note::encrypted-files-operator-private-key-notice

  - id: bcrypt-drive-traversal-extortion-locker
    desc: BCrypt file encryptor traverses drives, renames files, and drops ransom note
    crit: hostile
    conf: 0.99
    attack: T1486
    all:
      - id: micro-behaviors/crypto/encrypt/transform::bcrypt-encrypt-api
      - id: micro-behaviors/crypto/key/import::bcrypt-symmetric-key-api
      - id: micro-behaviors/fs/directory/readdir/native::find-next-file
      - id: micro-behaviors/fs/file/move::move-file-ex
    any:
      - id: objectives/impact/ransom/native::data-will-be-published
      - id: objectives/impact/ransom/encrypt-note::files-encrypted-notice
      - id: objectives/impact/ransom/encrypt/threat-text::files-encrypted-msg
      - id: objectives/impact/ransom/note::restore-files-note-filename-pair

  - id: double-extortion-dual-format-note-locker
    desc: Locker drops HTML and text ransom notes threatening stolen-data publication
    crit: hostile
    conf: 0.98
    attack: T1486,T1567
    all:
      - id: objectives/impact/ransom/native::data-will-be-published
      - id: objectives/impact/ransom/encrypt-note::files-encrypted-notice
      - id: metadata/file/format/conformance::embedded-html-opening
    any:
      - id: micro-behaviors/fs/enumerate/drives::drive-and-file-tree-traversal
      - id: micro-behaviors/fs/directory/readdir/native::file-enumeration-with-access
      - id: objectives/impact/ransom/note::restore-files-note-filename-pair
      - id: micro-behaviors/fs/directory/traverse/
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: metadata/file/format/threat-intelligence::ransomnotes-record-field
