# AI/ML-specific ransomware targets are a useful behavior even when no LLM is
# involved in generating or launching the locker. Keep this separate from the
# runtime-generated rules so a compiled or hand-written locker is covered too.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, go]
  attack: T1486

traits:
  - id: ai-model-target-set
    desc: Targets multiple AI model and checkpoint formats
    crit: suspicious
    conf: 0.94
    count_min: 2
    if:
      type: text
      regex: '(?i)\.(ckpt|h5|onnx|pb|pkl|pickle|pt2?|pth|safetensors?)\b'

  - id: ai-vector-target-set
    desc: Targets vector and embedding index formats
    crit: suspicious
    conf: 0.94
    count_min: 2
    if:
      type: text
      regex: '(?i)\.(faiss|ggml|gguf|vec)\b'

  - id: ai-dataset-target-set
    desc: Targets machine-learning dataset formats
    crit: suspicious
    conf: 0.94
    count_min: 2
    unless:
      - id: well-known/app/aui-agent-builder/
    if:
      type: text
      regex: '(?i)\.(arrow|duckdb|feather|npy|npz|parquet|tfrecord)\b'

composite_rules:
  - id: ai-asset-target-set
    desc: Targets multiple AI or ML asset formats
    crit: suspicious
    conf: 0.96
    any:
      - id: ai-model-target-set
      - id: ai-vector-target-set
      - id: ai-dataset-target-set

  - id: ai-asset-locker
    desc: Encrypts and renames multiple AI or ML assets
    crit: hostile
    conf: 0.99
    all:
      - id: ai-asset-target-set
      - id: micro-behaviors/fs/file/extension::locked-extension-reference
      - id: micro-behaviors/fs/file/rename
    any:
      - id: micro-behaviors/crypto/symmetric/aes
      - id: micro-behaviors/crypto/library/keyword::encrypt-decrypt-keyword
    near_bytes: 8192
