# AI/ML-specific ransomware targets are a useful behavior even when no LLM is
# involved in generating or launching the locker. Keep this separate from the
# runtime-generated rules so a compiled or hand-written locker is covered too.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, go]
  attack: T1486

composite_rules:
  - id: ai-asset-locker
    desc: Encrypts and renames multiple AI or ML assets
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/extension::ai-asset-extension-reference
      - id: micro-behaviors/fs/file/extension::locked-extension-reference
      - id: micro-behaviors/fs/file/rename
    any:
      - id: micro-behaviors/crypto/symmetric/aes
      - id: micro-behaviors/crypto/library/keyword::encrypt-decrypt-keyword
    near_bytes: 8192
