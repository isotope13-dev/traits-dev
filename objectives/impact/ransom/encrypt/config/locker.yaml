defaults:
  platforms:
  - linux
  - macos
  - windows
  for: [elf, macho, pe]
traits:
- id: encryption-complete-msg
  desc: Ransomware completion status message
  crit: component
  conf: 0.95
  if:
    type: text
    regex: \bencryption complete\b
    case_insensitive: true
  downgrade:
    any:
    - id: metadata/signed/platform::apple
- id: ransomware-source-path-1a
  desc: 'Ransomware source file path'
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: (ransomware|ransom)\.(c|cpp)$
    case_insensitive: true
- id: ransomware-source-path-1c
  desc: Ransomware source file path (locker .c/.cpp)
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: '[/\\]locker\.(c|cpp)$'
    case_insensitive: true
- id: ransomware-source-path-go-rs
  desc: Ransom source file path (.rs/.go)
  crit: suspicious
  conf: 0.95
  for: [go, rust]
  if:
    type: text
    regex: '[/\\]ransom(ware)?\.(rs|go)$'
    case_insensitive: true
- id: ransomware-module-path-go-rs
  desc: Ransom module path (.rs/.go)
  crit: suspicious
  conf: 0.95
  for: [go, rust]
  if:
    type: text
    regex: '[/\\]ransom(ware)?[/\\].{0,80}\.(rs|go)$'
    case_insensitive: true
- id: locker-module-path-go-rs
  desc: Locker module path (.rs/.go)
  crit: suspicious
  conf: 0.95
  for: [go, rust]
  if:
    type: text
    regex: '[/\\](ransom|encrypt)[/\\].{0,80}[/\\]locker[/\\].{0,60}\.(rs|go)$'
    case_insensitive: true
- id: ransomware-source-path-2
  desc: Ransomware source file path (crypter)
  crit: suspicious
  conf: 0.95
  for: [go, rust]
  if:
    type: text
    regex: '[/\\](ransom|locker|encrypt)[/\\].{0,80}[/\\]crypter\.(go|rs)$'
    case_insensitive: true
- id: locker-namespace
  desc: Ransomware locker module namespace
  crit: suspicious
  conf: 0.95
  for: [rust]
  if:
    type: text
    regex: 'locker::(core|lib|app)::'
- id: encrypt-lib-path
  desc: Encryption library source paths
  crit: suspicious
  conf: 0.9
  for: [go, rust]
  if:
    type: text
    regex: library/(encrypt-lib|locker)/src/
- id: config-note-field-name
  desc: note_file_name config field
  crit: suspicious
  conf: 0.75
  if:
    type: text
    substr: note_file_name
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: config-note-field-full
  desc: note_full_text config field
  crit: suspicious
  conf: 0.75
  if:
    type: text
    substr: note_full_text
- id: config-note-field-short
  desc: note_short_text config field
  crit: suspicious
  conf: 0.75
  if:
    type: text
    substr: note_short_text
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: config-cipher-field-cipher
  desc: default_file_cipher config field
  crit: component
  conf: 0.7
  if:
    type: text
    regex: '(^|[^A-Za-z0-9_])default_file_cipher([^A-Za-z0-9_]|$)'
- id: config-cipher-field-mode
  desc: default_file_mode config field
  crit: component
  conf: 0.7
  if:
    type: text
    regex: '(^|[^A-Za-z0-9_])default_file_mode([^A-Za-z0-9_]|$)'
- id: template-placeholders
  desc: 'Ransomware config template variables'
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: \$\{(EXTENSION|NOTE_FILE_NAME|ACCESS_KEY)\}
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: vm-kill-config-1
  desc: enable_esxi_vm_kill config field
  crit: suspicious
  conf: 0.75
  if:
    type: text
    substr: enable_esxi_vm_kill
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: vm-kill-config-2
  desc: enable_esxi_vm_snapshot_kill config field
  crit: suspicious
  conf: 0.75
  if:
    type: text
    substr: enable_esxi_vm_snapshot_kill
- id: vm-kill-config-3
  desc: esxi_vm_kill_exclude config field
  crit: suspicious
  conf: 0.75
  if:
    type: text
    substr: esxi_vm_kill_exclude
- id: kill-services-config-1
  desc: kill_services config field
  crit: suspicious
  conf: 0.75
  if:
    type: text
    substr: kill_services
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: kill-services-config-2
  desc: kill_processes config field
  crit: suspicious
  conf: 0.75
  if:
    type: text
    regex: (^|[^A-Za-z0-9_])kill_processes([^A-Za-z0-9_]|$)
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: well-known/app/infrastructure/systemd::container-runtime-component-basename
  - id: well-known/lib/platform/wine/
  - id: well-known/app/system/dvt::benign-process-control-context
  - id: well-known/lib/native/systemd::systemd-native-library-context
  - id: well-known/app/infrastructure/systemd::systemd-native-control-component
- id: ransom-extension-1
  desc: Compound filename with ransomware suffix
  crit: component
  conf: 0.85
  if:
    type: text
    regex: '(^|[^\w.-])(\*|[\w-]+\.[A-Za-z0-9]{1,8})\.(crypt|encrypted|locked)$'
  unless:
  - type: text
    regex: ^matplotlib$
  - type: text
    regex: ^tex$
- id: ransom-extension-2
  desc: Compound filename with ransomware suffix
  crit: component
  conf: 0.85
  if:
    type: text
    regex: '(^|[^\w.-])(\*|[\w-]+\.[A-Za-z0-9]{1,8})\.(enc|crypted|cry)$'
  unless:
  - type: text
    regex: '^payload\.enc$'
  - type: text
    regex: ^matplotlib$
  - type: text
    regex: ^tex$
- id: readme-extension-placeholder-note
  desc: ReadMe note with extension placeholder
  crit: suspicious
  conf: 0.9
  for: [scripts, binaries, c, cpp]
  if:
    type: text
    case_insensitive: true
    regex: 'readme.{0,20}\[[^]]*extension[^]]*\]\.txt'
  downgrade:
    any:
    - id: well-known/tool/detection/
- id: readme-encrypted-suffix-note
  desc: ReadMe note with encrypted suffix
  crit: suspicious
  conf: 0.9
  for: [scripts, binaries, c, cpp]
  if:
    type: text
    case_insensitive: true
    regex: 'readme.{0,12}\.(locked|encrypted|crypt)\.txt'
  downgrade:
    any:
    - id: well-known/tool/detection/
- id: babuk-config-marker
  desc: "Babuk ransomware config memory artifact"
  crit: component
  conf: 0.98
  for:
  - elf
  if:
    type: hex
    section: .text
    pattern: af af af af af af af af af af af af af af af af
- id: file-locked-message
  desc: File locked status message
  crit: component
  conf: 0.7
  if:
    type: text
    regex: File Locked|locked.{1,20}PID|error.{0,20}encrypt.{0,20}rename
- id: crypted-counter
  desc: Encryption counter message
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: 'Total (Crypted|Encrypted)|Crypted:.{0,20}Error:|Files Encrypted:'
- id: payment-status-check-3
  desc: Payment followed by ransomware recovery phrase
  crit: component
  conf: 0.9
  for: [scripts, binaries]
  if:
    type: text
    regex: '\bpayment\b.{0,80}\b(decrypt|unlock|recover|restore)\b'
    case_insensitive: true
  not:
  - substr: "verify-payment"
- id: desktop-note-path
  desc: Ransom note file dropped to Desktop directory
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: (/Desktop/|\\Desktop\\)[^/\\]{1,50}\.(html?|txt)
  unless:
  - id: well-known/app/storage/carbon-copy-cloner::official-carbon-copy-cloner-member
- id: babuk-file-status-logging
  desc: Ransomware file encryption status logging
  crit: suspicious
  conf: 0.9
  for:
  - elf
  - macho
  if:
    type: text
    regex: \[[+!]\]\s+File\s+(not\s+)?encrypted
- id: babuk-file-io-errors
  desc: Ransomware file access error logging
  crit: suspicious
  conf: 0.8
  for:
  - elf
  - macho
  if:
    type: text
    regex: \[!\]\s+Can`t\s+(run for|open)\s+file
- id: ransom-note-your-files
  desc: Ransom-note phrase addresses the victim's files
  crit: component
  conf: 0.85
  for: [elf, macho, pe, c, cpp]
  if:
    type: text
    case_insensitive: true
    regex: '(^|[^A-Za-z0-9_.-])your\s+files'
  unless:
    - id: well-known/lib/crypto/nss/
- id: ransom-note-your-data
  desc: Ransom-note phrase addresses the victim's data
  crit: component
  conf: 0.85
  for: [elf, macho, pe, c, cpp]
  if:
    type: text
    case_insensitive: true
    regex: '(^|[^A-Za-z0-9_.-])your\s+data'
  unless:
    - id: well-known/lib/crypto/nss/
- id: ransom-note-files-encrypted-state
  desc: Ransom note says victim files are encrypted
  crit: component
  conf: 0.85
  for: [elf, macho, pe, c, cpp]
  if:
    type: text
    case_insensitive: true
    regex: '\byour\s+(files?|data)\b[^\r\n]{0,80}\bencrypted\b'
  unless:
    - id: well-known/lib/crypto/nss/
- id: ransom-note-locked-state
  desc: Ransom-note locked state phrase
  crit: component
  conf: 0.85
  for: [elf, macho, pe, c, cpp]
  if:
    type: text
    case_insensitive: true
    regex: '(^|[^A-Za-z0-9_.-])your\s+(files|data)\b.{0,40}\blocked\b'
  unless:
    - id: well-known/lib/crypto/nss/
- id: ransom-note-decrypt-word
  desc: Ransom-note decrypt request word
  crit: component
  conf: 0.85
  for: [elf, macho, pe, c, cpp]
  if:
    type: text
    case_insensitive: true
    word: decrypt
  unless:
    - id: well-known/lib/crypto/nss/
- id: ransom-note-recover-word
  desc: Ransom-note recover-files phrase
  crit: component
  conf: 0.85
  for: [elf, macho, pe, c, cpp]
  if:
    type: text
    case_insensitive: true
    regex: '\brecover\s+(your |the )?(files?|data)\b'
  unless:
    - id: well-known/lib/crypto/nss/
- id: ransom-note-payment-word
  desc: Ransom-note payment request word
  crit: component
  conf: 0.85
  for: [elf, macho, pe, c, cpp]
  if:
    type: text
    case_insensitive: true
    word: payment
  unless:
    - id: well-known/lib/crypto/nss/
- id: locker-command-enable-field
  desc: XML locker enables embedded command execution
  crit: suspicious
  conf: 0.92
  for: [pe, dll, c, cpp, go, rust, csharp, powershell]
  if:
    type: text
    regex: '(?i)<enable_cmds>\s*(true|1|yes)\s*</enable_cmds>|<cmds>[^<]{4,}'
- id: locker-kill-keep-field
  desc: XML locker kill_keep process list
  crit: suspicious
  conf: 0.92
  for: [pe, dll, c, cpp, go, rust, csharp, powershell]
  if:
    type: text
    regex: '(?i)<kill_keep>[^<]{3,}</kill_keep>'
- id: locker-processes-field
  desc: XML locker process termination list
  crit: suspicious
  conf: 0.92
  for: [pe, dll, c, cpp, go, rust, csharp, powershell]
  if:
    type: text
    regex: '(?i)<kill_processes>[^<]{3,}</kill_processes>'
- id: locker-services-field
  desc: XML locker service termination list
  crit: suspicious
  conf: 0.92
  for: [pe, dll, c, cpp, go, rust, csharp, powershell]
  if:
    type: text
    regex: '(?i)<kill_services>[^<]{3,}</kill_services>'
- id: locker-white-extensions-field
  desc: XML locker encrypted extensions
  crit: suspicious
  conf: 0.9
  for: [pe, dll, c, cpp, go, rust, csharp, powershell]
  if:
    type: text
    regex: '(?i)<white_extensions>[^<]{3,}</white_extensions>'
- id: locker-file-extensions-field
  desc: XML locker file extensions
  crit: suspicious
  conf: 0.9
  for: [pe, dll, c, cpp, go, rust, csharp, powershell]
  if:
    type: text
    regex: '(?i)<file_extensions>[^<]{3,}</file_extensions>'
- id: locker-enable-extension-field
  desc: XML locker enables extension targeting
  crit: suspicious
  conf: 0.9
  for: [pe, dll, c, cpp, go, rust, csharp, powershell]
  if:
    type: text
    regex: '(?i)<enable_file_extension>[^<]{3,}</enable_file_extension>'
- id: locker-shutdown-enable-field
  desc: XML locker enables post-encryption shutdown
  crit: suspicious
  conf: 0.94
  for: [pe, dll, c, cpp, go, rust, csharp, powershell]
  if:
    type: text
    regex: '(?i)<enable_shutdown_system>\s*(true|1|yes)\s*</enable_shutdown_system>'
- id: encoded-ransom-note-content
  desc: Base64-encoded ransomware note content
  crit: suspicious
  conf: 0.95
  for: [pe, dll, elf, c, cpp, go, rust, python]
  if:
    type: encoded
    encoding: base64
    regex: '(?i)(files?.{0,24}encrypt|backups?.{0,24}delet|data.{0,24}leak)'
- id: ransomware-encrypted-extension-status
  desc: Ransomware file-encryption status string
  crit: suspicious
  conf: 0.9
  if:
    type: text
    # TLS libraries legitimately say "encrypted extensions"; require the
    # file-oriented ransomware status wording instead.
    regex: '(?i)\bfile\s+(already\s+)?has\s+encrypted\s+extension\b'
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: ransomware-files-processed-encryption
  desc: Ransomware processed-files encryption status
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '(?i)\bfiles?\s+processed\b.{0,60}\b(encrypt|ransom|locker)'
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: ransomware-file-processing-pipeline
  desc: Ransomware file-processing pipeline string
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '(?i)\bfile\s+processing\s+pipeline\b.{0,32}\b(encrypt|ransom|locker|extension)\b'
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: ransom-note-filename-readme-restore
  desc: Ransom note filename README RESTORE
  crit: suspicious
  conf: 0.9
  if:
    type: text
    case_insensitive: true
    regex: '(^|[/\\])README[^/\\]{0,20}RESTORE$'
  downgrade:
    any:
    - id: well-known/tool/detection/
- id: ransom-note-filename-how-recover
  desc: Ransom note filename HOW RECOVER
  crit: suspicious
  conf: 0.9
  if:
    type: text
    case_insensitive: true
    regex: '(^|[/\\])HOW[_\-.][^/\\]{0,18}RECOVER$'
  downgrade:
    any:
    - id: well-known/tool/detection/
- id: ransom-note-filename-ransom-note
  desc: Ransom note filename RANSOM NOTE
  crit: suspicious
  conf: 0.9
  if:
    type: text
    case_insensitive: true
    regex: '(^|[/\\])RANSOM[ _.-][^/\\]{0,11}NOTE(\.[A-Za-z0-9]{1,5})?$'
  downgrade:
    any:
    - id: well-known/tool/detection/
- id: ransom-note-filename-readme-txt
  desc: Ransom note filename _readme.txt
  crit: suspicious
  conf: 0.9
  if:
    type: text
    case_insensitive: true
    regex: '(^|[/\\])_readme\.txt$'
  unless:
  - id: well-known/app/utility/360-file-guard/
  downgrade:
    any:
    - id: well-known/tool/detection/
- id: ransom-note-filename-restore-files-info
  desc: Ransom note filename RESTORE_FILES_INFO
  crit: suspicious
  conf: 0.95
  for: [scripts, binaries, batch, powershell, pe, python, javascript]
  if:
    type: text
    case_insensitive: true
    regex: '(?i)\bRESTORE_FILES_INFO\.(txt|hta)\b'
  downgrade:
    any:
    - id: well-known/tool/detection/
- id: locker-config-field-extensions-full
  desc: vecFullEncryptionExtensions config field
  crit: suspicious
  conf: 0.8
  if:
    type: text
    substr: vecFullEncryptionExtensions
- id: locker-config-field-extensions-skip
  desc: vecSkipFileExtensions config field
  crit: suspicious
  conf: 0.8
  if:
    type: text
    substr: vecSkipFileExtensions
- id: locker-config-field-key
  desc: sMasterPublicKey config field
  crit: suspicious
  conf: 0.8
  if:
    type: text
    substr: sMasterPublicKey
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: payment-status-check-1--gethaspayed
  desc: Payment status check method (getHasPayed)
  crit: component
  conf: 0.9
  for: [scripts, binaries]
  if:
    type: text
    case_insensitive: true
    word: getHasPayed
- id: payment-status-check-1--checkpayment
  desc: Payment status check method (checkPayment)
  crit: component
  conf: 0.9
  for: [scripts, binaries]
  if:
    type: text
    case_insensitive: true
    word: checkPayment
composite_rules:
- id: ransom-note-encrypted-state
  desc: Ransom-note encryption or lock state phrase
  crit: component
  conf: 0.85
  for: [elf, macho, pe, c, cpp]
  any:
  - id: ransom-note-files-encrypted-state
  - id: ransom-note-locked-state
- id: ransom-note-recovery-request
  desc: Ransom-note decryption or payment request phrase
  crit: component
  conf: 0.85
  for: [elf, macho, pe, c, cpp]
  any:
  - id: ransom-note-decrypt-word
  - id: ransom-note-recover-word
  - id: ransom-note-payment-word
- id: ransom-note-subject
  desc: Ransom-note phrase addresses victim files or data
  crit: component
  conf: 0.9
  for: [elf, macho, pe, c, cpp]
  any:
  - id: ransom-note-your-files
  - id: ransom-note-your-data
- id: ransom-note-text
  desc: Ransom note says data is locked and requests recovery action
  crit: suspicious
  conf: 0.95
  for: [elf, macho, pe, c, cpp]
  all:
  - id: ransom-note-subject
  - id: ransom-note-encrypted-state
  - id: ransom-note-recovery-request
  near_bytes: 2048
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: well-known/lib/core/htmlforgex/
  - id: well-known/lib/crypto/nss/
  - id: well-known/app/utility/360-file-guard::360-file-guard-identity
  - id: well-known/app/productivity/thebrain::thebrain-known-app-context
- id: xml-locker-settings-schema
  desc: XML locker configuration with destructive controls
  crit: suspicious
  conf: 0.97
  for: [binaries, scripts, source]
  all:
  - id: locker-command-enable-field
  any:
  - id: locker-kill-keep-field
  - id: locker-processes-field
  - id: locker-services-field
  - id: locker-white-extensions-field
  - id: locker-file-extensions-field
  - id: locker-enable-extension-field
  - id: locker-shutdown-enable-field
- id: payment-status-check-1
  desc: Payment status check method
  crit: component
  conf: 0.9
  for: [scripts, binaries]
  any:
  - id: payment-status-check-1--gethaspayed
  - id: payment-status-check-1--checkpayment
- id: ransomware-source-path
  desc: Ransomware source file path
  crit: suspicious
  conf: 0.95
  any:
  - id: ransomware-source-path-1a
  - id: ransomware-source-path-go-rs
  - id: ransomware-module-path-go-rs
  - id: locker-module-path-go-rs
  - id: ransomware-source-path-1c
  - id: ransomware-source-path-2
- id: config-note-fields
  desc: Ransomware note config fields
  crit: suspicious
  conf: 0.95
  any:
  - id: config-note-field-name
  - id: config-note-field-full
  - id: config-note-field-short
- id: config-cipher-fields
  desc: Ransomware cipher config fields
  crit: suspicious
  conf: 0.9
  all:
  - id: config-cipher-field-cipher
  - id: config-cipher-field-mode
- id: vm-kill-config
  desc: VM kill configuration fields
  crit: suspicious
  conf: 0.95
  any:
  - id: vm-kill-config-1
  - id: vm-kill-config-2
  - id: vm-kill-config-3
- id: kill-services-config
  desc: Service kill config for ransomware
  crit: suspicious
  conf: 0.85
  any:
  - id: kill-services-config-1
  - id: kill-services-config-2
- id: ransom-extension
  desc: Ransomware file extension markers
  crit: notable
  conf: 0.85
  for: [elf, macho, pe, c, cpp]
  any:
  - id: ransom-extension-1
  - id: ransom-extension-2
- id: payment-status-check
  desc: Ransomware payment verification
  crit: suspicious
  conf: 0.9
  any:
  - id: payment-status-check-1
  - id: payment-status-check-3
  downgrade:
    any:
    - id: metadata/signed/developer
- id: locker-config-fields
  desc: Ransomware locker configuration schema fields
  crit: suspicious
  conf: 0.95
  any:
  - id: locker-config-field-extensions-full
  - id: locker-config-field-extensions-skip
  - id: locker-config-field-key
- id: locker-behavioral-indicators
  desc: Ransomware behavioral indicators (logging and schema)
  crit: suspicious
  conf: 0.9
  any:
  - id: babuk-file-status-logging
  - id: locker-config-fields
  - id: babuk-file-io-errors
  needs: 2
- id: ransomware-encryption-pipeline
  desc: Ransomware file-encryption pipeline indicator
  crit: suspicious
  conf: 0.9
  any:
  - id: ransomware-encrypted-extension-status
  - id: ransomware-files-processed-encryption
  - id: ransomware-file-processing-pipeline
- id: ransom-note-filename
  desc: Ransom note filename patterns
  crit: suspicious
  conf: 0.9
  any:
  - id: ransom-note-filename-readme-restore
  - id: ransom-note-filename-how-recover
  - id: ransom-note-filename-ransom-note
  - id: ransom-note-filename-readme-txt
  - id: ransom-note-filename-restore-files-info
  - id: readme-extension-placeholder-note
  - id: readme-encrypted-suffix-note
- id: ransomware-basic
  desc: Ransomware encryption pattern
  crit: hostile
  conf: 0.95
  for: [elf, macho, pe, c, cpp]
  all:
  - id: micro-behaviors/crypto/library/keyword::openssl-evp-encrypt
  - id: ransom-note-text
  any:
  - id: ransom-note-filename
  - id: ransom-extension
  - id: crypted-counter
