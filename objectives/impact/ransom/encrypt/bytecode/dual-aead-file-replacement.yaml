defaults:
  platforms:
  - windows
  - unix
  for:
  - pyc
  attack: T1486
traits:
- id: pyc-dual-aead-file-replacement-ransom-evidence
  desc: Ransom text with dual AEAD file replacement
  crit: suspicious
  conf: 0.98
  if:
    type: yara
    source: "rule pyc_dual_aead_file_replacement {\n  strings:\n    $aes = \"AESGCM\"\n    $chacha = \"ChaCha20Poly1305\"\n    $read = \"read_bytes\"\n    $write\
      \ = \"write_bytes\"\n    $remove = \"remove\"\n    $ransom = /[Ee]very file.{0,60}has been encrypted|[Aa]ll files are encrypted/\n    $payment = /hours to pay|decryption\
      \ service|[Bb]itcoin|[Pp]ayment/\n  condition:\n    all of them and\n    for any i in (1..#read): (\n      for any j in (1..#write): (\n        @write[j] >\
      \ @read[i] and @write[j] - @read[i] < 1024 and\n        for any k in (1..#remove): (\n          @remove[k] > @write[j] and @remove[k] - @write[j] < 256\n  \
      \      )\n      )\n    )\n}\n"
composite_rules:
- id: pyc-dual-aead-file-replacement-ransom
  desc: Ransom text with dual AEAD file replacement
  crit: hostile
  conf: 0.98
  all:
  - id: pyc-dual-aead-file-replacement-ransom-evidence
  - id: micro-behaviors/fs/directory/traverse::pyc-walk-name-record
