# PyInstaller / .pyc Filecoder markers: marshalled note, extension, and helper
# names that survive packaging. Keep out of encrypt/filesystem/ to stay under
# the directory trait-count budget.
defaults:
  platforms: [unix, windows]
  for: [pyc]
  attack: T1486
  mbc: B0040

traits:
  - id: readme-decrypt-note
    desc: README_DECRYPT ransom note filename
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: README_DECRYPT.txt

  - id: cryptor-extension
    desc: Ransom .cryptor extension marker
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])\.cryptor\b'

  - id: enc-extension
    desc: Ransom .enc extension marker
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])\.enc\b'

  - id: leave-ransom-note
    desc: leave_ransom_note helper symbol
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: leave_ransom_note

  # These are Base64 representations of UTF-16 strings inside an embedded
  # .NET payload. A single phrase can occur in analysis fixtures; the hostile
  # rule below requires three distinct operator/user-facing ransomware states.
  - id: base64-utf16-ransomware-started
    desc: Base64 UTF-16 ransomware start message
    crit: component
    conf: 0.98
    if:
      type: text
      substr: AGEAbgBzAG8AbQB3AGEAcgBlACAAcwB0AGEAcgB0AGUA

  - id: base64-utf16-starting-decryption
    desc: Base64 UTF-16 decryption start message
    crit: component
    conf: 0.97
    if:
      type: text
      substr: dABhAHIAdABpAG4AZwAgAHQAbwAgAGQAZQBjAHIAeQBwAHQA

  - id: base64-utf16-wrong-decryption-password
    desc: Base64 UTF-16 wrong decryption password
    crit: component
    conf: 0.99
    if:
      type: text
      substr: VwByAG8AbgBnACAAZABlAGMAcgB5AHAAdABpAG8AbgAgAHAAYQBzAHMAdwBvAHIA

  - id: base64-utf16-deleted-restore-points
    desc: Base64 UTF-16 deleted restore points
    crit: component
    conf: 0.99
    if:
      type: text
      substr: RABlAGwAZQB0AGUAZAAgAHIAZQBzAHQAbwByAGUAIABwAG8AaQBuAHQA

composite_rules:
  - id: encrypt-walk-ransom
    desc: Python bytecode recursive encrypt with note
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/symmetric/encrypt::python-bytecode-recursive-encrypt-helper
      - id: micro-behaviors/crypto/symmetric/encrypt::python-bytecode-encrypt-file-helper
      - id: readme-decrypt-note
    any:
      - id: cryptor-extension
      - id: enc-extension
  - id: embedded-dotnet-ransomware-message-cluster
    desc: Embedded .NET ransomware message cluster
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/encoded::raw-base64-pe-header
      - id: micro-behaviors/data/encode/base64::embedded-base64-blob
    any:
      - id: base64-utf16-ransomware-started
      - id: base64-utf16-starting-decryption
      - id: base64-utf16-wrong-decryption-password
      - id: base64-utf16-deleted-restore-points
    needs: 3
