# PyInstaller / .pyc Filecoder markers: marshalled note, extension, and helper
# names that survive packaging. Keep out of encrypt/filesystem/ to stay under
# the directory trait-count budget.
defaults:
  platforms: [unix, windows]
  for: [pyc]
  attack: T1486
  mbc: B0040

traits:
  - id: readme-decrypt-note
    desc: README_DECRYPT ransom note filename
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: README_DECRYPT.txt

  - id: cryptor-extension
    desc: Ransom .cryptor extension marker
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])\.cryptor\b'

  - id: enc-extension
    desc: Ransom .enc extension marker
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])\.enc\b'

  - id: leave-ransom-note
    desc: leave_ransom_note helper symbol
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: leave_ransom_note

  - id: encrypt-recursive
    desc: encrypt_recursive helper symbol
    crit: suspicious
    conf: 0.93
    if:
      type: text
      substr: encrypt_recursive

  - id: encrypt-file-helper
    desc: encrypt_file helper symbol
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: encrypt_file

composite_rules:
  - id: encrypt-walk-ransom
    desc: Python bytecode recursive encrypt with note
    crit: hostile
    conf: 0.98
    all:
      - id: encrypt-recursive
      - id: encrypt-file-helper
      - id: readme-decrypt-note
    any:
      - id: cryptor-extension
      - id: enc-extension
