defaults:
  platforms: [android, unix]
  for: [perl]
  attack: T1486

traits:
  - id: perl-ransom-encrypted-ext
    desc: Perl ransomware extension
    crit: suspicious
    conf: 0.94
    if:
      type: text
      # Trailing \b stops the bare ENCRYPTED_EXT token from matching inside the
      # TLS 1.3 message constant ENCRYPTED_EXTENSIONS (MT_ENCRYPTED_EXTENSIONS),
      # which every TLS library and TLS test references — that is a protocol
      # name, not a ransom file extension.
      regex: 'ENCRYPTED_EXT\b|\.c13v3d'
    unless:
      - id: well-known/lib/crypto/openssl/
      - id: well-known/tool/development/cmder::vendor-member
      - id: metadata/package/files/system-package::os-vendored-perl-module

  # `ord(substr(...))^` is a generic Perl byte-XOR idiom (gropdf uses it for PDF
  # encryption); not ransomware on its own. Building block for the ransomware
  # composite below, which also requires cleartext deletion + "Encrypted:" marker.
  - id: perl-xor-encrypt-file
    desc: Perl XOR file encryption
    crit: component
    conf: 0.93
    if:
      type: text
      regex: 'xor_encrypt|ord\(substr[\s\S]{0,80}\^'

  - id: perl-delete-cleartext
    desc: Perl deletes a named file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'unlink\(\$filepath\)'

  - id: perl-encryption-completion-marker
    desc: Perl encryption completion marker
    crit: component
    conf: 0.8
    if:
      type: text
      substr: 'Encrypted:'

composite_rules:
  - id: perl-xor-ransomware-files
    desc: Perl XOR ransomware files
    crit: hostile
    conf: 0.98
    all:
      - id: perl-ransom-encrypted-ext
      - id: perl-xor-encrypt-file
      - id: perl-delete-cleartext
      - id: perl-encryption-completion-marker
