    desc: File encryption ransomware tool
    conf: 0.95
    attack: T1486
    needs: 5
    any:
      - id: micro-behaviors/crypto/provider/library::chilkat-crypto-lib
      - id: metadata/lang/source/naming/security::encrypt-module
      - id: metadata/lang/source/naming/security::decrypt-module
