defaults:
  for: [ruby]
  platforms: [windows, unix]
traits:
  - id: ruby-bulk-shell-extension-rename
    desc: Shell-renames wildcard file extensions in loop
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (for body: (do (assignment right: (call method: (identifier) @system
          arguments: (argument_list (string) @command))))
          (#eq? @system "system") (#match? @command "start /min ren \\*"))
composite_rules:
  - id: ruby-ransom-bulk-rename-encryption
    desc: Ransom demand with bulk rename and encryption
    crit: hostile
    conf: 0.99
    all:
      - id: ruby-ransom-note-prose
      - id: ruby-bulk-shell-extension-rename
      - id: micro-behaviors/crypto/symmetric/aes/initialize::ruby-aes-cbc-cipher-construction
