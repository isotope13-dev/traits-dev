# Android hybrid extortion malware commonly combines a Java/Kotlin file-tree
# walker with AES output, deletion of the plaintext, and a sibling encrypted
# suffix. The atoms deliberately avoid a family name, ransom prose, or a C2
# hostname so future lockers using the same mechanics remain detectable.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1486
  mbc: B0040

composite_rules:
  - id: android-aes-file-output-delete-flow
    desc: Android AES output with source deletion
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/symmetric/encrypt::java-cipher-encrypt-mode
      - id: micro-behaviors/crypto/library/provider::dofinal-method
      - id: micro-behaviors/fs/write/file/direct::java-fileoutputstream-source
      - id: micro-behaviors/fs/delete/file::java-file-delete-source
    near_lines: 30

  - id: android-recursive-file-encryptor
    desc: Android recursive .enc file encryptor
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/directory/traverse::java-listfiles-directory-descent
      - id: micro-behaviors/fs/path/construct::java-dot-enc-sibling-path
      - id: android-aes-file-output-delete-flow
    near_lines: 100

  - id: android-ransomware-surveillance-hybrid
    desc: Android ransomware with device surveillance
    crit: hostile
    conf: 0.995
    attack: T1486,T1113,T1125,T1417.001,T1636.004
    all:
      - id: android-recursive-file-encryptor
    any:
      - id: micro-behaviors/hardware/display/screenshot::android-source-media-projection-screen-capture
      - id: micro-behaviors/hardware/display/camera::android-source-camera-capture
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: objectives/collection/messaging/sms::android-source-sms-inbox-query
      - id: micro-behaviors/communications/http/websocket::android-source-okhttp-websocket-client
    needs: 2

  - id: android-ransomware-touch-locker
    desc: Android ransomware pairs file encryption with a touch-blocking overlay
    crit: hostile
    conf: 0.995
    attack: T1486,T1411,T1056.002
    all:
      - id: android-recursive-file-encryptor
      - id: micro-behaviors/ui/window/manage/overlay::android-transparent-touch-capture-overlay
    any:
      - id: micro-behaviors/os/privilege/manifest::add-device-admin-action
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-settings-intent
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
    needs: 1
