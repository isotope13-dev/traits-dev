# RubyGems extconf.rb is a trusted install-time compiler probe. When it instead
# base64-decodes Windows commands, writes a ransom note, and hides files, the
# native-extension build is a dropper for a locker.
defaults:
  platforms: [windows, unix]
  for: [ruby]
  attack: T1486
  mbc: B0019

traits:
  - id: ruby-ransom-note-prose
    desc: Ruby source contains ransom-note payment copy
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)(all your files are encrypt|pay \d+\s*\$ in bitcoin|files will be deleted)'
  - id: ruby-taskkill-force-im
    desc: Ruby invokes taskkill /F /IM
    crit: suspicious
    conf: 0.93
    attack: T1489
    if:
      type: text
      regex: '(?i)taskkill /f /im'

composite_rules:
  - id: ruby-extconf-ransom-locker
    desc: Ruby extconf runs a base64-decoded ransomware dropper
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/build/package/recipe::filename-extconf
      - id: objectives/anti-static/obfuscation/payload/encoded::ruby-system-base64-decode
      - id: ruby-ransom-note-prose
    any:
      - id: micro-behaviors/fs/file/attributes::attrib-hidden
      - id: objectives/impact/ransom/note::ransom-deface-phrase
  - id: ruby-extconf-taskkill-dropper
    desc: Ruby extconf force-kills Windows processes during install
    crit: hostile
    conf: 0.97
    attack: T1489,T1486
    all:
      - id: metadata/build/package/recipe::filename-extconf
      - id: ruby-taskkill-force-im
      - id: objectives/anti-static/obfuscation/payload/encoded::ruby-system-base64-decode
