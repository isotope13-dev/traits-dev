# RubyGems extconf.rb is a trusted install-time compiler probe. When it instead
# base64-decodes Windows commands, writes a ransom note, and hides files, the
# native-extension build is a dropper for a locker.
defaults:
  platforms: [windows, unix]
  for: [ruby]
  attack: T1486
  mbc: B0019

traits:
  - id: ruby-ransom-note-prose
    desc: Ruby source contains ransom-note payment copy
    crit: suspicious
    conf: 0.94
    if:
      # Ransom copy addresses the victim's files. The bare "files will be
      # deleted" phrasing also occurs in benign cleanup comments (Cleo RCE
      # module: "the autorun files will be deleted by the system").
      type: text
      regex: '(?i)(your files (are|will be) deleted|all your files are encrypt|pay \d+\s*\$ in bitcoin)'
      # Puppet's tidy spec: "the files will be deleted first".
      not:
        - substr: deleted first

composite_rules:
  - id: ruby-extconf-ransom-locker
    desc: Ruby extconf runs a base64-decoded ransomware dropper
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: objectives/anti-static/obfuscation/payload/encoded/exec::ruby-system-base64-decode
      - id: ruby-ransom-note-prose
    any:
      - id: micro-behaviors/fs/file/attributes::attrib-hidden
  - id: ruby-extconf-taskkill-dropper
    desc: Ruby extconf force-kills Windows processes during install
    crit: hostile
    conf: 0.97
    attack: T1489,T1486
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/process/terminate/command::ruby-taskkill-force-image
      - id: objectives/anti-static/obfuscation/payload/encoded/exec::ruby-system-base64-decode
