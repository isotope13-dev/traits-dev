defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1486
  mbc: E1486
  size_min: 256
  size_max: 1048576
traits:
  - id: ps-filecryptography-module
    desc: PowerShell FileCryptography module import
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: "FileCryptography.psm1"
  - id: ps-protect-file-aes
    desc: PowerShell AES Protect-File use
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'Protect-File\s+\$file.{0,80}-Algorithm\s+AES'
  - id: ps-encrypted-extension-default
    desc: PowerShell encrypted extension default
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: '$Extension = ".encrypted"'
  - id: ps-remove-source-after-encrypt
    desc: PowerShell RemoveSource parameter token
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\-RemoveSource\b'
  - id: ps-encrypted-extension-append
    desc: PowerShell appends encrypted extension
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\$file\.Name\s*\+\s*["'']\.encrypted["'']'
      case_insensitive: true
composite_rules:
  - id: ps-ransomware-simulator-file-encryptor
    desc: PowerShell ransomware simulator encryptor
    crit: hostile
    conf: 0.98
    all:
      - id: ps-protect-file-aes
      - id: objectives/impact/ransom/file-operations::ps-ransomware-recursive-targeting
      - id: objectives/impact/ransom/file-operations::ps-ransomware-suffix-source-removal
    any:
      - id: ps-filecryptography-module
      - id: objectives/impact/ransom/native::ps-ransomware-simulator-banner
