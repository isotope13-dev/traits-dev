# Batch scripts that stage PowerShell file encryption over a user profile.
# The encryption loop arrives as quoted -Command text inside a .bat/.cmd, so
# the PowerShell-file family above never sees it: those traits gate on the
# .ps1 file type while the destructive chain lives in an embedded string.
# The required chain is the destruction itself - AES encryptor init, a
# recursive file walk, and full-byte rewrite - joined to an original-file
# deletion or ransom wording. A backup tool that encrypts copies shares the
# first three legs but neither deletes sources nor speaks in ransom wording,
# which is what the any: leg excludes.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1486,T1485
composite_rules:
- id: batch-powershell-encrypt-delete
  desc: Batch stage encrypts walked files and removes originals
  crit: hostile
  conf: 0.94
  near_lines: 26
  all:
  - id: micro-behaviors/crypto/encrypt/reference::dotnet-create-encryptor
  - id: micro-behaviors/fs/directory/traverse::powershell-recursive-child-item
  - id: micro-behaviors/fs/write/file/full/bytes::write-all-bytes
  any:
  - id: micro-behaviors/fs/delete/file/command::powershell-force-remove-file-path-text
  - id: objectives/impact/ransom/encrypt/threat-text::files-encrypted-msg
  - id: objectives/impact/ransom/note::ultimatum-filename-a
