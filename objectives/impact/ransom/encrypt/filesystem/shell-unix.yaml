defaults:
  platforms: [unix, netbsd]
  for: [shell]
  attack: T1486

traits:
  - id: shell-ransom-restore-note
    desc: Shell ransom restore note
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: RESTORE_FILES.txt

composite_rules:
  - id: shell-gpg-bulk-encrypt-source-delete
    desc: Recursively GPG-encrypts files and deletes their plaintext sources
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/crypto/symmetric/gpg::gpg-headless-symmetric-encryption
      - id: micro-behaviors/crypto/symmetric/gpg::gpg-symmetric-gpg-output
      - id: micro-behaviors/fs/directory/traverse::find-type-file
    any:
      - id: micro-behaviors/fs/file/delete::rm-option-terminator
      - id: micro-behaviors/fs/file/delete::rm-force-variable-target
    near_lines: 50

  - id: shell-gpg-user-documents-locker
    desc: Recursively encrypts and deletes files in a user's Documents folder
    crit: hostile
    conf: 0.99
    all:
      - id: shell-gpg-bulk-encrypt-source-delete
      - id: micro-behaviors/fs/path/location::documents-folder-target
    near_lines: 80

  - id: shell-openssl-bulk-file-ransom
    desc: Recursive OpenSSL file ransomware
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/crypto/symmetric/aes/openssl::openssl-enc-aes
      - id: micro-behaviors/fs/directory/traverse::find-type-file
      - id: micro-behaviors/fs/file/extension::locked-extension-reference
      # Writing encrypted copies while retaining the originals is not impact.
      # Require the script to delete its cleartext variable target as well.
      - id: micro-behaviors/fs/file/delete::rm-force-variable-target
      - id: objectives/impact/ransom/note::encrypted-host-data-notice
      - id: micro-behaviors/communications/proxy/tor::onion-domain-reference
    near_lines: 80

  - id: shell-openssl-ransom-encrypt
    desc: Shell OpenSSL ransom encrypt
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/symmetric/aes/openssl::openssl-enc-aes
      - id: shell-ransom-restore-note
    any:
      - id: objectives/impact/ransom/note::ransomware-banner-core
