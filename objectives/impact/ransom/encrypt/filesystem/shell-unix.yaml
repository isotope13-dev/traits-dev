defaults:
  platforms: [unix, netbsd]
  for: [shell]
  attack: T1486

traits:
  - id: shell-ransom-restore-note
    desc: Shell ransom restore note
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: RESTORE_FILES.txt

composite_rules:
  - id: shell-openssl-bulk-file-ransom
    desc: Recursive OpenSSL file ransomware
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/crypto/symmetric/aes/openssl::openssl-enc-aes
      - id: micro-behaviors/fs/directory/traverse::find-type-file
      - id: micro-behaviors/fs/file/extension::locked-extension-reference
      - id: objectives/impact/ransom/note::encrypted-host-data-notice
      - id: micro-behaviors/communications/proxy/tor::onion-domain-reference

  - id: shell-openssl-ransom-encrypt
    desc: Shell OpenSSL ransom encrypt
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/symmetric/aes/openssl::openssl-enc-aes
      - id: shell-ransom-restore-note
    any:
      - id: objectives/impact/ransom/note::ransomware-banner-core
