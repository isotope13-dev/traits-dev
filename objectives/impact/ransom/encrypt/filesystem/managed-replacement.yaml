defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1486
composite_rules:
  # This is an attempted replacement, not proof of successful encryption.
  # Invalid key/IV sizes, access failures or unreachable helpers can prevent
  # the transform from returning before either output or deletion occurs.
  - id: managed-ransom-file-replacement-attempt
    desc: Ransom demands with file-replacement CIL and crypto references
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/data/control-flow/sequence::cil-transform-suffixed-output-call-layout
      - id: micro-behaviors/crypto/encrypt::dotnet-create-encryptor
      - id: micro-behaviors/crypto/cipher::dotnet-cryptostream
      - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
    any:
      - id: objectives/impact/ransom/keywords::ransom-note-btc-payment-wide
      - id: objectives/impact/ransom/keywords::pay-bitcoin-phrase
      - id: objectives/impact/ransom/keywords::transfer-bitcoin-phrase

  # Managed async implementations may expose the operations without matching
  # the older single-method CIL layout above. Require a payment note, actual
  # file read/write APIs, a streaming encryptor, and drive/file enumeration.
  - id: managed-drive-file-encryptor-with-ransom-demand
    desc: Managed drive file encryption with ransom payment demand
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/framework::clr-runtime-header
      - id: micro-behaviors/crypto/encrypt::dotnet-create-encryptor
      - id: micro-behaviors/crypto/cipher::dotnet-cryptostream
      - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
      - id: micro-behaviors/fs/traversal/drives::get-drives-dotnet
      - id: metadata/binary/symbols/name::dotnet-getfiles-method-name
      - id: objectives/impact/ransom/keywords::ransom-note-btc-payment-wide
