defaults:
  platforms: [unix, windows]
  for: [rust, python, binaries]
  attack: T1486

composite_rules:
  - id: aead-destructive-file-relabeling
    desc: AES-GCM overwrite sequence with file renaming
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/write/encrypted::aead-file-overwrite-sequence
    any:
      - id: micro-behaviors/fs/file/rename::rust-truncate-then-rename
      - id: micro-behaviors/fs/file/rename::rust-source-truncate-then-rename
      - id: micro-behaviors/fs/file/rename::os-rename
