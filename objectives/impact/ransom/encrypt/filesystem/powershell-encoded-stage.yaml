defaults:
  platforms: [windows]
  for: [batch]
  attack: T1486
composite_rules:
  - id: encoded-powershell-file-replacement-with-key-demand
    desc: Encoded PowerShell file encryption with key demand
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/encoding/base64::encoded-ps-aes-managed
      - id: micro-behaviors/crypto/encrypt/file::powershell-file-bytes-to-transform
      - id: micro-behaviors/fs/write/encrypted::powershell-write-before-source-removal
      - id: micro-behaviors/fs/directory/traverse::powershell-recursive-child-item
      - id: objectives/impact/ransom/note::encoded-arabic-files-encrypted-claim
      - id: objectives/impact/ransom/note::encoded-arabic-secret-key-request
