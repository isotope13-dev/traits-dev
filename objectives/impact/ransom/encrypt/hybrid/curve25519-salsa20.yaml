defaults:
  platforms: [linux, windows]
  for: [source, binaries, scripts]
  attack: T1486
  mbc: B0040

traits:
  - id: locker-process-list-config-key
    desc: Locker process-kill list names
    crit: suspicious
    conf: 0.9
    for: [c, cpp, elf, pe, powershell, batch, python, go]
    if:
      type: text
      # A single short token is commonly an application field or operator
      # label.  Require two name-shaped entries before treating `prc` as a
      # process-kill configuration list.
      regex: '(?i)["'']prc["'']\s*:\s*\[\s*["''][\w.-]{3,80}["'']\s*,\s*["''][\w.-]{3,80}["'']'

  - id: locker-service-list-config-key
    desc: Locker service-kill list names
    crit: suspicious
    conf: 0.9
    for: [c, cpp, elf, pe, powershell, batch, python, go]
    if:
      type: text
      regex: '(?i)["'']svc["'']\s*:\s*\[\s*["''][\w.-]{3,80}["'']\s*,\s*["''][\w.-]{3,80}["'']'

  - id: locker-encrypted-extension-config-key
    desc: Encrypted extension-list config field
    crit: suspicious
    conf: 0.9
    for: [c, cpp, elf, pe, powershell, batch, python, go]
    if:
      type: text
      regex: '(?i)\\?["'']ext\\?["'']\s*:\s*\['

  - id: locker-session-secret-config-label
    desc: Session key registry label
    crit: notable
    conf: 0.94
    for: [c, cpp, elf, pe, powershell, batch, python, go]
    if:
      type: text
      regex: '(?i)\bsession_(secret|public)_[12]\b'

composite_rules:
  - id: locker-process-service-extension-config
    desc: Locker config combines process, service, and encrypted-extension controls
    crit: suspicious
    conf: 0.95
    all:
      - id: locker-process-list-config-key
      - id: locker-service-list-config-key
      - id: locker-encrypted-extension-config-key
    near_lines: 20

  - id: registry-session-secret-stash
    desc: Encrypted ransomware session state stored as binary registry values
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/registry/access::native-registry-binary-write
      - id: locker-session-secret-config-label
      - id: micro-behaviors/crypto/asymmetric/curve25519::curve25519-donna-call
    near_lines: 80

  - id: curve25519-salsa20-file-encryptor
    desc: Curve25519-wrapped Salsa20 file encryptor with locker controls
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/asymmetric/curve25519::curve25519-donna-call
      - id: micro-behaviors/crypto/symmetric/stream::salsa20-stream-cipher-call
      - id: micro-behaviors/fs/file/binary::source-file-content-io
      - id: locker-process-service-extension-config
    near_lines: 100

  - id: safe-mode-ransomware-file-encryptor
    desc: File encryptor that enables Windows Safe Mode for its locker run
    crit: hostile
    conf: 0.98
    platforms: [windows]
    all:
      - id: micro-behaviors/os/kernel/boot::bcdedit-safeboot-minimal
      - id: micro-behaviors/crypto/symmetric/stream::salsa20-stream-cipher-call
      - id: micro-behaviors/fs/file/binary::source-file-content-io
      - id: locker-encrypted-extension-config-key
    near_lines: 100
