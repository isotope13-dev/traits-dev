defaults:
  platforms: [linux, macos, windows]
  for: [binaries, c, cpp, rust, go]
  attack: T1486
  mbc: B0040

traits:
- id: encrypted-trailer-layout--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.92
  if:
    type: text
    regex: '(?i)(trailer|footer).{0,80}(ciphertext|shared[_ -]?secret)'

  count_max: 1009310
- id: encrypted-trailer-layout--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.92
  if:
    type: text
    regex: '(ciphertext|shared[_ -]?secret).{0,80}(trailer|footer)'

  count_max: 1009311

- id: ransom-note-read-me-now
  desc: READ_ME_NOW ransom note
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: '(?i)\bread[_ -]?me[_ -]?now\.(txt|hta|html?)\b'

- id: rust-pkcs1v15-encrypt-error
  desc: Rust PKCS1v15 RSA encrypt error message
  # `RSA Pkcs1v15Encrypt failed` / `RSA PKCS1v15 segment encryption
  # failed` are operator-facing error strings unique to a hybrid
  # ransomware that encrypts AES session keys via RSA-PKCS1v15.
  # Legitimate Rust crypto code surfaces these at the trait/Result
  # level, not as English-language print strings.
  crit: suspicious
  conf: 0.9
  for: [pe, elf, macho]
  if:
    type: text
    regex: 'RSA[ _]?(Pkcs1v15Encrypt|PKCS1v15 segment encryption) failed'

composite_rules:
- id: time-seeded-chacha-rsa-file-encryptor
  desc: Time-seeded ChaCha20 and RSA file encryptor
  crit: hostile
  conf: 0.99
  for: [c, cpp, elf, pe, dll]
  all:
  - id: micro-behaviors/os/random/crypto::time-seeded-prng-source
  - id: micro-behaviors/crypto/symmetric/stream::chacha20-cipher-operation
  - id: micro-behaviors/crypto/asymmetric/rsa::rsa-public-encrypt-call
  - id: micro-behaviors/fs/file/encrypt::native-file-encryption-routine
  - id: micro-behaviors/fs/file/binary::source-file-content-io
  near_lines: 80

- id: chacha20-rsa-4096-file-key-wrap
  desc: ChaCha20 file encryption with RSA-4096 key wrapping
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/crypto/symmetric/stream::chacha20-cipher-operation
  - id: micro-behaviors/crypto/asymmetric/rsa::rsa-4096-public-encrypt-call
  - id: micro-behaviors/fs/file/binary::source-file-content-io
  near_lines: 40

- id: ntru-chacha-file-encryptor
  desc: NTRU-wrapped ChaCha20 file encryptor
  crit: hostile
  conf: 0.99
  for: [c, cpp]
  all:
  - id: micro-behaviors/crypto/asymmetric/ntru::ntru-encrypt-class
  - id: micro-behaviors/crypto/symmetric/stream::chacha20-cipher-operation
  - id: micro-behaviors/fs/file/encrypt::native-file-encryption-routine
  - id: objectives/impact/ransom/encrypt/bulk-encryption::native-encrypted-suffix-rename
  any:
  - id: micro-behaviors/fs/directory/traverse::cpp-recursive-directory-iterator-source
  - id: micro-behaviors/fs/enumerate/directory::find-file-undecorated-source-walker
  - id: micro-behaviors/fs/enumerate/directory::find-file-walker-wide
  - id: micro-behaviors/fs/enumerate/directory::find-file-walker-wide-ex

- id: public-key-trailer-encryptor
  desc: Public-key trailer file encryptor
  crit: hostile
  conf: 0.98
  all:
  - id: encrypted-trailer-layout
  - id: micro-behaviors/crypto/asymmetric/key::pem-public-key-header
  any:
  - id: micro-behaviors/crypto/symmetric/stream::rc4-strings
  - id: micro-behaviors/data/decode/base64-symbol::go-base64-decode
- id: pqc-hybrid-ransomware
  desc: PQC hybrid ransomware encryptor
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/crypto/asymmetric/kem::pqc-hybrid-crypto-stack
  any:
  - id: objectives/impact/ransom/encrypt/config::ransom-extension
  - id: ransom-note-read-me-now
  - id: objectives/impact/ransom/tactics::shadow-delete
  - id: objectives/impact/ransom/encrypt/config::rust-file-encryptor
  needs: 2
  unless:
  - id: well-known/dual-use/transfer/rclone::rclone-tool
  - id: well-known/tool/sysadmin/container/
  - id: well-known/tool/development/go-toolchain::go-toolchain-distribution
  - id: well-known/tool/sysadmin/alpine-packages/
- id: encrypted-trailer-layout
  desc: Encrypted file trailer metadata
  crit: suspicious
  conf: 0.92
  any:
  - id: encrypted-trailer-layout--rx-1
  - id: encrypted-trailer-layout--rx-2
  unless:
  - id: micro-behaviors/crypto/library/stdlib::go-rsa-pss-params-string
  - id: micro-behaviors/crypto/library/stdlib::go-crypto-rsa-import
  - id: micro-behaviors/crypto/library/stdlib::go-rsa-private-key-string
  - id: micro-behaviors/communications/http/lib/netlib::go-http-te-header-runtime-string
  - id: micro-behaviors/communications/http/lib/netlib::go-http-trailer-eof-runtime-string
  - id: micro-behaviors/communications/http/lib/netlib::go-http-location-header-runtime-string
- id: rust-aes-gcm-rsa-hybrid-stack
  desc: Rust hybrid AES-GCM + RSA file-encryptor stack
  # Both Rust crypto crates linked into the same binary is the
  # textbook hybrid-ransomware shape: random AES key per file +
  # RSA encryption of that key under the operator's public key.
  # Either crate alone is a normal Rust crypto dependency.
  crit: hostile
  conf: 0.96
  for: [pe, elf, macho]
  all:
  - id: micro-behaviors/crypto/symmetric/aes/library::rust-aes-gcm-crate-path
  - id: micro-behaviors/crypto/asymmetric/rsa::rust-rsa-crate-path
  unless:
  - id: well-known/app/security/bitwarden::bitwarden-app
  - id: well-known/app/security/keepassxc/
