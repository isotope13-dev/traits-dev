# Hybrid crypto plus an embedded extortion note and file rewrite/rename
# capabilities. Neither family names, destination hosts nor suffixes gate it.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: native-aes-curve25519-extortion-encryptor
    desc: AES/Curve25519 extortion file encryptor
    crit: hostile
    conf: 0.98
    attack: T1486
    all:
      - id: micro-behaviors/crypto/symmetric/aes/constant::aes-sbox-bytes-pe-rdata
      - id: micro-behaviors/crypto/asymmetric/curve25519::curve25519-clamp
      - id: objectives/impact/ransom/extortion::base64-stolen-encrypted-phrase
      - id: micro-behaviors/fs/read/file/handle::read-file
      - id: micro-behaviors/fs/write/file/handle/call::write-file
      - id: micro-behaviors/fs/file/move::move-file-ex-import
