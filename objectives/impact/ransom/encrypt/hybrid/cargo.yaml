# Migrated from the mixed Cargo package profile; the destination names the required claim.
defaults:
  platforms: [unix, windows]
  for: [cargo.toml]

composite_rules:
- id: cargo-ransomware-hybrid-crypto
  desc: Cargo ransomware hybrid crypto stack
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/package/name/convention::cargo-package-name-ransomware
  - id: metadata/package/dependencies/manifest/identity::cargo-dep-chacha20poly1305
  any:
  - id: metadata/package/dependencies/manifest/identity::cargo-dep-p256-ecdh
  - id: metadata/package/dependencies/manifest/presence::cargo-dep-walkdir
