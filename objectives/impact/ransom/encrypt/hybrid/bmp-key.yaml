# Conti-style lockers wrap a per-file ChaCha20 key, hide that wrapped key in
# the LSBs of a BMP pixel array, and append the ciphertext to the same bitmap.
defaults:
  platforms: [windows, unix]
  for: [c, cpp]
  attack: T1486
  mbc: B0040

composite_rules:
  - id: bmp-lsb-wrapped-key-locker
    desc: File encryptor hides a wrapped key in bitmap LSBs
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/anti-static/obfuscation/steganography/image::bmp-lsb-bit-spread
      - id: micro-behaviors/crypto/library/cryptoapi::crypt-encrypt
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-cipher-operation
      - id: micro-behaviors/fs/file/encrypt::native-file-encryption-routine
    near_lines: 80
