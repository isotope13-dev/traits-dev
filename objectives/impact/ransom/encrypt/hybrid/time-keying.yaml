defaults:
  platforms: [macos]
  for: [macho]
  attack: T1486
composite_rules:
  - id: macos-ransomware-core
    desc: macOS ransomware file encryptor
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/user/lookup::getpwuid
      - id: micro-behaviors/os/privilege/query::getuid
      - id: micro-behaviors/fs/file/read-write::file-overwrite-routine
      - id: micro-behaviors/fs/delete/path::native-remove-api-or-call-clues
      - id: micro-behaviors/process/create/subprocess/reference::system-command-api-clues
      - id: objectives/impact/ransom/encrypt/config::ransom-note-text
    any:
      - id: metadata/lang/natural/vocabulary/duration::seven-days-period
  - id: macos-obfuscated-ransomware
    desc: macOS obfuscated ransomware orchestration
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/subprocess/reference::system-command-api-clues
      - id: micro-behaviors/dylib/load/runtime::dlopen-dlsym
      - id: micro-behaviors/os/user/lookup::getpwuid
      - id: micro-behaviors/os/privilege/query::getuid
      - id: micro-behaviors/fs/file/read-write::file-overwrite-routine
      - id: micro-behaviors/fs/delete/path::native-remove-api-or-call-clues
      - id: objectives/impact/ransom/encrypt/config::ransom-note-text
    any:
      - id: metadata/lang/natural/vocabulary/duration::seven-days-period
    unless:
      - id: metadata/signature/verified/platform::apple
  - id: macos-ransomware-threaded
    desc: Threaded macOS ransomware worker
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/os/user/lookup::getpwuid
      - id: micro-behaviors/os/privilege/query::getuid
      - id: micro-behaviors/fs/file/read-write::file-overwrite-routine
      - id: micro-behaviors/fs/delete/path::native-remove-api-or-call-clues
      - id: micro-behaviors/process/thread/runtime::pthread
      - id: objectives/impact/ransom/encrypt/config::ransom-note-text
    any:
      - id: metadata/lang/natural/vocabulary/duration::seven-days-period
