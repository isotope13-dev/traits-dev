# Runtime-generated ransomware combines a model-driven interpreter pipeline
# with destructive instructions.  These rules target the technique, not the
# PromptLock or EncForge names, vendors, or fixed model/API strings.
defaults:
  platforms: [unix, windows]
  for: [python, go, lua, shell, javascript, typescript, powershell, rust]
  attack: T1486

traits:
  - id: destructive-action-b
    desc: Destructive or exfiltration verb with target
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(delete|exfiltrate|steal)\w*\s+(files?|data)\b'

  - id: destructive-data-target-a
    desc: Destructive operation names file data
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(encrypt|lock|destroy)\w*\s+(files?|data)\b'

  - id: destructive-data-target-b
    desc: LLM targets model or dataset
    crit: component
    conf: 0.92
    if:
      type: literal
      regex: '(?i)\b(models?|checkpoints?|datasets?)\b'

  - id: destructive-data-target-c
    desc: LLM targets index or vector data
    crit: component
    conf: 0.92
    if:
      type: literal
      regex: '(?i)\b(indexes?|vectors?)\b'

  - id: ransomware-word
    desc: LLM ransomware or extortion term
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(ransom|ransomware|extortion)\b'

  - id: encrypted-outcome-reference
    desc: LLM states files or data are encrypted
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(files? encrypted|data has been encrypted)\b'

  - id: llm-locked-extension-append
    desc: Appends a locked file extension
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bappend[^\n]{0,40}\.locked\b'

  - id: llm-locked-extension-rename
    desc: Renames a path with a locked extension
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)path\s*\+[^\n]{0,40}\.locked\b'

  - id: llm-ransom-note-filename
    desc: Writes a ransomware note filename
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)README[_-]?(RANSOM|RESTORE|DECRYPT)'

  - id: llm-encrypted-data-note
    desc: Writes a data-encrypted ransom message
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(your|all)\s+(data|files?)\s+(has|have)\s+been\s+encrypted\b'

  - id: llm-ai-encrypted-data-note
    desc: Writes an AI data-encrypted ransom message
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bAI\s+data\s+has\s+been\s+encrypted\b'

composite_rules:
  - id: llm-destructive-action
    desc: LLM destructive action request
    crit: component
    conf: 0.95
    any:
      - id: destructive-action-b
      - id: destructive-data-target-a

  - id: llm-destructive-data-target
    desc: LLM destructive data target
    crit: component
    conf: 0.95
    any:
      - id: destructive-data-target-a
      - id: destructive-data-target-b
      - id: destructive-data-target-c
      - id: destructive-action-b

  - id: llm-destructive-operation-instruction
    desc: LLM requests destructive data operation
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/llm::llm-code-generation-instruction
      - id: micro-behaviors/process/create/eval::model-response-interpreter
      - id: llm-destructive-action
      - id: llm-destructive-data-target
    near_bytes: 2048

  - id: llm-ransomware-instruction
    desc: LLM instruction includes ransomware outcome
    crit: component
    conf: 0.95
    any:
      - id: ransomware-word
      - id: micro-behaviors/fs/file/extension::locked-extension-reference
      - id: encrypted-outcome-reference

  - id: llm-locked-extension-operation
    desc: Renames files with a locked extension
    crit: component
    conf: 0.94
    any:
      - id: llm-locked-extension-append
      - id: llm-locked-extension-rename

  - id: llm-ransom-note-output
    desc: Writes a ransom note or encrypted message
    crit: component
    conf: 0.94
    any:
      - id: llm-ransom-note-filename
      - id: llm-encrypted-data-note
      - id: llm-ai-encrypted-data-note

  - id: llm-generated-destructive-code
    desc: Executes LLM-generated destructive code
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/interpreter/eval/generated::llm-generated-interpreter-execution
      - id: llm-destructive-operation-instruction

  - id: llm-generated-ransomware-code
    desc: Executes LLM-generated ransomware code
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/interpreter/eval/generated::llm-generated-interpreter-execution
      - id: llm-destructive-operation-instruction
      - id: llm-ransomware-instruction
    any:
      - id: llm-locked-extension-operation
      - id: llm-ransom-note-output

  - id: llm-generated-ai-asset-locker
    desc: Executes LLM-generated AI asset locker
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/interpreter/eval/generated::llm-generated-interpreter-execution
      - id: llm-destructive-operation-instruction
      - id: micro-behaviors/fs/path/extension::ai-asset-extension-reference
      - id: llm-ransomware-instruction
