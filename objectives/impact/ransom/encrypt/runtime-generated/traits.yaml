# Runtime-generated ransomware combines a model-driven interpreter pipeline
# with destructive instructions.  These rules target the technique, not the
# PromptLock or EncForge names, vendors, or fixed model/API strings.
defaults:
  platforms: [unix, windows]
  for: [python, go, lua, shell, javascript, typescript, powershell, rust]
  attack: T1486

traits:
  # The singular `files?` made these match ordinary error prose -- a
  # PermissionError handler printing "delete file {name}" is not a ransom
  # instruction. The instruction these rules target is always stated over the
  # victim's data as a whole, so require the plural/mass noun.
  - id: destructive-action-b
    desc: Destructive or exfiltration verb with target
    crit: notable
    conf: 0.94
    unless:
      - id: well-known/lib/network/getstream-stream-node::stream-node-sdk-official
      - id: well-known/lib/network/getstream-stream-node::stream-openapi-models-index-path
      - id: well-known/lib/data/lancedb::lancedb-python-distribution
      - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
      - id: well-known/app/ai/governance/nexus-agents::npm-package-name
      - id: metadata/file/format/structured::javascript-sourcemap-path
    if:
      type: text
      regex: '(?i)\b(delete|exfiltrate|steal)\w*\s+all\s+(files|data)\b'
    not:
      - regex: '(?i)deletes? all files uploaded'
      - regex: '(?i)delete all files older than'

  # Same rule as destructive-action-b above: `all` is required, since crypto
  # libraries document "encrypt data" (pycryptodome) as an ordinary API.
  - id: destructive-data-target-a
    desc: Destructive operation names file data
    crit: notable
    conf: 0.92
    unless:
      - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
      - id: well-known/tool/detection/sast::semgrep-tool
      - id: metadata/file/format/source-map::sourcemap
    if:
      type: text
      regex: '(?i)\b(encrypt|destroy)\w*\s+all\s+(files|data)\b'

  - id: destructive-data-target-d
    desc: Destructive instruction names a dataset
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(delet|encrypt|lock|destroy)(e|es|ed|s|ing)?\s+\w+\s+datasets?\b'

  - id: destructive-data-target-c
    desc: Destructive instruction names index/vector data
    crit: notable
    conf: 0.92
    if:
      type: text
      # Verb forms only: 'for encryption in vector' is a noun phrase.
      regex: '(?i)\b(delet|encrypt|lock|destroy)(e|es|ed|s|ing)?\s+(\w+\s+){0,2}(indexes?|vectors?)\b'

  - id: ransomware-word
    desc: LLM ransomware or extortion term
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(ransom|ransomware|extortion)\b'

  - id: llm-locked-extension-append
    desc: Appends a locked file extension
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bappend[^\n]{0,40}\.locked\b'

  - id: llm-locked-extension-rename
    desc: Renames a path with a locked extension
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)path\s*\+[^\n]{0,40}\.locked\b'

  - id: llm-ransom-note-filename
    desc: Writes a ransomware note filename
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)README[_-]?(RANSOM|RESTORE|DECRYPT)'

  - id: llm-encrypted-data-note
    desc: Writes a data-encrypted ransom message
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(your|all)\s+(data|files?)\s+(has|have)\s+been\s+encrypted\b'

  - id: llm-ai-encrypted-data-note
    desc: Writes an AI data-encrypted ransom message
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bAI\s+data\s+has\s+been\s+encrypted\b'

composite_rules:
  - id: llm-destructive-action
    desc: LLM destructive action request
    crit: component
    conf: 0.95
    any:
      - id: destructive-action-b
      - id: destructive-data-target-a

  - id: llm-destructive-data-target
    desc: LLM destructive data target
    crit: component
    conf: 0.95
    any:
      - id: destructive-data-target-a
      - id: micro-behaviors/data/parse/vocabulary::model-delete-encrypt-lock-wording
      - id: destructive-data-target-d
      - id: destructive-data-target-c
      - id: destructive-action-b

  - id: llm-destructive-operation-instruction
    desc: LLM requests destructive data operation
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/llm/codegen::llm-code-generation-instruction
      - id: micro-behaviors/process/create/eval::model-response-interpreter
      - id: llm-destructive-action
      - id: llm-destructive-data-target
    near_bytes: 2048

  - id: llm-ransomware-instruction
    desc: LLM instruction includes ransomware outcome
    crit: component
    conf: 0.95
    any:
      - id: ransomware-word
      - id: micro-behaviors/fs/file/extension::locked-extension-reference
      - id: micro-behaviors/data/parse/vocabulary::encrypted-status-wording
  - id: llm-locked-extension-operation
    desc: Renames files with a locked extension
    crit: component
    conf: 0.94
    any:
      - id: llm-locked-extension-append
      - id: llm-locked-extension-rename

  - id: llm-ransom-note-output
    desc: Writes a ransom note or encrypted message
    crit: component
    conf: 0.94
    any:
      - id: llm-ransom-note-filename
      - id: llm-encrypted-data-note
      - id: llm-ai-encrypted-data-note

  - id: llm-generated-destructive-code
    desc: Executes LLM-generated destructive code
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/interpreter/eval/generated::llm-generated-interpreter-execution
      - id: llm-destructive-operation-instruction

  - id: llm-generated-ransomware-code
    desc: Executes LLM-generated ransomware code
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/interpreter/eval/generated::llm-generated-interpreter-execution
      - id: llm-destructive-operation-instruction
      - id: llm-ransomware-instruction
    any:
      - id: llm-locked-extension-operation
      - id: llm-ransom-note-output

  - id: llm-generated-ai-asset-locker
    desc: Executes LLM-generated AI asset locker
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/interpreter/eval/generated::llm-generated-interpreter-execution
      - id: llm-destructive-operation-instruction
      - id: micro-behaviors/fs/path/extension::ai-asset-extension-reference
      - id: llm-ransomware-instruction
