# JADEPUFFER-like database extortion: encrypt selected records, destroy the
# originals, and create an extortion record.  SQL strings can be embedded in
# Python, Go, shell, or a compiled client, so this spans source languages.
defaults:
  platforms: [unix, windows]
  for: [python, go, shell, javascript, typescript, powershell, c, cpp]
  attack: T1486

traits:
  - id: database-extortion-table-create
    desc: Creates a SQL extortion table
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bCREATE\s+TABLE\s+[A-Za-z0-9_$]*(RANSOM(WARE)?|EXTORT(ION)?)[A-Za-z0-9_$]*\b'
    unless:
      - id: metadata/package/testing/presence/fixture::non-executing-detection-fixture-declaration

  - id: database-extortion-table-insert
    desc: Inserts into a SQL extortion table
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bINSERT\s+INTO\s+[A-Za-z0-9_$]*(RANSOM(WARE)?|EXTORT(ION)?)[A-Za-z0-9_$]*\b'
    unless:
      - id: metadata/package/testing/presence/fixture::non-executing-detection-fixture-declaration

composite_rules:
  - id: database-extortion-table-marker
    desc: SQL extortion table or ransom record
    crit: suspicious
    conf: 0.95
    any:
      - id: database-extortion-table-create
      - id: database-extortion-table-insert
    unless:
      - id: metadata/package/testing/presence/fixture::non-executing-detection-fixture-declaration

  - id: database-encrypt-drop-extortion
    desc: Encrypts and destroys database data for extortion
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/db/sql::sql-aes-encrypt-function
      - id: micro-behaviors/data/db/sql::sql-drop-object
      - id: database-extortion-table-marker
      - id: micro-behaviors/data/db/sql::sql-insert
    unless:
      - id: metadata/package/testing/presence/fixture::non-executing-detection-fixture-declaration

  - id: database-extortion-with-credential-staging
    desc: Stages credentials alongside database extortion
    crit: hostile
    conf: 0.99
    all:
      - id: database-encrypt-drop-extortion
      - id: micro-behaviors/fs/path/sensitive/credential-filenames::credentials-json-file
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-response-body-assignment
    unless:
      - id: metadata/package/testing/presence/fixture::non-executing-detection-fixture-declaration
