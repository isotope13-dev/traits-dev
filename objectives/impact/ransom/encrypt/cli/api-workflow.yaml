defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [binaries]
  size_max: 104857600
composite_rules:
  - id: api-crypt-scan-download-workflow
    desc: Encrypt scan download API workflow
    conf: 0.85
    all:
      - id: objectives/impact/ransom/affiliate::api-route-crypt
      - id: objectives/impact/ransom/affiliate::api-route-scan-id
      - id: objectives/impact/ransom/affiliate::api-route-download-id
  - id: crypt-api-with-upload-staging
    desc: API crypt workflow with upload staging
    conf: 0.9
    all:
      - id: api-crypt-scan-download-workflow
      - id: objectives/impact/ransom/affiliate::uploads-staging-path
