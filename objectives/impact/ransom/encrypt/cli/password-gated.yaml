defaults:
  platforms: [windows, unix]
  for: [binaries, python, go, c, cpp, rust]
  attack: "T1486"
traits:
- id: ransomware-spread-gpo-flags
  desc: Spread or GPO CLI flags
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (--(spread|gpo)\b|\bflag\.(String|Bool)(Var)?\s*\(\s*"(spread|gpo)")
    case_insensitive: true
  unless:
  - id: metadata/file/catalog/shell-completion::completion-schema-registration
composite_rules:
- id: password-gated-ransomware-cli
  for: [binaries, '!dex', '!wasm', python, go, c, cpp, rust]
  desc: Password-gated ransomware CLI
  crit: suspicious
  conf: 0.9
  near_bytes: 4096
  all:
  - id: micro-behaviors/process/argument/credential::password-option-text
  needs: 2
  any:
  - id: micro-behaviors/process/argument/option::path-directory-option-text
  - id: micro-behaviors/process/argument/option::fast-mode-option
  - id: objectives/impact/ransom/encrypt/cli::ransomware-spread-gpo-flags
  - id: micro-behaviors/process/argument/option::shares-or-wipe-option-text
- id: password-gated-spread-locker
  for: [binaries, '!dex', '!wasm', python, go, c, cpp, rust]
  desc: Password-gated spreading locker
  crit: hostile
  conf: 0.95
  near_bytes: 4096
  all:
  - id: micro-behaviors/process/argument/credential::password-option-text
  - id: ransomware-spread-gpo-flags
  any:
  - id: micro-behaviors/process/argument/option::fast-mode-option
  - id: micro-behaviors/process/argument/option::shares-or-wipe-option-text
  - id: micro-behaviors/process/argument/option::path-directory-option-text
