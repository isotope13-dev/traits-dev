# Native lockers read their behavior from a settings block: which extension
# to append, which extensions to skip and how many bytes of each file to
# encrypt. The three names together are a file-encryptor's configuration
# schema; any one of them is ordinary vocabulary.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1486
  mbc: B0040
  crit: notable
  conf: 0.9
traits:
  - id: encrypted-file-extension-setting
    desc: Encrypted-file extension setting name
    if:
      type: text
      word: encryptedFileExtension
  - id: skip-extensions-setting
    desc: Skipped-extensions setting name
    if:
      type: text
      word: skipExtensions
  - id: bytes-for-encrypt-setting
    desc: Bytes-to-encrypt setting name
    if:
      type: text
      word: bytesForEncrypt
composite_rules:
  - id: native-locker-settings-with-capi-encrypt
    desc: Locker settings schema with CryptoAPI file encryption
    crit: hostile
    conf: 0.93
    all:
      - id: encrypted-file-extension-setting
      - id: skip-extensions-setting
      - id: bytes-for-encrypt-setting
      - id: micro-behaviors/crypto/provider/cryptoapi::crypt-encrypt
      - id: micro-behaviors/fs/enumerate/volume::windows-volume-enumeration
    unless:
      - id: metadata/signed/platform/
