defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - macho
  - pe

traits:
- id: payment-status-check-3
  desc: Payment followed by ransomware recovery phrase
  crit: notable
  conf: 0.9
  for: [scripts, binaries]
  if:
    type: text
    regex: '\bpayment\b.{0,50}\b(decrypt|unlock|recover|restore)\b.{0,20}\b(files?|data|pc|system)\b'
    case_insensitive: true
  not:
  - substr: "verify-payment"
  - substr: "subscription"
  - substr: "renewal"
  - substr: "wallet"
  - substr: "mint"
- id: ransom-note-files-encrypted-state
  desc: Ransom note says victim files are encrypted
  crit: notable
  conf: 0.85
  for: [elf, macho, pe, c, cpp]
  if:
    type: text
    case_insensitive: true
    regex: '\byour\s+(files?|data)\b[^\r\n]{0,80}\bencrypted\b'
  unless:
    - id: well-known/lib/crypto/nss/
    - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: ransom-note-locked-state
  desc: Ransom-note locked state phrase
  crit: notable
  conf: 0.85
  for: [elf, macho, pe, c, cpp]
  if:
    type: text
    case_insensitive: true
    regex: '(^|[^A-Za-z0-9_.-])your\s+(files|data)\b.{0,40}\blocked\b'
  unless:
    - id: well-known/lib/crypto/nss/
- id: ransom-note-paid-decryption-phrase
  desc: Victim decryption tied to payment
  crit: notable
  conf: 0.85
  for: [elf, macho, pe, c, cpp]
  if:
    type: text
    case_insensitive: true
    regex: '\bdecrypt\s+your\s+(files?|data)\b[^\r\n]{0,80}\b(pay|ransom|bitcoin)\b'
  unless:
    - id: well-known/lib/crypto/nss/
- id: ransom-note-recover-word
  desc: Ransom-note recover-files phrase
  crit: notable
  conf: 0.85
  for: [elf, macho, pe, c, cpp]
  if:
    type: text
    case_insensitive: true
    # The victim has to be addressed: 'recover data' alone is storage
    # engine prose (RocksDB options.h 'effort to recover data').
    regex: '\brecover\s+(your|all( your)?)\s+(files?|data)\b'
  unless:
    - id: well-known/lib/crypto/nss/
- id: ransom-note-payment-word
  desc: Ransom-note payment request word
  crit: component
  conf: 0.85
  for: [elf, macho, pe, c, cpp]
  if:
    type: text
    case_insensitive: true
    regex: '\b(payment.{0,40}(decrypt|recover|files)|pay.{0,30}ransom)\b'
  unless:
    - id: well-known/lib/crypto/nss/
- id: encoded-possessive-files-encrypted-claim
  desc: Possessive files-encrypted ransom claim
  crit: notable
  conf: 0.9
  for: [pe, dll, elf, c, cpp, go, rust, python]
  if:
    type: encoded
    encoding: base64
    # A ransom claim addresses the victim's files (`your`/`all`/`the`).
    # Feature prose ("regular files are read; encrypted key files",
    # "`@file.json` credentials - encrypted at rest") has no possessive
    # subject. Verb forms only: `encryption` (as in "uses AES encryption"
    # docs) is feature language, not a claim. The at-rest qualifier
    # ("all your files are encrypted at rest" in cloud/KMS docs) is
    # excluded via the at-rest-encryption suppressor below.
    regex: '(?i)(your|all|the).{0,16}files?.{0,24}encrypt(ed|ing)?\b'
  unless:
  - id: objectives/impact/ransom/encrypt/config::encoded-at-rest-encryption-statement
