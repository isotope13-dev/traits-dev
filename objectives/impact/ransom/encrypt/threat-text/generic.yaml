defaults:
  platforms: [windows, unix]
  for: [pe, elf, python, javascript, powershell, batch]
traits:
  - id: ransom-word
    desc: ransom word
    crit: component
    if:
      type: text
      word: ransom
      case_insensitive: true
  - id: files-encrypted-msg
    desc: your files have been encrypted message
    crit: notable
    if:
      type: text
      substr: your files have been encrypted
      case_insensitive: true
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: pay-to-decrypt-msg
    desc: pay to decrypt message
    crit: notable
    if:
      type: text
      substr: pay to decrypt
      case_insensitive: true
  - id: files-deleted-msg
    desc: files will be deleted message
    crit: notable
    if:
      type: text
      # Addressed to the victim or on a deadline. A bare 'files will be
      # deleted' is cache-eviction documentation (GDAL, browsers, CI tools).
      regex: '\b(your|all)( \w+)? files will be (permanently )?deleted\b|files will be deleted in \d'
      case_insensitive: true
  - id: torproject-domain
    desc: torproject.org domain
    crit: notable
    if:
      type: text
      substr: torproject.org
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: onion-address
    desc: .onion address pattern
    crit: component
    if:
      type: text
      regex: '[a-z2-7]{16,56}\.onion\b'
  - id: bitcoin-word
    desc: Bitcoin term in ransom or payment context
    crit: notable
    if:
      type: text
      regex: '(?i)\bbitcoin\b.{0,60}\b(ransom|payment)\b'
    unless:
      - id: objectives/credential-access/ssh/key::ssh-xor-fixture-ref
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
  - id: ext-crypto
    desc: .crypto extension
    crit: component
    if:
      type: string_literal
      regex: '[A-Za-z0-9_-]{2,}\.crypto\b'
    not:
      - regex: '(?i)^(window|self|globalThis|subtle|node)\.crypto$'
  - id: emerging-threats-doc-domain
    desc: Emerging Threats documentation
    crit: notable
    if:
      type: text
      substr: doc.emergingthreats.net
      case_insensitive: true
  - id: encrypt-decryptor-msg-1
    desc: References decryptor (your/run/download)
    crit: suspicious
    conf: 0.7
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    if:
      type: text
      regex: \b(your|run|download)\s+decryptor
      case_insensitive: true
  - id: encrypt-decryptor-msg-2
    desc: References decryptor (get/free)
    crit: suspicious
    conf: 0.7
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    if:
      type: text
      regex: \b(get|free)\s+decryptor
      case_insensitive: true
  - id: encrypt-decryptor-file
    desc: References decryptor file (exe/bin/bat)
    crit: suspicious
    conf: 0.75
    if:
      type: text
      regex: decryptor\.(exe|bin|bat)
      case_insensitive: true
# The Go crypto/{rsa,aes,cipher} import markers moved to
# micro-behaviors/crypto/library/stdlib — they detect only a package import
# (neutral capability, often pulled in transitively via net/http TLS), so they
# belong in micro-behaviors, not under a ransom objective. The go-file-encrypt
# composite below references that directory cross-directory (crypto + file-write
# + ransom-note is the actual intent).
composite_rules:
  - id: explicit-ransom-msgs
    desc: Explicit ransom messages
    crit: component
    any:
      - id: files-encrypted-msg
      - id: pay-to-decrypt-msg
  - id: payment-indicators
    desc: Payment or Tor indicators
    crit: component
    any:
      - id: torproject-domain
      - id: onion-address
      - id: bitcoin-word
  - id: ransom-extensions
    desc: Ransom file extensions
    crit: component
    any:
      - id: metadata/file/extension/encrypted::ext-locked
      - id: metadata/file/extension/encrypted::ext-encrypted
      - id: ext-crypto
  - id: threat-intel-documentation-indicators
    desc: Threat-intel documentation indicators
    crit: component
    any:
      - id: emerging-threats-doc-domain
      - id: well-known/tool/detection/threat-intel::security-solution-str
  - id: deleted-with-payment
    desc: Files deleted threat with payment
    crit: component
    all:
      - id: files-deleted-msg
      - id: payment-indicators
  - id: deleted-with-ransom
    desc: Files deleted threat with ransom word
    crit: component
    all:
      - id: files-deleted-msg
      - id: ransom-word
  - id: ransom-with-payment
    desc: Ransom word with payment indicators
    crit: component
    all:
      - id: ransom-word
      - id: payment-indicators
  - id: ransom-with-extensions
    desc: Ransom word with ransom extensions
    crit: component
    all:
      - id: ransom-word
      - id: ransom-extensions
  - id: tor-with-bitcoin
    desc: Tor with bitcoin
    crit: component
    all:
      - id: torproject-domain
      - id: bitcoin-word
  - id: ext-with-bitcoin
    desc: Ransom extension with bitcoin
    crit: component
    all:
      - id: ransom-extensions
      - id: bitcoin-word
  - id: onion-with-btc
    desc: Onion with bitcoin indicators
    crit: component
    all:
      - id: onion-address
    any:
      - id: bitcoin-word
  - id: ransom-demand-or-file-threat-wording
    desc: Ransom demand or file-threat wording
    crit: notable
    conf: 0.75
    # Vocabulary establishes neither encryption nor file impact.
    size_max: 26214400
    any:
      - id: explicit-ransom-msgs
      - id: deleted-with-payment
      - id: deleted-with-ransom
      - id: ransom-with-payment
      - id: ransom-with-extensions
      - id: tor-with-bitcoin
      - id: ext-with-bitcoin
      - id: onion-with-btc
    unless:
      # A signature-reference catalogue is data *about* ransomware, not
      # ransomware: Kibana's security-solution bundle embeds the Emerging
      # Threats reference map, thousands of SIDs pointing at malware write-ups,
      # so ransom and payment vocabulary co-occur throughout it. The indicator
      # composite for exactly this context already existed here, unused.
      - id: threat-intel-documentation-indicators
      # agentharm grading functions quote ransomware demands to score refusals.
      - id: well-known/lib/ai/inspect-evals::eval-corpus-context
      - id: metadata/package/tooling::xscreensaver-program
  - id: encrypt-decryptor
    desc: References decryptor
    crit: suspicious
    conf: 0.66
    any:
      - id: encrypt-decryptor-msg-1
      - id: encrypt-decryptor-msg-2
      - id: encrypt-decryptor-file
  - id: web-api-cryptor-workflow
    for: [pe]
    desc: Web API driven file cryptor workflow
    crit: suspicious
    conf: 0.9
    all:
      - id: objectives/impact/ransom/encrypt/cli::crypt-api-with-upload-staging
      - id: micro-behaviors/fs/file/handle::set-file-information-by-handle
    any:
      - id: micro-behaviors/fs/directory/readdir::find-first-file-ex
      - id: micro-behaviors/fs/directory/readdir::find-next-file
  - id: go-writefile-any
    desc: Go file write functions
    crit: component
    any:
      - id: micro-behaviors/fs/write/file/full::ioutil-write-file
      - id: micro-behaviors/fs/write/file/full::go-os-writefile
  - id: go-write-or-ext
    desc: Go file write or ransom extension
    crit: component
    any:
      - id: go-writefile-any
      - id: metadata/file/extension/encrypted::encrypted-extensions
  - id: go-file-encrypt
    desc: Go file encryption patterns (ransomware)
    crit: suspicious
    conf: 0.8
    mbc: B0040
    attack: T1486
    all:
      # Any Go stdlib crypto import (directory reference — the capability lives
      # in micro-behaviors; ransom intent is this composite's crypto+write+note).
      - id: micro-behaviors/crypto/library/stdlib
      - id: go-writefile-any
    any:
      - id: ransom-demand-or-file-threat-wording
      - id: objectives/impact/ransom/note::ransom-note
  - id: encrypt-note
    desc: Ransom note patterns
    # A note string by itself can be documentation or a test fixture.  The
    # encryption and file-impact composites carry the actionable verdict.
    crit: notable
    conf: 0.66
    any:
      - id: objectives/impact/ransom/note::ransom-note
      - id: files-encrypted-msg
      - id: pay-to-decrypt-msg
      - id: files-deleted-msg
    unless:
      - id: well-known/tool/sysadmin/container::podman-distribution
