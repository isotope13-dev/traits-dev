defaults:
  for: [ruby]
  platforms: [unix, windows]

traits:
  - id: ransom-note-filename-marker
    crit: component
    desc: Ransom-themed README string
    conf: 0.9
    if:
      type: string_literal
      regex: '(?i)README_(DECRYPT|LOCKED)|hackend.{0,50}encrypted'

composite_rules:
  - id: ransom-note-and-banner-markers
    crit: notable
    desc: Ransom-themed README and banner markers
    conf: 0.9
    needs: 2
    any:
      - id: objectives/impact/ransom/encrypt/threat-text::ransom-note-filename-marker
      - id: metadata/lang/natural/vocabulary/content-word::readme-banner-string-marker
