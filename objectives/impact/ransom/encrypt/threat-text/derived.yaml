defaults:
  platforms:
    - unix
    - windows
  crit: component
  conf: 1.0
  for: [scripts, binaries]
traits:
  - id: inline__data-loss-threat__any_2
    crit: notable
    desc: Permanent data-loss wording
    if:
      type: text
      case_insensitive: true
      substr: lost forever
  - id: inline__data-loss-threat__any_3
    crit: notable
    desc: File or data recovery failure wording
    if:
      type: text
      case_insensitive: true
      regex: cannot.{0,20}recover.{0,30}(file|data|decrypt)
  - id: inline__data-loss-threat__any_4
    crit: notable
    desc: Unrecoverable-data ransom or decryption threat
    if:
      type: text
      case_insensitive: true
      regex: unrecoverable.{0,30}(pay|ransom|decrypt|restore)
  - id: inline__data-loss-threat__unless_1_a
    crit: notable
    desc: Account or credential recovery failure wording
    if:
      type: text
      regex: (password|account|credential).{0,80}cannot.{0,30}recover
      case_insensitive: true
  - id: inline__data-loss-threat__unless_1_b
    crit: notable
    desc: Token or user recovery failure wording
    if:
      type: text
      regex: (token|user).{0,80}cannot.{0,30}recover
      case_insensitive: true
