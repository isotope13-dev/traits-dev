# Ransomware that obtains campaign configuration from a blockchain-backed
# dead drop. The chain request is not hostile by itself; the hostile rules
# require it to feed a native file-locking and extortion workflow.
defaults:
  platforms: [linux, windows]
  for: [source, binaries, scripts]
  attack: T1486,T1102,T1071.001
  mbc: B0040,B0025

traits:
  - id: block-stride-definition
    desc: Block or chunk stride macro fragment
    # A stride macro is a partial indicator, not evidence of file encryption:
    # numerical kernels and codecs use the same naming and shape.
    crit: notable
    conf: 0.93
    for: [c, cpp]
    if:
      type: text
      # Require the macro name to identify the block/chunk being stepped.
      # Generic debugger/build macros such as CTX_FL_IGNORE_STEPS are not
      # encryption controls and must not look like intermittent locking.
      regex: '(?im)^\s*#define\s+\w*(BLOCK|CHUNK)\w*(STRIDE|STEP)\w*\s+.{0,60}(\*|\b\d{2,}\b)'

  - id: dlock-encrypted-extension
    desc: DeadLock-style .dlock encrypted file extension
    crit: notable
    conf: 0.94
    for: [c, cpp, rust]
    if:
      type: text
      regex: '(?i)\.dlock\b'

  - id: how-recover-note-name
    desc: HOW_RECOVER ransom note basename pattern
    crit: notable
    conf: 0.94
    for: [c, cpp, rust]
    if:
      type: text
      regex: '(?i)HOW_RECOVER'

composite_rules:
  - id: intermittent-offset-encryption-loop
    desc: File encryption loop uses a block stride
    crit: suspicious
    conf: 0.95
    for: [c, cpp]
    all:
      - id: micro-behaviors/data/control-flow/loop::cursor-zero-init-for-loop
      - id: micro-behaviors/data/control-flow/loop::cursor-advance-by-stride
      - id: micro-behaviors/fs/file/binary::source-file-content-io
    any:
      - id: micro-behaviors/crypto/symmetric/encrypt::symmetric-encryption-operation
      - id: micro-behaviors/crypto/symmetric/xor/loop::source-xor-modulo-or-indexed-loop
      - id: micro-behaviors/fs/file/encrypt::native-file-encryption-routine
    near_bytes: 1000

  # evm-contract-config-read and the composites it chains through
  # (evm-jsonrpc-contract-call, evm-response-config-decode,
  # evm-contract-data-value in objectives/command-and-control/channel/deaddrop/
  # blockchain/traits.yaml) are all pinned to
  # `for: [binaries, '!dex', javascript, python]`, even though the atoms they
  # themselves require (evm-eth-call-method, evm-contract-target-field,
  # evm-contract-data-field, evm-contract-data-encoder) already carry an
  # explicit `c` in their own `for:` -- only the wrapping composites were
  # never updated to match. The two small helpers below reproduce that same
  # eth_call-request-then-decode chain, scoped for `c`, from the
  # already-c-compatible atoms directly.
  - id: evm-contract-data-value-c
    for: [c]
    desc: EVM contract call data value (native)
    crit: component
    conf: 0.9
    any:
      - id: objectives/command-and-control/channel/deaddrop/blockchain::evm-contract-data-field
      - id: objectives/command-and-control/channel/deaddrop/blockchain::evm-contract-data-encoder

  - id: evm-contract-config-read-c
    for: [c]
    desc: Reads decoded configuration from an EVM contract (native)
    crit: suspicious
    conf: 0.96
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/rpc::jsonrpc-2-protocol-object
      - id: objectives/command-and-control/channel/deaddrop/blockchain::evm-eth-call-method
      - id: objectives/command-and-control/channel/deaddrop/blockchain::evm-contract-target-field
      - id: evm-contract-data-value-c
    any:
      - id: micro-behaviors/data/decode/abi::abi-decoder-call
      - id: micro-behaviors/data/serialize/envelope::json-decoder-name-call
      - id: micro-behaviors/data/serialize/envelope::result-decoder-name-call
      - id: micro-behaviors/data/serialize/envelope::config-decoder-name-call

  - id: blockchain-configured-ransomware
    for: [c]
    desc: Ransomware config read from an EVM contract
    crit: hostile
    conf: 0.99
    all:
      - id: evm-contract-config-read-c
      - id: objectives/impact/ransom/encrypt/native-locker::xchacha-file-crypto
      - id: micro-behaviors/crypto/asymmetric/curve25519::curve25519-xsalsa20-poly1305-primitive
      - id: micro-behaviors/fs/file/binary::source-file-content-io
      - id: objectives/impact/ransom/encrypt/config::ransom-note-text

  - id: blockchain-configured-intermittent-locker
    for: [c]
    desc: Blockchain-configured intermittent file locker
    crit: hostile
    conf: 0.99
    all:
      - id: blockchain-configured-ransomware
      - id: intermittent-offset-encryption-loop
      - id: block-stride-definition

  # Source-level hybrid locker (XChaCha20 + Curve25519 wrap + ransom note).
  # Built from micro-behavior atoms because intermediate native-locker
  # composites are not always emitted for .c/.rs scans alone.
  - id: hybrid-xchacha-curve25519-locker
    desc: Native locker wraps XChaCha20 file keys with Curve25519
    crit: hostile
    conf: 0.995
    for: [c]
    all:
      - id: micro-behaviors/crypto/symmetric/stream/chacha::xchacha20-poly1305-reference
      - id: micro-behaviors/crypto/asymmetric/curve25519::curve25519-xsalsa20-poly1305-api
      - id: micro-behaviors/fs/file/encrypt::native-file-encryption-routine
      - id: objectives/impact/ransom/encrypt/config::ransom-note-text

  - id: eth-call-configured-hybrid-locker
    desc: Hybrid file locker configured through an EVM eth_call
    crit: hostile
    conf: 0.995
    for: [c]
    near_bytes: 8192
    all:
      - id: hybrid-xchacha-curve25519-locker
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-literal

  - id: intermittent-stride-hybrid-locker
    desc: Hybrid locker encrypts files in intermittent block strides
    crit: hostile
    conf: 0.995
    for: [c]
    all:
      - id: hybrid-xchacha-curve25519-locker
      - id: block-stride-definition
      - id: micro-behaviors/data/control-flow/loop::cursor-zero-init-for-loop
      - id: micro-behaviors/data/control-flow/loop::cursor-advance-by-stride
