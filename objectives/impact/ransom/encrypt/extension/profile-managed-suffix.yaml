# Enumeration and crypto references support an attempt, not recursive scope
# or successful encryption. Preserve the encrypted-suffix-specific profile.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1486
  mbc: B0040
composite_rules:
  - id: managed-enumerated-suffix-ransom-encryption-attempt
    desc: Managed file crypto, suffix and ransom demand
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/compiler/managed::clr-runtime-header
      - id: metadata/binary/symbols/name/token/filesystem::dotnet-getfiles-method-name
      - id: micro-behaviors/fs/read/file/content/unspecified::dotnet-readallbytes-token
      - id: micro-behaviors/crypto/encrypt/reference::dotnet-create-encryptor
      - id: micro-behaviors/crypto/cipher/io::dotnet-cryptostream
      - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
      - id: micro-behaviors/fs/path/extension::dot-encrypted-suffix-reference
      - id: objectives/impact/ransom/keywords::ransom-note-btc-payment-wide

