# Fernet key distribution for a file locker. A server that mints a symmetric key
# per connection and writes it back to the client keeps the decryption key
# central, while the locker fetches it at run time. Keygen and socket legs are
# ordinary in encrypted-channel code, so these composites stay suspicious. The
# hostile verdict comes from the walk-and-delete encryptor in the same kit.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1486

composite_rules:
  - id: python-fernet-key-served-to-clients
    desc: Python server generates a Fernet key and sends it to clients
    crit: suspicious
    conf: 0.9
    scope: file
    near_lines: 120
    all:
      - id: micro-behaviors/crypto/key/generate::fernet-keygen-call
      - id: micro-behaviors/communications/socket/disconnect::send-followed-by-transport-close
    any:
      - id: micro-behaviors/communications/socket/bind/address::python-bind-all-interfaces
      - id: metadata/lang/source/syntax/call/member::python-listen-call-text

  - id: python-fernet-key-fetched-over-socket
    desc: Python reads a Fernet key from a socket and builds a cipher
    crit: suspicious
    conf: 0.9
    scope: file
    near_lines: 12
    all:
      - id: micro-behaviors/communications/socket/receive::python-socket-named-recv-assignment
      - id: metadata/lang/source/naming/interface/runtime::fernet-class-symbol
