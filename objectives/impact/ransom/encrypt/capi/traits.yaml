# Windows CAPI file encryption used by native ransomware lockers that
# abort when rsaenh.dll is missing rather than implementing their own RSA.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1486
  mbc: C0027

composite_rules:
  - id: capi-rsaenh-file-encryptor
    desc: CAPI encryption paired with file traversal
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/provider::rsaenh-uninitialized-error
      - id: micro-behaviors/crypto/library/cryptoapi::crypt-encrypt
      - id: micro-behaviors/crypto/library/cryptoapi::crypt-import-key
      - id: micro-behaviors/fs/directory/readdir::file-enumeration-with-access
