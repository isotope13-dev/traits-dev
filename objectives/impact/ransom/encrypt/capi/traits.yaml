# Windows CAPI file encryption used by native ransomware lockers that
# abort when rsaenh.dll is missing rather than implementing their own RSA.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1486
  mbc: C0027

traits:
  - id: rsaenh-uninitialized-error
    desc: rsaenh.dll uninitialized crypto error
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'rsaenh.dll is not initialized'

composite_rules:
  - id: capi-rsaenh-file-encryptor
    desc: CAPI encryption paired with file traversal
    crit: hostile
    conf: 0.97
    all:
      - id: rsaenh-uninitialized-error
      - id: micro-behaviors/crypto/library/provider::crypt-encrypt
      - id: micro-behaviors/crypto/library/provider::crypt-import-key
      - id: micro-behaviors/fs/enumerate/directory::file-enumeration-with-access
