# Java RAT command tables with paired encrypt/decrypt-files commands: the
# operator can ransom the host on demand (STRRAT "rw-encrypt"/"rw-decrypt").
defaults:
  platforms: [windows]
  for: [class]
  crit: hostile
  attack: T1486

composite_rules:
  - id: java-rat-on-demand-file-encryption
    desc: Java RAT command table includes paired file-encrypt and file-decrypt commands
    conf: 0.93
    all:
      - id: objectives/command-and-control/backdoor/rat/command-set::rat-comprehensive
      - id: objectives/command-and-control/backdoor/rat/command-set::rw-encrypt-string
      - id: objectives/command-and-control/backdoor/rat/command-set::rw-decrypt-string
