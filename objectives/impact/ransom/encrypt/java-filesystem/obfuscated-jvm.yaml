# Obfuscated JVM lockers can hide paths and file suffixes while retaining the
# bytecode references for traversal, file transformation and cleanup.
defaults:
  platforms: [windows, unix]
  for: [class]
  attack: T1486
  mbc: B0040

composite_rules:
  - id: obfuscated-recursive-jvm-file-encryption
    desc: Obfuscated JVM recursive file encryption and deletion
    crit: hostile
    conf: 0.98
    attack: T1027,T1486
    all:
      - id: micro-behaviors/fs/directory/readdir/language::jvm-file-listfiles
      - id: micro-behaviors/fs/read/file/full::java-readallbytes
      - id: micro-behaviors/crypto/cipher::java-raw-key-cipher-use
      - id: micro-behaviors/fs/write/file/full::jvm-files-write-bytecode
      - id: micro-behaviors/fs/delete/file/library::java-nio-file-delete-if-exists-bytecode
      - id: objectives/anti-static/obfuscation/encoding/numeric::jvm-keyed-integer-constant-cache
      - id: objectives/anti-static/obfuscation/string/encrypt::jvm-character-feedback-xor-decoder
