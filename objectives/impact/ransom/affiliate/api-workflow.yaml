defaults:
  platforms: [unix, windows]
  for: [binaries]
  size_max: 104857600
traits:
  - id: api-route-crypt
    desc: Crypt API route marker
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: /api/crypt([/?!#"'[:space:]]|$)
  - id: api-route-scan-id
    desc: API route for scan by id
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: /api/scan/(:id|\$\{[a-zA-Z0-9_]+\}|\{id\})
  - id: api-route-download-id
    desc: API route for download by id
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: /api/download/(:id|\$\{[a-zA-Z0-9_]+\}|\{id\})
  # A bare "uploads/" substring appears in ordinary web apps and test
  # fixtures; alone it states no ransom-workflow staging claim.
  - id: uploads-staging-path
    desc: Generic uploads path fragment (signature leg)
    crit: component
    conf: 0.6
    if:
      type: text
      substr: uploads/
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
