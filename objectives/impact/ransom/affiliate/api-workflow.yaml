defaults:
  platforms: [unix, windows]
  for: [binaries]
  size_max: 104857600
traits:
  - id: api-route-crypt
    desc: Crypt API route marker
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: /api/crypt([/?!#"'[:space:]]|$)
  - id: api-route-scan-id
    desc: API route for scan by id
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: /api/scan/(:id|\$\{[a-zA-Z0-9_]+\}|\{id\})
  - id: api-route-download-id
    desc: API route for download by id
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: /api/download/(:id|\$\{[a-zA-Z0-9_]+\}|\{id\})
  - id: uploads-staging-path
    desc: Upload staging directory path
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: uploads/
