# Cross-platform ransomware operator controls described in the INC article.
# These are structural command-line switches, not family names: the cluster
# expresses an encryptor that can target shares and stop processes/services.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1486,T1490,T1489
traits:
  # In scripts the bare switch is unambiguous. In binaries, Go's merged
  # string tables concatenate unrelated constants without separators, so a
  # word-bounded `--ens` also matches byte coincidences (an Alibaba CLI
  # matched `NAS服 --ens --i7-11edge` across NAS product text and CPU
  # models); the binary form therefore requires the switch beside its
  # network-share description.
  - id: encrypt-network-shares-flag-script
    desc: Script switch to encrypt network shares
    crit: suspicious
    conf: 0.95
    for: [scripts]
    if:
      type: text
      regex: '(?i)(^|[\s"''`])--ens([\s"''`]|$)'
    not:
      - regex: '--\s?ENS\b'
    unless:
      - id: well-known/tool/development/runtime/ganache/
  - id: encrypt-network-shares-flag-binary
    desc: Share-encryption switch with its description
    crit: suspicious
    conf: 0.9
    for: [binaries]
    if:
      type: text
      regex: '(?i)--ens\b[^\n]{0,60}\b(network[ \t-]?shares?|encrypt)'
    unless:
      - id: well-known/tool/development/runtime/ganache/
  - id: stop-file-holders-cli-flag
    desc: Ransomware flag to stop file-holding processes
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)(^|[\s"''`])--sup(\s|$|[''"])'
    not:
      - regex: '(?i)\bmix\s+new\b'
    unless:
      - id: well-known/app/utility/iris::iris-autocomplete-context
      - id: metadata/file/extension/identity::markdown-file-basename
  - id: encrypt-hidden-drives-flag
    desc: Hidden-drive encryption flag
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)(^|[\s"''`])--lhd\b'
  - id: process-mask-cli-flag
    desc: Ransomware process-termination mask flag
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)(^|[\s"''`])--proc[ \t](["''][^"'']{1,80}["'']|\S{0,60}[*?]\S{0,40}|\S{1,36}\.exe)'
  - id: service-mask-cli-flag
    desc: Ransomware service-termination mask flag
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)(^|[\s"''`])--serv\s+("[^"]{1,80}"|''[^'']{1,80}''|\S{1,80})'
  - id: process-kill-log-marker
    desc: Process kill success log message
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: 'Successfully killed process:'
  - id: service-kill-log-marker
    desc: Service kill success log message
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: 'Successfully killed service:'
composite_rules:
  - id: encrypt-network-shares-flag
    desc: Ransomware flag to encrypt network shares
    crit: suspicious
    conf: 0.95
    any:
      - id: encrypt-network-shares-flag-script
      - id: encrypt-network-shares-flag-binary
  - id: stop-file-holders-flag
    desc: Stop file-holding processes flag or API
    crit: suspicious
    conf: 0.95
    any:
      - id: stop-file-holders-cli-flag
      - id: micro-behaviors/os/event/shutdown::restart-manager-shutdown
  - id: process-mask-flag
    desc: Process-termination mask flag or log
    crit: suspicious
    conf: 0.94
    any:
      - id: process-mask-cli-flag
      - id: process-kill-log-marker
  - id: service-mask-flag
    desc: Service-termination mask flag or log
    crit: suspicious
    conf: 0.94
    any:
      - id: service-mask-cli-flag
      - id: service-kill-log-marker
  - id: ransomware-locker-operator-flags
    desc: Ransomware operator flag cluster
    crit: hostile
    conf: 0.98
    needs: 3
    any:
      - id: encrypt-network-shares-flag
      - id: stop-file-holders-flag
      - id: encrypt-hidden-drives-flag
      - id: process-mask-flag
      - id: service-mask-flag
      - id: micro-behaviors/process/argument/option::speed-mode-option
  - id: ransomware-locker-process-service-controls
    desc: Process and service termination controls
    crit: hostile
    conf: 0.98
    all:
      - id: process-mask-flag
      - id: service-mask-flag
