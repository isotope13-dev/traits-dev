defaults:
  platforms: [unix]
  for: [elf]
traits:

  - id: locker-data-stolen-encrypted
    desc: Victim data theft and encryption claim
    crit: suspicious
    conf: 0.98
    attack: T1486
    if:
      type: text
      regex: '(?i)your data is stolen and encrypted'
  - id: locker-data-publish-threat
    desc: Threat to publish victim data
    crit: suspicious
    conf: 0.96
    attack: T1486
    if:
      type: text
      regex: '(?i)data will be published on our'
  - id: locker-vm-snapshot-removal-command
    desc: VMware snapshot removal command reference
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: vmsvc/snapshot.removeall
composite_rules:
  - id: file-encryption-extortion
    desc: File encryption with data theft extortion
    crit: hostile
    conf: 0.99
    attack: T1486
    near_bytes: 1024
    all:
      - id: micro-behaviors/fs/file/encrypt::file-encryption-cli-help
      - id: locker-data-stolen-encrypted
      - id: locker-data-publish-threat
      - id: objectives/impact/ransom/encrypt/threat-text::ransom-demand-or-file-threat-wording
  - id: esxi-ransomware-vm-disruption
    desc: Ransomware VM disruption and snapshot removal
    crit: hostile
    conf: 0.98
    attack: T1486
    all:
      - id: micro-behaviors/fs/file/encrypt::file-encryption-cli-help
      - id: objectives/impact/ransom/esxi::vmsvc-power-off
      - id: locker-vm-snapshot-removal-command
      - id: objectives/impact/ransom/encrypt/threat-text::ransom-demand-or-file-threat-wording
