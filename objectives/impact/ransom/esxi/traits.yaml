defaults:
  platforms: [unix]
  for: [shell, python, c, cpp, go, elf]
traits:
  - id: esxcli-formatter
    desc: esxcli --formatter flag
    crit: component
    conf: 0.7
    if:
      type: text
      substr: esxcli --formatter
  - id: world-id-str
    desc: WorldID string
    crit: component
    conf: 0.6
    if:
      type: text
      word: WorldID
  - id: vm-world-display-listing
    desc: ESXi VM WorldID display listing
    crit: component
    conf: 0.8
    if:
      type: text
      regex: 'WorldID.{0,160}DisplayName|DisplayName.{0,160}WorldID'
  - id: vm-process-kill
    desc: vm process kill command
    crit: component
    conf: 0.9
    if:
      type: text
      substr: vm process kill
  - id: vmsvc-power-off
    desc: vmsvc/power.off command
    crit: component
    conf: 0.9
    if:
      type: text
      substr: vmsvc/power.off
  - id: type-force-flag
    desc: --type=force flag
    crit: component
    conf: 0.8
    if:
      type: text
      substr: --type=force
  - id: type-hard-flag
    desc: --type=hard flag
    crit: component
    conf: 0.8
    if:
      type: text
      substr: --type=hard
  - id: vminventory-xml
    desc: ESXi VM inventory XML path
    crit: component
    conf: 0.9
    if:
      type: text
      substr: /etc/vmware/hostd/vmInventory.xml

  - id: xpath-config-entry
    desc: VMware inventory XPath query
    crit: component
    conf: 0.9
    if:
      type: text
      substr: "//ConfigEntry"

  - id: vmxcfgpath-field
    desc: VMware VMX config path XML field
    crit: component
    conf: 0.85
    if:
      type: text
      substr: vmxCfgPath

  - id: esxi-welcome-note
    desc: ESXi welcome screen ransom note path
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: /usr/lib/vmware/hostd/docroot/ui/welcome.txt

  - id: power-off-cmd
    desc: power.off command
    crit: component
    conf: 0.7
    if:
      type: text
      substr: power.off
  - id: power-suspend-cmd
    desc: power.suspend command
    crit: component
    conf: 0.7
    if:
      type: text
      substr: power.suspend
  - id: esxcfg-prefix
    desc: esxcfg- tool prefix
    crit: component
    conf: 0.8
    if:
      type: text
      substr: esxcfg-
  - id: vmkfstools-cmd
    desc: vmkfstools command
    crit: component
    conf: 0.8
    if:
      type: text
      word: vmkfstools
  - id: vmware-cmd-tool
    desc: vmware-cmd tool
    crit: component
    conf: 0.8
    if:
      type: text
      word: vmware-cmd
  - id: esxi-version-var
    desc: EsxiVersion variable
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '[Ee]sxi[_]?[Vv]ersion'
  - id: vmware-version-var
    desc: vmware_version variable
    crit: component
    conf: 0.7
    if:
      type: text
      regex: vmware[_]?version
      case_insensitive: true
  - id: esx-conf-path
    desc: /etc/vmware/esx.conf path
    crit: component
    conf: 0.8
    if:
      type: text
      substr: /etc/vmware/esx.conf
  - id: system-version-get
    desc: system version get command
    crit: component
    conf: 0.7
    if:
      type: text
      substr: system version get
  - id: storage-filesystem-list
    desc: storage filesystem list command
    crit: component
    conf: 0.8
    if:
      type: text
      substr: storage filesystem list
  - id: esxcli-storage
    desc: esxcli storage command
    crit: component
    conf: 0.8
    if:
      type: text
      substr: esxcli storage
  - id: buffer-cache-maxcapacity
    desc: VMFS buffer max capacity
    crit: suspicious
    conf: 0.85
    if:
      type: text
      substr: /BufferCache/MaxCapacity
  - id: buffer-cache-flushinterval
    desc: VMFS buffer flush interval
    crit: suspicious
    conf: 0.85
    if:
      type: text
      substr: /BufferCache/FlushInterval
  - id: autostart-clear
    desc: Clears ESXi autostart
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: hostsvc/autostartmanager/clear_autostart
  - id: autostart-disable
    desc: Disables ESXi autostart
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: hostsvc/autostartmanager/enable_autostart 0

  - id: esxi-vm-disk-encrypted-note
    desc: VM disks followed by encryption wording
    crit: suspicious
    conf: 0.95
    attack: T1486
    if:
      type: text
      regex: '(?i)vm\s+disks\b.{0,80}encrypt\w*'
    unless:
      - id: well-known/lib/cloud/google-cloud-go-appengine::google-cloud-go-appengine-library
      - id: well-known/lib/format/google-api-go::google-api-go-library
      - id: well-known/app/infrastructure/azure-cli::azure-cli-source-tree
      - id: well-known/app/infrastructure/azure-cli::azure-cli-context
      - id: well-known/tool/detection/checkov::checkov-policy-module
  - id: esxi-vmdk-encrypted-note
    desc: VMDK followed by encryption wording
    crit: suspicious
    conf: 0.95
    attack: T1486
    if:
      type: text
      regex: '(?i)\*?\.vmdk\b.{0,80}encrypt\w*'
    unless:
      - id: well-known/lib/cloud/google-cloud-go-appengine::google-cloud-go-appengine-library
      - id: well-known/lib/format/google-api-go::google-api-go-library
      - id: well-known/app/infrastructure/azure-cli::azure-cli-source-tree
      - id: well-known/app/infrastructure/azure-cli::azure-cli-context
  - id: esxi-vm-disk-encryption-note
    desc: Encryption wording followed by plural VM disks
    crit: suspicious
    conf: 0.95
    attack: T1486
    if:
      type: text
      regex: '(?i)encrypt\w*.{0,80}vm\s+disks\b'
    unless:
      - id: well-known/lib/cloud/google-cloud-go-appengine::google-cloud-go-appengine-library
      - id: well-known/lib/format/google-api-go::google-api-go-library
      # Azure CLI vm help: "Manage encryption of VM disks."
      - id: well-known/app/infrastructure/azure-cli::azure-cli-source-tree
      - id: well-known/app/infrastructure/azure-cli::azure-cli-context
  - id: esxi-vmdk-leak-note
    desc: VMDK leak or ransom wording
    crit: suspicious
    conf: 0.95
    attack: T1486
    if:
      type: text
      regex: '(?i)\*?\.vmdk\b.{0,80}(leak\w*|ransom\w*)'
    unless:
      - id: well-known/lib/cloud/google-cloud-go-appengine::google-cloud-go-appengine-library
      - id: well-known/lib/format/google-api-go::google-api-go-library
      - id: well-known/app/infrastructure/azure-cli::azure-cli-source-tree
      - id: well-known/app/infrastructure/azure-cli::azure-cli-context

  - id: source-esxcli-vm-list
    desc: ESXi VM process list in source
    crit: notable
    conf: 0.9
    for: [c, cpp, elf]
    if:
      type: text
      regex: '["'']esxcli\s+vm\s+process\s+list["'']'

composite_rules:
  - id: esxi-vm-disk-ransom-note
    desc: ESXi VM-disk encryption ransom note
    crit: suspicious
    conf: 0.96
    attack: T1486
    needs: 2
    any:
      - id: esxi-vm-disk-encrypted-note
      - id: esxi-vmdk-encrypted-note
      - id: esxi-vm-disk-encryption-note
      - id: esxi-vmdk-leak-note
    unless:
      - id: well-known/lib/cloud/google-cloud-go-appengine::google-cloud-go-appengine-library
      - id: well-known/lib/format/google-api-go::google-api-go-library
      - id: well-known/app/infrastructure/azure-cli::azure-cli-source-tree
      - id: well-known/app/infrastructure/azure-cli::azure-cli-context
      - id: well-known/tool/detection/checkov::checkov-policy-module

  - id: esxi-inplace-hybrid-encryptor
    desc: ESXi file rewrite with stream cipher and wrapped key
    crit: hostile
    conf: 0.98
    attack: T1486
    for: [source, binaries]
    all:
      - id: micro-behaviors/crypto/symmetric/stream::salsa20-stream-cipher-call
      - id: micro-behaviors/fs/file/binary::file-content-io
      - id: esxi-vm-disk-ransom-note
    any:
      - id: micro-behaviors/crypto/asymmetric/rsa::rsa-public-encrypt
      - id: micro-behaviors/crypto/asymmetric/rsa::rsa-public-encrypt-call

  - id: esxi-targeted-disk-locker
    desc: ESXi targeted disk locker
    crit: hostile
    conf: 0.98
    attack: T1486
    for: [source, binaries]
    all:
      - id: file-targeting
      - id: esxi-inplace-hybrid-encryptor

  - id: vmsvc-enum
    desc: vmsvc enumeration commands
    crit: component
    any:
      - id: micro-behaviors/os/sysinfo/vmware::vmsvc-getallvms
      - id: micro-behaviors/os/sysinfo/vmware::vim-cmd-vmsvc
  - id: world-display-combo
    desc: ESXi VM WorldID display listing
    crit: component
    all:
      - id: world-id-str
      - id: vm-world-display-listing
  - id: xml-vm-enum
    desc: XML-based ESXi VM inventory enumeration
    crit: suspicious
    conf: 0.9
    mbc: C0027
    attack: T1518
    all:
      - id: vminventory-xml
    any:
      - id: xpath-config-entry
      - id: vmxcfgpath-field

  - id: vm-enumeration
    desc: ESXi virtual machine enumeration
    crit: suspicious
    conf: 0.85
    mbc: C0027
    attack: T1486
    any:
      - id: vmsvc-enum
      - id: micro-behaviors/os/sysinfo/vmware::esxcli-vm-list
      - id: esxcli-formatter
      - id: world-display-combo
      - id: xml-vm-enum
  - id: kill-commands
    desc: VM kill commands
    crit: component
    any:
      - id: vm-process-kill
      - id: vmsvc-power-off
      - id: type-force-flag
      - id: type-hard-flag
      - id: micro-behaviors/os/sysinfo/vmware::esxi-world-id-param
  - id: power-commands
    desc: VM power commands
    crit: component
    any:
      - id: power-off-cmd
      - id: power-suspend-cmd
  - id: vm-kill
    desc: ESXi virtual machine termination command
    crit: suspicious
    conf: 0.9
    mbc: C0027
    attack: T1489
    any:
      - id: kill-commands
      - id: power-commands
      - id: micro-behaviors/os/sysinfo/vmware::esxcli-vm-kill
  - id: file-targeting
    desc: ESXi-specific file extension targeting
    crit: suspicious
    conf: 0.85
    mbc: C0027
    attack: T1486
    any:
      - id: micro-behaviors/os/sysinfo/vmware::vmware-extensions
      - id: micro-behaviors/os/sysinfo/vmware::vmfs-path
    unless:
      - id: well-known/app/development/kilocode::kilo-code-native-runtime
  - id: cli-tools
    desc: ESXi CLI tools for attack
    crit: suspicious
    conf: 0.8
    mbc: C0027
    attack: T1486
    needs: 2
    any:
      - id: micro-behaviors/os/sysinfo/vmware::esxcli-tool
      - id: micro-behaviors/os/sysinfo/vmware::vim-cmd-tool
      - id: esxcfg-prefix
      - id: vmkfstools-cmd
      - id: vmware-cmd-tool
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: version-detect
    desc: ESXi version detection for compatibility
    crit: suspicious
    conf: 0.7
    mbc: C0027
    attack: T1486
    any:
      - id: esxi-version-var
      - id: vmware-version-var
      - id: esx-conf-path
      - id: system-version-get
  - id: datastore-access
    desc: ESXi datastore enumeration and access
    crit: suspicious
    conf: 0.8
    mbc: C0027
    attack: T1486
    all:
      - id: micro-behaviors/os/sysinfo/vmware::vmfs-path
    any:
      - id: storage-filesystem-list
      - id: esxcli-storage
  - id: storage-pre-encryption-prep
    desc: ESXi storage pre-encryption prep
    crit: suspicious
    conf: 0.93
    all:
      - id: vmkfstools-cmd
      - id: micro-behaviors/os/virtualization/hypervisor::eagerzeroedthick-disk-type
    any:
      - id: buffer-cache-maxcapacity
      - id: buffer-cache-flushinterval
      - id: autostart-clear
      - id: autostart-disable
  - id: esxi-autostart-suppression
    desc: ESXi VM autostart suppression
    crit: suspicious
    conf: 0.92
    all:
      - id: autostart-clear
      - id: autostart-disable
  - id: hidden-daemon-esxi-ransom-pattern
    desc: Hidden daemon ESXi ransomware
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/persistence/system/daemon/hidden-path::hidden-system-daemon-persistence
      - id: vm-kill
    any:
      - id: storage-pre-encryption-prep
      - id: datastore-access
      - id: objectives/impact/ransom/encrypt/cli::password-gated-ransomware-cli
  - id: full-attack
    desc: ESXi-targeted ransomware attack chain
    crit: suspicious
    conf: 0.95
    all:
      - id: file-targeting
    any:
      - id: vm-kill
      - id: micro-behaviors/os/sysinfo/vmware::vm-snapshot-removal
      - id: xml-vm-enum

  - id: esxi-vm-disk-ransomware
    desc: ESXi VM-disk ransomware with hybrid encryption
    crit: hostile
    conf: 0.99
    attack: T1486,T1489
    for: [c, cpp, elf]
    all:
      - id: micro-behaviors/os/sysinfo/vmware::esxcli-vm-list
      - id: micro-behaviors/os/sysinfo/vmware::esxcli-vm-kill
      - id: micro-behaviors/os/sysinfo/vmware::vmware-extensions-core-a
      - id: esxi-vm-disk-encrypted-note
      - id: micro-behaviors/crypto/symmetric/stream::salsa20-stream-cipher-call
      - id: micro-behaviors/crypto/asymmetric/rsa::rsa-public-encrypt
      - id: micro-behaviors/fs/file/binary::file-content-io

  - id: esxi-vm-disk-kill-ransomware
    desc: ESXi VM termination tied to encrypted-disk targeting
    crit: hostile
    conf: 0.98
    attack: T1486,T1489
    for: [c, cpp, elf]
    all:
      - id: micro-behaviors/os/sysinfo/vmware::esxcli-vm-list
      - id: micro-behaviors/os/sysinfo/vmware::esxcli-vm-kill
      - id: micro-behaviors/os/sysinfo/vmware::vmware-extensions-core-a
      - id: esxi-vmdk-leak-note
      - id: micro-behaviors/fs/file/binary::file-content-io

  - id: source-esxi-vm-disk-ransomware
    desc: Source ESXi disk ransomware with hybrid encryption
    crit: hostile
    conf: 0.99
    attack: T1486,T1489
    for: [c, cpp, elf]
    all:
      - id: source-esxcli-vm-list
      - id: vm-process-kill
      - id: esxi-vmdk-encrypted-note
      - id: micro-behaviors/crypto/symmetric/stream::salsa20-stream-cipher-call
      - id: micro-behaviors/crypto/asymmetric/rsa::rsa-public-encrypt
      - id: micro-behaviors/fs/file/binary::source-file-content-io

  - id: source-esxi-vm-disk-extortion
    desc: Source ESXi disk encryption with leak targeting
    crit: hostile
    conf: 0.99
    attack: T1486,T1530
    for: [c, cpp, elf]
    all:
      - id: source-esxcli-vm-list
      - id: vm-process-kill
      - id: esxi-vmdk-leak-note
      - id: micro-behaviors/crypto/symmetric/stream::salsa20-stream-cipher-call
      - id: micro-behaviors/crypto/asymmetric/rsa::rsa-public-encrypt
      - id: micro-behaviors/fs/file/binary::source-file-content-io

  # Some hypervisor lockers deliver their extortion notice by changing the
  # SSH login banner instead of dropping a conventional ransom-note file.
  # Keep the rule family-neutral and require the destructive VM targeting
  # that separates it from legitimate SSH-banner administration.
  - id: esxi-ssh-login-banner-locker
    desc: ESXi locker reconfigures the SSH login banner after targeting VM files
    crit: hostile
    conf: 0.99
    attack: T1486,T1489
    all:
      - id: micro-behaviors/os/sysinfo/vmware::esxcli-vm-kill
      - id: micro-behaviors/os/sysinfo/vmware::vmware-extensions
      - id: micro-behaviors/os/service/config::sshd-config-path
      - id: micro-behaviors/communications/ssh/server::sshd-banner-file-directive
      - id: micro-behaviors/os/service/control::sshd-restart

  - id: esxi-tor-login-banner-extortion
    desc: ESXi VM-file locker places a Tor contact endpoint in an SSH login banner
    crit: hostile
    conf: 0.99
    attack: T1486,T1489
    all:
      - id: micro-behaviors/os/sysinfo/vmware::esxcli-vm-kill
      - id: micro-behaviors/os/sysinfo/vmware::vmware-extensions
      - id: micro-behaviors/communications/ssh/server::sshd-banner-file-directive
      - id: micro-behaviors/communications/proxy/tor::onion-domain-reference
