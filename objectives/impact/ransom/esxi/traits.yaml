defaults:
  platforms: [unix]
  for: [shell, python, c, cpp, go, elf]
traits:
  # NOTE: moved to micro-behaviors/os/sysinfo/vmware::esxcli-formatter. An
  # output-formatting flag is an esxcli usage fact, not a ransomware
  # behavior; filing it here labeled every admin script that parses
  # `esxcli --formatter csv` as T1486-adjacent.
  - id: world-id-str
    desc: WorldID string
    crit: notable
    conf: 0.6
    if:
      type: text
      word: WorldID
  - id: vm-world-display-listing
    desc: ESXi VM WorldID display listing
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'WorldID.{0,160}DisplayName|DisplayName.{0,160}WorldID'
  - id: vm-process-kill
    desc: vm process kill command
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: vm process kill
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  # NOTE: vmsvc-power-off moved to
  # micro-behaviors/os/virtualization/management::vmsvc-power-off. Powering
  # off a VM is ordinary ESXi administration (CI snapshot-revert watchdogs).
  - id: esxi-shutdown-vms-cli-help
    desc: CLI help shuts down ESXi virtual machines
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Shutdown ESXi virtual machines
  - id: encryption-of-files-cli-help
    desc: CLI help encrypts files on target hosts
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: Encryption of file(s)
  - id: inc-readme-txt-ransom-note-name
    desc: INC ransomware note filename reference
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: INC-README.txt

  - id: vminventory-xml
    desc: ESXi VM inventory XML path
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /etc/vmware/hostd/vmInventory.xml

  - id: xpath-config-entry
    desc: VMware inventory XPath query
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "//ConfigEntry"

  - id: vmxcfgpath-field
    desc: VMware VMX config path XML field
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: vmxCfgPath

  - id: esxi-welcome-note
    desc: ESXi welcome screen ransom note path
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: /usr/lib/vmware/hostd/docroot/ui/welcome.txt

  # NOTE: moved to micro-behaviors/os/sysinfo/vmware::vmkfstools-tool.
  - id: esxi-version-var
    desc: EsxiVersion variable
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '[Ee]sxi[_]?[Vv]ersion'
  # A component: `vmware_version` is an identifier, and Google Distributed
  # Cloud runs on VMware, so its gkeonprem API declares the field throughout
  # generated_clients/apis/gkeonprem/ and api_lib/container/gkeonprem/. The
  # ESXi-ransomware reading comes from `version-detect` below and the
  # datastore/encryption composites it feeds, not from the name.
  - id: vmware-version-var
    desc: vmware_version variable
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: vmware[_]?version
      case_insensitive: true
  - id: storage-filesystem-list
    desc: storage filesystem list command
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: storage filesystem list
  - id: esxcli-storage
    desc: esxcli storage command
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: esxcli storage
  - id: buffer-cache-maxcapacity
    desc: VMFS buffer max capacity
    crit: suspicious
    conf: 0.85
    if:
      type: text
      substr: /BufferCache/MaxCapacity
  - id: buffer-cache-flushinterval
    desc: VMFS buffer flush interval
    crit: suspicious
    conf: 0.85
    if:
      type: text
      substr: /BufferCache/FlushInterval
  - id: autostart-clear
    desc: Clears ESXi autostart
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: hostsvc/autostartmanager/clear_autostart
  - id: autostart-disable
    desc: Disables ESXi autostart
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: hostsvc/autostartmanager/enable_autostart 0

  - id: source-esxcli-vm-list
    desc: ESXi VM process list in source
    crit: notable
    conf: 0.9
    for: [c, cpp, elf]
    if:
      type: text
      # The command template usually continues with redirection or a pipe
      # (esxcli vm process list 2>/dev/null | grep 'World ID' ...), so the
      # closing quote does not follow `list` directly.
      regex: '["'']esxcli\s+vm\s+process\s+list\b'

composite_rules:
  # Rust INC variants include these three independent behavior indicators in
  # their compiled CLI: file encryption, guest shutdown, and vmsvc control.
  - id: rust-esxi-encrypt-and-shutdown
    desc: Rust ESXi file encryption with virtual-machine shutdown controls
    crit: hostile
    conf: 0.98
    attack: T1486,T1489
    for: [elf]
    all:
      - id: encryption-of-files-cli-help
      - id: esxi-shutdown-vms-cli-help
      - id: micro-behaviors/os/virtualization/management::vmsvc-power-off

  # The locker note filename paired with encryption and VM power-off controls
  # distinguishes a ransom payload from standalone ESXi administration.
  - id: rust-esxi-inc-note-locker
    desc: ESXi file locker with an INC ransom-note filename
    crit: hostile
    conf: 0.98
    attack: T1486,T1489
    for: [elf]
    all:
      - id: encryption-of-files-cli-help
      - id: inc-readme-txt-ransom-note-name
      - id: micro-behaviors/os/virtualization/management::vmsvc-power-off

  - id: esxi-vm-disk-ransom-note
    desc: Multiple VM-disk encryption or leak phrases
    crit: notable
    conf: 0.96
    needs: 2
    any:
      - id: metadata/lang/natural/vocabulary/security::vm-disk-encryption-following
      - id: metadata/lang/natural/vocabulary/security::vmdk-encryption-following
      - id: metadata/lang/natural/vocabulary/security::vm-disk-encryption-preceding
      - id: metadata/lang/natural/vocabulary/security::vmdk-leak-or-ransom-following
  - id: esxi-inplace-hybrid-encryptor
    desc: ESXi file rewrite with stream cipher and wrapped key
    crit: suspicious
    conf: 0.98
    attack: T1486
    for: [elf, c, go]
    all:
      - id: micro-behaviors/crypto/symmetric/salsa::salsa20-stream-cipher-call
      - id: micro-behaviors/fs/file/binary::file-content-io
      - id: esxi-vm-disk-ransom-note
    any:
      - id: micro-behaviors/crypto/encrypt/unspecified::rsa-public-encrypt
      - id: micro-behaviors/crypto/encrypt/unspecified::rsa-public-encrypt-call

  - id: esxi-targeted-disk-locker
    desc: ESXi targeted disk locker
    crit: suspicious
    conf: 0.98
    attack: T1486
    for: [elf]
    all:
      - id: micro-behaviors/os/sysinfo/vmware::vmware-extensions
      - id: micro-behaviors/os/sysinfo/vmware::vmfs-path
      - id: esxi-inplace-hybrid-encryptor

  - id: world-display-combo
    desc: ESXi VM WorldID display listing
    crit: component
    all:
      - id: world-id-str
      - id: vm-world-display-listing
  - id: xml-vm-enum
    desc: XML-based ESXi VM inventory enumeration
    crit: suspicious
    conf: 0.9
    mbc: C0027
    attack: T1518
    all:
      - id: vminventory-xml
    any:
      - id: xpath-config-entry
      - id: vmxcfgpath-field

  # NOTE: `esxcli-formatter` (a bare `--formatter` output flag) is not
  # enumeration and must not satisfy this composite on its own: a VMware
  # management driver tripped suspicious/T1486 on `esxcli --formatter csv`.
  # The flag lives on as the neutral
  # micro-behaviors/os/sysinfo/vmware::esxcli-formatter.
  - id: vm-enumeration
    desc: ESXi virtual machine enumeration
    crit: suspicious
    conf: 0.85
    mbc: C0027
    attack: T1486
    any:
      - id: micro-behaviors/os/sysinfo/vmware::vmsvc-getallvms
      - id: micro-behaviors/os/sysinfo/vmware::esxcli-vm-list
      - id: world-display-combo
      - id: xml-vm-enum
    unless:
      - id: metadata/build/generated::generated-attack-map-context
  # Notable, not suspicious. This is a bare `any:` over four identifier and
  # path fragments with nothing else required, and nothing references it, so
  # it is the terminal verdict for a file that merely mentions a hypervisor
  # version. Google Distributed Cloud runs on VMware: its gkeonprem API
  # declares `vmwareVersion` throughout. Reading a version crosses no
  # boundary; the ransomware reading needs the datastore and encryption
  # composites below.
  - id: version-detect
    desc: ESXi version detection for compatibility
    crit: notable
    conf: 0.7
    mbc: C0027
    attack: T1486
    any:
      - id: esxi-version-var
      - id: vmware-version-var
      - id: micro-behaviors/os/sysinfo/vmware::esx-conf-path
      - id: micro-behaviors/os/sysinfo/vmware::system-version-get
  - id: datastore-access
    for: [elf, shell, python, c]
    desc: ESXi datastore enumeration and access
    crit: suspicious
    conf: 0.8
    mbc: C0027
    attack: T1486
    all:
      - id: micro-behaviors/os/sysinfo/vmware::vmfs-path
    any:
      - id: storage-filesystem-list
      - id: esxcli-storage
  - id: storage-pre-encryption-prep
    desc: ESXi storage pre-encryption prep
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/os/sysinfo/vmware::vmkfstools-tool
      - id: micro-behaviors/os/virtualization/hypervisor::eagerzeroedthick-disk-type
    any:
      - id: buffer-cache-maxcapacity
      - id: buffer-cache-flushinterval
      - id: autostart-clear
      - id: autostart-disable
  - id: esxi-autostart-suppression
    desc: ESXi VM autostart suppression
    crit: suspicious
    conf: 0.92
    all:
      - id: autostart-clear
      - id: autostart-disable
  - id: hidden-daemon-esxi-ransom-pattern
    for: [elf, shell, python]
    desc: Hidden daemon ESXi ransomware
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/persistence/system/daemon::hidden-system-daemon-persistence
      - id: objectives/impact/services/stop::esxi-vm-enumerate-terminate
    any:
      - id: storage-pre-encryption-prep
      - id: datastore-access
      - id: micro-behaviors/process/argument/credential::password-with-bulk-file-options
  - id: esxi-vm-lockout-extortion
    for: [elf, shell, python]
    desc: ESXi datastore lockout extortion
    crit: hostile
    conf: 0.99
    attack: T1486,T1489
    all:
      - id: objectives/impact/services/stop::esxi-vm-enumerate-terminate
      - id: micro-behaviors/os/sysinfo/vmware::vmware-extensions
      - id: micro-behaviors/os/sysinfo/vmware::vmfs-path
      - id: objectives/impact/ransom/note::encrypted-host-data-notice
      - id: micro-behaviors/communications/proxy/tor::onion-domain-reference
    any:
      - id: micro-behaviors/fs/file/rename::encrypted-suffix-target
      - id: objectives/impact/ransom/encrypt/cli::shell-openssl-bulk-file-ransom

  - id: esxi-vm-disk-ransomware
    desc: ESXi VM-disk ransomware with hybrid encryption
    crit: hostile
    conf: 0.99
    attack: T1486,T1489
    for: [elf]
    all:
      - id: micro-behaviors/os/sysinfo/vmware::esxcli-vm-list
      - id: micro-behaviors/process/terminate/kill::esxcli-vm-kill
      - id: micro-behaviors/os/sysinfo/vmware::vmware-extensions-core-a
      - id: metadata/lang/natural/vocabulary/security::vm-disk-encryption-following
      - id: micro-behaviors/crypto/symmetric/salsa::salsa20-stream-cipher-call
      - id: micro-behaviors/crypto/encrypt/unspecified::rsa-public-encrypt
      - id: micro-behaviors/fs/file/binary::file-content-io

  - id: esxi-vm-disk-kill-ransomware
    desc: ESXi VM termination tied to encrypted-disk targeting
    crit: hostile
    conf: 0.98
    attack: T1486,T1489
    for: [elf]
    all:
      - id: micro-behaviors/os/sysinfo/vmware::esxcli-vm-list
      - id: micro-behaviors/process/terminate/kill::esxcli-vm-kill
      - id: micro-behaviors/os/sysinfo/vmware::vmware-extensions-core-a
      - id: metadata/lang/natural/vocabulary/security::vmdk-leak-or-ransom-following
      - id: micro-behaviors/fs/file/binary::file-content-io

  - id: source-esxi-vm-disk-ransomware
    desc: Source ESXi disk ransomware with hybrid encryption
    crit: hostile
    conf: 0.99
    attack: T1486,T1489
    for: [c]
    all:
      - id: source-esxcli-vm-list
      - id: vm-process-kill
      - id: metadata/lang/natural/vocabulary/security::vmdk-encryption-following
      - id: micro-behaviors/crypto/symmetric/salsa::salsa20-stream-cipher-call
      - id: micro-behaviors/crypto/encrypt/unspecified::rsa-public-encrypt
      - id: micro-behaviors/fs/file/binary::source-file-content-io

  - id: source-esxi-vm-disk-extortion
    desc: Source ESXi disk encryption with leak targeting
    crit: hostile
    conf: 0.99
    attack: T1486,T1530
    for: [c]
    all:
      - id: source-esxcli-vm-list
      - id: vm-process-kill
      - id: metadata/lang/natural/vocabulary/security::vmdk-leak-or-ransom-following
      - id: micro-behaviors/crypto/symmetric/salsa::salsa20-stream-cipher-call
      - id: micro-behaviors/crypto/encrypt/unspecified::rsa-public-encrypt
      - id: micro-behaviors/fs/file/binary::source-file-content-io

  # Some hypervisor lockers deliver their extortion notice by changing the
  # SSH login banner instead of dropping a conventional ransom-note file.
  # Keep the rule family-neutral and require the destructive VM targeting
  # that separates it from legitimate SSH-banner administration. An sshd
  # restart is not required evidence: ESXi lockers write the banner file
  # and append the Banner directive to sshd_config, and the notice takes
  # effect on the next SSH login without an explicit restart. The
  # extortion claim itself (either notice phrasing) stays required.
  - id: esxi-vm-termination-ransom-banner
    for: [elf, shell, python, c, cpp, go, rust]
    desc: ESXi VM termination with OpenSSH ransom banner
    crit: hostile
    conf: 0.99
    attack: T1486,T1489
    all:
      - id: micro-behaviors/process/terminate/kill::esxcli-vm-kill
      - id: micro-behaviors/os/sysinfo/vmware::vmware-extensions
      - id: micro-behaviors/os/service/config::sshd-config-path
      - id: micro-behaviors/communications/ssh/server::sshd-banner-file-directive
    any:
      - id: objectives/impact/ransom/note::encrypted-host-data-notice
      - id: objectives/impact/ransom/encrypt/threat-text::ransom-note-files-encrypted-state

  # ChaCha20 ESXi locker: enumerate guests, force-kill them to release
  # VMDK locks, encrypt VM files in place with a stream cipher, and wrap
  # the session key with an embedded RSA public key. The Salsa20-keyed
  # composites above miss this cipher choice; the VM-extension, VM-kill,
  # hybrid-crypto, and file-rewrite roles are each required so an ESXi
  # backup or administration tool (no forced guest kill paired with
  # in-place encryption and key wrapping) does not match.
  - id: esxi-chacha-vm-disk-ransomware
    desc: ESXi VM-disk ransomware with ChaCha20 and RSA key wrapping
    crit: hostile
    conf: 0.99
    attack: T1486,T1489
    for: [elf, c, cpp, go, rust]
    all:
      - id: micro-behaviors/os/sysinfo/vmware::esxcli-vm-list
      - id: micro-behaviors/process/terminate/kill::esxcli-vm-kill
      - id: micro-behaviors/os/sysinfo/vmware::vmware-extensions
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-cipher-operation
      - id: micro-behaviors/crypto/encrypt/unspecified::rsa-public-encrypt-call
    any:
      - id: micro-behaviors/fs/file/binary::file-content-io
      - id: micro-behaviors/fs/file/binary::source-file-content-io

  - id: rust-aes-esxi-locker-cli
    desc: Rust AES ESXi locker with shutdown CLI
    crit: hostile
    conf: 0.98
    attack: T1486,T1489
    for: [elf]
    all:
      - id: metadata/lang/compiler/systems::rust-binary
      - id: metadata/package/dependencies/crypto::rust-aes-crate-path
      - id: micro-behaviors/os/virtualization/management::vmsvc-power-off
      - id: esxi-shutdown-vms-cli-help
    any:
      - id: encryption-of-files-cli-help
      - id: inc-readme-txt-ransom-note-name

  - id: rust-esxi-vmsvc-file-encryptor
    desc: Rust ESXi encryptor enumerates VMs via vim-cmd
    crit: hostile
    conf: 0.97
    attack: T1486
    for: [elf]
    all:
      - id: metadata/lang/compiler/systems::rust-binary
      - id: encryption-of-files-cli-help
      - id: micro-behaviors/os/virtualization/management::vmsvc-power-off
      - id: micro-behaviors/os/sysinfo/vmware::vmsvc-getallvms
