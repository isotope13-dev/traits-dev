# ESXi ransomware prep shells disable unsigned-binary lockdown, terminate
# guest worlds, launch an encryptor against VMFS, and often remove the HA
# agent (vmware-fdm) so failover cannot undo the impact.
defaults:
  platforms: [unix]
  for: [shell, python, perl]
  attack: T1486,T1489,T1562.001
  mbc: C0027

traits:
  - id: esxcli-vib-remove-vmware-fdm
    desc: Removes the VMware HA agent VIB (vmware-fdm)
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)esxcli\s+software\s+vib\s+remove\b[^\n]{0,80}\bvmware-fdm\b'

composite_rules:
  - id: esxi-ransom-prep-unlock-and-kill
    desc: Unlocks exec then force-kills ESXi VMs
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/terminate/kill::esxcli-vm-kill
      - id: objectives/evasion/security-bypass/policy/execution::esxi-exec-installed-only-disabled
    near_lines: 40

  - id: esxi-ransom-prep-vmfs-and-ha-removal
    desc: Targets VMFS and removes ESXi HA after VM kill
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/terminate/kill::esxcli-vm-kill
      - id: micro-behaviors/os/sysinfo/vmware::vmfs-path
      - id: esxcli-vib-remove-vmware-fdm
    near_lines: 40

  - id: esxi-unlock-and-vmfs-locker-launch
    desc: Disables ESXi execInstalledOnly and launches a VMFS locker
    crit: hostile
    conf: 0.98
    for: [shell, python, perl, ruby, go, c, cpp]
    near_lines: 30
    all:
      - id: objectives/evasion/security-bypass/policy/execution::esxi-exec-installed-only-disabled
      - id: micro-behaviors/os/sysinfo/vmware::vmfs-path
      - id: micro-behaviors/fs/chmod/remote::local-or-remote-staged-launch
    needs: 2
    any:
      - id: micro-behaviors/process/argument/file::wipe-cli-option
      - id: micro-behaviors/process/argument/file::depth-cli-option
      - id: micro-behaviors/process/argument/lifecycle::selftest-cli-option
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: esxi-vmfs-recursive-wipe-invocation
    desc: Invokes recursive directory-depth and wipe options against VMFS
    crit: hostile
    conf: 0.97
    for: [shell, python, perl, ruby, go, c, cpp]
    near_lines: 15
    all:
      - id: micro-behaviors/os/sysinfo/vmware::vmfs-path
      - id: micro-behaviors/process/argument/file::depth-cli-option
      - id: micro-behaviors/process/argument/file::wipe-cli-option
      - id: micro-behaviors/fs/chmod/remote::local-or-remote-staged-launch
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: esxi-exec-bypass-staged-selftest-or-wipe
    desc: Stages chmod, disables ESXi execInstalledOnly, and runs self-test or wipe
    crit: hostile
    conf: 0.98
    for: [shell, python, perl, ruby, go, c, cpp]
    all:
      - id: micro-behaviors/fs/chmod/remote::executable-permission-staging
      - id: objectives/evasion/security-bypass/policy/execution::esxi-exec-installed-only-disabled
    any:
      - id: micro-behaviors/process/argument/lifecycle::selftest-cli-option
      - id: micro-behaviors/process/argument/file::wipe-cli-option
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
