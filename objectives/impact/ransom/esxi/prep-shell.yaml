# ESXi ransomware prep shells disable unsigned-binary lockdown, terminate
# guest worlds, launch an encryptor against VMFS, and often remove the HA
# agent (vmware-fdm) so failover cannot undo the impact.
defaults:
  platforms: [unix]
  for: [shell, python, perl]
  attack: T1486,T1489,T1562.001
  mbc: C0027

traits:
  - id: esxcli-system-settings-advanced-set
    desc: esxcli system settings advanced set
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)esxcli\s+system\s+settings\s+advanced\s+set\b'

  - id: exec-installed-only-setting
    desc: ESXi /User/execInstalledOnly setting path
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /User/execInstalledOnly

  - id: esxcli-i-zero-flag
    desc: esxcli -i 0 numeric flag
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '(?i)(^|[\s])-i\s*0\b'

  - id: esxcli-vib-remove-vmware-fdm
    desc: Removes the VMware HA agent VIB (vmware-fdm)
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)esxcli\s+software\s+vib\s+remove\b[^\n]{0,80}\bvmware-fdm\b'

composite_rules:
  - id: esxcli-exec-installed-only-disable
    desc: Disables ESXi execInstalledOnly via esxcli
    crit: suspicious
    conf: 0.95
    all:
      - id: esxcli-system-settings-advanced-set
      - id: exec-installed-only-setting
      - id: esxcli-i-zero-flag
    near_lines: 2

  - id: esxi-ransom-prep-unlock-and-kill
    desc: Unlocks exec then force-kills ESXi VMs
    crit: hostile
    conf: 0.98
    all:
      - id: esxcli-exec-installed-only-disable
      - id: micro-behaviors/process/terminate/kill::esxcli-vm-kill
    near_lines: 40

  - id: esxi-ransom-prep-vmfs-and-ha-removal
    desc: Targets VMFS and removes ESXi HA after VM kill
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/terminate/kill::esxcli-vm-kill
      - id: micro-behaviors/os/sysinfo/vmware::vmfs-path
      - id: esxcli-vib-remove-vmware-fdm
    near_lines: 40
