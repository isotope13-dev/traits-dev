# ESXi ransomware prep shells disable unsigned-binary lockdown, terminate
# guest worlds, launch an encryptor against VMFS, and often remove the HA
# agent (vmware-fdm) so failover cannot undo the impact.
defaults:
  platforms: [unix]
  for: [shell, python, perl]
  attack: T1486,T1489,T1562.001
  mbc: C0027

traits:
  - id: esxcli-vib-remove-vmware-fdm
    desc: Removes the VMware HA agent VIB (vmware-fdm)
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)esxcli\s+software\s+vib\s+remove\b[^\n]{0,80}\bvmware-fdm\b'

composite_rules:
  - id: esxi-ransom-prep-unlock-and-kill
    desc: Unlocks exec then force-kills ESXi VMs
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/terminate/kill::esxcli-vm-kill
    any:
      - id: objectives/evasion/security-bypass/policy/execution::esxi-runtime-exec-installed-only-disable
      - id: objectives/evasion/security-bypass/policy/execution::esxi-runtime-exec-installed-only-disable-value-first
      - id: objectives/evasion/security-bypass/policy/execution::esxi-boot-exec-installed-only-disable
      - id: objectives/evasion/security-bypass/policy/execution::esxi-encryption-exec-installed-only-disable
    near_lines: 40

  - id: esxi-ransom-prep-vmfs-and-ha-removal
    desc: Targets VMFS and removes ESXi HA after VM kill
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/terminate/kill::esxcli-vm-kill
      - id: micro-behaviors/os/sysinfo/vmware::vmfs-path
      - id: esxcli-vib-remove-vmware-fdm
    near_lines: 40
