# A page that names a ransomware project and offers its source archive.
#
# The self-description is a claim about what the project is, so it is an
# objective fact. The source-archive link is a distribution fact, a capability
# in micro-behaviors. Together they describe a repository page that hands out
# ransomware code. Neither leg alone establishes that: a security-training repo
# may name its simulator and link its archive, so the composite requires both
# on the same file.
defaults:
  for: [documents]
  platforms: [unix, windows, android]
  attack: T1486

traits:
  - id: project-self-described-ransomware
    desc: Project self-describes as a ransomware
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bransomware\s+(fait|made|written|coded)\b'
  # Copycat phrasing: "Python ransomware" or "ransomware en Python" with no
  # verb between the noun and the language.
  - id: project-self-described-python-ransomware
    desc: Project self-describes as a Python ransomware
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\b(python\s+ransomware|ransomware\s+(en|in)\s+python)\b'

composite_rules:
  - id: ransomware-project-source-offer
    desc: Ransomware project page offers source archive
    crit: hostile
    conf: 0.9
    scope: file
    all:
      - id: project-self-described-ransomware
      - id: micro-behaviors/communications/url/external/github::github-source-archive-zip
  - id: python-ransomware-project-source-offer
    desc: Python ransomware project page offers source archive
    crit: hostile
    conf: 0.9
    scope: file
    all:
      - id: project-self-described-python-ransomware
      - id: micro-behaviors/communications/url/external/github::github-source-archive-zip
