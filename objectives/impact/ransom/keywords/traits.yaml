defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - id: your-files-phrase
    desc: '"your files" ransom phrase'
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: \b(all\s+)?your files(\s+have\s+been|\s+are)\b
      case_insensitive: true
  - id: files-have-been-phrase
    desc: '"files have been" ransom phrase'
    crit: baseline
    conf: 0.5
    if:
      type: text
      substr: files have been
      case_insensitive: true
  - id: pay-bitcoin-phrase
    desc: '"pay...bitcoin" ransom phrase'
    crit: baseline
    conf: 0.6
    if:
      type: text
      regex: pay.{0,50}bitcoin
      case_insensitive: true
  - id: transfer-bitcoin-phrase
    desc: Bitcoin transfer payment demand
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)transfer.{0,40}bitcoin'
  - id: decrypt-files-phrase
    desc: '"decrypt...files" ransom phrase'
    crit: baseline
    conf: 0.6
    if:
      type: text
      regex: decrypt.{0,50}files
      case_insensitive: true
  - id: ransom-ui-files-encrypted
    desc: Ransom UI files encrypted headline
    crit: suspicious
    conf: 0.85
    if:
      type: hex
      section: .text
      pattern: 46 00 69 00 6C 00 65 00 73 00 20 00 45 00 6E 00 63 00 72 00 79 00 70 00 74 00 65 00 64 00
  - id: ransom-ui-your-files-encrypted
    desc: Ransom UI your-files-encrypted headline
    crit: suspicious
    conf: 0.95
    if:
      type: hex
      section: .text
      pattern: 59 00 4F 00 55 00 52 00 20 00 46 00 49 00 4C 00 45 00 53 00 20 00 41 00 52 00 45 00 20 00 45 00 4E 00 43 00 52 00 59 00 50 00 54 00 45 00 44 00
  - id: ransom-note-btc-payment-wide
    desc: Wide ransom note demands BTC payment
    crit: suspicious
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: 52 00 41 00 4E 00 53 00 4F 00 4D 00 20 00 4E 00 4F 00 54 00 45 00 [2-180] 50 00 61 00 79 00 [2-100] 42 00 54 00 43 00
  - id: ransom-ui-decryption-fee
    desc: Ransom UI decryption fee demand
    crit: suspicious
    conf: 0.85
    if:
      type: hex
      section: .text
      pattern: 44 00 65 00 63 00 72 00 79 00 70 00 74 00 69 00 6F 00 6E 00 20 00 46 00 65 00 65 00
  - id: ransom-extension-filepicker-filter
    desc: Encrypted extension filepicker filter
    crit: suspicious
    conf: 0.9
    if:
      type: hex
      section: .text
      pattern: 45 00 6E 00 63 00 72 00 79 00 70 00 74 00 65 00 64 00 20 00 46 00 69 00 6C 00 65 00 73 00 20 00 28 00 2A 00 2E 00 [6-24] 29 00 7C 00 2A 00 2E 00
  - id: chaos-ransom-ui-header
    desc: Chaos ransomware UI header string
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: Want to decrypt all files?
  - id: chaos-ransom-ui-wait
    desc: Chaos ransomware UI progress message
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: Decrypting files, Don't touch anything
