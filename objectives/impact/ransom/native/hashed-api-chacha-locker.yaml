# A native file locker that hides its imports (hash-resolved APIs with a
# debugger check), uses ChaCha/Salsa constants for bulk encryption, and
# carries a message telling the user their files are encrypted. Each piece
# occurs alone in unrelated software; together they are a ransomware build
# trying to survive static review.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1486,T1027.007
  mbc: B0040
composite_rules:
  - id: hash-resolved-chacha-locker-with-ransom-claim
    desc: Hash-resolved APIs, ChaCha constants and a ransom claim
    crit: hostile
    conf: 0.92
    all:
      - id: objectives/anti-static/obfuscation/imports/api-hashing::unsigned-x86-anti-debug-hash-resolver
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha-salsa-constant
      - id: encryption-technology-msg
    unless:
      - id: metadata/signed/platform/
