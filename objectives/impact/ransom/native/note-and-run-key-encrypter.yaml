# A native encrypter that writes a note file, wraps its key material with
# CryptoAPI, walks every volume and re-launches itself from a Run key. The
# note helpers are named in the error strings the program prints.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1486,T1547.001
  mbc: B0040
traits:
  - id: note-file-create-error
    desc: Note-file creation error strings
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Can.t (create|write) note file'
composite_rules:
  - id: note-writing-capi-encrypter-with-run-key
    desc: Note-writing CryptoAPI encrypter with Run key persistence
    crit: hostile
    conf: 0.92
    all:
      - id: note-file-create-error
      - id: micro-behaviors/crypto/provider/cryptoapi::crypt-encrypt
      - id: micro-behaviors/fs/enumerate/volume::windows-volume-enumeration
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
    unless:
      - id: metadata/signed/platform/
