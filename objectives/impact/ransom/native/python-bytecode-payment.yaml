defaults:
  platforms: [windows, unix]
  for: [pyc]
  attack: T1486

traits:
  - id: pyc-payment-bitcoin-demand
    desc: Bytecode embeds Bitcoin payment demand
    crit: notable
    if:
      type: text
      regex: '(?i)payment.{0,50}(bitcoin|btc)'
  - id: pyc-file-deletion-threat
    desc: Bytecode threatens deletion of files
    crit: notable
    if:
      type: text
      regex: '(?i)files\s+(will|may)\s+be\s+deleted'

composite_rules:
  - id: pyc-file-encryption-payment-threat
    desc: Bytecode pairs file encryption and ransom demands
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/code/bytecode::pyc-encrypt-name-record
      - id: metadata/binary/code/bytecode::python-bytecode-encrypt-file-helper
      - id: pyc-payment-bitcoin-demand
      - id: pyc-file-deletion-threat
      - id: micro-behaviors/data/format/crypto-address::hardcoded-btc-addr
