defaults:
  for: [objective_c]
  platforms: [unix]

traits:
  - id: objc-ransom-file-operation-markers
    desc: Objective-C file operation API text
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule objc_ransom_file_operation_markers {
          strings:
            $walk = "enumeratorAtPath:"
            $write = "writeToFile:"
            $remove = "removeItemAtPath:"
          condition:
            all of them
        }

  - id: objc-encrypted-files-note
    desc: Objective-C encrypted-files ransom note text
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule objc_encrypted_files_note {
          strings:
            $note = "YOUR FILES HAVE BEEN ENCRYPTED"
          condition:
            $note
        }

  - id: objc-indexed-xor-text
    desc: Objective-C indexed XOR expression text
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '\^[ \t]*[a-zA-Z_][a-zA-Z_0-9]*\['

composite_rules:
  - id: objc-xor-ransom-file-walk
    desc: Objective-C encrypts and removes ransom files
    crit: hostile
    conf: 0.98
    attack: T1486
    scope: file
    all:
      - id: objc-ransom-file-operation-markers
      - id: objc-encrypted-files-note
      - id: objc-indexed-xor-text
