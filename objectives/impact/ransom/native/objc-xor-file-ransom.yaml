defaults:
  for: [objective_c]
  platforms: [unix]
  attack: T1486

traits:
  - id: objc-xor-ransom-file-walk
    desc: Objective-C encrypts and removes ransom files
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule objc_xor_ransom_file_walk {
          strings:
            $walk = "enumeratorAtPath:"
            $write = "writeToFile:"
            $remove = "removeItemAtPath:"
            $xor = /\^[ \t]*[a-zA-Z_][a-zA-Z_0-9]*\[/
            $note = "YOUR FILES HAVE BEEN ENCRYPTED"
          condition:
            all of them
        }
