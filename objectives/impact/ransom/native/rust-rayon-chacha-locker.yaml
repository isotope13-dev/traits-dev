# A native locker built with Rust: a thread pool fans file encryption out
# across cores, ChaCha20 does the bulk work, and shadow copies are deleted
# first so the victim cannot roll back.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1486,T1490
composite_rules:
  - id: rust-pool-chacha-shadow-delete-locker
    desc: Pooled ChaCha20 encryptor deleting shadow copies
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha-salsa-constant
      - id: micro-behaviors/process/work/pool::worker-pool
      - id: objectives/impact/ransom/recovery-inhibition::rust-fused-shadow-delete-argv
    unless:
      - id: metadata/signed/platform/
