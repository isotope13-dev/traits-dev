defaults:
  platforms: [unix, windows]
  for: [scripts, source, documents]
  attack: T1486
traits:
  - id: dotnet-wmic-image-literal
    desc: .NET metadata references the wmic executable
    crit: notable
    conf: 0.9
    attack: T1490
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)^wmic(\.exe)?$'
composite_rules:
  - id: windows-ransomware-process-preparation
    desc: Windows ransomware recovery destruction and process preparation
    crit: hostile
    conf: 0.98
    attack: T1486,T1490
    platforms: [windows]
    for: [source, scripts, binaries]
    all:
      - id: objectives/impact/ransom/recovery-inhibition::shadow-delete
      - id: micro-behaviors/process/terminate/command::taskkill-sensitive-target-cluster
      - id: objectives/impact/ransom/encrypt/config::ransom-note-text
  - id: windows-ransomware-cleanup-shutdown
    desc: Windows ransomware cleanup and forced shutdown
    crit: hostile
    conf: 0.98
    attack: T1486,T1070.004,T1529
    platforms: [windows]
    for: [source, binaries]
    all:
      - id: windows-ransomware-process-preparation
      - id: micro-behaviors/os/event/shutdown::shutdown-command-source
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
  - id: windows-ransomware-configured-locker
    desc: Windows XML-configured ransomware locker
    crit: hostile
    conf: 0.98
    attack: T1486,T1490
    platforms: [windows]
    for: [source, scripts, binaries]
    all:
      - id: objectives/impact/ransom/recovery-inhibition::shadow-delete
      - id: objectives/impact/ransom/encrypt/config::xml-locker-settings-schema
    any:
      - id: objectives/impact/ransom/encrypt/config::ransom-note-text
      - id: objectives/impact/ransom/encrypt/config::encoded-ransom-note-content
  - id: windows-ransomware-admin-preflight
    desc: Windows ransomware administrator preflight
    crit: suspicious
    conf: 0.96
    attack: T1033
    platforms: [windows]
    for: [source, binaries]
    all:
      - id: micro-behaviors/os/privilege/check::admin-sid-check
      - id: micro-behaviors/fs/write/file/redirect::disable-wow64-filesystem-redirection
      - id: objectives/impact/ransom/encrypt/config::xml-locker-settings-schema
