# Native rogue-antivirus scareware: fake infection verdicts paired with a
# pay-to-clean demand, persisted across reboots. Legitimate scanners are
# signed and keep their UI strings in the clear; XOR-hidden infection talk
# plus an unsigned image plus logon persistence is the rogue shape.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: infection-verdict-text
    desc: Infection verdict or full-scan demand text
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: '(?i)(potential\s+threats?|files\s+infected|full\s+scan\s+of\s+your)'
    unless:
      # Safe Browsing copy ("potential threats (malware, phishing)") lives in
      # the engine string table. That is a catalog, not a scareware verdict.
      - id: well-known/lib/runtime/scripted/electron::chromium-engine-capability-context
  - id: unregistered-clean-demand
    desc: Unregistered-version cleaning demand
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)(unregistered.{0,60}\bclean\b|\bclean\b.{0,60}unregistered)'

composite_rules:
  - id: fakeav-verdict-text
    desc: Fake antivirus infection verdict or cleaning demand
    crit: suspicious
    conf: 0.88
    any:
      - id: infection-verdict-text
      - id: unregistered-clean-demand
  - id: fakeav-logon-persistence
    desc: Fake antivirus logon persistence surface
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/os/registry/keys::run-value-name
      - id: micro-behaviors/os/registry/keys::winlogon-registry-path
  - id: unsigned-persistent-fakeav-cleaner
    desc: Unsigned fake antivirus persists with hidden infection verdicts
    crit: hostile
    conf: 0.92
    attack: T1491.001
    all:
      - id: fakeav-verdict-text
      - id: fakeav-logon-persistence
      - id: metadata/signed/trust-level::unsigned
      - id: objectives/impact/infect/terms::infected-xor-pattern
