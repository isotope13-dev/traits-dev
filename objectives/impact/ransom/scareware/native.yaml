# Native rogue-antivirus scareware: fake infection verdicts paired with a
# pay-to-clean demand, persisted across reboots. Legitimate scanners are
# signed and keep their UI strings in the clear; XOR-hidden infection talk
# plus an unsigned image plus logon persistence is the rogue shape.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: fakeav-infection-count-text
    desc: Fake AV infection count verdict text
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)(infections\s+(found|cleanable)|heavily\s+infected)'
  - id: trial-threat-removal-demand
    desc: Trial threat removal demand text
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)trial\s+version.{0,60}cannot\s+remove'
  - id: unregistered-clean-demand
    desc: Unregistered cleaning demand text
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)(unregistered.{0,60}\bclean\b|\bclean\b.{0,60}unregistered)'
    not:
      - regex: '(?i)\bclean\s+(absolute\s+)?path\b'
      - regex: '(?i)\bunregistered\s+path\b'
      - regex: '(?i)\.clean[/\\]'
      - regex: '(?i)\bcannot remove unregistered\b'

composite_rules:
  - id: restricted-cleaning-demand
    desc: Trial or registration restriction on cleaning
    crit: suspicious
    conf: 0.85
    any:
      - id: trial-threat-removal-demand
      - id: unregistered-clean-demand
  - id: fakeav-verdict-text
    desc: Infection wording with restricted cleaning demand
    crit: suspicious
    conf: 0.88
    all:
      - id: restricted-cleaning-demand
    any:
      - id: micro-behaviors/ui/dialog/error::potential-threat-wording
      - id: micro-behaviors/ui/dialog/error::infected-files-wording
      - id: micro-behaviors/ui/dialog/error::full-scan-wording
      - id: fakeav-infection-count-text
  - id: unsigned-persistent-fakeav-cleaner
    desc: Unsigned fake AV with hidden verdicts
    crit: hostile
    conf: 0.92
    attack: T1491.001
    all:
      - id: fakeav-verdict-text
      - id: micro-behaviors/os/registry/keys/autostart::run-or-winlogon-key-reference
      - id: metadata/signed/trust-level::unsigned
      - id: objectives/impact/infect/terms::infected-xor-pattern
  - id: persistent-fakeav-scareware
    desc: Persistent fake antivirus scareware
    crit: hostile
    conf: 0.95
    attack: T1491.001
    all:
      - id: fakeav-verdict-text
      - id: micro-behaviors/os/registry/keys/autostart::run-or-winlogon-key-reference
    any:
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-binary
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
      - id: micro-behaviors/communications/http/client/managed::webclient
