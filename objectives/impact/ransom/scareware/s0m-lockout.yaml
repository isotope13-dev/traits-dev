defaults:
  platforms: [windows]
  for: [data]
traits:
  - id: s0m-recovery-payment-notice
    desc: Serialized recovery and payment notice bytes
    crit: notable
    conf: 0.94
    if:
      type: yara
      source: |
        rule s0m_recovery_payment_notice {
          strings:
            $header = { 0A 01 00 00 ?? ?? ?? ?? 50 72 6F 67 72 61 6D 3A 20 00 }
            $notice = { A2 4C 65 67 61 6C 4E 6F 74 69 63 65 54 65 78 74 00 }
            $restore = { E2 EE F1 F1 F2 E0 ED EE E2 }
            $send = { EF F0 E8 F8 EB E8 }
            $topup = { EF EE EF EE EB ED }
            $contact = "@" ascii
          condition:
            $header at 0 and
            for any n in (1..#notice) : (
              $restore in (@notice[n]+!notice[n]..@notice[n]+!notice[n]+640) and
              $send in (@notice[n]+!notice[n]..@notice[n]+!notice[n]+640) and
              $topup in (@notice[n]+!notice[n]..@notice[n]+!notice[n]+640) and
              $contact in (@notice[n]+!notice[n]..@notice[n]+!notice[n]+640)
            )
        }
composite_rules:
  - id: s0m-lockout-and-payment-notice
    desc: Serialized script combines lockout and payment
    crit: hostile
    conf: 0.97
    all:
      - id: s0m-recovery-payment-notice
      - id: micro-behaviors/os/registry/policy/write::s0m-taskmgr-policy-value
      - id: micro-behaviors/os/registry/policy/write::s0m-registry-tools-policy-value
      - id: micro-behaviors/os/registry/policy/write::s0m-control-panel-policy-value
      - id: micro-behaviors/os/registry/policy/write::s0m-run-policy-value
