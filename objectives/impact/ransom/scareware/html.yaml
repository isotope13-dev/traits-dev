# Static HTML scareware: a fatal-spyware claim next to an off-site
# "scan your PC" link. The copy alone is a verdict; the link is the lure.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1036

traits:
  - id: remote-computer-access-claim
    desc: Claims remote access to the PC
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)remote computer has gained\s+an?\s*access to your computer'
      exclude_html_comments: true

composite_rules:
  - id: remote-access-protection-lure
    desc: Remote-access scare links to protection
    crit: hostile
    conf: 0.96
    near_bytes: 2500
    all:
      - id: remote-computer-access-claim
      - id: micro-behaviors/ui/dialog/prompt::spyware-protection-link
  - id: spyware-fatal-error-scan-lure
    desc: Fatal-spyware claim links to a PC scan
    crit: hostile
    conf: 0.96
    near_bytes: 2000
    all:
      - id: objectives/evasion/masquerade/identity/product::spyware-fatal-error-claim
      - id: objectives/evasion/masquerade/identity/product::scan-your-pc-http-anchor
