# A marshalled Tk script that takes the whole screen, stays on top, and tells
# the user the system is locked in ransom wording. Fullscreen plus topmost is
# how a locker keeps the victim from reaching anything else.
defaults:
  platforms: [windows]
  for: [pyc]
  attack: T1491.001,T1486
composite_rules:
  - id: pyc-fullscreen-topmost-ransom-lockscreen
    desc: Fullscreen topmost lock window with ransom text
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/ui/window/visibility::pyc-window-fullscreen-option
      - id: micro-behaviors/ui/window/visibility::pyc-window-topmost-option
      - id: micro-behaviors/ui/keywords::system-locked-phrase
      - id: objectives/impact/ransom/note::ransom-deface-phrase
