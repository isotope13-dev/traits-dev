defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Preserve the broader content/capability inference without claiming a
  # native call consumes the embedded command. The WinExec rule supplies
  # that argument relationship for the tested x86 calling form.
  - id: ransom-explorer-launch-clues
    desc: Ransom wording with Explorer command and launch API
    crit: suspicious
    conf: 0.95
    all:
      - id: pe-ransom-extortion-content
      - id: micro-behaviors/process/terminate/target::native-explorer-taskkill-launch-clues
