# Double-extortion ransomware first packages and uploads sensitive victim data,
# then encrypts local files and leaves a recovery note. Keep each leg
# behavioral so this remains useful across families and implementations.
defaults:
  for: [source, scripts, binaries]
  platforms:
    - linux
    - macos
    - windows
    - unix
    - android
    - ios
    - aix
    - solaris
    - freebsd
    - openbsd
    - netbsd
    - dragonflybsd
    - openwrt
    - qnx
    - esxi
    - zos
    - appliance
    - routeros
    - fortios
  attack: T1041,T1486,T1560.001

composite_rules:
  - id: sensitive-archive-upload-file-encryption-extortion
    desc: Sensitive archive upload paired with file encryption and a ransom note
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/sensitive/
      - id: micro-behaviors/data/archive/create/
      - id: micro-behaviors/communications/http/upload/
      - id: objectives/impact/ransom/note::ultimatum-filename
    any:
      - id: objectives/impact/ransom/encrypt/config::ransomware-basic
      - id: objectives/impact/ransom/encrypt/config::ransomware-locker-esxi
      - id: objectives/impact/ransom/encrypt/config::c-file-encryptor
      - id: objectives/impact/ransom/encrypt/filesystem::python-xor-file-ransom
      - id: objectives/impact/ransom/encrypt/filesystem::shell-openssl-bulk-file-ransom
      - id: objectives/impact/ransom/encrypt/filesystem::go-ransomware-encrypt
      - id: objectives/impact/ransom/encrypt/bytecode::encrypt-walk-ransom
      - id: objectives/impact/ransom/encrypt/bulk-encryption::recursive-ransom-note-direct-suffix-locker
      - id: objectives/impact/ransom/encrypt/bulk-encryption::native-file-encryptor-workflow
      - id: objectives/impact/ransom/encrypt/bulk-encryption::windows-native-file-encryptor-workflow
      - id: objectives/impact/ransom/encrypt/native-locker::native-cross-platform-file-encryptor
      - id: objectives/impact/ransom/encrypt/capi::capi-rsaenh-file-encryptor
      - id: objectives/impact/ransom/note::js-ransomware-encryption
