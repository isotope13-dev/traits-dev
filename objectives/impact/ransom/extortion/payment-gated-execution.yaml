defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: payment-demand-throws-execution-error
    desc: Payment demand followed by a thrown error
    crit: hostile
    conf: 0.96
    attack: T1657
    if:
      type: text
      regex: '(?is)(payment.{0,20}required|pay.{0,20}(invoice|sats)).{0,400}throw new Error'
