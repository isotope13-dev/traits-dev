defaults:
  platforms: [windows]
  for: [xml]

traits:
  - id: gpo-data-theft-notice-value
    desc: Registry value claims wholesale data theft
    crit: component
    if:
      type: text
      regex: '(?i)\bvalue=["''](all|your) data (has been )?(exfiltrated|stolen)\b'

composite_rules:
  - id: gpo-logon-data-theft-notice
    desc: Logon registry notice claims data was stolen
    crit: suspicious
    conf: 0.98
    near_lines: 1
    all:
      - id: micro-behaviors/os/registry/value-name::legal-notice-text
      - id: gpo-data-theft-notice-value
