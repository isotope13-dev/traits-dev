defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-ransom-input-lockout
    desc: Managed ransom with input and policy lockout
    crit: hostile
    conf: 0.98
    attack: T1491.001,T1112
    all:
      - id: micro-behaviors/hardware/input/block::dotnet-block-input-reference
      - id: objectives/impact/ransom/keywords::ransom-note-btc-payment-wide
      - id: micro-behaviors/os/registry/write::taskmgr-policy-write-api-cooccurrence
      - id: micro-behaviors/os/registry/manipulate::run-path-write-api-references
      - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
