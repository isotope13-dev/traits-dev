defaults:
  platforms: [windows]
  for: [batch, python]
traits:
  - id: batch-prints-encrypted-files-payment-demand
    desc: Batch prints encrypted-files payment demand
    for: [batch]
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?im)^\s*@?echo\b.{0,80}files.{0,40}encrypted.{0,40}pay\s+bitcoin\b'
composite_rules:
  - id: source-bitcoin-demand-content
    desc: Script has a bitcoin payment demand
    crit: notable
    conf: 0.95
    any:
      - id: objectives/impact/ransom/note::cryptocurrency-payment-request
      - id: batch-prints-encrypted-files-payment-demand
  - id: source-ransom-explorer-termination
    desc: File-encryption payment demand with Explorer kill
    crit: hostile
    conf: 0.98
    all:
      - id: source-bitcoin-demand-content
      - id: objectives/impact/ransom/encrypt/threat-text::files-encrypted-msg
    any:
      - id: micro-behaviors/process/terminate/target::python-explorer-taskkill-string-call
      - id: micro-behaviors/process/terminate/target::batch-explorer-taskkill-statement
