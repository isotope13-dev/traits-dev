# Double-extortion notes increasingly skip the classic "download Tor
# Browser" walkthrough and payment wording. Instead the victim is given a
# raw onion leak-site URL plus an anonymous-messenger negotiation channel
# (a Session account ID, or an instruction to install Session). The onion
# address format and the Session contact are structural; the extortion
# claim supplies the victim-facing context, so renamed notes, rotated
# onion services, and new operator IDs keep matching.
defaults:
  platforms: [windows, unix]
  for: [text, html, scripts, binaries]
  attack: T1486,T1657

composite_rules:
  - id: session-onion-ransom-negotiation
    desc: Ransom negotiation via Session and Tor leak site
    crit: hostile
    conf: 0.97
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/proxy/tor::onion-domain-reference
      - id: objectives/command-and-control/channel/messaging::session-contact-channel
    any:
      - id: objectives/impact/ransom/extortion::stolen-data-held-claim
      - id: objectives/impact/ransom/extortion::data-release-threat-claim
      - id: objectives/impact/ransom/extortion::network-compromised-victim-claim
      - id: objectives/impact/ransom/encrypt-note::files-encrypted-notice
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: metadata/file/format/threat-intelligence::ransomnotes-record-field
