# Preserve the labeled encryptor observation without attributing Hidden Tear.
# Key/mutex labels plus crypto APIs and ransom text establish extortion
# context, not lineage, valid AES parameters, or successful file encryption.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 1024
  size_max: 5242880
composite_rules:
  - id: labeled-static-key-ransom-encryptor
    desc: Ransom text with labeled static key, mutex and crypto APIs
    crit: hostile
    conf: 0.98
    attack: T1486
    all:
      - id: micro-behaviors/crypto/key/representation::hiddentears-static-key-label
      - id: micro-behaviors/process/sync/mutex::hiddentears-mutex-label
      - id: micro-behaviors/crypto/encrypt::dotnet-create-encryptor
      - id: micro-behaviors/crypto/cipher::dotnet-cryptostream
      - id: objectives/impact/ransom/encrypt/threat-text::files-encrypted-msg
