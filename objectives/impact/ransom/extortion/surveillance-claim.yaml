# Extortion scare notes ("hacker has your webcam") list live surveillance
# capabilities as status lines to frighten the reader into paying. Each
# claim alone could appear in a monitoring product's UI; several together,
# addressed at the reader as the target, are the scam.
defaults:
  platforms: [windows, unix]
  for: [text, html, markdown]
  attack: T1657
  conf: 0.9
  crit: notable

traits:
  - id: webcam-live-capture-claim
    desc: Claims reader's webcam is live
    if:
      type: text
      regex: '(?i)\b(webcam|camera).{0,40}\b(active|streaming|recording|capturing)\b|\bstreaming live\b'
  - id: microphone-listening-claim
    desc: Claims reader's microphone is listening
    if:
      type: text
      # Addressed to the reader or stated as a status; code comments about a
      # microphone session ("iOS starts recording") are not a claim.
      regex: '(?i)\b(your\s+microphone|microphone\s+is)\b.{0,40}\b(listening|recording|active|enabled)\b'
  - id: keylogger-running-claim
    desc: Claims a keylogger runs on reader's device
    if:
      type: text
      regex: '(?i)\b(keyboard|key)\s*-?\s*logger\b[^\n]{0,40}\b(running|active|enabled|installed)\b'
  - id: target-monitored-claim
    desc: Tells reader they are monitored
    if:
      type: text
      regex: '(?i)\b(target|you).{0,20}\b(is|are)\s+(currently\s+)?being\s+(monitored|watched|recorded)'
  - id: compromise-status-line-claim
    desc: Status line says device is compromised
    if:
      type: text
      regex: '(?i)\b(status:\s*infected|access level:\s*root|integrity:\s*compromised)\b'
  - id: device-hacked-sentence-claim
    desc: Says reader's device was hacked
    if:
      type: text
      regex: '(?i)\byour (device|computer|system) (has been|was) (hacked|compromised|infected)\b'

composite_rules:
  - id: device-compromise-status-claim
    desc: States reader's device is compromised
    any:
      - id: compromise-status-line-claim
      - id: device-hacked-sentence-claim
  - id: surveillance-extortion-scare-note
    desc: Note claims live webcam, microphone or keylogger surveillance of the reader
    crit: hostile
    conf: 0.95
    any:
      - id: webcam-live-capture-claim
      - id: microphone-listening-claim
      - id: keylogger-running-claim
      - id: target-monitored-claim
      - id: device-compromise-status-claim
    needs: 4

  # The "stolen data" that backs the threat is an encrypted archive whose
  # members are all empty: a prop to make the claim look real.
  - id: surveillance-scare-with-empty-encrypted-loot
    desc: Extortion note ships an encrypted archive of empty "stolen" files
    crit: hostile
    conf: 0.96
    for: [zip, 7z, rar, text]
    scope: outer
    all:
      - id: surveillance-extortion-scare-note
      - id: metadata/archive/encryption::encrypted-archive-of-empty-files
