# Extortion scare notes ("hacker has your webcam") list live surveillance
# capabilities as status lines to frighten the reader into paying. Each
# claim alone could appear in a monitoring product's UI; several together,
# addressed at the reader as the target, are the scam.
defaults:
  platforms: [windows, unix]
  for: [text, html, markdown]
  attack: T1657
  conf: 0.9
  crit: notable

traits:
  - id: webcam-live-capture-claim
    desc: Claims the reader's webcam is live or recording
    if:
      type: text
      regex: '(?i)\b(webcam|camera)\b[^\n]{0,40}\b(active|streaming|recording|capturing)\b|\bstreaming live\b'
  - id: microphone-listening-claim
    desc: Claims the reader's microphone is listening or recording
    if:
      type: text
      regex: '(?i)\bmicrophone\b[^\n]{0,40}\b(listening|recording|active|enabled)\b'
  - id: keylogger-running-claim
    desc: Claims a keylogger is running on the reader's device
    if:
      type: text
      regex: '(?i)\b(keyboard|key)\s*-?\s*logger\b[^\n]{0,40}\b(running|active|enabled|installed)\b'
  - id: target-monitored-claim
    desc: Tells the reader they are being monitored as a target
    if:
      type: text
      regex: '(?i)\b(target|you)\b[^\n]{0,20}\b(is|are)\s+(currently\s+)?being\s+(monitored|watched|recorded)\b'
  - id: device-compromise-status-claim
    desc: States the reader's device is infected or root-compromised
    if:
      type: text
      regex: '(?i)\b(status:\s*infected|access level:\s*root|integrity:\s*compromised|your (device|computer|system) (has been|was) (hacked|compromised|infected))\b'

composite_rules:
  - id: surveillance-extortion-scare-note
    desc: Note claims live webcam, microphone or keylogger surveillance of the reader
    crit: hostile
    conf: 0.95
    any:
      - id: webcam-live-capture-claim
      - id: microphone-listening-claim
      - id: keylogger-running-claim
      - id: target-monitored-claim
      - id: device-compromise-status-claim
    needs: 4

  # The "stolen data" that backs the threat is an encrypted archive whose
  # members are all empty: a prop to make the claim look real.
  - id: surveillance-scare-with-empty-encrypted-loot
    desc: Surveillance extortion note ships with an encrypted archive of empty "stolen" files
    crit: hostile
    conf: 0.96
    for: [zip, 7z, rar, text]
    scope: outer
    all:
      - id: surveillance-extortion-scare-note
      - id: metadata/archive/encryption::encrypted-archive-of-empty-files
