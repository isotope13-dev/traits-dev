defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: data-loss-and-arrest-threat
  desc: Threatens permanent data loss and arrest
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '(?i)permanent loss of.{0,40}(contents|files).{0,30}arrest'
- id: pe-camera-sextortion-threat
  desc: Recording-based sexual threat text
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: (?i)recorded.{0,80}masturbat
- id: pe-usd-extortion-demand
  desc: USD extortion payment amount
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: (?i)All you need is \$[0-9][0-9,]*\s+USD
- id: pe-bitcoin-transfer-demand
  desc: Bitcoin transfer instruction
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: (?i)Bitcoin.{0,40}transferred to my wallet address
composite_rules:
- id: pe-bitcoin-extortion-demand
  desc: Bitcoin extortion payment demand
  crit: suspicious
  conf: 0.99
  all:
  - id: pe-usd-extortion-demand
  - id: pe-bitcoin-transfer-demand
- id: pe-sextortion-payment-mailer
  desc: PE sends a direct-SMTP sextortion payment demand
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/communications/email/send/direct::pe-direct-smtp-client
  - id: pe-camera-sextortion-threat
  - id: pe-bitcoin-extortion-demand
- id: pe-sextortion-motw-removal-mailer
  desc: PE sextortion mailer removes download provenance
  crit: hostile
  conf: 0.995
  all:
  - id: micro-behaviors/communications/email/send/direct::pe-direct-smtp-client
  - id: pe-camera-sextortion-threat
  - id: pe-bitcoin-extortion-demand
  - id: objectives/evasion/indicator-removal/cleanup::pe-motw-removal
- id: pe-ransom-extortion-content
  desc: PE carries ransom or extortion message content
  crit: suspicious
  conf: 0.9
  any:
  - id: pe-bitcoin-extortion-demand
  - id: objectives/impact/ransom/encrypt/threat-text::explicit-ransom-msgs
  - id: objectives/impact/ransom/encrypt/threat-text::ransom-with-extensions
  unless:
  - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
  - id: well-known/tool/reverse-engineering/radare2::radare2-windows-release
  - id: metadata/lang/compiler/native::ocaml-native-runtime-marker
  - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
  - id: well-known/tool/detection/security-scanner::eicar-test-string-reference
  downgrade:
    scope: archive
    any:
    - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
- id: ransom-autorun-policy-references
  desc: Ransom text with autorun and policy references
  crit: suspicious
  conf: 0.98
  all:
  - id: pe-ransom-extortion-content
  - id: micro-behaviors/os/registry/keys/autostart::windows-run-key-path
  any:
  - id: micro-behaviors/os/registry/keys/policy::disable-taskmgr
  - id: micro-behaviors/os/registry/keys/policy::disable-registry-tools
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool
