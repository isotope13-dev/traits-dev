# Encoded extortion phrases can be buried in merged native string runs.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: base64-ransom-payment-phrase
  desc: Base64 text says pay the ransom
  crit: suspicious
  conf: 0.95
  if:
    type: raw
    section: .rdata
    regex: cGF5IHRoZSByYW5zb2|BheSB0aGUgcmFuc29t|wYXkgdGhlIHJhbnNvb
- id: base64-stolen-encrypted-phrase
  desc: Base64 text claims stolen and encrypted data
  crit: suspicious
  conf: 0.95
  if:
    type: raw
    section: .rdata
    regex: c3RvbGVuIGFuZCBlbmNyeXB0ZW|N0b2xlbiBhbmQgZW5jcnlwdGVk|zdG9sZW4gYW5kIGVuY3J5cHRlZ
- id: base64-ransom-publication-threat
  desc: Base64 ransom nonpayment and disclosure threat
  crit: suspicious
  conf: 0.95
  if:
    type: hex
    section: .rdata
    pattern: (5A 47 39 75 4A 33 51 67 63 47 46 35 49 48 52 6F 5A 53 42 79 59 57 35
      7A 62 32 30 73 49 48 52 6F 5A 53 42 6B 59 58 52 68 49 48 64 70 62 47 77 67 59
      6D 55 67 63 48 56 69 62 47 6C 7A 61 47 56 6B | 52 76 62 69 64 30 49 48 42 68
      65 53 42 30 61 47 55 67 63 6D 46 75 63 32 39 74 4C 43 42 30 61 47 55 67 5A 47
      46 30 59 53 42 33 61 57 78 73 49 47 4A 6C 49 48 42 31 59 6D 78 70 63 32 68 6C
      5A | 6B 62 32 34 6E 64 43 42 77 59 58 6B 67 64 47 68 6C 49 48 4A 68 62 6E 4E
      76 62 53 77 67 64 47 68 6C 49 47 52 68 64 47 45 67 64 32 6C 73 62 43 42 69 5A
      53 42 77 64 57 4A 73 61 58 4E 6F 5A 57)
composite_rules:
- id: base64-data-theft-extortion-note
  desc: Base64 ransom, encryption and disclosure threats
  crit: suspicious
  conf: 0.99
  near_bytes: 4096
  all:
  - id: base64-ransom-payment-phrase
  - id: base64-stolen-encrypted-phrase
  - id: base64-ransom-publication-threat
