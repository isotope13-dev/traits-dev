defaults:
  platforms: [windows]
  for: [data]
  crit: notable
traits:
  - id: opaque-encrypted-files-claim
    desc: Claims files are encrypted
    if:
      type: text
      regex: '(?i)files (are|have been) encrypted'
  - id: opaque-bitcoin-recovery-demand
    desc: Contains UTF-16 Bitcoin demand
    if:
      type: hex
      pattern: 6e 00 65 00 65 00 64 00 [2-80] 42 00 69 00 74 00 63 00 6f 00 69 00 6e 00
  - id: opaque-managed-encryptor
    desc: Managed encryptor method reference
    if: {type: text, exact: CreateEncryptor}
  - id: opaque-managed-file-write
    desc: Managed whole-file write reference
    if: {type: text, exact: WriteAllBytes}
  - id: opaque-managed-file-read
    desc: Managed whole-file read reference
    if: {type: text, exact: ReadAllBytes}
  - id: opaque-managed-crypto-stream
    desc: Managed cryptographic stream reference
    if: {type: text, exact: CryptoStream}
composite_rules:
  - id: opaque-managed-file-encryption-extortion
    desc: Opaque managed file crypto with encryption claim and Bitcoin demand
    crit: hostile
    attack: T1486
    all:
      - id: opaque-encrypted-files-claim
      - id: opaque-bitcoin-recovery-demand
      - id: opaque-managed-encryptor
      - id: opaque-managed-crypto-stream
      - id: opaque-managed-file-read
      - id: opaque-managed-file-write
