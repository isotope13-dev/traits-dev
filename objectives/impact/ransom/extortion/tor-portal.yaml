defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1486,T1657

traits:
  - id: tor-browser-instruction
    desc: Download and use Tor browser
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)(download|install)\s+(and\s+install\s+)?tor[- ]browser'
      exclude_html_comments: true

  - id: tor-personal-portal-link
    desc: Tor onion page for ransom recovery
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?is)tor[- ]browser\s+(page|address\s+bar)[\s\S]{0,140}\.onion'
      exclude_html_comments: true

composite_rules:
  - id: tor-ransom-extortion-portal
    desc: Ransomware directs victim to Tor portal
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/proxy/tor::onion-domain-reference
      - id: tor-personal-portal-link
    any:
      - id: tor-browser-instruction
      - id: objectives/impact/ransom/encrypt-note::files-encrypted-notice
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
