defaults:
  platforms: [windows, unix]
  for: [html, text]
  attack: T1486,T1657

traits:
  - id: data-release-nonpayment-threat
    desc: Threatens data leak if unpaid
    crit: suspicious
    conf: 0.9
    if:
      type: text
      # Notes wrap lines mid-sentence and often say "not to pay".
      regex: '(?is)not\s+(to\s+)?pay.{0,40}(release|publish|sell).{0,30}data'

  - id: confidential-data-held-threat
    desc: Claims stolen confidential data
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: '(?is)(gathered|exfiltrated|stolen).{0,30}confidential.{0,30}data'

  # Victim-facing claim fragments. Each fragment is ordinary English on
  # its own; the suspicious composites below join them by proximity, the
  # way a single short note sentence does.
  - id: your-network-scope-phrase
    desc: Second-person network or database scope phrase
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      regex: '(?i)\byour\s+(entire\s+|whole\s+)?(network|infrastructure|databases?|estate)\b'

  - id: your-system-scope-phrase
    desc: Second-person system scope phrase
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      regex: '(?i)\byour\s+((entire|whole)\s+)?systems?\b(\s+is\s+properly\s+set\s+up)?'
    not:
      # An already configured system can be followed by a separate statement
      # about the expected encrypted state of its disk.
      - regex: '(?i)\bis\s+properly\s+set\s+up$'

  - id: second-person-unbroken-status-clause
    desc: Second-person subject and status clause
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      regex: '(?i)\byour\s+[\w ,\t\r\n-]{1,38}\b(is|are|has been|have been)\s+\w+\b'

  - id: ssn-term-phrase
    desc: Social Security number term
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      regex: '(?i)\b(SSNs?|social security numbers?)\b'

  - id: data-theft-or-archive-verb-phrase
    desc: Stolen, exfiltrated, downloaded or archived verb
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      regex: '(?i)\b(stolen|exfiltrated|downloaded|archived)\b'

  - id: we-have-possession-phrase
    desc: Claims possession of victim data
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      regex: '(?i)\bwe have\b.{0,40}\b(all of )?your\s+(data|files|backups?)\b'

  - id: backups-term-phrase
    desc: Backups term
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      # The plural is the victim-facing term ("your backups"). A singular
      # "backup" matches code identifiers (e.g. a backspace variable named
      # `backup`), which is a false positive for the extortion claim.
      regex: '(?i)\bbackups\b'

  - id: your-backups-possessive-phrase
    desc: Victim-directed backups possessive phrase
    crit: component
    conf: 0.9
    for: [html, text, scripts, binaries]
    if:
      type: text
      # Double-extortion notes address the victim ("your backups"); a
      # bare "backups" also matches code identifiers such as $backups.
      regex: '(?i)\byour\s+backups?\b'

  - id: backups-stolen-or-compromised-phrase
    desc: Describes backups as stolen or compromised
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      regex: '(?i)\byour\s+backups?\b.{0,40}\b(stolen|compromised)\b'

  - id: our-demands-unmet-phrase
    desc: First-person unmet demands phrase
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      regex: '(?i)\bour demands?\b.{0,20}\bnot\s+(being\s+)?met\b'

  - id: publish-your-data-phrase
    desc: Publish or release your data phrase
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      regex: '(?i)\b(publish|leak|release|post)\b.{0,30}\byour\s+data\b'

  - id: negotiate-or-reach-out-phrase
    desc: Negotiate, reach out or contact us phrase
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      regex: '(?i)\b(negotiate|negotiating|negotiations?|reach out|contact us)\b'

composite_rules:
  # Second-person victim-facing compromise claim: a note tells the
  # victim their own network or databases are already compromised or
  # locked, in one breath.
  - id: network-compromised-victim-claim
    desc: Claims victim system or network is compromised or locked
    crit: suspicious
    conf: 0.9
    for: [html, text, scripts, binaries]
    # Keep the victim scope and compromised-state phrase in one short
    # claim; wider windows joined unrelated documentation passages.
    near_bytes: 48
    all:
      - id: metadata/lang/natural/phrasing/security::compromised-or-locked-state-phrase
      - id: second-person-unbroken-status-clause
    any:
      - id: your-network-scope-phrase
      - id: your-system-scope-phrase
    unless:
      # "if your database is compromised" is documentation prose, not a claim
      # about the victim's current state.
      - id: metadata/lang/natural/phrasing/security::if-your-compromised-clause
      # Adjacent account status and support messages supply independent legs.
      - id: well-known/app/system/samba::pam-winbind-arch-release
      - id: metadata/file/format/threat-intelligence::ransomnotes-record-field
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      # Kernel sysrq documentation: "sync(s) is great when your system is
      # locked up" describes a hung machine, not a victim being extorted.
      - id: metadata/lang/natural/phrasing/security::system-locked-up-documentation-phrase

  - id: data-published-phrase
    desc: Data published, leaked or released
    crit: component
    conf: 0.85
    for: [html, text, scripts, binaries]
    near_bytes: 64
    all:
      - id: metadata/lang/natural/vocabulary/content-word::data-word-phrase
      - id: metadata/lang/natural/vocabulary/status::published-or-released-verb

  - id: stolen-ssn-archived-claim
    desc: SSNs described as taken or archived
    # Archiving records is routine; require the extortion consumers below
    # before interpreting this wording as attack evidence.
    crit: component
    conf: 0.9
    for: [html, text, scripts, binaries]
    near_bytes: 160
    all:
      - id: ssn-term-phrase
      - id: data-theft-or-archive-verb-phrase
    unless:
      - id: metadata/file/format/threat-intelligence::ransomnotes-record-field
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: backups-possession-or-theft
    desc: Attacker possession or theft wording
    crit: component
    conf: 0.85
    for: [html, text, scripts, binaries]
    any:
      - id: we-have-possession-phrase
      - id: backups-stolen-or-compromised-phrase

  # Taking the backups as well as the data negates recovery, which is
  # the leverage double-extortion notes assert before any payment demand.
  - id: data-and-backups-taken-claim
    desc: Claims victim data and backups taken
    crit: suspicious
    conf: 0.9
    for: [html, text, scripts, binaries]
    near_bytes: 160
    all:
      - id: backups-term-phrase
      - id: backups-possession-or-theft
      - id: your-backups-possessive-phrase
    unless:
      - id: metadata/file/format/threat-intelligence::ransomnotes-record-field
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: demands-unmet-publication-threat
    desc: Threatens publication if demands unmet
    crit: suspicious
    conf: 0.88
    for: [html, text, scripts, binaries]
    near_bytes: 1024
    needs: 2
    any:
      - id: our-demands-unmet-phrase
      - id: publish-your-data-phrase
      - id: data-published-phrase
      - id: negotiate-or-reach-out-phrase
    unless:
      - id: metadata/file/format/threat-intelligence::ransomnotes-record-field
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: stolen-data-held-claim
    desc: Claims stolen victim data is held
    crit: component
    conf: 0.9
    for: [html, text, scripts, binaries]
    any:
      - id: confidential-data-held-threat
      - id: stolen-ssn-archived-claim
      - id: data-and-backups-taken-claim

  - id: data-release-threat-claim
    desc: Threatens to release victim data
    crit: component
    conf: 0.9
    for: [html, text, scripts, binaries]
    any:
      - id: data-release-nonpayment-threat
      - id: demands-unmet-publication-threat

  - id: double-extortion-data-release-threat
    desc: Threatens to leak stolen confidential data
    crit: hostile
    conf: 0.98
    for: [html, text, scripts, binaries]
    near_bytes: 8192
    all:
      - id: data-release-threat-claim
      - id: stolen-data-held-claim
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: metadata/file/format/threat-intelligence::ransomnotes-record-field
