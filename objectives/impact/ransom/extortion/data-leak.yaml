defaults:
  platforms: [windows, unix]
  for: [html, text]
  attack: T1486,T1657

traits:
  - id: data-release-nonpayment-threat
    desc: Threatens data leak if unpaid
    crit: suspicious
    conf: 0.9
    if:
      type: text
      # Notes wrap lines mid-sentence and often say "not to pay".
      regex: '(?is)not\s+(to\s+)?pay.{0,40}(release|publish|sell).{0,30}data'

  - id: confidential-data-held-threat
    desc: Claims stolen confidential data
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: '(?is)(gathered|exfiltrated|stolen).{0,30}confidential.{0,30}data'

  # Victim-facing claim fragments. Each fragment is ordinary English on
  # its own; the suspicious composites below join them by proximity, the
  # way a single short note sentence does.
  - id: your-network-scope-phrase
    desc: Second-person network or database scope phrase
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      regex: '(?i)\byour\s+(entire\s+|whole\s+)?(network|infrastructure|databases?|systems?|estate)\b'

  - id: compromised-or-locked-state-phrase
    desc: Compromised or locked state phrase
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      regex: '(?i)\b(is|are|has been|have been)\s+(compromised|locked|encrypted|breached)\b'

  - id: ssn-term-phrase
    desc: Social Security number term
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      regex: '(?i)\b(SSNs?|social security numbers?)\b'

  - id: data-theft-or-archive-verb-phrase
    desc: Stolen, exfiltrated, downloaded or archived verb
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      regex: '(?i)\b(stolen|exfiltrated|downloaded|archived)\b'

  - id: we-have-possession-phrase
    desc: First-person possession phrase
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      regex: '(?i)\bwe have\b'

  - id: backups-term-phrase
    desc: Backups term
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      # The plural is the victim-facing term ("your backups"). A singular
      # "backup" matches code identifiers (e.g. a backspace variable named
      # `backup`), which is a false positive for the extortion claim.
      regex: '(?i)\bbackups\b'

  - id: backups-stolen-or-compromised-phrase
    desc: Stolen or compromised state verb
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      regex: '(?i)\b(stolen|compromised)\b'

  - id: our-demands-unmet-phrase
    desc: First-person unmet demands phrase
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      regex: '(?i)\bour demands?\b.{0,20}\bnot\s+(being\s+)?met\b'

  - id: publish-your-data-phrase
    desc: Publish or release your data phrase
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      regex: '(?i)\b(publish|leak|release|post)\b.{0,30}\byour\s+data\b'

  - id: published-or-released-phrase
    desc: Published, leaked or released verb
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      regex: '(?i)\b(published|leaked|released|posted)\b'

  - id: negotiate-or-reach-out-phrase
    desc: Negotiate, reach out or contact us phrase
    crit: component
    for: [html, text, scripts, binaries]
    if:
      type: text
      regex: '(?i)\b(negotiate|negotiating|negotiations?|reach out|contact us)\b'

composite_rules:
  # Second-person victim-facing compromise claim: a note tells the
  # victim their own network or databases are already compromised or
  # locked, in one breath.
  - id: network-compromised-victim-claim
    desc: Claims victim network is compromised
    crit: suspicious
    conf: 0.9
    for: [html, text, scripts, binaries]
    near_bytes: 96
    all:
      - id: your-network-scope-phrase
      - id: compromised-or-locked-state-phrase
    unless:
      - id: metadata/file/format/threat-intelligence::ransomnotes-record-field
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: data-published-phrase
    desc: Data published, leaked or released
    crit: component
    conf: 0.85
    for: [html, text, scripts, binaries]
    near_bytes: 64
    all:
      - id: metadata/lang/natural/vocabulary/content-word::data-word-phrase
      - id: published-or-released-phrase

  - id: stolen-ssn-archived-claim
    desc: SSNs described as taken or archived
    crit: suspicious
    conf: 0.9
    for: [html, text, scripts, binaries]
    near_bytes: 160
    all:
      - id: ssn-term-phrase
      - id: data-theft-or-archive-verb-phrase
    unless:
      - id: metadata/file/format/threat-intelligence::ransomnotes-record-field
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: backups-possession-or-theft
    desc: Attacker possession or theft wording
    crit: component
    conf: 0.85
    for: [html, text, scripts, binaries]
    any:
      - id: we-have-possession-phrase
      - id: backups-stolen-or-compromised-phrase

  # Taking the backups as well as the data negates recovery, which is
  # the leverage double-extortion notes assert before any payment demand.
  - id: data-and-backups-taken-claim
    desc: Claims victim data and backups taken
    crit: suspicious
    conf: 0.9
    for: [html, text, scripts, binaries]
    near_bytes: 160
    all:
      - id: backups-term-phrase
      - id: backups-possession-or-theft
    unless:
      - id: metadata/file/format/threat-intelligence::ransomnotes-record-field
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: demands-unmet-publication-threat
    desc: Threatens publication if demands unmet
    crit: suspicious
    conf: 0.88
    for: [html, text, scripts, binaries]
    near_bytes: 1024
    needs: 2
    any:
      - id: our-demands-unmet-phrase
      - id: publish-your-data-phrase
      - id: data-published-phrase
      - id: negotiate-or-reach-out-phrase
    unless:
      - id: metadata/file/format/threat-intelligence::ransomnotes-record-field
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: stolen-data-held-claim
    desc: Claims stolen victim data is held
    crit: component
    conf: 0.9
    for: [html, text, scripts, binaries]
    any:
      - id: confidential-data-held-threat
      - id: stolen-ssn-archived-claim
      - id: data-and-backups-taken-claim

  - id: data-release-threat-claim
    desc: Threatens to release victim data
    crit: component
    conf: 0.9
    for: [html, text, scripts, binaries]
    any:
      - id: data-release-nonpayment-threat
      - id: demands-unmet-publication-threat

  - id: double-extortion-data-release-threat
    desc: Threatens to leak stolen confidential data
    crit: hostile
    conf: 0.98
    for: [html, text, scripts, binaries]
    near_bytes: 8192
    all:
      - id: data-release-threat-claim
      - id: stolen-data-held-claim
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: metadata/file/format/threat-intelligence::ransomnotes-record-field
