defaults:
  platforms: [windows]
  for: [pe]

traits:
  # Go's extracted text omits this long HTML template. Its bytes and the
  # neighboring batch template are readable in the PE constant section.
  - id: embedded-locked-page-title
    desc: Embedded page declares locked state
    crit: notable
    if:
      type: raw
      section: .rdata
      substr: '<title>LOCKED</title>'
  - id: embedded-bitcoin-payment-amount
    desc: Embedded page displays Bitcoin payment
    crit: notable
    if:
      type: raw
      section: .rdata
      regex: 'class="amt">[^<]{1,48} BTC</div>'
  - id: embedded-mshta-relaunch-loop
    desc: Embedded batch repeatedly launches mshta
    crit: notable
    if:
      type: raw
      section: .rdata
      regex: 'start "" mshta "[^"\r\n]{1,120}"\r?\n:loop\r?\nstart "" mshta "'

composite_rules:
  - id: embedded-mshta-payment-lockout
    desc: Embedded payment lock screen with repeated mshta launch
    crit: hostile
    conf: 0.98
    attack: T1491.001,T1218.005
    near_bytes: 8192
    all:
      - id: embedded-locked-page-title
      - id: embedded-bitcoin-payment-amount
      - id: embedded-mshta-relaunch-loop
