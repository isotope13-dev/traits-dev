# A portal embedded beside an encryption notice is negotiation evidence.
# File-writing and crypto references distinguish an executable carrying that
# material from a standalone note. This does not claim the URL is contacted.
defaults:
  for: [pe, elf]
  platforms: [windows, linux]
  attack: T1486
composite_rules:
  - id: native-onion-notice
    desc: Encryption notice beside an onion ID portal
    crit: suspicious
    near_bytes: 4096
    all:
      - id: objectives/impact/ransom/encrypt/note::files-encrypted-notice
      - id: micro-behaviors/communications/url/query/structure::onion-identifier-query
  - id: native-onion-encryption-extortion
    desc: Native encryptor with an onion ransom portal
    crit: hostile
    conf: 0.97
    all:
      - id: native-onion-notice
      - id: micro-behaviors/crypto/encrypt/reference::openssl-encrypt-update-name
    any:
      - id: micro-behaviors/fs/write/file/handle/call::write-file
      - id: micro-behaviors/fs/write/file/handle/call::write--fwrite
