defaults:
  platforms: [windows, unix]
  for: [java]

traits:
  - id: javafx-ransom-payment-demand
    desc: Java ransom text demands cryptocurrency
    crit: component
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\b(send|pay|transfer)\s+[0-9]+(\.[0-9]+)?\s+(bitcoins?|btc)\b'

  - id: java-decrypt-files-call
    desc: Java calls a file decryption method
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)decryptFiles$'

  - id: javafx-stage-import
    desc: Imports JavaFX Stage
    crit: component
    conf: 0.95
    if:
      type: symbol
      kind: import
      exact: javafx.stage.Stage

composite_rules:
  - id: javafx-ransom-payment-screen
    desc: JavaFX ransom screen demands payment and offers decryption
    crit: hostile
    conf: 0.97
    attack: T1486,T1657
    scope: file
    all:
      - id: objectives/impact/ransom/encrypt/note::files-encrypted-notice
      - id: javafx-ransom-payment-demand
      - id: java-decrypt-files-call
      - id: javafx-stage-import
