defaults:
  platforms: [unix, windows]
  for: [text]
  attack: T1486

traits:
  - id: ransom-note-files-encrypted-notice
    desc: States computer files have been encrypted
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: 'files.{0,40}have been encrypted'

  - id: ransom-note-decryption-key-custody
    desc: Claims sole possession of decryption key
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '\b(sole|only)\b(\s+\S{1,15}){0,6}\s+decryption key'

  - id: ransom-note-deadline-destruction
    desc: Threatens permanent file loss after deadline
    crit: suspicious
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: '\d+\s+(hours|days)\s+until.{0,30}files.{0,20}lost'

  - id: ransom-note-bitcoin-transfer-demand
    desc: Demands Bitcoin transfer to wallet address
    crit: suspicious
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: '(transfer|send|pay).{0,45}bitcoin.{0,30}wallet'

composite_rules:
  - id: text-ransomware-extortion-note
    desc: Plaintext ransomware note demands Bitcoin payment for decryption
    crit: hostile
    conf: 0.98
    all:
      - id: ransom-note-files-encrypted-notice
      - id: ransom-note-decryption-key-custody
    any:
      - id: ransom-note-deadline-destruction
      - id: ransom-note-bitcoin-transfer-demand
      - id: micro-behaviors/data/format/crypto-address::bech32-btc-addr-text
    needs: 2
