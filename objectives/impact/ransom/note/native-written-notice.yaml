defaults:
  platforms:
  - windows
  for:
  - c
  - cpp
traits:
- id: native-written-encryption-theft-notice
  desc: Writes file-encryption and theft notice
  crit: suspicious
  conf: 0.99
  if:
    type: symbol
    kind: call
    regex: ^WriteFile(Ex)?$
    arg:
      index: 1
      from:
        value: (?i)files.{0,80}encrypted.{0,100}stolen
