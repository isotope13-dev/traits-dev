defaults:
  platforms: [windows, unix]
  for: [pe, dll, elf, macho, text]
traits:
  - id: decryptor-released-after-payment
    desc: Decryptor release requires confirmed payment
    crit: notable
    conf: 0.99
    if:
      type: text
      case_insensitive: true
      regex: 'decryptor.{0,32}released.{0,24}payment.{0,24}confirmed'
  - id: encrypted-files-operator-private-key-notice
    desc: Encryption notice reserves operator recovery key
    crit: notable
    conf: 0.98
    if:
      # Require the file-encryption notice and exclusive operator key custody
      # in one bounded byte span; a key-management sentence alone is insufficient.
      type: yara
      source: |
        rule encrypted_files_operator_private_key_notice {
          strings:
            $notice = /(file|document)[^\x00]{0,120}encrypted[^\x00]{0,160}only the operator holds the private (key|half)/ ascii wide nocase
          condition:
            $notice
        }
