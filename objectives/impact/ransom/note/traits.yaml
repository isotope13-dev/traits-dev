defaults:
  platforms:
    - unix
    - windows
  # Ransomware markers are searched in executable and script content, where
  # they are most useful and where raw binary payload noise is bounded.
  for: [scripts, binaries]
traits:
  - id: readme-first-ransom-note
    desc: Punctuated README_FIRST ransom note filename
    crit: suspicious
    conf: 0.95
    # StormEncryptor's note is a structured basename, not prose.  Keep the
    # punctuation and the FIRST token so ordinary README files do not match;
    # the same shape remains useful when the locker is renamed or rewritten.
    for: [source, binaries]
    if:
      type: literal
      kind: string
      regex: '(?i)^!{2,}README[_-]FIRST!{2,}\.txt$'

  # CJK fonts and Big5/GBK->Unicode encoding tables contain these code points as
  # ordinary data. Require adjacent/repeated glyphs, which is the observable
  # defacement-banner form, instead of counting scattered charset-table entries.
  - id: offensive-symbol
    desc: Adjacent repeated swastika defacement glyphs
    crit: suspicious
    conf: 0.7
    if:
      type: text
      regex: '[卐卍][ \\t\\r\\n]*[卐卍][ \\t\\r\\n]*[卐卍]'
    unless:
      - type: basename
        regex: "\\.jar$"
      - id: metadata/library/structure::js-webpack-bundle
      - id: metadata/library/vscode::require-vscode
      - type: path
        regex: '(?i)([\\/]enc[\\/]trans[\\/]|[\\/]share[\\/]figlet[\\/])'
      # A squashfs Snap is a compressed container, not the text source that
      # this marker describes; scanning its raw bytes produces codec noise.
      - type: basename
        regex: '(?i)\.snap$'
  - id: ransom-deface-phrase
    desc: Ransom or defacement text phrase
    crit: suspicious
    conf: 0.7
    if:
      type: text
      # Word-bound "hackend" so identifiers like rust-analyzer's
      # FloatSplitHackends_* token names do not count as defacement copy.
      regex: "\\bhackend\\b|encrypted your files"
      case_insensitive: true
  - id: encrypted-host-data-notice
    desc: Host data encryption notice
    crit: suspicious
    conf: 0.94
    attack: T1486
    if:
      type: text
      regex: '(?i)\b(files on this host|virtual disks)\s+(are\s+)?encrypted\b'
  - id: ransomware-impact-before-label
    desc: Ransomware label follows impact language
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(?i)\b(encrypt|decrypt|bitcoin|locked)\b\s+.{0,60}\s+ransomware'
    not:
      - substr: detect ransomware
      - substr: against ransomware
      - substr: from ransomware
      - substr: anti-ransomware
      - substr: Ransomware-proof
      - substr: ransomware-proof
      - substr: ransomware proof
      - substr: potential ransomware
      - substr: suspected ransomware
      - regex: (?i)ransomware[- ]proof
    unless:
      - type: text
        regex: '\.search\(["'']ransomware["'']\)'
      - type: text
        regex: '(?i)ransomware[- ](shaped|pattern|detector)'
      - type: text
        regex: '(?i)ransomware[- ](signature|guard)'
      - type: text
        substr: Ransomware Precursor
      - type: text
        substr: Bitdefender
      - type: text
        substr: antivirus
      - type: text
        substr: anti-virus
      - type: text
        substr: CorrelationRule(
      - id: well-known/tool/detection/llm-scanner/
  - id: ransomware-label-before-impact
    desc: Ransomware label precedes impact language
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(?i)ransomware\s+.{0,60}\s+\b(encrypt|decrypt|bitcoin|locked)\b'
    not:
      - regex: '(?i)ransomware[- ](shaped|pattern|detector|signature|guard)'
    unless:
      - type: text
        regex: '\.search\(["'']ransomware["'']\)'
      - type: text
        substr: Ransomware Precursor
      - type: text
        substr: Bitdefender
      - type: text
        substr: antivirus
      - type: text
        substr: anti-virus
      - type: text
        substr: CorrelationRule(
      - id: well-known/tool/detection/llm-scanner/
  - id: ransomware-banner-core
    desc: Decrypt-for-payment ransom demand text
    crit: suspicious
    conf: 0.75
    unless:
      - id: well-known/app/finance/sidesail/
      - id: micro-behaviors/crypto/library/blockchain/
      - id: objectives/credential-access/wallet/mnemonic/
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: metadata/file/profile/identity::static-html-shell
      - id: well-known/app/utility/360-file-guard::360-file-guard-identity
      - id: well-known/app/finance/electron-cash/
    if:
      type: text
      case_insensitive: true
      regex: decrypt.{0,40}(bitcoin|ransom)
    not:
      - substr: No credential to decrypt from on pass
      - substr: paymentApplication
      - substr: decrypted data from pass
      - substr: Failed to decrypt data for pass
      - substr: decrypt from on pass
      - regex: (?i)decrypts?\s+a\s+passkey\s+wallet
      - regex: (?i)aes_decrypt|decrypt_with_iv|decrypt data using platform
      # A ransom note is prose; anti-malware/download scanners list these same
      # words inside regex-literal detection arrays (/decrypt|ransom/i,
      # /how.*decrypt/i, /ransom.*note/i). Reject spans carrying regex
      # alternation or a flagged-literal separator — never present in real notes.
      - substr: '|'
      - regex: /[gimsuy]*,
  - id: ultimatum-filename-a
    desc: Ransom note decrypt filename
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: (?i)(HOW_TO_DECRYPT|README_DECRYPT|README_LOCKED)[._-]
    unless:
      - id: well-known/tool/sysadmin/unix-benign::flipper-firmware-elf
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/app/utility/360-file-guard::360-file-guard-identity
  - id: ultimatum-filename-b
    desc: "Ransom note filename"
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)(YOUR_FILES|RECOVER_FILE|RESTORE_FILE)\.[A-Za-z0-9]{2,8}\b
    unless:
      - id: metadata/library/structure::vscode-extension-generated-asset
  - id: ultimatum-filename-c
    desc: Ransom note with ULTIMATUM keyword in filename
    crit: component
    conf: 0.88
    if:
      type: text
      word: ULTIMATUM
      case_insensitive: true
    unless:
      - id: metadata/file/catalog/identity/
      - id: metadata/package/quality/benign-context::benign-trojanized-fp-context
      - id: metadata/build/pip::python-packaging-vendored-source
      - id: well-known/lib/crypto/zxcvbn::zxcvbn-password-strength-library
  - id: btc-address-label-forward
    desc: Bitcoin address followed by payment term
    crit: suspicious
    conf: 0.85
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/harness/
      - id: well-known/tool/reverse-engineering/scylla/
      - id: micro-behaviors/crypto/library/blockchain/
    if:
      type: text
      regex: '(bitcoin|btc) address.{0,80}(ransom|decrypt)'
      case_insensitive: true
  - id: btc-address-label-reverse
    desc: Payment term followed by Bitcoin address
    crit: suspicious
    conf: 0.85
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/harness/
      - id: well-known/tool/reverse-engineering/scylla/
      - id: micro-behaviors/crypto/library/blockchain/
    if:
      type: text
      regex: '(ransom|decrypt).{0,80}(bitcoin|btc) address'
      case_insensitive: true
  - id: create-ransom-note-fn
    desc: Python function that creates a ransom note
    crit: suspicious
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: def\s+create_ransom_note
  - id: readme-locked-note
    desc: README_LOCKED ransom note
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: README_LOCKED.txt
  - id: ransom-note-filename-punctuated-readme
    desc: Punctuated README ransom-note filename
    crit: suspicious
    conf: 0.94
    for: [scripts, binaries, c, cpp, rust, go, python, powershell, javascript, typescript, csharp, java, shell, batch, pe, dll, elf, macho]
    if:
      type: text
      # A repeated-punctuation README basename is a filename artifact, not
      # ransom prose.  Keep the recovery-oriented basename vocabulary tight
      # while allowing the punctuation and separator variants used by later
      # lockers.
      regex: '(?i)!{2,}README[_-](FIRST|DECRYPT|LOCKED|RECOVER|RESTORE)!{2,}\.(txt|hta|html?)\b'

  - id: ransom-note-filename-radm-pattern
    desc: Structured R-ADM ransom-note filename
    crit: suspicious
    conf: 0.92
    for: [scripts, binaries, c, cpp, rust, go, python, powershell, javascript, typescript, csharp, java, shell, batch, pe, dll, elf, macho]
    if:
      type: text
      # Matches the structured R3ADM3.txt-style basename without tying the
      # detector to one family or one exact sample name.
      regex: '(?i)\bR[0-9]ADM[0-9]\.txt\b'
composite_rules:
  - id: ransomware-self-label
    desc: Ransomware impact or payment language
    crit: notable
    conf: 0.7
    any:
      - id: ransomware-impact-before-label
      - id: ransomware-label-before-impact
  - id: btc-address-label
    desc: Bitcoin address label in ransom text
    crit: suspicious
    conf: 0.85
    any:
      - id: btc-address-label-forward
      - id: btc-address-label-reverse
  - id: ultimatum-filename
    desc: Ransom note filename detected
    crit: suspicious
    conf: 0.85
    any:
      - id: ultimatum-filename-a
      - id: ultimatum-filename-b
      - id: ultimatum-filename-c
      - id: ransom-note-filename-punctuated-readme
      - id: ransom-note-filename-radm-pattern
    unless:
      - id: well-known/lib/crypto/zxcvbn::zxcvbn-password-strength-library
      - id: well-known/tool/sysadmin/alpine-packages::alpine-filebrowser-binary
  - id: ransomware-bitcoin-combo
    desc: Bitcoin demand with ransomware markers
    crit: suspicious
    conf: 0.85
    any:
      - id: objectives/impact/ransom/encrypt/threat-text::bitcoin-word
    all:
      - id: ransomware-self-label
    unless:
      - id: well-known/tool/detection/stng::xor-classify-corpus
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  # The keyword atoms are single English phrases held at baseline on purpose
  # ("files have been", "decrypt...files"): one of them alone appears in
  # ordinary product text, so require the extortion-demand sentence or two
  # independent phrases before calling a file a ransomware tool.
  - id: ransomware-banner-comp
    desc: Ransom-note demand text or multiple ransom phrases
    crit: suspicious
    conf: 0.8
    any:
      - id: ransomware-banner-core
      - id: multi-phrase-ransom-note-text
  # A ransom note states what happened to the victim's files AND what the
  # victim must do about it. Either half alone is ordinary product English
  # ("the following files have been modified", "decrypt the files with...").
  - id: ransom-file-scope-phrase
    desc: Ransom-note phrase describing affected files
    crit: baseline
    conf: 0.6
    any:
      - id: objectives/impact/ransom/keywords::your-files-phrase
      - id: objectives/impact/ransom/keywords::files-have-been-phrase
  - id: ransom-demand-phrase
    desc: Ransom-note phrase demanding payment or decryption
    crit: baseline
    conf: 0.6
    any:
      - id: objectives/impact/ransom/keywords::pay-bitcoin-phrase
      - id: objectives/impact/ransom/keywords::decrypt-files-phrase
  - id: multi-phrase-ransom-note-text
    desc: Ransom-note file scope paired with a demand
    crit: suspicious
    conf: 0.8
    all:
      - id: ransom-file-scope-phrase
      - id: ransom-demand-phrase
    unless:
      # TheBrainCore pairs ordinary UI copy ("{0} files have been {1}.") with
      # encrypted-thought DecryptWarning text; that is product English, not a
      # ransom note.
      - id: well-known/app/productivity/thebrain::thebrain-known-app-context
  - id: decrypt-note-cryptor-extension
    desc: Ransom decrypt-note name paired with .cryptor extension
    crit: suspicious
    conf: 0.97
    attack: T1486
    all:
      - id: ultimatum-filename-a
      - id: objectives/impact/ransom/encrypt/bytecode::cryptor-extension
