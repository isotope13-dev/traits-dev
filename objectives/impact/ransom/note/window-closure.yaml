defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: close-window-blocks-decryption-warning
    desc: Claims closing window prevents file decryption
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: "(?i)if you close this window.{0,48}(can't|cannot) decrypt your files"
