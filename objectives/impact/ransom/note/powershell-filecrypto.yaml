defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1486
  mbc: E1486
  size_min: 256
  size_max: 1048576
traits:
  - id: ps-ransom-note-write
    desc: PowerShell writes ransom note
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'Set-Content\s+-path\s+\$ransomnote'
      case_insensitive: true
  - id: ps-ransom-note-threat
    desc: PowerShell ransom threat text
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(encrypted your systems|cost you [0-9.]+BTC|leak your data)'
      case_insensitive: true
composite_rules:
  - id: ps-ransom-rename-and-note
    desc: PowerShell ransom rename and note
    crit: hostile
    conf: 0.96
    all:
      - id: ps-ransom-note-write
      - id: objectives/impact/ransom/file-operations::ps-ransom-extension-append
    any:
      - id: objectives/impact/ransom/file-operations::ps-ransom-desktop-sweep
      - id: ps-ransom-note-threat

  - id: ps-desktop-ransom-note
    desc: Desktop sweep writes a ransom note
    crit: hostile
    conf: 0.97
    all:
      - id: ps-ransom-note-write
      - id: ps-ransom-note-threat
      - id: objectives/impact/ransom/file-operations::ps-ransom-desktop-sweep

  - id: ps-desktop-ransom-rename
    desc: Desktop files renamed with ransom suffix
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/impact/ransom/file-operations::ps-ransom-rename-item-suffix
      - id: ps-ransom-note-threat
      - id: objectives/impact/ransom/file-operations::ps-ransom-desktop-sweep
