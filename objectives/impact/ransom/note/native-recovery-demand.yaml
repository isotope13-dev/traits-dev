# Victim-directed encryption plus payment-gated key delivery, independent of
# family names, wallets, contact endpoints and the chosen encryption algorithm.
defaults:
  platforms: [windows]
  for: [pe, powershell]
  crit: notable

traits:
  - id: turkish-files-encrypted-claim
    desc: Turkish claim your files were encrypted
    if:
      type: text
      case_insensitive: true
      regex: 'dosyalar[ıi]n[ıi]z.{0,32}[şs]ifrelendi'
  - id: turkish-key-after-payment
    desc: Turkish key delivery requires payment
    if:
      type: text
      case_insensitive: true
      regex: 'anahtar.{0,24}[öo]deme sonras[ıi].{0,24}teslim edilir'

composite_rules:
  - id: turkish-encryption-payment-demand
    desc: Turkish encrypted-files claim with payment-gated recovery key
    near_bytes: 240
    all:
      - id: turkish-files-encrypted-claim
      - id: turkish-key-after-payment
  - id: english-native-encryption-recovery-demand
    desc: Encrypted-files claim with recovery or payment request
    crit: component
    for: [pe, zip, tar, 7z]
    scope: archive
    all:
      - id: objectives/impact/ransom/encrypt/threat-text::ransom-note-files-encrypted-state
      - id: objectives/impact/ransom/encrypt/config::ransom-note-recovery-request
  - id: native-encryption-recovery-demand
    desc: Victim file-encryption claim and recovery demand
    crit: component
    for: [pe, zip, tar, 7z]
    scope: archive
    any:
      - id: english-native-encryption-recovery-demand
      - id: turkish-encryption-payment-demand
