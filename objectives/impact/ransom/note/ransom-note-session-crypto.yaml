defaults:
  for: [pe]
  platforms: [windows]
  attack: T1486

composite_rules:
  # The legacy ransom-note composite needs two literal phrases such as "your
  # files have been encrypted". Native lockers also embed notes that claim
  # encryption in other word orders ("encrypted all your files", "your network
  # has been encrypted"), which the structured ransom-note-text legs cover.
  - id: ransom-note-session-crypto
    desc: PE with ransom note, Session contact, and stream cipher
    crit: hostile
    conf: 0.95
    mbc: E1486
    scope: file
    all:
      - id: objectives/command-and-control/channel
      - id: micro-behaviors/crypto/symmetric
      - id: metadata/signature/absent::unsigned-missing-signature-record
    any:
      - id: objectives/impact/ransom/note::ransom-note
      - id: objectives/impact/ransom/encrypt/config::ransom-note-text
