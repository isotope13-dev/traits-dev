defaults:
  for: [c, cpp]
  platforms: [unix, windows]

traits:
  - id: encryption-payment-instructions-source
    desc: Encrypted-files claim with payment instructions
    crit: suspicious
    conf: 0.98
    if:
      type: literal
      regex: '(?i)\byour\s+(files|data)\b.{0,80}\bencrypted\b.{0,160}payment\s+instructions\b'
