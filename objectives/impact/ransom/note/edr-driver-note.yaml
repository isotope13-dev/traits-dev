# A script that names a known EDR-killer (BYOVD) driver and also carries a
# ransom-note filename pairs security-tool teardown with extortion. Each half
# is a suspicious lone clue; together they describe ransomware that blinds the
# endpoint product before dropping its note.
defaults:
  platforms: [windows]
  for: [scripts, source]
  attack: T1562.001,T1486
composite_rules:
  - id: edr-driver-with-ransom-note
    desc: EDR-killer driver reference with ransom-note filename
    crit: hostile
    conf: 0.9
    all:
      - id: objectives/impact/degrade/edr/teardown::byovd-indicators
    any:
      - id: restore-files-note-file
      - id: restore-files-note-filename-pair
      - id: readme-first-ransom-note
    unless:
      - id: well-known/tool/forensics/forensicnomicon::forensicnomicon-context
      - id: metadata/file/catalog/threat-pattern::scan-report-quoted-code
