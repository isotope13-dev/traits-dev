defaults:
  platforms: [windows]
  for: [batch, powershell]
traits:
  - id: encoded-arabic-files-encrypted-claim
    desc: Base64-encoded Arabic file-encryption claim
    crit: suspicious
    conf: 0.96
    if:
      type: encoded
      encoding: base64
      substr: كل ملفاتك بقت مشفرة
  - id: encoded-arabic-secret-key-request
    desc: Base64-encoded Arabic secret-key request
    crit: suspicious
    conf: 0.96
    if:
      type: encoded
      encoding: base64
      substr: لو عايزة المفتاح السري
