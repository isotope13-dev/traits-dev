# The victim-facing side of a file-damaging extortion script: after corrupting
# user files in place it swaps the desktop wallpaper (the usual channel for an
# image ransom notice) and drops a public key file on the Desktop for the
# victim to quote. No decryptor or payment step is required: the matched
# evidence is the corruption plus both artifacts left for the user. Seen in a
# PS1-to-EXE-packed sample that increments document bytes, downloads an imgur
# wallpaper and writes `pub.key` to the Desktop.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1486,T1491.001

composite_rules:
  - id: powershell-corruptor-wallpaper-key-drop
    desc: File corruptor leaves wallpaper and Desktop key
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/ui/wallpaper::powershell-set-wallpaper-value
      - id: micro-behaviors/crypto/key/export::powershell-public-key-desktop-file
    any:
      - id: objectives/impact/destroy/user-data::powershell-recursive-disk-byte-corruption
      - id: objectives/impact/destroy/user-data::powershell-recursive-file-prefix-corruption
