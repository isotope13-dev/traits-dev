defaults:
  platforms: [unix, windows]
  for: [scripts, source, documents]
  attack: T1486
traits:
  - id: pay-bitcoin-msg
    desc: Pay bitcoin message
    crit: suspicious
    conf: 0.7
    for: [scripts, binaries]
    if:
      type: string_literal
      substr: pay bitcoin
      case_insensitive: true
  - id: pay-btc-msg
    desc: Pay BTC message
    crit: suspicious
    conf: 0.7
    for: [scripts, binaries]
    if:
      type: string_literal
      substr: pay btc
      case_insensitive: true
  - id: decrypt-files-msg
    desc: Decrypt files message
    crit: suspicious
    conf: 0.7
    for: [scripts, binaries]
    if:
      type: string_literal
      substr: decrypt your files
      case_insensitive: true
  - id: bitcoin-wallet-msg
    desc: Bitcoin wallet payment-demand message
    crit: suspicious
    conf: 0.7
    for: [scripts, binaries]
    unless:
    - id: well-known/app/finance/sidesail/
    - id: well-known/app/finance/blockstream::blockstream-branding
    if:
      type: string_literal
      regex: '(?i)\bbitcoin\s+wallet\b.{0,60}\b(pay|ransom|decrypt)\b'
  - id: restore-files-msg
    desc: Restore files message
    crit: suspicious
    conf: 0.7
    for: [scripts, binaries]
    if:
      type: string_literal
      substr: restore your files
      case_insensitive: true
    unless:
      - id: well-known/app/publishing/wordpress-plugins/catalog::known-wordpress-plugin
  - id: send-payment-msg
    desc: Generic send payment text
    crit: notable
    conf: 0.7
    for: [scripts, binaries]
    if:
      type: string_literal
      substr: send payment
      case_insensitive: true
  - id: decrypt-readme-file
    desc: DECRYPT README note file
    crit: notable
    conf: 0.9
    for: [scripts]
    if:
      type: literal
      substr: DECRYPT_README.txt
  - id: restore-files-note-file
    desc: RESTORE_FILES ransom note file
    crit: suspicious
    conf: 0.94
    for: [scripts]
    platforms: [unix, netbsd, ios]
    if:
      type: text
      substr: RESTORE_FILES.txt
  - id: lua-files-encrypted-msg
    desc: Lua files encrypted ransom message
    crit: notable
    conf: 0.9
    for: [lua]
    if:
      type: text
      substr: your files have been encrypted
      case_insensitive: true
composite_rules:
  - id: ransom-note
    desc: Ransom note text patterns
    crit: suspicious
    conf: 0.95
    for: [scripts, binaries]
    needs: 2
    any:
      - id: objectives/impact/ransom/encrypt/threat-text::files-encrypted-msg
      - id: pay-bitcoin-msg
      - id: pay-btc-msg
      - id: decrypt-files-msg
      - id: bitcoin-wallet-msg
      - id: restore-files-msg
      - id: send-payment-msg
  - id: inplace-encrypt-ransom-note
    desc: Python Fernet ransomware with note and key stash
    crit: hostile
    conf: 0.98
    for:
      - python
    all:
      - id: objectives/impact/ransom/encrypt/filesystem::inplace-encrypt
      - id: objectives/impact/ransom/encrypt/threat-text::files-encrypted-msg
      - id: micro-behaviors/fs/file/open::python-open-key-write
