defaults:
  platforms: [windows]
  for: [pe]
  attack: T1486,T1543.003,T1027.009
  mbc: C0027

composite_rules:
  # A worm-style ransomware dropper: the payload rides as a password-protected
  # ZIP in the resource section, a Bitcoin address is hard-coded for the
  # ransom, a Windows service is created for execution and cmd.exe is used to
  # prepare the extracted files. Each part occurs in ordinary software; the
  # four together are the dropper for an unpacking, paying-victim ransom kit.
  - id: ransom-dropper-encrypted-resource-bitcoin-service
    desc: Dropper with encrypted resource ZIP, BTC address, service
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/data/embedded/payload/archive::encrypted-zip-rsrc-pe
      - id: micro-behaviors/data/format/crypto-address::hardcoded-btc-addr
      - id: micro-behaviors/os/service/create::create-service
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-command
    unless:
      - id: metadata/signed/platform/
