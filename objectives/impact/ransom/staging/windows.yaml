defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1486
traits:
  - id: ransomware-net-mode
    desc: Ransomware net mode switch
    crit: suspicious
    if:
      type: text
      regex: (?i)\s-m\s+net\b
  - id: ransom-portal-key
    desc: Ransomware portal key flag
    crit: component
    if:
      type: text
      regex: (?i)\s-k\s+[A-Za-z0-9_-]{6,}
  - id: staggered-host-launch
    desc: Host staging delay flag
    crit: component
    if:
      type: text
      regex: (?i)\s-s\s+\d+\b
  - id: sysvol-perflogs-payload
    desc: Payload staged under SYSVOL PerfLogs
    crit: notable
    conf: 0.93
    for: [batch, powershell, python, c, text]
    if:
      type: text
      regex: '(?i)SYSVOL[\\/]+PerfLogs[\\/]+[^\s\\/]{1,64}\.(exe|dll|ps1)\b'
  - id: perflogs-gogo-payload
    desc: GoGo.exe staged under PerfLogs
    crit: notable
    conf: 0.94
    for: [batch, powershell, python, c, text]
    if:
      type: text
      regex: '(?i)PerfLogs[\\/]+GoGo\.exe\b'
composite_rules:
  - id: remote-admin-share-ransomware-stage
    desc: Remote admin share ransomware staging
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/network/share::windows-admin-share-path
      - id: ransomware-net-mode
    any:
      - id: micro-behaviors/process/daemonize/spawn::batch-start-minimized
      - id: ransom-portal-key
      - id: staggered-host-launch
    needs: 2

  - id: sysvol-perflogs-gogo
    desc: Domain SYSVOL PerfLogs GoGo encryptor stage
    crit: hostile
    conf: 0.96
    for: [batch, powershell, python, c, text]
    all:
      - id: sysvol-perflogs-payload
      - id: perflogs-gogo-payload
