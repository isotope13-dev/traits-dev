defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  conf: 0.98
composite_rules:
  - id: randomized-mail-form-flood
    desc: Timed mail-form submissions with generated random sender addresses
    crit: hostile
    all:
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/communications/http/form::timer-adjacent-submit-call
      - id: micro-behaviors/communications/http/form::email-field-generator-assignment
      - id: micro-behaviors/data/string/concat::random-character-append
      - id: micro-behaviors/data/string/concat::at-sign-append
      - id: micro-behaviors/communications/http/form::mail-send-form-action
      - id: micro-behaviors/time/schedule/delay::short-string-call-timeout
