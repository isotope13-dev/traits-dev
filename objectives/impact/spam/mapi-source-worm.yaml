defaults:
  platforms: [windows]
  for: [c, cpp, html, text]
  attack: T1566.001
  crit: hostile
  conf: 0.94

composite_rules:
  - id: mapi-source-mails-dropped-copy
    desc: MAPI source mails a dropped copy
    near_bytes: 2500
    all:
      - id: micro-behaviors/communications/email/send/mapi::mapisendmail-call
      - id: micro-behaviors/fs/path/self::source-self-module-path-read
      - id: micro-behaviors/os/sysinfo/directories::windows-or-temp-directory-call
