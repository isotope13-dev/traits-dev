defaults:
  platforms: [windows, unix]
  for: [class, java_class]

composite_rules:
  - id: stolen-discord-token-friend-dm-abuse
    desc: Stolen Discord token used to enumerate friends and send DMs
    crit: hostile
    conf: 0.97
    mbc: B0039
    attack: T1566.003
    scope: file
    all:
      - id: objectives/credential-access/discord/token::java-discord-dpapi-stealer
      - id: micro-behaviors/communications/http/services/discord::user-relationships-endpoint
      - id: micro-behaviors/communications/http/services/discord::user-channels-endpoint
      - id: micro-behaviors/communications/url/resource-path/content::message-collection-route
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-bytecode
