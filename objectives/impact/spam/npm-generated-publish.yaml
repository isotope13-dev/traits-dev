defaults:
  platforms: [unix]
  for: [package.json]
composite_rules:
  # A package that rewrites its own manifest identity and version, publishes,
  # then schedules the same publication routine again is a registry
  # propagation mechanism. The ordinary npm publish and manifest edits are
  # useful release capabilities on their own; this relationship is the hostile
  # behavior.
  - id: recurring-package-identity-republication
    desc: Rewrites package identity and version in a timed publish loop
    crit: hostile
    conf: 0.98
    for: [javascript, typescript, npm]
    scope: archive
    attack: T1195.002
    all:
      - id: micro-behaviors/os/package-manager/publish::npm-publish-command
      - id: micro-behaviors/os/package-manager/publish::package-name-rewrite-before-publish
      - id: micro-behaviors/os/package-manager/publish::package-version-rewrite-before-publish
      - id: micro-behaviors/time/schedule/timeout::named-callback-timer
    near_bytes: 6000

  # npm's `private` manifest field prevents accidental publication. Removing
  # that guard immediately before a public publish, as part of a repeated
  # identity-changing publish loop, makes the release safeguard bypass itself
  # part of the propagation behavior.
  - id: republishes-after-removing-private-guard
    desc: Removes npm private guard before repeated public publishing
    crit: hostile
    conf: 0.98
    for: [javascript, typescript, npm]
    scope: archive
    attack: T1195.002
    all:
      - id: objectives/impact/spam::recurring-package-identity-republication
      - id: micro-behaviors/data/property/assign::delete-private-property
      - id: micro-behaviors/os/package-manager/publish::npm-publish-public-access-flag

  - id: install-hook-temp-manifest-and-publish
    desc: Install hook creates temp manifest and invokes npm publish
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/fs/temp/directory::npm-postinstall-temp-package-reference
      - id: micro-behaviors/fs/write/temp::postinstall-temporary-package-manifest
    any:
      - id: micro-behaviors/os/package-manager/publish::npm-printf-fragment-publish
      - id: micro-behaviors/os/package-manager/publish::postinstall-npm-publish-command

  # Automatic disposable publication is not a normal dependency-install step.
  # Keep the randomness inside postinstall's printf command, rather than
  # borrowing an OpenSSL command from an unrelated release script.
  - id: postinstall-random-disposable-package-publish
    desc: Install hook publishes random disposable packages
    crit: hostile
    conf: 0.97
    all:
      - id: install-hook-temp-manifest-and-publish
      - id: micro-behaviors/fs/delete/directory::postinstall-removes-variable-directory
      - id: micro-behaviors/fs/write/file/target::postinstall-random-name-manifest-template

