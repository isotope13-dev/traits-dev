defaults:
  platforms: [unix]
  for: [package.json]
composite_rules:
  - id: install-hook-temp-manifest-and-publish
    desc: Install hook creates temp manifest and invokes npm publish
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/fs/temp/directory::npm-postinstall-temp-package-reference
      - id: micro-behaviors/fs/write/file/target::postinstall-temporary-package-manifest
    any:
      - id: micro-behaviors/os/package-manager/publish::npm-printf-fragment-publish
      - id: micro-behaviors/os/package-manager/publish::postinstall-npm-publish-command

  # Automatic disposable publication is not a normal dependency-install step.
  # Keep the randomness inside postinstall's printf command, rather than
  # borrowing an OpenSSL command from an unrelated release script.
  - id: postinstall-random-disposable-package-publish
    desc: Install hook publishes random disposable packages
    crit: hostile
    conf: 0.97
    all:
      - id: install-hook-temp-manifest-and-publish
      - id: micro-behaviors/fs/delete/directory::postinstall-removes-variable-directory
      - id: micro-behaviors/fs/write/file/target::postinstall-random-name-manifest-template
