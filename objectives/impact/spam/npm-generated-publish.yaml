defaults:
  platforms: [unix]
  for: [package.json]
composite_rules:
  - id: install-hook-generated-package-publish
    desc: Install hook publishes a generated temporary package
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/fs/temp/directory::npm-postinstall-temp-package-reference
      - id: micro-behaviors/os/package-manager/publish::npm-printf-fragment-publish
      - id: objectives/anti-static/obfuscation/string/concat::postinstall-printf-command-word
