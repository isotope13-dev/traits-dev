defaults:
  platforms: [unix]
  for: [package.json]
composite_rules:
  - id: install-hook-temp-manifest-and-publish
    desc: Install hook creates temp manifest and invokes npm publish
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/fs/temp/directory::npm-postinstall-temp-package-reference
      - id: micro-behaviors/fs/write/file/target::postinstall-temporary-package-manifest
    any:
      - id: micro-behaviors/os/package-manager/publish::npm-printf-fragment-publish
      - id: micro-behaviors/os/package-manager/publish::postinstall-npm-publish-command
