defaults:
  platforms: [windows, unix]
  for: [html]

traits:
  - id: meta-description-ok-file-uploaded
    desc: Meta description states ok file uploaded
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<meta\s+name=["'']description["'']\s+content=["'']ok file uploaded["'']'

composite_rules:
  - id: upload-confirmation-tds-redirect
    desc: HTML upload-status stub redirects immediately to external HTTP URL
    crit: hostile
    conf: 0.92
    size_max: 2048
    all:
      - id: meta-description-ok-file-uploaded
      - id: micro-behaviors/ui/window/navigation/refresh::meta-refresh-instant-external
