# Pharma SEO spam planted as posts on a compromised blog and syndicated
# through its RSS/Atom feed. The spam kit fills each post with drug-purchase
# phrasing ("Buy X No Prescription", "Buy Generic X Online", "Cost X
# Pharmacy", "Order X Pills Online") and search bait: a fabricated review
# line at the top ("Rating 4.5 stars, based on 299 comments", marked up as
# schema.org AggregateRating so search engines show stars) or item titles
# phrased as buy-online queries. Selling a drug without a prescription is
# the rogue-pharmacy hallmark; with the search bait and another
# drug-commerce phrase in a syndicated feed it is the injected spam page
# rather than a pharmacy's or a health site's own copy. The neutral markup
# facts (rating line, titles) live with the other feed atoms.
defaults:
  platforms: [windows, unix]
  for: [xml]
  attack: T1584.006

traits:
  - id: no-prescription-purchase-phrase
    desc: Offers drug purchase without prescription
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\b(buy|order|cheapest)\b[^<>.&]{0,40}?\b(no|without)( a)? prescription\b'

  - id: drug-commerce-purchase-phrase
    desc: Purchase phrase for generic drugs or pills
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\b(buy|order|cost)\b[^<>.&]{0,40}?\b(generic|pharmacy|pills)\b'

composite_rules:
  - id: feed-pharma-seo-spam-post
    desc: Feed carries rogue-pharmacy SEO spam posts
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/data/format/xml::syndication-feed-root
      - id: micro-behaviors/data/format/xml::feed-search-bait-presentation
      - id: no-prescription-purchase-phrase
      - id: drug-commerce-purchase-phrase
