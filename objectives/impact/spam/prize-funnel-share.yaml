# Prize-scam funnel sharing. Survey-scam pages ("you won a Rolex, tell 5
# groups to claim it") turn victims into distributors: the share quota is
# the impact, and the Messenger deep-link launcher with in-app-browser
# fingerprinting is its delivery mechanism. Legitimate giveaways ask for a
# share; they do not set group quotas, and their share buttons do not sniff
# for in-app browsers to pick a share channel.
defaults:
  for: [html]
  platforms: [windows, unix]
  conf: 0.92

traits:
  - id: prize-win-claim
    desc: Page claims the visitor won a prize
    crit: notable
    if:
      type: text
      regex: '(?i)\byou\s+won\b[^<>]{0,60}\b(watch|prize|gift)\b'
      exclude_html_comments: true
  # Cash-amount twin of the claim above: survey kits promise a dollar
  # figure ("You won $ 8000") rather than naming the prize object.
  # Ordinary lottery reporting names winners, not the visitor, so the
  # second-person claim stays a notable lure marker on its own.
  - id: prize-cash-win-claim
    desc: Page claims a cash prize win
    crit: notable
    if:
      type: text
      regex: '(?i)\byou\s+won\b[^<>]{0,40}\$[\d, ]+'
      exclude_html_comments: true
  - id: prize-share-quota-gate
    desc: Share quota gates prize claim
    crit: notable
    if:
      type: text
      regex: '(?i)\b(share|tell)\b[^<>]{0,80}\b\d+\s*(groups|friends)\b'
      exclude_html_comments: true
  # Congratulations-worded twin of the win claims above: this kit family
  # opens with "Congratulations!" and promises cash ("a chance to get
  # 3000 Dollar") instead of saying "you won". Ordinary congratulations
  # pages (graduation, order confirmation) name no cash figure, so the
  # cash amount keeps this a lure marker on its own.
  - id: congratulations-cash-chance-claim
    desc: Congratulations page promises cash prize
    crit: notable
    if:
      type: text
      # The amount sits a block or two below the headline, so the window
      # crosses element boundaries; the cash figure keeps it a lure marker.
      regex: '(?i)\bcongratulations![\s\S]{0,300}\b\d[\d, ]* dollars?\b'
      exclude_html_comments: true
  - id: messenger-share-deep-link
    desc: Messenger share deep link
    crit: notable
    if:
      type: text
      substr: 'fb-messenger://share'
  - id: social-inapp-share-fingerprint
    desc: Sniffs social in-app browser tokens
    crit: notable
    if:
      type: text
      regex: 'indexOf\(\s*[''"]FB_IAB[''"]\)|indexOf\(\s*[''"]Messenger[''"]\)'

composite_rules:
  # The coercion is the conviction: a prize the visitor "won" unlocks only
  # after spamming numbered groups or friends. Ordinary "share to win"
  # promos name no quota.
  - id: coerced-prize-share-funnel
    desc: Prize gated behind quota shares
    crit: hostile
    conf: 0.93
    all:
      - id: prize-win-claim
      - id: prize-share-quota-gate
  # The launcher behind the gate: share code that fingerprints the social
  # in-app browser (FB_IAB/Messenger) to pick its share channel, sitting on
  # a prize page. Ordinary share buttons do not sniff their host app.
  - id: fingerprinted-prize-share-launcher
    desc: Sniffing share launcher on prize page
    crit: hostile
    conf: 0.9
    all:
      - id: messenger-share-deep-link
      - id: social-inapp-share-fingerprint
      - id: prize-win-claim
  # WhatsApp twin of the coerced funnel above: the cash-prize claim unlocks
  # only after spamming numbered groups or friends, and the launcher opens
  # a prefilled `whatsapp://send?text=` share sheet to distribute it.
  # Ordinary "share to win" promos name no quota and carry no deep link.
  - id: whatsapp-coerced-prize-share-funnel
    desc: Cash prize gated behind WhatsApp shares
    crit: hostile
    conf: 0.95
    all:
      - id: prize-cash-win-claim
      - id: prize-share-quota-gate
      - id: micro-behaviors/communications/messaging/send::whatsapp-send-text-deep-link
  # Congratulations-worded twin of the funnel above: same quota-gated cash
  # prize distributed through the WhatsApp share sheet, but the lure opens
  # with "Congratulations!" instead of "you won".
  - id: congratulations-cash-share-funnel
    desc: Congratulations cash gated behind WhatsApp shares
    crit: hostile
    conf: 0.95
    all:
      - id: congratulations-cash-chance-claim
      - id: prize-share-quota-gate
      - id: micro-behaviors/communications/messaging/send::whatsapp-send-text-deep-link
