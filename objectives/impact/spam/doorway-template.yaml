# Black-hat SEO doorway generators ship page templates with macro
# placeholders that the generator fills with scraped search-result text:
# the keyword in the title and heading, and a "manytext" block per search
# engine. The macros are inert braces until a generator substitutes them, so
# the template alone is suspicious, not proof of a published spam page.
defaults:
  platforms: [unix, windows]
  for: [html]
  attack: T1584.006

traits:
  - id: doorway-keyword-title-placeholder
    desc: Title is a keyword placeholder
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?is)<title>\s*\{keyword\}\s*</title>'

  - id: doorway-keyword-heading-placeholder
    desc: Heading is a keyword placeholder
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?is)<h[12]\b[^>]{0,60}>\s*\{keyword\}\s*</h[12]>'

  - id: doorway-search-text-macro
    desc: Page holds a scraped-text macro
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\{manytext(_[a-z]{3,8})?\}'

composite_rules:
  - id: doorway-page-keyword-template
    desc: Template with keyword title and scraped-text macro
    crit: suspicious
    conf: 0.9
    all:
      - id: doorway-keyword-title-placeholder
      - id: doorway-search-text-macro
