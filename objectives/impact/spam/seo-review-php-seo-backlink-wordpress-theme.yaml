defaults:
  platforms: [unix, windows]
  for: [php]
  conf: 0.9
  attack: T1584
composite_rules:
- id: php-seo-backlink-wordpress-theme
  desc: WordPress theme backlink spam loader
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/fs/read/stream::php-echo-base64-decoded-read
  - id: micro-behaviors/communications/url/path::encoded-backlink-feed-endpoint
  - id: metadata/lang/source/syntax/markup/html-links::repeated-dofollow-attribute
  - id: micro-behaviors/ui/window/render::wordpress-theme-header-hook
  any:
  - id: micro-behaviors/ui/window/style::css-offscreen-position
  - id: well-known/app/publishing/wordpress::twenty-fourteen-theme-text
