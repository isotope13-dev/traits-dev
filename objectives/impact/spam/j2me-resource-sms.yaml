defaults:
  for: [class, java_class]
  platforms: [android, windows, unix]
  attack: T1643

traits:
  - id: j2me-midlet-start-entry
    desc: Java ME MIDlet startup method
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: function
      exact: startApp

  - id: j2me-message-connection-send
    desc: Java ME sends a wireless message
    crit: notable
    conf: 0.94
    if:
      type: import
      exact: javax/wireless/messaging/MessageConnection.send

  - id: j2me-sms-send-method
    desc: Java ME defines an SMS sender
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: function
      exact: sendSMS

composite_rules:
  - id: j2me-startup-resource-sms
    desc: MIDlet sends resource-configured SMS on startup
    crit: hostile
    conf: 0.95
    all:
      - id: j2me-midlet-start-entry
      - id: j2me-message-connection-send
      - id: j2me-sms-send-method
      - id: micro-behaviors/data/embedded/payload/resource::java-class-getresourceasstream
