# Hash-busting filler in a mailed lure: the bulk mailer's random-text macro
# sits inside text drawn invisible (tiny white font). Each delivered copy gets
# different hidden words so checksum and Bayesian spam filters cannot group
# the campaign, while the reader sees only the lure. Legitimate mailing
# platforms personalize visibly; they have no reason to hide random words.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566
  mbc: B0039

composite_rules:
  - id: hidden-random-filler-in-mail
    desc: Bulk-mail random filler hidden in invisible text
    crit: hostile
    conf: 0.94
    near_bytes: 160
    all:
      - id: micro-behaviors/ui/window/style::font-tag-white-tiny-text
      - id: micro-behaviors/communications/email/content::unexpanded-random-text-macro
