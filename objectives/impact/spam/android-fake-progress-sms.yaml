# Premium-SMS "installers" (Jifake/FakeInst, 2011+). The app shows a
# download or installation progress bar and, while the bar fills, sends
# SMS to paid short codes taken from its resources; the "rules" link that
# discloses the charge is buried behind the progress screen. Code is a
# handful of classes: a ProgressDialog, a timer thread and SmsManager.
defaults:
  platforms: [android]
  attack: T1643
  crit: hostile

composite_rules:
  - id: android-progress-bar-masks-sms-sending
    desc: App fills a progress dialog on a timer while sending SMS
    for: [dex]
    conf: 0.9
    size_max: 200000
    all:
      - id: micro-behaviors/communications/messaging/send::dex-sms-send-text-call
      - id: micro-behaviors/ui/controls/progress::dex-progress-dialog-timed-advance

  - id: android-sms-sender-system-permission-shotgun
    desc: SMS-sending app requests system-only permissions it can never be granted
    for: [apk, zip, xml, dex]
    scope: outer
    conf: 0.88
    all:
      - id: metadata/permission/network::android-send-sms-request-axml
      - id: micro-behaviors/communications/messaging/send::dex-sms-send-text-call
    # Atoms rather than the grouping composite: composites matched in a
    # member file do not reach outer-scope composites.
    needs: 2
    any:
      - id: metadata/permission/management::android-system-only-install-packages-request
      - id: metadata/permission/management::android-system-only-delete-packages-request
      - id: metadata/permission/management::android-system-only-control-location-updates-request
      - id: metadata/permission/management::android-system-only-battery-stats-request
      - id: metadata/permission/management::android-system-only-change-configuration-request
      - id: metadata/permission/management::android-system-only-write-secure-settings-request
      - id: metadata/permission/management::android-system-only-mount-unmount-filesystems-request
      - id: metadata/permission/management::android-system-only-reboot-request
      - id: metadata/permission/management::android-system-only-master-clear-request
