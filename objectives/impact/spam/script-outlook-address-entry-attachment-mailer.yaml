# A script that walks Outlook address entries and, in the same routine,
# builds a mail item per entry, attaches a file and sends it. Mailing one
# attachment to every address-book entry is unsolicited bulk mail; what the
# attachment is decides whether it is also propagation (see
# objectives/lateral-movement/worm/email).
defaults:
  platforms: [windows]
  for: [vbs, text]
  attack: T1566.001

composite_rules:
  - id: script-outlook-address-entry-attachment-mailer
    desc: Mails attachments to Outlook address entries
    crit: suspicious
    conf: 0.92
    near_lines: 40
    all:
      - id: micro-behaviors/communications/email/access/mapi::wsh-outlook-address-entries
      - id: micro-behaviors/communications/email/compose/outlook::outlook-create-mailitem-text
      - id: micro-behaviors/communications/email/compose/outlook::wsh-outlook-recipient-add
      - id: micro-behaviors/data/property/access::attachments-add-member-reference
      - id: micro-behaviors/os/com/outlook::outlook-mail-send-call-wide-context
