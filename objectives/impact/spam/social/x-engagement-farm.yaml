defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  # X web-app write endpoints the extension drives with the user's session.
  # Official clients call the same paths, so these alone never convict.
  - id: x-engagement-write-endpoint
    desc: Script calls X follow/like/retweet/post API
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'friendships/create\.json|favorites/create\.json|statuses/update\.json|statuses/retweet/'

  # The CSRF token read from the logged-in session cookie, needed to replay
  # those writes without a user-visible page action.
  - id: x-session-csrf-cookie-read
    desc: Script reads the X ct0 CSRF cookie
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'document\.cookie\.match\(.{0,40}ct0='

  # A server-assigned task queue pulled and executed on the client. The
  # field name is the queue shape; the writes and the cookie replay are what
  # tie it to account automation.
  - id: remote-assigned-task-queue
    desc: Client runs server-assigned pending task queue
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: pendingTasks

composite_rules:
  # Session-riding engagement automation driven by a server task queue: the
  # operator decides which accounts follow, like, or post, and each user's
  # logged-in session performs the action. Legitimate clients have no server
  # queue telling them which accounts to follow.
  - id: x-remote-task-engagement-farm
    desc: Server-tasked X follow/like automation rides the user session
    crit: hostile
    conf: 0.95
    attack: T1078,T1531
    # Legs span the content script and the background script, so the
    # composite needs the extension container type to join them.
    for: [crx, javascript, typescript]
    scope: archive
    all:
      - id: x-engagement-write-endpoint
      - id: x-session-csrf-cookie-read
      - id: remote-assigned-task-queue
