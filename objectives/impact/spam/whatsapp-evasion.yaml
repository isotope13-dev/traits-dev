# This library combines WhatsApp message mutation with account and network
# identity rotation specifically around ban warnings. The combination supports
# evading platform anti-abuse enforcement, rather than ordinary message send.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  conf: 0.94

traits:
  - id: whatsapp-zero-width-variator-method
    desc: Message variator has zero-width insertion method
    crit: notable
    if:
      type: text
      substr: 'addZeroWidth(text)'

  - id: whatsapp-zero-width-character-selection
    desc: Randomly selects zero-width message character
    crit: notable
    if:
      type: text
      substr: 'ZERO_WIDTH[Math.floor(Math.random()'

  - id: whatsapp-synonym-message-variation
    desc: Message text is randomly replaced with synonyms
    crit: notable
    if:
      type: text
      substr: 'applySynonyms(text)'

  - id: whatsapp-random-synonym-selection
    desc: Synonym replacement uses random selection
    crit: notable
    if:
      type: text
      substr: 'Math.random() > 0.5'

  - id: whatsapp-proxy-rotation-method
    desc: WhatsApp proxy rotation helper is present
    crit: notable
    if:
      type: text
      substr: 'function proxyRotator(config)'

  - id: whatsapp-ban-warning-proxy-rotation
    desc: Proxy rotates on a WhatsApp ban warning
    crit: notable
    if:
      type: text
      regex: >-
        rotateOn\s*=\s*\['disconnect',\s*'ban-warning'\]

  - id: whatsapp-randomized-app-version
    desc: WhatsApp app version is randomized
    crit: notable
    if:
      type: text
      regex: 'randomizeAppVersion\s*=\s*true'

  - id: whatsapp-randomized-device-model
    desc: WhatsApp device model is randomized
    crit: notable
    if:
      type: text
      regex: 'randomizeDeviceModel\s*=\s*true'

  - id: whatsapp-fingerprint-applied-to-client
    desc: Fingerprint changes WhatsApp client identity
    crit: notable
    if:
      type: text
      regex: 'browser\s*=\s*\[fp\.deviceModel,\s*fp\.osVersion,\s*`WhatsApp/'

composite_rules:
  - id: whatsapp-message-filter-evasion
    desc: WhatsApp text is mutated to evade duplicate checks
    crit: hostile
    attack: T1027.013
    scope: file
    all:
      - id: whatsapp-zero-width-variator-method
      - id: whatsapp-zero-width-character-selection
      - id: whatsapp-synonym-message-variation
      - id: whatsapp-random-synonym-selection

  - id: whatsapp-ban-enforcement-evasion
    desc: WhatsApp bans trigger proxy and identity rotation
    crit: hostile
    attack: T1090.003,T1036
    scope: file
    all:
      - id: whatsapp-proxy-rotation-method
      - id: whatsapp-ban-warning-proxy-rotation
      - id: whatsapp-randomized-app-version
      - id: whatsapp-randomized-device-model
      - id: whatsapp-fingerprint-applied-to-client
