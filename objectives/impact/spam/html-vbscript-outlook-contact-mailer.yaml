defaults:
  platforms: [windows]
  for: [html, vbs]

composite_rules:
  - id: html-vbscript-outlook-contact-mailer
    desc: Script sends Outlook mail after enumerating contact email addresses
    crit: hostile
    conf: 0.95
    near_bytes: 600
    all:
      - id: micro-behaviors/os/com/outlook::outlook-contacts-folder-read
      - id: micro-behaviors/os/com/outlook::outlook-contact-email-loop
      - id: micro-behaviors/os/com/outlook::outlook-recipients-add-call
      - id: micro-behaviors/os/com/outlook::outlook-mail-send-call-wide-context
