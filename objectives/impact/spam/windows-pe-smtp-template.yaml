# A compiled Windows socket client that handles ESMTP and carries
# sender/recipient macros, an original-message insertion point, and SMTP
# retry/ban counters implements a templated bulk-mail sender. The complete
# template and delivery telemetry distinguish this from a mail client alone.
defaults:
  platforms: [windows]
  for: [pe]
  conf: 0.97

composite_rules:
  - id: pe-smtp-template-bulk-mailer
    desc: PE ESMTP socket client with bulk-mail templates and counters
    crit: hostile
    all:
      - id: micro-behaviors/communications/email/send/direct::pe-smtp-esmtp-banner
      - id: micro-behaviors/communications/socket/init::winsock-client-lifecycle
      - id: micro-behaviors/communications/email/content::pe-mail-from-macro
      - id: micro-behaviors/communications/email/content::pe-mail-to-macro
      - id: micro-behaviors/communications/email/content::pe-original-message-placeholder
      - id: micro-behaviors/communications/email/content::pe-smtp-delivery-counters
