defaults:
  for: [ne]
  platforms: [windows]
  attack: T1499

traits:
  - id: legacy-mailbomb-mailing-lists
    desc: Mailbomb tool abuses mailing list subscriptions
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule legacy_mailbomb_mailing_lists {
          strings:
            $tool = "MAILBOMB" ascii nocase
            $lists = "Mailing Lists" ascii nocase
            $event = "Mailbomber1Click" ascii nocase
            $smtp = "smtp" ascii nocase
          condition:
            uint16(0) == 0x5a4d and all of them
        }
