defaults:
  for: [html]
  platforms: [windows, unix]
  conf: 0.95
traits:
  # Recurring lures of injected pharma-spam blocks. Ordinary medical copy
  # can mention one of these, so each keyword alone is only a fragment; the
  # composites below pair families and add the concealment that makes it
  # an injection.
  - id: ed-drug-keyword
    desc: Erectile-dysfunction drug keyword
    crit: component
    if:
      type: text
      regex: '(?i)\b(cialis|viagra|levitra|vardenafil)\b'
  - id: spam-loan-keyword
    desc: Spam loan keyword
    crit: component
    if:
      type: text
      regex: '(?i)\bpayday loans?\b'
composite_rules:
  - id: pharma-spam-keyword-pair
    desc: Two pharma-spam keyword families
    crit: component
    any:
      - id: ed-drug-keyword
      - id: spam-loan-keyword
    needs: 2
  # A keyword-stuffed block that page script hides two ways (display:none
  # and visibility:hidden): the classic hacked-site pharma-spam div,
  # invisible to visitors but served to crawlers. Either concealment alone
  # is ordinary UI; beside paired spam families it is a hidden injection.
  - id: hidden-pharma-spam-injection
    desc: Concealed pharma-spam block injected in page
    crit: hostile
    conf: 0.96
    near_bytes: 8192
    all:
      - id: pharma-spam-keyword-pair
      - id: micro-behaviors/ui/window/visibility::display-none-style
      - id: micro-behaviors/ui/window/visibility::element-visibility-hidden
