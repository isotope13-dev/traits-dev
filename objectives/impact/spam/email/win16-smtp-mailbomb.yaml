defaults:
  for: [ne]
  platforms: [windows]
  attack: T1499

traits:
  - id: win16-fake-sender-prompt
    desc: Prompt asks for a fake sender address
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)fake e-?mail'

  # Several public mail relay hostnames stored in the NE image. A mail client
  # uses one server; a spam sender carries a list of relays to rotate through.
  - id: win16-hardcoded-relay-hosts
    desc: Hardcoded SMTP relay hostnames
    crit: notable
    conf: 0.9
    count_min: 3
    if:
      type: raw
      case_insensitive: true
      regex: 'mail[0-9]?\.[a-z0-9.-]{2,40}\.[a-z]{2,3}'

composite_rules:
  - id: win16-smtp-mailbomb
    desc: Win16 SMTP client prompts for a fake sender address
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/email/send/direct::win16-ne-direct-smtp-client
      - id: win16-fake-sender-prompt

  - id: win16-smtp-relay-mailer
    desc: Win16 SMTP client sends from hardcoded relay hosts
    crit: hostile
    conf: 0.93
    attack: T1566.001
    all:
      - id: micro-behaviors/communications/email/send/direct::win16-ne-direct-smtp-client
      - id: win16-hardcoded-relay-hosts
