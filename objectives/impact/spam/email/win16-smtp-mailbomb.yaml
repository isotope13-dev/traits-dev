defaults:
  for: [ne]
  platforms: [windows]
  attack: T1499

traits:
  - id: win16-fake-sender-prompt
    desc: Prompt asks for a fake sender address
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)fake e-?mail'

  # Several public mail relay hostnames stored in the NE image. A mail client
  # uses one server; a spam sender carries a list of relays to rotate through.
  - id: win16-hardcoded-relay-hosts
    desc: Hardcoded SMTP relay hostnames
    crit: notable
    conf: 0.9
    count_min: 3
    if:
      type: raw
      case_insensitive: true
      regex: 'mail[0-9]?\.[a-z0-9.-]{2,40}\.[a-z]{2,3}'

  # Mailing-list request and subscribe addresses stored in the image. A mailer
  # that floods list administrators keeps many of them as targets. Each
  # alternative is its own atom so that its count is not mixed with the other.
  - id: win16-list-request-address
    desc: Mailing-list request address list
    crit: notable
    conf: 0.9
    count_min: 2
    if:
      type: text
      regex: '(?i)[a-z0-9.-]{0,40}-request@[a-z0-9.-]{3,60}\.[a-z]{2,4}'

  - id: win16-list-subscribe-address
    desc: Mailing-list subscribe address list
    crit: notable
    conf: 0.9
    count_min: 2
    if:
      type: text
      regex: '(?i)[a-z0-9.-]{0,40}subscribe@[a-z0-9.-]{3,60}\.[a-z]{2,4}'

  - id: win16-subscribe-subject
    desc: Mail subject line requests list subscription
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)SUBJECT: ?Subscribe'

  - id: win16-bombing-counter-label
    desc: Mail bomb progress counter label
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)bombing complete|bombs:|messages left:'

  # Countdown labels for the messages still to send: a second, independent
  # counter form beside the bombing-complete label above.
  - id: win16-bomb-count-label
    desc: Mail bomb count-down label
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: 'bomb count:|count left:|number of e-mails:'

  # A victim address field and a spoofed origin host: the user names the target
  # and the host the message should appear to come from.
  - id: win16-victim-address-prompt
    desc: Prompt asks for victim and origin host
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: 'address of the victim|supposed to originate from|real ip for mail headers'

  - id: win16-mail-bomber-ui
    desc: Mail bomber window or menu label
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: 'mail &?bomber'

composite_rules:
  # Either list-address kind, each seen at least twice, counts as the list.
  - id: win16-mailing-list-request-address
    desc: Mailing-list request or subscribe address list
    crit: notable
    conf: 0.9
    any:
      - id: win16-list-request-address
      - id: win16-list-subscribe-address

  # The SMTP envelope and a countdown of messages to send: the program mails
  # the same target many times, counting the messages down as it goes.
  - id: win16-smtp-countdown-bomber
    desc: Win16 SMTP client counts down a bomb of messages
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/email/send/direct::win16-ne-direct-smtp-client
      - id: win16-bomb-count-label

  # The SMTP envelope and a list of subscription targets: the program mails
  # many list administrators, so each recipient receives a flood of requests.
  # Subject or counter text is corroboration, so one of them is required.
  - id: win16-mailing-list-bomber
    desc: Win16 SMTP client floods mailing-list subscriptions
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/email/send/direct::win16-ne-direct-smtp-client
      - id: win16-mailing-list-request-address
    needs: 1
    any:
      - id: win16-subscribe-subject
      - id: win16-bombing-counter-label

  # The SMTP verbs are typed into a telnet window with SendKeys ({ENTER}),
  # so the session needs no socket API. The sender drives a mail server with
  # keystrokes and sends each message to a recipient in turn.
  - id: win16-sendkeys-smtp-session
    desc: Win16 program types SMTP envelope commands via SendKeys
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/communications/email/send/direct::win16-ne-smtp-mail-from
      - id: micro-behaviors/communications/email/send/direct::win16-ne-smtp-rcpt-to
      - id: micro-behaviors/hardware/input/keyboard/simulate::win16-sendkeys-key-name

  - id: win16-smtp-mailbomb
    desc: Win16 SMTP client prompts for a fake sender address
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/email/send/direct::win16-ne-direct-smtp-client
      - id: win16-fake-sender-prompt

  # The SMTP client with a victim address prompt and a mail bomber window: the
  # user chooses the target and the bomber sends the messages.
  - id: win16-smtp-victim-mailbomber
    desc: Win16 SMTP client bombs a victim address from a bomber window
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/email/send/direct::win16-ne-direct-smtp-client
      - id: win16-victim-address-prompt
      - id: win16-mail-bomber-ui

  - id: win16-smtp-relay-mailer
    desc: Win16 SMTP client sends from hardcoded relay hosts
    crit: hostile
    conf: 0.93
    attack: T1566.001
    all:
      - id: micro-behaviors/communications/email/send/direct::win16-ne-direct-smtp-client
      - id: win16-hardcoded-relay-hosts
