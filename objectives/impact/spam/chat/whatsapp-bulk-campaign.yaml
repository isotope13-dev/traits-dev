# A WhatsApp Web add-on that harvests the user's contacts (or group members) and
# then sends to them, or that sends a template to each spreadsheet row with
# paced delays. The victims are third parties on the contact list, not the
# operator, so harvest-then-send is hostile. Row-indexed template sends alone
# are the normal shape of a CRM or reminder tool, so they stay suspicious.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, crx, chrome-manifest, javascript, typescript]

composite_rules:
  - id: whatsapp-contact-harvest-mass-send
    desc: Harvests WhatsApp contacts and sends messages to them
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: micro-behaviors/communications/messaging/whatsapp::wa-contact-list-harvest
      - id: micro-behaviors/communications/messaging/whatsapp::wppconnect-send-text
    any:
      - id: micro-behaviors/communications/messaging/whatsapp::wa-randomized-send-pause
      - id: micro-behaviors/communications/messaging/whatsapp::wa-group-join-by-invite
      - id: micro-behaviors/communications/messaging/whatsapp::wa-recipient-row-index
    needs: 1

  - id: whatsapp-bulk-template-campaign
    desc: Template messages sent to spreadsheet rows with paced delays
    crit: suspicious
    conf: 0.85
    scope: archive
    all:
      - id: micro-behaviors/communications/messaging/whatsapp::wa-recipient-row-index
      - id: micro-behaviors/communications/messaging/whatsapp::wppconnect-send-text
      - id: micro-behaviors/communications/messaging/whatsapp::wa-randomized-send-pause
