# Win16 AOL mass forwarder. A 16-bit program finds the AOL frame, shows a
# forwarder window that asks how many names to send to at a time, and loads a
# recipient list from a .lst or .txt file. Forwarding one mail to a list of
# screen names is unsolicited bulk mail. The frame lookup is shared with the
# harassment leaf, so the composite needs the forwarder UI as its second leg.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1566.003

traits:
  - id: aol-mass-forwarder-ui
    desc: Win16 AOL mass forwarder window text
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      substr: 'mass forwarder'

  - id: aol-forward-batch-size-prompt
    desc: Prompts for names per forwarded mail batch
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      substr: 'how many names do you want to send to'

  - id: aol-name-list-file-filter
    desc: Opens a recipient name-list file
    crit: notable
    conf: 0.88
    if:
      type: text
      case_insensitive: true
      substr: 'list|*.lst|text|*.txt'

composite_rules:
  - id: win16-aol-mass-forwarder
    desc: Win16 AOL automation forwards mail to a batch of names
    crit: hostile
    conf: 0.93
    all:
      - id: objectives/impact/ui/manipulation/harassment/chat::aol-frame-window-lookup
      - id: aol-mass-forwarder-ui
    any:
      - id: aol-forward-batch-size-prompt
      - id: aol-name-list-file-filter
    needs: 1
