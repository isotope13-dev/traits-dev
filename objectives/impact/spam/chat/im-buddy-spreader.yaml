# C source or header for an instant-messenger buddy-list spreader: it finds the
# buddy list, sends a message to each buddy window, and runs as a thread that
# repeats this. Declarations are identifier facts, so a header with no bodies
# matches. The buddy-list finder and the send helper are both required because
# either name alone appears in ordinary IM client tooling.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1566

traits:
  - id: im-buddy-list-finder-prototype
    desc: Declares IM buddy-list window finder
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: identifier
      exact: FindBuddyList

  - id: im-send-message-prototype
    desc: Declares instant message send helper
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: identifier
      exact: SendIM

  - id: im-send-all-buddies-prototype
    desc: Declares IM send to all buddies
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: identifier
      regex: '^IMAll(Windows)?$'

  - id: im-spread-thread-prototype
    desc: Declares IM spread worker thread
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: identifier
      regex: '^(AIM|IM)Spread$'

  - id: msn-messenger-enumerator-prototype
    desc: Declares MSN Messenger window enumerator
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: identifier
      exact: EnumMSNGRS

composite_rules:
  - id: im-buddy-list-spreader
    desc: IM spreader finds buddy list and sends to every buddy
    crit: hostile
    conf: 0.95
    all:
      - id: im-buddy-list-finder-prototype
      - id: im-send-message-prototype
    any:
      - id: im-send-all-buddies-prototype
      - id: im-spread-thread-prototype
      - id: msn-messenger-enumerator-prototype
    needs: 1
