# Win16 AOL client automation that sends instant messages. A 16-bit program
# finds the AOL frame, opens the Send Instant Message composer, fills the
# AOL edit control, and presses keys through VB3 SendKeys. The frame lookup
# is shared with the harassment leaf, and the keystroke leaf is shared with
# the Win16 chat flood rule. The message body is not required, so the rule
# covers unsolicited IM delivery whatever text it carries.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1566.003

traits:
  - id: aol-im-compose-menu
    desc: Win16 opens AOL instant message composer
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: 'send (an )?instant message'

  - id: aol-edit-control-class
    desc: Win16 program targets an AOL edit control
    crit: notable
    conf: 0.85
    if:
      type: text
      case_insensitive: true
      substr: _AOL_EDIT

  - id: aol-compose-mail-menu
    desc: Win16 opens AOL Compose Mail window
    crit: notable
    conf: 0.85
    if:
      type: text
      case_insensitive: true
      substr: Compose Mail

  - id: aol-attach-file-menu
    desc: AOL mail Attach File command
    crit: notable
    conf: 0.85
    if:
      type: text
      case_insensitive: true
      substr: Attach File

  # AOL 3.0 keeps its screen-name and mail index under \idb. A Win16 mailer
  # that opens this index reads the contact list it sends to.
  - id: aol-idb-index-path
    desc: Opens the AOL idb main.idx index file
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      substr: '\idb\main.idx'

  # "Mass Mailer" is the window title of Win16 AOL mail flooders.
  - id: aol-mail-bomb-ui
    desc: AOL mail bomber UI prompt text
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '(mail bombed with|times to send mail:|mass mailer)'

composite_rules:
  - id: win16-aol-im-sender
    desc: Win16 AOL automation sends instant messages from the IM composer
    crit: hostile
    conf: 0.93
    all:
      - id: aol-im-compose-menu
      - id: objectives/impact/ui/manipulation/harassment/chat::aol-frame-window-lookup
    any:
      - id: micro-behaviors/hardware/input/keyboard/simulate::win16-sendkeys-key-name
      - id: aol-edit-control-class
    needs: 1

  - id: win16-aol-mail-attachment-prep
    desc: Win16 AOL automation composes mail with a file attachment
    crit: suspicious
    conf: 0.85
    all:
      - id: aol-compose-mail-menu
      - id: aol-attach-file-menu
      - id: objectives/impact/ui/manipulation/harassment/chat::aol-frame-window-lookup

  - id: win16-aol-index-mail-harvest
    desc: Win16 AOL automation reads contact index and composes mail
    crit: hostile
    conf: 0.93
    all:
      - id: aol-idb-index-path
      - id: aol-compose-mail-menu
      - id: objectives/impact/ui/manipulation/harassment/chat::aol-frame-window-lookup

  - id: win16-aol-mail-bomber
    desc: Win16 AOL automation sends bulk mail bombs
    crit: hostile
    conf: 0.93
    all:
      - id: aol-mail-bomb-ui
      - id: objectives/impact/ui/manipulation/harassment/chat::aol-any-window-lookup
