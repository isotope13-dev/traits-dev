# Win16 AOL client automation that sends instant messages. A 16-bit program
# finds the AOL frame, opens the Send Instant Message composer, fills the
# AOL edit control, and presses keys through VB3 SendKeys. The frame lookup
# is shared with the harassment leaf, and the keystroke leaf is shared with
# the Win16 chat flood rule. The message body is not required, so the rule
# covers unsolicited IM delivery whatever text it carries.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1566.003

traits:
  - id: aol-im-compose-menu
    desc: Win16 opens AOL instant message composer
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: 'send (an )?instant message'

  - id: aol-edit-control-class
    desc: Win16 program targets an AOL edit control
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: _AOL_EDIT

composite_rules:
  - id: win16-aol-im-sender
    desc: Win16 AOL automation sends instant messages with keystrokes
    crit: hostile
    conf: 0.93
    all:
      - id: aol-im-compose-menu
      - id: objectives/impact/ui/manipulation/harassment/chat::aol-frame-window-lookup
    any:
      - id: micro-behaviors/hardware/input/keyboard/simulate::win16-sendkeys-key-name
      - id: aol-edit-control-class
    needs: 1
