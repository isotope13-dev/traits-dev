# Win16 AOL invitation bomber. The program finds the AOL frame and labels its
# chat-room invitation flood as an invitation bomb. The label alone is weak
# text, so the composite also needs the AOL frame lookup, which is shared with
# the harassment leaf. Unsolicited room invitations are spam, not a request
# for consent, so the composite is hostile.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1566.003

traits:
  - id: aol-invitation-bomb-text
    desc: Win16 AOL invitation bomb label text
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      substr: 'invitation bomb'

composite_rules:
  - id: win16-aol-invitation-bomber
    desc: Win16 AOL automation sends chat invitation bombs
    crit: hostile
    conf: 0.93
    all:
      - id: aol-invitation-bomb-text
      - id: objectives/impact/ui/manipulation/harassment/chat::aol-frame-window-lookup
