# A bot's ad rotation kept as numbered INI lines: each value pairs an adult
# keyword with a link. One such line is a bookmark; a list of five or more is
# the message pool a chat spambot picks from. Each keyword counts on its own
# so a repeated keyword cannot be mistaken for a mixed list, and the link is
# recognised by its domain-shaped token rather than a scheme alternation.
defaults:
  platforms: [windows]
  for: [text]
traits:
  - id: ini-numbered-sex-promo-lines
    desc: INI numbered sex promo links
    crit: notable
    conf: 0.85
    count_min: 5
    if:
      type: text
      regex: '(?im)^\d{1,2}=.{0,120}\bsex\b.{0,120}[a-z0-9]\.[a-z]{2,4}\b'

  - id: ini-numbered-porn-promo-lines
    desc: INI numbered porn promo links
    crit: notable
    conf: 0.85
    count_min: 5
    if:
      type: text
      regex: '(?im)^\d{1,2}=.{0,120}\bporn\b.{0,120}[a-z0-9]\.[a-z]{2,4}\b'

  - id: ini-numbered-xxx-promo-lines
    desc: INI numbered xxx promo links
    crit: notable
    conf: 0.85
    count_min: 5
    if:
      type: text
      regex: '(?im)^\d{1,2}=.{0,120}\bxxx\b.{0,120}[a-z0-9]\.[a-z]{2,4}\b'

composite_rules:
  - id: ini-numbered-adult-promo-lines
    desc: INI lists numbered adult promo links
    crit: notable
    conf: 0.85
    any:
      - id: ini-numbered-sex-promo-lines
      - id: ini-numbered-porn-promo-lines
      - id: ini-numbered-xxx-promo-lines
