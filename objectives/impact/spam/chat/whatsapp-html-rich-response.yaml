# A WhatsApp client helper that sends raw HTML through the rich-response
# primitive. The recipient's client renders the markup, so any client that
# exposes this helper can put attacker-authored content into a victim's chat
# without a trusted source. Either leg alone is ordinary bot output; together
# in one file they are the delivery path for HTML lures into chats.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: whatsapp-html-rich-response-delivery
    desc: Sends raw HTML to chat recipients as bot rich response
    crit: suspicious
    conf: 0.85
    scope: file
    all:
      - id: micro-behaviors/communications/messaging/whatsapp::whatsapp-html-rich-response-primitive
      - id: micro-behaviors/communications/messaging/whatsapp::whatsapp-rich-response-message-key
