defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: python-range-repeat-loop
    desc: Python repeats work over a range
    crit: component
    if:
      type: text
      regex: 'for\s+\w+\s+in\s+range\s*\(\s*\w+\s*\)'

  - id: pyautogui-enter-submit
    desc: Submits text with pyautogui Enter
    crit: component
    if:
      type: symbol
      kind: call
      regex: '^(pyautogui|pya)\.press$'
      arg:
        index: 0
        exact: enter

composite_rules:
  - id: hotkey-gated-ui-text-spam
    desc: Hotkey-gated repeated text submission through UI
    crit: hostile
    conf: 0.94
    near_lines: 20
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::keyboard-is-pressed-poll
      - id: micro-behaviors/hardware/input/keyboard/simulate::pyautogui-keyboard-output
      - id: python-range-repeat-loop
      - id: pyautogui-enter-submit
