defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1499.003

traits:
- id: python-sms-bombing-phone-target
  desc: Python targets an entered phone number
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: '\+88.{0,80}number'
- id: python-repeats-http-request-by-amount
  desc: Python repeats an HTTP request by amount
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: 'while\s+i\s*<\s*amount[\s\S]{0,900}requests\.(post|get)\s*\('
- id: python-sms-otp-request-endpoint
  desc: Python references SMS or OTP endpoints
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: '(?i)(/otp[-_/]|send_user_otp|phone_number_login|lsotprequest)'

composite_rules:
- id: python-repeated-sms-otp-bomb
  desc: Repeatedly sends OTP requests to a phone target
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: python-sms-bombing-phone-target
  - id: python-repeats-http-request-by-amount
  - id: python-sms-otp-request-endpoint
  - id: micro-behaviors/communications/http/post::requests-post
