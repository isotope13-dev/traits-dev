defaults:
  for: [python]
  platforms: [linux, macos, windows]
composite_rules:
  - id: python-key-update-large-loop
    desc: TLS KeyUpdate call beside a large range loop
    crit: suspicious
    conf: 0.95
    near_lines: 4
    all:
      - id: micro-behaviors/communications/tls/handshake::python-openssl-request-key-update
      - id: micro-behaviors/data/control-flow/loop/counted::python-range-loop-large-bound
