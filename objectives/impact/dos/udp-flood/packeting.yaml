# Tiny "packeting" flooders take a host plus any open port and print a
# Packeting host:port status line.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1498.001
  mbc: B0042

traits:
  - id: packeting-host-port
    desc: Packeting host-port status banner
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'Packeting %s:%d'
  - id: host-any-open-port
    desc: Usage takes host and open port
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: 'host any_open_port'
  - id: unknown-host-banner
    desc: Unknown-host flooder error banner
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: 'Unknown host: %s'

composite_rules:
  - id: packeting-open-port-flooder
    desc: Packeting banner with open-port usage
    crit: hostile
    conf: 0.97
    all:
      - id: packeting-host-port
      - id: host-any-open-port
  - id: packeting-unknown-host
    desc: Packeting banner with unknown-host
    crit: hostile
    conf: 0.95
    all:
      - id: packeting-host-port
      - id: unknown-host-banner
  - id: open-port-unknown-host
    desc: Open-port usage with unknown-host
    crit: hostile
    conf: 0.93
    all:
      - id: host-any-open-port
      - id: unknown-host-banner
