# Beer.c-style TCP connect flooders take a host and iteration count.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1498.001
  mbc: B0042

traits:
  - id: beer-c-banner
    desc: Names a beer.c flooder
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: beer.c
  - id: host-times-usage
    desc: Usage takes host and times
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'Usage: %s <host> <times>'
  - id: vt-bx-flood-edit
    desc: Edited for VT/bx flood use
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'made for use with VT/bx'

composite_rules:
  - id: beer-host-times-flooder
    desc: beer.c banner with host-times usage
    crit: hostile
    conf: 0.97
    all:
      - id: beer-c-banner
      - id: host-times-usage
  - id: beer-vt-bx-flooder
    desc: beer.c banner edited for VT/bx
    crit: hostile
    conf: 0.96
    all:
      - id: beer-c-banner
      - id: vt-bx-flood-edit
  - id: vt-bx-host-times-flooder
    desc: VT/bx edit with host-times usage
    crit: hostile
    conf: 0.94
    all:
      - id: vt-bx-flood-edit
      - id: host-times-usage
