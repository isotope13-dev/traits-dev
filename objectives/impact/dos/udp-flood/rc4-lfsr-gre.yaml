defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86]
composite_rules:
  # Recovered configuration is an encrypted Mirai-style table. The GRE header
  # constructor and target-send iteration are in the same attack routine.

  - id: rc4-lfsr-gre-packet-flood
    desc: GRE packet flood with encrypted configuration
    crit: hostile
    conf: 0.98
    attack: T1498.001
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::rc4-lfsr-byte-transform
      - id: micro-behaviors/communications/ip/construct::x86-gre-inner-udp-headers
      - id: micro-behaviors/communications/flood::x86-target-packet-send-loop
