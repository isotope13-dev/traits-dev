# Small raw-socket crashers take target/port/source or ip-addr/port and
# fail closed on TCP socket setup.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1498.001
  mbc: B0042

traits:
  - id: target-port-source-usage
    desc: Usage takes target port and source
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'Usage: %s target [port [source]]'
  - id: raw-socket-perror
    desc: Raw-socket creation error banner
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'socket (raw)'
  - id: ip-addr-port-usage
    desc: Usage takes IP address and port
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'Usage: %s ip-addr port'
  - id: unable-tcp-socket
    desc: Unable to create TCP socket
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: 'Unable to create TCP socket'
  - id: cant-connect-host-port
    desc: Cannot connect to host port
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "Can't connect to %.80s,%d"
  - id: unknown-host-fmt
    desc: Unknown-host format error banner
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: 'Unknown host %s'

composite_rules:
  - id: raw-target-port-flooder
    desc: Raw socket with target-port usage
    crit: hostile
    conf: 0.95
    all:
      - id: target-port-source-usage
      - id: raw-socket-perror
  - id: raw-target-unknown-host
    desc: Target-port usage with unknown host
    crit: hostile
    conf: 0.93
    all:
      - id: target-port-source-usage
      - id: unknown-host-fmt
  - id: raw-socket-unknown-host
    desc: Raw socket with unknown-host error
    crit: hostile
    conf: 0.92
    all:
      - id: raw-socket-perror
      - id: unknown-host-fmt
  - id: tcp-socket-ip-port-poc
    desc: TCP-socket error with ip-port usage
    crit: hostile
    conf: 0.96
    all:
      - id: unable-tcp-socket
      - id: ip-addr-port-usage
  - id: tcp-socket-connect-fail
    desc: TCP-socket error with connect fail
    crit: hostile
    conf: 0.95
    all:
      - id: unable-tcp-socket
      - id: cant-connect-host-port
  - id: ip-port-connect-fail
    desc: IP-port usage with connect fail
    crit: hostile
    conf: 0.94
    all:
      - id: ip-addr-port-usage
      - id: cant-connect-host-port
