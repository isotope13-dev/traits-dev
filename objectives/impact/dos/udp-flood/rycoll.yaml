# Rythem Collision UDP flooders take from/to hosts and a packet count
# while forcing IP_HDRINCL on a raw socket.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1498.001
  mbc: B0042

traits:
  - id: rythem-collision-banner
    desc: Rythem Collision flooder banner
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: 'Rythem Collision'
  - id: rc-from-to-usage
    desc: Usage takes from and to hosts
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'usage: rc <from host> <to host>'
  - id: source-hostname-must-real
    desc: Source hostname must be real
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: 'source hostname _must_ be real'

composite_rules:
  - id: rycoll-from-to-flooder
    desc: Rythem Collision with from-to usage
    crit: hostile
    conf: 0.98
    all:
      - id: rythem-collision-banner
      - id: rc-from-to-usage
  - id: rycoll-real-source
    desc: Rythem Collision requires real source
    crit: hostile
    conf: 0.96
    all:
      - id: rythem-collision-banner
      - id: source-hostname-must-real
  - id: rc-from-to-real-source
    desc: From-to usage requires real source
    crit: hostile
    conf: 0.95
    all:
      - id: rc-from-to-usage
      - id: source-hostname-must-real
