defaults:
  platforms: [unix]
  for: [elf]
  attack: T1498.001
  mbc: B0033
traits:
  - id: udp-flood-psize-param
    desc: UDP flood payload-size parameter
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\bpsize=[^=]'
  - id: udp-flood-srcport-param
    desc: UDP flood source-port parameter
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\bsrcport=[^=]'
  - id: udp-flood-proto-param
    desc: UDP flood protocol parameter
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\bproto=[^=]'
  - id: udp-flood-payload-param
    desc: UDP flood payload-bytes parameter
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\bpayload=[^=]'
  - id: udp-flood-gport-param
    desc: Generation-port parameter token
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\bgport=[^=]'
composite_rules:
  - id: configurable-udp-flood-params
    desc: Co-occurring operator-tunable UDP flood parameter tokens
    crit: component
    conf: 0.92
    near_bytes: 2048
    needs: 3
    any:
      - id: udp-flood-gport-param
      - id: udp-flood-payload-param
      - id: udp-flood-proto-param
      - id: udp-flood-psize-param
      - id: udp-flood-srcport-param

  - id: configurable-udp-flood
    desc: Operator-tunable UDP flood interface
    crit: hostile
    conf: 0.96
    # Mirai-style attack-vector dispatcher exposes per-attack tunables
    # for packet size, source port, transport, payload bytes, and
    # generation port. Three of five together in attack option parsing
    # is a near-deterministic signal of an embedded UDP flooder when paired
    # with socket output.
    all:
      - id: micro-behaviors/communications/socket/send/reference::send
      - id: configurable-udp-flood-params


