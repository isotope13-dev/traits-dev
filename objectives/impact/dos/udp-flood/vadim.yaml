# Vadim UDP spoofers take host, port, and a spoofed unused IP.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1498.001
  mbc: B0042

traits:
  - id: slashing-vadims-banner
    desc: Slashing-Vadims spoof flood banner
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: 'Slashing your angry Vadims'
  - id: host-port-spoof-usage
    desc: Usage takes host port and spoof
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'Syntax: %s <host> <port> <spoof>'
  - id: unused-ip-spoof-help
    desc: Spoof help names unused IP
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: 'any real, unused ip'

composite_rules:
  - id: vadim-host-spoof-flooder
    desc: Vadim banner with host-spoof usage
    crit: hostile
    conf: 0.98
    all:
      - id: slashing-vadims-banner
      - id: host-port-spoof-usage
  - id: vadim-unused-ip
    desc: Vadim banner with unused-IP help
    crit: hostile
    conf: 0.96
    all:
      - id: slashing-vadims-banner
      - id: unused-ip-spoof-help
  - id: host-spoof-unused-ip
    desc: Host-spoof usage with unused IP
    crit: hostile
    conf: 0.95
    all:
      - id: host-port-spoof-usage
      - id: unused-ip-spoof-help
