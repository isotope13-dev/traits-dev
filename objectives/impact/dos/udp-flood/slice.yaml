# Slice-style port-range flooders take src/dst addresses and a low/high
# port window, optionally randomizing the source.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1498.001
  mbc: B0042

traits:
  - id: src-dst-low-high-usage
    desc: Usage takes src dst and port range
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'Usage: %s srcaddr dstaddr low high'
  - id: random-srcaddr-zero
    desc: Zero srcaddr picks random addresses
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'If srcaddr is 0, random addresses'
  - id: high-port-gt-low
    desc: High port must exceed low port
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'High port must be greater than Low port'

composite_rules:
  - id: slice-src-dst-random
    desc: Src-dst usage with random source
    crit: hostile
    conf: 0.97
    all:
      - id: src-dst-low-high-usage
      - id: random-srcaddr-zero
  - id: slice-src-dst-port-order
    desc: Src-dst usage with port-order check
    crit: hostile
    conf: 0.95
    all:
      - id: src-dst-low-high-usage
      - id: high-port-gt-low
  - id: slice-random-port-order
    desc: Random source with port-order check
    crit: hostile
    conf: 0.94
    all:
      - id: random-srcaddr-zero
      - id: high-port-gt-low
