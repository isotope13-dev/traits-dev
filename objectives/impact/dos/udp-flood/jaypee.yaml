    desc: Massive anal-rape flooder banner
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: 'SendinG MaSsivE AnAl Rape'
  - id: jaypee-usage
    desc: Jaypee anus-to-penetrate usage
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'Usage: ./jaypee'
  - id: analing-target-crash
    desc: Analing target-crash status banner
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'Analing jay pee target crash'

composite_rules:
