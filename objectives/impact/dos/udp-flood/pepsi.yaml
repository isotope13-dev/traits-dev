# Pepsi-style UDP flooders take a packet count, payload size, and
# destination port rather than an ICMP echo schema.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1498.001
  mbc: B0042

traits:
  - id: udp-packet-count-usage
    desc: Usage takes UDP packet count
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)number of UDP packets to send'
  - id: dest-port-default-usage
    desc: Usage takes a default dest port
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)Destination Port.{0,24}Default'
  - id: pepsi-flooder-banner
    desc: Names a Pepsi UDP flooder
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Pepsi\.c'

composite_rules:
  - id: pepsi-udp-packet-count
    desc: Pepsi banner with UDP packet count
    crit: hostile
    conf: 0.97
    all:
      - id: pepsi-flooder-banner
      - id: udp-packet-count-usage
  - id: pepsi-dest-port-flooder
    desc: Pepsi banner with dest-port usage
    crit: hostile
    conf: 0.95
    all:
      - id: pepsi-flooder-banner
      - id: dest-port-default-usage
  - id: udp-count-dest-port-flooder
    desc: UDP packet-count with dest-port usage
    crit: hostile
    conf: 0.94
    all:
      - id: udp-packet-count-usage
      - id: dest-port-default-usage
