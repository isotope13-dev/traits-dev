# An independent raw-packet routine can survive a disabled connected-UDP loop.
# Keep that distinction visible rather than relaxing either send binding.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
composite_rules:
  - id: hidden-credential-raw-udp-flood-code
    desc: Raw UDP flood code with credential scanner
    crit: hostile
    conf: 0.99
    attack: T1498.001
    mbc: B0042
    all:
      - id: micro-behaviors/communications/flood::x64-bound-raw-udp-target-loop
      - id: objectives/lateral-movement/brute-force/iot-creds::x64-hidden-telnet-credential-scanner
