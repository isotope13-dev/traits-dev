# Retained flood code remains observable when a receive syscall is
# corrupted. This makes no claim that remote tasks can reach the loop.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
composite_rules:
  - id: hidden-credential-udp-flood-code
    desc: UDP flood loop with hidden IoT credentials
    crit: hostile
    conf: 0.98
    attack: T1498.001
    all:
      - id: micro-behaviors/communications/flood::x86-64-udp-flood-send-loop
      - id: objectives/lateral-movement/brute-force/iot-creds::x64-hidden-telnet-credential-scanner
