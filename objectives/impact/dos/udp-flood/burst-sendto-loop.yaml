# Static x86-64 UDP flooders that fill a stack buffer with repeated ASCII 'A'
# qwords via rep stosq and loop endlessly sending bursts of 1200-byte UDP
# datagrams via sendto() separated by short microsecond sleeps.
defaults:
  platforms: [unix]
  for: [elf]
  arch: [x86-64]
  attack: T1498.001
  mbc: B0042

traits:
  - id: x64-ascii-a-buffer-fill-1200
    desc: Fills 1200-byte buffer with ASCII A
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: "B9 96 00 00 00 49 89 E5 48 B8 41 41 41 41 41 41 41 41 4C 89 E7 F3 48 AB"

  - id: x64-udp-sendto-burst-usleep-loop
    desc: Loop sends UDP bursts with sleeps
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: "BB 50 00 00 00 [0-8] 31 C9 41 B9 10 00 00 00 4D 89 E8 BA B0 04 00 00 4C 89 E6 89 EF E8 ?? ?? ?? ?? 83 EB 01 75 E1 BF 20 03 00 00 E8 ?? ?? ?? ?? EB CD"

composite_rules:
  - id: x64-static-udp-burst-packet-flooder
    desc: x86-64 ELF fills a 1200-byte buffer with 'A' and sends continuous UDP bursts
    crit: hostile
    conf: 0.99
    all:
      - id: x64-ascii-a-buffer-fill-1200
      - id: x64-udp-sendto-burst-usleep-loop
      - id: micro-behaviors/communications/socket/send/reference::sendto-symbol
