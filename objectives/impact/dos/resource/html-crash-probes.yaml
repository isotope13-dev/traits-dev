defaults:
  for: [html]
  platforms: [windows]
  conf: 0.99
traits:
  - id: repeated-con-device-image-probes
    desc: Repeated images target nested CON devices
    crit: suspicious
    count_min: 3
    if:
      type: text
      regex: '(?i)<img\s+src=["'']file://[a-z]:/con/con(/con)*["'']'
      exclude_html_comments: true
  - id: javascript-uri-endless-document-write
    desc: JavaScript URI endless document-write loop
    crit: suspicious
    if:
      type: text
      regex: 'JavaScript:while\(1\)\{\s*document\.write\([''"].{0,12}[''"]\);\}'
      exclude_html_comments: true
composite_rules:
  - id: browser-device-crash-and-document-exhaustion
    desc: Browser page combines device crash probes and endless DOM growth
    crit: hostile
    conf: 0.99
    all:
      - id: repeated-con-device-image-probes
      - id: javascript-uri-endless-document-write
