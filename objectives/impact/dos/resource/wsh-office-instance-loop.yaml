# An unconditional VBScript Do...Loop whose body instantiates an Office
# automation server: each iteration starts another Word/Excel process and
# none is released, exhausting memory. Retry loops that create the object
# once leave with Exit Do or test a Loop Until/While condition.
defaults:
  platforms: [windows]
  for: [vbs, html]
  attack: T1499

traits:
  - id: vbs-office-automation-spawn-loop
    desc: Unbounded loop starts Office automation servers
    crit: hostile
    conf: 0.93
    if:
      type: text
      regex: '(?is)\bDo\s*\n.{0,80}Object\("(Word|Excel|PowerPoint)\.Application"\).{0,60}\n\s*Loop\s*\n'
    not:
      - regex: '(?i)\bExit\s+Do\b'
