defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - html
  crit: suspicious
  conf: 0.95
  attack: T1499
traits:
- id: loop-appends-string-literal
  desc: Infinite while loop appends a string literal
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: 'while\s*\(1\)\{\s*\w+\s*\+=\s*("[^"]{1,32}"|''[^'']{1,32}'')\s*;?\s*\}'
- id: unguarded-js-tail-recursion
  desc: Unconditional direct tail self-call
  if:
    type: tree-sitter
    language: javascript
    # Anchor at the first body statement as well as the last. Otherwise the
    # query can skip base-case returns and declarations and match only the
    # final expression-statement suffix of an ordinary tree traversal.
    # Keep the single-statement case explicit: the engine's tree-sitter
    # cursor can miss the zero-repetition case between adjacent anchors.
    query: |
      ((function_declaration
        name: (identifier) @fn
        body: (statement_block .
          (expression_statement
            (call_expression function: (identifier) @callee)) .))
        (#eq? @fn @callee)) @recursive
      ((function_declaration
        name: (identifier) @fn
        body: (statement_block .
          (expression_statement)+ .
          (expression_statement
            (call_expression function: (identifier) @callee)) .))
        (#eq? @fn @callee)) @recursive
  unless:
  # Solidity may be parsed with the JS fallback; overload dispatch is not self-recursion.
  - id: metadata/lang/source/syntax/directive::solidity-version-pragma
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
  - id: well-known/tool/development/toolchain/gwt-compiler::compiled-module-prologue
  - type: tree-sitter
    language: javascript
    query: "(try_statement\n  body: (statement_block\n    (function_declaration\n      name: (identifier) @fn\n      body: (statement_block\n        (expression_statement\n          (call_expression function: (identifier) @callee))))\n    (#eq? @fn @callee))) @probe\n"
  # Parameter shadows function name: the call invokes the argument callback, not self
  - type: tree-sitter
    language: javascript
    query: "(function_declaration\n  name: (identifier) @fn\n  parameters: (formal_parameters\n    (identifier) @param)\n  (#eq? @fn @param)) @shadowed\n"
  # A defaulted parameter shadows the same way: Svelte's server
  # `function inspect(args, inspect = console.log) { inspect('init', ...args) }`
  # calls the logger callback, not itself.
  - type: tree-sitter
    language: javascript
    query: "(function_declaration\n  name: (identifier) @fn\n  parameters: (formal_parameters\n    (assignment_pattern\n      left: (identifier) @param))\n  (#eq? @fn @param)) @shadowed\n"
- id: browser-error-history-loop
  desc: Error handler reloads or navigates history
  if:
    type: text
    regex: window\.onerror\s*=\s*new Function\(["']history\.go\(-?[01]\)
- id: browser-print-popup-history-nesting
  desc: Nested print, popup and history crash trigger
  if:
    type: text
    substr: history.go(window.open(window.print()))
- id: browser-error-constructor-history-side-effect
  desc: Error hook constructor invokes history eagerly
  if:
    type: text
    regex: window\.onerror\s*=\s*new Function\(history\.go\(
- id: browser-doubled-buffer-script-throw
  desc: Doubles buffer then emits throwing script
  if:
    type: text
    regex: \w+=\w+\+\w+;\s*document\.write\(['"]<script>throw\b
- id: browser-long-loop-string-doubling
  desc: Doubles a string for 32-plus iterations
  # Large generated bundles make the structural loop query needlessly costly.
  size_max: 524288
  if:
    type: tree-sitter
    language: javascript
    query: |
      ((program
        [(variable_declaration (variable_declarator name: (identifier) @buffer value: (string)))
         (lexical_declaration (variable_declarator name: (identifier) @buffer value: (string)))]
        (for_statement
        initializer: [(assignment_expression left: (identifier) @i right: (number) @start)
          (variable_declaration (variable_declarator name: (identifier) @i value: (number) @start))]
        condition: (binary_expression left: (identifier) @counter operator: ["<" "<="] right: (number) @bound)
        increment: (update_expression argument: (identifier) @inc operator: "++")
        body: (statement_block
          (expression_statement (augmented_assignment_expression left: (identifier) @lhs operator: "+=" right: (identifier) @rhs))) @loop_body))
       (#eq? @start "0")
       (#eq? @buffer @lhs)
       (#eq? @i @counter)
       (#eq? @i @inc)
       (#eq? @lhs @rhs)
       (#not-match? @loop_body "\\bbreak\\b")
       (#match? @bound "^(3[2-9]|[4-9][0-9]|[1-9][0-9]{2,})$")) @doubling
      ((statement_block
        [(variable_declaration (variable_declarator name: (identifier) @buffer value: (string)))
         (lexical_declaration (variable_declarator name: (identifier) @buffer value: (string)))]
        (for_statement
          initializer: [(assignment_expression left: (identifier) @i right: (number) @start)
            (variable_declaration (variable_declarator name: (identifier) @i value: (number) @start))]
          condition: (binary_expression left: (identifier) @counter operator: ["<" "<="] right: (number) @bound)
          increment: (update_expression argument: (identifier) @inc operator: "++")
          body: (statement_block
            (expression_statement (augmented_assignment_expression left: (identifier) @lhs operator: "+=" right: (identifier) @rhs))) @loop_body))
       (#eq? @start "0")
       (#eq? @buffer @lhs)
       (#eq? @i @counter)
       (#eq? @i @inc)
       (#eq? @lhs @rhs)
       (#not-match? @loop_body "\\bbreak\\b")
       (#match? @bound "^(3[2-9]|[4-9][0-9]|[1-9][0-9]{2,})$")) @doubling

composite_rules:
- id: browser-memory-exhaustion-string-loop
  desc: Infinite loop grows a string
  crit: hostile
  conf: 0.98
  near_bytes: 128
  all:
  - id: loop-appends-string-literal
  - id: micro-behaviors/data/control-flow/loop::infinite-loop-header
- id: browser-error-handler-crash-loop
  desc: Error hook combines recursive or nested browser operations
  crit: suspicious
  conf: 0.96
  any:
  - id: browser-error-history-loop
  - id: browser-print-popup-history-nesting
  - id: browser-error-constructor-history-side-effect
  - id: unguarded-js-tail-recursion
  needs: 2
- id: browser-recursive-popup-creation
  desc: Tail recursion accompanies popup creation
  all:
  - id: unguarded-js-tail-recursion
  - id: micro-behaviors/ui/window/navigation::browser-window-open-external-url
  near_bytes: 500
- id: browser-large-expansion-dom-output
  desc: Large buffer expansion accompanies DOM output
  all:
  - id: browser-large-expansion-call
  - id: micro-behaviors/ui/window/insert-html::browser-document-write
  near_bytes: 1000
- id: browser-large-expansion-call
  desc: Encoded buffer repetition uses huge repeat count
  all:
  - id: metadata/lang/source/syntax/call/arguments::js-large-second-call-argument
  - id: micro-behaviors/data/buffer/carve::js-logarithmic-doubling-repeat
  - id: micro-behaviors/data/decode/url::js-unicode-unescape-payload
- id: browser-string-doubling-dom-output
  desc: Long string doubling accompanies DOM output
  all:
  - id: browser-long-loop-string-doubling
  - id: micro-behaviors/ui/window/insert-html::browser-document-write
  near_bytes: 1500
- id: browser-throw-unescaped-buffer
  desc: Thrown script carries an unescaped buffer
  all:
  - id: browser-doubled-buffer-script-throw
  - id: micro-behaviors/data/decode/url::js-unicode-unescape-payload
  near_bytes: 800
- id: browser-sled-document-write
  desc: Large encoded-buffer expansion accompanies document output
  all:
  - id: metadata/lang/encoding::repeated-percent-u-fill-words
  - id: micro-behaviors/ui/window/insert-html::browser-document-write
  - id: browser-large-expansion-call
  near_bytes: 1200
