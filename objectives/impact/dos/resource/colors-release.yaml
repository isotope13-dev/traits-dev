# The Colors.js Liberty release included an infinite Zalgo logging loop. An
# import by itself or unbound source-text fragments are not proof of sabotage.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  conf: 0.99
  attack: T1195.002,T1499
composite_rules:
  - id: colors-american-import-infinite-zalgo-logging
    desc: Colors-style import and infinite Zalgo logging
    crit: hostile
    all:
      - id: metadata/import/module::relative-american-module-import
      - id: objectives/impact/dos/resource::javascript-infinity-zalgo-console-flood
  - id: colors-import-loop-and-zalgo-text
    desc: Colors-style import, loop and Zalgo log text
    crit: suspicious
    all:
      - id: metadata/import/module::relative-american-module-require-text
      - id: micro-behaviors/data/control-flow/loop/unconditional::javascript-infinity-bound-loop
      - id: micro-behaviors/os/console/io::zalgo-console-log-text
