defaults:
  crit: suspicious
  platforms:
  - windows
  - linux
  for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -cpan
  - -cran
  - -go_module
  - -hackage
  - -hex
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  - apk
  - alpine_apk
  attack: T1499.004
composite_rules:
- id: archive-compression-bomb
  for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -cpan
  - -cran
  - -go_module
  - -hackage
  - -hex
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  - go
  - apk
  - alpine_apk
  desc: Archive declares extreme compression expansion
  crit: hostile
  scope: file
  conf: 0.98
  all:
  - id: metadata/archive/compression::archive-high-compression-expansion
  - id: metadata/archive/compression::archive-high-overall-compression-expansion
  - id: metadata/archive/layout::archive-at-least-100-files
  - id: metadata/archive/layout::archive-large-uncompressed-total
  unless:
  - id: metadata/file/format/serialization::numpy-npz-archive
  - id: metadata/package/manager::go-module-source-archive
  - id: metadata/package/testing/presence/path::go-tools-testdata-directory-path
  - id: metadata/package/testing/presence/harness::go-test-main
- id: archive-petabyte-expansion-bomb
  for:
  - zip
  desc: Archive declares petabyte-scale compression expansion
  crit: hostile
  scope: file
  conf: 0.99
  all:
  - id: metadata/archive/layout::petabyte-uncompressed-size
  - id: metadata/archive/compression::archive-high-compression-expansion
  - id: metadata/archive/layout::archive-at-least-100-files
  unless:
  - id: metadata/package/manager::go-module-source-archive
  - id: metadata/package/testing/presence/path::go-tools-testdata-directory-path
  - id: metadata/package/testing/presence/harness::go-test-main
traits:
- id: tar-pax-zero-length-record
  desc: tar pax payload starts with zero-length record
  conf: 0.99
  for:
  - tar
  if:
    type: hex
    pattern: (67|78) [100] 75 73 74 61 72 [250] 30 20
  unless:
  - id: well-known/lib/native/box64::source-archive-member
