defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, conda, egg, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, gentoo_binpkg, asar, vsix-archive, xpi, rar, 7z, cpio]
  attack: T1499.004

composite_rules:
  - id: archive-compression-bomb
    desc: Archive compression bomb
    conf: 0.98
    all:
      - id: metadata/file/archive::archive-high-compression-expansion
      - id: metadata/file/archive::archive-many-compressed-members
      - id: metadata/file/archive::archive-large-uncompressed-total
    unless:
      - id: metadata/package/testing/presence/path::go-tools-testdata-directory-path
      - id: metadata/package/testing/presence/harness::go-test-main

traits:
  # Match the malformed record only at the start of a POSIX pax header's data
  # block. Type flag x/g is at tar-header offset 156, ustar magic at 257, and
  # the next 512-byte block begins with the record. This framing avoids random
  # "NUL 0 name=" bytes inside compressed member data.
  - id: tar-pax-zero-length-record
    desc: tar pax payload starts with zero-length record
    conf: 0.99
    for: [tar]
    if:
      type: hex
      pattern: (67|78) [100] 75 73 74 61 72 [250] 30 20
    unless:
      - id: well-known/lib/native/box64::source-archive-member
