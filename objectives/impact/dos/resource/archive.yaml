defaults:
  platforms: [unix, windows]
  for: [archive, archives, zip]
  attack: T1499.004

composite_rules:
  - id: archive-compression-bomb
    desc: Archive compression bomb
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/file/metrics::archive-high-compression-expansion
      - id: metadata/file/metrics::archive-many-compressed-members
      - id: metadata/file/metrics::archive-large-uncompressed-total
    unless:
      - id: metadata/package/testing/presence/harness::go-tools-testdata-directory-path
      - id: metadata/package/testing/presence/harness::go-test-main

traits:
  # POSIX.1-2001 pax extended-header records are self-describing:
  #   "<length> <keyword>=<value>\n"
  # where <length> counts the whole record, its own digits included. The
  # shortest well-formed record is therefore several bytes long, and a reader
  # walks the header by repeatedly consuming <length> bytes.
  #
  # A record that declares length 0 never advances that cursor, so the walk
  # cannot terminate: the reader either spins on the same four bytes forever or
  # runs off the end of a truncated header. No archiver emits this -- GNU tar,
  # bsdtar, Python tarfile and Go archive/tar all compute the length from the
  # payload they just wrote -- so the value is placed by hand.
  #
  # `\x00` anchors the match to the end of the 512-byte header block the record
  # follows, which keeps ordinary "0 " text inside member data out.
  - id: tar-pax-zero-length-record
    desc: tar pax header record declares zero length
    crit: suspicious
    conf: 0.95
    for: [tar]
    if:
      type: raw
      regex: '\x000 [A-Za-z][A-Za-z0-9_.]{0,24}='

