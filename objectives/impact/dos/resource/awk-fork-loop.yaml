defaults:
  platforms: [unix]
  for: [text]
  attack: T1499
  size_max: 8192

composite_rules:
  - id: awk-endless-fork-process-exhaustion
    desc: AWK forks inside an endless loop
    crit: hostile
    conf: 0.93
    near_bytes: 40
    all:
      - id: micro-behaviors/data/control-flow/iteration::awk-begin-infinite-loop
      - id: micro-behaviors/process/create/fork::awk-bare-fork-call
