defaults:
  for:
  - html
  - javascript
  platforms:
  - windows
  - unix
  crit: suspicious
  conf: 0.96
  attack: T1499.004
composite_rules:
- id: counted-multiple-fill-buffer-growth
  desc: Counted appends grow multiple fill buffers
  all:
  - id: micro-behaviors/data/string/concat::four-variable-append-statements
  - id: micro-behaviors/data/string/concat::counted-loop-at-least-32
  - id: metadata/lang/encoding::repeated-percent-u-fill-words
  near_bytes: 1400
- id: counted-fill-growth-document-output
  desc: Counted fill-buffer growth reaches DOM output
  all:
  - id: counted-multiple-fill-buffer-growth
  - id: micro-behaviors/ui/window/insert-html::browser-document-write
  near_bytes: 1400
