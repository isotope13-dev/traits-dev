defaults:
  platforms: [windows, unix, appliance]
  for: [java, kotlin, class, java_class, jar]
  attack: T1499

traits:
  - id: jvm-resource-exhaustion-markers
    desc: JVM resource exhaustion text references
    crit: notable
    conf: 0.92
    for: [java, kotlin, class, java_class]
    if:
      type: text
      regex: 'CPU Exhaustion|Memory Exhaustion|Filesystem Exhaustion'

  - id: jvm-network-flood-marker
    desc: JVM network flood marker
    crit: suspicious
    conf: 0.9
    for: [java, kotlin, class, java_class]
    if:
      type: text
      regex: 'Connection Flood|net-flood'

  - id: jvm-degrade-path-bytecode
    desc: JVM exact /degrade string constant
    crit: notable
    conf: 0.91
    for: [class]
    if:
      type: hex
      # CONSTANT_Utf8, big-endian length 8, then the exact string. Requiring
      # the constant-pool framing avoids matching prose such as "/degraded".
      pattern: 01 00 08 2F 64 65 67 72 61 64 65

composite_rules:
  - id: jvm-cpu-memory-disk-dos
    desc: JVM CPU memory disk DoS
    crit: hostile
    conf: 0.98
    all:
      - id: jvm-resource-exhaustion-markers
      - id: objectives/impact/dos/disk::jvm-disk-fill-artifacts
    any:
      - id: objectives/impact/dos/thread::jvm-thread-exhaustion-markers
      - id: jvm-network-flood-marker

  - id: jvm-threaded-socket-flood
    desc: JVM threaded socket flood
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/dos/thread::jvm-thread-exhaustion-markers
      - id: jvm-network-flood-marker

  - id: jvm-threaded-resource-exhaustion
    desc: JVM threaded resource DoS
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/dos/thread::jvm-thread-exhaustion-markers
      - id: objectives/impact/dos/disk::jvm-perfdata-disk-fill
      - id: objectives/impact/dos/memory::jvm-large-byte-array-loop

  - id: jvm-disk-network-resource-dos
    desc: JVM disk network DoS
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/dos/disk::jvm-disk-fill-artifacts
      - id: jvm-network-flood-marker

  - id: jvm-bytecode-resource-dos
    desc: JVM bytecode resource DoS
    crit: hostile
    conf: 0.98
    for: [class, java_class, jar]
    all:
      - id: objectives/impact/dos/disk::jvm-disk-fill-bytecode
      - id: jvm-degrade-path-bytecode
      - id: objectives/impact/dos/thread::jvm-thread-name-bytecode

  - id: jvm-bytecode-threaded-resource-dos
    desc: JVM bytecode threaded resource DoS
    crit: hostile
    conf: 0.98
    for: [class, java_class, jar]
    all:
      - id: objectives/impact/dos/disk::jvm-perfdata-hex
      - id: micro-behaviors/process/thread/lifecycle::jvm-fixed-thread-pool
      - id: micro-behaviors/data/arithmetic::java-math-sin-bytecode
      - id: micro-behaviors/data/arithmetic::java-math-cos-bytecode
      - id: micro-behaviors/data/arithmetic::java-math-tan-bytecode

  - id: jvm-perfdata-threadpool-dos
    desc: JVM perfdata threadpool DoS
    crit: hostile
    conf: 0.97
    for: [class, java_class, jar]
    all:
      - id: objectives/impact/dos/disk::jvm-perfdata-hex
      - id: micro-behaviors/process/thread/lifecycle::jvm-fixed-thread-pool
