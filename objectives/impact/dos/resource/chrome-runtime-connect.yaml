# A million-scale loop adjacent to chrome.runtime.connect suggests extension
# port exhaustion, not a downloaded payload.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1499.004,T1176.001
  mbc: B0018

composite_rules:
  - id: chrome-runtime-connect-port-flood
    desc: Extension floods chrome.runtime.connect ports
    crit: hostile
    conf: 0.98
    near_bytes: 240
    all:
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-connect-port
      - id: micro-behaviors/data/control-flow/loop::js-scientific-million-iter-bound
