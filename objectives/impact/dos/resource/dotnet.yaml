defaults:
  platforms: [unix, windows]
  for: [csharp, nupkg]
  attack: T1499
  mbc: B0022

composite_rules:
  - id: dotnet-unbounded-cache-resource-exhaustion
    desc: .NET unbounded cache loop exhausts disk resources
    crit: hostile
    conf: 0.99
    near_bytes: 2048
    scope: archive
    all:
      - id: micro-behaviors/fs/path/cache::source-hidden-user-cache-entry
      - id: micro-behaviors/data/control-flow/loop/unconditional::infinite-loop-header
      - id: metadata/lang/source/literal/integer::megabyte-size-constant
      - id: micro-behaviors/data/control-flow/dispatch/named::source-named-write-call
    unless:
      - id: metadata/path/directory::test-directory-component
