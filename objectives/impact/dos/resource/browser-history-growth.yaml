defaults:
  for: [javascript, html]
  platforms: [windows, unix]
  attack: T1499

traits:
  - id: browser-large-counted-loop
    desc: Browser script loops at least 100000 times
    crit: notable
    if:
      type: text
      regex: 'for\s*\([^;]{1,120};[^;]{1,120}<\s*[1-9][0-9]{5,}\s*;'
  - id: browser-counter-string-concatenation
    desc: Browser loop appends counter as text
    crit: notable
    if:
      type: text
      regex: '\b\w+\s*=\s*\w+\s*\+\s*\w+\.toString\s*\(\s*\)'

composite_rules:
  - id: browser-large-growing-history-flood
    desc: Browser loop floods history with growing strings
    crit: hostile
    conf: 0.97
    near_bytes: 600
    all:
      - id: browser-large-counted-loop
      - id: browser-counter-string-concatenation
      - id: micro-behaviors/ui/window/history::history-push-state-entry
