defaults:
  for: [javascript, html]
  platforms: [windows, unix]
  attack: T1499

composite_rules:
  - id: browser-large-growing-history-flood
    desc: Browser loop floods history with growing strings
    crit: hostile
    conf: 0.97
    near_bytes: 600
    all:
      - id: micro-behaviors/data/control-flow/loop/counted::browser-large-counted-loop
      - id: micro-behaviors/data/string/concat/expression::js-to-string-concatenation
      - id: micro-behaviors/ui/window/history::history-push-state-entry
