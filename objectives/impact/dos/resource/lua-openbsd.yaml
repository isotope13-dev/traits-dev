defaults:
  platforms: [openbsd, bsd, unix]
  for: [lua]
  attack: T1499

traits:
  - id: lua-cpu-hog-loop
    desc: Lua CPU hog loop
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'while\s+true;\s*do[^\n]{0,80}'
    not:
      - regex: '\bsleep\b'
    unless:
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component



