defaults:
  platforms: [windows]
  for: [batch]
  attack: T1499.004

traits:
  - id: batch-wildcard-file-enumeration-execution
    desc: Batch enumerates wildcard and spawns target
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bfor\s+%%[a-z]\s+in\s*\([^)]{0,20}\*\.?\*[^)]{0,20}\)\s*do\s+(start|cmd|call)\b'

  - id: batch-goto-process-spawn-loop
    desc: Batch start command loops via goto
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?im)^\s*start\s+\S{1,64}\b[^\r\n]{0,80}\r?\n[ \t]*goto\s+\S{1,64}'
    not:
      - regex: '(?i)\bif\b'
      - regex: '(?i)\bgoto\s+(:?eof|end|exit|quit|done|finish|stop)\b'
      - regex: '(?i)\bstart\s+[^\r\n]*?/(w|wait)\b'

composite_rules:
  - id: batch-wildcard-process-exhaustion
    desc: Batch wildcard loop exhausts processes
    crit: hostile
    conf: 0.98
    all:
      - id: batch-wildcard-file-enumeration-execution
      - id: micro-behaviors/process/create/shell/batch::batch-for-start-variable

  - id: batch-infinite-process-spawn-loop
    desc: Batch loop exhausts system processes
    crit: hostile
    conf: 0.98
    all:
      - id: batch-goto-process-spawn-loop
      - id: micro-behaviors/process/create/shell/batch::batch-starts-batch-file


