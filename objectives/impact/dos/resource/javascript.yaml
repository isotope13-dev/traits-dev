defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1499

composite_rules:
  # The Infinity-bound loop atom establishes unbounded execution, while the
  # structured call atom establishes an observable output side effect. Byte
  # proximity keeps an unrelated logger elsewhere in a large service from
  # turning a legitimate long-lived loop into a console-flood objective.
  - id: javascript-unbounded-console-flood
    desc: Infinity-bound JavaScript loop writes console output
    crit: suspicious
    conf: 0.98
    near_bytes: 512
    all:
      - id: micro-behaviors/data/control-flow/loop::javascript-infinity-bound-loop
      - id: micro-behaviors/os/console/io::js-console-log-call

  - id: javascript-infinity-zalgo-console-flood
    desc: Infinite JavaScript loop floods Zalgo console output
    crit: hostile
    conf: 0.99
    near_bytes: 512
    all:
      - id: micro-behaviors/data/control-flow/loop::javascript-infinity-bound-loop
      - id: micro-behaviors/os/console/io::js-console-log-zalgo-call
