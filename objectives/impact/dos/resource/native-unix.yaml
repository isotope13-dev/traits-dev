defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]
  attack: T1499

traits:
  - id: native-fork-cpu-spin
    desc: Native fork CPU spin
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?m)^[ \t]*fork\s*\(\s*\);[\s\S]{0,220}while\s*\(\s*1\s*\)'

  - id: native-temp-disk-fill
    desc: Native temp disk fill
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '/tmp/\.(degrade|syslog_cache|beacon_payload|impact_marker)'

composite_rules:
  - id: native-temp-disk-fill-write
    desc: Native temp disk fill write
    crit: suspicious
    conf: 0.97
    all:
      - id: native-temp-disk-fill
      - id: micro-behaviors/fs/write/file/descriptor::write

  - id: native-resource-degradation
    desc: Native resource-intensive operation clues
    crit: suspicious
    conf: 0.98
    any:
      - id: native-fork-cpu-spin
      - id: metadata/file/profile/operation-cooccurrence::native-fork-large-constant-reference
      - id: native-temp-disk-fill
      - id: micro-behaviors/data/stream/write::native-looped-write-call
    needs: 2

