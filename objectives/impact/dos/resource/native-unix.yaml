defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]
  attack: T1499

traits:
  - id: native-fork-cpu-spin
    desc: Native fork CPU spin
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?m)^[ \t]*fork\s*\(\s*\);[\s\S]{0,220}while\s*\(\s*1\s*\)'

composite_rules:
  - id: native-resource-degradation
    desc: Native resource-intensive operation clues
    crit: suspicious
    conf: 0.98
    any:
      - id: native-fork-cpu-spin
      - id: micro-behaviors/process/create/fork::native-fork-large-constant-reference
      - id: objectives/impact/dos/disk::native-temp-disk-fill
      - id: micro-behaviors/data/stream/write::native-looped-write-call
    needs: 2

