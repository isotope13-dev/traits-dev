defaults:
  for: [shell]
  platforms: [unix]
  attack: T1499

traits:
  - id: npm-audit-resource-cpu
    desc: Starts unbounded zero hashing
    crit: notable
    if:
      type: text
      substr: 'sha512sum /dev/zero &'
  - id: npm-audit-resource-loop
    desc: Starts indefinite network loop
    crit: notable
    if:
      type: text
      substr: 'while true; do'
  - id: npm-audit-resource-flood
    desc: Posts random data continuously
    crit: notable
    if:
      type: text
      substr: 'FLOOD_DATA=$PAYLOAD'

composite_rules:
  - id: shell-zero-hash-shm-http-flood
    desc: Zero hashing and shared-memory HTTP flood loop
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: npm-audit-resource-cpu
      - id: micro-behaviors/fs/write/file/shell::dd-zero-to-shared-memory-file
      - id: npm-audit-resource-loop
      - id: npm-audit-resource-flood
      - id: micro-behaviors/communications/http/curl/command::curl-command-call
  - id: npm-audit-shm-network-flood
    desc: Install hook fills shared memory and loops HTTP posts
    crit: hostile
    conf: 0.98
    scope: archive
    for: [zip, npm, shell, package.json]
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-runs-shell-local-script
      - id: micro-behaviors/fs/write/file/shell::dd-zero-to-shared-memory-file
      - id: npm-audit-resource-loop
      - id: npm-audit-resource-flood
      - id: micro-behaviors/communications/http/curl/command::curl-command-call
  - id: npm-audit-resource-script-pattern
    desc: Exhausts CPU memory and network
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/files/included::shell-audit-script-basename
      - id: npm-audit-resource-cpu
      - id: micro-behaviors/fs/disk/raw::dd-zero-device-command
      - id: npm-audit-resource-loop
      - id: npm-audit-resource-flood
      - id: micro-behaviors/process/control/wait::shell-tail-dev-null-forever
  - id: npm-audit-resource-install
    desc: Install hook exhausts cpu memory and network
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, shell, package.json]
    all:
      - id: metadata/package/scripts/command::shell-ms-audit-preinstall
      - id: npm-audit-resource-script-pattern
