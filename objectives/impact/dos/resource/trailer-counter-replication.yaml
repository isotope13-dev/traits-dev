# Paired image-footer fields bind the self-read and rewritten-clone sequences.
defaults:
  platforms:
  - windows
  for:
  - pe
  arch:
  - x86-64
composite_rules:
- id: footer-counter-clone-code
  desc: Self-image footer rewrite code fragments co-occur
  crit: component
  conf: 0.99
  all:
  - id: footer-counter-read-fragment
  - id: paired-footer-write-fragment
  - id: self-path-read-fragment
  near_bytes: 512
- id: trailer-counter-self-replica-launch
  desc: Self-replication loop writes and launches counted clones
  crit: hostile
  conf: 0.99
  all:
  - id: footer-counter-clone-code
  - id: counted-clone-loop-x64
  - id: micro-behaviors/fs/file/open::fopen
  - id: micro-behaviors/fs/write/file/handle::write--fwrite
  - id: micro-behaviors/process/create/spawn::create-process-w
traits:
- id: footer-counter-read-fragment
  desc: x64 footer-counter read sequence fragment
  crit: component
  conf: 0.95
  if:
    type: hex
    section: UPX0
    pattern: 43 8B 4C 35 F8 43 8B 54 35 FC 89 54 24 ?? FF C9 89 4C 24 ??
- id: paired-footer-write-fragment
  desc: x64 paired footer-write sequence fragment
  crit: component
  conf: 0.95
  if:
    type: hex
    section: UPX0
    pattern: 4C 8B CB BA 04 00 00 00 44 8D 42 FD 48 8D 4C 24 ?? FF 15 ?? ?? ?? ?? 4C 8B CB BA 04 00 00
      00 44 8D 42 FD 48 8D 4C 24 ?? FF 15 ?? ?? ?? ??
- id: self-path-read-fragment
  desc: x64 self-path read sequence fragment
  crit: component
  conf: 0.95
  if:
    type: hex
    section: UPX0
    pattern: 48 8D 15 ?? ?? ?? ?? 48 8B 0E FF 15 ?? ?? ?? ?? 48 8B F8 33 D2
- id: counted-clone-loop-x64
  desc: x64 counted clone-launch loop fragment
  crit: component
  conf: 0.98
  if:
    type: hex
    section: UPX0
    pattern: '8B 44 24 ?? FF C0 89 44 24 ?? 41 81 C4 ?? ?? ?? ?? 3B 44 24 ?? 7D ?? 8B 4C 24 ?? E9 [4]'
