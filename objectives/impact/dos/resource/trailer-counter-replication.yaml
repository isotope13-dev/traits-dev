# Footer fragments gain self-replication context only in this objective.
defaults:
  platforms:
  - windows
  for:
  - pe
  arch:
  - x86-64
composite_rules:
- id: trailer-counter-self-replica-launch
  desc: Self-replication loop writes and launches counted clones
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/binary/instruction::x64-tail-read-paired-call-fragments
  - id: metadata/binary/instruction::x64-counter-stride-loop-fragment
  - id: micro-behaviors/fs/file/open::fopen
  - id: micro-behaviors/fs/write/file/handle::write--fwrite
  - id: micro-behaviors/process/create/spawn::create-process-w
