defaults:
  platforms: [netscaler, appliance, unix]
  for: [perl]
  attack: T1499.004

traits:
  - id: perl-cpu-md5-loop
    desc: Perl CPU MD5 loop
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'sqrt\(\$i\) \* log\(\$i \+ 1\)[\s\S]{0,120}md5_hex'

composite_rules:
  - id: perl-resource-degradation
    desc: Perl resource degradation
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/dos/fork-bomb::perl-degrade-fork-loop
      - id: perl-cpu-md5-loop
    any:
      - id: objectives/impact/dos/disk::perl-temp-junk-files
