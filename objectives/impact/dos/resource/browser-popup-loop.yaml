defaults:
  for: [html]
  platforms: [windows, unix]
composite_rules:
  - id: popup-loop-resource-exhaustion
    desc: Non-yielding popup loop exhausts browser resources
    crit: hostile
    conf: 0.99
    attack: T1499
    all:
      - id: objectives/impact/ui/manipulation/harassment::positive-counter-popup-loop
      - id: micro-behaviors/ui/window/navigation::global-open-string-target-call
      - id: micro-behaviors/data/control-flow/module-exec::html-initial-parameterless-call
