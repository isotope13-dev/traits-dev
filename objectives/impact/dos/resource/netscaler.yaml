defaults:
  platforms: [netscaler, appliance]
  for: [scripts, binaries, go, java, kotlin, csharp, swift]
  attack: T1499

traits:
  - id: netscaler-fork-bomb-token
    desc: NetScaler fork bomb token
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: (:|:|:|:|:)&

  - id: netscaler-dos-fill-path
    desc: NetScaler dos fill path
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '/(var/)?tmp/\.dos_fill_.{1,40}'

  - id: shell-background-busyloop
    desc: Shell background busy loop
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: "while true; do :; done"
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path

composite_rules:
  - id: netscaler-dd-zero-source
    desc: NetScaler dd zero source
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/fs/file/write/overwrite::dd-zero-input-command
      - id: well-known/app/network/netscaler::netscaler-appliance-reference

  - id: netscaler-shell-fork-bomb
    desc: NetScaler shell fork bomb
    crit: hostile
    conf: 0.98
    all:
      - id: netscaler-fork-bomb-token
      - id: well-known/app/network/netscaler::netscaler-appliance-reference

  - id: netscaler-disk-fill-dd
    desc: NetScaler disk fill dd
    crit: hostile
    conf: 0.98
    all:
      - id: netscaler-dd-zero-source
      - id: netscaler-dos-fill-path

  - id: netscaler-cpu-busyloop
    desc: NetScaler CPU busy loop
    crit: hostile
    conf: 0.97
    all:
      - id: shell-background-busyloop
      - id: well-known/app/network/netscaler::netscaler-appliance-reference
