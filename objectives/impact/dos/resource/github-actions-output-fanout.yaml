# GitHub Actions output values are expanded by workflow expressions. A bounded
# loop that emits many distinct matrix-like values can multiply downstream
# jobs; pairing it with a large zero-filled temp-file write exhausts a runner.
defaults:
  platforms: [windows, linux, macos]
  for: [github_actions]
  attack: T1499

traits:
  - id: github-actions-looped-output-fanout
    desc: Loop has a large generated sequence
    crit: suspicious
    conf: 0.96
    if:
      type: value
      path: runs.steps[*].run
      regex: 'for\s+\w+\s+in\s+\$\(seq\s+1\s+\d{2,}\)'

  - id: github-actions-generated-output-records
    desc: Prints generated records to workflow output
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: runs.steps[*].run
      regex: 'printf\s+[^\n]{0,240}\$GITHUB_OUTPUT'

  - id: github-actions-large-zero-temp-write
    desc: Writes a large zero-filled temporary file
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: runs.steps[*].run
      regex: '(?is)dd\s+if=/dev/zero\s+of=[^\s;]+\s+bs=\d+[kKmMgG]?\s+count=\d{2,}'

composite_rules:
  - id: github-actions-runner-resource-exhaustion
    desc: Expands workflow fanout and fills runner temporary storage
    crit: hostile
    conf: 0.98
    all:
      - id: github-actions-looped-output-fanout
      - id: github-actions-generated-output-records
      - id: github-actions-large-zero-temp-write
