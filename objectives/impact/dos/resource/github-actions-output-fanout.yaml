# GitHub Actions output values are expanded by workflow expressions. A bounded
# loop that emits many distinct matrix-like values can multiply downstream
# jobs; pairing it with a large zero-filled temp-file write exhausts a runner.
defaults:
  platforms: [windows, linux, macos]
  for: [github_actions]
  attack: T1499

composite_rules:
  - id: github-actions-runner-resource-exhaustion
    desc: Expands workflow fanout and fills runner temporary storage
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/control-flow/loop/counted::github-actions-seq-loop
      - id: micro-behaviors/os/env/write::github-actions-printf-output-write
      - id: micro-behaviors/fs/write/file/content::github-actions-dev-zero-file-write
