# Repeating a zero-width lookbehind that opens with a run of `[[:word:]]`
# classes under a four- to nine-digit bound amplifies compiled size without a
# useful matching effect. Allow inline comments between any digits of the
# bound; the matcher proves the repeated word classes, not the character
# classes that may follow them.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, data, yaml]

traits:
  - id: large-repeat-posix-lookbehind
    desc: Large repeat of POSIX word-class lookbehind
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '\(\?<=(\[\[:word:\]\]){4,32}[^{}]{0,512}\)\)\{([0-9](\(\?#[^)]{0,16}\))?){4,9}\}'
