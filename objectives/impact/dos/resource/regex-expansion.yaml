# Repeating a zero-width lookbehind containing several Unicode POSIX classes
# with four- to nine-digit bounds amplifies compiled size without a useful
# matching effect. Allow inline comments between any digits of the bound.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, data, yaml]

traits:
  - id: large-repeat-posix-lookbehind
    desc: Large repeat of multi-class POSIX lookbehind
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '\(\?<=(\[\[:word:\]\]){4,32}[^{}]{0,512}\)\)\{([0-9](\(\?#[^)]{0,16}\))?){4,9}\}'
