defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  attack: T1498.001
  mbc: B0042

composite_rules:
  - id: python-cli-syn-flood-launcher
    desc: Assigns target_ip and runs a SYN-flood shell command
    crit: hostile
    conf: 0.98
    near_lines: 20
    all:
      - id: metadata/lang/natural/vocabulary/security::syn-flood
      - id: metadata/lang/source/naming/target::target-ip-identifier
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system-interpolated-command
    unless:
      - id: metadata/lang/source/shape::python-literal-module-quoted-source
