defaults:
  crit: hostile
  platforms: [unix, windows, macos]
composite_rules:
  # Suspicious, not hostile, and described for what it matches: the three legs
  # are IP_HDRINCL, a raw socket and a send -- that is packet *crafting*, and
  # it carries no flooding evidence at all (no loop, no rate, no thread pool).
  # Every raw-packet tool has this shape: fwknop's Single Packet Authorization
  # client, ping and traceroute implementations, hping. The carve-outs for
  # nmap and samba below were treating the symptom. `threaded-raw-udp-packet
  # -flooder` above is the one that actually adds flood evidence.
  - id: raw-flood-tool
    desc: Raw socket packet crafting
    crit: suspicious
    conf: 0.9
    attack: T1498
    all:
      - id: micro-behaviors/communications/socket/options::ip-hdrincl-option
      - id: micro-behaviors/communications/socket/raw::raw
      - id: micro-behaviors/communications/socket/send::send
    unless:
      - id: well-known/app/system/samba::samba-source-tree
      - id: well-known/tool/offensive/nmap::nmap-source-tree
  - id: threaded-raw-udp-packet-flooder
    desc: Threaded raw UDP packet flooder
    conf: 0.99
    attack: T1498.001
    mbc: B0042
    for: [elf]
    platforms: [unix]
    all:
      - id: objectives/impact/dos/udp::raw-udp-packet-flooder
      - id: micro-behaviors/process/threading/concurrency::pthread
