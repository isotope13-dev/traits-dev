defaults:
  platforms: [linux]
  for: [elf]
  conf: 0.98
traits:
  - id: raw-tcp-attack-function
    desc: Raw TCP attack routine symbol-table name
    crit: suspicious
    if:
      type: text
      exact: atk_tcp_raw
      section: .strtab
  - id: udp-attack-function
    desc: UDP attack routine symbol-table name
    crit: suspicious
    if:
      type: text
      exact: atk_udp
      section: .strtab
  - id: http-attack-function
    desc: HTTP attack routine symbol-table name
    crit: suspicious
    if:
      type: text
      exact: atk_http
      section: .strtab
  - id: flood-method-target-diagnostic
    desc: Flood method and target diagnostic
    crit: suspicious
    if:
      type: text
      substr: '[flood] method=%u'
      section: .rodata
