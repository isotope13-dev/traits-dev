defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
traits:
  # A batch counter is advanced, followed by a sleep call, then a loop
  # loading/closing each descriptor, and a backwards jump to the next batch.
  # Stack displacements, relative calls and loop branches may vary.
  - id: timed-descriptor-batch-cycle-x64
    desc: Timed descriptor batch cycling code
    crit: suspicious
    conf: 0.95
    if:
      type: hex
      section: .text
      pattern: '48 8D 7C 24 ?? 31 F6 48 8B 4C 24 ?? 48 01 4C 24 ?? E8 ?? ?? ?? ?? 48 8B 5C 24 ?? [0-8] 8B 3B 48 83 C3 04 E8 ?? ?? ?? ?? 49 39 DC 75 ?? E9 ?? ?? ?? ??'

composite_rules:
  - id: timed-connect-reset-flood
    desc: Timed nonblocking TCP connection flood with reset-on-close
    crit: hostile
    conf: 0.98
    attack: T1498.001
    mbc: B0042
    all:
      - id: timed-descriptor-batch-cycle-x64
      - id: micro-behaviors/communications/socket/options::nonblocking-stream-create-x64
      - id: micro-behaviors/communications/socket/options::reset-on-close-setup-x64
      - id: micro-behaviors/communications/socket/connect/attempt
