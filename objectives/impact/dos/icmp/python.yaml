defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1498.001
  mbc: B0042

composite_rules:
  - id: python-repeated-ping-launch
    desc: Python ping process in unconditional loop
    crit: suspicious
    conf: 0.94
    unless:
      - id: micro-behaviors/communications/icmp::python-throttled-ping-loop
    all:
      - id: micro-behaviors/communications/icmp::python-ping-process-launch
    any:
      - id: micro-behaviors/data/control-flow/loop/unconditional::python-unconditional-while-header
    near_lines: 20

  - id: python-icmp-flood-implementation
    desc: Python ICMP flood implementation
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/icmp::python-large-ping-payload
      - id: python-repeated-ping-launch
      - id: micro-behaviors/communications/icmp::python-background-ping
