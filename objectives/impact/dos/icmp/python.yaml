defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1498.001
  mbc: B0042

composite_rules:
  - id: python-repeated-ping-launch
    desc: Python unthrottled ping loop
    crit: suspicious
    conf: 0.94
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::python-test-file
      - id: metadata/package/testing/presence/evidence::evidence-scripts-directory-path
      - id: well-known/tool/reverse-engineering/forenselab::network-scanner-module
      - id: micro-behaviors/communications/icmp/ping::python-throttled-ping-loop
    all:
      - id: micro-behaviors/communications/icmp/ping::python-ping-process-launch
    any:
      - id: micro-behaviors/data/control-flow/loop::python-while-true
      - id: micro-behaviors/data/control-flow/loop::python-while-one
    near_lines: 20

  - id: python-icmp-flood-implementation
    desc: Python ICMP flood implementation
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/icmp/ping::python-large-ping-payload
      - id: python-repeated-ping-launch
      - id: micro-behaviors/communications/icmp/ping::python-background-ping
