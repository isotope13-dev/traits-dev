# IGMP "KOD" spoofers send crafted IGMP packets from a spoofed source
# to a named destination.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1498.001
  mbc: B0042

traits:
  - id: kod-spoofer-banner
    desc: Names a KOD IGMP spoofer
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)KOD spoofer'
  - id: sending-igmp-packets
    desc: Sending-IGMP-packets status banner
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'Sending IGMP packets:'
  - id: src-dst-usage
    desc: Usage takes src and dst hosts
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'Usage: %s <src> <dst>'

composite_rules:
  - id: kod-igmp-send
    desc: KOD spoofer sends IGMP packets
    crit: hostile
    conf: 0.98
    all:
      - id: kod-spoofer-banner
      - id: sending-igmp-packets
  - id: kod-src-dst-usage
    desc: KOD spoofer with src-dst usage
    crit: hostile
    conf: 0.96
    all:
      - id: kod-spoofer-banner
      - id: src-dst-usage
  - id: igmp-src-dst-flooder
    desc: IGMP send with src-dst usage
    crit: hostile
    conf: 0.95
    all:
      - id: sending-igmp-packets
      - id: src-dst-usage
