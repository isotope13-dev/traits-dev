# The batch ping-flooder shape: a goto loop whose body pings multiple named
# targets, unthrottled and endless. Network monitoring scripts loop over one
# host (usually with a delay); a batch that hammers several internet hosts
# forever is the BAT.Pinger harassment/DoS family. Following the python
# sibling, the unthrottled loop is suspicious; a hostile verdict waits for a
# real flood implementation (oversized payloads, raw sockets).
defaults:
  platforms: [windows]
  for: [batch, text]
  attack: T1498.001
  mbc: B0042

traits:
  - id: batch-endless-goto-loop-structure
    desc: Batch goto loop structure around a body
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)^\s*:loop\b[\s\S]{0,300}^\s*goto\s+loop\b'
  - id: batch-multi-target-ping
    desc: Batch pings several targets in sequence
    crit: notable
    conf: 0.9
    count_min: 2
    if:
      type: text
      # Skip switches and numeric flag values so the match is the host.
      # `ping -n 2 127.0.0.1` is the batch sleep idiom, not a flood target.
      regex: '(?im)^\s*ping( +\-\S{1,3}( +\d{1,5})?)?( +\-\S{1,3}( +\d{1,5})?)? +\S{1,40}'
    not:
      - regex: '(?i)(127\.0\.0\.1|localhost)$'
  # A flood loop pointed at a security vendor's site: the AV-harassment
  # motive of the BAT.Pinger family, the same vendor-target selection the
  # null-route and sinkhole shapes key on.
  - id: batch-ping-security-vendor-target
    desc: Batch ping targets security vendor domain
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?im)^\s*ping\s+\S*(norton|symantec|mcafee|kaspersky|avast|eset)\S*\.[a-z]'

composite_rules:
  - id: batch-endless-multi-ping-flood
    desc: Batch endlessly pings multiple targets
    crit: suspicious
    conf: 0.93
    near_lines: 12
    all:
      - id: batch-endless-goto-loop-structure
      - id: batch-multi-target-ping
