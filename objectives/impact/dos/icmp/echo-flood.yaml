# Classic ICMP echo flooders advertise an "ECHO Killer" banner and a
# ping -f style flood flag with a spoofed source.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1498.001
  mbc: B0042

traits:
  - id: icmp-echo-killer-banner
    desc: ICMP echo-killer flooder banner
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)ICMP ECHO Killer'
  - id: ping-f-flood-flag
    desc: Enables ping-style flood flag
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)enable flooding.{0,8}\(ping -f\)'
  - id: icmp-echo-packet-size
    desc: ICMP echo packet-size usage
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'ICMP_ECHO Packet Size'
  - id: spoof-dest-flood-usage
    desc: Usage takes spoof and dest hosts
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)<spoof>.{0,40}<dest>'
  - id: flooding-packet-limit
    desc: Flooding packet-limit status banner
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'flooding... packet limit set.'
  - id: flooding-completed-count
    desc: Flooding-completed packet count
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'flooding completed - %u packets sent.'
  - id: echok-source
    desc: Names echok.c flooder source
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: echok.c

composite_rules:
  - id: icmp-echo-killer-flood-flag
    desc: Echo-killer banner with ping-f flag
    crit: hostile
    conf: 0.97
    all:
      - id: icmp-echo-killer-banner
      - id: ping-f-flood-flag
  - id: icmp-echo-killer-spoof-dest
    desc: Echo-killer banner with spoof dest
    crit: hostile
    conf: 0.96
    all:
      - id: icmp-echo-killer-banner
      - id: spoof-dest-flood-usage
  - id: ping-f-spoof-dest-flooder
    desc: Ping-f flag with spoof dest usage
    crit: hostile
    conf: 0.95
    all:
      - id: ping-f-flood-flag
      - id: spoof-dest-flood-usage
  - id: echo-killer-packet-size
    desc: Echo-killer banner with packet size
    crit: hostile
    conf: 0.95
    all:
      - id: icmp-echo-killer-banner
      - id: icmp-echo-packet-size
  - id: ping-f-packet-size-flooder
    desc: Ping-f flag with echo packet size
    crit: hostile
    conf: 0.94
    all:
      - id: ping-f-flood-flag
      - id: icmp-echo-packet-size
  - id: echo-killer-packet-limit
    desc: Echo-killer with packet-limit banner
    crit: hostile
    conf: 0.97
    all:
      - id: icmp-echo-killer-banner
      - id: flooding-packet-limit
  - id: echo-killer-completed-count
    desc: Echo-killer with completed-count
    crit: hostile
    conf: 0.96
    all:
      - id: icmp-echo-killer-banner
      - id: flooding-completed-count
  - id: packet-limit-echok-source
    desc: Packet-limit banner with echok.c
    crit: hostile
    conf: 0.95
    all:
      - id: flooding-packet-limit
      - id: echok-source
