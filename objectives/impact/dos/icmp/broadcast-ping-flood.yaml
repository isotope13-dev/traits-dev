defaults:
  platforms:
  - linux
  for:
  - javascript
  - typescript
  attack: T1498.001
  mbc: B0034.001
traits:
- id: npm-wifi-broadcast-ping-flood
  desc: Floods broadcast and gateway with ICMP
  crit: hostile
  conf: 0.995
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /setInterval\s*\(/is
          $b0_1 = /exec\s*\(\s*["']ping\s+-b[^"']*192\.168\.[01]\.255["']/is
          $b0_2 = /exec\s*\(\s*["']ping\s+-s\s+65507\s+192\.168\.[01]\.[0-9]{1,3}["']/is
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 1000 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 1000 and
                  true
                )
              )
            )
          )
      }
composite_rules: []
