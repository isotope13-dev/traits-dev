defaults:
  platforms: [linux]
  for: [javascript, typescript, npm, tar, zip]
  attack: T1498.001
  mbc: B0034.001

traits:
  - id: node-icmp-broadcast-large-packet-interval-flood
    desc: Repeatedly runs large ICMP pings against broadcast and gateway targets
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)setInterval\s*\([\s\S]{0,1000}exec\s*\(\s*["'']ping\s+-b[^"'']*192\.168\.[01]\.255["''][\s\S]{0,1000}exec\s*\(\s*["'']ping\s+-s\s+65507\s+192\.168\.[01]\.[0-9]{1,3}["'']'

composite_rules:
  - id: npm-wifi-broadcast-ping-flood
    desc: Wi-Fi disruption package floods broadcast and gateway addresses with ICMP packets
    crit: hostile
    conf: 0.995
    for: [zip, npm, tar, javascript, typescript]
    scope: archive
    all:
      - id: node-icmp-broadcast-large-packet-interval-flood
