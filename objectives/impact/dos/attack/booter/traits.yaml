defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1498
  mbc: B0013

traits:
  - id: booter-php-api-path
    desc: Booter PHP API endpoint path
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '/api/v[0-9]+/booter\.php\b'

  - id: booter-hwid-auth-path
    desc: Booter HWID auth API path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '/api/v[0-9]+/auth\.php\?hwid='

  # Bare word "attack"/"packets" FPs on OpenSSL ("rollback attack") and
  # networking ("sending packets"). Require query/JSON/HTML form-field shape.
  - id: booter-attack-field
    desc: Booter attack form field name
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '(?i)([?&]attack=|["'']attack["'']\s*:|name=["'']attack["''])'

  - id: booter-packets-field
    desc: Booter packets form field name
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '(?i)([?&]packets=|["'']packets["'']\s*:|name=["'']packets["''])'

  - id: unauthorized-attack-message
    desc: Unauthorized attack status message
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: Unauthorized attack

composite_rules:
  - id: booter-attack-packets-fields
    desc: Booter attack and packets form fields
    crit: notable
    conf: 0.92
    all:
      - id: booter-attack-field
      - id: booter-packets-field
    unless:
      - id: well-known/game/steam::steam-client-identity

  - id: remote-booter-panel-client
    desc: Client for a remote DDoS booter panel
    crit: hostile
    conf: 0.98
    attack: T1498,T1071.001
    all:
      - id: booter-php-api-path
    any:
      - id: booter-hwid-auth-path
      - id: unauthorized-attack-message
      - id: booter-attack-packets-fields
    needs: 2
