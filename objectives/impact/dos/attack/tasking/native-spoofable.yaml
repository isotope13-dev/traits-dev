# The interface selects a target, port and duration, source spoofing, worker
# count and packet protocol. The separate status format confirms attack
# execution accounting. Neither rule depends on a bot name or destination.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1498.001
traits:
  - id: spoof-thread-protocol-attack-usage
    desc: Attack usage configures spoofing and workers
    crit: suspicious
    conf: 0.97
    if:
      # stng currently omits this printable usage string in all three native
      # builds. Search its verified rodata bytes, not a less specific token.
      type: raw
      section: .rodata
      regex: '(?i)usage:.{0,48}<method>.{0,64}<port>.{0,64}spoof=.{0,80}threads=.{0,40}l4=tcp\|udp\|icmp'
  - id: threaded-spoofed-attack-status
    desc: Reports timed attack, worker and spoof settings
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)attack [^\r\n]{0,80}port %[udi]-%[udi] for %[udi]s threads=%[udi] spoof=%[udi]'
composite_rules:
  - id: native-spoofable-packet-attack-interface
    desc: Timed packet-attack interface supports source spoofing and workers
    crit: hostile
    conf: 0.98
    all:
      - id: spoof-thread-protocol-attack-usage
      - id: threaded-spoofed-attack-status
      - id: micro-behaviors/communications/flood::native-tcp-header-repeat-send-layout
