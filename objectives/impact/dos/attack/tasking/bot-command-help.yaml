# Operator documentation shipped with a botnet panel: an HTML help page that
# lists the commands a bot accepts. A "flood <type> <target>" command with
# network-layer vector names, plus stop and die, is the tasking vocabulary of
# a DDoS bot; the page text may be in any language, so only the markup and
# command tokens are matched.
defaults:
  platforms: [unix, windows]
  for: [html]
  attack: T1498
  mbc: B0042

traits:
  - id: bot-flood-command-syntax
    desc: Help page documents a flood command
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)<b>\s*flood\s*</b>\s*<i>'

  - id: bot-flood-vector-list
    desc: Help page lists icmp syn udp vectors
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?is)-\s*icmp<br>\s*-\s*syn<br>\s*-\s*udp<br>'

  - id: bot-stop-die-commands
    desc: Help page documents stop and die commands
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?is)<b>\s*stop\s*</b>.{0,400}<b>\s*die\s*</b>'

composite_rules:
  - id: bot-flood-command-reference
    desc: Help page defines typed flood commands for bots
    crit: hostile
    conf: 0.93
    all:
      - id: bot-flood-command-syntax
      - id: bot-flood-vector-list
