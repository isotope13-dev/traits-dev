# The operator-facing half of a web-hosted flood service: the PHP endpoints a
# booter panel exposes so its operator can set a target and start or stop the
# run. The siblings here cover the tasking a *bot* receives; this is where
# that tasking is authored.
#
# Individually the handlers are unremarkable web code -- a form post, a redirect
# -- so the evidence is the vocabulary. Functions named for starting and
# stopping an "attack", and a handler that persists a target link alongside a
# repetition count, describe a control surface with one purpose. Legitimate
# load-testing tools exist and use the word "attack" for a run, which is why
# this stays suspicious rather than hostile.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, typescript, python, ruby]
  attack: T1498
  mbc: B0042

traits:
  - id: attack-control-handler-name
    desc: Attack-control function name
    crit: component
    conf: 0.88
    if:
      # These exact handler identities are partial panel evidence. Prefix
      # matching also read generated schema methods such as `startAttacker()`
      # as an instruction to start an attack.
      type: symbol
      regex: '(?i)(^|\.)(startAttack|stopAttack|saveAttackData)$'

  - id: attack-target-iteration-parameters
    desc: Persists an attack target and repeat count
    crit: suspicious
    conf: 0.9
    if:
      # `saveLinkAndIter($link, $iter)` -- a URL plus how many times to hit
      # it. That pair is a flood's whole configuration.
      #
      # The verb and the connector are both required. Without them the
      # pattern read `link` followed later by `Liter` as "Link...Iter" and
      # matched `transformGfmAutolinkLiterals(`, a markdown plugin, inside an
      # ordinary browser extension.
      type: text
      regex: '(?i)\b(save|store)Link(And|_)Iter'

composite_rules:
  - id: web-flood-panel-tasking
    desc: Web panel stores and controls flood runs
    crit: suspicious
    conf: 0.93
    all:
      - id: attack-control-handler-name
      - id: attack-target-iteration-parameters
