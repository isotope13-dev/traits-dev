defaults:
  platforms: [windows, unix]
  for: [class]
traits:
  - id: irc-http-flood-command-usage
    desc: IRC HTTP flood command usage
    crit: component
    conf: 0.96
    if:
      type: value
      path: class.strings[*]
      regex: '^[.!;]httpflood <(host|url)>[^\r\n]{0,40}<threads>'
  - id: irc-udp-flood-command-usage
    desc: IRC UDP flood command usage
    crit: component
    conf: 0.96
    if:
      type: value
      path: class.strings[*]
      regex: '^[.!;]udpflood <(host|url)>[^\r\n]{0,40}<threads>'
  - id: irc-syn-flood-command-usage
    desc: IRC SYN flood command usage
    crit: component
    conf: 0.96
    if:
      type: value
      path: class.strings[*]
      regex: '^[.!;]synflood <(host|url)>[^\r\n]{0,40}<threads>'
  - id: irc-short-flood-command-usage
    desc: IRC sflood command usage
    crit: component
    conf: 0.96
    if:
      type: value
      path: class.strings[*]
      regex: '^[.!;]sflood <(host|url)>[^\r\n]{0,40}<threads>'
composite_rules:
  - id: irc-flood-command-usage
    desc: Distinct IRC flood command usages
    crit: suspicious
    conf: 0.96
    needs: 2
    any:
      - id: irc-http-flood-command-usage
      - id: irc-udp-flood-command-usage
      - id: irc-syn-flood-command-usage
      - id: irc-short-flood-command-usage
  - id: irc-shell-bot-flood-command-catalog
    desc: IRC shell bot advertises flood attacks
    crit: hostile
    conf: 0.99
    all:
      - id: irc-flood-command-usage
      - id: objectives/command-and-control/botnet/dispatch::irc-shell-corruption-command-catalog
