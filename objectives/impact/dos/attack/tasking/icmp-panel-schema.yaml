defaults:
  for: [text]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: ddos-option-row
    desc: Attack mode and command option row
    conf: 0.95
    if:
      type: text
      substr: "('attack_mode','0'),('cmd','wait')"

  - id: flood-rate-fields
    desc: ICMP frequency and size option fields
    conf: 0.94
    if:
      type: text
      substr: "('icmp_freq','10'),('icmp_size','2000')"


composite_rules:
  - id: panel-database-schema
    desc: Database schema with attack configuration fields
    crit: suspicious
    conf: 0.97
    all:
      - id: ddos-option-row
      - id: flood-rate-fields
      - id: micro-behaviors/data/db/schema/relational::bot-stat-table
