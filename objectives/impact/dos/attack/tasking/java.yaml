defaults:
  platforms: [windows, unix]
  for: [class, java_class, jar, zip]
  attack: T1498.001
  mbc: B0042

traits:
  - id: flood-http-get-task-token
    desc: HTTP GET flood task token
    crit: component
    conf: 0.99
    if:
      type: hex
      pattern: 46 4C 4F 4F 44 20 48 54 54 50 47 45 54

  - id: flood-http-post-task-token
    desc: HTTP POST flood task token
    crit: component
    conf: 0.99
    if:
      type: hex
      pattern: 46 4C 4F 4F 44 20 48 54 54 50 50 4F 53 54

  - id: flood-udp-task-token
    desc: UDP flood task token
    crit: component
    conf: 0.99
    if:
      type: hex
      pattern: 46 4C 4F 4F 44 20 55 44 50

  - id: flood-syn-task-token
    desc: Spoofed SYN flood task token
    crit: component
    conf: 0.99
    if:
      type: hex
      pattern: 46 4C 4F 4F 44 20 53 53 59 4E

composite_rules:
  - id: jvm-multivector-flood-tasking
    desc: JVM RAT dispatcher with multi-vector network flood tasking
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/command-and-control/backdoor/rat/tasking::jvm-operator-task-suite
    needs: 3
    any:
      - id: flood-http-get-task-token
      - id: flood-http-post-task-token
      - id: flood-udp-task-token
      - id: flood-syn-task-token
