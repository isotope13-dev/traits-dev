defaults:
  platforms: [linux]
  for: [elf]
  attack: T1498.001
  mbc: B0042

traits:
  - id: target-port-duration-attack-command
    desc: Target port duration attack-command format
    crit: component
    conf: 0.99
    if:
      type: text
      exact: 'attack %s %d %d'

composite_rules:
  - id: compact-c2-tasked-network-flood
    desc: Compact bot accepts target port and duration flood tasking
    crit: hostile
    conf: 0.99
    all:
      - id: target-port-duration-attack-command
    any:
      - id: objectives/command-and-control/botnet/iot::compact-arm-bot-control-protocol
      - id: objectives/command-and-control/botnet/iot::compact-mips-bot-control-protocol
    needs: 1
