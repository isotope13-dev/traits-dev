defaults:
  for: [text]
  platforms: [windows, unix]

traits:
  - id: irc-reference-flood-command
    desc: Documents a SYN flood command
    crit: notable
    if:
      type: text
      regex: '\.ddos\.syn\s+<address>\s+<port>\s+<secs>'

  - id: irc-reference-exploit-scan
    desc: Documents exploit scanning arguments
    crit: notable
    if:
      type: text
      regex: '<exploit>\s+<threads>\s+<delay>\s+<minutes>\s+<address>'

  - id: irc-reference-clone-command
    desc: Documents IRC clone command
    crit: notable
    if:
      type: text
      regex: '\.clone\s+<server>\s+<port>\s+<channel>\s+<chanpass>'

  - id: bot-reference-flood
    desc: Documents bot SYN flood command
    crit: notable
    if:
      type: text
      regex: '(?i)ddos\.synflood[^\r\n]{0,80}starts syn flood'

  - id: bot-reference-exploit
    desc: Documents bot exploit scanning command
    crit: notable
    if:
      type: text
      regex: '(?i)exploit\.masslocalscan[^\r\n]{0,80}exploits preconfigured vulns'

  - id: bot-reference-keylog
    desc: Documents bot keylogger command
    crit: notable
    if:
      type: text
      regex: '(?i)sys\.keylog[^\r\n]{0,80}keylogger'

composite_rules:
  - id: bot-attack-command-reference
    desc: Bot command reference documents flooding, exploitation, and keylogging
    crit: hostile
    attack: T1498
    all:
      - id: bot-reference-flood
      - id: bot-reference-exploit
      - id: bot-reference-keylog

  - id: irc-bot-attack-command-reference
    desc: IRC bot command reference documents flood attacks and exploit scanning
    crit: hostile
    attack: T1498
    all:
      - id: irc-reference-flood-command
      - id: irc-reference-exploit-scan
      - id: irc-reference-clone-command
