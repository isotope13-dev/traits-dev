defaults:
  for: [text]
  platforms: [windows, unix]

traits:
  - id: irc-reference-flood-command
    desc: Documents a SYN flood command
    crit: notable
    if:
      type: text
      regex: '\.ddos\.syn\s+<address>\s+<port>\s+<secs>'

  - id: irc-reference-exploit-scan
    desc: Documents exploit scanning arguments
    crit: notable
    if:
      type: text
      regex: '<exploit>\s+<threads>\s+<delay>\s+<minutes>\s+<address>'

  - id: irc-reference-clone-command
    desc: Documents IRC clone command
    crit: notable
    if:
      type: text
      regex: '\.clone\s+<server>\s+<port>\s+<channel>\s+<chanpass>'

composite_rules:
  - id: irc-bot-attack-command-reference
    desc: IRC bot command reference documents flood attacks and exploit scanning
    crit: hostile
    attack: T1498
    all:
      - id: irc-reference-flood-command
      - id: irc-reference-exploit-scan
      - id: irc-reference-clone-command
