defaults:
  platforms: [linux, android]
  for: [elf]
composite_rules:
  - id: elfood-flood-tasking-bot
    desc: ELF corruption marker with flood task labels
    crit: hostile
    conf: 0.97
    attack: T1498.001,T1562.001
    mbc: F0004,B0030
    all:
      - id: objectives/impact/degrade/system/file::elfood-header-replacement-marker
    any:
      - id: micro-behaviors/communications/flood::udp-flood-attack-label
      - id: micro-behaviors/communications/flood::https-flood-attack-label
    needs: 1

  - id: elfood-flood-bot-downloaded-executable-stage
    desc: ELFOOD flood bot downloads and launches a staged executable
    crit: hostile
    conf: 0.98
    attack: T1105
    mbc: B0030
    all:
      - id: elfood-flood-tasking-bot
      - id: micro-behaviors/process/create/local-exec::embedded-download-chmod-execute-chain
