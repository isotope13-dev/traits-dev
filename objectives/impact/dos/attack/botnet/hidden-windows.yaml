defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: hostile
  conf: 0.99
composite_rules:
  # A miner or load tester's networking is insufficient. Require native
  # datagram bursts, cache-busting HTTP, an RC4 implementation and concealed
  # logon registration together. No chosen host, key or agent name gates it.
  - id: hidden-logon-multi-vector-flood-agent
    desc: Hidden logon agent with UDP and HTTP floods
    attack: T1498.001,T1499.002
    mbc: B0042
    all:
      - id: micro-behaviors/communications/flood::native-indexed-datagram-burst
      - id: micro-behaviors/communications/http/get::native-hexadecimal-cache-buster-get-template
      - id: micro-behaviors/crypto/symmetric/stream/rc4::x64-byte-index-ksa
      - id: micro-behaviors/crypto/symmetric/stream/rc4::x64-byte-index-prga
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-hidden-xml
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-logon-trigger-xml
