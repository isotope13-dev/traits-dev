# Mirai-lineage builds keep every string in one single-byte-XOR table.  A build
# whose table holds the Source Engine query payload next to the resolver and
# routing-table paths, and that pins a literal C2 address, is a flooder with
# its configuration hidden from string extraction.
defaults:
  platforms: [linux]
  for: [elf]
  mbc: B0042
  attack: T1498.001,T1027

composite_rules:
  - id: xor-table-source-query-flood-bot
    desc: XOR-table bot with Source query payload and pinned C2
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/socket/udp::xor54-source-engine-query-payload
      - id: micro-behaviors/fs/path/config/system::config-resolv-xor
      - id: micro-behaviors/fs/proc/network::network-route-xor
      - id: micro-behaviors/communications/ip/literal::static-stripped-elf-external-ip-literal
