defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86]
traits:
  - id: i386-attack-parser-gre-flood-code
    desc: Attack parser and GRE packet send code
    crit: suspicious
    conf: 0.99
    attack: T1498.001
    if:
      type: yara
      source: |
        import "elf"
        rule i386_attack_parser_gre_flood {
          strings:
            // Mirai command: network-order duration, vector, target count.
            $parser = {
              8B 2E 66 C1 CD 08 C1 CD 10 66 C1 CD 08
              83 FB 04 74 ?? 8A 46 04 83 FB 05 88 44 24 ??
              74 ?? 8A 46 05 84 C0 74 ?? 25 FF 00 00 00 8D 53 FA
            }
            // Outer IPv4 protocol GRE, inner IPv4 protocol UDP.
            $gre = { C6 43 09 2F 66 C7 42 02 08 00 [64-112] C6 46 09 11 }
            // Send each crafted packet, advance target index, repeat forever.
            $loop = {
              6A 10 50 68 00 40 00 00 8B 44 24 ?? 50 56
              8B 44 24 ?? 50 E8 [4] 8B 44 24 ?? 40 89 44 24 ??
              83 C4 20 3B 44 24 ?? 0F 8D [4] E9 ?? ?? ?? ??
            }
            // uClibc sendto wrapper, socketcall sub-operation 11.
            $sendto = {
              83 EC 34 8B 44 24 38 89 44 24 1C
              8B 44 24 3C 89 44 24 20 8B 44 24 40 89 44 24 24
              8B 44 24 44 89 44 24 28 8B 44 24 48 89 44 24 2C
              8B 44 24 4C 89 44 24 30 8D 44 24 1C 50 6A 0B
              E8 [4] 83 C4 3C C3
            }
          condition:
            elf.machine == elf.EM_386 and
            for any s in (0..elf.number_of_sections-1) : (
              elf.sections[s].name == ".text" and
              $parser in (elf.sections[s].offset..elf.sections[s].offset+elf.sections[s].size) and
              for any g in (1..#gre) : (
                @gre[g] >= elf.sections[s].offset and
                for any l in (1..#loop) : (
                  @loop[l] > @gre[g] and @loop[l]-@gre[g] < 2048 and
                  @loop[l]+!loop[l] <= elf.sections[s].offset+elf.sections[s].size and
                  for any t in (1..#sendto) : (
                    @loop[l]+24+int32(@loop[l]+20) == @sendto[t]
                  )
                )
              )
            )
        }

composite_rules:
  - id: i386-attack-parser-gre-flood
    desc: Remote attack tasks and GRE flood loop
    crit: hostile
    conf: 0.99
    all:
      - id: i386-attack-parser-gre-flood-code
      - id: micro-behaviors/communications/socket/receive::i386-bounded-network-record-dispatch
