    desc: C2-controlled Windows agent with multiple network flood modes
    crit: hostile
    conf: 0.99
    attack: T1498.001,T1498.002,T1105
    all:
      - id: objectives/command-and-control/backdoor/rat/tasking::c2-multi-vector-command-set
      - id: objectives/command-and-control/backdoor/rat/tasking::windows-native-c2-tasking-agent
      - id: micro-behaviors/communications/socket/init::socket-api
      - id: micro-behaviors/communications/socket/init::sendto-api
