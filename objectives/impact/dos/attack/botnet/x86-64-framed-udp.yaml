# Compiled Mirai-lineage attack framing and UDP flood engine. Relative call
# targets bind received bytes to the parser, and the endless send loop to the
# send syscall wrapper. Neither uClibc nor procfs references admit this claim.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86_64]
  attack: T1498.001
  mbc: B0042
traits:
  - id: x86-64-framed-udp-flood-code
    desc: Framed attack parser and UDP flood code
    crit: suspicious
    conf: 0.99
    if:
      type: yara
      source: |
        import "elf"
        rule x86_64_framed_udp_flood {
          strings:
            // Function entry, then duration, vector, target count and masks.
            $parser = {
              48 89 5C 24 ?? [75]
              44 8B 37 41 0F CE 83 FE 04 74 ??
              0F B6 47 04 83 FE 05 88 44 24 ?? 74 ??
              44 0F B6 6F 05 45 84 ED 74 ?? 44 8D 7B FA
              41 0F B6 FD 48 8D 04 BF 49 63 D7 48 39 C2
            }
            // Bound uint16 length to 1024; receive the body and call parser.
            $dispatch = {
              66 C1 C8 08 66 3D 00 04 66 89 84 24 [4] 0F 87 [4]
              0F B7 94 24 [4] C7 03 00 00 00 00 B9 02 40 00 00
              8B 3D [4] 48 89 E6 E8 [4] 83 F8 FF 0F 84 [4]
              85 C0 74 ?? 8B 3D [4] B9 00 40 00 00 BA 02 00 00 00
              48 89 EE E8 [4] 8B 3D [4] 0F B7 94 24 [4]
              B9 00 40 00 00 66 C1 CA 08 48 89 E6 66 89 94 24 [4]
              0F B7 D2 E8 [4] 0F B7 84 24 [4] 66 85 C0 0F 84 [4]
              48 89 E7 0F B7 F0 E8 ?? ?? ?? ??
            }
            $recv = {
              45 31 C9 45 31 C0 E9 01 00 00 00 90 53
              4C 63 D1 48 63 FF B8 2D 00 00 00 0F 05
            }
            // AF_INET / SOCK_DGRAM / IPPROTO_UDP.
            $udp = { BF 02 00 00 00 BA 11 00 00 00 BE 02 00 00 00 E8 ?? ?? ?? ?? }
            // Iterate target sockets and buffers; outer branch repeats forever.
            $loop = {
              49 8B 34 DF 41 8B 3C 9E B9 00 40 00 00 48 89 EA
              48 FF C3 E8 [4] 49 39 DC 74 CA EB E1
            }
            $send = {
              45 31 C9 45 31 C0 E9 01 00 00 00 90 53 45 89 C9
              4C 63 D1 48 63 FF B8 2C 00 00 00 0F 05
            }
          condition:
            elf.machine == elf.EM_X86_64 and
            for any s in (0..elf.number_of_sections-1) : (
              elf.sections[s].name == ".text" and
              for any d in (1..#dispatch) : (
                @dispatch[d] >= elf.sections[s].offset and
                @dispatch[d]+!dispatch[d] <= elf.sections[s].offset+elf.sections[s].size and
                for any p in (1..#parser) : (
                  @parser[p] >= elf.sections[s].offset and
                  @parser[p]+!parser[p] <= elf.sections[s].offset+elf.sections[s].size and
                  @dispatch[d]+162+int32(@dispatch[d]+158) == @parser[p]
                ) and
                for any r in (1..#recv) : (
                  @recv[r] >= elf.sections[s].offset and
                  @recv[r]+!recv[r] <= elf.sections[s].offset+elf.sections[s].size and
                  @dispatch[d]+55+int32(@dispatch[d]+51) == @recv[r] and
                  @dispatch[d]+134+int32(@dispatch[d]+130) == @recv[r]
                )
              ) and
              for any l in (1..#loop) : (
                @loop[l] >= elf.sections[s].offset and
                @loop[l]+!loop[l] <= elf.sections[s].offset+elf.sections[s].size and
                for any u in (1..#udp) : (
                  @udp[u] >= elf.sections[s].offset and
                  @udp[u] < @loop[l] and @loop[l]-@udp[u] < 512
                ) and
                for any t in (1..#send) : (
                  @send[t] >= elf.sections[s].offset and
                  @send[t]+!send[t] <= elf.sections[s].offset+elf.sections[s].size and
                  @loop[l]+24+int32(@loop[l]+20) == @send[t]
                )
              )
            )
        }

composite_rules:
  - id: x86-64-framed-udp-flood
    desc: Remote UDP flood with hidden credential table
    crit: hostile
    conf: 0.99
    all:
      - id: x86-64-framed-udp-flood-code
      - id: objectives/lateral-movement/brute-force/iot-creds::xor-encoded-iot-credential-table
