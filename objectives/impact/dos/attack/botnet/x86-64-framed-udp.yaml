# The UDP flood loop must call the send syscall wrapper. The independent
# receive-to-parser path lives under command-and-control; both are required
# for the combined remote-flood claim. Redirected sends must not satisfy it.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86_64]
  attack: T1498.001
  mbc: B0042
composite_rules:
  - id: x86-64-framed-udp-flood-code
    desc: Framed attack parser and UDP flood code
    crit: suspicious
    conf: 0.99
    all:
      - id: objectives/command-and-control/botnet/iot::x86-64-framed-attack-task-code
      - id: micro-behaviors/communications/flood::x86-64-udp-flood-send-loop

  - id: x86-64-framed-udp-flood
    desc: Remote UDP flood with hidden credential table
    crit: hostile
    conf: 0.99
    all:
      - id: x86-64-framed-udp-flood-code
      - id: objectives/lateral-movement/brute-force/iot-creds::xor-encoded-iot-credential-table
