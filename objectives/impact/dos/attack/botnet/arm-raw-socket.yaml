defaults:
  platforms: [linux]
  for: [elf]
  mbc: B0042

composite_rules:
  - id: arm-raw-socket-packet-flood
    desc: ARM IoT bot with raw-socket packet flooding
    crit: hostile
    conf: 0.99
    attack: T1498.001
    all:
      - id: metadata/arch/iot::arm
      - id: micro-behaviors/communications/socket/syscall::arm-oabi-direct-sendto
      - id: micro-behaviors/communications/socket/syscall::arm-oabi-direct-setsockopt
      - id: metadata/binary/anomaly/format::elf-executable-stack
    any:
      - id: micro-behaviors/communications/socket/raw::arm-ipv4-raw-socket-creation
      - id: micro-behaviors/communications/socket/raw::arm-ipv4-raw-socket-creation-r1-first
    needs: 1
