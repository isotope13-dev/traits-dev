defaults:
  platforms: [linux, android]
  for: [elf]
  mbc: B0042
  attack: T1499

traits:
  # V3G4/Mirai downloaders use this architecture-qualified payload convention.
  # The unique Mddos prefix is attack-context-specific rather than a generic
  # architecture basename, so it belongs with the botnet objective.
  - id: mddos-arm-payload-name
    desc: V3G4 Mddos ARM payload basename
    crit: suspicious
    conf: 0.99
    if:
      type: basename
      regex: '(?i)^Mddos\.arm(5|7|64)$'

  # Stripped IoT binaries often omit the symbols that native-flood rules use.
  # Keep this as a high-count vocabulary atom: one protocol label can belong to
  # a test client, while several explicit flood/spoof/raw modes describe an
  # attack-mode table and are useful for future Mirai-family variants.
  # The ATTACK VERB is the discriminator, not the protocol prefix. The previous
  # regex -- `(HTTP|HTTPS|UDP|TCP|SYN|ACK|SSH)-[A-Z0-9-]{2,20}` -- accepted any
  # hyphenated token starting with a protocol name, so the RFC 793 TCP state
  # names alone (SYN-SENT, SYN-RECEIVED, FIN-WAIT-2, TIME-WAIT, LAST-ACK) met
  # count_min: 4 in every userspace TCP stack, and libnice/ICE added TCP-PASS /
  # TCP-ACT / TCP-SO on top. Anchoring on the verb keeps the Mirai/Gafgyt mode
  # table (UDP-FLOOD, ACK-FLOOD, TCP-STOMP, DNS-AMP, SYN-BYPASS) and leaves the
  # protocol half open so novel prefixes in future variants still match.
  - id: udpplain-flood-command
    desc: UDP plain-flood tasking command
    crit: suspicious
    conf: 0.97
    attack: T1498.001
    if:
      type: text
      exact: udpplain
      section: rodata

  - id: source-engine-query-xor18-a
    desc: XOR-obfuscated Source Engine query
    crit: notable
    conf: 0.95
    attack: T1498.001
    if:
      type: hex
      section: .rodata
      pattern: 4C 4B 77 6D 6A 7B 7D 38 5D 76
  - id: source-engine-query-xor18-b
    desc: XOR-obfuscated Source Engine query
    crit: notable
    conf: 0.95
    attack: T1498.001
    if:
      type: hex
      section: .rodata
      pattern: 71 76 7D 38 49 6D 7D 6A 61

  - id: xor29-source-engine-query-payload
    desc: XOR-0x29-obfuscated Source Engine query payload
    crit: suspicious
    conf: 0.96
    attack: T1498.001
    if:
      type: hex
      section: .rodata
      pattern: 7D 7A 46 5C 5B 4A 4C 09 6C 47 4E 40 47 4C 09 78 5C 4C 5B 50
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: xor07-source-engine-query-payload
    desc: XOR-0x07-obfuscated Source Engine query payload
    crit: suspicious
    conf: 0.96
    attack: T1498.001
    if:
      type: hex
      section: .rodata
      pattern: 53 54 68 72 75 64 62 27 42 69 60 6E 69 62 27 56 72 62 75 7E
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: target-port-duration-format
    desc: Target port duration command format
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: "%15s %63s %d %d"

  - id: stop-attack-command
    desc: STOP command with attack parser
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: 'STOP.{0,200}%15s %63s %d %d|%15s %63s %d %d.{0,200}STOP'

  # Hex bytes, not extracted text: the string extractor drops the GRE run on
  # packed uClibc builds (it sits between binary attack-table bytes and
  # never reaches the text corpus), while the adjacent GTCP run extracts
  # normally. A byte pattern sees both; both labels stay symmetric.
  - id: gre-flood-status-label
    desc: GRE flood in-progress status label
    crit: suspicious
    conf: 0.98
    attack: T1498.001
    if:
      type: hex
      section: ".rodata"
      # "FLOODING GRE"
      pattern: "46 4C 4F 4F 44 49 4E 47 20 47 52 45"

  - id: gtcp-flood-status-label
    desc: GTCP flood in-progress status label
    crit: suspicious
    conf: 0.98
    attack: T1498.001
    if:
      type: hex
      section: ".rodata"
      # "FLOODING GTCP"
      pattern: "46 4C 4F 4F 44 49 4E 47 20 47 54 43 50"

composite_rules:
  - id: udpplain-c2-flood-bot
    desc: C2-tasked UDP plain-flood bot
    crit: hostile
    conf: 0.99
    attack: T1498.001
    mbc: B0030
    all:
      - id: udpplain-flood-command
      - id: micro-behaviors/communications/socket/tcp::pong-format-elf
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
    # Dynamic ELFs expose socket/connect as symbols; stripped static binaries
    # may retain only direct network syscalls. Either surface proves that the
    # controller vocabulary belongs to executable network behavior.
    any:
      - id: micro-behaviors/communications/socket/connect/attempt::socket-create-and-connect-syscalls
      # Static binaries can expose a recovered connect syscall without a
      # separately recovered socket-create fact. The connect itself proves
      # this controller grammar is attached to live network behavior.
      - id: micro-behaviors/communications/socket/connect/attempt::socket-connect
      - id: micro-behaviors/communications/socket/connect/attempt::connect-symbol
      - id: micro-behaviors/communications/socket/syscall/combined::ppc-socketcall-network-io
      - id: micro-behaviors/communications/socket/send/datagram::syscall-sendto
      - id: micro-behaviors/communications/socket/syscall/transfer::arm-oabi-direct-sendto
      - id: micro-behaviors/communications/socket/syscall/combined::arc-network-io-syscalls
      - id: micro-behaviors/communications/socket/syscall/dispatch::m68k-socketcall-wrapper
      - id: micro-behaviors/communications/socket/syscall/dispatch::sh-socketcall-wrapper
      - id: micro-behaviors/communications/socket/syscall/combined::mips-direct-network-syscalls
      # Statically linked ARM bots can expose the raw-socket setup sequence
      # even when cleave cannot recover the socket or sendto syscall wrapper.
      - id: micro-behaviors/communications/socket/raw::arm-ipv4-raw-socket-creation
      - id: micro-behaviors/communications/socket/create::i386-musl-socket-wrapper
    needs: 1

  - id: v3g4-mddos-arm-payload
    desc: V3G4 Mddos ARM DDoS bot payload
    crit: hostile
    conf: 0.99
    attack: T1498.001
    all:
      - id: mddos-arm-payload-name
      - id: metadata/arch/arm::arm

  - id: iot-attack-command-cluster
    desc: IoT bot multi-vector attack command cluster
    crit: suspicious
    conf: 0.98
    any:
      - id: metadata/binary/symbols/name/token/execution::stop-all-label
      - id: micro-behaviors/communications/flood::udp-flood-attack-label
      - id: micro-behaviors/communications/flood::syn-bypass-attack-label
      - id: micro-behaviors/communications/flood::http2-flood-attack-label
    needs: 3

  # A static exotic-architecture binary that carries a Source Engine query
  # payload, an SSDP broadcast/reflection request, and local TCP-state
  # inspection has a coordinated attack workflow, not a generic discovery use.
  - id: iot-multivector-ddos-bot
    desc: IoT bot with multi-vector DDoS tasking
    crit: hostile
    conf: 0.99
    attack: T1498.001
    all:
      - id: iot-attack-command-cluster
      - type: trait
        id: metadata/lang/natural/vocabulary/security::udp-flood
      - type: trait
        id: micro-behaviors/communications/http/message::http2-preface

  # Stripped Mirai builds drop their attack-mode labels but still carry the raw
  # 24-byte HTTP/2 preface they push down thousands of recycled sockets. A
  # static telnet brute-forcer that sends the preface without any HPACK
  # pseudo-header table cannot speak HTTP/2; the preface is flood payload.
  - id: iot-bot-http2-preface-connection-flood
    desc: Brute-forcing IoT bot with HTTP/2 flood preface
    crit: hostile
    conf: 0.95
    attack: T1499.002,T1498
    mbc: B0030
    all:
      - id: micro-behaviors/communications/http/message::http2-preface
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-access
      - id: metadata/binary/linking/records::elf-dynamic-linker-metadata-absent
      - id: micro-behaviors/communications/socket/connect/attempt::socket-create-and-connect-syscalls
    unless:
      - id: micro-behaviors/communications/http/message::hpack-authority-pseudo-header

  - id: http2-underscore-flood-iot-bot
    desc: IoT bot with UDP/HTTPS flood tasking verbs
    crit: hostile
    conf: 0.99
    attack: T1498.001,T1071
    mbc: B0030
    all:
      - id: micro-behaviors/communications/flood::udp-flood-attack-label
      - id: micro-behaviors/communications/flood::https-flood-attack-label
      - id: metadata/binary/linking/records::elf-dynamic-linker-metadata-absent
    any:
      - id: micro-behaviors/communications/http/message::http2-preface
      - id: micro-behaviors/communications/socket/tcp::ping-pong-keepalive-elf
    needs: 1

  - id: source-marker-iot-process-profile
    desc: Source marker with IoT profiling and process launch
    crit: hostile
    conf: 0.98
    attack: T1498.001,T1082,T1106
    mbc: B0030
    all:
      - id: micro-behaviors/communications/socket/udp::source-engine-query-marker
      - id: micro-behaviors/os/sysinfo/cpu::sys-devices
      - id: micro-behaviors/fs/proc/system::system-stat
      - id: micro-behaviors/process/replace::arm-eabi-execve
      - id: micro-behaviors/os/syscall/clone::arm-eabi-clone
      - id: micro-behaviors/os/sysinfo/platform/kernel::arm-eabi-uname
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: source-engine-query-xor18
    desc: XOR-obfuscated Source Engine query
    crit: suspicious
    conf: 0.97
    attack: T1498.001
    all:
      - id: source-engine-query-xor18-a
      - id: source-engine-query-xor18-b

  - id: iot-ddos-attack-vector-set
    all:
      - id: objectives/impact/dos/attack/flood::native-ddos-mode-vocabulary
    desc: IoT bot DDoS vector set
    crit: suspicious
    conf: 0.96
    any:
      - id: micro-behaviors/communications/socket/udp::source-engine-query-payload
      - id: objectives/impact/dos/flood::multi-vector-ddos-bot
      - id: source-engine-query-xor18
      - id: xor07-source-engine-query-payload
      - id: xor29-source-engine-query-payload
      - id: micro-behaviors/communications/http/message::http2-preface
      - id: micro-behaviors/communications/socket/udp::game-query-payload-forms
    needs: 2

  # A DDoS vector set paired with a Mirai credential table and a raw-IP
  # endpoint identifies an IoT bot, rather than a game/networking client that
  # merely carries one protocol marker.
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  # This combination catches stripped ARM bot builds whose attack-mode table
  # is text-only. It stays narrow enough to leave ARM network diagnostics and
  # game clients alone unless they also look like a static IoT bot and pin a
  # public endpoint while issuing direct socket syscalls.
  - id: native-iot-multivector-ddos-bot
    desc: Static ARM IoT DDoS mode cluster
    crit: hostile
    conf: 0.99
    attack: T1498.001
    mbc: B0030
    all:
      - id: objectives/impact/dos/attack/flood::native-ddos-mode-vocabulary
      - id: metadata/arch/arm::arm
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: well-known/lib/native/uclibc::static-uclibc-string-tables
      - id: micro-behaviors/communications/socket/syscall/combined::arm-literal-pool-network-syscalls
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
  # MIPS controller tasking must accompany the actual packet rewrite loop.
  - id: mips-commanded-raw-packet-flood
    desc: MIPS command dispatcher with raw socket and packet rewrite loop
    crit: hostile
    conf: 0.99
    attack: T1498.001
    mbc: B0030
    platforms: [linux]
    arch: [mips]
    all:
      - id: micro-behaviors/data/control-flow/branch::mips-r6-byte-command-switch
      - id: micro-behaviors/communications/socket/raw::mips-r6-ipv4-raw-socket-arguments
      - id: micro-behaviors/communications/socket/udp::mips-r6-udp-port-checksum-rewrite-loop
      - id: micro-behaviors/fs/proc/info/cmdline::downloader-shell-command-target-table

  - id: mirai-iot-ddos-bot
    desc: Mirai IoT bot with DDoS and raw-IP control
    crit: hostile
    conf: 0.99
    attack: "T1110.001,T1498.001,T1105"
    mbc: B0030
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-access
      - id: iot-ddos-attack-vector-set
      - id: micro-behaviors/communications/ip/literal::http-ip-url

  - id: persistent-mips-source-query-bot
    desc: Persistent MIPS IoT bot with encoded Source-query flood payload
    crit: hostile
    conf: 0.99
    attack: T1498.001,T1543.002,T1059.004
    mbc: B0030
    platforms: [linux]
    all:
      - id: metadata/arch/iot::mips
      - id: micro-behaviors/os/service/unit-field::native-unit-template
    any:
      - id: xor29-source-engine-query-payload
      - id: xor07-source-engine-query-payload
      - id: micro-behaviors/communications/socket/udp::source-engine-query-payload
      - id: objectives/impact/dos/flood::multi-vector-ddos-bot
    unless:
      - id: objectives/impact/dos/gaming-platform::source-query-mips-syscall-ddos-bot
  - id: persistent-arm-source-query-bot
    desc: ARM bot systemd and Source-query payload
    crit: hostile
    conf: 0.99
    attack: T1498.001,T1543.002,T1059.004
    mbc: B0030
    platforms: [linux]
    all:
      - id: metadata/arch/arm::arm
      - id: micro-behaviors/os/service/unit-field::native-unit-template
    any:
      - id: xor29-source-engine-query-payload
      - id: xor07-source-engine-query-payload
      - id: micro-behaviors/communications/socket/udp::source-engine-query-payload
      - id: objectives/impact/dos/flood::multi-vector-ddos-bot

  - id: ddos-bot-bandwidth-tiering
    desc: DDoS bot bandwidth tiering logic
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/discovery/system/fingerprint/network::speedtest-bandwidth-profiling
    any:
      - id: micro-behaviors/communications/socket/udp::source-engine-query-payload
      - id: objectives/impact/dos/flood::multi-vector-ddos-bot
      - id: source-engine-query-xor18
      - id: objectives/impact/dos/gaming-platform::gaming-platform-ddos
      - id: micro-behaviors/os/firewall/iptables::iptables-accept-dport

  - id: doh-backed-iot-ddos-bot
    desc: DoH-backed IoT DDoS bot
    crit: hostile
    conf: 0.97
    all:
      - id: iot-ddos-attack-vector-set
      - id: micro-behaviors/communications/dns/doh::doh-wireformat-client

  - id: rest-c2-iot-ddos-command-parser
    desc: REST C2 IoT DDoS command parser
    crit: hostile
    conf: 0.96
    all:
      - id: target-port-duration-format
      - id: objectives/command-and-control/botnet/polling::bot-heartbeat-endpoint
      - id: objectives/command-and-control/botnet/polling::bot-command-poll-endpoint
    any:
      - id: stop-attack-command

  - id: staged-iot-ddos-bot
    desc: IoT DDoS bot with direct-IP payload staging
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/transfer::multiple-download-clients-architecture-references
    any:
      - id: iot-ddos-attack-vector-set
      - id: objectives/impact/dos/gaming-platform::gaming-platform-ddos
      - id: micro-behaviors/communications/ip/literal::direct-ip-http-client
      - id: micro-behaviors/communications/http/download/curl::shell-silent-ip-download
    needs: 3

  - id: gre-gtcp-flood-status-bot
    desc: Static ARM bot reporting GRE and GTCP flood status
    crit: hostile
    conf: 0.99
    attack: T1498.001
    mbc: B0030
    platforms: [linux]
    all:
      - id: gre-flood-status-label
      - id: gtcp-flood-status-label
      - id: metadata/arch/arm::arm
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: micro-behaviors/fs/path/device/special::watchdog-device

