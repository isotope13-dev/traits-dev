defaults:
  platforms: [linux, android]
  for: [elf]
  mbc: B0042
  attack: T1499

traits:
  # V3G4/Mirai downloaders use this architecture-qualified payload convention.
  # The unique Mddos prefix is attack-context-specific rather than a generic
  # architecture basename, so it belongs with the botnet objective.
  - id: mddos-arm-payload-name
    desc: V3G4 Mddos ARM payload basename
    crit: suspicious
    conf: 0.99
    if:
      type: basename
      regex: '(?i)^Mddos\.arm(5|7|64)$'

  # Keep these as separate atoms so the cluster below requires distinct
  # attack-mode labels.  A count_min on one alternation counts repeated
  # occurrences, so a normal networking utility's repeated BROADCAST help
  # text was previously enough to look like an IoT bot.
  - id: stop-all-attack-label
    desc: STOP_ALL attack command label
    crit: component
    conf: 0.9
    if:
      type: text
      word: STOP_ALL
  - id: udp-flood-attack-label
    desc: UDP_FLOOD attack command label
    crit: component
    conf: 0.9
    if:
      type: text
      word: UDP_FLOOD
  - id: syn-bypass-attack-label
    desc: SYN_BYPASS attack command label
    crit: component
    conf: 0.9
    if:
      type: text
      word: SYN_BYPASS
  - id: http2-flood-attack-label
    desc: HTTP2_FLOOD attack command label
    crit: component
    conf: 0.9
    if:
      type: text
      word: HTTP2_FLOOD

  # Stripped IoT binaries often omit the symbols that native-flood rules use.
  # Keep this as a high-count vocabulary atom: one protocol label can belong to
  # a test client, while several explicit flood/spoof/raw modes describe an
  # attack-mode table and are useful for future Mirai-family variants.
  # The ATTACK VERB is the discriminator, not the protocol prefix. The previous
  # regex -- `(HTTP|HTTPS|UDP|TCP|SYN|ACK|SSH)-[A-Z0-9-]{2,20}` -- accepted any
  # hyphenated token starting with a protocol name, so the RFC 793 TCP state
  # names alone (SYN-SENT, SYN-RECEIVED, FIN-WAIT-2, TIME-WAIT, LAST-ACK) met
  # count_min: 4 in every userspace TCP stack, and libnice/ICE added TCP-PASS /
  # TCP-ACT / TCP-SO on top. Anchoring on the verb keeps the Mirai/Gafgyt mode
  # table (UDP-FLOOD, ACK-FLOOD, TCP-STOMP, DNS-AMP, SYN-BYPASS) and leaves the
  # protocol half open so novel prefixes in future variants still match.
  - id: native-ddos-mode-vocabulary
    desc: Native DDoS mode label cluster
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '\b[A-Z0-9]{2,8}-(FLOOD|STOMP|AMP|BYPASS)\b'
    # GCC's control-flow optimizer uses JUMP-BYPASS as an internal diagnostic
    # label. It is not an attack mode and must not satisfy this vocabulary.
    not:
      - exact: JUMP-BYPASS

  # Used by compact Mirai-derived clients as the controller-selected plain
  # UDP flood verb. Unlike generic "udp" vocabulary, this concatenated mode
  # name has no ordinary protocol meaning.
  - id: udpplain-flood-command
    desc: UDP plain-flood tasking command
    crit: suspicious
    conf: 0.97
    attack: T1498.001
    if:
      type: text
      exact: udpplain
      section: rodata

  - id: source-engine-query-payload
    desc: Source Engine query payload
    crit: suspicious
    conf: 0.94
    attack: T1498.001
    if:
      type: text
      substr: TSource Engine Query
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/game/mod::dmtl-linux-mod-tool

  - id: source-engine-query-marker
    desc: Source Engine query-family payload marker
    crit: suspicious
    conf: 0.86
    attack: T1498.001
    if:
      type: text
      substr: TSource Engine
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/game/mod::dmtl-linux-mod-tool

  - id: source-engine-query-xor18-a
    desc: XOR-obfuscated Source Engine query
    crit: component
    conf: 0.95
    attack: T1498.001
    if:
      type: hex
      section: .rodata
      pattern: 4C 4B 77 6D 6A 7B 7D 38 5D 76
  - id: source-engine-query-xor18-b
    desc: XOR-obfuscated Source Engine query
    crit: component
    conf: 0.95
    attack: T1498.001
    if:
      type: hex
      section: .rodata
      pattern: 71 76 7D 38 49 6D 7D 6A 61

  - id: xor29-source-engine-query-payload
    desc: XOR-0x29-obfuscated Source Engine query payload
    crit: suspicious
    conf: 0.96
    attack: T1498.001
    if:
      type: hex
      section: .rodata
      pattern: 7D 7A 46 5C 5B 4A 4C 09 6C 47 4E 40 47 4C 09 78 5C 4C 5B 50
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: xor07-source-engine-query-payload
    desc: XOR-0x07-obfuscated Source Engine query payload
    crit: suspicious
    conf: 0.96
    attack: T1498.001
    if:
      type: hex
      section: .rodata
      pattern: 53 54 68 72 75 64 62 27 42 69 60 6E 69 62 27 56 72 62 75 7E
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: target-port-duration-format
    desc: Target port duration command format
    crit: component
    conf: 0.9
    if:
      type: text
      exact: "%15s %63s %d %d"

  - id: stop-attack-command
    desc: STOP command with attack parser
    crit: component
    conf: 0.75
    if:
      type: text
      regex: 'STOP.{0,200}%15s %63s %d %d|%15s %63s %d %d.{0,200}STOP'

composite_rules:
  - id: udpplain-c2-flood-bot
    desc: C2-tasked UDP plain-flood bot
    crit: hostile
    conf: 0.99
    attack: T1498.001
    mbc: B0030
    all:
      - id: udpplain-flood-command
      - id: micro-behaviors/communications/socket/tcp::pong-format-elf
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
    # Dynamic ELFs expose socket/connect as symbols; stripped static PowerPC
    # builds retain only the socketcall operation wrappers. Either surface
    # proves that the controller vocabulary belongs to a network client.
    any:
      - id: micro-behaviors/communications/socket/create::linux-network-client
      - id: micro-behaviors/communications/socket/connect::connect-symbol
      - id: micro-behaviors/communications/socket/syscall::ppc-socketcall-network-io
    needs: 1

  - id: native-mode-source-query-ddos-bot
    desc: ARM bot combines DDoS commands with Source query flooding
    crit: hostile
    conf: 0.99
    attack: T1498.001
    mbc: B0030
    all:
      - id: native-ddos-mode-vocabulary
      - id: source-engine-query-payload
      - id: metadata/arch/iot::arm
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: v3g4-mddos-arm-payload
    desc: V3G4 Mddos ARM DDoS bot payload
    crit: hostile
    conf: 0.99
    attack: T1498.001
    all:
      - id: mddos-arm-payload-name
      - id: metadata/arch/iot::arm

  - id: iot-attack-command-cluster
    desc: IoT bot multi-vector attack command cluster
    crit: suspicious
    conf: 0.98
    any:
      - id: stop-all-attack-label
      - id: udp-flood-attack-label
      - id: syn-bypass-attack-label
      - id: http2-flood-attack-label
    needs: 3

  # An IoT DDoS bot that carries both an SSDP reflection probe and a Source
  # Engine query payload while inspecting local TCP state has a coordinated
  # attack/profile workflow, not a generic network diagnostic capability.
  - id: ssdp-source-query-procfs-iot-bot
    desc: IoT bot combines SSDP reflection and Source query
    crit: hostile
    conf: 0.98
    attack: T1498.001,T1498.002,T1016
    mbc: B0030
    platforms: [linux]
    all:
      - id: objectives/impact/dos/amplification::service-discovery-reflection
      - id: source-engine-query-payload
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: iot-multivector-ddos-bot
    desc: IoT bot with multi-vector DDoS tasking
    crit: hostile
    conf: 0.99
    attack: T1498.001
    all:
      - id: iot-attack-command-cluster
      - type: trait
        id: objectives/command-and-control/channel/irc/bot::attack-udp
      - type: trait
        id: micro-behaviors/communications/http/message::http2-preface

  - id: source-query-anti-analysis-ddos-bot
    desc: Source query payload with debugger and CPU checks
    crit: hostile
    conf: 0.98
    attack: T1498.001
    all:
      - id: source-engine-query-payload
      - id: micro-behaviors/os/sysinfo/platform/kernel::ptrace-debugger
      - id: micro-behaviors/os/sysinfo/cpu::sys-devices
    any:
      - id: micro-behaviors/fs/proc/system::system-stat
      - id: micro-behaviors/fs/proc/system::system-stat-xor07
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: source-marker-iot-process-profile
    desc: Source marker with IoT profiling and process launch
    crit: hostile
    conf: 0.98
    attack: T1498.001,T1082,T1106
    mbc: B0030
    all:
      - id: source-engine-query-marker
      - id: micro-behaviors/os/sysinfo/cpu::sys-devices
      - id: micro-behaviors/fs/proc/system::system-stat
      - id: micro-behaviors/process/create/direct::arm-eabi-execve
      - id: micro-behaviors/process/create/direct::arm-eabi-clone
      - id: micro-behaviors/os/sysinfo/platform/kernel::arm-eabi-uname
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: source-query-arm-cipher-ddos-bot
    desc: Static ARM Source-query bot with stream-cipher support
    crit: hostile
    conf: 0.99
    attack: T1498.001,T1027
    mbc: B0030
    all:
      - id: source-engine-query-marker
      - id: metadata/arch/iot::arm
      - id: metadata/binary/linking/static::elf-needed-libs-zero
      - id: micro-behaviors/crypto/symmetric/stream::chacha-salsa-constant
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: source-query-mips-syscall-ddos-bot
    desc: Static MIPS Source-query bot using raw syscalls
    crit: hostile
    conf: 0.99
    attack: T1498.001,T1106
    mbc: B0030
    all:
      - id: source-engine-query-marker
      - id: metadata/arch/iot::mips
      - id: metadata/binary/linking/static::elf-needed-libs-zero
    any:
      - id: micro-behaviors/os/syscall/raw::mips-direct-syscall-instruction-be
      - id: micro-behaviors/os/syscall/raw::mips-direct-syscall-instruction-le
    needs: 1
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: source-query-static-pty-iot-bot
    desc: Static embedded Source-query bot with PTY and entropy access
    crit: hostile
    conf: 0.99
    attack: T1498.001,T1059
    mbc: B0030
    all:
      - id: source-engine-query-marker
      - id: metadata/binary/linking/static::elf-needed-libs-zero
      - id: micro-behaviors/fs/path/device/terminal::dev-ptmx
      - id: micro-behaviors/os/random/crypto::urandom
    any:
      - id: metadata/arch/iot::arm
      - id: metadata/arch/iot::mips
    needs: 1
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: source-engine-query-xor18
    desc: XOR-obfuscated Source Engine query
    crit: suspicious
    conf: 0.97
    attack: T1498.001
    all:
      - id: source-engine-query-xor18-a
      - id: source-engine-query-xor18-b

  - id: iot-ddos-attack-vector-set
    desc: IoT bot DDoS vector set
    crit: suspicious
    conf: 0.96
    any:
      - id: source-engine-query-payload
      - id: source-engine-query-xor18
      - id: xor07-source-engine-query-payload
      - id: xor29-source-engine-query-payload
      - id: micro-behaviors/communications/http/message::http2-preface
      - id: objectives/impact/dos/amplification::amplification-payload-common-any
    needs: 2

  # A DDoS vector set paired with a Mirai credential table and a raw-IP
  # endpoint identifies an IoT bot, rather than a game/networking client that
  # merely carries one protocol marker.
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  # This combination catches stripped ARM bot builds whose attack-mode table
  # is text-only. It stays narrow enough to leave ARM network diagnostics and
  # game clients alone unless they also look like a static IoT bot and pin a
  # public endpoint while issuing direct socket syscalls.
  - id: native-iot-multivector-ddos-bot
    desc: Static ARM IoT DDoS mode cluster
    crit: hostile
    conf: 0.99
    attack: T1498.001
    mbc: B0030
    all:
      - id: native-ddos-mode-vocabulary
      - id: metadata/arch/iot::arm
      - id: metadata/binary/linking/static::elf-needed-libs-zero
      - id: well-known/lib/native/uclibc::static-uclibc-string-tables
      - id: micro-behaviors/communications/socket/syscall::arm-literal-pool-network-syscalls
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
  - id: mirai-iot-ddos-bot
    desc: Mirai IoT bot with DDoS and raw-IP control
    crit: hostile
    conf: 0.99
    attack: "T1110.001,T1498.001,T1105"
    mbc: B0030
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-access
      - id: iot-ddos-attack-vector-set
      - id: micro-behaviors/communications/ip/literal::http-ip-url

  - id: persistent-mips-source-query-bot
    desc: Persistent MIPS IoT bot with encoded Source-query flood payload
    crit: hostile
    conf: 0.99
    attack: T1498.001,T1543.002,T1059.004
    mbc: B0030
    platforms: [linux]
    all:
      - id: metadata/arch/iot::mips
      - id: objectives/persistence/system/service/systemd::native-unit-authoring
    any:
      - id: xor29-source-engine-query-payload
      - id: xor07-source-engine-query-payload
      - id: source-engine-query-payload

  - id: persistent-arm-source-query-bot
    desc: Persistent ARM IoT bot with encoded Source-query flood payload
    crit: hostile
    conf: 0.99
    attack: T1498.001,T1543.002,T1059.004
    mbc: B0030
    platforms: [linux]
    all:
      - id: xor29-source-engine-query-payload
      - id: metadata/arch/iot::arm
      - id: micro-behaviors/communications/socket/syscall::arm-direct-network-syscalls
      - id: objectives/persistence/system/service/systemd::native-unit-authoring

  - id: xor18-source-query-shell-ddos-bot
    desc: XOR18 Source-query shell DDoS bot
    crit: hostile
    conf: 0.98
    all:
      - id: source-engine-query-xor18
      - id: micro-behaviors/process/create/shell/encoded::unix-shell-paths-xor18
      - id: objectives/anti-static/obfuscation/encoding/xor::xor18-watchdog-paths
  - id: xor18-source-query-covert-shell-ddos-bot
    desc: XOR18 Source-query covert shell DDoS bot
    crit: hostile
    conf: 0.97
    all:
      - id: source-engine-query-xor18
      - id: micro-behaviors/fs/path/device/special::dev-misc-watchdog-xor18
    any:
      - id: well-known/lib/native/uclibc::static-uclibc-string-tables
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text

  - id: ddos-bot-bandwidth-tiering
    desc: DDoS bot bandwidth tiering logic
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/discovery/system/fingerprint/network::speedtest-bandwidth-profiling
    any:
      - id: source-engine-query-payload
      - id: source-engine-query-xor18
      - id: objectives/impact/dos/gaming-platform::gaming-platform-ddos
      - id: micro-behaviors/os/firewall/iptables::iptables-accept-dport

  - id: doh-backed-iot-ddos-bot
    desc: DoH-backed IoT DDoS bot
    crit: hostile
    conf: 0.97
    all:
      - id: iot-ddos-attack-vector-set
      - id: micro-behaviors/communications/dns/doh::doh-wireformat-client

  - id: rest-c2-iot-ddos-command-parser
    desc: REST C2 IoT DDoS command parser
    crit: hostile
    conf: 0.96
    all:
      - id: target-port-duration-format
      - id: objectives/command-and-control/botnet/iot::bot-heartbeat-endpoint
      - id: objectives/command-and-control/botnet/iot::bot-command-poll-endpoint
    any:
      - id: stop-attack-command

  - id: staged-iot-ddos-bot
    desc: IoT DDoS bot with direct-IP payload staging
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/botnet/network-device::multi-fetch-multi-arch-dropper
    any:
      - id: iot-ddos-attack-vector-set
      - id: objectives/impact/dos/gaming-platform::gaming-platform-ddos
      - id: objectives/command-and-control/beacon/network/http::direct-http-c2-ip-url
      - id: objectives/command-and-control/dropper/delivery/download::shell-silent-hardcoded-download-staging
    needs: 3

  - id: source-query-rival-service-killer
    desc: Source-query DDoS bot that disables embedded services
    crit: hostile
    conf: 0.99
    attack: T1498.001,T1562.001
    mbc: B0030
    platforms: [linux]
    all:
      - id: source-engine-query-marker
      - id: objectives/impact/degrade/rival-bot/competitor::embedded-bot-rival-killer
