defaults:
  platforms: [linux]
  for: [elf]
  attack: T1498.001
  mbc: B0030

traits:
  - id: vision-attack-dispatch-symbol
    desc: Vision attack dispatcher symbol
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: main.dispatchAttack
      section: .gopclntab
  - id: vision-attack-worker-cluster--proxy-family-a
    desc: Vision proxy worker family A
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'main\.(alakazamProxy|machampProxy|zoruaWithProxyFast)'
      section: .gopclntab
  - id: vision-attack-worker-cluster--proxy-family-b
    desc: Vision proxy worker family B
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'main\.(gyaradosProxy|darkraiProxy)'
      section: .gopclntab

composite_rules:
  - id: vision-attack-worker-cluster
    desc: Vision attack worker symbol cluster
    crit: notable
    conf: 0.98
    any:
      - id: vision-attack-worker-cluster--proxy-family-a
      - id: vision-attack-worker-cluster--proxy-family-b
  - id: vision-attack-dispatch
    desc: Vision bot attack dispatcher
    crit: hostile
    conf: 0.99
    all:
      - id: vision-attack-dispatch-symbol
      - id: vision-attack-worker-cluster
