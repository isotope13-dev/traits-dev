# Whole-string attack-mode selectors. A single token is only a name; several
# hyphenated flood selectors in a static ELF that also carries an external
# address are the bot's dispatch table. Packet-construction routines stay in
# attack/flood.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1498.001

traits:
  - id: udp-hyphen-bypass-mode-name
    desc: Hyphenated UDP bypass attack-mode token
    crit: component
    conf: 0.94
    if:
      type: text
      exact: udp-bypass
  - id: tcp-hyphen-bypass-mode-name
    desc: Hyphenated TCP bypass attack-mode token
    crit: component
    conf: 0.94
    if:
      type: text
      exact: tcp-bypass
  - id: udp-pps-mode-name
    desc: UDP packets-per-second attack-mode token
    crit: component
    conf: 0.94
    if:
      type: text
      exact: udp-pps
  - id: tcp-stomp-mode-name
    desc: TCP stomp attack-mode token
    crit: component
    conf: 0.95
    if:
      type: text
      exact: tcp-stomp

composite_rules:
  - id: hyphenated-flood-mode-dispatcher
    desc: Static ELF dispatches hyphenated UDP and TCP flood modes
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/linking/records::elf-dynamic-linker-metadata-and-needed-libs-absent
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
    needs: 3
    any:
      - id: udp-hyphen-bypass-mode-name
      - id: tcp-hyphen-bypass-mode-name
      - id: udp-pps-mode-name
      - id: tcp-stomp-mode-name
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
