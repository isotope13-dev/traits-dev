defaults:
  platforms:
  - linux
  for:
  - elf

composite_rules:
- id: go-main-attack-handler-cluster
  desc: Go ELF exposes multiple named protocol attack handlers
  crit: suspicious
  conf: 0.99
  needs: 3
  any:
  - id: objectives/impact/dos/attack/flood::go-main-udp-attack-handler
  - id: objectives/impact/dos/attack/flood::go-main-tcp-attack-handler
  - id: objectives/impact/dos/attack/flood::go-main-syn-attack-handler
  - id: objectives/impact/dos/attack/flood::go-main-http-attack-handler
- id: go-multivector-network-flood-bot
  desc: Go ELF combines protocol floods, raw sockets, and concurrent workers
  crit: hostile
  conf: 0.99
  attack: T1498.001
  all:
  - id: objectives/impact/dos/attack/multi-vector::go-main-attack-handler-cluster
  - id: micro-behaviors/communications/socket/raw::go-rawsocketcall-symbol
  - id: micro-behaviors/communications/http/client/library::go-http-client-do-string
  - id: micro-behaviors/process/thread/create::go-runtime-newproc-binary
- id: go-named-multivector-network-flood
  desc: Go ELF dispatches named multi-protocol floods over network clients
  crit: hostile
  conf: 0.99
  attack: T1498.001
  all:
  - id: objectives/impact/dos/attack/multi-vector::go-main-attack-handler-cluster
  - id: micro-behaviors/communications/http/client/library::go-http-client-do-string
  - id: metadata/file/profile/socket-api::go-net-dialtimeout-text
