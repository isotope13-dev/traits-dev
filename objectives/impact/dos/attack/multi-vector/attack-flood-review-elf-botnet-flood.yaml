defaults:
  platforms: [unix, android]
  for: [elf]
  mbc: B0042
  attack: T1499
composite_rules:
  - id: start-flood-mode-name-cluster
    desc: start_flood bot multi-vector mode names
    crit: suspicious
    conf: 0.98
    attack: T1498.001
    needs: 3
    any:
      - id: objectives/impact/dos/attack/flood::tcpbypass-mode-name
      - id: objectives/impact/dos/attack/flood::start-flood-mode-ovhflood
      - id: objectives/impact/dos/attack/flood::start-flood-mode-udp-legit
      - id: objectives/impact/dos/attack/flood::start-flood-mode-tcp-legit
      - id: objectives/impact/dos/attack/flood::start-flood-mode-ovhbypass
      - id: objectives/impact/dos/attack/flood::start-flood-mode-icmp-gre
      - id: objectives/impact/dos/attack/flood::start-flood-mode-udpcustom
  - id: bypass-mode-name-cluster
    desc: Several bare DDoS bypass attack mode names
    # Whole-string selector names from a bot's attack-mode table.  Each name is
    # a fragment on its own; three distinct selectors form the table.
    crit: suspicious
    conf: 0.95
    attack: T1498.001
    platforms: [linux, android]
    needs: 3
    any:
      - id: objectives/impact/dos/attack/flood::tcpbypass-mode-name
      - id: objectives/impact/dos/attack/flood::tlsplus-mode-name
      - id: objectives/impact/dos/attack/flood::tlsplusbypass-mode-name
      - id: objectives/impact/dos/attack/flood::udp-bypass-mode-name
  - id: static-elf-start-flood-ddos-bot
    desc: Static multi-vector flood dispatcher and IP
    crit: hostile
    conf: 0.99
    attack: T1498.001
    all:
      - id: objectives/impact/dos/attack/flood::start-flood-dispatcher-usage
      - id: start-flood-mode-name-cluster
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
    any:
      - id: metadata/arch/arm::arm
      - id: metadata/arch/arm64::arm64-elf
      - id: metadata/arch/iot::mips
      - id: metadata/arch/iot::powerpc
      - id: metadata/arch/iot::superh
      - id: metadata/binary/linking/records::x86-64-static-stripped-executable
    needs: 1
    # Prefer the more specific UDP/raw-socket flood finding when present.
    unless:
      - id: objectives/impact/dos/udp::start-flood-raw-socket-ddos-bot
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: static-elf-multivector-flood-bot
    desc: Static ELF DDoS bot with multi-vector flood routines and pinned host
    crit: hostile
    conf: 0.99
    attack: T1498.001
    mbc: B0030
    all:
      - id: native-multivector-attack-function-cluster
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
    any:
      - id: metadata/arch/arm::arm
      - id: metadata/arch/arm64::arm64-elf
      - id: metadata/arch/iot::mips
      - id: metadata/arch/iot::powerpc
      - id: metadata/arch/iot::superh
      - id: metadata/binary/linking/records::x86-64-static-stripped-executable
    needs: 1
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: raw-http-multivector-flooder
    desc: ELF carries UDPRAW, TCPRAW, and an HTTP GET flood template
    crit: hostile
    conf: 0.97
    near_bytes: 2048
    all:
      - id: objectives/impact/dos/attack/flood::udpraw-mode
      - id: objectives/impact/dos/tcp::tcpraw-mode-token
      - id: micro-behaviors/communications/http/get::formatted-get-host-template
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: multi-vector-bot-flooder
    desc: Multi-vector botnet flood capability
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/dos/attack/flood::http-flood-bot-functions
      - id: objectives/impact/dos/attack/flood::udpraw-mode
      - id: objectives/impact/dos/attack/flood::random-target-ip
  - id: native-multivector-http-flooder
    desc: Native UDPRAW HTTP random-body flood client
    crit: hostile
    conf: 0.99
    attack: T1498.001
    all:
      - id: objectives/impact/dos/attack/flood::udpraw-mode
      - id: micro-behaviors/communications/http/request/body/construction::fixed-random-data-form-body
      - id: micro-behaviors/communications/http/post::post-request-line
  - id: native-multivector-attack-function-cluster
    desc: Flood functions and attack-related markers
    crit: suspicious
    conf: 0.97
    needs: 3
    any:
      - id: objectives/impact/dos/attack/flood::vse-attack-function-name
      - id: objectives/impact/dos/attack/flood::send-stdhex-symbol
      - id: objectives/impact/dos/attack/flood::send-udp-attack-symbol
      - id: objectives/impact/dos/attack/flood::discord-attack-symbol
      - id: objectives/impact/dos/attack/flood::sendhttphex-symbol
      - id: objectives/impact/dos/attack/flood::sendhttptwo-symbol
      - id: micro-behaviors/communications/socket/init::initconnection-function-name
      - id: objectives/impact/dos/attack/flood::http-stomp-attack-name
      - id: micro-behaviors/communications/http/services/cloudflare::cloudflare-captcha-check-uri
  - id: persistent-multi-vector-flood-bot
    desc: Native ELF bot with flood tasking and multi-surface persistence
    crit: hostile
    conf: 0.98
    attack: T1498,T1053.003,T1543.002
    mbc: B0030
    all:
      - id: objectives/impact/dos/attack/flood::named-flood-command-token
      - id: micro-behaviors/os/service/config::openwrt-boot-config-surface-cluster
      - id: objectives/persistence/system/service/systemd::flood-bot-cron-systemd-templates
  - id: http-udp-attack-mode-clues
    desc: HTTP and UDP attack-mode clues
    crit: hostile
    conf: 0.99
    attack: T1498.001
    all:
      - id: objectives/impact/dos/attack/flood::http-stomp-attack-name
      - id: objectives/impact/dos/attack/flood::udp-h-attack-name
      - id: micro-behaviors/communications/http/services/cloudflare::cloudflare-captcha-check-uri
  - id: native-multivector-mode-http-clues
    desc: Multi-vector attack-mode and HTTP clues
    crit: hostile
    conf: 0.99
    attack: T1498.001
    needs: 2
    any:
      - id: objectives/impact/dos/attack/flood::fivem-flood-mode
      - id: objectives/impact/dos/attack/flood::hexudp-flood-mode
      - id: objectives/impact/dos/attack/flood::ovh-flood-mode
    all:
      - id: micro-behaviors/communications/http/get::binary-get-path
  - id: native-mips-multivector-ddos-bot
    desc: Static MIPS IoT bot with multi-vector attack tasking
    crit: hostile
    conf: 0.99
    attack: T1498.001
    mbc: B0030
    all:
      - id: objectives/impact/dos/attack/flood::native-attack-mode-label-cluster
      - id: objectives/impact/dos/attack/flood::attack-target-format
      - id: objectives/impact/dos/attack/flood::stop-command-token
      - id: metadata/arch/iot::mips
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
      - id: micro-behaviors/os/syscall/raw::mips-direct-syscall-instruction-be
