# Storm DDoS bot: a self-labeled ("storm ddos") Windows agent that formats a
# STORM: beacon and carries HTTP flood request templates plus staging support.
# The banner and beacon atoms are family vocabulary; the hostile verdict comes
# from their combination with a staging or flood capability below.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1498.001,T1498.002
  mbc: B0030

traits:
  - id: storm-ddos-banner
    desc: Storm DDoS self-label banner
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)storm ddos'

  - id: storm-beacon-format
    desc: STORM beacon format string
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'STORM:%[ds](\|%[ds])+'

composite_rules:
  - id: storm-ddos-windows-bot
    desc: Storm DDoS bot with beacon and flood staging
    crit: hostile
    conf: 0.98
    all:
      - id: storm-ddos-banner
      - id: storm-beacon-format
    any:
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
      - id: micro-behaviors/os/registry/keys/autostart::active-setup-key
      - id: micro-behaviors/os/service/host::service-dll-value-name
      - id: micro-behaviors/communications/http/user-agent::ua-mozilla-old
      - id: micro-behaviors/communications/socket/init::wsock32-dll-marker
    needs: 2
    unless:
      - id: metadata/signed/platform/
