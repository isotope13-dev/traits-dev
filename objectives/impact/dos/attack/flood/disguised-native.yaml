# Randomized request templates and raw sockets alone occur in load testers.
# The kernel-worker boot disguise supplies the unwanted/stealth context.
defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: kernel-worker-raw-http-flood-bot
    desc: Randomized HTTP/raw bot with boot disguise
    crit: hostile
    conf: 0.95
    attack: T1498.001
    all:
      - id: micro-behaviors/communications/http/get::native-random-query-get-template
      - id: micro-behaviors/communications/socket/raw::raw
      - id: objectives/persistence/system/service/systemd::kernel-worker-unit-cron-boot-persistence
