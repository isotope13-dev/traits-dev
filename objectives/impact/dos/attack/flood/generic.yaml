composite_rules:
  # "At least one network flood implementation is present" component, shared by
  # the botnet family rules that corroborate it with family identity, raw
  # sockets or a propagation chain. Deliberately weaker than the `needs: 3`
  # multi-protocol clusters: on its own it concludes nothing.
  - id: multi-vector-flood-functions
    desc: Multiple network flood implementations
    crit: component
    conf: 0.8
    for: [elf, macho]
    platforms: [linux, macos, windows, unix, android, ios]
    size_min: 512
    size_max: 500000000
    any:
      - id: micro-behaviors/communications/flood::syn-flood
      - id: micro-behaviors/communications/flood::udp-flood-function
      - id: micro-behaviors/communications/flood::http-flood
      - id: objectives/impact/dos/tcp::tcp-flood
  - id: native-multivector-threaded-flood-engine
    for: [pe]
    desc: Native multi-vector threaded network flood engine
    crit: hostile
    conf: 0.995
    all:
      - id: native-threaded-attack-parameters
      - id: micro-behaviors/communications/socket/init::winsock-datagram-transfer
      - id: micro-behaviors/process/threading/create::create-thread-text
    any:
      - id: native-udp-attack-status
      - id: native-tcp-attack-status
      - id: native-http-icmp-flood-status
      - id: native-service-flood-status
    needs: 3
  - any:
      - id: attack-telemetry-a1
      - id: attack-telemetry-a2
      - id: attack-telemetry-b1
      - id: attack-telemetry-b2
    all:
      - id: ddos-attack-terminology
    conf: 0.7
    crit: notable
    desc: Telemetry counters for attack progress
    id: attack-telemetry
  - any:
      - id: ddos-attack-ddos
      - id: ddos-attack-syn
      - id: ddos-attack-target-mode-type
    conf: 0.7
    crit: suspicious
    desc: Additional DDoS attack terminology
    id: ddos-attack-terminology
    unless:
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-external-dns-binary
      - id: well-known/tool/sysadmin/tccli::tccli-generated-service-client
      - id: well-known/lib/cloud/
  - any:
      - id: micro-behaviors/communications/flood::flood-type-terminology
      - id: micro-behaviors/os/telemetry/application::throughput-rate-figure
    all:
      - id: ddos-attack-terminology
    crit: suspicious
    desc: DDoS-specific terminology detected
    id: ddos-terminology-comp
    unless:
      - id: metadata/file/format/structured::asn1-module-definition
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/tool/development/agent/anthropic-claude-agent/
      - id: well-known/app/data/mysqltuner::mysqltuner-source-path
      - id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
      - id: well-known/app/communication/thunderbird::firefox-omni-runtime-path
      - id: well-known/lib/cloud/
  - all:
      - id: ddos-terminology-comp
      - id: micro-behaviors/process/create/workers/
    any:
      - id: micro-behaviors/communications/socket/connect/
      - id: micro-behaviors/communications/socket/send/
      - id: micro-behaviors/communications/http/get/
      - id: micro-behaviors/communications/http/post/
      - id: micro-behaviors/communications/http/request/client::request-python
      - id: micro-behaviors/os/network/tunnel::dev-tun
      - id: micro-behaviors/os/network/tunnel::dev-net-tun
      - id: micro-behaviors/os/network/tunnel::dev-tap
      - id: micro-behaviors/os/network/tunnel::tunsetiff-ioctl
      - id: micro-behaviors/os/network/tunnel::tun
      - id: micro-behaviors/os/network/tunnel::wintun-create-adapter
      - id: micro-behaviors/os/network/tunnel::wintun-dll-reference
      - id: micro-behaviors/os/network/tunnel::tap0901-adapter-reference
      - id: micro-behaviors/os/network/tunnel::windows-virtual-tunnel-adapter
    crit: suspicious
    desc: DDoS-specific operational mechanics detected
    id: ddos-mechanics
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/tool/development/agent/anthropic-claude-agent/
      - id: well-known/app/data/mysqltuner::mysqltuner-source-path
      - id: well-known/app/communication/thunderbird::firefox-omni-runtime-path
  - all:
      - id: ddos-terminology-comp
      - id: ddos-mechanics
      - id: micro-behaviors/communications/socket/create/
    conf: 0.9
    crit: suspicious
    desc: Probable DDoS attack tool
    id: ddos-capability
  - all:
      - id: micro-behaviors/communications/http/user-agent::hardcoded-user-agent-list
      - id: ddos-terminology-comp
    any:
      - id: micro-behaviors/communications/http/post/
      - id: micro-behaviors/communications/http/request/client::request-python
    conf: 0.95
    crit: suspicious
    desc: Layer 7 (HTTP) DDoS tool
    id: layer7-ddos
    unless:
      - id: well-known/app/communication/thunderbird::firefox-omni-runtime-path
  - all:
      - id: micro-behaviors/communications/benchmark/http::ab-high-volume-argv
      - id: micro-behaviors/process/create/thread
      - id: micro-behaviors/process/create/subprocess::run-content
    any:
      - id: micro-behaviors/communications/benchmark/http::ab-host-header-argv
      - id: micro-behaviors/communications/http/header/custom::headers-encoding
    conf: 0.95
    crit: hostile
    desc: Threaded ApacheBench HTTP flood
    id: threaded-apachebench-flood
  # The throughput-rate figure atoms (pps/bps/qps) and the Brave provider
  # marker they exclude on live in
  # micro-behaviors/communications/benchmark/throughput.yaml; the composites
  # above reference them there.
defaults:
  attack: T1498
  for: [scripts, binaries]
  mbc: B0033
  platforms:
    - unix
    - windows
traits:
  - id: native-udp-attack-status
    desc: Native UDP flood status
    crit: suspicious
    conf: 0.98
    for: [pe, dll, elf, macho]
    if:
      type: text
      regex: '(?i)\bStarting (optimized )?(N?UDP|UDP payload) (flood|attack)\b'
  - id: native-tcp-attack-status
    desc: Native TCP flood status
    crit: suspicious
    conf: 0.98
    for: [pe, dll, elf, macho]
    if:
      type: text
      regex: '(?i)\bStarting (optimized )?TCP(-RAND)? (flood|attack)\b'
  - id: native-http-icmp-flood-status
    desc: Native HTTP or ICMP flood status
    crit: suspicious
    conf: 0.98
    for: [pe, dll, elf, macho]
    if:
      type: text
      regex: '(?i)\bStarting (HTTP|ICMP) (flood|attack)\b'
  - id: native-service-flood-status
    desc: Native service-target flood status
    crit: suspicious
    conf: 0.98
    for: [pe, dll, elf, macho]
    if:
      type: text
      regex: '(?i)\bStarting (SAMP|PPS|Discord|TS3) Attack\b'
  - id: native-threaded-attack-parameters
    desc: Native threaded attack target parameters
    crit: suspicious
    conf: 0.98
    for: [pe, dll, elf, macho]
    if:
      type: text
      regex: '(?i)\bTarget: %s, Port: %d, Threads: %d\b'
  - conf: 0.7
    crit: notable
    desc: DDOS attack terminology
    id: ddos-attack-ddos
    if:
      # Identifier spelling only. The hyphenated form is how prose and URL
      # slugs write it, so `[_-]?` turned every threat-intel reference link
      # into DDoS-tool terminology -- Kibana's security-solution bundle ships
      # a Suricata signature reference map whose URLs include
      # `...-ddos-attacks-150124/`.
      regex: (?i)\bddos_?attack(s|ed|ing|er)?\b
      type: text
    unless:
      - id: metadata/package/documentation/page::static-html-shell
      - id: well-known/app/infrastructure/cloud-custodian::shield-ddos-metrics-filter-context
  - conf: 0.7
    crit: component
    desc: SYN attack terminology
    id: ddos-attack-syn
    if:
      # Bounded. Windows names its SYN-flood defence and telemetry after the
      # attack and glues the token into longer identifiers -- SynAttackProtect,
      # TcpGlobalSynAttackEntry/Exit, SynAttacksDetected -- so any parser of
      # that ETW schema carried the unbounded form. TheBrain bundles
      # Microsoft.Diagnostics.Tracing.TraceEvent.dll, which is such a parser.
      regex: (?i)\bsyn[_-]?attack\b
      type: text
  - conf: 0.7
    crit: notable
    desc: Attack target/mode/type terminology
    id: ddos-attack-target-mode-type
    if:
      regex: (?i)\b(ddos|flood)[_-]?attack[_-]?(target|mode|type)\b
      type: text
  - conf: 0.7
    crit: notable
    desc: Telemetry counters for attack progress
    id: attack-telemetry-a1
    if:
      case_insensitive: true
      regex: \b(ddos|attack|flood)[_-]?(packets|requests)[_-][a-z]{4,5}\b
      type: text
    unless:
      - id: metadata/package/vendor::bitdefender-ecnet-telemetry
  - conf: 0.7
    crit: notable
    desc: Telemetry counters for attack progress
    id: attack-telemetry-a2
    if:
      case_insensitive: true
      regex: \b(ddos|attack|flood)[_-]?(bytes|payloads)[_-][a-z]{4,5}\b
      type: text
  - conf: 0.7
    crit: notable
    desc: Telemetry counters for attack progress
    id: attack-telemetry-b1
    if:
      case_insensitive: true
      regex: \b(ddos|attack|flood)[_-]?(packets|requests)[_-][a-z]{4,7}\b
      type: text
  - conf: 0.7
    crit: notable
    desc: Telemetry counters for attack progress
    id: attack-telemetry-b2
    if:
      case_insensitive: true
      regex: \b(ddos|attack|flood)[_-]?(bytes|payloads)[_-][a-z]{4,7}\b
      type: text
