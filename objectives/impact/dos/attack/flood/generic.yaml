composite_rules:
- id: multi-vector-flood-functions
  desc: Multiple network flood implementations
  crit: component
  conf: 0.8
  for:
  - elf
  - macho
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  size_min: 512
  size_max: 500000000
  any:
  - id: metadata/lang/natural/vocabulary/security::syn-flood
  - id: micro-behaviors/communications/flood::udp-flood-function
  - id: metadata/lang/natural/vocabulary/security::http-flood
  - id: objectives/impact/dos/tcp::tcp-flood
- id: native-multivector-threaded-flood-engine
  for:
  - pe
  desc: Native multi-vector threaded network flood engine
  crit: hostile
  conf: 0.995
  all:
  - id: native-threaded-attack-parameters
  - id: micro-behaviors/communications/socket/message::winsock-addressed-io-api-set
  - id: micro-behaviors/process/thread/create::create-thread-text
  any:
  - id: native-udp-attack-status
  - id: native-tcp-attack-status
  - id: native-http-icmp-flood-status
  - id: native-service-flood-status
  needs: 3
- any:
  - id: attack-telemetry-a1
  - id: attack-telemetry-a2
  - id: attack-telemetry-b1
  - id: attack-telemetry-b2
  all:
  - id: micro-behaviors/data/parse/vocabulary::ddos-attack-terminology
  conf: 0.7
  crit: notable
  desc: Telemetry counters for attack progress
  id: attack-telemetry
- all:
  - id: metadata/lang/natural/vocabulary/security::ddos-terminology-context
  - id: micro-behaviors/process/work/task::parallel-work-clues
  any:
  - id: micro-behaviors/communications/socket/connect/
  - id: micro-behaviors/communications/socket/send/
  - id: micro-behaviors/communications/http/get/
  - id: micro-behaviors/communications/http/request/get::arm-static-direct-syscall-get-context
  - id: micro-behaviors/communications/http/request/get::tiny-elf-bins-get-context
  - id: micro-behaviors/communications/http/request/get::static-elf-bins-get-context
  - id: micro-behaviors/communications/http/request/get::tiny-static-elf-bins-get-context
  - id: micro-behaviors/communications/http/download/webclient::powershell-image-url-get
  - id: micro-behaviors/communications/http/download/webclient::python-webclient-cloud-api-get
  - id: micro-behaviors/communications/http/download/webclient::python-webclient-http-get
  - id: micro-behaviors/communications/http/request/executable-resource::python-helper-get-discord-executable-url
  - id: micro-behaviors/communications/http/request/package::npm-postinstall-node-http-get
  - id: micro-behaviors/communications/http/request/package::npm-postinstall-hostname-oast-get-url
  - id: micro-behaviors/communications/http/request/account::dahua-account-config-request
  - id: micro-behaviors/communications/http/request/verb::python-request-get-method
  - id: micro-behaviors/communications/http/request/verb::python-request-get-keyword
  - id: micro-behaviors/communications/http/request/verb::python-primp-client-get
  - id: micro-behaviors/communications/http/post
  - id: micro-behaviors/communications/http/request/client::request-python
  - id: micro-behaviors/network/tunnel::dev-tun
  - id: micro-behaviors/network/tunnel::dev-net-tun
  - id: micro-behaviors/network/tunnel::dev-tap
  - id: micro-behaviors/network/tunnel::tunsetiff-ioctl
  - id: micro-behaviors/network/tunnel::tun
  - id: micro-behaviors/network/tunnel::wintun-create-adapter
  - id: micro-behaviors/network/tunnel::wintun-dll-reference
  - id: micro-behaviors/network/tunnel::tap0901-adapter-reference
  - id: micro-behaviors/network/tunnel::windows-virtual-tunnel-adapter
  crit: suspicious
  desc: DDoS-specific operational mechanics detected
  id: ddos-mechanics
- all:
  - id: metadata/lang/natural/vocabulary/security::ddos-terminology-context
  - id: ddos-mechanics
  - id: micro-behaviors/communications/socket/create/
  conf: 0.9
  crit: suspicious
  desc: Probable DDoS attack tool
  id: ddos-capability
- all:
  - id: micro-behaviors/communications/http/user-agent::hardcoded-user-agent-list
  - id: metadata/lang/natural/vocabulary/security::ddos-terminology-context
  any:
  - id: micro-behaviors/communications/http/post
  - id: micro-behaviors/communications/http/request/client::request-python
