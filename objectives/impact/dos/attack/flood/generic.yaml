  crit: suspicious
  desc: Layer 7 (HTTP) DDoS tool
  id: layer7-ddos
  unless:
  - id: well-known/app/communication/thunderbird::firefox-omni-runtime-path
- all:
  - id: micro-behaviors/communications/benchmark::ab-high-volume-argv
  - id: micro-behaviors/process/thread/create
  - id: micro-behaviors/process/create/exec::python-subprocess-run-call-text
  any:
  - id: micro-behaviors/communications/benchmark::ab-host-header-argv
  - id: micro-behaviors/communications/http/header/accept::headers-encoding
  conf: 0.95
  crit: hostile
  desc: Threaded ApacheBench HTTP flood
  id: threaded-apachebench-flood
defaults:
  attack: T1498
  for:
  - scripts
  - binaries
  mbc: B0033
  platforms:
  - unix
  - windows
traits:
- id: native-udp-attack-status
  desc: Native UDP flood status
  crit: suspicious
  conf: 0.98
  for:
  - pe
  - dll
  - elf
  - macho
  if:
    type: text
    regex: (?i)\bStarting (optimized )?(N?UDP|UDP payload) (flood|attack)\b
- id: native-tcp-attack-status
  desc: Native TCP flood status
  crit: suspicious
  conf: 0.98
  for:
  - pe
  - dll
  - elf
  - macho
  if:
    type: text
    regex: (?i)\bStarting (optimized )?TCP(-RAND)? (flood|attack)\b
- id: native-http-icmp-flood-status
  desc: Native HTTP or ICMP flood status
  crit: suspicious
  conf: 0.98
  for:
  - pe
  - dll
  - elf
  - macho
  if:
    type: text
    regex: (?i)\bStarting (HTTP|ICMP) (flood|attack)\b
- id: native-service-flood-status
  desc: Native service-target flood status
  crit: suspicious
  conf: 0.98
  for:
  - pe
  - dll
  - elf
  - macho
  if:
    type: text
    regex: (?i)\bStarting (SAMP|PPS|Discord|TS3) Attack\b
- id: native-threaded-attack-parameters
  desc: Native threaded attack target parameters
  crit: suspicious
  conf: 0.98
  for:
  - pe
  - dll
  - elf
  - macho
  if:
    type: text
    regex: '(?i)\bTarget: %s, Port: %d, Threads: %d\b'
- conf: 0.7
  crit: notable
  desc: Telemetry counters for attack progress
  id: attack-telemetry-a1
  if:
    case_insensitive: true
    regex: \b(ddos|attack|flood)[_-]?(packets|requests)[_-][a-z]{4,5}\b
    type: text
  unless:
  - id: metadata/package/vendor::bitdefender-ecnet-telemetry
- conf: 0.7
  crit: notable
  desc: Telemetry counters for attack progress
  id: attack-telemetry-a2
  if:
    case_insensitive: true
    regex: \b(ddos|attack|flood)[_-]?(bytes|payloads)[_-][a-z]{4,5}\b
    type: text
- conf: 0.7
  crit: notable
  desc: Telemetry counters for attack progress
  id: attack-telemetry-b1
  if:
    case_insensitive: true
    regex: \b(ddos|attack|flood)[_-]?(packets|requests)[_-][a-z]{4,7}\b
    type: text
- conf: 0.7
  crit: notable
  desc: Telemetry counters for attack progress
  id: attack-telemetry-b2
  if:
    case_insensitive: true
    regex: \b(ddos|attack|flood)[_-]?(bytes|payloads)[_-][a-z]{4,7}\b
    type: text
