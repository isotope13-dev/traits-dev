defaults:
  platforms: [unix, android]
  for: [elf]
  mbc: B0042
  attack: T1499
traits:
  - id: attack-command-prefix
    desc: Attack tasking command prefix
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: .rodata
      pattern: "41 54 54 41 43 4B 3A 00"
  - id: attack-target-format
    desc: Attack target parser format
    crit: notable
    conf: 0.92
    if:
      type: text
      exact: "%s %s %d %d"
  - id: attack-thread-symbol
    desc: Attack thread function symbol
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: attack_thread
  - id: start-attack-symbol
    desc: Attack dispatcher function symbol
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: start_attack
  - id: zerobot-v2-user-agent
    desc: ZeroBot flood User-Agent
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: "User-Agent: ZeroBot/V2"
  - id: cloudflare-mode-token
    desc: Cloudflare flood mode token
    crit: notable
    conf: 0.88
    if:
      type: text
      exact: CLOUDFLARE
  - id: fivem-mode-token
    desc: FiveM flood mode token
    crit: notable
    conf: 0.88
    if:
      type: text
      exact: FIVEM
  - id: discord-mode-token
    desc: Discord flood mode token
    crit: notable
    conf: 0.82
    if:
      type: text
      exact: DISCORD
  - id: pget-method
    desc: PGET attack mode token
    crit: suspicious
    conf: 0.92
    if:
      type: text
      exact: PGET
  - id: udpraw-mode
    desc: UDPRAW attack mode token
    crit: suspicious
    conf: 0.95
    if:
      type: text
      exact: UDPRAW
      case_insensitive: true
  - id: sendhttphex-symbol
    desc: HTTP hex flood function
    crit: suspicious
    conf: 0.95
    if:
      type: symbol
      exact: SendHTTPHex
  - id: sendhttptwo-symbol
    desc: Secondary HTTP flood function
    crit: suspicious
    conf: 0.9
    if:
      type: symbol
      exact: sendHTTPtwo
  - id: random-target-ip
    desc: Random target IP generator
    crit: suspicious
    conf: 0.88
    if:
      type: symbol
      exact: getRandomIP
  - id: vse-attack-function-name
    desc: Valve Source Engine attack function name
    crit: suspicious
    conf: 0.95
    if:
      type: text
      exact: vseattack
  - id: send-stdhex-symbol
    desc: SendSTDHEX function name in ELF symbols
    crit: suspicious
    conf: 0.92
    if:
      type: text
      exact: SendSTDHEX
      section: .strtab
  - id: send-udp-attack-symbol
    desc: SendUDP attack function
    crit: suspicious
    conf: 0.85
    if:
      type: symbol
      exact: SendUDP
  - id: http-stomp-attack-name
    desc: HTTPSTOMP attack vector name
    crit: suspicious
    conf: 0.95
    if:
      type: text
      word: HTTPSTOMP
  - id: cloudflare-chk-captcha-bypass
    desc: Cloudflare chk_captcha bypass URI
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: /cdn-cgi/l/chk_captcha
  - id: udp-h-attack-name
    desc: UDPH attack mode token in read-only data
    crit: suspicious
    conf: 0.95
    if:
      type: text
      exact: UDPH
      section: .rodata
  - id: named-flood-command-token
    desc: Named network flood attack command token
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(UDP|SYN|HTTP2|BROADCAST)_FLOOD\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: fivem-flood-mode
    desc: FiveM flood mode marker
    crit: suspicious
    conf: 0.95
    attack: T1498.001
    if:
      type: text
      exact: fivem_%d
      section: .rodata
  - id: hexudp-flood-mode
    desc: Hexadecimal UDP flood mode marker
    crit: suspicious
    conf: 0.95
    attack: T1498.001
    if:
      type: text
      exact: hexudp_%d
      section: .rodata
  - id: ovh-flood-mode
    desc: OVH flood mode marker
    crit: suspicious
    conf: 0.95
    attack: T1498.001
    if:
      type: text
      exact: ovh_%d
      section: .rodata
  # Native IoT bots commonly retain a compact attack-mode table after
  # stripping. The protocol prefix is intentionally open-ended; the
  # high-count cluster distinguishes a mode table from one protocol name.
  - id: native-attack-mode-label-cluster
    desc: Native protocol-qualified attack mode cluster
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(UDP|TCP)-[A-Z0-9][A-Z0-9-]{2,20}\b'
  # Only `udpraw` is a bot mode name; syn/ack/psh/rst/fin/tcp/icmp/dns are
  # ordinary protocol vocabulary that any network-aware binary carries. The
  # previous alternation let six generic words alone reach `suspicious`, so it
  # fired on libsystemd-shared (networkd/resolved protocol code) and on tgtd,
  # the iSCSI target daemon. Requiring the distinctive mode token makes the
  # rule mean what its name says; the generic words remain as corroboration.
  - id: native-raw-protocol-mode-cluster
    desc: Native raw-protocol flood mode cluster
    crit: suspicious
    conf: 0.96
    count_min: 2
    if:
      type: text
      regex: '(?i)\budpraw\b'
      section: .rodata
    unless:
      - id: well-known/lib/vendor-sdk/dcc-mcp-core::native-core-basename
      - id: well-known/lib/vendor-sdk/dcc-mcp-core::package-context
      - id: metadata/package/files/runtime::benign-native-library-context
  - id: stop-command-token
    desc: Stop command token in native attack tasking
    crit: component
    conf: 0.9
    if:
      type: text
      word: STOP
  - id: start-flood-dispatcher-usage
    desc: start_flood attack dispatcher usage string
    crit: suspicious
    conf: 0.99
    attack: T1498.001
    if:
      type: text
      substr: "start_flood: usage:"
  - id: start-flood-mode-tcpbypass
    desc: start_flood TCP bypass attack mode name
    crit: component
    conf: 0.98
    if:
      type: text
      exact: tcpbypass
  - id: start-flood-mode-ovhflood
    desc: start_flood OVH flood attack mode name
    crit: component
    conf: 0.98
    if:
      type: text
      exact: ovhflood
  - id: start-flood-mode-udp-legit
    desc: start_flood UDP legit attack mode name
    crit: component
    conf: 0.98
    if:
      type: text
      exact: udp_legit
  - id: start-flood-mode-tcp-legit
    desc: start_flood TCP legit attack mode name
    crit: component
    conf: 0.98
    if:
      type: text
      exact: tcp_legit
  - id: start-flood-mode-ovhbypass
    desc: start_flood OVH bypass attack mode name
    crit: component
    conf: 0.98
    if:
      type: text
      exact: ovhbypass
  - id: start-flood-mode-icmp-gre
    desc: start_flood ICMP GRE attack mode name
    crit: component
    conf: 0.98
    if:
      type: text
      exact: icmp_gre
  - id: start-flood-mode-udpcustom
    desc: start_flood UDP custom attack mode name
    crit: component
    conf: 0.98
    if:
      type: text
      exact: udpcustom
composite_rules:
  - id: x86-64-static-stripped-elf-target
    desc: Stripped static x86_64 ELF executable
    crit: component
    conf: 0.97
    all:
      - id: metadata/arch/x86::elf-machine-x86-64-value
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"
  - id: start-flood-mode-name-cluster
    desc: start_flood bot multi-vector mode names
    crit: suspicious
    conf: 0.98
    attack: T1498.001
    needs: 3
    any:
      - id: start-flood-mode-tcpbypass
      - id: start-flood-mode-ovhflood
      - id: start-flood-mode-udp-legit
      - id: start-flood-mode-tcp-legit
      - id: start-flood-mode-ovhbypass
      - id: start-flood-mode-icmp-gre
      - id: start-flood-mode-udpcustom
  - id: static-elf-start-flood-ddos-bot
    desc: Static ELF IoT bot with start_flood multi-vector tasking
    crit: hostile
    conf: 0.99
    attack: T1498.001
    mbc: B0030
    all:
      - id: start-flood-dispatcher-usage
      - id: start-flood-mode-name-cluster
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
    any:
      - id: metadata/arch/iot::arm
      - id: metadata/arch/iot::mips
      - id: metadata/arch/iot::powerpc
      - id: metadata/arch/iot::superh
      - id: x86-64-static-stripped-elf-target
    needs: 1
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: android-flood-tasking-surface
    desc: Android flood tasking surface
    crit: suspicious
    conf: 0.97
    needs: 5
    any:
      - id: attack-command-prefix
      - id: attack-target-format
      - id: attack-thread-symbol
      - id: start-attack-symbol
      - id: zerobot-v2-user-agent
      - id: cloudflare-mode-token
      - id: fivem-mode-token
      - id: discord-mode-token
  - id: android-threaded-ddos-bot
    desc: Android threaded DDoS bot
    crit: hostile
    conf: 0.98
    all:
      - id: android-flood-tasking-surface
      - id: micro-behaviors/communications/socket/send::sendto-symbol
      - id: micro-behaviors/process/threading/concurrency::pthread
    any:
      - id: micro-behaviors/communications/http/user-agent::user-agent-header
      - id: micro-behaviors/communications/socket/connect::connect
  - id: http-flood-bot-functions
    desc: HTTP flood bot function cluster
    crit: suspicious
    conf: 0.95
    any:
      - id: pget-method
      - id: sendhttphex-symbol
      - id: sendhttptwo-symbol
      - id: micro-behaviors/communications/http/user-agent::useragent-pool-symbol
      - id: micro-behaviors/communications/http/user-agent::user-agent-header
    needs: 3
  - id: multi-vector-bot-flooder
    desc: Multi-vector botnet flood capability
    crit: hostile
    conf: 0.98
    all:
      - id: http-flood-bot-functions
      - id: udpraw-mode
      - id: random-target-ip
  - id: native-multivector-http-flooder
    desc: Native UDPRAW HTTP random-body flood client
    crit: hostile
    conf: 0.99
    attack: T1498.001
    all:
      - id: udpraw-mode
      - id: micro-behaviors/communications/http/request/body::fixed-random-data-form-body
      - id: micro-behaviors/communications/http/post::post-request-line
  - id: native-multivector-attack-function-cluster
    desc: Native multi-vector attack function cluster
    crit: suspicious
    conf: 0.97
    needs: 3
    any:
      - id: vse-attack-function-name
      - id: send-stdhex-symbol
      - id: send-udp-attack-symbol
      - id: sendhttphex-symbol
      - id: sendhttptwo-symbol
      - id: micro-behaviors/communications/socket/init::initconnection-function-name
      - id: http-stomp-attack-name
      - id: cloudflare-chk-captcha-bypass
  - id: persistent-multi-vector-flood-bot
    desc: Native ELF bot with flood tasking and multi-surface persistence
    crit: hostile
    conf: 0.98
    attack: T1498,T1053.003,T1543.002
    mbc: B0030
    all:
      - id: named-flood-command-token
      - id: objectives/command-and-control/botnet/iot::iot-bot-persistence-surface-cluster
      - id: objectives/persistence/login/shell/tasking::native-multi-surface-persistence
  - id: gafgyt-http-attack-set
    desc: Gafgyt-style HTTP attack command set
    crit: hostile
    conf: 0.99
    attack: T1498.001
    all:
      - id: http-stomp-attack-name
      - id: udp-h-attack-name
      - id: cloudflare-chk-captcha-bypass
  - id: udp-flood-bot-symbol-cluster
    desc: UDP flood bot symbol cluster
    crit: suspicious
    conf: 0.97
    all:
      - id: send-udp-attack-symbol
      - id: micro-behaviors/communications/socket/init::initconnection-function-name
      - id: micro-behaviors/communications/http/user-agent::useragent-pool-symbol
    any:
      - id: random-target-ip
      - id: micro-behaviors/communications/socket/udp::source-engine-query-payload
      - id: objectives/impact/dos/gaming-platform::source-query-flood-handler
  - id: c2-tasked-ddos-bot-daemon
    desc: C2 tasked DDoS bot daemon
    crit: hostile
    conf: 0.98
    all:
      - id: native-multivector-attack-function-cluster
      - id: micro-behaviors/communications/socket/tcp::ping-pong-keepalive-elf
      - id: micro-behaviors/process/daemonize/detach::fork-new-session
  - id: mirai-lzrd-ddos-profile
    desc: Mirai LZRD multi-vector DDoS profile
    crit: hostile
    conf: 0.99
    attack: T1498.001
    needs: 2
    any:
      - id: fivem-flood-mode
      - id: hexudp-flood-mode
      - id: ovh-flood-mode
    all:
      - id: micro-behaviors/communications/http/get::binary-get-path
  - id: native-mips-multivector-ddos-bot
    desc: Static MIPS IoT bot with multi-vector attack tasking
    crit: hostile
    conf: 0.99
    attack: T1498.001
    mbc: B0030
    all:
      - id: native-attack-mode-label-cluster
      - id: attack-target-format
      - id: stop-command-token
      - id: metadata/arch/iot::mips
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: micro-behaviors/os/syscall/raw::mips-direct-syscall-instruction-be
