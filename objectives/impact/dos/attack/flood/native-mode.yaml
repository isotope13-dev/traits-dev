traits:
- id: native-ddos-mode-vocabulary
  platforms:
  - linux
  - android
  desc: Native flood or bypass attack-mode label
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: \b[A-Z0-9]{2,8}-(FLOOD|STOMP|AMP|BYPASS)\b
  not:
  - exact: JUMP-BYPASS
  - exact: TT-BYPASS
  # HDMI audio extractor model in Chromium's EDID database: every
  # Chromium/Electron binary carries this display-hardware string, and
  # it is not an AMP attack mode.
  - exact: EMX-AMP
- platforms:
  - unix
  - android
  size_max: 5000000
  id: stdhex-command-token
  desc: References STDHEX flood command token
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: STDHEX
    section: .rodata
composite_rules: []
defaults:
  for:
  - elf
