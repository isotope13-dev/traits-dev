defaults:
  platforms: [linux]
  for: [elf]

traits:
- id: go-main-udp-attack-handler
  desc: Go ELF exposes named UDP flood handlers
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '\bmain\.udp(Flood|Send|plain)\b'
- id: go-main-tcp-attack-handler
  desc: Go ELF exposes named TCP flood handlers
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '\bmain\.tcp(Flood|Send)\b'
- id: go-main-syn-attack-handler
  desc: Go ELF exposes named SYN attack handlers
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '\bmain\.syn(Send)?\b'
- id: go-main-http-attack-handler
  desc: Go ELF exposes named HTTP flood handlers
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '\bmain\.http(Flood|Send)\b'

# Cache-busting: making every request unique so a CDN or reverse proxy cannot
# absorb the flood from cache, forcing every hit through to the origin. It is
# what separates a modern layer-7 flood from a naive one, and it is the part a
# load-tester has no reason to implement -- a load test wants to measure the
# real cache-hit path, not defeat it.
- id: go-main-cache-bust-symbol
  desc: Go ELF exposes a cache-busting routine
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: '\bmain\.[a-z]{0,8}[Cc]ache[Bb]ust'

composite_rules:
- id: go-main-attack-handler-cluster
  desc: Go ELF exposes multiple named protocol attack handlers
  crit: suspicious
  conf: 0.99
  needs: 3
  any:
  - id: go-main-udp-attack-handler
  - id: go-main-tcp-attack-handler
  - id: go-main-syn-attack-handler
  - id: go-main-http-attack-handler
- id: go-multivector-network-flood-bot
  desc: Go ELF combines protocol floods, raw sockets, and concurrent workers
  crit: hostile
  conf: 0.99
  attack: T1498.001
  all:
  - id: go-main-attack-handler-cluster
  - id: micro-behaviors/communications/socket/raw::go-rawsocketcall-symbol
  - id: micro-behaviors/communications/http/lib/netlib::go-http-client-do-string
  - id: micro-behaviors/process/thread/create::go-runtime-newproc-binary
- id: go-named-multivector-network-flood
  desc: Go ELF dispatches named multi-protocol floods over network clients
  crit: hostile
  conf: 0.99
  attack: T1498.001
  all:
  - id: go-main-attack-handler-cluster
  - id: micro-behaviors/communications/http/lib/netlib::go-http-client-do-string
  - id: micro-behaviors/communications/socket/connect::go-net-dialtimeout-text
- id: go-c2-multivector-attack-tasking
  desc: Go ELF combines C2 attack dispatch with multiple protocol attack handlers
  crit: hostile
  conf: 0.99
  attack: T1071.001,T1498.001
  all:
  - id: objectives/command-and-control/remote-command/tasking::go-c2-connect-handler-symbol
  - id: objectives/command-and-control/remote-command/tasking::go-c2-command-handler-symbol
  - id: objectives/command-and-control/remote-command/tasking::go-c2-attack-dispatch-symbol
  - id: go-main-attack-handler-cluster
  - id: micro-behaviors/communications/socket/connect::go-net-dialtimeout-text
# A layer-7 flood built to get past the defences in front of the origin, rather
# than to generate load. Three legs, each answering a different defence:
#   * an attack worker in the program's own main package -- not a library, and
#     named for what it does;
#   * cache-busting, which defeats CDN/reverse-proxy absorption;
#   * a forged X-Forwarded-For, which defeats per-client rate limiting and
#     hides the real source from the origin's logs.
#
# A benchmarking tool does the first and can do the second, but it has no
# reason to forge the client-IP header: it is measuring its own traffic, not
# disguising it. Requiring all three keeps load generators out.
- id: go-l7-flood-cache-bust-ip-spoof
  desc: Go flood busts caches and forges client IP
  crit: hostile
  conf: 0.97
  attack: T1498.001
  all:
  - id: objectives/impact/dos/attack/botnet::go-attack-worker-name
  - id: go-main-cache-bust-symbol
  - id: micro-behaviors/communications/http/headers::x-forwarded-for
