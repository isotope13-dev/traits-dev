defaults:
  platforms: [linux]
  for: [elf]

traits:
- id: go-main-udp-flood-method
  desc: Go ELF exposes a UDP flood method
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '\bmain\.udp(Plain)?Flood\b'
- id: go-main-tcp-flood-method
  desc: Go ELF exposes a TCP flood method
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '\bmain\.tcpFlood\b'
- id: go-main-syn-flood-method
  desc: Go ELF exposes a SYN flood method
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '\bmain\.synFlood\b'
- id: go-main-http-flood-method
  desc: Go ELF exposes an HTTP flood method
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '\bmain\.httpFlood\b'

composite_rules:
- id: go-main-flood-method-cluster
  desc: Go ELF exposes multiple protocol flood methods
  crit: suspicious
  conf: 0.99
  needs: 3
  any:
  - id: go-main-udp-flood-method
  - id: go-main-tcp-flood-method
  - id: go-main-syn-flood-method
  - id: go-main-http-flood-method
- id: go-multivector-network-flood-bot
  desc: Go ELF combines protocol floods, raw sockets, and concurrent workers
  crit: hostile
  conf: 0.99
  attack: T1498.001
  all:
  - id: go-main-flood-method-cluster
  - id: micro-behaviors/communications/socket/raw::go-rawsocketcall-symbol
  - id: micro-behaviors/communications/http/lib/netlib::go-http-client-do-string
  - id: micro-behaviors/process/thread/create::go-runtime-newproc-binary
