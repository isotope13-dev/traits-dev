defaults:
  platforms: [linux]
  for: [elf]

traits:
- id: go-main-attack-dispatch-symbol
  desc: Go ELF exposes named attack dispatcher
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: '\bmain\.(handleAttack|dispatchAttack|runAttack)\b'
    section: .gopclntab
- id: go-main-udp-attack-handler
  desc: Go ELF exposes named UDP flood handlers
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '\bmain\.udp(Flood|Send|plain)\b'
- id: go-main-tcp-attack-handler
  desc: Go ELF exposes named TCP flood handlers
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '\bmain\.tcp(Flood|Send)\b'
- id: go-main-syn-attack-handler
  desc: Go ELF exposes named SYN attack handlers
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '\bmain\.syn(Send)?\b'
- id: go-main-http-attack-handler
  desc: Go ELF exposes named HTTP flood handlers
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '\bmain\.http(Flood|Send)\b'
- id: go-tcp-flood-worker-symbol
  desc: Go TCPFlood attack-thread worker
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '\(\*TCPFlood\)\.attackThread\b'
- id: go-tcp-flood-launcher-symbol
  desc: Go TCPFlood attack-thread launcher
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '\(\*TCPFlood\)\.startAttackThreads\b'

composite_rules:
- id: go-main-attack-handler-cluster
  desc: Go ELF exposes multiple named protocol attack handlers
  crit: suspicious
  conf: 0.99
  needs: 3
  any:
  - id: go-main-udp-attack-handler
  - id: go-main-tcp-attack-handler
  - id: go-main-syn-attack-handler
  - id: go-main-http-attack-handler
- id: go-multivector-network-flood-bot
  desc: Go ELF combines protocol floods, raw sockets, and concurrent workers
  crit: hostile
  conf: 0.99
  attack: T1498.001
  all:
  - id: go-main-attack-handler-cluster
  - id: micro-behaviors/communications/socket/raw::go-rawsocketcall-symbol
  - id: micro-behaviors/communications/http/lib/netlib::go-http-client-do-string
  - id: micro-behaviors/process/thread/create::go-runtime-newproc-binary
- id: go-named-multivector-network-flood
  desc: Go ELF dispatches named multi-protocol floods over network clients
  crit: hostile
  conf: 0.99
  attack: T1498.001
  all:
  - id: go-main-attack-handler-cluster
  - id: micro-behaviors/communications/http/lib/netlib::go-http-client-do-string
  - id: micro-behaviors/communications/socket/connect::go-net-dialtimeout-text
- id: go-threaded-tcp-flood-engine
  desc: Go TCP flood launches attack threads that open timed connections
  crit: hostile
  conf: 0.99
  attack: T1498.001
  all:
  - id: objectives/impact/dos/tcp::tcp-flood
  - id: go-tcp-flood-worker-symbol
  - id: go-tcp-flood-launcher-symbol
  - id: micro-behaviors/communications/socket/connect::go-net-dialtimeout-text
- id: go-c2-multivector-attack-tasking
  desc: Go ELF combines C2 attack dispatch with multiple protocol attack handlers
  crit: hostile
  conf: 0.99
  attack: T1071.001,T1498.001
  all:
  - id: objectives/command-and-control/remote-command/tasking::go-c2-connect-handler-symbol
  - id: micro-behaviors/data/control-flow/dispatch::go-main-command-handler-symbol
  - id: go-main-attack-dispatch-symbol
  - id: go-main-attack-handler-cluster
  - id: micro-behaviors/communications/socket/connect::go-net-dialtimeout-text
# Cache-busting and randomized headers can each occur in legitimate software.
# Requiring an explicitly named attack worker and reset-flood rate accounting
# keeps this composite focused on intentional layer-7 flooding.
- id: go-l7-reset-flood-cache-bust-header-spoof
  desc: Go reset-flood worker cache-busts requests and spoofs headers
  crit: hostile
  conf: 0.99
  attack: T1498.001
  all:
  - id: objectives/impact/dos/attack/botnet::go-attack-worker-name
  - id: micro-behaviors/communications/http/url/query::go-cache-bust-symbol
  - id: micro-behaviors/communications/http/header/custom::go-spoof-headers-symbol
  - id: micro-behaviors/communications/benchmark/flood::go-reset-flood-rate-statistics

- id: go-http-request-flood-attack
  desc: Go HTTP flood with header spoofing
  crit: hostile
  conf: 0.99
  attack: T1498.001
  all:
  - id: go-main-attack-dispatch-symbol
  - id: micro-behaviors/communications/benchmark/flood::go-flood-rate-statistics
  - id: micro-behaviors/communications/http/header/custom::go-spoof-headers-symbol
  - id: micro-behaviors/communications/http/lib/netlib::go-http-client-do-string
  any:
  - id: micro-behaviors/communications/benchmark/flood::go-connection-dropper-symbol
  - id: micro-behaviors/communications/http/url/query::go-cache-bust-symbol
