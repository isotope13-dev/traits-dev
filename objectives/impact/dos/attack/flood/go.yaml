defaults:
  platforms: [linux]
  for: [elf]

traits:
- id: go-main-attack-dispatch-symbol
  desc: Go ELF exposes named attack dispatcher
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: '\bmain\.(handleAttack|dispatchAttack|runAttack)\b'
    section: .gopclntab
- id: go-main-udp-attack-handler
  desc: Go ELF exposes named UDP flood handlers
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '(\bmain|[/.]attack)\.udp(Flood|Send|plain)\b'
- id: go-main-tcp-attack-handler
  desc: Go ELF exposes named TCP flood handlers
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '(\bmain|[/.]attack)\.tcp(Flood|Send)\b'
- id: go-main-syn-attack-handler
  desc: Go ELF exposes named SYN attack handlers
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '(\bmain|[/.]attack)\.syn(Flood|Send)\b'
- id: go-tcp-flood-worker-symbol
  desc: Go TCPFlood attack-thread worker
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '\(\*TCPFlood\)\.attackThread\b'
- id: go-tcp-flood-launcher-symbol
  desc: Go TCPFlood attack-thread launcher
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '\(\*TCPFlood\)\.startAttackThreads\b'

composite_rules:
- id: go-utls-socks-proxied-flood-worker
  desc: Go flood worker combines uTLS fingerprint spoofing with SOCKS4/SOCKS5 proxies
  crit: hostile
  conf: 0.99
  attack: T1498.001
  for: [elf, pe, macho]
  platforms: [linux, windows, macos]
  all:
  - id: objectives/impact/dos/http::go-main-flood-worker-symbol
  - id: micro-behaviors/communications/http/tls::go-utls-fingerprint-customization
  - id: micro-behaviors/communications/proxy/socks/unspecified::socks4-string
  - id: micro-behaviors/communications/proxy/socks/unspecified::socks5-string
- id: go-threaded-tcp-flood-engine
  desc: Go TCP flood launches attack threads that open timed connections
  crit: hostile
  conf: 0.99
  attack: T1498.001
  all:
  - id: objectives/impact/dos/tcp::tcp-flood
  - id: go-tcp-flood-worker-symbol
  - id: go-tcp-flood-launcher-symbol
  - id: micro-behaviors/communications/socket/dial::go-net-dialtimeout-text
# Cache-busting and randomized headers can each occur in legitimate software.
# Requiring an explicitly named attack worker and reset-flood rate accounting
# keeps this composite focused on intentional layer-7 flooding.
