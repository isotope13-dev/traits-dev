defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1499.004

composite_rules:
  - id: wap-push-overflow-flood-loop
    desc: Loop repeatedly sends overflowing WAP Push PDUs to port 2948
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/control-flow/loop/counted::java-counted-burst-for-loop
      - id: micro-behaviors/communications/messaging/send::android-sms-manager-send-data
      - id: micro-behaviors/communications/telephony/wap-push::wap-push-port-data-send
      - id: micro-behaviors/communications/telephony/wap-push::wsp-push-pdu-overlong-length
