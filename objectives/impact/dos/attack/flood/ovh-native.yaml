defaults:
  for: [elf]
  platforms: [linux]
composite_rules:
  - id: ovh-raw-packet-flood
    desc: OVH TCP/UDP attack routines with raw packet transmission APIs
    crit: hostile
    conf: 0.98
    attack: T1498.001
    all:
      - id: micro-behaviors/communications/flood::ovh-tcp-udp-function-set
      - id: micro-behaviors/communications/socket/options::ip-hdrincl-option-reference
      - id: micro-behaviors/communications/socket/create
      - id: micro-behaviors/communications/socket/send/reference::sendto-symbol
