defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries, source]
traits:
  - id: sending-packets-marker
    desc: Detects "sending all the packets" string
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: sending all the packets
  - id: got-root-marker
    desc: Detects "got root?" string (often in tools
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: got root?
  - id: ddos-usage-throttle
    desc: "DDoS throttle/throttle CLI usage"
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)Usage:.{0,220}<threads>.{0,220}<throttle>
  # Moved to micro-behaviors/communications/benchmark/flood: the phrase is a
  # neutral status marker (Open/R uses it for topology flooding), not evidence
  # of a DDoS objective by itself.
  - id: reflection-file-usage
    desc: DDoS reflection file parameter in usage
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: (?i)<reflection.{0,5}file>
