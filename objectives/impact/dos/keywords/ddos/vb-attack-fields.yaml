# Attack-control fields naming the target and duration of an "attack":
# HostToAttack, TimeToAttack, ThreadsToAttack. Vocabulary only; it does not
# show any traffic is generated.
defaults:
  platforms: [windows]
  for: [vbs, csharp]

traits:
  - id: attack-target-duration-fields
    desc: Attack target and duration field names
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\b(Host|Time|Threads?)To(Attack|Flood)\b'
