defaults:
  platforms: [linux, android]
  for: [elf]
traits:
  - id: udpfl00d-function-name
    desc: udpfl00d packet-flood function name
    crit: suspicious
    conf: 0.98
    if:
      type: text
      exact: udpfl00d
      section: .strtab
  - id: httphex-function-name
    desc: httphex HTTP-flood worker function name
    crit: suspicious
    conf: 0.95
    if:
      type: text
      exact: httphex
      section: .strtab
composite_rules:
  - id: command-driven-packet-flood-workers
    desc: Command dispatcher and packet-flood workers
    crit: hostile
    conf: 0.99
    attack: T1498.001
    all:
      - id: metadata/lang/source/naming/action/token::processcmd-name-reference
      - id: tcp-flood-function-name
      - id: udpfl00d-function-name
      - id: objectives/impact/dos/attack/flood::vse-attack-function-name
