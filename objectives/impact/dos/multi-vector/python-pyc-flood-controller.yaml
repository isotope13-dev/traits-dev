defaults:
  platforms: [windows, unix]
  for: [pyc]
  attack: T1498,T1547.001,T1102

traits:
  - id: pyc-udp-flood-function
    desc: Bytecode names a UDP flood function
    crit: notable
    if:
      type: symbol
      kind: identifier
      regex: '(?i)(^|_)udp_flood'
  - id: pyc-http-flood-function
    desc: Bytecode names an HTTP flood function
    crit: notable
    if:
      type: symbol
      kind: identifier
      regex: '(?i)(^|_)http_flood'
  - id: pyc-attack-control-function
    desc: Bytecode names a remote attack control
    crit: notable
    if:
      type: symbol
      kind: identifier
      regex: '(?i)(^|_)(start|stop)_attack'

composite_rules:
  - id: pyc-persistent-socket-flood-client
    desc: Bytecode combines flood control and autostart
    crit: hostile
    conf: 0.98
    all:
      - id: pyc-udp-flood-function
      - id: pyc-http-flood-function
      - id: pyc-attack-control-function
      - id: micro-behaviors/communications/socket/lib::pyc-socketio-module-reference
      - id: micro-behaviors/os/registry/autostart/reference::pyc-hkcu-run-key
      - id: metadata/binary/code/bytecode::pyc-setvalueex-name
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
