defaults:
  platforms: [windows]
  for: [pe]
  attack: T1498.001
  conf: 0.99

traits:
  - id: go-pe-http-flood-handler-family
    desc: Go PE has named HTTP flood handlers
    crit: suspicious
    if:
      type: function
      regex: 'sym\.go\.main\.(flood(Get|Post|Head|Bypass|SlowRead)|sendSlowloris)$'
  - id: go-pe-transport-flood-handler-family
    desc: Go PE has named transport flood handlers
    crit: suspicious
    if:
      type: function
      regex: 'sym\.go\.main\.send(TCP|UDP|SYN|DNS)$'
  - id: go-pe-game-flood-handler-family
    desc: Go PE has named Minecraft attack handlers
    crit: suspicious
    if:
      type: function
      regex: 'sym\.go\.main\.minecraft(Ping|Login|Legacy|Query)$'

composite_rules:
  - id: go-pe-multivector-network-flood-bot
    desc: Go PE combines HTTP and transport flood engines
    crit: hostile
    conf: 0.99
    all:
      - id: go-pe-http-flood-handler-family
      - id: go-pe-transport-flood-handler-family
      - id: micro-behaviors/communications/socket/connect::go-net-dialtimeout-text
      - id: micro-behaviors/communications/http/client/library::go-http-client-do-string
      - id: micro-behaviors/process/thread/create::go-runtime-newproc-binary
    any:
      - id: go-pe-game-flood-handler-family
