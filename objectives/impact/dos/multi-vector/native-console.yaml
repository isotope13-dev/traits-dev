# Some Go constant tables are absent from extracted text. Match their
# space-padded console entries in bytes rather than assuming text coverage.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
traits:
  - id: native-udp-bypass-method
    desc: UDP bypass flood method token
    crit: notable
    conf: 0.9
    if:
      type: raw
      regex: '\x20{4}udp-bypass'
  - id: native-tcp-bypass-method
    desc: TCP bypass flood method token
    crit: notable
    conf: 0.9
    if:
      type: raw
      regex: '\x20{4}tcp-bypass'
  - id: native-private-flood-method
    desc: Private flood method token
    crit: notable
    conf: 0.9
    if:
      type: raw
      regex: '\x20{4}priv-flood'
  - id: native-http-bypass-method
    desc: HTTP bypass flood method token
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: http-bypass
composite_rules:
  - id: native-network-flood-method-catalog
    desc: Catalog advertises network flood methods
    crit: suspicious
    conf: 0.97
    any:
      - id: native-udp-bypass-method
      - id: native-tcp-bypass-method
      - id: native-private-flood-method
      - id: native-http-bypass-method
    needs: 3
  - id: native-multivector-botnet-flood-console
    desc: Network flood console manages bot fleet
    crit: hostile
    conf: 0.99
    attack: T1498.001
    all:
      - id: native-network-flood-method-catalog
      - id: objectives/command-and-control/botnet/dispatch::bot-fleet-attack-console
