defaults:
  platforms: [unix, android]
  for: [elf]
  mbc: B0042
  attack: T1498.001

traits:
  - id: native-flood-worker-symbol-cluster--transport
    desc: Transport flood worker symbol
    crit: suspicious
    conf: 0.97
    if:
      type: symbol
      regex: '(?i)^(udp|tcp|syn)_?flood(_(thread|worker))?$'
  - id: native-flood-worker-symbol-cluster--application
    desc: Application flood worker symbol
    crit: suspicious
    conf: 0.97
    if:
      type: symbol
      regex: '(?i)^(ack|http)_?flood(_(thread|worker))?$'

  - id: native-special-flood-worker
    desc: Specialized flood worker symbols
    crit: suspicious
    conf: 0.95
    if:
      type: symbol
      regex: '(?i)^(pps_attack_thread|minecraft_tcp_flood_thread)$'

  - id: native-attack-dispatcher-symbol
    desc: Multi-vector attack dispatcher
    crit: suspicious
    conf: 0.95
    if:
      type: symbol
      exact: attack_main

  - id: native-attack-type-table
    desc: Multi-vector attack command table
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)Attack types:\s*udp,\s*http,\s*dns,\s*tcp,\s*pps,\s*'

  - id: tcp-flood-function-name
    desc: tcpFl00d network flood function name
    crit: suspicious
    conf: 0.98
    if:
      type: text
      exact: tcpFl00d
      section: .strtab

  - id: tls-hello-flood-function-name
    desc: TLS ClientHello flood function name
    crit: suspicious
    conf: 0.98
    if:
      type: text
      exact: tls_hello_flood

  - id: timed-sigkill-vector-table-dispatcher
    desc: SIGKILL flood timer and vector dispatch
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      section: .text
      # Grandchild sleeps for attack duration, gets parent PID, sends SIGKILL (9),
      # while worker scans 16-byte method entries and calls method[i].func.
      pattern: "89 EF E8 ?? ?? ?? ?? E8 ?? ?? ?? ?? BE 09 00 00 00 89 C7 E8 [260-380] 48 83 C2 10 40 8A 74 24 ?? 40 3A 72 F0 75 ?? [10-20] 48 C1 E0 04 48 89 EE 41 FF 54 00 08"

  - id: sequential-x64-attack-vector-table
    desc: Sequential 64-bit attack vector handler table
    crit: suspicious
    conf: 0.98
    size_max: 10485760
    if:
      type: hex
      section: .data
      # Sequential (uint64_t vector_id, uint64_t fn_ptr) entries for vectors 0..5.
      pattern: "00 00 00 00 00 00 00 00 ?? ?? 40 00 00 00 00 00 01 00 00 00 00 00 00 00 ?? ?? 40 00 00 00 00 00 02 00 00 00 00 00 00 00 ?? ?? 40 00 00 00 00 00 03 00 00 00 00 00 00 00 ?? ?? 40 00 00 00 00 00 04 00 00 00 00 00 00 00 ?? ?? 40 00 00 00 00 00 05 00 00 00 00 00 00 00 ?? ?? 40 00 00 00 00 00"
    unless:
      - id: metadata/binary/header/identity::shared-object-type

composite_rules:
  - id: native-flood-worker-symbol-cluster
    desc: Multiple protocol flood workers
    crit: suspicious
    conf: 0.97
    any:
      - id: native-flood-worker-symbol-cluster--transport
      - id: native-flood-worker-symbol-cluster--application
  - id: native-multi-vector-flooder
    desc: Multi-vector flooder with threaded packet sending
    crit: hostile
    conf: 0.99
    all:
      - id: native-flood-worker-symbol-cluster
      - id: native-attack-dispatcher-symbol
      - id: native-attack-type-table
      - id: micro-behaviors/communications/socket/send::send
      - id: micro-behaviors/process/threading/concurrency::pthread

  - id: iot-multivector-flood-functions
    desc: IoT bot TCP, TLS, and game-query floods
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/dos/attack/flood::vse-attack-function-name
      - id: tcp-flood-function-name
      - id: tls-hello-flood-function-name

  # The query payload alone is normal in game browsers. Require the VSE
  # attack routine and two additional flood vectors before inferring abuse.
  # No controller address, sample filename, or operator branding is needed.
  - id: source-query-http-stdhex-flood-code
    desc: Source query, HTTPSTOMP and STDHEX flood code
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/udp::source-engine-query-payload
      - id: objectives/impact/dos/attack/flood::vse-attack-function-name
      - id: objectives/impact/dos/attack/flood::http-stomp-attack-name
      - id: objectives/impact/dos/attack/flood::send-stdhex-symbol

  - id: timed-multivector-packet-flood-engine
    desc: Timed multi-vector flood with packet loop
    crit: hostile
    conf: 0.99
    all:
      - id: timed-sigkill-vector-table-dispatcher
      - id: sequential-x64-attack-vector-table
      - id: micro-behaviors/communications/flood::native-packet-send-loop
