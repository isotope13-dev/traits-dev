# Refactored Apex2 builds moved the attack registry from the older
# apex2/Methods package path to apex2/internal/attack/{l4,l7,...}.
# Each regex stays inside the alternation budget; the grouping composites
# are the L4 and L7 roles.
defaults:
  platforms: [linux]
  for: [elf]

traits:
  - id: apex2-internal-l4-transport
    desc: Apex2 internal L4 transport flood symbols
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'apex2/internal/attack/l4\.(TCP|UDP|ICMP|GRE)'
  - id: apex2-internal-l4-amp
    desc: Apex2 internal L4 amplification flood symbols
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'apex2/internal/attack/l4\.(CLDAPAmp|NTPAmp|SSDPAmp)'
  - id: apex2-internal-l4-reflector
    desc: Apex2 internal L4 reflector flood symbols
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'apex2/internal/attack/l4\.(MemcachedAmp|OVHUDP|SNMPAmp)'
  - id: apex2-internal-l7-app-flood
    desc: Apex2 internal L7 application flood symbols
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'apex2/internal/attack/l7\.(GRPCFlood|Slowloris|QUICFlood)'
  - id: apex2-internal-l7-protocol-flood
    desc: Apex2 internal L7 protocol flood symbols
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'apex2/internal/attack/l7\.(HTTP2RapidReset|TLSPlus|XReset)'

composite_rules:
  - id: apex2-internal-l4-attack-symbols
    desc: Apex2 internal L4 attack package functions
    crit: notable
    conf: 0.97
    any:
      - id: apex2-internal-l4-transport
      - id: apex2-internal-l4-amp
      - id: apex2-internal-l4-reflector
  - id: apex2-internal-l7-attack-symbols
    desc: Apex2 internal L7 attack package functions
    crit: notable
    conf: 0.97
    any:
      - id: apex2-internal-l7-app-flood
      - id: apex2-internal-l7-protocol-flood
  - id: apex2-internal-multi-vector-ddos
    desc: Apex2 internal package multi-vector DDoS bot
    crit: hostile
    conf: 0.98
    attack: T1498.001,T1071.001
    all:
      - id: apex2-internal-l4-attack-symbols
      - id: apex2-internal-l7-attack-symbols
      - id: objectives/impact/dos/attack/botnet::go-attack-worker-name
    any:
      - id: micro-behaviors/communications/socket/udp::source-engine-query-payload
      - id: micro-behaviors/communications/socket/udp::fivem-getinfo-query-payload
