# Resolve fixed-stride XOR table operands from executable decoder code.
# The key, slot count/stride and data addresses vary. Decoded prefixes are
# behavior evidence; no campaign endpoint, process label or exact size gates.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86]

traits:
  - id: xor-table-udp-tcp-flood-modes
    desc: XOR table holds UDP/TCP flood modes
    crit: suspicious
    conf: 0.98
    attack: T1498.001
    if:
      type: yara
      source: |
        import "elf"
        rule xor_flood_modes {
          strings:
            $decode = { 0F B6 BE ?? ?? ?? ?? 31 D2 EB ?? 69 C6 ?? ?? ?? ?? B9 ?? ?? ?? ?? 89 45 ?? 89 D0 31 D2 F7 F1 8A 82 ?? ?? ?? ?? 8B 55 ?? 32 84 13 ?? ?? ?? ?? 88 84 13 ?? ?? ?? ?? }
          condition:
            uint16(0) == 0x457f and elf.machine == elf.EM_386 and
            for any d in (1..#decode) : (
              uint16(@decode[d]-17) == 0xfe81 and uint8(@decode[d]-11) == 0x77 and
              for any c in (0..elf.number_of_sections-1) : (
                elf.sections[c].name == ".text" and
                @decode[d] >= elf.sections[c].offset and
                @decode[d]+!decode[d] <= elf.sections[c].offset+elf.sections[c].size
              ) and
              for any s in (0..elf.number_of_sections-1) : (
                elf.sections[s].name == ".rodata" and
                for any delta in (elf.sections[s].address-elf.sections[s].offset..elf.sections[s].address-elf.sections[s].offset) : (
                  uint32(@decode[d]+13) >= 32 and uint32(@decode[d]+13) <= 512 and
                  uint32(@decode[d]+18) >= 2 and uint32(@decode[d]+18) <= 64 and
                  (uint32(@decode[d]-15)+1) >= 2 and (uint32(@decode[d]-15)+1) <= 1024 and
                  (uint32(@decode[d]+3)-delta) >= elf.sections[s].offset and (uint32(@decode[d]+3)-delta)+(uint32(@decode[d]-15)+1) <= elf.sections[s].offset+elf.sections[s].size and
                  (uint32(@decode[d]+33)-delta) >= elf.sections[s].offset and (uint32(@decode[d]+33)-delta)+uint32(@decode[d]+18) <= elf.sections[s].offset+elf.sections[s].size and
                  (uint32(@decode[d]+43)+1-delta) >= elf.sections[s].offset and (uint32(@decode[d]+43)+1-delta)+(uint32(@decode[d]-15)+1)*uint32(@decode[d]+13) <= elf.sections[s].offset+elf.sections[s].size and
                    for any slot in (0..(uint32(@decode[d]-15)+1)-1) : (
                      uint8((uint32(@decode[d]+3)-delta) + slot) <= uint32(@decode[d]+13) and
                        uint8((uint32(@decode[d]+3)-delta) + slot) >= 7 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 0) ^ uint8((uint32(@decode[d]+33)-delta) + (0 % uint32(@decode[d]+18)))) == 117 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 1) ^ uint8((uint32(@decode[d]+33)-delta) + (1 % uint32(@decode[d]+18)))) == 100 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 2) ^ uint8((uint32(@decode[d]+33)-delta) + (2 % uint32(@decode[d]+18)))) == 112 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 3) ^ uint8((uint32(@decode[d]+33)-delta) + (3 % uint32(@decode[d]+18)))) == 98 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 4) ^ uint8((uint32(@decode[d]+33)-delta) + (4 % uint32(@decode[d]+18)))) == 111 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 5) ^ uint8((uint32(@decode[d]+33)-delta) + (5 % uint32(@decode[d]+18)))) == 111 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 6) ^ uint8((uint32(@decode[d]+33)-delta) + (6 % uint32(@decode[d]+18)))) == 109
                    ) and
                    for any slot in (0..(uint32(@decode[d]-15)+1)-1) : (
                      uint8((uint32(@decode[d]+3)-delta) + slot) <= uint32(@decode[d]+13) and
                        uint8((uint32(@decode[d]+3)-delta) + slot) >= 9 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 0) ^ uint8((uint32(@decode[d]+33)-delta) + (0 % uint32(@decode[d]+18)))) == 116 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 1) ^ uint8((uint32(@decode[d]+33)-delta) + (1 % uint32(@decode[d]+18)))) == 99 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 2) ^ uint8((uint32(@decode[d]+33)-delta) + (2 % uint32(@decode[d]+18)))) == 112 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 3) ^ uint8((uint32(@decode[d]+33)-delta) + (3 % uint32(@decode[d]+18)))) == 98 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 4) ^ uint8((uint32(@decode[d]+33)-delta) + (4 % uint32(@decode[d]+18)))) == 121 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 5) ^ uint8((uint32(@decode[d]+33)-delta) + (5 % uint32(@decode[d]+18)))) == 112 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 6) ^ uint8((uint32(@decode[d]+33)-delta) + (6 % uint32(@decode[d]+18)))) == 97 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 7) ^ uint8((uint32(@decode[d]+33)-delta) + (7 % uint32(@decode[d]+18)))) == 115 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 8) ^ uint8((uint32(@decode[d]+33)-delta) + (8 % uint32(@decode[d]+18)))) == 115
                    ) and
                    for any slot in (0..(uint32(@decode[d]-15)+1)-1) : (
                      uint8((uint32(@decode[d]+3)-delta) + slot) <= uint32(@decode[d]+13) and
                        uint8((uint32(@decode[d]+3)-delta) + slot) >= 6 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 0) ^ uint8((uint32(@decode[d]+33)-delta) + (0 % uint32(@decode[d]+18)))) == 117 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 1) ^ uint8((uint32(@decode[d]+33)-delta) + (1 % uint32(@decode[d]+18)))) == 100 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 2) ^ uint8((uint32(@decode[d]+33)-delta) + (2 % uint32(@decode[d]+18)))) == 112 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 3) ^ uint8((uint32(@decode[d]+33)-delta) + (3 % uint32(@decode[d]+18)))) == 112 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 4) ^ uint8((uint32(@decode[d]+33)-delta) + (4 % uint32(@decode[d]+18)))) == 112 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 5) ^ uint8((uint32(@decode[d]+33)-delta) + (5 % uint32(@decode[d]+18)))) == 115
                    )
                )
              )
            )
        }
