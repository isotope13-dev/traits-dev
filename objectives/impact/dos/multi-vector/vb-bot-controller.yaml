defaults:
  for: [vbs]
  platforms: [windows]
  attack: T1498

traits:
  - id: vb-slowloris-start-command
    desc: Slowloris start command token
    crit: notable
    if:
      type: text
      substr: '"SlowLorisStart"'
  - id: vb-udp-start-command
    desc: UDP start command token
    crit: notable
    if:
      type: text
      substr: '"UDPStart"'
  - id: vb-syn-start-command
    desc: SYN start command token
    crit: notable
    if:
      type: text
      substr: '"SYNStart"'
  - id: vb-selected-bots-label
    desc: Selected bots interface label
    crit: notable
    if:
      type: text
      substr: '"Selected Bots: '
  - id: vb-encrypted-send-loop
    desc: Encrypted send call to connections
    crit: notable
    if:
      type: text
      substr: 'connected(i).Send(New Encryption().AES_Encrypt('

composite_rules:
  - id: vb-multivector-bot-flood-controller
    desc: Bot controller sends encrypted multi-vector flood commands
    crit: hostile
    all:
      - id: vb-selected-bots-label
      - id: vb-encrypted-send-loop
      - id: vb-slowloris-start-command
      - id: vb-udp-start-command
      - id: vb-syn-start-command
