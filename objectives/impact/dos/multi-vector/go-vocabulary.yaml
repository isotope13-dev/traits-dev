defaults:
  platforms:
    - unix
    - windows
  for:
    - macho
    - elf
    - pe
  crit: component
  conf: 0.9

traits:
  - id: ddos-vocabulary-terms
    desc: DDoS or botnet terminology string
    if:
      type: text
      regex: '(?i)\b(ddos|botnet|udp\s+flood)\b'
  - id: flood-vocabulary-terms
    crit: notable
    desc: Flood attack terminology string
    if:
      type: text
      regex: '(?i)\b(tcp\s+flood|http\s+flood|syn\s+flood|flood\s+attack)\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
