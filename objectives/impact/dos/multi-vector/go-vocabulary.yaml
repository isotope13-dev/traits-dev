defaults:
  platforms:
    - unix
    - windows
  for:
    - macho
    - elf
    - pe
  crit: component
  conf: 0.9

traits:
  - id: go-ddos-attack-vocabulary--general
    desc: General Go DDoS vocabulary
    if:
      type: text
      regex: '(?i)\b(ddos|botnet|udp\s+flood)\b'
  - id: go-ddos-attack-vocabulary--flood
    desc: Go flood attack vocabulary
    if:
      type: text
      regex: '(?i)\b(tcp\s+flood|http\s+flood|syn\s+flood|flood\s+attack)\b'
