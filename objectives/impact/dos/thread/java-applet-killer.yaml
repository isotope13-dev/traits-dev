defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: applet-killer-strings
    desc: AppletKiller family strings
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)AppletKiller
    unless:
      - id: well-known/lib/development/sanitizer-runtime::sanitizer-runtime-library
      - id: well-known/tool/development/gcc-toolchain::gcc-bootstrap-benign-context
composite_rules:
  - id: applet-killer-dos
    desc: Java AppletKiller thread termination logic
    crit: hostile
    conf: 1.0
    all:
      - id: micro-behaviors/process/thread/terminate::stop
      - id: micro-behaviors/process/thread/enumerate/group::get-group
      - id: micro-behaviors/process/thread/enumerate/call::enumerate-dup
      - id: applet-killer-strings
