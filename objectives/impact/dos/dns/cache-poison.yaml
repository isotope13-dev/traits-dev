# DNS cache-poisoning flooders take a victim IP plus a spoofed
# nameserver and emit crafted replies ("DNS DESTROYER" / trustip).
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1498.001,T1565
  mbc: B0042

traits:
  - id: dns-destroyer-banner
    desc: DNS destroyer flooder self-label
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)DNS DESTROYER'
  - id: trustip-victimip-schema
    desc: trustip and victimip argument schema
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)trustip.{0,40}vitcimip|trustip.{0,40}victimip'
  - id: spoofna-spoofip-schema
    desc: spoofna and spoofip argument schema
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)spoofna.{0,40}spoofip'

composite_rules:
  - id: dns-destroyer-trustip
    desc: DNS destroyer with trustip schema
    crit: hostile
    conf: 0.97
    all:
      - id: dns-destroyer-banner
      - id: trustip-victimip-schema
  - id: dns-destroyer-spoof
    desc: DNS destroyer with spoof IP schema
    crit: hostile
    conf: 0.96
    all:
      - id: dns-destroyer-banner
      - id: spoofna-spoofip-schema
  - id: trustip-spoof-dns-flooder
    desc: trustip schema with spoofed DNS
    crit: hostile
    conf: 0.95
    all:
      - id: trustip-victimip-schema
      - id: spoofna-spoofip-schema
