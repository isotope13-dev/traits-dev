defaults:
  platforms: [unix]
  for: [elf]
  attack: T1498.001
  mbc: B0042

composite_rules:
  - id: raw-udp-packet-flooder
    desc: Raw UDP packet flooding tool
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/ip/construct::setup-ip-header-func
      - id: micro-behaviors/communications/ip/construct::setup-udp-header-func
      - id: micro-behaviors/communications/socket/send/reference::sendto-symbol
      - id: micro-behaviors/communications/socket/configure::setsockopt-api-reference
      - id: micro-behaviors/ui/help/command::bracketed-parameter-usage
    any:
      - id: micro-behaviors/communications/flood::attack-status-banner
      - id: metadata/binary/symbols/name/attack::flood-function-symbol

  - id: covert-raw-ip-packet-bot
    desc: Covert raw-IP packet bot with process reconnaissance
    crit: hostile
    conf: 0.99
    attack: T1498.001,T1071,T1057
    mbc: B0030
    all:
      - id: micro-behaviors/communications/socket/raw::raw-socket-error
      - id: micro-behaviors/communications/socket/options::ip-hdrincl-constant
      - id: well-known/lib/native/uclibc::static-uclibc-string-tables
      - id: micro-behaviors/communications/flood::attack-status-banner
    any:
      - id: micro-behaviors/communications/socket/diagnostic::connection-status-strings
      - id: micro-behaviors/fs/proc/cmdline::process-pid-cmdline-format
      - id: micro-behaviors/communications/url/host/dynamic-dns::dynamic-dns-hostname
    needs: 1
    unless:
      - id: well-known/tool/sysadmin/network::adbyby-package-binary

  - id: static-elf-udp-burst-packet-flooder
    desc: Statically linked ELF floods target endpoint with 1200-byte UDP bursts
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/linking/records::elf-dynamic-linker-metadata-absent
      - id: micro-behaviors/communications/ip/parse::inet-addr-symbol
      - id: micro-behaviors/communications/socket/send/reference::sendto-symbol
      - id: objectives/impact/dos/udp-flood::x64-ascii-a-buffer-fill-1200
      - id: objectives/impact/dos/udp-flood::x64-udp-sendto-burst-usleep-loop
