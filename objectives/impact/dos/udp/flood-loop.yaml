defaults:
  platforms: [unix, windows]
traits:
  # NuttX's udpblaster derives a per-packet sleep from the configured host
  # bit rate. Require the configuration, calculation, send, and sleep before
  # treating that loop as a paced network test.
  - id: udpblaster-rate-derived-delay
    desc: Computes delay from UDP host rate
    crit: notable
    conf: 0.95
    for: [c]
    if:
      type: text
      regex: 'delay\s*=\s*\([^;\r\n]{0,80}CONFIG_EXAMPLES_UDPBLASTER_HOSTRATE'
  - id: udpblaster-delay-sleep
    desc: UDP blaster sleeps for computed delay
    crit: notable
    conf: 0.95
    for: [c]
    if:
      type: text
      regex: 'usleep\s*\(\s*delay\s*\)'
  # NuttX syslogd reads complete entries from its configured local syslog
  # device and forwards each entry as one UDP datagram to the configured
  # syslog server. Its blocking log-reader loop is not a packet flood.
  - id: syslog-device-open
    desc: Opens the configured syslog device
    crit: notable
    conf: 0.95
    for: [c]
    if:
      type: text
      regex: 'open\s*\(\s*CONFIG_SYSLOG_DEVPATH'
  - id: syslog-device-buffer-read
    desc: Reads data into a log buffer
    crit: notable
    conf: 0.95
    for: [c]
    if:
      type: text
      regex: 'read\s*\(\s*fd\s*,\s*&buffer'
  - id: syslog-buffer-udp-send
    desc: Sends a log buffer over UDP
    crit: notable
    conf: 0.95
    for: [c]
    if:
      type: text
      regex: 'sendto\s*\(\s*sock\s*,\s*buffer\s*,\s*endpos'
  # A C++ method named send (nghttp2's Worker::send) and Apple's syslogd
  # watch fanout both sit in an infinite loop. Neither is a packet flood.
  - id: nghttp2-worker-source
    desc: nghttp2 reverse proxy worker
    crit: notable
    conf: 0.95
    for: [c, cpp]
    if:
      type: path
      regex: '(^|[\\/])shrpx_worker\.cc$'
  - id: apple-syslogd-source
    desc: Apple syslogd server source
    crit: notable
    conf: 0.95
    for: [c, cpp]
    if:
      type: path
      regex: '(^|[\\/])syslogd\.tproj[\\/]'
  - id: rtpproxy-netio-worker-source
    desc: RTPproxy async network worker
    crit: notable
    conf: 0.95
    for: [c]
    if:
      type: path
      regex: '(^|[\\/])rtpp_netio_async\.c$'
  - id: kamailio-tsend-source
    desc: Kamailio core socket send helper
    crit: notable
    conf: 0.95
    for: [c]
    if:
      type: path
      regex: '(^|[\\/])tsend\.c$'
composite_rules:
  - id: udp-flood-loop
    desc: Unpaced unbounded UDP send loop
    crit: suspicious
    conf: 0.8
    mbc: "C0005" # Flooding
    attack: "T1498" # Network Denial of Service
    for: [c]
    size_max: 50000
    all:
      - id: micro-behaviors/data/control-flow/loop::infinite-loop-header
      - id: micro-behaviors/communications/socket/send::sendto-symbol
    unless:
      - id: udp-flood-loop-known-benign-context
      - id: udpblaster-rate-paced-test
      - id: syslog-device-forwarding-loop
      # These metadata predicates are baseline and cannot be members of an
      # exception composite; retain them as direct, file-level near misses.
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/package/tooling::bacula-source-tree
  # Socket code whose send loop is not a packet flood: a kernel crypto
  # (AF_ALG) socket, a local function that merely shares the name sendto, and
  # two recognized server sources.
  - id: udp-flood-loop-known-benign-context
    desc: Recognized non-flood socket send loop
    crit: exception
    conf: 0.95
    for: [c]
    any:
      - id: micro-behaviors/communications/socket/family::af-alg-socket
      # A paced sender is a periodic protocol announcer (MLD/IGMP membership
      # reports, keepalives), not a flood: floods blast as fast as possible
      # and never sleep between sends.
      - id: micro-behaviors/time/sleep/interval::numeric-delay-call
      # A local function named sendto is not the host socket API. Plan 9's RIP
      # daemon emits route updates on a two minute timer through its own
      # protocol helper, so this name collision is not a packet flood.
      - id: micro-behaviors/communications/socket/send::sendto-function-definition
      # A flood is one-way. Bidirectional event driven services can also
      # send within loops; retain those contexts as explicit exceptions.
      - id: micro-behaviors/communications/socket/receive/
      - id: micro-behaviors/communications/socket/listen/
      - id: micro-behaviors/communications/socket/accept::accept-go
      - id: micro-behaviors/os/event/select/
      - id: micro-behaviors/os/event/poll/
      - id: micro-behaviors/os/event/epoll/
      - id: well-known/lib/runtime/
      - id: nghttp2-worker-source
      - id: apple-syslogd-source
      - id: rtpproxy-netio-worker-source
      - id: kamailio-tsend-source
      - id: micro-behaviors/communications/socket/accept::accept-sym
      - id: micro-behaviors/communications/socket/accept::accept64-sym
      - id: micro-behaviors/communications/socket/accept::accept-func
      - id: micro-behaviors/communications/socket/accept::accepting-server-api-surface
      - id: micro-behaviors/communications/socket/accept::accept-call-source
      - id: well-known/lib/network/curl::libcurl-source-copyright
      - id: well-known/lib/crypto/openssl::openssl-source-copyright
  - id: udpblaster-rate-paced-test
    desc: UDP test sender paces packets by configured rate
    crit: exception
    conf: 0.95
    for: [c]
    all:
      - id: udpblaster-rate-derived-delay
      - id: micro-behaviors/communications/socket/send::sendto-symbol
      - id: udpblaster-delay-sleep
  - id: syslog-device-forwarding-loop
    desc: Syslog loop forwards read entries by UDP
    crit: exception
    conf: 0.95
    for: [c]
    all:
      - id: syslog-device-open
      - id: syslog-device-buffer-read
      - id: syslog-buffer-udp-send
