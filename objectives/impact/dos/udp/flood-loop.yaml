defaults:
  platforms: [unix, windows, macos]
composite_rules:
  - id: udp-flood-loop
    desc: Infinite loop sending network data (DDoS)
    crit: suspicious
    conf: 0.8
    mbc: "C0005" # Flooding
    attack: "T1498" # Network Denial of Service
    for: [c]
    size_max: 50000
    all:
      - id: micro-behaviors/data/control-flow/loop::infinite-loop-header
      - id: micro-behaviors/communications/socket/send::send-symbol
    unless:
      - id: micro-behaviors/communications/socket/family::af-alg-socket
      # A flood is one-way: the point is to emit packets as fast as possible
      # and never read a reply. Code that also RECEIVES in the same file is
      # bidirectional network code, which is what an infinite loop around
      # send() otherwise describes -- every server and client event loop ever
      # written. Without this the two legs (`for(;;)` plus a send symbol,
      # `for: [c]`, under 50KB) matched telnetd, tftpd, ftp, libevent's
      # signal.c, OpenLDAP's sockbuf.c, the JDK's *_close.c, and LibreOffice's
      # Impress Remote BufferedStreamSocket.cxx -- 5 benign samples across 4
      # type directories in one sweep.
      - id: micro-behaviors/communications/socket/receive/
      - id: micro-behaviors/os/event/kernel/select::select-multiplex
