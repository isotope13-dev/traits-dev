defaults:
  platforms: [unix]
  for: [elf]
  attack: T1498.001
  mbc: B0042

traits:
  # Native flooders often expose their controls only in a help/banner string;
  # this is a capability marker, not an attack verdict by itself.
  - id: native-raw-flood-argument-schema
    desc: Raw flooder target and rate argument schema
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: pps_limit

  - id: native-raw-flood-status
    desc: Native raw or VoIP flood status label
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: 'voip flood'

  - id: native-raw-socket-error
    desc: Native raw socket creation failure message
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(could not open raw socket|raw\s+socket\s+(failed|error))'

  - id: native-hdrincl-setsockopt-error
    desc: HDRINCL socket option failure banner
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)cannot set HDRINCL'

  - id: native-preparing-flood-banner
    desc: Flooder preparing-flood status banner
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'preparing flood'

  - id: native-flooding-now-banner
    desc: Flooder flooding-now status banner
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: 'flooding now'

  - id: native-packet-count-usage
    desc: Flooder packet-count usage line
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)number of packets to send'

  - id: native-sending-packet-progress
    desc: Packet-send progress status banner
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)sending packet:\s*%d'

  - id: native-target-packet-usage
    desc: Flooder target packet-count usage schema
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)<target>\s*<number of packets'

  - id: ip-hdrincl-token
    desc: Sets the IP_HDRINCL socket option
    crit: notable
    conf: 0.9
    if:
      type: text
      word: IP_HDRINCL

  - id: dsthost-flood-arg
    desc: Names a dsthost flood argument
    crit: notable
    conf: 0.92
    if:
      type: text
      word: dsthost

  - id: raping-flood-banner
    desc: Raping-style flood status banner
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)raping'
  - id: native-now-flooding-banner
    desc: Now-flooding status banner
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: now flooding
  - id: sending-oversized-packets
    desc: Sending oversized packets banner
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: Sending oversized packets
  - id: ports-to-flood-usage
    desc: Usage takes ports to flood
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: ports to flood
  - id: opening-raw-socket-error
    desc: Opening-raw-socket failure banner
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)opening raw socket'
  - id: hash-packet-count-usage
    desc: Usage takes a packet-count argument
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: '# of packets'
  - id: dstaddr-saddr-usage
    desc: Usage takes dstaddr and saddr
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)<dstaddr>.{0,40}<saddr>'
  - id: src-dst-addr-usage
    desc: Usage takes src_addr and dst_addr
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)<src_addr>.{0,24}<dst_addr>'
  - id: src-ip-dst-ip-usage
    desc: Usage takes src_ip and dst_ip
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\[src_ip\].{0,24}\[dst_ip\]'
  - id: cant-set-ip-hdrincl
    desc: Cannot-set-IP_HDRINCL socket error
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)can''?t set IP_HDRINCL'

  - id: native-flood-worker-symbol
    desc: Native packet flood worker symbol
    crit: component
    conf: 0.9
    if:
      type: text
      substr: flood

composite_rules:
  - id: native-raw-udp-flooder
    desc: Native raw UDP flooder with rate-controlled target interface
    crit: hostile
    conf: 0.99
    all:
      - id: native-raw-flood-argument-schema
      - id: native-raw-flood-status
      - id: native-raw-socket-error
      - id: native-flood-worker-symbol
      - id: micro-behaviors/communications/socket/send::sendto-libc-symbol
      - id: micro-behaviors/communications/socket/options::options-set

  - id: native-threaded-raw-udp-flooder
    desc: Threaded native raw UDP flooder
    crit: hostile
    conf: 0.995
    all:
      - id: native-raw-udp-flooder
      - id: micro-behaviors/process/threading/concurrency::pthread

  # Compact compiled flooders announce the attack in status banners and fail
  # closed on raw-socket / IP_HDRINCL setup rather than exposing pps_limit.
  - id: native-raw-flood-status-cluster
    desc: Raw-socket flooder with HDRINCL and flood banners
    crit: hostile
    conf: 0.99
    all:
      - id: native-preparing-flood-banner
      - id: native-flooding-now-banner
      - id: native-raw-socket-error
      - id: native-hdrincl-setsockopt-error

  - id: native-threaded-raw-flood-status-cluster
    desc: Threaded raw-socket flooder with flood banners
    crit: hostile
    conf: 0.995
    all:
      - id: native-raw-flood-status-cluster
      - id: micro-behaviors/process/threading/concurrency::pthread
      - id: micro-behaviors/communications/socket/send::sendto-symbol

  - id: native-packet-count-socket-flooder
    desc: Socket flooder with packet-count usage and send loop
    crit: hostile
    conf: 0.99
    all:
      - id: native-packet-count-usage
      - id: native-sending-packet-progress
      - id: micro-behaviors/communications/socket/send::sendto-symbol
      - id: micro-behaviors/communications/socket/create::posix-socket-import

  - id: native-packet-count-flood-banners
    desc: Flooder packet-count usage and send progress
    crit: hostile
    conf: 0.99
    all:
      - id: native-packet-count-usage
      - id: native-sending-packet-progress

  - id: native-target-count-flood-usage
    desc: Flooder target schema with packet-count usage
    crit: hostile
    conf: 0.99
    all:
      - id: native-packet-count-usage
      - id: native-target-packet-usage

  - id: native-target-send-progress-flooder
    desc: Flooder target schema with send progress
    crit: hostile
    conf: 0.99
    all:
      - id: native-sending-packet-progress
      - id: native-target-packet-usage

  - id: hdrincl-socket-flooder
    desc: IP_HDRINCL flooder opens a raw socket
    crit: hostile
    conf: 0.94
    all:
      - id: ip-hdrincl-token
      - id: micro-behaviors/communications/socket/create::posix-socket-import

  - id: dsthost-socket-flooder
    desc: dsthost flooder opens a socket
    crit: hostile
    conf: 0.93
    all:
      - id: dsthost-flood-arg
      - id: micro-behaviors/communications/socket/create::posix-socket-import

  - id: raping-socket-flooder
    desc: Raping flooder opens a socket
    crit: hostile
    conf: 0.94
    all:
      - id: raping-flood-banner
      - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: now-flooding-raw-socket
    desc: Now-flooding banner with a raw socket
    crit: hostile
    conf: 0.96
    all:
      - id: native-now-flooding-banner
      - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: oversized-packet-hdrincl-flooder
    desc: Oversized-packet HDRINCL flooder
    crit: hostile
    conf: 0.97
    all:
      - id: sending-oversized-packets
      - id: ip-hdrincl-token
  - id: oversized-packet-socket-flooder
    desc: Oversized-packet flooder opens a socket
    crit: hostile
    conf: 0.96
    all:
      - id: sending-oversized-packets
      - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: ports-to-flood-socket
    desc: Ports-to-flood usage with a socket
    crit: hostile
    conf: 0.95
    all:
      - id: ports-to-flood-usage
      - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: opening-raw-hdrincl-flooder
    desc: Raw-socket error with IP_HDRINCL
    crit: hostile
    conf: 0.96
    all:
      - id: opening-raw-socket-error
      - id: ip-hdrincl-token
  - id: opening-raw-socket-flooder
    desc: Opening-raw-socket error with socket
    crit: hostile
    conf: 0.95
    all:
      - id: opening-raw-socket-error
      - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: packet-count-hdrincl-flooder
    desc: Packet-count usage with IP_HDRINCL
    crit: hostile
    conf: 0.95
    all:
      - id: hash-packet-count-usage
      - id: ip-hdrincl-token
  - id: packet-count-socket-flooder
    desc: Packet-count usage with a socket
    crit: hostile
    conf: 0.94
    all:
      - id: hash-packet-count-usage
      - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: dstaddr-hdrincl-flooder
    desc: dstaddr-saddr usage with IP_HDRINCL
    crit: hostile
    conf: 0.96
    all:
      - id: dstaddr-saddr-usage
      - id: ip-hdrincl-token
  - id: dstaddr-socket-flooder
    desc: dstaddr-saddr usage with a socket
    crit: hostile
    conf: 0.95
    all:
      - id: dstaddr-saddr-usage
      - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: src-dst-hdrincl-flooder
    desc: src-dst-addr usage with IP_HDRINCL
    crit: hostile
    conf: 0.95
    all:
      - id: src-dst-addr-usage
      - id: ip-hdrincl-token
  - id: src-dst-socket-flooder
    desc: src-dst-addr usage with a socket
    crit: hostile
    conf: 0.94
    all:
      - id: src-dst-addr-usage
      - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: src-ip-packet-count-flooder
    desc: src-dst IP usage with packet count
    crit: hostile
    conf: 0.95
    all:
      - id: src-ip-dst-ip-usage
      - id: hash-packet-count-usage
  - id: src-ip-socket-flooder
    desc: src-dst IP usage with a socket
    crit: hostile
    conf: 0.94
    all:
      - id: src-ip-dst-ip-usage
      - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: cant-set-hdrincl-socket
    desc: HDRINCL set-failure with a socket
    crit: hostile
    conf: 0.95
    all:
      - id: cant-set-ip-hdrincl
      - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: cant-set-hdrincl-token
    desc: HDRINCL set-failure with HDRINCL token
    crit: hostile
    conf: 0.95
    all:
      - id: cant-set-ip-hdrincl
      - id: ip-hdrincl-token
