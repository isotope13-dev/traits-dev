defaults:
  platforms: [unix, windows]
  for: [c]
traits:
  - id: unpaced-sendto-only-loop
    desc: Endless loop performs only sendto calls
    crit: suspicious
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        (while_statement
          condition: (_) @guard
          body: (compound_statement
            . (expression_statement
                (call_expression function: (identifier) @send)) .)
          (#match? @guard "^\\(?\\s*(1|true)\\s*\\)?$")
          (#eq? @send "sendto")) @loop
