defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1498.001
composite_rules:
  - id: native-raw-udp-burst-flood
    desc: Raw UDP packet flood repeats twelve-datagram bursts
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/raw::x86-wsasocket-raw-udp-arguments
      - id: micro-behaviors/communications/flood::x86-twelve-datagram-burst-loop
      - id: micro-behaviors/communications/socket/init::wsock32-dll-marker
  - id: native-resource-raw-udp-burst-flood
    desc: Resource loader embeds repeated raw UDP flooding code
    crit: hostile
    conf: 0.98
    # Require nearby packet-socket/burst code and a resource-loading carrier.
    # API strings or an arbitrary binary resource alone cannot pass.
    all:
      - id: micro-behaviors/communications/flood::x86-resource-raw-udp-burst-code
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/communications/socket/init::wsock32-dll-marker
