# The shell AST binds the inline program to an executing command. The source
# prefix and loop are deliberately constrained: a quoted example, echo, comment,
# finite loop, or merely allocated-and-discarded buffer does not qualify.
defaults:
  platforms: [unix]
  for: [shell]
  crit: hostile
  conf: 0.98
  attack: T1499.001

traits:
  - id: shell-node-unbounded-buffer-retention
    desc: Node launch attempts unbounded buffer retention
    if:
      type: tree-sitter
      language: bash
      query: |
        ((command
          name: (command_name) @launcher
          argument: (word) @shell
          . argument: (word) @flag
          . argument: (raw_string) @script) @handoff
          (#match? @launcher "(^|/)(docker|timeout)$")
          (#match? @handoff "^([^ \\t]*/)?(docker[ \\t]+exec|timeout[ \\t]+(--signal=[A-Z0-9]+[ \\t]+)?[0-9.smhd]+[ \\t]+([^ \\t]*/)?docker[ \\t]+exec)[ \\t]")
          (#match? @shell "(^|/)(ba|da|z)?sh$")
          (#match? @flag "^-[a-z]*c[a-z]*$")
          (#match? @script "^'(exec[ \\t]+[0-9]*>/dev/null;[ \\t]*)?node[ \\t]+(-e|--eval)[ \\t]+\"(const|let|var)[ \\t]+[A-Za-z_$][\\w$]*[ \\t]*=[ \\t]*\\[\\][ \\t]*;")
          (#match? @script "\\[\\][ \\t]*;[ \\t]*while[ \\t]*\\([ \\t]*(true|1)[ \\t]*\\)[ \\t]*\\{?[ \\t]*[a-zA-Z_$][\\w$]*\\.push[ \\t]*\\(Buffer\\.alloc(Unsafe)?[ \\t]*\\([ \\t]*[1-9]")
          (#match? @script "Buffer\\.alloc(Unsafe)?[ \\t]*\\([ \\t]*[1-9][0-9 \\t*+]{0,80}\\)[ \\t]*\\)[ \\t]*;?[ \\t]*\\}?[ \\t]*;?[ \\t]*\"[ \\t]*'$"))
