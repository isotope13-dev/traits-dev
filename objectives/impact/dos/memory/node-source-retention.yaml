# A freshly declared array is the actual push receiver. The entire tight
# loop body retains allocations without an exit, eviction or pacing operation.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: hostile
traits:
  - id: node-unbounded-buffer-retention
    desc: Endless loop retains newly allocated buffers
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((_
        [(lexical_declaration
            (variable_declarator name: (identifier) @array value: (array)))
          (variable_declaration
            (variable_declarator name: (identifier) @array value: (array)))]
        . (while_statement condition: (parenthesized_expression (true)) body: (expression_statement (call_expression
          function: (member_expression
            object: (identifier) @retainer
            property: (property_identifier) @push)
          arguments: (arguments
            . (call_expression
              function: (member_expression
                object: (identifier) @buffer
                property: (property_identifier) @allocate)
              arguments: (arguments (_) @size)) .)))))
        (#eq? @array @retainer)
        (#eq? @push "push")
        (#eq? @buffer "Buffer")
        (#match? @allocate "^alloc(Unsafe)?$")
        (#match? @size "^[1-9][0-9 \\t*+]{0,80}$")
        (#set! cleave.ignore-comments "true"))
        ((_
        [(lexical_declaration
            (variable_declarator name: (identifier) @array value: (array)))
          (variable_declaration
            (variable_declarator name: (identifier) @array value: (array)))]
        . (while_statement condition: (parenthesized_expression (true)) body: (statement_block . (expression_statement (call_expression
          function: (member_expression
            object: (identifier) @retainer
            property: (property_identifier) @push)
          arguments: (arguments
            . (call_expression
              function: (member_expression
                object: (identifier) @buffer
                property: (property_identifier) @allocate)
              arguments: (arguments (_) @size)) .))) .)))
        (#eq? @array @retainer)
        (#eq? @push "push")
        (#eq? @buffer "Buffer")
        (#match? @allocate "^alloc(Unsafe)?$")
        (#match? @size "^[1-9][0-9 \\t*+]{0,80}$")
        (#set! cleave.ignore-comments "true"))
        ((_
        [(lexical_declaration
            (variable_declarator name: (identifier) @array value: (array)))
          (variable_declaration
            (variable_declarator name: (identifier) @array value: (array)))]
        . (for_statement body: (expression_statement (call_expression
          function: (member_expression
            object: (identifier) @retainer
            property: (property_identifier) @push)
          arguments: (arguments
            . (call_expression
              function: (member_expression
                object: (identifier) @buffer
                property: (property_identifier) @allocate)
              arguments: (arguments (_) @size)) .)))) @loop)
        (#eq? @array @retainer)
        (#eq? @push "push")
        (#eq? @buffer "Buffer")
        (#match? @allocate "^alloc(Unsafe)?$")
        (#match? @loop "^for[ \\t]*\\([ \\t]*;[ \\t]*;[ \\t]*\\)")
        (#match? @size "^[1-9][0-9 \\t*+]{0,80}$")
        (#set! cleave.ignore-comments "true"))
        ((_
        [(lexical_declaration
            (variable_declarator name: (identifier) @array value: (array)))
          (variable_declaration
            (variable_declarator name: (identifier) @array value: (array)))]
        . (for_statement body: (statement_block . (expression_statement (call_expression
          function: (member_expression
            object: (identifier) @retainer
            property: (property_identifier) @push)
          arguments: (arguments
            . (call_expression
              function: (member_expression
                object: (identifier) @buffer
                property: (property_identifier) @allocate)
              arguments: (arguments (_) @size)) .))) .)) @loop)
        (#eq? @array @retainer)
        (#eq? @push "push")
        (#eq? @buffer "Buffer")
        (#match? @allocate "^alloc(Unsafe)?$")
        (#match? @loop "^for[ \\t]*\\([ \\t]*;[ \\t]*;[ \\t]*\\)")
        (#match? @size "^[1-9][0-9 \\t*+]{0,80}$")
        (#set! cleave.ignore-comments "true"))
    # A bomb handed to `docker exec` exhausts only that container's cgroup:
    # the shape of an isolation/resource-limit probe, not host DoS.
    unless:
      - id: metadata/lang/source/origin::heuristic-quoted-source
      - id: micro-behaviors/os/container/exec::docker-cli-exec
