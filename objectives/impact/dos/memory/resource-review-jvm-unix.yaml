defaults:
  platforms: [windows, unix, appliance]
  for: [java, kotlin, class, java_class, jar]
  attack: T1499

traits:
  - id: jvm-large-byte-array-loop
    desc: JVM large byte allocation loop
    crit: suspicious
    conf: 0.92
    for: [java, kotlin, class, java_class]
    if:
      type: text
      regex: '(for|while).{0,40}new\s+byte\[[^\]]{0,80}1024[^\]]{0,80}1024'

