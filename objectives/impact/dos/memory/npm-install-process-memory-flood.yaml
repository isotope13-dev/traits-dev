defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1499

traits:
  - id: process-memory-flood-windows
    desc: Starts repeated PowerShell processes
    crit: notable
    if:
      type: text
      substr: "while($true) { Start-Process powershell"
  - id: process-memory-flood-memory
    desc: Builds an unbounded memory array
    crit: notable
    if:
      type: text
      substr: "while(true) a.push(new Array(1000000).fill('DoS'))"
  - id: process-memory-flood-run-process
    desc: Starts process flood command
    crit: notable
    if:
      type: text
      substr: 'exec(winDos)'
  - id: process-memory-flood-run-memory
    desc: Starts memory flood command
    crit: notable
    if:
      type: text
      substr: 'exec(memDos)'
  - id: process-memory-flood-report
    desc: Reports resource attack start
    crit: notable
    if:
      type: text
      substr: 'DoS_Started'

composite_rules:
  - id: process-memory-flood-script
    desc: Starts process and memory exhaustion
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/files/included::preinstall-js-basename
      - id: process-memory-flood-windows
      - id: process-memory-flood-memory
      - id: process-memory-flood-run-process
      - id: process-memory-flood-run-memory
      - id: process-memory-flood-report
  - id: npm-install-process-memory-flood
    desc: Install starts resource exhaustion commands
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
      - id: process-memory-flood-script
