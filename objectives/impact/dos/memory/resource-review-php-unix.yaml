defaults:
  platforms: [unix]
  for: [php]
  attack: T1499

traits:
  - id: php-dos-memory-function
    desc: PHP DoS memory function
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: function dos_memory

composite_rules:
  - id: php-upload-progress-oom-worker-abort
    desc: Megabyte PHP upload-progress OOM spray
    crit: hostile
    conf: 0.97
    platforms: [unix, windows]
    for: [python, ruby, scripts, source]
    attack: T1499.004,T1190
    all:
      - id: micro-behaviors/data/buffer/alloc::megabyte-byte-repeat
      - id: micro-behaviors/communications/http/form::php-session-upload-progress-token
      - id: objectives/execution/exploit/php-engine-uaf::nul-session-id-form-field
      - id: micro-behaviors/data/control-flow/loop/counted::python-range-loop-large-bound

