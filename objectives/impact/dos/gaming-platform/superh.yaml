defaults:
  platforms: [linux]
  for: [elf]
  arch: [superh]
composite_rules:
  # Require executable loop evidence as well as protocol/attack vocabulary.
  # A Source server browser can query this protocol without being a flood bot.
  - id: superh-paced-source-query-flood-bot
    desc: Source-query payload and DDoS modes with a paced packet loop
    crit: hostile
    conf: 0.98
    attack: T1498.001
    all:
      - id: micro-behaviors/communications/flood::superh-paced-25-byte-send-loop
      - id: micro-behaviors/communications/socket/syscall::sh-socketcall-wrapper
      - id: micro-behaviors/communications/socket/udp::source-engine-query-payload
      - id: objectives/impact/dos/attack/flood::bypass-mode-name-cluster
