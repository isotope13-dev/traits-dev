defaults:
  platforms: [linux, android]
  for: [elf]
  mbc: B0042
  attack: T1498.001

traits:
  - id: teamspeak3-init-packet-marker
    desc: TeamSpeak 3 init packet marker string
    crit: notable
    conf: 0.85
    if:
      type: text
      exact: TS3INIT1

  - id: fivem-getinfo-query-payload
    desc: FiveM getinfo challenge query payload
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '^getinfo xxx'

composite_rules:
  # A game client or server browser carries one of these probes; a binary that
  # embeds the Source, TeamSpeak 3 and FiveM probes together holds a payload
  # for each game-server UDP flood vector.
  - id: game-server-query-payload-set
    desc: Source, TeamSpeak 3 and FiveM query payloads together
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/socket/udp::source-engine-query-payload
      - id: teamspeak3-init-packet-marker
      - id: fivem-getinfo-query-payload
