defaults:
  platforms: [linux, android]
  for: [elf]
  mbc: B0042
  attack: T1499

composite_rules:
  - id: native-mode-source-query-ddos-bot
    desc: ARM bot combines DDoS commands with Source query flooding
    crit: hostile
    conf: 0.99
    attack: T1498.001
    mbc: B0030
    all:
      - id: objectives/impact/dos/attack/flood::native-ddos-mode-vocabulary
      - id: micro-behaviors/communications/socket/udp::source-engine-query-payload
      - id: metadata/arch/arm::arm
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: ssdp-source-query-procfs-iot-bot
    desc: Exotic-arch SSDP and Source-query flood bot
    crit: hostile
    conf: 0.98
    attack: T1498.001,T1498.002,T1016
    mbc: B0030
    platforms: [linux]
    all:
      - id: micro-behaviors/communications/socket/udp::source-engine-query-payload
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: metadata/arch/iot::exotic-arch
      - id: "metadata/binary/linking/records::elf-dynamic-linker-metadata-absent"
    any:
      - id: objectives/impact/dos/amplification::service-discovery-reflection
      - id: micro-behaviors/communications/http/request/ssdp::ssdp-discovery
    needs: 1
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: source-query-anti-analysis-ddos-bot
    desc: Source query payload with debugger and CPU checks
    crit: hostile
    conf: 0.98
    attack: T1498.001
    all:
      - id: micro-behaviors/communications/socket/udp::source-engine-query-payload
      - id: micro-behaviors/fs/proc/info/path::tracerpid-status-field
      - id: micro-behaviors/os/sysinfo/cpu::sys-devices
    any:
      - id: micro-behaviors/fs/proc/system::system-stat
      - id: micro-behaviors/fs/proc/system::system-stat-xor07
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: source-query-cipher-ddos-bot
    desc: Source-query client with flood attack routines
    crit: hostile
    conf: 0.99
    attack: T1498.001,T1027
    mbc: B0030
    all:
      - id: objectives/impact/dos/variant-flood::raw-tcp-attack-function
      - id: objectives/impact/dos/variant-flood::flood-method-target-diagnostic
      - id: micro-behaviors/communications/socket/udp::source-engine-query-marker
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
    any:
      - id: micro-behaviors/crypto/symmetric/stream/sigma::chacha-salsa-constant
      - id: micro-behaviors/crypto/symmetric/stream/sigma::sigma-stack-constant-x86
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: source-query-mips-syscall-ddos-bot
    desc: Static MIPS credential-equipped Source-query bot
    crit: hostile
    conf: 0.99
    attack: T1498.001,T1106
    mbc: B0030
    all:
      - id: micro-behaviors/communications/socket/udp::source-engine-query-marker
      - id: objectives/impact/dos/attack/multi-vector::bypass-mode-name-cluster
      - id: metadata/arch/iot::mips
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: objectives/lateral-movement/brute-force/iot-creds::iot-default-credential-token-cluster
    any:
      - id: micro-behaviors/os/syscall/raw::mips-direct-syscall-instruction-be
      - id: micro-behaviors/os/syscall/raw::mips-direct-syscall-instruction-le
    needs: 1
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
    # source-query-watchdog-ddos-bot convicts the same Source-query flood
    # bot from its payload and watchdog paths; step down when it fires so
    # one flood capability is not counted as two hostile findings.
    downgrade:
      any:
        - id: source-query-watchdog-ddos-bot

  # The XOR-0x54 string table (VSE payload, /proc/net/tcp, watchdog paths)
  # is shared by every architecture build of the same Mirai fork, so the
  # architecture is carried only by which direct-socket syscall atom fires:
  # a MIPS-only form left the PowerPC build of the same bot without it.
  - id: xor54-source-query-static-ddos-bot
    desc: Encoded VSE query, IoT credentials and C2 status
    crit: hostile
    conf: 0.99
    attack: T1498.001,T1106
    mbc: B0030
    all:
      - id: objectives/impact/dos/attack/flood::vse-attack-function-name
      - id: micro-behaviors/communications/socket/udp::xor54-source-engine-query-payload
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: micro-behaviors/fs/path/device/special::watchdog-device
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-access
      - id: micro-behaviors/communications/socket/diagnostic::xor54-cnc-connection-status
    any:
      - id: micro-behaviors/communications/socket/syscall/combined::mips-direct-network-syscalls
      - id: micro-behaviors/communications/socket/syscall/combined::ppc-socketcall-network-io
      - id: micro-behaviors/communications/socket/syscall/combined::arm-direct-network-syscalls
      - id: micro-behaviors/communications/socket/syscall/combined::arm-oabi-direct-network-syscalls
      - id: micro-behaviors/communications/socket/syscall/combined::arm-literal-pool-network-syscalls
      - id: micro-behaviors/communications/socket/syscall/combined::nios2-network-io-syscalls
      - id: micro-behaviors/communications/socket/syscall/dispatch::m68k-socketcall-wrapper
      - id: micro-behaviors/communications/socket/syscall/dispatch::sh-socketcall-wrapper
      - id: micro-behaviors/communications/socket/syscall/combined::superh-direct-network-client
      - id: micro-behaviors/communications/socket/syscall/combined::arm-literal-pool-socket-connect-pair
      - id: micro-behaviors/communications/socket/syscall/dispatch::i386-socketcall-wrapper
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: source-query-static-pty-iot-bot
    desc: Static embedded Source-query bot with PTY and entropy access
    crit: hostile
    conf: 0.99
    attack: T1498.001,T1059
    mbc: B0030
    all:
      - id: micro-behaviors/communications/socket/udp::source-engine-query-marker
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: micro-behaviors/fs/path/device/terminal::dev-ptmx
      - id: micro-behaviors/os/random/crypto::urandom
    any:
      - id: metadata/arch/arm::arm
      - id: metadata/arch/iot::mips
    needs: 1
    unless:
      - id: arm-source-query-mirai-credential-bot
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: arm-source-query-mirai-credential-bot
    desc: ARM Source-query bot with Mirai default credentials
    crit: hostile
    conf: 0.98
    attack: T1498.001,T1110.001
    mbc: B0030
    all:
      - id: micro-behaviors/communications/socket/udp::source-engine-query-marker
      - id: micro-behaviors/fs/path/device/terminal::dev-ptmx
      - id: micro-behaviors/os/random/crypto::urandom
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-access
    any:
      - id: metadata/arch/arm::arm
      - id: metadata/arch/iot::mips
    needs: 1
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: source-query-static-cipher-pty-bot
    desc: Source-query payload beside Telnet credential staging and cipher
    crit: hostile
    conf: 0.99
    attack: T1498.001
    all:
      - id: micro-behaviors/communications/socket/udp::source-engine-query-marker
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: micro-behaviors/crypto/symmetric/stream/sigma::chacha-salsa-constant
      - id: micro-behaviors/fs/path/device/terminal::dev-ptmx
      # Query clients, encrypted transports and libc PTY support are ordinary
      # capabilities. Require the independent credential propagation routine.
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-shell-stager
      - id: metadata/lang/source/syntax/command/launch::chmod-then-local-execute-command
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: xor18-source-query-shell-ddos-bot
    desc: XOR18 Source-query shell DDoS bot
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/dos/attack/botnet::source-engine-query-xor18
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-paths-xor18
      - id: objectives/anti-static/obfuscation/encoding/xor/path::xor18-watchdog-paths
  - id: xor18-source-query-covert-shell-ddos-bot
    desc: XOR18 Source-query covert shell DDoS bot
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/impact/dos/attack/botnet::source-engine-query-xor18
      - id: micro-behaviors/fs/path/device/special::dev-misc-watchdog-xor18
    any:
      - id: well-known/lib/native/uclibc::static-uclibc-string-tables
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference

  - id: source-query-rival-service-killer
    desc: Source-query DDoS bot that disables embedded services
    crit: hostile
    conf: 0.99
    attack: T1498.001,T1562.001
    mbc: B0030
    platforms: [linux]
    all:
      - id: micro-behaviors/communications/socket/udp::source-engine-query-marker
      - id: objectives/impact/degrade/rival-bot/competitor::embedded-bot-rival-killer

  - id: source-query-watchdog-ddos-bot
    desc: Source-query flood and watchdog path cluster
    crit: hostile
    conf: 0.99
    attack: T1498.001
    mbc: B0030
    platforms: [linux]
    all:
      - id: objectives/impact/dos/attack/flood::vse-attack-function-name
      - id: micro-behaviors/communications/socket/udp::source-engine-query-payload
      - id: objectives/impact/dos/flood::multi-vector-ddos-bot
      - id: micro-behaviors/fs/path/device/special::multi-watchdog-device-cluster
    any:
      - id: metadata/arch/arm::arm
      - id: micro-behaviors/process/argument/subcommand::busybox-uppercase-applet-command
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
    unless:
      - id: metadata/path/directory::test-directory-component
