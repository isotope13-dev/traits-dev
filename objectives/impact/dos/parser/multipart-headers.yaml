# PHP2Shell's allocation-pressure strategies include many headers in a single
# multipart part: native header storage can exceed the request's wire size.
# Match a contiguous header run, not headers accumulated across file parts or
# header-shaped lines in the part body. The blank line terminates the run.
# 128 is a conservative detection threshold, not a PHP limit or RCE claim.
# Accept wire CRLF and escaped CRLF in client code, independent of field names,
# boundaries, header names, builder language, and the target's operating system.
# Context: https://calif.io/php2shell/ ("You said OOM-fatal?") and
# https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, data]
  crit: suspicious
  conf: 0.9
  attack: T1499.004

traits:
  - id: excessive-multipart-part-headers
    desc: Excessive consecutive multipart part headers
    if:
      type: text
      case_insensitive: true
      # Printable ASCII ranges exclude backslash so escaped blank lines cannot
      # be swallowed as header text. Header-name ranges also exclude brackets.
      regex: 'form-data;[\t -\[\]-~]*(\r\n|\\r\\n)([!-Z^-~]+:[\t -\[\]-~]*(\r\n|\\r\\n)){128}'
