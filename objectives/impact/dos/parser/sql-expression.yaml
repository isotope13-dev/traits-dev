# Detect SQL input shapes in text files or source string literals.
# Source assignments are not SQL equality expressions. Parser
# regression tests can deliberately contain the same expensive structures.
# A chained equality expression is a single line-shaped construct: newline
# separated `=token` runs are line-oriented encoded data instead (quoted-
# printable `=XX` hex escapes wrap at ~25 pairs per line, so a same-line
# requirement also never reaches forty pairs there). Separators therefore
# may not cross newlines.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  attack: T1499

traits:
  - id: long-equality-expression-chain-literal
    desc: Forty or more chained equality operators
    crit: suspicious
    conf: 0.95
    if:
      type: literal
      regex: '\b[A-Za-z_][A-Za-z_0-9]{0,15}([ \t]{0,8}=[ \t]{0,8}[A-Za-z_][A-Za-z_0-9]{0,15}){40}'

  - id: wide-deep-equality-projection-literal
    desc: Thousand deep equality projection columns
    crit: suspicious
    conf: 0.98
    count_min: 1000
    if:
      type: literal
      regex: '(=\s{0,8}[A-Za-z_][A-Za-z_0-9]{0,15}\s{0,8}){8},'

  - id: long-equality-expression-chain-text
    desc: Text has forty chained equality operators
    crit: suspicious
    conf: 0.95
    for: [text]
    if:
      type: text
      regex: '\b[A-Za-z_][A-Za-z_0-9]{0,15}([ \t]{0,8}=[ \t]{0,8}[A-Za-z_][A-Za-z_0-9]{0,15}){40}'
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/file/magic/identity::xpm-source-header

  - id: wide-deep-equality-projection-text
    desc: Text has thousand deep equality projections
    crit: suspicious
    conf: 0.95
    for: [text]
    count_min: 1000
    if:
      type: text
      regex: '(=\s{0,8}[A-Za-z_][A-Za-z_0-9]{0,15}\s{0,8}){8},'

composite_rules:
  - id: long-equality-expression-chain
    desc: Forty or more SQL equality operators
    crit: suspicious
    conf: 0.95
    for: [text, scripts, source, json]
    any:
      - id: long-equality-expression-chain-literal
      - id: long-equality-expression-chain-text
  - id: wide-deep-equality-projection
    desc: Thousand deep SQL equality projection columns
    crit: suspicious
    conf: 0.95
    for: [text, scripts, source, json]
    any:
      - id: wide-deep-equality-projection-literal
      - id: wide-deep-equality-projection-text
