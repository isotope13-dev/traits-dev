# Detect the input shape, independent of the parser, route, identifier, or
# generating language. These are suspicious rather than hostile: parser
# regression tests can deliberately contain the same expensive structures.
defaults:
  platforms: [unix, windows]
  for: [text, scripts, typescript, java, go, rust, c, cpp, csharp, json]
  attack: T1499

traits:
  - id: long-equality-expression-chain
    desc: Forty or more chained equality operators
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\b[A-Za-z_][A-Za-z_0-9]{0,15}(\s{0,8}=\s{0,8}[A-Za-z_][A-Za-z_0-9]{0,15}){40}'

  - id: wide-deep-equality-projection
    desc: Thousand deep equality projection columns
    crit: suspicious
    conf: 0.98
    count_min: 1000
    if:
      type: text
      regex: '(=\s{0,8}[A-Za-z_][A-Za-z_0-9]{0,15}\s{0,8}){8},'
