# PHP2Shell's reproducer uses a megabyte filename to exhaust the session
# upload-progress path. Bind the repetition count to the function's default,
# rather than relying on a variable name, a comment, or an unrelated constant.
defaults:
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.95
  attack: T1499.004

traits:
  - id: python-megabyte-filename-default
    desc: Multipart filename uses a megabyte default
    for: [python]
    if:
      type: tree-sitter
      query: |
        ((function_definition
          parameters: (parameters
            (default_parameter name: (identifier) @count
              value: (integer) @size))
          body: (block
            (expression_statement (augmented_assignment
              right: (call arguments: (argument_list
                (keyword_argument name: (identifier) @key
                  value: (binary_operator
                    left: (string) @fill
                    operator: "*"
                    right: (identifier) @used)))))))) @filename
        (#eq? @count @used)
        (#eq? @key "filename")
        (#match? @fill "^[bB]?[\"'][^\"']+[\"']$")
        (#match? @size "^[1-9][0-9]{6,}$"))

  # Wire evidence is independent of the client language and the target SAPI.
  # Bound the match to one filename parameter, without crossing a quote/CRLF.
  - id: oversized-multipart-filename
    desc: Multipart filename header exceeds 8 KiB
    for: [text, data]
    if:
      type: raw
      regex: '(?i)Content-Disposition:[ \t]*form-data;[^\r\n]{0,256}filename="[\x20-\x21\x23-\x7e]+"'
      length_min: 8500
