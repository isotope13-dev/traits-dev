# A malformed WSP header-length uintvar (value 0x80000000) makes a signed
# length negative in the receiving telephony parser, which then crashes on
# array allocation. The sender here builds that Push PDU and delivers it as
# binary SMS to the WAP Push port; the file shows the attack construction and
# delivery, not proof that a given handset is vulnerable. Defender fuzzers
# rarely hard-code both the overflowing bytes and the push port together.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1499.004

composite_rules:
  - id: wap-push-malformed-length-sms-sender
    desc: Sends malformed WAP Push length via binary SMS
    crit: hostile
    conf: 0.93
    near_lines: 40
    all:
      - id: micro-behaviors/communications/telephony/wap-push::wsp-push-pdu-overlong-length
      - id: micro-behaviors/communications/telephony/wap-push::wap-push-port-data-send
      - id: micro-behaviors/communications/messaging/send::android-sms-manager-send-data
