# Endor Labs' CVE-2026-111551 reproductions specify a ListSerde value
# 00 7fffffff 00000000 and a Streams assignment 0000000b 0000000b 7fffffff.
# Match executable hex decoding with an actual Kafka import, not the report's
# prose, CVE names, source variable names or a particular broker address.
# These are file-local co-occurrences, not proof that the bytes reach a broker.
# Suspicious also accommodates protocol fuzzers and regression tests.
#
# Generalize the positive count to >= 2^30 and permit up to 64 trailing bytes:
# a tiny vector cannot supply that many entries. Assignment versions 1-2 put
# the count after the version; versions 3-11 include supported-version first.
# The layout is confirmed by Apache Kafka 4.2.0 AssignmentInfo.decode and
# ListDeserializer.deserializeNullIndexList. Do not guess later wire layouts.
defaults:
  platforms: [unix, windows]
  for: [java, python, javascript, typescript]
  crit: suspicious
  conf: 0.95
  attack: T1499.004

composite_rules:
  - id: kafka-listserde-excessive-count
    desc: Kafka code decodes oversized ListSerde count
    all:
      - id: micro-behaviors/data/decode/hex::zero-tag-huge-count-vector
    any:
      - id: metadata/import/java/org/apache/kafka
      - id: metadata/import/python/kafka
      - id: metadata/import/python/confluent_kafka
      - id: metadata/import/npm/kafkajs

  - id: kafka-streams-excessive-count
    desc: Kafka code decodes oversized Streams assignment
    all:
      - id: micro-behaviors/data/decode/hex::versioned-huge-count-vector
    any:
      - id: metadata/import/java/org/apache/kafka
      - id: metadata/import/python/kafka
      - id: metadata/import/python/confluent_kafka
      - id: metadata/import/npm/kafkajs

