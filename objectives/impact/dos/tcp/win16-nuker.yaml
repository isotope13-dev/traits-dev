defaults:
  platforms: [windows]
  for: [ne, pe, data]
  attack: T1498.001
  mbc: B0042

traits:
  - id: winnuker-marker
    desc: WinNuker DoS tool identifier string
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: "WINNUKER"
  - id: nuker-target-ip-prompt
    desc: Nuker target IP address prompt
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: "Target's Ip Here"
  - id: nuker-irc-status-banner
    desc: IRC nuker attack status banner
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: "Error - Can't Nuke"

  # Crash or nuke action labels on a socket-control nuker: a "(crash)" tag, a
  # "Crashes" menu entry, or a "&Nuke" button, next to the target controls.
  - id: nuker-crash-action-label
    desc: Crash or nuke action label
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '\(crash\)|^crashes$|&nuke\b'

composite_rules:
  - id: win16-winnuker-dos-tool
    desc: Win16 WinNuker IRC DoS nuker tool
    crit: hostile
    conf: 0.98
    all:
      - id: winnuker-marker
    any:
      - id: nuker-target-ip-prompt
      - id: nuker-irc-status-banner

  # A Win16 socket control with a crash action is a remote crash tool: the
  # control sends to a typed address and port, and the label names the effect.
  - id: win16-socket-crash-nuker
    desc: Win16 socket control drives a remote crash action
    crit: hostile
    conf: 0.93
    attack: T1499
    all:
      - id: micro-behaviors/communications/socket/lib::win16-cswskctl-vbx
      - id: nuker-crash-action-label
