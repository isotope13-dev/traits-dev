defaults:
  platforms: [linux, android]
  for: [elf]
  mbc: B0042
  attack: T1498.001
traits:
- id: tcp-flood-handler-cluster--tcpflood-plain
  desc: TCP flood handler names
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: \b(attack_tcpflood|attack_tcpplain)\b

- id: tcp-flood-handler-cluster--tcpboom-killer
  desc: TCP attack handler names
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: \b(attack_tcpboom|attack_tcpkiller)\b

- id: tcp-flood-handler-cluster--handshake
  desc: Handshake flood handler name
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: \b(attack_handshake)\b

composite_rules:
- id: tcp-flood-handler-cluster
  desc: TCP flood handler names
  crit: suspicious
  conf: 0.94
  any:
  - id: objectives/impact/dos/tcp::tcp-flood-handler-cluster--tcpflood-plain
  - id: objectives/impact/dos/tcp::tcp-flood-handler-cluster--tcpboom-killer
  - id: objectives/impact/dos/tcp::tcp-flood-handler-cluster--handshake
