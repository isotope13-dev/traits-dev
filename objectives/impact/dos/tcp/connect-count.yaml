# Classic inetd/connect-loop DoS tools take a host, port, and a repeat
# count ("times to connect") rather than a packet-rate flood banner.
defaults:
  platforms: [unix]
  for: [elf]
  mbc: B0042
  attack: T1499
traits:
  - id: times-to-connect-usage
    desc: Usage takes a connect-repeat count
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)times to connect'
  - id: inetd-dos-banner
    desc: Names an inetd denial-of-service
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)inetd.{0,16}DoS'
  - id: indexed-connect-fail-banner
    desc: Indexed connect-failure status banner
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: 'connect %i failed'
  - id: numeric-internet-address-usage
    desc: Usage takes a numeric internet address
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)numeric internet address'
  - id: optional-port-default-usage
    desc: Usage takes an optional default port
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)optional port number.{0,32}default='
  - id: sending-crash-times-banner
    desc: Sending-crash repeat-count banner
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'Sending crash %d times'
  - id: hits-flag-usage
    desc: Hits-count command-line usage
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)-t hits'
  - id: default-netbios-port-usage
    desc: Default NetBIOS service port usage
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)default 139'
  - id: sending-crash-string-banner
    desc: Sending-crash-string status banner
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Sending crash
  - id: connected-host-port-banner
    desc: Connected-to host-port status banner
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)Connected to \['
  - id: sending-string-times-banner
    desc: Sending-string-repeat status banner
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)Sending string.{0,24}times'
  - id: mirc-bound-socket-crash
    desc: Exploits mIRC bound sockets
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)exploits mIRC'
  - id: packets-sent-stats
    desc: Packets-sent flood statistics banner
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'packets sent:'
  - id: target-ip-port-usage
    desc: Usage takes target IP and port
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)<target ip>.{0,24}<target port>'
  - id: irc-server-ip-usage
    desc: Usage takes an IRC server IP
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: ip_of_irc_server
  - id: creating-send-string-banner
    desc: Creating-string-to-send status banner
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Creating string to send

composite_rules:
  - id: connect-count-dos
    desc: Connect-loop DoS with a repeat count
    crit: hostile
    conf: 0.95
    all:
      - id: times-to-connect-usage
      - id: micro-behaviors/communications/socket/connect::connect
  - id: inetd-connect-count-dos
    desc: Inetd DoS with a connect-repeat count
    crit: hostile
    conf: 0.96
    all:
      - id: times-to-connect-usage
      - id: inetd-dos-banner
  - id: connect-count-socket-dos
    desc: Socket connect-loop with a repeat count
    crit: hostile
    conf: 0.95
    all:
      - id: times-to-connect-usage
      - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: numeric-address-socket-connect-dos
    desc: Numeric-address socket connect flooder
    crit: hostile
    conf: 0.96
    all:
      - id: numeric-internet-address-usage
      - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: optional-port-connect-flooder
    desc: Optional-port TCP connect flooder
    crit: hostile
    conf: 0.95
    all:
      - id: optional-port-default-usage
      - id: micro-behaviors/communications/socket/connect::connect-import
  - id: indexed-connect-fail-flooder
    desc: Indexed connect-failure socket flooder
    crit: hostile
    conf: 0.95
    all:
      - id: indexed-connect-fail-banner
      - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: crash-repeat-socket-nuker
    desc: Crash-repeat banner with a socket
    crit: hostile
    conf: 0.96
    all:
      - id: sending-crash-times-banner
      - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: hits-flag-connect-nuker
    desc: Hits-flag TCP connect nuker
    crit: hostile
    conf: 0.95
    all:
      - id: hits-flag-usage
      - id: micro-behaviors/communications/socket/connect::connect-import
  - id: netbios-port-socket-nuker
    desc: Default NetBIOS port socket nuker
    crit: hostile
    conf: 0.95
    all:
      - id: default-netbios-port-usage
      - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: crash-string-socket-nuker
    desc: Crash-string banner with a socket
    crit: hostile
    conf: 0.96
    all:
      - id: sending-crash-string-banner
      - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: crash-string-connect-nuker
    desc: Crash-string banner with connect
    crit: hostile
    conf: 0.96
    all:
      - id: sending-crash-string-banner
      - id: micro-behaviors/communications/socket/connect::connect-import
  - id: crash-string-connected-host
    desc: Crash-string sent after a connect
    crit: hostile
    conf: 0.96
    all:
      - id: sending-crash-string-banner
      - id: connected-host-port-banner
  - id: irc-server-socket-nuker
    desc: IRC-server IP usage with a socket
    crit: hostile
    conf: 0.95
    all:
      - id: irc-server-ip-usage
      - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: sending-string-times-nuker
    desc: Repeat-string banner with a socket
    crit: hostile
    conf: 0.95
    all:
      - id: sending-string-times-banner
      - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: sending-string-times-connect
    desc: Repeat-string banner with connect
    crit: hostile
    conf: 0.95
    all:
      - id: sending-string-times-banner
      - id: micro-behaviors/communications/socket/connect::connect-import
  - id: mirc-bound-socket-nuker
    desc: mIRC bound-socket crash with connect
    crit: hostile
    conf: 0.96
    all:
      - id: mirc-bound-socket-crash
      - id: micro-behaviors/communications/socket/connect::connect-import
  - id: packets-sent-socket-flooder
    desc: Packets-sent stats with a socket
    crit: hostile
    conf: 0.94
    all:
      - id: packets-sent-stats
      - id: micro-behaviors/communications/socket/create::posix-socket-import
    unless:
      # libnet prints "packets sent:" beside packet errors and byte counts.
      - id: well-known/lib/network/libnet::libnet-basename
  - id: target-ip-port-socket-flooder
    desc: Target-IP-port usage with a socket
    crit: hostile
    conf: 0.94
    all:
      - id: target-ip-port-usage
      - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: packets-sent-target-flooder
    desc: Packets-sent stats with target usage
    crit: hostile
    conf: 0.95
    all:
      - id: packets-sent-stats
      - id: target-ip-port-usage
