defaults:
  platforms: [linux]
  for: [elf]
  attack: T1498.001

traits:
  - id: native-syn-packet-worker
    desc: Native SYN packet sending function
    crit: notable
    conf: 0.98
    if:
      type: symbol
      exact: send_syn_packets
  - id: native-syn-packet-send-error
    desc: SYN packet transmission failure message
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'Failed to send SYN packet'
  - id: native-syn-duration-target-usage
    desc: Network target and duration CLI usage
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: '<target_ip> <target_port> <duration_seconds>'
composite_rules:
  - id: native-threaded-syn-packet-flood
    desc: Threaded native tool floods target with SYN packets
    crit: hostile
    conf: 0.99
    all:
      - id: native-syn-packet-worker
      - id: native-syn-packet-send-error
      - id: native-syn-duration-target-usage
      - id: micro-behaviors/process/thread/runtime::pthread
