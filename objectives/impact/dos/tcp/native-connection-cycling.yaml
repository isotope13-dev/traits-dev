defaults:
  for:
    - "pe"
  platforms:
    - "windows"
  arch:
    - "x86"
composite_rules:
  - id: "native-unlimited-connect-close-flooder"
    desc: "Unlimited timer-driven connection churn"
    crit: "hostile"
    conf: 0.96
    attack: "T1499.002"
    all:
      - id: "metadata/file/profile/tool-reference::socket-stress-cycling-controls"
      - id: "metadata/binary/instruction/operand::native-sentinel-adjacent-counter-limit"
      - id: "micro-behaviors/communications/socket/interface::native-socket-recreate-close-callback"
      - id: "micro-behaviors/ui/window/message::set-timer"
