# TCP NAT-state attacks use forged packet state to interfere with an existing
# mapping. The atomics live with packet construction; these composites capture
# the attack-purpose combination without depending on the NatJack name or CVEs.
defaults:
  platforms: [unix, windows]

composite_rules:
  - id: raw-tcp-packet-emission
    desc: Emits a raw IP packet through a raw socket or Scapy
    crit: suspicious
    conf: 0.95
    any:
      - id: micro-behaviors/communications/socket/raw::raw-socket-creation-regex
      - id: micro-behaviors/communications/socket/raw::scapy-crafted-packet-send

  - id: nat-state-syn-reset-teardown
    desc: Crafts TCP SYN and explicit-sequence RST packets for NAT-state teardown
    crit: hostile
    conf: 0.99
    near_lines: 40
    all:
      - id: raw-tcp-packet-emission
      - id: micro-behaviors/communications/ip/construct::tcp-syn-flag-construction
      - id: micro-behaviors/communications/ip/construct::tcp-rst-flag-construction
      - id: micro-behaviors/communications/ip/construct::tcp-sequence-field-construction
    unless:
      - id: micro-behaviors/communications/ip/literal::rfc5737-documentation-ipv4-literal

  - id: nat-state-forged-reset-injection
    desc: Injects a TCP reset with caller-controlled source and sequence fields
    crit: hostile
    conf: 0.98
    near_lines: 40
    all:
      - id: raw-tcp-packet-emission
      - id: micro-behaviors/communications/ip/construct::tcp-rst-flag-construction
      - id: micro-behaviors/communications/ip/construct::tcp-sequence-field-construction
      - id: micro-behaviors/communications/ip/construct::crafted-ip-source-field
    unless:
      - id: micro-behaviors/communications/ip/literal::rfc5737-documentation-ipv4-literal
