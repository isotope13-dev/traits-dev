defaults:
  for: [c]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: syn-ddos-class-interface
    desc: SYN DDoS class declaration
    if:
      type: text
      regex: 'class\s+CDDOS[A-Za-z0-9_]{0,32}Syn\s*:\s*public\s+CDDOSBase'
      exclude_comments: true
  - id: start-ddos-method-interface
    desc: DDoS start method declaration
    if:
      type: text
      regex: 'virtual\s+void\s+StartDDOS\s*\('
      exclude_comments: true
composite_rules:
  - id: syn-ddos-source-interface
    desc: SYN DDoS module source interface
    crit: hostile
    attack: T1498.001
    all:
      - id: syn-ddos-class-interface
      - id: start-ddos-method-interface
