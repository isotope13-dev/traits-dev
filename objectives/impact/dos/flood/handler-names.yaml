defaults:
  platforms: [linux, android]
  for: [elf]
  mbc: B0042
  attack: T1498.001
traits:
- id: tcp-flood-handler-cluster--tcpflood-plain
  desc: Mirai TCP flood handler names
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: \b(attack_tcpflood|attack_tcpplain)\b

- id: tcp-flood-handler-cluster--tcpboom-killer
  desc: Mirai TCP attack handler names
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: \b(attack_tcpboom|attack_tcpkiller)\b

- id: tcp-flood-handler-cluster--tcpbypass-stomp
  desc: Mirai TCP bypass handler names
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: \b(attack_tcpbypass|attack_tcp_stomp)\b

- id: tcp-flood-handler-cluster--handshake
  desc: Mirai handshake flood handler name
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: \b(attack_handshake)\b

- id: udp-flood-handler-cluster--udpflood-plain
  desc: Mirai UDP flood handler names
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: \b(attack_udpflood|attack_udp_plain)\b

- id: udp-flood-handler-cluster--udp-std-hex
  desc: Mirai UDP variant handler names
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: \b(attack_udp_std|attack_udp_hex)\b

- id: udp-flood-handler-cluster--udpbypass-ovh
  desc: Mirai UDP bypass handler names
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: \b(attack_udpbypass|attack_udp_ovh)\b

- id: multi-vector-ddos-surface--apphttp-icmpflood
  desc: Mirai HTTP and ICMP flood handler names
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: \b(attack_app_http|attack_icmpflood)\b

- id: multi-vector-ddos-surface--socket-tcpflood
  desc: Mirai socket and TCP flood handler names
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: \b(attack_socket|attack_tcpflood)\b

- id: multi-vector-ddos-surface--udpflood
  desc: Mirai UDP flood handler name
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: \b(attack_udpflood)\b

composite_rules:
- id: multi-vector-ddos-bot
  desc: Multi-vector DDoS bot handlers
  crit: suspicious
  conf: 0.97
  any:
  - id: objectives/impact/dos/flood::tcp-flood-handler-cluster
  - id: objectives/impact/dos/flood::udp-flood-handler-cluster
  - id: objectives/impact/dos/flood::multi-vector-ddos-surface
  needs: 2

- id: tcp-flood-handler-cluster
  desc: TCP flood handler names
  crit: suspicious
  conf: 0.94
  any:
  - id: objectives/impact/dos/flood::tcp-flood-handler-cluster--tcpflood-plain
  - id: objectives/impact/dos/flood::tcp-flood-handler-cluster--tcpboom-killer
  - id: objectives/impact/dos/flood::tcp-flood-handler-cluster--tcpbypass-stomp
  - id: objectives/impact/dos/flood::tcp-flood-handler-cluster--handshake
- id: udp-flood-handler-cluster
  desc: UDP flood handler names
  crit: suspicious
  conf: 0.94
  any:
  - id: objectives/impact/dos/flood::udp-flood-handler-cluster--udpflood-plain
  - id: objectives/impact/dos/flood::udp-flood-handler-cluster--udp-std-hex
  - id: objectives/impact/dos/flood::udp-flood-handler-cluster--udpbypass-ovh
- id: multi-vector-ddos-surface
  desc: Multi-vector DDoS handler set
  crit: suspicious
  conf: 0.95
  any:
  - id: objectives/impact/dos/flood::multi-vector-ddos-surface--apphttp-icmpflood
  - id: objectives/impact/dos/flood::multi-vector-ddos-surface--socket-tcpflood
  - id: objectives/impact/dos/flood::multi-vector-ddos-surface--udpflood
