# An IRC-controlled bot that also floods.
#
# The Tsunami/Kaiten lineage has been rebuilt for thirty years and its shape
# never changes: join a hardcoded channel, take commands from whoever holds
# the channel, and implement two families of them -- run a shell command, and
# emit raw attack traffic. The Linux Mint 17.3 ISO compromise of February 2016
# shipped one of these, and its `man.cy` is the same program the Q8 and
# Tsunami sources have carried since the 1990s.
#
# The remote-shell half is already stated in the IRC channel rules. This is
# the other half, and it is a different objective: a shell gives the operator
# this machine, while a flood engine makes the machine an instrument against
# somebody else. A responder needs to know both -- one is a compromise, the
# other is participation in an attack on a third party, with the liability
# that carries.
#
# Keyed on the pairing rather than on any command vocabulary, so the many
# renamed forks of this code are covered without naming one.
defaults:
  platforms: [unix]
  for: [c, cpp, elf, macho, text]
  attack: T1498.001,T1059.004
  mbc: B0002

composite_rules:
  - id: irc-commanded-raw-flood-bot
    desc: IRC bot carries a raw flood engine
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/command-and-control/channel/irc/bot::irc-remote-shell-backdoor
      - id: objectives/impact/dos/flood::raw-ip-syn-packet-source
    unless:
      - id: metadata/package/testing/
      # Network testing tools legitimately ship raw packet generators; what
      # they do not do is take their instructions from an IRC channel.
      - id: well-known/tool/offensive/
