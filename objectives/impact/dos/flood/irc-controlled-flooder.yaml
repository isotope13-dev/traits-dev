defaults:
  platforms:
  - unix
  for:
  - c
  - cpp
  - elf
  - macho
  - text
  attack: T1498.001,T1059.004
  mbc: B0002
  crit: hostile
composite_rules:
- id: irc-commanded-raw-flood-bot
  for:
  - c
  desc: IRC bot carries a raw flood engine
  conf: 0.96
  all:
  - id: objectives/command-and-control/channel/irc/source::irc-remote-shell-backdoor
  - id: objectives/impact/dos/flood::raw-ip-syn-packet-source
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/offensive/
  - id: metadata/path::test-directory-component
- id: irc-commanded-flood-bot-elf
  for:
  - elf
  desc: ELF IRC bot combines flood attack commands with remote shell execution
  conf: 0.98
  all:
  - id: objectives/impact/dos/tcp::tcp-flood
  - id: micro-behaviors/process/create/shell/command-mode::native-shell-command-invocation
  any:
  - id: micro-behaviors/communications/irc/command::privmsg-command-bytes
  - id: objectives/impact/dos/attack/flood::named-flood-command-token
  - id: micro-behaviors/communications/socket/configure::ip-hdrincl-option-reference
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: well-known/tool/offensive/
  - id: metadata/path::test-directory-component
