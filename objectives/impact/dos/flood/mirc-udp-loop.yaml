defaults:
  for: [mirc, text]
  platforms: [windows]
  attack: T1498

traits:
  - id: mirc-udp-packet-count-timer
    desc: Timer repeats target packet routine
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\.timer[A-Za-z0-9_]+\s+-m\s+0\s+[0-9]+\s+[A-Za-z0-9_]+\s+\$1\s+\$2\s+\$3'

composite_rules:
  - id: mirc-timed-udp-target-flood
    desc: Timed mIRC task floods target with UDP payloads
    crit: hostile
    conf: 0.98
    all:
      - id: mirc-udp-payload-volley
      - id: mirc-udp-packet-count-timer
