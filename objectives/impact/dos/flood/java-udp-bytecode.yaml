defaults:
  platforms: [windows, unix]
  for: [class]
traits:
  - id: jvm-udp-flood-handler-name
    desc: JVM class declares a UDP flood handler
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: class.this_class
      regex: '(?i)(^|/)[^/]*(udp.?flood|flood.?udp)[^/]*$'
composite_rules:
  - id: jvm-udp-flood-datagram-sender
    desc: UDP flood handler sends datagrams
    crit: hostile
    conf: 0.98
    all:
      - id: jvm-udp-flood-handler-name
      - id: metadata/import/jvm::datagram-socket-send-reference
