defaults:
  platforms: [linux, android]
  for: [elf]
composite_rules:
  # Raw sockets and IP_HDRINCL alone also describe ordinary packet tools.
  # Require explicit TCP and UDP attack handlers plus both socket creation and
  # packet transmission. Directory references admit imported APIs and direct
  # syscall evidence in statically linked binaries.
  - id: hdrincl-multivector-flood-bot
    desc: TCP/UDP flood handlers with HDRINCL socket APIs
    crit: hostile
    conf: 0.97
    attack: T1498.001
    all:
      - id: multi-vector-ddos-bot
      - id: micro-behaviors/communications/socket/configure::ip-hdrincl-option-reference
      - id: micro-behaviors/communications/socket/create
      - id: micro-behaviors/communications/socket/send
