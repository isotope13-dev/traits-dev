defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  # Propagation supplies the unauthorized context. The packet-loop matcher
  # alone also describes a legitimate packet generator and remains notable.
  - id: router-worm-target-packet-flood
    desc: Router worm with repeated packet-send code
    crit: hostile
    conf: 0.97
    attack: T1498.001
    all:
      - id: objectives/lateral-movement/worm/device-network::router-shell-busybox-payload-propagation
      - id: micro-behaviors/communications/flood::arm-target-packet-send-loop
      - id: micro-behaviors/communications/socket/send::arm-sendto-literal-syscall-wrapper
