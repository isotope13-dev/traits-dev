defaults:
  platforms: [windows]
  for: [mirc, lua, data]
  attack: T1499
traits:
  - id: mirc-zero-delay-channel-flood
    desc: mIRC zero-delay indefinite channel-message timer
    crit: suspicious
    conf: 0.98
    if:
      type: text
      case_insensitive: true
      regex: '\.timer\w*\s+0\s+0\s+\.msg\s+#\s+\$[A-Za-z]\w*'
  - id: mirc-controller-flood-retarget
    desc: IRC flood command selects server and message
    crit: suspicious
    conf: 0.98
    if:
      type: text
      case_insensitive: true
      regex: '\$1 == !flood[^\n]{0,260}writeini[^\n]{0,180}\$5-[^\n]{0,80}server -m \$2 \$3'
composite_rules:
  - id: mirc-remote-zero-delay-channel-flood
    desc: IRC command retargets zero-delay message flood
    crit: hostile
    conf: 0.99
    all:
      - id: mirc-controller-flood-retarget
      - id: mirc-zero-delay-channel-flood
      - id: micro-behaviors/communications/ipc/irc::mirc-on-text-handler
