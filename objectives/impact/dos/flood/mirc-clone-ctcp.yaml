defaults:
  for: [mirc]
  platforms: [windows]
  attack: T1499

traits:
  - id: mirc-clone-ctcp-trigger
    desc: IRC command names clone CTCP flood
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)clone\.flood\.ctcp\.[A-Za-z0-9_]+'
  - id: mirc-clone-privmsg-fanout
    desc: Writes private messages to IRC clones
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)sockwrite[^\n]{0,80}clone\*\s+PRIVMSG'

composite_rules:
  - id: mirc-clone-ctcp-flood-command
    desc: IRC command floods CTCP through IRC clones
    crit: hostile
    conf: 0.98
    near_lines: 3
    all:
      - id: mirc-clone-ctcp-trigger
      - id: mirc-clone-privmsg-fanout
