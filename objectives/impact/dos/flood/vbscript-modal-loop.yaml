defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1499

traits:
  - id: vbs-unbounded-modal-message-loop
    desc: VBScript loops indefinitely on a message box
    crit: hostile
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\s*do[ \t\r]*\n\s*\w+\s*=\s*msgbox\([^:\n]{0,300}\)[ \t\r]*\n\s*loop[ \t\r]*$'
