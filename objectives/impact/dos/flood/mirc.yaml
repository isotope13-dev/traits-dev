# An mIRC remote that answers operator triggers with message volleys is the
# scriptable half of IRC flood harassment: no raw packet socket to open,
# no binary to drop -- the chat client itself is the flood engine. The
# trigger names the attack (`!msgflood1`, `!ctcpflood`) and the wildcard
# socket write makes every clone connection deliver it at once.
defaults:
  platforms: [unix, windows]
  for: [mirc, ircii, scripts, data]
  attack: T1498
  mbc: B0002
composite_rules:
  - id: mirc-commanded-clone-flood
    desc: Flood trigger drives all-clone PRIVMSG
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/command-and-control/channel/irc/client::mirc-sockwrite-all-privmsg
      - id: objectives/command-and-control/channel/irc/client::mirc-text-flood-command
