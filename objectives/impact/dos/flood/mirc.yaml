# An mIRC remote that answers operator triggers with message volleys is the
# scriptable half of IRC flood harassment: no raw packet socket to open,
# no binary to drop -- the chat client itself is the flood engine. The
# trigger names the attack (`!msgflood1`, `!ctcpflood`) and the wildcard
# socket write makes every clone connection deliver it at once.
defaults:
  platforms: [unix, windows]
  for: [mirc, ircii, scripts, data]
  attack: T1498
  mbc: B0002
composite_rules:
  - id: mirc-commanded-clone-flood
    desc: Flood trigger drives all-clone PRIVMSG
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/command-and-control/channel/irc/client::mirc-sockwrite-all-privmsg
      - id: objectives/command-and-control/channel/irc/client::mirc-text-flood-command
  # Opening a socket, writing a long run of random characters, and closing
  # it is a junk-packet flood. Nick generators use a few $chr($r()) calls;
  # the count floor on the character builder keeps those out.
  - id: mirc-socket-junk-flood
    desc: mIRC socket sends random bytes then closes
    crit: hostile
    conf: 0.95
    for: [mirc]
    all:
      - id: objectives/command-and-control/channel/irc/client::mirc-sockopen-call
      - id: objectives/command-and-control/channel/irc/client::mirc-random-chr-fill
      - id: objectives/command-and-control/channel/irc/client::mirc-sockclose
