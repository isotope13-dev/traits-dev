# An mIRC remote that answers operator triggers with message volleys is the
# scriptable half of IRC flood harassment: no raw packet socket to open,
# no binary to drop -- the chat client itself is the flood engine. The
# trigger names the attack (`!msgflood1`, `!ctcpflood`) and the wildcard
# socket write makes every clone connection deliver it at once.
defaults:
  platforms: [unix, windows]
  for: [mirc, ircii, scripts, data]
  attack: T1498
  mbc: B0002
composite_rules:
  - id: mirc-commanded-clone-flood
    desc: Flood trigger drives all-clone PRIVMSG
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/command-and-control/channel/irc/client::mirc-sockwrite-all-privmsg
      - id: objectives/command-and-control/channel/irc/client::mirc-text-flood-command
  # Opening a socket, writing a long run of random characters, and closing
  # it is a junk-packet flood. Nick generators use a few $chr($r()) calls;
  # the count floor on the character builder keeps those out.
  - id: mirc-socket-junk-flood
    desc: mIRC socket sends random bytes then closes
    crit: hostile
    conf: 0.95
    for: [mirc]
    all:
      - id: micro-behaviors/communications/socket/connect::mirc-sockopen
      - id: objectives/command-and-control/channel/irc/client::mirc-random-chr-fill
      - id: micro-behaviors/communications/socket/disconnect::mirc-sockclose

  - id: mirc-commanded-socket-flood
    desc: Flood trigger drives multi-socket connection flood
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/command-and-control/channel/irc/client::mirc-text-flood-command
      - id: micro-behaviors/communications/socket/connect::mirc-sockopen
  # A staged proxy/target-list fetch (%dlpage + %dlfile) paired with
  # integer-IP target ranges is a flood shift being loaded: the bot pulls
  # fresh proxies, then works the ranges. Server, channel, or boot-file
  # variables alongside confirm whose shift it is.
  - id: mirc-proxied-range-flood-config
    desc: mIRC flood config fetches proxies for ranges
    crit: hostile
    conf: 0.95
    for: [mirc, text, data]
    all:
      - id: objectives/command-and-control/channel/irc/bot::mirc-proxy-download-var
      - id: objectives/command-and-control/channel/irc/bot::mirc-scan-range-var
    any:
      - id: objectives/command-and-control/channel/irc/bot::mirc-flood-server-var
      - id: objectives/command-and-control/channel/irc/bot::mirc-flood-channel-var
      - id: objectives/command-and-control/channel/irc/bot::mirc-reg-bootfile-var

