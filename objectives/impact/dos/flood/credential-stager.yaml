defaults:
  platforms: [linux]
  for: [elf]
  attack: T1498.001
composite_rules:
  - id: credential-stager-target-packet-flood
    desc: IoT credential stager with repeated target sendto loop
    crit: hostile
    conf: 0.98
    arch: [x86]
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-pipe-chmod-stager
      - id: micro-behaviors/communications/flood::x86-bound-strided-target-send-loop
  - id: credential-stager-flood-vector-logs
    desc: IoT credential stager carries targeted UDP flood status messages
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::busybox-fallback-download-execute
      - id: micro-behaviors/communications/flood::flood-vector-target-start-log
      - id: micro-behaviors/communications/flood::flood-udp-send-failure-log
