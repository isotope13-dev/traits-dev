defaults:
  platforms: [unix]
  for: [elf]
  arch: [x86-64]
  attack: T1498.001
  mbc: B0042

traits:
  - id: x64-argv-sockaddr-udp-socket-setup
    desc: Builds UDP socket from CLI target
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: .text
      pattern: "66 C1 C0 08 66 89 44 24 02 E8 ?? ?? ?? ?? 31 D2 BE 02 00 00 00 BF 02 00 00 00 89 44 24 04 E8"

composite_rules:
  - id: x64-cli-udp-burst-sendto-flood
    desc: CLI target parser opens UDP socket and enters continuous burst flood loop
    crit: hostile
    conf: 0.99
    all:
      - id: x64-argv-sockaddr-udp-socket-setup
      - id: objectives/impact/dos/udp-flood::x64-ascii-a-buffer-fill-1200
      - id: objectives/impact/dos/udp-flood::x64-udp-sendto-burst-usleep-loop
