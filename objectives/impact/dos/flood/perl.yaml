defaults:
  platforms: [unix, windows]
  for: [perl]
  attack: T1498.001
  mbc: B0042

traits:
  - id: perl-packet-send-destination
    desc: Perl socket send to destination
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\bsend\s*\([^)\n]{1,80}\b(sockaddr_in|pack_sockaddr_in)'

  - id: perl-timed-flood-duration
    desc: Perl flood loop timed duration
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\btime(\(\))?\s*(\+|-|>=|<=|>|<)\s*\$[A-Za-z_]\w*'

  - id: perl-raw-ip-socket-flood
    desc: Perl raw socket for packet flooding
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '\bsocket\s*\(\s*[A-Za-z0-9_]+\s*,\s*PF_INET\s*,\s*SOCK_RAW'

  - id: perl-packet-payload-multiplication
    desc: Perl packet payload multiplication
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(\x27[A-Za-z0-9]\x27|"[A-Za-z0-9]"|\$[A-Za-z_]\w*)\s+x\s+(\$[A-Za-z_]\w*|int\b|\d+)'

composite_rules:
  - id: perl-packet-send-loop
    desc: Perl packet sending loop
    crit: suspicious
    conf: 0.90
    all:
      - id: perl-packet-send-destination
    any:
      - id: perl-timed-flood-duration
      - id: micro-behaviors/data/control-flow/loop/unconditional::infinite-loop-header

  - id: perl-socket-packet-flooder
    desc: Perl socket packet flooding DoS tool
    crit: hostile
    conf: 0.97
    all:
      - id: perl-packet-send-destination
    any:
      - id: perl-raw-ip-socket-flood
      - id: perl-timed-flood-duration
      - id: perl-packet-payload-multiplication
      - id: micro-behaviors/communications/socket/udp::sock-dgram
      - id: micro-behaviors/communications/socket/raw::sock-raw-constant
    unless:
      - id: metadata/package/testing/presence/harness::perl-test-file

  - id: perl-raw-socket-flood
    desc: Perl raw socket packet flooder
    crit: hostile
    conf: 0.98
    all:
      - id: perl-packet-send-destination
      - id: perl-raw-ip-socket-flood
    unless:
      - id: metadata/package/testing/presence/harness::perl-test-file
