defaults:
  for: [mirc]
  platforms: [windows]
  attack: T1498

traits:
  - id: mirc-timed-socket-burst
    desc: Timed handler repeats TCP socket opens
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)sockopen[^\n]{0,150}\n\s*sockopen[^\n]{0,150}\n\s*sockopen'
  - id: mirc-udp-payload-volley
    desc: Sends repeated UDP payloads to target
    crit: notable
    conf: 0.96
    for: [mirc, text]
    if:
      type: text
      regex: '(?is)sockudp[^\n]{0,120}\$str\([^\n]{0,100}\n\s*sockudp[^\n]{0,120}\$str\('
  - id: mirc-flood-timer
    desc: mIRC timer drives packet flood handler
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\.timer[A-Za-z0-9_]+\s+-M\s+%[A-Za-z0-9_.]+\s+0\s+(syn[0-9]+|TCPP)'

composite_rules:
  - id: mirc-timed-tcp-udp-packet-flood
    desc: mIRC timer drives TCP and UDP packet floods
    crit: hostile
    conf: 0.98
    all:
      - id: mirc-timed-socket-burst
      - id: mirc-udp-payload-volley
      - id: mirc-flood-timer
