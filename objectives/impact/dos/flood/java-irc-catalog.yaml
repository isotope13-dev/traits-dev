defaults:
  platforms: [windows, unix]
  for: [class]
traits:
  - id: irc-flood-command-usage
    desc: IRC-style flood command specifies host and threads
    crit: suspicious
    conf: 0.96
    count_min: 2
    if:
      type: value
      path: class.strings[*]
      regex: '^[.!;](http|udp|syn|s)flood <(host|url)>[^\r\n]{0,40}<threads>'
composite_rules:
  - id: irc-shell-bot-flood-command-catalog
    desc: IRC shell bot advertises multiple flood attacks
    crit: hostile
    conf: 0.99
    all:
      - id: irc-flood-command-usage
      - id: objectives/command-and-control/botnet/dispatch::irc-shell-corruption-command-catalog
