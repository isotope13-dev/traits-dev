defaults:
  platforms: [windows, unix]
  for: [class]
traits:
  - id: irc-http-flood-command-usage
    desc: HTTP flood command accepts host and threads
    crit: suspicious
    conf: 0.96
    if:
      type: value
      path: class.strings[*]
      regex: '^[.!;]httpflood <url>[^\r\n]{0,40}<threads>'
  - id: irc-udp-flood-command-usage
    desc: UDP flood command accepts host and threads
    crit: suspicious
    conf: 0.96
    if:
      type: value
      path: class.strings[*]
      regex: '^[.!;]udpflood <host>[^\r\n]{0,40}<threads>'
composite_rules:
  - id: irc-shell-bot-flood-command-catalog
    desc: IRC shell bot advertises multiple flood attacks
    crit: hostile
    conf: 0.99
    all:
      - id: irc-http-flood-command-usage
      - id: irc-udp-flood-command-usage
      - id: objectives/command-and-control/botnet/dispatch::irc-shell-corruption-command-catalog
