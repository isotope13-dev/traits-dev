defaults:
  platforms: [linux, windows, macos]
  for: [elf, pe, macho]
  attack: T1498.001
  mbc: B0042

traits:
  - id: go-main-randstring-symbol
    desc: Go binary defines main.randString helper
    crit: component
    conf: 0.9
    if:
      type: text
      substr: main.randString

composite_rules:
  - id: go-randomized-utls-browser-flood
    desc: Go flood worker pairs randomized string generation with uTLS browser profiles
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/dos/http::go-main-flood-worker-symbol
      - id: objectives/impact/dos/http::go-build-client-profile-symbol
      - id: go-main-randstring-symbol
      - id: micro-behaviors/communications/http/header/value::browser-mozilla-5-0
