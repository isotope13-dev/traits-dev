# Native command line tools that expose multiple network flooding modes.
defaults:
  for: [elf, pe]
  platforms: [unix, windows]
  attack: T1498

traits:
  - id: syn-flood-mode-usage
    desc: CLI advertises a SYN flood mode
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bsyn\s+<ip>\s+<port>\s+<threads>\s+<rounds>\b'
  - id: udp-flood-mode-usage
    desc: CLI advertises a UDP flood mode
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)\budp\s+<ip>\s+<port>\s+<threads>\s+<rounds>\b'
  - id: slow-flood-mode-usage
    desc: CLI advertises a slow flood mode
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bslow\s+<ip>\s+<port>\s+<threads>\s+<rounds>\b'
  - id: http-flood-mode-usage
    desc: CLI advertises an HTTP flood mode
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bhttp\s+<ip>\s+<port>\s+<threads>\s+<rounds>\b'
  - id: syn-flood-worker-symbol
    desc: Native binary has a SYN flood worker
    crit: component
    conf: 0.94
    if:
      type: symbol
      exact: syn_worker
  - id: udp-flood-worker-symbol
    desc: Native binary has a UDP flood worker
    crit: component
    conf: 0.94
    if:
      type: symbol
      exact: udp_worker
  - id: http-flood-worker-symbol
    desc: Native binary has an HTTP flood worker
    crit: component
    conf: 0.94
    if:
      type: symbol
      exact: http_worker
  - id: slow-flood-worker-symbol
    desc: Native binary has a slow flood worker
    crit: component
    conf: 0.94
    if:
      type: symbol
      exact: slowloris

composite_rules:
  - id: native-multivector-flood-mode-usage
    desc: CLI advertises multiple flood modes
    crit: suspicious
    conf: 0.95
    near_bytes: 500
    any:
      - id: syn-flood-mode-usage
      - id: udp-flood-mode-usage
      - id: slow-flood-mode-usage
      - id: http-flood-mode-usage
    needs: 2
  - id: native-multivector-flood-worker-symbols
    desc: Symbols expose multiple flood workers
    crit: suspicious
    conf: 0.94
    any:
      - id: syn-flood-worker-symbol
      - id: udp-flood-worker-symbol
      - id: http-flood-worker-symbol
      - id: slow-flood-worker-symbol
    needs: 2
  - id: native-multivector-network-flood-tool
    desc: Native CLI combines raw packet and HTTP connection flooding modes
    crit: hostile
    conf: 0.99
    all:
      - id: native-multivector-flood-mode-usage
      - id: native-multivector-flood-worker-symbols
