defaults:
  crit: suspicious
  platforms: [unix]
  for: [shell]
traits:
  - id: bomb
    desc: "Classic Bash fork bomb recursion pattern"
    conf: 1.0
    if:
      type: text
      exact: ":(){:|:&};:"
  - id: bomb-regex
    desc: "Bash Fork Bomb with optional whitespace"
    conf: 0.9
    if:
      type: text
      regex: "^\\s*:\\(\\s*\\)\\s*\\{\\s*:\\s*\\|\\s*:\\s*&\\s*\\}\\s*;\\s*:\\s*$"

  # The two traits above only fire when the fork bomb *is* the whole file:
  # `exact:` compares the entire text, and `bomb-regex` anchors at both ends
  # without `(?m)`. That is the shape of a prank .sh, not the shape malware
  # ships in -- a dropper carries the bomb as a string and hands it to
  # `bash -c`, which is exactly what the vplsfpoael crate does from Rust
  # (`Command::new("bash").arg("-c").arg(":(){ :|:& };:")`). Match the literal
  # wherever it appears, in any language, and tolerate the whitespace people
  # actually type -- `:(){ :|:& };:` with spaces is the form that circulates.
  # Notable, not suspicious: the literal alone is a string, and a string can be
  # data. CPython's own base64 test suite carries it as deliberate non-base64
  # input -- `assertNonBase64Data(b'ab:(){:|:&};:==', b'i')` in
  # Lib/test/test_binascii.py -- and Ubuntu ships that in python3.12's orig
  # tarball. The match is correct; the reading was not.
  #
  # The intent this rule was written for is a dropper that carries the bomb as
  # a string and hands it to a shell, so the composite below asks for the
  # handoff. A fork bomb that only ever sits in a bytes literal being fed to a
  # decoder runs on nobody.
  - id: embedded-bash-fork-bomb-literal
    desc: Embeds the bash fork bomb literal
    crit: notable
    conf: 0.97
    for: [source, scripts, binaries]
    attack: T1499.001
    if:
      type: text
      regex: ':[ \t]*\([ \t]*\)[ \t]*\{[ \t]*:[ \t]*\|[ \t]*:[ \t]*&[ \t]*\}[ \t]*;[ \t]*:'
    unless:
      - id: well-known/tool/detection/

  # The `:` is a convention, not a requirement -- any short function name
  # works, and renaming it is the first thing a variant does to dodge a
  # literal match. The engine's regex dialect has no backreferences, so the
  # three names cannot be tied to each other; what carries the weight instead
  # is the body, a function whose entire definition pipes into itself and
  # backgrounds the result. Nothing benign is written that way, but without
  # the backreference this stays a notch below the exact literal.
  - id: renamed-self-piping-fork-bomb
    desc: Self-piping backgrounded function definition
    crit: notable
    conf: 0.85
    for: [source, scripts, binaries]
    attack: T1499.001
    if:
      type: text
      regex: '(?m)\w{1,3}\(\)[ \t]*\{[ \t]*\w{1,3}[ \t]*\|[ \t]*\w{1,3}[ \t]*&[ \t]*\}[ \t]*;'
    unless:
      - id: well-known/tool/detection/

  # Require the bomb in the shell call, not an unrelated execution API.
  - id: staged-bash-fork-bomb-execution
    desc: Rust passes fork bomb to bash -c
    crit: suspicious
    conf: 0.97
    for: [rust]
    attack: T1499.001
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (field_expression
            value: (call_expression
              function: (field_expression
                value: (call_expression
                  function: (scoped_identifier
                    path: (identifier) @command
                    name: (identifier) @new)
                  arguments: (arguments (string_literal) @shell))
                field: (field_identifier) @flag_method)
              arguments: (arguments (string_literal) @flag))
            field: (field_identifier) @payload_method)
          arguments: (arguments (string_literal) @bomb)) @handoff
        (#eq? @command "Command")
        (#eq? @new "new")
        (#match? @shell "^\"(bash|sh)\"$")
        (#eq? @flag_method "arg")
        (#eq? @flag "\"-c\"")
        (#eq? @payload_method "arg")
        (#match? @bomb ":\\s*\\(\\s*\\)\\s*\\{\\s*:\\s*\\|\\s*:\\s*&\\s*\\}\\s*;\\s*:"))

composite_rules:
  # The bomb literal next to a blocklist/denylist assignment is the
  # defender's side of the string: an agent framework's SHELL_BLOCKLIST
  # refusing to run it (universal-llm-agent's `_is_dangerous_shell` gate),
  # not a staged payload. Proximity-bound so a payload elsewhere in the
  # file still reads as a payload.
  - id: blocklisted-fork-bomb-literal
    desc: Fork bomb literal inside a shell blocklist
    crit: notable
    conf: 0.95
    attack: T1499.001
    ref: sha256:96cc34228b8dd9817c978852f6a9a3972e62720c7b915d8584b83f19e019dbe5
    for: [source, scripts, binaries]
    near_bytes: 3000
    all:
      - id: embedded-bash-fork-bomb-literal
      - id: micro-behaviors/process/create/shell/guard::shell-blocklist-assignment
