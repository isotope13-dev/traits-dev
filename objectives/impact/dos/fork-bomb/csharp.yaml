defaults:
  for: [csharp]
  platforms: [linux]
  attack: T1499.004

traits:
  - id: csharp-libc-fork-import
    desc: C# declares libc fork via DllImport
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((method_declaration
          (attribute_list (attribute name: (identifier) @attribute
            (attribute_argument_list (attribute_argument (string_literal) @library))))
          name: (identifier) @method)
        (#eq? @attribute "DllImport")
        (#eq? @method "fork")
        (#match? @library "^.libc([.]so([.][0-9]+)?)?.$")
        )

  - id: csharp-tight-fork-call-loop
    desc: Infinite C# loop only calls fork
    crit: suspicious
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((while_statement condition: (boolean_literal) @condition
          body: (block . (expression_statement
            (invocation_expression function: (identifier) @fork arguments: (argument_list))) .))
        (#eq? @condition "true")
        (#eq? @fork "fork")
        )

composite_rules:
  - id: csharp-unbounded-libc-fork-loop
    desc: C# repeatedly forks without child handling
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: csharp-libc-fork-import
      - id: csharp-tight-fork-call-loop
