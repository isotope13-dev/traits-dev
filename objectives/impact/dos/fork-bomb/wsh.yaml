# A Windows Script Host loop whose body relaunches the running script through
# wscript/cscript: every child enters the same loop and spawns again, so the
# process count grows until the session stops responding. Elevation and
# console-host relaunch helpers start themselves once, outside any loop.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1499.004

traits:
  - id: wsh-self-relaunch-loop
    desc: WSH loop relaunches its own script
    crit: hostile
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '(?is)(\bWhile\s+True|\bDo\s*[\r\n:]).{0,99}\.(Exec|Run)\b[^\n]{0,40}WScript\.Script'
