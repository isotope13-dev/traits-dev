# A direct, unconditional pipeline into two copies of the same function is
# self replication. A conventional recursive function with a stopping branch
# or a pipeline to a different consumer does not match this shape.
defaults:
  platforms: [unix]
  for: [shell]
  crit: hostile
  conf: 0.99
traits:
  - id: recursive-shell-function-pipeline
    desc: Shell function pipes two recursive copies
    if:
      type: tree-sitter
      language: bash
      query: |
        ((function_definition
          name: (word) @function
          body: (compound_statement
            . (pipeline
              . (command name: (command_name (word) @left))
              . (command name: (command_name (word) @right)) .) .)) @replication
          (#eq? @function @left)
          (#eq? @function @right))
    unless:
      - id: metadata/lang/source/origin::heuristic-quoted-source
