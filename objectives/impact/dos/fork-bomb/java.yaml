# Java fork bombs can relaunch the same class through javaw and the current
# class path instead of using the shell's `:(){ :|:& };:` spelling.
defaults:
  platforms: [unix, windows]
  for: [java, class]
  attack: T1499

traits:
  - id: java-forkbomb-class-marker
    desc: Java forkbomb class marker
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bfork_?bomb\b'

composite_rules:
  - id: java-forkbomb-classpath-relaunch
    desc: Java forkbomb relaunches itself through the class path
    crit: hostile
    conf: 0.98
    all:
      - id: java-forkbomb-class-marker
      - id: micro-behaviors/process/create/launch::javaw-classpath-command-line
      - id: micro-behaviors/process/create/shell/lang::runtime-exec-with-shell-array
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
    unless:
      - id: well-known/tool/detection/
