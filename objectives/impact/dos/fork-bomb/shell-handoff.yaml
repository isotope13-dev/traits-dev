# A fork bomb sent into a container via `docker exec` (often wrapped in
# `timeout`) is a pids-cgroup isolation probe and is intentionally not matched.
defaults:
  platforms: [unix]
  for: [shell]
  crit: hostile
  conf: 0.99
  attack: T1499.001

traits:
  - id: shell-executes-fork-bomb
    desc: Shell executes recursive fork bomb
    if:
      type: tree-sitter
      language: bash
      query: |
        ((command
          name: (command_name) @shell
          argument: (word) @flag
          . argument: [(raw_string) (string)] @payload) @handoff
          (#match? @shell "(^|/)(ba|da|z)?sh$")
          (#match? @flag "^-[a-z]*c[a-z]*$")
          (#match? @payload "^['\"]:[ \\t]*\\([ \\t]*\\)[ \\t]*\\{[ \\t]*:[ \\t]*\\|[ \\t]*:[ \\t]*&[ \\t]*\\}[ \\t]*;[ \\t]*:['\"]$"))

