defaults:
  platforms: [unix]
  for: [shell]
  crit: hostile
  conf: 0.99
  attack: T1499.001

traits:
  - id: shell-executes-fork-bomb
    desc: Shell executes recursive fork bomb
    if:
      type: tree-sitter
      language: bash
      query: |
        ((command
          name: (command_name) @shell
          argument: (word) @flag
          . argument: [(raw_string) (string)] @payload) @handoff
          (#match? @shell "(^|/)(ba|da|z)?sh$")
          (#match? @flag "^-[a-z]*c[a-z]*$")
          (#match? @payload "^['\"]:[ \\t]*\\([ \\t]*\\)[ \\t]*\\{[ \\t]*:[ \\t]*\\|[ \\t]*:[ \\t]*&[ \\t]*\\}[ \\t]*;[ \\t]*:['\"]$"))

  - id: container-shell-executes-fork-bomb
    desc: Docker exec launches shell fork bomb
    if:
      type: tree-sitter
      language: bash
      query: |
        ((command
          name: (command_name) @launcher
          argument: (word) @shell
          . argument: (word) @flag
          . argument: [(raw_string) (string)] @payload) @handoff
          (#match? @launcher "(^|/)(docker|timeout)$")
          (#match? @handoff "^([^ \\t]*/)?(docker[ \\t]+exec|timeout[ \\t]+(--signal=[A-Z0-9]+[ \\t]+)?[0-9.smhd]+[ \\t]+([^ \\t]*/)?docker[ \\t]+exec)[ \\t]")
          (#match? @shell "(^|/)(ba|da|z)?sh$")
          (#match? @flag "^-[a-z]*c[a-z]*$")
          (#match? @payload "^['\"]:[ \\t]*\\([ \\t]*\\)[ \\t]*\\{[ \\t]*:[ \\t]*\\|[ \\t]*:[ \\t]*&[ \\t]*\\}[ \\t]*;[ \\t]*:['\"]$"))
