defaults:
  platforms: [windows]
  for: [batch]

composite_rules:
  - id: batch-bound-process-exhaustion
    desc: Unbounded detached process creation
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/launch::batch-start-command-call
      - id: metadata/lang/source/declaration::batch-label-loop
      - id: micro-behaviors/data/control-flow/loop::batch-goto-loop-command
    near_lines: 16
  # The `again` loop label is also used for a detached launch cycle; requiring
  # both the loop composite and START ties repeated process creation to the cycle.
  - id: batch-again-process-exhaustion
    desc: Unbounded launch in a batch GOTO cycle
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/launch::batch-start-command-call
      - id: micro-behaviors/data/control-flow/loop::batch-label-again
      - id: micro-behaviors/data/control-flow/loop::batch-goto-again-command
    near_lines: 16
    unless:
      - id: micro-behaviors/process/lifecycle/supervise::windows-filtered-query-launch-delay
