defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: batch-unconditional-start-cycle
    desc: Unbounded cycle of detached START commands
    crit: suspicious
    conf: 0.98
    if:
      type: metrics
      field: source.batch.unconditional_start_cycles
      min: 1
composite_rules:
  - id: batch-bound-process-exhaustion
    desc: Unbounded detached process creation
    crit: hostile
    conf: 0.99
    all:
      - id: batch-unconditional-start-cycle
      - id: micro-behaviors/process/create/launch::batch-start-command-call
