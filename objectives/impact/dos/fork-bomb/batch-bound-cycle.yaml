defaults:
  platforms: [windows]
  for: [batch]

composite_rules:
  - id: batch-bound-process-exhaustion
    desc: Unbounded detached process creation
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/source/syntax/command/control::batch-start-command-call
      - id: metadata/lang/source/naming/declaration::batch-label-loop
      - id: micro-behaviors/data/control-flow/transfer::batch-goto-loop-command
    near_lines: 16
    unless:
      # A leading unconditional return makes the later textual cycle dead.
      # Restrict the prefix to blank lines and ECHO OFF so an earlier branch
      # or CALL cannot jump past the return and enter the launch cycle.
      - id: micro-behaviors/process/exit/terminate::batch-entry-immediate-return
  # The `again` loop label is also used for a detached launch cycle; requiring
  # both the loop composite and START ties repeated process creation to the cycle.
  - id: batch-again-process-exhaustion
    desc: Unbounded launch in a batch GOTO cycle
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/source/syntax/command/control::batch-start-command-call
      - id: metadata/lang/source/naming/declaration::batch-label-again
      - id: micro-behaviors/data/control-flow/transfer::batch-goto-again-command
    near_lines: 16
    unless:
      - id: micro-behaviors/process/lifecycle/supervise::windows-filtered-query-launch-delay
      - id: micro-behaviors/process/exit/terminate::batch-entry-immediate-return
