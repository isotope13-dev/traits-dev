defaults:
  platforms: [windows]
  for: [batch]
  attack: T1499.004

traits:
  - id: batch-wildcard-start-loop
    desc: Batch wildcard loop starts every file
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bfor\s+%%[a-z]\s+in\s*\([^)]{0,20}\*\.?\*[^)]{0,20}\)\s*do\s+start\b'

  - id: batch-goto-start-fork-loop
    desc: Batch goto loop continuously starts processes
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is):[^\s:\r\n]{1,32}\s*\r?\n\s*start\s+[^\r\n]{0,80}\r?\n\s*goto\s+[^\s:\r\n]{1,32}'
    not:
      - regex: '(?i)\bif\b'

composite_rules:
  - id: batch-start-fork-bomb
    desc: Batch loop rapidly forks detached processes
    crit: hostile
    conf: 0.98
    all:
      - id: batch-wildcard-start-loop
      - id: micro-behaviors/process/create/shell/batch::batch-for-start-variable

  - id: batch-goto-start-fork-bomb
    desc: Batch goto loop continuously forks detached processes
    crit: hostile
    conf: 0.98
    all:
      - id: batch-goto-start-fork-loop
      - id: micro-behaviors/process/create/shell/batch::batch-starts-batch-file

