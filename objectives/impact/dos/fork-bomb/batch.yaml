defaults:
  platforms: [windows]
  for: [batch]
  attack: T1499.004

traits:
  # Each side of the pipeline relaunches the current batch file, and both
  # children repeat the line. Comments and echoed examples do not match.
  - id: batch-self-pipeline-fork-bomb
    desc: Batch self-pipeline recursively spawns twice
    crit: hostile
    conf: 0.99
    unless:
      - id: metadata/path/directory::test-directory-component
    if:
      type: text
      regex: '(?m)^[ \t]*@?%0[ \t]*\|[ \t]*%0[ \t]*\r?$'
  - id: batch-wildcard-start-loop
    desc: Batch wildcard loop starts every file
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bfor\s+%%[a-z]\s+in\s*\([^)]{0,20}\*\.?\*[^)]{0,20}\)\s*do\s+start\b'

composite_rules:
  - id: batch-start-fork-bomb
    desc: Batch loop rapidly forks detached processes
    crit: hostile
    conf: 0.98
    all:
      - id: batch-wildcard-start-loop
      - id: micro-behaviors/process/create/shell/variable-command::batch-for-start-variable

