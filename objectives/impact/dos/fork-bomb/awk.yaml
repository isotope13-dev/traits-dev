defaults:
  platforms: [unix]
  for: [text]
  attack: T1499
  size_max: 8192

composite_rules:
  - id: gawk-fork-extension-endless-loop
    desc: AWK loads fork extension, loops forever
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/fork::gawk-fork-extension-load
      - id: micro-behaviors/data/control-flow/iteration::awk-begin-infinite-loop
