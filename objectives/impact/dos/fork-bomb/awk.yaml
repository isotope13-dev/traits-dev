defaults:
  platforms: [unix]
  for: [text]
  attack: T1499
  size_max: 8192

composite_rules:
  - id: gawk-fork-extension-endless-loop
    desc: AWK fork call with extension and infinite loop
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/import/module::gawk-fork-extension-load
      - id: micro-behaviors/data/control-flow/loop/unconditional::awk-begin-infinite-loop
      - id: micro-behaviors/process/create/fork::awk-bare-fork-call
