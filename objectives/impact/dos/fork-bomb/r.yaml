# R fork bomb. `library(multicore)` supplies the fork; the entire loop
# body is the fork call, so every child re-enters the same unbounded
# loop and the process count doubles per iteration. A legitimate R
# parallel job bounds its workers (`mclapply`, `parLapply`) or branches
# on the fork result; this shape does neither.
defaults:
  platforms: [unix, windows]
  for: [text]
  attack: T1499.004

traits:
  - id: r-tight-fork-loop
    desc: Fork call is the whole loop body
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'while\s*\(\s*(TRUE|T)\s*\)\s*;?\s*fork\s*\(\s*\)'

composite_rules:
  - id: unbounded-r-fork-bomb
    desc: Unbounded R loop whose body is a fork
    crit: hostile
    conf: 0.95
    all:
      - id: r-tight-fork-loop
      - id: micro-behaviors/process/create/fork::awk-bare-fork-call
