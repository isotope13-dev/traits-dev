defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
  attack: T1499.004

traits:
  - id: forkbomb-symbol-text
    desc: Forkbomb symbol text
    crit: suspicious
    conf: 0.92
    if:
      # Capture the trailing token so `not:` can drop kebab-case spellings.
      type: text
      regex: '(?i)fork_?bomb[-\w]{0,12}'
    not:
      # `forkbomb-` can only be a CLI/config option key — a hyphen is not legal
      # in a C/Go/Rust identifier, so it is never a symbol. uWSGI's option
      # table carries `forkbomb-delay`, its *protection* knob, and uWSGI ships
      # in a large share of Python web container images.
      - regex: '(?i)fork_?bomb-'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
composite_rules:
  - id: forkbomb-goroutine-runtime
    desc: Forkbomb with goroutine runtime
    crit: hostile
    conf: 0.98
    all:
      - id: forkbomb-symbol-text
      - id: micro-behaviors/process/thread/create::go-runtime-newproc-binary
    unless:
      - id: well-known/tool/detection/
