defaults:
  for: [python]
  platforms: [unix, windows]
  crit: suspicious

traits:
  - id: large-range-yield-header
    desc: Loops over a large numeric range
    crit: component
    if:
      type: text
      regex: 'for [A-Za-z_][A-Za-z_0-9]{0,47} in range\([1-9][0-9]{4,8}\):'
  - id: yield-serialized-frame
    desc: Yields a serialized frame after loop header
    crit: component
    if:
      type: text
      regex: '\):[ \t]*\r?\n[ \t]{1,32}yield [A-Za-z_][A-Za-z_0-9]{0,47}\.serialize\(\)'

composite_rules:
  # Both matches start on the loop header line; the second spans its immediate body.
  - id: large-serialized-frame-burst
    desc: Yields serialized frames in a large range loop
    crit: component
    near_lines: 0
    all:
      - id: large-range-yield-header
      - id: yield-serialized-frame

  - id: zero-window-ping-burst
    desc: Builds zero-window HTTP/2 PING bursts
    ref: https://xint.io/blog/nginx2root-remote-code-execution
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/message::hyperframe-zero-stream-window
      - id: micro-behaviors/communications/http/message::hyperframe-ping
      - id: large-serialized-frame-burst
