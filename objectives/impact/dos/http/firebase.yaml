# Repeated sendOobCode PASSWORD_RESET requests abuse a weakly rate-limited
# Firebase project to flood a victim's inbox. The API and protocol payload are
# language-independent; the loop alternatives cover common implementation
# languages without keying on comments or explanatory text.
defaults:
  platforms: [unix, windows, android]
  for: [scripts, source]
  attack: T1499
  mbc: B0033

composite_rules:
  - id: firebase-password-reset-mail-flood
    desc: Repeats Firebase password-reset requests to flood a target mailbox
    crit: hostile
    conf: 0.99
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/http/services/firebase::firebase-password-reset-endpoint
      - id: micro-behaviors/communications/http/services/firebase::firebase-password-reset-request
    any:
      - id: micro-behaviors/data/control-flow/loop::python-numeric-range-loop
      - id: micro-behaviors/data/control-flow/loop::native-numeric-bound-loop
      - id: micro-behaviors/data/control-flow/loop::shell-large-numeric-sequence-loop
