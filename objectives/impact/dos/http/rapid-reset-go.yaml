defaults:
  platforms: [linux]
  for: [elf]
  attack: T1498.001

traits:
  - id: go-rapid-reset-mode-banner
    desc: Go HTTP Rapid Reset attack mode
    crit: suspicious
    conf: 0.99
    if:
      type: raw
      substr: MODE=RapidReset
      section: .rodata

composite_rules:
  - id: go-http2-rapid-reset-flood
    desc: Go workers flood HTTP/2 streams with rapid resets
    crit: hostile
    conf: 0.99
    all:
      - id: go-rapid-reset-mode-banner
      - id: micro-behaviors/communications/benchmark/flood::go-reset-flood-rate-statistics
      - id: objectives/impact/dos/attack/flood::go-main-attack-dispatch-symbol
      - id: micro-behaviors/communications/http/message::http2-preface
      - id: micro-behaviors/communications/http/lib/netlib::go-http-client-do-string
