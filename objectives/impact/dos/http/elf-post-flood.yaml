defaults:
  platforms: [unix]
  for: [elf]
  attack: T1499
  mbc: B0042
traits:
  - id: maxint-http-content-length-header
    desc: Max signed-integer HTTP Content-Length header
    crit: suspicious
    conf: 0.96
    if:
      type: text
      exact: 'Content-Length: 2147483647'
      section: rodata
composite_rules:
  - id: maxint-random-body-http-post-flood
    desc: Max-length random-body HTTP POST flood
    crit: hostile
    conf: 0.98
    all:
      - id: maxint-http-content-length-header
      - id: micro-behaviors/communications/http/request/body::fixed-random-data-form-body
    any:
      - id: micro-behaviors/communications/http/post::post-request-line
      - id: micro-behaviors/communications/http/post::native-post-request-line
