# Malformed DNS SIG(0) messages delivered over DoH become an unauthenticated
# single-request denial-of-service trigger when the transport is closed before
# signature verification completes. Match protocol construction and transport
# structure, not a product name, CVE, or prose description.
defaults:
  platforms: [unix, windows, appliance]
  for: [scripts, source]
  attack: T1499.004
  mbc: B0030

composite_rules:
  - id: python-zero-filled-dns-sig0-record
    desc: Python DNS SIG(0) with zero signature
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/dns/auth::dnspython-sig0-record-construction
      - id: micro-behaviors/data/source/syntax/array::python-repeated-zero-bytes

  - id: object-zero-filled-dns-sig0-record
    desc: Object DNS SIG(0) with zero signature
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/dns/auth::object-dns-sig0-record-construction
      - id: micro-behaviors/data/source/syntax/array::zero-filled-byte-constructor

  - id: native-zero-filled-dns-sig0-record
    desc: Native DNS SIG(0) with zero signature
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/dns/auth::native-dns-sig0-record-construction
      - id: micro-behaviors/data/source/syntax/array::rust-zero-filled-vector

  - id: doh-sig0-early-disconnect
    desc: Invalid DoH SIG(0) early-disconnect request
    crit: hostile
    conf: 0.995
    all:
      - id: python-zero-filled-dns-sig0-record
      - id: micro-behaviors/communications/dns/doh::doh-wireformat-post-request
    any:
      - id: micro-behaviors/communications/socket/disconnect::send-followed-by-transport-close
      - id: micro-behaviors/communications/socket/disconnect::python-context-send-and-close

  - id: object-doh-sig0-early-disconnect
    desc: Object-built DoH SIG(0) early disconnect
    crit: hostile
    conf: 0.995
    all:
      - id: object-zero-filled-dns-sig0-record
      - id: micro-behaviors/communications/dns/doh::doh-wireformat-post-request
      - id: micro-behaviors/communications/socket/disconnect::send-followed-by-transport-close

  - id: native-doh-sig0-early-disconnect
    desc: Native-built DoH SIG(0) early disconnect
    crit: hostile
    conf: 0.995
    all:
      - id: native-zero-filled-dns-sig0-record
      - id: micro-behaviors/communications/dns/doh::doh-wireformat-post-request
      - id: micro-behaviors/communications/socket/disconnect::send-followed-by-transport-close

  - id: hyper-h2-doh-sig0-early-disconnect
    desc: Python HTTP/2 invalid DoH SIG(0) disconnect
    crit: hostile
    conf: 0.999
    all:
      - id: doh-sig0-early-disconnect
      - id: micro-behaviors/communications/http/client/library::hyper-h2-request-send
