# Repeating a crash-length nFactor RelayState restarts NetScaler's packet
# engine and can escalate through its supervisor into a full appliance reboot.
defaults:
  platforms: [unix, windows, appliance]
  for: [scripts, source, text, data]
  attack: T1190,T1499.004
  mbc: B0030

composite_rules:
  - id: netscaler-nfactor-packet-engine-dos
    desc: Repeated crash-length SAML contexts target NetScaler packet engine
    crit: hostile
    conf: 0.999
    all:
      - id: objectives/execution/exploit/deserialization::netscaler-nfactor-relaystate-branch-exploit
      - id: objectives/execution/exploit/deserialization::netscaler-nfactor-crash-branch-payload
      - id: micro-behaviors/communications/http/services/netscaler::repeated-netscaler-saml-auth-posts
    near_bytes: 4096
