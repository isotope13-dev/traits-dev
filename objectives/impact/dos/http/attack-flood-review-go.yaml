defaults:
  platforms: [linux]
  for: [elf]

traits:
- id: go-main-http-attack-handler
  desc: Go ELF exposes named HTTP flood handlers
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '(\bmain|[/.]attack)\.http(Flood|Send)\b'
composite_rules:
- id: go-l7-reset-flood-cache-bust-header-spoof
  desc: Go reset-flood worker cache-busts requests and spoofs headers
  crit: hostile
  conf: 0.99
  attack: T1498.001
  all:
  - id: metadata/binary/symbols/name/qualified/execution::go-attack-worker-name
  - id: metadata/binary/symbols/name/function::go-cache-bust-symbol
  - id: micro-behaviors/communications/http/header/custom::go-spoof-headers-symbol
  - id: micro-behaviors/communications/flood::go-reset-flood-rate-statistics

- id: go-http-request-flood-attack
  desc: Go HTTP flood with header spoofing
  crit: hostile
  conf: 0.99
  attack: T1498.001
  all:
  - id: objectives/impact/dos/attack/flood::go-main-attack-dispatch-symbol
  - id: micro-behaviors/communications/flood::go-flood-rate-statistics
  - id: micro-behaviors/communications/http/header/custom::go-spoof-headers-symbol
  - id: micro-behaviors/communications/http/client/library::go-http-client-do-string
  any:
  - id: micro-behaviors/communications/flood::go-connection-dropper-symbol
  - id: metadata/binary/symbols/name/function::go-cache-bust-symbol
