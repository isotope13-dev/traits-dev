# Layer-7 GET flood in VB.NET: each worker re-requests one URL with
# WebClient.DownloadString in a loop bounded only by an elapsed-time span,
# discarding every response. Matched as text because VB.NET source is not
# parsed into call sites.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1499.002

traits:
  - id: vb-deadline-download-loop
    desc: VB re-downloads URL until deadline
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)Do While\s*\(?\s*\w+\.Elapsed\s*<\s*\w+\)?[\s\S]{0,200}\.DownloadString\('

composite_rules:
  - id: vb-threaded-webclient-get-flood
    desc: Threaded VB WebClient GET flood
    crit: hostile
    conf: 0.96
    all:
      - id: vb-deadline-download-loop
      - id: micro-behaviors/process/thread/worker::vb-thread-array-worker-fanout
      - id: objectives/impact/dos/keywords/ddos::attack-target-duration-fields
