defaults:
  platforms: [unix, android]
  for: [elf]
  attack: T1498.001
  mbc: B0030

composite_rules:
  - id: native-oversized-http-post-flood
    desc: Native bot embeds an oversized HTTP POST flood
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/header/content-length::large-content-length-header
      - id: metadata/lang/natural/vocabulary/security::http-flood
    needs: 2
    any:
      - id: micro-behaviors/communications/http/header/forwarded::native-forwarded-for-header
      - id: micro-behaviors/communications/http/post::post-request-line
      - id: micro-behaviors/communications/http/request/reference::native-post-method-token
      - id: micro-behaviors/communications/http/request/body/construction::fixed-random-data-form-body
      - id: micro-behaviors/communications/http/form::rand-parameter-form-body
