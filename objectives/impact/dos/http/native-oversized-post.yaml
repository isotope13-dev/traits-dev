defaults:
  platforms: [unix, android]
  for: [elf]
  attack: T1498.001
  mbc: B0030

traits:
  - id: native-oversized-http-body
    desc: Native HTTP request has oversized body length
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)Content-Length:\s*[1-9][0-9]{8,}'

  - id: native-forwarded-header
    desc: Native HTTP request has forwarded header
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)X-Forwarded-For\s*:'

composite_rules:
  - id: native-oversized-http-post-flood
    desc: Native bot embeds an oversized HTTP POST flood
    crit: hostile
    conf: 0.99
    all:
      - id: native-oversized-http-body
      - id: native-forwarded-header
      - id: micro-behaviors/communications/http/post::post-request-line
