defaults:
  platforms: [unix, android]
  for: [elf]
  attack: T1498.001
  mbc: B0030

composite_rules:
  - id: native-oversized-http-post-flood
    desc: Native bot embeds an oversized HTTP POST flood
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/header/custom::native-large-content-length
      - id: micro-behaviors/communications/flood::http-flood
    needs: 2
    any:
      - id: micro-behaviors/communications/http/header/custom::native-forwarded-for-header
      - id: micro-behaviors/communications/http/post::post-request-line
      - id: micro-behaviors/communications/http/post::native-post-method-token
      - id: micro-behaviors/communications/http/request/body::fixed-random-data-form-body
      - id: micro-behaviors/communications/http/request/body::rand-parameter-form-body
