# A crafted HTTP request sent to a Cisco ASA/FTD remote-access VPN listener is
# an exploit-shaped availability attack.  The generic HTTP desynchronisation
# rule supplies the malformed wire-format evidence; this composite adds the
# product configuration named by Cisco without keying on a CVE or one payload.
defaults:
  platforms: [unix, windows, appliance]
  for: [scripts, binaries]
  attack: T1499,T1190
  mbc: B0030

composite_rules:
  - id: cisco-remote-access-vpn-http-dos
    desc: Cisco VPN crafted HTTP desync request
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/exploit/http-desync::duplicate-content-length-http-desync
      - id: micro-behaviors/communications/http/service::cisco-remote-access-vpn-listener-config
