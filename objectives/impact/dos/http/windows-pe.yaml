# Legacy Windows PE DDoS bots embed several browser User-Agent and GET
# request-line printf templates in .data, then fetch updates with urlmon.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1498.001
  mbc: B0042

composite_rules:
  - id: unsigned-pe-browser-template-http-flood
    desc: Unsigned PE embeds browser HTTP flood templates
    crit: hostile
    conf: 0.97
    size_min: 45000
    size_max: 120000
    all:
      - id: micro-behaviors/communications/http/get::printf-get-http11-request-line
      - id: micro-behaviors/communications/http/get::printf-msie4-user-agent-template
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
      - id: metadata/signature/absent::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/fs/path/application/executable::internet-explorer-executable-path
      - id: micro-behaviors/fs/path/config/autorun::autorun-inf-string
      - id: micro-behaviors/communications/socket/receive::x86-recv-buffer-task-dispatch
    needs: 2
    unless:
      - id: metadata/installer/product/

  - id: native-windows-browser-template-http-flood
    desc: Native Windows PE constructs browser HTTP floods
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/get::printf-get-http11-request-line
      - id: micro-behaviors/communications/http/get::printf-msie4-user-agent-template
      - id: metadata/signature/absent::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/communications/http/header/referer::referer-header
      - id: micro-behaviors/communications/http/header/value::browser-mozilla-5-0
      - id: micro-behaviors/communications/http/user-agent::ua-mozilla-old
      - id: micro-behaviors/communications/socket/connect/attempt::winsock-client-lifecycle
    unless:
      - id: metadata/installer/product/
