# Flood bots tune their request pattern to the mitigation in front of the
# target, so the binary carries the Server banners of anti-DDoS vendors next to
# a rotating pool of browser User-Agents. A plain HTTP client has no reason to
# hold two vendor banners as literals.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1498.001
  mbc: B0042

traits:
  - id: dosarrest-server-banner
    desc: DOSarrest Server header literal
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: "Server: DOSarrest"

  - id: cloudflare-nginx-server-banner
    desc: Cloudflare nginx Server header literal
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: "Server: cloudflare-nginx"

  # The same vendor banners XOR-encoded in the bot's string table, spelled the
  # way the template emits them (lowercase header name, vendor casing).
  - id: dosarrest-server-banner-xor
    desc: XOR-decoded DOSarrest Server banner
    crit: notable
    conf: 0.9
    if:
      type: encoded
      encoding: xor
      substr: "server: dosarrest"

  - id: cloudflare-nginx-server-banner-xor
    desc: XOR-decoded Cloudflare nginx banner
    crit: notable
    conf: 0.9
    if:
      type: encoded
      encoding: xor
      substr: "server: cloudflare-nginx"

composite_rules:
  # Encoded-table variant of the fingerprint above: the same "no plain HTTP
  # client carries two anti-DDoS vendor banners" reasoning, with the UA pool
  # and both banners hidden behind the bot's single-byte XOR string table.
  - id: xor-hidden-ua-pool-anti-ddos-banner-http-flood
    desc: XOR-hidden UA pool bot checks anti-DDoS vendor banners
    crit: hostile
    conf: 0.95
    all:
      - id: dosarrest-server-banner-xor
      - id: cloudflare-nginx-server-banner-xor
      - id: micro-behaviors/communications/http/fingerprint::xor-decoded-browser-user-agent-fragment-pool

  - id: native-ua-pool-anti-ddos-banner-http-flood
    desc: UA-rotating bot checks anti-DDoS vendor banners
    crit: hostile
    conf: 0.95
    all:
      - id: dosarrest-server-banner
      - id: cloudflare-nginx-server-banner
      - id: micro-behaviors/communications/http/user-agent::native-browser-user-agent-pool
