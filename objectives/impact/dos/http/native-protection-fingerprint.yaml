# These strings can also occur in scanners or HTTP clients. They do not
# establish a request flood without independent evidence of an attack loop.
defaults:
  platforms: [unix]
  for: [elf]

composite_rules:
  - id: xor-hidden-ua-pool-anti-ddos-banner-http-flood
    desc: XOR browser UA pool with anti-DDoS response banners
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/fingerprint::dosarrest-server-banner-xor
      - id: micro-behaviors/communications/http/fingerprint::cloudflare-nginx-server-banner-xor
      - id: micro-behaviors/communications/http/fingerprint::xor-decoded-browser-user-agent-fragment-pool

  - id: native-ua-pool-anti-ddos-banner-http-flood
    desc: Browser UA pool with anti-DDoS response banners
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/fingerprint::dosarrest-server-banner
      - id: micro-behaviors/communications/http/fingerprint::cloudflare-nginx-server-banner
      - id: micro-behaviors/communications/http/user-agent::native-browser-user-agent-pool
