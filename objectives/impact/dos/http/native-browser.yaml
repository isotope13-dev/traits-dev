defaults:
  platforms: [linux]
  for: [elf]
  attack: T1498.001
  mbc: B0042

traits:
  - id: parameterized-browser-get-template
    desc: Browser-style parameterized HTTP GET template
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '\bGET\s+%s\?[^ \r\n]{1,32}\s+HTTP/1\.1\b'

  - id: http2-flood-handler-name
    desc: Native HTTP/2 flood handler function name
    crit: suspicious
    conf: 0.96
    for: [c, cpp, go, elf, macho]
    if:
      type: symbol
      kind: function
      regex: '(?i)(attack|flood|ddos)[A-Za-z0-9_]{0,24}http2|http2[A-Za-z0-9_]{0,24}(attack|flood|ddos)'
    unless:
      # Protocol libraries name unit tests after the behavior they exercise;
      # a test_nghttp2_session_flooding function is not a flood implementation.
      - type: path
        regex: '(^|[\\/])(tests?|testing|testdata|fuzz|fuzzing)([\\/]|$)|(^|[\\/])test[_-][^\\/]+$'

  # Source reconstructions and stripped trees keep the Unit 42 / botnet case
  # label as a plain identifier.  This does not inherit the library-test path
  # gate above: the `attack_caseN_http2_flood` shape is not a normal unit-test
  # name for nghttp2 itself.
  - id: numbered-http2-flood-case-label
    desc: Numbered HTTP/2 flood attack-case label
    crit: suspicious
    conf: 0.95
    for: [c, cpp, go, rust, python]
    if:
      type: text
      regex: '\battack_case\d{1,2}_http2_flood\b'

  - id: http2-header-submit-sequence
    desc: Browser header followed by nghttp2 request
    crit: suspicious
    conf: 0.96
    for: [c, cpp, go, rust, python, javascript, typescript, java, kotlin]
    if:
      type: text
      regex: '(?is)(build_[A-Za-z0-9_]{1,32}header|set_header).{0,220}nghttp2_(submit|session)'

composite_rules:
  - id: native-browser-emulation-http-flood
    desc: Native IoT bot with browser-emulation HTTP flood tasking
    crit: hostile
    conf: 0.99
    all:
      - id: parameterized-browser-get-template
      - id: objectives/impact/dos/attack/botnet::native-attack-mode-label-cluster
      - id: micro-behaviors/communications/http/user-agent::browser-mozilla-5-0
      - id: micro-behaviors/communications/http/headers::sec-fetch-request-header
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: objectives/impact/dos/attack/botnet::attack-target-format

  - id: native-http2-browser-fingerprint-flood
    desc: Native HTTP/2 flood with browser-fingerprint headers
    crit: hostile
    conf: 0.99
    for: [c, cpp, go, elf, macho]
    all:
      - id: http2-flood-handler-name
      - id: micro-behaviors/communications/http/fingerprint::browser-fingerprint-header-set
      - id: micro-behaviors/communications/http/client/library::nghttp2-client-api

  - id: native-http2-numbered-case-fingerprint-flood
    desc: Numbered HTTP/2 attack case with browser-fingerprint flood
    crit: hostile
    conf: 0.98
    for: [c, cpp, go, rust, python]
    all:
      - id: numbered-http2-flood-case-label
      - id: micro-behaviors/communications/http/fingerprint::browser-fingerprint-header-set
      - id: micro-behaviors/communications/http/client/library::nghttp2-client-api

  - id: native-http2-browser-header-flood-loop
    desc: Native HTTP/2 browser-header flood loop
    crit: hostile
    conf: 0.99
    for: [c, cpp, go, rust, python, javascript, typescript, java, kotlin]
    all:
      - id: micro-behaviors/data/control-flow/analysis::while-loop-header
      - id: http2-header-submit-sequence
      - id: micro-behaviors/communications/http/fingerprint::browser-fingerprint-header-set
      - id: micro-behaviors/communications/http/client/library::nghttp2-client-api

  - id: vibenet-browser-profile-http-flood
    desc: IoT bot generates browser-profile HTTP floods
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/communications/http/fingerprint::native-browser-user-agent-pool
      - id: micro-behaviors/communications/http/fingerprint::native-browser-navigation-header-set
      - id: micro-behaviors/communications/http/fingerprint::synthetic-browser-tracking-cookie
      - id: micro-behaviors/communications/http/url/rpc::ethereum-binary-eth-call-request
