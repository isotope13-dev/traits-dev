defaults:
  platforms: [windows]
  for: [ne, pe, data]
  attack: T1498.001
  mbc: B0042

traits:
  - id: pounder-banner
    desc: Pounder HTTP DoS tool banner
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: "Pounder Alpha"
  - id: pounder-start-pounding
    desc: Pounder flood start button label
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: "Start Pounding!"
  - id: pounder-hits-completed
    desc: Pounder flood hit counter label
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: "Hits Completed"

composite_rules:
  - id: win16-pounder-http-flooder
    desc: Win16 Pounder HTTP DoS flooder
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/lib::win16-ipport-vbx
      - id: pounder-hits-completed
    any:
      - id: pounder-banner
      - id: pounder-start-pounding
