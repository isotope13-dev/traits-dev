defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1498.002
  mbc: B0009

traits:
  - id: repeated-header-entry-high-count
    desc: Repeats an HTTP header entry 32+ times
    crit: component
    conf: 0.94
    if:
      type: tree-sitter
      kind: binary_op
      regex: '(?i)\[\s*\w*(header|field|entry)\w*\s*\]\s*\*\s*(3[2-9]|[4-9]\d|\d{3,})\b'

composite_rules:
  - id: high-count-qpack-stream-encoding
    desc: Encodes QPACK headers on 32+ streams
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/client/library::quic-high-stream-loop
      - id: micro-behaviors/communications/http/client/library::quic-send-stream-data-call
      - id: micro-behaviors/communications/http/client/library::pylsqpack-import

  - id: high-count-incomplete-http3-streams
    desc: Opens 32+ incomplete HTTP/3 streams
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/client/library::quic-high-stream-loop
      - id: micro-behaviors/communications/http/client/library::http3-open-headers-call

  - id: slow-incomplete-http3-data-loop
    desc: Drips incomplete HTTP/3 DATA frames slowly
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/client/library::http3-open-data-call
      - id: micro-behaviors/data/control-flow/loop::python-range-loop-large-bound
      - id: micro-behaviors/time/sleep/interval::python-sleep-1s-plus

  - id: http3-qpack-header-amplification
    desc: Floods an origin through high-count QPACK header expansion across HTTP/3 streams
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/client/library::aioquic-http3-import
      - id: micro-behaviors/communications/http/client/library::pylsqpack-import
      - id: repeated-header-entry-high-count
      - id: high-count-qpack-stream-encoding

  - id: http3-connection-amplification
    desc: Exhausts origin connections with slow incomplete HTTP/3 streams
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/client/library::aioquic-http3-import
      - id: high-count-incomplete-http3-streams
      - id: slow-incomplete-http3-data-loop

  - id: http3-origin-amplification-suite
    desc: Implements both QPACK bandwidth amplification and HTTP/3 connection exhaustion
    crit: hostile
    conf: 0.995
    all:
      - id: http3-qpack-header-amplification
      - id: http3-connection-amplification
