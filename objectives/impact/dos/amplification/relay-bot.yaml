defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.9

composite_rules:
  - id: ssdp-upnp-status-relay-amplification
    desc: SSDP gateway relay bot with bandwidth status reporting
    crit: hostile
    conf: 0.99
    attack: T1498.002,T1071.001
    mbc: B0030
    all:
      - id: objectives/command-and-control/botnet/iot::relay-status-bandwidth-schema
      - id: objectives/command-and-control/botnet/iot::upnp-status-relay-bot
      - id: well-known/lib/uclibc::static-uclibc-string-tables
      - id: metadata/binary/linking/static::elf-needed-libs-zero
    any:
      - id: micro-behaviors/fs/proc/network::network-route
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
