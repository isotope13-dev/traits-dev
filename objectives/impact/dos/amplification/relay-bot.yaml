defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.9

composite_rules:
  - id: ssdp-upnp-status-relay-amplification
    desc: SSDP gateway relay bot with bandwidth status reporting
    crit: hostile
    conf: 0.99
    attack: T1498.002,T1071.001
    mbc: B0030
    # relay-status-bandwidth-schema and upnp-status-relay-bot (in
    # objectives/command-and-control/botnet/iot/relay-status.yaml) are both
    # pinned to `for: [python, javascript]`, so neither can fire on this
    # file's Elf scope. Their remaining legs -- the ONLINE/connections status
    # field, the SSDP discovery pair, and the UPnP gateway port-mapping
    # request -- are not language-restricted, so they are required directly
    # here instead of through those wrapper composites.
    all:
      - id: objectives/command-and-control/botnet/iot::relay-status-connections-field
      - id: micro-behaviors/communications/http/request/ssdp::m-search
      - id: micro-behaviors/communications/http/request/ssdp::discover-header
      - id: micro-behaviors/communications/http/request/upnp::internet-gateway-port-mapping
      - id: well-known/lib/native/uclibc::static-uclibc-string-tables
      - id: metadata/binary/linking/static::elf-needed-libs-zero
    any:
      - id: micro-behaviors/fs/proc/network::network-route
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
