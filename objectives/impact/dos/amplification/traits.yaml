defaults:
  platforms:
    - unix
    - windows
  for: [python, javascript, php, pe, elf]
traits:
  - id: amplification-payload-common
    desc: 'Common amplification attack payloads'
    crit: suspicious
    if:
      type: text
      regex: (?x)(\xFF){4}(getstatus|rules|TSource\sEngine\sQuery|\x55)
    unless:
      - id: metadata/library/structure::vscode-extension-generated-asset
      - id: metadata/library/structure::js-emscripten-generated-bundle
      - id: well-known/app/communication/thunderbird::firefox-source-tree-path
  - id: amplification-payload-common-chr
    desc: 'amplification payload common chr'
    crit: suspicious
    if:
      type: text
      regex: chr\(255\)(\s*\.\s*chr\(255\)){3}\s*\.\s*
  - id: amplification-payload-common-chr-suffix
    desc: "Amplification chr() payload suffix"
    crit: component
    if:
      type: text
      regex: ("getstatus"|"rules"|"TSource\sEngine\sQuery"|chr\(85\))
  - id: gamespy-payloads
    desc: GameSpy amplification payloads
    crit: suspicious
    if:
      type: text
      regex: (?x)\\\\status\\\\
  - id: gamespy-status-chr-payload
    desc: GameSpy status payload built via chr()
    crit: suspicious
    if:
      type: text
      regex: chr\(115\)\s*\.\s*chr\(116\)\s*\.\s*chr\(97\)\s*\.\s*chr\(116\)
  - id: gamespy-cory-hex-payload
    desc: GameSpy CORY magic payload in hex
    crit: suspicious
    if:
      type: text
      substr: \xFE\xFD\x00CORY
  - id: gamespy-cory-chr-payload
    desc: GameSpy CORY magic payload built via chr()
    crit: suspicious
    if:
      type: text
      regex: chr\(254\)\s*\.\s*chr\(253\)\s*\.\s*chr\(0\)\s*\.\s*chr\(67\)
composite_rules:
  - id: multiarch-ssdp-amplification-bot
    desc: Multiarch IoT bot uses spoofed SSDP probes
    crit: hostile
    conf: 0.99
    attack: T1498.002
    platforms: [linux]
    for: [elf]
    all:
      - id: ssdp-reflection-probe
      - id: micro-behaviors/communications/http/request/ssdp::spoofed-browser-ssdp
      - id: micro-behaviors/os/sysinfo/platform/string::repeated-architecture-suffixed-payload-names
      - id: well-known/lib/native/uclibc::static-uclibc-string-tables

  - id: ssdp-reflection-probe
    desc: Broadcast SSDP discovery probe used in reflection scanning
    crit: suspicious
    conf: 0.94
    attack: T1498
    all:
      - id: micro-behaviors/communications/http/request/ssdp::m-search
      - id: micro-behaviors/communications/http/request/ssdp::discover-header
      - id: micro-behaviors/communications/http/request/ssdp::broadcast-host
  - id: service-discovery-reflection
    desc: Service discovery probe for reflection
    crit: suspicious
    conf: 0.9
    attack: T1498
    all:
      - id: ssdp-reflection-probe
      - id: micro-behaviors/communications/dns/raw::dnssd-query
  - id: ssdp-amplification-bot
    desc: SSDP amplification bot behavior
    crit: hostile
    conf: 0.96
    attack: T1498.002
    for: [elf]
    all:
      - id: service-discovery-reflection
      - id: well-known/lib/native/uclibc::static-uclibc-string-tables
    any:
      - id: micro-behaviors/fs/path/binary::bin-busybox-path
      - id: micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist
      - type: trait
        id: objectives/lateral-movement/brute-force/ssh::native-ssh-client-banner
      # A browser-masqueraded SSDP probe is an independent botnet-compatible
      # reflection signal when the covert protocol channel is also present.
      - id: micro-behaviors/communications/http/request/ssdp::spoofed-browser-ssdp
  - id: ssdp-daemonized-browser-spoof-bot
    desc: Daemonized SSDP reflection bot with browser spoofing
    crit: hostile
    conf: 0.99
    attack: T1498.002
    for: [elf]
    all:
      - id: service-discovery-reflection
      - id: micro-behaviors/communications/http/request/ssdp::spoofed-browser-ssdp
      - id: micro-behaviors/communications/socket/send::sendto-symbol
      - id: micro-behaviors/process/daemonize/detach::fork-new-session
  - id: amplification-payload-chr-full
    desc: Amplification payload constructed with chr() prefix and command suffix
    crit: suspicious
    all:
      - id: amplification-payload-common-chr
      - id: amplification-payload-common-chr-suffix
  - id: amplification-payload-common-any
    desc: 'Common amplification attack payloads'
    crit: suspicious
    any:
      - id: amplification-payload-common
      - id: amplification-payload-chr-full
    unless:
      - id: metadata/library/structure::vscode-extension-generated-asset
      - id: metadata/library/structure::js-emscripten-generated-bundle
  - id: gamespy-payloads-any
    desc: GameSpy amplification payloads
    crit: suspicious
    any:
      - id: gamespy-payloads
      - id: gamespy-status-chr-payload
      - id: gamespy-cory-hex-payload
      - id: gamespy-cory-chr-payload
