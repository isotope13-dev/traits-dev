defaults:
  platforms: [unix, windows, macos]
composite_rules:
- id: mdns-amplification-attack
  desc: mDNS amplification DDoS attack tool
  crit: hostile
  conf: 0.95
  attack: T1498.002
  all:
  - id: micro-behaviors/communications/dns/raw::dnssd-query
  - id: micro-behaviors/communications/socket/raw::raw-socket-creation-regex
  any:
  - id: micro-behaviors/communications/socket/options::ip-hdrincl-option
  - id: micro-behaviors/communications/socket/options::ip-hdrincl-constant
  - id: micro-behaviors/communications/dns/raw::mdns-port-5353
  - id: micro-behaviors/communications/flood::network-flood-status-marker
# Port 5353 plus a DNS-SD service query over UDP sockets is what every
# mDNS discovery client does (Avahi tools, network monitors such as ntopng);
# it says nothing about reflection. The amplification verdict belongs to
# mdns-amplification-attack, which also needs raw-socket spoofing.
- id: mdns-dnssd-query-client
  desc: Sends DNS-SD service queries to the mDNS port
  crit: notable
  conf: 0.9
  attack: T1046
  all:
  - id: micro-behaviors/communications/dns/raw::mdns-port-5353
  - id: micro-behaviors/communications/dns/raw::dnssd-query
  any:
  - id: micro-behaviors/communications/socket/send::sendto-symbol
  - id: micro-behaviors/communications/socket/receive::recvfrom-symbol
