# Numbered bulk-directory creation can also be a filesystem stress test.
# Detect the full linked loop, but leave the purpose judgment to analysis.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1499
  size_max: 65536
traits:
  - id: dos-counted-digit-mkdir-flood
    desc: DOS bulk mkdir uses large saved count
    crit: suspicious
    conf: 0.98
    if:
      id: micro-behaviors/fs/directory/create::dos-counted-digit-mkdir-loop
