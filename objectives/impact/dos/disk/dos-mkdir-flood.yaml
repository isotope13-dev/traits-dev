# Numbered bulk-directory creation can also be a filesystem stress test.
# Detect the full linked loop, but leave the purpose judgment to analysis.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1499
  size_max: 65536
traits:
  - id: dos-counted-digit-mkdir-flood
    desc: DOS bulk mkdir uses large saved count
    crit: suspicious
    conf: 0.98
    if:
      id: micro-behaviors/fs/directory/create::dos-counted-digit-mkdir-loop

composite_rules:
  - id: dos-bulk-mkdir-file-drop-flood
    desc: DOS bulk directory flood combined with file drop/infection
    crit: hostile
    conf: 0.98
    attack: T1499,T1080
    all:
      - id: micro-behaviors/fs/directory/create::dos-counted-digit-mkdir-loop
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write
      - id: micro-behaviors/fs/search::dos-int21-find-first
