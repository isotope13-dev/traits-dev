# A COM disk filler calls DOS mkdir on one buffer, rolls that buffer's
# ASCII digits when a character passes '9', and repeats until a preloaded
# CX count hits zero.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1499
  size_max: 65536

composite_rules:
  - id: dos-digit-carry-mkdir-flood
    desc: DOS mkdir loop rolls directory digits
    crit: hostile
    conf: 0.97
    near_bytes: 80
    all:
      - id: micro-behaviors/fs/directory/create::dos-int21-mkdir-imm-dx
      - id: micro-behaviors/fs/directory/create::dos-ascii-digit-carry

  - id: dos-counted-digit-mkdir-flood
    desc: Counted DOS loop creates rolled directories
    crit: hostile
    conf: 0.98
    near_bytes: 80
    all:
      - id: micro-behaviors/fs/directory/create::dos-int21-mkdir-imm-dx
      - id: micro-behaviors/fs/directory/create::dos-ascii-digit-carry
      - id: micro-behaviors/fs/directory/create::dos-cx-countdown-restart
