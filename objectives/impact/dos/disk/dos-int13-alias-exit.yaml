# A COM program that aliases the disk BIOS vector (INT 13h) to some other
# interrupt's handler and then terminates without going resident has no hook
# to service: every later disk read or write lands in the wrong handler until
# reboot (Trojan.DOS.Mixint).
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  attack: T1499
traits:
- id: int13-aliased-then-terminate
  desc: Sets INT 13h vector then exits non-resident
  crit: suspicious
  conf: 0.9
  size_max: 4096
  if:
    type: hex
    pattern: (B4 25 B0 13|B0 13 B4 25|B8 13 25) CD 21 [0-2] (B8 00 00 CD 21|B8 00 4C CD 21|B4 4C CD 21|B4 00 CD 21|CD 20|C3)
composite_rules:
- id: dos-disk-vector-sabotage
  desc: Aliases INT 13h then exits, disabling disk I/O
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/os/msdos/interrupt::int13-set-to-other-vector-handler
  - id: int13-aliased-then-terminate
