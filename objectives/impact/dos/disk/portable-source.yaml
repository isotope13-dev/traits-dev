defaults:
  platforms: [linux, macos, windows]
  for: [zig]
  attack: T1499.001

composite_rules:
  - id: unbounded-hidden-cache-disk-fill
    desc: Unbounded writes fill hidden cache storage
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/location::source-hidden-user-cache-directory
      - id: micro-behaviors/mem/alloc/heap::megabyte-buffer-allocation
      - id: micro-behaviors/data/control-flow/loop::source-infinite-loop-metric
      - id: micro-behaviors/fs/file/open::zig-create-file
      - id: micro-behaviors/fs/write/file/full::repeated-buffer-write-token
