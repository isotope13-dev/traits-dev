# Every rule here is the same shape in a different language: a hidden cache
# path, a megabyte buffer, an unbounded loop, a zero-padded counter and a write
# call. Each carries `near_bytes` because those five facts are one routine in a
# real disk-filler, and because without a proximity bound the set is satisfied
# by any large program that does all five *somewhere*: pnpm -- a package manager
# whose whole job is writing a content-addressable store under ~/.pnpm-store --
# matched on its bundled dist across eight packaged versions and was reported
# hostile. None of these rules had a scope or proximity constraint.
defaults:
  platforms: [linux, macos, windows]
  for: [zig]
  attack: T1499.001

traits:
  # Elixir commonly expresses unbounded work as tail recursion rather than a
  # syntactic `while (true)`. This atom identifies an increasing recursive
  # producer step; the hostile composite still requires a hidden cache path,
  # a megabyte buffer, a thousand writes, indexed filenames, and file output.
  - id: elixir-increasing-recursive-producer
    desc: Elixir recursively advances an output index
    crit: notable
    conf: 0.9
    for: [elixir]
    if:
      type: text
      regex: '\bdo:\s*[a-z_][A-Za-z0-9_]*\s*\([^\n)]{0,100}\b[A-Za-z_]\w*\s*\+\s*[1-9]\d*'

  # Structural JVM bytecode evidence used below. Neither backward branches nor
  # a large byte-array allocation is suspicious alone; together with the
  # output-stream and hidden indexed cache path they describe a disk filler.
  - id: jvm-megabyte-byte-array-constant
    desc: JVM one-megabyte allocation constant
    crit: notable
    conf: 0.94
    for: [class, java_class]
    if:
      type: hex
      # CONSTANT_Integer tag followed by the big-endian value 1,048,576.
      pattern: '03 00 10 00 00'
    unless:
      - id: well-known/tool/development/build/gradle-wrapper::gradle-wrapper-package-class

  - id: jvm-thousand-iteration-constant
    desc: JVM bytecode loads a 1024 iteration bound
    crit: baseline
    conf: 0.94
    for: [class, java_class]
    if:
      type: hex
      # sipush 1024
      pattern: '11 04 00'

  - id: jvm-indexed-output-filename
    desc: JVM class formats an indexed output filename
    crit: notable
    conf: 0.92
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '^[A-Za-z_.-]{0,24}%0?[3-8]d(\.[A-Za-z0-9]{1,8})?$'

  - id: jvm-files-output-stream
    desc: JVM class creates a filesystem output stream
    crit: baseline
    conf: 0.96
    for: [class, java_class]
    if:
      type: symbol
      kind: import
      exact: java/nio/file/Files.newOutputStream

composite_rules:
  - id: unbounded-cache-disk-fill-elixir
    desc: Elixir recursively writes gigabyte chunks into hidden cache files
    crit: hostile
    conf: 0.99
    for: [elixir]
    near_lines: 45
    all:
      - id: micro-behaviors/fs/path/location::source-hidden-user-cache-directory
      - id: micro-behaviors/mem/alloc/heap::megabyte-size-constant
      - id: micro-behaviors/data/control-flow/loop::receiver-loop-bound-1024
      - id: micro-behaviors/data/string/assembly::zero-padded-integer-format
      - id: micro-behaviors/fs/write/file/full::source-buffer-write-call
      - id: elixir-increasing-recursive-producer

  # Bounds are intentionally file-wide for bytecode: constant-pool facts and
  # the method instructions that use them live in different regions. The six
  # independent requirements make the combination narrow despite that loose
  # spatial relationship.
  - id: unbounded-hidden-cache-disk-fill-jvm
    desc: JVM bytecode repeatedly fills hidden user cache files
    crit: hostile
    conf: 0.99
    for: [class, java_class]
    all:
      - id: micro-behaviors/fs/path/location::jvm-hidden-user-cache-directory
      - id: jvm-megabyte-byte-array-constant
      - id: jvm-thousand-iteration-constant
      - id: jvm-indexed-output-filename
      - id: jvm-files-output-stream
      - id: micro-behaviors/data/buffer/transfer::jvm-outputstream-write
      - id: metadata/binary/code/complexity::jvm-counter-loop-backedges

  - id: unbounded-hidden-cache-disk-fill
    desc: Unbounded writes fill hidden cache storage
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/location::source-hidden-user-cache-directory
      - id: micro-behaviors/mem/alloc/heap::megabyte-size-constant
      - id: micro-behaviors/data/control-flow/loop::source-infinite-loop-metric
      - id: micro-behaviors/fs/file/open::zig-create-file
      - id: micro-behaviors/fs/write/file/full::repeated-buffer-write-token

  - id: zig-hidden-cache-disk-fill
    desc: Zig loop fills hidden cache storage
    crit: hostile
    conf: 0.99
    # `scope: archive` was the only one in this file, and it let the four
    # generic legs -- a hidden cache path, a megabyte allocation, an infinite
    # loop and a zero-padded counter -- come from four unrelated members. Any
    # large source archive satisfies that: Fedora's trunk-0.21.7 source RPM and
    # Ubuntu's rustc 1.75 tarball both scored hostile. The sibling
    # `unbounded-hidden-cache-disk-fill` above carries the same legs at file
    # scope; one program fills the cache, not four files between them.
    all:
      - id: micro-behaviors/fs/path/location::source-hidden-user-cache-directory
      - id: micro-behaviors/mem/alloc/heap::megabyte-size-constant
      - id: micro-behaviors/data/control-flow/loop::source-infinite-loop-metric
      - id: micro-behaviors/data/string/assembly::zero-padded-integer-format
      - id: micro-behaviors/fs/write/file/full::repeated-buffer-write-token

  - id: unbounded-cache-disk-fill-native
    desc: Native loop writes megabyte cache files
    crit: hostile
    conf: 0.99
    near_bytes: 2048
    for: [c, cpp]
    all:
      - id: micro-behaviors/fs/path/location::source-hidden-user-cache-directory
      - id: micro-behaviors/mem/alloc/heap::megabyte-size-constant
      - id: micro-behaviors/data/control-flow/loop::infinite-loop-header
      - id: micro-behaviors/data/control-flow/loop::iteration-count-1024-literal
      - id: micro-behaviors/data/string/assembly::zero-padded-integer-format
      - id: micro-behaviors/fs/write/file/full::repeated-buffer-write-token

