# PIT-derived 8.3 name followed by create/close and a backward retry.
# DOS create truncates existing files as well as consuming directory entries.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536
  crit: notable
traits:
  - id: dos-pit-filename-loop
    desc: DOS builds filename from timer bytes
    if:
      type: hex
      pattern: 'B9 08 00 E4 40 24 0F 04 61 AA E2 F7 B0 2E AA E4 40 24 07 04 61 AA'
  - id: dos-create-close-retry
    desc: DOS creates and closes files repeatedly
    if:
      type: hex
      pattern: 'B4 3C E4 40 A8 01 74 03 B9 07 00 CD 21 72 07 93 B4 3E CD 21 EB C0'
composite_rules:
  - id: dos-random-file-flood
    desc: DOS repeatedly creates random files until an error
    crit: hostile
    attack: T1499
    all:
      - id: dos-pit-filename-loop
      - id: dos-create-close-retry
