defaults:
  platforms: [windows]
  for: [batch, text]
  attack: T1499

composite_rules:
  - id: batch-root-climb-mkdir-flood
    desc: Climbs to root and creates many directories
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/directory/chdir::batch-repeated-cd-parent
      - id: micro-behaviors/fs/directory/create::batch-repeated-md
