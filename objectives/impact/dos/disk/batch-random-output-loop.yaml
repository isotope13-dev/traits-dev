defaults:
  platforms: [windows]
  for: [batch]

traits:
  # Compare the entry label with the unconditional GOTO operand.
  - id: batch-unbounded-random-file-creation
    desc: GOTO loop creates randomly named files
    crit: hostile
    conf: 0.98
    attack: T1499.001
    if:
      type: yara
      source: |
        rule batch_unbounded_random_file_creation {
          strings:
            $label = /:[A-Za-z_][A-Za-z0-9_-]{0,31}/
            $write = /[ \t]*\r?\n[ \t]*@?echo[ \t]+[^><|&\r\n]{1,88}>>?[ \t]*"?[A-Za-z0-9_-]{0,16}%random%(\.[A-Za-z0-9]{1,8})?"?[ \t]*\r?\n[ \t]*@?goto[ \t]+:?/ nocase
            $head = /^[ \t\r\n]{0,64}(@?echo[ \t]+off[ \t]*\r?\n)?[ \t]{0,16}:/ nocase
          condition:
            filesize <= 640 and $head at 0 and $label and $write and
            @label == !head - 1 and @write == @label + !label and
            filesize >= @write + !write + !label - 1 and
            for all b in (1..!label - 1) : (
              (uint8(@label + b) | 32) == (uint8(@write + !write + b - 1) | 32)
            ) and
            (filesize == @write + !write + !label - 1 or
              for all t in (@write + !write + !label - 1..filesize - 1) : (
                uint8(t) == 32 or uint8(t) == 9 or uint8(t) == 13 or uint8(t) == 10
              )
            )
        }
