defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, zig, python]
  attack: T1499.001

composite_rules:
  - id: transient-free-capacity-allocation
    desc: Free-capacity query with hidden allocation
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/sysinfo/disk::native-free-volume-capacity-query
      - id: micro-behaviors/os/sysinfo/disk::available-volume-byte-calculation
      - id: micro-behaviors/fs/file/open/unspecified::ntcreatefile-explicit-allocation
      - id: micro-behaviors/fs/temp/file::ntcreatefile-hidden-delete-on-close
