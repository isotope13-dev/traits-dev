defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1498.001
  mbc: B0042

traits:
  - id: python-spam-control-route
    desc: HTTP route starts spam operation
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)@app\.route\s*\(\s*["'']/(spam|flood)'

  - id: python-stateful-spam-loop
    desc: Loop gates on spam state
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)while\s+self\.running\s*:.{0,220}\b(spam|flood)_running\b'

  - id: python-invite-packet-burst
    desc: Sends room spam and invite packets
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?is)\.send\s*\(\s*spmroom\s*\(.{0,180}\.send\s*\(\s*SEnd_InV\s*\('

composite_rules:
  - id: python-remote-multiaccount-spam
    desc: Python HTTP-controlled multi-account spam flood
    crit: hostile
    conf: 0.99
    all:
      - id: python-spam-control-route
      - id: python-stateful-spam-loop
      - id: micro-behaviors/data/control-flow/loop::python-clients-dict-iteration
      - id: micro-behaviors/data/property/assign::python-set-target-call
    near_lines: 400
  - id: python-multiaccount-invite-flood
    desc: Multi-account room invitation flood
    crit: hostile
    conf: 0.99
    all:
      - id: python-stateful-spam-loop
      - id: micro-behaviors/data/control-flow/loop::python-clients-dict-iteration
      - id: micro-behaviors/data/property/assign::python-set-target-call
      - id: python-invite-packet-burst
    near_lines: 400
