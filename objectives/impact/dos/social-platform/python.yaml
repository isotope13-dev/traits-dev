defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1498.001
  mbc: B0042

traits:
  - id: python-spam-control-route
    desc: HTTP route starts spam operation
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)@app\.route\s*\(\s*["'']/(spam|flood)'

  - id: python-stateful-spam-loop
    desc: Loop gates on spam state
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)while\s+self\.running\s*:.{0,220}\b(spam|flood)_running\b'

  - id: python-bulk-target-assignment
    desc: Iterates connected client map
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)for\s+\w+,\s*\w+\s+in\s+\w*clients\.items\(\)'

  - id: python-client-target-set
    desc: Assigns target to connected client
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.set_target\s*\('

composite_rules:
  - id: python-remote-multiaccount-spam
    desc: Python HTTP-controlled multi-account spam flood
    crit: suspicious
    conf: 0.96
    all:
      - id: python-spam-control-route
      - id: python-stateful-spam-loop
      - id: python-bulk-target-assignment
      - id: python-client-target-set
    near_lines: 400
