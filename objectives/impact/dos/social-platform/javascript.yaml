defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1499.003

traits:
  # Deliberately preserve the misspelling used by the exported payload. It is
  # much narrower than a generic sendMessage helper in messaging SDKs.
  - id: javascript-sendmesage-target-relay-function
    desc: Targeted sendMesage relay function
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'async\s+function\s+sendMesage\s*\(\s*sock\s*,\s*target\s*,\s*ptcp\s*\)'

  # 0x7a120 is 500,000. In this shape it is an array/object population count,
  # not a timeout or byte-size constant.
  - id: javascript-half-million-array-size
    desc: Array size is 500,000 objects
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'Array\[[^\]\r\n]{1,64}\]\s*\(\s*\{[^}\r\n]{1,96}:\s*0x7a120'
  - id: javascript-empty-object-array-factory
    desc: Array factory callback returns empty object
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'Array(\[[^\]]{1,64}\])?\s*\([^)]{0,128}=>\s*(\(\s*)?\{\s*\}(\s*\))?\s*\)'

composite_rules:
  - id: javascript-obfuscated-message-object-bomb
    desc: Messaging relay builds a 500,000-object interactive payload
    crit: hostile
    conf: 0.995
    all:
      - id: javascript-sendmesage-target-relay-function
      - id: javascript-half-million-array-size
      - id: javascript-empty-object-array-factory
    near_bytes: 2048
