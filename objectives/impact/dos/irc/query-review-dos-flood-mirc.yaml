# IRC client trigger directs clone connections to flood a channel.
defaults:
  platforms:
  - unix
  - windows
  for:
  - mirc
  - ircii
  - scripts
  - data
  attack: T1498
  mbc: B0002

composite_rules:
  - id: mirc-commanded-clone-flood
    desc: Flood trigger drives all-clone PRIVMSG
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/command-and-control/channel/irc/client::mirc-sockwrite-all-privmsg
      - id: objectives/command-and-control/channel/irc/client::mirc-text-flood-command
  # Opening a socket, writing a long run of random characters, and closing
  # it is a junk-packet flood. Nick generators use a few $chr($r()) calls;
  # the count floor on the character builder keeps those out.
