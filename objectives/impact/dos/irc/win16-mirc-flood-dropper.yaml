# Win16 NE Visual Basic builders and droppers that embed mIRC INI
# configurations with chained CTCP/DCC/nick floods and channel-takeover
# commands.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1498

traits:
  - id: ne-mirc-ini-sections
    desc: NE embeds mIRC popup and alias sections
    crit: notable
    conf: 0.90
    if:
      type: text
      regex: '\[(Aliases|mPopup|lPopup)\]'

  - id: ne-mirc-ctcp-dcc-flood-chain
    desc: NE embeds chained mIRC CTCP/DCC flood
    crit: notable
    conf: 0.93
    if:
      type: text
      case_insensitive: true
      regex: '(/ctcp [#$][^|]{1,30}\s*\|\s*|/dcc (send|chat) [#$][^|]{1,40}\s*\|\s*){2}'

  - id: ne-mirc-nick-flood-chain
    desc: NE embeds repeated mIRC nick flood
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: '(/nick \$read [^|]{1,30}\s*\|\s*){2}'

  - id: ne-mirc-channel-takeover
    desc: NE embeds mIRC channel takeover commands
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: '/mode # [-+]o{3,4} \$|/topic # .{0,200}Take-Over'

composite_rules:
  - id: win16-ne-mirc-attack-script-builder
    desc: Win16 NE binary embeds mIRC flood and takeover script
    crit: hostile
    conf: 0.96
    all:
      - id: ne-mirc-ini-sections
      - id: micro-behaviors/fs/file/open/call::win16-ne-int21-open
    any:
      - id: ne-mirc-ctcp-dcc-flood-chain
      - id: ne-mirc-nick-flood-chain
      - id: ne-mirc-channel-takeover
    needs: 2
