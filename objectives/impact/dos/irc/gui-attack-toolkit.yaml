# A GUI front-end that names several IRC attack bots (collide, SuMO takeover,
# flood) is a channel-takeover and flood toolkit, not a client or a protection
# script. Two distinct bot roles are required; a takeover how-to text counts
# as corroboration but cannot convict by itself.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1498
composite_rules:
  - id: irc-attack-bot-toolkit-gui
    desc: GUI front-end launching IRC collide, SuMO and flood bots
    crit: hostile
    conf: 0.92
    needs: 2
    any:
      - id: micro-behaviors/communications/irc/client::irc-collide-bot-label
      - id: micro-behaviors/communications/irc/client::irc-sumo-bot-label
      - id: micro-behaviors/communications/irc/client::irc-flood-bot-label
  - id: irc-takeover-toolkit-with-guide
    desc: IRC attack bot labels with embedded takeover guide
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/irc/client::irc-takeover-guide-text
    any:
      - id: micro-behaviors/communications/irc/client::irc-collide-bot-label
      - id: micro-behaviors/communications/irc/client::irc-sumo-bot-label
      - id: micro-behaviors/communications/irc/client::irc-flood-bot-label
