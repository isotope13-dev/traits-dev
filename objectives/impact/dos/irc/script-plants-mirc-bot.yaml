# A WSH/VBScript dropper that writes mIRC remote-script lines with raw IRC
# socket commands and registers them through mirc.ini [rfiles] turns the
# victim's chat client into a flood/clone bot (KarmaHotel-style IRC trojans).
defaults:
  platforms: [windows]
  for: [html, javascript, vbs]
  attack: T1498
composite_rules:
  - id: script-plants-mirc-bot
    desc: Script plants an IRC bot script into mIRC
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/irc/configure::script-writes-mirc-script-line
      - id: micro-behaviors/communications/irc/configure::script-writes-irc-sockwrite-bot
      - id: micro-behaviors/communications/irc/configure::script-references-mirc-rfiles
