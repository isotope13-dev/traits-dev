# Saved state of an IRC worm/flood bot: clone and flood settings next to
# the address ranges its scanners work through. A protection script may
# keep flood thresholds, but not clone armies and scan ranges.
defaults:
  platforms: [windows]
  for: [mirc, text]
  attack: T1498
composite_rules:
  - id: saved-irc-clone-flood-scanner-state
    desc: Saved IRC bot state for clone floods and scans
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/communications/irc/configure::mirc-saved-flood-tuning-variables
      - id: micro-behaviors/communications/irc/configure::mirc-saved-clone-count
      - id: micro-behaviors/communications/irc/configure::mirc-saved-scan-address-range
