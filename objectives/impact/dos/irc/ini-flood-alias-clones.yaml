# Old mIRC configuration files embed their aliases in the INI. A repeated-CTCP
# alias (the same request chained a dozen times at one target) is a flood
# command, and a client that also exposes its DDE server or launches numbered
# extra client instances is the controlled clone of a flood bot. The chained
# request alone is a flood alias in any script, so the config section and a
# control leg are both required.
defaults:
  platforms: [windows]
  for: [mirc, text]
  attack: T1498
traits:
  - id: mirc-ini-ctcp-repeat-flood-alias
    desc: mIRC alias chains one CTCP request repeatedly
    crit: notable
    conf: 0.93
    if:
      type: text
      case_insensitive: true
      regex: '(/ctcp \$[1-9] [A-Za-z]{4,8} \| ?){4}'

  - id: mirc-ini-numbered-client-launch
    desc: mIRC alias launches numbered client copies
    crit: notable
    conf: 0.93
    if:
      type: text
      case_insensitive: true
      regex: '/run [^|]{1,40}mirc[2-9]\.exe [^|]{1,30}\.ini'

composite_rules:
  - id: mirc-ini-controlled-ctcp-flood-clone
    desc: mIRC config carries a CTCP flood alias for a controlled clone
    crit: hostile
    conf: 0.94
    for: [text]
    all:
      - id: metadata/file/format/structured::mirc-client-config-section
      - id: mirc-ini-ctcp-repeat-flood-alias
    any:
      - id: micro-behaviors/os/message/dde::mirc-dde-server-enabled
      - id: mirc-ini-numbered-client-launch
    needs: 1
