# Win16 Visual Basic IRC flood clients expose their attack modes as form
# captions: CTCP and DCC flood buttons and a stop-flooding control. The
# captions are UI text, not compiled code, so they survive in the NE
# resource table even when the flood routines are in VB p-code. Two
# distinct modes are required so a single caption does not convict.
defaults:
  platforms: [windows]
  for: [ne]
  attack: T1498

traits:
  - id: vb-irc-ctcp-kill-caption
    desc: VB IRC flood form CTCP kill caption
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: CTCP &Kill

  - id: vb-irc-dcc-garbage-caption
    desc: VB IRC flood form DCC garbage caption
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: DCC Send &Garbage

  - id: vb-irc-stop-flood-caption
    desc: VB IRC flood form stop-flooding caption
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: St&op Flooding

composite_rules:
  - id: vb-irc-flood-form-modes
    desc: VB IRC client exposes two or more flood attack modes
    crit: hostile
    conf: 0.95
    needs: 2
    any:
      - id: vb-irc-ctcp-kill-caption
      - id: vb-irc-dcc-garbage-caption
      - id: vb-irc-stop-flood-caption
