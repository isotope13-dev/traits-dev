defaults:
  platforms: [windows, unix]
  for: [batch]
  attack: T1499

composite_rules:
  - id: batch-echoes-emergency-dial-to-modem
    desc: Batch echoes emergency dial string to modem
    crit: hostile
    conf: 0.9
    size_max: 1024
    all:
      - id: micro-behaviors/hardware/serial::hayes-modem-dial-emergency-number
      - id: micro-behaviors/fs/write/file/redirect::batch-echo-redirect
