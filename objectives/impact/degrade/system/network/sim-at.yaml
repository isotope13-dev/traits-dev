# SIM-originating modem control can make a phone or cellular device
# unavailable, or force it onto an unauthenticated legacy network.
defaults:
  platforms: [linux, android, appliance]

composite_rules:
  - id: sim-at-2g-downgrade
    desc: SIM-originating AT command forces a 2G-only network selection
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/hardware/smartcard/access::sim-at-command-channel
      - id: micro-behaviors/hardware/smartcard/access::modem-network-generation-restriction
    near_bytes: 2048

  - id: sim-at-modem-disruption
    desc: SIM-originating AT command disables the modem or phone radio
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/hardware/smartcard/access::sim-at-command-channel
      - id: micro-behaviors/hardware/smartcard/access::modem-radio-disable-command
    near_bytes: 2048
