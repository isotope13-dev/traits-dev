# Worms WinExec `net share <letter>$ /del` and the admin$ share so later
# remediation and remote administration lose those shares.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1562
  crit: notable
  conf: 0.96

traits:
  - id: cmd-delete-admin-share
    desc: Command deletes the Windows admin$ share
    if:
      type: text
      substr: 'cmd.exe /c net share admin$ /del'

composite_rules:
  - id: winexec-deletes-admin-share
    desc: WinExec deletes the Windows admin$ share
    crit: hostile
    conf: 0.97
    all:
      - id: cmd-delete-admin-share
      - id: micro-behaviors/process/create/exec::winexec
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/
