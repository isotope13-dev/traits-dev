defaults:
  platforms: [junos, appliance, unix]
  for: [shell]
  attack: T1562.004

traits:
  - id: shell-route-interface-down
    desc: Shell removes route and downs ifaces
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'route delete default[\s\S]{0,240}ifconfig "\$iface" down'

composite_rules:
  - id: shell-junos-network-disruption
    desc: Shell Junos network disruption
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/degrade/firewall/rules::shell-pfctl-ipfw-flush
      - id: objectives/impact/degrade/system/network::shell-route-interface-down
