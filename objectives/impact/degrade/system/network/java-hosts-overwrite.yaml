defaults:
  platforms: [windows]
  for: [class]
traits:
  - id: jvm-remote-hosts-write-indicators
    desc: JVM remote hosts-write configuration
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule jvm_remote_hosts_overwrite {
          strings:
            $hosts = "\\system32\\drivers\\etc\\hosts" ascii
            $cfg = "HOSTSURL" ascii
            $stream = "java/io/FileOutputStream" ascii
            $write = "write" ascii
            $policy = "com/ms/security/PolicyEngine" ascii
            $assert = "assertPermission" ascii
            $registry = "com/ms/lang/RegKey" ascii
            $set = "setValue" ascii
          condition:
            uint32be(0) == 0xcafebabe and all of them
        }
composite_rules:
  - id: jvm-remote-hosts-overwrite
    desc: Browser hijacker also rewrites Windows hosts
    crit: hostile
    conf: 0.98
    all:
      - id: jvm-remote-hosts-write-indicators
      - id: objectives/impact/ui/manipulation/traffic::jvm-remote-ie-settings-hijacker
