defaults:
  platforms: [windows]
  for: [class]
traits:
  - id: jvm-remote-hosts-overwrite
    desc: Remote-configured browser hijacker also writes Windows hosts
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule jvm_remote_hosts_overwrite {
          strings:
            $hosts = "\\system32\\drivers\\etc\\hosts" ascii
            $cfg = "HOSTSURL" ascii
            $start = "STARTURL" ascii
            $css = "CSSURL" ascii
            $stream = "java/io/FileOutputStream" ascii
            $write = "write" ascii
            $policy = "com/ms/security/PolicyEngine" ascii
            $assert = "assertPermission" ascii
            $registry = "com/ms/lang/RegKey" ascii
            $set = "setValue" ascii
          condition:
            uint32be(0) == 0xcafebabe and all of them
        }
