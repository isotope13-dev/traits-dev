defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Boot-variable mutation remains relevant when the deletion branch is absent
  # or broken. Require an actual setter call, but do not claim that the call's
  # arguments are bound to BootOrder: CLR facts do not yet expose IL values.
  - id: managed-ransomware-boot-variable-tampering
    desc: Ransom encryptor calls UEFI setter beside boot-variable references
    crit: hostile
    conf: 0.97
    attack: T1495
    all:
      - id: objectives/impact/ransom/encrypt/bulk-encryption::managed-ransom-stream-replacement
      - id: micro-behaviors/os/kernel/routines::uefi-global-variable-namespace-guid
      - id: micro-behaviors/os/kernel/routines::uefi-boot-order-variable-name
      - id: micro-behaviors/os/kernel/routines::firmware-variable-set-call
