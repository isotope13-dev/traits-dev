defaults:
  platforms: [windows]
  for: [batch]
  attack: T1485

composite_rules:
  - id: batch-deletes-boot-loader-file
    desc: Batch deletes boot loader file
    crit: hostile
    conf: 0.93
    size_max: 4096
    near_lines: 2
    all:
      - id: micro-behaviors/fs/path/config/boot::boot-loader-drive-path
      - id: micro-behaviors/fs/delete/file/command::batch-del-call
