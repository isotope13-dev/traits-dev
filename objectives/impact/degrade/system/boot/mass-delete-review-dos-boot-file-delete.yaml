# DOS COM trojan deletes a named system file from the boot drive (IO.SYS,
# MSDOS.SYS or COMMAND.COM) through INT 21h AH=41h; the machine cannot boot
# afterwards.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1485
  size_max: 4096

composite_rules:
  - id: dos-delete-boot-system-file
    desc: DOS program deletes boot drive system file
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/config/boot::dos-boot-file-drive-path
      - id: micro-behaviors/fs/delete/file/syscall::dos-int21-delete-file
