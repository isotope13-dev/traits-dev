# Windows File Protection / System File Checker tampering.
#
# WFP is what puts a replaced system binary back. Code that wants a patched
# service DLL or a trojanized `winlogon.exe` to survive has to switch the
# checker off and empty the cache it restores from — two separate, deliberate
# steps that no application performs as part of its own job.
defaults:
  crit: suspicious
  conf: 0.95
  platforms:
    - windows
  for:
    - pe
    - dll
    - vbs
    - scripts
    - source
  attack: T1562.001
traits:
  - id: sfc-avoidance-comment
    desc: Skips files protected by SFC
    for:
      - c
    if:
      type: string_literal
      substr: no infect files protected by SFC

  # HKLM\...\Winlogon!SFCDisable (and its SFCSetting twin) turn Windows File
  # Protection off. The documented values are 0/1/2/4; implants write 0xFFFFFF9D
  # (-99), the undocumented "disabled, no prompt" setting.
  - id: sfc-disable-winlogon-value
    desc: C# writes an SFCDisable Winlogon value
    if:
      type: text
      regex: '(?i)SetValue\s*\(\s*["'']SFC(Disable|Setting)["'']'
    for:
      - csharp
