# A .reg script that deletes several whole autostart keys (every program's
# Run / RunOnce / RunServices entries, security software included) and then
# registers its own launcher under Run. Removing one stale value is routine;
# wiping entire autostart keys while installing a replacement is sabotage of
# the host's existing startup programs.
defaults:
  platforms: [windows]
  for: [reg]
  attack: T1112,T1547.001,T1562.001

traits:
  - id: delete-several-autostart-keys
    desc: Registry deletes several whole autostart keys
    crit: notable
    conf: 0.92
    count_min: 2
    if:
      type: text
      regex: '(?im)^\[-HKEY_\w{4,14}\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run\w{0,12}\]'
  - id: run-key-script-launcher-value
    desc: Run value launches script or binary
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\\CurrentVersion\\Run\]\r?\n"[^"\r\n]{1,64}"="[^"\r\n]{1,200}\.(bat|cmd|exe|vbs|js)"'

composite_rules:
  - id: reg-wipes-autostarts-installs-launcher
    desc: Registry wipes autostart keys and adds launcher
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/file/format/structured::reg-script-header-and-key-section
      - id: delete-several-autostart-keys
      - id: run-key-script-launcher-value
