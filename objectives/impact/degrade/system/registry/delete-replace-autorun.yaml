defaults:
  platforms: [windows]
  for: [reg]
  attack: T1112,T1547.001

traits:
  - id: delete-whole-machine-run-key
    desc: Registry deletes the machine Run key
    crit: notable
    if:
      type: text
      regex: '(?im)^\[-HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run\]'
  - id: recreate-machine-run-key
    desc: Registry recreates the machine Run key
    crit: notable
    if:
      type: text
      regex: '(?im)^\[HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run\]'

composite_rules:
  - id: reg-replaces-machine-run-key
    desc: Registry deletes and replaces all machine autostarts
    crit: hostile
    conf: 0.96
    all:
      - id: delete-whole-machine-run-key
      - id: recreate-machine-run-key
