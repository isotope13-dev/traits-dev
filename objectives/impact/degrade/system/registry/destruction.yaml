defaults:
  platforms: [windows]
  for: [pe, batch, powershell]
  attack: T1112
traits:
  - id: reg-delete-hkcr-force
    desc: Forced HKCR registry deletion
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+delete\s+HKCR\s+/f\b'
composite_rules:
  - id: dotnet-multi-hive-random-registry-flood
    for: [pe]
    desc: Performs randomized writes across multiple Windows registry hives
    crit: hostile
    conf: 0.98
    attack: T1112,T1499
    all:
      - id: micro-behaviors/os/registry/access::dotnet-multiple-registry-hives
      - id: micro-behaviors/os/registry/manipulate::dotnet-registry-key-write
      - id: micro-behaviors/os/registry/manipulate::dotnet-registry-create-subkey-member
      - id: micro-behaviors/os/random/crypto::dotnet-random-number-generator
    unless:
      # mscorlib implements registry access across every hive and the crypto
      # RNG; it is the library these four legs come from, not a program using
      # them together. Windows 11's netfx3 CAB scored hostile on it.
      - id: well-known/lib/runtime/managed/dotnet-runtime::microsoft-dotnet-system-assembly-original
      - id: metadata/signed/platform/

  - id: elevated-hkcr-registry-destruction
    desc: Elevated HKCR registry destruction
    crit: hostile
    conf: 0.98
    all:
      - id: reg-delete-hkcr-force
      - id: micro-behaviors/os/privilege/elevation::runas-string
