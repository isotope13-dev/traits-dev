defaults:
  platforms: [windows]
  for: [pe, batch, powershell]
  attack: T1112
traits:
  - id: reg-delete-hkcr-force
    desc: Forced HKCR registry deletion
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+delete\s+HKCR\s+/f\b'
  - id: reg-delete-hkcr-file-association
    desc: reg deletes HKCR executable association
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+delete\s+HKCR[\\/]+\.?(exe|dll|\*)'
composite_rules:
  - id: elevated-hkcr-registry-destruction
    desc: Elevated HKCR registry destruction
    crit: hostile
    conf: 0.98
    all:
      - id: reg-delete-hkcr-force
      - id: micro-behaviors/os/privilege/elevation::runas-string
  - id: system32-delete-hkcr-delete-forced-restart
    desc: System32 delete, HKCR association delete and forced restart commands
    crit: hostile
    conf: 0.98
    attack: T1485,T1112
    near_bytes: 1024
    all:
      - id: micro-behaviors/fs/delete/target::windows-system32-delete
      - id: reg-delete-hkcr-file-association
      - id: micro-behaviors/os/event/shutdown::shutdown-forced-restart-command
