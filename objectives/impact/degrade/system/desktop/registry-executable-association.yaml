defaults:
  platforms: [windows]
  for: [reg]
  attack: T1112,T1547.001

traits:
  - id: registry-exe-association-textfile
    desc: Registry assigns EXE extension to text files
    crit: notable
    if:
      type: text
      regex: '(?im)^\[HKEY_LOCAL_MACHINE\\SOFTWARE\\Classes\\\.exe\]\s*\r?\n\s*@\s*=\s*"txtfile"'
  - id: registry-batch-command-value
    desc: Registry value names a batch file
    crit: notable
    if:
      type: text
      regex: '(?im)^"[^"\r\n]{1,100}"\s*=\s*"[^"\r\n]{1,200}\.bat"'

composite_rules:
  - id: reg-exe-association-recovery-lock-autostart
    desc: Registry breaks EXE association and blocks recovery
    crit: hostile
    conf: 0.97
    all:
      - id: registry-exe-association-textfile
      - id: registry-batch-command-value
      - id: micro-behaviors/os/registry/autostart/reference::windows-run-key-path
      - id: objectives/impact/degrade/system/desktop::registry-disables-regedit
