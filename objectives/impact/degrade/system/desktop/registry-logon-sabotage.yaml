defaults:
  platforms: [windows]
  for: [reg]
  attack: T1112,T1529

traits:
  - id: registry-winlogon-section
    desc: Registry names the Winlogon section
    crit: component
    if:
      type: text
      regex: '(?i)\[HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\]'
  - id: registry-blank-winlogon-shell
    desc: Registry assigns an empty shell value
    crit: notable
    if:
      type: text
      regex: '(?im)^"shell"\s*=\s*""\s*$'
  - id: registry-userinit-logoff
    desc: Registry Userinit runs forced logoff
    crit: notable
    if:
      type: text
      regex: '(?im)^"userinit"\s*=\s*"[^"\r\n]{0,160}shutdown\s+-l\s+-f'
  - id: registry-hacked-logon-notice
    desc: Registry logon notice claims system compromise
    crit: notable
    if:
      type: text
      regex: '(?i)"legalnoticetext"\s*=\s*"your system has been hacked"'
  - id: registry-disables-taskmgr
    desc: Registry disables Task Manager
    crit: notable
    if:
      type: text
      regex: '(?i)"DisableTaskMgr"\s*=\s*dword:0{7}1\b'
  - id: registry-disables-regedit
    desc: Registry disables registry editing
    crit: notable
    if:
      type: text
      regex: '(?i)"DisableRegistryTools"\s*=\s*dword:0{7}1\b'

composite_rules:
  - id: reg-winlogon-blank-shell-forced-logoff
    desc: Registry combines blank shell and forced logoff
    crit: hostile
    conf: 0.98
    all:
      - id: registry-winlogon-section
      - id: registry-blank-winlogon-shell
      - id: registry-userinit-logoff
  - id: reg-hacked-notice-shell-and-recovery-lock
    desc: Registry combines defacement and recovery lockout
    crit: hostile
    conf: 0.98
    all:
      - id: registry-winlogon-section
      - id: registry-blank-winlogon-shell
      - id: registry-hacked-logon-notice
      - id: registry-disables-taskmgr
      - id: registry-disables-regedit
