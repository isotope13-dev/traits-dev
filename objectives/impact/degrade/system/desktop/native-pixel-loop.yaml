defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: foreground-single-pixel-xor-stretch-loop
    desc: Foreground pixel XOR stretching in a loop
    crit: hostile
    conf: 0.98
    attack: T1491.001
    all:
      - id: micro-behaviors/hardware/display/screen::single-pixel-xor-stretch-loop-shape
      - id: micro-behaviors/hardware/display/screen::gdi-stretchblt
      - id: micro-behaviors/ui/window/enumerate::get-foreground-window
