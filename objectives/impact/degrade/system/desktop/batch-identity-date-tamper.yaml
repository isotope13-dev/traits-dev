defaults:
  platforms:
    - "windows"
  for:
    - "batch"
composite_rules:
  - 
    id: "batch-hidden-identity-date-tampering"
    desc: "Hidden registry identity tampering requests invalid date"
    crit: "hostile"
    conf: 0.96
    all:
      - 
        id: "micro-behaviors/os/sysinfo/command::batch-date-before-1600"
      - 
        id: "micro-behaviors/fs/volume/label::batch-volume-label-command"
      - 
        id: "micro-behaviors/fs/write/file/redirect::regfile-registered-owner-echo"
      - 
        id: "micro-behaviors/fs/file/attributes::attrib-hidden"
