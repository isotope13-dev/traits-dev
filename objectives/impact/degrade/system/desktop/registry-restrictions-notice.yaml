defaults:
  platforms: [windows]
  for: [reg]
  attack: T1112,T1562.001

traits:
  - id: registry-logon-notice-win-com
    desc: Logon notice references Win.com
    crit: notable
    if:
      type: text
      regex: '(?im)^"LegalNoticeText"\s*=\s*[^\r\n]{0,400}Win\.com'
  - id: registry-no-desktop
    desc: Registry hides the desktop
    crit: notable
    if:
      type: text
      regex: '(?i)"NoDesktop"\s*=\s*dword:0{7}1\b'
  - id: registry-no-close
    desc: Registry disables shutdown menu
    crit: component
    if:
      type: text
      regex: '(?i)"NoClose"\s*=\s*dword:0{7}1\b'
  - id: registry-no-logoff
    desc: Registry disables logoff menu
    crit: component
    if:
      type: text
      regex: '(?i)"NoLogOff"\s*=\s*dword:0{7}1\b'
  - id: registry-no-run
    desc: Registry disables Run menu
    crit: component
    if:
      type: text
      regex: '(?i)"NoRun"\s*=\s*dword:0{7}1\b'

composite_rules:
  - id: reg-desktop-restrictions-wincom-notice
    desc: Registry locks desktop and cites Win.com
    crit: hostile
    conf: 0.96
    all:
      - id: registry-logon-notice-win-com
      - id: registry-no-desktop
      - id: registry-no-close
      - id: registry-no-logoff
      - id: registry-no-run
      - id: objectives/impact/degrade/system/desktop::registry-disables-regedit
