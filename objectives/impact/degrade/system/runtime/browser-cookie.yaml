# Sabotage of browser cookie helper libraries (js-cookie clones and kin).
#
# Legitimate js-cookie builds initialize their optional `attributes` argument
# before reading it. A clone that reads `attributes.expires` in the setter's
# first guard both crashes ordinary two-argument writes and can silently skip
# zero-expiry writes. This is library-level sabotage rather than an API guard.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1499

traits:
  - id: document-or-zero-expiry-condition
    desc: Combines absent-document and zero-expiry checks
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'typeof\s+document\s*===\s*[''"]undefined[''"]\s*\|\|\s*attributes\.expires\s*==\s*0'

  - id: cookie-set-preinit-attributes-read
    desc: Cookie setter reads attributes before init
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'function\s+set\s*\([^)]{0,160}attributes\)\s*\{\s*if\s*\([^)]{0,160}attributes\.expires'

composite_rules:
  - id: js-cookie-setter-runtime-sabotage
    desc: Tampered js-cookie setter breaks normal writes
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: document-or-zero-expiry-condition
      - id: cookie-set-preinit-attributes-read
      - id: micro-behaviors/communications/http/cookies::document-cookie-write
      - id: well-known/lib/web/js-cookie::distribution-banner
