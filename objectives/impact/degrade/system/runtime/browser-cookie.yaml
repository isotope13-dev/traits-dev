# Sabotage of browser cookie helper libraries (js-cookie clones and kin).
#
# Legitimate helpers bail only when `document` is missing. A setter that also
# aborts when `attributes.expires == 0` — often with a leftover console marker —
# turns a routine write into a silent no-op, which is library-level sabotage
# rather than a normal API guard. Lives beside other runtime API sabotage
# (Array.prototype freeze/disable) under degrade/system/runtime/.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1499

traits:
  - id: cookie-set-expires-zero-abort
    desc: Cookie setter aborts when expires equals zero
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'attributes\.expires\s*==\s*0'

  - id: cookie-set-document-undefined-or-expires-zero
    desc: Setter aborts on document or expires-zero
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'typeof\s+document\s*===\s*[''"]undefined[''"]\s*\|\|\s*attributes\.expires\s*==\s*0'

composite_rules:
  - id: cookie-library-expires-zero-set-sabotage
    desc: Cookie library sabotages expires-zero sets
    crit: hostile
    conf: 0.96
    # The guard sits at the top of set(); the document.cookie write is after
    # attribute normalization (~1.2KB later in the unminified helper).
    near_bytes: 2048
    all:
      - id: cookie-set-document-undefined-or-expires-zero
      - id: micro-behaviors/communications/http/cookies::document-cookie-write
