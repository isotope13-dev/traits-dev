defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows]
  for: [pe, dll]
  attack: T1489

composite_rules:
  - id: dotnet-msbuild-process-killer
    desc: .NET helper terminates MSBuild processes
    all:
      - id: micro-behaviors/process/enumerate/managed::dotnet-process-enumeration-member
      - id: metadata/binary/symbols/name/process::kill-process-helper-name
      - id: metadata/build/msbuild::msbuild-name-token
      - id: micro-behaviors/process/terminate/kill::dotnet-msbuild-killer-helper-class
    unless:
      - id: well-known/lib/platform/dotnetex::dotnetex-library
