defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: python-import-compromise-taunt
    desc: Python import aborts with compromise taunt
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-level-raise
      - id: objectives/impact/deface/taunt::victim-pwn-taunt
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
