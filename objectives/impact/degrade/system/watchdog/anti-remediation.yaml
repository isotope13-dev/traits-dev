# A hardware watchdog can be weaponized as an anti-remediation mechanism:
# feed it only while the protected process is alive, so killing that process
# lets the device reboot and gives persistence another chance.
defaults:
  platforms: [linux, android]
  for: [scripts, source, binaries]
  attack: T1499

composite_rules:
  - id: watchdog-keepalive-gated-by-liveness
    desc: Hardware watchdog keepalive gated by process liveness
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/device/special::watchdog-path-reference
      - id: micro-behaviors/fs/device/ioctl::watchdog-servicing-mechanism
      - id: micro-behaviors/process/control/kill::process-existence-probe
    near_lines: 80

  - id: watchdog-anti-remediation-reboot
    desc: Detached watchdog reboots after process termination
    crit: hostile
    conf: 0.97
    mbc: B0028
    all:
      - id: watchdog-keepalive-gated-by-liveness
      - id: micro-behaviors/process/fork/clone::process-creation-primitive
    near_lines: 100
