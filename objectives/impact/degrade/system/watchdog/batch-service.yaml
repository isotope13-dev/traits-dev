defaults:
  platforms: [windows]
  for: [batch]
  attack: T1499

traits:
  - id: caret-tasklist-findstr-loop
    desc: Caret tasklist findstr loop
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)t\^a\^s\^k\^l\^i\^s\^t.{0,80}f\^i\^n\^d\^s\^t\^r'

  - id: shadowcopyprovider-service-name
    desc: ShadowCopyProvider-like service
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: MicrosoftSoftware2ShadowCop4yProvider

  - id: caret-sc-start-service
    desc: Caret-obfuscated sc start
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bs\^c\s+start\b|\bs\s*\^\s*c\s+start\b'

  # RONINGLOADER / Dragon Breath watchdog batches caret-obfuscate timeout/goto
  # around a plain (or caret) sc start of the persistence service.
  - id: caret-timeout-goto-loop
    desc: Caret-obfuscated timeout/goto watchdog loop
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?is)t\^i\^m\^e\^o\^u\^t.{0,120}g\^o\^t\^o'

  - id: sc-start-shadowcopyprovider
    desc: Starts ShadowCopyProvider-like service
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+start\s+"?MicrosoftSoftware2ShadowCop4yProvider'

composite_rules:
  - id: batch-obfuscated-service-watchdog
    desc: Obfuscated batch service watchdog
    crit: hostile
    conf: 0.98
    all:
      - id: shadowcopyprovider-service-name
    any:
      - id: caret-tasklist-findstr-loop
      - id: caret-timeout-goto-loop
      - id: caret-sc-start-service
      - id: sc-start-shadowcopyprovider
    needs: 2
