defaults:
  platforms: [linux, unix, android]
  for: [elf]
traits: []
composite_rules:
  # String-table encryption in Akuma-class Mirai builds hides the command
  # strings, but two markers stay plaintext: the busybox infection tag the
  # family runs to announce itself to peers, and the hardware watchdog device
  # it opens and feeds. Together they are the Mirai infection-set fingerprint;
  # feeding the watchdog keeps the device from rebooting the implant away.
  - id: mirai-tagged-watchdog-takeover
    desc: Mirai infection tag with hardware watchdog takeover
    crit: hostile
    conf: 0.96
    attack: T1562.001
    all:
      - id: micro-behaviors/process/argument/subcommand::busybox-bot-marker-command
      - id: micro-behaviors/fs/path/device/special::dev-watchdog-elf-text
      - id: micro-behaviors/fs/path/application/executable::bin-busybox-path

  - id: obfuscated-watchdog-device-and-config-paths
    desc: Obfuscates watchdog device and configuration path references
    crit: notable
    conf: 0.95
    attack: T1027
    all:
      - id: micro-behaviors/fs/path/config/system::watchdog-config-and-device-references
      - id: objectives/anti-static/obfuscation/encoding/xor::xor-obfuscated-linux-runtime-paths
  - id: watchdog-backed-telnet-backdoor
    desc: Watchdog-backed telnet backdoor
    crit: hostile
    conf: 0.98
    attack: T1499
    all:
      - id: micro-behaviors/fs/path/config/system::watchdog-config-and-device-references
      - id: objectives/command-and-control/backdoor/daemon::telnetd-daemon
      - id: micro-behaviors/fs/path/application/executable::bin-busybox-path
