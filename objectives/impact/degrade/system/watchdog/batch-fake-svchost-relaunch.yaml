defaults:
  platforms: [windows]
  for: [batch]
  attack: T1036.005

composite_rules:
  - id: batch-loop-relaunches-fake-svchost
    desc: Batch loop endlessly relaunches fake svchost
    crit: hostile
    conf: 0.9
    size_max: 4096
    near_lines: 12
    all:
      - id: micro-behaviors/process/create/shell/command-mode::batch-absolute-executable-command
      - id: micro-behaviors/process/info/name::svchost-windows-root-path
      - id: micro-behaviors/data/control-flow/loop::batch-goto-loop
