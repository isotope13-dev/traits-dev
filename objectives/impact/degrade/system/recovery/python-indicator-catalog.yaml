defaults:
  platforms: [windows, unix]
  for: [python]
composite_rules:
  - id: python-ioc-table-without-command-execution
    desc: Python indicator catalog without command execution evidence
    crit: exception
    conf: 0.98
    all:
      - id: metadata/file/catalog/threat-pattern::python-ioc-indicator-records
    unless:
      - id: micro-behaviors/process/create/subprocess::run-ast
      - id: micro-behaviors/process/create/subprocess::popen-ast
      - id: micro-behaviors/process/create/subprocess::call-ast
      - id: micro-behaviors/process/create/subprocess::check-output-ast
      - id: micro-behaviors/process/create/subprocess::check-call-ast
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/process/interpreter/eval/direct/
  - id: reference-only-recovery-command-catalog
    desc: Recovery command detection or policy catalogs
    crit: exception
    conf: 0.98
    for: [scripts, source, binaries]
    any:
      - id: python-ioc-table-without-command-execution
      - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
      - id: well-known/tool/detection/pattern-catalog::command-pattern-guard-catalog
