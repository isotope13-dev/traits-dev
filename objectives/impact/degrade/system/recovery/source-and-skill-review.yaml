composite_rules:
- id: option-bearing-shadow-deletion
  platforms:
  - windows
  - unix
  for:
  - binaries
  - '!dex'
  - '!wasm'
  - batch
  - powershell
  - c
  - cpp
  - csharp
  - go
  - rust
  attack: T1490
  desc: Shadow deletion with pass, enc and management options
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/process/argument/credential::pass-equals-option-text
  - id: micro-behaviors/process/argument/option::enc-equals-option-text
  - id: micro-behaviors/process/argument/option::uac-netdrive-selfdelete-option-text
  - id: objectives/impact/degrade/system/recovery::shadow-copy-delete
- id: native-service-process-recovery-sabotage
  platforms:
  - linux
  - windows
  for:
  - c
  - cpp
  attack: T1489,T1490
  desc: Service controls and process termination accompany recovery sabotage
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/os/service/control::control-service
  - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-source
  - id: micro-behaviors/process/terminate/kill::zw-terminate-process
  - id: objectives/impact/degrade/system/recovery::multi-mechanism-recovery-inhibition
- id: recovery-inhibition-with-disruptive-controls
  platforms:
  - windows
  for:
  - scripts
  - source
  - documents
  attack: T1490
  desc: Recovery inhibition with service, firewall or ransom context
  crit: suspicious
  conf: 0.95
  all:
  - id: objectives/impact/degrade/system/recovery::shadow-delete
  any:
  - id: micro-behaviors/os/service/stop::sc-stop
  - id: micro-behaviors/os/service/stop::net-stop-command-text
  - id: objectives/impact/degrade/firewall::netsh-firewall-off
  - id: objectives/impact/ransom/encrypt/threat-text::ransom-demand-or-file-threat-wording
  unless:
  - id: metadata/file/format/log::windows-event-csv-records
  - id: micro-behaviors/metaprogramming/generation::configured-source-builder
  - id: well-known/tool/detection/pattern-catalog::command-pattern-guard-catalog
