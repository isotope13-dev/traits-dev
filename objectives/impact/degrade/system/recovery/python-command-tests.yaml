defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: pytest-command-guard-cases
    desc: Parametrized command guard assertions without process execution
    crit: notable
    all:
      - id: metadata/package/testing/presence/detector::pytest-command-parametrization
      - id: metadata/package/testing/presence/detector::python-command-guard-assertion
    unless:
      - id: micro-behaviors/process/create/subprocess/launch::run-ast
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
      - id: micro-behaviors/process/create/subprocess/launch::call-ast
      - id: micro-behaviors/process/create/subprocess/launch::check-call-ast
      - id: micro-behaviors/process/create/subprocess/capture::check-output-ast
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
      - id: micro-behaviors/process/interpreter/eval/python-builtins::eval-builtin
      - id: micro-behaviors/os/module/load/path::python-importlib-spec-exec-module
