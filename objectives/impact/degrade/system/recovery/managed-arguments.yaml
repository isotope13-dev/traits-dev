defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1490
traits:
  - id: bcd-recovery-disable-argument
    desc: BCD recovery-disable argument string
    crit: suspicious
    conf: 0.98
    if:
      type: text
      section: .text
      regex: '^/set \{(default|current)\} recoveryenabled (No|false)$'
composite_rules:
  - id: managed-ransomware-disables-boot-recovery
    desc: Managed ransomware carries boot-recovery disable command
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/ransom/encrypt-dotnet::managed-ransom-stream-replacement
      - id: bcd-recovery-disable-argument
      - id: micro-behaviors/process/create/subprocess::dotnet-process-start-split-tokens
