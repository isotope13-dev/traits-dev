# The WMI SystemRestore class (root\default) exposes Disable(drive); calling
# it turns System Restore off so restore points cannot undo the intrusion.
defaults:
  platforms: [windows]
  for: [vbs, html, javascript, powershell]
  attack: T1490

traits:
  - id: wmi-system-restore-disable-call
    desc: Disables System Restore through WMI
    crit: hostile
    conf: 0.95
    if:
      type: text
      regex: '(?is)\.Get\s*\(\s*["'']SystemRestore["'']\s*\).{0,160}\.Disable\s*\('
