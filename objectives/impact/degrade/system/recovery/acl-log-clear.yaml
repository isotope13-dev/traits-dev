composite_rules:
  - id: shadow-delete-with-acl-takeover-and-log-clear
    desc: Shadow delete, ACL takeover, and log clear
    crit: hostile
    conf: 0.99
    attack: T1490,T1222.001,T1070.001
    platforms: [windows]
    for: [scripts, binaries, go, c, cpp, csharp, rust]
    all:
      - id: micro-behaviors/fs/volume/shadow-copy::shadow-copy-deletion-reference
      - id: micro-behaviors/fs/chown::chown-takeown
      - id: micro-behaviors/os/event/log::windows-eventlog-clear-command-reference
    any:
      - id: micro-behaviors/fs/acl::icacls-grant-everyone-sid-full
      - id: micro-behaviors/fs/acl::icacls-grant-everyone-full-shell
      - id: micro-behaviors/fs/acl::cacls-grant-everyone-full
