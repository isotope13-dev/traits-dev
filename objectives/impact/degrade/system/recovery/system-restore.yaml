defaults:
  for: [csharp]
  platforms: [windows]
  attack: "T1112"
traits:
  - id: systemrestore-policy-path
    desc: System Restore policy registry path
    crit: suspicious
    conf: 0.94
    if:
      type: string_literal
      exact: HKEY_Local_Machine\\Software\\Policies\\Microsoft\\Windows NT\\SystemRestore
  - id: disableconfig-literal
    desc: DisableConfig string literal
    crit: notable
    conf: 0.92
    if:
      type: string_literal
      exact: DisableConfig
  - id: disablesr-literal
    desc: DisableSR string literal
    crit: notable
    conf: 0.92
    if:
      type: string_literal
      exact: DisableSR
  - id: nsis-sysrestore-plugin-basename
    desc: NSIS System Restore plugin basename
    crit: notable
    conf: 0.94
    for: [pe, dll]
    attack: "T1490"
    size_min: 4096
    size_max: 16384
    if:
      type: basename
      exact: SysRestore.dll
composite_rules:
  - id: disableconfig-name
    desc: DisableConfig policy value
    crit: suspicious
    conf: 0.92
    all:
      - id: systemrestore-policy-path
      - id: disableconfig-literal
  - id: disablesr-name
    desc: DisableSR policy value
    crit: suspicious
    conf: 0.92
    all:
      - id: systemrestore-policy-path
      - id: disablesr-literal
  - id: disable-system-restore
    desc: Disables Windows System Restore via registry policy
    crit: hostile
    conf: 0.98
    all:
      - id: systemrestore-policy-path
      - id: micro-behaviors/os/registry/write::registry-managed-set-value-source
    any:
      - id: disableconfig-name
      - id: disablesr-name
    needs: 2
  - id: nsis-sysrestore-plugin-helper
    desc: NSIS System Restore plugin helper
    crit: notable
    conf: 0.96
    for: [pe, dll]
    attack: "T1490"
    all:
      - id: nsis-sysrestore-plugin-basename
      - id: micro-behaviors/fs/path/library::srclient-dll-reference
      - id: micro-behaviors/os/recovery::sr-set-restore-point
