defaults:
  platforms:
  - windows
  for:
  - scripts
  - source
  - binaries
  attack: T1490
  crit: suspicious
traits:
- id: wbadmin-delete-catalog
  desc: Windows backup-catalog deletion command
  conf: 0.92
  if:
    type: text
    regex: '(?i)\bwbadmin(\.exe)?\b[^\r\n]{0,30}\bdelete\b[^\r\n]{0,30}\bcatalog\b'
  unless:
  - id: metadata/file/format/log::windows-event-csv-records
  - id: metadata/package/testing/harness/runtime::bun-assertion-suite
  - id: metadata/build/generated::generated-attack-map-context
  - id: micro-behaviors/metaprogramming/generation::configured-source-builder
  - id: well-known/tool/detection/security-scanner::eicar-test-string-reference
  - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
  - id: micro-behaviors/process/create/shell/guard/
- id: rust-wbadmin-delete-catalog-arguments
  desc: Rust wbadmin deletes backup catalog
  conf: 0.92
  for:
  - rust
  if:
    type: text
    regex: (?is)wbadmin.{0,32}&\[[^\]]{0,120}delete.{0,80}catalog
composite_rules:
- id: shadow-delete
  desc: Windows backup or recovery inhibition
  conf: 0.95
  any:
  - id: objectives/impact/degrade/system/recovery::bcdedit-recovery
  - id: objectives/impact/degrade/system/recovery::bcdedit-ignore-failures
  - id: objectives/impact/ransom/recovery-inhibition::wbadmin-delete-systemstate
  - id: objectives/impact/degrade/system/recovery::wbadmin-delete-catalog
  - id: objectives/impact/degrade/system/recovery::rust-wbadmin-delete-catalog-arguments
  - id: objectives/impact/ransom/recovery-inhibition::wbadmin-delete-all-backups
  unless:
  - id: metadata/file/format/log::windows-event-csv-records
  - id: micro-behaviors/metaprogramming/generation::configured-source-builder
  - id: well-known/tool/detection/pattern-catalog::command-pattern-guard-catalog
  downgrade:
    scope: archive
    any:
    - id: well-known/tool/detection/opencode-v2-security::package-name
