defaults:
  platforms:
  - windows
  for:
  - scripts
  - source
  - binaries
  attack: T1490
  crit: suspicious
traits:
- id: wbadmin-delete-catalog
  desc: Windows backup-catalog deletion command
  conf: 0.92
  if:
    type: text
    regex: '(?i)\bwbadmin(\.exe)?[ \t]+delete[ \t]+catalog\b'
  unless:
  - id: metadata/file/format/log::windows-event-csv-records
  - id: metadata/package/testing/harness/runtime::bun-assertion-suite
  - id: objectives/impact/degrade/system/recovery::reference-only-recovery-command-catalog
  - id: metadata/build/generated::generated-attack-map-context
  - id: micro-behaviors/metaprogramming/generation/source::configured-source-builder
  - id: metadata/file/format/test-signature::eicar-test-string-reference
  - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
  - id: micro-behaviors/os/security/command-policy/gate::command-policy-implementation-context
  - id: metadata/file/format/threat-intelligence::yara-rule-corpus-text
- id: rust-wbadmin-delete-catalog-arguments
  desc: Rust wbadmin deletes backup catalog
  conf: 0.92
  for:
  - rust
  if:
    type: text
    regex: (?is)wbadmin.{0,32}&\[[^\]]{0,120}delete.{0,80}catalog
# Quoted argv lists also occur in C# process command tables.
- id: wbadmin-delete-catalog-argv
  desc: Backup catalog deletion argument sequence
  crit: notable
  conf: 0.98
  for: [perl, go, csharp, python]
  if:
    type: text
    regex: '(?i)\bwbadmin(\.exe)?["'']\s*,\s*\[?\s*["'']delete["'']\s*,\s*["'']catalog\b'
    exclude_comments: true
composite_rules:
- id: shadow-delete
  desc: Windows backup or recovery inhibition
  conf: 0.95
  any:
  - id: objectives/impact/degrade/system/recovery::bcdedit-recovery
  - id: objectives/impact/ransom/recovery-inhibition::wbadmin-delete-systemstate
  - id: objectives/impact/degrade/system/recovery::wbadmin-delete-catalog
  - id: objectives/impact/degrade/system/recovery::rust-wbadmin-delete-catalog-arguments
  - id: objectives/impact/degrade/system/recovery::wbadmin-delete-catalog-argv
  - id: objectives/impact/ransom/recovery-inhibition::wbadmin-delete-all-backups
  unless:
  - id: metadata/file/format/log::windows-event-csv-records
  - id: micro-behaviors/metaprogramming/generation/source::configured-source-builder
  - id: well-known/tool/detection/pattern-catalog::command-pattern-guard-catalog
  - id: well-known/tool/detection/pattern-catalog::rust-command-rule-catalog
  - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
  downgrade:
    scope: archive
    any:
    - id: well-known/tool/detection/opencode-v2-security::package-name
