defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # These are Windows-defined recovery resources, independent of the chosen
  # backup filenames or installation drive. File scope does not bind the move
  # operand to either resource; describe the supported recovery sabotage clues.
  - id: managed-ransomware-recovery-image-relocation
    desc: Ransom encryptor with WinRE image/config and file-move calls
    crit: hostile
    conf: 0.96
    attack: T1490
    all:
      - id: objectives/impact/ransom/encrypt/bulk-encryption::managed-ransom-stream-replacement
      - id: micro-behaviors/fs/path/system/state::winre-wim-reference
      - id: micro-behaviors/fs/path/system/state::reagent-xml-reference
      - id: micro-behaviors/fs/file/move::dotnet-file-move-call
