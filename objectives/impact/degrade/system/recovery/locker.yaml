defaults:
  platforms: [unix, windows, macos, android]
composite_rules:
  - id: locker-ransomware-behavior
    desc: Disables registry tools and sets custom legal notice on logon screen
    crit: hostile
    conf: 0.95
    attack: "T1486"
    all:
      - id: "micro-behaviors/os/registry/value-name::disable-registry-tools"
      - id: objectives/impact/deface/screen::logon-legal-notice-registry-write

  - id: android-mqtt-remote-lock-and-factory-reset-control
    desc: MQTT remote device lock, wipe, and reboot tasks
    crit: hostile
    conf: 0.98
    for: [android_apk, apk_android, apk, zip, dex]
    attack: T1474
    all:
      - id: micro-behaviors/communications/messaging/send::dex-mqtt-function-lock-topic
      - id: micro-behaviors/communications/messaging/send::dex-mqtt-function-factory-reset-topic
      - id: micro-behaviors/communications/messaging/send::dex-mqtt-function-reboot-topic
