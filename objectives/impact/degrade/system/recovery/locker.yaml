defaults:
  platforms: [unix, windows, android]
composite_rules:
  # The command references jointly describe recovery inhibition, firewall
  # impairment, and deliberate disruption of the Windows desktop. Keep each
  # leg in one managed executable so unrelated archive members cannot combine.
  - id: managed-destructive-locker-command-set
    desc: Managed payload carries coordinated system-disruption commands
    crit: hostile
    conf: 0.97
    for: [pe]
    platforms: [windows]
    attack: T1490,T1562.004,T1489
    scope: file
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/fs/volume/shadow-copy::vssadmin-shadow-delete-command
      - id: micro-behaviors/os/security/firewall::netsh-allprofiles-disable-command
      - id: micro-behaviors/fs/chown::takeown-file-command
      - id: micro-behaviors/process/terminate/command::taskkill-explorer-force-first

  - id: locker-ransomware-behavior
    desc: Disables registry tools and sets custom legal notice on logon screen
    crit: hostile
    conf: 0.95
    attack: "T1486"
    all:
      - id: "micro-behaviors/os/registry/value-name::disable-registry-tools"
      - id: objectives/impact/deface/screen::logon-legal-notice-registry-write

  - id: android-mqtt-remote-lock-and-factory-reset-control
    desc: MQTT remote device lock, wipe, and reboot tasks
    crit: hostile
    conf: 0.98
    for: [android_apk, apk_android, apk, zip, dex]
    attack: T1474
    all:
      - id: micro-behaviors/communications/messaging/send::dex-mqtt-function-lock-topic
      - id: micro-behaviors/communications/messaging/send::dex-mqtt-function-factory-reset-topic
      - id: micro-behaviors/communications/messaging/send::dex-mqtt-function-reboot-topic
