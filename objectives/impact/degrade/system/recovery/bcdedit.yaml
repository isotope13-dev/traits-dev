defaults:
  platforms:
  - windows
  for:
  - scripts
  - source
  - binaries
  attack: T1490
traits:
- id: bcdedit-recovery
  desc: Disables Windows boot recovery with bcdedit
  crit: suspicious
  conf: 0.7
  if:
    type: text
    # A following "z" is a bytecode raw-scan type tag glued to the token.
    regex: '(?i)(^|[^A-Za-z])bcdedit(\.exe)?.{0,24}/set.{0,24}\brecoveryenabled.{0,8}\bno(z.?|\b)'
  unless:
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/app/utility/rufus::rufus-official-context
  - id: metadata/build/generated::generated-attack-map-context
  - id: micro-behaviors/metaprogramming/generation::configured-source-builder
  - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
  - id: micro-behaviors/process/create/shell/guard/
- id: bcdedit-ignore-failures
  desc: Sets boot policy to ignore all failures
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: '(?i)(^|[^A-Za-z])bcdedit.{0,16}/set.{0,16}bootstatuspolicy.{0,4}ignoreallfailures(z.?|\b)'
  unless:
  - id: micro-behaviors/metaprogramming/generation::configured-source-builder
