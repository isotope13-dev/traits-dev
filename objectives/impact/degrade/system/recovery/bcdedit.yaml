defaults:
  platforms:
  - windows
  for:
  - scripts
  - source
  - binaries
  attack: T1490
traits:
- id: bcdedit-recovery
  desc: bcdedit boot recovery disablement command text
  crit: suspicious
  conf: 0.7
  if:
    type: text
    # A following "z" is a bytecode raw-scan type tag glued to the token.
    regex: '(?i)(^|[^A-Za-z])bcdedit(\.exe)?.{0,24}/set.{0,24}\brecoveryenabled.{0,8}\bno(z.?|\b)'
  unless:
  - id: reference-only-recovery-command-catalog
  - id: metadata/file/format/log::windows-event-csv-records
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/app/utility/rufus::rufus-official-context
  - id: metadata/build/generated::generated-attack-map-context
  - id: micro-behaviors/metaprogramming/generation/source::configured-source-builder
  - id: well-known/tool/detection/security-scanner::eicar-test-string-reference
  - id: micro-behaviors/os/security/command-policy::command-policy-implementation-context
