# Recovery sabotage commands establish no encryption or extortion.
defaults:
  platforms:
  - windows
  attack: T1490
traits:
- id: wmic-shadowcopy
  desc: WMIC shadow-copy deletion command reference
  crit: suspicious
  conf: 0.7
  for:
  - batch
  - powershell
  - python
  - javascript
  - c
  - cpp
  - go
  - pe
  - dll
  if:
    type: text
    regex: (?i)\bwmic(\.exe)?[\s"',]{1,6}shadowcopy[\s"',]{1,6}delete\b
  unless:
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: well-known/app/system/anthropic-cybersecurity-skills/
  - id: well-known/app/storage/peazip::peazip-zpaq-helper
  - id: well-known/lib/runtime/scripted/sandbox-runtime/
  - id: well-known/tool/offensive/pwn/
  - id: micro-behaviors/process/create/shell/guard/
  - id: micro-behaviors/metaprogramming/generation::configured-source-builder
  - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
  - id: metadata/build/generated::generated-attack-map-context
composite_rules:
- id: shadow-copy-delete
  desc: Shadow-copy deletion command or method reference
  crit: suspicious
  conf: 0.97
  for:
  - binaries
  - scripts
  - source
  any:
  - id: objectives/impact/degrade/system/recovery::vssadmin-delete
  - id: objectives/impact/degrade/system/recovery::wmic-shadowcopy
  - id: objectives/impact/ransom/recovery-inhibition::dotnet-vssadmin-shadow-delete
  - id: objectives/impact/ransom/recovery-inhibition::dotnet-wmic-shadowcopy-delete
  - id: objectives/impact/ransom/recovery-inhibition::wmic-shadowcopy-where-delete
  - id: objectives/impact/ransom/recovery-inhibition::ps-wmi-shadowcopy-delete
  - id: objectives/impact/ransom/recovery-inhibition::wmi-shadow-delete-source
  - id: objectives/impact/ransom/recovery-inhibition::native-wmi-shadow-delete
  unless:
  - id: micro-behaviors/metaprogramming/generation::configured-source-builder
  downgrade:
    scope: archive
    any:
    - id: well-known/tool/detection/opencode-v2-security::package-name
- id: multi-mechanism-recovery-inhibition
  desc: Snapshot deletion with boot recovery disabled
  crit: hostile
  conf: 0.99
  for:
  - scripts
  - source
  - binaries
  all:
  - id: objectives/impact/degrade/system/recovery::shadow-copy-delete
  - id: objectives/impact/degrade/system/recovery::bcdedit-recovery
  near_lines: 5
  unless:
  - id: objectives/impact/degrade/system/recovery::comprehensive-recovery-inhibition
  - id: well-known/tool/detection/pattern-catalog::attack-technique-map-module
  - id: well-known/tool/detection/pattern-catalog::command-pattern-guard-catalog
  - id: micro-behaviors/metaprogramming/generation::configured-source-builder
- id: comprehensive-recovery-inhibition
  desc: Snapshot deletion with boot recovery sabotage
  crit: hostile
  conf: 0.99
  for:
  - scripts
  - source
  - binaries
  all:
  - id: objectives/impact/degrade/system/recovery::shadow-copy-delete
  - id: objectives/impact/degrade/system/recovery::bcdedit-recovery
  - id: objectives/impact/degrade/system/recovery::bcdedit-ignore-failures
  near_lines: 6
  unless:
  - id: micro-behaviors/metaprogramming/generation::configured-source-builder
  - id: well-known/tool/detection/pattern-catalog::command-pattern-guard-catalog
