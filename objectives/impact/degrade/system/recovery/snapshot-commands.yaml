defaults:
  platforms:
  - windows
  attack: T1490
  for: [scripts, source, binaries]
traits:
composite_rules:
- id: multi-mechanism-recovery-inhibition
  desc: Snapshot deletion with boot recovery disabled
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/fs/volume/shadow-copy::shadow-copy-deletion-reference
  - id: objectives/impact/degrade/system/recovery::bcdedit-recovery
  near_lines: 5
  unless:
  - id: objectives/impact/degrade/system/recovery::comprehensive-recovery-inhibition
  - id: well-known/tool/detection/pattern-catalog::attack-technique-map-module
  - id: well-known/tool/detection/pattern-catalog::command-pattern-guard-catalog
  - id: micro-behaviors/metaprogramming/generation::configured-source-builder
- id: comprehensive-recovery-inhibition
  desc: Snapshot deletion with boot recovery sabotage
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/fs/volume/shadow-copy::shadow-copy-deletion-reference
  - id: objectives/impact/degrade/system/recovery::bcdedit-recovery
  - id: objectives/impact/degrade/system/recovery::bcdedit-ignore-failures
  near_lines: 6
  unless:
  - id: micro-behaviors/metaprogramming/generation::configured-source-builder
  - id: well-known/tool/detection/pattern-catalog::command-pattern-guard-catalog
