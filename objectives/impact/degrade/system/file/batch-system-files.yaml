defaults:
  platforms:
  - windows
  for:
  - batch
  attack: T1485
traits:
- id: batch-system32-dll-glob-delete-systemroot-del
  desc: Deletes DLLs across the Windows System32 root
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (^|[\r\n])[ \t]*del[ \t]+"?%systemroot%\\system32\\\*\.dll"?([ \t\r\n]|$)
    case_insensitive: true
- id: batch-system32-dll-glob-delete-systemroot-erase
  desc: Deletes DLLs across the Windows System32 root
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (^|[\r\n])[ \t]*erase[ \t]+"?%systemroot%\\system32\\\*\.dll"?([ \t\r\n]|$)
    case_insensitive: true
- id: batch-system32-dll-glob-delete-windir-del
  desc: Deletes DLLs across the Windows System32 root
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (^|[\r\n])[ \t]*del[ \t]+"?%windir%\\system32\\\*\.dll"?([ \t\r\n]|$)
    case_insensitive: true
- id: batch-system32-dll-glob-delete-windir-erase
  desc: Deletes DLLs across the Windows System32 root
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (^|[\r\n])[ \t]*erase[ \t]+"?%windir%\\system32\\\*\.dll"?([ \t\r\n]|$)
    case_insensitive: true
- id: batch-system32-dll-glob-delete-drive-del
  desc: Deletes DLLs across the Windows System32 root
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (^|[\r\n])[ \t]*del[ \t]+"?[a-z]:\\Windows\\system32\\\*\.dll"?([ \t\r\n]|$)
    case_insensitive: true
- id: batch-system32-dll-glob-delete-drive-erase
  desc: Deletes DLLs across the Windows System32 root
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (^|[\r\n])[ \t]*erase[ \t]+"?[a-z]:\\Windows\\system32\\\*\.dll"?([ \t\r\n]|$)
    case_insensitive: true
composite_rules:
- id: batch-protected-system-dll-replacement
  desc: Replaces a protected System32 DLL after changing its ACLs
  crit: suspicious
  conf: 0.97
  scope: file
  all:
  - id: micro-behaviors/fs/path/binary::system32-executable-path
  - id: micro-behaviors/fs/chown::takeown-file-command
  - id: micro-behaviors/fs/acl::icacls-grant-command
  - id: micro-behaviors/fs/file/copy/source-destination::windows-copy-command
  - id: micro-behaviors/process/terminate/command::taskkill-command-call
- id: archive-pairs-system-dll-replacement-with-pe
  desc: Archive pairs protected DLL replacement commands with a PE
  crit: suspicious
  conf: 0.96
  scope: archive
  for: [zip, batch, pe]
  all:
  - id: micro-behaviors/fs/path/binary::system32-executable-path
  - id: micro-behaviors/fs/chown::takeown-file-command
  - id: micro-behaviors/fs/acl::icacls-grant-command
  - id: micro-behaviors/fs/file/copy/source-destination::windows-copy-command
  - id: micro-behaviors/process/terminate/command::taskkill-command-call
  - id: metadata/file/magic/identity::pe-dos-stub
- id: objectives/impact/degrade/system/file::batch-system32-dll-glob-delete
  desc: Deletes DLLs across the Windows System32 root
  crit: suspicious
  conf: 0.98
  any:
  - id: batch-system32-dll-glob-delete-systemroot-del
  - id: batch-system32-dll-glob-delete-systemroot-erase
  - id: batch-system32-dll-glob-delete-windir-del
  - id: batch-system32-dll-glob-delete-windir-erase
  - id: batch-system32-dll-glob-delete-drive-del
  - id: batch-system32-dll-glob-delete-drive-erase
- id: batch-system32-dll-glob-wipe
  desc: Deletes DLLs across the Windows System32 root
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/impact/degrade/system/file::batch-system32-dll-glob-delete
  - id: micro-behaviors/fs/delete/file/command::batch-del-call
- id: batch-device-manager-console-sabotage
  desc: System DLL wiper also removes Device Manager
  crit: hostile
  conf: 0.98
  all:
  - id: batch-system32-dll-glob-wipe
  - id: micro-behaviors/fs/delete/target::batch-delete-device-manager-console
