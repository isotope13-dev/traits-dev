defaults:
  platforms:
  - windows
  for:
  - batch
  attack: T1485
traits:
- id: batch-system32-dll-glob-delete-systemroot-del
  desc: Deletes DLLs across the Windows System32 root
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (^|[\r\n])[ \t]*del[ \t]+"?%systemroot%\\system32\\\*\.dll"?([ \t\r\n]|$)
    case_insensitive: true
- id: batch-system32-dll-glob-delete-systemroot-erase
  desc: Deletes DLLs across the Windows System32 root
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (^|[\r\n])[ \t]*erase[ \t]+"?%systemroot%\\system32\\\*\.dll"?([ \t\r\n]|$)
    case_insensitive: true
- id: batch-system32-dll-glob-delete-windir-del
  desc: Deletes DLLs across the Windows System32 root
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (^|[\r\n])[ \t]*del[ \t]+"?%windir%\\system32\\\*\.dll"?([ \t\r\n]|$)
    case_insensitive: true
- id: batch-system32-dll-glob-delete-windir-erase
  desc: Deletes DLLs across the Windows System32 root
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (^|[\r\n])[ \t]*erase[ \t]+"?%windir%\\system32\\\*\.dll"?([ \t\r\n]|$)
    case_insensitive: true
- id: batch-system32-dll-glob-delete-drive-del
  desc: Deletes DLLs across the Windows System32 root
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (^|[\r\n])[ \t]*del[ \t]+"?[a-z]:\\Windows\\system32\\\*\.dll"?([ \t\r\n]|$)
    case_insensitive: true
- id: batch-system32-dll-glob-delete-drive-erase
  desc: Deletes DLLs across the Windows System32 root
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (^|[\r\n])[ \t]*erase[ \t]+"?[a-z]:\\Windows\\system32\\\*\.dll"?([ \t\r\n]|$)
    case_insensitive: true
composite_rules:
- id: objectives/impact/degrade/system/file::batch-system32-dll-glob-delete
  desc: Deletes DLLs across the Windows System32 root
  crit: suspicious
  conf: 0.98
  any:
  - id: batch-system32-dll-glob-delete-systemroot-del
  - id: batch-system32-dll-glob-delete-systemroot-erase
  - id: batch-system32-dll-glob-delete-windir-del
  - id: batch-system32-dll-glob-delete-windir-erase
  - id: batch-system32-dll-glob-delete-drive-del
  - id: batch-system32-dll-glob-delete-drive-erase
- id: batch-system32-dll-glob-wipe
  desc: Deletes DLLs across the Windows System32 root
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/impact/degrade/system/file::batch-system32-dll-glob-delete
  - id: micro-behaviors/fs/delete/file/command::batch-del-call
- id: batch-device-manager-console-sabotage
  desc: System DLL wiper also removes Device Manager
  crit: hostile
  conf: 0.98
  all:
  - id: batch-system32-dll-glob-wipe
  - id: micro-behaviors/fs/delete/file/command::batch-delete-device-manager-console
