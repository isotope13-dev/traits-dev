defaults:
  platforms:
  - windows
  for:
  - batch
  attack: T1485
traits:
- id: batch-system32-dll-glob-delete
  desc: Deletes DLLs across the Windows System32 root
  crit: suspicious
  conf: 0.98
  if:
    type: tree-sitter
    language: batch
    query: |
      (cmd (command_name) @tool (argument_list) @args
        (#match? @tool "(?i)^(del|erase)$")
        (#match? @args "(?i)^\\s*\"?(%systemroot%|%windir%|[a-z]:\\\\Windows)\\\\system32\\\\\\*\\.dll\"?($|\\s)"))
composite_rules:
- id: batch-system32-dll-glob-wipe
  desc: Deletes DLLs across the Windows System32 root
  crit: hostile
  conf: 0.98
  all:
  - id: batch-system32-dll-glob-delete
  - id: micro-behaviors/fs/delete/file/command::batch-del-call
- id: batch-device-manager-console-sabotage
  desc: System DLL wiper also removes Device Manager
  crit: hostile
  conf: 0.98
  all:
  - id: batch-system32-dll-glob-wipe
  - id: micro-behaviors/fs/delete/file/command::batch-delete-device-manager-console
