defaults:
  platforms: [windows]
  for: [html, javascript]
  attack: T1485
composite_rules:
  - id: scriptlet-system-files-reset-overwrite
    desc: Scriptlet resets overwrite Windows config and executables
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/com/automation::scriptlet-typelib-clsid
      - id: micro-behaviors/fs/write/content::reset-path-write-sequence
      - id: micro-behaviors/fs/write/content::windows-ini-path-write-sequence
      - id: micro-behaviors/fs/write/content::windows-executable-path-write-sequence
  # Array-indirect sibling of the reset-overwrite above: targets arrive in
  # an Array() variable rather than Path assignments, and the payload is a
  # statement-form blanking Write. Same destruction, different spelling.
  - id: scriptlet-system-files-blanking-overwrite
    desc: Scriptlet blanks Windows system files
    crit: hostile
    conf: 0.98
    for: [html]
    all:
      - id: micro-behaviors/os/com/automation::scriptlet-typelib-clsid
      - id: micro-behaviors/fs/write/content::scriptlet-blanking-statement-write
      - id: micro-behaviors/data/collection/array::vbs-system-filename-array
