defaults:
  platforms: [windows]
  for: [html, javascript]
composite_rules:
  - id: scriptlet-system-files-reset-overwrite
    desc: Scriptlet resets overwrite Windows config and executables
    crit: hostile
    conf: 0.99
    attack: T1485
    all:
      - id: micro-behaviors/os/com/automation::scriptlet-typelib-clsid
      - id: micro-behaviors/fs/write/content::reset-path-write-sequence
      - id: micro-behaviors/fs/write/content::windows-ini-path-write-sequence
      - id: micro-behaviors/fs/write/content::windows-executable-path-write-sequence
