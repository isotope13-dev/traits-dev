defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # System-library ldstr tokens are bound to #US; the same bounded code
  # opens an append/write stream and writes a PRNG-filled buffer. Protected
  # files may reject the write; this records tampering code, not OS damage.
  - id: managed-keylogger-system-dll-random-append
    desc: Keylogger carries system-DLL tampering code
    crit: hostile
    conf: 0.97
    attack: T1565.001
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: micro-behaviors/fs/write/file/append::managed-system-dll-random-append-layout
