defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1059.003

composite_rules:
  - id: cmd-executable-extension-die-rename
    desc: Embedded cmd renames a Windows executable to a .die extension
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/fs/file/rename::cmd-rename-quoted-target
      - id: micro-behaviors/fs/path/extension::exe-dup
      - id: micro-behaviors/fs/path/extension::die-extension-marker
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-command

  - id: malformed-pe-cmd-executable-extension-sabotage
    desc: Malformed PE embeds cmd-based executable extension sabotage
    crit: hostile
    conf: 0.999
    all:
      - id: metadata/binary/metrics/structural::malformed-pe-structure
      - id: cmd-executable-extension-die-rename
