defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1059.003

composite_rules:
  - id: cmd-target-die-extension-rename
    desc: Embedded cmd rename changes a target to the .die extension
    # The exact command is unusual, but updaters may legitimately park an old
    # executable under a non-runnable suffix. Family context establishes harm.
    crit: suspicious
    conf: 0.995
    any:
      - id: micro-behaviors/fs/file/rename::cmd-rename-quoted-target
      - id: micro-behaviors/fs/file/rename::utf16-cmd-rename-quoted-target
    all:
      - id: micro-behaviors/fs/path/extension::die-extension-marker

  - id: malformed-pe-cmd-executable-extension-sabotage
    desc: Malformed PE embeds cmd-based executable extension sabotage
    crit: suspicious
    conf: 0.999
    all:
      - id: metadata/binary/metrics/structural::malformed-pe-structure
      - id: cmd-target-die-extension-rename
