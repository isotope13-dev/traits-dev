defaults:
  platforms: [openbsd, bsd, unix]
  for: [python]

traits:
  - id: python-var-log-fallocate-fill
    desc: Python fills /var/log using fallocate
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)fill\s+/var/log[\s\S]{0,1000}fallocate\b'
    unless:
      - id: metadata/package/testing/presence/harness::test-directory

  - id: python-openbsd-newsyslog-cron
    desc: Python OpenBSD log cron damage
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: /etc/newsyslog\.conf[\s\S]{0,220}/etc/crontab

composite_rules:
  - id: python-openbsd-system-degrade
    desc: Python OpenBSD system degrade
    crit: hostile
    conf: 0.98
    all:
      - id: python-var-log-fallocate-fill
      - id: python-openbsd-newsyslog-cron
