defaults:
  platforms: [unix]
  for: [python]
  attack: T1562.001,T1546

traits:
  - id: python-sensitive-system-write-target-cluster
    desc: Sensitive system write target cluster
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '/etc/passwd[\s\S]{0,300}/etc/shadow[\s\S]{0,300}/root/\.bashrc[\s\S]{0,300}/etc/crontab'

composite_rules:
  - id: python-appends-sensitive-system-file-cluster
    desc: Python appends content across account shell and cron files
    crit: hostile
    conf: 0.99
    all:
      - id: python-sensitive-system-write-target-cluster
      - id: micro-behaviors/fs/file/open::write-append-create-mode
