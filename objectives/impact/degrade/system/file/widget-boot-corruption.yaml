defaults:
  for: [html, javascript]
  platforms: [windows]
composite_rules:
  - id: widget-invalid-boot-configuration-write
    desc: Widget source replaces boot.ini with invalid ARC devices
    crit: hostile
    conf: 0.99
    attack: T1490
    near_bytes: 512
    all:
      - id: micro-behaviors/data/config/write::widget-boot-ini-write
      - id: micro-behaviors/fs/path/config/system::windows-arc-placeholder-indices
