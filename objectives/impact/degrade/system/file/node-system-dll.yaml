# A system-DLL deletion command may also service an offline Windows image.
# This matcher does not bind the target drive to the running installation.
# Keep the general detection suspicious; judge intent from the complete source.
defaults:
  platforms: [windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-system32-dll-glob-deletion
    desc: Node command targets System32 DLLs for bulk deletion
    crit: suspicious
    conf: 0.98
    attack: T1485
    all:
      - id: micro-behaviors/fs/delete/file/command::node-system32-dll-glob-delete-call
      - id: metadata/import/builtin::require-child-process
