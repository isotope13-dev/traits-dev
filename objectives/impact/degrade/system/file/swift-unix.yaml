defaults:
  platforms: [unix]
  for: [swift]
  attack: T1499

traits:
  - id: swift-crontab-remove-command
    desc: Swift removes user crontab
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: crontab -r

composite_rules:
  - id: swift-buffer-writes-and-cron-removal
    desc: Repeated-buffer writes with crontab removal
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/data/buffer/allocate::swift-megabyte-repeating-buffer
      - id: micro-behaviors/fs/write/file/full/unspecified::swift-file-url-write-call
      - id: swift-crontab-remove-command
