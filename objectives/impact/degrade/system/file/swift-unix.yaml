defaults:
  platforms: [unix]
  for: [swift]
  attack: T1499

traits:
  - id: swift-degrade-junk-dir
    desc: Swift degrade junk directory
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: /tmp/degrade_junk
  - id: swift-crontab-remove-command
    desc: Swift removes user crontab
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: crontab -r

composite_rules:
  - id: swift-disk-fill-and-cron-removal
    desc: Swift disk fill and cron removal
    crit: hostile
    conf: 0.96
    all:
      - id: swift-degrade-junk-dir
      - id: swift-crontab-remove-command

  - id: swift-cron-wipe-and-collect
    desc: Wipes crontab and uploads a collection
    crit: hostile
    conf: 0.96
    all:
      - id: swift-crontab-remove-command
      - id: objectives/persistence/system/cron/job::swift-crontab-pipe-install
      - id: objectives/exfiltration/http/upload::swift-http-collect-upload

  - id: swift-xor-suffix-cron-wipe
    desc: XOR suffix ransom also wipes crontab
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/source/arithmetic::source-xor-operation
      - id: micro-behaviors/fs/path/extension::encrypted-filename-suffix-literal
      - id: swift-crontab-remove-command
