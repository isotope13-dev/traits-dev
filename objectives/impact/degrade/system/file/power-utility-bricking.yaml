# Tengu overwrites the headers of reboot/shutdown utilities so defenders
# cannot use the normal recovery commands.  The overwrite composite catches
# the technique when a variant changes the replacement bytes; the ELFOOD leg
# gives the published implementation a higher-confidence hostile finding.
defaults:
  platforms: [linux, android]
  for: [scripts, source, binaries]
  attack: T1562.001

traits:
  - id: elfood-header-replacement-marker
    desc: ELFOOD marker for ELF header corruption
    crit: suspicious
    conf: 0.98
    for: [c, cpp, rust, go, elf, shell]
    if:
      type: text
      substr: ELFOOD

  - id: shell-power-utility-redirection
    desc: Shell redirects into Linux power utility
    crit: suspicious
    conf: 0.97
    for: [shell]
    if:
      type: text
      regex: '>\s*["'']?/(usr/)?s?bin/(reboot|shutdown|halt|poweroff)\b'

  - id: shell-power-utility-tee-write
    desc: Shell tee writes Linux power utility
    crit: suspicious
    conf: 0.97
    for: [shell]
    if:
      type: text
      regex: '\btee\s+(-a\s+)?["'']?/(usr/)?s?bin/(reboot|shutdown|halt|poweroff)\b'

composite_rules:
  - id: power-utility-overwrite
    desc: Writes to a set of Linux power utilities
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/system::power-utility-path-set
    any:
      - id: micro-behaviors/fs/file/write/direct::write
      - id: shell-power-utility-redirection
      - id: shell-power-utility-tee-write
    # Keep the write operation close to the utility-path evidence. A wider
    # window conflates sudoers/help text listing the utilities with an
    # unrelated state-file redirect later in the same function.
    near_lines: 8

  - id: power-utility-elf-header-bricking
    desc: Corrupts Linux power utilities with an ELF marker
    crit: hostile
    conf: 0.98
    mbc: F0004
    all:
      - id: power-utility-overwrite
      - id: elfood-header-replacement-marker
    near_lines: 40
