# Removing both the second factor and the trusted-source restriction from the
# same FortiOS administrator weakens two independent authentication controls.
# Either command can be legitimate maintenance, so the hostile conclusion
# requires the pair in close proximity.
defaults:
  platforms: [fortios, appliance, unix]
  for: [scripts, binaries]
  attack: T1556.006

traits:
  - id: fortios-unset-admin-two-factor
    desc: Disables FortiOS administrator MFA
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?im)^\s*unset\s+two-factor\s*$'

composite_rules:
  - id: fortios-admin-auth-controls-removed
    desc: FortiOS administrator loses MFA and trusted-host restrictions
    crit: hostile
    conf: 0.99
    near_lines: 12
    all:
      - id: fortios-unset-admin-two-factor
      - id: objectives/impact/degrade/system/policy::fortios-admin-trusted-host-unset
