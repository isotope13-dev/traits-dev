defaults:
  for: [pe]
  platforms: [windows]
  attack: T1112
composite_rules:
  - id: explorer-policy-lockout
    desc: Locks Explorer recovery controls by policy
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/registry/explorer::explorer-policy-path
      - id: micro-behaviors/os/registry/explorer::no-folder-options
      - id: micro-behaviors/os/registry/keys::disable-registry-tools
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
      - id: micro-behaviors/os/registry/explorer::hide-file-ext-value
      - id: micro-behaviors/os/registry/explorer::hidden-files-value
