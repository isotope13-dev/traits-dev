defaults:
  for: [pe]
  platforms: [windows]
  attack: T1112
composite_rules:
  - id: explorer-policy-lockout
    desc: Locks Explorer recovery controls by policy
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/registry/explorer/reference::explorer-policy-path
      - id: micro-behaviors/os/registry/explorer/reference::no-folder-options
      - id: "micro-behaviors/os/registry/value-name::disable-registry-tools"
      - id: micro-behaviors/os/registry/value/write::registry-set-value-api
      - id: micro-behaviors/os/registry/explorer/reference::hide-file-ext-value
      - id: micro-behaviors/os/registry/explorer/reference::hidden-files-value
    unless:
      - id: objectives/evasion/file-hiding/system::tiny-return-pe-without-tls
