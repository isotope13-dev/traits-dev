# Rendered command rows are evidence of intent in a serialized script, not
# evidence that the registry was modified. Separate rows are not data-bound.
defaults:
  platforms: [windows]
  for: [html]
traits:
  - id: listing-taskmgr-disable-write
    desc: Listing writes Task Manager policy data
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)Write binary data to registry.{0,80}DisableTaskMgr</td>.{0,80}0400000001000000'
  - id: listing-registry-tools-disable-write
    desc: Listing writes Registry Tools policy data
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)Write binary data to registry.{0,80}DisableRegistryTools</td>.{0,80}0400000001000000'
  - id: listing-control-panel-disable-write
    desc: Listing writes Control Panel policy data
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)Write binary data to registry.{0,80}NoControlPanel</td>.{0,80}0400000001000000'
  - id: listing-run-disable-write
    desc: Listing writes Run policy data
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)Write binary data to registry.{0,80}NoRun</td>.{0,80}0400000001000000'
  - id: listing-system-exe-copy
    desc: Listing copies executable into Windows directory
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)Copy file.{0,120}C:\\WINDOWS\\.{1,80}\.exe'
  - id: listing-run-key-reference
    desc: Listing references Windows Run key
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)CurrentVersion\\Run\b'
  - id: listing-russian-recovery-payment
    desc: Listing contains recovery and payment request
    crit: notable
    conf: 0.93
    if:
      type: yara
      source: |
        rule listing_russian_recovery_payment {
          strings:
            $notice = "LegalNoticeText</td><td>" ascii nocase
            $restore = { E2 EE F1 F1 F2 E0 ED EE E2 }
            $send = { EF F0 E8 F8 EB E8 }
            $code = { EA EE E4 }
            $topup = { EF EE EF EE EB ED }
            $contact = "@" ascii
          condition:
            for any n in (1..#notice) : (
              $restore in (@notice[n]+!notice[n]..@notice[n]+!notice[n]+640) and
              $send in (@notice[n]+!notice[n]..@notice[n]+!notice[n]+640) and
              $code in (@notice[n]+!notice[n]..@notice[n]+!notice[n]+640) and
              $topup in (@notice[n]+!notice[n]..@notice[n]+!notice[n]+640) and
              $contact in (@notice[n]+!notice[n]..@notice[n]+!notice[n]+640)
            )
        }
composite_rules:
  - id: listing-tool-policy-lockout
    desc: Listing writes tool-disabling policy data
    crit: suspicious
    conf: 0.96
    all:
      - id: listing-taskmgr-disable-write
      - id: listing-registry-tools-disable-write
  - id: listing-shell-policy-lockout
    desc: Listing writes shell-restriction policy data
    crit: suspicious
    conf: 0.96
    all:
      - id: listing-control-panel-disable-write
      - id: listing-run-disable-write
  - id: listing-lockout-with-copy-and-run-reference
    desc: Listing combines lockout and startup references
    crit: hostile
    conf: 0.97
    all:
      - id: listing-tool-policy-lockout
      - id: listing-shell-policy-lockout
      - id: listing-system-exe-copy
      - id: listing-run-key-reference
      - id: listing-russian-recovery-payment
