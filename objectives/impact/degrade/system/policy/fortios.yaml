# A FortiOS administrator trusted-host entry is an IP allow-list that bounds
# where that account may log in from. Clearing it removes an access-control
# restriction, widening the account's reachable surface.
defaults:
  platforms: [fortios, appliance, unix]
  for: [scripts, binaries]
  attack: T1562.001

traits:
  - id: fortios-admin-trusted-host-unset
    desc: Removes FortiOS admin trusted-host limit
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?im)^\s*unset\s+trusthost([1-9]|10)\s*$'
