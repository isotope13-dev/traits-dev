defaults:
  platforms: [windows]
  for: [pe]
  attack: T1112,T1562.001

composite_rules:
  - id: administrative-tools-policy-lockout
    desc: PE modifies registry policies to disable system admin tools
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/registry/value/write::registry-set-value-api
    any:
      - id: micro-behaviors/os/registry/policy/reference::disable-taskmgr
      - id: micro-behaviors/os/registry/value-name::disable-registry-tools
      - id: micro-behaviors/os/registry/policy/reference::disable-cmd
      - id: micro-behaviors/os/registry/policy/reference::disable-change-password-value
      - id: micro-behaviors/os/registry/policy/reference::disable-lock-workstation-value
    needs: 3
