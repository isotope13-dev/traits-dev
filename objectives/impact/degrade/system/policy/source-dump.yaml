defaults:
  platforms: [windows]
  for: [html, text]
  attack: T1112

traits:
  - id: source-dump-disable-taskmgr
    for: [html, text, vbs]
    desc: Source dump disables TaskMgr
    crit: notable
    conf: 0.94
    if:
      type: text
      case_insensitive: true
      regex: '\bRegWrite\b.{0,160}[\\"]DisableTaskMgr"\s*,\s*("REG_DWORD"\s*,\s*)?"?1\b'

  - id: source-dump-no-dispcpl
    desc: Source mentions NoDispCPL policy
    crit: notable
    conf: 0.92
    if:
      type: text
      word: NoDispCPL

  - id: source-dump-no-control-panel
    desc: Source mentions NoControlPanel policy
    crit: notable
    conf: 0.93
    if:
      type: text
      word: NoControlPanel

  - id: source-dump-no-run
    desc: Source mentions NoRun policy
    crit: notable
    conf: 0.92
    if:
      type: text
      word: NoRun

  - id: source-dump-no-find
    desc: Source mentions NoFind policy
    crit: notable
    conf: 0.92
    if:
      type: text
      word: NoFind

  - id: source-dump-no-desktop
    desc: Source mentions NoDesktop policy
    crit: notable
    conf: 0.92
    if:
      type: text
      word: NoDesktop

  - id: source-dump-copy-system-exe
    desc: Source dump copies system exe
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)Copy file[\s\S]{0,180}C:\\\\WINDOWS\\\\[^<\r\n]{0,80}\.exe'

composite_rules:
  - id: source-dump-admin-tool-lockout
    desc: Source dump locks admin tools
    crit: suspicious
    conf: 0.96
    all:
      - id: source-dump-disable-taskmgr
      - id: "objectives/impact/degrade/windows-policy::regwrite-disable-registry-tools"
    any:
      - id: source-dump-no-dispcpl

  - id: source-dump-explorer-shell-lockout
    desc: Source mentions Explorer restrictions
    crit: suspicious
    conf: 0.96
    all:
      - id: source-dump-no-control-panel
      - id: source-dump-no-run
    any:
      - id: source-dump-no-find
      - id: source-dump-no-desktop

  - id: source-dump-runkey-persistence
    desc: Source dump Run persistence
    crit: suspicious
    conf: 0.95
    all:
      - id: source-dump-copy-system-exe
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"

  - id: source-dump-windows-policy-lockout
    desc: Source dump policy lockout
    crit: hostile
    conf: 0.98
    all:
      - id: source-dump-admin-tool-lockout
      - id: source-dump-explorer-shell-lockout
    any:
      - id: micro-behaviors/os/registry/policy/reference::systemrestore-disable-value-cooccurrence
      - id: source-dump-runkey-persistence

  - id: source-dump-policy-lockout-persistence
    desc: Source dump lockout persistence
    crit: hostile
    conf: 0.98
    all:
      - id: source-dump-admin-tool-lockout
      - id: source-dump-runkey-persistence
    any:
      - id: source-dump-explorer-shell-lockout
      - id: micro-behaviors/os/registry/policy/reference::systemrestore-disable-value-cooccurrence

  # A Run-key reference and tool-policy names alone do not establish attack.
  # Require enabling writes and an independently detected propagation path.
  - id: source-dump-taskmgr-runkey-lockout
    desc: Propagating code locks tools beside Run key
    crit: hostile
    conf: 0.96
    for: [html, text, 7z, zip, tar]
    all:
      - id: source-dump-disable-taskmgr
      - id: "objectives/impact/degrade/windows-policy::regwrite-disable-registry-tools"
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"

      - id: objectives/lateral-movement/usb-worm/drive-infector::autoit-removable-drive-spreader

  - id: source-dump-explorer-run-lockout
    desc: Source dump locks Explorer and Run
    crit: hostile
    conf: 0.95
    for: [html, text, 7z, zip, tar]
    all:
      - id: source-dump-no-control-panel
      - id: source-dump-no-run
      - id: source-dump-disable-taskmgr

  # Administrative lockdown can intentionally set both policies. Retain the
  # operation as suspicious; hostile lockout needs independent attack context.
  - id: source-dump-taskmgr-reg-lock
    desc: Source dump disables TaskMgr and regedit
    crit: suspicious
    conf: 0.95
    for: [html, text, vbs, 7z, zip, tar]
    all:
      - id: source-dump-disable-taskmgr
      - id: "objectives/impact/degrade/windows-policy::regwrite-disable-registry-tools"

  # WScript.Shell.CreateShortcut in a login helper is not a Run-key
  # launch. The Run path and the script host have to sit in the same
  # procedure. Match the text member: a tar scan flattens newlines, so the
  # same pair looks adjacent inside the archive container.
  - id: source-dump-wscript-runkey
    desc: Source dump runs WScript via Run
    crit: hostile
    conf: 0.95
    for: [text]
    near_lines: 30
    all:
    - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
    - id: well-known/lib/runtime/scripted/windows-script-host::wscript-shell-text
    unless:
    - id: metadata/file/format/structured::serialized-skill-documentation-catalog
