# Disabling the dump-filter chain and then hibernating is the executable shape
# of attacks that force an unencrypted hibernation image onto disk.  Either
# operation alone is compatible with administration; together they defeat the
# at-rest protection immediately before the sensitive image is written.
defaults:
  platforms: [windows]
  for: [scripts, pe, dll, c, cpp, csharp, python, javascript, java, go, rust]
  attack: T1562.001

composite_rules:
  - id: dump-filter-removal-before-hibernation
    desc: Removes dump encryption filters then hibernates
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/registry/write/property::crash-control-registry-path
      - id: micro-behaviors/os/registry/write/property::dump-filters-value-clear
    any:
      - id: micro-behaviors/os/event/shutdown::shutdown-hibernate-command
      - id: micro-behaviors/os/event/shutdown::rundll32-hibernate-command
      - id: micro-behaviors/os/event/shutdown::set-suspend-state-api
    needs: 1
    scope: file
