defaults:
  platforms: [windows]
  for: [batch]

composite_rules:
  # The extractor metric counts non-waiting START inside an unconditional
  # reachable backward GOTO cycle; executable targets corroborate impact.
  - id: batch-unconditional-start-process-exhaustion
    desc: Batch process exhaustion via START cycle
    crit: hostile
    conf: 0.97
    attack: T1499
    all:
      - id: micro-behaviors/data/control-flow/loop/unconditional::batch-unconditional-start-cycle
      - id: micro-behaviors/process/create/shell/command-mode::start-executable-command
