# Quiz-site flooders publish as tiny Selenium apps whose only stated job is
# to overwhelm a classroom game. The cover is the product name plus the
# flooder description; the browser driver is how the flood is delivered.
defaults:
  platforms: [unix, windows]
  for: [pyproject.toml]
  attack: T1499
  crit: notable
  conf: 0.94

traits:
  - id: kahoot-flooder-description
    desc: Package describes a Kahoot flooder
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)kahoot flooder'
  - id: flooder-console-script
    desc: Console script for a flooder package
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?m)^kapuut\s*='
  - id: selenium-runtime-dependency
    desc: Package depends on Selenium
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*"selenium["\s>=<]'

composite_rules:
  - id: quiz-flooder-selenium-manifest
    desc: Quiz-site flooder delivered with Selenium
    crit: hostile
    conf: 0.97
    all:
      - id: kahoot-flooder-description
      - id: flooder-console-script
      - id: selenium-runtime-dependency
  - id: quiz-flooder-named-cli
    desc: Named quiz-site flooder console script
    crit: hostile
    conf: 0.96
    all:
      - id: kahoot-flooder-description
      - id: flooder-console-script
  - id: quiz-flooder-browser-driver
    desc: Quiz-site flooder depends on a browser driver
    crit: hostile
    conf: 0.96
    all:
      - id: kahoot-flooder-description
      - id: selenium-runtime-dependency
