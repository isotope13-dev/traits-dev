defaults:
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: forkbomb
    desc: Fork bomb pattern
    crit: suspicious
    conf: 0.95
    attack: T1499
    for:
      - shell
    if:
      type: string_literal
      regex: ':\(\) \{\s*:\|:&\s*\\};:'
  - id: bluescreen
    desc: Windows BSOD trigger
    crit: suspicious
    conf: 0.95
    attack: T1499
    for:
      - python
      - pe
    if:
      type: text
      substr: RtlAdjustPrivilege(19, 1,
  - id: disk-fill-banner
    desc: Wait banner string
    crit: notable
    conf: 0.98
    attack: T1499
    for:
      - elf
    platforms:
      - linux
    if:
      type: text
      exact: wait....
  - id: disk-fill-target-file
    desc: Fixed myFile.txt filename
    crit: notable
    conf: 0.99
    attack: T1499
    for:
      - elf
    platforms:
      - linux
    if:
      type: text
      exact: myFile.txt
  - id: large-loop-bound-constant
    desc: Four-billion-byte loop-bound fragment
    crit: notable
    conf: 0.99
    attack: T1499
    for:
      - elf
    platforms:
      - linux
    if:
      type: hex
      pattern: "b8 ff 27 6b ee"
      section: ".text"
  - id: x64-large-count-byte-write-loop
    desc: Large counted loop writes a byte
    crit: notable
    conf: 0.99
    for: [elf]
    platforms: [linux]
    if:
      type: yara
      source: |
        rule x64_large_count_byte_write_loop {
          meta:
            filetypes = "elf"
          strings:
            $loop = { 48 89 45 ?? 48 c7 45 ?? 00 00 00 00 eb 15
                      48 8b 45 ?? 48 89 c6 bf ?? 00 00 00 e8 ?? ?? ?? ??
                      48 ff 45 ?? b8 ?? ?? ?? ?? 48 39 45 ?? 7e e0 }
          condition:
            for any i in (1..#loop) : (
              uint8(@loop[i]+3) == uint8(@loop[i]+17) and
              uint8(@loop[i]+7) == uint8(@loop[i]+34) and
              uint8(@loop[i]+7) == uint8(@loop[i]+43) and
              uint32(@loop[i]+36) >= 3000000000
            )
        }
  - id: profbomb-pkgname
    desc: Alpine package name profbomb
    crit: notable
    conf: 0.99
    attack: T1499
    for:
      - pkginfo
    size_min: 128
    size_max: 1024
    if:
      type: text
      substr: "pkgname = profbomb"
  - id: profbomb-origin
    desc: Alpine package origin profbomb
    crit: notable
    conf: 0.99
    attack: T1499
    for:
      - pkginfo
    size_min: 128
    size_max: 1024
    if:
      type: text
      substr: "origin = profbomb"
  - id: profbomb-pkgver
    desc: Alpine package version 4.5.1-r0
    crit: notable
    conf: 0.99
    attack: T1499
    for:
      - pkginfo
    size_min: 128
    size_max: 1024
    if:
      type: text
      substr: "pkgver = 4.5.1-r0"
  - id: profbomb-pkgdesc
    desc: Alpine package description profbomb
    crit: notable
    conf: 0.95
    attack: T1499
    for:
      - pkginfo
    size_min: 128
    size_max: 1024
    if:
      type: text
      substr: "pkgdesc = profbomb"
  - id: pkginfo-basename
    desc: Alpine package metadata filename
    crit: notable
    conf: 0.99
    for:
      - pkginfo
    if:
      type: path
      basename: true
      exact: .PKGINFO
  - id: profbomb-apk-basename
    desc: Profbomb APK package filename
    crit: notable
    conf: 0.99
    platforms:
      - linux
    for: [alpine_apk, tar]
    if:
      type: path
      basename: true
      exact: profbomb-4.5.1-r0.apk
  - id: profbomb-gzip-container-header
    desc: Profbomb gzip container header
    crit: notable
    conf: 0.99
    attack: T1499
    platforms:
      - linux
    for: [alpine_apk, tar]
    size_min: 3000
    size_max: 5000
    if:
      type: hex
      pattern: "1f 8b 08 00 00 09 6e 88"
      offset: 0
  # MOV AL,0ADh / OUT 64h,AL: sends Disable Keyboard to the 8042 controller.
  # No DOS application has a reason to lock the keyboard this way; rebooters
  # pulse the reset line (0FEh), they never park the controller disabled.
  - id: dos-kbd-controller-disable
    desc: DOS disables the keyboard controller
    crit: suspicious
    conf: 0.94
    attack: T1499
    platforms: [windows, unix]
    for: [dos_com, static-lib]
    if:
      type: hex
      pattern: "B0 AD E6 64"
  # With ES=0, loads another IVT entry (MOV AX,ES:[nn]; MOV BX,ES:[nn+2])
  # and stores it into the INT 09h slot at 0000:0024h. The keyboard IRQ
  # then lands in an unrelated handler that never reads port 60h or sends
  # EOI, so input dies. A real hook stores its own CS:offset and keeps the
  # old INT 09h vector, so the source is never 24h itself.
  # Vienna.DearUser copies this stub over the host and points INT 09h at
  # INT 04h; $stub decrypts its backward-SUB additive body in place.
  - id: dos-keyboard-vector-redirect-lockout
    desc: Points keyboard INT 09h at another vector
    crit: hostile
    conf: 0.95
    attack: T1499
    platforms: [windows, unix]
    for: [dos_com, data]
    size_max: 65536
    if:
      type: yara
      source: |
        rule dos_keyboard_vector_redirect_lockout {
          meta:
            filetypes = "dos_com,data"
          strings:
            $off = { 26 A1 ?? 00 26 8B 1E ?? 00 26 A3 24 00 }
            $seg = { 26 A1 ?? 00 26 8B 1E ?? 00 [0-8] 26 89 1E 26 00 }
            $stub = { B9 ?? 05 BF ?? ?? 8A 45 FF 8B DF 4B 28 07 E2 FB }
          condition:
            for any i in (1..#off) : (uint8(@off[i] + 2) != 0x24) or
            for any i in (1..#seg) : (uint8(@seg[i] + 2) != 0x24) or
            for any i in (1..#stub) : (
              @stub[i] + 19 + uint16(@stub[i] + 1) <= filesize and
              (((uint8(@stub[i] + 0x3EB) + 256 - uint8(@stub[i] + 18 + uint16(@stub[i] + 1))) & 0xFF) == 0x26) and
              (((uint8(@stub[i] + 0x3EC) + 256 - uint8(@stub[i] + 18 + uint16(@stub[i] + 1))) & 0xFF) == 0xA1) and
              (((uint8(@stub[i] + 0x3EE) + 256 - uint8(@stub[i] + 18 + uint16(@stub[i] + 1))) & 0xFF) == 0x00) and
              (((uint8(@stub[i] + 0x3EF) + 256 - uint8(@stub[i] + 18 + uint16(@stub[i] + 1))) & 0xFF) == 0x26) and
              (((uint8(@stub[i] + 0x3F0) + 256 - uint8(@stub[i] + 18 + uint16(@stub[i] + 1))) & 0xFF) == 0x8B) and
              (((uint8(@stub[i] + 0x3F1) + 256 - uint8(@stub[i] + 18 + uint16(@stub[i] + 1))) & 0xFF) == 0x1E) and
              (((uint8(@stub[i] + 0x3F4) + 256 - uint8(@stub[i] + 18 + uint16(@stub[i] + 1))) & 0xFF) == 0x26) and
              (((uint8(@stub[i] + 0x3F5) + 256 - uint8(@stub[i] + 18 + uint16(@stub[i] + 1))) & 0xFF) == 0xA3) and
              (((uint8(@stub[i] + 0x3F6) + 256 - uint8(@stub[i] + 18 + uint16(@stub[i] + 1))) & 0xFF) == 0x24) and
              (((uint8(@stub[i] + 0x3F7) + 256 - uint8(@stub[i] + 18 + uint16(@stub[i] + 1))) & 0xFF) == 0x00)
            )
        }
  # MOV AX,0003h / INT 10h: resets 80x25 color text mode, clearing the
  # screen. Ordinary alone; paired with the disable above it is the
  # payload's screen wipe.
  # AH=35h/25h on AL=10h saves the BIOS video vector and points it at
  # this image. The handler then adds 2 to teletype characters.
  - id: dos-int10-vector-replace
    desc: Saves then replaces the INT 10h vector
    crit: notable
    conf: 0.95
    attack: T1499
    platforms: [windows, unix]
    for: [dos_com, data]
    size_max: 65536
    if:
      type: hex
      pattern: "B8 10 35 CD 21 [0-16] B8 10 25 CD 21"
  - id: dos-teletype-inc-al
    desc: Adds two to teletype characters
    crit: notable
    conf: 0.94
    attack: T1499
    platforms: [windows, unix]
    for: [dos_com, data]
    size_max: 65536
    if:
      type: hex
      pattern: "80 FC 0E 74 ?? [0-24] FE C0 FE C0"
composite_rules:
  - id: disk-fill-logic-bomb
    desc: Local disk exhaustion logic bomb
    crit: hostile
    conf: 0.99
    attack: T1499
    for:
      - elf
    all:
      - id: disk-fill-banner
      - id: disk-fill-target-file
      - id: x64-large-count-byte-write-loop
      - id: micro-behaviors/fs/file/open/unspecified::fopen
      - id: micro-behaviors/fs/write/file/handle/unspecified::fputc
  - id: profbomb-alpine-package
    desc: Profbomb Alpine package identity
    crit: notable
    conf: 0.995
    attack: T1499
    for:
      - pkginfo
    all:
      - id: pkginfo-basename
      - id: profbomb-pkgname
      - id: profbomb-origin
      - id: profbomb-pkgver
    any:
      - id: profbomb-pkgdesc
  # Locks the console dead: keyboard controller disabled, then the text mode
  # reset wipes the screen before the payload message prints and the machine
  # hangs. Either leg alone is explainable; together they are the lockup.
  - id: dos-keyboard-video-lockup
    desc: DOS locks input and wipes the screen
    crit: hostile
    conf: 0.94
    attack: T1499
    platforms: [windows, unix]
    for: [dos_com, static-lib]
    all:
      - id: dos-kbd-controller-disable
      - id: micro-behaviors/os/console/io::dos-video-mode-reset
  - id: dos-resident-teletype-shift
    desc: Resident hook shifts teletype characters
    crit: hostile
    conf: 0.96
    attack: T1499
    platforms: [windows, unix]
    for: [dos_com, data]
    all:
      - id: dos-int10-vector-replace
      - id: dos-teletype-inc-al
      - id: micro-behaviors/os/msdos/interrupt::dos-tsr-keep-int27
  - id: dos-int10-teletype-mutator
    desc: INT 10h hook shifts printed characters
    crit: hostile
    conf: 0.95
    attack: T1499
    platforms: [windows, unix]
    for: [dos_com, data]
    all:
      - id: dos-int10-vector-replace
      - id: dos-teletype-inc-al
