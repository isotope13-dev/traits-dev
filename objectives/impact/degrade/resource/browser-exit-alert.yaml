defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  - id: browser-unload-alert-loop
    desc: Exit handler loops over blocking alerts
    crit: suspicious
    conf: 0.99
    if:
      type: text
      exclude_html_comments: true
      regex: 'onbeforeunload=["'']\s*for\([^;<>]{0,80}\)\s*\{\s*alert\('
  # The same loop-of-alerts exit trap written as a function body rather than an
  # inline attribute string. Kits assign window.onbeforeunload = function(){
  # for(...){ alert(...) } ... } so the alert loop is inside a block.
  - id: browser-unload-alert-loop-fn
    desc: Exit function loops over blocking alerts
    crit: suspicious
    conf: 0.98
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)onbeforeunload\s*=\s*function[\s\S]{0,30}for\s*\([^{}]{0,60}\)[\s\S]{0,40}alert\('
composite_rules:
  - id: browser-blocking-exit-alert-trap
    desc: Blocks browser exit with a loop of alerts
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/ui/window/event::browser-beforeunload-handler
    any:
      - id: browser-unload-alert-loop
      - id: browser-unload-alert-loop-fn
