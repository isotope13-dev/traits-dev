defaults:
  platforms: [windows, unix]
  for: [html]
traits:
  - id: markup-corrupted-popup-bomb
    desc: Markup-corrupted endless browser popup-bomb code
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)while\s*\(true\)<br>\s*\{<br>\s*window\.open\([^<]{1,160}<br>\s*[\w$]+\+\+<br>'
