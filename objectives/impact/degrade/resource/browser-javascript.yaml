defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1499

composite_rules:
  - id: browser-popup-timer-loop
    desc: Browser popup timer loop
    crit: hostile
    conf: 0.94
    near_bytes: 1024
    all:
      - id: micro-behaviors/ui/window/navigation::browser-window-open
      - id: micro-behaviors/ui/window/event::browser-contextmenu-handler
      - id: micro-behaviors/time/schedule/interval::setInterval
      - id: micro-behaviors/time/schedule/timeout::setTimeout
    unless:
      - id: well-known/lib/web/server/tina4ruby/

  - id: browser-moving-popup-lockup
    desc: Browser moving popup lockup
    crit: hostile
    conf: 0.96
    # A lockup drives open/move/focus/screen-reads from one tight timer
    # loop. Without proximity, any broad window-API wrapper library that
    # merely exposes those entry points (open here, moveTo there,
    # setTimeout far away) reads as an attack.
    near_bytes: 1024
    all:
      - id: micro-behaviors/ui/window/navigation::browser-window-open
      - id: micro-behaviors/ui/window/navigation::browser-window-move
      - id: micro-behaviors/ui/window/navigation::browser-window-focus
      - id: micro-behaviors/os/sysinfo/platform/browser::browser-screen-dimensions-read
      - id: micro-behaviors/time/schedule/timeout::setTimeout

  # Timer-driven focus theft: legitimate focus() answers a user gesture, it
  # does not fire from a repeating timer. A window reasserted on every tick
  # cannot be dismissed or moved away from, which is the lockup's grip even
  # without the moveTo leg above. The bound is the callback region, not a
  # neighborhood: in a minified bundle a notification click handler
  # (`e.onclick=()=>{window.focus(),e.close()}`) and an unrelated
  # session-polling setInterval sit under a kilobyte apart, which pooled a
  # dashboard bundle into this verdict. A steal puts the focus call inside
  # the timer callback -- a few statements, well under 256 bytes.
  - id: browser-interval-focus-steal
    desc: Browser steals focus on interval timer
    crit: hostile
    conf: 0.93
    near_bytes: 256
    all:
      - id: micro-behaviors/ui/window/navigation::browser-window-focus
      - id: micro-behaviors/time/schedule/interval::setInterval

  - id: browser-input-exit-trap
    desc: Browser global input and exit suppression trap
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/ui/window/event::browser-beforeunload-handler
      - id: micro-behaviors/ui/window/suppression::browser-window-contextmenu-suppression
      - id: micro-behaviors/ui/window/suppression::browser-window-keydown-suppression
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/bundler/vscode::vscode-extension-generated-asset
      - id: metadata/build/bundler/vscode::vscode-large-minified-extension-bundle

  - id: browser-reload-lockup-loop
    desc: Browser self-reload lockup loop
    crit: hostile
    conf: 0.95
    all:
      - id: unconditional-reload-loop
      - id: micro-behaviors/ui/window/event::browser-beforeunload-handler
      - id: micro-behaviors/ui/window/navigation::browser-location-reload
      - id: micro-behaviors/data/db/web-storage::dom-localstorage

  - id: extension-all-sites-looping-audio
    desc: Extension forces looping audio across sites
    crit: hostile
    conf: 0.96
    ref: sha256:b5ad7ae1aa9174ae0f9e922e426bca209538fe454cdd2bfd206188096741fd3a
    for: [javascript, chrome-manifest, crx, xpi, zip]
    scope: archive
    all:
      - id: metadata/permission/host::content-script-all-urls
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
      - id: micro-behaviors/ui/window/dom/audio::browser-audio-element-create
      - id: micro-behaviors/ui/window/dom/audio::browser-audio-loop-enabled
      - id: micro-behaviors/ui/window/dom/audio::browser-audio-play-call
    any:
      - id: micro-behaviors/ui/window/dom/audio::browser-audio-source-attribute
      - id: micro-behaviors/ui/window/dom/audio::browser-audio-source-property

traits:
  - id: unconditional-reload-loop
    desc: Reload call alone in endless while loop
    crit: suspicious
    conf: 0.96
    if:
      type: tree-sitter
      kind: loop
      regex: '^while\s*\(true\)\s*\{\s*(window\.)?location\.reload\(\);?\s*\}$'
