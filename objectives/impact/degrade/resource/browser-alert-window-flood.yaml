# Browser flood pranks: the page drives a timer that raises blocking modal
# alerts and reopens itself in child windows, so rendering it floods the
# browser until the process is killed. The timer and alert legs reuse the
# neutral scheduling and dialog atoms; the self-reopening call and the
# proximity-bound combination are what make the page a flood rather than an
# ordinary reminder timer or pop-up.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1499.004

traits:

composite_rules:
  - id: browser-alert-window-flood
    desc: Alert timer plus self-reopening windows flood browser
    crit: suspicious
    conf: 0.93
    near_bytes: 800
    all:
    - id: micro-behaviors/time/schedule/callback::markup-timer-call-text
    - id: micro-behaviors/ui/dialog/prompt::browser-window-alert-call
    - id: micro-behaviors/ui/window/navigation::browser-open-self-location
