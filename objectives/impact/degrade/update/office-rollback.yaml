# Direct Office rollback mechanics can remove a security patch or replace a
# patched executable without going through the supported update channel. Both
# have legitimate recovery uses, so they remain suspicious even in combination.
defaults:
  platforms: [windows]
  for: [powershell, batch, scripts]
  attack: T1562.001

traits:
  - id: office-release-patch-removal
    desc: Removes a Microsoft Office release patch
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)\bOarpmany(\.exe)?\b.{0,420}/removereleaseinpatch\b'

composite_rules:
  - id: office-installed-executable-copy
    desc: Copies over an installed Office executable
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/application/executable::installed-office-executable-path
    any:
      - id: micro-behaviors/fs/file/copy::powershell-copy-item-command
      - id: micro-behaviors/fs/file/copy::windows-copy-command
    near_lines: 3

  - id: office-update-rollback-multiple-methods
    desc: Combines two Office rollback methods
    crit: suspicious
    conf: 0.99
    all:
      - id: office-release-patch-removal
      - id: office-installed-executable-copy
