defaults:
  platforms: [windows]
  for: [batch]
  attack: T1562.001

composite_rules:
  - id: batch-sets-clock-and-deletes-files
    desc: Tiny batch sets system date, deletes files
    crit: hostile
    conf: 0.88
    size_max: 1024
    all:
      - id: micro-behaviors/os/sysinfo/command::batch-date-set-literal
      - id: micro-behaviors/fs/delete/file/command::batch-del-call
  - id: batch-backdates-clock-then-self-deletes
    desc: Backdated clock then batch self-delete
    crit: hostile
    conf: 0.9
    size_max: 1024
    all:
      - id: objectives/evasion/self-delete/scripts::batch-percent-zero-self-delete
    any:
      - id: micro-behaviors/os/sysinfo/command::batch-date-year-before-2010
      - id: micro-behaviors/os/sysinfo/command::batch-date-month-first-before-2010
