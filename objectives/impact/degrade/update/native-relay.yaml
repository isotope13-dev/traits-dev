# An ESET update relay becomes a security-update suppression mechanism when
# it combines signature-resource denial and manifest filtering with persistent
# installation, port-owner takeover, and repeated self-image mutation.
defaults:
  for: [pe]
  platforms: [windows]
  attack: T1562.001,T1547.001

composite_rules:
  - id: persistent-eset-update-suppression-relay
    desc: Persistent ESET relay suppresses signed updates and takes over its port
    crit: hostile
    conf: 0.97
    # The relay profile alone is an unsupported-resource behavior. Require
    # the same binary to mutate its image, kill the competing listener, and
    # persist at logon before treating its signature-resource denial and
    # manifest filtering as deliberate update suppression.
    all:
      - id: micro-behaviors/communications/proxy/relay::eset-manifest-filtering-relay-profile
      - id: micro-behaviors/fs/write/file/executable::self-hash-rotation-relaunch
      - id: micro-behaviors/process/terminate/kill::listener-port-owner-termination
      - id: micro-behaviors/os/registry/manipulate::run-key-file-operation-api-profile
