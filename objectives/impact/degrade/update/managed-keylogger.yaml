defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-keylogger-windows-update-disable-references
    desc: Keylogger with Update-stop and policy references
    crit: hostile
    conf: 0.97
    attack: T1489,T1112
    # Surveillance supplies admission; policy names or service maintenance
    # alone are ordinary administration. These are file-scoped references.
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: micro-behaviors/os/service/stop::dotnet-windows-update-stop-argument
      - id: micro-behaviors/os/registry/keys/policy::windows-update-policy-registry-path
      - id: micro-behaviors/os/registry/keys/policy::no-auto-update-policy-value
      - id: micro-behaviors/os/registry/access::dotnet-registrykey-setvalue-references
      - id: metadata/binary/symbols/name/token::dotnet-processstartinfo-name
