defaults:
  platforms: [windows]
  for: [pe]
  attack: T1562.001

traits:
  - id: nt-suspend-process-api
    desc: Source calls NtSuspendProcess
    crit: component
    conf: 0.92
    for: [c, cpp, csharp, go, rust, powershell, python]
    if:
      type: symbol
      kind: call
      exact: NtSuspendProcess

  - id: suspend-process-by-pid-api
    desc: Source calls SuspendProcessByPID
    crit: component
    conf: 0.92
    for: [c, cpp, csharp, go, rust, powershell, python]
    if:
      type: symbol
      kind: call
      exact: SuspendProcessByPID

  - id: suspend-thread-api
    desc: Source calls SuspendThread
    crit: component
    conf: 0.92
    for: [c, cpp, csharp, go, rust, powershell, python]
    if:
      type: symbol
      kind: call
      exact: SuspendThread

  - id: source-suspend-target-name
    desc: Process-control call names a protected process
    crit: component
    conf: 0.92
    for: [c, cpp, csharp, go, rust, powershell, python]
    if:
      type: symbol
      kind: call
      regex: 'GetProcessesByName$'
      arg:
        kind: string
        regex: '(?i)(MsMpEng|MsSense|SentinelAgent)'

  - id: source-suspend-edr-product
    desc: Process-control call names an EDR product
    crit: component
    conf: 0.92
    for: [c, cpp, csharp, go, rust, powershell, python]
    if:
      type: symbol
      kind: call
      regex: 'GetProcessesByName$'
      arg:
        kind: string
        regex: '(?i)(Sophos|CSFalcon|EDR)'

  - id: source-suspend-antimalware-name
    desc: Process-control call names antimalware software
    crit: component
    conf: 0.92
    for: [c, cpp, csharp, go, rust, powershell, python]
    if:
      type: symbol
      kind: call
      regex: 'GetProcessesByName$'
      arg:
        kind: string
        regex: '(?i)(antimalware|antivirus)'

  - id: suspend-cli-usage-banner
    desc: Suspend exe usage banner string
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'Usage:\s*\w+\.exe\s+<suspend\|resume>'

  - id: suspended-process-pid-msg
    desc: Suspended process PID status message
    crit: component
    conf: 0.95
    if:
      type: text
      substr: 'Suspended process PID:'

  - id: resumed-process-pid-msg
    desc: Resumed process PID status message
    crit: component
    conf: 0.95
    if:
      type: text
      substr: 'Resumed process PID:'

composite_rules:
  - id: source-process-suspend-api
    desc: Source calls a Windows process or thread suspension API
    crit: notable
    conf: 0.92
    for: [c, cpp, csharp, go, rust, powershell, python]
    any:
      - id: nt-suspend-process-api
      - id: suspend-process-by-pid-api
      - id: suspend-thread-api
    unless:
      - id: well-known/lib/development/sanitizer-runtime::sanitizer-runtime-source-path

  - id: nt-process-suspender-cli
    desc: NT process suspender CLI helper utility
    crit: suspicious
    conf: 0.92
    size_max: 4194304
    all:
      - id: micro-behaviors/process/control/signal::nt-suspend-resume-runtime
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-symbol
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity::pe-signature-verified

  - id: suspend-resume-cli-banner-utility
    desc: suspend resume CLI banner utility build
    crit: hostile
    conf: 0.97
    size_max: 4194304
    all:
      - id: micro-behaviors/process/control/signal::nt-suspend-resume-runtime
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-symbol
    any:
      - id: suspend-cli-usage-banner
      - id: suspended-process-pid-msg
      - id: resumed-process-pid-msg
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity::pe-signature-verified

  - id: suspender-cli-banner-set
    desc: Suspender CLI banner string set
    crit: suspicious
    conf: 0.95
    needs: 2
    any:
      - id: suspend-cli-usage-banner
      - id: suspended-process-pid-msg
      - id: resumed-process-pid-msg

  - id: driverless-edr-process-suspension
    desc: Suspends an EDR or antimalware process
    crit: hostile
    conf: 0.97
    for: [c, cpp, csharp, go, rust, powershell, python]
    all:
      - id: source-process-suspend-api
    any:
      - id: source-suspend-target-name
      - id: source-suspend-edr-product
      - id: source-suspend-antimalware-name
