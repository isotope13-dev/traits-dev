# Strip AV Run-key entries (Windows)
# Malware deletes AV autostart entries so security tooling no longer
# starts with the user session. Aggressive disable, not indicator removal.
# ATT&CK: T1562.001 (Impair Defenses: Disable or Modify Tools)
#
# Each name below is the *value name* a security product writes under
# HKLM/HKCU ...\Run, so one of them alone says nothing -- a kill list is only a
# kill list next to the delete that consumes it, which is why these stay
# components and the composite carries the reading. All four are anchored on
# word boundaries: unanchored `egui` matched `UsageGuidelinesUrl` in ordinary
# Microsoft PowerShell modules, and `avguard` / `MBAMService` are equally
# happy inside a longer identifier.
defaults:
  platforms: [windows]
  for: [powershell, batch]
  crit: component
  conf: 0.85
  attack: T1562.001
  mbc: F0004
traits:
- id: kaspersky-malwarebytes-runkey-name
  desc: Kaspersky or Malwarebytes autostart name
  if:
    type: text
    regex: (?i)\b(Malwarebytes\s*TrayApp|KasperskyLauncher)\b
- id: mcafee-mbam-runkey-name
  desc: McAfee or MBAM autostart value name
  if:
    type: text
    regex: (?i)\b(McAfeeSecurityUpdateCheck|MBAMService)\b
- id: avira-avast-runkey-name
  desc: Avira or Avast autostart value name
  if:
    type: text
    regex: (?i)\b(avguard|AvastUI)\b
- id: eset-runkey-name
  desc: ESET autostart value name
  if:
    type: text
    regex: (?i)\b(ESETSysInspector|egui)\b
composite_rules:
- id: av-run-key-strip
  desc: Strip AV entries from Run key
  crit: hostile
  conf: 0.96
  all:
  - id: av-runkey-name-list
  any:
  - id: micro-behaviors/os/registry/delete::remove-itemproperty-run-key
  - id: micro-behaviors/os/registry/delete::reg-delete-run-key
- id: av-runkey-name-list
  desc: AV product name in Run-key value list
  crit: component
  conf: 0.85
  any:
  - id: kaspersky-malwarebytes-runkey-name
  - id: mcafee-mbam-runkey-name
  - id: avira-avast-runkey-name
  - id: eset-runkey-name
