defaults:
  platforms: [windows]
  for: [batch]
  attack: T1562.001
composite_rules:
  - id: batch-stops-and-disables-symantec
    desc: Stops and disables Symantec alongside recovery-copy deletion
    crit: hostile
    conf: 0.98
    # Parsed batch command values have no line spans. Both exact service
    # operations and recovery deletion are required; no ordering is inferred.
    all:
      - id: micro-behaviors/os/service/stop::batch-symantec-service-stop
      - id: micro-behaviors/os/service/disable::batch-symantec-service-disabled
      - id: objectives/impact/ransom/recovery-inhibition::batch-vssadmin-delete-all-shadows
