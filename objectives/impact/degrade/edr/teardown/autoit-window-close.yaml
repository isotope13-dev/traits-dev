# Window-title teardown: AutoIt closes an antivirus window by title. The
# process-name and vendor-kill matchers in autoit-source.yaml do not cover
# WinClose or WinKill against a product window.
defaults:
  platforms: [windows]
  for: [text, data, vbs]
  attack: T1562.001

traits:
  - id: autoit-window-close-call
    desc: AutoIt closes a window by title
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bWin(Close|Kill)\s*\(\s*"'
  - id: autoit-antivirus-window-title
    desc: Window title names an antivirus product
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)"(Bkav|Kaspersky|Symantec|McAfee)'

composite_rules:
  - id: autoit-antivirus-window-close
    desc: AutoIt closes an antivirus product window
    crit: suspicious
    conf: 0.93
    all:
      - id: autoit-window-close-call
      - id: autoit-antivirus-window-title
