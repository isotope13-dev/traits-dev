# Require destructive AV actions plus repeated window targeting across vendors.
# A product's own uninstaller or a list of product names is insufficient.
defaults:
  platforms: [windows]
  for: [text, data, vbs]
  attack: T1562.001
traits:
  - id: autoit-multiple-antivirus-sabotage
    desc: AutoIt targets antivirus processes and files
    crit: suspicious
    conf: 0.99
    if:
      type: yara
      source: |
        rule autoit_multiple_antivirus_sabotage {
          strings:
            $close_avg = /ProcessClose[ \t]*\([ \t]*"avgcc\.exe"/ nocase
            $delete_avg = /DirRemove[ \t]*\([ \t]*@ProgramFilesDir[^\r\n]{1,30}\\Grisoft"[ \t]*,[ \t]*1/ nocase
            $close_avira = /ProcessClose[ \t]*\([ \t]*"avgnt\.exe"/ nocase
            $delete_avira = /DirRemove[ \t]*\([ \t]*@ProgramFilesDir[^\r\n]{1,30}\\Avira"[ \t]*,[ \t]*1/ nocase
            $kill_kaspersky = /WinKill[ \t]*\([ \t]*"Kaspersky"/ nocase
            $kill_symantec = /WinKill[ \t]*\([ \t]*"Symantec"/ nocase
            $kill_mcafee = /WinKill[ \t]*\([ \t]*"McAfee"/ nocase
          condition:
            all of them and
            @delete_avg > @close_avg and @delete_avg - @close_avg < 256 and
            @delete_avira > @close_avira and @delete_avira - @close_avira < 256
        }
composite_rules:
  - id: autoit-antivirus-sabotage-with-document-lures
    desc: Antivirus sabotage with document self-copy lures
    crit: hostile
    conf: 0.99
    all:
      - id: autoit-multiple-antivirus-sabotage
      - id: objectives/evasion/masquerade/file/double-ext::autoit-document-self-copy-lures
