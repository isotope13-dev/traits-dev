defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # RE: extract helper, enumerate installed AV process names, pass each name
  # to the hidden '-kill -paralyze' launch, then delete the helper. The native
  # helper's driver primitives remain neutral when it is examined alone.
  - id: managed-defender-process-killer-launch
    desc: Managed Defender disabler includes process-killer launch
    crit: hostile
    conf: 0.98
    attack: T1562.001
    all:
      - id: objectives/evasion/anti-av/platform/defender::defender-protection-disable-command-cluster
      - id: metadata/lang/source/syntax/argument::kill-paralyze-option-text
      - id: micro-behaviors/process/create/subprocess::dotnet-process-start-split-tokens
      - id: micro-behaviors/process/enumerate/managed::get-processes-by-name
