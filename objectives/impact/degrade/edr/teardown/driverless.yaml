# Driverless EDR killers disrupt telemetry or suspend protection from user
# mode.  The network-filter leg is deliberately based on WFP mechanics plus
# security-process targeting, not on a tool or driver name.
defaults:
  platforms: [windows]
  for: [binaries, source, scripts]
  attack: T1562.001,T1562.004

composite_rules:
  - id: driverless-edr-network-silencer
    desc: Blocks outbound traffic from named security-product processes
    crit: hostile
    conf: 0.98
    for: [c, cpp, csharp, go, rust, powershell, python, batch]
    all:
      - id: micro-behaviors/os/firewall/wfp::wfp-outbound-process-block-source
      - id: objectives/impact/degrade/edr/targeting::security-product-process-image
    near_lines: 120
