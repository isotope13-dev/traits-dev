# Safe Mode recovery sabotage staged from an unsigned packed module.
# Enumerating the SafeBoot registry hive while carrying service
# ImagePath/Type/Start registration markers is the setup for installing
# a service that survives cleanup attempts and for deleting the Safe
# Mode boot configurations that would allow manual removal.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: unsigned-packed-safeboot-service-staging
    desc: Unsigned packed module stages services against SafeBoot
    crit: hostile
    conf: 0.85
    all:
      - id: micro-behaviors/os/registry/keys/policy::safeboot-mode-key-path
      - id: micro-behaviors/os/service/host::service-imagepath-value-name
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/platform/wine/
