defaults:
  platforms: [linux]
  for: [c, cpp, elf]
  attack: T1562.001

traits:
  - id: killbpf-command-handler
    desc: BPF-monitoring teardown command keyword
    crit: notable
    conf: 0.99
    if:
      type: literal
      kind: string
      exact: killbpf

composite_rules:
  - id: trace-bpf-monitoring-teardown
    desc: Disables tracing and kills BPF monitors
    crit: hostile
    conf: 0.995
    all:
      - id: killbpf-command-handler
      - id: micro-behaviors/os/kernel/trace::tracing-on-control-file
      - id: micro-behaviors/os/kernel/trace::set-event-control-file
      - id: micro-behaviors/os/kernel/trace::current-tracer-control-file
      - id: micro-behaviors/os/bpf/program/maps::proc-bpf-map-descriptor
      - id: micro-behaviors/process/control/signal::c-kill-sigkill
