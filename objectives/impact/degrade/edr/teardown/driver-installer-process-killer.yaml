# An unsigned user-mode installer that embeds a second PE, registers it as a
# kernel driver service, loads it with ZwLoadDriver, and walks the process
# list to terminate security products by name. The driver gives the killer
# the kernel access that protected security processes deny to user mode.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1562.001,T1543.003,T1014
composite_rules:
  - id: unsigned-embedded-driver-installer-security-process-killer
    desc: Unsigned driver installer that kills security processes
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: micro-behaviors/os/service/create::create-service
      - id: micro-behaviors/os/kernel/module::zwload-driver-api-reference
      - id: micro-behaviors/process/enumerate/snapshot::security-product-process-api-profile
      - id: micro-behaviors/process/terminate/kill::toolhelp-termination-api-profile
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/
