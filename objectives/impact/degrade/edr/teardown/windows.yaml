defaults:
  platforms: [windows]
  for: [binaries, scripts, c, cpp]
  attack: T1562.001
traits:
- id: taskkill-security-health-ui-hex
  desc: Kills Windows Security UI
  crit: suspicious
  conf: 0.97
  for: [data, pe, batch, powershell, javascript]
  if:
    type: text
    regex: '(?i)7461736b6b696c6c202f46202f494d20.{0,160}5365634865616c746855492e657865'
- id: target-windefend-service
  desc: Targets WinDefend service
  crit: notable
  conf: 0.95
  for: [c, cpp]
  if:
    type: text
    word: WinDefend
- id: defender-signature-updates-key
  desc: "References Defender sig updates registry key"
  crit: notable
  conf: 0.97
  for: [c, cpp]
  if:
    type: text
    substr: SOFTWARE\\Microsoft\\Windows Defender\\Signature Updates
- id: defender-product-appdata-path
  desc: Reads Defender ProductAppDataPath value
  crit: notable
  conf: 0.96
  for: [c, cpp]
  if:
    type: text
    word: ProductAppDataPath
- id: defender-signature-location
  desc: Reads Defender SignatureLocation value
  crit: notable
  conf: 0.96
  for: [c, cpp]
  if:
    type: text
    word: SignatureLocation
- id: defender-backup-mpavbase-lkg
  desc: References Defender backup mpavbase.lkg
  crit: notable
  conf: 0.98
  for: [c, cpp]
  if:
    type: text
    substr: \\Backup\\mpavbase.lkg
- id: defender-backup-mpavbase-vdm
  desc: References Defender backup mpavbase.vdm
  crit: notable
  conf: 0.98
  for: [c, cpp]
  if:
    type: text
    substr: \\Backup\\mpavbase.vdm
- id: mrt-nt-directory-path
  desc: References Windows MRT binary path
  crit: notable
  conf: 0.98
  for: [c, cpp, csharp, go, rust, zig, python]
  if:
    type: text
    regex: '(?i)Windows[\\/]{1,4}System32[\\/]{1,4}MRT(\.exe)?\b'
- id: byovd-driver-handle
  desc: Opens Warsaw PM driver device
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: '(\\\\\.\\Warsaw_PM|\\\\\\\\\.\\\\Warsaw_PM)'
- id: byovd-driver-name
  desc: References vulnerable Topaz driver
  crit: suspicious
  conf: 0.9
  if:
    type: text
    substr: wsftprm.sys
  unless:
    - id: well-known/tool/detection/debian-security-tracker::security-tracker-cve-leaf
- id: byovd-helper-driver-name-1
  desc: References known vulnerable helper driver
  crit: suspicious
  conf: 0.96
  for: [binaries, scripts, c, cpp, csharp, go, rust, powershell]
  if:
    type: text
    regex: '(?i)\b(Core64|GoFlyDrv|HwOs2Ec)\.sys\b'
- id: byovd-helper-driver-name-2
  desc: References known vulnerable helper driver
  crit: suspicious
  conf: 0.96
  for: [binaries, scripts, c, cpp, csharp, go, rust, powershell]
  if:
    type: text
    regex: '(?i)\b(LnvMSRIO|MemoryInformer|NTIOLib_X64)\.sys\b'
- id: byovd-helper-driver-name-3
  desc: References known vulnerable helper driver
  crit: suspicious
  conf: 0.96
  for: [binaries, scripts, c, cpp, csharp, go, rust, powershell]
  if:
    type: text
    regex: '(?i)\b(ProcessMonitorDriver|selfprot)\.sys\b'
- id: byovd-helper-driver-name-4
  desc: References RentDrv2/ThreatFireMonitor image
  crit: suspicious
  conf: 0.96
  for: [binaries, scripts, c, cpp, csharp, go, rust, powershell]
  if:
    type: text
    regex: '(?i)\b(RentDrv2|ThreatFireMonitor)\.sys\b'
- id: byovd-helper-driver-name-5
  desc: References rwdrv/hlpdrv driver image
  crit: suspicious
  conf: 0.96
  for: [binaries, scripts, c, cpp, csharp, go, rust, powershell]
  if:
    type: text
    regex: '(?i)\b(rwdrv|hlpdrv)\.sys\b'
- id: byovd-helper-driver-name-6
  desc: References NSecKrnl/HexKiller image
  crit: suspicious
  conf: 0.96
  for: [binaries, scripts, c, cpp, csharp, go, rust, powershell]
  if:
    type: text
    regex: '(?i)\b(NSecKrnl|HexKiller)\.sys\b'
- id: byovd-driver-k7
  desc: Reference to K7 vulnerable driver
  crit: suspicious
  conf: 0.9
  if:
    type: text
    substr: K7RKScan_1516.sys
- id: byovd-driver-poisonx-name
  desc: Reference to PoisonX driver
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: (?i)\bPoisonX\d*\.sys\b
- id: byovd-driver-poisonx-handle
  desc: Reference to PoisonX device handle
  crit: suspicious
  conf: 0.95
  if:
    type: text
    substr: \\.\{F8284233-48F4-4680-ADDD-F8284233}
- id: byovd-poisonkiller
  desc: Reference to PoisonKiller EDR termination tool
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: (?i)\bPoisonKiller\.exe\b
- id: byovd-driver-dcrcv-name
  desc: References DCRCV vulnerable driver image
  crit: suspicious
  conf: 0.96
  for: [binaries, scripts, c, cpp, csharp, go, rust, powershell]
  if:
    type: text
    regex: '(?i)\bDCRCVDrv\.sys\b'
- id: byovd-driver-dcrcv-handle
  desc: Opens DCRCV vulnerable driver device
  crit: suspicious
  conf: 0.96
  for: [binaries, scripts, c, cpp, csharp, go, rust, powershell]
  if:
    type: text
    regex: '(?i)(\\\\\.\\DCRCVDRV_U|\\\\\\\\\.\\\\DCRCVDRV_U)\b'
- id: byovd-driver-dcrcv-service
  desc: DCRCV BYOVD kernel service name
  crit: suspicious
  conf: 0.95
  for: [binaries, scripts, c, cpp, csharp, go, rust, powershell]
  if:
    type: text
    regex: '(?i)\bNvStreamKmd_dcrcv\b'
- id: remoteadmin-edr-cleanup-task
  desc: RemoteAdmin EDR cleanup task
  crit: suspicious
  conf: 0.95
  if:
    type: text
    word: RemoteAdminEdrCleanup
- id: edr-cleanup-text
  desc: EDR cleanup text
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '(?i)\bEDR\s*cleanup\b'
- id: security-process-kill-marker
  desc: Explicit security-process termination message
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '(?i)\bKilling\s+(security|EAC)\s+processes\b'
# These vendor-name fragments only acquire cleanup meaning when paired
# with the SafeBoot path and cleanup-task evidence below.
- id: safeboot-edr-vendor--rx-1
  desc: Names CrowdStrike SentinelOne or Carbon Black
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\b(CrowdStrike|SentinelOne|Carbon\s*Black)\b'
- id: safeboot-edr-vendor--rx-2
  desc: Names Cylance Sophos or Malwarebytes
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\b(Cylance|Sophos|Malwarebytes)\b'
- id: safeboot-edr-vendor--rx-3
  desc: Names Bitdefender Kaspersky or ESET
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\b(Bitdefender|Kaspersky|ESET)\b'
- id: safeboot-edr-vendor--rx-4
  desc: Names Trend Micro, Cybereason or Cortex XDR
  crit: component
  conf: 0.9
  if:
    type: text
    # Palo Alto's product is 'Cortex XDR'; a bare 'Cortex' is the ARM core
    # family in every embedded/crypto library's build settings.
    regex: '\b(Trend\s*Micro|Cybereason|Cortex\s*XDR)\b'

- id: edr-killer-component-type
  desc: EDR-killer termination component
  crit: suspicious
  conf: 0.96
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)\b(EdrKiller|EnumProcessTerminatorLoop)\b'
    section: .rdata

composite_rules:
- id: defender-antispyware-policy-write
  desc: Writes Defender AntiSpyware disable policy
  crit: suspicious
  conf: 0.99
  for: [c, cpp, csharp, rust, go]
  all:
  - id: micro-behaviors/os/security/defender::defender-policy-registry-key
  - id: micro-behaviors/os/security/defender::defender-disable-antispyware-value
  - id: micro-behaviors/os/registry/access::registry-set-value-source
- id: injected-stage-defender-policy-disable
  desc: Process injector disables Microsoft Defender
  crit: hostile
  conf: 0.99
  for: [c, csharp]
  all:
  - id: defender-antispyware-policy-write
  - id: objectives/evasion/process/injection/thread-hijacking::source-thread-context-hijack
- id: hidden-security-health-ui-kill
  desc: Hidden Windows Security UI kill
  crit: hostile
  conf: 0.98
  for: [batch, javascript, powershell, data]
  all:
  - id: taskkill-security-health-ui-hex
  - id: metadata/lang/source/syntax/argument::encodedcommand-option-reference
  any:
  - id: micro-behaviors/os/security/defender::defender-exclusion-command
  - id: micro-behaviors/os/privilege/check::net-session-admin-check-hex
- id: hidden-reordered-security-ui-kill
  desc: Hidden kill of reordered Security UI
  crit: hostile
  conf: 0.97
  for: [batch, javascript, powershell, data]
  all:
  - id: objectives/impact/degrade/edr/security-ui::security-ui-hex-before-taskkill
  - id: metadata/lang/source/syntax/argument::encodedcommand-option-reference
  any:
  - id: micro-behaviors/os/security/defender::defender-exclusion-command
  - id: micro-behaviors/os/privilege/check::net-session-admin-check-hex
- id: byovd-indicators
  desc: Driver identity or termination-control clues
  crit: component
  any:
  - id: byovd-driver-handle
  - id: byovd-driver-name
  - id: byovd-helper-driver-name
  - id: byovd-driver-k7
  - id: byovd-driver-poisonx-name
  - id: byovd-driver-poisonx-handle
  - id: micro-behaviors/os/kernel/device::poisonx-compatible-ioctl-constant
  - id: byovd-poisonkiller
  - id: metadata/lang/source/literal::hex-22201c-token
  - id: byovd-driver-dcrcv-name
  - id: byovd-driver-dcrcv-handle
  - id: micro-behaviors/os/kernel/device::dcrcv-compatible-termination-ioctl
  - id: byovd-driver-dcrcv-service
  - id: micro-behaviors/os/kernel/device::ccprotect-alinubx-device-reference
  - id: metadata/lang/source/literal::hex-222024-token
  - id: micro-behaviors/os/kernel/device::ccprotect-device-termination-control
  - id: byovd-helper-driver-name-4
  - id: byovd-helper-driver-name-5
  - id: byovd-helper-driver-name-6
- id: byovd-helper-driver-name
  desc: Known vulnerable helper driver reference
  crit: suspicious
  conf: 0.96
  for: [binaries, scripts, c, cpp, csharp, go, rust, powershell]
  any:
  - id: byovd-helper-driver-name-1
  - id: byovd-helper-driver-name-2
  - id: byovd-helper-driver-name-3
  - id: byovd-helper-driver-name-4
  - id: byovd-helper-driver-name-5
  - id: byovd-helper-driver-name-6
- id: defender-definition-targeting
  desc: Targets Defender signature definition store
  crit: suspicious
  conf: 0.98
  for: [c, cpp]
  needs: 3
  any:
  - id: target-windefend-service
  - id: defender-signature-updates-key
  - id: defender-product-appdata-path
  - id: defender-signature-location
  - id: defender-backup-mpavbase-lkg
  - id: defender-backup-mpavbase-vdm
- id: defender-definition-lock-sabotage
  desc: Locks Defender definition files to block updates
  crit: hostile
  conf: 0.99
  for: [c, cpp]
  all:
  - id: defender-definition-targeting
  - id: micro-behaviors/fs/file/open::nt-create-file
  - id: micro-behaviors/fs/lock::exclusive-lockfileex
  any:
  - id: micro-behaviors/fs/watch::read-directory-changes-w
  - id: micro-behaviors/os/service/dispatch::notify-service-status-change
- id: mrt-update-lock-sabotage
  desc: Watches MRT updates then locks modified files
  crit: hostile
  conf: 0.98
  for: [c, cpp]
  all:
  - id: mrt-nt-directory-path
  - id: micro-behaviors/fs/watch::read-directory-changes-w
  - id: micro-behaviors/fs/file/open::nt-create-file
  - id: micro-behaviors/fs/lock::lock-file
- id: topaz-defender-kill-flow
  desc: Topaz driver kills Defender process
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/os/security/product::defender-engine-process-reference
  - id: byovd-driver-handle
  - id: metadata/lang/source/literal::hex-22201c-token
  - id: micro-behaviors/os/kernel/device::termination-compatible-device-control
  any:
  - id: micro-behaviors/process/enumerate/snapshot::toolhelp-enumeration-with-defender-reference
  - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
- id: dcrcv-byovd-edr-termination
  desc: DCRCV BYOVD driver terminates EDR processes
  crit: hostile
  conf: 0.99
  for: [binaries, scripts, c, cpp, csharp, go, rust, powershell]
  all:
  - id: byovd-driver-dcrcv-name
  - id: byovd-driver-dcrcv-handle
  - id: micro-behaviors/os/kernel/device::dcrcv-compatible-termination-ioctl
  - id: micro-behaviors/os/security/product::security-process-name-reference
  any:
  - id: micro-behaviors/fs/file/handle::device-io-control-win
  - id: micro-behaviors/fs/file/handle::device-io-control-api-reference
  - id: micro-behaviors/os/kernel/device::termination-compatible-device-control
- id: edr-killer-behavior
  desc: Security process names with termination-compatible driver controls
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/os/kernel/device::termination-compatible-device-control
  - id: byovd-indicators
  - id: micro-behaviors/os/security/product::security-process-name-reference
  unless:
  - id: well-known/tool/detection/debian-security-tracker::security-tracker-cve-list
  - id: well-known/tool/detection/debian-security-tracker::security-tracker-cve-leaf
- id: security-target-driver-termination-profile
  desc: Known termination IOCTL with security targets
  crit: hostile
  conf: 0.98
  for: [pe, c]
  all:
  - id: micro-behaviors/os/kernel/device::kernel-device-io-control
  - id: micro-behaviors/os/security/product::security-process-name-reference
  - id: micro-behaviors/os/kernel/device::termination-compatible-device-control
  - id: byovd-indicators
  any:
  - id: micro-behaviors/fs/path/system::driver-image-reference
  - id: micro-behaviors/os/kernel/driver::kernel-driver-service-type
  - id: byovd-helper-driver-name
  - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
  - id: micro-behaviors/process/enumerate/psapi::enum-processes
  - id: micro-behaviors/process/attach/rights::open-process
  - id: micro-behaviors/process/terminate/kill::terminate-process
  needs: 2
  unless:
  - id: well-known/app/system/iobit::iobit-signed-component-context
- id: nativeaot-edr-killer-driver-flow
  desc: NativeAOT EDR killer driver flow
  crit: hostile
  conf: 0.99
  for: [pe, dll]
  attack: T1562.001,T1562.002
  all:
  - id: edr-killer-component-type
  - id: micro-behaviors/process/enumerate/psapi::enum-processes
  - id: micro-behaviors/fs/file/handle::device-io-control-win
- id: security-process-and-service-teardown
  for: [pe]
  desc: Terminates security processes and disables their services
  crit: hostile
  conf: 0.99
  all:
  - id: security-process-kill-marker
  - id: micro-behaviors/os/service/stop::service-stopped-or-disabled-message
  - id: micro-behaviors/os/service/control::open-control-or-delete-api-set
- id: safeboot-edr-vendor
  desc: SafeBoot cleanup EDR vendor reference
  crit: component
  conf: 0.9
  any:
  - id: safeboot-edr-vendor--rx-1
  - id: safeboot-edr-vendor--rx-2
  - id: safeboot-edr-vendor--rx-3
  - id: safeboot-edr-vendor--rx-4
- id: safeboot-edr-cleanup-task
  desc: SafeBoot EDR cleanup task
  crit: suspicious
  conf: 0.95
  near_bytes: 256
  all:
  - id: micro-behaviors/os/registry/keys/policy::safeboot-mode-key-path
  - id: safeboot-edr-vendor
- id: safe-mode-edr-cleanup-task
  desc: Safe Mode EDR cleanup task
  crit: suspicious
  conf: 0.95
  any:
  - id: remoteadmin-edr-cleanup-task
  - id: edr-cleanup-text
  - id: safeboot-edr-cleanup-task
- id: safe-mode-edr-teardown
  desc: Safe Mode EDR teardown
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/os/kernel/boot::bcdedit-safeboot-minimal
  - id: safe-mode-edr-cleanup-task
  any:
  - id: micro-behaviors/os/security/product::edr-av-process-name-reference
  - id: micro-behaviors/os/security/product::sophos-edr-process-reference
  - id: micro-behaviors/os/security/product::falcon-service-process-reference
  - id: micro-behaviors/os/security/product::mcshield-pccntmon-image-reference
  - id: micro-behaviors/os/security/product::cylance-xagt-process-reference
  - id: micro-behaviors/os/security/product::tanium-bdagent-process-reference
- id: defender-driver-termination-ioctl-flow
  desc: Defender target with CcProtect driver controls
  crit: hostile
  conf: 0.97
  for: [pe, dll]
  all:
  - id: micro-behaviors/os/kernel/device::termination-compatible-device-control
  - id: micro-behaviors/os/kernel/device::ccprotect-device-termination-control
  - id: micro-behaviors/os/kernel/module::load-driver-api
  - id: micro-behaviors/os/security/product::defender-engine-process-reference
  - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
  - id: micro-behaviors/process/terminate/kill::terminate-process
