# Prefix-table pointer is bound to the conditional delete operation.
defaults:
  for:
  - dos_com
  platforms:
  - windows
  - unix
  size_max: 65536
traits:
- id: dos-xor-antivirus-prefix-delete
  desc: DOS deletes antivirus-named executables
  crit: hostile
  conf: 0.98
  if:
    type: yara
    source: |
      rule dos_xor_antivirus_prefix_delete {
        strings:
          $dec = { BB ?? ?? EB 08 EA 2E 80 37 ?? F9 43 FC E2 F7 }
          $av = "\x54\x42\x41\x56\x00\x53\x43\x41\x4e\x00\x4d\x53\x41\x56\x00\x43\x50\x41\x56\x00" xor(0-255)
          $delete = "\x8b\xd6\xb4\x41\x9c\x2e\xff\x1e" xor(0-255)
        condition:
          uint8(0) == 0xe9 and
          for any d in (1..#dec) : (
            ((3+uint16(1)) % 65536) <= @dec[d] and
            ((3+uint16(1)) % 65536)+32 >= @dec[d] and
            uint16(@dec[d]+1) == ((@dec[d]+15+256) % 65536) and
            ((uint16(@dec[d]-6) == 0xb966 and uint32(@dec[d]-4) > 0 and @dec[d]+15+uint32(@dec[d]-4) <= filesize+1) or
             (uint8(@dec[d]-3) == 0xb9 and uint16(@dec[d]-2) > 0 and @dec[d]+15+uint16(@dec[d]-2) <= filesize+1)) and
            @av >= @dec[d]+15 and @av+!av <= filesize and
            ((uint16(@dec[d]-6) == 0xb966 and @av+!av <= @dec[d]+15+uint32(@dec[d]-4)) or
             (uint8(@dec[d]-3) == 0xb9 and @av+!av <= @dec[d]+15+uint16(@dec[d]-2))) and
            (uint8(@av) ^ 84) == uint8(@dec[d]+9) and
            @delete >= @dec[d]+15 and @delete+!delete <= filesize and
            ((uint16(@dec[d]-6) == 0xb966 and @delete+!delete <= @dec[d]+15+uint32(@dec[d]-4)) or
             (uint8(@dec[d]-3) == 0xb9 and @delete+!delete <= @dec[d]+15+uint16(@dec[d]-2))) and
            (uint8(@delete) ^ 139) == uint8(@dec[d]+9) and
            @delete > @av and @delete-@av < 128 and
            (uint8(@delete-8) ^ uint8(@dec[d]+9)) == 0xbf and
            (uint8(@delete-5) ^ uint8(@dec[d]+9)) == 0xe8 and
            (uint8(@delete-2) ^ uint8(@dec[d]+9)) == 0x73 and
            ((3+uint16(1)) % 65536)+(uint16(@delete-7) ^ (uint8(@dec[d]+9)*257))-256 == @av-5
          )
      }
  attack: T1562.001
