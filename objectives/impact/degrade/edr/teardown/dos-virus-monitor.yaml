# Ralf Brown's Interrupt List: INT 16h, AX=FA01h, DX=5945h requests
# uninstall of PC Tools VSAFE/VWATCH. FA00h is only an installation query.
# https://files.mpoli.fi/unpacked/software/programm/general/inter49a.zip/interrup.c
defaults:
  platforms: [windows]
  for: [dos_com, data]
  size_max: 65536
  attack: T1562.001

traits:
  - id: dos-vsafe-uninstall-request
    desc: DOS requests VSAFE or VWATCH uninstall
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      pattern: "(B8 01 FA BA 45 59|BA 45 59 B8 01 FA) CD 16"

composite_rules:
  - id: dos-overwriter-uninstalls-virus-monitor
    desc: DOS file overwriter requests antivirus removal
    crit: hostile
    conf: 0.99
    all:
      - id: dos-vsafe-uninstall-request
      - id: objectives/impact/infect/binary/dos/overwrite::dos-search-truncate-self-image

