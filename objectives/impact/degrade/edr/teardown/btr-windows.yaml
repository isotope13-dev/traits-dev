# Abuse of Defender's signed Boot-Time Removal driver as a kernel file and
# registry primitive. The stable transaction/ADS artifacts are combined with
# manual native driver loading to distinguish weaponized staging from normal
# Defender remediation, which uses the Service Control Manager.
defaults:
  platforms: [windows]
  for: [binaries, scripts, c, cpp, csharp, powershell, batch, go, rust, python]
  attack: T1562.001

composite_rules:
  - id: btr-remediation-driver-manual-staging
    desc: Manually stages Defender BTR for kernel operations
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/app/security/defender::btr-changelist-stream-name
      - id: micro-behaviors/os/service/driver::boot-bus-extender-group
      - id: micro-behaviors/os/kernel/module::load-driver-api-reference
    any:
      - id: well-known/app/security/defender::btr-transaction-magic
      - id: well-known/app/security/defender::btr-transaction-magic-bytes
      - id: well-known/app/security/defender::btr-feedback-driver-stream
    needs: 1
    unless:
      - id: metadata/signed/platform::microsoft-windows

  - id: btr-defender-stack-removal
    desc: Uses a manually staged BTR driver transaction against Defender components
    crit: hostile
    conf: 0.99
    all:
      - id: btr-remediation-driver-manual-staging
      - id: well-known/app/security/defender::defender-critical-component-name
