# Generalized BYOVD coverage inspired by Elastic's GHOSTENGINE research.
# The matchers describe the attack flow, not a named vulnerable driver or
# campaign IOC, so new signed vulnerable drivers can still be surfaced.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, go, rust, powershell, python, batch]
  attack: T1562.001

traits:
  - id: multiple-driver-image-options
    desc: Multiple kernel-driver image options
    crit: suspicious
    conf: 0.94
    count_min: 2
    if:
      type: text
      regex: '(?i)\b[A-Za-z0-9_.-]{2,80}\.sys\b'
  - id: multiple-kernel-device-targets-short
    desc: Multiple kernel-device targets in source
    crit: suspicious
    conf: 0.93
    for: [c, cpp, csharp, go, rust, powershell, python]
    count_min: 2
    if:
      type: text
      regex: '(?i)L"\\\\\.\\[A-Za-z0-9_.{}-]{2,80}'

  - id: multiple-kernel-device-targets-escaped
    desc: Multiple escaped kernel-device targets in source
    crit: suspicious
    conf: 0.93
    for: [c, cpp, csharp, go, rust, powershell, python]
    count_min: 2
    if:
      type: text
      regex: '(?i)L"\\\\\\\\\.\\\\[A-Za-z0-9_.{}-]{2,80}'

composite_rules:
  - id: modular-byovd-defense-teardown
    desc: Modular vulnerable-driver fallback for defense impairment
    crit: hostile
    conf: 0.98
    all:
      - id: driver-backed-edr-control
      - id: multiple-driver-image-options

  - id: multiple-kernel-device-targets
    desc: Multiple kernel-device targets in source
    crit: suspicious
    conf: 0.93
    any:
      - id: multiple-kernel-device-targets-short
      - id: multiple-kernel-device-targets-escaped

  - id: driver-backed-edr-control
    desc: Uses a kernel-driver service and device-control channel against EDR targets
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/service/config::kernel-driver-service-registration
      - id: micro-behaviors/os/kernel/module::driver-image-reference
      - id: micro-behaviors/os/kernel/device::named-kernel-device-object
      - id: objectives/impact/degrade/edr/teardown::edr-target-indicators
    any:
      - id: micro-behaviors/fs/file/handle::device-io-control-win
      - id: micro-behaviors/fs/file/handle::device-io-control-api-reference

  - id: driver-backed-edr-process-termination
    desc: Enumerates and terminates EDR processes after opening a driver control channel
    crit: hostile
    conf: 0.98
    for: [c, cpp]
    all:
      - id: driver-backed-edr-control
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-source
      - id: micro-behaviors/process/terminate/kill::terminate-process-source

  - id: driver-backed-edr-binary-removal
    desc: Driver-backed EDR control with file deletion
    crit: hostile
    conf: 0.98
    near_bytes: 4096
    all:
      - id: driver-backed-edr-control
      - id: micro-behaviors/fs/file/delete::delete-win

  - id: driver-deployed-security-teardown
    desc: Deploys a kernel-driver image alongside endpoint-security tampering
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/service/config::kernel-driver-service-registration
      - id: micro-behaviors/os/kernel/module::driver-image-reference
      - id: objectives/impact/degrade/edr/teardown::edr-target-indicators
    any:
      - id: objectives/evasion/anti-av/platform/defender::defender-disable-realtime
      - id: objectives/evasion/anti-av/platform/defender::defender-disable-ioav
      - id: objectives/evasion/anti-av/platform/defender::defender-disable-script-scan

  - id: driver-device-trial-edr-teardown
    desc: Uses multiple kernel-device paths for EDR control
    crit: hostile
    conf: 0.98
    for: [c, cpp, csharp, go, rust, powershell, python]
    all:
      - id: multiple-kernel-device-targets
      - id: objectives/impact/degrade/edr/teardown::edr-target-indicators
    any:
      - id: micro-behaviors/fs/file/handle::device-io-control-win
      - id: micro-behaviors/fs/file/handle::device-io-control-api-reference
      - id: micro-behaviors/fs/file/open::createfile-api
