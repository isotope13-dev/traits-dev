defaults:
  platforms:
  - windows
  for:
  - scripts
  - binaries
  - c
  - cpp
  - powershell
  attack: T1562.001
traits:
- id: force-taskkill-cylancesvc
  desc: Taskkill /f targets CylanceSvc
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: \btaskkill(\.exe)?\s+/f\s+/im\s+"?CylanceSvc\.exe($|[\s"\x27])
    case_insensitive: true
