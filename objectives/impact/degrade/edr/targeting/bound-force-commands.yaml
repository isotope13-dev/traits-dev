- id: force-kill-pmd
  desc: Force-kill command targets pmd
  crit: suspicious
  conf: 0.97
  platforms:
  - unix
  for:
  - scripts
  - binaries
  - c
  - cpp
  if:
    type: text
    regex: \b(pkill|killall)\s+-(9|KILL)\s+(-f\s+)?["\x27]?pmd([\s"\x27;|&]|$)
    case_insensitive: true
