# Install-directory targeting: code that names where endpoint security lives on
# disk rather than which process it runs as. Deletion-oriented teardown kits
# need the paths, so these atoms are the target-list half of a "delete the
# defenders" routine.
defaults:
  platforms: [windows]
  for: [binaries, scripts, c, cpp, csharp, go, rust]
  attack: T1562.001

traits:
  # Prefer text over string-literal: batch quoted paths and C #define forms are
  # not always exposed as AST literals, but the path tokens are stable on disk.
  - id: defender-program-files-directory
    desc: Microsoft Defender program directory path
    crit: notable
    conf: 0.92
    for: [batch, scripts, c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)Program Files[\\/]{1,4}Windows Defender\b'

  - id: defender-programdata-directory
    desc: Microsoft Defender ProgramData directory path
    crit: notable
    conf: 0.92
    for: [batch, scripts, c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)ProgramData[\\/]{1,4}Microsoft[\\/]{1,4}Windows Defender\b'

  - id: defender-atp-directory
    desc: Defender for Endpoint install directory path
    crit: notable
    conf: 0.93
    for: [batch, scripts, c, cpp, csharp, go, rust]
    if:
      type: text
      regex: (?i)Windows Defender Advanced Threat Protection

  - id: defender-boot-driver-directory
    desc: Defender kernel driver directory path
    crit: notable
    conf: 0.9
    for: [batch, scripts, c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)System32[\\/]{1,4}drivers[\\/]{1,4}wd\b'

  - id: security-health-service-binary
    desc: Windows Security health service binary path
    crit: notable
    conf: 0.9
    for: [batch, scripts, c, cpp, csharp, go, rust]
    if:
      type: text
      regex: (?i)\bSecurityHealthService\.exe\b

  - id: smartscreen-module-file
    desc: Windows SmartScreen module filename
    crit: notable
    conf: 0.9
    for: [batch, scripts, c, cpp, csharp, go, rust]
    if:
      type: text
      regex: (?i)\bsmartscreen\.dll\b

  - id: batch-defender-target-list
    desc: Batch unlocker command targeting Defender
    crit: suspicious
    conf: 0.94
    for: [batch]
    if:
      type: text
      regex: '(?im)^[ \t]{0,8}IObitUnlocker\.exe[^\r\n]{0,160}Windows Defender'

composite_rules:
  - id: defender-install-path-targeting
    desc: Names multiple Defender install paths
    crit: suspicious
    conf: 0.94
    any:
      - id: defender-program-files-directory
      - id: defender-programdata-directory
      - id: defender-atp-directory
      - id: defender-boot-driver-directory
      - id: security-health-service-binary
      - id: smartscreen-module-file
    needs: 2

  - id: security-product-install-path
    desc: Endpoint-security install path target list
    crit: suspicious
    conf: 0.94
    any:
      - id: defender-install-path-targeting
      - id: batch-defender-target-list
