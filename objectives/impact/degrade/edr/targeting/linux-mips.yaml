defaults:
  platforms: [linux]
  for: [elf]
  arch: [mips]
  attack: T1562.001
  mbc: B0025

composite_rules:
  - id: mips-procfs-admin-tool-process-killer
    desc: MIPS process killer targets admin tools
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/control/signal::mips-o32-kill-syscall-le
      - id: micro-behaviors/fs/proc/info/pid::process-pid-exe-template
      - id: "micro-behaviors/process/debug/tool-markers::linux-network-admin-tool-name-cluster"

