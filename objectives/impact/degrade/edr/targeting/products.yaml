defaults:
  platforms:
    - unix
    - windows
  attack: T1562.001
traits:
  - id: terminate-keyword
    desc: terminate in process context
    crit: notable
    conf: 0.4
    for: [scripts, binaries]
    if:
      type: text
      regex: (?i)\b(terminate[_-]?(service|task))\b
      section: .text
    unless:
      - id: metadata/binary/resource/
composite_rules:
  - id: security-product-process-target
    desc: Named security-product process target
    crit: notable
    conf: 0.9
    for: [pe, dll]
    any:
      - id: micro-behaviors/os/security/product::bitdefender-service-host
      - id: micro-behaviors/os/security/product::qihoo-360-safe
      - id: micro-behaviors/process/info/name::defender-target-name-reference
      - id: micro-behaviors/process/info/name::kaspersky-target-name-reference
      - id: micro-behaviors/process/info/name::mcafee-target-name-reference
  - id: security-process-debug-inject
    desc: Debug-privilege injection into security processes
    crit: hostile
    conf: 0.96
    for: [pe, dll]
    mbc: B0005
    attack: T1562.001,T1055
    all:
      - id: security-product-process-target
      - id: micro-behaviors/os/privilege/token::high-risk-privilege-name
      - id: micro-behaviors/os/privilege/token::adjust-token-privileges-any
    any:
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/process/inject/runtime/call::nt-write-virtual-memory-name
      - id: objectives/evasion/process/injection/toolkit::poolparty-toolkit
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
    needs: 2
    unless:
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: metadata/binary/vendor::bitdefender-product-marker
      - id: well-known/app/system/iobit::advanced-systemcare-component-context
      - id: objectives/impact/degrade/edr/teardown::generic-byovd-edr-termination
  - id: termination-verbs
    desc: Process termination indicator
    crit: component
    conf: 0.5
    for: [scripts, binaries]
    any:
      - id: micro-behaviors/process/terminate/signal::kill
      - id: terminate-keyword
    unless:
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      - id: well-known/tool/development/agent/kilocode::kilo-code-native-runtime
      - id: well-known/tool/reverse-engineering/frida/
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-filebrowser-binary
  - id: batch-security-product-directory-destruction
    desc: Batch recursively deletes a security-product directory
    crit: hostile
    conf: 0.96
    for: [batch]
    all:
      - id: micro-behaviors/fs/delete/directory::windows-deltree-recursive
    any:
      - id: micro-behaviors/os/security/defender::defender-product-name-reference
      - id: micro-behaviors/os/security/product::malwarebytes-name
      - id: micro-behaviors/os/security/product::kaspersky-name
      - id: micro-behaviors/os/security/product::bitdefender-name
      - id: micro-behaviors/os/security/product::avast-product-reference
      - id: micro-behaviors/os/security/product::avast-path
      - id: micro-behaviors/os/security/product::norton-name
      - id: micro-behaviors/os/security/product::mcafee-name
      - id: micro-behaviors/os/security/product::sophos-name
      - id: micro-behaviors/os/security/product::eset-name
      - id: micro-behaviors/os/security/product::tencent-security
      - id: micro-behaviors/os/security/product::baidu-security
      - id: micro-behaviors/os/security/product::kingsoft-security
      - id: micro-behaviors/os/security/product::rising-av
      - id: micro-behaviors/os/security/product::huorong-security
  - id: kill-comp
    desc: EDR process termination
    crit: suspicious
    conf: 0.9
    for: [scripts, binaries]
    all:
      - id: terminate-keyword
      - id: micro-behaviors/os/security/product::edr-product-name
    downgrade:
      any:
        - id: metadata/binary/layout/size::massive-executable


  - id: multi-vendor-security-process-silencer
    desc: Multi-vendor security process network isolation
    crit: hostile
    conf: 0.98
    for: [scripts, binaries, c, cpp, powershell]
    attack: T1562.001,T1562.004
    all:
      - id: micro-behaviors/os/security/product::multi-vendor-security-process-images
      - id: micro-behaviors/os/firewall/wfp::wfp-outbound-process-block-source
  - id: edr-security-process-termination
    desc: Force-kills a security-product process
    crit: suspicious
    conf: 0.97
    for:
    - scripts
    - binaries
    - c
    - cpp
    - powershell
    all:
    - id: micro-behaviors/os/security/product::security-product-process-image
    any:
    - id: micro-behaviors/process/terminate/command::taskkill-force-image-name
    - id: micro-behaviors/process/terminate/kill::pkill-force
    - id: micro-behaviors/process/terminate/command::kill-force
    - id: micro-behaviors/process/terminate/command::killall-with-signal
    # The product image and the kill have to be the same action. A large
    # binary can name an EDR process in one place and force-kill an unrelated
    # process elsewhere.
    near_bytes: 2048
    unless:
    - id: micro-behaviors/metaprogramming/generation::configured-source-builder
  - id: stopper
    desc: EDR/Antivirus service stopper
    crit: suspicious
    conf: 0.95
    for: [pe, shell]
    all:
      - id: micro-behaviors/os/service/stop::stop-service-name-reference
    any:
      - id: micro-behaviors/os/security/defender::defender-product-name-reference
      - id: micro-behaviors/os/security/product::malwarebytes-name
      - id: micro-behaviors/os/security/product::kaspersky-name
      - id: micro-behaviors/os/security/product::bitdefender-name
      - id: micro-behaviors/os/security/product::avast-product-reference
      - id: micro-behaviors/os/security/product::avast-path
      - id: micro-behaviors/os/security/product::norton-name
      - id: micro-behaviors/os/security/product::mcafee-name
      - id: micro-behaviors/os/security/product::sophos-name
      - id: micro-behaviors/os/security/product::eset-name
    needs: 1
    near_bytes: 120
    unless:
      - id: micro-behaviors/process/create/shell/guard/
      - id: well-known/tool/detection/
      - id: well-known/app/ai/coding-agent/
  - id: bypass-detected
    desc: EDR/Antivirus bypass attempt
    crit: suspicious
    conf: 0.95
    mbc: F0004
    for: [scripts, binaries]
    any:
      - id: stopper
      - id: kill-comp
    all:
      - id: micro-behaviors/os/security/product::edr-product-name
    downgrade:
      any:
        - id: metadata/binary/vendor::is-microsoft-named
        - id: well-known/app/security/defender/
        - id: metadata/signed/platform/
        - id: metadata/binary/layout/size::massive-executable

  # Recursively deleting the product's own install directory.
  #
  # The sibling atom above stops at suspicious because a cleanup or uninstall
  # script legitimately removes a product folder. What separates this is the
  # count: a script that walks `%ProgramFiles%` deleting Inoculan, then the
  # antivirus folder, then McAfee, then F-Secure is not uninstalling the
  # product that shipped it -- it is removing whatever it finds, and the only
  # program that wants every vendor gone is the one arriving next.
  - id: batch-multi-vendor-security-directory-destruction
    desc: Batch deletes several security-product directories
    crit: hostile
    conf: 0.97
    for: [batch]
    all:
      - id: micro-behaviors/fs/delete/directory::windows-deltree-recursive
      - id: batch-security-product-directory-destruction
    needs: 2
    any:
      - id: micro-behaviors/os/security/defender::defender-product-name-reference
      - id: micro-behaviors/os/security/product::malwarebytes-name
      - id: micro-behaviors/os/security/product::kaspersky-name
      - id: micro-behaviors/os/security/product::bitdefender-name
      - id: micro-behaviors/os/security/product::avast-product-reference
      - id: micro-behaviors/os/security/product::avast-path
      - id: micro-behaviors/os/security/product::norton-name
      - id: micro-behaviors/os/security/product::mcafee-name
      - id: micro-behaviors/os/security/product::sophos-name
      - id: micro-behaviors/os/security/product::eset-name
      - id: micro-behaviors/os/security/product::antivirus-directory-path-reference
