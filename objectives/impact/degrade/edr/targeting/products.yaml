defaults:
  platforms:
    - unix
    - windows
  attack: T1562.001
traits:
  - id: terminate-keyword
    desc: terminate in process context
    crit: notable
    conf: 0.4
    for: [scripts, binaries]
    if:
      type: text
      regex: (?i)\b(terminate[_-]?(service|task))\b
      section: .text
    unless:
      - id: metadata/binary/resource/
  - id: avast-service-bin
    desc: Avast service reference (binaries)
    crit: notable
    conf: 0.7
    for: [scripts, binaries]
    if:
      type: text
      regex: (?i)avast(svc|ui|setup|\.exe)
    downgrade:
      any:
        - id: metadata/package/versioning/scheme::pe-version-resource
  - id: avast-service-other
    desc: Avast service reference (terms)
    crit: notable
    conf: 0.7
    for: [scripts, binaries]
    if:
      type: text
      regex: (?i)avast(antivirus|software|service)

  - id: edr-process-image-cylance
    desc: Cylance security process image
    crit: notable
    conf: 0.96
    for: [scripts, binaries, c, cpp, powershell]
    if:
      type: text
      regex: '(?i)\bCylanceSvc\.exe\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: edr-process-image-defender
    desc: Defender security process images
    crit: notable
    conf: 0.96
    for: [scripts, binaries, c, cpp, powershell]
    if:
      type: text
      regex: '(?i)\b(MsMpEng|NisSrv|WinDefend)\.exe\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: edr-process-image-crowdstrike
    desc: CrowdStrike security process images
    crit: notable
    conf: 0.96
    for: [scripts, binaries, c, cpp, powershell]
    if:
      type: text
      regex: '(?i)\b(CrowdStrike|Falcon|CSFalconService)\.exe\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: edr-process-image-sentinel
    desc: Sentinel security process images
    crit: notable
    conf: 0.96
    for: [scripts, binaries, c, cpp, powershell]
    if:
      type: text
      regex: '(?i)\b(SentinelAgent|SentinelOne|CarbonBlack)\.exe\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: edr-process-image-antivirus
    desc: Antivirus security process images
    crit: notable
    conf: 0.96
    for: [scripts, binaries, c, cpp, powershell]
    if:
      type: text
      regex: '(?i)\b(MBAMService|McShield|egui|ekrn)\.exe\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: edr-process-image-security
    desc: Security service process images
    crit: notable
    conf: 0.96
    for: [scripts, binaries, c, cpp, powershell]
    if:
      type: text
      regex: '(?i)\b(SecurityHealthService|SavService|avp)\.exe\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  # The generic ones, for the era before every product had a brand. A 1990s
  # batch virus deletes `progra~1\\Inocul~1` and `progra~1\\antivi~1` by
  # 8.3 name, and the vendor lists above -- Defender, Malwarebytes, Kaspersky
  # -- did not exist yet. The category name is what it had to go on, and it is
  # what the next one will use too when it does not know what is installed.
  - id: generic-antivirus-directory-name
    desc: Path names an antivirus directory
    crit: notable
    conf: 0.9
    for: [batch, scripts, pe]
    if:
      type: text
      regex: '(?i)[\\/](antivi[a-z~0-9]{0,6}|inocul[a-z~0-9]{0,6}|f-secure)[\\/]'

composite_rules:
  - id: avast-service
    desc: Avast service reference
    crit: notable
    conf: 0.7
    any:
      - id: avast-service-bin
      - id: avast-service-other
  - id: security-product-process-target
    desc: Named security-product process target
    crit: notable
    conf: 0.9
    for: [pe, dll]
    any:
      - id: micro-behaviors/os/security/product::bitdefender-service-host
      - id: objectives/impact/degrade/edr/targeting::qihoo-360-safe
      - id: objectives/impact/degrade/edr/targeting::windows-defender-target
      - id: objectives/impact/degrade/edr/targeting::kaspersky-target
      - id: objectives/impact/degrade/edr/targeting::mcafee-target
  - id: security-process-debug-inject
    desc: Debug-privilege injection into security processes
    crit: hostile
    conf: 0.96
    for: [pe, dll]
    mbc: B0005
    attack: T1562.001,T1055
    all:
      - id: security-product-process-target
      - id: micro-behaviors/os/privilege/token::high-risk-privilege-name
      - id: micro-behaviors/os/privilege/token::adjust-token-privileges-any
    any:
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/os/syscall/raw::nt-write-ssn
      - id: objectives/evasion/process/injection/toolkit::poolparty-toolkit
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
    needs: 2
    unless:
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: metadata/binary/vendor::bitdefender-product-marker
      - id: well-known/app/system/iobit::advanced-systemcare-component-context
  - id: termination-verbs
    desc: Process termination indicator
    crit: component
    conf: 0.5
    for: [scripts, binaries]
    any:
      - id: micro-behaviors/process/terminate/signal::kill
      - id: terminate-keyword
    unless:
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      - id: well-known/tool/development/agent/kilocode::kilo-code-native-runtime
      - id: well-known/tool/reverse-engineering/frida/
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-filebrowser-binary
  - id: batch-security-product-directory-destruction
    desc: Batch recursively deletes a security-product directory
    crit: suspicious
    conf: 0.96
    for: [batch]
    all:
      - id: micro-behaviors/fs/delete/directory::windows-deltree-recursive
    any:
      - id: micro-behaviors/os/security/defender::defender-product-name-reference
      - id: micro-behaviors/os/security/product::malwarebytes-name
      - id: micro-behaviors/os/security/product::kaspersky-name
      - id: micro-behaviors/os/security/product::bitdefender-name
      - id: avast-service
      - id: micro-behaviors/os/security/product::avast-path
      - id: micro-behaviors/os/security/product::norton-name
      - id: micro-behaviors/os/security/product::mcafee-name
      - id: micro-behaviors/os/security/product::sophos-name
      - id: micro-behaviors/os/security/product::eset-name
      - id: tencent-security
      - id: baidu-security
      - id: kingsoft-security
      - id: rising-av
      - id: huorong-security
  - id: kill-comp
    desc: EDR process termination
    crit: suspicious
    conf: 0.9
    for: [scripts, binaries]
    all:
      - id: terminate-keyword
      - id: micro-behaviors/os/security/product::edr-product-name
    downgrade:
      any:
        - id: metadata/binary/layout/size::massive-executable
  - id: security-product-process-image
    desc: Named security product process image
    crit: notable
    conf: 0.97
    for: [scripts, binaries, c, cpp, powershell]
    any:
      - id: edr-process-image-cylance
      - id: edr-process-image-defender
      - id: edr-process-image-crowdstrike
      - id: edr-process-image-sentinel
      - id: edr-process-image-antivirus
      - id: edr-process-image-security
  # One security product name can be an installer, diagnostic utility, or
  # compatibility check.  Process-image names from multiple vendors form a
  # target list instead: no single vendor's legitimate software needs to
  # enumerate Defender, McAfee/ESET, and Kaspersky/Sophos executables.
  - id: multi-vendor-security-process-images
    desc: Names multiple vendors' security processes
    crit: notable
    conf: 0.98
    for: [scripts, binaries, c, cpp, powershell]
    any:
      - id: edr-process-image-cylance
      - id: edr-process-image-defender
      - id: edr-process-image-crowdstrike
      - id: edr-process-image-sentinel
      - id: edr-process-image-antivirus
      - id: edr-process-image-security
    needs: 2
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: multi-vendor-security-process-killer
    desc: Enumerates and terminates security-vendor processes
    crit: hostile
    conf: 0.99
    for: [pe, dll]
    attack: T1562.001,T1057
    all:
      - id: multi-vendor-security-process-images
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
    any:
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: micro-behaviors/process/terminate/kill::terminate-process-name-text
    needs: 1
  - id: edr-security-process-termination
    desc: Force-kills a security-product process
    crit: suspicious
    conf: 0.97
    for: [scripts, binaries, c, cpp, powershell]
    all:
      - id: security-product-process-image
    any:
      - id: micro-behaviors/process/terminate/command::taskkill-force-image-name
  - id: stopper
    desc: EDR/Antivirus service stopper
    crit: suspicious
    conf: 0.95
    for: [pe, shell]
    all:
      - id: micro-behaviors/os/service/stop::stop-service-name-reference
    any:
      - id: micro-behaviors/os/security/defender::defender-product-name-reference
      - id: micro-behaviors/os/security/product::malwarebytes-name
      - id: micro-behaviors/os/security/product::kaspersky-name
      - id: micro-behaviors/os/security/product::bitdefender-name
      - id: avast-service
      - id: micro-behaviors/os/security/product::avast-path
      - id: micro-behaviors/os/security/product::norton-name
      - id: micro-behaviors/os/security/product::mcafee-name
      - id: micro-behaviors/os/security/product::sophos-name
      - id: micro-behaviors/os/security/product::eset-name
    needs: 1
    near_bytes: 120
    unless:
      - id: micro-behaviors/process/create/shell/guard/
      - id: well-known/tool/detection/
      - id: well-known/app/ai/coding-agent/
  - id: bypass-detected
    desc: EDR/Antivirus bypass attempt
    crit: suspicious
    conf: 0.95
    mbc: F0004
    for: [scripts, binaries]
    any:
      - id: stopper
      - id: kill-comp
    all:
      - id: micro-behaviors/os/security/product::edr-product-name
    downgrade:
      any:
        - id: metadata/binary/vendor::is-microsoft-named
        - id: well-known/app/security/defender/
        - id: metadata/signed/platform/
        - id: metadata/binary/layout/size::massive-executable

  # Recursively deleting the product's own install directory.
  #
  # The sibling atom above stops at suspicious because a cleanup or uninstall
  # script legitimately removes a product folder. What separates this is the
  # count: a script that walks `%ProgramFiles%` deleting Inoculan, then the
  # antivirus folder, then McAfee, then F-Secure is not uninstalling the
  # product that shipped it -- it is removing whatever it finds, and the only
  # program that wants every vendor gone is the one arriving next.
  - id: batch-multi-vendor-security-directory-destruction
    desc: Batch deletes several security-product directories
    crit: hostile
    conf: 0.97
    for: [batch]
    all:
      - id: micro-behaviors/fs/delete/directory::windows-deltree-recursive
      - id: batch-security-product-directory-destruction
    needs: 2
    any:
      - id: micro-behaviors/os/security/defender::defender-product-name-reference
      - id: micro-behaviors/os/security/product::malwarebytes-name
      - id: micro-behaviors/os/security/product::kaspersky-name
      - id: micro-behaviors/os/security/product::bitdefender-name
      - id: avast-service
      - id: micro-behaviors/os/security/product::avast-path
      - id: micro-behaviors/os/security/product::norton-name
      - id: micro-behaviors/os/security/product::mcafee-name
      - id: micro-behaviors/os/security/product::sophos-name
      - id: micro-behaviors/os/security/product::eset-name
      - id: generic-antivirus-directory-name
