defaults:
  platforms:
    - windows
  for:
    - pe
  attack: T1562.001
composite_rules:
  - id: av-product-killer
    desc: AV names with external-process kill APIs
    crit: hostile
    conf: 0.95
    mbc: B0005
    all:
      # CRT TerminateProcess(GetCurrentProcess()) is not an AV kill.
      - id: micro-behaviors/process/attach/rights::open-process
      - id: micro-behaviors/process/terminate/
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
      # A single vendor's product names with supervision APIs is inventory,
      # not a kill list: every process supervisor enumerates processes, and
      # audit tools name the products they check. The multi-vendor atom is
      # the kill-list-shaped evidence (see multi-vendor-security-process-killer).
      - id: micro-behaviors/os/security/product::multi-vendor-security-process-images
    downgrade:
      any:
      - id: metadata/signed/platform/
    unless:
      - id: well-known/app/utility/siw::siw-family-identity
      - id: well-known/tool/development/agent/openai-codex/
      # Genuine Microsoft-signed Edge inventories security products itself.
      - id: well-known/app/browser/microsoft-edge::edge-runtime-binary-context
