defaults:
  platforms: [windows]
  for: [pe]
  attack: T1562.001

composite_rules:
  - id: indian-av-scheduled-task-and-service-purge
    desc: Purges Indian AV tasks and service hooks
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/security/product::security-product-image-quick-heal-seqrite
      - id: micro-behaviors/os/autorun/control::schtasks-delete-task-command
      - id: micro-behaviors/os/privilege/token::high-risk-privilege-name
      - id: micro-behaviors/os/service/create::create-service-w-reference

  - id: indian-av-physical-disk-teardown
    desc: Indian AV teardown with raw disk access
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/security/product::security-product-image-quick-heal-seqrite
      - id: micro-behaviors/fs/path/device/storage::windows-physicaldrive-path
      - id: micro-behaviors/os/privilege/token::high-risk-privilege-name
      - id: micro-behaviors/os/autorun/control::schtasks-delete-task-command
