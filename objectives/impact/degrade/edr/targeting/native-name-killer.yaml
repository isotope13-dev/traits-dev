defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
  attack: T1562.001

traits:
  # Bind a security-product name argument to the helper that compares
  # PROCESSENTRY32 names and opens/terminates the selected process. Merely
  # mentioning AV names beside worm paths does not establish this behavior.
  - id: x86-security-process-termination-code
    desc: Terminates named security-product processes
    crit: suspicious
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule x86_security_name_termination_call {
          strings:
            $target = /(KSafeTray|KSWebShield|kislive)\.exe\x00/ nocase
            $call = { 68 ?? ?? ?? ?? E8 ?? ?? ?? ?? C7 04 24 ?? ?? ?? ?? E8 ?? ?? ?? ?? }
            $helper = {
              55 8B EC 81 EC ?? ?? 00 00 56 6A 00 6A 02 E8 ?? ?? ?? ??
              [20-32] E8 ?? ?? ?? ?? 85 C0 0F 84 ?? ?? ?? ??
              8B 75 08 8D 85 ?? ?? ?? ?? 8A 10 8A CA 3A 16
              [80-120]
              6A 00 FF B5 ?? ?? FF FF 6A 00 68 FF 0F 1F 00
              FF 15 ?? ?? ?? ?? 50 FF 15 ?? ?? ?? ??
            }
          condition:
            pe.machine == pe.MACHINE_I386 and
            pe.imports("KERNEL32.dll", "CreateToolhelp32Snapshot") and
            pe.imports("KERNEL32.dll", "Process32First") and
            pe.imports("KERNEL32.dll", "Process32Next") and
            for any s in (0..pe.number_of_sections-1) : (
              (pe.sections[s].name == ".text" or pe.sections[s].name == ".data") and
              for any h in (1..#helper) : (
                @helper[h] >= pe.sections[s].raw_data_offset and
                @helper[h]+!helper[h] <= pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size and
                for any i in (0..pe.number_of_imports-1) : (
                  for any f in (0..pe.import_details[i].number_of_functions-1) : (
                    pe.import_details[i].functions[f].name == "OpenProcess" and
                    pe.import_details[i].functions[f].rva + pe.image_base == uint32(@helper[h]+!helper[h]-11)
                  )
                ) and
                for any i in (0..pe.number_of_imports-1) : (
                  for any f in (0..pe.import_details[i].number_of_functions-1) : (
                    pe.import_details[i].functions[f].name == "TerminateProcess" and
                    pe.import_details[i].functions[f].rva + pe.image_base == uint32(@helper[h]+!helper[h]-4)
                  )
                ) and
                for any c in (1..#call) : (
                  @call[c] >= pe.sections[s].raw_data_offset and
                  @call[c]+!call[c] <= pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size and
                  pe.rva_to_offset(pe.sections[s].virtual_address + @call[c] - pe.sections[s].raw_data_offset + 10 + int32(@call[c]+6)) == @helper[h] and
                  for any t in (1..#target) : (
                    pe.rva_to_offset(uint32(@call[c]+1)-pe.image_base) == @target[t]
                  )
                )
              )
            )
        }

composite_rules:
  - id: socket-tasking-security-process-killer
    desc: Socket tasking alongside AV process termination
    crit: hostile
    conf: 0.99
    all:
      - id: x86-security-process-termination-code
      - id: micro-behaviors/communications/socket/receive::x86-recv-buffer-task-dispatch
