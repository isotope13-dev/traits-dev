defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

composite_rules:
  - id: socket-tasking-security-process-killer
    desc: Socket-tasked bot with AV termination code
    crit: hostile
    conf: 0.99
    attack: T1562.001
    all:
      - id: micro-behaviors/process/terminate/kill::x86-security-name-termination-call
      - id: micro-behaviors/communications/socket/receive::x86-recv-buffer-task-dispatch
      - id: micro-behaviors/os/event/shutdown::x86-forced-reboot-command-call
