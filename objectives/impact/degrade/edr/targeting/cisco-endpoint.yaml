# The image operand is bound to taskkill's /im option. Do not classify sfc.exe
# as an endpoint agent: stopping the Windows file checker has other uses.
# Quoted/comma-separated tokens also cover argv arrays in source programs.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1562.001

traits:
  - id: taskkill-cisco-secure-endpoint
    desc: Taskkill command targets Cisco endpoint agent
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '\btaskkill(\.exe)?[ "''\t,][^\r\n;&|]{0,48}/im[ "''\t,]+cscm\.exe($|[\s"'',])'
      case_insensitive: true
