defaults:
  platforms: [windows, unix, android]
  attack: T1562.001
  for: [pe, elf]
composite_rules:
- id: chinese-av-kill
  desc: Chinese AV process termination
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/os/security/product::chinese-av-product-extended
  - id: objectives/impact/degrade/edr/targeting::termination-verbs
  downgrade:
    any:
    - id: metadata/binary/layout/size::massive-executable
- id: msi-embedded-security-process-targeting
  desc: MSI enumerates security-product processes with privileged execution
  crit: hostile
  conf: 0.98
  attack: T1518.001,T1057,T1548.002
  for: [oledoc, pe]
  scope: archive
  platforms: [windows]
  all:
  - id: micro-behaviors/os/security/product::msi-embedded-security-process-set
  - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/os/privilege/token::adjust-token-privileges
  - id: metadata/document/ole::ole-high-entropy
