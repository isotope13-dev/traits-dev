defaults:
  platforms: [windows, unix, android]
  attack: T1562.001
  for: [pe, elf]
composite_rules:
- id: chinese-av-kill
  desc: Chinese AV process termination
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/os/security/product::chinese-av-product-extended
  - id: objectives/impact/degrade/edr/targeting::termination-verbs
  downgrade:
    any:
    - id: metadata/binary/layout/size::massive-executable
- id: chinese-av-native-process-kill-loop
  desc: Chinese AV marker with Toolhelp kill loop
  crit: hostile
  conf: 0.96
  for: [pe, dll]
  attack: T1562.001,T1057
  all:
  - id: micro-behaviors/process/terminate/kill::toolhelp-kill-loop-source
  - id: micro-behaviors/os/security/product::chinese-av-product-extended
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/sysadmin/
# File-force-killer style images name Qihoo processes, call
# ZwTerminateProcess or NtTerminateProcess, and reference the hosts file
# they sinkhole. A signed Qihoo binary is the product itself.
- id: kernel-qihoo-hosts-termination
  desc: Kernel terminate of Qihoo with hosts path
  crit: hostile
  conf: 0.96
  for: [pe, dll]
  all:
  - id: micro-behaviors/os/security/product::qihoo-360-safe
  - id: micro-behaviors/process/terminate/kill::native-terminate-process-reference
  - id: micro-behaviors/fs/path/config/system::hosts-file-path
  unless:
  - id: metadata/signed/certificate/subject::qihoo-360-authenticode-signer
  - id: metadata/signed/platform/
- id: msi-embedded-security-process-targeting
  desc: MSI enumerates security-product processes with privileged execution
  crit: hostile
  conf: 0.98
  attack: T1518.001,T1057,T1548.002
  for: [oledoc, pe]
  scope: archive
  platforms: [windows]
  all:
  - id: micro-behaviors/os/security/product::msi-embedded-security-process-set
  - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/os/privilege/token::adjust-token-privileges
  - id: metadata/document/ole::ole-high-entropy
