# Endpoint-agent callback suppression through Windows Filtering Platform.
# WFP filtering is a neutral capability on its own. The composites below
# require an endpoint-product target, making the emitted finding about the
# attack technique rather than about ordinary firewall administration.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1562.004,T1562.001

composite_rules:
  - id: wfp-edr-callback-suppression
    desc: WFP blocks outbound endpoint-agent callbacks
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/degrade/edr/targeting::security-product-process-image
      - id: objectives/impact/degrade/edr/targeting::edr-security-process-termination
    any:
      - id: micro-behaviors/os/firewall/wfp::wfp-outbound-process-block-source

  - id: wfp-qos-edr-callback-suppression
    desc: WFP and QoS policy suppress endpoint callbacks
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/degrade/edr/targeting::security-product-process-image
      - id: micro-behaviors/os/network/qos::msft-netqos-policy-query
    any:
      - id: micro-behaviors/os/firewall/wfp::wfp-outbound-process-block-source
