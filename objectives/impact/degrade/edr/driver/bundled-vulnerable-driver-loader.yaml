# An application that ships a known vulnerable kernel driver and registers it
# as a kernel service has bring-your-own-vulnerable-driver loader behavior.
# The driver identity alone is a suspicious reference; the service-creation
# import establishes that the program installs the driver itself.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1068,T1543.003

composite_rules:
  - id: bundled-vulnerable-driver-service-loader
    desc: Installs a bundled vulnerable AMI driver as a service
    crit: hostile
    conf: 0.9
    all:
      - id: objectives/impact/degrade/edr/teardown::byovd-driver-amifldrv-name
      - id: micro-behaviors/os/service/create::create-service-a-import
