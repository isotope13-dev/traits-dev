# OPSWAT AppRemover ardrv.sys abused as BYOVD process-kill (CVE-2026-36425).
# Match the driver image name and terminate IOCTL, not English product names.
defaults:
  platforms: [windows]
  for: [c, cpp, python, go, csharp, batch, pe, dll]
  attack: T1562.001,T1068
  mbc: B0040

traits:
  - id: ardrv-sys-image
    desc: OPSWAT AppRemover ardrv.sys image
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bardrv\.sys\b'

  - id: appremover-terminate-ioctl
    desc: AppRemover process-terminate IOCTL
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b0x0*2420031\b'

composite_rules:
  - id: appremover-ardrv-terminate-ioctl
    desc: AppRemover ardrv terminate IOCTL pair
    crit: hostile
    conf: 0.98
    near_bytes: 2048
    all:
      - id: ardrv-sys-image
      - id: appremover-terminate-ioctl
