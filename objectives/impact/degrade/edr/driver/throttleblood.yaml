# The signed ThrottleStop driver is also used legitimately for CPU control.
# A filename plus a generic device API alone does not prove process killing.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: throttlestop-driver-reference
    desc: ThrottleBlood image or ThrottleStop device reference
    crit: notable
    any:
      - id: micro-behaviors/fs/path/system/driver::throttleblood-driver-name
      - id: micro-behaviors/fs/path/device/kernel::throttlestop-device-path
  - id: throttleblood-process-termination-clues
    desc: ThrottleBlood driver with device control and process termination APIs
    crit: suspicious
    conf: 0.95
    all:
      - id: throttlestop-driver-reference
      - id: micro-behaviors/fs/file/handle::device-io-control-win
    any:
      - id: micro-behaviors/process/terminate/kill::native-terminate-process-reference
      - id: micro-behaviors/process/terminate/kernel::ps-terminate-process-reference
      - id: micro-behaviors/process/terminate/kill::terminate-process
  - id: security-survey-kernel-process-killer
    desc: Multi-vendor security process survey with vulnerable-driver kernel termination
    crit: hostile
    conf: 0.98
    attack: T1562.001
    all:
      - id: throttleblood-process-termination-clues
      - id: micro-behaviors/process/terminate/kernel::ps-terminate-process-reference
      - id: objectives/discovery/host/security::security-process-name-survey
