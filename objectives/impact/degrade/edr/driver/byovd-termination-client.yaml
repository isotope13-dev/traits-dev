# Operator-driven BYOVD process killers accept a target PID or process-name
# substring on the command line rather than embedding a fixed EDR vendor list.
# Pairing an identified vulnerable kernel-driver device/image with an active
# DeviceIoControl termination IOCTL establishes BYOVD termination dispatch.
defaults:
  platforms: [windows]
  for: [binaries, scripts, source]
  attack: T1562.001,T1068
  mbc: B0040

traits:
  - id: cli-pid-target-prompt
    desc: CLI prompt targeting a process ID
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)(Usage:[^\r\n]{1,40}<\s*PID\s*>|Target\s+PID\s*:)'

composite_rules:
  - id: byovd-termination-driver-identity
    desc: Known vulnerable termination driver device or image
    crit: suspicious
    conf: 0.95
    any:
      - id: objectives/impact/degrade/edr/teardown::byovd-driver-poisonx-handle
      - id: objectives/impact/degrade/edr/teardown::byovd-driver-poisonx-name
      - id: objectives/impact/degrade/edr/teardown::byovd-driver-dcrcv-handle
      - id: objectives/impact/degrade/edr/teardown::byovd-driver-dcrcv-name
      - id: objectives/impact/degrade/edr/teardown::byovd-driver-dcrcv-service
      - id: objectives/impact/degrade/edr/teardown::byovd-driver-k7
      - id: objectives/impact/degrade/edr/teardown::byovd-driver-name
      - id: objectives/impact/degrade/edr/teardown::byovd-helper-driver-name
      - id: micro-behaviors/fs/path/device/kernel::warsaw-pm-device-path
      - id: micro-behaviors/os/kernel/device::ccprotect-alinubx-device-reference

  - id: byovd-driver-termination-dispatch
    desc: Sends a process-termination IOCTL to a vulnerable driver
    crit: hostile
    conf: 0.98
    all:
      - id: byovd-termination-driver-identity
      - id: micro-behaviors/os/kernel/device::kernel-device-io-control
      - id: micro-behaviors/os/kernel/device::termination-compatible-device-control
    unless:
      - id: metadata/signature/verified/platform::microsoft
      - id: well-known/app/system/iobit::iobit-signed-component-context

  - id: byovd-snapshot-process-termination-loop
    desc: Enumerates running processes and terminates via vulnerable driver
    crit: hostile
    conf: 0.99
    all:
      - id: byovd-driver-termination-dispatch
    any:
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-symbol
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot

  - id: byovd-cli-pid-process-killer
    desc: Command-line PID killer dispatching vulnerable driver IOCTLs
    crit: hostile
    conf: 0.98
    all:
      - id: byovd-driver-termination-dispatch
      - id: cli-pid-target-prompt
