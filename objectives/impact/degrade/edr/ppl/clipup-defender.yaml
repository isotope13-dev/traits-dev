# ClipUp -ppl abuse against Defender via a directory link into Platform\.
# Observed in RONINGLOADER / Dragon Breath (APT-Q-27) PPL evasion chains.
defaults:
  platforms: [windows]
  for: [batch, powershell, cmd, scripts, c, cpp]
  attack: T1562.001,T1218
  mbc: B0003

traits:
  - id: clipup-ppl-invocation
    desc: ClipUp invoked with -ppl against a path
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bClipUp(\.exe)?\b.{0,120}-ppl\b'

  - id: mklink-directory-symlink
    desc: Creates directory symlink via mklink
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bmklink\s+/D\b'

  - id: defender-platform-directory-path
    desc: Windows Defender Platform directory path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)Windows Defender\\Platform\\'

composite_rules:
  - id: clipup-ppl-defender-link-corruption
    desc: ClipUp -ppl targets Defender via directory link
    crit: hostile
    conf: 0.99
    attack: T1562.001
    all:
      - id: clipup-ppl-invocation
      - id: mklink-directory-symlink
    any:
      - id: defender-platform-directory-path
      - id: objectives/impact/degrade/edr/teardown::target-msdefender
