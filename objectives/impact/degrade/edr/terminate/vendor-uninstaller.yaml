# Vendor-supplied EDR uninstallers executed from the product's own unpack
# cache (not BYOVD). Play used SentinelOne's SentinelCleaner from the S1_*
# temp_content path to strip protection before encryption.
defaults:
  platforms: [windows]
  for: [batch, powershell, python, c, text]
  attack: T1562.001
  mbc: F0004
traits:
  - id: sentinel-cleaner-exe
    desc: SentinelOne SentinelCleaner executable name
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bSentinelCleaner\.exe\b'
  - id: sentinelone-s1-temp-content
    desc: SentinelOne S1 temp_content unpack path
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Windows[\\/]+Temp[\\/]+S1_[A-Fa-f0-9]{32}[\\/]+temp_content\b'

composite_rules:
  - id: sentinel-vendor-uninstaller
    desc: SentinelOne vendor uninstaller from S1 temp cache
    crit: hostile
    conf: 0.97
    all:
      - id: sentinel-cleaner-exe
      - id: sentinelone-s1-temp-content
