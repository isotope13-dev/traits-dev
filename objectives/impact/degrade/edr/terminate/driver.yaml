defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1562.001

composite_rules:
  - id: driver-backed-process-termination
    desc: Driver-backed termination of another process
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/service/configure::service-create-configure-start-api-set
      - id: micro-behaviors/fs/file/handle::device-io-control-win
      - id: micro-behaviors/process/terminate/kill::native-terminate-process-reference
      - id: micro-behaviors/fs/path/system::driver-image-reference
