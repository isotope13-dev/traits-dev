# Impact: EDR/Security Software Evasion
# Composite rules for terminating security processes
defaults:
  crit: suspicious
  attack: T1562.001
  platforms: [windows]
  for: ["pe", "dll"]
composite_rules:
  # TerminateProcess + OpenProcess is common in benign process libraries.
  # Require process enumeration and explicit security-product image names;
  # this still reports co-occurring capabilities, not a proven kill target.
  - id: security-discovery-and-process-termination
    desc: Security-product discovery with process termination APIs
    conf: 0.85
    mbc: "B0033"
    size_min: 8192
    size_max: 100000
    all:
      - id: objectives/impact/degrade/edr/teardown::edr-target-indicators
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: micro-behaviors/process/create/spawn::open-process
    downgrade:
      any:
        - id: metadata/package/completeness/
        - id: metadata/binary/resource/identity::pe-resource-opaque-token
        - id: well-known/tool/reverse-engineering/windows-debugger/
        - id: well-known/tool/reverse-engineering/nanomite/
    unless:
      - id: well-known/tool/sysadmin/jvm/
  # Notable, not suspicious: the three legs are the MSVC CRT's own imports.
  # `__report_gsfailure` calls IsDebuggerPresent and then TerminateProcess when
  # a stack cookie fails, and LoadLibraryA is in every image -- voidtools'
  # es.exe, ARJ, and a shelf of ordinary small tools all carry the trio with no
  # anti-analysis logic behind it. Co-occurring capabilities, reported as such;
  # the anti-analysis verdict needs a rule that reads the check's consequence.
  - id: process-termination-chain
    desc: Debugger check with dynamic loading and forced termination
    crit: notable
    conf: 0.80
    # Keep this aligned with win-debugger-detect's 2 MB envelope. The prior
    # 200 KB ceiling excluded small native loaders just above the boundary
    # despite having the complete debugger/load/terminate combination.
    size_max: 2000000
    all:
      # A single IsDebuggerPresent/CheckRemoteDebuggerPresent observation is
      # sufficient for this chain; requiring the separate paired-query
      # composite misses loaders that terminate immediately on a local check.
      - id: micro-behaviors/process/debug/detect::is-debugger-present-any
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: micro-behaviors/dylib/load/runtime::load-library-a
    downgrade:
      any:
        - id: metadata/package/completeness/
        - id: well-known/tool/reverse-engineering/windows-debugger/
        - id: well-known/tool/reverse-engineering/nanomite/
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/
      # Node-API native addons import the debugger/terminate/load trio via
      # the toolchain runtime; the export proves the binary is a hosted
      # addon, not a standalone debugger-gated terminator.
      - id: well-known/lib/native/node-addon-api::napi-module-registration-export
