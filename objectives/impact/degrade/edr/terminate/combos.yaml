# Impact: EDR/Security Software Evasion
# Composite rules for terminating security processes
defaults:
  crit: suspicious
  attack: T1562.001
  platforms: [windows]
  for: ["pe", "dll"]
composite_rules:
  # TerminateProcess + OpenProcess is common in benign process libraries.
  # Require process enumeration and explicit security-product image names;
  # this still reports co-occurring capabilities, not a proven kill target.
  - id: security-discovery-and-process-termination
    desc: Security-product discovery with process termination APIs
    conf: 0.85
    mbc: "B0033"
    size_min: 8192
    size_max: 100000
    all:
      - id: objectives/impact/degrade/edr/teardown::edr-target-indicators
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: micro-behaviors/process/attach/rights::open-process
    downgrade:
      any:
        - id: metadata/package/completeness/
        - id: metadata/binary/resource/identity::pe-resource-opaque-token
        - id: well-known/tool/reverse-engineering/windows-debugger/
        - id: well-known/tool/reverse-engineering/nanomite/
    unless:
      - id: well-known/tool/sysadmin/jvm/

  - id: edr-termination-with-debug-privilege
    desc: Discovers and terminates security processes with debug privileges
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/degrade/edr/teardown::edr-target-indicators
      - id: micro-behaviors/os/privilege/token::sedebug-privilege-name
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: micro-behaviors/process/attach/rights::open-process
    any:
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
      - id: micro-behaviors/process/enumerate/psapi::enum-processes
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: well-known/tool/reverse-engineering/windows-debugger/
      - id: well-known/tool/reverse-engineering/nanomite/
