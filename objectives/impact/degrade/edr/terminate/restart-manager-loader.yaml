defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: startup-loader-security-tray-restart-manager
    desc: Startup loader pairs security-tray targeting with Restart Manager shutdown
    crit: hostile
    conf: 0.97
    attack: T1562.001
    # The loader supplies hostile admission; product text and shutdown APIs
    # alone can occur in an authorized security-product updater.
    all:
      - id: objectives/persistence/login/startup/registry::user-shell-folders-startup-redirection
      - id: micro-behaviors/os/event/shutdown::restart-manager-file-unlock
      - id: micro-behaviors/os/security/product::chinese-av-product-extended
      - id: micro-behaviors/process/enumerate/snapshot::process32-first
      - id: micro-behaviors/process/enumerate/snapshot::process32-next
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/subject::qihoo-360-authenticode-signer
