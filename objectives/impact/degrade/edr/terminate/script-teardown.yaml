# Endpoint-agent teardown driven from a script, rather than from a compiled
# killer. The sibling driver.yaml covers the same tradecraft inside a PE (the
# DeviceIoControl-plus-driver-image shape); these two composites cover the
# hands-on-keyboard form an operator types after taking a management platform,
# where every step is a separate command line.
#
# Both are conjunctions of two independently-published behaviors. Neither
# convicts alone: an administrator legitimately kills a stuck agent process,
# and a driver vendor legitimately registers a kernel service. What no
# administrator does is find out which agent is running and then kill it, or
# load a driver out of an application data folder and kill the agent with it.
#
# ATT&CK: T1562.001 (Impair Defenses: Disable or Modify Tools)
defaults:
  platforms: [windows]
  for: [batch, powershell, csharp, go]
  attack: T1562.001
  mbc: B0033

composite_rules:
  - id: byovd-kernel-driver-security-teardown
    desc: Staged kernel driver loaded alongside security-process termination
    # Bring-your-own-vulnerable-driver: a `.sys` staged in ProgramData or a
    # user profile is registered as a kernel service, and the same script
    # force-terminates a named endpoint-agent image. The driver is what makes
    # killing a protected-process agent possible from user mode.
    crit: hostile
    conf: 0.97
    attack: T1562.001,T1543.003,T1068
    all:
      - id: objectives/persistence/system/service/install::staged-kernel-driver-service-install
      - id: objectives/impact/degrade/edr/targeting::edr-security-process-termination
    unless:
      - id: metadata/package/testing/presence/harness/

  - id: security-product-enumerate-then-terminate
    desc: Security product enumerated and then terminated
    # Discovery followed by disablement in one artifact. The enumeration leg is
    # what separates this from an uninstall helper that kills a known-by-name
    # service of the product it ships with: the script does not know which
    # agent it will find, so it asks first.
    crit: hostile
    conf: 0.96
    attack: T1562.001,T1518.001
    all:
      - id: objectives/evasion/anti-av/edr-detect/shell::security-product-shell-enumeration
      - id: objectives/impact/degrade/edr/targeting::edr-security-process-termination
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: well-known/tool/detection/security-scanner/
