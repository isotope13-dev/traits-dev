defaults:
  for: [pe]
  platforms: [windows]
  attack: T1562.001,T1547.001

composite_rules:
  - id: av-killer-with-run-persistence
    desc: PE targets antivirus processes with Run-key persistence
    crit: hostile
    conf: 0.95
    mbc: F0004
    scope: file
    all:
      - id: objectives/impact/degrade/edr/targeting
      - id: objectives/persistence/login/registry/run-key
      - id: micro-behaviors/process/terminate
