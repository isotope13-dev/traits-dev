defaults:
  platforms: [windows]
  attack: T1562.001

traits:
  - id: security-ui-hex-before-taskkill
    desc: Security UI hex before taskkill
    crit: suspicious
    conf: 0.97
    for: [data, pe, batch, powershell, javascript]
    if:
      type: text
      regex: '5365634865616c746855492e657865.{0,120}7461736b6b696c6c202f46202f494d20'
