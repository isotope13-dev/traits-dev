defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, zig, python]
  attack: T1562.001

composite_rules:
  - id: defender-update-disk-starvation
    desc: Defender updates with hidden capacity allocation
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/app-data::defender-update-directory
      - id: micro-behaviors/fs/enumerate/volume::native-free-volume-capacity-query
      - id: micro-behaviors/fs/temp/file::ntcreatefile-hidden-delete-on-close
      - id: micro-behaviors/fs/file/open::ntcreatefile-explicit-allocation
      - id: micro-behaviors/fs/enumerate/volume::available-volume-byte-calculation

  - id: defender-update-adaptive-disk-starvation
    desc: Defender allocation with size watch and threads
    crit: hostile
    conf: 0.99
    all:
      - id: defender-update-disk-starvation
      - id: micro-behaviors/fs/watch::read-directory-changes-w
      - id: micro-behaviors/fs/watch::read-directory-size-changes-source
      - id: micro-behaviors/process/create/thread::create-thread-source

  - id: mrt-sharing-denial-update-sabotage
    desc: MRT restrictive sharing with update starvation
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/degrade/edr/teardown::mrt-nt-directory-path
      - id: micro-behaviors/fs/file/open::ntcreatefile-executable-share-read-only
      - id: defender-update-disk-starvation
