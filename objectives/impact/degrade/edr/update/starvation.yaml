defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, zig, python]
  attack: T1562.001

composite_rules:
  - id: defender-update-disk-starvation
    desc: Defender updates with hidden capacity allocation
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/app-data::defender-update-directory
      - id: micro-behaviors/fs/enumerate/volume::native-free-volume-capacity-query
      - id: micro-behaviors/fs/temp/file::ntcreatefile-hidden-delete-on-close
      - id: micro-behaviors/fs/file/open::ntcreatefile-explicit-allocation
      - id: micro-behaviors/fs/enumerate/volume::available-volume-byte-calculation

  - id: defender-update-adaptive-disk-starvation
    desc: Defender allocation with size watch and threads
    crit: hostile
    conf: 0.99
    all:
      - id: defender-update-disk-starvation
      - id: micro-behaviors/fs/watch::read-directory-changes-w
      - id: micro-behaviors/fs/watch::read-directory-size-changes-source
      - id: micro-behaviors/process/thread/create::create-thread-source

  - id: mrt-sharing-denial-update-sabotage
    desc: MRT restrictive sharing with update starvation
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/degrade/edr/teardown::mrt-nt-directory-path
      - id: micro-behaviors/fs/file/open::ntcreatefile-executable-share-read-only
      - id: defender-update-disk-starvation

  # Manifest routing-section filtering and HTTP 404 for unsupported .signed
  # paths do not prove update starvation or client verification bypass.
  # Retain those observations in communications/proxy/relay; an impact rule
  # needs evidence that detection updates are actually disabled or replaced.

  # This combination goes beyond a mirror's fixed-upstream filtering: it
  # denies signed ESET update resources, rotates its own image and registers
  # for HKLM startup, while fetching its replacement executable from a
  # cleartext bare-IP endpoint without TLS verification. Together these show
  # deliberate degradation of ESET updates alongside a persistent,
  # unauthenticated code-update path. The family-identity leg is gone:
  # objectives/ cannot reference well-known/malware/ (families build on
  # objectives, not the reverse), and these four behavior legs already
  # establish the attack pattern on the convicted files.
  - id: persistent-unauthenticated-eset-update-proxy
    desc: Persistent ESET relay denies signed resources and fetches unverified code
    crit: hostile
    conf: 0.98
    for: [pe]
    attack: T1562.001,T1105
    all:
      - id: micro-behaviors/communications/proxy/relay::eset-manifest-filtering-relay-profile
      - id: objectives/command-and-control/dropper/download::unverified-winhttp-stack-and-bare-ip-url
      - id: micro-behaviors/os/autorun/login-items::native-standby-self-mutation-run-key
      - id: micro-behaviors/process/terminate/kill::listener-port-owner-termination
