defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, zig, python]
  attack: T1562.001

composite_rules:
  - id: defender-update-disk-starvation
    desc: Defender update transient-file disk starvation
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/degrade/edr/targeting::defender-update-directory
      - id: micro-behaviors/fs/enumerate/volume::native-free-volume-capacity-query
      - id: micro-behaviors/fs/temp/file::ntcreatefile-hidden-delete-on-close

  - id: defender-update-adaptive-disk-starvation
    desc: Adaptive Defender update disk starvation
    crit: hostile
    conf: 0.99
    all:
      - id: defender-update-disk-starvation
      - id: micro-behaviors/fs/watch/monitor::read-directory-changes-w
      - id: micro-behaviors/fs/watch/monitor::read-directory-size-changes-source
      - id: micro-behaviors/process/create/thread::create-thread-source

  - id: mrt-sharing-denial-update-sabotage
    desc: Locks MRT while sabotaging Defender updates
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/degrade/edr/teardown::mrt-nt-directory-path
      - id: micro-behaviors/fs/lock/file::ntcreatefile-executable-share-read-only
      - id: objectives/impact/degrade/edr/targeting::defender-update-directory
