# Stopping the machine's logging daemon. This is not clearing a log -- it is
# taking the logger away, so nothing is written from that point on. By the
# same reading that puts AV *termination* under degrade/ while AV *bypass*
# stays in evasion/, silencing syslogd is an attack on a defensive capability
# rather than the removal of a particular record.
#
# The audit-trail composite lives here too: once stopping the logger is one of
# its legs, the rule as a whole is about dismantling the capability, not about
# editing evidence.
defaults:
  platforms: [unix]
  for: [scripts]
  attack: T1562.001
  mbc: F0004

traits:
  - id: logging-daemon-unload
    desc: Unloads the system logging daemon
    crit: suspicious
    conf: 0.93
    if:
      # `launchctl unload -w .../com.apple.syslogd.plist` -- and `-w` makes it
      # stick across reboots.
      type: text
      regex: '(?i)launchctl\s+unload[^\n]{0,60}syslogd'

  - id: logging-daemon-kill
    desc: Kills the system logging daemon
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bkillall\s+(-[0-9A-Z]{1,7}\s+)?r?syslogd\b'

composite_rules:
  # Any two of: stop the logger, delete the login records, rewrite the logs.
  # One alone has a maintenance story; two together is someone removing their
  # own traces, and the order they are done in does not matter.
  - id: audit-trail-teardown
    desc: Dismantles the host audit trail
    crit: hostile
    conf: 0.96
    attack: T1562.001,T1070.001
    any:
      - id: logging-daemon-unload
      - id: logging-daemon-kill
      - id: objectives/evasion/indicator-removal/accounting::login-record-file-deletion
      - id: objectives/evasion/indicator-removal/logs::system-log-selective-rewrite
    needs: 2
