# PLC/OT project manipulation and operator lockout.
#
# CISA reports actors using vendor engineering software against internet-facing
# PLCs to extract and alter project files, change controller passwords and
# network settings, and manipulate HMI/SCADA data. The atomic rules identify
# structured controller-operation call names; composites add ICS protocol
# context to infer disruptive intent. They avoid actor names and prose.
# ATT&CK: T1531, T1565.001, T1565.002, T1041
defaults:
  for: [python, javascript, ruby, powershell, shell, batch]
  platforms: [windows, linux, macos]
  crit: suspicious
  conf: 0.91

traits:
  - id: set-controller-password-call
    desc: PLC controller password set call
    crit: suspicious
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)set[_-]?(controller|plc|s7)[_-]?password$'

  - id: change-controller-password-call
    desc: PLC controller password change call
    crit: suspicious
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)change[_-]?(controller|plc|s7)[_-]?password$'

  - id: update-controller-password-call
    desc: PLC controller password update call
    crit: suspicious
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)update[_-]?(controller|plc|s7)[_-]?password$'

  - id: controller-operating-mode-call
    desc: PLC operating-mode setter call
    crit: suspicious
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(set|change|switch)[_-]?(operating|cpu|controller)[_-]?(mode|state)$'

  - id: controller-stop-mode-call
    desc: Requests PLC STOP operating mode
    crit: suspicious
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(set|change|switch)[_-]?(operating|cpu|controller)[_-]?(mode|state)$'
      arg:
        kind: string
        regex: '(?i)^stop$'

  - id: enable-controller-password-call
    desc: PLC controller password enable call
    crit: suspicious
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)enable[_-]?(controller|plc|s7)[_-]?password$'

  - id: turn-on-controller-password-call
    desc: PLC controller password activation call
    crit: suspicious
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)turn[_-]?on[_-]?(controller|plc|s7)[_-]?password$'

  - id: set-controller-ip-call
    desc: PLC controller IP set call
    crit: suspicious
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)set[_-]?(controller|plc|s7)[_-]?ip([_-]?address)?$'

  - id: change-controller-ip-call
    desc: PLC controller IP change call
    crit: suspicious
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)change[_-]?(controller|plc|s7)[_-]?ip([_-]?address)?$'

  - id: update-controller-ip-call
    desc: PLC controller IP update call
    crit: suspicious
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)update[_-]?(controller|plc|s7)[_-]?ip([_-]?address)?$'

  - id: write-controller-config-call
    desc: PLC controller configuration write call
    crit: suspicious
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)write[_-]?(controller|plc)[_-]?config(uration)?$'

  - id: write-controller-settings-call
    desc: PLC controller settings write call
    crit: suspicious
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)write[_-]?(controller|plc)[_-]?settings?$'

  - id: write-controller-config-camel-call
    desc: CamelCase PLC config write call
    crit: suspicious
    conf: 0.94
    for: [c, cpp, csharp, go, rust, java]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)Write(Controller|PLC)Config(uration)?$'

  - id: modify-controller-logic-camel-call
    desc: CamelCase PLC logic change call
    crit: suspicious
    conf: 0.94
    for: [c, cpp, csharp, go, rust, java]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)Modify(PLC|S7|Controller)Logic$'

  - id: upload-project-call
    desc: PLC/S7 project upload call
    crit: suspicious
    conf: 0.91
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)upload[_-]?(plc|s7)[_-]?project$'

  - id: read-project-call
    desc: PLC/S7 project read call
    crit: suspicious
    conf: 0.91
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)read[_-]?(plc|s7)[_-]?project$'

  - id: export-project-call
    desc: PLC/S7 project export call
    crit: suspicious
    conf: 0.91
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)export[_-]?(plc|s7)[_-]?project$'

  - id: download-project-call
    desc: PLC/S7 project download call
    crit: suspicious
    conf: 0.91
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)download[_-]?(plc|s7)[_-]?project$'

  - id: write-project-call
    desc: PLC/S7 project write call
    crit: suspicious
    conf: 0.91
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)write[_-]?(plc|s7)[_-]?project$'

  - id: import-project-call
    desc: PLC/S7 project import call
    crit: suspicious
    conf: 0.91
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)import[_-]?(plc|s7)[_-]?project$'

  - id: upload-controller-project-call
    desc: PLC controller project upload call
    crit: suspicious
    conf: 0.91
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)upload[_-]?(plc|s7|controller)[_-]?project$'

  - id: download-controller-project-call
    desc: PLC controller project download call
    crit: suspicious
    conf: 0.91
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)download[_-]?(plc|s7|controller)[_-]?project$'

  - id: modify-aoi-call
    desc: PLC AOI modification call
    crit: suspicious
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)modify[_-]?aoi$'

  - id: delete-aoi-call
    desc: PLC AOI deletion call
    crit: suspicious
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)delete[_-]?aoi$'

  - id: modify-project-logic-call
    desc: PLC/S7 project logic modification call
    crit: suspicious
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)modify[_-]?(plc|s7)[_-]?(project|logic)$'

  - id: delete-project-logic-call
    desc: PLC/S7 project logic deletion call
    crit: suspicious
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)delete[_-]?(plc|s7)[_-]?(project|logic)$'

  - id: modify-controller-logic-call
    desc: PLC controller logic modification call
    crit: suspicious
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)modify[_-]?(plc|s7|controller)[_-]?logic$'

  - id: delete-controller-logic-call
    desc: PLC controller logic deletion call
    crit: suspicious
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)delete[_-]?(plc|s7|controller)[_-]?logic$'

  - id: disable-alarm-call
    desc: PLC/S7/controller alarm disable call
    crit: suspicious
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)disable[_-]?(plc|s7|controller)[_-]?alarm$'

  - id: disable-shutdown-call
    desc: PLC/S7/controller shutdown disable call
    crit: suspicious
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)disable[_-]?(plc|s7|controller)[_-]?shutdown$'

  - id: write-hmi-display-call
    desc: HMI display write call
    crit: suspicious
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)write[_-]?hmi[_-]?display$'

  - id: update-hmi-display-call
    desc: HMI display update call
    crit: suspicious
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)update[_-]?hmi[_-]?display$'

  # PowerShell's source projection exposes these method names as identifiers,
  # not call symbols. They remain structured syntax facts (and are therefore
  # not vulnerable to matches in comments or explanatory prose), while keeping
  # the same operation family covered by call-symbol rules in other languages.
  - id: powershell-controller-password-enable-method
    desc: PowerShell PLC password-enabling method
    crit: suspicious
    conf: 0.92
    for: [powershell]
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^(enable|turn[_-]?on)\w*(plc|controller)\w*password\w*$'

  - id: powershell-controller-network-method
    desc: PowerShell PLC network-setting method
    crit: suspicious
    conf: 0.92
    for: [powershell]
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^(set|change|update).*controller.*(ip|address).*$'

  - id: powershell-plc-network-method
    desc: PowerShell PLC network-setting method
    crit: suspicious
    conf: 0.92
    for: [powershell]
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^(set|change|update).*plc.*(ip|address).*$'

  - id: powershell-s7-network-method
    desc: PowerShell S7 network-setting method
    crit: suspicious
    conf: 0.92
    for: [powershell]
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^(set|change|update).*s7.*(ip|address).*$'

  - id: powershell-controller-config-method
    desc: PowerShell PLC configuration-setting method
    crit: suspicious
    conf: 0.92
    for: [powershell]
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^(write|update|set)[A-Za-z0-9_-]*(controller|plc|s7)[A-Za-z0-9_-]*(config|settings?)$'

  - id: powershell-controller-project-read-method
    desc: PowerShell PLC project extraction method
    crit: suspicious
    conf: 0.92
    for: [powershell]
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^(read|export)[A-Za-z0-9_-]*project[A-Za-z0-9_-]*$'

  - id: powershell-controller-project-write-method
    desc: PowerShell PLC project deployment method
    crit: suspicious
    conf: 0.92
    for: [powershell]
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^(upload|download|write)[A-Za-z0-9_-]*project[A-Za-z0-9_-]*$'

  - id: powershell-controller-logic-method
    desc: PowerShell PLC logic mutation method
    crit: suspicious
    conf: 0.92
    for: [powershell]
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^(modify|change|update)[A-Za-z0-9_-]*(logic|ladder)[A-Za-z0-9_-]*$'

  - id: write-scada-display-call
    desc: SCADA display write call
    crit: suspicious
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)write[_-]?scada[_-]?display$'

  - id: update-scada-display-call
    desc: SCADA display update call
    crit: suspicious
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)update[_-]?scada[_-]?display$'

composite_rules:
  - id: disable-alarm-shutdown-call
    desc: PLC alarm or shutdown disable call
    crit: suspicious
    conf: 0.94
    any:
      - id: disable-alarm-call
      - id: disable-shutdown-call

  - id: controller-password-action-call
    desc: PLC controller password action
    crit: suspicious
    conf: 0.94
    any:
      - id: set-controller-password-call
      - id: change-controller-password-call
      - id: update-controller-password-call
      - id: enable-controller-password-call
      - id: turn-on-controller-password-call
      - id: powershell-controller-password-enable-method
      - id: micro-behaviors/communications/s7::snap7-session-password-call

  # The generic `set_operating_mode("stop")` atom above covers hand-rolled
  # wrappers; Snap7's `plc_stop` is what a library-backed S7 client actually
  # calls to halt a CPU. Both mean "put this controller in STOP".
  - id: controller-halt-call
    desc: Requests a PLC CPU halt
    crit: notable
    conf: 0.96
    for: [scripts, binaries, c, cpp, csharp, go, rust, java]
    any:
      - id: controller-stop-mode-call
      - id: micro-behaviors/communications/s7::snap7-cpu-stop-call

  - id: controller-network-reconfiguration-call
    desc: PLC controller IP reconfiguration
    crit: suspicious
    conf: 0.94
    any:
      - id: set-controller-ip-call
      - id: change-controller-ip-call
      - id: update-controller-ip-call
      - id: powershell-controller-network-method
      - id: powershell-plc-network-method
      - id: powershell-s7-network-method

  - id: controller-configuration-write
    desc: PLC controller configuration write
    crit: suspicious
    conf: 0.95
    any:
      - id: write-controller-config-call
      - id: write-controller-settings-call
      - id: powershell-controller-config-method

  - id: project-read-call
    desc: PLC project extraction call
    crit: suspicious
    conf: 0.92
    any:
      - id: upload-project-call
      - id: read-project-call
      - id: export-project-call
      - id: upload-controller-project-call
      - id: powershell-controller-project-read-method

  - id: project-write-call
    desc: PLC project deployment call
    crit: suspicious
    conf: 0.92
    any:
      - id: download-project-call
      - id: write-project-call
      - id: import-project-call
      - id: download-controller-project-call
      - id: powershell-controller-project-write-method

  - id: project-logic-mutation-call
    desc: PLC project logic mutation
    crit: suspicious
    conf: 0.95
    any:
      - id: modify-aoi-call
      - id: delete-aoi-call
      - id: modify-project-logic-call
      - id: delete-project-logic-call
      - id: modify-controller-logic-call
      - id: delete-controller-logic-call
      - id: disable-alarm-shutdown-call
      - id: powershell-controller-logic-method

  - id: hmi-scada-data-write-call
    desc: HMI or SCADA display write
    crit: suspicious
    conf: 0.94
    any:
      - id: write-hmi-display-call
      - id: update-hmi-display-call
      - id: write-scada-display-call
      - id: update-scada-display-call

  - id: plc-upload-password-action
    desc: Changes PLC password protection
    crit: hostile
    conf: 0.96
    attack: T1531
    all:
      - id: objectives/discovery/network/scan/ics::ics-protocol-reference
      - id: controller-password-action-call
    near_lines: 24

  - id: plc-mode-password-lockout
    desc: Puts a PLC in STOP mode and locks its state with password protection
    crit: hostile
    conf: 0.98
    attack: T1565.001
    all:
      - id: objectives/discovery/network/scan/ics::ics-protocol-reference
      - id: controller-halt-call
      - id: controller-password-action-call
    near_lines: 64

  # A nearby multi-generation family list is useful context for a CPU halt,
  # but without data flow it does not prove those labels drive the operation.
  # Keep the combination suspicious rather than claiming fleet-wide impact.
  - id: plc-fleet-halt
    desc: PLC halt near multi-generation Siemens labels
    crit: suspicious
    conf: 0.96
    for: [scripts, binaries, c, cpp, csharp, go, rust, java]
    attack: T1565
    unless:
      - id: micro-behaviors/communications/ip/literal::rfc5737-documentation-ipv4-cidr
    all:
      - id: controller-halt-call
      - id: micro-behaviors/communications/s7::s7-cpu-family-table
    any:
      - id: objectives/discovery/network/scan/ics::ics-port-sweep
    near_lines: 60

  # Reading a Siemens data block, flipping one indexed byte, writing the
  # modified block back, and then halting the CPU is a concrete destructive
  # sequence. Requiring all four operations nearby avoids treating ordinary
  # Snap7 commissioning reads, writes, or stop controls as sabotage alone.
  - id: s7-process-data-bitflip-and-halt
    desc: Bit-flips S7 process data and halts PLC
    crit: hostile
    conf: 0.99
    for: [scripts, binaries, c, cpp, csharp, go, rust, java]
    attack: T1565.001
    unless:
      - id: micro-behaviors/communications/ip/literal::rfc5737-documentation-ipv4-cidr
    all:
      - id: micro-behaviors/communications/s7::snap7-memory-read-call
      - id: micro-behaviors/data/buffer::indexed-byte-xor-nontrivial-mask
      - id: micro-behaviors/communications/s7::snap7-memory-write-call
      - id: controller-halt-call
    near_lines: 32

  # A commissioning utility may write one controller or stop one CPU. A tool
  # that first sweeps for reachable industrial devices, then rewrites S7
  # memory and halts the discovered CPUs is an automated disruption chain.
  # Accept the scanner structures already defined for scripts, native C, and
  # Go so this objective is not tied to one Python implementation.
  - id: plc-sweep-write-and-halt
    desc: Sweeps a network, writes Siemens S7 memory, and halts PLC CPUs
    crit: hostile
    conf: 0.98
    for: [scripts, binaries, c, cpp, csharp, go, rust, java]
    attack: T0821
    unless:
      - id: micro-behaviors/communications/ip/literal::rfc5737-documentation-ipv4-cidr
    all:
      - id: micro-behaviors/communications/s7::snap7-memory-read-call
      - id: micro-behaviors/communications/s7::snap7-memory-write-call
      - id: controller-halt-call
      - id: objectives/discovery/network/scan/ics::ics-port-sweep
    near_lines: 128

  - id: plc-network-disconnect
    desc: Changes PLC network settings
    crit: hostile
    conf: 0.95
    attack: T1565
    all:
      - id: objectives/discovery/network/scan/ics::ics-protocol-reference
      - id: controller-network-reconfiguration-call
    near_lines: 24

  - id: plc-controller-configuration-tampering
    desc: Writes PLC configuration through an ICS protocol
    crit: hostile
    conf: 0.96
    attack: T1565
    all:
      - id: objectives/discovery/network/scan/ics::ics-protocol-reference
      - id: controller-configuration-write
    near_lines: 32

  - id: plc-controller-configuration-tampering-native
    desc: CamelCase PLC config tampering over EtherNet/IP
    crit: hostile
    conf: 0.96
    for: [c, cpp, csharp, go, rust, java]
    attack: T1565
    all:
      - id: micro-behaviors/communications/ethernet-ip::keyword
      - id: write-controller-config-camel-call
    near_lines: 32

  - id: plc-project-logic-tampering-native
    desc: CamelCase PLC logic tampering over EtherNet/IP
    crit: hostile
    conf: 0.97
    for: [c, cpp, csharp, go, rust, java]
    attack: T1565.001
    all:
      - id: micro-behaviors/communications/ethernet-ip::keyword
      - id: modify-controller-logic-camel-call
    near_lines: 32

  - id: plc-project-extraction
    desc: Extracts PLC project through ICS
    crit: suspicious
    conf: 0.92
    attack: T1041
    all:
      - id: objectives/discovery/network/scan/ics::ics-protocol-reference
      - id: project-read-call
    near_lines: 32

  - id: plc-project-logic-tampering
    desc: Tampers with PLC project logic
    crit: hostile
    conf: 0.97
    attack: T1565.001
    all:
      - id: objectives/discovery/network/scan/ics::ics-protocol-reference
      - id: project-logic-mutation-call
    near_lines: 32

  - id: plc-project-deployment
    desc: Deploys PLC project through ICS
    crit: suspicious
    conf: 0.92
    attack: T1565.001
    all:
      - id: objectives/discovery/network/scan/ics::ics-protocol-reference
      - id: project-write-call
    near_lines: 32

  - id: plc-hmi-scada-manipulation
    desc: Manipulates HMI or SCADA data
    crit: hostile
    conf: 0.96
    attack: T1565.002
    all:
      - id: objectives/discovery/network/scan/ics::ics-protocol-reference
      - id: hmi-scada-data-write-call
    near_lines: 32

  - id: plc-logic-and-display-tampering
    desc: PLC logic and display tampering
    crit: hostile
    conf: 0.98
    attack: T1565
    all:
      - id: plc-project-logic-tampering
      - id: plc-hmi-scada-manipulation
    near_lines: 40
