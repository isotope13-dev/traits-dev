# PLC/OT operator lockout and disruption
#
# The CISA water-sector reporting describes actors changing PLC access
# controls, network settings, and control logic, then replacing the HMI view.
# These rules intentionally match behavior across script languages and
# platforms rather than a vendor, product, port, or actor slogan.
# ATT&CK: T1491.001, T1499, T1531, T1565.001
defaults:
  for: [scripts]
  platforms: [windows, linux, macos]
  crit: suspicious
  conf: 0.91

traits:
  - id: plc-password-change
    desc: Changes PLC program-upload password
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: (?i)\bchange_(plc|s7|ladder)_[a-z0-9_]*password\b

  - id: plc-password-enable
    desc: Enables PLC program-upload password
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: (?i)\benable_(plc|s7|ladder)_[a-z0-9_]*password\b

  - id: plc-password-set
    desc: Sets PLC program-upload password
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: (?i)\bset_(plc|s7|ladder)_[a-z0-9_]*password\b

  - id: plc-network-change
    desc: Changes PLC IP address or remote port
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: (?i)\bchange_(plc|s7)_[a-z0-9_]*(ip|port)\b

  - id: plc-network-set
    desc: Sets PLC IP address or remote port
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: (?i)\bset_(plc|s7)_[a-z0-9_]*(ip|port)\b

  - id: plc-network-update
    desc: Updates PLC IP address or remote port
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: (?i)\bupdate_(plc|s7)_[a-z0-9_]*(ip|port)\b

  - id: plc-ladder-erasure
    desc: Erases PLC ladder logic
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: (?i)\b(erase|clear)_(plc|ladder)[a-z0-9_]*(logic|program)\b

  - id: plc-program-erasure
    desc: Deletes PLC control program
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: (?i)\b(delete|remove)_(plc|ladder)[a-z0-9_]*program\b

  - id: plc-project-download
    desc: Downloads a PLC replacement project
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: (?i)\b(download|upload)_[a-z0-9_]*(plc|ladder)[a-z0-9_]*project\b

  - id: plc-logic-upload
    desc: Writes replacement PLC control logic
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: (?i)\b(write|replace)_[a-z0-9_]*(plc|ladder)[a-z0-9_]*(logic|program)\b

  - id: hmi-splash-upload
    desc: Uploads replacement HMI splash content
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: (?i)\b(upload|write)_[a-z0-9_]*hmi[a-z0-9_]*(splash|display)\b

  - id: hmi-display-update
    desc: Uploads replacement display content
    crit: suspicious
    conf: 0.91
    if:
      type: text
      regex: (?i)\b(upload|write)_[a-z0-9_]*hmi[a-z0-9_]*(splash|screen|display)\b

  - id: hmi-compromise-message
    desc: Displays a compromise message
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)\bhmi[a-z0-9_ -]{0,48}(hacked|compromised)\b

  - id: hmi-lockout-message
    desc: Displays an access-denial message
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: (?i)\bhmi[a-z0-9_ -]{0,24}(unauthorized|disabled|locked|lockout)\b

  # Cross-language call-shape atoms. These match operation and control-object
  # names, not actor names or explanatory prose. The hostile composites below
  # require an ICS protocol reference as additional context.
  - id: erase-control-logic-call
    desc: Calls erase on PLC control logic
    crit: suspicious
    conf: 0.93
    for: [python, javascript, shell, powershell, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)erase_[a-z0-9_.]*(plc|program|logic)$'

  - id: clear-control-logic-call
    desc: Calls clear on PLC logic
    crit: suspicious
    conf: 0.93
    for: [python, javascript, shell, powershell, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)clear_[a-z0-9_.]*(plc|program|logic)$'

  - id: delete-control-logic-call
    desc: Calls delete on PLC logic
    crit: suspicious
    conf: 0.93
    for: [python, javascript, shell, powershell, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)delete_[a-z0-9_.]*(plc|program|logic)$'

  - id: remove-control-logic-call
    desc: Calls remove on PLC logic
    crit: suspicious
    conf: 0.91
    for: [python, javascript, shell, powershell, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)remove_[a-z0-9_.]*(plc|program|logic)$'

  - id: wipe-control-logic-call
    desc: Calls wipe on PLC logic
    crit: suspicious
    conf: 0.91
    for: [python, javascript, shell, powershell, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)wipe_[a-z0-9_.]*(plc|program|logic)$'

  - id: upload-control-logic-call
    desc: Calls upload on PLC control logic
    crit: suspicious
    conf: 0.93
    for: [python, javascript, shell, powershell, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)upload_[a-z0-9_.]*_(plc|project|logic)$'

  - id: download-control-logic-call
    desc: Calls download of PLC logic
    crit: suspicious
    conf: 0.93
    for: [python, javascript, shell, powershell, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)download_[a-z0-9_.]*_(plc|project|logic)$'

  - id: replace-control-logic-call
    desc: Calls replacement of PLC logic
    crit: suspicious
    conf: 0.93
    for: [python, javascript, shell, powershell, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)replace_[a-z0-9_.]*_(plc|project|logic)$'

  - id: write-control-logic-call
    desc: Calls write on PLC control logic
    crit: suspicious
    conf: 0.91
    for: [python, javascript, shell, powershell, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)write_[a-z0-9_.]*_(plc|project|logic)$'

  - id: write-control-register-call
    desc: Calls write to control register/coil
    crit: suspicious
    conf: 0.91
    for: [python, javascript, shell, powershell, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)write_(register|coil|output)$'

  - id: force-control-output-call
    desc: Calls force on control coil/output
    crit: suspicious
    conf: 0.91
    for: [python, javascript, shell, powershell, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)force_(coil|output)$'

  - id: set-control-output-call
    desc: Calls set on control register/coil
    crit: suspicious
    conf: 0.91
    for: [python, javascript, shell, powershell, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)set_(register|coil|output)$'

composite_rules:

  - id: plc-upload-password-action
    desc: Changes PLC upload password protection
    crit: suspicious
    conf: 0.94
    any:
      - id: plc-password-change
      - id: plc-password-enable
      - id: plc-password-set

  - id: plc-network-reconfiguration
    desc: Changes PLC network address or port
    crit: suspicious
    conf: 0.93
    any:
      - id: plc-network-change
      - id: plc-network-set
      - id: plc-network-update

  - id: plc-logic-erasure
    desc: Erases PLC ladder logic or program
    crit: suspicious
    conf: 0.95
    any:
      - id: plc-ladder-erasure
      - id: plc-program-erasure

  - id: plc-logic-transfer
    desc: Transfers PLC project or control logic
    crit: suspicious
    conf: 0.94
    any:
      - id: plc-project-download
      - id: plc-logic-upload

  - id: hmi-display-write
    desc: Writes replacement HMI display content
    crit: suspicious
    conf: 0.92
    any:
      - id: hmi-splash-upload
      - id: hmi-display-update

  - id: hmi-defacement-message
    desc: Hostile message intended for an HMI
    crit: suspicious
    conf: 0.9
    any:
      - id: hmi-compromise-message
      - id: hmi-lockout-message

  - id: plc-operator-lockout
    desc: PLC upload access locked against operators
    crit: hostile
    conf: 0.96
    attack: T1531
    all:
      - id: objectives/discovery/network/scan/ics::ics-protocol-reference
      - id: plc-upload-password-action
    near_lines: 24

  - id: plc-network-disconnect
    desc: PLC network settings changed to disrupt access
    crit: hostile
    conf: 0.95
    attack: T1499
    all:
      - id: objectives/discovery/network/scan/ics::ics-protocol-reference
      - id: plc-network-reconfiguration
    near_lines: 24

  - id: plc-logic-replacement
    desc: PLC control logic erased and replaced
    crit: hostile
    conf: 0.98
    attack: T1565.001
    all:
      - id: objectives/discovery/network/scan/ics::ics-protocol-reference
      - id: plc-logic-erasure
      - id: plc-logic-transfer
    near_lines: 24

  - id: plc-hmi-defacement
    desc: PLC HMI replaced with hostile message
    crit: hostile
    conf: 0.97
    attack: T1491.001
    all:
      - id: objectives/discovery/network/scan/ics::ics-protocol-reference
      - id: hmi-display-write
      - id: hmi-defacement-message
    near_lines: 24

  - id: control-logic-erasure-call
    desc: Erases PLC or control logic
    crit: suspicious
    conf: 0.94
    any:
      - id: erase-control-logic-call
      - id: clear-control-logic-call
      - id: delete-control-logic-call
      - id: remove-control-logic-call
      - id: wipe-control-logic-call

  - id: control-logic-transfer-call
    desc: Transfers PLC control logic
    crit: suspicious
    conf: 0.94
    any:
      - id: upload-control-logic-call
      - id: download-control-logic-call
      - id: replace-control-logic-call
      - id: write-control-logic-call

  - id: control-device-write-call
    desc: Writes an ICS control register or coil
    crit: suspicious
    conf: 0.92
    any:
      - id: write-control-register-call
      - id: force-control-output-call
      - id: set-control-output-call

  - id: ics-control-logic-replacement
    desc: ICS client erases and replaces PLC control logic
    crit: hostile
    conf: 0.98
    attack: T1565.001
    all:
      - id: objectives/discovery/network/scan/ics::ics-protocol-reference
      - id: control-logic-erasure-call
      - id: control-logic-transfer-call
    near_lines: 32

  - id: ics-credentialed-control-disruption
    desc: ICS client uses embedded default accounts for disruptive control writes
    crit: hostile
    conf: 0.98
    attack: T1110.001,T0855
    all:
      - id: objectives/discovery/network/scan/ics::ics-protocol-reference
      - id: micro-behaviors/os/security/auth/password::credentials-setter-call
      - id: objectives/lateral-movement/brute-force/password::embedded-default-account-pairs
      - id: control-device-write-call
    near_lines: 40
