# OT-connected network-device recovery interference. The report describes
# factory-resetting industrial network devices, changing their administrator
# passwords, and assigning an unreachable loopback address after ICS access.
# These rules detect the structured operations, not vendor names or prose.
defaults:
  for: [python, javascript, shell, powershell, go, ruby]
  platforms: [unix, windows]
  attack: T1070,T1565

traits:
  - id: factory-reset-call
    desc: Device factory-reset call
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(factory[_-]?reset|reset[_-]?(to[_-]?)?factory)$'

composite_rules:
  - id: ics-device-recovery-interference
    desc: Factory-resets an OT-connected device and hides it at loopback
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/discovery/network/scan/ics::ics-protocol-reference
      - id: factory-reset-call
      - id: micro-behaviors/communications/ip/assignment::ip-set-to-loopback
    any:
      - id: micro-behaviors/communications/http/services/cloud::remote-admin-password-change-call
      - id: objectives/impact/degrade/ics::plc-network-disconnect
    near_lines: 40
