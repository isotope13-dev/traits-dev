defaults:
  platforms: [linux]
  for: [elf]

traits:
  - id: proc-exe-xmr-grep
    desc: Grep procfs exe links for xmr miners
    crit: notable
    conf: 0.95
    attack: T1057
    if:
      type: text
      regex: '/exe\s*\|\s*grep\s+(-[A-Za-z]+\s+){0,3}(xmr|miner)'

composite_rules:
  - id: elf-rival-miner-process-terminator
    desc: ELF binary enumerates procfs exe and ps output to kill rival miners
    crit: suspicious
    conf: 0.96
    attack: T1057,T1489
    all:
      - id: proc-exe-xmr-grep
      - id: micro-behaviors/process/enumerate/grep::ps-grep-targeting
      - id: micro-behaviors/process/terminate/command::kill-force
