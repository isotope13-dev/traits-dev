# Native bot embeds a multi-threat competitor kill table to terminate
# rival botnets and cryptominers across Linux and Android.
defaults:
  platforms: [linux, android]
  for: [elf]
  attack: T1562.001,T1489
  mbc: B0025

traits:
  - id: rival-miner-token-kinsing
    desc: Kinsing rival miner token
    crit: notable
    conf: 0.95
    if:
      type: text
      section: .rodata
      exact: kinsing

  - id: rival-miner-token-kdevtmpfsi
    desc: kdevtmpfsi rival miner token
    crit: notable
    conf: 0.95
    if:
      type: text
      section: .rodata
      exact: kdevtmpfsi

  - id: rival-miner-token-sysupdate
    desc: sysupdate rival miner token
    crit: notable
    conf: 0.95
    if:
      type: text
      section: .rodata
      exact: sysupdate

  - id: rival-bot-token-gafgyt
    desc: Gafgyt rival bot token
    crit: notable
    conf: 0.95
    if:
      type: text
      section: .rodata
      exact: gafgyt

  - id: rival-bot-token-tsunami
    desc: Tsunami rival bot token
    crit: notable
    conf: 0.95
    if:
      type: text
      section: .rodata
      exact: tsunami

  - id: rival-bot-token-redtail
    desc: Redtail rival bot token
    crit: notable
    conf: 0.95
    if:
      type: text
      section: .rodata
      exact: redtail

composite_rules:
  - id: native-rival-bot-miner-killer
    desc: Native bot terminates rival botnets and miners
    crit: hostile
    conf: 0.99
    all:
      - id: rival-miner-token-kinsing
      - id: rival-miner-token-kdevtmpfsi
      - id: rival-miner-token-sysupdate
    any:
      - id: rival-bot-token-gafgyt
      - id: rival-bot-token-tsunami
      - id: rival-bot-token-redtail
