# Bot killer - Terminate competing bots
# Process enumeration + memory scanning + termination pattern
defaults:
  for: [c, cpp]
  platforms: [windows]
  attack: T1562.001
composite_rules:
  - id: bot-killer-source
    desc: Bot killer process scan and terminate
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-source
      - id: micro-behaviors/mem/read/cross-process::read-process-memory-source
      - id: micro-behaviors/process/terminate/kill::terminate-process-source
    unless:
      # A Windows debugger enumerates processes/threads, reads debuggee
      # memory (debug-string events), and terminates its debuggee. That
      # capability trio on a debug event loop is debugging, not rival-killing.
      - id: micro-behaviors/process/debug/event::wait-for-debug-event-source
      - id: micro-behaviors/process/debug/event::continue-debug-event-source
