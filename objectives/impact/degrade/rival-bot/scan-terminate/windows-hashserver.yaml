# HashServer clients hunt and block competing miners before installing their own.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1489,T1496
  crit: suspicious
  conf: 0.93

traits:
  - id: miner-found-and-blocked-status
    desc: Rival miner blocked status string
    conf: 0.95
    if:
      type: text
      exact: '<ok>Miner is found and blocked: '

  - id: search-other-miners-status
    desc: Rival miner search status string
    if:
      type: text
      exact: Search and other miners ...

  - id: miners-base-obsolete-update-status
    desc: Obsolete miner base update status
    if:
      type: text
      exact: The base of the miners is obsolete, updating ....

composite_rules:
  - id: hashserver-rival-miner-block-then-load
    desc: Blocks rival miners then loads own
    crit: hostile
    conf: 0.98
    all:
      - id: miner-found-and-blocked-status
      - id: objectives/impact/cryptojacking/miner/runtime::start-downloading-miner-status
    any:
      - id: search-other-miners-status
      - id: miners-base-obsolete-update-status
      - id: objectives/impact/cryptojacking/miner/runtime::download-mainer-control-tag
