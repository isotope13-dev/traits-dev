defaults:
  platforms: [windows]
  for: [pe]
  attack: T1496

traits:
  # taskkill-pid-command (micro-behaviors/process/terminate/command) only
  # covers batch/powershell/vbs script forms. A compiled miner loader carries
  # the same taskkill invocation as a literal string embedded in the binary,
  # mirroring the existing native-taskkill-force-image (/F /IM) pattern but
  # for the /PID form.
  - id: native-taskkill-pid-command
    desc: Native binary embeds taskkill by PID command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\btaskkill(\.exe)?\b[^\r\n]{0,80}/f\b[^\r\n]{0,80}/pid\b'

composite_rules:
  - id: miner-loader-taskkill-by-pid
    desc: Miner loader kills processes by PID
    ref: sha256:1fa1e028b2cad5297edcae7d505456d187bdf1bc29acba1e90d17f355951bca7
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/impact/cryptojacking/miner/runtime::spawned-xmrig-status
      - id: native-taskkill-pid-command
    any:
      - id: micro-behaviors/process/enumerate/snapshot::process32-first
      - id: micro-behaviors/communications/ipc/named-pipe::rust-anonymous-pipe-ipc
