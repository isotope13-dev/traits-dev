# Mirai-family bots walk /proc/<pid>/cmdline and terminate any process whose
# command line matches an embedded banlist of downloader utilities (wget, tftp,
# curl, ftp) and login/remote-shell programs (login, telnetd, rlogin, nc,
# netcat, socat). The banlist table is the discriminating leg; kill-syscall and
# cmdline evidence turn the table into termination behavior.
defaults:
  platforms: [linux, unix]
  for: [elf]
composite_rules:
  - id: iot-tool-banlist-process-killer
    desc: IoT bot kills downloader and login-shell processes via cmdline banlist
    crit: hostile
    conf: 0.97
    attack: T1562.001,T1489
    mbc: B0030
    all:
      - id: micro-behaviors/fs/proc/info/cmdline::iot-tool-banlist-cmdline-table
      - id: micro-behaviors/fs/proc/cmdline
      - id: micro-behaviors/process/control/signal::iot-linux-kill-syscall
