# The table, procfs references and kill syscall can identify a bot's process
# interference profile, but their co-occurrence does not prove data flow.
defaults:
  platforms: [unix]
  for: [elf]
composite_rules:
  - id: iot-tool-banlist-process-killer
    desc: IoT tool banlist with procfs cmdline and kill syscall
    crit: hostile
    conf: 0.97
    attack: T1562.001,T1489
    mbc: B0030
    all:
      - id: micro-behaviors/fs/proc/info/cmdline::iot-tool-banlist-cmdline-table
      - id: micro-behaviors/fs/proc/cmdline
      - id: micro-behaviors/process/control/signal::iot-linux-kill-syscall
