defaults:
  for: [elf]
  attack: T1057,T1562.001
  mbc: B0025

composite_rules:
  - id: arm-proc-socket-owner-killer
    desc: ARM binary kills processes that own TCP sockets
    crit: hostile
    conf: 0.99
    platforms: [linux]
    arch: [arm]
    all:
      - id: micro-behaviors/fs/proc/socket-owner::proc-socket-owner-path-fragments
      - id: micro-behaviors/process/terminate/signal::arm-eabi-kill-syscall

  - id: android-tv-procfs-process-killer
    desc: Android TV-masquerading bot enumerates and kills processes
    crit: hostile
    conf: 0.99
    platforms: [android]
    all:
      - id: objectives/evasion/masquerade/process/name::android-tv-process-masquerade-set
      - id: micro-behaviors/fs/directory/readdir::readdir-opendir
      - id: micro-behaviors/fs/proc/info/pid::process-pid-exe-template
      - id: micro-behaviors/process/terminate/signal::kill
