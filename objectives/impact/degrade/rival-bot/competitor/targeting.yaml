defaults:
  platforms:
    - unix
    - android
    - ios
  for:
    - elf
    - shell
traits:
  - id: mirai-targeting
    desc: Mirai botnet targeting
    crit: suspicious
    conf: 0.8
    if:
      type: text
      substr: mirai-variant
    attack: T1561
  - id: watchdog-targeting-kill
    desc: Watchdog malware kill targeting
    crit: suspicious
    conf: 0.8
    for:
      - shell
    if:
      type: string_literal
      regex: '\b(kill|pkill|killall)\b[^$\n]{0,40}\bwatchdog\b'
    attack: T1561
  - id: watchdog-targeting-wd
    desc: Watchdog malware wd_watchdog targeting
    crit: suspicious
    conf: 0.8
    for:
      - shell
    if:
      type: string_literal
      regex: '\b(kill|pkill|killall)\b.{0,40}wd_watchdog\b'
    attack: T1561
  - id: update-process-targeting
    desc: Fake update process targeting
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: killall.{0,100}(update|updater)
  - id: deleted-process-targeting
    desc: Target deleted/hidden processes
    crit: suspicious
    conf: 0.85
    if:
      type: text
      substr: '| grep -E ''/tmp/|/dev/shm/'''
    attack: T1070.003
  - id: python-wallet-process-target
    desc: Python targets Monero wallet apps
    crit: suspicious
    conf: 0.97
    for: [python]
    if:
      type: text
      regex: '(?is)psutil\.process_iter\(\)[\s\S]{0,260}(feather|monero)[\s\S]{0,120}\.kill\(\)'
composite_rules:
  - id: named-miner-targeting
    desc: Named cryptocurrency miner targeting
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/process/info/name::cpuminer-process-name
      - id: micro-behaviors/process/info/name::minerd-process-name
  - id: competing-miner-targeting
    desc: Competing cryptocurrency miner targeting
    crit: suspicious
    conf: 0.95
    attack: T1489
    needs: 2
    any:
      - id: micro-behaviors/process/terminate/command::xmrig-termination-command
      - id: micro-behaviors/communications/blockchain/mining::cryptonight-str
  - id: competing-botnet-targeting
    desc: Competing botnet targeting
    crit: suspicious
    conf: 0.85
    attack: T1561
    any:
      - id: mirai-targeting
      - id: watchdog-targeting-kill
      - id: watchdog-targeting-wd
  - id: malware-killing-activity
    desc: Generic malware killing activity
    crit: suspicious
    conf: 0.8
    attack: T1070.003
    needs: 2
    any:
      - id: micro-behaviors/process/terminate/kill::pkill-force
      - id: deleted-process-targeting
  - id: comprehensive-malware-elimination
    desc: Comprehensive competing malware elimination
    crit: hostile
    conf: 0.9
    attack: T1561
    mbc: E1001
    needs: 3
    any:
      - id: micro-behaviors/process/enumerate/grep::ps-grep-targeting
      - id: competing-miner-targeting
      - id: competing-botnet-targeting
      - id: malware-killing-activity
  - id: elf-rival-miner-process-kill-list
    desc: Native ELF combines process signaling, proc cmdline, and miner names
    crit: suspicious
    conf: 0.85
    attack: T1489
    for: [elf]
    all:
      - id: micro-behaviors/process/control/signal::kill-syscall
      - id: micro-behaviors/fs/proc/info/cmdline::native-proc-pid-cmdline-path
      - id: micro-behaviors/process/info/name::xmrig-product
      - id: micro-behaviors/process/info/name::cpuminer-process-name
      - id: micro-behaviors/process/info/name::minerd-process-name
  - id: procfs-targeted-kill-loop
    for: [shell]
    desc: Procfs targeted malware termination loop
    crit: hostile
    conf: 0.99
    mbc: E1001
    all:
      - id: micro-behaviors/fs/proc/info/listing::shell-proc-pid-executable-loop
      - id: micro-behaviors/fs/path/temp::shell-case-temp-directory-arm
      - id: micro-behaviors/process/terminate/command::kill-force
    near_lines: 30
  - id: python-wallet-process-killer
    desc: Python kills Monero wallet processes to access their files
    crit: hostile
    conf: 0.99
    attack: T1562.001,T1005
    for: [python]
    near_lines: 90
    all:
    - id: micro-behaviors/process/enumerate/psutil::psutil-process-iter-call
    - id: micro-behaviors/process/terminate/kill::python-process-kill-call
    - id: python-wallet-process-target
