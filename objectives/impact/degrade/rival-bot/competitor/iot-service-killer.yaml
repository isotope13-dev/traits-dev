defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.9

traits:
  - id: force-kill-embedded-service-set
    desc: Force-kills embedded service processes
    crit: suspicious
    conf: 0.96
    attack: T1562.001
    if:
      type: text
      regex: '\b(killall|pkill)\s+-9\s+(busybox|telnetd)\s+(busybox|telnetd)\b'

  - id: rival-process-termination-status
    desc: Reports rival-process termination
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)\bkill(ed|ing)\s+(a\s+)?rival(\s+(process|pid))?\b.{0,48}\bexe(cutable)?\b'

composite_rules:
  - id: embedded-bot-rival-killer
    desc: IoT bot kills services after TCP-state inspection
    crit: hostile
    conf: 0.99
    attack: T1562.001,T1046
    mbc: B0030
    all:
      - id: force-kill-embedded-service-set
      - id: micro-behaviors/fs/path/binary::bin-busybox-path
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/os/service/daemon::telnetd

  - id: native-arm-cron-systemd-interference
    desc: ARM IoT implant manipulates cron while installing systemd persistence
    crit: hostile
    conf: 0.99
    attack: T1562.001,T1543.002
    mbc: B0030
    all:
      - id: micro-behaviors/os/service/unit-field::native-unit-template
      - id: metadata/arch/arm::arm
      - id: micro-behaviors/os/service/control::native-systemd-unit-name
      - id: micro-behaviors/os/service/config::native-cron-directory-path

  - id: procfs-rival-bot-process-killer
    desc: Enumerates procfs and kills processes identified as rival bots
    crit: hostile
    conf: 0.995
    attack: T1057,T1562.001
    mbc: B0030
    all:
      - id: rival-process-termination-status
      - id: micro-behaviors/fs/proc/info/pid::process-pid-exe-template
      - id: micro-behaviors/fs/proc/info/pid::process-pid-comm-template
      - id: micro-behaviors/process/control/signal::mips-o32-kill-syscall-le

  - id: iot-dvr-competitor-killer
    desc: IoT bot with DVR competitor process termination
    crit: hostile
    conf: 0.98
    attack: T1531,T1046
    mbc: B0025
    all:
      - id: micro-behaviors/fs/path/application/executable::dvr-platform-executable-references
      - id: micro-behaviors/fs/proc/cmdline::process-pid-cmdline-format
    any:
      - id: micro-behaviors/process/control/signal::arm-eabi-kill-signal-syscall
      - id: micro-behaviors/process/info/name::watchdog-token
      - id: micro-behaviors/fs/proc/info/path::proc-exe-fragment-cluster
