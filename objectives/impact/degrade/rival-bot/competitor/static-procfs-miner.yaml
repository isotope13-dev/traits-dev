composite_rules:
- id: static-procfs-miner-eviction
  desc: IoT procfs bot evicts competing miners
  crit: hostile
  conf: 0.995
  attack: T1057,T1562.001
  mbc: B0030
  for: [elf]
  platforms: [linux, android]
  all:
  - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
  - id: micro-behaviors/fs/proc/info/path::process-inspection-path-cluster
  - id: objectives/impact/degrade/rival-bot/competitor::cpuminer-targeting
  - id: objectives/impact/degrade/rival-bot/competitor::minerd-targeting
  any:
  - id: micro-behaviors/process/terminate/command::kill-force
  - id: micro-behaviors/process/terminate/signal::arm-oabi-kill-syscall
