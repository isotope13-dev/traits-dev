defaults:
  platforms: [linux]
  for: [elf]

composite_rules:
  - id: loader-killer-port-takeover
    desc: Loader killer removes droppers and holds killed owners' TCP ports
    crit: hostile
    conf: 0.98
    attack: T1562.001,T1489
    all:
      - id: micro-behaviors/fs/delete/file/status::loader-watch-removal-report
      - id: micro-behaviors/communications/socket/bind/status::port-hold-kill-report
      - id: micro-behaviors/fs/proc/socket-owner::tcp-table-pid-fd-inode-paths
      - id: micro-behaviors/process/control/signal::iot-linux-kill-syscall
