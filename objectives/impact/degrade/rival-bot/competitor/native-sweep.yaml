defaults:
  platforms: [linux]
  for: [elf]
  attack: T1489
traits:
  - id: killer-sweep-count-status
    desc: Reports a killer sweep and killed-process count
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)killer sweep:[ \t]*%[udi] killed:'
composite_rules:
  - id: taskable-bot-process-killer
    desc: Packet-attack bot sweeps procfs and kills competing processes
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/botnet/dispatch::text-tasked-packet-attack-bot
      - id: killer-sweep-count-status
      - id: micro-behaviors/fs/proc/info/pid::process-pid-exe-template
      - id: micro-behaviors/fs/proc/info/pid::process-pid-comm-template
      - id: micro-behaviors/process/info/name::minerd-process-name
    any:
      - id: micro-behaviors/process/control/signal::kill-syscall
      - id: micro-behaviors/process/terminate/signal::i386-vdso-kill-wrapper
      - id: micro-behaviors/process/terminate/signal::powerpc-kill-syscall
