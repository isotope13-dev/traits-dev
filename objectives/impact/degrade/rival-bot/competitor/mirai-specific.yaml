defaults:
  crit: suspicious
  for:
  - elf
  platforms:
  - linux
traits:
- id: kill-target-syslogd
  desc: Syslog daemon path reference
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: /sbin/syslogd
- id: kill-target-ntpd
  desc: NTP daemon path reference
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: /usr/sbin/ntpd
- id: kill-target-udhcpc
  desc: DHCP client path reference
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: /sbin/udhcpc
- id: kill-target-tftp
  desc: TFTP utility reference
  crit: component
  conf: 0.5
  if:
    type: text
    exact: tftp
composite_rules:
- id: mirai-competitor-kill-list
  desc: Mirai competitor process kill list
  crit: suspicious
  conf: 0.88
  attack: T1562,T1562.001
  needs: 8
  any:
  - id: micro-behaviors/os/service/remote::sshd-path
  - id: micro-behaviors/os/service/daemon::telnetd
  - id: metadata/lang/source/naming/target::httpd-name-reference
  - id: micro-behaviors/os/service/daemon::crond-executable-path
  - id: kill-target-syslogd
  - id: kill-target-ntpd
  - id: micro-behaviors/fs/path/binary::sbin-init-path-reference
  - id: kill-target-udhcpc
  - id: micro-behaviors/communications/http/download/wget::wget-cmd
  - id: micro-behaviors/communications/http/curl::curl-command-url-or-option
  - id: kill-target-tftp
  unless:
  - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-apko-binary
- id: mirai-botkill-behavior
  desc: Mirai botnet competitor killing behavior
  crit: hostile
  conf: 0.92
  mbc: B0030
  attack: T1562.001
  all:
  - id: mirai-competitor-kill-list
  any:
  - id: micro-behaviors/fs/proc/info/path::proc-net-tcp

- id: native-mips-watchdog-killer
  desc: MIPS watchdog bot with competitor kill list
  crit: hostile
  conf: 0.99
  mbc: B0025
  attack: T1562.001
  platforms: [linux, android]
  arch: [mips]
  all:
  - id: mirai-competitor-kill-list
  - id: micro-behaviors/process/control/signal::mips-o32-kill-syscall-be
  - id: micro-behaviors/fs/path/device/special::watchdog-device
  - id: micro-behaviors/fs/proc/info/path::proc-net-tcp

- id: watchdog-backed-process-killer
  desc: Watchdog-backed process killer
  crit: hostile
  conf: 0.99
  mbc: B0030
  attack: T1562.001
  all:
  - id: micro-behaviors/process/lifecycle/supervise::watchdog-monitor-process
  - id: micro-behaviors/fs/path/device/special::multi-watchdog-device-cluster
  - id: micro-behaviors/fs/proc/info/pid::process-pid-exe-template
  - id: micro-behaviors/process/control/signal::posix-kill-symbol

- id: procfs-watchdog-rival-process-killer
  desc: Procfs watchdog bot with direct kill syscall
  crit: hostile
  conf: 0.98
  attack: T1562.001,T1046
  mbc: B0025
  all:
  - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
  - id: micro-behaviors/fs/path/device/special::multi-watchdog-device-cluster
  - id: micro-behaviors/process/control/signal::iot-linux-kill-syscall
  - id: micro-behaviors/fs/proc/exe::process-self-exe-path
  unless:
  - id: well-known/tool/detection/
  - id: metadata/signed/platform/
- id: static-elf-rival-miner-proc-bot
  arch: [mips]
  desc: ELF miner names, procfs, and SIGKILL call
  crit: hostile
  conf: 0.95
  attack: T1489,T1049
  mbc: B0030
  all:
  - id: micro-behaviors/process/info/name::cpuminer-process-name
  - id: micro-behaviors/process/info/name::minerd-process-name
  - id: micro-behaviors/process/info/name::xmrig-product
  - id: micro-behaviors/process/control/signal::iot-linux-kill-syscall
  - id: metadata/binary/instruction/operand::mips-call-argument-nine
  - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
  - id: metadata/binary/linking/dynamic::elf-needed-libs-zero
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/sysadmin/unix-benign/
  - id: metadata/path::test-directory-component
