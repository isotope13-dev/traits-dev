defaults:
  crit: suspicious
  for:
  - elf
  platforms:
  - linux
traits:
- id: kill-target-syslogd
  desc: Syslog daemon path reference
  crit: component
  conf: 0.6
  if:
    type: text
    substr: /sbin/syslogd
- id: kill-target-ntpd
  desc: NTP daemon path reference
  crit: component
  conf: 0.6
  if:
    type: text
    substr: /usr/sbin/ntpd
- id: kill-target-init
  desc: Init process path reference
  crit: component
  conf: 0.65
  if:
    type: text
    substr: /sbin/init
- id: kill-target-udhcpc
  desc: DHCP client path reference
  crit: component
  conf: 0.6
  if:
    type: text
    substr: /sbin/udhcpc
- id: kill-target-tftp
  desc: TFTP utility reference
  crit: component
  conf: 0.5
  if:
    type: text
    exact: tftp
composite_rules:
- id: mirai-competitor-kill-list
  desc: Mirai competitor process kill list
  crit: suspicious
  conf: 0.88
  mbc: T1562
  attack: T1562.001
  needs: 8
  any:
  - id: micro-behaviors/os/service/remote::sshd-path
  - id: micro-behaviors/os/service/daemon::telnetd
  - id: micro-behaviors/os/service/daemon::httpd
  - id: objectives/evasion/masquerade/process/name::fake-crond-path
  - id: kill-target-syslogd
  - id: kill-target-ntpd
  - id: kill-target-init
  - id: kill-target-udhcpc
  - id: micro-behaviors/communications/http/download/curl::wget-cmd
  - id: micro-behaviors/communications/http/download/curl::curl-cmd
  - id: kill-target-tftp
  unless:
  - id: well-known/tool/sysadmin/alpine-packages::alpine-apko-binary
- id: mirai-botkill-behavior
  desc: Mirai botnet competitor killing behavior
  crit: hostile
  conf: 0.92
  mbc: B0030
  attack: T1562.001
  all:
  - id: mirai-competitor-kill-list
  any:
  - id: objectives/discovery/network/scan/proc::scanner

- id: native-mips-watchdog-killer
  desc: MIPS watchdog bot with competitor kill list
  crit: hostile
  conf: 0.99
  mbc: B0025
  attack: T1562.001
  platforms: [linux, android]
  arch: [mips]
  all:
  - id: mirai-competitor-kill-list
  - id: micro-behaviors/os/syscall/raw::mips-o32-kill-syscall-be
  - id: micro-behaviors/fs/path/device/special::watchdog-device
  - id: micro-behaviors/fs/proc/info/path::proc-net-tcp

- id: watchdog-backed-process-killer
  desc: Watchdog-backed process killer
  crit: hostile
  conf: 0.99
  mbc: B0030
  attack: T1562.001
  all:
  - id: micro-behaviors/process/lifecycle/supervise::watchdog-monitor-process
  - id: micro-behaviors/fs/path/device/special::multi-watchdog-device-cluster
  - id: micro-behaviors/fs/proc/info/pid::process-pid-exe-template
  - id: micro-behaviors/process/terminate/signal::kill
