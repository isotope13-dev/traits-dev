defaults:
  platforms:
    - unix
    - android
    - ios
  attack: T1562
traits:
  - id: mirai-botnet-marker
    desc: Botnet marker near Mirai family name
    crit: component
    conf: 0.85
    for: [elf, shell, scripts, binaries]
    if:
      type: text
      word: botnet
  - id: update-agent-target
    desc: Targets sysupdate process for termination
    crit: notable
    conf: 0.8
    for: [elf, shell, scripts, binaries]
    if:
      type: text
      regex: '(?i)\b(kill(all)?|pkill|terminate|stop)\b[^\r\n]{0,80}\bsysupdate\b'
    unless:
      - id: well-known/app/infrastructure/systemd::legitimate-systemd-helper-basename
      - id: well-known/app/infrastructure/systemd::container-runtime-component-basename
      - id: well-known/lib/native/systemd::systemd-shared-library
      - id: metadata/document/html::html-root-at-start
  - id: competing-malware-kill-log
    desc: Reports killing a competing malware process
    crit: notable
    conf: 0.99
    for: [elf, macho]
    if:
      type: text
      regex: '(?i)\bkilled\s+competing\s+malware\s*:'
  - id: process-killer-label
    desc: Native process-killer status labels
    crit: notable
    conf: 0.92
    for: [elf]
    if:
      type: text
      regex: '(?i)\[[^\]]{0,32}killer[^\]]{0,32}\]\s+killed\s+process\s*:'
    count_min: 2
  - id: proc-maps-kill-loop
    desc: Procfs map filter then forced kill
    crit: notable
    conf: 0.94
    for: [elf]
    if:
      type: raw
      regex: '(?s)/proc/(%[sd]|[0-9]{1,10})/maps.{0,512}\bkill\s+-9\b'
  - id: proc-deleted-maps-kill-loop
    desc: Procfs deleted-image scan then forced kill
    crit: notable
    conf: 0.96
    for: [elf]
    if:
      type: raw
      regex: '(?s)/proc/(%[sd]|[0-9]{1,10})/maps.{0,512}\(deleted\).{0,256}\bkill\s+-9\b'
  - id: proc-glob-maps-kill-loop
    desc: Procfs numeric-glob map scan then forced kill
    crit: notable
    conf: 0.96
    # The bracketed `[0-9]*` glob is shell syntax: loader scripts walk
    # /proc/[0-9]* and kill PIDs whose maps lack library mappings. Keep elf
    # for compiled bots that embed the same scan as a format string.
    for: [elf, shell]
    if:
      type: text
      regex: '(?s)/proc/\[0-9\]\*.{0,700}maps.{0,300}\bkill\s+-9\b'
composite_rules:
  - id: mirai-bot-target
    desc: Mirai botnet targeting marker
    crit: notable
    conf: 0.85
    for: [elf, shell, scripts, binaries]
    all:
      - id: micro-behaviors/process/info/name::mirai-token
      - id: mirai-botnet-marker
    near_bytes: 256
  - id: deleted-process-kill-methods
    desc: Deleted process kill methods
    crit: suspicious
    conf: 0.88
    any:
      - id: objectives/evasion/self-delete/process::pkill-deleted-pattern
      - id: objectives/evasion/self-delete/process::proc-exe-deleted-search
    unless:
      - id: well-known/app/utility/cmdchamp/
  # Executable-name references, procfs inspection and kill diagnostics
  # co-occur. Require a termination API as well; architecture names can be
  # whitelist entries and do not establish payload distribution.
  - id: multiarch-bot-procfs-rival-killer
    desc: Procfs rival killer with multiarch exclusions and SIGKILL
    crit: hostile
    conf: 0.96
    attack: T1057,T1489
    for: [elf]
    platforms: [linux]
    all:
      - id: micro-behaviors/fs/path/binary::repeated-architecture-suffixed-executable-names
      - id: micro-behaviors/process/terminate/kill::killed-process-log
      - id: micro-behaviors/fs/proc/info/path::proc-exe-fragment-cluster
      - id: micro-behaviors/fs/proc/memory::process-variable-pid-maps
      - id: micro-behaviors/process/terminate/kill::logged-sigkill-call-sequence
    any:
      - id: micro-behaviors/process/control/signal::arm-eabi-kill-signal-syscall
      - id: micro-behaviors/process/control/signal::iot-linux-kill-syscall
      - id: micro-behaviors/process/control/signal::posix-kill-symbol
    unless:
      - id: well-known/tool/detection/
      - id: metadata/signed/platform/

  - id: proc-net-rival-process-kill
    desc: Kills network-active rival processes
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/process/terminate/kill::killed-process-log
    any:
      - id: micro-behaviors/fs/proc/info/exe::process-pid-exe
      - id: micro-behaviors/fs/proc/info/path::proc-exe-fragment-cluster

  - id: iot-proc-net-rival-killer
    desc: IoT bot kills network-active rival processes with direct kill syscall
    crit: hostile
    conf: 0.98
    attack: T1562.001,T1046
    mbc: B0025
    for: [elf]
    platforms: [linux, unix]
    all:
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/process/terminate/kill::killed-process-log
      - id: micro-behaviors/process/control/signal::iot-linux-kill-syscall
    unless:
      - id: well-known/tool/detection/
      - id: metadata/signed/platform/
  - id: proc-enumeration-process-killer
    desc: Procfs process enumeration with native killer telemetry
    # Building block for watchdog-backed and related rival-killer composites.
    # Alone it is strong suspicious telemetry; the hostile umbrella adds the
    # hardware-watchdog (or other) intent leg.
    crit: suspicious
    conf: 0.97
    attack: T1562.001
    mbc: B0025
    for: [elf]
    all:
      - id: micro-behaviors/fs/proc/info/path::process-inspection-path-cluster
      - id: micro-behaviors/process/terminate/kill::killed-process-log
      - id: process-killer-label
  - id: procfs-competing-malware-killer
    desc: Procfs process enumerator kills competing malware
    crit: hostile
    conf: 0.99
    attack: T1562.001,T1057
    mbc: B0025
    for: [elf]
    all:
      - id: proc-enumeration-process-killer
      - id: competing-malware-kill-log
  - id: proc-map-filter-rival-killer
    desc: Procfs network/process inspection with hidden-image process killing
    crit: hostile
    conf: 0.98
    attack: T1562.001,T1046
    mbc: B0025
    for: [elf]
    all:
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/fs/proc/info/pid::process-pid-exe-template
    any:
      - id: proc-maps-kill-loop
      - id: proc-deleted-maps-kill-loop
      - id: proc-glob-maps-kill-loop

  - id: native-procfs-kill-loop
    desc: Native procfs process scan with direct kill syscall
    crit: hostile
    conf: 0.99
    attack: T1562.001,T1057
    mbc: B0025
    for: [elf]
    all:
      - id: micro-behaviors/fs/proc/info/path::process-inspection-path-cluster
      - id: micro-behaviors/process/control/signal::x86-64-kill-syscall
      - id: process-killer-label
