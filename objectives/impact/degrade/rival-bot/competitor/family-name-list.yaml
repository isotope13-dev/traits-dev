defaults:
  platforms: [linux]
  for: [elf]
  attack: T1562.001

composite_rules:
  # A kill list of rival bots is stored as bare family names.  Five distinct
  # families in one binary is the table itself; one or two names are routinely
  # mentioned by security tooling, so the threshold stays above that.
  - id: rival-bot-family-name-list
    desc: ELF embeds names of several competing IoT botnet families
    crit: suspicious
    conf: 0.93
    any:
      - id: micro-behaviors/process/info/name::kaiten-name
      - id: micro-behaviors/process/info/name::gafgyt-process-name-reference
      - id: micro-behaviors/process/info/name::mirai-token
      - id: micro-behaviors/process/info/name::kimwolf-process-name-reference
      - id: micro-behaviors/process/info/name::aisuru-process-name-reference
      - id: micro-behaviors/process/info/name::qbot-process-name-reference
      - id: micro-behaviors/process/info/name::echobot-process-name-reference
      - id: micro-behaviors/process/info/name::bashlite-process-name-reference
    needs: 5
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
