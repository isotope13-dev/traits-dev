defaults:
  platforms: [linux]
  for: [elf]
  attack: T1562.001

traits:
  - id: mirai-rival-name-table-lead
    desc: Mirai-qbot rival table lead
    crit: component
    conf: 0.97
    if:
      type: hex
      section: .rodata
      pattern: "6D 69 72 61 69 00 71 62 6F 74 00"

  - id: mozi-rival-name-table-tail
    desc: Mozi-dark_nexus rival table tail
    crit: component
    conf: 0.97
    if:
      type: hex
      section: .rodata
      pattern: "6D 6F 7A 69 00 64 61 72 6B 5F 6E 65 78 75 73 00"

  - id: xor22-rival-loader-tag-pair
    desc: Adjacent XOR-0x22 rival-loader signature strings
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .rodata
      pattern: '13 11 11 15 71 4D 50 43 6E 6D 63 66 67 70 22 [0-8] 6C 4B 65 65 47 70 46 12 4C 49 51 13 11 11 15 22'

composite_rules:
  - id: iot-bot-rival-name-table
    desc: Null-separated IoT rival-bot process name table
    crit: notable
    conf: 0.99
    all:
      - id: mirai-rival-name-table-lead
      - id: mozi-rival-name-table-tail
  - id: xor-mirai-rival-signature-table
    desc: XOR rival-loader signatures with Mirai killer function
    crit: notable
    conf: 0.98
    all:
      - id: xor22-rival-loader-tag-pair
      - id: metadata/binary/symbols/name/token::mirai-rival-killer-symbol
