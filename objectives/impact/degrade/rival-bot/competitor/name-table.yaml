defaults:
  platforms: [linux]
  for: [elf]
  attack: T1562.001

traits:
  - id: mirai-rival-name-table-lead
    desc: Mirai-qbot rival table lead
    crit: component
    conf: 0.97
    if:
      type: hex
      section: .rodata
      pattern: "6D 69 72 61 69 00 71 62 6F 74 00"

  - id: mozi-rival-name-table-tail
    desc: Mozi-dark_nexus rival table tail
    crit: component
    conf: 0.97
    if:
      type: hex
      section: .rodata
      pattern: "6D 6F 7A 69 00 64 61 72 6B 5F 6E 65 78 75 73 00"

  - id: gafgyt-rival-name-token
    desc: Gafgyt rival process name token
    crit: component
    conf: 0.97
    if:
      type: text
      word: gafgyt
      section: rodata

  - id: mirai-arch-rival-name-token
    desc: Mirai architecture-specific rival name
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '\bmirai\.(arm|mips|mpsl)\b'
      section: rodata

composite_rules:
  - id: iot-bot-rival-name-table
    desc: Null-separated IoT rival-bot process name table
    crit: notable
    conf: 0.99
    all:
      - id: mirai-rival-name-table-lead
      - id: mozi-rival-name-table-tail

  - id: gafgyt-mirai-arch-rival-name-table
    desc: Mirai-architecture and Gafgyt rival name table
    crit: notable
    conf: 0.99
    all:
      - id: mirai-arch-rival-name-token
      - id: gafgyt-rival-name-token
