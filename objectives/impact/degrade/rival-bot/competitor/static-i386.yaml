defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86]
composite_rules:
  - id: static-i386-miner-eviction
    desc: Procfs miner blacklist with signal-nine calls and a kill wrapper
    crit: hostile
    conf: 0.97
    attack: T1489
    all:
      - id: micro-behaviors/process/terminate/signal::i386-vdso-kill-wrapper
      - id: micro-behaviors/process/terminate/signal::i386-stack-signal-nine-call
      - id: micro-behaviors/process/info/name::xmrig-product
      - id: micro-behaviors/process/info/name::cpuminer-process-name
      - id: micro-behaviors/process/info/name::minerd-process-name
      - id: micro-behaviors/fs/proc/socket-owner::proc-pid-cmdline-suffix
      - id: micro-behaviors/fs/path/device/special::multi-watchdog-device-cluster
      - id: micro-behaviors/os/autorun/cron::shell-stdin-install
