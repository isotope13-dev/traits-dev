defaults:
  platforms: [linux]
  for: [elf]
  attack: T1562.001
  mbc: B0024
composite_rules:
  - id: system-daemon-exclusion-set
    desc: Process walker embeds system-daemon exclusions
    # Daemon exclusions alone are not proof of a killer; keep as suspicious
    # evidence. Hostile rival-killer composites add proc enumeration / kill
    # telemetry on top.
    crit: suspicious
    conf: 0.95
    # Implants that walk /proc and kill rival processes ship a hardcoded
    # allowlist of legitimate Linux service daemons to NOT terminate.
    # Five+ distinct system-daemon paths paired with broad /proc/<pid>
    # enumeration form the allowlist shape used by process killers. The
    # absence of a kill leg keeps this evidence suspicious rather than hostile.
    all:
      - id: micro-behaviors/fs/proc/info/path::full-pid-attribute-walk
    needs: 5
    any:
      - id: micro-behaviors/os/service/daemon::daemon-path-snapd
      - id: micro-behaviors/os/service/daemon::daemon-path-fwupd
      - id: micro-behaviors/os/service/daemon::daemon-path-boltd
      - id: micro-behaviors/os/service/daemon::daemon-path-udisksd
      - id: micro-behaviors/os/service/config::networkmanager-daemon-path
      - id: micro-behaviors/os/service/daemon::daemon-path-cupsd
      - id: micro-behaviors/os/service/daemon::daemon-path-accounts
      - id: micro-behaviors/os/service/daemon::daemon-path-packagekit
      - id: micro-behaviors/process/daemonize/service-path::rsyslogd-daemon-path
