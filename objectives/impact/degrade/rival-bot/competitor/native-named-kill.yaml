defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: native-named-rival-sigkill
    desc: Rival-bot names with procfs enumeration and SIGKILL code
    crit: hostile
    conf: 0.98
    attack: T1489
    all:
      - id: micro-behaviors/process/info/name::mirai-token
      - id: micro-behaviors/process/info/name::gafgyt-process-name-reference
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/fs/directory/readdir/language::readdir-readdir
      - id: micro-behaviors/process/control/signal::posix-kill-symbol
      - id: micro-behaviors/process/terminate/kill::named-pid-kill-status
      - id: micro-behaviors/process/terminate/kill::x64-logged-sigkill-call-sequence

  - id: iot-procfs-rival-bot-killer
    desc: IoT bot scans procfs maps for rival bots with direct kill syscall
    crit: hostile
    conf: 0.98
    attack: T1562.001,T1057
    mbc: B0025
    all:
      - id: micro-behaviors/fs/proc/memory::process-variable-pid-maps
      - id: micro-behaviors/fs/proc/cmdline::process-pid-cmdline-format
      - id: micro-behaviors/process/control/signal::iot-linux-kill-syscall
    any:
      - id: micro-behaviors/process/info/name::mirai-token
      - id: micro-behaviors/process/info/name::gafgyt-process-name-reference
      - id: micro-behaviors/process/info/name::bashlite-process-name-reference
      - id: micro-behaviors/process/info/name::mozi-process-name-reference
      - id: micro-behaviors/process/info/name::kaiten-name
      - id: micro-behaviors/process/info/name::qbot-process-name-reference
      - id: micro-behaviors/process/info/name::echobot-process-name-reference
    needs: 3
