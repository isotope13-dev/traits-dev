defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: native-named-rival-sigkill
    desc: Rival-bot names with procfs enumeration and SIGKILL code
    crit: hostile
    conf: 0.98
    attack: T1489
    all:
      - id: micro-behaviors/process/info/name::mirai-token
      - id: micro-behaviors/process/info/name::gafgyt-process-name-reference
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/fs/directory/readdir::readdir-readdir
      - id: micro-behaviors/process/control/signal::posix-kill-symbol
      - id: micro-behaviors/process/terminate/kill::named-pid-kill-status
      - id: micro-behaviors/process/terminate/kill::x64-logged-sigkill-call-sequence
