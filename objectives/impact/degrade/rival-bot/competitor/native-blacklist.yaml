defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: native-blacklist-rival-killer
    desc: Native killer mode with procfs rival-bot blacklists
    crit: hostile
    conf: 0.99
    attack: T1489
    all:
      - id: micro-behaviors/process/terminate/signal::iot-linux-kill-syscall
      - id: micro-behaviors/process/info/name::blacklist-process-comm-diagnostic
      - id: micro-behaviors/process/info/name::blacklist-process-exe-diagnostic
      - id: micro-behaviors/process/argument/option::killer-mode-option
      - id: micro-behaviors/process/info/name::mirai-gafgyt-process-name-set
      - id: micro-behaviors/fs/proc/info/pid::process-pid-comm-template
      - id: micro-behaviors/fs/proc/info/pid::process-pid-exe-template
