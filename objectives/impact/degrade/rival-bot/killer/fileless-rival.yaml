# IoT bots evict rival implants by walking /proc, resolving each process's
# executable link, and signalling the ones that run from a memfd. EDR agents
# hunt fileless processes the same way, so this stays suspicious.
defaults:
  platforms: [linux, android]
  for: [elf]
  attack: T1057,T1489
composite_rules:
  - id: memfd-backed-process-killer
    desc: Kills processes running from memfd images
    crit: suspicious
    conf: 0.88
    all:
      - id: micro-behaviors/fs/proc/exe::memfd-exe-link-prefix
      - id: micro-behaviors/fs/proc/info/pid::process-pid-exe-template
    any:
      - id: micro-behaviors/process/control/signal::kill-syscall
      - id: micro-behaviors/process/control/signal::posix-kill-symbol
    unless:
      - id: well-known/tool/detection/
      - id: metadata/signed/platform/
