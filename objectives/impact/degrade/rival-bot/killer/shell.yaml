# Sweeping the process table for one specific process and killing every match.
# The distinguishing feature against ordinary supervision is what is being
# selected: not a service this script owns and named up front, but whatever is
# currently running under a chosen disguise. That is how one implant clears a
# host of the previous tenant.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1489
  mbc: B0033

traits:
  - id: login-shell-name-process-filter
    desc: Filters processes named as a login shell
    crit: notable
    conf: 0.88
    if:
      # `-bash` (leading hyphen) is the argv[0] a *login* shell is given.
      # Nothing spawns one on purpose, so a script filtering for it is looking
      # at interactive sessions -- or at something that adopted the name to
      # blend in with them.
      type: text
      regex: '(?i)\b(awk|grep|pgrep)\b[^\n]{0,60}-bash\b'

composite_rules:
  - id: login-shell-process-sweep-kill
    desc: Kills every process named as a login shell
    crit: suspicious
    conf: 0.92
    all:
      - id: login-shell-name-process-filter
      - id: micro-behaviors/process/enumerate/shell::ps-aux
      - id: micro-behaviors/process/terminate/command::shell-kill-variable-pid

  - id: multi-attribute-process-sweep-kill
    desc: Kills processes matched on two ps fields
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/process/enumerate/shell::awk-multi-field-process-filter
      - id: micro-behaviors/process/enumerate/shell::ps-aux
      - id: micro-behaviors/process/terminate/command::shell-kill-variable-pid
