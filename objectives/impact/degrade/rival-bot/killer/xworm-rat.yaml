defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1562.001
  mbc: B0033

traits:
  - id: xworm-bot-killer-task-token
    desc: XWorm bot-killer task token
    crit: suspicious
    conf: 0.97
    if:
      type: text
      exact: RunBotKiller
      section: .text

composite_rules:
  - id: xworm-lineage-bot-killer-task
    desc: XWorm bot-killer task with process termination
    crit: hostile
    conf: 0.98
    all:
      - id: xworm-bot-killer-task-token
      - id: micro-behaviors/process/terminate/kill::process-kill-by-id-references
