# C source for a Windows bot killer: routines that scan a process's memory for
# a rival bot, kill the process by PID, and delete the rival's file. Each
# routine name alone is common in cleanup code; the composite needs the bot
# killer name with both the kill and the delete helper.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1489

traits:
  - id: botkiller-routine-name
    desc: Names a bot-killer routine
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bbotkiller_\w{2,24}'

  - id: process-kill-pid-helper
    desc: Declares a kill-process-by-PID helper
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\bprocess_kill\w{0,20}\s*\('

  - id: file-delete-helper
    desc: Declares a delete-file helper routine
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\bfile_delete\w{0,20}\s*\('

composite_rules:
  - id: c-botkiller-rival-removal
    desc: Bot-killer routines kill rival processes and delete their files
    crit: hostile
    conf: 0.9
    all:
      - id: botkiller-routine-name
      - id: process-kill-pid-helper
      - id: file-delete-helper
