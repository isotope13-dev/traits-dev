# A page that hunts an installed content-filter extension and then drives
# the vendor's own endpoints through concealed popups to knock the filter
# out (the Secular-ly technique against Securly: probe
# chrome-extension://<id>/tt-alert.svg for known filter IDs, then
# window.open() a hidden popup per vendor cluster and retarget its location
# through a padded please_wait URL list). Either half alone is neutral —
# support pages probe for extensions, OAuth uses popups — but probing for a
# filter plus driving its endpoints from script is defense impairment
# (T1562.001), not administration: no opt-in, no management API, no restore.
defaults:
  platforms: [windows, unix]
  for: [svg, html]
  attack: T1562.001
composite_rules:
  - id: filter-extension-probe-popup-flood
    desc: Probes filter extension then floods vendor popups
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/url/scheme::chrome-extension-resource-fetch
      - id: micro-behaviors/ui/window/navigation::browser-window-open-text-call
      - id: micro-behaviors/data/property/assign::location-href-write-text
