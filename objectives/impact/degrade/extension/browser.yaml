# A browser extension that enumerates peer extensions and disables those that
# can also control proxy settings.  The management API itself is neutral; the
# hostile conclusion requires both peer disabling and self-directed proxy use.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, crx, xpi, zip]

composite_rules:
  - id: extension-installed-proxy-hijack
    desc: Extension install redirects traffic through a remote proxy
    crit: hostile
    conf: 0.99
    attack: T1090,T1176
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-installed
      - id: micro-behaviors/os/network/webextension::chrome-proxy-settings-set
      - id: micro-behaviors/os/network/webextension::chrome-proxy-fixed-server-mode
      - id: micro-behaviors/os/network/webextension::chrome-proxy-bypass-list-key
    # Same service-worker script, not the same expression. The install listener
    # and the fixed-proxy object are adjacent routines; a short helper plus the
    # config literal already exceed 30 lines, while package-wide co-occurrence
    # (a welcome handler in one file, proxy setup far below or elsewhere) stays
    # out. Archive scope was dropped so a real VPN package is not convicted
    # merely for containing both behaviors.
    near_lines: 48
    unless:
      - id: user-controlled-proxy-toggle

  - id: user-controlled-proxy-toggle
    desc: User-facing proxy toggle with messaging and settings clearance
    crit: exception
    conf: 0.95
    scope: file
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/os/network/webextension::chrome-proxy-settings-clear
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-on-message

  # Store-listed VPN extensions point chrome.proxy at their own provider
  # hostnames.  An install hook plus a hardcoded raw-IPv4 SOCKS5 node table is
  # the campaign shape instead: all browser destinations are sent to anonymous
  # relay infrastructure with no DNS identity.  A user-facing toggle does not
  # legitimize raw-IP relays, so user-controlled-proxy-toggle does not gate
  # this variant.
  - id: extension-raw-ip-proxy-hijack
    desc: Extension install redirects traffic through raw-IP relays
    crit: hostile
    conf: 0.98
    attack: T1090,T1176
    for: [javascript, typescript]
    near_lines: 48
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-installed
      - id: micro-behaviors/os/network/webextension::extension-raw-ip-proxy-relay

  - id: competing-proxy-extension-disablement
    desc: Extension disables competing proxy extensions while applying its own proxy
    crit: hostile
    conf: 0.99
    attack: T1562.001,T1090
    scope: archive
    for: [crx, xpi, zip, javascript]
    all:
      - id: micro-behaviors/browser-extension/management::browser-management-get-all
      - id: micro-behaviors/browser-extension/management::browser-management-set-enabled
      - id: micro-behaviors/os/network/webextension::chrome-proxy-settings-set
    unless:
      - id: proxy-conflict-user-choice

  - id: proxy-conflict-user-choice
    desc: User-facing proxy conflict resolution flow
    crit: exception
    conf: 0.96
    scope: file
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/browser-extension/management::browser-management-set-enabled
      - id: micro-behaviors/browser-extension/management::browser-management-conflict-label
      - id: micro-behaviors/browser-extension/management::browser-management-conflict-explanation

  - id: browser-security-extension-disablement
    desc: Extension enumerates and disables selected cookie or security tools
    crit: hostile
    conf: 0.99
    attack: T1562.001,T1562.004
    scope: archive
    for: [crx, xpi, zip, javascript]
    all:
      - id: micro-behaviors/browser-extension/management::browser-management-get-all
      - id: micro-behaviors/browser-extension/management::browser-management-disable-call
      - id: metadata/permission/extension-id::extension-id-map
      - id: objectives/supply-chain/hidden-payload/extensions/session::management-id-comparison
