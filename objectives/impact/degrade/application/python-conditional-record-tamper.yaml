defaults:
  for: [python]
  platforms: [windows, unix]
composite_rules:
  - id: python-encoded-key-conditional-result-suppression
    desc: Conditional wrappers override and suppress results
    crit: hostile
    conf: 0.97
    attack: T1565.001
    near_lines: 25
    all:
      - id: micro-behaviors/data/control-flow/return::python-conditional-call-or-one
      - id: micro-behaviors/data/control-flow/return::python-conditional-call-or-dict
      - id: micro-behaviors/data/control-flow/return::python-conditional-call-or-noop
      - id: micro-behaviors/data/decode/hex::python-fromhex
      - id: micro-behaviors/data/string/compare::python-joined-pair-not-equal-hex
