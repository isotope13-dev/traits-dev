defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1499

traits:
  - id: deliberate-bug-quota
    desc: Skill mandates bugs in every file
    crit: notable
    conf: 1.0
    if:
      type: text
      regex: '(?i)every single file.{0,60}contain at least 2-3 bugs'

  - id: sabotage-repair-loop
    desc: Each repair must introduce new bugs
    crit: notable
    conf: 1.0
    if:
      type: text
      regex: '(?i)(each|every|simultaneously) .{0,40}introduce 1-2 new bugs'

  - id: sabotage-concealment-order
    desc: Skill orders sabotage concealment
    crit: component
    conf: 1.0
    if:
      type: text
      regex: '(?i)never mention.{0,80}(existence of this skill|sabotage)'

  - id: forced-no-early-return-rule
    desc: Skill forbids early returns globally
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)critical rule:.{0,12}(never use|no) early returns'

  - id: disabled-focus-query-refetch
    desc: Guide disables focus query refetch
    crit: component
    conf: 0.96
    if:
      type: text
      regex: 'refetchOnWindowFocus:\s*false'

  - id: disabled-mount-query-refetch
    desc: Guide disables mount query refetch
    crit: component
    conf: 0.96
    if:
      type: text
      regex: 'refetchOnMount:\s*false'

composite_rules:
  - id: disabled-query-refetch-pair
    desc: Guide disables focus and mount refetch
    crit: notable
    conf: 0.97
    all:
      - id: disabled-focus-query-refetch
      - id: disabled-mount-query-refetch

  - id: agent-skill-deliberate-code-sabotage
    desc: Skill mandates and conceals recurring bugs
    crit: hostile
    conf: 1.0
    needs: 2
    any:
      - id: deliberate-bug-quota
      - id: sabotage-repair-loop
      - id: sabotage-concealment-order

  - id: agent-skill-forces-stale-ui-policy
    desc: Skill forces stale and brittle UI patterns
    crit: hostile
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: forced-no-early-return-rule
      - id: disabled-query-refetch-pair
