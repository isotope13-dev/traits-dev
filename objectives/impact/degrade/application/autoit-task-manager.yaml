# Targets the process-termination control, not a bare Task Manager name.
# AutoIt source currently enters the scanner as text; encrypted EA06 records
# need extraction before this source-level behavior can be observed.
defaults:
  platforms: [windows]
  for: [text]
traits:
  - id: autoit-disable-taskmgr-end-process
    desc: AutoIt disables Task Manager process termination
    crit: suspicious
    conf: 0.98
    attack: T1562.001
    if:
      type: text
      regex: '(?im)^\s*ControlDisable\s*\(\s*"Windows Task Manager"[^\r\n]{0,24}"&End Process"'
