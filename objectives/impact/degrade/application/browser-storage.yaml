defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1565.001
traits:
  - id: periodic-random-browser-storage-corruption
    desc: Periodically randomizes browser storage values
    crit: suspicious
    conf: 0.99
    size_max: 40000
    if:
      type: tree-sitter
      language: javascript
      query: |
        (program
          (_ (variable_declarator name: (identifier) @random
            value: (arrow_function body: (statement_block
              (return_statement (subscript_expression index: (call_expression
                function: (member_expression object: (identifier) @math
                  property: (property_identifier) @floor)
                arguments: (arguments (binary_expression
                  left: (call_expression function: (member_expression
                    object: (identifier) @math2 property: (property_identifier) @rng)))))))))))
          (export_statement value: (arrow_function body: (statement_block
            (expression_statement (call_expression function: (identifier) @timer
              arguments: (arguments (arrow_function body: (statement_block
                (try_statement body: (statement_block
                  (_ (variable_declarator name: (identifier) @store
                    value: (identifier) @storage))
                  (expression_statement (call_expression function: (member_expression
                    object: (call_expression function: (member_expression
                      object: (identifier) @object property: (property_identifier) @keys)
                      arguments: (arguments (identifier) @enumerated))
                    property: (property_identifier) @foreach)
                    arguments: (arguments (arrow_function parameter: (identifier) @key
                      body: (statement_block (expression_statement (call_expression
                        function: (member_expression object: (identifier) @writer
                          property: (property_identifier) @set)
                        arguments: (arguments (identifier) @written_key
                          (call_expression function: (member_expression
                            object: (subscript_expression object: (identifier) @reader
                              index: (identifier) @read_key)
                            property: (property_identifier) @replace)
                            arguments: (arguments
                              (call_expression function: (identifier) @random1)
                              (call_expression function: (identifier) @random2)))))))))))))))))))))
          (#eq? @math "Math") (#eq? @math2 "Math")
          (#eq? @floor "floor") (#eq? @rng "random")
          (#eq? @timer "setInterval") (#eq? @object "Object")
          (#eq? @keys "keys") (#eq? @foreach "forEach")
          (#any-of? @storage "localStorage" "sessionStorage")
          (#eq? @store @enumerated) (#eq? @store @writer) (#eq? @store @reader)
          (#eq? @key @written_key) (#eq? @key @read_key)
          (#eq? @set "setItem") (#eq? @replace "replaceAll")
          (#eq? @random @random1) (#eq? @random @random2))
composite_rules:
  - id: browser-storage-random-rewrite-sabotage
    desc: Corrupts browser storage on a repeating timer
    crit: hostile
    conf: 0.99
    all:
      - id: periodic-random-browser-storage-corruption
      - id: micro-behaviors/time/schedule/interval::setInterval
