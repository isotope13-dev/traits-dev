# A VBScript For loop with a bound in the thousands whose only statement is a
# MsgBox: the user must dismiss each modal dialog in turn, so the session is
# occupied by thousands of popups. Interactive scripts ask once or loop on an
# answer; none show the same dialog a thousand times.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1499

traits:
  - id: vbs-message-box-flood-loop
    desc: Shows a message box thousands of times
    crit: hostile
    conf: 0.94
    if:
      type: text
      regex: '(?im)^\s*For\s+\w+\s*=\s*\d+\s+To\s+\d{4,}[ \t]*\r?\n\s*MsgBox\b[^\n]{0,300}\n\s*Next\b'
