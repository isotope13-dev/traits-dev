defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: cwd-prefix-test
    desc: Tests path prefix with startsWith
    crit: component
    conf: 0.85
    any:
      - id: cwd-call-prefix-test
      - id: named-path-prefix-test
  # IP discovery, a literal allowlisted address and immediate process
  # termination together identify a runtime gate. Each primitive is neutral
  # alone; this combination makes the package unusable from other public IPs.
  - id: public-ip-gated-runtime-exit
    desc: Terminates runtime outside one configured public IP
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
      - id: micro-behaviors/process/exit/terminate::node-process-exit-call
    near_bytes: 1800

  # A package entrypoint that exits when the host working directory is not
  # beneath a fixed hosting path restricts execution to the publisher's
  # chosen service. Require the directory query, prefix check, and exit in
  # the same source file; ordinary cwd inspection does not match.
  - id: working-directory-prefix-lockout
    desc: Exits when runtime is outside a fixed working-directory prefix
    crit: suspicious
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/fs/directory/cwd::process-cwd-call
      - id: cwd-prefix-test
      - id: micro-behaviors/process/exit/terminate::node-process-exit-call
    near_bytes: 300

traits:
  - id: cwd-call-prefix-test
    desc: Tests current directory prefix
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '(?i)process\.cwd\(\)\.startsWith\s*\(\s*[''"`](/[a-z0-9._-]+|[a-z]:[/\\])'
  - id: named-path-prefix-test
    desc: Tests named path or directory prefix
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '(?i)[\w$]*(cwd|path|dir)[\w$]*\.startsWith\s*\(\s*[''"`](/[a-z0-9._-]+|[a-z]:[/\\])'

