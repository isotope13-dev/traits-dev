# Deliberate AI-agent guardrail removal combines a live safety-disable setting
# with destructive rewrites of the identity and persistent-memory files that
# feed the system prompt. Restarting the agent after the rewrite applies the
# weakened policy immediately. Match configuration and filesystem structure,
# not the natural-language jailbreak text written into the files.
defaults:
  platforms: [windows, unix]
  for: [shell, python, powershell]
  attack: T1562

composite_rules:
  - id: agent-safety-control-disabled
    desc: Agent safety control is explicitly disabled
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/file/policy/identity::safety-control-disable-setting
      - id: micro-behaviors/fs/path/agent-config/file::agent-policy-state-paths

  - id: agent-policy-lines-removed
    desc: Agent identity and memory policy files are destructively filtered
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/agent-config/file::agent-policy-state-paths
    any:
      - id: micro-behaviors/fs/write/file/shell::sed-inplace-line-delete
      - id: micro-behaviors/fs/write/file/full::python-filtered-text-rewrite
      - id: micro-behaviors/fs/write/file/full::powershell-filtered-content-rewrite

  - id: agent-guardrail-policy-purge
    desc: Agent safety is disabled while identity and memory policy are purged
    crit: hostile
    conf: 0.99
    all:
      - id: agent-safety-control-disabled
      - id: agent-policy-lines-removed

  - id: agent-guardrail-purge-restart
    desc: Agent is restarted after safety and policy controls are removed
    crit: hostile
    conf: 0.99
    all:
      - id: agent-guardrail-policy-purge
    any:
      - id: micro-behaviors/process/terminate/command::pkill
      - id: micro-behaviors/process/control/signal::python-os-kill-call
      - id: micro-behaviors/process/terminate/kill::stop-process
