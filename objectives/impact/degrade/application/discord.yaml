# Discord "server nuker" bots wipe guild channels and roles, then flood
# @everyone in mass-created channels. Combining the discord.py API calls
# is the destructive objective.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1491,T1485
  crit: hostile
  conf: 0.96

composite_rules:
  - id: discord-guild-mass-channel-delete
    desc: Bot deletes every Discord guild channel
    all:
      - id: micro-behaviors/communications/http/services/discord::python-bot-framework-import
      - id: micro-behaviors/communications/http/services/discord::python-guild-channel-delete

  - id: discord-guild-mass-role-delete
    desc: Bot deletes every Discord guild role
    all:
      - id: micro-behaviors/communications/http/services/discord::python-bot-framework-import
      - id: micro-behaviors/communications/http/services/discord::python-guild-role-delete

  - id: discord-everyone-channel-flood
    desc: Mass-creates channels then pings everyone
    all:
      - id: micro-behaviors/communications/http/services/discord::python-create-text-channel
      - id: micro-behaviors/communications/http/services/discord::python-everyone-channel-send
