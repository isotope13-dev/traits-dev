# Shared-memory sabotage modeled from GreenSection's cross-user section
# corruption primitive. The object names are deliberately not signatures:
# detection rests on opening existing shared state writable, mapping it, and
# filling the mapped region with a nonzero byte pattern.
defaults:
  attack: T1499

composite_rules:
  - id: windows-named-section-bulk-corruption
    desc: Bulk-corrupts an existing writable NT section
    crit: hostile
    conf: 0.99
    platforms: [windows]
    for: [pe, dll, c, cpp, csharp, go, rust]
    all:
      - id: micro-behaviors/mem/create/shared::nt-open-section-api-string
      - id: micro-behaviors/mem/create/shared::section-map-write-access
      - id: micro-behaviors/mem/create/shared::nt-map-view-section-api-string
    any:
      - id: micro-behaviors/mem/c-runtime/functions::nonzero-memset-source

  - id: windows-global-section-size-spray
    desc: Sizes and corrupts a globally named NT section
    crit: hostile
    conf: 0.99
    platforms: [windows]
    for: [pe, dll, c, cpp, csharp, go, rust]
    all:
      - id: windows-named-section-bulk-corruption
      - id: micro-behaviors/mem/create/shared::nt-query-section-api-string
      - id: micro-behaviors/os/kernel/control::base-named-objects-namespace

  - id: posix-shared-memory-bulk-corruption
    desc: Bulk-corrupts an existing writable POSIX shared-memory object
    crit: hostile
    conf: 0.99
    platforms: [unix]
    for: [elf, macho, c, cpp, go, rust]
    all:
      - id: micro-behaviors/mem/create/shared::shm-open-existing-read-write
      - id: micro-behaviors/mem/create/shared::mmap-shared-write-source
      - id: micro-behaviors/mem/c-runtime/functions::nonzero-memset-source

  - id: world-writable-shared-memory-sabotage
    desc: Corrupts and flushes a world-writable shared-memory object
    crit: hostile
    conf: 0.99
    platforms: [unix]
    for: [elf, macho, c, cpp, go, rust]
    all:
      - id: posix-shared-memory-bulk-corruption
      - id: micro-behaviors/fs/file/stat::other-write-mode-constant
      - id: micro-behaviors/mem/create/shared::msync-call
