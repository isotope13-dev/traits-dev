defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1499

traits:
  - id: vbs-abusive-infinite-message-loop
    desc: VBS loops an abusive message box
    crit: hostile
    conf: 0.95
    if:
      type: yara
      source: |
        rule vbs_abusive_infinite_message_loop {
          strings:
            $loop = /\bdo\s*\r?\n\s*msgbox\s*"[^"\r\n]{1,200}"\s*\r?\n\s*loop\b/ nocase
            $claim = /\b(raided|hacked|infected|ransomware)\b/ nocase
          condition:
            all of them
        }
