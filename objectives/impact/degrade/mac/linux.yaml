# Mandatory Access Control (MAC) Degradation - Linux
# Detects attempts to disable or weaken SELinux and AppArmor
# ATT&CK: T1562.001 (Impair Defenses: Disable or Modify Tools)
defaults:
  platforms: [unix, windows]
  crit: suspicious
  attack: "T1562.001"
  for: [shell, elf, python, ruby, go, rust]
traits:
  # === SELinux Manipulation ===
  - id: selinux-setenforce
    desc: Changes SELinux enforcement to permissive mode
    conf: 0.90
    if:
      type: text
      regex: "\\bsetenforce\\s+0\\b"
    unless:
      # Security scanners list `setenforce 0` as a threat signature / test fixture.
      - id: well-known/tool/detection/ai-guardrail/
      - id: well-known/app/system/olares::cli-source-tree
      - id: selinux-toggling-vm-provisioner
      - id: well-known/app/infrastructure/containerd::containerd-vagrant-test-context
      - id: well-known/app/ai/knowledge/animica::rag-documentation-context
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
    downgrade:
      any:
        - id: metadata/package/files/included::install-uninstall-shell-basename
        # A script that also runs `setenforce 1` is toggling enforcement for a
        # bounded window (or exposing the mode as a knob) rather than tearing
        # MAC down -- CI provisioning and container-runtime test harnesses do
        # this around a single step and then restore enforcing.
        - id: micro-behaviors/os/security/selinux::setenforce-enforcing
        - id: well-known/lib/development/mozdevice::mozdevice-library
  - id: selinux-disable
    desc: SELinux disable in config
    conf: 0.90
    if:
      type: text
      regex: "SELINUX\\s*=\\s*disabled"
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/app/system/olares::cli-source-tree
      - id: metadata/package/testing/presence/harness::ruby-spec-file
      - id: well-known/lib/core/specinfra/
      - id: well-known/app/data/ease::installer-script-marker
      - id: well-known/app/storage/clonezilla::drbl-locale-catalog-context
    downgrade:
      any:
        - id: micro-behaviors/os/service/legitimate::installer-script
        - id: metadata/package/files/included::install-uninstall-shell-basename
        - id: well-known/app/infrastructure/fboss::fboss-image-tooling-source
composite_rules:
  # Disposable-VM provisioning toolchains legitimately drop nodes to permissive:
  # K3s on immutable SELinux hosts, Lima/CubeSandbox guest images. Grouped into
  # one benign context so the SELinux rules below carry a single carve-out
  # instead of one per product.
  - id: selinux-toggling-vm-provisioner
    desc: Recognized VM provisioning toolchain that relaxes SELinux
    crit: exception
    conf: 0.95
    any:
      - id: well-known/tool/sysadmin/k3s::k3s-vagrant-provisioner
      - id: well-known/tool/sysadmin/k3s::k3s-skip-selinux-rpm-flag
      - id: well-known/tool/sysadmin/cubesandbox::cubesandbox-source-path
      - id: well-known/tool/sysadmin/virtualization::lima-virtualization-tool

  - id: selinux-disabled-benign-context
    desc: Recognized defensive or test context that relaxes SELinux
    crit: exception
    conf: 0.95
    any:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/app/ai/knowledge/animica::rag-documentation-context
      - id: well-known/app/data/ease::installer-script-marker
      - id: well-known/tool/development/osbuild-composer::osbuild-composer-test-script-context
      - id: well-known/tool/detection/security-remediation::openscap-cis-remediation-script
      - id: well-known/lib/crypto/gokrb5::testenv-bootstrap-script
      - id: selinux-toggling-vm-provisioner
      - id: well-known/app/infrastructure/containerd::containerd-vagrant-test-context

  # SELinux disabled via any method
  - id: selinux-disabled
    desc: SELinux disabled
    crit: suspicious
    conf: 0.95
    any:
      - id: selinux-setenforce
      - id: selinux-disable
      - id: micro-behaviors/os/security/selinux::setsebool-command
    unless:
      - id: selinux-disabled-benign-context
    downgrade:
      any:
        - id: micro-behaviors/os/service/legitimate::installer-script
        - id: metadata/package/files/included::install-uninstall-shell-basename
        - id: micro-behaviors/os/security/selinux::setenforce-enforcing
  # AppArmor disabled via any method. Command observations belong to
  # micro-behaviors/os/security/apparmor; this composite supplies the
  # defense-degradation interpretation.
  - id: package-profile-removal
    desc: Package removes its AppArmor profile during uninstall
    crit: exception
    conf: 0.98
    for: [shell]
    all:
      - id: metadata/build/package/maintainer-scripts::debian-postrm-script-path
      - id: micro-behaviors/os/security/apparmor::profile-remove-command

  - id: apparmor-disabled
    desc: AppArmor disabled
    crit: suspicious
    conf: 0.95
    any:
      - id: micro-behaviors/os/security/apparmor::profile-disable-command
      - id: micro-behaviors/os/security/apparmor::profile-remove-command
      - id: micro-behaviors/os/security/apparmor::service-stop-command
    unless:
      - id: well-known/tool/detection/security-remediation::openscap-cis-remediation-script
      - id: package-profile-removal
      # A defensive scanner naming these commands in its pattern catalog, not running them.
      - id: well-known/tool/detection/pattern-catalog::source-pattern-catalog
  # Both MAC systems disabled
  - id: mac-disabled
    desc: Multiple MAC systems disabled
    crit: hostile
    conf: 0.98
    all:
      - id: selinux-disabled
      - id: apparmor-disabled
    unless:
      - id: well-known/tool/detection/security-remediation::openscap-cis-remediation-script
  # Complete security stack degradation (MAC + Firewall)
  - id: full-security-disable
    desc: Complete security stack disable (MAC + Firewall)
    crit: hostile
    conf: 0.98
    attack: "T1562"
    all:
      - id: objectives/impact/degrade/firewall/
    any:
      - id: selinux-disabled
      - id: apparmor-disabled
    unless:
      # A defensive scanner naming these commands in its pattern catalog, not running them.
      - id: well-known/tool/detection/pattern-catalog::source-pattern-catalog
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/tool/development/osbuild-composer::osbuild-composer-installer-test-path
      - id: well-known/tool/sysadmin/virtualization::lima-virtualization-tool
      - id: micro-behaviors/os/service/legitimate::installer-script
      - id: metadata/package/files/included::install-uninstall-shell-basename
      - id: well-known/app/ai/knowledge/animica::rag-documentation-context
      - id: well-known/tool/detection/security-remediation::openscap-cis-remediation-script
    # The former `downgrade:` listed installer-script and
    # install-uninstall-shell-basename, both of which are already in `unless:`
    # above -- the rule is suppressed outright whenever either matches, so the
    # downgrade could never fire.
