defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: unprofessional-error-marker
    desc: Unprofessional or aggressive error message
    crit: notable
    conf: 0.6
    if:
      type: text
      # Word-bound the slur so identifiers like pushIt(error) do not match.
      regex: (?i)\b(motherfucking|bastard|shit|fuck(ing)?)\W{0,3}error
