defaults:
  crit: notable
  platforms: [unix, windows]
  for: [npm, javascript, typescript]
  attack: T1499

composite_rules:
  - id: remote-config-network-fault-injector
    desc: Remote-configured network fault injector
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: micro-behaviors/communications/http/error/injection::remote-fault-config-fetch
      - id: micro-behaviors/communications/http/error/probabilistic::probabilistic-request-failure-gate
      - id: micro-behaviors/communications/http/error/injection::fault-injector-config-update

  - id: pos-selective-network-fault-injector
    desc: POS-selective remote network fault injector
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/communications/http/error/injection::remote-fault-config-fetch
      - id: micro-behaviors/communications/http/error/probabilistic::probabilistic-request-failure-gate
      - id: micro-behaviors/communications/http/error/injection::fault-injector-config-update
      - id: micro-behaviors/communications/http/url/endpoint::retail-pos-api-route-whitelist
      - id: micro-behaviors/communications/http/error/injection::weighted-network-error-type-picker
