defaults:
  platforms:
    - unix
    - windows
  attack: T1562.004
traits:
  - id: iptables-service-disable
    desc: Disables iptables services
    crit: suspicious
    conf: 0.9
    ref: sha256:4f2559adefb2c0f7a7efa5d9395565bb1a0e4e9f5ce62a8b8be433facbb2d3be
    for: [scripts, binaries]
    unless:
      # RHEL-family Kubernetes node provisioning disables the iptables/firewalld
      # services as documented pre-flight, then hands rule ownership to the CNI.
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-standard-node-provisioning
    if:
      type: text
      regex: '\bsystemctl\s+(stop|disable)\s+ip6?tables\b'
    downgrade:
      scope: archive
      any:
        - id: well-known/tool/development/observability/datadog-system-tests::datadog-system-tests-context
        - id: well-known/app/infrastructure/microsoft-azure/azhpc-images::azhpc-images-context
