# Obfuscated VB6 implant carries the Windows Firewall service registry key
# in feedback-coded form together with registry value-write APIs, the
# registry-route variant of stopping SharedAccess. The encoded key path
# comes from the shared triplet decoder.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: vb6-feedback-firewall-service-tamper
    desc: Obfuscated VB6 implant tampers with the firewall service key
    crit: hostile
    conf: 0.93
    attack: T1562.004,T1027
    all:
      - id: objectives/anti-static/obfuscation/string/encoding::vb6-feedback-triplet-string-decoder
      - id: micro-behaviors/os/registry/service/reference::feedback-coded-sharedaccess-service-key
      - id: micro-behaviors/os/registry/value/write::registry-write-api-chain
