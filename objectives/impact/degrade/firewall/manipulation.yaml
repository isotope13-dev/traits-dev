defaults:
  platforms:
    - linux
    - unix
    - android
    - macos
    - ios
  attack: T1562.004
traits:
  - id: obfuscated-authorizedapps-path
    desc: "obf firewall AuthorizedApplications path"
    crit: suspicious
    conf: 0.94
    platforms:
      - windows
    for:
      - pe
    if:
      type: text
      exact: oePari.recFtutMSrtiipSnsaldzLereiati.eeecllYt.rlPeinvsrnhoCtdryeiSrSaPrdstisedonu.As..cTohmooAtCc.warsrSc.SAaElaelfp
      section: .rdata
composite_rules:
  - id: firewall-comprehensive-abuse
    desc: Complete firewall manipulation pattern
    crit: notable
    conf: 0.9
    for:
      - elf
      - shell
    mbc: E1562
    # The directory reference here included this rule itself. "Comprehensive
    # abuse" means the destructive operations specifically -- disabling,
    # flushing or denying -- not every firewall-adjacent string in the tree.
    any:
      - id: fortios-policy-disable
      - id: fortios-deny-any-policy
      - id: go-firewall-disable-helper
      - id: shell-pfctl-ipfw-flush
      - id: shell-route-interface-down
  - id: obfuscated-authorizedapps-tamper
    desc: Obfuscated firewall exception tampering
    crit: suspicious
    conf: 0.95
    platforms:
      - windows
    for:
      - pe
    all:
      - id: obfuscated-authorizedapps-path
      - id: objectives/anti-static/obfuscation/string/hijack-gen::layered-string-obfuscation
