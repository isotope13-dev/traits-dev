defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1562.004

traits:
  - id: pe-netsh-firewall-profiles-off
    desc: Netsh all-profile firewall-disable command text
    crit: notable
    conf: 0.92
    if:
      type: text
      exact: "Advfirewall set allprofiles state off"
      case_insensitive: true

composite_rules:
  - id: managed-keylogger-firewall-disable-command
    desc: Managed keylogger carries firewall-disable command
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: pe-netsh-firewall-profiles-off
