# Domain-linked Group Policy can disable host firewalls across every affected
# Windows endpoint without deploying an executable to those systems.
defaults:
  platforms: [windows]
  for: [powershell, batch, scripts]
  attack: T1562.004

traits:
  - id: gpo-enable-firewall-zero
    desc: GPO disables a Windows Firewall profile
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bSet-GPRegistryValue\b[^\r\n]{0,240}\bEnableFirewall\b[^\r\n]{0,100}-Value\s+0\b'

composite_rules:
  - id: linked-gpo-disables-windows-firewall
    desc: Creates and links a Group Policy object that disables Windows Firewall
    crit: hostile
    conf: 0.98
    all:
      - id: gpo-enable-firewall-zero
      - id: micro-behaviors/os/security/policy::new-gpo-cmdlet
      - id: micro-behaviors/os/security/policy::new-gplink-cmdlet
      - id: micro-behaviors/os/security/policy::set-gpregistryvalue-cmdlet
    near_lines: 48
