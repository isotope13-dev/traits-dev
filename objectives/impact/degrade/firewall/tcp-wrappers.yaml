# tcp_wrappers host access control (/etc/hosts.deny, /etc/hosts.allow).
#
# The deny list is the oldest host-level access control on Unix and sshd still
# consults it before any key is considered, which is why automated SSH intrusion
# playbooks empty it right after installing their own authorized_keys entry: a
# fail2ban or DenyHosts jail writing into hosts.deny is the one control that
# would otherwise evict them on the next scan.
#
# Emptying or deleting the deny list is the signal — appending to it is the
# normal, defensive direction and is not matched here. The system hosts file is
# a different subsystem and lives in micro-behaviors/fs/file/write/hosts.
defaults:
  platforms: [unix]
  for: [shell, python, perl, ruby, javascript, go, elf]
  attack: T1562.004
  crit: notable
  conf: 0.93

traits:
  # A single `>` truncates. `>>` appends and is deliberately excluded by
  # requiring a non-`>` character in front of the redirect.
  - id: hosts-deny-truncate
    desc: Truncates the tcp_wrappers deny list
    conf: 0.94
    if:
      type: text
      regex: '(^|[^>])>\s*/etc/hosts\.deny\b'

  - id: hosts-deny-delete
    desc: Deletes the tcp_wrappers deny list
    conf: 0.94
    if:
      type: text
      regex: '\brm\s+[^\n]{0,24}/etc/hosts\.deny\b'

  - id: hosts-deny-open-write
    desc: Opens the deny list for writing
    conf: 0.92
    if:
      type: text
      regex: '["'']/etc/hosts\.deny["'']\s*,\s*["'']w\+?["'']'

  - id: hosts-allow-permit-all
    desc: Adds a permit-all tcp_wrappers rule
    conf: 0.94
    if:
      type: text
      regex: '(?i)(hosts\.allow.{0,40}ALL\s*:\s*ALL|ALL\s*:\s*ALL.{0,40}hosts\.allow)'

composite_rules:
  - id: tcp-wrappers-deny-list-cleared
    desc: Clears the tcp_wrappers deny list
    crit: suspicious
    conf: 0.95
    any:
      - id: hosts-deny-truncate
      - id: hosts-deny-delete
      - id: hosts-deny-open-write

  - id: tcp-wrappers-access-control-teardown
    desc: Empties the deny list and adds a permit-all rule
    crit: suspicious
    conf: 0.96
    all:
      - id: tcp-wrappers-deny-list-cleared
      - id: hosts-allow-permit-all
