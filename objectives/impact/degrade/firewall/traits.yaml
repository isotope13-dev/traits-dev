defaults:
  platforms:
    - unix
    - windows
  attack: T1562.004
traits:
  - id: ufw-reset-command
    desc: UFW reset command text
    crit: component
    conf: 0.9
    for:
      - shell
    if:
      type: text
      regex: \bufw\s+--force\s+reset\b
  - id: iptables-delete-all
    desc: Deletes all iptables rules
    crit: suspicious
    conf: 0.85
    for:
      - shell
    if:
      type: text
      # Bare -X/-Z (all chains) is the degrade signal. Chain-scoped forms like
      # `iptables -Z mychain` or `iptables -X "${CHAIN}"` only touch one chain.
      regex: '(?m)(^[ \t]*(sudo[ \t]+)?|["''])iptables[ \t]+(-X|-Z)([ \t]*$|[ \t]+-|[ \t]*[;"''])'
    unless:
      - id: well-known/app/utility/cmdchamp/
      - id: objectives/impact/degrade/firewall::benign-firewall-test-context
  # FORWARD is deliberately absent: `iptables -P FORWARD ACCEPT` is how a
  # router, NAT gateway, VPN exit node or container host enables packet
  # forwarding, and it leaves the host's own INPUT/OUTPUT filtering alone.
  # Matches micro-behaviors/os/firewall/iptables::iptables-policy-accept.
  - id: iptables-input-output-policy-accept
    desc: iptables INPUT/OUTPUT default policy ACCEPT
    crit: suspicious
    conf: 0.85
    for:
      - shell
    unless:
      - id: objectives/impact/degrade/firewall::recognized-network-management
      - id: objectives/impact/degrade/firewall::openvpn-sample-firewall-script
      - id: objectives/impact/degrade/firewall::benign-firewall-test-context
      - id: well-known/dual-use/tunnel/nostr-vpn::benign-e2e-context
      # Containerd enables forwarding on the bridge (ExecStartPost iptables -P
      # FORWARD ACCEPT). AKS Engine bakes this into cloud-init via go-bindata.
      - id: metadata/build/recognized-contexts::containerd-service-provisioning-marker
    if:
      type: string_literal
      regex: \biptables\s+-P\s+(INPUT|OUTPUT)\s+ACCEPT\b
  - id: ip6tables-flush
    desc: Flushes ip6tables rules
    crit: suspicious
    conf: 0.85
    for:
      - shell
    unless:
      - id: well-known/app/infrastructure/replicated-kurl/
      - id: objectives/impact/degrade/firewall::openvpn-sample-firewall-script
      - id: objectives/impact/degrade/firewall::benign-firewall-test-context
      - id: well-known/tool/sysadmin/munin/
      - id: well-known/tool/development/agent/openai-codex/
      - id: well-known/tool/sysadmin/kubernetes/bootstrap/
      - type: text
        regex: \bip6tables\s+(-P|--policy)\s+(INPUT|OUTPUT|FORWARD)\s+DROP\b
    if:
      type: text
      # Bare `-F` (all chains) is the degrade signal. Chain-scoped forms like
      # `ip6tables -F FORWARD` or `ip6tables -F "${CHAIN}"` only clear one
      # named chain (ordinary reconfiguration / private-chain teardown).
      regex: \bip6tables\s+-F(\s*$|\s+-|\s*;)
  - id: iptables-service-disable
    desc: Disables iptables services
    crit: suspicious
    conf: 0.9
    ref: sha256:4f2559adefb2c0f7a7efa5d9395565bb1a0e4e9f5ce62a8b8be433facbb2d3be
    for: [scripts, binaries]
    unless:
      # RHEL-family Kubernetes node provisioning disables the iptables/firewalld
      # services as documented pre-flight, then hands rule ownership to the CNI.
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-node-provisioning-context
      - id: objectives/impact/degrade/firewall::benign-firewall-test-context
    if:
      type: text
      regex: '\bsystemctl\s+(stop|disable)\s+ip6?tables\b'
    downgrade:
      scope: archive
      any:
        - id: well-known/tool/development/observability/datadog-system-tests::datadog-system-tests-context
composite_rules:
  - id: ufw-reset
    desc: Resets UFW firewall rules
    crit: suspicious
    conf: 0.9
    for: [shell]
    all:
      - id: ufw-reset-command
    downgrade:
      any:
        - id: micro-behaviors/os/firewall/ufw::default-deny
        - id: micro-behaviors/os/firewall/iptables::iptables-input-drop
  - id: disabled
    desc: Firewall disable or reset behavior
    crit: notable
    conf: 0.9
    for: [scripts, binaries, source]
    any:
      - id: objectives/impact/degrade/firewall::ufw-disable
      - id: ufw-reset
      - id: ip6tables-flush
      - id: micro-behaviors/os/firewall/firewalld::firewalld-stop
      - id: objectives/impact/degrade/firewall::netsh-firewall-off
      - id: objectives/impact/degrade/firewall::windows-firewall-profile-disable
  # Test/bootstrap context supplements the generic command observation.
  - id: firewall-disable-test-bootstrap
    desc: Firewall disable in a test or bootstrap
    crit: notable
    conf: 0.9
    all:
      - id: disabled
    any:
      - id: metadata/file/profile/test-indications::test-path-or-kerberos-bootstrap
      - id: objectives/impact/degrade/firewall::netsh-off-test-or-agentbaker
      - id: objectives/impact/degrade/firewall::profile-disable-test-or-gce
  - id: opened
    desc: Firewall rules cleared and opened
    crit: suspicious
    conf: 0.9
    all:
      - id: objectives/impact/degrade/firewall::iptables-input-output-policy-accept
    any:
      - id: micro-behaviors/os/firewall/iptables::iptables-flush-flag
      - id: iptables-delete-all
    unless:
      - id: well-known/app/infrastructure/replicated-kurl/
      - id: well-known/dual-use/tunnel/nostr-vpn::benign-e2e-context
  - id: persisted-empty-iptables-rules
    desc: Cleared iptables rules persisted
    crit: suspicious
    conf: 0.9
    ref: sha256:4f2559adefb2c0f7a7efa5d9395565bb1a0e4e9f5ce62a8b8be433facbb2d3be
    for: [scripts, binaries]
    all:
      - id: micro-behaviors/os/firewall/iptables::iptables-save-system-rules
    any:
      - id: micro-behaviors/os/firewall/iptables::iptables-flush-flag
      - id: micro-behaviors/os/firewall/iptables::iptables-delete-chain-flag
  - id: persisted-empty-ip6tables-rules
    desc: Cleared ip6tables rules persisted
    crit: suspicious
    conf: 0.9
    ref: sha256:4f2559adefb2c0f7a7efa5d9395565bb1a0e4e9f5ce62a8b8be433facbb2d3be
    for: [scripts, binaries]
    all:
      - id: micro-behaviors/os/firewall/iptables::ip6tables-save-system-rules
    any:
      - id: micro-behaviors/os/firewall/iptables::ip6tables-flush-flag
      - id: micro-behaviors/os/firewall/iptables::ip6tables-delete-chain-flag
  - id: persisted-empty-dualstack-firewall
    desc: Cleared IPv4 and IPv6 firewall persisted
    crit: suspicious
    conf: 0.92
    ref: sha256:4f2559adefb2c0f7a7efa5d9395565bb1a0e4e9f5ce62a8b8be433facbb2d3be
    for: [scripts, binaries]
    all:
      - id: persisted-empty-iptables-rules
      - id: persisted-empty-ip6tables-rules
  - id: security-degrader
    desc: Disables multiple security controls
    crit: hostile
    conf: 0.95
    for:
      - shell
    all:
      - id: disabled
      - id: micro-behaviors/fs/attributes/chattr::chattr-command
    any:
      - id: objectives/evasion/hijack-execution-flow/env/preload::ld-so-preload-clear
      - id: objectives/evasion/hijack-execution-flow/env/preload::ld-so-preload-chattr
