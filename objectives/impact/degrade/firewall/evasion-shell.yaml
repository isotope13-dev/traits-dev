defaults:
  crit: suspicious
  attack: T1562.004
  for: [scripts, binaries]
  platforms:
    - unix
traits:
  - id: iptables-policy-accept
    desc: iptables policy set to ACCEPT
    crit: suspicious
    conf: 0.95
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: objectives/impact/degrade/firewall::openvpn-sample-firewall-script
      - id: metadata/package/testing/presence/harness::test-directory
    if:
      type: text
      regex: iptables\s+(-P|--policy)\s+(INPUT|OUTPUT)\s+ACCEPT
  - id: ip6tables-policy-accept
    desc: ip6tables policy set to ACCEPT
    crit: suspicious
    conf: 0.95
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    if:
      type: text
      regex: ip6tables\s+(-P|--policy)\s+(INPUT|OUTPUT)\s+ACCEPT
  - id: ufw-disable
    desc: UFW firewall disabled
    crit: suspicious
    conf: 0.95
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: objectives/impact/degrade/firewall::incus-provisioning-firewall-context
      - id: well-known/tool/sysadmin/server-guardian-mcp/
      - id: well-known/lib/cloud/hashicorp/nomad::nomad-archive-basename
      - id: well-known/lib/cloud/hashicorp/nomad::nomad-member-path
      # A defensive scanner naming these commands in its pattern catalog, not running them.
      - id: well-known/tool/detection/pattern-catalog::source-pattern-catalog
    if:
      type: text
      regex: ufw\s+disable
  - id: nft-flush
    desc: nftables flush ruleset
    crit: suspicious
    conf: 0.9
    unless:
      - id: well-known/app/utility/cmdchamp/
      - id: metadata/package/testing/presence/harness::test-directory
      - id: micro-behaviors/os/service/config::init-script-path
      - id: objectives/persistence/system/init/script::sysv-runlevel-start-name
    if:
      type: text
      regex: nft\s+flush\s+ruleset
  - id: netsh-firewall-off
    desc: Windows firewall disabled via netsh
    crit: suspicious
    conf: 0.95
    platforms:
      - windows
    if:
      type: text
      regex: netsh.{0,50}firewall.{0,30}(off|disable)
    unless:
      - id: well-known/app/system/samba::samba-source-tree
      - id: well-known/app/infrastructure/ansible::ansible-collections-wheel-context
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      # Ansible's win_psexec module documents this command as an EXAMPLE of a
      # task an operator may run remotely; managing the firewall is the point.
      - id: well-known/app/infrastructure/ansible::ansible-module-source-context
      - id: well-known/app/security/itop-vpn::benign-context
      - id: well-known/app/system/iobit::advanced-systemcare-component-context
      - id: well-known/tool/development/go-x-build::go-x-build-infra-context
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-script
composite_rules:
  - id: iptables-policy-accept-any
    desc: iptables policy set to ACCEPT
    crit: suspicious
    conf: 0.95
    any:
      - id: iptables-policy-accept
      - id: ip6tables-policy-accept
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: metadata/package/testing/presence/harness::test-directory
  - id: firewall-disabled
    desc: System firewall disabled
    crit: suspicious
    conf: 0.95
    mbc: F0004
    any:
      - id: iptables-policy-accept
      - id: ip6tables-policy-accept
      - id: ufw-disable
      - id: micro-behaviors/os/firewall/firewalld::firewalld-stop
      - id: nft-flush
      - id: netsh-firewall-off
    unless:
      # A defensive scanner naming these commands in its pattern catalog, not running them.
      - id: well-known/tool/detection/pattern-catalog::source-pattern-catalog
      - id: well-known/app/utility/cmdchamp/
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: micro-behaviors/os/firewall/firewalld::vagrant-test-firewalld-stop
      - id: metadata/package/testing/presence/harness::test-directory
      - id: micro-behaviors/os/service/config::init-script-path
      - id: well-known/app/security/itop-vpn::benign-context
      - id: well-known/tool/sysadmin/server-guardian-mcp/
  - id: firewall-rules-cleared
    desc: Firewall rules flushed/cleared
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/os/firewall/iptables::iptables-flush-flag
      - id: micro-behaviors/os/firewall/iptables::iptables-delete-chain-flag
      - id: nft-flush
    unless:
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: well-known/app/ai/coding-agent/anthropic-claude-code
  # Incus bridge provisioning disables UFW while initializing the container
  # network. The combination is a known setup workflow, not host degradation.
  - id: incus-provisioning-firewall-context
    desc: Incus provisioning firewall setup
    crit: exception
    conf: 0.95
    for: [shell]
    all:
      - id: micro-behaviors/os/package-manager/install::apt-get-install-cmd
      - id: micro-behaviors/os/container/runtime::incus-admin-init
  - id: static-iot-firewall-rival-killer
    desc: IoT bot opens firewall, kills competing miners
    crit: hostile
    conf: 0.995
    attack: T1562.001,T1057
    mbc: B0030
    platforms: [linux, android]
    for: [elf]
    all:
      - id: objectives/impact/degrade/firewall::iptables-policy-accept
      - id: micro-behaviors/os/firewall/iptables::iptables-flush-flag
      - id: micro-behaviors/os/firewall/iptables::iptables-delete-chain-flag
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/fs/proc/info/path::process-inspection-path-cluster
      - id: micro-behaviors/process/terminate/command::kill-force
      - id: objectives/impact/degrade/rival-bot/competitor::cpuminer-targeting
      - id: objectives/impact/degrade/rival-bot/competitor::minerd-targeting
