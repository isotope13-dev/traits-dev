defaults:
  crit: suspicious
  attack: T1562.004
  for: [scripts, binaries]
  platforms:
    - unix
traits:
  - id: ufw-disable
    desc: UFW firewall disabled
    crit: suspicious
    conf: 0.95
    unless:
      # Installation scripts sometimes suspend UFW only around package setup
      # and explicitly restore it before returning.
      - id: micro-behaviors/os/firewall/ufw::enable
      - id: recognized-network-management
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: objectives/impact/degrade/firewall::incus-provisioning-firewall-context
      - id: well-known/lib/cloud/hashicorp/nomad/
      # A defensive scanner naming these commands in its pattern catalog, not running them.
      - id: well-known/tool/detection/pattern-catalog/
      - id: well-known/tool/detection/innerwarden/
      - id: metadata/build/ci/github-actions::workflow-definition-path
    if:
      type: text
      regex: '(?m)^[ \t]*(sudo[ \t]+)?ufw[ \t]+disable([ \t;]|$)'
  - id: netsh-firewall-off
    desc: Windows firewall disabled via netsh
    crit: suspicious
    conf: 0.95
    platforms:
      - windows
    if:
      type: text
      # Match the disable grammar, not the co-occurrence: permission denylists
      # and docs name "netsh advfirewall" beside other tools' verbs ("ufw
      # disable"), which a flat span read as a firewall disable.
      regex: netsh\s+(advfirewall\s+set\s+\S+\s+state\s+off|firewall\s+set\s+opmode\s+disable)\b
    not:
      # Baseline scanners quote netsh output ("profile off:") when reporting a
      # disabled firewall, not when issuing a disable command.
      - regex: 'profile off'
    unless:
      - id: objectives/impact/degrade/firewall::recognized-firewall-admin-source
      # Ansible collections, module sources and module trees in one reference:
      # Ansible ships firewall modules and documents the disable commands as
      # operator tasks, so any recognized Ansible context is administration.
      - id: well-known/app/infrastructure/ansible/
      - id: metadata/package/tooling::azure-agentbaker-tree
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: recognized-network-management
      - id: well-known/app/system/iobit::advanced-systemcare-component-context
      - id: well-known/tool/development/toolchain/go-x-build::go-x-build-infra-context
      # Both kubernetes provisioning contexts (GCE windows script, node
      # bootstrap) in one reference: K8s nodes legitimately reconfigure
      # host firewalls during provisioning.
      - id: well-known/tool/sysadmin/kubernetes/bootstrap/
      # InnerWarden's guard ruleset embeds the disable grammar as catalog
      # rodata beside the ufw/iptables/nft verbs it watches for -- the same
      # defensive-scanner exemption for its firewall command catalog.
      - id: well-known/tool/detection/innerwarden::innerwarden-defensive-tool-context
composite_rules:
  # These recognized administration products intentionally own or inspect
  # firewall configuration. Their product identity is valid only as a
  # suppressor for the generic degradation interpretation.
  - id: recognized-network-management
    desc: Recognized network-management product
    crit: exception
    conf: 0.98
    any:
      - id: well-known/app/infrastructure/replicated-kurl/
      - id: well-known/app/infrastructure/linuxmirrors::project-identity
      - id: well-known/tool/sysadmin/server-guardian-mcp/
      - id: well-known/app/security/itop-vpn::benign-context
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-node-provisioning-context
      - id: well-known/app/infrastructure/pritunl-cloud/

  - id: firewall-disabled
    desc: System firewall disabled
    crit: suspicious
    conf: 0.95
    mbc: F0004
    any:
      - id: ufw-disable
      - id: micro-behaviors/os/firewall/firewalld::firewalld-stop
      - id: netsh-firewall-off
    unless:
      - id: recognized-network-management
      # A defensive scanner naming these commands in its pattern catalog, not running them.
      - id: well-known/tool/detection/pattern-catalog/
      - id: well-known/app/utility/cmdchamp/
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: micro-behaviors/os/firewall/firewalld::vagrant-test-firewalld-stop
      - id: "metadata/file/naming::test-directory-component"
      - id: micro-behaviors/os/service/config::init-script-path
      - id: metadata/build/ci/github-actions::workflow-definition-path
  - id: firewall-rules-cleared
    desc: Firewall rules flushed/cleared
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/os/firewall/iptables::iptables-flush-flag
      - id: micro-behaviors/os/firewall/iptables::iptables-delete-chain-flag
    unless:
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: well-known/app/ai/coding-agent/anthropic-claude-code
  # Incus bridge provisioning disables UFW while initializing the container
  # network. The combination is a known setup workflow, not host degradation.
  - id: incus-provisioning-firewall-context
    desc: Incus provisioning firewall setup
    crit: exception
    conf: 0.95
    for: [shell]
    all:
      - id: micro-behaviors/os/package-manager/install::apt-get-install-cmd
      - id: micro-behaviors/os/container/runtime::incus-admin-init
  - id: static-iot-firewall-rival-killer
    desc: IoT bot opens firewall, kills competing miners
    crit: hostile
    conf: 0.995
    attack: T1562.001,T1057
    mbc: B0030
    platforms: [linux, android]
    for: [elf]
    all:
      - id: micro-behaviors/os/firewall/iptables::iptables-policy-accept
      - id: micro-behaviors/os/firewall/iptables::iptables-flush-flag
      - id: micro-behaviors/os/firewall/iptables::iptables-delete-chain-flag
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/fs/proc/info/path::process-inspection-path-cluster
      - id: micro-behaviors/process/terminate/command::kill-force
      - id: micro-behaviors/process/info/name::cpuminer-process-name
      - id: micro-behaviors/process/info/name::minerd-process-name
