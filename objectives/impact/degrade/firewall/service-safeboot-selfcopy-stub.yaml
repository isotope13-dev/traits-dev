# Naming the SharedAccess (Windows Firewall) service, a SafeBoot network
# registry path and a service ImagePath value inside a packed unsigned PE
# that also copies its own module path is the setup of firewall tampering
# and boot-persistence: the code stops the firewall service and registers a
# copy of itself to survive Safe Mode.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1562.004,T1543.003,T1562.009
composite_rules:
  - id: packed-pe-firewall-service-safeboot-selfcopy
    desc: Packed PE touching firewall service and SafeBoot
    crit: hostile
    conf: 0.8
    all:
      - id: micro-behaviors/os/service/name::sharedaccess-service-name
      - id: objectives/impact/degrade/edr/teardown::safeboot-minimal-network-path
      - id: micro-behaviors/os/service/host::service-imagepath-value-name
      - id: micro-behaviors/fs/file/copy::copyfile-module-path-api-pair
      - id: metadata/binary/section/header::pe-entry-in-writable-section
    unless:
      - id: metadata/signed/platform/
