# The Windows Firewall authorized-applications list name stored with every
# character shifted by a small constant (Caesar-style ASCII add), often with
# randomized case, so neither the plaintext path rule nor a case-insensitive
# string search sees it. A program that decodes the exemption-list name at
# run time and holds the registry write chain is adding itself to the list
# while hiding that it does. The +2 form (`CWvJqtk|gfcrrnkecvkqpu`) is the
# Banload-era downloader that registers its own path before fetching.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1562.004,T1027

traits:
  - id: shifted-authorizedapps-name
    desc: Character-shifted firewall exemption list name
    crit: suspicious
    conf: 0.9
    if:
      type: yara
      source: |
        rule shifted_authorizedapps_name {
          strings:
            $p1 = "Bvuipsj{feBqqmjdbujpot" nocase
            $p2 = "Cwvjqtk|gfCrrnkecvkqpu" nocase
            $p3 = "Dxwkrul}hgDssolfdwlrqv" nocase
            $p4 = "Eyxlsvm~ihEttpmgexmsrw" nocase
            $p5 = "Fzymtwn\x7FjiFuuqnhfyntsx" nocase
            $m1 = "@tsgnqhydc@ookhb`shnmr" nocase
            $m2 = "?srfmpgxcb?nnjga_rgmlq" nocase
            $m3 = ">rqelofwba>mmif`^qflkp" nocase
            $m4 = "=qpdkneva`=llhe_]pekjo" nocase
            $m5 = "<pocjmdu`_<kkgd^\\odjin" nocase
          condition:
            any of them
        }

composite_rules:
  - id: shifted-authorizedapps-registry-tamper
    desc: Hidden firewall exemption name and registry write
    crit: hostile
    conf: 0.93
    all:
      - id: shifted-authorizedapps-name
    any:
      - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-a
      - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-w
      - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-text
    unless:
      - id: metadata/vendor/string::microsoft-corporation-name-reference
