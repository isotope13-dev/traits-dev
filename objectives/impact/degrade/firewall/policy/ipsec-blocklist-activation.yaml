# A registry script that both installs IPsec host-block filters and points
# ActivePolicy at the carrying policy turns the blocklist on the moment it is
# imported: machine-wide, persistent, all ports and protocols, below the
# netsh/GPO management surface. Supported administration stages IPsec policy
# through Group Policy, netsh, or the MMC snap-in; the standalone REGEDIT
# import with immediate activation is the documented AntiFireWall trojan
# construction (multi-vendor Trojan.WinREG.AntiFireWall / REG_ANTIFIREWA.B,
# aliased to downloader trojans). The Block action plus a multi-host filter
# list is what separates cutting off enumerated hosts from negotiating or
# permitting traffic; the filtered destinations decide intent, so the claim
# below is impairment of host network access (T1562.004), not blocking of any
# named security service. Same theory as firewall-profile-registry-disable in
# windows-registry.yaml: raw policy-store writes that switch enforcement
# state on outside the supported API.
defaults:
  platforms: [windows]
  for: [reg]
  attack: T1562.004

composite_rules:
  - id: ipsec-blocklist-policy-activation
    desc: Activates persistent IPsec host blocklist
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/os/firewall/rule::ipsec-block-negotiation-action
      - id: micro-behaviors/os/registry/policy/reference::ipsec-local-policy-path
      - id: micro-behaviors/os/registry/policy/reference::ipsec-active-policy-value
      - id: micro-behaviors/os/firewall/rule::ipsec-single-host-filter-masks
