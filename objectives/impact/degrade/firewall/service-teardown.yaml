defaults:
  platforms:
  - windows
  attack: T1562.004
  for:
  - pe
  - dll
composite_rules:
- id: sharedaccess-service-teardown
  desc: PE embeds SharedAccess stop and startup-disable commands
  crit: suspicious
  conf: 0.97
  all:
  - id: sharedaccess-service-stop-command
  - id: sharedaccess-service-disabled-command
- id: sharedaccess-service-stop-with-control-apis
  desc: SharedAccess stop command with service-control APIs
  crit: suspicious
  conf: 0.97
  all:
  - id: sharedaccess-service-stop-command
  - id: micro-behaviors/os/service/stop::service-stop-control
  any:
  - id: micro-behaviors/os/service/dispatch::service-control-dispatch
  - id: micro-behaviors/os/service/create::create-service
  - id: micro-behaviors/os/service/query::query-service-status
  needs: 3
traits:
- id: sharedaccess-service-stop-command
  desc: Command text stops SharedAccess firewall service
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (?i)\b(net|sc)(\.exe)?\s+stop\s+["']?SharedAccess\b
    section: any
- id: sharedaccess-service-disabled-command
  desc: sc command disables SharedAccess startup
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (?i)\bsc(\.exe)?\s+config\s+["']?SharedAccess["']?\s+start=\s*disabled
    section: any
