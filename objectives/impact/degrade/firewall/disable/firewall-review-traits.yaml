defaults:
  platforms:
    - unix
    - windows
  attack: T1562.004
composite_rules:
  - id: disabled
    desc: Firewall disable/reset command references
    crit: notable
    conf: 0.9
    for: [scripts, binaries, source]
    any:
      - id: objectives/impact/degrade/firewall/disable::ufw-disable
      - id: objectives/impact/degrade/firewall/rules::ufw-reset
      - id: objectives/impact/degrade/firewall/rules::ip6tables-flush
      - id: micro-behaviors/os/firewall/firewalld::firewalld-stop
      - id: objectives/impact/degrade/firewall/disable::netsh-firewall-off
      - id: objectives/impact/degrade/firewall/disable::windows-firewall-profile-disable
  # Test/bootstrap context supplements the generic command observation.
  - id: firewall-disable-test-bootstrap
    desc: Firewall-disable reference in test/bootstrap
    crit: notable
    conf: 0.9
    all:
      - id: objectives/impact/degrade/firewall/disable::disabled
    any:
      - id: metadata/path/directory::test-path-or-kerberos-bootstrap
      - id: objectives/impact/degrade/firewall/disable::netsh-off-test-or-agentbaker
      - id: objectives/impact/degrade/firewall/disable::profile-disable-test-or-gce
  - id: security-degrader
    desc: Disables multiple security controls
    crit: hostile
    conf: 0.95
    for:
      - shell
    all:
      - id: objectives/impact/degrade/firewall/disable::disabled
      - id: micro-behaviors/fs/attributes/chattr::chattr-command
    any:
      - id: objectives/evasion/hijack-execution-flow/env/preload::ld-so-preload-clear
      - id: objectives/evasion/hijack-execution-flow/env/preload::ld-so-preload-chattr
