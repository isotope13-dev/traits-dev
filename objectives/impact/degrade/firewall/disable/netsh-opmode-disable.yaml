# The legacy "netsh firewall set opmode disable" command turns the Windows
# firewall off for the whole profile. RATs run it so their listener or
# outbound channel is not blocked; administrators do the same in scripts,
# so the string alone is suspicious, not hostile.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1562.004
traits:
  - id: netsh-firewall-set-opmode-disable
    desc: netsh firewall opmode disable command text
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: 'firewall\s+set\s+opmode\s+(mode\s*=\s*)?disable'
      case_insensitive: true

composite_rules:
  - id: pecmd-drive-worm-firewall-disable
    desc: PECMD executable infector disables Windows Firewall
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/impact/infect/virus::pecmd-drive-executable-overwrite-worm
      - id: objectives/impact/degrade/firewall/disable::netsh-firewall-set-opmode-disable
