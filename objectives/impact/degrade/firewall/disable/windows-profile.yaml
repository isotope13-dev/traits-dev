defaults:
  conf: 0.92
  platforms: [windows]
  for: [batch, powershell, scripts, pe, go, java, class, java_class]
  attack: "T1562.004"
composite_rules:
- id: profile-disable-test-or-gce
  desc: Test path or GCE bootstrap script
  crit: baseline
  any:
  - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-script
  - id: metadata/path/directory::test-directory-component
- id: firewall-profile-enable-restore-context
  desc: Firewall profiles enabled then prior state recorded for restore
  crit: exception
  all:
  - id: micro-behaviors/os/security/firewall::powershell-profile-enable-command
  - id: micro-behaviors/os/security/firewall::firewall-disabled-profile-inventory-query

- id: windows-firewall-profile-disable
  desc: Disable Windows firewall profiles
  crit: suspicious
  conf: 0.92
  unless:
  - id: well-known/tool/detection/pattern-catalog::embedded-sigma-rule-catalog
  - id: well-known/tool/detection/pattern-catalog::paired-block-warn-command-fields
  - id: micro-behaviors/os/security/command-policy::command-policy-implementation-context
  - id: firewall-profile-enable-restore-context
  downgrade:
    scope: file-or-parent
    any:
    - id: profile-disable-test-or-gce
    - id: well-known/app/infrastructure/ansible::ansible-community-sdist-context
  any:
  - id: micro-behaviors/os/security/firewall::powershell-profile-disable-command

- id: drive-exclusion-with-firewall-disable
  desc: Drive exclusion with firewall profiles off
  crit: hostile
  conf: 0.97
  for: [pe, dll]
  attack: T1562.001,T1562.004
  all:
  - id: objectives/evasion/anti-av/platform/defender::defender-whole-drive-exclusion
  - id: objectives/impact/degrade/firewall/disable::pe-netsh-firewall-profiles-off
