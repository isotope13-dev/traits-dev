defaults:
  crit: suspicious
  attack: T1562.004
  for: [scripts, binaries]
  platforms:
    - unix
traits:
  - id: ufw-disable-command
    desc: UFW disable command text
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?m)^[ \t]*(sudo[ \t]+)?ufw[ \t]+disable([ \t;]|$)'
  - id: netsh-firewall-off-command
    desc: Windows Firewall disable command text via netsh
    crit: component
    conf: 0.95
    platforms:
      - windows
    if:
      type: text
      # Match the disable grammar, not the co-occurrence: permission denylists
      # and docs name "netsh advfirewall" beside other tools' verbs ("ufw
      # disable"), which a flat span read as a firewall disable.
      regex: netsh\s+(advfirewall\s+set\s+\S+\s+state\s+off|firewall\s+set\s+opmode\s+disable)\b
      exclude_comments: true
  - id: firewall-disable-cli-option
    desc: Script accepts a --disable-firewall option
    crit: notable
    conf: 0.85
    for: [shell]
    if:
      type: text
      regex: '(?m)^\s*"?--disable-firewall[|=\w*"-]{0,40}\)'
  - id: firewall-disable-flag-gate
    desc: Firewall changes gated on a script flag
    crit: notable
    conf: 0.85
    for: [shell]
    if:
      type: text
      regex: '\bif\s+\[\[?\s*"?\$\{?[A-Z_]*FIREWALL[A-Z_]*\}?"?\s*(==|=)\s*"?true\b'
  - id: firewall-test-vm-throwaway-text
    desc: Script calls firewall-off host a throwaway VM
    crit: notable
    conf: 0.9
    for: [powershell, scripts]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)throwaway (test )?(vm|machine|host|box)'
  - id: firewall-test-harness-path
    desc: Path sits in a test directory tree
    crit: notable
    conf: 0.9
    for: [powershell, scripts]
    platforms: [windows]
    if:
      type: path
      regex: '(^|[\\/])test[\\/]'
composite_rules:
  # Test harnesses that switch the firewall off on a disposable VM are
  # provisioning, not evasion. Both legs are required: the text alone or the
  # path alone is common in ordinary test code.
  - id: firewall-off-throwaway-test-vm
    desc: Firewall disabled on a throwaway test VM in a test harness
    crit: exception
    conf: 0.9
    for: [powershell, scripts]
    platforms: [windows]
    all:
      - id: firewall-test-vm-throwaway-text
      - id: firewall-test-harness-path
  - id: netsh-firewall-off
    desc: Windows Firewall disable command via netsh
    crit: suspicious
    conf: 0.95
    platforms: [windows]
    all:
      - id: objectives/impact/degrade/firewall/disable::netsh-firewall-off-command
    unless:
      - id: micro-behaviors/os/security/command-policy/gate::native-command-guard-policy
    downgrade:
      scope: file-or-parent
      any:
        - id: objectives/impact/degrade/firewall/disable::firewall-off-throwaway-test-vm
        - id: metadata/package/testing/harness/fixture::js-declared-test-data
        - id: metadata/package/testing/corpus/security-tests/command::pytest-system-tool-policy-case
        - id: objectives/impact/degrade/firewall/disable::opt-in-firewall-disable-flag
        - id: well-known/tool/development/toolchain/go-x-build::go-x-build-infra-context
        # ansible-core documents "netsh advfirewall ... state off" as an example
        # of the win_psexec module's command parameter, inside its docstring.
        - id: well-known/app/infrastructure/ansible::ansible-distribution-archive-context
        # AKS Windows node bootstrap turns the host firewall off on purpose
        # while it provisions the Kubernetes node (Azure/AgentBaker).
        - id: metadata/path/software::azure-agentbaker-tree
  - id: ufw-disable
    desc: UFW disable command
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/impact/degrade/firewall/disable::ufw-disable-command
    downgrade:
      any:
        # These contexts can explain the command without making it disappear.
        - id: micro-behaviors/os/firewall/ufw::enable
        - id: micro-behaviors/os/firewall/iptables::iptables-input-drop
        - id: objectives/impact/degrade/firewall/disable::recognized-network-management
        - id: objectives/impact/degrade/firewall/disable::incus-provisioning-firewall-context
        - id: well-known/lib/cloud/hashicorp/nomad/
        - id: well-known/tool/detection/pattern-catalog/
        - id: well-known/tool/detection/innerwarden/
        # FOG's installer offers to disable the local firewall behind a y/N prompt.
        - id: well-known/app/infrastructure/fog-project::project-identity
        # kURL's preflight offers to disable UFW before installing Kubernetes.
        - id: well-known/tool/sysadmin/kubernetes/bootstrap::kurl-ufw-preflight-context
  - id: netsh-off-test-or-agentbaker
    desc: Test path or AgentBaker image tree
    crit: baseline
    platforms: [unix, windows]
    any:
      - id: metadata/path/software::azure-agentbaker-tree
      - id: metadata/path/directory::test-directory-component

  # These recognized administration products intentionally own or inspect
  # firewall configuration. Their product identity is valid only as a
  # suppressor for the generic degradation interpretation.
  - id: recognized-network-management
    desc: Recognized network-management product
    crit: exception
    conf: 0.98
    any:
      - id: well-known/app/infrastructure/replicated-kurl/
      - id: well-known/app/infrastructure/linuxmirrors::project-identity
      - id: well-known/tool/sysadmin/server-guardian-mcp/
      - id: well-known/app/security/itop-vpn::benign-context
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-node-provisioning-context
      - id: well-known/app/infrastructure/pritunl-cloud/
      - id: well-known/app/infrastructure/freetz-ng/

  - id: opt-in-firewall-disable-flag
    desc: Firewall disable behind explicit script option
    crit: notable
    conf: 0.9
    all:
      - id: objectives/impact/degrade/firewall/disable::firewall-disable-cli-option
      - id: objectives/impact/degrade/firewall/disable::firewall-disable-flag-gate

  - id: firewall-rules-cleared
    desc: Firewall flush or chain deletion flags
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/os/firewall/iptables::iptables-flush-flag
      - id: micro-behaviors/os/firewall/iptables::iptables-delete-chain-flag
  # Incus bridge provisioning disables UFW while initializing the container
  # network. The combination is a known setup workflow, not host degradation.
  - id: incus-provisioning-firewall-context
    desc: Incus provisioning firewall setup
    crit: exception
    conf: 0.95
    for: [shell]
    all:
      - id: micro-behaviors/os/package-manager/install::apt-get-install-cmd
      - id: micro-behaviors/os/container/runtime::incus-admin-init
  - id: static-iot-firewall-rival-killer
    desc: IoT bot opens firewall, kills competing miners
    crit: hostile
    conf: 0.995
    attack: T1562.001,T1057
    mbc: B0030
    platforms: [linux, android]
    for: [elf]
    all:
      - id: micro-behaviors/os/firewall/iptables::iptables-policy-accept
      - id: micro-behaviors/os/firewall/iptables::iptables-flush-flag
      - id: micro-behaviors/os/firewall/iptables::iptables-delete-chain-flag
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/fs/proc/info/path::process-inspection-path-cluster
      - id: micro-behaviors/process/terminate/command::kill-force
      - id: micro-behaviors/process/info/name::cpuminer-process-name
      - id: micro-behaviors/process/info/name::minerd-process-name
