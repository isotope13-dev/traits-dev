defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1562.004

traits:
  - id: pe-netsh-firewall-profiles-off
    desc: Netsh all-profile firewall-disable command text
    crit: notable
    conf: 0.92
    if:
      type: text
      exact: "Advfirewall set allprofiles state off"
      case_insensitive: true

composite_rules:
  - id: managed-keylogger-firewall-disable-command
    desc: Managed keylogger carries firewall-disable command
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/impact/degrade/firewall/disable::pe-netsh-firewall-profiles-off
    any:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: objectives/collection/keylog/hook::managed-low-level-hook-file-keylogger
      - id: objectives/exfiltration/stealer/input::managed-ransom-hook-keylog-form-post

  - id: ransomware-netsh-firewall-disable-command
    desc: Ransomware carries all-profile firewall-disable command
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/impact/degrade/firewall/disable::pe-netsh-firewall-profiles-off
      - id: objectives/impact/ransom/extortion::pe-ransom-extortion-content
    any:
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start-call
      - id: micro-behaviors/process/create/exec::dotnet-process-start-import
    unless:
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
