# Turning off the macOS host firewall. Both generations are covered: the
# `com.apple.alf` application-layer firewall that ships today, and the older
# `com.apple.sharing.firewall` / `ipfw` pair, which still appear in scripts
# written for wide OS-version coverage.
#
# These are writes with a chosen value, not reads -- the discovery counterpart
# (`objectives/discovery/host/security::app-firewall-globalstate`) matches the
# same preference domain being queried, which is a different act. Malware
# usually does both: look, then switch off.
defaults:
  platforms: [macos]
  for: [scripts, source, binaries]
  attack: T1562.004
  mbc: F0004

traits:
  - id: alf-globalstate-disable
    desc: Disables the macOS application firewall
    crit: suspicious
    conf: 0.95
    if:
      # `defaults write /Library/Preferences/com.apple.alf globalstate -int 0`
      type: text
      regex: '(?i)com\.apple\.alf\s+globalstate\s+-int\s+0'

  - id: sharing-firewall-state-disable
    desc: Disables the legacy sharing firewall
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)com\.apple\.sharing\.firewall\s+state\s+-bool\s+false'

  - id: sharing-firewall-stealth-disable
    desc: Disables legacy firewall stealth mode
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)com\.apple\.sharing\.firewall\s+stealthenabled\s+-int\s+0'

  - id: sharing-firewall-logging-disable
    desc: Disables legacy firewall logging
    crit: suspicious
    conf: 0.9
    attack: T1562.001
    if:
      type: text
      regex: '(?i)com\.apple\.sharing\.firewall\s+loggingenabled\s+-int\s+0'

  - id: ipfw-firewall-disable
    desc: Disables the ipfw packet filter
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bipfw\s+disable\s+firewall\b'

composite_rules:
  # Switching the firewall off *and* switching its logging off: the second
  # step only makes sense if the first is meant to go unnoticed.
  - id: firewall-disable-and-silence
    desc: Disables the firewall and its logging
    crit: hostile
    conf: 0.96
    attack: T1562.004,T1562.001
    all:
      - id: sharing-firewall-logging-disable
    any:
      - id: alf-globalstate-disable
      - id: sharing-firewall-state-disable
      - id: sharing-firewall-stealth-disable
      - id: ipfw-firewall-disable

  - id: macos-firewall-teardown
    desc: Turns off macOS firewall protections
    crit: suspicious
    conf: 0.94
    any:
      - id: alf-globalstate-disable
      - id: sharing-firewall-state-disable
      - id: sharing-firewall-stealth-disable
      - id: ipfw-firewall-disable
    needs: 2
