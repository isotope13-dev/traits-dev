# Firewall disable via registry - Windows
# Disabling Windows firewall by modifying SharedAccess service
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1562.004

composite_rules:
  # The StandardProfile state values are managed through netsh or
  # INetFwPolicy2; a program that carries the raw profile key path, names two
  # or more of the state values, and holds the RegSetValueEx write chain is
  # turning the firewall's own profile state off below the supported API.
  # Legitimate firewall management never does this via the registry, while
  # worm families (Sality, Cozer, Virut) use exactly this triple to open
  # inbound paths.
  - id: firewall-profile-registry-disable
    desc: Impairs Windows Firewall profile state via registry
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/os/firewall/registry-state::firewall-profile-policy-path
      - id: micro-behaviors/os/firewall/registry-state::firewall-profile-state-values
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
    unless:
      - id: metadata/signed/platform/
      - id: metadata/vendor/string::microsoft-corporation-author-string

  - id: firewall-authorizedapps-registry-tamper
    desc: Injects Windows Firewall authorized application via direct registry manipulation
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/os/registry/access::windows-firewall-authorizedapps-path
    any:
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-w
      - id: micro-behaviors/os/registry/access::reg-set-value-ex-text
      - id: micro-behaviors/os/registry/access::reg-create-key-a
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/vendor/string::microsoft-corporation-author-string
