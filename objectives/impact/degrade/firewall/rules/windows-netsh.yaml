defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: unsigned-admin-nonstandard-entry-firewall-allow
    desc: Unsigned admin nonstandard-entry PE adds inbound firewall allow rule
    crit: hostile
    conf: 0.96
    attack: T1562.004
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/build/manifest::require-administrator
      - id: metadata/binary/section/header::pe-entry-in-nonstandard-section
      - id: micro-behaviors/os/firewall/netsh::netsh-advfirewall-rule-allow
