defaults:
  crit: notable
  platforms:
    - unix
  for: [scripts, binaries, c, cpp]
  attack: T1562.004
traits:
  - id: openvpn-sample-firewall-script
    desc: OpenVPN sample firewall script
    conf: 0.99
    for: [shell]
    if:
      type: text
      substr: A Sample OpenVPN-aware firewall.
  - id: github-actions-lxd-e2e-setup
    desc: GitHub Actions LXD e2e setup
    conf: 0.95
    for: [github-actions]
    if:
      type: path
      substr: actions/e2e-lxd-setup/action.yml
  - id: e2e-testing-setup-header
    desc: Local e2e test environment setup steps header
    conf: 0.95
    for: [shell]
    if:
      type: text
      substr: Setup steps for local e2e testing environment
  - id: docker-stop-command
    desc: Stops docker systemctl service
    conf: 0.95
    for: [shell]
    if:
      type: text
      substr: sudo systemctl stop docker
  - id: github-api-jq-query
    desc: jq query on GitHub API endpoints
    conf: 0.95
    for: [shell]
    if:
      type: text
      substr: 'jq -r ''(.web + .api + .git)[]'''
composite_rules:
  - id: local-e2e-test-setup
    desc: Local e2e test environment setup steps
    conf: 0.95
    for: [shell]
    any:
      - id: e2e-testing-setup-header
      - id: docker-stop-command
      - id: github-api-jq-query
