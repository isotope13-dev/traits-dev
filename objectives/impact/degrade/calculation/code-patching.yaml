# Generalized executable-code patching used to corrupt calculation results.
# fast16 is one Windows implementation; the hostile behavior is the
# combination of executable targeting, wildcard/stateful replacement, and
# deliberate numerical-result alteration.
defaults:
  platforms: [linux, macos, windows]
  for: [pe, elf, macho, c, python, lua]
  attack: T1565.002

traits:
- id: patch-rule-structure
  desc: PATCH_RULE or scan_pattern identifier
  crit: notable
  conf: 0.85
  if:
    type: text
    # 'pattern_matches' dropped: it is the ordinary name of a regex-match
    # boolean (MariaDB json_schema.cc), not a patch-rule table.
    regex: '(?i)\b(PATCH_RULE|scan_pattern)\b'

# The bare plural `wildcards` is ordinary English and ordinary API vocabulary
# (it fired on a file-dialog docstring listing extension wildcards). The
# specific snake_case option names are the actual rule-engine identifiers.
- id: wildcard-or-state-rule
  desc: Rule-engine wildcard/state config identifier
  crit: notable
  conf: 0.85
  # Case-sensitive: the upper-case STATE_SET is an ordinary protobuf/Go enum
  # constant (Windsurf's language_server), not a patch-rule option name.
  if:
    type: text
    regex: '\b(wildcard_mask|state_required|state_set)\b'

- id: executable-suffix-write-bytes
  desc: Writes bytes to executable suffix
  crit: suspicious
  conf: 0.9
  for: [c, python, lua]
  if:
    type: text
    regex: '(?i)\.(exe|dll|so)\b.{0,96}\bwrite_bytes\s*\('
  unless:
  # Patch-library tests create executable-looking fixtures to exercise the
  # parser; they do not rewrite a live executable during installation.
  - type: path
    regex: '(?i)(^|[\\/])(tests?|testdata|fixtures?)([\\/]|$)|(^|[\\/])test_[^\\/]+\.py$'

- id: executable-suffix-pwrite
  desc: Pwrite targets executable suffix
  crit: suspicious
  conf: 0.9
  for: [c, python, lua]
  if:
    type: text
    regex: '(?i)\bpwrite\s*\([^;\n]{0,120}\.(exe|dll|so)\b'

- id: windows-executable-read-patch
  desc: Patch-on-executable-read marker
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: '(?i)\bpatch[_ -]?on[_ -]?executable[_ -]?read\b'

- id: cross-platform-executable-read-patch
  desc: Cross-platform executable read patch
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: '(?i)\bpatch[_ -]?executable[_ -]?on[_ -]?read\b'

- id: precision-transform-routine
  desc: corrupt/bias precision-or-result identifier
  crit: notable
  conf: 0.85
  if:
    type: text
    # 'alter_result' dropped: it is SQL ALTER TABLE bookkeeping (MariaDB
    # sql_table.cc), not a result-corruption routine.
    regex: '(?i)\b(corrupt|bias)_(precision|result)\b'

# An identifier name with no behavior of its own: 'result_precision' is how
# every numeric library (MariaDB Item_func) names its precision computation.
# It only means something inside numerical-result-alteration below.
- id: result-transform-routine
  desc: precision_result or result_precision identifier
  crit: component
  conf: 0.85
  if:
    type: text
    regex: '(?i)\b(precision|result)_(result|precision)\b'

composite_rules:
- id: executable-image-target
  for: [python, c, lua]
  desc: Executable image target selection
  crit: suspicious
  conf: 0.92
  # A suffix test alone is ordinary launcher/path logic. Require the source
  # to identify the image format as well before treating it as patch targeting.
  all:
  - id: micro-behaviors/fs/path/extension::source-executable-extension-check
  any:
  - id: micro-behaviors/data/format/executable/header::named-pe-signature-check
  - id: micro-behaviors/data/format/executable/header::named-elf-signature-check

- id: stateful-wildcard-byte-replacement
  for: [python, c, lua]
  desc: Stateful wildcard byte replacement
  crit: notable
  conf: 0.9
  all:
  - id: patch-rule-structure
  - id: micro-behaviors/data/buffer/record::named-byte-replacement-routine
  - id: wildcard-or-state-rule

- id: executable-image-byte-rewrite
  desc: Executable image byte rewrite
  crit: suspicious
  conf: 0.92
  any:
  - id: executable-suffix-write-bytes
  - id: executable-suffix-pwrite

- id: executable-read-interception
  desc: Executable read interception
  crit: suspicious
  conf: 0.92
  any:
  - id: windows-executable-read-patch
  - id: cross-platform-executable-read-patch

- id: numerical-result-alteration
  for: [c, python, lua]
  desc: Executable rewrite targets numerical results
  crit: suspicious
  conf: 0.9
  unless:
  - id: well-known/lib/ai/lmcache::wheel-member-context
  all:
  - id: executable-code-rewrite-engine
  any:
  - id: precision-transform-routine
  - id: result-transform-routine
  - id: micro-behaviors/data/arithmetic::numeric-transform-name
- id: executable-code-rewrite-engine
  for: [python, c, lua]
  desc: Rule-driven executable byte rewrite
  crit: suspicious
  conf: 0.94
  all:
  - id: executable-image-target
  - id: stateful-wildcard-byte-replacement
  - id: executable-image-byte-rewrite

- id: calculation-result-code-sabotage
  for: [c, python, lua]
  desc: Executable patch calculation sabotage
  crit: hostile
  conf: 0.98
  all:
  - id: executable-code-rewrite-engine
  - id: numerical-result-alteration

- id: read-time-executable-code-sabotage
  for: [c, python, lua]
  desc: Read-time executable code sabotage
  crit: hostile
  conf: 0.99
  all:
  - id: executable-code-rewrite-engine
  - id: executable-read-interception
  - id: numerical-result-alteration
