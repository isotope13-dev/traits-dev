defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  attack: T1565.002
traits:
- id: precision-fpu-patch-pattern
  desc: Precision FPU patch pattern
  crit: notable
  conf: 0.9
  for: [pe, dll]
  if:
    type: hex
    section: .text
    pattern: "D9 04 9D ?? ?? ?? ?? 83 ED 04 05 10 00 00 00 D8 0D"
- id: rule-driven-patch-engine
  desc: Rule driven patch engine
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \b(patch(ing)? rules?|replacement logic|dispatch array)\b
composite_rules:
- id: precision-calculation-code-sabotage
  desc: Precision calculation code sabotage
  crit: hostile
  conf: 0.98
  all:
  - id: rule-driven-patch-engine
  any:
  - id: precision-fpu-patch-pattern
  - id: metadata/lang/compiler/systems::intel-artifact-text-reference
  - id: metadata/lang/natural/vocabulary/computation::floating-point-computation-terminology
  needs: 2
- id: filesystem-filter-calculation-sabotage
  desc: Filesystem filter calculation sabotage
  crit: hostile
  conf: 0.99
  all:
  - id: precision-calculation-code-sabotage
  - id: objectives/evasion/kernel-hide/driver-stack::filesystem-executable-read-patcher
