defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1486
composite_rules:
  - id: ransomware-file-holder-termination
    desc: Ransomware file-holder and termination controls
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/ransom/encrypt/bulk-encryption::native-base64-extortion-file-encryptor
      - id: micro-behaviors/process/terminate/kill::file-holder-shutdown-controls
    needs: 2
    any:
      - id: objectives/impact/ransom/affiliate::encrypt-network-shares-flag
      - id: objectives/impact/ransom/affiliate::encrypt-hidden-drives-flag
      - id: micro-behaviors/process/terminate/kill::process-mask-controls
      - id: micro-behaviors/os/service/stop::service-mask-controls
      - id: micro-behaviors/process/argument/option::speed-mode-option
