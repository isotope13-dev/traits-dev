defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # Dynamic Toolhelp traversal plus a named TerminateProcess surface identifies
  # a process hunter, independent of whether it is also a backdoor or loader.
  - id: toolhelp-process-killer
    desc: Toolhelp process hunter terminates processes by name
    crit: hostile
    conf: 0.93
    attack: T1057,T1489
    all:
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
      - id: micro-behaviors/process/terminate/kill::terminate-process-name-text
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/
      - id: well-known/tool/sysadmin/7zip::sevenzip-distribution-binary
      - id: well-known/dual-use/tunnel/netch::netch-redirector
      - id: well-known/app/utility/modmanager::modmanager-product-name
      - id: metadata/binary/section/label::cape-sandbox-dump-section
