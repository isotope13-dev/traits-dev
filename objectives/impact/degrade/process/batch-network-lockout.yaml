defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: batch-network-isolation-admin-lockout
    desc: Batch disables network interface and administrative recovery tools
    crit: hostile
    conf: 0.98
    attack: "T1562.001,T1112"
    all:
      - id: micro-behaviors/network/interface::netsh-interface-disable-command-text
    any:
      - id: objectives/impact/degrade/windows-policy::batch-reg-disable-taskmgr
      - id: objectives/impact/degrade/windows-policy::batch-reg-disable-registry-tools
      - id: objectives/evasion/anti-av/registry::defender-antispyware-registry-disable-value
    needs: 1
