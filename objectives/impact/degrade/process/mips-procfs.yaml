defaults:
  platforms: [linux]
  for: [elf]
  arch: [mips]
composite_rules:
  - id: mips-procfs-downloader-process-killer
    desc: MIPS SIGKILL call with procfs and downloader process targets
    crit: hostile
    conf: 0.98
    attack: T1057,T1489
    all:
      - id: micro-behaviors/process/terminate/kill::mips-r6-sigkill-saved-pid-call
      - id: micro-behaviors/os/syscall/raw::mips-o32-kill-syscall-le
      - id: micro-behaviors/fs/proc/info/cmdline::downloader-shell-command-target-table
      - id: micro-behaviors/fs/proc/cmdline::process-pid-cmdline-token
      - id: micro-behaviors/fs/proc/exe::procfs-process-exe-fragment-cluster
