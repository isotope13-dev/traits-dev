defaults:
  platforms: [linux]
  for: [elf]
  arch: [mips]
composite_rules:
  - id: mips-procfs-downloader-process-killer
    desc: MIPS SIGKILL call with procfs and downloader process targets
    crit: hostile
    conf: 0.98
    attack: T1057,T1489
    all:
      - id: micro-behaviors/process/terminate/kill::mips-r6-sigkill-saved-pid-call
      - id: micro-behaviors/process/control/signal::mips-o32-kill-syscall-le
      - id: micro-behaviors/fs/proc/info/cmdline::downloader-shell-command-target-table
      - id: micro-behaviors/fs/proc/cmdline::process-pid-cmdline-token
      - id: micro-behaviors/fs/proc/exe::procfs-process-exe-fragment-cluster
  - id: mips-procfs-kworker-ddos-process-interference
    desc: MIPS HTTP flood bot scans and kills processes under a kworker title
    crit: hostile
    conf: 0.98
    attack: T1498.001,T1057,T1489,T1036.004
    all:
      - id: objectives/persistence/system/service/systemd::http-get-flood-systemd-cron-persistence
      - id: micro-behaviors/process/control/signal::mips-o32-kill-syscall-be
      - id: micro-behaviors/fs/proc/info/pid::process-pid-cmdline-template
      - id: micro-behaviors/process/info/name::bracketed-kworker-name-reference
