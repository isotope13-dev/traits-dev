defaults:
  platforms: [windows]
  for: [pyc]
composite_rules:
  - id: ransom-text-desktop-tool-kill-commands
    desc: Ransom text with desktop-tool kill commands
    crit: hostile
    conf: 0.98
    for: [pe, dll]
    all:
      - id: objectives/impact/ransom/note::multi-phrase-ransom-note-text
      - id: objectives/impact/ransom/extortion::data-loss-and-arrest-threat
      - id: micro-behaviors/process/terminate/command::taskkill-explorer-force-first
      - id: micro-behaviors/process/terminate/command::force-taskkill-task-manager
  - id: ransom-gui-force-kills-explorer
    desc: Coercive file-recovery GUI force-kills Explorer
    crit: hostile
    conf: 0.98
    # File-scoped: an unrelated library's taskkill text cannot supply the kill.
    all:
      - id: objectives/impact/ransom/encrypt/bytecode::pyc-all-files-encrypted-message
      - id: objectives/impact/ransom/note::close-window-blocks-decryption-warning
      - id: micro-behaviors/process/terminate/command::taskkill-explorer-force-first
