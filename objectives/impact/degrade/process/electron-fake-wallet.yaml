# Counterfeit desktop-wallet Electron agents that kill the real app in
# /Applications, keep a stealth window ready, and exfiltrate BIP39 recovery
# phrases over Telegram. Inspired by Operation ASTERIX (fake Trezor Suite).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, shell, scripts, asar, dmg, pkg, zip]
  attack: T1185,T1567,T1555

composite_rules:
  - id: hidden-window-wallet-process-interference
    desc: "Hidden window with wallet-context process kill"
    crit: hostile
    conf: 0.98
    attack: T1185,T1564.003,T1489
    all:
      - id: micro-behaviors/ui/window/electron::electron-stealth-browserwindow
      - id: micro-behaviors/process/terminate/command::wallet-or-application-kill
    any:
      - id: micro-behaviors/fs/path/application/bundle::wallet-app-bundle-path
      - id: micro-behaviors/os/service/launchagent::wallet-launchagent-label
    needs: 1
