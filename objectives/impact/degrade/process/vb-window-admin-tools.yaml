defaults:
  for: [vbs]
  platforms: [windows]

traits:
  - id: vb-find-regedit-window
    desc: Find Registry Editor window
    crit: notable
    if:
      type: text
      regex: '(?i)FindWindow\s*\(\s*"RegEdit_RegEdit"'

  - id: vb-find-process-inspector-window
    desc: Find process inspection window
    crit: notable
    if:
      type: text
      regex: '(?i)FindWindow\s*\([^\r\n]{1,80}Process, Thread and Window enumeration'

  - id: vb-send-close-window
    desc: Send close window message
    crit: notable
    if:
      type: text
      regex: '(?i)SendMessage[a-z0-9_]*\s*\([^\r\n]{1,80},\s*WM_CLOSE\s*,'

  - id: vb-send-message-api
    desc: Declare Windows message API
    crit: notable
    if:
      type: text
      regex: '(?i)\bAlias\s+"SendMessage[AW]"'

composite_rules:
  - id: vb-close-regedit-window
    desc: Registry Editor window lookup near a close message
    crit: notable
    near_lines: 3
    all:
      - id: vb-find-regedit-window
      - id: vb-send-close-window

  - id: vb-close-process-inspector-window
    desc: Process inspection window lookup near a close message
    crit: notable
    near_lines: 3
    all:
      - id: vb-find-process-inspector-window
      - id: vb-send-close-window

  - id: vb-close-admin-inspection-windows
    desc: Targets Registry Editor and process inspector with close messages
    crit: hostile
    all:
      - id: vb-close-regedit-window
      - id: vb-close-process-inspector-window
      - id: vb-send-message-api
