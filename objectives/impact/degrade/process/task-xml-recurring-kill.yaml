defaults:
  platforms: [windows]
  for: [xml, text]

composite_rules:
  - id: recurring-elevated-task-image-termination
    desc: Recurring elevated task force-kills a named image
    crit: suspicious
    conf: 0.96
    attack: T1053.005
    all:
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-minute-interval-xml
      - id: micro-behaviors/process/terminate/command::task-xml-taskkill-command
      - id: micro-behaviors/process/terminate/target::task-xml-force-terminate-image
    any:
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-system-principal-xml
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-highest-runlevel-xml
