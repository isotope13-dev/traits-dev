defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # IFEO is used for legitimate debugging and repair. The extorting drive
  # encryptor supplies attack context; the references alone do not establish
  # which Debugger value was written or that interception succeeded.
  - id: managed-ransomware-ifeo-tool-blocking
    desc: Ransom encryptor with IFEO debugger-write and task-manager clues
    crit: hostile
    conf: 0.97
    attack: T1562.001
    all:
      - id: objectives/impact/ransom/encrypt/bulk-encryption::managed-ransom-stream-replacement
      - id: micro-behaviors/os/registry/process/reference::ifeo-key-reference
      - id: micro-behaviors/os/registry/value-name::debugger-value-name-token
      - id: micro-behaviors/os/registry/value/write::dotnet-registrykey-setvalue-references
      - id: micro-behaviors/process/info/name::taskmgr-process
