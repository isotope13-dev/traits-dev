defaults:
  platforms: [windows]
  for: [pe, dll, batch, powershell]
composite_rules:
  - id: force-kill-administration-tool-cluster
    desc: Force-kill commands target three admin tools
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/terminate/command::force-taskkill-task-manager
      - id: micro-behaviors/process/terminate/command::force-taskkill-registry-editor
      - id: micro-behaviors/process/terminate/command::force-taskkill-management-console
