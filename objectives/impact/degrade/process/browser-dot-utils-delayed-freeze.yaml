defaults:
  platforms:
  - unix
  - windows
  - android
  - ios
  for:
  - javascript
  attack: T1499
traits:
- id: browser-dot-utils-production-guard
  desc: Tracks production build for click guard
  crit: notable
  if:
    type: text
    substr: __DOT_UTILS_PLUS_PROD__
- id: browser-dot-utils-click-wrapper
  desc: Wraps browser click listeners
  crit: notable
  if:
    type: text
    substr: EventTarget.prototype.addEventListener = function
- id: browser-dot-utils-freeze-call
  desc: Blocks main thread in selected click handlers
  crit: suspicious
  if:
    type: text
    substr: blockMainThread(FREEZE_MS)
- id: browser-dot-utils-six-hour-delay
  desc: Delays activation for six hours
  crit: notable
  if:
    type: text
    substr: now - initializedAt > SIX_HOURS_MS
composite_rules:
- id: browser-dot-utils-delayed-click-freeze
  desc: Randomly freezes production clicks after delay
  crit: hostile
  conf: 0.99
  all:
  - id: browser-dot-utils-production-guard
  - id: browser-dot-utils-click-wrapper
  - id: objectives/impact/degrade/process::browser-freeze-probability-comparison
  - id: browser-dot-utils-freeze-call
  - id: browser-dot-utils-six-hour-delay
