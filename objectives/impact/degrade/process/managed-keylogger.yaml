defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # IFEO Debugger redirection is independent of enumerating/killing tools.
  # The keylogger supplies attack context; an IFEO repair/debugger utility
  # alone does not qualify. File scope establishes a profile, not a bound
  # registry-value dataflow or successful interception of every named tool.
  - id: managed-keylogger-ifeo-tool-hijack-profile
    desc: Managed keylogger with IFEO process-tool hijack references
    crit: hostile
    conf: 0.96
    attack: T1546.012,T1562.001
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: micro-behaviors/os/registry/keys/execution::ifeo-process-tool-write-api-profile
      - id: micro-behaviors/os/registry/manipulate::dotnet-registry-create-subkey-member

  # Recording supplies the abuse context; process enumeration and Kill
  # alone also occur in legitimate task managers. Co-occurrence does not
  # resolve which process object is passed to Kill.
  - id: managed-keylogger-process-tool-kill-references
    desc: Managed keylogger with process-tool targets and kill APIs
    crit: hostile
    conf: 0.95
    attack: T1562.001
    all:
      - id: micro-behaviors/process/terminate/kill::process-kill-by-name
      - id: micro-behaviors/process/enumerate/managed::dotnet-process-enumeration-member
      - id: micro-behaviors/process/info/name::taskmgr-process
      - id: micro-behaviors/process/debug/tool-markers::process-hacker-name-reference
    any:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: objectives/collection/keylog/hook::managed-low-level-hook-file-keylogger
