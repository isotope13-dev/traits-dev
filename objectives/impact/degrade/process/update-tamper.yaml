defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: update-tamper-proxy-kills-port-owner
    desc: Tampering proxy kills competing listener process
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/evasion/anti-av/verification::eset-update-signature-suppression-proxy
      - id: micro-behaviors/process/terminate/kill::listener-port-owner-termination
      - id: micro-behaviors/process/terminate/kill::x86-open-check-terminate-process
    # The hash-rotating family composite restates this kill for the same
    # program; step down when it fires so one behavior is not convicted twice.
    downgrade:
      any:
        - id: objectives/command-and-control/channel/proxy::hash-rotating-port-seizing-proxy
