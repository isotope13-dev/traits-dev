# A published wheel whose interpreter-startup hook conditionally aborts the
# process: an import-time bootstrap that raises SystemExit unless the host
# command line matches the payload's intended victim. Installation and every
# unrelated interpreter run (pip, venv, tests, tooling) exit at startup, so
# the package both sabotages the host's Python tooling and reveals its own
# selective targeting of one victim process.
defaults:
  platforms: [unix, windows]
  for: [whl, python]
  crit: hostile
  conf: 0.96
  attack: T1546,T1499
  mbc: E1489

composite_rules:
  - id: wheel-startup-hook-exits-non-target-interpreter
    desc: Wheel startup hook terminates non-target Python processes
    scope: archive
    all:
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/process/exit/terminate::python-conditional-process-exit
    unless:
      - id: metadata/package/testing/
