# A startup import, module-level call and conditional exit co-occur in an
# archive. They can indicate a disruptive startup hook, but do not establish
# that the imported module reaches the exit or how the condition selects it.
defaults:
  platforms: [unix, windows]
  for: [whl, python]
  crit: hostile
  conf: 0.96
  attack: T1546,T1499
  mbc: E1489

composite_rules:
  - id: wheel-startup-hook-exits-non-target-interpreter
    desc: Wheel startup import and conditional exit
    crit: suspicious
    scope: archive
    all:
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/process/exit/terminate::python-conditional-process-exit
