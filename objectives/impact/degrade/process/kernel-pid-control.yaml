defaults:
  for:
    - "pe"
  platforms:
    - "windows"
  arch:
    - "x86"
composite_rules:
  - id: "caller-directed-kernel-process-killer"
    desc: "Kernel process killer takes caller-selected PID"
    crit: "hostile"
    conf: 0.96
    attack: "T1489,T1068"
    all:
      - id: "micro-behaviors/process/terminate/kill::x86-pid-matched-kernel-attach-terminate"
      - id: "micro-behaviors/process/terminate/kill::x86-caller-configured-kernel-process-layout"
      - id: "micro-behaviors/os/kernel/device::create-device-object"
      - id: "micro-behaviors/os/kernel/device::create-device-symbolic-link"
