defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-ransom-disables-input-driver
    desc: Ransomware input-blocking and PS/2 driver-disable references
    crit: hostile
    conf: 0.97
    attack: T1489,T1499
    all:
      - id: objectives/impact/ransom/extortion::pe-ransom-extortion-content
      - id: micro-behaviors/hardware/input/block::dotnet-block-input-reference
      - id: micro-behaviors/os/service/configure::sc-disables-ps2-input-driver
      - id: micro-behaviors/os/service/stop::sc-stops-ps2-input-driver
