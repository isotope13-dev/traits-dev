defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: ransom-agent-wlan-disruption-commands
    desc: Ransom agent carries WLAN deletion and interface-disable commands
    crit: hostile
    conf: 0.98
    attack: T1489
    all:
      - id: objectives/command-and-control/remote-command/task-schema::socket-ransom-surveillance-control-profile
      - id: micro-behaviors/hardware/wireless/network::netsh-delete-all-wlan-profiles
      - id: micro-behaviors/network/interface::netsh-interface-disable-command-text
