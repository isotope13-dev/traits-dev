defaults:
  platforms: [unix]
  for: [ruby]
  attack: T1489

composite_rules:
  - id: ruby-macos-launchctl-service-degrade
    desc: Ruby launchctl service degrade
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/service/query::ruby-launchctl-service-list
    any:
      - id: micro-behaviors/os/service/stop::ruby-launchctl-stop-service
      - id: micro-behaviors/os/service/stop::ruby-launchctl-bootout
    needs: 1
