defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1489
composite_rules:
  - id: ransomware-process-service-termination
    desc: Ransomware process/service termination controls
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/ransom/encrypt/bulk-encryption::native-base64-extortion-file-encryptor
      - id: micro-behaviors/process/terminate/kill::process-mask-controls
      - id: micro-behaviors/os/service/stop::service-mask-controls

