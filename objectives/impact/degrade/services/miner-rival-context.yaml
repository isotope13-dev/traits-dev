# Listing services and stopping/disabling them, with mining or rival-process
# clues, supports service-disruption evidence. Targets are not bound to the
# service commands; this neither proves rival-miner removal nor Kinsing identity.
defaults:
  platforms:
  - unix
  - windows
  crit: notable
composite_rules:
- for:
  - shell
  size_max: 500000000
  id: service-disruption-with-miner-rival-clues
  size_min: 512
  desc: Service stop/disable with miner or rival-process clues
  conf: 0.9
  all:
  - id: micro-behaviors/os/service/query::systemctl-list-units
  - id: micro-behaviors/os/service/control::systemd-stop-disable
  any:
  - id: well-known/app/finance/xmrig::xmrig-binary-markers
  - id: micro-behaviors/communications/blockchain/mining::cryptonight-str
  - id: micro-behaviors/process/terminate/command::shell-kill-watchdog-token
  - id: objectives/impact/degrade/rival-bot/competitor::mirai-bot-target
  - id: micro-behaviors/process/exit/terminate::update-agent-target
