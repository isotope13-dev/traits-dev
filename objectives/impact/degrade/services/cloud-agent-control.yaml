traits:
- id: aliyun-agent-kill
  desc: Kills Aliyun security agent
  conf: 0.95
  if:
    type: text
    regex: (?i)\b(pkill|kill)\b.{0,20}\baliyun\b
  crit: suspicious
- id: aliyun-agent-uninstall
  desc: Uninstalls Aliyun security agent
  conf: 0.9
  if:
    type: text
    regex: (?i)\baegis\b.{0,20}\buninstall\b
  crit: suspicious
- id: aliyun-agent-stop
  desc: Stops Aliyun security agent
  conf: 0.9
  if:
    type: text
    regex: (?i)\bsystemctl\s+stop\s+aliyun\b
  crit: suspicious
- id: qcloud-agent-uninstall
  desc: Uninstalls QCloud security agent
  conf: 0.9
  if:
    type: text
    regex: (?i)\bqcloud\b.{0,30}\buninstall\b
  crit: suspicious
- id: aegis-agent-uninstall
  desc: Uninstalls Aegis security agent
  conf: 0.9
  if:
    type: text
    regex: (?i)\baegis\b.{0,30}\buninstall\b
  crit: suspicious
- id: yunjing-agent-uninstall
  desc: Uninstalls YunJing security agent
  conf: 0.9
  if:
    type: text
    regex: (?i)\byunjing\b.{0,30}\buninstall\b
  crit: suspicious
composite_rules:
- id: aliyun-agent-disable
  desc: Disables Aliyun security agent
  crit: suspicious
  conf: 0.95
  any:
  - id: objectives/impact/degrade/services::aliyun-agent-kill
  - id: objectives/impact/degrade/services::aliyun-agent-uninstall
  - id: objectives/impact/degrade/services::aliyun-agent-stop
- id: cloud-agent-uninstall
  desc: Uninstalls cloud security agent
  crit: suspicious
  conf: 0.9
  any:
  - id: objectives/impact/degrade/services::qcloud-agent-uninstall
  - id: objectives/impact/degrade/services::aegis-agent-uninstall
  - id: objectives/impact/degrade/services::yunjing-agent-uninstall
- id: cloud-agent-removal-with-miner-killing
  desc: Security-agent removal with miner killing
  crit: hostile
  conf: 0.95
  all:
  - id: cloud-agent-uninstall
  - id: objectives/impact/degrade/rival-bot/competitor::miner-process-kill
defaults:
  for:
  - shell
  platforms:
  - unix
