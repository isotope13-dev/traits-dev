# The ransom hook/form-POST profile independently establishes key recording.
# Accept it alongside the existing recorder profiles; operation legs stay required.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Intent comes from surveillance plus targeting Defender. The command
  # fragments and service name are file-scoped references, not a bound call.
  - id: managed-keylogger-security-service-stop-references
    desc: Keylogger with Defender and service-stop/disable command references
    crit: hostile
    conf: 0.96
    attack: T1489
    all:
      - id: micro-behaviors/os/service/stop::dotnet-sc-stop-command-fragments
      - id: micro-behaviors/os/service/configure::service-disabled-start-argument
      - id: micro-behaviors/os/security/defender::component-name-reference
      - id: metadata/binary/symbols/name/token::dotnet-processstartinfo-name
    any:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: objectives/collection/keylog/hook::managed-low-level-hook-file-keylogger
      - id: objectives/exfiltration/stealer/input::managed-ransom-hook-keylog-form-post
