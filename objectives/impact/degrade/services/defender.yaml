defaults:
  platforms: [windows]
  for: [scripts, binaries, data]
  attack: T1562.001
  mbc: E1562

traits:
- id: defender-service-stop-target
  desc: Stops a Microsoft Defender service
  crit: suspicious
  conf: 0.97
  for: [scripts, source, binaries, data]
  unless:
    - id: micro-behaviors/process/create/shell/guard/
  if:
    type: text
    regex: '(?i)\b(sc|net)(\.exe)?\W{1,24}stop\W{1,24}(WinDefend|Sense|WdNisSvc)z?\b'
- id: defender-service-disabled-target
  desc: Defender service startup disabled
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '(?i)\b(WinDefend|Sense|WdNisSvc)\b[\s\S]{0,100}\bstart\s*=\s*disabled\b'
- id: defender-service-stop-primary
  desc: Stops the primary Defender service
  crit: suspicious
  conf: 0.97
  for: [scripts, source, binaries, data]
  unless:
    - id: micro-behaviors/process/create/shell/guard/
  if:
    type: text
    regex: '(?i)\b(sc|net)(\.exe)?\W{1,24}stop\W{1,24}WinDefendz?\b'
- id: defender-service-stop-secondary
  desc: Stops an auxiliary Defender service
  crit: suspicious
  conf: 0.97
  for: [scripts, source, binaries, data]
  unless:
    - id: micro-behaviors/process/create/shell/guard/
  if:
    type: text
    regex: '(?i)\b(sc|net)(\.exe)?\W{1,24}stop\W{1,24}(Sense|WdNisSvc)z?\b'

composite_rules:
- id: defender-multiple-services-stopped
  desc: Multiple Microsoft Defender services stopped
  crit: hostile
  conf: 0.99
  attack: T1562.001,T1489
  all:
  - id: defender-service-stop-primary
  - id: defender-service-stop-secondary
- id: defender-service-teardown
  for: [batch, powershell]
  desc: Defender services stopped and disabled
  crit: hostile
  conf: 0.99
  attack: T1562.001,T1489
  all:
  - id: defender-service-stop-target
  - id: micro-behaviors/os/service/configure::sc-config-command
  - id: defender-service-disabled-target
- id: defender-service-teardown-native
  for: [pe]
  desc: Executable stops and disables Defender services
  crit: hostile
  conf: 0.97
  attack: T1562.001,T1489
  # The same stop-then-disable pair as the script rule, carried as command
  # strings inside a Windows executable (a payload shelling out to `net stop`
  # and `sc config ... start= disabled`).
  all:
  - id: defender-service-stop-target
  - id: defender-service-disabled-target
  unless:
  - id: metadata/signed/platform/
