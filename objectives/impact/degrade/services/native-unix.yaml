defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]
  attack: T1489

traits:
  - id: native-service-stop-status
    desc: Native service stop status
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'Service PID %d stopped|service PID %d stopped'

  - id: native-web-service-httpd
    desc: Native httpd service target
    crit: component
    if:
      type: text
      word: httpd
  - id: native-web-service-nginx
    desc: Native nginx service target
    crit: component
    if:
      type: text
      word: nginx
  - id: native-web-service-apache
    desc: Native apache service target
    crit: component
    if:
      type: text
      word: apache
  - id: native-database-service-mysql
    desc: Native MySQL service target
    crit: component
    if:
      type: text
      word: mysql
  - id: native-database-service-postgres
    desc: Native PostgreSQL service target
    crit: component
    if:
      type: text
      word: postgres
  - id: native-database-service-redis
    desc: Native Redis service target
    crit: component
    if:
      type: text
      word: redis
  - id: native-database-service-mongod
    desc: Native MongoDB service target
    crit: component
    if:
      type: text
      word: mongod
  - id: native-app-service-tomcat
    desc: Native Tomcat service target
    crit: component
    if:
      type: text
      word: tomcat
  - id: native-app-service-jboss
    desc: Native JBoss service target
    crit: component
    if:
      type: text
      word: jboss
  - id: native-app-service-weblogic
    desc: Native WebLogic service target
    crit: component
    if:
      type: text
      word: weblogic

composite_rules:
  - id: native-web-service-targets
    desc: Native web service targets
    crit: component
    conf: 0.88
    any:
      - id: native-web-service-httpd
      - id: native-web-service-nginx
      - id: native-web-service-apache
      - id: micro-behaviors/os/service/remote::sshd-ref
  - id: native-database-service-targets
    desc: Native database service targets
    crit: component
    conf: 0.88
    any:
      - id: native-database-service-mysql
      - id: native-database-service-postgres
      - id: native-database-service-redis
      - id: native-database-service-mongod
  - id: native-app-service-targets
    desc: Native app service targets
    crit: component
    conf: 0.88
    any:
      - id: native-app-service-tomcat
      - id: native-app-service-jboss
      - id: native-app-service-weblogic
  - id: native-scheduler-dns-targets
    desc: Native scheduler/DNS daemon names co-occur
    crit: component
    conf: 0.88
    # Require each distinct daemon name as a whole word (not count_min on a
    # regex, where the English word "named" alone could satisfy the count).
    # The daemon-name atoms are neutral keywords in micro-behaviors/.
    all:
      - id: metadata/file/string/process-name::crond-name
      - id: metadata/file/string/process-name::xinetd-name
      - id: metadata/file/string/process-name::inetd-name
      - id: metadata/file/string/process-name::named-name

  - id: native-service-target-evidence
    desc: Native service target evidence
    crit: component
    conf: 0.92
    needs: 2
    any:
      - id: native-web-service-targets
      - id: native-scheduler-dns-targets
      - id: native-database-service-targets
      - id: native-app-service-targets

  - id: native-service-sigstop-disruption
    desc: Native SIGSTOP service disruption
    crit: hostile
    conf: 0.98
    all:
      - id: native-service-target-evidence
    any:
      - id: native-service-stop-status
      - id: micro-behaviors/process/control/signal::c-kill-sigstop
