defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]
  attack: T1489

traits:
  - id: native-service-stop-status
    desc: Native service stop status
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'Service PID %d stopped|service PID %d stopped'

  # The bare server names (nginx, mysql, redis, tomcat, ...) that the
  # composites below group are neutral word matches with no service-directed
  # action in the matcher, so they live in
  # metadata/file/string/process-name::*-name and are referenced from here.
  # This mirrors native-scheduler-dns-targets, which already sourced its
  # daemon names from that leaf.

composite_rules:
  - id: native-web-service-targets
    desc: Native web service targets
    crit: component
    conf: 0.88
    unless:
      # Bun/OpenCode carries server-name strings in its runtime and bundled
      # documentation; those strings do not show service disruption.
      - id: well-known/app/ai/coding-agent/delos-cosmos::delos-cosmos-extension
      - id: well-known/app/ai/coding-agent/delos-cosmos::delos-opencode-bundle
      - id: well-known/app/ai/coding-agent/opencode::opencode-bun-runtime
      - id: well-known/app/ai/coding-agent/opencode::opencode-binary-path
      - id: well-known/lib/runtime/bun-runtime::unix-runtime-context
    any:
      - id: metadata/file/string/process-name::httpd-name
      - id: metadata/file/string/process-name::nginx-name
      - id: metadata/file/string/process-name::apache-name
      - id: micro-behaviors/os/service/remote::sshd-ref
  - id: native-database-service-targets
    desc: Native database service targets
    crit: component
    conf: 0.88
    unless:
      - id: well-known/app/ai/coding-agent/delos-cosmos::delos-cosmos-extension
      - id: well-known/app/ai/coding-agent/delos-cosmos::delos-opencode-bundle
      - id: well-known/app/ai/coding-agent/opencode::opencode-bun-runtime
      - id: well-known/app/ai/coding-agent/opencode::opencode-binary-path
      - id: well-known/lib/runtime/bun-runtime::unix-runtime-context
    any:
      - id: metadata/file/string/process-name::mysql-name
      - id: metadata/file/string/process-name::postgres-name
      - id: metadata/file/string/process-name::redis-name
      - id: metadata/file/string/process-name::mongod-name
  - id: native-app-service-targets
    desc: Native app service targets
    crit: component
    conf: 0.88
    any:
      - id: metadata/file/string/process-name::tomcat-name
      - id: metadata/file/string/process-name::jboss-name
      - id: metadata/file/string/process-name::weblogic-name
  - id: native-scheduler-dns-targets
    desc: Native scheduler/DNS daemon names co-occur
    crit: component
    conf: 0.88
    # Require each distinct daemon name as a whole word (not count_min on a
    # regex, where the English word "named" alone could satisfy the count).
    # The daemon-name atoms are neutral keywords in micro-behaviors/.
    all:
      - id: metadata/file/string/process-name::crond-name
      - id: metadata/file/string/process-name::xinetd-name
      - id: metadata/file/string/process-name::inetd-name
      - id: metadata/file/string/process-name::named-name

  - id: native-service-target-evidence
    desc: Native service target evidence
    crit: component
    conf: 0.92
    needs: 2
    any:
      - id: native-web-service-targets
      - id: native-scheduler-dns-targets
      - id: native-database-service-targets
      - id: native-app-service-targets

  - id: native-service-sigstop-disruption
    desc: Native SIGSTOP service disruption
    crit: hostile
    conf: 0.98
    all:
      - id: native-service-target-evidence
    any:
      - id: native-service-stop-status
      - id: micro-behaviors/process/control/signal::c-kill-sigstop
