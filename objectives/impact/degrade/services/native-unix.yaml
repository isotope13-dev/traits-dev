defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]
  attack: T1489

traits:
  - id: native-service-stop-status
    desc: Native service stop status
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'Service PID %d stopped|service PID %d stopped'

  # The bare server names (nginx, mysql, redis, tomcat, ...) that the
  # composites below group are neutral word matches with no service-directed
  # action in the matcher, so they live in
  # metadata/file/string/process-name::*-name and are referenced from here.
  # This mirrors native-scheduler-network-targets, which already sourced its
  # daemon names from that leaf.

composite_rules:
  - id: native-scheduler-network-targets
    for: [elf]
    desc: Native scheduler/network daemon names co-occur
    crit: component
    conf: 0.88
    # Require three distinct scheduler/network daemon name references.
    # The daemon-name atoms are neutral keywords in micro-behaviors/.
    all:
      - id: micro-behaviors/process/info/name::crond-name-reference
      - id: micro-behaviors/process/info/name::xinetd-name-reference
      - id: micro-behaviors/process/info/name::inetd-name-reference

  - id: native-service-target-evidence
    desc: Native service target evidence
    crit: component
    conf: 0.92
    needs: 2
    any:
      - id: micro-behaviors/os/service/daemon::native-web-service-names
      - id: native-scheduler-network-targets
      - id: micro-behaviors/os/service/daemon::native-database-service-names
      - id: metadata/file/catalog/service::java-app-server-name-reference

  - id: native-service-sigstop-disruption
    desc: Native SIGSTOP service disruption
    crit: hostile
    conf: 0.98
    all:
      - id: native-service-target-evidence
    any:
      - id: native-service-stop-status
      - id: micro-behaviors/process/control/signal::c-kill-sigstop
