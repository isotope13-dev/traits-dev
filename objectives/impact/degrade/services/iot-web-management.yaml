# A device-management kill command alone can be maintenance. Require the
# credential-assisted shell propagation profile to establish bot disruption.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1489

composite_rules:
  - id: iot-propagator-stops-web-management
    desc: IoT shell propagation with web-management termination command
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-shell-stager
      - id: micro-behaviors/process/control/signal::embedded-httpd-termination
