defaults:
  platforms: [windows]
  for: [pe]
  attack: T1489

composite_rules:
- id: packed-installer-service-removal-loader
  desc: Packed elevated installer with service and registry cleanup API imports
  crit: hostile
  conf: 0.97
  attack: T1027.002,T1112,T1543.003
  all:
  - id: objectives/command-and-control/dropper/execution/installer::nsis-admin-rwx-overlay-loader
  - id: micro-behaviors/os/service/control::delete-service
  - id: micro-behaviors/os/registry/manipulate::reg-delete-value-a-symbol
  unless:
  - id: metadata/signed/platform/

- id: disabled-service-with-file-locker
  desc: File locker disables a Windows service
  crit: hostile
  conf: 0.98
  for: [c, cpp, pe, dll]
  all:
  - id: micro-behaviors/os/service/control::change-service-config-disabled
  - id: objectives/impact/ransom/encrypt/bulk-encryption::windows-native-locker-workflow
