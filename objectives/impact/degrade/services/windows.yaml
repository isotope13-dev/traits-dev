  - id: micro-behaviors/os/service/delete::delete-service
  - id: micro-behaviors/os/registry/delete::reg-delete-value-a-symbol

- id: disabled-service-with-file-locker
  desc: File locker disables a Windows service
  crit: hostile
  conf: 0.98
  for: [c]
  all:
  - id: micro-behaviors/os/service/configure::change-service-config-disabled
  - id: objectives/impact/ransom/encrypt/bulk-encryption::windows-native-locker-workflow
