defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # The recorder supplies attack context. These file-scoped references do
  # not establish a bound call or successful service termination.
  - id: managed-keylogger-security-center-stop-references
    desc: Hook keylogger with Security Center stop arguments
    crit: hostile
    conf: 0.96
    attack: T1489,T1562.001
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: micro-behaviors/os/service/stop::security-center-stop-arguments
      - id: micro-behaviors/process/create/subprocess::dotnet-process-start-split-tokens
