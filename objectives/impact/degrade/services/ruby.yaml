defaults:
  platforms: [freebsd, unix]
  for: [ruby]
  attack: T1489

traits:
  - id: ruby-service-stop-loop
    desc: Ruby loops service stop commands
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'TARGET_SERVICES[\s\S]{0,360}service #\{svc\} stop'

  - id: ruby-core-service-targets
    desc: Ruby core server service list
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "TARGET_SERVICES[\\s\\S]{0,360}'(sshd|nginx|apache24)'"

  - id: ruby-data-service-targets
    desc: Ruby data server service list
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "TARGET_SERVICES[\\s\\S]{0,360}'(postgresql|mysql|redis)'"

  - id: ruby-mail-service-targets
    desc: Ruby mail service list
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "TARGET_SERVICES[\\s\\S]{0,360}'(dovecot|postfix)'"

composite_rules:
  - id: ruby-freebsd-service-stoppage
    desc: Ruby stops FreeBSD server services
    crit: hostile
    conf: 0.98
    all:
      - id: ruby-service-stop-loop
    any:
      - id: ruby-core-service-targets
      - id: ruby-data-service-targets
      - id: ruby-mail-service-targets
