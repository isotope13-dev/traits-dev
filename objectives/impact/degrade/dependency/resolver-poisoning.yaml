# Poisoned resolver output breaks consumers (sabotage impact).
#
# Staging a non-module inside an awaited resolver pipeline is only half
# the sabotage; the other half is delivering it positionally — returning
# results[N] where N is the seeded slot — so the caller receives a stream
# class where it expected a module and stalls. The trojanized-library
# composite convicts the targeting (context probe plus seeded list); this
# states the impact half (seeded list plus positional delivery), which is
# what turns the poison into a dependency-chain outage for every consumer
# that awaits the pipeline.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1485
  mbc: B0024

composite_rules:
  - id: resolver-pipeline-positional-substitution
    desc: Seeded resolver output delivered by index
    crit: hostile
    conf: 0.95
    # The two delivery fragments are components -- `[Readable]` and
    # `return results[0]` are each ordinary on their own -- so the context
    # probe carries the verdict here as it does in the targeting composite.
    # Without it this rule convicted on two lines that any bundled library
    # can contain.
    all:
      - id: objectives/anti-analysis/environment-detect/check::node-parent-chain-git-checkout-probe
      - id: objectives/supply-chain/trojanized/library/module-intercept::node-bracketed-stream-class
      - id: objectives/supply-chain/trojanized/library/module-intercept::node-indexed-results-return
