# An established package's release that ships nothing: the manifest still
# names a main entrypoint, the metadata still names the real project, and the
# tarball contains neither. The trojanized/dist rules convict the empty ship
# from the artifact side; this states the impact -- every consumer pinning
# the name gets a package whose import cannot resolve, which is a
# dependency-chain outage delivered through the registry, whether the author
# calls it protest, endless war, or an accident.
#
# Worked example: faker 6.6.6, the real name and repository with the entire
# library deleted and a one-line README left in its place.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, zip, archives]
  attack: T1195.002,T1485
  mbc: B0024

composite_rules:
  - id: established-release-ships-unresolvable-entry
    desc: Named entrypoint absent from established release
    crit: hostile
    conf: 0.94
    scope: archive
    all:
      - id: metadata/package/manifest/entrypoint::npm-main-entrypoint-not-shipped
      - id: objectives/supply-chain/trojanized/dist::established-package-shipped-empty
