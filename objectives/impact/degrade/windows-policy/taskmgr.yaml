defaults:
  crit: suspicious
  platforms: [windows]
  for: [binaries, source, batch]
  attack: T1112

traits:
- id: batch-reg-disable-taskmgr
  desc: Batch writes DisableTaskMgr policy
  crit: suspicious
  conf: 0.94
  for: [batch]
  if:
    type: text
    regex: '(?i)reg\s+add.{0,120}DisableTaskMgr.{0,80}/d\s+1\b'

- id: batch-reg-disable-registry-tools
  desc: Batch writes DisableRegistryTools policy
  crit: suspicious
  conf: 0.94
  for: [batch]
  if:
    type: text
    regex: '(?i)reg\s+add.{0,120}DisableRegistryTools.{0,80}/d\s+1\b'

- id: rename-msconfig-exe
  desc: Renames the system config tool
  crit: notable
  conf: 0.9
  for: [batch, static-lib, text]
  if:
    type: text
    regex: '(?i)\brename\b[^\r\n]{0,80}msconfig\.exe'

- id: silent-regedit-import
  desc: Silently imports a registry file
  crit: notable
  conf: 0.88
  for: [batch, static-lib, text]
  if:
    type: text
    regex: '(?i)\bregedit(\.exe)?\s+-s\b'

composite_rules:
- id: admin-command-tool-policy-lockout
  for: [pe, batch, csharp]
  desc: Disables Task Manager and Command Prompt
  crit: hostile
  conf: 0.98
  attack: T1562.001,T1112
  all:
  - id: micro-behaviors/os/registry/write::taskmgr-policy-write-api-cooccurrence
  - id: micro-behaviors/os/registry/write::cmd-policy-write-api-cooccurrence
  any:
  - id: micro-behaviors/os/registry/keys/policy::policies-system-path
  - id: micro-behaviors/os/registry/keys/policy::policies-system-path-code-section

# A native program that writes the DisableTaskMgr policy, persists itself under
# the Run key, and installs a global input hook is a user-lockout trojan: it
# removes the tool a victim would use to end it, restarts at every logon, and
# watches or swallows input. Each piece is ordinary alone; Task Manager policy
# writes are normally paired with an administrative template, not a Run key
# and a hook.
- id: taskmgr-policy-run-key-input-hook-lockout
  for: [pe]
  desc: Disables Task Manager, persists in Run, hooks input
  crit: hostile
  conf: 0.93
  attack: T1562.001,T1112,T1547.001
  all:
  - id: micro-behaviors/os/registry/write::taskmgr-policy-write-api-cooccurrence
  - id: micro-behaviors/os/registry/manipulate::run-path-write-api-references
  - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/

- id: command-prompt-process-lockout
  for: [pe]
  desc: Disables and terminates Command Prompt
  crit: hostile
  conf: 0.99
  attack: T1562.001,T1499
  all:
  - id: admin-command-tool-policy-lockout
  - id: micro-behaviors/process/terminate/kill::process-kill-by-name
  any:
  - id: micro-behaviors/process/create/shell/spawn::cmd-name
  - id: micro-behaviors/process/create/shell/spawn::cmd-dotnet-user-string

- id: vbs-taskmgr-policy-lockout
  for: [vbs]
  desc: Disables and kills Task Manager
  crit: hostile
  conf: 0.97
  attack: T1562.001,T1112
  all:
  - id: "micro-behaviors/os/registry/keys/policy::disable-taskmgr"
  - id: micro-behaviors/os/registry/write::wsh-regwrite-dword
  - id: micro-behaviors/process/terminate/command::vbs-taskkill-taskmgr

- id: batch-taskmgr-policy-lockout
  for: [batch]
  desc: Disables and kills Task Manager
  crit: hostile
  conf: 0.97
  attack: T1562.001,T1112
  all:
  - id: batch-reg-disable-taskmgr
  - id: micro-behaviors/process/terminate/command::script-taskkill-taskmgr

- id: batch-taskmgr-registry-lockout
  for: [batch]
  desc: Batch disables Task Manager and Registry Editor
  crit: hostile
  conf: 0.98
  attack: T1562.001,T1112
  all:
  - id: batch-reg-disable-taskmgr
  - id: batch-reg-disable-registry-tools

- id: regedit-then-rd-tree
  desc: Imports registry files and deletes a tree
  crit: hostile
  conf: 0.93
  for: [batch, static-lib, text]
  all:
  - id: silent-regedit-import
  - id: micro-behaviors/fs/delete/directory::rd-named-tree

- id: rename-msconfig-and-import
  desc: Renames msconfig and imports registry
  crit: hostile
  conf: 0.94
  for: [batch, static-lib, text]
  all:
  - id: rename-msconfig-exe
  - id: silent-regedit-import
