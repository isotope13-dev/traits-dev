defaults:
  crit: suspicious
  platforms: [windows]
  for: [binaries, source, batch]
  attack: T1112

traits:
- id: batch-reg-disable-taskmgr
  desc: Batch writes DisableTaskMgr policy
  crit: suspicious
  conf: 0.94
  for: [batch]
  if:
    type: text
    regex: '(?i)reg\s+add.{0,120}DisableTaskMgr.{0,80}/d\s+1\b'

- id: rename-msconfig-exe
  desc: Renames the system config tool
  crit: notable
  conf: 0.9
  for: [batch, static-lib, text]
  if:
    type: text
    regex: '(?i)\brename\b[^\r\n]{0,80}msconfig\.exe'

- id: silent-regedit-import
  desc: Silently imports a registry file
  crit: notable
  conf: 0.88
  for: [batch, static-lib, text]
  if:
    type: text
    regex: '(?i)\bregedit(\.exe)?\s+-s\b'

- id: rd-named-tree
  desc: Quietly removes a named directory
  crit: notable
  conf: 0.88
  for: [batch, static-lib]
  if:
    type: text
    regex: '(?i)\brd\s+\S+\s+/s\s+/q'

composite_rules:
- id: disable-taskmgr-policy
  for: [pe, batch, csharp, vbs, powershell]
  desc: Writes DisableTaskMgr policy
  crit: suspicious
  conf: 0.85
  all:
  - id: micro-behaviors/os/registry/keys::disable-taskmgr
  any:
  - id: micro-behaviors/os/registry/manipulate::registry-write-marker
  - id: micro-behaviors/os/registry/manipulate::set-value
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  - id: micro-behaviors/os/registry/manipulate::dotnet-registry-key-write
  - id: micro-behaviors/os/registry/write/dword::wsh-regwrite-dword
  - id: micro-behaviors/os/registry/write/property::powershell-registry-property-write
  downgrade:
    any:
    - id: well-known/app/utility/startallback::startallback-basename
    - id: well-known/app/utility/startallback::darkmagic-basename
    - id: metadata/binary/vendor/
  unless:
  - id: well-known/app/utility/installer::startallback-installer

- id: disable-cmd-policy
  for: [pe, batch, csharp, powershell]
  desc: Writes DisableCMD policy
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/os/registry/keys::disable-cmd
  any:
  - id: micro-behaviors/os/registry/manipulate::registry-write-marker
  - id: micro-behaviors/os/registry/manipulate::set-value
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  - id: micro-behaviors/os/registry/manipulate::dotnet-registry-key-write
  - id: micro-behaviors/os/registry/write/property::powershell-registry-property-write

- id: admin-command-tool-policy-lockout
  for: [pe, batch, csharp]
  desc: Disables Task Manager and Command Prompt
  crit: hostile
  conf: 0.98
  attack: T1562.001,T1112
  all:
  - id: disable-taskmgr-policy
  - id: disable-cmd-policy
  any:
  - id: metadata/file/policy/identity::policies-system-path
  - id: metadata/file/policy/identity::policies-system-path-dotnet

- id: command-prompt-process-lockout
  for: [pe]
  desc: Disables and terminates Command Prompt
  crit: hostile
  conf: 0.99
  attack: T1562.001,T1499
  all:
  - id: admin-command-tool-policy-lockout
  - id: micro-behaviors/process/terminate/kill::process-kill-by-name
  any:
  - id: micro-behaviors/process/create/shell/spawn::cmd-name
  - id: micro-behaviors/process/create/shell/spawn::cmd-dotnet-user-string

- id: vbs-taskmgr-policy-lockout
  for: [vbs]
  desc: Disables and kills Task Manager
  crit: hostile
  conf: 0.97
  attack: T1562.001,T1112
  all:
  - id: micro-behaviors/os/registry/keys::disable-taskmgr
  - id: micro-behaviors/os/registry/write/dword::wsh-regwrite-dword
  - id: micro-behaviors/process/terminate/command::vbs-taskkill-taskmgr

- id: regedit-then-rd-tree
  desc: Imports registry files and deletes a tree
  crit: hostile
  conf: 0.93
  for: [batch, static-lib]
  all:
  - id: silent-regedit-import
  - id: rd-named-tree

- id: rename-msconfig-and-import
  desc: Renames msconfig and imports registry
  crit: hostile
  conf: 0.94
  for: [batch, static-lib, text]
  all:
  - id: rename-msconfig-exe
  - id: silent-regedit-import
