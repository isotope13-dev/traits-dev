# PowerShell that disables Windows Smart App Control / Code-Integrity
# reputation enforcement. Writing VerifiedAndReputablePolicyState 0 under
# CI\Policy turns off reputation-based blocking; SacLearningModeSwitch 0 and a
# `citool -r` refresh push the change live. The native-code rule for this lives
# in windows-policy/native.yaml but is scoped to PE/C, so a script-based
# teardown was invisible. Reputation enforcement is what stops an unsigned,
# unknown downloaded EXE from launching -- turning it off has no benign use.
defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1562.001
  mbc: B0003

traits:
  - id: verified-reputable-state-set-zero
    desc: VerifiedAndReputablePolicyState set to zero
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)VerifiedAndReputablePolicyState[\s\S]{0,60}-Value\s+0\b'
  - id: sac-learning-mode-set-zero
    desc: SacLearningModeSwitch set to zero
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)SacLearningModeSwitch[\s\S]{0,60}-Value\s+0\b'
  - id: citool-refresh-stop
    desc: CiTool refresh applies policy change
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bcitool\b[\s\S]{0,20}-r\b'

composite_rules:
  - id: powershell-smart-app-control-disable
    desc: PowerShell disables Smart App Control reputation
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: verified-reputable-state-set-zero
    any:
      - id: sac-learning-mode-set-zero
      - id: citool-refresh-stop
