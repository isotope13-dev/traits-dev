defaults:
  crit: notable
  platforms: [windows]
  for: [batch, static-lib]
  attack: T1021.001

traits:
  - id: ts-enable-on
    desc: Answer file enables Terminal Services
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bTSEnable\s*=\s*on\b'

  - id: sysocmgr-unattended
    desc: Applies an unattended component file
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bsysocmgr\b[^\r\n]{0,80}/u:'

composite_rules:
  - id: unattended-terminal-services
    desc: Enables Terminal Services from an answer file
    crit: hostile
    conf: 0.94
    all:
      - id: ts-enable-on
      - id: sysocmgr-unattended
