defaults:
  platforms:
  - windows
  for:
  - html
  - vbs
  - javascript
  - batch
  - powershell
  crit: notable
  conf: 0.98
traits:
- id: regwrite-disable-registry-tools
  desc: RegWrite enables the DisableRegistryTools policy
  if:
    type: text
    case_insensitive: true
    regex: \bRegWrite\b.{0,160}[\\"]DisableRegistryTools"\s*,\s*("REG_DWORD"\s*,\s*)?"?1\b
  for:
  - html
  - vbs
  - javascript
  - batch
  - powershell
  - text
