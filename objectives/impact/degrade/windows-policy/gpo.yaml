# A linked GPO combining firewall impairment, local account lockout, forced
# screen changes, and endpoint file deployment is a domain-wide disruption
# chain rather than ordinary policy administration.
defaults:
  platforms: [windows]
  for: [powershell, batch, scripts]
  attack: T1484.001

composite_rules:
  - id: disruptive-domain-gpo-bundle
    desc: Linked GPO impairs firewall, account access, and endpoint screens
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/degrade/firewall::linked-gpo-disables-windows-firewall
      - id: objectives/impact/deface/screen::linked-gpo-logon-screen-defacement
      - id: micro-behaviors/os/security/policy::gpttmpl-security-template-path
      - id: micro-behaviors/os/security/policy::gpttmpl-disable-built-in-administrator
      - id: micro-behaviors/os/security/policy::gpupdate-force
    near_lines: 80
