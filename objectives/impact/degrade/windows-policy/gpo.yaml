# A linked GPO combining firewall impairment, local account lockout, forced
# screen changes, and endpoint file deployment is a domain-wide disruption
# chain rather than ordinary policy administration.
defaults:
  platforms: [windows]
  for: [powershell, batch, scripts]
  attack: T1484.001

composite_rules:
  - id: disruptive-domain-gpo-bundle
    desc: Linked GPO impairs firewall, account access, and endpoint screens
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/degrade/firewall/disable::linked-gpo-disables-windows-firewall
      - id: objectives/impact/deface/screen::linked-gpo-logon-screen-defacement
      - id: micro-behaviors/os/security/gpo::gpttmpl-security-template-path
      - id: micro-behaviors/os/security/gpo::gpttmpl-disable-built-in-administrator
      - id: micro-behaviors/os/security/gpo::gpupdate-force
    near_lines: 80

  - id: gpo-archive-admin-lockout-extortion
    desc: GPO archive disables Administrator and deploys logon notice and root file
    crit: hostile
    conf: 0.98
    attack: T1484.001,T1531
    for: [archives, xml, text]
    scope: archive
    all:
      - id: micro-behaviors/os/security/gpo::gpttmpl-disable-built-in-administrator
      - id: micro-behaviors/os/registry/value-name::legal-notice-caption
      - id: micro-behaviors/os/registry/value-name::legal-notice-text
      - id: micro-behaviors/os/security/gpo::gpp-sysvol-readonly-root-file-drop

  - id: gpo-archive-disruptive-domain-bundle
    desc: GPO archive disables firewall, locks Administrator, and defaces screens
    crit: hostile
    conf: 0.99
    attack: T1484.001,T1562.004,T1531
    for: [archives, xml, text]
    scope: archive
    all:
      - id: objectives/impact/deface/screen::gpo-archive-logon-screen-defacement
      - id: micro-behaviors/os/security/gpo::gpttmpl-disable-built-in-administrator
      - id: micro-behaviors/os/security/gpo::gpp-registry-enable-firewall-zero
