defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1562

traits:
  - id: windows-defender-realtime-policy
    desc: Defender disable-monitoring policy name
    crit: notable
    conf: 0.94
    for: [pe, dll]
    if:
      type: text
      substr: DisableRealtimeMonitoring

  - id: windows-defender-realtime-policy-source
    desc: Defender disable-monitoring policy write
    crit: suspicious
    conf: 0.94
    for: [c, cpp]
    if:
      type: text
      # Query-only RegQueryValueExW("DisableRealtimeMonitoring") is discovery, not degrade.
      regex: '(?i)SetValue.{0,50}DisableRealtimeMonitoring'

  - id: windows-uac-enablelua-policy
    desc: Native EnableLUA policy value write
    crit: suspicious
    conf: 0.93
    for: [c, cpp]
    if:
      type: text
      # Query-only SHGetValue("EnableLUA") is discovery, not degrade.
      regex: '(?i)SetValue.{0,50}EnableLUA'

  # Code Integrity / Smart App Control "VerifiedAndReputablePolicyState" under
  # SYSTEM\CurrentControlSet\Control\CI\Policy — malware writes 0 then refreshes
  # with CiTool to disable reputation-based blocking.
  - id: citool-refresh-command
    desc: CiTool --refresh trust policy command
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: CiTool --refresh

  - id: ci-policy-reload-class
    desc: Code Integrity policy reload information class
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bNtSetSystemInformation\b[\s\S]{0,160}\b0xA4\b'

  # The option value only means "Code Integrity policy reload" next to the
  # call that consumes it. On its own `0x10000000` is just the constant
  # 268435456 — as a bare literal this fired on 404 files of Zig's bundled
  # libc/musl/kernel headers, where it is an ordinary flag or size value.
  - id: ci-policy-reload-option
    desc: Code Integrity policy reload option
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bNtSetSystemInformation\b[\s\S]{0,200}\b0x10000000\b'

  - id: windows-firewall-enable-policy
    desc: Firewall EnableFirewall policy
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'FirewallPolicy[\s\S]{0,160}EnableFirewall'

composite_rules:
  - id: ci-verified-reputable-policy-disable
    desc: CI VerifiedAndReputable policy disabled
    crit: suspicious
    conf: 0.96
    attack: T1562.001
    mbc: B0003
    all:
      - id: micro-behaviors/os/registry/policy/reference::ci-policy-key-path
      - id: micro-behaviors/os/registry/policy/reference::verified-reputable-policy-state
      - id: micro-behaviors/os/registry/write::registry-value-write
    any:
      - id: citool-refresh-command
      - id: micro-behaviors/process/create/exec::create-process-api-name
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: micro-behaviors/process/create/exec::winexec-source
    near_lines: 60

  - id: ci-system-information-policy-tamper
    desc: Code Integrity policy tampering through native reload
    crit: hostile
    conf: 0.99
    attack: T1562.001
    all:
      - id: micro-behaviors/os/registry/policy/reference::ci-policy-key-path
      - id: micro-behaviors/os/registry/policy/reference::verified-reputable-policy-state
      - id: micro-behaviors/os/sysinfo/config::nt-set-system-information
      - id: ci-policy-reload-class
      - id: ci-policy-reload-option
    any:
      - id: micro-behaviors/os/registry/value/write::registry-set-value-api
      - id: micro-behaviors/os/registry/value/write::registry-set-value-source
    near_lines: 60

  - id: native-windows-security-policy-degrade
    desc: Native Windows security policy degrade
    crit: hostile
    conf: 0.98
    unless:
      - id: well-known/lib/platform/microsoft-shell32::microsoft-shell32-system-context
    all:
      - id: micro-behaviors/os/registry/value/write::registry-set-value-api
    any:
      - id: windows-defender-realtime-policy
      - id: windows-defender-realtime-policy-source
      - id: windows-uac-enablelua-policy
      - id: "micro-behaviors/os/registry/policy/reference::uac-enablelua-token"
      - id: micro-behaviors/os/registry/value-name::smartscreen-policy-reference-cluster
      - id: windows-firewall-enable-policy
      - id: micro-behaviors/os/autorun/policy::autorun-policy-value
    needs: 3
