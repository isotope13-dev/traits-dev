defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1562

traits:
  - id: windows-defender-realtime-policy
    desc: Defender disable-monitoring policy
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: DisableRealtimeMonitoring
    unless:
      - id: well-known/app/system/iobit::advanced-systemcare-component-context
      # VSIX webviews and bundled CLIs often ship security guidance as
      # documentation; the string is not a policy mutation by itself.
      - id: metadata/package/files/dependency::vsix-bundled-native-tool-path
      - type: path
        regex: 'extension[\\/](bin|out|dist|build|webview|vendor|media)'
      # Security guidance embedded in a bundled documentation blob is not a
      # policy mutation; require the operational API evidence for that case.
      - type: text
        regex: '(?is)Logging.{0,60}Audit Tampering'

  - id: windows-uac-enablelua-policy
    desc: Native EnableLUA policy value write
    crit: suspicious
    conf: 0.93
    for: [c, cpp]
    if:
      type: text
      # Query-only SHGetValue("EnableLUA") is discovery, not degrade.
      regex: '(?i)SetValue.{0,50}EnableLUA'

  - id: disable-smartscreen-policy
    desc: DisableSmartScreen policy value
    crit: component
    conf: 0.9
    if:
      type: text
      substr: DisableSmartScreen

  - id: smartscreen-enabled-policy
    desc: SmartScreenEnabled policy value
    crit: component
    conf: 0.9
    if:
      type: text
      substr: SmartScreenEnabled

  - id: phishingfilter-policy-value
    desc: PhishingFilter policy value
    crit: component
    conf: 0.9
    if:
      type: text
      substr: PhishingFilter

  # Code Integrity / Smart App Control "VerifiedAndReputablePolicyState" under
  # SYSTEM\CurrentControlSet\Control\CI\Policy — malware writes 0 then refreshes
  # with CiTool to disable reputation-based blocking.
  - id: ci-policy-key-path
    desc: Code Integrity CI Policy registry path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)Control\\+CI\\+Policy'

  - id: verified-reputable-policy-state
    desc: VerifiedAndReputablePolicyState value
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bVerifiedAndReputablePolicyState\b'

  - id: citool-refresh-command
    desc: CiTool --refresh trust policy command
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: CiTool --refresh

  - id: ci-policy-reload-api
    desc: Code Integrity policy reload API
    crit: notable
    conf: 0.96
    if:
      type: symbol
      exact: NtSetSystemInformation

  - id: ci-policy-reload-class
    desc: Code Integrity policy reload information class
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bNtSetSystemInformation\b[\s\S]{0,160}\b0xA4\b'

  # The option value only means "Code Integrity policy reload" next to the
  # call that consumes it. On its own `0x10000000` is just the constant
  # 268435456 — as a bare literal this fired on 404 files of Zig's bundled
  # libc/musl/kernel headers, where it is an ordinary flag or size value.
  - id: ci-policy-reload-option
    desc: Code Integrity policy reload option
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bNtSetSystemInformation\b[\s\S]{0,200}\b0x10000000\b'

  - id: windows-firewall-enable-policy
    desc: Firewall EnableFirewall policy
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'FirewallPolicy[\s\S]{0,160}EnableFirewall'

composite_rules:
  - id: windows-smartscreen-policy-values
    desc: SmartScreen policy values
    crit: suspicious
    conf: 0.92
    any:
      - id: disable-smartscreen-policy
      - id: smartscreen-enabled-policy
      - id: phishingfilter-policy-value
    needs: 2
    unless:
      - id: well-known/app/security/itop-vpn::benign-context
      - id: well-known/app/system/iobit::advanced-systemcare-component-context

  # Source samples write CI policy via RegSetValueEx* calls (matched by
  # registry-set-value-source); PE imports match registry-set-value-api.
  - id: ci-policy-registry-write
    desc: CI policy registry value write
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/os/registry/access::registry-set-value-api
      - id: micro-behaviors/os/registry/access::registry-set-value-source

  - id: ci-verified-reputable-policy-disable
    desc: CI VerifiedAndReputable policy disabled
    crit: suspicious
    conf: 0.96
    attack: T1562.001
    mbc: B0003
    all:
      - id: ci-policy-key-path
      - id: verified-reputable-policy-state
      - id: ci-policy-registry-write
    any:
      - id: citool-refresh-command
      - id: micro-behaviors/process/create/launch::create-process-api-name
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/process/create/direct::winexec-source
    near_lines: 60

  - id: ci-system-information-policy-tamper
    desc: Code Integrity policy tampering through native reload
    crit: hostile
    conf: 0.99
    attack: T1562.001
    all:
      - id: ci-policy-key-path
      - id: verified-reputable-policy-state
      - id: ci-policy-reload-api
      - id: ci-policy-reload-class
      - id: ci-policy-reload-option
    any:
      - id: micro-behaviors/os/registry/access::registry-set-value-api
      - id: micro-behaviors/os/registry/access::registry-set-value-source
    near_lines: 60

  - id: native-windows-security-policy-degrade
    desc: Native Windows security policy degrade
    crit: hostile
    conf: 0.98
    unless:
      - id: well-known/lib/platform/microsoft-shell32::microsoft-shell32-system-context
    all:
      - id: micro-behaviors/os/registry/access::registry-set-value-api
    any:
      - id: windows-defender-realtime-policy
      - id: windows-uac-enablelua-policy
      - id: micro-behaviors/os/registry/keys::uac-enablelua-token
      - id: windows-smartscreen-policy-values
      - id: windows-firewall-enable-policy
      - id: micro-behaviors/os/autorun/policy::autorun-policy-value
    needs: 3
