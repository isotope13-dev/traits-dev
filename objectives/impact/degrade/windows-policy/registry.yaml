defaults:
  for: [pe]
  platforms: [windows]
  attack: T1112

traits:
- id: split-disable-registrytools-a
  desc: Split DisableRegistryTools fragment A
  crit: component
  conf: 0.95
  if:
    type: text
    exact: DisableR
- id: split-disable-registrytools-b
  desc: Split DisableRegistryTools fragment B
  crit: component
  conf: 0.95
  if:
    type: text
    exact: egistryTools
- id: split-disableregistrytools-a
  desc: Split DisableRegistryTools fragment C
  crit: component
  conf: 0.95
  if:
    type: text
    exact: DisableRe
- id: split-disableregistrytools-b
  desc: Split DisableRegistryTools fragment D
  crit: component
  conf: 0.95
  if:
    type: text
    exact: gistryTools
- id: task-manager-exe-target
  desc: Task Manager executable target
  crit: component
  conf: 0.78
  if:
    type: text
    exact: taskmgr.exe

composite_rules:
- id: disable-registrytools-split-a
  desc: Split DisableRegistryTools string
  crit: component
  conf: 0.95
  all:
  - id: split-disable-registrytools-a
  - id: split-disable-registrytools-b
- id: disable-registrytools-split-b
  desc: Split DisableRegistryTools string
  crit: component
  conf: 0.95
  all:
  - id: split-disableregistrytools-a
  - id: split-disableregistrytools-b
- id: explorer-policy-lockdown
  desc: Writes multiple Explorer restriction policies
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/file/policy/identity::policies-explorer-path-any
  - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
  - id: metadata/file/policy/identity::explorer-restriction-value-set
  any:
  - id: metadata/file/policy/identity::policies-network-path
  - id: metadata/file/policy/identity::policies-comdlg32-path
  - id: metadata/file/policy/identity::network-dialog-restriction-value-set
  unless:
  - id: metadata/file/policy/identity::known-benign-policy-context
  - id: metadata/signed/leaf::huawei-device-co.-ltd.
  - id: metadata/signed/platform/
  - id: well-known/tool/browser/
  # Statically linked MFC embeds these policy names and generic profile
  # registry writers; the app/dialog framework pair identifies that catalog.
  - id: metadata/binary/framework::mfc-application-dialog-framework
- id: explorer-network-dialog-policy-lockdown
  desc: Locks Explorer network and dialog policies
  crit: suspicious
  conf: 0.98
  all:
  - id: explorer-policy-lockdown
  any:
  - id: metadata/file/policy/identity::policies-network-path
  - id: metadata/file/policy/identity::policies-comdlg32-path
  - id: metadata/file/policy/identity::network-dialog-restriction-value-set
  needs: 3
  unless:
  - id: metadata/file/policy/identity::known-benign-policy-context
  - id: metadata/binary/framework::mfc-application-dialog-framework
- id: registry-tools-policy-lockout
  desc: Disables Registry Editor by policy
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
  - id: metadata/file/policy/identity::policies-system-suffix
  - id: disable-registrytools-split-a
  - id: disable-registrytools-split-b
  - id: task-manager-exe-target
- id: ransomware-policy-lockout
  desc: Ransomware disables Registry Editor and Task Manager
  crit: hostile
  conf: 0.99
  attack: T1486,T1562.001,T1112
  all:
  - id: micro-behaviors/os/registry/keys::disable-registry-tools
  - id: micro-behaviors/os/registry/keys::disable-taskmgr
  - id: objectives/impact/ransom/encrypt/config::ransom-note-text
