defaults:
  for: [pe]
  platforms: [windows]
  attack: T1112

traits:
- id: split-disable-registrytools-a
  desc: Split DisableRegistryTools fragment A
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: DisableR
- id: split-disable-registrytools-b
  desc: Split DisableRegistryTools fragment B
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: egistryTools
- id: split-disableregistrytools-a
  desc: Split DisableRegistryTools fragment C
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: DisableRe
- id: split-disableregistrytools-b
  desc: Split DisableRegistryTools fragment D
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: gistryTools
- id: ipsec-local-policy-path
  desc: Local IPSec policy registry path
  crit: suspicious
  conf: 0.92
  for: [text, static-lib, batch, reg]
  if:
    type: text
    substr: 'IPSec\Policy\Local'
- id: ipsec-active-policy-value
  desc: Assigns the active policy value
  crit: suspicious
  conf: 0.86
  for: [text, static-lib, batch, reg]
  if:
    type: text
    substr: '"ActivePolicy"='
- id: ipsec-negotiation-policy
  desc: Defines an IPSec negotiation policy
  crit: suspicious
  conf: 0.9
  for: [text, static-lib, batch, reg]
  # A talloc dump names the schema class as a heap label ("contains N bytes"),
  # which is not a policy definition.
  unless:
    - type: text
      regex: 'ipsecNegotiationPolicy\s+contains\s+\d+\s+bytes'
  if:
    type: text
    substr: ipsecNegotiationPolicy
composite_rules:
- id: ipsec-policy-activated
  desc: Activates a local IPSec policy
  crit: hostile
  conf: 0.94
  for: [text, static-lib, batch, reg]
  attack: T1562.004
  all:
  - id: ipsec-local-policy-path
  - id: ipsec-active-policy-value
  - id: ipsec-negotiation-policy
- id: disable-registrytools-split-a
  desc: Split DisableRegistryTools string
  crit: component
  conf: 0.95
  all:
  - id: split-disable-registrytools-a
  - id: split-disable-registrytools-b
- id: disable-registrytools-split-b
  desc: Split DisableRegistryTools string
  crit: component
  conf: 0.95
  all:
  - id: split-disableregistrytools-a
  - id: split-disableregistrytools-b
- id: explorer-policy-lockdown
  desc: Writes multiple Explorer restriction policies
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/os/registry/explorer::explorer-policy-path
  - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
  - id: micro-behaviors/os/registry/value-name::explorer-restriction-value-set
  any:
  - id: micro-behaviors/os/registry/keys/policy::policies-network-path
  - id: micro-behaviors/os/registry/keys/policy::policies-comdlg32-path
  - id: micro-behaviors/os/registry/value-name::network-dialog-restriction-value-set
  unless:
  - id: metadata/file/policy/identity::known-benign-policy-context
  - id: metadata/signed/leaf::huawei-device-co.-ltd.
  - id: metadata/signed/platform/
  - id: well-known/tool/browser/
  # Statically linked MFC embeds these policy names and generic profile
  # registry writers; the application framework identifies that catalog.
  - id: metadata/binary/framework::mfc-application-dialog-framework
  - id: metadata/binary/framework::mfc-application-framework
- id: explorer-network-dialog-policy-lockdown
  desc: Locks Explorer network and dialog policies
  crit: suspicious
  conf: 0.98
  all:
  - id: explorer-policy-lockdown
  any:
  - id: micro-behaviors/os/registry/keys/policy::policies-network-path
  - id: micro-behaviors/os/registry/keys/policy::policies-comdlg32-path
  - id: micro-behaviors/os/registry/value-name::network-dialog-restriction-value-set
  needs: 3
  unless:
  - id: metadata/file/policy/identity::known-benign-policy-context
  - id: metadata/binary/framework::mfc-application-dialog-framework
  - id: metadata/binary/framework::mfc-application-framework
- id: registry-tools-policy-lockout
  desc: Disables Registry Editor by policy
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
  - id: micro-behaviors/os/registry/keys/policy::policies-system-suffix
  - id: disable-registrytools-split-a
  - id: disable-registrytools-split-b
  - id: micro-behaviors/process/info/name::taskmgr-process
- id: ransomware-policy-lockout
  desc: Ransom context with Registry and Task Manager lockout keys
  crit: suspicious
  conf: 0.97
  attack: T1486,T1562.001,T1112
  all:
  - id: "micro-behaviors/os/registry/value-name::disable-registry-tools"
  - id: "micro-behaviors/os/registry/keys/policy::disable-taskmgr"
  - id: objectives/impact/ransom/encrypt/config::ransom-note-text
- id: explorer-policy-encrypted-resource-dropper
  desc: Explorer policy lockdown with encrypted PE resource loader
  crit: hostile
  conf: 0.98
  attack: T1112,T1027.009,T1486
  all:
  - id: explorer-network-dialog-policy-lockdown
  - id: micro-behaviors/data/embedded/payload/resource::ansi-resource-access-layout
- id: masqueraded-explorer-policy-lockdown
  desc: Template-masqueraded binary writes Explorer restriction policies
  crit: hostile
  conf: 0.97
  attack: T1036.005,T1112,T1486
  all:
  - id: explorer-policy-lockdown
  - id: objectives/evasion/masquerade/version-resource/template::vendor-claim-with-template-placeholder

# MFC normally embeds Explorer policy strings and registry writers as part of
# its dialog framework, so explorer-policy-lockdown suppresses that context.
# This stricter combination retains the signal for a self-installing binary
# that carries and writes multiple Explorer and network-dialog restrictions.
- id: self-installing-explorer-network-policy-lockout
  desc: Self-installing binary writes Explorer and network-dialog restrictions
  crit: hostile
  conf: 0.98
  attack: T1112,T1547.001
  all:
  - id: micro-behaviors/os/registry/explorer::explorer-policy-path
  - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
  - id: micro-behaviors/os/registry/value-name::explorer-restriction-value-set
  - id: micro-behaviors/os/registry/value-name::network-dialog-restriction-value-set
  - id: objectives/persistence/login/self-install/copy::windows-systemdir-self-copy-run-key

  # MFC's policy table is read through RegQueryValueExA, even in a
  # self-copying program. Registry writers elsewhere do not bind these values.
  unless:
  - id: metadata/binary/framework::mfc-application-dialog-framework
  - id: metadata/binary/framework::mfc-application-framework

- id: concealed-browser-hijack-regedit-lockout
  desc: Homepage hijack blocks Registry Editor
  crit: hostile
  conf: 0.99
  for: [html, vbs]
  all:
  - id: micro-behaviors/os/registry/write::fragmented-regwrite-registrytools-lock
  - id: objectives/impact/ui/manipulation/traffic::fragmented-locked-homepage-hijack
