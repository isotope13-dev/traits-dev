# The application asks the user to switch off a code-integrity protection;
# this does not assert a registry write or successful policy tampering.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.96
traits:
  - id: smart-app-control-off-restart-prompt
    desc: Prompts disabling Smart App Control to restart
    if:
      type: raw
      regex: '(?i)Smart App Control settings and turn Smart App Control off, then restart\b'
