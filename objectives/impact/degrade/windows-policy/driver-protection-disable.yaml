# VBS/HVCI and the vulnerable-driver blocklist are separate protections that
# gate loading of unsigned or known-vulnerable kernel drivers. Disabling one
# is routine tuning; turning off the blocklist together with memory integrity
# or VBS removes both layers that stop a vulnerable-driver load.
defaults:
  platforms: [windows]
  for: [powershell, batch, pe, dll]
  attack: T1562.001

composite_rules:
  - id: driver-blocklist-and-hvci-vbs-disabled
    desc: Driver blocklist and HVCI/VBS turned off
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/security/policy::vulnerable-driver-blocklist-zero-command-text
    any:
      - id: micro-behaviors/os/security/policy::hvci-enabled-zero-command-text
      - id: micro-behaviors/os/security/policy::vbs-zero-dword-command-text
    near_lines: 80
