defaults:
  platforms: [windows]
  for: [powershell]
  crit: suspicious
  attack: T1112,T1562.001

composite_rules:
  - id: powershell-disable-registry-tools-policy
    desc: PowerShell disables Registry Editor by policy
    conf: 0.97
    all:
      - id: micro-behaviors/os/registry/keys::disable-registry-tools
      - id: micro-behaviors/os/registry/write/property::powershell-registry-property-write

  - id: powershell-recovery-tools-policy-lockout
    desc: PowerShell disables three administrative recovery tools
    conf: 0.99
    all:
      - id: objectives/impact/degrade/windows-policy::disable-taskmgr-policy
      - id: objectives/impact/degrade/windows-policy::disable-cmd-policy
      - id: powershell-disable-registry-tools-policy

  - id: powershell-policy-key-access-denial
    desc: PowerShell denies control of policy registry key
    conf: 0.99
    all:
      - id: micro-behaviors/fs/acl::powershell-deny-fullcontrol-acl
      - id: micro-behaviors/os/registry/write/property::powershell-user-registry-path

  # Disabling Task Manager, the Registry Editor and the Command Prompt already
  # removes the tools an operator would reach for; denying FullControl on the
  # policy key that holds those values removes the undo as well. Legitimate
  # hardening leaves its own policy writable so it can be rolled back, so the
  # lockout-plus-self-protection pair has no administrative use.
  - id: powershell-irreversible-recovery-tool-lockout
    desc: PowerShell disables recovery tools and denies undo of the policy key
    crit: hostile
    conf: 0.98
    attack: T1112,T1562.001,T1222.001
    all:
      - id: powershell-recovery-tools-policy-lockout
      - id: powershell-policy-key-access-denial
