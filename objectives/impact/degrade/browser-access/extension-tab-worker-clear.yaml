defaults:
  for: [javascript]
  platforms: [unix, windows]
traits:
  - id: extension-tab-activation-clears-service-workers
    desc: Clears service workers on every tab activation
    crit: suspicious
    conf: 0.99
    if:
      type: yara
      source: |
        rule extension_tab_activation_clears_service_workers {
          strings:
            $event = "chrome.tabs.onActivated.addListener"
            $clear = "chrome.browsingData.remove({},{serviceWorkers:true}"
          condition:
            all of them and @event < @clear and @clear - @event < 200
        }
