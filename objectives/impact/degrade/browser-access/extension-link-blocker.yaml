# A broad-host extension cancels page link clicks, forwards their URLs to its
# own runtime, but ships no background code to continue navigation.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip]

composite_rules:
  - id: extension-global-link-navigation-blocker
    desc: Extension blocks broad-host link clicks without bundled background code
    crit: hostile
    conf: 0.97
    attack: T1176
    scope: archive
    all:
      - id: "micro-behaviors/ui/window/click::extension-document-link-click-forwarding"
      - id: "metadata/permission/host::broad-host-access"
    unless:
      - id: extension-background-click-routing-context

  - id: extension-background-click-routing-context
    desc: Extension declares background code for forwarded link clicks
    crit: exception
    conf: 0.95
    scope: archive
    all:
      - id: "micro-behaviors/ui/window/click::extension-document-link-click-forwarding"
    any:
      - id: "micro-behaviors/communications/ipc/message::chrome-runtime-on-message"
      - id: "metadata/permission/manifest::background-service-worker"
