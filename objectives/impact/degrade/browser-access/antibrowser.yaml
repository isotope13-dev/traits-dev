# Antibrowser (.NET) embeds a RIOTOPTCFG JSON blob to block major browsers
# while masquerading as a Riot Games optimizer binary.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1217
  mbc: B0028

traits:
  - id: riotoptcfg-prefix
    desc: RIOTOPTCFG embedded configuration prefix
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: "RIOTOPTCFG:"

  - id: riotoptcfg-antibrowser-product
    desc: Antibrowser product in RIOTOPTCFG blob
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'RIOTOPTCFG:[^\n]{0,240}QW50aWJyb3dzZXI'

  - id: riotoptcfg-b64-browser-targets
    desc: RIOTOPTCFG base64 encodes browser targets
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: QW50aWJyb3dzZXIiLCJicmFuZCI6IkFudGlicm93c2VyIiwidGFyZ2V0cyI6WyJjaHJvbWUi

  - id: gameoptimizer-layered-filename
    desc: GameOptimizerLayered masquerade filename
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: GameOptimizerLayered

composite_rules:
  - id: antibrowser-riotoptcfg-campaign
    desc: Antibrowser RIOTOPTCFG multi-browser control
    crit: hostile
    conf: 0.98
    attack: T1217,T1562.001
    all:
      - id: riotoptcfg-antibrowser-product
      - id: riotoptcfg-b64-browser-targets

  - id: antibrowser-riot-game-masquerade
    desc: Antibrowser with fake Riot optimizer identity
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1217
    all:
      - id: riotoptcfg-antibrowser-product
      - id: gameoptimizer-layered-filename
