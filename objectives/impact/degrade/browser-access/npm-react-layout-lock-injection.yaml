defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1195.002,T1499
traits:
- id: react-layout-target
  desc: Contains layout.js or layout.tsx text
  crit: component
  conf: 0.99
  if:
    type: text
    regex: layout\.(tsx|js)
- id: remote-lock-overlay-payload
  desc: Browser payload creates remote lock overlay
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?s)const\s+rawScript\s*=\s*`.{0,800}\.status\s*===\s*["\x27]lock["\x27]
- id: remote-lock-poll
  desc: Browser payload polls remote status
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: fetch\s*\(\s*STATUS_URL
- id: encoded-react-script-injection
  desc: Script prepares encoded React script payload
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: dangerouslySetInnerHTML.{0,80}eval\(atob\(
- id: layout-replace-and-write
  desc: Script inserts payload into layout
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?s)content\.replace\(bodyRegex.{0,200}fs\.writeFileSync\(
composite_rules:
- id: node-react-remote-lock-injector
  desc: Script injects remotely controlled lock overlay into React layout
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: objectives/impact/degrade/browser-access::react-layout-target
  - id: objectives/impact/degrade/browser-access::remote-lock-overlay-payload
  - id: objectives/impact/degrade/browser-access::remote-lock-poll
  - id: objectives/impact/degrade/browser-access::encoded-react-script-injection
  - id: objectives/impact/degrade/browser-access::layout-replace-and-write
