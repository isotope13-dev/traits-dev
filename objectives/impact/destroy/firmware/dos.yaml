# CMOS port-write patterns can indicate firmware tampering, but a port
# write alone does not establish which configuration value was changed.
defaults:
  platforms: [unix, windows]
  for: [dos_com, static-lib, data]
  size_max: 65536
  attack: T1495

composite_rules:
  - id: dos-cmos-firmware-destruction
    desc: CMOS port writes include a 0xFF value
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/binary/instruction/opcode::x86-cmos-port-write-sequence
      - id: metadata/binary/instruction/opcode::x86-cmos-data-port-ff-write
