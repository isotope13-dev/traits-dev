# Overwrites system CMOS NVRAM registers across the configuration block,
# destroying real-time clock, disk geometry, and BIOS settings.
defaults:
  platforms: [unix, windows]
  for: [dos_com, static-lib, data]
  size_max: 65536
  attack: T1495

traits:
  - id: dos-cmos-nvram-corrupt-pattern
    desc: Overwrites CMOS NVRAM with 0xFF values
    crit: suspicious
    conf: 0.95
    if:
      type: hex
      pattern: "B0 FF E6 71"
    unless:
      - id: well-known/app/system/limine::limine-boot-image-context

composite_rules:
  - id: dos-cmos-firmware-destruction
    desc: DOS overwrites CMOS firmware settings
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/instruction/opcode::x86-cmos-port-write-sequence
      - id: dos-cmos-nvram-corrupt-pattern
    unless:
      - id: well-known/app/system/limine::limine-boot-image-context

  - id: dos-cmos-zero-fill-destruction
    desc: DOS zero-fill destroys CMOS configuration
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/instruction/opcode::x86-cmos-port-write-sequence
      - id: objectives/impact/wipe/config::dos-cmos-zero-fill-iteration
    unless:
      - id: well-known/app/system/limine::limine-boot-image-context
