# PlayStation Portable "brick" trojans (Trojan.PSP.Brick and kin) pose as
# firmware-downgrade/exploit homebrew. They re-assign the raw system flash
# (lflash0:0,0) to a writable alias, then clobber the kernel boot modules in
# flash0:/kd/ so the console can no longer boot, and finish with a fake
# "firmware hacked, please reboot" message so the victim power-cycles into
# the brick.
defaults:
  platforms: [appliance]
  for: [data]
  attack: T1495

traits:
  - id: psp-raw-flash-assign
    desc: PSP raw system flash re-assign
    crit: notable
    conf: 0.9
    if:
      # "lflash0:0,0" — below text extraction's string filter
      type: hex
      pattern: 6C 66 6C 61 73 68 30 3A 30 2C 30

  - id: psp-kd-loadcore-path
    desc: PSP flash kernel loadcore module path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'flash\d:/kd/loadcore\.prx'

  - id: psp-kd-loadexec-path
    desc: PSP flash kernel loadexec module path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'flash\d:/kd/loadexec\.prx'

  - id: psp-kd-init-path
    desc: PSP flash kernel init module path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'flash\d:/kd/init\.prx'

  - id: psp-fake-hacked-reboot-lure
    desc: Fake firmware hacked reboot prompt
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)is hacked,? please reboot'

composite_rules:
  - id: psp-kernel-flash-brick
    desc: PSP kernel flash brick with reboot lure
    crit: hostile
    conf: 0.95
    all:
      - id: psp-raw-flash-assign
      - id: psp-fake-hacked-reboot-lure
    any:
      - id: psp-kd-loadcore-path
      - id: psp-kd-loadexec-path
      - id: psp-kd-init-path
    needs: 2
