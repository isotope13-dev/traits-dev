defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1495
composite_rules:
  - id: managed-ransomware-uefi-variable-deletion
    desc: Managed ransomware includes UEFI variable-deletion layout
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/impact/ransom/extortion::russian-file-recovery-payment-guarantee
      - id: micro-behaviors/crypto/encrypt::dotnet-create-encryptor
      - id: micro-behaviors/os/kernel/routines::managed-uefi-zero-length-write-layout
      - id: micro-behaviors/os/kernel/routines::uefi-boot-order-variable-name
