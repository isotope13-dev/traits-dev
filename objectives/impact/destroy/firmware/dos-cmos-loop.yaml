defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_max: 65536
traits:
  - id: dos-cmos-zero-register-loop
    desc: Clears CMOS registers in a loop
    crit: notable
    if:
      type: hex
      pattern: "32 C9 8A C1 E6 70 32 C0 E6 71 FE C1 80 F9 40 75 F1"

  - id: dos-cmos-zero-index-loop
    desc: Loops over CMOS indices writing zeros
    crit: hostile
    conf: 0.98
    attack: T1495
    if:
      type: yara
      source: |
        rule dos_cmos_zero_index_loop {
          strings:
            $step = { FE 06 ?? ?? A0 ?? ?? E6 70 B0 00 E6 71 EB ?? }
          condition:
            for any i in (1..#step) : (
              uint16(@step[i] + 2) == uint16(@step[i] + 5) and
              int8(@step[i] + 14) < 0 and
              @step[i] + 15 + int8(@step[i] + 14) <= @step[i] and
              @step[i] + 15 + int8(@step[i] + 14) >= @step[i] - 96
            )
        }

composite_rules:
  - id: dos-cmos-clear-with-disk-write
    desc: DOS clears CMOS while writing a BIOS disk sector
    crit: hostile
    attack: T1495
    near_bytes: 128
    all:
      - id: dos-cmos-zero-register-loop
      - id: objectives/impact/wipe/disk/mbr::dos-int13-ax-sector-write
