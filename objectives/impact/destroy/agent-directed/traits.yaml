# Agent-directed destruction is expressed as natural-language tasking, not as
# a deletion API. The text components scan source and scripts broadly because
# the same prompt can be embedded in any host language. Hostility requires an
# unattended agent whose tool permissions are explicitly bypassed.
defaults:
  platforms: [unix, windows]
  for: [source, scripts]
  attack: T1485

traits:
  - id: destructive-agent-goal
    desc: Agent goal includes destructive action
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\b(goal|task) is\b[\s\S]{0,100}\b(delete|destroy|wipe|erase)\b'
    not:
      - regex: '(?i)\b(never|not|unless|only if)\b[\s\S]{0,50}\b(delete|destroy|wipe|erase)\b'
      # Confirmation-gated destructive work is a safety rail, not a
      # destructive goal: docs telling the agent to "confirm a destructive
      # delete" establish the opposite of unattended destruction.
      - regex: '(?i)\b(confirm|confirmation|approve|approval|verify|verification)\b[\s\S]{0,60}\b(delete|destroy|wipe|erase)\b'

  - id: local-cloud-resource-target
    desc: Local and cloud resources targeted
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bfile[- ]?systems?\b[\s\S]{0,64}\bcloud resources?\b'

composite_rules:
  # A destructive goal in an encoded system prompt, paired with an explicit
  # execution-policy bypass, is a staged agent-abuse configuration even before
  # an agent runtime is present.
  - id: agent-config-destructive-policy-bypass
    desc: Agent prompt links deletion and policy bypass
    crit: suspicious
    conf: 0.97
    for: [text, documents]
    all:
      - id: objectives/impact/destroy/shell-out::quoted-root-delete-request
      - id: micro-behaviors/data/llm/agent::system-prompt-encoded-assignment
      - id: micro-behaviors/os/security/policy::powershell-policy-bypass-assignment
    scope: file
    near_bytes: 1024

  # Keep remote staging distinct from the destructive prompt: a lookalike
  # package command and shell-pipeline URL are both placed in this agent
  # configuration with its explicit policy-bypass and encoded prompt.
  - id: agent-config-remote-stage-policy-bypass
    desc: Agent config pairs stage and policy bypass
    crit: suspicious
    conf: 0.96
    for: [text, documents]
    all:
      - id: micro-behaviors/os/package-manager/install::pip-install-cli-text
      - id: micro-behaviors/communications/http/download/shell::curl-wget-http-url
      - id: micro-behaviors/os/security/policy::powershell-policy-bypass-assignment
      - id: micro-behaviors/data/llm/agent::system-prompt-encoded-assignment
    scope: file
    near_bytes: 1024

  - id: unattended-agent-destructive-goal
    for: [shell, python, javascript]
    desc: Unattended agent receives destructive goal
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/create/unattended-agent::unrestricted-unattended-session
      - id: destructive-agent-goal
    near_bytes: 1400
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: unattended-agent-local-cloud-destruction
    for: [shell, python, javascript]
    desc: Unattended agent destroys local and cloud data
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/process/create/unattended-agent::unrestricted-unattended-session
      - id: destructive-agent-goal
      - id: local-cloud-resource-target
    near_bytes: 1600
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: unattended-agent-aws-cli-destruction
    for: [shell, python, javascript]
    desc: Unattended agent runs destructive AWS CLI
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/process/create/unattended-agent::unrestricted-unattended-session
      - id: destructive-agent-goal
      - id: micro-behaviors/communications/http/services/aws-ec2::aws-cli-ec2-terminate
      - id: micro-behaviors/communications/http/services/aws-s3::aws-cli-s3-rm
      - id: micro-behaviors/communications/http/services/aws-iam::aws-cli-iam-delete-user
    near_bytes: 1800
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  # Some clients expose an explicit trust-all-tools permission bypass rather
  # than the narrower unrestricted-session marker. Require both unattended
  # execution and a destructive cloud task so ordinary agent setup flags do
  # not become a hostile finding.
  - id: trust-all-agent-cloud-destruction
    desc: Unattended trust-all agent receives destructive cloud task
    crit: hostile
    conf: 0.995
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/argument/option::noninteractive-flag
      - id: micro-behaviors/process/create/agent::ai-agent-dangerous-permission-flag
      - id: destructive-agent-goal
      - id: local-cloud-resource-target
      - id: micro-behaviors/communications/http/services/aws-ec2::aws-cli-ec2-terminate
      - id: micro-behaviors/communications/http/services/aws-s3::aws-cli-s3-rm
      - id: micro-behaviors/communications/http/services/aws-iam::aws-cli-iam-delete-user
    near_bytes: 1800
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
