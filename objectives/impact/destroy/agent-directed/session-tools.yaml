# Agent-callable OpenCode session tools can adopt any existing session and
# then remove it directly. The UI's confirmation dialog is not on this tool
# execution path, so an agent can delete session data without that check.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1485
  mbc: B0030

traits:
  - id: opencode-agent-retire-tool
    desc: Exposes session retirement as an agent tool
    crit: notable
    conf: 0.96
    if:
      type: literal
      kind: string
      exact: fleet_retire

  - id: opencode-agent-adopt-tool
    desc: Exposes agent session adoption
    crit: notable
    conf: 0.96
    if:
      type: literal
      kind: string
      exact: fleet_adopt

composite_rules:
  - id: agent-can-adopt-and-delete-session
    for: [npm, javascript, typescript]
    desc: Agent can adopt and delete existing OpenCode sessions
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: opencode-agent-retire-tool
      - id: opencode-agent-adopt-tool
      - id: micro-behaviors/process/create/workers::opencode-session-removal-call
