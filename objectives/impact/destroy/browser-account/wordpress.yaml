defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1531
  mbc: B0030

composite_rules:
  # A normal deletion UI posts to its own application.  Automated deletion
  # that also reports to an OOB collector is a destructive browser payload.
  - id: browser-buddypress-account-destruction
    desc: Browser payload deletes BuddyPress account and reports externally
    crit: hostile
    conf: 0.99
    near_bytes: 7000
    all:
      - id: micro-behaviors/communications/http/url/path::buddypress-delete-account-route-any
      - id: micro-behaviors/communications/http/form::buddypress-delete-confirm-field-any
      - id: micro-behaviors/communications/http/request/credentials::fetch-credentials-include-any
      - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction
      - id: objectives/exfiltration/oob/endpoint::oob-endpoint-any
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/
