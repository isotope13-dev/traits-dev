defaults:
  for: [javascript]
  platforms: [unix]
  attack: T1485,T1499

traits:
  - id: nokaca-install-hook
    desc: Runs shell startup installer
    crit: notable
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '^node\s+(\./)?init[.]js$'
  - id: nokaca-cli-declaration
    desc: Declares shell startup command
    crit: notable
    for: [package.json]
    if:
      type: value
      path: bin.nokaca
      regex: '^(\./)?index[.]js$'
  - id: nokaca-startup-append
    desc: Appends command to shell startup files
    crit: notable
    if:
      type: text
      substr: 'const aliases = `\nnokaca\n`'
  - id: nokaca-startup-write
    desc: Writes shell startup files
    crit: notable
    if:
      type: text
      substr: "fs.writeFile(fullPath, content, 'utf8')"
  - id: nokaca-wipe-command
    desc: Spawns recursive forced removal
    crit: notable
    if:
      type: text
      substr: "spawn('rm',['-rf',p]"
  - id: nokaca-wipe-parent
    desc: Targets parent directory for removal
    crit: notable
    if:
      type: text
      substr: "del('../')"
  - id: nokaca-wipe-android
    desc: Targets Android storage
    crit: notable
    if:
      type: text
      substr: "del('/sdcard/Android')"
  - id: nokaca-fork-bomb
    desc: Embeds shell fork bomb
    crit: notable
    if:
      type: text
      substr: ':(){ :|:& };:'
  - id: nokaca-wipe-start
    desc: Calls wipe function
    crit: component
    if:
      type: text
      substr: 'wipe();'
  - id: nokaca-inject-start
    desc: Calls inject function
    crit: component
    if:
      type: text
      substr: 'inject();'

composite_rules:
  - id: nokaca-startup-installer
    desc: Adds command to shell startup
    crit: suspicious
    conf: 0.98
    scope: file
    all:
      - id: nokaca-startup-append
      - id: micro-behaviors/fs/path/config/shell::node-user-shell-rc-targets
      - id: nokaca-startup-write
  - id: nokaca-destructive-cli
    desc: Deletes files and installs fork bomb
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: nokaca-wipe-command
      - id: nokaca-wipe-parent
      - id: nokaca-wipe-android
      - id: nokaca-fork-bomb
      - id: micro-behaviors/fs/path/config/shell::node-user-shell-rc-targets
      - id: nokaca-startup-write
      - id: nokaca-wipe-start
      - id: nokaca-inject-start
  - id: npm-nokaca-shell-wiper
    desc: Install sets destructive command to run on shell startup
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: nokaca-install-hook
      - id: nokaca-cli-declaration
      - id: nokaca-startup-installer
      - id: nokaca-destructive-cli
