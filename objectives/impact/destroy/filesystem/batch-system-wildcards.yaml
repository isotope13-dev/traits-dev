defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: batch-windows-system-multitype-wipe
    desc: Deletes EXE and DLL files in Windows directories
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/directory/chdir::batch-cd-systemroot
      - id: objectives/impact/system/directory::batch-cd-system32
      - id: micro-behaviors/fs/delete/file/command::del-exe-wildcard-command-text
      - id: micro-behaviors/fs/delete/file/command::batch-delete-dll-wildcard
