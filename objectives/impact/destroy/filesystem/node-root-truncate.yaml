# Bind roots -> drive -> readdir entries -> joined path -> stat -> empty
# overwrite. Plain enumeration and unrelated writes do not establish this.
# The try blocks describe the error-tolerant loop shape, not an evasion claim.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1485
composite_rules:
  - id: node-drive-root-truncation-loop
    desc: Truncates files across distinct drive roots
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/fs/file/truncate::node-nested-file-truncation-loop
      - id: micro-behaviors/fs/path/drive-root::node-multiple-drive-roots

  - id: node-truncates-drive-root-files
    desc: Node fs truncates files across drive roots
    crit: hostile
    conf: 0.99
    all:
      - id: node-drive-root-truncation-loop
      - id: metadata/import/builtin::require-fs

  # Corroborate the bound loop with the write-call projection: two arguments
  # mean the empty write uses Node's destructive default mode, not append or
  # exclusive-create options. No unrelated write can supply the loop itself.
  - id: node-drive-root-empty-overwrite
    desc: Drive-root files emptied in default write mode
    crit: hostile
    conf: 0.99
    all:
      - id: node-truncates-drive-root-files
      - id: micro-behaviors/fs/file/truncate::node-empty-write-default-mode
