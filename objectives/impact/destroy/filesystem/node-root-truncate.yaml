# Bind roots -> drive -> readdir entries -> joined path -> stat -> empty
# overwrite. Plain enumeration and unrelated writes do not establish this.
# The try blocks describe the error-tolerant loop shape, not an evasion claim.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1485
traits:
  - id: node-drive-root-truncation-loop
    desc: Truncates files across bound drive roots
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration (variable_declarator
            name: (identifier) @declared_roots
            value: (array . (string) @root1 . (string) @root2)))
          . (for_in_statement
            left: (identifier) @drive
            right: (identifier) @root_list
            body: (statement_block (try_statement body: (statement_block
              (lexical_declaration (variable_declarator
                name: (identifier) @entries
                value: (call_expression
                  function: (member_expression object: (identifier) @fs1
                    property: (property_identifier) @read)
                  arguments: (arguments . (identifier) @read_dir .))))
              (for_in_statement
                left: (identifier) @entry
                right: (identifier) @entry_list
                body: (statement_block (try_statement body: (statement_block
                  (lexical_declaration (variable_declarator
                    name: (identifier) @full
                    value: (call_expression
                      function: (member_expression object: (identifier) @path
                        property: (property_identifier) @join)
                      arguments: (arguments . (identifier) @join_dir . (identifier) @join_entry .))))
                  (if_statement
                    condition: (parenthesized_expression (call_expression
                      function: (member_expression
                        object: (call_expression
                          function: (member_expression object: (identifier) @fs2
                            property: (property_identifier) @stat)
                          arguments: (arguments . (identifier) @stat_path .))
                        property: (property_identifier) @isfile)
                      arguments: (arguments)))
                    consequence: (statement_block
                      (expression_statement (call_expression
                        function: (member_expression object: (identifier) @fs3
                          property: (property_identifier) @write)
                        arguments: (arguments . (identifier) @write_path . (string) @empty .)))))))))))))) @operation
          (#eq? @declared_roots @root_list)
          (#match? @root1 "^[\"'][A-Za-z]:\\\\{2,}[\"']$")
          (#match? @root2 "^[\"'][A-Za-z]:\\\\{2,}[\"']$")
          (#not-eq? @root1 @root2)
          (#eq? @drive @read_dir)
          (#eq? @entries @entry_list)
          (#eq? @entry @join_entry)
          (#eq? @drive @join_dir)
          (#eq? @full @stat_path)
          (#eq? @full @write_path)
          (#eq? @fs1 "fs") (#eq? @fs2 @fs1) (#eq? @fs3 @fs1)
          (#eq? @path "path") (#eq? @read "readdirSync")
          (#eq? @join "join") (#eq? @stat "statSync")
          (#eq? @isfile "isFile") (#eq? @write "writeFileSync")
          (#match? @empty "^([\"]{2}|[']{2})$")
        )

composite_rules:
  - id: node-truncates-drive-root-files
    desc: Node fs truncates files across drive roots
    crit: hostile
    conf: 0.99
    all:
      - id: node-drive-root-truncation-loop
      - id: metadata/import/builtin::require-fs

  # Corroborate the bound loop with the write-call projection: two arguments
  # mean the empty write uses Node's destructive default mode, not append or
  # exclusive-create options. No unrelated write can supply the loop itself.
  - id: node-drive-root-empty-overwrite
    desc: Drive-root files emptied in default write mode
    crit: hostile
    conf: 0.99
    all:
      - id: node-truncates-drive-root-files
      - id: micro-behaviors/fs/file/truncate::node-empty-write-default-mode
