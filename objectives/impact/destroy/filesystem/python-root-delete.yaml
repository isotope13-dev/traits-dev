defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1485
  mbc: C0047

traits:
  - id: python-drive-root-target
    desc: Selects drive or filesystem root
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'root\s*=\s*["''][A-Za-z]:\\\\+["'']\s+if\s+os\.name'

  - id: wiper-game-penalty-action
    desc: Deletion on failed game condition
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)(delete_random_root|passed_question)'

composite_rules:
  - id: privilege-admin-or-root-check
    desc: Checks for administrator or root identity
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/os/privilege/check::ctypes-is-admin
      - id: micro-behaviors/os/privilege/check::effective-root-check

  - id: python-find-files-under-root
    desc: Finds files starting from drive root
    crit: suspicious
    conf: 0.96
    near_lines: 40
    all:
      - id: python-drive-root-target
      - id: micro-behaviors/fs/directory/readdir/language::python-directory-listing

  - id: python-delete-root-target-file
    desc: Deletes file found under drive root
    crit: suspicious
    conf: 0.96
    near_lines: 30
    all:
      - id: python-drive-root-target
      - id: micro-behaviors/fs/delete/file/library::py-remove

  - id: python-root-directory-file-destruction
    desc: Finds and deletes files under drive root
    crit: hostile
    conf: 0.98
    all:
      - id: python-find-files-under-root
      - id: python-delete-root-target-file

  - id: python-privileged-root-filesystem-destruction
    desc: Privileged deletion of drive root files
    crit: hostile
    conf: 0.99
    all:
      - id: python-root-directory-file-destruction
      - id: privilege-admin-or-root-check

  - id: python-roulette-game-root-wipe
    desc: Failed game triggers drive root file wipe
    crit: hostile
    conf: 0.99
    all:
      - id: python-root-directory-file-destruction
      - id: wiper-game-penalty-action
