defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1485
  mbc: C0047

traits:
  - id: python-drive-root-target
    desc: Selects drive or filesystem root
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'root\s*=\s*["''][A-Za-z]:\\\\+["'']\s+if\s+os\.name'

  - id: wiper-game-penalty-action
    desc: Deletion on failed game condition
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)(delete_random_root|passed_question)'
    downgrade:
      any:
        - id: python-opt-in-dry-run-deletion-gate

  # A deletion that only runs after the user writes "yes" into a config file,
  # and otherwise prints what it would have deleted, is a consent gate with a
  # dry-run default, not a wipe.
  - id: python-would-have-deleted-message
    desc: Prints what it would have deleted
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)would have (deleted|removed)'
  - id: python-config-file-yes-opt-in
    desc: Config file tested for yes
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'expanduser\(\s*["'']~/\.config/[^"'']{1,80}["'']\s*\)[\s\S]{0,500}==\s*["'']yes["'']'

composite_rules:
  - id: python-opt-in-dry-run-deletion-gate
    desc: Deletion needs a config opt-in and defaults to dry run
    crit: exception
    conf: 0.9
    all:
      - id: python-would-have-deleted-message
      - id: python-config-file-yes-opt-in
  - id: python-find-files-under-root
    desc: Finds files starting from drive root
    crit: suspicious
    conf: 0.96
    near_lines: 40
    all:
      - id: python-drive-root-target
      - id: micro-behaviors/fs/directory/readdir/language::python-directory-listing
    downgrade:
      any:
        - id: python-opt-in-dry-run-deletion-gate

  - id: python-delete-root-target-file
    desc: Deletes file found under drive root
    crit: suspicious
    conf: 0.96
    near_lines: 30
    all:
      - id: python-drive-root-target
      - id: micro-behaviors/fs/delete/file/library::py-remove
    downgrade:
      any:
        - id: python-opt-in-dry-run-deletion-gate

  - id: python-root-directory-file-destruction
    desc: Finds and deletes files under drive root
    crit: hostile
    conf: 0.98
    all:
      - id: python-find-files-under-root
      - id: python-delete-root-target-file
    downgrade:
      any:
        - id: python-opt-in-dry-run-deletion-gate

  - id: python-privileged-root-filesystem-destruction
    desc: Privileged deletion of drive root files
    crit: hostile
    conf: 0.99
    all:
      - id: python-root-directory-file-destruction
      - id: micro-behaviors/os/privilege/check::privilege-admin-or-root-check
    downgrade:
      any:
        - id: python-opt-in-dry-run-deletion-gate

  - id: python-roulette-game-root-wipe
    desc: Failed game triggers drive root file wipe
    crit: hostile
    conf: 0.99
    all:
      - id: python-root-directory-file-destruction
      - id: wiper-game-penalty-action
    downgrade:
      any:
        - id: python-opt-in-dry-run-deletion-gate
