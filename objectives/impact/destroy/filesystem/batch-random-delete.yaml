defaults:
  platforms: [windows]
  for: [batch]

traits:
- id: batch-random-recursive-delete-target
  desc: Recursively deletes randomized drive-root target
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: '(?i)del\s+/f\s+/s\s+[a-z]:\\%random%\.'
composite_rules:
- id: batch-silent-random-recursive-deletion
  desc: Console-detached random recursive deletion
  crit: hostile
  conf: 0.97
  all:
  - id: batch-random-recursive-delete-target
  - id: micro-behaviors/os/console/control::batch-ctty-null-device
