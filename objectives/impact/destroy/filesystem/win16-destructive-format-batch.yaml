defaults:
  platforms: [windows]
  for: [ne, pe, data, batch]
  attack: T1485,T1561
  mbc: B0047

traits:
  - id: echo-y-format-drive
    desc: Silently confirms drive format command
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)echo\s+y\s*\|\s*format\s+[a-z]:'
  - id: destructive-system-wildcard-target
    desc: Targets Windows or AV directory wildcard
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)c:\\(windows|drweb)(\\system)?\\\*\.(\*|exe|sys)'
  - id: ctty-nul-batch-suppression
    desc: Suppresses batch console output with ctty
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "@ctty nul"

composite_rules:
  - id: destructive-batch-format-wiper
    desc: Automated drive format and system wiper commands
    crit: hostile
    conf: 0.99
    all:
      - id: echo-y-format-drive
    any:
      - id: destructive-system-wildcard-target
      - id: ctty-nul-batch-suppression
