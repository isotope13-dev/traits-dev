defaults:
  platforms: [windows]
  for: [batch]

traits:
- id: batch-delete-root-executable-wildcard
  desc: Deletes every executable in drive root
  crit: suspicious
  conf: 0.97
  if:
    type: value
    path: source.batch.command_sites[*].text
    regex: '(?i)^del\s+[a-z]:\\\*\.exe\s*$'
composite_rules:
- id: batch-security-stop-root-executable-wipe
  desc: Stops security before root executable deletion
  crit: hostile
  conf: 0.98
  all:
  - id: batch-delete-root-executable-wildcard
  - id: objectives/impact/services/stop::net-stop-security-product
