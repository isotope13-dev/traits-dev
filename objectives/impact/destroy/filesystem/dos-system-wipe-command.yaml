# DOS command strings that erase Windows or MS-DOS system files and format
# drive C. A DOS program prints or runs each command as a plain text line.
defaults:
  for: [data, dos_com]
  platforms: [windows, unix]
  attack: T1485

traits:
  - id: dos-del-system-file-command
    desc: Deletes Windows or MS-DOS system files
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: 'del c:\\?(windows|msdos)'

  - id: dos-format-drive-c-command
    desc: Formats drive C from a command line
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      substr: 'format c:'

composite_rules:
  - id: dos-system-wipe-command-set
    desc: DOS command set erases system files and formats C
    crit: hostile
    conf: 0.96
    all:
      - id: dos-del-system-file-command
      - id: dos-format-drive-c-command
