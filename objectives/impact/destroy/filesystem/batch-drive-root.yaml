defaults:
  platforms: [windows]
  for: [batch]
  attack: T1485

composite_rules:
  - id: batch-drive-root-file-destruction
    desc: Batch destroys drive root file contents
    crit: hostile
    conf: 0.95
    size_max: 8192
    all:
      - id: micro-behaviors/fs/delete/file/command::batch-del-all-wildcard
      - id: micro-behaviors/fs/delete/target::batch-del-drive-root-wildcard
