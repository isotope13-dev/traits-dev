# Require a possible shell command boundary before sudo; words passed as
# arguments to another command do not themselves invoke deletion. This
# text-level check does not parse quoting or prove the command ran.
defaults:
  platforms: [windows, unix]
  for: [package.json]
  attack: T1485
traits:
  - id: preinstall-sudo-rm-no-preserve-root
    desc: preinstall root-delete command text
    crit: notable
    conf: 0.99
    if:
      type: value
      path: scripts.preinstall
      regex: '(^|[;&|\n])\s*sudo\s+rm\s+-rf\s+--no-preserve-root\s+/([\s;&|]|$)'
composite_rules:
  - id: preinstall-root-filesystem-wipe
    desc: Install hook contains root-delete command
    crit: hostile
    conf: 0.99
    all:
      - id: preinstall-sudo-rm-no-preserve-root
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
