# An npm preinstall that runs sudo rm -rf --no-preserve-root / removes
# the filesystem root when the package is installed.
defaults:
  platforms: [windows, unix]
  for: [package.json]
  attack: T1485
traits:
  - id: preinstall-sudo-rm-no-preserve-root
    desc: preinstall sudo-deletes filesystem root
    crit: notable
    conf: 0.99
    if:
      type: value
      path: scripts.preinstall
      regex: 'sudo\s+rm\s+-rf\s+--no-preserve-root\s+/'
composite_rules:
  - id: preinstall-root-filesystem-wipe
    desc: Install hook wipes the filesystem root
    crit: hostile
    conf: 0.99
    all:
      - id: preinstall-sudo-rm-no-preserve-root
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
