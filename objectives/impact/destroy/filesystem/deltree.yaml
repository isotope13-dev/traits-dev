defaults:
  platforms: [windows]
  for: [batch, text]
  attack: T1485

traits:
  - id: deltree-root-wildcard
    desc: DELTREE targets every entry in drive root
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?im)^[\t ]*@?deltree(\.exe)?\s*(/y\s*)?([a-z]:)?\\\*\.\*[\t \r]*$'
  - id: deltree-wildcard-target
    desc: DELTREE targets wildcard files or folders
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?im)^[\t ]*@?deltree(\.exe)?\b[^\r\n]{0,40}\*\.\*'
  # Reversed-argument twin of deltree-wildcard-target: the wipe command
  # aims at every file but appears after its target, the scrambled form
  # the KillFiles joke-bat family uses.
  - id: deltree-reversed-wildcard-target
    desc: Reversed-order DELTREE targets wildcard files
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?im)^[\t ]*\*[^ \t\r\n,;]{0,12}[ \t]+deltree(\.exe)?\b'

composite_rules:
  - id: deltree-drive-root-destruction
    desc: DELTREE recursively deletes drive-root contents
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/delete/directory::deltree-absolute-path-command
      - id: deltree-root-wildcard
  - id: deltree-unattended-wildcard-wipe
    desc: DELTREE silently and recursively wipes wildcard directory trees
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/delete/directory::windows-deltree-recursive
      - id: deltree-wildcard-target
