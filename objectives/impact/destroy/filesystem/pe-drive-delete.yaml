defaults:
  platforms: [windows]
  for: [pe]
  attack: T1485

traits:
  - id: pe-formats-forced-recursive-directory-delete
    desc: PE formats forced recursive deletion paths
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '(?is)cmd(\.exe)?\s+/c\s+del\s+/f\s+/s\s+/q\s+["'']?%s\\\*["'']?'

composite_rules:
  - id: pe-enumerates-drives-and-launches-recursive-delete
    desc: PE enumerates drives and launches forced recursive file deletion
    crit: hostile
    conf: 0.99
    all:
      - id: pe-formats-forced-recursive-directory-delete
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: objectives/lateral-movement/usb-worm/drive-infector::drive-enumerating-hidden-path-copy-worm
