defaults:
  platforms: [windows]
  for: [data]

traits:
  - id: ansi-format-drive-lowercase-key
    desc: Maps lowercase f to drive format
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: '[102;"format c:";13p'

  - id: ansi-format-drive-uppercase-key
    desc: Maps uppercase F to drive format
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: '[70;"format c:";13p'

composite_rules:
  - id: ansi-keys-remapped-to-format-drive
    desc: ANSI key mappings format the system drive
    crit: hostile
    conf: 0.99
    all:
      - id: ansi-format-drive-lowercase-key
      - id: ansi-format-drive-uppercase-key
