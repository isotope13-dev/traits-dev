# Resident DOS handler carves top-of-memory MCB space, hooks BIOS INT 13h,
# intercepts sector writes (AH=03h), and returns CLC; IRET (Carry Flag clear)
# without calling the BIOS, silently discarding disk writes while reporting
# success to DOS.
defaults:
  platforms: [windows, unix]
  for: [dos_com]
  attack: T1565.002
  size_max: 65536

composite_rules:
  - id: dos-int13-write-drop-sabotage
    desc: Resident INT 13h hook drops sector writes
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/msdos/disk::dos-int13-vector-get-and-set
      - id: micro-behaviors/os/msdos/disk::dos-int13-write-intercept-clc-iret
      - id: micro-behaviors/os/msdos/memory::dos-mcb-psp-top-memory-carve
