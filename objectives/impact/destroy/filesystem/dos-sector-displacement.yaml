# This recognizes the data displacement, rather than classifying every tiny
# disk read/write utility as a wiper. The source boot-sector buffer is reused
# as the source of a write immediately past the extent just read. A boot-sector
# backup utility remains a possible near neighbor, so the trait is suspicious.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 512

traits:
  - id: dos-boot-sector-copy-beyond-read
    desc: Copies boot sector beyond the read extent
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule dos_boot_sector_copy_beyond_read {
          meta:
            filetypes = "dos_com,data"
          strings:
            $es = { 0E 07 }
            $read = { BB ?? ?? B6 00 B2 ?? B9 01 00 B8 ?? 02 CD 13 }
            $write = { BB ?? ?? B6 00 B2 ?? B9 ?? 00 B8 01 03 CD 13 B4 4C B0 00 CD 21 }
          condition:
            $es at 0 and $read and $write and
            for any i in (1..#read) : (
              @read[i] < 32 and
              uint8(@read[i] + 11) >= 2 and
              uint8(@read[i] + 11) < 63 and
              for any j in (1..#write) : (
                @write[j] > @read[i] and
                @write[j] - @read[i] <= 96 and
                uint16(@read[i] + 1) == uint16(@write[j] + 1) and
                uint8(@read[i] + 6) == uint8(@write[j] + 6) and
                uint8(@write[j] + 8) == uint8(@read[i] + 11) + 1
              )
            )
        }
