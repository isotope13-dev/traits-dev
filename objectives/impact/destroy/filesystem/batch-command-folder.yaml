defaults:
  platforms: [windows]
  for: [batch, text]
  attack: T1485

traits:
  - id: batch-loop-targets-command-wildcard
    desc: Batch loop targets Command folder wildcard
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?im)\bfor\s+%%?\w+\s+in\s*\([^)\r\n]{0,80}\\COMMAND\\\*\.\*'

composite_rules:
  - id: batch-command-folder-wildcard-destruction
    desc: Batch overwrites command directory wildcard files
    crit: hostile
    conf: 0.97
    size_max: 4096
    all:
      - id: batch-loop-targets-command-wildcard
      - id: micro-behaviors/fs/file/copy/source-destination::batch-copy-from-windows-temp
      - id: micro-behaviors/data/control-flow/iteration::batch-for-in-loop
