# Windows Script Host deletions aimed at the operating system or at every
# file on every drive. Uninstallers remove their own files by name; none
# wildcard-delete the system directory, remove the Windows folder, or walk
# all drives deleting each file unconditionally.
defaults:
  platforms: [windows]
  for: [vbs, html]
  attack: T1485

traits:
  - id: wsh-system-directory-wildcard-delete
    desc: Script wildcard-deletes Windows system files
    crit: hostile
    conf: 0.96
    if:
      type: text
      regex: '(?i)DeleteFile\s*\(?\s*"[a-z]:\\win(dows|nt)\\system(32)?\\\*\.(\*|exe|dll|sys|drv|nls)"'
  - id: wsh-windows-folder-delete
    desc: Script deletes the Windows folder
    crit: hostile
    conf: 0.96
    if:
      type: text
      regex: '(?i)DeleteFolder\s*\(?\s*"[a-z]:\\(windows|winnt)\\?"'

composite_rules:
  - id: wsh-all-drives-file-wipe
    desc: Script deletes every file on every drive
    crit: hostile
    conf: 0.95
    for: [vbs]
    all:
      - id: micro-behaviors/fs/directory/readdir/language::fso-files-collection
      - id: micro-behaviors/fs/delete/file/library::vbs-for-each-unfiltered-file-delete
    any:
      - id: micro-behaviors/fs/enumerate/drives::vbs-fso-drives-collection-assign
      - id: micro-behaviors/fs/enumerate/drives::vbs-fso-drive-enumeration
      - id: micro-behaviors/fs/enumerate/drives::fso-drive-enumeration
