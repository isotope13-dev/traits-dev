defaults:
  for: [ne]
  platforms: [windows]

traits:
  - id: win16-bios-write-registers
    desc: Prepares BIOS disk write registers
    crit: notable
    if:
      type: hex
      pattern: 'C7 46 EA 80 03 C7 46 EC 00 00 C7 46 EE 01 00 C7 46 F0 80 00 16 8D 46 EA 50 6A 13 9A'

composite_rules:
  - id: win16-uninitialized-bios-disk-write
    desc: Win16 program attempts a BIOS disk write with uninitialized registers
    crit: hostile
    attack: T1561.002
    all:
      - id: win16-bios-write-registers
      - id: micro-behaviors/os/msdos/interrupt::win16-dynamic-interrupt-helper
