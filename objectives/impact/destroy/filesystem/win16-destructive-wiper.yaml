defaults:
  for: [ne]
  platforms: [windows]

traits:
  - id: dos-boot-config-targets
    desc: Targets autoexec.bat or config.sys boot files
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: 'c:\\(autoexec\.bat|config\.sys|windows\\win\.com)'

  - id: win16-wiper-threat-message-it
    desc: Displays Italian destructive wiper threat text
    crit: notable
    conf: 0.90
    if:
      type: text
      case_insensitive: true
      regex: 'cancellero|peggio per te|non spegnerei'

  - id: root-drive-wildcard-targets
    desc: Targets root drive wildcard patterns
    crit: suspicious
    conf: 0.93
    count_min: 2
    if:
      type: raw
      case_insensitive: true
      regex: '[cd]:\\\*\.\*'

  - id: win16-wiper-taunt-message
    desc: Displays destructive wiper taunt message
    crit: notable
    conf: 0.90
    if:
      type: text
      case_insensitive: true
      regex: '(see you at hell|guess what happened|bye\.\.\.bye)'

  # Recursive delete of every file in the current directory, with no drive
  # path. The NE string table stores this literal without a line break before it.
  - id: win16-deltree-wildcard-command
    desc: Runs recursive DELTREE on every file
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: 'deltree\s*/y\s+\*\.\*'

  - id: win16-deltree-multidrive-roots
    desc: Targets multiple drive roots with DELTREE
    crit: suspicious
    conf: 0.97
    count_min: 2
    if:
      type: text
      case_insensitive: true
      regex: 'deltree\s*/y\s+[a-z]:\\\s*$'

  # The NE string table holds the DELTREE word and the ":\*.*" root wildcard
  # as separate literals. The drive letter is built at run time, so no
  # "deltree /y X:\" literal appears in the file.
  - id: win16-deltree-command-word
    desc: Win16 program names the DELTREE command
    crit: notable
    conf: 0.85
    if:
      type: text
      case_insensitive: true
      substr: 'deltree'

  - id: win16-drive-root-wildcard-fragment
    desc: Win16 program holds drive-root wildcard literals
    crit: notable
    conf: 0.88
    count_min: 3
    if:
      type: raw
      substr: ':\*.*'

  # DELTREE aimed at the Windows system folder or an AOL install folder, as a
  # literal command string (for example "DELTREE /y C:\AOL30").
  - id: win16-deltree-system-aol-target
    desc: DELTREE /y targets Windows or AOL folder
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: 'deltree\s*[/-]y\s+c:\\(windows|aol)'

  # Progress text reporting that drive C's files are deleted. The wording is
  # shared by DELTREE wipers that announce their target before running.
  - id: win16-drive-c-complete-text
    desc: Wiper progress text says C drive deleted
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      substr: 'c:\ - complete files'

  # The program writes a batch file that runs the delete. The file name is a
  # common batch name, so it is only corroboration for the DELTREE command.
  - id: win16-del-bat-writer
    desc: Win16 program names a del.bat batch file
    crit: notable
    conf: 0.85
    if:
      type: text
      case_insensitive: true
      substr: 'del.bat'

composite_rules:
  # A recursive DELTREE /y written into a batch file the program runs.
  - id: win16-deltree-batch-wipe
    desc: Win16 program writes a DELTREE /y batch file
    crit: hostile
    conf: 0.93
    attack: T1485
    all:
      - id: micro-behaviors/fs/delete/directory::windows-deltree-recursive
      - id: win16-del-bat-writer

  - id: win16-deltree-system-aol-wipe
    desc: Win16 program runs DELTREE /y on Windows or AOL folders
    crit: hostile
    conf: 0.95
    attack: T1485
    all:
      - id: micro-behaviors/fs/delete/directory::windows-deltree-recursive
      - id: win16-deltree-system-aol-target

  # DELTREE with an assume-yes switch against the Windows System folder
  # wildcard. The switch may be "/y" or "-y"; the path is a literal
  # C:\WINDOWS\System\*.* string in the NE string table.
  - id: win16-deltree-system-folder-wipe
    desc: Win16 program runs DELTREE -y on the Windows System folder
    crit: hostile
    conf: 0.93
    attack: T1485
    all:
      - id: micro-behaviors/fs/delete/directory::windows-deltree-recursive
      - id: destructive-system-wildcard-target

  - id: win16-deltree-drive-c-wipe
    desc: Win16 program runs DELTREE and reports C drive wipe
    crit: hostile
    conf: 0.93
    attack: T1485
    all:
      - id: win16-deltree-command-word
      - id: win16-drive-c-complete-text

  - id: win16-deltree-multidrive-wipe
    desc: Win16 program runs DELTREE /y on multiple drive roots
    crit: hostile
    conf: 0.98
    attack: T1485
    all:
      - id: micro-behaviors/fs/delete/directory::windows-deltree-recursive
      - id: win16-deltree-multidrive-roots

  - id: win16-deltree-runtime-root-wipe
    desc: Win16 program names DELTREE with repeated drive-root wildcards
    crit: hostile
    conf: 0.9
    attack: T1485
    all:
      - id: win16-deltree-command-word
      - id: win16-drive-root-wildcard-fragment
  - id: win16-boot-file-threat-wipe
    desc: Win16 trojan threatens to wipe autoexec.bat or config.sys
    crit: hostile
    conf: 0.90
    attack: T1485
    all:
      - id: dos-boot-config-targets
      - id: win16-wiper-threat-message-it

  - id: win16-deltree-boot-wiper
    desc: Win16 trojan runs DELTREE wildcard wipe and boot-file target
    crit: hostile
    conf: 0.95
    attack: T1485
    all:
      - id: win16-deltree-wildcard-command
      - id: dos-boot-config-targets

  - id: win16-destructive-wiper
    desc: Win16 wiper trojan targets boot, system, and root files
    crit: hostile
    conf: 0.97
    attack: T1485,T1561
    all:
      - id: destructive-system-wildcard-target
      - id: dos-boot-config-targets
      - id: root-drive-wildcard-targets
      - id: win16-wiper-taunt-message
  - id: win16-system-file-wipe
    desc: Win16 program deletes system executables and boot files
    crit: hostile
    conf: 0.95
    attack: T1485
    all:
      - id: destructive-system-wildcard-target
      - id: dos-boot-config-targets
    any:
      - id: win16-wiper-taunt-message
      - id: objectives/persistence/login/startup/winini::win16-ini-run-system-exe
    needs: 1
