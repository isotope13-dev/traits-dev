defaults:
  for: [ne]
  platforms: [windows]

traits:
  - id: dos-boot-config-targets
    desc: Targets autoexec.bat and config.sys boot files
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: 'c:\\(autoexec\.bat|config\.sys|windows\\win\.com)'

  - id: root-drive-wildcard-targets
    desc: Targets root drive wildcard patterns
    crit: suspicious
    conf: 0.93
    count_min: 2
    if:
      type: raw
      case_insensitive: true
      regex: '[cd]:\\\*\.\*'

  - id: win16-wiper-taunt-message
    desc: Displays destructive wiper taunt message
    crit: notable
    conf: 0.90
    if:
      type: text
      case_insensitive: true
      regex: '(see you at hell|guess what happened|bye\.\.\.bye)'

composite_rules:
  - id: win16-destructive-wiper
    desc: Win16 wiper trojan targets boot, system, and root files
    crit: hostile
    conf: 0.97
    attack: T1485,T1561
    all:
      - id: destructive-system-wildcard-target
      - id: dos-boot-config-targets
      - id: root-drive-wildcard-targets
      - id: win16-wiper-taunt-message
