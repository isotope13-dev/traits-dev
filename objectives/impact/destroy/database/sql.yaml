defaults:
  platforms: [unix, windows]
  for: [python, go, shell, javascript, typescript, powershell, c, cpp]
  attack: T1485

composite_rules:
  # Schema-reset and migration tools can legitimately perform this sequence, so
  # it is destructive and suspicious but not independently ransomware-hostile.
  - id: database-schema-destruction
    desc: Drops a database with global foreign-key checks disabled
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/db/sql::sql-disable-foreign-key-checks
      - id: micro-behaviors/data/db/sql::sql-drop-database
    near_bytes: 4096
    unless:
      - id: metadata/package/testing/presence/fixture::non-executing-detection-fixture-declaration
