defaults:
  for: [python, javascript, typescript, ruby, perl, lua, php]
  platforms: [unix, windows]
  attack: T1485
composite_rules:
  - id: listener-kill-postgresql-cluster-delete
    desc: Kill port owner beside PostgreSQL data deletion
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/fs/delete/directory::postgresql-cluster-recursive-delete-command
      - id: micro-behaviors/process/terminate/command::embedded-port-owner-force-kill
    near_bytes: 220
  - id: mcp-session-postgresql-cluster-delete
    for: [python, javascript, typescript]
    desc: MCP tool requests PostgreSQL cluster destruction
    crit: suspicious
    conf: 0.95
    all:
      - id: listener-kill-postgresql-cluster-delete
      - id: micro-behaviors/communications/mcp::mcp-tools-call-method
      - id: micro-behaviors/communications/mcp::mcp-session-execution-tool-name
    any:
      - id: micro-behaviors/communications/http/request/verb::python-explicit-http-method-call
      - id: micro-behaviors/communications/http/request/verb::post-method-text
