# Database administration commands that explicitly destroy or rebuild stored
# data. These are legitimate only with operator intent, so a literal command
# is suspicious outside a recognized command-policy corpus.
defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  crit: suspicious
  conf: 0.97
  attack: T1485

traits:
  - id: postgres-dropdb-command
    desc: PostgreSQL CLI drops a database
    if:
      type: text
      regex: '(?im)^\s*dropdb\s+\S+'
    unless:
      - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
      - id: metadata/package/testing/
      - id: metadata/file/extension/identity::markdown-file-basename
      # Scratch database created and dropped in the same script, whether
      # created with the createdb CLI or with SQL CREATE DATABASE (e.g. a
      # benchmark harness making template copies on its own cluster and
      # dropping each measured copy afterwards).
      - type: text
        regex: '(?im)(^\s*createdb\b|\bCREATE\s+DATABASE\b)'

  - id: mongosh-drop-database-command
    desc: Mongo shell drops the selected database
    if:
      type: text
      regex: '(?i)\bmongosh\b[^\n]{0,160}\bdb\.dropDatabase\s*\('
    unless:
      - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
      - id: metadata/package/testing/
      - id: metadata/file/extension/identity::markdown-file-basename

  - id: aws-rds-delete-instance-command
    desc: AWS CLI deletes an RDS instance
    if:
      type: text
      regex: '(?i)\baws\b[^\n]{0,100}\brds\s+delete-db-instance\b'
    unless:
      - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
      - id: metadata/package/testing/
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: metadata/file/extension/identity::markdown-powershell-basename

  - id: prisma-migration-reset-command
    desc: Prisma resets a database schema
    if:
      type: text
      regex: '(?i)\bprisma\s+migrate\s+reset\b'
    unless:
      - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
      - id: metadata/package/testing/
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: micro-behaviors/process/create/shell/guard::destructive-command-denied-prose

  - id: database-migration-base-reset
    desc: Migration tool resets schema to baseline
    if:
      type: text
      regex: '(?i)\b(alembic\s+downgrade\s+base|rails\s+db:reset)\b'
    unless:
      - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
      - id: metadata/package/testing/
      - id: metadata/file/extension/identity::markdown-file-basename

  - id: prisma-data-loss-override
    desc: Prisma explicitly accepts database loss
    if:
      type: text
      regex: '(?i)\bprisma\b[^\n]{0,120}--(accept-data-loss|force-reset|force)\b'
    unless:
      - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
      - id: metadata/package/testing/
      - id: metadata/file/extension/identity::markdown-file-basename
