# Generic destructive-action vocabulary: English verbs (delete/destroy/clean)
# and deletion-target nouns (source, codebase, project). Component-only — these
# words appear constantly in benign software. Objective composites gate them
# alongside intent evidence (e.g. an LLM instruction-override, a paste-run
# lure). The verb-near-target composite is a building block, not a standalone
# signal: "remove the source files" is ordinary developer language.
#
# Every verb here names the thing it destroys — a bare verb is too common in
# benign code to carry any weight, which is why `delete-verb--delete` was
# withdrawn and why `destroy-verb` was split the same way (see below). The
# verb-target regexes tolerate a single "the" so that the instruction phrasing
# an attacker actually writes ("wipe the disk", "erase the files") is covered
# as well as the terse form.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: component
traits:
# "destroy" was the last bare verb left in this file, matched as a lone word the
# way `delete-verb--delete` was before it was withdrawn for the same reason.
# Destroying an object is core C++/OOP vocabulary, so the bare word fired on
# ordinary library sources with no destructive behaviour anywhere in them —
# Abseil's any_invocable.h earned an impact/destroy feature purely from the
# comments "perform a destroy" and "the actual move/destroy operation". Like
# every sibling here (erase/wipe/purge/clean), the verb must now name what it
# destroys, and the named targets are whole stores rather than a single object:
# "destroy the file handle" is lifetime management, "destroy all files" is not.
# Split three ways because a single regex may carry at most three alternations.
- id: target-source-test
  desc: Source or test targeted by destructive action
  conf: 0.88
  if:
    type: text
    regex: '\b(delete|destroy|wipe)\b.{0,40}\b(source|test)\b'
    case_insensitive: true
  unless:
  - type: text
    regex: '(?i)(\.test\s*\(|\w+\.test\b)'
  - type: text
    regex: '(?i)after\s+(successful\s+)?(compression|conversion|build)'
  - id: metadata/package/testing/


  - id: "metadata/file/naming::test-directory-component"
- id: delete-verb--erase-files
  crit: notable
  desc: "Destructive erase action on files"
  conf: 0.9
  if:
    type: text
    case_insensitive: true
    regex: '\berase\b\s+(the\s+)?(files?|directories?)\b'
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: delete-verb--erase-storage
  desc: "Destructive erase action on storage"
  conf: 0.9
  if:
    type: text
    case_insensitive: true
    regex: '\berase\b\s+(the\s+)?(disk|drive|data)\b'
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: delete-verb--wipe
  desc: Wipes disk or user data
  conf: 0.9
  if:
    type: text
    regex: '\bwipe\b\s+(the\s+)?(disk|drive|data|files?)\b'
  unless:
  - id: metadata/package/testing/
  - id: metadata/file/catalog/identity::debian-packages-index
  - id: "metadata/file/naming::test-directory-component"
- id: cleanup-verb
  crit: notable
  desc: "Purge source/project action phrase"
  conf: 0.88
  if:
    type: text
    case_insensitive: true
    regex: '\bpurge\s+(the\s+)?(codebase|repository|repo|project)\b'
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
composite_rules:
- id: delete-verb
  desc: Destructive removal-word component
  conf: 0.9
  any:
  - id: delete-verb--erase-files
  - id: delete-verb--erase-storage
  - id: delete-verb--wipe
  unless:
  - id: micro-behaviors/communications/http/delete::method-marker
  - id: micro-behaviors/data/db/delete/row::sql-delete
- id: destructive-verb
  desc: Destructive-action vocabulary component
  crit: component
  any:
  - id: delete-verb
  - id: metadata/lang/natural/phrasing::destroy-target-wording
  - id: cleanup-verb
  unless:
  - id: micro-behaviors/communications/http/delete::method-marker
  - id: micro-behaviors/data/db/delete/row::sql-delete

- id: destructive-code-target
  desc: Source/repository/workspace target-word component
  crit: component
  any:
  - id: target-source-test
  - id: metadata/lang/natural/phrasing::delete-codebase-wording
  - id: micro-behaviors/communications/http/delete::project-delete-operation-reference

- id: destructive-code-instruction
  desc: Destructive verb targeting source/repo/project
  crit: component
  conf: 0.9
  near_bytes: 140
  all:
  - id: destructive-verb
  - id: destructive-code-target
