defaults:
  platforms: [unix]
  for: [python]
  attack: T1485

traits:
  - id: encoded-unix-root-delete-command
    desc: Encoded Unix root deletion command
    crit: suspicious
    conf: 0.98
    if:
      type: encoded
      regex: 'rm\s+-[a-z]*(rf|fr)[a-z]*\s+/'
    unless:
      # Red-team eval banks quote encoded wipe payloads as labeled test
      # inputs in a testing corpus instead of running them.
      - id: metadata/package/testing/

      - id: "metadata/file/naming::test-directory-component"
      # A command gate names the wipe in its denylist and base64-decodes
      # tool input so that encoded form is blocked, not run.
      - id: command-gate-decodes-against-denylist
      # The same gate's module docstring shows the encoded wipe as a
      # blocked example.
      - id: micro-behaviors/process/create/shell/guard::python-doc-blocked-decode-example
  - id: wipe-denylist-force-delete-wording
    desc: Denylist names a recursive force-delete
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: force-delete
composite_rules:
  - id: command-gate-decodes-against-denylist
    desc: Decodes input beside a force-delete denylist
    crit: notable
    conf: 0.9
    near_lines: 120
    all:
      - id: wipe-denylist-force-delete-wording
      - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: decoded-root-delete-dynamic-exec
    desc: Decodes a root deletion command for dynamic execution
    crit: hostile
    conf: 0.99
    all:
      - id: encoded-unix-root-delete-command
      - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-decode-decrypt-dynamic-exec
