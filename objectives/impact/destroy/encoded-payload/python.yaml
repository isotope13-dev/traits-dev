defaults:
  platforms: [unix]
  for: [python]
  attack: T1485

traits:
  - id: encoded-unix-root-delete-command
    desc: Encoded Unix root deletion command
    crit: suspicious
    conf: 0.98
    if:
      type: encoded
      regex: 'rm\s+-[a-z]*(rf|fr)[a-z]*\s+/'

composite_rules:
  - id: decoded-root-delete-dynamic-exec
    desc: Decodes a root deletion command for dynamic execution
    crit: hostile
    conf: 0.99
    all:
      - id: encoded-unix-root-delete-command
      - id: objectives/anti-static/obfuscation/eval/scripting::python-decode-decrypt-dynamic-exec

