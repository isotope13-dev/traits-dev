defaults:
  platforms: [unix]
  for: [shell]
  attack: T1485
traits:
  # The decoded bytes in the sample request `sudo rm -rf /`. GNU rm may
  # refuse that request, so this describes its target, not a successful wipe.
  # A delimiter after / keeps encoded cleanup of /tmp or /var out.
  - id: shell-encoded-root-delete-command
    desc: Encoded recursive rm targets filesystem root
    crit: suspicious
    conf: 0.98
    if:
      type: encoded
      regex: \brm\s+-(rf|fr)\s+(--no-preserve-root\s+)?/([\s"')]|$)
    downgrade:
      scope: archive
      any:
      - id: well-known/tool/detection/cc-audit::cc-audit-source-package-identity
    unless:
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component
