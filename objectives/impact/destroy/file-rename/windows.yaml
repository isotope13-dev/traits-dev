# Destruction-by-rename: targets are retargeted to a dead extension so they no
# longer launch, while their bytes stay in place. The embedded `cmd /c rename`
# command supplies the technique; a shell-creation capability in the same
# binary supplies the execution. Seen in VB6 worms renaming .exe files to .die.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1565.001

composite_rules:
  - id: shell-rename-to-die-extension
    desc: Executes shell commands renaming files to .die
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/file/rename::cmd-target-die-extension-rename
      - id: micro-behaviors/process/create/shell
