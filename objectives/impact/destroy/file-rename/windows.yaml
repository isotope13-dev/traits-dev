# DOS rename patterns. A destination extension alone does not prove destruction.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1565.001

traits:
  # Any program that runs a command looks COMSPEC up (FreeDOS COMMAND,
  # HELP, CALLVER), so the name alone is only context for the rename rule.
  - id: dos-comspec-name
    desc: Names the COMSPEC command interpreter
    crit: notable
    conf: 0.9
    for: [dos_com]
    if:
      type: hex
      pattern: "43 4F 4D 53 50 45 43"

  - id: dos-cmd-rename-switch
    desc: Command switch renames a file
    crit: suspicious
    conf: 0.93
    for: [dos_com]
    if:
      type: hex
      pattern: "2F 43 20 52 45 4E 41 4D 45"

  - id: batch-rename-windows-file-extensions
    desc: Batch renames Windows file extensions
    crit: suspicious
    conf: 0.94
    count_min: 3
    for: [batch]
    if:
      type: text
      regex: '(?im)^\s*@?ren\s+[a-z]:\\?windows\\\*\.[a-z]{3}\s+\*\.[\w-]+'

  - id: batch-rename-virus-extension
    desc: Rename command applies virus suffix
    crit: notable
    conf: 0.96
    for: [batch]
    if:
      type: text
      regex: '(?im)^\s*@?ren[^\r\n]{0,80}\s+\*\.[\w-]{0,16}virus\b'

  # Compare the SET variable with the root used by FOR /R, then compare
  # the loop variable with the source and destination of the rename.
  - id: batch-recursive-appdata-file-rename
    desc: Forces one suffix across the AppData tree
    crit: hostile
    conf: 0.97
    for: [batch]
    if:
      type: yara
      source: |
        rule batch_appdata_rename_bound_operands {
          strings:
            $assign = /(^|\n)[ \t]*@?set[ \t]+"?/ nocase
            $name = /[A-Za-z_][A-Za-z0-9_]{0,31}="?%(userprofile%[\\\/]AppData|localappdata%)"?[ \t]*\r?\n/ nocase
            $loop = /(^|\n)[ \t]*@?for[ \t]+\/r[ \t]+"?%/ nocase
            $use = /%"?[ \t]+%%[A-Za-z][ \t]+in[ \t]*\(\*[ \t]*\)[ \t]+do[ \t]*\([ \t]*\r?\n/ nocase
            $item = /%%[A-Za-z][ \t]+in[ \t]*\(/ nocase
            $rename = /\n[ \t]*@?(ren|rename)[ \t]+"?%%/ nocase
            $target = /"?[ \t]+"?%%~n/
            $suffix = /\.[A-Za-z0-9_-]{1,18}"?[ \t]*\r?\n/
          condition:
            filesize <= 8192 and all of them and
            for any a in (1..#assign) : (
              $name at @assign[a] + !assign[a] and
              for any l in (1..#loop) : (
                @loop[l] > @assign[a] and @loop[l] - @assign[a] <= 512 and
                for any n in (1..32) : (
                  uint8(@assign[a] + !assign[a] + n) == 61 and
                  $use at @loop[l] + !loop[l] + n and
                  for all b in (0..n - 1) : (
                    (uint8(@assign[a] + !assign[a] + b) | 32) ==
                    (uint8(@loop[l] + !loop[l] + b) | 32)
                  )
                ) and
                for any i in (1..#item) : (
                  @item[i] > @loop[l] and @item[i] - @loop[l] <= 72 and
                  for any r in (1..#rename) : (
                    @rename[r] > @item[i] and @rename[r] - @item[i] <= 160 and
                    uint8(@rename[r] + !rename[r]) == uint8(@item[i] + 2) and
                    for any t in (1..#target) : (
                      @target[t] == @rename[r] + !rename[r] + 1 and
                      uint8(@target[t] + !target[t]) == uint8(@item[i] + 2) and
                      $suffix at @target[t] + !target[t] + 1
                    )
                  )
                )
              )
            )
        }

composite_rules:
  - id: batch-disruptive-windows-file-renames
    desc: Batch renames Windows system file groups with virus-marked suffixes
    crit: hostile
    conf: 0.97
    for: [batch]
    all:
      - id: batch-rename-windows-file-extensions
      - id: batch-rename-virus-extension

  - id: dos-comspec-rename-files
    desc: COMSPEC command renames files
    crit: hostile
    conf: 0.94
    for: [dos_com]
    all:
      - id: dos-comspec-name
      - id: dos-cmd-rename-switch
