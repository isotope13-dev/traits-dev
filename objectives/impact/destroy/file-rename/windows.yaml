# DOS rename patterns. A destination extension alone does not prove destruction.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1565.001

traits:
  - id: dos-comspec-name
    desc: Names the COMSPEC command interpreter
    crit: suspicious
    conf: 0.9
    for: [dos_com]
    if:
      type: hex
      pattern: "43 4F 4D 53 50 45 43"

  - id: dos-cmd-rename-switch
    desc: Command switch renames a file
    crit: suspicious
    conf: 0.93
    for: [dos_com]
    if:
      type: hex
      pattern: "2F 43 20 52 45 4E 41 4D 45"

composite_rules:
  - id: dos-comspec-rename-files
    desc: COMSPEC command renames files
    crit: hostile
    conf: 0.94
    for: [dos_com]
    all:
      - id: dos-comspec-name
      - id: dos-cmd-rename-switch
