# A destructive command inside a package build recipe.
#
# An ebuild, a PKGBUILD, an RPM spec or a distro scriptlet runs with the
# builder's privileges on every user who installs the package, and it runs
# unattended. A root wipe or a recursive delete of a home directory placed
# there is not a mistake anyone makes: the Gentoo GitHub organization
# compromise of June 2018 prepended `rm -rf /*` to the ebuilds in the
# repository, and `rm -rf /*&` (backgrounded, so the build appears to
# continue) to others.
#
# Neither leg is hostile alone -- recipes are ordinary, and a root wipe is
# already suspicious wherever it appears -- but a recipe that contains one has
# no innocent reading.
defaults:
  platforms: [unix]
  for: [shell, scripts, source]
  attack: T1485,T1195.002
  mbc: F0014

composite_rules:
  - id: package-recipe-destroys-filesystem
    desc: Build recipe wipes the filesystem
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/build/package/recipe::gentoo-ebuild-recipe
    any:
      - id: objectives/impact/destroy/file-deletion::unix-root-rm-glob
      - id: objectives/impact/destroy/file-deletion::sudo-rm-rf-root
      - id: micro-behaviors/fs/delete/directory::recursive-root
