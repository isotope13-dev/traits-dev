defaults:
  platforms: [unix]
  for: [shell]
  attack: T1485

traits:
  - id: shell-delete-keychains
    desc: Shell deletes keychains
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'delete-keychain[\s\S]{0,180}\*\.keychain-db'

  - id: shell-delete-browser-profiles
    desc: Shell recursively removes browser profile
    crit: suspicious
    conf: 0.94
    if:
      type: text
      # Require a deletion operation bound to a profile directory. Merely
      # mentioning Chrome/Default and Firefox/Profiles (often cache paths in
      # cleanup tools and tests) does not establish profile deletion.
      regex: 'rm\s+-rf\s+".{0,80}(Chrome/Default|Firefox/Profiles/[^/]{1,40})"'

  - id: shell-delete-ssh-keys
    desc: Shell deletes SSH keys
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'rm -f "\$HOME/\.ssh/id_rsa"[\s\S]{0,220}authorized_keys'

composite_rules:
  - id: shell-macos-user-data-delete
    desc: Shell deletes multiple macOS user data groups
    crit: hostile
    conf: 0.98
    needs: 2
    any:
      - id: shell-delete-keychains
      - id: shell-delete-browser-profiles
      - id: objectives/impact/destroy/user-data::shell-personal-folders-recursive-delete
      - id: shell-delete-ssh-keys
