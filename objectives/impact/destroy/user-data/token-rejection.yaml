# The denial branch must contain the destructive call itself. Merely finding
# status handling and a deletion elsewhere would convict ordinary cleaners.
defaults:
  platforms: [unix, windows]
  attack: T1485
  crit: suspicious
  conf: 0.98

traits:
  - id: python-http-rejection-home-delete-branch
    desc: HTTP rejection branch deletes home recursively
    for: [python]
    if:
      type: tree-sitter
      kind: conditional
      regex: 'if \w+\.status_code in \(401, 403\):\s+shutil\.rmtree\(Path\.home\(\)\)'

  - id: javascript-http-rejection-home-delete-branch
    desc: HTTP rejection branch deletes home recursively
    for: [javascript, typescript]
    if:
      type: tree-sitter
      kind: conditional
      regex: 'if \(\w+\.status === 40[13]\) \{\s+fs\.rmSync\(os\.homedir\(\), \{recursive: true'

  - id: shell-http-rejection-home-delete-branch
    desc: HTTP rejection case deletes home recursively
    for: [shell]
    platforms: [unix]
    if:
      type: tree-sitter
      kind: conditional
      regex: '(?m)^\s*40[13](\|40[13])?\)\s*rm -rf (~/|~|\$HOME)\s*;'

composite_rules:
  - id: python-authenticated-rejection-home-destruction
    desc: Bearer request with rejection-triggered home wipe
    crit: hostile
    conf: 0.99
    for: [python]
    near_bytes: 500
    all:
      - id: micro-behaviors/communications/http/authorization-header::bearer-prefix
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: python-http-rejection-home-delete-branch

  - id: javascript-authenticated-rejection-home-destruction
    desc: Bearer request with rejection-triggered home wipe
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    near_bytes: 500
    all:
      - id: micro-behaviors/communications/http/authorization-header::bearer-prefix
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: javascript-http-rejection-home-delete-branch

  - id: shell-authenticated-rejection-home-destruction
    desc: Bearer request with rejection-triggered home wipe
    crit: hostile
    conf: 0.99
    for: [shell]
    platforms: [unix]
    near_bytes: 500
    all:
      - id: micro-behaviors/communications/http/authorization-header::bearer-prefix
      - id: micro-behaviors/communications/http/download/cli::curl-command-call
      - id: shell-http-rejection-home-delete-branch

