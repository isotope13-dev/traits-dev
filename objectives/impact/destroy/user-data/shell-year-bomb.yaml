defaults:
  platforms: [linux, macos]
  for: [shell]
  attack: T1485

traits:
  - id: shell-year-cutoff-home-delete-branch
    desc: Year cutoff gates destruction of HOME content
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      kind: conditional
      regex: '\$\(date\s+\+%Y\)"?\s+-(ge|gt)\s+[0-9]{4}\s*\];\s*then\s+rm\s+-rf\s+"?\$\{?HOME\}?"?/\*'
    unless:
      - id: metadata/package/testing/corpus::inert-scanner-attack-corpus

composite_rules:
  - id: shell-year-gated-home-destruction
    desc: Year cutoff gates HOME content deletion
    crit: hostile
    conf: 0.99
    near_bytes: 120
    all:
      - id: shell-year-cutoff-home-delete-branch
      - id: micro-behaviors/time/query::shell-year-cutoff-condition
      - id: micro-behaviors/fs/delete/directory::shell-home-root-glob-delete
    unless:
      - id: metadata/package/testing/corpus::inert-scanner-attack-corpus
