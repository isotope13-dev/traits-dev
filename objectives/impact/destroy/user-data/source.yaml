defaults:
  platforms: [unix, windows]
  # Shell scripts are intentionally excluded: the generic shell cleanup test
  # corpus exercises exactly these operands and is covered by the neutral
  # delete/path traits. Compiled/source language members still receive the
  # impact objective.
  for: [source, c, cpp, go, java, java_class, class, kotlin, ruby, python, javascript, typescript, csharp, php, perl, swift, rust, zig, elixir]
  crit: suspicious
  conf: 0.95
  attack: T1485

traits:
  - id: source-recursive-remove-command
    desc: Source contains rm -rf
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'rm\s+-rf'

  - id: source-user-home-path
    desc: Source references a home path
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)(~/|\$HOME[/\\]|\$\{HOME\}[/\\]|/home/|/Users/|%USERPROFILE%[/\\])'

  - id: source-personal-folder-root
    desc: Source names a personal folder root
    crit: component
    conf: 0.9
    if:
      type: text
      # Require a path component boundary: `rancher-desktop` is an app-owned
      # VM path, not the user's Desktop directory. Do not match subfolders.
      regex: '(?i)[/\\](Documents|Desktop|Pictures)([/\\]\*|["\x27\s,;}]|$|\*)'

composite_rules:
  - id: source-user-document-recursive-delete-command
    desc: Recursively deletes a user folder
    crit: suspicious
    conf: 0.95
    near_bytes: 256
    all:
      - id: source-recursive-remove-command
      - id: source-user-home-path
      - id: source-personal-folder-root
    unless:
      - id: metadata/package/testing/presence/harness::test-directory
      - id: well-known/tool/detection/threat-intel::threat-intel-label

  - id: source-user-folder-delete-after-discovery
    desc: Deletes user folders after host identification
    crit: hostile
    conf: 0.97
    attack: T1485,T1082
    # Source bundles are often minified to one line; byte proximity keeps a
    # bundled VM script from combining with unrelated application host code.
    near_bytes: 2048
    scope: file
    all:
      - id: source-user-document-recursive-delete-command
    any:
      - id: micro-behaviors/os/sysinfo/hostname
      - id: micro-behaviors/process/create/direct::zig-child-init
      - id: micro-behaviors/process/create/exec::go-exec-command-call
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode
      - id: micro-behaviors/process/create/system::elixir-system-cmd
      - id: micro-behaviors/process/create/shell/native::c-popen-variable-input
      - id: micro-behaviors/process/interpreter/eval/direct::shell-dynamic-command-execution

  # Python counterpart of the shell personal-folder delete: a sequence of
  # top-level personal folder names, an rmtree of a joined path and the
  # expanded home directory inside one 512-byte routine. Removing the user's Documents/Desktop/Pictures trees wholesale
  # is destruction, not cleanup.
  - id: python-personal-folders-recursive-delete
    desc: Python recursively deletes multiple personal folders under home
    crit: hostile
    conf: 0.96
    for: [python]
    near_bytes: 512
    all:
      - id: micro-behaviors/fs/path/location::python-personal-folder-name-sequence
      - id: micro-behaviors/fs/delete/directory::python-rmtree-joined-path
      - id: micro-behaviors/fs/path/location::python-expanduser-tilde
    unless:
      - id: metadata/package/testing/presence/harness::test-directory
