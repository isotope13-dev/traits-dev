defaults:
  platforms: [unix, windows]
  # Shell scripts are intentionally excluded: the generic shell cleanup test
  # corpus exercises exactly these operands and is covered by the neutral
  # delete/path traits. Compiled/source language members still receive the
  # impact objective.
  for: [source, c, cpp, go, java, java_class, class, kotlin, ruby, python, javascript, typescript, csharp, php,
    perl, swift, rust, zig, elixir]
  crit: suspicious
  conf: 0.95
  attack: T1485

composite_rules:
  - id: source-user-document-recursive-delete-command
    desc: Recursively deletes a user folder
    crit: suspicious
    conf: 0.95
    near_bytes: 256
    all:
      - id: micro-behaviors/fs/delete/directory::source-recursive-remove-command
      - id: micro-behaviors/fs/path/personal::source-user-home-path
      - id: micro-behaviors/fs/path/personal::source-personal-folder-root
    unless:
      - id: metadata/package/testing/harness/unit::rust-test
      - id: metadata/package/documentation/security-advisory::threat-intel-label
      - id: metadata/package/testing/corpus/labeled::labeled-shell-risk-command-data

  - id: source-user-folder-delete-with-execution
    desc: User-folder deletion with process/host APIs
    crit: hostile
    conf: 0.97
    # Source bundles are often minified to one line; byte proximity keeps a
    # bundled VM script from combining with unrelated application host code.
    # This establishes proximity, not execution order or shared arguments.
    near_bytes: 2048
    scope: file
    all:
      - id: source-user-document-recursive-delete-command
    any:
      - id: micro-behaviors/os/sysinfo/hostname
      - id: metadata/lang/source/syntax/member::zig-child-init
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-call
      - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-bytecode
      - id: micro-behaviors/process/create/exec::elixir-system-cmd
      - id: micro-behaviors/process/create/shell/variable-command::c-popen-variable-input
      - id: micro-behaviors/process/interpreter/shell::shell-dynamic-command-execution

  # Python counterpart of the shell personal-folder delete: a sequence of
  # top-level personal folder names, an rmtree of a joined path and the
  # expanded home directory inside one 512-byte routine. Removing the user's Documents/Desktop/Pictures trees wholesale
  # is destruction, not cleanup.
  - id: python-personal-folders-recursive-delete
    desc: Python recursively deletes multiple personal folders under home
    crit: hostile
    conf: 0.96
    for: [python]
    near_bytes: 512
    all:
      - id: micro-behaviors/fs/path/user-directory::personal-folder-name-sequence
      - id: micro-behaviors/fs/delete/directory::python-rmtree-joined-path
      - id: micro-behaviors/fs/path/user-directory::python-expanduser-tilde

  - id: node-personal-folders-recursive-delete
    desc: Node recursively deletes multiple personal folders under home
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    near_bytes: 512
    all:
      - id: micro-behaviors/fs/path/user-directory::personal-folder-name-sequence
      - id: micro-behaviors/fs/delete/directory::fs-rm-recursive
      - id: micro-behaviors/process/identity/query/principal::os-homedir-call

  - id: kotlin-personal-folders-recursive-delete
    desc: Kotlin recursively deletes multiple personal folders under home
    crit: hostile
    conf: 0.98
    for: [kotlin]
    scope: file
    near_bytes: 512
    all:
      - id: micro-behaviors/fs/path/user-directory::personal-folder-name-sequence
      - id: micro-behaviors/fs/delete/target::java-personal-folder-recursive-delete
