defaults:
  for: [ne]
  platforms: [windows]
  attack: T1485,T1547.001

traits:
  - id: startup-destructive-deltree
    desc: Legacy program stages destructive startup
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule legacy_startup_destructive_deltree {
          strings:
            $boot = "C:\\Autoexec.bat" ascii nocase
            $delete = "Deltree /Y C:\\" ascii nocase
            $command = "C:\\Command.com" ascii nocase
            $win = "C:\\Windows\\Win.com" ascii nocase
          condition:
            uint16(0) == 0x5a4d and all of them
        }
