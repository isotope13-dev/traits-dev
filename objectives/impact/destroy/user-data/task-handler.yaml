defaults:
  platforms:
  - unix
  for:
  - javascript
  - typescript
  attack: T1485
composite_rules:
- id: constructed-task-with-home-wipe-handler
  desc: Runner secret scraper installs a home-wipe task
  crit: hostile
  conf: 0.98
  all:
  - id: constructed-task-home-wipe-configuration
  - id: objectives/credential-access/memory::github-runner-process-memory-secret-dump
traits:
- id: constructed-task-home-wipe-configuration
  desc: Task execute call contains home-wipe command
  crit: suspicious
  conf: 0.98
  if:
    type: tree-sitter
    query: "(call_expression\n  function: [\n    (member_expression\n      object: (new_expression arguments: (arguments\
      \ . (_) . (string (string_fragment) @command)))\n      property: (property_identifier) @execute)\n    (subscript_expression\n\
      \      object: (new_expression arguments: (arguments . (_) . (string (string_fragment) @command)))\n     \
      \ index: (string (string_fragment) @execute))]\n  (#eq? @execute \"execute\")\n  (#match? @command \"^rm[\
      \ ]+-[rf]{2}[ ]+(~/?|[$]HOME)([; ]|$)\")) @task"
