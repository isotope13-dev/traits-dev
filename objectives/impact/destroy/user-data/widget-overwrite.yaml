defaults:
  for: [html]
  platforms: [windows, macos]
composite_rules:
  - id: widget-personal-folders-fixed-text-overwrite
    desc: Widget source overwrites personal files with fixed text
    crit: hostile
    conf: 0.99
    attack: T1485
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/directory/traverse::widget-recursive-personal-folder-set
      - id: micro-behaviors/fs/file/truncate::widget-personal-folder-file-replacements
      - id: metadata/lang/source/syntax/assignment/name::repeated-fixed-data-string-assignment
