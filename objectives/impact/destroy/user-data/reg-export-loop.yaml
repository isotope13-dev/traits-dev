defaults:
  for: [text, batch, reg]
  platforms: [windows]

traits:
  - id: reg-wildcard-export-overwrite
    desc: Registry export loop targets existing REG files
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)for %([a-z]) in \([^\r\n]{0,80}\*\.reg\) do regedit /e %([a-z])\b'
