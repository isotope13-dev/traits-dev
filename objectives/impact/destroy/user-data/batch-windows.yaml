defaults:
  platforms: [windows]
  for: [batch]
  attack: T1485

traits:
  - id: batch-user-dir-rmdir-loop
    desc: Batch user directory rmdir loop
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'for /d %%D in \("%USERPROFILE%\\(Documents|Desktop|Downloads)\\\*"\)'

  - id: batch-bcdedit-deletevalue
    desc: Batch bcdedit deletevalue
    crit: suspicious
    conf: 0.93
    unless:
      - id: metadata/file/string/application-name::windows-safe-mode-toggle-script
    if:
      type: text
      substr: bcdedit /deletevalue

  - id: batch-removes-trendmicro-dir
    desc: Batch removes Trend Micro dir
    crit: suspicious
    conf: 0.94
    attack: T1562.001
    if:
      type: text
      regex: '(?i)\brmdir\b[^\r\n]{0,80}\\Trend Micro\b'

  - id: batch-forced-reboot-now
    desc: Batch forced immediate reboot
    crit: suspicious
    conf: 0.94
    attack: T1529
    if:
      type: text
      regex: '(?i)\bshutdown\s+-r\s+-f\s+-t\s+00\b'

  - id: batch-target-users-documents
    desc: Batch targets users directory documents
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)C:\\Users.{0,40}\*(\.doc|\.xls|\.pdf|\.ppt)'

composite_rules:
  - id: batch-user-document-lock-and-persistence
    desc: Batch locks user files with persistence
    crit: hostile
    conf: 0.98
    attack: "T1486,T1547.001"
    all:
      - id: micro-behaviors/fs/enumerate/directory::batch-recursive-for-loop
      - id: batch-target-users-documents
      - id: micro-behaviors/fs/file/attributes::attrib-readonly
      - id: objectives/persistence/login/registry/autostart::batch-reg-add-run-key-direct

  - id: batch-user-data-delete-and-recovery-inhibition
    desc: Batch deletes user data and disables recovery
    crit: hostile
    conf: 0.98
    all:
      - id: batch-user-dir-rmdir-loop
      - id: batch-bcdedit-deletevalue
      - id: micro-behaviors/os/recovery::reagentc-disable-winre

  - id: batch-edr-dir-removal-reboot
    desc: Batch EDR directory removal reboot
    crit: hostile
    conf: 0.98
    all:
      - id: batch-removes-trendmicro-dir
      - id: batch-bcdedit-deletevalue
      - id: batch-forced-reboot-now

  - id: batch-attribute-clear-and-system-file-wipe
    desc: Batch clears file protections before deleting system driver files
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/file/attributes::attrib-clears-system-hidden
      - id: micro-behaviors/fs/delete/file/command::batch-del-system-file-glob
      - id: micro-behaviors/os/console/control::batch-ctty-null-device

  - id: batch-windows-ini-wipe
    desc: Deletes INI files from Windows directories
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/system::batch-windows-dir-change
      - id: micro-behaviors/fs/delete/file/command::batch-del-ini-glob
    near_lines: 10
