defaults:
  platforms: [unix]
  for: [swift]

composite_rules:
  - id: swift-personal-folders-key-directory-wipe
    desc: Deletes personal folders and key directories
    crit: hostile
    conf: 0.95
    attack: T1485
    near_bytes: 1500
    all:
      - id: micro-behaviors/fs/delete/path::swift-remove-item-call
      - id: micro-behaviors/fs/path/personal::documents-root-path-literal
      - id: micro-behaviors/fs/path/personal::desktop-root-path-literal
      - id: micro-behaviors/fs/path/private-key::gnupg-directory-path-literal
