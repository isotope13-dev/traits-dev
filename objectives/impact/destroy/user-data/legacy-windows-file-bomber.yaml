defaults:
  for: [ne]
  platforms: [windows]
  attack: T1499

traits:
  - id: legacy-windows-dense-file-bomber
    desc: Windows bomber targets hundreds of files
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule legacy_windows_dense_file_bomber {
          strings:
            $purpose = "windows Bomber" ascii nocase
            $path = /[a-z]:\\windows\\[a-z]{3,10}[0-9]{1,3}\.txt/ ascii nocase
          condition:
            uint16(0) == 0x5a4d and $purpose and #path >= 100
        }
