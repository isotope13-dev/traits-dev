defaults:
  platforms: [windows, unix]
  for: [class, java_class]
  attack: T1485
  mbc: B0040

traits:
  - id: jvm-documents-folder-target
    desc: JVM references Documents folder
    crit: notable
    conf: 0.95
    if:
      type: value
      path: class.strings[*]
      exact: Documents

  - id: jvm-desktop-folder-target
    desc: JVM references Desktop folder
    crit: notable
    conf: 0.95
    if:
      type: value
      path: class.strings[*]
      exact: Desktop

  - id: jvm-pictures-folder-target
    desc: JVM references Pictures folder
    crit: notable
    conf: 0.95
    if:
      type: value
      path: class.strings[*]
      exact: Pictures

  # A delete helper that names the standard folders in its protected-path
  # list refuses to remove them; the same names are the guard, not the target.
  - id: jvm-protected-path-refusal
    desc: JVM guard refuses to delete protected paths
    crit: notable
    conf: 0.9
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)protected ?paths?|dangerous path'

composite_rules:
  - id: jvm-recursive-user-folders-wipe
    desc: JVM recursively deletes standard user folders
    crit: hostile
    conf: 0.99
    scope: leaf
    all:
      - id: metadata/import/jvm::java-file-delete-bytecode
      - id: micro-behaviors/fs/directory/readdir/language::jvm-file-listfiles
      - id: micro-behaviors/os/user/lookup::java-user-home-property-constant
      - id: jvm-documents-folder-target
      - id: jvm-desktop-folder-target
      - id: jvm-pictures-folder-target
    # Downgrade, not unless: a real wiper could carry the same wording.
    downgrade:
      any:
        - id: jvm-protected-path-refusal
