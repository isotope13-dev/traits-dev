defaults:
  for: [powershell]
  platforms: [windows]
  attack: T1485

composite_rules:
  - id: powershell-recursive-disk-byte-corruption
    desc: Recursively corrupts discovered disk files
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/write/file/transform::powershell-inplace-byte-increment
      - id: micro-behaviors/fs/traversal/drives::powershell-logical-disk-query
      - id: micro-behaviors/fs/traversal/drives::powershell-recursive-disk-user-targets

  - id: powershell-recursive-file-prefix-corruption
    desc: Recursive file-prefix corruption
    crit: hostile
    conf: 0.97
    all:
      - id: powershell-recursive-disk-byte-corruption
      - id: micro-behaviors/data/arithmetic::powershell-short-prefix-byte-loop
