        (#eq? @target "/sdcard/Pictures"))

  - id: node-spawn-rm-dcim-storage
    desc: Node spawns recursive DCIM removal
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @callee
          arguments: (arguments
            . (string (string_fragment) @program)
            . (array
              (string (string_fragment) @flag)
              (string (string_fragment) @target))))
        (#eq? @callee "spawn")
        (#eq? @program "rm")
        (#eq? @flag "-rf")
        (#eq? @target "/sdcard/DCIM"))

composite_rules:
  - id: node-removes-multiple-android-storage-trees
    desc: Node locker targets Android storage deletion
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/ui/manipulation/lockout::node-cli-secret-lockout-respawn-pattern
    any:
      - id: node-spawn-rm-android-storage
      - id: node-spawn-rm-download-storage
      - id: node-spawn-rm-pictures-storage
      - id: node-spawn-rm-dcim-storage
    needs: 3
