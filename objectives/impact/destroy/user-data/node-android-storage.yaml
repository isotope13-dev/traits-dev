              (string (string_fragment) @target))))
        (#eq? @callee "spawn")
        (#eq? @program "rm")
        (#eq? @flag "-rf")
        (#eq? @target "/sdcard/Download"))

  - id: node-spawn-rm-pictures-storage
    desc: Node spawns recursive Pictures removal
    crit: notable
    conf: 0.98
