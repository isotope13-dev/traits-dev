# Node CLI launchers that explicitly invoke rm -rf over Android shared-storage
# directories. The targeted directories distinguish a destructive wipe from
# ordinary recursive cleanup; require several separate user-data targets.
defaults:
  platforms: [android]
  for: [javascript, typescript]
  attack: T1485

traits:
  - id: node-spawn-rm-android-storage
    desc: Node spawns recursive Android storage removal
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @callee
          arguments: (arguments
            . (string (string_fragment) @program)
            . (array
              (string (string_fragment) @flag)
              (string (string_fragment) @target))))
        (#eq? @callee "spawn")
        (#eq? @program "rm")
        (#eq? @flag "-rf")
        (#eq? @target "/sdcard/Android"))

  - id: node-spawn-rm-download-storage
    desc: Node spawns recursive Downloads removal
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
