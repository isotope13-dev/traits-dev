defaults:
  for: [perl]
  platforms: [unix]
  attack: T1485

composite_rules:
  - id: perl-personal-folders-recursive-delete
    desc: Perl recursively deletes multiple personal folders under home
    crit: hostile
    conf: 0.97
    near_lines: 3
    all:
      - id: micro-behaviors/fs/path/user-directory::perl-home-root-binding
      - id: micro-behaviors/fs/delete/target::perl-personal-folder-removal-loop
      - id: micro-behaviors/fs/path/user-directory::perl-personal-folder-word-list
      - id: micro-behaviors/fs/delete/directory::perl-remove-tree-call
