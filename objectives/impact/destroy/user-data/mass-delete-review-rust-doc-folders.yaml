defaults:
  platforms: [macos, linux, windows]
  for: [rust]
  attack: T1485
  mbc: B0040

traits:
  - id: rust-standard-user-folder-targets
    desc: Rust targets standard user folders for deletion
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)home.{0,100}Documents.{0,100}Desktop.{0,100}Pictures'

composite_rules:
  - id: rust-recursive-user-folders-wipe
    desc: Rust recursively deletes standard user folders
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/fs/delete/directory::fs-remove_dir_all
      - id: rust-standard-user-folder-targets
