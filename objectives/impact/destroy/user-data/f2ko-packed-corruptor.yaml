# F2KO PS1-to-EXE stores the script in an RT_RCDATA resource encrypted with
# RC4. The key is the uppercase MD5 hex of the 8 bytes that begin at the
# 7F 3B D5 06 seed in .data. Each pattern is the ciphertext of one
# statement in that resource, so the packed container matches without
# relying on a decoder. Unpacked copies are covered by
# powershell-recursive-disk-byte-corruption.
defaults:
  for: [pe]
  platforms: [windows]
  crit: notable
  conf: 0.96
  attack: T1485

traits:
  - id: f2ko-rc4-logical-disk-query
    desc: Packed logical-disk query ciphertext
    if:
      type: hex
      pattern: "97 91 67 58 4D E8 E2 A1 62 B6 13 6C E9 10 7A CB 3C F5 E7 2F 5C 8D 97 C0"
      section: rsrc

  - id: f2ko-rc4-document-extension-gate
    desc: Packed document-extension gate ciphertext
    if:
      type: hex
      pattern: "44 39 1B 59 07 85 FA 0A 3F 1E 8C 65 4D 7B A6 25 73 F0 AE DB C5 3C 24 10"
      section: rsrc

  - id: f2ko-rc4-inplace-byte-increment
    desc: Packed in-place byte-increment ciphertext
    if:
      type: hex
      pattern: "89 FA CB B9 DA 28 53 88 C8 9E 70 3C 3A 97 62 51 D5 57 CA ED DB E4 AD 3F"
      section: rsrc

  - id: f2ko-rc4-prefix-byte-loop
    desc: Packed short prefix-loop ciphertext
    if:
      type: hex
      pattern: "9A E3 F2 0E 66 18 9A 6C 08 22 79 F8 88 92 2C 40 67 09 C0 C1 B6 4D DD E1"
      section: rsrc

  - id: f2ko-rc4-wallpaper-url
    desc: Packed wallpaper-download URL ciphertext
    if:
      type: hex
      pattern: "B5 D0 88 1C 58 AF 4F 89 30 8F 5E E2 BE E2 1D 56 C8 0C CF 07 65 09 EA E1"
      section: rsrc

  - id: f2ko-rc4-public-key-header
    desc: Packed PEM public-key header ciphertext
    if:
      type: hex
      pattern: "28 54 9F 6E 67 5D EB 04 C3 B9 7B 06 07 81 A6 D4 4F F7 03 48 D1 2F 99 44"
      section: rsrc

  - id: f2ko-rc4-desktop-pubkey-path
    desc: Packed desktop public-key path ciphertext
    if:
      type: hex
      pattern: "AC 73 AF B3 15 7F 66 96 6A 4C 74 B8 B0 85 6D A0"
      section: rsrc

composite_rules:
  - id: f2ko-packed-disk-byte-corruption
    desc: Packed script corrupts files across disks
    crit: hostile
    conf: 0.98
    all:
      - id: well-known/dual-use/packaging/ps-to-exe::negated-converter-vocabulary
      - id: f2ko-rc4-logical-disk-query
      - id: f2ko-rc4-document-extension-gate
      - id: f2ko-rc4-inplace-byte-increment

  - id: f2ko-packed-prefix-corruption
    desc: Packed script corrupts file prefixes
    crit: hostile
    conf: 0.97
    all:
      - id: f2ko-packed-disk-byte-corruption
      - id: f2ko-rc4-prefix-byte-loop

  - id: f2ko-packed-wallpaper-defacement
    desc: Packed corruptor also replaces wallpaper
    crit: hostile
    conf: 0.98
    attack: T1491.001
    all:
      - id: f2ko-packed-disk-byte-corruption
      - id: f2ko-rc4-wallpaper-url
