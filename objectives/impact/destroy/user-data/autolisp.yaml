defaults:
  for: [text]
  platforms: [windows]
  crit: hostile
  conf: 0.95
composite_rules:
  - id: autocad-replicator-timed-truncation
    desc: AutoCAD replicator with timed file truncation
    all:
      - id: objectives/impact/infect/macro::autocad-startup-file-copy-propagation
      - id: micro-behaviors/time/query::autocad-date-threshold
      - id: micro-behaviors/fs/file/open::autolisp-truncate-and-close
    near_bytes: 256
