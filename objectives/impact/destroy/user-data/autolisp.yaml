defaults:
  for: [text]
  platforms: [windows]
  crit: hostile
  conf: 0.95
traits:
  - id: autolisp-startup-filename
    desc: AutoLISP references startup script filename
    crit: notable
    if:
      type: text
      regex: '(?i)"acad\.lsp"'
  - id: autolisp-erase-all-entities
    desc: AutoLISP erases all drawing entities
    crit: notable
    if:
      type: text
      regex: '(?i)\(command\s+"\.?erase"\s+"all"'
  - id: autolisp-save-drawing-command
    desc: AutoLISP saves the active drawing
    crit: notable
    if:
      type: text
      regex: '(?i)\(command\s+"\.?qsave"'
  - id: autolisp-short-command-redefinition
    desc: AutoLISP redefines a short CAD command
    crit: notable
    if:
      type: text
      regex: '(?i)\(defun\s+c:[a-z]\s*\('
composite_rules:
  - id: autocad-startup-copy-drawing-erasure
    desc: AutoCAD startup copier erases and saves drawings
    all:
      - id: autolisp-startup-filename
      - id: autolisp-erase-all-entities
      - id: autolisp-save-drawing-command
      - id: autolisp-short-command-redefinition
      - id: micro-behaviors/fs/file/copy/call::autolisp-line-copy-loop
      - id: micro-behaviors/data/config/read::autocad-drawing-name-getvar

  - id: autocad-replicator-timed-truncation
    desc: AutoCAD replicator with timed file truncation
    all:
      - id: objectives/impact/infect/macro::autocad-startup-file-copy-propagation
      - id: micro-behaviors/time/query::autocad-date-threshold
      - id: micro-behaviors/fs/file/truncate::autolisp-truncate-and-close
    near_bytes: 256
