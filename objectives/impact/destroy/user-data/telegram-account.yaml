# Telegram deletion-request context without assuming vault binding.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1531

composite_rules:
- id: telegram-client-delete-request
  desc: Telegram client with account-delete request
  crit: suspicious
  conf: 0.98
  attack: T1531,T1485
  scope: leaf
  all:
  - id: micro-behaviors/communications/messaging/telegram::account-delete-request-evidence
  any:
  - id: micro-behaviors/communications/http/services/telegram::telegram-client-open-call
  - id: micro-behaviors/communications/http/services/telegram::goygram-import-reference
- id: telegram-delete-request-and-file-unlink
  desc: Deletion request and file unlink
  crit: suspicious
  conf: 0.98
  attack: T1531,T1485
  scope: leaf
  all:
  - id: telegram-client-delete-request
  - id: micro-behaviors/fs/delete/file/library::pathlib-unlink
