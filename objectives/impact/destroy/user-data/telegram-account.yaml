# Uses a locally stored Telegram session vault to invoke account deletion.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1531

composite_rules:
  - id: python-telegram-account-delete-using-vault
    desc: Deletes Telegram account using harvested vault session
    crit: hostile
    conf: 0.98
    attack: T1531,T1485
    scope: leaf
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-delete-account-api
    any:
      - id: micro-behaviors/fs/path/token::python-vault-session-glob
      - id: micro-behaviors/communications/http/services/telegram::telegram-client-open-call
  - id: python-telegram-account-delete-and-session-erasure
    desc: Deletes a Telegram account and erases its session vault
    crit: hostile
    conf: 0.98
    attack: T1531,T1485
    scope: leaf
    all:
      - id: python-telegram-account-delete-using-vault
      - id: micro-behaviors/fs/delete/file/library::pathlib-unlink
