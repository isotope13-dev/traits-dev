defaults:
  for: [ne]
  platforms: [windows]

traits:
  - id: windows-startup-short-path
    desc: Targets Windows Startup folder executable path
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: '[a-z]:\\windows\\startm~1\\programs\\startup\\[^\\]{1,24}\.exe'

  - id: windows-system-exe-target-list
    desc: Enumerates dozens of Windows system executables
    crit: suspicious
    conf: 0.93
    count_min: 15
    if:
      type: text
      case_insensitive: true
      regex: 'c:\\windows\\[a-z0-9_]{3,12}\.exe'

  - id: win16-destructive-profanity-banner
    desc: Displays destructive system-compromise profanity
    crit: notable
    conf: 0.90
    if:
      type: text
      case_insensitive: true
      regex: 'computer is (fucking )?(screwed|dead|wiped)'

composite_rules:
  - id: win16-windows-system-wiper
    desc: Win16 trojan persists in Startup and targets Windows binaries
    crit: hostile
    conf: 0.97
    attack: T1485,T1547.001
    all:
      - id: windows-startup-short-path
      - id: windows-system-exe-target-list
      - id: win16-destructive-profanity-banner
