defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1485,T1562.001,T1027

traits:
  - id: managed-resource-solution-source-wiper
    desc: UI library loads embedded source-wiping code
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule managed_resource_solution_source_wiper {
          strings:
            $wipe = "EmptyAllCSFiles" wide
            $close = "CLOSEVS" wide
            $visual = "IsVisualStudioOpen" wide
            $solution = ".sln" wide nocase
            $archive = /resources\/[a-z0-9_.-]+\.zip/ wide nocase
            $batch = /\\[a-z0-9_.-]+\.bat/ wide nocase
            $extract = "ExtractToDirectory" ascii
            $load = "LoadFrom" ascii
            $invoke = "InvokeMember" ascii
          condition:
            uint16(0) == 0x5a4d and all of them
        }
  - id: managed-source-wiper-ide-termination
    desc: Managed code empties source and stops IDE
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule managed_source_wiper_ide_termination {
          strings:
            $method = "EmptyAllCSFiles" ascii
            $source = "*.cs" wide
            $write = "WriteAllText" ascii
            $files = "GetFiles" ascii
            $ide = "devenv" wide nocase
            $process = "GetProcessesByName" ascii
            $kill = "Kill" ascii
          condition:
            uint16(0) == 0x5a4d and all of them
        }
