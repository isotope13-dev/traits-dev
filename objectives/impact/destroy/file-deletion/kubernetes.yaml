# Cluster-wide host-root destruction via a privileged Kubernetes workload.
# The atoms intentionally describe structure and behavior rather than the
# CanisterWorm names, paths, or C2 infrastructure so renamed variants match.
defaults:
  platforms: [unix]
  for: [scripts, source]
  attack: T1485,T1611

composite_rules:
  - id: privileged-daemonset-host-root-wiper
    desc: Privileged DaemonSet wipes host root
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/os/container/runtime::daemonset-workload-spec
      - id: micro-behaviors/os/container/runtime::privileged-pod-spec
      - id: micro-behaviors/os/container/runtime::host-root-hostpath-volume
      - id: micro-behaviors/fs/directory/traverse::top-level-tree-recursive-delete
    near_lines: 100
    unless:
      - id: well-known/tool/detection/threat-intel/
