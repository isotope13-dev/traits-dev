# An auto-run macro that empties several hard-coded folders (`Kill
# "C:\...\*.*"`) destroys user or application files when a document opens.
defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  attack: T1485

composite_rules:
  - id: vba-autorun-empties-several-folders
    desc: Auto-run macro deletes all files in folders
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/application/hook/event::vba-auto-open-sub-decl
      - id: micro-behaviors/fs/delete/file/command::vba-kill-wildcard-several-folders
