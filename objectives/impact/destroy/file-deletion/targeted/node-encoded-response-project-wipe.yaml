defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1195.002,T1485
traits:
- id: js-axios-response-code-202
  desc: Checks remote response code 202
  crit: notable
  if:
    type: text
    regex: data\.code\s*==\s*202
- id: js-axios-post-secret-identity
  desc: Sends secret and identity using Axios
  crit: suspicious
  if:
    type: text
    regex: '(?s)axios\s*\(\s*\{.{0,400}method:\s*["'']post["''].{0,120}customUserId:.{0,250}secretKey:'
- id: js-unicode-encoded-node-env
  desc: Checks Unicode-escaped Node environment name
  crit: notable
  if:
    type: text
    substr: \u004e\u004f\u0044\u0045\u005f\u0045\u004e\u0056
