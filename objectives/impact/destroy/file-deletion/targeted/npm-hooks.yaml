defaults:
  platforms:
  - windows
  - unix
  for:
  - package.json
  - shell
  attack: T1485
traits:
- id: rm-s-q
  desc: rm slash-s slash-q command
  crit: suspicious
  conf: 0.92
  if:
    type: text
    substr: rm /s /q
composite_rules:
- id: destructive-install-hook
  desc: Destructive npm install hook
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/execution/interpreter/script/npm/
  - id: objectives/impact/destroy/file-deletion/recursive::destructive-payload-present
- id: destructive-test-script
  for:
  - packagejson
  desc: Destructive npm test script
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/package/scripts/develop::has-test-script
  - id: objectives/impact/destroy/file-deletion/recursive::destructive-payload-present
