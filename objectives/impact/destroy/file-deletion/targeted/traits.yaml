defaults:
  attack: T1485
  mbc: C0047
  platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - macho
  - pe
traits:
- id: deleteSelf-function
  desc: deleteSelf object-lifecycle symbol
  crit: notable
  conf: 0.85
  if:
    type: symbol
    substr: deleteSelf
  unless:
  - type: symbol
    regex: gl::Program::deleteSelf
  - type: symbol
    regex: grpc/internal/(channelz|transport).*deleteSelf
  - type: symbol
    regex: grpc_internal_(channelz|transport).*deleteSelf
  - type: symbol
    regex: Aggregation.{0,8}Aggregate.{0,12}deleteSelf
  downgrade:
    any:
    - id: metadata/binary/layout/size::massive-executable
- id: punishment-piracy-message
  desc: Anti-piracy punishment threat message
  crit: suspicious
  conf: 0.95
  for:
  - pe
  if:
    type: text
    regex: \bpiracy\b.{0,40}\bdeserve\b
    case_insensitive: true
- id: punishment-deserve-threat-harm
  desc: Punishment harm threat in binary
  crit: notable
  conf: 0.9
  for:
  - pe
  if:
    type: text
    regex: \byou deserve\b.{0,20}(punish|destroy|delet)
    case_insensitive: true
- id: punishment-deserve-threat-wipe
  desc: Punishment wipe threat in binary
  crit: notable
  conf: 0.9
  for:
  - pe
  if:
    type: text
    regex: \byou deserve\b.{0,20}(format|wipe)
    case_insensitive: true
- id: encoded-rm-binary-path
  desc: Obfuscated /bin/rm delete path
  crit: suspicious
  conf: 0.9
  platforms:
  - unix
  for:
  - shell
  - python
  - perl
  - ruby
  - php
  - javascript
  - elf
  - macho
  if:
    type: encoded
    regex: /bin/rm(\b|$)
  unless:
  - id: metadata/file/format/source-map::sourcemap-inline-base64
  - type: text
    substr: /bin/rm
- id: kamikaze-wiper-ref
  desc: Kamikaze wiper script reference
  crit: suspicious
  conf: 0.8
  if:
    type: text
    word: kamikaze.sh
- id: exe-gho-bak-allowed-list
  desc: Ordered .exe/.gho/.bak allow-list cluster
  crit: component
  conf: 0.9
  platforms:
  - windows
  for:
  - pe
  if:
    type: text
    regex: (?i)\.exe\b[^b\n]{0,128}\.gho\b[^b\n]{0,128}\.bak\b
composite_rules:
- id: helpctr-system32-file-deletion
  desc: Deletes Windows System32 files via Help Center
  crit: hostile
  conf: 0.99
  platforms:
  - windows
  for:
  - html
  all:
  - id: micro-behaviors/communications/url/scheme::hcp-uplddrvinfo-file-query
  - id: micro-behaviors/fs/path/system/runtime::windows-system32
- id: wsh-copy-then-delete-as-txt
  desc: Copies a file to txt then deletes it
  crit: hostile
  conf: 0.94
  platforms:
  - windows
  for:
  - vbs
  - javascript
  - text
  - static-lib
  near_lines: 12
  all:
  - id: objectives/impact/destroy/file-deletion/recursive::wsh-copyfile-txt-suffix
  - id: micro-behaviors/fs/delete/file/library::wsh-deletefile-call
- id: punishment-threat-any
  desc: Punishment or threatening message
  crit: notable
  conf: 0.9
  any:
  - id: objectives/impact/destroy/file-deletion/targeted::punishment-piracy-message
  - id: objectives/impact/destroy/file-deletion/targeted::punishment-deserve-threat-harm
  - id: objectives/impact/destroy/file-deletion/targeted::punishment-deserve-threat-wipe
- id: delphi-padding-file-deleter
  desc: Delphi trojan with padding obfuscation and file deletion
  crit: hostile
  conf: 0.94
  attack: T1485,T1027
  for:
  - pe
  platforms:
  - windows
  size_min: 8192
  size_max: 131072
  all:
  - id: metadata/lang/compiler/managed::borland-rtl-regkey
  - id: micro-behaviors/fs/delete/file/library::deletefile-a
  - id: metadata/binary/layout/padding::paddingxxpadding-filler
  any:
  - id: micro-behaviors/process/create/subprocess/reference::create-process-a-api-reference
  - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  unless:
  - id: metadata/installer/product/
