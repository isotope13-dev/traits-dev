# Workspace file relocation and rewrite operations are unusual for an editor
# extension and can destroy or alter user content when the input path is
# attacker-controlled.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1485,T1565.001

composite_rules:
  - id: vscode-extension-workspace-file-relocation
    desc: Extension relocates and rewrites workspace files
    crit: suspicious
    conf: 0.96
    # Pair near_bytes with near_lines: minified extension bundles are only a few
    # lines, so a line-based window spans the entire bundle and matches unrelated
    # modules. 8KB covers a genuine single file-relocation routine.
    near_lines: 80
    near_bytes: 8192
    all:
      - id: well-known/lib/development/vscode::workspace-folders
      - id: metadata/permission/workspace::workspace-findFiles
      - id: micro-behaviors/fs/file/open::vscode-open-text-document
      - id: micro-behaviors/fs/write/content::vscode-workspace-apply-edit
      - id: micro-behaviors/fs/file/copy::fs-copyfile
      - id: micro-behaviors/fs/delete/file/library::promises-unlink
