defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
composite_rules:
  # Reviewed dispatch: GHO/gho and BAK/bak comparisons converge on
  # DeleteFileA, while executable candidates take the separate joiner branch.
  # The table or the deletion API alone establishes neither target nor abuse.
  - id: drive-backup-suffix-deletion
    desc: Drive walker deletes BAK and Ghost-image backups
    crit: hostile
    conf: 0.97
    attack: T1485
    all:
      - id: micro-behaviors/fs/search/name::x86-four-suffix-shared-action
      - id: micro-behaviors/fs/path/extension::executable-and-backup-filter-table
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
      - id: micro-behaviors/fs/enumerate/drives::get-logical-drives-text
