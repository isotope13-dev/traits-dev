defaults:
  platforms: [windows, unix]
  for:
    - package.json
    - shell
traits:
  # NOTE: "package defines test script" is a neutral capability, not destroy
  # intent — relocated to metadata/package/scripts/develop::has-test-script. The
  # destructive-test-script composite below references it cross-tier.
  - id: no-preserve-root
    desc: no-preserve-root deletion option text
    crit: notable
    conf: 1.0
    attack: T1485
    # The flag exists only to switch off the guard GNU rm added to stop
    # `rm -rf /`, so it is worth seeing wherever it appears -- including in a
    # command string embedded in another language, or in a patch (text).
    for: [package.json, shell, scripts, source, text]
    if:
      type: text
      substr: --no-preserve-root
    unless:
      - id: metadata/package/files/system-package::shell-completion-script
  - id: sudo-rm-rf-root
    desc: sudo rm -rf root path
    crit: suspicious
    conf: 0.98
    attack: T1485
    # Match an executable shell command, not prose or XML/HTML examples.
    for: [shell]
    if:
      type: text
      regex: '(?m)^[\t ]*sudo\s+rm\s+-rf\s+(--no-preserve-root\s+)?(/\*|/)(\s|$|["''])'
    not:
      - substr: "might cause the shell to execute 'sudo rm -rf /'"
      - substr: "when the prompt is drawn."
      - substr: "raw ref name must not be included in PS1"
    unless:
      - id: well-known/tool/development/editor/cmder::vendor-member
  - id: test-rm-rf-root
    desc: test script wipes root path
    crit: suspicious
    conf: 0.97
    attack: T1485
    for:
      - package.json
    if:
      type: value
      path: scripts.test
      regex: ^sudo?\s*rm\s+-rf\s+/\*$
  - id: rm-s-q
    desc: rm slash-s slash-q command
    crit: suspicious
    conf: 0.92
    attack: T1485
    if:
      type: text
      substr: rm /s /q
composite_rules:
  - id: destructive-payload-present
    desc: destructive install payload present
    crit: suspicious
    conf: 0.96
    any:
      - id: sudo-rm-rf-root
      - id: test-rm-rf-root
      - id: rm-s-q
  - id: filesystem-root-wipe
    for: [shell]
    desc: Filesystem root wipe command
    crit: hostile
    conf: 0.99
    attack: T1485
    mbc: C0047
    all:
      - id: no-preserve-root
      - id: sudo-rm-rf-root
      - id: objectives/execution/interpreter/script/npm/
  - id: destructive-install-hook
    desc: Destructive npm install hook
    crit: hostile
    conf: 0.98
    attack: T1485
    all:
      - id: objectives/execution/interpreter/script/npm/
      - id: destructive-payload-present
  - id: destructive-test-script
    for: [packagejson]
    desc: Destructive npm test script
    crit: hostile
    conf: 0.99
    attack: T1485
    all:
      - id: metadata/package/scripts/develop::has-test-script
      - id: destructive-payload-present
