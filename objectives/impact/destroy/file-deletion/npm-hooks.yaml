defaults:
  platforms: [windows, unix]
  for:
    - package.json
    - shell
traits:
  # NOTE: "package defines test script" is a neutral capability, not destroy
  # intent — relocated to metadata/package/scripts/develop::has-test-script. The
  # destructive-test-script composite below references it cross-tier.
  - id: sudo-rm-rf-root
    desc: sudo rm -rf root path
    crit: suspicious
    conf: 0.98
    attack: T1485
    # Match an executable shell command, not prose or XML/HTML examples.
    for: [shell]
    if:
      type: text
      regex: '(?m)^[\t ]*sudo\s+rm\s+-rf\s+(--no-preserve-root\s+)?(/\*|/)(\s|$|["''])'
    not:
      - substr: "might cause the shell to execute 'sudo rm -rf /'"
      - substr: "when the prompt is drawn."
      - substr: "raw ref name must not be included in PS1"
    unless:
      - id: metadata/package/testing/corpus/labeled::python-guardrail-signature-module
  - id: test-rm-rf-root
    desc: test script wipes root path
    crit: suspicious
    conf: 0.97
    attack: T1485
    for:
      - package.json
    if:
      type: value
      path: scripts.test
      regex: ^sudo?\s*rm\s+-rf\s+/\*$
  - id: rm-s-q
    desc: rm slash-s slash-q command
    crit: suspicious
    conf: 0.92
    attack: T1485
    if:
      type: text
      substr: rm /s /q
composite_rules:
  - id: destructive-payload-present
    desc: destructive install payload present
    crit: suspicious
    conf: 0.96
    any:
      - id: sudo-rm-rf-root
      - id: test-rm-rf-root
      - id: rm-s-q
  - id: filesystem-root-wipe
    for: [shell]
    desc: Filesystem root wipe command
    crit: hostile
    conf: 0.99
    attack: T1485
    mbc: C0047
    all:
      - id: metadata/lang/source/syntax/command/options::no-preserve-root
      - id: sudo-rm-rf-root
      - id: objectives/execution/interpreter/script/npm/
  - id: destructive-install-hook
    desc: Destructive npm install hook
    crit: hostile
    conf: 0.98
    attack: T1485
    all:
      - id: objectives/execution/interpreter/script/npm/
      - id: destructive-payload-present
  - id: destructive-test-script
    for: [packagejson]
    desc: Destructive npm test script
    crit: hostile
    conf: 0.99
    attack: T1485
    all:
      - id: metadata/package/scripts/develop::has-test-script
      - id: destructive-payload-present
  # A dependency's install script resolving the installing project's root
  # (INIT_CWD, or parent hops out of node_modules/<pkg>) and deleting that
  # project's package.json with its install state. The package's own files
  # live under __dirname; package.json at the consumer root is not its own.
  - id: consumer-root-manifest-deletion
    desc: Script deletes manifest under consumer project root
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript]
    scope: file
    all:
      - id: micro-behaviors/fs/delete/target::package-json-deletion
    any:
      - id: micro-behaviors/os/env/read/named::npm-init-cwd-read
      - id: micro-behaviors/fs/path/self::script-dir-ancestor-path
      - id: micro-behaviors/fs/path/self::script-dir-ancestor-path-segments
  - id: install-hook-deletes-consumer-manifest
    desc: Install hook deletes consumer package manifest
    crit: hostile
    conf: 0.95
    attack: T1485,T1195.002
    for: [zip, npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::node-install-hook-local-script
      - id: consumer-root-manifest-deletion
