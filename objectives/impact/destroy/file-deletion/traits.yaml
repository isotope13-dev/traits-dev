defaults:
  attack: T1485
  mbc: C0047
  platforms:
  - linux
  - macos
  - windows
  for: [elf, macho, pe]
traits:
- id: deleteSelf-function
  desc: deleteSelf object-lifecycle symbol
  # A symbol literally named deleteSelf is overwhelmingly C++ object-lifecycle
  # management (an object freeing itself), not executable self-deletion. The
  # ever-growing unless list below (OpenGL, gRPC, Qt Aggregation) confirms the
  # benign-collision rate; the real evasion signal is the move-to-temp/delete
  # behaviour, not a method name. Notable, not suspicious.
  crit: notable
  conf: 0.85
  if:
    type: symbol
    substr: deleteSelf
  unless:
  - type: symbol
    regex: 'gl::Program::deleteSelf'
  - type: symbol
    regex: 'grpc/internal/(channelz|transport).*deleteSelf'
  - type: symbol
    regex: 'grpc_internal_(channelz|transport).*deleteSelf'
  - type: symbol
    regex: 'Aggregation.{0,8}Aggregate.{0,12}deleteSelf'
  downgrade:
    any:
        # Large infrastructure binaries (e.g. service mesh) have gRPC internal deleteSelf cleanup methods
    - id: metadata/binary/layout/size::massive-executable
- id: explicit-file-deletion-warning-destroyed
  desc: "Explicit warning of file/data deletion"
  crit: notable
  conf: 0.95
  for: [elf, macho, pe, vbs, javascript, powershell, batch]
  if:
    type: text
    regex: '\b(files|data|documents)\b.{0,24}\b(will be|are)\b.{0,20}\bdestroyed\b'
    case_insensitive: true
  not:
  - regex: '(?i)\b(never|not|nothing|no)\b.{0,20}\bdestroyed\b'
  - regex: (?i)\bdata on the (usb|removable|target|selected) disk will be destroyed\b
  - regex: (?i)\ball data on the (usb|removable|target|selected) disk will be destroyed\b
  - regex: (?i)deleting a team project is an irrecoverable operation
  unless:
  - id: metadata/binary/resource/
- id: explicit-file-deletion-warning-wipe
  desc: Explicit warning of data wiping
  # A warning string is useful triage context but does not prove destructive
  # behavior; the hostile composite separately requires a file-delete API.
  crit: notable
  conf: 0.95
  for: [elf, macho, pe, vbs, javascript, powershell, batch]
  if:
    type: text
    # The object is the victim's data as a whole ('all your files'); 'all
    # preexisting data in the specified table' is a GDAL driver option.
    regex: \bwipe[a-z]{0,3}\b.{0,80}\b(your|all)(\s+(your|the|of))?\s+(files|data|documents)\b
    case_insensitive: true
  unless:
  - id: well-known/app/finance/go-ethereum::go-ethereum-tool
  - id: well-known/app/productivity/silverbullet::official-silverbullet-context
- id: explicit-file-deletion-warning-erase
  desc: Explicit warning of file/data deletion (erase)
  crit: notable
  conf: 0.95
  for: [elf, macho, pe, vbs, javascript, powershell, batch]
  if:
    type: text
    regex: \berase[a-z]{0,3}\b.{0,80}\b(your|all\s+your)\b.{0,20}\b(files|data|documents)\b
    case_insensitive: true
  unless:
  - type: text
    substr: "you are about to erase all data from the following device"
    case_insensitive: true
  - type: text
    substr: "are you sure you want to erase all data"
    case_insensitive: true
  downgrade:
    any:
    - id: metadata/binary/linking/static/
- id: punishment-piracy-message
  desc: Anti-piracy punishment threat message
  crit: suspicious
  conf: 0.95
  for: [pe]
  if:
    type: text
    regex: \bpiracy\b.{0,40}\bdeserve\b
    case_insensitive: true
- id: punishment-deserve-threat-harm
  desc: Punishment harm threat in binary
  crit: notable
  conf: 0.9
  for: [pe]
  if:
    type: text
    regex: \byou deserve\b.{0,20}(punish|destroy|delet)
    case_insensitive: true
- id: punishment-deserve-threat-wipe
  desc: Punishment wipe threat in binary
  crit: notable
  conf: 0.9
  for: [pe]
  if:
    type: text
    regex: \byou deserve\b.{0,20}(format|wipe)
    case_insensitive: true
- id: overwrite-with-question-mark
  desc: 'overwrite with question mark'
  crit: suspicious
  conf: 0.9
  for:
  - pe
  - csharp
  if:
    type: text
    regex: WriteAllText\(.{0,100},\s*"\?"\)

- id: unix-root-rm-no-preserve-source-literal
  desc: Unix root rm no-preserve source literal
  crit: notable
  conf: 0.95
  platforms: [unix]
  for: [source]
  if:
    type: string_literal
    regex: '\brm\s+-rf\s+/\s+--no-preserve-root\b'

- id: unix-root-rm-no-preserve-script-text
  desc: Unix root rm no-preserve script text
  crit: notable
  conf: 0.93
  platforms: [unix]
  for: [scripts]
  if:
    type: text
    regex: '\brm\s+-rf\s+/\s+--no-preserve-root\b'

- id: unix-root-rm-no-preserve-binary-string
  desc: Unix root rm no-preserve binary string
  crit: notable
  conf: 0.95
  platforms: [unix]
  for: [binaries]
  if:
    type: text
    regex: '\brm\s+-rf\s+/\s+--no-preserve-root\b'
  unless:
  - id: micro-behaviors/process/create/shell/guard::ai-cli-destructive-command-deny-rules
  - id: well-known/tool/detection/innerwarden::innerwarden-defensive-tool-context

- id: unix-root-rm-binary-string
  desc: Native binary root-filesystem rm command
  crit: notable
  conf: 0.96
  platforms: [unix]
  for: [elf, macho]
  if:
    type: text
    # `/(\*|\s|$)` also catches the `rm -rf /*` glob form, not just bare `/`.
    regex: '(?i)\brm\s+-rf\s+/(\*(\s|$|[;&|)"''])|\s|$)'
  unless:
  - id: well-known/tool/detection/watchmen::watchmen-cli-context
  - id: micro-behaviors/process/create/shell/guard::ai-cli-destructive-command-deny-rules

- id: unix-root-rm-glob
  desc: Root filesystem wipe (rm -rf /*)
  crit: suspicious
  conf: 0.95
  platforms: [unix]
  # A root wipe is destructive wherever it runs, so this covers scripts *and*
  # source — the latter so a misdetected script (a Gentoo `.ebuild` read as
  # Kotlin) can't hide the command. Binaries are caught above.
  for: [scripts, source]
  if:
    type: text
    # `rm -rf /*` — the glob expands to every top-level entry, so unlike a bare
    # `rm -rf /` (which rm refuses without --no-preserve-root) this one runs and
    # wipes the host. Require a shell command boundary so quoted safety guidance
    # and comments in bundled source are not treated as executable commands.
    # `Bash(rm -rf /*)` is a Claude Code permission pattern, not a wipe.
    # Subshell/command-substitution forms still match via `^\(` / `\s\(` / `$(`.
    regex: '(?i)(^|[\n;&|)]|(^|\s)\(|\$\()\s*(sudo\s+)?rm\s+-[a-z]*(rf|fr)[a-z]*\s+/\*(\s|$|[;&|)"''])'
  unless:
    - id: well-known/lib/native/uclibc::static-uclibc-string-tables
    - id: metadata/package/testing/harness/unit::rust-test
    - id: "metadata/file/naming::test-directory-component"
    - id: micro-behaviors/process/create/shell/guard/
    - id: metadata/file/policy/identity::agent-tool-permission-ruleset

- id: encoded-rm-binary-path
  desc: Obfuscated /bin/rm delete path
  # The delete binary recovered from a decoder — base64 (`base64 -d <<< …`),
  # hex, xor, a stack string — not from plain source. gentoo-systemd's
  # `configure` hid `/bin/rm` in `base64 -d <<< L2Jpbi9ybQo=`, then `exec`'d it
  # against `$HOME`. A build script that has to *encode* `/bin/rm` to name it is
  # hiding intent, so this is suspicious wherever the encoded string is found;
  # `type: encoded` never sees a plainly-written path, so a normal `rm` in a
  # Makefile can't trip it. Omitting `encoding:` covers every decoder.
  crit: suspicious
  conf: 0.9
  platforms: [unix]
  # The decoder-hiding droppers that do this are shells and the scripting
  # languages that shell out, plus native binaries — narrowed to stay under the
  # type:encoded file-type cap.
  for: [shell, python, perl, ruby, php, javascript, elf, macho]
  if:
    type: encoded
    regex: '/bin/rm(\b|$)'
  unless:
  # Inline source maps are themselves Base64 containers and can faithfully
  # preserve ordinary build/cleanup source containing /bin/rm. The map is
  # debug metadata, not a runtime decoder hiding the executable path.
  - id: metadata/file/format/source-map::sourcemap-inline-base64
  # The same file already names /bin/rm in cleartext, so the path is not hidden.
  - type: text
    substr: '/bin/rm'

- id: shell-variable-recursive-home-delete
  desc: Variable-selected recursive home delete
  # Indirection alone is ordinary in portable scripts, and recursive cleanup
  # beneath a specific cache directory can be legitimate.  Selecting the
  # executable through a variable and handing it recursive/force flags against
  # an entire home alias is a strong destructive behavior, but remains
  # suspicious until paired with evidence that the selected tool was hidden.
  crit: suspicious
  conf: 0.94
  platforms: [unix]
  for: [shell]
  if:
    type: text
    regex: '(?m)^\s*(exec\s+)?\$\{?\w+\}?\s+-\w*(rf|fr)\w*\s+.{0,160}(\$\{?HOME\}?|~/)'


- id: kamikaze-wiper-ref
  desc: Kamikaze wiper script reference
  crit: suspicious
  conf: 0.8
  if:
    type: text
    word: "kamikaze.sh"

- id: mount-host-filesystem
  desc: Mounts host root filesystem (wiper indicator)
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: mount\s+/dev/\S+\s+/mnt/host
- id: exe-gho-bak-allowed-list
  desc: Ordered .exe/.gho/.bak allow-list cluster
  crit: component
  conf: 0.9
  platforms: [windows]
  for: [pe]
  if:
    type: text
    regex: '(?i)\.exe\b[^b\n]{0,128}\.gho\b[^b\n]{0,128}\.bak\b'

- id: wsh-copyfile-txt-suffix
  desc: CopyFile destination ends in txt
  crit: suspicious
  conf: 0.9
  platforms: [windows]
  for: [vbs, javascript, text, static-lib]
  if:
    type: text
    regex: '(?i)\.CopyFile\b[^\r\n]{0,80}\.txt'
  not:
    # camelCase copyFile member (Deno/Node/browser), not WSH CopyFile.
    - regex: '\.copyFile\b'

composite_rules:
- id: wsh-copy-then-delete-as-txt
  desc: Copies a file to txt then deletes it
  crit: hostile
  conf: 0.94
  platforms: [windows]
  for: [vbs, javascript, text, static-lib]
  all:
  - id: wsh-copyfile-txt-suffix
  - id: micro-behaviors/fs/delete/file/library::wsh-deletefile-call
- id: unix-root-rm-no-preserve-command
  desc: Unix root rm no-preserve command
  crit: notable
  conf: 0.96
  platforms: [unix]
  for: [scripts, source, binaries]
  any:
  - id: unix-root-rm-no-preserve-source-literal
  - id: unix-root-rm-no-preserve-script-text
  - id: unix-root-rm-no-preserve-binary-string
- id: unix-root-rm-command
  desc: Unix root filesystem rm command
  crit: notable
  conf: 0.96
  platforms: [unix]
  for: [scripts, source, binaries]
  any:
  - id: unix-root-rm-no-preserve-command
  - id: unix-root-rm-binary-string
  - id: unix-root-rm-glob
- id: unix-hostile-wiper
  desc: Unix destructive wiper behavior
  crit: suspicious
  conf: 0.95
  any:
  - id: unix-root-rm-command
  - id: kamikaze-wiper-ref
  - id: mount-host-filesystem
  unless:
  # `Bash(rm -rf /*)` in a coding-agent permission ruleset is the command the
  # harness refuses, not one it runs. unix-root-rm-binary-string cannot require
  # a shell-command boundary the way unix-root-rm-glob does, because a binary's
  # string table has no separators, so suppress on the ruleset context instead.
  - id: metadata/file/policy/identity::agent-tool-permission-ruleset
  - id: micro-behaviors/process/create/shell/guard/
  - id: well-known/app/ai/coding-agent/
- id: obfuscated-home-directory-wiper
  desc: Obfuscated command recursively wipes a user home directory
  crit: hostile
  conf: 0.98
  attack: T1027,T1485
  platforms: [unix]
  for: [shell]
  near_bytes: 2048
  all:
  - id: encoded-rm-binary-path
  - id: shell-variable-recursive-home-delete
- id: explicit-file-deletion-warning-all
  desc: Explicit warning of file/data deletion
  crit: notable
  conf: 0.95
  for: [elf, macho, pe, vbs, javascript, powershell, batch]
  any:
  - id: micro-behaviors/ui/dialog/error::file-deletion-warning
  - id: micro-behaviors/ui/dialog/error::data-destruction-warning
  - id: explicit-file-deletion-warning-destroyed
  - id: explicit-file-deletion-warning-wipe
  - id: explicit-file-deletion-warning-erase
- id: punishment-threat-any
  desc: Punishment or threatening message
  crit: notable
  conf: 0.9
  unless:
  - id: metadata/signed/platform/
  any:
  - id: punishment-piracy-message
  - id: punishment-deserve-threat-harm
  - id: punishment-deserve-threat-wipe
- id: intentional-file-destruction
  desc: Intentional file destruction pattern
  crit: hostile
  conf: 0.9
  # delete-files-symbol is a compiled-binary-only symbol match; the script
  # alternatives cover the same "actually deletes files" evidence for
  # wmi-reboot-after-file-destruction's vbs/js/powershell/batch consumers.
  #
  # The warning leg alone says nothing about THIS code: an installer's help
  # text ("delete it and reinstall -- your agent files ...") also matches,
  # and its single logout unlinkSync sits 45KB away. Binding the warning to
  # the delete capability is what makes the combination read as destruction;
  # a wipe note and a wiper routine share the same small file.
  near_bytes: 2048
  for: [elf, macho, pe, vbs, javascript, powershell, batch]
  all:
  - id: explicit-file-deletion-warning-all
  any:
  - id: micro-behaviors/fs/delete/file/library::delete-files-symbol
  - id: micro-behaviors/fs/delete/file/command::cmd-del-command
  - id: micro-behaviors/fs/delete/file/library::fs-unlink
  - id: micro-behaviors/fs/delete/file/library::fs-unlinkSync
  - id: micro-behaviors/fs/delete/file/library::fs-rm
  - id: micro-behaviors/fs/delete/file/library::fs-rmSync
  - id: micro-behaviors/fs/delete/file/library::node-rm-sync
  unless:
  - id: well-known/app/storage/restic/
  - id: well-known/app/utility/kde-partitionmanager/
  - id: well-known/app/infrastructure/podman-desktop::pe-product-name
  # Mullvad's signed Electron host ships the uninstall copy that calls
  # fs.unlinkSync next to an explicit "this will delete" warning. The leaf
  # signer is the organisation on the Authenticode cert, not a version string.
  - id: metadata/signed/leaf::mullvad-vpn-ab
  - id: metadata/file/policy/identity::agent-tool-permission-ruleset
  - id: micro-behaviors/process/create/shell/guard/
  - id: well-known/tool/detection/ai-guardrail/
  - id: well-known/app/ai/gateway/ccs::ccs-benign-context
  - id: well-known/app/data/postgresql/
- id: pe-destructive-file-wiper
  desc: Destructive file wiper trojan
  crit: hostile
  conf: 0.95
  for: [pe]
  all:
  - id: micro-behaviors/fs/directory/readdir::find-file-walker
  - id: micro-behaviors/fs/delete/file/library::deletefile-a
  - id: punishment-threat-any
  any:
  - id: micro-behaviors/os/registry/keys::currentversion-run-key-path
  - id: micro-behaviors/fs/file/copy::copyfile-a
  - id: micro-behaviors/os/sysinfo/directories::get-system-directory
  - id: micro-behaviors/os/registry/keys::explorer-shell-folders-regpath
- id: delphi-padding-file-deleter
  desc: Delphi trojan with padding obfuscation and file deletion
  crit: hostile
  conf: 0.94
  attack: T1485,T1027
  for: [pe]
  platforms: [windows]
  size_min: 8192
  size_max: 131072
  all:
  - id: metadata/lang/compiler/managed::borland-rtl-regkey
  - id: micro-behaviors/fs/delete/file/library::deletefile-a
  - id: metadata/file/padding::paddingxxpadding-filler
  any:
  - id: micro-behaviors/process/create/spawn::create-process-a
  - id: micro-behaviors/fs/path/application/executable::cmd-exe-image-name
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: drive-wide-nonallowed-list-file-deleter
  desc: Deletes non-allowed listed files across drives
  crit: hostile
  conf: 0.97
  for: [pe]
  platforms: [windows]
  all:
  - id: micro-behaviors/fs/delete/file/library::delete-win
  - id: micro-behaviors/fs/traversal/drives::logical-drive-enumeration
  - id: objectives/impact/infect/binary/rewrite::skip-windows-install-dir
  - id: exe-gho-bak-allowed-list
  any:
  - id: micro-behaviors/dylib/library/legacy::mfc42-ref
  - id: objectives/impact/infect/binary/rewrite::ghost-image-filter

# The file-deletion face of a root wipe: an `rm` with a root-path glob. The
# build-recipe and shell-out rules convict the recipe or the caller; this one
# states the deletion itself with the recursion marker beside it, whichever
# surface dispatched it.
#
# Worked examples: the gentoo SphinxTrain ebuild (`rm -rf /` in a package
# recipe) and the kubernetes.el wipe (a quoted root-rm handed to a shell).
- id: root-glob-recursive-wipe
  desc: Root-path glob deleted recursively
  crit: hostile
  conf: 0.96
  for: [shell]
  all:
  - id: unix-root-rm-glob
  - id: micro-behaviors/fs/delete/directory::recursive-root
- id: quoted-root-wipe-shell-command
  desc: Quoted root-wipe command awaiting a shell
  crit: hostile
  conf: 0.95
  for: [text]
  all:
  - id: objectives/impact/destroy/shell-out::quoted-root-delete-request
  - id: no-preserve-root
