defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - pe
  - elf
  - macho
  attack: T1486
  mbc: B0040
traits:
- id: overwrite-then-delete-warning
  desc: overwrite then delete failure
  crit: suspicious
  conf: 0.97
  if:
    type: text
    substr: 'WARNING: overwrite succeeded but delete failed for'
- id: secure-delete-error-rust
  desc: Rust secure-delete error log
  crit: suspicious
  conf: 0.92
  if:
    type: text
    substr: ERROR secure-delete
composite_rules:
- id: secure-overwrite-delete
  desc: Secure-delete (overwrite-then-unlink) routine
  crit: suspicious
  conf: 0.97
  any:
  - id: objectives/impact/destroy/file-deletion/overwrite::overwrite-then-delete-warning
  - id: objectives/impact/destroy/file-deletion/overwrite::secure-delete-error-rust
- id: ransomware-secure-delete-encryptor
  desc: Ransomware encryptor with secure-delete
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/impact/destroy/file-deletion/overwrite::secure-overwrite-delete
  - id: objectives/impact/ransom/encrypt/extension::ransomware-target-extension-blob
