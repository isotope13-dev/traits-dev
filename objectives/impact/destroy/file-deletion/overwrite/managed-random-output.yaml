defaults:
  platforms: [windows]
  for: [pe]
  attack: T1485
composite_rules:
  # The instruction layout corroborates buffer conversion, file output and
  # suffixed renaming. Recovery sabotage supplies attack context; random
  # generation and file writes alone also occur in legitimate test tools.
  - id: managed-random-output-with-recovery-sabotage
    desc: Random file output with recovery sabotage
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/control-flow/sequence::cil-buffer-text-output-and-rename-layout
      - id: objectives/impact/degrade/system/recovery::comprehensive-recovery-inhibition
      - id: micro-behaviors/os/random/prng/stdlib::random-nextbytes
      - id: micro-behaviors/fs/write/file/full/string::dotnet-writealltext-import
      - id: micro-behaviors/fs/file/move::dotnet-file-move-import
      - id: metadata/lang/source/naming/function/file::dotnet-getfiles-method-name
