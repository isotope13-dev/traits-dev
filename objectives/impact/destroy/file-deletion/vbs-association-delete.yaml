defaults:
  for: [vbs]
  platforms: [windows]
  attack: T1485,T1546.001

traits:
  - id: vbs-command-com-delete-opened-file
    desc: VBScript invokes delete on opened file
    crit: notable
    if:
      type: text
      regex: '(?i)command\.com\s+/c\s+del\s+%1'

composite_rules:
  - id: vbs-association-open-deletes-file
    desc: VBScript makes file open handler delete its file
    crit: hostile
    conf: 0.99
    near_lines: 1
    all:
      - id: vbs-command-com-delete-opened-file
      - id: micro-behaviors/os/registry/association/reference::qualified-shell-open-command-key
      - id: micro-behaviors/os/registry/value/write::wscript-regwrite
