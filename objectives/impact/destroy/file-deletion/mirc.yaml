# A socket line parsed into a command verb (`$gettok(%line,1,32)`) that
# reaches `remove $gettok(...)` deletes the file the remote peer named:
# operator-directed destruction, not local cleanup (a static
# `remove dir.txt` stays out of both legs).
defaults:
  platforms: [unix, windows]
  for: [mirc]
  attack: T1485
composite_rules:
  - id: mirc-remote-commanded-file-delete
    desc: mIRC deletes file a socket peer names
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/command-and-control/channel/irc/client::mirc-gettok-command-parse
      - id: objectives/command-and-control/channel/irc/client::mirc-remove-remote-path
