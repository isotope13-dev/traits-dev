defaults:
  for:
  - csharp
  platforms:
  - windows
  attack: T1485
  mbc: C0047
traits:
- id: writes-batch-payloads
  desc: Writes RichTextBox batch payloads
  crit: suspicious
  conf: 0.98
  count_min: 3
  if:
    type: text
    substr: WriteAllText(saveFileDialog.FileName, this.RichTextBox
- id: mass-file-targeting-template
  desc: Recursive file targeting template burst
  crit: suspicious
  conf: 0.97
  count_min: 20
  if:
    type: text
    substr: DIR /S/B %SystemDrive%\\*.
- id: self-delete-template
  desc: Embedded self-delete batch command
  crit: suspicious
  conf: 0.94
  if:
    type: string_literal
    exact: del /f /q %0
- id: hidden-script-template
  desc: Embedded hidden batch command
  crit: suspicious
  conf: 0.94
  if:
    type: string_literal
    exact: attrib +h %0
- id: critical-hal-delete-template
  desc: Deletes HAL system library
  crit: suspicious
  conf: 0.99
  if:
    type: text
    substr: del /f /q %SystemDrive%\\WINDOWS\\system32\\hal.dll
- id: hosts-delete-template
  desc: Deletes Windows hosts file
  crit: suspicious
  conf: 0.98
  if:
    type: text
    substr: del /f /q %SystemDrive%\\WINDOWS\\system32\\drivers\\etc\\hosts
- id: destructive-format-template
  desc: Embedded destructive format template
  crit: suspicious
  conf: 0.96
  count_min: 4
  if:
    type: text
    substr: 'FORMAT drive:'
- id: user-media-delete-template
  desc: Deletes user music files
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: del /f /q .{0,32}My Music
composite_rules:
- id: password-reset-templates
  desc: Embedded account takeover batch commands
  crit: suspicious
  conf: 0.99
  all:
  - id: objectives/impact/destroy/file-deletion/targeted::reset-current-user-password
  - id: objectives/impact/destroy/file-deletion/targeted::reset-admin-password
- id: sabotage-templates
  desc: Embedded destructive system sabotage templates
  crit: suspicious
  conf: 0.98
  needs: 2
  any:
  - id: objectives/impact/destroy/file-deletion/script-builder::critical-hal-delete-template
  - id: objectives/impact/destroy/file-deletion/script-builder::hosts-delete-template
  - id: objectives/impact/destroy/file-deletion/script-builder::destructive-format-template
  - id: objectives/impact/destroy/file-deletion/script-builder::password-reset-templates
  - id: objectives/impact/destroy/file-deletion/script-builder::user-media-delete-template
- id: destructive-batch-malware-builder
  desc: Destructive batch malware builder
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/impact/destroy/file-deletion/script-builder::writes-batch-payloads
  - id: objectives/impact/destroy/file-deletion/script-builder::mass-file-targeting-template
  - id: objectives/impact/destroy/file-deletion/script-builder::sabotage-templates
  any:
  - id: objectives/impact/degrade/edr/embedded::embedded-batch-av-killer
  - id: objectives/impact/destroy/file-deletion/script-builder::hidden-script-template
  - id: objectives/impact/destroy/file-deletion/script-builder::self-delete-template
