defaults:
  for: [mirc]
  platforms: [windows]
  attack: T1485,T1027

traits:
  - id: mirc-deltree-variable
    desc: Stores deltree command in variable
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bset\s+%[A-Za-z0-9_]+\s+deltree\b'
  - id: mirc-write-deltree-batch
    desc: Writes variable command as forced deletion
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)//write\s+-c\s+[^\s]{1,120}\s+%[A-Za-z0-9_]+\s+/\s*\$\+\s*y\s+%'
  - id: mirc-rename-and-run-batch
    desc: Renames and executes generated batch file
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.rename\s+[^\n|]{1,100}\|\s*run\s+-n\s+'

composite_rules:
  - id: mirc-load-generated-deltree-command
    desc: IRC load event writes and runs forced deletion batch
    crit: hostile
    conf: 0.99
    all:
      - id: mirc-deltree-variable
      - id: mirc-write-deltree-batch
      - id: mirc-rename-and-run-batch
      - id: micro-behaviors/communications/irc/handler::mirc-load-event-handler
