defaults:
  attack: T1485
  mbc: C0047
  platforms:
    - linux
    - macos
    - windows
  for:
    - elf
    - macho
    - pe
traits:
  - id: unix-root-rm-no-preserve-source-literal
    desc: Unix root rm no-preserve source literal
    crit: notable
    conf: 0.95
    platforms:
      - unix
    for:
      - source
    if:
      type: string_literal
      regex: \brm\s+-rf\s+/\s+--no-preserve-root\b
  - id: unix-root-rm-no-preserve-script-text
    desc: Unix root rm no-preserve script text
    crit: notable
    conf: 0.93
    platforms:
      - unix
    for:
      - scripts
    if:
      type: text
      regex: \brm\s+-rf\s+/\s+--no-preserve-root\b
  - id: unix-root-rm-no-preserve-binary-string
    desc: Unix root rm no-preserve binary string
    crit: notable
    conf: 0.95
    platforms:
      - unix
    for:
      - binaries
    if:
      type: text
      regex: \brm\s+-rf\s+/\s+--no-preserve-root\b
    unless:
      - id: well-known/tool/detection/innerwarden::innerwarden-defensive-tool-context
      - id: micro-behaviors/os/security/command-policy::command-policy-implementation-context
      - id: micro-behaviors/os/security/command-policy::native-shell-permission-denylist
  - id: unix-root-rm-binary-string
    desc: Native binary root-filesystem rm command
    crit: notable
    conf: 0.96
    platforms:
      - unix
    for:
      - elf
      - macho
    if:
      type: text
      regex: (?i)\brm\s+-rf\s+/(\*(\s|$|[;&|)"'])|\s|$)
    unless:
      - id: well-known/tool/detection/watchmen::watchmen-cli-context
      - id: micro-behaviors/os/security/command-policy::command-policy-implementation-context
      - id: micro-behaviors/os/security/command-policy::native-shell-permission-denylist
      - id: micro-behaviors/os/security/command-policy::packed-destructive-shell-command-table
      - id: metadata/package/testing/corpus/injection-inputs::native-fuzz-injection-payload-table
  - id: shell-variable-recursive-home-delete
    desc: Variable-selected recursive home delete
    crit: suspicious
    conf: 0.94
    platforms:
      - unix
    for:
      - shell
    if:
      type: text
      regex: (?m)^\s*(exec\s+)?\$\{?\w+\}?\s+-\w*(rf|fr)\w*\s+.{0,160}(\$\{?HOME\}?|~/)
  - id: mount-host-filesystem
    desc: Mounts host root filesystem (wiper indicator)
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: mount\s+/dev/\S+\s+/mnt/host
  - id: wsh-copyfile-txt-suffix
    desc: CopyFile destination ends in txt
    crit: notable
    conf: 0.9
    platforms:
      - windows
    for:
      - vbs
      - javascript
      - text
      - static-lib
    if:
      type: text
      regex: (?i)\.CopyFile\b[^\r\n,]{1,80},[^\r\n]{0,80}\.txt
    not:
      - regex: \.copyFile\b
      - regex: \.copyfile\b
    unless:
      - id: metadata/path/directory::test-directory-component
composite_rules:
  - id: unix-root-rm-no-preserve-command
    desc: Unix root rm no-preserve command
    crit: notable
    conf: 0.96
    platforms:
      - unix
    for:
      - scripts
      - source
      - binaries
    any:
      - id: objectives/impact/destroy/file-deletion/recursive::unix-root-rm-no-preserve-source-literal
      - id: objectives/impact/destroy/file-deletion/recursive::unix-root-rm-no-preserve-script-text
      - id: objectives/impact/destroy/file-deletion/recursive::unix-root-rm-no-preserve-binary-string
  - id: unix-root-rm-command
    desc: Unix root filesystem rm command
    crit: notable
    conf: 0.96
    platforms:
      - unix
    for:
      - scripts
      - source
      - binaries
    any:
      - id: objectives/impact/destroy/file-deletion/recursive::unix-root-rm-no-preserve-command
      - id: objectives/impact/destroy/file-deletion/recursive::unix-root-rm-binary-string
      - id: micro-behaviors/fs/delete/directory::recursive-root
  - id: unix-hostile-wiper
    desc: Unix destructive wiper behavior
    crit: suspicious
    conf: 0.95
    any:
      - id: objectives/impact/destroy/file-deletion/recursive::unix-root-rm-command
      - id: objectives/impact/destroy/file-deletion/targeted::kamikaze-wiper-ref
      - id: objectives/impact/destroy/file-deletion/recursive::mount-host-filesystem
    unless:
      - id: well-known/tool/detection/pattern-catalog::dangerous-command-exec-gateway
      - id: micro-behaviors/os/security/command-policy::command-policy-implementation-context
      - id: micro-behaviors/os/security/command-policy::native-shell-permission-denylist
      - id: micro-behaviors/os/security/command-policy::packed-destructive-shell-command-table
      - id: micro-behaviors/os/security/command-policy::destructive-command-string-classifier
  - id: obfuscated-home-directory-wiper
    desc: Obfuscated command recursively wipes a user home directory
    crit: hostile
    conf: 0.98
    attack: T1027,T1485
    platforms:
      - unix
    for:
      - shell
    near_bytes: 2048
    all:
      - id: objectives/impact/destroy/file-deletion/targeted::encoded-rm-binary-path
      - id: objectives/impact/destroy/file-deletion/recursive::shell-variable-recursive-home-delete
  - id: pe-destructive-file-wiper
    desc: Destructive file wiper trojan
    crit: hostile
    conf: 0.95
    for:
      - pe
    all:
      - id: micro-behaviors/fs/directory/readdir/native::find-file-walker
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
      - id: objectives/impact/destroy/file-deletion/targeted::punishment-threat-any
    any:
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path
      - id: micro-behaviors/fs/file/copy/call::copyfile-a
      - id: micro-behaviors/os/sysinfo/directories::get-system-directory
      - id: micro-behaviors/os/registry/explorer/reference::explorer-shell-folders-regpath
  - id: quoted-root-wipe-shell-command
    desc: Quoted root-wipe command awaiting a shell
    crit: hostile
    conf: 0.95
    for:
      - text
    unless:
      - id: metadata/package/testing/corpus/labeled::labeled-shell-risk-command-data
    all:
      - id: objectives/impact/destroy/shell-out::quoted-root-delete-request
      - id: metadata/lang/source/syntax/command/options::no-preserve-root
