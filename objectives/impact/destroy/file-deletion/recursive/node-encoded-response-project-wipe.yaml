defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1195.002,T1485
traits:
- id: js-recursive-unlink-rmdir
  desc: Recursively unlinks files and directories
  crit: suspicious
  if:
    type: text
    regex: (?s)fs\.readdirSync\(path\).{0,400}fs\.unlinkSync\(curPath\).{0,100}fs\.rmdirSync\(path\)
- id: js-wipe-project-directory-list
  desc: Removes project and repository directories
  crit: suspicious
  if:
    type: text
    regex: (?s)thanks\(["']\./src.{0,100}thanks\(["']\./public.{0,100}thanks\(["']\./\.git
composite_rules:
- id: node-encoded-response-project-wipe
  desc: Attempts remote-triggered project directory wipe
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: objectives/impact/destroy/file-deletion/targeted::js-axios-response-code-202
  - id: objectives/impact/destroy/file-deletion/recursive::js-recursive-unlink-rmdir
  - id: objectives/impact/destroy/file-deletion/recursive::js-wipe-project-directory-list
  - id: objectives/impact/destroy/file-deletion/targeted::js-axios-post-secret-identity
  - id: objectives/impact/destroy/file-deletion/targeted::js-unicode-encoded-node-env
