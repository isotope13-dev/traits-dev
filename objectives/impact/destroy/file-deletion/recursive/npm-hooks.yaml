defaults:
  platforms:
  - windows
  - unix
  for:
  - package.json
  - shell
traits:
- id: sudo-rm-rf-root
  downgrade:
    scope: archive
    any:
      - id: well-known/tool/detection/agent/cc-audit::cc-audit-source-package-identity
      - id: metadata/package/testing/compiled::go-compiled-test-binary
  desc: sudo rm -rf root path
  crit: suspicious
  conf: 0.98
  attack: T1485
  for:
  - shell
  if:
    type: text
    encoding: none
    regex: (?m)^[\t ]*sudo\s+rm\s+-rf\s+(--no-preserve-root\s+)?(/\*|/)(\s|$|["'])
  unless:
  - id: metadata/package/testing/corpus/labeled::python-guardrail-signature-module
  - id: metadata/package/testing/corpus/scanner-tests::inline-scanner-candidate-unit-test
  # Rust unit tests quote shell payloads as scanner input; the text leg reads
  # those string literals as shell.
  - id: metadata/package/testing/harness/unit::rust-test
- id: test-rm-rf-root
  desc: test script wipes root path
  crit: suspicious
  conf: 0.97
  attack: T1485
  for:
  - package.json
  if:
    type: value
    path: scripts.test
    regex: ^sudo?\s*rm\s+-rf\s+/\*$
composite_rules:
- id: destructive-payload-present
  desc: destructive install payload present
  crit: suspicious
  conf: 0.96
  any:
  - id: objectives/impact/destroy/file-deletion/recursive::sudo-rm-rf-root
  - id: objectives/impact/destroy/file-deletion/recursive::test-rm-rf-root
  - id: objectives/impact/destroy/file-deletion/targeted::rm-s-q
  downgrade:
    scope: archive
    any:
      - id: well-known/tool/detection/agent/cc-audit::cc-audit-source-package-identity
- id: filesystem-root-wipe
  for:
  - shell
  desc: Filesystem root wipe command
  crit: hostile
  conf: 0.99
  attack: T1485
  mbc: C0047
  all:
  - id: metadata/lang/source/syntax/command/options::no-preserve-root
  - id: objectives/impact/destroy/file-deletion/recursive::sudo-rm-rf-root
  - id: objectives/execution/interpreter/script/npm/
- id: consumer-root-manifest-deletion
  desc: Script deletes manifest under consumer project root
  crit: suspicious
  conf: 0.9
  for:
  - javascript
  - typescript
  scope: file
  near_bytes: 4096
  all:
  - id: micro-behaviors/fs/delete/target::package-json-deletion
  any:
  - id: micro-behaviors/os/env/path::npm-init-cwd-read
  - id: micro-behaviors/fs/path/self::script-dir-ancestor-path
  - id: micro-behaviors/fs/path/self::script-dir-ancestor-path-segments
  # The package hook runs a local script that deletes the manifest, so the join
  # stays archive-wide. A deletion inside a user-invoked command module (commands/,
  # cli/, helpers/) is a CLI or chat action, not a lifecycle step, so that member
  # is exempt. The file-scope variant dropped hostile hook samples whose delete
  # sits in a helper the hook runs.
- id: install-hook-deletes-consumer-manifest
  desc: Install hook deletes consumer package manifest
  crit: hostile
  conf: 0.95
  attack: T1485,T1195.002
  for:
  - zip
  - npm
  - tar
  - package.json
  - javascript
  scope: archive
  all:
  - id: metadata/package/scripts/entrypoint::node-install-hook-local-script
  - id: objectives/impact/destroy/file-deletion/recursive::consumer-root-manifest-deletion
  unless:
  - id: metadata/path/directory::cli-command-directory-component
