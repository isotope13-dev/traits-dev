defaults:
  platforms:
  - freebsd
  - unix
  for:
  - kotlin
  - class
  attack: T1485
traits:
- id: kotlin-recursive-delete-function
  desc: Kotlin recursive delete function
  crit: suspicious
  conf: 0.92
  if:
    type: text
    substr: destroyRecursive
- id: kotlin-recursive-delete-bytecode
  desc: Kotlin bytecode recursive delete function
  crit: suspicious
  conf: 0.92
  for:
  - class
  if:
    type: hex
    pattern: 64 65 73 74 72 6F 79 52 65 63 75 72 73 69 76 65
composite_rules:
- id: kotlin-recursive-user-data-destroy
  desc: Kotlin recursively destroys user data
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/impact/destroy/file-deletion/recursive::kotlin-recursive-delete-function
  - id: micro-behaviors/fs/path/location::user-dotfile-path-reference
  any:
  - id: objectives/impact/destroy/file-deletion/targeted::kotlin-kill-user-processes
  - id: metadata/import/jvm::java-file-delete-bytecode
- id: kotlin-bytecode-user-data-destroy
  desc: Kotlin bytecode destroys user data
  crit: hostile
  conf: 0.98
  for:
  - class
  all:
  - id: objectives/impact/destroy/file-deletion/recursive::kotlin-recursive-delete-bytecode
  - id: micro-behaviors/fs/path/activity-history::jvm-bash-history-bytecode-path
  - id: micro-behaviors/fs/path/activity-history::jvm-zsh-history-bytecode-path
  any:
  - id: objectives/impact/destroy/file-deletion/targeted::kotlin-kill-user-processes-bytecode
  - id: metadata/import/jvm::java-file-delete-bytecode
