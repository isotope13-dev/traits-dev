defaults:
  platforms: [openbsd, bsd, unix]
  for: [shell]
  attack: T1485

traits:
  - id: shell-delete-ssh-host-keys
    desc: Shell deletes SSH host keys
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'rm\s+-f\s+/etc/ssh/ssh_host_\*_key'
    unless:
      - type: path
        regex: '(^|[\\/])nix[\\/]test-guest[\\/]cache-seal\.sh$'
      - id: guarded-rsa-host-key-regeneration

  - id: shell-delete-mail-spools
    desc: Shell deletes mail spools
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: rm -f /var/mail/*

composite_rules:
  - id: guarded-rsa-host-key-regeneration
    desc: Regenerates SSH host keys when the RSA key is missing
    crit: exception
    conf: 0.99
    near_lines: 5
    all:
      - id: micro-behaviors/fs/path/check::ssh-host-rsa-key-readability-test
      - id: micro-behaviors/crypto/asymmetric/ssh::ssh-rsa-host-key-generation-command
  - id: openbsd-shell-trust-file-destroy
    desc: OpenBSD shell destroys trust files
    crit: hostile
    conf: 0.98
    needs: 2
    any:
      - id: shell-delete-ssh-host-keys
      - id: shell-delete-mail-spools
      - id: micro-behaviors/os/autorun/cron::crontab-remove
