# Telegram deletion-request context; the rules do not establish authorization.
defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1485,T1531

composite_rules:
- id: detached-telegram-delete-template
  desc: Detached child carries account-delete code
  crit: suspicious
  conf: 0.98
  scope: archive
  all:
  - id: micro-behaviors/communications/messaging/telegram::account-delete-template-child
  - id: micro-behaviors/process/daemonize/detach::python-subprocess-new-session-option
  - id: micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-text
  any:
  - id: micro-behaviors/communications/http/services/telegram::goygram-import-reference
  - id: micro-behaviors/communications/http/services/telegram::telethon-delete-account-request
- id: module-call-with-telegram-delete-template
  desc: Module call with detached deletion code
  crit: suspicious
  conf: 0.97
  scope: archive
  for: [whl, python, pkginfo]
  all:
  - id: objectives/impact/destroy/messaging::detached-telegram-delete-template
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
