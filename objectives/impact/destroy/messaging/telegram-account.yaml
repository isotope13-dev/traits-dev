# Remote Telegram account deletion using on-disk session vault material.
defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1485,T1531

composite_rules:
  - id: isolated-child-telegram-account-deletion
    desc: Detached child deletes Telegram account from vault
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/communications/messaging/telegram::mtproto-delete-account-rpc
      - id: micro-behaviors/process/create/eval::sys-executable-c-popen
      - id: micro-behaviors/process/daemonize/detach::python-subprocess-new-session-option
      - id: micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-text
    any:
      - id: micro-behaviors/communications/http/services/telegram::telethon-delete-account-request
      - id: micro-behaviors/communications/messaging/telegram::goygram-read-vault-api-reference
      - id: micro-behaviors/communications/messaging/telegram::telegram-user-vault-glob-pattern

  - id: import-time-telegram-account-destruction
    desc: Import spawns Telegram account deletion agent
    crit: hostile
    conf: 0.97
    scope: archive
    for: [whl, python, pkginfo]
    all:
      - id: objectives/impact/destroy/messaging::isolated-child-telegram-account-deletion
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
