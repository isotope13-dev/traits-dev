defaults:
  for: [ne]
  platforms: [windows]
  attack: T1565.001,T1547.001

traits:
  - id: legacy-trojan-startup-batch-rewrite
    desc: Legacy trojan rewrites startup batch file
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule legacy_trojan_startup_batch_rewrite {
          strings:
            $startup = "c:\\autoexec.bat" ascii nocase
            $dos = "c:\\msdos.sys" ascii nocase
            $message = "T R O J A N" ascii nocase
            $echo = "@echo off" ascii nocase
            $repeat = { E8 ?? ?? E8 ?? ?? E8 ?? ?? E8 ?? ?? E8 ?? ?? E8 ?? ?? E8 ?? ?? E8 ?? ?? }
          condition:
            uint16(0) == 0x5a4d and all of them
        }
