defaults:
  for: [shell]
  platforms: [unix]
  attack: T1490,T1499

traits:
  - id: npm-audit-timezone-localtime
    desc: Moves system time zone link
    crit: notable
    if:
      type: text
      substr: 'mv /etc/localtime /etc/localtime.bak'
  - id: npm-audit-timezone-zoneinfo
    desc: Moves system time zone database
    crit: notable
    if:
      type: text
      substr: 'mv /usr/share/zoneinfo /usr/share/zoneinfo.bak'
  - id: npm-audit-timezone-status
    desc: Reports time resource destruction
    crit: notable
    if:
      type: text
      substr: 'STATUS=Time_Resource_Destruction'

composite_rules:
  - id: npm-audit-localtime-disruption-install
    desc: Install hook moves localtime and reports resource destruction
    crit: hostile
    conf: 0.98
    scope: archive
    for: [zip, npm, shell, package.json]
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-runs-shell-local-script
      - id: npm-audit-timezone-localtime
      - id: npm-audit-timezone-status
      - id: micro-behaviors/process/control/wait::shell-tail-dev-null-forever
  - id: npm-audit-timezone-script-pattern
    desc: Moves system time zone data
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/files/included::shell-audit-script-basename
      - id: npm-audit-timezone-localtime
      - id: npm-audit-timezone-zoneinfo
      - id: micro-behaviors/process/control/wait::shell-tail-dev-null-forever
      - id: npm-audit-timezone-status
  - id: npm-audit-timezone-install
    desc: Install hook moves system time zone data
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, shell, package.json]
    all:
      - id: metadata/package/scripts/command::shell-ms-audit-preinstall
      - id: npm-audit-timezone-script-pattern
