defaults:
  platforms: [unix, windows]
  for: [crx, xpi, zip]
  attack: T1485

composite_rules:
  # Bulk IndexedDB deletion is only victim-data destruction when the same local
  # routine both enumerates and deletes databases. File-wide correlation would
  # incorrectly combine a distant injection API with bundled IndexedDB library
  # method definitions (for example, Dexie's normal own-database cleanup).
  # Extension service-worker IndexedDB is origin-isolated; without content-script
  # injection this pattern only clears the extension's own databases.
  - id: extension-injected-indexeddb-wipe
    desc: Nearby injected content deletes IndexedDB
    crit: hostile
    conf: 0.97
    for: [javascript]
    scope: file
    # Keep the injection call in the same routine as the delete. A minified
    # service worker can migrate its own named database and, about 12KB later,
    # inject an unrelated content script. That gap is not one wipe.
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/db/web-storage::indexeddb-databases-enumerate
      - id: micro-behaviors/data/db/web-storage::indexeddb-delete-database
    any:
      - id: "metadata/permission/host::broad-content-script-matches"
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
    unless:
      - id: well-known/app/media/copy-text-from-picture::documented-ocr-extension-context
      - id: well-known/app/media/copy-text-from-picture::documented-local-data-reset-context
    # A disclosed session mover clears its own source tab only after the
    # destination acknowledges the import; the wipe is the second half of a
    # move, so the verdict lands on suspicious rather than hostile.
    downgrade:
      scope: archive
      any:
        - id: well-known/app/communication/passkey-linker::disclosed-integration-context
