defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1489
  mbc: E1489
traits:
  - id: kill-httpd
    desc: Terminates httpd process
    conf: 0.9
    if:
      type: text
      # HUP/USR signals reload or gracefully reconfigure httpd; they do not
      # terminate the service and must not satisfy this impact atom. The
      # word boundary keeps the lighttpd/uhttpd spellings from reading as a
      # plain "httpd" kill: lighttpd ends in the substring httpd, and
      # vendor update scripts legitimately stop those servers by name.
      regex: 'killall\s+.{0,50}\b(u?httpd)\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/build/conda::conda-recipe-build-path
      - id: metadata/build/conda::conda-recipe-helper-script-path
  - id: kill-apache
    desc: Kills apache service
    conf: 0.9
    if:
      type: text
      regex: 'killall\s+.{0,50}\bapache2?\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/build/conda::conda-recipe-build-path
      - id: metadata/build/conda::conda-recipe-helper-script-path
  - id: kill-nginx
    desc: Kills nginx service
    conf: 0.9
    size_min: 256
    if:
      type: text
      regex: 'killall\s+.{0,50}\bnginx\b'
    not:
      - substr: "killall nginx  #"
    unless:
      - type: text
        substr: "before running the test suite"
      - type: raw
        substr: '#system("killall -9 nginx")'
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/build/conda::conda-recipe-build-path
      - id: metadata/build/conda::conda-recipe-helper-script-path
composite_rules:
  - id: kill-web-server-cmd
    desc: Command to kill web server
    conf: 0.8
    any:
      - id: kill-httpd
      - id: kill-apache
      - id: kill-nginx
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/build/conda::conda-recipe-build-path
      - id: metadata/build/conda::conda-recipe-helper-script-path
