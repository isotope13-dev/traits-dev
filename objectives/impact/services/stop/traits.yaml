defaults:
  platforms:
    - linux
    - macos
    - windows
  attack: T1489
  for: [shell, python, javascript, powershell, batch, pe]
traits:
  - id: docker-dind-teardown-service-stop
    desc: DinD CI teardown stops docker service
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '(?i)DOCKER_IN_DOCKER.{0,500}service docker stop'
  - id: veeam-sql-agent-stop
    desc: Stops Veeam SQL Agent via net.exe
    crit: suspicious
    conf: 0.96
    platforms: [windows]
    for: [powershell, pe, python, javascript, batch]
    if:
      type: text
      regex: '(?i)\bnet(\.exe)?\s+stop\s+[''"]?SQLAgent\$VEEAMSQL[A-Za-z0-9_.-]*'
  - id: kill-postgres-kill
    desc: PostgreSQL process termination command
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: (?i)\b(killall|pkill|taskkill)\b[^\r\n]{0,80}\bpostgres
    unless:
      - id: micro-behaviors/process/create/shell/guard::python-destructive-command-risk-filter
  - id: kill-postgres-stop
    desc: PostgreSQL service stop command
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: (?i)\b((systemctl|net)\s+stop\s+postgres|service\s+postgres\S*\s+stop|pg_ctl\s+stop)
    unless:
      - id: well-known/tool/sysadmin/alpine-packages/package::alpine-ansible-core-package
  - id: kill-oracle-kill
    desc: Oracle process termination command
    crit: suspicious
    conf: 0.5
    if:
      type: text
      regex: (?i)\b(killall|pkill|taskkill)\b[^\r\n]{0,80}\boracle\b
  - id: kill-oracle-stop
    desc: Oracle service stop command
    crit: suspicious
    conf: 0.5
    if:
      type: text
      regex: (?i)\b(systemctl\s+stop\s+oracle[\w.-]*|service\s+oracle\s+stop|net\s+stop\s+oracle)\b
    not:
      - regex: '(?i)stop:\s+oracle'
  - id: kill-oracle-stop-windows
    desc: Windows Oracle service stop command
    crit: suspicious
    conf: 0.5
    platforms: [windows]
    for: [powershell, python, javascript, batch, pe]
    if:
      type: text
      regex: (?i)\bsc\s+(stop|delete)\s+oracle\b
  - id: kill-mssql-kill
    desc: MSSQL kill command
    crit: suspicious
    conf: 0.5
    if:
      type: text
      regex: (?i)\bkill\b[^\n]{0,30}\bmssql\b
    not:
      - regex: '(?i)(docker|podman|\$CONTAINER\w*)\s+kill\b'
    unless:
      - id: well-known/app/data/sql-server-dsc::module-path-identity
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
      - id: "metadata/file/naming::dev-directory-component"
  - id: kill-mssql-stop
    desc: MSSQL stop command
    crit: suspicious
    conf: 0.5
    if:
      type: text
      regex: (?i)\bstop\b[^\n]{0,30}\bmssql\b
    not:
      - regex: '(?i)stop:\s+mssql'
      - regex: '(?i)(docker\s+)?stop\s+mssql\b'
      - regex: '(?i)\bstop-service\b'
    unless:
      - id: well-known/app/data/sql-server-dsc::module-path-identity
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
      - id: "metadata/file/naming::dev-directory-component"
  - id: kill-mongodb-kill
    desc: MongoDB process termination command
    crit: suspicious
    conf: 0.5
    unless:
      - type: text
        regex: '\bkillall_mci\b'
      # Port post-install notes walk an admin through a manual database
      # migration, including `pkill mongod`; documentation, not a kill.
      - id: metadata/package/files/bsd::openbsd-port-readme-banner
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
      - id: "metadata/file/naming::dev-directory-component"
    if:
      type: text
      regex: (?i)\b(killall|pkill|taskkill)\b[\s"'`=-]{0,8}[^\n]{0,22}\b(mongod|mongodb)\b
  - id: kill-mongodb-stop
    desc: MongoDB stop command
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: (?i)\bstop\b[\s"'`=-]{0,8}[^\n]{0,22}\b(mongod|mongodb)\b
    not:
      - regex: '(?i)stop:\s+mongodb'
  - id: mongodb-service-name
    desc: MongoDB service name
    crit: component
    conf: 0.65
    if:
      type: text
      regex: (?i)\bmongod(b)?\b
  - id: tor-service-stop-systemctl
    desc: Tor service stop systemctl command
    crit: suspicious
    conf: 0.7
    platforms: [unix]
    for: [shell, python, javascript]
    unless:
      - id: tor-uninstall-cleanup
    if:
      type: text
      # Word-bounded so e.g. `systemctl stop nut-driver-enumerator` does not match the "tor" in "enumerator".
      regex: systemctl.{0,30}(stop|disable).{0,30}\btor(\b|@|\.service)
  - id: tor-service-stop-service
    desc: Tor service stop service command
    crit: suspicious
    conf: 0.7
    platforms: [unix]
    for: [shell, python, javascript]
    unless:
      - id: metadata/binary/resource/
      - id: tor-uninstall-cleanup
      # A script that also starts Tor is cycling its own proxy (stop, then start
      # for a fresh circuit), not shutting an anonymity service down.
      - id: micro-behaviors/os/service/start::tor-service-start-command
    if:
      type: text
      regex: (?i)\bservice (tor stop|stop tor)\b
  - id: tor-service-stop-launchctl
    desc: Tor service stop launchctl command
    crit: suspicious
    conf: 0.7
    platforms: [macos]
    for: [shell, python, javascript]
    if:
      type: text
      regex: launchctl.{0,30}(stop|disable).{0,30}\btor\b
  - id: tor-service-stop-sc
    desc: Tor service stop sc command
    crit: suspicious
    conf: 0.7
    platforms: [windows]
    for: [powershell, pe, python, javascript]
    if:
      type: text
      regex: \bsc (stop|config).{0,20}\btor\b
  - id: tor-service-stop-suffix
    desc: Tor service stop suffix
    crit: suspicious
    conf: 0.7
    platforms: [unix]
    for: [shell, python, javascript]
    if:
      type: text
      regex: "\btor@?\\.service\b.{0,30}(stop|disable)"
  - id: tor-process-kill
    desc: Tor process termination
    crit: suspicious
    conf: 0.7
    unless:
      - id: tor-uninstall-cleanup
    if:
      type: text
      regex: (?i)\b(killall|pkill|taskkill)\b.{0,50}\btor\b
  - id: tor-browser-kill
    desc: Tor Browser termination
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: tor[- ]?browser.{0,50}kill|kill.{0,50}tor[- ]?browser
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
  - id: node-cwd-pkill
    desc: pkill targets current Node project
    crit: suspicious
    conf: 0.95
    platforms: [unix]
    for: [javascript, shell]
    if:
      type: text
      regex: 'pkill\s+-f\s+["''`]node\.\*\$\{?process\.cwd\(\)\}?'
  - id: batch-deletes-programfiles-exe
    desc: Batch deletes Program Files EXE
    crit: suspicious
    conf: 0.9
    platforms: [windows]
    for: [batch]
    if:
      type: text
      regex: '(?i)\bdel\b.{0,80}\\Program Files\\.{0,80}\.exe'
    unless:
      - id: micro-behaviors/os/package-manager/management::windows-uninstaller-completion-banner
  - id: batch-runs-silent-uninstaller
    desc: Batch runs silent uninstaller
    crit: notable
    conf: 0.86
    platforms: [windows]
    for: [batch]
    if:
      type: text
      regex: '(?i)\\Uninstall\.exe"\s+/silent\b'

  - id: tor-uninstall-cleanup-sequence
    desc: Tor package and state removal cleanup sequence
    crit: notable
    conf: 0.99
    for: [shell]
    if:
      type: text
      regex: '(?is)\bapt\s+purge\b.{0,500}\brm\s+-rf\s+/var/lib/tor\b'
  - id: tor-uninstall-process-stop
    desc: Tor process stop in package cleanup
    crit: notable
    conf: 0.99
    for: [shell]
    if:
      type: text
      regex: '(?i)\bpkill\b[^\n]{0,80}\btor\b'
composite_rules:
  - id: tor-uninstall-cleanup
    desc: Tor package and state removal cleanup sequence
    crit: exception
    conf: 0.99
    for: [shell]
    all:
      - id: tor-uninstall-cleanup-sequence
      - id: tor-uninstall-process-stop

  - id: sysv-service-lifecycle
    desc: SysV service lifecycle context
    crit: exception
    conf: 0.99
    for: [shell]
    all:
      - id: micro-behaviors/os/service/config::sysv-init-script-header
      - id: micro-behaviors/os/service/config::init-script-path
      - id: micro-behaviors/process/terminate/command::killall
  - id: batch-kill-delete-silent-uninstall
    desc: Batch kill-delete silent uninstall
    crit: suspicious
    conf: 0.95
    for: [batch]
    all:
      - id: micro-behaviors/process/terminate/command::batch-taskkill-image-name
      - id: batch-deletes-programfiles-exe
      - id: batch-runs-silent-uninstaller

  - id: windows-service-stop-disable-force-kill
    desc: Stops dependents, disables service, kills image
    crit: suspicious
    conf: 0.95
    platforms: [windows]
    for: [batch, powershell, python, javascript, typescript, c, cpp, pe, dll]
    all:
      - id: micro-behaviors/os/service/stop::net-stop-dependent-services-command
      - id: micro-behaviors/os/service/configure::sc-config-start-disabled
    any:
      - id: micro-behaviors/process/terminate/command::batch-taskkill-image-name
      - id: micro-behaviors/process/terminate/command::powershell-taskkill-image-name
      - id: micro-behaviors/process/terminate/command::python-taskkill-force-image
      - id: micro-behaviors/process/terminate/command::js-taskkill-force-command
      - id: micro-behaviors/process/terminate/command::native-taskkill-force-image
    near_lines: 5
    downgrade:
      any:
        - id: metadata/binary/installer/family/

  - id: kill-mysql
    desc: MySQL service termination
    crit: notable
    conf: 0.6
    any:
      - id: micro-behaviors/process/terminate/command::taskkill-mysql-process
      - id: micro-behaviors/os/service/stop::mysql-service-stop-command
    unless:
      - id: metadata/file/profile/source-indications/
      - id: sysv-service-lifecycle
      - id: well-known/lib/cloud/boto::boto-pyami-installer-context
  - id: kill-postgres
    desc: PostgreSQL service termination
    crit: notable
    conf: 0.6
    any:
      - id: kill-postgres-kill
      - id: kill-postgres-stop
    unless:
      - id: well-known/tool/sysadmin/alpine-packages/package::alpine-ansible-core-package
  - id: kill-oracle
    desc: Oracle service termination
    crit: suspicious
    conf: 0.6
    any:
      - id: kill-oracle-kill
      - id: kill-oracle-stop
      - id: kill-oracle-stop-windows
    unless:
      - id: well-known/lib/data/sqlalchemy::source-tree
  - id: kill-mssql
    desc: MSSQL service termination
    crit: suspicious
    conf: 0.6
    any:
      - id: kill-mssql-kill
      - id: kill-mssql-stop
    unless:
      - id: well-known/app/data/sql-server-dsc::module-path-identity
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
      - id: "metadata/file/naming::dev-directory-component"
  - id: kill-mongodb
    desc: MongoDB service termination
    crit: suspicious
    conf: 0.6
    any:
      - id: kill-mongodb-kill
      - id: mongodb-service-stop
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
      - id: "metadata/file/naming::dev-directory-component"
  - id: node-project-self-destruct-stop
    desc: Self-destruct stops Node project processes
    crit: hostile
    conf: 0.99
    for: [javascript]
    all:
      - id: micro-behaviors/data/control-flow/dispatch::js-self-destruct-call
    any:
      - id: micro-behaviors/process/terminate/command::js-pm2-all-process-stop
      - id: node-cwd-pkill
      - id: micro-behaviors/process/terminate/command::taskkill-node-process
  - id: mongodb-service-stop
    desc: MongoDB service stop command
    crit: suspicious
    conf: 0.5
    near_bytes: 80
    all:
    - id: mongodb-service-name
    - id: kill-mongodb-stop
    any:
    - id: micro-behaviors/os/service/stop::systemctl-stop
    - id: micro-behaviors/os/service/stop::service-stop
    - id: micro-behaviors/os/service/stop::sc-stop
    - id: micro-behaviors/os/service/stop::net-stop-command-text
    - id: micro-behaviors/os/service/stop::launchctl-stop-command
  - id: kill-multiple-databases
    desc: Multiple database service families terminated
    crit: suspicious
    conf: 0.9
    any:
      - id: kill-mysql
      - id: kill-postgres
      - id: kill-oracle
      - id: kill-mssql
      - id: kill-mongodb
    needs: 2
    unless:
      - id: sysv-service-lifecycle
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
  - id: esxi-ransomware-comp
    for: [python, javascript]
    desc: VMware ESXi ransomware
    crit: suspicious
    conf: 0.99
    attack: T1486
    mbc: B0040
    all:
      - id: micro-behaviors/os/virtualization/hypervisor::esxcli-tool
      - id: micro-behaviors/communications/proxy/tor::onion-domain-reference
      - id: objectives/impact/ransom/encrypt/threat-text::ransom-word
  - id: net-stop-security-product
    desc: net stop command next to a security product name
    crit: suspicious
    conf: 0.96
    attack: T1562.001
    platforms: [windows]
    for: [pe, dll, batch, powershell]
    near_bytes: 160
    all:
      - id: micro-behaviors/os/service/stop::net-stop-command-text
    any:
      - id: micro-behaviors/os/security/product::kingsoft-antivirus-name
      - id: micro-behaviors/os/security/product::kingsoft-security
      - id: micro-behaviors/os/security/product::kaspersky-name
      - id: micro-behaviors/os/security/product::mcafee-name
      - id: micro-behaviors/os/security/product::norton-name
      - id: micro-behaviors/os/security/product::sophos-name
      - id: micro-behaviors/os/security/product::eset-name
      - id: micro-behaviors/os/security/product::bitdefender-name
      - id: micro-behaviors/os/security/product::malwarebytes-name
      - id: micro-behaviors/os/security/defender::defender-product-name-reference
      - id: micro-behaviors/os/security/product::rising-av
      - id: micro-behaviors/os/security/product::huorong-security
      - id: micro-behaviors/os/security/product::tencent-security
      - id: micro-behaviors/os/security/product::baidu-security
  - id: winexec-stops-security-product
    desc: WinExec stops a named security product service
    crit: hostile
    conf: 0.97
    attack: T1562.001
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: net-stop-security-product
      - id: micro-behaviors/process/create/exec::winexec
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/security/
      - id: well-known/tool/sysadmin/
