defaults:
  platforms:
    - linux
    - macos
    - windows
  attack: T1489
  for: [shell, python, javascript, powershell, batch, pe]
traits:
  - id: docker-dind-teardown-service-stop
    desc: DinD CI teardown stops docker service
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '(?i)DOCKER_IN_DOCKER.{0,500}service docker stop'
  - id: sc-stop
    desc: Windows service control stop
    crit: notable
    conf: 0.8
    platforms: [windows]
    for: [powershell, pe, python, javascript, batch]
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+stop\s+[A-Za-z0-9_.-]{2,}'
    not:
      - regex: '%[A-Za-z]'
      - substr: sc stop cloudflared
      - substr: sc stop igfxCUIService
      - substr: sc.exe stop LCD_Service
      - substr: sc stop sppsvc
    downgrade:
    unless:
      - id: metadata/binary/installer/family/
  - id: net-stop
    desc: Windows net stop command
    crit: notable
    conf: 0.8
    platforms: [windows]
    for: [powershell, pe, python, javascript, batch]
    if:
      type: text
      regex: '(?i)\bnet(\.exe)?\s+stop\s+[''"]?[A-Za-z0-9_.$-]{2,}\b'
  - id: veeam-sql-agent-stop
    desc: Stops Veeam SQL Agent via net.exe
    crit: suspicious
    conf: 0.96
    platforms: [windows]
    for: [powershell, pe, python, javascript, batch]
    if:
      type: text
      regex: '(?i)\bnet(\.exe)?\s+stop\s+[''"]?SQLAgent\$VEEAMSQL[A-Za-z0-9_.-]*'
  - id: sharedaccess-service-name
    desc: References SharedAccess firewall service
    crit: component
    conf: 0.94
    platforms: [windows]
    for: [powershell, pe, python, javascript]
    if:
      type: text
      word: SharedAccess
  - id: sharedaccess-net-service-target
    desc: Net command targets SharedAccess
    crit: component
    conf: 0.94
    platforms: [windows]
    for: [powershell, pe, python, javascript, batch]
    if:
      type: text
      regex: '(?i)\bnet(\.exe)?\s+(stop|start|delete|config)\s+["'']?SharedAccess\b'
  - id: sharedaccess-sc-service-target
    desc: Sc command targets SharedAccess
    crit: component
    conf: 0.94
    platforms: [windows]
    for: [powershell, pe, python, javascript, batch]
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+(stop|start|delete|config)\s+["'']?SharedAccess\b'
  - id: sharedaccess-powershell-service-target
    desc: PowerShell command targets SharedAccess
    crit: component
    conf: 0.94
    platforms: [windows]
    for: [powershell, pe, python, javascript, batch]
    if:
      type: text
      regex: '(?i)\b(Stop-Service|Set-Service)\b[^\r\n]{0,80}\bSharedAccess\b'
  - id: sc-config-start-disabled
    desc: Disables Windows service via sc config
    crit: notable
    conf: 0.92
    platforms: [windows]
    for: [powershell, pe, python, javascript, batch]
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+config\s+\S+\s+start=\s*disabled'
    unless:
      - id: metadata/file/string/identity::microsoft-activation-script-benign-context
    downgrade:
      any:
        - id: metadata/binary/installer/family/
  - id: kill-mysql-kill
    desc: MySQL process-name termination command
    crit: suspicious
    conf: 0.82
    if:
      type: text
      regex: '(?i)\b(killall|pkill|taskkill)\b[^\r\n]{0,40}\s(mysql|mysqld)\b'
    unless:
      - id: well-known/lib/ui/ace-editor
      - id: metadata/package/testing/presence/harness::python-test-file
      - id: metadata/package/testing/presence/harness::python-test-file-content
      - id: sysv-service-lifecycle
      - id: well-known/lib/cloud/boto::boto-pyami-installer-context
  - id: kill-mysql-stop
    desc: MySQL service stop command
    crit: suspicious
    conf: 0.82
    if:
      type: text
      regex: (?i)\b(systemctl stop|service mysql stop)\b.{0,40}\b(mysql|mysqld)\b
    unless:
      - id: metadata/lang/source/
      - id: metadata/package/testing/presence/harness::python-test-file
      - id: metadata/package/testing/presence/harness::python-test-file-content
      - id: well-known/lib/ui/ace-editor
      - id: sysv-service-lifecycle
    not:
      - regex: '(?i)stop:\s+mysql'
  - id: kill-postgres-kill
    desc: PostgreSQL process termination command
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: (?i)\b(killall|pkill|taskkill)\b[^\r\n]{0,80}\bpostgres
  - id: kill-postgres-stop
    desc: PostgreSQL service stop command
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: (?i)\b((systemctl|net)\s+stop\s+postgres|service\s+postgres\S*\s+stop|pg_ctl\s+stop)
    unless:
      - id: well-known/tool/sysadmin/alpine-packages::alpine-ansible-core-package
  - id: kill-oracle-kill
    desc: Oracle process termination command
    crit: suspicious
    conf: 0.5
    if:
      type: text
      regex: (?i)\b(killall|pkill|taskkill)\b[^\r\n]{0,80}\boracle\b
  - id: kill-oracle-stop
    desc: Oracle service stop command
    crit: suspicious
    conf: 0.5
    if:
      type: text
      regex: (?i)\b(systemctl\s+stop\s+oracle[\w.-]*|service\s+oracle\s+stop|net\s+stop\s+oracle)\b
    not:
      - regex: '(?i)stop:\s+oracle'
  - id: kill-oracle-stop-windows
    desc: Windows Oracle service stop command
    crit: suspicious
    conf: 0.5
    platforms: [windows]
    for: [powershell, python, javascript, batch, pe]
    if:
      type: text
      regex: (?i)\bsc\s+(stop|delete)\s+oracle\b
  - id: kill-mssql-kill
    desc: MSSQL kill command
    crit: suspicious
    conf: 0.5
    if:
      type: text
      regex: (?i)\bkill\b[^\n]{0,30}\bmssql\b
  - id: kill-mssql-stop
    desc: MSSQL stop command
    crit: suspicious
    conf: 0.5
    if:
      type: text
      regex: (?i)\bstop\b[^\n]{0,30}\bmssql\b
    not:
      - regex: '(?i)stop:\s+mssql'
      - regex: '(?i)(docker\s+)?stop\s+mssql\b'
  - id: kill-mongodb-kill
    desc: MongoDB kill command
    crit: suspicious
    conf: 0.5
    if:
      type: text
      regex: (?i)\bkill(all)?\b[\s"'`=-]{0,8}[^\n]{0,22}\b(mongod|mongodb)\b
  - id: kill-mongodb-stop
    desc: MongoDB stop command
    crit: component
    conf: 0.5
    if:
      type: text
      regex: (?i)\bstop\b[\s"'`=-]{0,8}[^\n]{0,22}\b(mongod|mongodb)\b
    not:
      - regex: '(?i)stop:\s+mongodb'
  - id: mongodb-service-name
    desc: MongoDB service name
    crit: component
    conf: 0.65
    if:
      type: text
      regex: (?i)\bmongod(b)?\b
  - id: tor-service-stop-systemctl
    desc: Tor service stop systemctl command
    crit: suspicious
    conf: 0.7
    platforms: [unix]
    for: [shell, python, javascript]
    unless:
      - id: tor-uninstall-cleanup
    if:
      type: text
      # Word-bounded so e.g. `systemctl stop nut-driver-enumerator` does not match the "tor" in "enumerator".
      regex: systemctl.{0,30}(stop|disable).{0,30}\btor(\b|@|\.service)
  - id: tor-service-stop-service
    desc: Tor service stop service command
    crit: suspicious
    conf: 0.7
    platforms: [unix]
    for: [shell, python, javascript]
    unless:
      - id: metadata/binary/resource/
      - id: tor-uninstall-cleanup
    if:
      type: text
      regex: (?i)\bservice (tor stop|stop tor)\b
  - id: tor-service-stop-launchctl
    desc: Tor service stop launchctl command
    crit: suspicious
    conf: 0.7
    platforms: [macos]
    for: [shell, python, javascript]
    if:
      type: text
      regex: launchctl.{0,30}(stop|disable).{0,30}\btor\b
  - id: tor-service-stop-sc
    desc: Tor service stop sc command
    crit: suspicious
    conf: 0.7
    platforms: [windows]
    for: [powershell, pe, python, javascript]
    if:
      type: text
      regex: \bsc (stop|config).{0,20}\btor\b
  - id: tor-service-stop-suffix
    desc: Tor service stop suffix
    crit: suspicious
    conf: 0.7
    platforms: [unix]
    for: [shell, python, javascript]
    if:
      type: text
      regex: "\btor@?\\.service\b.{0,30}(stop|disable)"
  - id: tor-process-kill
    desc: Tor process termination
    crit: suspicious
    conf: 0.7
    unless:
      - id: tor-uninstall-cleanup
    if:
      type: text
      regex: (?i)\b(killall|pkill|taskkill)\b.{0,50}\btor\b
  - id: tor-browser-kill
    desc: Tor Browser termination
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: tor[- ]?browser.{0,50}kill|kill.{0,50}tor[- ]?browser
    unless:
      - id: metadata/package/testing/
      - id: metadata/package/testing/presence/harness::test-fixture-directory-path
  - id: pm2-kill-all
    desc: PM2 process manager termination
    crit: suspicious
    conf: 0.9
    for: [javascript, shell]
    if:
      type: text
      regex: '\b(npx\s+)?pm2\s+(kill|delete\s+all)\b'
  - id: node-cwd-pkill
    desc: pkill targets current Node project
    crit: suspicious
    conf: 0.95
    platforms: [unix]
    for: [javascript, shell]
    if:
      type: text
      regex: 'pkill\s+-f\s+["''`]node\.\*\$\{?process\.cwd\(\)\}?'
  - id: force-kill-node-exe
    desc: Force kills node.exe process
    crit: suspicious
    conf: 0.9
    platforms: [windows]
    for: [javascript, batch, powershell]
    if:
      type: text
      regex: '\btaskkill\b[^\r\n]{0,80}/IM\s+node\.exe\b[^\r\n]{0,80}/F\b'
  - id: batch-deletes-programfiles-exe
    desc: Batch deletes Program Files EXE
    crit: suspicious
    conf: 0.9
    platforms: [windows]
    for: [batch]
    if:
      type: text
      regex: '(?i)\bdel\b.{0,80}\\Program Files\\.{0,80}\.exe'
  - id: batch-runs-silent-uninstaller
    desc: Batch runs silent uninstaller
    crit: notable
    conf: 0.86
    platforms: [windows]
    for: [batch]
    if:
      type: text
      regex: '(?i)\\Uninstall\.exe"\s+/silent\b'

  - id: tor-uninstall-cleanup-sequence
    desc: Tor package and state removal cleanup sequence
    crit: notable
    conf: 0.99
    for: [shell]
    if:
      type: text
      regex: '(?is)\bapt\s+purge\b.{0,500}\brm\s+-rf\s+/var/lib/tor\b'
  - id: tor-uninstall-process-stop
    desc: Tor process stop in package cleanup
    crit: notable
    conf: 0.99
    for: [shell]
    if:
      type: text
      regex: '(?i)\bpkill\b[^\n]{0,80}\btor\b'
composite_rules:
  - id: tor-uninstall-cleanup
    desc: Tor package and state removal cleanup sequence
    crit: exception
    conf: 0.99
    for: [shell]
    all:
      - id: tor-uninstall-cleanup-sequence
      - id: tor-uninstall-process-stop

  - id: sysv-service-lifecycle
    desc: SysV service lifecycle context
    crit: exception
    conf: 0.99
    for: [shell]
    all:
      - id: micro-behaviors/os/service/config::sysv-init-script-header
      - id: micro-behaviors/os/service/config::init-script-path
      - id: micro-behaviors/process/terminate/command::killall
  - id: batch-kill-delete-silent-uninstall
    desc: Batch kill-delete silent uninstall
    crit: suspicious
    conf: 0.95
    for: [batch]
    all:
      - id: micro-behaviors/process/terminate/command::batch-taskkill-image-name
      - id: batch-deletes-programfiles-exe
      - id: batch-runs-silent-uninstaller

  - id: systemd-service-stop-disable
    desc: Systemd service stop and disable
    crit: suspicious
    conf: 0.9
    platforms: [unix]
    for: [shell, python, javascript]
    all:
      - id: micro-behaviors/os/service/control::systemctl-stop
      - id: micro-behaviors/os/service/control::systemctl-disable
    unless:
      - id: well-known/app/system/olares
      - id: well-known/app/infrastructure/skypilot::skypilot-source-file
      - id: well-known/dual-use/tunnel/shadowsocks-libev::shadowsocks-libev-source
      - id: well-known/app/infrastructure/nuzur/
      - id: well-known/tool/development/osbuild-composer::osbuild-composer-test-script-context
      - id: well-known/tool/sysadmin/kubernetes/bootstrap/
    # An app (un)installing its OWN service emits the target as a templating
    # placeholder/variable rather than a hardcoded victim service name. That is
    # lifecycle management, not impact -> drop suspicious to notable. Referenced
    # by name so it resolves at the leaf file (survives archive roll-up).
    downgrade:
      any:
        - id: micro-behaviors/os/service/control::systemctl-templated-target
        - id: metadata/package/files/system-package::dpkg-maintainer-script
  - id: kill-mysql
    desc: MySQL service termination
    crit: suspicious
    conf: 0.6
    any:
      - id: kill-mysql-kill
      - id: kill-mysql-stop
    unless:
      - id: metadata/lang/source/
      - id: sysv-service-lifecycle
      - id: well-known/lib/cloud/boto::boto-pyami-installer-context
  - id: kill-postgres
    desc: PostgreSQL service termination
    crit: notable
    conf: 0.6
    any:
      - id: kill-postgres-kill
      - id: kill-postgres-stop
    unless:
      - id: well-known/tool/sysadmin/alpine-packages::alpine-ansible-core-package
  - id: kill-oracle
    desc: Oracle service termination
    crit: suspicious
    conf: 0.6
    any:
      - id: kill-oracle-kill
      - id: kill-oracle-stop
      - id: kill-oracle-stop-windows
    unless:
      - id: well-known/lib/data/sqlalchemy::source-tree
  - id: kill-mssql
    desc: MSSQL service termination
    crit: suspicious
    conf: 0.6
    any:
      - id: kill-mssql-kill
      - id: kill-mssql-stop
  - id: sharedaccess-service-target
    desc: Command targets SharedAccess firewall service
    crit: component
    conf: 0.94
    any:
      - id: sharedaccess-net-service-target
      - id: sharedaccess-sc-service-target
      - id: sharedaccess-powershell-service-target

  - id: sharedaccess-firewall-service-stop
    desc: Stop or tamper firewall service
    crit: suspicious
    conf: 0.97
    all:
      - id: sharedaccess-service-target
      - id: micro-behaviors/os/service/control::service-stop-control
    any:
      - id: micro-behaviors/os/service/control::service-control-dispatch
      - id: micro-behaviors/os/service/control::create-service
      - id: micro-behaviors/os/service/control::query-service-status
    needs: 3
  - id: kill-mongodb
    desc: MongoDB service termination
    crit: suspicious
    conf: 0.6
    any:
      - id: kill-mongodb-kill
      - id: mongodb-service-stop
  - id: node-project-self-destruct-stop
    desc: Self-destruct stops Node project processes
    crit: hostile
    conf: 0.99
    for: [javascript]
    all:
      - id: objectives/impact/wipe/disk/mass-delete::js-self-destruct-marker
    any:
      - id: pm2-kill-all
      - id: node-cwd-pkill
      - id: force-kill-node-exe
  - id: mongodb-service-stop
    desc: MongoDB service stop command
    crit: suspicious
    conf: 0.5
    near_bytes: 80
    all:
      - id: mongodb-service-name
      - id: kill-mongodb-stop
    any:
      - id: micro-behaviors/os/service/control::systemctl-stop
      - id: micro-behaviors/os/service/control::service-stop
      - id: sc-stop
      - id: net-stop
      - id: micro-behaviors/os/service/control::launchctl-stop-command
  - id: kill-multiple-databases
    desc: Multiple database service families terminated
    crit: suspicious
    conf: 0.9
    any:
      - id: kill-mysql
      - id: kill-postgres
      - id: kill-oracle
      - id: kill-mssql
      - id: kill-mongodb
    needs: 2
    unless:
      - id: sysv-service-lifecycle
  - id: security-service-disable
    desc: Disables Windows security services
    crit: hostile
    conf: 0.97
    platforms: [windows]
    for: [powershell, pe, python, javascript]
    all:
      - id: sc-config-start-disabled
      - id: sharedaccess-service-name
    any:
      - id: net-stop
      - id: sc-stop
    downgrade:
      any:
        - id: metadata/binary/installer/family/
        - id: metadata/signed/platform/
  - id: esxi-ransomware-comp
    desc: VMware ESXi ransomware
    crit: suspicious
    conf: 0.99
    attack: T1486
    mbc: B0040
    all:
      - id: micro-behaviors/os/sysinfo/vmware::esxcli-tool
      - id: micro-behaviors/communications/proxy/tor::onion-domain-reference
      - id: objectives/impact/ransom/encrypt/threat-text::ransom-word
