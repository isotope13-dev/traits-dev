defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1489

composite_rules:
  # The encryptor independently establishes destructive intent. The
  # additional evidence is a resolved STOP request and process termination,
  # not a generic service-control import or a vendor-name string list.
  - id: recovery-destroying-encryptor-service-stop
    desc: Destructive encryptor stops services/processes
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/ransom/encrypt/bulk-encryption::chacha-shadow-recycle-destroying-file-walker
      - id: micro-behaviors/os/service/stop::control-service-stop-request
      - id: micro-behaviors/process/terminate/kill::terminate-process
