# Veeam service shutdown is a common pre-destruction step in ransomware and
# wiper workflows. The vendor name alone is neutral; this rule requires an
# actual Windows service-stop command targeting a Veeam backup component.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1489

traits:
  - id: veeam-backup-service-stop
    desc: Stops a Veeam backup service with net.exe
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bnet(\.exe)?\s+stop\s+["'']?Veeam(Backup|Catalog|Mount|Agent)[A-Za-z0-9_.-]*\b'

