defaults:
  platforms: [unix]
  for: [scripts, binaries]
  attack: T1489

composite_rules:
  - id: esxi-vm-enumerate-terminate
    desc: ESXi VM enumeration and forced termination
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/sysinfo/vmware::esxcli-vm-list
      - id: micro-behaviors/process/terminate/kill::esxcli-vm-kill
      - id: micro-behaviors/os/sysinfo/vmware::esxi-world-id-param
