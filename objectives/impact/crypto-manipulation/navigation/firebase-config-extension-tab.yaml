# Extension pulls navigation targets from Firebase Realtime Database config and
# opens them in a new browser tab.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, crx, xpi, zip]
  attack: T1657,T1189

composite_rules:
  - id: firebase-remote-config-extension-tab-opener
    desc: Firebase config drives extension tab navigation
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/communications/http/services/firebase::firebase-rtdb-endpoint
      - id: micro-behaviors/communications/http/request/url::fetch-no-store-cache
      - id: micro-behaviors/browser-extension/tabs::extension-remote-config-opens-tab-url
