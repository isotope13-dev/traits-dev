defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]
  attack: T1565.001

traits:
  - id: native-bitcoin-wallet-paths--bitcoin-directory
    desc: Native .bitcoin wallet directory
    crit: component
    conf: 0.92
    if:
      type: text
      # Require path separators around the wallet directory/file. Standalone
      # .bitcoin strings are common in Bitcoin DNS-seed and client libraries.
      regex: '(^|[/\\])\.bitcoin([/\\])'
  - id: native-bitcoin-wallet-paths--btcwallet-directory
    desc: Native .btcwallet directory
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(^|[/\\])\.btcwallet([/\\])'
  - id: native-bitcoin-wallet-paths--wallet-file
    desc: Native wallet.dat file path
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(^|[/\\])wallet\.dat($|[/\\])'

    unless:
      - id: metadata/package/quality/recognized-contexts::malcontent-defensive-scanner-context
      # Bitcoin-derived unit tests assert path normalization with .bitcoin
      # fixtures; the path alone is not wallet manipulation in test code.
      - id: metadata/package/testing/presence/harness::test-directory-path
  - id: native-monero-wallet-paths
    desc: Native Monero wallet paths
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '\.(bitmonero|monero-core)'

  - id: native-keystore-corrupt-func
    desc: Native keystore corrupt func
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'corrupt_(ethereum_keystore|bitcoin_wallet|monero_wallet)'

composite_rules:
  - id: native-bitcoin-wallet-paths
    desc: Native Bitcoin wallet paths
    crit: suspicious
    conf: 0.92
    any:
      - id: native-bitcoin-wallet-paths--bitcoin-directory
      - id: native-bitcoin-wallet-paths--btcwallet-directory
      - id: native-bitcoin-wallet-paths--wallet-file
    unless:
      - id: metadata/package/quality/recognized-contexts::malcontent-defensive-scanner-context
      - id: metadata/package/testing/presence/harness::test-directory-path
  - id: native-wallet-keystore-corrupt
    desc: Wallet keystore corruption pattern
    crit: hostile
    conf: 0.98
    all:
      - id: native-keystore-corrupt-func
    needs: 2
    any:
      - id: native-bitcoin-wallet-paths
      - id: native-monero-wallet-paths
      - id: micro-behaviors/data/encode/xor::xor-aa55-byte-mask
