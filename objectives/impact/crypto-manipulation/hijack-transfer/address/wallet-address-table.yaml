defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  attack: T1565.002
  mbc: E1565
  crit: hostile
traits:
- id: replace-with-ethereum-address
  desc: Replaces text with a hardcoded Ethereum address
  crit: component
  if:
    type: symbol
    kind: call
    regex: '\.replace(All)?$'
    arg:
      index: 1
      from:
        whole_value: '^0x[a-fA-F0-9]{40}$'
composite_rules:
- id: obfuscated-wallet-http-hook-address-matchers
  desc: Obfuscated HTTP hook with cryptocurrency address matchers
  crit: suspicious
  conf: 0.93
  all:
  - id: micro-behaviors/communications/http/intercept::fetch-hook
  - id: micro-behaviors/data/format/crypto-address::single-chain-address-regex
  needs: 1
  any:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
  - id: micro-behaviors/data/collection/array::js-bracket-push-shift-call-text
- id: hooked-response-address-rewrite
  desc: Network hook with wallet address matchers
  crit: suspicious
  conf: 0.96
  scope: file
  near_bytes: 16384
  all:
  - id: micro-behaviors/data/format/crypto-address::multi-chain-address-matchers
  - id: micro-behaviors/communications/http/intercept::http-interception-reference
  unless:
  - id: metadata/path/directory::test-directory-component
  - id: micro-behaviors/data/format/crypto-address::example-btc-unspendable-address
  - id: micro-behaviors/data/format/crypto-address::example-eth-zero-burn-address
- id: hooked-wallet-address-replacement
  desc: Network hook and wallet matchers with hardcoded address replacement
  all:
  - id: hooked-response-address-rewrite
  - id: replace-with-ethereum-address
- id: drainer-kit-response-rewrite
  desc: Drainer-kit routines accompany network hooks and address matchers
  conf: 0.96
  scope: file
  all:
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::hooked-response-address-rewrite
  any:
  - id: objectives/credential-access/wallet/provider::drainer-function-names
- id: concealed-wallet-transfer-address-kit
  desc: Concealed code names wallet transfers beside hardcoded addresses
  conf: 0.96
  scope: file
  all:
  - id: micro-behaviors/communications/blockchain/wallet::wallet-rpc-fragment-pair
  - id: micro-behaviors/data/format/crypto-address::hardcoded-eth-address-table
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::strong-js-obfuscation
  unless:
  - id: metadata/path/directory::test-directory-component
