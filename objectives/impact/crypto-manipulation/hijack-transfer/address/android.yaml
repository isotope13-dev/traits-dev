defaults:
  platforms:
  - android
  for:
  - dex
  attack: T1565.001
  mbc: E1565
  conf: 0.9
traits:
- id: android-wallet-overlay-injection-view
  desc: Android wallet overlay injection view field
  crit: suspicious
  conf: 0.93
  if:
    type: text
    regex: '[A-Za-z]{2,12}WalletInjview'
- id: android-usdt-address-capture-field
  desc: Android captured USDT destination field
  crit: suspicious
  conf: 0.9
  if:
    type: text
    word: usdtaddress
- id: android-usdt-amount-capture-field
  desc: Android captured USDT amount field
  crit: suspicious
  conf: 0.9
  if:
    type: text
    word: usdtamount
composite_rules:
- id: android-accessibility-usdt-address-swap
  desc: Android accessibility overlay swaps USDT transfer details
  crit: hostile
  conf: 0.97
  all:
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::android-wallet-overlay-injection-view
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::android-usdt-address-capture-field
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::android-usdt-amount-capture-field
  - id: micro-behaviors/hardware/input/automation::android-accessibility-service-descriptor
