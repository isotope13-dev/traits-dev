defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  attack: T1565.001
  crit: suspicious
traits:
- id: transaction-data-address-rewrite--rx-16
  desc: .replace() over ETH/BTC-SegWit address regex
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \.(replace|replaceAll)\s*\([^;\n]{0,140}(0x\[a-fA-F0-9\]|bc1\[)
- id: transaction-data-address-rewrite--rx-17
  desc: .replace() over BitcoinCash/Tron address regex
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \.(replace|replaceAll)\s*\([^;\n]{0,140}(bitcoincash:|\[T\]\[1-9A-HJ)[^;\n]{0,60}\)
  not:
  - regex: \.(replace|replaceAll)\s*\([^,]{0,80}(bitcoincash|bchtest)[^,]{0,80},\s*[`'"](bitcoin:)?[`'"]\s*\)
- id: transaction-data-address-rewrite--rx-18
  desc: .replace() over LTC/Solana address regex
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \.(replace|replaceAll)\s*\([^;\n]{0,140}(ltc1\[|\[1-9A-HJ-NP-Za-km-z\]\{32,44\})
- id: address-replacement-target
  desc: Names an attacker or replacement wallet field
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(replacement|attacker)[_-]?(address|wallet|account)\w*\b
  unless:
  - id: well-known/app/ai/agent-runtime/aui-agent-builder/
- id: solana-config-dir-marker
  desc: Solana config directory marker
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '["'']?\.config[\\/]solana[\\/]cli[\\/]'
- id: solana-cli-dir-marker
  desc: Solana CLI directory marker
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '[''"]solana[''"],\s*[''"]cli|solana/cli'
- id: solana-config-yml-name
  desc: Solana config.yml filename
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)solana.{0,80}config\.yml
- id: solana-json-rpc-url-setting
  desc: Solana JSON RPC URL setting
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: json_rpc_url
- id: primary-payout-share
  desc: Encodes a primary payout percentage
  crit: notable
  conf: 0.96
  for: [javascript]
  if:
    type: text
    regex: "['\"][0-9][.][0-9]{1,2}['\"]\\s*,\\s*['\"][0-9]{1,2}@['\"]"
- id: secondary-payout-share
  desc: Encodes a secondary payout percentage
  crit: notable
  conf: 0.96
  for: [javascript]
  if:
    type: text
    regex: "['\"][|][0-9][.][0-9]{1,2}['\"]\\s*,\\s*['\"][0-9]{1,2}@['\"]"
- id: payer-address-wrapper
  desc: Wraps payer address by currency
  crit: notable
  conf: 0.96
  for: [javascript]
  if:
    type: text
    regex: 'address\s*:\s*[A-Za-z_$][\w$]*\([^;\n]{0,80}ownAddress[^;\n]{0,80}(coin|currency|chain)'
- id: reversed-wallet-map
  desc: Maps computed keys to long strings
  crit: notable
  conf: 0.96
  for: [javascript]
  if:
    type: text
    regex: "\\w+\\(['\"][\\w-]{1,24}['\"]\\)\\]\\s*:\\s*['\"][A-Za-z0-9]{20,80}['\"]"
- id: reverse-string-call
  desc: References a reverse method call
  crit: notable
  conf: 0.94
  for: [javascript]
  if:
    type: text
    substr: .reverse()
composite_rules:
- id: fee-split-fragments
  desc: Builds a fee-split destination string
  crit: notable
  conf: 0.96
  for: [javascript]
  all:
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::primary-payout-share
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::secondary-payout-share
- id: api-payment-fee-recipient-split
  desc: Redirects cryptocurrency payment fees to a mapped wallet
  crit: hostile
  conf: 0.99
  for: [javascript]
  near_bytes: 4096
  all:
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::fee-split-fragments
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::payer-address-wrapper
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::reversed-wallet-map
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::reverse-string-call
- id: crypto-address-pattern-rewrite
  desc: Crypto address pattern replacement
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/data/format/crypto-address::multi-crypto-regex
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::address-replacement-target
  any:
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::transaction-data-address-rewrite--rx-16
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::transaction-data-address-rewrite--rx-17
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::transaction-data-address-rewrite--rx-18
  needs: 1
- id: solana-cli-config-path
  desc: Solana CLI config path
  crit: component
  conf: 0.94
  all:
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::solana-config-dir-marker
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::solana-cli-dir-marker
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::solana-config-yml-name
- id: solana-cli-rpc-hijack
  desc: Solana CLI RPC endpoint hijack
  crit: hostile
  conf: 0.97
  near_bytes: 8192
  all:
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::solana-cli-config-path
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::solana-json-rpc-url-setting
  - id: micro-behaviors/fs/write/file/reference::js-fs-write-sync
  - id: micro-behaviors/communications/ip/literal::http-ip-url
- id: browser-dom-address-hijacker
  desc: Browser DOM rewrites cryptocurrency wallet addresses
  crit: hostile
  conf: 0.99
  near_bytes: 8192
  all:
  - id: micro-behaviors/data/format/crypto-address::single-chain-address-regex
  - id: micro-behaviors/data/string/replace::keyed-replacement-call
  any:
  - id: micro-behaviors/ui/window/event::browser-mutation-observer
  - id: micro-behaviors/data/collection/dom::tree-walker-and-text-assignment
  - id: micro-behaviors/process/hook/browser::browser-form-value-setter-hook
- id: browser-dom-address-callback-rewriter
  desc: Browser DOM text walker rewrites matched wallet addresses via callback
  crit: suspicious
  conf: 0.95
  near_bytes: 32768
  all:
  - id: micro-behaviors/data/format/crypto-address::single-chain-address-regex
  - id: micro-behaviors/data/string/replace::variable-pattern-callback-replacement
  - id: micro-behaviors/data/collection/dom::tree-walker-and-text-assignment
- id: obfuscated-wallet-address-stage
  desc: Obfuscated wallet address stage loader
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/data/format/crypto-address::hardcoded-tron-address-reference
  - id: objectives/anti-static/obfuscation/eval/loader::permutation-fed-indirect-eval
- id: browser-wallet-address-replacement-interceptor
  desc: Browser wallet interceptor rewrites multi-chain destinations
  crit: hostile
  conf: 0.99
  near_bytes: 32768
  all:
  - id: micro-behaviors/data/format/crypto-address::multi-crypto-regex
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::crypto-address-pattern-rewrite
  - id: micro-behaviors/communications/blockchain/wallet::wallet-provider-eth-accounts
  any:
  - id: micro-behaviors/communications/http/intercept::request-interceptor
  - id: objectives/impact/crypto-manipulation/hijack-transfer/transaction::provider-request-wrapper
- id: browser-crypto-response-rewrite
  desc: Browser crypto response address rewrite
  crit: hostile
  conf: 0.98
  attack: T1565.001,T1185
  near_bytes: 8192
  all:
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::crypto-address-pattern-rewrite
  - id: micro-behaviors/communications/http/intercept::request-interceptor
  any:
  - id: micro-behaviors/communications/http/intercept::xhr-response-text-in-send-hook
  - id: micro-behaviors/communications/http/intercept::fetch-response-body-record
- id: browser-wallet-rpc-destination-rewrite
  desc: Browser wallet RPC destination rewrite
  crit: hostile
  conf: 0.99
  near_bytes: 8192
  all:
  - id: metadata/lang/source/syntax/assignment/member::request-like-property-assignment
  - id: micro-behaviors/communications/blockchain/wallet::wallet-provider-eth-send-transaction
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::address-replacement-target
  any:
  - id: objectives/impact/crypto-manipulation/hijack-transfer/transaction::provider-request-function-assignment
  - id: objectives/impact/crypto-manipulation/hijack-transfer/transaction::provider-request-arrow-assignment
- id: defi-request-address-drainer
  desc: DeFi request address replacement drainer
  crit: hostile
  conf: 0.985
  all:
  - id: micro-behaviors/communications/blockchain/defi-platform::defi-platform-name-cluster
  - id: micro-behaviors/data/format/crypto-address::multi-crypto-regex
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::transaction-data-address-rewrite
  - id: micro-behaviors/communications/http/intercept::request-interceptor
- id: transaction-data-address-rewrite
  desc: Crypto address regex replacement
  crit: suspicious
  conf: 0.94
  any:
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::transaction-data-address-rewrite--rx-16
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::transaction-data-address-rewrite--rx-17
