defaults:
  platforms:
  - windows
  - unix
  attack: T1565.001
  mbc: E1485
  for:
  - python
  crit: suspicious
traits:
- id: reward-recipient-override--rx-1
  desc: Regex component marker
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: (withdraw|claim).{0,80}(validator|delegator).{0,120}(recipient|address)
- id: reward-recipient-override--rx-2
  desc: Regex component marker
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: (withdraw|claim).{0,80}(reward|delegator|validator).{0,120}(recipient|withdraw_address)
composite_rules:
- id: python-staking-reward-redirection
  desc: Python staking reward redirection
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/data/transaction/submit::cosmos-staking-reward-claim-flow
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::reward-recipient-override
- id: reward-recipient-override
  desc: Reward recipient override
  crit: suspicious
  conf: 0.9
  any:
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::reward-recipient-override--rx-1
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::reward-recipient-override--rx-2
