defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  conf: 0.97
composite_rules:
- id: crypto-function-dispatch-rewriter
  desc: Crypto replacement code with call/apply hooks
  crit: hostile
  attack: T1565.003
  near_bytes: 16000
  all:
  - id: micro-behaviors/process/hook/browser::function-call-override
  - id: micro-behaviors/process/hook/browser::function-apply-array-transform
  - id: micro-behaviors/data/format/crypto-address::single-chain-address-regex
  - id: micro-behaviors/data/format/crypto-address::hardcoded-btc-addr
  - id: micro-behaviors/data/string/replace::variable-pattern-callback-replacement
- id: crypto-copy-event-rewriter
  desc: Crypto replacement intercepts copied text
  crit: hostile
  attack: T1115,T1565.003
  near_bytes: 16000
  all:
  - id: objectives/impact/crypto-manipulation/hijack-transfer/address::crypto-function-dispatch-rewriter
  - id: micro-behaviors/os/clipboard/write::browser-clipboarddata-setdata
  - id: micro-behaviors/os/clipboard/event::browser-copy-cut-event-handler
