defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: browser-copy-event-wallet-rewrite
    desc: Copy interception and wallet replacement code
    crit: hostile
    conf: 0.97
    attack: T1115,T1565.001
    scope: leaf
    all:
      - id: micro-behaviors/data/format/crypto-address::single-chain-address-regex
      - id: micro-behaviors/data/string/replace::variable-pattern-callback-replacement
      - id: micro-behaviors/os/clipboard/event::browser-copy-cut-event-handler
      - id: micro-behaviors/os/clipboard/write::browser-clipboarddata-setdata
      - id: micro-behaviors/ui/window/event::browser-prevent-default-call
    any:
      - id: micro-behaviors/data/format/crypto-address::ethereum-address-literal
      - id: micro-behaviors/data/format/crypto-address::hardcoded-btc-addr
      - id: micro-behaviors/data/format/crypto-address::hardcoded-tron-address-reference

