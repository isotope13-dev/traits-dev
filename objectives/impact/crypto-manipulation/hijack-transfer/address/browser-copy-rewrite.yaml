defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

# Anonymous callbacks do not expose value-flow facts. Bind the regex, fixed
# destination, replacement result, and event receiver in one syntax match.
# Whole-bundle co-occurrence joins ordinary copy helpers with wallet SDKs.
traits:
  - id: browser-copy-bound-wallet-replacement
    desc: Copy handler writes substituted wallet text
    crit: component
    if:
      type: tree-sitter
      query: |
        ((_
          [(lexical_declaration (variable_declarator name: (identifier) @pattern
             value: (regex) @regex))
           (variable_declaration (variable_declarator name: (identifier) @pattern
             value: (regex) @regex))]
          [(lexical_declaration (variable_declarator name: (identifier) @wallet
             value: (string) @address))
           (variable_declaration (variable_declarator name: (identifier) @wallet
             value: (string) @address))]
          (expression_statement (call_expression
            function: (member_expression property: (property_identifier) @listen)
            arguments: (arguments . (string) @event .
              (_ [(formal_parameters (identifier) @ev) (identifier) @ev]
                body: (statement_block
                  [(lexical_declaration (variable_declarator name: (identifier) @text
                     value: (call_expression
                       function: (member_expression property: (property_identifier) @replace)
                       arguments: (arguments . (identifier) @used_pattern .
                         (_ body: [(identifier) @destination
                           (ternary_expression consequence: (identifier) @destination)
                           (statement_block (return_statement
                             [(identifier) @destination
                              (ternary_expression consequence: (identifier) @destination)]))])))))
                   (variable_declaration (variable_declarator name: (identifier) @text
                     value: (call_expression
                       function: (member_expression property: (property_identifier) @replace)
                       arguments: (arguments . (identifier) @used_pattern .
                         (_ body: [(identifier) @destination
                           (ternary_expression consequence: (identifier) @destination)
                           (statement_block (return_statement
                             [(identifier) @destination
                              (ternary_expression consequence: (identifier) @destination)]))])))))]
                  (expression_statement (call_expression
                    function: (member_expression
                      object: (member_expression object: (identifier) @writer
                        property: (property_identifier) @clipboard)
                      property: (property_identifier) @set)
                    arguments: (arguments . (string) @mime . (identifier) @output)) @evidence)
                ))))))
          (#eq? @listen "addEventListener")
          (#match? @event "^['\"](copy|cut)['\"]$")
          (#match? @replace "^replace(All)?$")
          (#eq? @pattern @used_pattern) (#eq? @wallet @destination)
          (#eq? @text @output) (#eq? @ev @writer)
          (#eq? @clipboard "clipboardData") (#eq? @set "setData")
          (#match? @mime "^['\"]text/plain['\"]$")
          (#match? @regex "0x|bc1|a-km-z|1-9A-HJ")
          (#match? @address "^['\"](0x|bc1|[13T])[a-zA-Z0-9]{25,59}['\"]$")
          (#not-match? @address "(?i)^['\"]0x(0{40}|0{36}dead)['\"]$"))

composite_rules:
  # These remain neutral clues until the bound syntax match proves that a
  # replacement reaches the clipboard. No preventDefault call is required.
  - id: browser-address-replacement-call
    desc: Replaces text through a callback or keyed table
    crit: component
    any:
      - id: micro-behaviors/data/string/replace::variable-pattern-callback-replacement
      - id: micro-behaviors/data/string/replace::keyed-replacement-call

  - id: browser-copy-address-pattern
    desc: Copy replacement uses an address recognition pattern
    crit: component
    any:
      - id: micro-behaviors/data/format/crypto-address::single-chain-address-regex
      - id: micro-behaviors/data/format/crypto-address::btc-base58-range-regex

  - id: browser-copy-event-wallet-rewrite
    desc: Copy handler substitutes a fixed wallet address
    crit: hostile
    conf: 0.97
    attack: T1115,T1565.001
    scope: leaf
    all:
      - id: browser-copy-bound-wallet-replacement
      - id: browser-copy-address-pattern
      - id: browser-address-replacement-call
      - id: micro-behaviors/os/clipboard/event::browser-copy-cut-event-handler
      - id: micro-behaviors/os/clipboard/write::browser-clipboarddata-setdata
    any:
      - id: micro-behaviors/data/format/crypto-address::ethereum-address-literal
      - id: micro-behaviors/data/format/crypto-address::hardcoded-btc-addr
      - id: micro-behaviors/data/format/crypto-address::hardcoded-tron-address-reference

