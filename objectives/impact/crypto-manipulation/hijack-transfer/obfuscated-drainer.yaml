# A wallet drainer hidden in a library that has no business touching wallets.
#
# The September 2025 npm compromise put this in `ansi-styles`, `chalk` and
# `debug` — terminal-colour utilities with hundreds of millions of weekly
# downloads. The injected bundle hooks the page's wallet provider and rewrites
# the destination of transactions the user is already approving, so the victim
# signs a transfer they initiated and the funds go elsewhere. Nothing prompts,
# because the user did.
#
# The convicting combination is the ERC-20 *approval and transfer surface* —
# `approve`, `transfer`, `transferFrom` together — inside a bundle that has been
# put through js-obfuscator's string-table rotation. Each method name alone is
# ordinary in web3 code; all three at once describe the ability to move a
# victim's tokens rather than to read a balance. And a genuine web3 SDK ships
# minified, not name-mangled with a rotating string table: that packer's whole
# purpose is to stop a reader recognising exactly these names.
#
# Keyed on the capability rather than on the addresses or the campaign's
# strings, so the next injection into the next popular package lands here even
# with a fresh wallet and a re-run packer.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1565.001
  mbc: B0028

composite_rules:
  - id: obfuscated-erc20-transfer-surface
    desc: Obfuscated bundle wields the ERC-20 transfer API
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/data/transaction/authorize::erc20-approve
      - id: micro-behaviors/data/transaction/construct::erc20-transfer
      - id: micro-behaviors/data/transaction/construct::erc20-transferFrom
    needs: 1
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
  # The signing-path half of the same injection: the bundle replaces the
  # provider's request/send/sendAsync methods and mutates the transaction
  # before the wallet signs — `tx.to`, the approve/permit spender, the
  # transfer recipient. Under a string-table packer none of that reads as
  # source, but the packer leaves its fingerprints: the RPC method names
  # survive only as quoted fragments ('eth_sendTr'+'ansaction'), which no
  # minifier produces, beside the raw approve selector. A bundle that both
  # initiates wallet transactions and carries approval calldata while hiding
  # both is the destination-hijack toolkit, distinct from the response-rewrite
  # technique above — either half can ship without the other.
  - id: obfuscated-wallet-rpc-approval-surface
    desc: Obfuscated wallet RPC and approval surface
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/communications/rpc::wallet-provider-split-rpc-names
      - id: micro-behaviors/data/transaction/authorize::erc20-approve
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
