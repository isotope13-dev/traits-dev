# The fields and WebRTC API alone also belong to legitimate wallet SDKs.
# They establish an unusual profile, not a proven transaction or signature
# transfer. Hostility requires the unrelated published carousel facade.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: obfuscated-webrtc-wallet-signature-relay
    desc: Obfuscated WebRTC and wallet signing records
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/proxy/turn::webrtc-peer-connection-api
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-mangled-bracket-rotation
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-mangled-parseint-rotation-guard
      - id: metadata/lang/source/syntax/object::token-spender-value-fields
      - id: metadata/lang/source/syntax/object::signature-transaction-fields
  - id: carousel-conceals-wallet-control-profile
    desc: Carousel conceals WebRTC wallet control code
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1657
    for: [npm, tar, zip, gz, xz, package.json, javascript, typescript]
    scope: package
    all:
      - id: obfuscated-webrtc-wallet-signature-relay
      - id: metadata/package/description/function::description-declares-carousel-component
