# Wallet signing events relayed through an obfuscated WebRTC service are
# distinct from ordinary browser-wallet integrations: the bundle receives
# token/spender/value requests and returns signatures and transaction IDs.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1657,T1565.001

traits:
  - id: wallet-token-spender-value-request
    desc: Wallet request names token, spender, value
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'token.?:\s*[\w$]+,?\s*spender.?:\s*[\w$]+,?\s*value.?:'
  - id: wallet-signature-transaction-response
    desc: Wallet signature returns txHash or chain ID
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'signature.?:\s*[\w$]+[\s\S]{0,240}(txHash|chainId).?:'
composite_rules:
  - id: obfuscated-webrtc-wallet-request-relay
    desc: Relays wallet spending requests over WebRTC
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/proxy/turn::webrtc-peer-connection-api
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-mangled-bracket-rotation
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-mangled-parseint-rotation-guard
      - id: wallet-token-spender-value-request
  - id: obfuscated-webrtc-wallet-signature-return
    desc: Returns wallet signatures through WebRTC
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/proxy/turn::webrtc-peer-connection-api
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-mangled-bracket-rotation
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-mangled-parseint-rotation-guard
      - id: wallet-signature-transaction-response
  - id: obfuscated-webrtc-wallet-signature-relay
    desc: Obfuscated WebRTC service relays wallet signing events
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/proxy/turn::webrtc-peer-connection-api
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-mangled-bracket-rotation
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-mangled-parseint-rotation-guard
      - id: wallet-token-spender-value-request
      - id: wallet-signature-transaction-response
