# The bundle hides a remote Solana wallet transaction relay inside a
# Base64 -> URI-encoded hex -> eval wrapper. The markers below are encoded
# fragments from its custom relay host and wallet-signing flow.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: vhoiro-relay-host-encoded
    desc: Encoded vhoiro wallet relay host
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: Njg3NDc0NzA3MzNhMmYyZjc2Njg2ZjY5NzI2ZjJlNjI2NTc0
  - id: vhoiro-relay-signing-api-encoded
    desc: Encoded wallet transaction signing API
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: NzM2OTY3NmU1NDcyNjE2ZTczNjE2Mzc0Njk2ZjZl
  - id: vhoiro-relay-public-key-encoded
    desc: Encoded wallet public key field
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: NzA3NTYyNmM2OTYzNGI2NTc5
  - id: vhoiro-relay-nested-eval-wrapper
    desc: Evaluates a nested hex-decoded Base64 payload
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'eval\s*\(\s*_eval\s*\('

composite_rules:
  - id: obfuscated-solana-vhoiro-wallet-relay
    desc: Obfuscated Solana wallet signing relay to vhoiro
    crit: hostile
    conf: 0.995
    attack: T1657,T1041
    all:
      - id: vhoiro-relay-host-encoded
      - id: vhoiro-relay-signing-api-encoded
      - id: vhoiro-relay-public-key-encoded
      - id: vhoiro-relay-nested-eval-wrapper
