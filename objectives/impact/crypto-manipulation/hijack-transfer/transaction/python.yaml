defaults:
  platforms:
  - windows
  - unix
  attack: T1565.001
  mbc: E1485
  for:
  - python
  crit: suspicious
composite_rules:
- id: substrate-transfer-hijack
  desc: Substrate transfer to a fixed account, signed and broadcast
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/data/transaction/construct::ss58-transfer-dest-literal
  - id: metadata/lang/source/naming/action/function-name::create-from-secret-name-text
  - id: micro-behaviors/data/transaction/submit::substrate-extrinsic-submit
- id: python-wallet-sign-and-broadcast
  desc: Python wallet sign and broadcast
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/data/transaction/sign::web3-sign-transaction
  - id: micro-behaviors/data/transaction/submit::web3-send-raw-transaction
  any:
  - id: micro-behaviors/data/transaction/construct::web3-build-transaction
  - id: micro-behaviors/communications/blockchain/client::staking-sign-flow
