defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: vhoiro-relay-host-encoded
  desc: Encoded vhoiro wallet relay host
  crit: suspicious
  conf: 0.99
  if:
    type: text
    substr: Njg3NDc0NzA3MzNhMmYyZjc2Njg2ZjY5NzI2ZjJlNjI2NTc0
- id: vhoiro-relay-signing-api-encoded
  desc: Encoded wallet transaction signing API
  crit: suspicious
  conf: 0.97
  if:
    type: text
    substr: NzM2OTY3NmU1NDcyNjE2ZTczNjE2Mzc0Njk2ZjZl
- id: vhoiro-relay-public-key-encoded
  desc: Encoded wallet public key field
  crit: suspicious
  conf: 0.9
  if:
    type: text
    substr: NzA3NTYyNmM2OTYzNGI2NTc5
- id: vhoiro-relay-nested-eval-wrapper
  desc: Evaluates a nested hex-decoded Base64 payload
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: eval\s*\(\s*_eval\s*\(
composite_rules:
- id: obfuscated-solana-vhoiro-wallet-relay
  desc: Obfuscated Solana wallet signing relay to vhoiro
  crit: hostile
  conf: 0.995
  attack: T1657,T1041
  all:
  - id: objectives/impact/crypto-manipulation/hijack-transfer/transaction::vhoiro-relay-host-encoded
  - id: objectives/impact/crypto-manipulation/hijack-transfer/transaction::vhoiro-relay-signing-api-encoded
  - id: objectives/impact/crypto-manipulation/hijack-transfer/transaction::vhoiro-relay-public-key-encoded
  - id: objectives/impact/crypto-manipulation/hijack-transfer/transaction::vhoiro-relay-nested-eval-wrapper
- id: obfuscated-solana-vhoiro-wallet-relay-carrier
  desc: Encoded JavaScript carrier contains the vhoiro wallet relay markers
  crit: hostile
  conf: 0.995
  attack: T1657,T1041
  all:
  - id: objectives/anti-static/obfuscation/payload/data-file::javascript-standalone-base64-carrier
  - id: objectives/impact/crypto-manipulation/hijack-transfer/transaction::vhoiro-relay-nested-eval-wrapper
  - id: objectives/impact/crypto-manipulation/hijack-transfer/transaction::vhoiro-relay-public-key-encoded
- id: npm-archive-obfuscated-solana-vhoiro-wallet-relay
  desc: npm archive contains an obfuscated Solana wallet transaction relay
  crit: hostile
  conf: 0.995
  attack: T1657,T1041,T1195.002
  for:
  - zip
  - javascript
  scope: archive
  all:
  - id: objectives/impact/crypto-manipulation/hijack-transfer/transaction::obfuscated-solana-vhoiro-wallet-relay-carrier
  - id: metadata/archive/member/extension::archive-js-member
