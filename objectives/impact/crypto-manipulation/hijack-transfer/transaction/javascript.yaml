  - id: objectives/impact/crypto-manipulation/hijack-transfer/transaction::wallet-sign-and-broadcast
  - id: objectives/impact/crypto-manipulation/hijack-transfer/transaction::cosmos-withdraw-reward-msg
  - id: micro-behaviors/ui/controls/wallet::reward-balance-display-text
- id: env-wallet-transfer-drain
