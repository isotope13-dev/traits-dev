# Browser-side wallet drainers and clipboard clippers all need the same two
# things: a way to recognise a wallet address anywhere in the data flowing past
# them, and a choke point to rewrite what they find. The 2025 Qix/chalk npm
# compromise is the canonical shape -- seven chain patterns behind a patched
# `XMLHttpRequest.prototype.send`, so every response the page received was
# rewritten before the application saw it.
#
# One address pattern is ordinary: a wallet library, a validator and a block
# explorer all carry one. Matchers for several unrelated chains in one file are
# not -- nothing legitimate needs to recognise Bitcoin, Tron and Solana in the
# same breath except code scanning arbitrary data for money, or a security
# scanner enumerating what it hunts for (softened by the downgrade below).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, php, ruby, shell, go, rust]
  attack: T1565.002
  mbc: E1565

composite_rules:
  # Grouped by chain family so the table below references three matchers rather
  # than nine, and so an analyst sees which families a file can recognise.
  - id: btc-family-address-matcher
    desc: Matches Bitcoin-family addresses
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/data/format/crypto-address::btc-base58-range-regex
      - id: micro-behaviors/data/format/crypto-address::btc-bech32-regex
      - id: micro-behaviors/data/format/crypto-address::bch-address-regex
  - id: account-model-address-matcher
    desc: Matches account-model chain addresses
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/data/format/crypto-address::eth-address-regex
      - id: micro-behaviors/data/format/crypto-address::trx-address-regex
      - id: micro-behaviors/data/format/crypto-address::sol-address-regex
  - id: altcoin-address-matcher
    desc: Matches alternative-coin addresses
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/data/format/crypto-address::ltc-address-regex
      - id: micro-behaviors/data/format/crypto-address::xmr-address-regex
      - id: micro-behaviors/data/format/crypto-address::doge-address-regex

  - id: multi-chain-address-matcher-table
    desc: Address matchers for several chains
    crit: suspicious
    conf: 0.92
    scope: file
    any:
      - id: btc-family-address-matcher
      - id: account-model-address-matcher
      - id: altcoin-address-matcher
    needs: 2
    unless:
      # Test-file guards, deliberately NOT the fixture-directory context:
      # the validation corpus itself lives under testdata/, and a directory
      # reference here would suppress the rule on every fixture too.
      - id: metadata/package/testing/presence/harness::test-directory
      - id: "metadata/file/naming::test-directory-component"
      - id: well-known/app/finance/myetherwallet/
    # DLP / PII-redaction detector tables (Zuplo's runtime redactor) list a
    # "crypto wallet" pattern beside IBAN, SSN and passport patterns: they
    # classify data, they do not hunt for money. A downgrade, not an unless, so
    # the table still feeds the hostile rewrite composites below -- a clipper
    # that pastes an IBAN and SSN regex in to look like DLP is still caught
    # when it hooks a response or the clipboard.
    downgrade:
      any:
        - id: micro-behaviors/data/format/pii::pii-identifier-regex-catalog
        # An OSINT / threat-intel tool types a query by matching it against a
        # table of CVE, digest and address patterns; the address rows are one
        # kind of entity among several, not the target of a rewrite.
        - id: micro-behaviors/data/format/threat-intel::threat-intel-entity-regex-catalog
        # A wallet SDK's isAddress() switch validates one address for a CAIP
        # namespace (eip155, then solana or bip122). That is not a scan of
        # arbitrary data. Downgrade, same as the DLP catalog above, so a
        # clipper that also pastes this helper still feeds the rewrite
        # composites.
        - type: text
          regex: 'isAddress\(.{0,40}eip155.{0,400}bip122'
        # A security scanner's detection-rule table states attack patterns
        # as data with severity verdicts. Downgrade, same as above, so a
        # clipper hiding rule-spec rows beside its hooks still feeds the
        # rewrite composites.
        - id: well-known/tool/detection/pattern-catalog::detection-rulespec-table
  - id: hooked-response-address-rewrite
    desc: Network hook scans responses for wallets
    crit: hostile
    conf: 0.96
    scope: file
    for: [javascript, typescript]
    all:
      - id: multi-chain-address-matcher-table
      - id: micro-behaviors/process/hook/xhr/
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"

# Cache-probe comment (no semantic change).
