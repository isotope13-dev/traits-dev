defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1565.002
  mbc: E1565

composite_rules:
  # Keep the network-hook signal distinct from the ERC-20 and provider-RPC
  # rules below. Together, a patched fetch path, address matching, and a
  # rotating obfuscator identify the wallet-address traffic manipulation
  # pattern without depending on the drainer kit's names or specific wallets.
  - id: obfuscated-wallet-http-hook-address-matchers
    desc: Obfuscated HTTP hook with cryptocurrency address matchers
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/process/hook/xhr::fetch-hook
      - id: micro-behaviors/data/format/crypto-address::single-chain-address-regex
    needs: 1
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern

  - id: hooked-response-address-rewrite
    desc: Network hook with wallet address matchers
    crit: hostile
    conf: 0.96
    scope: file
    # 16 KB, not 8 KB: a js-obfuscator bundle (the September 2025 npm
    # compromise shape) minifies to one line and lays its address-regex table
    # ~11 KB past the fetch/XHR hook it serves, so the old window missed the
    # rule on exactly the artifact class it exists to catch. The bind still
    # keeps both legs inside one injected payload region of one file.
    near_bytes: 16384
    all:
      - id: micro-behaviors/data/format/crypto-address::multi-chain-address-matchers
      - id: micro-behaviors/process/hook/xhr/
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
      # A rewrite aimed at a globally published example or burn address pays
      # nobody: the file demonstrates the interception shape with placeholder
      # destinations rather than stealing funds to an attacker wallet.
      - id: micro-behaviors/data/format/crypto-address::example-btc-unspendable-address
      - id: micro-behaviors/data/format/crypto-address::example-eth-zero-burn-address

  # The generic rewrite rule identifies the behavior. Routine names associated
  # with a wallet-drainer kit add a separate, useful signature for this variant.
  - id: drainer-kit-response-rewrite
    desc: Drainer-kit routines accompany wallet-response rewriting
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: objectives/credential-access/wallet/provider::drainer-function-names
      - id: hooked-response-address-rewrite

# Cache-probe comment (no semantic change).
