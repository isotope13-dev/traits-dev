defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  attack: T1565.002
  mbc: E1565
  crit: hostile
composite_rules:
- id: obfuscated-wallet-http-hook-address-matchers
  desc: Obfuscated HTTP hook with cryptocurrency address matchers
  conf: 0.93
  all:
  - id: micro-behaviors/communications/http/intercept::fetch-hook
  - id: micro-behaviors/data/format/crypto-address::single-chain-address-regex
  needs: 1
  any:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
  - id: micro-behaviors/data/collection/array::js-bracket-push-shift-call-text
- id: hooked-response-address-rewrite
  desc: Network hook with wallet address matchers
  conf: 0.96
  scope: file
  near_bytes: 16384
  all:
  - id: micro-behaviors/data/format/crypto-address::multi-chain-address-matchers
  - id: metadata/file/profile/operation-reference::http-interception-reference
  unless:
  - id: metadata/path/directory::test-directory-component
  - id: micro-behaviors/data/format/crypto-address::example-btc-unspendable-address
  - id: micro-behaviors/data/format/crypto-address::example-eth-zero-burn-address
- id: drainer-kit-response-rewrite
  desc: Drainer-kit routines accompany wallet-response rewriting
  conf: 0.96
  scope: file
  all:
  - id: objectives/credential-access/wallet/provider::drainer-function-names
  - id: hooked-response-address-rewrite
