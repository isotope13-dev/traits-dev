defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1565.002
  mbc: E1565

composite_rules:
  - id: hooked-response-address-rewrite
    desc: Network hook with wallet address matchers
    crit: hostile
    conf: 0.96
    scope: file
    # 16 KB, not 8 KB: a js-obfuscator bundle (the September 2025 npm
    # compromise shape) minifies to one line and lays its address-regex table
    # ~11 KB past the fetch/XHR hook it serves, so the old window missed the
    # rule on exactly the artifact class it exists to catch. The bind still
    # keeps both legs inside one injected payload region of one file.
    near_bytes: 16384
    all:
      - id: micro-behaviors/data/format/crypto-address::multi-chain-address-matcher-table
      - id: micro-behaviors/process/hook/xhr/
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
      # A rewrite aimed at a globally published example or burn address pays
      # nobody: the file demonstrates the interception shape with placeholder
      # destinations rather than stealing funds to an attacker wallet.
      - id: micro-behaviors/data/format/crypto-address::example-btc-unspendable-address
      - id: micro-behaviors/data/format/crypto-address::example-eth-zero-burn-address

# Cache-probe comment (no semantic change).
