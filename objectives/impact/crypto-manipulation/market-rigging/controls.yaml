# The report specifies configurable win rates, forced losses, and a withdrawal
# funnel cycling fabricated refusal pretexts. No campaign names, domains,
# component names, localized UI copy, or source filenames gate these rules.
# Source: https://www.recordedfuture.com/research/prediction-markets-traffer-teams
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, go]
  conf: 0.94
  attack: T1657

composite_rules:
  - id: account-forced-loss-settlement
    desc: Balance settlement exposes win-rate and forced-loss controls
    crit: suspicious
    all:
      - id: micro-behaviors/data/transaction/settle::win-probability-member
      - id: micro-behaviors/data/transaction/settle::forced-loss-member
      - id: micro-behaviors/data/transaction/settle::balance-adjustment

  - id: rigged-market-with-withdrawal-trap
    desc: Forced-loss settlement accompanies a staged withdrawal refusal funnel
    crit: hostile
    conf: 0.98
    all:
      - id: account-forced-loss-settlement
      - id: objectives/impact/crypto-manipulation/withdrawal-trap::escalating-withdrawal-refusals
