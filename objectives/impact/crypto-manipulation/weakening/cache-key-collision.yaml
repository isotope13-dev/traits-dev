# Detects exploit code for security-verification caches whose digest input is an
# undelimited concatenation of attacker-controlled fields.  A valid tuple primes
# the cache; a distinct tuple formed by shifting field boundaries has the same
# byte stream and reuses the cached success for an invalid proof.
defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, typescript]
  attack: T1565.001

traits:
  - id: python-digest-call-with-proof
    desc: Hashes a proof-context input
    crit: component
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(?is)\b(hash|digest|sha-?256)\s*\(.{0,180}\bproof\w*'

  - id: proof-before-commitment
    desc: Orders proof before commitment
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bproof\w*.{0,100}\bcommit\w*'

  - id: commitment-before-generator
    desc: Orders commitment before generator
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bcommit\w*.{0,100}\b(asset|generator)\w*'

  - id: generator-before-script
    desc: Orders generator before script
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?is)\b(asset|generator)\w*.{0,100}\bscript\w*'

  - id: javascript-sha256-constructor
    desc: Constructs a SHA-256 hash
    crit: component
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\bcreateHash\s*\(\s*["'']sha-?256["'']\s*\)'

  - id: javascript-buffer-concat-hash-update
    desc: Updates a hash from concatenated buffers
    crit: component
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\.update\s*\(\s*(Buffer\.)?concat\s*\(\s*\['

  - id: python-proof-plus-commitment
    desc: Appends commitment bytes to proof
    crit: component
    conf: 0.97
    for: [python]
    if:
      type: text
      regex: '(?i)\b\w*proof\w*\s*=\s*\w*proof\w*\s*\+\s*\w*commit\w*'

  - id: python-generator-plus-script-prefix
    desc: Appends generator and script-prefix bytes
    crit: component
    conf: 0.97
    for: [python]
    if:
      type: text
      regex: '(?i)\b\w*(asset|generator)\w*\s*\+\s*\w*script\w*\s*\[\s*:\s*\w+\s*\]'

  - id: javascript-proof-buffer-concat
    desc: Reassigns proof from buffer concatenation
    crit: component
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\b\w*proof\w*\s*=\s*(Buffer\.)?concat\s*\(\s*\['

  - id: javascript-proof-commitment-elements
    desc: Places proof before commitment element
    crit: component
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\b\w*proof\w*\s*,\s*\w*commit\w*\s*,'

  - id: javascript-generator-script-elements
    desc: Places generator before script element
    crit: component
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\b\w*(asset|generator)\w*\s*,\s*\w*script\w*\.'

  - id: javascript-script-prefix-slice
    desc: Slices a script prefix from zero
    crit: component
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\.(slice|subarray)\s*\(\s*0\s*,\s*\w+\s*\)'

  - id: python-commitment-from-script-slice
    desc: Slices commitment bytes from script
    crit: component
    conf: 0.97
    for: [python]
    if:
      type: text
      regex: '(?i)\b\w*commit\w*\s*=\s*\w*script\w*\s*\[[^\]\n]{0,100}\]'

  - id: python-generator-from-script-slice
    desc: Slices generator bytes from script
    crit: component
    conf: 0.97
    for: [python]
    if:
      type: text
      regex: '(?i)\b\w*(asset|generator)\w*\s*=\s*\w*script\w*\s*\[[^\]\n]{0,120}\]'

  - id: python-script-from-script-slice
    desc: Reassigns script from its suffix
    crit: component
    conf: 0.97
    for: [python]
    if:
      type: text
      regex: '(?i)\b\w*script\w*\s*=\s*\w*script\w*\s*\[[^\]\n]{0,120}\]'

  - id: javascript-commitment-from-script-slice
    desc: Slices commitment bytes from script
    crit: component
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\b\w*commit\w*\s*=\s*\w*script\w*\.(slice|subarray)\s*\('

  - id: javascript-generator-from-script-slice
    desc: Slices generator bytes from script
    crit: component
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\b\w*(asset|generator)\w*\s*=\s*\w*script\w*\.(slice|subarray)\s*\('

  - id: javascript-script-from-script-slice
    desc: Reassigns script from its suffix
    crit: component
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\b\w*script\w*\s*=\s*\w*script\w*\.(slice|subarray)\s*\('

  - id: python-distinct-proof-tuple-assertion
    desc: Asserts distinct proof tuples
    crit: component
    conf: 0.98
    for: [python]
    if:
      type: text
      regex: '(?i)assert\s+\w*(prime|valid)\w*\s*!=\s*\w*(forg|attack|invalid)\w*'

  - id: python-cache-key-equality-assertion
    desc: Begins cache-key equality assertion
    crit: component
    conf: 0.98
    for: [python]
    if:
      type: text
      regex: '(?i)assert\s+\w*(cache|digest|hash|key)\w*\s*\('

  - id: python-equal-cache-key-call
    desc: Compares another cache-key call equally
    crit: component
    conf: 0.98
    for: [python]
    if:
      type: text
      regex: '(?i)\)\s*==\s*\w*(cache|digest|hash|key)\w*\s*\('

  - id: javascript-distinct-proof-inequality
    desc: Compares distinct proof tuples
    crit: component
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\w*(prime|valid)\w*\s*!==?\s*\w*(forg|attack|invalid)\w*'

  - id: javascript-cache-key-equality-assertion
    desc: Begins cache-key equality assertion
    crit: component
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)(assert|console\.assert)\s*\(\s*\w*(cache|digest|hash|key)\w*\s*\('

  - id: javascript-equal-cache-key-call
    desc: Compares another cache-key call equally
    crit: component
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\)\.equals\s*\(\s*\w*(cache|digest|hash|key)\w*\s*\('

  - id: valid-primer-call
    desc: Calls verification with valid context
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '(?i)\b(accept|verify|validate)\s*\([^;\n]{0,180}\b\w*valid\w*\s*[:=]\s*true'

  - id: invalid-replay-call
    desc: Calls verification with invalid context
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '(?i)\b(accept|verify|validate)\s*\([^;\n]{0,180}\b\w*valid\w*\s*[:=]\s*false'

  - id: valid-context-before-invalid
    desc: Orders valid context before invalid
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '(?is)\b\w*valid\w*\s*[:=]\s*true.{0,240}\b\w*valid\w*\s*[:=]\s*false'

composite_rules:
  - id: python-undelimited-proof-context-digest
    desc: Hashes an ordered Python proof-context tuple
    crit: notable
    conf: 0.94
    for: [python]
    all:
      - id: python-digest-call-with-proof
      - id: proof-before-commitment
      - id: commitment-before-generator
      - id: generator-before-script
    near_bytes: 600
    near_lines: 12

  - id: javascript-undelimited-proof-context-digest
    desc: Hashes an ordered JavaScript proof-context tuple
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    all:
      - id: javascript-sha256-constructor
      - id: javascript-buffer-concat-hash-update
      - id: proof-before-commitment
      - id: commitment-before-generator
      - id: generator-before-script
    near_bytes: 700
    near_lines: 12

  - id: python-proof-tail-field-splice
    desc: Extends a Python proof across context boundaries
    crit: suspicious
    conf: 0.97
    for: [python]
    all:
      - id: python-proof-plus-commitment
      - id: python-generator-plus-script-prefix
    near_bytes: 256
    near_lines: 2

  - id: javascript-proof-tail-field-splice
    desc: Extends a JavaScript proof across context boundaries
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    all:
      - id: javascript-proof-buffer-concat
      - id: javascript-proof-commitment-elements
      - id: javascript-generator-script-elements
      - id: javascript-script-prefix-slice
    near_bytes: 320
    near_lines: 2

  - id: python-fixed-width-context-repartition
    desc: Repartitions Python script bytes across context fields
    crit: suspicious
    conf: 0.97
    for: [python]
    all:
      - id: python-commitment-from-script-slice
      - id: python-generator-from-script-slice
      - id: python-script-from-script-slice
    near_bytes: 700
    near_lines: 8

  - id: javascript-fixed-width-context-repartition
    desc: Repartitions JavaScript script bytes across context fields
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    all:
      - id: javascript-commitment-from-script-slice
      - id: javascript-generator-from-script-slice
      - id: javascript-script-from-script-slice
    near_bytes: 800
    near_lines: 8

  - id: python-distinct-proof-tuples-same-key
    desc: Asserts distinct Python proof tuples share a cache key
    crit: suspicious
    conf: 0.98
    for: [python]
    all:
      - id: python-distinct-proof-tuple-assertion
      - id: python-cache-key-equality-assertion
      - id: python-equal-cache-key-call
    near_bytes: 500
    near_lines: 6

  - id: javascript-distinct-proof-tuples-same-key
    desc: Asserts distinct JavaScript proof tuples share a cache key
    crit: suspicious
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: javascript-distinct-proof-inequality
      - id: javascript-cache-key-equality-assertion
      - id: javascript-equal-cache-key-call
    near_bytes: 650
    near_lines: 6

  - id: valid-primer-invalid-replay
    desc: Replays invalid context after valid cache primer
    crit: suspicious
    conf: 0.98
    all:
      - id: valid-primer-call
      - id: invalid-replay-call
      - id: valid-context-before-invalid
    near_bytes: 700
    near_lines: 12

  - id: undelimited-proof-context-digest
    desc: Hashes an undelimited cryptographic proof and validation-context tuple
    crit: notable
    conf: 0.94
    any:
      - id: python-undelimited-proof-context-digest
      - id: javascript-undelimited-proof-context-digest

  - id: proof-tail-field-splice
    desc: Extends a proof across adjacent validation-field boundaries
    crit: suspicious
    conf: 0.97
    any:
      - id: python-proof-tail-field-splice
      - id: javascript-proof-tail-field-splice

  - id: fixed-width-context-repartition
    desc: Repartitions script bytes into fixed-width proof-context fields
    crit: suspicious
    conf: 0.97
    any:
      - id: python-fixed-width-context-repartition
      - id: javascript-fixed-width-context-repartition

  - id: distinct-proof-tuples-same-key
    desc: Demonstrates distinct proof tuples producing the same cache key
    crit: suspicious
    conf: 0.98
    any:
      - id: python-distinct-proof-tuples-same-key
      - id: javascript-distinct-proof-tuples-same-key

  - id: undelimited-validation-key-boundary-collision
    desc: Collides cache keys by shifting proof fields
    crit: hostile
    conf: 0.99
    all:
      - id: undelimited-proof-context-digest
      - id: proof-tail-field-splice
      - id: fixed-width-context-repartition
      - id: distinct-proof-tuples-same-key
    near_lines: 60

  - id: cryptographic-verification-cache-poisoning
    desc: Primes cache for a distinct invalid proof
    crit: hostile
    conf: 0.99
    all:
      - id: undelimited-validation-key-boundary-collision
      - id: valid-primer-invalid-replay
