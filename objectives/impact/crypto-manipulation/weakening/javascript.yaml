defaults:
  platforms: [panos, appliance, unix]
  for: [javascript, typescript]
  attack: T1565.001

traits:
  - id: node-createhash-monkeypatch
    desc: Node createHash monkeypatch
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'crypto\.createHash\s*=\s*\('
    unless:
      # A polyfill that only fills absent APIs (`if (!crypto.getRandomValues)`)
      # provides missing functionality rather than weakening existing crypto.
      - type: text
        regex: 'if\s*\(\s*!crypto\.(getRandomValues|randomUUID|createHash|createHmac)\s*\)'
      # An OpenSSL 3 / Node 17+ compatibility shim upgrading legacy md4 or md5
      # to sha256 provides compatibility rather than weakening crypto.
      - type: text
        regex: '(?i)(md4|md5)[\s\S]{0,100}sha(256|512)'

  - id: node-sha256-md5-downgrade
    desc: Node SHA256 downgraded to MD5
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: "sha256'?:\\s*'md5'"

  - id: node-randombytes-bufferalloc
    desc: Node randomBytes Buffer.alloc
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'crypto\.randomBytes\s*=[\s\S]{0,220}Buffer\.alloc'

  - id: crypto-rng-size-gated-diversion
    desc: Size-gated random buffer diversion
    crit: notable
    conf: 0.95
    platforms: [windows, unix]
    attack: T1600.001
    if:
      type: text
      regex: 'if\s*\(\s*size\s*>=\s*(32|64)\s*\)'

  - id: node-hmac-prng-digest-slice
    desc: Slices HMAC for random buffer
    crit: suspicious
    conf: 0.96
    platforms: [windows, unix]
    attack: T1600.001
    if:
      type: text
      regex: '\.digest\(\)\.slice\(0,\s*size\)'

  - id: browser-static-key-xor-prng
    desc: Predictable XOR replaces browser RNG
    crit: suspicious
    conf: 0.96
    platforms: [windows, unix]
    attack: T1600.001
    if:
      type: text
      regex: 'key\[[a-zA-Z0-9_$]+\s*%\s*key\.length\]\s*\^\s*seed'

composite_rules:
  - id: node-createhmac-call
    desc: Node.js HMAC construction or text call
    crit: notable
    conf: 0.93
    platforms: [windows, unix]
    any:
      - id: micro-behaviors/crypto/hash/hmac::node-createhmac
      - id: micro-behaviors/crypto/hash/hmac::node-createhmac-text-call

  - id: node-crypto-downgrade-rng
    desc: Node crypto downgrade and RNG
    crit: hostile
    conf: 0.98
    all:
      - id: node-createhash-monkeypatch
      - id: node-sha256-md5-downgrade
      - id: node-randombytes-bufferalloc

  - id: node-keyed-hmac-prng-backdoor
    desc: Keyed HMAC replaces cryptographically secure random buffer
    crit: hostile
    conf: 0.99
    platforms: [windows, unix]
    attack: T1600.001
    all:
      - id: crypto-rng-size-gated-diversion
      - id: node-hmac-prng-digest-slice
      - id: node-createhmac-call

  - id: browser-predictable-xor-prng-backdoor
    desc: Size-gated XOR keystream backdoors browser random buffer
    crit: hostile
    conf: 0.98
    platforms: [windows, unix]
    attack: T1600.001
    all:
      - id: crypto-rng-size-gated-diversion
      - id: browser-static-key-xor-prng

  - id: node-hmac-prng-counter-pid-state
    desc: Keyed HMAC uses counter and process PID as pseudorandom state
    crit: hostile
    conf: 0.98
    platforms: [windows, unix]
    attack: T1600.001
    all:
      - id: crypto-rng-size-gated-diversion
      - id: micro-behaviors/process/info/current::node-process-pid-access
      - id: node-createhmac-call

  - id: cryptographic-random-generator-dual-backdoor
    desc: Dual-environment backdoor in cryptographic random buffer generator
    crit: hostile
    conf: 0.99
    platforms: [windows, unix]
    attack: T1600.001
    all:
      - id: node-keyed-hmac-prng-backdoor
      - id: browser-predictable-xor-prng-backdoor
