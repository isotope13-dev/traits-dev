defaults:
  for: [c, markdown]
  platforms: [linux]
  attack: T1600,T1557

traits:
  - id: kernel-urandom-read-hook
    desc: Defines a kernel urandom read hook
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bhook_urandom_read_iter\s*\('
  - id: kernel-xorshift-predictable-byte
    desc: Derives replacement byte from xorshift
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(predictable_byte|random_byte)\s*=\s*[^;\n]{0,100}xorshift32\s*\('
  - id: kernel-copy-predictable-byte
    desc: Copies replacement byte into user buffer
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'copy_to_user\s*\([^;\n]{0,100}&(predictable_byte|random_byte)'
  - id: kernel-ftrace-ip-modify
    desc: Uses ftrace instruction-pointer modification
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: FTRACE_OPS_FL_IPMODIFY

composite_rules:
  - id: kernel-predictable-urandom-hook
    desc: Kernel hook replaces random bytes with predictable output
    crit: hostile
    conf: 0.99
    all:
      - id: kernel-urandom-read-hook
      - id: kernel-xorshift-predictable-byte
      - id: kernel-copy-predictable-byte
      - id: kernel-ftrace-ip-modify
