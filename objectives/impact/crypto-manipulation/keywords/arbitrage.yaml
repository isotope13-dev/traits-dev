# The arbitrage vocabulary atoms moved to well-known/lib/data/arbitrage.yaml,
# beside the market-data terms. This file's own note always described them as
# neutral trading words whose intent comes from the composites that combine
# them; at `notable` inside an impact directory they were instead reporting
# crypto manipulation for a research script that used the word twice. The
# aggregate stays here, where the crypto-manipulation reading belongs.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.5
  for: [scripts, binaries]

composite_rules:
  - id: arbitrage-terms
    desc: Arbitrage trading terms
    any:
      - id: well-known/lib/data/arbitrage
    unless:
      - id: metadata/build/bundler/vscode::vscode-js-distribution-bundle
