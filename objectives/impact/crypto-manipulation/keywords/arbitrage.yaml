# The arbitrage vocabulary atoms moved to metadata/library/finance/arbitrage.yaml,
# beside the market-data terms. This file's own note always described them as
# neutral trading words whose intent comes from the composites that combine
# them; at `notable` inside an impact directory they were instead reporting
# crypto manipulation for a research script that used the word twice. The
# aggregate stays here, where the crypto-manipulation reading belongs.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.5
  for: [scripts, binaries]

composite_rules:
  - id: arbitrage-terms
    desc: Arbitrage trading terms
    any:
      - id: metadata/library/finance::arbitrage-terms-arbitrage
      - id: metadata/library/finance::arbitrage-terms-arb-for
      - id: metadata/library/finance::arbitrage-terms-arb-against
      - id: metadata/library/finance::arbitrage-terms-price-diff
      - id: metadata/library/finance::arbitrage-terms-flash-loan
    unless:
      - id: metadata/library/structure::vscode-js-distribution-bundle
