---
defaults:
  platforms:
  - windows
  - unix
  crit: component
  conf: 0.2
  for:
  - scripts
  - source
traits:
- id: crypto-word
  crit: notable
  desc: crypto word in Rust source
  for: [rust]
  if:
    type: text
    word: crypto
  not:
    - regex: 'rust-crypto'
  unless:
    - id: metadata/lang/compiler/systems/
    - type: text
      substr: block_cipher_trait
