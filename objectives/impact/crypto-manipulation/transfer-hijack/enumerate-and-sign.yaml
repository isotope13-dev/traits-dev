# A bundle that finds the victim's wallet accounts and then drives a signature.
#
# The credential-access rules describe a bundle that handles wallet signing --
# that it touches keys at all. This describes what the lottie-player payload
# actually did with them: enumerate the accounts the connected wallet holds,
# then run the full request-accounts-to-signature flow against one. Reading a
# key is a capability; walking someone's accounts and asking them to sign is
# the theft.
#
# The distinction matters to whoever is responding. A wallet library legitimately
# implements a signing flow, and plenty of front-ends legitimately ask which
# accounts a user has. Neither of those arrives inside a bundle whose strings
# are hidden behind a shifted lookup table, which is why the obfuscation is
# required here rather than treated as a separate observation.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1657
  mbc: B0022

composite_rules:
  - id: obfuscated-account-enumeration-signing-hijack
    desc: Hidden code enumerates wallets and signs
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/impact/crypto-manipulation/transfer-hijack::wallet-account-discovery-probe
      - id: micro-behaviors/communications/ipc/rpc::wallet-provider-full-signing-flow
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/index-shift::custom-string-table-obfuscator
      - id: objectives/anti-static/obfuscation/obfuscator/index-shift::table-accessor-ternary-index-shift
      - id: objectives/credential-access/wallet/provider::obfuscated-wallet-signing-bundle
    unless:
      - id: metadata/package/testing/
