defaults:
  platforms: [windows, unix]
  attack: T1565.001
  mbc: E1485
  for: [python]
  crit: suspicious

traits:
- id: substrate-dest-param-hardcoded
  desc: Hardcoded dest in blockchain call params
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: '"dest"\s*:\s*"5[1-9A-HJ-NP-Za-km-z]{47}"'

- id: transfer-dest-shown-not-used
  desc: 'transfer dest shown not used'
  crit: suspicious
  conf: 0.88
  if:
    type: string_literal
    regex: destination.{0,60}call_params|call_params.{0,200}destination
    case_insensitive: true

- id: reward-recipient-override--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: (withdraw|claim).{0,80}(validator|delegator).{0,120}(recipient|address)

  count_max: 1006777
- id: reward-recipient-override--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: (withdraw|claim).{0,80}(recipient|address).{0,120}(recipient|address)

  count_max: 1006778
composite_rules:
- id: substrate-transfer-hijack
  desc: Substrate blockchain transfer destination hijacked
  crit: hostile
  conf: 0.95
  all:
  - id: substrate-dest-param-hardcoded
  - id: micro-behaviors/crypto/library/blockchain/wallet::ss58-address-literal

- id: python-wallet-sign-and-broadcast
  desc: Python wallet sign and broadcast
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/crypto/library/blockchain/client::web3-sign-transaction
  - id: micro-behaviors/crypto/library/blockchain/client::web3-send-raw-transaction
  any:
  - id: micro-behaviors/crypto/library/blockchain/client::web3-build-transaction
  - id: micro-behaviors/crypto/library/blockchain/client::staking-sign-flow

- id: python-staking-reward-redirection
  desc: Python staking reward redirection
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/crypto/library/blockchain/client::cosmos-staking-reward-claim-flow
  - id: reward-recipient-override
- id: reward-recipient-override
  desc: Reward recipient override
  crit: suspicious
  conf: 0.9
  any:
  - id: reward-recipient-override--rx-1
  - id: reward-recipient-override--rx-2
