defaults:
  platforms: [windows, unix]
  attack: T1565.001
  mbc: E1485
  for: [python]
  crit: suspicious

traits:
- id: reward-recipient-override--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: (withdraw|claim).{0,80}(validator|delegator).{0,120}(recipient|address)

  count_max: 1006777
- id: reward-recipient-override--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: (withdraw|claim).{0,80}(recipient|address).{0,120}(recipient|address)

  count_max: 1006778
composite_rules:
# A balance transfer whose destination is a fixed SS58 account literal, sent
# by a keypair the code derives from secret material. Every leg is needed:
# the destination literal alone is the standard shape of codec tests, SDK
# examples, and faucet/payee config, and submission alone is any wallet
# client. Together they are the shipped-drainer shape — funds move to the
# attacker's address regardless of what the user intended.
- id: substrate-transfer-hijack
  desc: Substrate transfer to a fixed account, signed and broadcast
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/crypto/library/blockchain/wallet::ss58-transfer-dest-literal
  - id: micro-behaviors/crypto/library/blockchain/client::substrate-keypair-from-secret
  - id: micro-behaviors/crypto/library/blockchain/client::substrate-extrinsic-submit

- id: python-wallet-sign-and-broadcast
  desc: Python wallet sign and broadcast
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/crypto/library/blockchain/client::web3-sign-transaction
  - id: micro-behaviors/crypto/library/blockchain/client::web3-send-raw-transaction
  any:
  - id: micro-behaviors/crypto/library/blockchain/client::web3-build-transaction
  - id: micro-behaviors/crypto/library/blockchain/client::staking-sign-flow

- id: python-staking-reward-redirection
  desc: Python staking reward redirection
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/crypto/library/blockchain/client::cosmos-staking-reward-claim-flow
  - id: reward-recipient-override
- id: reward-recipient-override
  desc: Reward recipient override
  crit: suspicious
  conf: 0.9
  any:
  - id: reward-recipient-override--rx-1
  - id: reward-recipient-override--rx-2
