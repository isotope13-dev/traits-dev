# Automated cryptocurrency sweepers monitor compromised accounts or local stores
# and transfer discovered token/coin balances to an attacker-controlled destination.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1657
  mbc: B0022

traits:
  - id: wallet-sweeper-routines
    desc: Multi-chain balance sweeping routines
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b(sweep(BTC|EVM|SOL|EVMTokens)|crackVault)\b'

  - id: wallet-transfer-call-builders
    desc: Crypto transfer call builder routines
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b(build(Transfer|BalanceOf)Call|buildSegwitTx)\b'

composite_rules:
  - id: cryptocurrency-sweeper-routines
    desc: Cryptocurrency sweeper or transfer routines
    crit: notable
    conf: 0.92
    any:
      - id: wallet-sweeper-routines
      - id: wallet-transfer-call-builders

  - id: automated-cryptocurrency-wallet-sweeper
    desc: Automated cryptocurrency wallet sweeper
    crit: hostile
    conf: 0.99
    attack: T1657,T1555.003
    all:
      - id: cryptocurrency-sweeper-routines
      - id: micro-behaviors/crypto/asymmetric/key::derivation-path-bip
    any:
      - id: micro-behaviors/communications/http/url/rpc::ethereum-llamarpc-provider
      - id: objectives/command-and-control/infrastructure/blockchain/polygon::polygon-rpc-com-endpoint
      - id: micro-behaviors/communications/http/services/blockchain::mempool-space-endpoint
      - id: micro-behaviors/communications/rpc::jsonrpc-2-protocol-object
      - id: well-known/app/browser-extension/wallets::wallet-extension-id-cluster
      - id: micro-behaviors/fs/path/wallet::atomic-local-storage
    unless:
      - id: well-known/tool/detection/
      - id: well-known/lib/
