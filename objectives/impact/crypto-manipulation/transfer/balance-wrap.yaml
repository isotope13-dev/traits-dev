# Balance-wrap drainers compute the uint256 complement of a target balance,
# then transfer that amount so the target wraps to zero.  Cosmos EVM variants
# first induce the source-side wrap by delegating locked vesting funds through
# the staking precompile.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, go, rust, c, cpp, swift]
  crit: suspicious
  conf: 0.97
  attack: T1657

traits:
  - id: max-uint-balance-complement-solidity
    desc: Solidity max-uint balance complement
    if:
      type: text
      regex: '(?i)type\s*\(\s*uint256\s*\)\.max\s*-\s*[A-Za-z_$][A-Za-z0-9_$]*(balance|bal)\b'

  - id: max-uint-balance-complement-library
    desc: Computes library maximum-uint balance complement
    if:
      type: text
      regex: '(?i)(ethers\.)?MaxUint256\s*-\s*[A-Za-z_$][A-Za-z0-9_$]*(balance|bal)\b'

  - id: max-uint-balance-complement-shift
    desc: Computes shifted maximum-uint balance complement
    if:
      type: text
      regex: '(?i)\(\s*(1n?\s*<<\s*256|2n?\s*\*\*\s*256)\s*\)\s*-\s*\w*(balance|bal)\b'

composite_rules:
  - id: max-uint-balance-complement
    desc: Computes maximum-uint balance complement
    crit: suspicious
    conf: 0.98
    any:
      - id: max-uint-balance-complement-solidity
      - id: max-uint-balance-complement-library
      - id: max-uint-balance-complement-shift

  - id: cosmos-staking-balance-wrap-transfer
    desc: Exploits Cosmos staking balance wrap for transfer
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/crypto/library/blockchain/transaction::cosmos-staking-precompile-delegation
      - id: max-uint-balance-complement
      - id: micro-behaviors/crypto/library/blockchain/transaction::evm-native-value-call
    near_bytes: 8192

  - id: cosmos-vesting-balance-wrap-exploit
    desc: Chains vesting contract placement with balance-wrap drain
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/crypto/library/blockchain/transaction::cosmos-vesting-account-creation-message
      - id: micro-behaviors/crypto/library/blockchain/transaction::evm-create-address-derivation
      - id: micro-behaviors/crypto/library/blockchain/transaction::cosmos-staking-precompile-delegation
      - id: max-uint-balance-complement
    near_bytes: 16384
