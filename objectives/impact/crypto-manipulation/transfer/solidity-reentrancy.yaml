# A seeded withdrawal plus another withdrawal in the payable callback,
# gated on the remaining target balance, implements a reentrancy drain.
# This also reports executable educational PoCs, not just deployed attacks.
defaults:
  platforms: [unix, windows]
  for: [text, javascript]

composite_rules:
  - id: solidity-recursive-withdrawal-drain
    desc: Seeds withdrawal and reenters while contract funds remain
    crit: hostile
    conf: 0.96
    attack: T1657
    all:
      - id: metadata/lang/source/syntax/directive::solidity-version-pragma
      - id: micro-behaviors/communications/blockchain/transaction::seeded-recursive-withdrawal-calls
