# A client lifecycle hook drains the configured wallet before application work.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1657

traits:
  - id: startup-wallet-sweep-hook
    desc: Client entry hook calls a sweep
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?s)__aenter__\s*\(.{0,120}await\s+self\._ensure_\w+\s*\('

  - id: sweep-to-fixed-ton-destination
    desc: Hardcoded TON destination beside sweep builders
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'Address\(["\x27]UQ[A-Za-z0-9_-]{40,50}'

  - id: sweep-near-total-native-and-token-balances
    desc: Builds token and native balance sweeps
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'jetton_amount\s*=\s*\w+'

  - id: near-total-native-balance-transfer
    desc: Balance after fixed reserve subtraction
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'balance_nanoton\s*-\s*required'

composite_rules:
  - id: lifecycle-triggered-fixed-destination-wallet-drain
    desc: Sweeps assets to fixed external wallet
    crit: hostile
    conf: 0.995
    scope: file
    all:
      - id: objectives/impact/crypto-manipulation/transfer::sweep-to-fixed-ton-destination
      - id: objectives/impact/crypto-manipulation/transfer::sweep-near-total-native-and-token-balances
      - id: objectives/impact/crypto-manipulation/transfer::near-total-native-balance-transfer
