defaults:
  for: [javascript]
  platforms: [windows]
  attack: T1565.001

traits:
  - id: atomic-bundle-path
    desc: Is bundled Atomic replacement
    crit: notable
    if:
      type: path
      regex: 'lib[/\\]engine[/\\]a[.]js$'
  - id: exodus-bundle-path
    desc: Is bundled Exodus replacement
    crit: notable
    if:
      type: path
      regex: 'lib[/\\]engine[/\\]e[.]js$'
  - id: atomic-swap-send
    desc: Implements wallet send routine
    crit: notable
    if:
      type: text
      substr: 'async sendCoins()'
  - id: atomic-swap-btc
    desc: Overrides Bitcoin recipient address
    crit: notable
    if:
      type: text
      regex: '''BTC'' == this[.]coin[.]ticker\) this[.]inputs[.]address = ''[13][A-Za-z0-9]{25,40}'''
  - id: atomic-swap-eth
    desc: Overrides Ethereum recipient address
    crit: notable
    if:
      type: text
      regex: '''ETH'' == this[.]coin[.]ticker[^\n]{0,50}this[.]inputs[.]address = ''0x[0-9A-Fa-f]{40}'''
  - id: atomic-swap-sol
    desc: Overrides Solana recipient address
    crit: notable
    if:
      type: text
      regex: '''SOL'' == this[.]coin[.]ticker[^\n]{0,50}inputs[.]address = ''[1-9A-HJ-NP-Za-km-z]{32,44}'''
  - id: atomic-swap-receiver
    desc: Sends transaction to rewritten address
    crit: notable
    if:
      type: text
      substr: 'address: this.domainAddress || this.inputs.address'
  - id: exodus-swap-btc
    desc: Overrides Bitcoin recipient address
    crit: notable
    if:
      type: text
      regex: 'assetType == "BITCOIN_LIKE"\) _[.]address = "[13][A-Za-z0-9]{25,40}"'
  - id: exodus-swap-eth
    desc: Overrides Ethereum recipient address
    crit: notable
    if:
      type: text
      regex: 'assetType == "ETHEREUM_LIKE"[^\n]{1,50}_[.]address = "0x[0-9A-Fa-f]{40}"'
  - id: exodus-swap-sol
    desc: Overrides Solana recipient address
    crit: notable
    if:
      type: text
      regex: 'assetType == "SOLANA_TOKEN"[^\n]{1,50}_[.]address = "[1-9A-HJ-NP-Za-km-z]{32,44}"'
  - id: exodus-swap-send
    desc: Sends transaction with modified receiver
    crit: notable
    if:
      type: text
      regex: '(?s)this[.]props[.]actions[.]txSend[.]send\(\{.{0,100}receiver: _'

composite_rules:
  - id: atomic-bundled-recipient-swap
    desc: Atomic send replaces cryptocurrency recipients
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: atomic-bundle-path
      - id: atomic-swap-send
      - id: atomic-swap-btc
      - id: atomic-swap-eth
      - id: atomic-swap-sol
      - id: atomic-swap-receiver
  - id: exodus-bundled-recipient-swap
    desc: Exodus send replaces cryptocurrency recipients
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: exodus-bundle-path
      - id: exodus-swap-btc
      - id: exodus-swap-eth
      - id: exodus-swap-sol
      - id: exodus-swap-send
