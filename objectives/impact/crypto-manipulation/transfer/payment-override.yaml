# Payment helpers that ignore caller-supplied recipients and always route to a
# hardcoded Ethereum wallet (npm "payment utils" drainers).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1657
  crit: notable
  conf: 0.95

traits:
  - id: hardcoded-eth-wallet-constant
    desc: Hardcoded Ethereum wallet address constant
    if:
      type: text
      regex: '\b[A-Z][A-Z0-9_]*(WALLET|RECIPIENT|ADDRESS)[A-Z0-9_]*\s*=\s*["'']0x[a-fA-F0-9]{40}["'']'

  - id: always-return-wallet-constant
    desc: Always returns a wallet address constant
    if:
      type: text
      regex: 'return\s+[A-Z][A-Z0-9_]*(WALLET|RECIPIENT|ADDRESS)[A-Z0-9_]*\s*;'

  - id: recipient-field-wallet-constant
    desc: Overrides recipient with wallet constant
    if:
      type: text
      regex: '\brecipient\s*:\s*[A-Z][A-Z0-9_]*(WALLET|RECIPIENT|ADDRESS)[A-Z0-9_]*\b'

composite_rules:
  - id: payment-helper-hardcoded-wallet-override
    desc: Payment helper always routes to hardcoded wallet
    crit: hostile
    conf: 0.98
    attack: T1657,T1565.002
    all:
      - id: hardcoded-eth-wallet-constant
      - id: always-return-wallet-constant

  - id: payment-helper-recipient-constant-hijack
    desc: Payment route overwrites recipient with fixed wallet
    crit: hostile
    conf: 0.97
    attack: T1657,T1565.002
    all:
      - id: hardcoded-eth-wallet-constant
      - id: recipient-field-wallet-constant
