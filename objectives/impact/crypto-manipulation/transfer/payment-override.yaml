# Payment helpers that ignore caller-supplied recipients and always route to a
# hardcoded Ethereum wallet (npm "payment utils" drainers).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1657
  crit: notable
  conf: 0.95

composite_rules:
  - id: payment-helper-hardcoded-wallet-override
    desc: Payment helper always routes to hardcoded wallet
    crit: hostile
    conf: 0.98
    attack: T1657,T1565.002
    near_bytes: 512
    all:
      - id: micro-behaviors/data/format/crypto-address::hardcoded-eth-wallet-constant
      - id: micro-behaviors/crypto/library/blockchain/wallet::return-wallet-constant
    unless:
      - id: metadata/package/testing/

      - id: "metadata/file/naming::test-directory-component"
