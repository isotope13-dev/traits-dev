# A package that obtains its network configuration remotely while provisioning
# a plaintext private key and exposing a Viem transaction sender. This is an
# impact-level combination; each wallet and filesystem capability remains
# neutral in micro-behaviors.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar]
  attack: T1657

composite_rules:
  - id: remote-configured-wallet-transfer-path
    desc: Remote-configured package exposes a generated wallet transfer path
    crit: hostile
    conf: 0.99
    for: [npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: micro-behaviors/communications/url/http-path::config-segment-url
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/data/serialize/yaml::javascript-yaml-load
      - id: micro-behaviors/fs/write/file/full::node-writes-serialized-yaml
      - id: micro-behaviors/crypto/asymmetric/key::key-pair-generation-call
      - id: micro-behaviors/fs/path/config/environment::node-dotenv-file-path
      - id: micro-behaviors/crypto/asymmetric/key::viem-private-key-account
      - id: micro-behaviors/communications/blockchain/transaction::viem-wallet-client
      - id: micro-behaviors/data/transaction/submit::send-transaction-call
      - id: micro-behaviors/communications/http/client/initialize::viem-http-rpc-transport
