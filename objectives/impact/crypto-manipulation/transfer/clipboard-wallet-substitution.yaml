# Clipper: a timer polls the clipboard, tests copied text against a
# cryptocurrency address pattern and writes back a hardcoded wallet, so a
# victim who pastes a payee address pays the operator instead. Filed beside
# the other payment-destination overrides because the clipboard leaf is at
# its rule budget.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1115,T1565.002

composite_rules:
  - id: node-clipboard-wallet-substitution
    desc: Polled clipboard swaps in hardcoded wallets
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/clipboard/monitor::node-interval-clipboard-read-rewrite
      - id: micro-behaviors/data/format/crypto-address::single-chain-address-regex
    any:
      - id: micro-behaviors/data/format/crypto-address::hardcoded-btc-addr
      - id: micro-behaviors/data/format/crypto-address::hardcoded-tron-address-reference
      - id: micro-behaviors/data/format/crypto-address::hardcoded-eth-address-table
      - id: micro-behaviors/data/format/crypto-address::hardcoded-sol-addr
