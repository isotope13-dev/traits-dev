# Transaction-output drainers alter the destination and amount of a signed
# cryptocurrency request. The code can run in a browser, a native stealer, or
# another wallet integration, so the rules describe the transaction structure
# rather than one implementation language or product.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, go, c, cpp, rust, swift, macho]
  attack: T1657

traits:
  - id: chain-normalization-function
    desc: Normalizes coin name before destination choice
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(coinToChain|detectBtcAddrType|getBtcReplAddr)\b'
  - id: replacement-wallet-table
    desc: Selects replacement wallet from chain table
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?s)\b(ADDRS|replAddr)\b.{0,240}\b(bitcoin|litecoin|dogecoin)\b'
  - id: percentage-output-drain
    desc: Identifies percentage drain operation
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # Case-sensitive ALLCAPS / camelCase forms only. A prior (?i)DRAIN[_A-Z]*PCT
      # form matched RocksDB rate-limiter locals like drained_pct.
      regex: '\b(DRAIN(_[A-Z0-9]+){0,6}_PCT|drainPct)\b'
  - id: fraction-by-hundred
    desc: Divides transaction drain percent total
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\btotal(Out|Sat|Output)\w*\s*\*\s*(drainPct|DRAIN_[A-Z0-9_]{0,32}_PCT)\s*/\s*100\b'
composite_rules:
  - id: chain-aware-transaction-output-drainer
    desc: Chain-aware signed transaction drainer replaces output destinations
    crit: hostile
    conf: 0.99
    attack: T1657,T1565.002
    all:
      - id: micro-behaviors/crypto/library/blockchain/transaction::transaction-output-destination-assignment
      - id: chain-normalization-function
    any:
      - id: micro-behaviors/crypto/library/blockchain/transaction::indexed-output-destination-assignment
      - id: replacement-wallet-table
      - id: percentage-output-drain
    near_bytes: 8192
  - id: percentage-transaction-output-drainer
    desc: Signed transaction drainer redirects a percentage and rewrites change
    crit: hostile
    conf: 0.99
    attack: T1657,T1565.002
    all:
      - id: percentage-output-drain
      - id: micro-behaviors/crypto/library/blockchain/transaction::transaction-total-symbol
      - id: fraction-by-hundred
      - id: micro-behaviors/crypto/library/blockchain/transaction::transaction-output-amount-assignment
    any:
      - id: micro-behaviors/crypto/library/blockchain/transaction::transaction-output-destination-assignment
      - id: micro-behaviors/crypto/library/blockchain/transaction::indexed-output-destination-assignment
    near_bytes: 8192
  - id: percentage-output-amount-drainer
    desc: Redirects transaction percentage and amount change
    crit: hostile
    conf: 0.99
    attack: T1657,T1565.002
    all:
      - id: percentage-output-drain
      - id: micro-behaviors/crypto/library/blockchain/transaction::transaction-output-amount-assignment
    any:
      - id: micro-behaviors/crypto/library/blockchain/transaction::transaction-output-destination-assignment
      - id: micro-behaviors/crypto/library/blockchain/transaction::indexed-output-destination-assignment
    near_bytes: 8192
