defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: hostile
  conf: 0.96
  attack: T1657

composite_rules:
  - id: react-session-position-token-transfer
    desc: React trading-client probing accompanies signed token transfers
    all:
      - id: objectives/credential-access/validation/session::react-internal-trading-authority-discovery
      - id: micro-behaviors/data/transaction/construct::erc1155-batch-transfer-construction
    any:
      - id: micro-behaviors/data/transaction/submit::signed-batch-submit-call
      - id: micro-behaviors/data/transaction/sign::wallet-typed-data-signing-call
    near_bytes: 16384

  - id: react-session-position-liquidation
    desc: React trading-client probing accompanies submitted SELL orders
    all:
      - id: objectives/credential-access/validation/session::react-internal-trading-authority-discovery
      - id: micro-behaviors/data/transaction/construct::sell-order-construction
      - id: micro-behaviors/data/transaction/submit::trading-post-order-call
    near_bytes: 16384
