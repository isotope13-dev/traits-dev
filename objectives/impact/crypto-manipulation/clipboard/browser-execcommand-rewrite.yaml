defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: browser-eth-address-substitution
    desc: Substitutes an Ethereum address in browser
    crit: hostile
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((statement_block
          [(variable_declaration (variable_declarator name: (identifier) @text
             value: (member_expression object: (identifier) @element property: (property_identifier) @read_property)))
           (lexical_declaration (variable_declarator name: (identifier) @text
             value: (member_expression object: (identifier) @element property: (property_identifier) @read_property)))]
          (expression_statement (assignment_expression left: (identifier) @assigned
            right: (call_expression function: (member_expression object: (identifier) @input property: (property_identifier) @replace)
              arguments: (arguments (regex) @pattern (string) @destination))))
          (expression_statement (assignment_expression left: (member_expression object: (identifier) @output_element property: (property_identifier) @write_property)
            right: (identifier) @output_text))) @flow
          (#eq? @text @assigned) (#eq? @text @input) (#eq? @text @output_text)
          (#eq? @element @output_element)
          (#eq? @read_property "value") (#eq? @write_property "value")
          (#match? @replace "^replace(All)?$")
          (#match? @pattern "0x") (#match? @pattern "\\{40\\}")
          (#match? @pattern "[aA]-[fF]") (#match? @pattern "0-9")
          (#match? @destination "^['\"]0x[a-fA-F0-9]{40}['\"]$")
          (#not-match? @destination "(?i)^['\"]0x(0{40}|0{36}dead)['\"]$"))

        ((call_expression
          function: (member_expression object: (identifier) @doc property: (property_identifier) @listen)
          arguments: (arguments . (string) @event .
            [(function_expression parameters: (formal_parameters (identifier) @ev) body: (statement_block
              (lexical_declaration (variable_declarator name: (identifier) @selected
                value: (call_expression function: (member_expression
                  object: (call_expression function: (member_expression object: (identifier) @win property: (property_identifier) @selection))
                  property: (property_identifier) @stringify))))
              (if_statement condition: (parenthesized_expression
                (call_expression function: (member_expression object: (regex) @regex property: (property_identifier) @test)
                  arguments: (arguments . (identifier) @tested)))
                consequence: (statement_block
                  (expression_statement (call_expression function: (member_expression object: (identifier) @cancel property: (property_identifier) @prevent)))
                  (expression_statement (call_expression function: (member_expression
                    object: (member_expression object: (identifier) @writer property: (property_identifier) @clipboard)
                    property: (property_identifier) @set)
                    arguments: (arguments . (string) @mime . (string) @address)))))))
             (arrow_function parameters: (formal_parameters (identifier) @ev) body: (statement_block
              (lexical_declaration (variable_declarator name: (identifier) @selected
                value: (call_expression function: (member_expression
                  object: (call_expression function: (member_expression object: (identifier) @win property: (property_identifier) @selection))
                  property: (property_identifier) @stringify))))
              (if_statement condition: (parenthesized_expression
                (call_expression function: (member_expression object: (regex) @regex property: (property_identifier) @test)
                  arguments: (arguments . (identifier) @tested)))
                consequence: (statement_block
                  (expression_statement (call_expression function: (member_expression object: (identifier) @cancel property: (property_identifier) @prevent)))
                  (expression_statement (call_expression function: (member_expression
                    object: (member_expression object: (identifier) @writer property: (property_identifier) @clipboard)
                    property: (property_identifier) @set)
                    arguments: (arguments . (string) @mime . (string) @address)))))))])) @flow
          (#match? @doc "^(document|window)$") (#eq? @listen "addEventListener")
          (#match? @event "^['\"](copy|cut)['\"]$")
          (#eq? @win "window") (#eq? @selection "getSelection") (#eq? @stringify "toString")
          (#eq? @selected @tested) (#eq? @ev @cancel) (#eq? @ev @writer)
          (#eq? @test "test") (#match? @regex "0x") (#match? @regex "\\{40\\}")
          (#match? @regex "[aA]-[fF]") (#match? @regex "0-9")
          (#eq? @prevent "preventDefault") (#eq? @clipboard "clipboardData") (#eq? @set "setData")
          (#match? @mime "^['\"]text/plain['\"]$")
          (#match? @address "^['\"]0x[a-fA-F0-9]{40}['\"]$")
          (#not-match? @address "(?i)^['\"]0x(0{40}|0{36}dead)['\"]$"))
    unless:
      - id: objectives/impact/crypto-manipulation/hijack-transfer/address::browser-selected-wallet-copy-override

composite_rules:
  - id: browser-execcommand-clipboard-eth-substitution
    desc: Clipboard commands substitute an ETH address
    crit: hostile
    conf: 0.98
    attack: T1115,T1565.001
    near_bytes: 4096
    all:
      - id: objectives/impact/crypto-manipulation/hijack-transfer/address::browser-eth-substitution
      - id: micro-behaviors/os/clipboard/read::browser-execcommand-paste
      - id: micro-behaviors/os/clipboard/write::browser-execcommand-copy
