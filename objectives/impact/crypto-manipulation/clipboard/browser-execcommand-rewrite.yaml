defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: browser-element-eth-address-substitution
    desc: ETH address substitution in element value
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((statement_block
          [(variable_declaration (variable_declarator name: (identifier) @text
             value: (member_expression object: (identifier) @element property: (property_identifier) @read_property)))
           (lexical_declaration (variable_declarator name: (identifier) @text
             value: (member_expression object: (identifier) @element property: (property_identifier) @read_property)))]
          (expression_statement (assignment_expression left: (identifier) @assigned
            right: (call_expression function: (member_expression object: (identifier) @input property: (property_identifier) @replace)
              arguments: (arguments (regex) @pattern (string) @destination))))
          (expression_statement (assignment_expression left: (member_expression object: (identifier) @output_element property: (property_identifier) @write_property)
            right: (identifier) @output_text))) @flow
          (#eq? @text @assigned) (#eq? @text @input) (#eq? @text @output_text)
          (#eq? @element @output_element)
          (#eq? @read_property "value") (#eq? @write_property "value")
          (#match? @replace "^replace(All)?$")
          (#match? @pattern "0x") (#match? @pattern "\\{40\\}")
          (#match? @pattern "[aA]-[fF]") (#match? @pattern "0-9")
          (#match? @destination "^['\"]0x[a-fA-F0-9]{40}['\"]$")
          (#not-match? @destination "(?i)^['\"]0x(0{40}|0{36}dead)['\"]$"))

composite_rules:
  - id: browser-execcommand-clipboard-eth-substitution
    desc: Clipboard commands with Ethereum address substitution
    crit: hostile
    conf: 0.98
    attack: T1115,T1565.001
    near_bytes: 4096
    all:
      - id: browser-element-eth-address-substitution
      - id: micro-behaviors/os/clipboard/read::browser-execcommand-paste
      - id: micro-behaviors/os/clipboard/write::browser-execcommand-copy
