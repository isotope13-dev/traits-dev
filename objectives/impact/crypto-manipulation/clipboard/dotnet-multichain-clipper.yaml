defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: dotnet-remote-wallet-clipboard-replacement
    desc: Wallet validators with remote clipboard replacement message schema
    crit: hostile
    conf: 0.93
    attack: T1115,T1565.001
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/symbols/name::dotnet-gettext-member-name
      - id: metadata/binary/symbols/name::dotnet-settext-member-name
      - id: micro-behaviors/data/format/crypto-address::multi-chain-address-regex
      - id: well-known/dual-use/remote-admin/pulsar::address-message-pair
      - id: well-known/dual-use/remote-admin/pulsar::clipboard-command-namespace
