defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, c, cpp]
  attack: T1115,T1565.001
traits: []
composite_rules:
  # Clipboard I/O beside an address pattern does not establish replacement.
  # Native clipper consumers use the existing listener/overwrite classifier.
  - id: source-winforms-clipboard-address-clipper
    desc: WinForms cryptocurrency clipboard hijacker
    crit: hostile
    conf: 0.98
    for: [scripts, source]
    all:
      - id: micro-behaviors/os/clipboard/read::source-winforms-clipboard-gettext
      - id: micro-behaviors/os/clipboard/write::source-winforms-clipboard-settext
      - id: micro-behaviors/os/clipboard/write::winforms-fixed-crypto-text
    near_bytes: 4096
    any:
      - id: micro-behaviors/data/format/crypto-address::embedded-btc-address-regex
      - id: micro-behaviors/data/format/crypto-address::eth-address-regex
  - id: browser-extension-crypto-clipboard-hijacker
    desc: Extension swaps crypto addresses in clipboard
    crit: hostile
    conf: 0.98
    for: [javascript, typescript, crx]
    all:
      - id: micro-behaviors/os/clipboard/read::browser-clipboard-read
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
    any:
      - id: micro-behaviors/data/format/crypto-address::embedded-btc-address-regex
      - id: micro-behaviors/data/format/crypto-address::eth-address-regex
