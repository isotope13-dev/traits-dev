# A clipper names one regex per coin, runs it over the current clipboard
# text and substitutes the operator's wallet, e.g. VB.NET
# `BTCRegex.Replace(currentClipboard, Settings.BTC)` or C#
# `ethRegex.Replace(clipText, wallet)`. Clipboard tools that normalize text
# do not key the regex to a coin. RAT builders such as XWorm carry this
# client source verbatim in the controller PE and compile it per build.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1115,T1565.001
traits:
  - id: coin-regex-replaces-clipboard-text
    desc: Coin-named regex rewrites clipboard text
    crit: suspicious
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      regex: '\b(btc|eth|trc|trx|ltc|xmr|doge|sol|usdt|bch)\w*\.Replace\(\s*\w*clip\w*\s*,'
composite_rules:
  # The wallet-format regex literal and the .NET clipboard read/write
  # members bind the rewrite to an address swap written back to the user.
  - id: managed-coin-regex-clipboard-wallet-swap
    desc: Swaps wallet addresses in clipboard text
    crit: hostile
    conf: 0.96
    all:
      - id: coin-regex-replaces-clipboard-text
      - id: micro-behaviors/os/clipboard/reference::dotnet-clipboard-text-read-write-members
    any:
      - id: micro-behaviors/data/format/crypto-address::btc-address-regex
      - id: micro-behaviors/data/format/crypto-address::trx-address-regex
      - id: micro-behaviors/data/format/crypto-address::xmr-address-regex
      - id: micro-behaviors/data/format/crypto-address::ltc-address-regex
      - id: micro-behaviors/data/format/crypto-address::btc-bech32-regex
      - id: micro-behaviors/data/format/crypto-address::btc-base58-range-regex
