defaults:
  for: [class, java_class]
  platforms: [windows, unix]
composite_rules:
  - id: jvm-checksummed-address-prefix-clipboard-swap
    desc: Clipboard address swap matches original prefix
    crit: hostile
    conf: 0.96
    attack: T1565.002
    all:
      - id: micro-behaviors/os/clipboard/read::jvm-clipboard-get-data-reference
      - id: micro-behaviors/os/clipboard/write::java-clipboard-text-write
      - id: micro-behaviors/data/string/substring::jvm-multiple-zero-four-substrings
      - id: micro-behaviors/crypto/hash/digest/unnamed-algorithm::jvm-digest-chain-and-short-string-bounds
      - id: metadata/binary/instruction/operand::jvm-static-state-update-backward-branch
