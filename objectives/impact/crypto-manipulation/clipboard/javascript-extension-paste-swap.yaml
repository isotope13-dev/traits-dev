# JavaScript bundles that capture live activity -- keystrokes, screenshots, tab
# captures, clipboard contents -- rather than reading a stored credential file.
# That split is the axis this directory is named for; the stored-store half of
# this file is ../data/javascript.yaml.
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript, typescript]
composite_rules:
  - id: browser-crypto-clipboard-hijacker
    desc: Extension replaces pasted cryptocurrency addresses
    crit: hostile
    conf: 0.99
    attack: T1115
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/clipboard/read::browser-dom-clipboard-paste
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
    any:
      - id: micro-behaviors/data/format/crypto-address::eth-address-regex
      - id: micro-behaviors/data/format/crypto-address::btc-address-regex
      - id: micro-behaviors/data/format/crypto-address::trx-address-regex
      - id: micro-behaviors/data/format/crypto-address::multi-chain-address-regex
