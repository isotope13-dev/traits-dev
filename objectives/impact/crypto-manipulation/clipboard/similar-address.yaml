# Unlike ordinary address validation/copy helpers, these loops read the system
# clipboard, compare only a short part with a table entry, and overwrite the
# clipboard with that entry. Bind the checked value and written candidate;
# names of the variables and replacement tables are deliberately unconstrained.
defaults:
  platforms: [windows, unix]
  crit: suspicious
  conf: 0.98
  attack: T1115,T1565.001

traits:
  - id: python-similar-address-clipboard-overwrite
    desc: Clipboard substitutes similar Ethereum addresses
    for: [python]
    if:
      type: tree-sitter
      query: |
        ((while_statement body: (block
          (expression_statement (assignment left: (identifier) @copied
            right: (call function: (attribute object: (identifier) @reader
              attribute: (identifier) @paste) arguments: (argument_list)))) .
          (expression_statement (call))? .
          (if_statement condition: (call
            function: (attribute object: (identifier) @regex
              attribute: (identifier) @match)
            arguments: (argument_list (string) @pattern (identifier) @checked))
            consequence: (block . (for_statement left: (identifier) @candidate
              right: (identifier) @table
              body: (block . (if_statement condition: (comparison_operator
                (subscript value: (identifier) @candidate_check
                  subscript: (slice) @candidate_slice)
                operators: "=="
                (subscript value: (identifier) @copied_check
                  subscript: (slice) @copied_slice))
                consequence: (block . (expression_statement (call
                  function: (attribute object: (identifier) @writer
                    attribute: (identifier) @copy)
                  arguments: (argument_list (identifier) @written))))))))))) @overwrite
          (#match? @reader "^(pyperclip|clipboard)$") (#eq? @writer @reader)
          (#eq? @paste "paste") (#eq? @copy "copy")
          (#eq? @regex "re") (#match? @match "^(fullmatch|match|search)$")
          (#eq? @copied @checked) (#eq? @copied @copied_check)
          (#eq? @candidate @candidate_check) (#eq? @candidate @written)
          (#not-eq? @copied @candidate) (#not-eq? @copied @table)
          (#eq? @candidate_slice @copied_slice)
          (#match? @candidate_slice "^(:[1-3]|-[1-3]:)$")
          (#match? @pattern "0x\\[[^]]+\\]\\{40\\}")
          (#match? @pattern "a-f") (#match? @pattern "0-9")
          (#set! cleave.ignore-comments "true"))

  - id: browser-similar-address-clipboard-overwrite
    desc: Clipboard substitutes similar Ethereum addresses
    for: [javascript, typescript]
    if:
      type: tree-sitter
      query: |
        ((while_statement body: (statement_block
          (lexical_declaration (variable_declarator name: (identifier) @copied
            value: (await_expression (call_expression
              function: (member_expression
                object: (member_expression object: (identifier) @reader
                  property: (property_identifier) @read_clipboard)
                property: (property_identifier) @read)
              arguments: (arguments))))) .
          (expression_statement (await_expression (call_expression)))? .
          (if_statement condition: (parenthesized_expression (call_expression
            function: (member_expression object: (regex) @pattern
              property: (property_identifier) @test)
            arguments: (arguments (identifier) @checked)))
            consequence: (statement_block . (for_in_statement
              left: (identifier) @candidate operator: "of" right: (identifier) @table
              body: (statement_block . (if_statement
                condition: (parenthesized_expression (binary_expression
                  left: (call_expression function: (member_expression
                    object: (identifier) @candidate_check
                    property: (property_identifier) @candidate_method)
                    arguments: (arguments) @candidate_slice)
                  operator: ["==" "==="]
                  right: (call_expression function: (member_expression
                    object: (identifier) @copied_check
                    property: (property_identifier) @copied_method)
                    arguments: (arguments) @copied_slice)))
                consequence: (statement_block . (expression_statement
                  (await_expression (call_expression function: (member_expression
                    object: (member_expression object: (identifier) @writer
                      property: (property_identifier) @write_clipboard)
                    property: (property_identifier) @write)
                    arguments: (arguments (identifier) @written)))))))))))) @overwrite
          (#eq? @reader "navigator") (#eq? @reader @writer)
          (#eq? @read_clipboard "clipboard") (#eq? @write_clipboard "clipboard")
          (#eq? @read "readText") (#eq? @write "writeText") (#eq? @test "test")
          (#eq? @copied @checked) (#eq? @copied @copied_check)
          (#eq? @candidate @candidate_check) (#eq? @candidate @written)
          (#not-eq? @copied @candidate) (#not-eq? @copied @table)
          (#match? @candidate_method "^(substring|slice)$")
          (#eq? @candidate_method @copied_method)
          (#eq? @candidate_slice @copied_slice)
          (#match? @candidate_slice "^\\(\\s*(0,\\s*[1-3]|1,\\s*[23]|2,\\s*3)\\s*\\)$")
          (#match? @pattern "0x\\[[^]]+\\]\\{40\\}")
          (#match? @pattern "a-f") (#match? @pattern "0-9")
          (#set! cleave.ignore-comments "true"))

composite_rules:
  - id: similar-address-clipboard-hijacker
    desc: Clipboard wallet replacement by partial matches
    crit: hostile
    for: [python, javascript, typescript]
    all:
      - id: micro-behaviors/data/format/crypto-address::eth-address-regex
    any:
      - id: python-similar-address-clipboard-overwrite
      - id: browser-similar-address-clipboard-overwrite
