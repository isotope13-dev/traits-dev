defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1565.001,T1115
traits:
  - id: async-clipboard-write-hook
    desc: Overrides asynchronous clipboard text writes
    crit: notable
    if:
      type: text
      regex: 'navigator\.clipboard\.writeText\s*=\s*async\s+function'
  - id: conditional-text-rewrite
    desc: Conditionally rewrites text asynchronously
    crit: notable
    if:
      type: text
      regex: 'if\s*\(\s*\w+\(text\)\.length\s*\)\s*\{[\s\S]{0,100}await\s+\w+\(text\)'
composite_rules:
  - id: browser-multichain-clipboard-fetch-hook
    desc: Browser hooks clipboard and swaps crypto addresses
    crit: hostile
    conf: 0.99
    all:
      - id: async-clipboard-write-hook
      - id: conditional-text-rewrite
      - id: micro-behaviors/data/format/crypto-address::multi-crypto-regex
      - id: micro-behaviors/communications/http/intercept::window-fetch-eq
