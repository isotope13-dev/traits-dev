defaults:
  platforms:
  - windows
  for:
  - text
traits:
- id: autoit-hex-clipboard-replacement-profile
  desc: Encoded clipboard address replacement profile
  crit: suspicious
  conf: 0.98
  if:
    type: yara
    source: |
      rule autoit_hex_multichain_clipboard_replacement {
        strings:
          $read = /\bClipGet\s*\(/ nocase
          $write = /\bClipPut\s*\(/ nocase
          $replace = /\bStringRegExpReplace\s*\(/ nocase
          $eth = /30785B302D39412D7A.{0,16}5D7B34307D/ nocase
          $btc = "5B31335D5B312D39412D5A5D5B312D39412D7A5D7B33327D" nocase
          $capture1 = "247B317D" nocase
          $capture2 = "247B327D" nocase
        condition:
          all of them
      }
  attack: T1115,T1565.001
composite_rules:
- id: autoit-hex-multichain-clipboard-replacement
  desc: Hex-decoding multi-chain clipboard hijacker
  crit: hostile
  conf: 0.99
  all:
  - id: autoit-hex-clipboard-replacement-profile
  - id: micro-behaviors/data/decode/hex::autoit-chr-dec-stringmid
