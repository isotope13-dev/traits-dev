# This wrapper only launches the embedded script when its environment gate is
# present. The detached hidden PowerShell loop rewrites wallet addresses in
# clipboard text.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1115,T1565.001

traits:
  - id: gated-detached-powershell-wallet-clipper
    desc: Hidden PowerShell swaps wallet clipboard text
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule gated_detached_powershell_wallet_clipper {
          strings:
            $read = /\[System\.Windows\.Forms\.Clipboard\]::GetText\s*\(\s*\)/
            $write = /\[System\.Windows\.Forms\.Clipboard\]::SetText\s*\(/
            $gate = /process\.env\s*\[\s*["'][A-Z0-9_]{8,}["']\s*\]/
            $spawn = /spawn\s*\(\s*["']powershell["']\s*,/
            $flags = /detached\s*:\s*true[\s\S]{0,180}windowsHide\s*:\s*true/
            $unref = /\.unref\s*\(\s*\)/
          condition:
            $read and $write and $gate and $spawn and $flags and $unref
        }
