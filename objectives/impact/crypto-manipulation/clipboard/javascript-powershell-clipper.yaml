# Require wallet replacement evidence. Clipboard read/write and hidden
# spawning alone also occur in ordinary background clipboard utilities.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1115,T1565.001

composite_rules:
  - id: detached-powershell-wallet-clipper
    desc: Hidden detached PowerShell with cryptocurrency clipboard replacement
    crit: hostile
    conf: 0.99
    all:
      - id: source-winforms-clipboard-address-clipper
      - id: micro-behaviors/process/create/hidden::detached-silent-hidden-spawn
      - id: micro-behaviors/process/create/shell/interpreter::powershell-exe-spawn
