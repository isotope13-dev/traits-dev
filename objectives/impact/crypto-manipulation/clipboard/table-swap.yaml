# Clipboard read/write co-occurs with address matchers for several chains.
# The matcher families need not be stored in a literal table.
defaults:
  platforms: [unix, windows]
  # powershell omitted: the multi-chain matcher-table leg does not cover it.
  for: [python, javascript, typescript, ruby, php, shell]
  attack: T1115,T1565.001
  mbc: E1510

composite_rules:
  - id: clipboard-multichain-address-clipper
    desc: Clipboard clipper swaps multi-chain addresses
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/os/clipboard/read
      - id: micro-behaviors/os/clipboard/write
      - id: micro-behaviors/data/format/crypto-address::multi-chain-address-matchers
    unless:
      # Filename-convention test guards only: a directory-wide testing/
      # reference would also suppress this on the validation corpus, which
      # lives under testdata/.
      - id: metadata/package/testing/presence/harness::test-directory
      - id: "metadata/file/naming::test-directory-component"
