# Source-level clipboard clippers read the clipboard, decide whether the text
# is a wallet address, and write back an attacker address from a built-in
# table. The existing address-swap rules key on a `.replace()` choke point or a
# `pyperclip.copy(...).replace` shape; a clipper that swaps via a dict lookup
# keyed by chain family (the Deep-Live-Cam sys_helper shape) slips past them.
# This rule pairs clipboard read AND write with a hardcoded matcher table for
# two or more unrelated chains -- nothing benign recognises Bitcoin, Tron and
# Solana at once and rewrites the clipboard. Family names and the addresses
# themselves are never matched, so future tables and chains still fire.
defaults:
  platforms: [unix, windows]
  # powershell omitted: the multi-chain matcher-table leg does not cover it.
  for: [python, javascript, typescript, ruby, php, shell]
  attack: T1115,T1565.001
  mbc: E1510

composite_rules:
  - id: clipboard-multichain-table-clipper
    desc: Clipboard clipper swaps multi-chain addresses
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/os/clipboard/read
      - id: micro-behaviors/os/clipboard/write
      - id: objectives/impact/crypto-manipulation/hijack-transfer::multi-chain-address-matcher-table
    unless:
      # Filename-convention test guards only: a directory-wide testing/
      # reference would also suppress this on the validation corpus, which
      # lives under testdata/.
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/package/testing/presence/harness::test-directory-path
