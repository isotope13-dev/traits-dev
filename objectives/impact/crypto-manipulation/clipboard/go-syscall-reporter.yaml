# The read/write helpers are actual native call sites. Crypto-address regexes
# and the replacement-notification method distinguish this from a clipboard UI.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-syscall-crypto-clipboard-replacer
    desc: Go crypto clipboard swap and replacement report
    crit: hostile
    conf: 0.98
    attack: T1115,T1565.001
    all:
      - id: micro-behaviors/os/clipboard/read::go-clipboard-syscall-read-call
      - id: micro-behaviors/os/clipboard/write::go-clipboard-syscall-write-call
      - id: micro-behaviors/os/clipboard/write::win32-clipboard-readwrite-with-crypto-pattern
      - id: micro-behaviors/data/format/crypto-address::multi-chain-address-regex
      - id: micro-behaviors/communications/messaging/send::go-send-clip-notification-method
