defaults:
  platforms:
  - windows
  for:
  - pe
  attack: T1115,T1565.001
composite_rules:
- id: go-ethereum-clipboard-overwrite
  desc: Ethereum clipboard overwrite with decoded bytes
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/binary/symbols/name::go-main-monitor-clipboard-name
  - id: micro-behaviors/os/clipboard/read::go-atotto-read-all-reference
  - id: micro-behaviors/os/clipboard/write::go-atotto-write-all-reference
  - id: micro-behaviors/data/format/crypto-address::ethereum-validation-regex-literal
  - id: micro-behaviors/data/decode/base64::go-base64-decode
  - id: micro-behaviors/data/codec::go-x64-byte-xor-buffer-loop
  - id: metadata/binary/instruction/sequence::x64-conditional-call-return-pair-handoff
- id: go-multichain-clipboard-crypto-clipper
  desc: Go binary replaces clipboard with cryptocurrency addresses
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/os/clipboard/write::go-clipboard-write-call
  - id: micro-behaviors/os/clipboard/read::go-clipboard-read-call
  any:
  - id: micro-behaviors/data/format/crypto-address::multi-chain-address-regex
  - id: micro-behaviors/data/format/crypto-address::multi-chain-address-validation-regex-set
  # Single-chain variant of the sibling overwrite composite for clippers that
  # hide their entry points behind obfuscated symbol names: the clipboard
  # read/write pair plus an Ethereum validation regex plus a Base64 decode in
  # the swap path establishes the hijack without readable function names.
- id: go-ethereum-clipboard-swap
  desc: Go clipboard rewrite on Ethereum address pattern
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/os/clipboard/read::go-clipboard-read-call
  - id: micro-behaviors/os/clipboard/write::go-clipboard-write-call
  - id: micro-behaviors/data/format/crypto-address::ethereum-validation-regex-literal
  - id: micro-behaviors/data/decode/base64::go-base64-decode
