# The same clipboard poller writes replacement wallet addresses with
# SetClipboardData(CF_UNICODETEXT, handle), then reports both addresses.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-obfuscated-wallet-clipboard-replacement
    desc: Obfuscated wallet clipboard replacement
    crit: hostile
    conf: 0.98
    attack: T1115,T1565
    all:
      - id: objectives/exfiltration/stealer/credential/value/recovery-secret::go-obfuscated-clipboard-seed-notifier
      - id: metadata/binary/instruction/sequence::go-call-thirteen-and-stack-value
