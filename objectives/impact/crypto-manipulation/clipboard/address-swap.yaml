defaults:
  platforms: [unix, windows]
  for:
    - scripts
    - pe
  crit: suspicious
  attack: T1565.001
traits:
  - id: btc-address-hardcoded
    desc: Hardcoded Bitcoin address
    crit: baseline
    conf: 0.7
    if:
      type: text
      regex: \b(1|3)[1-9A-HJ-NP-Za-km-z]{25,34}\b
      section: __cstring
    not:
      - regex: ^\\.\\?\\?@
      - regex: '[13][A-Fa-f0-9]{25,34}'
      - regex: ^[13]([A-Z][a-z0-9]+){2,}$
      - regex: (.)\1\1\1
      - substr: _ZN
      - substr: ::h
    unless:
      - id: metadata/signed/platform::apple
      - id: well-known/dual-use/credentials/hashcat::module-path
  - id: btc-address-multiple
    desc: Multiple Bitcoin addresses (legacy)
    crit: notable
    conf: 0.85
    count_min: 2
    if:
      id: btc-address-hardcoded
    unless:
      - id: metadata/signed/platform::apple
      - id: well-known/tool/reverse-engineering/scylla/
      - id: metadata/lang/compiler/systems::core-fmt
      - type: text
        substr: ScyllaPluginExchange
      - type: text
        substr: "describe('"
  - id: conditional-address-clipboard-forward
    desc: Conditional wallet-address test
    crit: component
    conf: 0.8
    for: [python, javascript, powershell, shell]
    if:
      type: text
      regex: '(?i)\b(if|while|switch)\s*\([^)]{0,80}\bwallet\b[^)]{0,80}\)'
  - id: clipboard-shell-marker
    desc: Clipboard shell utility marker
    crit: component
    conf: 0.8
    for: [python, javascript, powershell, shell]
    if:
      type: text
      regex: '(?i)\b(pbpaste|pbcopy|xclip|xsel)\b'
  - id: clipboard-command-marker
    desc: Clipboard command marker
    crit: component
    conf: 0.8
    for: [python, javascript, powershell, shell]
    if:
      type: text
      regex: '(?i)\b(clip\.exe|get-clipboard|set-clipboard)\b'
  - id: wallet-address-eth-marker
    desc: Ethereum wallet address literal
    crit: component
    conf: 0.8
    for: [python, javascript, powershell, shell]
    if:
      type: text
      regex: '(?i)\b(wallet|address)\b\s*=\s*["'']0x[a-fA-F0-9]{40}'
    # Burn/demo placeholders (all-identical nybbles), same posture as
    # btc-address-hardcoded's repeated-character exclusion.
    not:
      - regex: '0x0{40}'
      - regex: '0x1{40}'
      - regex: '0x[fF]{40}'
  - id: wallet-address-btc-marker
    desc: Bitcoin wallet address literal
    crit: component
    conf: 0.8
    for: [python, javascript, powershell, shell]
    if:
      type: text
      regex: '\b(wallet|address)\b.{0,80}\b[13][a-km-zA-HJ-NP-Z1-9]{25,34}\b'
      is: bitcoin_addr
  # A bare `address = "0x..."` / `wallet = "0x..."` assignment is ubiquitous in
  # benign web3 config (token/router/contract address registries). On its own it
  # is not clipboard hijacking — these are component building blocks gated behind
  # clipboard manipulation by the address-variable-reassign composite below.
  - id: address-var-reassign-eth
    desc: Address variable assigned an Ethereum address
    crit: component
    conf: 0.8
    for: [python, javascript, powershell, shell]
    if:
      type: text
      regex: address\s*=\s*["\'"]0x[a-fA-F0-9]{40}
    not:
      - regex: '0x0{40}'
      - regex: '0x1{40}'
      - regex: '0x[fF]{40}'
  - id: address-var-reassign-btc
    desc: Address variable assigned a Bitcoin address
    crit: component
    conf: 0.8
    for: [python, javascript, powershell, shell]
    if:
      type: text
      regex: address\s*=\s*["\'"][13][a-zA-HJ-NP-Z0-9]{25,}
  - id: wallet-var-reassign-eth
    desc: Wallet variable assigned an Ethereum address
    crit: component
    conf: 0.8
    for: [python, javascript, powershell, shell]
    if:
      type: text
      regex: wallet\s*=\s*["\'"]0x[a-fA-F0-9]{40}
    not:
      - regex: '0x0{40}'
      - regex: '0x1{40}'
      - regex: '0x[fF]{40}'
  - id: wallet-var-reassign-btc
    desc: Wallet variable assigned a Bitcoin address
    crit: component
    conf: 0.8
    for: [python, javascript, powershell, shell]
    if:
      type: text
      regex: wallet\s*=\s*["\'"][13][a-zA-HJ-NP-Z0-9]{25,}
  - id: ps1-clipboard-wallet-btc
    desc: PowerShell clipboard with Bitcoin address
    crit: suspicious
    conf: 0.85
    for:
      - powershell
    if:
      type: text
      regex: (Get-Clipboard|Set-Clipboard)[\s\S]{0,200}[13][a-zA-HJ-NP-Z0-9]{25,}
  - id: ps1-clipboard-wallet-eth
    desc: PowerShell clipboard with Ethereum address
    crit: suspicious
    conf: 0.85
    for:
      - powershell
    if:
      type: text
      regex: (Get-Clipboard|Set-Clipboard)[\s\S]{0,200}0x[a-fA-F0-9]{40}
  - id: ps1-clipboard-replace
    desc: PowerShell clipboard content replacement
    crit: suspicious
    conf: 0.85
    for:
      - powershell
    if:
      type: text
      regex: '(?is)\bGet-Clipboard\b([\s;|)\r\n])[^\r\n]{0,400}\bSet-Clipboard\b([\s;|)\r\n-])'
  - id: py-clipboard-wallet-eth
    desc: Python clipboard with Ethereum address
    crit: suspicious
    conf: 0.85
    for:
      - python
    if:
      type: text
      regex: (pyperclip|clipboard|paste)[\s\S]{0,200}0x[a-fA-F0-9]{40}
  # Two tightenings after Paste's paste/util/pony.py matched: a bare `paste`
  # anchor hits every mention of the word (an import of `paste.request`, the
  # project's own name), so require the pyperclip call shape; and the address
  # charset is real Base58 -- no 0, O, I or l -- which a base64 blob of
  # compressed ASCII art satisfies far less often than the looser class did.
  - id: py-clipboard-wallet-btc
    desc: Python clipboard with Bitcoin address
    crit: suspicious
    conf: 0.85
    for:
      - python
    if:
      type: text
      regex: (pyperclip|clipboard|paste\s*\()[\s\S]{0,200}\b[13][a-km-zA-HJ-NP-Z1-9]{25,33}\b
    not:
      - substr: "pasted from https://github.com/"
  - id: py-clipboard-replace
    desc: Python clipboard content replacement
    crit: suspicious
    conf: 0.85
    for:
      - python
    if:
      type: text
      regex: (pyperclip|clipboard)\.copy[\s\S]{0,100}\.replace
  - id: js-clipboard-api
    desc: JavaScript browser clipboard API
    crit: component
    conf: 0.8
    for: [javascript]
    if:
      type: text
      regex: navigator\.clipboard
  - id: js-wallet-address-eth
    desc: JavaScript named Ethereum address
    crit: component
    conf: 0.8
    for: [javascript]
    if:
      type: text
      regex: '\b(wallet|address)\b[\s\S]{0,100}0x[a-fA-F0-9]{40}'
    not:
      - regex: '0x0{40}'
      - regex: '0x1{40}'
      - regex: '0x[fF]{40}'
  - id: js-wallet-address-btc
    desc: JavaScript named Bitcoin address
    crit: component
    conf: 0.8
    for: [javascript]
    if:
      type: text
      # Require a checksum-valid Bitcoin address so runs of "1" inside an
      # Ethereum burn/demo hex literal cannot satisfy the BTC leg.
      regex: '\b(wallet|address)\b[\s\S]{0,100}\b[13][a-km-zA-HJ-NP-Z1-9]{25,34}\b'
      is: bitcoin_addr
  - id: js-clipboard-write
    desc: JavaScript clipboard rewrite
    crit: component
    conf: 0.75
    if:
      type: text
      regex: (navigator\.)?clipboard\.writeText\s*\(|execCommand\s*\(\s*["']copy["']
  - id: vscode-clipboard-hardcoded-eth-write
    desc: VS Code writes hardcoded ETH address
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'vscode\.env\.clipboard\.writeText\s*\(\s*["'']0x[a-fA-F0-9]{40}["'']'
  - id: vscode-clipboard-named-eth-write
    desc: VS Code writes named wallet destination
    crit: component
    conf: 0.88
    for: [javascript, typescript]
    if:
      type: text
      regex: 'writeText\s*\(\s*(wallet|address|replacement|destination)[A-Za-z0-9_$]{0,24}'
composite_rules:
  # This packed profile survives when the actual Python bytecode is concealed
  # in a PyInstaller CArchive: it combines the clipboard dependency, AES stage,
  # encode.py entrypoint, and Windows UI/COM control modules. The independent
  # encrypted-stage rule also requires the archive to dominate the PE image.
  - id: pyinstaller-clipboard-hijacker-profile
    desc: Packed Python clipboard hijacker profile
    crit: hostile
    conf: 0.99
    attack: T1115,T1565.001
    for: [pe]
    all:
      - id: micro-behaviors/fs/temp/pyinstaller::runtime-tmpdir-option
      - id: micro-behaviors/fs/temp/pyinstaller::meipass-runtime-dir
      - id: micro-behaviors/fs/temp/pyinstaller::archive-encode-entrypoint
      - id: micro-behaviors/os/clipboard/pyinstaller::clipboard-module
      - id: micro-behaviors/crypto/symmetric/aes/package::pyinstaller-pycrypto-aes-module
      - id: metadata/binary/layout::overlay-over-90pct
      - id: micro-behaviors/fs/temp/pyinstaller::archive-win32com-client-module
      - id: micro-behaviors/fs/temp/pyinstaller::archive-win32gui-extension

  - id: clipboard-context-marker
    desc: Clipboard API context marker
    crit: component
    conf: 0.8
    any:
      - id: clipboard-shell-marker
      - id: clipboard-command-marker
      - id: micro-behaviors/os/clipboard/access::browser-clipboard-api-marker
  - id: wallet-rewrite-operation
    desc: Clipboard write follows a replacement operation
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/os/clipboard/transform::browser-clipboard-write-transformed-text
      - id: py-clipboard-replace
      - id: ps1-clipboard-replace
  - id: conditional-address-clipboard
    desc: Conditional wallet address clipboard use
    crit: component
    conf: 0.85
    near_bytes: 256
    all:
      - id: conditional-address-clipboard-forward
      - id: clipboard-context-marker
  - id: replace-wallet-address
    desc: Clipboard-backed wallet address replacement
    crit: suspicious
    conf: 0.9
    near_lines: 80
    all:
      - id: clipboard-context-marker
      - id: wallet-rewrite-operation
    any:
      - id: wallet-address-eth-marker
      - id: wallet-address-btc-marker
  - id: address-swap-conditional-eth
    desc: Conditional ETH clipboard replacement
    crit: suspicious
    conf: 0.9
    near_lines: 80
    all:
      - id: conditional-address-clipboard
      - id: wallet-address-eth-marker
  - id: js-clipboard-wallet
    desc: JavaScript clipboard with named wallet address
    crit: suspicious
    conf: 0.85
    for: [javascript]
    near_bytes: 320
    all:
      - id: js-clipboard-api
    any:
      - id: js-wallet-address-eth
      - id: js-wallet-address-btc
    unless: []
  - id: vscode-clipboard-address-hijacker
    desc: VS Code extension replaces clipboard with an Ethereum address
    crit: hostile
    conf: 0.99
    attack: T1115,T1565.001
    for: [javascript, typescript]
    near_bytes: 512
    all:
      - id: metadata/library/vscode::vscode-extension-marker
      - id: metadata/permission/clipboard::clipboard-read
      - id: metadata/permission/clipboard::clipboard-write
      - id: vscode-clipboard-hardcoded-eth-write
  - id: vscode-wallet-clipboard-replacement
    desc: VS Code extension writes a hardcoded wallet destination after clipboard access
    crit: hostile
    conf: 0.99
    attack: T1115,T1565.001
    for: [javascript, typescript]
    near_bytes: 512
    all:
      - id: metadata/library/vscode::vscode-extension-marker
      - id: metadata/permission/clipboard::clipboard-read
      - id: metadata/permission/clipboard::clipboard-write
      - id: vscode-clipboard-named-eth-write
      - id: wallet-var-reassign-eth
  - id: address-swap-conditional-btc
    desc: Conditional BTC clipboard replacement
    crit: suspicious
    conf: 0.9
    near_lines: 80
    all:
      - id: conditional-address-clipboard
      - id: wallet-address-btc-marker
  - id: keystore-access
    desc: Accesses Ethereum keystore
    crit: suspicious
    conf: 0.8
    any:
      - id: objectives/credential-access/wallet/desktop::ethereum-keystore
      - id: objectives/credential-access/wallet/desktop::doteth-keystore
      - id: objectives/credential-access/wallet/desktop::mist-keystore
  - id: address-reassign-bare
    desc: Address or wallet variable assigned a hardcoded crypto address
    crit: component
    conf: 0.8
    any:
      - id: address-var-reassign-eth
      - id: address-var-reassign-btc
      - id: wallet-var-reassign-eth
      - id: wallet-var-reassign-btc
  - id: clipboard-manipulation-marker
    desc: Clipboard read/write manipulation
    crit: component
    conf: 0.8
    any:
      - id: py-clipboard-replace
      - id: ps1-clipboard-replace
      - id: js-clipboard-write
      - id: micro-behaviors/os/clipboard/access::browser-clipboard-read
      - id: micro-behaviors/os/clipboard/access::browser-paste-event-handler
  - id: address-variable-reassign
    desc: Hardcoded crypto address paired with clipboard manipulation
    crit: suspicious
    conf: 0.85
    near_lines: 80
    all:
      - id: address-reassign-bare
      - id: clipboard-manipulation-marker
  - id: js-clipboard-observer-marker
    desc: JavaScript clipboard observation marker
    crit: component
    conf: 0.8
    any:
      - id: micro-behaviors/os/clipboard/access::browser-paste-event-handler
      - id: js-clipboard-write
      - id: micro-behaviors/os/clipboard/monitor::javascript-clipboard-polling
  - id: js-clipboard-monitor
    desc: JavaScript clipboard monitoring
    crit: notable
    conf: 0.85
    near_lines: 40
    all:
      - id: micro-behaviors/os/clipboard/access::browser-clipboard-read
      - id: js-clipboard-wallet
    any:
      - id: js-clipboard-observer-marker
      - id: js-clipboard-wallet
  - id: address-swap-conditional
    desc: Conditional wallet address swap
    crit: suspicious
    conf: 0.9
    any:
      - id: address-swap-conditional-eth
      - id: address-swap-conditional-btc
    unless: []
  - id: py-clipboard-wallet
    desc: Python clipboard with wallet address
    crit: suspicious
    conf: 0.85
    any:
      - id: py-clipboard-wallet-eth
      - id: py-clipboard-wallet-btc
  - id: crypto-address-swap
    desc: Cryptocurrency address swapping attack
    crit: hostile
    conf: 0.95
    mbc: E1485
    any:
      - id: replace-wallet-address
      - id: address-swap-conditional
    unless:
      - id: well-known/tool/sysadmin/alpine-packages::alpine-langfuse-package
      - id: metadata/library/structure::js-large-module-bundle
  - id: ps1-clipboard-wallet
    desc: PowerShell clipboard with wallet address
    crit: suspicious
    conf: 0.85
    any:
      - id: ps1-clipboard-wallet-btc
      - id: ps1-clipboard-wallet-eth
  - id: clipboard-crypto-hijacker
    desc: Clipboard cryptocurrency hijacker
    crit: hostile
    conf: 0.95
    attack: T1115
    needs: 2
    any:
      - id: py-clipboard-wallet
      - id: py-clipboard-replace
      - id: js-clipboard-wallet
      - id: ps1-clipboard-wallet
      - id: ps1-clipboard-replace
      - id: btc-address-hardcoded
  - id: browser-multichain-clipboard-hijacker
    desc: Browser clipboard rewrites cryptocurrency wallet addresses
    crit: hostile
    conf: 0.99
    attack: T1115
    for: [javascript, typescript]
    # Bind wallet recognition, replacement, and clipboard access to one compact
    # routine instead of combining unrelated utilities across a large bundle.
    near_bytes: 8192
    all:
      # This composite requires regexes for at least two supported chains.
      - id: micro-behaviors/data/format/crypto-address::multi-chain-address-regex
      # At least two `.replace(table.btc|eth|trx, destination)` operations.
      - id: micro-behaviors/data/string/replace::keyed-replacement-call
      - id: micro-behaviors/os/clipboard/access::browser-clipboard-read
      - id: micro-behaviors/os/clipboard/access::browser-clipboard-write
  # A clipper does not need to support several chains to be effective. Keep a
  # one-chain form separate from the multi-chain rule so a future variant that
  # only recognizes (for example) Bitcoin is still detected without weakening
  # the multi-chain observation.
  - id: browser-clipboard-address-hijacker
    desc: Browser clipboard rewrites a cryptocurrency address
    crit: hostile
    conf: 0.98
    attack: T1115
    for: [javascript, typescript]
    near_bytes: 8192
    all:
      - id: micro-behaviors/data/string/replace::keyed-replacement-call
      - id: micro-behaviors/os/clipboard/access::browser-clipboard-read
      - id: micro-behaviors/os/clipboard/access::browser-clipboard-write
      - id: micro-behaviors/data/format/crypto-address::single-chain-address-regex
  # The linked Adform sample decodes destination wallets at runtime. The
  # clipboard/address/replacement legs establish the attack; this additional
  # rule records the obfuscated delivery form without depending on a wallet
  # literal that attackers can trivially change.
  - id: browser-obfuscated-wallet-clipper
    desc: Obfuscated browser clipboard wallet replacement
    crit: hostile
    conf: 0.98
    attack: T1115
    for: [javascript, typescript]
    near_bytes: 8192
    all:
      - id: browser-clipboard-address-hijacker
    any:
      - id: micro-behaviors/crypto/symmetric/xor/loop::xor-modulo-key-loop
      - id: micro-behaviors/data/encode/xor::js-xor-decoder-ast
      - id: micro-behaviors/data/encode/char-code::fromcharcode-xor-rebuild
      - id: micro-behaviors/data/decode/base64::atob-decode
  # The browser paste event path is distinct from navigator.clipboard.readText:
  # injected scripts can rewrite a paste before it reaches the page. A single
  # supported chain is enough to establish the wallet-replacement technique;
  # multi-chain coverage remains available through the composite above.
  - id: browser-event-clipboard-address-hijacker
    desc: Browser paste handler swaps cryptocurrency addresses
    crit: hostile
    conf: 0.98
    attack: T1115
    for: [javascript, typescript]
    near_bytes: 8192
    all:
      - id: micro-behaviors/data/format/crypto-address::single-chain-address-regex
      - id: micro-behaviors/data/string/replace::keyed-replacement-call
      - id: micro-behaviors/os/clipboard/access::browser-dom-clipboard-paste

  - id: js-clipboard-address-hijacker
    desc: Browser JavaScript rewrites a cryptocurrency address from the clipboard
    crit: hostile
    conf: 0.99
    attack: T1115,T1565.001
    for: [javascript, typescript]
    near_bytes: 512
    all:
      - id: js-clipboard-wallet
      - id: micro-behaviors/os/clipboard/transform::browser-clipboard-write-transformed-text
  # Polling clippers that match wallet address regexes and rewrite via
  # navigator.clipboard — including demo destinations like 0x1111… that the
  # named-wallet atoms intentionally exclude. Address-format recognition plus
  # polled read/transform/write is the clipper shape without needing a keyed
  # replacement table.
  - id: browser-polled-clipboard-address-hijacker
    desc: Browser polls clipboard and rewrites cryptocurrency addresses
    crit: hostile
    conf: 0.97
    attack: T1115,T1565.001
    for: [javascript, typescript]
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/format/crypto-address::eth-address-regex
      - id: micro-behaviors/os/clipboard/monitor::javascript-clipboard-polling
      - id: micro-behaviors/os/clipboard/access::browser-clipboard-read
      - id: micro-behaviors/os/clipboard/access::browser-clipboard-write
      - id: micro-behaviors/os/clipboard/transform::browser-clipboard-write-transformed-text
  # Some clippers rewrite the destination in an input, textarea, or
  # contenteditable control rather than writing the OS clipboard. This is the
  # direct-form variant described in the linked Adform capture and remains
  # useful when a future implementation drops navigator.clipboard entirely.
  - id: browser-editable-wallet-address-hijacker
    desc: Browser editable field rewrites cryptocurrency address
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/format/crypto-address::single-chain-address-regex
      - id: micro-behaviors/data/string/replace::keyed-replacement-call
      - id: micro-behaviors/ui/window/form-input::browser-editable-content-selector-sweep
    any:
      - id: micro-behaviors/os/clipboard/access::browser-dom-clipboard-paste
      - id: micro-behaviors/ui/window/form-input::capture-phase-input-listener
      - id: micro-behaviors/process/hook/interception::browser-form-value-setter-hook
      - id: micro-behaviors/ui/window/dom-access::browser-dom-text-node-rewrite
  - id: networked-browser-wallet-clipper
    desc: Rewrites copied wallet addresses and beacons page context
    crit: hostile
    conf: 0.995
    attack: T1115
    for: [javascript, typescript]
    near_bytes: 16384
    all:
      # Carries address recognition + replacement + clipboard legs. This
      # networked form also applies to one-chain variants.
      - id: browser-clipboard-address-hijacker
      # Requires a raw-IP XHR beacon carrying the current host and path.
      - id: objectives/command-and-control/beacon/network/http::browser-page-context-direct-ip-beacon
  # Node/CLI clippers (npm supply-chain trojans) neither touch `navigator.clipboard`
  # nor `clip.exe`; they shell out to pbpaste/xclip/Get-Clipboard to read and
  # pbcopy/xclip/Set-Clipboard to write. Read+write of the system clipboard via
  # these helpers, in a script that also embeds a hardcoded destination wallet
  # address, is the clipper shape — no legitimate clipboard utility ships a
  # hardcoded BTC/ETH/SOL address.
  - id: node-cli-clipboard-crypto-clipper
    desc: Node clipboard clipper rewrites copied wallet address
    crit: hostile
    conf: 0.95
    attack: T1115
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/os/clipboard/access::node-cli-clipboard-readwrite
      - id: micro-behaviors/data/format/crypto-address/
  # The same substitution technique can run as a Python utility rather than
  # browser JavaScript or a Node CLI helper. Require a concrete clipboard
  # read/write pair, a recognized wallet format, and a regex substitution.
  - id: python-clipboard-crypto-clipper
    desc: Python clipboard clipper rewrites a cryptocurrency address
    crit: hostile
    conf: 0.95
    attack: T1115
    for: [python]
    near_lines: 100
    all:
      - id: micro-behaviors/os/clipboard/access::python-clipboard-readwrite
      - id: micro-behaviors/data/format/crypto-address::single-chain-address-regex
      - id: micro-behaviors/data/manipulation::python-substitution-call
  # WSH/JScript clippers read the clipboard via the htmlfile COM object
  # (`clipboardData.getData`) and rewrite it by shelling out to `clip.exe`,
  # neither of which the browser-API composites above cover. A table of
  # checksum-valid destination addresses + a clipboard write + a clipboard read
  # in one script is the clipper shape regardless of the exact APIs used.
  - id: wsh-clipboard-crypto-clipper
    desc: WSH clipboard crypto address clipper
    crit: hostile
    conf: 0.95
    attack: T1115
    for: [javascript, vbs, html]
    all:
      - id: micro-behaviors/data/format/crypto-address::hardcoded-bitcoin-address-table
      - id: micro-behaviors/os/clipboard/access::clip-exe-write
    any:
      - id: micro-behaviors/os/clipboard/access::browser-clipboarddata-get
      - id: micro-behaviors/os/clipboard/access::browser-clipboard-read
    needs: 1

  # Rust implementations commonly use a platform-backed clipboard provider
