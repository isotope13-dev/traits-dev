# A class that both reads and rewrites clipboard text on a worker thread, keeps
# its strings encrypted and renames members with look-alike I/l identifiers is
# a clipboard hijacker: it swaps copied wallet addresses for the attacker's.
defaults:
  platforms: [windows, unix]
  for: [class, java_class]
  attack: T1565.002,T1115
composite_rules:
  - id: java-obfuscated-clipboard-read-rewrite-poller
    desc: Obfuscated Java class reads and rewrites clipboard
    crit: hostile
    conf: 0.8
    all:
      - id: micro-behaviors/os/clipboard/read::jvm-clipboard-get-contents-import
      - id: micro-behaviors/os/clipboard/write::java-clipboard-text-write
      - id: micro-behaviors/process/create/thread::jvm-thread-start-bytecode
      - id: micro-behaviors/crypto/key/representation::secretkeyspec
      - id: objectives/anti-static/obfuscation/obfuscator/bytecode::il-lookalike-obfuscated-identifiers
