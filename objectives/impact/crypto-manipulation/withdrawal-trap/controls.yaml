# An ordinary payout rejection is not suspicious. Advancing through an indexed
# collection of withdrawal errors while refusing payouts suggests a refusal
# funnel. Forced-loss settlement supplies the hostile context in its consumer.
# Source: https://www.recordedfuture.com/research/prediction-markets-traffer-teams
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]

composite_rules:
  - id: escalating-withdrawal-refusals
    desc: Withdrawal stages advance through errors while denying payouts
    crit: suspicious
    conf: 0.94
    attack: T1657
    all:
      - id: micro-behaviors/data/transaction/withdraw::refusal-stage-increment
      - id: micro-behaviors/data/transaction/withdraw::refusal-table-index
      - id: micro-behaviors/data/transaction/withdraw::payout-denied-return
