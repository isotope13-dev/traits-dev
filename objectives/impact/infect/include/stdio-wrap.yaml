# Header infectors drop a wrapper stdio.h on the compiler include path
# so later C builds pull in the virus via close()/virfunc hooks.
defaults:
  platforms: [unix]
  for: [elf, c]
  attack: T1554
  mbc: B0009

traits:
  - id: local-include-stdio-path
    desc: Drops stdio.h on local include path
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: /usr/local/include/stdio.h
  - id: virfunc-hook
    desc: Declares a virfunc infection hook
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: virfunc(
  - id: include-stdio-virus-notice
    desc: Announces a new wrapped stdio.h
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: new stdio.h

composite_rules:
  - id: stdio-wrap-virfunc-infector
    desc: Wrapped stdio.h with virfunc hook
    crit: hostile
    conf: 0.97
    all:
      - id: local-include-stdio-path
      - id: virfunc-hook
  - id: stdio-wrap-new-header-notice
    desc: New stdio.h drop on include path
    crit: hostile
    conf: 0.96
    all:
      - id: local-include-stdio-path
      - id: include-stdio-virus-notice
  - id: virfunc-new-stdio-infector
    desc: virfunc hook with new stdio.h notice
    crit: hostile
    conf: 0.96
    all:
      - id: virfunc-hook
      - id: include-stdio-virus-notice
