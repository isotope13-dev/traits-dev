defaults:
  platforms: [windows]
  for: [pe]
  attack: T1080,T1091

composite_rules:
  # A native binary that enumerates every drive, walks directories while
  # copying itself and restoring file times, and carries the path of WinRAR's
  # console archiver is a self-propagating archive infector: it can drop copies
  # into the files users share. Each trait is common alone; together they
  # describe a worm driving rar.exe over the drives it walks.
  - id: drive-walking-self-copier-with-winrar
    desc: Drive-walking self-copier driving WinRAR rar.exe
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/data/archive/modify::winrar-console-archiver-path
      - id: micro-behaviors/fs/traversal/drives::logical-drive-type-enumeration
      - id: micro-behaviors/fs/file/timestamp::set-file-time-with-walk-and-self-path
      - id: micro-behaviors/fs/file/copy::copyfile-module-path-api-pair
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
