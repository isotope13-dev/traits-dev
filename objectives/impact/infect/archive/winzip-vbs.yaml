defaults:
  platforms: [windows]
  for: [vbs]
composite_rules:
  # Requires self-copy plus enumeration of existing ZIP targets and an archive
  # add command carrying a system-folder payload. No lure filename is required.
  - id: wsh-zip-self-copy-insertion
    desc: WSH self-copy with bulk ZIP payload insertion
    crit: hostile
    conf: 0.97
    attack: T1080
    all:
      - id: micro-behaviors/fs/file/copy::wsh-self-getfile-near-copy
      - id: micro-behaviors/fs/enumerate/directory::fso-files-collection
      - id: micro-behaviors/fs/path/extension::vbs-zip-extension-check
      - id: micro-behaviors/data/archive/modify::winzip-app-path
      - id: micro-behaviors/data/archive/modify::wsh-add-filepath-system-folder
