defaults:
  for: [ne]
  platforms: [windows]
  attack: T1565.001

traits:
  - id: dos-resident-zip-file-infector
    desc: Resident DOS code rewrites ZIP archives
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule dos_resident_zip_file_infector {
          strings:
            $resident = { B4 30 BB 77 77 CD 21 81 FB 57 57 }
            $open = { B8 02 3D CD 21 C6 06 ?? ?? 00 }
            $zip = { C7 05 50 4B C7 45 02 03 04 C7 45 04 0A 00 }
            $copy = { 8B 1E ?? ?? B9 00 01 BA ?? ?? E8 ?? ?? 91 0B C9 74 ?? 8B 1E ?? ?? E8 ?? ?? }
          condition:
            uint16(0) == 0x5a4d and all of them
        }
