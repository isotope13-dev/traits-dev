# Microsoft Access (Jet) macro viruses: an Autoexec macro runs a VBA module
# that globs for *.mdb files and copies its own module and macro into each via
# DoCmd.TransferDatabase acExport. The VBA p-code is compressed, but the
# identifier table and macro names stay plaintext in the Jet pages.
defaults:
  conf: 0.9
  for: [data]
  platforms: [windows]
  attack: T1204.002
  mbc: E1204

traits:
  - id: jet-database-header
    desc: Microsoft Access Jet database header
    crit: component
    if:
      type: text
      word: Standard Jet DB

  - id: autoexec-macro
    desc: Access Autoexec startup macro
    crit: notable
    if:
      type: text
      word: Autoexec

  - id: transferdatabase-export
    desc: DoCmd.TransferDatabase export identifiers
    crit: notable
    if:
      type: text
      regex: TransferDatabase|acExport

  - id: export-module-or-macro
    desc: Exports Access module or macro objects
    crit: notable
    if:
      type: text
      regex: \bac(Module|Macro)\b

  - id: mdb-wildcard
    desc: Wildcard search for Access databases
    crit: notable
    if:
      type: text
      regex: \*\.mdb\b

composite_rules:
  - id: access-transferdatabase-self-copy
    desc: Access macro virus copying itself into .mdb files
    crit: hostile
    conf: 0.95
    all:
      - id: jet-database-header
      - id: autoexec-macro
      - id: mdb-wildcard
      - id: export-module-or-macro
      - id: transferdatabase-export
