defaults:
  for: [data, dos_com]
  platforms: [windows, unix]

traits:
  - id: pmg-builder-banner
    desc: Powerpoint Macro Generator builder banner
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: Powerpoint Macro Generator
  - id: pmg-virus-name-prompt
    desc: Builder prompts for a virus name
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "Virus Name:"
  - id: pmg-infection-sign-prompt
    desc: Builder prompts for an infection sign
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "Infection Sign:"
  - id: vba-module-insert-lines-template
    desc: Generated code inserts VBA module lines
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: .CodeModule.InsertLines
  - id: ppt-run-macro-action-template
    desc: Presentation action runs a macro
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: ppActionRunMacro

composite_rules:
  - id: pmg-macro-virus-builder
    desc: DOS builder generates PowerPoint macro virus code
    crit: hostile
    conf: 0.96
    all:
      - id: vba-module-insert-lines-template
      - id: ppt-run-macro-action-template
    any:
      - id: pmg-builder-banner
      - id: pmg-virus-name-prompt
      - id: pmg-infection-sign-prompt
    needs: 1
