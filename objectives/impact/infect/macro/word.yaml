defaults:
  conf: 0.97
  for: [oledoc]
  platforms: [windows]
  attack: T1204.002
  mbc: E1204

traits:
  - id: ww6-infector-marker
    desc: WW6 macro virus self-marker string
    crit: suspicious
    if:
      type: text
      regex: WW6I(nfector|Instance)

composite_rules:
  # The Concept/WW6 replication shape that the auto-open composites miss:
  # the infector's copy loop addresses the global template's *command* macros
  # ("Global:DocClose", "Global:ToolsSpelling", "Global:PayLoad") instead of
  # an auto-run entrypoint, so infection rides on documents the victim closes
  # or saves. Global-container addressing of arbitrary macros plus the WW6
  # self-marker is macro-virus replication plumbing with no benign reading.
  - id: ww6-global-command-macro-spreader
    desc: WW6 infector copies global command macros
    crit: hostile
    conf: 0.95
    all:
      - id: ww6-infector-marker
      - id: micro-behaviors/process/create/macro/office::global-qualified-macro-path

  - id: word-macro-filesaveas-spreader
    desc: Word macro virus spreading via FileSaveAs and NORMAL.DOT
    crit: hostile
    all:
      - id: micro-behaviors/process/create/macro/office::wordbasic-autoopen
      - id: micro-behaviors/process/create/macro/office::wordbasic-filesaveas-hook
      - id: micro-behaviors/process/create/macro/office::wordbasic-normal-dot-ref

  # The WordBasic replication shape behind Wazzu-class Word 6 viruses: the
  # document carries an autoOpen entrypoint and its (often compressed) macro
  # code names the same auto-run macro through a container-qualified path —
  # `FileName$() & ":autoOpen"` — *and* through the global container
  # (`"Global:autoOpen"`). Addressing one's own auto-run macro in both
  # containers is macro-copy plumbing; a document has no benign reason to do
  # it. `word-macro-filesaveas-spreader` misses this class because the copy
  # uses MacroCopy on macro paths, not FileSaveAs.
  - id: wordbasic-autoopen-container-copier
    desc: WordBasic virus copies macro between containers
    crit: hostile
    conf: 0.96
    near_bytes: 900
    all:
      - id: micro-behaviors/process/create/macro/office::wordbasic-autoopen
      - id: micro-behaviors/process/create/macro/office::colon-qualified-auto-run-macro-path
      - id: micro-behaviors/process/create/macro/office::global-qualified-macro-path

  - id: wordbasic-execute-only-auto-infector
    desc: WordBasic execute-only macro virus
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/macro/office::wordbasic-autoopen
      - id: objectives/evasion/anti-av/document::wordbasic-execute-only-auto-macro

  - id: wordbasic-encrypted-command-hook-infector
    desc: WordBasic encrypted command-hook infector
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/macro/office::wordbasic-command-hook
      - id: objectives/evasion/anti-av/document::wordbasic-encrypted-macro-table

  - id: wordbasic-encrypted-auto-macro-infector
    desc: WordBasic encrypted auto-macro infector
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/macro/office::wordbasic-autoopen
      - id: objectives/evasion/anti-av/document::wordbasic-encrypted-macro-table



