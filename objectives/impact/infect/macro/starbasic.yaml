# The StarOffice macro-virus replication shape: a Basic module checks both the
# application's shared (GlobalScope) libraries and the current document's
# libraries for a module, then saves the current document in place. Probing
# both containers and re-storing the host document is copy-into-library
# plumbing; an ordinary document macro has no reason to do both.
defaults:
  for: [xml]
  platforms: [windows, unix]
  attack: T1204.002
  mbc: E1204

composite_rules:
  - id: starbasic-library-probe-and-document-store
    desc: Basic probes macro libraries and re-saves document
    crit: hostile
    conf: 0.92
    all:
      - id: metadata/document/office/macro::starbasic-module-xml-root
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::starbasic-application-and-document-library-lookup
      - id: micro-behaviors/fs/write/file/full/unspecified::starbasic-current-document-store
