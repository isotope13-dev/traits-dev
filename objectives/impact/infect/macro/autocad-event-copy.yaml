# AutoCAD VBA virus that hooks AcadDocument events, reads its own code module
# lines, and inserts them into every other open drawing's code module. The
# sibling composites in autocad.yaml key on one variant's exact statements;
# this one keys on the behaviour: event hook + self-copy read + module insert
# + a handle on the running AutoCAD application.
defaults:
  for: [vbs, oledoc]
  platforms: [windows]
  size_max: 16384
  attack: T1204.002
  mbc: B0009
traits:
  - id: acad-document-event-handler
    desc: AutoCAD document event handler
    crit: notable
    conf: 0.85
    if:
      type: text
      case_insensitive: true
      regex: 'Sub AcadDocument_(BeginClose|Deactivate|Activate|BeginSave)\('

  - id: vba-module-self-copy-lines
    desc: Reads own code module lines into variable
    crit: suspicious
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '=\s*\w+\.lines\(1,\s*\w+\.countoflines\)'

  - id: acad-getobject-running-instance
    desc: Attaches to running AutoCAD application
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: 'GetObject\(\s*,\s*"AutoCAD\.Application"'

composite_rules:
  - id: autocad-event-code-module-copier
    desc: AutoCAD macro copies its code into other drawings on events
    crit: hostile
    conf: 0.97
    all:
      - id: acad-document-event-handler
      - id: vba-module-self-copy-lines
      - id: acad-getobject-running-instance
      - id: micro-behaviors/metaprogramming/generation/transform::vba-codemodule-insert-lines
