defaults:
  for: [text]
  platforms: [windows]
  conf: 0.95
composite_rules:
  - id: autocad-startup-file-copy-propagation
    desc: AutoCAD startup copier with drawing discovery
    crit: hostile
    all:
      - id: micro-behaviors/process/create/macro/autocad::autolisp-startup-hook
      - id: micro-behaviors/fs/search::autocad-startup-script-lookup
      - id: micro-behaviors/fs/search::autocad-support-directory-lookup
      - id: micro-behaviors/data/config/read::autocad-drawing-name-getvar
      - id: micro-behaviors/fs/path-ops/join::autocad-startup-script-path
      - id: micro-behaviors/fs/file/copy::autolisp-line-copy-loop

  - id: autocad-startup-script-propagation
    desc: Startup Lisp copying with drawing discovery
    crit: hostile
    all:
      - id: micro-behaviors/fs/search::autocad-startup-script-lookup
      - id: micro-behaviors/fs/search::autocad-support-directory-lookup
      - id: micro-behaviors/data/config/read::autocad-drawing-name-getvar
      - id: micro-behaviors/fs/path-ops/join::autocad-startup-script-path
      - id: micro-behaviors/fs/file/copy::autolisp-line-copy-loop
      - id: micro-behaviors/metaprogramming/generation::autolisp-write-load-form

  # Append plus a nearby read-line compare/write, aimed at acad.mnl,
  # *.mnl, *.lsp, acad.exe, and the current drawing's acaddoc.lsp.
  # The load-form propagator above does not cover this copier.
  - id: autocad-startup-line-propagation
    desc: Line-append targets AutoCAD startup files
    crit: hostile
    all:
      - id: micro-behaviors/fs/file/open::autolisp-append-mode
      - id: micro-behaviors/fs/file/copy::autolisp-readline-compare-write
      - id: micro-behaviors/fs/search::autolisp-lsp-file-listing
      - id: micro-behaviors/fs/search::autolisp-mnl-file-listing
      - id: micro-behaviors/fs/search::autocad-menu-lisp-lookup
      - id: micro-behaviors/fs/search::autocad-executable-lookup
      - id: micro-behaviors/fs/path-ops/join::autocad-startup-script-path
      - id: micro-behaviors/data/config/read::autocad-drawing-name-getvar
