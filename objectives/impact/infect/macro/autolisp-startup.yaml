defaults:
  for:
  - text
  platforms:
  - windows
  conf: 0.95
  crit: hostile
composite_rules:
- id: autocad-startup-file-copy-propagation
  desc: AutoCAD startup copier with drawing discovery
  all:
  - id: micro-behaviors/process/create/macro/autocad::autolisp-startup-hook
  - id: micro-behaviors/fs/search/content::autocad-startup-script-lookup
  - id: micro-behaviors/fs/search/content::autocad-support-directory-lookup
  - id: micro-behaviors/data/config/read::autocad-drawing-name-getvar
  - id: micro-behaviors/fs/path-ops::autocad-startup-script-path
  - id: micro-behaviors/fs/file/copy/call::autolisp-line-copy-loop
- id: autocad-startup-script-propagation
  desc: Startup Lisp copying with drawing discovery
  all:
  - id: micro-behaviors/fs/search/content::autocad-startup-script-lookup
  - id: micro-behaviors/fs/search/content::autocad-support-directory-lookup
  - id: micro-behaviors/data/config/read::autocad-drawing-name-getvar
  - id: micro-behaviors/fs/path-ops::autocad-startup-script-path
  - id: micro-behaviors/fs/file/copy/call::autolisp-line-copy-loop
  - id: micro-behaviors/metaprogramming/generation::autolisp-write-load-form
- id: autocad-startup-line-propagation
  desc: Line-append targets AutoCAD startup files
  all:
  - id: micro-behaviors/fs/file/open::autolisp-append-mode
  - id: micro-behaviors/fs/file/copy/call::autolisp-readline-compare-write
  - id: micro-behaviors/fs/search/content::autolisp-lsp-file-listing
  - id: micro-behaviors/fs/search/content::autolisp-mnl-file-listing
  - id: micro-behaviors/fs/search/content::autocad-menu-lisp-lookup
  - id: micro-behaviors/fs/search/content::autocad-executable-lookup
  - id: micro-behaviors/fs/path-ops::autocad-startup-script-path
  - id: micro-behaviors/data/config/read::autocad-drawing-name-getvar
