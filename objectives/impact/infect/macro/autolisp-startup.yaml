defaults:
  for: [text]
  platforms: [windows]
  conf: 0.95
composite_rules:
  - id: autocad-startup-script-propagation
    desc: Startup Lisp copying with drawing discovery
    crit: hostile
    all:
      - id: micro-behaviors/fs/search::autocad-startup-script-lookup
      - id: micro-behaviors/fs/search::autocad-support-directory-lookup
      - id: micro-behaviors/data/config/read::autocad-drawing-name-getvar
      - id: micro-behaviors/fs/path-ops/join::autocad-startup-script-path
      - id: micro-behaviors/fs/file/copy::autolisp-line-copy-loop
      - id: micro-behaviors/metaprogramming/generation::autolisp-write-load-form
