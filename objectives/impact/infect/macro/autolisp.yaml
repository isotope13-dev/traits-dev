defaults:
  platforms: [windows]
  for: [text, static-lib]
  attack: T1080

traits:
  - id: lisp-open-append
    desc: Opens a file for append
    crit: suspicious
    conf: 0.86
    if:
      type: text
      regex: '(?i)\(open [A-Za-z0-9_]+ "a"\)'

  - id: lisp-directory-lsp
    desc: Lists lisp files in a directory
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)vl-directory-files[^\r\n]{0,60}\.lsp'

composite_rules:
  - id: lisp-appends-into-scripts
    desc: Appends source into walked lisp files
    crit: hostile
    conf: 0.94
    all:
      - id: lisp-open-append
      - id: lisp-directory-lsp
