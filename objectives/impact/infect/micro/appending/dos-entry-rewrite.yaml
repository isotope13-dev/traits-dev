# A direct-action COM infector saves three entry bytes, calculates the jump
# displacement from the old EOF, writes the new entry, and appends its own body.
# Addresses and image size are deliberately variable; no family/name marker.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 65536
traits:
  - id: dos-entry-rewrite-self-append-code
    desc: DOS entry rewrite and self-append sequence
    crit: suspicious
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_entry_rewrite_self_append {
          strings:
            $read_entry = { B4 3F BA ?? ?? 03 D6 8B 9C ?? ?? B9 03 00 CD 21 }
            $rewrite = { B4 40 8B 9C ?? ?? B9 03 00 8B 94 ?? ?? 83 EA 03 89 94 ?? ?? BA ?? ?? 03 D6 CD 21 }
            $append = { B4 42 8B 9C ?? ?? 33 C9 33 D2 B0 02 CD 21 B4 40 BA ?? ?? 03 D6 8B 9C ?? ?? 8B 8C ?? ?? CD 21 }
            $restore = { B9 03 00 33 ED BF 00 01 8A 82 ?? ?? 45 AA E2 ?? BF 00 01 FF E7 }
            $targets = "*.com" nocase
          condition:
            all of them and @read_entry < @rewrite and @rewrite < @append
            and @append - @read_entry < 256
        }

composite_rules:
  - id: dos-save-entry-rewrite-and-self-append
    desc: DOS search loop infects COM entries
    crit: hostile
    conf: 0.99
    all:
      - id: dos-entry-rewrite-self-append-code
      - id: micro-behaviors/fs/search::dos-int21-find-first
      - id: micro-behaviors/fs/file/open::dos-int21-open-dta-filename
