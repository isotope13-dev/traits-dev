defaults:
  platforms: [unix]
  for: [kotlin, class, jar]
  attack: T1542.003
composite_rules:
  - id: kotlin-grub-firmware-persistence
    desc: GRUB configuration with hidden firmware loader
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/lang/source/syntax/command/boot::grub-hidden-firmware-loader
    any:
      - id: micro-behaviors/fs/path/config/boot::grub-custom-config-path
      - id: metadata/lang/source/syntax/command/boot::firmware-health-menuentry
