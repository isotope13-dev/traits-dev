defaults:
  for:
  - text
  - reg
  platforms:
  - windows

composite_rules:
  - id: reg-run-export-replication-attempt
    desc: Attempts Run export replication into REG files
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/file/format/registry-script::reg-default-shell-command
      - id: objectives/impact/destroy/user-data::reg-wildcard-export-overwrite
      - id: "micro-behaviors/os/registry/autostart/reference::windows-run-key-path"
      - id: micro-behaviors/os/registry/read::regedit-export-run-key
