defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
  size_min: 512
  size_max: 131072
  attack: T1542.003,T1574

traits:
  - id: dos-boot-reserves-bios-memory-via-ax
    desc: Boot code reduces BIOS available memory
    crit: notable
    if:
      type: hex
      pattern: 'A1 13 04 83 E8 ?? A3 13 04'
      offset_range: [0, 512]

composite_rules:
  - id: dos-boot-resident-file-and-sector-mutator
    desc: Boot resident code intercepts and writes files
    crit: hostile
    conf: 0.97
    all:
      - id: dos-boot-reserves-bios-memory-via-ax
      - id: boot-signature-55aa
      - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-set-direct
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
      - id: objectives/impact/wipe/disk/mbr::dos-int13-ax-sector-write
      - id: metadata/binary/instruction/sequence/control-flow::x86-ah40-short-jump
