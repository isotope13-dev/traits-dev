defaults:
  platforms: [windows, unix]
  for: [dos_com]
  attack: T1542.003,T1564

composite_rules:
  - id: dos-boot-write-resident-file-stealth
    desc: DOS resident code writes sectors hides file size
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/impact/wipe/disk/mbr::dos-int13-ax-sector-write
      - id: objectives/impact/infect/binary/dos/file::dos-dta-size-hide-es-bx
      - id: objectives/impact/infect/binary/dos/interrupt::dos-save-replace-int21-vector
      - id: objectives/impact/infect/binary/dos/sft::dos-sft-force-rw
