defaults:
  platforms: [windows, unix]
  for: [data]
  size_min: 512
  size_max: 131072
  attack: T1542.003
traits:
  # Component leg only: the two-byte MZ magic alone is common in ordinary DOS EXEs.
  - id: mz-boot-magic
    desc: MZ executable header at offset zero
    crit: component
    conf: 0.95
    if:
      type: hex
      pattern: "4D 5A"
      offset: 0
  # Saves the disk vector by loading 4Ch directly, or by loading 4Bh and
  # incrementing it to 4Ch (INT 13h).
  - id: mz-boot-disk-vector-copy
    desc: Boot code copies disk interrupt vector
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: "(BE 4C 00 [0-8] A5 A5|BE 4B 00 46 BF ?? 00 A5 A5)"
      offset_range: [512, 2048]
  - id: mz-boot-sector-write
    desc: BIOS write targets first sector
    crit: suspicious
    conf: 0.93
    if:
      type: hex
      pattern: "B8 01 03 [0-12] B9 01 00"
      offset_range: [512, 2048]
  - id: mz-boot-indirect-disk-call
    desc: Boot code calls saved disk vector
    crit: suspicious
    conf: 0.92
    if:
      type: hex
      pattern: "9C 2E FF 1E ?? ?? C3"
      offset_range: [512, 2048]
  # The boot code copies its own image from 7C00 to the top of memory.
  - id: mz-boot-self-relocate
    desc: Boot code relocates itself from 7C00
    crit: notable
    conf: 0.93
    if:
      type: hex
      pattern: "BE 00 7C 33 FF B9 ?? ?? F3 A4"
      offset_range: [512, 2048]
  # Writes its own handler's offset and segment into the INT 13h vector.
  - id: mz-boot-int13-hook-install
    desc: Boot code installs disk interrupt handler
    crit: notable
    conf: 0.93
    if:
      type: hex
      pattern: "C7 44 0C ?? ?? 8C 4C 0E"
      offset_range: [512, 2048]
composite_rules:
  - id: dos-mz-masqueraded-boot-infector
    desc: MZ image hides resident boot-sector infector
    crit: hostile
    conf: 0.97
    all:
      - id: mz-boot-magic
      - id: mz-boot-disk-vector-copy
      - id: mz-boot-sector-write
      - id: mz-boot-indirect-disk-call
  # Boot-sector infector that moves itself to top of memory, hooks INT 13h,
  # and saves the original disk vector (direct or incremented-offset form).
  - id: dos-mz-resident-int13-boot-infector
    desc: MZ image relocates and hooks INT 13h as boot infector
    crit: hostile
    conf: 0.95
    all:
      - id: mz-boot-magic
      - id: mz-boot-disk-vector-copy
      - id: mz-boot-self-relocate
      - id: mz-boot-int13-hook-install
