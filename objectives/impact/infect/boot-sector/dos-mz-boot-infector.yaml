defaults:
  platforms: [windows, unix]
  for: [data]
  size_min: 512
  size_max: 131072
  attack: T1542.003
traits:
  - id: mz-boot-magic
    desc: MZ header over boot image
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "4D 5A"
      offset: 0
  - id: mz-boot-disk-vector-copy
    desc: Boot code copies disk interrupt vector
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: "BE 4C 00 [0-8] A5 A5"
      offset_range: [512, 2048]
  - id: mz-boot-sector-write
    desc: BIOS write targets first sector
    crit: suspicious
    conf: 0.93
    if:
      type: hex
      pattern: "B8 01 03 [0-12] B9 01 00"
      offset_range: [512, 2048]
  - id: mz-boot-indirect-disk-call
    desc: Boot code calls saved disk vector
    crit: suspicious
    conf: 0.92
    if:
      type: hex
      pattern: "9C 2E FF 1E ?? ?? C3"
      offset_range: [512, 2048]
composite_rules:
  - id: dos-mz-masqueraded-boot-infector
    desc: MZ image hides resident boot-sector infector
    crit: hostile
    conf: 0.97
    all:
      - id: mz-boot-magic
      - id: mz-boot-disk-vector-copy
      - id: mz-boot-sector-write
      - id: mz-boot-indirect-disk-call
