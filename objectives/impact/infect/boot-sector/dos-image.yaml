defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [data, pe, static-lib]
  size_min: 512
  size_max: 65536
  attack: T1542.003

traits:
  - id: dos-read-mbr-sector
    desc: DOS reads the hard-disk boot sector
    conf: 0.9
    if:
      type: hex
      pattern: "B8 01 02 [0-12] BA 80 00 [0-6] CD 13"
      offset_range: [0, 512]

  - id: dos-write-hdd-sectors
    desc: DOS writes sectors to the hard disk
    conf: 0.9
    if:
      type: hex
      pattern: "B4 03 [0-12] BA 80 00 [0-4] CD 13"
      offset_range: [0, 512]

  - id: dos-copy-int13-vector
    desc: DOS copies the disk interrupt vector
    conf: 0.9
    if:
      type: hex
      pattern: "BE 4C 00 [0-6] A5 A5"
      offset_range: [0, 512]

  - id: dos-write-boot-buffer
    desc: DOS writes the loaded boot buffer
    conf: 0.92
    if:
      type: hex
      pattern: "B8 01 03 BB 00 7C"
      offset_range: [0, 512]

  - id: dos-drive0-write-then-exit
    desc: Disk write to drive zero then exits
    crit: suspicious
    conf: 0.93
    if:
      type: hex
      pattern: "33 D2 CD 13 [0-8] B8 00 4C CD 21"
      offset_range: [0, 512]

  - id: dos-drive0-write-then-exit-alt
    desc: Other XOR form then drive-zero exit
    crit: suspicious
    conf: 0.93
    if:
      type: hex
      pattern: "31 D2 CD 13 [0-8] B8 00 4C CD 21"
      offset_range: [0, 512]

  # Shrinks the BIOS base-memory count (DEC WORD [0413h] or INT 12h + MOV [0413h])
  # so code parked at the top of conventional memory survives DOS loading.
  - id: dos-boot-steal-bios-memory
    desc: Boot code shrinks BIOS base memory size
    conf: 0.92
    if:
      type: hex
      pattern: "(FF 0E 13 04 | CD 12 [0-4] A3 13 04)"
      offset_range: [0, 512]

  # Points INT 13h at resident code (direct MOV to 004Ch/004Eh or via DI=004Ch).
  - id: dos-boot-set-int13-vector
    desc: Boot code points INT 13h at itself
    conf: 0.92
    if:
      type: hex
      pattern: "(C7 06 4C 00 ?? ?? 8C ?? 4E 00 | BF 4C 00 [0-16] C7 05 ?? ?? 8C ?? 02)"
      offset_range: [0, 512]

composite_rules:
  - id: dos-boot-buffer-drive0-exit
    desc: Writes the boot buffer on drive zero
    crit: hostile
    conf: 0.94
    all:
      - id: dos-write-boot-buffer
      - id: dos-drive0-write-then-exit

  - id: dos-boot-buffer-drive0-exit-alt
    desc: Writes the boot buffer on drive zero
    crit: hostile
    conf: 0.94
    all:
      - id: dos-write-boot-buffer
      - id: dos-drive0-write-then-exit-alt

  - id: dos-hdd-boot-rewrite
    desc: DOS rewrites the hard-disk boot area
    crit: hostile
    conf: 0.94
    all:
      - id: dos-read-mbr-sector
      - id: dos-write-hdd-sectors

  - id: dos-hooked-boot-rewrite
    desc: DOS hooks disk and rewrites boot
    crit: hostile
    conf: 0.94
    all:
      - id: dos-copy-int13-vector
      - id: dos-write-boot-buffer

  # Hiding at the top of memory, taking over INT 13h, and carrying a one-sector
  # BIOS write is the resident boot-sector virus infection loop.
  - id: dos-resident-int13-boot-image-infector
    desc: Resident boot code hooks INT 13h and writes sectors
    crit: hostile
    conf: 0.95
    all:
      - id: dos-boot-steal-bios-memory
      - id: dos-boot-set-int13-vector
      - id: micro-behaviors/hardware/block/device::dos-boot-write-one-sector
