defaults:
  platforms: [windows, linux, macos]
  for: [data, pe, static-lib]
  size_min: 512
  size_max: 8192

traits:
  # Read through the BIOS wrapper, compare the on-disk code with the
  # resident body, then backward-copy code and issue two sector writes.
  # Addresses, copy lengths and branch/call displacements may vary.
  - id: dos-compare-copy-sector-rewrite
    desc: Compares and replaces on-disk boot code
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      pattern: "0E 07 B4 02 E8 ?? ?? 72 ?? 06 1F BE ?? ?? BF ?? ?? B9 ?? ?? 56 57 FC F3 A6 5E 5F 74 ?? 4E 4F B9 ?? ?? FD F3 A4 33 DB B4 03 E8 ?? ?? 72 ?? BB 00 02 B4 03 E8 ?? ??"
      offset_range: [128, 512]

composite_rules:
  # Ordinary boot managers can relocate; require the infection body too.
  - id: dos-resident-compare-rewrite-infector
    desc: Resident boot-sector rewrite infection
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/msdos/interrupt::bios-memory-reserve-bootstrap-hook
      - id: dos-compare-copy-sector-rewrite
      - id: metadata/file/format/native-executable::dos-boot-sector-ending-signature
