defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
  size_min: 512
  size_max: 8192
  attack: T1542.003

traits:
  - id: boot-reserves-conventional-ram-direct
    desc: Boot code shrinks the BIOS memory size
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: '83 2E 13 04 ??'
      offset_range: [0, 256]

  - id: boot-hidden-sector-far-stage
    desc: Loads hidden sectors and transfers execution
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: 'B8 ( 04 | 06 | 08 ) 02 [0-16] CD 13 [0-8] B8 ?? ?? 50 CB'
      offset_range: [0, 256]

  - id: boot-relocates-and-reads-resident-stage
    desc: Boot code relocates and reads disk stage
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: 'B1 06 D3 E0 8E C0 BE 00 7C [0-12] F3 ( A4 | A5 ) [0-48] CD 13 [0-80] CB'
      offset_range: [0, 384]

  - id: boot-swap-bios-disk-vector
    desc: Boot code swaps BIOS disk vector words
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: '87 06 4E 00 [0-14] 87 06 4C 00'
      offset_range: [0, 384]

  - id: boot-multi-sector-hook-writeback
    desc: Disk hook writes back modified boot sectors
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: 'B4 03 E8 ?? ?? [0-22] B8 02 03 [0-20] E8'
      offset_range: [320, 2048]

composite_rules:
  - id: boot-hidden-sector-loader-with-ram-reservation
    desc: Boot stage reserves BIOS memory and runs a hidden disk payload
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/infect/boot-sector::boot-signature-55aa
      - id: boot-reserves-conventional-ram-direct
      - id: boot-hidden-sector-far-stage

  - id: boot-relocated-conventional-memory-stage
    desc: Boot preloader hides in conventional memory and transfers to a disk stage
    crit: hostile
    conf: 0.97
    all:
      - id: dos-boot-reserves-bios-memory-via-ax
      - id: boot-relocates-and-reads-resident-stage

  - id: boot-resident-swapped-disk-vector-infector
    desc: Boot code installs a resident BIOS disk hook and rewrites boot sectors
    crit: hostile
    conf: 0.98
    all:
      - id: dos-boot-reserves-bios-memory-via-ax
      - id: boot-swap-bios-disk-vector
      - id: boot-multi-sector-hook-writeback
