# Boot-virus droppers shipped as .COM programs install the virus's own INT 13h
# handler straight into the IVT (0000:004C), issue a BIOS read of a boot
# sector so the freshly hooked handler infects the target disk, then put the
# original vector back and exit. Ordinary disk utilities use INT 21h/25h to
# hook, and do not swap the vector in and out around a single sector read.
defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [dos_com, static-lib, data]
  size_min: 512
  size_max: 65536
  attack: T1542.003

traits:
  - id: com-int13-ivt-swap
    desc: Swaps the INT 13h IVT slot
    conf: 0.9
    if:
      type: hex
      pattern: "BE 4C 00 [0-6] A5 A5 [0-12] BB 4C 00 89 07"
      offset_range: [0, 512]

  - id: com-boot-sector-read
    desc: Reads sector one via INT 13h
    conf: 0.85
    if:
      type: hex
      pattern: "B8 01 02 [0-12] B9 01 00 [0-4] CD 13"
      offset_range: [0, 512]

  - id: com-int13-restore-then-exit
    desc: Restores INT 13h vector then exits
    conf: 0.9
    if:
      type: hex
      pattern: "BB 4C 00 89 07 [0-10] 89 47 02 B8 00 4C CD 21"
      offset_range: [0, 512]

composite_rules:
  - id: com-hooked-boot-sector-infect
    desc: COM hooks disk to infect a boot sector
    crit: hostile
    conf: 0.93
    all:
      - id: com-int13-ivt-swap
      - id: com-boot-sector-read
      - id: com-int13-restore-then-exit
