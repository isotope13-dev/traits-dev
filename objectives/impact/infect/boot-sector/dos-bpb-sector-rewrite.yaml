defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
  size_min: 4096
  size_max: 65536
  attack: T1542.003

traits:
  - id: dos-int13-vector-save-at-entry
    desc: DOS entry saves BIOS disk interrupt vector
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: '33 C0 8E D8 BE 4C 00 BF ?? ?? A5 A5'
      offset: 0
  - id: dos-boot-bpb-copy-before-write
    desc: DOS code copies boot parameter block
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'BF 0B 7C BE 0B 78 B9 15 00 F3 A5'
  - id: dos-first-hard-disk-sector-write
    desc: DOS code writes first hard disk sector
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'BA 80 00 B9 01 00 B8 01 03 BB 00 7C CD 13'
  - id: dos-bios-eleven-sector-write
    desc: DOS code writes eleven BIOS sectors
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'BB 00 62 41 B8 0B 03 CD 13'

composite_rules:
  - id: dos-bpb-preserving-boot-sector-rewriter
    desc: DOS code preserves boot metadata and rewrites disk sectors
    crit: hostile
    conf: 0.99
    near_bytes: 30000
    all:
      - id: dos-int13-vector-save-at-entry
      - id: dos-boot-bpb-copy-before-write
      - id: dos-first-hard-disk-sector-write
      - id: dos-bios-eleven-sector-write
