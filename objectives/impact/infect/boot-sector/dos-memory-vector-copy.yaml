defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
  size_min: 512
  size_max: 131072
  attack: T1542.003
traits:
  - id: boot-steals-bios-memory-two-kib
    desc: Boot code reduces BIOS available memory
    crit: suspicious
    conf: 0.97
    if:
      type: hex
      pattern: '8B 3E 13 04 [0-24] 4F 4F 89 3E 13 04'
      offset_range: [0, 512]
  - id: boot-saves-and-replaces-int13-vector
    desc: Boot code replaces BIOS disk interrupt vector
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: 'A1 4C 00 8B 1E 4E 00 [0-16] C7 06 4C 00 04 00'
      offset_range: [0, 512]
  - id: boot-copies-code-and-writes-disk
    desc: Boot body copy and disk routine
    crit: suspicious
    conf: 0.97
    if:
      type: hex
      pattern: 'BE 3E 00 BF 3E 02 B9 21 01 FC F3 A4 [0-16] E8'
      offset_range: [0, 512]
  - id: boot-bios-one-sector-write-setup
    desc: Boot code selects BIOS disk write
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: 'BA 80 00 B8 01 03 EB DF'
      offset_range: [0, 512]
  - id: boot-signature-55aa
    desc: Boot sector ends with 55AA signature
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: '55 AA'
      offset: 510
  - id: boot-indirect-bios-memory-reservation
    desc: Boot code reserves BIOS memory indirectly
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: 'BB 33 03 8E D8 26 83 AF E0 00 02'
      offset_range: [0, 512]
  - id: boot-installs-indirect-disk-vector
    desc: Boot code installs BIOS disk vector
    crit: suspicious
    conf: 0.97
    if:
      type: hex
      pattern: 'BF 8A 03 BE 4D 00 BB 4C 00 E8'
      offset_range: [0, 512]
  - id: boot-fat12-mark-bad-and-write
    desc: Boot code marks FAT clusters and writes
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: '81 08 F7 0F [0-80] B8 02 03'
      offset_range: [0, 512]
composite_rules:
  - id: dos-resident-fat12-boot-infector
    desc: DOS boot code hooks disk and alters FAT
    crit: hostile
    conf: 0.98
    all:
      - id: boot-indirect-bios-memory-reservation
      - id: boot-installs-indirect-disk-vector
      - id: boot-fat12-mark-bad-and-write
      - id: boot-signature-55aa
  - id: dos-resident-disk-vector-boot-infector
    desc: DOS boot code installs resident disk infector
    crit: hostile
    conf: 0.98
    all:
      - id: boot-steals-bios-memory-two-kib
      - id: boot-saves-and-replaces-int13-vector
      - id: boot-copies-code-and-writes-disk
      - id: boot-bios-one-sector-write-setup
      - id: boot-signature-55aa
