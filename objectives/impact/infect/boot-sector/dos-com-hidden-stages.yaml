defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_max: 4096
  crit: notable

traits:
  - id: com-boot-record-entry-marker-check
    desc: COM checks boot record entry bytes
    conf: 0.95
    if:
      type: hex
      pattern: 'CD 13 [0-4] 26 (80 3F E8|80 3F E9|80 3F EB|81 3F E8 ??|81 3F E9 ??|81 3F EB ??) (74|75) ?? (F8|F9) C3'

  - id: com-boot-copy-between-write-calls
    desc: COM copies code between disk writes
    conf: 0.95
    if:
      type: hex
      pattern: '(B8 01 03|B4 03 [0-6] B0 01) [0-20] CD 13 [0-20] F3 (A4|A5) [0-4] (B8 01 03|B4 03 [0-6] B0 01) [0-24] CD 13'

  - id: com-hidden-boot-stage-write
    desc: COM writes additional sectors beside MBR
    conf: 0.94
    if:
      type: hex
      pattern: 'CD 13 [0-6] B8 (02|03|04) 03 [0-12] B9 (02|03|04|05) 00 [0-8] BA 80 00 [0-4] CD 13'

composite_rules:
  - id: com-marker-gated-mbr-replacement-and-stage
    desc: COM tests the boot record and installs replacement code and hidden sectors
    crit: hostile
    conf: 0.96
    attack: T1542.003
    near_bytes: 160
    all:
      - id: com-boot-record-entry-marker-check
      - id: com-boot-copy-between-write-calls
      - id: com-hidden-boot-stage-write
      - id: micro-behaviors/os/msdos/disk::dos-int13-fixed-disk-mbr-write
