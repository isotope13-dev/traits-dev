defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [data, pe, static-lib]
  size_min: 512
  size_max: 8192

traits:
  - id: dos-boot-sector-jmp-instruction
    desc: DOS boot sector JMP instruction
    conf: 1.0
    if:
      type: hex
      pattern: "EB ?? 90"
      offset: 0

  - id: dos-boot-sector-short-jmp
    desc: DOS boot sector short JMP instruction
    conf: 0.95
    if:
      type: hex
      pattern: "EB ??"
      offset: 0

  - id: dos-boot-sector-near-jmp
    desc: DOS boot sector near JMP instruction
    conf: 0.95
    if:
      type: hex
      pattern: "E9 ?? ??"
      offset: 0

  - id: dos-boot-sector-far-jmp
    desc: DOS boot sector far JMP instruction
    conf: 0.95
    if:
      type: hex
      pattern: "EA ?? ?? ?? ??"
      offset: 0

  - id: dos-boot-sector-ending-signature
    desc: DOS boot sector ending signature
    conf: 1.0
    if:
      type: hex
      pattern: "55 AA"
      offset: 510

  - id: int13h-disk-access
    desc: INT 13h BIOS disk interrupt
    conf: 1.0
    if:
      type: hex
      pattern: "CD 13"
      offset_range: [0, 512]

  - id: dos-boot-write-one-sector
    desc: Boot code writes one disk sector
    crit: suspicious
    conf: 0.92
    if:
      type: hex
      pattern: "B8 01 03"
      offset_range: [0, 512]

  - id: dos-boot-ah-write-call
    desc: Calls after setting disk-write AH
    crit: suspicious
    conf: 0.9
    if:
      type: hex
      pattern: "B4 03 E8"
      offset_range: [0, 512]

  - id: dos-one-sector-via-int
    desc: DOS writes one sector via interrupt
    crit: notable
    conf: 0.9
    for: [dos_com, static-lib, data]
    if:
      type: hex
      pattern: "B8 01 03 [0-4] CD"
      offset_range: [0, 1600]

  - id: dos-boot-sig-in-image
    desc: DOS boot signature in the image
    crit: notable
    conf: 0.85
    for: [dos_com, static-lib, data]
    if:
      type: hex
      pattern: "55 AA"
      offset_range: [0, 1600]

  # A COM body that moves the boot sector from 7C00h to 0600h carries a boot
  # infector's relocation stub: no legitimate COM program relocates the boot
  # record, so this stays scoped to COM even though boot images do it too.
  - id: dos-boot-relocate-7c00
    desc: DOS boot code relocates from 7C00
    crit: suspicious
    conf: 0.93
    platforms: [windows, unix]
    for: [dos_com]
    if:
      type: hex
      pattern: "BC 00 7C [0-12] BF 00 06 B9 00 01 F3 A5"

  # Tchechen clears DF and uses the F2 repeat prefix for MOVSW while moving
  # the loaded boot sector to 0600h. Keep this separate from the compact F3
  # form above so both loops remain byte-specific.
  - id: dos-boot-relocate-7c00-repne
    desc: DOS boot sector uses REPNE relocation
    crit: suspicious
    conf: 0.96
    platforms: [windows, unix]
    for: [dos_com]
    if:
      type: hex
      pattern: "BC 00 7C 8B F4 8E C0 8E D8 FB BF 00 06 B9 00 01 F2 A5 EA"

  - id: dos-rtc-day16-boot-gate
    desc: DOS boot payload checks RTC day 16
    crit: suspicious
    conf: 0.96
    platforms: [windows, unix]
    for: [dos_com]
    if:
      type: hex
      pattern: "B4 04 CD 1A 72 ?? 80 FA 10 5A 59 58 75"

  - id: dos-bios-17-sector-write-loop
    desc: DOS boot payload writes 17-sector BIOS blocks
    crit: suspicious
    conf: 0.97
    platforms: [windows, unix]
    for: [dos_com]
    if:
      type: hex
      pattern: "B8 11 03 CD 13 FE C6 80 FE 09 76 ?? 32 F6 FE C5 73 ?? 80 C1 20 4F 75"

  # Alar's boot stage pulls nine sectors from the fixed disk's track-zero
  # sector 11 into high memory, marks the image, and far-returns into it.
  # The matching installer below confirms these are the virus's hidden
  # sectors rather than an ordinary multi-stage boot loader.
  - id: dos-hidden-sector-stage-loader
    desc: DOS loads boot payload from hidden sectors
    crit: suspicious
    conf: 0.98
    for: [dos_com]
    size_max: 65536
    if:
      type: hex
      pattern: "B8 09 02 B9 0B 00 BA 80 00 CD 13 07 06 26 C6 06 F0 00 5A 26 C7 06 F1 00 08 00 26 C7 06 F3 00 7F 02 68 7A 0D CB"
      offset_range: [32, 128]

  # INT 13h reads the hard-disk MBR, gates on partition-table bytes, saves
  # the old sector at CHS 0/0/10, writes a replacement MBR at 0/0/1, then
  # writes nine payload sectors starting at 0/0/11.
  - id: dos-partition-gated-hidden-sector-install
    desc: DOS installs a hidden-sector boot payload
    crit: suspicious
    conf: 0.99
    for: [dos_com]
    size_max: 65536
    if:
      type: hex
      pattern: "BB CA 11 BA 80 00 B9 01 00 B8 01 02 CD 13 26 81 BF BF 01 01 01 75 ?? 26 80 BF C1 01 00 75 ?? B8 01 03 B1 0A CD 13 0E 1F BE 18 0D 8B FB B9 FC 01 F3 A4 B1 01 B8 01 03 CD 13 BB 00 01 B8 09 03 B1 0B CD 13"

  - id: dos-bios-read-one-sector
    desc: BIOS reads a single disk sector
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [dos_com, static-lib, data]
    if:
      type: hex
      pattern: "B8 01 02 [0-8] CD 13"

  # Some collectors preserve malware labels as extensions, so a raw boot
  # record can be classified as an unrelated structured file. These patterns
  # require the actual resident-virus mechanics rather than trusting the name:
  # save and replace INT 13h after reserving conventional memory, then read a
  # hard-disk sector, test an infection marker, and write a sector on mismatch.
  - id: boot-code-int13-resident-hook
    desc: Boot code hooks BIOS disk interrupt
    crit: suspicious
    conf: 0.99
    for: [systemd-service]
    if:
      type: hex
      pattern: "A1 4C 00 A3 ?? ?? A1 4E 00 A3 ?? ?? FF 0E 13 04 A1 13 04 B1 06 D3 E0 8E C0 A3 ?? ?? A3 4E 00 B8 ?? ?? A3 4C 00"
      offset_range: [16, 96]

  - id: boot-code-marker-gated-sector-write
    desc: Boot code conditionally writes disk sector
    crit: suspicious
    conf: 0.99
    for: [systemd-service]
    if:
      type: hex
      pattern: "BB ?? ?? B8 01 02 88 C1 BA 80 00 CD 13 72 ?? 26 80 3E ?? ?? ?? 74 ?? B8 01 03 B1 ?? CD 13"
      offset_range: [64, 192]

composite_rules:
  - id: dos-boot-sector-infector
    desc: Boot image writes a disk sector
    crit: hostile
    conf: 0.96
    all:
      - id: dos-boot-sector-ending-signature
    any:
      - id: dos-boot-write-one-sector
      - id: dos-boot-ah-write-call
    needs: 1

  - id: dos-boot-image-sector-write
    desc: DOS boot image writes one sector
    crit: hostile
    conf: 0.94
    for: [dos_com, static-lib, data]
    all:
      - id: dos-one-sector-via-int
      - id: dos-boot-sig-in-image

  - id: resident-boot-sector-infector
    desc: Resident boot-sector infection code
    crit: hostile
    conf: 0.99
    for: [systemd-service]
    all:
      - id: boot-code-int13-resident-hook
      - id: boot-code-marker-gated-sector-write

  # A COM body that reads disk sectors, relocates the boot record from 7C00h
  # to 0600h, and writes sectors back in an absolute-write loop carries the
  # complete boot-infection engine of a multipartite virus: file infector on
  # the outside, boot infector on the inside.
  - id: dos-multipartite-boot-engine
    desc: Multipartite boot-infection engine in COM
    crit: hostile
    conf: 0.96
    platforms: [windows, unix]
    for: [dos_com]
    all:
      - id: dos-boot-relocate-7c00
      - id: dos-bios-read-one-sector
      - id: objectives/impact/wipe/disk/mbr::dos-int26-write-loop

  - id: dos-tchechen-multipartite-boot-engine
    desc: COM infector carries a day-gated partition boot payload
    crit: hostile
    conf: 0.98
    platforms: [windows, unix]
    for: [dos_com]
    all:
      - id: dos-boot-relocate-7c00-repne
      - id: dos-rtc-day16-boot-gate
      - id: dos-bios-17-sector-write-loop
      - id: objectives/impact/infect/binary/dos/exec-open-hook::dos-ivt-int21-set-direct

  - id: dos-hidden-sector-mbr-infector
    desc: DOS installs and loads a hidden-sector boot virus
    crit: hostile
    conf: 0.99
    for: [dos_com]
    size_max: 65536
    all:
      - id: dos-hidden-sector-stage-loader
      - id: dos-partition-gated-hidden-sector-install
