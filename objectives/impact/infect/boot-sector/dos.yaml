defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [data, pe, static-lib]
  size_min: 512
  size_max: 8192

traits:
  - id: dos-boot-sector-jmp-instruction
    desc: DOS boot sector JMP instruction
    conf: 1.0
    if:
      type: hex
      pattern: "EB ?? 90"
      offset: 0

  - id: dos-boot-sector-short-jmp
    desc: DOS boot sector short JMP instruction
    conf: 0.95
    if:
      type: hex
      pattern: "EB ??"
      offset: 0

  - id: dos-boot-sector-near-jmp
    desc: DOS boot sector near JMP instruction
    conf: 0.95
    if:
      type: hex
      pattern: "E9 ?? ??"
      offset: 0

  - id: dos-boot-sector-far-jmp
    desc: DOS boot sector far JMP instruction
    conf: 0.95
    if:
      type: hex
      pattern: "EA ?? ?? ?? ??"
      offset: 0

  - id: dos-boot-sector-ending-signature
    desc: DOS boot sector ending signature
    conf: 1.0
    if:
      type: hex
      pattern: "55 AA"
      offset: 510

  - id: int13h-disk-access
    desc: INT 13h BIOS disk interrupt
    conf: 1.0
    if:
      type: hex
      pattern: "CD 13"
      offset_range: [0, 512]

  - id: dos-boot-write-one-sector
    desc: Boot code writes one disk sector
    crit: suspicious
    conf: 0.92
    if:
      type: hex
      pattern: "B8 01 03"
      offset_range: [0, 512]

  - id: dos-boot-ah-write-call
    desc: Calls after setting disk-write AH
    crit: suspicious
    conf: 0.9
    if:
      type: hex
      pattern: "B4 03 E8"
      offset_range: [0, 512]

composite_rules:
  - id: dos-boot-sector-infector
    desc: Boot image writes a disk sector
    crit: hostile
    conf: 0.96
    all:
      - id: dos-boot-sector-ending-signature
    any:
      - id: dos-boot-write-one-sector
      - id: dos-boot-ah-write-call
    needs: 1
