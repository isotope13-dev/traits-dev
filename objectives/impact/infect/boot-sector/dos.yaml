defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [data, pe, static-lib]
  size_min: 512
  size_max: 8192

traits:
  - id: dos-boot-relocate-7c00
    desc: DOS boot code relocates from 7C00
    crit: suspicious
    conf: 0.93
    platforms: [windows, unix]
    for: [dos_com]
    if:
      type: hex
      pattern: "BC 00 7C [0-12] BF 00 06 B9 00 01 F3 A5"

  # Tchechen clears DF and uses the F2 repeat prefix for MOVSW while moving
  # the loaded boot sector to 0600h. Keep this separate from the compact F3
  # form above so both loops remain byte-specific.
  - id: dos-boot-relocate-7c00-repne
    desc: DOS boot sector uses REPNE relocation
    crit: suspicious
    conf: 0.96
    platforms: [windows, unix]
    for: [dos_com]
    if:
      type: hex
      pattern: "BC 00 7C 8B F4 8E C0 8E D8 FB BF 00 06 B9 00 01 F2 A5 EA"

  - id: dos-rtc-day16-boot-gate
    desc: DOS boot payload checks RTC day 16
    crit: suspicious
    conf: 0.96
    platforms: [windows, unix]
    for: [dos_com]
    if:
      type: hex
      pattern: "B4 04 CD 1A 72 ?? 80 FA 10 5A 59 58 75"

  - id: dos-bios-17-sector-write-loop
    desc: DOS boot payload writes 17-sector BIOS blocks
    crit: suspicious
    conf: 0.97
    platforms: [windows, unix]
    for: [dos_com]
    if:
      type: hex
      pattern: "B8 11 03 CD 13 FE C6 80 FE 09 76 ?? 32 F6 FE C5 73 ?? 80 C1 20 4F 75"

  # Alar's boot stage pulls nine sectors from the fixed disk's track-zero
  # sector 11 into high memory, marks the image, and far-returns into it.
  # The matching installer below confirms these are the virus's hidden
  # sectors rather than an ordinary multi-stage boot loader.
  - id: dos-hidden-sector-stage-loader
    desc: DOS loads boot payload from hidden sectors
    crit: suspicious
    conf: 0.98
    for: [dos_com]
    size_max: 65536
    if:
      type: hex
      pattern: "B8 09 02 B9 0B 00 BA 80 00 CD 13 07 06 26 C6 06 F0 00 5A 26 C7 06 F1 00 08 00 26 C7 06 F3 00 7F 02 68 7A 0D CB"
      offset_range: [32, 128]

  # Resident boot infectors of the ABS3 shape install themselves the way
  # DOS TSRs do: decrement the BIOS memory-size word at 40:13h, convert the
  # shrunken top of memory into a segment, and swap the INT 13h vector at
  # 0:4Ch/0:4Eh to a handler copied into the stolen segment. Legitimate boot
  # code neither shrinks the BIOS memory map nor redirects the disk vector.
  - id: boot-bios-steal-int13-vector-install
    desc: Steals BIOS memory to hook INT 13h
    crit: suspicious
    conf: 0.97
    for: [dos_com, static-lib, data]
    if:
      type: hex
      pattern: "FF 0E 13 04 A1 13 04 B1 06 D3 E0 [0-16] 8B 1E 4E 00 A3 4E 00 A1 4C 00"

  # From inside the INT 13h hook: patch a short JMP stub at offset 0 of the
  # sector just read, copy the virus body over the original boot code with a
  # REP move that preserves the BPB, then issue the write-back service (AH=3).
  # No legitimate disk or boot-manager code rewrites a sector it just read
  # into a jump to freshly copied body code.
  - id: boot-buffer-jmp-patch-body-copy-write
    desc: Buffer JMP patch, body copy, sector write
    crit: suspicious
    conf: 0.95
    for: [dos_com, static-lib, data]
    if:
      type: hex
      pattern: "C7 07 EB ?? [0-64] F3 A4 [0-64] B4 03"

  # INT 13h reads the hard-disk MBR, gates on partition-table bytes, saves
  # the old sector at CHS 0/0/10, writes a replacement MBR at 0/0/1, then
  # writes nine payload sectors starting at 0/0/11.
  - id: dos-partition-gated-hidden-sector-install
    desc: DOS installs a hidden-sector boot payload
    crit: suspicious
    conf: 0.99
    for: [dos_com]
    size_max: 65536
    if:
      type: hex
      pattern: "BB CA 11 BA 80 00 B9 01 00 B8 01 02 CD 13 26 81 BF BF 01 01 01 75 ?? 26 80 BF C1 01 00 75 ?? B8 01 03 B1 0A CD 13 0E 1F BE 18 0D 8B FB B9 FC 01 F3 A4 B1 01 B8 01 03 CD 13 BB 00 01 B8 09 03 B1 0B CD 13"

  - id: boot-code-int13-resident-hook
    desc: Boot code hooks BIOS disk interrupt
    crit: suspicious
    conf: 0.99
    for: [systemd-service]
    if:
      type: hex
      pattern: "A1 4C 00 A3 ?? ?? A1 4E 00 A3 ?? ?? FF 0E 13 04 A1 13 04 B1 06 D3 E0 8E C0 A3 ?? ?? A3 4E 00 B8 ?? ?? A3 4C 00"
      offset_range: [16, 96]

  - id: boot-code-marker-gated-sector-write
    desc: Boot code conditionally writes disk sector
    crit: suspicious
    conf: 0.99
    for: [systemd-service]
    if:
      type: hex
      pattern: "BB ?? ?? B8 01 02 88 C1 BA 80 00 CD 13 72 ?? 26 80 3E ?? ?? ?? 74 ?? B8 01 03 B1 ?? CD 13"
      offset_range: [64, 192]

  # Plants EB 3C (jump to offset 3Eh, past the BIOS parameter block) at
  # [BX] and copies this body's own bytes from that offset into the sector
  # buffer. Boot loaders relocate with MOVSW; they do not rebuild a sector
  # out of the code that is running.
  - id: dos-boot-body-splice
    desc: Boot body copied past BPB jump
    crit: suspicious
    conf: 0.96
    if:
      type: hex
      pattern: "C7 07 EB 3C BE 3E 00 BF ?? ?? B9 ?? ?? F3 A4 [0-16] 9C FF 1E"
      offset_range: [0, 512]

composite_rules:
  - id: resident-boot-sector-infector
    desc: Resident boot-sector infection code
    crit: hostile
    conf: 0.99
    for: [systemd-service]
    all:
      - id: boot-code-int13-resident-hook
      - id: boot-code-marker-gated-sector-write

  # A boot image or dropper that both installs a resident INT 13h hook in
  # stolen BIOS memory and rewrites sectors it reads -- JMP stub at offset 0,
  # body copied over the original -- is a complete resident boot infector.
  - id: dos-resident-int13-boot-infector
    desc: Resident INT 13h boot-sector infector
    crit: hostile
    conf: 0.96
    for: [dos_com, static-lib, data]
    all:
      - id: boot-bios-steal-int13-vector-install
      - id: boot-buffer-jmp-patch-body-copy-write

  # A COM body that reads disk sectors, relocates the boot record from 7C00h
  # to 0600h, and writes sectors back in an absolute-write loop carries the
  # complete boot-infection engine of a multipartite virus: file infector on
  # the outside, boot infector on the inside.
  - id: dos-multipartite-boot-engine
    desc: Multipartite boot-infection engine in COM
    crit: hostile
    conf: 0.96
    platforms: [windows, unix]
    for: [dos_com]
    all:
      - id: dos-boot-relocate-7c00
      - id: micro-behaviors/hardware/block/device::dos-bios-read-one-sector
      - id: objectives/impact/wipe/disk/mbr::dos-int26-write-loop

  - id: dos-tchechen-multipartite-boot-engine
    desc: COM infector carries a day-gated partition boot payload
    crit: hostile
    conf: 0.98
    platforms: [windows, unix]
    for: [dos_com]
    all:
      - id: dos-boot-relocate-7c00-repne
      - id: dos-rtc-day16-boot-gate
      - id: dos-bios-17-sector-write-loop
      - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-set-direct

  - id: dos-hidden-sector-mbr-infector
    desc: DOS installs and loads a hidden-sector boot virus
    crit: hostile
    conf: 0.99
    for: [dos_com]
    size_max: 65536
    all:
      - id: dos-hidden-sector-stage-loader
      - id: dos-partition-gated-hidden-sector-install

  # The splice and the one-sector BIOS write sit in the same routine: the
  # write function is loaded, the body is copied over the sector, then the
  # saved disk vector is called. Either piece alone is not the infection.
  - id: dos-boot-body-splice-write
    desc: Boot virus writes spliced sector
    crit: hostile
    conf: 0.97
    attack: T1542.003
    near_bytes: 80
    all:
      - id: dos-boot-body-splice
      - id: micro-behaviors/hardware/block/device::dos-boot-write-one-sector
