# The a.out header is shared by multiple architectures; the instruction
# patterns below specifically describe PDP-11 code bytes. They do not claim
# that the file was executed.
defaults:
  platforms: [unix]
  for: [data]
  size_max: 65552
traits:
  - id: pdp11-aout-size-adjustment-bytes
    desc: PDP-11 a.out size-adjustment instruction bytes
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: 'CC 25 07 01 ?? 02 80 14 80 62 40 E0 D2 65 ?? ?? D2 65 ?? ?? D2 0B'
  - id: pdp11-seek-end-write-bytes
    desc: PDP-11 end-seek and write instruction bytes
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: '80 13 13 89 00 00 02 00 80 13 04 89 ?? ?? ?? ??'
  - id: pdp11-seek-start-write-bytes
    desc: PDP-11 start-seek and write instruction bytes
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: '80 13 13 89 00 00 00 00 80 13 04 89 ?? ?? 14 00'
  - id: pdp11-appended-entry-aout-infector
    desc: PDP-11 a.out entry graft and file rewrite
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule pdp11_appended_entry_aout_infector {
          strings:
            $entry = { C3 11 E6 28 C4 10 C4 65 ?? ?? 11 15 11 15 C5 15 77 00 }
            $patch = { CC 25 07 01 ?? 02 80 14 80 62 40 E0 D2 65 ?? ?? D2 65 ?? ?? D2 0B }
            $append = { 80 13 13 89 00 00 02 00 80 13 04 89 ?? ?? ?? ?? }
            $rewrite = { 80 13 13 89 00 00 00 00 80 13 04 89 ?? ?? 14 00 }
          condition:
            uint16(0) == 0x0107 and uint16(14) == 1 and uint16(10) == 0 and
            uint16(2) >= 2 and 16+uint16(2)+uint16(4) <= filesize and
            uint16(16) == 0x0077 and
            20+int16(18) >= 16+uint16(2) and
            20+int16(18) < 16+uint16(2)+uint16(4) and
            $entry at 20+int16(18) and
            $patch in (20+int16(18)..20+int16(18)+256) and
            $append in (20+int16(18)..20+int16(18)+256) and
            $rewrite in (20+int16(18)..20+int16(18)+256)
        }
