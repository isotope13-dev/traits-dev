# Directory-walking ELF infectors that copy themselves with /bin/cp and
# announce a Linux virus identity.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1204
composite_rules:
  - id: elf-cp-dirwalk-virus
    desc: Dir-walk ELF copies itself via cp
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/file/copy::unix-bin-cp-path
      - id: micro-behaviors/fs/directory/readdir::readdir-opendir
    any:
      - id: objectives/impact/infect/terms::linux-virus-self-label
      - id: objectives/impact/infect/terms::virus-word
  - id: elf-cp-virus-copy
    desc: Linux virus copies itself via cp
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/file/copy::unix-bin-cp-path
      - id: objectives/impact/infect/terms::linux-virus-self-label
  - id: elf-sexloader-virus
    desc: Linux virus stages a sexloader helper
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/impact/infect/terms::unix-sexloader-path
      - id: objectives/impact/infect/terms::linux-virus-self-label
  - id: elf-file-to-infect-writer
    desc: File-to-infect usage writes virus
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/impact/infect/terms::file-to-infect-usage
      - id: objectives/impact/infect/terms::write-till-virus-error
  - id: elf-file-to-infect-elf-check
    desc: File-to-infect usage checks ELF
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/impact/infect/terms::file-to-infect-usage
      - id: objectives/impact/infect/terms::is-it-elf-error
  - id: elf-write-virus-elf-check
    desc: Virus writer checks ELF magic
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/impact/infect/terms::write-till-virus-error
      - id: objectives/impact/infect/terms::is-it-elf-error
  - id: elf-file-to-infect-tempf
    desc: File-to-infect usage creates tempfile
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/impact/infect/terms::file-to-infect-usage
      - id: objectives/impact/infect/terms::create-tempf-error
  - id: elf-write-virus-tempf
    desc: Virus writer creates a tempfile
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/impact/infect/terms::write-till-virus-error
      - id: objectives/impact/infect/terms::create-tempf-error
