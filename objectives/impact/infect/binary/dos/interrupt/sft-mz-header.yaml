# The ordered sequences describe a resident executable-header rewrite; they
# are static code evidence and do not establish that the code was executed.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  size_max: 65536

composite_rules:
  - id: dos-vector-sft-mz-header-rewrite
    desc: DOS vector hook and executable header rewrite
    crit: hostile
    conf: 0.97
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-get-int21-vector
      - id: micro-behaviors/os/msdos/interrupt::dos-increment-set-int21-vector
      - id: micro-behaviors/fs/read/file/handle::dos-read-24-byte-mz-header-check
      - id: micro-behaviors/fs/file/read-write::dos-sft-reset-and-24-byte-write
      - id: micro-behaviors/fs/file/timestamp::dos-int21-set-file-time
