defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1055
  size_max: 4096

traits:
  - id: dos-com-ret-checked-body-append
    desc: Appends COM body after host RET check
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: "B4 3F [0-12] CD 21 [0-8] 3C C3 75 ?? [0-8] B4 40 [0-8] CD 21"
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

composite_rules:
  - id: dos-com-ret-checked-append-infector
    desc: Searches hosts and appends code at RET
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/search/command::dos-int21-find-first-call
      - id: objectives/impact/infect/binary/dos/interrupt::dos-com-ret-checked-body-append

