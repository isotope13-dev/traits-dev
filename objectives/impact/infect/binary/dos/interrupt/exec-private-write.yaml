# The write and rewind operations use saved DOS handlers through INT 1 and
# INT 3. These byte patterns show code, not that the operations succeeded.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  size_max: 65536

traits:
  - id: dos-private-jump-body-entry-write
    desc: DOS jump bytes and private write sequence
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: 'B2 E9 88 16 ?? ?? [0-32] B4 40 B9 ?? ?? BA ?? ?? CD 01 B8 00 42 33 C9 33 D2 CD 01 B4 40 BA ?? ?? B9 03 00 CC'

composite_rules:
  - id: dos-exec-private-body-entry-writer
    desc: DOS EXEC hook with private entry-write code
    crit: hostile
    conf: 0.97
    near_bytes: 2048
    all:
      - id: dos-private-jump-body-entry-write
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
      - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-set-direct
      - id: micro-behaviors/fs/file/seek::dos-zero-offset-eof-int3
      - id: micro-behaviors/fs/read/file/handle::dos-three-byte-read-int1
      - id: objectives/impact/infect/binary/dos/file::dos-host-restore-trampoline
