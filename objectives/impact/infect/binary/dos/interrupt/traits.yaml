# Direct-action and resident DOS COM infectors. The bytes are the DOS
# services themselves: find a host, write into it, or save and replace the
# INT 21h vector. Names and campaign markers are not part of the match.
# MOV AH,imm8 and MOV AX,imm16 are separate patterns: a hex alternative
# shorter than 3 concrete bytes is rejected.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib]
  attack: T1080
  size_max: 65536

traits:
  - id: micro-behaviors/fs/search::dos-int21-find-next-ax
    for: [dos_com, static-lib, data]
    desc: DOS find-next via MOV AX
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 ?? 4F [0-32] CD 21"
  - id: micro-behaviors/fs/search::dos-int21-find-next-near
    for: [dos_com, static-lib, data]
    desc: DOS find-next through a near call
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 4F [0-8] E8"

  # Find-next jumping back to share the find-first INT 21h call.
  - id: objectives/impact/infect/binary/dos/interrupt::dos-open-update-private-int
    for: [dos_com, static-lib, data]
    desc: DOS update-open via private interrupt
    crit: notable
    conf: 0.93
    if:
      type: hex
      pattern: "B8 02 3D CD ~21"
  - id: objectives/impact/infect/binary/dos/interrupt::dos-seek-eof-private-int
    for: [dos_com, static-lib, data]
    desc: DOS seek-to-EOF via private interrupt
    crit: notable
    conf: 0.93
    if:
      type: hex
      pattern: "B8 02 42 [0-16] CD ~21"
  - id: objectives/impact/infect/binary/dos/interrupt::dos-seek-start-private-int
    for: [dos_com, static-lib, data]
    desc: DOS seek-to-start via private interrupt
    crit: notable
    conf: 0.93
    if:
      type: hex
      pattern: "B8 00 42 [0-16] CD ~21"
  - id: objectives/impact/infect/binary/dos/interrupt::dos-read-private-int
    for: [dos_com, static-lib, data]
    desc: DOS file read via private interrupt
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 3F [0-16] CD ~21"
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-indirect-ah-call
    for: [dos_com, static-lib, data]
    desc: DOS table-loaded INT 21h call
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "8A 26 ?? ?? [0-32] CD 21"

  # CX carries the transfer length and DX points to the buffer in this
  # common indirect DOS file-write shape. The service number itself comes
  # from the table loaded into AH.
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-indirect-buffer-transfer
    for: [dos_com, static-lib, data]
    desc: DOS indirect service buffer transfer
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "8A 26 ?? ?? B9 ?? ?? 8B 16 ?? ?? [0-12] CD 21"
  - id: objectives/impact/infect/binary/dos/interrupt::dos-get-int21-vector
    for: [dos_com, static-lib, data]
    desc: DOS reads the INT 21h vector
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 21 35 [0-8] CD 21"
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-create-com-intercept
    for: [dos_com, static-lib, data]
    desc: DOS intercepts COM creation for infection
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: "80 FC 3C 75 ?? FA E8 ?? ?? FB CA 02 00"
  - id: objectives/impact/infect/binary/dos/interrupt::dos-com-suffix-case-check
    for: [dos_com, static-lib, data]
    desc: DOS checks uppercase and lowercase COM suffixes
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: "BB 43 4F B9 63 6F 3B C3 74 ?? 3B C1 74"
  - id: objectives/impact/infect/binary/dos/interrupt::dos-create-write-resident-image
    for: [dos_com, static-lib, data]
    desc: DOS writes resident image on COM creation
    crit: suspicious
    conf: 0.97
    if:
      type: hex
      pattern: "B4 3C B9 00 00 9C 2E FF 1E ?? ?? 2E A3 ?? ?? B4 40 2E 8B 1E ?? ?? B9 C4 03 81 E9 00 01 0E 1F BA 00 01 9C 2E FF 1E ?? ??"

  # Small.128.d moves the old INT 21h vector to INT E0h, then redirects
  # INT 21h to a copied 125-byte low-memory handler.
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-hook-via-e0-alias
    desc: DOS hooks INT 21h via INT E0h
    crit: suspicious
    conf: 0.98
    for: [dos_com, static-lib, data]
    if:
      type: hex
      pattern: "31 C0 8E C0 BF 03 03 B1 7D F3 A4 AF 75 0E FD 26 87 85 04 FD AB B8 3F 03 F5 72 F4 FC 0E 07 C3"
      offset: 0x140e

  # Its resident handler intercepts EXEC, rejects MZ files, writes the
  # 128-byte low-memory body to COM files, and patches their entry jump. The
  # supplied 128-byte body ends at a bare far-jump opcode, so report an
  # infection attempt rather than assuming the handler returns cleanly.
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-e0-exec-com-appender
    desc: DOS appends 128-byte COM body on EXEC
    crit: suspicious
    conf: 0.99
    for: [dos_com, static-lib, data]
    if:
      type: hex
      pattern: "80 FC 4B 75 3B 50 53 52 1E B8 02 3D CD E0 72 28 8B D8 0E 1F E8 D7 FF B4 3F CD E0 80 3E 00 03 4D 74 16 48 E8 CA FF A3 3D 03 B4 40 B1 80 CD E0 E8 BC FF B2 3C B4 40 CD E0 B4 3E CD E0 1F 5A 5B 58"
      offset: 0x143f
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int13-vector-swap
    desc: DOS swaps the disk service vector
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "87 06 4C 00"
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-fcb-find-intercept
    desc: DOS handler intercepts FCB dir search
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "80 FC 11 (74|75) ?? 80 FC 12 (74|75)"

  # CMP AH,4Eh / JB and CMP AH,4Fh / JA is the closed range
  # FindFirst..FindNext (4Eh, 4Fh). Equality jumps are a different spelling.
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-find-handle-range
    for: [dos_com, static-lib, data]
    desc: DOS handler filters find-first and find-next
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "80 FC 4E 72 ?? 80 FC 4F 77"
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-xor-find-first
    for: [dos_com, static-lib, data]
    desc: DOS find-first with XOR service number
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "B4 4E 34 ?? [0-24] CD 21"
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-xor-open-readwrite
    for: [dos_com, static-lib, data]
    desc: DOS read/write open with XOR service number
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "B4 3F 34 ?? [0-24] CD 21"
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-subtract-obfuscated-write
    for: [dos_com, static-lib, data]
    desc: DOS file write with subtract-obfuscated service
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "B4 40 2D ?? [0-24] CD 21"

  # Arithmetic-masked service numbers: AH (or AX) is loaded with a decoy
  # immediate and fixed up with XOR/SUB/ADD immediately before INT 21h, with
  # only one-byte junk between, so no literal MOV AH,service ever appears.
  # Compilers and hand-written DOS utilities load the service directly.
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-xor-masked-ah
    for: [dos_com, static-lib, data]
    desc: DOS service number masked by XOR AH
    crit: notable
    conf: 0.85
    if:
      type: hex
      pattern: "B4 ?? [0-4] 80 F4 ?? [0-8] CD 21"
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-sub-masked-ah
    for: [dos_com, static-lib, data]
    desc: DOS service number masked by SUB AH
    crit: notable
    conf: 0.85
    if:
      type: hex
      pattern: "B4 ?? [0-4] 80 EC ?? [0-8] CD 21"
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-add-masked-ah
    for: [dos_com, static-lib, data]
    desc: DOS service number masked by ADD AH
    crit: notable
    conf: 0.85
    if:
      type: hex
      pattern: "B4 ?? [0-4] 80 C4 ?? [0-8] CD 21"
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-xor-masked-ax
    for: [dos_com, static-lib, data]
    desc: DOS service number masked by XOR AX
    crit: notable
    conf: 0.85
    if:
      type: hex
      pattern: "B8 ?? ?? [0-6] 35 ?? ?? [0-8] CD 21"

  # The handle an open/create returns in AX moves to BX, a length goes to
  # CX, and a second INT 21h follows: a sized read or write on the file just
  # opened, whatever the (possibly masked) service numbers are.
  - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-store-segment-override
    for: [dos_com, static-lib, data]
    desc: DOS stores INT 21h vector through ES
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: "26 C7 06 84 00 ?? ?? 26 8C 1E 86 00"

  # XOR AH,1Ah before comparing AH with 54h/55h identifies an INT 21h handler
  # intercepting find-first/find-next (actual services 4Eh/4Fh).
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-xor-directory-search-intercept
    for: [dos_com, static-lib, data]
    desc: DOS intercepts directory search with XOR service
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "80 F4 1A [0-64] 80 FC 54 ?? ?? 80 FC 55"

  # Installs INT 21h and INT 16h handlers by calling the shared DOS
  # AH=25h vector-setting helper with each vector number and handler address.
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-int16-vector-install-pair
    for: [dos_com, static-lib, data]
    desc: DOS installs DOS and keyboard interrupt hooks
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "B0 21 BA ?? ?? BF ?? ?? E8 ?? ?? B0 16 BA ?? ?? BF ?? ?? E8 ?? ??"

  # This handler swaps AH into AL, scans a compact service-number table, and
  # dispatches matches through a jump table. The values include find-first,
  # find-next and FCB searches, so it covers non-CMP based dispatchers.
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-table-directory-search-dispatch
    for: [dos_com, static-lib, data]
    desc: DOS table dispatches INT 21h search calls
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: "BF C5 02 86 E0 B9 07 00 90 FC 06 0E 07 F2 AE [0-64] 3D 4B 57 4E 4F 11 12"

  - id: objectives/impact/infect/binary/dos/interrupt::dos-int8-vector-install-direct
    desc: DOS installs an INT 8 timer handler
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "C7 06 20 00 C0 02 8C 06 22 00"

  - id: objectives/impact/infect/binary/dos/interrupt::dos-int1c-vector-install-via-dos
    desc: INT 1Ch timer via DOS service 25h
    crit: notable
    conf: 0.93
    for: [dos_com, static-lib, data]
    if:
      type: hex
      pattern: "B8 1C 35 CD 21 89 1E ?? ?? 8C C0 A3 ?? ?? B8 1C 25 BA ?? ?? CD 21"

  # Interrupt-number mutation: the body carries every INT 21h as INT xx with
  # a per-infection random xx. At start-up a loop compares each word with the
  # stored CD xx and rewrites it as CD 21 (MOV AX,21CDh); when copying itself
  # into a host it scans for CD 21 and stores a fresh random number instead.
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-opcode-restore-loop
    for: [dos_com, static-lib, data]
    desc: DOS restores aliased INT 21h opcodes
    crit: suspicious
    conf: 0.93
    if:
      type: hex
      pattern: "3B ?? ?? ?? 74 ?? 89 05 [0-4] E2 ?? EB ?? B8 CD 21"
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-opcode-mutate-copy
    for: [dos_com, static-lib, data]
    desc: DOS replaces INT 21h numbers while copying
    crit: suspicious
    conf: 0.92
    if:
      type: hex
      pattern: "3C CD 74 ?? [0-24] 3C 21 75 ?? 2E 88"
  - id: objectives/impact/infect/binary/dos/interrupt::dos-lodsw-infection-dispatch-loop
    for: [dos_com, data]
    desc: DOS lodsw loop dispatches infection calls
    crit: suspicious
    conf: 0.94
    if:
      type: hex
      pattern: "AD 99 8A D0 D1 E2 [0-16] CD 21 93 EB"


composite_rules:
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-masked-service-calls
    for: [dos_com, static-lib, data]
    desc: DOS masks several INT 21h service numbers
    crit: notable
    conf: 0.9
    any:
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-xor-masked-ah
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-sub-masked-ah
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-add-masked-ah
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-xor-masked-ax
    needs: 2

  # Trivial.23's carry loop: find-first, create-truncate, write-handle setup,
  # and a backward conditional branch to the search, so every directory match
  # is destroyed rather than just the first. Companion to the file-side
  # dos-com-entry-dta-overwriter, which convicts the single overwrite chain.
  - id: objectives/impact/infect/binary/dos/interrupt::dos-search-destroy-loop
    for: [dos_com, data, c]
    desc: DOS loops a search-and-destroy cycle
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/search::dos-int21-find-first-call
      - id: micro-behaviors/fs/search::dos-entry-mask-find-first
      - id: micro-behaviors/fs/file/open::dos-int21-open-or-create-call
      - id: micro-behaviors/os/msdos/interrupt::int21-write-loop-branch

  # Masked form of the directory-infector chain: every service number is
  # arithmetic-masked, so the literal find-first/write legs of
  # dos-com-directory-infector never appear, yet the body still searches a
  # COM mask and transfers bytes onto the handle it just opened.
  - id: objectives/impact/infect/binary/dos/interrupt::dos-masked-call-com-infector
    for: [dos_com, static-lib, data]
    desc: DOS masked calls infect COM files
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-masked-service-calls
      - id: micro-behaviors/os/msdos/interrupt::int21-result-bx-cx-sequence
      - id: micro-behaviors/fs/search::dos-executable-compatible-wildcard

  # Also untyped `data`: headerless COM bodies without a .com name sniff as
  # data. Only this find/write chain is widened; the looser composites stay
  # on typed COM files.
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-resident-infector
    for: [dos_com, static-lib, data]
    desc: DOS hooks INT 21h and touches files
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/impact/infect/binary/dos/interrupt::dos-get-int21-vector
      - id: micro-behaviors/os/msdos/interrupt::dos-set-int21-call
    any:
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write-call
      - id: micro-behaviors/fs/search::dos-int21-find-first-call
    needs: 1

  # Resident infector that fetches the old vector straight from the IVT
  # (no AH=35h) but still installs a handler filtering EXEC calls.
  # Untyped dumps and .a-named COM bodies sniff as data.
  - id: objectives/impact/infect/binary/dos/interrupt::dos-exec-hook-infector
    for:
    - dos_com
    - static-lib
    - data
    desc: DOS exec hook with host-write strategy
    crit: hostile
    conf: 0.94
    all:
    - id: micro-behaviors/os/msdos/interrupt::dos-set-int21-call
    - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
    - id: objectives/impact/infect/binary/dos/file::dos-host-altering-write-admission
    any:
    - id: micro-behaviors/fs/write/file/handle::dos-int21-write-call
    - id: micro-behaviors/fs/search::dos-int21-find-first-call
    needs: 1
    unless:
    - id: micro-behaviors/fs/write/file/handle::dos-encrypted-body-append-header-redirect

  - id: objectives/impact/infect/binary/dos/interrupt::dos-create-hook-com-infector
    for: [dos_com, static-lib, data]
    desc: DOS resident create hook writes its image to COM files
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-set-vector-ah
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-create-com-intercept
      - id: objectives/impact/infect/binary/dos/interrupt::dos-com-suffix-case-check
      - id: objectives/impact/infect/binary/dos/interrupt::dos-create-write-resident-image

  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-e0-exec-hook-infector
    for: [dos_com, static-lib, data]
    desc: INT E0h EXEC hook attempts COM infection
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-hook-via-e0-alias
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-e0-exec-com-appender
  - id: objectives/impact/infect/binary/dos/interrupt::dos-saved-vector-append-infector
    for: [data]
    desc: DOS appends a body through a saved vector
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/file/open::dos-open-update-far
      - id: micro-behaviors/fs/file/seek::dos-seek-end-far
      - id: micro-behaviors/fs/write/file/handle::dos-write-via-farcall

  # Same append, but the file services go through the private interrupt the
  # virus installed (INT 72h, E0h, and the same shape) while the handler
  # itself filters EXEC. The entry jump is the infected COM redirect.
  - id: objectives/impact/infect/binary/dos/interrupt::dos-private-int-exec-appender
    for: [dos_com, static-lib, data]
    desc: DOS EXEC hook appends via private interrupt
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
      - id: objectives/impact/infect/binary/dos/interrupt::dos-open-update-private-int
      - id: objectives/impact/infect/binary/dos/interrupt::dos-seek-eof-private-int
      - id: objectives/impact/infect/binary/dos/interrupt::dos-read-private-int
      - id: micro-behaviors/os/msdos/interrupt::dos-ah40-private-interrupt
      - id: metadata/binary/code/control-transfer::entry-near-jump-bytes

  # Resident prepender: the file services go through the private interrupt the
  # virus installed while the handler itself filters EXEC. The handler opens
  # the target file for update, reads the host prefix, rewinds to offset 0,
  # and writes the virus body back via the private interrupt.
  - id: objectives/impact/infect/binary/dos/interrupt::dos-private-int-exec-prepender
    for: [dos_com, static-lib, data]
    desc: DOS EXEC hook prepends via private interrupt
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
      - id: objectives/impact/infect/binary/dos/interrupt::dos-open-update-private-int
      - id: objectives/impact/infect/binary/dos/interrupt::dos-seek-start-private-int
      - id: objectives/impact/infect/binary/dos/interrupt::dos-read-private-int
      - id: micro-behaviors/os/msdos/interrupt::dos-ah40-private-interrupt

  # COM appender patch pass on an already-open handle: read the host's
  # first bytes, append the body at EOF, rewind, write the entry jump, and
  # restore the timestamp. Encrypted infectors often hide only the open.
  - id: objectives/impact/infect/binary/dos/interrupt::dos-ivt-int21-resident-infector
    for:
    - dos_com
    - static-lib
    - data
    - text
    desc: DOS IVT hook with host-write strategy
    crit: hostile
    conf: 0.94
    all:
    - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-swap
    - id: micro-behaviors/fs/write/file/handle::dos-int21-write-call
    - id: objectives/impact/infect/binary/dos/file::dos-host-altering-write-admission
    needs: 1
    any:
    - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
    - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-fcb-find-intercept
    - id: micro-behaviors/os/msdos/interrupt::int21-dir-search-intercept
    unless:
    - id: micro-behaviors/fs/write/file/handle::dos-encrypted-body-append-header-redirect

  - id: objectives/impact/infect/binary/dos/interrupt::dos-ivt-int21-mutating-interrupt-infector
    for: [dos_com, static-lib, data]
    desc: DOS EXEC hook with mutated INT 21h calls
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-swap
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
    any:
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-opcode-restore-loop
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-opcode-mutate-copy
    needs: 1
  - id: objectives/impact/infect/binary/dos/interrupt::dos-int13-hook-writer
    desc: DOS hooks the disk then writes
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int13-vector-swap
      - id: micro-behaviors/fs/write/file/handle::dos-write-dispatch

  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-search-hook-hides-appended-body
    for: [dos_com, static-lib, data]
    desc: DOS hooks directory searches and hides its appended virus body
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-store-segment-override
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-xor-directory-search-intercept
      - id: objectives/impact/infect/binary/dos/file::dos-dta-size-hide
      - id: objectives/impact/infect/binary/dos/file::dos-xor-obfuscated-body-append

  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-stealth-directory-search
    for: [dos_com, static-lib, data]
    desc: DOS hides appended data through a resident search hook
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-store-segment-override
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-xor-directory-search-intercept
      - id: objectives/impact/infect/binary/dos/file::dos-dta-size-hide

  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-table-search-hook-hides-dta-size
    for: [dos_com, static-lib, data]
    desc: Search hook hides appended bytes from listings
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-int16-vector-install-pair
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-table-directory-search-dispatch
      - id: objectives/impact/infect/binary/dos/file::dos-dta-size-hide-si

  - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-resident-search-hook-hides-body
    for: [dos_com]
    desc: DOS resident search hook hides appended body
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-fcb-find-intercept
      - id: objectives/impact/infect/binary/dos/file::dos-dta-size-hide-es-bx
      - id: objectives/impact/infect/binary/dos/file::dos-append-patch-restore-time

  # Same resident shape when the directory hide uses the FCB time-marker
  # clear plus a register borrow, and the host write is a plain INT 21h
