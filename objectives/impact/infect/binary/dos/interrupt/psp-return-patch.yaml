defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1055
  size_max: 4096

composite_rules:
  - id: dos-com-patches-caller-return-and-writes
    desc: DOS COM patches caller return, writes buffer
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-psp-return-address-byte-patch
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write
