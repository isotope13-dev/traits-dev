defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib]
  size_max: 65536
  attack: T1542.003

traits:
  - id: dos-boot-buffer-check-and-jump
    desc: Checks buffer byte and writes short jump
    crit: notable
    conf: 0.93
    if:
      type: hex
      pattern: '26 80 7F ?? EA [0-64] C7 07 EB ??'

  - id: dos-sector-write-near-call
    desc: Sets sector-write code before near call
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: 'B8 01 03 [0-16] E8 ?? ??'

  - id: dos-saved-disk-vector-far-call
    desc: Flags and CS-relative far-call sequence
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: '9C 2E FF 1E ?? ?? C3'

composite_rules:
  - id: dos-resident-boot-buffer-infector
    desc: IVT, buffer patch and sector-write code
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-zero-ds-near-004c-exchange
      - id: dos-boot-buffer-check-and-jump
      - id: dos-sector-write-near-call
      - id: dos-saved-disk-vector-far-call
