defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
  size_min: 512
  size_max: 65536
  attack: T1574

traits:
  - id: dos-save-replace-int21-vector
    desc: DOS saves and replaces INT 21 vector
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'BE 84 00 BF ?? ?? A5 A5 C7 44 FC ?? ?? 8C 44 FE'
  - id: dos-int21-write-filter
    desc: DOS interrupt handler filters write function
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: '9C 80 FC 40 75 ?? E8 ?? ?? 9D EA'
  - id: dos-write-buffer-infection-copy
    desc: DOS handler copies code into write buffer
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'BE E0 01 [0-10] B9 29 01 F3 A4'

composite_rules:
  - id: dos-int21-write-buffer-infection-hook
    desc: DOS interrupt hook alters COM file write buffers
    crit: hostile
    conf: 0.99
    near_bytes: 512
    all:
      - id: dos-save-replace-int21-vector
      - id: dos-int21-write-filter
      - id: dos-write-buffer-infection-copy
      - id: objectives/impact/infect/binary/dos/sft::dos-sft-lookup
