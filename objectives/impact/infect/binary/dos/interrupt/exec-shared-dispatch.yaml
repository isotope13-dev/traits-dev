# The short calls in these bytes are not resolved by the rule. The composite
# describes co-occurring code evidence, rather than claiming observed execution.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  size_max: 65536

traits:
  - id: dos-four-byte-entry-call-sequence
    desc: DOS four-byte call sequence bytes
    crit: notable
    conf: 0.93
    if:
      type: hex
      pattern: 'B0 02 E8 ?? ?? A3 ?? ?? B9 ?? ?? E8 ?? ?? E8 ?? ?? B1 04 E8 ?? ?? E8 ?? ?? B4 3E CD 21'

composite_rules:
  - id: dos-resident-exec-four-byte-appender
    desc: DOS EXEC hook with four-byte call pattern
    crit: hostile
    conf: 0.97
    near_bytes: 1024
    all:
      - id: dos-four-byte-entry-call-sequence
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-vector-copy-and-store
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
      - id: micro-behaviors/fs/file/open/write::dos-update-open-int21-bytes
      - id: micro-behaviors/fs/file/read-write::dos-four-byte-read-mz-check
      - id: micro-behaviors/fs/file/read-write::dos-shared-write-seek-dispatch
      - id: micro-behaviors/fs/file/timestamp::dos-int21-set-file-time
