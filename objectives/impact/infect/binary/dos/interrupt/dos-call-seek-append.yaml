defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1080
  size_max: 65536

traits:
  - id: dos-com-call-seek-append-and-header-write
    desc: Appends body then rewrites COM entry
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: "B0 02 E8 ?? ?? [0-8] B4 40 CD 21 B0 00 E8 ?? ?? [0-12] B4 40 CD 21 [0-4] B4 3E CD 21"

composite_rules:
  - id: dos-com-call-seek-append-infector
    desc: Searches hosts and appends via seek calls
    crit: hostile
    conf: 0.98
    all:
      - id: dos-com-call-seek-append-and-header-write
      - id: micro-behaviors/fs/search::dos-executable-compatible-wildcard
      - id: micro-behaviors/fs/search::dos-int21-find-first
