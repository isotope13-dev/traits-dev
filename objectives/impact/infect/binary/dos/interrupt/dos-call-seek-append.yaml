defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1080
  size_max: 65536

traits:
  - id: dos-com-call-seek-append-and-header-write
    desc: Appends body then rewrites COM entry
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: "B0 02 E8 ?? ?? [0-8] B4 40 CD 21 B0 00 E8 ?? ?? [0-12] B4 40 CD 21 [0-4] B4 3E CD 21"

  # Same append-and-entry-patch transaction, but every DOS service is issued
  # through a saved-vector call helper (E8 to a PUSHF/CALL FAR stub) instead
  # of INT 21h: seek to the host end, write the body from the segment base
  # (CX = body length, DX = 0), seek back, write a 3-5 byte entry header,
  # restore the host timestamp and close. Addresses and lengths vary; the
  # service chain is the evidence.
  - id: dos-helper-seek-append-entry-write
    desc: Appends body via helper, rewrites entry
    crit: suspicious
    conf: 0.95
    if:
      type: hex
      pattern: "B8 00 42 [0-6] E8 ?? ?? [0-96] B4 40 B9 ?? ?? (33|31) D2 E8 ?? ?? [0-56] B4 40 B9 (03|04|05) 00 BA ?? ?? E8 ?? ?? [0-16] B8 01 57 E8 ?? ?? [0-16] B4 3E E8 ?? ??"

composite_rules:
  - id: dos-com-call-seek-append-infector
    desc: Searches hosts and appends via seek calls
    crit: hostile
    conf: 0.98
    all:
      - id: dos-com-call-seek-append-and-header-write
      - id: micro-behaviors/fs/search/command::dos-executable-compatible-wildcard
      - id: micro-behaviors/fs/search/command::dos-int21-find-first
