defaults:
  for: [dos_com, static-lib, data]
  platforms: [windows, unix]
  size_max: 65536
composite_rules:
  - id: dos-mutating-exec-file-infector
    desc: Resident DOS hook infects executed files
    crit: hostile
    conf: 0.99
    # The EXEC branch reaches the update-open routine. That routine reads
    # and validates the same handle's prefix, seeks EOF, mutates and XORs
    # its copied code, appends the prepared buffers, and rewrites the entry.
    # Residency and mutation alone cannot satisfy this attack claim.
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-set-direct
      - id: micro-behaviors/os/msdos/memory::dos-allocate-system-owned-copy-block
      - id: micro-behaviors/fs/write/file/append::dos-xor-buffer-append-prefix-rewrite
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-opcode-restore-loop
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-opcode-mutate-copy
