defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
  size_min: 10000
  size_max: 65536
  attack: T1027

traits:
  - id: dos-cs-byte-xor-loop
    desc: DOS code XOR-decodes bytes in code segment
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: '2E 30 05 47 E2 FA'
  - id: dos-xor-4c-int1c-vector-store
    desc: XOR-encoded DOS interrupt 1C vector store
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: '6A EF 3C 4C 6A C5 72 3E 4C'
  - id: dos-xor-4c-int21-vector-store
    desc: XOR-encoded DOS interrupt 21 vector store
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: '6A EF C8 4C 6A C5 72 CA 4C'

composite_rules:
  - id: dos-xor-decoded-interrupt-vector-hooks
    desc: XOR-obfuscated DOS body installs interrupt vector hooks
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: dos-cs-byte-xor-loop
      - id: dos-xor-4c-int1c-vector-store
      - id: dos-xor-4c-int21-vector-store
