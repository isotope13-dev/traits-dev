defaults:
  for: [dos_com]
  platforms: [windows, unix]
  attack: T1080

composite_rules:
  - id: dos-fcb-entry-patch-appender
    desc: DOS appends code and redirects COM entry using FCB writes
    crit: hostile
    mbc: B0032
    all:
      - id: micro-behaviors/fs/write/file/binary::dos-fcb-byte-record-zero-offset
      - id: micro-behaviors/fs/write/file/binary::dos-fcb-size-offset-random-write
      - id: micro-behaviors/fs/write/file/binary::dos-fcb-entry-jump-write
