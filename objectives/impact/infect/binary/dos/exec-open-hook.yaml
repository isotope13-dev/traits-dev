# Resident COM/EXE infectors that write the INT 21h IVT slot directly
# (MOV [0084h],imm / MOV [0086h],sreg) and install a handler that filters
# EXEC (AX=4B00h) and OPEN (AX=3D00h) so every launched or opened program
# gets infected. Headerless dumps are typed data, so data is in scope.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  attack: T1080
  size_max: 65536

traits:
  - id: dos-ivt-int21-set-direct
    desc: Writes INT 21h vector into the IVT
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "C7 06 84 00 ?? ?? 8C ?? 86 00"

  # CMP AX,4B00h / Jcc ... CMP AX,3D00h / Jcc inside the INT 21h handler.
  - id: dos-handler-exec-open-filter
    desc: INT 21h handler filters exec and open
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "3D 00 4B (74|75) [1-4] 3D 00 3D (74|75)"

  # CMP WORD [BX],'OM' ... CMP WORD [BX],'XE' on the target filename.
  - id: dos-filename-com-exe-cmp
    desc: Checks filename ends in COM or EXE
    crit: notable
    conf: 0.85
    if:
      type: hex
      pattern: "81 3F 4F 4D [2-24] 81 3F 58 45"

  # Swallows INT 24h critical errors so write-protected disks stay silent.
  - id: dos-ivt-int24-set-direct
    desc: Writes INT 24h vector into the IVT
    crit: notable
    conf: 0.85
    if:
      type: hex
      pattern: "C7 06 90 00 ?? ?? 8C ?? 92 00"

composite_rules:
  - id: dos-ivt-exec-open-infector
    desc: Hooks DOS exec and open to infect
    crit: hostile
    conf: 0.94
    all:
      - id: dos-ivt-int21-set-direct
      - id: dos-handler-exec-open-filter
    any:
      - id: dos-filename-com-exe-cmp
      - id: dos-ivt-int24-set-direct
