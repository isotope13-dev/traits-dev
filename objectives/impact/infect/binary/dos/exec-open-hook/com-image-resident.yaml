defaults:
  platforms: [windows, unix]
  for: [dos_com]
  attack: T1055,T1574

composite_rules:
  - id: dos-resident-exec-com-image-write
    desc: DOS resident EXEC hook writes COM image
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-set-int21-vector
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
      - id: micro-behaviors/fs/write/file/handle/int21::dos-int21-write-com-image-ah
