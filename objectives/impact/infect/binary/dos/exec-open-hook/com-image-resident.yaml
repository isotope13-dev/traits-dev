defaults:
  platforms: [windows, unix]
  for: [dos_com]
  attack: T1055,T1574

traits:
  - id: dos-temp-stage-delete-rename-replace
    desc: DOS stages temp file and replaces host
    crit: notable
    conf: 0.96
    if:
      type: yara
      source: |
        rule dos_temp_stage_delete_rename_replace {
          strings:
            $create = { ( B4 3C | B8 ?? 3C ) [0-8] ( CD 21 | E8 ?? ?? | 2E FF 1E ?? ?? ) }
            $read = { ( B4 3F | B8 ?? 3F ) [0-12] ( CD 21 | E8 ?? ?? | 2E FF 1E ?? ?? ) }
            $del_ren = {
              (
                ( B4 41 | B8 ?? 41 ) [0-8] ( CD 21 | E8 ?? ?? | 2E FF 1E ?? ?? ) [0-24] ( B4 56 | B8 ?? 56 ) [0-8] ( CD 21 | E8 ?? ?? | 2E FF 1E ?? ?? ) |
                ( B4 56 | B8 ?? 56 ) [0-8] ( CD 21 | E8 ?? ?? | 2E FF 1E ?? ?? ) [0-24] ( B4 41 | B8 ?? 41 ) [0-8] ( CD 21 | E8 ?? ?? | 2E FF 1E ?? ?? )
              )
            }
          condition:
            $create and $read and $del_ren
        }

composite_rules:
  - id: dos-resident-exec-com-image-write
    desc: DOS resident EXEC hook writes COM image
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-set-int21-vector
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
    any:
      - id: micro-behaviors/fs/write/file/handle/int21::dos-int21-write-com-image-ah
      - id: micro-behaviors/fs/write/file/handle/int21::dos-int21-write-com-image-dx

  - id: dos-resident-exec-temp-file-replace-infect
    desc: DOS EXEC hook replaces target via temp file
    crit: hostile
    conf: 0.98
    all:
      - id: dos-resident-exec-com-image-write
      - id: dos-temp-stage-delete-rename-replace
