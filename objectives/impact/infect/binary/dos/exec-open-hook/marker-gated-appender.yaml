# Resident appender that selects its victims by extension and recognizes
# its own earlier infections: the EXEC (AX=4B00h) branch of the INT 21h
# handler checks the launched name for COM/EXE, reads the program header,
# tests it for a fixed self-marker and, when absent, seeks to EOF and
# writes its body there (Larry.491 marks both COM entry and MZ checksum
# with "MG"). The vector install form, file-time handling and marker value
# are free; the extension filter plus marker-gated EOF write is the
# parasitic-infector invariant an ordinary TSR or loader does not show.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib]
  attack: T1080
  size_max: 65536

composite_rules:
  - id: dos-exec-hook-marker-gated-appender
    desc: DOS EXEC hook appends to unmarked programs
    crit: hostile
    conf: 0.94
    near_bytes: 1024
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
      - id: micro-behaviors/data/parse/executable-header::dos-read-header-word-marker-compare
      - id: micro-behaviors/fs/file/seek::dos-seek-end-int
      - id: micro-behaviors/fs/write/file/handle/int21::dos-int21-write-call
    any:
      - id: objectives/impact/infect/binary/dos/exec-open-hook::dos-filename-com-exe-reg-cmp
      - id: objectives/impact/infect/binary/dos/exec-open-hook::dos-filename-com-exe-cmp
      - id: objectives/impact/infect/binary/dos/exec-open-hook::dos-filename-com-uppercase-filter
    needs: 1
