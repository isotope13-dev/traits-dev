# Resident DOS file infector: an installed INT 21h handler filters EXEC or
# OPEN requests, reads the target's prefix and tests it for the MZ format or
# its own entry bytes, then rewrites the file (read, seek, write, restore
# timestamp) with its image or an XOR-encoded copy of displaced host bytes.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1080
  size_max: 65536

composite_rules:
  - id: dos-int21-handler-install-alternative
    desc: Installs a DOS INT 21h handler
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/os/msdos/interrupt::dos-set-int21-vector
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-vector-get-then-set
      - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-set-direct
      - id: micro-behaviors/os/msdos/interrupt::dos-low-copy-vector-store

  - id: dos-exec-open-filter-alternative
    desc: DOS handler filters EXEC or OPEN calls
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-open-filter-trigger

  - id: dos-host-prefix-check-alternative
    desc: Tests read file prefix for MZ or self
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/fs/read/file/handle::dos-read-prefix-mz-check
      - id: micro-behaviors/fs/read/file/handle::dos-read-prefix-own-entry-check

  - id: dos-resident-hook-host-check-rewrite
    desc: DOS resident hook checks and rewrites programs
    for: [dos_com]
    crit: hostile
    conf: 0.95
    all:
      - id: dos-int21-handler-install-alternative
      - id: dos-exec-open-filter-alternative
      - id: dos-host-prefix-check-alternative
      - id: micro-behaviors/fs/file/read-write::dos-read-seek-write-time-sequences
    any:
      - id: micro-behaviors/fs/write/file/transform::dos-xor-loop-then-handle-write
      - id: micro-behaviors/fs/write/file/handle/int21::dos-int21-write-com-image-ah
      - id: micro-behaviors/fs/write/file/handle/int21::dos-int21-write-com-image-dx
