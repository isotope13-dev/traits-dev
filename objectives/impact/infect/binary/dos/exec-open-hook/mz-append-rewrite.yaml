# The header buffer's original CS:IP is saved, replaced with the calculated
# entry point, and written back after an EOF write through a shared helper.
# The byte pattern records the instruction sequence, not proven data flow.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536
  attack: T1080

traits:
  - id: dos-mz-entry-append-rewind-write
    desc: DOS MZ entry patch and append sequence
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: 'C4 7C 14 89 3E ?? ?? 8C 06 ?? ?? 89 54 14 89 44 16 A3 ?? ?? B8 02 42 33 C9 33 D2 E8 ?? ?? E8 ?? ?? 72 ?? B8 00 42 33 C9 33 D2 E8 ?? ?? B4 40 8B D6 B9 ?? ?? E8 ?? ??'

composite_rules:
  - id: dos-resident-mz-entry-appender
    desc: DOS resident hook appends and redirects MZ executables
    crit: hostile
    conf: 0.98
    all:
      - id: dos-mz-entry-append-rewind-write
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-open-filter-trigger
      - id: micro-behaviors/os/msdos/memory::dos-direct-ivt-int21-write
      - id: micro-behaviors/data/parse/executable-header::dos-mz-signature-compare
      - id: objectives/impact/infect/binary/dos/file::dos-seek-append-near-call-infector
