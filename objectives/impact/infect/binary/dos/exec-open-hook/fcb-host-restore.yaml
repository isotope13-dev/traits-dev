defaults:
  platforms: [windows, unix]
  for: [dos_com]
  attack: T1574

traits:
  - id: dos-com-entry-movsw-restore
    desc: DOS copies saved words to COM entry
    crit: notable
    if:
      type: yara
      source: |
        rule dos_com_entry_movsw_restore {
          strings:
            $restore = { BF 00 01 57 [0-20] FC 56 A5 A5 A5 A5 5E }
          condition:
            $restore
        }

composite_rules:
  - id: dos-resident-fcb-intercept-host-restore
    desc: DOS resident FCB handler restores host entry
    crit: hostile
    conf: 0.97
    all:
      - id: dos-com-entry-movsw-restore
      - id: micro-behaviors/os/msdos/interrupt::dos-set-int21-vector
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-fcb-find-intercept
      - id: objectives/impact/infect/binary/dos/interrupt::dos-saved-disk-vector-far-call
