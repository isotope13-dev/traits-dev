# Direct EXEC-hooked modification of launched DOS COM files. Directory
# enumeration is not required: the resident handler sees the invoked path.
defaults:
  platforms: [windows, unix]
  for: [dos_com]
  attack: T1080
  size_max: 65536

composite_rules:
  - id: dos-exec-hook-host-file-mutator
    desc: DOS resident EXEC hook modifies program files
    crit: hostile
    conf: 0.95
    near_bytes: 768
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
      - id: micro-behaviors/fs/file/open/write::dos-open-update-int
      - id: micro-behaviors/fs/file/read-write::dos-read-seek-write-time-sequences
    any:
      - id: micro-behaviors/os/msdos/interrupt::dos-low-copy-vector-store
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-vector-get-then-set
      - id: micro-behaviors/os/msdos/interrupt::dos-set-int21-vector
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-set-vector-ah
      - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-set-direct
      - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-store-es-index
      - id: micro-behaviors/os/msdos/memory::dos-direct-ivt-int21-write
    needs: 1
