defaults:
  platforms: [windows, unix]
  for: [dos_com]
  attack: T1574

traits:
  - id: dos-delta-copy-com-entry
    desc: DOS delta code restores COM entry bytes
    crit: notable
    if:
      type: yara
      source: |
        rule dos_delta_copy_com_entry {
          strings:
            $restore = { E8 00 00 5B 81 EB ?? ?? [0-45] BF 00 01 [0-12] F3 A4 }
          condition:
            $restore
        }

composite_rules:
  - id: dos-resident-file-update-host-restore
    desc: DOS resident file writer restores host entry
    crit: hostile
    conf: 0.97
    all:
      - id: dos-delta-copy-com-entry
      - id: micro-behaviors/os/msdos/interrupt::dos-set-int21-vector
      - id: micro-behaviors/os/msdos/interrupt::dos-vector-and-file-service-sequences
      - id: micro-behaviors/fs/file/open/write::dos-open-update-e8
