defaults:
  platforms: [windows, unix]
  for: [dos_com]
  attack: T1574

traits:
  - id: dos-delta-copy-com-entry
    desc: DOS delta code restores COM entry bytes
    crit: notable
    if:
      type: yara
      source: |
        rule dos_delta_copy_com_entry {
          strings:
            $restore = { E8 00 00 5B 81 EB ?? ?? [0-45] BF 00 01 [0-12] F3 A4 }
          condition:
            $restore
        }

  - id: dos-int21-handler-rep-movsb-com-restore
    desc: DOS INT 21h handler restores COM host
    crit: notable
    conf: 0.96
    if:
      type: yara
      source: |
        rule dos_int21_handler_rep_movsb_com_restore {
          strings:
            $entry_setup = {
              (
                BF 00 01 [0-8] BE ?? ?? |
                BE ?? ?? [0-8] BF 00 01
              ) [0-16] ( B4 ?? | B8 ?? ?? ) CD 21
            }
            $handler_copy = { 80 FC ?? ( 74 | 75 ) ?? [0-28] F3 ( A4 | A5 ) [0-16] 2E FF 2E ?? ?? }
          condition:
            $entry_setup and $handler_copy
        }

composite_rules:
  - id: dos-resident-file-update-host-restore
    desc: DOS resident file writer restores host entry
    crit: hostile
    conf: 0.97
    all:
      - id: dos-delta-copy-com-entry
      - id: micro-behaviors/os/msdos/interrupt::dos-set-int21-vector
      - id: micro-behaviors/os/msdos/interrupt::dos-vector-and-file-service-sequences
      - id: micro-behaviors/fs/file/open/write::dos-open-update-e8

  - id: dos-resident-exec-int21-host-restore
    desc: DOS resident EXEC infector restores appended host
    crit: hostile
    conf: 0.98
    all:
      - id: dos-int21-handler-rep-movsb-com-restore
      - id: objectives/impact/infect/binary/dos/exec-open-hook::dos-resident-exec-com-image-write
