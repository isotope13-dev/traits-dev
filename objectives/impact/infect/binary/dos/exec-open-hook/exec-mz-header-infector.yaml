# Jerusalem-class resident infector: the image installs its own INT 21h
# handler, the handler tests for load-and-execute (AX=4B00h), opens the
# program being launched for read/write, reads its header and tests it for
# the MZ signature, seeks to end of file and writes its body there before
# rewriting the header entry fields. COM hosts take the non-MZ branch.
# The EXEC trigger supplies the victim path; no directory search is needed.
# The MZ test separates a host-format infector from a resident logger or
# write-only overwriter. File-time preservation is optional and not required.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib]
  attack: T1080
  size_max: 65536

composite_rules:
  - id: dos-exec-hook-mz-header-infector
    desc: DOS EXEC hook appends to MZ programs
    crit: hostile
    conf: 0.95
    near_bytes: 1536
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-set-int21-call
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
      - id: micro-behaviors/fs/file/open/write::dos-open-update-int
      - id: micro-behaviors/data/parse/executable-header::dos-mz-signature-compare
      - id: micro-behaviors/fs/file/seek::dos-seek-end-int
      - id: micro-behaviors/fs/write/file/handle/int21::dos-int21-write-call
