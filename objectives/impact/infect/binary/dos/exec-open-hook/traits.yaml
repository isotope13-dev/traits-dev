# Resident COM/EXE infectors that write the INT 21h IVT slot directly
# (MOV [0084h],imm / MOV [0086h],sreg) and install a handler that filters
# EXEC (AX=4B00h) and OPEN (AX=3D00h) so every launched or opened program
# gets infected. Headerless dumps are typed data, so data is in scope.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  attack: T1080
  size_max: 65536

traits:
  - id: dos-handler-exec-open-filter
    desc: INT 21h handler filters exec and open
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "3D 00 4B (74|75) [1-4] 3D 00 3D (74|75)"

  # CMP WORD [BX],'OM' ... CMP WORD [BX],'XE' on the target filename.
  - id: dos-filename-com-exe-cmp
    desc: Checks filename ends in COM or EXE
    crit: notable
    conf: 0.85
    if:
      type: hex
      pattern: "81 3F 4F 4D [2-24] 81 3F 58 45"

  # Swallows INT 24h critical errors so write-protected disks stay silent.
  - id: dos-ivt-int24-set-direct
    desc: Writes INT 24h vector into the IVT
    crit: notable
    conf: 0.85
    if:
      type: hex
      pattern: "C7 06 90 00 ?? ?? 8C ?? 92 00"

  # Handler swaps AH into AL (XCHG AH,AL) before testing for EXEC (4Bh), so
  # the usual CMP AH,4Bh / CMP AX,4B00h shapes never appear.
  - id: dos-handler-xchg-exec-filter
    desc: INT 21h handler swaps AH for EXEC
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "86 E0 3C 4B (74|75)"

  # Host length minus three becomes the E9 displacement; the body is written
  # from offset zero (its own image), the file is rewound with AL=0 through a
  # seek helper, and a 3-4 byte entry header is written over the host start.
  - id: dos-own-image-append-rewind-entry-write
    desc: Appends own image then rewrites entry jump
    crit: suspicious
    conf: 0.93
    if:
      type: hex
      pattern: "2D 03 00 A3 ?? ?? [0-12] B4 40 (33 D2|31 D2) B9 ?? ?? CD 21 B0 00 E8 ?? ?? B4 40 BA ?? ?? B9 (03|04) 00 CD 21"

composite_rules:
  # Resident EXEC hook opens the launched program for update and appends its
  # own image with a redirected entry jump: a parasitic COM infector.
  - id: dos-xchg-exec-hook-appender
    desc: DOS EXEC hook appends itself to programs
    for: [dos_com, static-lib]
    crit: hostile
    conf: 0.95
    all:
      - id: dos-handler-xchg-exec-filter
      - id: micro-behaviors/fs/file/open::dos-open-update-int
      - id: dos-own-image-append-rewind-entry-write

  # When the resident EXEC path opens an existing host for update, reads its
  # header, seeks to EOF, and writes through the saved DOS dispatcher, the
  # otherwise separate hook and file-I/O primitives form a parasitic infector.
  - id: dos-exec-hook-parasitic-appender
    desc: DOS EXEC hook appends a body to program files
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
      - id: micro-behaviors/fs/file/open::dos-int21-open-update-saved-vector
      - id: micro-behaviors/fs/read/file/handle::dos-int21-read-saved-vector
      - id: micro-behaviors/fs/file/seek::dos-int21-seek-eof-saved-vector
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write-saved-vector
      - id: metadata/binary/code/control-transfer::entry-near-jump-bytes

  - id: dos-ivt-exec-open-infector
    desc: Hooks DOS exec and open to infect
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-set-direct
      - id: dos-handler-exec-open-filter
    any:
      - id: dos-filename-com-exe-cmp
      - id: dos-ivt-int24-set-direct

  # Resident overwriter: on each EXEC the handler rewinds the program file
  # and writes the virus image from 0100h over its start.
  - id: dos-resident-exec-image-overwriter
    desc: DOS EXEC hook overwrites programs with itself
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
      - id: micro-behaviors/fs/write/file/handle::dos-seek-start-own-image-write
    any:
      - id: micro-behaviors/os/msdos/interrupt::dos-set-int21-vector
      - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-set-direct
