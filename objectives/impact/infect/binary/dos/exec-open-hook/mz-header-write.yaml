defaults:
  platforms: [windows, unix]
  for: [dos_com]
  attack: T1574

traits:
  - id: dos-seek-start-write-mz-header
    desc: DOS seeks then writes 24-byte file prefix
    crit: notable
    if:
      type: hex
      pattern: 'B8 00 42 [0-8] CD 21 [0-120] B9 18 00 [0-8] B4 40 CD 21'

composite_rules:
  - id: dos-exec-hook-file-mz-header-write
    desc: DOS EXEC hook writes 24-byte file prefix
    crit: hostile
    conf: 0.97
    all:
      - id: dos-seek-start-write-mz-header
      - id: micro-behaviors/fs/file/read-write::dos-read-seek-write-time-sequences
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
      - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-set-direct
