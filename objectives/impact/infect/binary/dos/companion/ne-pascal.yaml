# Borland Pascal DPMI16/NE companion infectors enumerate *.EXE targets,
# copy themselves to matching .COM companions, and launch the host via INT 21h.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1080

traits:
  - id: ne-pascal-com-extension
    desc: Pascal short string .COM extension
    crit: notable
    conf: 0.88
    if:
      type: raw
      regex: '\x04\.[cC][oO][mM]'

  - id: ne-pascal-infection-message
    desc: Contains explicit infection status text
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)(will be|maybe) infected'

composite_rules:
  - id: ne-pascal-companion-infector
    desc: NE Pascal binary plants COM companions for EXE targets
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/impact/infect/virus/parasitic::ne-pascal-exe-search-mask
      - id: ne-pascal-com-extension
      - id: micro-behaviors/fs/search/command::win16-ne-int21-find-first
      - id: micro-behaviors/fs/file/open/call::win16-ne-int21-open
      - id: micro-behaviors/process/create/exec::win16-ne-int21-exec
      - id: ne-pascal-infection-message
