# DOS crack-script (`.CRK`) companion/indirect `.COM` infection technique:
# the virus enumerates `*.crk` text files, parses them for `.com` target
# filenames, infects the referenced `.COM` executable, and appends hex patch
# lines (`0000XXXX: FFFF ZZ`) formatted with `DAA` into the `.CRK` file so
# applying the crack patches the entry jump into the `.COM` file.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1080
  size_max: 65536

traits:
  - id: dos-crk-patch-script-com-infector
    desc: Infects COM targets by patching CRK files
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_crk_patch_script_com_infector {
          meta:
            filetypes = "dos_com,data"
          strings:
            $stub = { B0 ?? B9 ( 6D 03 | ?? 03 ) BE ?? ?? 30 04 ( FE C0 46 | 46 FE C0 ) E2 F9 }
            $plain_crk = "com*.crk\x00FFFF"
            $plain_daa = { 24 0F 27 04 F0 14 40 }
          condition:
            ($plain_crk and $plain_daa) or
            for any i in (1..#stub) : (
              @stub[i] + 15 + 0x35D <= filesize and
              ((uint8(@stub[i] + 15 + 0x12) ^ ((uint8(@stub[i] + 1) + 0x12) & 0xFF)) == 0xB4) and
              ((uint8(@stub[i] + 15 + 0x13) ^ ((uint8(@stub[i] + 1) + 0x13) & 0xFF)) == 0x4E) and
              ((uint8(@stub[i] + 15 + 0x2E0) ^ ((uint8(@stub[i] + 1) + 0x2E0) & 0xFF)) == 0x24) and
              ((uint8(@stub[i] + 15 + 0x2E1) ^ ((uint8(@stub[i] + 1) + 0x2E1) & 0xFF)) == 0x0F) and
              ((uint8(@stub[i] + 15 + 0x2E2) ^ ((uint8(@stub[i] + 1) + 0x2E2) & 0xFF)) == 0x27) and
              ((uint8(@stub[i] + 15 + 0x2E3) ^ ((uint8(@stub[i] + 1) + 0x2E3) & 0xFF)) == 0x04) and
              ((uint8(@stub[i] + 15 + 0x2E4) ^ ((uint8(@stub[i] + 1) + 0x2E4) & 0xFF)) == 0xF0) and
              ((uint8(@stub[i] + 15 + 0x2E5) ^ ((uint8(@stub[i] + 1) + 0x2E5) & 0xFF)) == 0x14) and
              ((uint8(@stub[i] + 15 + 0x2E6) ^ ((uint8(@stub[i] + 1) + 0x2E6) & 0xFF)) == 0x40) and
              ((uint8(@stub[i] + 15 + 0x350) ^ ((uint8(@stub[i] + 1) + 0x350) & 0xFF)) == 0x63) and
              ((uint8(@stub[i] + 15 + 0x351) ^ ((uint8(@stub[i] + 1) + 0x351) & 0xFF)) == 0x6F) and
              ((uint8(@stub[i] + 15 + 0x352) ^ ((uint8(@stub[i] + 1) + 0x352) & 0xFF)) == 0x6D) and
              ((uint8(@stub[i] + 15 + 0x353) ^ ((uint8(@stub[i] + 1) + 0x353) & 0xFF)) == 0x2A) and
              ((uint8(@stub[i] + 15 + 0x354) ^ ((uint8(@stub[i] + 1) + 0x354) & 0xFF)) == 0x2E) and
              ((uint8(@stub[i] + 15 + 0x355) ^ ((uint8(@stub[i] + 1) + 0x355) & 0xFF)) == 0x63) and
              ((uint8(@stub[i] + 15 + 0x356) ^ ((uint8(@stub[i] + 1) + 0x356) & 0xFF)) == 0x72) and
              ((uint8(@stub[i] + 15 + 0x357) ^ ((uint8(@stub[i] + 1) + 0x357) & 0xFF)) == 0x6B)
            )
        }
