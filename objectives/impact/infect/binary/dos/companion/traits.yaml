# DOS companion infectors: a matching executable keeps its bytes, and a new
# COM file with the same basename receives the virus image.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1080
  size_min: 16
  size_max: 65536

composite_rules:
  # Copy the DTA name, swap the extension for "com" at the dot, create-new
  # that name, then write the image and continue the search.
  - id: dos-lodsb-com-companion-virus
    desc: DOS copies own image into COM twins
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/file/create::dos-dta-lodsb-dot-com-create
      - id: micro-behaviors/fs/write/file/handle::dos-xchg-image-write-find-next
      - id: micro-behaviors/fs/search::dos-star-e-mask-find-first

  # On EXEC, copy the target name, force the byte before NUL to 'V',
  # rename the host, and write this image under the original name.
  - id: dos-exec-v-suffix-image-write
    desc: EXEC hook writes image after V rename
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/file/rename::dos-lodsb-v-suffix-rename
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write-com-image-ah

  # The same rename runs from a handler kept resident with INT 27h after
  # the low byte of DX is set to the resident length.
  - id: dos-resident-v-suffix-companion
    desc: Resident EXEC hook renames host to V
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/file/rename::dos-lodsb-v-suffix-rename
      - id: micro-behaviors/os/msdos/interrupt::dos-int27-after-dl-adjust
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept

  - id: dos-com-exe-rename-writer
    desc: Writes a companion after COM EXE rename
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/file/rename::dos-dot-com-exe-rename
      - id: micro-behaviors/fs/file/create::dos-create-xchg-image-write

  - id: dos-resident-com-exe-companion
    desc: Resident handler renames COM and EXE
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/file/rename::dos-dot-com-exe-rename
      - id: micro-behaviors/fs/file/create::dos-create-xchg-image-write
      - id: micro-behaviors/os/msdos/interrupt::dos-stosw-0110-int27
