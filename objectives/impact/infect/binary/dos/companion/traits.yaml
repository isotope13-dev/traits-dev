# DOS companion infectors: a matching executable keeps its bytes, and a new
# COM file with the same basename receives the virus image.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1080
  size_min: 16
  size_max: 65536

composite_rules:
  # Copy the DTA name, swap the extension for "com" at the dot, create-new
  # that name, then write the image and continue the search.
  - id: dos-lodsb-com-companion-virus
    desc: DOS creates COM twin from DTA name
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/file/create::dos-dta-lodsb-dot-com-create
      - id: micro-behaviors/fs/file/create::dos-xchg-image-write-find-next

  - id: dos-star-e-com-companion-virus
    desc: DOS plants COM beside star-e matches
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/file/create::dos-star-e-beside-com-extension
      - id: micro-behaviors/fs/file/create::dos-dta-lodsb-dot-com-create
