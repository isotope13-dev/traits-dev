# Cluster (directory-entry) infectors such as DIR-II do not open hosts.
# They reach the block-device chain through the undocumented INT 21h
# AH=52h "list of lists", then walk raw 32-byte FAT directory entries and
# pick executables by the extension field at entry offset 8.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  attack: T1080
  size_max: 65536

traits:
  - id: dos-get-list-of-lists-near
    desc: DOS list of lists via near call
    crit: notable
    conf: 0.8
    if:
      type: hex
      pattern: "B4 52 E8"

  # MOV AX,[SI+8]; CMP AX,'EX' ... CMP AX,'CO'
  - id: dos-direntry-exec-ext-check
    desc: DOS matches raw dir-entry EXE/COM
    crit: suspicious
    conf: 0.9
    if:
      type: hex
      pattern: "8B 44 08 3D 45 58 [0-12] 3D 43 4F"

  - id: dos-direntry-step
    desc: DOS steps through 32-byte dir entries
    crit: notable
    conf: 0.8
    if:
      type: hex
      pattern: "83 C6 20 [0-2] (39|3B)"

composite_rules:
  - id: dos-get-list-of-lists
    desc: DOS reads the internal list of lists
    crit: notable
    conf: 0.84
    any:
      - id: objectives/evasion/anti-av/tbav::dos-list-of-lists
      - id: dos-get-list-of-lists-near

  - id: dos-cluster-infector
    desc: DOS cluster infector picks raw dir entries
    crit: hostile
    conf: 0.94
    all:
      - id: dos-get-list-of-lists
      - id: dos-direntry-exec-ext-check
      - id: dos-direntry-step
