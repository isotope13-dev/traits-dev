defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
  attack: T1080
  size_max: 262144

traits:
  - id: dos-cs-xor-decrypt-loop
    desc: Code-segment XOR decrypt loop with INC DI
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "2E 80 35 ?? 47 E2 F9"
  - id: dos-attr-chain-saved-int21
    desc: Sets file attributes via saved int21 vector
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 01 43 8B 1E ?? ?? 9C 2E FF 1E ?? ??"

composite_rules:
  - id: dos-xor-vector-chain-appender
    desc: DOS appender decrypts its body and chains INT 21h
    crit: hostile
    conf: 0.95
    all:
      - id: dos-cs-xor-decrypt-loop
      - id: dos-attr-chain-saved-int21
