# Bytewise XOR body: require the same decoder key, range, COM displacement adjustment, EXE paragraph/header calculation, file open/write and timer-key emission. Private INT operands must agree. Addresses, key, append length and family banner are not identities.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-xor-com-exe-header-infector
    desc: XOR-hidden COM entry and EXE header infection
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_xor_com_exe_header_infector {
          strings:
            $dec = { E8 00 00 (32|30) E4 8B FC CD 1A 36 8B 2D 83 ED ?? 83 C4 02 1E 06 0E 0E 1F 07 8D B6 ?? ?? B9 ?? ?? 80 34 ?? 46 E2 FA }
            $get = "\xb8\x21\x35\xcd\x21" xor(1-255)
            $open = "\xb8\x02\x3d\xcd" xor(1-255)
            $com = "\x2d\x03\x00\xa3" xor(1-255)
            $exe = "\xb9\x10\x00\xf7\xf1\x2b\x06" xor(1-255)
            $write = "\xb4\x40\xcd" xor(1-255)
            $encrypt = "\xe4\x40\xa2" xor(1-255)
            $exec = "\x80\xfc\x4b\x75\x03" xor(1-255)
            $set = "\xb8\x21\x25\xba" xor(1-255)
            $entrywrite = "\xb9\x03\x00\xe8" xor(1-255)
          condition:
            for any d in (1..#dec) : (
              @get >= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26) and
              @get+!get <= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26)+uint16(@dec[d]+29) and
              (uint8(@get) ^ 184) == uint8(@dec[d]+33) and
              @open >= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26) and
              @open+!open <= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26)+uint16(@dec[d]+29) and
              (uint8(@open) ^ 184) == uint8(@dec[d]+33) and
              @com >= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26) and
              @com+!com <= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26)+uint16(@dec[d]+29) and
              (uint8(@com) ^ 45) == uint8(@dec[d]+33) and
              @exe >= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26) and
              @exe+!exe <= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26)+uint16(@dec[d]+29) and
              (uint8(@exe) ^ 185) == uint8(@dec[d]+33) and
              @write >= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26) and
              @write+!write <= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26)+uint16(@dec[d]+29) and
              (uint8(@write) ^ 180) == uint8(@dec[d]+33) and
              @encrypt >= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26) and
              @encrypt+!encrypt <= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26)+uint16(@dec[d]+29) and
              (uint8(@encrypt) ^ 228) == uint8(@dec[d]+33) and
              @exec >= (@dec[d]+3-uint8(@dec[d]+14))+uint16(@dec[d]+26) and
              @exec+!exec <= (@dec[d]+3-uint8(@dec[d]+14))+uint16(@dec[d]+26)+uint16(@dec[d]+29) and
              (uint8(@exec) ^ 128) == uint8(@dec[d]+33) and
              @set >= (@dec[d]+3-uint8(@dec[d]+14))+uint16(@dec[d]+26) and
              @set+!set <= (@dec[d]+3-uint8(@dec[d]+14))+uint16(@dec[d]+26)+uint16(@dec[d]+29) and
              (uint8(@set) ^ 184) == uint8(@dec[d]+33) and
              @entrywrite >= (@dec[d]+3-uint8(@dec[d]+14))+uint16(@dec[d]+26) and
              @entrywrite+!entrywrite <= (@dec[d]+3-uint8(@dec[d]+14))+uint16(@dec[d]+26)+uint16(@dec[d]+29) and
              (uint8(@entrywrite) ^ 185) == uint8(@dec[d]+33) and
              @set < @exec and @exec < @open and
              uint8(@set+7) == uint8(@open+4) and
              @entrywrite > @com and @entrywrite < @exe and
              (uint8(@entrywrite-3) ^ uint8(@dec[d]+33)) == 0xba and
              (uint16(@entrywrite-2) ^ (uint8(@dec[d]+33)*257))+1 == (uint16(@com+4) ^ (uint8(@dec[d]+33)*257)) and
              ((@entrywrite+6+(uint16(@entrywrite+4) ^ (uint8(@dec[d]+33)*257))) % 65536) == @write and
              (uint8((@dec[d]+3-uint8(@dec[d]+14))+(uint16(@com+4) ^ (uint8(@dec[d]+33)*257))-1) ^ uint8(@dec[d]+33)) == 0xe9 and
              @open < @com and @com < @exe and @exe < @encrypt and @encrypt < @write and uint8(@open+4) == uint8(@write+3)
            )
        }
