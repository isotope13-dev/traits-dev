# The resident body is encrypted with a changing single-byte XOR key.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: xor-resident-com-attributes-open
    desc: XOR-hidden attribute reset and file open
    crit: notable
    if:
      type: yara
      source: |
        rule xor_resident_com_attributes_open {
          strings:
            $s = "\xb8\x01\x43\xb9\x00\x00\xcd\x21\xb8\x02\x3d\xcd\x21" xor(1-255)
          condition:
            $s
        }

  - id: xor-resident-com-entry-patch
    desc: XOR-hidden COM entry displacement rewrite
    crit: notable
    if:
      type: yara
      source: |
        rule xor_resident_com_entry_patch {
          strings:
            $s = "\x2d\x03\x00\xa2\x24\x05\x88\x26\x25\x05\xb8\x00\x40" xor(1-255)
          condition:
            $s
        }

  - id: xor-resident-com-decode-loop
    desc: DOS copied body XOR decode loop
    crit: notable
    if:
      type: hex
      pattern: 'AC 81 FE ?? ?? 76 02 34 ?? AA E2 F4 CB'

composite_rules:
  - id: xor-resident-com-entry-infector
    desc: XOR-obscured DOS infector rewrites COM entry points
    crit: hostile
    attack: T1027
    all:
      - id: xor-resident-com-attributes-open
      - id: xor-resident-com-entry-patch
      - id: xor-resident-com-decode-loop
