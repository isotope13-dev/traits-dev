# Decoded search/seek/entry-write instructions use the key selected by the real decoder. Both XOR calls surround the self-image write. Generic XOR data writers and unrelated ciphertext must not match.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-xor-wrapped-search-entry-infector
    desc: Searches hosts and appends encrypted self
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_xor_wrapped_search_entry_infector {
          strings:
            $wrap = { E8 ?? ?? B4 40 8D 96 ?? ?? B9 ?? ?? CD 21 E8 ?? ?? }
            $decode = { E8 00 00 5F 81 EF ?? ?? B9 ?? ?? 8A 95 ?? ?? 30 95 ?? ?? 47 E2 F9 C3 }
            $find = "\x33\xc9\xb4\x4e\x8d\x96" xor(1-255)
            $patch = "\xb8\x00\x42\x2b\xd2\x2b\xc9\xcd\x21\xb4\x40\x8d\x96" xor(1-255)
            $open = "\xb8\x02\x3d\x8d\x96" xor(1-255)
          condition:
            for any w in (1..#wrap) : (
              for any d in (1..#decode) : (
                ((@wrap[w]+3+uint16(@wrap[w]+1)) % 65536) == @decode[d] and
                ((@wrap[w]+17+uint16(@wrap[w]+15)) % 65536) == @decode[d] and
                @decode[d]+3 >= uint16(@decode[d]+6) and
                @decode[d]+3-uint16(@decode[d]+6)+uint16(@wrap[w]+7) <= @wrap[w] and
                @decode[d]+3-uint16(@decode[d]+6)+uint16(@wrap[w]+7)+uint16(@wrap[w]+10) > @decode[d]+!decode[d] and
                @decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+17)+uint16(@decode[d]+9) <= filesize and
                @decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13) < filesize and
                @open > @find and @open < @patch and
                @open+12 <= (@decode[d]+3-uint16(@decode[d]+6))+uint16(@decode[d]+17)+uint16(@decode[d]+9) and
                (uint8(@open) ^ 0xb8) == uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13)) and
                (uint16(@open+7) ^ (uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))*257)) == 0x21cd and
                (uint8(@open+9) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 0x93 and
                (uint16(@open+10) ^ (uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))*257)) == 0x3fb4 and
                uint16(@decode[d]+13) >= uint16(@decode[d]+17)+uint16(@decode[d]+9) and
                @find >= (@decode[d]+3-uint16(@decode[d]+6))+uint16(@decode[d]+17) and
                @find+!find <= (@decode[d]+3-uint16(@decode[d]+6))+uint16(@decode[d]+17)+uint16(@decode[d]+9) and
                (uint8(@find) ^ 51) == uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13)) and
                @patch >= (@decode[d]+3-uint16(@decode[d]+6))+uint16(@decode[d]+17) and
                @patch+!patch <= (@decode[d]+3-uint16(@decode[d]+6))+uint16(@decode[d]+17)+uint16(@decode[d]+9) and
                (uint8(@patch) ^ 184) == uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13)) and
                (uint16(@patch+13) ^ (uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))*257)) >= uint16(@wrap[w]+7) and
                (uint16(@patch+13) ^ (uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))*257))+4 <= uint16(@wrap[w]+7)+uint16(@wrap[w]+10) and
                (uint8((@decode[d]+3-uint16(@decode[d]+6))+(uint16(@patch+13) ^ (uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))*257))+1) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 0xe9 and
                (uint8(@patch+15) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 0xb9 and
                (uint16(@patch+16) ^ (uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))*257)) == 4 and
                (uint16(@patch+18) ^ (uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))*257)) == 0x21cd and
                (uint8((@decode[d]+3-uint16(@decode[d]+6))+(uint16(@find+6) ^ (uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))*257))) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 0x2a and
                (uint8((@decode[d]+3-uint16(@decode[d]+6))+(uint16(@find+6) ^ (uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))*257))+1) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 0x2e
              )
            )
        }

composite_rules:
  - id: dos-self-reencrypting-parasitic-appender
    desc: Parasitic DOS virus re-encrypts own image around host file write
    crit: hostile
    conf: 0.98
    attack: T1080,T1027
    all:
      - id: metadata/binary/code/control-transfer::entry-near-jump-bytes
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-delta-offset-dispatch
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-xor-loop-dispatch
      - id: micro-behaviors/fs/write/file/append::dos-call-xor-helper-reencrypt-write
