defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: xor-search-entry-decoder
    desc: DOS position-relative XOR decoder loop
    crit: notable
    if:
      type: hex
      pattern: 'E8 00 00 5D 81 ED ?? ?? 8D B6 ?? ?? E8 ?? ?? EB ?? 8B 96 ?? ?? 8B FE B9 ?? ?? AC 32 C2 AA E2 FA C3'

  - id: xor-search-entry-find-open
    desc: XOR-hidden DOS file search and open
    crit: notable
    if:
      type: yara
      source: |
        rule xor_search_entry_find_open {
          strings:
            $s = "\xb4\x4e\x33\xc9\x8d\x96\x22\x02\xcd\x21\x73\x03\xe9\xa5\x00\xb8\x02\x3d" xor(1-255)
          condition:
            $s
        }

  - id: xor-search-entry-write
    desc: XOR-hidden DOS entry rewrite
    crit: notable
    if:
      type: yara
      source: |
        rule xor_search_entry_write {
          strings:
            $s = "\xb4\x30\x80\xc4\x10\xb9\x03\x00\x8d\x96\x1c\x02\xcd\x21\xb8\x01\x57" xor(1-255)
          condition:
            $s
        }

  - id: xor-search-entry-append
    desc: XOR-hidden DOS body append
    crit: notable
    if:
      type: yara
      source: |
        rule xor_search_entry_append {
          strings:
            $s = "\xb4\x41\x80\xec\x01\xba\xbc\xfc\xb9\x24\x01\xcd\x21\xb8\x00\x42" xor(1-255)
          condition:
            $s
        }

composite_rules:
  - id: xor-search-entry-infector
    desc: XOR-obscured DOS infector appends code and rewrites entry bytes
    crit: hostile
    attack: T1027
    all:
      - id: xor-search-entry-decoder
      - id: xor-search-entry-find-open
      - id: xor-search-entry-append
      - id: xor-search-entry-write
