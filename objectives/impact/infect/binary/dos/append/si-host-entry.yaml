# One file handle and a host-size-derived entry target distinguish parasitic appending from a file copier. The injected prefix sets a private vector and executes its interrupt; offsets and body length may vary.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-si-self-append-host-entry
    desc: Appends self and redirects DOS host entry
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_si_self_append_host_entry {
          strings:
            $base = { E8 00 00 5E }
            $adjust = { 81 EE ?? ?? B8 ?? ?? CD 21 }
            $save = { 89 84 ?? ?? }
            $entry = { 8B 84 ?? ?? 05 00 01 89 84 ?? ?? }
            $append = { B8 02 42 8B 9C ?? ?? B9 00 00 BA 00 00 CD 21 BA ?? ?? 03 D6 B9 ?? ?? B4 40 8B 9C ?? ?? CD 21 }
            $rewrite = { B8 00 42 8B 9C ?? ?? B9 00 00 BA 00 00 CD 21 B4 40 8B 9C ?? ?? B9 ?? ?? BA ?? ?? 03 D6 CD 21 }
          condition:
            for any a in (1..#append) : (
              for any e in (1..#entry) : (
                @entry[e] < @append[a] and @append[a]-@entry[e] < 32 and
                for any s in (1..#save) : (
                  @save[s] < @entry[e] and @entry[e]-@save[s] < 256 and uint16(@save[s]+2) == uint16(@entry[e]+2)
                ) and
                for any b in (1..#base) : (
                  for any l in (1..#adjust) : (
                  @base[b] < @adjust[l] and @adjust[l] < @entry[e] and
                  (@base[b]+3+uint16(@append[a]+16)-uint16(@adjust[l]+2)) <= @base[b] and
                  (@base[b]+3+uint16(@append[a]+16)-uint16(@adjust[l]+2))+uint16(@append[a]+21) > @base[b] and
                  (@base[b]+3+uint16(@append[a]+16)-uint16(@adjust[l]+2))+uint16(@append[a]+21) <= filesize and
                  for any r in (1..#rewrite) : (
                    @rewrite[r] == @append[a]+!append[a] and
                    uint16(@rewrite[r]+5) == uint16(@append[a]+5) and
                    uint16(@rewrite[r]+19) == uint16(@append[a]+5) and
                    uint16(@append[a]+27) == uint16(@append[a]+5) and
                    uint16(@entry[e]+9) == uint16(@rewrite[r]+25)+4 and
                    uint16(@rewrite[r]+22) >= 6 and uint16(@rewrite[r]+22) <= 128 and
                    (@base[b]+3+uint16(@rewrite[r]+25)-uint16(@adjust[l]+2))+uint16(@rewrite[r]+22) <= filesize and
                    uint8((@base[b]+3+uint16(@rewrite[r]+25)-uint16(@adjust[l]+2))) == 0xb8 and
                    uint8((@base[b]+3+uint16(@rewrite[r]+25)-uint16(@adjust[l]+2))+2) == 0x25 and
                    uint8((@base[b]+3+uint16(@rewrite[r]+25)-uint16(@adjust[l]+2))+3) == 0xba and
                    uint16((@base[b]+3+uint16(@rewrite[r]+25)-uint16(@adjust[l]+2))+4) == 0 and
                    uint16((@base[b]+3+uint16(@rewrite[r]+25)-uint16(@adjust[l]+2))+6) == 0x21cd and
                    uint8((@base[b]+3+uint16(@rewrite[r]+25)-uint16(@adjust[l]+2))+8) == 0xcd and
                    uint8((@base[b]+3+uint16(@rewrite[r]+25)-uint16(@adjust[l]+2))+9) == uint8((@base[b]+3+uint16(@rewrite[r]+25)-uint16(@adjust[l]+2))+1)
                  )
                  )
                )
              )
            )
        }
