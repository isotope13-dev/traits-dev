# Decoder range and XOR key must agree with every required operation.
defaults:
  for:
  - dos_com
  platforms:
  - windows
  - unix
  size_max: 65536
traits:
- id: dos-xor-prefix-patch-body-appender
  desc: DOS patches entry and appends XOR-coded body
  crit: hostile
  conf: 0.98
  if:
    type: yara
    source: |
      rule dos_xor_prefix_patch_body_appender {
        strings:
          $dec = { BB ?? ?? EB 08 EA 2E 80 37 ?? F9 43 FC E2 F7 }
          $displacement = "\x83\xeb\x03\x89\x1e" xor(0-255)
          $prefix = "\xb4\x40\xb9\x03\x00\xba" xor(0-255)
          $eof = "\xb8\x02\x42\x33\xd2\x33\xc9\x9c\x2e\xff\x1e" xor(0-255)
          $crypt = "\x32\xc4\xaa\x41\x81\xf9" xor(0-255)
          $write = "\xb4\x40\x9c\x2e\xff\x1e" xor(0-255)
        condition:
          uint8(0) == 0xe9 and
          for any d in (1..#dec) : (
            ((3+uint16(1)) % 65536) <= @dec[d] and
            ((3+uint16(1)) % 65536)+32 >= @dec[d] and
            uint16(@dec[d]+1) == ((@dec[d]+15+256) % 65536) and
            ((uint16(@dec[d]-6) == 0xb966 and uint32(@dec[d]-4) > 0 and @dec[d]+15+uint32(@dec[d]-4) <= filesize+1) or
             (uint8(@dec[d]-3) == 0xb9 and uint16(@dec[d]-2) > 0 and @dec[d]+15+uint16(@dec[d]-2) <= filesize+1)) and
            @displacement >= @dec[d]+15 and @displacement+!displacement <= filesize and
            ((uint16(@dec[d]-6) == 0xb966 and @displacement+!displacement <= @dec[d]+15+uint32(@dec[d]-4)) or
             (uint8(@dec[d]-3) == 0xb9 and @displacement+!displacement <= @dec[d]+15+uint16(@dec[d]-2))) and
            (uint8(@displacement) ^ 131) == uint8(@dec[d]+9) and
            @prefix >= @dec[d]+15 and @prefix+!prefix <= filesize and
            ((uint16(@dec[d]-6) == 0xb966 and @prefix+!prefix <= @dec[d]+15+uint32(@dec[d]-4)) or
             (uint8(@dec[d]-3) == 0xb9 and @prefix+!prefix <= @dec[d]+15+uint16(@dec[d]-2))) and
            (uint8(@prefix) ^ 180) == uint8(@dec[d]+9) and
            @eof >= @dec[d]+15 and @eof+!eof <= filesize and
            ((uint16(@dec[d]-6) == 0xb966 and @eof+!eof <= @dec[d]+15+uint32(@dec[d]-4)) or
             (uint8(@dec[d]-3) == 0xb9 and @eof+!eof <= @dec[d]+15+uint16(@dec[d]-2))) and
            (uint8(@eof) ^ 184) == uint8(@dec[d]+9) and
            @crypt >= @dec[d]+15 and @crypt+!crypt <= filesize and
            ((uint16(@dec[d]-6) == 0xb966 and @crypt+!crypt <= @dec[d]+15+uint32(@dec[d]-4)) or
             (uint8(@dec[d]-3) == 0xb9 and @crypt+!crypt <= @dec[d]+15+uint16(@dec[d]-2))) and
            (uint8(@crypt) ^ 50) == uint8(@dec[d]+9) and
            @write >= @dec[d]+15 and @write+!write <= filesize and
            ((uint16(@dec[d]-6) == 0xb966 and @write+!write <= @dec[d]+15+uint32(@dec[d]-4)) or
             (uint8(@dec[d]-3) == 0xb9 and @write+!write <= @dec[d]+15+uint16(@dec[d]-2))) and
            (uint8(@write) ^ 180) == uint8(@dec[d]+9) and
            (uint16(@prefix+6) ^ (uint8(@dec[d]+9)*257)) >= 256 and
            (uint8(((3+uint16(1)) % 65536)+(uint16(@prefix+6) ^ (uint8(@dec[d]+9)*257))-256) ^ uint8(@dec[d]+9)) == 0xe9 and
            @prefix > @displacement and @prefix-@displacement < 64 and @eof > @prefix and @eof-@prefix < 32 and @crypt > @eof and @crypt-@eof < 512 and @write > @crypt and @write-@crypt < 64
          )
      }
