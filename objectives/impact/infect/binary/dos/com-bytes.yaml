# Direct-action and resident DOS COM infectors. The bytes are the DOS
# services themselves: find a host, write into it, or save and replace the
# INT 21h vector. Names and campaign markers are not part of the match.
# MOV AH,imm8 and MOV AX,imm16 are separate patterns: a hex alternative
# shorter than 3 concrete bytes is rejected.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  attack: T1080

traits:
  - id: dos-int21-find-first
    desc: DOS find-first via INT 21h
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 4E [0-32] CD 21"

  - id: dos-int21-find-first-ax
    desc: DOS find-first via MOV AX
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 ?? 4E [0-32] CD 21"

  - id: dos-int21-find-first-near
    desc: DOS find-first through a near call
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 4E [0-12] E8"

  - id: dos-int21-find-next
    desc: DOS find-next via INT 21h
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 4F [0-32] CD 21"

  - id: dos-int21-find-next-ax
    desc: DOS find-next via MOV AX
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 ?? 4F [0-32] CD 21"

  - id: dos-int21-find-next-near
    desc: DOS find-next through a near call
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 4F [0-8] E8"

  # Find-first, then find-next jumping back to share the same INT 21h.
  - id: dos-int21-find-loop-jump
    desc: DOS find-next loops back to INT 21h
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 4E [0-32] CD 21 [0-24] B4 4F EB"

  - id: dos-int21-write
    desc: DOS writes a file via INT 21h
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 40 [0-32] CD 21"

  - id: dos-int21-write-ax
    desc: DOS write via MOV AX
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B8 ?? 40 [0-32] CD 21"

  - id: dos-int21-write-near
    desc: DOS write through a near call
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 40 [0-12] E8"

  - id: dos-int21-write-far
    desc: DOS write through a far call
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 40 [0-16] 2E FF 1E"

  - id: dos-int21-set-vector-ah
    desc: DOS set-vector via MOV AH
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 25 [0-8] CD 21"

  - id: dos-com-exe-mask
    desc: DOS filename wildcard for infection
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "2A 2E (43 4F 4D|45 58 45|63 6F 6D|65 78 65|2A)"

  - id: dos-com-mask-stosb
    desc: DOS builds a COM search mask
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B0 2A [0-4] AA [0-8] B0 2E [0-6] AA [0-8] B0 43 [0-6] AA"

  - id: dos-int21-find-first-jump
    desc: DOS find-first after a short jump
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 4E EB [0-40] CD 21"

  - id: dos-int21-open
    desc: DOS opens a file via INT 21h
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "B4 3D [0-16] CD 21"

  - id: dos-int21-open-ax
    desc: DOS open via MOV AX
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "B8 ?? 3D [0-16] CD 21"

  - id: dos-int21-read
    desc: DOS reads a file via INT 21h
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "B4 3F [0-16] CD 21"

  - id: dos-int21-read-ax
    desc: DOS read via MOV AX
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "B8 ?? 3F [0-16] CD 21"

  - id: dos-int21-seek
    desc: DOS seeks within a file
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 42 [0-8] CD 21"

  - id: dos-int21-seek-ax
    desc: DOS seek via MOV AX
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B8 ?? 42 [0-12] CD 21"

  - id: dos-int21-set-file-time
    desc: DOS sets a file timestamp
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "(B8 01 57|B4 57 B0 01) [0-8] CD 21"

  - id: dos-get-int21-vector
    desc: DOS reads the INT 21h vector
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 21 35 [0-8] CD 21"

  - id: dos-set-int21-vector
    desc: DOS installs a new INT 21h handler
    crit: suspicious
    conf: 0.93
    if:
      type: hex
      pattern: "B8 21 25 [0-8] CD 21"

  - id: dos-open-update-int
    desc: DOS opens a file for update
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 02 3D CD"

  - id: dos-seek-end-int
    desc: DOS seeks to end of file
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 02 42 [0-6] CD"

  - id: dos-write-via-int
    desc: DOS write via a software interrupt
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 40 [0-8] CD"

  - id: dos-open-update-far
    desc: DOS opens for update through a vector
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 02 3D 9C 2E FF 1E"

  - id: dos-seek-end-far
    desc: DOS seeks to end through a vector
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 02 42 [0-8] 9C 2E FF 1E"

  - id: dos-write-via-farcall
    desc: DOS writes through a saved vector
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 40 [0-6] 9C 2E FF 1E"

  - id: dos-open-update-near
    desc: DOS opens for update then calls
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 02 3D 9C 0E E8"

  - id: dos-seek-start-int
    desc: DOS seeks to start of file
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B8 00 42 [0-6] CD"

  - id: dos-open-update-e8
    desc: DOS opens for update via a call
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 02 3D [0-4] E8"

  - id: dos-seek-end-e8
    desc: DOS seeks to end via a call
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 02 42 [0-8] E8"

  - id: dos-seek-ah-cwd
    desc: DOS seeks after sign-extending DX
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 42 99 [0-4] CD"

composite_rules:
  - id: dos-int21-find-first-call
    desc: DOS find-first syscall
    crit: notable
    conf: 0.9
    any:
      - id: dos-int21-find-first
      - id: dos-int21-find-first-ax
      - id: dos-int21-find-first-near
      - id: dos-int21-find-first-jump

  - id: dos-int21-write-call
    desc: DOS write syscall
    crit: notable
    conf: 0.86
    any:
      - id: dos-int21-write
      - id: dos-int21-write-ax
      - id: dos-int21-write-near
      - id: dos-int21-write-far

  - id: dos-set-int21-call
    desc: DOS installs an interrupt vector
    crit: notable
    conf: 0.88
    any:
      - id: dos-set-int21-vector
      - id: dos-int21-set-vector-ah

  - id: dos-int21-open-call
    desc: DOS open syscall
    crit: notable
    conf: 0.84
    any:
      - id: dos-int21-open
      - id: dos-int21-open-ax

  - id: dos-int21-read-call
    desc: DOS read syscall
    crit: notable
    conf: 0.84
    any:
      - id: dos-int21-read
      - id: dos-int21-read-ax

  - id: dos-int21-seek-call
    desc: DOS seek syscall
    crit: notable
    conf: 0.86
    any:
      - id: dos-int21-seek
      - id: dos-int21-seek-ax

  - id: dos-com-directory-infector
    desc: DOS COM walks a directory and writes
    crit: hostile
    conf: 0.96
    all:
      - id: dos-int21-find-first-call
      - id: dos-int21-write-call
    any:
      - id: dos-int21-find-next
      - id: dos-int21-find-next-ax
      - id: dos-int21-find-next-near
      - id: dos-int21-find-loop-jump
      - id: dos-com-exe-mask
      - id: dos-com-mask-stosb
    needs: 1
    unless:
      # Chromium's resources.pak is a packed resource blob. Coincidental
      # INT 21h byte runs inside it are not a DOS directory infector.
      - id: micro-behaviors/fs/path/application/browser::chromium-resources-pak-basename
      - id: metadata/package/testing/presence/harness::bench-data-corpus-path
      # pedump's sig.bin is a marshalled packer signature catalog, not a
      # DOS infector body.
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker
      # MaxMind's GeoLite2 city database is a packed binary. INT 21h byte
      # runs inside it are not a DOS directory infector.
      - id: well-known/lib/data/maxmind::geolite2-mmdb-basename
      # OpenCV-style SIFT keypoint tables are packed feature data.
      - id: well-known/lib/data/keypoint::sift-keypoint-basename
      # ONNX weights and Qt RCC blobs are packed data, not DOS code.
      - id: well-known/lib/data/onnx::onnx-model-basename
      - id: well-known/lib/ui/qt::qt-rcc-basename
      # VRM avatars are glTF binaries. INT 21h runs in the mesh are not DOS code.
      - id: well-known/lib/data/vrm::vrm-model-basename

  - id: dos-int21-resident-infector
    desc: DOS hooks INT 21h and touches files
    crit: hostile
    conf: 0.95
    all:
      - id: dos-get-int21-vector
      - id: dos-set-int21-call
    any:
      - id: dos-int21-write-call
      - id: dos-int21-find-first-call
    needs: 1

  - id: dos-timestamped-file-write
    desc: DOS write keeps the file time
    crit: hostile
    conf: 0.95
    all:
      - id: dos-int21-open-call
      - id: dos-int21-write-call
      - id: dos-int21-set-file-time
    any:
      - id: dos-int21-read-call
      - id: dos-int21-seek-call
    needs: 1

  - id: dos-open-update-dispatch
    desc: DOS opens a file for update
    crit: notable
    conf: 0.9
    any:
      - id: dos-open-update-int
      - id: dos-open-update-far
      - id: dos-open-update-near
      - id: dos-open-update-e8

  - id: dos-seek-end-dispatch
    desc: DOS seeks to end of file
    crit: notable
    conf: 0.9
    any:
      - id: dos-seek-end-int
      - id: dos-seek-end-far
      - id: dos-seek-start-int
      - id: dos-seek-end-e8
      - id: dos-seek-ah-cwd
      - id: dos-int21-seek

  - id: dos-write-dispatch
    desc: DOS writes through a DOS entry
    crit: notable
    conf: 0.86
    any:
      - id: dos-write-via-int
      - id: dos-write-via-farcall
      - id: dos-int21-write-near

  - id: dos-relocated-append-infector
    desc: DOS writes a body into a host
    crit: hostile
    conf: 0.95
    all:
      - id: dos-open-update-dispatch
      - id: dos-seek-end-dispatch
      - id: dos-write-dispatch

  # COM appender patch pass on an already-open handle: read the host's
  # first bytes, append the body at EOF, rewind, write the entry jump, and
  # restore the timestamp. Encrypted infectors often hide only the open.
  - id: dos-append-patch-restore-time
    desc: DOS appends, patches entry, keeps time
    crit: hostile
    conf: 0.94
    all:
      - id: dos-int21-read-call
      - id: dos-seek-end-int
      - id: dos-int21-write-call
      - id: dos-seek-start-int
      - id: dos-int21-set-file-time
