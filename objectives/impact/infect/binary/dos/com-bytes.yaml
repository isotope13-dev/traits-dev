# Direct-action and resident DOS COM infectors. The bytes are the DOS
# services themselves: find a host, write into it, or save and replace the
# INT 21h vector. Names and campaign markers are not part of the match.
# MOV AH,imm8 and MOV AX,imm16 are separate patterns: a hex alternative
# shorter than 3 concrete bytes is rejected.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib]
  attack: T1080
  size_max: 65536

traits:
  - id: dos-int21-find-first
    for: [dos_com, static-lib, data]
    desc: DOS find-first via INT 21h
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 4E [0-32] CD 21"

  - id: dos-int21-find-first-ax
    for: [dos_com, static-lib, data]
    desc: DOS find-first via MOV AX
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 ?? 4E [0-32] CD 21"

  - id: dos-int21-find-first-near
    for: [dos_com, static-lib, data]
    desc: DOS find-first through a near call
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 4E [0-12] E8"

  - id: dos-int21-find-next
    for: [dos_com, static-lib, data]
    desc: DOS find-next via INT 21h
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 4F [0-32] CD 21"

  - id: dos-int21-find-next-ax
    for: [dos_com, static-lib, data]
    desc: DOS find-next via MOV AX
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 ?? 4F [0-32] CD 21"

  - id: dos-int21-find-next-near
    for: [dos_com, static-lib, data]
    desc: DOS find-next through a near call
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 4F [0-8] E8"

  # Find-next jumping back to share the find-first INT 21h call.
  - id: dos-int21-find-next-jump
    for: [dos_com, static-lib, data]
    desc: DOS find-next jumps to the call
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 4F EB"

  - id: dos-int21-write
    for: [dos_com, static-lib, data]
    desc: DOS writes a file via INT 21h
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 40 [0-32] CD 21"

  - id: dos-int21-write-ax
    for: [dos_com, static-lib, data]
    desc: DOS write via MOV AX
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B8 ?? 40 [0-32] CD 21"

  - id: dos-int21-write-near
    for: [dos_com, static-lib, data]
    desc: DOS write through a near call
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 40 [0-12] E8"

  - id: dos-int21-write-far
    for: [dos_com, static-lib, data]
    desc: DOS write through a far call
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 40 [0-16] 2E FF 1E"

  - id: dos-int21-set-vector-ah
    for: [dos_com, static-lib, data]
    desc: DOS set-vector via MOV AH
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 25 [0-8] CD 21"

  - id: dos-com-exe-mask
    for: [dos_com, static-lib, data]
    desc: DOS filename wildcard for infection
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "2A 2E (43 4F 4D|45 58 45|63 6F 6D|65 78 65|2A)"

  - id: dos-com-mask-stosb
    for: [dos_com, static-lib, data]
    desc: DOS builds a COM search mask
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B0 2A [0-4] AA [0-8] B0 2E [0-6] AA [0-8] B0 43 [0-6] AA"

  - id: dos-int21-find-first-jump
    for: [dos_com, static-lib, data]
    desc: DOS find-first after a short jump
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 4E EB [0-40] CD 21"

  - id: dos-int21-open
    desc: DOS opens a file via INT 21h
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "B4 3D [0-16] CD 21"

  - id: dos-int21-open-ax
    desc: DOS open via MOV AX
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "B8 ?? 3D [0-16] CD 21"

  - id: dos-int21-read
    desc: DOS reads a file via INT 21h
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "B4 3F [0-16] CD 21"

  - id: dos-int21-read-ax
    desc: DOS read via MOV AX
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "B8 ?? 3F [0-16] CD 21"

  - id: dos-int21-seek
    desc: DOS seeks within a file
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 42 [0-8] CD 21"

  - id: dos-int21-seek-ax
    desc: DOS seek via MOV AX
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B8 ?? 42 [0-12] CD 21"

  - id: dos-int21-set-file-time
    desc: DOS sets a file timestamp
    crit: notable
    conf: 0.9
    # EXE-prefixed virus bodies sniff as data; dos-int26 composites gate on it.
    for: [dos_com, static-lib, data]
    if:
      type: hex
      pattern: "(B8 01 57|B4 57 B0 01) [0-8] CD 21"

  - id: dos-get-int21-vector
    for: [dos_com, static-lib, data]
    desc: DOS reads the INT 21h vector
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 21 35 [0-8] CD 21"

  - id: dos-set-int21-vector
    for: [dos_com, static-lib, data]
    desc: DOS installs a new INT 21h handler
    crit: suspicious
    conf: 0.93
    if:
      type: hex
      pattern: "B8 21 25 [0-8] CD 21"

  # INT 21h handler filter: CMP AX,4B00h / CMP AH,4Bh then JZ/JNZ, including
  # the INC AH; CMP AH,4Ch bias variant. Callers load AX with MOV; only a
  # hooked handler compares it to catch execution.
  - id: dos-int21-exec-intercept
    desc: DOS handler intercepts program exec
    crit: notable
    conf: 0.88
    # Headerless resident bodies sniff as data; see dos-ivt-int21-swap.
    for: [dos_com, static-lib, data]
    if:
      type: hex
      pattern: "(3D 00 4B|80 FC 4B|FE C4 80 FC 4C [0-6]) (74|75)"

  - id: dos-open-update-int
    desc: DOS opens a file for update
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 02 3D CD"

  - id: dos-open-al-update
    desc: DOS opens for update with AL
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 3D B0 02 [0-2] CD"

  - id: dos-seek-or-ah
    desc: DOS seeks by setting AH
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "80 CC 42 [0-8] CD"

  - id: dos-int13-vector-swap
    desc: DOS swaps the disk service vector
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "87 06 4C 00"

  - id: dos-seek-end-int
    desc: DOS seeks to end of file
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 02 42 [0-6] CD"

  - id: dos-write-via-int
    desc: DOS write via a software interrupt
    crit: notable
    conf: 0.86
    for: [dos_com, static-lib, data]
    if:
      type: hex
      pattern: "B4 40 [0-12] CD"

  - id: dos-open-update-far
    # Device-driver and headerless bodies sniff as data.
    for: [dos_com, static-lib, data]
    desc: DOS opens for update through a vector
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 02 3D 9C 2E FF 1E"

  - id: dos-seek-end-far
    for: [dos_com, static-lib, data]
    desc: DOS seeks to end through a vector
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 02 42 [0-8] 9C 2E FF 1E"

  # Shared seek helper: MOV AH,42h then PUSHF (optionally CLI) and a far
  # call through the saved original INT 21h vector.
  - id: dos-seek-via-farcall
    desc: DOS seeks through a saved vector
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 42 [0-6] 9C [0-1] 2E FF 1E"

  - id: dos-write-via-farcall
    for: [dos_com, static-lib, data]
    desc: DOS writes through a saved vector
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 40 [0-6] 9C 2E FF 1E"

  - id: dos-open-update-near
    desc: DOS opens for update then calls
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 02 3D 9C 0E E8"

  - id: dos-seek-start-int
    desc: DOS seeks to start of file
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B8 00 42 [0-6] CD"

  - id: dos-open-update-e8
    desc: DOS opens for update via a call
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 02 3D [0-4] E8"

  - id: dos-seek-end-e8
    desc: DOS seeks to end via a call
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 02 42 [0-8] E8"

  - id: dos-seek-ah-cwd
    desc: DOS seeks after sign-extending DX
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 42 99 [0-4] CD"

  # INT 21h hooked by patching the IVT at 0000:0084 directly instead of
  # AH=35h/25h: LDS/LES reg,[0084] then MOV [0084],imm or MOV [0084],reg.
  - id: dos-ivt-int21-swap-imm
    desc: DOS swaps IVT INT 21h vector
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "(C4|C5) ?? 84 00 [0-32] C7 06 84 00"

  - id: dos-ivt-int21-swap-reg
    desc: DOS swaps INT 21h vector via register
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "(C4|C5) ?? 84 00 [0-32] (89|8C) ?? 84 00"

  # Installs a handler by storing offset then segment straight into the
  # IVT slot at 0000:0084 (MOV [0084],reg / MOV [0086],sreg).
  - id: dos-ivt-int21-store
    desc: DOS stores a handler in the IVT
    crit: notable
    conf: 0.9
    for: [dos_com, static-lib, data]
    if:
      type: hex
      pattern: "89 ?? 84 00 [0-4] 8C ?? 86 00"

  # MOV BX,0084 / LES|LDS r,[BX] / MOV WORD [BX],imm / MOV [BX+2],reg:
  # reads the old INT 21h vector and patches the slot through BX.
  - id: dos-ivt-int21-swap-bx
    desc: DOS swaps INT 21h vector via BX
    crit: notable
    conf: 0.9
    for: [dos_com, static-lib, data]
    if:
      type: hex
      pattern: "BB 84 00 (C4|C5) ?? [0-8] C7 07 ?? ?? (89|8C) ?? 02"

  # Installs a handler by storing segment then immediate offset into the
  # IVT slot at 0000:0084 (MOV [0086],sreg|reg / MOV WORD [0084],imm).
  - id: dos-ivt-int21-store-seg-imm
    desc: DOS stores IVT handler segment first
    crit: notable
    conf: 0.9
    for: [dos_com, static-lib, data]
    if:
      type: hex
      pattern: "(8C|89) ?? 86 00 [0-4] C7 06 84 00"

  # CMP AH,11h / CMP AH,12h: FCB find-first/next, hooked for size stealth.
  - id: dos-int21-fcb-find-intercept
    desc: DOS handler intercepts FCB dir search
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "80 FC 11 (74|75) ?? 80 FC 12 (74|75)"

  - id: dos-read-three-bytes
    desc: DOS reads the first three bytes
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 3F [0-6] B9 03 00 [0-12] CD"

  - id: dos-list-of-lists-int
    desc: DOS requests the list of lists
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 52 [0-6] CD 21"

  - id: dos-list-of-lists-call
    desc: DOS calls for the list of lists
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 52 E8"

  - id: dos-cmp-open-update
    desc: DOS checks for an update open
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "3D 02 3D"

  - id: dos-cmp-exec
    desc: DOS checks for program execution
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "3D 00 4B"

  - id: dos-seek-int-stub
    desc: DOS seek is a one-call stub
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 42 CD ?? C3"

  - id: dos-write-int-stub
    desc: DOS write is a one-call stub
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 40 CD ?? C3"

  - id: dos-call-with-al-two
    desc: DOS calls with AL set to two
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B0 02 [0-6] E8"

  - id: dos-xor-byte-loop
    desc: DOS xor-decrypts a byte buffer
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "8A 27 [0-2] 32 26 [0-4] 88 27 [0-2] 43"

  - id: dos-bump-then-create
    desc: DOS bumps a name then creates
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "2E FE 86 [0-6] B4 3C [0-8] CD"

  - id: dos-hard-disk-call
    desc: DOS calls the first hard disk
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B2 80 [0-8] CD 13"

  - id: dos-ah-nine-minus-six
    desc: DOS turns AH nine into a write
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 09 [0-4] 80 EC 06"

  - id: dos-biased-service
    desc: DOS subtracts 2020h from the service
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "2D 20 20 [0-8] CD 21"

  - id: dos-load-dpb
    desc: DOS loads a disk parameter block
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "26 C5 1F"

  - id: dos-push-dpb-link
    desc: DOS reads the next buffer link
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "26 FF 77 FE"

  - id: dos-copy-59
    desc: DOS copies a 59-byte body
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B1 3B F3 A4"

  - id: dos-marker-write-59
    desc: DOS writes 59 bytes on a jump
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "3D E9 40 [0-8] B9 3B 00 CD 21"

composite_rules:
  - id: dos-int21-find-first-call
    for: [dos_com, static-lib, data]
    desc: DOS find-first syscall
    crit: notable
    conf: 0.9
    any:
      - id: dos-int21-find-first
      - id: dos-int21-find-first-ax
      - id: dos-int21-find-first-near
      - id: dos-int21-find-first-jump

  - id: dos-int21-write-call
    for: [dos_com, static-lib, data, text]
    desc: DOS write syscall
    crit: notable
    conf: 0.86
    any:
      - id: dos-int21-write
      - id: dos-int21-write-ax
      - id: dos-int21-write-near
      - id: dos-int21-write-far
      - id: dos-write-via-int
      - id: micro-behaviors/os/msdos/interrupt::int21-write-carry-check

  - id: dos-set-int21-call
    for: [dos_com, static-lib, data]
    desc: DOS installs an interrupt vector
    crit: notable
    conf: 0.88
    any:
      - id: dos-set-int21-vector
      - id: dos-int21-set-vector-ah

  - id: dos-int21-open-call
    desc: DOS open syscall
    crit: notable
    conf: 0.84
    any:
      - id: dos-int21-open
      - id: dos-int21-open-ax

  - id: dos-int21-read-call
    desc: DOS read syscall
    crit: notable
    conf: 0.84
    any:
      - id: dos-int21-read
      - id: dos-int21-read-ax

  - id: dos-int21-seek-call
    desc: DOS seek syscall
    crit: notable
    conf: 0.86
    any:
      - id: dos-int21-seek
      - id: dos-int21-seek-ax

  # Also untyped `data`: headerless COM bodies without a .com name sniff as
  # data. Only this find/write chain is widened; the looser composites stay
  # on typed COM files.
  - id: dos-com-directory-infector
    for: [dos_com, static-lib, data]
    desc: DOS COM walks a directory and writes
    crit: hostile
    conf: 0.96
    size_max: 1048576
    all:
      - id: dos-int21-find-first-call
      - id: dos-int21-write-call
    any:
      - id: dos-int21-find-next
      - id: dos-int21-find-next-ax
      - id: dos-int21-find-next-near
      - id: dos-int21-find-next-jump
      - id: dos-com-exe-mask
      - id: dos-com-mask-stosb
    needs: 1
    unless:
      # Chromium's resources.pak is a packed resource blob. Coincidental
      # INT 21h byte runs inside it are not a DOS directory infector.
      - id: micro-behaviors/fs/path/application/browser::chromium-resources-pak-basename
      - id: metadata/package/testing/presence/harness::bench-data-corpus-path
      # pedump's sig.bin is a marshalled packer signature catalog, not a
      # DOS infector body.
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker
      # MaxMind's GeoLite2 city database is a packed binary. INT 21h byte
      # runs inside it are not a DOS directory infector.
      - id: well-known/lib/data/maxmind::geolite2-mmdb-basename
      # OpenCV-style SIFT keypoint tables are packed feature data.
      - id: well-known/lib/data/keypoint::sift-keypoint-basename
      # ONNX weights and Qt RCC blobs are packed data, not DOS code.
      - id: well-known/lib/data/onnx::onnx-model-basename
      - id: well-known/lib/ui/qt::qt-rcc-basename
      # VRM avatars are glTF binaries. INT 21h runs in the mesh are not DOS code.
      - id: well-known/lib/data/vrm::vrm-model-basename
      # NCNN neural network model weights are tensor data, not DOS code.
      - id: well-known/lib/data/ncnn::ncnn-model-basename

  # Headerless COM bodies sniff as data; three distinct INT 21h service
  # sequences (get vector, set vector, write/find) are not coincidental.
  - id: dos-int21-resident-infector
    for: [dos_com, static-lib, data]
    desc: DOS hooks INT 21h and touches files
    crit: hostile
    conf: 0.95
    all:
      - id: dos-get-int21-vector
      - id: dos-set-int21-call
    any:
      - id: dos-int21-write-call
      - id: dos-int21-find-first-call
    needs: 1

  # Resident infector that fetches the old vector straight from the IVT
  # (no AH=35h) but still installs a handler filtering EXEC calls.
  # Untyped dumps and .a-named COM bodies sniff as data.
  - id: dos-exec-hook-infector
    for: [dos_com, static-lib, data]
    desc: DOS hooks INT 21h exec, touches files
    crit: hostile
    conf: 0.94
    all:
      - id: dos-set-int21-call
      - id: dos-int21-exec-intercept
    any:
      - id: dos-int21-write-call
      - id: dos-int21-find-first-call
    needs: 1

  - id: dos-timestamped-file-write
    desc: DOS write keeps the file time
    crit: hostile
    conf: 0.95
    all:
      - id: dos-int21-open-call
      - id: dos-int21-write-call
      - id: dos-int21-set-file-time
    any:
      - id: dos-int21-read-call
      - id: dos-int21-seek-call
    needs: 1

  - id: dos-open-update-dispatch
    desc: DOS opens a file for update
    crit: notable
    conf: 0.9
    any:
      - id: dos-open-update-int
      - id: dos-open-al-update
      - id: dos-open-update-far
      - id: dos-open-update-near
      - id: dos-open-update-e8

  - id: dos-seek-end-dispatch
    desc: DOS seeks to end of file
    crit: notable
    conf: 0.9
    any:
      - id: dos-seek-end-int
      - id: dos-seek-or-ah
      - id: dos-seek-end-far
      - id: dos-seek-start-int
      - id: dos-seek-end-e8
      - id: dos-seek-ah-cwd
      - id: dos-int21-seek
      - id: dos-seek-via-farcall

  - id: dos-write-dispatch
    desc: DOS writes through a DOS entry
    crit: notable
    conf: 0.86
    any:
      - id: dos-write-via-int
      - id: dos-write-via-farcall
      - id: dos-int21-write-near

  - id: dos-relocated-append-infector
    desc: DOS writes a body into a host
    crit: hostile
    conf: 0.95
    all:
      - id: dos-seek-end-dispatch
      - id: dos-write-dispatch
    any:
      - id: dos-open-update-dispatch
      - id: dos-read-three-bytes
    needs: 1

  # The dispatch rollups above stay on typed COM files so a lone near-call
  # write does not promote packed data. Device-driver and headerless bodies
  # sniff as data and call DOS through a saved vector: open for update,
  # seek to end, then write the body.
  - id: dos-saved-vector-append-infector
    for: [data]
    desc: DOS appends a body through a saved vector
    crit: hostile
    conf: 0.95
    all:
      - id: dos-open-update-far
      - id: dos-seek-end-far
      - id: dos-write-via-farcall

  # COM appender patch pass on an already-open handle: read the host's
  # first bytes, append the body at EOF, rewind, write the entry jump, and
  # restore the timestamp. Encrypted infectors often hide only the open.
  - id: dos-append-patch-restore-time
    desc: DOS appends, patches entry, keeps time
    crit: hostile
    conf: 0.94
    all:
      - id: dos-int21-read-call
      - id: dos-seek-end-int
      - id: dos-int21-write-call
      - id: dos-seek-start-int
      - id: dos-int21-set-file-time

  # Resident infector that patches the IVT directly, then filters EXEC or
  # FCB directory calls in its handler and writes into files. Also untyped
  # `data`: headerless resident bodies sniff that way, and filler-padded
  # ones sniff as `text`. The store leg covers bodies that read the old
  # vector far from where they patch it.
  - id: dos-ivt-int21-swap
    for: [dos_com, static-lib, data, text]
    desc: DOS swaps IVT INT 21h vector
    crit: notable
    conf: 0.9
    any:
      - id: dos-ivt-int21-swap-imm
      - id: dos-ivt-int21-swap-reg
