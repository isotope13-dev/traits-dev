defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 65536

composite_rules:
  - id: dos-command-interpreter-image-overwrite
    desc: Jump-padded DOS image overwrites COMMAND.COM
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/file/create::dos-jump-padded-create-image-write
      - id: micro-behaviors/fs/file/create::dos-command-com-create-target

  - id: dos-boot-command-interpreter-infector
    desc: Infects DOS command interpreter boot binary
    crit: hostile
    conf: 0.99
    attack: T1546,T1080
    mbc: B0032
    for: [dos_com]
    all:
      - id: micro-behaviors/fs/path/config/boot::dos-boot-file-drive-path
      - id: micro-behaviors/fs/file/open::dos-open-update-int
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write
