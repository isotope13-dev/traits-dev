# Resident overwrite path (Small.63), filed by effect rather than by the
# install mechanics covered in ../interrupt/: a hooked write service whose
# buffer starts with E9h -- the near jump of a COM program being written
# to disk -- is overwritten with the resident body, and the handler then
# chains into the saved original vector so the call looks untouched. The
# trigger leg supplies the overwrite; the chain leg supplies the resident
# handler. Either alone is only suspicious.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1080
  size_max: 65536

composite_rules:
  - id: dos-resident-write-overwriter
    desc: DOS resident handler overwrites E9 writes
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-e9-write-trigger
      - id: micro-behaviors/os/msdos/interrupt::dos-handler-chain-far-jump
