# Write-filter and far-chain code co-occur. This supports an infection profile,
# but does not bind the installed vector to the handler or prove it is viable.
# The reviewed padded COM body installs a target four bytes before its handler.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1080
  size_max: 65536

composite_rules:
  - id: dos-resident-write-overwriter
    desc: DOS E9 write-filter and handler-chain code
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-e9-write-trigger
      - id: micro-behaviors/os/msdos/interrupt::dos-handler-chain-far-jump
