# Bind the search result in the default DTA to truncation and a write from
# the COM image at 0100h. NOP padding, body location, and copy length vary.
defaults:
  platforms: [windows]
  for: [dos_com, data]
  size_max: 65536
  attack: T1485

traits:
  - id: dos-search-truncate-self-image-code
    desc: DOS DTA truncation and self-image write
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      pattern: "B4 4E [0-8] CD 21 [0-2] B4 3C [0-2] 33 C9 [0-2] BA 9E 00 [0-2] CD 21 [0-2] B7 40 [0-2] 93 [0-2] BA 00 01 [0-2] B9 ?? ?? [0-2] CD 21"

composite_rules:
  - id: dos-search-truncate-self-image
    desc: DOS truncates search result and writes itself
    crit: hostile
    conf: 0.99
    all:
      - id: dos-search-truncate-self-image-code
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write-xchg-bx

