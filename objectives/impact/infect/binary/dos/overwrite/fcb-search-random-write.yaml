defaults:
  platforms: [windows, unix]
  for: [dos_com]
  attack: T1055,T1574

traits:
  - id: dos-fcb-search-and-random-write
    desc: DOS code searches and writes FCB records
    crit: notable
    if:
      type: yara
      source: |
        rule dos_fcb_search_and_random_write {
          strings:
            $first = { B4 11 [0-8] CD 21 }
            $next = { B4 12 [0-8] CD 21 }
            $write = { B4 28 [0-12] CD 21 }
          condition:
            all of them
        }

composite_rules:
  - id: dos-resident-fcb-file-infection
    desc: DOS resident code searches and modifies host files
    crit: hostile
    conf: 0.97
    all:
      - id: dos-fcb-search-and-random-write
      - id: micro-behaviors/os/msdos/interrupt::dos-set-int21-vector
      - id: objectives/impact/infect/binary/dos/file::dos-host-restore-trampoline
