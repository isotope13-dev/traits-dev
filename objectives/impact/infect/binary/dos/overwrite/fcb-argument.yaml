# FCB-era overwriter: AH=1Ah points the DTA at the image (SI=0100h), AH=0Fh
# opens the file named by the command-line FCB at 005Ch, and AH=15h writes
# the next record from the DTA, i.e. the program's own bytes land in the
# named file. The sequence is only a few bytes, so it is evaluated as YARA on
# images under the engine's size floor.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1485
  size_max: 65536

traits:
  - id: dos-fcb-argument-open-write-image
    desc: DOS FCB opens argument, writes image
    crit: suspicious
    conf: 0.93
    if:
      type: yara
      source: |
        rule dos_fcb_argument_open_write_image {
          meta:
            filetypes = "dos_com,data"
          strings:
            $seq = { B4 1A 8B D6 CD 21 B4 0F BA 5C 00 CD 21 B4 15 CD ?? }
          condition:
            $seq in (0..8)
        }

composite_rules:
  - id: dos-fcb-argument-image-overwriter
    desc: DOS COM writes its image into the argument file
    crit: hostile
    conf: 0.93
    size_max: 512
    all:
      - id: dos-fcb-argument-open-write-image
      - id: micro-behaviors/os/msdos/interrupt::dos-set-dta-from-si
      - id: micro-behaviors/os/msdos/interrupt::dos-fcb-open-command-line-file
