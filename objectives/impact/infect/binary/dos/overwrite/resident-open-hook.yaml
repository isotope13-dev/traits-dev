# Resident open-and-overwrite path: a resident hook intercepts INT 21h AH=3Dh
# (open file) and overwrites the opened file with the COM executable image
# from CS:0100h.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1080
  size_max: 65536

composite_rules:
  - id: dos-resident-open-overwriter
    desc: DOS resident handler overwrites files on open
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-open-filter-trigger
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write-com-image-ah
    any:
      - id: micro-behaviors/os/msdos/interrupt::dos-tsr-keep-int27
      - id: micro-behaviors/os/msdos/interrupt::dos-tsr-keep-int21
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-vector-get-then-set
      - id: micro-behaviors/os/msdos/interrupt::dos-set-int21-call
    needs: 1
