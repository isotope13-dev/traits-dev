defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 512
  attack: T1027,T1565

traits:
  - id: tiny-dos-dta-self-image-overwrite
    desc: Tiny DOS code overwrites found file
    crit: hostile
    conf: 0.97
    if:
      type: yara
      source: |
        rule tiny_dos_dta_self_image_overwrite {
          strings:
            $code = { 91 B4 4E BA ?? ?? CD 21 B8 ( 01 | 02 ) 3D BA 9E 00 CD 21 93 87 ( D6 | F2 ) B4 40 B1 ?? CD 21 C3 }
          condition:
            $code at 0
        }
