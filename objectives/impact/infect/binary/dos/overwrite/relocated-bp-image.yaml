# The default DTA filename is opened for update; the returned handle is
# used to overwrite it from 0100h, then closed. Find-next jumps back to
# the same checked search interrupt. BP supplies the relocated image's
# length through subtraction, rather than an immediate specimen size.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data, html]
  size_max: 65536
  attack: T1080

traits:
  - id: dos-bp-sized-search-image-overwrite
    desc: DOS overwrites enumerated files with its image
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      pattern: "5D B4 4E B9 ?? ?? 8B D5 83 EA ?? CD 21 73 05 B8 00 4C CD 21 B8 02 3D BA 9E 00 CD 21 93 8B CD 83 E9 ?? FE CD 83 E9 ?? 33 D2 FE C6 B4 40 CD 21 B4 3E CD 21 B4 4F EB D4"

composite_rules:
  - id: dos-hidden-mask-search-self-overwriter
    desc: DOS self-overwrite loop with concealed COM wildcard
    crit: hostile
    conf: 0.99
    all:
      - id: dos-bp-sized-search-image-overwrite
      - id: micro-behaviors/data/decode/xor::dos-call-relative-com-mask-decode
