# Tiny DOS search-and-overwrite file infectors (Trivial and related classes).
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1080
  size_min: 16
  size_max: 65536

traits:
  - id: objectives/impact/infect/binary/dos/overwrite::dos-com-tiny-search-overwriter
    desc: DOS searches files and writes over match
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: "B4 4E BA ?? ?? CD 21 B8 02 3D BA 9E 00 CD 21 93 B4 40 49 CD 21"
      offset: 0
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # Search-and-overwrite layouts, in alternative order after the first four:
  #  5. Get DTA (AH=2Fh) pointer: MOV SI,BX / LEA DX,[SI+1Eh] opens the match
  #     for update, then AH=40h writes the image from 0100h.
  #  6. Mask pointer loaded into DX before AH=4Eh; handle kept with MOV BX,AX.
  #  7. JC skips a failed find-first and DX=009Eh is loaded before the open.
  #  8. The opened file is rewound (CWD, AH=42h) before CL bytes are written
  #     from DX=0100h (DH=1).
  #  9. DX=009Eh is loaded before the open, then DX=0100h before the write,
  #     and the handle is closed (AH=3Eh) right after.
  # 10. Write-only open (3D01h) with DX=009Eh set first; the byte count comes
  #     from DEC CX before the write from DX=0100h.
  # 11. Write-only open with a CX byte count, then close (AH=3Eh), find-next
  #     (AH=4Fh) and a JNC loop back to the next match.
  # 12. Find-first with a failed-search JNC/RET, the mask stored in line, a
  #     read-write open (3D02h), close and a JMP-back find-next loop.
  # 13. XCHG CX,AX / MOV AH,4Eh start; the open handle is exchanged and the
  #     image address taken from SI (XCHG DX,SI) before the CL-count write.
  # 14. CX cleared and the mask loaded with LEA DX before find-first; the
  #     image is written from LEA DX,[0100h], then the file is closed and the
  #     program ends with INT 20h (no find-next).
  # 15. Like the second layout but the byte count comes from DEC CX placed
  #     between DX=0100h and the write interrupt.
  # 16. DX=009Eh before the 3D02h open and no byte-count load before the
  #     write from DX=0100h (CX left over); the program returns with RET.
  # 17. Like layout 11 but a JC skips a failed find-first and a JMP (not JNC)
  #     closes the find-next loop.
  # 18. CX cleared before find-first with a JC skip; write-only open, CL byte
  #     count, close, find-next and a JMP back to the search.
  # 19. Read-write open, DX=0100h then AH=40h with a CL count, close, and INT 20h
  #     (no find-next loop).
  # 20. MOV CX,CX filler after AH=4Eh; read-write open, DX=0100h and a CX
  #     count before the write, close, INT 20h.
  # 21. Read-write open with DX=009Eh first, handle moved with MOV BX,AX, a CX
  #     count and DX=0100h before AH=40h, close, find-next and a JMP back.
  # 22. Write-only open (3D01h) after AX=3D01h with DX=009Eh second; DEC CX
  #     gives the count and the program returns with RET.
  # 23. Entry mask followed by MOV DH,1 and a write-only open; XCHG DX,CX
  #     supplies the buffer and count before the AH=40h write.
  # 24. Mask pointer and write buffer both come from CX (MOV DX,CX): find-first,
  #     read-write open at DX=009Eh, handle exchange, write, RET.
  # 25. XCHG CX,AX start; the mask address is rebased to the DTA name with
  #     ADD DX before a read-write open, the handle low byte is copied to DL,
  #     the handle is seeked (AH=42h) and CL/DH give the write count, RET.
  # 26. Mask pointer loaded into DX before find-first (CX untouched); a write-only
  #     open at DX=009Eh, a CX byte count, write from 0100h, close and RET.
  # 27. CX raised by 0100h and saved with PUSH CX; find-first with CX cleared,
  #     read-write open, handle copied with PUSH AX / POP BX, the file rewound
  #     (AH=42h, offset 0), then CX restored as the write count and RET.
  # 28. AH=4Eh with CX loaded as zero and the mask address in DX; AH=3Dh with
  #     AL=02h as a separate load, a CX byte count, write from 0100h, close,
  #     and a program end with INT 20h.
  # 29. Like layout 5 with the DTA pointer copied by MOV SI,BX (8B F3 encoding)
  #     before the LEA DX,[SI+1Eh] open.
  # 30. DX=009Eh before the 3D02h open; after the handle exchange XCHG DX,AX /
  #     INC DH builds the 0100h buffer, then write (CX set at the search),
  #     close and INT 20h.
  # 31. Like layout 5 but LEA DX,[SI+1Eh] comes before MOV AX,3D02h, and the
  #     count (CX) and buffer (DX=0100h) are loaded before AH=40h.
  # 32. Mask in DX, CX cleared before AH=4Eh find-first; AL=02h then DX=009Eh
  #     before AH=3Dh open, CX count and DX=0100h before AH=40h write, and close.
  - id: objectives/impact/infect/binary/dos/overwrite::dos-com-trivial-search-overwriter
    desc: DOS searches and overwrites DTA match
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: "(B4 4E [0-6] CD 21 B8 02 3D BA 9E 00 CD 21 [0-8] BA 00 01 B4 40 CD 21|B4 4E [0-6] CD 21 B8 02 3D BA 9E 00 CD 21 [0-8] B4 40 [0-4] BA 00 01 CD 21|B4 4E [0-6] CD 21 B8 01 3D BA 9E 00 CD 21 [0-8] B4 40 [0-8] CD 21|91 B4 4E [0-6] CD 21 B8 01 3D BA 9E 00 CD 21 [0-8] B4 40 [0-8] CD 21|B4 4E [0-6] CD 21 72 ?? B4 2F CD 21 89 DE B8 02 3D 8D 54 1E CD 21 93 B4 40 [0-4] BA 00 01 CD 21|BA ?? ?? B4 4E CD 21 BA 9E 00 B8 01 3D CD 21 8B D8 B4 40 [0-4] BA 00 01 CD 21|B4 4E [0-6] CD 21 72 ?? BA 9E 00 B8 02 3D CD 21 93 B4 40 [0-6] BA 00 01 CD 21|B4 4E [0-4] CD 21 [0-2] B2 9E B8 02 3D CD 21 93 99 B4 42 CD 21 B4 40 B1 ?? B6 01 CD 21|B4 4E [0-6] CD 21 BA 9E 00 B8 02 3D CD 21 93 BA 00 01 B4 40 CD 21 B4 3E CD 21|B4 4E [0-6] CD 21 BA 9E 00 B8 01 3D CD 21 93 B4 40 49 BA 00 01 CD 21|B4 4E [0-6] CD 21 BA 9E 00 B8 01 3D CD 21 93 B4 40 B9 ?? ?? BA 00 01 CD 21 B4 3E CD 21 B4 4F CD 21 73 ?? C3|B4 4E BA ?? ?? B1 ?? CD 21 73 ?? C3 [4-8] B8 02 3D BA 9E 00 CD 21 93 BA 00 01 B1 ?? B4 40 CD 21 B4 3E CD 21 B4 4F EB ??|91 B4 4E BA ?? ?? CD 21 B8 02 3D BA 9E 00 CD 21 93 87 F2 B4 40 B1 ?? CD 21 C3|B4 4E 33 C9 8D 16 ?? ?? CD 21 B8 02 3D BA 9E 00 CD 21 93 B4 40 B9 ?? ?? 8D 16 00 01 CD 21 B4 3E CD 21 CD 20|B4 4E [0-6] CD 21 B8 02 3D BA 9E 00 CD 21 93 B4 40 BA 00 01 49 CD 21|B4 4E [0-6] CD 21 BA 9E 00 B8 02 3D CD 21 93 B4 40 BA 00 01 CD 21 C3|B4 4E [0-6] CD 21 72 ?? BA 9E 00 B8 01 3D CD 21 93 B4 40 B9 ?? ?? BA 00 01 CD 21 B4 3E CD 21 B4 4F CD 21 EB ??|B4 4E 33 C9 CD 21 72 ?? BA 9E 00 B8 01 3D CD 21 93 B4 40 B1 ?? BA 00 01 CD 21 B4 3E CD 21 B4 4F EB ?? C3|B4 4E [0-6] CD 21 B8 02 3D BA 9E 00 CD 21 93 BA 00 01 B4 40 B1 ?? CD 21 B4 3E CD 21 CD 20|B4 4E [0-6] CD 21 BA 9E 00 B8 02 3D CD 21 8B D8 B9 ?? ?? BA 00 01 B4 40 CD 21 B4 3E CD 21 B4 4F EB ??|B4 4E [0-6] CD 21 B8 01 3D BA 9E 00 CD 21 93 B4 40 49 BA 00 01 CD 21 C3|B4 4E B6 01 CD 21 B8 01 3D BA 9E 00 CD 21 93 B4 40 87 D1 CD 21 C3|B4 4E 8B D1 CD 21 BA 9E 00 B8 02 3D CD 21 93 B4 40 8B D1 CD 21 C3|B4 4E 89 C9 BA ?? ?? CD 21 B8 02 3D BA 9E 00 CD 21 93 B4 40 BA 00 01 B9 ?? ?? CD 21 B4 3E CD 21 CD 20|91 BA ?? ?? B4 4E CD 21 81 C2 ?? ?? B8 02 3D CD 21 93 8A D0 B4 42 CD 21 B4 40 B1 ?? B6 01 CD 21 C3|BA ?? ?? B4 4E CD 21 BA 9E 00 B8 01 3D CD 21 93 B4 40 B9 ?? ?? BA 00 01 CD 21 B4 3E CD 21 C3|B4 4E [0-6] CD 21 72 ?? B4 2F CD 21 8B F3 B8 02 3D 8D 54 1E CD 21 93 B4 40 [0-4] BA 00 01 CD 21|B4 4E [0-6] CD 21 BA 9E 00 B8 02 3D CD 21 93 92 FE C6 B4 40 CD 21 B4 3E CD 21 CD 20|B4 4E [0-6] CD 21 72 ?? B4 2F CD 21 89 DE 8D 54 1E B8 02 3D CD 21 93 B9 ?? ?? BA 00 01 B4 40 CD 21|81 C1 00 01 51 BA ?? ?? 33 C9 B4 4E CD 21 B8 02 3D BA 9E 00 CD 21 50 5B B8 00 42 2B D2 CD 21 B4 40 59 BA 00 01 CD 21 C3|B4 4E B9 00 00 BA ?? ?? CD 21 B4 3D B0 02 BA 9E 00 CD 21 93 B4 40 B9 ?? ?? BA 00 01 CD 21 B4 3E CD 21 CD 20|BA ?? ?? 33 C9 B4 4E CD 21 [0-4] B0 02 BA 9E 00 B4 3D CD 21 93 B9 ?? ?? BA 00 01 B4 40 CD 21 B4 3E CD 21|2A 2E 2A 00 91 B4 4E 8B D6 CD 21 72 ?? B8 02 3D BA 9E 00 CD 21 93 B4 3F [0-8] CD 21 38 7C ?? 74 ?? [0-4] B8 00 42 99 33 C9 CD 21 8B D6 59 B4 40 CD 21 B4 4F EB|B4 4E [0-6] CD 21 [0-4] 33 C9 B8 02 3C CD 21 93 B4 40 [0-4] BA 00 01 CD 21|B4 4E [0-6] CD 21 [0-4] B8 02 3D BA 9E 00 CD 21 93 B8 00 42 [0-6] CD 21 B4 40 [0-6] BA 00 01 CD 21)"
      offset_range: [0, 8]
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # Mask-first form: MOV DX,mask / AH=4Eh find-first, open the DTA name
  # (AH=3Dh, DX=009Eh), XCHG AX,BX for the handle, then the "*.*" mask sits
  # in the instruction stream before AH=40h and a short JMP back to INT 21h.
  - id: objectives/impact/infect/binary/dos/overwrite::dos-com-mask-first-search-overwriter
    desc: DOS mask-first search, open and write loop
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: "BA ?? ?? B4 4E CD 21 BA 9E 00 B4 3D CD 21 93 [0-6] 2A 2E 2A 00 [0-4] B4 40 EB"
      offset: 0
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # Entry-mask form: the "*.*" mask is the first image bytes (harmless when
  # run as code), CX carries the buffer pointer through find-first and the
  # DTA-name open (POP DX restores it), and a few bytes of filler sit between
  # the open and XCHG AX,BX / AH=40h / INT 21h / RET. A second form sets
  # DX from SI (PUSH SI / POP DX, optionally after XCHG CX,AX) and swaps SI
  # into DX after the open, with an optional CL byte count before the write.
  - id: objectives/impact/infect/binary/dos/overwrite::dos-com-entry-mask-search-overwriter
    desc: DOS entry-mask search, open and write
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: "2A 2E 2A 00 (51 8B D1|41 56 5A|91 56 5A) B4 4E CD 21 (BA 9E 00 B8 02 3D|B8 02 3D BA 9E 00) CD 21 (5A [0-12] 93|93 87 D6) B4 40 [0-2] CD 21 C3"
      offset: 0
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # Entry-mask loop form: the "*.*" mask opens the image, find-first sets
  # AH=4Eh, the DTA name is opened for write or update (3D01h or 3D02h, DX=009Eh), and the
  # handle is exchanged into BX before AH=40h with a short JMP back to the
  # interrupt, so the same write repeats for each match. Written as YARA so
  # the sequence is evaluated on images under the engine's size floor.
  - id: objectives/impact/infect/binary/dos/overwrite::dos-com-entry-mask-loop-overwriter
    desc: DOS entry mask, open and write loop
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule dos_com_entry_mask_loop_overwriter {
          meta:
            filetypes = "dos_com,data"
          strings:
            $loop = { 2A 2E 2A 00 B4 4E [0-4] CD 21 B8 ( 01 | 02 ) 3D BA 9E 00 CD 21 93 B4 40 EB }
            $call_ret = { 2A 2E ( 45 | 65 ) 2A B4 4E E8 00 00 8B D6 CD 21 B8 01 3D BA 9E 00 CD 21 93 B4 40 C3 }
            $read_seek = { 2A 2E 2A 00 [0-4] B4 4E [0-4] CD 21 [0-4] B8 02 3D BA 9E 00 CD 21 93 B4 3F [0-8] CD 21 [0-16] B8 00 42 [0-8] CD 21 [0-4] B4 40 CD 21 B4 4F EB }
          condition:
            $loop at 0 or $call_ret at 0 or $read_seek at 0
        }

  # Trailing-mask form: find-first with a mask stored after the code, open
  # the DTA name for update (3D02h, DX=009Eh), load the write service into BH
  # and XCHG AX,BX so AH=40h and the handle are set together, then write the
  # image from 0100h with a byte count in CL. Written as YARA so the
  # sequence is evaluated on images under the engine's size floor.
  - id: objectives/impact/infect/binary/dos/overwrite::dos-com-trailing-mask-image-overwriter
    desc: DOS trailing mask, open and image write
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule dos_com_trailing_mask_image_overwriter {
          meta:
            filetypes = "dos_com,data"
          strings:
            $seq = { B4 4E BA ?? ?? CD 21 B8 02 3D BA 9E 00 CD 21 B7 40 93 BA 00 01 B1 ?? CD 21 C3 2A 2E 2A 00 }
          condition:
            $seq at 0
        }

  # Fixed-name form: no search at all. The program opens a file whose name is
  # embedded in the image for update (3D02h), writes its own image from
  # DX=0100h with a CX count, closes it and terminates (4C00h). Pinned to the
  # first bytes of a tiny COM image.
  - id: objectives/impact/infect/binary/dos/overwrite::dos-com-fixed-name-self-image-write
    desc: DOS opens fixed name, writes own image
    crit: suspicious
    conf: 0.93
    size_max: 512
    if:
      type: hex
      pattern: "B8 02 3D BA ?? ?? CD 21 8B D8 B4 40 B9 ?? ?? BA 00 01 CD 21 B4 3E CD 21 B8 00 4C CD 21"
      offset: 0
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # Entry-mask form that saves CX on the stack: the "*.*" mask opens the
  # image, PUSH CX / MOV AH,4Eh / XCHG CX,DX run find-first, the DTA name is
  # opened for update, the handle is exchanged into BX, and DEC CX / POP DX
  # set the count and buffer before the AH=40h write and RET. Written as YARA
  # so the sequence is evaluated on images under the engine's size floor.
  - id: objectives/impact/infect/binary/dos/overwrite::dos-com-entry-mask-stack-cx-overwriter
    desc: DOS entry mask with stacked CX overwrite
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule dos_com_entry_mask_stack_cx_overwriter {
          meta:
            filetypes = "dos_com,data"
          strings:
            $seq = { 2A 2E 2A 00 51 B4 4E 87 D1 CD 21 B8 02 3D BA 9E 00 CD 21 93 B4 40 49 5A CD 21 C3 }
          condition:
            $seq at 0
        }

  - id: objectives/impact/infect/binary/dos/overwrite::dos-com-argument-overwriter-code
    desc: DOS COM argument file overwrite sequence
    crit: notable
    conf: 0.98
    if:
      type: hex
      # XCHG DX,SI has two encodings (D6/F2); the copy length may be loaded
      # into CL before the write.
      pattern: "8A 1E 80 00 C6 87 81 00 00 (B8 02 3D BA 82 00|BA 82 00 B8 02 3D) CD 21 93 87 (D6|F2) B4 40 [0-2] CD 21"
      offset: 0
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # Mask-first search that opens the first match: MOV DX,mask / AH=4Eh, then
  # the DTA name (DX=009Eh) is opened with AH=3Dh and the handle exchanged
  # into BX. Tiny COM infectors start this way; the write may follow or may
  # be missing from a damaged copy, so the atom alone claims only the open.
  - id: objectives/impact/infect/binary/dos/overwrite::dos-com-mask-first-search-open-match
    desc: DOS mask-first search then opens DTA match
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "BA ?? ?? B4 4E CD 21 BA 9E 00 B4 3D CD 21 93"
      offset: 0
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # Resident INT 21h hook services are aliased through another interrupt to
  # avoid recursing into the hook. This handler intercepts COM opens/execs,
  # checks the extension, opens the target for update, skips its marker, then
  # seeks to EOF and writes a jump stub followed by the resident image.
  - id: objectives/impact/infect/binary/dos/overwrite::dos-com-resident-open-hook
    desc: DOS hook intercepts COM opens and execution
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: "9C 50 53 51 52 06 1E 57 56 FB 80 FC 3D 74 ?? 3D 00 4B 74 ?? E9 ?? ?? 8B FA 8A 25 47 80 FC 2E 75 ?? 80 3D 43 74 ?? 80 3D 63 74 ?? E9 ?? ?? 80 7D 01 4F 74 ?? 80 7D 01 6F 74 ?? E9 ?? ?? 80 7D 02 4D 74 ?? 80 7D 02 6D 74 ?? E9 ?? ??"

  - id: objectives/impact/infect/binary/dos/overwrite::dos-com-resident-open-hook-appender
    desc: DOS COM hook appends marked body
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: "B8 01 43 33 C9 CD ?? B8 02 3D CD ?? 8B D8 0E 1F BA ?? ?? B9 07 00 B4 3F CD ?? 2E 81 3E ?? ?? 44 54 ?? ?? ?? ?? ?? B8 00 57 CD ?? 2E 89 0E ?? ?? 2E 89 16 ?? ?? 33 C9 33 D2 B8 02 42 CD ?? 8B F8 3D ?? ?? 76 ?? EB ?? ?? B8 00 42 CD ?? 2E C6 06 ?? ?? BD 8B C7 05 00 01 2E A3 ?? ?? 2E C7 06 ?? ?? FF E5 2E C7 06 ?? ?? 44 54 BA ?? ?? B9 07 00 B4 40 CD ?? 33 C9 33 D2 B8 02 42 CD ?? B9 ?? ?? B4 40 CD ??"

  # CWD clears DX and DL=9Eh selects the default-DTA name. The following
  # read checks whether the host already begins with this virus image.
  - id: dos-com-63b-dta-marker-read
    desc: DOS opens DTA file and checks marker
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: "B8 02 3D 99 B2 9E CD 21 93 B4 3F [0-12] 80 3E ?? ?? 91"
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # Add the body length, seek to offset 0, write that many bytes
  # from SI, then FindNext.
  - id: dos-com-marker-prepend-find-next
    desc: DOS prepends body then finds next
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: "05 ?? 00 [0-2] 50 (31|33) C9 F7 E1 B4 42 CD 21 (8B D6|89 F2) 59 B4 40 CD 21 B4 4F EB"
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # CWD plus DL=9Eh opens the DTA name, a read follows, then CMP [SI+disp],DL
  # skips a host that already carries the marker.
  - id: dos-mini-dta-read-marker
    desc: DOS reads DTA host and checks marker
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: "B8 02 3D 99 B2 9E CD 21 93 B4 3F [0-10] CD 21 38 ?? ?? 74"
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # INC AH bumps the read length, seek to 0, write from SI, then FindNext.
  - id: dos-mini-seek-write-find-next
    desc: DOS seeks then writes and finds next
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: "FE C4 50 33 C9 F7 E1 B4 42 CD 21 89 F2 59 B4 40 CD 21 B4 4F EB"
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # Read attributes (AH=43, DX=009Eh), clear them (4301h, CL=0), then open
  # the same DTA name write-only (3D01h).
  - id: dos-dta-attr-clear-write-open
    desc: DOS clears DTA attributes then opens
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: "(B4 43|B8 00 43) [0-4] BA 9E 00 CD 21 [0-8] (B8 01 43|B4 43 B0 01) [0-6] CD 21 [0-4] B8 01 3D [0-4] CD 21"
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # Get DTA (AH=2Fh), set the name at [SI+1Eh] to attribute 0 (AX=4301h),
  # then open that same name read/write (AX=3D02h).
  - id: dos-dta-pointer-attr-clear-open
    desc: Clears attributes through the DTA pointer
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: "B4 2F CD 21 [0-6] B8 01 43 [0-6] 8D 54 1E CD 21 [0-6] B8 02 3D CD 21"
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # Write the 0100h image, close the handle, and FindNext.
  - id: dos-image-write-close-find-next
    desc: DOS writes image then finds next
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: "(B4 40 [0-4] BA 00 01 [0-6] CD 21 [0-4] B4 3E CD 21 [0-16] B4 4F [0-2] EB|B4 40 [0-4] BA 00 01 [0-6] CD 21 [0-4] B4 3E CD 21 [0-16] B4 4F [0-2] 73|B4 40 [0-4] BA 00 01 [0-6] CD 21 [0-4] B4 3E CD 21 [0-16] B4 4F [0-2] 72|B4 40 [0-4] 2B D2 FE C6 [0-6] CD 21 [0-4] B4 3E CD 21 [0-16] B4 4F [0-2] EB|B4 40 [0-4] 2B D2 FE C6 [0-6] CD 21 [0-4] B4 3E CD 21 [0-16] B4 4F [0-2] 73|B4 40 [0-4] 2B D2 FE C6 [0-6] CD 21 [0-4] B4 3E CD 21 [0-16] B4 4F [0-2] 72|BA 00 01 [0-4] B4 40 [0-6] CD 21 [0-4] B4 3E CD 21 [0-16] B4 4F [0-2] EB|BA 00 01 [0-4] B4 40 [0-6] CD 21 [0-4] B4 3E CD 21 [0-16] B4 4F [0-2] 73|BA 00 01 [0-4] B4 40 [0-6] CD 21 [0-4] B4 3E CD 21 [0-16] B4 4F [0-2] 72|2B D2 FE C6 [0-4] B4 40 [0-6] CD 21 [0-4] B4 3E CD 21 [0-16] B4 4F [0-2] EB|2B D2 FE C6 [0-4] B4 40 [0-6] CD 21 [0-4] B4 3E CD 21 [0-16] B4 4F [0-2] 73|2B D2 FE C6 [0-4] B4 40 [0-6] CD 21 [0-4] B4 3E CD 21 [0-16] B4 4F [0-2] 72)"
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # Open the DTA name, read a short prefix, skip when it matches, otherwise
  # seek to the start and overwrite the host with the image from 0100h.
  # YARA so a short COM image is still scanned. The write ends in RET.
  - id: dos-marker-seek-zero-image-write
    desc: DOS rewinds unmarked host then overwrites
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule dos_marker_seek_zero_image_write {
          meta:
            filetypes = "dos_com,data"
          strings:
            $seq = { B8 02 3D BA 9E 00 CD 21 8B D8 B4 3F [0-8] CD 21 [0-8] 74 ?? B8 00 42 [0-8] CD 21 B4 40 [0-6] BA 00 01 CD 21 C3 }
          condition:
            $seq
        }
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # Already-infected branch: close the handle, find the next match, and
  # leave the search when AL is nonzero.
  - id: dos-close-find-next-skip
    desc: DOS closes infected host and finds next
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        rule dos_close_find_next_skip {
          meta:
            filetypes = "dos_com,data"
          strings:
            $skip = { B4 3E CD 21 B4 4F CD 21 0A C0 75 ?? }
          condition:
            $skip
        }
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # ADD AX,prefix; SUB CX,CX; MUL CX forces seek-from-start; FindNext jumps
  # back to the shared INT 21h.
  - id: dos-mul-zero-seek-prefix-write
    desc: DOS zero-seek rewrites with prefix length
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: "05 ?? ?? [0-2] 50 (2B|33) C9 F7 E1 B4 42 CD 21 59 B4 40 [0-6] CD 21 [0-4] B4 4F EB"
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # MOV AH,3Fh / INC AH turns the next INT 21h into a write, then INT 20h
  # exits after one host.
  - id: dos-inc-ah-image-terminate
    desc: Increments AH so read becomes write
    crit: notable
    conf: 0.96
    if:
      type: yara
      source: |
        rule dos_inc_ah_image_terminate {
          strings:
            $w = { B4 3F FE C4 BA 00 01 B9 ?? ?? CD 21 CD 20 }
          condition:
            $w in (0..128)
        }
  - id: dos-find-then-rw-open-dta
    desc: Finds a file then opens it
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        rule dos_find_then_rw_open_dta {
          strings:
            $o = { B4 4E [0-8] CD 21 B8 02 3D BA 9E 00 CD 21 }
          condition:
            $o in (0..128)
        }
  - id: dos-print-then-find-first
    desc: Prints text then searches files
    crit: notable
    conf: 0.9
    if:
      type: yara
      source: |
        rule dos_print_then_find_first {
          strings:
            $p = { B4 09 [0-8] CD 21 [0-4] B4 4E [0-8] CD 21 }
          condition:
            $p in (0..128)
        }

  # Single-byte XOR hides find-first, an incremented key, and a write-only
  # open of the DTA name. The xor modifier recovers every key.
  - id: dos-xor-find-writeonly-open
    desc: XOR body write-opens found files
    crit: notable
    conf: 0.95
    size_max: 4096
    if:
      type: yara
      source: |
        rule dos_xor_find_writeonly_open {
          meta:
            filetypes = "dos_com,data"
          strings:
            $loop = { B9 ?? 00 BE 03 01 80 34 ?? 46 E2 FA }
          condition:
            for any i in (1..#loop) : (
              @loop[i] < 256 and
              uint8(@loop[i] + 8) ^ uint8(3) == 0xB4 and
              uint8(@loop[i] + 8) ^ uint8(4) == 0x4E and
              uint8(@loop[i] + 8) ^ uint8(5) == 0xBA and
              uint8(@loop[i] + 8) ^ uint8(7) == 0x01 and
              uint8(@loop[i] + 8) ^ uint8(8) == 0xCD and
              uint8(@loop[i] + 8) ^ uint8(9) == 0x21 and
              uint8(@loop[i] + 8) ^ uint8(12) == 0xFE and
              uint8(@loop[i] + 8) ^ uint8(13) == 0x06 and
              uint8(@loop[i] + 8) ^ uint8(16) == 0xBA and
              uint8(@loop[i] + 8) ^ uint8(17) == 0x9E and
              uint8(@loop[i] + 8) ^ uint8(18) == 0x00 and
              uint8(@loop[i] + 8) ^ uint8(19) == 0xB8 and
              uint8(@loop[i] + 8) ^ uint8(20) == 0x01 and
              uint8(@loop[i] + 8) ^ uint8(21) == 0x3D and
              uint8(@loop[i] + 8) ^ uint8(22) == 0xCD and
              uint8(@loop[i] + 8) ^ uint8(23) == 0x21
            )
        }
  # The write path calls back into the XOR loop, then writes CL bytes from 0100h.
  - id: dos-xor-reencrypt-image-write
    desc: XOR body reencrypts then writes image
    crit: notable
    conf: 0.95
    size_max: 4096
    if:
      type: yara
      source: |
        rule dos_xor_reencrypt_image_write {
          meta:
            filetypes = "dos_com,data"
          strings:
            $loop = { B1 ?? CD 21 B9 ?? 00 BE 03 01 80 34 ?? 46 E2 FA }
          condition:
            for any i in (1..#loop) : (
              @loop[i] < 256 and
              for any off in (3..48) : (
                off + 5 < @loop[i] and
                uint8(@loop[i] + 12) ^ uint8(off) == 0xB4 and
                uint8(@loop[i] + 12) ^ uint8(off + 1) == 0x40 and
                uint8(@loop[i] + 12) ^ uint8(off + 2) == 0xBA and
                uint8(@loop[i] + 12) ^ uint8(off + 3) == 0x00 and
                uint8(@loop[i] + 12) ^ uint8(off + 4) == 0x01 and
                uint8(@loop[i] + 12) ^ uint8(off + 5) == 0xE8
              )
            )
        }

  # XOR self-decrypting form (Trivial.82 class): a 9-byte stub at the
  # entry XORs the body in place with the key byte inside the stub
  # (80 34 <key>), so the find-first and open/write service sequences
  # only exist encrypted. The YARA legs bind the encoded bytes to that
  # same stub key instead of accepting an arbitrary XOR match.
  - id: dos-xor-encrypted-find-first-code
    desc: XOR-encrypted DOS find-first sequence
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule dos_xor_encrypted_find_first_code {
          meta:
            filetypes = "dos_com,data"
          strings:
            $stub = { BE ?? ?? 80 34 ?? 46 E2 ?? }
            $find = "\xb4\x4e\xba" xor(1-255)
          condition:
            $stub at 0 and
            for any i in (1..#find) : (
              @find[i] > @stub[1] and
              (uint8(@find[i]) ^ 0xb4) == uint8(@stub[1] + 5)
            )
        }
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  - id: dos-xor-encrypted-open-write-code
    desc: XOR-encrypted DOS open-write-retime sequence
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule dos_xor_encrypted_open_write_code {
          meta:
            filetypes = "dos_com,data"
          strings:
            $stub = { BE ?? ?? 80 34 ?? 46 E2 ?? }
            $write = "\xba\x9e\x00\xb8\x02\x3d\xcd\x21\xb7\x40\x93\xba\x00\x03\xb1\x52\xcd\x21\xb8\x01\x57\x33\xc9\xcd\x21" xor(1-255)
          condition:
            $stub at 0 and
            for any i in (1..#write) : (
              @write[i] > @stub[1] and
              (uint8(@write[i]) ^ 0xba) == uint8(@stub[1] + 5)
            )
        }
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

