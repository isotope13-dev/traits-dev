# COM overwriters rewind a found file and write their running image.
defaults:
  for:
  - dos_com
  - data
  platforms:
  - windows
  - unix
  attack: T1080
  size_max: 65536

traits:
  - id: dos-cwd-rewind-pusha-image-write
    desc: DOS rewinds file and writes image
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: "B8 00 42 [0-8] (33|31) C9 [0-2] 99 [0-2] CD 21 [0-6] B4 40 [0-4] (B9 ?? ?? BA 00 01|BA 00 01 B9 ?? ??) [0-4] 60 EB ?? [0-40] 61 CD 21"


composite_rules:
  - id: dos-searched-cwd-image-overwriter
    desc: DOS overwrites searched files with itself
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/search/command::dos-int21-find-first-call
      - id: micro-behaviors/fs/file/open::dos-int21-open-dta-filename
      - id: objectives/impact/infect/binary/dos/overwrite::dos-cwd-rewind-pusha-image-write
