# Compact word-load form (Trivial.101): the service number and access mode
# load as one MOV AX,3D02h, the buffer and length as single MOV DX,0100h /
# MOV CX,len loads, the handle moves with MOV BX,AX rather than XCHG, and
# every INT 21h carries a CS: segment-override prefix (2Eh) -- the [0-1]
# gaps absorb that one prefix byte wherever it appears. Sibling traits in
# this directory cover the split-register and XCHG spellings; this one is
# the remaining register spelling of the same open/write/close/find-next
# chain, not a specimen signature.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1080
  size_max: 65536

traits:
  - id: objectives/impact/infect/binary/dos/overwrite::dos-dta-self-overwrite-word-load
    desc: DOS overwrites DTA file with COM image
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: "B8 02 3D [0-1] BA 9E 00 [0-1] CD 21 [0-2] 8B D8 [0-1] B4 40 [0-1] BA 00 01 [0-1] B9 ?? ?? [0-1] CD 21 [0-1] B4 3E [0-1] CD 21 [0-1] B4 4F"
      offset_range: [0, 4096]

composite_rules:
  - id: dos-exe-search-self-overwriter
    desc: DOS overwrites each EXE match with itself
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/search/command::dos-executable-compatible-wildcard
      - id: micro-behaviors/fs/search/command::dos-int21-find-first
      - id: objectives/impact/infect/binary/dos/overwrite::dos-dta-self-overwrite-word-load
