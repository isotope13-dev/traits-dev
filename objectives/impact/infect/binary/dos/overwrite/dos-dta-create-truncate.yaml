# DOS create (AH=3Ch) on a name that find-first just returned in the DTA
# opens it truncated to zero length. A tiny image that runs find-first and
# then creates the DTA filename destroys every matched file's contents, even
# when the write that should follow is broken. Written as YARA so the
# sequence is evaluated on images under the engine's size floor.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1485
  size_max: 65536

traits:
  - id: dos-find-first-then-dta-create
    desc: DOS find-first then create of DTA name
    crit: suspicious
    conf: 0.92
    if:
      type: yara
      source: |
        rule dos_find_first_then_dta_create {
          meta:
            filetypes = "dos_com,data"
          strings:
            $seq = { B4 4E BA ?? ?? [0-4] CD 21 [0-4] B4 3C BA 9E 00 CD 21 }
            $mask_first = { BA ?? ?? B4 4E CD 21 [0-4] BA 9E 00 B4 3C CD 21 }
            // Duplicate MOV AH/DX and a cancelling pair may sit between the
            // real find-first, DTA create, and interrupt.
            $padded = { BA ?? ?? [0-4] B4 4E [0-4] CD 21 [0-6] BA 9E 00 [0-4] B4 3C [0-8] CD 21 }
            $direct = { B4 4E [0-6] CD 21 [0-8] ( B4 3C | B8 ?? 3C ) CD 21 }
          condition:
            $seq in (0..24) or $mask_first in (0..24) or $padded in (0..24) or $direct in (0..32)
        }

composite_rules:
  - id: dos-tiny-search-truncates-matches
    desc: Tiny DOS image truncates files found by search
    crit: hostile
    conf: 0.93
    size_max: 512
    all:
      - id: dos-find-first-then-dta-create
      - id: micro-behaviors/fs/search::dos-int21-find-first-call
  - id: dos-truncated-match-image-rewrite
    desc: Truncated DOS match rewritten from image
    crit: hostile
    conf: 0.96
    size_max: 512
    all:
      - id: dos-find-first-then-dta-create
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write-xchg-bx
