defaults:
  for: [dos_com, data]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-three-byte-entry-rewrite-setup
    desc: DOS prepares three-byte entry rewrite
    crit: notable
    if:
      type: hex
      pattern: 'BA ?? ?? B4 3F B9 03 00 51 E8 ?? ?? E8 ?? ?? E8 ?? ?? BA ?? ?? B4 40 59 E8 ?? ??'

composite_rules:
  - id: dos-resident-exec-entry-rewrite
    desc: DOS resident execution hook prepares an executable entry rewrite
    crit: hostile
    near_bytes: 1024
    all:
      - id: micro-behaviors/os/msdos/memory::dos-direct-ivt-int21-write
      - id: micro-behaviors/os/msdos/interrupt::dos-exec-service-compare
      - id: micro-behaviors/data/parse/executable-header::dos-mz-signature-compare
      - id: dos-three-byte-entry-rewrite-setup
