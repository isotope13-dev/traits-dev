defaults:
  for: [dos_com, data]
  platforms: [windows, unix]
  size_max: 65536

traits:
  # Construct an E9 entry jump using the saved file length minus its own
  # three-byte instruction length, then select that header for writing.
  - id: dos-com-length-jump-buffer
    desc: Builds COM entry jump from file length
    crit: notable
    if:
      type: hex
      pattern: 'C6 05 E9 A1 ?? ?? 2D 03 00 89 45 01 B9 03 00'

  - id: dos-three-byte-entry-rewrite-setup
    desc: DOS prepares three-byte entry rewrite
    crit: notable
    if:
      type: hex
      pattern: 'BA ?? ?? B4 3F B9 03 00 51 E8 ?? ?? E8 ?? ?? E8 ?? ?? BA ?? ?? B4 40 59 E8 ?? ??'

composite_rules:
  - id: dos-resident-hook-com-length-jump
    desc: DOS resident file hook appends code and redirects COM entry
    crit: hostile
    attack: T1080
    all:
      - id: dos-com-length-jump-buffer
      - id: objectives/impact/infect/binary/dos/file::dos-seek-append-near-call-infector
      - id: micro-behaviors/os/msdos/interrupt::dos-set-int21-vector
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-open-filter-trigger

  - id: dos-resident-exec-entry-rewrite
    desc: DOS resident execution hook prepares an executable entry rewrite
    crit: hostile
    near_bytes: 1024
    all:
      - id: micro-behaviors/os/msdos/memory::dos-direct-ivt-int21-write
      - id: micro-behaviors/os/msdos/interrupt::dos-exec-service-compare
      - id: micro-behaviors/data/parse/executable-header::dos-mz-signature-compare
      - id: dos-three-byte-entry-rewrite-setup
