defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  # Seek to end of the open file, then write a resident image from DS:DX.
  - id: seek-end-write-image
    desc: Seeks to end and writes DOS image
    crit: notable
    if:
      type: hex
      pattern: 'B8 02 42 33 C9 33 D2 CD 21 BA ?? ?? B9 ?? ?? B4 40 CD 21'

composite_rules:
  - id: resident-exec-seek-write
    desc: Resident DOS execution hook appends an image to files
    crit: hostile
    all:
      - id: seek-end-write-image
      - id: micro-behaviors/os/msdos/memory::dos-own-mcb-size-shrink
      - id: micro-behaviors/os/msdos/interrupt::dos-set-int21-vector
      - id: micro-behaviors/os/msdos/interrupt::dos-exec-service-compare
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-fcb-find-intercept
