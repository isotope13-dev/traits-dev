defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_min: 414
  size_max: 65536
  attack: T1574

traits:
  - id: dos-resident-copy-int21-vector
    desc: Copy code and replace DOS interrupt vector
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: 'B9 9E 01 90 FC F3 A4 CB BE 84 00 8D 3E 94 02 33 C0 8E D8 0E 07 A5 A5 8D 1E EB 01 89 1E 84 00 8C 0E 86 00'
  - id: dos-resident-filter-created-file-write
    desc: DOS hook filters file creation and writes
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: '80 FC 3C 74 5F 2E 80 3E 98 02 FF 74 51 80 FC 40 75 4C'
  - id: dos-resident-write-own-code
    desc: DOS hook writes its code to file
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: '8D 16 00 01 B9 9E 01 90 2E 81 2E 99 02 05 01 9C 2E FF 1E 94 02'

composite_rules:
  - id: dos-resident-file-write-prepending-infector
    desc: Resident DOS hook prepends code to created files
    crit: hostile
    conf: 0.99
    near_bytes: 512
    all:
      - id: dos-resident-copy-int21-vector
      - id: dos-resident-filter-created-file-write
      - id: dos-resident-write-own-code
