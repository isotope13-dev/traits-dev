# The resident routine is encoded by an additive layer, alternating word XOR,
# and a byte XOR. These byte sequences represent the observed encoded form.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: layered-add-decoder
    desc: DOS additive byte decoder loop
    crit: notable
    if:
      type: hex
      pattern: '26 8A 14 9C 0E BB ?? ?? 53 CF 80 C2 ?? 50 53 51 52 FA 83 C4 08 FB 26 88 14'

  - id: layered-resident-vector-copy
    desc: Encoded DOS resident vector setup
    crit: notable
    if:
      type: hex
      pattern: '9D AB F5 91 85 56 76 F8 8E F3 6E 79 25 26 6F AD E9 10 6B E4 13 08 FA 78 14 10 57 91 7A BC 36 F0 F3 26 5E F4 F8 28 F5 F6 6A E3'

  - id: layered-exec-intercept
    desc: Encoded DOS execution intercept
    crit: notable
    if:
      type: hex
      pattern: 'EF BA BA 61 8D CE 9D F4 9D A6 AD 49 85 62 E4 F3 58 B6 72 18 EF F8 CC 00 B8 31 72 DD 15 22 58 3E 70 96 FF'

  - id: layered-word-decoder
    desc: Encoded alternating word decoder
    crit: notable
    if:
      type: hex
      pattern: '23 70 3C 85 28 C7 84 FC 25 ED 84 FF FA 73 66 30 71 6F E3 74 A4 85 10 5A 72 A4 85 00 FF F8 73 F2 5D 71 F2 58 71 E4 53'

  - id: layered-host-rewrite
    desc: Encoded DOS host rewrite sequence
    crit: notable
    if:
      type: hex
      pattern: 'DE D4 22 E1 02 29 A6 85 23 38 AC 7D B0 84 CE C1 F2 E1 20 9D B0 75 2C 86 F5 57 2C 6F DE E8'

composite_rules:
  - id: layered-resident-exec-infector
    desc: Layered DOS infector installs a resident execution hook
    crit: hostile
    attack: T1027
    all:
      - id: layered-add-decoder
      - id: layered-word-decoder
      - id: layered-resident-vector-copy
      - id: layered-exec-intercept
      - id: layered-host-rewrite
