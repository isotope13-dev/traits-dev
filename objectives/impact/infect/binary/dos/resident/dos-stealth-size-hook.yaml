defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_min: 5976
  size_max: 65536
  attack: T1574,T1564

traits:
  - id: dos-stealth-int21-vector-replacement
    desc: DOS code replaces interrupt vector
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: '33 DB 8E DB B3 84 B8 D1 01 87 07 2E 89 44 09 2E 89 44 0D'
  - id: dos-stealth-hide-appended-file-size
    desc: DOS hook hides appended file length
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'B4 2F E8 95 02 26 8B 47 18 D0 EC 80 FC 64 72 DF 26 81 6F 1A 58 17'
  - id: dos-stealth-filter-file-services
    desc: DOS hook filters file services
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: '80 FC 4E 74 B7 80 FC 4F 74 B2 80 FC 40 74 1B 3D 02 42'

composite_rules:
  - id: dos-stealth-appended-code-size-hook
    desc: DOS interrupt hook hides appended code size
    crit: hostile
    conf: 0.99
    near_bytes: 512
    all:
      - id: dos-stealth-int21-vector-replacement
      - id: dos-stealth-hide-appended-file-size
      - id: dos-stealth-filter-file-services
