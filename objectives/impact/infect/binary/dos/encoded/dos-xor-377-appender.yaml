# The XOR key changes per infection. The encoded body searches for COM files,
# copies and encrypts itself, appends the copy, and rewrites the entry jump.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536
  crit: notable

traits:
  - id: xor-377-decoder
    desc: DOS 346-byte XOR decoder loop
    if:
      type: hex
      pattern: 'E8 00 00 5D 81 ED ?? ?? 8D B6 ?? ?? 56 8B 96 ?? ?? B9 5A 01 8B FE AC 32 C2 AA E2 FA C3'

  - id: xor-377-search
    desc: XOR-encoded DOS COM file search
    if:
      type: yara
      source: |
        rule xor_377_search {
          strings:
            $search = "\xB4\x4E\x33\xC9\x8D\x96\x96\x01\xCD\x21" xor(1-255)
          condition:
            $search
        }

  - id: xor-377-append-and-patch
    desc: XOR-encoded DOS append and entry write
    if:
      type: yara
      source: |
        rule xor_377_append_and_patch {
          strings:
            $append = "\xB4\x41\x80\xEC\x01\xBA\xBC\xFC\xB9\x79\x01\xCD\x21" xor(1-255)
            $patch = "\xB4\x30\x80\xC4\x10\xB9\x03\x00\x8D\x96\x90\x01\xCD\x21" xor(1-255)
          condition:
            all of them
        }

composite_rules:
  - id: xor-377-com-appender
    desc: XOR-obfuscated DOS virus appends to COM files and redirects entry
    crit: hostile
    attack: T1027,T1565.001
    near_bytes: 500
    all:
      - id: xor-377-decoder
      - id: xor-377-search
      - id: xor-377-append-and-patch
