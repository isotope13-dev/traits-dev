defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_max: 65536

traits:
  - id: dos-backward-subtract-decoder
    desc: DOS backward subtract decoder loop
    crit: notable
    if:
      type: hex
      pattern: 'BE ?? ?? 2E 80 2C B5 B9 ?? ?? 46 4E E2 FC 4E 81 FE ?? ?? 75 EE E9 ?? ??'
  - id: dos-subtract-encoded-vector-hooks
    desc: Encoded DOS interrupt vector hooks
    crit: notable
    if:
      type: hex
      pattern: 'AF E8 75 43 8D 1B 41 75 1B 76 95 C5 6D F1 B6 1B 3C BB 39 B5 1B DB 58 5F B6 1B 41 75 1B 76 95 C5 6D CC B6 1B 3C BB 71 B5'

composite_rules:
  - id: dos-subtract-resident-infector
    desc: Encoded DOS resident virus with interrupt hooks
    crit: hostile
    attack: T1080
    all:
      - id: dos-backward-subtract-decoder
      - id: dos-subtract-encoded-vector-hooks
      - id: metadata/binary/code/control-transfer::entry-near-jump-bytes
