# The key follows the 0x2d3-byte encrypted body. The decoded code checks
# COM extensions, constructs an E9 entry, and writes the appended copy.
defaults:
  for: [dos_com]
  platforms: [windows, unix]

traits:
  - id: byte-xor-resident-decoder
    desc: DOS byte XOR body decoder
    crit: notable
    if:
      type: hex
      pattern: 'FC 0E 1F 0E 07 B8 5E 03 50 BE 2D 01 8B FE BA 00 04 AC 32 06 00 04 AA 3B F2 75 F6 C3'

  - id: byte-xor-resident-infector-body
    desc: Encrypted DOS COM infection code
    crit: notable
    if:
      type: yara
      source: |
        rule dos_byte_xor_resident_infection_body {
          strings:
            $d = { FC 0E 1F 0E 07 B8 5E 03 50 BE 2D 01 8B FE BA 00 04 AC 32 06 00 04 AA 3B F2 75 F6 C3 }
          condition:
            for any i in (1..#d) : (
              (uint32(@d[i] + 0x7e) ^ (uint8(@d[i] + 0x2ef) * 0x01010101)) == 0x4dfe7c80 and
              (uint32(@d[i] + 0x1c3) ^ (uint8(@d[i] + 0x2ef) * 0x01010101)) == 0x0006fe2e and
              (uint32(@d[i] + 0x20a) ^ (uint8(@d[i] + 0x2ef) * 0x01010101)) == 0x00ba40b4 and
              (uint32(@d[i] + 0x21e) ^ (uint8(@d[i] + 0x2ef) * 0x01010101)) == 0x80ba40b4
            )
        }

composite_rules:
  - id: byte-xor-resident-com-infector
    desc: Encrypted DOS resident infector appends code and rewrites COM entry
    crit: hostile
    attack: T1027
    all:
      - id: byte-xor-resident-decoder
      - id: byte-xor-resident-infector-body
