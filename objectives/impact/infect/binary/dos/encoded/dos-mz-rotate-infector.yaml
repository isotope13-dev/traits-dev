# Polymorphic DOS MZ infector using a 16-bit word-rotate decryptor loop.
defaults:
  platforms: [windows, unix]
  for: [data]
  size_min: 512
  size_max: 65536

traits:
  - id: dos-mz-key-setup-stub
    desc: DOS MZ stub loads rotation key
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: '0E 8C D2 1F 8B FB 8B 0E 00 00 0E 5B BE'
      offset_range: [32, 512]

  - id: dos-word-rotate-decrypt-loop
    desc: DOS 16-bit word-rotate decryptor loop
    crit: suspicious
    conf: 0.93
    if:
      type: hex
      pattern: 'AD [0-4] D3 (C0 | C8) [0-4] 89 44 FE'
      offset_range: [32, 1024]

  - id: dos-decrypt-bounds-loop
    desc: Decryptor checks end offset and loops
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: 'FC 81 FE ?? ?? 7E EF'
      offset_range: [32, 1024]

composite_rules:
  - id: dos-mz-rotate-infector
    desc: Encrypted DOS MZ infector with word-rotate decryptor
    crit: hostile
    conf: 0.97
    attack: T1027.014
    near_bytes: 64
    all:
      - id: dos-mz-key-setup-stub
      - id: dos-word-rotate-decrypt-loop
      - id: dos-decrypt-bounds-loop
