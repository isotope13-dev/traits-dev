# The appended decryptor uses a rolling XOR key and a word rotation.
# Its decoded body reserves resident memory and hooks DOS execution services.
defaults:
  for: [dos_com]
  platforms: [windows, unix]

traits:
  - id: rolling-rotate-word-decoder
    desc: Rolling DOS word rotate decoder
    crit: notable
    if:
      type: hex
      pattern: 'FF 70 02 D3 C2 59 32 ED 2E D3 08 8B 10 91 26 32 0D'

  - id: rolling-word-key-update
    desc: DOS decoder rolling key update
    crit: notable
    if:
      type: hex
      pattern: '87 F7 2E 31 01 87 F7 93 40 93 8B CB 33 C1 50 5D 2E 89 AC ?? ?? 81 FB ?? ?? 75'

composite_rules:
  - id: rolling-rotate-resident-infector
    desc: Encrypted DOS resident infector with rolling word decoder
    crit: hostile
    attack: T1027.014
    near_bytes: 80
    all:
      - id: rolling-rotate-word-decoder
      - id: rolling-word-key-update
