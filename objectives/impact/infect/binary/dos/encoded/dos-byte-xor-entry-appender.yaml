# The decoder key varies between infected hosts. The two encoded instruction
# sequences identify the search and entry-patching portions of the body.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: byte-xor-556-decoder
    desc: DOS 556-byte XOR decoder loop
    crit: notable
    if:
      type: hex
      pattern: 'B9 2C 02 BE ?? ?? 80 34 ?? 46 E2 FA'

  - id: xor-com-search
    desc: XOR-encoded DOS COM search
    crit: notable
    if:
      type: yara
      source: |
        rule dos_xor_com_search_556 {
          strings:
            $s = "\xb4\x4e\xb9\x27\x00\xba\x11\x00\x03\xd6\xcd\x21" xor(0-255)
          condition:
            $s
        }

  - id: xor-entry-patch
    desc: XOR-encoded DOS entry patch
    crit: notable
    if:
      type: yara
      source: |
        rule dos_xor_entry_patch_556 {
          strings:
            $s = "\xb8\x00\x42\x33\xc9\x8b\xd1\xcd\x21\xb4\x40\xb9\x03\x00\xba\x1a\x00\x03\xd6\xcd\x21" xor(0-255)
          condition:
            $s
        }

composite_rules:
  - id: byte-xor-com-entry-appender
    desc: XOR-encoded DOS infector searches COM files and patches entries
    crit: hostile
    attack: T1027,T1565.001
    near_bytes: 700
    all:
      - id: byte-xor-556-decoder
      - id: xor-com-search
      - id: xor-entry-patch
