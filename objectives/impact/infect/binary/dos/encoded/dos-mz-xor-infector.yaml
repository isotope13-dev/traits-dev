# Encrypted DOS MZ infector using a 16-bit XOR decryptor loop and dummy handle close.
defaults:
  platforms: [windows, unix]
  for: [data]
  size_min: 512
  size_max: 65536

traits:
  - id: dos-mz-cs-ds-xor-setup
    desc: DOS stub sets DS=CS and XOR key
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: '8C C8 8E D8 BE ?? ?? BA ?? ??'
      offset_range: [32, 512]

  - id: dos-dummy-handle-close-check
    desc: DOS stub closes fixed handle before decrypt
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: 'BB 00 02 B4 3E CD 21'
      offset_range: [32, 512]

  - id: dos-word-xor-inc-si-loop
    desc: DOS 16-bit word XOR decryptor loop
    crit: suspicious
    conf: 0.93
    if:
      type: hex
      pattern: 'B9 ?? ?? 31 14 46 46 E2 FA'
      offset_range: [32, 1024]

composite_rules:
  - id: dos-mz-xor-infector
    desc: Encrypted DOS MZ infector with 16-bit XOR decryptor
    crit: hostile
    conf: 0.97
    attack: T1027.014
    near_bytes: 64
    all:
      - id: dos-mz-cs-ds-xor-setup
      - id: dos-dummy-handle-close-check
      - id: dos-word-xor-inc-si-loop
