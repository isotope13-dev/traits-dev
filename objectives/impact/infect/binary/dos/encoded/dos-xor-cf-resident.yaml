# The resident infector encrypts its body with XOR 0xcf, including the
# instructions that patch the host entry and append the encrypted copy.
defaults:
  for: [dos_com]
  platforms: [windows, unix]

traits:
  - id: xor-cf-decoder
    desc: DOS XOR body decoder loop
    crit: notable
    if:
      type: hex
      pattern: '3C CF 75 08 2E 30 04 46 E2 EE EB 02 FA F4'

  - id: xor-cf-entry-patch
    desc: Encoded DOS host entry patch
    crit: notable
    if:
      type: hex
      pattern: 'E1 09 C9 4D CC 26 E1 6C 4C CC'

  - id: xor-cf-body-write
    desc: Encoded DOS body encryption and write
    crit: notable
    if:
      type: hex
      pattern: '76 BB CC 71 0F CC 4F FB 00 89 2D 35 7B 8F 76 55 CC 44 1E'

composite_rules:
  - id: xor-cf-resident-infector
    desc: XOR-encoded DOS infector patches host entry and appends its body
    crit: hostile
    all:
      - id: xor-cf-decoder
      - id: xor-cf-entry-patch
      - id: xor-cf-body-write
