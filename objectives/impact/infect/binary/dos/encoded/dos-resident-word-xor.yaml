# The decryptor's word key changes per infection. Compare encrypted words to
# that key so the interrupt hook and COM infection code survive re-encryption.
defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_max: 65536
  attack: T1080

composite_rules:
  - id: resident-word-xor-com-infector
    desc: Encrypted resident DOS virus intercepts opens and infects COM files
    crit: hostile
    all:
      - id: micro-behaviors/process/hook/interrupt::resident-word-xor-hook
      - id: micro-behaviors/fs/write/file/handle/int21::resident-word-xor-com-write
