# The word key in the decoder also encrypts each aligned word of the body.
# The body enumerates files, appends its 500-byte copy, and patches the host.
defaults:
  platforms: [windows, unix]
  for: [dos_com]

traits:
  - id: word-xor-far-return-decoder
    desc: DOS word XOR far-return decoder
    crit: notable
    if:
      type: hex
      pattern: 'BE ?? ?? FB B8 ?? ?? B9 E5 00 0E 8D BC 22 01 57 33 DB 8E DB C6 06 F0 04 CB 0E 1F EA F0 04 00 00 FF FF 8D BC 2C 01 31 05 47 47 E2 FA'

  - id: word-xor-encrypted-file-infector
    desc: Encrypted DOS search and rewrite code
    crit: notable
    if:
      type: yara
      source: |
        rule dos_word_xor_encrypted_infector {
          strings:
            $d = { BE ?? ?? FB B8 ?? ?? B9 E5 00 0E 8D BC 22 01 57 33 DB 8E DB C6 06 F0 04 CB 0E 1F EA F0 04 00 00 FF FF 8D BC 2C 01 31 05 47 47 E2 FA }
          condition:
            for any i in (1..#d) : (
              (uint16(@d[i] + 44 + 0x6c) ^ uint16(@d[i] + 5)) == 0xb401 and
              (uint16(@d[i] + 44 + 0x6e) ^ uint16(@d[i] + 5)) == 0xb94e and
              (uint16(@d[i] + 44 + 0x114) ^ uint16(@d[i] + 5)) == 0xb9fa and
              (uint16(@d[i] + 44 + 0x116) ^ uint16(@d[i] + 5)) == 0x01f4 and
              (uint16(@d[i] + 44 + 0x128) ^ uint16(@d[i] + 5)) == 0xb940 and
              (uint16(@d[i] + 44 + 0x12a) ^ uint16(@d[i] + 5)) == 0x01f4 and
              (uint16(@d[i] + 44 + 0x13c) ^ uint16(@d[i] + 5)) == 0xb400 and
              (uint16(@d[i] + 44 + 0x13e) ^ uint16(@d[i] + 5)) == 0xb940
            )
        }

composite_rules:
  - id: word-xor-appending-infector
    desc: Encrypted DOS infector appends code and patches file entry
    crit: hostile
    attack: T1027,T1565.001
    all:
      - id: word-xor-far-return-decoder
      - id: word-xor-encrypted-file-infector
