defaults:
  platforms: [windows, unix]
  for: [dos_com]

traits:
  - id: add46-decoder
    desc: DOS additive decoder loop
    crit: notable
    if:
      type: hex
      pattern: 'AC 04 46 AA E2 FA C3'

  - id: add46-com-infection-check
    desc: Encoded DOS host infection check
    crit: notable
    if:
      type: hex
      pattern: '6E F9 87 DB 45 AC 45 BE BC 9A 3A B6 61'

  - id: add46-com-search
    desc: Encoded DOS file search sequence
    crit: notable
    if:
      type: hex
      pattern: '73 C1 BA 6E 08 47 50 DE BD 87 DB 2D FA 74 3A BA'

composite_rules:
  - id: add46-com-file-infector
    desc: Additively encoded DOS COM file infection routine
    crit: hostile
    all:
      - id: add46-decoder
      - id: add46-com-infection-check
      - id: add46-com-search
