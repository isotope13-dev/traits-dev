# Appended DOS MZ infector using a two's-complement negation decryptor loop.
defaults:
  platforms: [windows, unix]
  for: [data]
  size_min: 512
  size_max: 262144

traits:
  - id: dos-mz-tail-relocate-stub
    desc: DOS MZ stub relocates appended virus body
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: '1E 0E 1F E8 17 00'
      offset_range: [-2048, null]

  - id: dos-tail-self-copy-loop
    desc: DOS stub copies body to trailing buffer
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: '33 F6 B9 ?? ?? 8A 04 88 84 ?? ?? 46 E2 F7'
      offset_range: [-2048, null]

  - id: dos-neg-byte-decrypt-loop
    desc: DOS two's-complement byte decryptor loop
    crit: suspicious
    conf: 0.93
    if:
      type: hex
      pattern: 'B9 ?? ?? 4E F6 1C E2 FB'
      offset_range: [-2048, null]

composite_rules:
  - id: dos-mz-neg-infector
    desc: Encrypted DOS MZ infector with negation decryptor
    crit: hostile
    conf: 0.97
    attack: T1027.014,T1080
    near_bytes: 64
    all:
      - id: dos-mz-tail-relocate-stub
      - id: dos-tail-self-copy-loop
      - id: dos-neg-byte-decrypt-loop
