# The loop rotates each byte of the appended body left.  Its decoded body
# restores the host entry and seeks to EOF before writing its infection data.
defaults:
  platforms: [windows, unix]
  for: [dos_com]

traits:
  - id: rotate-byte-body-decoder
    desc: DOS rotate-byte body decoder
    crit: notable
    if:
      type: hex
      pattern: 'BA 20 17 BF ?? ?? 36 D0 05 FD 47 4A 75 F8'

  - id: rotate-encoded-host-restore
    desc: Encoded DOS host entry restoration
    crit: notable
    if:
      type: hex
      pattern: '5F 02 8B 81 FA DF 00 80 C5 EF D2 52'

  - id: rotate-encoded-eof-write
    desc: Encoded DOS seek and write sequence
    crit: notable
    if:
      type: hex
      pattern: '5C 01 21 99 E4 99 69 74 ?? ?? 5A 20 99 69 DC 07 00'

composite_rules:
  - id: rotate-encoded-appender
    desc: Encoded DOS infector restores host and appends infection data
    crit: hostile
    attack: T1027,T1080
    all:
      - id: rotate-byte-body-decoder
      - id: rotate-encoded-host-restore
      - id: rotate-encoded-eof-write
