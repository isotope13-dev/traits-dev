# Appended COM infector with a segment-relative XOR decoder. The encrypted
# instruction signatures below are for key 60h; the key itself can vary.
defaults:
  for: [dos_com, data]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: segment-xor-decoder
    desc: DOS segment-relative XOR decode loop
    crit: notable
    if:
      type: hex
      pattern: '1E 0E 1F 8A 26 ?? ?? BE ?? ?? FC B9 ?? ?? 8A 04 32 C4 88 04 46 E2 F7'
  - id: xor60-com-search
    desc: XOR-encoded DOS file search loop
    crit: notable
    if:
      type: hex
      pattern: 'D4 2E D9 40 60 AD 41 12 ?? A6 ?? ?? ?? 60 F0'
  - id: xor60-com-read
    desc: XOR-encoded DOS file open attempt
    crit: notable
    if:
      type: hex
      pattern: 'D8 62 5D DA ?? ?? AD 41 ?? ?? 89 ?? ??'

  - id: xor60-com-write
    desc: XOR-encoded DOS file write call
    crit: notable
    if:
      type: hex
      pattern: 'D4 20 EB 7E ?? ?? DA ?? ?? AD 41'

composite_rules:
  - id: segment-xor-com-infector
    desc: XOR-obfuscated DOS code searches and infects COM files
    crit: hostile
    attack: T1027
    near_bytes: 1024
    all:
      - id: segment-xor-decoder
      - id: xor60-com-search
      - id: xor60-com-read
      - id: xor60-com-write
