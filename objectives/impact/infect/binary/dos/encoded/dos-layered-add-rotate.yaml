defaults:
  for: [dos_com]
  platforms: [windows, unix]

traits:
  - id: layered-add-decoder
    desc: DOS self-modifying subtraction decoder
    crit: notable
    if:
      type: hex
      pattern: 'BF ?? ?? 57 5E AC 2C 59 AA 4B 75 52'

  - id: layered-encoded-open
    desc: Layered DOS read-write open sequence
    crit: notable
    if:
      type: hex
      pattern: '1D 6A 41 9F C9 7A EB 84 B6 20 A6 4A 0B B2 1D 5A'

  - id: layered-encoded-write
    desc: Layered DOS virus body write sequence
    crit: notable
    if:
      type: hex
      pattern: '25 9C B2 F1 F0 FD 5C 9F 75 6A 78 F1 60 C8 2A C9'

composite_rules:
  - id: layered-add-rotate-infector
    desc: Layered DOS infector opens executables and writes its body
    crit: hostile
    attack: T1027
    all:
      - id: layered-add-decoder
      - id: layered-encoded-open
      - id: layered-encoded-write
