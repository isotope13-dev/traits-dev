defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 512
  attack: T1036.005,T1565

traits:
  - id: tiny-dos-create-com-companion
    desc: Tiny DOS program creates COM companion
    crit: hostile
    conf: 0.97
    if:
      type: yara
      source: |
        rule tiny_dos_create_com_companion {
          strings:
            $mask = { 2A 2E 65 2A }
            $create = { BA 9E 00 [0-2] B8 2E 5B AE 75 FD 66 C7 05 ( 63 6F 6D | 43 4F 4D ) ( 00 | 20 ) CD 21 93 B4 40 [0-4] C3 }
          condition:
            $mask at 0 and $create
        }
