# Direct-action COM prepender. A byte compare against an infection marker
# skips hosts already carrying the body. Otherwise AL selects the shared
# seek helper: 2 writes the displaced prefix at EOF, 0 rewinds, and a
# second write plants the body at the start. REP MOVSB/MOVSW then copies
# that saved prefix back over the running image. Addresses, the marker
# byte, call displacements, and the close/find-next bytes between the
# second write and the copy are not identities. A directory find loop over
# a COM or EXE mask is what makes the rewrite a virus.
defaults:
  for: [dos_com, static-lib, data]
  platforms: [windows, unix]
  size_max: 65536
  attack: T1080

traits:
  - id: dos-marker-seek-prefix-prepend
    desc: DOS marker check then prefix prepend
    crit: suspicious
    conf: 0.97
    if:
      type: hex
      pattern: "80 3E ?? ?? ?? (74|75) ?? B0 02 [0-2] E8 ?? ?? [0-16] B4 40 [0-4] CD 21 [0-8] (32 C0|30 C0|28 C0|2A C0|B0 00) [0-4] E8 ?? ?? [0-12] B4 40 [0-6] CD 21 [0-24] (F3 A4|F3 A5)"

composite_rules:
  - id: dos-enumerated-marker-prefix-prepender
    desc: DOS directory loop prepends after a marker check
    crit: hostile
    conf: 0.97
    all:
      - id: dos-marker-seek-prefix-prepend
      - id: micro-behaviors/fs/search::dos-int21-find-first-call
      - id: micro-behaviors/fs/search::dos-executable-compatible-wildcard
    any:
      - id: micro-behaviors/fs/search::dos-int21-find-next
      - id: micro-behaviors/fs/search::dos-int21-find-next-jump
      - id: micro-behaviors/fs/search::dos-int21-find-next-near-jump
      - id: micro-behaviors/fs/search::dos-int21-find-next-near
    needs: 1
