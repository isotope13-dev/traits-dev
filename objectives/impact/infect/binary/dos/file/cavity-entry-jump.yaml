# Cavity infector that searches an executable buffer for a block of zeros,
# copies its own body into that cavity with REP MOVSB, and overwrites the
# host's entry point with a near jump targeting the cavity.
defaults:
  for: [dos_com, static-lib, data]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-buffer-cavity-entry-jump
    desc: Copies body into buffer, redirects entry
    crit: suspicious
    conf: 0.97
    if:
      type: hex
      pattern: "F3 A4 [0-8] 26 89 ?? (01|02) 00 [0-4] 26 (C7 06 00 00 ?? E9|C7 06 00 00 E9 ??|C6 06 00 00 E9)"
