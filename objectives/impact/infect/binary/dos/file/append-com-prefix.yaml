defaults:
  platforms: [windows, unix]
  for: [dos_com]
  attack: T1574

traits:
  - id: dos-append-and-three-byte-prefix-write
    desc: DOS writes body then rewrites three-byte prefix
    crit: notable
    if:
      type: yara
      source: |
        rule dos_append_and_three_byte_prefix_write {
          strings:
            $flow = { B8 02 42 [0-10] CD 21 [0-40] B8 00 42 [0-10] CD 21 [0-15] B4 40 [0-15] CD 21 [0-12] B8 00 42 [0-10] CD 21 [0-16] B4 40 B9 03 00 [0-8] CD 21 }
          condition:
            $flow
        }

composite_rules:
  - id: dos-append-body-rewrite-com-prefix
    desc: DOS file mutation appends body rewrites entry
    crit: hostile
    conf: 0.97
    all:
      - id: dos-append-and-three-byte-prefix-write
      - id: metadata/binary/code/control-transfer::dos-call-pop-bx
      - id: micro-behaviors/fs/file/read-write::dos-read-seek-write-time-sequences
