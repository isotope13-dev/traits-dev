defaults:
  for: [text]
  platforms: [windows, unix]

composite_rules:
  - id: dos-source-append-entry-infector
    desc: Appends COM code and patches entry
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/file/open::dos-asm-open-rw
      - id: micro-behaviors/fs/file/handle::dos-asm-seek-eof
      - id: micro-behaviors/fs/write/file/handle::dos-asm-write-handle
      - id: micro-behaviors/mem/write/arbitrary::asm-buffer-word-store
      - id: micro-behaviors/fs/write/file/handle::dos-source-offset-buffer-call
      - id: micro-behaviors/data/embedded/payload/source::asm-near-jump-buffer
      - id: micro-behaviors/fs/write/file/handle::dos-source-com-image-buffer
      - id: micro-behaviors/fs/write/file/handle::dos-source-five-byte-transfer
      - id: micro-behaviors/fs/read/file/handle::dos-asm-read-handle
