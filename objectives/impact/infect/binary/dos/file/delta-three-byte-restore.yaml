defaults:
  platforms: [windows, unix]
  for: [dos_com]
  attack: T1574

traits:
  - id: dos-delta-three-byte-com-restore
    desc: DOS delta code restores three COM bytes
    crit: notable
    if:
      type: yara
      source: |
        rule dos_delta_three_byte_com_restore {
          strings:
            $copy = { E8 00 00 5D [0-12] BF 00 01 B9 03 00 [0-3] F3 A4 }
          condition:
            $copy
        }

composite_rules:
  - id: dos-search-write-com-host-restoration
    desc: DOS searches writes files restores COM entry
    crit: hostile
    conf: 0.97
    all:
      - id: dos-delta-three-byte-com-restore
      - id: micro-behaviors/fs/file/open/write::dos-update-open-int21-bytes
      - id: micro-behaviors/fs/search/command::dos-int21-find-first
      - id: micro-behaviors/fs/search/command::dos-int21-find-next
      - id: micro-behaviors/fs/write/file/handle/int21::dos-int21-write
