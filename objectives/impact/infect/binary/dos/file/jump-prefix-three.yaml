# Opcode construction and a 3-byte DOS write appear in the same short sequence;
# the rule does not prove the operand pointers refer to the same buffer.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 65536

traits:
  - id: dos-copy-prefix-build-jump-and-write-three
    desc: DOS prefix copy and short-write bytes
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: '8D B6 ?? ?? 8D BE ?? ?? 56 B9 03 00 F3 A4 5F B0 E9 AA 58 2D 03 00 AB [0-16] (B4 3D B0 02|B8 02 3D) CD 21 93 B4 40 B9 03 00 8D 96 ?? ?? CD 21'

composite_rules:
  - id: dos-search-and-jump-prefix-write
    for: [dos_com]
    desc: DOS search, jump and three-byte write code
    crit: hostile
    conf: 0.96
    near_bytes: 2048
    all:
      - id: dos-copy-prefix-build-jump-and-write-three
      - id: micro-behaviors/fs/search/command::dos-int21-find-first-call
      - id: micro-behaviors/fs/search/command::dos-int21-find-next
      - id: micro-behaviors/fs/file/seek::dos-seek-end-int
      - id: micro-behaviors/fs/file/timestamp::dos-int21-set-file-time
