defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 65536

traits:
  - id: dos-bp-three-byte-and-image-write
    desc: DOS writes header and program-sized body
    crit: notable
    conf: 0.92
    if:
      type: hex
      # A 3-byte DOS write is followed by another write whose size is
      # calculated as an in-memory end address minus COM load address 100h.
      pattern: 'B4 40 8B 5E ?? B9 03 00 8D 56 ?? CD 21 [0-16] E8 ?? ?? B4 40 8B 5E ?? 8D 0E ?? ?? 8D 16 00 01 2B CA 8D 56 ?? CD 21'

composite_rules:
  - id: dos-searched-header-and-image-write
    for: [dos_com]
    desc: DOS executable search with header and body writes
    crit: hostile
    conf: 0.94
    all:
      - id: dos-bp-three-byte-and-image-write
      - id: micro-behaviors/fs/search/command::dos-int21-find-first-call
      - id: micro-behaviors/fs/search/command::dos-executable-compatible-wildcard
      - id: micro-behaviors/fs/file/seek::dos-seek-start-int
