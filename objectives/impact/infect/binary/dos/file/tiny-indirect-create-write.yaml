defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 512
  attack: T1565

traits:
  - id: tiny-dos-indirect-search-create-write
    desc: DOS indirect search and file write
    crit: hostile
    conf: 0.95
    if:
      type: yara
      source: |
        rule tiny_dos_indirect_search_create_write {
          strings:
            $mask = { 2A 2E 65 2A }
            $code = { ( BA 9E 00 B8 2E 5B | B8 2E 5B BA 9E 00 ) F2 AE FF AF ?? ?? 8F 05 8B CE CD 21 93 B4 40 73 ?? C3 }
          condition:
            $mask at 0 and $code
        }
