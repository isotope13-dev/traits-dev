# Short jumps over junk CALL opcodes can separate each two-byte instruction.
# Bind the DTA filename open to its returned handle and the write from 0100h:
# MOV BX,AX; AH=40h; DX=0100h; CH=DL (zero); CL=copy length; INT 21h.
# Close that handle, then find-next and branch back into the enumeration.
# Padding, copy length and loop displacement are not specimen identities.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: objectives/impact/infect/binary/dos/file::dos-dta-self-image-overwrite-loop
    desc: DOS overwrites matches with its COM image
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: "B4 3D [0-3] B0 02 [0-3] B6 00 [0-3] B2 9E [0-3] CD 21 [0-3] 8B D8 [0-3] B4 40 [0-3] B6 01 [0-3] B2 00 [0-3] 8A EA [0-3] B1 ?? [0-3] CD 21 [0-3] B4 3E [0-3] CD 21 [0-3] B4 4F EB ??"
      offset_range: [0, 4096]

  # Time-preserving default-DTA overwrite: open the found file for update
  # (3D02h, DX=009Eh), save its stamp (5700h, push CX/DX), write the COM
  # image from 0100h, restore the stamp (pop, 5701h), and close. A JC on
  # open failure may precede the handle XCHG; the copy length varies.
  - id: objectives/impact/infect/binary/dos/file::dos-dta-self-image-overwrite-keep-time
    desc: DOS overwrites DTA file, keeps its time
    crit: notable
    conf: 0.98
    for: [dos_com, data]
    if:
      type: hex
      pattern: "B8 02 3D BA 9E 00 CD 21 [0-2] 93 B8 00 57 CD 21 51 52 (BA 00 01 B4 40 B9 ?? ??|B4 40 B9 ?? ?? BA 00 01) CD 21 5A 59 B8 01 57 CD 21 B4 3E CD 21"

  # Attribute-clearing form: read the DTA name's attributes (4300h,
  # DX=009Eh), clear them (CX=0, 4301h), then open for update with DX still
  # holding the DTA name. Save the stamp (5700h), write the COM image from
  # 0100h, restore the stamp (5701h) and close. Storage for the saved
  # attribute and stamp, handle move and copy length vary.
  - id: objectives/impact/infect/binary/dos/file::dos-dta-attr-clear-self-image-overwrite
    desc: DOS unprotects DTA file, overwrites with self
    crit: notable
    conf: 0.97
    for: [dos_com, data]
    if:
      type: hex
      pattern: "BA 9E 00 B8 00 43 CD 21 [0-6] 33 C9 B8 01 43 CD 21 B8 02 3D CD 21 [0-2] (8B D8|93) B8 00 57 CD 21 [0-10] (BA 00 01 B4 40 B9 ?? ??|B4 40 B9 ?? ?? BA 00 01) CD 21 B8 01 57 [0-8] CD 21 B4 3E CD 21"

composite_rules:
  - id: dos-built-mask-self-image-overwriter
    desc: DOS overwrites COM matches with itself
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/infect/binary/dos/file::dos-dta-self-image-overwrite-loop
      - id: objectives/impact/infect/binary/dos/file::dos-com-mask-stosb

  - id: dos-attr-clear-search-self-image-overwriter
    desc: DOS searches COM files, overwrites each with itself
    crit: hostile
    conf: 0.97
    for: [dos_com, data]
    all:
      - id: micro-behaviors/fs/search::dos-com-exe-or-all-file-wildcard
      - id: micro-behaviors/fs/search::dos-int21-find-first
      - id: objectives/impact/infect/binary/dos/file::dos-dta-attr-clear-self-image-overwrite
