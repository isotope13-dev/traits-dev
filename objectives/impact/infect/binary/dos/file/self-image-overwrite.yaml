# Short jumps over junk CALL opcodes can separate each two-byte instruction.
# Bind the DTA filename open to its returned handle and the write from 0100h:
# MOV BX,AX; AH=40h; DX=0100h; CH=DL (zero); CL=copy length; INT 21h.
# Close that handle, then find-next and branch back into the enumeration.
# Padding, copy length and loop displacement are not specimen identities.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: objectives/impact/infect/binary/dos/file::dos-dta-self-image-overwrite-loop
    desc: DOS overwrites matches with its COM image
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: "B4 3D [0-3] B0 02 [0-3] B6 00 [0-3] B2 9E [0-3] CD 21 [0-3] 8B D8 [0-3] B4 40 [0-3] B6 01 [0-3] B2 00 [0-3] 8A EA [0-3] B1 ?? [0-3] CD 21 [0-3] B4 3E [0-3] CD 21 [0-3] B4 4F EB ??"
      offset_range: [0, 4096]

composite_rules:
  - id: dos-built-mask-self-image-overwriter
    desc: DOS overwrites COM matches with itself
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/infect/binary/dos/file::dos-dta-self-image-overwrite-loop
      - id: objectives/impact/infect/binary/dos/file::dos-com-mask-stosb
