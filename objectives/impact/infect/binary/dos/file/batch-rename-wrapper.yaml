defaults:
  for:
  - dos_com
  platforms:
  - windows
  - unix
  size_max: 65536
composite_rules:
- id: dos-rename-batch-wrapper-self-image-installer
  desc: Installs self-image and replacement Batch wrappers
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/fs/file/rename::dos-rename-host-build-batch-wrapper
  - id: micro-behaviors/fs/write/file/handle::dos-create-self-image-path-write
