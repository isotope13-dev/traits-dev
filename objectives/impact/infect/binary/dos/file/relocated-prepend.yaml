defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536
  attack: T1080

traits:
  - id: objectives/impact/infect/binary/dos/file::dos-relocated-host-rewrite
    desc: DOS relocates code and rewrites host
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      # Copy the COM image from 0100h into a relocated buffer. Read the
      # host, inspect its first word for reinfection, save its length at
      # buffer-2, then recreate it and write host length + prefix length.
      # Addresses, marker, branch displacement and prefix size vary.
      # The recreate result is carried into BX for the following write.
      pattern: "8B C8 BE 00 01 8B 3E ?? ?? F3 A4 [32-96] B4 3F 8B 0E ?? ?? 8B 16 ?? ?? CD 21 8B DA 8B 07 2D ?? ?? 74 ?? A1 ?? ?? 8B 1E ?? ?? 89 47 FE B4 3C B9 00 00 8B 16 ?? ?? F8 CD 21 8B D8 B4 40 8B 0E ?? ?? 03 0E ?? ?? 8B 16 ?? ?? CD 21"

composite_rules:
  - id: dos-relocated-host-prepender
    desc: DOS directory loop prepends code to hosts
    crit: hostile
    conf: 0.98
    all:
      - id: dos-relocated-host-rewrite
      - id: micro-behaviors/fs/search::dos-int21-find-first-call
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-find-next
