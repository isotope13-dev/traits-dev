# Appender that writes its own image from offset 0 (XOR DX,DX) at the
# host's EOF, checks the full count was written, rewinds (AX=4200h,
# CX:DX=0), then writes the rebuilt entry header over the host start.
# Filler-padded resident bodies sniff as text, so text is in scope.
defaults:
  for: [dos_com, data, text]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-own-image-append-verify-rewind-header-write
    desc: DOS appends own image then rewrites header
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "33 D2 B9 ?? ?? B4 40 (E8 ?? ??|CD 21) 72 ?? 3D ?? ?? 75 ?? 33 C9 33 D2 B8 00 42 (E8 ?? ??|CD 21) 72 ?? BA ?? ?? B4 40 B9 ?? 00 (E8|CD 21)"
