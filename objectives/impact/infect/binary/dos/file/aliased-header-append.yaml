defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-com-buffer-entry-jump-rewrite
    desc: DOS saved-header entry jump rewrite
    crit: suspicious
    conf: 0.96
    if:
      type: hex
      pattern: "C7 04 ?? E9 89 44 02 EB ??"

composite_rules:
  # SI points into the saved host header: install a marker and E9 entry
  # jump, then store the calculated displacement at SI+2. The subsequent
  # writes transfer a resident image and the modified SI-backed header via
  # an aliased DOS interrupt. The nearby seek helper selects EOF or BOF,
  # clears CX:DX, and invokes AH=42h through the alias.
  # Addresses, image lengths, marker, and alias number are not identities.
  - id: dos-aliased-com-entry-append
    desc: DOS COM entry redirection with body append
    crit: hostile
    conf: 0.98
    near_bytes: 256
    all:
      - id: dos-com-buffer-entry-jump-rewrite
      - id: micro-behaviors/fs/write/file/handle::dos-aliased-image-header-write-seek
