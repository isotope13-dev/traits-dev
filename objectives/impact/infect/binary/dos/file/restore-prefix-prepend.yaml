defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536
  attack: T1080

traits:
  - id: dos-host-restore-prefix-prepender
    desc: DOS prefix rewrite and host restore trampoline
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      # The saved-host trampoline copies a prefix back to COM entry 0100h,
      # restores registers and returns to 0100h. The infection routine then
      # rewinds the target handle, writes its own image from 0100h over the
      # target prefix, restores the saved timestamp, and closes the handle.
      # Prefix length, padding and trampoline address are not identities.
      pattern: "BF 00 01 B9 ?? ?? [0-2] F3 A4 9D 17 07 1F 5F 5E 5D 5A 59 5B 58 B8 00 01 50 C3 [0-8] B4 42 B0 00 BA 00 00 B9 00 00 CD 21 B4 40 B9 ?? ?? [0-2] 8D 16 00 01 CD 21 B4 57 B0 01 5A 59 CD 21 B4 3E CD 21"

composite_rules:
  - id: dos-enumerated-host-restore-prepender
    desc: DOS file loop installs host-restoring prefix
    crit: hostile
    conf: 0.98
    all:
      - id: dos-host-restore-prefix-prepender
      - id: micro-behaviors/fs/search::dos-int21-find-first-call
      - id: micro-behaviors/fs/search::dos-int21-find-next
