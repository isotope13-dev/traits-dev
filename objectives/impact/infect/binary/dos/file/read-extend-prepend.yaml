# Direct-action DOS prepender. Open the selected file for update, read the
# host, add a fixed body length to the bytes read, rewind the handle to
# offset zero, and write that extended image back. The added immediate is
# the prefix length; addresses, the marker test, and register setup vary.
# A directory find-first/find-next loop is what makes the rewrite a virus.
defaults:
  for: [dos_com, static-lib, data]
  platforms: [windows, unix]
  size_max: 65536
  attack: T1080

traits:
  - id: dos-read-extend-rewind-write
    desc: DOS extends a read file and rewrites
    crit: suspicious
    conf: 0.97
    if:
      type: hex
      pattern: "B8 02 3D [0-4] CD 21 [0-16] B4 3F [0-8] CD 21 [0-6] 05 ?? ?? [0-32] B8 00 42 [0-8] CD 21 [0-16] B4 40 [0-8] CD 21"

composite_rules:
  - id: dos-enumerated-read-extend-prepender
    desc: DOS directory loop prepends a fixed-size body
    crit: hostile
    conf: 0.97
    all:
      - id: dos-read-extend-rewind-write
      - id: micro-behaviors/fs/search::dos-int21-find-first-call
      - id: micro-behaviors/fs/search::dos-int21-find-next
      - id: micro-behaviors/fs/search::dos-com-exe-or-all-file-wildcard
