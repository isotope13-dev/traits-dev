defaults:
  platforms: [windows, unix]
  for: [dos_com]
  attack: T1574

traits:
  - id: dos-short-copy-to-com-entry
    desc: DOS copies short prefix to COM entry
    crit: notable
    if:
      type: hex
      pattern: 'B9 (03 00|04 00|05 00) [0-14] BF 00 01 F3 A4'

composite_rules:
  - id: dos-com-restore-search-read-write
    desc: DOS restores entry searches and writes files
    crit: hostile
    conf: 0.97
    all:
      - id: dos-short-copy-to-com-entry
      - id: micro-behaviors/fs/search/command::dos-executable-compatible-wildcard
      - id: micro-behaviors/fs/search/command::dos-int21-find-first
      - id: micro-behaviors/fs/search/command::dos-int21-find-next
      - id: micro-behaviors/fs/file/open/unspecified::dos-int21-open
      - id: micro-behaviors/fs/read/file/handle::dos-int21-read
      - id: micro-behaviors/fs/write/file/handle/int21::dos-int21-write
