# These patterns retain the instruction order and transfer lengths. They do not
# prove execution, control flow, or that unrelated API calls share a handle.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]

traits:
  - id: dos-read-append-three-byte-write-sequence
    desc: DOS read, append and three-byte write pattern
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: 'B9 03 00 B8 00 3F CD 21 [0-8] (B9 00 00 8B D1|33 C9 8B D1) B8 02 42 CD 21 [0-48] B9 ?? ?? B8 00 40 CD 21 [0-4] (B9 00 00 8B D1|33 C9 8B D1) B8 00 42 CD 21 [0-8] BA ?? ?? B9 03 00 B8 00 40 CD 21'

  - id: dos-body-and-mz-header-write-sequence
    desc: DOS body and MZ-sized header write pattern
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: 'B8 00 42 CD 21 B9 ?? ?? BA ?? ?? B8 00 40 CD 21 [0-4] (33 C9 8B D1|B9 00 00 8B D1) B8 00 42 CD 21 BA ?? ?? B9 1C 00 B8 00 40 CD 21'

composite_rules:
  - id: dos-searched-append-entry-patch
    desc: DOS search with append and entry-write pattern
    crit: hostile
    conf: 0.96
    near_bytes: 2048
    all:
      - id: dos-read-append-three-byte-write-sequence
      - id: micro-behaviors/fs/search/command::dos-int21-find-first-call
      - id: micro-behaviors/fs/file/timestamp::dos-int21-set-file-time

  - id: dos-resident-exec-mz-header-patch
    desc: DOS EXEC hook and 28-byte rewrite pattern
    crit: hostile
    conf: 0.96
    near_bytes: 2048
    all:
      - id: dos-body-and-mz-header-write-sequence
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
      - id: micro-behaviors/os/msdos/interrupt::dos-set-int21-call
      - id: micro-behaviors/os/msdos/interrupt::dos-get-int21-vector
