# INT 21h seek-to-end returns the host length in AX. Save it across the
# append, seek back to offset zero, and subtract the three-byte JMP length
# to construct E9 + displacement before writing three bytes at the entry.
# Addresses and append length vary; the infection data flow is the evidence.
defaults:
  for: [dos_com]
  platforms: [windows, linux, macos]
  size_max: 65536

traits:
  # DTA-length variant: subtract the three-byte entry jump length, store
  # its displacement at header+1, seek to BOF and write that header, then
  # seek to EOF and append code. Bind the write source to the displacement
  # store and require E9 in that source buffer; lengths and addresses vary.
  - id: com-bp-entry-jump-then-append
    desc: Writes COM entry jump then appends code
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule com_bp_entry_jump_then_append {
          strings:
            $rewrite = { 2D 03 00 89 86 ?? ?? B8 00 42
                         (33|31) C9 (33|31) D2 CD 21
                         B4 40 B9 03 00 8D 96 ?? ?? CD 21
                         B8 02 42 (33|31) C9 (33|31) D2 CD 21
                         B4 40 B9 ?? ?? 8D 96 ?? ?? CD 21 }
          condition:
            for any r in (1..#rewrite) : (
              @rewrite[r] < 4096 and
              uint16(@rewrite[r] + 23) >= 0x100 and
              uint16(@rewrite[r] + 5) == uint16(@rewrite[r] + 23) + 1 and
              uint8(uint16(@rewrite[r] + 23) - 0x100) == 0xE9
            )
        }

  # Build E9 + (host offset - 3) in a header buffer, then write that same
  # buffer through DOS. Bind the displacement store to buffer+1 and the
  # write source to the opcode store; relocation addresses are arbitrary.
  - id: com-indirect-entry-jump-write
    desc: Writes a calculated COM entry jump
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule com_indirect_entry_jump_write {
          strings:
            $build = { 2D 03 00 A3 ?? ?? C6 06 ?? ?? E9 }
            $write = { BA ?? ?? B9 04 00 B8 00 40 CD 21 }
          condition:
            for any b in (1..#build) : (
              uint16(@build[b] + 4) == uint16(@build[b] + 8) + 1 and
              for any w in (1..#write) : (
                @write[w] > @build[b] + 10 and
                @write[w] < @build[b] + 128 and
                uint16(@write[w] + 1) == uint16(@build[b] + 8)
              )
            )
        }

  # BP-relative header buffers: save the original three entry bytes with
  # MOVSW/MOVSB, replace the entry opcode with E9, subtract the jump length
  # from the host size, store its displacement, and select a three-byte write.
  # Buffer addresses vary with relocation; no family marker is required.
  - id: com-buffer-entry-jump-patch
    desc: Saves COM entry, builds host-length jump
    crit: suspicious
    conf: 0.97
    if:
      type: hex
      pattern: "8D BE ?? ?? 8D B6 ?? ?? A5 A4 3E C6 86 ?? ?? E9 3E 8B 86 ?? ?? 2D 03 00 3E 89 86 ?? ?? B9 03 00"
      offset_range: [0, 4096]

  - id: objectives/impact/infect/binary/dos/file::com-append-and-entry-jump
    desc: Appends code and redirects COM entry
    crit: suspicious
    conf: 0.97
    if:
      type: hex
      pattern: "B8 02 42 CD 21 50 B9 ?? ?? [0-8] BA ?? ?? [0-4] B4 40 CD 21 (33|31) C9 (33|31) D2 B0 00 B4 42 CD 21 58 2D 03 00 C6 86 ?? ?? E9 89 86 ?? ?? [0-2] BA ?? ?? [0-4] B9 03 00 B4 40 CD 21"
      offset_range: [0, 4096]

  - id: objectives/impact/infect/binary/dos/file::com-call-append-and-entry-jump
    desc: Appends COM body and redirects entry
    crit: suspicious
    conf: 0.97
    if:
      type: hex
      pattern: "B8 02 42 E8 ?? ?? [0-10] 89 ?? ?? [0-4] B9 ?? ?? [0-4] E8 ?? ?? [0-6] E8 ?? ?? (B1 03|B9 03 00) [0-4] 8D ?? ?? [0-2] E8 ?? ??"
      offset_range: [0, 4096]

  # Seek helper variant: seek to EOF through a near call, subtract the JMP
  # length from the returned host size, store the displacement, seek back to
  # offset zero, write the three-byte entry, then seek to EOF and write the
  # body directly via INT 21h. Body length and buffer offsets vary.
  - id: objectives/impact/infect/binary/dos/file::com-seek-call-entry-jump-then-append
    desc: Writes host-length entry jump, then appends body
    crit: suspicious
    conf: 0.95
    if:
      type: hex
      pattern: "B8 02 42 E8 ?? ?? 2D 03 00 89 [1-3] B8 00 42 E8 ?? ?? [0-4] B4 40 B9 03 00 [0-8] CD 21 [0-4] B8 02 42 E8 ?? ?? [0-4] B4 40 B9 ?? ?? [0-8] CD 21"
      offset_range: [0, 4096]

  # Split header writes: save EOF-3 at buffer+2, write one opcode byte at
  # BOF, then that displacement at offset one, and append the body at EOF.
  # Bind the displacement source to the calculated buffer; addresses and
  # body length are relocation/build details rather than identities.
  - id: com-split-entry-jump-append
    desc: Split COM entry rewrite with body append
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule com_split_entry_jump_append {
          strings:
            $calc = { 8D 1E ?? ?? 26 03 1E 00 00 2D 03 00 2E 89 47 02 }
            $write = { B9 01 00 B4 40 8D 16 ?? ?? 26 03 16 00 00 CD 21
                       [0-8] B9 00 00 BA 01 00 B0 00 B4 42 [0-16] CD 21
                       B4 40 B9 02 00 8D 16 ?? ?? 26 03 16 00 00 83 C2 02
                       [0-16] CD 21 }
            $disp = { B4 40 B9 02 00 8D 16 ?? ?? 26 03 16 00 00 83 C2 02 [0-16] CD 21 }
            $append = { B9 00 00 BA 00 00 B0 02 [0-16] B4 42 CD 21
                        B4 40 [0-16] B9 ?? ?? 8D 16 00 01 26 03 16 00 00 CD 21 }
          condition:
            for any c in (1..#calc) : (
              for any w in (1..#write) : (
                @write[w] > @calc[c] and @write[w] < @calc[c] + 256 and
                for any d in (1..#disp) : (
                  @disp[d] > @write[w] and @disp[d] < @write[w] + !write[w] and
                  uint16(@calc[c] + 2) == uint16(@disp[d] + 7)
                ) and
                for any a in (1..#append) : (
                  @append[a] > @write[w] and @append[a] < @write[w] + 256
                )
              )
            )
        }

composite_rules:
  - id: dos-com-bp-entry-append-infector
    desc: Searches hosts, redirects entry and appends code
    crit: hostile
    conf: 0.98
    all:
      - id: com-bp-entry-jump-then-append
      - id: micro-behaviors/fs/search::dos-int21-find-first-call

  - id: dos-com-buffer-entry-infector
    desc: Searches files and writes entry-redirecting COM headers
    crit: hostile
    conf: 0.97
    all:
      - id: com-buffer-entry-jump-patch
      - id: micro-behaviors/fs/search::dos-int21-find-first-call
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write-call
      - id: micro-behaviors/fs/search::dos-int21-find-next

  - id: dos-com-append-entry-infector
    desc: Searches hosts and appends entry-redirecting code
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/search::dos-int21-find-first-call
    any:
      - id: com-indirect-entry-jump-write
      - id: com-split-entry-jump-append
      - id: objectives/impact/infect/binary/dos/file::com-append-and-entry-jump
      - id: objectives/impact/infect/binary/dos/file::com-call-append-and-entry-jump
      - id: objectives/impact/infect/binary/dos/file::com-seek-call-entry-jump-then-append
