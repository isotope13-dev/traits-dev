# Direct-action and resident DOS COM infectors. The bytes are the DOS
# services themselves: find a host, write into it, or save and replace the
# INT 21h vector. Names and campaign markers are not part of the match.
# MOV AH,imm8 and MOV AX,imm16 are separate patterns: a hex alternative
# shorter than 3 concrete bytes is rejected.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib]
  attack: T1080
  size_max: 65536

traits:
  - id: objectives/impact/infect/binary/dos/file::dos-com-mask-stosb
    for: [dos_com, static-lib, data]
    desc: DOS builds a COM search mask
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B0 2A [0-4] AA [0-8] B0 2E [0-6] AA [0-8] B0 43 [0-6] AA"
  - id: objectives/impact/infect/binary/dos/file::dos-read-three-bytes
    desc: DOS reads the first three bytes
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 3F [0-6] (B9 03 00|B1 03) [0-12] CD"
  - id: objectives/impact/infect/binary/dos/file::dos-cmp-open-update
    desc: DOS checks for an update open
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "3D 02 3D"
  - id: objectives/impact/infect/binary/dos/file::dos-xor-byte-loop
    desc: DOS xor-decrypts a byte buffer
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "8A 27 [0-2] 32 26 [0-4] 88 27 [0-2] 43"
  - id: objectives/impact/infect/binary/dos/file::dos-bump-then-create
    desc: DOS bumps a name then creates
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "2E FE 86 [0-6] B4 3C [0-8] CD"
  - id: objectives/impact/infect/binary/dos/file::dos-hard-disk-call
    desc: DOS calls the first hard disk
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B2 80 [0-8] CD 13"
  - id: objectives/impact/infect/binary/dos/file::dos-ah-nine-minus-six
    desc: DOS turns AH nine into a write
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 09 [0-4] 80 EC 06"
  - id: objectives/impact/infect/binary/dos/file::dos-biased-service
    desc: DOS subtracts 2020h from the service
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "2D 20 20 [0-8] CD 21"
  - id: objectives/impact/infect/binary/dos/file::dos-load-dpb
    desc: DOS loads a disk parameter block
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "26 C5 1F"
  - id: objectives/impact/infect/binary/dos/file::dos-push-dpb-link
    desc: DOS reads the next buffer link
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "26 FF 77 FE"
  - id: objectives/impact/infect/binary/dos/file::dos-copy-59
    desc: DOS copies a 59-byte body
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B1 3B F3 A4"
  - id: objectives/impact/infect/binary/dos/file::dos-marker-write-59
    desc: DOS writes 59 bytes on a jump
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "3D E9 40 [0-8] B9 3B 00 CD 21"

  - id: objectives/impact/infect/binary/dos/file::dos-com-entry-ret-redirect
    for: [dos_com, static-lib, data]
    desc: COM redirects its entry point through RET
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "BA ?? ?? 52 C3"
      offset: 0

  # Resident search handlers subtract the appended virus size from the DTA
  # file length before returning the directory entry to DOS.
  - id: objectives/impact/infect/binary/dos/file::dos-dta-size-hide
    for: [dos_com, static-lib, data]
    desc: DOS hides appended bytes from directory searches
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: "26 81 2F ?? ?? 26 19 7F 02"

  # Get-DTA / DTA+1Ah / subtract an appended image length with borrow into
  # the high word. This is the SI-based form used by Week.1614.
  - id: objectives/impact/infect/binary/dos/file::dos-dta-size-hide-si
    for: [dos_com, static-lib, data]
    desc: DOS subtracts appended bytes from DTA size
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: "B4 2F CD 21 83 C3 18 8B F3 46 46 06 1F [0-32] 81 2C 4E 06 83 5C 02 00"

  # ES:BX points to the standard DOS DTA. Subtracting a fixed word at 1Ah
  # and borrowing into 1Ch hides an appended body from file search results.
  # Disp8 (6F/5F) and disp16 (AF/9F) are the same [BX+disp] encoding.
  - id: objectives/impact/infect/binary/dos/file::dos-dta-size-hide-es-bx
    for: [dos_com, static-lib, data]
    desc: DOS subtracts appended length from DTA size
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: "(26 81 6F 1A ?? ?? 26 83 5F 1C 00|26 81 AF 1A 00 ?? ?? 26 83 9F 1C 00 00)"

  # FCB search results (AH=11h/12h) keep the time byte and the size dword at
  # a header-dependent displacement. AND with E0h clears the low five bits
  # (the seconds infection marker) and SUB/SBB of a constant hides the
  # appended length. The borrow uses AX, which the marker test left at zero.
  - id: objectives/impact/infect/binary/dos/file::dos-fcb-search-marker-size-hide
    for: [dos_com, static-lib, data]
    desc: DOS clears search time and hides length
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: "26 80 67 ?? E0 [0-6] 26 81 6F ?? ?? ?? 26 19 47 ??"

  # MOV CX,count / XOR CX,imm / MOV AH,service / XOR AH,imm / CALL dispatch /
  # compare written bytes with CX is a compact obfuscated INT 21h write.
  - id: objectives/impact/infect/binary/dos/file::dos-xor-obfuscated-body-append
    for: [dos_com, static-lib, data]
    desc: DOS appends an XOR-obfuscated body
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: "B9 ?? ?? 81 F1 ?? ?? B4 ?? 80 F4 ?? E8 ?? ?? 3B C1"

  # Open the default DTA filename read/write; carry the returned handle in
  # BX and turn DX=009Eh into DX=0100h, the program image, before writing.
  # This binds the selected file to self-image overwriting at offset zero.
  # The masked variant computes DX=BC1Bh-BB1Bh=0100h and AH=4Fh-0Fh=40h;
  # its arbitrary transfer count is not part of the signature.
  - id: objectives/impact/infect/binary/dos/file::dos-extension-scasb-patch
    for: [dos_com, static-lib, data]
    desc: DOS scans filename dot to patch extension
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "B0 2E [0-4] F2 AE [0-4] (A5 A4|F3 A4|A4)"

  # SillyO-style droppers carry a batch companion virus as data and write it
  # into the files their INT 21h search finds. The batch text is a FOR loop
  # whose body copies `%0`, the running script, over every match -- inert in
  # a COM image unless the program writes it out.
  - id: objectives/impact/infect/binary/dos/file::dos-embedded-batch-self-copy-loop
    for: [dos_com, static-lib, data]
    desc: DOS image carries a batch self-copy loop
    crit: notable
    conf: 0.92
    size_max: 65536
    if:
      type: text
      regex: '(?i)\bfor\s+%%[a-z]\s+in\s*\([^)\n]{0,40}\*\.\w{1,4}\)\s*do\s+(copy|type)\s+"?%0'

  # Bind encoded instructions to the key and target of the entry decoder, then
  # require a coherent search/read/append/entry-write sequence in that body.
  # The XORed wildcard or DOS calls alone are ordinary capabilities.
  - id: dos-entry-xor-com-appending-infector
    for: [dos_com, data]
    desc: XOR body appends and redirects COM hosts
    crit: hostile
    conf: 0.99
    mbc: B0032
    if:
      type: hex
      # The entry jump reaches a counted XOR decoder. Encrypted code
      # signatures follow in order: COM search/open/read, MZ/ZM and
      # infection-marker screening, EOF seek, self-copy, append, seek to zero,
      # four-byte host-header write, and close/find-next. The mask literal
      # follows the code and uses decoder key 0x10. Each gap is capped so the
      # signatures stay close to this decoded code path.
      offset: 0
      pattern: 'E9 F1 00 [241-241] B9 D7 00 B0 10 BE FF 01 E8 D7 00 [0-40] A4 5E 23 D9 [0-40] A8 12 2D [0-40] A4 2F A9 14 10 [0-40] 91 AE F2 11 4A 5D 64 72 [0-40] 91 AE F2 11 5D 4A 64 4A [0-40] 90 AE F5 11 46 64 43 [0-40] A8 12 52 23 D9 89 [0-40] A9 F8 10 E3 B4 [0-40] A4 50 [0-40] A8 10 52 23 D9 89 [0-40] A4 50 [0-40] A9 14 10 DD 31 [0-40] A4 2E DD 31 [0-40] A4 5F DD 31 [0-40] 3A 3E 73 7F 7D 10 [0-40] 30 04 46 E2 FB C3'

  # A resident COM infector can copy its body to a temporary DOS memory
  # block, transform that copy, append it through the open host handle, and
  # write a near-jump over the host entry. The two writes are the decisive
  # relationship: the three-byte E9 patch redirects the host, while the
  # copied body is written at offset 3 after the image-copy loop. Wildcarded
  # data addresses and lengths avoid binding the rule to one specimen's
  # layout or payload size.
  - id: dos-resident-com-copy-append-entry-patch
    for: [dos_com, static-lib, data]
    desc: DOS copies, appends, and redirects COM hosts
    crit: hostile
    conf: 0.98
    mbc: B0032
    if:
      type: yara
      source: |
        rule dos_resident_com_copy_append_entry_patch {
          meta:
            filetypes = "com,dos,static-lib,data"
          strings:
            $entry = { C6 06 ?? ?? E9 [0-16] B4 40 B9 03 00 BA ?? ?? CD 21 }
            $alloc = { B4 48 BB ?? ?? CD 21 }
            $copy = { 8E 06 ?? ?? 33 FF BE ?? ?? B9 ?? ?? F3 A4 }
            $append = { B4 40 B9 ?? ?? 06 1F BA 03 00 CD 21 }
          condition:
            $entry and $alloc and $copy and $append and
            for any c in (1..#copy) : (
              for any a in (1..#append) : (
                @append[a] > @copy[c] and @append[a] <= @copy[c] + 512
              )
            )
        }

composite_rules:
  - id: objectives/impact/infect/binary/dos/file::dos-com-directory-infector
    desc: DOS file search with host-altering write sequences
    crit: hostile
    conf: 0.96
    for:
    - dos_com
    - static-lib
    - data
    size_max: 1048576
    all:
    - id: micro-behaviors/fs/search/command::dos-int21-find-first-call
    - id: micro-behaviors/fs/write/file/handle/int21::dos-int21-write-call
    - id: objectives/impact/infect/binary/dos/file::dos-host-altering-write-admission
    any:
    - id: micro-behaviors/fs/write/file/handle/int21::dos-image-or-extension-patched-file-write
    - id: dos-seek-write-infector
    unless:
    - id: objectives/impact/infect/binary/dos/file::dos-com-companion-infector
    - id: micro-behaviors/fs/file/rename::dos-rename-host-build-batch-wrapper
    - id: micro-behaviors/fs/write/file/binary::dos-dta-cell-sized-own-image-overwrite-loop

  - id: objectives/impact/infect/binary/dos/file::dos-batch-companion-dropper
    for: [dos_com, static-lib, data]
    desc: DOS program writes a self-copying batch virus
    crit: hostile
    conf: 0.95
    size_max: 65536
    all:
      - id: objectives/impact/infect/binary/dos/file::dos-embedded-batch-self-copy-loop
      - id: micro-behaviors/fs/search/command::dos-int21-find-first
      - id: micro-behaviors/fs/write/file/handle/int21::dos-int21-write
  - id: objectives/impact/infect/binary/dos/file::dos-com-near-call-infector
    desc: DOS COM appends an infector through calls
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/file/seek::dos-seek-end-e8
      - id: metadata/binary/code/control-transfer::x86-ah40-e8-byte-proximity
      - id: micro-behaviors/fs/search/command::dos-executable-compatible-wildcard
      - id: metadata/binary/code/control-transfer::entry-near-jump-bytes

  # XOR-decoded COM bodies can hide all of the direct MOV AH,service
  # signatures. A decoder, a COM target mask, and indirect buffer transfer
  # through INT 21h provide a strong file-infection chain.
  - id: objectives/impact/infect/binary/dos/file::dos-xor-indirect-com-infector
    for: [dos_com, data]
    desc: DOS XOR-decodes and writes COM infection payloads
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::dos-fixed-key-xor-si-loop
      - id: micro-behaviors/fs/search/command::dos-executable-compatible-wildcard
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-indirect-ah-call
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-indirect-buffer-transfer

  # Headerless COM bodies sniff as data; three distinct INT 21h service
  # sequences (get vector, set vector, write/find) are not coincidental.
  - id: objectives/impact/infect/binary/dos/file::dos-timestamped-file-write
    desc: Host writes with timestamp-setting sequences
    crit: hostile
    conf: 0.95
    all:
    - id: micro-behaviors/fs/file/open/unspecified::dos-int21-open-or-create-call
    - id: micro-behaviors/fs/write/file/handle/int21::dos-int21-write-call
    - id: micro-behaviors/fs/file/timestamp::dos-int21-set-file-time
    - id: objectives/impact/infect/binary/dos/file::dos-host-altering-write-admission
    any:
    - id: micro-behaviors/fs/read/file/handle::dos-int21-read-call
    - id: micro-behaviors/fs/file/seek::dos-int21-seek-call
    needs: 1
    unless:
    - id: micro-behaviors/fs/write/file/append::dos-encrypted-body-append-header-redirect

  # Admission supplies a host-altering strategy; the seek can rewind or append.
  # Neither relocation nor an EOF seek is required by these alternatives.
  - id: objectives/impact/infect/binary/dos/file::dos-seek-write-infector
    desc: DOS host-write strategy with seek/write setup
    crit: hostile
    conf: 0.95
    all:
    - id: micro-behaviors/fs/file/seek::dos-seek-dispatch
    - id: micro-behaviors/fs/write/file/handle/int21::dos-write-dispatch
    - id: objectives/impact/infect/binary/dos/file::dos-host-altering-write-admission
    any:
    - id: micro-behaviors/fs/file/open/write::dos-open-update-dispatch
    - id: objectives/impact/infect/binary/dos/file::dos-read-three-bytes
    needs: 1
    unless:
    - id: micro-behaviors/fs/write/file/append::dos-encrypted-body-append-header-redirect

  - id: objectives/impact/infect/binary/dos/file::dos-seek-append-near-call-infector
    for: [dos_com, static-lib, data]
    desc: DOS appends a body through near calls
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/fs/file/seek::dos-seek-end-e8
      - id: metadata/binary/code/control-transfer::x86-ah40-e8-byte-proximity
    any:
      - id: micro-behaviors/fs/file/open/write::dos-open-update-dispatch
      - id: micro-behaviors/fs/file/open/write::dos-open-update-e8
      - id: metadata/binary/code/control-transfer::dos-al-two-near-call

  # Resident infector that patches the IVT directly, then filters EXEC or
  # FCB directory calls in its handler and writes into files. Also untyped
  # `data`: headerless resident bodies sniff that way, and filler-padded
  # ones sniff as `text`. The store leg covers bodies that read the old
  # vector far from where they patch it.
  - id: objectives/impact/infect/binary/dos/file::dos-dpb-pointer
    desc: DOS follows a disk buffer link
    crit: notable
    conf: 0.9
    any:
      - id: objectives/impact/infect/binary/dos/file::dos-load-dpb
      - id: objectives/impact/infect/binary/dos/file::dos-push-dpb-link
  - id: objectives/impact/infect/binary/dos/file::dos-dpb-chain-infector
    desc: DOS patches through the disk buffers
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/msdos/internal::list-of-lists-dispatch
      - id: objectives/impact/infect/binary/dos/file::dos-dpb-pointer
  - id: objectives/impact/infect/binary/dos/file::dos-stub-append-infector
    desc: DOS appends through relocated calls
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/fs/file/seek::dos-seek-int-stub
      - id: micro-behaviors/fs/write/file/handle/int21::dos-int21-write-return-stub
      - id: metadata/binary/code/control-transfer::dos-al-two-near-call
  - id: objectives/impact/infect/binary/dos/file::dos-decrypted-body-write
    desc: DOS writes a decrypted body
    crit: hostile
    conf: 0.94
    all:
      - id: objectives/impact/infect/binary/dos/file::dos-xor-byte-loop
      - id: micro-behaviors/fs/write/file/handle/int21::dos-write-dispatch
  - id: objectives/impact/infect/binary/dos/file::dos-mutated-name-drop
    desc: DOS writes under a mutated name
    crit: hostile
    conf: 0.93
    all:
      - id: objectives/impact/infect/binary/dos/file::dos-bump-then-create
      - id: micro-behaviors/fs/write/file/handle/int21::dos-write-dispatch
  - id: objectives/impact/infect/binary/dos/file::dos-hard-disk-sector-write
    desc: DOS writes a hard-disk sector
    crit: hostile
    conf: 0.94
    all:
      - id: objectives/impact/infect/binary/dos/file::dos-hard-disk-call
      - id: objectives/impact/infect/binary/dos/file::dos-ah-nine-minus-six
  - id: objectives/impact/infect/binary/dos/file::dos-biased-service-seek
    desc: DOS seeks after a biased service
    crit: hostile
    conf: 0.93
    all:
      - id: objectives/impact/infect/binary/dos/file::dos-biased-service
      - id: micro-behaviors/fs/file/seek::dos-seek-dispatch
  - id: objectives/impact/infect/binary/dos/file::dos-tiny-body-write
    desc: DOS copies and writes a 59-byte body
    crit: hostile
    conf: 0.93
    all:
      - id: objectives/impact/infect/binary/dos/file::dos-copy-59
      - id: objectives/impact/infect/binary/dos/file::dos-marker-write-59

  # Encrypted appender: the entry redirect hands control to a
  # position-independent stub that XOR-decrypts the virus body in place. Each
  # leg is individually explainable (clean COMs redirect entries, packers
  # decrypt), but the three together are the parasitic infection shape.
  - id: objectives/impact/infect/binary/dos/file::dos-parasitic-encrypted-infector
    for: [dos_com, data]
    desc: DOS virus hides behind an encrypted body
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/binary/code/control-transfer::entry-near-jump-bytes
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-xor-loop-dispatch
    any:
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-delta-offset-dispatch
      - id: metadata/binary/code/control-transfer::dos-register-setup-near-call

  - id: objectives/impact/infect/binary/dos/file::dos-com-entry-self-modifying-xor-decoder
    for: [dos_com, data]
    desc: COM redirects through a self-modifying XOR decoder
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/impact/infect/binary/dos/file::dos-com-entry-ret-redirect
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-self-modifying-xor-si-dx-loop
  # Masked forms of the two halves: every service number is
  # arithmetic-masked, so the search shows up as a COM search mask beside
  # masked INT 21h loads, and the write as a sized transfer on the handle
  # the masked open returned.
  - id: objectives/impact/infect/binary/dos/file::dos-com-masked-search
    for: [dos_com, static-lib, data]
    desc: DOS masked calls search for COM files
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/fs/search/command::dos-executable-compatible-wildcard
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-masked-service-calls
  - id: objectives/impact/infect/binary/dos/file::dos-com-masked-handle-transfer
    for: [dos_com, static-lib, data]
    desc: DOS masked calls transfer bytes on a handle
    crit: notable
    conf: 0.88
    all:
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-masked-service-calls
      - id: micro-behaviors/os/msdos/interrupt::int21-result-bx-cx-sequence
  - id: dos-com-first-match-overwriter
    for: [dos_com, data]
    desc: DOS overwrites search result with its COM code
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/write/file/handle/int21::dos-com-self-image-handle-write
    any:
      - id: micro-behaviors/fs/search/command::dos-int21-find-first-call
      - id: dos-com-masked-search
  # Literal-service-number form (Trivial.23, 23 bytes): entry mask, DTA
  # open/create, and interrupt-result-to-write-handle with no masking at
  # all. Require image transfer or a destructive loop, not write setup alone.
  - id: objectives/impact/infect/binary/dos/file::dos-com-entry-dta-overwriter
    for: [dos_com, data, c]
    desc: DOS overwrites files found by an entry mask
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/search/command::dos-entry-mask-find-first
      - id: micro-behaviors/fs/file/open/unspecified::dos-int21-open-dta-filename
    any:
      - id: micro-behaviors/fs/write/file/handle/int21::dos-image-or-extension-patched-file-write
      - id: objectives/impact/infect/binary/dos/interrupt::dos-search-destroy-loop
  - id: objectives/impact/infect/binary/dos/file::dos-xor-byte-loop-decoder
    for: [dos_com]
    desc: DOS XOR byte loop decodes a body
    crit: notable
    conf: 0.9
    all:
      - id: objectives/impact/infect/binary/dos/file::dos-xor-byte-loop
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-xor-loop-dispatch
  # The entry JMP lands on a decoder that rewrites its own instructions
  # before decrypting the appended body: either a plain XOR byte loop, or
  # (Artem) a loop whose first byte is patched from RETF into XOR at run time.
  - id: objectives/impact/infect/binary/dos/file::dos-com-self-modifying-xor-infector
    desc: DOS COM redirects execution into an encrypted self-modifying body
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/binary/code/control-transfer::entry-near-jump-bytes
    any:
      - id: objectives/impact/infect/binary/dos/file::dos-xor-byte-loop-decoder
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-patched-retf-xor-decryptor
  - id: objectives/impact/infect/binary/dos/file::dos-com-lodsw-dispatch-overwriter
    for: [dos_com, data]
    desc: DOS search truncates files and writes itself
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/search/command::dos-executable-compatible-wildcard
      - id: micro-behaviors/fs/write/file/handle/int21::dos-int21-handle-write-setup
      - id: micro-behaviors/os/syscall/invoke::dos-lodsw-dx-dispatch-loop

  - id: objectives/impact/infect/binary/dos/file::dos-com-dta-overwriter
    for:
    - dos_com
    - data
    desc: DOS overwrites DTA files matching wildcard
    crit: hostile
    conf: 0.96
    all:
    - id: micro-behaviors/fs/search/command::dos-executable-compatible-wildcard
    - id: micro-behaviors/fs/file/open/unspecified::dos-int21-open-dta-filename
    - id: micro-behaviors/fs/write/file/handle/int21::dos-int21-handle-write-setup
    any:
    - id: micro-behaviors/fs/write/file/binary::dos-default-dta-open-image-write-close
    - id: micro-behaviors/fs/write/file/handle/int21::dos-com-self-image-handle-write
