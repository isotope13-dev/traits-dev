# Direct-action COM overwriters rewind the found file to offset zero and
# write the running image (DS:0100h) over its start. MOV AX,4200h leaves AX
# positive, so CWD (99h) zeroes DX in one byte instead of XOR DX,DX. PUSHAW,
# a short jump, and POPAW keep AH=40h across the gap, so the write interrupt
# is not adjacent to the service load.
defaults:
  for: [dos_com, data]
  platforms: [windows, unix]
  attack: T1080
  size_max: 65536

traits:
  - id: dos-cwd-rewind-pusha-image-write
    desc: DOS rewinds file and writes image
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: "B8 00 42 [0-8] (33|31) C9 [0-2] 99 [0-2] CD 21 [0-6] B4 40 [0-4] (B9 ?? ?? BA 00 01|BA 00 01 B9 ?? ??) [0-4] 60 EB ?? [0-40] 61 CD 21"

composite_rules:
  - id: dos-searched-cwd-image-overwriter
    desc: DOS overwrites searched files with itself
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/search::dos-int21-find-first-call
      - id: micro-behaviors/fs/file/open::dos-int21-open-dta-filename
      - id: objectives/impact/infect/binary/dos/file::dos-cwd-rewind-pusha-image-write
