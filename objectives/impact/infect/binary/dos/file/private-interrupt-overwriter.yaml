# Bind the find-first success path to the overwrite subroutine. The program
# copies the INT 21h vector to INT 1 before issuing DOS calls through INT 1.
defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_max: 65536
traits:
  - id: dos-private-interrupt-com-overwriter
    desc: Overwrites COM files via redirected interrupt
    crit: hostile
    conf: 0.99
    attack: T1080
    if:
      type: yara
      source: |
        rule dos_private_interrupt_com_overwriter {
          strings:
            $mask = "*.COM" ascii nocase
            $vector = { A1 84 00 A3 04 00 A1 86 00 A3 06 00 }
            $find = { B4 4E B9 ?? ?? CD 01 73 ?? EB ?? E8 ?? ?? }
            $write = { E8 ?? ?? BA ?? ?? E8 ?? ?? B8 00 43 CD 01 89 0E ?? ?? 33 C9 B8 01 43 CD 01 B8 02 3D CD 01 72 ?? 93 B8 00 57 CD 01 89 16 ?? ?? 89 0E ?? ?? BA 00 01 B4 40 B9 ?? ?? CD 01 B8 01 57 }
          condition:
            $mask and $vector and
            for any f in (1..#find) : (
              for any w in (1..#write) : (
                @write[w] == @find[f] + 14 + int16(@find[f] + 12)
              )
            )
        }
