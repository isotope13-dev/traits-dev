# Direct-action and resident DOS COM infectors. The bytes are the DOS
# services themselves: find a host, write into it, or save and replace the
# INT 21h vector. Names and campaign markers are not part of the match.
# MOV AH,imm8 and MOV AX,imm16 are separate patterns: a hex alternative
# shorter than 3 concrete bytes is rejected.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib]
  attack: T1080
  size_max: 65536

traits:
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-find-first
    for: [dos_com, static-lib, data]
    desc: DOS find-first via INT 21h
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 4E [0-32] CD 21"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-find-first-ax
    for: [dos_com, static-lib, data]
    desc: DOS find-first via MOV AX
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 ?? 4E [0-32] CD 21"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-find-first-near
    for: [dos_com, static-lib, data]
    desc: DOS find-first through a near call
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 4E [0-12] E8"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-find-next
    for: [dos_com, static-lib, data]
    desc: DOS find-next via INT 21h
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 4F [0-32] CD 21"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-find-next-ax
    for: [dos_com, static-lib, data]
    desc: DOS find-next via MOV AX
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 ?? 4F [0-32] CD 21"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-find-next-near
    for: [dos_com, static-lib, data]
    desc: DOS find-next through a near call
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 4F [0-8] E8"

  # Find-next jumping back to share the find-first INT 21h call.
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-find-next-jump
    for: [dos_com, static-lib, data]
    desc: DOS find-next jumps to the call
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 4F EB"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-find-next-near-jump
    for: [dos_com, static-lib, data]
    desc: DOS find-next jumps to a shared call
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 4F E9 ?? ??"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-write
    for: [dos_com, static-lib, data]
    desc: DOS writes a file via INT 21h
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 40 [0-32] CD 21"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-write-ax
    for: [dos_com, static-lib, data]
    desc: DOS write via MOV AX
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B8 ?? 40 [0-32] CD 21"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-write-near
    for: [dos_com, static-lib, data]
    desc: DOS write through a near call
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 40 [0-12] E8"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-write-far
    for: [dos_com, static-lib, data]
    desc: DOS write through a far call
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 40 [0-16] 2E FF 1E"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-set-vector-ah
    for: [dos_com, static-lib, data]
    desc: DOS set-vector via MOV AH
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 25 [0-8] CD 21"

  # Resident handlers often invoke the saved original INT 21h pointer with
  # PUSHF / CALL FAR [ptr] instead of executing INT 21h directly.
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-open-update-saved-vector
    for: [dos_com, static-lib, data]
    desc: DOS update-open via a saved handler
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: "B4 3D B0 82 [0-16] 9C [0-1] FF 1E ?? ??"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-read-saved-vector
    for: [dos_com, static-lib, data]
    desc: DOS read via a saved handler
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 3F [0-16] 9C [0-1] FF 1E ?? ??"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-seek-eof-saved-vector
    for: [dos_com, static-lib, data]
    desc: DOS seek-to-EOF via a saved handler
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "B8 02 42 [0-16] 9C [0-1] FF 1E ?? ??"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-write-saved-vector
    for: [dos_com, static-lib, data]
    desc: DOS write via a saved handler
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: "B4 40 [0-24] 9C [0-1] FF 1E ?? ??"

  # DOS COM infectors can keep INT 21h service numbers in a table and load
  # AH from memory immediately before the interrupt, hiding the usual
  # MOV AH,imm8 signatures.
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-indirect-ah-call
    for: [dos_com, static-lib, data]
    desc: DOS table-loaded INT 21h call
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "8A 26 ?? ?? [0-32] CD 21"

  # CX carries the transfer length and DX points to the buffer in this
  # common indirect DOS file-write shape. The service number itself comes
  # from the table loaded into AH.
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-indirect-buffer-transfer
    for: [dos_com, static-lib, data]
    desc: DOS indirect service buffer transfer
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "8A 26 ?? ?? B9 ?? ?? 8B 16 ?? ?? [0-12] CD 21"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-find-first-jump
    for: [dos_com, static-lib, data]
    desc: DOS find-first after a short jump
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 4E EB [0-40] CD 21"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-open
    desc: DOS opens a file via INT 21h
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "B4 3D [0-16] CD 21"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-open-ax
    desc: DOS open via MOV AX
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "B8 ?? 3D [0-16] CD 21"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-read
    desc: DOS reads a file via INT 21h
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "B4 3F [0-16] CD 21"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-read-ax
    desc: DOS read via MOV AX
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "B8 ?? 3F [0-16] CD 21"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-seek
    desc: DOS seeks within a file
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 42 [0-8] CD 21"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-seek-ax
    desc: DOS seek via MOV AX
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B8 ?? 42 [0-12] CD 21"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-set-file-time
    desc: DOS sets a file timestamp
    crit: notable
    conf: 0.9
    # EXE-prefixed virus bodies sniff as data; dos-int26 composites gate on it.
    for: [dos_com, static-lib, data]
    if:
      type: hex
      pattern: "(B8 01 57|B4 57 B0 01) [0-8] CD 21"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-get-int21-vector
    for: [dos_com, static-lib, data]
    desc: DOS reads the INT 21h vector
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 21 35 [0-8] CD 21"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-set-int21-vector
    for: [dos_com, static-lib, data]
    desc: DOS installs a new INT 21h handler
    crit: suspicious
    conf: 0.93
    if:
      type: hex
      pattern: "B8 21 25 [0-8] CD 21"

  # INT 21h handler filter: CMP AX,4B00h / CMP AH,4Bh then JZ/JNZ, including
  # the INC AH; CMP AH,4Ch bias variant. Callers load AX with MOV; only a
  # hooked handler compares it to catch execution.
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-exec-intercept
    desc: DOS handler intercepts program exec
    crit: notable
    conf: 0.88
    # Headerless resident bodies sniff as data; see dos-ivt-int21-swap.
    for: [dos_com, static-lib, data]
    if:
      type: hex
      pattern: "(3D 00 4B|80 FC 4B|FE C4 80 FC 4C [0-6]) (74|75)"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int13-vector-swap
    desc: DOS swaps the disk service vector
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "87 06 4C 00"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-open-update-far
    # Device-driver and headerless bodies sniff as data.
    for: [dos_com, static-lib, data]
    desc: DOS opens for update through a vector
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 02 3D 9C 2E FF 1E"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-seek-end-far
    for: [dos_com, static-lib, data]
    desc: DOS seeks to end through a vector
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 02 42 [0-8] 9C 2E FF 1E"

  # Shared seek helper: MOV AH,42h then PUSHF (optionally CLI) and a far
  # call through the saved original INT 21h vector.
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-seek-via-farcall
    desc: DOS seeks through a saved vector
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 42 [0-6] 9C [0-1] 2E FF 1E"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-write-via-farcall
    for: [dos_com, static-lib, data]
    desc: DOS writes through a saved vector
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 40 [0-6] 9C 2E FF 1E"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-ivt-int21-swap-imm
    desc: DOS swaps IVT INT 21h vector
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "(C4|C5) ?? 84 00 [0-32] C7 06 84 00"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-ivt-int21-swap-reg
    desc: DOS swaps INT 21h vector via register
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "(C4|C5) ?? 84 00 [0-32] (89|8C) ?? 84 00"

  # Installs a handler by storing offset then segment straight into the
  # IVT slot at 0000:0084 (MOV [0084],reg / MOV [0086],sreg).
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-ivt-int21-store
    desc: DOS stores a handler in the IVT
    crit: notable
    conf: 0.9
    for: [dos_com, static-lib, data]
    if:
      type: hex
      pattern: "89 ?? 84 00 [0-4] 8C ?? 86 00"

  # MOV BX,0084 / LES|LDS r,[BX] / MOV WORD [BX],imm / MOV [BX+2],reg:
  # reads the old INT 21h vector and patches the slot through BX.
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-ivt-int21-swap-bx
    desc: DOS swaps INT 21h vector via BX
    crit: notable
    conf: 0.9
    for: [dos_com, static-lib, data]
    if:
      type: hex
      pattern: "BB 84 00 (C4|C5) ?? [0-8] C7 07 ?? ?? (89|8C) ?? 02"

  # Installs a handler by storing segment then immediate offset into the
  # IVT slot at 0000:0084 (MOV [0086],sreg|reg / MOV WORD [0084],imm).
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-ivt-int21-store-seg-imm
    desc: DOS stores IVT handler segment first
    crit: notable
    conf: 0.9
    for: [dos_com, static-lib, data]
    if:
      type: hex
      pattern: "(8C|89) ?? 86 00 [0-4] C7 06 84 00"

  # CMP AH,11h / CMP AH,12h: FCB find-first/next, hooked for size stealth.
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-fcb-find-intercept
    desc: DOS handler intercepts FCB dir search
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "80 FC 11 (74|75) ?? 80 FC 12 (74|75)"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-xor-find-first
    for: [dos_com, static-lib, data]
    desc: DOS find-first with XOR service number
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "B4 4E 34 ?? [0-24] CD 21"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-xor-open-readwrite
    for: [dos_com, static-lib, data]
    desc: DOS read/write open with XOR service number
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "B4 3F 34 ?? [0-24] CD 21"
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-subtract-obfuscated-write
    for: [dos_com, static-lib, data]
    desc: DOS file write with subtract-obfuscated service
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "B4 40 2D ?? [0-24] CD 21"

  # The sample's copy installs INT 21h offset and segment with ES overrides.
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-ivt-int21-store-segment-override
    for: [dos_com, static-lib, data]
    desc: DOS stores INT 21h vector through ES
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: "26 C7 06 84 00 ?? ?? 26 8C 1E 86 00"

  # XOR AH,1Ah before comparing AH with 54h/55h identifies an INT 21h handler
  # intercepting find-first/find-next (actual services 4Eh/4Fh).
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-xor-directory-search-intercept
    for: [dos_com, static-lib, data]
    desc: DOS intercepts directory search with XOR service
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "80 F4 1A [0-64] 80 FC 54 ?? ?? 80 FC 55"

  # Installs INT 21h and INT 16h handlers by calling the shared DOS
  # AH=25h vector-setting helper with each vector number and handler address.
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-int16-vector-install-pair
    for: [dos_com, static-lib, data]
    desc: DOS installs DOS and keyboard interrupt hooks
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "B0 21 BA ?? ?? BF ?? ?? E8 ?? ?? B0 16 BA ?? ?? BF ?? ?? E8 ?? ??"

  # This handler swaps AH into AL, scans a compact service-number table, and
  # dispatches matches through a jump table. The values include find-first,
  # find-next and FCB searches, so it covers non-CMP based dispatchers.
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-table-directory-search-dispatch
    for: [dos_com, static-lib, data]
    desc: DOS table dispatches INT 21h search calls
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: "BF C5 02 86 E0 B9 07 00 90 FC 06 0E 07 F2 AE [0-64] 3D 4B 57 4E 4F 11 12"

  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int8-vector-install-direct
    desc: DOS installs an INT 8 timer handler
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "C7 06 20 00 C0 02 8C 06 22 00"

  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int1c-vector-install-via-dos
    desc: DOS installs an INT 1Ch timer handler through DOS
    crit: notable
    conf: 0.93
    for: [dos_com, static-lib, data]
    if:
      type: hex
      pattern: "B8 1C 35 CD 21 89 1E ?? ?? 8C C0 A3 ?? ?? B8 1C 25 BA ?? ?? CD 21"

composite_rules:
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-find-first-call
    for: [dos_com, static-lib, data]
    desc: DOS find-first syscall
    crit: notable
    conf: 0.9
    any:
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-find-first
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-find-first-ax
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-find-first-near
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-find-first-jump
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-write-call
    for: [dos_com, static-lib, data, text]
    desc: DOS write syscall
    crit: notable
    conf: 0.86
    any:
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-write
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-write-ax
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-write-near
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-write-far
      - id: objectives/impact/infect/binary/dos/com-bytes/file::dos-write-via-int
      - id: micro-behaviors/os/msdos/interrupt::int21-write-carry-check
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-write-saved-vector
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-set-int21-call
    for: [dos_com, static-lib, data]
    desc: DOS installs an interrupt vector
    crit: notable
    conf: 0.88
    any:
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-set-int21-vector
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-set-vector-ah
      - id: objectives/impact/infect/binary/dos/exec-open-hook::dos-ivt-int21-set-direct
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-open-call
    desc: DOS open syscall
    crit: notable
    conf: 0.84
    any:
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-open
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-open-ax
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-open-update-saved-vector
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-read-call
    desc: DOS read syscall
    crit: notable
    conf: 0.84
    any:
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-read
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-read-ax
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-read-saved-vector
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-seek-call
    desc: DOS seek syscall
    crit: notable
    conf: 0.86
    any:
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-seek
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-seek-ax
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-seek-eof-saved-vector

  # Also untyped `data`: headerless COM bodies without a .com name sniff as
  # data. Only this find/write chain is widened; the looser composites stay
  # on typed COM files.
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-resident-infector
    for: [dos_com, static-lib, data]
    desc: DOS hooks INT 21h and touches files
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-get-int21-vector
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-set-int21-call
    any:
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-write-call
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-find-first-call
    needs: 1

  # Resident infector that fetches the old vector straight from the IVT
  # (no AH=35h) but still installs a handler filtering EXEC calls.
  # Untyped dumps and .a-named COM bodies sniff as data.
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-exec-hook-infector
    for: [dos_com, static-lib, data]
    desc: DOS hooks INT 21h exec, touches files
    crit: hostile
    conf: 0.94
    all:
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-set-int21-call
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-exec-intercept
    any:
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-write-call
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-int21-find-first-call
    needs: 1
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-saved-vector-append-infector
    for: [data]
    desc: DOS appends a body through a saved vector
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-open-update-far
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-seek-end-far
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-write-via-farcall

  # COM appender patch pass on an already-open handle: read the host's
  # first bytes, append the body at EOF, rewind, write the entry jump, and
  # restore the timestamp. Encrypted infectors often hide only the open.
  - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-ivt-int21-swap
    for: [dos_com, static-lib, data, text]
    desc: DOS swaps IVT INT 21h vector
    crit: notable
    conf: 0.9
    any:
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-ivt-int21-swap-imm
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-ivt-int21-swap-reg
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-ivt-int21-swap-bx
      - id: objectives/impact/infect/binary/dos/com-bytes/interrupt::dos-ivt-int21-store
