# Infectors that re-launch themselves on a folder take the target as a
# command-line switch such as "/infectdirectory". The literal switch in a
# PE is intent a legitimate program has no reason to carry.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1091,T1027.009
traits:
  - id: infect-directory-switch
    desc: Infect-directory command-line switch
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: /infect(directory|dir|folder|all)\b
      case_insensitive: true
composite_rules:
  - id: copy-hook-infector-with-embedded-dll
    desc: Infect switch, copy-hook COM server and embedded PE
    crit: hostile
    conf: 0.88
    all:
      - id: infect-directory-switch
      - id: objectives/persistence/system/registry/surface::copy-hook-handlers-key-name
      - id: metadata/binary/layout/embedded::embedded-dos-header-tail
      - id: micro-behaviors/process/create/launch::create-process-api-name
    unless:
      - id: metadata/signed/platform/
