# Trojanized procps binaries graft an extra executable ELF onto a
# stripped ps(1) host that still links libproc.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1554
  mbc: B0009

traits:
  - id: libproc-32-link
    desc: Links historic libproc 3.2
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: libproc.so.3.2.0

composite_rules:
  - id: procps-graft-appended-elf
    desc: Grafted procps with appended ELF
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/binary/header/program::elf-executable-segment-graft
      - id: objectives/anti-static/polyglot/format::appended-elf32-le-binary
  - id: procps-graft-libproc
    desc: Grafted ELF still links libproc
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/header/program::elf-executable-segment-graft
      - id: libproc-32-link
  - id: procps-appended-libproc
    desc: Appended ELF still links libproc
    crit: hostile
    conf: 0.94
    all:
      - id: objectives/anti-static/polyglot/format::appended-elf32-le-binary
      - id: libproc-32-link
