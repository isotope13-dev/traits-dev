# ELF structure and libproc references can indicate procps grafting, but
# those signals alone do not establish that an executable was modified.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1554
  mbc: B0009

traits:
  - id: libproc-32-link
    desc: Links historic libproc 3.2
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: libproc.so.3.2.0

composite_rules:
  - id: procps-graft-appended-elf
    desc: Multiple executable segments and ELF32 header
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/binary/header/program::elf-multiple-executable-load-segments
      - id: metadata/binary/layout/embedded::elf32-header-after-start
  - id: procps-graft-libproc
    desc: ELF with executable segments and libproc
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/binary/header/program::elf-multiple-executable-load-segments
      - id: libproc-32-link
  - id: procps-appended-libproc
    desc: ELF32 header and libproc reference
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/binary/layout/embedded::elf32-header-after-start
      - id: libproc-32-link
