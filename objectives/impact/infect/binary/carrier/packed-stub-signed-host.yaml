# File-infector layout where the original host is a real, vendor-signed
# utility. The stub is packed and starts in a writable section; the host
# rides along as the overlay so the infected file still looks and behaves
# like the utility. A secure-delete tool is a telling host: a legitimate
# SDelete is neither packed nor wrapped in a second program.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1027.009
composite_rules:
  - id: aspack-stub-carrying-secure-delete-tool
    desc: ASPack writable-entry stub carrying a secure-delete tool
    crit: hostile
    conf: 0.9
    all:
      - id: objectives/anti-static/pack/detect::aspack-marker
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: objectives/impact/destroy/file-deletion::embedded-sdelete-secure-delete
