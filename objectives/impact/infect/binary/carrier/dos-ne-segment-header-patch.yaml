defaults:
  for: [ne]
  platforms: [windows]
  attack: T1565.001,T1070.006

traits:
  - id: dos-ne-segment-infection-timestamp
    desc: DOS infector rewrites NE segments and timestamps
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_ne_segment_infection_timestamp {
          strings:
            $open = { B8 02 3D CD 21 0F 82 ?? ?? 8B D8 B8 00 57 CD 21 }
            $mz = { 81 3C 4D 5A 0F 85 ?? ?? B8 00 42 }
            $ne = { 81 3E ?? ?? 4E 45 0F 85 ?? ?? B8 ?? ?? 39 06 }
            $append = { B8 02 42 99 2B C9 CD 21 B4 40 B9 ?? ?? 2B D2 CD 21 }
            $header = { B4 40 BA ?? ?? B9 3C 00 CD 21 }
            $time = { B8 01 57 CD 21 B4 3E CD 21 }
          condition:
            uint16(0) == 0x5a4d and all of them
        }
