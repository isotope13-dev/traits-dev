defaults:
  for: [ne]
  platforms: [windows]
  attack: T1565.001

traits:
  - id: dos-com-exe-infector-header-rewrite
    desc: DOS carrier rewrites COM and EXE files
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_com_exe_infector_header_rewrite {
          strings:
            $targets = { 81 3D 45 58 ?? ?? ?? ?? 81 3D 43 4F }
            $open = { B8 02 3D CD 21 93 1F E8 ?? ?? 0A E4 }
            $rewrite = { C7 44 12 ?? ?? B4 40 B9 ?? ?? BA 00 00 CD 21 E8 ?? ?? B4 40 B9 1C 00 }
            $com = "*.COM" ascii nocase
            $exe = "*.EXE" ascii nocase
          condition:
            uint16(0) == 0x5a4d and all of them
        }
