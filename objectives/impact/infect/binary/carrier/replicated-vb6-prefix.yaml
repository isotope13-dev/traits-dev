defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # A packed VB6 stub recursively prepended to host images. Ordinary packed
  # programs and bundles of distinct Microsoft components do not repeat the
  # complete outer mapped image twice inside their own appended content.
  - id: packed-vb6-replicated-prefix-carrier
    desc: Packed VB6 executable carries repeated copies of its own image
    crit: hostile
    conf: 0.97
    attack: T1554,T1027.002
    all:
      - id: metadata/binary/layout/embedded::replicated-self-image-prefix
      - id: metadata/build/protector::aspack-x86-unpacking-stub
      - id: micro-behaviors/dylib/load/runtime::vb6-runtime-dll-reference
      - id: metadata/binary/layout/embedded::repeated-standard-pe-images
