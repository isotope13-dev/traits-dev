defaults:
  for: [ne]
  platforms: [windows]
  attack: T1565.001,T1070.006

traits:
  - id: dos-append-header-patch-timestamp
    desc: DOS infector appends and restores timestamps
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_append_header_patch_timestamp {
          strings:
            $find = { B4 4E 8D 96 ?? ?? B9 27 00 CD 21 }
            $open = { B8 02 3D 8D 96 ?? ?? CD 21 }
            $append = { B8 02 42 99 33 C9 CD 21 B8 ?? ?? E8 ?? ?? 8B C8 B4 40 }
            $patch = { B8 00 42 99 33 C9 CD 21 B4 40 8D 96 ?? ?? B9 05 00 CD 21 }
            $time = { B8 01 57 8B 8E ?? ?? 8B 96 ?? ?? 8A CA 2A CE CD 21 }
          condition:
            uint16(0) == 0x5a4d and all of them
        }
