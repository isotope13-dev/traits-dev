defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

composite_rules:
  - id: duplicated-resource-arithmetic-body-graft
    desc: Duplicate executable resources carry an arithmetic body decoder
    crit: hostile
    conf: 0.99
    attack: T1554,T1027.002
    # Distinguishes the grafted host from ordinary resource-rich installers:
    # the additional resource section contains an actual self-decoder.
    all:
      - id: metadata/binary/section/label::duplicated-rsrc-sections
      - id: metadata/binary/section/permission::executable-rsrc-section
      - id: metadata/binary/resource/entropy::very-high-entropy-rsrc-section
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::x86-resource-delta-unrolled-decoder
