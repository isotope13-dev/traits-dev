# Grafted-code Mach-O infection: the Mach-O analogue of the ELF
# note-cavity attack. Mach-O has no PT_NOTE to repurpose, so an infector
# grafts a second executable segment (or section) carrying its payload
# and redirects LC_MAIN/LC_UNIXTHREAD into it. The structural fingerprint
# is a binary with more than one executable segment whose entry point
# resolves into a section outside the toolchain code set. Kept at
# suspicious: Mach-O exposes fewer independent structural tells for this
# than ELF (no orphaned-note corroboration), and the marker traits
# (infection-marker-section, victim-pwn-taunt) stack on top when present.
defaults:
  platforms: [macos, ios]
  for: [macho]
  attack: T1554
  mbc: B0009

composite_rules:
  - id: macho-segment-graft-infection
    desc: Mach-O grafted-segment code infection
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/anomaly/format::macho-executable-segment-graft
      - id: metadata/binary/anomaly/format::macho-entry-in-nonstandard-section
    unless:
      - id: metadata/binary/vendor/
