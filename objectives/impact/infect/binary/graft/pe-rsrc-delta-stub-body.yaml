# A PE file infector that hides its viral body in the host's resource section:
# the section is flagged executable, is near-random, and its tail starts with a
# position-independent decryptor (pushad; call $+5; pop reg; sub reg, imm).
# Clean software marks .rsrc read-only and does not ship a register-saving
# call/pop stub inside it.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.002,T1554
  mbc: B0024

traits:
  - id: pe-rsrc-pushad-call-pop-stub
    desc: Register-saving call/pop delta stub in rsrc
    crit: notable
    conf: 0.9
    size_min: 512
    if:
      type: hex
      section: .rsrc
      pattern: 50 51 52 53 55 56 57 E8 00 00 00 00 (5B 81 EB|5A 81 EA)

composite_rules:
  - id: pe-rsrc-executable-body-with-delta-stub
    desc: Executable near-random rsrc holds a call-pop delta stub
    crit: hostile
    conf: 0.96
    size_min: 131072
    all:
      - id: metadata/binary/section/permission::executable-rsrc-section
      - id: metadata/binary/section/permission::very-high-entropy-rsrc-section
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: pe-rsrc-pushad-call-pop-stub
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
