# A new executable segment alone also occurs in legitimate ELF layouts.
# Require a redirected, nonstandard entry and a saved-entry return stub.
# No banner, marker section name, host size, or build-system identity is used.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1554

composite_rules:
  - id: elf-entry-graft-return
    desc: Grafted ELF entry stub returns to host
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/binary/anomaly/format::elf-executable-segment-graft
      - id: metadata/binary/anomaly/format::elf-entry-in-nonstandard-section
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: micro-behaviors/data/control-flow/transfer::x64-rebased-entry-jump
