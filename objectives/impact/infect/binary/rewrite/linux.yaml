# A prepending ELF infector carries the displaced host after its viral prefix,
# enumerates nearby files, searches them for an infection marker, and truncates
# and rewrites writable candidates. The full cluster excludes ordinary embedded
# payloads and self-extracting installers.
defaults:
  platforms: [linux, unix]
  for: [elf]
  attack: T1554
  mbc: B0009

composite_rules:
  - id: sectionless-elf-prepending-infector
    desc: Sectionless ELF prepender scans and rewrites files
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/anomaly/embedded::embedded-elf-after-prefix
      - id: metadata/binary/anomaly/section-header::elf-no-section-headers
      - id: micro-behaviors/data/string/search::memmem
      - id: micro-behaviors/fs/directory/readdir::readdir-opendir
      - id: micro-behaviors/fs/directory/readdir::readdir-readdir
      - id: micro-behaviors/fs/file/truncate::truncate
      - id: micro-behaviors/fs/file/write/direct::write
    any:
      - id: micro-behaviors/fs/file/stat::stat-exists
      - id: micro-behaviors/fs/chmod/modify::syscall-fchmod
      - id: micro-behaviors/process/create/direct::execve-import
    needs: 2
