# Parasitic file infector that replaces executables
# Copies original to .cab, deletes .exe, copies self as .exe
# Uses timestomping to hide modifications
defaults:
  crit: hostile
  platforms: [windows]
  for: [pe, dll]
  size_min: 100000
  size_max: 5000000
composite_rules:
# Floxif-class cavity infectors: executable .rsrc, a near-zero-entropy RWX cavity,
# and a high-entropy overlay decoded through obfuscated VirtualProtect without
# retaining a host version resource or vendor signature table.
- id: parasitic-rwx-rsrc-overlay-decryptor
  desc: Parasitic PE has RWX resource cavity and overlay decryptor
  crit: hostile
  conf: 0.97
  attack: T1554,T1027.002,T1620
  size_min: 65536
  size_max: 2097152
  all:
  - id: metadata/binary/section/permission::executable-rsrc-section
  - id: metadata/binary/section/permission::near-zero-entropy-rwx-section
  - id: metadata/binary/layout/overlay::large-overlay-64k
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/mem/protect/modify::xor-decoded-virtual-protect-api
  any:
  - id: metadata/binary/layout/overlay::high-entropy-overlay
  - id: metadata/binary/layout/overlay::overlay-entropy-over-7
  - id: metadata/binary/section/entropy::zero-entropy-executable-section
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-large-overlay
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/build/protector::vmprotect-section-reference
# Cavity-style x64 infectors can preserve every original section and the
# host's version resource, place their decryptor in executable host code, and
# append an opaque trailer without adding the RWX section used by section-
# appending generations.  The rolling-XOR RWX loader is the behavior leg;
# the intact versioned image plus large cipher-grade overlay establishes the
# parasitic carrier rather than a standalone unpacking stub.
- id: parasitic-text-loader-overlay-host
  desc: Parasitic PE has text loader and encrypted overlay
  crit: hostile
  conf: 0.99
  attack: T1027.009,T1554,T1620
  size_min: 131072
  all:
  - id: objectives/anti-static/obfuscation/payload/encrypted::x64-rwx-rolling-xor-memory-loader
  - id: metadata/binary/layout/overlay::large-overlay-64k
  - id: metadata/binary/layout/overlay::high-entropy-overlay
  - id: metadata/binary/resource/identity::pe-version-resource
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/reverse-engineering/
# PEB access, a zero checksum and an overlay also occur in ordinary loaders.
# Require actual entry diversion and footer-to-entry restoration before
# inferring a parasitic host.
- id: parasitic-pe-peb-loader-overlay-host
  desc: Parasitic PE has PEB loader and high-entropy payload overlay
  crit: hostile
  conf: 0.98
  attack: T1554,T1027.002,T1620
  size_min: 65536
  size_max: 30000000
  all:
  - id: objectives/impact/infect/virus::x86-footer-restored-entry-diversion
  - id: micro-behaviors/process/info/query::peb-access-x86
  - id: metadata/binary/layout/overlay::large-overlay-64k
  - id: metadata/binary/layout/overlay::overlay-entropy-over-7
  - id: metadata/binary/layout/checksum::pe-checksum-tampered-or-zeroed
  any:
  - id: metadata/binary/layout/size::noncertificate-unclaimed-bytes-512
  - id: micro-behaviors/os/api-resolution/manual::x86-peb-loader-data-load
  - id: metadata/binary/instruction/operand::mz-words-in-code
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/reverse-engineering/
# Catches parasitic infectors (Expiro-class and kin) that graft a VMP
# body plus executable resources onto a host PE and use fibers.
- id: parasitic-vmp-executable-rsrc-host
  desc: Parasitic host has VMP and executable resources
  crit: hostile
  conf: 0.96
  attack: T1554,T1027.002
  all:
  - id: metadata/build/protector::vmprotect-section-reference
  - id: metadata/binary/section/permission::executable-rsrc-section
  - id: micro-behaviors/process/create/fiber::fiber-memory-thread-api-profile
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
# Expiro-class appenders graft a large encrypted RWX .vmpN body onto an
# otherwise intact host (version resource kept, checksum zeroed, no real
# VMProtect marker strings). Covers modern hosts where .rsrc stays normal.
- id: parasitic-vmp-masquerade-appender
  desc: PE appender grafts RWX VMP-masquerade body
  crit: hostile
  conf: 0.97
  attack: T1554,T1027.002
  size_min: 131072
  all:
  - id: objectives/anti-static/pack/section-anomaly::large-rwx-vmp-encrypted-section
  - id: metadata/build/protector::vmprotect-section-reference
  - id: metadata/binary/section/permission::wx-section
  - id: metadata/binary/layout/checksum::pe-checksum-zeroed
  - id: metadata/binary/resource/identity::pe-version-resource
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/build/protector::vmprotect-version-reference
  - id: objectives/anti-static/pack/vmprotect::marker-string
# Pairing the overwritten entry decoder with an appended encrypted RWX .vmpN
# section captures a parasitic rewrite while excluding ordinary protected
# applications that merely use the same section naming convention.
- id: parasitic-vmp-entry-decoder-appender
  desc: Parasitic PE has entry decoder and VMP appendage
  crit: hostile
  conf: 0.99
  attack: T1554,T1027.002
  size_min: 131072
  all:
  - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::x86-backward-stack-byte-decode-loop
  - id: objectives/anti-static/pack/section-anomaly::large-rwx-vmp-encrypted-section
  - id: metadata/binary/layout/checksum::pe-checksum-zeroed
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: parasitic-exe-replace-infector
  desc: Parasitic PE infector replaces executables
  crit: hostile
  conf: 0.95
  attack: T1554.001
  all:
  - id: micro-behaviors/fs/directory/readdir::find-file-walker
  - id: micro-behaviors/fs/file/copy::copyfile-a
  - id: micro-behaviors/fs/delete/file/library::deletefile-a
  - id: micro-behaviors/fs/write/file/handle::write-file
  - id: micro-behaviors/fs/file/open::file-create-win
  - id: micro-behaviors/fs/path/extension::cab-filename-format-string
  any:
  - id: micro-behaviors/fs/path/check::readme-writability-check
  - id: micro-behaviors/fs/file/timestamp::set-file-time
  - id: micro-behaviors/fs/traversal/drives::get-drive-type
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/signed/platform/
# Parasitic infection that hides the viral body in a dominant RWX .reloc
# while preserving the host version resource (classic Expiro Gen.7 layout).
- id: parasitic-reloc-rwx-host
  desc: Parasitic PE hides payload in RWX reloc
  crit: hostile
  conf: 0.96
  attack: T1554,T1027.002
  size_min: 131072
  all:
  - id: objectives/anti-static/pack/loader-noise::reloc-rwx-mid-entropy-payload
  - id: metadata/binary/section/ratio::reloc-dominates-image
  - id: metadata/binary/section/permission::wx-section
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: metadata/binary/resource/identity::pe-version-resource
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework::dotnet-metadata
- id: parasitic-reloc-decoder-host
  desc: Parasitic PE carries RWX reloc decoder beside intact host
  crit: hostile
  conf: 0.99
  attack: T1554,T1027.002
  size_min: 131072
  all:
  # Require the decoder's actual carrier geometry directly. The broader
  # concealed-carrier rule also gates on whole-file entropy, which varies
  # with the size of the host that a parasitic infector modifies.
  - id: objectives/anti-static/pack/loader-noise::reloc-rwx-payload-section
  - id: metadata/binary/section/ratio::reloc-dominates-image
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: metadata/binary/resource/identity::pe-version-resource
  any:
  - id: objectives/anti-static/obfuscation/payload/section/layout::x64-unrolled-dword-decoder-stub
  - id: objectives/anti-static/obfuscation/payload/section/layout::x64-rax-unrolled-dword-decoder-stub
  - id: objectives/anti-static/obfuscation/payload/section/layout::x64-rbx-unrolled-dword-decoder-stub
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/

# An unsigned IDM-identified image routes its entry path to a self-decoding
# executable relocation section. This catches grafts whose payload does not
# dominate the image.
- id: entrypoint-rwx-reloc-decoder-host-graft
  desc: Unsigned IDM image launches an RWX relocation decoder
  crit: hostile
  conf: 0.97
  attack: T1554,T1027.002
  size_min: 131072
  size_max: 524288000
  all:
  - id: metadata/binary/section/header::entry-call-to-reloc-register-save-stub
  - id: metadata/binary/section/entropy::large-high-entropy-rwx-reloc
  - id: objectives/anti-static/obfuscation/payload/section/layout::x86-unrolled-dword-decoder-in-reloc
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: well-known/tool/browser::idm-company-name
  - id: well-known/tool/browser::idm-product-name
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework::dotnet-metadata

# Parasitic infection that appends a dominant RWX section onto an otherwise
# intact versioned host executable.
- id: parasitic-rwx-appender-intact-host
  desc: Parasitic PE grafts dominant RWX section onto intact host
  crit: hostile
  conf: 0.97
  attack: T1554,T1027.002
  size_min: 131072
  all:
  - id: metadata/binary/section/permission::wx-section
  - id: metadata/binary/section/ratio::large-pe-largest-section-over-98-percent
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: metadata/binary/layout/checksum::pe-checksum-mismatch
  any:
  - id: metadata/binary/section/size::small-code-in-large-pe
  - id: metadata/binary/section/ratio::pe-near-total-code-data
  - id: metadata/binary/provenance/version-info::version-info-file-version-present
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework::dotnet-metadata
  - id: well-known/tool/development/
