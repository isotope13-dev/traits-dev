defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # Reviewed after emulating only the packer: the original code at 401340
  # joins its own executable to walked hosts, then replaces the host by rename.
  # The filter table belongs to that infection loop, not a shortcut payload.
  - id: packed-drive-executable-joiner
    desc: Packed drive walker with executable-join and backup filters
    crit: hostile
    conf: 0.97
    attack: T1554
    all:
      - id: micro-behaviors/fs/path/extension::executable-and-backup-filter-table
      - id: micro-behaviors/fs/search::x86-four-suffix-shared-action
      - id: micro-behaviors/fs/file/rename::crt-file-rewrite-name-table
      - id: micro-behaviors/fs/traversal/drives::get-logical-drives-text
      - id: micro-behaviors/fs/delete/file/library::deletefile-a-text
      - id: micro-behaviors/fs/path/extension::bak-extension-reference
      - id: metadata/build/protector::executable-packer-references
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
