defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: crt-file-rewrite-name-table-xpack0
    desc: fopen/rename/fwrite table in XPack0
    crit: component
    conf: 0.99
    if:
      type: raw
      section: .XPack0
      regex: 'fopen\x00.{0,8}rename\x00.{0,8}fwrite\x00'
  - id: executable-and-backup-filter-table-xpack0
    desc: EXE/BAK/GHO filter table in XPack0
    crit: component
    conf: 0.99
    if:
      type: hex
      section: .XPack0
      pattern: '2E 42 41 4B 00 [3] 2E 62 61 6B 00 [3] 2E 47 48 4F 00 [3] 67 68 6F 00 2E 45 58 45 00'
  - id: x86-four-suffix-shared-action-xpack0
    desc: Four-suffix shared-action in XPack0
    crit: component
    conf: 0.96
    if:
      type: hex
      section: .XPack0
      pattern: '8B 54 24 ?? 68 ?? ?? ?? ?? 52 FF D5 83 C4 08 85 C0 74 49 8B 44 24 ?? 68 ?? ?? ?? ?? 50 FF D5 83 C4 08 85 C0 74 36 8B 4C 24 ?? 68 ?? ?? ?? ?? 51 FF D5 83 C4 08 85 C0 74 23 8B 54 24 ?? 68 ?? ?? ?? ?? 52 FF D5 83 C4 08 85 C0 74 10 [16] 8B 4C 24 ?? 51 FF 15 ?? ?? ?? ??'
  - id: x86-indirect-eof-transfer-loop-xpack0
    desc: Indirect EOF transfer loop in XPack0
    crit: component
    conf: 0.98
    if:
      type: hex
      section: .XPack0
      pattern: '57 FF D5 83 C4 04 83 F8 FF 74 13 56 50 FF 15 ?? ?? ?? ?? 57 FF D5 83 C4 0C 83 F8 FF 75 ED'
composite_rules:
  - id: packed-joiner-crt-rewrite-table
    desc: CRT fopen/rename/fwrite name table
    crit: component
    conf: 0.99
    any:
      - id: micro-behaviors/fs/file/rename::crt-file-rewrite-name-table
      - id: crt-file-rewrite-name-table-xpack0
  - id: packed-joiner-executable-filter-table
    desc: EXE, BAK and Ghost-image filter table
    crit: component
    conf: 0.99
    any:
      - id: micro-behaviors/fs/path/extension::executable-and-backup-filter-table
      - id: executable-and-backup-filter-table-xpack0
  - id: packed-joiner-four-suffix-filter
    desc: x86 four-suffix shared-action filter
    crit: component
    conf: 0.96
    any:
      - id: micro-behaviors/fs/search::x86-four-suffix-shared-action
      - id: x86-four-suffix-shared-action-xpack0
  - id: packed-joiner-eof-transfer-loop
    desc: x86 indirect EOF transfer loop
    crit: component
    conf: 0.98
    any:
      - id: metadata/binary/instruction::x86-indirect-eof-transfer-loop
      - id: x86-indirect-eof-transfer-loop-xpack0
  # Reviewed after emulating only the packer: the original code at 401340
  # joins its own executable to walked hosts, then replaces the host by rename.
  # The filter table belongs to that infection loop, not a shortcut payload.
  - id: packed-drive-executable-joiner
    desc: Packed drive joiner with byte-transfer code
    crit: hostile
    conf: 0.97
    attack: T1554
    all:
      - id: packed-joiner-executable-filter-table
      - id: packed-joiner-four-suffix-filter
      - id: packed-joiner-crt-rewrite-table
      - id: packed-joiner-eof-transfer-loop
      - id: micro-behaviors/process/info/current::get-module-filename
      - id: micro-behaviors/fs/traversal/drives::get-logical-drives-text
      - id: micro-behaviors/fs/delete/file/library::delete-win
      - id: micro-behaviors/fs/path/extension::bak-extension-reference
      - id: metadata/build/protector::executable-packer-references
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
