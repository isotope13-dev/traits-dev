defaults:
  platforms:
  - windows
  for:
  - pe
  arch:
  - x86
  attack: T1554
composite_rules:
- id: x86-encrypted-host-prefix-rewrite
  desc: EXE walker uses prefix/transform/footer rewrite and RC4
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/fs/write/file/handle/unspecified::x86-prefix-transform-footer-writes
  - id: micro-behaviors/crypto/symmetric/stream/rc4/transform::x86-stack-state-modular-prga
  - id: micro-behaviors/fs/directory/readdir/native::find-file-walker-wide
  - id: micro-behaviors/os/random/generator::crypt-gen-random
  - id: metadata/binary/symbols/name/process::create-process-w
  - id: micro-behaviors/fs/path/extension::exe-name-or-extension
