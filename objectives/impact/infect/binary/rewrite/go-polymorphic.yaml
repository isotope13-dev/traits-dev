# Go overwrite infectors can retain descriptive pclntab function names even
# when each generated image is padded differently. The function cluster below
# distinguishes deliberate self-mutation and generation tracking from ordinary
# self-updaters, which do not recursively visit files to write mutated copies.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.001,T1554

traits:
  - id: go-self-image-mutation-routine
    desc: Generates mutated bytes from own image
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: 6D 61 69 6E 2E 67 65 74 5F 73 65 6C 66 5F 6D 75 74 61 74 65 64 5F 62 79 74 65 73
      section: rdata

  - id: go-generation-mark-routine
    desc: Adds generation markers to replica files
    crit: component
    conf: 0.98
    if:
      type: hex
      pattern: 6D 61 69 6E 2E 61 64 64 5F 67 65 6E 65 72 61 74 69 6F 6E 5F 6D 61 72 6B 73
      section: rdata

  - id: go-file-visit-routine
    desc: Go main file visitation routine
    crit: component
    conf: 0.8
    if:
      type: hex
      pattern: 6D 61 69 6E 2E 76 69 73 69 74
      section: rdata

composite_rules:
  - id: go-polymorphic-overwrite-infector
    desc: Go program walks files and writes generation-marked self mutations
    crit: hostile
    conf: 0.995
    all:
      - id: go-self-image-mutation-routine
      - id: go-generation-mark-routine
      - id: go-file-visit-routine
