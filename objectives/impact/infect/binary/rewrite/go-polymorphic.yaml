# Go overwrite infectors can retain descriptive pclntab function names even
# when each generated image is padded differently. The function cluster below
# distinguishes deliberate self-mutation and generation tracking from ordinary
# self-updaters, which do not recursively visit files to write mutated copies.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.001,T1554

composite_rules:
  - id: go-polymorphic-overwrite-infector
    desc: Go file walker overwrites visited files with generation-marked self mutations
    crit: hostile
    conf: 0.995
    all:
      - id: metadata/binary/symbols/name/qualified/security::go-self-image-mutation-routine
      - id: metadata/binary/symbols/name/qualified/security::go-generation-mark-routine
      - id: metadata/binary/symbols/name/qualified/filesystem::go-file-visit-routine

  - id: go-velocity-style-binary-infector
    desc: Go walker infects executables with keyed polymorphic payload
    crit: hostile
    conf: 0.98
    attack: T1027.001,T1554,T1080
    all:
      - id: metadata/binary/symbols/name/qualified/security::go-main-infect-symbol
      - id: metadata/binary/symbols/name/qualified/security::go-main-infect-binaries-symbol
      - id: metadata/binary/symbols/name/qualified/filesystem::filepath-walk-pclntab
    any:
      - id: micro-behaviors/fs/read/file/content/unspecified::ioutil-readfile-text
      - id: micro-behaviors/fs/write/file/unspecified::ioutil-writefile-text

  - id: go-infector-portscan-carrier
    desc: Go binary infector embeds anvie port-scanner dependency
    crit: hostile
    conf: 0.96
    attack: T1046,T1554
    all:
      - id: metadata/binary/symbols/name/qualified/security::go-main-infect-symbol
      - id: objectives/discovery/network/scan/library::anvie-port-scanner-package-binary
