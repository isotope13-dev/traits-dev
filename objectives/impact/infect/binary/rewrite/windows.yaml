defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
traits:
- id: oep-restoration-patch-write
  desc: Writes OEP restoration jump stub
  crit: suspicious
  conf: 0.94
  if:
    type: hex
    pattern: C7 00 83 C4 04 E9
    offset_range: [11489280, 11509760]
- id: embedded-pe-mz-nop-scan
  desc: Scans for embedded MZ payload
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: 81 38 4D 5A 90 00
    offset_range: [11489280, 11509760]
- id: stack-random-exe-drop-name
  desc: Stack-built random exe drop name
  crit: component
  conf: 0.92
  if:
    type: hex
    pattern: C7 45 ?? 52 4A 7A 4F C7 45 ?? 74 67 2E 65 C7 45 ?? 78 65
    offset_range: [11489280, 11509760]
- id: bak-extension-reference
  desc: References .bak file extension
  crit: component
  conf: 0.85
  if:
    type: text
    regex: (?i)\.bak\b
- id: tmp-extension-reference
  desc: References .tmp file extension
  crit: component
  conf: 0.85
  if:
    type: text
    regex: (?i)\.tmp\b
- id: executable-wildcard-mask
  desc: References *.exe search mask
  crit: component
  conf: 0.92
  if:
    type: text
    regex: '(?i)\*\.exe\b'
- id: ghost-image-filter
  desc: Excludes Ghost image extensions
  crit: component
  conf: 0.85
  if:
    type: text
    regex: (?i)\.gho\b
- id: cts-trailer-marker
  desc: CTS newline-terminated infection trailer marker
  crit: component
  conf: 0.95
  size_max: 1048576
  if:
    type: hex
    pattern: 43 54 53 0A
    section: UPX0
- id: skip-windows-install-dir--windows
  desc: Skips Windows installation directories (WINDOWS)
  crit: component
  conf: 0.85
  if:
    type: text
    word: WINDOWS
- id: skip-windows-install-dir--winnt
  desc: Skips Windows installation directories (WINNT)
  crit: component
  conf: 0.85
  if:
    type: text
    word: WINNT
composite_rules:
- id: reloc-entrypoint-pe-infector
  desc: PE infector grafts a decoder into writable .reloc
  crit: hostile
  conf: 0.99
  attack: T1554,T1140
  all:
  - id: objectives/anti-static/obfuscation/payload/section::reloc-entrypoint-self-decoder
  - id: metadata/binary/layout::pe-checksum-mismatch
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
  - id: well-known/tool/reverse-engineering/
- id: skip-windows-install-dir
  desc: Skips Windows installation directories
  crit: component
  conf: 0.85
  any:
  - id: skip-windows-install-dir--windows
  - id: skip-windows-install-dir--winnt
- id: rewrite-executable-via-temp-and-backup
  desc: Rewrites executable via temp and backup files
  crit: suspicious
  conf: 0.92
  unless:
  - id: metadata/binary/installer/family/
  downgrade:
    any:
    - id: metadata/binary/metrics/structural::many-imports
  all:
  - id: bak-extension-reference
  - id: tmp-extension-reference
  - id: micro-behaviors/fs/file/rename/
  - id: micro-behaviors/fs/file/delete::delete-win
  any:
  - id: micro-behaviors/fs/path/extension::exe-dup
  - id: micro-behaviors/fs/path/extension::windows-exe-path-reference-binary
- id: recursive-pe-infector
  desc: Recursively infects PE files across drives
  crit: hostile
  conf: 0.95
  all:
  - id: rewrite-executable-via-temp-and-backup
  - id: micro-behaviors/fs/traversal/drives::logical-drive-enumeration
  - id: micro-behaviors/dylib/library/legacy::mfc42-ref
  any:
  - id: skip-windows-install-dir
  - id: ghost-image-filter
  - id: objectives/evasion/self-delete/file/script::comspec-shortpath-self-delete
- id: executable-walker-rewrite-infector
  desc: Walks executable targets and rewrites them while preserving timestamps
  crit: hostile
  conf: 0.98
  attack: T1554,T1070.006
  all:
  - id: rewrite-executable-via-temp-and-backup
  - id: executable-wildcard-mask
  - id: micro-behaviors/fs/enumerate/directory::find-file-walker
  - id: micro-behaviors/fs/file/open::file-create-win
  - id: micro-behaviors/fs/file/read::read-file
  - id: micro-behaviors/fs/file/write/direct::write-file
  - id: micro-behaviors/fs/file/handle::set-file-pointer
  - id: micro-behaviors/fs/file/timestamp::set-file-time
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/signed/platform/
  - id: well-known/app/system/iobit::iobit-signed-component-context
- id: windows-pe-copy-move-infector
  desc: Windows PE copy and move file infector
  crit: hostile
  conf: 0.94
  size_max: 2097152
  all:
  - id: micro-behaviors/fs/enumerate/directory::find-file-walker
  - id: executable-wildcard-mask
  - id: micro-behaviors/fs/file/copy::copyfile-a
  - id: micro-behaviors/fs/file/move::move-file-import-a
  - id: micro-behaviors/fs/file/open::file-create-win
  - id: micro-behaviors/fs/file/read::read-file
  - id: micro-behaviors/fs/file/write/direct::write-file
  - id: micro-behaviors/fs/file/handle::set-file-pointer
  any:
  - id: micro-behaviors/os/sysinfo/directories::get-windows-directory
  - id: micro-behaviors/os/sysinfo/directories::get-system-directory
  - id: micro-behaviors/fs/file/delete::deletefile-a
  - id: micro-behaviors/fs/file/attributes::set-file-attributes-a
  - id: micro-behaviors/fs/file/handle::flush-file-buffers
  needs: 3
  unless:
  - id: metadata/binary/installer/family/
  - id: well-known/tool/development/inno-setup::inno-setup-compiler
  - id: metadata/binary/installer/script::nsis
  - id: metadata/signed/platform/
  - id: metadata/binary/metrics/threshold::many-exports-1000
  - id: well-known/app/system/stresstimulus/
- id: repeated-standard-pe-overlay-infector
  desc: Repeated PE images appended during file rewriting
  crit: hostile
  conf: 0.97
  attack: T1554
  all:
  - id: metadata/binary/layout::repeated-standard-pe-images
  - id: metadata/binary/layout::large-overlay-1mb
  - id: metadata/binary/layout::overlay-dominates-third
  - id: micro-behaviors/fs/file/open::file-create-win
  - id: micro-behaviors/fs/file/read::read-file
  - id: micro-behaviors/fs/file/write/direct::write-file
  any:
  - id: micro-behaviors/fs/enumerate/directory::find-first-file-a
  - id: micro-behaviors/fs/file/handle::set-file-pointer
  - id: micro-behaviors/fs/file/copy::copyfile-a
  needs: 1
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
  - id: metadata/binary/installer/sfx/
  - id: metadata/signed/platform/
  - id: well-known/app/system/stresstimulus/
# `repeated-standard-pe-overlay-infector` above needs a 1 MB overlay, which is
# the size of the sample it was written from. A self-appending replicator
# doubles its file every generation (16K, 32K, 64K ... ), so a fixed megabyte
# floor is blind to every early generation. This sibling covers the small end
# instead by demanding a much stronger shape: the appended images have to
# dominate the file (>90% overlay) and the host has to carry the self-copy
# chain - resolve own image path, duplicate it, then reopen and rewrite it -
# which says the repeated images are copies of the host itself.
- id: self-copying-repeated-pe-image-stack
  desc: PE stacked with self-copied repeated PE images
  crit: hostile
  conf: 0.97
  attack: T1554
  all:
  - id: metadata/binary/layout::repeated-standard-pe-images
  - id: metadata/binary/layout::overlay-over-90pct
  - id: metadata/binary/layout::large-overlay-64k
  - id: micro-behaviors/os/module/load::get-module-filename-ansi
  - id: micro-behaviors/fs/file/copy::copyfile-a
  - id: micro-behaviors/fs/file/open::file-create-win
  - id: micro-behaviors/fs/file/read::read-file
  - id: micro-behaviors/fs/file/write/direct::write-file
  - id: micro-behaviors/fs/file/handle::set-file-pointer
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
  - id: metadata/binary/installer/sfx/
  - id: metadata/signed/platform/
- id: parasitic-pe-dropper-entrypoint
