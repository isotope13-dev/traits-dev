defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: pe-resource-code-cave-graft
    desc: Resource graft with executable arithmetic decoder
    crit: hostile
    conf: 0.99
    attack: T1554,T1027,T1140
    all:
      - id: objectives/anti-static/obfuscation/encoding/arithmetic::x86-mixed-width-decoder-execution
      - id: metadata/binary/resource/entropy::duplicated-resource-entropy-checksum
      - id: metadata/binary/layout/checksum::certificate-directory-checksum-mismatch
