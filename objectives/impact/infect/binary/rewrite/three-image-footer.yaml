defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
composite_rules:
  # A recursive directory walker feeds EXE hosts to the three-stream writer.
  # The writer prepends its loader, preserves the host, appends its infector,
  # and retains the three paths and lengths for restoration on execution.
  - id: three-image-footer-executable-infector
    desc: Executable walker binds loader, host and infector with restoration footer
    crit: hostile
    conf: 0.98
    attack: T1554
    all:
      - id: micro-behaviors/data/serialize/binary::x86-three-stream-footer-writer
      - id: micro-behaviors/fs/directory/readdir/native::find-file-walker
      - id: micro-behaviors/fs/file/copy/call::copyfile-a
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
