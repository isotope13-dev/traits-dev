# Unlike an overlay measurement or a generic PE patcher, this requires the
# executable-header replacement/append routine together with self-image I/O
# and recursive drive enumeration. No family name or chosen filename gates it.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
composite_rules:
  - id: drive-walking-executable-prefix-infector
    desc: Drive-walking executable prefix infector
    crit: hostile
    conf: 0.98
    attack: T1554
    all:
      - id: metadata/binary/instruction/sequence::x86-mz-prefix-replacement-eof-append
      - id: micro-behaviors/fs/read/file/handle::ansi-module-path-file-io-import-set
      - id: micro-behaviors/fs/enumerate/drives::logical-drive-type-enumeration
      - id: micro-behaviors/fs/directory/readdir/native::find-file-walker
