defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
composite_rules:
  - id: prepender-host-copy-footer-routines
    desc: Prepender host-copy and length-footer routines
    crit: hostile
    conf: 0.99
    attack: T1554
    # The paired-stream copy followed by the length/tag writer and its
    # matching EOF reader identifies the host-preserving prepender code.
    # Embedded code need not be reachable from a damaged carrier's entry.
    all:
      - id: micro-behaviors/fs/write/file/stream::x86-paired-input-file-stream-writes
      - id: micro-behaviors/data/serialize/binary::x86-length-pair-marker-writes
      - id: micro-behaviors/data/parse/binary::x86-eof-length-pair-reader
    near_bytes: 2048
