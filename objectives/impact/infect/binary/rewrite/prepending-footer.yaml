# The native prepender copies its own image over an EXE host, appends the
# displaced host, then writes two lengths and an infection tag. On launch it
# reads those lengths back from EOF to reconstruct and execute the host.
# The code signature masks addresses, call displacements, stack locals and
# the tag itself. It does not depend on a collector filename or family word.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
  attack: T1554

traits:
  - id: x86-feedbeef-host-footer-record-write
    desc: Populates 0xFEEDBEEF host metadata footer record
    crit: notable
    conf: 0.97
    if:
      type: hex
      offset_range: [512, 65536]
      pattern: 'C7 (45 ?? | 85 ?? ?? FF FF) EF BE ED FE [16-64] 68 18 01 00 00'

composite_rules:
  - id: fixed-drive-feedbeef-prepending-infector
    desc: Fixed-drive walker prepends image with 0xFEEDBEEF footer
    crit: hostile
    conf: 0.99
    all:
      - id: x86-feedbeef-host-footer-record-write
      - id: micro-behaviors/fs/enumerate/drives::logical-drive-type-enumeration
      - id: micro-behaviors/fs/directory/readdir/native::find-file-walker
      - id: micro-behaviors/fs/file/handle::module-path-copy-rewrite-api-set
      - id: micro-behaviors/fs/delete/file/library::deletefile-a

  - id: recursive-prepending-footer-infector
    desc: "EXE walker overwrites hosts with self-prefixed image and host-length footer"
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/search/name::exe-wildcard-data-bytes
      - id: micro-behaviors/fs/directory/readdir/native::find-file-walker
      - id: micro-behaviors/fs/read/file/handle::ansi-module-path-file-io-import-set
      - id: micro-behaviors/fs/file/copy/call::copyfile-a
      - id: micro-behaviors/fs/file/move::move-file-import-a
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
      - id: micro-behaviors/data/serialize/binary::x86-length-pair-marker-writes
      # EOF reader: seek by -(tag length + 8), read two lengths, seek to the
      # stored host offset, and allocate/read the displaced host's byte count.
      - id: micro-behaviors/data/parse/binary::x86-eof-length-pair-reader
