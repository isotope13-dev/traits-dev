# This VB6/ASPack infector keeps the original host image behind a fixed viral
# body that falsely identifies Xiang Corporation as Microsoft Firewall. Across
# unrelated infected hosts this creates a dominant overlay containing many PE
# images, while the viral loader remains at the front of the file.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1554
  mbc: B0009

composite_rules:
  - id: xiang-firewall-aspack-multi-host-infector
    desc: Xiang/Firewall ASPack multi-host infector
    crit: hostile
    conf: 0.999
    all:
      - id: objectives/evasion/masquerade/version-resource/contradiction::microsoft-firewall-resource-claim
      - id: objectives/evasion/masquerade/version-resource/contradiction::xiang-company-resource-claim
      - id: metadata/binary/layout::many-pe-embedded
      - id: objectives/anti-static/pack/detect::aspack-marker
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/layout::overlay-over-90pct
      - id: metadata/binary/section/metrics::pe-entry-in-writable-section
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/os/module/load::get-proc-address-import
