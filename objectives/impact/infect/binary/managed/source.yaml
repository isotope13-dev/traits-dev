defaults:
  for: [csharp]
  platforms: [windows]
composite_rules:
  - id: csharp-file-infector
    desc: C# source file infection pattern
    crit: hostile
    conf: 0.95
    attack: "T1080"
    all:
      - id: micro-behaviors/fs/enumerate/directory::get-files-exe-filter
      - id: micro-behaviors/process/info/selfpath::mainmodule-filename
    any:
      - id: micro-behaviors/crypto/symmetric/aes/library::rijndael-managed
      - id: micro-behaviors/crypto/symmetric/3des::triple-des-provider
      - id: objectives/execution/compile/runtime::compile-assembly-from-source
    unless:
      - id: well-known/game/mod::bedrockboot-source-repository
