# Tiny compiled ELF infectors keep patch/check routine names in the
# symbol table: they rewrite e_ident/e_phoff and then start the virus body.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1554
  mbc: B0009

traits:
  - id: patch-ehdr-symbol
    desc: ELF ehdr patch routine
    crit: notable
    conf: 0.95
    if:
      type: text
      word: patch_ehdr
  - id: patch-phdr-symbol
    desc: ELF phdr patch routine
    crit: notable
    conf: 0.95
    if:
      type: text
      word: patch_phdr
  - id: patch-shdr-symbol
    desc: ELF shdr patch routine
    crit: notable
    conf: 0.94
    if:
      type: text
      word: patch_shdr
  - id: chk-ehdr-symbol
    desc: ELF ehdr check routine
    crit: notable
    conf: 0.93
    if:
      type: text
      word: chk_ehdr
  - id: start-vir-symbol
    desc: Start-virus infector routine
    crit: notable
    conf: 0.96
    if:
      type: text
      word: start_vir
  - id: write-virus-symbol
    desc: Write-virus infector routine
    crit: notable
    conf: 0.96
    if:
      type: text
      word: write_virus
  - id: overflow-flag-symbol
    desc: Infector overflow-flag state
    crit: notable
    conf: 0.9
    if:
      type: text
      word: overflow_flag
  - id: start-infection-symbol
    desc: Start-infection infector routine
    crit: notable
    conf: 0.96
    if:
      type: text
      word: start_infection
  - id: virus-code-symbol
    desc: Named virus-code payload symbol
    crit: notable
    conf: 0.95
    if:
      type: text
      word: virus_code
  - id: binomitized-banner
    desc: Binomitized infection status banner
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: binomitized
  - id: lotek-wintermute-banner
    desc: LoTek Wintermute virus banner
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'LoTek by Wintermute'
  - id: nasm-embedded-stub
    desc: Embeds a Netwide Assembler stub
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'The Netwide Assembler 0.98'

composite_rules:
  - id: elf-ehdr-phdr-patcher
    desc: Patches ELF ehdr and phdr
    crit: hostile
    conf: 0.97
    all:
      - id: patch-ehdr-symbol
      - id: patch-phdr-symbol
  - id: elf-ehdr-check-patcher
    desc: Checks then patches ELF ehdr
    crit: hostile
    conf: 0.96
    all:
      - id: patch-ehdr-symbol
      - id: chk-ehdr-symbol
  - id: elf-start-vir-ehdr-patcher
    desc: Starts virus after ehdr patch
    crit: hostile
    conf: 0.97
    all:
      - id: patch-ehdr-symbol
      - id: start-vir-symbol
  - id: elf-write-virus-overflow
    desc: Write-virus with overflow flag
    crit: hostile
    conf: 0.96
    all:
      - id: write-virus-symbol
      - id: overflow-flag-symbol
  - id: elf-write-virus-ehdr-patcher
    desc: Write-virus after ehdr patch
    crit: hostile
    conf: 0.96
    all:
      - id: write-virus-symbol
      - id: patch-ehdr-symbol
  - id: elf-overflow-ehdr-patcher
    desc: Overflow flag with ehdr patch
    crit: hostile
    conf: 0.94
    all:
      - id: overflow-flag-symbol
      - id: patch-ehdr-symbol
  - id: elf-start-infection-virus-code
    desc: Start-infection with virus-code
    crit: hostile
    conf: 0.97
    all:
      - id: start-infection-symbol
      - id: virus-code-symbol
  - id: elf-binomitized-infection
    desc: Binomitized banner starts infection
    crit: hostile
    conf: 0.97
    all:
      - id: binomitized-banner
      - id: start-infection-symbol
  - id: elf-binomitized-virus-code
    desc: Binomitized banner with virus-code
    crit: hostile
    conf: 0.96
    all:
      - id: binomitized-banner
      - id: virus-code-symbol
  - id: elf-lotek-virus-code
    desc: LoTek banner with virus-code
    crit: hostile
    conf: 0.94
    all:
      - id: lotek-wintermute-banner
      - id: virus-code-symbol
  - id: elf-lotek-nasm-stub
    desc: LoTek banner with NASM stub
    crit: hostile
    conf: 0.96
    all:
      - id: lotek-wintermute-banner
      - id: nasm-embedded-stub
  - id: elf-lotek-tiny-segments
    desc: LoTek virus with tiny load segments
    crit: hostile
    conf: 0.95
    all:
      - id: lotek-wintermute-banner
      - id: metadata/binary/layout/stub::tiny-backed-load-segments
  - id: elf-nasm-tiny-segments
    desc: NASM stub with tiny load segments
    crit: hostile
    conf: 0.93
    all:
      - id: nasm-embedded-stub
      - id: metadata/binary/layout/stub::tiny-backed-load-segments
