# Tools that set PF_WRITE on every ELF program header so a later
# infector can patch a normally read-only text segment.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1554

traits:
  - id: elfwrsec-banner
    desc: Names an ELFWRSEC header rewriter
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: ELFWRSEC
  - id: pf-write-ph-banner
    desc: Sets PF_WRITE on all PH sections
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: Set PF_WRITE flag
  - id: not-executable-elf-error
    desc: Rejects a non-executable ELF file
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Not an executable ELF file

composite_rules:
  - id: elfwrsec-pf-write
    desc: ELFWRSEC sets PF_WRITE on headers
    crit: hostile
    conf: 0.98
    all:
      - id: elfwrsec-banner
      - id: pf-write-ph-banner
  - id: elfwrsec-not-elf
    desc: ELFWRSEC rejects non-executable ELF
    crit: hostile
    conf: 0.95
    all:
      - id: elfwrsec-banner
      - id: not-executable-elf-error
  - id: pf-write-not-elf
    desc: PF_WRITE rewrite rejects non-ELF
    crit: hostile
    conf: 0.95
    all:
      - id: pf-write-ph-banner
      - id: not-executable-elf-error
