defaults:
  platforms: [windows, unix]
  for: [c, text]
  attack: T1204

traits:
  - id: dos-asm-find-first
    desc: DOS find-first file scan
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(\bah\s*,\s*0?4eh|\bax\s*,\s*0?4e00h)'

  - id: dos-asm-find-next
    desc: DOS find-next file scan
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(\bah\s*,\s*0?4fh|\bax\s*,\s*0?4f00h)'

  - id: dos-asm-set-dta
    desc: DOS sets local DTA
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)(mov\s+ah,0?1ah|\bDTA\b)'

  - id: dos-asm-com-mask
    desc: Quoted wildcard COM file mask
    crit: component
    conf: 0.93
    if:
      type: text
      regex: '(?i)["'']\*\.COM["'']'
    unless:
      - id: well-known/lib/crypto/openssl/
      - id: well-known/lib/crypto/nss::nss-crypto-test-data
      - id: well-known/tool/offensive/nmap::nmap-source-tree

  - id: dos-asm-open-helper-rw
    desc: DOS opens target via helper
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\bal\s*,\s*2[\s\S]{0,40}call\s+open'

  - id: dos-asm-reinfection-marker
    desc: DOS source reinfection marker
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?i)already infected|check.{0,40}infected'
    unless:
      - id: objectives/impact/infect/binary/unix-source::unix-aout-header-source
      - id: objectives/impact/infect/binary/unix-source::unix-coff-header-source

  - id: dos-asm-exe-header-patch
    desc: DOS patches EXE header
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)(EXE_PG_SIZE|EXE_INFEC|EXEINFEC)'

  - id: dos-asm-int21-loadexec-hook
    desc: DOS hooks load-exec call
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)CMP\s+AH,0?4BH'

  - id: dos-asm-resident-int21-label
    desc: DOS resident INT21 handler
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)(VIR_INT_21|GOTO_INT21)'

  - id: dos-asm-file-helper-labels
    desc: DOS file helper labels
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)(^|[\r\n])[ \t]*(OPEN_FILE|READ_FILE|WRITE_FILE)[ \t]*:'

  - id: dos-asm-com-exe-branch
    desc: DOS branches COM and EXE
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(COM_INFEC|EXE_INFEC)\b'

composite_rules:
  - id: dos-asm-open-target-rw
    desc: DOS opens target read-write
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/fs/file/open::dos-asm-open-rw
      - id: dos-asm-open-helper-rw

  - id: dos-int21-file-infection-sequence
    desc: DOS INT21 file infection sequence
    crit: hostile
    conf: 0.97
    all:
      - id: dos-asm-find-first
      - id: dos-asm-open-target-rw
      - id: micro-behaviors/fs/write/file/handle::dos-asm-write-handle
    any:
      - id: dos-asm-find-next
      - id: dos-asm-set-dta
      - id: dos-asm-com-mask
      - id: micro-behaviors/fs/search/content::quoted-exe-wildcard-mask
      - id: micro-behaviors/fs/read/file/handle::dos-asm-read-handle

  - id: dos-asm-reinfection-guard
    desc: DOS source reinfection guard
    crit: suspicious
    conf: 0.92
    for: [c, cpp]
    all:
      - id: dos-asm-reinfection-marker
      - id: dos-int21-file-infection-sequence

  - id: dos-append-preserve-infector
    desc: DOS append infector preserving metadata
    crit: hostile
    conf: 0.98
    all:
      - id: dos-int21-file-infection-sequence
      - id: micro-behaviors/fs/file/handle::dos-asm-seek-eof
    any:
      - id: micro-behaviors/fs/file/timestamp::dos-asm-get-file-time
      - id: micro-behaviors/fs/file/timestamp::dos-asm-set-file-time
      - id: micro-behaviors/fs/file/attributes::dos-asm-get-attributes
      - id: micro-behaviors/fs/file/attributes::dos-asm-set-attributes
      - id: dos-asm-reinfection-guard
      - id: metadata/lang/source/shape::source-host-byte-save
    needs: 3

  - id: dos-com-exe-infector-source
    desc: DOS COM and EXE infector source
    crit: hostile
    conf: 0.98
    all:
      - id: dos-asm-com-mask
      - id: micro-behaviors/fs/search/content::quoted-exe-wildcard-mask
      - id: dos-asm-exe-header-patch
      - id: micro-behaviors/fs/write/file/handle::dos-asm-write-handle
    any:
      - id: dos-asm-reinfection-guard
      - id: metadata/lang/source/shape::source-host-byte-save
      - id: micro-behaviors/fs/file/timestamp::dos-asm-set-file-time

  - id: dos-resident-loadexec-infector
    desc: DOS resident load-exec infector
    crit: hostile
    conf: 0.97
    all:
      - id: dos-asm-int21-loadexec-hook
      - id: dos-asm-resident-int21-label
      - id: dos-asm-file-helper-labels
      - id: dos-asm-com-exe-branch
    any:
      - id: dos-asm-exe-header-patch
      - id: dos-asm-reinfection-guard
      - id: micro-behaviors/fs/write/file/handle::dos-asm-write-handle
