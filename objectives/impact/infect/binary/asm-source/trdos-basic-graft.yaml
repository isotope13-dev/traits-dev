# These are source-text patterns, not evidence of execution. The composite
# does not bind the operands of its separate observations to one another.
defaults:
  platforms: [zxspectrum]
  for: [text]
  size_max: 131072
traits:
  - id: z80-trdos-read-sectors-source
    desc: Z80 source invokes TR-DOS sector read
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?im)^[ \t]*LD[ \t]+C[ \t]*,[ \t]*5[^\n]{0,256}\n[ \t]*CALL[ \t]+[#\$]3D13\b'
  - id: z80-trdos-write-sectors-source
    desc: Z80 source invokes TR-DOS sector write
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?im)^[ \t]*LD[ \t]+C[ \t]*,[ \t]*6[^\n]{0,256}\n[ \t]*CALL[ \t]+[#\$]3D13\b'
  - id: z80-basic-entry-select-source
    desc: Z80 source compares BASIC entry type
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^[ \t]*CP[ \t]+["'']B["'']'
  - id: z80-entry-length-update-source
    desc: Z80 source increases a stored byte
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^[ \t]*ADD[ \t]+A[ \t]*,[^\n]{1,80}\n[ \t]*LD[ \t]+\(HL\)[ \t]*,[ \t]*A\b'
  - id: z80-restart-return-saved-source
    desc: Z80 source restarts and exchanges registers
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^[ \t]*RST[ \t]+56\b[^\n]{0,256}\n[ \t]*EXX\b'
  - id: z80-stack-to-alternate-af-source
    desc: Z80 source saves stack value in AF
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^[ \t]*POP[ \t]+AF[^\n]{0,256}\n[ \t]*EX[ \t]+AF[ \t]*,[ \t]*AF'''
  - id: z80-alternate-af-to-stack-source
    desc: Z80 source pushes alternate AF value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^[ \t]*EX[ \t]+AF[ \t]*,[ \t]*AF''[^\n]{0,256}\n[ \t]*PUSH[ \t]+AF\b'
  - id: z80-saved-register-copy-source
    desc: Z80 source copies from decremented saved pointer
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^[ \t]*POP[ \t]+HL[^\n]{0,256}\n[ \t]*DEC[ \t]+HL[^\n]{0,256}\n[ \t]*LDIR\b'
composite_rules:
  - id: z80-trdos-basic-entry-copy-source
    desc: TR-DOS BASIC edits and saved-register copying
    crit: hostile
    conf: 0.93
    near_bytes: 8192
    all:
      - id: z80-trdos-read-sectors-source
      - id: z80-trdos-write-sectors-source
      - id: z80-basic-entry-select-source
      - id: z80-entry-length-update-source
      - id: z80-restart-return-saved-source
      - id: z80-stack-to-alternate-af-source
      - id: z80-alternate-af-to-stack-source
      - id: z80-saved-register-copy-source
