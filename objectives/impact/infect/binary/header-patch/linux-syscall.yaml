defaults:
  platforms: [linux]
  for: [elf]

composite_rules:
  - id: build-aware-header-rewriting-parasite
    desc: Build-aware ELF header rewriting with host-return code
    crit: hostile
    conf: 0.96
    attack: T1554
    # Independent code, syscall, self-inspection, and build-context evidence.
    # No taunt, infector symbol, or infection-marker name is required.
    all:
      - id: micro-behaviors/data/format/executable/header::elf-header-read-rewrite-syscalls
      - id: header-rewrite-entry-return-payload
      - id: micro-behaviors/fs/file/truncate::truncate-syscall
      - id: micro-behaviors/fs/proc/info/path::self-exe-readlink-capability
      - id: micro-behaviors/fs/proc/info/path::process-self-cmdline
      - id: micro-behaviors/fs/proc/info/path::process-self-environ
      - id: metadata/build/environment::nix-build-top-env-marker
