defaults:
  platforms: [windows]
  for: [source]
traits:
  - id: file-mapping-pair-source
    desc: 'file mapping pair source'
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: CreateFileMappingA.{0,64}MapViewOfFile
    unless:
      - id: well-known/lib/rust-system-bindings::windows-rs-generated-api-source
  - id: pe-image-size-field-source
    desc: PE image size field manipulation in source
    crit: component
    conf: 0.9
    if:
      type: text
      word: pe_imagesize
    unless:
      - id: well-known/lib/rust-system-bindings::windows-rs-generated-api-source
  - id: pe-virt-size-field-source
    desc: PE section virtual size manipulation in source
    crit: component
    conf: 0.9
    if:
      type: text
      word: oe_virt_size
    unless:
      - id: well-known/lib/rust-system-bindings::windows-rs-generated-api-source
  - id: pe-phys-size-field-source
    desc: "PE section physical size manipulation in src"
    crit: component
    conf: 0.9
    if:
      type: text
      word: oe_phys_size
    unless:
      - id: well-known/lib/rust-system-bindings::windows-rs-generated-api-source
  - id: injofs-source
    desc: Injection offset tracking in source
    crit: component
    conf: 0.88
    if:
      type: text
      word: injofs
    unless:
      - id: well-known/lib/rust-system-bindings::windows-rs-generated-api-source
  - id: jmpofs-source
    desc: Jump offset tracking in source
    crit: component
    conf: 0.88
    if:
      type: text
      word: jmpofs
    unless:
      - id: well-known/lib/rust-system-bindings::windows-rs-generated-api-source
  # `copy_to_stack` is an ordinary helper name in compilers, JITs, VMs and
  # ABI/calling-convention shims — HotSpot's C2 String.indexOf intrinsic
  # generator (c2_stubGenerator_x86_64_string.cpp) defines one to spill the
  # haystack for SIMD comparison. The matcher only finds that identifier, so
  # it cannot support the "copies virus body to stack" claim on its own; it is
  # one leg of the nastena family signature, and both consuming composites
  # pair it with the author-banner/mutex or rdtsc+cdrom-probe legs.
  - id: copy-to-stack-source
    desc: copy_to_stack helper function name
    crit: component
    conf: 0.96
    if:
      type: text
      word: copy_to_stack
    unless:
      - id: well-known/lib/rust-system-bindings::windows-rs-generated-api-source
  - id: locale-icountry-source
    desc: Locale country gate in source
    crit: notable
    conf: 0.9
    if:
      type: text
      word: LOCALE_ICOUNTRY
    unless:
      - id: well-known/lib/rust-system-bindings::windows-rs-generated-api-source
  - id: get-locale-info-source
    desc: GetLocaleInfoA reference in source
    crit: notable
    conf: 0.9
    if:
      type: text
      word: GetLocaleInfoA
    unless:
      - id: well-known/lib/rust-system-bindings::windows-rs-generated-api-source
  - id: rep-stosb-source
    desc: rep stosb memory wipe in source
    crit: component
    conf: 0.8
    if:
      type: text
      word: rep stosb
    unless:
      - id: well-known/lib/rust-system-bindings::windows-rs-generated-api-source
  - id: cdrom-probe-dir-source
    desc: Temporary l0x directory probe in source
    crit: component
    conf: 0.9
    if:
      type: text
      word: l0x
    unless:
      - id: well-known/lib/rust-system-bindings::windows-rs-generated-api-source
composite_rules:
  - id: mapped-last-section-pe-infector-source
    desc: Memory-mapped PE last-section appending infector source
    crit: suspicious
    conf: 0.98
    all:
      - id: file-mapping-pair-source
      - id: pe-image-size-field-source
      - id: pe-virt-size-field-source
      - id: pe-phys-size-field-source
      - id: injofs-source
      - id: jmpofs-source
    unless:
      - id: well-known/lib/rust-system-bindings::windows-rs-generated-api-source
  - id: locale-gated-file-wipe-source
    desc: Locale-gated destructive wipe logic in source
    crit: suspicious
    conf: 0.95
    all:
      - id: locale-icountry-source
      - id: get-locale-info-source
      - id: rep-stosb-source
    unless:
      - id: well-known/lib/rust-system-bindings::windows-rs-generated-api-source
  - id: drive-propagation-loop-source
    desc: Drive-jittered propagation loop with writable media probe
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/os/random/prng/seed::rdtsc-seed-source
      - id: cdrom-probe-dir-source
      - id: copy-to-stack-source
    unless:
      - id: well-known/lib/rust-system-bindings::windows-rs-generated-api-source
