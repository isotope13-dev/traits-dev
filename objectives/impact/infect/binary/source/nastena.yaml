defaults:
  platforms: [windows]
  for: [source]
traits:
  - id: file-mapping-pair-source
    desc: 'file mapping pair source'
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: CreateFileMappingA.{0,64}MapViewOfFile
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  - id: pe-image-size-field-source
    desc: PE image size field manipulation in source
    crit: notable
    conf: 0.9
    if:
      type: text
      word: pe_imagesize
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  - id: pe-virt-size-field-source
    desc: PE section virtual size manipulation in source
    crit: notable
    conf: 0.9
    if:
      type: text
      word: oe_virt_size
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  - id: pe-phys-size-field-source
    desc: "PE section physical size manipulation in src"
    crit: notable
    conf: 0.9
    if:
      type: text
      word: oe_phys_size
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  - id: copy-to-stack-source
    desc: copy_to_stack helper function name
    crit: notable
    conf: 0.96
    if:
      type: text
      word: copy_to_stack
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
      - id: well-known/lib/format/zlib::zlib-compression-library
composite_rules:
  - id: mapped-last-section-pe-infector-source
    desc: Memory-mapped PE last-section appending infector source
    crit: suspicious
    conf: 0.98
    all:
      - id: file-mapping-pair-source
      - id: pe-image-size-field-source
      - id: pe-virt-size-field-source
      - id: pe-phys-size-field-source
      - id: metadata/lang/source/naming/offset::injofs-source
      - id: metadata/lang/source/naming/offset::jmpofs-source
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
