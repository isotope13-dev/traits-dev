defaults:
  for:
    - pe
  platforms:
    - windows
traits:
  - id: subdirectory-infection-comment
    desc: Directory infection text reference
    crit: component
    conf: 0.95
    for:
      - c
    if:
      type: string_literal
      substr: infects files in current directory and all subdirectories
composite_rules:
  - id: infector-directory-traversal-source
    desc: Directory infection and traversal clues
    crit: suspicious
    conf: 0.96
    for:
      - c
    all:
      - id: objectives/impact/infect/binary/source::subdirectory-infection-comment
    any:
      - id: metadata/lang/natural/phrasing/system::linked-list-traversal-comment
      - id: micro-behaviors/fs/directory/enumerate::recursive-directory-traversal-source
