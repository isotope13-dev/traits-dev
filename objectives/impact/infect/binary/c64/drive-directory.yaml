# These are 6502 instruction sequences, not a claim that the instructions ran.
# The combination describes a BASIC-started C64 program that uploads drive
# code, edits directory-track file pointers and updates a directory marker.
defaults:
  platforms: [commodore64]
  for: [data]
  size_max: 63488

traits:
  - id: drive-serial-upload-loop
    desc: 6502 serial output loop bytes
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: 'A2 ?? BD ?? ?? 20 DD ED CA 10 ??'

  - id: drive-directory-track-setup
    desc: 1541 directory-track setup bytes
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: 'A9 12 8D 00 04 85 08 85 0A 85 0C'

  - id: drive-sector-job-loop
    desc: 1541 sector job loop bytes
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: 'A9 90 2C A9 80 A2 03 95 00 B5 00 30 ?? C9 01'

  - id: drive-directory-entry-redirection
    desc: 6502 directory-entry pointer rewrite bytes
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: 'BD ?? ?? 91 C0 85 ?? 88 A9 12 91 C0'

  - id: drive-directory-marker-write
    desc: 6502 directory-sector marker update bytes
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: 'A9 00 85 0D 20 ?? ?? A5 ?? 8D A7 06 4C ?? ??'

composite_rules:
  - id: drive-resident-directory-infector
    desc: C64 drive code redirects directory entries
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/file/magic/numbers::c64-basic-sys-pattern
      - id: drive-serial-upload-loop
      - id: drive-directory-track-setup
      - id: drive-sector-job-loop
      - id: drive-directory-entry-redirection
      - id: drive-directory-marker-write
