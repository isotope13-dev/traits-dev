# Infection tagging: a file infector stamps a marker section into every
# host it patches and skips any host that already carries it (the
# reinfection guard). The marker name is attacker-chosen and never
# emitted by a toolchain, so the section name alone identifies the host
# as tagged — independent of the infection mechanism or the binary
# format (ELF note-cavity, PE section-append, Mach-O segment-graft all
# share the habit).
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
  attack: T1554

traits:
  - id: infection-marker-section
    desc: Section named as an infection marker
    # A section literally named `.attack`, `.infected`, `.pwned`, `.evil`,
    # or `.virus`. The `(^|,)` anchor also matches the Mach-O
    # `SEGMENT,section` display form.
    crit: suspicious
    conf: 0.95
    if:
      type: section
      regex: '(?i)(^|,)\.(attack|infected|pwned|evil|virus)$'
