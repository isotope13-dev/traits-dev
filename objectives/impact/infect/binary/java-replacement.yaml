defaults:
  platforms: [windows, unix]
  for: [class]
traits:
  - id: jvm-file-replacement-infection
    desc: JVM infection commands accompany file deletion and replacement
    crit: hostile
    conf: 0.98
    # Match operation roles, not the server or staging filename. Class-file
    # constants show both replacement targets and the operator's infection
    # intent. This is static capability evidence, not observed execution.
    if:
      type: yara
      source: |
        rule jvm_file_replacement_infection {
          strings:
            $command = /[;.!]infect(classes|jars)/ ascii nocase
            $classes = ".class" ascii
            $jars = ".jar" ascii
            $file = "java/io/File" ascii
            $list = "listFiles" ascii
            $delete = "delete" ascii
            $copy = "copy" ascii
            $canonical = "getCanonicalPath" ascii
            $download = "download" ascii
          condition:
            uint32be(0) == 0xcafebabe and all of them
        }
