# C-source PT_NOTE-to-PT_LOAD "note cavity" ELF infector (Silvio Cesare
# technique). Sibling to elf-asm.yaml, which detects the hand-written x86
# assembly form; this file detects the same infection primitive expressed in
# C: locate the target's PT_NOTE program header, rewrite it in place into a
# read+exec PT_LOAD segment pointing at appended parasite bytes, redirect the
# ELF entry point into that segment, and optionally graft a matching
# executable section header. The entry-point write also lives in
# objectives/impact/infect/binary/header/elf-growth (elf-entry-point-redirection,
# for: [elf]); that atom covers the compiled binary, these cover the C source.
defaults:
  platforms: [unix]
  for: [c, cpp]
  attack: T1554
  mbc: B0009

composite_rules:
  # Partial signature: converting an existing PT_NOTE header into a loadable
  # segment. Surfaced on its own so a future infector that stops short of the
  # full cluster still reads as suspicious.
  - id: note-cavity-segment-conversion
    desc: PT_NOTE inspection with PT_LOAD assignment
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/data/format/executable/header::elf-note-type-comparison
      - id: micro-behaviors/data/format/executable/header::elf-load-type-assignment

  # Full note-cavity ELF file infector: find the note segment, repurpose it as
  # an R+X load segment, and redirect execution into (or graft a section for)
  # the appended parasite. No legitimate linker or loader performs this
  # combination against an existing binary.
  - id: c-note-cavity-elf-infector
    desc: C-source PT_NOTE-cavity ELF file infector
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/format/executable/header::elf-note-type-comparison
      - id: micro-behaviors/data/format/executable/header::elf-load-type-assignment
      - id: micro-behaviors/data/format/executable/header::elf-rx-segment-assignment
      - id: micro-behaviors/data/format/executable/header::elf-entry-assignment
    any:
      - id: objectives/lateral-movement/infection/file::infect-argument-call
      - id: micro-behaviors/data/source/function/names::parasite-code-label
    unless:
      - id: well-known/tool/reverse-engineering/
