# Native PE Windows .lnk shortcut hijacking and enumeration via ShellLink COM.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1547.009
  mbc: F0012

composite_rules:
  - id: pe-enumerates-lnk-shortcuts
    desc: Unsigned PE enumerates .lnk shortcuts via ShellLink
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/os/com/shortcut::pe-shelllink-com-api
      - id: micro-behaviors/fs/path/extension::lnk-extension-reference
      - id: micro-behaviors/fs/directory/readdir/native::find-first-file
      - id: micro-behaviors/fs/path/location::shell-get-folder-path
      - id: metadata/signature/absent::unsigned-pe-executable
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product/

  - id: pe-shortcut-hijack-implant
    desc: Unsigned implant hijacks shortcuts via ShellLink COM
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/com/shortcut::pe-shelllink-com-api
      - id: micro-behaviors/fs/path/extension::lnk-extension-reference
      - id: micro-behaviors/fs/directory/readdir/native::find-first-file
      - id: metadata/signature/absent::unsigned-pe-executable
    any:
      - id: objectives/collection/keylog/hook::windows-hook-chain-recording-keylogger
      - id: objectives/command-and-control/remote-command/http-agent::native-python-task-output-agent
      - id: micro-behaviors/communications/ip/literal::http-ip-url
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product/
