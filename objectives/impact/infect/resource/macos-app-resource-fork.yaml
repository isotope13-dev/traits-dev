# OSX/Leap.A infector: Spotlight finds recently used applications, the
# original main executable is copied into the infected file's resource fork
# and the worm is copied over Contents/MacOS/<name>, running the host from
# the fork afterwards.
defaults:
  platforms: [macos]
  for: [macho]
  attack: T1554

composite_rules:
  - id: spotlight-app-executable-resource-fork-swap
    desc: Finds apps via Spotlight and stashes executables in resource forks
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/discovery/host/software::spotlight-app-query
      - id: micro-behaviors/fs/path/resource-fork::copy-into-resource-fork
      - id: micro-behaviors/fs/path/bundle::app-main-executable-format
