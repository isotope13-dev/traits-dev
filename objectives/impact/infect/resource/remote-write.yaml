# PE that both rewrites resources (Begin/Update/EndUpdateResource) and
# injects into remote processes — resource staging plus live injection.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055,T1554
  mbc: B0033

composite_rules:
  - id: resource-update-remote-write-infector
    desc: Updates PE resources and writes remote memory
    crit: hostile
    conf: 0.97
    all:
      # ANSI/Unicode umbrellas: the original legs mixed one A entry point with
      # two W ones, so a binary that consistently used either spelling missed.
      - id: micro-behaviors/fs/file/write/resource::begin-update-resource-any
      - id: micro-behaviors/fs/file/write/resource::update-resource-any
      - id: micro-behaviors/fs/file/write/resource::end-update-resource-any
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
    unless:
      # Wine's kernel32.dll (and any Windows/ReactOS system DLL) *implements*
      # BeginUpdateResource/UpdateResource/VirtualAllocEx/WriteProcessMemory
      # for the programs above it, so it carries the whole cluster by
      # definition. An API provider exporting the surface is the opposite of
      # an infector importing it — see metadata/binary/vendor/wine.yaml.
      - id: metadata/binary/vendor/
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/
