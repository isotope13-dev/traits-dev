# PE that both rewrites resources (Begin/Update/EndUpdateResource) and
# injects into remote processes — resource staging plus live injection.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055,T1554
  mbc: B0033

composite_rules:
  - id: resource-update-remote-write-infector
    desc: Updates PE resources and writes remote memory
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/file/write/resource::begin-update-resource-a
      - id: micro-behaviors/fs/file/write/resource::update-resource-w
      - id: micro-behaviors/data/embedded/payload/resource::end-update-resource-w
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/
