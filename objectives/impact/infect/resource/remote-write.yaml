# PE that both rewrites resources (Begin/Update/EndUpdateResource) and
# injects into remote processes — resource staging plus live injection.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055,T1554
  mbc: B0033

composite_rules:
  - id: resource-update-remote-write-infector
    desc: Updates PE resources and writes remote memory
    crit: hostile
    conf: 0.97
    all:
      # ANSI/Unicode umbrellas: the original legs mixed one A entry point with
      # two W ones, so a binary that consistently used either spelling missed.
      - id: micro-behaviors/fs/write/file/resource::begin-update-resource-any
      - id: micro-behaviors/fs/write/file/resource::update-resource-any
      - id: micro-behaviors/fs/write/file/resource::end-update-resource-any
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
    unless:
      # A named compatibility runtime must also export the API surface it
      # implements; an identity marker alone cannot suppress this behavior.
      - id: metadata/binary/symbols/resource-memory-exports::windows-resource-memory-compatibility-provider
      - id: metadata/installer/product/
      # kernel32 exports the whole resource-update and remote-write surface.
      - id: well-known/app/system/microsoft/platform::microsoft-signed-kernel-api-dll-context
