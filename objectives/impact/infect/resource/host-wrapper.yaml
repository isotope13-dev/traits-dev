defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

composite_rules:
  - id: resource-host-wrapper-overwrite
    desc: Self-copy resource wrapper overwrites executable targets
    crit: hostile
    conf: 0.98
    attack: T1554
    mbc: B0033
    all:
      - id: micro-behaviors/fs/write/file/resource::rcdata-update-between-overwrite-copies-x86
      - id: micro-behaviors/fs/write/file/resource::begin-update-resource-any
      - id: micro-behaviors/fs/write/file/resource::update-resource-any
      - id: micro-behaviors/fs/write/file/resource::end-update-resource-any
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: micro-behaviors/fs/file/copy::copyfile-w
      - id: micro-behaviors/process/info/current::get-module-filename-wide
      - id: micro-behaviors/fs/read/file/handle::read-file
