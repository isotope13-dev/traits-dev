defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: wildcard-exe-mask
    desc: Executable-file wildcard search mask
    crit: component
    conf: 0.95
    # Some Delphi builds keep the glob as inline ASCII data that the
    # normalized text extractor does not surface.
    if:
      type: hex
      pattern: "2A 2E 65 78 65 2A"
      section: .text

composite_rules:
  - id: delphi-resource-appender
    desc: Delphi PE resource-section appender pattern
    crit: hostile
    attack: T1554
    all:
      - id: micro-behaviors/fs/file/write/resource::begin-update-resource-a
      - id: micro-behaviors/fs/file/write/resource::update-resource-a
      - id: micro-behaviors/fs/file/write/resource::end-update-resource-a
      - id: micro-behaviors/fs/traversal/drives::get-logical-drive-strings
      - id: wildcard-exe-mask
    any:
      - id: micro-behaviors/fs/enumerate/directory::find-first-file-a
      - id: micro-behaviors/fs/enumerate/directory::find-next-file-a
