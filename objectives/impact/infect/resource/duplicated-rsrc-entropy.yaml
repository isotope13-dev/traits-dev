defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: duplicated-rsrc-high-entropy
    desc: Multiple PE .rsrc sections with large high-entropy payload
    # Layout and entropy alone do not establish executable infection. Keep
    # decoder-backed graft detections hostile in binary/rewrite and Expiro.
    crit: suspicious
    conf: 0.9
    attack: T1027
    all:
      - id: metadata/binary/section/label/conventional::duplicated-rsrc-sections
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
