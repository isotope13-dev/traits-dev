defaults:
  platforms: [unix, windows]
  for: [data]
  size_min: 2048
  size_max: 262144
  attack: T1091,T1547

traits:
  - id: symbian-six-installer-header
    desc: Data has Symbian release-six installer header
    crit: notable
    if:
      type: hex
      pattern: '12 3A 00 10 19 04 00 10'
      offset: 4
  - id: symbian-recognizer-bluetooth-package-paths
    desc: Symbian package stages recognizer and Bluetooth
    crit: notable
    if:
      type: yara
      source: |
        rule symbian_recognizer_bluetooth_package_paths {
          strings:
            $secure = "\\SYSTEM\\SYMBIANSECUREDATA\\" wide nocase
            $recognizer = "\\SYSTEM\\RECOGS\\" wide nocase
            $sis = ".SIS" wide nocase
            $mdl = ".MDL" wide nocase
            $bluetooth = "BLUETOOTH.DLL" ascii nocase
            $obex = "IROBEX" ascii nocase
          condition:
            all of them
        }

  - id: symbian-installer-first-file-runs
    desc: Symbian first file record requests execution
    crit: notable
    if:
      type: hex
      pattern: '00 00 00 00 03 00 00 00'
      offset: 102
  - id: symbian-installer-file-table-at-102
    desc: Symbian installer points to file table
    crit: notable
    if:
      type: hex
      pattern: '66 00 00 00'
      offset: 52

composite_rules:
  - id: symbian-bluetooth-recognizer-self-package
    desc: Symbian installer combines Bluetooth and staging paths
    crit: hostile
    conf: 0.95
    all:
      - id: symbian-installer-first-file-runs
      - id: symbian-installer-file-table-at-102
      - id: symbian-six-installer-header
      - id: symbian-recognizer-bluetooth-package-paths
