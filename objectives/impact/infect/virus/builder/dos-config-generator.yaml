# DOS virus generator configurators prompt for a virus name and infection
# options, then write a source template. Those prompts are build-time input
# for malware; a single prompt phrase is not enough on its own.
defaults:
  for: [data, ne, dos_com]
  platforms: [windows, unix]
  attack: T1587.001

traits:
  - id: dos-config-virus-name-prompt
    desc: Virus generator asks for a virus name
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: "Virus name ?"
  # Text extraction splits these prompts at "(", "<", and ",", so they are
  # matched as the exact ASCII bytes in a hex pattern.
  - id: dos-config-infect-target-prompt
    desc: Virus generator asks which types to infect
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: "49 6E 66 65 63 74 20 3D 20 28 43 2C 45 29 20 3F"
  - id: dos-config-resident-prompt
    desc: Virus generator asks if virus stays resident
    crit: notable
    conf: 0.93
    if:
      type: hex
      pattern: "52 65 73 69 64 65 6E 74 20 3C 59 2C 4E 3E 20 3F"
  - id: dos-config-encryption-prompt
    desc: Virus generator asks whether to encrypt virus
    crit: notable
    conf: 0.93
    if:
      type: hex
      pattern: "45 6E 63 72 79 70 74 69 6F 6E 20 3D 20 3C 59 2C 4E 3E"
  - id: dos-config-antidebug-prompt
    desc: Virus generator asks for anti-debugger option
    crit: notable
    conf: 0.93
    if:
      type: hex
      pattern: "41 6E 74 69 44 65 62 75 67 67 65 72 20 3D 20 3C 59 2C 4E 3E"

composite_rules:
  - id: dos-virus-config-builder
    desc: DOS virus generator config prompts for infection options
    crit: hostile
    conf: 0.95
    all:
      - id: dos-config-virus-name-prompt
      - id: dos-config-infect-target-prompt
    any:
      - id: dos-config-resident-prompt
      - id: dos-config-encryption-prompt
      - id: dos-config-antidebug-prompt
    needs: 1
