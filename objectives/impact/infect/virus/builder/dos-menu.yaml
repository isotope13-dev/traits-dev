# DOS virus-builder menus. A builder that offers both a polymorphic virus
# option and COM or EXE output generates viruses for the operator. The
# builder's own name belongs to its family rule under well-known/tool.
defaults:
  for: [data]
  platforms: [windows, unix]
  attack: T1587.001

traits:
  - id: dos-builder-polymorphic-option
    desc: Virus builder offers polymorphic generation
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Make Polymorphic virus

  - id: dos-builder-com-exe-output
    desc: Virus builder selects COM or EXE output
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'Make \.(EXE|COM)\b'

  - id: dos-builder-setup-option
    desc: Virus builder exposes a setup menu
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: Virus setup option

composite_rules:
  - id: dos-virus-builder-menu
    desc: DOS virus builder menu generates polymorphic COM or EXE viruses
    crit: hostile
    conf: 0.96
    all:
      - id: dos-builder-polymorphic-option
      - id: dos-builder-com-exe-output
