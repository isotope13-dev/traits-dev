defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
  size_min: 10200
  size_max: 65536
  attack: T1027

traits:
  - id: dos-byte-xor-position-decoder
    desc: DOS position-independent byte XOR decode loop
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: 'E8 00 00 5D 81 ED ?? ?? 8D B6 ?? ?? E8 ?? ?? EB ?? 8B 96 ?? ?? B9 ?? 00 8B FE AC 32 C2 AA E2 FA C3'
  - id: dos-xor-0d-com-wildcard
    desc: XOR-encoded DOS COM wildcard
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: '27 32 23 4E 32 60'
  - id: dos-xor-0d-findfirst-int21
    desc: XOR-encoded DOS find-first operation
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'B9 43 80 9B ?? ?? C0 2C'
  - id: dos-xor-0d-open-read
    desc: XOR-encoded DOS file-open operation
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'B5 0D 30 B7 ?? ?? C0 2C'

composite_rules:
  - id: dos-byte-xor-com-search-and-write-infector
    desc: XOR-obfuscated COM entry searches and infects COM files
    crit: hostile
    conf: 0.99
    near_bytes: 12000
    all:
      - id: metadata/binary/code/control-transfer::entry-near-jump-bytes
      - id: dos-byte-xor-position-decoder
      - id: dos-xor-0d-com-wildcard
      - id: dos-xor-0d-findfirst-int21
      - id: dos-xor-0d-open-read
