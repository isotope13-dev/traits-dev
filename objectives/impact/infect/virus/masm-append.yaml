# MASM source listings of PE-appending EXE infectors, as published in virus
# ezines. Each atom is one step of the infection chain: enumerating EXE
# targets, position-independent delta addressing, stealth API resolution via
# export-table checksums, and the first-generation host-entry marker.
# Legitimate MASM file examples never combine delta positioning with checksum
# API resolution and an EXE infection loop, and the hostile composite requires
# the full chain plus the first-generation marker leg.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1486
  mbc: B0032

traits:
  - id: masm-file-enumeration-pair
    desc: MASM enumerates files with FindFirstFileA
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'FindFirstFileA[\s\S]{0,950}FindNextFileA'

  - id: masm-getdelta-call-pop
    desc: MASM call-pop delta position independence
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bcall\s+\w+\W{1,12}\w+:\W{1,12}pop\s+ebp\b'

  - id: masm-checksum-export-scan
    desc: MASM resolves APIs by export checksum scan
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: '(?i)export table[^<>]{0,200}checksum|checksum[^<>]{0,200}export table'

  - id: masm-first-generation-messagebox
    desc: MASM first-generation host-entry payload marker
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'FirstGeneration:[\s\S]{0,600}[Mm]essageBox'

composite_rules:
  - id: masm-exe-enumeration
    desc: MASM enumerates EXE targets nearby
    crit: suspicious
    conf: 0.93
    near_bytes: 400
    all:
      - id: masm-file-enumeration-pair
      - id: objectives/impact/infect/virus::ilasm-exe-target-wildcard

  - id: masm-appending-exe-infector
    desc: MASM source infects EXE files by appending
    crit: hostile
    conf: 0.95
    all:
      - id: masm-exe-enumeration
      - id: masm-getdelta-call-pop
      - id: masm-checksum-export-scan
    any:
      - id: masm-first-generation-messagebox
