defaults:
  for: [ne]
  platforms: [windows]
  attack: T1565.001

traits:
  - id: dos-multiformat-infector-antivirus-targets
    desc: DOS infector targets many file types
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule dos_multiformat_infector_antivirus_targets {
          strings:
            $purpose = "DOS Infection Machine" ascii nocase
            $extensions = "execomsysobjbatovlarjrar" ascii nocase
            $antivirus = "ANTI-VIR.DAT" ascii nocase
            $checksum = "AVP.CRC" ascii nocase
            $boot = "MBR is infected" ascii nocase
          condition:
            uint16(0) == 0x5a4d and all of them
        }
