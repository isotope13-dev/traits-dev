defaults:
  for: [dos_com, data]
  platforms: [windows, unix]
  size_max: 65536
  attack: T1027.014
  mbc: B0032

composite_rules:
  - id: dos-xnor-word-encrypted-stub
    desc: DOS MZ stub with XNOR word decryptor loop
    crit: hostile
    conf: 0.98
    near_bytes: 32
    all:
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-mz-push-regs-cs-ds-setup
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-xnor-word-decrypt-loop
