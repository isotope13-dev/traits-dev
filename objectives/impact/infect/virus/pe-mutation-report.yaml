defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
traits:
  - id: file-infection-success-report
    desc: Reports successful file infection
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bFile infected successfully[!:. ]'
      section: .rdata
composite_rules:
  # Mapping APIs alone do not prove infection. Require the actual header
  # mutation mechanism and an explicit successful-infection diagnostic.
  - id: mapped-pe-infection-header-mutation
    desc: Mapped PE infection clears image protections
    crit: hostile
    conf: 0.99
    attack: T1554
    all:
      - id: file-infection-success-report
      - id: micro-behaviors/fs/file/section::x86-rwx-aslr-nx-certificate-header-patch
      - id: micro-behaviors/fs/memory/mmap::map-view-of-file
