defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_max: 65536

# A resident DOS COM virus opens with a near jump over a host exit stub and
# carries a dense, encrypted body. The jump and the body density are metadata
# facts; the exit stub at offset 3 ties them to a COM entry. Each leg alone
# appears in ordinary small DOS programs, so the composite requires all three.
traits:
  - id: dos-com-exit-stub-entry
    desc: COM jump over INT 21h exit stub
    crit: notable
    if:
      type: hex
      pattern: "B8 4C 4C CD 21"
      offset: 3

  # Getto.2000 style generated decryptors chain every decoder instruction with
  # a short jump so no two decode steps are adjacent. The CS-relative word
  # exchange loads the ciphertext and the CS-relative word store writes the
  # plain text back, each followed by its own jump.
  - id: dos-jump-chained-word-load
    desc: CS-relative word swap chained by short jump
    crit: notable
    if:
      type: hex
      pattern: "2E 87 0? EB ??"

  - id: dos-jump-chained-word-store
    desc: CS-relative word store chained by short jump
    crit: notable
    if:
      type: hex
      pattern: "2E 89 0? EB ??"

composite_rules:
  - id: dos-encrypted-com-body
    desc: DOS COM with near-jump entry over a dense encrypted body
    crit: hostile
    all:
      - id: metadata/binary/code/control-transfer::entry-near-jump-bytes
      - id: metadata/binary/layout/entropy::com-dense-region-7bit
      - id: dos-com-exit-stub-entry

  - id: dos-polymorphic-jump-chained-decryptor
    desc: DOS COM with jump-chained in-place word decryptor over dense body
    crit: hostile
    attack: T1027.002
    all:
      - id: dos-jump-chained-word-load
      - id: dos-jump-chained-word-store
      - id: metadata/binary/layout/entropy::com-dense-region-7bit
