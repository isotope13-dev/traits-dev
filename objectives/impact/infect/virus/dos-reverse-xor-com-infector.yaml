defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_min: 600
  size_max: 65536
  attack: T1027

traits:
  - id: dos-reverse-xor-decoder
    desc: DOS block reversal and XOR loop
    crit: component
    if:
      type: hex
      pattern: '8B 04 41 8B 5C 02 41 86 E0 41 86 FB 41 93 35 CE CE 81 F3 CE CE 89 04 89 5C 02 83 C6 04'
  - id: dos-reverse-xor-search
    desc: Encoded DOS COM file search
    crit: notable
    if:
      type: hex
      pattern: '77 80 7A 32 1B 45 CE EE CF F3 0C 4F CC BC EF 03'
  - id: dos-reverse-xor-write
    desc: Encoded DOS COM infection write
    crit: notable
    if:
      type: hex
      pattern: '96 77 8E 7A 03 1C FD CC 8C CE 76 EF 1C FD 07 FD'

composite_rules:
  - id: dos-reverse-xor-com-infector
    desc: Obfuscated DOS code searches and infects COM files
    crit: hostile
    near_bytes: 512
    all:
      - id: dos-reverse-xor-decoder
      - id: dos-reverse-xor-search
      - id: dos-reverse-xor-write
