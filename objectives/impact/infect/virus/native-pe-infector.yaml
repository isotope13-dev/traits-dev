defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # Some infected PEs leave no diagnostic text. Requiring executable
  # traversal, PE-signature inspection, target truncation/writes, executable
  # launch, and targeted AV process termination avoids relying on a family name.
  - id: recursive-pe-rewrite-and-launch-infector
    desc: PE rewrite and launch paired with AV process termination
    crit: hostile
    conf: 0.94
    attack: T1554
    all:
      - id: metadata/binary/instruction/sequence/unspecified::pe-signature-immediate-compare
      - id: micro-behaviors/fs/directory/readdir/native::find-file-walker
      - id: micro-behaviors/fs/file/truncate::file-truncate-capability
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: objectives/evasion/anti-av/kill::chinese-av-reference-termination-api-profile

  # PE signature checks and file writes are common in legitimate software.
  # Requiring explicit infection language, recursive drive/file traversal and
  # code-page changes captures a native executable infector instead.
  - id: native-recursive-pe-file-infector
    desc: Native binary scans and modifies PE files as an infector
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/binary/instruction/sequence/unspecified::pe-signature-immediate-compare
      - id: metadata/lang/natural/phrasing/security::infect-file-text
      - id: micro-behaviors/fs/enumerate/drives::drive-and-file-tree-traversal
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/ui/dialog/error::infected-files-wording
