# Ferite script self-copying and appending virus patterns.
# Walks current directory, filters .fe scripts, and appends virus code.
defaults:
  platforms: [unix, windows]
  for: [html, text]
  attack: T1080
  mbc: B0032

traits:
  - id: ferite-script-name-call
    desc: Ferite Sys.scriptName self path query
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'Sys.scriptName()'

  - id: ferite-directory-walk
    desc: Ferite Directory traversal calls
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'Directory\s*\([^)]{0,32}\)[\s\S]{0,300}\.getEntry\(\)'

  - id: ferite-target-script-filter
    desc: Ferite target script extension check
    crit: notable
    conf: 0.90
    if:
      type: text
      regex: 'String\.index\s*\(\s*\w+\s*,\s*(&quot;|["''])\.fe(&quot;|["''])\)'

  - id: ferite-script-append-write
    desc: Ferite script file recreate and append write
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'File\.create\s*\([^)]{1,64}\)\.writeln\s*\(\s*\w+\s*\+\s*\w+\s*\)'

composite_rules:
  - id: ferite-script-appending-infector
    desc: Ferite script appending virus infection routine
    crit: hostile
    conf: 0.98
    all:
      - id: ferite-script-name-call
      - id: ferite-directory-walk
      - id: ferite-script-append-write
    any:
      - id: ferite-target-script-filter
