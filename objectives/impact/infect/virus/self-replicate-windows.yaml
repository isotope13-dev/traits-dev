# Win32 self-replication: a program whose only externally visible effect is to
# produce another copy of its own executable.
#
# The replication primitive is: resolve own image path (GetModuleFileName),
# duplicate the image (CopyFile), then reopen the duplicate and rewrite bytes
# inside it (CreateFile + GetFileSize/ReadFile + SetFilePointer + WriteFile).
# The rewrite step is what separates a replicator from a plain self-copy: the
# offspring is deliberately made to differ from the parent, which is how these
# families defeat hash- and signature-based detection generation after
# generation. Because the mutated field is random per generation, no byte
# signature over it can ever match twice - the import/behaviour chain is the
# only durable evidence.
#
# A self-updater, installer or backup tool performs the same file operations,
# but always alongside a reason to exist - a command line, a window, a network
# fetch, a registry write, a child process, a drive or directory walk. The
# hostile rule therefore requires the replication chain AND the absence of any
# such capability.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # Import co-occurrence only: nothing here ties the CopyFile source to the
  # module path the self-read chain resolved, so the atom cannot show that the
  # image *being* copied is the program's own. Every Win32 program that
  # duplicates a data file and edits it in place imports exactly this set -- a
  # minilab controller copying calibration files matched it in full. The claim
  # "copies own image" belongs to the composites below, which add the
  # replication context; on its own this is one leg of that signature.
  - id: self-copy-rewrite-import-chain
    desc: Imports the self-copy and file-rewrite API set
    crit: component
    conf: 0.9
    attack: T1554
    all:
      - id: objectives/anti-static/obfuscation/payload/self-read::self-read-file-import-chain-ansi
      - id: micro-behaviors/fs/file/copy::copyfile-a
      - id: micro-behaviors/fs/file/write/direct::write-file
      - id: micro-behaviors/fs/file/handle::set-file-pointer
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/sfx/
      - id: well-known/lib/platform/microsoft-wininet::wininet-system-context
      - id: well-known/app/enterprise/athoc::athocafrc-legacy-module-context
      - id: well-known/app/infrastructure/vmware-tools::vmware-tools-upgrader-context
      - id: well-known/app/network/juniper-setup-client::juniper-setup-client-identity
      - id: well-known/app/enterprise/citrix-receiver::citrix-receiver-context

  # Every leg is a capability that a program with a purpose of its own needs at
  # least one of: a way to be driven (window, service dispatcher, pipe server),
  # a way to reach the network, a way to touch the registry, a way to launch
  # something, or a way to find files other than its own image. A binary that
  # has none of them and still duplicates and rewrites its own executable is
  # doing nothing but replicating.
  #
  # The list has to name every spelling of each capability, or the exception
  # misses programs that plainly have one. It previously enumerated only
  # name-imported variants, so a 2008 MFC network-service EXE -- which imports
  # WSAStartup by ORDINAL from WS2_32, walks directories with
  # FindFirstFile/FindNextFile, serves named pipes and runs a service control
  # dispatcher -- read as a binary with no capability at all and was convicted
  # as a pure self-replicator.
  - id: program-capability-beyond-self-copy
    desc: Binary has a capability besides self-copying
    crit: exception
    conf: 0.9
    any:
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/process/create/exec::shell-execute
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/os/registry/access::registry-create-key-api
      - id: micro-behaviors/os/registry/access::registry-set-value-api
      - id: micro-behaviors/communications/socket/init::wsa-startup
      - id: micro-behaviors/communications/socket/init::winsock-startup-ordinal
      - id: micro-behaviors/communications/http/get::internet-open
      - id: micro-behaviors/communications/ipc/named-pipe::create-named-pipe
      - id: micro-behaviors/os/service/control::service-control-dispatch
      - id: micro-behaviors/fs/traversal/drives::get-logical-drives
      - id: micro-behaviors/fs/enumerate/directory::file-enumeration-with-access
      - id: micro-behaviors/fs/enumerate/directory::find-file-walker
      - id: micro-behaviors/ui/window/manage/control::create-window-ex

  - id: pure-self-replicator
    desc: Self-copying image rewriter with no other capability
    crit: hostile
    conf: 0.96
    attack: T1554
    all:
      - id: self-copy-rewrite-import-chain
      - id: micro-behaviors/fs/file/stat::get-file-size
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: program-capability-beyond-self-copy

  - id: agent-dcbc-self-mutating-locker
    desc: Agent DCBC locker mutates its copied image and establishes Run persistence
    crit: hostile
    conf: 0.99
    attack: "T1554,T1060,T1491.001"
    all:
      - id: self-copy-rewrite-import-chain
      - id: micro-behaviors/data/string/malware::agent-dcbc-stop-marker
      - id: objectives/persistence/login/registry/run-key::run-key-persistence-api-block
    any:
      - id: micro-behaviors/data/string/malware::agent-dcbc-escape-taunt
      - id: micro-behaviors/data/string/malware::agent-dcbc-rule-taunt
    unless:
      - id: metadata/signed/platform/

  - id: self-mutating-surveillance-injector-crash-capability
    desc: Self-mutating surveillance injector also carries a deliberate system-crash path
    crit: hostile
    conf: 0.99
    attack: "T1554,T1055.001,T1113,T1499.004"
    all:
      - id: self-copy-rewrite-import-chain
      - id: objectives/evasion/process/injection/atom-bombing::atom-bombing-capable
      - id: objectives/collection/clipboard/capture::windows-clipboard-screen-hook-surveillance
      - id: objectives/impact/system/crash::bsod-raise-error
    unless:
      - id: metadata/signed/platform/
