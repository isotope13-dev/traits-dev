defaults:
  for: [ne]
  platforms: [windows]
  attack: T1027.001

traits:
  - id: legacy-executable-virus-generator
    desc: Legacy file infection and virus generator
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule legacy_executable_virus_generator {
          strings:
            $infect = "Infect file" ascii nocase
            $done = "Infection done" ascii nocase
            $generator = "virus generation engine" ascii nocase
            $target = "*.EXE" ascii nocase
          condition:
            uint16(0) == 0x5a4d and all of them
        }
