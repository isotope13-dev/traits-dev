# A parasitic file infector appends its encrypted body to a legitimate
# host and duplicates the resource section to hold it: the host keeps
# its own code and version identity, while a second, oversized,
# high-entropy .rsrc carries the virus. Packers that duplicate
# resources do not pair the duplicate with an encrypted payload blob;
# signed or installer-delivered hosts are excluded.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1554
  mbc: B0023

composite_rules:
  - id: appended-high-entropy-resource-infector
    desc: Host PE carries duplicated high-entropy resource payload
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/anti-static/pack/section-anomaly::duplicated-resource-section-payload
      - id: metadata/binary/layout/checksum::certificate-directory-checksum-mismatch
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
