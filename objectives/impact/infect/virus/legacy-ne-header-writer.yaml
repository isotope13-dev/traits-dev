defaults:
  for: [ne]
  platforms: [windows]
  attack: T1565.001

traits:
  - id: legacy-ne-virus-header-check
    desc: Windows virus checks legacy executable headers
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        rule legacy_ne_virus_header_check {
          strings:
            $purpose = "Windows Virus" ascii nocase
            $header = { 81 7E ?? 4E 45 0F 85 ?? ?? 66 83 7E ?? 00 }
          condition:
            uint16(0) == 0x5a4d and all of them
        }
  - id: legacy-ne-low-level-file-write
    desc: Legacy program imports low-level file write
    crit: notable
    conf: 1.0
    if:
      type: symbol
      kind: import
      substr: lwrite

composite_rules:
  - id: legacy-ne-virus-header-rewriter
    desc: Windows virus modifies legacy executables
    crit: hostile
    conf: 0.98
    all:
      - id: legacy-ne-virus-header-check
      - id: legacy-ne-low-level-file-write
