defaults:
  for: [dos_com, data]
  platforms: [windows, unix]

composite_rules:
  - id: dos-resident-create-com-infector
    desc: Resident DOS hook writes its code to files with names ending in om
    crit: hostile
    attack: T1080
    mbc: B0032
    near_bytes: 128
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-low-memory-vector-swap
      - id: micro-behaviors/os/msdos/interrupt::dos-create-com-suffix-filter
      - id: micro-behaviors/fs/write/file/binary::dos-resident-create-write
