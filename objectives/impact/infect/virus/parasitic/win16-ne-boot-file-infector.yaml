defaults:
  for: [ne]
  platforms: [windows]
traits:
  - id: win16-ne-infected-message
    desc: Legacy trojan claims system infection
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: infected your system
composite_rules:
  - id: win16-ne-boot-file-infector
    desc: Win16 program infects DOS boot files
    crit: hostile
    conf: 0.97
    attack: T1565.001
    all:
      - id: micro-behaviors/fs/path/config/boot::dos-boot-file-drive-path
      - id: micro-behaviors/fs/file/open/call::win16-ne-int21-open
      - id: win16-ne-infected-message
      - id: micro-behaviors/os/event/shutdown::win16-ne-exit-windows-text
