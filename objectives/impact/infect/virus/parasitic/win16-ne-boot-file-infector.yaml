defaults:
  for: [ne]
  platforms: [windows]
traits:
  - id: win16-ne-dos-open
    desc: Win16 stub opens file via DOS
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: "B8 00 3D [0-8] CD 21"
  - id: win16-ne-infected-message
    desc: Legacy trojan claims system infection
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: infected your system
  - id: win16-ne-exit-windows-text
    desc: References Win16 Windows-exit API
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: ExitWindows
composite_rules:
  - id: win16-ne-boot-file-infector
    desc: Win16 program infects DOS boot files
    crit: hostile
    conf: 0.97
    attack: T1565.001
    all:
      - id: micro-behaviors/fs/path/config/boot::dos-boot-file-drive-path
      - id: win16-ne-dos-open
      - id: win16-ne-infected-message
      - id: win16-ne-exit-windows-text
