# This complete byte fingerprint is the infected-host loader, not merely an
# unusual entry section. It validates a kernel image, resolves its exports and
# decodes the parasitic body. Require the complete mechanism and diverted entry.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
composite_rules:
  # This image lacks the byte-specific Virut decoders below, but it combines
  # PE signature inspection with a writable entry, multiple RWX sections and
  # a severely overhung relocation directory. Treat the complete structure as
  # a probable parasitic image scanner, not as a Virut family identification.
  - id: pe-scanner-writable-entry-overhung-relocs
    desc: PE header scan in writable-entry image with relocation overhang
    crit: hostile
    conf: 0.91
    attack: T1554
    all:
      - id: metadata/binary/instruction/operand::mz-words-in-code
      - id: metadata/binary/instruction/sequence/comparison::pe-signature-immediate-compare
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/section/header::reloc-overhang-dominant
      - id: metadata/binary/section/permission::pe-multiple-executable-writable-sections
    # MetaQuotes Setup images show this layout; its identity suppresses the match.
    unless:
      - id: well-known/app/finance/metatrader::metatrader-setup-manifest

  - id: diverted-entry-rolling-parasite
    desc: Parasitic PE loader with writable entry
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/api-resolution/manual::x86-adjusted-kernel-image-check
      - id: metadata/binary/instruction/opcode::x86-export-hash-like-sequence
      - id: micro-behaviors/data/decode/xor/feedback::x86-multiply-xor-subtract-byte-loop
      - id: metadata/binary/section/header::pe-entry-in-writable-section
  # Variants of the same loader whose export-hash resolver is regenerated per
  # infection still validate the kernel image and are entered through an
  # executable resource section that the host never used for code.
  - id: diverted-resource-entry-kernel-validating-parasite
    desc: Parasitic PE loader entered through executable resources
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/api-resolution/manual::x86-adjusted-kernel-image-check
      - id: metadata/binary/section/header::pe-entry-in-resource-section
      - id: metadata/binary/section/permission::executable-rsrc-section
      - id: metadata/binary/section/header::writable-entry-with-wx-section
    unless:
      - id: metadata/installer/product/
      - id: metadata/binary/code/entry::return-only-no-directories
