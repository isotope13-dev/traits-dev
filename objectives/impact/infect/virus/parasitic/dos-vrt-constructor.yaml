defaults:
  for: [data, dos_com]
  platforms: [windows, unix]

traits:
  - id: vrt-toolkit-banner
    desc: Virus Researcher's Toolkit banner
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: RESEARCHER'S TOOLKi
  - id: vrt-infection-target-prompt
    desc: Virus builder asks which files to infect
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: INFECTS COMs-[1]
  - id: vrt-encryption-prompt
    desc: Virus builder asks to encrypt the virus
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: MAKE THIS VIRUS ENCRYPTED
  - id: vrt-activation-prompt
    desc: Virus builder sets activation chance
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: PERCENT CHANCE OF ACTIVATION
  - id: vrt-config-keys
    desc: Virus builder config template keys
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(Infections|CommandCom|AllowZero|Traversal) = U'

composite_rules:
  - id: vrt-constructor
    desc: DOS Virus Researcher's Toolkit builds viruses
    crit: hostile
    conf: 0.98
    attack: T1542.003
    mbc: B0032
    all:
      - id: vrt-toolkit-banner
      - id: vrt-infection-target-prompt
    any:
      - id: vrt-encryption-prompt
      - id: vrt-activation-prompt
      - id: vrt-config-keys
    needs: 1
