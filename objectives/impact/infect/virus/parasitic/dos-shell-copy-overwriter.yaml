# A DOS program (often Borland Pascal, whose Exec takes COMSPEC and a
# length-prefixed command string) that searches for *.com files, clears their
# read-only attribute with `attrib -r`, and copies its own image over each one
# through `COMSPEC /c copy` is an overwriting file virus. It never appends, so
# the EOF-patch legs of the appender rules are incidental. Each string is
# ordinary in a batch helper; the file search beside them is the infection.
defaults:
  platforms: [windows, unix]
  for: [data]
  size_min: 1024
  size_max: 262144
  attack: T1080
  mbc: B0032
traits:
  - id: dos-shell-attrib-clear-command
    desc: DOS command string clears read-only with attrib
    crit: component
    conf: 0.85
    if:
      type: text
      substr: '/c attrib -r'
      case_insensitive: true

  - id: dos-shell-copy-command
    desc: DOS command string runs /c copy
    crit: component
    conf: 0.85
    if:
      type: text
      substr: ' /c copy '
      case_insensitive: true

  - id: dos-comspec-environment-name
    desc: DOS program reads the COMSPEC variable
    crit: component
    conf: 0.85
    if:
      type: text
      substr: COMSPEC

  - id: dos-self-announced-virus-banner
    desc: DOS program announces itself as virus
    crit: notable
    conf: 0.9
    if:
      type: raw
      regex: '(?i)This Is [A-Za-z0-9_ -]{1,24}virus'

composite_rules:
  - id: dos-comspec-attrib-copy-overwrite-infector
    desc: DOS program searches COM files and overwrites them via COMSPEC copy
    crit: hostile
    conf: 0.93
    all:
      - id: dos-mz-find-first-search
      - id: micro-behaviors/fs/search/command::dos-executable-compatible-wildcard
      - id: dos-comspec-environment-name
      - id: dos-shell-attrib-clear-command
      - id: dos-shell-copy-command

  - id: dos-self-announced-virus-file-search
    desc: DOS program announces itself as a virus and searches for files
    crit: hostile
    conf: 0.92
    all:
      - id: dos-self-announced-virus-banner
      - id: dos-mz-find-first-search
      - id: micro-behaviors/fs/search/command::dos-executable-compatible-wildcard
