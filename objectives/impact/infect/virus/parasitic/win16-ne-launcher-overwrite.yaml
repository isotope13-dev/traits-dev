# Win16 self-copy onto Windows and AOL launch targets. The save-result message
# keeps the path contiguous; the file name is split into a separate text run.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1565.001

traits:
  - id: win16-saved-as-launcher-path
    desc: Save message names a launcher path
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: 'Saved as c:\\(windows|aol30)\\(win|aol|regedit)'

composite_rules:
  - id: win16-ne-launcher-overwrite
    desc: Win16 program copies itself over Windows or AOL launchers
    crit: hostile
    conf: 0.95
    all:
      - id: win16-saved-as-launcher-path
      - id: micro-behaviors/fs/file/open/call::win16-ne-int21-open
