# Borland Pascal DPMI16/NE COM and EXE file infectors store adjacent
# length-prefixed extension literals (\x03com\x03exe or \x04.com\x04.EXE) alongside
# COMMAND.COM exclusion checks and INT 21h file open calls.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1565.001

traits:
  - id: ne-pascal-com-exe-ext-pair
    desc: Pascal COM and EXE extension pair
    crit: notable
    conf: 0.94
    if:
      type: raw
      regex: '[\x03\x04]\.?[cC][oO][mM][\x03\x04]\.?[eE][xX][eE]'

  - id: ne-command-com-skip-target
    desc: References COMMAND.COM system shell
    crit: notable
    conf: 0.85
    if:
      type: text
      exact: 'COMMAND.COM'

  - id: ne-pascal-exe-search-mask
    desc: Pascal short string *.EXE search mask
    crit: notable
    conf: 0.88
    if:
      type: raw
      regex: '\x05\*\.[eE][xX][eE]'

composite_rules:
  - id: ne-pascal-com-exe-infector
    desc: NE Pascal binary targets COM and EXE files via INT 21h
    crit: hostile
    conf: 0.96
    all:
      - id: ne-pascal-com-exe-ext-pair
      - id: ne-command-com-skip-target
      - id: micro-behaviors/fs/file/open/call::win16-ne-int21-open
