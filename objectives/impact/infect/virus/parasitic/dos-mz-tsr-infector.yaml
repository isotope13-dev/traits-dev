defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
traits:
  - id: dos-ivt-fc-trampoline
    desc: Plants REP MOVSW trampoline in IVT
    crit: suspicious
    conf: 0.95
    if:
      type: hex
      pattern: "C7 06 F0 03 F3 A5 [0-8] C6 06 F2 03 CB"
composite_rules:
  - id: dos-mz-tsr-exec-open-infector
    desc: Resident DOS MZ virus hooks EXEC and OPEN
    crit: hostile
    conf: 0.97
    attack: T1080
    mbc: B0032
    for: [data]
    all:
      - id: objectives/impact/infect/boot-sector::mz-boot-magic
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-get-set-vector-any
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-open-intercept
  - id: dos-mz-tsr-ivt-exec-infector
    desc: Resident DOS MZ virus hooks IVT INT 21h EXEC
    crit: hostile
    conf: 0.96
    attack: T1080
    mbc: B0032
    for: [data]
    all:
      - id: objectives/impact/infect/virus/parasitic::dos-mz-eof-entry-point
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-ivt-direct-hook
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-service-intercept
