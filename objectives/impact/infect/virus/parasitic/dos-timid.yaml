defaults:
  for: [dos_com, data]
  platforms: [windows, unix]
  size_max: 131072
  attack: T1080
  mbc: B0032

traits:
  - id: dos-com-find-open-rw
    desc: DOS FindFirst and read-write file open
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: 'B4 4E CD 21 [0-24] B8 02 3D CD 21'
  - id: dos-com-seek-eof-write-patch
    desc: DOS seek-to-EOF followed by file write
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: 'B8 02 42 CD 21 [0-24] B4 40 CD 21'
  - id: dos-com-jmp-e9-marker-patch
    desc: DOS patches E9 jump and writes file
    crit: notable
    conf: 0.93
    if:
      type: hex
      pattern: 'C6 06 ?? ?? E9 [0-32] B4 40 CD 21'

composite_rules:
  - id: dos-com-infector-append-patch
    desc: DOS COM file infector appends and patches E9 jump
    crit: hostile
    conf: 0.98
    near_bytes: 256
    all:
      - id: dos-com-find-open-rw
      - id: dos-com-seek-eof-write-patch
      - id: dos-com-jmp-e9-marker-patch
