defaults:
  for: [data, dos_com]
  platforms: [windows, unix]

traits:
  - id: tbtr-tsr-time-bomb
    desc: TSR Time Bomb banner
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: The TSR Time Bomb
  - id: tbtr-resident-trojan-banner
    desc: Resident Trojan banner
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: Resident Trojan Horse
  - id: tbtr-nasty-creation-toolkit
    desc: Nasty Creation Toolkit banner
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: Nasty Creation Toolkit
  - id: tbtr-hellfire-credit
    desc: Written By Hellfire credit
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: Written By Hellfire
  - id: tbtr-fat-whacker
    desc: FAT Whacker payload label
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: FAT Whacker
  - id: tbtr-boot-buster
    desc: Boot Buster payload label
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Boot Buster
  - id: tbtr-holy-scripture
    desc: Holy Scripture display label
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: Holy Scripture
  - id: tbtr-music-box
    desc: Music Box activation label
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: Music Box

composite_rules:
  - id: tbtr-constructor
    desc: DOS TBTR virus construction toolkit
    crit: hostile
    conf: 0.98
    attack: T1542.003
    mbc: B0032
    all:
      - id: tbtr-tsr-time-bomb
      - id: tbtr-resident-trojan-banner
    any:
      - id: tbtr-nasty-creation-toolkit
      - id: tbtr-hellfire-credit
      - id: tbtr-fat-whacker
      - id: tbtr-boot-buster
      - id: tbtr-holy-scripture
      - id: tbtr-music-box
    needs: 2
