defaults:
  platforms: [windows, unix]
  for: [data]
  size_min: 4096
  size_max: 1048576

traits:
  - id: dos-mz-eof-entry-point
    desc: MZ entry point sits near EOF
    crit: notable
    conf: 0.9
    if:
      type: yara
      source: |
        rule dos_mz_eof_entry_point {
          meta:
            filetypes = "data"
          condition:
            uint16(0) == 0x5A4D and
            uint16(0x08) >= 2 and
            (uint16(0x08) + uint16(0x16)) * 16 + uint16(0x14) >= filesize * 85 \ 100 and
            (uint16(0x08) + uint16(0x16)) * 16 + uint16(0x14) < filesize
        }

  # Size-unbounded forms of the DOS search legs. The micro-behavior traits cap
  # at 64 KiB, which skips MZ programs that an infector would still search.
  - id: dos-mz-find-first-search
    desc: DOS find-first search in an MZ program
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 4E [0-32] CD 21"

  - id: dos-mz-find-next-search
    desc: DOS find-next search in an MZ program
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 4F [0-32] CD 21"

composite_rules:
  - id: dos-mz-encrypted-eof-infector
    desc: MZ appender executes encrypted code near EOF
    crit: hostile
    conf: 0.98
    attack: T1080
    mbc: B0032
    all:
      - id: dos-mz-eof-entry-point
    any:
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-mz-cs-selfmod-decryptor
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-mz-xor-entry-decoder
    needs: 1

  - id: dos-mz-eof-jerusalem-infector
    desc: Jerusalem-family MZ infector runs appended code near EOF
    crit: hostile
    conf: 0.97
    attack: T1080
    mbc: B0032
    all:
      - id: dos-mz-eof-entry-point
      - id: micro-behaviors/os/msdos/interrupt::dos-jerusalem-ro-residency-probe

  - id: dos-mz-search-eof-append-infector
    desc: DOS MZ program searches files then appends at EOF
    crit: hostile
    conf: 0.93
    attack: T1080
    mbc: B0032
    all:
      - id: dos-mz-find-first-search
      - id: dos-mz-find-next-search
      - id: objectives/impact/infect/virus/parasitic::dos-com-seek-eof-write-patch
