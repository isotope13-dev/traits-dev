defaults:
  platforms: [windows, unix]
  for: [data]
  size_min: 4096
  size_max: 1048576

traits:
  - id: dos-mz-eof-entry-point
    desc: MZ entry point sits near EOF
    crit: notable
    conf: 0.9
    if:
      type: yara
      source: |
        rule dos_mz_eof_entry_point {
          meta:
            filetypes = "data"
          condition:
            uint16(0) == 0x5A4D and
            uint16(0x08) >= 2 and
            (uint16(0x08) + uint16(0x16)) * 16 + uint16(0x14) >= filesize * 85 \ 100 and
            (uint16(0x08) + uint16(0x16)) * 16 + uint16(0x14) < filesize
        }

composite_rules:
  - id: dos-mz-encrypted-eof-infector
    desc: MZ appender executes encrypted code near EOF
    crit: hostile
    conf: 0.98
    attack: T1080
    mbc: B0032
    all:
      - id: dos-mz-eof-entry-point
    any:
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-mz-cs-selfmod-decryptor
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-mz-xor-entry-decoder
    needs: 1

  - id: dos-mz-eof-jerusalem-infector
    desc: Jerusalem-family MZ infector runs appended code near EOF
    crit: hostile
    conf: 0.97
    attack: T1080
    mbc: B0032
    all:
      - id: dos-mz-eof-entry-point
      - id: micro-behaviors/os/msdos/interrupt::dos-jerusalem-ro-residency-probe
