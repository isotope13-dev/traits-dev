defaults:
  platforms: [macos]
  for: [macho]
  attack: T1554

composite_rules:
  - id: macos-macho-file-infector
    desc: macOS Mach-O viral file infector
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/format/executable/header::macho-swap-header-symbol
      - id: micro-behaviors/fs/directory/readdir/language::readdir-opendir
      - id: micro-behaviors/fs/directory/readdir/language::readdir-readdir
      - id: micro-behaviors/fs/chmod/modify::chmod-symbol
      - id: micro-behaviors/fs/write/file/handle::write--fwrite
    any:
      - id: micro-behaviors/fs/file/rename::rename-base
      - id: micro-behaviors/fs/delete/file/library::unlink
    unless:
      - id: metadata/signed/platform::apple
