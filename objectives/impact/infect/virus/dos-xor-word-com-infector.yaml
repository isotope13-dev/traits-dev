defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
  size_min: 10200
  size_max: 65536
  attack: T1027

traits:
  - id: dos-word-xor-position-decoder
    desc: DOS position-independent word XOR decode loop
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: 'E8 00 00 5B 81 EB ?? ?? 8B EB 8D B6 ?? ?? 56 8B 96 ?? ?? B9 ?? 00 8B FE [0-2] FC AD 33 C2 AB [0-2] E2 F8 C3'
  - id: dos-xor-1027-com-wildcard
    desc: XOR-encoded DOS COM wildcard
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: '3A 09 73 48 7D'
  - id: dos-xor-1027-findfirst-open
    desc: XOR-encoded DOS find-first and open operations
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: '93 5E 0C D9 [0-18] A8 25 2D'

composite_rules:
  - id: dos-word-xor-com-search-and-write-infector
    desc: XOR-obfuscated COM entry searches and infects COM files
    crit: hostile
    conf: 0.99
    near_bytes: 12000
    all:
      - id: metadata/binary/code/control-transfer::entry-near-jump-bytes
      - id: dos-word-xor-position-decoder
      - id: dos-xor-1027-com-wildcard
      - id: dos-xor-1027-findfirst-open
