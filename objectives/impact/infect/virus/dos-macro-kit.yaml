# DOS virus assembly macro kits (DVC-style .inc files).
#
# A macro include that combines stealth INT 86h/21h wrapper macros (calls
# emitted as raw db bytes, no INT opcode) with invalid-opcode emission
# (UD0 breaker macros) is a virus construction kit: the stealth calls dodge
# opcode-signature scanners while the breaker bytes trip up emulators and
# disassemblers. Ordinary MASM sources use the `int` mnemonic directly and
# never emit UD0.
defaults:
  platforms: [windows, unix]
  for: [text]
composite_rules:
  - id: dos-stealth-call-macro-kit
    desc: DOS virus stealth-call macro kit
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/os/msdos/interrupt::int-macro-wrapper
      - id: micro-behaviors/os/msdos/interrupt::raw-opcode-db-emission
      - id: micro-behaviors/os/msdos/interrupt::invalid-opcode-macro-bytes
