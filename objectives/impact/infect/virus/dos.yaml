defaults:
  platforms: [unix, windows, macos]
composite_rules:
  - id: dos-file-infector-c-source
    desc: DOS File Infector Virus (C Source Code)
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/msdos/interrupt::int-21h-inline-asm
      - id: micro-behaviors/os/msdos/interrupt::write-file-dup
      - id: micro-behaviors/os/msdos/interrupt::find-first-file-dup
    any:
      - id: micro-behaviors/fs/directory/traverse::set-current-directory-interrupt
      - id: micro-behaviors/os/msdos/interrupt::get-set-file-time
      - id: micro-behaviors/os/msdos/interrupt::set-file-attributes

  - id: dos-com-file-infector-virus
    desc: Searches and infects DOS COM executables
    crit: hostile
    conf: 0.99
    attack: T1080
    mbc: B0032
    for: [dos_com]
    all:
      - id: micro-behaviors/fs/search::dos-int21-find-first
      - id: micro-behaviors/fs/search::dos-executable-compatible-wildcard
      - id: micro-behaviors/fs/file/open::dos-open-update-int
      - id: micro-behaviors/fs/file/seek::dos-seek-end-int
      - id: micro-behaviors/fs/file/seek::dos-seek-start-int
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write
