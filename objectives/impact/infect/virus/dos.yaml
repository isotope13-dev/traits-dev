defaults:
  platforms: [unix, windows, macos]
composite_rules:
  - id: dos-file-infector-c-source
    desc: DOS File Infector Virus (C Source Code)
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/msdos/interrupt::int-21h-inline-asm
      - id: micro-behaviors/os/msdos/interrupt::write-file-dup
      - id: micro-behaviors/os/msdos/interrupt::find-first-file-dup
    any:
      - id: micro-behaviors/fs/directory/chdir::set-current-directory-interrupt
      - id: micro-behaviors/os/msdos/interrupt::get-set-file-time
      - id: micro-behaviors/os/msdos/interrupt::set-file-attributes

  # SillyC-style infector: the COM mask is PUSH-built on the stack, the
  # open service (AX=3D02h) is synthesized by IMUL, and the seek-to-start
  # service (AX=4200h) by INC AX, so the literal-mask and direct-service
  # legs of dos-com-file-infector-virus never appear.
  - id: dos-com-arithmetic-masked-infector
    desc: DOS COM infector with arithmetic-masked services
    crit: hostile
    conf: 0.97
    attack: T1080
    mbc: B0032
    for: [dos_com]
    all:
      - id: micro-behaviors/fs/search/command::dos-stack-imm-com-mask
      - id: micro-behaviors/fs/search/command::dos-int21-find-first
      - id: micro-behaviors/fs/search/command::dos-int21-find-next
      - id: micro-behaviors/os/syscall/invoke::dos-int21-arithmetic-service
      - id: micro-behaviors/fs/read/file/handle::dos-int21-read
      - id: micro-behaviors/fs/file/seek::dos-seek-start-inc-ax
      - id: micro-behaviors/fs/write/file/handle/int21::dos-int21-write

  - id: dos-com-file-infector-virus
    desc: Searches and infects DOS COM executables
    crit: hostile
    conf: 0.99
    attack: T1080
    mbc: B0032
    for: [dos_com]
    all:
      - id: micro-behaviors/fs/search/command::dos-int21-find-first
      - id: micro-behaviors/fs/search/command::dos-executable-compatible-wildcard
      - id: micro-behaviors/fs/file/open/write::dos-open-update-int
      - id: micro-behaviors/fs/file/seek::dos-seek-end-int
      - id: micro-behaviors/fs/file/seek::dos-seek-start-int
      - id: micro-behaviors/fs/write/file/handle/int21::dos-int21-write
