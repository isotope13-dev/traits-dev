# This complete byte fingerprint is the infected-host loader, not merely an
# unusual entry section. It validates a kernel image, resolves its exports and
# decodes the parasitic body. Require the complete mechanism and diverted entry.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
composite_rules:
  - id: diverted-entry-rolling-parasite
    desc: Parasitic PE loader with writable entry
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/api-resolution/manual::x86-adjusted-kernel-image-check
      - id: metadata/binary/instruction/opcode::x86-export-hash-like-sequence
      - id: micro-behaviors/data/decode/xor::x86-multiply-xor-subtract-byte-loop
      - id: metadata/binary/section/header::pe-entry-in-writable-section
  # Variants of the same loader whose export-hash resolver is regenerated per
  # infection still validate the kernel image and are entered through an
  # executable resource section that the host never used for code.
  - id: diverted-resource-entry-kernel-validating-parasite
    desc: Parasitic PE loader entered through executable resources
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/api-resolution/manual::x86-adjusted-kernel-image-check
      - id: metadata/binary/section/header::pe-entry-in-resource-section
      - id: metadata/binary/section/permission::executable-rsrc-section
      - id: metadata/binary/section/header::writable-entry-with-wx-section
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/code/entry::return-only-no-directories
