# The decoder uses the saved host entry byte as its XOR key. The encrypted
# sequence seeks to EOF, appends 398 bytes, and constructs the entry jump.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-saved-entry-xor-loop
    desc: DOS saved-entry XOR decoder loop
    crit: notable
    if:
      type: hex
      pattern: '8B DE 81 C3 82 01 8A 07 8B DE 83 C3 04 30 07 43 8B CE 81 C1 58 01 3B D9 75 F3'

  - id: dos-xor-append-entry-patch
    desc: XOR encoded DOS append and entry patch
    crit: notable
    if:
      type: yara
      source: |
        rule dos_xor_append_entry_patch {
          strings:
            $code = "\xb8\x02\x42\x33\xc9\x33\xd2\xe8\x72\x00\x72\x5f\x50\xb9\x8e\x01\xb4\x40\x8b\xd6\x83\xea\x08\xe8\x98\x00\x58\x72\x4e\x53\x8b\xde\x83\xeb\x08\xc6\x07\xe9\x40\x2e\x89\x47\x01\xc6\x47\x03\x90" xor(0-255)
          condition:
            $code
        }

composite_rules:
  - id: dos-int62-xor-com-infector
    desc: XOR encoded DOS COM infector appends code and patches entry
    crit: hostile
    attack: T1080
    all:
      - id: dos-saved-entry-xor-loop
      - id: dos-xor-append-entry-patch
