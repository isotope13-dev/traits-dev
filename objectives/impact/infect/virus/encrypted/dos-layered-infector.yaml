# The encoded sequence opens the target for writing, saves its timestamp,
# seeks to EOF and reads its header. It is protected by three decoder layers.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-additive-decoder-loop
    desc: DOS additive decoder loop
    crit: notable
    if:
      type: hex
      pattern: 'BF ?? ?? 8B F7 AC 2C ?? AA 4B 74 02 EB F7'

  - id: dos-layered-encoded-file-path
    desc: Encoded DOS file infection path
    crit: notable
    if:
      type: hex
      pattern: '29 56 0D AB C6 46 D7 48 E2 B2 F6 16 9E 29 66 C0 AB 3E 46 B2 76 A5 9E B2 B6 95 9E DD B4 DD DC 29 56 58 AB D3 5E 61 55 9E B2 B6 65 9E E8 AB 63 5E'

composite_rules:
  - id: dos-layered-com-exe-infector
    desc: Layered encoded DOS COM and EXE file infector
    crit: hostile
    attack: T1080
    all:
      - id: dos-additive-decoder-loop
      - id: dos-layered-encoded-file-path
