# DOS EXE virus that copies a loader to a fixed high-memory address and
# decrypts its body with a NEG-dword loop placed right after that copy.
# Either leg alone is common in packers and loaders; together they describe
# a self-decrypting resident body.
defaults:
  for: [data, dos_com]
  platforms: [windows, unix]
  attack: T1027
  mbc: B0032

traits:
  - id: dos-high-memory-trampoline-copy
    desc: Block-copies loader to segment offset F800h
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "BF 00 F8 B9 ?? ?? 51 F3 A4"

composite_rules:
  - id: dos-neg-dword-self-decrypt-infector
    desc: DOS image block-copies loader to F800h then NEG-decrypts body
    crit: hostile
    conf: 0.93
    near_bytes: 64
    all:
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-neg-dword-decrypt-loop
      - id: dos-high-memory-trampoline-copy
