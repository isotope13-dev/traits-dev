# The second signature is encrypted code that tests the COM entry marker
# and branches to the infection path. The decoder uses ciphertext feedback.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-feedback-decoder-loop
    desc: DOS feedback decoder loop
    crit: notable
    if:
      type: hex
      pattern: '8A F4 AC FB 32 E0 2A E6 86 E0 F5 8A F0 AA 90 E2 F1 CD 11'

  - id: dos-feedback-encoded-infection-check
    desc: Encoded DOS infection marker check
    crit: notable
    if:
      type: hex
      pattern: '3D 46 B0 55 08 8A 04 7E 39 F8 79 8C 28 95 2F 92 96 5A ED 02 00 04 02 02 BA 03 5B B9 20 20 D7 47'

composite_rules:
  - id: dos-feedback-file-infector
    desc: Encrypted DOS COM and EXE file infector
    crit: hostile
    attack: T1080
    all:
      - id: dos-feedback-decoder-loop
      - id: dos-feedback-encoded-infection-check
