# Encrypted-body DOS infectors: each composite pairs a decoder shape with a leg
# that runs or infects the revealed body (an INT 21h hook, an EXEC or file
# write, or an entry jump into an appended body). The decoder legs stay in
# polymorphic/decryptor and are referenced here by full directory-qualified ID.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 65536
  attack: T1027.014

composite_rules:
  - id: dos-nibble-rotated-virus-body
    desc: DOS executes an appended body after nibble-rotating it
    crit: hostile
    conf: 0.97
    for: [dos_com]
    all:
      - id: metadata/binary/code/control-transfer::entry-near-jump-bytes
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-appended-nibble-rotate-byte-loop

  - id: dos-additive-encrypted-infector
    for: [dos_com, static-lib]
    desc: DOS additive decoder with EXEC and FCB hooks
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-additive-immediate-word-loop
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-fcb-find-intercept
      - id: micro-behaviors/fs/file/read-write::dos-read-seek-write-time-sequences

  - id: dos-rotating-encrypted-virus-body
    desc: DOS decrypts a resident infector with a rolling ROR loop
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-incrementing-ror-byte-loop
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-delta-offset-dispatch
      - id: objectives/impact/infect/binary/dos/interrupt::dos-exec-hook-infector

  - id: dos-stack-xor-exec-infector
    desc: DOS encrypted payload hooks execution and infects files
    crit: hostile
    conf: 0.98
    for: [dos_com]
    all:
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-fixed-key-stack-word-xor
      - id: objectives/impact/infect/binary/dos/file::dos-seek-append-near-call-infector
      - id: objectives/impact/infect/binary/dos/interrupt::dos-exec-hook-infector
