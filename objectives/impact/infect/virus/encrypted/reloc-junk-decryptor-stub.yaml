# Relocation tables hold 16-bit page offsets, never code. A junk-padded
# self-locating decryptor (pushad, call $+5/pop, fixed-length decode loop) in
# a .reloc section that has grown far past its declared directory is where a
# parasitic infector keeps its body; the host's real relocations stay at the
# front so the image still loads.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

traits:
  - id: x86-getpc-decryptor-stub-in-reloc
    desc: Self-locating decryptor stub inside .reloc
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .reloc
      pattern: '60 55 8B EC [1-8] E8 01 00 00 00 ?? 5A [0-8] 81 EA ?? ?? ?? ?? 52 BE ?? ?? 00 00'

composite_rules:
  - id: reloc-overhang-decryptor-stub-parasite
    desc: Decryptor stub in overhung writable .reloc of an RWX image
    crit: hostile
    conf: 0.97
    attack: T1027.002,T1554
    all:
      - id: x86-getpc-decryptor-stub-in-reloc
      - id: metadata/binary/section/header::reloc-overhang-dominant
      - id: metadata/binary/section/permission::pe-multiple-executable-writable-sections
