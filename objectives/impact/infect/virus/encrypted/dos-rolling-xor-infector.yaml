# The encrypted instruction sequence is the read/write infection path under
# the incrementing XOR stream used by this resident DOS infector.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-incrementing-xor-decoder
    desc: DOS incrementing XOR decoder loop
    crit: notable
    if:
      type: hex
      pattern: "B4 1A 8D B6 37 01 B9 C1 06 30 24 46 FE C4 E2 F9"

  - id: dos-encoded-infection-path
    desc: Encoded DOS infection instruction path
    crit: notable
    if:
      type: hex
      pattern: "CB E8 25 AB 99 2A 21 A1 FC 95 D5 28 C7 2A 31 82 33 DC 39 36 8E 3C 39 B7 AD DF 3B D6 34 40 AA 4C F7 06 76 8F 74 9A 84 33 88 F8 0D 83"

composite_rules:
  - id: dos-rolling-xor-resident-infector
    desc: DOS resident file infector with incrementing XOR encoding
    crit: hostile
    attack: T1565.001
    all:
      - id: dos-incrementing-xor-decoder
      - id: dos-encoded-infection-path
