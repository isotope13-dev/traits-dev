defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
  size_min: 10000
  size_max: 65536
  attack: T1027

traits:
  - id: dos-indexed-byte-xor-decoder
    desc: DOS indexed byte XOR decoder
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: 'E8 00 00 5D 81 ED ?? ?? 8D B6 ?? ?? 8D BE ?? ?? B9 ?? ?? FC AC 56 8D B6 ?? ?? 32 04 5E AA E2 F4'
  - id: dos-xor7-com-wildcard
    desc: XOR-encoded DOS COM wildcard
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: '2D 29 44 48 4A'
  - id: dos-xor7-file-search-open
    desc: XOR-encoded DOS file search and open calls
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'B3 49 CA 26 C4 B3 48 CA 26 C4 BF 05 3A CA 26 C4'

  - id: dos-xor7-file-write
    desc: XOR-encoded DOS file write call
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'B3 47 CA 26 C4'

composite_rules:
  - id: dos-xor7-com-search-and-write-infector
    desc: XOR-obfuscated DOS code searches and modifies COM files
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: dos-indexed-byte-xor-decoder
      - id: dos-xor7-com-wildcard
      - id: dos-xor7-file-search-open
      - id: dos-xor7-file-write
