defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  attack: T1554,T1140
composite_rules:
  # Restoring the saved host register frame after the decrypt/drop/launch
  # chain distinguishes a parasitic deployment stub from an ordinary loader.
  # The finding asserts the presence of this code, not that it is reachable.
  - id: x86-xor-sibling-drop-launch-host-resume
    desc: Parasitic sibling drop-launch and host continuation
    crit: hostile
    conf: 0.99
    near_bytes: 512
    all:
      - id: micro-behaviors/process/deploy::x86-xor-sibling-drop-launch
      - id: metadata/binary/instruction/sequence::x86-restore-register-frame-indirect-jump
