defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: pecmd-drive-exe-walk
    desc: PECMD walks drives for existing executables
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)FORX\s+/O:N\s+@[D-Z]:\\\*,exfile,1,ifex\s+%exfile%\.exe'
  - id: pecmd-own-image-drive-copy
    desc: Copies own image to executable
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)file\s+%myname%=>%exfile%\.exe'

composite_rules:
  - id: pecmd-drive-executable-overwrite-worm
    desc: Drive executable overwrite worm
    crit: hostile
    conf: 0.98
    all:
      - id: pecmd-drive-exe-walk
      - id: pecmd-own-image-drive-copy
