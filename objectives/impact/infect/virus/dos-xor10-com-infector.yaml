defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_min: 155
  size_max: 65536
  attack: T1027,T1574

traits:
  - id: dos-xor10-short-decoder
    desc: DOS byte XOR decoder loop
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: 'BE 0A 01 B9 6C 00 80 34 10 46 E2 FA C3'
  - id: dos-xor10-encoded-com-search
    desc: Encoded COM search and wildcard
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: '3A 3E 53 7F 5D 10'
  - id: dos-xor10-encoded-file-writes
    desc: Encoded DOS file writes
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'A4 50 F8 55 10 DD 31 AA 10 11 A4 50 F8 38'

composite_rules:
  - id: dos-xor10-com-search-and-write-infector
    desc: Obfuscated DOS code searches and writes COM files
    crit: hostile
    conf: 0.99
    near_bytes: 256
    all:
      - id: dos-xor10-short-decoder
      - id: dos-xor10-encoded-com-search
      - id: dos-xor10-encoded-file-writes
