defaults:
  platforms: [windows]
  for: [html, vbs]
  attack: T1080
  mbc: B0032

traits:
  - id: vbs-fso-htm-extension-check
    desc: Checks file extension for HTML targets
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)GetExtensionName\s*\([^)]{1,40}\)\)?\s*=\s*["'']ht[ml]["'']'

  - id: html-infection-marker-check
    desc: Verifies HTML comment infection marker
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)readline\s*(<>|!=)\s*["'']<!--[a-z0-9_-]+-->["'']'

  - id: html-prepender-body-write
    desc: Writes infected HTML body to victim
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)writeline\s+vhost|writeline\s+["'']<html["'']'

  - id: source-script-element-text
    desc: Reads script text from current document
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bdocument\.Scripts\.NamedItem\([^\r\n)]{1,64}\)\.Text\b'

  - id: appends-script-element-header
    desc: Writes script element header to stream
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.WriteLine\s+"<script\s'

  - id: case-select-html-extensions
    desc: Selects HTML file extensions in a branch
    crit: component
    conf: 0.93
    if:
      type: text
      regex: '(?im)^[ \t]*Case\s+[^\r\n]{0,60}"htm(l)?"'

  - id: assigns-folder-files-enumerator
    desc: Assigns a folder file collection
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?im)^[ \t]*Set\s+\w+\s*=\s*\w+\.Files\b'

composite_rules:
  - id: html-vbscript-script-element-infection
    desc: Rewrites enumerated HTML files with current document scripts
    crit: hostile
    conf: 0.98
    all:
      - id: source-script-element-text
      - id: appends-script-element-header
      - id: assigns-folder-files-enumerator
      - id: micro-behaviors/fs/write/content::fso-open-as-text-stream-write
    any:
      - id: vbs-fso-htm-extension-check
      - id: case-select-html-extensions
    near_bytes: 3000

  - id: html-vbscript-file-infector
    desc: HTML VBScript prepends virus to HTML files
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/ui/window/dom/access::document-body-innerhtml-reference
      - id: vbs-fso-htm-extension-check
      - id: micro-behaviors/fs/write/content::fso-open-text-file-write
    near_bytes: 1500

  - id: html-vbscript-prepender-virus
    desc: HTML virus prepends code to desktop files
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/ui/window/dom/access::document-body-innerhtml-reference
      - id: micro-behaviors/fs/directory/readdir/language::fso-folder-files
      - id: html-infection-marker-check
      - id: html-prepender-body-write
    near_bytes: 1500
