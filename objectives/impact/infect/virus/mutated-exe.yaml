# Win32 CRT self-replicator: resolve own image, write a new .exe, launch it.
# The adjacent mutated_ / .exe literals are a compiled filename-construction
# leftover from one family; they are a component marker only. The hostile
# rule is the durable import chain so later variants that pick a different
# prefix still match.
defaults:
  attack: T1554
  mbc: E1027
  platforms: [windows]
  for: [pe]

traits:
  - id: mutated-exe-replica-name
    desc: Split mutated prefix and exe suffix
    crit: component
    if:
      type: hex
      pattern: 6d 75 74 61 74 65 64 5f 00 2e 65 78 65
      section: .rdata

composite_rules:
  - id: self-image-replica-launch
    desc: Writes and launches a self-replica
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/module/load::get-module-filename-ansi
      - id: micro-behaviors/fs/file/open::fopen
      - id: micro-behaviors/fs/file/binary::seek-and-descriptor-io
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/package/versioning::pe-version-resource
      - id: micro-behaviors/ui/window/manage/control::create-window-ex
      - id: micro-behaviors/communications/socket/init::wsa-startup
