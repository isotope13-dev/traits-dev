# A small Win32 replicator family reads its own image, mutates a random byte,
# writes the result as mutated_<random>.exe, and launches the offspring. The
# split filename constants and randomizer table are durable compiled markers;
# process creation confirms that the generated replica is executed.
defaults:
  attack: T1554
  mbc: E1027
  platforms: [windows]
  for: [pe]

traits:
  - id: mutated-exe-replica-name
    desc: Split mutated_<id>.exe replica filename marker
    crit: component
    if:
      type: hex
      pattern: 6d 75 74 61 74 65 64 5f 00 2e 65 78 65
      section: .rdata

composite_rules:
  - id: mutated-exe-self-replica-launch
    desc: Self-mutating executable writes and launches a randomized replica
    crit: hostile
    conf: 1.0
    all:
      - id: mutated-exe-replica-name
      - id: metadata/binary/section/metrics::mutated-exe-randomizer-string
      - id: micro-behaviors/os/module/load::get-module-filename-ansi
      - id: micro-behaviors/process/create/spawn::create-process-a
