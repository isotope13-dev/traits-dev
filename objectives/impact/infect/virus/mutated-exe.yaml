# Win32 CRT self-replicator: resolve its own image, write a deliberately named
# mutated executable, and launch it.  The API imports alone occur together in
# ordinary updaters, so the adjacent output-name fragments are required to
# establish that the generated child is intended as a mutated replica.
defaults:
  attack: T1554
  mbc: E1027
  platforms: [windows]
  for: [pe]

traits:
  - id: mutated-exe-replica-name
    desc: Split mutated prefix and exe suffix
    crit: component
    if:
      type: hex
      pattern: 6d 75 74 61 74 65 64 5f 00 2e 65 78 65
      section: .rdata

composite_rules:
  - id: self-image-replica-launch
    desc: Writes and launches a self-replica
    crit: hostile
    conf: 0.95
    all:
      - id: mutated-exe-replica-name
      - id: micro-behaviors/os/module/load::get-module-filename-ansi
      - id: micro-behaviors/fs/file/open::fopen
      - id: micro-behaviors/fs/file/write/direct::write--fwrite
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/package/versioning::pe-version-resource
      - id: micro-behaviors/ui/window/manage/control::create-window-ex
      - id: micro-behaviors/communications/socket/init::wsa-startup
      # radare2 release DLLs legitimately resolve their own paths, perform
      # file I/O, and launch helper processes as part of the tool suite.
      - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
