defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
  size_min: 561
  size_max: 65536
  attack: T1027
traits:
  - id: dos-xor-87-inline-decoder
    desc: DOS stub XOR-decodes a 545-byte body
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: 'B9 21 02 BE 10 01 8A 24 80 F4 87 88 24 46 E2 F6'
      offset: 0
  - id: dos-xor-87-com-wildcard
    desc: XOR-encoded COM filename wildcard
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'AD A9 C4 C8 CA'
  - id: dos-xor-87-mz-infection-check
    desc: XOR-encoded DOS file-header infection check
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: '0C 89 87 86 A1 BE 8B F3 67 A1 06 BB CA DD F3 5E'
composite_rules:
  - id: dos-xor-87-com-file-infector
    desc: XOR-obfuscated DOS COM infection routine
    crit: hostile
    conf: 0.98
    all:
      - id: dos-xor-87-inline-decoder
      - id: dos-xor-87-com-wildcard
      - id: dos-xor-87-mz-infection-check
