defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: infection-source-destination-log
    desc: Reports infection source and destination paths
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: 'INFECT %s -> %s'
      section: .data
composite_rules:
  # Header rewriting alone is also normal in packers. Require an explicit
  # infection operation and the concealed remote payload activation mechanism.
  - id: pe-appending-command-host-infector
    desc: PE infection with command-host injection
    crit: hostile
    conf: 0.98
    attack: T1554
    all:
      - id: metadata/binary/instruction/sequence::x86-pe-section-entry-image-rewrite
      - id: infection-source-destination-log
      - id: objectives/evasion/process/injection/runtime::cmd-host-rwx-export-thread
