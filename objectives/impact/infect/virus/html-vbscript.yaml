defaults:
  platforms: [windows]
  for: [html, vbs]
  attack: T1080
  mbc: B0032

traits:
  - id: html-body-innerhtml-read
    desc: Reads document body HTML content
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bdocument\.body\.innerHTML\b'

  - id: vbs-fso-htm-extension-check
    desc: Checks file extension for HTML targets
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)GetExtensionName\s*\([^)]{1,40}\)\s*=\s*["'']ht[ml]["'']'

  - id: html-infection-marker-check
    desc: Verifies HTML comment infection marker
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)readline\s*(<>|!=)\s*["'']<!--[a-z0-9_-]+-->["'']'

  - id: html-prepender-body-write
    desc: Writes infected HTML body to victim
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)writeline\s+vhost|writeline\s+["'']<html["'']'

composite_rules:
  - id: html-vbscript-file-infector
    desc: HTML VBScript prepends virus to HTML files
    crit: hostile
    conf: 0.99
    all:
      - id: html-body-innerhtml-read
      - id: vbs-fso-htm-extension-check
      - id: micro-behaviors/fs/write/content::fso-open-text-file-write
    near_bytes: 1500

  - id: html-vbscript-prepender-virus
    desc: HTML virus prepends code to desktop files
    crit: hostile
    conf: 0.995
    all:
      - id: html-body-innerhtml-read
      - id: micro-behaviors/fs/directory/readdir::fso-folder-files
      - id: html-infection-marker-check
      - id: html-prepender-body-write
    near_bytes: 1500
