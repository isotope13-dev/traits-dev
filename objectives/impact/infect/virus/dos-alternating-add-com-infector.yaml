defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_min: 547
  size_max: 65536
  attack: T1027,T1574

traits:
  - id: dos-alternating-add-word-decoder
    desc: DOS decoder alternates word-add keys
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: '8A 3E 05 01 8A 1E CC 02 03 C3 2B F6 01 9C 20 01 46 46 86 FB 81 FE AC 01 75 F2'
  - id: dos-alternating-add-encoded-open
    desc: Encoded DOS file attribute and open calls
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: '55 22 68 2A CE 2E 1E 9C DE 32 87 52 9D A2 33 BC'
  - id: dos-alternating-add-encoded-write
    desc: Encoded DOS file write call
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'F5 F6 CD 6D 94 F1 A8 37 68 1A DB 68 87'

composite_rules:
  - id: dos-alternating-add-com-infector
    desc: Obfuscated DOS code searches and rewrites files
    crit: hostile
    conf: 0.99
    near_bytes: 512
    all:
      - id: dos-alternating-add-word-decoder
      - id: dos-alternating-add-encoded-open
      - id: dos-alternating-add-encoded-write
