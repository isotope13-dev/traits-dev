defaults:
  for: [ne]
  platforms: [windows]
  attack: T1565.001,T1562.001

traits:
  - id: dos-exec-hook-antivirus-records
    desc: DOS hook targets antivirus and executables
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_exec_hook_antivirus_records {
          strings:
            $vector = { B8 21 35 CD 21 }
            $intercept = { 3D 00 4B 74 ?? 80 FC 3D 74 ?? 80 FC 43 }
            $extension = { 0D 20 20 3D 65 78 74 ?? 3D 63 6F }
            $av1 = "ANTI-VIR.DAT" ascii nocase
            $av2 = "AVP.CRC" ascii nocase
            $av3 = "CHKLIST.CPS" ascii nocase
            $av4 = "CHKLIST.MS" ascii nocase
          condition:
            uint16(0) == 0x5a4d and $vector and $intercept and $extension and 3 of ($av*)
        }

  - id: dos-resident-write-antivirus-records
    desc: Resident DOS infector targets antivirus records
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_resident_write_antivirus_records {
          strings:
            $resident = { 3D 00 DB 75 ?? 81 F9 46 4F 75 ?? B9 4E 4F CF }
            $write = { B4 3F FE C4 BA ?? ?? B9 ?? ?? E8 ?? ?? }
            $memory = { 81 6D 12 ?? ?? 81 6D 03 ?? ?? C6 05 4D }
            $av1 = "ANTI-VIR.DAT" ascii nocase
            $av2 = "AVP.CRC" ascii nocase
            $av3 = "CHKLIST.MS" ascii nocase
            $av4 = "CHKLIST.TAV" ascii nocase
          condition:
            uint16(0) == 0x5a4d and $resident and $write and $memory and 3 of ($av*)
        }
