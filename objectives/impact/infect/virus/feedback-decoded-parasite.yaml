defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
composite_rules:
  - id: inline-trampoline-feedback-parasite
    desc: Diverted host entry with feedback-decoded parasite
    crit: hostile
    conf: 0.98
    attack: T1554,T1027
    all:
      - id: micro-behaviors/data/decode/xor::x86-callpop-inline-xor-return
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: micro-behaviors/data/decode/xor::x86-multiply-rotate-feedback-xor-loop
    any:
      - id: metadata/binary/section/entropy::large-high-entropy-rwx-reloc
      - id: metadata/binary/section/permission::executable-rsrc-section
      # Infected small hosts also carry this execution chain in a .reloc
      # below 64 KiB. Keep both execution-producing decoders mandatory; the
      # section's size is not what establishes the parasitic entry path.
      - id: metadata/binary/section/entropy::small-high-entropy-rwx-reloc
