# ILASM source listings of prepending EXE infectors, as published in virus
# ezines. Each atom is one step of the infection chain: enumerating EXE
# targets, reading the infector's own image, and dropping plus executing
# the host. Legitimate ILASM examples never combine all three, and the
# hostile composite requires the full chain plus a payload or marker leg.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1486
  mbc: B0032

traits:
  - id: ilasm-getfiles-call
    desc: ILASM directory file enumeration call
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'Directory::GetFiles(string,string)'

  - id: ilasm-self-image-read
    desc: ILASM reads its own process executable path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'GetCurrentProcess\(\)[\s\S]{0,400}get_FileName\(\)'

  - id: ilasm-host-drop-execute
    desc: ILASM starts process and waits for exit
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'Process::Start\(string\)[\s\S]{0,200}WaitForExit\(\)'

  - id: ilasm-date-trigger-loop
    desc: ILASM day-of-month trigger branch
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: 'get_Day\(\)[\s\S]{0,120}beq'

  - id: ilasm-reinfection-marker-check
    desc: ILASM embedded-byte reinfection check
    crit: suspicious
    conf: 0.86
    if:
      type: text
      regex: 'ldelem\.u1[\s\S]{0,160}beq'

composite_rules:
  - id: ilasm-exe-enumeration
    desc: ILASM enumerates EXE targets nearby
    crit: suspicious
    conf: 0.93
    near_bytes: 400
    all:
      - id: ilasm-getfiles-call
      - id: micro-behaviors/fs/path/binary::exe-filename-wildcard-reference

  - id: ilasm-prepending-exe-infector
    desc: ILASM source infects EXE files by prepending
    crit: hostile
    conf: 0.97
    all:
      - id: ilasm-exe-enumeration
      - id: ilasm-self-image-read
      - id: ilasm-host-drop-execute
    any:
      - id: ilasm-date-trigger-loop
      - id: ilasm-reinfection-marker-check
