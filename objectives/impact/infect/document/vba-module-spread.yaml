# Macro-virus replication into the victim's other Office files: the macro
# copies a VBA module (OrganizerCopy project items) into each open document,
# template or recent file, or plants a hidden macro sheet into every workbook
# the user activates.
defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  attack: T1137,T1080

composite_rules:
  - id: vba-module-copy-into-other-documents
    desc: Copies its macro module into other documents
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/metaprogramming/generation/transform::vba-organizer-copy-project-item
    any:
      - id: micro-behaviors/data/document/open::office-open-document-iteration
      - id: micro-behaviors/data/document/open::office-recent-file-path-access

  - id: excel-hidden-sheet-plant-on-activation
    desc: Plants hidden macro sheet in workbooks
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/os/application/hook/event::excel-onsheetactivate-macro-hook
      - id: micro-behaviors/data/document/spreadsheet::vba-sheet-copy-into-workbook
      - id: micro-behaviors/ui/window/visibility::worksheet-visibility-assignment
