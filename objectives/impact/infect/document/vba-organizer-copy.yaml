defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1059.005

traits:
  - id: vba-organizer-document-infection
    desc: Copies autorun macros with protection disabled
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule vba_organizer_document_infection {
          strings:
            $security = /VirusProtection\s*=\s*False/ nocase
            $copy = "Application.OrganizerCopy" nocase
            $auto = /["']Auto(Open|Close|Exec)["']/ nocase
            $targets = /Word\.(Documents|Templates)/ nocase
            $self = "ThisDocument.FullName" nocase
          condition:
            all of them
        }
