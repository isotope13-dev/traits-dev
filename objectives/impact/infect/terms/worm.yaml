defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: worm-marker
    desc: Worm malware or propagation reference
    crit: notable
    conf: 0.7
    attack: T1204
    if:
      # A standalone catalog/icon name such as Lucide's `Worm` is not malware
      # terminology and must not become an objective signal by itself.
      type: text
      regex: '(?i)\bworm\b[^\n]{0,40}\b(malware|infect\w*|propagat\w*|spread\w*)\b'
    # Binary model/vocabulary data can contain ordinary words such as
    # "book worm".  Malware keyword evidence is meaningful in source scripts,
    # not in native model and resource blobs.
    not:
      - substr: "Gregarious Worm"
      # Object/map keys (including emoji registries) are not malware
      # references.
      - regex: '(?i)\bworm\s*[:=]'
      - substr: "WormIcon"
      - substr: "LucideWorm"
      - regex: '(?i)(vless|vmess|ss|trojan)://'
    unless:
      - id: metadata/file/catalog/identity/
      - id: micro-behaviors/data/source/build::icon-registry-bundle
      # Games (OpenLieroX worms, automation libs) use "worm" as vocabulary.
      - id: well-known/game/
    downgrade:
      any:
        - id: metadata/binary/resource/identity::kernel-driver-init
        - id: metadata/binary/resource/identity::kernel-driver-idata
