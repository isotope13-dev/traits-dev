# Lexical relationships in 1C report module source, not a family marker.
# The self-source export, staging, reinfection guard, conditional append and
# module writeback are all required; ordinary ERT maintenance is insufficient.
defaults:
  platforms: [windows]
  for: [text]
  crit: notable
  conf: 0.95

composite_rules:
  - id: one-c-report-module-infector
    desc: Replicates own source into unmarked reports
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/read/self::one-c-current-report-source-read
      - id: micro-behaviors/fs/search/name::findfirst-ert-reports
      - id: micro-behaviors/data/string/copy::one-c-source-line-staging
      - id: micro-behaviors/fs/write/file/content::one-c-staged-source-save
      - id: micro-behaviors/data/string/compare::one-c-marked-report-guard
      - id: micro-behaviors/fs/read/stream::one-c-guarded-staged-source-read
      - id: micro-behaviors/data/string/copy::one-c-conditional-source-append
      - id: micro-behaviors/fs/write/stream::one-c-module-source-writeback
