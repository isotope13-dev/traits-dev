defaults:
  platforms: [windows]
  for: [text, vbs, static-lib]
  attack: T1080

traits:
  - id: findfirst-ert-reports
    desc: Walks 1C external report files
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)FindFirstFile\s*\([^)\r\n]{0,40}\.ert'

  - id: compound-file2stream
    desc: Writes bytes back into a compound
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bFile2stream\s*\('

  - id: text-addline-getline
    desc: Appends lines read from a text
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.AddLine\s*\([^)\r\n]{0,60}GetLine\s*\('

composite_rules:
  - id: compound-appends-report-source
    desc: Appends source into walked reports
    crit: hostile
    conf: 0.95
    all:
      - id: findfirst-ert-reports
      - id: compound-file2stream
      - id: text-addline-getline
