defaults:
  platforms: [windows]
  for: [html, javascript]
composite_rules:
  - id: page-body-html-file-infection
    desc: Copies page body into enumerated HTML files
    crit: hostile
    conf: 0.98
    attack: T1080
    all:
      - id: micro-behaviors/data/collection/dom::document-body-text-range
      - id: micro-behaviors/fs/write/content::writeline-htmltext
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
      - id: micro-behaviors/fs/directory/readdir::wsh-folder-files-enumeration
      - id: micro-behaviors/fs/search::js-html-extension-comparison
    near_bytes: 2000
