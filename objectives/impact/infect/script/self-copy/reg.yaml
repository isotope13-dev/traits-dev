# A registry script that infects other registry scripts.
#
# `regedit /e file.reg <key>` exports a live registry branch to a .reg
# file. Looping that export over every *.reg file in several directories
# copies the script's own registry payload into each target, so every
# infected file re-plants the payload when it is imported. That is how
# WinREG-family infectors (e.g. Sptohell) spread: no executable, no macro,
# just the registry editor used as a replication engine.
defaults:
  platforms: [windows]
  for: [text, reg]
  attack: T1059.003
composite_rules:
  - id: reg-export-loop-infector
    desc: Registry file infects other .reg files
    crit: hostile
    conf: 0.96
    near_lines: 20
    all:
      - id: micro-behaviors/os/registry/write::regedit-header-line
      - id: micro-behaviors/os/registry/write::reg-hkey-section
      - id: micro-behaviors/os/registry/write::reg-run-key-path
      - id: micro-behaviors/os/registry/write::reg-for-in-loop
      - id: micro-behaviors/os/registry/write::reg-wildcard-target
      - id: micro-behaviors/os/registry/write::regedit-export-switch
