# Replication intent; importing this data alone does not execute its shell.
defaults:
  platforms: [windows]
  for: [text, reg]
  attack: T1059.003
composite_rules:
  - id: reg-export-loop-infector
    desc: Registry script attempts Run-key export infection
    crit: hostile
    conf: 0.96
    near_lines: 20
    all:
      - id: metadata/file/format/structured::reg-script-header-and-key-section
      - id: micro-behaviors/os/registry/keys::windows-run-key-path
      - id: micro-behaviors/data/control-flow/iteration::batch-for-in-loop
      - id: micro-behaviors/fs/search::reg-wildcard-target
      - id: micro-behaviors/os/registry/read::regedit-export-switch
      - id: micro-behaviors/os/registry/write::reg-default-shell-command
      - id: objectives/impact/destroy/user-data::reg-wildcard-export-overwrite
      - id: micro-behaviors/os/registry/read::regedit-export-run-key
