defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1080, T1059.005

traits:
  - id: encoded-vbs-copy-source-carries-own-code
    desc: Encoded VBS rewrite uses source-derived code
    crit: notable
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      regex: 'WScript\.ScriptFullName[\s\S]{0,160}rock=zzz\.readall[\s\S]{0,100}zen1=Mid\(rock'

composite_rules:
  - id: vbs-encoded-recursive-script-infector
    desc: Hex-decoded VBScript rewrites other VBS files recursively
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/impact/infect/script/self-copy::encoded-vbs-copy-source-carries-own-code
      - id: micro-behaviors/fs/directory/traverse::vbs-encoded-vbs-filtered-file-iteration
      - id: micro-behaviors/fs/write/content::vbs-encoded-template-write
      - id: micro-behaviors/fs/directory/traverse::vbs-encoded-recursive-subfolder-enumeration
