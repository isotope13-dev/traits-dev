defaults:
  platforms: [windows]
  for: [javascript, text]
  attack: T1080

traits:

  # Renamed from `js-random-script-name` / "JavaScript builds random .js filename",
  # which asserted filename construction the matcher never checks -- it is a plain
  # 80-char proximity window between `Math.random()` and the literal `.js`, in either
  # order, with no concatenation, assignment or quoting required. The idiom it
  # actually hits most often is the cache-buster: `src = base + ".js?" + Math.random()`
  # -- ubiquitous in dynamic script loaders, analytics and ad tags, RUM beacons, A/B
  # snippets and bundler chunk loaders. Reporting those from impact/infect/script (a
  # virus self-replication objective) as "builds a random .js filename" is the exact
  # mislabel RULES' worked example describes. Matcher left alone: it is the weakest
  # leg of wsh-self-copy-worm below, which supplies the real self-replication
  # evidence (FileSystemObject ProgID + CopyFile + WScript.ScriptFullName), so
  # tightening it would risk the family for no gain.
  - id: js-string-table-random-copyfile
    desc: JS table random and CopyFile
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '["'']random["''][\s\S]{0,120}["'']CopyFile["'']'

  - id: js-string-table-self-fileexists
    desc: JS table self path guard
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '["'']ScriptFullName["''][\s\S]{0,120}["'']FileExists["'']'

  # Direct self-copy form: the running script as the CopyFile source operand
  # (`fso.CopyFile WScript.ScriptFullName, dest`). Local to this objective
  # because the self-as-source binding is the replication act itself, not a
  # generic copy capability; the GetFile two-step twin lives in the copy
  # leaf. Together they keep mere copy-near-self-path co-occurrence (for
  # example a shortcut hijacker backing up each .lnk) out of this verdict.
  - id: copyfile-selfpath-source
    desc: CopyFile call copies the running script
    crit: notable
    conf: 0.93
    for: [javascript, vbs]
    if:
      type: text
      regex: '(?i)\.CopyFile\s*\(?\s*WScript\.ScriptFullName\b'

  # The self-path reference precedes a folder Files collection whose names
  # are immediately overwritten. This is a lexical replication pattern;
  # it does not claim successful execution or prove the source alias binding.
  - id: wsh-folder-overwrite-selfpath-pattern
    desc: WSH folder overwrite with self-path reference
    crit: suspicious
    conf: 0.95
    for: [vbs]
    if:
      type: text
      case_insensitive: true
      regex: 'ScriptFullName[\s\S]{0,180}\.Files\s+\w+\.CopyFile \w+,\s*\w*\.Name, (1|true)\b'

composite_rules:
  - id: wsh-self-copy-random-js-worm
    for: [javascript]
    desc: WSH script self-replicates into random JavaScript filenames
    crit: hostile
    conf: 0.98
    attack: T1080, T1059.007
    all:
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
      - id: micro-behaviors/fs/file/copy::copyfile-member-text
      - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
      - id: micro-behaviors/os/random/prng/stdlib::js-random-near-js-reference
    any:
      - id: micro-behaviors/fs/path/check::fso-file-exists
      - id: micro-behaviors/data/control-flow/loop::js-bounded-while-loop

  - id: wsh-string-table-self-copy-worm
    for: [javascript]
    desc: Obfuscated WSH script self-replicates through string-table calls
    crit: hostile
    conf: 0.96
    attack: T1080, T1059.007, T1027
    all:
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
      - id: js-string-table-random-copyfile
      - id: js-string-table-self-fileexists
      - id: micro-behaviors/data/control-flow/loop::js-bounded-while-loop

  - id: wsh-reversed-self-copy
    desc: Reversed WSH copies its own script
    crit: hostile
    conf: 0.94
    for: [javascript, vbs, text, static-lib]
    all:
      - id: objectives/anti-static/obfuscation/string/reverse::wsh-reversed-fso
      - id: objectives/anti-static/obfuscation/string/reverse::wsh-reversed-copyfile
      - id: objectives/anti-static/obfuscation/string/reverse::wsh-reversed-scriptname

  - id: wsh-rewrite-files-from-self
    desc: WSH rewrites files from its own script
    crit: hostile
    conf: 0.94
    for: [javascript, vbs]
    all:
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
      - id: micro-behaviors/fs/read/self::wsh-own-script-read
    any:
      - id: micro-behaviors/fs/write/content::create-text-file-method-name
      - id: micro-behaviors/fs/write/content::create-text-file-literal
    unless:
      - id: well-known/tool/sysadmin/microsoft-office::offscrub-removal-benign-context
      - id: metadata/package/tooling::spandsp-source-tree

  # Require a self-bound copy source, or the bounded bulk-overwrite pattern
  # with a self-path reference. Mere copy/self-path co-occurrence is insufficient:
  # a shortcut backup lacks the immediate Files-to-Name overwrite sequence.
  - id: wsh-self-copy-folder-infector
    desc: WSH script self-replicates into enumerated folder files
    crit: hostile
    conf: 0.96
    for: [javascript, vbs]
    near_lines: 40
    all:
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
      - id: micro-behaviors/fs/directory/readdir::wsh-folder-files-enumeration
    any:
      - id: copyfile-selfpath-source
      - id: micro-behaviors/fs/file/copy::wsh-self-getfile-near-copy
      - id: wsh-folder-overwrite-selfpath-pattern

