defaults:
  platforms: [windows]
  for: [html]
composite_rules:
  - id: html-own-prefix-prepend-infection
    desc: Page-read, HTML selection and prefix rewrites
    crit: hostile
    conf: 0.99
    attack: T1080
    near_bytes: 1000
    all:
      - id: micro-behaviors/fs/read/self::html-own-file-read
      - id: micro-behaviors/fs/directory/readdir::js-enumerator-folder-files
      - id: micro-behaviors/fs/search::js-file-type-html-filter
      - id: micro-behaviors/fs/write/content::fso-open-text-file-write
      - id: micro-behaviors/fs/write/content::js-write-concatenated-prefix
