defaults:
  platforms: [unix]
  for: [lua]
  attack: T1554
traits:
  - id: lua-names-lua-script
    desc: Lua source names a Lua script
    crit: notable
    conf: 0.8
    if:
      type: literal
      kind: string
      regex: '\.lua$'
composite_rules:
  # popen plus a write-mode open also matches a script that stages its own
  # POST body. Naming another .lua file is what makes this an infector.
  - id: lua-file-infector
    desc: Lua script that scans and infects other Lua files
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/spawn::lua-io-popen
      - id: micro-behaviors/fs/write/file/handle::lua-open-write-mode
      - id: lua-names-lua-script
    unless:
      - id: metadata/package/tooling::lua-compat-source-tree
      # Firmware-tree Lua daemons (OpenWrt nixio/luci bindings) popen
      # helpers, write kernel device nodes, and dofile helper libraries;
      # none of that is file infection.
      - id: micro-behaviors/fs/path/config/system::openwrt-firmware-component-context
