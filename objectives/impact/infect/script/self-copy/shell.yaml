# Overwriting copies the script body over directory entries.
defaults:
  platforms:
  - unix
  for:
  - shell
  - text
  attack: T1554
  crit: notable
  conf: 0.9

composite_rules:
  - id: shell-overwriting-infector
    desc: Script overwrites directory files with itself
    crit: hostile
    conf: 0.97
    attack: T1080
    near_lines: 20
    all:
      - id: micro-behaviors/data/control-flow/loop/collection::shell-for-directory-glob
      - id: micro-behaviors/fs/write/copy::shell-copies-self-to-variable-target

