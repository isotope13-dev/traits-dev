defaults:
  platforms: [windows]
  for: [reg]
  attack: T1485,T1036

traits:
  - id: reg-batch-copy-self-as-bat
    desc: Registry text copies itself to BAT
    crit: notable
    if:
      type: text
      regex: '(?im)^\s*copy\s+%0\s+[^\r\n]{1,200}\.bat\s*$'
  - id: reg-batch-deltree-windows-system
    desc: Registry text deletes Windows system tree
    crit: notable
    if:
      type: text
      regex: '(?im)^\s*deltree\s+/y\s+[a-z]:\\windows\\system\s*$'

composite_rules:
  - id: reg-batch-self-copy-system-wipe
    desc: Registry and batch polyglot copies and wipes
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/format/structured::reg-script-header-and-key-section
      - id: reg-batch-copy-self-as-bat
      - id: reg-batch-deltree-windows-system
