defaults:
  platforms: [windows]
  for: [html, vbs]
  attack: T1204.002
composite_rules:
  - id: html-vbscript-attachment-resend
    desc: Script saves its received attachment and mails it on
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/fs/write/file/target::object-saveasfile-reference
      - id: micro-behaviors/os/com/outlook::outlook-attachments-add-call
      - id: micro-behaviors/os/com/outlook::outlook-mail-send-call
