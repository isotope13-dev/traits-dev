defaults:
  platforms: [windows]
  for: [batch]
  attack: T1059.003

traits:
  - id: batch-worm-infected-marker
    desc: Batch worm infected marker
    crit: suspicious
    conf: 0.93
    if:
      type: text
      substr: WORM_INFECTED_MARKER

  - id: batch-recursive-script-infect-loop
    desc: Batch recursive script infect loop
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'for /r .{0,120}\(\*\.bat \*\.cmd\)'
      case_insensitive: true

  - id: batch-prepend-self-call
    desc: Batch prepends self-call payload
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: 'call "!_WORM_PATH!" ^& goto :eof'

  - id: batch-random-bat-name
    desc: Batch builds random BAT name
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bset\s+[A-Za-z0-9_]+\s*=\s*%random%[\s\S]{0,120}%[A-Za-z0-9_]+%\.bat\b'

  - id: batch-type-self-append
    desc: Batch appends self into BAT
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\btype\s+%0\s*>>\s*%[A-Za-z0-9_]+%\.bat\b'

  - id: batch-start-generated-bat
    desc: Batch starts generated BAT
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bstart\s+%[A-Za-z0-9_]+%\.bat\b'

  - id: batch-tight-label-loop
    desc: Batch tight label loop
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bgoto\s*:?[A-Za-z0-9_-]{1,12}\b'

  - id: batch-numbered-self-copy-chain
    desc: Batch numbered self-copy chain
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)copy\s+%0\s+%0\.[0-9]{4}\.bat'

  - id: batch-repeated-self-copy-append
    desc: Batch repeated self-copy append
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)copy\s+%0\s+%0\.[0-9]{4}\.bat\s*>>\s*[A-Za-z0-9_.-]+\.bat'

  - id: batch-for-bat-loop
    desc: Batch loops over BAT files
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)for\s+%%[A-Za-z]\s+in\s+\([^)\r\n]{0,48}\*\.bat'

  - id: batch-copy-tmp-append
    desc: Batch appends tmp payload
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)copy\s+%%[A-Za-z]\+c:\\tmp\.bat\s+%%[A-Za-z]'

  - id: batch-autoexec-nt-target
    desc: Batch targets autoexec.NT
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: autoexec.NT
  - id: batch-virus-control-label
    desc: Batch virus control label dispatch
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(goto|command)\b[^\r\n]{0,24}ViRuS_(MULTIPLY|PARSEPATH|FINDSELF)\b'
  - id: batch-self-path-recovery
    desc: Batch virus recovers its own path
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bif\s+not\s+exist\s+%0\.bat\b[^\r\n]{0,120}/ViRuS_FINDSELF\b'
  - id: batch-virus-file-marker
    desc: Batch virus marker and procedure namespace
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '((?i:@echo\s+off>nul\.ViRuS\b)|\bViRuS_[A-Za-z_]{3,}\b)'
  - id: batch-self-call-over-bat-loop
    desc: Batch BAT-file loop calls itself
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bfor\s+%%[A-Za-z]\s+in\s*\(\s*\*\.bat\s*\)\s+do\s+call\s+%0\b'

  - id: batch-enumerates-and-applies-self
    desc: Batch loops over files and invokes itself
    crit: suspicious
    conf: 0.94
    attack: T1080
    if:
      type: text
      regex: '(?i)for\s+%%\w\s+in\s*\([^)]{0,40}\*\.\w{1,4}[^)]{0,10}\)\s*do\s+[^\r\n]{0,60}%0'

  # Parasitic batch infectors concatenate a staged body in front of the
  # victim named by a positional parameter, then copy that result back
  # over the victim: `copy Hot+%2 Trot` / `copy Trot %2`. The body is a
  # literal name, not another parameter. A one-file wrapper can do this
  # once; propagation is the separate self-call loop.
  - id: batch-prepend-param-overwrite
    desc: Batch overwrites parameter with prepend
    crit: suspicious
    conf: 0.94
    attack: T1080
    if:
      type: text
      regex: '(?is)\bcopy\s+[^\s%+]{1,32}\+%\d+\s+\S+.{0,40}\bcopy\s+\S+\s+%\d+'

  # Companion infection: move the real program aside under a new name, then
  # take its place. `Virus.BAT.Companion.a` renames `X.com` to `YX.com`, drops
  # itself as `X.bat` so the bare name `X` now resolves to the virus, marks
  # the original hidden, and chains to it at the end so the user sees the
  # program they asked for. The rename of a *variable-held* filename is the
  # part that distinguishes it from an ordinary `ren *.txt *.bak`.
  - id: batch-renames-variable-target
    desc: Batch renames a variable-held file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bren(ame)?\s+%\w{1,16}%\s+\S{0,6}%\w{1,16}%'
  - id: batch-for-copy-self-onto-matches
    desc: For-loop body copies this script
    crit: suspicious
    conf: 0.93
    attack: T1080
    if:
      type: text
      regex: '(?i)for\s+%%[A-Za-z]\s+in\s+\([^)\r\n]{0,120}\)\s*do\s+copy\s+%0\b'
  - id: batch-append-each-bat
    desc: Appends a payload onto each BAT
    crit: suspicious
    conf: 0.92
    attack: T1080
    if:
      type: text
      regex: '(?i)for\s+%%[A-Za-z]\s+in\s+\([^)\r\n]{0,24}\*\.bat\)\s*do\s+copy\s+%%[A-Za-z]\s*\+'

  - id: batch-xcopy-startup
    desc: Copies a file into the Startup folder
    crit: notable
    conf: 0.9
    for: [batch, text]
    if:
      type: text
      regex: '(?i)\bxcopy\b[^\r\n]{0,80}\\startup\b'

  - id: batch-indirect-bat-append
    desc: Batch appends via an indirect for
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)%\w+%\s+%%[a-z]\s+in\s+\([^)\r\n]{0,24}\*\.bat\)\s*do\s+copy\s+%%[a-z]\s*\+'

  - id: batch-copy-var-to-script
    desc: Copies a variable onto a script
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bcopy\s+%[A-Za-z0-9_]+%\s+\S+\.bat\b'

  - id: batch-echo-regedit-header
    desc: Echoes a registry editor header
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)echo Windows Registry Editor Version'

composite_rules:
  - id: batch-copy-self-and-regfile
    desc: Copies itself and writes a reg file
    crit: hostile
    conf: 0.94
    all:
      - id: batch-copy-var-to-script
      - id: batch-echo-regedit-header

  - id: batch-script-self-infection
    desc: Batch script self-infection
    crit: hostile
    conf: 0.98
    all:
      - id: batch-worm-infected-marker
      - id: batch-recursive-script-infect-loop
      - id: batch-prepend-self-call

  - id: batch-random-self-replication-loop
    desc: Batch random self-replication loop
    crit: hostile
    conf: 0.98
    attack: T1080
    all:
      - id: batch-random-bat-name
      - id: batch-type-self-append
      - id: batch-start-generated-bat
      - id: batch-tight-label-loop
  - id: batch-self-copy-start-loop
    desc: Batch copies itself and starts the copy
    crit: hostile
    conf: 0.97
    attack: T1080
    all:
      - id: batch-type-self-append
      - id: batch-start-generated-bat
  - id: batch-random-self-copy-spawn
    desc: Batch names a random copy and launches it
    crit: hostile
    conf: 0.96
    attack: T1080
    all:
      - id: batch-random-bat-name
      - id: batch-type-self-append

  - id: batch-numbered-self-replication-engine
    desc: Batch numbered replication engine
    crit: hostile
    conf: 0.98
    all:
      - id: batch-numbered-self-copy-chain
      - id: batch-repeated-self-copy-append
      - id: micro-behaviors/os/console/control::batch-ctty-null-device

  - id: batch-autoexec-script-infection
    desc: Batch autoexec script infection
    crit: suspicious
    conf: 0.96
    all:
      - id: batch-for-bat-loop
      - id: batch-copy-tmp-append
      - id: batch-autoexec-nt-target
  - id: batch-virus-self-replication
    desc: Batch virus self-replication dispatcher
    crit: hostile
    conf: 0.98
    all:
      - id: batch-virus-control-label
      - id: batch-self-path-recovery
  - id: batch-virus-loop-self-replication
    desc: Batch virus propagates through BAT files
    crit: hostile
    conf: 0.98
    all:
      - id: batch-virus-file-marker
      - id: batch-self-call-over-bat-loop

  - id: batch-parasitic-bat-prepend
    desc: Batch infects BATs by prepending
    crit: hostile
    conf: 0.97
    attack: T1080
    all:
      - id: batch-prepend-param-overwrite
      - id: batch-self-call-over-bat-loop
    unless:
      - id: well-known/tool/detection/

  - id: batch-self-replicating-infector
    desc: Batch file replicates itself into others
    crit: hostile
    conf: 0.96
    attack: T1080
    all:
      - id: micro-behaviors/fs/read/self::batch-own-script-data-input
    any:
      - id: batch-enumerates-and-applies-self
      - id: batch-renames-variable-target
      - id: batch-for-bat-loop
      - id: batch-recursive-script-infect-loop
      - id: batch-for-copy-self-onto-matches
    unless:
      - id: well-known/tool/detection/
  - id: batch-copy-self-over-matches
    desc: Loop copies this script onto matches
    crit: hostile
    conf: 0.96
    attack: T1080
    all:
      - id: micro-behaviors/fs/read/self::batch-own-script-source-input
      - id: batch-for-copy-self-onto-matches
  - id: batch-payload-appended-to-bats
    desc: Appends one file onto every BAT
    crit: hostile
    conf: 0.95
    attack: T1080
    all:
      - id: batch-append-each-bat
      - id: batch-for-bat-loop
  - id: batch-mirc-self-install
    desc: Batch reads itself into an mIRC config
    crit: hostile
    conf: 0.96
    attack: T1080
    all:
      - id: micro-behaviors/fs/read/self::batch-find-current-script-input
      - id: micro-behaviors/fs/path/config/app::mirc-config-file

  - id: batch-deltree-startup-plant
    desc: Deletes directories and plants Startup copy
    crit: hostile
    conf: 0.94
    for: [batch, text]
    all:
      - id: micro-behaviors/fs/delete/directory::windows-deltree-recursive
      - id: batch-xcopy-startup

  - id: batch-indirect-append-infector
    desc: Batch appends itself through an indirect for
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/data/control-flow/dispatch::batch-for-command-assignment
      - id: batch-indirect-bat-append
