defaults:
  for: [text, registry]
  platforms: [windows]

composite_rules:
  - id: reg-run-export-replication-attempt
    desc: Attempts Run export replication into REG files
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/registry/write::reg-default-shell-command
      - id: objectives/impact/destroy/user-data::reg-wildcard-export-overwrite
      - id: micro-behaviors/os/registry/keys::currentversion-run
