defaults:
  platforms: [windows]
  for: [batch]
  attack: T1059.003

traits:
  - id: batch-worm-infected-marker
    desc: Batch worm infected marker
    crit: suspicious
    conf: 0.93
    if:
      type: text
      substr: WORM_INFECTED_MARKER

  - id: batch-recursive-script-infect-loop
    desc: Batch recursive script infect loop
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'for /r .{0,120}\(\*\.bat \*\.cmd\)'
      case_insensitive: true

  - id: batch-prepend-self-call
    desc: Batch prepends self-call payload
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: 'call "!_WORM_PATH!" ^& goto :eof'

  - id: batch-random-bat-name
    desc: Batch builds random BAT name
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bset\s+[A-Za-z0-9_]+\s*=\s*%random%[\s\S]{0,120}%[A-Za-z0-9_]+%\.bat\b'

  - id: batch-type-self-append
    desc: Batch appends self into BAT
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\btype\s+%0\s*>>\s*%[A-Za-z0-9_]+%\.bat\b'

  - id: batch-start-generated-bat
    desc: Batch starts generated BAT
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bstart\s+%[A-Za-z0-9_]+%\.bat\b'

  - id: batch-tight-label-loop
    desc: Batch tight label loop
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bgoto\s*:?[A-Za-z0-9_-]{1,12}\b'

  - id: batch-numbered-self-copy-chain
    desc: Batch numbered self-copy chain
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)copy\s+%0\s+%0\.[0-9]{4}\.bat'

  - id: batch-repeated-self-copy-append
    desc: Batch repeated self-copy append
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)copy\s+%0\s+%0\.[0-9]{4}\.bat\s*>>\s*[A-Za-z0-9_.-]+\.bat'

  - id: batch-ctty-nul-stealth
    desc: Batch hides console via ctty nul
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: ctty nul

  - id: batch-for-bat-loop
    desc: Batch loops over BAT files
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)for\s+%%[A-Za-z]\s+in\s+\("\*\.bat"\)'

  - id: batch-copy-tmp-append
    desc: Batch appends tmp payload
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)copy\s+%%[A-Za-z]\+c:\\tmp\.bat\s+%%[A-Za-z]'

  - id: batch-autoexec-nt-target
    desc: Batch targets autoexec.NT
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: autoexec.NT
  - id: batch-virus-control-label
    desc: Batch virus control label dispatch
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(goto|command)\b[^\r\n]{0,24}ViRuS_(MULTIPLY|PARSEPATH|FINDSELF)\b'
  - id: batch-self-path-recovery
    desc: Batch virus recovers its own path
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bif\s+not\s+exist\s+%0\.bat\b[^\r\n]{0,120}/ViRuS_FINDSELF\b'
  - id: batch-virus-file-marker
    desc: Batch virus marker and procedure namespace
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)(@echo\s+off>nul\.ViRuS\b|\bViRuS_[A-Z_]{3,}\b)'
  - id: batch-self-call-over-bat-loop
    desc: Batch BAT-file loop calls itself
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bfor\s+%%[A-Za-z]\s+in\s*\(\s*\*\.bat\s*\)\s+do\s+call\s+%0\b'

  # Everything above this point names one sample's literal --
  # `WORM_INFECTED_MARKER`, `ViRuS_MULTIPLY`, `c:\tmp.bat`,
  # `copy %0 %0.0000.bat`, `call "!_WORM_PATH!" ^& goto :eof`. Each catches the
  # sample it was written from and nothing after it, and two batch infectors
  # recovered from the vxheaven corpus (`Virus.BAT.CW.a`,
  # `Virus.BAT.Companion.a`) walked past all of them.
  #
  # The invariant they all share and none of them state: the script uses `%0`,
  # its own path, as a *data source*. A batch file that types or copies itself
  # into somewhere else is replicating; there is no other reason to read your
  # own text. The destination does not matter and neither does the loop around
  # it, which is exactly why those details keep changing between samples.
  - id: batch-self-as-copy-source
    desc: Batch copies its own file elsewhere
    crit: suspicious
    conf: 0.94
    attack: T1080
    if:
      type: text
      regex: '(?i)\b(type|copy|xcopy)\s+"?%0'

  # The generic form of `batch-self-call-over-bat-loop` above, which hardcoded
  # `*.bat` and `call`. A loop over a file mask whose body names `%0` is the
  # script applying itself to everything it found -- the mask is a choice of
  # victim (`*.bat`, `*.cmd`, `*.com`, `*.vbs`) and the verb is a choice of
  # mechanism, neither of which is the technique.
  - id: batch-enumerates-and-applies-self
    desc: Batch loops over files and invokes itself
    crit: suspicious
    conf: 0.94
    attack: T1080
    if:
      type: text
      regex: '(?i)for\s+%%\w\s+in\s*\([^)]{0,40}\*\.\w{1,4}[^)]{0,10}\)\s*do\s+[^\r\n]{0,60}%0'

  # Companion infection: move the real program aside under a new name, then
  # take its place. `Virus.BAT.Companion.a` renames `X.com` to `YX.com`, drops
  # itself as `X.bat` so the bare name `X` now resolves to the virus, marks
  # the original hidden, and chains to it at the end so the user sees the
  # program they asked for. The rename of a *variable-held* filename is the
  # part that distinguishes it from an ordinary `ren *.txt *.bak`.
  - id: batch-renames-variable-target
    desc: Batch renames a variable-held file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bren(ame)?\s+%\w{1,16}%\s+\S{0,6}%\w{1,16}%'


composite_rules:
  - id: batch-script-self-infection
    desc: Batch script self-infection
    crit: hostile
    conf: 0.98
    all:
      - id: batch-worm-infected-marker
      - id: batch-recursive-script-infect-loop
      - id: batch-prepend-self-call

  - id: batch-random-self-replication-loop
    desc: Batch random self-replication loop
    crit: hostile
    conf: 0.98
    attack: T1080
    all:
      - id: batch-random-bat-name
      - id: batch-type-self-append
      - id: batch-start-generated-bat
      - id: batch-tight-label-loop

  - id: batch-numbered-self-replication-engine
    desc: Batch numbered replication engine
    crit: hostile
    conf: 0.98
    all:
      - id: batch-numbered-self-copy-chain
      - id: batch-repeated-self-copy-append
      - id: batch-ctty-nul-stealth

  - id: batch-autoexec-script-infection
    desc: Batch autoexec script infection
    crit: suspicious
    conf: 0.96
    all:
      - id: batch-for-bat-loop
      - id: batch-copy-tmp-append
      - id: batch-autoexec-nt-target
  - id: batch-virus-self-replication
    desc: Batch virus self-replication dispatcher
    crit: hostile
    conf: 0.98
    all:
      - id: batch-virus-control-label
      - id: batch-self-path-recovery
  - id: batch-virus-loop-self-replication
    desc: Batch virus propagates through BAT files
    crit: hostile
    conf: 0.98
    all:
      - id: batch-virus-file-marker
      - id: batch-self-call-over-bat-loop

  # A batch file that reads itself and hands the bytes to something else. The
  # `any:` is the range of ways to choose what gets infected -- walk a mask,
  # or displace one named program -- and a variant that invents a third still
  # needs the `all:` leg, because without reading itself it has nothing to
  # spread.
  - id: batch-self-replicating-infector
    desc: Batch file replicates itself into others
    crit: hostile
    conf: 0.96
    attack: T1080
    all:
      - id: batch-self-as-copy-source
    any:
      - id: batch-enumerates-and-applies-self
      - id: batch-renames-variable-target
      - id: batch-for-bat-loop
      - id: batch-recursive-script-infect-loop
    unless:
      - id: well-known/tool/detection/
