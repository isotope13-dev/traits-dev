# Bourne-shell prependers walk the directory, keep writable scripts `file`
# calls Bourne, copy their own head over the target, then append the original.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1554
  crit: notable
  conf: 0.9

traits:
  - id: shell-file-identifies-bourne
    desc: file command identifies Bourne shell
    if:
      type: text
      regex: 'file\s+\$[A-Za-z_]\w*\s*\|\s*grep\s+(Bourne|shell)'
  - id: shell-prepend-own-head
    desc: Writes own head over a script
    if:
      type: text
      regex: 'head\s+-n\s+[0-9]+\s+\$0\s*>\s*\$[A-Za-z_]\w*'
  - id: shell-append-saved-original
    desc: Appends saved script after virus
    if:
      type: text
      regex: 'cat\s+\.[A-Za-z0-9]+\s*>>\s*\$[A-Za-z_]\w*'
  - id: shell-shebang-head-check
    desc: Checks a script shebang line
    if:
      type: text
      regex: 'head\s+-n\s+1\s+\$[A-Za-z_]\w*\s*\|\s*grep\s+(-s\s+)?!/bin/'
  - id: shell-append-own-tail
    desc: Appends own tail to a script
    if:
      type: text
      regex: 'tail\s+-n\s+[0-9]+\s+\$0\s*>>\s*\$[A-Za-z_]\w*'

composite_rules:
  - id: shell-bourne-prepend-infector
    desc: Shell virus prepends itself to scripts
    crit: hostile
    conf: 0.97
    near_lines: 40
    all:
      - id: shell-file-identifies-bourne
      - id: shell-prepend-own-head
      - id: shell-append-saved-original
  # Appenders leave the host script in place and add their own tail once the
  # first line is a shebang and the marker is absent.
  - id: shell-shebang-append-infector
    desc: Shell virus appends itself to scripts
    crit: hostile
    conf: 0.97
    near_lines: 20
    all:
      - id: shell-shebang-head-check
      - id: shell-append-own-tail
