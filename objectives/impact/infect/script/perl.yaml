defaults:
  crit: suspicious
  platforms: [unix]
  for: [perl, static-lib]
traits:
  - id: perl-shebang-target-check
    desc: Check target for Perl shebang
    conf: 0.95
    if:
      type: text
      regex: 'if\s*\(\s*/\(\\#!\.\*perl\)/\s*\)'
  - id: reinfection-guard
    desc: Guard against reinfecting target
    conf: 0.95
    if:
      type: text
      regex: 'if\s*\(\s*\$_\s+ne\s+"use File::Find;\\n"\s*\)'
  - id: prepend-virus-bootstrap
    desc: Prepend replication bootstrap lines
    conf: 0.95
    if:
      type: text
      substr: '\\nuse File::Find;\\n&virus();\\n'
  - id: append-self-subroutine
    desc: Append viral subroutine from self
    conf: 0.95
    if:
      type: text
      regex: 'while\s*\(\s*<[A-Za-z_][A-Za-z0-9_]*>\s+ne\s+"sub virus\\n"\s*\)\s*\{\s*\};'
  - id: perl-glob-pl-loop
    desc: Walks Perl scripts by glob
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'while\s*\(\s*<\*\.pl>\s*\)'
  - id: perl-rename-over-target
    desc: Renames a temp file onto a target
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\brename\s*\(\s*\$\w+\s*,\s*\$\w+\s*\)'
  # ExtUtils::Command and the perl test suite call chmod(0777) as the
  # utility itself. World-writable mode is a capability; the infector
  # composites below are what add the self-copy.
  - id: perl-chmod-octal-777
    desc: Marks a file mode 0777
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bchmod\s*\(\s*0777\s*,'
  - id: perl-foreach-star-glob
    desc: Walks every file in the directory
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'foreach\s+\$\w+\s*\(\s*<\*>\s*\)'
  - id: perl-append-mode-open
    desc: Opens a file for appending
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'open\s*\(\s*\w+\s*,\s*["'']>>'
  - id: perl-truncate-open
    desc: Opens a file for overwriting
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'open\s*\(\s*\w+\s*,\s*["'']>[^>]'
  - id: perl-opendir-dot
    desc: Opens the current directory
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'opendir\s*\(\s*\w+\s*,\s*["'']\.["'']\s*\)'
  - id: perl-assign-file-token
    desc: Stores the running script path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\$\w+\s*=\s*__FILE__'
  - id: perl-bytes-open-dollar-zero
    desc: Opens dollar-zero as the script
    crit: notable
    conf: 0.9
    platforms: [unix, windows]
    for: [static-lib]
    if:
      type: hex
      pattern: "6F 70 65 6E 28 [0-8] 2C 24 30"
      offset_range: [0, 4096]
  - id: perl-bytes-foreach-star
    desc: Loops every name in the directory
    crit: notable
    conf: 0.88
    platforms: [unix, windows]
    for: [static-lib]
    if:
      type: hex
      pattern: "66 6F 72 65 61 63 68 20 24 [0-24] 3C 2A 3E"
      offset_range: [0, 4096]
  - id: perl-bytes-overwrite-dollar
    desc: Opens a dollar path for writing
    crit: notable
    conf: 0.88
    platforms: [unix, windows]
    for: [static-lib]
    if:
      type: hex
      pattern: "6F 70 65 6E 28 [0-16] 22 3E 24"
      offset_range: [0, 4096]
composite_rules:
  - id: script-overwrite-infector
    desc: Overwrite script with self copy
    conf: 0.97
    needs: 3
    any:
      - id: perl-shebang-target-check
      - id: reinfection-guard
      - id: prepend-virus-bootstrap
      - id: append-self-subroutine
  - id: perl-glob-self-copy-infector
    desc: Copies itself over globbed Perl scripts
    crit: hostile
    conf: 0.97
    attack: T1080
    near_lines: 45
    all:
      - id: micro-behaviors/fs/read/self::open-self-source
      - id: perl-glob-pl-loop
      - id: perl-rename-over-target
      - id: perl-chmod-octal-777
  - id: perl-append-self-infector
    desc: Appends itself onto other scripts
    crit: hostile
    conf: 0.96
    attack: T1080
    near_lines: 20
    all:
      - id: micro-behaviors/fs/read/self::open-self-source
      - id: perl-foreach-star-glob
      - id: perl-append-mode-open
  - id: perl-prepend-self-infector
    desc: Prepends itself onto other files
    crit: hostile
    conf: 0.96
    attack: T1080
    near_lines: 80
    all:
      - id: micro-behaviors/fs/read/self::open-self-source
      - id: perl-foreach-star-glob
      - id: perl-truncate-open
  - id: perl-readdir-append-infector
    desc: Appends itself onto directory scripts
    crit: hostile
    conf: 0.96
    attack: T1080
    near_lines: 30
    all:
      - id: micro-behaviors/fs/read/self::open-self-source
      - id: perl-opendir-dot
      - id: perl-append-mode-open
    unless:
      - id: metadata/package/testing/presence/harness::perl-test-file
  - id: perl-pl-glob-rename-infector
    desc: Replaces globbed Perl scripts with self
    crit: hostile
    conf: 0.96
    attack: T1080
    all:
      - id: perl-glob-pl-loop
      - id: perl-rename-over-target
      - id: perl-assign-file-token
  - id: perl-bytes-self-overwrite
    desc: Writes own body over directory files
    crit: hostile
    conf: 0.95
    attack: T1080
    platforms: [unix, windows]
    for: [static-lib]
    all:
      - id: perl-bytes-open-dollar-zero
      - id: perl-bytes-foreach-star
      - id: perl-bytes-overwrite-dollar
