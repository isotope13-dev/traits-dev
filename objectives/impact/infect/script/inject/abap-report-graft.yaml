defaults:
  platforms: [sapabap]
  for: [text, data]

traits:
  - id: abap-report-directory-query
    desc: ABAP program-directory SELECT text
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bSELECT\b[^.\r\n]{0,120}\bFROM\s+TRDIR\b'

composite_rules:
  # The statement observations are not bound to the same variables. Separate
  # the commented writer from an active statement and do not assert infection.
  - id: abap-report-source-graft-disabled-writer
    desc: ABAP source reads, splice and commented writer
    crit: hostile
    conf: 0.94
    all:
      - id: abap-report-directory-query
      - id: micro-behaviors/fs/read/file/handle::abap-read-own-report
      - id: micro-behaviors/fs/read/file/handle::abap-multiple-report-reads
      - id: micro-behaviors/data/collection/modify::abap-insert-table-lines-at-index
      - id: metadata/lang/source/syntax/statement::abap-commented-insert-report

  - id: abap-report-source-graft-active-writer
    desc: ABAP source reads, splice and writer text
    crit: hostile
    conf: 0.96
    all:
      - id: abap-report-directory-query
      - id: micro-behaviors/fs/read/file/handle::abap-read-own-report
      - id: micro-behaviors/fs/read/file/handle::abap-multiple-report-reads
      - id: micro-behaviors/data/collection/modify::abap-insert-table-lines-at-index
      - id: micro-behaviors/os/module/resource::abap-insert-report-active
