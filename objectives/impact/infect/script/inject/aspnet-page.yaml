defaults:
  for: [asp, html, vbs]
  platforms: [windows]
composite_rules:
  - id: aspnet-page-code-infector
    desc: Extracts and inserts replicating code into ASP.NET pages
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/string/copy::vb-page-substring-code-copy
      - id: micro-behaviors/fs/write/content::vb-page-substring-splice-write
      - id: micro-behaviors/fs/search::dotnet-aspx-file-search
      - id: micro-behaviors/fs/write/file/stream::vb-dotnet-streamwriter-construction
