# Parasitic T-SQL stored-procedure infector behavior.
# Self-reads the active procedure via @@PROCID, enumerates user databases and
# plaintext stored procedures via system catalogs, rewrites CREATE PROCEDURE to
# ALTER PROCEDURE, and splices/executes the replicated body into host procs.
defaults:
  platforms: [windows]
  for: [text, scripts, source]
  attack: T1505.001
  mbc: B0032

composite_rules:
  - id: tsql-stored-procedure-infector
    desc: T-SQL procedure reads self, enumerates procs, and alters them
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/db/schema/introspection::sqlserver-sysdatabases-catalog
      - id: micro-behaviors/data/db/schema/introspection::sqlserver-self-procid
      - id: micro-behaviors/data/db/schema/introspection::sqlserver-stored-procedure-source-enum
      - id: micro-behaviors/data/db/schema/stored-code::sqlserver-alter-procedure
    any:
      - id: micro-behaviors/data/db/schema/stored-code::sqlserver-stuff-string-splice
      - id: micro-behaviors/data/db/query::sqlserver-dynamic-exec-variable
      - id: micro-behaviors/data/db/query::sqlserver-dynamic-exec-sql-string
