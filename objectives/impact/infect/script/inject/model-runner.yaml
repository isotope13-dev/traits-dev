defaults:
  for: [shell]
  platforms: [macos, windows, linux]
traits:
  - id: inference-log-extension-html-target
    desc: Inference log targets extension HTML
    crit: notable
    if:
      type: text
      regex: '--log-file[ =]+[^\s"'']{0,180}[/\\]extensions[/\\][^\s"'']{1,160}[/\\]index\.html\b'
      exclude_comments: true
composite_rules:
  - id: model-runner-extension-html-overwrite
    desc: Model Runner log overwrite targets Docker extension HTML
    crit: hostile
    attack: T1565.001
    near_lines: 24
    all:
      - id: objectives/execution/exploit/parser-confusion::model-runner-log-path-injection
      - id: inference-log-extension-html-target
      - id: micro-behaviors/os/container/runtime::model-runner-completion-route
