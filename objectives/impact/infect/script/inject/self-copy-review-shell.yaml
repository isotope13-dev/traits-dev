defaults:
  platforms:
  - unix
  for:
  - shell
  - text
  attack: T1554
  crit: notable
  conf: 0.9

traits:
  - id: shell-file-identifies-bourne
    desc: file command identifies Bourne shell
    if:
      type: text
      regex: 'file\s+\$[A-Za-z_]\w*\s*\|\s*grep\s+(Bourne|shell)'
  - id: shell-prepend-own-head
    desc: Writes own head over a script
    if:
      type: text
      regex: 'head\s+-n?[ \t]*\d+\s+"?\$\{?0\}?"?\s*>\s*"?\$\{?[A-Za-z_]\w*'
  - id: shell-self-head-to-scratch-file
    desc: Copies own beginning into a scratch file
    if:
      type: text
      regex: '(^|[\r\n])[ \t]*head[ \t]+-n?[ \t]*\d+\s+"?\$\{?0\}?"?\s*>\s*"?\.[\w-]+'
  - id: shell-scratch-prefix-overwrites-target
    desc: Replaces directory item with scratch prefix
    if:
      type: text
      regex: '(^|[\r\n])[ \t]*cat[ \t]+"?\.[\w-]+"?\s*>\s*"?\$\{?\w+\}?"?[ \t]*([\r\n]|$)'
  - id: shell-glob-directory-item-loop
    desc: Iterates a directory glob from shell text
    crit: component
    if:
      type: text
      regex: '(^|[\r\n])[ \t]*for[ \t]+[A-Za-z_]\w*[ \t]+in[ \t]+(\./)?\*[ \t]*[;\r\n]'
  - id: shell-grep-selects-script-shebangs
    desc: Grep selects files with shell shebangs
    if:
      type: text
      regex: '\bgrep([ \t]+-\w+)?\s+["'']#!\s*/(usr/bin/env\s+)?(bin/)?[a-z]{0,4}sh["'']\s+(\./)?\*'
  - id: shell-append-saved-original
    desc: Appends saved script after virus
    if:
      type: text
      regex: 'cat\s+\.[A-Za-z0-9]+\s*>>\s*\$[A-Za-z_]\w*'
  - id: shell-shebang-head-check
    desc: Checks a script shebang line
    if:
      type: text
      regex: 'head\s+-n\s+1\s+\$[A-Za-z_]\w*\s*\|\s*grep\s+(-s\s+)?!/bin/'
  - id: shell-append-own-tail
    desc: Appends own tail to a script
    if:
      type: text
      regex: 'tail\s+-n\s+[0-9]+\s+\$0\s*>>\s*\$[A-Za-z_]\w*'


composite_rules:
  - id: shell-scratch-prefix-prepend-infector
    desc: Shell prepends its own source to directory files through scratch copies
    crit: hostile
    conf: 0.97
    attack: T1080,T1554
    near_lines: 34
    all:
      - id: shell-self-head-to-scratch-file
      - id: shell-glob-directory-item-loop
      - id: shell-scratch-prefix-overwrites-target
      - id: shell-append-saved-original

  - id: shell-shebang-selected-self-overwriter
    desc: Shell script overwrites shebang-selected files with its own source
    crit: hostile
    conf: 0.97
    attack: T1080,T1554
    near_lines: 20
    all:
      - id: shell-grep-selects-script-shebangs
      - id: shell-prepend-own-head

  - id: shell-bourne-prepend-infector
    desc: Shell virus prepends itself to scripts
    crit: hostile
    conf: 0.97
    near_lines: 40
    all:
      - id: shell-file-identifies-bourne
      - id: shell-prepend-own-head
      - id: shell-append-saved-original
  # Appenders leave the host script in place and add their own tail once the
  # first line is a shebang and the marker is absent.
  - id: shell-shebang-append-infector
    desc: Shell virus appends itself to scripts
    crit: hostile
    conf: 0.97
    near_lines: 20
    all:
      - id: shell-shebang-head-check
      - id: shell-append-own-tail
  # Overwriters loop over directory entries and copy the script body over them.
  - id: shell-directory-append-infector
    desc: Shell virus appends itself to directory files
    crit: hostile
    conf: 0.97
    attack: T1080,T1554
    near_lines: 20
    all:
      - id: micro-behaviors/data/control-flow/loop/collection::shell-for-directory-glob
      - id: shell-append-own-tail

