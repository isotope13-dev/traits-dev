defaults:
  platforms: [windows, unix]
  for: [html]

traits:
  - id: html-href-nested-host-path-chain
    desc: Nested host/path fragments in HTML link
    crit: suspicious
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      # Repeated host/path fragments in successive query fragments are not a
      # normal absolute hyperlink. Hostnames and path tokens remain variable.
      regex: '(?i)href=["'']https?://.{1,80}\?#[^/]{1,80}/.{1,80}\?#[^/]{1,80}/'

composite_rules:
  - id: massed-remote-script-chain-injection
    desc: Massed scripts accompany nested-link injection
    crit: hostile
    conf: 0.95
    attack: T1189
    all:
      - id: micro-behaviors/process/deploy/script-eval::massed-remote-script-tags
      - id: html-href-nested-host-path-chain
