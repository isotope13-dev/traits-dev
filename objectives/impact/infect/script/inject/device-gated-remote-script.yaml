# A page checks for an iPhone or iPad User-Agent, then creates a script element
# whose source is a remote host built from a variable. Injecting the loader
# only for one device family is the gating an injected visitor-side loader
# uses. A compatibility shim that gates on device without a remote host, or
# that appends a locally built script, does not meet all legs.
defaults:
  platforms: [windows, unix]
  # The remote-URL concatenation leg is JavaScript-only, so HTML cannot satisfy every leg.
  for: [javascript, typescript]
  attack: T1189

composite_rules:
  - id: device-gated-remote-script-injection
    desc: Device-gated script element loads a remote script
    crit: hostile
    conf: 0.93
    near_bytes: 600
    all:
      - id: micro-behaviors/communications/http/user-agent::ios-device-useragent-regex-test
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
      - id: micro-behaviors/communications/url/construction/build-http::js-http-prefix-variable-concat
      - id: micro-behaviors/data/collection/dom::source-append-child-call
    downgrade:
      any:
        - id: metadata/path/directory::test-directory-component
