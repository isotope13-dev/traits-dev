defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  attack: T1554
  mbc: B0030
traits:
- id: preg-replace-declaration
  desc: Regex-rewrites a source declaration
  crit: suspicious
  conf: 0.88
  if:
    type: text
    regex: preg_replace\w*\s*\(\s*['"][^'"]{0,12}(function|class)\s+\w
  unless:
  - id: metadata/package/testing/harness/unit/
  - id: metadata/build
  - id: well-known/lib/development/mockery::mockery-source-tree
- id: web-root-joins-wordpress-core
  desc: Joins WordPress core onto web root
  crit: suspicious
  conf: 0.93
  if:
    type: text
    regex: (DOCUMENT_ROOT|SCRIPT_FILENAME)['"\]]*\s*\.\s*['"]/?wp-(includes|admin|settings|config)
- id: web-root-joins-cms-core
  desc: Joins CMS core onto web root
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: (DOCUMENT_ROOT|SCRIPT_FILENAME)['"\]]*\s*\.\s*['"]/?(administrator|typo3)/
composite_rules:
- id: web-root-cms-core-path
  desc: Builds a CMS core path
  crit: suspicious
  conf: 0.93
  any:
  - id: web-root-joins-wordpress-core
  - id: web-root-joins-cms-core
- id: php-cms-core-source-patch
  desc: PHP splices code into CMS core
  crit: hostile
  conf: 0.96
  all:
  - id: web-root-cms-core-path
  - id: micro-behaviors/fs/read/file/full::file-get-contents
  - id: micro-behaviors/fs/write/file/full::php-file-put-contents
  any:
  - id: micro-behaviors/metaprogramming/generation::php-function-text-replace
  - id: preg-replace-declaration
  - id: metadata/lang/encoded/base64::base64-script-function-definition
  unless:
  - id: metadata/package/testing/harness/unit/
  - id: well-known/lib/runtime/scripted/php-runtime::source-tree
