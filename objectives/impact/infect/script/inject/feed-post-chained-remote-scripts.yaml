# Stored-content infection seen through a site's RSS/Atom feed: the
# injector rewrites post bodies in the CMS database, appending a run of
# remote script elements to the end of the post's prose. The feed copy
# carries the same infected body. A chain of back-to-back remote loaders
# glued to sentence text is the injector's write, not an editor embed
# (tweet/gist/Instagram loaders sit after their own blockquote markup).
# Example: `...Schreiben!<script src='https://a.example/x.js'></script>
# <script src='https://b.example/y.js'></script></p>` in content:encoded.
defaults:
  platforms: [windows, unix]
  for: [xml]
  attack: T1189

composite_rules:
  - id: feed-post-prose-remote-script-chain
    desc: Feed post prose infected with loader chain
    crit: hostile
    conf: 0.92
    near_bytes: 1200
    all:
      - id: micro-behaviors/data/format/xml::feed-markup-sentence-spliced-remote-script
      - id: micro-behaviors/data/format/xml::feed-markup-chained-remote-script
