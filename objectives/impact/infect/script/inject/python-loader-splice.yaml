defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: python-source-import-anchor
    desc: Locates Python imports for source insertion
    if:
      type: text
      regex: 'startswith\(\(["'']import ["''], ["'']from ["'']\)\)'
  - id: python-source-head-block-tail-write
    desc: Passes spliced text to a helper
    if:
      type: text
      regex: 'return \w+\(\w+, \w+ \+ \w+\.[^\n]{1,100}\+ \w+\)'
composite_rules:
  - id: python-compressed-loader-source-infection
    desc: Inserts a compressed remote-code loader into Python source
    crit: hostile
    conf: 0.99
    attack: T1554,T1059.006
    all:
      - id: python-source-import-anchor
      - id: python-source-head-block-tail-write
      - id: micro-behaviors/fs/file/rename::os-replace
      - id: micro-behaviors/fs/write/file/handle/call::py-file-write-call
      - id: objectives/command-and-control/remote-command/http-poll::python-compressed-response-daemon
