defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-compromise-message-write-clues
    desc: Install-named script has write and compromise-message clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: micro-behaviors/fs/write/file/content::js-file-write
    any:
      - id: metadata/lang/natural/phrasing/security::install-hook-package-compromise-banner
      - id: metadata/lang/natural/phrasing/security::install-hook-supply-chain-attack-banner
      - id: metadata/lang/natural/phrasing/security::install-hook-unauthorized-code-banner
      - id: metadata/lang/natural/vocabulary/portuguese::install-hook-unauthorized-code-banner-pt
      - id: objectives/impact/deface/proof::compromise-marker-filename
      - id: micro-behaviors/fs/write/file/unspecified::install-hook-hacked-marker-file
