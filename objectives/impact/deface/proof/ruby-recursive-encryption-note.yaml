defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1486,T1491.001

traits:
  - id: ruby-hacked-tool-message
    desc: Ruby text claims a tool hacked files
    crit: notable
    if:
      type: text
      regex: '(?i)hack(ed|end)\s+with\s+(a\s+)?tool'
  - id: ruby-write-readme-note
    desc: Ruby opens a README for writing
    crit: notable
    if:
      type: text
      regex: '(?i)File\.open\([^\n]{0,100}readme[^\n]{0,30}["'']w["'']'

composite_rules:
  - id: ruby-recursive-encryptor-compromise-note
    desc: Ruby recursive encryptor writes compromise note
    crit: hostile
    conf: 0.96
    all:
      - id: ruby-hacked-tool-message
      - id: ruby-write-readme-note
      - id: metadata/lang/source/naming/security::encrypt-module
      - id: micro-behaviors/fs/search/name::ruby-recursive-glob-pattern
