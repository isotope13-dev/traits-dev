defaults:
  platforms: [unix, windows]
  for: [text]
traits:
  - id: patch-compromise-heading
    desc: Patch adds a compromise-related heading
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?im)^\+\s*#\s*(hacked|pwned|owned)'
composite_rules:
  - id: bot-patch-compromise-heading-clues
    desc: Bot patch and compromise heading clues
    crit: notable
    conf: 0.94
    all:
      - id: metadata/file/format/markup::patch-from-bot-identity
      - id: patch-compromise-heading
