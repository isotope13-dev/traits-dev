defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-compromise-marker-write-clues
    desc: Install-named script has file-write and compromise-marker clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: objectives/impact/deface/proof::compromise-marker-filename
      - id: micro-behaviors/fs/write/file/content::js-file-write
