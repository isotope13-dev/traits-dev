defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, npm]
composite_rules:
  - id: skeleton-postinstall-tmp-compromise-beacon
    desc: Tiny package postinstall writes temp compromise beacon
    crit: hostile
    conf: 0.97
    attack: "T1195.002,T1564,T1059.007"
    scope: archive
    all:
      - id: metadata/file/size::small-versioned-npm-manifest
      - id: objectives/impact/deface/proof::postinstall-tmp-compromise-beacon
    unless:
      - id: metadata/package/repository::has-repository-evidence
      - id: metadata/package/entrypoint/command::bin-field-declared
