# Compromise or proof-of-execution marker filenames. A filename alone is only
# a fragment; intent comes from composites that also establish the write and
# the execution or lifecycle context.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  - id: compromise-marker-filename
    desc: Compromise marker filename literal
    crit: component
    conf: 0.94
    if:
      type: literal
      kind: string
      case_insensitive: true
      regex: '(hacked|hackeado|pwned)\.(txt|log)'
    unless:
      - id: metadata/package/testing/
