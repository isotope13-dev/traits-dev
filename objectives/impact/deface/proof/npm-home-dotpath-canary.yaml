# Install-time and import-time proof-of-execution canaries. A package code path
# that writes a hidden file under the user's home directory and records host
# or shell-identity output is a beacon that the package's own function does
# not need. The temp-directory beacons in this directory cover the /tmp form;
# these cover the home-directory form.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar, zip]
  attack: T1195.002,T1059.007,T1564
composite_rules:
  - id: npm-install-hook-home-id-canary
    desc: Install hook runs id and writes a hidden home dotfile
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: micro-behaviors/process/identity/query/command::node-shell-id-command
      - id: micro-behaviors/fs/write/user-paths::node-write-hidden-home-dotpath
    any:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: metadata/package/scripts/lifecycle::filtered-prepare-hook
      - id: metadata/package/scripts/lifecycle::has-install-script
    needs: 1
  - id: npm-import-time-home-fingerprint-canary
    desc: Module writes host fingerprint to hidden home dotfile on load
    crit: hostile
    conf: 0.92
    for: [javascript, typescript]
    scope: file
    all:
      - id: micro-behaviors/fs/write/user-paths::node-module-level-hidden-home-write
    any:
      - id: micro-behaviors/fs/directory/cwd::process-cwd-call
      - id: micro-behaviors/process/identity/query/principal::os-userinfo-call
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
      - id: micro-behaviors/process/identity/query/command::node-shell-id-command
    needs: 1
