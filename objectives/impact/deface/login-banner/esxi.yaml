defaults:
  platforms: [unix]
  for: [scripts]
  attack: T1491.001

composite_rules:
  - id: ssh-ransom-login-banner
    desc: OpenSSH login ransom-banner defacement
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/service/config::sshd-config-path
      - id: micro-behaviors/communications/ssh/server::sshd-banner-file-directive
      - id: objectives/impact/ransom/note::encrypted-host-data-notice
      - id: micro-behaviors/communications/http/url/scheme
    any:
      - id: micro-behaviors/fs/file/open::write-append-create-mode
      - id: micro-behaviors/fs/file/write/redirect::shell-file-write-command
