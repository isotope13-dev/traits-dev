# The script writes its own logon notice caption/text through RegWrite and
# also destroys files: the banner signs the destruction for the victim at the
# next logon. Group-policy banner scripts set the notice and stop there.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1491.001,T1485

composite_rules:
  - id: wsh-logon-banner-signs-file-wipe
    desc: Sets a logon banner and wipes files
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/registry/value/write::wscript-regwrite
      - id: micro-behaviors/os/registry/value-name::legal-notice-caption
    any:
      - id: objectives/impact/destroy/filesystem::wsh-all-drives-file-wipe
      - id: objectives/impact/destroy/filesystem::wsh-windows-folder-delete
      - id: objectives/impact/destroy/filesystem::wsh-system-directory-wildcard-delete
