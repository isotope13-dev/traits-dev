# Compromise/proof-of-execution markers carried as string constants in a
# compiled binary. The bare word "pwned" is neutral at large (pwntools,
# CTF, Pwn2Own, HIBP), but a *small* binary that ships it is almost always
# a payload/PoC stub printing its proof-of-execution — the size gate is
# what turns the neutral term into a signal. The full victim-taunt phrase
# ("you've been pwned") is matched, cross-format, by
# objectives/impact/deface/taunt/lexicon::victim-pwn-taunt.
defaults:
  platforms: [unix, windows]
  # `data` covers a flat shellcode/parasite blob (objcopy -O binary output),
  # where the proof-of-execution string is the only readable marker left.
  for: [binaries, data]
  attack: T1491

traits:
  - id: pwned-proof-in-small-binary
    desc: Small binary carries a pwned marker
    crit: suspicious
    conf: 0.8
    size_max: 1048576
    if:
      type: text
      regex: '(?i)\bpwned\b'
    unless:
      - type: text
        substr: pwned password
      - type: text
        substr: haveibeenpwned
      - type: text
        substr: pwntools
      - type: text
        substr: pwnlib
