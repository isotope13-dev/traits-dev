# Joke/scareware shape: a program announces "you've been hacked", opens a
# runtime-built note path in Notepad, and starts an unbounded ping of a
# hard-coded host. The taunt addresses the user as a victim and the ping is
# never a diagnostic the user asked for; together they intimidate the user
# while generating unexplained outbound traffic. Required legs are content
# (taunt text, command templates), not names, hosts or compiler artifacts.
# Claim limits: proves the program carries the taunt and both command
# templates; it does not prove the ping reached or harmed the host.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1491

composite_rules:
  - id: hacked-taunt-note-continuous-ping
    desc: Hacked-taunt note with continuous remote ping
    crit: hostile
    conf: 0.93
    all:
      - id: objectives/impact/deface/taunt::victim-hacked-announcement
      - id: micro-behaviors/process/argument/executable::notepad-placeholder-launch-format
      - id: micro-behaviors/process/argument/executable::ping-continuous-host-command-format
