# Desktop Defacement
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp]
composite_rules:
  - id: wallpaper-ransom-text
    for: [pe]
    desc: Ransom text or extortion content accompanying wallpaper API
    crit: component
    conf: 0.95
    any:
      - id: objectives/impact/ransom/encrypt/config::ransom-note-text
      - id: objectives/impact/ransom/extortion::pe-ransom-extortion-content
  - id: set-wallpaper-objective
    for: [pe]
    desc: Wallpaper API with ransom-demand text
    crit: suspicious
    conf: 0.95
    attack: "T1491.001"
    all:
      - id: wallpaper-ransom-text
    any:
      - id: micro-behaviors/ui/wallpaper::set-desktop-wallpaper
      - id: micro-behaviors/ui/wallpaper::managed-wallpaper-update-references
      - id: micro-behaviors/os/registry/value-name::lock-screen-image-path
    unless:
      # WinForms and System.Private.Windows.Core declare the same User32
      # surface; a verified Microsoft signature identifies the framework.
      - id: metadata/binary/section/label/conventional::dwarf-macro-table
  - id: ransomware-wallpaper-defacement
    for: [pe]
    desc: Ransom text with wallpaper and crypto/payment references
    crit: hostile
    conf: 0.98
    attack: "T1491.001"
    all:
      - id: set-wallpaper-objective
      - id: objectives/impact/ransom/extortion::pe-ransom-extortion-content
    any:
      - id: micro-behaviors/crypto/cipher/io::dotnet-cryptostream
      - id: micro-behaviors/data/format/crypto-address::hardcoded-btc-addr
