# Desktop Defacement
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp]
composite_rules:
  - id: set-wallpaper-objective
    desc: Sets desktop wallpaper (potential defacement)
    crit: suspicious
    conf: 0.95
    attack: "T1491.001"
    any:
      - id: micro-behaviors/ui/wallpaper::set-desktop-wallpaper
      - id: micro-behaviors/os/registry/manipulate::lock-screen-image-path
    unless:
      - id: well-known/app/communication/thunderbird::thunderbird-xul-runtime
      # SystemParametersInfo/SPI_SETDESKWALLPAPER is declared by every User32
      # P/Invoke binding assembly and by the WinForms primitives assembly.
      - id: metadata/lang/upstream::dotnet-pinvoke-binding-assembly
      # WinForms and System.Private.Windows.Core declare the same User32
      # surface; a verified Microsoft signature identifies the framework.
      - id: metadata/signed/platform/
      # A self-contained publish carries those framework assemblies inside its
      # bundle, so their strings surface on the host image too.
      - id: well-known/game/steamtools/
      - id: metadata/binary/section/label::dwarf-macro-table
      - id: well-known/game/playnite::reference-binary
      # A .winmd is the Windows API catalog. It declares the wallpaper
      # call; it does not set a desktop.
      - id: metadata/build/generated::winmd-metadata
