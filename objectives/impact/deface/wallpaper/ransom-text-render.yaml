# A locker that renders its demand into a bitmap with GDI and installs it
# with SystemParametersInfo as the desktop background, so the victim sees the
# message without a note file being opened. The claim text and a stream
# cipher constant tie the wallpaper change to file encryption.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1491.001,T1486
composite_rules:
  - id: ransom-claim-rendered-wallpaper-locker
    desc: Ransom claim, GDI bitmap, wallpaper API and stream cipher
    crit: hostile
    conf: 0.9
    all:
      - id: objectives/impact/ransom/native::encryption-technology-msg
      - id: micro-behaviors/ui/controls/widget::system-parameters-info-symbol
      - id: micro-behaviors/hardware/display/screen::gdi-create-compatible-bitmap
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha-salsa-constant
    unless:
      - id: metadata/signed/platform/
