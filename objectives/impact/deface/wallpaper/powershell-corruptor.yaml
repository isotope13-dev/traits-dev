defaults:
  for: [powershell]
  platforms: [windows]
  attack: T1491.001
composite_rules:
  - id: powershell-file-corruptor-wallpaper-defacement
    desc: File corruptor with wallpaper defacement
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/destroy/user-data::powershell-recursive-disk-byte-corruption
      - id: micro-behaviors/ui/wallpaper::powershell-set-wallpaper-value
      - id: micro-behaviors/ui/wallpaper::refresh-wallpaper-settings
