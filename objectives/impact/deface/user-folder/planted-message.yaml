# A library that plants a file on the user's desktop when it is loaded.
#
# node-ipc 11.0.0 declared a dependency on peacenotwar, whose entire module
# body scans `${homedir}/Desktop`, `${homedir}/OneDrive` and
# `${homedir}/OneDrive/Desktop` for a marker filename and, finding none,
# writes the same file into all three. Importing node-ipc was enough; nothing
# in the transport library ever called it.
#
# The thing to key on is not the message, the filename, or the package. It is
# the shape: code with no user-facing surface checks whether it has already
# planted its file, then plants it in several of the user's personal folders
# at once. An application feature that saves a report to the Desktop writes
# one file, to one place, when the user asks. A payload that wants to be seen
# writes to every folder it can reach and does so exactly once.
#
# Choosing the cloud-sync root alongside the Desktop is deliberate on the
# attacker's part and is what the `all:` requires: the file is replicated to
# every other device the victim has signed in to.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1195.002,T1491.001
  mbc: B0024

composite_rules:
  - id: library-plants-file-in-user-folders
    desc: Module plants a file in user folders
    crit: hostile
    conf: 0.95
    all:
      # The write itself, already joined to a home-derived path.
      - id: micro-behaviors/fs/path/location::user-folder-file-write
      # Two different personal folders, one of them a sync root.
      - id: micro-behaviors/fs/path/location::home-desktop-path-expression
      - id: micro-behaviors/fs/path/location::home-cloud-sync-path-expression
    # The prior-existence check that makes the drop one-time. A recursive walk
    # or a plain directory read both serve; an app's save feature needs
    # neither, because the user chose the moment.
    any:
      - id: micro-behaviors/fs/enumerate/directory::node-readdir-sync-call
      - id: micro-behaviors/fs/enumerate/directory::node-recursive-file-walk
      - id: micro-behaviors/fs/enumerate/directory::fs-readdir
    unless:
      - id: metadata/package/testing/
