# A file write whose path is proven to derive from both the user's Desktop and
# a cloud-sync folder is not an ordinary save operation. Requiring directory
# enumeration captures the one-time planting pattern without keying on the
# message, filename, package identity, or archive path.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1491.001
  mbc: B0024

composite_rules:
  - id: node-plants-file-in-user-folders
    desc: Node plants files in user-visible folders
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/write/user-paths::node-module-writes-desktop-and-cloud-paths
    any:
      - id: micro-behaviors/fs/enumerate/directory::node-readdir-sync-call
      - id: micro-behaviors/fs/enumerate/directory::node-recursive-file-walk
      - id: micro-behaviors/fs/enumerate/directory::fs-readdir
    unless:
      - id: metadata/package/testing/
