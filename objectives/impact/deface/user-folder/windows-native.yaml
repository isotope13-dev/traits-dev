# Native Windows binaries can write a taunt into user-visible folders and
# display a takeover splash. The output behavior is separated from generic
# file and window APIs, which remain neutral capabilities.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1491.001

traits:
  - id: native-compromise-taunt-text
    desc: Compromise taunt text in a native binary
    crit: suspicious
    conf: 0.94
    if:
      type: text
      # "owned by us" alone is memory-ownership prose in library docstrings.
      regex: '(?i)((system|computer)\s+compromised|\b(hacked|pwned|owned) by [\w ]{1,24}!)'

  - id: native-compromise-splash-message
    desc: Compromise or destruction countdown text
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?is)(system|computer) compromised.{0,100}(destruction|owned by|was here)'

composite_rules:
  - id: native-user-folder-taunt-defacement
    desc: Native binary writes a compromise taunt into user folders
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/user-directory::windows-user-folder-path-reference
      - id: native-compromise-taunt-text
      - id: micro-behaviors/fs/file/open/unspecified::file-create-win
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file

  - id: native-compromise-splash-defacement
    desc: Native binary displays a system-compromise splash across windows
    crit: hostile
    conf: 0.98
    all:
      - id: native-compromise-splash-message
      - id: micro-behaviors/ui/window/control::create-window-ex
      - id: micro-behaviors/ui/window/enumerate::enum-windows
