# Hacked-WordPress gambling SEO: the attacker rewrites the site's title,
# keywords and description to Chinese betting copy so search engines index
# the victim domain for gambling terms, while the rest of the page is still
# the original WordPress theme.
defaults:
  for: [html]
  platforms: [windows, unix]
  attack: T1491.002

composite_rules:
  - id: wordpress-page-retitled-betting-seo
    desc: WordPress page retitled with Chinese betting SEO
    crit: suspicious
    conf: 0.88
    all:
      - id: metadata/document/html::cjk-betting-app-title
      - id: micro-behaviors/communications/http/request/wordpress::rest-endpoint-url
