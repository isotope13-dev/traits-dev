defaults:
  platforms: [windows]
  for: [asp, vbs]
  crit: notable
  conf: 0.97
traits:
  - id: asp-deface-reference
    desc: ASP references defacement
    if:
      type: text
      regex: '(?i)deface'
  - id: asp-deface-subfolders
    desc: ASP references subfolders
    if:
      type: text
      regex: '(?i)\.SubFolders\b'
  - id: asp-deface-index-htm
    desc: ASP references index.htm path
    if:
      type: text
      regex: '(?i)\\index\.htm\b'
  - id: asp-deface-index-html
    desc: ASP references index.html path
    if:
      type: text
      regex: '(?i)\\index\.html\b'
  - id: asp-deface-index-asp
    desc: ASP references index.asp path
    if:
      type: text
      regex: '(?i)\\index\.asp\b'
  - id: asp-deface-file-copy
    desc: ASP invokes file-copy method
    if:
      type: text
      regex: '(?i)\.Copy\s*\('
  - id: asp-request-defacement-content
    desc: ASP reads submitted content
    if:
      type: text
      regex: '(?i)Request\.Form\s*\(\s*"content"\s*\)'
  - id: asp-request-defacement-path
    desc: ASP reads submitted path
    if:
      type: text
      regex: '(?i)Request\.Form\s*\(\s*"path"\s*\)'
composite_rules:
  - id: asp-recursive-index-defacement
    desc: ASP recursive website index overwrite clues
    crit: hostile
    attack: T1491.002,T1505.003
    all:
      - id: asp-deface-reference
      - id: asp-deface-subfolders
      - id: asp-deface-index-htm
      - id: asp-deface-index-html
      - id: asp-deface-index-asp
      - id: asp-deface-file-copy
      - id: asp-request-defacement-content
      - id: asp-request-defacement-path
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
