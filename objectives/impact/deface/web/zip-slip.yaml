defaults:
  platforms: [unix, windows]
  for: [zip]
  attack: T1491.002

traits:
  # In stored ZIP entries the filename can immediately precede the body.
  # This atom claims only raw path/text adjacency; the composite also
  # requires a parsed parent-relative web member.
  - id: parent-php-html-path-defacement-text
    desc: PHP/HTML traversal path adjoins defacement text
    crit: notable
    conf: 0.95
    if:
      type: raw
      regex: '(?i)\.\./[./\w-]+\.(php|html?)(hacked|defaced|pwned)[\t \r\n]'

  - id: parent-asp-jsp-path-defacement-text
    desc: ASP/JSP traversal path adjoins defacement text
    crit: notable
    conf: 0.95
    if:
      type: raw
      regex: '(?i)\.\./[./\w-]+\.[aj]spx?(hacked|defaced|pwned)[\t \r\n]'

composite_rules:
  - id: parent-web-path-defacement-text
    desc: Parent-relative web path adjoins defacement text
    crit: notable
    conf: 0.95
    any:
      - id: parent-php-html-path-defacement-text
      - id: parent-asp-jsp-path-defacement-text

  # A script suffix alone says nothing about executable member content.
  - id: parent-traversal-web-defacement
    desc: Web-path traversal archive contains defacement text
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/archive/member/path::path-traversal-members
      - id: parent-web-path-defacement-text
    any:
      - id: metadata/archive/member/path::archive-parent-path-web-member
      - id: metadata/archive/member/path::archive-parent-path-server-page-suffix
    unless:
      - id: metadata/path::test-directory-component
