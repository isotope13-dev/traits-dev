defaults:
  platforms: [unix, windows]
  for: [zip, tar, jar]
  attack: T1491.002

traits:
  - id: archive-defacement-banner
    desc: Archive contains a defacement banner term
    crit: notable
    conf: 0.9
    if:
      type: raw
      regex: '(?i)(hacked|defaced|pwned)[\t ]*(by |\r?\n)'

composite_rules:
  # A script suffix says nothing about executable member content. Require
  # defacement text as well as a web-content path escaping the destination.
  - id: parent-traversal-web-defacement
    desc: Web-path traversal archive contains defacement text
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/package/files/archive-member::path-traversal-members
      - id: metadata/package/files/archive-member::archive-parent-path-web-member
      - id: archive-defacement-banner
    unless:
      - id: metadata/file/naming::test-directory-component
