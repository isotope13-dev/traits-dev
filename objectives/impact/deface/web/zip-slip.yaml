defaults:
  platforms: [unix, windows]
  for: [zip, tar, jar, 7z, rar]
  attack: T1491.002

composite_rules:
  # Distinct from a static web-content name: the member is a server script,
  # so extraction outside the destination plants code the server will run.
  - id: parent-traversal-server-script
    desc: Archive plants a parent-path server script
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/package/files/archive-member::path-traversal-members
      - id: metadata/package/files/archive-member::archive-parent-path-server-script
    unless:
      - id: metadata/file/naming::test-directory-component
