# This combination captures policy-driven endpoint defacement: a new linked
# GPO forces both logon UI text and a screen image while deploying an artifact
# to a drive root. It does not depend on ransom wording or family branding.
defaults:
  platforms: [windows]
  for: [powershell, batch, scripts]
  attack: T1491.001

composite_rules:
  - id: linked-gpo-logon-screen-defacement
    desc: Linked GPO forces logon text and images and deploys a root file
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/security/policy::set-gpregistryvalue-cmdlet
      - id: micro-behaviors/os/registry/manipulate::legal-notice-caption
      - id: micro-behaviors/os/registry/manipulate::legal-notice-text
      - id: micro-behaviors/os/registry/manipulate::lock-screen-image-path
      - id: micro-behaviors/os/registry/manipulate::wallpaper-policy-value
      - id: objectives/lateral-movement/delivery/gpo::linked-gpo-drive-root-file-deployment
    near_lines: 64
