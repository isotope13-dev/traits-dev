# This combination captures policy-driven endpoint defacement: a new linked
# GPO forces both logon UI text and a screen image while deploying an artifact
# to a drive root. It does not depend on ransom wording or family branding.
defaults:
  platforms: [windows]
  for: [powershell, batch, scripts]
  attack: T1491.001

composite_rules:
  - id: linked-gpo-logon-screen-defacement
    desc: Linked GPO forces logon text and images and deploys a root file
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/security/gpo::set-gpregistryvalue-cmdlet
      - id: micro-behaviors/os/registry/value-name::legal-notice-caption
      - id: micro-behaviors/os/registry/value-name::legal-notice-text
      - id: micro-behaviors/os/registry/value-name::lock-screen-image-path
      - id: micro-behaviors/os/registry/policy/reference::wallpaper-policy-value
      - id: micro-behaviors/os/security/gpo::linked-gpo-drive-root-file-deployment
    near_lines: 64

  - id: gpo-archive-logon-screen-defacement
    desc: GPO template archive forces logon notices, screen images, and root file
    crit: hostile
    conf: 0.98
    for: [archives, xml, text]
    scope: archive
    all:
      - id: micro-behaviors/os/security/gpo::gpp-registry-settings-clsid
      - id: micro-behaviors/os/registry/value-name::legal-notice-caption
      - id: micro-behaviors/os/registry/value-name::legal-notice-text
      - id: micro-behaviors/os/registry/value-name::lock-screen-image-path
      - id: micro-behaviors/os/registry/policy/reference::wallpaper-policy-value
      - id: micro-behaviors/os/security/gpo::gpp-sysvol-readonly-root-file-drop
