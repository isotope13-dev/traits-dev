defaults:
  attack: T1491.001
  platforms: [unix, windows]
composite_rules:
  - id: ransom-note-logon-ui
    desc: Sets a custom legal notice on logon screen
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/os/registry/manipulate::legal-notice-caption
      - id: micro-behaviors/os/registry/manipulate::legal-notice-text
    any:
      - id: micro-behaviors/os/registry/access::registry-set-value-api
      - id: objectives/persistence/login/startup/registry::reg-set-value-ex-source
    unless:
      # ReactOS reimplements Windows, so msgina.dll IS the GINA logon UI this
      # rule looks for text on. The sibling restore-point rule already carries
      # this directory for the same reason.
      - id: metadata/binary/vendor/
      - id: metadata/vendor/string::microsoft-corporation-author-string
      - id: metadata/file/profile/source-indications/
      # A .winmd is Microsoft's API metadata catalog: LEGALNOTICECAPTION and
      # LEGALNOTICETEXT appear as REGSTR_VAL_* constant names and no registry
      # value is ever written from one.
      - id: metadata/build/generated::winmd-metadata
  - id: forced-lockscreen-wallpaper
    desc: Forces lock screen wallpaper and prevents user changes
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/os/registry/manipulate::no-changing-wallpaper
      - id: micro-behaviors/os/registry/manipulate::lock-screen-image-path
    unless:
      # Same metadata-catalog exposure as ransom-note-logon-ui above: the
      # policy value names are constant-name strings in a .winmd.
      - id: metadata/build/generated::winmd-metadata
