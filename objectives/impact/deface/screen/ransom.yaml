defaults:
  attack: T1491.001
  platforms: [unix, windows]
composite_rules:
  - id: logon-legal-notice-registry-write
    desc: Logon legal-notice registry write clues
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/os/registry/value-name::legal-notice-caption
      - id: micro-behaviors/os/registry/value-name::legal-notice-text
    any:
      - id: micro-behaviors/os/registry/value/write::registry-set-value-api
      - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-source
    unless:
      - id: well-known/dual-use/remote-admin/netsupport::netsupport-manager-library-context
      # ReactOS reimplements Windows, so msgina.dll IS the GINA logon UI this
      # rule looks for text on. The sibling restore-point rule already carries
      # this directory for the same reason.
      - id: metadata/vendor/string::microsoft-corporation-name-reference
      - id: metadata/build/generated::winmd-metadata
  - id: forced-lockscreen-wallpaper
    desc: Forces lock screen wallpaper and prevents user changes
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/os/registry/value-name::no-changing-wallpaper
      - id: micro-behaviors/os/registry/value-name::lock-screen-image-path
    unless:
      # Same metadata-catalog exposure as ransom-note-logon-ui above: the
      # policy value names are constant-name strings in a .winmd.
      - id: metadata/build/generated::winmd-metadata
