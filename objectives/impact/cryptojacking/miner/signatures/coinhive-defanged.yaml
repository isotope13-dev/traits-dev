# A CoinHive bootstrap whose Anonymous constructor was stripped or commented
# out (`var miner = null; //('<key>', {throttle})`) but whose library load,
# throttle and start call remain. Cleanup tools and hosting providers leave
# this remnant; the hosted library still loads but nothing mines, so it marks
# a cryptojacking injection rather than an active miner.
defaults:
  for: [html]
  platforms: [windows, unix]
  attack: T1496
composite_rules:
  - id: coinhive-bootstrap-without-constructor
    desc: CoinHive loader and start, no constructor
    crit: suspicious
    conf: 0.85
    near_bytes: 2048
    all:
      - id: well-known/app/finance/coinhive::coinhive-script-reference
      - id: "metadata/lang/source/syntax/key-value::fractional-throttle-option"
      - id: micro-behaviors/data/control-flow/dispatch/named::miner-or-client-start-call
    unless:
      - id: well-known/app/finance/coinhive::coinhive-miner-construct
      - id: well-known/app/finance/coinhive::coinhive-anonymous-site-key
traits: []
