# A CoinHive bootstrap whose Anonymous constructor was stripped or commented
# out (`var miner = null; //('<key>', {throttle})`) but whose library load,
# throttle and start call remain. Cleanup tools and hosting providers leave
# this remnant; the hosted library still loads but nothing mines, so it marks
# a cryptojacking injection rather than an active miner.
defaults:
  for: [html]
  platforms: [windows, unix]
  attack: T1496
composite_rules:
  - id: coinhive-bootstrap-without-constructor
    desc: CoinHive loader and start, no constructor
    crit: suspicious
    conf: 0.85
    near_bytes: 2048
    all:
      - id: coinhive-library-url
      - id: miner-throttle-option
      - id: miner-start-invocation
    unless:
      - id: coinhive-miner-construct
      - id: coinhive-anonymous-site-key
