# A CoinHive bootstrap whose Anonymous constructor was stripped or commented
# out (`var miner = null; //('<key>', {throttle})`) but whose library load,
# throttle and start call remain. Cleanup tools and hosting providers leave
# this remnant; the hosted library still loads but nothing mines, so it marks
# a cryptojacking injection rather than an active miner.
defaults:
  for: [html]
  platforms: [windows, unix]
  attack: T1496
composite_rules:
  - id: coinhive-bootstrap-without-constructor
    desc: CoinHive loader and start, no constructor
    crit: suspicious
    conf: 0.85
    near_bytes: 2048
    all:
      - id: micro-behaviors/crypto/hash/mining::coinhive-script-reference
      - id: micro-behaviors/data/property/assign::fractional-throttle-option
      - id: micro-behaviors/data/control-flow/dispatch::miner-named-start-call
    unless:
      - id: micro-behaviors/crypto/hash/mining::coinhive-miner-construct
      - id: micro-behaviors/crypto/hash/mining::coinhive-anonymous-site-key
