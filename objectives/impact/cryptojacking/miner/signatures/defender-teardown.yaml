# Mining protocol alone is neutral. Disabling Defender is the abuse context.
# This is a file-scoped capability combination, not an asserted data flow
# from the particular login template into the process-launch call.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
- id: rpc-login-defender-teardown-indicators
  desc: RPC login and Defender command text with CreateProcessA import
  # Embedded commands and an imported API indicate a suspicious tool or
  # payload configuration, but do not establish that this PE executes them.
  crit: suspicious
  conf: 0.98
  attack: T1496,T1562.001
  all:
  - id: micro-behaviors/communications/blockchain/client::jsonrpc-mining-login
  - id: objectives/impact/degrade/services::defender-service-teardown-native
  - id: micro-behaviors/process/create/exec::create-process-a
