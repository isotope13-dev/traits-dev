  - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon
  - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
- id: configured-cli-stratum-miner
  desc: Stratum miner with CLI pool flag
  crit: suspicious
  conf: 0.97
  attack: T1496
  for:
  - whl
  - shell
  scope: package
  all:
  - id: miner-pool-cli-flag
  - id: micro-behaviors/communications/socket/tcp::stratum-mining-protocol
  - id: micro-behaviors/communications/blockchain/mining::miner-keyword
- id: systemd-path-pool-miner
  desc: Systemd path launches a pool miner
  crit: hostile
  conf: 0.97
  attack: T1496,T1036.005
  for:
  - shell
  all:
  - id: systemd-path-miner-algo
  - id: miner-pool-cli-flag
  - id: cli-user-long-token
- id: configured-cli-miner-launcher
  desc: Shell launcher passes pool flags to local miner
  crit: hostile
  conf: 0.98
  attack: T1496
  mbc: B0018
  for:
  - shell
  all:
  - id: miner-pool-cli-flag
  - id: miner-algorithm-cli-flag
  - id: micro-behaviors/process/create/local-exec::chmod-exec-literal-local
- id: packaged-cli-wallet-miner
  desc: Python package launches a configured pool CLI
  crit: hostile
  conf: 0.98
  attack: T1496,T1195.002
  mbc: B0018
  for:
  - whl
  - shell
  - text
  - python
  scope: package
  all:
  - id: micro-behaviors/process/create/local-exec::local-executable-host-argument
  - id: micro-behaviors/process/create/local-exec::local-executable-user-argument
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-local-file
  - id: metadata/package/scripts/entrypoint::console-header-in-entry-points-file
  - id: micro-behaviors/process/create/shell/interpreter::python-bash-argv-launch
- id: obfuscated-coinhive-miner-bootstrap
  desc: Obfuscated CoinHive miner bootstrap and start
  crit: hostile
  conf: 0.97
  for:
  - javascript
  - typescript
  attack: T1496
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/blockchain/mining::coinhive-script-reference
  - id: micro-behaviors/communications/blockchain/mining::coinhive-miner-construct
  - id: micro-behaviors/data/control-flow/dispatch/named::miner-or-client-start-call
  - id: objectives/anti-static/obfuscation/string/dynamic::hex-escaped-bracket-property
# Concealed startup: the constructor and the start call
# beside a percent-decoding unescape instead of the hosted library URL.
# Rehosted kits (a status.js on an unrelated host) never name
# coinhive.min.js, and the bootstrap arrives percent-encoded inside
# document.write(unescape(...)), so the library leg cannot see it.
# Constructing and starting the miner from decoded markup is still a miner
# running on the visitor's machine.
- id: coinhive-encoded-miner-startup
  desc: Encoded CoinHive miner constructed and started
  crit: hostile
  conf: 0.96
  for:
  - html
  attack: T1496,T1027
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/blockchain/mining::coinhive-miner-construct
  - id: micro-behaviors/data/control-flow/dispatch/named::miner-or-client-start-call
  - id: micro-behaviors/data/decode/url::js-unescape-invocation-evidence
# CryptoLoot startup: the Anonymous constructor
# beside a fractional throttle and the miner start call. CryptoLoot copied
# CoinHive's bootstrap API, so the same three legs state a miner running on
# the visitor's machine under the CRLT namespace.
- id: cryptoloot-browser-miner-startup
  desc: CryptoLoot miner constructed throttled and started
  crit: hostile
  conf: 0.97
  for:
  - html
  - javascript
  - typescript
  attack: T1496
  near_bytes: 4096
  all:
  - id: cryptoloot-anonymous-construct
  - id: "metadata/lang/source/syntax/key-value::fractional-throttle-option"
  - id: micro-behaviors/data/control-flow/dispatch/named::miner-or-client-start-call
# Configured-but-not-started twin of the startup above: the anonymous
# constructor beside a fractional throttle states a miner bound to a site
# key and tuned, without the start call that would make it running. A
# dormant configuration is concerning rather than executing, so this stays
# suspicious while the startup composite convicts.
- id: cryptoloot-throttled-anonymous-config
  desc: Throttled anonymous CryptoLoot miner configured
  crit: suspicious
  conf: 0.9
  for:
  - html
  - javascript
  - typescript
  attack: T1496
  near_bytes: 500
  all:
  - id: cryptoloot-anonymous-construct
  - id: "metadata/lang/source/syntax/key-value::fractional-throttle-option"
- id: txt-file-encrypted-resource-miner-dropper
  desc: TXT FILE masquerade stages encrypted resources with VM gate
  crit: hostile
  conf: 0.95
  attack: T1496,T1027.013,T1497.001
  for: [pe]
  platforms: [windows]
  all:
  - id: txt-file-version-product-claim
  - id: metadata/binary/resource/entropy::mid-sized-pe-high-entropy-resources
  - id: micro-behaviors/data/embedded/payload/native::raw-resource-extraction-import-cluster
  - id: micro-behaviors/os/virtualization/detect::vmware-version-port-query
  any:
  - id: micro-behaviors/process/debug/detect::check-remote-debugger-string
  - id: fake-release-pdb-path-marker
  needs: 1
  unless:
  - id: metadata/signed/platform/
