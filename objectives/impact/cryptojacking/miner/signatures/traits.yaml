- id: obfuscated-coinhive-miner-bootstrap
  desc: Obfuscated CoinHive miner bootstrap and start
  crit: hostile
  conf: 0.97
  for:
  - javascript
  - typescript
  attack: T1496
  near_bytes: 4096
  all:
  - id: coinhive-library-url
  - id: coinhive-miner-construct
  - id: miner-start-invocation
  - id: objectives/anti-static/obfuscation/string/dynamic::hex-escaped-bracket-property
# In-page AuthedMine startup: the Anonymous constructor beside its throttle
# option and the client start call. Any one leg is a library spelling, but
# constructing, throttling and starting together is a miner running on the
# visitor's machine, with or without the obfuscation the sibling above
# requires.
- id: authedmine-browser-miner-startup
  desc: AuthedMine miner constructed throttled and started
  crit: hostile
  conf: 0.97
  for:
  - html
  - javascript
  - typescript
  attack: T1496
  near_bytes: 4096
  all:
  - id: authedmine-anonymous-construct
  - id: miner-throttle-option
  - id: underscore-client-start-call
# In-page CoinHive startup: the hosted library beside the miner
# constructor and the miner start call. Any one leg is a library spelling,
# but loading, constructing and starting together is a miner running on
# the visitor's machine, matching the AuthedMine sibling above without
# requiring its throttle option.
- id: coinhive-browser-miner-startup
  desc: CoinHive miner constructed and started in page
  crit: hostile
  conf: 0.97
  for:
  - html
  attack: T1496
  near_bytes: 4096
  all:
  - id: coinhive-library-url
  - id: coinhive-miner-construct
  - id: miner-start-invocation
# Hardcoded-key twin of the startup above: the library and the start call
# beside an Anonymous constructor carrying a literal site key. The key
# states an attributed campaign rather than a library reference, and the
# looser spelling holds for bracket variants the dot-form rule misses.
- id: coinhive-keyed-miner-startup
  desc: CoinHive miner started with hardcoded site key
  crit: hostile
  conf: 0.96
  for:
  - html
  attack: T1496
  near_bytes: 4096
  all:
  - id: coinhive-library-url
  - id: coinhive-anonymous-site-key
  - id: miner-start-invocation
# Encoded twin of the startup above: the constructor and the start call
# beside a percent-decoding unescape instead of the hosted library URL.
# Rehosted kits (a status.js on an unrelated host) never name
# coinhive.min.js, and the bootstrap arrives percent-encoded inside
# document.write(unescape(...)), so the library leg cannot see it.
# Constructing and starting the miner from decoded markup is still a miner
# running on the visitor's machine.
- id: coinhive-encoded-miner-startup
  desc: Encoded CoinHive miner constructed and started
  crit: hostile
  conf: 0.96
  for:
  - html
  attack: T1496,T1027
  near_bytes: 4096
  all:
  - id: coinhive-miner-construct
  - id: miner-start-invocation
  - id: micro-behaviors/data/decode/url::js-unescape-call-text
# CryptoLoot twin of the AuthedMine startup above: the Anonymous constructor
# beside a fractional throttle and the miner start call. CryptoLoot copied
# CoinHive's bootstrap API, so the same three legs state a miner running on
# the visitor's machine under the CRLT namespace.
- id: cryptoloot-browser-miner-startup
  desc: CryptoLoot miner constructed throttled and started
  crit: hostile
  conf: 0.97
  for:
  - html
  - javascript
  - typescript
  attack: T1496
  near_bytes: 4096
  all:
  - id: cryptoloot-anonymous-construct
  - id: miner-throttle-option
  - id: miner-start-invocation
# Configured-but-not-started twin of the startup above: the anonymous
# constructor beside a fractional throttle states a miner bound to a site
# key and tuned, without the start call that would make it running. A
# dormant configuration is concerning rather than executing, so this stays
# suspicious while the startup composite convicts.
- id: cryptoloot-throttled-anonymous-config
  desc: Throttled anonymous CryptoLoot miner configured
  crit: suspicious
  conf: 0.9
  for:
  - html
  - javascript
  - typescript
  attack: T1496
  near_bytes: 500
  all:
  - id: cryptoloot-anonymous-construct
  - id: miner-throttle-option
