# The PyInstaller entry point decodes and executes an opaque Python payload.
# Reverse engineering that payload showed an idle-gated XMRig launcher with a
# hardcoded Kryptex pool and wallet. Keep this exact hash as an IOC until the
# analyzer can inspect PyInstaller's compressed bytecode members.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1496
  mbc: B0004

traits:
  - id: kryptex-idle-gated-helper-sha256
    desc: Exact Kryptex idle-gated miner helper
    crit: hostile
    conf: 1.0
    ref: sha256:97e154296d55812b7e4b2992c7e5a4e87356a8075c248beb85b6a98f3bf16b79
    if:
      type: yara
      source: |
        import "hash"

        rule kryptex_idle_gated_helper_sha256 {
          condition:
            uint16(0) == 0x5a4d and
            hash.sha256(0, filesize) ==
              "97e154296d55812b7e4b2992c7e5a4e87356a8075c248beb85b6a98f3bf16b79"
        }
