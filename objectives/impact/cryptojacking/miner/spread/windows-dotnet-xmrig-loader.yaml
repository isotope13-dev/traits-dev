defaults:
  platforms: [windows]
  for: [pe]
  attack: T1496
  mbc: B0004
traits:
  - id: xmrig-release-download-url
    desc: Download URL for the XMRig release executable
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)github\.com/xmrig/xmrig/releases/[^\s"]{0,60}xmrig\.exe'
composite_rules:
  - id: dotnet-xmrig-release-pool-loader
    desc: .NET loader fetches XMRig release and names a mining pool
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: xmrig-release-download-url
      - id: micro-behaviors/communications/http/url/domain::known-mining-pool-reference
      - id: metadata/binary/symbols/descriptor::dotnet-processstartinfo-name
