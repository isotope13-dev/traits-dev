# Windows counterpart to spread/dropper.yaml: a miner reference by itself is
# only suspicious (XMRig is legitimately redistributed), but a binary that
# also disables Defender's own scanning of its drop path and wires itself
# into the Run key is the installer half of a cryptojacking campaign, not a
# sysadmin deploying a miner through normal channels.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1496,T1562.001,T1547.001
  mbc: B0022,F0004.002

composite_rules:
  - id: miner-dropper-defender-exclusion-persistence
    desc: Miner dropper disables Defender scanning and persists via Run key
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/impact/cryptojacking/miner/smart::xmrig-str
      - id: objectives/evasion/anti-av/platform/defender::defender-exclusion-command-text
      - id: micro-behaviors/os/registry/keys::currentversion-run
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: well-known/app/
      - id: well-known/tool/
