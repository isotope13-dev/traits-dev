defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1496,T1562.001,T1547.001
  mbc: B0022,F0004.002
  crit: hostile
composite_rules:
- id: java-branded-xmrig-pool-carrier
  desc: XMRig PE masquerading as Java SE launcher
  conf: 0.97
  attack: T1036.005,T1496
  for:
  - pe
  all:
  - id: well-known/lib/runtime/managed/jvm::windows-java-se-versioninfo
  - id: well-known/lib/runtime/managed/jvm::windows-java-console-launcher-original-filename
  - id: well-known/app/finance/xmrig::xmrig-name
  - id: micro-behaviors/data/config/syntax::json-pools-array-field
  unless:
  - id: metadata/signed/platform/
- id: miner-dropper-defender-exclusion-persistence
  desc: Miner dropper disables Defender scanning and persists via Run key
  conf: 0.96
  all:
  - id: well-known/app/finance/xmrig::xmrig-name
  - id: micro-behaviors/os/security/defender::defender-exclusion-command
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
  - id: well-known/tool
- id: windows-script-miner-dropper-persistence
  desc: Windows script persists a downloaded cryptocurrency miner
  conf: 0.96
  attack: T1496,T1105,T1543.003
  for:
  - powershell
  - batch
  - scripts
  all:
  - id: objectives/impact/cryptojacking/miner/config::xmrig-configured-argument-line
  - id: metadata/lang/source/syntax/call/relationship::webclient-start-process-source-sequence
  any:
  - id: micro-behaviors/os/service/create::sc-create-start-sequence
  - id: objectives/persistence/system/service/install::writable-service-image-any
  downgrade:
    any:
    - id: script-miner-service-installer
- id: script-miner-service-installer
  desc: Windows script installs a configured miner as an auto-start service
  conf: 0.96
  attack: T1496,T1105,T1543.003
  for:
  - powershell
  - batch
  - scripts
  all:
  - id: micro-behaviors/communications/http/client/managed::webclient-download-method-text
  - id: micro-behaviors/process/create/exec::start-process-call
  - id: micro-behaviors/os/service/create::sc-auto-start-service-create
  - id: objectives/persistence/system/service/install::writable-service-image-any
  any:
  - id: micro-behaviors/process/argument/option::miner-pool-wallet-option-pair
  - id: objectives/impact/cryptojacking/miner/config::xmrig-configured-argument-line
