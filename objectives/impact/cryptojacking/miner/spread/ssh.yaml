defaults:
  platforms: [unix, android]
  for: [scripts, binaries]
traits:
  - id: tmp-monaco-path
    desc: /tmp/monaco path reference
    crit: notable
    conf: 0.96
    attack: T1496
    if:
      type: text
      substr: /tmp/monaco
  - id: tmp-nice-path
    desc: /tmp/nice path reference
    crit: notable
    conf: 0.92
    attack: T1496
    if:
      type: text
      substr: /tmp/nice
  - id: xmrigcc-ref
    desc: XMRigCC controller string
    crit: suspicious
    conf: 0.9
    attack: T1496
    if:
      type: text
      word: XMRigCC
  - id: xmrigcc-secret
    desc: XMRigCC default secret
    crit: notable
    conf: 0.98
    attack: T1496
    if:
      type: text
      exact: mySecret
composite_rules:
  # Some miner installers add operator SSH access directly from the same
  # launcher that configures the pool. The key-write primitive alone is
  # common in provisioning, and a miner alone can be user-installed; their
  # co-occurrence identifies an unauthorized miner deployment with a remote
  # access backdoor, even when it does not make authorized_keys immutable.
  - id: script-miner-installs-ssh-backdoor
    desc: Miner launcher installs a hardcoded SSH backdoor
    crit: hostile
    conf: 0.98
    attack: T1496,T1098.004
    for: [shell]
    all:
      - id: script-miner-indicator
      - id: well-known/app/finance/xmrig::xmrig-product
      - id: micro-behaviors/communications/ssh/keys::hardcoded-authorized-key-write

  - id: temp-miner-staging
    desc: Temporary path references
    crit: notable
    conf: 0.9
    any:
      - id: tmp-monaco-path
      - id: tmp-nice-path
  - id: xmrig-control-plane
    desc: XMRigCC control plane bundle
    crit: suspicious
    conf: 0.95
    all:
      - id: xmrigcc-ref
      - id: xmrigcc-secret
  - id: ssh-spreading-cryptominer
    for: [scripts, '!batch', '!jcl', '!powershell', '!vbs', elf, macho]
    desc: SSH spreading cryptominer cluster
    crit: hostile
    conf: 0.98
    attack: T1496
    all:
      - id: micro-behaviors/communications/blockchain/mining::mining-protocol-known-pool
      - id: objectives/lateral-movement/brute-force/ssh::internet-ssh-scanner
    any:
      - id: temp-miner-staging
      - id: xmrig-control-plane
