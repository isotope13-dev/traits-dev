defaults:
  platforms: [unix]
  for: [python]
  attack: T1496,T1195.001

traits:
  - id: python-nicehash-config
    desc: Python embeds NiceHash configuration
    crit: notable
    if:
      type: text
      regex: '(?i)["'']nicehash["'']\s*:'

composite_rules:
  - id: python-package-miner-download-execute
    desc: Package downloads and launches a configured miner
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/build/pip::packaging-setuptools-setup-call
      - id: metadata/lang/source/syntax/command/launch::chmod-then-local-execute-command
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/data/config/syntax::json-pools-array-field
      - id: micro-behaviors/fs/file/open/call::python-open-hardcoded-tmp-path
      - id: python-nicehash-config
  # An install-phase hook that writes a pool configuration naming a known
  # mining pool or a Monero payout wallet deploys a miner at install time.
  # The install override alone is common in packaging; the pool and wallet
  # evidence is what makes the hook a miner deployment.
  - id: python-install-hook-miner-pool-config
    desc: Install hook writes a mining pool configuration
    crit: hostile
    conf: 0.97
    attack: T1496,T1546
    all:
      - id: metadata/build/package/recipe/setup-hooks::python-build-or-install-command-override
      - id: micro-behaviors/data/config/syntax::json-pools-array-field
    any:
      - id: micro-behaviors/communications/url/host/domain-http::known-mining-pool-reference
      - id: micro-behaviors/communications/blockchain/mining::monero-wallet-address-literal
  # Install hook that enables a multi-user systemd unit for a miner, with
  # the miner's pool or wallet evidence present in the same package.
  - id: python-install-hook-miner-systemd-service
    desc: Install hook enables a systemd miner service
    crit: hostile
    conf: 0.97
    attack: T1496,T1543.002
    all:
      - id: metadata/build/package/recipe/setup-hooks::python-build-or-install-command-override
      - id: micro-behaviors/os/service/control::systemctl-enable-call-dynamic
      - id: micro-behaviors/os/service/unit-field::wanted-by-multi-user-text
    any:
      - id: micro-behaviors/communications/url/host/domain-http::known-mining-pool-reference
      - id: micro-behaviors/communications/blockchain/mining::monero-wallet-address-literal
      - id: micro-behaviors/data/config/syntax::json-pools-array-field
