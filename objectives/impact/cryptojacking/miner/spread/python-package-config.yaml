defaults:
  platforms: [unix]
  for: [python]
  attack: T1496,T1195.001

traits:
  - id: python-nicehash-config
    desc: Python embeds NiceHash configuration
    crit: notable
    if:
      type: text
      regex: '(?i)["'']nicehash["'']\s*:'

composite_rules:
  - id: python-package-miner-download-execute
    desc: Package downloads and launches a configured miner
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/build/pip::packaging-setuptools-setup-call
      - id: metadata/lang/source/syntax/command/launch::chmod-then-local-execute-command
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/data/config/syntax::json-pools-array-field
      - id: micro-behaviors/fs/file/open/unspecified::python-open-hardcoded-tmp-path
      - id: python-nicehash-config
