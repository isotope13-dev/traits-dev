# Miner droppers: the installer half of a cryptojacking campaign.
#
# The mining binary itself is off-the-shelf (XMRig is open source and shows up
# in legitimate deployments), so a miner reference alone stays suspicious. What
# makes an artifact the *campaign's* installer is the delivery machinery it
# wraps around that reference: pull a payload over HTTP from a hardcoded
# address, make it executable, run it, and register something that starts it
# again after reboot. A sysadmin deploying a miner uses a package manager or a
# config-managed unit file; they do not ship a binary that curls its own
# payload and writes its own unit.
#
# download/chmod/exec and boot persistence are the same idea in a Go dropper, a
# shell installer, or a C loader, but the atoms that detect them are not shared:
# mining-indicators, download-permission-execute-chain, and the C systemd-unit
# trait are all native-only. So the technique is expressed twice — the binary
# composites below, and a script sibling built from the script-capable atoms —
# both filed here so they aggregate into one cryptojacking/miner/spread feature.
defaults:
  platforms: [linux, unix]
  for: [binaries, scripts]
  attack: T1496
  mbc: B0022

composite_rules:
  - id: miner-dropper-with-boot-persistence
    for:
    - elf
    desc: Miner payload staged with boot persistence
    crit: hostile
    conf: 0.95
    all:
    - id: micro-behaviors/crypto/hash/mining::mining-software-or-stratum-reference
    - id: micro-behaviors/process/create/local-exec::embedded-download-chmod-execute-chain
    unless:
    - id: objectives/impact/dos/attack/botnet::source-query-cipher-ddos-bot
    any:
    - id: micro-behaviors/os/service/config::restarting-unit-path-reference
    - id: objectives/persistence/system/init/boot/
    - id: micro-behaviors/os/service/config::update-rc-d-call
    - id: micro-behaviors/os/service/config::install-verb-before-initd-path
    - id: micro-behaviors/os/service/config::write-verb-before-initd-path
    - id: objectives/persistence/system/cron/
    - id: micro-behaviors/os/autorun/cron::crontab-edit-command
  - id: script-miner-indicator
    desc: Mining pool reference in a script
    crit: notable
    conf: 0.9
    for: [scripts]
    any:
      - id: micro-behaviors/communications/http/url/domain::known-mining-pool-reference
      - id: micro-behaviors/communications/socket/tcp::stratum-tcp-url
      - id: micro-behaviors/communications/socket/tcp::stratum-ssl-url

  - id: script-miner-dropper-persistent
    desc: Script miner installer persists a fetched payload
    crit: hostile
    conf: 0.95
    attack: T1496,T1105
    for: [shell]
    all:
      - id: script-miner-indicator
      # The fetch/chmod/execute chain is a generic dropper behavior. Keep its
      # matcher in command-and-control and add mining intent only here.
      - id: micro-behaviors/process/create/local-exec::raw-ip-download-chmod-local-exec
    any:
      - id: objectives/persistence/system/service/systemd::hidden-daemon-systemd-persistence
      - id: micro-behaviors/os/service/control::systemctl-enable-command
      - id: objectives/persistence/system/cron/
      - id: micro-behaviors/os/autorun/cron::crontab-edit-command
      - id: objectives/persistence/system/init/boot/
      # SysV init atoms that moved to micro-behaviors keep counting here.
      - id: micro-behaviors/os/service/config::update-rc-d-call
      - id: micro-behaviors/os/service/config::install-verb-before-initd-path
      - id: micro-behaviors/os/service/config::write-verb-before-initd-path
