defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: mining-pool-wallet-arguments
    desc: Mining pool and wallet arguments
    crit: notable
    if:
      type: text
      regex: "(?is)['\"]--pool['\"].{0,100}['\"]--wallet['\"]"
  - id: hardcoded-mining-wallet
    desc: Hardcoded mining wallet assignment
    crit: notable
    if:
      type: text
      regex: '(?i)\$wallet\s*=\s*["''][a-z0-9]{40,100}["'']'
  - id: mining-boot-task
    desc: Startup task trigger reference
    crit: notable
    if:
      type: text
      regex: '(?i)New-ScheduledTaskTrigger\s+-AtStartup'
  - id: elevation-failure-hidden-relaunch
    desc: Hidden relaunch after elevation failure
    crit: notable
    if:
      type: text
      regex: '(?i)-Verb RunAs[^\r\n]{0,120}catch \{ Start-Process[^\r\n]{0,120}-WindowStyle Hidden'
composite_rules:
  - id: concealed-persistent-wallet-miner
    desc: Hidden miner installer persists with a hardcoded payout wallet
    crit: hostile
    conf: 0.96
    attack: T1496,T1053.005
    all:
      - id: mining-pool-wallet-arguments
      - id: hardcoded-mining-wallet
      - id: mining-boot-task
      - id: elevation-failure-hidden-relaunch
      - id: micro-behaviors/process/deploy/interpreter-command::batch-start-process-self-arg
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
