# These patterns expose time-limited opt-out configuration, but do not prove
# whether consent was obtained elsewhere. Severity therefore stays suspicious.
defaults:
  platforms: [linux, macos, windows]
  for: [html, javascript, typescript]
  attack: T1496

composite_rules:
  - id: coinhive-expiring-optout
    desc: CoinHive configuration expires mining opt-out
    crit: suspicious
    conf: 0.95
    near_bytes: 512
    all:
      - id: micro-behaviors/crypto/hash/mining::coinhive-miner-variable-assignment
      - id: micro-behaviors/data/control-flow/branch::miner-expiring-optout-test
