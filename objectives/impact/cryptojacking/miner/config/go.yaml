defaults:
  platforms: [linux, macos, windows]
  for: [elf, pe, macho, go]
  attack: T1496
  mbc: B0004
traits:
- id: go-xmrig-preset-fields--rx-1
  desc: Go XMRig enabled or NiceHash preset field
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'current_preset_xmrig_(enabled|nicehash)'
- id: go-xmrig-preset-fields--rx-2
  desc: Go XMRig algorithm or pool-address preset field
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'current_preset_xmrig_(algo|poolAddr)'
- id: go-xmrig-preset-fields--rx-3
  desc: Go XMRig pool credential preset field
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'current_preset_xmrig_(poolUser|poolPass)'
- id: go-xmrig-preset-fields--rx-4
  desc: Multiple Go XMRig JSON configuration fields
  crit: notable
  conf: 0.95
  count_min: 3
  if:
    type: text
    substr: json:"xmrig_
- id: go-nbminer-preset-fields--rx-5
  desc: Go NBMiner enabled or algorithm preset field
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'current_preset_nbminer_(enabled|algo)'
- id: go-nbminer-preset-fields--rx-6
  desc: Go NBMiner pool address or user fields
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'current_preset_nbminer_(poolAddr|poolUser)'
- id: go-nbminer-preset-fields--rx-7
  desc: Multiple Go NBMiner pool-password preset fields
  crit: notable
  conf: 0.95
  count_min: 3
  if:
    type: text
    regex: 'current_preset_nbminer_(poolPass)'
- id: go-nbminer-preset-fields--rx-8
  desc: Multiple Go NBMiner JSON configuration fields
  crit: notable
  conf: 0.95
  count_min: 3
  if:
    type: text
    substr: json:"nbminer_
composite_rules:
- id: credential-exfiltration-with-dual-miner-config
  for: [elf]
  desc: SSH credential stealer carries XMRig and NBMiner configuration
  crit: hostile
  conf: 0.99
  attack: T1056.003,T1041,T1496
  all:
  - id: objectives/exfiltration/messaging/webhook::go-ssh-credential-discord-exfiltration
  - id: go-xmrig-preset-fields
  - id: go-nbminer-preset-fields
- id: embedded-go-miner-config
  for: [elf, pe]
  desc: Embedded Go cryptocurrency miner config
  crit: hostile
  conf: 0.98
  any:
  - id: go-xmrig-preset-fields
  - id: go-nbminer-preset-fields
  all:
  - id: objectives/impact/cryptojacking/miner/smart::known-pool-stratum-endpoint
- id: go-xmrig-preset-fields
  desc: Go XMRig preset fields
  crit: notable
  conf: 0.95
  any:
  - id: go-xmrig-preset-fields--rx-1
  - id: go-xmrig-preset-fields--rx-2
  - id: go-xmrig-preset-fields--rx-3
  - id: go-xmrig-preset-fields--rx-4
- id: go-nbminer-preset-fields
  desc: Go NBMiner preset fields
  crit: notable
  conf: 0.95
  any:
  - id: go-nbminer-preset-fields--rx-5
  - id: go-nbminer-preset-fields--rx-6
  - id: go-nbminer-preset-fields--rx-7
  - id: go-nbminer-preset-fields--rx-8
