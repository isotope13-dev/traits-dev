# The constructor supplies no throttle, thread limit, or other options near
# an automatic startup. This is not proof of measured CPU consumption or of
# defaults inside an unavailable/rehosted implementation.
defaults:
  platforms: [linux, macos, windows]
  for: [html]
  attack: T1496

composite_rules:
  - id: coinimp-default-options-near-autostart
    desc: Default-option CoinIMP constructor near automatic startup
    crit: suspicious
    conf: 0.93
    near_bytes: 256
    all:
      - id: micro-behaviors/crypto/hash/mining::coinimp-anonymous-default-options
      - id: objectives/impact/cryptojacking/miner/runtime::coinimp-inline-autostart
