# XMRig paired with a pool endpoint is a configured miner, but it does not by
# itself establish unauthorized use: operators legitimately run the same open-
# source miner against public pools. Malicious deployment is escalated by the
# loader, persistence, or concealment composites that supply that intent.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, scripts, text]
  attack: T1496
  mbc: B0025

composite_rules:
  - id: xmrig-with-pool-configuration
    desc: XMRig paired with a mining pool or wallet configuration
    crit: notable
    conf: 0.95
    all:
      - id: objectives/impact/cryptojacking/miner/smart::xmrig-str
    any:
      - id: objectives/impact/cryptojacking/miner/pool/
      - id: objectives/impact/cryptojacking/miner/signatures::stratum-known-pool-miner
      - id: objectives/impact/crypto-manipulation/keystore::native-monero-wallet-paths
    unless:
      - id: metadata/package/testing/
