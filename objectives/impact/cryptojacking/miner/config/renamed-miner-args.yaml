# Renamed-miner command lines: the same XMRig-style pool/wallet options without
# the `xmrig` name gate. Campaigns run the miner under a benign-looking name
# (edge.exe, system utilities, random strings), so name-gated matchers miss
# the invocation while the option shapes stay identical: `-o host:port` (or
# `--url host:port`) picks the pool endpoint and `-u <long token>` supplies
# the payout identity. Either option alone is only a capability; the composite
# below requires both on one command line, which has no legitimate use outside
# a miner launch.
defaults:
  platforms: [windows, unix]
  for: [scripts, batch, powershell, pe, elf, macho]
  attack: T1496
traits:
  - id: miner-pool-endpoint-option
    desc: Miner command supplies pool host and port
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(\s-o\s+|--url[=\s]+)[a-z0-9.-]+\.[a-z]{2,24}:\d{2,5}\b'
  - id: miner-wallet-user-option
    desc: Miner command supplies Monero wallet identity
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(\s-u\s+|--user[=\s]+)4[A-Za-z0-9]{90,110}\b'
composite_rules:
  # A pool endpoint plus a wallet identity on one command line is a configured
  # miner invocation regardless of the executable it runs under.
  - id: renamed-miner-pool-command-line
    desc: Renamed miner command with pool and wallet
    crit: suspicious
    conf: 0.95
    scope: file
    near_bytes: 400
    all:
      - id: miner-pool-endpoint-option
      - id: miner-wallet-user-option
