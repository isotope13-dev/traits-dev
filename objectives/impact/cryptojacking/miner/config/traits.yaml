defaults:
  platforms: [linux, macos, windows]
  for: [scripts, binaries]
  attack: T1496
  mbc: B0004

traits:
  - id: xmrig-donate-level
    desc: donate-level XMRig config option
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: donate-level
      section: .text
  - id: xmrig-cpu-priority
    desc: cpu-priority XMRig config option
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: cpu-priority
      section: .text
  - id: csharp-xmr-settings-class
    desc: C# XMR miner settings class
    crit: suspicious
    conf: 0.9
    for: [csharp]
    if:
      type: text
      regex: 'class\s+XmrSettings\b'
  - id: csharp-xmr-pool-wallet-fields
    desc: C# XMR pool wallet fields
    crit: suspicious
    conf: 0.9
    for: [csharp]
    if:
      type: text
      regex: 'Pool\s*=\s*""[\s\S]{0,240}Wallet\s*=\s*""'
  - id: csharp-xmr-inject-target-field
    desc: C# XMR injection target field
    crit: suspicious
    conf: 0.88
    for: [csharp]
    if:
      type: text
      regex: 'InjectTo\s*=\s*""'

  - id: autostart-enabled-setting
    desc: Configuration enables autostart
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)"autostart"\s*:\s*true'
  - id: configured-miner-competitor-killing-enabled
    desc: Miner config enables competitor killing
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)"kill_competitors"\s*:\s*true'
  - id: configured-miner-pastebin-control
    desc: Miner config references Pastebin control URL
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)"pastebin_url"\s*:\s*"https?://'
  - id: configured-miner-admin-request
    desc: Miner config requests administrator execution
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)"run_as_admin"\s*:\s*true'

composite_rules:
  - id: configured-miner-autostart-enabled
    desc: Miner configuration enables autostart
    crit: suspicious
    conf: 0.9
    # "autostart": true alone is any JSON slider, player, or slideshow
    # option; it names a miner only beside miner configuration markers.
    all:
      - id: autostart-enabled-setting
    any:
      - id: xmrig-basic-config-options
      - id: configured-miner-competitor-killing-enabled
      - id: configured-miner-pastebin-control
      - id: configured-miner-admin-request
      - id: micro-behaviors/communications/blockchain/mining::cryptonight-str
      - id: micro-behaviors/communications/url/host/domain-http::known-mining-pool-reference
      - id: well-known/app/finance/xmrig::xmrig-name
  - id: configured-miner-with-covert-deployment-controls
    desc: Miner configuration enables autostart and competitor termination
    crit: hostile
    conf: 0.97
    for: [pe, elf, scripts, binaries]
    attack: T1496,T1562.001,T1547
    all:
      - id: "well-known/app/finance/xmrig::xmrig-name"
      - id: micro-behaviors/communications/blockchain/mining::cryptonight-str
      - id: micro-behaviors/communications/url/host/domain-http::known-mining-pool-reference
      - id: autostart-enabled-setting
      - id: configured-miner-competitor-killing-enabled
    any:
      - id: configured-miner-pastebin-control
      - id: configured-miner-admin-request
    needs: 1

  - id: configured-miner-autostart-competitor-kill
    desc: Configured miner enables autostart and kills competing miners
    crit: hostile
    conf: 0.97
    for: [pe, elf, scripts, binaries]
    attack: T1496,T1547,T1562.001
    all:
      - id: autostart-enabled-setting
      - id: configured-miner-competitor-killing-enabled
      - id: micro-behaviors/communications/url/host/domain-http::known-mining-pool-reference

  - id: configured-miner-autostart-admin-pool
    desc: Configured miner enables autostart and requests administrator execution
    crit: hostile
    conf: 0.97
    for: [pe, elf, scripts, binaries]
    attack: T1496,T1547,T1068
    all:
      - id: configured-miner-autostart-enabled
      - id: configured-miner-admin-request
      - id: micro-behaviors/communications/url/host/domain-http::known-mining-pool-reference

  - id: xmrig-basic-config-options
    platforms: [linux, macos, unix, windows]
    desc: XMRig configuration option markers
    crit: notable
    conf: 0.75
    any:
    - id: xmrig-donate-level
    - id: xmrig-cpu-priority
  - id: csharp-xmr-injected-miner-config
    desc: C# XMR injected miner config
    crit: hostile
    conf: 0.96
    for: [csharp]
    all:
      - id: csharp-xmr-settings-class
      - id: csharp-xmr-pool-wallet-fields
      - id: csharp-xmr-inject-target-field
