# XMRig / SilentXMRMiner command-line arguments, matched independently of the
# launching binary name. Existing miner traits key off the literal `xmrig`
# token, but injected or renamed miners (SilentXMRMiner injects the RandomX
# payload into a host process such as explorer.exe) carry the same distinctive
# long-form flags without ever spelling "xmrig". The `--cinit-*` flags are
# specific to the SilentXMRMiner in-memory injection wrapper, not stock XMRig.
defaults:
  platforms: [windows, unix]
  for: [scripts, batch, powershell, pe, elf, macho]
  attack: T1496
traits:
  - id: xmrig-algo-randomx-arg
    desc: XMRig rx/0 RandomX algo argument
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)--algo=["'']?rx/0\b'
  - id: xmrig-randomx-mode-arg
    desc: XMRig randomx-mode tuning argument
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)--randomx-mode='
  - id: xmrig-cpu-threads-hint-arg
    desc: XMRig cpu-max-threads-hint argument
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)--cpu-max-threads-hint='
  - id: silentxmrminer-cinit-arg
    desc: SilentXMRMiner --cinit injection flag
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)--cinit-[a-z]'
  # The pools array of XMRig's JSON config compiled into the binary as its
  # default configuration; the stock release leaves this to the user.
  - id: xmrig-embedded-pools-config
    desc: Miner binary embeds a JSON pools array
    crit: notable
    conf: 0.9
    for: [elf, pe, macho]
    if:
      type: raw
      regex: '"pools"\s*:\s*\[\s*\{\s*"(algo|coin|url)"'
  - id: xmrig-embedded-pool-wallet-entry
    desc: Embedded pool entry names a Monero wallet
    crit: notable
    conf: 0.9
    for: [elf, pe, macho]
    if:
      type: raw
      regex: '"user"\s*:\s*"[48][0-9AB][1-9A-HJ-NP-Za-km-z]{93}"'
  - id: xmrig-donate-level-zero-config
    desc: Embedded config disables donations
    crit: notable
    conf: 0.9
    for: [elf, pe, macho]
    if:
      type: raw
      regex: '"donate-level"\s*:\s*0\b'
composite_rules:
  # A script that fetches something and carries its own Monero payout
  # address: the fetched stage is a miner or miner installer, and the
  # earnings are routed to whoever wrote the script, not the machine owner.
  - id: script-download-with-monero-payout
    desc: Script downloads a stage and hardcodes a Monero payout
    crit: suspicious
    conf: 0.9
    for: [scripts]
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/format/crypto-address::hardcoded-monero-address
    any:
      - id: micro-behaviors/communications/http/client/response-body::http-response-acquisition
  # Two or more distinctive XMRig long-form flags in one command line is a
  # configured miner invocation regardless of the executable it runs under.
  - id: xmrig-configured-argument-line
    desc: Configured XMRig miner command line
    crit: suspicious
    conf: 0.95
    scope: file
    near_bytes: 400
    any:
      - id: xmrig-algo-randomx-arg
      - id: micro-behaviors/communications/url/construction/fragment::url-host-port-cli-option
      - id: xmrig-randomx-mode-arg
      - id: xmrig-cpu-threads-hint-arg
      - id: silentxmrminer-cinit-arg
    needs: 2
  # A SilentXMRMiner injection flag alongside any pool/algo argument is the
  # builder's injected miner; --cinit-* has no legitimate XMRig use.
  - id: silentxmrminer-cinit-argument-line
    desc: SilentXMRMiner cinit miner command line
    crit: hostile
    conf: 0.96
    attack: T1496,T1055
    scope: file
    near_bytes: 400
    all:
      - id: silentxmrminer-cinit-arg
    any:
      - id: xmrig-algo-randomx-arg
      - id: micro-behaviors/communications/url/construction/fragment::url-host-port-cli-option
      - id: xmrig-randomx-mode-arg
      - id: xmrig-cpu-threads-hint-arg
  # XMRig built with its operator's pool list and Monero payout compiled in
  # runs unattended and pays its builder, so no user ever configured it.
  - id: xmrig-prebaked-wallet-pool-config
    desc: XMRig binary with built-in wallet and pools
    crit: hostile
    conf: 0.95
    for: [elf, pe, macho]
    all:
      - id: well-known/app/finance/xmrig::xmrig-name
      - id: xmrig-embedded-pools-config
      - id: xmrig-embedded-pool-wallet-entry
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: operator-wallet-no-donate-miner
    desc: Miner pays baked-in wallet with donations off
    crit: hostile
    conf: 0.95
    for: [elf, pe, macho]
    all:
      - id: xmrig-embedded-pool-wallet-entry
      - id: xmrig-donate-level-zero-config
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
