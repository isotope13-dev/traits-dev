# Miner configuration options do not establish injection or unauthorized use.
defaults:
  platforms: [windows, unix]
  for: [scripts, batch, powershell, pe, elf, macho]
  attack: T1496
composite_rules:
  # An SFX whose setup batch runs a miner against a pool with the author's
  # own wallet: the bundle is a cryptojacking dropper, not a configured
  # miner the machine owner installed.
  - id: sfx-batch-miner-pool-wallet
    desc: SFX setup batch mines to a hardcoded pool wallet
    crit: hostile
    conf: 0.97
    scope: outer
    all:
      - id: micro-behaviors/process/create/shell/batch::sfx-setup-batch-script
      - id: micro-behaviors/data/format/crypto-address::hardcoded-monero-address
      - id: micro-behaviors/process/argument/option::miner-pool-wallet-option-pair
      - id: well-known/app/finance/xmrig::xmrig-name
    unless:
      - id: metadata/signed/platform/
  # A wallet-shaped string can also be a grep/pkill target or documentation.
  # Require its payout role before inferring miner configuration.
  - id: script-download-with-monero-payout
    desc: HTTP download accompanies Monero payout settings
    crit: suspicious
    conf: 0.9
    for: [scripts]
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/format/crypto-address::hardcoded-monero-address
      - id: micro-behaviors/communications/http/client/response-body::http-response-acquisition
    any:
      - id: micro-behaviors/process/argument/authentication::miner-wallet-user-option
      - id: micro-behaviors/communications/blockchain/wallet::script-monero-json-user-field

  - id: npm-postinstall-shell-miner-dropper
    desc: npm postinstall script deploys a Monero miner
    crit: hostile
    conf: 0.98
    attack: T1496,T1195.002
    for: [npm, tar, package.json, shell]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: micro-behaviors/os/package-manager/hook-install::npm-postinstall-runs-shell-script-path
      - id: script-download-with-monero-payout
  # Two or more distinctive XMRig long-form flags in one command line is a
  # configured miner invocation regardless of the executable it runs under.
  - id: xmrig-configured-argument-line
    desc: Configured XMRig miner command line
    crit: suspicious
    conf: 0.95
    scope: file
    near_bytes: 400
    any:
      - id: metadata/file/profile/command-options::randomx-algorithm-option-text
      - id: micro-behaviors/communications/url/construction/fragment::url-host-port-cli-option
      - id: metadata/file/profile/command-options::randomx-mode-option-text
      - id: metadata/file/profile/command-options::cpu-max-threads-hint-option-text
      - id: metadata/file/profile/command-options::cinit-prefixed-option
    needs: 2
  # Configuration evidence only; no process-injection sink is required.
  - id: cinit-miner-argument-line
    desc: cinit configuration with miner command options
    crit: suspicious
    conf: 0.96
    scope: file
    near_bytes: 400
    all:
      - id: metadata/file/profile/command-options::cinit-prefixed-option
    any:
      - id: metadata/file/profile/command-options::randomx-algorithm-option-text
      - id: micro-behaviors/communications/url/construction/fragment::url-host-port-cli-option
      - id: metadata/file/profile/command-options::randomx-mode-option-text
      - id: metadata/file/profile/command-options::cpu-max-threads-hint-option-text

  - id: npm-postinstall-shell-monero-miner
    desc: postinstall shell script stages hardcoded-wallet miner
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1496"
    mbc: B0018
    for: [npm, tar, zip, package.json, shell]
    scope: archive
    all:
    - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
    - id: metadata/package/scripts/lifecycle::postinstall-runs-shell-local-script
    - id: micro-behaviors/data/format/crypto-address::hardcoded-monero-address
    any:
    - id: micro-behaviors/communications/blockchain/mining::json-donate-level-field
    - id: micro-behaviors/data/config/syntax::json-pools-array-field
    - id: micro-behaviors/process/create/shell/command-mode::hidden-randomx-pool-launch

  # A configured miner embedded in a self-replicating executable is deployed
  # without an owner's installation decision. Keep this distinct from the
  # replication and disk-exhaustion findings: it identifies the resource
  # abuse enabled by the embedded XMRig implementation.
  - id: native-footer-replicating-xmrig-miner
    desc: Native self-replicator embeds a configured XMRig miner
    crit: hostile
    conf: 0.98
    for: [pe]
    all:
      - id: well-known/app/finance/xmrig::cryptonight-implementation
      - id: micro-behaviors/data/config/syntax::embedded-pool-array-config
      - id: objectives/execution/payload/file-exec/spawn/native::native-footer-self-replica-launch
