# XMRig / SilentXMRMiner command-line arguments, matched independently of the
# launching binary name. Existing miner traits key off the literal `xmrig`
# token, but injected or renamed miners (SilentXMRMiner injects the RandomX
# payload into a host process such as explorer.exe) carry the same distinctive
# long-form flags without ever spelling "xmrig". The `--cinit-*` flags are
# specific to the SilentXMRMiner in-memory injection wrapper, not stock XMRig.
defaults:
  platforms: [windows, unix]
  for: [scripts, batch, powershell, pe, elf, macho]
  attack: T1496
traits:
  - id: silentxmrminer-cinit-arg
    desc: SilentXMRMiner --cinit injection flag
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)--cinit-[a-z]'
composite_rules:
  # A script that fetches something and carries its own Monero payout
  # address: the fetched stage is a miner or miner installer, and the
  # earnings are routed to whoever wrote the script, not the machine owner.
  - id: script-download-with-monero-payout
    desc: Script downloads a stage and hardcodes a Monero payout
    crit: suspicious
    conf: 0.9
    for: [scripts]
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/format/crypto-address::hardcoded-monero-address
    any:
      - id: micro-behaviors/communications/http/client/response-body::http-response-acquisition
  # Two or more distinctive XMRig long-form flags in one command line is a
  # configured miner invocation regardless of the executable it runs under.
  - id: xmrig-configured-argument-line
    desc: Configured XMRig miner command line
    crit: suspicious
    conf: 0.95
    scope: file
    near_bytes: 400
    any:
      - id: micro-behaviors/process/argument/option::xmrig-algo-randomx-option
      - id: micro-behaviors/communications/url/construction/fragment::url-host-port-cli-option
      - id: micro-behaviors/process/argument/option::xmrig-randomx-mode-option
      - id: micro-behaviors/process/argument/option::xmrig-cpu-threads-hint-option
      - id: silentxmrminer-cinit-arg
    needs: 2
  # A SilentXMRMiner injection flag alongside any pool/algo argument is the
  # builder's injected miner; --cinit-* has no legitimate XMRig use.
  - id: silentxmrminer-cinit-argument-line
    desc: SilentXMRMiner cinit miner command line
    crit: hostile
    conf: 0.96
    attack: T1496,T1055
    scope: file
    near_bytes: 400
    all:
      - id: silentxmrminer-cinit-arg
    any:
      - id: micro-behaviors/process/argument/option::xmrig-algo-randomx-option
      - id: micro-behaviors/communications/url/construction/fragment::url-host-port-cli-option
      - id: micro-behaviors/process/argument/option::xmrig-randomx-mode-option
      - id: micro-behaviors/process/argument/option::xmrig-cpu-threads-hint-option
