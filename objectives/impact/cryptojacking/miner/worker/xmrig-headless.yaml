# An XMRig build with a wallet and pool compiled in, donation off and
# background mode on runs unattended for whoever baked in the wallet: the
# shape of a miner built to be dropped, not one an owner configures. The
# payload of the trojaned Kong Ingress Controller 3.4.0 (2025) was such a
# build (supportxmr pool, donate-level 0, background true).
defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
  attack: T1496

composite_rules:
  - id: xmrig-compiled-wallet-headless-no-donate
    desc: XMRig with compiled-in wallet, background mode and no donation
    crit: suspicious
    conf: 0.93
    near_bytes: 4096
    all:
      - id: well-known/app/finance/xmrig::built-in-wallet-pools-config
      - id: micro-behaviors/communications/blockchain/mining::xmrig-donate-level-zero-config
      - id: micro-behaviors/process/daemonize/background::json-background-mode-enabled
