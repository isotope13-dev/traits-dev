defaults:
  platforms: [linux]
  for: [elf]

traits:
  - id: running-miner-status
    desc: Active miner process status string
    crit: notable
    conf: 0.94
    attack: T1496
    if:
      type: text
      regex: '(?i)\brunning\s+miner\s*:'

  - id: kernel-thread-dot-slash-kswapd
    desc: Masqueraded kswapd0 relative launch path
    crit: notable
    conf: 0.85
    attack: T1036.004
    for: [elf, shell]
    if:
      type: text
      regex: '(^|[^\w./])\./kswapd0\b'

composite_rules:
  - id: native-masqueraded-miner-controller
    desc: Native binary spawns and monitors a masqueraded cryptominer worker
    crit: hostile
    conf: 0.97
    attack: T1496,T1036.004
    all:
      - id: running-miner-status
      - id: micro-behaviors/os/sysinfo/performance::hashrate-reference
      - id: objectives/impact/degrade/rival-bot/scan-terminate::elf-rival-miner-process-terminator
    any:
      - id: kernel-thread-dot-slash-kswapd
      - id: micro-behaviors/process/create/runtime-symbol::go-os-exec-package-reference
