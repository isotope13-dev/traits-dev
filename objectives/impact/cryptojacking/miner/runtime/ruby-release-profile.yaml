# XMRig identity and a mining pool support the miner objective. Fetch,
# extraction and exec clues are nearby, but no staged-file handoff is bound.
defaults:
  platforms: [unix, windows]
  for: [ruby]

composite_rules:
  - id: ruby-xmrig-release-runtime-profile
    desc: Ruby XMRig pool with fetch and exec clues
    crit: suspicious
    conf: 0.99
    mbc: B0024
    attack: T1496
    all:
      - id: micro-behaviors/communications/http/services/github::github-release-api
      - id: micro-behaviors/fs/write/file/response-body::ruby-binary-response-write
      - id: micro-behaviors/data/archive/extract/tar::ruby-tar-archive-extract
      - id: micro-behaviors/process/create/shell/local::ruby-exec-local-variable
      - id: metadata/file/string/identity::xmrig-product
      - id: micro-behaviors/communications/http/url/domain::known-mining-pool-reference
