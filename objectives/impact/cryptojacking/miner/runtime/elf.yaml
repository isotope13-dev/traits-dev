defaults:
  platforms: [linux]
  for: [elf]
  attack: T1496

traits:
  - id: miner-runtime-status
    desc: Miner runtime status
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bminer\s+running\s*:'

  - id: hidden-miner-payload-fetch
    desc: Hidden miner payload fetch
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)DEBUG: \.[\w-]{1,20} (doesn|is outdated).{0,30}download needed'

  - id: miner-payload-download-success
    desc: Miner payload download success
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'DEBUG: Successfully downloaded to:'

  - id: native-miner-cli-launch-template
    desc: Pool miner launch with wallet and algorithm
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '\s-o\s+\S+\s+-u\s+\S+\s+-p\s+\S+\s+-t\s+\S+\s+--algo=\S+\s+-k\b'

  - id: cuda-driver-error
    desc: CUDA driver error string
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "CUDA driver error"

composite_rules:
  - id: hidden-miner-payload-loader
    desc: Hidden miner payload loader
    crit: hostile
    conf: 0.99
    mbc: B0018
    attack: T1496,T1105
    all:
      - id: miner-runtime-status
      - id: hidden-miner-payload-fetch
      - id: miner-payload-download-success
  - id: arm-xmrig-hidden-busybox-stage
    desc: ARM ELF embeds XMRig configuration beside hidden BusyBox staging paths
    crit: hostile
    conf: 0.98
    attack: T1496,T1564.001
    all:
      - id: metadata/arch/arm::arm
      - id: micro-behaviors/process/info/name::xmrig-product
      - id: micro-behaviors/data/config/syntax::json-pools-array-field
      - id: micro-behaviors/data/config/syntax::json-donate-level-field
      - id: micro-behaviors/fs/path/temp::var-tmp-hidden
      - id: micro-behaviors/fs/path/binary::bin-busybox-path

  - id: native-stratum-pool-miner
    desc: Native ELF Stratum miner with known pool endpoints
    crit: hostile
    conf: 0.99
    mbc: B0018
    all:
      - id: micro-behaviors/communications/socket/tcp::stratum-login-submit-workflow
      - id: micro-behaviors/communications/http/url/domain::known-mining-pool-reference

  - id: native-rootkit-backed-pool-miner
    desc: Native ELF loads a hiding kernel module and launches a known-pool miner
    crit: hostile
    conf: 0.99
    mbc: B0018
    all:
      - id: native-miner-cli-launch-template
      - id: micro-behaviors/communications/http/url/domain::known-mining-pool-reference
      - id: objectives/evasion/kernel-hide/module::forced-hiding-kernel-module-load

  - id: native-cuda-stratum-miner
    desc: Native CUDA binary speaks Stratum
    crit: hostile
    conf: 0.97
    mbc: B0018
    all:
      - id: micro-behaviors/communications/rpc::stratum-subscribe-method
      - id: cuda-driver-error

  # IoT botnets stage the stock ARM miner beside its pool URL and donate
  # flag instead of embedding a JSON config or wallet, so the config-based
  # composites miss; the staged release name plus Stratum endpoint plus
  # donate flag is still a configured miner invocation.
  - id: staged-arm-xmrig-stratum-miner
    desc: ELF stages ARM XMRig with Stratum pool and donate flag
    crit: hostile
    conf: 0.97
    mbc: B0018
    all:
      - id: well-known/app/finance/xmrig::xmrig-arm
      - id: micro-behaviors/communications/url/scheme::stratum-tcp-url
      - id: micro-behaviors/process/argument/option::xmrig-donate-level-cli-flag
