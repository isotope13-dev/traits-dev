defaults:
  platforms: [windows]
  for: [pe]
  attack: T1496,T1055
traits:
  - id: wildrig-launch-failed-diagnostic
    desc: WildRig miner launch failure diagnostic
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: WildRig launch failed
composite_rules:
  - id: xmrig-miner-injection-loader
    desc: Windows loader attempts to inject its XMRig miner payload
    crit: hostile
    conf: 0.98
    all:
      - id: well-known/app/finance/xmrig::xmrig-name
      - id: micro-behaviors/process/inject/runtime/call::xmrig-injection-diagnostic

  - id: delete-pending-image-miner-injection
    desc: XMRig injection with ghosted image concealment
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/evasion/process/injection/hollowing/process::delete-pending-image-context-redirection
      - id: micro-behaviors/process/inject/runtime/call::xmrig-injection-diagnostic

  - id: wildrig-disk-miner-launch
    desc: Loader starts an embedded WildRig GPU miner
    crit: hostile
    conf: 0.98
    attack: T1496
    all:
      - id: well-known/app/finance/wildrig::wildrig-miner-name
      - id: wildrig-launch-failed-diagnostic
