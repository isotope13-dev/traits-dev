defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1496

traits:
  - id: js-nonce-hash-prefix-check
    desc: JS leading-zero PoW hash check
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'nonce[\s\S]{0,360}hash\.startsWith\(\s*(["''`]0+["''`]|["''`]0["''`]\s*\.repeat\()'

  - id: js-mining-iterations-const
    desc: JS mining iterations const
    crit: component
    conf: 0.88
    if:
      type: text
      substr: MINING_ITERATIONS

  - id: js-iteration-window-multiply
    desc: JS iteration window multiply
    crit: component
    conf: 0.86
    if:
      type: text
      regex: 'iterations\s*\*\s*10'

  - id: js-nonce-iteration-bound
    desc: JS nonce iteration bound
    crit: component
    conf: 0.86
    if:
      type: text
      regex: 'nonce\s*<\s*.{0,50}iterations'

  # Miner thread sizing: worker threads derived by dividing the visible CPU
  # count. Legitimate pages read hardwareConcurrency for quality tiers; doing
  # arithmetic on it to size a thread pool is the miner pattern (CoinHive
  # `threads: hardwareConcurrency/N`, CryptoNight webminers alike).
  - id: js-threads-from-hardware-concurrency
    desc: Thread count assigned from CPU count
    crit: component
    conf: 0.88
    if:
      type: literal
      regex: 'threads\s*:\s*[^,}]{0,60}hardwareConcurrency'
  - id: js-hardware-concurrency-thread-use
    desc: CPU count flows into thread sizing
    crit: component
    conf: 0.88
    if:
      type: literal
      regex: 'hardwareConcurrency.{0,40}(threads|workers)'


composite_rules:
  - id: js-mining-iteration-window
    desc: JS mining iteration window
    crit: component
    conf: 0.88
    any:
      - id: js-mining-iterations-const
      - id: js-iteration-window-multiply
      - id: js-nonce-iteration-bound

  - id: js-pow-hash-miner-loop
    desc: JS proof-of-work miner loop
    crit: hostile
    conf: 0.98
    all:
      - id: js-nonce-hash-prefix-check
      - id: js-mining-iteration-window
      - id: objectives/command-and-control/dropper/execution/script-dropper::sha256-digest-hex-call
      - id: micro-behaviors/data/control-flow/loop::infinite-loop-header
    any:
      - id: micro-behaviors/os/sysinfo/cpu::node-cpu-information-query
      - id: micro-behaviors/crypto/hash/mining::mining-keyword
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern

  # Either order of the same sizing statement: `threads: <expr with
  # hardwareConcurrency>` or `hardwareConcurrency ... threads`.
  - id: js-miner-thread-count-config
    desc: Miner thread count derived from CPU count
    crit: component
    conf: 0.88
    any:
      - id: js-threads-from-hardware-concurrency
      - id: js-hardware-concurrency-thread-use

  # CPU-tuned in-page miner: a miner bootstrap beside thread sizing from the
  # visible CPU count. Either leg alone is weak (pages read core counts for
  # quality tiers; miner strings appear in writeups) -- together, in one
  # script, they state a miner sizing itself to the victim's machine.
  - id: cpu-tuned-js-miner-runtime
    desc: In-page miner tunes threads to victim CPU
    crit: hostile
    conf: 0.96
    near_bytes: 4096
    all:
      - id: objectives/impact/cryptojacking/miner/signatures::obfuscated-coinhive-miner-bootstrap
      - id: js-miner-thread-count-config
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/harness/
