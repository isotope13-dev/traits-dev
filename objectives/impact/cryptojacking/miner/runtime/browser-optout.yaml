# The start is tied to an opt-out test rather than an affirmative opt-in.
# This does not establish consent state outside the matched source snippet.
defaults:
  platforms: [linux, macos, windows]
  for: [html, javascript, typescript]
  attack: T1496

composite_rules:
  - id: coinhive-optout-gated-start
    desc: CoinHive starts under timed opt-out gate
    crit: suspicious
    conf: 0.97
    near_bytes: 512
    all:
      - id: micro-behaviors/crypto/hash/mining::coinhive-miner-variable-assignment
      - id: micro-behaviors/data/control-flow/branch::miner-optout-gated-start
