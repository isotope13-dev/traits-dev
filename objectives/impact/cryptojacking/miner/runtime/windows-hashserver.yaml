# HashServer / "mainer" Delphi clients download a miner payload over HTTP,
# tag the control flow with [download_mainer]/[CPUMiner_start], and talk to
# hs-fileserver / hashserver*.tmweb.ru update hosts. Strings are typically
# UTF-16 and only visible after UPX unpack.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1496
  mbc: B0018
  crit: suspicious
  conf: 0.94

traits:
  - id: start-downloading-miner-status
    desc: Miner payload download status string
    if:
      type: text
      exact: Start downloading miner...

  - id: download-mainer-control-tag
    desc: HashServer download_mainer control tag
    conf: 0.96
    if:
      type: text
      exact: '[download_mainer]'

  - id: cpuminer-start-control-tag
    desc: HashServer CPUMiner_start control tag
    conf: 0.96
    if:
      type: text
      exact: '[CPUMiner_start]'

  - id: loading-files-miner-zip-status
    desc: Zip miner download status string
    if:
      type: text
      exact: '  The loading files miner (zip)...'

  - id: hs-fileserver-token-key-url
    desc: HashServer token.key distribution URL
    crit: notable
    conf: 0.97
    attack: T1071.001
    if:
      type: text
      regex: 'https?://hs-fileserver\.info/token\.key'

  - id: hashserver-hs-svc-download-url
    desc: HashServer HS_Svc.exe download URL
    crit: notable
    conf: 0.97
    attack: T1105
    if:
      type: text
      regex: 'https?://hashserver\d*\.tmweb\.ru/.{0,64}HS_Svc\.exe'

composite_rules:
  - id: hashserver-http-miner-loader
    desc: HashServer downloads and starts miner payload
    crit: hostile
    conf: 0.98
    all:
      - id: start-downloading-miner-status
      - id: download-mainer-control-tag
    any:
      - id: cpuminer-start-control-tag
      - id: loading-files-miner-zip-status
      - id: hs-fileserver-token-key-url
      - id: hashserver-hs-svc-download-url
