defaults:
  platforms:
  - linux
  - macos
  - windows
  for: [scripts, pe, elf, macho]
traits:
- id: noofthreads-cli-help
  desc: noOfThreads miner CLI help text
  crit: notable
  conf: 0.85
  if:
    type: text
    exact: The parameter [noOfThreads] is optional. When omitted it will use as many threads as there are logical cores in the system.
- id: noofthreads-token
  desc: noOfThreads command-line parameter token
  crit: notable
  conf: 0.7
  if:
    type: text
    exact: '[noOfThreads]'
- id: boost-asio-win-iocp
  desc: Boost.Asio Windows IOCP runtime marker
  crit: notable
  conf: 0.75
  if:
    type: text
    word: boost::asio::detail::win_iocp_io_context
- id: xmrig-pool-command-argument
  desc: XMRig command supplies a pool endpoint
  crit: suspicious
  conf: 0.95
  for: [scripts, binaries, c, cpp, csharp, go, rust]
  if:
    type: text
    regex: '(?i)\bxmrig(\.exe)?\b[^\r\n]{0,200}\s-o\s+\S{1,120}:\d{2,5}\b'
- id: xmrig-wallet-command-argument
  desc: XMRig command supplies a wallet
  crit: suspicious
  conf: 0.95
  for: [scripts, binaries, c, cpp, csharp, go, rust]
  if:
    type: text
    regex: '(?i)\bxmrig(\.exe)?\b[^\r\n]{0,360}\s-u\s+[A-Za-z0-9]{40,}\b'
# `go.runtime` is a language-runtime marker (see metadata/lang/compiled),
# not a cryptojacking signal; do not reintroduce it under this objective.
composite_rules:
- id: xmrig-configured-command-line
  desc: XMRig command supplies pool and wallet
  crit: suspicious
  conf: 0.98
  attack: T1496
  all:
  - id: xmrig-pool-command-argument
  - id: xmrig-wallet-command-argument
  near_bytes: 512
- id: browser-stratum-worker-miner
  desc: Browser workers run a wallet-configured Stratum miner
  crit: hostile
  conf: 0.99
  mbc: B0018
  attack: T1496
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/crypto/hash/mining::browser-miner-worker-wallet-fields
  - id: micro-behaviors/communications/socket/tcp::stratum-extranonce-field
  - id: micro-behaviors/process/create/workers::browser-worker-constructor
  - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
- id: browser-xelis-stratum-miner
  desc: Browser workers run a Xelis Stratum miner
  crit: hostile
  conf: 0.995
  mbc: B0018
  attack: T1496
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/crypto/hash/mining::xelis-miner-constructor-call
  - id: micro-behaviors/process/create/workers::browser-worker-constructor
  - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
  - id: micro-behaviors/communications/socket/tcp::stratum-mining-methods
- id: browser-xelis-wasm-miner
  desc: Browser worker runs Xelis proof-of-work miner
  crit: hostile
  conf: 0.995
  mbc: B0018
  attack: T1496
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/crypto/hash/mining::wasm-mining-batch-api
  - id: micro-behaviors/crypto/hash/mining::xelis-proof-of-work-api
  - id: micro-behaviors/process/interpreter/wasm::webassembly-instantiate
  - id: micro-behaviors/process/create/workers::browser-worker-constructor
  - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
  - id: micro-behaviors/communications/socket/tcp::stratum-mining-methods
- id: gpu-hashrate
  desc: GPU framework with hashrate
  all:
  - id: micro-behaviors/hardware/gpu/
  - id: micro-behaviors/os/sysinfo/performance/metrics::hashrate-reference
- id: hugepages-or-threads
  desc: Hugepages or worker-thread configuration
  any:
  - id: micro-behaviors/os/sysinfo/performance/metrics::hugepages-reference
  - id: micro-behaviors/process/create/workers::worker-thread-count-setting
- id: thread-tuned-worker-runtime
  crit: notable
  desc: Thread-tuned worker runtime markers
  needs: 2
  any:
  - id: noofthreads-cli-help
  - id: noofthreads-token
  - id: micro-behaviors/process/create/workers::worker-thread-label
- id: asio-winsock-runtime
  crit: notable
  desc: Boost.Asio IOCP with Winsock initialization
  all:
  - id: boost-asio-win-iocp
  - id: micro-behaviors/communications/socket/init::wsa-startup
- id: mining-config
  desc: Mining configuration with context
  all:
  - id: hugepages-or-threads
  - id: objectives/impact/cryptojacking/miner/signatures::mining-marker
- id: hardware-mining
  desc: Hardware mining configuration
  crit: suspicious
  conf: 0.8
  attack: T1496
  any:
  - id: gpu-hashrate
  - id: mining-config
  unless:
  - id: micro-behaviors/dylib/library/family/
- id: threaded-asio-miner
  desc: Windows threaded cryptominer runtime profile
  crit: suspicious
  conf: 0.9
  attack: T1496
  all:
  - id: noofthreads-cli-help
  - id: boost-asio-win-iocp
  - id: micro-behaviors/communications/socket/init::ws2-32-dll-marker
- id: xmrig-with-windows-defense-lockout
  desc: Launches a configured XMRig miner after disabling Defender and Windows Update
  crit: hostile
  conf: 0.995
  attack: T1496,T1562.001
  all:
  - id: xmrig-configured-command-line
  - id: objectives/evasion/anti-av/platform/defender::defender-broad-path-and-binary-extension-exclusions
  - id: objectives/impact/degrade/update::windows-update-multi-control-lockout
