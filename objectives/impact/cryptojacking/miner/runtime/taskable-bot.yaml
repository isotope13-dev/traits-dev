# Pool/config fields alone are normal miner functionality. Here the native
# packet-attack bot's task dispatcher also reports launching a miner.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1496
composite_rules:
  - id: taskable-bot-miner-launch
    desc: Packet-attack bot launches a pool-configured miner
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/botnet/dispatch::text-tasked-packet-attack-bot
      - id: micro-behaviors/communications/blockchain/mining::miner-process-start-status
      - id: micro-behaviors/communications/blockchain/mining::json-donate-level-field
      - id: micro-behaviors/data/config/syntax::json-pools-array-field
