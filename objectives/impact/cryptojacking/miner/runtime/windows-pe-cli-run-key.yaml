defaults:
  platforms: [windows]
  for: [pe]
  attack: T1496
  mbc: B0004

traits:
  - id: pool-url-wallet-user-arguments
    desc: Miner pool URL and wallet arguments
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '-o stratum\+(tcp|ssl)://[^ ]{4,60} .{0,16}-u [A-Za-z0-9]{30,}'

composite_rules:
  - id: windows-miner-cli-run-key-dropper
    desc: Windows miner command line with Run-key persistence
    crit: hostile
    conf: 0.93
    all:
      - id: pool-url-wallet-user-arguments
      - id: micro-behaviors/os/registry/autostart/write::reg-add-run-command
      - id: micro-behaviors/communications/url/scheme::stratum-tcp-url
