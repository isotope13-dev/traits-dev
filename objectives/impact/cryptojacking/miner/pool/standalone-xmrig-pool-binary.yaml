# A stock XMRig binary that carries a Stratum pool endpoint and its donation banner.
# The official XMRig release is open source and ships with donation and a placeholder
# wallet, so the identity, the pool endpoint, and the donate banner show a configured
# miner, not unauthorized use. The family rules keep product identity notable for the
# same reason. Only a compiled-in operator wallet makes the use unauthorized, and that
# is the job of the worker composites. Keep this composite at suspicious.
defaults:
  platforms: [unix, windows]
  for: [elf, pe, macho]
  attack: T1496

composite_rules:
  - id: standalone-stratum-pool-endpoint
    desc: Stratum pool URL in either TCP or TLS transport
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/url/scheme::stratum-tcp-url
      - id: micro-behaviors/communications/url/scheme::stratum-ssl-url

  - id: standalone-xmrig-pool-miner
    desc: Standalone XMRig binary with Stratum pool endpoint and donate banner
    crit: suspicious
    conf: 0.8
    scope: file
    all:
      - id: well-known/app/finance/xmrig::xmrig-product
      - id: objectives/impact/cryptojacking/miner/pool::standalone-stratum-pool-endpoint
      - id: well-known/app/finance/xmrig::xmrig-dev-donate-banner
