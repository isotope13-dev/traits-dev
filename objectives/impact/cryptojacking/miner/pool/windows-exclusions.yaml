defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # Mining options alone describe ordinary miners. This installer also hides
  # its policy-bypassing launcher, exempts processes from Defender, extracts
  # executables and registers logon activation.
  - id: concealed-randomx-miner-logon-exclusions
    desc: Hidden miner with exclusions and logon tasks
    crit: hostile
    conf: 0.97
    attack: T1496,T1562.001,T1053.005
    all:
      - id: micro-behaviors/process/argument/option::xmrig-algo-randomx-option
      - id: micro-behaviors/os/security/defender::defender-exclusion-process
      - id: objectives/evasion/security-bypass/policy/execution::pe-concealed-policy-override-profile
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive-text
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-logon-trigger
      - id: micro-behaviors/process/create/spawn::create-process-w
