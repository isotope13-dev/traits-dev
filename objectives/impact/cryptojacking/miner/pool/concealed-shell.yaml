# Command arguments are captured separately: a prose string containing flags
# is not a configured miner invocation. Equivalent option forms share one rule.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1496
traits:
  - id: dotfile-pool-wallet-command
    desc: Dotfile command receives pool and wallet
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((command name: (command_name) @image
          argument: (_) @pool
          argument: (_) @wallet) @miner
          (#match? @image "(^|/)\\.[A-Za-z0-9_-][A-Za-z0-9_.-]*[\"']?$")
          (#match? @pool "^--url=[\"']?[^ \\t]{1,160}:\\d{1,5}[\"']?$")
          (#match? @wallet "^--user=[\"']?4[A-Za-z0-9]{94}[\"']?$"))
        ((command name: (command_name) @image
          argument: (_) @wallet
          argument: (_) @pool) @miner
          (#match? @image "(^|/)\\.[A-Za-z0-9_-][A-Za-z0-9_.-]*[\"']?$")
          (#match? @pool "^--url=[\"']?[^ \\t]{1,160}:\\d{1,5}[\"']?$")
          (#match? @wallet "^--user=[\"']?4[A-Za-z0-9]{94}[\"']?$"))
        ((command name: (command_name) @image
          argument: (_) @pool_flag
          . argument: (_) @pool
          argument: (_) @wallet_flag
          . argument: (_) @wallet) @miner
          (#match? @image "(^|/)\\.[A-Za-z0-9_-][A-Za-z0-9_.-]*[\"']?$")
          (#match? @pool_flag "^(-o|--url)$")
          (#match? @wallet_flag "^(-u|--user)$")
          (#match? @pool "^[\"']?[^ \\t]{1,160}:\\d{1,5}[\"']?$")
          (#match? @wallet "^[\"']?4[A-Za-z0-9]{94}[\"']?$"))
        ((command name: (command_name) @image
          argument: (_) @wallet_flag
          . argument: (_) @wallet
          argument: (_) @pool_flag
          . argument: (_) @pool) @miner
          (#match? @image "(^|/)\\.[A-Za-z0-9_-][A-Za-z0-9_.-]*[\"']?$")
          (#match? @pool_flag "^(-o|--url)$")
          (#match? @wallet_flag "^(-u|--user)$")
          (#match? @pool "^[\"']?[^ \\t]{1,160}:\\d{1,5}[\"']?$")
          (#match? @wallet "^[\"']?4[A-Za-z0-9]{94}[\"']?$"))

composite_rules:
  - id: staged-dotfile-pool-miner-launch
    desc: Staged dotfile miner runs in background
    crit: hostile
    conf: 0.98
    attack: T1496,T1564.001
    all:
      - id: dotfile-pool-wallet-command
      - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
      - id: micro-behaviors/communications/http/client/response-body::http-response-acquisition
    any:
      - id: micro-behaviors/process/create/background::subshell-detached-output-discarded
      - id: micro-behaviors/process/daemonize/detach::background-ampersand-hidden
