defaults:
  platforms: [linux]
  for: [shell]
  attack: T1195.002
composite_rules:
  - id: pkgbuild-build-phase-miner-launch
    desc: PKGBUILD build phase launches XMRig at a Stratum pool
    crit: hostile
    conf: 0.99
    attack: T1496,T1195.002
    all:
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-build-fn
      - id: micro-behaviors/communications/blockchain/mining::shell-xmrig-invocation
      - id: micro-behaviors/communications/url/scheme::stratum-tcp-url
      - id: "micro-behaviors/fs/chmod/executable/mode::install-owner-execute-mode-option"
    unless:
      - id: well-known/tool/detection/security-scanner-identity::ks-aur-test-or-crate-member
