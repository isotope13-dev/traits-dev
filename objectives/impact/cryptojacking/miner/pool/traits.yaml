defaults:
  mbc: B0018
  platforms:
  - linux
  - macos
  - windows
  for: [scripts, pe, elf, macho]
traits:
composite_rules:
- id: ruby-xmrig-pool-launcher
  for: [ruby]
  desc: Ruby launches XMRig against a mining pool
  crit: hostile
  conf: 0.99
  attack: T1496
  all:
  - id: metadata/file/string/identity::xmrig-product
  - id: micro-behaviors/communications/http/url/domain::known-mining-pool-reference
  - id: micro-behaviors/process/create/shell/lang::ruby-exec
  - id: micro-behaviors/process/create/system::system-process-call
# A script that downloads a remote payload over HTTP and immediately
# executes it while naming a known mining pool is a miner-setup dropper:
# the pool reference proves what the payload is for, and the silent
# download-and-run proves nobody was asked. This generalizes past any one
# pool or setup path — any known-pool domain plus a scripted fetch-and-run
# convicts the next campaign too.
- id: miner-setup-download-exec
  desc: Mining-pool setup fetched and executed
  crit: hostile
  conf: 0.97
  attack: T1496,T1105
  for: [powershell, batch]
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
  - id: micro-behaviors/process/interpreter/powershell/command::embedded-powershell-command
  - id: micro-behaviors/communications/http/url/domain::known-mining-pool-reference