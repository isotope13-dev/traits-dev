defaults:
  mbc: B0018
  platforms:
  - linux
  - macos
  - windows
  for: [scripts, pe, elf, macho]
traits:
composite_rules:
- id: xmrig-concealed-recurring-miner
  desc: XMRig mining against a pool hidden behind recurring cron persistence
  crit: hostile
  conf: 0.98
  attack: T1496,T1053.003
  for: [elf]
  all:
  - id: well-known/app/finance/xmrig::xmrig-dev-donate-banner
  - id: micro-behaviors/crypto/hash/mining::algorithm-stratum-known-pool
  - id: objectives/persistence/system/cron/job::concealed-crontab-recurring-relaunch
- id: ruby-xmrig-pool-launcher
  for: [ruby]
  desc: Ruby launches XMRig against a mining pool
  crit: hostile
  conf: 0.99
  attack: T1496
  all:
  - id: micro-behaviors/process/info/name::xmrig-product
  - id: micro-behaviors/communications/http/url/domain::known-mining-pool-reference
  - id: micro-behaviors/process/create/shell/lang::ruby-exec
  - id: micro-behaviors/process/create/system::system-process-call
# A script that downloads a remote payload over HTTP and immediately
# executes it while naming a known mining pool is a miner-setup dropper:
# the pool reference proves what the payload is for, and the silent
# download-and-run proves nobody was asked. This generalizes past any one
# pool or setup path — any known-pool domain plus a scripted fetch-and-run
# convicts the next campaign too.
- id: miner-setup-download-exec
  desc: Mining-pool setup fetched and executed
  crit: hostile
  conf: 0.97
  attack: T1496,T1105
  for: [powershell, batch]
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
  - id: micro-behaviors/process/create/shell/command-flag::powershell-command-text
  - id: micro-behaviors/communications/http/url/domain::known-mining-pool-reference
# Unix script twin of the setup above: a temp-path binary is launched
# detached (setsid/nohup, so it outlives the installer) with a miner
# pool endpoint (`-o host:port`) on its command line, corroborated by a
# known pool domain or a wallet argument. The detached temp launch is
# the covert execution role and the pool endpoint is the mining role;
# neither a visible, user-run miner nor a generic temp dropper without
# pool arguments satisfies both.
- id: temp-miner-pool-detached-launch
  desc: Detached temp binary launched against mining pool
  crit: hostile
  conf: 0.97
  attack: T1496,T1105
  for: [python, shell]
  platforms: [linux, macos]
  near_lines: 20
  all:
  - id: micro-behaviors/process/argument/option::miner-pool-endpoint-option
  - id: micro-behaviors/process/create/local-exec::detached-temp-path-launch
  any:
  - id: micro-behaviors/communications/http/url/domain::known-mining-pool-reference
  - id: micro-behaviors/process/argument/option::miner-wallet-user-option
  needs: 1
# PowerShell Start-Process argument arrays quote "-o","stratum+tcp://...",
# so the whitespace -o pool flag does not match. The installer is the hidden,
# policy-bypassing download and zip extract sitting next to that Stratum URL.
- id: pe-hidden-powershell-stratum-installer
  desc: Hidden PowerShell installs a Stratum miner
  crit: hostile
  conf: 0.97
  attack: T1496,T1105
  for: [pe]
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/url/scheme::stratum-tcp-url
  - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
  - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive-text
  - id: micro-behaviors/process/argument/option::powershell-hidden-command-text
  - id: micro-behaviors/os/security/policy::powershell-policy-bypass-text
