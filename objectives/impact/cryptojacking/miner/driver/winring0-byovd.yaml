# A cryptominer that bundles the WinRing0 MSR kernel driver to reach the CPU's
# model-specific registers for extra hashrate. WinRing0 is itself a legitimate
# hardware-monitor driver, so the hostile reading comes only from pairing it
# with miner context (an XMRig build, a known mining pool, or a miner pool
# option). Reusable across XMRig campaigns that stage WinRing0x64.sys next to
# the miner payload, regardless of the loader language.
defaults:
  platforms: [windows]
  for: [scripts, binaries, c, cpp, csharp, go, rust, python]
  attack: T1496,T1068
  mbc: B0004
composite_rules:
  - id: winring0-miner-driver-load
    desc: Miner bundles WinRing0 MSR driver
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/kernel/driver::winring0-driver-reference
    any:
      - id: well-known/app/finance/xmrig::xmrig-name
      - id: micro-behaviors/communications/http/url/domain::known-mining-pool-reference
      - id: objectives/impact/cryptojacking/miner/config::miner-pool-endpoint-option
      - id: micro-behaviors/crypto/hash/mining::mining-software-or-stratum-reference
