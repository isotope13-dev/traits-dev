defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, powershell, pe, elf]
  attack: T1496
  mbc: B0004
traits:
- id: cpu-usage-limit-str
  desc: CPU usage limit string
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: (?i)cpu.{0,4}(usage|percent).{0,24}(limit|throttle)
- id: pause-if-cpu-str
  desc: Pause-if CPU string
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: (?i)pause.?if.{0,24}cpu
- id: initengine-rundll-dispatch-format
  desc: InitEngine rundll dispatch format string
  crit: notable
  conf: 0.92
  for: [pe]
  if:
    type: text
    substr: 'InitEngine'
composite_rules:
- id: cpu-usage-str
  desc: CPU usage monitoring string
  crit: notable
  conf: 0.6
  any:
  - id: cpu-usage-limit-str
  - id: pause-if-cpu-str
# Names alone may be pause targets or a process catalog. Require the
# independent Task Manager termination workflow before inferring abuse.
- id: smart-miner
  for: [powershell]
  desc: Mining code with Task Manager termination
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/crypto/hash/mining::mining-software-or-stratum-reference
  - id: micro-behaviors/process/debug/tool-markers::monitoring-tool-name-cluster
  - id: micro-behaviors/process/terminate/command::script-taskkill-taskmgr
- id: miner-evasion-service-watchdog
  desc: Watchdog conceals or protects miner against process monitoring tools
  crit: hostile
  conf: 0.96
  attack: T1496,T1562.001
  for: [powershell]
  all:
  - id: objectives/anti-analysis/tool-detect/process::taskmgr-query-service-stop-start
  any:
  - id: micro-behaviors/process/info/name::xmrig-product
  - id: micro-behaviors/crypto/hash/mining::mining-software-or-stratum-reference
- id: activity-aware-miner
  desc: Activity-aware cryptocurrency miner
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/crypto/hash/mining::mining-software-or-stratum-reference
  - id: micro-behaviors/hardware/input/idle-time::user-input-idle-query
  unless:
  - id: well-known/app/finance/xmrig::xmrig-name
# XMRig implementation and embedded images are independently reported by
# their canonical identity/layout traits. Neither establishes unauthorized
# mining, even when both occur in the same carrier.
# A binary that implements the miner itself: Stratum protocol methods and an
# XMRig pool configuration in one ELF/PE/Mach-O image. This proves mining
# capability but not unauthorized use; legitimate miners have the same code.
#
# Worked example: the trojanized kong-ingress-controller `manager`, whose
# embedded ELF carries stratum authorize/subscribe/submit methods beside an
# xmrig pools config.
- id: stratum-method-and-xmrig-pools-binary
  desc: Binary implements Stratum with XMRig pool configuration
  crit: suspicious
  conf: 0.96
  mbc: F0006.003
  for: [elf, macho, pe]
  all:
  - id: micro-behaviors/communications/rpc::stratum-subscribe-method
  - id: micro-behaviors/data/config/syntax::json-pools-array-field
# The miner image doubles as a carrier: a base64-embedded PowerShell stage
# switches AMSI off and downloads a payload with WebClient next to the XMRig
# pool configuration. A stock miner has no reason to bypass the scan interface
# or fetch a second executable; this is a trojanized or repackaged miner.
- id: xmrig-miner-embedded-amsi-bypass-downloader
  desc: XMRig image embeds an AMSI bypass and downloader
  crit: hostile
  conf: 0.95
  attack: T1496,T1562.001,T1105
  mbc: F0006.003
  for: [pe]
  all:
  - id: micro-behaviors/data/config/syntax::json-pools-array-field
  - id: objectives/evasion/anti-av/amsi::base64-amsi-init-failed-field
  - id: objectives/evasion/anti-av/amsi::base64-amsiutils-type-name
  - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
  unless:
    # Parser-library malware-fixture corpora (saferwall/pe test/): the
    # specimen is inert test data, not an active miner.
    - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
