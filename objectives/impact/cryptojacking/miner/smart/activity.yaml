defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, powershell, pe, elf]
  attack: T1496
  mbc: B0004
traits:
  - id: cpu-usage-limit-str
    desc: CPU usage limit string
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: (?i)cpu.{0,4}(usage|percent).{0,24}(limit|throttle)
  - id: pause-if-cpu-str
    desc: Pause-if CPU string
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: (?i)pause.?if.{0,24}cpu
  - id: initengine-rundll-dispatch-format
    desc: InitEngine rundll dispatch format string
    crit: notable
    conf: 0.92
    for: [pe]
    if:
      type: text
      substr: 'InitEngine'
composite_rules:
  - id: cpu-usage-str
    desc: CPU usage monitoring string
    crit: notable
    conf: 0.6
    any:
      - id: cpu-usage-limit-str
      - id: pause-if-cpu-str
  - id: monitoring-tool-checks
    desc: System monitoring tool detection
    crit: suspicious
    conf: 0.85
    needs: 3
    any:
      - id: micro-behaviors/process/info/name::taskmgr-process
      - id: objectives/anti-analysis/tool-detect/process::procexp-process
      - id: objectives/anti-analysis/tool-detect/process::procmon-process
      - id: micro-behaviors/fs/path/application/executable::perfmon-process
      - id: micro-behaviors/fs/path/application/executable::resmon-process
    downgrade:
      any:
        - id: metadata/binary/resource/
  - id: smart-miner
    desc: Smart cryptocurrency miner with evasion
    crit: hostile
    conf: 0.95
    all:
    - id: micro-behaviors/crypto/hash/mining::mining-software-or-stratum-reference
    - id: monitoring-tool-checks
  - id: activity-aware-miner
    desc: Activity-aware cryptocurrency miner
    crit: hostile
    conf: 0.95
    all:
    - id: micro-behaviors/crypto/hash/mining::mining-software-or-stratum-reference
    - id: micro-behaviors/hardware/input/idle-time::user-input-idle-query
  - id: embedded-multi-pe-cryptonight-carrier
    desc: Carrier embeds multiple PEs alongside XMRig CryptoNight miner
    crit: hostile
    conf: 0.98
    attack: T1496,T1027.009
    for: [pe]
    all:
      - id: well-known/app/finance/xmrig::cryptonight-implementation
      - id: metadata/binary/layout/embedded::embedded-pe-multi
# A binary that implements the miner itself: Stratum protocol methods and an
# XMRig pool configuration in one ELF/PE/Mach-O image. This proves mining
# capability but not unauthorized use; legitimate miners have the same code.
#
# Worked example: the trojanized kong-ingress-controller `manager`, whose
# embedded ELF carries stratum authorize/subscribe/submit methods beside an
# xmrig pools config.
  - id: stratum-method-and-xmrig-pools-binary
    desc: Binary implements Stratum with XMRig pool configuration
    crit: suspicious
    conf: 0.96
    mbc: F0006.003
    for: [elf, macho, pe]
    all:
      - id: micro-behaviors/communications/socket/tcp::stratum-subscribe-method
      - id: micro-behaviors/crypto/hash/mining::xmrig-config-pools
