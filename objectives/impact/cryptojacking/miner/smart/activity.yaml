defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, powershell, pe, elf]
  attack: T1496
  mbc: B0004
traits:
  - id: get-last-input-info
    desc: GetLastInputInfo API (idle detection)
    crit: component
    conf: 0.7
    for: [powershell, pe, python, javascript]
    if:
      type: text
      substr: GetLastInputInfo
  - id: get-idle-time
    desc: GetIdleTime function
    crit: component
    conf: 0.7
    if:
      type: text
      regex: (?i)\bget.?idle.?time\b
  - id: xmrig-str
    desc: XMRig miner reference
    crit: suspicious
    conf: 0.9
    count_min: 2
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/tool/detection/innerwarden::innerwarden-defensive-tool-context
    if:
      id: metadata/file/string/identity::xmrig-product
  - id: monero-stratum-endpoint
    desc: Monero Stratum pool endpoint
    crit: suspicious
    conf: 0.75
    if:
      type: text
      regex: '(?i)stratum(\+\w+)?://[^\n"'']{0,40}pool\.monero\b'
  - id: nicehash-stratum-endpoint
    desc: NiceHash Stratum pool endpoint
    crit: suspicious
    conf: 0.75
    if:
      type: text
      regex: '(?i)stratum(\+\w+)?://[^\n"'']{0,40}nicehash\.com\b'
  - id: 2miners-stratum-endpoint
    desc: 2Miners Stratum pool endpoint
    crit: suspicious
    conf: 0.75
    if:
      type: text
      regex: '(?i)stratum(\+\w+)?://[^\n"'']{0,40}2miners\.com\b'
  - id: cpu-usage-limit-str
    desc: CPU usage limit string
    crit: component
    conf: 0.6
    if:
      type: text
      regex: (?i)cpu.{0,4}(usage|percent).{0,24}(limit|throttle)
  - id: pause-if-cpu-str
    desc: Pause-if CPU string
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: (?i)pause.?if.{0,24}cpu
composite_rules:
  - id: cpu-usage-str
    desc: CPU usage monitoring string
    crit: notable
    conf: 0.6
    any:
      - id: cpu-usage-limit-str
      - id: pause-if-cpu-str
  - id: monitoring-tool-checks
    desc: System monitoring tool detection
    crit: suspicious
    conf: 0.85
    needs: 3
    any:
      - id: micro-behaviors/fs/path/application/executable::taskmgr-process
      - id: objectives/anti-analysis/tool-detect/process::procexp-process
      - id: objectives/anti-analysis/tool-detect/process::procmon-process
      - id: micro-behaviors/fs/path/application/executable::perfmon-process
      - id: micro-behaviors/fs/path/application/executable::resmon-process
    downgrade:
      any:
        - id: metadata/binary/resource/
  - id: activity-monitoring
    desc: User activity monitoring
    crit: notable
    conf: 0.8
    unless:
      - id: metadata/package/quality/benign-context::stacksjs-stx-framework-context
    any:
      - id: get-last-input-info
      - id: get-idle-time
  - id: mining-indicators
    desc: Cryptocurrency mining indicators
    crit: suspicious
    conf: 0.9
    any:
      - id: xmrig-str
      - id: micro-behaviors/communications/socket/tcp::stratum-tcp-url
      - id: micro-behaviors/communications/socket/tcp::stratum-ssl-url
      - id: monero-stratum-endpoint
      - id: known-pool-stratum-endpoint
      - id: objectives/impact/cryptojacking/miner/pool::known-pool-domains
    downgrade:
      any:
        - id: metadata/package/testing/presence/fixture::mocha-describe-call
        - id: metadata/package/testing/presence/harness/
    unless:
      - id: well-known/app/ai/knowledge/animica::animica-stratum-pool-context
      # A DNS-filter blocklist names pools to block them; the pool-domain leg
      # above then carries no mining intent on its own.
      - id: metadata/file/catalog/identity::bulk-domain-blocklist
  - id: known-pool-stratum-endpoint
    desc: Known mining-pool Stratum endpoint
    crit: suspicious
    conf: 0.75
    any:
      - id: nicehash-stratum-endpoint
      - id: 2miners-stratum-endpoint
  - id: smart-miner
    desc: Smart cryptocurrency miner with evasion
    crit: hostile
    conf: 0.95
    all:
      - id: mining-indicators
      - id: monitoring-tool-checks
  - id: activity-aware-miner
    desc: Activity-aware cryptocurrency miner
    crit: hostile
    conf: 0.95
    all:
      - id: mining-indicators
      - id: activity-monitoring
  - id: xmrig-cryptonight-miner
    desc: XMRig CryptoNight miner implementation
    crit: suspicious
    conf: 0.97
    all:
      - id: xmrig-str
      - id: micro-behaviors/crypto/hash/mining::cryptonight-str
    any:
      - id: micro-behaviors/communications/socket/tcp::stratum-ssl-url
      - id: micro-behaviors/crypto/hash/mining::xmrig-config-donate-level
      - id: micro-behaviors/crypto/hash/mining::cn-v8
    needs: 1
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: trojanized-xmrig-powershell-downloader
    desc: XMRig embeds PowerShell download-and-run stage
    crit: hostile
    conf: 0.99
    all:
      - id: xmrig-cryptonight-miner
      - id: objectives/command-and-control/dropper/delivery/embedded-powershell::pe-embedded-powershell-download-execute
