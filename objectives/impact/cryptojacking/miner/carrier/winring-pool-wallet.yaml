defaults:
  platforms: [windows]
  for: [pe]
  attack: T1496

composite_rules:
  - id: windows-carrier-xmrig-winring-pool-wallet
    desc: Carrier ships WinRing0 with configured XMRig pool and wallet CLI
    crit: hostile
    conf: 0.98
    # Setup batches carry the pool and wallet CLI; WinRing0.sys is a sibling
    # member. pe-only file scope never saw both. Archive scope keeps them
    # together without pairing an unrelated driver and script.
    for: [pe, batch]
    scope: archive
    all:
      - id: micro-behaviors/process/argument/option::miner-pool-wallet-option-pair
      - id: micro-behaviors/os/kernel/driver::winring0-driver-reference
      - id: well-known/app/finance/xmrig::xmrig-product
