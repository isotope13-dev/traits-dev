defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: winrar-sfx-silent-batch-cryptominer
    desc: Silent WinRAR SFX batch launches miner with pooled wallet
    crit: hostile
    conf: 0.97
    scope: outer
    for: [pe, batch]
    attack: T1204.002,T1496
    all:
      - id: well-known/tool/sysadmin/winrar-sfx::winrar-sfx
      - id: micro-behaviors/ui/window/suppression::sfx-silent-raw-directive
      - id: micro-behaviors/process/config/installer::sfx-setup-batch-script
      - id: micro-behaviors/data/format/crypto-address::hardcoded-monero-address
      - id: micro-behaviors/process/argument/option::miner-pool-endpoint-option

  - id: batch-monero-miner-release-dropper
    desc: Batch script downloads and configures Monero miner with wallet and pool
    crit: hostile
    conf: 0.98
    for: [batch, powershell, scripts]
    attack: T1496,T1105
    all:
      - id: micro-behaviors/data/format/crypto-address::hardcoded-monero-address
      - id: well-known/app/finance/xmrig::xmrig-product
    any:
      - id: micro-behaviors/communications/url/host/domain-http::known-mining-pool-reference
      - id: micro-behaviors/communications/url/host/domain-http::pool-host-with-port
      - id: micro-behaviors/communications/url/scheme::stratum-tcp-url
      - id: micro-behaviors/data/config/syntax::json-pools-array-field

