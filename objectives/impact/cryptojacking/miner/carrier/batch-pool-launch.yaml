defaults:
  for: [batch]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: random-pool-selection
    desc: Batch calculates a random selection
    if:
      type: text
      regex: '(?im)^\s*set\s+/a\s+\w+=%random%'
  - id: pool-file-selection
    desc: Batch selects pool from numbered lines
    if:
      type: text
      regex: '(?i)\bfindstr\s+/n\s+"\^"[^\r\n]{0,120}\bset\s+"?pool='
  - id: disguised-pool-launch
    desc: Windows Update named pool client launch
    if:
      type: text
      regex: '(?im)^\s*windowsupdate\.exe\s+-o\s+%pool%\s+-p\s+%username%'
  - id: geographic-worker-name
    desc: Batch combines location and username
    if:
      type: text
      regex: '(?im)^\s*set\s+username=%geo%-%username%'

composite_rules:
  - id: disguised-random-pool-launch
    desc: Disguised pool client uses randomized configuration
    crit: hostile
    conf: 0.97
    all:
      - id: random-pool-selection
      - id: pool-file-selection
      - id: disguised-pool-launch
      - id: geographic-worker-name
