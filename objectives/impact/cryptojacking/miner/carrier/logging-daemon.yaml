# Logging daemons do not take mining pool arguments. Combining that
# invocation with nearby download and executable staging establishes abuse,
# without depending on a campaign URL, path, wallet or payload filename.
defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: downloaded-logging-daemon-miner
    desc: Downloaded miner runs disguised as a logging daemon
    crit: hostile
    conf: 0.98
    attack: T1496,T1036.004,T1105
    near_lines: 5
    all:
      - id: objectives/evasion/masquerade/process/miner::logging-daemon-stratum-command
      - id: micro-behaviors/communications/http/download/
      - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
