# A Go binary that carries XMRig as a Base64 ELF and can create an anonymous
# memfd mines from memory on every host it runs on. The trojaned Kong Ingress
# Controller 3.4.0 image (2025) decoded an 8 MB XMRig 6.22.2 in a goroutine
# started from manager.Run, wrote it to memfd_create("") and executed
# /proc/<pid>/fd/<n>. Go's linker drops uncalled functions, so a live
# MemfdCreate reference is a real call path.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1496,T1620,T1027

composite_rules:
  - id: go-memfd-launched-base64-xmrig
    desc: Go binary memfd-loads a Base64-embedded XMRig image
    crit: hostile
    conf: 0.97
    mbc: B0018
    all:
      - id: micro-behaviors/data/embedded/payload/elf-native::base64-embedded-elf-image
      - id: micro-behaviors/mem/anonymous/create::memfd-create-go
      - id: micro-behaviors/data/embedded/payload/elf-native::base64-encoded-xmrig-donate-host
      - id: micro-behaviors/data/embedded/payload/elf-native::base64-encoded-donate-level-key
