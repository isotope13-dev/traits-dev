# A script that downloads the stock XMRig release and carries both a public
# pool and a Monero wallet is a cryptojacking dropper: the machine it runs on
# mines for whoever hardcoded the wallet. @rspack/core 1.1.7 (2024) fetched
# xmrig-6.22.2-linux-static-x64 from GitHub, renamed it /tmp/vant_helper and
# ran it against pool.supportxmr.com:443. Release version, pool and wallet are
# attacker-chosen; an obfuscator string table scatters them, so no proximity
# bound is set.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  attack: T1496,T1105

composite_rules:
  - id: script-fetches-xmrig-for-hardcoded-wallet
    desc: Script downloads XMRig and mines to a hardcoded pool and Monero wallet
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/download/release::xmrig-release-download-url
      - id: micro-behaviors/communications/url/host/domain-http::known-mining-pool-reference
      - id: micro-behaviors/data/format/crypto-address::hardcoded-monero-address
