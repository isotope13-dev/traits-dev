# An npm package whose install hook ships JavaScript configured to mine to
# a hardcoded Monero wallet on a public pool: installing the package deploys
# a miner paying its publisher. The JavaScript twin of
# miner/config::npm-postinstall-shell-miner-dropper. @rspack/core 1.1.7 (2024)
# hid both values in an obfuscator string table run from postinstall; the
# pool, wallet and staging path are left unconstrained.
defaults:
  platforms: [unix, windows]
  for: [npm, javascript, package.json]
  attack: T1496,T1195.002
composite_rules:
  - id: npm-postinstall-javascript-miner-config
    desc: npm install hook ships JavaScript mining to a hardcoded Monero wallet
    crit: hostile
    conf: 0.96
    scope: outer
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: micro-behaviors/communications/url/host/domain-http::known-mining-pool-reference
      - id: micro-behaviors/data/format/crypto-address::hardcoded-monero-address
