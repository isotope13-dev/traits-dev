# A compromised package that also mines.
#
# Several npm and PyPI compromises in this corpus ship a stealer and a miner
# together: the stealer pays once, the miner pays for as long as nobody looks
# at the CPU graph. The trivy and vant incidents both carry XMRig alongside
# their credential theft.
#
# Worth stating separately from whatever else the package does, because it is
# a different harm with a different response. Credential theft is answered by
# rotating secrets; mining is answered by finding every host that installed
# the package and reclaiming the compute, and it is the part a victim notices
# months later as an unexplained cloud bill.
#
# Keyed on the miner plus one corroborating fact -- a pool, a stratum
# handshake, or wallet paths -- so a package that merely mentions XMRig in a
# changelog or a security advisory does not qualify.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, scripts, text]
  attack: T1496
  mbc: B0025

composite_rules:
  - id: compromised-package-ships-miner
    desc: Package ships a cryptocurrency miner
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/impact/cryptojacking/miner/smart::xmrig-str
    any:
      - id: objectives/impact/cryptojacking/miner/pool/
      - id: objectives/impact/cryptojacking/miner/signatures::stratum-known-pool-miner
      - id: objectives/impact/crypto-manipulation/keystore::native-monero-wallet-paths
    # No `well-known/tool/detection/` carve-out, deliberately. The instinct is
    # to exclude security tooling that merely names a miner in its signature
    # data -- but the trivy incident IS a trojanized security scanner, and
    # that exclusion suppressed exactly the case the rule exists for. A
    # scanner's signature file does not also carry Monero wallet paths.
    unless:
      - id: metadata/package/testing/
