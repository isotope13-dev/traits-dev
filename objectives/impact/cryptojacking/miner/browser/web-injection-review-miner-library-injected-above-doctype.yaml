defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189
composite_rules:
  - id: miner-library-injected-above-doctype
    desc: Miner library and pre-DOCTYPE script clues
    crit: suspicious
    conf: 0.95
    attack: T1189,T1496
    all:
      - id: metadata/lang/source/syntax/markup/html-structure::script-block-before-doctype
      - id: well-known/app/finance/coinhive::coinhive-script-reference
  # A miner bootstrap injected outside the document: the library load and an
  # autostart call sit before the DOCTYPE, where no legitimate page template
  # places them, together with mining configuration (throttle option,
  # constructor, or literal site key). The injected position plus the start
  # call establishes a drive-by resource-hijacking injection: visitors who
  # render the page load the miner library and begin mining. Static evidence
  # does not prove execution or a successful hash submission, and a defanged
  # copy (commented constructor, nulled receiver) still carries the
  # injection, so the claim is the injected bootstrap, not observed mining.
  - id: injected-coinhive-autostart-bootstrap
    desc: Injected CoinHive library with autostart mining bootstrap
    crit: hostile
    conf: 0.97
    attack: T1189,T1496
    near_bytes: 2048
    all:
      - id: metadata/lang/source/syntax/markup/html-structure::script-block-before-doctype
      - id: well-known/app/finance/coinhive::coinhive-script-reference
      - id: micro-behaviors/data/control-flow/dispatch/named::miner-or-client-start-call
    any:
      - id: "metadata/lang/source/syntax/key-value::fractional-throttle-option"
      - id: well-known/app/finance/coinhive::coinhive-miner-construct
      - id: well-known/app/finance/coinhive::coinhive-anonymous-site-key
    needs: 1
