# A script starts mining directly, without a local affirmative-action gate.
# External consent remains possible, so this is suspicious rather than hostile.
defaults:
  platforms: [linux, macos, windows]
  for: [html]
  attack: T1496

composite_rules:
  - id: coinimp-inline-autostart
    desc: Inline CoinIMP miner starts without local gate
    crit: suspicious
    conf: 0.96
    near_bytes: 256
    all:
      - id: metadata/lang/source/syntax/assignment/name::inline-script-initial-miner-assignment
      - id: micro-behaviors/communications/blockchain/mining::coinimp-miner-assignment-start
# Evasive-loader startup: the miner library arrives from a root-dotted
# host (a blocklist-evasion spelling kits add when a loader domain gets
# blocked) beside a site-keyed Anonymous constructor, a fractional
# throttle, and the miner start call. The bare keyed-throttled-started
# triple stays suspicious (external consent remains possible, see the
# taxonomy coinimp-browser-startup fixtures); the evasively fetched
# remote library defeats the consent theory and states a drive-by miner
# running on the visitor's machine for a specific beneficiary.
  - id: coinimp-evasive-loader-startup
    desc: CoinIMP miner started from evasive loader
    crit: hostile
    conf: 0.97
    attack: T1496,T1105
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/client/script::dotted-root-script-src
      - id: micro-behaviors/communications/blockchain/mining::coinimp-loader-script-reference
      - id: micro-behaviors/communications/blockchain/mining::coinimp-anonymous-site-key
      - id: "metadata/lang/source/syntax/key-value::fractional-throttle-option"
      - id: micro-behaviors/data/control-flow/dispatch/named::miner-or-client-start-call
