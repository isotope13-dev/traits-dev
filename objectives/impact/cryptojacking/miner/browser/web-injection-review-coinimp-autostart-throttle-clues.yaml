defaults:
  platforms: [windows, unix]
  attack: T1105
composite_rules:
  - id: coinimp-autostart-throttle-clues
    desc: CoinIMP autostart, script and throttle clues
    crit: suspicious
    conf: 0.98
    attack: T1496,T1189,T1105
    for: [html]
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/blockchain/mining::coinimp-script-reference
      - id: objectives/impact/cryptojacking/miner/browser::coinimp-inline-autostart
      - id: "metadata/lang/source/syntax/key-value::fractional-throttle-option"
  # Stored attribute breakout: a script element smuggled inside an alt/title
  # value breaks out with closers and loads a remote script. The smuggled
  # tag plus the external load name the injection; hand-written markup
  # never nests elements inside attribute values.
