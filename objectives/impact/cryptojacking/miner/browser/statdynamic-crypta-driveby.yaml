# Drive-by cryptojacking via the documented statdynamic crypta.js
# distributor. Symantec (Jan 2019) decoded the encrypted library served at
# statdynamic.com/lib/crypta.js and found a CoinHive-variant Monero miner
# with a hardcoded attacker key; compromised sites and Store apps carried
# only this script tag because the remote library brings its own
# configuration, so no inline CRLT constructor, throttle, or start call is
# needed (which is why the inline-bootstrap rules stay silent here).
# Required evidence is two independent IOC roles on the same tag: the
# malicious-distributor host and the documented miner-library path. Each
# leg generalizes along one axis (new paths on the same host still trip the
# host atom; the library on a renamed host still trips the generic
# crypta-lib atom as a notable), while together they identify the exact
# documented payload URL, which has no legitimate use. Static evidence only:
# the remote library is not fetched, so the claim is the injected drive-by
# loader, not observed hashing; a dead host still leaves the injection.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1496
composite_rules:
  - id: statdynamic-crypta-driveby-loader
    desc: Statdynamic distributor serves page crypta.js miner
    crit: hostile
    conf: 0.97
    attack: T1496,T1105
    near_bytes: 256
    all:
      - id: micro-behaviors/communications/http/client/script::statdynamic-script-src
      - id: micro-behaviors/communications/http/client/script::crypta-lib-script-src
