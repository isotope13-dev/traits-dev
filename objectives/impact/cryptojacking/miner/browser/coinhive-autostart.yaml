# CoinHive's browser miner runtime (its wsNNN proxy pool) bundled inline into a
# site script with a hard-coded site key and an unconditional start(): it mines for whoever owns the key from
# every visitor, with no opt-in UI. CoinHive is a named miner family, so this
# stays suspicious (PUA), not hostile.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
traits:
  - id: coinhive-embedded-key-construct
    desc: Constructs CoinHive miner with embedded key
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'CoinHive\.(Anonymous|User)\(\s*["''][A-Za-z0-9]{32}["'']'
  - id: coinhive-proxy-websocket
    desc: References CoinHive mining proxy socket
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'wss://ws\d{3}\.coinhive\.com/proxy'
  - id: script-object-start-call
    desc: Calls start() on a script object
    crit: component
    conf: 0.6
    if:
      type: text
      regex: '\b\w+\.start\(\s*\)'
  - id: cryptonight-worker-blob-reference
    desc: References CoinHive Cryptonight worker blob
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: CRYPTONIGHT_WORKER_BLOB
composite_rules:
  # The full miner runtime (proxy shard list plus the Cryptonight worker)
  # copied into a site's own script bundle, whether or not this file also
  # starts it: the site ships a browser miner to every visitor.
  - id: bundled-coinhive-miner-runtime
    desc: Site bundle ships the CoinHive miner runtime
    crit: suspicious
    conf: 0.93
    attack: T1496
    all:
      - id: coinhive-proxy-websocket
      - id: cryptonight-worker-blob-reference
  - id: coinhive-autostart-embedded-key
    desc: Bundled CoinHive miner autostarts with key
    crit: suspicious
    conf: 0.95
    attack: T1496
    all:
      - id: coinhive-proxy-websocket
      - id: coinhive-embedded-key-construct
      - id: script-object-start-call
