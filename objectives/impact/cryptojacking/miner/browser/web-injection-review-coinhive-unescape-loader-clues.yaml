defaults:
  platforms: [windows, unix]
  attack: T1105
composite_rules:
  - id: coinhive-unescape-loader-clues
    desc: Encoded document write and CoinHive start clues
    crit: suspicious
    conf: 0.96
    attack: T1496,T1105,T1027
    for: [html]
    near_bytes: 4096
    all:
      - id: micro-behaviors/ui/window/insert-html::browser-document-write-unescape
      - id: well-known/app/finance/coinhive::coinhive-miner-construct
      - id: micro-behaviors/data/control-flow/dispatch/named::miner-or-client-start-call
  # Cookie-gated injector: a decoded URL plus the visitor address is fetched
  # and the response (or a decoded script fallback) is written into the page.
