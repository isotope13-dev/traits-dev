defaults:
  platforms: [unix]
  for: [shell, text, python, javascript]
  attack: T1496
traits:
  - id: ssh-tunnels-port-3333
    desc: SSH tunnel uses mining port
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\s-L\s*(127\.0\.0\.1:)?3333:'
  - id: localhost-mining-port
    desc: Localhost mining pool port
    crit: notable
    conf: 0.82
    if:
      type: text
      # http://localhost:3333 is a dev server (Playwright clock docs, Vite).
      # A slash immediately before the host is an HTTP URL, not a pool dial.
      # stratum+tcp:// still matches via the tcp:// alternative.
      regex: 'tcp://(127\.0\.0\.1|localhost):3333|[^/](127\.0\.0\.1|localhost):3333'
composite_rules:
  - id: ssh-local-mining-tunnel
    for: [shell, python, javascript]
    desc: SSH tunnel to mining port
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/communications/ssh/connect::ssh-local-forward-command
      - id: ssh-tunnels-port-3333
    any:
      - id: micro-behaviors/communications/ssh/connect::ssh-background-no-command
      - id: localhost-mining-port
      - id: micro-behaviors/communications/socket/tcp::stratum-port-3333
  - id: cryptominer-through-ssh-tunnel
    for: [shell, python, javascript]
    desc: Cryptominer uses SSH local tunnel
    crit: hostile
    conf: 0.98
    all:
      - id: ssh-local-mining-tunnel
    any:
      - id: micro-behaviors/crypto/hash/mining::algorithm-stratum-miner
      - id: micro-behaviors/crypto/hash/mining::mining-related-markers
      - id: micro-behaviors/communications/socket/tcp::stratum-keyword
      - id: micro-behaviors/process/create/exec::shell-xmrig-invocation