defaults:
  platforms: [unix]
  for: [shell, text, python, javascript]
  attack: T1496
# Port and forwarding observations live in neutral capability directories.
composite_rules:
  - id: cryptominer-through-ssh-tunnel
    for: [shell, python, javascript]
    desc: Cryptominer uses SSH local tunnel
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/ssh/connect::ssh-local-forward-3333-context
    any:
      - id: micro-behaviors/communications/blockchain/mining::algorithm-stratum-miner
      - id: micro-behaviors/communications/blockchain/mining::mining-related-markers
      - id: micro-behaviors/communications/socket/tcp::stratum-keyword
      - id: micro-behaviors/process/create/exec::shell-xmrig-invocation
