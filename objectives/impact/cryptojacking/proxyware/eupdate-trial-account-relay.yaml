# A proxy that rotates trial accounts to authenticate requests to a vendor's
# update service consumes trial access on behalf of relay clients. Require the
# account marker, Basic-auth support, and the structurally matched ESET
# manifest relay so generic updaters and ordinary authenticated clients do not
# qualify.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1496,T1090
  conf: 0.97

composite_rules:
  - id: eupdate-trial-account-authenticated-relay
    desc: Relays ESET updates using rotating trial-account Basic authentication
    crit: hostile
    all:
      - id: micro-behaviors/communications/proxy/auth::trial-account-identifier-prefix
      - id: micro-behaviors/communications/proxy/auth::account-list-rotation-diagnostic
      - id: micro-behaviors/communications/http/auth::authorization-basic-header-token
      - id: micro-behaviors/communications/proxy/relay::eset-manifest-filtering-relay-profile
