# Headless Android proxy-relay enrollment. A monetized device joins a
# residential-proxy mesh by opening a raw TCP uplink to its controller and
# piping both stream directions between the controller and the target,
# redialing forever when the uplink drops. Each leg is an ordinary socket
# primitive on its own; a raw numeric-port dial plus a bidirectional pipe
# plus an unconditional redial loop in one component is the enrollment shape
# of a relay node, not of an app talking to its own backend.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1090,T1496
  conf: 0.98

composite_rules:
  - id: android-residential-relay-enrollment
    desc: Android app enrolls the device as a TCP relay node
    crit: hostile
    all:
      - id: micro-behaviors/communications/socket/tcp::android-fixed-port-socket-dial
      - id: metadata/lang/source/syntax/call::jvm-stream-accessor-pair
      - id: micro-behaviors/communications/socket/tcp::android-socket-reconnect-loop
