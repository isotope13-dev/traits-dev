# Legitimate proxyware becomes resource hijacking when an installer silently
# enrolls the host, establishes privileged persistence, and impairs security
# controls. Product identity alone remains notable in well-known/dual-use/;
# this objective requires the surrounding attack chain.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1496,T1090,T1053.005,T1562.001
  conf: 0.97

composite_rules:
  - id: proxyware-system-task-install
    desc: Proxyware is installed as a SYSTEM startup task
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/autorun/scheduled::register-scheduledtask
      - id: micro-behaviors/os/autorun/scheduled::scheduledtask-system-principal
      - id: micro-behaviors/os/autorun/scheduled::schtask-trigger-at-startup
    any:
      - id: well-known/dual-use/tunnel/soax::soax-proxy-sdk
      - id: well-known/dual-use/tunnel/appsalt::appsalt-proxy-sdk
      - id: well-known/dual-use/tunnel/digitalpulse::digitalpulse-proxy-agent
      - id: well-known/dual-use/tunnel/iproyal-pawns::pawns-proxy-sdk

  - id: defense-impaired-proxyware-persistence
    desc: Proxyware persists after disabling Defender cloud protection
    crit: hostile
    conf: 0.995
    all:
      - id: proxyware-system-task-install
      - id: objectives/evasion/anti-av/platform/defender::defender-cloud-protection-disabled-with-exclusion
