defaults:
  crit: notable
  conf: 0.8
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1496
traits:
  - id: c3pool-domain
    desc: c3pool mining pool domain
    if:
      type: text
      regex: '(?i)\b(auto\.)?c3pool\.org\b'
  - id: pool-minexmr
    desc: pool.minexmr mining pool domain
    if:
      type: text
      substr: pool.minexmr
      section: .text

  - id: moneroocean-string
    desc: moneroocean mining pool
    if:
      type: text
      word: moneroocean
      section: .text
    unless:
      - id: metadata/build/recognized-contexts/
      - id: metadata/file/catalog/identity/
      - id: well-known/app/productivity/1password::onepassword-runtime-context
      - id: well-known/app/productivity/1password::onepassword-native-module-context
