# The guide describes RunInstances user data as the CloudTrail-visible launch
# surface for payloads such as cryptomining scripts. CloudTrail may redact the
# payload itself, so this rule only uses the operation and parameter presence.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  attack: T1496

composite_rules:
  - id: aws-instance-launch-with-user-data
    desc: AWS instance launch with user data
    crit: suspicious
    conf: 0.9
    scope: outer
    unless:
      - id: well-known/lib/format/stacksjs-stacks::stacks-package-context
      - id: well-known/lib/format/stacksjs-stacks::fetched-dependency-path
      - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-runtime-source-context
      # The SDK itself must expose every EC2 operation and parameter; those
      # generated API models are not a remote-compute payload.
      - id: well-known/lib/cloud/aws-sdk-go::aws-sdk-go-context
      # Same reasoning on the server side: an emulator implements RunInstances
      # and UserData because it is reimplementing the API, not launching one.
      - id: well-known/lib/cloud/localstack::localstack-package-context
    all:
      - id: micro-behaviors/communications/http/services/aws::aws-run-instances-operation
      - id: micro-behaviors/communications/http/services/aws::aws-user-data-parameter

  # The guide's Scenario 2: a CloudFormation template that declares EC2
  # instances whose base64 bootstrap user data carries mining markers (a
  # Stratum pool endpoint or the XMRig product). The template is the
  # deployment surface; the mining markers in its bootstrap are the payload
  # evidence that survives static analysis.
  - id: cloudformation-mining-stack
    desc: CloudFormation stack launches instances with a cryptomining bootstrap
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/services/aws-cloudformation::cfn-ec2-instance-resource
      - id: micro-behaviors/communications/http/services/aws-cloudformation::cfn-user-data-base64
    any:
      - id: micro-behaviors/communications/socket/tcp::stratum-tcp-url
      - id: micro-behaviors/communications/socket/tcp::stratum-ssl-url
      - id: metadata/file/string/identity::xmrig-product

  # Hardware fingerprint of a mining fleet: a template that provisions
  # compute-optimized or GPU instance families for EC2 resources alongside
  # mining markers. Catches variants that tune instance types while sharing
  # the bootstrap-payload evidence above.
  - id: cloudformation-compute-fleet-mining
    desc: CloudFormation provisions compute-optimized instances with mining markers
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/aws-cloudformation::cfn-ec2-instance-resource
      - id: micro-behaviors/communications/http/services/aws-cloudformation::cfn-compute-optimized-instance-type
    any:
      - id: micro-behaviors/communications/socket/tcp::stratum-tcp-url
      - id: micro-behaviors/communications/socket/tcp::stratum-ssl-url
      - id: metadata/file/string/identity::xmrig-product

  # The prepackaged deployment script form: `aws cloudformation create-stack`
  # in the same artifact as a mining pool endpoint or pool domain, e.g. a
  # CloudShell-ready script passing the pool as a stack parameter.
  - id: scripted-mining-stack-deployment
    desc: Script deploys a CloudFormation stack carrying mining configuration
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/impact/cryptojacking/miner/spread::script-miner-indicator
    any:
      - id: micro-behaviors/communications/http/services/aws-cloudformation::aws-cli-cloudformation-create-stack
      - id: micro-behaviors/communications/http/services/aws-cloudformation::cloudformation-create-stack-event
      - id: micro-behaviors/communications/http/services/aws-cloudformation::cloudformation-create-stack

  # Session-context signal from the guide's Scenario 2 log evidence: a stack
  # created from the browser-based CloudShell execution environment on a
  # session that was not MFA-authenticated. Legitimate automation deploys
  # with CI credentials and MFA-enforced console sessions; this combination
  # is the stolen-console-credential pivot.
  - id: cloudshell-no-mfa-stack-deployment
    desc: CloudFormation stack deployed from CloudShell without MFA
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/communications/http/services/aws::cloudshell-exec-env-user-agent
      - id: micro-behaviors/communications/http/services/aws::cloudtrail-session-without-mfa
    any:
      - id: micro-behaviors/communications/http/services/aws-cloudformation::aws-cli-cloudformation-create-stack
      - id: micro-behaviors/communications/http/services/aws-cloudformation::cloudformation-create-stack-event
      - id: micro-behaviors/communications/http/services/aws-cloudformation::cloudformation-create-stack
