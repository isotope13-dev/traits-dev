# The guide describes RunInstances user data as the CloudTrail-visible launch
# surface for payloads such as cryptomining scripts. CloudTrail may redact the
# payload itself, so this rule only uses the operation and parameter presence.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  attack: T1496

composite_rules:
  - id: aws-instance-launch-with-user-data
    desc: AWS instance launch with user data
    crit: suspicious
    conf: 0.9
    scope: outer
    unless:
      - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-package-context
      - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-npm-package-context
      - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-archive-package-context
      - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-aws-runtime-context
      - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-npm-identity-evidence
      - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-archive-identity-evidence
    all:
      - id: micro-behaviors/communications/http/services/aws::aws-run-instances-operation
      - id: micro-behaviors/communications/http/services/aws::aws-user-data-parameter
