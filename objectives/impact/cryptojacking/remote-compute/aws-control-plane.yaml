# The guide describes RunInstances user data as the CloudTrail-visible launch
# surface for payloads such as cryptomining scripts. CloudTrail may redact the
# payload itself, so this rule only uses the operation and parameter presence.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  attack: T1496

composite_rules:
  - id: aws-instance-launch-with-user-data
    desc: AWS instance launch with user data
    crit: suspicious
    conf: 0.9
    scope: outer
    unless:
      - id: well-known/lib/format/stacksjs-stacks::stacks-package-context
      - id: well-known/lib/format/stacksjs-stacks::fetched-dependency-path
      - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-runtime-source-context
      # The SDK itself must expose every EC2 operation and parameter; those
      # generated API models are not a remote-compute payload.
      - id: well-known/lib/cloud/aws-sdk-go::aws-sdk-go-context
      # Same reasoning on the server side: an emulator implements RunInstances
      # and UserData because it is reimplementing the API, not launching one.
      - id: well-known/lib/cloud/localstack::localstack-package-context
    all:
      - id: micro-behaviors/communications/http/services/aws::aws-run-instances-operation
      - id: micro-behaviors/communications/http/services/aws::aws-user-data-parameter
