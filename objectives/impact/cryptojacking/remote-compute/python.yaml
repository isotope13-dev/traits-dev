# Relay detection must not gate on an attacker-pickable identifier such as a
# model->server mapping variable name (renaming it would clear the hostile).
# The fleet-probe leg establishes the discovered open-server pool and the
# /v1 leg establishes inference work relayed to a pool member.
defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
  - id: ollama-open-server-inference-relay
    desc: Uses public Ollama servers for remote inference
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/discovery/network/scan/http::ollama-open-server-fleet-probe
      - id: micro-behaviors/communications/http/url/api-path::server-url-v1-path
