# Reconstructed logs can establish co-occurrence, not a shared principal,
# successful API responses, or the origin of the credentials. Require the
# reported offensive-tool marker plus inventory and provisioning evidence.
defaults:
  platforms: [unix, windows]
  for: [json]

composite_rules:
  - id: artex-bedrock-credential-probe
    desc: ARTEX AWS probing with IAM creation and Bedrock credentials
    crit: hostile
    conf: 0.95
    attack: T1496
    ref: https://www.dragos.com/blog/ai-supply-chain-security-canary-tokens
    all:
      - id: well-known/tool/offensive/framework/artex::cloudtrail-user-agent
      - id: micro-behaviors/communications/http/services/aws-secretsmanager::list-secrets-event
      - id: micro-behaviors/communications/http/services/aws-ssm::describe-parameters-event
      - id: micro-behaviors/communications/http/services/aws-iam::iam-user-create-operation
      - id: micro-behaviors/communications/http/services/aws-iam::iam-service-specific-credential-operation
      - id: micro-behaviors/communications/http/services/aws-bedrock::bedrock-service-credential-parameter
