# Relocated from impact/ransom/esxi: these switches establish destructive
# intent against VMFS, not encryption or a ransom demand. Retain all prior
# evidence requirements and source-language coverage.
defaults:
  platforms: [unix]
  for: [shell, python, perl, ruby, go, c, cpp]

composite_rules:
  - id: esxi-vmfs-recursive-wipe-invocation
    desc: Invokes recursive wipe against VMFS
    crit: hostile
    conf: 0.97
    attack: T1485
    ref: https://securelist.com/esxi-ransomware/121959/
    near_lines: 15
    all:
      - id: micro-behaviors/os/sysinfo/vmware::vmfs-path
      - id: micro-behaviors/process/argument/file::depth-cli-option
      - id: micro-behaviors/process/argument/file::wipe-cli-option
      - id: micro-behaviors/fs/chmod/remote::local-or-remote-staged-launch
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
