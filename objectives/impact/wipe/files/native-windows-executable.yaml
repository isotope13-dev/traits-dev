defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: windows-directory-enumerator-destructive-writer
    desc: "Directory enumeration with truncating writes"
    crit: hostile
    conf: 0.94
    attack: T1485
    all:
      - id: micro-behaviors/fs/file/truncate::create-always-exclusive-write-stack-arguments
      - id: micro-behaviors/fs/path/windows-root::windows-root-directory-wildcard
      - id: micro-behaviors/fs/path/windows-root::windows-root-filename-format
      - id: micro-behaviors/fs/directory/readdir/native::find-first-file-a
      - id: micro-behaviors/fs/directory/readdir/native::find-next-file-a
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file

  - id: directory-traversal-file-truncation-wiper
    desc: Traverses drives or directories with --wipe option to truncate files empty
    crit: hostile
    conf: 0.97
    attack: T1485
    platforms: [windows, unix]
    for: [binaries, source, python, powershell]
    all:
      - id: micro-behaviors/fs/file/truncate::file-truncate-capability
      - id: micro-behaviors/process/argument/file::wipe-cli-option
    any:
      - id: micro-behaviors/fs/enumerate/drives::drive-and-file-tree-traversal
      - id: micro-behaviors/fs/directory/readdir/native::file-enumeration-with-access
      - id: micro-behaviors/fs/directory/traverse/
    unless:
      - id: metadata/signature/verified/

  - id: ransomware-with-optional-wiper-mode
    desc: Dual-mode ransomware combines file encryption with --wipe file truncation
    crit: hostile
    conf: 0.99
    attack: T1486,T1485
    platforms: [windows, unix]
    for: [binaries, source, python, powershell]
    all:
      - id: directory-traversal-file-truncation-wiper
      - id: objectives/impact/ransom/encrypt-note::files-encrypted-notice
    any:
      - id: micro-behaviors/crypto/encrypt/
      - id: objectives/impact/ransom/native::data-will-be-published
