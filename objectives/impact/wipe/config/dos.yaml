# CMOS-killer stub as appended to an infected DOS SYS driver (strategy
# routine redirected past the clean body): on the trigger day it zeroes CMOS
# registers 10h-3Fh through ports 70h/71h — OUT 70h selects the register, a
# zeroed AL goes out 71h, the loop steps through the range — then reboots
# through the reset vector. The hardware configuration (drive types, boot
# order) is destroyed, so the host cannot boot.
defaults:
  platforms: [unix, windows]
  for: [dos_com, static-lib, data]
  size_max: 65536
  attack: T1490
traits:
  - id: dos-cmos-zero-fill-iteration
    desc: DOS writes zeros across CMOS registers
    crit: suspicious
    conf: 0.93
    if:
      type: hex
      pattern: "E6 70 [0-3] 2A C0 E6 71 [0-4] 40 3C 40 72"
composite_rules:
  - id: dos-cmos-nvram-wipe-reboot
    desc: DOS zeroes CMOS hardware configuration and reboots
    crit: hostile
    conf: 0.96
    all:
      - id: dos-cmos-zero-fill-iteration
      - id: micro-behaviors/os/event/shutdown::dos-reset-vector-reboot-jump
  # The same wipe gated on the RTC date: the stub polls INT 1Ah AH=04h and
  # only runs the zero-fill on the trigger day, a logic bomb rather than an
  # immediate wiper.
  - id: dos-date-gated-cmos-bomb
    desc: Date-triggered CMOS destruction payload
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/time/query::dos-bios-rtc-date-read
      - id: dos-cmos-nvram-wipe-reboot
