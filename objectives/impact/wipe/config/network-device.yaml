# Factory-reset / configuration-erase CLI issued to network devices.
#
# Each atom is one vendor's exact administrative command for discarding the
# stored configuration. Individually they are legitimate operator and
# provisioning commands. A single script carrying the erase command for two or
# more different vendors is not vendor tooling — it is a fleet wiper sweeping a
# mixed estate, which is how OT-adjacent network equipment is destroyed to slow
# incident recovery.
#
# `write erase` is already matched by objectives/impact/wipe/config::write-erase-command
# (Cisco, ruby/c artifacts); the Cisco atom here uses the distinct
# `erase startup-config` / `erase nvram:` form and covers scripting languages.
defaults:
  for: [python, javascript, typescript, ruby, shell, powershell, go, perl]
  platforms: [unix, windows, appliance]
  attack: T1485
  crit: notable
  conf: 0.93

traits:
  - id: fortios-factory-reset-command
    desc: FortiOS factory-reset command
    if:
      type: text
      regex: '(?i)\bexecute\s+factoryreset[12]?\b'

  - id: routeros-reset-configuration-command
    desc: RouterOS configuration reset command
    if:
      type: text
      regex: '(?i)/system\s+reset-configuration\b'

  - id: openwrt-firstboot-command
    desc: OpenWrt/RutOS firstboot overlay reset command
    if:
      type: text
      regex: '(?i)\bfirstboot\s+-y\b'

  - id: cisco-erase-startup-config-command
    desc: Cisco IOS startup-config erase command
    if:
      type: text
      regex: '(?i)\berase\s+(startup-config|nvram:)\b'

  - id: junos-system-zeroize-command
    desc: Junos system zeroize command
    if:
      type: text
      regex: '(?i)\brequest\s+system\s+zeroize\b'

  - id: aruba-erase-all-zeroize-command
    desc: ArubaOS/HPE erase-all zeroize command
    if:
      type: text
      regex: '(?i)\berase\s+all\s+zeroize\b'

composite_rules:
  - id: network-device-config-erase
    desc: Issues a factory-reset or configuration-erase command to a network device
    crit: notable
    conf: 0.94
    any:
      - id: fortios-factory-reset-command
      - id: routeros-reset-configuration-command
      - id: openwrt-firstboot-command
      - id: cisco-erase-startup-config-command
      - id: junos-system-zeroize-command
      - id: aruba-erase-all-zeroize-command

  - id: multi-vendor-network-config-wipe
    desc: Erases the stored configuration of network devices from several vendors
    crit: hostile
    conf: 0.96
    needs: 2
    any:
      - id: fortios-factory-reset-command
      - id: routeros-reset-configuration-command
      - id: openwrt-firstboot-command
      - id: cisco-erase-startup-config-command
      - id: junos-system-zeroize-command
      - id: aruba-erase-all-zeroize-command

  # The article's recovery-denial trio: drop the config, take the admin
  # account, and park the management interface where nobody can route to it.
  - id: network-device-recovery-denial
    desc: Erases a network device configuration and cuts off its management path
    crit: hostile
    conf: 0.97
    attack: T1531
    all:
      - id: network-device-config-erase
      - id: micro-behaviors/communications/ip/assignment::device-management-address-blackholed
    any:
      - id: micro-behaviors/communications/http/services/cloud::remote-admin-password-change-call
      - id: multi-vendor-network-config-wipe
