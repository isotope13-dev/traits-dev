defaults:
  platforms: [unix, appliance]
  for: [shell]
  attack: T1485

traits:
  - id: sonic-factory-config-setup
    desc: Invokes SONiC factory configuration setup
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bconfig-setup\s+factory\b'

composite_rules:
  # The SONiC factory reset restores device configuration before removing
  # user data and volatile state. Use both operations to recognize that
  # legitimate administrative cleanup context for more specific detections.
  - id: sonic-factory-reset-cleanup-context
    desc: SONiC factory reset context for account and data cleanup
    crit: exception
    conf: 0.99
    near_lines: 30
    all:
      - id: objectives/impact/services/stop::sonic-target-stop
      - id: sonic-factory-config-setup
