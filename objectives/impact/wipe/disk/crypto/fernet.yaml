# Fernet Wiper Ransomware Detection
# ATT&CK: T1486 (Data Encrypted for Impact), T1485 (Data Destruction)
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: "T1486"
traits:
  - id: generate-key-call
    desc: Fernet key generation call
    crit: notable
    conf: 0.78
    if:
      type: symbol
      kind: call
      exact: 'Fernet.generate_key'
composite_rules:
  - id: fernet-inplace-overwrite
    desc: Fernet in-place file overwrite loop
    crit: suspicious
    conf: 0.93
    unless:
      # `ransom/tactics/` was dissolved into encrypt/, recovery-inhibition/
      # and its other siblings; the parent covers what the directory ref meant
      # -- if this is ransomware, it is not a wiper.
      - id: objectives/impact/ransom/
      - id: micro-behaviors/fs/file/open::python-open-key-write
    all:
      - id: objectives/impact/ransom/encrypt/filesystem::inplace-encrypt
      - id: micro-behaviors/crypto/symmetric/fernet::class-usage
  - id: fernet-wiper-ransomware
    desc: "Fernet key generation combined with in-place encryption (wiper)"
    crit: hostile
    conf: 0.97
    all:
      - id: generate-key-call
      - id: fernet-inplace-overwrite
