defaults:
  platforms: [openwrt]
  for: [python, pyc]
  attack: T1485

traits:
  - id: openwrt-jffs2reset-command
    desc: OpenWrt JFFS2 reset command
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: jffs2reset -y
  # openwrt-flash-erase-command lived here as `substr: flash_erase` at
  # suspicious/0.95. `flash_erase` is mtd-utils — it ships on every embedded
  # Linux, not just OpenWrt — and erasing an MTD partition is the mandatory
  # first step of *writing* firmware to it, not a wipe objective. It rated the
  # Ettus USRP driver's daughterboard flashing utility suspicious for
  # `subprocess.run(['flash_erase', mtd_devpath, '0', '0'])`. The matcher is now
  # micro-behaviors/hardware/flash/device::flash-erase-command, beside the other
  # raw-flash capabilities, and this composite references it there.
  - id: openwrt-fw-setenv-boot-tamper
    desc: OpenWrt boot environment tamper command
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'fw_setenv\s+boot(delay|args)'
  - id: openwrt-shadow-overwrite
    desc: OpenWrt shadow backup overwrite path
    crit: suspicious
    conf: 0.9
    unless:
      - id: well-known/app/system/remotepower::documented-rmm-release-context
    if:
      type: text
      substr: /etc/shadow-

composite_rules:
  - id: openwrt-python-system-wipe
    desc: OpenWrt Python system wipe
    crit: hostile
    conf: 0.98
    unless:
      - id: well-known/app/system/remotepower::documented-rmm-release-context
    any:
      - id: openwrt-jffs2reset-command
      - id: micro-behaviors/hardware/flash/device::flash-erase-command
      - id: openwrt-fw-setenv-boot-tamper
      - id: objectives/persistence/system/network-appliance::openwrt-root-crontab-path
      - id: openwrt-shadow-overwrite
      - id: micro-behaviors/fs/path/config/system::openwrt-uci-config-access
    needs: 4
