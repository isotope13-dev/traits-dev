defaults:
  platforms: [unix]
  for: [scripts, binaries]
traits:
  - id: dd-zero
    desc: dd zero-fills a device target
    crit: suspicious
    conf: 0.6
    if:
      type: text
      # Include the device name in the match so the exclusions below see it.
      regex: 'dd\s+if=/dev/zero.{0,50}of=/dev/.{1,64}'
    unless:
      # AI-agent guardrails / security scanners list disk-wipe commands as
      # threat signatures + test fixtures (scanner-context-inversion).
      - id: well-known/tool/detection/ai-guardrail/
      # Compiled agent prompts can enforce approval while listing destructive
      # examples even when source-oriented guardrail traits cannot identify
      # the enclosing binary.
      - id: metadata/file/policy/identity::enforced-dangerous-action-approval
      - id: well-known/app/utility/kpango-dotfiles/
      - id: well-known/app/storage/clonezilla/
      # Test suites commonly assert that a command policy rejects destructive
      # dd input; that string is not an execution of the wipe operation.
      - id: metadata/package/testing/presence/harness/
      # A Python agent's shell policy lists this command as a denied example;
      # the literal is not an invocation of dd.
      - type: text
        regex: 'SHELL_BLOCKLIST\s*='
      # A disk installer clears the first sectors before partitioning,
      # formatting, mounting, and staging a new root filesystem.
      - id: micro-behaviors/fs/disk/partition::bsd-disk-installation-context
      - id: micro-behaviors/hardware/flash/device::firmware-upgrade-context
      - id: well-known/app/infrastructure/openshift::openshift-release-ci-step-context
    not:
      - regex: '\bof=/dev/(null|zero|random|urandom|stdin|stdout|stderr)\b'
      - regex: '\bof=/dev/(fd|pts|shm|tty)(/|\b)'
  - id: dd-random
    desc: Overwrites block device with random data
    crit: suspicious
    conf: 0.6
    if:
      type: text
      # `/dev/stdout` and other character/virtual devices are data sinks, not
      # disk destruction. Keep the device-name test broad for future block
      # device families and exclude known non-block endpoints below.
      regex: 'dd\s+if=/dev/urandom.{0,50}of=/dev/'
    not:
      - regex: 'of=/dev/stdout\b'
      - regex: 'of=/dev/stderr\b'
      - regex: 'of=/dev/stdin\b'
      - regex: 'of=/dev/null\b'
      - regex: 'of=/dev/zero\b'
      - regex: 'of=/dev/random\b'
      - regex: 'of=/dev/urandom\b'
      - regex: 'of=/dev/(fd|pts|shm|tty)/?'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: objectives/impact/destroy/keywords::target-source-test
      - id: metadata/package/testing/presence/harness/
      - id: well-known/tool/detection/ai-guardrail/
      - id: metadata/file/policy/identity::enforced-dangerous-action-approval
      - id: micro-behaviors/os/console/io::command-targets-dev-stdout
  # NOTE: generic `shred -<flag>` (secure overwrite of a regular file, e.g.
  # `shred -u secrets.env`) is benign cleanup hygiene, not disk-device
  # destruction — it lives in micro-behaviors/fs/delete/secure/shell.yaml as a
  # neutral capability. Device-targeted (`shred /dev/...`) and forced overwrite
  # remain here as wipe-impact signals.
  #
  # Require at least two letters after `/dev/` so the match covers the node
  # name, then exclude non-block nodes. Without that, `shred ... 2>/dev/null`
  # matched because `/dev/` sits inside the stderr redirect.
  - id: shred-dev
    desc: shred targets a raw /dev/ device
    crit: suspicious
    conf: 0.6
    unless:
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: well-known/tool/detection/ai-guardrail/
      - id: metadata/file/policy/identity::enforced-dangerous-action-approval
    if:
      type: text
      regex: 'shred.{0,40}/dev/[a-z]{2,}'
    not:
      - regex: '/dev/null'
      - regex: '/dev/shm'
      - regex: '/dev/stdin'
      - regex: '/dev/stdout'
      - regex: '/dev/stderr'
      - regex: '/dev/zero'
      - regex: '/dev/random'
      - regex: '/dev/urandom'
      - regex: '/dev/fd/'
      - regex: '/dev/pts/'
      - regex: '/dev/tty'
  - id: shred-force
    desc: shred --force overwrites despite permissions
    crit: suspicious
    conf: 0.6
    unless:
      - id: well-known/tool/detection/ai-guardrail/
      - id: metadata/file/policy/identity::enforced-dangerous-action-approval
    if:
      type: text
      substr: shred --force
