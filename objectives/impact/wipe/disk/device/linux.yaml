defaults:
  crit: suspicious
  conf: 0.6
  platforms: [unix]
  for: [scripts, binaries, text]
traits:
- id: shred-dev
  desc: shred targets a raw /dev/ device
  unless:
  - id: micro-behaviors/process/create/shell/guard::command-guard-pattern-fixtures
  - id: well-known/tool/detection/agent-glovebox::archive-context
  - id: well-known/tool/detection/ai-guardrail/
  - id: metadata/package/testing/presence/harness::test-directory
  - id: metadata/file/policy/identity::enforced-dangerous-action-approval
      # GNU info manuals quote destructive commands in @example blocks.
  - id: metadata/package/documentation/source::gnu-info-source-marker
  if:
    type: text
      # Anchor to a non-comment source line. Documentation such as
      # `# shred ... /dev/sdX` describes a command but cannot execute it.
    regex: '(?m)^[ \t]*(shred\b|[^#/ \t\r\n][^\n]{0,119}\bshred\b)[^\n]{0,40}/dev/[a-z]{2,}'
  not:
  - regex: '/dev/null'
  - regex: '/dev/shm'
  - regex: '/dev/stdin'
  - regex: '/dev/stdout'
  - regex: '/dev/stderr'
  - regex: '/dev/zero'
  - regex: '/dev/random'
  - regex: '/dev/urandom'
  - regex: '/dev/fd/'
  - regex: '/dev/pts/'
  - regex: '/dev/tty'
- id: shred-force
  desc: shred --force overwrites despite permissions
  unless:
  - id: micro-behaviors/process/create/shell/guard::command-guard-pattern-fixtures
  - id: well-known/tool/detection/ai-guardrail/
  - id: metadata/file/policy/identity::enforced-dangerous-action-approval
  if:
    type: text
    substr: shred --force
