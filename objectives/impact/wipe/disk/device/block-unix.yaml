# Cross-language Unix/BSD block-device wipers: root gate + device target +
# destructive overwrite. Complements the shell-specific Viasat composites in
# disk/dd/shell.yaml and the OpenBSD swap wipers in disk/dd/openbsd-shell.yaml.
defaults:
  platforms: [unix]
  for: [shell, python, go, rust, perl, javascript, typescript, c, cpp]
  attack: T1561.002
  mbc: E1561

# NOTE: a `perl-uid-root-gate` trait (`\$>\s*(!=|==)\s*0`) used to sit here.
# Its matcher only detects "Perl compares its effective UID against 0" — a
# neutral privilege check with no disk-wipe meaning — and it duplicated
# micro-behaviors/os/privilege/check::perl-effective-uid-root-check byte for
# byte, so any root-gated Perl test script was reported under disk wiping.
# Use that capability atom instead.
traits:
  - id: blkdiscard-dev
    desc: blkdiscard targets a block device
    crit: suspicious
    conf: 0.92
    for: [shell]
    if:
      type: text
      regex: 'blkdiscard\b[^\n]{0,40}/dev/[a-z]'

  # Require the variable name itself to identify a device. A bare variable is
  # not evidence of one: repository tests use names such as `$HASH1FILE` while
  # deliberately corrupting a small regular file with count=1/conv=notrunc.
  - id: dd-zero-to-device-var
    desc: dd zero-fills device-named shell variable
    crit: suspicious
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: 'dd\s+if=/dev/zero\s+of=["'']?\$\{?\w*(dev|disk|drive|swap)\w*\}?["'']?'
      case_insensitive: true
      not:
        - regex: '\$\{?\w*file\w*\}?'
    unless:
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: metadata/package/testing/presence/harness::test-directory-path

  # A short loop variable may still hold a device enumerated elsewhere in the
  # script. Keep the write as a component so only the device-target composite
  # assigns malicious intent; regular-file test corruption is not suspicious.
  - id: dd-zero-to-shell-var
    desc: dd zero-fills shell variable output
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: 'dd\s+if=/dev/zero\s+of=["'']?\$\{?\w+\}?["'']?'

  - id: xargs-dd-urandom-pipeline
    desc: xargs piping to dd urandom wiper
    crit: suspicious
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: 'xargs\s+.{0,100}dd\s+.{0,100}/dev/u?random'

  - id: lang-mounts-dev-scan
    desc: Scans mount table for /dev devices
    crit: notable
    conf: 0.9
    for: [scripts, source]
    if:
      type: text
      regex: '/proc/mounts[\s\S]{0,400}/dev/'
    unless:
      - id: well-known/app/infrastructure/docker::source-tree
      - id: well-known/app/infrastructure/docker::docker-source-archive-context

  - id: go-openfile-block-dev
    desc: Go OpenFile opens a block device RW
    crit: suspicious
    conf: 0.94
    for: [go]
    if:
      type: text
      regex: 'os\.OpenFile\s*\(\s*"/dev/(sd|nvme|vd|xvd|mmcblk|da|ada)'

  - id: rust-open-block-dev
    desc: Rust OpenOptions opens a block device
    crit: suspicious
    conf: 0.94
    for: [rust]
    if:
      type: text
      regex: 'OpenOptions::new\(\)[\s\S]{0,200}\.open\s*\(\s*"/dev/(sd|nvme|vd|xvd|da|ada)'

  - id: python-open-block-dev
    desc: Python opens a block device for writing
    crit: suspicious
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: 'open\s*\(\s*"/dev/(sd|nvme|vd|xvd|da|ada)[^"]{0,30}"\s*,\s*"r\+b"'

  - id: node-open-block-dev
    desc: Node opens a block device for writing
    crit: suspicious
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: 'openSync\s*\(\s*["'']/dev/(sd|nvme|vd|xvd|da|ada)'

  - id: c-open-block-dev
    desc: C open O_RDWR on a block device
    crit: suspicious
    conf: 0.94
    for: [c, cpp]
    if:
      type: text
      regex: 'open\s*\(\s*"/dev/(sd|nvme|vd|xvd|da|ada)[^"]{0,30}"\s*,\s*O_RDWR'

  - id: dd-zero-block-device-command
    desc: dd zero-fill block-device command text
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'dd if=/dev/zero of=/dev/(sd|nvme|vd|xvd|da|ada|loop|mmcblk)'

  - id: dd-zero-device-format-source
    desc: Source formats dd zero fill for device
    crit: notable
    conf: 0.92
    for: [zig, csharp, java, kotlin, elixir, ruby, swift]
    if:
      type: text
      regex: 'dd\s+if=/dev/zero\s+of=.{0,40}(\{s\}|%s|#\{\w+\}|\$\{?\w+)'

  # Managed/systems languages commonly pass dd arguments as an array and
  # construct only the output argument. Keep this narrower than the generic
  # argv atom: it requires dd, zero input, and a dynamically built `of=` value
  # in one short expression. Device provenance is supplied by the mounted-
  # device composite below.
  - id: dd-argv-tool-source
    desc: Source names dd as an executable
    crit: notable
    conf: 0.9
    for: [csharp, elixir, rust, swift]
    if:
      type: text
      regex: '["''](/usr/bin/)?dd["'']'

  - id: dd-zero-input-argument-source
    desc: Source supplies dd zero input argument
    crit: notable
    conf: 0.9
    for: [csharp, elixir, rust, swift]
    if:
      type: text
      substr: if=/dev/zero

  - id: dd-interpolated-output-argument
    desc: Source interpolates dd output argument
    crit: notable
    conf: 0.92
    for: [csharp, rust, swift]
    if:
      type: text
      regex: 'of=(\{[A-Za-z_]{0,32}\}|%s|#\{\w+\}|\$\w+|\\\(.{1,60}\))'

  - id: dd-concatenated-output-argument
    desc: Source concatenates dd output argument
    crit: notable
    conf: 0.92
    for: [elixir]
    if:
      type: text
      regex: 'of=["'']\s*(\+|<>)'

  - id: jvm-dd-tool-string
    desc: JVM string names dd executable
    crit: notable
    conf: 0.97
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      exact: dd

  - id: jvm-dd-zero-input-string
    desc: JVM string names dd zero input
    crit: notable
    conf: 0.97
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      exact: if=/dev/zero

  - id: jvm-dd-output-prefix-string
    desc: JVM string builds dd output argument
    crit: notable
    conf: 0.97
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      exact: of=

  - id: dd-zero-block-device-argv
    desc: dd argv zero fill targeting block device
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '("dd").{0,80}if=/dev/zero.{0,40}of=/dev/(sd|nvme|vd|xvd|da|ada|loop|mmcblk)'

  - id: dd-zero-dynamic-device-argv
    desc: dd argv zero fill dynamic device
    crit: notable
    conf: 0.92
    # Go uses the value-bound matcher below. The remaining language adapters
    # still need migration; a zero-input argument alone does not prove a device.
    for: [python, rust, perl, javascript, typescript, c, cpp]
    if:
      type: text
      regex: '("dd").{0,80}if=/dev/zero'

  - id: dd-urandom-block-device-command
    desc: dd urandom block-device command text
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'dd if=/dev/urandom of=/dev/(sd|nvme|vd|xvd|da|ada|loop|mmcblk)'

  - id: dd-urandom-linux-block-device-argv
    desc: dd urandom Linux block-device argv
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '"dd".{0,80}if=/dev/urandom.{0,80}of=/dev/(sd|nvme|vd|xvd|loop|mmcblk)'

  - id: dd-urandom-bsd-block-device-argv
    desc: dd urandom BSD block-device argv
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '"dd".{0,80}if=/dev/urandom.{0,80}of=/dev/(da|ada)'

  # The command text alone appears in policy engines, documentation, and test
  # vectors. Execution intent is established by the colocated process-creation
  # evidence in the composite below.

  - id: shred-block-device-command-text
    desc: Shred block-device command text
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '("shred"|shred ).{0,60}/dev/(sd|nvme|vd|xvd|da|ada)'

composite_rules:
  - id: dd-zero-dynamic-output-source
    desc: Builds dynamic dd zero-fill output argument
    crit: notable
    conf: 0.94
    for: [csharp, elixir, rust, swift]
    near_bytes: 600
    all:
      - id: dd-argv-tool-source
      - id: dd-zero-input-argument-source
    any:
      - id: dd-interpolated-output-argument
      - id: dd-concatenated-output-argument

  - id: jvm-dd-zero-argv
    desc: JVM builds dd zero-fill argument vector
    crit: notable
    conf: 0.97
    for: [class, java_class]
    all:
      - id: jvm-dd-tool-string
      - id: jvm-dd-zero-input-string
      - id: jvm-dd-output-prefix-string

  - id: lang-exec-dd-urandom-dev
    desc: Language executes dd urandom against device
    crit: suspicious
    conf: 0.92
    for: [python, go, rust, perl, javascript, typescript, c, cpp]
    near_bytes: 500
    all:
      - id: micro-behaviors/process/create/exec::child-process-execution
    any:
      - id: dd-urandom-block-device-command
      - id: dd-urandom-linux-block-device-argv
      - id: dd-urandom-bsd-block-device-argv
    unless:
      # Ginkgo e2e specs are ordinary .go files, so go-test-file misses them.
      - id: metadata/package/testing/compiled::ginkgo-spec-file
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: well-known/tool/detection/ai-guardrail/
      - id: metadata/file/policy/identity::enforced-dangerous-action-approval
      - id: metadata/package/testing/presence/harness::test-directory
      # Image/artifact model tests embed dd argv in JSON fixtures describing a
      # container config (e.g. `"Cmd":["dd","if=/dev/urandom",...]`); the text
      # is described, not executed. Mirrors the go-test-file exclusion on the
      # lang-exec-dd-zero-dev composite below.
      - id: well-known/tool/development/vcs/facebook-sapling::facebook-sapling-member-context
  - id: lang-exec-dd-zero-dev
    desc: Language exec of dd zeroing a device
    crit: suspicious
    conf: 0.92
    for: [python, go, rust, perl, javascript, typescript, c, cpp]
    near_bytes: 500
    all:
      - id: micro-behaviors/process/create/exec::child-process-execution
    any:
      - id: dd-zero-block-device-command
      - id: dd-zero-block-device-argv
      - id: dd-zero-dynamic-device-argv
      - id: micro-behaviors/fs/write/file/shell::go-dd-mount-query-output
      - id: micro-behaviors/fs/write/file/shell::go-dd-mount-table-output
      - id: micro-behaviors/fs/write/file/shell::go-dd-large-dynamic-output
    unless:
      # Deny-rule / guardrail fixtures quote wipe commands as blocked examples.
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: well-known/tool/detection/ai-guardrail/
      - id: metadata/file/policy/identity::enforced-dangerous-action-approval
      - id: metadata/package/testing/presence/harness::go-test-file
      - id: well-known/lib/development/waveloom::waveloom-source-archive-context

  - id: zig-mounted-device-wiper
    desc: Zig wipes mounted devices through a shell
    crit: hostile
    conf: 0.97
    for: [zig]
    near_bytes: 4000
    all:
      - id: lang-mounts-dev-scan
      - id: dd-zero-device-format-source
      - id: micro-behaviors/process/create/direct::zig-child-init
      - id: objectives/command-and-control/dropper/staging/temp::zig-bin-sh-c

  - id: source-mounted-device-wiper
    desc: Source wipes mounted devices through a command
    crit: hostile
    conf: 0.96
    for: [source]
    scope: file
    near_lines: 80
    all:
      - id: lang-mounts-dev-scan
      - id: dd-zero-device-format-source
      - id: micro-behaviors/process/create/exec::child-process-execution

  - id: source-mounted-dynamic-dd-wiper
    desc: Source zero-fills enumerated mounted devices
    crit: hostile
    conf: 0.97
    for: [csharp, elixir, rust, swift]
    scope: file
    near_lines: 80
    all:
      - id: lang-mounts-dev-scan
      - id: dd-zero-dynamic-output-source
      - id: micro-behaviors/process/create/exec::child-process-execution

  - id: source-mounted-dd-wiper
    desc: Source wipes mounted devices with dd
    crit: hostile
    conf: 0.95
    # Go uses the stricter large-overwrite composite below, and shell has its
    # own device-variable rules. Mount enumeration plus a generic dd-zero
    # command is otherwise bound to the nearby execution site.
    for: [scripts, source, -go, -shell]
    scope: file
    near_lines: 80
    all:
      - id: lang-mounts-dev-scan
      - id: micro-behaviors/fs/write/file/shell::dd-zero-input-command
      - id: micro-behaviors/process/create/exec::child-process-execution

  - id: source-mounted-argv-wiper
    desc: Source wipes mounted devices via dd arguments
    crit: hostile
    conf: 0.95
    for: [source, python, rust, perl, javascript, typescript, c, cpp, ruby, php, elixir, java, kotlin, csharp, swift, zig]
    scope: file
    near_lines: 80
    all:
      - id: lang-mounts-dev-scan
      - id: dd-zero-dynamic-device-argv
    any:
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: micro-behaviors/process/create/spawn::spawn-call
      - id: micro-behaviors/process/create/spawn::start
      - id: micro-behaviors/process/create/direct::rust-spawn

  - id: jvm-mounted-device-wiper
    desc: JVM zero-fills enumerated mounted devices
    crit: hostile
    conf: 0.99
    for: [class, java_class]
    all:
      - id: micro-behaviors/fs/proc/mounts::proc-mounts-path
      - id: jvm-dd-zero-argv
      - id: micro-behaviors/process/create/exec::child-process-execution

  - id: go-mounted-large-dd-wiper
    desc: Go zero-fills enumerated mounted devices
    crit: hostile
    conf: 0.98
    for: [go]
    near_lines: 40
    all:
      - id: lang-mounts-dev-scan
      - id: micro-behaviors/fs/write/file/shell::go-dd-large-dynamic-output
      - id: micro-behaviors/process/create/exec::child-process-execution

  - id: lang-exec-shred-dev
    desc: Language executes shred against block device
    crit: suspicious
    conf: 0.94
    for: [python, go, rust, perl, javascript, typescript, c, cpp]
    near_lines: 20
    all:
      - id: shred-block-device-command-text
      - id: micro-behaviors/process/create/exec::child-process-execution
    unless:
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: well-known/tool/detection/ai-guardrail/
      - id: metadata/file/policy/identity::enforced-dangerous-action-approval

  - id: block-device-target
    desc: Targets a raw block device path
    crit: notable
    conf: 0.9
    unless:
      - id: well-known/app/infrastructure/docker::source-tree
      - id: well-known/app/infrastructure/docker::docker-source-archive-context
    any:
      - id: micro-behaviors/fs/enumerate/device::block-device-path-enumeration
      - id: micro-behaviors/hardware/block/device::dev-sd
      - id: micro-behaviors/fs/path/device/storage::unix-block-device-path
      - id: lang-mounts-dev-scan

  - id: block-device-destructive
    desc: Destructive overwrite of a block device
    crit: suspicious
    conf: 0.9
    unless:
      # Ginkgo e2e specs are ordinary .go files, so go-test-file misses them.
      - id: metadata/package/testing/compiled::ginkgo-spec-file
      - id: metadata/file/policy/identity::enforced-dangerous-action-approval
      - id: well-known/tool/detection/ai-guardrail/
    any:
      - id: objectives/impact/wipe/disk/dd::dd-destructive
      - id: objectives/impact/wipe/disk/dd::shell-dd-zero-variable-device
      - id: dd-zero
      - id: dd-random
      - id: shred-dev
      - id: blkdiscard-dev
      - id: dd-zero-to-device-var
      - id: xargs-dd-urandom-pipeline
      - id: go-openfile-block-dev
      - id: rust-open-block-dev
      - id: python-open-block-dev
      - id: node-open-block-dev
      - id: c-open-block-dev
      - id: lang-exec-dd-zero-dev
      - id: lang-exec-dd-urandom-dev
      - id: lang-exec-shred-dev

  - id: unix-block-device-wiper
    desc: Destructive overwrite of a raw block device
    crit: hostile
    conf: 0.95
    # Bind a variable-targeted dd operation to the nearby device path that
    # gives the variable meaning. Without proximity, an ISO builder's
    # unrelated `dd ... of="$uefi_img"` and a later QEMU `/dev/vda` install
    # argument combine into a fictitious disk wipe.
    near_lines: 20
    unless:
      # Ginkgo e2e specs are ordinary .go files, so go-test-file misses them.
      - id: metadata/package/testing/compiled::ginkgo-spec-file
      - id: metadata/package/testing/presence/harness::go-test-file
      - id: well-known/lib/development/waveloom::waveloom-source-archive-context
      - id: metadata/file/policy/identity::enforced-dangerous-action-approval
      # A README showing the reader how to flash a board is instructions:
      # u-boot's doc/README.rockchip spells out `dd if=/dev/zero of=/dev/...`
      # and ships inside QEMU's vendored roms tree.
      - id: metadata/package/documentation/source::readme-any-basename
      # QEMU emulates storage hardware, so its own source opens and
      # overwrites block devices -- subprojects/libvduse/libvduse.c is the
      # userspace block-device backend.
      - id: well-known/tool/development/runtime/qemu::source-tree-path
      # Agent guardrails enumerate `dd if=/dev/zero of=/dev/sda` inside a
      # deny-list they refuse to run; the individual legs already carry this
      # exclusion, so carry it on the composite too.
      - id: well-known/tool/detection/ai-guardrail/
      # A wipe that clears the partition table and is immediately followed
      # by creating a fresh one (sgdisk --new / parted mklabel) is disk
      # provisioning, not destruction: Rook's create-bluestore-partitions.sh
      # zeroes the first 10MB of an operator-supplied `--disk` argument with
      # `dd if=/dev/zero of="$DISK" bs=1M count=10` specifically to clear
      # old GPT/MBR signatures before laying down new Ceph OSD partitions on
      # it. A genuine wiper never repartitions its target afterward.
      - id: micro-behaviors/fs/disk/partition::shell-repartitions-disk
    all:
      - id: block-device-target
    any:
      - id: block-device-destructive
      - id: dd-zero-to-shell-var


  - id: freebsd-geom-dd-wiper
    desc: Wipes FreeBSD disks enumerated by geom
    crit: hostile
    conf: 0.98
    for: [shell]
    all:
      - id: micro-behaviors/fs/enumerate/device::freebsd-geom-disk-list
      - id: objectives/impact/wipe/disk/dd::xargs-dd-pipeline
      - id: micro-behaviors/os/privilege/check::root-privilege-check

  - id: unix-block-device-wiper-shred
    desc: Shreds a raw block device
    crit: hostile
    conf: 0.95
    unless:
      - id: metadata/file/policy/identity::enforced-dangerous-action-approval
    all:
      - id: block-device-target
      - id: shred-dev

  - id: unix-block-device-wiper-discard
    desc: Discards a raw block device
    crit: hostile
    conf: 0.95
    unless:
      - id: metadata/file/policy/identity::enforced-dangerous-action-approval
    all:
      - id: block-device-target
      - id: blkdiscard-dev
