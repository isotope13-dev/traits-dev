defaults:
  platforms: [unix]
  for: [shell, python, go, rust, perl, javascript, typescript, c, cpp]
  attack: T1561.002
  mbc: E1561

# NOTE: a `perl-uid-root-gate` trait (`\$>\s*(!=|==)\s*0`) used to sit here.
# Its matcher only detects "Perl compares its effective UID against 0" — a
# neutral privilege check with no disk-wipe meaning — and it duplicated
# micro-behaviors/os/privilege/check::perl-effective-uid-root-check byte for
# byte, so any root-gated Perl test script was reported under disk wiping.
# Use that capability atom instead.
traits:
- id: dd-zero-device-format-source
  desc: Source formats dd zero fill for device
  crit: notable
  conf: 0.92
  for: [zig, csharp, java, kotlin, elixir, ruby, swift]
  if:
    type: text
    regex: 'dd\s+if=/dev/zero\s+of=.{0,40}(\{s\}|%s|#\{\w+\}|\$\{?\w+)'

  # Managed/systems languages commonly pass dd arguments as an array and
  # construct only the output argument. Keep this narrower than the generic
  # argv atom: it requires dd, zero input, and a dynamically built `of=` value
  # in one short expression. Device provenance is supplied by the mounted-
  # device composite below.
- id: dd-argv-tool-source
  desc: Source names dd as an executable
  crit: notable
  conf: 0.9
  for: [csharp, elixir, rust, swift]
  if:
    type: text
    regex: '["''](/usr/bin/)?dd["'']'

- id: dd-zero-input-argument-source
  desc: Source supplies dd zero input argument
  crit: notable
  conf: 0.9
  for: [csharp, elixir, rust, swift]
  if:
    type: text
    substr: if=/dev/zero

- id: dd-interpolated-output-argument
  desc: Source interpolates dd output argument
  crit: notable
  conf: 0.92
  for: [csharp, rust, swift]
  if:
    type: text
    regex: 'of=(\{[A-Za-z_]{0,32}\}|%s|#\{\w+\}|\$\w+|\\\(.{1,60}\))'

- id: dd-concatenated-output-argument
  desc: Source concatenates dd output argument
  crit: notable
  conf: 0.92
  for: [elixir]
  if:
    type: text
    regex: 'of=["'']\s*(\+|<>)'

- id: jvm-dd-tool-string
  desc: JVM string names dd executable
  crit: notable
  conf: 0.97
  for: [class, java_class]
  if:
    type: value
    path: class.strings[*]
    exact: dd

- id: jvm-dd-zero-input-string
  desc: JVM string names dd zero input
  crit: notable
  conf: 0.97
  for: [class, java_class]
  if:
    type: value
    path: class.strings[*]
    exact: if=/dev/zero

- id: jvm-dd-output-prefix-string
  desc: JVM string builds dd output argument
  crit: notable
  conf: 0.97
  for: [class, java_class]
  if:
    type: value
    path: class.strings[*]
    exact: of=

- id: dd-zero-block-device-argv
  desc: dd argv zero fill targeting block device
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '("dd").{0,80}if=/dev/zero.{0,40}of=/dev/(sd|nvme|vd|xvd|da|ada|loop|mmcblk)'

- id: dd-zero-dynamic-device-argv
  desc: dd argv zero fill dynamic device
  crit: notable
  conf: 0.92
    # Go uses the value-bound matcher below. The remaining language adapters
    # still need migration; a zero-input argument alone does not prove a device.
  for: [python, rust, perl, javascript, typescript, c, cpp]
  if:
    type: text
    regex: '("dd").{0,80}if=/dev/zero'

- id: dd-urandom-block-device-command
  desc: dd urandom block-device command text
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'dd if=/dev/urandom of=/dev/(sd|nvme|vd|xvd|da|ada|loop|mmcblk)'

- id: dd-urandom-linux-block-device-argv
  desc: dd urandom Linux block-device argv
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '"dd".{0,80}if=/dev/urandom.{0,80}of=/dev/(sd|nvme|vd|xvd|loop|mmcblk)'

- id: dd-urandom-bsd-block-device-argv
  desc: dd urandom BSD block-device argv
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '"dd".{0,80}if=/dev/urandom.{0,80}of=/dev/(da|ada)'

  # The command text alone appears in policy engines, documentation, and test
  # vectors. Execution intent is established by the colocated process-creation
  # evidence in the composite below.

- id: shred-block-device-command-text
  desc: Shred block-device command text
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '("shred"|shred ).{0,60}/dev/(sd|nvme|vd|xvd|da|ada)'

composite_rules:
- id: dd-zero-dynamic-output-source
  desc: Builds dynamic dd zero-fill output argument
  crit: notable
  conf: 0.94
  for: [csharp, elixir, rust, swift]
  near_bytes: 600
  all:
  - id: dd-argv-tool-source
  - id: dd-zero-input-argument-source
  any:
  - id: dd-interpolated-output-argument
  - id: dd-concatenated-output-argument

- id: jvm-dd-zero-argv
  desc: JVM builds dd zero-fill argument vector
  crit: notable
  conf: 0.97
  for: [class, java_class]
  all:
  - id: jvm-dd-tool-string
  - id: jvm-dd-zero-input-string
  - id: jvm-dd-output-prefix-string

- id: zig-mounted-device-wiper
  desc: Zig wipes mounted devices through a shell
  crit: hostile
  conf: 0.97
  for: [zig]
  near_bytes: 4000
  all:
  - id: micro-behaviors/fs/proc/mounts::proc-mounts-dev-path-scan
  - id: dd-zero-device-format-source
  - id: micro-behaviors/process/create/direct::zig-child-init
  - id: objectives/command-and-control/dropper/staging/temp::zig-bin-sh-c

- id: source-mounted-device-wiper
  desc: Source wipes mounted devices through a command
  crit: hostile
  conf: 0.96
  for: [java, csharp, swift, kotlin, zig, elixir]
  scope: file
  near_lines: 80
  all:
  - id: micro-behaviors/fs/proc/mounts::proc-mounts-dev-path-scan
  - id: dd-zero-device-format-source
  - id: micro-behaviors/process/create/exec::child-process-execution

- id: source-mounted-dynamic-dd-wiper
  desc: Source zero-fills enumerated mounted devices
  crit: hostile
  conf: 0.97
  for: [csharp, elixir, rust, swift]
  scope: file
  near_lines: 80
  all:
  - id: micro-behaviors/fs/proc/mounts::proc-mounts-dev-path-scan
  - id: dd-zero-dynamic-output-source
  - id: micro-behaviors/process/create/exec::child-process-execution

- id: source-mounted-argv-wiper
  desc: Source wipes mounted devices via dd arguments
  crit: hostile
  conf: 0.95
  for: [python, javascript, rust, c, perl]
  scope: file
  near_lines: 80
  all:
  - id: micro-behaviors/fs/proc/mounts::proc-mounts-dev-path-scan
  - id: dd-zero-dynamic-device-argv
  any:
  - id: micro-behaviors/process/create/exec::child-process-execution
  - id: micro-behaviors/process/create/spawn::spawn-call
  - id: micro-behaviors/process/create/spawn::start
  - id: micro-behaviors/process/create/direct::rust-spawn

- id: jvm-mounted-device-wiper
  desc: JVM zero-fills enumerated mounted devices
  crit: hostile
  conf: 0.99
  for: [class, java_class]
  all:
  - id: micro-behaviors/fs/proc/mounts::proc-mounts-path
  - id: jvm-dd-zero-argv
  - id: micro-behaviors/process/create/exec::child-process-execution

- id: go-mounted-large-dd-wiper
  desc: Go zero-fills enumerated mounted devices
  crit: hostile
  conf: 0.98
  for: [go]
  near_lines: 40
  all:
  - id: micro-behaviors/fs/proc/mounts::proc-mounts-dev-path-scan
  - id: micro-behaviors/fs/write/file/shell::go-dd-large-dynamic-output
  - id: micro-behaviors/process/create/exec::child-process-execution

- id: lang-exec-shred-dev
  desc: Language executes shred against block device
  crit: suspicious
  conf: 0.94
  for: [python, go, rust, perl, javascript, typescript, c, cpp]
  near_lines: 20
  all:
  - id: shred-block-device-command-text
  - id: micro-behaviors/process/create/exec::child-process-execution
  unless:
  - id: well-known/tool/detection/agent-glovebox::archive-context
  - id: well-known/tool/detection/ai-guardrail/
  - id: metadata/file/policy/identity::enforced-dangerous-action-approval

- id: freebsd-geom-dd-wiper
  desc: Wipes FreeBSD disks enumerated by geom
  crit: hostile
  conf: 0.98
  for: [shell]
  all:
  - id: micro-behaviors/fs/enumerate/device::freebsd-geom-disk-list
  - id: objectives/impact/wipe/disk/dd::xargs-dd-pipeline
  - id: micro-behaviors/os/privilege/check::root-privilege-check

- id: unix-block-device-wiper-shred
  for:
  - shell
  - python
  - javascript
  - perl
  desc: Shreds a raw block device
  crit: hostile
  conf: 0.95
  unless:
  - id: metadata/package/testing/presence/harness::test-directory
  - id: metadata/file/policy/identity::enforced-dangerous-action-approval
  - id: well-known/tool/detection/ai-guardrail/
  all:
  - id: "micro-behaviors/fs/path/device/storage::unix-block-device-reference"
  - id: shred-dev
- id: unix-block-device-wiper-discard
  for:
  - shell
  desc: Discards a raw block device
  crit: hostile
  conf: 0.95
  unless:
  - id: disk-provisioning-context
  - id: metadata/file/policy/identity::enforced-dangerous-action-approval
  - id: well-known/tool/detection/ai-guardrail/
  all:
  - id: "micro-behaviors/fs/path/device/storage::unix-block-device-reference"
  - id: micro-behaviors/fs/disk/raw::blkdiscard-dev
