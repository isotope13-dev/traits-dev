defaults:
  platforms:
  - unix
  for:
  - javascript
  - typescript
  - c
  crit: hostile
  conf: 0.99
  attack: T1561.002
  mbc: E1561
composite_rules:
- id: root-check-javascript-dd-device-wiper
  desc: Root script runs dd on a raw device
  crit: hostile
  conf: 0.99
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/os/privilege/check::effective-root-check
  any:
  - id: micro-behaviors/fs/disk/raw::javascript-dd-zero-block-device-argv
  - id: micro-behaviors/fs/disk/raw::javascript-dd-random-block-device-argv
  - id: micro-behaviors/fs/disk/raw::node-execsync-dd-zero-whole-device
  - id: micro-behaviors/fs/disk/raw::node-execsync-dd-random-whole-device
- id: root-check-device-descriptor-zero-write
  desc: Root check with descriptor zero write
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/os/privilege/check::effective-root-check
  - id: micro-behaviors/fs/disk/raw::javascript-raw-device-zero-write
- id: root-check-device-descriptor-zero-loop
  desc: Root check with descriptor zero-fill loop
  all:
  - id: micro-behaviors/os/privilege/check::effective-root-check
  any:
  - id: micro-behaviors/fs/disk/raw::javascript-raw-device-zero-write-loop
  - id: micro-behaviors/fs/disk/raw::c-raw-device-zero-write-loop
