# AcidRain-like raw-storage wipers target embedded Linux flash/block devices.
# The linked technical analysis describes MTD erase IOCTLs, brute-forced device
# paths, bounded overwrite buffers, fsync, and reboot. These rules match that
# behavior rather than the AcidRain family name.
defaults:
  platforms: [unix]
  for: [c, cpp, rust, go, python, javascript, elf, macho]
  attack: T1485

composite_rules:
  - id: raw-storage-target
    desc: Raw embedded storage target
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/hardware/flash/device::mtd
      - id: micro-behaviors/hardware/flash/device::mmc

  - id: raw-storage-write
    desc: Raw-storage target is paired with a write operation
    crit: notable
    conf: 0.9
    all:
      - id: raw-storage-target
    any:
      - id: micro-behaviors/fs/file/write/direct::write
      - id: micro-behaviors/fs/file/write/direct::python-os-write-fd

  - id: raw-storage-reboot
    desc: Reboots after raw-storage operations
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/os/event/shutdown::unix-reboot-api
      - id: objectives/impact/system/shutdown::subprocess-reboot-argv

  - id: linux-raw-storage-wiper
    desc: Linux raw-storage wiper erases and overwrites embedded storage
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/device/ioctl::mtd-erase-ioctl
      - id: raw-storage-target
      - id: raw-storage-write
    near_bytes: 8192
    unless:
      - id: well-known/tool/reverse-engineering/cracknuts::cracknuts-firmware-bundle-path

  - id: linux-raw-storage-wiper-sync-reboot
    desc: Linux raw-storage wiper flushes destructive writes and reboots
    crit: hostile
    conf: 0.99
    all:
      - id: linux-raw-storage-wiper
      - id: micro-behaviors/fs/file/write/sync
      - id: raw-storage-reboot
    near_bytes: 8192
