defaults:
  platforms:
  - unix
  for:
  - python
  - go
  - rust
  crit: hostile
  conf: 0.99
  attack: T1561.002
  mbc: E1561
composite_rules:
- id: root-check-python-dd-raw-device-overwrite
  desc: Root Python dd overwrites a raw device
  crit: hostile
  conf: 0.99
  for:
  - python
  all:
  - id: objectives/impact/wipe/disk/device::root-guarded-python-dd-device-wipe
  - id: micro-behaviors/fs/disk/raw::python-dd-raw-device-overwrite
- id: root-check-go-file-object-zero-write
  desc: Root check with Go raw-device zero write
  for:
  - go
  all:
  - id: micro-behaviors/os/privilege/check::effective-root-check
  - id: micro-behaviors/fs/disk/raw::go-raw-device-zero-write
- id: root-check-rust-file-object-zero-write
  desc: Root check with Rust raw-device zero write
  for:
  - rust
  all:
  - id: micro-behaviors/os/privilege/check::effective-root-check
  - id: micro-behaviors/fs/disk/raw::rust-raw-device-zero-write
- id: root-check-file-object-zero-write
  desc: Root check with raw-device zero write
  for:
  - python
  all:
  - id: micro-behaviors/os/privilege/check::effective-root-check
  any:
  - id: micro-behaviors/fs/disk/raw::python-raw-device-zero-write
  - id: micro-behaviors/fs/disk/raw::python-raw-device-zero-write-loop-condition
  - id: micro-behaviors/fs/disk/raw::python-raw-device-zero-write-open-chain
- id: root-check-file-object-zero-loop
  desc: Root check with file-object zero-fill loop
  all:
  - id: micro-behaviors/os/privilege/check::effective-root-check
  any:
  - id: micro-behaviors/fs/disk/raw::python-raw-device-zero-write-loop
  - id: micro-behaviors/fs/disk/raw::go-raw-device-zero-write-loop
  - id: micro-behaviors/fs/disk/raw::rust-raw-device-zero-write-loop
