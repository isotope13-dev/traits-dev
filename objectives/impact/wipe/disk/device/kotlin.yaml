defaults:
  platforms: [linux]
  for: [kotlin]
  attack: T1561.002
  mbc: E1561

traits:
  - id: kotlin-boot-device-mount-source
    desc: Kotlin resolves boot device from mounts
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?s)private\s+fun\s+bootDevice.{0,300}findmnt.{0,80}/boot.{0,200}/dev/.{0,200}/proc/mounts'
  - id: kotlin-boot-dd-target-binding
    desc: Kotlin passes bootDevice output to dd
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?s)val\s+dev\s*=\s*bootDevice\(\).{0,220}ProcessBuilder.{0,80}"of=\$dev"'
  - id: kotlin-mounted-devices-proc-mounts
    desc: Kotlin reads proc mount table
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?s)fun\s+mountedDevices.{0,180}/proc/mounts'
  - id: kotlin-mounted-devices-dev-source
    desc: Kotlin selects device mount sources
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?s)mountedDevices.{0,360}"/dev/"'
  - id: kotlin-mounted-devices-pair-source
    desc: Kotlin pairs devices with mount paths
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?s)mountedDevices.{0,360}f\[0\]\s+to\s+f\[1\]'
  - id: kotlin-mounted-dd-lambda-binding
    desc: Kotlin sends mounted device variable to dd
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?s)mountedDevices\(\)\.count.{0,160}of=\$dev'
  - id: kotlin-dd-output-start
    desc: Kotlin starts dd with variable output target
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?s)ProcessBuilder\("dd".{0,80}"of=\$dev".{0,140}\)\s*\.start\(\)'

composite_rules:
  - id: kotlin-boot-device-mounted-dd-wiper
    desc: Kotlin sends mounted boot device to dd
    crit: hostile
    conf: 0.98
    all:
      - id: kotlin-boot-device-mount-source
      - id: kotlin-boot-dd-target-binding
  - id: kotlin-mounted-device-dd-wiper
    desc: Kotlin sends enumerated mounted devices to dd
    crit: hostile
    conf: 0.98
    near_lines: 30
    all:
      - id: kotlin-mounted-devices-proc-mounts
      - id: kotlin-mounted-devices-dev-source
      - id: kotlin-mounted-devices-pair-source
      - id: kotlin-mounted-dd-lambda-binding
      - id: kotlin-dd-output-start
