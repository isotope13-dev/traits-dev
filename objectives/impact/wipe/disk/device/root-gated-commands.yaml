composite_rules:
- id: root-shell-dd-device-wiper
  desc: Root-gated shell dd overwrites a device
  for:
  - shell
  all:
  - id: objectives/impact/wipe/disk/device::root-guarded-shell-dd-device-wipe
  - id: micro-behaviors/fs/disk/raw::dd-zero-to-dev
- id: root-perl-dd-device-wiper
  desc: Perl exits non-root before dd write
  for:
  - perl
  all:
  - id: objectives/impact/wipe/disk/device::root-guarded-perl-dd-device-wipe
  - id: objectives/impact/wipe/disk/device::perl-dd-zero-device-operation
- id: root-go-shred-device-wiper
  desc: Root-gated Go shreds a block device
  for:
  - go
  all:
  - id: objectives/impact/wipe/disk/device::root-guarded-go-shred-device-wipe
  - id: objectives/impact/wipe/disk/device::shred-block-device-command-text
- id: root-go-dd-device-wiper
  desc: Root-gated Go dd-writes a block device
  for:
  - go
  all:
  - id: objectives/impact/wipe/disk/device::root-guarded-go-dd-device-wipe
  - id: micro-behaviors/fs/disk/raw::dd-zero-device-command
- id: root-c-dd-device-wiper
  desc: C exits non-root before block-device dd
  for:
  - c
  all:
  - id: objectives/impact/wipe/disk/device::root-guarded-c-dd-device-wipe
  - id: micro-behaviors/fs/disk/raw::c-system-dd-zero-whole-device
- id: root-c-shred-device-wiper
  desc: Root-gated C shreds a block device
  for:
  - c
  all:
