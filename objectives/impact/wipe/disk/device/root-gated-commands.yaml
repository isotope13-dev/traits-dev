defaults:
  platforms:
  - unix
  crit: hostile
  conf: 0.98
  attack: T1561.002
  mbc: E1561
traits:
- id: root-guarded-shell-dd-device-wipe
  desc: Shell root-gates dd zero-fill of device
  crit: notable
  conf: 0.95
  for:
  - shell
  if:
    type: tree-sitter
    query: "((if_statement\n  condition: (test_command) @root_check\n  (command name:\
      \ (command_name (word) @program)) @operation)\n  (#match? @root_check \"id\\\
      \\s+-u.*-eq\\\\s+0\")\n  (#eq? @program \"dd\")\n  (#match? @operation \"^dd\\\
      \\s+if=/dev/zero\\\\s+of=/dev/(sd[a-z]+[0-9]*|x?vd[a-z]+[0-9]*|a?da[0-9]+|nvme[0-9]+n[0-9]+(p[0-9]+)?|mmcblk[0-9]+p?[0-9]*)\"\
      ))\n"
- id: root-guarded-perl-dd-device-wipe
  desc: Perl exits non-root before dd zero-fill
  crit: notable
  conf: 0.95
  for:
  - perl
  if:
    type: tree-sitter
    query: "((source_file\n  (expression_statement (postfix_conditional_expression)\
      \ @root_exit)\n  . (expression_statement (function_call_expression function:\
      \ (function) @system arguments: (list_expression)) @operation))\n  (#match?\
      \ @root_exit \"exit\\\\s+0\\\\s+if\\\\s+\\\\$>\\\\s*!=\\\\s*0\")\n  (#eq? @system\
      \ \"system\")\n  (#match? @operation \"(?s)^system\\\\(\\\\s*[\\\"']dd[\\\"\
      ']\\\\s*,\\\\s*[\\\"']if=/dev/zero[\\\"']\\\\s*,\\\\s*[\\\"']of=/dev/(sd[a-z]+[0-9]*|x?vd[a-z]+[0-9]*|a?da[0-9]+|nvme[0-9]+n[0-9]+(p[0-9]+)?|mmcblk[0-9]+p?[0-9]*)\"\
      ))\n"
- id: perl-dd-zero-device-operation
  desc: Perl zero-fills a device with dd
  crit: notable
  conf: 0.95
  for:
  - perl
  if:
    type: tree-sitter
    query: "((function_call_expression function: (function) @system arguments: (list_expression))\
      \ @operation\n  (#eq? @system \"system\")\n  (#match? @operation \"(?s)^system\\\
      \\(\\\\s*[\\\"']dd[\\\"']\\\\s*,\\\\s*[\\\"']if=/dev/zero[\\\"']\\\\s*,\\\\\
      s*[\\\"']of=/dev/(sd[a-z]+[0-9]*|x?vd[a-z]+[0-9]*|a?da[0-9]+|nvme[0-9]+n[0-9]+(p[0-9]+)?|mmcblk[0-9]+p?[0-9]*)\"\
      ))\n"
- id: root-guarded-go-shred-device-wipe
  desc: Go root-gates shred on block device
  crit: notable
  conf: 0.95
  for:
  - go
  if:
    type: tree-sitter
    query: "((if_statement\n  condition: (binary_expression\n    left: (call_expression\
      \ function: (selector_expression operand: (identifier) @os field: (field_identifier)\
      \ @uid) arguments: (argument_list))\n    operator: \"==\" right: (int_literal)\
      \ @root)\n  consequence: (block (statement_list (assignment_statement) @operation)))\n\
      \  (#eq? @os \"os\") (#eq? @uid \"Geteuid\") (#eq? @root \"0\")\n  (#match?\
      \ @operation \"(?s)exec\\\\.Command\\\\(\\\\s*[\\\"']shred[\\\"'][^)]*[\\\"\
      ']/dev/(sd[a-z]+[0-9]*|x?vd[a-z]+[0-9]*|a?da[0-9]+|nvme[0-9]+n[0-9]+(p[0-9]+)?|mmcblk[0-9]+p?[0-9]*)[^)]*\\\
      \\)\\\\.Run\\\\(\\\\s*\\\\)\"))\n"
- id: root-guarded-go-dd-device-wipe
  desc: Go root-gates dd on block device
  crit: notable
  conf: 0.95
  for:
  - go
  if:
    type: tree-sitter
    query: "((if_statement\n  condition: (binary_expression\n    left: (call_expression\
      \ function: (selector_expression operand: (identifier) @os field: (field_identifier)\
      \ @uid) arguments: (argument_list))\n    operator: \"==\" right: (int_literal)\
      \ @root)\n  consequence: (block (statement_list (assignment_statement) @operation)))\n\
      \  (#eq? @os \"os\") (#eq? @uid \"Geteuid\") (#eq? @root \"0\")\n  (#match?\
      \ @operation \"(?s)exec\\\\.Command\\\\(\\\\s*[\\\"']sh[\\\"']\\\\s*,\\\\s*[\\\
      \"']-c[\\\"']\\\\s*,\\\\s*[\\\"']dd if=/dev/zero of=/dev/(sd[a-z]+[0-9]*|x?vd[a-z]+[0-9]*|a?da[0-9]+|nvme[0-9]+n[0-9]+(p[0-9]+)?|mmcblk[0-9]+p?[0-9]*)\"\
      ))\n"
- id: root-guarded-c-dd-device-wipe
  desc: C exits non-root before dd device write
  crit: notable
  conf: 0.95
  for:
  - c
  if:
    type: tree-sitter
    query: "((function_definition body: (compound_statement\n  (if_statement\n   \
      \ condition: (parenthesized_expression (binary_expression\n      left: (call_expression\
      \ function: (identifier) @geteuid arguments: (argument_list))\n      operator:\
      \ \"!=\" right: (number_literal) @nonroot))\n    consequence: (return_statement))\n\
      \  . (return_statement (call_expression function: (identifier) @system\n   \
      \ arguments: (argument_list . (string_literal) @command)))))\n  (#eq? @geteuid\
      \ \"geteuid\") (#eq? @nonroot \"0\") (#eq? @system \"system\")\n  (#match? @command\
      \ \"dd\\\\s+if=/dev/zero\\\\s+of=/dev/(sd[a-z]+[0-9]*|x?vd[a-z]+[0-9]*|a?da[0-9]+|nvme[0-9]+n[0-9]+(p[0-9]+)?|mmcblk[0-9]+p?[0-9]*)\"\
      ))\n"
- id: root-guarded-c-shred-device-wipe
  desc: C root-gates shred on block device
  crit: notable
  conf: 0.95
  for:
  - c
  if:
    type: tree-sitter
    query: "((if_statement) @guarded\n  (#match? @guarded \"geteuid\")\n  (#match?\
      \ @guarded \"==\\\\s*0\")\n  (#match? @guarded \"system\")\n  (#match? @guarded\
      \ \"shred\\\\s+-n\\\\s+1\")\n  (#match? @guarded \"/dev/(sd[a-z]+[0-9]*|x?vd[a-z]+[0-9]*|a?da[0-9]+|nvme[0-9]+n[0-9]+(p[0-9]+)?|mmcblk[0-9]+p?[0-9]*)\"\
      )\n  (#not-match? @guarded \"else\"))\n"
