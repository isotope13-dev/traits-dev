defaults:
  platforms: [unix]
  for: [rust]
  crit: hostile
  conf: 0.96
  attack: T1561.002
  mbc: E1561
composite_rules:
- id: root-rust-dd-block-device-overwrite
  desc: Root Rust runs dd on a raw device
  near_lines: 30
  all:
  - id: micro-behaviors/os/privilege/check::rust-geteuid-root-check
  - id: micro-behaviors/process/create/direct::rust-command-status-call
  any:
  - id: objectives/impact/wipe/disk/device::dd-zero-block-device-argv
  - id: objectives/impact/wipe/disk/device::dd-urandom-linux-block-device-argv
- id: root-rust-shred-block-device
  desc: Root Rust shreds a raw device
  near_lines: 30
  all:
  - id: micro-behaviors/os/privilege/check::rust-geteuid-root-check
  - id: micro-behaviors/process/create/direct::rust-command-status-call
  - id: objectives/impact/wipe/disk/device::shred-block-device-command-text
- id: root-rust-shell-dd-block-device-overwrite
  desc: Rust shell dd zero-writes a raw device
  near_lines: 30
  all:
  - id: micro-behaviors/os/privilege/check::rust-geteuid-root-check
  - id: micro-behaviors/process/create/shell/runner::rust-shell-command-runner
  - id: micro-behaviors/process/create/direct::rust-command-status-call
  - id: objectives/impact/wipe/disk/device::dd-zero-block-device-command
