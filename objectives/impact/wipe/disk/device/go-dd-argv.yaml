defaults:
  platforms:
  - unix
  for:
  - go
  crit: hostile
  conf: 0.99
  attack: T1561.002
  mbc: E1561
composite_rules:
- id: root-check-run-dd-whole-device
  desc: Root check runs whole-device dd overwrite
  all:
  - id: micro-behaviors/os/privilege/check::effective-root-check
  any:
  - id: micro-behaviors/fs/disk/raw::go-run-dd-zero-whole-device
  - id: micro-behaviors/fs/disk/raw::go-run-dd-urandom-whole-device
