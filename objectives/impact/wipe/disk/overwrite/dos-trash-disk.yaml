defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
traits:
  - id: dos-trash-disk-string
    desc: Threatens disk destruction in DOS binary
    crit: suspicious
    conf: 0.93
    if:
      type: text
      substr: "TRASHIN THE DISK"
  - id: dos-system-halted-string
    desc: Displays system halted message
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "SYSTEM HALTED"
