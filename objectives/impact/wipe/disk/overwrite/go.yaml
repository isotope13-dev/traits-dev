defaults:
  platforms: [windows, linux, macos]
  for: [go, elf, macho, pe]
  attack: T1485
traits:
- id: gutmann-ref--rx-1
  desc: Matches Gutmann wiping reference
  crit: component
  if:
    type: text
    regex: (?i)Gutmann.{0,80}(wipe|wiping)
  unless:
  - id: well-known/lib/platform/libvirt::libvirt-storage-wipe-enum-context
- id: gutmann-ref--rx-2
  desc: Matches Gutmann erasure reference
  crit: component
  if:
    type: text
    regex: (?i)Gutmann.{0,80}(erase|delet)
  unless:
  - id: well-known/lib/platform/libvirt::libvirt-storage-wipe-enum-context
- id: gutmann-ref--rx-3
  desc: Matches Gutmann pass reference
  crit: component
  if:
    type: text
    regex: (?i)Gutmann.{0,80}(pass|35)
  unless:
  - id: well-known/lib/platform/libvirt::libvirt-storage-wipe-enum-context
- id: dod-5220-ref--rx-4
  desc: Matches DoD 5220.22-M wiping reference
  crit: component
  if:
    type: text
    regex: (?i)DoD 5220\.22-M.{0,80}(wipe|wiping)
  unless:
  - id: well-known/lib/platform/libvirt::libvirt-storage-wipe-enum-context
- id: dod-5220-ref--rx-5
  desc: Matches DoD 5220.22-M erasure reference
  crit: component
  if:
    type: text
    regex: (?i)DoD 5220\.22-M.{0,80}(erase|delet)
  unless:
  - id: well-known/lib/platform/libvirt::libvirt-storage-wipe-enum-context
- id: dod-5220-ref--rx-6
  desc: Matches DoD 5220.22-M pass reference
  crit: component
  if:
    type: text
    regex: (?i)DoD 5220\.22-M.{0,80}(pass)
  unless:
  - id: well-known/lib/platform/libvirt::libvirt-storage-wipe-enum-context
- id: vsitr-ref--rx-7
  desc: Matches VSITR wiping reference
  crit: component
  if:
    type: text
    regex: (?i)VSITR.{0,80}(wipe|wiping)
  unless:
  - id: well-known/lib/platform/libvirt::libvirt-storage-wipe-enum-context
- id: vsitr-ref--rx-8
  desc: Matches VSITR erasure reference
  crit: component
  if:
    type: text
    regex: (?i)VSITR.{0,80}(erase|delet)
  unless:
  - id: well-known/lib/platform/libvirt::libvirt-storage-wipe-enum-context
- id: vsitr-ref--rx-9
  desc: Matches VSITR pass reference
  crit: component
  if:
    type: text
    regex: (?i)VSITR.{0,80}(pass)
  unless:
  - id: well-known/lib/platform/libvirt::libvirt-storage-wipe-enum-context
- id: us-dod-ref--rx-10
  desc: Matches US DoD wiping reference
  crit: component
  if:
    type: text
    regex: (?i)US DoD.{0,80}(wipe|wiping)
  unless:
  - id: well-known/lib/platform/libvirt::libvirt-storage-wipe-enum-context
- id: us-dod-ref--rx-11
  desc: Matches US DoD erasure reference
  crit: component
  if:
    type: text
    regex: (?i)US DoD.{0,80}(erase|delet)
  unless:
  - id: well-known/lib/platform/libvirt::libvirt-storage-wipe-enum-context
- id: us-dod-ref--rx-12
  desc: Matches US DoD pass reference
  crit: component
  if:
    type: text
    regex: (?i)US DoD.{0,80}(pass)
  unless:
  - id: well-known/lib/platform/libvirt::libvirt-storage-wipe-enum-context
- id: wipe-rule-profile-names
  desc: Multiple wipe profile names
  crit: suspicious
  conf: 0.96
  for: [go]
  if:
    type: text
    regex: "\\bRule(Fast|Gutmann|VSITR|UsDod5220_22_M)\\b"
- id: wipe-flag-enum-names
  desc: Native and crypto wipe flags
  crit: suspicious
  conf: 0.95
  for: [go]
  if:
    type: text
    regex: "\\bFlag(Native|Crypto)\\b"
- id: wipe-random-mode-labels
  desc: Native and crypto wipe labels
  crit: notable
  conf: 0.9
  for: [go]
  if:
    type: text
    regex: "Random(Native|Crypto)"
- id: gutmann-ruleset-comment
  desc: Gutmann ruleset source comment
  crit: suspicious
  conf: 0.92
  for: [go]
  if:
    type: text
    regex: "Peter Gutmann alghoritm \\(35 passes\\)|lead-in of four random write patterns"
- id: gutmann-hex-1
  desc: Gutmann pattern 92 49 24
  for: [elf, macho, pe]
  crit: notable
  if:
    type: hex
    section: .text
    pattern: 92 49 24 92 49 24
- id: gutmann-hex-2
  desc: Gutmann pattern 49 24 92
  for: [elf, macho, pe]
  crit: notable
  if:
    type: hex
    section: .text
    pattern: 49 24 92 49 24 92
- id: gutmann-hex-3
  desc: Gutmann pattern 24 92 49
  for: [elf, macho, pe]
  crit: notable
  if:
    type: hex
    section: .text
    pattern: 24 92 49 24 92 49
- id: gutmann-hex-4
  desc: Gutmann pattern 6D B6 DB
  for: [elf, macho, pe]
  crit: notable
  if:
    type: hex
    section: .text
    pattern: 6D B6 DB 6D B6 DB
- id: gutmann-hex-5
  desc: Gutmann pattern B6 DB 6D
  for: [elf, macho, pe]
  crit: notable
  if:
    type: hex
    section: .text
    pattern: B6 DB 6D B6 DB 6D
- id: gutmann-hex-6
  desc: Gutmann pattern DB 92 49
  for: [elf, macho, pe]
  crit: notable
  if:
    type: hex
    section: .text
    pattern: DB 92 49 DB 92 49
- id: gutmann-triplet-src-1
  desc: Gutmann triplet 92 49 24 source literal
  crit: notable
  for: [go]
  if:
    type: text
    substr: "\\x92\\x49\\x24"
- id: gutmann-triplet-src-2
  desc: Gutmann triplet 49 24 92 source literal
  crit: notable
  for: [go]
  if:
    type: text
    substr: "\\x49\\x24\\x92"
- id: gutmann-triplet-src-3
  desc: Gutmann triplet 24 92 49 source literal
  crit: notable
  for: [go]
  if:
    type: text
    substr: "\\x24\\x92\\x49"
- id: gutmann-triplet-src-4
  desc: Gutmann triplet 6D B6 DB source literal
  crit: notable
  for: [go]
  if:
    type: text
    substr: "\\x6D\\xB6\\xDB"
    case_insensitive: true
- id: gutmann-triplet-src-5
  desc: Gutmann triplet B6 DB 6D source literal
  crit: notable
  for: [go]
  if:
    type: text
    substr: "\\xB6\\xDB\\x6D"
    case_insensitive: true
- id: gutmann-triplet-src-6
  desc: Gutmann triplet DB 6D B6 source literal
  crit: notable
  for: [go]
  if:
    type: text
    substr: "\\xDB\\x6D\\xB6"
    case_insensitive: true
- id: go-ioutil-readfile
  desc: Go ioutil.ReadFile
  crit: notable
  if:
    type: text
    word: io/ioutil.ReadFile
- id: go-ioutil-writefile
  desc: Go ioutil.WriteFile
  crit: notable
  if:
    type: text
    word: io/ioutil.WriteFile
composite_rules:
- id: giant-string-blob
  desc: Giant embedded string blob
  crit: suspicious
  conf: 0.9
  for: [pe]
  platforms: [windows]
  all:
  - id: metadata/lang/compiler/systems::go-runtime-symbol
  - id: metadata/binary/layout/size::giant-string-blob-metric
- id: secure-wipe-pattern
  for: [go]
  desc: Opens file for read-write and removes
  crit: suspicious
  conf: 0.8
  near_lines: 20
  all:
  - id: micro-behaviors/fs/file/open::os-openfile-rdwr
  - id: micro-behaviors/process/io/write::go-write-method-call
  - id: micro-behaviors/fs/delete/file/library::os-Remove-string
  unless:
  - id: well-known/lib/development/golang-x-tools/
  - id: metadata/package/testing/presence/harness::go-test-file
  # O_CREATE is the normal create/write/error-cleanup pattern used by
  # temporary caches. It does not open an existing victim for wiping.
  - id: micro-behaviors/fs/file/open::os-openfile-create-new
- id: standards-reference
  desc: References to secure wiping standards
  crit: component
  conf: 0.9
  any:
  - id: gutmann-ref
  - id: dod-5220-ref
  - id: vsitr-ref
  - id: us-dod-ref
- id: gutmann-patterns
  desc: Uses Gutmann secure deletion overwrite
  crit: suspicious
  conf: 0.95
  needs: 5
  any:
  - id: gutmann-hex-1
  - id: gutmann-hex-2
  - id: gutmann-hex-3
  - id: gutmann-hex-4
  - id: gutmann-hex-5
  - id: gutmann-hex-6
  unless:
  - id: well-known/game/steamtools::member
  - id: well-known/lib/network/steamkit2::library
- id: gutmann-byte-triplets-source
  desc: Multiple Gutmann overwrite triplets in source
  crit: suspicious
  conf: 0.95
  for: [go]
  needs: 5
  any:
  - id: gutmann-triplet-src-1
  - id: gutmann-triplet-src-2
  - id: gutmann-triplet-src-3
  - id: gutmann-triplet-src-4
  - id: gutmann-triplet-src-5
  - id: gutmann-triplet-src-6
- id: go-math-rand
  desc: Go random overwrite helper
  crit: component
  near_bytes: 600
  all:
  - id: micro-behaviors/os/random/prng/stdlib::go-math-rand-pkg
  - id: micro-behaviors/os/random/generator::go-random-string-bytes-helper
- id: overwrite-randomizer
  desc: Random overwrite data generator
  crit: suspicious
  conf: 0.9
  all:
  - id: go-math-rand
  any:
  - id: go-ioutil-readfile
- id: random-overwrite-walk
  desc: Walks files and overwrites with random data
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/fs/directory/traverse::filepath-walk
  - id: overwrite-randomizer
  any:
  - id: micro-behaviors/fs/write/file/full::ioutil-write-file
  - id: go-ioutil-writefile
- id: secure-wiper
  desc: Highly confident secure wiper
  crit: suspicious
  conf: 0.99
  mbc: B0031
  needs: 2
  any:
  - id: secure-wipe-pattern
  - id: micro-behaviors/fs/directory/traverse::go-recursive-removeall
  - id: standards-reference
  - id: wipe-rule-profile-names
  - id: gutmann-ruleset-comment
  - id: gutmann-patterns
- id: go-disk-wiper
  desc: Go disk wiper
  crit: hostile
  conf: 0.95
  attack: T1561
  for: [go]
  all:
  - id: secure-wipe-pattern
  any:
  - id: standards-reference
  - id: objectives/anti-static/obfuscation/payload/encoded::giant-string-blob
- id: go-wipe-rules-library
  desc: Go multi-standard wipe rules library
  crit: hostile
  conf: 0.97
  for: [go]
  all:
  - id: wipe-rule-profile-names
  - id: standards-reference
  any:
  - id: wipe-flag-enum-names
  - id: wipe-random-mode-labels
  - id: gutmann-ruleset-comment
  - id: gutmann-byte-triplets-source
  - id: gutmann-patterns
- id: fake-upx-random-overwrite-wiper
  for: [pe]
  desc: Fake UPX Go random overwrite wiper
  crit: hostile
  conf: 0.98
  all:
  - id: random-overwrite-walk
  - id: metadata/binary/section/label::empty-rwx-upx0
  - id: metadata/binary/section/entropy::large-rwx-upx1-section
  - id: metadata/binary/layout/overlay::large-overlay-64k
  - id: giant-string-blob
- id: gutmann-ref
  desc: Gutmann wipe standard reference
  crit: component
  conf: 1.0
  any:
  - id: gutmann-ref--rx-1
  - id: gutmann-ref--rx-2
  - id: gutmann-ref--rx-3
- id: dod-5220-ref
  desc: DoD 5220.22-M wipe standard
  crit: component
  conf: 1.0
  any:
  - id: dod-5220-ref--rx-4
  - id: dod-5220-ref--rx-5
  - id: dod-5220-ref--rx-6
- id: vsitr-ref
  desc: VSITR wipe standard
  crit: component
  conf: 1.0
  any:
  - id: vsitr-ref--rx-7
  - id: vsitr-ref--rx-8
  - id: vsitr-ref--rx-9
- id: us-dod-ref
  desc: US DoD wipe reference
  crit: component
  conf: 1.0
  any:
  - id: us-dod-ref--rx-10
  - id: us-dod-ref--rx-11
  - id: us-dod-ref--rx-12
