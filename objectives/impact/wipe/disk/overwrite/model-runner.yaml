defaults:
  for: [shell]
  platforms: [macos]
traits:
  - id: inference-log-vm-disk-target
    desc: Inference log targets Docker VM disk
    crit: notable
    if:
      type: text
      regex: '--log-file[ =]+[^\s"'']{0,180}/vms/[0-9]+/data/Docker\.raw\b'
      exclude_comments: true
composite_rules:
  - id: model-runner-vm-disk-overwrite
    desc: Model Runner log overwrite targets the Docker VM disk
    crit: hostile
    attack: T1485
    near_lines: 24
    all:
      - id: objectives/execution/exploit/parser-confusion::model-runner-log-path-injection
      - id: inference-log-vm-disk-target
      - id: micro-behaviors/os/container/runtime::model-runner-completion-route
