# Managed implementations of the same destructive technique. This covers
# PowerShell scripts that embed C# as well as standalone C# source.
defaults:
  platforms: [windows]
  for: [powershell, csharp]
  attack: T1485

traits:
  - id: managed-random-byte-fill
    desc: Fills a byte buffer with pseudorandom data
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)new\s+Random\s*\(\s*\)[\s\S]{0,160}\.NextBytes\s*\('

  - id: managed-relative-seek
    desc: Seeks relative within a managed file stream
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\b(stream|fileStream)\s*\.\s*Seek\s*\([^)]{0,100}SeekOrigin\.Current'

composite_rules:
  - id: managed-strided-file-overwrite
    desc: Writes then seeks within a file stream
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/file/write/stream::stream-object-write-call
      - id: managed-relative-seek
    near_lines: 4

  - id: managed-strided-file-wiper
    desc: Managed pseudorandom strided file-corruption wiper
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/fs/file/write/stream::filestream-write-access
      - id: managed-random-byte-fill
      - id: managed-strided-file-overwrite

  - id: managed-recursive-file-wiper
    desc: Managed file-corruption wiper over a recursive file enumeration
    crit: hostile
    conf: 0.998
    for: [powershell]
    all:
      - id: managed-strided-file-wiper
      - id: micro-behaviors/fs/enumerate/directory::powershell-recursive-file-enumeration
