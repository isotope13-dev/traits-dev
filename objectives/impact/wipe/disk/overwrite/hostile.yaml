defaults:
  platforms: [unix, windows, macos]
composite_rules:
  - id: hostile-wiper
    desc: "Hostile Disk Wiper"
    crit: suspicious
    conf: 1.0
    any:
      # Notable mentions (autoexec.bat in a build guide, a userdata status
      # string) live in this directory too. They are not a wipe by themselves.
      - id: objectives/impact/wipe/disk/format::format-c
      - id: objectives/impact/wipe/disk/format::format-c-no-colon
      - id: objectives/impact/wipe/disk/format::format-c-quiet-autotest
      - id: objectives/impact/wipe/disk/format::script-autoexec-format-wiper
      - id: objectives/impact/wipe/disk/format::batch-echo-letter-format
      - id: objectives/impact/wipe/disk/format::batch-confirmed-format-wiper
      - id: objectives/impact/wipe/disk/format::batch-letter-confirmed-format
      - id: objectives/impact/wipe/disk/format::remove-mdm-format-userdata
      - id: objectives/impact/wipe/disk/format::safe-format-userdata
      - id: objectives/impact/wipe/disk/format::android-userdata-service-wipe
      - id: micro-behaviors/fs/delete/directory::recursive-root
