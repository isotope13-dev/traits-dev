# Native Windows file-corruption wipers. The atoms are existing Win32
# capabilities; the composites require them to be used together as a mass
# overwrite/delete traversal rather than treating any one API as malicious.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  attack: T1485

composite_rules:
  - id: native-file-overwrite-sequence
    desc: Native Windows code repositions a file handle and writes data
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/file/open::file-create-win
      - id: micro-behaviors/fs/file/handle::set-file-pointer-ex
    any:
      - id: micro-behaviors/fs/file/write/direct::write-file-source
      - id: micro-behaviors/fs/file/write/direct::writefile-api

  - id: native-file-tree-walk
    desc: Native code walks a Windows file tree
    crit: notable
    conf: 0.93
    for: [c, cpp]
    all:
      - id: micro-behaviors/fs/enumerate/directory::find-first-file-source
      - id: micro-behaviors/fs/enumerate/directory::find-next-file-source

  - id: native-drive-type-enumeration
    desc: Native code enumerates drives and types
    crit: notable
    conf: 0.93
    for: [c, cpp]
    all:
      - id: micro-behaviors/fs/traversal/drives::get-logical-drives
      - id: micro-behaviors/fs/traversal/drives::get-drive-type-source

  - id: native-file-traversal-source
    desc: Native code traverses drives and file trees
    crit: notable
    conf: 0.95
    for: [c, cpp]
    all:
      - id: native-file-tree-walk
      - id: native-drive-type-enumeration

  - id: native-file-traversal-pe
    desc: Windows binary traverses drives and file trees
    crit: notable
    conf: 0.95
    for: [pe, dll]
    all:
      - id: micro-behaviors/fs/enumerate/directory::find-file-walker-wide
      - id: micro-behaviors/fs/traversal/drives::logical-drive-type-enumeration

  - id: windows-file-corruption-wiper
    desc: Native Windows mass file-corruption and deletion wiper
    crit: hostile
    conf: 0.995
    for: [c, cpp]
    all:
      - id: native-file-overwrite-sequence
      - id: micro-behaviors/fs/file/delete::delete-win
      - id: native-file-traversal-source

  - id: windows-file-corruption-wiper-pe
    desc: Windows binary mass file-corruption wiper
    crit: hostile
    conf: 0.995
    for: [pe, dll]
    all:
      - id: native-file-overwrite-sequence
      - id: micro-behaviors/fs/file/delete::delete-win
      - id: native-file-traversal-pe

  - id: windows-file-corruption-wiper-shutdown
    desc: Native file-corruption wiper followed by system shutdown
    crit: hostile
    conf: 0.998
    for: [c, cpp]
    all:
      - id: windows-file-corruption-wiper
      - id: micro-behaviors/ui/window/manage/control::exit-windows-ex

  - id: windows-file-corruption-wiper-shutdown-pe
    desc: Windows wiper followed by system shutdown
    crit: hostile
    conf: 0.998
    for: [pe, dll]
    all:
      - id: windows-file-corruption-wiper-pe
      - id: micro-behaviors/ui/window/manage/control::exit-windows-ex
