# Native Windows file-corruption wipers. The atoms are existing Win32
# capabilities; the composites require them to be used together as a mass
# overwrite/delete traversal rather than treating any one API as malicious.
#
# The neutral halves of that pairing -- "repositions a handle and writes" and
# "enumerates drives and walks file trees" -- describe what installers, backup
# tools and file managers do all day, so they live with the capabilities they
# detect (micro-behaviors/fs/...) and are referenced from here. Only the
# combinations below infer wiper intent.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  attack: T1485

composite_rules:
  - id: windows-file-corruption-wiper
    desc: Native Windows mass file-corruption and deletion wiper
    crit: hostile
    conf: 0.995
    for: [c, cpp]
    all:
      - id: micro-behaviors/fs/file/write/positioned::positioned-file-overwrite
      - id: micro-behaviors/fs/file/delete::delete-win
      - id: micro-behaviors/fs/traversal/drives::drive-and-file-tree-traversal-source
    unless:
      # Ruby MRI win32.c implements the interpreter's Windows FS layer with
      # CreateFile/SetFilePointer/DeleteFile/FindFirstFile across the file;
      # that is not a mass-overwrite wiper.
      - id: well-known/lib/runtime/cruby::source-tree

  - id: windows-file-corruption-wiper-pe
    desc: Windows binary mass file-corruption wiper
    crit: hostile
    conf: 0.995
    for: [pe, dll]
    all:
      - id: micro-behaviors/fs/file/write/positioned::positioned-file-overwrite
      - id: micro-behaviors/fs/file/delete::delete-win
      - id: micro-behaviors/fs/traversal/drives::drive-and-file-tree-traversal

  - id: windows-file-corruption-wiper-shutdown
    desc: Native file-corruption wiper followed by system shutdown
    crit: hostile
    conf: 0.998
    for: [c, cpp]
    all:
      - id: windows-file-corruption-wiper
      - id: micro-behaviors/ui/window/manage/control::exit-windows-ex

  - id: windows-file-corruption-wiper-shutdown-pe
    desc: Windows wiper followed by system shutdown
    crit: hostile
    conf: 0.998
    for: [pe, dll]
    all:
      - id: windows-file-corruption-wiper-pe
      - id: micro-behaviors/ui/window/manage/control::exit-windows-ex
