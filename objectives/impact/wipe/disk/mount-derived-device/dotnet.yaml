defaults:
  platforms: [unix, windows]
  for: [csharp]
  crit: hostile
  conf: 0.98
  attack: T1561.002
  mbc: E1561

composite_rules:
  - id: dotnet-mounted-device-dd-wiper
    desc: .NET zero-fills filtered mounted devices
    near_lines: 80
    scope: file
    all:
      - id: micro-behaviors/fs/proc/mounts::proc-mounts-dev-path-scan
      - id: objectives/impact/wipe/disk/device::dd-zero-dynamic-output-source
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start
