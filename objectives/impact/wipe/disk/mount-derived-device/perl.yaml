defaults:
  platforms: [unix]
  for: [perl]
  crit: notable
  conf: 0.96
traits:
  - id: perl-boot-device-source-filter
    desc: Perl filters device source paths
    if:
      type: text
      regex: '\$dev\s*=~\s*m\{\^/dev/\}'
  - id: perl-boot-device-binding
    desc: Perl binds the selected boot device
    if:
      type: text
      regex: 'my\s+\$dev\s*=\s*boot_device\s*\(\s*\)'
  - id: perl-dd-execution
    desc: Perl executes dd with zero input
    if:
      type: symbol
      kind: call
      exact: exec
      args:
        - index: 0
          exact: dd
        - exact: if=/dev/zero
  - id: perl-dd-target-bound-to-device
    desc: Perl dd zeroes a device variable
    crit: suspicious
    if:
      type: symbol
      kind: call
      exact: exec
      args:
        - index: 0
          exact: dd
        - exact: of=$dev
        - exact: if=/dev/zero
  # Only ever a counter-signal: the wiper composites below stand down when the
  # script rebinds `$dev` to a fixed path. `$dev = "/dev/cdrom"` is also how
  # any device-taking tool (a CD ripper's configuration) names its default, so
  # on its own the assignment indicates nothing.
  - id: perl-device-reassignment
    desc: Perl replaces the selected device
    crit: notable
    if:
      type: text
      regex: '\$dev\s*=\s*["\x27]'
  - id: perl-mounted-device-source
    desc: Perl retains mounted device sources
    if:
      type: text
      regex: 'push\s+@out\s*,\s*\[\$dev\s*,\s*\$mp\]\s*if\s+\$dev\s*&&\s*\$dev\s*=~\s*m\{\^/dev/\}'
  - id: perl-mounted-device-binding
    desc: Perl binds each mounted device
    if:
      type: text
      regex: 'my\s+\(\$dev\)\s*=\s*@\$pair'
composite_rules:
  - id: perl-mounted-boot-device-mbr-dd-wiper
    desc: Perl zeroes a mounted boot device
    crit: hostile
    attack: T1561.001
    mbc: E1561
    conf: 0.96
    scope: file
    all:
      - id: perl-boot-device-source-filter
      - id: perl-boot-device-binding
      - id: perl-dd-execution
      - id: perl-dd-target-bound-to-device
      - id: micro-behaviors/fs/proc/mounts::proc-mounts-path
    unless:
      - id: perl-device-reassignment
  - id: perl-mounted-devices-dd-wiper
    desc: Perl zeroes devices read from mounts
    crit: hostile
    attack: T1561.001
    mbc: E1561
    conf: 0.96
    scope: file
    all:
      - id: perl-mounted-device-source
      - id: perl-mounted-device-binding
      - id: perl-dd-execution
      - id: perl-dd-target-bound-to-device
      - id: micro-behaviors/fs/proc/mounts::proc-mounts-path
    unless:
      - id: perl-device-reassignment
