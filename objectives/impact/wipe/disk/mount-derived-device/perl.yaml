defaults:
  platforms: [unix]
  for: [perl]
  crit: suspicious
  conf: 0.96
  attack: T1561.002
  mbc: E1561
traits:
  - id: perl-boot-device-source-filter
    desc: Perl selects a mounted boot source
    if:
      type: text
      regex: '\$dev\s*=~\s*m\{\^/dev/\}'
  - id: perl-boot-device-binding
    desc: Perl binds the selected boot device
    if:
      type: text
      regex: 'my\s+\$dev\s*=\s*boot_device\s*\(\s*\)'
  - id: perl-dd-execution
    desc: Perl executes dd with zero input
    if:
      type: text
      regex: 'exec\s+\x27dd\x27'
  - id: perl-dd-target-bound-to-device
    desc: Perl passes selected device to dd
    if:
      type: text
      substr: '"of=$dev"'
  - id: perl-device-reassignment
    desc: Perl replaces the selected device
    if:
      type: text
      regex: '\$dev\s*=\s*["\x27]'
  - id: perl-mounted-device-source
    desc: Perl retains mounted device sources
    if:
      type: text
      regex: 'push\s+@out\s*,\s*\[\$dev\s*,\s*\$mp\]\s*if\s+\$dev\s*&&\s*\$dev\s*=~\s*m\{\^/dev/\}'
  - id: perl-mounted-device-binding
    desc: Perl binds each mounted device
    if:
      type: text
      regex: 'my\s+\(\$dev\)\s*=\s*@\$pair'
composite_rules:
  - id: perl-mounted-boot-device-mbr-dd-wiper
    desc: Perl zeroes a mounted boot device MBR
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: perl-boot-device-source-filter
      - id: perl-boot-device-binding
      - id: perl-dd-execution
      - id: perl-dd-target-bound-to-device
    unless:
      - id: perl-device-reassignment
  - id: perl-mounted-devices-dd-wiper
    desc: Perl zeroes devices read from mounts
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: perl-mounted-device-source
      - id: perl-mounted-device-binding
      - id: perl-dd-execution
      - id: perl-dd-target-bound-to-device
    unless:
      - id: perl-device-reassignment
