defaults:
  platforms: [unix]
  for: [c]
  conf: 0.96
  attack: T1561.002
  mbc: E1561
traits:
  - id: c-dev-path-filter
    desc: C filters mounted device paths
    crit: component
    if:
      type: text
      regex: 'strncmp\s*\(\s*dev\s*,\s*"/dev/"'
  - id: c-boot-device-mbr-format
    desc: C formats a zero-fill MBR write
    crit: notable
    if:
      type: text
      substr: 'dd if=/dev/zero of=%s bs=446 count=1'
  - id: c-dd-target-bound-to-device
    desc: Formats dd target from dev variable
    crit: component
    if:
      type: text
      regex: 'of=%s[\s\S]{0,100},\s*dev\s*\)'
  - id: c-mounted-device-source
    desc: C reads mounted device sources
    crit: component
    if:
      type: text
      regex: '(?s)["\x27]/proc/mounts["\x27].{0,300}sscanf\s*\(\s*line'
  - id: c-mounted-device-dd-format
    desc: C formats dd zero writes
    crit: notable
    if:
      type: text
      substr: 'dd if=/dev/zero of=%s bs=1M'
composite_rules:
  - id: c-mounted-boot-device-mbr-dd-wiper
    desc: C zeroes a mounted boot device MBR
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: c-dev-path-filter
      - id: c-boot-device-mbr-format
      - id: c-dd-target-bound-to-device
      - id: micro-behaviors/process/create/shell/native::c-system-call
    unless:
      - id: micro-behaviors/data/property/assign::c-dev-temp-path-assignment
  - id: c-mounted-filesystem-dd-device-wiper
    desc: C zeroes mounted filesystem devices
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: c-mounted-device-source
      - id: c-dev-path-filter
      - id: c-mounted-device-dd-format
      - id: c-dd-target-bound-to-device
      - id: micro-behaviors/process/create/shell/native::c-system-call
    unless:
      - id: micro-behaviors/data/property/assign::c-dev-temp-path-assignment
