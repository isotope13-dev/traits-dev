defaults:
  platforms: [linux]
  for: [c]
  crit: hostile
  conf: 0.97
  attack: T1561.002
  mbc: E1561

composite_rules:
  - id: c-mounted-boot-device-zero-write
    desc: Zeroes device selected from boot mount
    near_bytes: 0
    all:
      - id: micro-behaviors/process/create/construction::c-formats-boot-mount-zero-command
      - id: micro-behaviors/fs/write/file/shell::c-runs-formatted-zero-write-command

  - id: c-mounted-filesystem-dd-device-wiper
    desc: Zeroes devices selected from filesystem mounts
    near_bytes: 0
    all:
      - id: micro-behaviors/process/create/construction::c-formats-mounted-filesystem-zero-command
      - id: micro-behaviors/fs/write/file/shell::c-runs-formatted-zero-write-command
