defaults:
  platforms: [linux]
  for: [ruby]
  attack: T1561.002
  mbc: E1561

traits:
  - id: ruby-mounts-filter-map
    desc: Ruby filters mount table rows
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: File.readlines('/proc/mounts').filter_map do |line|

  - id: ruby-mounted-dev-pair
    desc: Ruby retains filtered device pairs
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: "[dev, mp] if dev.start_with?('/dev/')"

  - id: ruby-ext-filesystem-filter
    desc: Ruby filters filesystem types
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: KEEP_FS.include?(fs)

  - id: ruby-mounted-wipe-env-gate
    desc: Ruby gates mounted-device wiping
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'def stress_devices\s*return 0 unless ENV\[''TXJXHHXWMFM''\]'

  - id: ruby-mounted-pair-iteration
    desc: Ruby iterates mounted device pairs
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'mounted_devices.each do |dev, _mp|'

  - id: ruby-mounted-dd-target
    desc: Ruby binds mounted device to dd
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?s)\|dev, _mp\|\s*Process\.detach\(spawn\(''dd'', ''if=/dev/zero'', "of=#\{dev\}"'

  - id: ruby-findmnt-boot-source
    desc: Ruby queries mounted boot source
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: findmnt -no SOURCE /boot

  - id: ruby-root-mount-device-fallback
    desc: Ruby selects root mount device
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: "mp == '/'"

  - id: ruby-boot-wipe-env-gate
    desc: Ruby gates boot-device wiping
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'def reset_bootloader\s*return false unless ENV\[''GKJTNJBFY''\]'

  - id: ruby-boot-device-target
    desc: Ruby binds boot device to dd
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'if \(dev = boot_device\)\s*Process\.detach\(spawn\(''dd'', ''if=/dev/zero'', "of=#\{dev\}"'

  - id: ruby-boot-device-mbr-write
    desc: Ruby requests an MBR-sized dd write
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'bs=446''\s*,\s*''count=1''\s*,\s*''conv=notrunc'

composite_rules:
  - id: ruby-mounted-device-dd-wiper
    desc: Ruby zero-fills filtered mounted devices
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 1400
    all:
      - id: ruby-mounts-filter-map
      - id: ruby-mounted-dev-pair
      - id: ruby-ext-filesystem-filter
      - id: ruby-mounted-wipe-env-gate
      - id: ruby-mounted-pair-iteration
      - id: ruby-mounted-dd-target

  - id: ruby-boot-mounted-device-mbr-dd-wiper
    desc: Ruby zeroes selected boot device MBR
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 1400
    all:
      - id: ruby-findmnt-boot-source
      - id: ruby-root-mount-device-fallback
      - id: ruby-boot-wipe-env-gate
      - id: ruby-boot-device-target
      - id: ruby-boot-device-mbr-write
