defaults:
  platforms: [unix]
  for: [php]
  attack: T1561.002
  mbc: E1561

traits:
  - id: php-boot-source-query
    desc: PHP queries the boot mount source
    crit: component
    conf: 0.97
    if:
      type: text
      substr: findmnt -no SOURCE /boot
  - id: php-boot-device-filter
    desc: PHP filters a boot device path
    crit: component
    conf: 0.97
    if:
      type: text
      regex: 'str_starts_with\(\s*\$dev\s*,\s*[''"]?/dev/'
  - id: php-boot-device-dd-target
    desc: PHP passes boot source to dd
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?s)self::bootDevice\(\).{0,220}?escapeshellarg\(\$dev\)'
  - id: php-boot-mbr-dd-command
    desc: PHP builds an MBR zeroing command
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: dd if=/dev/zero of=%s bs=446 count=1 conv=notrunc
  - id: php-dd-process-start
    desc: PHP starts the dd command
    crit: component
    conf: 0.97
    if:
      type: text
      substr: proc_open($cmd
  - id: php-boot-wipe-activation
    desc: PHP gates boot wiping by environment
    crit: component
    conf: 0.97
    if:
      type: text
      substr: getenv('TRWWPECBO')
  - id: php-mounted-source-table
    desc: PHP reads the mount table
    crit: component
    conf: 0.97
    if:
      type: text
      regex: 'file_get_contents\(\x27/proc/mounts\x27\)'
  - id: php-mounted-device-filter
    desc: PHP filters mounted device sources
    crit: component
    conf: 0.97
    if:
      type: text
      regex: 'str_starts_with\(\$f\[0\],\s*[''"]?/dev/'
  - id: php-mounted-device-pair
    desc: PHP returns the device and mount path
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '\$out\[\]\s*=\s*\[\$f\[0\],\s*\$f\[1\]\]'
  - id: php-mounted-device-dd-target
    desc: PHP passes mounted source to dd
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?s)as\s*\[\$dev\]\).{0,220}?escapeshellarg\(\$dev\)'
  - id: php-mounted-dd-command
    desc: PHP builds a mounted-device zeroing command
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: dd if=/dev/zero of=%s bs=1M count=4096
  - id: php-mounted-wipe-activation
    desc: PHP gates device wiping by environment
    crit: component
    conf: 0.97
    if:
      type: text
      substr: getenv('JCYCZBORMVO')

composite_rules:
  - id: php-boot-device-mbr-dd-wiper
    desc: PHP wipes mounted boot device MBR
    crit: hostile
    conf: 0.97
    scope: file
    near_lines: 50
    all:
      - id: php-boot-source-query
      - id: php-boot-device-filter
      - id: php-boot-device-dd-target
      - id: php-boot-mbr-dd-command
      - id: php-dd-process-start
      - id: php-boot-wipe-activation
  - id: php-mounted-device-dd-wiper
    desc: PHP overwrites 4 GiB from each mounted device start with zeros
    crit: hostile
    conf: 0.97
    scope: file
    near_lines: 50
    all:
      - id: php-mounted-source-table
      - id: php-mounted-device-filter
      - id: php-mounted-device-pair
      - id: php-mounted-device-dd-target
      - id: php-mounted-dd-command
      - id: php-dd-process-start
      - id: php-mounted-wipe-activation
