# Python boot-device MBR wiping. The implant resolves the device backing
# /boot (findmnt, falling back to the root row of /proc/mounts), then zeroes
# exactly the 446-byte boot-code area with dd (bs=446 count=1 conv=notrunc),
# preserving the partition table so the damage looks like corruption rather
# than a wiped disk. The 446-byte size is the durable invariant: full-sector
# wipes use bs=512, and unrelated dd uses never pair a dynamic boot-device
# target with that size.
defaults:
  platforms: [linux]
  for: [python]
  attack: T1561.002
  mbc: E1561

traits:
  - id: python-findmnt-boot-source
    desc: Python queries the boot mount source
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'findmnt.{0,60}/boot'

  - id: python-root-mount-device-fallback
    desc: Python selects root mount device
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'mp\s*==\s*[''"]/'

  - id: python-mbr-sized-write
    desc: Python requests an MBR-sized dd write
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'bs=446[\s\S]{0,30}count=1'

composite_rules:
  - id: python-boot-device-mbr-dd-wiper
    desc: Python zeroes the boot device MBR
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 1400
    all:
      - id: python-findmnt-boot-source
      - id: python-root-mount-device-fallback
      - id: python-mbr-sized-write
      - id: micro-behaviors/process/create/exec::child-process-execution
    any:
      # Argv-array ("dd", ..., if=/dev/zero) and shell-string (dd if=/dev/zero)
      # spellings of the same zero-input step.
      - id: objectives/impact/wipe/disk/device::dd-zero-dynamic-device-argv
      - id: micro-behaviors/fs/write/file/shell::dd-zero-input-command
