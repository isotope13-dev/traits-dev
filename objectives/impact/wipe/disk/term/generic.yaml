defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
- id: diskutil-bin
  desc: diskutil utility reference
  crit: notable
  conf: 0.65
  platforms: [macos]
  if:
    type: text
    exact: /usr/bin/diskutil
- id: secureerase-subcommand
  desc: diskutil secureErase subcommand
  crit: notable
  conf: 0.7
  platforms: [macos]
  if:
    type: text
    exact: secureErase
- id: freespace-target
  desc: diskutil freespace target
  crit: notable
  conf: 0.7
  platforms: [macos]
  if:
    type: text
    exact: freespace
- id: wipe-disk
  desc: wipe disk phrase
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: wipe disk
    case_insensitive: true
  not:
      # Cache and storage maintenance comments (e.g. "wipe disk cache")
      # describe clearing cached files, not destructive disk wiping.
  - regex: '(?i)wipe disk\s+(cache|cached|data|files?)\b'
  unless:
  - id: metadata/binary/resource/identity::resource-only-dll-context
- id: wipe-drive
  desc: wipe drive phrase
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: '\bwipe drive\b'
    case_insensitive: true
  unless:
  - id: metadata/binary/resource/identity::resource-only-dll-context
- id: disk-wipe
  desc: disk wipe phrase
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: '\bdisk\s+wipe\b'
    case_insensitive: true
  unless:
      # Resource-only Windows UI can legitimately report a completed disk
      # wipe; the phrase alone is not an operation performed by the file.
  - id: metadata/binary/resource/identity::resource-only-dll-context
- id: secure-erase
  desc: secure erase phrase
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: '(?i)secure\s*erase\b[^\n]{0,40}'
  not:
      # Documentation can explicitly disclaim secure-erasure guarantees.
  - regex: '(?i)\b(no|without)\s+secure erase\b'
  - regex: '(?i)secure\s*erase\s+(of\s+)?free\s*space'
  - regex: '(?i)secureErase\s+freespace'
  unless:
  - id: metadata/binary/resource/identity::resource-only-dll-context
  downgrade:
    any:
    - id: metadata/binary/resource/identity::kernel-driver-init
    - id: metadata/binary/resource/identity::kernel-driver-idata
composite_rules:
- id: diskutil-secure-erase-freespace
  for: [binaries, '!dex', '!elf', '!pe', applescript, javascript, lua, perl, php, python, ruby, shell]
  desc: macOS diskutil free-space erase
  crit: notable
  conf: 0.92
  mbc: E1561
  all:
  - id: diskutil-bin
  - id: secureerase-subcommand
  - id: freespace-target
- id: destructive-wipe-phrase
  desc: Explicit destructive wipe phrase
  crit: component
  conf: 0.75
  any:
  - id: wipe-disk
  - id: wipe-drive
  - id: disk-wipe
  - id: secure-erase
- id: disk-target-phrase
  desc: Low-level disk target phrase
  crit: component
  conf: 0.7
  any:
  - id: micro-behaviors/fs/disk/partition::mbr-reference
  - id: boot-sector
  - id: master-boot-record
  - id: micro-behaviors/fs/path/device/storage::dev-ada
  - id: micro-behaviors/fs/path/device/storage::dev-da
  - id: micro-behaviors/fs/path/device/storage::dev-hda
  - id: micro-behaviors/fs/path/device/storage::dev-loop
  - id: micro-behaviors/fs/path/device/storage::dev-mmcblk
  - id: micro-behaviors/fs/path/device/storage::dev-nvme
  - id: micro-behaviors/fs/path/device/storage::dev-sda
  - id: micro-behaviors/fs/path/device/storage::dev-sda-python-call
  - id: micro-behaviors/fs/path/device/storage::dev-vda
  - id: micro-behaviors/fs/path/device/storage::dev-xvda
  - id: micro-behaviors/fs/path/device/storage::device-serial-path-reference
  - id: micro-behaviors/fs/path/device/storage::unix-block-device-path
  - id: micro-behaviors/fs/path/device/storage::block-device-location-observations
  - id: micro-behaviors/fs/path/device/storage::windows-device-unc-template
  - id: micro-behaviors/fs/path/device/storage::windows-drive-volume-device-template
  - id: micro-behaviors/fs/path/device/storage::windows-physicaldrive-path
- id: disk-terms
  desc: Disk wiper terminology
  crit: suspicious
  conf: 0.75
  mbc: E1561
  attack: T1561
  for: [scripts, binaries, '!wasm']
  all:
  - id: destructive-wipe-phrase
  - id: disk-target-phrase
    # Package changelogs and documentation often mention disk tools and wipe
    # operations in unrelated entries. Keep both indicators in one short
    # textual region before inferring intent.
  near_lines: 5
  near_bytes: 2048
  unless:
  - id: metadata/vendor/identity/
  - id: metadata/package/testing/
  - id: well-known/app/utility/kpango-dotfiles::kpango-dotfiles-source-path
  - id: well-known/tool/detection/
      # UDisks2 (daemon and its loadable modules) implements legitimate
      # encrypted-volume and secure-erase operations; its MBR/erase strings
      # are not destructive intent.
  - id: well-known/app/utility/udisks2::udisks2-context
  - id: well-known/app/system/bristol-efi::bristol-efi-storage-context
  - id: well-known/app/storage/truenas::truenas-storage-context
- id: boot-sector
  desc: boot sector destruction phrasing
  crit: suspicious
  conf: 0.6
  for: [scripts, binaries, '!wasm']
  all:
  - id: micro-behaviors/fs/disk/partition::boot-sector-ref
  - id: destructive-wipe-phrase
  near_lines: 5
  near_bytes: 2048
- id: master-boot-record
  desc: master boot record destruction phrasing
  crit: suspicious
  conf: 0.6
  for: [scripts, binaries, '!wasm']
  all:
  - id: micro-behaviors/fs/disk/partition::master-boot-record-text
  - id: destructive-wipe-phrase
  near_lines: 5
  near_bytes: 2048
