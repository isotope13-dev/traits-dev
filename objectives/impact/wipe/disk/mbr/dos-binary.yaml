defaults:
  platforms: [windows, linux, macos]
  # Raw DOS code carries no container format; collectors' malware-label
  # extensions (".a") can type it as static-lib instead of data.
  for: [data, static-lib, pe]
  attack: T1561.001
  size_max: 4096
traits:
  # MOV CX,1 / XOR DX,DX / INT 26h: DOS absolute disk write of one sector
  # starting at logical sector 0, i.e. the volume boot record.
  - id: int26-boot-sector-write
    desc: INT 26h writes logical sector 0
    crit: suspicious
    conf: 0.95
    if:
      type: hex
      pattern: "B9 01 00 (31|33) D2 CD 26"
      offset_range: [0, 4096]

  # XOR AX,AX / INT 13h: BIOS reset of the disk system before raw access.
  - id: int13-disk-reset
    desc: BIOS INT 13h disk system reset
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "(31|33) C0 CD 13"
      offset_range: [0, 4096]

composite_rules:
  # Standalone DOS stub that only resets the disk and clobbers sector 0;
  # FORMAT/SYS-style utilities are far larger than this size cap.
  - id: dos-boot-sector-eraser
    desc: Tiny DOS code overwrites boot sector
    crit: hostile
    conf: 0.97
    size_max: 2048
    all:
      - id: int26-boot-sector-write
      - id: int13-disk-reset
