defaults:
  platforms: [windows]
  for: [pe, pyc]
  attack: T1561.002
  mbc: E1561

traits:
  - id: embedded-csharp-physicaldrive0-target
    desc: Embedded C# targets the first physical drive
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: PhysicalDrive0

  - id: embedded-csharp-random-sector-fill
    desc: Embedded C# random-byte buffer fill
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: NextBytes(

  - id: embedded-csharp-512-byte-writefile
    desc: Embedded C# writes 512 bytes with WriteFile
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'WriteFile\([^\r\n]{0,240},\s*512\s*,'

composite_rules:
  - id: pyc-randomized-physical-drive-sector-wipe
    desc: Randomized physical-drive sector overwrite
    crit: hostile
    conf: 0.99
    all:
      - id: embedded-csharp-physicaldrive0-target
      - id: embedded-csharp-random-sector-fill
      - id: embedded-csharp-512-byte-writefile
