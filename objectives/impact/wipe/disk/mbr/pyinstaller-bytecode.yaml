defaults:
  platforms: [windows]
  for: [pe, pyc]
  attack: T1561.002
  mbc: E1561

composite_rules:
  - id: pyc-randomized-physical-drive-sector-wipe
    desc: Randomized physical-drive sector overwrite
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/device/storage::physicaldrive0-reference
      - id: micro-behaviors/os/random/prng/stdlib::random-nextbytes
      - id: micro-behaviors/fs/write/file/handle::writefile-api-text-reference
