defaults:
  platforms: [windows]
  for: [html]
composite_rules:
  - id: browser-debug-mbr-zero-write
    desc: Browser payload builds a DEBUG script to zero the MBR
    crit: hostile
    conf: 0.99
    attack: T1561.002
    all:
      - id: micro-behaviors/fs/write/content::debug-script-sector-write-registers
      - id: micro-behaviors/fs/write/content::debug-script-first-hard-disk-sector
      - id: micro-behaviors/fs/write/content::debug-script-int13-instruction
      - id: micro-behaviors/fs/path/config/boot::autoexec-bat-reference
      - id: micro-behaviors/fs/write/content::create-text-file-method-name
      - id: micro-behaviors/os/com/automation::wsh-shell-clsid
