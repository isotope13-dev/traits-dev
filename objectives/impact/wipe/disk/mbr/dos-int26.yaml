# DOS INT 26h is an absolute disk write: CX is the sector count and DX
# is the starting sector. One sector at sector 0 replaces the boot sector.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  attack: T1561.001
  size_max: 65536

traits:
  - id: dos-int26-one-sector
    desc: DOS absolute write of one sector
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "B9 01 00 [0-8] CD 26"

  - id: dos-int26-xor-dx-zero
    desc: DOS clears DX before absolute write
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "31 D2 CD 26"

  - id: dos-int26-xor-dx-ax
    desc: DOS zeroes DX before absolute write
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "33 D2 CD 26"

  - id: dos-int26-mov-dx-zero
    desc: DOS zeroes DX via MOV before write
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "BA 00 00 [0-4] CD 26"

  - id: dos-int26-cwd-sector
    desc: DOS sets the start sector from AX
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "99 [0-2] CD 26"

  - id: dos-int26-sector-count
    desc: DOS sets an absolute sector count
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B9 ?? ?? [0-6] CD 26"

  # Ash.817's weekday path uses Saturday (DOS weekday 6) to zero AX, then
  # transfers AX to DX immediately before a one-sector INT 26h write.
  - id: dos-int26-saturday-sector-zero
    desc: DOS writes sector zero on Saturdays
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: "B4 2A CD 21 80 FA 06 75 05 33 C0 EB 1F [31-31] 8B D0 B9 01 00 33 DB B4 19 CD 21 CD 26"

  # Minutes must be zero and the hour must be below an immediate
  # threshold (Ash.817 uses 8, Ash.743 uses 6). Hour, seconds, and
  # hundredths are then summed; a zero sum is incremented so the
  # absolute write starts at sector one.
  - id: dos-int26-midnight-sector-one
    desc: DOS selects sector one at midnight
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: "B4 2C CD 21 0A C9 75 23 80 FD ?? 7D 1E 02 CD 8B C1 98 02 C6 12 C2 80 D4 00 0B C0 75 01 40 8B D0 B9 01 00 33 DB B4 19 CD 21 CD 26"

  # INT 26h followed by restoring the stack and looping back writes sector
  # after sector: the boot-infection write loop of a multipartite virus,
  # not a single-sector wipe.
  - id: dos-int26-write-loop
    desc: DOS loops an absolute disk write
    crit: suspicious
    conf: 0.92
    if:
      type: hex
      pattern: "CD 26 58 61 E2"

composite_rules:
  - id: dos-int26-boot-sector-write
    desc: DOS overwrites the first disk sector
    crit: hostile
    conf: 0.96
    # A COM stub fits in one segment. The same opcodes collide in a
    # multi-megabyte PCM fixture.
    size_max: 65536
    all:
      - id: dos-int26-one-sector
    any:
      - id: dos-int26-xor-dx-zero
      - id: dos-int26-xor-dx-ax
      - id: dos-int26-mov-dx-zero
    needs: 1

  - id: dos-int26-direct-disk-wipe
    desc: DOS wipes disk sectors from sector zero
    crit: hostile
    conf: 0.96
    size_max: 65536
    all:
      - id: dos-int26-mov-dx-zero
      - id: dos-int26-sector-count

  - id: dos-int26-cwd-disk-write
    desc: DOS wipes sectors from the start
    crit: hostile
    conf: 0.95
    size_max: 65536
    all:
      - id: dos-int26-cwd-sector
      - id: dos-int26-sector-count

  - id: dos-int26-calendar-gated-one-sector-wipe
    desc: DOS damages a disk sector on a calendar trigger
    crit: hostile
    conf: 0.98
    size_max: 65536
    all:
      - id: dos-int26-one-sector
    any:
      - id: dos-int26-saturday-sector-zero
      - id: dos-int26-midnight-sector-one
    needs: 1
