# DOS INT 26h is an absolute disk write: CX is the sector count and DX
# is the starting sector. One sector at sector 0 replaces the boot sector.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib]
  attack: T1561.001

traits:
  - id: dos-int26-one-sector
    desc: DOS absolute write of one sector
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "B9 01 00 [0-8] CD 26"

  - id: dos-int26-xor-dx-zero
    desc: DOS clears DX before absolute write
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "31 D2 CD 26"

  - id: dos-int26-xor-dx-ax
    desc: DOS zeroes DX before absolute write
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "33 D2 CD 26"

  - id: dos-int26-cwd-sector
    desc: DOS sets the start sector from AX
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "99 [0-8] CD 26"

  - id: dos-int26-sector-count
    desc: DOS sets an absolute sector count
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B9 ?? ?? [0-12] CD 26"

composite_rules:
  - id: dos-int26-boot-sector-write
    desc: DOS overwrites the first disk sector
    crit: hostile
    conf: 0.96
    # A COM stub fits in one segment. The same opcodes collide in a
    # multi-megabyte PCM fixture.
    size_max: 65536
    all:
      - id: dos-int26-one-sector
    any:
      - id: dos-int26-xor-dx-zero
      - id: dos-int26-xor-dx-ax
    needs: 1

  - id: dos-int26-cwd-disk-write
    desc: DOS wipes sectors from the start
    crit: hostile
    conf: 0.95
    size_max: 65536
    all:
      - id: dos-int26-cwd-sector
      - id: dos-int26-sector-count
