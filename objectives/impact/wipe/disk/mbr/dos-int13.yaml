# BIOS INT 13h AH=03h writes raw sectors to a CHS address. A DOS stub that
# aims that write at cylinder 0, head 0, sector 1 — the boot sector — from the
# 7C00h boot buffer, then terminates without reading or saving the original
# sector first, replaces the boot record outright: an eraser, not an installer.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib]
  attack: T1561.001
  size_max: 65536

traits:
  - id: dos-int13-boot-sector-target
    desc: BIOS write targets the boot sector
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "B8 01 03 BB 00 7C B9 01 00"
      offset_range: [0, 512]

  - id: dos-int13-drive0-write-exit
    desc: Drive-zero sector write then exit
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "(31|33) D2 CD 13 [0-4] B8 00 4C CD 21"
      offset_range: [0, 512]

composite_rules:
  - id: dos-int13-boot-sector-eraser
    desc: DOS erases the boot sector
    crit: hostile
    conf: 0.96
    all:
      - id: dos-int13-boot-sector-target
      - id: dos-int13-drive0-write-exit
