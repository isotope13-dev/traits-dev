# BIOS INT 13h AH=03h writes raw sectors to a CHS address. A DOS stub that
# aims that write at cylinder 0, head 0, sector 1 — the boot sector — from the
# 7C00h boot buffer, then terminates without reading or saving the original
# sector first, replaces the boot record outright: an eraser, not an installer.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib]
  attack: T1561.001
  size_max: 65536

traits:
  - id: dos-int13-boot-sector-target
    desc: BIOS write targets the boot sector
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "B8 01 03 BB 00 7C B9 01 00"
      offset_range: [0, 512]

  - id: dos-int13-drive0-write-exit
    desc: Drive-zero sector write then exit
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "(31|33) D2 CD 13 [0-4] B8 00 4C CD 21"
      offset_range: [0, 512]

  # MOV AX,0201h then INT 13h: BIOS read of one sector. Unlike the eraser
  # atoms above this is not pinned to the first 512 bytes: infectors carry
  # it deep inside an appended body.
  - id: dos-int13-ax-sector-read
    desc: BIOS reads one sector via AX
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 01 02 [0-8] CD 13"

  # MOV AX,0301h then INT 13h: BIOS write of one sector, same placement.
  - id: dos-int13-ax-sector-write
    desc: BIOS writes one sector via AX
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 01 03 [0-8] CD 13"

  # MOV SI,01BEh: points at the MBR partition table inside a sector buffer.
  # Bootloaders do this too, so this only convicts with the sector legs.
  - id: dos-mbr-partition-pointer
    desc: DOS points at the partition table
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "BE BE 01"

  # SUB then ADD 44h on the same buffer bytes: partition type scrambling, the
  # loop that walks the four table entries mangling each type in turn. Disk
  # tools never bounce a constant off a byte and put it back.
  - id: dos-sub-add-44-bytes
    desc: DOS subtracts then adds 44h
    crit: suspicious
    conf: 0.92
    if:
      type: hex
      pattern: "80 29 44 [0-8] 80 01 44"

composite_rules:
  - id: dos-int13-boot-sector-eraser
    desc: DOS erases the boot sector
    crit: hostile
    conf: 0.96
    all:
      - id: dos-int13-boot-sector-target
      - id: dos-int13-drive0-write-exit

  # Reads a sector, walks the partition table scrambling each entry's type,
  # writes the sector back: an MBR tamperer, not a disk tool. Tools that read
  # and write sectors (FDISK, FORMAT) parse the table; they never bounce 44h
  # off every type byte.
  - id: dos-mbr-partition-scrambler
    desc: DOS virus scrambles MBR partition types
    crit: hostile
    conf: 0.95
    all:
      - id: dos-int13-ax-sector-read
      - id: dos-int13-ax-sector-write
      - id: dos-mbr-partition-pointer
      - id: dos-sub-add-44-bytes
