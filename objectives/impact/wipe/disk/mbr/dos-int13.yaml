# DOS MBR tampering evidence with additional behavior-specific conditions.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  attack: T1561.001
  size_max: 65536

traits:
  - id: dos-int13-ax-sector-read
    desc: BIOS reads one sector via AX
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 01 02 [0-16] CD 13"

  # Reads a sector via INT 13h, zeroes a word in the buffer (such as the 55AAh
  # boot signature), then writes the corrupted sector back via INT 13h.
  - id: dos-mbr-zero-and-writeback
    desc: DOS zeroes sector buffer and writes back
    crit: suspicious
    conf: 0.96
    for: [dos_com, data, ole]
    if:
      type: hex
      pattern: "CD 13 [0-16] C7 06 ?? ?? 00 00 [0-16] CD 13"

  # MOV AX,0301h then INT 13h: BIOS write of one sector, same placement.
  - id: dos-int13-ax-sector-write
    desc: BIOS writes one sector via AX
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 01 03 [0-16] CD 13"

  # Copy the 64-byte partition table from a read sector buffer to a second
  # sector buffer before writing it back. Addresses vary by resident layout.
  - id: dos-mbr-partition-table-copy
    desc: DOS copies the MBR partition table
    crit: suspicious
    conf: 0.94
    if:
      type: hex
      pattern: "81 C6 BE 01 BF ?? ?? 8B DF 81 C7 BE 01 06 1F B9 20 00 FC F3 A5"

  # MOV AX,0515h / clear cylinder, drive, and buffer address / INT 13h:
  # BIOS writes 21 sectors from physical address 0000:0000 to drive 0. The
  # starting sector in CL is inherited, so this does not claim a precise CHS
  # range. The sequence is meaningful when combined with a file infector.
  - id: dos-int13-drive0-multi-sector-write-lowmem
    desc: BIOS writes 21 sectors from low memory
    crit: suspicious
    conf: 0.96
    if:
      type: hex
      pattern: "B8 15 05 32 ED 33 D2 8E C2 33 DB CD 13"

  # A rotating sector/cylinder loop can hide the BIOS write parameters behind
  # byte loads. Nine sectors per INT 13h write is not a boot-sector rewrite.
  - id: dos-int13-nine-sector-write
    desc: BIOS writes nine sectors per call
    crit: suspicious
    conf: 0.95
    if:
      type: hex
      pattern: "B4 03 B0 09 [0-24] CD 13"

  - id: dos-int13-weekday-gate
    desc: DOS weekday gates a BIOS disk action
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 2A CD 21 [0-8] 3C 01 74"

  - id: dos-int13-time-fraction-gate
    desc: DOS time fraction gates BIOS disk action
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: "B4 2C CD 21 [0-8] 80 E2 0F 0A D2 75"

  - id: dos-int13-forty-cylinder-counter-loop
    desc: BIOS sector loop stops at cylinder 40
    crit: suspicious
    conf: 0.96
    if:
      type: hex
      pattern: "80 3E ?? ?? 28 73 ?? 80 3E ?? ?? 09 77 ?? B4 03 B0 09 [0-24] CD 13"

  # CMP AX,DEADh / JE over RET gates the destructive routine on the infection
  # counter. In FullDead, that word is incremented on each eligible non-MZ
  # candidate and reset by the payload when the threshold is reached.
  - id: dos-int13-dead-counter-gate
    desc: Disk payload waits for counter DEAD
    crit: suspicious
    conf: 0.95
    if:
      type: hex
      pattern: "3D AD DE 74 01 C3"

  # MOV SI,01BEh: points at the MBR partition table inside a sector buffer.
  # Bootloaders do this too, so this only convicts with the sector legs.
  - id: dos-mbr-partition-pointer
    desc: DOS points at the partition table
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "BE BE 01"

  # SUB then ADD 44h on the same buffer bytes: partition type scrambling, the
  # loop that walks the four table entries mangling each type in turn. Disk
  # tools never bounce a constant off a byte and put it back.
  - id: dos-sub-add-44-bytes
    desc: DOS subtracts then adds 44h
    crit: suspicious
    conf: 0.92
    if:
      type: hex
      pattern: "80 29 44 [0-8] 80 01 44"

composite_rules:
  - id: dos-exec-virus-weekday-disk-overwrite
    desc: DOS infector overwrites C drive sectors through cylinder 40
    crit: hostile
    conf: 0.98
    all:
      - id: dos-int13-nine-sector-write
      - id: dos-int13-weekday-gate
      - id: dos-int13-time-fraction-gate
      - id: dos-int13-forty-cylinder-counter-loop
      - id: objectives/impact/infect/binary/dos/interrupt::dos-exec-hook-infector

  # Reads a sector, walks the partition table scrambling each entry's type,
  # writes the sector back: an MBR tamperer, not a disk tool. Tools that read
  # and write sectors (FDISK, FORMAT) parse the table; they never bounce 44h
  # off every type byte.
  - id: dos-mbr-partition-scrambler
    desc: DOS virus scrambles MBR partition types
    crit: hostile
    conf: 0.95
    all:
      - id: dos-int13-ax-sector-read
      - id: dos-int13-ax-sector-write
      - id: dos-mbr-partition-pointer
      - id: dos-sub-add-44-bytes

  # The INT 21h hook that makes the rewriter resident is installed either by
  # a direct IVT store or by a handler that fetches the old vector and
  # filters the EXEC service. MBR tools do neither.
  - id: dos-resident-mbr-partition-rewriter
    desc: Resident DOS virus rewrites the MBR partition table
    crit: hostile
    conf: 0.97
    all:
      - id: dos-int13-ax-sector-read
      - id: dos-mbr-partition-table-copy
      - id: dos-int13-ax-sector-write
    any:
      - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-set-direct
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
    needs: 1

  # A file infector that also writes multiple BIOS sectors from low memory is
  # destructive even when its CHS starting sector is inherited at runtime.
  - id: dos-com-infector-with-lowmem-disk-write
    desc: DOS infector writes multiple BIOS sectors
    crit: hostile
    conf: 0.98
    all:
      - id: dos-int13-drive0-multi-sector-write-lowmem
      - id: dos-int13-dead-counter-gate
      - id: objectives/impact/infect/binary/dos/file::dos-com-directory-infector

  # Tchechen carries a relocated partition boot payload. On RTC day 16 it
  # iterates non-empty partition entries and writes 17-sector BIOS blocks
  # starting from each entry's CHS fields. The inherited bounds do not support
  # a precise final-sector claim.
  - id: dos-rtc-gated-partition-overwrite
    desc: DOS virus overwrites partition sectors on RTC day 16
    crit: hostile
    conf: 0.98
    for: [dos_com]
    all:
      - id: objectives/impact/infect/boot-sector::dos-boot-relocate-7c00-repne
      - id: objectives/impact/infect/boot-sector::dos-rtc-day16-boot-gate
      - id: objectives/impact/infect/boot-sector::dos-bios-17-sector-write-loop
      - id: dos-int13-ax-sector-read
      - id: dos-int13-ax-sector-write
