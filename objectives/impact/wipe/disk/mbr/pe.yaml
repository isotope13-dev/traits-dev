defaults:
  platforms:
    - windows
  for:
    - pe
  attack: T1561.002
traits:
  - id: explicit-mbr-overwrite-message
    desc: Embedded payload announces MBR overwrite
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: your MBR has been overwritten
composite_rules:
  - id: mbr-raw-write-pe
    desc: Non-platform PE references the MBR and physical-drive write APIs
    crit: suspicious
    conf: 0.92
    all:
      - id: objectives/impact/wipe/disk/term::mbr-ref
    any:
      - id: micro-behaviors/fs/disk/raw::windows-physicaldrive-write-profile
      - id: micro-behaviors/fs/disk/raw::windows-managed-physicaldrive-write-profile
    unless:
      - id: metadata/signed/platform/

  - id: mbr-wiper-pe
    desc: PE writes a physical drive and announces MBR destruction
    crit: hostile
    conf: 0.995
    mbc: E1561
    all:
      - id: explicit-mbr-overwrite-message
    any:
      - id: micro-behaviors/fs/disk/raw::windows-physicaldrive-write-profile
      - id: micro-behaviors/fs/disk/raw::windows-managed-physicaldrive-write-profile
