defaults:
  platforms:
    - windows
  for:
    - pe
  attack: T1561.002
traits:
  - id: explicit-mbr-overwrite-message
    desc: MBR-overwrite taunt string
    crit: component
    conf: 0.99
    if:
      type: text
      substr: your MBR has been overwritten
composite_rules:
  - id: destructive-wipe-announcement
    desc: MBR or machine destruction announcement
    crit: component
    conf: 0.98
    any:
      - id: explicit-mbr-overwrite-message
      - id: objectives/impact/infect/terms::computer-done-for-taunt

  - id: mbr-wiper-pe
    desc: MBR destruction message with physical-drive write API references
    crit: hostile
    conf: 0.995
    mbc: E1561
    all:
      - id: destructive-wipe-announcement
    any:
      - id: micro-behaviors/fs/disk/raw::windows-physicaldrive-write-profile
      - id: micro-behaviors/fs/disk/raw::windows-managed-physicaldrive-write-profile
