defaults:
  platforms:
    - windows
  for:
    - pe
  attack: T1561.002
traits:
  - id: explicit-mbr-overwrite-message
    desc: Embedded payload announces MBR overwrite
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)\b(has|have) overwritten (your|the) MBR\b'
composite_rules:
  - id: mbr-raw-write-pe
    desc: Unsigned PE references the MBR while writing a physical drive
    crit: suspicious
    conf: 0.92
    all:
      - id: objectives/impact/wipe/disk/term::mbr-ref
      - id: micro-behaviors/fs/disk/raw::windows-physicaldrive-write-profile
    unless:
      - id: metadata/signed/platform/

  - id: mbr-wiper-pe
    desc: PE writes a physical drive and announces MBR destruction
    crit: hostile
    conf: 0.995
    mbc: E1561
    all:
      - id: explicit-mbr-overwrite-message
      - id: micro-behaviors/fs/disk/raw::windows-physicaldrive-write-profile
