defaults:
  platforms:
    - windows
  for:
    - pe
  attack: T1561.002
traits:
  - id: explicit-mbr-overwrite-message
    desc: Embedded payload announces MBR overwrite
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)\b(has|have) overwritten (your|the) MBR\b'
composite_rules:
  - id: raw-disk-write-pe
    desc: Raw disk write via PhysicalDrive API chain
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/device/storage::windows-physicaldrive-path
      - id: micro-behaviors/fs/file/open::file-create-win
      - id: micro-behaviors/fs/file/write/direct::write-file
    unless:
      - id: well-known/app/system/iobit::iobit-signed-component-context
      # Action1 RMM inventories/manages disks; PhysicalDrive0 open is expected.
      - id: well-known/dual-use/remote-admin/action1::action1-agent-identity
  - id: mbr-wiper-pe
    desc: MBR disk wiper in PE binary
    crit: hostile
    conf: 0.98
    mbc: E1561
    all:
      - id: objectives/impact/wipe/disk/term::mbr-ref
      - id: raw-disk-write-pe
