# A COM entry point selects CHS 0/0/1 on the primary master and writes a
# full repeated-byte buffer through the ATA data port, destroying its MBR.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  attack: T1561.002

composite_rules:
  - id: dos-ata-repeated-sector-mbr-wipe
    desc: DOS overwrites the MBR through ATA ports
    crit: hostile
    all:
      - id: micro-behaviors/os/msdos/disk::dos-ata-first-sector-setup
      - id: micro-behaviors/os/msdos/disk::dos-ata-repeated-sector-write
