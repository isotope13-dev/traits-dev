# A BIOS write to the first hard disk followed straight away by INT 19h:
# the sector just written (typically the MBR) is what the machine boots from,
# so the program overwrites it and forces the reboot into the damage.
defaults:
  platforms: [windows, unix]
  for: [dos_com]
  attack: T1561.002
  size_max: 512
composite_rules:
  - id: dos-hard-disk-write-then-reboot
    desc: Tiny DOS image writes first hard disk and reboots
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/impact/wipe/disk/raw::dos-int13-fixed-disk-write
      - id: micro-behaviors/os/msdos/interrupt::dos-reboot-after-bios-disk-call
