# INT 13h AH=05h formats a track; with DL=80h it targets the first hard
# disk, so a tiny image that formats track 0 destroys the partition table
# and boot code. The track-format sequence is the YARA atom in the raw
# directory; the hard-disk reference is the shared DL=80h-call detector.
defaults:
  platforms: [windows, unix]
  for: [dos_com]
  attack: T1561.002
  size_max: 65536
composite_rules:
  - id: dos-hard-disk-track-format-wiper
    desc: Tiny DOS image formats a hard-disk track
    crit: hostile
    conf: 0.93
    size_max: 512
    all:
      - id: objectives/impact/wipe/disk/raw::dos-int13-format-track-call
      - id: objectives/impact/infect/binary/dos/file::dos-hard-disk-call
