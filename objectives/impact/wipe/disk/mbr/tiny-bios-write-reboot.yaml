defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
  size_max: 512
  attack: T1561.002

traits:
  - id: tiny-dos-fixed-disk-first-sector-reboot
    desc: DOS writes fixed-disk sector then reboots
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule tiny_dos_fixed_disk_first_sector_reboot {
          strings:
            $write = { B8 01 03 B9 01 00 BA 80 00 [0-16] CD 13 CD 19 }
            $read = { B8 ?? 02 [0-24] CD 13 }
          condition:
            $write at 0 and not $read
        }
