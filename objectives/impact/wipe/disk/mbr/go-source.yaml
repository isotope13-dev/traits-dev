defaults:
  platforms: [unix]
  for: [go]
  attack: T1561.001
  mbc: E1561

traits:
  - id: dd-zero-mbr-command-literal
    desc: dd command overwrites MBR
    crit: suspicious
    conf: 0.97
    if:
      type: literal
      regex: 'dd\s+if=/dev/zero\s+of=(%s|/dev/[A-Za-z0-9/_-]+)\s+bs=(446|512)\s+count=1'
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/

  - id: erase-mbr-function-name
    desc: Erase MBR function name
    crit: suspicious
    conf: 0.9
    if:
      type: symbol
      kind: function
      regex: '(?i)(erase|wipe|zero|destroy)Mbr$'
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/

  # Keep the output value dynamic here: the destructive meaning comes from
  # resolving a mounted /dev node in the composite below. Requiring the MBR
  # byte count avoids classifying ordinary dd-based disk-image creation.
  - id: dd-zero-mbr-dynamic-output
    desc: Go dd overwrites a dynamic MBR destination
    crit: suspicious
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: exec.Command
      arg:
        index: 2
        from:
          value: '^of=$'
      args:
        - index: 0
          exact: dd
        - index: 1
          exact: if=/dev/zero
        - index: 3
          regex: '^bs=(446|512)$'
        - index: 4
          exact: count=1
        - index: 5
          exact: conv=notrunc
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/

composite_rules:
  - id: dd-mbr-wiper-source
    desc: Executes dd MBR overwrite command
    crit: hostile
    conf: 0.99
    near_lines: 80
    all:
      - id: dd-zero-mbr-command-literal
      - id: micro-behaviors/process/create/direct::exec-command
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/

  - id: mounted-device-dd-mbr-wiper-source
    desc: Resolves a mounted device and overwrites its MBR
    crit: hostile
    conf: 0.99
    near_lines: 80
    all:
      - id: objectives/impact/wipe/disk/device::lang-mounts-dev-scan
      - id: dd-zero-mbr-dynamic-output
      - id: micro-behaviors/process/create/exec::child-process-execution
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
