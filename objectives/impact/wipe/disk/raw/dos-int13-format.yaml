# BIOS INT 13h AH=05h formats a track. The buffer at ES:BX holds the address
# field list, so pointing it at the interrupt vector table (ES=BX=0) hands the
# BIOS a meaningless list. A tiny DOS image that issues a track format and then
# exits has no use beyond destroying the data on that track. Written as YARA
# so the sequence is evaluated on images under the engine's size floor.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1561.001
  size_max: 65536

traits:
  - id: dos-int13-format-track-call
    desc: BIOS formats a disk track
    crit: suspicious
    conf: 0.9
    if:
      type: yara
      source: |
        rule dos_int13_format_track_call {
          meta:
            filetypes = "dos_com,data"
          strings:
            $fmt = { B8 ?? 05 [0-16] CD 13 }
          condition:
            $fmt in (0..48)
        }

composite_rules:
  - id: dos-tiny-int13-format-and-exit
    desc: Tiny DOS image formats a track and exits
    crit: hostile
    conf: 0.93
    size_max: 512
    all:
      - id: dos-int13-format-track-call
      - id: micro-behaviors/os/msdos/interrupt::dos-terminate-process
