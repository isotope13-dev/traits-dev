# Some DOS COM viruses use INT 21h/AH=32h to derive the sector immediately
# before the first data sector, then alter bytes at the end of that sector
# through INT 25h/26h. On fixed-root FAT volumes this is the final root
# directory sector. The last three bytes overlap the final directory entry's
# high file-size bytes.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  size_max: 65536

traits:
  - id: dos-int25-pre-data-sector
    desc: DOS derives the sector before data
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: "B4 32 B2 ?? CD 21 [0-8] 8B 57 0B 83 EA 01"

  - id: dos-int25-tail-marker-counter
    desc: DOS stores a counter in sector-tail bytes
    crit: suspicious
    conf: 0.96
    if:
      type: hex
      pattern: "CD 25 [0-12] C7 45 FD D0 4F C6 45 FF 01 [0-48] CD 26"

composite_rules:
  - id: dos-int25-root-directory-tail-counter
    desc: DOS infector alters the final root-directory entry size bytes
    crit: hostile
    conf: 0.96
    all:
      - id: dos-int25-pre-data-sector
      - id: dos-int25-tail-marker-counter
      - id: objectives/impact/infect/binary/dos/interrupt::dos-exec-hook-infector
