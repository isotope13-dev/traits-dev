# VB.NET source (typed vbs) that opens a physical drive with CreateFile and
# writes a hard-coded byte image through WriteFile, without declaring any
# read path, overwrites the start of the disk instead of imaging it.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1561.002
  mbc: E1561

traits:
  - id: vbnet-physical-drive-createfile
    desc: VB.NET CreateFile opens a physical drive
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)CreateFile\(\s*"\\\\\.\\PhysicalDrive\d+"'
  - id: vbnet-kernel32-writefile-declare
    desc: VB.NET declares kernel32 WriteFile
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)<DllImport\("kernel32(\.dll)?"[^>]{0,80}\)>\s*\w*\s*Shared\s+Function\s+WriteFile\b'
  - id: vbnet-kernel32-readfile-declare
    desc: VB.NET declares kernel32 ReadFile
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)Shared\s+Function\s+ReadFile\b'
  - id: vbnet-large-hex-byte-array
    desc: VB.NET literal array of 64+ hex bytes
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)New\s+Byte\(\)\s*\{\s*&H[0-9A-F]{1,2}(\s*,\s*&H[0-9A-F]{1,2}){63}'

composite_rules:
  - id: vbnet-embedded-image-physical-drive-overwrite
    desc: VB.NET writes embedded bytes onto a physical drive
    crit: hostile
    conf: 0.96
    all:
      - id: vbnet-physical-drive-createfile
      - id: vbnet-kernel32-writefile-declare
      - id: vbnet-large-hex-byte-array
    unless:
      - id: vbnet-kernel32-readfile-declare
