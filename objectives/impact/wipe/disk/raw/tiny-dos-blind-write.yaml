# A tiny COM entry stub writes multiple sectors from sector zero without
# loading a buffer or reading a replacement, then immediately terminates.
# It cannot contain a complete sector image; the DOS entry-state buffer is
# unrelated to the target disk's contents.
defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_max: 511
  attack: T1561.001

traits:
  - id: tiny-dos-blind-sector-zero-overwrite
    desc: DOS stub blindly overwrites initial sectors
    crit: hostile
    conf: 0.97
    if:
      type: yara
      source: |
        rule tiny_dos_blind_sector_zero_overwrite {
          meta:
            filetypes = "dos_com"
          strings:
            $stub = { ( B8 ?? 00 | B0 ?? ) ( 31 D2 | 33 D2 | BA 00 00 ) B9 ( 1? | 2? | 3? | 4? | 5? | 6? | 7? | 8? | 9? | A? | B? | C? | D? | E? | F? ) 00 CD 26 ( B8 ?? 4C | B4 4C ) CD 21 }
          condition:
            $stub at 0
        }

  - id: tiny-dos-entry-segment-sector-overwrite
    desc: DOS entry stub overwrites initial sectors
    for: [dos_com, data, static-lib]
    size_max: 32
    crit: hostile
    conf: 0.98
    if:
      # DOS absolute write consumes AL for the drive. This variant leaves it
      # inherited or sets it directly and uses offset zero of the entry
      # segment as the buffer. The stub contains no sector image.
      type: yara
      source: |
        rule tiny_dos_entry_segment_sector_overwrite {
          meta:
            filetypes = "dos_com,data,static-lib"
          strings:
            $write = { ( B4 ?? | B0 ?? ) ( BB 00 00 | 31 DB | 33 DB ) B9 ( 1? | 2? | 3? | 4? | 5? | 6? | 7? | 8? | 9? | A? | B? | C? | D? | E? | F? ) 00 ( BA 00 00 | 31 D2 | 33 D2 ) CD 26 }
          condition:
            filesize <= 32 and $write at 0
        }
