# BIOS INT 13h AH=03h directly writes raw sectors to physical disks.
# A DOS program that issues a BIOS raw disk sector write to a fixed disk
# (DL >= 80h) and terminates without user interaction or standard DOS file
# safety checks is a raw disk wiper.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  attack: T1561.001
  size_max: 65536

traits:
  - id: dos-int13-fixed-disk-write
    desc: BIOS writes raw sectors to fixed disk
    crit: notable
    conf: 0.92
    for: [dos_com, data, ole]
    if:
      type: hex
      pattern: "(B8 ?? 03 [0-16] BA 80 00|B8 ?? 03 [0-16] B2 80|BA 80 00 [0-16] B8 ?? 03|B2 80 [0-16] B8 ?? 03) [0-16] CD 13"
      offset_range: [0, 512]
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

composite_rules:
  - id: dos-raw-fixed-disk-wiper
    desc: DOS program overwrites raw fixed disk sectors and exits
    crit: hostile
    conf: 0.98
    for: [dos_com, data, ole]
    all:
      - id: dos-int13-fixed-disk-write
      - id: objectives/impact/wipe/disk/mbr::dos-int13-sector-write-exit
