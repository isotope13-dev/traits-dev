# BIOS INT 13h AH=03h directly writes raw sectors to physical disks.
# A DOS program that issues a BIOS raw disk sector write to a fixed disk
# (DL >= 80h) and terminates without user interaction or standard DOS file
# safety checks is a raw disk wiper.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  attack: T1561.001
  size_max: 65536

traits:
  - id: dos-int13-fixed-disk-write
    desc: BIOS writes raw sectors to fixed disk
    crit: notable
    conf: 0.92
    for: [dos_com, data, ole]
    if:
      type: hex
      pattern: "(B8 ?? 03 [0-16] BA 80 00|B8 ?? 03 [0-16] B2 80|BA 80 00 [0-16] B8 ?? 03|B2 80 [0-16] B8 ?? 03) [0-16] CD 13"
      offset_range: [0, 512]
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  - id: dos-int13-raw-disk-copy-loop
    desc: BIOS reads and writes raw sectors
    crit: notable
    conf: 0.95
    for: [dos_com, data, ole]
    if:
      type: hex
      pattern: "B8 ?? 02 [0-16] CD 13 [0-8] 72 ?? B8 ?? 03 [0-16] CD 13"
      offset_range: [0, 512]
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # MOV AX,xx02h with AL other than 1: BIOS read of more than one sector.
  # Mislabeled dumps are often typed data or static-lib rather than dos_com.
  - id: dos-int13-multisector-read
    desc: BIOS reads multiple disk sectors
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 ~01 02 [0-40] CD 13"
      offset_range: [0, 512]

  # MOV AX,xx03h / INT 13h writes any sector count. Floppy erasers use DL
  # below 80h, so the fixed-disk atom above does not see them.
  - id: dos-int13-ax-sector-write-any
    desc: BIOS writes sectors via AX immediate
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 ?? 03 [0-24] CD 13"
      offset_range: [0, 512]

  # AL other than 1 overwrites more than a single boot sector.
  - id: dos-int13-multisector-write
    desc: BIOS writes multiple disk sectors
    crit: suspicious
    conf: 0.92
    if:
      type: hex
      pattern: "B8 ~01 03 [0-24] CD 13"
      offset_range: [0, 512]

  # INT 13h then INT 21h AH=4Ch. The gap allows another sector call
  # between the disk service and MOV AH,4Ch / MOV AL,imm / INT 21h.
  - id: dos-int13-then-dos-exit
    desc: DOS exits after BIOS disk call
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "CD 13 [0-64] B4 4C [0-8] CD 21"
      offset_range: [0, 512]

composite_rules:
  - id: dos-raw-fixed-disk-wiper
    desc: DOS program overwrites raw fixed disk sectors and exits
    crit: hostile
    conf: 0.98
    for: [dos_com, data, ole]
    all:
      - id: dos-int13-fixed-disk-write
      - id: objectives/impact/wipe/disk/mbr::dos-int13-sector-write-exit

  - id: dos-raw-disk-copy-wiper
    desc: DOS copies and overwrites raw sectors
    crit: hostile
    conf: 0.97
    for: [dos_com, data, ole]
    all:
      - id: dos-int13-raw-disk-copy-loop
      - id: objectives/impact/wipe/disk/mbr::dos-int13-sector-write-exit

  # Reads a multi-sector run, writes sectors back through INT 13h, then
  # terminates. No prompt and no DOS file call: a floppy or fixed-disk eraser.
  - id: dos-int13-read-write-exit-wiper
    desc: DOS read-write sector wipe then exit
    crit: hostile
    conf: 0.96
    size_max: 2048
    all:
      - id: dos-int13-multisector-read
      - id: dos-int13-ax-sector-write-any
      - id: dos-int13-then-dos-exit

  # A multi-sector BIOS write (not a one-sector boot patch) followed by
  # process exit. Disk tools that rewrite a track are far larger than this.
  - id: dos-int13-multisector-write-exit-wiper
    desc: DOS overwrites multiple sectors then exits
    crit: hostile
    conf: 0.95
    size_max: 2048
    all:
      - id: dos-int13-multisector-write
      - id: dos-int13-then-dos-exit
