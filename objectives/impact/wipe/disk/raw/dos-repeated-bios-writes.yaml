# A single fixed buffer is written to four BIOS drives while a shared sector
# counter advances and the loop returns to its own sector comparison.
defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_max: 65536
traits:
  - id: dos-loop-fixed-buffer-four-drive-sectors
    desc: Loops writing same buffer across drives
    crit: hostile
    conf: 0.99
    attack: T1561.002
    if:
      type: yara
      source: |
        rule dos_loop_fixed_buffer_four_drive_sectors {
          strings:
            $test = { 80 3E ?? ?? 12 74 ?? }
            $write = { 31 C0 8E C0 8A 2E ?? ?? 8A 0E ?? ?? BA ?? ?? BB ?? ?? B8 01 03 CD 13 }
            $advance = { FE 06 ?? ?? [0-20] EB ?? }
          condition:
            for any t in (1..#test) : (
              for any w in (1..#write - 3) : (
                for any a in (1..#advance) : (
                  @write[w] > @test[t] and @write[w] - @test[t] < 32 and
                  @write[w + 1] == @write[w] + 23 and
                  @write[w + 2] == @write[w + 1] + 23 and
                  @write[w + 3] == @write[w + 2] + 23 and
                  @advance[a] >= @write[w + 3] + 23 and
                  @advance[a] - (@write[w + 3] + 23) <= 32 and
                  uint16(@test[t] + 2) == uint16(@advance[a] + 2) and
                  uint8(@write[w] + 13) != uint8(@write[w + 1] + 13) and
                  uint8(@write[w] + 13) != uint8(@write[w + 2] + 13) and
                  uint8(@write[w] + 13) != uint8(@write[w + 3] + 13) and
                  uint8(@write[w + 1] + 13) != uint8(@write[w + 2] + 13) and
                  uint8(@write[w + 1] + 13) != uint8(@write[w + 3] + 13) and
                  uint8(@write[w + 2] + 13) != uint8(@write[w + 3] + 13) and
                  for all i in (0..3) : (
                    uint16(@write[w + i] + 10) == uint16(@test[t] + 2) and
                    uint16(@write[w + i] + 6) == uint16(@write[w] + 6) and
                    uint16(@write[w + i] + 16) == uint16(@write[w] + 16)
                  ) and
                  int8(@advance[a] + !advance[a] - 1) < 0 and
                  @advance[a] + !advance[a] + int8(@advance[a] + !advance[a] - 1) == @test[t]
                )
              )
            )
        }

  - id: dos-date-gated-bios-hard-disk-target
    desc: DOS date check gates hard-disk target
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        rule dos_date_gated_bios_hard_disk_target {
          strings:
            $get_date = { B4 2A CD 21 [0-16] ( 81 F9 ?? ?? | 81 FA ?? ?? | 80 FE ?? | 80 FA ?? ) }
            $hdd_dl = { ( B2 80 | BA 80 00 ) }
          condition:
            $get_date and $hdd_dl
        }

composite_rules:
  - id: dos-date-triggered-head-cylinder-bios-wipe
    desc: Date-triggered BIOS head-cylinder disk wipe
    crit: hostile
    conf: 0.98
    attack: T1561.002
    all:
      - id: micro-behaviors/os/msdos/disk::dos-int13-head-cylinder-write-loop
      - id: dos-date-gated-bios-hard-disk-target
