defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

composite_rules:
  - id: dos-saved-vector-drive-overwrite
    desc: DOS repeatedly writes a buffer to fixed drives via the BIOS vector
    crit: hostile
    attack: T1561.001
    all:
      - id: micro-behaviors/os/msdos/disk::dos-save-int13-vector
      - id: micro-behaviors/os/msdos/disk::dos-saved-vector-disk-write-loop
