# INT 25h reads absolute sectors into a buffer and INT 26h writes them back
# at another start sector. Reading a block from deep in the volume and
# writing it over logical sector 1 (the first FAT on a standard DOS volume)
# destroys the file allocation table without touching the boot sector.
# The sequence sits in the first bytes of a tiny COM image, so it is bound
# to the image start.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1561.001
  size_max: 65536

traits:
  - id: dos-int25-read-int26-sector-one-write
    desc: DOS reads sectors, writes sector 1
    crit: suspicious
    conf: 0.95
    if:
      type: yara
      source: |
        rule dos_int25_read_int26_sector_one_write {
          meta:
            filetypes = "dos_com,data"
          strings:
            $copy = { B0 02 B9 ?? ?? BA ?? ?? CD 25 72 ?? B0 02 B9 ?? ?? BA 01 00 CD 26 }
          condition:
            $copy in (0..64)
        }

composite_rules:
  - id: dos-int25-int26-sector-copy-wiper
    desc: DOS copies sectors over logical sector 1
    crit: hostile
    conf: 0.95
    all:
      - id: dos-int25-read-int26-sector-one-write
      - id: dos-int26-raw-sector-range-write
