defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  attack: "T1561.002"

composite_rules:
  - id: windows-writefile-call
    desc: Windows WriteFile call
    # WriteFile alone is not wipe intent — sanitizers and ordinary Win32 I/O
    # use it. Hostile wipe composites require drive/geometry context.
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/fs/write/file/handle::writefile-api
      - id: micro-behaviors/fs/write/file/handle::write-file-source
    unless:
      - id: well-known/lib/development/sanitizer-runtime::sanitizer-runtime-source-path
  - id: windows-physical-drive-geometry
    desc: Queries physical drive geometry
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/hardware/block/device::disk-geometry-ioctl
      - id: micro-behaviors/hardware/block/device::disk-geometry-ioctl-source
  - id: windows-physical-drive-zero-wiper
    desc: Windows physical drive zero wiper
    crit: hostile
    conf: 0.99
    all:
      - id: windows-physical-drive-geometry
      - id: windows-writefile-call
      - id: micro-behaviors/fs/file/handle::device-io-control-win
      - id: micro-behaviors/fs/path/device/storage::windows-physicaldrive-path
    any:
      - id: micro-behaviors/hardware/block/device::disk-update-properties-ioctl
      - id: micro-behaviors/os/recovery::native-restore-point-api-profile
  - id: windows-volume-file-zero-wiper
    desc: Windows volume file zero wiper
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/delete/secure::fsctl-set-zero-data
      - id: micro-behaviors/fs/enumerate/volume::windows-volume-enumeration
    any:
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
      - id: micro-behaviors/fs/file/move::movefile-reboot-delay-cooccurrence
      - id: objectives/evasion/indicator-removal/logs::fsctl-delete-usn-journal
    unless:
      # Backup suites legitimately combine sparse-file zeroing, volume
      # enumeration and file deletion: SyncBack uses FSCTL_SET_ZERO_DATA for
      # sparse/Delta-copy handling across enumerated volumes.
      - id: well-known/app/storage/syncback::syncback-backup-benign-context
  - id: windows-destructive-native-wiper
    desc: Windows destructive native wiper
    crit: hostile
    conf: 0.99
    all:
      - id: windows-physical-drive-zero-wiper
      - id: windows-volume-file-zero-wiper
    any:
      - id: micro-behaviors/os/recovery::native-restore-point-api-profile
      - id: objectives/evasion/indicator-removal/logs::fsctl-delete-usn-journal
  # Geometry-query wipers are covered above. This shape writes the raw
  # device without IOCTL_DISK_GET_DRIVE_GEOMETRY: the device path and the
  # shadow-delete command sit in one string block, and the image imports
  # CreateFile plus WriteFile.
  - id: physicaldrive-path-beside-shadow-delete
    desc: PhysicalDrive path beside a shadow-copy delete command
    crit: suspicious
    conf: 0.96
    attack: T1561.002,T1490
    near_bytes: 512
    all:
      - id: micro-behaviors/fs/path/device/storage::windows-physicaldrive-path
      - id: objectives/impact/degrade/system/recovery::vssadmin-delete
  - id: raw-physicaldrive-write-with-shadow-deletion
    desc: PhysicalDrive path beside shadow deletion, with CreateFile and WriteFile
    crit: hostile
    conf: 0.97
    attack: T1561.002,T1490
    for: [pe, dll]
    all:
      - id: physicaldrive-path-beside-shadow-delete
      - id: micro-behaviors/fs/disk/raw::windows-physicaldrive-write-profile
    unless:
      - id: metadata/signed/platform/
