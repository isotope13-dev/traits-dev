# Additive-obfuscated DOS code: decoded AX=0311h invokes BIOS format track,
# iterating four heads and twenty cylinders on fixed disk 80h.
defaults:
  for: [dos_com]
  platforms: [windows]
  crit: component

traits:
  - id: additive-disk-format-loop
    desc: Encoded BIOS disk format loop
    crit: notable
    if:
      type: hex
      pattern: 'B7 10 02 2D 89 2D 5D FF B0 00 B1 7F 2D 89 35 5C FF CC 12 2D FD 05 5C FF 2D 7F 3D 5C FF 03 74 DF'
  - id: additive-decoder-loop
    desc: DOS additive decoder loop
    crit: notable
    if:
      type: hex
      pattern: '2E A0 00 00 2E 00 05 47 E2 FA'

composite_rules:
  - id: additive-dos-disk-format
    desc: Encoded DOS code formats fixed disk tracks in a loop
    crit: hostile
    attack: T1561.002
    all:
      - id: additive-disk-format-loop
      - id: additive-decoder-loop
