defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  # The explicitly named destructive routine supplies intent beyond the
  # generic raw-drive API profile. This is evidence of capability, not proof
  # that a write completed on the endpoint.
  - id: exported-mbr-overwrite-with-physicaldrive-write
    desc: MBR overwrite export with PhysicalDrive and native write APIs
    crit: hostile
    conf: 0.98
    attack: T1561.002
    all:
      - id: micro-behaviors/fs/disk/raw::mbr-overwrite-export
      - id: micro-behaviors/fs/disk/raw::windows-physicaldrive-path-write-api-cooccurrence
