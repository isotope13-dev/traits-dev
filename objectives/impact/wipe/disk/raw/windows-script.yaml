# Scripted Windows physical-drive zero-fill (PowerShell / managed). Complements
# the heavier native PE composite in disk/raw/windows-native.yaml.
defaults:
  platforms: [windows]
  for: [powershell, csharp, python, javascript]
  attack: T1561.002
  mbc: E1561

traits:
  - id: physicaldrive-filestream-open
    desc: Opens PhysicalDrive via File.Open
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)File\s*::\s*Open\s*\(|\[System\.IO\.File\]::Open\s*\('

  - id: physicaldrive-write-loop
    desc: Writes repeatedly to an open drive stream
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.Write\s*\(\s*\$?buf'

composite_rules:
  - id: windows-physicaldrive-script-wiper
    desc: Scripted PhysicalDrive zero-fill wiper
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/device/storage::windows-physicaldrive-path
      - id: physicaldrive-filestream-open
      - id: physicaldrive-write-loop
