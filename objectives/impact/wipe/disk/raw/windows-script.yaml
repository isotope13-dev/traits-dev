# Scripted Windows physical-drive zero-fill (PowerShell / managed). Complements
# the heavier native PE composite in disk/raw/windows-native.yaml.
defaults:
  platforms: [windows]
  for: [powershell, csharp]
  attack: T1561.002
  mbc: E1561

traits:
  # The .NET file-open atom this composite needs lives in
  # micro-behaviors/fs/file/open::dotnet-file-open. It used to be
  # defined here as `physicaldrive-filestream-open` (suspicious), but its
  # matcher never checked for a drive path -- it fired on every PowerShell that
  # opens a file stream with explicit share modes. The PhysicalDrive intent
  # comes from the drive-path leg below.

  # Require `$buf` — optional `$` plus bare `buf` matched Node `.write(Buffer…)` /
  # `.write(buffer…)` in bundled runtimes and was never a drive-wipe signal there.
  - id: physicaldrive-write-loop
    desc: Writes repeatedly to an open drive stream
    # Bare `.Write($buf` is too common (HTTP clients, buffers). Intent comes
    # from the PhysicalDrive composite below.
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.Write\s*\(\s*\$buf\b'

composite_rules:
  - id: windows-physicaldrive-script-wiper
    desc: Scripted PhysicalDrive zero-fill wiper
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/device/storage::windows-physicaldrive-path
      - id: micro-behaviors/fs/file/open::dotnet-file-open
      - id: physicaldrive-write-loop
