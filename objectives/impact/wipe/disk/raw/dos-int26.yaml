# DOS absolute disk write (INT 26h) armed by a date check. The GET DATE call
# (AH=2Ah) followed within a short branch by loading a sector count into CX
# and INT 26h is the classic COM virus "trigger day" payload that overwrites
# boot/FAT/directory sectors. Same byte gate as infect/binary/dos/com-bytes.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  attack: "T1561.001"

traits:
  - id: dos-date-triggered-int26-write
    desc: Date check gates INT 26h write
    crit: suspicious
    conf: 0.92
    if:
      type: hex
      pattern: "B4 2A [0-2] CD 21 [0-32] B9 ?? ?? [0-4] CD 26"

  - id: dos-int26-buffer-zero
    desc: DOS zeroes buffer pointer before INT 26h
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "BB 00 00 [0-12] CD 26"

  - id: dos-int26-raw-sector-range-write
    desc: DOS sets raw sectors before INT 26h
    crit: suspicious
    conf: 0.94
    if:
      type: hex
      pattern: "(B9 ?? ?? [0-8] BA ?? ??|BA ?? ?? [0-8] B9 ?? ??) [0-4] CD 26"

composite_rules:
  # The trigger-day sector write plus COM host handling (wildcard mask or
  # restoring the host timestamp) is a destructive DOS virus payload.
  - id: dos-com-trigger-day-disk-wipe
    desc: DOS COM virus trigger-day sector wipe
    crit: hostile
    conf: 0.94
    all:
      - id: dos-date-triggered-int26-write
    any:
      - id: micro-behaviors/fs/search::dos-com-exe-or-all-file-wildcard
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int21-set-file-time
      - id: micro-behaviors/fs/search::dos-int21-find-first-call
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write-call
    needs: 1

  - id: dos-int26-raw-disk-wiper
    desc: DOS overwrites raw disk sectors directly
    crit: hostile
    conf: 0.96
    size_max: 65536
    all:
      - id: dos-int26-raw-sector-range-write
      - id: dos-int26-buffer-zero
