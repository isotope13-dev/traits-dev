# DOS absolute disk write (INT 26h) armed by a date check. The GET DATE call
# (AH=2Ah) followed within a short branch by loading a sector count into CX
# and INT 26h is the classic COM virus "trigger day" payload that overwrites
# boot/FAT/directory sectors. Same byte gate as infect/binary/dos/com-bytes.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  attack: "T1561.001"
  size_max: 65536

traits:
  - id: dos-date-triggered-int26-write
    desc: Date check gates INT 26h write
    crit: suspicious
    conf: 0.92
    if:
      type: hex
      pattern: "B4 2A [0-2] CD 21 [0-32] B9 ?? ?? [0-4] CD 26"

  - id: dos-int26-buffer-zero
    desc: DOS zeroes buffer pointer before INT 26h
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "BB 00 00 [0-12] CD 26"

  - id: dos-time-triggered-int26-write
    desc: Time check gates INT 26h write
    crit: suspicious
    conf: 0.92
    if:
      type: yara
      source: |
        rule dos_time_triggered_int26_write {
          meta:
            filetypes = "dos_com,data"
          strings:
            $wipe = { B4 2C [0-2] CD 21 [0-16] B9 ?? ?? [0-4] CD 26 }
          condition:
            $wipe in (0..512)
        }

  - id: dos-int26-raw-sector-range-write
    desc: DOS sets raw sectors before INT 26h
    crit: suspicious
    conf: 0.94
    # COM absolute-write setup sits in the entry stub, same window as the
    # INT 13h and INT 26h siblings. The byte sequence deep in a data blob
    # is not a program choosing a sector range.
    if:
      type: hex
      pattern: "(B9 ?? ?? [0-8] BA ?? ?? [0-4] CD 26|B9 ?? ?? [0-8] B6 ?? [0-4] CD 26|BA ?? ?? [0-8] B9 ?? ?? [0-4] CD 26|B6 ?? [0-8] B9 ?? ?? [0-4] CD 26)"
      offset_range: [0, 512]

  # AL=drive, CX=sector count, DX=first sector, then INT 26h: the whole
  # absolute-write request is loaded as immediates, so the program chooses
  # the disk area itself. Written as YARA so the sequence is evaluated on
  # images under the engine's size floor.
  - id: dos-int26-drive-count-start-write
    desc: DOS loads drive, count, start, writes sectors
    crit: suspicious
    conf: 0.9
    if:
      type: yara
      source: |
        rule dos_int26_drive_count_start_write {
          meta:
            filetypes = "dos_com,data"
          strings:
            $req = { B0 ?? B9 ?? ?? BA ?? ?? CD 26 }
          condition:
            $req in (0..512)
        }

composite_rules:
  # The trigger-day sector write plus COM host handling (wildcard mask or
  # restoring the host timestamp) is a destructive DOS virus payload.
  - id: dos-com-trigger-day-disk-wipe
    desc: DOS COM virus trigger-day sector wipe
    crit: hostile
    conf: 0.94
    all:
      - id: dos-date-triggered-int26-write
    any:
      - id: micro-behaviors/fs/search::dos-executable-compatible-wildcard
      - id: micro-behaviors/fs/file/timestamp::dos-int21-set-file-time
      - id: micro-behaviors/fs/search::dos-int21-find-first-call
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write-call
    needs: 1

  - id: dos-int26-raw-disk-wiper
    desc: DOS overwrites raw disk sectors directly
    crit: hostile
    conf: 0.96
    size_max: 65536
    all:
      - id: dos-int26-raw-sector-range-write
      - id: dos-int26-buffer-zero

  - id: dos-int26-sector-zero-bulk-write
    desc: DOS writes many sectors from sector zero
    crit: hostile
    conf: 0.93
    size_max: 4096
    all:
      - id: dos-int26-drive-count-start-write
      - id: objectives/impact/wipe/disk/mbr::dos-int26-mov-dx-zero

  - id: dos-time-triggered-disk-wipe
    desc: DOS time-gated absolute disk wipe
    crit: hostile
    conf: 0.95
    size_max: 65536
    all:
      - id: dos-time-triggered-int26-write
      - id: dos-int26-raw-sector-range-write

