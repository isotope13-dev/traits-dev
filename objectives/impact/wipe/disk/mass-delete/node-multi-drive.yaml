# Enumerating several drive roots and overwriting enumerated files with
# empty content destroys data on every listed volume. A drive list alone,
# a directory walk alone, and an empty write alone each have benign uses.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1485

composite_rules:
  - id: node-multi-drive-empty-wipe
    desc: Node empties files enumerated across multiple drives
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/enumerate/directory::node-multiple-drive-roots
      - id: micro-behaviors/fs/directory/readdir::node-readdir-sync-call
      - id: micro-behaviors/fs/file/truncate::node-empty-write-default-mode
