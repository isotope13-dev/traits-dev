defaults:
  platforms: [windows]
  for: [batch]
  attack: T1485

composite_rules:
  - id: batch-multi-drive-root-wipe
    desc: Batch wipes roots of multiple drives
    crit: hostile
    conf: 0.96
    size_max: 8192
    all:
      - id: micro-behaviors/fs/delete/file/command::batch-del-call
      - id: micro-behaviors/fs/delete/target::batch-del-drive-root-multi-drive
