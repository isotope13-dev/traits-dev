defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1485

traits:
  - id: encoded-date-gate-and-documents-target
    desc: Encoded date gate selects Documents
    crit: notable
    conf: 0.96
    if:
      type: text
      case_insensitive: true
      regex: '45627A296F70782A.{0,1000}4E7A21457064766E666F7574'
  - id: encoded-documents-file-deletion-loop
    desc: Encoded Documents file deletion loop
    crit: notable
    conf: 0.97
    if:
      type: text
      case_insensitive: true
      regex: '214770732166626469.{0,60}2F676A6D6674'
  - id: encoded-documents-delete-call
    desc: Encoded per-file Delete call
    crit: component
    conf: 0.96
    if:
      type: text
      case_insensitive: true
      substr: '2121716A792F65666D667566'

composite_rules:
  - id: vbs-encoded-date-gated-documents-wipe
    desc: Date-triggered deletion of files in the user's Documents folder
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/custom::vbs-hex-offset-decode-execute
      - id: objectives/impact/wipe/disk/mass-delete::encoded-date-gate-and-documents-target
      - id: objectives/impact/wipe/disk/mass-delete::encoded-documents-file-deletion-loop
      - id: objectives/impact/wipe/disk/mass-delete::encoded-documents-delete-call
