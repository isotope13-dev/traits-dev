defaults:
  platforms: [windows]
  for: [batch]
  attack: T1485

composite_rules:
  - id: batch-wipes-drive-root-then-restarts
    desc: Batch removes drive root, then restarts host
    crit: hostile
    conf: 0.95
    size_max: 4096
    all:
      - id: micro-behaviors/fs/delete/target::windows-drive-root-recursive-delete
      - id: micro-behaviors/os/event/shutdown::shutdown-command-text
