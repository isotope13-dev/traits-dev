defaults:
  for: [batch]
  platforms: [windows]
  attack: T1485
composite_rules:
  - id: batch-cwd-sys-delete-with-attribute-clear
    desc: Batch clears attributes then deletes SYS glob
    crit: hostile
    conf: 0.98
    # One deletion workflow, corroborated through structural and call views.
    # No installed-driver identity or successful damage is asserted.
    all:
      - id: micro-behaviors/fs/delete/file/command::batch-entry-sys-delete-attribute-console-flow
      - id: micro-behaviors/fs/delete/file/command::batch-del-call
