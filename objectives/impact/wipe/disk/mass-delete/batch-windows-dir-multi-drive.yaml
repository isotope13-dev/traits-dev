defaults:
  platforms: [windows]
  for: [batch]
  attack: T1485

composite_rules:
  - id: batch-rd-windows-folder-on-many-drives
    desc: Batch recursively removes Windows on each drive
    crit: hostile
    conf: 0.93
    size_max: 8192
    all:
      - id: micro-behaviors/fs/delete/directory::windows-rd-recursive
      - id: micro-behaviors/fs/delete/target::windows-dir-delete-multi-drive
