defaults:
  platforms: [windows, unix]
  for: [class, java_class]
  attack: T1485
  mbc: B0040

traits:
  - id: jvm-user-home-property
    desc: JVM references user.home system property
    crit: notable
    conf: 0.95
    if:
      type: value
      path: class.strings[*]
      exact: user.home

  - id: jvm-documents-folder-target
    desc: JVM references Documents folder
    crit: notable
    conf: 0.95
    if:
      type: value
      path: class.strings[*]
      exact: Documents

  - id: jvm-desktop-folder-target
    desc: JVM references Desktop folder
    crit: notable
    conf: 0.95
    if:
      type: value
      path: class.strings[*]
      exact: Desktop

  - id: jvm-pictures-folder-target
    desc: JVM references Pictures folder
    crit: notable
    conf: 0.95
    if:
      type: value
      path: class.strings[*]
      exact: Pictures

composite_rules:
  - id: jvm-recursive-user-folders-wipe
    desc: JVM recursively deletes standard user folders
    crit: hostile
    conf: 0.99
    scope: leaf
    all:
      - id: micro-behaviors/fs/delete/file/library::java-file-delete-bytecode
      - id: micro-behaviors/fs/directory/readdir::jvm-file-listfiles
      - id: jvm-user-home-property
      - id: jvm-documents-folder-target
      - id: jvm-desktop-folder-target
      - id: jvm-pictures-folder-target
