defaults:
  platforms: [windows]
  for: [batch]
  attack: T1485
  mbc: C0047

traits:
  - id: batch-deltree-windows-dir
    desc: Batch removes the Windows directory
    crit: suspicious
    conf: 0.98
    if:
      type: text
      # End the path at Windows itself. `c:\windows\temp` is a cleanup
      # subdirectory; `\b` still matches before that backslash.
      regex: '(?im)\bdeltree(\.exe)?\s+([/-]y\s+)?[a-z]:\\windows\\?\s*$'
  - id: batch-echo-y-del
    desc: Pipes yes into a delete command
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)echo\s+y\s*\|\s*del\b'
  - id: batch-del-com-glob
    desc: Deletes every COM in the directory
    crit: notable
    conf: 0.9
    for: [batch, static-lib, text]
    if:
      type: text
      regex: '(?i)\bdel\s+\*\.com\b'
  - id: batch-del-bat-glob
    desc: Deletes every BAT in the directory
    crit: notable
    conf: 0.88
    for: [batch, static-lib, text]
    if:
      type: text
      regex: '(?i)\bdel\s+\*\.bat\b'

composite_rules:
  # A launcher that enters its configured temporary directory and prunes that
  # directory's contents is doing bounded cache/temp cleanup.
  - id: batch-temp-directory-cleanup
    desc: Batch clears its configured temporary directory
    crit: exception
    conf: 0.95
    for: [zip, batch]
    near_lines: 4
    all:
      - id: micro-behaviors/fs/directory/chdir::batch-enters-configured-temp-directory
      - id: micro-behaviors/fs/delete/file/command::batch-del-star-nul

  - id: batch-deltree-system-wiper
    desc: Batch recursively wipes the Windows directory with DELTREE
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/delete/directory::deltree-absolute-path-command
      - id: batch-deltree-windows-dir

  - id: batch-confirmed-cwd-wipe
    desc: Batch auto-confirms delete of all files
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/shell/pipeline::batch-echo-y-pipe
      - id: micro-behaviors/fs/delete/file/command::batch-del-star-glob

  - id: batch-silent-star-glob-wipe
    desc: Batch silently deletes every cwd file
    crit: hostile
    conf: 0.95
    unless:
      - id: batch-temp-directory-cleanup
    all:
      - id: micro-behaviors/fs/delete/file/command::batch-del-star-glob
      - id: micro-behaviors/fs/delete/file/command::batch-del-star-nul

  - id: batch-confirmed-piped-delete
    desc: Batch auto-confirms a piped delete
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/shell/pipeline::batch-echo-y-pipe
      - id: batch-echo-y-del

  - id: batch-program-extension-wipe
    desc: Deletes programs by extension wildcards
    crit: hostile
    conf: 0.95
    for: [batch, static-lib, text]
    all:
      - id: micro-behaviors/fs/delete/file/command::del-exe-wildcard-command-text
      - id: batch-del-com-glob
      - id: batch-del-bat-glob
