defaults:
  platforms: [windows]
  for: [batch]
  attack: T1485
  mbc: C0047

traits:
  # Legs of the HTML-carried batch wiper. The wide gaps between them are
  # expressed as near_bytes on the composites below rather than counted runs.
  - id: html-batch-echo-off
    desc: HTML carries a batch echo-off header
    crit: component
    conf: 0.9
    for: [html]
    if:
      type: text
      regex: '(?i)@echo off'
  - id: html-batch-del-exe-dll
    desc: HTML batch deletes all EXE and DLL
    crit: notable
    conf: 0.95
    for: [html]
    if:
      type: text
      regex: '(?is)del\s+\*\.exe.{0,200}del\s+\*\.dll'
  - id: html-batch-ctty-nul
    desc: HTML batch redirects the console to NUL
    crit: notable
    conf: 0.95
    for: [html]
    if:
      type: text
      regex: '(?i)@ctty\s+nul'
  - id: html-batch-goto-label-one
    desc: HTML batch jumps to label 1
    crit: component
    conf: 0.85
    for: [html]
    if:
      type: text
      regex: '(?i)goto\s+1'
  - id: batch-deltree-root-drive
    desc: Batch removes a drive root
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bdeltree(\.exe)?\s+([/-]y\s+)?[a-z]:\\\*\.\*'
  - id: batch-deltree-windows-dir
    desc: Batch removes the Windows directory
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bdeltree(\.exe)?\s+([/-]y\s+)?[a-z]:\\windows\b'
  - id: batch-del-star-nul
    desc: Deletes every cwd file to NUL
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bdel\s+\*\.\*[^\r\n]{0,20}>\s*nul\b'
  - id: batch-echo-y-del
    desc: Pipes yes into a delete command
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)echo\s+y\s*\|\s*del\b'
  - id: batch-del-com-glob
    desc: Deletes every COM in the directory
    crit: notable
    conf: 0.9
    for: [batch, static-lib, text]
    if:
      type: text
      regex: '(?i)\bdel\s+\*\.com\b'
  - id: batch-del-bat-glob
    desc: Deletes every BAT in the directory
    crit: notable
    conf: 0.88
    for: [batch, static-lib, text]
    if:
      type: text
      regex: '(?i)\bdel\s+\*\.bat\b'

composite_rules:
  - id: html-batch-executable-deletion-loop
    desc: HTML hides batch loop deleting executables
    crit: suspicious
    conf: 0.99
    for: [html]
    near_bytes: 4400
    all:
      - id: html-batch-echo-off
      - id: html-batch-del-exe-dll
  - id: html-batch-silent-loop
    desc: HTML hides and loops a batch payload
    crit: suspicious
    conf: 0.97
    for: [html]
    near_bytes: 4100
    all:
      - id: html-batch-ctty-nul
      - id: html-batch-goto-label-one
  - id: html-batch-executable-wiper
    desc: HTML carrier hides a batch loop that deletes executables
    crit: hostile
    conf: 0.99
    for: [html]
    all:
      - id: html-batch-executable-deletion-loop
      - id: html-batch-silent-loop
  - id: batch-deltree-root-drive-wiper
    desc: Batch recursively removes every file on a drive
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/delete/file/command::batch-deltree-tree-delete
      - id: batch-deltree-root-drive
  - id: batch-deltree-system-wiper
    desc: Batch recursively wipes the Windows directory with DELTREE
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/delete/file/command::batch-deltree-tree-delete
      - id: batch-deltree-windows-dir
  - id: batch-confirmed-cwd-wipe
    desc: Batch auto-confirms delete of all files
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/shell/pipeline::batch-echo-y-pipe
      - id: micro-behaviors/fs/delete/file/command::batch-del-star-glob
  - id: batch-silent-star-glob-wipe
    desc: Batch silently deletes every cwd file
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/delete/file/command::batch-del-star-glob
      - id: batch-del-star-nul
  - id: batch-confirmed-piped-delete
    desc: Batch auto-confirms a piped delete
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/shell/pipeline::batch-echo-y-pipe
      - id: batch-echo-y-del
  - id: batch-program-extension-wipe
    desc: Deletes programs by extension wildcards
    crit: hostile
    conf: 0.95
    for: [batch, static-lib, text]
    all:
      - id: objectives/impact/system/directory::batch-del-wildcard-exe
      - id: batch-del-com-glob
      - id: batch-del-bat-glob
