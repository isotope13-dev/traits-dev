defaults:
  platforms: [windows]
  for: [dos_com]
  attack: T1561.002

traits:
  - id: dos-hard-disk-geometry-query
    desc: DOS code queries first hard disk geometry
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'B4 08 B2 80 CD 13'
  - id: dos-bios-multihead-sector-write-loop
    desc: DOS BIOS sector writes loop across heads
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'B2 80 BB ?? ?? FE C6 2E A0 ?? ?? B4 03 CD 13 2E 3A 36 ?? ?? 75 ?? C3'

composite_rules:
  - id: dos-hard-disk-geometry-multihead-overwrite
    desc: DOS code queries disk geometry and overwrites sectors across heads
    crit: hostile
    conf: 0.99
    near_bytes: 256
    all:
      - id: dos-hard-disk-geometry-query
      - id: dos-bios-multihead-sector-write-loop
