defaults:
  platforms: [unix]
  for: [go, macho]
  attack: T1485

traits:
  - id: go-home-media-wipe-list
    desc: Home media directory name sequence
    # Directory names alone do not establish deletion.  Keep this as an
    # attack-context fragment for the wipe composite rather than surfacing it
    # as suspicious behavior; file dialogs and backup tools commonly enumerate
    # the same user directories.
    crit: component
    conf: 0.94
    if:
      type: text
      regex: 'Documents[\s\S]{0,120}Desktop[\s\S]{0,120}Downloads'

  - id: go-keychain-delete-cmd
    desc: Go keychain delete command
    crit: component
    conf: 0.94
    if:
      type: text
      substr: delete-keychain

  - id: go-macho-user-wipe-strings
    desc: Go Mach-O user wipe strings
    crit: suspicious
    conf: 0.94
    for: [macho]
    if:
      type: text
      substr: DocumentsDownloads.cache_

composite_rules:
  - id: go-macos-user-data-wipe
    desc: Go macOS user data wipe
    crit: hostile
    conf: 0.98
    for: [go]
    all:
      - id: go-home-media-wipe-list
    any:
      - id: micro-behaviors/fs/file/delete::os-Remove
      - id: micro-behaviors/fs/file/delete::os-RemoveAll
    needs: 1

  - id: go-macho-user-data-wipe
    desc: Go Mach-O user data wipe
    crit: hostile
    conf: 0.98
    all:
      # Prefer the full `security delete-keychain` form; keep the short token as
      # a fallback only when paired with Go wipe strings. Use the reusable
      # os.RemoveAll atom — bare "RemoveAll" matches Objective-C selectors
      # such as RemoveAllDestinations in macOS tooling (e.g. Tauri CLI).
      - id: go-keychain-delete-cmd
    any:
      - id: go-macho-user-wipe-strings
      - id: micro-behaviors/fs/file/delete::os-RemoveAll-string
    needs: 1

  - id: go-shell-root-filesystem-wipe
    desc: Go executes root filesystem wipe command
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/destroy/keywords::rm-rf-root-command
      - id: micro-behaviors/process/create/direct::exec-command
    unless:
      - id: metadata/package/testing/
      - id: micro-behaviors/process/create/shell/guard/
    any:
      - id: objectives/impact/destroy/file-deletion/

  - id: root-filesystem-wipe-go-exec
    desc: Root filesystem wipe via Go exec
    crit: hostile
    conf: 0.99
    for: [elf, macho]
    all:
      - id: micro-behaviors/process/create/system::go-os-exec-pclntab
      - id: objectives/impact/destroy/file-deletion::unix-root-rm-binary-string
    unless:
      - id: well-known/tool/detection/
      # A coding-agent host embeds the commands it *refuses* to run as
      # `Bash(rm -rf /*)` permission patterns. Every Go agent runner links
      # os/exec, so the pair above fires on the guardrail itself.
      - id: metadata/file/policy/identity::agent-tool-permission-ruleset
      - id: micro-behaviors/process/create/shell/guard::ai-cli-destructive-command-deny-rules
      - id: micro-behaviors/process/create/shell/guard::ai-cli-destructive-command-deny-rules
