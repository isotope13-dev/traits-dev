defaults:
  platforms: [unix]
  for: [go, macho]
  attack: T1485

traits:
  - id: go-keychain-delete-cmd
    desc: Go keychain delete command
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: delete-keychain

  - id: go-macho-user-wipe-strings
    desc: Go Mach-O user wipe strings
    crit: suspicious
    conf: 0.94
    for: [macho]
    if:
      type: text
      substr: DocumentsDownloads.cache_

composite_rules:
  - id: go-macos-user-data-wipe
    desc: Go macOS user data wipe
    crit: hostile
    conf: 0.98
    for: [go]
    all:
      - id: micro-behaviors/fs/path/personal::home-media-directory-sequence
    any:
      - id: micro-behaviors/fs/delete/file/library::os-Remove
      - id: micro-behaviors/fs/delete/directory::os-RemoveAll
    needs: 1

  - id: go-macho-user-data-wipe
    desc: Go Mach-O user data wipe
    crit: hostile
    conf: 0.98
    all:
      # Prefer the full `security delete-keychain` form; keep the short token as
      # a fallback only when paired with Go wipe strings. Use the reusable
      # os.RemoveAll atom — bare "RemoveAll" matches Objective-C selectors
      # such as RemoveAllDestinations in macOS tooling (e.g. Tauri CLI).
      - id: go-keychain-delete-cmd
    any:
      - id: go-macho-user-wipe-strings
      - id: micro-behaviors/fs/delete/directory::os-RemoveAll-string
    needs: 1

  - id: go-shell-root-filesystem-wipe
    for: [go]
    desc: Go executes root filesystem wipe command
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/delete/directory::root-recursive-delete-command-reference
      - id: metadata/lang/source/syntax/call/construction::go-exec-command-call
    unless:
      - id: metadata/path/directory::test-directory-component
      - id: micro-behaviors/os/security/command-policy::command-policy-implementation-context
    any:
      - id: objectives/impact/destroy/file-deletion/

  - id: root-filesystem-wipe-go-exec
    desc: Root filesystem wipe via Go exec
    crit: hostile
    conf: 0.99
    for: [elf, macho]
    all:
      - id: metadata/binary/symbols/name/process::go-os-exec-package-reference
      - id: objectives/impact/destroy/file-deletion::unix-root-rm-binary-string
    unless:
      - id: micro-behaviors/os/security/command-policy::ai-cli-destructive-command-deny-rules
