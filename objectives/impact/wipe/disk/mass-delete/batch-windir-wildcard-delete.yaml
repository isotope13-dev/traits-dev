defaults:
  platforms: [windows]
  for: [batch]
  attack: T1485

composite_rules:
  - id: batch-wildcard-wipe-of-windows-folder
    desc: Batch wildcard-deletes system files in Windows
    crit: hostile
    conf: 0.93
    size_max: 4096
    all:
      - id: micro-behaviors/fs/delete/target::batch-del-windows-folder-glob
      - id: micro-behaviors/fs/delete/file/command::batch-del-wildcard-target
  - id: batch-cd-windows-del-star-wipe
    desc: Batch changes to Windows folder and deletes all files
    crit: hostile
    conf: 0.96
    size_max: 4096
    near_lines: 10
    all:
      - id: micro-behaviors/fs/path/system::batch-windows-dir-change
      - id: micro-behaviors/fs/delete/file/command::batch-del-star-glob
