defaults:
  platforms:
    - unix
    - android
    - ios
  for:
    - shell
traits:
  - id: dd-zero-to-dev
    desc: dd zero-fill to device node
    crit: notable
    if:
      type: text
      # Shell-only rule: require dd in command position. Quoted security-test
      # payloads and assertions such as "dd ... blocked" are data, not calls.
      regex: '(?m)^\s*(sudo\s+)?dd\s+.{0,100}if=/dev/zero.{0,100}of=/dev/.{1,64}'
      not:
      - regex: '\bof=/dev/(null|zero|random|urandom|stdin|stdout|stderr)\b'
      - regex: '\bof=/dev/(fd|pts|shm|tty)(/|\b)'
    unless:
      - id: micro-behaviors/os/console/io::command-targets-dev-stdout
  - id: dd-urandom-to-dev
    desc: dd random-fill to device node
    crit: notable
    if:
      type: text
      # The match must run past `of=/dev/` into the node name, or the `not:`
      # below cannot see it: profile workloads such as
      # `dd count=500 if=/dev/urandom of=/dev/null` would otherwise read as a
      # device overwrite.
      regex: '(?m)^\s*(sudo\s+)?dd\s+.{0,100}if=/dev/u?random.{0,100}of=/dev/.{1,64}'
      not:
      - regex: '\bof=/dev/(null|random|urandom)\b'
    unless:
      - id: micro-behaviors/os/console/io::command-targets-dev-stdout
  - id: xargs-dd-pipeline
    desc: xargs piping to dd (wiper)
    crit: suspicious
    conf: 0.9
    attack: T1561.002
    if:
      type: text
      regex: xargs\s+.{0,100}dd\s+.{0,100}/dev/zero
composite_rules:
  - id: dd-fill-to-dev
    desc: dd zero or random fill written to a device node
    crit: suspicious
    conf: 0.85
    attack: T1561.002
    any:
      - id: dd-zero-to-dev
      - id: dd-urandom-to-dev
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: well-known/app/utility/kpango-dotfiles/
      - id: well-known/app/storage/clonezilla/
      # Worked examples in documentation. u-boot's README.rockchip spells out
      # `dd if=idbloader.img of=/dev/sdX` for flashing a board, and ships in
      # doc/ in source and /usr/share/doc/ in the .deb.
      - id: metadata/package/documentation/source/
      # OpenWrt preinit/extroot provisioning formats the device's own
      # overlay partitions at first boot.
      - id: micro-behaviors/fs/path/config/system::openwrt-firmware-component-context
      - id: micro-behaviors/hardware/flash/device::firmware-upgrade-context
  - id: dd-destructive
    desc: Destructive dd patterns
    crit: suspicious
    conf: 0.85
    mbc: E1561
    attack: T1561.002
    any:
    - id: dd-fill-to-dev
    - id: xargs-dd-pipeline
    - id: objectives/impact/wipe/disk/device::dd-zero
    - id: objectives/impact/wipe/disk/device::dd-random
    unless:
    - id: metadata/package/testing/presence/harness::test-directory-path
    - id: well-known/app/utility/cmdchamp/
    - id: well-known/app/utility/kpango-dotfiles/
    - id: well-known/app/storage/clonezilla/
    - id: metadata/package/documentation/source/
    - id: micro-behaviors/hardware/flash/device::firmware-upgrade-context
  - id: parallel-exec
    desc: xargs parallel execution component
    crit: component
    conf: 0.7
    any:
      - id: micro-behaviors/process/create/workers::xargs-cmd
      - id: micro-behaviors/process/create/workers::xargs-parallel-flag
    unless:
      - id: well-known/app/data/mysqltuner::mysqltuner-source-path
  - id: wiper-full
    desc: Disk wiper with parallel exec
    crit: hostile
    conf: 0.95
    mbc: E1561
    attack: T1561.002
    all:
      - id: micro-behaviors/os/privilege/check::root-privilege-check
      - id: micro-behaviors/fs/enumerate/device::block-device-path-enumeration
      - id: dd-destructive
      - id: parallel-exec
  - id: wiper
    desc: Disk wiper detected
    crit: hostile
    conf: 0.9
    mbc: E1561
    attack: T1561.002
    all:
      - id: micro-behaviors/os/privilege/check::root-privilege-check
      - id: micro-behaviors/fs/enumerate/device::block-device-path-enumeration
      - id: dd-destructive

  - id: dd-fill-block-device-wipe
    desc: Overwrites block device with zero or random fill via dd
    crit: hostile
    conf: 0.95
    mbc: E1561
    attack: T1561.002
    all:
    - id: dd-fill-to-dev
    - id: micro-behaviors/hardware/block/device::dd-block-device-write
    unless:
    - id: metadata/lang/upstream::linux-kernel-primary-tree-path
    - id: metadata/package/testing/presence/harness::test-directory-path
    - id: well-known/app/utility/kpango-dotfiles/
    - id: well-known/app/storage/clonezilla/
    - id: metadata/package/documentation/source/
    - id: well-known/app/utility/cmdchamp/
    - id: micro-behaviors/hardware/flash/device::firmware-upgrade-context
