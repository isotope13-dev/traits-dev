defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
composite_rules:
- id: privileged-mounted-device-wipe-command-text
  desc: Root disk scan constructs a zero-fill command string
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/os/privilege/check::uid-check-content
  - id: micro-behaviors/fs/proc/mounts::proc-mounts-dev-path-scan
  - id: metadata/lang/source/syntax/command/named-command::xargs-dd-zero-reference
  scope: file
  near_lines: 12
- id: dd-destructive
  desc: Device overwrite or parallel dd command
  crit: notable
  conf: 0.85
  mbc: E1561
  attack: T1561.002
  any:
  - id: micro-behaviors/fs/disk/raw::dd-fill-to-dev
  - id: metadata/lang/source/syntax/command/named-command::xargs-dd-zero-reference
- id: parallel-exec
  desc: xargs parallel execution component
  crit: component
  conf: 0.7
  any:
  - id: micro-behaviors/process/work/queue::xargs-cmd
  - id: micro-behaviors/process/work/queue::xargs-parallel-flag
  unless:
  - id: well-known/app/data/mysqltuner::mysqltuner-source-path
- id: wiper-full
  desc: Disk wiper with parallel exec
  crit: hostile
  conf: 0.95
  mbc: E1561
  attack: T1561.002
  all:
  - id: micro-behaviors/os/privilege/check::root-privilege-check
  - id: micro-behaviors/fs/enumerate/device::block-device-path-enumeration
  - id: dd-destructive
  - id: parallel-exec
- id: wiper
  desc: Disk wiper detected
  crit: hostile
  conf: 0.9
  mbc: E1561
  attack: T1561.002
  all:
  - id: micro-behaviors/os/privilege/check::root-privilege-check
  - id: micro-behaviors/fs/enumerate/device::block-device-path-enumeration
  - id: dd-destructive

- id: dd-fill-block-device-wipe
  desc: Device overwrite evidence with recursive filesystem-root deletion
  crit: hostile
  conf: 0.95
  mbc: E1561
  attack: T1561.002
  all:
  - id: micro-behaviors/fs/disk/raw::dd-fill-to-dev
  - id: micro-behaviors/hardware/block/device::dd-block-device-write
  - id: micro-behaviors/fs/delete/directory::recursive-root
  downgrade:
    any:
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
    - id: micro-behaviors/hardware/flash/device::firmware-upgrade-context
