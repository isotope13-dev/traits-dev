defaults:
  platforms: [openbsd]
  for: [shell]
  attack: T1561.002
  mbc: E1561

traits:
  - id: shell-swapoff-before-device-wipe
    desc: Swapoff before device overwrite
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'swapoff\s+["$][A-Za-z_][A-Za-z0-9_]*[\s\S]{0,240}\bdd\s+if=/dev/(u?random|zero)\b'
    unless:
      - id: well-known/app/utility/util-linux::util-linux-source-tree
      - id: well-known/app/storage/clonezilla::package-context
      - id: well-known/app/storage/clonezilla::archive-name
      - id: well-known/app/storage/clonezilla::clonezilla-script-context

  # Same file-vs-device confusion as the zero variant below: a `$*FILE`
  # variable names a regular file, not the device this trait reports.
  - id: shell-dd-random-variable-device
    desc: Shell dd random data to variable device
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'dd\s+if=/dev/u?random\s+of\s*=\s*["'']?\$[A-Za-z_]*(DEV|DISK|SWAP)[A-Za-z_]*'
    not:
      - regex: '\$[A-Za-z_]*FILE'
    unless:
      - id: well-known/app/system/samba::samba-source-tree
      - id: metadata/package/testing/presence/harness::shell-test-prefix-basename
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::ndctl-nfit-shell-test
      - type: path
        regex: 'tests[\\/]ts[\\/]'
      - id: well-known/app/utility/util-linux::util-linux-test-script
      - id: well-known/app/storage/clonezilla::package-context
      - id: well-known/app/storage/clonezilla::clonezilla-script-context

  # `SWAP` in the variable-name alternation also matches `$SWAP_FILE`, and a
  # variable named for a file is not the device this trait is named and
  # described for. Creating a swap file is `dd if=/dev/zero of="$SWAP_FILE"`
  # (the portable fallback when fallocate is missing) immediately followed by
  # chmod 600, mkswap and swapon -- provisioning swap, the opposite of wiping
  # it. The `not:` drops the file-named variables; the `mkswap` exclusion
  # covers the same context when the variable is spelled some other way, since
  # a wiper swapoffs and destroys, it never formats new swap afterwards.
  - id: shell-dd-zero-variable-device
    desc: Shell dd zero data to variable device
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'dd\s+if=/dev/zero\s+of\s*=\s*["'']?\$[A-Za-z_]*(DEV|DISK|SWAP)[A-Za-z_]*'
    not:
      - regex: '\$[A-Za-z_]*FILE'
    unless:
      - type: text
        substr: mkswap
      - id: metadata/package/testing/presence/harness::shell-test-prefix-basename
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::ndctl-nfit-shell-test
      - type: path
        regex: 'tests[\\/]ts[\\/]'
      - type: text
        substr: '_dd if=/dev/zero'
      - id: well-known/app/storage/clonezilla::package-context
      - id: well-known/app/storage/clonezilla::clonezilla-script-context
      # USB boot-media installers wipe partition prefixes before writing images.
      - id: well-known/app/utility/ventoy::disk-installer-context

composite_rules:
  - id: openbsd-shell-swap-wiper
    desc: OpenBSD shell wipes swap device
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/swap/enumerate::shell-swap-line-enumeration
    any:
      - id: shell-swapoff-before-device-wipe
      - id: micro-behaviors/fs/swap/off::shell-swapoff-all
      - id: shell-dd-random-variable-device
      - id: shell-dd-zero-variable-device
    unless:
      - id: well-known/app/storage/clonezilla::package-context
      - id: well-known/app/storage/clonezilla::clonezilla-script-context

  - id: openbsd-shell-zero-swap-wiper
    desc: OpenBSD shell zeroes swap device
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/swap/enumerate::shell-swap-line-enumeration
      - id: micro-behaviors/fs/swap/off::shell-swapoff-all
      - id: shell-dd-zero-variable-device
    unless:
      - id: well-known/app/storage/clonezilla::package-context
      - id: well-known/app/storage/clonezilla::clonezilla-script-context
