defaults:
  platforms:
  - openbsd
  for:
  - shell
  attack: T1561.002
  mbc: E1561
  crit: hostile
  conf: 0.98
traits: []
composite_rules:
- id: openbsd-shell-swap-wiper
  desc: Unbounded overwrite of block-checked swap
  unless:
  - id: well-known/app/storage/clonezilla::package-context
  - id: well-known/app/storage/clonezilla::clonezilla-script-context
  - id: micro-behaviors/fs/volume/format::shell-fstab-swap-zero-format
  any:
  - id: micro-behaviors/fs/disk/raw::shell-unbounded-zero-fstab-swap-write
  - id: micro-behaviors/fs/disk/raw::shell-unbounded-random-fstab-swap-write
  all:
  - id: micro-behaviors/fs/swap::shell-disables-block-checked-fstab-swap
- id: openbsd-shell-zero-swap-wiper
  desc: Unbounded zeroing of block-checked swap
  all:
  - id: micro-behaviors/fs/swap::shell-disables-block-checked-fstab-swap
  - id: micro-behaviors/fs/disk/raw::shell-unbounded-zero-fstab-swap-write
  unless:
  - id: well-known/app/storage/clonezilla::package-context
  - id: well-known/app/storage/clonezilla::clonezilla-script-context
  - id: micro-behaviors/fs/volume/format::shell-fstab-swap-zero-format
