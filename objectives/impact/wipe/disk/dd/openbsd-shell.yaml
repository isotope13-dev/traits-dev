defaults:
  platforms: [openbsd]
  for: [shell]
  attack: T1561.002
  mbc: E1561

traits:
  - id: shell-swapoff-before-device-wipe
    desc: Swapoff before device overwrite
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'swapoff\s+["$][A-Za-z_][A-Za-z0-9_]*[\s\S]{0,240}\bdd\s+if=/dev/(u?random|zero)\b'
    unless:
      - id: well-known/app/utility/util-linux::util-linux-source-tree
      - id: well-known/app/storage/clonezilla::package-context
      - id: well-known/app/storage/clonezilla::archive-name
      - id: well-known/app/storage/clonezilla::clonezilla-script-context

  # Same file-vs-device confusion as the zero variant below: a `$*FILE`
  # variable names a regular file, not the device this trait reports.
  - id: shell-dd-random-variable-device
    desc: Shell dd random data to variable device
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'dd\s+if=/dev/u?random\s+of\s*=\s*["'']?\$[A-Za-z_]*(DEV|DISK|SWAP)[A-Za-z_]*'
    not:
      - regex: '\$[A-Za-z_]*FILE'
    unless:
      - id: well-known/app/system/samba::samba-source-tree
      - id: metadata/package/testing/presence/harness::shell-test-prefix-basename
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/package/testing/presence/harness::ndctl-nfit-shell-test
      - id: well-known/app/utility/util-linux::util-linux-test-script
      - id: well-known/app/storage/clonezilla/

composite_rules:
  - id: openbsd-shell-swap-wiper
    desc: OpenBSD shell wipes swap device
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/string/search::shell-swap-line-enumeration
    any:
      - id: shell-swapoff-before-device-wipe
      - id: micro-behaviors/fs/swap/off::shell-swapoff-all
      - id: shell-dd-random-variable-device
      - id: micro-behaviors/fs/disk/raw::dd-zero-to-device-var
    unless:
      - id: well-known/app/storage/clonezilla::package-context
      - id: well-known/app/storage/clonezilla::clonezilla-script-context

  - id: openbsd-shell-zero-swap-wiper
    desc: OpenBSD shell zeroes swap device
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/string/search::shell-swap-line-enumeration
      - id: micro-behaviors/fs/swap/off::shell-swapoff-all
      - id: micro-behaviors/fs/disk/raw::dd-zero-to-device-var
    unless:
      - id: well-known/app/storage/clonezilla::package-context
      - id: well-known/app/storage/clonezilla::clonezilla-script-context
