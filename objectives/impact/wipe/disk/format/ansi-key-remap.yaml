defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: ansi-keyboard-remap-format-system-drive
    desc: ANSI key maps to drive-format command
    crit: suspicious
    conf: 0.99
    for: [batch, text]
    if:
      type: text
      regex: '\x1b\[[0-9]{1,3};"(?i:format) [a-z]:";13p'
composite_rules:
- id: ansi-format-key-and-forced-confirmation
  desc: Keyboard-triggered formatting forces affirmative confirmation
  crit: hostile
  conf: 0.99
  all:
  - id: ansi-keyboard-remap-format-system-drive
  - id: micro-behaviors/hardware/input/keyboard/layout::ansi-keyboard-remaps-no-to-yes
