defaults:
  platforms: [windows]
  for: [html]
  conf: 0.98
traits:
  - id: html-format-autotest-command
    desc: HTML embeds unattended drive format command
    crit: suspicious
    if:
      type: text
      regex: '(?i)/[ck]\s+format(\.com)?\s+[a-z]:\s+/autotest\b'
composite_rules:
  - id: htmlhelp-exploit-unattended-format
    desc: HTML Help exploit includes unattended drive wipe
    crit: hostile
    all:
      - id: objectives/execution/activex/browser-control::htmlhelp-opener-local-zone-exploit
      - id: html-format-autotest-command
