defaults:
  platforms: [windows]
  for: [batch]
  attack: T1561.001
  mbc: E1561

traits:
  - id: batch-formats-system-drive
    desc: Batch formats the Windows system drive
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bformat(\.com)?\s+c\s*:'
  - id: batch-echo-letter-format
    desc: Piped letter confirms a drive format
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)echo\s+[a-z]\s*\|\s*format\s+[a-z]:'

  - id: batch-debug-cmos-port
    desc: Batch echoes a CMOS port write
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)\becho\b[^\r\n]{0,40}\bo\s+70\b'

  - id: batch-pipes-script-to-debug
    desc: Batch feeds a script to debug
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bdebug\s*<'

  # `/autotest` is an undocumented FORMAT switch that skips every prompt,
  # including the "all data will be lost" confirmation. Nothing documented
  # needs it; wipers use it so the format runs unattended.
  - id: batch-format-autotest-switch
    desc: Format with the undocumented no-prompt switch
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bformat(\.com)?\s+\S{1,12}:[^\r\n]{0,40}/autotest\b'

  # A format command appended to a file rather than run: the script is
  # planting it in another batch (autoexec.bat, a startup script) to fire on
  # the next boot, after the planting script is long gone.
  - id: batch-format-command-appended
    desc: Format command appended to a file
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bformat(\.com)?\s+\S{1,12}:[^\r\n>]{0,60}>>'

composite_rules:
  - id: batch-format-every-drive
    desc: Batch formats every listed drive letter
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/volume/admin::batch-format-variable-drive
      - id: micro-behaviors/fs/traversal/drives::batch-drive-letter-list
  - id: batch-unattended-drive-format
    desc: Batch formats a drive with no prompt
    crit: hostile
    conf: 0.97
    all:
      - id: batch-format-autotest-switch
    any:
      - id: micro-behaviors/fs/volume/admin::batch-format-drive
      - id: micro-behaviors/fs/volume/admin::batch-format-variable-drive
  - id: batch-system-drive-format-wiper
    desc: Batch formats the Windows system drive
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/volume/admin::batch-format-drive
      - id: batch-formats-system-drive
  - id: batch-debug-cmos-wipe
    desc: Batch wipes CMOS through debug
    crit: hostile
    conf: 0.95
    all:
      - id: batch-debug-cmos-port
      - id: batch-pipes-script-to-debug

  - id: batch-confirmed-format-wiper
    desc: Batch auto-confirms drive format
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/pipeline::batch-echo-y-pipe
      - id: micro-behaviors/fs/volume/admin::batch-format-drive
  - id: batch-letter-confirmed-format
    desc: Letter pipe confirms a drive format
    crit: hostile
    conf: 0.97
    all:
      - id: batch-echo-letter-format
      - id: micro-behaviors/fs/volume/admin::batch-format-drive
