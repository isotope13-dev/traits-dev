defaults:
  platforms: [windows]
  for: [html, javascript]
traits:
  - id: script-run-system-drive-format
    desc: Script Run command formats the C drive
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)\.run\s*\(\s*["'']format\s+/q\s+c:'
composite_rules:
  - id: browser-system-drive-and-boot-destruction
    desc: Browser HTA payload formats C and deletes boot executables
    crit: hostile
    conf: 0.99
    attack: T1561.001
    all:
      - id: script-run-system-drive-format
      - id: micro-behaviors/fs/delete/file/command::script-run-boot-file-delete
      - id: metadata/file/format/markup::hta-application-element
      - id: micro-behaviors/os/com/automation::scriptlet-typelib-clsid
      - id: micro-behaviors/os/com/automation::wsh-shell-clsid
