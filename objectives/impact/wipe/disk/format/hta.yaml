defaults:
  platforms: [windows]
  for: [html, javascript]
traits:
  - id: unattended-unconditional-drive-format
    desc: Format requests unattended unconditional mode
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)\bformat\s+[a-z]:\s*(/q\s+)?/autotest\s+/u\b'
  - id: run-unattended-format-command
    desc: Run command requests unattended drive format
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)\.Run\(["''][^"'']{0,40}\bformat\s+[a-z]:[^"'']{0,40}/autotest'
composite_rules:
  - id: activex-unattended-drive-wiper
    desc: WSH command requests unconditional drive format
    crit: hostile
    conf: 0.99
    all:
      - id: unattended-unconditional-drive-format
      - id: micro-behaviors/os/com/automation::wsh-shell-clsid
      - id: run-unattended-format-command
