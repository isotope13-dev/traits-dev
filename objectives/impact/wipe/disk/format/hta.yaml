defaults:
  platforms: [windows]
  for: [html, javascript]
traits:
  - id: quiet-unconditional-drive-format
    desc: Drive format skips prompts unconditionally
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)\bformat\s+[a-z]:\s+/q\s+/autotest\s+/u\b'
composite_rules:
  - id: activex-unattended-drive-wiper
    desc: WScript.Shell page carries unconditional drive format
    crit: hostile
    conf: 0.99
    all:
      - id: quiet-unconditional-drive-format
      - id: micro-behaviors/os/com/automation::wsh-shell-clsid
      - id: micro-behaviors/data/control-flow/dispatch::script-run-method-call
