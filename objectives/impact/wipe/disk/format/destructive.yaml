defaults:
  crit: suspicious
  conf: 1.0
  platforms:
    - windows
  for:
    - cmd
    - php
  attack: T1485
  mbc: E1485
traits:
  - id: format-c
    desc: "Destructive format cmd targeting Win C drive"
    size_min: 10
    if:
      type: string_literal
      regex: (?i)format\s+c:\s+(/y|/autotest|/q\s+/u)
  - id: format-c-no-colon
    desc: Format C Drive (No Colon)
    size_min: 10
    count_min: 1
    if:
      type: string_literal
      regex: (?i)format\s+c\s+(/y)
  - id: format-c-quiet-autotest
    desc: Quietly formats drive C without a prompt
    conf: 0.97
    for: [cmd, php, html, vbs, batch, objectivec, oledoc]
    platforms: [windows, unix]
    if:
      type: text
      regex: '(?i)format\s+c:\s*(/q\s+/autotest|/autotest\s+/q)'
  - id: autoexec-bat-reference
    desc: References autoexec.bat
    crit: notable
    conf: 0.8
    for: [html, vbs, batch, objectivec, cmd]
    platforms: [windows, unix]
    if:
      type: text
      regex: '(?i)autoexec\.bat'
  - id: piped-format-drive-confirmation
    desc: Piped yes confirms drive format
    crit: suspicious
    conf: 0.96
    for: [oledoc]
    if:
      type: raw
      regex: '(?i)echo\s+[a-z]\s*\|\s*form[a-z]{2}\s+[a-z]:'

composite_rules:
  - id: script-autoexec-format-wiper
    desc: "Plants a quiet C: format in autoexec"
    crit: hostile
    conf: 0.98
    for: [html, vbs, batch, objectivec, cmd]
    platforms: [windows, unix]
    all:
      - id: format-c-quiet-autotest
      - id: autoexec-bat-reference
  - id: oledoc-destructive-format-wiper
    desc: Document executes destructive format command
    crit: hostile
    conf: 0.99
    for: [oledoc]
    all:
      - id: format-c-quiet-autotest
      - id: objectives/execution/interpreter/document::ole-package-dangerous-clsid
  - id: oledoc-destructive-drive-wiper
    desc: OLE document executes destructive drive wipe
    crit: hostile
    conf: 0.99
    for: [oledoc]
    all:
      - id: metadata/document/office/container::word6-compobj-progid-raw
      - id: piped-format-drive-confirmation
