defaults:
  platforms: [linux]
  for: [perl]
  crit: hostile
  conf: 0.97
  attack: T1561.002
  mbc: E1561

traits:
  - id: perl-bootloader-remove-tree-argument
    desc: Perl passes bootloader path to removal
    crit: notable
    if:
      type: text
      regex: '\bremove_tree\s*\(\s*["'']/boot/(grub2?|efi)[/"'']'

  - id: perl-bootloader-remove-tree-iteration
    desc: Perl iterates bootloader paths for removal
    crit: notable
    if:
      type: text
      regex: '\bremove_tree\s*\(\s*\$_\s*\)\s+for\s+qw\([^)]{0,80}/boot/(grub2?|efi)\b'

composite_rules:
  - id: perl-bootloader-dir-wipe
    desc: Perl recursively deletes Linux bootloader directories
    near_lines: 3
    all:
      - id: micro-behaviors/fs/delete/directory::perl-remove-tree-call
      - id: micro-behaviors/fs/path/config/boot::linux-bootloader-directory-path-text
    any:
      - id: perl-bootloader-remove-tree-argument
      - id: perl-bootloader-remove-tree-iteration
