defaults:
  platforms:
  - unix
  - windows
  for:
  - python
traits:
- id: python-home-cache-delete-on-http-auth-failure
  desc: Deletes home cache after HTTP auth failure
  crit: suspicious
  conf: 0.96
  attack: T1070.004
  if:
    type: tree-sitter
    query: |
      ((block
        (expression_statement
          (assignment left: (identifier) @response
            right: (call function: (attribute object: (identifier) @requests attribute: (identifier) @get))))
        . (if_statement
            condition: (comparison_operator
              (attribute object: (identifier) @checked attribute: (identifier) @status)
              "in" (tuple (integer) @unauthorized (integer) @forbidden))
            consequence: (block
              (expression_statement (call
                function: (attribute object: (identifier) @shutil attribute: (identifier) @delete)
                arguments: (argument_list
                  (binary_operator
                    left: (call function: (attribute object: (identifier) @pathlib attribute: (identifier) @home))
                    operator: "/"
                    right: (string (string_content) @cache)))))))) @flow
       (#eq? @response @checked)
       (#eq? @requests "requests")
       (#eq? @get "get")
       (#eq? @status "status_code")
       (#eq? @unauthorized "401")
       (#eq? @forbidden "403")
       (#eq? @shutil "shutil")
       (#eq? @delete "rmtree")
       (#eq? @pathlib "Path")
       (#eq? @home "home")
       (#eq? @cache ".cache"))
