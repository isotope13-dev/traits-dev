# Express route with a destructive action trigger.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: objectives/impact/wipe/directory::express-robots-destroy-trigger
    desc: Express robots route triggers destruction
    crit: hostile
    conf: 0.99
    attack: "T1102, T1485"
    all:
      - id: micro-behaviors/communications/http/request/route::express-robots-route
      - id: micro-behaviors/communications/http/request/query::verify-destroy-query
      - id: objectives/impact/wipe/directory::node-self-destruct-src-wipe
