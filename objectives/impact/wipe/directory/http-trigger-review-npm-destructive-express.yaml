defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: postinstall-destructive-express-injector
  desc: postinstall injects destructive Express route
  crit: hostile
  conf: 0.99
  attack: "T1195.002, T1485, T1489"
  for: [npm, package.json, javascript]
  scope: archive
  all:
  - id: micro-behaviors/process/interpreter/node::postinstall-runs-inject-js
  - id: micro-behaviors/fs/write/file/append::inject-appends-self-destruct-snippet
  - id: objectives/impact/wipe/directory::express-robots-destroy-trigger
