defaults:
  attack: T1485
  platforms: [windows, unix]
  for: [python, javascript, shell, go, pe]
composite_rules:
- id: node-self-destruct-src-wipe
  desc: Node self-destruct deletes source directory
  crit: hostile
  conf: 0.99
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/data/control-flow/dispatch/named::js-self-destruct-call
  - id: micro-behaviors/fs/path/application/prefix::node-src-target
  any:
  - id: micro-behaviors/fs/delete/directory::fs-rm-recursive
  - id: micro-behaviors/fs/delete/directory::rm-rf
  unless:
  - id: "metadata/lang/source/syntax/command/options::dist-build-file-command-syntax"
  - id: "metadata/lang/source/syntax/command/options::out-target-file-command-syntax"
  - id: metadata/path/directory::test-directory-component
- id: import-time-node-src-wiper
  desc: Import-time Node source wiper
  crit: hostile
  conf: 0.99
  for: [javascript, typescript]
  all:
  - id: objectives/impact/wipe/directory::node-self-destruct-src-wipe
  - id: objectives/impact/wipe/disk/mass-delete::js-auto-schedules-self-destruct
- id: express-route-node-src-wiper
  desc: Express route triggers source wipe
  crit: hostile
  conf: 0.99
  for: [javascript, typescript]
  all:
  - id: objectives/impact/wipe/directory::node-self-destruct-src-wipe
  - id: objectives/impact/wipe/disk/mass-delete::js-robots-destroy-route
