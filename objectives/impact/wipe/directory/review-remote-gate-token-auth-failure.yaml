composite_rules:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  attack: T1485
  mbc: B0025
  id: remote-auth-failure-payload-gate
  desc: Token authorization failure check beside home-directory destruction
  crit: hostile
  conf: 0.98
  near_lines: 80
  all:
  - id: micro-behaviors/communications/http/response::http-status-unauthorized-check
  - id: micro-behaviors/communications/http/token-auth::github-api-token-live-check
  - id: micro-behaviors/fs/delete/directory::home-directory-wipe
  any:
  - id: micro-behaviors/fs/delete/directory::home-directory-wipe
  - id: micro-behaviors/fs/delete/directory::shutil-rmtree
  - id: micro-behaviors/fs/delete/file/library::fs-rmSync
  unless:
  - id: well-known/tool/detection/
