defaults:
  platforms: [windows]
  for: [pe, shellcode]
  attack: T1485,T1562.001

traits:
  - id: windows-delete-telegram-session-command
    desc: Command removes Telegram session directory
    crit: notable
    if:
      type: text
      regex: '(?i)rmdir\s+/s\s+/q\s+[^\n]{0,150}Telegram Desktop\\tdata'
  - id: windows-kill-registry-editor-command
    desc: Command force-kills Windows Registry Editor
    crit: notable
    if:
      type: text
      regex: '(?i)taskkill\s+/f\s+/im\s+regedit\.exe'
  - id: windows-kill-task-manager-command
    desc: Command force-kills Windows Task Manager
    crit: notable
    if:
      type: text
      regex: '(?i)taskkill\s+/f\s+/im\s+taskmgr\.exe'

composite_rules:
  - id: windows-delete-telegram-disable-admin
    desc: Deletes Telegram data and kills admin tools
    crit: hostile
    conf: 0.98
    all:
      - id: windows-delete-telegram-session-command
      - id: windows-kill-registry-editor-command
      - id: windows-kill-task-manager-command
