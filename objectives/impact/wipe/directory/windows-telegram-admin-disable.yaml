defaults:
  platforms: [windows]
  for: [pe, shellcode]
  attack: T1485,T1562.001

composite_rules:
  - id: windows-delete-telegram-disable-admin
    desc: Deletes Telegram data and kills admin tools
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/delete/directory::windows-delete-telegram-session-command
      - id: micro-behaviors/process/terminate/target::force-taskkill-registry-editor
      - id: micro-behaviors/process/terminate/target::force-taskkill-task-manager
