# Python bootloader-directory deletion. After zeroing the MBR boot code,
# the implant removes the bootloader second-stage directories (/boot/grub2,
# /boot/grub, /boot/efi) so the machine cannot boot even from residual boot
# entries. Referencing those paths is ordinary for installers and config
# tools; pairing the reference with a recursive directory-tree delete in the
# same file is the destructive signal.
defaults:
  platforms: [linux]
  for: [python]
  attack: T1561.002
  mbc: E1561
  crit: hostile
  conf: 0.97

composite_rules:
  - id: python-bootloader-dir-wipe
    desc: Python deletes bootloader directories
    scope: file
    near_bytes: 1400
    all:
      - id: micro-behaviors/fs/delete/directory::shutil-rmtree
      - id: micro-behaviors/fs/path/config/boot::linux-bootloader-directory-path-text
