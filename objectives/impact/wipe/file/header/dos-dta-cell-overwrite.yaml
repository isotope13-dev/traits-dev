defaults:
  for:
  - dos_com
  platforms:
  - windows
  - unix
  size_max: 65536

traits:
  - id: dos-dta-cell-entry-overwrite-sequence
    desc: Overwrites found DTA file with COM image
    crit: suspicious
    conf: 0.95
    if:
      type: hex
      pattern: "B8 02 3D BA 9E 00 CD 21 [0-8] BA 00 01 B4 40 CD 21"
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # Same open, but the write buffer is DX=0000h: the program segment prefix,
  # not the program's own image, so each found host's first bytes are
  # replaced with PSP contents.
  - id: dos-dta-psp-buffer-prefix-write
    desc: Writes PSP bytes into found DTA file
    crit: suspicious
    conf: 0.93
    if:
      type: hex
      pattern: "B8 02 3D BA 9E 00 CD 21 [0-8] BA 00 00 [0-4] CD 21"
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

composite_rules:
- id: dos-dta-cell-sized-host-prefix-corruption
  desc: Overwrites found host prefixes with own image
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/fs/write/file/handle::dos-dta-cell-sized-own-image-overwrite-loop
  - id: micro-behaviors/fs/write/file/handle::dos-default-dta-open-image-write-close

- id: dos-dta-found-host-header-overwrite
  desc: Overwrites found host with own image
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/fs/search::dos-int21-find-first
  - id: dos-dta-cell-entry-overwrite-sequence
  unless:
  - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

- id: dos-dta-found-host-psp-prefix-corruption
  desc: Overwrites found host prefix with PSP bytes
  crit: hostile
  conf: 0.93
  size_max: 512
  all:
  - id: micro-behaviors/fs/search::dos-int21-find-first
  - id: dos-dta-psp-buffer-prefix-write
