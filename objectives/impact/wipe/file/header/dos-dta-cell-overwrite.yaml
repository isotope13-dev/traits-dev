defaults:
  for:
  - dos_com
  platforms:
  - windows
  - unix
  size_max: 65536
composite_rules:
- id: dos-dta-cell-sized-host-prefix-corruption
  desc: Overwrites found host prefixes with own image
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/fs/write/file/handle::dos-dta-cell-sized-own-image-overwrite-loop
  - id: micro-behaviors/fs/write/file/handle::dos-default-dta-open-image-write-close
