# A DOS INT 21h resident hook intercepts EXEC, opens the inherited pathname
# read/write, overwrites its prefix through the saved vector, then terminates
# instead of dispatching the requested program. The buffer may be OS data or
# another image; this is corruption evidence, not self-copy/infection proof.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-exec-hook-prefix-corruptor-sequence
    desc: EXEC hook overwrites and aborts target
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: "80 FC 4B 74 [0-8] [0-48] B8 02 3D [0-4] 2E FF 1E ?? ?? [0-8] 93 B4 40 [0-8] B9 ?? ?? [0-8] 8E 1E ?? ?? [0-8] BA ?? ?? [0-8] 2E FF 1E ?? ?? [0-8] B4 3E [0-8] 2E FF 1E ?? ?? [0-8] CD 20"

composite_rules:
  - id: dos-exec-hook-prefix-corruptor
    desc: DOS resident EXEC corrupts and aborts launch
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/impact/wipe/file/header::dos-exec-hook-prefix-corruptor-sequence
      - id: micro-behaviors/os/msdos/interrupt::dos-set-int21-vector
