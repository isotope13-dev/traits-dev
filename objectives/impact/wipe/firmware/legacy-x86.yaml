defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: x86-flash-unlock-destructive-commands
    desc: BIOS flash addresses with destructive unlock commands
    crit: hostile
    conf: 0.99
    attack: T1495
    all:
      - id: micro-behaviors/hardware/flash/command::x86-bios-flash-unlock-addresses
      - id: micro-behaviors/hardware/flash/command::x86-flash-erase-unlock-cycle
