defaults:
  platforms: [unix, windows]
  # Shell scripts are intentionally excluded: the generic shell cleanup test
  # corpus exercises exactly these operands and is covered by the neutral
  # delete/path traits. Compiled/source language members still receive the
  # impact objective.
  for: [source, c, cpp, go, java, java_class, class, kotlin, ruby, python, javascript, typescript, csharp, php, perl, swift, rust, zig, elixir]
  crit: suspicious
  conf: 0.95
  attack: T1485

traits:
  - id: source-user-document-recursive-delete
    desc: Source recursively deletes user documents
    if:
      type: text
      regex: '(?i)rm\s+-rf[^\r\n]{0,240}(Documents|Desktop|Pictures)'
    unless:
      # Shell examples and test fixtures intentionally demonstrate guarded
      # document cleanup; they are not destructive package payloads.
      - id: metadata/package/testing/presence/harness::test-directory
