# A program that deletes the user's home root is already at the edge of what
# any legitimate workflow does, but the atoms behind it live in
# micro-behaviors/fs/delete/directory/home-wipe.yaml and a bare `any:` over
# them infers nothing -- it only reports which language the wipe was written
# in. What converts it is company: a second, unrelated destructive primitive
# in the same program. A cache cleaner with an over-broad path has one
# mistake; a program that wipes HOME *and* ships a fork bomb, *and/or* wipes
# the filesystem root, has a purpose.
#
# The `any:` list is deliberately drawn from three different objectives --
# denial of service, root wipe, recovery inhibition -- because the pairing is
# what matters, not which particular second thing it is. A variant that keeps
# the wipe and swaps the fork bomb for shadow-copy deletion is the same
# program and still lands here.
defaults:
  platforms: [unix, windows]
  attack: T1485
  mbc: C0047

composite_rules:
  - id: home-wipe-with-second-destructive-act
    desc: Wipes the home directory and destroys more
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/delete/directory::home-directory-wipe
    any:
      - id: objectives/impact/dos/fork-bomb::embedded-bash-fork-bomb-literal
      - id: objectives/impact/dos/fork-bomb::bomb
      - id: objectives/impact/dos/fork-bomb::bomb-regex
      - id: micro-behaviors/fs/delete/directory::recursive-root
      - id: objectives/impact/ransom/recovery-inhibition::shadow-delete
    unless:
      - id: well-known/tool/detection/
