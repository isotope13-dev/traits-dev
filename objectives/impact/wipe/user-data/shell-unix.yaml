# Shell mass-wipe of home-tree content. Paired with agent soul persistence in
# objectives/persistence/agent/soul-file when the wipe protocol is written back
# into SOUL.md for the next session.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1485

traits:
  - id: shell-home-glob-recursive-delete
    desc: Recursively deletes under /home glob
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # Require a glob under /home (e.g. /home/* or /home/*/.ssh). A single
      # named path like /home/$user/sqllib is ordinary install cleanup.
      regex: 'rm\s+-[a-zA-Z]*r[a-zA-Z]*\s+[^\n]{0,80}/home/[^\n]{0,40}\*'
    unless:
      - id: well-known/app/infrastructure/aws-agent-toolkit::agent-toolkit-context
      - id: well-known/app/infrastructure/aws-agent-toolkit::db2-driver-script
      - id: metadata/build/package/maintainer-scripts::debian-postrm-purge-home-cleanup

  - id: shell-home-var-credential-wipe
    desc: Force-deletes HOME credential directories
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'rm\s+-rf[^\n]{0,160}\$HOME/\.(ssh|aws|gnupg)\b'

  - id: shell-home-tree-enumerate
    desc: Enumerates files under /home before wipe
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'find\s+/home\b[^\n]{0,80}-type\s+f'

composite_rules:
  - id: shell-home-tree-wipe
    desc: Shell enumerates then wipes home-tree paths
    crit: suspicious
    conf: 0.96
    near_lines: 30
    all:
      - id: shell-home-tree-enumerate
    any:
      - id: shell-home-glob-recursive-delete
      - id: shell-home-var-credential-wipe
      - id: micro-behaviors/fs/delete/directory::shell-recursive-delete

  - id: shell-home-credential-mass-delete
    desc: Shell mass-deletes home credential directories
    crit: hostile
    conf: 0.97
    attack: T1485,T1552
    near_lines: 20
    all:
      - id: shell-home-var-credential-wipe
    any:
      - id: shell-home-glob-recursive-delete
      - id: shell-home-tree-enumerate
      - id: micro-behaviors/fs/path/sensitive/ssh::keys
