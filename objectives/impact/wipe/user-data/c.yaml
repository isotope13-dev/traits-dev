defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: suspicious
  conf: 0.95
  attack: T1485

traits:
  - id: c-user-document-recursive-delete
    desc: C recursively deletes user document directories
    if:
      type: text
      regex: '(?i)rm\s+-rf[^\r\n]{0,240}(Documents|Desktop|Pictures)'
