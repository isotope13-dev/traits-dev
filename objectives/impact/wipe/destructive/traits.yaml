defaults:
  platforms: [windows]
  for: [batch, powershell, python, javascript, c, cpp, pe, dll]
  attack: T1485

composite_rules:
  - id: windows-destructive-wiper
    desc: Windows wiper removes recovery and event logs
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/ransom/tactics::shadow-delete
      - id: objectives/evasion/indicator-removal/logs::log-clear-windows
    any:
      - id: objectives/impact/services/stop::sc-config-start-disabled
      - id: objectives/impact/services/stop::net-stop
      - id: objectives/impact/services/stop::sc-stop
      - id: micro-behaviors/os/service/control::change-service-config
  - id: windows-wiper-remote-propagation
    desc: Windows wiper propagates through remote execution
    crit: hostile
    conf: 0.99
    all:
      - id: windows-destructive-wiper
      - id: objectives/lateral-movement/delivery/wmi::windows-wmi-or-psexec-remote-execution
