defaults:
  platforms: [windows]
  for: [html]
traits:
  - id: external-scan-install-link
    desc: External link invites a scan or installation
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)<a\b.{0,100}href=.{0,10}https?://.{0,120}click here to (start scan|install now)</a>'
      exclude_html_comments: true
composite_rules:
  - id: fake-security-center-antivirus-offer
    desc: Fake Windows security warning links to antivirus offers
    crit: hostile
    conf: 0.98
    near_bytes: 2000
    all:
      - id: objectives/evasion/masquerade/identity/product::windows-security-center-page-title
      - id: objectives/evasion/masquerade/identity/product::windows-security-center-no-antivirus-claim
      - id: external-scan-install-link
