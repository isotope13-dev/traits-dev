# Tech-support-scam "browser lock": a page that forces itself fullscreen to
# hide the browser chrome, intercepts the keyboard so the victim cannot press
# Esc/F11/Ctrl-W, and blocks the tab from closing. Together these make a page
# feel like the operating system has locked, which is the coercion the Help TDS
# / Hotejka tech-support lures rely on. A video player requests fullscreen and
# handles keys, but it does not also block the tab from closing; the exit
# block is what turns this into a lock. Keyed on the DOM mechanics, so it
# carries to future lockers regardless of the on-screen wording or phone number.
defaults:
  platforms: [unix, windows]
  for: [html, javascript]
  attack: T1491
  mbc: E1491

traits:
  # A painted stop-error screen that also prints a toll-free number.
  - id: fake-stop-error-phone
    desc: Blue screen page shows a phone number
    crit: notable
    conf: 0.93
    if:
      type: text
      exclude_html_comments: true
      regex: '(?is)blue screen[\s\S]{0,160}1-8\d{2}-\d{3}-\d{4}'
composite_rules:
  - id: fullscreen-keyboard-exit-browser-lock
    desc: Fullscreen page traps keyboard and blocks exit
    crit: hostile
    conf: 0.93
    near_bytes: 3000
    all:
      - id: micro-behaviors/ui/window/fullscreen/
      - id: micro-behaviors/ui/window/event::browser-keydown-handler
      - id: micro-behaviors/ui/window/event::browser-beforeunload-handler
    any:
      - id: micro-behaviors/ui/window/event::browser-prevent-default-call
      - id: micro-behaviors/ui/window/event::browser-contextmenu-handler
      - id: objectives/impact/degrade/resource::browser-unload-alert-loop-fn
    unless:
      - id: well-known/lib/web/client-side/jquery/
  - id: blue-screen-interval-phone-alert
    desc: Blue screen page loops a phone alert
    crit: hostile
    conf: 0.95
    near_bytes: 3000
    all:
      - id: fake-stop-error-phone
      - id: micro-behaviors/ui/dialog/prompt::interval-alert-dialog
