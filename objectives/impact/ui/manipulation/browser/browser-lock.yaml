# Attempts fullscreen, key cancellation and repeated alerts on exit.
# Browsers may reject these operations; ordinary editors with an unsaved-
# changes handler must not be classified as lockers.
defaults:
  platforms: [unix, windows]
  for: [html, javascript]

traits:
  # A painted stop-error screen that also prints a toll-free number.
  - id: fake-stop-error-phone
    desc: Blue screen page shows a phone number
    crit: notable
    conf: 0.93
    if:
      type: text
      exclude_html_comments: true
      regex: '(?is)blue screen[\s\S]{0,160}1-8\d{2}-\d{3}-\d{4}'
composite_rules:
  - id: fullscreen-keyboard-exit-browser-lock
    desc: Fullscreen key handler accompanies exit alert loop
    crit: hostile
    conf: 0.93
    near_bytes: 3000
    all:
      - id: micro-behaviors/ui/window/fullscreen/
      - id: micro-behaviors/ui/window/event::browser-keydown-handler
      - id: micro-behaviors/ui/window/event::browser-beforeunload-handler
      - id: objectives/impact/degrade/resource::browser-unload-alert-loop-fn
      - id: micro-behaviors/ui/window/event::browser-prevent-default-call
    unless:
      - id: well-known/lib/web/client-side/jquery/
  - id: blue-screen-interval-phone-alert
    desc: Blue screen page loops a phone alert
    crit: hostile
    conf: 0.95
    near_bytes: 3000
    all:
      - id: fake-stop-error-phone
      - id: micro-behaviors/ui/dialog/prompt::interval-alert-dialog
