defaults:
  platforms: [windows]
  for: [html, vbs, javascript]
  attack: T1112
composite_rules:
  - id: locked-homepage-registry-tool-lockout
    desc: Rewrites IE homepage and blocks homepage editing and regedit
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/application/config::regwrite-ie-start-page
      - id: objectives/impact/ui/manipulation/browser::regwrite-lock-ie-homepage
      - id: objectives/impact/degrade/windows-policy::regwrite-disable-registry-tools

  - id: fragmented-locked-homepage-hijack
    for: [html, vbs]
    desc: Concealed homepage rewrite locks editing
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/application/config::fragmented-regwrite-start-page
      - id: objectives/impact/ui/manipulation/browser::fragmented-regwrite-homepage-lock
      - id: objectives/anti-static/obfuscation/string/concat::vbs-amp-fragment-concat

  - id: autoit-self-copy-locked-homepage
    for: [text]
    desc: Self-copy locks rewritten homepage and regedit
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/application/config::regwrite-ie-start-page
      - id: objectives/impact/ui/manipulation/browser::regwrite-lock-ie-homepage
      - id: objectives/impact/degrade/windows-policy::regwrite-disable-registry-tools
      - id: micro-behaviors/fs/file/copy/source-destination::autoit-running-image-copy-source
