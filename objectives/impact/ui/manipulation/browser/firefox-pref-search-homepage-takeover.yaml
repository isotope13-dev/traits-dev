# A legacy Firefox extension that rewrites the homepage and keyword search
# through nsIPrefBranch and deletes the user's chosen default engine: the
# Visicom/MyStart "Dynamic Toolbar" hijacker shape (Draze.com). Unlike a
# manifest search override, nothing in the browser discloses these writes,
# and erasing the user's engine choice is what makes the takeover stick.
defaults:
  platforms: [windows, unix]
  attack: T1176

composite_rules:
  - id: firefox-pref-search-homepage-takeover
    desc: Hijacks Firefox homepage and search preferences
    crit: hostile
    conf: 0.95
    for: [javascript, html]
    all:
      - id: micro-behaviors/data/config/browser-preference::firefox-homepage-pref-write
      - id: micro-behaviors/data/config/browser-preference::firefox-keyword-url-pref-write
      - id: micro-behaviors/data/config/browser-preference::firefox-default-engine-pref-reset
