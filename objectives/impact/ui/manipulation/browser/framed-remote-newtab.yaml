# A new-tab override whose page is only a frame around a remote site: every
# new tab renders whatever that server sends today, with no reviewed code in
# the package, and here the frame is also handed clipboard-read.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, xpi, html, zip]
  attack: T1176

composite_rules:
  - id: newtab-override-frames-remote-site-with-clipboard-read
    desc: New-tab override is a remote site framed with clipboard-read access
    crit: suspicious
    conf: 0.85
    scope: archive
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/document/html/structure::body-opens-with-iframe
      - id: micro-behaviors/communications/http/client/frame::remote-iframe-delegated-clipboard-read
