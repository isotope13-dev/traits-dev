# The install/update beacon's reply names a page and the extension opens
# it: the vendor can push any landing, offer or ad page into a new tab on
# every install or update without shipping a new version.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1176

composite_rules:
  - id: lifecycle-beacon-opens-server-chosen-tab
    desc: Install or update beacon response chooses a page opened in a new tab
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-installed
      - id: micro-behaviors/browser-extension/tabs::fetch-response-url-opens-tab
