# A Python wrapper can carry a web bundle solely as data for a Node WASM
# extractor. It does not run that bundle's browser top-level code. Keep the
# protestware identity and mechanics visible, but do not infer page impact
# from this delivery context. A browser entry point defeats this exception.
defaults:
  platforms: [windows, unix]
  for: [whl, javascript, python, chrome-manifest]

composite_rules:
  - id: python-node-text-wasm-extraction
    desc: Python invokes a Node text-to-WASM extractor
    crit: exception
    scope: archive
    all:
      - id: micro-behaviors/process/interpreter/wasm::node-text-wasm-extractor
      - id: micro-behaviors/process/create/direct::python-two-string-path-argv
      - id: micro-behaviors/fs/search/content::python-node-path-lookup
    unless:
      - id: metadata/archive/member/extension::archive-html-member
      - id: metadata/permission/host::content-script-all-sites
