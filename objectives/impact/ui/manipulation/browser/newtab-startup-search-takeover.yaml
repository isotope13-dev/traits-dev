# The new tab page, startup pages and default search all replaced by one
# extension with a non-mainstream search host: every way the user starts
# browsing is routed through the extension. Disclosed start-page products do
# this openly, so hostility also needs a template-placeholder provider
# identity (keyword.<host> / name.<host>) typical of generated hijacker kits.
defaults:
  platforms: [windows, unix]
  attack: T1176

composite_rules:
  - id: newtab-startup-default-search-takeover
    desc: Extension replaces new tab, startup pages and default search
    crit: hostile
    conf: 0.94
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::chrome-startup-pages-override
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/manifest::extension-custom-search-endpoint
    any:
      - id: metadata/permission/manifest::search-provider-placeholder-keyword
      - id: metadata/permission/manifest::search-provider-placeholder-name
