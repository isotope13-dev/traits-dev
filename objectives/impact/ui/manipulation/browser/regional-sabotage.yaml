# Nationality-gated sabotage payloads: the page checks the browser's UI language
# and the site's ccTLD, and only then degrades the user's session. Both rules
# below describe the same family, so they live together rather than one of them
# sitting under impact/degrade/resource/ -- that directory is about lockups and
# resource exhaustion (popup loops, reload traps), which this is not.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  # Disabling page input plus forced looping remote audio behind regional
  # gates describes sabotage even when packaged inside a reusable library.
  - id: regional-pointer-events-audio-sabotage
    desc: Region-gated input blocking and looping audio
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/os/sysinfo/platform/browser::navigator-language
      - id: micro-behaviors/communications/http/url/navigation::browser-location-host-russian-tld-match
      - id: micro-behaviors/ui/window/style::browser-root-pointer-events-disabled
      - id: micro-behaviors/ui/window/dom/audio::browser-audio-loop-enabled
      - id: micro-behaviors/ui/window/dom/audio::browser-audio-play-call
    any:
      - id: micro-behaviors/communications/http/url/media::compressed-audio-file-url
      - id: micro-behaviors/communications/http/url/path::wav-file-url
    near_bytes: 2048
    unless:
      # Pinokio bundles SweetAlert2; ordinary dialog assets can resemble the
      # legacy region-gated protestware routine at archive scope.
      - id: well-known/app/ai/media/pinokio::app-bundle

  # The audio-only variant is likewise suspicious until a delivery context
  # establishes that its nationality and host gates are reachable. The
  # `unless:` keeps the full routine from producing a duplicate finding.
  - id: regional-remote-audio-autoplay
    desc: Region-gated remote looping audio autoplay
    crit: suspicious
    conf: 0.98
    for: [javascript]
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/ui/window/dom/audio::browser-audio-source-property
      - id: micro-behaviors/ui/window/dom/audio::browser-audio-loop-enabled
      - id: micro-behaviors/ui/window/dom/audio::browser-audio-play-call
      - id: micro-behaviors/communications/http/url/navigation::browser-location-host-russian-tld-match
      - id: micro-behaviors/os/sysinfo/platform/browser::navigator-language
    any:
      - id: micro-behaviors/communications/http/url/media::compressed-audio-file-url
      - id: micro-behaviors/communications/http/url/path::wav-file-url
    unless:
      - id: regional-pointer-events-audio-sabotage

  - id: all-sites-extension-regional-sabotage
    desc: All-sites extension delivers regional browser sabotage
    crit: hostile
    conf: 0.995
    for: [crx, xpi]
    scope: archive
    all:
      - id: regional-pointer-events-audio-sabotage
      - id: metadata/permission/host::content-script-all-sites
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
