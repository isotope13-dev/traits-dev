# Language/host-gated sabotage payloads: the page checks the browser's UI language
# and the site's ccTLD, and only then degrades the user's session. Both rules
# below describe the same family, so they live together rather than one of them
# sitting under impact/degrade/resource/ -- that directory is about lockups and
# resource exhaustion (popup loops, reload traps), which this is not.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  # SweetAlert2 persists the first-visit time, waits three days, then disables
  # page input and starts looping remote audio behind regional gates.
  - id: regional-pointer-events-audio-sabotage
    desc: Region-gated delayed input and audio sabotage
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/os/sysinfo/platform/browser::navigator-russian-language-test
      - id: micro-behaviors/communications/http/url/navigation::browser-location-host-russian-tld-match
      - id: micro-behaviors/data/db/web-storage::dom-storage-getitem
      - id: micro-behaviors/data/db/web-storage::dom-storage-setitem
      - id: micro-behaviors/time/timing/check::js-elapsed-days-gate
      - id: micro-behaviors/ui/window/style::browser-root-pointer-events-disabled
      - id: micro-behaviors/ui/window/dom/audio::browser-audio-element-with-source
      - id: micro-behaviors/ui/window/dom/audio::browser-audio-loop-enabled
      - id: micro-behaviors/ui/window/dom/audio::browser-audio-play-call
    any:
      - id: micro-behaviors/communications/http/url/media::compressed-audio-file-url
      - id: micro-behaviors/communications/http/url/media::wav-file-url
    near_bytes: 2048
    # Retain code visibility when browser delivery cannot activate the routine.
    # A disclosed canonical release keeps a suspicious glance at the routine
    # itself while its archive-level verdicts lift.
    downgrade:
      scope: archive
      any:
        - id: objectives/impact/ui/manipulation/browser::extension-origin-only-regional-routine
        - id: python-node-text-wasm-extraction
        - id: metadata/package/documentation/claims::disclosed-sweetalert2-regional-routine-release
    # No Pinokio carve-out. One stood here, reasoning that "ordinary dialog
    # assets can resemble the legacy region-gated protestware routine at
    # archive scope" -- but this rule is `scope: file`, so archive pooling
    # cannot produce it, and the file it was suppressing is not a resemblance:
    # Pinokio 7.2.6 and 8.x ship SweetAlert2 v11.7.3, whose minified bundle
    # carries the routine verbatim -- `/^ru\b/.test(navigator.language)` and a
    # `.(ru|su|xn--p1ai)$` host check, a three-day `swal-initiation` delay in
    # localStorage, then `pointerEvents="none"` plus looping audio fetched from
    # flag-gimn.ru. Suppressing it here hid a true positive in every consumer
    # of that release, which is the class of finding this rule exists for --
    # see its own note above about sabotage packaged inside a reusable library.

  # The audio-only variant is likewise suspicious until a delivery context
  # establishes that its language and host gates are reachable. The
  # `unless:` keeps the full routine from producing a duplicate finding.
  - id: regional-remote-audio-autoplay
    desc: Region-gated remote looping audio autoplay
    crit: suspicious
    conf: 0.98
    for: [javascript]
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/ui/window/dom/audio::browser-audio-source-property
      - id: micro-behaviors/ui/window/dom/audio::browser-audio-loop-enabled
      - id: micro-behaviors/ui/window/dom/audio::browser-audio-play-call
      - id: micro-behaviors/communications/http/url/navigation::browser-location-host-russian-tld-match
      - id: micro-behaviors/os/sysinfo/platform/browser::navigator-russian-language-test
    any:
      - id: micro-behaviors/communications/http/url/media::compressed-audio-file-url
      - id: micro-behaviors/communications/http/url/media::wav-file-url
    unless:
      - id: regional-pointer-events-audio-sabotage

  - id: all-sites-extension-regional-sabotage
    desc: All-sites extension delivers regional browser sabotage
    crit: hostile
    conf: 0.995
    for: [crx, xpi, javascript, chrome-manifest]
    scope: archive
    all:
      - id: regional-pointer-events-audio-sabotage
      - id: metadata/permission/host::content-script-all-sites
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute

  # Publication context for a bundled regional UI sabotage routine. The
  # matcher is ecosystem-neutral (npm, zip, Go module proxy archives, Python wheels): the
  # name says archive, not npm, so Go, zip, and Python wheel consumers are described too.
  - id: bundled-sweetalert2-regional-sabotage
    desc: Archive bundles SweetAlert2 regional sabotage
    crit: hostile
    conf: 0.96
    for: [npm, tar, zip, package.json, javascript, typescript, php, whl]
    scope: archive
    all:
      - id: objectives/impact/ui/manipulation/browser::regional-pointer-events-audio-sabotage
      - id: well-known/unwanted/sweetalert2-protestware::sweetalert2-protestware-bundle
    # The package context is an npm or Composer manifest, a Python wheel metadata file,
    # or, for a WordPress plugin zip that vendors the library under assets/, the plugin's own header.
    any:
      - id: metadata/file/naming::package-json-basename
      - id: metadata/package/files/included::composer-json-basename
      - id: metadata/package/files/ecosystem::wordpress-plugin-header
      - id: metadata/package/ecosystem::python-package-metadata-member
    needs: 1
    # Leniency is disclosure, not identity: an undisclosed routine sabotages
    # its users whoever published it, so the genuine publication without a
    # disclosure notice stays hostile here. The canonical release that
    # documents the region-differentiated behavior lifts this verdict.
    unless:
      - id: metadata/package/documentation/claims::disclosed-sweetalert2-regional-routine-release
