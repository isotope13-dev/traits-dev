# Nationality-gated sabotage payloads: the page checks the browser's UI language
# and the site's ccTLD, and only then degrades the user's session. Both rules
# below describe the same family, so they live together rather than one of them
# sitting under impact/degrade/resource/ -- that directory is about lockups and
# resource exhaustion (popup loops, reload traps), which this is not.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1491

composite_rules:
  # The full payload: input is disabled outright *and* audio is forced. This is
  # the affected SweetAlert2 11.x protestware shape, which any application
  # vendoring an affected release inherits.
  - id: regional-pointer-events-audio-sabotage
    desc: Region-gated browser input suppression with looping audio
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/os/sysinfo/platform/browser::navigator-language
      - id: micro-behaviors/communications/http/url/path::browser-location-host-russian-tld-match
      - id: micro-behaviors/ui/window/manage/style::browser-root-pointer-events-assignment
      - id: micro-behaviors/hardware/input/audio::remote-audio-source-url
      - id: micro-behaviors/hardware/input/audio::browser-audio-loop-enabled
      - id: micro-behaviors/hardware/input/audio::browser-audio-play-call
    near_bytes: 2048

  # The audio-only variant, for payloads that force the anthem without also
  # freezing the page. Moved here from impact/degrade/resource/, where it was
  # both misplaced and a second hostile finding on bytes the rule above had
  # already convicted: its legs are that rule's minus the pointer-events
  # assignment, so every full-payload file matched both and was reported twice.
  # The `unless:` keeps this one for the variant it uniquely covers.
  - id: regional-remote-audio-autoplay
    desc: Region-gated remote looping audio autoplay
    crit: hostile
    conf: 0.98
    for: [javascript]
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/hardware/input/audio::browser-audio-source-property
      - id: micro-behaviors/hardware/input/audio::remote-audio-source-url
      - id: micro-behaviors/hardware/input/audio::browser-audio-loop-enabled
      - id: micro-behaviors/hardware/input/audio::browser-audio-play-call
      - id: micro-behaviors/communications/http/url/path::browser-location-host-russian-tld-match
      - id: micro-behaviors/os/sysinfo/platform/browser::navigator-language
    unless:
      - id: regional-pointer-events-audio-sabotage
