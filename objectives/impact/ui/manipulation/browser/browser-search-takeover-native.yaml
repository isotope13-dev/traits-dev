# Native browser-settings takeover: writing a rogue default search engine
# straight into Chromium's Web Data `keywords` table and replacing startup
# and default-search configuration across installed browsers. Supported
# channels for changing a user's search engine are the browser's own
# settings API and enterprise policy; external writers of the keyword table
# are search-injection hijackers.
defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]

traits:
  # Hijacker kits embed one INSERT statement that carries the full rogue
  # provider row, including the {searchTerms} query template inline within
  # the VALUES tuple. Chromium's own keyword-table SQL is parameterized
  # (`VALUES (?, ?, ...)`) and never carries the template inside the row.
  - id: chromium-keywords-search-injection
    desc: Injects a rogue search engine into Chromium
    crit: hostile
    conf: 0.93
    if:
      type: text
      # Dot-matches-newline: hijacker SQL appears both as one embedded run
      # (compiled stages) and as a multi-line statement (installer scripts).
      regex: '(?si)insert\s+into\s+keywords.{0,400}values\s*\(.{0,300}\{searchterms\}'

  # Takeover-kit vocabulary: the kit's own change-log strings paired with
  # the Chromium startup-pages preference. Each string alone is neutral
  # vocabulary; a browser build carries the preference but never announces
  # replacing the default search.
  - id: default-search-replaced-text
    desc: Reports replacing the default search engine
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)default search was replaced'

  - id: chromium-restore-startup-key
    desc: Chromium restore-on-startup preference key
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: restore_on_startup

  # Firefox keeps its search-engine store compressed as search.json.mozlz4.
  # Naming that store means going around the browser's settings API — the
  # Firefox-side analog of writing Chromium's keywords table directly.
  - id: firefox-search-store-mozlz4
    desc: Firefox compressed search-store reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: mozlz4

composite_rules:
  - id: search-startup-takeover-kit
    desc: Replaces default search and startup pages
    crit: hostile
    conf: 0.94
    all:
      - id: default-search-replaced-text
      - id: chromium-restore-startup-key
