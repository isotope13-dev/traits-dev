defaults:
  platforms: [unix, windows]
  for: [chrome-manifest]

traits:
  - id: chrome-root-newtab-document
    desc: Overrides new tab with newtab.html
    crit: component
    if:
      type: value
      path: chrome_url_overrides.newtab
      exact: newtab.html
  - id: newtab-html-path
    desc: File named newtab.html
    crit: component
    for: [html]
    if:
      type: basename
      exact: newtab.html

composite_rules:
  - id: newtab-document-instant-http-refresh
    desc: New-tab override ships an immediate remote redirect
    crit: suspicious
    conf: 0.95
    for: [crx, chrome-manifest, html]
    scope: archive
    all:
      - id: chrome-root-newtab-document
      - id: metadata/permission/manifest::chrome-startup-pages-override
      - id: newtab-html-instant-http-refresh

  - id: newtab-html-instant-http-refresh
    desc: newtab.html immediately opens a remote page
    crit: component
    for: [html]
    all:
      - id: newtab-html-path
      - id: micro-behaviors/ui/window/navigation/refresh::meta-refresh-instant-external
