# Adware shape: an all-sites content script reports each page address, and
# a webRequest handler replaces failing main-frame loads (4xx/5xx, DNS
# errors) with an extension-chosen page. Error pages become ad inventory.
defaults:
  platforms: [unix, windows]
  for: [npm, chrome-manifest, crx, javascript, typescript, zip]
  attack: T1185

composite_rules:
  - id: tracked-error-page-hijack
    desc: Page-tracking extension redirects failed page loads
    crit: hostile
    conf: 0.88
    scope: archive
    all:
      - id: metadata/permission/dom::content-script-all-sites
      - id: micro-behaviors/communications/ipc/extension-message::runtime-message-page-url
      - id: micro-behaviors/communications/http/intercept::webrequest-on-headers-received
      - id: micro-behaviors/browser-extension/tabs::status-code-tab-redirect
