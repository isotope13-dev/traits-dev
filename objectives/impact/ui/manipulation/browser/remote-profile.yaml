# The application-specific profile schema, Chromium user-data flag, file
# copy support, and concealed command channel jointly indicate remotely
# controlled browser-profile changes rather than ordinary embedded browsing.
defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]

composite_rules:
  - id: c2-controlled-chromium-profile-manipulation
    desc: C2-controlled Chromium profile file manipulation
    crit: hostile
    conf: 0.93
    attack: T1185,T1027
    all:
      - id: objectives/command-and-control/beacon/network/http::concealed-endpoint-encoded-command-reports
      - id: micro-behaviors/data/format/json::compiled-app-profile-file-fields
      - id: micro-behaviors/process/create/flags::chromium-user-data-native-bytes
      - id: micro-behaviors/fs/file/copy::copyfile-ex-w
