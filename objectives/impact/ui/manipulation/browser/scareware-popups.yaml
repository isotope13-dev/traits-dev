# Co-occurrence identifies the coercive page; it does not bind a callback.
defaults:
  platforms: [windows]
  for: [html]
composite_rules:
  - id: scareware-unload-remote-popups
    desc: Spyware exit-hook hoax with remote popups
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/evasion/masquerade/identity/product::static-spyware-remediation-hoax
      - id: micro-behaviors/ui/window/navigation::browser-window-open-external-url
