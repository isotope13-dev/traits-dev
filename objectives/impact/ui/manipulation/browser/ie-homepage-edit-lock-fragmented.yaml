defaults:
  platforms:
  - windows
  for:
  - html
  - vbs
  crit: notable
  conf: 0.97

composite_rules:
  - id: fragmented-regwrite-homepage-lock
    desc: RegWrite enables fragmented homepage lock
    near_lines: 0
    all:
      - id: micro-behaviors/os/registry/value/write::regwrite-enable-dword
      - id: micro-behaviors/os/registry/policy/reference::fragmented-homepage-value
      - id: micro-behaviors/os/registry/browser/reference::fragmented-internet-explorer-path
