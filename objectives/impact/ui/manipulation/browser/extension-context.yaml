# A ccTLD-gated routine cannot activate in a chrome-extension:// options page.
# Do not exempt extensions exposing code to websites or declaring injection.
defaults:
  platforms: [windows, unix]
  for: [crx, zip, javascript, chrome-manifest]

composite_rules:
  - id: extension-origin-only-regional-routine
    desc: Extension origin prevents ccTLD activation
    crit: exception
    scope: archive
    all:
      - id: metadata/permission/manifest::extension-options-without-web-code-exposure
      - id: well-known/lib/ui/sweetalert2::sweetalert2-css-class-prefix
    unless:
      - id: micro-behaviors/process/inject/webextension
