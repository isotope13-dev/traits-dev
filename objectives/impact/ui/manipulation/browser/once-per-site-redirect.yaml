# A hardcoded external redirect gated on a storage flag that is set right
# after: the page is hijacked once per site (localStorage) or once per
# install (extension storage) so the user does not notice a pattern. From an
# all-site content script, every site the user visits gets bounced once.
defaults:
  platforms: [windows, unix]
  attack: T1176,T1185

composite_rules:
  - id: dom-storage-latched-page-redirect
    desc: localStorage flag gates a one-time external redirect
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    near_bytes: 400
    all:
      - id: micro-behaviors/data/db/read/key-value::dom-storage-getitem-call
      - id: micro-behaviors/data/db/write::dom-storage-setitem-call
      - id: micro-behaviors/ui/window/navigation/location::remote-page-location-assignment

  - id: all-site-content-script-one-time-redirect
    desc: All-site content script bounces each site once to a hardcoded URL
    crit: hostile
    conf: 0.95
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript]
    all:
      - id: metadata/permission/host::broad-content-script-matches
    any:
      - id: dom-storage-latched-page-redirect
      - id: objectives/impact/ui/manipulation/traffic::delayed-storage-latched-page-redirect
