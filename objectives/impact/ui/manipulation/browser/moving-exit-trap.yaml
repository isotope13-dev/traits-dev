defaults:
  platforms: [windows, unix]
  for: [html, javascript]
composite_rules:
  - id: back-button-hash-redirect
    desc: Synthetic history with hash-gated Back redirect
    crit: suspicious
    conf: 0.95
    near_bytes: 512
    all:
      - id: micro-behaviors/ui/window/history::history-push-state-entry
      - id: micro-behaviors/ui/window/navigation/location::popstate-hash-location-replace
  - id: browser-moving-exit-alert-trap
    desc: Exit alert trap with timed window movement
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/degrade/resource::browser-unload-alert-loop
      - id: micro-behaviors/ui/window/control::browser-timed-moveto-string
      - id: micro-behaviors/time/schedule/timeout::large-finite-loop-timer-scheduling
  - id: unload-opens-remote-window
    desc: Unload handler opens a remote window
    crit: hostile
    conf: 0.97
    for: [html]
    attack: T1204.001
    near_bytes: 800
    all:
      - id: micro-behaviors/ui/window/event::html-body-unload-handler
      - id: metadata/lang/source/syntax/call/arguments::open-quoted-arguments-text
  # Bind history rewriting to the popstate callback and require the
  # independent alert-loop exit trap before inferring hostile lockout.
  - id: back-button-history-redirect-trap
    desc: Forged history traps back-button navigation
    crit: hostile
    conf: 0.96
    for: [html]
    near_bytes: 1500
    all:
      - id: micro-behaviors/ui/window/navigation/location::popstate-push-then-replace
      - id: objectives/impact/degrade/resource::browser-blocking-exit-alert-trap
  - id: back-button-hashchange-redirect-trap
    desc: Hashchange listener traps back-button navigation
    crit: hostile
    conf: 0.94
    for: [html]
    near_bytes: 1500
    all:
      - id: micro-behaviors/ui/window/history::history-state-update
      - id: micro-behaviors/ui/window/history::hashchange-navigation-listener
    any:
      - id: micro-behaviors/ui/window/navigation/location::browser-location-replace
      - id: micro-behaviors/data/property/assign::location-href-write-text
  # Registration spellings are interchangeable: `window.onpopstate = fn`
  # and `addEventListener('popstate', fn)` register the same Back-press
  # callback. Kits vary the spelling; the trap does not change.
  - id: popstate-registration-alternative
    desc: Popstate handler registered by property or listener
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/ui/window/history::popstate-handler-registration
      - id: micro-behaviors/ui/window/history::popstate-navigation-listener
  # The forced destination is either an absolute URL literal or a call
  # whose result is navigated to. Wrapping the landing page in a function
  # hides it from literal scans without changing the forced navigation.
  - id: back-button-redirect-target-alternative
    desc: Back redirect target is remote URL or call result
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/ui/window/navigation/location::location-replace-remote-url
      - id: micro-behaviors/ui/window/navigation/location::location-replace-call-target
  - id: back-button-popstate-remote-redirect
    desc: Popstate handler redirects Back navigation via remote or indirect target
    crit: hostile
    conf: 0.95
    attack: T1204.001
    near_bytes: 1000
    all:
      - id: micro-behaviors/ui/window/history::history-push-state-entry
      - id: popstate-registration-alternative
      - id: back-button-redirect-target-alternative
