defaults:
  platforms: [windows, unix]
  for: [html, javascript]
composite_rules:
  - id: browser-moving-exit-alert-trap
    desc: Exit alert trap with timed window movement
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/degrade/resource::browser-unload-alert-loop
      - id: micro-behaviors/ui/window/control::browser-timed-moveto-string
      - id: micro-behaviors/time/schedule/timeout::large-finite-loop-timer-scheduling
  - id: unload-opens-remote-window
    desc: Unload handler opens a remote window
    crit: hostile
    conf: 0.97
    for: [html]
    attack: T1204.001
    near_bytes: 800
    all:
      - id: micro-behaviors/ui/window/event::html-body-unload-handler
      - id: micro-behaviors/ui/window/navigation::global-open-string-target-call
  # Forged history entries plus a popstate listener plus a forced redirect:
  # the page rewrites what Back means, watches for the visitor pressing it,
  # and navigates them somewhere they did not ask to go. Routers forge and
  # listen too, but they route inward; the redirect leg is what makes this
  # a trap rather than routing.
  - id: back-button-history-redirect-trap
    desc: Forged history traps back-button navigation
    crit: hostile
    conf: 0.96
    for: [html]
    near_bytes: 1500
    all:
      - id: micro-behaviors/ui/window/navigation::history-entry-forge
      - id: micro-behaviors/ui/window/navigation::popstate-navigation-listener
      - id: micro-behaviors/ui/window/navigation::browser-location-replace
  # Interception-only twin of the trap above: forged entries with a
  # popstate listener but no forced redirect may be aggressive routing, so
  # it stays suspicious. It exists so the redirect leg carries the
  # conviction alone.
  - id: back-button-navigation-interception
    desc: History interception without forced redirect
    crit: suspicious
    conf: 0.9
    for: [html]
    near_bytes: 1500
    all:
      - id: micro-behaviors/ui/window/navigation::history-entry-forge
      - id: micro-behaviors/ui/window/navigation::popstate-navigation-listener
