defaults:
  platforms: [windows, unix]
  for: [html, javascript]
composite_rules:
  - id: back-button-hash-redirect
    desc: Synthetic history with hash-gated Back redirect
    crit: suspicious
    conf: 0.95
    near_bytes: 512
    all:
      - id: micro-behaviors/ui/window/navigation::history-push-state-entry
      - id: micro-behaviors/ui/window/navigation::popstate-hash-location-replace
  - id: browser-moving-exit-alert-trap
    desc: Exit alert trap with timed window movement
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/degrade/resource::browser-unload-alert-loop
      - id: micro-behaviors/ui/window/control::browser-timed-moveto-string
      - id: micro-behaviors/time/schedule/timeout::large-finite-loop-timer-scheduling
  - id: unload-opens-remote-window
    desc: Unload handler opens a remote window
    crit: hostile
    conf: 0.97
    for: [html]
    attack: T1204.001
    near_bytes: 800
    all:
      - id: micro-behaviors/ui/window/event::html-body-unload-handler
      - id: micro-behaviors/ui/window/navigation::global-open-string-target-call
  # Bind history rewriting to the popstate callback and require the
  # independent alert-loop exit trap before inferring hostile lockout.
  - id: back-button-history-redirect-trap
    desc: Forged history traps back-button navigation
    crit: hostile
    conf: 0.96
    for: [html]
    near_bytes: 1500
    all:
      - id: micro-behaviors/ui/window/navigation::popstate-push-then-replace
      - id: objectives/impact/degrade/resource::browser-blocking-exit-alert-trap
  - id: back-button-hashchange-redirect-trap
    desc: Hashchange listener traps back-button navigation
    crit: hostile
    conf: 0.94
    for: [html]
    near_bytes: 1500
    all:
      - id: micro-behaviors/ui/window/navigation::history-state-update
      - id: micro-behaviors/ui/window/navigation::hashchange-navigation-listener
    any:
      - id: micro-behaviors/ui/window/navigation::browser-location-replace
      - id: micro-behaviors/ui/window/navigation::browser-location-href-assign
