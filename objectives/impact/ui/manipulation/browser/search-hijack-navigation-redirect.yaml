# Search hijacker shape: the extension forces itself in as the default
# search engine and also intercepts top-level navigations to send matching
# hostnames somewhere else. Both the omnibox and typed addresses are taken.
defaults:
  platforms: [unix, windows]
  for: [npm, chrome-manifest, crx, javascript, typescript, zip]
  attack: T1185

composite_rules:
  - id: default-search-plus-navigation-redirect
    desc: Default search takeover plus hostname navigation redirect
    crit: hostile
    conf: 0.88
    scope: archive
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: micro-behaviors/browser-extension/lifecycle::chrome-webnavigation-before-navigate
      - id: micro-behaviors/browser-extension/tabs::hostname-keyed-map-tab-redirect

  # A content script on every site that renders a query parameter as HTML
  # gives anyone who can craft a link script execution inside those sites.
  - id: all-sites-url-param-html-injection
    desc: All-sites content script renders a URL parameter as HTML
    crit: suspicious
    conf: 0.85
    scope: archive
    all:
      - id: metadata/permission/dom::content-script-all-sites
      - id: micro-behaviors/ui/window/insert-html::url-query-param-innerhtml
