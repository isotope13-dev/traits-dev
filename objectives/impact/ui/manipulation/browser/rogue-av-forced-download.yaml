# Rogue-antivirus forced download: a confirm() dialog claims infection,
# navigation is forced to a local executable, and a popup opens the same
# payload for hosts where the location assignment is blocked. Scare plus
# two delivery paths; any one alone stays neutral.
defaults:
  platforms: [windows]
  for: [html]
composite_rules:
  - id: rogue-av-forced-exe-download
    desc: Infection scare forces executable download
    crit: hostile
    conf: 0.97
    near_bytes: 2000
    all:
      - id: micro-behaviors/ui/dialog/prompt::infection-scare-confirm-call
      - id: micro-behaviors/ui/window/navigation::executable-location-navigation
      - id: micro-behaviors/ui/window/navigation::browser-window-open-text-call
