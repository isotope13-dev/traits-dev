# The Internet Explorer Start Page key written from a script that splits the
# path across string pieces ("...\Internet Explorer" + "\Main\Start Page").
# The whole-path text atom cannot join them, but the second piece survives as
# its own literal. Writing that value from script rewrites the user's home page.
defaults:
  platforms: [windows]
  for: [javascript, html, vbs]
  attack: T1112
traits:
  - id: script-ie-main-start-page-literal
    desc: Script names IE Main Start Page value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\\{1,2}Main\\{1,2}Start Page'

composite_rules:
  - id: script-ie-start-page-registry-write
    desc: Script rewrites the Internet Explorer Start Page value
    crit: suspicious
    conf: 0.85
    mbc: E1112
    all:
      - id: script-ie-main-start-page-literal
    any:
      - id: micro-behaviors/os/registry/value/write::js-regwrite-method-call
      - id: micro-behaviors/os/registry/value/write::wscript-regwrite
