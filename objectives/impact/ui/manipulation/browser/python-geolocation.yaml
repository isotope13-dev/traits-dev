# Python packages that combine an automatic startup hook, host geolocation,
# and browser launching. This is unusual enough to review, but it can be a
# disclosed novelty or region-selection feature and is not inherently hostile.
defaults:
  platforms: [windows, unix]
  for: [whl]

composite_rules:
- id: python-startup-geolocated-browser-launch
  desc: Startup hook with geolocated browser launch
  crit: suspicious
  conf: 0.92
  scope: archive
  all:
  - id: objectives/persistence/login/python-startup::is-sitecustomize-file
  - id: objectives/discovery/host/geo::ip-geolocation-lookup
  - id: micro-behaviors/process/create/launch::webbrowser-open
