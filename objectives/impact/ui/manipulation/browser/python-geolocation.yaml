# Python packages that use automatic startup hooks to route users to a
# region-selected browser destination. The behavior is a user-interface
# impact pattern, not merely ordinary geolocation or browser use.
defaults:
  platforms: [windows, unix]
  for: [whl]
  attack: T1491

composite_rules:
- id: python-geolocation-browser-redirection
  desc: Package geolocates host before browser redirect
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: objectives/persistence/login/python-startup::is-sitecustomize-file
  - id: objectives/discovery/host/geo::ip-geolocation-lookup
  - id: micro-behaviors/process/create/launch::webbrowser-open
