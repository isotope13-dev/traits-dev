defaults:
  platforms:
  - windows
  for:
  - html
  - vbs
  - javascript
  - batch
  - powershell
  crit: notable
  conf: 0.98

traits:
- id: regwrite-lock-ie-homepage
  desc: RegWrite blocks IE homepage editing
  if:
    type: text
    case_insensitive: true
    regex: RegWrite.{0,160}\\Control Panel.{0,8}[\\"]HomePage[",\s]+(REG_DWORD[",\s]+)?1\b
  for:
  - html
  - vbs
  - javascript
  - batch
  - powershell
  - text
