# These are co-occurrence findings, not proven source-to-sink relationships.
# Enterprise management is a plausible use, so neither rule is hostile.
defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: suspicious
  conf: 0.9
composite_rules:
  - id: force-extension-executable-fetch-api-set
    desc: Force-extension policy with executable fetch and launch APIs
    all:
      - id: micro-behaviors/os/registry/keys/policy::chrome-extension-force-install-policy-key
      - id: micro-behaviors/os/registry/access::registry-set-value-api
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
      - id: micro-behaviors/process/create/shellexec::shell-execute
  - id: force-extension-scheduled-dll-api-set
    desc: Force-extension policy with Task Scheduler and DLL export arguments
    all:
      - id: micro-behaviors/os/registry/keys/policy::chrome-extension-force-install-policy-key
      - id: micro-behaviors/os/registry/access::registry-set-value-api
      - id: micro-behaviors/os/autorun/scheduled::task-scheduler-com-class-guid
      - id: micro-behaviors/process/create/launch::rundll32-exe-literal
      - id: micro-behaviors/process/create/exec::quoted-dll-export-argument
