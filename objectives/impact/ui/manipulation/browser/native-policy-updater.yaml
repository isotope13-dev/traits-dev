# The two `force-extension-*-api-set` rules below are co-occurrence findings,
# not proven source-to-sink relationships. Enterprise management is a
# plausible use, so neither rule is hostile on its own. The third rule fires
# only when both co-occur with Run-key persistence and temp staging: no
# enterprise tool force-installs an extension, fetches and launches an
# executable, plants a rundll32 DLL-export scheduled task, writes a Run key
# and stages a temp payload together, so that combination is hostile.
defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: suspicious
  conf: 0.9
traits:
  - id: omnibox-search-query-exfil-params
    desc: Chrome omnibox search query parameters
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: '&sLocation=Omni'
  - id: browser-search-bar-monitor-timer
    desc: Browser search bar monitoring timer callback
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: SearchingTimerProc
composite_rules:
  - id: force-extension-executable-fetch-api-set
    desc: Force-extension policy with executable fetch and launch APIs
    all:
      - id: micro-behaviors/os/registry/policy/reference::chrome-extension-force-install-policy-key
      - id: micro-behaviors/os/registry/value/write::registry-set-value-api
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
    any:
      - id: micro-behaviors/os/handler/open::shell-execute
      - id: micro-behaviors/os/handler/open::shell-execute-ex
      - id: micro-behaviors/process/config/window::dotnet-console-launch-config-references
    needs: 1
  - id: force-extension-scheduled-dll-api-set
    desc: Force-extension policy with Task Scheduler and DLL export arguments
    all:
      - id: micro-behaviors/os/registry/policy/reference::chrome-extension-force-install-policy-key
      - id: micro-behaviors/os/registry/value/write::registry-set-value-api
      - id: micro-behaviors/os/autorun/scheduled::task-scheduler-com-class-guid
      - id: micro-behaviors/os/application/target/system::rundll32-executable-reference
      - id: micro-behaviors/process/argument/file::quoted-dll-export-argument
  - id: force-extension-persistent-loader
    desc: Force-extension loader with download, task and Run persistence
    crit: hostile
    conf: 0.97
    attack: T1176,T1547.001
    all:
      - id: force-extension-executable-fetch-api-set
      - id: force-extension-scheduled-dll-api-set
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run
      - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
  - id: force-extension-scheduled-dll-omnibox-hijacker
    desc: Scheduled DLL and omnibox hijacker
    crit: hostile
    conf: 0.98
    attack: T1176,T1053.005
    all:
      - id: force-extension-scheduled-dll-api-set
      - id: omnibox-search-query-exfil-params
      - id: browser-search-bar-monitor-timer
      - id: metadata/binary/layout/embedded::embedded-pe-three-plus
