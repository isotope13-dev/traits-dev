# Vision-guided ad interaction is dual-use in isolation.  Requiring all three
# perception/automation legs plus ad-layout vocabulary makes this objective a
# technique detector rather than an ML or accessibility library detector.
defaults:
  platforms: [android, unix, windows]
  for: [java, kotlin, apk, zip]

traits:
  - id: sponsored-layout-label
    desc: Sponsored-content UI label
    crit: component
    conf: 0.86
    if:
      type: text
      word: sponsored

  - id: banner-layout-label
    desc: Banner advertising UI label
    crit: component
    conf: 0.86
    if:
      type: text
      word: banner

  - id: interstitial-layout-label
    desc: Interstitial advertising UI label
    crit: component
    conf: 0.86
    if:
      type: text
      word: interstitial

  - id: advertising-layout-label
    desc: Advertising UI label
    crit: component
    conf: 0.86
    if:
      type: text
      word: advertising

  - id: uninstall-interstitial-log
    desc: Uninstall-flow interstitial advertising log
    crit: component
    conf: 0.99
    for: [dex]
    if:
      type: text
      exact: "!Showing uninstall interstitial ad"

  - id: uninstall-interstitial-config
    desc: Uninstall-flow interstitial ad setting
    crit: component
    conf: 0.98
    for: [dex]
    if:
      type: text
      exact: inter_splash_uninstall

composite_rules:
  # Out-of-context interstitials: USER_PRESENT wakes a persisted job, which
  # checks that the display is interactive and applies its own display pacing.
  # Normal in-app advertising has no reason to bind all four mechanisms.
  - id: android-unlock-triggered-interstitial-adware
    desc: Device unlock triggers paced interstitial advertising
    crit: hostile
    conf: 0.98
    for: [apk, zip, dex]
    all:
      - id: micro-behaviors/os/event/trigger::android-user-present-action
      - id: micro-behaviors/time/schedule/interval::android-persisted-job-schedule
      - id: micro-behaviors/hardware/display/state::android-screen-interactive-check
      - id: micro-behaviors/ui/window/advertising::android-interstitial-display-pacing

  - id: android-uninstall-shortcut-ad-interception
    desc: Monetizes an app-routed uninstall shortcut with interstitial ads
    crit: hostile
    conf: 0.99
    for: [dex]
    all:
      - id: micro-behaviors/ui/controls/shortcut::app-routed-uninstall-shortcut
      - id: uninstall-interstitial-log
      - id: uninstall-interstitial-config

  - id: android-vision-guided-ad-click-automation
    desc: Android vision-guided advertising click automation
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-node-automation
      - id: micro-behaviors/data/parse/ocr::android-mlkit-ocr
      - id: micro-behaviors/data/parse/vision::model-backed-object-detection
    any:
      - id: sponsored-layout-label
      - id: banner-layout-label
      - id: interstitial-layout-label
      - id: advertising-layout-label
    near_bytes: 6000
