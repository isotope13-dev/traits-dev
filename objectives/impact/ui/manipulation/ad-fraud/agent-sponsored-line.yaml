# A client that puts a paid "sponsored line" into an AI coding agent's own
# interface (status line, hook, plugin) and counts impressions for an
# advertiser. The UI placement, the impression accounting and a curl-to-shell
# installer are each common alone: sponsored content is ordinary on the web,
# and piped installers are common for developer tools. Requiring three of the
# four legs keeps the composite on the combination that describes an ad
# product installed into agent tooling.
defaults:
  platforms: [unix, windows]
  for: [html, markdown, text, shell, json]

traits:
  - id: agent-sponsored-line-text
    desc: Describes a sponsored line in tool UI
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: sponsored line
      case_insensitive: true

  - id: agent-ad-impression-accounting
    desc: Describes advertiser impression accounting
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)advertiser[^\n]{0,200}impression|impression[^\n]{0,200}advertiser'

  - id: agent-curl-pipe-shell-install
    desc: Pipes a curl download into sh
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'curl[^\n]{0,120}\|[ \t]*sh\b'

composite_rules:
  - id: agent-sponsored-line-installer
    desc: AI agent ad line with curl-to-shell installer
    crit: hostile
    conf: 0.9
    scope: file
    any:
      - id: objectives/impact/ui/manipulation/ad-fraud::agent-sponsored-line-text
      - id: objectives/impact/ui/manipulation/ad-fraud::agent-ad-impression-accounting
      - id: objectives/impact/ui/manipulation/ad-fraud::agent-curl-pipe-shell-install
      - id: micro-behaviors/fs/path/agent-config/file::claude-settings-json-text
    needs: 3
