defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1071.001

traits:
  - id: shell-explorer-browser-control
    desc: Embedded Shell.Explorer browser control
    crit: notable
    conf: 0.85
    if:
      type: text
      exact: Shell.Explorer

  - id: embedded-browser-script-injection
    desc: Injects script into embedded browser page
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'document.createElement("script")'
composite_rules:
  # A native agent hosts the embedded Internet Explorer control, injects a
  # remotely sourced script element into the page it loads, and reports
  # searches and clicks back in its caret-delimited stats format. That is
  # automated advertising traffic, not user browsing: no person sees the
  # browser or chooses the clicks being counted.
  - id: native-embedded-browser-click-fraud
    desc: Embedded browser script injection click fraud
    crit: hostile
    conf: 0.95
    all:
      - id: shell-explorer-browser-control
      - id: embedded-browser-script-injection
      - id: objectives/command-and-control/remote-command/dispatch/task-table::caret-click-stats-report-format
