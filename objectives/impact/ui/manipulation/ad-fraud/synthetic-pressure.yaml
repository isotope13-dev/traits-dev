# The combination suggests synthetic conversion pressure, not credential theft
# or a proven fraudulent transaction. Neither ordinary UI primitive convicts
# alone. No brand, campaign hostname, amount or English lure wording is used.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: synthetic-scarcity-and-activity
    desc: Synthetic scarcity and randomized notices
    crit: suspicious
    conf: 0.9
    near_bytes: 4000
    all:
      - id: micro-behaviors/ui/window/dom/render::timed-positive-floor-counter
      - id: micro-behaviors/ui/window/dom/render::repeated-randomized-dom-text
      - id: micro-behaviors/ui/window/navigation/open::browser-window-open-variable-blank
