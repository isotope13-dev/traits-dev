defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, crx]

traits:
  - id: inactive-pinned-tab-insert
    desc: Opens inactive pinned browser tab
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)pinned\s*:\s*(!0|true)[^}]{0,100}active\s*:\s*(!1|false)'
  - id: affiliate-destination-link-params
    desc: Affiliate link carries session and destination
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)URLSearchParams\s*\(\s*\{\s*sid\s*:\s*\w+\s*,\s*dest\s*:'
  - id: affiliate-location-replace-network
    desc: Affiliate redirect network
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'top\.location\.replace\([^)]{0,160}(union-click|goitem|goali)'
      case_insensitive: true

composite_rules:
  # A DNR rule that rewrites Amazon navigation to add an affiliate tag changes
  # the destination attribution for every matching request.  The commercial
  # target and tag must come from the parsed rules.json structure, rather than
  # from generic JavaScript text.
  - id: affiliate-location-replace
    desc: Affiliate navigation via page location
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/ui/window/navigation/location::top-location-replace-string
    any:
      - id: affiliate-location-replace-network
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::affiliate-domain-pattern
    near_bytes: 8192

  - id: affiliate-navigation-injection
    desc: Extension injects affiliate navigation
    crit: suspicious
    conf: 0.96
    attack: T1195.002
    for: [crx, xpi, zip, javascript]
    all:
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::affiliate-domain-pattern
      - id: affiliate-location-replace
    any:
      - id: micro-behaviors/ui/window/visibility::hidden-iframe
      - id: micro-behaviors/ui/window/dom/create::browser-create-iframe-element
      - id: micro-behaviors/ui/window/navigation/open::browser-window-open
    scope: archive
    near_bytes: 4096
  - id: hidden-affiliate-tab-on-navigation
    desc: Opens and closes hidden affiliate tabs
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: inactive-pinned-tab-insert
      - id: affiliate-destination-link-params
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-on-updated
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-remove
