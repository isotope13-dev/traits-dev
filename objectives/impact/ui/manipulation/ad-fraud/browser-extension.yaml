# A comparison/search extension that navigates the active tab through multiple
# affiliate short links, waits for attribution to settle, and explicitly skips
# its normal task work is performing affiliate-cookie seeding rather than a
# user-requested comparison. Each capability is legitimate alone; their joined
# control flow is the fraud behavior.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: browser-extension-affiliate-seed-visits
    desc: Extension performs automated affiliate seed visits
    crit: hostile
    conf: 0.98
    attack: T1496
    near_lines: 32
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-namespace-core
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-update-with-url
      - id: micro-behaviors/communications/http/services/ecommerce::multi-network-affiliate-shortlinks
      - id: micro-behaviors/data/control-flow/analysis::js-seed-task-delay-skip
