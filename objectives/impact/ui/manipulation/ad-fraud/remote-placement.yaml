defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: hostile
  conf: 0.98
composite_rules:
  - id: remote-policy-browser-ad-overlay
    desc: Remote ad policy injects page-blocking overlays
    all:
      - id: micro-behaviors/ui/window/advertising::remote-banner-placement-record
      - id: micro-behaviors/ui/window/advertising::remote-ad-display-switch
      - id: micro-behaviors/ui/window/insert-html::browser-innerhtml-assignment
      - id: micro-behaviors/ui/window/style::css-fixed-position
      - id: micro-behaviors/ui/window/style::high-z-index-style
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
      - id: micro-behaviors/ui/window/navigation/open::browser-window-open
  - id: remote-policy-keyword-ad-popup
    desc: Remote keyword ad policy opens popup redirects
    all:
      - id: micro-behaviors/ui/window/advertising::keyword-redirect-policy-record
      - id: micro-behaviors/ui/window/advertising::remote-ad-display-switch
      - id: micro-behaviors/ui/window/navigation/open::browser-window-open
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
      - id: micro-behaviors/ui/window/advertising::remote-banner-placement-record
