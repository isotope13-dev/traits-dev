# Identity evidence only. taprkr.com is a shared affiliate tracking service;
# its involvement does not identify the scam operator or incriminate an app.
# Source: Malwarebytes, 2026-11-04, "The fake $750 Apple Cash reward that pays out nothing".
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
traits:
  - id: applecashgiftcard-domain-reference
    desc: Reported Apple Cash reward scam hostname
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)https?://applecashgiftcard\.com([/:?#"''\s]|$)'
