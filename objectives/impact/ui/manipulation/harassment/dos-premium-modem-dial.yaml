defaults:
  platforms: [windows, unix]
  for: [dos_com]
  attack: T1499

traits:
  - id: dos-stack-overflow-message
    desc: DOS code contains stack-overflow error message
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Stack overflow
  - id: dos-silent-premium-modem-dial
    desc: DOS code contains silent premium modem dial
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: 'AT&FL0M0DT1900[0-9]{7}'
  - id: dos-bios-modem-send-loop
    desc: DOS code sends bytes via BIOS serial
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'B8 43 00 CD 14 B4 01 AC 0A C0 74 04 CD 14 EB F5 C3'

composite_rules:
  - id: dos-fake-error-premium-modem-dial
    desc: DOS fake error hides premium-number modem dialing
    crit: hostile
    conf: 0.99
    near_bytes: 256
    all:
      - id: dos-stack-overflow-message
      - id: dos-silent-premium-modem-dial
      - id: dos-bios-modem-send-loop
