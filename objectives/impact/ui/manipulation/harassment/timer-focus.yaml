defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  - id: repeated-timer-focus-screen-popup
    desc: Repeated timed focus with screen-sized popup windows
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/ui/window/navigation::timer-text-focus-call
      - id: micro-behaviors/ui/window/navigation::assigned-global-open-blank-window
      - id: micro-behaviors/ui/window/control::resize-to-available-screen
