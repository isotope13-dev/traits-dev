defaults:
  for: [html, javascript]
  platforms: [windows, unix]
traits:
  - id: unconditional-prompt-loop-body
    desc: Endless loop contains only a modal prompt
    crit: suspicious
    conf: 0.99
    if:
      type: text
      exclude_html_comments: true
      regex: 'while\s*\(\s*true\s*\)\s*window\.prompt\([^;\r\n]{1,120}\);'
  - id: unconditional-alert-loop-body
    desc: Endless loop contains only a modal alert
    crit: suspicious
    conf: 0.99
    if:
      type: text
      exclude_html_comments: true
      regex: 'while\s*\(\s*true\s*\)\s*window\.alert\([^;\r\n]{1,500}\)\s*\}'
  - id: repeated-inline-alert-scripts
    desc: Inline scripts repeatedly open browser alerts
    for: [html]
    crit: hostile
    conf: 0.97
    count_min: 12
    if:
      # Older pages put an HTML-style comment on the first script line.
      # Count script openings so a single alert in a library is insufficient.
      type: text
      regex: '(?i)<script\b[^>]{0,160}>\s*(<!--[^\n]{0,100}\n\s*)?\(?\s*(window\.)?alert\s*\('
composite_rules:
  - id: endless-modal-prompt-loop
    desc: Endless modal prompts block browser interaction
    crit: hostile
    conf: 0.99
    all:
      - id: unconditional-prompt-loop-body
      - id: micro-behaviors/ui/dialog/prompt::browser-window-prompt-call

  - id: endless-modal-alert-loop
    for: [html]
    desc: Unconditional modal alerts block browser interaction
    near_bytes: 128
    crit: hostile
    conf: 0.99
    all:
      - id: unconditional-alert-loop-body
      - id: micro-behaviors/ui/dialog/prompt::browser-window-alert-call
