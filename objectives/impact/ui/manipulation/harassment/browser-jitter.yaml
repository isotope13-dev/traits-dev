defaults:
  platforms: [windows, unix]
  for: [javascript, html]
composite_rules:
  - id: rapid-browser-window-jitter
    desc: Random window movement with rapid string timer
    crit: suspicious
    conf: 0.96
    near_bytes: 500
    all:
      - id: micro-behaviors/ui/window/control::browser-random-relative-movement
      - id: micro-behaviors/time/schedule/interval::rapid-string-callback
traits:
  # Bind each operation to the direct body of the repeating callback. Merely
  # opening a popup beside move/focus APIs and an unrelated timeout proves
  # neither recurring interference nor resource exhaustion. These patterns
  # describe attempts: browser policy can reject movement or focus, and no
  # exit suppression is required, so neither establishes a hostile lockup.
  - id: browser-subsecond-random-movement
    desc: Repeated random window movement below one second
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: tree-sitter
      query: |
        ((call_expression function: (identifier) @timer
          arguments: (arguments .
            [(function_expression body: (statement_block
               (expression_statement (call_expression
                 function: (member_expression object: (identifier) @window
                   property: (property_identifier) @move)
                 arguments: (arguments (binary_expression
                   left: (call_expression function: (member_expression
                     object: (identifier) @math
                     property: (property_identifier) @random))))))))
             (arrow_function body: (statement_block
               (expression_statement (call_expression
                 function: (member_expression object: (identifier) @window
                   property: (property_identifier) @move)
                 arguments: (arguments (binary_expression
                   left: (call_expression function: (member_expression
                     object: (identifier) @math
                     property: (property_identifier) @random))))))))]
            . (number) @delay)) @interval
          (#eq? @timer "setInterval")
          (#eq? @window "window")
          (#eq? @move "moveTo")
          (#eq? @math "Math")
          (#eq? @random "random")
          (#match? @delay "^[1-9][0-9]{0,2}$"))
  - id: browser-subsecond-focus-reassertion
    desc: Repeated window focus attempts below one second
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: tree-sitter
      query: |
        ((call_expression function: (identifier) @timer
          arguments: (arguments .
            [(function_expression body: (statement_block
               (expression_statement (call_expression
                 function: (member_expression object: (identifier) @window
                   property: (property_identifier) @focus)))))
             (arrow_function body: (statement_block
               (expression_statement (call_expression
                 function: (member_expression object: (identifier) @window
                   property: (property_identifier) @focus)))))]
            . (number) @delay)) @interval
          (#eq? @timer "setInterval")
          (#eq? @window "window")
          (#eq? @focus "focus")
          (#match? @delay "^[1-9][0-9]{0,2}$"))
  - id: markup-corrupted-alert-bomb
    desc: Malformed endless browser alert-bomb code
    crit: suspicious
    conf: 0.99
    # Literal markup in script raw text is invalid JavaScript. This is
    # attack-shaped source, not evidence that the browser executes the bomb.
    if:
      type: text
      regex: '(?i)<p><br>function[^<]{0,80}<br>\{<br>\s*while\s*\(true\)<br>\s*window\.alert\('
