# A script that launches a viewport-filling image through MSHTA gives the
# user no normal window to dismiss; combined with a child-process launcher
# in the same file, the display is forced rather than offered.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1491

composite_rules:
  - id: script-forced-fullscreen-image
    desc: Script forces a fullscreen image display via MSHTA
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/eval::mshta-inline-fullscreen-image
      - id: metadata/import/builtin::require-child-process
