defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: repeated-popup-document-replication
    desc: Timer copies this page into new popups
    crit: hostile
    conf: 0.98
    attack: T1499
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (_) @timer
          arguments: (arguments
            . (_ body: (statement_block
              [(lexical_declaration (variable_declarator
                name: (identifier) @opened
                value: (call_expression function: (_) @open)))
               (variable_declaration (variable_declarator
                name: (identifier) @opened
                value: (call_expression function: (_) @open)))]
              (expression_statement (call_expression
                function: (member_expression
                  object: (member_expression
                    object: (identifier) @destination
                    property: (property_identifier) @document)
                  property: (property_identifier) @write)
                arguments: (arguments . (_) @markup)))))
            (number) @delay))
          (#match? @timer "^((window|self|globalThis)\\s*\\.\\s*)?setInterval$")
          (#match? @open "^(window|self|globalThis)\\s*\\.\\s*open$")
          (#eq? @opened @destination)
          (#eq? @document "document")
          (#eq? @write "write")
          (#match? @markup "^document\\s*\\.\\s*documentElement\\s*\\.\\s*(outerHTML|innerHTML)\\b")
          (#match? @delay "^[0-9]{1,3}$"))
