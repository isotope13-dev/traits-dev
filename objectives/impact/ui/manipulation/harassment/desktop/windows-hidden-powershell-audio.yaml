# Locker/prank payload that drives a hidden PowerShell child to peg the system
# volume (volume-up key spam) and loop synthesized speech. A TTS call or a
# hidden PowerShell launch is common alone; a hidden child that forces volume and
# repeats speech indefinitely has no use except to harass the user.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1491.001

traits:
  - id: hidden-powershell-inline-command
    desc: Hidden PowerShell inline command arguments
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)-NoP\w*\s+-W(indowStyle)?\s+Hidden\s+-C'

  - id: powershell-volume-up-key-spam
    desc: PowerShell sends volume-key characters
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'SendKeys\(\[char\]17[345]\)'

  - id: powershell-endless-speech-loop
    desc: PowerShell speech synthesizer in endless loop
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'SpeechSynthesizer.{1,200}while \(\$true\)'

composite_rules:
  - id: hidden-powershell-forced-volume-speech
    desc: Hidden PowerShell forces volume and loops speech
    crit: hostile
    conf: 0.88
    all:
      - id: hidden-powershell-inline-command
    any:
      - id: powershell-volume-up-key-spam
      - id: powershell-endless-speech-loop
    needs: 2
