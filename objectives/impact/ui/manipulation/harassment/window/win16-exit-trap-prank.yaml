defaults:
  for: [ne]
  platforms: [windows]

traits:
  - id: exit-trap-taunt
    desc: Blocks exit with taunting prompt
    crit: suspicious
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: '(exit so easily|not safe yet|cannot exit|can''t close)'

  - id: unlock-code-prompt
    desc: Gated exit on secret unlock code
    crit: notable
    conf: 0.88
    if:
      type: text
      case_insensitive: true
      substr: "Code accepted"

composite_rules:
  - id: win16-exit-trap-harassment
    desc: Win16 prank trojan traps exit and taunts user
    crit: hostile
    conf: 0.95
    attack: T1491.001
    all:
      - id: exit-trap-taunt
      - id: objectives/impact/ui/manipulation/harassment/chat::profane-harassment-string
      - id: unlock-code-prompt
