defaults:
  platforms: [macos, ios, windows]
  for: [html]
  crit: hostile
  conf: 0.98

composite_rules:
  - id: scareware-itunes-link-click-flood
    desc: Scareware attempts null-suffixed iTunes clicks
    all:
      - id: micro-behaviors/communications/url/scheme::itunes-anchor-uri
      - id: micro-behaviors/communications/url/scheme::itunes-anchor-null-suffix
      - id: micro-behaviors/ui/controls/widget::repeated-first-anchor-clicks
      - id: objectives/impact/ui/manipulation/social::vendor-breach-phone-support-scam
