# Win16 CompuServe message bomber: a 16-bit program drives the CompuServe
# Information Manager window with simulated keystrokes and asks how many times
# to repeat a message. The keystroke leaf and the repeat prompt are shared with
# the IRC keystroke flood rule; the CompuServe window title is the target leg.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1491

traits:
  - id: cis-winim-window-text
    desc: Targets CompuServe Information Manager window
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: CompuServe Information Manager

composite_rules:
  - id: win16-cis-message-bomber
    desc: Win16 program floods CompuServe forum with repeated keystroke messages
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/hardware/input/keyboard/simulate::win16-sendkeys-key-name
      - id: objectives/impact/ui/manipulation/harassment/chat::chat-repeat-count-prompt
      - id: cis-winim-window-text
