# Win16 IRC message flood: a 16-bit program asks for a message and a repeat
# count, then types /msg commands into an IRC client through simulated
# keystrokes. The keystroke leaf is the shared Win16 SendKeys capability and
# the /msg leaf is the shared IRC command literal, so the repeat prompt is the
# only leaf specific to this rule.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1491

traits:
  - id: chat-repeat-count-prompt
    desc: Prompts for a message repeat count
    crit: notable
    conf: 0.85
    if:
      type: text
      case_insensitive: true
      regex: 'how many times\?'

composite_rules:
  - id: win16-irc-keystroke-flood
    desc: Win16 program floods IRC with repeated keystroke-sent messages
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/hardware/input/keyboard/simulate::win16-sendkeys-key-name
      - id: micro-behaviors/communications/irc/command::win16-irc-msg-command
      - id: chat-repeat-count-prompt
