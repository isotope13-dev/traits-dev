# Win16 AOL client automation: a program finds the AOL 3.0 frame window and
# posts abusive text into chat or instant-message windows. The AOL frame
# class lookup is shared by ordinary AOL utilities, so the abusive chat line
# is the second required leg.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1491

traits:
  - id: aol-frame-window-lookup
    desc: Win16 looks up AOL 3.0 frame window
    crit: notable
    conf: 0.85
    if:
      type: text
      case_insensitive: true
      substr: 'AOL Frame25'

  - id: aol-2x-window-lookup
    desc: Win16 looks up AOL 2.x main window
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: 'America  Online'

  - id: aol-im-punter-ui-text
    desc: AOL IM punter UI prompt text
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '(person to punt|punt someone offline)'

  # Shared by the chat-flood, IM and exit-trap rules. The word boundary keeps
  # an NUL-terminated string in the NE resource table matching; a trailing
  # space-or-"!" requirement misses it.
  - id: profane-harassment-string
    desc: Displays profane harassment message
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: 'fuck you\b'

  - id: aol-im-punt-progress
    desc: AOL IM punter progress and speed text
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: 'punt(ing|ed| speed| stopped)'

  # An AOL keyword link whose argument ends in PUNT, such as aol://2719:2-2-PUNT.
  - id: aol-punt-keyword-url
    desc: AOL keyword URL carries a PUNT suffix
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: 'aol://[0-9:-]{1,20}punt'

composite_rules:
  - id: win16-aol-im-harassment
    desc: Win16 AOL automation posts profane harassment text
    crit: hostile
    conf: 0.95
    all:
      - id: profane-harassment-string
      - id: aol-frame-window-lookup

  - id: aol-any-window-lookup
    desc: Win16 looks up AOL 2.x or 3.0 window
    crit: notable
    conf: 0.85
    any:
      - id: aol-frame-window-lookup
      - id: aol-2x-window-lookup

  - id: win16-aol-im-punter
    desc: Win16 AOL punter disrupts users with repeated IMs
    crit: hostile
    conf: 0.93
    all:
      - id: aol-any-window-lookup
    any:
      - id: aol-im-punt-progress
      - id: aol-im-punter-ui-text
      - id: aol-punt-keyword-url
