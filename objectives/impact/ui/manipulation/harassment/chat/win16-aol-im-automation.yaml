# Win16 AOL client automation: a program finds the AOL 3.0 frame window and
# posts abusive text into chat or instant-message windows. The AOL frame
# class lookup is shared by ordinary AOL utilities, so the abusive chat line
# is the second required leg.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1491

traits:
  - id: aol-frame-window-lookup
    desc: Win16 looks up AOL 3.0 frame window
    crit: notable
    conf: 0.85
    if:
      type: text
      case_insensitive: true
      substr: 'AOL Frame25'

  - id: aol-2x-window-lookup
    desc: Win16 looks up AOL 2.x main window
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: 'America  Online'

  - id: aol-im-punter-ui-text
    desc: AOL IM punter UI prompt text
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '(person to punt|punt someone offline)'

  # Shared by the chat-flood, IM and exit-trap rules. The word boundary keeps
  # an NUL-terminated string in the NE resource table matching; a trailing
  # space-or-"!" requirement misses it.
  - id: profane-harassment-string
    desc: Displays profane harassment message
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: 'fuck you\b|fucking whore'

  - id: aol-im-punt-progress
    desc: AOL IM punter progress and speed text
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: 'punt(ing|ed| speed| stopped)'

  # An AOL keyword link whose argument ends in PUNT, such as aol://2719:2-2-PUNT.
  - id: aol-punt-keyword-url
    desc: AOL keyword URL carries a PUNT suffix
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: 'aol://[0-9:-]{1,20}punt'

  # A message pool of sexual lines: a single profane word is ordinary, but
  # repeated terms in one Win16 program are a chat-spam text table. Each term
  # is its own atom so count_min counts that term alone, and a group needs two
  # distinct terms repeated twice before it counts.
  - id: aol-sexual-term-molest
    desc: Sexual chat term molest repeated
    crit: component
    conf: 0.9
    count_min: 2
    if:
      type: text
      case_insensitive: true
      regex: '\bmolest\w{0,3}\b'

  - id: aol-sexual-term-rape
    desc: Sexual chat term rape repeated
    crit: component
    conf: 0.9
    count_min: 2
    if:
      type: text
      case_insensitive: true
      regex: '\brape\w{0,3}\b'

  - id: aol-sexual-term-asshole
    desc: Sexual chat term asshole repeated
    crit: component
    conf: 0.9
    count_min: 2
    if:
      type: text
      case_insensitive: true
      regex: '\basshole\w{0,3}\b'

  - id: aol-sexual-term-penis
    desc: Sexual chat term penis repeated
    crit: component
    conf: 0.9
    count_min: 2
    if:
      type: text
      case_insensitive: true
      regex: '\bpenis\w{0,3}\b'

  - id: aol-sexual-term-pussy
    desc: Sexual chat term pussy repeated
    crit: component
    conf: 0.9
    count_min: 2
    if:
      type: text
      case_insensitive: true
      regex: '\bpussy\w{0,3}\b'

  - id: aol-sexual-term-anal
    desc: Sexual chat term anal repeated
    crit: component
    conf: 0.9
    count_min: 2
    if:
      type: text
      case_insensitive: true
      regex: '\banal\w{0,3}\b'

  - id: aol-sexual-term-fondle
    desc: Sexual chat term fondle repeated
    crit: component
    conf: 0.9
    count_min: 2
    if:
      type: text
      case_insensitive: true
      regex: '\bfondle\w{0,3}\b'

  - id: aol-sexual-term-cum
    desc: Sexual chat term cum repeated
    crit: component
    conf: 0.9
    count_min: 2
    if:
      type: text
      case_insensitive: true
      regex: '\bcum\w{0,3}\b'

  # AOL's own Help and violation-report forms. A program that drives them
  # files reports against other members, and the frame lookup is the second
  # leg. Each regex stays within the byte cap, so the list splits in two.
  - id: aol-violation-report-ui
    desc: AOL violation report form text
    crit: notable
    conf: 0.88
    if:
      type: text
      case_insensitive: true
      regex: 'report (a violation|password solicitations)'

  - id: aol-violation-category-ui
    desc: AOL violation category or help form text
    crit: notable
    conf: 0.88
    if:
      type: text
      case_insensitive: true
      regex: 'violations via instant|screen name & profile|write to community action'

composite_rules:
  - id: aol-violation-form-text
    desc: AOL violation report or help form text
    crit: notable
    conf: 0.88
    any:
      - id: aol-violation-report-ui
      - id: aol-violation-category-ui

  - id: win16-aol-violation-report-automation
    desc: Win16 AOL tool drives violation report forms
    crit: suspicious
    conf: 0.88
    all:
      - id: aol-frame-window-lookup
      - id: aol-violation-form-text

  - id: aol-sexual-term-group-first
    desc: Two repeated sexual chat terms from the first group
    crit: component
    conf: 0.9
    any:
      - id: aol-sexual-term-molest
      - id: aol-sexual-term-rape
      - id: aol-sexual-term-asshole
      - id: aol-sexual-term-penis
    needs: 2

  - id: aol-sexual-term-group-second
    desc: Two repeated sexual chat terms from the second group
    crit: component
    conf: 0.9
    any:
      - id: aol-sexual-term-pussy
      - id: aol-sexual-term-anal
      - id: aol-sexual-term-fondle
      - id: aol-sexual-term-cum
    needs: 2

  - id: aol-sexual-chat-text-pool
    desc: Sexual chat message pool text
    crit: notable
    conf: 0.9
    all:
      - id: aol-sexual-term-group-first
      - id: aol-sexual-term-group-second

  - id: win16-aol-im-harassment
    desc: Win16 AOL automation posts profane harassment text
    crit: hostile
    conf: 0.95
    all:
      - id: profane-harassment-string
      - id: aol-frame-window-lookup

  - id: aol-any-window-lookup
    desc: Win16 looks up AOL 2.x or 3.0 window
    crit: notable
    conf: 0.85
    any:
      - id: aol-frame-window-lookup
      - id: aol-2x-window-lookup

  - id: win16-aol-im-punter
    desc: Win16 AOL punter disrupts users with repeated IMs
    crit: hostile
    conf: 0.93
    all:
      - id: aol-any-window-lookup
    any:
      - id: aol-im-punt-progress
      - id: aol-im-punter-ui-text
      - id: aol-punt-keyword-url
