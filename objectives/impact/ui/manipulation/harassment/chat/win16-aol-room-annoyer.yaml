# Win16 AOL chat-room annoyer: a VB3 "room fux0r" that posts scripted text into
# the chat room and pauses when the room loses focus. The banner and purpose
# text are the tool's own description, so they are the evidence. The AOL frame
# lookup is shared with the other chat harassment rules in this directory.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1491

traits:
  - id: room-fux0r-banner
    desc: Room fux0r chat annoyer banner text
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: 'room fux0r|roomfuxr'

  - id: room-annoy-purpose-text
    desc: Chat room tool says it annoys people
    crit: notable
    conf: 0.88
    if:
      type: text
      case_insensitive: true
      substr: 'annoy people online'

  - id: chat-room-focus-pause-text
    desc: Chat macro pauses on room focus loss
    crit: notable
    conf: 0.88
    if:
      type: text
      case_insensitive: true
      substr: 'chat room focus was lost'

composite_rules:
  - id: win16-aol-room-annoyer
    desc: Win16 AOL chat-room annoyer with AOL frame lookup
    crit: hostile
    conf: 0.93
    all:
      - id: aol-frame-window-lookup
    any:
      - id: room-fux0r-banner
      - id: room-annoy-purpose-text
      - id: chat-room-focus-pause-text
    needs: 1
