# Win16 AOL TOS bot: a program that announces a countdown to "TOS" a chat
# member and posts a fake terms-of-service kick to the room or to the victim.
# The countdown and kick text are the behavior. The AOL frame lookup is shared
# with the other chat harassment rules in this directory.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1491

traits:
  - id: tos-bot-kick-countdown-text
    desc: Fake TOS kick countdown text
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '(will be|have been) tosed'

  - id: tos-bot-target-prompt
    desc: Prompt asks for someone to TOS
    crit: notable
    conf: 0.88
    if:
      type: text
      case_insensitive: true
      substr: 'Enter someone to TOS'

  - id: tos-bot-activated-banner
    desc: TOS bot activated banner text
    crit: notable
    conf: 0.88
    if:
      type: text
      case_insensitive: true
      regex: 'tos bot \*activated\*'

composite_rules:
  - id: win16-aol-tos-bot
    desc: Win16 AOL TOS bot posts fake terms-of-service kicks
    crit: hostile
    conf: 0.93
    all:
      - id: aol-frame-window-lookup
    any:
      - id: tos-bot-kick-countdown-text
      - id: tos-bot-target-prompt
      - id: tos-bot-activated-banner
    needs: 1
