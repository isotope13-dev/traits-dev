# Remote harassment is identified from its mechanics rather than the operator's
# command vocabulary: WebSocket input drives a rapidly respawning system
# overlay, consumes touches, and vocalizes attacker-supplied content. This
# remains stable if command names, C2 endpoints, or Java/Kotlin identifiers
# change.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1491,T1411,T1071.001
  mbc: B0033

composite_rules:
  - id: android-rapid-overlay-respawn
    desc: Android system overlay respawns at a subsecond interval
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/ui/window/manage/overlay::android-source-runtime-overlay-window
      - id: micro-behaviors/time/schedule/interval::android-subsecond-self-rescheduling-handler
    near_lines: 24

  - id: android-websocket-ui-harassment
    desc: WebSocket-controlled Android UI harassment and audio coercion
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/communications/websocket/receive::okhttp-message-handler-source
      - id: android-rapid-overlay-respawn
      - id: micro-behaviors/ui/window/manage/overlay::android-transparent-touch-capture-overlay
      - id: micro-behaviors/hardware/input/audio::android-source-text-to-speech-output
