defaults:
  platforms: [windows]
  for: [c, cpp, csharp]

traits:
  - id: unbounded-desktop-pixel-repaint
    desc: Repaints the desktop in an endless loop
    crit: hostile
    conf: 0.97
    attack: T1491.002
    if:
      type: yara
      source: |
        rule unbounded_desktop_pixel_repaint {
          meta:
            filetypes = "c,cpp,csharp"
          strings:
            $width = /GetSystemMetrics\s*\(\s*(0|SM_CXSCREEN)\s*\)/
            $height = /GetSystemMetrics\s*\(\s*(1|SM_CYSCREEN)\s*\)/
            $desktop = /GetDC\s*\(\s*(0|NULL|nullptr|IntPtr\.Zero|nint\.Zero)\s*\)/
            $infinite = /(while\s*\(\s*(true|1)\s*\)|for\s*\(\s*;\s*;\s*\))/
            $iteration = /for\s*\([^;]{1,80};[^;]{1,80};[^)]{1,80}\)/
            $paint = /SetPixel\s*\(/
          condition:
            $width and $height and $desktop and #iteration >= 2 and #paint >= 2 and
            for any i in (1..#infinite) : (
              $desktop in (@infinite[i]..@infinite[i] + 256) and
              $paint in (@infinite[i]..@infinite[i] + 800)
            )
        }
