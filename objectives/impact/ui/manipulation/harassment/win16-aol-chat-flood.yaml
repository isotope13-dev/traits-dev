# Win16 chat flooding: simulated keystrokes post abusive text into a chat room.
# The keystroke leaf is the shared Win16 SendKeys capability; the profanity
# leaf is the shared harassment string already defined in this directory.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1491

composite_rules:
  - id: win16-aol-chat-flood
    desc: Win16 chat flood posts abuse via simulated keystrokes
    crit: hostile
    conf: 0.95
    all:
      - id: profane-harassment-string
      - id: micro-behaviors/hardware/input/keyboard/simulate::win16-sendkeys-key-name
