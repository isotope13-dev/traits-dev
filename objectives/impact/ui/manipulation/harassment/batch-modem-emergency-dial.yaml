defaults:
  platforms: [windows, unix]
  for: [batch]
  attack: T1499

composite_rules:
  - id: batch-dials-emergency-number-via-serial-port
    desc: Batch dials emergency number via serial port
    crit: hostile
    conf: 0.9
    size_max: 1024
    all:
      - id: micro-behaviors/hardware/serial::hayes-modem-dial-emergency-number
      - id: micro-behaviors/hardware/serial::serial-device-name-or-path
