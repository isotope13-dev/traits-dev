# Lythium.502 executes this host display and speaker sequence after its
# directory infection pass, then returns to DOS without remaining resident.
defaults:
  platforms: [windows]
  for: [dos_com]
  attack: T1491.001
  size_max: 65536

traits:
  - id: dos-com-clear-and-print-message
    desc: DOS clears screen for message prank
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "B4 06 B5 00 B1 00 B6 18 B2 4F B7 07 B0 00 CD 10 B4 02 B6 08 B2 00 B7 00 CD 10"
      offset: 0x1a

  - id: dos-com-pit-speaker-melody
    desc: DOS plays a PC-speaker melody
    crit: suspicious
    conf: 0.97
    if:
      type: hex
      pattern: "B0 B6 E6 43 8B 07 83 C3 02 E6 42 8A C4 E6 42 E4 61 0C 03 E6 61"
      offset: 0x64

composite_rules:
  - id: dos-infected-com-screen-speaker-prank
    desc: DOS COM infector carries a screen and speaker prank
    crit: hostile
    conf: 0.98
    all:
      - id: dos-com-clear-and-print-message
      - id: dos-com-pit-speaker-melody
      - id: objectives/impact/infect/binary/dos/file::dos-com-directory-infector
