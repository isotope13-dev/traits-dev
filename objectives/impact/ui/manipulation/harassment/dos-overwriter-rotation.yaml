defaults:
  platforms: [windows]
  for: [dos_com, data]
  size_max: 65536

composite_rules:
  - id: dos-overwriter-screen-rotation
    desc: DOS file overwriter also rotates the screen
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/infect/binary/dos/overwrite::dos-search-truncate-self-image
      - id: micro-behaviors/hardware/display/render::dos-text-buffer-rotation

