# Win16 AOL client automation: a program finds the AOL 3.0 frame window and
# posts abusive text into chat or instant-message windows. The AOL frame
# class lookup is shared by ordinary AOL utilities, so the abusive chat line
# is the second required leg. The leaf uses a word boundary so that an
# NUL-terminated string in the NE resource table still matches; the shared
# profane-harassment-string leaf requires a trailing space or "!" and misses it.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1491

traits:
  - id: aol-frame-window-lookup
    desc: Win16 looks up AOL 3.0 frame window
    crit: notable
    conf: 0.85
    if:
      type: text
      case_insensitive: true
      substr: 'AOL Frame25'

  - id: aol-profane-chat-line
    desc: AOL chat line carries profane abuse
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: 'fuck you\b'

composite_rules:
  - id: win16-aol-im-harassment
    desc: Win16 AOL automation posts profane harassment text
    crit: hostile
    conf: 0.95
    all:
      - id: aol-profane-chat-line
      - id: aol-frame-window-lookup
