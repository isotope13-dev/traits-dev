# Eddie.Apa.2104 combines a DOS file infector with a timer-triggered screen
# and speaker prank. The RTC check and output paths alone are only notable;
# their conjunction identifies the intrusive payload.
defaults:
  platforms: [windows]
  for: [dos_com, static-lib, data]
  attack: T1491.001
  size_max: 65536

traits:
  - id: dos-cmos-daymod4-gate
    desc: CMOS day gates a DOS timer payload
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "B0 07 E6 70 EB 00 E4 71 24 03 74 ?? E9 ?? ??"

  - id: dos-int8-pit-speaker-output
    desc: DOS timer handler plays PC speaker notes
    crit: suspicious
    conf: 0.94
    if:
      type: hex
      pattern: "B0 B6 E6 43 [0-8] 8B 07 E6 42 86 C4 E6 42 E4 61 0C 03 E6 61"

  - id: dos-int8-vga-screen-save
    desc: DOS timer handler saves text video memory
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "B8 00 B8 8E D8 B8 00 BB 8E C0 33 FF 8B F7 B9 A0 0F FC F3 A4"

  - id: dos-int8-bda-early-tick-gate
    desc: DOS payload runs in first 40 ticks
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "83 3E 6C 00 28 72 ?? E9 ?? ??"

  - id: dos-int1c-day-8-10-gate
    desc: DOS timer effect gated to days 8-10
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: "2E 8A 16 26 07 80 FA 08 72 09 80 FA 0A 77 04 F9 EB 02 90 F8 5A 58 C3"

  - id: dos-int1c-vga-palette-fade
    desc: DOS timer handler dims the VGA palette
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: "B9 40 00 51 BB 40 00 2B D9 B8 15 10 CD 10 80 E6 3F 80 FE 00 74 02 FE CE 80 E5 3F 80 FD 00 74 02 FE CD 80 E1 3F 80 F9 00 74 02 FE C9 B8 10 10 CD 10 59 E2 CF 5A 59 5B 58 C3"

  - id: dos-int1c-tick-screen-buffer-effect
    desc: DOS timer alters screen on tick gate
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "9C 50 52 E8 A0 FF 73 1D 1E 33 C0 8E D8 A1 6C 04 0E 1F A3 7F 07 3B 06 81 07 72 09 E8 A1 FF 05 43 04 A3 81 07 1F E8 13 00 73 09 E8 98 F9 E8 D1 F9 E8 A5 F9"

composite_rules:
  - id: dos-int8-rtc-gated-screen-speaker-prank
    for: [dos_com, static-lib]
    desc: DOS date-gated screen and speaker prank
    crit: suspicious
    conf: 0.96
    all:
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int8-vector-install-direct
      - id: dos-cmos-daymod4-gate
      - id: dos-int8-bda-early-tick-gate
      - id: dos-int8-pit-speaker-output
      - id: dos-int8-vga-screen-save

  - id: dos-int1c-calendar-gated-vga-screen-prank
    for: [dos_com, static-lib]
    desc: DOS virus changes the VGA palette and screen on selected days
    crit: suspicious
    conf: 0.97
    all:
      - id: objectives/impact/infect/binary/dos/interrupt::dos-int1c-vector-install-via-dos
      - id: dos-int1c-day-8-10-gate
      - id: dos-int1c-vga-palette-fade
      - id: dos-int1c-tick-screen-buffer-effect
