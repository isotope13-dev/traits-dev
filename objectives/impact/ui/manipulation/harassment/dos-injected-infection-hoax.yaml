defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_min: 29000
  size_max: 65536
  attack: T1491

traits:
  - id: dos-injected-fake-infection-warning
    desc: Fake DOS infection warning
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: 'This program file is infected by VIRUSMOM.'
  - id: dos-injected-hoax-input-loop
    desc: DOS hoax waits for confirmation key
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'B4 00 CD 16 0C 20 3C 79 75 F6'
  - id: dos-injected-hoax-restore-host
    desc: DOS code restores overwritten host entry
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'BB 00 01 8B 04 89 07 8A 44 02 88 47 02 5A 5E 58 FF E3'

composite_rules:
  - id: dos-injected-infection-warning-hoax
    desc: Injected DOS hoax interrupts host program
    crit: hostile
    conf: 0.99
    near_bytes: 512
    all:
      - id: dos-injected-fake-infection-warning
      - id: dos-injected-hoax-input-loop
      - id: dos-injected-hoax-restore-host
