defaults:
  for: [html]
  platforms: [windows, unix]
traits:
  - id: javascript-uri-endless-popup-loop
    desc: JavaScript URI unbounded blank-popup loop
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'JavaScript:while\(1\)\{\s*var\s+\w+=window\.open\([''"][''"]\);\}'
      exclude_html_comments: true
composite_rules:
  - id: browser-popup-bomb-with-device-crash-probes
    desc: Unbounded popup attempt accompanies repeated device crash probes
    crit: hostile
    conf: 0.99
    all:
      - id: javascript-uri-endless-popup-loop
      - id: objectives/impact/dos/resource::repeated-con-device-image-probes
