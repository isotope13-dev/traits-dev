defaults:
  platforms: [windows]
  for: [pyc]
  attack: T1491

traits:
  - id: pyc-malware-warning
    desc: Bytecode warns it is malware
    crit: notable
    if:
      type: text
      regex: '(?i)(copy of the malware|malicious software)'
  - id: pyc-unusable-warning
    desc: Bytecode warns the machine will be unusable
    crit: notable
    if:
      type: text
      regex: '(?i)(unusable|unbootable) machine'
  - id: pyc-randomized-effects
    desc: Bytecode references randomized effects
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: effects
  - id: pyc-screen-effects
    desc: Bytecode references screen effects
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: screen
  - id: pyc-mouse-shaking
    desc: Bytecode references mouse shaking
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: MouseShaking

composite_rules:
  - id: pyc-disruptive-screen-effects
    desc: Bytecode combines disruption warnings with screen and mouse effects
    crit: hostile
    conf: 0.96
    all:
      - id: pyc-malware-warning
      - id: pyc-unusable-warning
      - id: pyc-randomized-effects
      - id: pyc-screen-effects
      - id: pyc-mouse-shaking
