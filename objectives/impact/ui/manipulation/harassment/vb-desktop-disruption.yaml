# Prank/harassment toolkit in VB: the same module hides the taskbar,
# hides the desktop icons, swaps the mouse buttons and adds either a forced
# hard-error crash or a silent recycle-bin purge. Each primitive has a
# niche legitimate use; together they only serve to disorient the user.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1491.001

composite_rules:
  - id: vb-desktop-harassment-toolkit
    desc: VB hides taskbar and icons and swaps buttons
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/ui/window/enumerate::shell-tray-wnd-class-reference
      - id: micro-behaviors/ui/window/enumerate::desktop-icon-listview-lookup
      - id: micro-behaviors/hardware/input/mouse::vb-swap-mouse-button-declare
    any:
      - id: micro-behaviors/os/event/shutdown::vbasic-harderror-shutdown-response
      - id: micro-behaviors/fs/delete/recycle-bin::vb-sh-empty-recycle-bin-call
