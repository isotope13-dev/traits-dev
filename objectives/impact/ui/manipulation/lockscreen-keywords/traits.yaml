defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: computer-locked-phrase
    desc: '"computer...locked" phrase'
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: (?i)\bcomputer\b.{0,20}\blocked\b
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: no-escape-phrase
    desc: Claims the reader has no escape
    crit: notable
    conf: 0.6
    if:
      type: literal
      regex: '(?i)\b(you have|there is) no escape\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/lib/ui/equinor-eds::equinor-eds-core-react-library
  - id: attempts-expired-phrase
    desc: '"attempts expired" phrase'
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: (?i)attempts expired
  - id: hacked-phrase
    desc: '"hacked" intimidation phrase'
    crit: baseline
    conf: 0.75
    attack: T1491
    count_min: 2
    if:
      type: text
      regex: (?i)\bhacked\b
    not:
      - substr: anti-hack
      - substr: AntiHack
      - substr: HackedBy
      - regex: (?i)hack(er|ing|athon)

composite_rules:
  - id: lockscreen-intimidation-phrases
    desc: Lockscreen intimidation phrase cluster
    crit: notable
    conf: 0.78
    all:
      - id: hacked-phrase
    any:
      - id: computer-locked-phrase
      - id: micro-behaviors/ui/keywords::system-locked-phrase
      - id: no-escape-phrase
      - id: attempts-expired-phrase
