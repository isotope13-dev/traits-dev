defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: computer-locked-phrase
    desc: '"computer...locked" phrase'
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: (?i)\bcomputer\b.{0,20}\blocked\b
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: system-locked-phrase
    desc: '"system...locked" phrase'
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: (?i)\bsystem\b.{0,20}\blocked\b
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: no-escape-phrase
    desc: '"no escape" phrase'
    crit: notable
    conf: 0.6
    if:
      type: text
      # The phrase has to end there (or run into 'from'/'now'): 'no escape
      # sequences' and 'no escape ahead' are terminal-handling prose.
      regex: '(?i)\bno escape([^ \w-]|$| (from|now)\b)'
    not:
      - regex: (?i)\(no [Ee]scape\)
      - regex: (?i)manual \(no [Ee]scape\)
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/lib/ui/equinor-eds::equinor-eds-core-react-library
  - id: attempts-expired-phrase
    desc: '"attempts expired" phrase'
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: (?i)attempts expired
  - id: hacked-phrase
    desc: '"hacked" intimidation phrase'
    crit: baseline
    conf: 0.75
    attack: T1491
    count_min: 2
    if:
      type: text
      regex: (?i)\bhacked\b
    not:
      - substr: anti-hack
      - substr: AntiHack
      - substr: HackedBy
      - regex: (?i)hack(er|ing|athon)

composite_rules:
  - id: lockscreen-intimidation-phrases
    desc: Lockscreen intimidation phrase cluster
    crit: notable
    conf: 0.78
    all:
      - id: hacked-phrase
    any:
      - id: computer-locked-phrase
      - id: system-locked-phrase
      - id: no-escape-phrase
      - id: attempts-expired-phrase
