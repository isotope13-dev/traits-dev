defaults:
  platforms: [windows, unix]
  for: [svg]
composite_rules:
  - id: svg-transparent-click-concealed-navigation
    desc: Transparent SVG click target accompanies concealed navigation
    crit: suspicious
    conf: 0.96
    near_bytes: 1800
    all:
      - id: micro-behaviors/ui/window/click::svg-rectangle-inline-click
      - id: micro-behaviors/ui/window/click::svg-transparent-pointer-target
      - id: objectives/anti-static/obfuscation/document/markup::svg-layered-url-reconstruction
