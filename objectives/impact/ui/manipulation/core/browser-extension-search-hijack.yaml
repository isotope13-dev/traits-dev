# Browser-extension search hijack via webRequest redirect plus tab URL beacon.
# Covers AI-branded (and other) extension infostealers that rewrite SERP
# navigation and exfiltrate browsing telemetry in real time.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1176,T1185,T1041
  mbc: B0030

traits:
  - id: hostname-includes-call
    desc: Branches on URL hostname.includes
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'hostname\.includes\s*\('

  - id: search-engine-google-host
    desc: Google hostname comparison fragment
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["''][^"'']{0,20}google\.'

  - id: search-engine-bing-host
    desc: Bing hostname comparison fragment
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["''][^"'']{0,20}bing\.'

composite_rules:
  - id: search-engine-hostname-gate
    desc: Branches on major search-engine hostname
    crit: notable
    conf: 0.94
    all:
      - id: hostname-includes-call
    any:
      - id: search-engine-google-host
      - id: search-engine-bing-host
    near_bytes: 120

  - id: extension-webrequest-search-redirect
    desc: Extension webRequest redirects search traffic
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/hook/webextension::webrequest-block-or-redirect
      - id: search-engine-hostname-gate
      - id: micro-behaviors/communications/http/redirect::redirect-url-object-field

  - id: extension-webrequest-search-redirect-tab-beacon
    desc: Search redirect extension beacons tab URLs
    crit: hostile
    conf: 0.98
    all:
      - id: extension-webrequest-search-redirect
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-query
      - id: micro-behaviors/communications/http/request/client::http-post-json
    near_bytes: 12000
