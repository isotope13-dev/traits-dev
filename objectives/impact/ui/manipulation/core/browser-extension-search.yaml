defaults:
  platforms: [unix, windows]
  for: [json, chrome-manifest, javascript, typescript, crx]

traits:
  # Text coaching the user through the browser's OWN "an extension changed your
  # search settings" bubble — "click 'Keep it'", "select Keep changes". Chrome
  # shows that prompt so the user can undo a settings takeover; an extension that
  # scripts the user's answer to it is defeating a browser security control, not
  # onboarding. Deliberately phrased around the verb + Keep pair rather than any
  # one vendor's wording so re-skins of the same funnel still match.
  - id: browser-setting-change-keep-prompt-instruction
    desc: Instructs user to accept browser change prompt
    crit: component
    conf: 0.9
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '(?i)(click|select)[\s\S]{0,80}\bkeep\s+(it|changes|them)\b'

  - id: search-url-query-template
    desc: Search URL query template
    crit: component
    conf: 0.9
    for: [json, chrome-manifest]
    if:
      type: value
      path: chrome_settings_overrides.search_provider.search_url
      regex: 'https?://[^"''\s]+([?&](q|query|kw|p)=\{searchTerms\}|/search/\{searchTerms\})'
      case_insensitive: true
  - id: search-branded-provider-host
    desc: Search-branded provider host
    crit: component
    conf: 0.86
    for: [json, chrome-manifest]
    if:
      type: value
      path: chrome_settings_overrides.search_provider.search_url
      regex: 'https?://[^/"'']*\b[a-z0-9-]*search[a-z0-9-]*\b'
      case_insensitive: true
  - id: browser-brand-search-provider-host
    desc: Browser-brand search provider host marker
    crit: component
    conf: 0.9
    for: [json, chrome-manifest]
    if:
      type: value
      path: chrome_settings_overrides.search_provider.search_url
      regex: 'https?://[^/"'']*(chrome[-_]?crx|crx[-_]?store|extension[-_]?store|web[-_]?store)[^/"'']*/'
      case_insensitive: true
    not:
      - regex: '^https?://[^/"'']*\.google\.[^/"'']+/'

  - id: hosted-search-affiliate-url-in-extension-code
    desc: Hosted search affiliate URL in extension code
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html]
    if:
      type: text
      regex: 'https?://[^"''\s]{1,160}/(yhs/)?search\?[^"''\s]{0,160}[?&](hspart|hsimp)='
      case_insensitive: true

  - id: search-provider-redirect-endpoint
    desc: Search provider URL is a redirect endpoint
    crit: suspicious
    conf: 0.9
    for: [json, chrome-manifest]
    attack: T1176
    if:
      # A real engine answers on a search path -- `/search?q=`, `/?q=`. A
      # declared provider whose URL is `/link?`, `/go?` or `/redirect?` is not
      # answering the query at all; it is bouncing it onward, which is where
      # the affiliate tag gets attached and how the user's chosen engine is
      # kept out of the loop. Seen as
      # `earthapp.net/admin/public/link?q={searchTerms}` behind an extension
      # named for a map.
      type: value
      path: chrome_settings_overrides.search_provider.search_url
      regex: '(?i)/(link|go|redirect)\?'

composite_rules:
  # The provider grant plus a destination that only forwards. Either alone is
  # ordinary -- extensions may set a search engine, and redirectors exist --
  # but an extension that takes the default-search grant and spends it on a
  # bounce endpoint is monetizing the query, not serving it.
  - id: search-override-through-redirect-endpoint
    desc: Search override points at a redirect endpoint
    crit: suspicious
    conf: 0.93
    attack: T1176
    scope: archive
    all:
      - id: search-provider-redirect-endpoint
    any:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/manifest::chrome-search-provider-override

  # A default-search override that also ships static redirect rules. The
  # override alone is how an honest search extension works -- the user picks
  # it, the browser asks for confirmation, and queries typed in the omnibox go
  # to the new provider. Redirect rules are for the queries that did *not* go
  # there: searches issued from a page, a sidebar, or another engine the user
  # kept. Shipping both means the takeover is not meant to be escapable.
  - id: search-override-with-redirect-rules
    desc: Search override ships network redirect rules
    crit: suspicious
    conf: 0.93
    attack: T1176
    scope: archive
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
    any:
      - id: micro-behaviors/process/hook/webextension::dnr-redirect-named-ruleset
      - id: micro-behaviors/process/hook/webextension::dnr-redirect-named-ruleset-file

  # The same pair with the monetization evidence attached: the destination is
  # a search-branded host carrying a `{searchTerms}` template and a source tag,
  # so the redirected queries are being sold on.
  - id: monetized-search-override-redirect
    desc: Monetized search override with redirect rules
    crit: suspicious
    conf: 0.95
    attack: T1176
    scope: archive
    all:
      - id: extension-search-monetization
      - id: search-override-with-redirect-rules

  - id: extension-remote-php-navigation-abuse
    desc: Extension cache-busts PHP control endpoint into navigation
    crit: hostile
    conf: 0.98
    attack: T1176,T1071.001
    for: [javascript]
    all:
      - id: objectives/supply-chain/hidden-payload/extensions/backdoor::extension-remote-window-open-backdoor
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-script
      - id: micro-behaviors/communications/http/request/url::fetch-no-store-cache

  - id: extension-conditional-navigation-hijack
    desc: Extension hijacks navigation and reports it
    crit: hostile
    conf: 0.98
    attack: T1185,T1041,T1176
    for: [javascript, typescript]
    near_bytes: 3000
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-webnavigation-before-navigate
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-update-with-url
      - id: micro-behaviors/communications/http/url/path::js-url-host-read
      - id: micro-behaviors/communications/http/request/client::http-post-json
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url

  - id: browser-extension-install-active-tab-redirect
    desc: Extension redirects active tab on install
    crit: suspicious
    conf: 0.96
    attack: T1176
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-installed
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-update
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::extension-affiliate-tracking-parameter

  # A default search override that also rewrites the provider's requests with
  # declarativeNetRequest query parameters changes browser search traffic after
  # installation. This is the authority-plus-behavior combination to flag; the
  # manifest setting alone remains a notable capability.
  - id: extension-search-override-dnr-param-injection
    desc: Search override injects DNR query parameters
    crit: hostile
    conf: 0.97
    attack: T1176,T1185
    scope: archive
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: micro-behaviors/process/hook/webextension::dnr-query-parameter-transform

  # A runtime-installed DNR rule that redirects main-frame search requests to
  # an external HTTP endpoint is direct browser traffic hijacking. The
  # external-target leg prevents a local-search extension from being convicted
  # for routing its own loopback search page through an extension resource.
  - id: runtime-search-dnr-hijack
    desc: Extension redirects main-frame search traffic externally
    crit: hostile
    conf: 0.98
    attack: T1176,T1185
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/hook/webextension::declarative-net-request-update
      - id: micro-behaviors/communications/http/dynamic::dnr-main-frame-search-redirect
      - id: micro-behaviors/communications/http/dynamic::dnr-external-redirect-target

  # Search hijacker that keeps its takeover by scripting the user's answer to the
  # browser's revert prompt: it overrides the default search provider, then a
  # content script blankets the page with a full-viewport overlay whose only text
  # tells the user to click the browser's own "Keep it" button. Chrome shows that
  # bubble precisely so a settings takeover can be undone, so darkening the page
  # and pointing at it is deception aimed at a security control — hostile, and a
  # clear step beyond the merely-unwanted PUP line in newtab-override-promo-lifecycle.
  # Gated on the search-override authority so ordinary onboarding tours, cookie
  # banners and paywalls (overlay + "keep" prose, no hijack) cannot match.
  - id: search-override-keep-changes-coercion
    desc: Search override coerces browser keep-changes prompt
    crit: hostile
    conf: 0.95
    attack: T1176
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: browser-setting-change-keep-prompt-instruction
      - id: micro-behaviors/ui/window/manage/style::fixed-viewport-style

  # Search-override extension tags both its install navigation and uninstall
  # callback with a generated client identifier. This is lifecycle attribution
  # coupled to a browser-setting change, but it does not prove that search
  # queries themselves carry the identifier.
  - id: search-override-lifecycle-client-id
    desc: Search override tags lifecycle URLs with client ID
    crit: suspicious
    conf: 0.92
    attack: T1176
    scope: archive
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: objectives/collection/monitor/tracking::extension-client-id-lifecycle-navigation

  - id: extension-search-monetization
    desc: Browser extension search monetization
    # Affiliate monetization is privacy/UX-relevant, but an honest consented
    # search extension is not malware without an additional abuse signal.
    crit: notable
    conf: 0.9
    scope: archive
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: search-url-query-template
      - id: search-branded-provider-host
      - id: objectives/collection/activity/browser::extension-persistent-affiliate-tracking

  # A provider that claims to be Google but points the browser at a
  # browser-store-branded host is deceptive default-search takeover behavior.
  # The host marker is deliberately separate from the neutral default-provider
  # capability so ordinary search extensions remain notable rather than hostile.
  - id: google-branded-offsite-search-takeover
    desc: Google-branded offsite default search takeover
    crit: hostile
    conf: 0.98
    attack: T1176
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/identity::chrome-search-provider-google-name
      - id: browser-brand-search-provider-host

  # A declared default provider carrying syndication parameters is a visible
  # monetisation behavior, but it is not by itself a search hijack.  Keep this
  # in the UI/search objective so benign, user-installed search extensions are
  # represented accurately while the hostile composites below retain their
  # additional abuse requirements.
  - id: extension-default-search-affiliate-provider
    desc: Default search provider uses affiliate parameters
    crit: notable
    conf: 0.93
    scope: archive
    for: [crx, xpi, zip, archives]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
    any:
      - id: search-url-affiliate-marker
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::search-monetization-query-param
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::search-source-query-param
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::search-referrer-attribution-query-param

  - id: search-url-affiliate-marker
    desc: Search URL carries hosted affiliate marker
    crit: notable
    conf: 0.9
    all:
      - id: search-url-query-template
    any:
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::yahoo-hosted-search-param
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::affiliate-partner-query-param
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::affiliate-id-query-param

  # A default-search extension whose own search page routes queries through a
  # hosted affiliate URL has a concrete, user-visible navigation behavior. A
  # homepage search form can legitimately do this, so this is notable; hostile
  # search takeover rules require an additional coercion, broad authority,
  # request-rewrite, or tracking signal.
  - id: extension-search-provider-affiliate-navigation
    desc: Extension homepage routes searches to affiliate provider
    crit: notable
    conf: 0.93
    scope: archive
    for: [javascript, typescript]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: hosted-search-affiliate-url-in-extension-code
      - id: micro-behaviors/ui/window/manage/dom::browser-location-href-assign

  # A default-search takeover that also has all-host access and persists
  # affiliate identifiers is materially riskier than an ordinary alternative
  # search provider: it can rewrite arbitrary browsing traffic while retaining
  # the monetisation identity across sessions.
  - id: broad-authority-search-affiliate-takeover
    desc: Broad-host search takeover with persistent affiliate tracking
    crit: suspicious
    conf: 0.94
    attack: T1176
    scope: archive
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/host::broad-host-access
      - id: objectives/collection/activity/browser::extension-persistent-affiliate-tracking

  # A default-search takeover that also reads cross-site cookies and sends
  # persistent affiliate/session telemetry is a tracking payload, not merely a
  # user-selected alternative search provider.
  - id: search-takeover-cookie-telemetry
    desc: Search takeover reads cookies for remote tracking telemetry
    crit: hostile
    conf: 0.98
    attack: T1176,T1539,T1041
    scope: archive
    # Run against a JavaScript child; scope: archive then joins it to the
    # manifest.  The outer XPI/ZIP node has no child symbols or manifest
    # values available to its own rule evaluation.
    for: [javascript, typescript]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/host::broad-host-access
      - id: metadata/permission/cookie::permission-cookies
      - id: objectives/collection/activity/browser::extension-persistent-affiliate-tracking
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get-all
      - id: micro-behaviors/communications/http/request/client::image-src-network-request

  - id: tracked-browser-extension-search-hijacker
    desc: Tracked browser extension search hijacker
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: extension-search-monetization
      - id: extension-persistent-lifecycle-tracking

  - id: extension-persistent-lifecycle-tracking
    desc: Persistent extension lifecycle tracking
    crit: component
    conf: 0.97
    all:
      - id: extension-persistent-cookie-access
      - id: micro-behaviors/browser-extension/lifecycle::runtime-set-uninstall-url
    any:
      - id: objectives/collection/monitor/tracking::extension-uninstall-feedback-url
      - id: objectives/collection/monitor/tracking::extension-install-no-cors-ping
      - id: micro-behaviors/browser-extension/lifecycle::uninstall-tracking

  - id: extension-persistent-cookie-access
    desc: Persistent extension cookie access pattern
    crit: component
    conf: 0.97
    all:
      - id: objectives/collection/monitor/tracking::extension-uid-cookie-name
      - id: objectives/collection/monitor/tracking::extension-uid-sync-storage
      - id: objectives/collection/monitor/tracking::extension-cookie-expiration-field
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-set
    any:
      - id: objectives/collection/monitor/tracking::extension-cookie-change-listener
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get

  - id: tracked-newtab-search-redirect
    desc: Tracked new tab search redirect
    crit: hostile
    conf: 0.95
    attack: T1176
    for: [crx, xpi, zip]
    scope: archive
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::runtime-search-query-redirect
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::runtime-search-q-input-value
    any:
      - id: micro-behaviors/communications/http/url/query::token-query-parameter
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::runtime-search-affiliate-param
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::runtime-search-tracking-parameter
      - id: micro-behaviors/communications/http/url/query::search-source-query-parameter

  # Promotional new-tab lifecycle behavior: override NTP, open a promo tab on
  # install, and register an uninstall URL. This is a clear monetisation
  # behavior worth surfacing, but it is not hostile without search hijacking,
  # deception, theft, or another concrete user-harm signal.
  - id: newtab-override-promo-lifecycle
    desc: New-tab override with campaign-tracked install/uninstall navigation
    crit: notable
    conf: 0.96
    attack: T1176
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: micro-behaviors/browser-extension/tabs::install-https-tab-open
      - id: micro-behaviors/browser-extension/lifecycle::runtime-set-uninstall-url
    any:
      - id: micro-behaviors/communications/http/url/query::utm-source-medium-campaign-url
      - id: micro-behaviors/communications/http/url/domain::js-game-promotion-url

  # Relocated from supply-chain/hidden-payload/extensions/affiliate, where it was
  # hostile. Fetching a vendor's own "more extensions" list and rendering it as
  # links to official Chrome Web Store listings is ordinary publisher
  # cross-promotion: the panel is user-opened, the payload is JSON data (name /
  # url / image) rendered via text and attribute assignment rather than code,
  # the links carry no affiliate or tracking parameters, and none of it requires
  # host permissions or a content script. Every leg is benign-shaped, so hostile
  # convicted every wallpaper/new-tab pack that advertises its publisher's other
  # extensions.
  #
  # Notable, not suspicious: unlike the campaign-tracked sibling above there is
  # no attribution parameter or forced lifecycle navigation here, so this does
  # not even reach the PUP-monetisation bar. It stays worth surfacing because
  # the catalog is remote-controlled — the vendor can change every promoted link
  # after review. Genuine new-tab abuse (default-search override, monetised
  # search redirects, persistent tracking) keeps its own hostile composites.
  - id: newtab-remote-promo-catalog
    desc: New-tab fetches remote extension promo catalog
    crit: notable
    conf: 0.95
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: micro-behaviors/communications/http/url/path::remote-extension-catalog-url
      - id: micro-behaviors/communications/http/url/domain::chrome-webstore-detail-url
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/client::http-client

  # A named new-tab publisher that opens an install-time promotional tab and
  # installs an uninstall landing page is a clear monetisation signal. Keep the
  # family identity leg so ordinary extensions with optional onboarding pages
  # do not match, but keep the result notable: the lifecycle is declared and
  # does not itself establish deception, theft, or another hostile objective.
  #
  # The publisher leg is a directory reference to the recognized
  # newtab-wallpaper-adware families (Owhit, Gameograf, …) rather than a
  # hardcoded pair, so the identity remains useful across publisher variants.
  # The lifecycle legs supply the promo behaviour.
  - id: named-newtab-promo-lifecycle
    desc: Named new-tab publisher uses promo lifecycle
    crit: notable
    conf: 0.96
    attack: T1176
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: micro-behaviors/browser-extension/tabs::install-https-tab-open
      - id: micro-behaviors/browser-extension/lifecycle::runtime-set-uninstall-url
      - id: well-known/unwanted/newtab-wallpaper-adware

  # REMOVED: `campaign-tracked-newtab-search-hijack` (was hostile).
  #
  # Its legs were exactly `newtab-override-promo-lifecycle` plus
  # `chrome-search-query`, and it asserted "search hijack" in its own id while
  # no leg ever checked that the search destination had been changed — no
  # `chrome_settings_overrides.search_provider`, no monetised SERP host, no
  # affiliate parameter on the query.
  #
  # `chrome.search.query()` is the *sanctioned* API that hands the query to
  # whatever engine the user already configured; it is the recommended
  # alternative to overriding the search provider. Its presence is evidence
  # against hijacking, so it cannot upgrade a PUP-lifecycle pattern to hostile.
  # A new-tab wallpaper page carrying a search box is the defining feature of
  # that category, not an attack. The UTM tags in these samples sit on the
  # install/uninstall promo tabs, not on the search — which is precisely what
  # `newtab-override-promo-lifecycle` (suspicious) already describes, so this
  # composite also double-counted one behaviour.
  #
  # Genuine search takeover keeps its dedicated hostiles, all of which require a
  # real override or paid redirect: extension-search-newtab-takeover,
  # extension-monetized-search-newtab-hijack,
  # runtime-tracked-newtab-search-extension. The ordinary default-provider and
  # homepage-affiliate cases are surfaced by the notable composites above.

  # Promotional navigation, not telemetry: opens a third-party game-site tab on
  # the install/uninstall lifecycle. The behavior is notable, but not hostile
  # without evidence of deception, theft, or other user harm.
  - id: extension-lifecycle-external-game-promotion
    desc: Extension promotes game sites on install/uninstall
    crit: notable
    conf: 0.97
    attack: T1176
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-installed
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-create
      - id: micro-behaviors/browser-extension/lifecycle::runtime-set-uninstall-url
    any:
      - id: micro-behaviors/communications/http/url/domain::js-game-promotion-url
      - id: micro-behaviors/communications/http/url/domain::html-game-link-catalog

  - id: extension-install-game-promotion
    desc: Extension opens game promotion on install
    crit: notable
    conf: 0.97
    attack: T1176
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-installed
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-create
      - id: micro-behaviors/communications/http/url/domain::js-game-promotion-url
    unless:
      # Ad lists contain game URLs, while this known blocker opens its own
      # settings page on install; do not infer promotion from that pair.
      - id: metadata/package/quality/benign-context::adblock-extension-id

  - id: extension-uninstall-game-promotion
    desc: Extension redirects uninstall to game promotion
    crit: notable
    conf: 0.97
    attack: T1176
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: micro-behaviors/browser-extension/lifecycle::runtime-set-uninstall-url
      - id: micro-behaviors/communications/http/url/domain::js-game-promotion-url

  - id: forced-newtab-game-campaign
    desc: Forced tracked game promotion on new-tab lifecycle
    # These legs establish a monetized promotion forced by the extension's
    # new-tab/install lifecycle. They do not establish search hijacking,
    # tracking, theft, or deception, so keep this at the PUP/notable bar.
    crit: notable
    conf: 0.97
    attack: T1176
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: micro-behaviors/browser-extension/tabs::install-https-tab-open
      - id: micro-behaviors/browser-extension/lifecycle::runtime-set-uninstall-url
      - id: micro-behaviors/communications/http/url/domain::js-game-promotion-url
      - id: micro-behaviors/communications/http/url/query::utm-source-medium-campaign-url

  # A lifecycle redirect to a .click destination is hostile only when the
  # extension also holds authority to hijack or observe the browser (new-tab /
  # search override, broad host access, programmatic injection, content-script
  # into all sites, or request interception). Without any of those, opening a
  # promo/feedback tab on install/uninstall — even to a .click domain — is the
  # ordinary onboarding of a sandboxed, zero-permission casual-game extension,
  # not a redirect abuse. The `any:` discriminator keeps real new-tab/search
  # hijackers (which carry that authority) while clearing benign game promos.
  - id: abused-domain-lifecycle-redirect
    desc: Hijack-authority extension opens abused-TLD lifecycle URL
    crit: hostile
    conf: 0.97
    attack: T1176
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-installed
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-startup
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-create
      - id: micro-behaviors/browser-extension/lifecycle::runtime-set-uninstall-url
      - id: objectives/command-and-control/infrastructure/domain/abused-tlds::tld-click
    any:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::chrome-search-provider-override
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: metadata/permission/manifest::permission-all-urls
      - id: metadata/permission/manifest::permission-scripting
