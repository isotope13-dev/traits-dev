  # An overridden new tab whose link targets arrive from a publisher endpoint
  # and are interpolated straight into page markup means the publisher decides,
  # at any moment after store review, where every new-tab click sends the user.
  # The shipped bundle looks static; the surface the user actually sees is a
  # live, remotely-swappable ad slot. Separate from `newtab-remote-promo-
  # catalog`, which only observes that a catalog is fetched — this one requires
  # the fetched values to reach a markup sink.
  - id: newtab-remote-controlled-link-injection
    desc: Remote catalog drives overridden new-tab links
    crit: suspicious
    conf: 0.93
    attack: T1176
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
    any:
      # Either sink puts the publisher in control of the click target: markup
      # interpolation, or a direct write to the link attribute.
      - id: micro-behaviors/communications/http/request/json::external-json-near-dynamic-innerhtml
      - id: micro-behaviors/communications/http/request/json::external-json-to-link-target

  # The takeover plus its receipt. An extension that seizes the default engine,
  # tags every query with a traffic-source parameter, and ships a content
  # script whose only job is to flag its own presence on the destination's
  # pages is not offering a search engine — it is proving deliveries to
  # whoever is paying for the placement. All three legs are manifest- or
  # source-level facts, so a re-skin under a new brand and domain still matches.
  - id: search-override-install-attribution-funnel
    desc: Search takeover reports installs to its provider
    crit: suspicious
    conf: 0.94
    scope: archive
    for: [crx, xpi, zip, archives]
    attack: T1176
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::search-referrer-attribution-query-param
    any:
      - id: micro-behaviors/ui/window/manage/state::document-root-presence-flag
      - id: micro-behaviors/ui/window/manage/state::document-root-presence-attribute

  # The manifest repeating one destination in every field it has: the provider
  # name, the omnibox keyword written as that host, and a query URL carrying the
  # attribution parameter that gets it paid. Nothing here is about which brand
  # is being pushed, only that the extension has no purpose other than pushing
  # it.
  - id: search-override-self-branded-destination
    desc: Search override brands itself as its destination
    crit: suspicious
    conf: 0.92
    scope: archive
    for: [crx, xpi, zip, archives, json, chrome-manifest]
    attack: T1176
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::search-provider-keyword-is-domain
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::search-referrer-attribution-query-param
