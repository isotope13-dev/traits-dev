defaults:
  platforms: [android]
  for: [apk, zip, xml]
  attack: T1491

traits:
  - id: android-leska-wallpaper-resource
    desc: Leska locker wallpaper resource
    crit: component
    conf: 0.9
    if:
      type: text
      substr: "res/drawable-xhdpi-v4/leska.png"
      offset_range: [-262144, null]

composite_rules:
  - id: android-device-admin-password-lockout
    desc: Accessibility service changes device unlock password
    crit: hostile
    conf: 0.99
    attack: T1624
    for: [java, kotlin]
    all:
      - id: micro-behaviors/os/privilege/manifest::add-device-admin-action
      - id: micro-behaviors/os/privilege/elevation::android-device-policy-manager-import
      - id: micro-behaviors/os/privilege/elevation::android-device-policy-reset-password
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source

  - id: android-blocklock-resource-set
    desc: Android blocklock resource set
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/hardware/display/screen::android-blocklock-layout
      - id: android-leska-wallpaper-resource

  - id: android-blocklock-apk
    desc: Android blocklock screen locker
    crit: hostile
    conf: 0.95
    mbc: B0033
    for: [apk, zip]
    all:
      - id: android-blocklock-resource-set
      - id: metadata/signed/platform::android-debug-testkey-signature
      - id: metadata/package/files/mobile-package::apk-secondary-dex

  - id: android-overlay-wallpaper-tamper
    desc: Android overlay changes wallpaper
    crit: suspicious
    conf: 0.94
    for: [apk, zip]
    all:
      - id: micro-behaviors/ui/window/manage/overlay::runtime-overlay-window
      - id: micro-behaviors/os/privilege/manifest::set-wallpaper
      - id: micro-behaviors/ui/wallpaper::set-android-wallpaper

  - id: android-overlay-screen-locker
    desc: Android overlay screen locker
    crit: hostile
    conf: 0.97
    mbc: B0033
    for: [apk, zip]
    all:
      - id: micro-behaviors/ui/window/manage/overlay::runtime-overlay-window
      - id: micro-behaviors/hardware/display/screen::android-blocklock-layout
    any:
      - id: android-overlay-wallpaper-tamper
      - id: micro-behaviors/ui/wallpaper::set-android-wallpaper

  # Accessibility-driven lock overlays (start/stop/status*lockoverlay) are
  # used by bankers to freeze the UI while phishing HTML loads. Distinct
  # from SYSTEM_ALERT_WINDOW-based runtime-overlay-window.
  - id: android-accessibility-lock-overlay
    desc: Android accessibility lock-overlay controls
    crit: hostile
    conf: 0.96
    attack: T1411,T1417.001
    mbc: B0033
    for: [apk, zip]
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-config
      - id: micro-behaviors/ui/window/manage/overlay::lock-overlay-control-helpers
    any:
      - id: micro-behaviors/os/privilege/manifest::device-admin-receiver-class
      - id: micro-behaviors/os/privilege/manifest::add-device-admin-action
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-settings-intent

  - id: android-accessibility-lock-overlay-source
    desc: Accessibility service drives lock-overlay helpers
    crit: hostile
    conf: 0.97
    attack: T1411,T1417.001
    mbc: B0033
    for: [java, kotlin]
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: micro-behaviors/ui/window/manage/overlay::lock-overlay-control-helpers
      - id: micro-behaviors/ui/window/manage/overlay::android-source-runtime-overlay-window
    any:
      - id: micro-behaviors/os/privilege/manifest::add-device-admin-action
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-settings-intent
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-text-extraction
    needs: 1

  # Banking/spyware control triad visible in AndroidManifest alone: accessibility
  # service binding, device-admin binding, and SYSTEM_ALERT_WINDOW overlays.
  # Legitimate accessibility helpers almost never also take device-admin plus
  # draw-over-apps; bankers need all three for OTP theft and UI freeze.
  - id: android-accessibility-admin-overlay-control
    desc: Android accessibility admin overlay control triad
    crit: hostile
    conf: 0.97
    attack: T1411,T1624,T1417.001
    mbc: B0033
    all:
      - id: micro-behaviors/os/privilege/manifest::bind-accessibility-service
      - id: micro-behaviors/os/privilege/manifest::bind-device-admin
      - id: micro-behaviors/os/privilege/manifest::system-alert-window
    any:
      - id: micro-behaviors/os/privilege/manifest::bind-input-method
      - id: micro-behaviors/os/privilege/manifest::device-admin-enabled-action
      - id: micro-behaviors/os/privilege/manifest::media-projection-service-type
    needs: 1

  - id: android-prank-wallpaper-media-bundle
    desc: Android prank media bundle
    crit: suspicious
    conf: 0.94
    for: [apk, zip]
    all:
      - id: micro-behaviors/data/embedded/media::apk-short-raw-mp3-resource
      - id: micro-behaviors/data/embedded/media::apk-short-drawable-image-resource
      - id: metadata/package/files/mobile-package::apk-secondary-dex
      - id: metadata/signed/platform::android-debug-testkey-signature

  - id: android-cheat-lure-prank-media-bundle
    desc: Android cheat lure prank media bundle
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/evasion/decoy/lure::android-russian-cheat-lure-label
      - id: micro-behaviors/data/embedded/media::apk-fff-raw-mp3-resource
      - id: micro-behaviors/data/embedded/media::apk-aaa-drawable-resource
      - id: micro-behaviors/data/embedded/media::apk-lll-drawable-resource
      - id: metadata/package/files/mobile-package::apk-secondary-dex
      - id: metadata/signed/platform::android-debug-testkey-signature

  - id: android-wallpaper-audio-vibration-prank
    desc: Android wallpaper audio vibration prank
    crit: hostile
    conf: 0.95
    mbc: B0033
    all:
      - id: micro-behaviors/ui/wallpaper::set-android-wallpaper
      - id: micro-behaviors/hardware/input/audio::android-raw-media-playback
      - id: micro-behaviors/hardware/input/vibration::android-vibrator-control
      - id: micro-behaviors/data/embedded/media::apk-short-drawable-image-resource
      - id: metadata/package/files/mobile-package::apk-secondary-dex
      - id: metadata/signed/platform::android-debug-testkey-signature

  - id: android-kiosk-harassment-locker
    desc: Android kiosk harassment locker
    crit: hostile
    conf: 0.96
    mbc: B0033
    all:
      - id: micro-behaviors/ui/window/manage/overlay::kiosk-ui-control
      - id: micro-behaviors/hardware/input/vibration::android-vibrator-control
      - id: micro-behaviors/hardware/input/audio::android-media-player-reference
    any:
      - id: micro-behaviors/os/clipboard/access::clipboard-manager
      - id: micro-behaviors/ui/wallpaper::set-android-wallpaper
      - id: micro-behaviors/os/clipboard/access-native::set-primary-clip

  - id: android-rich-push-url-clipboard-control
    desc: Android rich push controls URL clipboard
    crit: suspicious
    conf: 0.95
    ref: sha256:f6a1d7acbd59c261bfad7ee5b42e584ab1f381c1da7647fe7194aa8db0542872
    scope: archive
    for: [npm, zip, tar]
    all:
      - id: micro-behaviors/ui/window/notify/message::android-notification-action-routing
      - id: micro-behaviors/os/message/intent::android-uri-start-activity
      - id: micro-behaviors/os/clipboard/access-native::set-primary-clip
