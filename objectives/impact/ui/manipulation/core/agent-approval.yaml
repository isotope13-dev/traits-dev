# Automatic approval of agent and terminal actions through an IDE webview.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: "T1059.007,T1204.001"

traits:
  - id: approval-button-label-set
    desc: IDE approval and execution labels
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)acceptPatterns\s*=\s*\[[\s\S]{0,600}["''](run|execute|allow)["'']'

  - id: command-approval-context-filter
    desc: Checks command text before approval
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?s)findNearbyCommandText.{0,800}isCommandBanned'

composite_rules:
  - id: vscode-agent-action-auto-approval
    desc: VS Code extension auto-approves agent actions
    crit: hostile
    conf: 0.99
    for: [javascript, typescript, archives]
    scope: archive
    all:
      - id: metadata/library/vscode::vscode-extension-marker
      - id: approval-button-label-set
      - id: command-approval-context-filter
      - id: micro-behaviors/ui/window/manage/dom::dom-dispatch-click-call
