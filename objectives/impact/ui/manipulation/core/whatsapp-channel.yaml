# Authenticated WhatsApp-session manipulation.
# Baileys forks can act through a paired session without stealing a static
# token.  The composites below identify autonomous channel growth and covert
# message metadata changes from their protocol-level code shapes.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1491

composite_rules:
  - id: autonomous-whatsapp-newsletter-follow
    desc: Automatically follows a WhatsApp newsletter on session open
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-jid
      - id: micro-behaviors/communications/messaging/channel::whatsapp-connection-update-handler
      - id: micro-behaviors/communications/messaging/channel::whatsapp-connection-open-branch
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-query
    near_bytes: 12000

  - id: remote-whatsapp-newsletter-follow-and-mute
    desc: Remotely controlled WhatsApp newsletter follow with concealment
    crit: hostile
    conf: 0.99
    all:
      - id: autonomous-whatsapp-newsletter-follow
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-mute-query
    near_bytes: 16000

  - id: obfuscated-whatsapp-media-source-url
    desc: Obfuscated sourceUrl in outgoing WhatsApp media
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-media-payload-type
      - id: micro-behaviors/communications/messaging/channel::whatsapp-media-source-url
      - id: micro-behaviors/communications/messaging/channel::whatsapp-obfuscated-media-source-url
    near_bytes: 12000

  - id: whatsapp-newsletter-attribution-self-sync-suppression
    desc: Newsletter attribution with self-sync suppression
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-forwarded-newsletter-attribution
      - id: micro-behaviors/communications/messaging/channel::whatsapp-no-self-sync
    near_bytes: 6000
