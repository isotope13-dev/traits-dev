defaults:
  platforms: [windows, unix]
  for: [java]
  attack: T1499

traits:
  - id: java-infinite-loop-source
    desc: Java infinite loop source
    crit: component
    conf: 0.82
    if:
      type: text
      regex: 'while\s*\(\s*true\s*\)'

composite_rules:
  - id: java-infinite-robot-keypress
    desc: Java infinite Robot keypress loop
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/hardware/input/robot::java-awt-robot-import
      - id: micro-behaviors/hardware/input/keyboard/robot::java-robot-keypress
      - id: java-infinite-loop-source
    unless:
      - id: metadata/package/testing/presence/platform_suites::java-generic-test-directory
      - id: metadata/package/testing/presence/harness::test-directory-path
