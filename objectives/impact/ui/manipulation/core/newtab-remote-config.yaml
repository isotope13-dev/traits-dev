# A new-tab extension that keeps a live line back to its publisher.
#
# Overriding the new tab is not itself abuse, and neither is fetching data —
# weather widgets and news panels do both. What separates the monetised farms
# from those is the *combination*: the page the user sees on every new tab is
# filled from an endpoint the publisher can change at will, that endpoint is
# re-read on a timer rather than once at install, and both ends of the
# extension's lifecycle navigate to the publisher's own attributed landing
# pages. The reviewed bundle is then a shell — whatever the store approved
# says nothing about what the page shows a week later.
#
# Deliberately suspicious, not hostile. There is no code execution, credential
# access, or destruction here; the harm is that the content is unreviewable.
# The hostile ratings in this directory stay reserved for extensions that
# redirect searches, steal, or deceive outright — see the reasoning recorded in
# browser-extension-search.yaml before promoting anything here.
defaults:
  platforms: [windows, unix]
  for: [crx, xpi, zip]
  attack: T1176

composite_rules:
  - id: newtab-scheduled-remote-content-refresh
    desc: New-tab page refreshed from remote endpoint
    crit: suspicious
    conf: 0.92
    scope: archive
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      # Both ends of the lifecycle steer to the publisher's landing page —
      # this is a monetised placement, not a utility that happens to update.
      - id: micro-behaviors/browser-extension/lifecycle::extension-install-uninstall-lifecycle-urls
      # Re-read on a schedule, so the content is not fixed at review time.
      - id: micro-behaviors/time/schedule/webextension::chrome-alarms-create
      - id: micro-behaviors/browser-extension/lifecycle::extension-lifecycle-network-request
    any:
      - id: micro-behaviors/communications/http/url/path::remote-extension-catalog-url
      - id: micro-behaviors/communications/http/url/query::utm-source-medium-url

  # The same live line back to the publisher, held open by a client-side cache
  # instead of a `chrome.alarms` timer.
  #
  # `newtab-scheduled-remote-content-refresh` above keys the "re-read on a
  # schedule" leg on the alarms API, which is only one way to write it. Storing
  # the catalog with a timestamp and re-fetching once a TTL has elapsed is the
  # commoner spelling — it needs no permission, survives service-worker
  # restarts, and reads as an ordinary performance cache. The exposure is
  # identical: what the new tab shows is decided after review, by the endpoint.
  #
  # `cache: "no-store"` on the request is what distinguishes a publisher
  # refresh from a genuine performance cache; the code goes out of its way to
  # bypass the HTTP cache it just reimplemented, because the point is
  # freshness of the publisher's choice, not speed.
  - id: newtab-ttl-cached-remote-catalog
    desc: New-tab re-reads a publisher catalog on a TTL
    crit: suspicious
    conf: 0.93
    scope: archive
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: micro-behaviors/browser-extension/lifecycle::extension-install-uninstall-lifecycle-urls
      - id: micro-behaviors/communications/http/url/path::remote-extension-catalog-url
      - id: micro-behaviors/communications/http/request/url::fetch-no-store-cache
      - id: micro-behaviors/time/timing/check::js-cache-freshness-check
