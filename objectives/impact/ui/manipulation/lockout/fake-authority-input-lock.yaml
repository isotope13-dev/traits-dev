# A full-screen notice that claims the machine was seized by an authority, paired
# with a Windows hook that installs, forwards and removes a hook chain, is a
# locker: it presents a fake legal demand and takes input focus. Each leg alone
# is common. A legal notice can appear in documentation, and hook chains serve
# accessibility and shell tools. The composite requires both in one file.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1491

composite_rules:
  - id: fake-authority-seizure-input-lock
    desc: Seizure notice with Windows hook lifecycle lock
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/ui/keywords::seized-notice-phrase
      - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
