defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
traits:
composite_rules:
  - id: screen-overlay-lockout
    desc: Combines shaped-region and cancelable-window APIs
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/ui/window/region::create-elliptic-rgn
      - id: micro-behaviors/ui/window/region::set-window-rgn
      - id: micro-behaviors/ui/window/event::dotnet-cancel-event-args
  - id: anti-capture-overlay-lockout
    desc: Topmost overlay with capture exclusion and close prevention
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/ui/window/region::window-anti-capture-affinity
    any:
      - id: micro-behaviors/ui/window/visibility::topmost-window
      - id: micro-behaviors/ui/window/visibility::borderless-window
      - id: micro-behaviors/ui/window/visibility::no-taskbar-window
      - id: micro-behaviors/ui/window/event::dotnet-cancel-event-args
      - id: micro-behaviors/hardware/display/screenshot::dotnet-copyfromscreen-capture
    needs: 3
