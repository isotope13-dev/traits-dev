defaults:
  platforms:
    - linux
    - macos
    - windows

traits:
  - id: screensaver-engine
    desc: macOS ScreenSaver control
    crit: notable
    conf: 0.8
    attack: T1491
    for:
      - macho
      - shell
    if:
      type: text
      substr: ScreenSaverEngine
    downgrade:
      any:
        - id: metadata/binary/vendor/
        - id: metadata/signed/platform::apple
        - id: metadata/vendor/identity::apple-what-version-banner
    unless:
      - id: well-known/tool/reverse-engineering/frida/
