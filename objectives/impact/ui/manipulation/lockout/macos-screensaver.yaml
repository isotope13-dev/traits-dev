defaults:
  platforms:
    - linux
    - macos
    - windows

traits:
  - id: screensaver-engine
    desc: macOS ScreenSaver control
    crit: notable
    conf: 0.8
    attack: T1491
    for:
      - macho
      - shell
    if:
      type: text
      substr: ScreenSaverEngine
    downgrade:
      any:
        - id: metadata/signature/verified/platform::apple
        - id: metadata/vendor/identity::apple-what-version-banner
