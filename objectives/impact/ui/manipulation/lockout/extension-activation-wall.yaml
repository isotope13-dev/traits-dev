# An all-site content script that covers pages with a top-layer panel, locks
# page scrolling, and only removes itself when a hardcoded code is typed in:
# the visited site is held hostage behind the extension's "activation" wall.
defaults:
  platforms: [windows, unix]
  attack: T1176,T1491.002

composite_rules:
  - id: content-script-hardcoded-code-site-wall
    desc: All-site extension locks pages behind a hardcoded-code overlay
    crit: hostile
    conf: 0.95
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript]
    all:
      - id: metadata/permission/host::broad-content-script-matches
      - id: micro-behaviors/ui/window/form-input::input-value-hardcoded-code-compare
      - id: micro-behaviors/ui/window/style::browser-dom-overflow-suppressed
      - id: objectives/impact/ui/manipulation/interstitial::top-layer-z-index
