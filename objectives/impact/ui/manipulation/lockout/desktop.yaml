defaults:
  platforms:
  - windows
  for:
  - scripts
  - binaries
  attack: T1565.001
traits: []
composite_rules:
- id: shell-removed
  desc: Removes the Windows shell from the session
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/process/terminate/command::taskkill-explorer-force
  - id: micro-behaviors/ui/window/enumerate::python-enumerates-top-level-windows
  - id: objectives/impact/degrade/system/file::batch-deletes-explorer-exe
- id: desktop-input-lockout
  desc: Blocks user input and removes the Windows shell
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/hardware/input/block::input-suppression-api-reference
  - id: shell-removed
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool
- id: input-lockout-forced-shutdown
  desc: Blocks user input then forces a shutdown
  crit: suspicious
  conf: 0.9
  attack: T1529
  all:
  - id: micro-behaviors/hardware/input/block::input-suppression-api-reference
  any:
  - id: objectives/impact/system/shutdown/
  - id: micro-behaviors/os/event/shutdown::source-shutdown-command
- id: taskmgr-policy-keyboard-hook-lock
  desc: Keyboard hook with Task Manager disabled
  crit: hostile
  conf: 0.96
  attack: T1562.001,T1056.001
  for:
  - pe
  - dll
  all:
  - id: micro-behaviors/os/registry/write::taskmgr-policy-write-api-cooccurrence
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
  unless:
  - id: metadata/signed/platform/
