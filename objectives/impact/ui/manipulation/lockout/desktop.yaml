defaults:
  platforms:
  - windows
  for:
  - scripts
  - binaries
  attack: T1565.001
traits: []
composite_rules:
- id: desktop-input-lockout
  desc: Blocks user input and removes the Windows shell
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/hardware/input/block::input-suppression-api-reference
  any:
  - id: micro-behaviors/process/terminate/target::explorer-taskkill-execution-clues
  - id: objectives/impact/degrade/system/file::batch-deletes-explorer-exe
- id: input-lockout-forced-shutdown
  desc: Blocks user input then forces a shutdown
  crit: suspicious
  conf: 0.9
  attack: T1529
  all:
  - id: micro-behaviors/hardware/input/block::input-suppression-api-reference
  any:
  - id: objectives/impact/system/shutdown/
  - id: micro-behaviors/os/event/shutdown::source-shutdown-command
- id: taskmgr-policy-keyboard-hook-lock
  desc: Keyboard hook with Task Manager disabled
  crit: hostile
  conf: 0.96
  attack: T1562.001,T1056.001
  for:
  - pe
  - dll
  all:
  - id: micro-behaviors/os/registry/policy/write::taskmgr-policy-write-api-cooccurrence
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
- id: desktop-shell-deletion-ransom-demand
  desc: Deletes Explorer executable alongside ransom demand
  crit: hostile
  conf: 0.98
  for: [batch]
  all:
  - id: objectives/impact/degrade/system/file::batch-deletes-explorer-exe
  any:
  - id: objectives/impact/ransom/note::multi-phrase-ransom-note-text
  - id: objectives/impact/ransom/keywords::transfer-bitcoin-phrase
  - id: objectives/impact/ransom/note::ransom-demand-phrase
# A batch lock screen that demands a password to restore access is the
# classic winlocker gate: the console announces the lock, then loops on
# `set /p` until the attacker's password is typed. Neither atom convicts
# alone - a docs page can mention a locked Windows session, and installers
# prompt for credentials - so the composite joins them by proximity.
- id: batch-lock-screen-password-gate
  desc: Batch lock screen gates access on a password prompt
  crit: hostile
  conf: 0.94
  for: [batch]
  attack: T1491
  near_lines: 30
  all:
  - id: micro-behaviors/ui/keywords::windows-locked-phrase
  - id: micro-behaviors/ui/controls/credential::batch-password-input-prompt
