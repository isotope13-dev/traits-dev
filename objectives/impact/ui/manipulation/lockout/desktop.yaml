# Desktop lockout: the victim is deliberately denied control of their own
# session while something plays out on screen.
#
# The technique shows up in screen-lockers, ransom notes, "screamer" payloads,
# and remote-controlled prank RATs, and it is always assembled from the same
# three kinds of move:
#
#   1. take away the escape hatches — suppress Esc/Alt/Tab/Win, or swallow
#      mouse messages before any window sees them;
#   2. take away the shell — kill explorer.exe so the taskbar and Start menu
#      are gone, and/or minimize every other top-level window on a loop;
#   3. take away the session — force an immediate reboot or power-off.
#
# Any one of those alone is legitimate somewhere (kiosk shells suppress keys,
# installers restart Explorer, admin tools reboot). Two of them together, in
# one file, is not: no benign program blocks the user's input *and* removes the
# shell out from under them. The legs are language-neutral by construction so a
# rewrite in another language matches the same rule.
defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1565.001

traits: []

composite_rules:
  # Input suppression — any mechanism, any language.
  - id: input-suppressed
    desc: Suppresses keyboard or mouse input
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/hardware/input/block
      - id: micro-behaviors/hardware/input/keyboard/listener::pynput-suppress-event-call

  # The shell is what a trapped user reaches for next. Removing it is the
  # difference between an annoying full-screen window and a lockout.
  - id: shell-removed
    desc: Removes the Windows shell from the session
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/process/terminate/command::taskkill-explorer-force
      - id: micro-behaviors/ui/window/manage/enumerate::python-enumerates-top-level-windows

  - id: desktop-input-lockout
    desc: Blocks user input and removes the Windows shell
    crit: hostile
    conf: 0.95
    all:
      - id: input-suppressed
      - id: shell-removed

  # Weaker pairing: input is taken away and the machine is then powered off
  # without the user being able to intervene. Suspicious rather than hostile —
  # a kiosk/lab-imaging tool can legitimately do both.
  - id: input-lockout-forced-shutdown
    desc: Blocks user input then forces a shutdown
    crit: suspicious
    conf: 0.9
    attack: T1529
    all:
      - id: input-suppressed
      - id: objectives/impact/system/shutdown/
