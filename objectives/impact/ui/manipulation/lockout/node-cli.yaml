# A command-line locker that asks for a secret key, suppresses the usual
# interrupt signals, and relaunches itself when its readline interface closes.
defaults:
  platforms: [unix, android]
  for: [javascript, typescript]

traits:
  - id: node-cli-lockout-phrase
    desc: Node CLI says user is locked out
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: "You are locked, you can't do anything"

  - id: node-cli-secret-key-prompt
    desc: Node CLI requests a secret key
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: "Enter the secret key:"

  - id: node-readline-close-respawns-current-cli
    desc: Node readline close handler respawns CLI
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression
            object: (identifier) @receiver
            property: (property_identifier) @method)
          arguments: (arguments
            . (string (string_fragment) @event)
            . (arrow_function) @callback))
        (#eq? @receiver "rl")
        (#eq? @method "on")
        (#eq? @event "close")
        (#match? @callback "respawn\\(\\)"))

  - id: node-respawns-current-module
    desc: Node respawns its current module
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @callee
          arguments: (arguments
            . (string (string_fragment) @program)
            . (array) @arguments))
        (#eq? @callee "spawn")
        (#eq? @program "node")
        (#match? @arguments "import\\.meta\\.url\\.replace"))

composite_rules:
  - id: node-cli-secret-lockout-with-respawn
    desc: Node CLI enforces secret-gated lockout with respawn
    crit: hostile
    conf: 0.99
    all:
      - id: node-cli-lockout-phrase
      - id: node-cli-secret-key-prompt
      - id: node-readline-close-respawns-current-cli
      - id: node-respawns-current-module
    any:
      - id: micro-behaviors/os/signal::node-sigint-handler
      - id: micro-behaviors/os/signal::node-sigtstp-handler
      - id: micro-behaviors/os/signal::node-sigquit-handler
    needs: 3
