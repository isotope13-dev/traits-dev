defaults:
  for: [pyc]
  platforms: [windows, unix]
composite_rules:
  - id: pyc-ransom-ui-keyboard-blocking
    desc: Ransom UI with keyboard blocking references
    crit: hostile
    conf: 0.95
    attack: T1499
    all:
      - id: objectives/impact/ransom/note::ransomware-banner-core
      - id: micro-behaviors/hardware/input/block::pyc-keyboard-block-key-reference
      - id: micro-behaviors/ui/window/visibility::pyc-window-fullscreen-option
      - id: micro-behaviors/ui/window/visibility::pyc-window-topmost-option
