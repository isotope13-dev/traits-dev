defaults:
  for: [pyc]
  platforms: [windows, unix]
composite_rules:
  - id: pyc-ransom-ui-keyboard-blocking
    desc: Ransom UI with keyboard blocking references
    crit: hostile
    conf: 0.95
    attack: T1499
    all:
      - id: objectives/impact/ransom/note::ransomware-banner-core
      - id: micro-behaviors/hardware/input/block::pyc-keyboard-block-key-reference
      - id: micro-behaviors/ui/window/visibility::pyc-window-fullscreen-option
      - id: micro-behaviors/ui/window/visibility::pyc-window-topmost-option
  # ctypes BlockInput plus a Task Manager policy write and a fullscreen window
  # is the screen-locker pattern. The keyboard-library composite above does not
  # cover the Win32 call, which is what this family ships.
  - id: pyc-input-block-taskmgr-fullscreen-lock
    desc: Bytecode blocks input and disables Task Manager in fullscreen
    crit: hostile
    conf: 0.93
    attack: T1491.001,T1112
    all:
      - id: micro-behaviors/hardware/input/block::pyc-block-input-api-name
      - id: micro-behaviors/os/registry/policy/reference::disable-taskmgr
      - id: micro-behaviors/ui/window/visibility::pyc-window-fullscreen-option
