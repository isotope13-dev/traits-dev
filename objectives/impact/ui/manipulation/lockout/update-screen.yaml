# A progress message alone is normal updater UI. The restrictive policy
# names, registry mutation APIs and keyboard hook distinguish a probable
# fake-update lockout. Co-occurrence does not prove the policies were applied.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: update-screen-session-restriction-profile
    desc: Update screen text with keyboard hook and restrictive policies
    crit: hostile
    conf: 0.96
    attack: T1036,T1112
    all:
      - id: micro-behaviors/ui/keywords::update-progress-status-text
      - id: micro-behaviors/ui/keywords::update-keep-computer-on-text
      - id: micro-behaviors/os/registry/policy/write::taskmgr-policy-write-api-cooccurrence
      - id: micro-behaviors/os/registry/policy/reference::disable-lock-workstation-value
      - id: micro-behaviors/os/registry/policy/reference::disable-change-password-value
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
