defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: rwx-section-blockinput-keylogger
    desc: Unsigned PE with BlockInput, clipboard read, and WriteProcessMemory
    crit: hostile
    conf: 0.95
    attack: T1056.001,T1055
    all:
      - id: micro-behaviors/hardware/input/block::block-input-import
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-binary
    unless:
      - id: metadata/signature/verified/
