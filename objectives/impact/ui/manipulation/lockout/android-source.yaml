# A full-screen TYPE_SYSTEM_ERROR window sits above every app and the status
# bar. Without FLAG_NOT_TOUCHABLE it swallows all input, so the victim sees
# and can touch only the fake screen. Screen dimmers set FLAG_NOT_TOUCHABLE.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1411
  mbc: B0033

composite_rules:
  - id: android-fullscreen-system-error-input-block
    desc: Full-screen system-error overlay blocks input
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/ui/window/overlay::android-system-error-overlay-window
      - id: micro-behaviors/ui/window/overlay::android-fullscreen-system-error-params
    unless:
      - id: micro-behaviors/ui/window/overlay::android-overlay-not-touchable-flag
