# An unsigned executable that claims a Microsoft identity, registers a service
# control handler, and enumerates device nodes is camouflage on its own; those
# APIs also appear in catalog-signed Windows components. Adding BlockInput
# joins that masquerade service to keyboard and mouse suppression, which a
# legitimate unsigned Microsoft-labelled service has no reason to call.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1491

composite_rules:
  - id: unsigned-microsoft-service-blocks-input
    desc: Unsigned Microsoft-labelled service blocks user input
    crit: hostile
    conf: 0.93
    all:
      - id: objectives/evasion/masquerade/service::unsigned-microsoft-labelled-service-device-controller
      - id: micro-behaviors/hardware/input/block::block-input-import
