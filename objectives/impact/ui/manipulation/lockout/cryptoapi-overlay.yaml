defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: cryptoapi-input-blocking-overlay-references
    desc: CryptoAPI and input-blocking APIs with intrusive window settings
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/ui/window/visibility::powershell-topmost-window-assignment
      - id: micro-behaviors/ui/window/visibility::powershell-borderless-form-assignment
      - id: micro-behaviors/ui/window/visibility::powershell-maximized-window-assignment
      - id: micro-behaviors/hardware/input/block::block-input-import
      - id: micro-behaviors/crypto/provider/cryptoapi::crypt-encrypt
