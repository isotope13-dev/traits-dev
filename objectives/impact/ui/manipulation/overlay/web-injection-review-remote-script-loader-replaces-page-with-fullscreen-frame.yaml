defaults:
  platforms: [windows, unix]
  attack: T1105
composite_rules:
  - id: remote-script-loader-replaces-page-with-fullscreen-frame
    desc: Remote script and fullscreen frame clues
    crit: hostile
    conf: 0.97
    attack: T1189,T1105,T1496
    for: [html]
    all:
      - id: micro-behaviors/data/decode/base64/unspecified::js-atob-call-or-callback
      - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
      - id: micro-behaviors/ui/window/dom/render::fixed-fullscreen-high-z-overlay-style
      - id: micro-behaviors/communications/http/client/frame::external-iframe-element-load
    any:
      - id: micro-behaviors/communications/http/client/script::head-leading-remote-script
      - id: micro-behaviors/communications/http/client/script::remote-script-element-source
