defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]

composite_rules:
  - id: low-opacity-pointer-following-iframe
    desc: Nearly transparent iframe follows pointer offsets
    crit: hostile
    conf: 0.95
    near_bytes: 7000
    all:
      - id: micro-behaviors/ui/window/style::low-opacity-configuration
      - id: micro-behaviors/ui/window/style::iframe-dynamic-opacity-style
      - id: micro-behaviors/ui/window/style::pointer-offset-near-left-style-write
      - id: micro-behaviors/ui/window/style::element-style-alias-assignment
      - id: micro-behaviors/hardware/input/event::user-activity-event-listener
