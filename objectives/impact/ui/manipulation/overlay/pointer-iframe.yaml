defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]

composite_rules:
  - id: low-opacity-pointer-following-iframe
    desc: Nearly transparent iframe follows pointer offsets
    crit: hostile
    conf: 0.95
    # The global opacity setting may precede the iframe script by markup.
    # Pointer wiring itself is constrained in its neutral composite.
    all:
      - id: micro-behaviors/ui/window/style::low-opacity-configuration
      - id: micro-behaviors/ui/window/style::pointer-following-opacity-iframe
  # Structural twin for static-markup traps: a concealed off-brand Like
  # control loaded from a remote host. The behavioral half (pointer
  # tracking plus click confirmation) convicts in
  # social::pointer-following-offbrand-like-trap; this names the hidden
  # control and its remote load.
  - id: concealed-offbrand-like-control
    desc: Hidden off-brand Like iframe from remote host
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/ui/controls/widget::offbrand-like-action-iframe
      - id: micro-behaviors/ui/window/style::low-opacity-configuration
      - id: micro-behaviors/communications/http/client/frame::external-iframe-element-load
  # Companion for library-positioned traps: a concealed social control the
  # visitor's pointer repositions through jQuery css. The callback-gated
  # variant convicts in social::pointer-following-hidden-facebook-like;
  # this names the hidden control and its pointer positioning.
  - id: concealed-social-control-pointer-positioned
    desc: Hidden social control repositioned by pointer
    crit: hostile
    conf: 0.95
    near_bytes: 6000
    all:
      - id: micro-behaviors/ui/window/style::transparent-small-or-hidden-style
      - id: micro-behaviors/ui/window/style::jquery-css-pointer-position
      - id: micro-behaviors/ui/controls/widget::facebook-like-control-markup
  # Concealment and pointer positioning establish the trap even when it
  # never schedules teardown. Social composites describe timed-removal
  # variants separately; that cleanup is not necessary for click fraud.
  - id: created-hidden-like-iframe-pointer-trap
    desc: Created low-opacity Like iframe tracks pointer
    crit: hostile
    conf: 0.95
    for: [html]
    near_bytes: 6000
    all:
      - id: micro-behaviors/ui/controls/widget::facebook-like-iframe-source
      - id: micro-behaviors/ui/window/style::created-iframe-receiver-low-opacity
      - id: micro-behaviors/ui/window/style::dom-element-position-tracks-pointer
  # Structural twin for ad-script traps: an invisible element that loads a
  # remote ad script while jQuery repositions it from pointer coordinates.
  # The behavioral half (hover evasion) convicts in
  # social::pointer-following-invisible-ad-click-trap; this names the hidden
  # ad carrier and its pointer positioning.
  - id: invisible-remote-ad-pointer-carrier
    desc: Remote ad source with invisible pointer positioning
    crit: hostile
    conf: 0.95
    for: [html]
    near_bytes: 6000
    all:
      - id: micro-behaviors/ui/window/style::css-opacity-zero
      - id: micro-behaviors/communications/http/client/script::external-script-element-load
      - id: micro-behaviors/communications/http/client/script::script-src-ad-label
      - id: micro-behaviors/ui/window/style::jquery-css-pointer-position
  # Structural twin for vanilla-JS ad-iframe traps ("icontainer/haframe"
  # kits): the invisible container holds a remote ad iframe instead of an
  # ad script, and a raw mousemove listener repositions it from pointer
  # coordinates, so victim clicks land on the ad. The behavioral half
  # (click-confirmation polling) convicts in
  # social::ad-click-focus-verification-loop; this names the hidden ad
  # carrier and its pointer positioning.
  - id: mousemove-tracked-invisible-ad-iframe
    desc: Invisible ad iframe tracks the visitor pointer
    crit: hostile
    conf: 0.97
    for: [html]
    near_bytes: 6000
    all:
      - id: micro-behaviors/ui/window/style::css-opacity-zero
      - id: micro-behaviors/ui/window/style::ie-filter-zero-opacity
      - id: micro-behaviors/communications/http/client/frame::external-iframe-element-load
      - id: micro-behaviors/hardware/input/event::user-activity-event-listener
  # Structural twin for static-markup Like traps positioned by jQuery: a
  # genuine Like iframe in an alpha-filter-transparent container that a
  # jQuery mousemove binding repositions under the cursor. The behavioral
  # half (hover evasion) convicts in
  # social::pointer-following-like-yields-to-controls; this names the hidden
  # control and its pointer positioning.
  - id: alpha-hidden-like-iframe-mousemove-positioned
    desc: Alpha-hidden Like iframe moved by mousemove handler
    crit: hostile
    conf: 0.96
    for: [html]
    near_bytes: 6000
    all:
      - id: micro-behaviors/ui/controls/widget::facebook-like-iframe-source
      - id: micro-behaviors/ui/window/style::ie-filter-zero-opacity
      - id: micro-behaviors/hardware/input/event::jquery-mousemove-handler
      - id: micro-behaviors/ui/window/style::jquery-css-pointer-position
  # Remote-hosted variant of the Like trap: the page keeps only the kit's
  # ClickJackFb show/hide helpers while the wrapper, Like iframe and pointer
  # tracking arrive from a script on Google Drive web hosting. Static HTML
  # cannot see the armed trap, so the helpers plus the anonymous remote
  # script stay suspicious.
  - id: clickjack-helpers-drive-hosted-trap-script
    desc: Clickjack helpers beside Drive-hosted remote script
    crit: suspicious
    conf: 0.9
    for: [html]
    all:
      - id: objectives/impact/ui/manipulation/social/clickjacking::clickjack-like-kit-toggle-helpers
      - id: micro-behaviors/communications/http/client/script::googledrive-host-script-src
