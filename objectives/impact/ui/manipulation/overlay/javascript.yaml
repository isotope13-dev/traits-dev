defaults:
  attack: T1491
  platforms: [windows, unix, android, ios]
  for: [javascript, typescript]
composite_rules:
  - id: page-overlay-takeover
    desc: Full-page DOM rewrite takeover
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/ui/window/insert-html::browser-high-layer-iframe-container
      - id: objectives/impact/ui/delivery::body-children-hide
      - id: micro-behaviors/data/collection/dom::template-dom-access-cluster
    any:
      - id: objectives/impact/ui/delivery::body-style-guard
      - id: micro-behaviors/communications/http/client/resource::dynamic-external-stylesheet-load
  - id: remote-iframe-page-takeover
    desc: Remote iframe replaces visible page
    crit: hostile
    conf: 0.99
    attack: T1491.002
    all:
      - id: objectives/impact/ui/delivery::remote-iframe-overlay
      - id: micro-behaviors/ui/window/insert-html::browser-empty-document-write
  - id: persistent-page-rewrite
    desc: Persistent browser page content rewrite
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/ui/window/event::browser-mutation-observer
      - id: objectives/impact/ui/delivery::body-children-hide
      - id: micro-behaviors/data/collection/dom::template-dom-access-cluster
    any:
      - id: objectives/impact/ui/delivery::body-style-guard
      - id: micro-behaviors/communications/http/client/resource::dynamic-external-stylesheet-load
  - id: persistent-fullscreen-shadow-overlay-takeover
    desc: Persistent full-screen shadow-root iframe overlay takeover
    crit: hostile
    conf: 0.98
    attack: T1491.002
    near_bytes: 2048
    all:
      - id: micro-behaviors/ui/window/style::fixed-viewport-style
      - id: micro-behaviors/ui/window/style::high-z-index-style
      - id: micro-behaviors/ui/window/event::browser-mutation-observer
      - id: micro-behaviors/ui/window/dom/create::shadow-root-near-iframe-create
      - id: micro-behaviors/ui/window/dom/create::browser-create-iframe-element
  # A page fetched from a third-party origin is parsed, one of its text nodes is
  # replaced with attacker-chosen wording, and the altered markup is written
  # back over the live document. The visitor sees forged page content under the
  # real site's address. Each leg is ordinary alone (fetch, DOMParser, text
  # assignment, document.write); the four in one short window are the forgery.
  - id: remote-page-forged-rewrite-render
    desc: Fetched page text rewritten and re-rendered over live page
    crit: hostile
    conf: 0.9
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
      - id: micro-behaviors/data/parse/html::fetched-html-domparser
      - id: micro-behaviors/data/collection/dom::node-text-property-assignment
      - id: micro-behaviors/ui/window/insert-html::browser-document-write

