defaults:
  attack: T1491
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript, typescript]
composite_rules:
  - id: page-overlay-takeover
    desc: Full-page DOM rewrite takeover
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/ui/window/insert-html::browser-high-layer-iframe-container
      - id: objectives/impact/ui/delivery::body-children-hide
      - id: micro-behaviors/data/collection/dom::template-dom-access-cluster
    any:
      - id: objectives/impact/ui/delivery::body-style-guard
      - id: micro-behaviors/communications/http/client/resource::dynamic-external-stylesheet-load
  - id: remote-iframe-page-takeover
    desc: Remote iframe replaces visible page
    crit: hostile
    conf: 0.99
    attack: T1491.002
    all:
      - id: objectives/impact/ui/delivery::remote-iframe-overlay
      - id: micro-behaviors/ui/window/insert-html::browser-empty-document-write
  - id: persistent-page-rewrite
    desc: Persistent browser page content rewrite
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/ui/window/event::browser-mutation-observer
      - id: objectives/impact/ui/delivery::body-children-hide
      - id: micro-behaviors/data/collection/dom::template-dom-access-cluster
    any:
      - id: objectives/impact/ui/delivery::body-style-guard
      - id: micro-behaviors/communications/http/client/resource::dynamic-external-stylesheet-load
  # A zero-size third-party iframe has no display purpose; percent-encoding
  # it behind document.write keeps the carrier out of static view and out
  # of the page's visible link inventory. The pairing is hit-fraud and
  # doorway-traffic plumbing: the visitor sees nothing while the hidden
  # frame loads (and executes) a third party's page.
  - id: concealed-zero-size-remote-iframe
    desc: Hidden remote iframe delivered encoded
    crit: hostile
    conf: 0.95
    for: [html]
    near_bytes: 1500
    all:
      - id: micro-behaviors/ui/window/visibility::tiny-iframe-at-most-one
      - id: micro-behaviors/communications/http/client/resource::external-iframe-element-load
      - id: micro-behaviors/ui/window/insert-html::browser-document-write-unescape
  # Delivery-only twin of the carrier above: an encoded tiny iframe without
  # a remote target is weird (why hide a same-origin pixel?) but not yet a
  # third-party load, so it stays suspicious. It exists so the carrier's
  # remote leg carries the conviction alone.
  - id: concealed-tiny-iframe-delivery
    desc: Encoded tiny iframe written into document
    crit: suspicious
    conf: 0.9
    for: [html]
    near_bytes: 1500
    all:
      - id: micro-behaviors/ui/window/visibility::tiny-iframe-at-most-one
      - id: micro-behaviors/ui/window/insert-html::browser-document-write-unescape
  - id: persistent-fullscreen-shadow-overlay-takeover
    desc: Persistent full-screen shadow-root iframe overlay takeover
    crit: hostile
    conf: 0.98
    attack: T1491.002
    near_bytes: 2048
    all:
      - id: micro-behaviors/ui/window/style::fixed-viewport-style
      - id: micro-behaviors/ui/window/style::high-z-index-style
      - id: micro-behaviors/ui/window/event::browser-mutation-observer
      - id: micro-behaviors/ui/window/dom/create::shadow-root-near-iframe-create
      - id: micro-behaviors/ui/window/insert-html::browser-create-iframe-element

