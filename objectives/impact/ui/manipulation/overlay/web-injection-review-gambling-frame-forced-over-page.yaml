defaults:
  platforms: [windows, unix]
  attack: T1105
composite_rules:
  - id: gambling-frame-forced-over-page
    desc: Remote gambling frame and full-page overlay
    crit: hostile
    conf: 0.96
    attack: T1189,T1105,T1496
    for: [html]
    all:
      - id: micro-behaviors/ui/window/dom/render::fixed-viewport-high-z-overlay-style
      - id: micro-behaviors/communications/http/client/frame::external-iframe-element-load
      - id: micro-behaviors/communications/http/client/script::external-script-element-load
    any:
      - id: metadata/document/html/page::cjk-betting-app-title
      - id: metadata/document/html/page::cjk-casino-download-site-title
