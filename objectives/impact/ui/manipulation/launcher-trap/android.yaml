# Default-Home (launcher) hijack. StreamRat-class droppers present themselves
# as the device Home app so every press of the HOME button returns the victim
# to the dropper flow until the payload is installed and has Accessibility
# access; they then quietly release the role. Real launchers also prompt to
# become the default Home, so the prompt alone stays notable — the hostile
# composite pairs the Home-hijack surface with a programmatic package-install
# session, a combination no legitimate launcher needs.
defaults:
  platforms: [android]
  for: [java, kotlin, xml, apk, zip]
  attack: T1631

composite_rules:
  - id: android-default-home-launcher-prompt
    desc: App prompts to become the default Home launcher
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/os/message/intent::android-manage-default-apps-settings
    any:
      - id: micro-behaviors/os/message/intent::android-home-category-intent
      - id: micro-behaviors/os/message/intent::android-role-home-request
    needs: 1

  - id: android-launcher-trap-installing-dropper
    desc: Default-Home hijacking dropper installs a payload APK
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/message/intent::android-home-category-intent
      - id: micro-behaviors/os/package-manager/install::android-package-installer-session-mode
      - id: micro-behaviors/os/package-manager/install::android-packageinstaller-open-write
    any:
      - id: micro-behaviors/os/package-manager/install::android-can-request-package-installs
      - id: micro-behaviors/os/package-manager/install::android-package-installer-no-user-action
      - id: micro-behaviors/os/package-manager/install::android-request-install-packages-permission
      - id: micro-behaviors/os/message/intent::android-role-home-request
    needs: 1
