# Screen lockers register as the Home launcher so HOME returns to them,
# hold device admin against removal and draw overlays over other apps.
defaults:
  platforms: [android]
  for: [xml]
  attack: T1631,T1629

composite_rules:
  - id: android-manifest-home-admin-overlay-locker
    desc: Home-launcher manifest with admin and overlay
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/os/privilege/manifest::axml-home-category
      - id: micro-behaviors/os/privilege/manifest::axml-device-admin-receiver-binding
      - id: metadata/permission/manifest::android-system-alert-window-request-axml
      - id: micro-behaviors/os/privilege/manifest::axml-accessibility-service-binding
