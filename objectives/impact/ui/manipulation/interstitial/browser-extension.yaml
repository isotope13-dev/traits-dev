# An all-site content script uses a publisher-controlled configuration to pick
# victim sites and replace their UI with an effectively uncloseable interstitial.
# Requiring both the config-to-DOM data flow and the viewport takeover excludes
# ordinary extensions that merely fetch configuration or display local dialogs.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip]
  attack: T1176,T1491.002

composite_rules:
  - id: all-site-remote-config-page-blocker
    desc: Remote config controls all-site page blocker
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/process/inject/webextension::broad-content-script-injection
      - id: micro-behaviors/communications/http/endpoints::remote-config-endpoint
      - id: micro-behaviors/communications/http/url/path::config-domain-gates-current-host
      - id: micro-behaviors/ui/window/manage/dom::config-derived-innerhtml-content
      - id: micro-behaviors/ui/window/manage/style::fixed-viewport-style
      - id: micro-behaviors/ui/window/manage/style::high-z-index-style
