# An all-site content script reads a domain list out of a JSON config (remote
# or bundled), checks the current hostname against it, and on a hit pins a
# top-layer element over the whole viewport. The config, not the user, picks
# which sites get covered; the overlay then carries whatever lure the config
# supplies (fake "browser not supported" download, paywall, activation wall).
defaults:
  platforms: [windows, unix]
  attack: T1176,T1491.002

composite_rules:
  - id: viewport-pinned-element
    desc: Element pinned over the full viewport
    crit: notable
    conf: 0.88
    for: [javascript, typescript]
    any:
      - id: micro-behaviors/ui/window/style::fixed-viewport-style
      - id: micro-behaviors/ui/window/style::dom-style-fixed-full-viewport

  - id: top-layer-z-index
    desc: Element raised to a 7+ digit z-index
    crit: notable
    conf: 0.88
    for: [javascript, typescript]
    any:
      - id: micro-behaviors/ui/window/style::high-z-index-style
      - id: micro-behaviors/ui/window/style::dom-style-seven-digit-z-index

  - id: domain-list-gated-fullscreen-overlay
    desc: All-site content script overlays config-listed domains full screen
    crit: hostile
    conf: 0.96
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript]
    all:
      - id: metadata/permission/host::broad-content-script-matches
      - id: micro-behaviors/communications/url/parse::parsed-json-domain-list-read
      - id: micro-behaviors/communications/url/parse::hostname-matched-against-domain-list
      - id: viewport-pinned-element
      - id: top-layer-z-index
