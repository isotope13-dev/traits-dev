# Growth-hack extensions that drive a social network as the signed-in user:
# lifting the session's anti-CSRF token to post the site's internal forms,
# and scripting clicks on "Add Friend" controls in bulk. Both act on the
# user's account without per-action intent; the account bears the ToS risk.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, xpi, javascript, typescript, zip]
  attack: T1185

composite_rules:
  - id: extension-facebook-session-token-replay
    desc: Extension lifts Facebook session CSRF token to act as the user
    crit: suspicious
    conf: 0.85
    scope: archive
    all:
      - id: metadata/permission/host::facebook-scope
      - id: micro-behaviors/communications/http/services/facebook::dtsg-session-token-extract

  - id: extension-scripted-add-friend-clicks
    desc: Extension content script clicks Add Friend buttons programmatically
    crit: suspicious
    conf: 0.8
    for: [javascript, typescript]
    near_bytes: 2000
    all:
      - id: micro-behaviors/ui/controls/button::add-friend-button-selector
      - id: micro-behaviors/data/control-flow/dispatch/named::click-call
