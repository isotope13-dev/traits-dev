defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip]
  attack: T1491

composite_rules:
- id: all-site-external-browser-automation
  desc: All-site externally driven browser automation
  crit: hostile
  conf: 0.97
  scope: archive
  all:
  - id: metadata/permission/manifest::externally-connectable
  - id: micro-behaviors/communications/ipc/message::chrome-runtime-on-message-external
  - id: micro-behaviors/process/inject/webextension::active-tab-scripting-authority
  - id: "metadata/permission/activation::content-script-all-frames"
  any:
  - id: micro-behaviors/communications/http/devtools/client::cdp-input-event-injection
  - id: micro-behaviors/process/attach/webextension::chrome-debugger-send-command
  - id: micro-behaviors/data/db/web-storage::chrome-storage-session-access-level
  unless:
  - id: well-known/app/browser-extension/servicenow::web-automation-extension
  - id: well-known/app/ai/browser-agent/quantomate::quantomate-browser-extension-context
  - id: well-known/app/ai/browser-agent/quantomate::quantomate-cdp-runtime-context
  - id: well-known/app/ai/browser-agent/tide-commander::tide-commander-browser-extension-context
