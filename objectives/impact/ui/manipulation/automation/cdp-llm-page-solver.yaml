# CDP clients that harvest visible page content and relay it to a remote LLM
# API for automated answering. Unlike ordinary automation frameworks that
# script a browser they launched, this pattern attaches to an existing debug
# socket and posts captured question text to an external inference endpoint.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, source]
  attack: T1185,T1071.001

composite_rules:
  - id: cdp-remote-llm-page-solver
    desc: CDP evaluation and authenticated HTTPS APIs
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/devtools/client::cdp-debugger-url-key
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-runtime-evaluate
      - id: micro-behaviors/communications/http/auth::javascript-hardcoded-api-key-field
    any:
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/json::node-http-post-json-body
