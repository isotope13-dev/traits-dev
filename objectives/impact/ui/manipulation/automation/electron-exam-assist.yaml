# Electron desktop overlays that hide from screen capture, hook global input,
# and automate remote AI chat services to extract exam answers. Distinct from
# browser extensions and CDP clients: the main process owns a stealth HUD and
# drives chatgpt.com (or peers) while the victim takes a proctored assessment.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1622,T1056

traits:
  - id: tagged-final-answer-extraction-prompt
    desc: Prompt mandates tagged final answer output
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'FINAL ANSWER:\s*\['

composite_rules:
  - id: electron-anti-proctor-ai-assist
    desc: Electron overlay evades capture and drives AI answers
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/interpreter/node::js-electron-main-require
      - id: micro-behaviors/ui/window/region::window-anti-capture-affinity
      - id: objectives/impact/ui/manipulation/automation::ai-chat-host-target-set
    any:
      - id: micro-behaviors/hardware/input/keyboard/listener::uiohook-global-input-listener
      - id: objectives/evasion/security-bypass/anti-bot/automation::chromium-automation-controlled-suppression
      - id: objectives/evasion/security-bypass/anti-bot/fingerprint-spoof::navigator-webdriver-override
      - id: tagged-final-answer-extraction-prompt
