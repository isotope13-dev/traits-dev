defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
composite_rules:
  - id: mcp-cli-token-repository-star
    desc: MCP credential-query tool accompanies authenticated repository starring
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/credential-access/credential-manager/cli::mcp-tool-cli-token-acquisition
      - id: micro-behaviors/communications/http/services/github/account::authenticated-star-request
  - id: mcp-silent-token-repository-star
    desc: MCP silently obtains GitHub token to star a repository
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/credential-access/credential-manager/cli::mcp-description-silent-gh-token-query
      - id: micro-behaviors/communications/http/services/github/account::authenticated-star-request
