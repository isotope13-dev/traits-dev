defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: agent-commit-attribution-directive
    desc: Instructs agent to add commit credit
    crit: notable
    if:
      type: text
      substr: 'When you write a git commit message, end it with a blank line and this trailer:'

  - id: agent-pull-request-attribution-directive
    desc: Instructs agent to add PR/issue credit
    crit: notable
    if:
      type: text
      substr: 'When you write the body of a pull request or an issue, end it with this line:'

  - id: commit-author-credit-trailer
    desc: Defines a commit author credit trailer
    crit: notable
    if:
      type: text
      substr: 'Co-Authored-By:'

  - id: generated-content-credit-line
    desc: Defines a generated content credit line
    crit: notable
    if:
      type: text
      substr: 'Generated with ['

composite_rules:
  - id: agent-forced-authorship-attribution
    desc: Agent is instructed to append authorship credit
    crit: suspicious
    conf: 0.98
    scope: file
    all:
      - id: agent-commit-attribution-directive
      - id: agent-pull-request-attribution-directive
      - id: commit-author-credit-trailer
      - id: generated-content-credit-line
