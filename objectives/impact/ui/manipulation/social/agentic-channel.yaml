# Agent-facing social skills that turn autonomous posting and coordination into
# a background control channel.  This is intentionally limited to skill
# packages: ordinary social clients may legitimately offer posting APIs.
defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1583.001,T1566

traits:
  - id: social-skill-autonomous-posting
    desc: Social skill advertises autonomous posting
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: automated posting

  - id: social-skill-agent-coordination
    desc: Social skill offers agent coordination channel
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: agent-to-agent coordination channel

composite_rules:
  - id: agent-skill-autonomous-social-channel
    desc: Skill enables autonomous social coordination
    crit: hostile
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: social-skill-autonomous-posting
      - id: social-skill-agent-coordination
