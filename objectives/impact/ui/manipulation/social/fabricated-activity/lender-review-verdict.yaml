# Forged lender review verdicts. A loan-application autofill script sets the
# lender's review dropdowns (name validity, not-a-liar check, employer check,
# address check) to the affirmative option, so the human review reads a
# fabricated applicant as verified. Field names come from the review schema the
# lender serves, so any copycat driving the same review screen shares them.

defaults:
  for: [javascript]
  platforms: [windows, unix]

traits:
  - id: review-select-field
    desc: Targets lender review dropdown field name
    crit: notable
    if:
      type: text
      regex: 'select-is(NotLiar|NameValid|Employer|AddressValid)'

  - id: affirmative-review-option
    desc: Selects the affirmative ano review option
    crit: notable
    if:
      type: text
      substr: 'targetText: "ano"'

composite_rules:
  - id: forced-review-verdict
    desc: Forces lender review dropdowns to affirmative values
    crit: hostile
    conf: 0.95
    near_lines: 4
    all:
      - id: review-select-field
      - id: affirmative-review-option
