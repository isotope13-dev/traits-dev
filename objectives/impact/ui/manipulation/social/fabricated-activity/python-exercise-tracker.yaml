# A fake run is synthesized from saved GPS coordinates, marked as if device
# integrity checks passed, and submitted to an exercise-record API. The
# combined behavior fabricates activity accepted by an external system.
defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-track-loop-target-distance
    desc: Builds track until target distance is reached
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'while\s+\w+\s*<\s*target_m'

  - id: python-gps-point-output
    desc: Appends generated GPS points to a track
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: 'out.append({"a":'

  - id: python-record-coordinate-field
    desc: Exercise record contains coordinate samples
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: gitudeLatitude

  - id: python-exercise-record-api
    desc: Calls the exercise-record submission endpoint
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: addExerciseRecord

  - id: python-reports-root-check-false
    desc: Reports the device root check as false
    crit: notable
    if:
      type: text
      substr: '"root": "false"'

  - id: python-reports-emulator-check-false
    desc: Reports the emulator check as false
    crit: notable
    if:
      type: text
      substr: '"emulator": "false"'

  - id: python-reports-hook-check-false
    desc: Reports the hook check as false
    crit: notable
    if:
      type: text
      substr: '"hook": "false"'

composite_rules:
  - id: python-synthesized-gps-track
    desc: Generates and appends synthetic GPS samples
    crit: notable
    scope: file
    all:
      - id: python-track-loop-target-distance
      - id: python-gps-point-output

  - id: python-exercise-record-submission
    desc: Submits coordinate samples as an exercise record
    crit: notable
    scope: file
    all:
      - id: python-record-coordinate-field
      - id: python-exercise-record-api

  - id: python-fakes-device-integrity-state
    desc: Reports root, emulator, and hook checks as false
    crit: notable
    scope: file
    all:
      - id: python-reports-root-check-false
      - id: python-reports-emulator-check-false
      - id: python-reports-hook-check-false

  - id: fabricated-exercise-activity-upload
    desc: Fabricates GPS activity for an exercise-record upload
    crit: hostile
    conf: 0.99
    attack: none
    for: [npm, python]
    scope: package
    all:
      - id: python-synthesized-gps-track
      - id: python-exercise-record-submission
      - id: python-fakes-device-integrity-state
