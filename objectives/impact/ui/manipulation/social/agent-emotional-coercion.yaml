# A task-reminder skill that queries a person's private Notion task page and
# posts threatening guilt messages is social coercion with an external side
# effect, not a neutral reminder.
defaults:
  conf: 0.99
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1566,T1656

traits:
  - id: agent-skill-guilt-threat-persona
    desc: Skill directs guilt and threat messaging
    crit: suspicious
    if:
      type: text
      substr: 黑色幽默威脅

composite_rules:
  - id: agent-skill-notion-emotional-coercion
    desc: Skill posts threatening task reminders
    crit: hostile
    scope: archive
    for: [zip]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/communications/http/services/notion::notion-create-comment-operation
      - id: agent-skill-guilt-threat-persona
