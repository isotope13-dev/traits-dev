# A task-reminder skill that queries a person's private Notion task page and
# posts threatening guilt messages is social coercion with an external side
# effect, not a neutral reminder.
defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1566,T1656

traits:
  - id: agent-skill-notion-threat-comment
    desc: Skill posts coercive Notion comment
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: notion-create-comment

  - id: agent-skill-guilt-threat-persona
    desc: Skill directs guilt and threat messaging
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: 黑色幽默威脅

composite_rules:
  - id: agent-skill-notion-emotional-coercion
    desc: Skill posts threatening task reminders
    crit: hostile
    conf: 0.99
    scope: archive
    for: [archives]
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: agent-skill-notion-threat-comment
      - id: agent-skill-guilt-threat-persona
