# Authenticated WhatsApp-session manipulation.
# Baileys forks can act through a paired session without stealing a static
# token.  The composites below identify autonomous channel growth and covert
# message metadata changes from their protocol-level code shapes.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1491

composite_rules:
  # Require a fixed or remotely supplied target, not caller configuration.
  - id: autonomous-whatsapp-newsletter-follow
    desc: Session-open follow of fixed or remote channels
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript, npm, tar, zip]
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-connection-update-handler
      - id: micro-behaviors/communications/messaging/channel::whatsapp-connection-open-branch
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-invocation
    any:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-literal-target
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-jid
      - id: micro-behaviors/communications/messaging/channel::whatsapp-default-auto-follow-channel-list
      - id: micro-behaviors/communications/messaging/channel::whatsapp-auto-follow-remote-list-url
      - id: micro-behaviors/communications/http/request/json::fetch-variable-near-json-response
    near_bytes: 16000

  - id: archive-session-open-whatsapp-newsletter-follow
    for: [javascript, typescript, npm, tar, zip]
    desc: Follows default channels despite opt-in claims
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-config-channel-follow-loop
      - id: micro-behaviors/communications/messaging/channel::whatsapp-default-auto-follow-channel-list
      - id: micro-behaviors/communications/messaging/channel::whatsapp-auto-follow-default-config
      - id: micro-behaviors/communications/messaging/channel::whatsapp-default-config-merge
      - id: metadata/package/documentation/claims::no-default-channel-follow-claim

  - id: remote-whatsapp-newsletter-follow-and-mute
    desc: Remotely controlled WhatsApp newsletter follow with concealment
    crit: hostile
    conf: 0.99
    all:
      - id: autonomous-whatsapp-newsletter-follow
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-mute-query
    near_bytes: 16000

  # npm/tar archives evaluate as Npm; pool fetch evidence with atomic traits
  # that surface in archive findings (not the fetch-json-response composite).
  - id: archive-remote-whatsapp-newsletter-follow-and-mute
    desc: Archive remote WhatsApp newsletter follow and mute
    crit: hostile
    conf: 0.99
    for: [javascript, typescript, npm, tar, zip]
    scope: archive
    all:
      - id: archive-session-open-whatsapp-newsletter-follow
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-refs
      - id: micro-behaviors/communications/http/message::http-message-json-call
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-mute-query
    near_bytes: 16000

  # Following and muting automatically is suspicious even without a remote
  # list. A source fragment cannot establish the user's lack of consent.
  - id: connect-time-whatsapp-newsletter-follow-and-mute
    desc: Session-open newsletter follow with notification muting
    crit: suspicious
    conf: 0.96
    all:
      - id: autonomous-whatsapp-newsletter-follow
    any:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-mute-query
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-mute-api-call
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-user-setting-mute
    near_bytes: 2000

  # A fork that wires its own promotion into the session lifecycle under
  # local names: a hardcoded AUTO_FOLLOW_JID constant, an aliased wmex follow
  # call, a connection-open trigger, a setInterval that re-issues the follow,
  # and a user-setting mute that hides it. No caller supplies the target and
  # no opt-out exists: opening a session spends the account on the embedded
  # channel on a timer. File scope keeps a legitimate parameterized follow in
  # another module from pooling with this file's implant.
  # Worked example: @zervonex/baileys 3.0.1 lib/Socket/newsletter.js.
  - id: connect-periodic-concealed-newsletter-follow
    desc: Session-open follow repeats on a timer with muting
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-connection-update-handler
      - id: micro-behaviors/communications/messaging/channel::whatsapp-connection-open-branch
      - id: micro-behaviors/communications/messaging/channel::whatsapp-default-auto-follow-newsletter-jid
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-token-target
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-user-setting-mute
      - id: micro-behaviors/time/schedule/interval::setInterval

  # The same session-open follow-and-mute with every protocol token hidden:
  # hardcoded channel ids arrive as decimal character-code arrays (the
  # `@newsletter` suffix never appears on disk) and the newsletterFollow /
  # newsletterMute method names are rebuilt from char-code runs and invoked
  # through computed member access after a long delay. Literal helper and
  # query legs never see it; the concealed-name pair plus the concealed
  # suffix, dispatched on connection open, is the durable signal. A bot
  # that follows on user command hides no JID suffix and no method name.
  - id: charcode-concealed-whatsapp-newsletter-follow-and-mute
    desc: Concealed session-open newsletter follow and mute
    crit: hostile
    conf: 0.99
    # The encoded constants and their decoder can precede the connection
    # handler by an entire module (noxleyss puts ~50 KB between them). Require
    # one file, while keeping handler/timer/dispatch proximity in its own leg.
    # This is correlated evidence, not a source-to-call data-flow proof.
    scope: file
    all:
      - id: micro-behaviors/process/hook/event::connection-open-delayed-computed-call-context
      - id: micro-behaviors/data/decode/charset::fromcharcode-call
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-charcode-jid-suffix
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-charcode-name
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-mute-charcode-name

  # A hidden invite list must be resolved before it becomes a JID. There is
  # no literal @newsletter target and no newsletterFollow helper call here.
  - id: encoded-invite-resolved-whatsapp-newsletter-follow
    desc: Hidden invites resolved into raw newsletter follows
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-base64-channel-invite-list
      - id: micro-behaviors/data/decode/base64::buffer-from-base64-to-utf8
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-invite-metadata-input
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-operation-target
      - id: micro-behaviors/communications/messaging/channel::whatsapp-wmex-newsletter-query
    near_bytes: 3000

  - id: delayed-raw-whatsapp-newsletter-follow
    desc: Raw newsletter follow with delayed callback
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-operation-target
      - id: micro-behaviors/communications/messaging/channel::whatsapp-wmex-newsletter-query
      - id: micro-behaviors/time/schedule/delay::settimeout-callback-long-delay
    near_bytes: 3000

  # Injected into the socket client's login-success path: resolve a hardcoded
  # channel invite, wait a few seconds, then issue the authenticated follow.
  - id: wa-login-success-delayed-invite-channel-follow
    desc: Login success handler auto-follows invite channel
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-ws-login-success-handler
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-invite-metadata-input
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-query
      - id: micro-behaviors/time/schedule/delay::settimeout-callback-short-delay
    near_bytes: 6000

  - id: archive-wa-login-success-delayed-invite-channel-follow
    for: [javascript, typescript, npm, tar, zip]
    desc: Archive login handler auto-follows invite channel
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-ws-login-success-handler
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-invite-metadata-input
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-query
      - id: micro-behaviors/time/schedule/delay::settimeout-callback-short-delay
    near_bytes: 6000

  - id: obfuscated-whatsapp-media-source-url
    desc: Obfuscated sourceUrl in outgoing WhatsApp media
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-media-payload-type
      - id: micro-behaviors/communications/messaging/channel::whatsapp-media-source-url
      - id: micro-behaviors/communications/messaging/channel::whatsapp-obfuscated-media-source-url
    near_bytes: 12000

  - id: socket-client-connect-forced-newsletter-follow
    desc: Socket client follows a channel on connect
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-hardcoded-jid
      - id: micro-behaviors/communications/websocket/library::ws
    near_bytes: 2000

  # A timer-driven follow of an embedded channel roster: several Base64-hidden
  # JIDs plus follow invocations behind a long delay, with no caller-supplied
  # target. Distinct from delayed-base64-hidden-... (one deferred factory
  # call): the roster plus repetition is the growth operation, whether the
  # channels arrive as an array or as staged literals.
  - id: timer-driven-newsletter-roster-follow
    desc: Timer follows embedded newsletter channel roster
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-base64-newsletter-jid-roster
      - id: micro-behaviors/time/schedule/delay::settimeout-callback-long-delay
    # The follow may go through the named helpers or an aliased low-level
    # call: injected socket code wraps executeWMexQuery in a local mexQuery
    # so the helper-name leg never resolves, while the newsletter_id target
    # beside the FOLLOW token survives. Either shape plus the concealed
    # roster and the timer is the same graft.
    any:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-query
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-token-target
    needs: 1
    near_bytes: 3000
    # The Base64-suffix composite below restates this same graft with the
    # concealed target and factory dispatch; step down when it fires so one
    # follow block is not convicted twice.
    downgrade:
      any:
        - id: delayed-base64-hidden-whatsapp-newsletter-follow

  # Staggered variant of the roster follow above: per-channel incremental
  # delays (base + index * step) instead of one literal long timer, spreading
  # the follows across rate-limit windows. The delay is computed, so no
  # literal long-delay leg resolves it; the roster plus the aliased follow
  # call plus the computed-delay timer is the same graft in slower motion.
  # Worked example: @badzz88/baileys 8.6.0 lib/Socket/newsletter.js.
  - id: staggered-roster-channel-follow
    desc: Staggered timer follows embedded channel roster
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-base64-newsletter-jid-roster
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-token-target
      - id: micro-behaviors/time/schedule/delay::settimeout-callback-computed-delay
    near_bytes: 3000

  # A library constructor defers a low-level authenticated follow request and
  # reconstructs its fixed target from Base64.  Unlike a public
  # `newsletterFollow(jid)` API, the host application never supplies or opts
  # into this target: opening a WhatsApp session spends the account on the
  # embedded channel after the timer expires.
  - id: delayed-base64-hidden-whatsapp-newsletter-follow
    desc: Delayed code follows a Base64-hidden WhatsApp channel
    crit: hostile
    conf: 0.99
    for: [javascript, typescript, npm, tar, zip]
    scope: archive
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-query
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-base64-encoded-suffix
      - id: micro-behaviors/time/schedule/delay::settimeout-callback-long-delay
      - id: micro-behaviors/time/schedule/delay::socket-factory-direct-timeout
    # The injected follow block (base64 targets, chained timers, follow
    # dispatch) spans ~1 KB on disk; 800 dropped real implants.
    near_bytes: 2048

  - id: delayed-whatsapp-newsletter-follow
    desc: Delayed code automatically follows a hardcoded WhatsApp channel
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-query
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-literal-target
      - id: micro-behaviors/time/schedule/delay::settimeout-callback-long-delay
    near_bytes: 1200

  # String-embedded variant of the delayed hardcoded follow above: the follow
  # logic ships as source text inside a string literal — a full replacement
  # module carried in an installer payload — so call-symbol legs never resolve
  # it. The durable signal is the same triple in text form: a follow-query
  # call shape, a hardcoded channelId variable, and a long setTimeout.
  # Worked example: @alipclutch/libsignal-node 2.2.4 install.js, whose
  # embedded newsletter.js follows a baked channel after a 120 s delay.
  - id: string-embedded-delayed-channel-follow
    desc: Delayed hardcoded channel follow in embedded source
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-query
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-channel-id-literal
      - id: micro-behaviors/time/schedule/delay::settimeout-callback-long-delay
    near_bytes: 2000

  # A fork that keeps its follow target as a plain hardcoded JID and issues
  # the follow as hand-rolled w:mex and newsletter-IQ stanzas from the login
  # path, without the newsletterWMexQuery/executeWMexQuery helpers the
  # query-based composites key on and without a timer the delay legs key on
  # (the wait is an awaited sleep after the connection opens). The durable
  # signal is the login-success handler plus the literal JID plus both raw
  # follow shapes in one module: a client library has no reason to enroll
  # its operator's account into a fixed third-party channel on login.
  # Worked example: @chatest/baileys 4.4.0, whose socket client subscribes
  # every session to a hardcoded channel on connection open.
  - id: login-success-hardcoded-newsletter-follow
    desc: Login handler follows hardcoded WhatsApp channel
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-ws-login-success-handler
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-jid
      - id: micro-behaviors/communications/messaging/channel::whatsapp-wmex-newsletter-query
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-operation-target
    near_bytes: 16000

  # A fetched JSON list controls which channels an authenticated session will
  # attempt to follow after a delay. Unlike a public newsletterFollow(jid)
  # API, the host application supplies neither the targets nor an opt-in.
  - id: remote-delayed-whatsapp-newsletter-follow
    desc: Delayed code attempts remotely configured WhatsApp channel follows
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-query
      - id: micro-behaviors/communications/http/request/json::fetch-variable-near-json-response
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
      - id: micro-behaviors/time/schedule/delay::settimeout-callback-long-delay
    near_bytes: 2400

  # The same remotely retargetable follow with the helper call gone: the
  # injected block fetches its channel list, waits out a long timer, then
  # issues hand-rolled `w:mex` follow stanzas through the low-level query
  # path, so neither the helper-call composites above nor the hardcoded-JID
  # legs see it. The durable signal is the fetched list plus the delayed raw
  # stanza; a bot that follows on user command fetches no target list.
  # File scope: the injected block fetches its channel list and issues the
  # follow itself. Archive scope pooled an unrelated version check in one
  # file with a hardcoded-default follow in another and read the pair as a
  # remotely driven follow.
  - id: remote-config-driven-raw-whatsapp-newsletter-follow
    desc: Delayed raw follow of remotely listed WhatsApp channels
    crit: hostile
    conf: 0.98
    for: [javascript, typescript, npm, tar, zip]
    scope: file
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-wmex-newsletter-query
      - id: micro-behaviors/communications/http/request/json::fetch-variable-near-json-response
    any:
      - id: micro-behaviors/time/schedule/delay::settimeout-callback-long-delay
      - id: micro-behaviors/time/schedule/delay::js-await-sleep-ten-second-plus
    needs: 1
    # The fetched list must sit near the follow it retargets: without a
    # proximity bound, an unrelated version check in one file plus a
    # hardcoded-default follow in another reads as a remotely driven follow.
    near_bytes: 16000

  - id: connect-delayed-remote-wmex-newsletter-follow
    desc: On connect, delayed follow of fetched newsletter channels
    crit: hostile
    conf: 0.99
    for: [javascript, typescript, npm, tar, zip]
    scope: archive
    all:
      - id: remote-config-driven-raw-whatsapp-newsletter-follow
      - id: micro-behaviors/communications/messaging/channel::whatsapp-connection-update-handler
      - id: micro-behaviors/communications/messaging/channel::whatsapp-connection-open-branch

  # The preset-target sibling of the remote-driven follow above: the socket
  # factory wires triggerAutoFollow on every session, and after connection
  # open plus an awaited sleep the module follows a hardcoded
  # DEFAULT_AUTO_FOLLOW_NEWSLETTER_JID through raw w:mex stanzas. Unlike the
  # public newsletterFollow(jid) API, the host application never supplies or
  # opts into this target: opening a session spends the account on the
  # embedded channel once the timer expires. File scope keeps the four legs
  # bound to the implant module that carries them all.
  # Worked example: @fer2809fl/baileys 7.0.6 lib/Socket/newsletter.js.
  - id: connect-delayed-preset-wmex-newsletter-follow
    desc: On connect, delayed follow of preset newsletter channel
    crit: hostile
    conf: 0.99
    for: [javascript, typescript, npm, tar, zip]
    scope: file
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-trigger-auto-follow-on-connect
      - id: micro-behaviors/communications/messaging/channel::whatsapp-default-auto-follow-newsletter-jid
      - id: micro-behaviors/communications/messaging/channel::whatsapp-wmex-newsletter-query
    # One delay role, two spellings: an awaited sleep(10000+) call, or the
    # family's ninety-second triggerAutoFollow default (promise-wrapped
    # setTimeout with the delay in a variable, which no sleep-literal
    # matcher can establish). Either establishes the deferred follow.
    any:
      - id: micro-behaviors/time/schedule/delay::js-await-sleep-ten-second-plus
      - id: micro-behaviors/communications/messaging/channel::whatsapp-auto-follow-ninety-second-delay
    needs: 1
    near_bytes: 16000

  # Baileys forks moved the follow into a helper that Base64-decodes a payload,
  # XOR-rebuilds the channel id, and only calls the low-level follow after a
  # long setTimeout. The public newsletterWMexQuery call shape is gone, so the
  # composites above never see it; the durable signal is the delayed decode chain
  # plus newsletter material still present in the Base64 layer.
  - id: delayed-xor-base64-whatsapp-newsletter-follow
    desc: Delayed XOR-decoded newsletter follow invocation
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/time/schedule/delay::settimeout-callback-long-delay
      - id: micro-behaviors/data/arithmetic::js-charcode-xor-operation
      - id: micro-behaviors/data/decode/base64::buffer-from-base64-to-utf8
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-base64-encoded-suffix
    near_bytes: 1200

  # An obfuscated Baileys connect-path driver that fetches its instructions
  # over HTTP while the package also carries follow capability with concealed
  # JID material. The connect-time dispatch itself is inside the obfuscated
  # driver (string-table method names, encoded endpoints), so no file-local
  # follow-on-connect shape survives for the composites above; the durable
  # signal is the combination: a Baileys session factory, a follow API call
  # site, Base64-hidden @newsletter material, a runtime string-array decoder,
  # and a concealed fetch URL. A bot that follows on user command fetches no
  # target list and hides no JID suffix.
  # Worked example: satanic-release 2.4.0, whose obfuscated lib/connection.js
  # fetches a remote token/newsletter/group config on every connect and then
  # follows the returned newsletters and joins the returned groups.
  - id: obfuscated-remote-config-driven-channel-follow
    desc: Obfuscated client follows remotely configured channels
    crit: hostile
    conf: 0.96
    for: [javascript, typescript, npm, tar, zip]
    scope: archive
    all:
      - id: well-known/lib/network/baileys::make-wa-socket-factory
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-api-call
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-base64-encoded-suffix
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: micro-behaviors/communications/http/request/client::single-fetch-call
      - id: micro-behaviors/communications/url/encoded::lower-first-base64-http-url-prefix

  # Outgoing messages dressed in the platform's own voice. The
  # "forwarded from <newsletter>" attribution a recipient sees is produced by
  # the server from an actual forward; a client that writes the
  # forwardedNewsletterMessageInfo block itself and hardcodes the official
  # `WhatsApp` channel name in it forges platform provenance on what it sends
  # -- the livery scam blasts use to render as official update cards
  # (typically alongside a forged senderName, an UPDATE_CARD content type and
  # a maxed forwardingScore). No client library has a legitimate reason to
  # stamp the official channel's name into message metadata.
  - id: forged-official-whatsapp-newsletter-attribution
    desc: Forges official WhatsApp newsletter attribution on messages
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-forwarded-newsletter-attribution
      - id: micro-behaviors/communications/messaging/channel::whatsapp-official-newsletter-name-literal
    near_bytes: 400

  # Outgoing messages stamped as forwarded dozens of thousands of times. The
  # server derives forwardingScore from genuine forward traffic, so a client
  # that writes the forwarded-newsletter wrapper itself and pairs it with an
  # extreme literal score forges the "forwarded many times" virality badge
  # scam blasts use to manufacture authority. Ordinary forwarders keep the
  # small counts the server assigned (0, 1, 2), never five-digit literals.
  # Worked example: @lekzox/baileys 0.0.1 lib/Socket/dugong.js, luxu.js.
  - id: forged-viral-whatsapp-forward
    desc: Forges viral forward count on WhatsApp messages
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-forwarded-newsletter-attribution
      - id: micro-behaviors/communications/messaging/channel::whatsapp-large-forwarding-score
    near_bytes: 800

  # A hand-rolled variant of the connect-time follow: instead of the
  # `connection.update` handler plus `newsletterWMexQuery(..., FOLLOW)` pair
  # the sibling composites require, the injected block registers a raw
  # `ws.on('open', ...)` listener and issues raw `w:mex` follow stanzas
  # against a hardcoded `@newsletter` JID. File scope keeps a legitimate
  # parameterized newsletter API in another module from pooling with this
  # file's open handler.
  - id: ws-open-raw-whatsapp-newsletter-follow
    desc: Socket open auto-follows hardcoded WhatsApp channel
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/communications/websocket/handler::ws-open-event-handler
      - id: micro-behaviors/communications/messaging/channel::whatsapp-wmex-newsletter-query
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-operation-target
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-jid
    near_bytes: 16000

  # The stabilization-delay sibling of the raw open follow above: instead of
  # following synchronously in the `ws.on('open', ...)` listener, the injected
  # block waits out an awaited delay (session stabilization) and then issues
  # raw `w:mex` follow stanzas against a hardcoded `@newsletter` JID. File
  # scope keeps a legitimate parameterized newsletter API in another module
  # from pooling with this file's open handler. A status reader that shares
  # the JID, the open handler and the delay but never issues a FOLLOW
  # operation stays silent: both wmex legs are required.
