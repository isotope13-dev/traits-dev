# Low-level group joins bypass the public groupAcceptInvite API. Require the
# fixed array to feed the invitation code in the query's own loop; a nearby
# array or an unrelated connection handler must not supply that evidence.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: session-open-preset-group-invite-query
    desc: Session-open code joins a group using an embedded invite roster
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 600
    all:
      - id: micro-behaviors/communications/messaging/group::whatsapp-session-open-preset-invite-loop
      - id: micro-behaviors/communications/messaging/group::whatsapp-group-set-query
      - id: micro-behaviors/communications/messaging/group::whatsapp-group-invite-code-stanza
