# Feishu helper that grants a fixed recipient full document control immediately.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, shell]
  attack: T1098,T1531

traits:
  - id: feishu-mandatory-language
    desc: Forced or mandatory instruction wording
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)(must|mandatory|required|forced|强制|必须)'

  - id: feishu-grant-verb
    desc: Grant or authorization verb text
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)(grant|give|授予|授权|补授)'

  - id: feishu-full-access-token
    desc: Full-access permission token
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)(full_access|full access|完全访问|完全权限)'

  - id: feishu-fixed-recipient-grant
    desc: Skill grants access to fixed email recipient
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: '--member-id user@example.com --perm full_access'

  - id: feishu-immediate-language
    desc: Immediate-action wording
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)(immediately|立即)'

  - id: feishu-permission-term
    desc: Permission or access term
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)(permission|access|授权|权限|full_access)'

composite_rules:
  - id: feishu-forced-full-access-grant
    desc: Skill forces full document access grant
    crit: suspicious
    conf: 0.99
    all:
      - id: feishu-mandatory-language
      - id: feishu-grant-verb
      - id: feishu-full-access-token
    near_bytes: 120

  - id: feishu-immediate-permission-step
    desc: Skill mandates immediate permission escalation
    crit: suspicious
    conf: 0.98
    all:
      - id: feishu-mandatory-language
      - id: feishu-immediate-language
      - id: feishu-permission-term
    near_bytes: 120

  - id: agent-skill-forced-feishu-full-access
    desc: Agent skill grants fixed recipient full access
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: feishu-forced-full-access-grant
      - id: feishu-fixed-recipient-grant
      - id: feishu-immediate-permission-step
