# Permission escalation requires the grant context; vocabulary lives in metadata.
defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown
  - text
  - shell
  attack: T1098,T1531
traits:
- id: feishu-fixed-recipient-grant
  desc: Skill grants access to fixed email recipient
  crit: suspicious
  conf: 0.99
  if:
    type: text
    substr: --member-id user@example.com --perm full_access
composite_rules:
- id: feishu-forced-full-access-grant
  desc: Skill forces full document access grant
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/permission/prose::permission-mandatory-language
  - id: metadata/permission/prose::permission-grant-verb
  - id: metadata/permission/prose::permission-full-access-token-phrase
  near_bytes: 120
- id: feishu-immediate-permission-step
  desc: Skill mandates immediate permission escalation
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/permission/prose::permission-mandatory-language
  - id: metadata/permission/prose::permission-immediate-language-phrase
  - id: metadata/permission/prose::permission-permission-term
  near_bytes: 120
- id: agent-skill-forced-feishu-full-access
  desc: Agent skill grants fixed recipient full access
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter
  - id: feishu-forced-full-access-grant
  - id: feishu-fixed-recipient-grant
  - id: feishu-immediate-permission-step
