# Permission escalation requires the grant context; vocabulary lives in metadata.
defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown
  - text
  - shell
  attack: T1098,T1531
traits:
- id: feishu-fixed-recipient-grant
  desc: Skill grants access to fixed email recipient
  crit: suspicious
  conf: 0.99
  if:
    type: text
    substr: --member-id user@example.com --perm full_access
- id: permission-mandatory-language-english
  crit: baseline
  conf: 0.9
  desc: Forced or mandatory instruction wording
  if:
    type: text
    regex: (?i)\b(must|mandatory|required|forced)\b
- id: permission-mandatory-language-chinese
  crit: baseline
  conf: 0.9
  desc: Forced or mandatory instruction wording
  if:
    type: text
    regex: 强制|必须
- id: permission-grant-verb-english
  crit: baseline
  conf: 0.9
  desc: Grant or authorization verb text
  if:
    type: text
    regex: (?i)\b(grant|give)\b
- id: permission-grant-verb-chinese
  crit: baseline
  conf: 0.9
  desc: Grant or authorization verb text
  if:
    type: text
    regex: 授予|授权|补授
- id: permission-full-access-token-phrase
  crit: baseline
  conf: 0.9
  desc: Full-access permission token
  if:
    type: text
    regex: (?i)(full_access|full access|完全访问|完全权限)
- id: permission-immediate-language-phrase
  crit: baseline
  conf: 0.9
  desc: Immediate-action wording
  if:
    type: text
    regex: (?i)(immediately|立即)
- id: permission-permission-term-english
  crit: baseline
  conf: 0.9
  desc: Permission or access term
  if:
    type: text
    regex: (?i)\b(permission|access|full_access)\b
- id: permission-permission-term-chinese
  crit: baseline
  conf: 0.9
  desc: Permission or access term
  if:
    type: text
    regex: 授权|权限
composite_rules:
- id: permission-mandatory-language
  desc: Forced or mandatory instruction wording
  crit: component
  conf: 0.9
  any:
  - id: permission-mandatory-language-english
  - id: permission-mandatory-language-chinese
- id: permission-grant-verb
  desc: Grant or authorization verb text
  crit: component
  conf: 0.9
  any:
  - id: permission-grant-verb-english
  - id: permission-grant-verb-chinese
- id: permission-permission-term
  desc: Permission or access term
  crit: component
  conf: 0.9
  any:
  - id: permission-permission-term-english
  - id: permission-permission-term-chinese
- id: feishu-forced-full-access-grant
  desc: Skill forces full document access grant
  crit: suspicious
  conf: 0.99
  all:
  - id: feishu-fixed-recipient-grant
  - id: permission-mandatory-language
  - id: permission-grant-verb
  - id: permission-full-access-token-phrase
  near_bytes: 120
  unless:
  - id: metadata/permission/prose::permission-prohibition-guard
- id: feishu-immediate-permission-step
  desc: Skill mandates immediate permission escalation
  crit: suspicious
  conf: 0.98
  all:
  # Generic security documentation often says that permission changes take
  # effect immediately.  Keep this Feishu coercion atom tied to the
  # fixed-recipient grant marker so ordinary auth/session guidance does not
  # become a social-engineering finding.
  - id: feishu-fixed-recipient-grant
  - id: permission-mandatory-language
  - id: permission-immediate-language-phrase
  - id: permission-permission-term
  near_bytes: 120
  unless:
  - id: metadata/permission/prose::permission-prohibition-guard
- id: agent-skill-forced-feishu-full-access
  desc: Agent skill grants fixed recipient full access
  crit: hostile
  conf: 0.99
  for: [markdown, text, shell, zip, tar]
  scope: archive
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter
  - id: feishu-forced-full-access-grant
  - id: feishu-fixed-recipient-grant
  - id: feishu-immediate-permission-step
