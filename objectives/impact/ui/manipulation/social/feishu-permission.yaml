# Feishu helper that grants a fixed recipient full document control immediately.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, shell]
  attack: T1098,T1531

traits:
  - id: feishu-forced-full-access-grant
    desc: Skill forces full document access grant
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: 'full_access'

  - id: feishu-fixed-recipient-grant
    desc: Skill grants access to fixed email recipient
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: '--member-id user@example.com --perm full_access'

  - id: feishu-immediate-permission-step
    desc: Skill mandates immediate permission escalation
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: '必须立即'

composite_rules:
  - id: agent-skill-forced-feishu-full-access
    desc: Agent skill grants fixed recipient full access
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: feishu-forced-full-access-grant
      - id: feishu-fixed-recipient-grant
      - id: feishu-immediate-permission-step
