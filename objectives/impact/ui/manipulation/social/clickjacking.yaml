# Hidden social controls positioned over the visitor's pointer trick them into
# creating engagement without an informed click. Neutral controls live under
# ui/controls/widget. These composites add concealment and pointer tracking.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]

composite_rules:
  - id: pointer-following-hidden-facebook-like
    desc: Tricks pointer into an invisible Facebook Like
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/ui/window/style::transparent-small-or-hidden-style
      - id: micro-behaviors/ui/window/style::dom-element-position-tracks-pointer
      - id: micro-behaviors/ui/controls/widget::facebook-like-control-markup
      - id: micro-behaviors/ui/controls/widget::facebook-like-success-callback
    near_bytes: 12000

  - id: pointer-following-facebook-like-iframe
    desc: Concealed Like iframe follows the visitor's pointer
    crit: hostile
    conf: 0.98
    near_bytes: 7000
    all:
      - id: objectives/impact/ui/manipulation/overlay::low-opacity-pointer-following-iframe
      - id: micro-behaviors/ui/controls/widget::facebook-like-iframe-source
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
