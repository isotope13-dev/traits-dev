# Hidden social controls positioned over the visitor's pointer trick them into
# creating engagement without an informed click. The component signals below
# are neutral on their own; the composite requires a concealed social action,
# pointer tracking, and a success callback.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]

traits:
  - id: facebook-like-control-injected
    desc: Injects a Facebook Like control into pages
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)<fb:like\b|FB\.XFBML\.parse\s*\('

  - id: facebook-like-success-callback
    desc: Handles successful Facebook Like actions
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)FB\.Event\.subscribe\s*\(\s*["'']edge\.create["'']'

composite_rules:
  - id: pointer-following-hidden-facebook-like
    desc: Tricks pointer into an invisible Facebook Like
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/ui/window/style::transparent-small-or-hidden-style
      - id: micro-behaviors/ui/window/style::dom-element-position-tracks-pointer
      - id: facebook-like-control-injected
      - id: facebook-like-success-callback
    near_bytes: 12000
