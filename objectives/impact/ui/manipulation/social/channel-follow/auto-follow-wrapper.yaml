defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  # Keep the timer, embedded decoder and FOLLOW request close together. This
  # covers wrappers that pass a decoded roster entry instead of the encoded
  # invite directly to the query, while excluding ordinary follow APIs.
  - id: socket-factory-timer-follows-decoded-roster-entry
    desc: Socket timer attempts FOLLOW with an embedded roster entry
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/communications/messaging/channel/whatsapp/auto-follow::whatsapp-indexed-base64-roster-decode
      - id: micro-behaviors/communications/messaging/channel/whatsapp/newsletter::whatsapp-newsletter-follow-query
      - id: micro-behaviors/time/schedule/delay::socket-factory-direct-timeout
    near_bytes: 1800

  # Sibling of the base64 roster form: channel IDs are written as numeric
  # char-code arrays and the word "newsletter" is itself spelled as char codes.
  # A socket-level timer then issues the FOLLOW query for them.
  - id: socket-factory-timer-follows-charcode-roster
    desc: Socket timer FOLLOWs channels from a char-code roster
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/data/decode/charset::charcode-run-spells-newsletter
      - id: micro-behaviors/communications/messaging/channel/whatsapp/newsletter::whatsapp-newsletter-follow-selector-token
      - id: micro-behaviors/time/schedule/delay::socket-factory-direct-timeout
    near_bytes: 1800

  - id: archive-socket-timer-follows-decoded-roster-entry
    desc: Package timer attempts FOLLOW with an embedded roster entry
    crit: hostile
    conf: 0.98
    for: [npm, tar, zip, javascript, typescript]
    scope: archive
    all:
      - id: micro-behaviors/communications/messaging/channel/whatsapp/auto-follow::whatsapp-indexed-base64-roster-decode
      - id: micro-behaviors/communications/messaging/channel/whatsapp/newsletter::whatsapp-newsletter-follow-query
      - id: micro-behaviors/time/schedule/delay::socket-factory-direct-timeout
    near_bytes: 1800

  # The package documents an on-connect newsletter auto-follow and ships the
  # FOLLOW query that performs it. The roster may live in a file the README
  # does not name, so only the disclosure and the query are required. Legs sit
  # in different members (README and lib), hence archive scope.
  - id: archive-readme-disclosed-connect-newsletter-follow
    desc: Package discloses on-connect newsletter auto-follow with FOLLOW query
    crit: hostile
    conf: 0.9
    for: [npm, tar, zip, markdown, javascript, typescript]
    scope: archive
    all:
      - id: metadata/package/documentation/claims::auto-follow-on-connect-disclosure
      - id: micro-behaviors/communications/messaging/channel/whatsapp/newsletter::whatsapp-newsletter-follow-named-query
