defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: whatsapp-newsletter-invite-lookup
    desc: Looks up a newsletter by invite
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '\.newsletterMetadata$'
      arg: {index: 0, kind: string, exact: invite}

  - id: embedded-invitation-code
    desc: Assigns a literal invitation code
    crit: component
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\b(const|let|var)\s+\w*invite\w*\s*=\s*["''][\w-]{4,40}["'']'

composite_rules:
  # Some forks publish a helper that looks up a channel from an embedded
  # invite token and follows it when the authenticated socket opens. The
  # helper may be unreferenced, so this records the behavior as suspicious
  # rather than claiming that the package's entrypoint activates it.
  - id: whatsapp-session-open-follows-invite-code
    desc: Session-open handler follows an invite-selected newsletter
    crit: suspicious
    conf: 0.97
    near_lines: 24
    all:
      - id: micro-behaviors/data/control-flow/event-callback::connection-update-handler-registration
      - id: metadata/lang/source/syntax/conditional::connection-open-comparison
      - id: whatsapp-newsletter-invite-lookup
      - id: embedded-invitation-code
      - id: micro-behaviors/communications/messaging/channel/whatsapp/newsletter::whatsapp-newsletter-follow-api-call
