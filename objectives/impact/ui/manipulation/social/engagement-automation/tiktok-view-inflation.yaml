# A caller supplies a video ID, then the program repeatedly sends a mobile
# stats request whose body increments its play count. This identifies fake
# engagement automation rather than ordinary TikTok API clients.
defaults:
  platforms: [windows, unix]
  for: [python, scripts, source]
  attack: T1491

composite_rules:
  - id: tiktok-automated-view-count-inflation
    desc: Repeatedly inflates TikTok video play counts
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/http/services/tiktok::tiktok-mobile-view-stats-path
      - id: micro-behaviors/communications/http/services/tiktok::tiktok-view-play-delta-body
      - id: micro-behaviors/data/control-flow/loop/counted::python-range-loop-large-bound
      - id: micro-behaviors/process/thread/create::python-thread-create
    near_bytes: 8192
