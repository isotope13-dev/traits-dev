# accounts "hacked minutes ago" beside a success-rate promise is manufactured
# social proof: nothing delivers a third party's password on demand, so both
# claims are lies told to keep the visitor inside the funnel. The atoms are
# defined with the service-scam family they corroborate.
defaults:
  platforms: [windows, unix]
  for: [html]

composite_rules:
  - id: fabricated-hack-activity-proof
    desc: Fake live hacks and success-rate proof on a page
    crit: hostile
    conf: 0.92
    all:
      - id: objectives/lateral-movement/social-engineering/lures::fabricated-hack-activity-feed
      - id: objectives/lateral-movement/social-engineering/lures::hacked-password-success-rate-claim
