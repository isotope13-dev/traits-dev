# Covert channel attribution in outgoing media.
# A WhatsApp client library builds media payloads on behalf of its host
# application. The composite below catches a builder that substitutes its
# own channel-attribution annotation into messages the caller sent without
# any, so every outgoing media message carries the fork operator's channel
# on the recipient's screen.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  # The annotations a media message carries are sender content: WhatsApp
  # renders the `newsletter` entry as channel attribution. Passing caller
  # annotations through is ordinary; swapping in a built-in array that
  # names a hardcoded channel when the caller supplied none stamps that
  # channel onto every media message the application sends. No client
  # library has a legitimate reason to default somebody else's media
  # annotations to its own channel.
  # Worked example: @nyzzpedia/baileys 1.0.2 / 1.0.3 and
  # @nyzzpediaa/baileys-new 1.0.9 lib/Utils/messages.js.
  - id: media-annotation-hardcoded-channel-default
    desc: Defaults outgoing media annotations to fixed channel
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-media-annotation-newsletter
      - id: micro-behaviors/communications/messaging/channel::whatsapp-media-annotation-default-fallback
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-attribution-jid-literal
    near_bytes: 1600

  # A distinct graft overwrites annotations for image/video uploads rather
  # than defaulting them only when the caller omits them. A fixed channel JID
  # in the assigned newsletter metadata makes the library stamp its operator's
  # channel onto media sent by the host application.
  - id: media-annotation-hardcoded-channel-overwrite
    desc: Overwrites outgoing media annotations with a fixed channel
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-media-annotation-image-video-assignment
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-annotation-array-constant
    any:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-attribution-jid-literal
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-attribution-hex-jid
    near_bytes: 3000
