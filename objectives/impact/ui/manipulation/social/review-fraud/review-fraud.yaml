# Paid-review pages manufacture endorsements by rewarding contributors while
# requiring the resulting consumer story to be positive. Either phrase alone
# is ordinary marketing or gig-work copy; together they establish the biased,
# incentivized content offered by the page without depending on its brand or
# destination domain.
defaults:
  platforms: [unix, windows]
  for: [html]

traits:
  - id: positive-consumer-experience-writing
    desc: Requires writing positive consumer experiences
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(write|submit|share)\b.{0,40}\bpositive (consumer )?experiences?\b'

  - id: explore-advertorials-task
    desc: Offers an explore-advertorials task
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bexplore\s+advertorials?\b'

  - id: comment-advertorials-task
    desc: Offers a comment-advertorials task
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bcomment\s+advertorials?\b'

  - id: read-advertorials-task
    desc: Offers a read-advertorials task
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bread\s+advertorials?\b'

composite_rules:
  - id: varied-advertorial-engagement-tasks
    desc: Offers varied advertorial engagement tasks
    crit: notable
    conf: 0.92
    needs: 2
    any:
      - id: explore-advertorials-task
      - id: comment-advertorials-task
      - id: read-advertorials-task

  - id: incentivized-positive-review-writing
    desc: Pays for explicitly positive consumer stories
    crit: hostile
    conf: 0.97
    all:
      - id: positive-consumer-experience-writing
      - id: varied-advertorial-engagement-tasks
      - id: micro-behaviors/ui/keywords::earnings-call-to-action
    near_bytes: 2500
