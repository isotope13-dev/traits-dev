defaults:
  platforms: [windows, unix]
  for: [html]
  crit: hostile
  conf: 0.98

composite_rules:
  - id: vendor-breach-phone-support-scam
    desc: Fake breach alarm demands vendor-support calls
    all:
      - id: micro-behaviors/ui/dialog/prompt::vendor-support-phone-instruction
      - id: micro-behaviors/ui/dialog/prompt::urgent-support-protection-installation
      - id: micro-behaviors/ui/dialog/prompt::vendor-security-breach-alarm
      - id: micro-behaviors/ui/dialog/prompt::personal-data-transfer-alarm
