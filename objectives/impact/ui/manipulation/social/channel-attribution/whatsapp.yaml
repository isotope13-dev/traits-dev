defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: archive-default-follow-and-forged-attribution
  desc: Silently follows and promotes a preset channel
  crit: hostile
  conf: 0.99
  for:
  - javascript
  - typescript
  - npm
  - tar
  - zip
  scope: archive
  all:
  - id: objectives/impact/ui/manipulation/social/channel-follow::archive-default-auto-follow-newsletter
  - id: preset-forwarded-whatsapp-newsletter-attribution

- id: forged-official-whatsapp-newsletter-attribution
  desc: Official WhatsApp ContextInfo attribution
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/communications/messaging/channel/whatsapp/contextinfo::whatsapp-contextinfo-official-attribution
  - id: micro-behaviors/communications/messaging/send::whatsapp-relay-message-call
- id: forged-viral-whatsapp-forward
  desc: Extreme count in WhatsApp ContextInfo
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/communications/messaging/channel/whatsapp/contextinfo::whatsapp-contextinfo-extreme-forwarding
  - id: micro-behaviors/communications/messaging/send::whatsapp-relay-message-call
- id: relayed-status-context-with-extreme-forwarding
  desc: Relays message with status context and extreme forwarding
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/communications/messaging/channel/whatsapp/contextinfo::whatsapp-messagecontextinfo-extreme-forwarding
  - id: micro-behaviors/communications/messaging/channel/whatsapp/contextinfo::whatsapp-messagecontextinfo-status-broadcast
  - id: micro-behaviors/communications/messaging/channel/whatsapp/newsletter::whatsapp-forwarded-newsletter-attribution
  - id: micro-behaviors/communications/messaging/send::whatsapp-relay-message-call
  near_lines: 80
# The helper-built sibling of forged-official-whatsapp-newsletter-attribution:
# the official identity sits in a reusable preset object and reaches the message
# through a variable, so neither the inline-literal attribution leg nor the
# newsletterName-literal leg resolves. The identifier-valued forwarded stamp
# beside the official-identity preset is the same forgery -- outgoing messages
# dressed as quotes from the official WhatsApp / Meta AI channels, here with a
# fake-quote builder (random stanza id, fromMe-false key, verifiedBizName) on
# top. No client library has a legitimate reason to resolve the platform's own
# identities into message metadata.
# Worked example: @revizahoshii/baileys 0.5.0 / 0.5.1
# lib/Utils/verified-reply-utils.js.
- id: preset-built-official-whatsapp-newsletter-attribution
  desc: Preset-built official WhatsApp attribution on messages
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/communications/messaging/channel/whatsapp/newsletter::whatsapp-forwarded-newsletter-identifier-value
  - id: micro-behaviors/communications/messaging/channel/whatsapp/newsletter::whatsapp-official-channel-identity-preset
  near_bytes: 4000
# A fixed publisher-owned newsletter identity is stamped into
# forwardedNewsletterMessageInfo on a client-built message and then relayed
# to a recipient. This forges forwarded-channel attribution even when the
# selected channel is not an official WhatsApp identity.
- id: preset-forwarded-whatsapp-newsletter-attribution
  desc: Relays message with preset newsletter attribution
  crit: hostile
  conf: 0.97
  scope: file
  all:
  - id: micro-behaviors/communications/messaging/channel/whatsapp/newsletter::whatsapp-forwarded-newsletter-attribution
  - id: micro-behaviors/communications/messaging/channel/whatsapp/newsletter::whatsapp-newsletter-field-before-server-id
  - id: micro-behaviors/communications/messaging/channel/whatsapp/newsletter::whatsapp-newsletter-attribution-jid-literal
  - id: micro-behaviors/communications/messaging/send::whatsapp-relay-message-call
  near_bytes: 16000

# The AI-bot counterpart of preset-forwarded-whatsapp-newsletter-attribution.
# A client stamps `forwardedAiBotMessageInfo: { botJid }` on a message it builds
# and relays it, so the recipient sees the message forwarded from a platform
# AI assistant (Meta AI). The bot JID literal in the same file names the
# identity being forged. Real bot frameworks that answer as their own bot do
# not need the platform assistant's JID. Suspicious on its own: a single
# legitimate rich-response helper could stamp it, so the library-level
# hostile composite lives in objectives/supply-chain/trojanized/library/fork-branding.
- id: forged-meta-ai-bot-forward-attribution
  desc: Relays message forged as AI-bot forward
  crit: suspicious
  conf: 0.93
  scope: file
  all:
  - id: micro-behaviors/communications/messaging/whatsapp::whatsapp-forwarded-ai-bot-attribution
  - id: micro-behaviors/communications/messaging/whatsapp::whatsapp-ai-bot-jid-literal
  - id: micro-behaviors/communications/messaging/send::whatsapp-relay-message-call
  near_bytes: 16000

# Proximity does not establish that these fields belong to the same message,
# or that either attribution is false. Retain the co-occurrence as context.
- id: forged-ai-authorship-with-channel-attribution
  desc: Relays messages near AI flag and newsletter attribution
  crit: notable
  conf: 0.95
  scope: file
  all:
  - id: micro-behaviors/communications/messaging/send::whatsapp-forged-ai-message-support-flag
  - id: micro-behaviors/communications/messaging/channel/whatsapp/newsletter::whatsapp-forwarded-newsletter-attribution
  - id: micro-behaviors/communications/messaging/send::whatsapp-relay-message-call
  near_bytes: 16000
