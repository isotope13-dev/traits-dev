# A remote response supplies targets for authenticated social actions.
defaults:
  platforms: [android, ios, unix]
  for: [javascript, typescript]

composite_rules:
  - id: remote-config-social-follow-like-automation
    desc: Backend targets drive authenticated follows and likes
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/collection/map::users-list-map
      - id: metadata/lang/source/syntax/call/invocation::follow-method-call-form
      - id: micro-behaviors/data/collection/map::posts-list-map
      - id: metadata/lang/source/syntax/call/invocation::like-method-call-form
      - id: micro-behaviors/communications/http/get/
      - id: metadata/lang/source/syntax/call/relationship::login-auto-verification-call
      - id: micro-behaviors/communications/http/header/custom::instagram-private-api-headers
    near_bytes: 12000
