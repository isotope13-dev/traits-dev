# A remote response supplies targets for authenticated social actions.
defaults:
  platforms: [android, ios, unix]
  for: [javascript, typescript]
  attack: T1491

traits:
  - id: remote-user-list
    desc: Maps a remote user list
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: data.users.map
  - id: social-follow-action
    desc: Calls a social follow action
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\.follow\s*\('
  - id: remote-post-list
    desc: Maps a remote post list
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: data.posts.map
  - id: social-like-action
    desc: Calls a social like action
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\.like\s*\('

composite_rules:
  - id: remote-config-social-follow-like-automation
    desc: Backend targets drive authenticated follows and likes
    crit: hostile
    conf: 0.96
    all:
      - id: remote-user-list
      - id: social-follow-action
      - id: remote-post-list
      - id: social-like-action
      - id: micro-behaviors/communications/http/get/
    near_bytes: 12000
