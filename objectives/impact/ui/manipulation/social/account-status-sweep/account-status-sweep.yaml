# Bulk account-health sweep across social-account containers.
#
# An extension that lists browser identity containers, holds a social-network
# host permission, injects code into those tabs, and reads ban or disabled
# wording from the page is checking many accounts' standing at once. The same
# controls serve legitimate account management, so the composite is grayware
# suspicion, not a hostile verdict. The sweep is what separates it from a single
# user-facing container tool: nothing here clicks or posts, it only reads state.
defaults:
  crit: suspicious
  platforms: [unix, windows]

composite_rules:
  - id: multi-container-account-status-sweep
    desc: Container extension scans social account status across containers
    conf: 0.85
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript]
    all:
      - id: metadata/permission/extension-api::permission-contextual-identities
      - id: metadata/permission/host::host-permission-facebook
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
      - id: metadata/lang/natural/phrasing/account::account-disabled-message
