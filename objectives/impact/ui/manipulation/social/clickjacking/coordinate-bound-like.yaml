defaults:
  for: [html]
  platforms: [windows, unix]
composite_rules:
  - id: coordinate-bound-like-frame-trap
    desc: Like iframe follows cursor and removes itself
    crit: hostile
    conf: 0.97
    near_bytes: 6000
    all:
      - id: micro-behaviors/time/schedule/callback::timed-dom-removal
      - id: micro-behaviors/hardware/input/event::user-activity-event-listener
    any:
      - id: micro-behaviors/ui/controls/widget::constructed-like-iframe-coordinate-position
      - id: micro-behaviors/ui/controls/widget::markup-like-iframe-coordinate-position
