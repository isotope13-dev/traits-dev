# Feed twin of the pointer-following Like-iframe traps in clickjacking.yaml.
# Blogger and other feeds syndicate post HTML entity-escaped (`&#39;`,
# `&quot;`), and the engine types a feed as xml, so the HTML-scoped atoms
# never read the script. The trap is the same: the post's script creates an
# iframe, forces it fully transparent, and on every mousemove rewrites its
# top/left from the pointer coordinates so the visitor's next click lands on
# the invisible frame (Like-jacking, ad click fraud). A visible widget that
# follows the pointer is not transparent; a transparent frame that stays put
# is not glued to the pointer.
defaults:
  platforms: [windows, unix]
  for: [xml]
  attack: T1185

composite_rules:
  - id: feed-post-transparent-pointer-frame-trap
    desc: Feed post glues invisible iframe to pointer
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/format/xml::syndication-feed-root
      - id: micro-behaviors/data/format/xml::feed-script-transparent-iframe-tracks-pointer
