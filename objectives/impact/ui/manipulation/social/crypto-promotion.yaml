# Coordinated memecoin promotion and holder-pressure playbooks.  The
# individual words are ordinary marketing language; the combination of
# engineered FOMO/anti-exit tactics with raid coordination is the hostile
# behavior these agent skills operationalize.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  attack: T1491,T1583.008

traits:
  - id: skill-crypto-cult-builder
    desc: Crypto community cult-building language
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Cult Builder|turn holders into believers'

  - id: skill-crypto-anti-exit-pressure
    desc: Crypto holder anti-exit or diamond-hand pressure
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(exit prevention systems|diamond hand cultivation|make holders diamond hand)'

  - id: skill-crypto-raid-coordination
    desc: Coordinated crypto social-media raids
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(raid coordination|coordinated Twitter raids|RAID TARGET:|raid materials)'

  - id: skill-memecoin-fomo-pumping
    desc: Memecoin pumping and engineered FOMO
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(memecoin|meme coin).{0,220}(FOMO|pumping|pump|virality|engagement farming)'

composite_rules:
  - id: hostile-crypto-promotion-agent-skill
    desc: Agent skill operationalizes coercive crypto promotion
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: skill-crypto-raid-coordination
    any:
      - id: skill-crypto-anti-exit-pressure
      - id: skill-memecoin-fomo-pumping
      - id: skill-crypto-cult-builder
    needs: 1
