defaults:
  platforms: [windows]
  for: [ne, batch, data]

# A builder that writes ANSI-bomb batch files names the payload type in its own
# text. Names alone do not remap keys; the composite needs the Enter-terminated
# key redefinition that the builder emits into each generated file.
traits:
  - id: ansi-bomb-builder-text
    desc: Text names an ANSI-bomb keyboard payload
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)ansi-?bomb'

composite_rules:
  - id: ansi-bomb-keyboard-remap-builder
    desc: Builds ANSI-bomb batch files that remap keyboard keys
    crit: hostile
    conf: 0.95
    all:
      - id: ansi-bomb-builder-text
      - id: micro-behaviors/hardware/input/keyboard/layout::ansi-key-redefine-enter-terminator
