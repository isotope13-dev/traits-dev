defaults:
  platforms: [windows, unix]
  for: [dos_com]
traits:
  # BIOS AH=10h removes a key, MOV CX,AX/INC CL corrupts its ASCII byte,
  # and AH=05h puts it back. The intervening alternate path substitutes
  # successive CS-resident message bytes, resetting at the terminator.
  # Addresses and message contents are not fixed to a particular build.
  - id: dos-keystroke-corruption-message-cycle
    desc: Corrupts keys and cycles replacement message
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: >-
        B4 10 CD 16 8B C8 FE C1
        2E 80 3E ?? ?? 00 74 ??
        2E 8B 1E ?? ?? 2E 8A 8F ?? ?? 2E FF 06 ?? ??
        0A C9 75 ?? 2E C7 06 ?? ?? 00 00 B1 ??
        2E F6 16 ?? ?? B4 05 CD 16

composite_rules:
  - id: dos-keyboard-interrupt-input-sabotage
    desc: Keyboard hook corrupts keys with message bytes
    crit: hostile
    conf: 0.98
    all:
      - id: dos-keystroke-corruption-message-cycle
      - id: micro-behaviors/os/msdos/interrupt::dos-int09-vector-get-then-set
