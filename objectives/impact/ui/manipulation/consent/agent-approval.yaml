# Automatic approval of AI-agent tool prompts inside an IDE.
#
# "Always Allow" / "Allow once" are the buttons an AI coding agent shows before
# it edits a file or runs a terminal command — the single human gate on
# agent-initiated code execution. Code that enumerates those labels, finds the
# matching element, and dispatches a synthetic click has removed that gate: the
# agent (or anything that can steer it, including prompt injection in a fetched
# page) now runs commands with no confirmation.
#
# The legs are label-shape and technique, not this project's identifiers, so a
# reimplementation with different function names still trips them. The CDP leg
# is what separates this from an extension clicking a button in its own
# webview: the script is injected into the IDE's own window over the debug
# port, which is not a surface the extension owns.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: "T1059.007,T1204.001"

# The grant-label atom now lives in micro-behaviors/ui/dialog/prompt/ -- it
# matches approval-prompt button text, which every agent UI that renders such a
# prompt carries, so it is a UI capability rather than an objective. The intent
# here comes from the legs beside it: finding that button and clicking it.
composite_rules:
  - id: vscode-agent-action-auto-approval
    desc: VS Code extension auto-approves agent actions
    crit: hostile
    conf: 0.97
    for: [javascript, typescript, archives]
    scope: archive
    unless:
      - id: well-known/app/development/vscode-extension/auto-retry-agent::declared-auto-accept-product
      - id: well-known/app/development/vscode-extension/auto-retry-agent::auto-retry-package-identity
    all:
      - id: metadata/library/vscode::vscode-extension-marker
      - id: micro-behaviors/ui/dialog/prompt::agent-permission-grant-labels
      - id: micro-behaviors/ui/window/manage/automation::dom-dispatch-click-call
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-runtime-evaluate
