# Browser extensions that nag the user back into data sharing after they turn
# it off: an in-page banner that appears only while the consent flag is off and
# whose primary button writes that flag back to true.
#
# This is a dark pattern, not an attack — the user still has to click, the
# setting is still theirs, and re-asking for optional analytics has legitimate
# uses (the QVI panel extensions, well-known/unwanted/qvi, show such a banner
# exactly once and honour the dismissal). It stays suspicious; hostile is
# reserved for consent that is bypassed rather than re-requested.
#
# The matchers deliberately name the *shape* (an opt-out/consent-named banner,
# a consent-ish storage key set to true) rather than one product's identifiers,
# so a differently-named nagger is still caught.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1176

traits:
  - id: opt-out-banner-dom-id
    desc: Opt-out banner element id attribute
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']opt-?out-(banner|modal|bar|prompt)'

  - id: opt-out-banner-getelement
    desc: Looks up an opt-out banner by id
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'getElementById\(["'']opt-?out-'

  - id: opt-out-banner-toggle-fn
    desc: Show/hide helper for an opt-out banner
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\b(show|hide)Opt-?Out(Banner|Modal)\b'

  - id: tracking-consent-storage-enable
    desc: Extension storage write enables data sharing
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'storage\.\w+\.set\(\s*\{\s*\w*(nsights|onsent|racking)\w*\s*:\s*true'

composite_rules:
  - id: opt-out-banner-element
    desc: Opt-out consent banner DOM element
    crit: notable
    conf: 0.92
    any:
      - id: opt-out-banner-dom-id
      - id: opt-out-banner-getelement
      - id: opt-out-banner-toggle-fn

  # Injecting the banner into a page the extension does not own (appendChild
  # from a content script) is what makes this a nag rather than an ordinary
  # options-page control, so the DOM insertion is required, not optional.
  - id: extension-opt-out-reconsent-banner
    desc: Extension banner re-enables its own tracking
    crit: suspicious
    conf: 0.94
    scope: archive
    all:
      - id: opt-out-banner-element
      - id: tracking-consent-storage-enable
      - id: micro-behaviors/browser-extension/lifecycle::chrome-namespace
      - id: micro-behaviors/ui/window/manage/dom::browser-append-child
    unless:
      - id: well-known/unwanted/qvi::disclosed-qvi-panel-context
      # The family marker and this behavior live together in baner.js, while
      # the two backend URLs used by the archive-level context do not.  Keep
      # the local exception so known QVI builds are not double-counted.
      - id: well-known/unwanted/qvi::qvi-reconsent-banner
