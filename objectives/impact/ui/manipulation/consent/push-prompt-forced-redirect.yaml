# Push-notification ad-network landing config (pm_appKey / pm_allowAction /
# pm_denyAction): the page asks for notification permission and sends the
# visitor to the same traffic-broker URL whether they click Allow or Block,
# so declining does not end the funnel. This is push-ad monetization
# (adware), not code execution, so it stays suspicious.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
traits:
  - id: push-prompt-deny-action-redirect
    desc: Push prompt deny handler navigates away
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\w*deny\w*\s*=\s*function\s*\(\)\s*\{\s*(window\.)?location\.replace\("https?:'
  - id: push-prompt-allow-action-redirect
    desc: Push prompt allow handler navigates away
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\w*allow\w*\s*=\s*function\s*\(\)\s*\{\s*(window\.)?location\.replace\("https?:'
  - id: push-application-server-key-literal
    desc: Embeds a web-push application server key
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)appKey\s*=\s*"B[A-Za-z0-9_-]{80,90}"'
composite_rules:
  - id: push-prompt-redirects-on-allow-and-deny
    desc: Push prompt redirects on both Allow and Block
    crit: suspicious
    conf: 0.9
    near_bytes: 600
    all:
      - id: push-prompt-deny-action-redirect
      - id: push-prompt-allow-action-redirect
      - id: push-application-server-key-literal
