# Browser extensions that intercept user link clicks on third-party pages and
# reroute navigation through extension-controlled handlers.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, archives]
  attack: T1185,T1566

traits:
  - id: extension-link-click-sendmessage-open
    desc: Blocks clicks then opens URL via extension
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: 'preventDefault\s*\(\s*\)[\s\S]{0,500}sendMessage\s*\(\s*\{[^}]{0,160}\burl\s*:'

  - id: iphone-mobile-webkit-user-agent-literal
    desc: iPhone Mobile Safari user-agent literal
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: 'iPhone;\s*CPU\s+iPhone\s+OS[^"'']{0,80}AppleWebKit[^"'']{0,80}Mobile'

composite_rules:
  - id: extension-global-link-click-hijack
    desc: Extension hijacks page link clicks globally
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: extension-link-click-sendmessage-open
      - id: metadata/permission/host::broad-host-access

  - id: extension-dnr-mobile-user-agent-spoof
    desc: Extension spoofs mobile user-agent for site API
    crit: hostile
    conf: 0.96
    attack: T1036,T1185
    scope: file
    all:
      - id: micro-behaviors/os/network/webextension::chrome-dnr-user-agent-header-set
      - id: iphone-mobile-webkit-user-agent-literal

  # Rewriting the host of a *top-level navigation* through declarativeNetRequest
  # means the user can type or click one domain and be served by another, with
  # no redirect step visible in the address bar and no code running in the page.
  # Vendor domain migrations look like this too, which is why it stops at
  # suspicious — but transparent origin substitution over main-frame loads is
  # exactly the primitive a hijacker wants, and the declaration is invisible in
  # the extension's own JavaScript.
  - id: extension-dnr-main-frame-host-substitution
    desc: Extension silently substitutes the navigation host
    crit: suspicious
    conf: 0.9
    attack: T1176
    for: [json, crx, xpi, zip]
    scope: archive
    all:
      - id: metadata/permission/network::dnr-host-rewrite-transform
      - id: metadata/permission/network::dnr-main-frame-condition
