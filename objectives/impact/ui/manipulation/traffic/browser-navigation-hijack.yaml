# Browser extensions that intercept user link clicks on third-party pages and
# reroute navigation through extension-controlled handlers.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip]
  attack: T1185,T1566

composite_rules:
  - id: extension-global-link-click-hijack
    desc: Extension hijacks page link clicks globally
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/ui/window/click::extension-document-link-click-forwarding
      - id: metadata/permission/host::broad-host-access
    unless:
      # Download-manager companions cancel the same clicks for the user's own
      # downloader: the handler only fires on anchors carrying the HTML
      # download attribute, routes the file to a local app, and falls back to
      # the native download. That gating is the difference between handling
      # downloads and hijacking navigation.
      - id: download-gated-click-interception-context

  # A download-manager companion performs the forwarding pattern above, but
  # only for file downloads: the click handler checks the anchor's download
  # attribute before cancelling anything. Assembled from notable capability
  # facts so it suppresses only the download-gated shape; an extension that
  # cancels unscoped link clicks still convicts.
  - id: download-gated-click-interception-context
    desc: Download-gated click interception context
    crit: exception
    conf: 0.96
    for: [javascript, typescript]
    near_lines: 140
    all:
      - id: micro-behaviors/ui/window/click::browser-global-click-listener
      - id: micro-behaviors/ui/window/click::clicked-anchor-url-read
      - id: micro-behaviors/ui/window/click::download-attribute-gate
      - id: micro-behaviors/communications/ipc/message::cancelled-event-url-runtime-message

  - id: extension-dnr-mobile-user-agent-spoof
    for: [javascript]
    desc: Extension spoofs mobile user-agent for site API
    crit: hostile
    conf: 0.96
    attack: T1036,T1185
    scope: file
    all:
      - id: micro-behaviors/os/network/webextension::chrome-dnr-user-agent-header-set
      - id: micro-behaviors/communications/http/user-agent::iphone-mobile-safari-user-agent-literal

  # Rewriting the host of a *top-level navigation* through declarativeNetRequest
  # means the user can type or click one domain and be served by another, with
  # no redirect step visible in the address bar and no code running in the page.
  # Vendor domain migrations look like this too, which is why it stops at
  # suspicious — but transparent origin substitution over main-frame loads is
  # exactly the primitive a hijacker wants, and the declaration is invisible in
  # the extension's own JavaScript.
  - id: extension-dnr-main-frame-host-substitution
    desc: Extension silently substitutes the navigation host
    crit: suspicious
    conf: 0.9
    attack: T1176
    for: [json, crx, xpi, zip]
    scope: archive
    all:
      - id: metadata/permission/network::dnr-host-rewrite-transform
      - id: metadata/permission/network::dnr-main-frame-condition
