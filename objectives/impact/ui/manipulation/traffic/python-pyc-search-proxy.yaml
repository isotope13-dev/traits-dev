defaults:
  platforms: [windows, unix]
  for: [pyc]
  attack: T1557,T1185

traits:
  - id: pyc-mitmproxy-identifier
    desc: Bytecode references mitmproxy
    crit: notable
    if:
      type: symbol
      kind: identifier
      exact: mitmproxy
  - id: pyc-search-redirect-identifier
    desc: Bytecode names search redirect logic
    crit: notable
    if:
      type: symbol
      kind: identifier
      regex: '(?i)(search.{0,20}redirect|redirect.{0,20}search)'
  - id: pyc-search-domain-identifier
    desc: Bytecode references search domains
    crit: notable
    if:
      type: symbol
      kind: identifier
      exact: search_domains
  - id: pyc-query-identifier
    desc: Bytecode references query
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: query
  - id: pyc-search-query-destination
    desc: Bytecode embeds a search query endpoint
    crit: notable
    if:
      type: text
      regex: 'https?://[a-zA-Z0-9.-]{1,90}/search[a-zA-Z0-9/_-]{0,25}\?q='

composite_rules:
  - id: pyc-search-intercept-redirect
    desc: Bytecode combines search interception and redirect
    crit: hostile
    conf: 0.97
    all:
      - id: pyc-mitmproxy-identifier
      - id: pyc-search-redirect-identifier
      - id: pyc-search-domain-identifier
      - id: pyc-query-identifier
      - id: pyc-search-query-destination
