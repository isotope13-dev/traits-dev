# A same-origin child can modify its parent document, but combining that access
# with an injected script, an oversized child-frame request, and a query-chosen
# logout destination is navigation abuse rather than an ordinary embedded app.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1185

traits:
  - id: dynamic-host-logout-template
    desc: Dynamic HTTPS host targets logout endpoint
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'https://\$\{[^}\r\n]{1,180}\}/logout'

composite_rules:
  - id: cross-frame-logout-navigation-hijack
    desc: Injected parent script forces query-selected logout navigation
    crit: hostile
    conf: 0.99
    near_bytes: 1600
    all:
      - id: micro-behaviors/process/create/load/local::dom-inline-script-text-execution
      - id: micro-behaviors/ui/window/manage/dom::parent-document-body-append
      - id: micro-behaviors/ui/window/manage/navigation::indexed-child-location-write
      - id: micro-behaviors/communications/http/url/query::oversized-repeated-query-value
      - id: dynamic-host-logout-template
