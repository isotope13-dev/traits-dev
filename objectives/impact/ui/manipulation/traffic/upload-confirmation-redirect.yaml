defaults:
  platforms: [windows, unix]
  for: [html]

composite_rules:
  - id: upload-confirmation-stub-external-redirect
    desc: Small upload-confirmation page immediately redirects offsite
    crit: suspicious
    conf: 0.9
    size_max: 2048
    all:
      - id: micro-behaviors/ui/window/navigation::meta-refresh-instant-external
      - id: upload-completion-message

traits:
  - id: upload-completion-message
    desc: Page claims upload completed
    crit: component
    if:
      type: text
      regex: '(?i)\b(file\s+uploaded|upload\s+complete)\b'
