defaults:
  platforms: [windows, unix]
  for: [html]

composite_rules:
  - id: upload-confirmation-stub-external-redirect
    desc: Small upload-confirmation page immediately targets HTTP(S) URL
    crit: suspicious
    conf: 0.9
    size_max: 2048
    all:
      - id: micro-behaviors/ui/window/navigation::meta-refresh-instant-external
      - id: metadata/document/html::upload-completion-message
