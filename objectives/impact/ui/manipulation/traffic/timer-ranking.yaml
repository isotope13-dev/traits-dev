defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  - id: timed-ranking-popup-visits
    desc: Timed ranking referrals accompany blank-window navigation
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/ui/window/navigation::timer-ranking-entry-url
      - id: micro-behaviors/ui/window/navigation::assigned-global-open-blank-window
      - id: micro-behaviors/ui/window/navigation::window-variable-location-assignment
