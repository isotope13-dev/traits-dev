# Browser-extension search hijack via webRequest redirect plus tab URL beacon.
# Covers AI-branded (and other) extension infostealers that rewrite SERP
# navigation and exfiltrate browsing telemetry in real time.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1176,T1185,T1041
  mbc: B0030

composite_rules:
  - id: extension-webrequest-search-redirect
    desc: Extension webRequest redirects search traffic
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/hook/webextension::webrequest-block-or-redirect
      - id: micro-behaviors/communications/url/host/domain-http::search-engine-hostname-gate
      - id: micro-behaviors/communications/http/redirect::redirect-url-object-field

  - id: extension-webrequest-search-redirect-tab-beacon
    desc: Search redirect extension beacons tab URLs
    crit: hostile
    conf: 0.98
    all:
      - id: extension-webrequest-search-redirect
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-query
      - id: micro-behaviors/communications/http/request/json::http-post-json
    near_bytes: 12000
