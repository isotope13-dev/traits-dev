defaults:
  platforms: [unix, windows]
  for: [json, chrome-manifest, javascript, typescript, crx]

traits:
  - id: browser-brand-search-provider-host
    desc: Browser-brand search provider host marker
    crit: notable
    conf: 0.9
    for: [json, chrome-manifest]
    if:
      type: value
      path: chrome_settings_overrides.search_provider.search_url
      regex: 'https?://[^/"'']*(chrome[-_]?crx|crx[-_]?store|extension[-_]?store|web[-_]?store)[^/"'']*/'
      case_insensitive: true
      not:
        - regex: '^https?://[^/"'']*\.google\.[^/"'']+/'

  - id: hosted-search-affiliate-url-in-extension-code
    desc: Hosted search affiliate URL in extension code
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html]
    if:
      type: text
      regex: 'https?://[^"''\s]{1,160}/(yhs/)?search\?[^"''\s]{0,160}[?&](hspart|hsimp)='
      case_insensitive: true

  - id: search-provider-redirect-endpoint
    desc: Search provider URL is a redirect endpoint
    crit: suspicious
    conf: 0.9
    for: [json, chrome-manifest]
    attack: T1176
    if:
      # A real engine answers on a search path -- `/search?q=`, `/?q=`. A
      # declared provider whose URL is `/link?`, `/go?` or `/redirect?` is not
      # answering the query at all; it is bouncing it onward, which is where
      # the affiliate tag gets attached and how the user's chosen engine is
      # kept out of the loop. Seen as
      # `earthapp.net/admin/public/link?q={searchTerms}` behind an extension
      # named for a map.
      type: value
      path: chrome_settings_overrides.search_provider.search_url
      regex: '(?i)/(link|go|(get-)?redirect(ion)?)\?'

  - id: search-provider-image-url-html-page
    desc: Search provider image URL is HTML page
    crit: notable
    conf: 0.9
    for: [json, chrome-manifest]
    if:
      # A real engine answers image queries from an image endpoint. A provider
      # whose image_url is a static `.html` page has no image backend at all --
      # the "engine" is a shell that only receives the seized queries.
      type: value
      path: chrome_settings_overrides.search_provider.image_url
      regex: '\.html?([?#]|$)'
      case_insensitive: true

  - id: serp-safe-status-label
    desc: Marks a destination as safe
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'dataset\.[\w$]*Status\s*=\s*.safe'

  - id: serp-affiliate-label
    desc: Labels an affiliate link
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: Affiliate Link

  - id: install-windows-getall-downloaded-redirect
    desc: Redirects open tabs to downloaded.html
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)windows\.getAll[\s\S]{0,260}tabs\.update.{0,60}downloaded\.html'

  - id: cws-tab-remove-and-lp-ext-installed-hash
    desc: Updates landing tab hash to ext-installed
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)chrome\.tabs\.remove[\s\S]{0,420}updateHash.{0,40}ext-installed'

  - id: newtab-hidden-tracking-inputs-search-form
    desc: Appends hidden ISID inputs to searchForm
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)searchForm[\s\S]{0,300}ISID[\s\S]{0,300}type\s*=\s*["'']hidden["'']'

  - id: newtab-hidden-cnvrt-welcome-iframe
    desc: Creates hidden welcome attribution iframe
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)style\.display\s*=\s*["'']none["''][\s\S]{0,160}/pages/welcome\?inst=1&alias='

composite_rules:
  - id: install-all-windows-tab-hijack-and-cws-close
    desc: Search override redirects open tabs to downloaded page and closes CWS popup
    crit: hostile
    conf: 0.98
    attack: T1176
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript, typescript]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: install-windows-getall-downloaded-redirect
      - id: objectives/evasion/security-bypass/policy/browser::cws-or-popup-tab-forcible-close

  - id: newtab-override-cws-tab-close-and-lp-redirect
    desc: Newtab extension closes Chrome Web Store tab and updates landing page tab
    crit: hostile
    conf: 0.98
    attack: T1176
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript, typescript]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: objectives/evasion/security-bypass/policy/browser::cws-or-popup-tab-forcible-close
      - id: cws-tab-remove-and-lp-ext-installed-hash

  - id: wim-search-hijack-self-uninstall-and-cookie-state
    desc: WIM search takeover with scripted self-uninstall and tracking cookies
    crit: hostile
    conf: 0.98
    attack: T1176
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript, typescript]
    all:
      - id: metadata/permission/manifest::chrome-search-provider-override
      - id: micro-behaviors/browser-extension/lifecycle::management-uninstall-self-dialog
      - id: micro-behaviors/communications/http/url/api-path/route::wim-gotohub-uninstall-endpoint

  - id: newtab-hidden-tracking-inputs-search-redirect
    desc: Newtab override injects hidden tracking inputs into search form
    crit: hostile
    conf: 0.98
    attack: T1176
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript, typescript]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: newtab-hidden-tracking-inputs-search-form
      - id: micro-behaviors/communications/http/services/analytics::extension-click-attribution-fields

  - id: newtab-hidden-conversion-iframe-and-search-override
    desc: Search and newtab override injects hidden conversion attribution iframe
    # The hidden frame loads the vendor's own welcome page to record the
    # install conversion; covert attribution, not an attack on the user.
    crit: suspicious
    conf: 0.98
    attack: T1176
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript, typescript]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: newtab-hidden-cnvrt-welcome-iframe

  # A declared default provider hands every omnibox query to an extension's
  # own endpoint. Preserve the consented alternate-engine use case as
  # suspicious; campaign context and response behavior raise severity.
  - id: serp-result-links-uploaded-and-rewritten
    desc: Search-page collection and URL replacement
    crit: suspicious
    conf: 0.98
    # These operations must occur together in a content script. An archive
    # can otherwise combine a navigation menu, fetch utility and billing page.
    scope: file
    near_bytes: 12000
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/collection/dom::search-result-link-selector
      - id: micro-behaviors/communications/http/request/client::http-method-calls
      - id: micro-behaviors/ui/window/navigation/location::javascript-href-write
    any:
      - id: micro-behaviors/data/serialize/json::url-list-stringify
      - id: micro-behaviors/communications/http/request/body/form-field::url-list-form-field

  - id: search-result-redirect-marked-as-safe
    desc: Rewritten result claims safe status
    crit: suspicious
    conf: 0.96
    # File scope: near_bytes binds the label to the href write in one script.
    for: [javascript, typescript]
    near_bytes: 900
    all:
      - id: micro-behaviors/ui/window/navigation/location::javascript-href-write
    any:
      - id: serp-safe-status-label
      - id: serp-affiliate-label
  # A service-controlled replacement URL applied to search results, presented
  # to users as a verified safe destination, is a deceptive traffic diversion.
  - id: extension-search-results-service-redirect
    desc: Rewrites search-result links from a remote service
    crit: suspicious
    conf: 0.95
    attack: T1176,T1185,T1036
    scope: archive
    for: [crx, xpi, zip, javascript, typescript]
    all:
      - id: serp-result-links-uploaded-and-rewritten
      - id: search-result-redirect-marked-as-safe

  # Remote tab routing from decoded JSON policy is an active browser hijack.
  # The decode/cache behavior and navigation behavior are separate evidence;
  # this rule intentionally does not claim browsing-data exfiltration.
  - id: remote-host-policy-navigation-hijack
    desc: Remote host policy silently redirects matching browser tabs
    crit: hostile
    conf: 0.99
    attack: T1176,T1185,T1105
    scope: archive
    for: [crx, xpi, zip, javascript, typescript]
    all:
      - id: objectives/supply-chain/hidden-payload/extensions/backdoor::remote-navigation-policy-decode-cache
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-on-updated
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-update-with-url

  # The provider grant plus a destination that only forwards. Either alone is
  # ordinary -- extensions may set a search engine, and redirectors exist --
  # but an extension that takes the default-search grant and spends it on a
  # bounce endpoint is monetizing the query, not serving it.
  - id: search-override-through-redirect-endpoint
    desc: Search override points at a redirect endpoint
    crit: suspicious
    conf: 0.93
    attack: T1176
    scope: archive
    all:
      - id: search-provider-redirect-endpoint
    any:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/manifest::chrome-search-provider-override

  # A default-search override that also ships static redirect rules. The
  # override alone is how an honest search extension works -- the user picks
  # it, the browser asks for confirmation, and queries typed in the omnibox go
  # to the new provider. Redirect rules are for the queries that did *not* go
  # there: searches issued from a page, a sidebar, or another engine the user
  # kept. Shipping both means the takeover is not meant to be escapable.
  - id: search-override-with-redirect-rules
    desc: Search override ships network redirect rules
    crit: suspicious
    conf: 0.93
    attack: T1176
    scope: archive
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
    any:
      - id: metadata/file/format/browser-extension::dnr-redirect-named-ruleset
      - id: metadata/file/format/browser-extension::dnr-redirect-named-ruleset-file

  # Static DNR rules can hide the redirect in a sibling rules.json instead of
  # in the service worker.  The authority-plus-main-frame combination is the
  # archive-level equivalent of the runtime redirect rule above.
  - id: search-override-static-main-frame-redirect
    for: [crx, xpi, chrome-manifest, json]
    desc: All-site search hijack redirects top-level pages via static rules
    crit: hostile
    conf: 0.98
    attack: T1176,T1185
    scope: archive
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/host::host-permission-all-urls
      - id: metadata/permission/network::dnr-main-frame-condition
      - id: metadata/permission/extension-api::search-provider-search-token

  # The same pair with the monetization evidence attached: the destination is
  # a search-branded host carrying a `{searchTerms}` template and a source tag,
  # so the redirected queries are being sold on.
  - id: monetized-search-override-redirect
    desc: Monetized search override with redirect rules
    crit: suspicious
    conf: 0.95
    attack: T1176
    scope: archive
    all:
      - id: extension-search-monetization
      - id: search-override-with-redirect-rules

  - id: extension-remote-php-navigation-abuse
    desc: Extension cache-busts PHP control endpoint into navigation
    crit: hostile
    conf: 0.98
    attack: T1176,T1071.001
    for: [javascript]
    all:
      - id: objectives/supply-chain/hidden-payload/extensions/backdoor::extension-remote-window-open-backdoor
      - id: micro-behaviors/communications/url/resource-path/file::url-php-endpoint-script
      - id: micro-behaviors/communications/http/request/url::fetch-no-store-cache

  - id: extension-conditional-navigation-hijack
    desc: Extension hijacks navigation and reports it
    crit: hostile
    conf: 0.98
    attack: T1185,T1041,T1176
    for: [javascript, typescript]
    near_bytes: 3000
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-webnavigation-before-navigate
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-update-with-url
      - id: micro-behaviors/communications/url/navigation-http::js-url-host-read
      - id: micro-behaviors/communications/http/request/json::http-post-json
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url

  - id: browser-extension-install-active-tab-redirect
    desc: Extension redirects active tab on install
    crit: suspicious
    conf: 0.96
    attack: T1176
    for: [crx, xpi, javascript, chrome-manifest]
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-installed
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-update
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::extension-affiliate-tracking-parameter

  # A default search override that also rewrites the provider's requests with
  # declarativeNetRequest query parameters changes browser search traffic after
  # installation. Attribution parameters can be legitimate, so this is a
  # suspicious routing change rather than proof of malicious interception.
  - id: extension-search-override-dnr-param-injection
    for: [crx, xpi, chrome-manifest, javascript]
    desc: Default search provider rewrites query parameters
    crit: suspicious
    conf: 0.97
    attack: T1176,T1185
    scope: archive
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: micro-behaviors/communications/http/intercept::dnr-query-parameter-transform
      - id: micro-behaviors/communications/http/intercept::declarative-net-request-update

  - id: search-override-storage-and-request-rewrite
    for: [crx, xpi, zip, chrome-manifest, javascript]
    desc: Search request rewriting accompanies persistent storage reads
    crit: suspicious
    conf: 0.98
    attack: T1176,T1185
    scope: archive
    all:
      - id: metadata/permission/network::search-provider-rewrite-authority
      - id: micro-behaviors/data/db/read/key-value::chrome-storage-local-get
      - id: micro-behaviors/communications/http/intercept::declarative-net-request-update
      - id: micro-behaviors/communications/http/dynamic::dnr-redirect-action
      - id: micro-behaviors/communications/http/dynamic::dnr-main-frame-resource

      - id: micro-behaviors/communications/http/intercept::dnr-query-parameter-transform

  # Typed suggestions leave the browser before the user submits a query.
  # A custom engine can legitimately implement this, so keep it suspicious.
  - id: search-override-webrequest-telemetry-hijack
    for: [crx, xpi, zip, chrome-manifest, javascript]
    desc: Search override intercepts traffic with webRequest and exfiltrates telemetry
    crit: hostile
    conf: 0.97
    attack: T1176,T1185,T1041
    scope: archive
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/network::web-request
      - id: micro-behaviors/communications/http/intercept::chrome-webrequest-api
      - id: micro-behaviors/communications/http/request/json::http-post-json
      - id: metadata/permission/extension-api::search-provider-search-token

  # A referral engine can legitimately redirect its own declared domain.
  # Require a wildcard-host search filter before inferring interception of
  # other providers' navigation; an external destination alone is insufficient.
  - id: runtime-search-dnr-hijack
    desc: Extension redirects wildcard-host search traffic externally
    crit: hostile
    conf: 0.98
    attack: T1176,T1185
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/intercept::declarative-net-request-update
      - id: micro-behaviors/communications/http/dynamic::dnr-main-frame-search-redirect
      - id: micro-behaviors/communications/http/dynamic::dnr-external-redirect-target
      - id: micro-behaviors/communications/http/dynamic::wildcard-host-search-regex-literal

  # Search hijacker that keeps its takeover by scripting the user's answer to the
  # browser's revert prompt: it overrides the default search provider, then a
  # content script blankets the page with a full-viewport overlay whose only text
  # tells the user to click the browser's own "Keep it" button. Chrome shows that
  # bubble precisely so a settings takeover can be undone, so darkening the page
  # and pointing at it is deception aimed at a security control — hostile, and a
  # clear step beyond the merely-unwanted PUP line in newtab-override-promo-lifecycle.
  # Gated on the search-override authority so ordinary onboarding tours, cookie
  # banners and paywalls (overlay + "keep" prose, no hijack) cannot match.
  - id: search-override-keep-changes-coercion
    desc: Search override prompts user to keep changes
    crit: suspicious
    conf: 0.95
    attack: T1176
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: micro-behaviors/ui/dialog/prompt::keep-changes-instruction
      - id: micro-behaviors/ui/window/style::fixed-viewport-style

  # Search-override extension tags both its install navigation and uninstall
  # callback with a generated client identifier. This is lifecycle attribution
  # coupled to a browser-setting change, but it does not prove that search
  # queries themselves carry the identifier.
  - id: search-override-lifecycle-client-id
    for: [crx, xpi, chrome-manifest, javascript]
    desc: Search override tags lifecycle URLs with client ID
    crit: suspicious
    conf: 0.92
    attack: T1176
    scope: archive
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: micro-behaviors/communications/url/query/structure::identity-or-extension-query-field
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-installed
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-create-with-url-option
      - id: micro-behaviors/browser-extension/lifecycle::runtime-set-uninstall-url

  - id: extension-search-monetization
    for: [crx, xpi, chrome-manifest, javascript]
    desc: Browser extension search monetization
    # Affiliate monetization is privacy/UX-relevant, but an honest consented
    # search extension is not malware without an additional abuse signal.
    crit: notable
    conf: 0.9
    scope: archive
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/extension-api::search-url-query-template
      - id: metadata/permission/extension-api::search-provider-search-token
      - id: objectives/collection/activity/browser::extension-persistent-affiliate-tracking

  # A provider that claims to be Google but points the browser at a
  # browser-store-branded host is deceptive default-search takeover behavior.
  # The host marker is deliberately separate from the neutral default-provider
  # capability so ordinary search extensions remain notable rather than hostile.
  - id: google-branded-offsite-search-takeover
    desc: Google-branded offsite default search takeover
    crit: hostile
    conf: 0.98
    attack: T1176
    scope: archive
    for: [crx, xpi, zip, chrome-manifest]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/identity::chrome-search-provider-google-name
      - id: browser-brand-search-provider-host

  # A declared default provider carrying syndication parameters is a visible
  # monetisation behavior, but it is not by itself a search hijack.  Keep this
  # in the UI/search objective so benign, user-installed search extensions are
  # represented accurately while the hostile composites below retain their
  # additional abuse requirements.
  - id: extension-search-provider-affiliate-navigation
    desc: Extension homepage routes searches to affiliate provider
    crit: notable
    conf: 0.93
    scope: archive
    for: [crx, xpi, chrome-manifest, javascript]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: hosted-search-affiliate-url-in-extension-code
      - id: micro-behaviors/data/property/assign::location-href-write-text

  # A default-search takeover that also has all-host access and persists
  # affiliate identifiers is materially riskier than an ordinary alternative
  # search provider: it can rewrite arbitrary browsing traffic while retaining
  # the monetisation identity across sessions.
  - id: broad-authority-search-affiliate-takeover
    for: [crx, xpi, chrome-manifest, javascript]
    desc: Broad-host search takeover with persistent affiliate tracking
    crit: suspicious
    conf: 0.94
    attack: T1176
    scope: archive
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/host::broad-host-access
      - id: objectives/collection/activity/browser::extension-persistent-affiliate-tracking

  # A default-search takeover that also reads cross-site cookies and sends
  # persistent affiliate/session telemetry is a tracking payload, not merely a
  # user-selected alternative search provider.
  - id: search-takeover-cookie-telemetry
    desc: Search takeover reads cookies for remote tracking telemetry
    crit: hostile
    conf: 0.98
    attack: T1176,T1539,T1041
    scope: archive
    # Run against a JavaScript child; scope: archive then joins it to the
    # manifest.  The outer XPI/ZIP node has no child symbols or manifest
    # values available to its own rule evaluation.
    for: [crx, xpi, chrome-manifest, javascript]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/host::broad-host-access
      - id: metadata/permission/cookie::permission-cookies
      - id: objectives/collection/activity/browser::extension-persistent-affiliate-tracking
      - id: micro-behaviors/communications/http/cookie-store::chrome-cookies-get-all
      - id: micro-behaviors/communications/http/request/client::image-src-network-request
  - id: tracked-newtab-search-redirect
    desc: Tracked new tab search redirect
    crit: hostile
    conf: 0.95
    attack: T1176
    for: [crx, xpi, zip, chrome-manifest, javascript]
    scope: archive
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::runtime-search-query-redirect
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::runtime-search-q-input-value
    any:
      - id: micro-behaviors/communications/url/query/credential::token-query-parameter
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::runtime-search-affiliate-param
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::runtime-search-tracking-parameter
      - id: micro-behaviors/communications/url/query/tracking::search-source-query-parameter

  # The underlying API calls are neutral extension lifecycle capabilities, but
  # combining a replaced new-tab page with forced install navigation and an
  # operator-controlled uninstall destination is unwanted-shaped lifecycle UI
  # manipulation. Keep that inference here rather than in micro-behaviors/.
  - id: abused-domain-lifecycle-redirect
    desc: Hijack-authority extension opens abused-TLD lifecycle URL
    crit: hostile
    conf: 0.97
    attack: T1176
    scope: archive
    for: [crx, xpi, zip, javascript, chrome-manifest]
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-installed
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-startup
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-create
      - id: micro-behaviors/browser-extension/lifecycle::runtime-set-uninstall-url
      - id: objectives/command-and-control/infrastructure/domain/abused-tlds::tld-click
    any:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::chrome-search-provider-override
      - id: metadata/permission/host::host-permission-all-urls
      - id: metadata/permission/host::permission-all-urls
      - id: metadata/permission/manifest::permission-scripting
      - id: metadata/permission/dom::content-script-all-sites
      - id: metadata/permission/network::web-request
      - id: metadata/permission/network::permission-declarative-net-request

  # NOTE: A hostile "extension-lifecycle-navigation-abuse" rule was removed here.
  # It shared four lifecycle legs (onInstalled + onStartup + tabs.create +
  # setUninstallURL) with `abused-domain-lifecycle-redirect` above but replaced
  # that rule's real discriminator (`tld-click`, an abused destination TLD) with
  # `js-remote-host-url` — which matches ANY hardcoded backend URL. Every
  # commercial extension that opens a welcome page and reports uninstalls to its
  # own server tripped it. The genuinely-hostile variant (lifecycle redirect to
  # an abused/affiliate destination) is already covered by
  # `abused-domain-lifecycle-redirect` and `browser-extension-install-active-tab-redirect`.

  - id: all-site-extension-dom-audio-overlay
    for: [crx, xpi, chrome-manifest, javascript]
    desc: All-site extension injects audio overlay
    crit: hostile
    conf: 0.96
    attack: T1491
    ref: sha256:b5ad7ae1aa9174ae0f9e922e426bca209538fe454cdd2bfd206188096741fd3a
    scope: archive
    all:
      - id: metadata/permission/host::host-permission-all-urls
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
      - id: metadata/permission/manifest::permission-scripting
