      - id: metadata/permission/extension-api::search-provider-keyword-is-domain
      - id: metadata/permission/extension-api::search-referrer-attribution-query-param

  # The monetised new-tab business model, stated as one finding.
  #
  # Individually each leg reads as product behaviour: a new tab that shows
  # content, a welcome page after install, a feedback page on uninstall. Taken
  # together they describe an extension whose new tab is inventory -- it takes
  # over the page, fills the links from a server it controls, and books an
  # attributed visit at both ends of its lifecycle. What the user sees is
  # decided remotely and can change after review, which is the part a store
  # listing cannot convey and a reviewer cannot check once.
  #
  # Suspicious, not hostile: this is how a large amount of legitimate-but-
  # monetised extension inventory works, and nothing here steals or redirects
  # anything the user asked for. The finding is that the page is being sold.
  - id: search-override-homepage-takeover
    desc: Extension overrides default search provider and homepage
    crit: hostile
    conf: 0.98
    attack: T1176
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/manifest::chrome-homepage-override
      - id: metadata/permission/extension-api::search-url-query-template
      - id: metadata/permission/extension-api::search-provider-search-token

  # A provider need not advertise a search-branded hostname to take over both
  # settings. Requiring the manifest's explicit default flag keeps this below
  # the hostile branded-provider verdict while still catching smaller PUA
  # extensions such as AdKeeps.
  - id: search-override-homepage-default-provider
    desc: Default search and homepage takeover pair
    crit: suspicious
    conf: 0.94
    attack: T1176
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/manifest::chrome-homepage-override
      - id: metadata/permission/extension-api::search-url-query-template

  # A default-search + homepage takeover by a provider that cannot tell web
  # from image search: its image_url is a static HTML page, not an image
  # endpoint. A real engine answers image queries from an image backend;
  # pointing the image slot at a `.html` results page means the "provider" is
  # a shell for receiving the seized queries. The takeover pair alone is how
  # an honest alternative engine behaves, but a fake provider seizing both
  # settings is hijacking, not competing. Gated on the declared image slot
  # rather than any brand or domain, so re-skins under new names still match.
  - id: search-homepage-takeover-fake-image-provider
    desc: Homepage and search takeover by fake provider
    crit: hostile
    conf: 0.97
    attack: T1176
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/manifest::chrome-homepage-override
      - id: metadata/permission/extension-api::search-url-query-template
      - id: search-provider-image-url-html-page
