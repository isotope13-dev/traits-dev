  # An overridden new tab whose link targets arrive from a publisher endpoint
  # and are interpolated into page markup has a remotely changeable shortcut
  # surface. This is analyst-relevant, but without forced navigation, hidden
  # destinations, or a search-provider override it is ordinary new-tab
  # functionality rather than deceptive traffic manipulation.
