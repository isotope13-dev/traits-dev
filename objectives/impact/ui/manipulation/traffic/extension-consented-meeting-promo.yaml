defaults:
  for: [javascript]
  platforms: [unix, windows]
traits:
  - id: extension-consented-meeting-promotional-message
    desc: Sends consented meeting chat promotion
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule extension_consented_meeting_promotional_message {
          strings:
            $message = "CHAT_MESSAGE=\"Hey, I'm using the Noise Cancelling App extension"
            $consent = "meetChatConsent:\"allowed\""
            $check = "meetChatConsent===\"allowed\""
            $send = "sendBtn.click()"
            $once = "meetMessageLastSent"
            $schedule = "scheduleGoogleMeetMessage()"
          condition:
            all of them
        }
