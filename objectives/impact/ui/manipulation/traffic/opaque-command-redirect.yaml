# A tiny page that immediately hands the browser to a command endpoint using
# three navigation mechanisms. The long opaque hex argument makes this a
# per-request command handoff rather than ordinary same-origin page routing.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189

composite_rules:
  - id: redundant-opaque-command-redirect
    desc: Stub page redundantly redirects to a long-hex command endpoint
    crit: hostile
    conf: 0.95
    size_max: 1024
    near_bytes: 512
    all:
      - id: micro-behaviors/ui/window/navigation::browser-meta-refresh-instant-relative-url
      - id: micro-behaviors/ui/window/navigation::browser-location-replace
      - id: micro-behaviors/ui/window/navigation::window-variable-location-assignment
      - id: micro-behaviors/communications/http/url/command::long-hex-command-query-parameter
