defaults:
  platforms: [unix, windows, ios]
  for: [javascript]

composite_rules:
  - id: js-hex-decoded-traffic-iframe-loader
    desc: Hex-decoded hidden iframe targets an encoded traffic endpoint
    crit: hostile
    conf: 0.97
    attack: T1189,T1027,T1059.007
    all:
      - id: objectives/anti-static/obfuscation/encoding/hex::js-hex-decoded-hidden-remote-iframe
      - id: micro-behaviors/data/decode/hex::hex-encoded-traffic-path
    near_bytes: 2000
