# Traffic hijack: a page that is nothing but one inline script, which forces
# the whole window onto a login page carrying a long session token.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189

composite_rules:
  - id: script-only-page-redirects-to-login
    desc: Script-only page redirects window to login URL
    crit: hostile
    conf: 0.9
    size_max: 4096
    all:
      - id: metadata/document/html::script-only-html-page
      - id: micro-behaviors/ui/window/navigation::top-location-assignment
      - id: micro-behaviors/communications/http/url/php-endpoint::login-page-long-session-token
