# A browser extension that sends all page traffic through a fixed proxy whose
# host is picked from a server list fetched from its own backend routes the
# user's traffic through a party the user never chose. The operator can change
# the list without a store update. The bypass list keeps only local names, so
# nothing else is exempt. Legitimate VPN and enterprise-proxy extensions can
# match the same pieces, so this is hostile only in this archive-level join.
defaults:
  platforms: [windows, unix]
  for: [crx, zip, javascript]
  attack: T1557

composite_rules:
  - id: browser-remote-server-proxy-takeover
    desc: Browser traffic routed through operator-fetched proxy servers
    crit: notable
    conf: 0.9
    scope: archive
    # Both legs share the chrome.proxy settings call. The fetched-list leg adds
    # the operator-chosen host; the fixed-HTTPS leg adds the relay scheme. The
    # local-only bypass leg does not join at archive scope, so it is not used.
    all:
      - id: micro-behaviors/communications/proxy/config::chrome-proxy-remote-server-list
      - id: micro-behaviors/communications/proxy/config::chrome-proxy-fixed-https-config
