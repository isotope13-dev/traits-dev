# Search-provider and start-page hijacking: rewriting where the user's browser
# sends them, so that navigation and search traffic is monetized by someone
# other than the browser vendor. The classic payload of a bundled-installer
# adware family, and the reason `traffic/` exists in this directory.
#
# The discriminator is *breadth*, not the individual write. A browser sets its
# own home page. A migration utility copies settings between two profiles of
# the same product. A single binary that reaches into the search settings of
# two unrelated browser products -- Internet Explorer's SearchScopes and
# Firefox's prefs.js -- is not configuring anything it owns; there is no
# legitimate program whose job is to pick the default search engine for every
# browser installed on the machine.
#
# The legs are plain settings references from micro-behaviors/, none of which
# is suspicious alone; the pairing across products is what carries the intent.
#
# A registry-write leg is required on top of the pairing. Without it a tool
# that merely *reports* which browsers are configured how -- an inventory
# script, a support-diagnostics dump -- names the same two settings and would
# otherwise be convicted for reading them.
#
# The breadth argument has one honest exception: a browser *engine*. Chromium
# ships importers for the other products -- `firefox_importer_utils.cc` reads
# `prefs.js` for `browser.startup.homepage`, `ie_importer_win.cc` reads
# `Internet Explorer\Main` -- so it holds both halves of the pairing for a
# feature the user invokes on purpose. `well-known/app/browser/` covered the
# shipped browser applications but not the engine shipped as a library, so
# OBS Studio's bundled `libcef.dll` scored hostile on the Chromium importer's
# own string table. The engine identity is added to `unless:` alongside it.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries, data]
  attack: T1112
  mbc: E1112

composite_rules:
  - id: cross-browser-search-provider-hijack
    desc: Rewrites search providers in unrelated browsers
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/registry/keys::ie-search-scopes-registry-key
      - id: micro-behaviors/fs/path/sensitive/browser::firefox-selected-engine-pref
    any:
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
      - id: micro-behaviors/os/registry/access::registry-create-key-api
      - id: micro-behaviors/os/registry/access::registry-set-value-source
      - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command
      - id: micro-behaviors/os/registry/write/property::powershell-registry-property-write
    unless:
      - id: well-known/app/browser/
      - id: well-known/lib/runtime/electron::electron-chromium-runtime-strong
      - id: well-known/app/system/iobit::iobit-signed-component-context
      - id: well-known/unwanted/amonetize::aminsis-plugin-library-context

  # The same reach applied to the start page. Kept apart from the search rule
  # because a hijacker that only moves the home page still matches nothing
  # else, and because the two are written through different mechanisms.
  - id: cross-browser-start-page-hijack
    desc: Rewrites start pages in unrelated browsers
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/os/registry/keys::ie-main-settings-registry-key
      - id: micro-behaviors/fs/path/sensitive/browser::firefox-startup-homepage-pref
    any:
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
      - id: micro-behaviors/os/registry/access::registry-create-key-api
      - id: micro-behaviors/os/registry/access::registry-set-value-source
      - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command
      - id: micro-behaviors/os/registry/write/property::powershell-registry-property-write
    unless:
      - id: well-known/app/browser/
      - id: well-known/lib/runtime/electron::electron-chromium-runtime-strong
      - id: well-known/app/system/iobit::iobit-signed-component-context
      - id: well-known/unwanted/amonetize::aminsis-plugin-library-context

  # Dropping an OpenSearch provider XML into Firefox's searchplugins directory
  # is how a new engine is made selectable; doing that *and* pointing
  # selectedEngine at it installs and selects a search provider in one move,
  # without the "a site wants to add a search engine" prompt Firefox shows.
  - id: firefox-search-plugin-silent-install
    desc: Installs and selects a Firefox search plugin
    crit: suspicious
    conf: 0.94
    platforms: [windows, unix]
    all:
      - id: micro-behaviors/fs/path/sensitive/browser::firefox-search-plugins-directory
      - id: micro-behaviors/fs/path/sensitive/browser::firefox-selected-engine-pref
    unless:
      - id: well-known/app/browser/
      - id: well-known/unwanted/amonetize::aminsis-plugin-library-context
