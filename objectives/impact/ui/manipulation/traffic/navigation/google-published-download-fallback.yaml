# Redirect-failure copy and a manual download label accompany a tracked PHP
# endpoint. The URL alone does not establish the response type or publication
# on Google Docs. Preview-disabled lures live under evasion/decoy/lure.
defaults:
  platforms: [windows, unix]
  for: [html]

traits:
  - id: google-click-tracked-php-download
    desc: Google click URL targets a PHP endpoint
    crit: notable
    conf: 0.94
    if:
      type: text
      exclude_html_comments: true
      regex: 'https://(www\.)?google\.com/url\?q=https://[^&"<>\s]{1,160}\.php[?&#"]'
      case_insensitive: true

  - id: automatic-redirect-failure-message
    desc: Page says automatic redirection failed
    crit: notable
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      substr: automatic redirection did not work
      case_insensitive: true

  - id: download-link-label
    desc: Page exposes a manual Download link
    crit: notable
    conf: 0.85
    if:
      type: text
      exclude_html_comments: true
      regex: '>\s*Download\s*</a>'
      case_insensitive: true

  - id: google-click-empty-php-link
    desc: Tracked PHP link has whitespace anchor text
    crit: notable
    conf: 0.96
    if:
      type: text
      exclude_html_comments: true
      regex: '//www\.google\.com/url\?q=https://[^&"]{1,160}\.php[^"]{0,250}">(\s|\xC2\xA0)*</a>'
      case_insensitive: true

composite_rules:
  - id: google-published-php-download-fallback
    desc: Redirect-failure page offers a tracked PHP download
    crit: hostile
    attack: T1204.001
    conf: 0.97
    near_bytes: 1600
    all:
      - id: google-click-tracked-php-download
      - id: automatic-redirect-failure-message
      - id: download-link-label
