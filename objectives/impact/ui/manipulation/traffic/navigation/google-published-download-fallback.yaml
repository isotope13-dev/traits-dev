# Google-published lure pages can hide a remote executable handoff behind
# Google's click-tracking URL. A manual download fallback paired with a PHP
# target distinguishes the delivery page from ordinary Google page links.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189

traits:
  - id: google-click-tracked-php-download
    desc: Google click URL targets a PHP download
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'google\.com/url\?q=https://[^&]{1,100}\.php'
      case_insensitive: true

  - id: automatic-redirect-failure-message
    desc: Page says automatic redirection failed
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: automatic redirection did not work
      case_insensitive: true

  - id: download-link-label
    desc: Page exposes a manual Download link
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '>\s*Download\s*</a>'
      case_insensitive: true

composite_rules:
  - id: google-published-php-download-fallback
    desc: Google-published page falls back to tracked PHP download
    crit: hostile
    conf: 0.97
    near_bytes: 1600
    all:
      - id: google-click-tracked-php-download
      - id: automatic-redirect-failure-message
      - id: download-link-label
