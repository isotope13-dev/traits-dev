# Extension response-directed navigation retains its separate review.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip]

composite_rules:
  - id: maverickpreviews-profiled-router-loader
    desc: Known malware source profiles browser for routed page delivery
    crit: hostile
    conf: 0.98
    attack: T1189,T1497.001
    for: [html, javascript]
    scope: file
    near_bytes: 4800
    all:
      - id: micro-behaviors/ui/window/dom-access::profiled-post-dom-script-sink
      - id: micro-behaviors/communications/url/host/domain-http::parklogic-router-url
      - id: maverickpreviews-source-host-ioc
      - id: micro-behaviors/ui/window/navigation/location::browser-location-replace

  # Browser router responses are not merely analytics: this page reports
  # browser state to a remote endpoint and uses returned content both as a
  # navigation target and as replacement script-bearing HTML. Its ad-block
  # and automation checks select the visitor cohort before the response.
  - id: profiled-browser-router-response-delivery
    desc: Browser profiling gates server-directed navigation and page delivery
    crit: hostile
    conf: 0.98
    attack: T1189,T1497.001
    for: [html]
    scope: file
    near_bytes: 4800
    all:
      - id: micro-behaviors/ui/window/dom-access::profiled-post-dom-script-sink
      - id: micro-behaviors/os/sysinfo/platform/browser::html-adblock-plus-dom-marker-read
      - id: micro-behaviors/os/sysinfo/platform/browser::html-webdriver-member-read
      - id: micro-behaviors/ui/window/navigation/location::browser-location-replace
    unless:
      - id: micro-behaviors/communications/url/host/domain-http::parklogic-router-url

  - id: extension-response-tab-navigation
    for: [javascript]
    desc: Extension opens POST response as browser tab URL
    crit: suspicious
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/response-body::fetch-response-text-to-link-variable
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-create-link-url-variable
      - id: micro-behaviors/communications/http/request/verb::post-method-text

  # Injected redirector: POSTs the page to a remote host and forces the top
  # window to the URL it returns, rate-limited by a timestamp it keeps in
  # localStorage so a returning visitor is only hijacked once per period.
  - id: storage-throttled-remote-top-redirect
    for: [javascript]
    desc: Throttled top-window redirect to remote answer
    crit: hostile
    conf: 0.95
    attack: T1189
    near_bytes: 4000
    all:
      - id: micro-behaviors/communications/http/post::xhr-post-open-send
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: micro-behaviors/data/db/read/key-value::dom-storage-getitem-call
      - id: micro-behaviors/data/db/write::dom-storage-setitem-call
    any:
      - id: micro-behaviors/ui/window/navigation/location::top-window-location-assignment
      - id: micro-behaviors/ui/window/navigation/location::top-location-assignment

traits:
  - id: maverickpreviews-source-host-ioc
    desc: Maverickpreviews source host IOC
    crit: notable
    conf: 0.99
    for: [html, javascript]
    if:
      type: encoded
      substr: bridgeroad.maverickpreviews.com
