defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1189,T1566

traits:
  - id: npm-redirect-entry
    desc: Declares redirect script as package entry
    crit: notable
    for: [package.json]
    if:
      type: value
      path: main
      regex: '^(beamglea|index)[.]js$'
  - id: npm-redirect-function
    desc: Defines immediate redirect routine
    crit: notable
    if:
      type: text
      substr: 'function processAndRedirect()'
  - id: npm-redirect-email
    desc: Pairs destination with embedded email
    crit: notable
    if:
      type: text
      regex: 'var email = "[^"[:space:]]+@[^"[:space:]]+"'
  - id: npm-redirect-final-url
    desc: Adds email address to destination URL fragment
    crit: notable
    if:
      type: text
      substr: 'var finalUrl = urlPath + "#" + email'
  - id: npm-redirect-navigation
    desc: Sets browser location to external URL
    crit: notable
    if:
      type: text
      substr: 'window.location.href = finalUrl'
  - id: npm-redirect-call
    desc: Executes redirect routine at module load
    crit: notable
    if:
      type: text
      substr: 'processAndRedirect();'

composite_rules:
  - id: npm-email-targeted-redirect
    desc: Module immediately redirects users to email-personalized external URL
    crit: hostile
    conf: 0.98
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: npm-redirect-entry
      - id: npm-redirect-function
      - id: npm-redirect-email
      - id: npm-redirect-final-url
      - id: npm-redirect-navigation
      - id: npm-redirect-call
