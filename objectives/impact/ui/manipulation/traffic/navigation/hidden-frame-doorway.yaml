# Iframe doorway page: the body's only element is a zero- or one-pixel frame
# that loads a static HTML page from another host. The page renders nothing
# itself; every visit silently becomes a visit to the framed page, the hop
# that clicker and drive-by chains can plant on hosts they control. Tracking
# and cookie-sync frames ride inside real pages and carry per-visitor query
# parameters, so the static-page leg and the content-free body keep them out.
# No test-directory guard: a doorway stays a doorway wherever it is stored;
# documentation-domain snippets are what test suites actually carry. A
# concealed remote frame is suspicious when the destination is unknown; a
# bare numeric document path adds the rotation pattern used by traffic
# distribution and clicker kits, supporting a hostile traffic-doorway result.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189

composite_rules:
  - id: content-free-hidden-remote-page-doorway
    desc: Content-free page silently frames remote page
    crit: suspicious
    conf: 0.93
    near_bytes: 600
    all:
      - id: micro-behaviors/ui/window/visibility::tiny-iframe
      - id: micro-behaviors/communications/http/client/frame::external-iframe-element-load
      - id: micro-behaviors/ui/window/html::frame-src-static-remote-html
    any:
      - id: metadata/document/html/structure::body-only-iframe
      - id: metadata/document/html/structure::body-frame-at-file-end
    unless:
      - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url

  # Numeric root-level HTML names are the rotation idiom used by traffic
  # distribution and clicker kits. Require the complete content-free doorway
  # pattern as well, so unrelated numeric links or ordinary frame embeds do
  # not establish this objective.
  - id: numeric-document-hidden-traffic-doorway
    desc: Hidden numeric-page frame is a traffic doorway
    crit: hostile
    conf: 0.94
    near_bytes: 700
    all:
      - id: micro-behaviors/ui/window/visibility::tiny-iframe
      - id: micro-behaviors/communications/http/client/frame::external-iframe-element-load
      - id: micro-behaviors/ui/window/html::frame-src-static-remote-html
      - id: micro-behaviors/communications/url/resource-path/file::bare-numeric-html-document-url
    any:
      - id: metadata/document/html/structure::body-only-iframe
      - id: metadata/document/html/structure::body-frame-at-file-end
    unless:
      - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url
