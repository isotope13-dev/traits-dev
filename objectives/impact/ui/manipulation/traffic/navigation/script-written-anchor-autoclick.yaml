# Routers and redirectors write a hidden link and click it themselves so the
# next hop sees a click-initiated navigation instead of a scripted redirect.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]

composite_rules:
  - id: script-written-anchor-autoclick
    desc: Script writes an anchor then clicks it itself
    crit: suspicious
    conf: 0.9
    attack: T1189
    near_bytes: 400
    all:
      - id: micro-behaviors/ui/window/navigation/anchor::document-write-anchor-literal
      - id: micro-behaviors/ui/window/click::element-id-programmatic-click
    unless:
      - id: micro-behaviors/communications/url/host/domain-http::parklogic-router-url
