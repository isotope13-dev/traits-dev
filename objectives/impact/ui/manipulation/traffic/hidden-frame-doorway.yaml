# Iframe doorway page: the body's only element is a zero- or one-pixel frame
# that loads a static HTML page from another host. The page renders nothing
# itself; every visit silently becomes a visit to the framed page, the hop
# that clicker and drive-by chains plant on hosts they control. Tracking
# and cookie-sync frames ride inside real pages and carry per-visitor query
# parameters, so the static-page leg and the content-free body keep them out.
# No test-directory guard: a doorway stays a doorway wherever it is stored;
# documentation-domain snippets are what test suites actually carry.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189

composite_rules:
  - id: content-free-hidden-remote-page-doorway
    desc: Content-free page silently frames remote page
    crit: hostile
    conf: 0.93
    near_bytes: 600
    all:
      - id: metadata/document/html/structure::body-only-iframe
      - id: micro-behaviors/ui/window/visibility::tiny-iframe
      - id: micro-behaviors/communications/http/client/frame::external-iframe-element-load
      - id: micro-behaviors/ui/window/html::frame-src-static-remote-html
    unless:
      - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url
