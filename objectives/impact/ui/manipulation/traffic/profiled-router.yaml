# Browser-profiled POST routing that controls the next page or page content.
# The profile and request atoms are individually useful observations; the
# traffic objective requires the response to alter the visitor's browser.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]

composite_rules:
  - id: profiled-router-response-redirect
    desc: Profiled router redirects selected visitor
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/lang/source/naming/interface::browser-router-profile-field-cluster
      - id: micro-behaviors/communications/http/post::xhr-post-open-send
      - id: micro-behaviors/ui/window/navigation::xhr-response-url-navigation
      - id: micro-behaviors/communications/http/client/response-body::response-text
    near_bytes: 4800

  - id: profiled-router-response-script-injection
    desc: Profiled router injects returned HTML scripts
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/lang/source/naming/interface::browser-router-profile-field-cluster
      - id: micro-behaviors/communications/http/post::xhr-post-open-send
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: micro-behaviors/process/deploy/script-eval::dom-script-text-body-assign
    near_bytes: 4800
