defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: runtime-click-redirect-abuse
    desc: Runtime click redirect abuse
    crit: hostile
    conf: 0.97
    attack: T1176,T1185
    all:
      - id: micro-behaviors/ui/window/manage/click::browser-click-listener
      - id: micro-behaviors/ui/window/manage/dom::browser-window-open
      - id: micro-behaviors/ui/window/manage/dom::browser-prevent-default-call
      - id: micro-behaviors/communications/http/dynamic::dnr-runtime-rule-install
      - id: micro-behaviors/communications/http/url/domain::js-insecure-remote-http-url
    near_bytes: 6000
