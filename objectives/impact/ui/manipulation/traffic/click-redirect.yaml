defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: obfuscated-click-redirect-beacon
    desc: Obfuscated click interception reports navigation data
    conf: 0.98
    attack: T1185,T1041,T1027
    all:
      - id: micro-behaviors/ui/window/click::browser-computed-click-listener
      - id: micro-behaviors/ui/window/click::dom-computed-click-call
      - id: micro-behaviors/communications/http/url/navigation::browser-location-bracket-member-read
      - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
      - id: micro-behaviors/communications/http/form::formdata-class
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::cfg-flatten-state-list

  - id: runtime-click-redirect-abuse
    desc: Runtime click redirect abuse
    conf: 0.97
    attack: T1176,T1185
    all:
      - id: micro-behaviors/ui/window/click::browser-click-listener
      - id: micro-behaviors/ui/window/navigation::browser-window-open
      - id: micro-behaviors/ui/window/event::browser-prevent-default-call
      - id: micro-behaviors/process/hook/webextension::declarative-net-request-update
      - id: micro-behaviors/communications/http/url/domain::js-insecure-remote-http-url
    near_bytes: 6000
