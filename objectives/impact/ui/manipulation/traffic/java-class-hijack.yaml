defaults:
  platforms: [windows]
  for: [class]
  conf: 0.98
traits:
  - id: jvm-remote-browser-redirect-configuration
    desc: Remote browser-redirect configuration directives
    crit: suspicious
    if:
      type: yara
      source: |
        rule jvm_remote_browser_redirect_configuration {
          strings:
            $start = "STARTURL" ascii
            $search = "SEARCHURL" ascii
            $hosts = "HOSTSURL" ascii
            $css = "CSSURL" ascii
            $favorites = "FAVURL" ascii
          condition:
            uint32be(0) == 0xcafebabe and all of them
        }
  - id: jvm-adult-shortcut-spam-content
    desc: Multiple adult-site InternetShortcut payloads
    crit: suspicious
    if:
      type: yara
      source: |
        rule jvm_adult_shortcut_spam_content {
          strings:
            $shortcut = "[InternetShortcut]" ascii
            $adult = /[Pp]orn[^\x00\r\n]{0,80}\.url/ ascii
            $favorite = "Favorites" ascii
            $desktop = "Desktop" ascii
          condition:
            uint32be(0) == 0xcafebabe and #shortcut >= 4 and
            #adult >= 3 and $favorite and $desktop
        }
composite_rules:
  - id: jvm-remote-ie-settings-hijacker
    desc: Microsoft JVM browser hijacker accepts remote redirect configuration
    crit: hostile
    all:
      - id: jvm-remote-browser-redirect-configuration
      - id: metadata/import/jvm::ms-regkey-setvalue-reference
      - id: metadata/import/jvm::ms-policy-assertpermission-reference
      - id: micro-behaviors/os/registry/keys/browser::ie-main-settings-registry-key
  - id: jvm-ie-homepage-shortcut-spammer
    desc: JVM browser-settings writer plants adult-site shortcuts
    crit: hostile
    all:
      - id: jvm-adult-shortcut-spam-content
      - id: metadata/import/jvm::ms-regkey-setvalue-reference
      - id: metadata/import/jvm::ms-policy-assertpermission-reference
      - id: micro-behaviors/os/registry/keys/browser::ie-main-settings-registry-key
