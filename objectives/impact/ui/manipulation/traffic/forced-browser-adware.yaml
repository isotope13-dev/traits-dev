defaults:
  platforms:
    - linux
    - macos
    - windows

composite_rules:
  # `shell-777` parses a shell `chmod` call via its AST symbol grammar and can
  # never match a Mach-O binary's raw bytes; the actual carrier is the dropped
  # shell script that chmods and re-opens the browser, not the daemon binary.
  - id: forced-browser-adware
    desc: Daemon forces browser to open URLs
    crit: hostile
    conf: 0.9
    attack: T1204.001
    for:
      - shell
    all:
      - id: metadata/lang/source/syntax/command/launch::macos-open-app-command-text
      - id: micro-behaviors/fs/chmod/executable/dangerous::shell-777
