# A system-service-hooking kernel driver that also carries HTTP redirect
# response templates and a roster of browser process names rewrites browser
# traffic from kernel mode. Redirect strings or browser names alone, or a
# driver alone, establish none of this.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1565.002,T1014
  mbc: B0030

composite_rules:
  - id: ssdt-driver-browser-redirect-injection
    desc: Kernel driver forges HTTP redirects to browsers
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/kernel/module::native-kernel-api-context
      - id: micro-behaviors/os/kernel/syscall::ke-service-descriptor-table-ref
      - id: micro-behaviors/communications/http/redirect::native-http-redirect-response-builder
      - id: micro-behaviors/os/application/target/browser::multi-browser-process-name-roster
