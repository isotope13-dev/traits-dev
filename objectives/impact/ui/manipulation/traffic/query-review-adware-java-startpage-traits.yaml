defaults:
  platforms:
  - windows
  for:
  - class

composite_rules:
  - id: remote-browser-hosts-hijack-profile
    desc: Browser and hosts modification profile
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/degrade/system/network::jvm-remote-hosts-overwrite
      - id: metadata/binary/symbols/name/declared-class::jvm-beyond-class-name
  - id: colors-browser-shortcut-profile
    desc: Colors class and browser shortcut profile
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/ui/manipulation/traffic::jvm-ie-homepage-shortcut-spammer
    any:
      - id: metadata/binary/symbols/name/declared-class::jvm-colors-class-name
