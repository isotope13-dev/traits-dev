# Traffic hijack: mobile visitors are forcibly navigated, cookie-throttled,
# to an absolute URL whose host is a bare IP address, i.e. away from the
# site to an unbranded traffic-distribution endpoint.
defaults:
  platforms: [windows, unix, android]
  for: [html, javascript]
  attack: T1189

composite_rules:
  - id: mobile-cookie-redirect-to-raw-ip
    desc: Mobile visitors redirected to a raw-IP URL
    crit: hostile
    conf: 0.93
    near_bytes: 3000
    all:
      - id: micro-behaviors/communications/http/user-agent::detectmobilebrowsers-ua-regex
      - id: micro-behaviors/ui/window/navigation::expiring-cookie-then-window-location
      - id: micro-behaviors/communications/ip/literal::http-ip-url-filtered-text
