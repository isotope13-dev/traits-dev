# Resilient popunder-kit loaders: a network account config array, a
# dynamically injected script tag, and an onerror fallback to a second
# source domain. Each leg alone is ordinary ad tech (tag managers inject
# scripts; retry handlers exist); the three together are the popunder
# shape built to survive a blocked first domain. Confirm the page has no
# legitimate ad-funded purpose before triage. The `makefile`/`text`
# scopes are deliberate: extensionless landings mistype as makefile in
# the file sniffer, so html-only scoping would leave them blind.
defaults:
  platforms: [windows, unix]
  for: [html, makefile, text]
  attack: T1204.001

traits:
  - id: popunder-site-config
    desc: Popunder network account config array
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '_pop\.push\(\[''(siteId|minBid|popundersPerIP)'
  - id: fallback-script-source
    desc: Error fallback assigning a second script source
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '\.onerror\s*=\s*function[\s\S]{0,300}\.src\s*='

composite_rules:
  - id: popunder-kit-loader
    desc: Popunder loader with fallback source
    crit: suspicious
    conf: 0.9
    all:
      - id: popunder-site-config
      - id: micro-behaviors/process/deploy::dynamic-script-element-load
      - id: fallback-script-source
