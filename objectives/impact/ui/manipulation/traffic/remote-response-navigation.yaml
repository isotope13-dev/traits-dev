# A remote service response used directly as a browser tab URL. This is an
# unusual navigation dataflow, but it also occurs in disclosed VPN landing-page
# flows, so the evidence is suspicious rather than intrinsically hostile.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, archives]

composite_rules:
  - id: extension-response-tab-navigation
    desc: Extension opens POST response as browser tab URL
    crit: suspicious
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/response-body::fetch-response-text-to-link-variable
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-create-link-url-variable
      - id: micro-behaviors/communications/http/request/client::post-method-text
