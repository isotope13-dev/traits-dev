# A remote service response used directly as a browser tab URL. This is an
# unusual navigation dataflow, but it also occurs in disclosed VPN landing-page
# flows, so the evidence is suspicious rather than intrinsically hostile.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip]

traits:
  # TDS kits gate the victim, then navigate the page to the URL the gateway
  # returns in the response body. The assignment target is location.href in
  # plain or bracket form; matching runs on decoded text so hex-escaped
  # loaders match the same pattern.
  - id: xhr-response-href-assignment
    desc: Assigns location href from response text
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'href\W{0,2}=\s*[^\n;]{1,50}responseText'

composite_rules:
  # Navigating the page to a URL read straight out of an XHR response body
  # hands navigation control to the remote server: the TDS hijack primitive.
  - id: xhr-response-href-navigation
    desc: Page navigates to XHR response body URL
    crit: hostile
    conf: 0.93
    attack: T1189
    near_bytes: 512
    all:
      - id: objectives/impact/ui/manipulation/traffic::xhr-response-href-assignment
      - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-open
  - id: extension-response-tab-navigation
    for: [javascript]
    desc: Extension opens POST response as browser tab URL
    crit: suspicious
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/response-body::fetch-response-text-to-link-variable
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-create-link-url-variable
      - id: micro-behaviors/communications/http/request/verb::post-method-text
