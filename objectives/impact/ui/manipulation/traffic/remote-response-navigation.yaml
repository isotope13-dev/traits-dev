# Extension response-directed navigation retains its separate review.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip]

composite_rules:
  - id: extension-response-tab-navigation
    for: [javascript]
    desc: Extension opens POST response as browser tab URL
    crit: suspicious
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/response-body::fetch-response-text-to-link-variable
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-create-link-url-variable
      - id: micro-behaviors/communications/http/request/verb::post-method-text

  # Injected redirector: POSTs the page to a remote host and forces the top
  # window to the URL it returns, rate-limited by a timestamp it keeps in
  # localStorage so a returning visitor is only hijacked once per period.
  - id: storage-throttled-remote-top-redirect
    for: [javascript]
    desc: Throttled top-window redirect to remote answer
    crit: hostile
    conf: 0.95
    attack: T1189
    near_bytes: 4000
    all:
      - id: micro-behaviors/communications/http/post::xhr-post-open-send
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: micro-behaviors/data/db/read/key-value::dom-storage-getitem-call
      - id: micro-behaviors/data/db/write::dom-storage-setitem-call
    any:
      - id: micro-behaviors/ui/window/navigation/location::top-window-location-assignment
      - id: micro-behaviors/ui/window/navigation/location::top-location-assignment
