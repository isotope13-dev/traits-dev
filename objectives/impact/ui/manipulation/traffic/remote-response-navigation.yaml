# Extension response-directed navigation retains its separate review.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip]

composite_rules:
  - id: extension-response-tab-navigation
    for: [javascript]
    desc: Extension opens POST response as browser tab URL
    crit: suspicious
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/response-body::fetch-response-text-to-link-variable
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-create-link-url-variable
      - id: micro-behaviors/communications/http/request/verb::post-method-text
