defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  # Traffic-monetization injections fetch the visitor's destination from
  # their operator and force the browser through it: an XHR response body
  # assigned to location.href, or a hidden form auto-submitted to it.
  # Inside a densely obfuscated loader that is the payoff, not telemetry.
  - id: obfuscated-xhr-forced-navigation
    desc: Obfuscated loader navigates to fetched URL
    crit: hostile
    conf: 0.94
    attack: T1189
    all:
      - id: micro-behaviors/communications/http/url/navigation::xhr-response-href-assignment
    any:
      - id: metadata/lang/encoding::js-dense-hex-escapes
      - id: micro-behaviors/process/interpreter/eval/indirect::js-global-eval-hex-escaped-key
