defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  # Require a decoder/document sink, a location assignment and a remote URL.
  # Referrer/search/location names alone also occur in packed analytics.
  - id: charcode-search-referrer-redirect
    desc: Packed search-referrer remote navigation
    crit: hostile
    conf: 0.95
    for: [html, javascript]
    attack: T1189,T1027.002
    all:
      - id: micro-behaviors/communications/url/navigation-http::charcode-concealed-referrer
      - id: metadata/file/encoding/shape::decimal-search-engine-labels
      - id: micro-behaviors/ui/window/navigation/location::charcode-concealed-location-assignment
      - id: micro-behaviors/communications/url/navigation-http::charcode-concealed-remote-url
      - id: objectives/anti-static/obfuscation/encoding/numeric::hash-delimited-charcode-document-write

  # Traffic-monetization injections fetch the visitor's destination from
  # their operator and force the browser through it: an XHR response body
  # assigned to location.href, or a hidden form auto-submitted to it.
  # Inside a densely obfuscated loader that is the payoff, not telemetry.
  - id: obfuscated-xhr-forced-navigation
    desc: Obfuscated loader navigates to fetched URL
    crit: hostile
    conf: 0.94
    attack: T1189
    all:
      - id: micro-behaviors/communications/url/navigation-http::xhr-response-href-assignment
    any:
      - id: metadata/lang/encoding/hex::js-dense-hex-escapes
      - id: micro-behaviors/process/interpreter/eval/indirect::js-global-eval-hex-escaped-key

  # Hacked-page and doorway redirectors hide the destination twice: the URL
  # is stored reversed and the whole stub is Dean Edwards packed, so neither
  # the host nor `top.location.href` appears in the page. The dictionary must
  # name the reversal and the top-frame navigation chain and hold the reversed
  # URL itself; packed widgets do not reverse a URL into the top frame.
  - id: packed-reversed-url-top-navigation
    desc: Packed stub sends top frame to reversed URL
    crit: hostile
    conf: 0.95
    for: [html, javascript]
    # The rule proves packed, concealed navigation; it does not establish an
    # exploit or compromise on the destination, so map only the packing.
    attack: T1027.002
    all:
      - id: micro-behaviors/data/string/replace::packer-dictionary-navigation
      - id: metadata/lang/source/literal/fragment/sequence::packer-dictionary-reverse-token
      - id: micro-behaviors/data/string/reverse::reversed-http-url-literal-text
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::packer-eval-pattern-js
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::packer-eval-pattern-non-js

  # The same redirect without the packer layer: a reversed URL literal,
  # an executed split/reverse/join and a whole-window navigation. Reversal
  # is the only concealment, so the redirect is suspicious, not proven abuse.
  - id: reversed-url-top-navigation
    desc: Top frame sent to a reversed URL literal
    crit: suspicious
    conf: 0.9
    for: [html, javascript]
    attack: T1027
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/string/reverse::reversed-http-url-literal-text
      - id: micro-behaviors/ui/window/navigation/location::top-location-assignment
    any:
      - id: micro-behaviors/data/string/reverse::split-reverse-join-string
      - id: micro-behaviors/data/string/reverse::html-split-reverse-join-string
