defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  # Some hacked SEO pages conceal a script as numeric character codes, then
  # select a redirect using the visitor's search-engine referrer. Requiring
  # all three decoded indicators distinguishes this from ordinary charcode
  # use and generic browser navigation.
  - id: charcode-search-referrer-redirect
    desc: Charcode script redirects visitors by search-engine referrer
    crit: hostile
    conf: 0.95
    for: [html]
    attack: T1189,T1027.002
    all:
      - id: micro-behaviors/communications/http/url/navigation::charcode-concealed-referrer
      - id: micro-behaviors/communications/url/host/name::charcode-concealed-engine-name
      - id: micro-behaviors/ui/window/navigation::charcode-concealed-location

  # Traffic-monetization injections fetch the visitor's destination from
  # their operator and force the browser through it: an XHR response body
  # assigned to location.href, or a hidden form auto-submitted to it.
  # Inside a densely obfuscated loader that is the payoff, not telemetry.
  - id: obfuscated-xhr-forced-navigation
    desc: Obfuscated loader navigates to fetched URL
    crit: hostile
    conf: 0.94
    attack: T1189
    all:
      - id: micro-behaviors/communications/http/url/navigation::xhr-response-href-assignment
    any:
      - id: metadata/lang/encoding::js-dense-hex-escapes
      - id: micro-behaviors/process/interpreter/eval/indirect::js-global-eval-hex-escaped-key
