defaults:
  platforms:
  - windows
  for:
  - pe
  attack: T1176,T1189
  mbc: E1478
composite_rules:
- id: adware-offer-browser-probe-installer
  desc: Adware installer probes browsers for offers
  crit: hostile
  conf: 0.96
  all:
  - id: well-known/unwanted/outbrowse::always-offer-flag
  - id: well-known/unwanted/outbrowse::cc-installer23-browser-rtti
  - id: micro-behaviors/os/application/target/browser::browser-apps
  any:
  - id: micro-behaviors/os/registry/keys/browser::default-http-handler-registry-path
  - id: metadata/file/profile/com-class-id::webbrowser-activex-clsid
  unless:
  - id: metadata/signed/platform/
