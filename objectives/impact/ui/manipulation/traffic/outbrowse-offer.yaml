# OutBrowse-class bundlers probe installed browsers then push an offer-gated
# download/install flow (BrowseFox / OutBrowse SmartInstaller lineage).
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1176,T1189
  mbc: E1478

composite_rules:
  - id: adware-offer-browser-probe-installer
    desc: Adware installer probes browsers for offers
    crit: hostile
    conf: 0.96
    all:
      - id: well-known/unwanted/outbrowse::always-offer-flag
      - id: well-known/unwanted/outbrowse::cc-installer23-browser-rtti
      - id: micro-behaviors/fs/path/application/executable::browser-apps
    any:
      - id: objectives/discovery/host/browser/identity::default-browser-registry-probe-bin
      - id: micro-behaviors/os/com/object::webbrowser-activex-clsid
    unless:
      - id: well-known/app/
      - id: metadata/signed/platform/
