# Verification wording alone also occurs on real challenge pages. Require the
# unrelated software-update/restart pretext before inferring deceptive routing.
# This page collects no credentials; its result is a coerced navigation.
defaults:
  platforms: [windows, unix]
  for: [html, php, javascript]
  attack: T1204.001
composite_rules:
  - id: update-pretext-verification-redirect
    desc: Update warning and fake verification overlay force navigation
    crit: hostile
    conf: 0.95
    near_bytes: 2500
    all:
      - id: micro-behaviors/ui/window/dom/render::fixed-fullscreen-high-z-overlay-style
      - id: micro-behaviors/ui/window/navigation::browser-timer-delayed-location-redirect
      - id: micro-behaviors/ui/controls/captcha::verify-human-text
      - id: micro-behaviors/ui/keywords::required-update-restart-message
  - id: update-verification-redirect-json-reads
    desc: Deceptive verification redirect with JSON reads
    crit: hostile
    conf: 0.95
    for: [php]
    all:
      - id: update-pretext-verification-redirect
      - id: micro-behaviors/communications/http/response::php-json-variable-redirect-cooccurrence
