# Full-viewport overlay delivered as CSS rather than as script. The JavaScript
# analogue (iframe overlay built through the DOM) is remote-iframe-overlay in
# javascript.yaml; this is the stylesheet path, which is what survives an HTML
# email sanitizer that strips script but keeps styles. Covering the host page
# with a fixed, top-layer, remote-image element is how injected CSS spoofs a
# sign-in screen or captures clicks meant for the real interface.
defaults:
  platforms: [unix, windows]
  for: [html, text]

composite_rules:
  - id: css-injected-fullscreen-remote-overlay
    desc: Sanitizer-bypassing CSS draws a full-viewport remote overlay
    crit: hostile
    conf: 0.98
    attack: T1189
    all:
      - id: micro-behaviors/data/format/css::media-prelude-semicolon-comment-mutation
      - id: micro-behaviors/ui/window/manage/style::fixed-viewport-style
      - id: micro-behaviors/ui/window/manage/style::high-z-index-style
      - id: micro-behaviors/communications/http/client/resource::stylesheet-remote-url-value
    near_bytes: 3600
