defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  - package.json
  - chrome-manifest
traits:
- id: ui-delivery-class
  desc: JavaScript referring to .ui-delivery CSS class
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: .ui-delivery
- id: sponsored-copy-keyword
  desc: Repeated standalone sponsored label
  crit: notable
  conf: 0.7
  count_min: 2
  if:
    type: string_literal
    exact: sponsored
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: metadata/build/bundler/asset::js-hashed-bundle-basename
  - id: metadata/build/bundler/runtime::js-webpack-bundle
  - id: metadata/file/profile/blockchain::openapi-gas-sponsored-json-field
- id: promotion-token-reference
  desc: References a promoted-content identifier
  crit: component
  conf: 0.7
  if:
    type: text
    regex: (^|[^.#\w-])promoted([-_][A-Za-z0-9_-]+|[A-Z][A-Za-z0-9_]*)\b
  not:
  - regex: promoted_to_task_id
  - regex: (?i)promoted[\w-]*renderer
  - regex: (?i)\bpromoted[\w-]*detour[\w-]*\b
  - regex: (?i)\bpromoted(Lines|Tokens|Nodes|Hosts?|Elements?|Containers?|Count|Bytes|Style|Css)\b
  - regex: (?i)\bpromoted(To|From|Positioning)\w*
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: metadata/build/bundler/asset::js-hashed-bundle-basename
  - id: metadata/build/bundler/runtime::js-webpack-bundle
- id: news-delivery-pattern
  desc: news or content delivery pattern
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: (?i)\.(news|tips|rm|adb)\.js
- id: display-none-important
  desc: Forces display none important
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: ;display:none !important;
- id: observe-document-body
  desc: Observes document body mutations
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: observer(document.body
- id: style-class-filter
  desc: Filters style and class mutations
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: 'attributeFilter: [''style'', ''class'']'
- id: remove-target-call
  desc: Removes mutated target element
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: \bm\.target\.remove\s*\(
composite_rules:
- id: newtab-stored-remote-json-html-fields
  desc: New tab stores remote JSON and interpolates object fields into markup
  crit: notable
  conf: 0.9
  attack: T1176
  scope: archive
  for: [crx, xpi, zip, json, chrome-manifest, javascript]
  all:
  - id: metadata/permission/manifest::chrome-newtab-override
  - id: micro-behaviors/communications/http/request/json::fetch-call-near-json-parse
  - id: micro-behaviors/data/db/web-storage::chrome-storage-local-set
  - id: micro-behaviors/data/db/web-storage::chrome-storage-area-get
  - id: micro-behaviors/ui/window/insert-html::object-name-in-paragraph-markup
- id: extension-remote-html-content-slot
  desc: Extension renders fetched HTML content
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/communications/http/client/response-body::fetch-html-innerhtml
  - id: micro-behaviors/data/db/web-storage::browser-storage-persistence
  any:
  - id: micro-behaviors/browser-extension/lifecycle::chrome-namespace
  - id: micro-behaviors/browser-extension/lifecycle::browser-namespace-core
  - id: micro-behaviors/browser-extension/lifecycle::browser-namespace-data
- id: newtab-remote-html-promo-lifecycle
  desc: New-tab promotions include remote HTML popups
  crit: suspicious
  conf: 0.97
  attack: T1176
  scope: archive
  for:
  - crx
  - xpi
  - zip
  - chrome-manifest
  - javascript
  all:
  - id: metadata/permission/manifest::chrome-newtab-override
  - id: extension-remote-html-content-slot
  - id: micro-behaviors/browser-extension/tabs::install-listener-tab-url-code
  - id: micro-behaviors/browser-extension/lifecycle::runtime-set-uninstall-url
  - id: micro-behaviors/communications/url/http-query::utm-source-medium-campaign-url
  - id: micro-behaviors/data/db/web-storage::indexeddb-enumerate-delete
- id: extension-remote-html-page-replacement
  desc: Extension writes fetched HTML into the page
  crit: suspicious
  conf: 0.92
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/ui/window/insert-html::document-root-html-replacement
  - id: micro-behaviors/communications/http/client/response-body::fetch-html-innerhtml
  - id: micro-behaviors/browser-extension/lifecycle::chrome-namespace
  unless:
  - id: metadata/build
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: dynamic-ad-injection-a
  desc: Dynamic ad injection innerHTML with keyword
  crit: suspicious
  conf: 0.7
  for:
  - javascript
  - typescript
  all:
  - id: sponsored-copy-keyword
  - id: micro-behaviors/ui/window/insert-html::browser-innerhtml-assignment
  near_bytes: 256
  unless:
  - id: packaged-ui-ad-copy-context
  - id: micro-behaviors/process/interpreter/vm/
  - id: metadata/package/testing/
  - id: metadata/build/bundler/asset::js-dist-asset-bundle
  - id: micro-behaviors/data/manipulation/
  - id: metadata/lang/source/syntax/call/invocation::replace-member-call-syntax
  - id: metadata/lang/source/syntax/call/relationship::open-write-chained-call-text
  - id: metadata/path::test-directory-component
- id: dynamic-ad-injection-b
  desc: Dynamic ad injection innerHTML with promo
  crit: suspicious
  conf: 0.7
  all:
  - id: promotion-token-reference
  any:
  - id: micro-behaviors/ui/window/insert-html::browser-innerhtml-assignment
  - id: micro-behaviors/data/collection/dom::append-child-reference
  near_bytes: 2048
  unless:
  - id: well-known/lib/development/vscode-webview::acquire-vscode-api
  - id: micro-behaviors/process/interpreter/vm/
  - id: metadata/build
  - id: metadata/file/profile/markup::ecommerce-promoted-listing-copy
  - id: metadata/file/profile/markup::localized-promotion-copy-label
  - id: sponsored-content-filter-extension
  - id: companion-extension-promotion-context
- id: dynamic-ad-injection-c
  desc: Dynamic ad injection insertBefore with keyword
  crit: suspicious
  conf: 0.7
  for:
  - javascript
  - typescript
  - html
  all:
  - id: micro-behaviors/data/collection/dom::insert-before-call
  - id: sponsored-copy-keyword
  near_bytes: 2048
  unless:
  - id: well-known/lib/development/vscode-webview::acquire-vscode-api
  - id: micro-behaviors/process/interpreter/vm/
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: metadata/build/bundler/asset::js-dist-asset-bundle
  - id: metadata/build/bundler/asset::js-hashed-bundle-basename
  - id: metadata/document/html::html-root-at-start
  - id: well-known/app/browser/google-web::google-ads-bgc-bootstrapper
  - id: sponsored-content-filter-extension
- id: dynamic-ad-injection-d
  desc: Dynamic ad injection insertBefore with promo
  crit: suspicious
  conf: 0.7
  for:
  - javascript
  - typescript
  - html
  all:
  - id: micro-behaviors/data/collection/dom::insert-before-call
  - id: promotion-token-reference
  near_bytes: 2048
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: metadata/build/bundler/asset::js-dist-asset-bundle
  - id: metadata/build/bundler/asset::js-hashed-bundle-basename
  - id: sponsored-content-filter-extension
  - id: micro-behaviors/os/telemetry/activity::posthog-reference-exclusion
- id: dynamic-ad-injection
  desc: Potential dynamic ad or content injection pattern
  crit: suspicious
  conf: 0.7
  any:
  - id: dynamic-ad-injection-a
  - id: dynamic-ad-injection-b
  - id: dynamic-ad-injection-c
  - id: dynamic-ad-injection-d
- id: remote-iframe-overlay
  desc: Full-screen remote iframe delivery
  crit: hostile
  conf: 0.99
  attack: T1189,T1491.002
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/ui/window/insert-html::browser-create-iframe-element
  - id: micro-behaviors/ui/window/insert-html::browser-iframe-src-variable
  - id: micro-behaviors/data/collection/dom::append-child-reference
  - id: micro-behaviors/ui/window/style::fixed-viewport-style
  - id: micro-behaviors/ui/window/style::high-z-index-style
  - id: micro-behaviors/ui/window/style::browser-dom-overflow-suppressed
  - id: micro-behaviors/communications/url/reference::bracketed-http-url-reference
  near_bytes: 2400
- id: persistent-fullscreen-shadow-iframe-overlay
  desc: Persistent full-screen shadow-DOM iframe overlay injection
  crit: hostile
  conf: 0.98
  attack: T1189,T1491.002
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/ui/window/dom/create::shadow-root-near-iframe-create
  - id: micro-behaviors/ui/window/style::fixed-viewport-style
  - id: micro-behaviors/ui/window/style::high-z-index-style
  - id: micro-behaviors/ui/window/event::browser-mutation-observer
  - id: micro-behaviors/data/collection/dom::append-child-reference
  near_bytes: 2048
- id: body-children-hide
  desc: Hides existing body elements
  crit: suspicious
  conf: 0.95
  for:
  - javascript
  - typescript
  - html
  all:
  - id: micro-behaviors/ui/window/style::direct-body-child-selector
  - id: display-none-important
- id: body-style-guard
  desc: Guards hidden body element state
  crit: suspicious
  conf: 0.9
  for:
  - javascript
  - typescript
  - html
  all:
  - id: observe-document-body
  - id: style-class-filter
  - id: body-children-hide
  - id: remove-target-call
- id: sponsored-content-filter-extension
  desc: Site-scoped sponsored-content filtering extension context
  crit: exception
  conf: 0.96
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/ui/window/advertising::browser-query-sponsored-marker
  - id: micro-behaviors/ui/window/advertising::browser-hide-sponsored-element
  - id: micro-behaviors/ui/window/insert-html::browser-innerhtml-assignment
  - id: micro-behaviors/browser-extension/lifecycle::chrome-namespace-core
- id: companion-extension-promotion-context
  desc: Popup promotes a companion extension
  crit: exception
  conf: 0.95
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/browser-extension/action::companion-extension-promotion-link
  - id: micro-behaviors/ui/window/insert-html::browser-innerhtml-assignment
  - id: micro-behaviors/browser-extension/lifecycle::chrome-namespace-core
  - id: micro-behaviors/browser-extension/tabs::chrome-tabs-create
- id: packaged-ui-ad-copy-context
  desc: Packaged UI or sponsored-content filter context
  crit: exception
  conf: 0.9
  for:
  - javascript
  - typescript
  any:
  - id: well-known/lib/development/vscode-webview::acquire-vscode-api
  - id: metadata/build/bundler/asset::js-hashed-bundle-basename
  - id: sponsored-content-filter-extension
