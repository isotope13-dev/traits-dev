defaults:
  platforms: [windows, unix]
  for:
    - class
traits:
  - id: shutdown-string
    desc: System shutdown command
    crit: suspicious
    conf: 0.85
    mbc: B0029
    attack: T1529
    if:
      type: text
      regex: \bshutdown(\.exe)?\s+[-/](s|r|f|t)\b
  # One leg of the Java-RAT command vocabulary in
  # objectives/command-and-control/backdoor/rat/multi/java, which needs four of
  # nine such words. On its own the matcher finds the word "uninstall" -- in an
  # installer, a package manager, a settings label, a registry key name or a
  # doc comment -- which is a signature fragment with no standalone meaning,
  # not a self-uninstall command. The five `unless:` clauses below, all aimed at
  # Selenium's `uninstallExtension` through four different matcher types, are
  # the symptom of rating a bare word `suspicious`.
  - id: uninstall-string
    desc: Uninstall command word
    crit: component
    conf: 0.9
    mbc: F0007
    attack: T1070.004
    if:
      type: text
      regex: (?i)(^|[^A-Za-z0-9])uninstall($|[^A-Za-z0-9])
    unless:
      - type: path
        substr: selenium-firefox-driver-
      - type: text
        substr: uninstallExtension
      - type: hex
        pattern: 75 6E 69 6E 73 74 61 6C 6C 45 78 74 65 6E 73 69 6F 6E
      - type: raw
        regex: uninstallExtension
      - type: path
        substr: org/openqa/selenium/firefox/FirefoxDriver.class
  - id: processes-string
    desc: Process listing command
    crit: notable
    conf: 0.8
    mbc: E1057
    attack: T1057
    if:
      type: text
      # C2 command token, not a Java field named `processes` (Apache Ant
      # ProcessDestroyer) or other identifier embedded in class UTF-8 pools.
      regex: '(?i)(^|[^A-Za-z0-9_])processes([^A-Za-z0-9_]|$)'
    unless:
      - id: metadata/build/bundler/vscode::vscode-language-server-library-text
      - type: text
        substr: cloudfoundry
      - type: path
        substr: org/apache/tools/ant/
      - type: path
        regex: '(?i)apache\.ant_'
      - id: well-known/tool/development/vscode-extension/redhat-java/
  - id: startup-list-string
    desc: Startup persistence command
    crit: suspicious
    conf: 0.9
    mbc: F0004
    attack: T1547
    if:
      type: text
      substr: startup-list
  - id: chk-priv-string
    desc: Check privileges command
    crit: suspicious
    conf: 0.85
    mbc: B0014
    attack: T1134
    if:
      type: text
      substr: chk-priv
  - id: req-priv-string
    desc: Request elevated privileges command
    crit: suspicious
    conf: 0.9
    mbc: B0014
    attack: T1134
    if:
      type: text
      substr: req-priv
