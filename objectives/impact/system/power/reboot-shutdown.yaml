# Detects scripts that write shutdown / reboot commands into a shell
# profile (.bashrc / .zshrc) — sabotages the next interactive shell.
#
# The shell-rc filename atoms this used to define now live at
# micro-behaviors/fs/path/config/shell (a filename reference is not a
# system-power behaviour); this file keeps the shutdown token and the
# sabotage composite that combines them.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell]
traits: []
composite_rules:
  - id: power-command-invocation
    desc: Invokes a system power command
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/os/event/shutdown::shell-power-command
      - id: micro-behaviors/os/event/shutdown::js-exec-power-command
  - id: shell-profile-target
    desc: Shell profile filename reference
    crit: component
    any:
      - id: micro-behaviors/fs/path/config/shell::bashrc-filename
      - id: micro-behaviors/fs/path/config/shell::zshrc-filename
  - id: shell-profile-shutdown-sabotage
    desc: Shell profile shutdown command sabotage
    crit: suspicious
    conf: 0.95
    attack: "T1490, T1059"
    all:
      - id: power-command-invocation
      - id: shell-profile-target
    any:
      - id: micro-behaviors/os/privilege/elevation::sudo-command
      - id: micro-behaviors/os/privilege/elevation::sudo-command-string
    # These tokens only imply sabotage when they occur in the same command.
    # Installers commonly mention shell profiles, sudo, and a separate reboot
    # instruction hundreds of lines apart.
    near_lines: 4
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: well-known/tool/development/editor/vscode/

  # The sabotage actually written: the power command is appended to the rc
  # file rather than merely named near it, so the next interactive shell on
  # that machine runs it. Nothing legitimate appends a shutdown to a user's
  # shell startup file.
  - id: shell-profile-shutdown-append
    desc: Appends a power command to a shell profile
    crit: hostile
    conf: 0.97
    attack: T1490,T1529
    for: [javascript]
    all:
      - id: shell-profile-shutdown-sabotage
      - id: micro-behaviors/fs/write/file/append::append-file-sync
    unless:
      - id: metadata/package/testing/harness/runtime/
