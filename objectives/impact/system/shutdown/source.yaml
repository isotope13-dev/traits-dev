defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source, class, java_class, c, cpp]
  crit: suspicious
  conf: 0.95
  attack: T1529

traits:
  - id: source-forced-shutdown-command
    desc: Source embeds a forced shutdown command
    if:
      type: text
      regex: '(?i)(shutdown\s+(-h|/s)|(System Events|osascript).{0,180}to (restart|shut down))'
    unless:
      - id: metadata/package/testing/harness/runtime::test-basename-pattern
      - id: metadata/package/testing/presence/harness::python-test-file
