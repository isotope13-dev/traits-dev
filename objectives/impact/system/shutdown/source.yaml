defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source, class, java_class, c, cpp]
  crit: suspicious
  conf: 0.95
  attack: T1529

traits: []

composite_rules:
  - id: periodic-launchagent-forced-shutdown
    desc: Periodic LaunchAgent repeatedly forces shutdown
    crit: hostile
    conf: 0.99
    attack: T1543.004,T1529
    all:
      - id: micro-behaviors/os/event/shutdown::source-forced-shutdown-command
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
      - id: micro-behaviors/os/service/launchagent::source-startinterval-key
      - id: micro-behaviors/os/service/start::launchctl-load-command

  - id: perl-periodic-launchagent-forced-shutdown
    desc: Perl package schedules recurring forced shutdown
    crit: hostile
    conf: 0.99
    for: [perl, tar, zip]
    scope: archive
    all:
      - id: micro-behaviors/os/event/shutdown::source-forced-shutdown-command
      - id: objectives/privilege-escalation/exploit/format-string::plist-runatload-key
      - id: objectives/privilege-escalation/exploit/format-string::plist-programarguments-key
      - id: micro-behaviors/process/create/system::system-process-call

  - id: jvm-periodic-launchagent-forced-shutdown
    desc: JVM LaunchAgent repeatedly forces shutdown
    crit: hostile
    conf: 0.99
    for: [class, java_class, jar]
    scope: archive
    all:
      - id: micro-behaviors/os/event/shutdown::source-forced-shutdown-command
      - id: micro-behaviors/os/service/launchagent::jvm-runatload-enabled-string
      - id: micro-behaviors/os/service/launchagent::jvm-startinterval-string
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode
