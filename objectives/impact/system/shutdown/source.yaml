defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source, class, java_class, c, cpp]
  crit: suspicious
  conf: 0.95
  attack: T1529

traits:
  # Notable, not suspicious: powering a machine off is the documented job of
  # anything that manages machines -- busybox *implements* `shutdown`, and
  # s390-tools, Vagrant and VM-Pilot drive guests with it. "Rarely legitimate"
  # is not true of this command. The impact reading belongs to the composites
  # in objectives/supply-chain/trojanized/library/source, which pair it with a
  # LaunchAgent that repeats it.
  - id: source-forced-shutdown-command
    desc: Source embeds a forced shutdown command
    crit: notable
    if:
      type: text
      regex: '(?i)(shutdown\s+(-h|/s)|(System Events|osascript).{0,180}to (restart|shut down))'
    unless:
      # AWS's own API model, embedded as data by every AWS SDK: its
      # `documentation` fields quote the commands and attack names the service
      # deals with (EC2's `shutdown -h`, Shield's ACK_FLOOD).
      - id: well-known/lib/cloud/aws-api-model::aws-service-model
      - id: metadata/package/testing/harness/runtime::test-basename-pattern
      - id: metadata/package/testing/presence/harness::python-test-file

composite_rules:
  - id: periodic-launchagent-forced-shutdown
    desc: Periodic LaunchAgent repeatedly forces shutdown
    crit: hostile
    conf: 0.99
    attack: T1543.004,T1529
    all:
      - id: source-forced-shutdown-command
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
      - id: micro-behaviors/os/service/launchagent::source-startinterval-key
      - id: micro-behaviors/os/service/start::launchctl-load-command-text
