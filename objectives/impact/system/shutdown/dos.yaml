# DOS destructive reboot payload: resets the CPU through the far jump reset
# vector after wiping the hardware configuration.
defaults:
  platforms: [unix, windows]
  for: [dos_com, static-lib, data]
  size_max: 65536
  attack: T1529

composite_rules:
  - id: dos-cmos-wipe-forced-reboot
    desc: DOS resets CPU after hardware CMOS wipe
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/event/shutdown::dos-reset-vector-reboot-jump
      - id: metadata/binary/instruction/opcode::x86-cmos-port-write-sequence
    unless:
      - id: well-known/app/system/limine::limine-boot-image-context
