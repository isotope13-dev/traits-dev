# CMOS port access and a CPU reset vector can co-occur in a destructive
# payload or a boot utility; the pattern does not establish a wipe.
defaults:
  platforms: [unix, windows]
  for: [dos_com, static-lib, data]
  size_max: 65536
  attack: T1529

composite_rules:
  - id: dos-cmos-wipe-forced-reboot
    desc: CMOS port writes and CPU reset vector
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/event/shutdown::dos-reset-vector-reboot-jump
      - id: metadata/binary/instruction/opcode::x86-cmos-port-write-sequence
