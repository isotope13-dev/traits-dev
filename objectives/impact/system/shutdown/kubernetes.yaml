# A DaemonSet that mounts `/` and reboots through chroot can force every
# schedulable node offline. This models the technique independently of the
# workload, container, mountpoint, and campaign names.
defaults:
  platforms: [unix]
  for: [scripts, source]
  attack: T1529,T1611

composite_rules:
  - id: privileged-daemonset-host-forced-reboot
    desc: Privileged DaemonSet force-reboots host nodes
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/container/runtime::daemonset-workload-spec
      - id: micro-behaviors/os/container/runtime::privileged-pod-spec
      - id: micro-behaviors/os/container/runtime::host-root-hostpath-volume
      - id: micro-behaviors/os/container/namespace::host-root-chroot
      - id: micro-behaviors/os/event/shutdown::unix-forced-reboot-command
    near_lines: 100
    unless:
      - id: well-known/tool/detection/threat-intel/
