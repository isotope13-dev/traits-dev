defaults:
  platforms: [unix]
  for: [javascript]
composite_rules:
  - id: node-shell-profile-shutdown
    desc: Installs immediate shutdown in shell startup profiles
    crit: hostile
    attack: T1529
    # Both legs report the append call; do not join unrelated nearby writes.
    near_bytes: 32
    all:
      - id: micro-behaviors/fs/write/file/shell::node-appends-home-profile-loop
      - id: micro-behaviors/os/event/shutdown::node-appends-immediate-shutdown
