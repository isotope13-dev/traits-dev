defaults:
  platforms: [windows]
  for: [oledoc]

composite_rules:
  - id: ole-package-session-disruption-command
    desc: OLE Package embeds a Windows logoff or shutdown command
    crit: hostile
    conf: 0.96
    attack: T1204.002,T1529
    all:
      - id: objectives/execution/interpreter/document/command::ole-package-dangerous-clsid
      - id: metadata/document/ole::ole10native-stream
    any:
      - id: micro-behaviors/os/event/shutdown::rundll-user-exitwindows-command
      - id: micro-behaviors/os/event/shutdown::rundll-user-ordinal-exitwindows
      - id: micro-behaviors/os/event/shutdown::shutdown-forced-restart-command
