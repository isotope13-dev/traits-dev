defaults:
  platforms:
    - windows
  for:
    - pe
  attack: T1529
  mbc: B0029
traits:
composite_rules:
  - id: forced-reboot-pe
    desc: Forced immediate system reboot in PE
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/system::shutdown-exe-name-reference
      - id: micro-behaviors/os/event/shutdown::forced-reboot-command-pattern
  - id: nsis-opaque-overlay-reboot
    desc: NSIS opaque payload with reboot and clipboard
    crit: hostile
    conf: 0.97
    attack: T1529,T1027.009
    all:
      - id: metadata/binary/installer/script::nsis
      - id: metadata/binary/signing::signed-pe-large-noncertificate-overlay
      - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
      - id: micro-behaviors/os/event/shutdown::shutdown-privilege-reboot-api
      - id: objectives/command-and-control/dropper/staging/installer::nsis-suspicious-identity
      - id: micro-behaviors/os/clipboard/reference::win32-clipboard-access
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: nsis-opaque-reboot-clipboard-loader
    desc: Opaque NSIS overlay combines reboot and clipboard APIs
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1115,T1529
    all:
      - id: metadata/binary/installer/script::nsis
      - id: objectives/anti-static/pack/overlay::nsis-dominant-opaque-overlay
      - id: metadata/binary/layout/overlay::high-entropy-overlay
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/os/event/shutdown::shutdown-privilege-reboot-api
      - id: micro-behaviors/os/clipboard/reference::win32-clipboard-access
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: nsis-self-issued-opaque-reboot-clipboard
    desc: Self-issued NSIS overlay with reboot and clipboard
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1115,T1529
    all:
      - id: metadata/binary/installer/script::nsis
      - id: metadata/binary/signing::signed-pe-large-noncertificate-overlay
      - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
      - id: metadata/file/entropy::very-high-overall-entropy-75
      - id: metadata/binary/layout/overlay::large-overlay-64k
      - id: micro-behaviors/os/event/shutdown::shutdown-privilege-reboot-api
      - id: micro-behaviors/os/clipboard/reference::win32-clipboard-access
    unless:
      - id: metadata/signed/platform/
