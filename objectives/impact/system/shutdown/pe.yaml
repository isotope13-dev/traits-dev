defaults:
  platforms:
    - windows
  for:
    - pe
  attack: T1529
  mbc: B0029
traits:
  - id: shutdown-restart-flag
    desc: Shutdown restart flag in binary
    crit: component
    conf: 0.9
    if:
      type: text
      regex: shutdown.{0,30}-r
  - id: shutdown-force-flag-pe
    desc: Shutdown force flag in binary
    crit: component
    conf: 0.9
    if:
      type: text
      regex: shutdown.{0,30}-f
  - id: shutdown-zero-delay
    desc: Shutdown with zero-second delay
    crit: component
    conf: 0.85
    if:
      type: text
      regex: shutdown.{0,50}-t\s*0\b
composite_rules:
  - id: forced-reboot-command-pattern
    desc: Shutdown forced-reboot flags
    crit: notable
    conf: 0.93
    all:
      - id: shutdown-restart-flag
      - id: shutdown-force-flag-pe
      - id: shutdown-zero-delay
  - id: forced-reboot-pe
    desc: Forced immediate system reboot in PE
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/system::shutdown-exe-name-reference
      - id: forced-reboot-command-pattern
  - id: shutdown-privilege-reboot-api
    desc: Privilege-enabled reboot API use
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/ui/window/manage/control::exit-windows-ex
      - id: micro-behaviors/os/privilege/token::shutdown-privilege-name
      - id: micro-behaviors/os/privilege/token::adjust-token-privileges
      - id: micro-behaviors/os/privilege/token::lookup-privilege-value
    downgrade:
      any:
        - id: metadata/signed/platform::microsoft-corporation
        - id: metadata/signed/developer::x-ways-software-technology-aktiengesellschaft
        # Endpoint-security and OEM tools (Norton, antivirus installers)
        # legitimately enable SeShutdownPrivilege + ExitWindowsEx to reboot
        # after definition/driver updates.
        - id: metadata/signed/leaf::nortonlifelock-inc.
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/sfx::wextract-tool
      - id: well-known/app/communication/telegram::telegram-desktop-signed-inno-installer
  - id: nsis-opaque-overlay-reboot
    desc: NSIS opaque payload with reboot and clipboard
    crit: hostile
    conf: 0.97
    attack: T1529,T1027.009
    all:
      - id: metadata/binary/installer/script::nsis
      - id: metadata/binary/anomaly/signing::signed-pe-large-noncertificate-overlay
      - id: metadata/signed/certificate/identity::pe-cert-leaf-self-issued-kv
      - id: shutdown-privilege-reboot-api
      - id: objectives/command-and-control/dropper/execution/installer::nsis-suspicious-identity
      - id: micro-behaviors/os/clipboard/access::win32-clipboard-access
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: nsis-opaque-reboot-clipboard-loader
    desc: Opaque NSIS overlay combines reboot and clipboard APIs
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1115,T1529
    all:
      - id: metadata/binary/installer/script::nsis
      - id: objectives/command-and-control/dropper/execution/installer::nsis-dominant-encrypted-overlay
      - id: metadata/binary/layout::high-entropy-overlay
      - id: metadata/binary/layout::pe-no-signature-record
      - id: shutdown-privilege-reboot-api
      - id: micro-behaviors/os/clipboard/access::win32-clipboard-access
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: nsis-self-issued-opaque-reboot-clipboard
    desc: Self-issued NSIS overlay with reboot and clipboard
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1115,T1529
    all:
      - id: metadata/binary/installer/script::nsis
      - id: metadata/binary/anomaly/signing::signed-pe-large-noncertificate-overlay
      - id: metadata/signed/certificate/identity::pe-cert-leaf-self-issued-kv
      - id: metadata/binary/metrics/threshold::very-high-overall-entropy-75
      - id: metadata/binary/layout::large-overlay-64k
      - id: shutdown-privilege-reboot-api
      - id: micro-behaviors/os/clipboard/access::win32-clipboard-access
    unless:
      - id: metadata/signed/platform/
