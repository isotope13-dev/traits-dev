defaults:
  platforms: [windows]
  for: [batch]
  attack: T1529

composite_rules:
  - id: batch-rundll-exitwindows-shutdown
    desc: Batch invokes RUNDLL to force shutdown
    crit: hostile
    conf: 0.96
    # Either USER ExitWindows spelling — the named export or the Win16
    # ordinal 7 — is the same forced-logoff invocation; the Windows system
    # directory path grounds it in the legacy USER module.
    all:
      - id: micro-behaviors/fs/path/system::windows-system-directory
    any:
      - id: micro-behaviors/os/event/shutdown::rundll-user-exitwindows-command
      - id: micro-behaviors/os/event/shutdown::rundll-user-ordinal-exitwindows

  - id: batch-startup-persistence-shutdown
    desc: Batch stages Startup persistence and triggers shutdown
    crit: hostile
    conf: 0.98
    attack: T1529,T1547.001
    all:
      - id: micro-behaviors/os/event/shutdown::shutdown-command-text
      - id: micro-behaviors/os/autorun/login-items::batch-copy-startup-reference
