defaults:
  platforms: [windows]
  for: [batch]
  attack: T1529

composite_rules:
  - id: batch-rundll-exitwindows-shutdown
    desc: Batch invokes RUNDLL to force shutdown
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/event/shutdown::rundll-user-exitwindows-command
      - id: micro-behaviors/fs/path/system::windows-system-directory
