defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: nsis-elevated-reboot-clipboard-profile
  desc: Elevated NSIS with reboot and clipboard APIs
  crit: suspicious
  conf: 0.98
  attack: T1529
  all:
  - id: metadata/binary/installer/script::nsis
  - id: micro-behaviors/os/privilege/manifest::require-administrator-large-pe-raw
  - id: objectives/impact/system/shutdown::shutdown-privilege-reboot-api
  - id: micro-behaviors/os/clipboard/reference::win32-clipboard-access
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/sysadmin/npcap::npcap-installer
  - id: well-known/tool/sysadmin/npcap::npcap-installer-context
  - id: well-known/tool/development/toolchain/elixir-lang::official-elixir-windows-nsis-installer
