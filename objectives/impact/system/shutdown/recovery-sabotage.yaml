defaults:
  platforms:
  - windows
  for:
  - scripts
  - source
  - binaries
composite_rules:
- id: multi-recovery-sabotage-forced-restart
  desc: Recovery sabotage with forced Windows restart
  crit: hostile
  conf: 0.99
  attack: T1490,T1529
  near_lines: 8
  all:
  - id: objectives/impact/degrade/system/recovery::shadow-copy-delete
  - id: objectives/impact/degrade/system/recovery::bcdedit-recovery
  any:
  - id: micro-behaviors/os/event/shutdown::shutdown-forced-restart-command
  - id: micro-behaviors/os/event/shutdown::rust-shutdown-forced-restart-argument-array
  unless:
  - id: well-known/tool/detection/pattern-catalog::attack-technique-map-module
  - id: well-known/tool/detection/pattern-catalog::command-pattern-guard-catalog
  - id: micro-behaviors/metaprogramming/generation::configured-source-builder
