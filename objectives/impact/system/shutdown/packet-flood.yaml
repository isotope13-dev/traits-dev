# Packet tasking plus the attack loop supplies hostile context. Generic
# privilege/ExitWindowsEx references remain neutral in their own homes.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: packet-flood-privileged-shutdown
    desc: Packet-tasked flood implant with privileged shutdown APIs
    crit: hostile
    conf: 0.96
    attack: T1529
    all:
      - id: micro-behaviors/communications/socket/receive::x86-recv-copied-record-dispatch
      - id: objectives/impact/dos/attack/flood::native-raw-udp-burst-flood
      - id: micro-behaviors/os/event/shutdown::shutdown-privilege-reboot-api
