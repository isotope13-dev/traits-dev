# A plain restart API can still sustain denial of service. No force flag is
# required: RunAtLoad plus an indefinite, short StartInterval reactivates it.
# Ordinary power APIs and daily maintenance schedules do not satisfy this.
defaults:
  platforms: [macos]
  crit: hostile
  conf: 0.98
  attack: T1529,T1543.004
composite_rules:
  - id: launchagent-short-interval-power-loop
    desc: Persistent short-interval LaunchAgent power loop
    for: [scripts, source, perl]
    all:
      - id: micro-behaviors/os/event/shutdown::launchagent-power-onload
      - id: micro-behaviors/os/event/shutdown::launchagent-short-interval-power-action
    any:
      - id: micro-behaviors/os/service/launchagent::source-launchagents-literal
      - id: micro-behaviors/os/service/launchagent::source-launchagents-join
  - id: jvm-launchagent-short-interval-power-loop
    desc: JVM persistent short-interval power loop
    for: [class, java_class]
    all:
      - id: micro-behaviors/os/event/shutdown::jvm-launchagent-power-action
      - id: micro-behaviors/os/service/launchagent::jvm-short-startinterval-value
      - id: micro-behaviors/os/service/launchagent::jvm-launchagents-string
      - id: micro-behaviors/os/service/start::jvm-launchctl-string
