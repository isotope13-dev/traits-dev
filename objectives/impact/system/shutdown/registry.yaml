defaults:
  platforms: [windows]
  for: [reg]
  attack: T1547.001,T1529

composite_rules:
  - id: reg-autostart-user-logoff
    desc: Registry autostart triggers a user logoff
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/registry/autostart/reference::windows-run-key-path
      - id: micro-behaviors/os/event/shutdown::rundll-user-exitwindows-command
