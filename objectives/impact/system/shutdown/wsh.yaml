# Reboot is a neutral servicing capability. Impact intent requires it to
# co-occur with the existing hostile intentional-file-destruction pattern.
defaults:
  platforms: [windows]
  for: [vbs, javascript, powershell, batch]
  attack: T1529
  mbc: B0029

composite_rules:
  - id: wmi-reboot-after-file-destruction
    desc: WMI reboot after intentional file destruction
    crit: hostile
    conf: 0.98
    attack: T1485,T1529
    all:
      - id: objectives/impact/destroy/file-deletion::intentional-file-destruction
    any:
      - id: micro-behaviors/os/event/shutdown::wmi-operatingsystem-reboot
      - id: micro-behaviors/os/event/shutdown::wmi-win32shutdown-method
