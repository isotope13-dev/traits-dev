defaults:
  platforms: [windows, unix]
  for:
    - go
  attack: T1529
  mbc: B0029
traits:
  - id: windows-shutdown-cmd
    desc: Windows shutdown command token
    crit: component
    conf: 0.9
    if:
      type: string_literal
      exact: shutdown
  - id: shutdown-force-restart
    desc: Shutdown with force restart flag
    crit: suspicious
    conf: 0.95
    if:
      # Documentation and API model defaults may describe this command
      # without executing it. Require a Go process-launch call containing the
      # literal shutdown command and restart flag.
      type: tree-sitter
      kind: call
      regex: '(?is)\bexec\.Command(Context)?\([^)]{0,160}\bshutdown[^)]{0,160}/r\b'
    unless:
      - id: well-known/app/system/bridge::documented-system-control-context
  - id: shutdown-force-flag
    desc: Shutdown force flag
    crit: suspicious
    conf: 0.9
    if:
      # Match a real Go process launch containing both the shutdown command
      # and its force flag. A source-level marker list such as
      # `[]string{"shutdown", "/f"}` is not execution evidence.
      type: tree-sitter
      kind: call
      regex: '(?is)\bexec\.Command(Context)?\([^)]{0,160}["'']shutdown(\.exe)?["''][^)]{0,160}["'']/f\b'
  - id: shutdown-no-delay
    desc: Shutdown with no delay timeout
    crit: suspicious
    conf: 0.85
    if:
      # Keep the timeout check tied to the same process-launch behavior.
      type: tree-sitter
      kind: call
      regex: '(?is)\bexec\.Command(Context)?\([^)]{0,120}\bshutdown[^)]{0,120}/t\b[^)]{0,20}\b0\b'
composite_rules:
  - id: shutdown-force-restart-pattern
    desc: Shutdown with force and restart flag
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/impact/system/shutdown::windows-shutdown-cmd
      - id: objectives/impact/system/shutdown::shutdown-force-restart
    unless:
      - id: well-known/app/system/bridge::documented-system-control-context
  - id: shutdown-immediate-reboot
    desc: Immediate system reboot without user action
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/system/shutdown::windows-shutdown-cmd
      - id: objectives/impact/system/shutdown::shutdown-force-flag
      - id: objectives/impact/system/shutdown::shutdown-no-delay
