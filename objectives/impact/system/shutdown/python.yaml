# Python subprocess reboot / shutdown argv
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1529
  mbc: B0029
  crit: notable

traits:
# Call-site args for list argv only expose shape:array, so match the
# subprocess.*( ["reboot"] ) form in source text.
- id: subprocess-reboot-argv
  desc: subprocess reboot argv literal
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'subprocess\.(call|run|Popen)\(\s*\[\s*["'']reboot["'']'

- id: subprocess-shutdown-argv
  desc: subprocess shutdown argv literal
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'subprocess\.(call|run|Popen)\(\s*\[\s*["'']shutdown["'']'

- id: subprocess-poweroff-argv
  desc: subprocess poweroff argv literal
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'subprocess\.(call|run|Popen)\(\s*\[\s*["'']poweroff["'']'

- id: subprocess-halt-argv
  desc: subprocess halt argv literal
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'subprocess\.(call|run|Popen)\(\s*\[\s*["'']halt["'']'
