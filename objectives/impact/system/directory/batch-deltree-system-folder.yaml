defaults:
  platforms: [windows]
  for: [batch]
  attack: T1485

traits:
  - id: batch-deltree-windows-drivers
    desc: DELTREE purges the Windows drivers folder
    crit: hostile
    conf: 0.97
    for: [batch, text]
    size_max: 4096
    if:
      type: text
      regex: '(?im)^\s*@?deltree\s*/y\s+[a-z]:[/\\]windows[/\\]drivers[/\\]\*'

composite_rules:
  - id: batch-deltree-empties-windows-system-folder
    desc: Batch DELTREE empties Windows System folder
    crit: hostile
    conf: 0.95
    size_max: 4096
    all:
      - id: micro-behaviors/fs/delete/target::batch-delete-windows-system-folder
      - id: micro-behaviors/fs/delete/directory::windows-deltree-recursive
