defaults:
  platforms: [windows]
  for: [batch]
  attack: T1485

composite_rules:
  - id: batch-deltree-empties-windows-system-folder
    desc: Batch DELTREE empties Windows System folder
    crit: hostile
    conf: 0.95
    size_max: 4096
    all:
      - id: micro-behaviors/fs/delete/target::batch-delete-windows-system-folder
      - id: micro-behaviors/fs/delete/directory::windows-deltree-recursive
