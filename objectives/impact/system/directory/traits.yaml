defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  attack: T1485
traits:
  - id: ruby-vmware-predicate
    desc: Checks a VMware predicate
    crit: notable
    conf: 0.9
    for: [ruby]
    if:
      type: text
      regex: '\bvmware\?'
  - id: ruby-delete-drive-root
    desc: Deletes the root of a drive
    crit: suspicious
    conf: 0.94
    for: [ruby]
    if:
      type: text
      regex: 'delete_dir\s+[''"][A-Za-z]:'
  - id: linux-etc-delete
    desc: Linux /etc directory deletion attempt
    crit: notable
    conf: 0.95
    platforms:
      - linux
    if:
      type: text
      regex: rm\s+-rf\s+/etc(\s|$)
  - id: python-rmtree-etc
    desc: Python recursively deletes /etc
    crit: notable
    conf: 0.95
    platforms:
      - linux
    for: [python]
    if:
      type: symbol
      kind: call
      substr: rmtree
      arg:
        kind: string
        substr: /etc
  - id: linux-usr-delete
    desc: Linux /usr directory deletion attempt
    crit: notable
    conf: 0.95
    platforms:
      - linux
    if:
      type: text
      regex: rm\s+-rf\s+/usr(/\*|\s|$)|shutil\.rmtree.{0,50}["']/usr["']
  - id: linux-boot-delete
    desc: Linux /boot directory deletion attempt
    crit: suspicious
    conf: 0.95
    platforms:
      - linux
    if:
      type: text
      # Match removal of /boot itself or its direct contents, not selective
      # GRUB/EFI module cleanup performed by image builders.
      regex: rm\s+-rf\s+/boot(/\*|\s|$)|shutil\.rmtree.{0,50}["']/boot["']
    unless:
      - id: metadata/package/documentation/source::defensive-dangerous-command-doc
      - id: metadata/package/testing/presence/path::xml-testdata-directory-path
      - id: well-known/dual-use/tunnel/tailscale::tailscale-source-token
  - id: c-linux-bootloader-directory-delete
    desc: C source lists Linux bootloader directories
    crit: notable
    conf: 0.97
    for: [c]
    platforms: [linux]
    if:
      type: text
      regex: '"/boot/(grub2?|efi)"'
  - id: c-shell-removal-uses-path-array
    desc: C formats recursive removal from paths
    crit: notable
    conf: 0.96
    for: [c]
    platforms: [linux]
    if:
      type: text
      regex: 'rm\s+-rf\s+--\s+%s.{0,100}paths\s*\[i\]'

  - id: python-root-wipe-command
    desc: Python launches a root deletion command
    crit: suspicious
    conf: 0.95
    for: [python]
    attack: T1561
    if:
      type: symbol
      kind: call
      regex: '^(os\.(system|popen)|subprocess\.(run|call|Popen|check_call|check_output))$'
      arg:
        kind: string
        regex: 'rm\s+-rf\s+/(\*(\s|$|[;&|)"''])|\s+--no-preserve-root|\s*[;&|]|\s*$)'
    unless:
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
  - id: shell-rm-rf-macos-system-path
    desc: Shell command deletes macOS system root
    crit: suspicious
    conf: 0.95
    platforms: [macos]
    for: [shell]
    if:
      # The command node excludes comments, quoted references and heredocs.
      # Staging sysroots do not begin at the actual system root.
      type: tree-sitter
      query: |
        ((command name: (command_name) @name) @delete
          (#eq? @name "rm")
          (#match? @delete "^rm\\s+-rf\\s+[\"']?/(System|Library/System)(/\\*?)?([\"';\\s]|$)"))
  - id: python-macos-system-delete-command
    desc: Python launches macOS system deletion command
    crit: suspicious
    conf: 0.95
    platforms: [macos]
    for: [python]
    if:
      type: symbol
      kind: call
      # These APIs always interpret their string argument through a shell.
      regex: '^(os\.(system|popen)|subprocess\.get(status)?output)$'
      arg:
        index: 0
        kind: string
        regex: '^rm\s+-rf\s+["'']?/(System|Library/System)(/\*?)?(\s|["'']|;|$)'
  - id: python-subprocess-macos-system-delete
    desc: Shell subprocess deletes macOS system root
    crit: suspicious
    conf: 0.95
    platforms: [macos]
    for: [python]
    if:
      # Python's keyword argument facts do not retain shell=True. Require
      # that option on the same call as the command, rather than elsewhere
      # in a test file or on a separate harmless subprocess.
      type: tree-sitter
      query: |
        ((call
          function: (attribute
            object: (identifier) @module
            attribute: (identifier) @method)
          arguments: (argument_list . (string) @command
            (keyword_argument name: (identifier) @option value: (true)))) @delete
          (#eq? @module "subprocess")
          (#match? @method "^(run|call|Popen|check_call|check_output)$")
          (#eq? @option "shell")
          (#match? @command "^[\"']rm\\s+-rf\\s+[\"']?/(System|Library/System)(/\\*?)?([\"';\\s]|$)"))
  - id: python-rmtree-macos-system-path
    desc: Python recursively deletes macOS system root
    crit: suspicious
    conf: 0.95
    platforms: [macos]
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(shutil\.)?rmtree$'
      arg:
        index: 0
        kind: string
        regex: '^/(System|Library/System)/?$'
  - id: rmtree-call
    desc: rmtree critical path deletion
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)(shutil\.)?rmtree\s*\([^)]{0,80}["''](/|[A-Za-z]:[\\/]|~[/\\])'
    unless:
      - type: basename
        regex: '^(common_ship|ship)\.py$'
  - id: windows-shutdown-reboot-now
    desc: Immediate Windows reboot command
    crit: notable
    conf: 0.9
    for: [shell, batch]
    if:
      type: text
      regex: 'shutdown\s+-r\s+-t\s+0+'
  - id: windows-systemroot-recursive-delete-command
    desc: Recursively removes the Windows root directory
    crit: suspicious
    conf: 0.98
    platforms: [windows]
    for: [batch, text]
    if:
      type: text
      regex: '(?im)^[ \t]*@?(rd|rmdir)\s+(/q\s+)?/s(\s+/q)?\s+"?%(WINDIR|SYSTEMROOT)%"?\s*$'
  - id: del-system32-hal-dll
    desc: Deletes the Windows HAL library
    crit: notable
    conf: 0.95
    for: [shell, batch]
    if:
      type: text
      regex: '(?im)^[ \t]*del\s[^\r\n]{0,40}system32\\{1,2}hal\.dll'
  - id: del-system32-kdcom-dll
    desc: Deletes the Windows kernel debugger transport
    crit: notable
    conf: 0.95
    for: [shell, batch]
    if:
      type: text
      regex: '(?im)^[ \t]*del\s[^\r\n]{0,40}system32\\{1,2}kdcom\.dll'
  - id: del-system32-bootvid-dll
    desc: Deletes the Windows boot video driver
    crit: notable
    conf: 0.95
    for: [shell, batch]
    if:
      type: text
      regex: '(?im)^[ \t]*del\s[^\r\n]{0,40}system32\\{1,2}bootvid\.dll'
  - id: del-system32-ntoskrnl-exe
    desc: Deletes the Windows NT kernel
    crit: notable
    conf: 0.95
    for: [shell, batch]
    if:
      type: text
      regex: '(?im)^[ \t]*del\s[^\r\n]{0,40}system32\\{1,2}ntoskrnl\.exe'
  - id: del-system32-atapi-sys
    desc: Deletes the Windows ATAPI disk driver
    crit: notable
    conf: 0.95
    for: [shell, batch]
    if:
      type: text
      regex: '(?im)^[ \t]*del\s[^\r\n]{0,40}system32\\{1,2}drivers\\{1,2}atapi\.sys'
  - id: batch-cd-system32
    desc: Changes into the System32 directory
    crit: notable
    conf: 0.9
    for: [batch]
    if:
      type: text
      regex: '(?i)\bcd\s+[^\r\n]{0,60}system32\b'
  - id: deltree-drive-wildcard
    desc: Deltree targets a whole drive
    crit: notable
    conf: 0.93
    for: [batch]
    if:
      type: text
      regex: '(?i)\bdeltree\s*/[yq]\s+[A-Za-z]:\*\.\*'
  - id: deltree-drive-wildcard-path
    desc: Deltree names a whole drive wildcard
    crit: notable
    conf: 0.93
    for: [batch, static-lib, text]
    if:
      type: text
      regex: '(?i)\bdeltree\s+[A-Za-z]:\\\*\.\*'
  - id: deltree-drive-wildcard-quiet
    desc: Quiet flag on a drive-wide deltree
    crit: suspicious
    conf: 0.94
    for: [batch, static-lib, text]
    if:
      type: text
      regex: '(?i)\bdeltree\s+[A-Za-z]:\\\*\.\*\s*/[yq]\b'
  - id: windows-windir-delete
    desc: Deletes the Windows system directory
    crit: suspicious
    conf: 0.95
    platforms:
      - windows
    if:
      type: text
      regex: '(?im)^[ \t]*(deltree|rd|rmdir)\b.{0,30}([a-z]:\\win(dows|nt)|%(WINDIR|SYSTEMROOT)%)(\s|$)'
    unless:
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
      - id: metadata/file/policy/identity::enforced-dangerous-action-approval
      - id: well-known/tool/detection/ai-guardrail/
      - id: well-known/app/ai/coding-agent/
composite_rules:
  - id: c-shell-removes-bootloader-directories
    desc: C executes recursive removal of Linux bootloader directories
    crit: hostile
    conf: 0.97
    for: [c]
    platforms: [linux]
    all:
      - id: c-linux-bootloader-directory-delete
      - id: c-shell-removal-uses-path-array
      - id: micro-behaviors/fs/delete/directory::source-recursive-remove-command
      - id: micro-behaviors/process/create/shell/native::c-system-call
  - id: ruby-vmware-drive-wipe
    desc: Wipes a drive when VMware is present
    crit: hostile
    conf: 0.97
    for: [ruby]
    near_lines: 6
    all:
      - id: ruby-vmware-predicate
      - id: ruby-delete-drive-root
  - id: systemroot-delete-then-reboot
    desc: Deletes system files then reboots
    crit: hostile
    conf: 0.97
    for: [shell, batch, scripts]
    near_lines: 40
    all:
      - id: windows-systemroot-recursive-delete-command
      - id: windows-shutdown-reboot-now
  - id: boot-critical-file-deletion
    desc: Deletes multiple boot-critical Windows files
    crit: suspicious
    conf: 0.97
    for: [shell, batch]
    needs: 3
    any:
      - id: del-system32-hal-dll
      - id: del-system32-kdcom-dll
      - id: del-system32-bootvid-dll
      - id: del-system32-ntoskrnl-exe
      - id: del-system32-atapi-sys
  - id: boot-critical-delete-then-reboot
    desc: Deletes boot-critical system files then reboots
    crit: hostile
    conf: 0.98
    for: [shell, batch]
    near_lines: 40
    all:
      - id: boot-critical-file-deletion
      - id: windows-shutdown-reboot-now
  - id: system32-wildcard-exe-wipe
    desc: Deletes every executable in System32
    crit: hostile
    conf: 0.97
    for: [batch]
    near_lines: 8
    all:
      - id: batch-cd-system32
      - id: micro-behaviors/fs/delete/file/command::del-exe-wildcard-command-text
  - id: deltree-drive-wipe
    desc: Deltree wipes files on a drive
    crit: hostile
    conf: 0.97
    for: [batch]
    all:
      - id: micro-behaviors/fs/delete/directory::windows-deltree-recursive
      - id: deltree-drive-wildcard
  - id: deltree-quiet-drive-wipe
    desc: Quietly deletes an entire drive tree
    crit: hostile
    conf: 0.97
    for: [batch, static-lib, text]
    all:
      - id: deltree-drive-wildcard-path
      - id: deltree-drive-wildcard-quiet
  - id: deltree-system-directory-wipe
    desc: Deltree recursively deletes the Windows directory
    crit: hostile
    conf: 0.98
    for: [batch]
    all:
      - id: micro-behaviors/fs/delete/directory::windows-deltree-recursive
      - id: windows-windir-delete
  - id: macos-system-delete
    desc: macOS system directory deletion
    crit: suspicious
    conf: 0.95
    platforms:
      - macos
    any:
      - id: shell-rm-rf-macos-system-path
      - id: python-macos-system-delete-command
      - id: python-subprocess-macos-system-delete
      - id: python-rmtree-macos-system-path
    unless:
      # Safety-classifier unit tests feed `rm -rf /System` to a guard and
      # assert the command is refused; the string is classifier input, not a
      # deletion. Same testing-context exclusions as python-root-wipe-command.
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
  - id: windows-recursive-delete
    desc: Windows system directory recursive deletion
    crit: notable
    conf: 0.9
    platforms:
      - windows
    any:
      - id: windows-recursive-delete-rd-path
      - id: windows-recursive-delete-del-path
  - id: windows-recursive-delete-rd-path
    desc: Windows recursive delete via rmdir with target
    crit: notable
    conf: 0.9
    platforms:
      - windows
    all:
      - id: micro-behaviors/fs/delete/directory::windows-rd-recursive
      - id: windows-systemroot-recursive-delete-command
  - id: windows-recursive-delete-del-path
    desc: Windows recursive delete via del with target
    crit: notable
    conf: 0.9
    platforms:
      - windows
    all:
      - id: micro-behaviors/fs/delete/file/command::cmd-del-force-quiet
      - id: windows-systemroot-recursive-delete-command
  - id: root-command-defensive-context
    desc: Guardrail policy or destructive-command guidance
    crit: exception
    conf: 0.98
    any:
      - id: metadata/file/policy/identity::agent-tool-permission-ruleset
      - id: metadata/package/documentation/source::defensive-dangerous-command-doc
      - id: metadata/package/documentation/source::guardrail-bypass-repro-prose
      - id: micro-behaviors/process/create/agent::ai-agent-shell-command-allowlist

  - id: root-wipe
    desc: Root deletion bypasses filesystem protection
    crit: suspicious
    conf: 0.95
    attack: T1561
    for: [scripts, -python, binaries]
    all:
      - id: micro-behaviors/fs/delete/directory::root-deletion-command-reference
      - id: micro-behaviors/fs/delete/directory::root-deletion-unsafe-target
    unless:
      - id: root-command-defensive-context
      - id: well-known/app/ai/coding-agent/
      - id: micro-behaviors/process/create/shell/guard/
      - id: well-known/tool/detection/
      - id: metadata/file/profile/test-indications/

  - id: dos-system-directory-file-wipe
    desc: DOS deletes files in Windows System directory
    crit: hostile
    conf: 0.98
    for: [dos_com, data]
    all:
      - id: micro-behaviors/fs/delete/file/syscall::dos-int21-delete-file
      - id: micro-behaviors/fs/path/system::windows-system-directory
  - id: batch-rd-recursive-windir-wipe
    desc: Batch rd recursively deletes Windows directory
    crit: hostile
    conf: 0.96
    for: [batch]
    near_lines: 4
    all:
      - id: micro-behaviors/fs/delete/directory::windows-rmdir-recursive
      - id: windows-windir-delete
  - id: shell-root-filesystem-wipe
    desc: Shell script recursively wipes root filesystem
    crit: hostile
    conf: 0.98
    platforms: [unix]
    for: [shell]
    near_lines: 4
    all:
      - id: root-wipe
      - id: micro-behaviors/fs/delete/directory::recursive-root
