defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  attack: T1485
traits:
  - id: linux-etc-delete
    desc: Linux /etc directory deletion attempt
    crit: notable
    conf: 0.95
    platforms:
      - linux
    if:
      type: text
      regex: rm\s+-rf\s+/etc(\s|$)
  - id: python-rmtree-etc
    desc: Python recursively deletes /etc
    crit: notable
    conf: 0.95
    platforms:
      - linux
    for: [python]
    if:
      type: symbol
      kind: call
      substr: rmtree
      arg:
        kind: string
        substr: /etc
  - id: linux-usr-delete
    desc: Linux /usr directory deletion attempt
    crit: notable
    conf: 0.95
    platforms:
      - linux
    if:
      type: text
      regex: rm\s+-rf\s+/usr(/\*|\s|$)|shutil\.rmtree.{0,50}["']/usr["']
  - id: linux-boot-delete
    desc: Linux /boot directory deletion attempt
    crit: suspicious
    conf: 0.95
    platforms:
      - linux
    if:
      type: text
      # Match removal of /boot itself or its direct contents, not selective
      # GRUB/EFI module cleanup performed by image builders.
      regex: rm\s+-rf\s+/boot(/\*|\s|$)|shutil\.rmtree.{0,50}["']/boot["']
    unless:
      - id: well-known/tool/detection/security-scanner::defensive-dangerous-command-doc
      - id: metadata/package/testing/presence/fixture::xml-testdata-directory-path
      - id: well-known/dual-use/tunnel/tailscale::tailscale-source-token
  - id: root-wipe
    desc: Root filesystem wipe attempt
    crit: suspicious
    conf: 0.95
    attack: T1561
    if:
      type: text
      regex: rm\s+-rf\s+/\s|rm\s+-rf\s+/\*|shutil\.rmtree.{0,50}["']/["']
    unless:
      # Code that quotes `rm -rf` in order to forbid it -- an agent's system
      # prompt or its permission registry -- is the guard, not the wipe.
      - id: micro-behaviors/process/create/shell/guard::destructive-command-prohibited-prose
      - id: micro-behaviors/process/create/shell/guard::destructive-command-denied-prose
      - id: well-known/app/development/vscode-extension/tencent-codebuddy::codebuddy-marker
      - id: metadata/package/testing/harness/runtime/
      - type: text
        substr: Sanitizes the command string to prevent shell injection.
      - id: micro-behaviors/process/create/shell/guard::destructive-action-prohibition-phrase
      - id: well-known/tool/detection/
      - id: objectives/supply-chain/trojanized/app/debug-probe/
  - id: macos-system-delete
    desc: macOS system directory deletion
    crit: suspicious
    conf: 0.95
    platforms:
      - macos
    if:
      type: string_literal
      regex: rm\s+-rf.{0,50}(/System|/Library/System)|shutil\.rmtree.{0,50}/System
  - id: rmtree-call
    desc: rmtree critical path deletion
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)(shutil\.)?rmtree\s*\([^)]{0,80}["''](/|[A-Za-z]:[\\/]|~[/\\])'
    unless:
      - type: basename
        regex: '^(common_ship|ship)\.py$'
  - id: windows-system32-delete-cmd-first
    desc: Deletes System32, command before path
    crit: suspicious
    platforms:
      - windows
    if:
      type: text
      regex: \b(rmdir|rd|remove)\b[^\r\n]{0,50}[Ss]ystem32|\bdel\b[^\r\n]{0,50}[Ss]ystem32\\[^sS]
      not:
        - regex: '@%systemroot%\\system32\\[^",<]+,-[0-9]+'
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
      - id: metadata/library/pywin32::pywin32-binding-module
  - id: windows-system32-delete-path-first
    desc: Deletes System32, path before command
    crit: suspicious
    if:
      type: text
      regex: (?i)System32(\\\\\*|["' ]).{0,40}\b(del|rd|rmdir)\b
      platforms:
        - windows
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
      - id: metadata/library/pywin32::pywin32-binding-module
  - id: windows-recursive-delete-rd
    desc: Windows recursive deletion via rmdir/rd
    crit: component
    if:
      type: text
      regex: r(d|mdir)\s+/s
      platforms:
        - windows
    unless:
      - type: basename
        exact: build-pty4j-libpty.bat
  - id: windows-recursive-delete-target-windir
    desc: Windows recursive deletion target WINDIR
    crit: component
    if:
      type: text
      regex: '(?i)\b(del|erase|rd|rmdir)\b[^\r\n]{0,160}%WINDIR%'
      platforms:
        - windows
    unless:
      - id: metadata/file/string/identity::microsoft-activation-script-benign-context
  - id: windows-recursive-delete-target-systemroot
    desc: Windows recursive deletion target SYSTEMROOT
    crit: component
    if:
      type: text
      regex: '(?i)\b(del|erase|rd|rmdir)\b[^\r\n]{0,160}%SYSTEMROOT%'
      platforms:
        - windows
    unless:
      - id: metadata/file/string/identity::microsoft-activation-script-benign-context
  - id: windows-recursive-delete-del
    desc: Windows forced quiet file deletion
    crit: component
    if:
      type: text
      regex: del\s+/f\s+/q
      platforms:
        - windows
    downgrade:
      any:
        - id: objectives/evasion/self-delete/file/script::timeout-del-self
composite_rules:
  - id: root-wipe-safety-context
    desc: Script guards or blocks its own root-wipe command
    crit: exception
    conf: 0.9
    any:
      - id: micro-behaviors/process/create/shell/guard::command-blocked-marker
      - id: destructive-action-prohibition-text
  - id: destructive-action-prohibition-text
    desc: Destructive action prohibition text
    crit: notable
    conf: 0.88
    for: [scripts]
    all:
      - id: micro-behaviors/process/create/shell/guard::destructive-action-prohibition-phrase
      - id: micro-behaviors/fs/directory/delete::rm-rf
    near_lines: 2
  - id: windows-system32-delete
    desc: Windows System32 directory deletion
    crit: suspicious
    conf: 0.95
    platforms:
      - windows
    any:
      - id: windows-system32-delete-cmd-first
      - id: windows-system32-delete-path-first
  - id: windows-recursive-delete
    desc: Windows system directory recursive deletion
    crit: notable
    conf: 0.9
    platforms:
      - windows
    any:
      - id: windows-recursive-delete-rd-path
      - id: windows-recursive-delete-del-path
  - id: windows-recursive-delete-rd-path
    desc: Windows recursive delete via rmdir with target
    crit: notable
    conf: 0.9
    platforms:
      - windows
    all:
      - id: windows-recursive-delete-rd
      - id: windows-recursive-delete-target
  - id: windows-recursive-delete-del-path
    desc: Windows recursive delete via del with target
    crit: notable
    conf: 0.9
    platforms:
      - windows
    all:
      - id: windows-recursive-delete-del
      - id: windows-recursive-delete-target
  - id: windows-recursive-delete-target
    desc: Windows recursive deletion target directories
    crit: notable
    any:
      - id: windows-recursive-delete-target-windir
      - id: windows-recursive-delete-target-systemroot
  - id: system-dir-reference
    desc: Reference to critical system directories
    crit: component
    conf: 0.4
    any:
      - id: micro-behaviors/fs/path/system/
  - id: mass-deletion
    desc: Mass system file deletion
    crit: notable
    conf: 0.95
    near_bytes: 1024
    all:
      - id: micro-behaviors/fs/directory/delete::recursive-delete
      - id: micro-behaviors/data/control-flow/analysis::iteration-loop-pattern
      - id: system-dir-reference
    unless:
      - id: root-wipe-safety-context
