defaults:
  platforms: [windows]
  for: [batch]
  attack: T1485

composite_rules:
  - id: batch-del-windows-folder-wildcard
    desc: Batch wildcard-deletes Windows-folder files
    crit: hostile
    conf: 0.93
    size_max: 4096
    all:
      - id: micro-behaviors/fs/delete/target::batch-del-windows-folder-glob
      - id: micro-behaviors/fs/delete/file/command::batch-del-call
