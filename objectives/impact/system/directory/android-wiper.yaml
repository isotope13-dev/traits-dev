defaults:
  platforms: [android]
  for: [dex]
  attack: T1485
composite_rules:
  - id: android-data-and-system-root-wipe
    desc: Attempts data and system root deletion
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/delete/directory::dex-delete-data-root-call
      - id: micro-behaviors/fs/delete/directory::dex-delete-system-root-call
      - id: micro-behaviors/fs/delete/path::dex-file-delete-call
      - id: micro-behaviors/fs/directory/readdir/language::dex-file-list-children-call
  # Disjoint subtypes retain a data-only or system-only attempt without
  # manufacturing duplicate findings for the combined-root variant above.
  - id: android-data-root-wipe
    desc: Attempts recursive Android data-root deletion
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/delete/directory::dex-delete-data-root-call
      - id: micro-behaviors/fs/delete/path::dex-file-delete-call
      - id: micro-behaviors/fs/directory/readdir/language::dex-file-list-children-call
    unless:
      - id: micro-behaviors/fs/delete/directory::dex-delete-system-root-call
  - id: android-system-root-wipe
    desc: Attempts recursive Android system-root deletion
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/delete/directory::dex-delete-system-root-call
      - id: micro-behaviors/fs/delete/path::dex-file-delete-call
      - id: micro-behaviors/fs/directory/readdir/language::dex-file-list-children-call
    unless:
      - id: micro-behaviors/fs/delete/directory::dex-delete-data-root-call
