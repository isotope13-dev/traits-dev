defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: batch-delete-boot-loader
    desc: Deletes the active drive boot loader
    crit: suspicious
    conf: 0.97
    if:
      type: value
      path: source.batch.command_sites[*].text
      regex: '(?i)^(del|erase)\s+(/[a-z]+\s+)*["'']?[a-z]:\\?(ntldr|io\.sys|boot\.ini)["'']?\s*$'
  - id: batch-rename-dos-boot-loader
    desc: Renames DOS boot loader out of service
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: source.batch.command_sites[*].text
      regex: '(?i)^ren(ame)?\s+([a-z]:\\?)?io\.sys\s+[^\s]+$'
  - id: batch-rename-dos-command-shell
    desc: Renames DOS command interpreter out of service
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: source.batch.command_sites[*].text
      regex: '(?i)^ren(ame)?\s+([a-z]:\\?)?command\.com\s+[^\s]+$'
composite_rules:
  - id: batch-removes-dos-boot-and-shell
    desc: Disables both DOS boot loader and shell
    crit: hostile
    conf: 0.98
    all:
      - id: batch-rename-dos-boot-loader
      - id: batch-rename-dos-command-shell
  - id: batch-takes-ownership-and-deletes-system32
    desc: Takes ownership then recursively removes System32
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/chown::takeown-file-command
      - id: micro-behaviors/fs/delete/target::windows-system32-delete-cmd-first
      - id: micro-behaviors/fs/delete/directory::windows-rmdir-recursive
  - id: batch-unprotects-and-deletes-boot-loader
    desc: Unprotects and removes boot loader files
    crit: hostile
    conf: 0.98
    all:
      - id: batch-delete-boot-loader
      - id: micro-behaviors/fs/file/attributes::attrib-clear-attribute-option-text
