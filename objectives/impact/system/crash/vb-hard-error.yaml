# Forced blue screen from VB: enable SeShutdownPrivilege, then raise a hard
# error with response option 6 (OptionShutdownSystem), which bugchecks the
# machine instead of showing a dialog.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1529

composite_rules:
  - id: vb-shutdown-privilege-hard-error-crash
    desc: VB forces a blue screen via hard error
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/privilege/token/adjust::vb-rtl-shutdown-privilege-call
      - id: micro-behaviors/os/event/shutdown::vbasic-harderror-shutdown-response
