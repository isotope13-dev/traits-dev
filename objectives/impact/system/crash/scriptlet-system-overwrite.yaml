defaults:
  for: [html, javascript]
  platforms: [windows]
traits:
  - id: command-com-document-output
    desc: Doc content follows COMMAND.COM output path
    crit: suspicious
    conf: 0.99
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\.path=(3D)?"[a-z]:\\{1,2}COMMAND\.COM";[\s\S]{0,80}\.Doc='
  - id: config-sys-document-output
    desc: Doc content follows CONFIG.SYS output path
    crit: suspicious
    conf: 0.99
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\.path=(3D)?"[a-z]:\\{1,2}CONFIG\.SYS";[\s\S]{0,80}\.Doc='
composite_rules:
  - id: scriptlet-command-interpreter-overwrite
    desc: Scriptlet writes Doc content over COMMAND.COM
    crit: hostile
    conf: 0.98
    all:
      - id: command-com-document-output
      - id: micro-behaviors/os/com/automation::scriptlet-typelib-clsid
      - id: micro-behaviors/fs/write/content::document-write-call-cooccurrence
  - id: scriptlet-boot-configuration-overwrite
    desc: Scriptlet writes Doc content over CONFIG.SYS
    crit: hostile
    conf: 0.98
    all:
      - id: config-sys-document-output
      - id: micro-behaviors/os/com/automation::scriptlet-typelib-clsid
      - id: micro-behaviors/fs/write/content::document-write-call-cooccurrence
