# A bogus removal notice followed by an interrupt and a CPU halt. INT 0Dh
# is not the BIOS disk service (INT 13h), despite the register setup.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 4096

traits:
  - id: dos-virus-removal-reboot-message
    desc: Virus removal and reboot message
    crit: notable
    if:
      type: text
      regex: '(?i)virus was su[c]{1,2}essfully removed, you must now reboot'

  - id: dos-int0d-cli-hlt
    desc: Interrupt 0Dh followed by CPU halt
    crit: notable
    if:
      type: hex
      pattern: 'CD 0D FA F4'

composite_rules:
  - id: dos-fake-removal-halt
    desc: DOS fake virus removal notice and interrupt-disabled halt
    crit: hostile
    attack: T1499
    all:
      - id: dos-virus-removal-reboot-message
      - id: dos-int0d-cli-hlt
      - id: micro-behaviors/os/console/io::dos-display-string
