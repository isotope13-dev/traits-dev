defaults:
  platforms: [windows]
  for:
    - python
    - pe
  attack: T1499.004
traits:
  - id: set-system-power-state
    desc: Calls SetSystemPowerState API
    crit: suspicious
    conf: 0.9
    for:
      - python
    attack: T1529
    if:
      type: symbol
      kind: call
      regex: '(?i)^SetSystemPowerState$'
  - id: processcritical-helper-type
    desc: ProcessCritical helper type name
    crit: notable
    conf: 0.97
    for: [pe]
    if:
      type: text
      substr: ProcessCritical
  - id: bdos-crash-setting-field
    desc: BDOS crash setting field
    crit: component
    conf: 0.96
    for: [pe]
    if:
      type: text
      exact: BDOS
  - id: c-true-break-on-termination-source
    desc: C true flag precedes termination class
    crit: notable
    conf: 0.94
    for: [c, cpp, csharp]
    if:
      type: text
      regex: '(?s)\b\w+\s+\w+\s*=\s*(TRUE|1)\s*;.{0,768}\bProcessBreakOnTermination\b'
      case_insensitive: true
  - id: rust-true-break-on-termination-source
    desc: Rust true flag precedes termination class
    crit: notable
    conf: 0.94
    for: [rust]
    if:
      type: text
      regex: '(?s)\blet\s+(mut\s+)?\w+[^=]{0,16}=\s*true.{0,768}ProcessBreakOnTermination'
  - id: go-true-break-on-termination-source
    desc: Go true flag precedes termination class
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: text
      regex: '(?s)\b(var\s+\w+\s+bool\s*=|\w+\s*:=)\s*true.{0,768}ProcessBreakOnTermination'
  - id: python-chat-bsod-command
    desc: Chat command selects a Windows crash action
    crit: component
    conf: 0.96
    for: [python]
    if:
      type: text
      regex: 'message\.content\s*==\s*["'']\.bsod["'']'
  - id: win9x-concon-path
    desc: Windows 9x crash device path traversal
    crit: suspicious
    conf: 0.98
    for: [batch, static-lib]
    if:
      type: raw
      regex: '(?i)(^|[\s"''\\/])([a-z]:)?[\\/]+(con|aux|prn|nul)[\\/]+(con|aux|prn|nul)\b'
composite_rules:
  # Same folding pattern as the injection-chain's sqlite/jruby umbrella: the
  # Node.js distribution archive and runtime binary are one distribution
  # context. One reference states it once and keeps bsod-raise-error inside
  # its suppression budget.
  - id: node-distribution-or-runtime-identity
    desc: Node.js distribution or runtime identity
    crit: notable
    conf: 0.99
    any:
      - id: well-known/lib/runtime/scripted/node-runtime::windows-distribution-archive
      - id: well-known/lib/runtime/scripted/node-runtime::windows-runtime-binary
  - id: critical-process-termination-policy-source
    desc: Configures process as critical to Windows stability
    crit: suspicious
    conf: 0.98
    for: [c, cpp, csharp, rust, go]
    all:
      - id: micro-behaviors/process/control/info::nt-set-information-process-source
      - id: micro-behaviors/process/control/critical::process-break-on-termination-source
      - id: micro-behaviors/os/module/load::get-proc-address-source-call
  - id: bsod-raise-error
    desc: NtRaiseHardError reference with ntdll context
    crit: suspicious
    conf: 0.99
    mbc: B0033
    all:
      - id: micro-behaviors/os/syscall/invoke::ntdll-import
      - id: micro-behaviors/os/syscall/invoke::nt-raise-hard-error-reference
    downgrade:
      any:
        - id: metadata/binary/symbols/count::many-exports
    unless:
      - id: node-distribution-or-runtime-identity
      - id: well-known/app/system/reactos::system-component
      - id: well-known/app/utility/locale-emulator::locale-emulator-native-context
      # kernel32/KernelBase carry NtRaiseHardError as the OS provider's own
      # error surface. A 200+ export surface marks that provider shape.
      - id: metadata/binary/symbols/count::many-exports-200
      # Anti-anti-debug tooling *patches* NtRaiseHardError in the debuggee so
      # malware cannot BSOD the analysis box — the inverse of triggering it.
      # ScyllaHide/TitanHide hook exactly this API, and dnSpy ships an
      # AntiAntiDebug patcher for it, so the plain substring reads backwards.
      - id: well-known/tool/reverse-engineering/
      - id: well-known/app/system/windows-migration::mighost-binary-identity
      # The mingw-w64 pseudo-reloc runtime ships a fatal-error reporter
      # (`__report_error`) that calls NtRaiseHardError to display a
      # "Mingw-w64 runtime failure" dialog. Every PE built with this toolchain
      # imports NtRaiseHardError as runtime plumbing, so the bare reference is
      # not a deliberately forced hard error / BSOD.
      - id: metadata/lang/compiler/native::mingw-pseudo-reloc-runtime
      # Zig ships musl and mingw-w64 under lib/zig/libc/ and its own std
      # library under lib/zig/std/: the tree that *defines* these APIs, not
      # one that calls them.
      - id: well-known/lib/development/zig-stdlib/
  - id: critical-process-bsod-risk
    desc: Critical-process termination can crash Windows
    # This proves the dormant capability, but not that the configuration
    # enables it. Malware families such as AsyncRAT compile this helper into
    # builds whose encrypted BDOS option is false.
    crit: suspicious
    conf: 0.96
    mbc: B0033
    for:
      - pe
    all:
      - id: micro-behaviors/os/syscall/invoke::ntdll-import
      - id: micro-behaviors/process/control/critical::rtl-set-process-is-critical-reference
      - id: processcritical-helper-type
      - id: bdos-crash-setting-field
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/linking/api-set::api-set-core-cluster
  - id: current-process-critical-termination-crash
    desc: Enables current-process critical termination to crash Windows if killed
    crit: hostile
    conf: 0.98
    mbc: B0033
    for: [c, cpp, csharp, rust, go]
    all:
      - id: micro-behaviors/process/control/critical::current-process-break-on-termination-control
      - id: process-break-on-termination-enabled-source
  - id: process-break-on-termination-enabled-source
    desc: Enables termination-critical state with true flag
    crit: component
    conf: 0.94
    for: [c, cpp, csharp, rust, go]
    any:
      - id: c-true-break-on-termination-source
      - id: rust-true-break-on-termination-source
      - id: go-true-break-on-termination-source
  - id: python-bsod-traits
    desc: Python shutdown privilege and fatal hard error
    crit: hostile
    conf: 0.99
    for: [python]
    all:
      - id: micro-behaviors/os/privilege/token::python-rtl-shutdown-privilege-call
      - id: micro-behaviors/os/syscall/invoke::python-hard-error-shutdown-call
  - id: python-chat-triggered-bsod
    desc: Remote chat command triggers a Windows crash
    crit: hostile
    conf: 0.99
    for: [python]
    all:
      - id: objectives/impact/system/crash::python-bsod-traits
      - id: objectives/impact/system/crash::python-chat-bsod-command
  - id: windows-powerstate-abuse
    desc: Privilege + power-state API abuse in Python
    crit: hostile
    conf: 0.98
    for:
      - python
    attack: T1529
    all:
      - id: micro-behaviors/dylib/load/ffi::python-ctypes-import
      - id: micro-behaviors/dylib/load/runtime::ctypes-windll
      - id: micro-behaviors/os/privilege/token::python-rtl-adjust-privilege-call
      - id: set-system-power-state
