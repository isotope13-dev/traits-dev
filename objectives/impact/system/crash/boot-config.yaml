defaults:
  platforms: [windows]
  for: [html]
traits:
  - id: html-saveas-boot-ini
    desc: HTML SaveAs targets Windows boot.ini
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?im)^\s*\w+\.SaveAs\s+["''][A-Za-z]:\\boot\.ini["'']'
      exclude_html_comments: true
composite_rules:
  - id: activex-boot-configuration-overwrite
    desc: NMSA exploit targets Windows boot.ini
    crit: hostile
    conf: 0.99
    all:
      - id: html-saveas-boot-ini
      - id: objectives/execution/exploit/chain::mdsauth-arbitrary-file-rewrite
