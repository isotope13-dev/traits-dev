defaults:
  platforms: [windows]
  for: [batch]
  attack: T1495

composite_rules:
  - id: batch-boot-chain-file-removal-unbootable
    desc: Batch removes boot chain file, host won't boot
    crit: hostile
    conf: 0.9
    size_max: 4096
    near_lines: 2
    all:
      - id: micro-behaviors/fs/path/config/boot::boot-loader-drive-path
      - id: micro-behaviors/fs/delete/file/command::batch-del-force-quiet-switch
  - id: batch-overwrites-autoexec-boot-file
    desc: Batch overwrites AUTOEXEC.BAT destroying boot config
    crit: hostile
    conf: 0.96
    size_max: 4096
    all:
      - id: micro-behaviors/fs/write/file/redirect::batch-redirect-into-autoexec
      - id: micro-behaviors/fs/path/config/boot::autoexec-bat-reference
  # Collector-renamed batch files arrive classified as plain text, where the
  # composite above cannot run. A text file needs the full trojan profile —
  # the redirect into the boot file, the boot-config reference, and hidden
  # echo — before the hostile label; prose that merely quotes one redirect
  # line stays at the suspicious atom.
  - id: renamed-batch-overwrites-autoexec-boot-file
    desc: Renamed batch overwrites AUTOEXEC.BAT, echo hidden
    crit: hostile
    conf: 0.95
    size_max: 4096
    near_lines: 8
    for: [text]
    all:
      - id: micro-behaviors/fs/write/file/redirect::batch-redirect-into-autoexec
      - id: micro-behaviors/fs/path/config/boot::autoexec-bat-reference
      - id: micro-behaviors/os/console/io::batch-echo-off
  # The same renamed-batch profile where the written content is the payload:
  # the boot file is repopulated with a recursive executable listing (every
  # line becomes a boot-time command) plus a self-reference that recurses.
  - id: renamed-batch-boot-exe-listing-corruption
    desc: Renamed batch turns AUTOEXEC into exe-listing launcher
    crit: hostile
    conf: 0.9
    size_max: 4096
    near_lines: 8
    for: [text]
    all:
      - id: micro-behaviors/fs/write/file/redirect::batch-redirect-into-autoexec
      - id: micro-behaviors/fs/write/file/redirect::batch-autoexec-recursion-payload
  - id: batch-deletes-kernel32-system-failure
    desc: Batch deletes KERNEL32 causing OS boot failure
    crit: hostile
    conf: 0.98
    size_max: 4096
    all:
      - id: objectives/impact/degrade/system/file::batch-deletes-kernel32-dll
      - id: micro-behaviors/fs/delete/file/command::batch-del-call
