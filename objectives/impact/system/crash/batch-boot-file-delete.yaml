defaults:
  platforms: [windows]
  for: [batch]
  attack: T1495

composite_rules:
  - id: batch-boot-chain-file-removal-unbootable
    desc: Batch removes boot chain file, host won't boot
    crit: hostile
    conf: 0.9
    size_max: 4096
    near_lines: 2
    all:
      - id: micro-behaviors/fs/path/config/boot::boot-loader-drive-path
      - id: micro-behaviors/fs/delete/file/command::batch-del-force-quiet-switch
  - id: batch-overwrites-autoexec-boot-file
    desc: Batch overwrites AUTOEXEC.BAT destroying boot config
    crit: hostile
    conf: 0.96
    size_max: 4096
    all:
      - id: micro-behaviors/fs/write/file/redirect::batch-echo-overwrite-autoexec
      - id: micro-behaviors/fs/path/config/boot::autoexec-bat-reference
