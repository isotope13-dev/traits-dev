defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
- id: native-critical-system-process-termination
  desc: Critical-system targets accompany termination APIs
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/process/info/name::csrss-executable-reference
  - id: micro-behaviors/process/info/name::wininit-name
  - id: micro-behaviors/process/control/critical::rtl-set-process-is-critical-reference
  - id: micro-behaviors/process/terminate/kill::terminate-process
  - id: micro-behaviors/os/privilege/token::sedebug-privilege-name
