defaults:
  platforms: [windows]
  for: [batch]
  attack: T1485

composite_rules:
  - id: batch-rd-removes-whole-drive-volume
    desc: Batch RD removes whole drive volume
    crit: hostile
    conf: 0.95
    size_max: 4096
    all:
      - id: micro-behaviors/fs/delete/target::windows-drive-root-recursive-delete
      - id: micro-behaviors/fs/delete/directory::windows-rmdir-recursive
