# DOS COM trojan clears the protection attributes (INT 21h AX=4301h) of a
# boot drive system file and then deletes it, leaving the host unbootable.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1495
  size_max: 4096

composite_rules:
  - id: dos-strip-attributes-delete-boot-file
    desc: DOS clears attributes then deletes system file
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/config/boot::dos-boot-file-drive-path
      - id: micro-behaviors/fs/file/attributes::dos-int21-set-attributes
      - id: micro-behaviors/fs/delete/file/syscall::dos-int21-delete-file
