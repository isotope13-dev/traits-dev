# An environment switch establishes activation, not sandbox detection.
# Proximity establishes co-occurrence; descriptions do not assert reachability.
defaults:
  crit: hostile
  platforms: [unix, windows]
composite_rules:
  - id: go-env-checked-zero-width-shell-loader
    desc: Go environment check accompanies hidden shell loader
    for: [go]
    platforms: [unix]
    attack: T1027,T1059.004
    near_lines: 12
    all:
      - id: micro-behaviors/os/env/test::go-env-nonempty-check
      - id: objectives/execution/payload/script-eval/transformed/shell::go-zero-width-shell-command-loader
  - id: php-env-guarded-credential-harvest
    desc: Environment return guard accompanies PHP credential harvesting and POST
    for: [php]
    attack: T1552.001,T1041
    near_lines: 40
    all:
      - id: micro-behaviors/os/env/test::php-missing-env-return
      - id: objectives/credential-access/files/theft::php-developer-credential-file-harvest
      - id: micro-behaviors/communications/http/post::php-stream-context-http-post
  - id: c-env-guarded-xor-command
    desc: Environment return guard accompanies C XOR command execution
    for: [c]
    attack: T1027,T1059
    near_lines: 40
    all:
      - id: micro-behaviors/os/env/test::c-missing-env-return
      - id: objectives/execution/payload/script-eval/transformed/shell::c-hex-xor-system-loader
  - id: perl-env-guarded-launchagent-theft
    desc: Environment return guard accompanies Perl LaunchAgent and history theft
    platforms: [macos]
    for: [perl]
    attack: T1543.004,T1552.003,T1041
    near_lines: 50
    all:
      - id: micro-behaviors/os/env/test::perl-env-return-guard
      - id: micro-behaviors/os/service/launchagent::source-launchagent-remote-shell-autorun
      - id: objectives/exfiltration/stealer/activity::perl-launchagent-history-http-post
