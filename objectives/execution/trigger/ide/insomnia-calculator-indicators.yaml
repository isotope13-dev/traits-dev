# Plugin entrypoint and launch clues suggest an execution proof of concept.
# Archive scope does not bind the launch to module initialization.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - package.json
  - npm
composite_rules:
- id: insomnia-plugin-calculator-execution-indicators
  desc: Plugin entrypoint with calculator execution indicators
  crit: notable
  conf: 0.98
  scope: archive
  all:
  - id: metadata/package/ecosystem::insomnia-plugin-manifest-field
  - id: metadata/package/entrypoint/module::npm-publish-root-manifest-with-root-javascript-entry
  - id: micro-behaviors/data/control-flow/dispatch/named::javascript-exec-call
  any:
  - id: micro-behaviors/process/create/exec::exec-call-launches-calculator
  - id: micro-behaviors/process/create/exec::exec-call-launches-unix-calculator
  - id: metadata/lang/source/syntax/command/launch::macos-calculator-command-argument
  needs: 1
