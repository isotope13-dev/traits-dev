# Insomnia loads community plugins via require() in a Node-enabled PluginWindow.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  attack: T1204.002,T1059.007

traits:
  - id: insomnia-rce-proof-filename
    desc: Insomnia RCE proof artifact filename literal
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: literal
      substr: INSOMNIA_RCE_PROOF

composite_rules:
  - id: insomnia-plugin-import-calculator-poc
    desc: Insomnia plugin launches calculator at import
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/ecosystem::insomnia-plugin-manifest-field
      - id: metadata/package/entrypoint::npm-publish-root-manifest-with-root-javascript-entry
      - id: metadata/lang/javascript-features::js-exec-call
    any:
      - id: micro-behaviors/process/create/launch::exec-call-launches-calculator
      - id: micro-behaviors/process/create/launch::exec-call-launches-unix-calculator
      - id: micro-behaviors/process/create/launch::launch-command-opens-macos-calculator
    needs: 1

  - id: insomnia-plugin-import-host-proof-exfil
    desc: Insomnia plugin writes host proof and dumps env
    crit: hostile
    conf: 0.97
    attack: T1041,T1082
    scope: archive
    all:
      - id: metadata/package/ecosystem::insomnia-plugin-manifest-field
      - id: insomnia-rce-proof-filename
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call

  - id: insomnia-plugin-import-shell-electron-poc
    desc: Insomnia plugin runs shell commands at import in Electron
    crit: hostile
    conf: 0.97
    attack: T1059.001,T1204.002
    scope: archive
    all:
      - id: metadata/package/ecosystem::insomnia-plugin-manifest-field
      - id: metadata/package/entrypoint::npm-publish-root-manifest-with-root-javascript-entry
      - id: metadata/lang/javascript-features::js-exec-call
      - id: micro-behaviors/os/sysinfo/platform/runtime::electron-version-reference

  - id: insomnia-plugin-postinstall-compromise-beacon
    desc: Insomnia plugin npm postinstall drops compromise beacon
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1059.004,T1564
    scope: archive
    all:
      - id: metadata/package/ecosystem::insomnia-plugin-manifest-field
      - id: objectives/supply-chain/install-hook/scripts/postinstall::postinstall-shell-tmp-compromise-beacon
