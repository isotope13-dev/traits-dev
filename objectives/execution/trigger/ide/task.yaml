# IDE Triggers
# Detects automatic execution triggers in IDE configurations.
defaults:
  platforms: [windows, unix]
  # tasks.json is typed `json`, not javascript — must be listed or the
  # folderOpen autorun trigger goes undetected.
  for: [javascript, shell, json]
traits:
  # Cross-platform remote-shell staging: the same folderOpen task defines
  # curl|bash (or sh/cmd) under osx, linux, and windows blocks.
  - id: tasks-osx-curl-pipe-shell
    desc: OSX task pipes curl into shell
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '"osx"\s*:\s*\{[^}]{0,400}\|\s*(bash|sh)\b'

  - id: tasks-linux-curl-pipe-shell
    desc: Linux task pipes curl into shell
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '"linux"\s*:\s*\{[^}]{0,400}\|\s*(bash|sh)\b'

  - id: tasks-windows-curl-pipe-cmd
    desc: Windows task pipes curl into cmd
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '"windows"\s*:\s*\{[^}]{0,400}\|\s*cmd\b'

composite_rules:
  - id: multi-os-folderopen-remote-shell
    desc: Folder-open task pipes remote shells on osx, linux, and windows
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1105,T1059
    all:
      - id: metadata/permission/activation::vscode-task-folder-open-activation
      - id: tasks-osx-curl-pipe-shell
      - id: tasks-linux-curl-pipe-shell
      - id: tasks-windows-curl-pipe-cmd
