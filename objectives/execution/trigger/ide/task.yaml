defaults:
  platforms: [windows, unix]
  for: [json]
composite_rules:
  - id: multi-os-folderopen-remote-shell
    desc: Folder-open task pipes remote shells on osx, linux, and windows
    # Cross-platform bootstrap tasks can be intentional developer automation;
    # concealment or fetched-code evaluation establishes hostile intent.
    crit: suspicious
    conf: 0.98
    attack: T1195.002,T1105,T1059
    all:
      - id: metadata/permission/activation::vscode-task-folder-open-activation
      - id: micro-behaviors/process/create/shell/pipeline::tasks-osx-curl-pipe-shell
      - id: micro-behaviors/process/create/shell/pipeline::tasks-linux-curl-pipe-shell
      - id: micro-behaviors/process/create/shell/pipeline::tasks-windows-curl-pipe-cmd
