composite_rules:
- id: ide-folder-open-cross-tool-script
  desc: Folder-open and tool-directory task command
  all:
  - id: metadata/permission/activation::vscode-task-folder-open-activation
  any:
  - id: micro-behaviors/process/argument/file::ide-task-command-claude-cursor-dir
  - id: micro-behaviors/process/argument/file::ide-task-command-agent-dir-extra
  - id: micro-behaviors/process/argument/file::ide-task-command-github-dir
  unless:
  - id: metadata/path/directory::test-directory-component
- id: ide-folder-open-interpreter-fallback
  desc: Folder-open and interpreter-fallback task
  all:
  - id: metadata/permission/activation::vscode-task-folder-open-activation
  - id: micro-behaviors/process/create/shell/command-string::ide-task-interpreter-fallback-chain
defaults:
  platforms:
  - windows
  - unix
  for:
  - json
  crit: notable
  conf: 0.96
