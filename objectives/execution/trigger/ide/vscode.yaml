# VS Code Workspace Execution
# Detects malicious use of tasks.json for automatic folder-open execution.
defaults:
  platforms: [unix, windows]
  for: [json]
traits:
  - id: tasks-command-vercel
    desc: VS Code task command references Vercel hosting
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"command":\s*"[^"\n]{0,240}vercel\.app'
  - id: tasks-command-shortlink
    desc: VS Code task references URL shortener
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'https?://[^"\n]{0,60}(short\.gy|bit\.ly|tinyurl\.com)'
composite_rules:
  - id: vscode-folder-open-fetch-or-exec
    # Folder-open tasks are a real developer workflow (for example, starting
    # a local watcher).  The trigger plus a Node command is therefore a
    # suspicious capability, not proof of malicious workspace execution. The
    # hostile composites below require a fetch-and-shell, masqueraded payload,
    # or another concrete execution chain.
    # Named for the trigger, described for the whole `any:` set: the command
    # leg matches a Node invocation OR a curl/wget download OR a shortener or
    # vercel.app host OR a font-file exec, so calling it "runs a Node command"
    # mis-reported every non-Node hit (a `curl ... | sh` task reads back as
    # Node).
    desc: VSCode folder-open task runs a fetch or exec command
    crit: suspicious
    conf: 0.96
    mbc: "C0032"
    attack: "T1204.002"
    all:
      - id: metadata/permission/activation::vscode-task-folder-open-activation
    any:
      - id: metadata/package/config::tasks-node-execution
      - id: micro-behaviors/communications/http/download/cli::vscode-task-curl-wget-url
      - id: objectives/command-and-control/dropper/execution/script::vscode-task-mshta-remote-url
      - id: objectives/evasion/masquerade/extension-mismatch
      - id: tasks-command-vercel
      - id: tasks-command-shortlink
      - id: micro-behaviors/process/create/shell/probe::cross-platform-interpreter-probe
    unless:
      - id: metadata/package/config::tasks-typescript-watch-build
  # `vscode-task-download-execution` used to sit beside this rule with an
  # identical `all:` block plus an `any:` on the vercel/shortener host atoms.
  # Every file it could match already matched this one, so it only ever
  # duplicated the verdict under a second id and split one signal across two ML
  # features; the host atoms remain evidence through
  # `vscode-folder-open-fetch-or-exec`.
  - id: vscode-task-generic-remote-shell
    desc: VS Code autorun fetches and pipes a remote shell
    # Folder-open bootstrap tasks are risky but can be deliberate project
    # setup. The concealed variant below is the hostile conclusion.
    crit: suspicious
    conf: 0.98
    attack: "T1204.002,T1105,T1059"
    all:
      - id: metadata/permission/activation::vscode-task-folder-open-activation
      - id: metadata/package/config::vscode-task-shell-command
      - id: micro-behaviors/communications/http/download/cli::vscode-task-curl-wget-url
      - id: micro-behaviors/process/create/shell/pipeline::vscode-task-pipes-shell
  # Process-style tasks may keep the interpreter and its inline program in
  # separate JSON fields (`command: node`, `args: [-e, ...]`). A remote body
  # fed to eval on folder open is executable content delivery, not an ordinary
  # build/watch task, and survives changes to the payload URL or project lure.
  - id: vscode-node-inline-remote-eval-autorun
    desc: VS Code autorun fetches and evals remote Node code
    crit: hostile
    conf: 0.99
    attack: "T1204.002,T1105,T1059.007"
    all:
      - id: metadata/permission/activation::vscode-task-folder-open-activation
      - id: metadata/package/config::tasks-node-execution
      - id: micro-behaviors/process/create/inline-script::node-inline-remote-eval
  - id: vscode-task-powershell-download-execution
    desc: VS Code autorun fetches and executes PowerShell
    crit: hostile
    conf: 0.98
    attack: "T1204.002,T1105,T1059.001"
    all:
      - id: metadata/permission/activation::vscode-task-folder-open-activation
      - id: metadata/package/config::vscode-task-shell-command
      - id: micro-behaviors/communications/http/download/cli::vscode-task-powershell-web-request
      - id: micro-behaviors/process/create/shell/pipeline::vscode-task-pipes-powershell-eval
  # A remote HTA handed to MSHTA is fetched and executed by a Windows script
  # host. Requiring the folder-open trigger distinguishes an ordinary explicit
  # task from a project that executes the remote payload merely when trusted.
  - id: vscode-mshta-remote-autorun
    desc: VS Code autorun invokes remote MSHTA URL
    crit: hostile
    conf: 0.99
    attack: "T1204.002,T1105,T1218.005"
    all:
      - id: metadata/permission/activation::vscode-task-folder-open-activation
      - id: objectives/command-and-control/dropper/execution/script::vscode-task-mshta-remote-url
  - id: vscode-task-concealment
    desc: VSCode task with concealment properties
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/permission/activation::vscode-task-folder-open-activation
    any:
      - id: metadata/package/config::tasks-hidden
      - id: metadata/package/config::task-reveal-never
      - id: metadata/package/config::tasks-echo-disabled
      # Padding the command off the right edge of the editor conceals the task
      # from a reviewer just as `reveal: never` conceals it from the user.
      - id: objectives/anti-static/obfuscation/syntax::json-key-value-space-padded
      # A command that cannot exit non-zero conceals the task from VS Code's
      # own failure reporting, the last place the run would have been visible.
      - id: metadata/package/config::task-command-noop-fallback
    needs: 2
  - id: vscode-concealed-remote-shell-autorun
    desc: Concealed folder-open task fetches and pipes a remote shell
    crit: hostile
    conf: 0.99
    attack: "T1204.002,T1105,T1059,T1564.003"
    all:
      - id: vscode-task-generic-remote-shell
      - id: vscode-task-concealment
  - id: vscode-task-media-masquerade
    desc: VSCode autorun runs disguised media file
    crit: notable
    conf: 0.98
    attack: "T1204.002,T1036.008"
    all:
      - id: metadata/permission/activation::vscode-task-folder-open-activation
    any:
      - id: objectives/evasion/masquerade/extension-mismatch
  - id: vscode-concealed-media-masquerade-autorun
    desc: Folder-open task runs disguised media
    crit: hostile
    conf: 0.99
    attack: "T1204.002,T1036.008,T1564.003"
    all:
      - id: vscode-task-media-masquerade
      - id: vscode-task-concealment
  # The workspace settings half of a folder-open autorun. A repository that
  # ships `task.allowAutomaticTasks`, a folderOpen task, and a hidden terminal
  # can run a command with little user-visible feedback. Legitimate lint and
  # build workflows can deliberately use the same settings, so this combination
  # is an investigation lead rather than a hostile verdict. Intent comes from a
  # more specific task-command composite such as the concealed media loader.
  - id: vscode-workspace-preapproved-hidden-autorun
    desc: Pre-approves hidden folder-open task
    crit: suspicious
    conf: 0.94
    attack: "T1204.002,T1564.003,T1059"
    all:
      - id: metadata/permission/activation::vscode-auto-task-approval
      - id: metadata/permission/activation::vscode-task-folder-open-activation
      - id: metadata/package/config::vscode-terminal-hidden-on-startup
