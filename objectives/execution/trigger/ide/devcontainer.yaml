# Dev Container lifecycle commands as an autorun surface.
# VS Code, GitHub Codespaces and the devcontainer CLI run a fixed set of
# lifecycle commands from `.devcontainer/devcontainer.json` (or a
# `.devcontainer.json` at the root) when a container is created or attached.
# `initializeCommand` is the sharpest: it runs on the HOST, before the
# container exists, so a disguised payload there executes on the developer's
# own machine on open -- the same reach as a folder-open task, in a file no
# VS Code task-detection heuristic inspects.
defaults:
  platforms: [windows, linux, macos]
  for: [json]
  attack: T1204.002
  mbc: B0024

composite_rules:
  # A lifecycle command that runs a disguised payload: opening the project in
  # a container runs a file whose name or location says "asset". No folder
  # concealment is needed -- the lifecycle command is invisible to a task
  # reviewer to begin with.
  - id: devcontainer-runs-disguised-file
    desc: Dev Container command runs a disguised file
    crit: hostile
    conf: 0.96
    attack: T1204.002,T1036.008,T1059
    all:
      - id: metadata/permission/activation::devcontainer-lifecycle-command
    any:
      - id: micro-behaviors/process/argument/file::node-task-executes-non-script-suffix
      - id: objectives/evasion/masquerade/extension-mismatch::bun-deno-task-executes-non-script-suffix
      - id: objectives/evasion/masquerade/path::node-runs-asset-directory-file
      - id: objectives/evasion/hijack-execution-flow/env/node-options::node-preload-disguised-target
