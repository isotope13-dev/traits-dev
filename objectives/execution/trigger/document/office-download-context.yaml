defaults:
  platforms:
  - windows
  for:
  - oledoc
  - ooxml
  mbc: C0002
  conf: 0.96
composite_rules:
- id: vba-autoopen-multi-url-stream-profile
  desc: Auto-open macro has URLs and stream save
  crit: suspicious
  attack: T1204.002,T1059.005,T1105
  all:
  - id: micro-behaviors/process/create/macro/autoexec::raw-auto-open-entrypoint
  - id: metadata/document/office/markup::office-url-text-count
  - id: micro-behaviors/fs/write/file/stream::vba-adodb-savetofile-call
  - id: micro-behaviors/process/create/macro/office::wscript-shell-object
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib
- id: vba-autoopen-encoded-powershell
  desc: Macro runs encoded PowerShell on open
  crit: hostile
  attack: T1204.002,T1059.001,T1027
  for:
  - oledoc
  all:
  - id: micro-behaviors/process/create/macro/office::document-open-handler
  - id: metadata/lang/source/syntax/argument::encodedcommand-flag-native
  needs: 1
  any:
  - id: micro-behaviors/communications/http/download/cli::embedded-iwr-outfile-download
  - id: micro-behaviors/process/argument/option::windows-interpreter-command-syntax
  - id: micro-behaviors/process/argument/option::powershell-flagged-command-line
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib
