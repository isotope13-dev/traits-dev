defaults:
  platforms: [windows]
  for: [oledoc, ooxml, scripts]
composite_rules:
  - id: vba-autoopen-csproj-shellexecute-clues
    desc: Auto-open macro, csproj and ShellExecute clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/application/hook/event::vba-auto-open-sub-decl
      - id: micro-behaviors/process/create/exec::macro-csproj-shellexecute-text
    near_bytes: 4000
