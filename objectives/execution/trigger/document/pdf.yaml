  desc: PDF JSFuck hidden-form stager
  conf: 0.97
  all:
  - id: metadata/document/pdf/script::pdf-jsfuck-getfield-loader
  - id: metadata/document/pdf/form::pdf-hidden-zero-rect-form-field
  - id: metadata/document/pdf/form::pdf-large-decoded-form-value
- id: pdf-acrobat-privileged-c2-loader
  attack: T1203
  desc: PDF Acrobat privileged C2 loader
  conf: 0.98
  all:
  - id: metadata/document/pdf/script::pdf-form-payload-final-js-eval
  any:
  - id: metadata/document/pdf/form::pdf-form-payload-readfileintostream
  - id: metadata/document/pdf/form::pdf-form-payload-trustedfunction
  - id: metadata/document/pdf/form::pdf-form-payload-rss-addfeed
- id: pdf-stream-obfuscated-js-exploit
  attack: T1203
  desc: PDF stream obfuscated JS exploit
  conf: 0.94
  all:
  - id: metadata/document/pdf/script::pdf-stream-js-eval-call
  any:
  - id: metadata/document/pdf/script::pdf-stream-js-unescape
  - id: metadata/document/pdf/script::pdf-stream-js-fromcharcode
