- id: pdf-richvalue-uaf-js-pattern
  attack: T1203
  desc: PDF richValue UAF JS pattern
  conf: 0.96
  all:
  - id: metadata/document/pdf/script::pdf-stream-object-defineproperty
  - id: micro-behaviors/ui/controls/form::pdf-stream-event-richvalue
  - id: micro-behaviors/ui/controls/form::pdf-stream-resetform
- id: pdf-open-shellcode-arming-source
  attack: T1203
  desc: Source arms a PDF open event with encoded shellcode
  conf: 0.97
  for: [ruby]
  all:
  - id: micro-behaviors/data/document/open::source-binds-javascript-to-pdf-open
  - id: objectives/execution/exploit/shellcode/browser::browser-x86-native-payload-signature
