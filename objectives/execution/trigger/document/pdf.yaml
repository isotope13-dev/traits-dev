  - id: micro-behaviors/communications/email/address::js-collab-email
  - id: micro-behaviors/communications/email/address::pdf-stream-collab-emailinfo
  - id: micro-behaviors/data/codec::js-streamdecode
  - id: micro-behaviors/data/document/properties::js-getannots
  - id: micro-behaviors/data/format/string::js-util-printf
  - id: micro-behaviors/data/string/char::pdf-stream-js-util-bytetochar
  - id: micro-behaviors/data/string/spelling::js-spell-dict
  - id: micro-behaviors/data/string/spelling::pdf-stream-spell-customdict
  - id: micro-behaviors/os/service/print::pdf-stream-printseps
  - id: micro-behaviors/time/schedule/timeout::pdf-stream-js-settimeout
