# HTML smuggling of a Windows script: the page rebuilds a base64 file in
# the browser as a Blob and saves it under a random .js name through a
# synthesized download (or msSaveBlob), delivering a JScript dropper that
# gateways never saw as a file. A page has no reason to hand out
# randomly named scripts.
defaults:
  platforms: [windows]
  for: [javascript, html]
  attack: T1027.006,T1204.002
composite_rules:
  - id: browser-rebuilt-random-script-download
    desc: Page rebuilds and saves a randomly named script
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/decode/base64/unspecified::base64-to-blob-text-sequence
      - id: micro-behaviors/fs/path/extension::random-identifier-script-filename
    any:
      - id: micro-behaviors/communications/http/download/browser::quoted-download-click-strings
      - id: micro-behaviors/data/buffer/alloc::uint8array-to-blob-materialization
