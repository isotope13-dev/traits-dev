# Relocated from the legacy CHM delivery catalog. A scripted HTML Help
# Shortcut is a document execution trigger, not by itself a payload handoff.
# Exact control, command, target and Click predicates are preserved.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1218.001
  mbc: E1218
composite_rules:
  - id: htmlhelp-shortcut-scripted-process-execution
    desc: HTML Help Shortcut with scripted process launch
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/os/com/automation::htmlhelp-shortcut-command-param
      - id: micro-behaviors/process/create/exec::htmlhelp-shortcut-item1-named-target
      - id: micro-behaviors/ui/controls/widget::html-object-click-call
    any:
      - id: micro-behaviors/os/com/automation::htmlhelp-shortcut-clsid
      - id: micro-behaviors/os/com/automation::htmlhelp-hhctrl-clsid
      - id: micro-behaviors/os/com/automation::htmlhelp-hhctrl-alternate-clsid

  - id: htmlhelp-shortcut-scripted-activation
    desc: HTML Help Shortcut with scripted activation
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/com/automation::htmlhelp-shortcut-command-param
      - id: micro-behaviors/ui/controls/widget::html-object-click-call
    any:
      - id: micro-behaviors/os/com/automation::htmlhelp-shortcut-clsid
      - id: micro-behaviors/os/com/automation::htmlhelp-hhctrl-clsid
      - id: micro-behaviors/os/com/automation::htmlhelp-hhctrl-alternate-clsid
      - id: micro-behaviors/process/create/exec::htmlhelp-shortcut-item1-named-target
