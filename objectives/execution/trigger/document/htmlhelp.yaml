# Relocated from the legacy CHM delivery catalog. A scripted HTML Help
# Shortcut is a document execution trigger, not by itself a payload handoff.
# A scripted Shortcut is a documented Help feature. Hidden policy-bypassing
# PowerShell or a linked download/launch supplies the attack admission.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1218.001
  mbc: E1218
traits:
  - id: htmlhelp-one-pixel-object
    desc: One-pixel HTML object
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)<object\b[^>]{0,240}\bwidth\s*=\s*["'']?1["'']?\s+height\s*=\s*["'']?1'
  - id: large-html-inline-image
    desc: Large HTML document embeds an image
    crit: notable
    conf: 0.9
    size_min: 65536
    if:
      type: text
      regex: '(?i)data:image/[a-z0-9.+-]+;base64,'
  - id: scheduled-download-powershell-pipe
    desc: Scheduled download piped to PowerShell
    crit: notable
    if:
      type: text
      regex: '(?i)schtasks\s+/create[^\r\n]{0,500}\bcurl\s+-o\s+[^\r\n]{1,250}\|\s*powershell\b'
  - id: split-activex-xmlhttp
    desc: Splits ActiveX XMLHTTP constructor strings
    crit: notable
    if:
      type: text
      regex: '(?i)Act[\x27\x22]\s*\+\s*[\x27\x22]iveXO[^\r\n]{0,100}XMLH'
  - id: split-save-to-file
    desc: Splits SaveToFile method string
    crit: notable
    if:
      type: text
      regex: '(?i)\.S[\x27\x22]\s*\+\s*[\x27\x22]aveToFile'
  - id: cab-object-codebase
    desc: Loads CAB through object codebase
    crit: notable
    if:
      type: text
      regex: '(?i)\bCODEBASE\s*=[^\r\n]{0,180}\.cab'
  - id: htmlhelp-decompile-temp
    desc: Help command extracts itself into temp
    crit: notable
    if:
      type: text
      regex: '(?i)\bhh\s+-decompile\s+%tmp%'
  - id: hidden-extracted-python-bytecode
    desc: Starts extracted Python bytecode minimized
    crit: notable
    if:
      type: text
      regex: '(?i)start\s+/min\s+cmd\s+/c\s+%tmp%[^\r\n]{0,250}\.pyc'
  - id: split-media-player-executable-path
    desc: Splits Windows Media Player executable path
    crit: notable
    if:
      type: text
      regex: '(?i)ogram Files[^\r\n]{0,40}dows Media Player[^\r\n]{0,40}wmpl'
  - id: html-location-variable-navigation
    desc: Navigates browser to variable URL
    crit: notable
    if:
      type: text
      regex: '(?i)\blocation\.href\s*=\s*[a-z_$][\w$]*\s*;'
  # Hex fragments are split across a rotated array and only joined at runtime.
  - id: hex-html-object-fragment
    desc: Hex text contains HTML object prefix
    crit: notable
    if:
      type: text
      substr: '3c4f424a45'
  - id: hex-html-param-fragment
    desc: Hex text contains HTML parameter prefix
    crit: notable
    if:
      type: text
      substr: '3c50415241'
  - id: hex-command-item-fragment
    desc: Hex text contains command item prefix
    crit: notable
    if:
      type: text
      substr: '636d642c20'
composite_rules:
  - id: htmlhelp-hex-obfuscated-command-object
    desc: Obfuscated Help constructs command object
    crit: hostile
    conf: 0.97
    all:
      - id: hex-html-object-fragment
      - id: hex-html-param-fragment
      - id: hex-command-item-fragment
      - id: metadata/file/encoding/hex::many-hex-string-fragments
      - id: micro-behaviors/data/collection/array::javascript-bracket-array-rotation
  - id: htmlhelp-media-player-replacement
    desc: Help downloads and activates media player replacement
    crit: hostile
    conf: 0.98
    all:
      - id: split-media-player-executable-path
      - id: html-location-variable-navigation
      - id: micro-behaviors/communications/http/client/response-body::javascript-response-body
      - id: micro-behaviors/fs/write/file/stream::js-savetofile-dynamic-path-mode-2
      - id: micro-behaviors/os/com/instantiation::activex-object-variable-progid
  - id: htmlhelp-hidden-extracted-python-launch
    desc: Help shortcut extracts and hides Python launch
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/com/automation::htmlhelp-shortcut-command-param
      - id: htmlhelp-decompile-temp
      - id: hidden-extracted-python-bytecode
  - id: obfuscated-activex-cab-download
    desc: Obfuscated ActiveX downloads and loads CAB
    crit: hostile
    conf: 0.99
    all:
      - id: split-activex-xmlhttp
      - id: split-save-to-file
      - id: cab-object-codebase
  - id: htmlhelp-obfuscated-click-scheduled-download
    desc: Help shortcut hides scheduled PowerShell downloader
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/com/automation::htmlhelp-shortcut-command-param
      - id: micro-behaviors/ui/controls/widget::html-obfuscated-click-call
      - id: scheduled-download-powershell-pipe
      - id: well-known/app/system/microsoft/html-help::htmlhelp-hhctrl-clsid
  - id: htmlhelp-image-hidden-shortcut-autostart
    desc: Image document autostarts hidden Help shortcut
    crit: suspicious
    conf: 0.97
    all:
      - id: htmlhelp-one-pixel-object
      - id: large-html-inline-image
      - id: well-known/app/system/microsoft/html-help::htmlhelp-hhctrl-clsid
      - id: micro-behaviors/os/com/automation::htmlhelp-shortcut-command-param
      - id: micro-behaviors/process/config/target::htmlhelp-shortcut-item1-named-target
      - id: micro-behaviors/ui/controls/widget::html-object-click-call

  - id: htmlhelp-hidden-bypass-scripted-execution
    desc: Scripted Help runs hidden policy-bypassing PowerShell
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/os/com/automation::htmlhelp-shortcut-command-param
      - id: micro-behaviors/process/config/target::htmlhelp-shortcut-item1-named-target
      - id: micro-behaviors/ui/controls/widget::html-object-click-call
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-flag
    any:
      - id: well-known/app/system/microsoft/html-help::htmlhelp-shortcut-clsid
      - id: well-known/app/system/microsoft/html-help::htmlhelp-hhctrl-clsid
      - id: well-known/app/system/microsoft/html-help::htmlhelp-hhctrl-alternate-clsid
