# Relocated from the legacy CHM delivery catalog. A scripted HTML Help
# Shortcut is a document execution trigger, not by itself a payload handoff.
# A scripted Shortcut is a documented Help feature. Hidden policy-bypassing
# PowerShell or a linked download/launch supplies the attack admission.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1218.001
  mbc: E1218
composite_rules:
  - id: htmlhelp-hidden-bypass-scripted-execution
    desc: Scripted Help runs hidden policy-bypassing PowerShell
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/os/com/automation::htmlhelp-shortcut-command-param
      - id: micro-behaviors/process/create/exec::htmlhelp-shortcut-item1-named-target
      - id: micro-behaviors/ui/controls/widget::html-object-click-call
      - id: micro-behaviors/process/argument/option::powershell-hidden-command-text
      - id: micro-behaviors/process/argument/option::powershell-policy-bypass-flag
    any:
      - id: micro-behaviors/os/com/automation::htmlhelp-shortcut-clsid
      - id: micro-behaviors/os/com/automation::htmlhelp-hhctrl-clsid
      - id: micro-behaviors/os/com/automation::htmlhelp-hhctrl-alternate-clsid

  - id: htmlhelp-scripted-download-launch
    desc: Scripted Help activates a downloaded executable
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/com/automation::htmlhelp-shortcut-command-param
      - id: micro-behaviors/ui/controls/widget::html-object-click-call
      - id: micro-behaviors/process/deploy/file-exec::webclient-downloadfile-same-variable-launch
    any:
      - id: micro-behaviors/os/com/automation::htmlhelp-shortcut-clsid
      - id: micro-behaviors/os/com/automation::htmlhelp-hhctrl-clsid
      - id: micro-behaviors/os/com/automation::htmlhelp-hhctrl-alternate-clsid
