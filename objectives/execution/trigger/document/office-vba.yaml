defaults:
  for: [documents]
  platforms: [windows]
composite_rules:
  - id: office-vba-remote-msi-command
    desc: Office VBA remote MSI execution
    crit: suspicious
    conf: 0.88
    all:
      - id: micro-behaviors/process/create/shell/lang::autoopen-entrypoint
    any:
      - id: micro-behaviors/process/create/shell/lang::msiexec-quiet-install
      - id: micro-behaviors/process/create/shell/lang::createobject-call

  # PowerPoint can make a fetched macro run without Shell, WMI, or a file
  # write: Auto_Open uses a CommandBar action whose OnAction names the remote
  # presentation's macro, then invokes the action.  Requiring the explicit
  # macro-qualified target keeps ordinary custom toolbars out of this rule.
  - id: office-vba-remote-macro-auto-trigger
    desc: Auto-open VBA dispatches a remote Office macro
    crit: hostile
    conf: 0.99
    attack: "T1059.005,T1105,T1204.002"
    for: [oledoc, ooxml]
    all:
      - id: micro-behaviors/process/create/macro/office::raw-auto-open-entrypoint
      - id: micro-behaviors/communications/http/client/vba::vba-remote-office-macro-url
      - id: micro-behaviors/ui/window/manage/activation::vba-commandbar-reference
      - id: micro-behaviors/ui/window/manage/activation::vba-commandbar-onaction
      - id: micro-behaviors/ui/window/manage/activation::vba-office-macro-action-target
      - id: micro-behaviors/ui/window/manage/activation::vba-commandbar-execute
