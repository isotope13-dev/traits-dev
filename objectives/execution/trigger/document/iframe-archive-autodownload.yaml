# HTML smuggling without script: framing a base64 ZIP data URI makes the
# browser drop the archive the moment the page opens. With an .exe member
# the page delivers an executable with no user action beyond opening it.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1027.006

composite_rules:
  - id: iframe-autodownloads-inline-exe-archive
    desc: Page iframe auto-saves an inline ZIP carrying an .exe
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/download/browser::iframe-archive-data-uri
      - id: metadata/file/encoding/compression::base64-zip-exe-entry
