# Office runs these macros without an explicit request to run a macro: a
# procedure named after a built-in Word command, an MSForms control's Layout
# event (fires when the sheet renders), or an OnTime callback scheduled from
# the open event. Each composite pairs the trigger with what it launches.
defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  attack: T1137,T1204.002

composite_rules:
  - id: vba-file-command-hook-module-copy
    desc: Word command override reruns macro copying
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/os/application/hook/event::vba-word-file-command-procedure
      - id: micro-behaviors/metaprogramming/generation/transform::vba-organizer-copy-project-item

  - id: msforms-layout-event-hidden-shell
    desc: Control Layout event runs a hidden Shell
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/os/application/hook/event::msforms-layout-event-handler
      - id: objectives/execution/interpreter/document/macro::vba-hidden-window-shell

  - id: workbook-open-deferred-hidden-shell
    desc: Workbook open schedules a hidden Shell launch
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/os/application/hook/event::vba-auto-open-sub-decl
      - id: micro-behaviors/os/application/hook/event::excel-ontime-immediate-macro
      - id: objectives/execution/interpreter/document/macro::vba-hidden-window-shell

  - id: autoopen-activates-embedded-package
    desc: Auto-open activates embedded OLE packages
    crit: hostile
    conf: 0.93
    for: [vbs]
    near_bytes: 2000
    all:
      - id: micro-behaviors/os/application/hook/event::vba-auto-open-sub-decl
      - id: micro-behaviors/data/document/embedded::vba-ole-package-doverb
