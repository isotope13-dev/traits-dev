defaults:
  for: [oledoc, ooxml]
  platforms: [windows]
  crit: notable
  conf: 0.94

traits:
  - id: document-event-module-shell-dispatch
    desc: Document lifecycle event invokes ShellExecute
    if:
      type: value
      path: office.vba.modules[*].source
      regex: '(?is)\b(Workbook|Document)_(BeforeClose|Open|Close)\s*\([^)]*\).{0,320}\.ShellExecute'
  - id: module-qualified-shell-arguments
    desc: VBA shell dispatch uses module arguments
    if:
      type: value
      path: office.vba.modules[*].source
      regex: '(?i)\.ShellExecute\s+\w+\.\w+(\(\))?\s*,\s*\w+\.\w+'
  - id: vba-indirect-shell-application-factory
    desc: VBA gets Shell Application through COM
    if:
      type: value
      path: office.vba.modules[*].source
      regex: '(?i)\.CreateObject\s*\(\s*"Shell\.Application"'
  - id: vba-split-hta-executable
    desc: VBA supplies the HTA interpreter
    if:
      type: value
      path: office.vba.modules[*].source
      regex: '(?im)^\s*\w+\s*=\s*"([^"\r\n]*\\)?mshta(\.exe)?"\s*$'

composite_rules:
  - id: vba-document-event-split-hta
    desc: Document event launches HTA through split VBA modules
    crit: hostile
    conf: 0.97
    attack: T1059.005,T1218.005
    all:
      - id: document-event-module-shell-dispatch
      - id: module-qualified-shell-arguments
      - id: vba-indirect-shell-application-factory
      - id: vba-split-hta-executable
