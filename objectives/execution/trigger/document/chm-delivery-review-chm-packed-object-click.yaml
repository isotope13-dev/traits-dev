defaults:
  platforms: [windows]
  for: [chm]

composite_rules:
- id: chm-packed-object-click
  desc: Packed CHM page auto-clicks an embedded object
  crit: hostile
  conf: 0.98
  scope: archive
  for: [chm, html, javascript]
  all:
    - id: metadata/document/chm::chm-single-user-entry
    - id: metadata/document/chm::chm-has-objinst
    - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::packer-eval-pattern
    - id: micro-behaviors/ui/controls/widget::html-object-click-call
  unless:
    - id: metadata/document/chm::chm-data-basename

