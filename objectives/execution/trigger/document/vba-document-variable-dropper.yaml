defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1204.002,T1059.005

traits:
  # Macro entry points that run when the document opens. The VBA member text
  # carries the handler as a Sub, which the container-typed trait misses.
  - id: vba-document-open-sub
    desc: VBA macro defines an auto-open Sub
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bSub\s+(Document_Open|AutoOpen|Auto_Open)\b'

  # Document variables hold the payload fragments and parameters. Reading
  # several named variables in an open handler is the staging pattern;
  # ordinary templates rarely read document variables this way.
  - id: vba-document-variable-value-read
    desc: VBA reads named document variable values
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.Variables\s*\(\s*"[^"]{1,24}"\s*\)\.Value'

  # Writes the decoded bytes to a file through ADODB.Stream.
  - id: vba-stream-savetofile-text
    desc: VBA SaveToFile writes a stream to disk
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\.SaveToFile\b'

composite_rules:
  # A document that reconstructs a payload from its own variables, XOR-decrypts
  # it with a key stored beside it, writes it to disk and runs it on open has
  # no benign form: the open handler is the trigger and the decrypt-and-write
  # pair is the dropper.
  - id: vba-document-variable-xor-dropper
    desc: Auto-open macro rebuilds, XOR-decrypts and writes a payload
    crit: hostile
    conf: 0.97
    all:
      - id: vba-document-open-sub
      - id: vba-document-variable-value-read
      - id: objectives/execution/payload/file-exec/command/script-host-download::wsh-vbs-xor-modulo-key
      - id: vba-stream-savetofile-text
