defaults:
  for: [documents, vbs]
  platforms: [windows]
traits: []
composite_rules:
- id: triggered-junk-filter-hidden-command
  desc: Office event runs a hidden character-decoded command
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.005,T1204.002,T1564.003
  all:
  - id: objectives/anti-static/obfuscation/string/junking::vbs-junk-alphabet-character-decoder
  - id: micro-behaviors/data/control-flow/dispatch/run::run-zero-style-argument
  - id: objectives/anti-static/obfuscation/name-mangling/variables::vbs-generated-identifiers
  any:
  - id: micro-behaviors/os/application/hook/event::vba-auto-open-sub-decl
  - id: micro-behaviors/os/application/hook/event::inkpicture-painted-handler
  needs: 1
- id: auto-open-with-shell
  desc: Auto-open macro with Shell or CreateObject references
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/os/application/hook/event::vba-auto-open-sub-decl
  any:
  - id: micro-behaviors/process/create/shell/reference::office-shell-reference-text
  - id: micro-behaviors/os/com/instantiation::office-createobject-reference-text
- id: office-vba-auto-execute-dropper
  desc: Auto-open macro with HTTP capability
  crit: suspicious
  conf: 0.9
  scope: outer
  all:
  - id: micro-behaviors/os/application/hook/event::autoopen-entrypoint
  any:
  - id: micro-behaviors/communications/http/client/xmlhttp::xmlhttp-object
  - id: micro-behaviors/communications/http/client/vba::urldownloadtofile-api
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-com
  - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
- id: office-vba-auto-execute-shell
  desc: Auto-open macro with shell execution
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/os/application/hook/event::autoopen-entrypoint
  - id: well-known/lib/runtime/scripted/windows-script-host::wscript-shell-object
  any:
  - id: micro-behaviors/os/env/path::temp-path-lookup
  - id: micro-behaviors/communications/http/client/xmlhttp::xmlhttp-object
  - id: micro-behaviors/process/create/wmi::win32-process-create
# An encrypted legacy workbook cannot be read by a static scanner: the BIFF
# FILEPASS record puts every cell, formula and Excel-4.0 macro sheet behind RC4,
# so only the (unencrypted) VBA storage is inspectable. That is a legitimate
# thing to do with a payroll file -- the SPKL overtime workbook this rule was
# written against encrypts a real employee roster and carries no auto-exec
# entry point at all, which is why the trigger leg is required.
#
# Pairing that unreadable body with code that runs the moment the document
# opens is the Emotet/Dridex encrypted-XLS shape, and it is the one variant the
# existing auto-exec composites miss: they each need a visible download or
# shell leg, which a dropper does not have when its payload lives inside the
# encrypted sheet and the VBA stub only kicks it off. Suspicious rather than
# hostile -- the payload itself is never observed, only the concealment plus
# the automatic trigger.
- id: encrypted-workbook-auto-exec-macro
  desc: Encrypted workbook auto-runs a macro on open
  crit: suspicious
  conf: 0.9
  attack: "T1027,T1204.002"
  for: [oledoc]
  all:
  - id: metadata/document/office/macro::encrypted-excel-vba-workbook
  any:
  - id: micro-behaviors/os/application/hook/event::vba-auto-open-sub-decl
  - id: micro-behaviors/os/application/hook/event::raw-auto-open-entrypoint
  - id: micro-behaviors/os/application/hook/event::workbook-open-handler

# Encrypted BIFF bodies hide sheet data while the VBA project stays readable.
# Malware feeds and generic AV often flag that shape even when the macros only
# automate attendance or payroll workflows with no auto-exec entry point.
- id: encrypted-excel-vba-external-saveas
  desc: Encrypted Excel macro writes external file
  crit: suspicious
  conf: 0.86
  attack: T1027
  for: [oledoc]
  all:
    - id: metadata/document/office/macro::encrypted-excel-vba-workbook
    - id: micro-behaviors/fs/write/file/full/unspecified::vba-document-saveas
- id: fragmented-office-vba-url-dropper
  desc: Fragmented VBA auto-open URL dropper
  crit: hostile
  conf: 0.98
  attack: T1105,T1204.002
  for: [oledoc]
  all:
    - id: micro-behaviors/os/application/hook/event::fragmented-vba-auto-open-entrypoint
    - id: micro-behaviors/communications/http/client/urlmon::fragmented-vba-urlmon-download-api
- id: fragmented-vba-bare-ip-dropper
  desc: Fragmented VBA dropper pulls from bare IP endpoints
  crit: hostile
  conf: 0.97
  attack: T1105,T1204.002,T1218.010
  for: [oledoc]
  scope: file
  all:
    - id: micro-behaviors/os/application/hook/event::fragmented-vba-auto-open-entrypoint
    - id: micro-behaviors/communications/http/client/urlmon::fragmented-vba-urlmon-download-api
    - id: micro-behaviors/communications/ip/ipv4::document-ipv4-endpoint-literal
