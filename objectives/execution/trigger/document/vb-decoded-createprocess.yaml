defaults:
  platforms:
  - windows
  for:
  - vbs
composite_rules:
- id: vb-autoopen-hex-createprocess
  desc: Auto-open, hex decoding, and CreateProcess clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/process/create/macro/autoexec::auto-open-sub-decl
  - id: micro-behaviors/data/decode/hex::vbscript-hex-pair-byte-conversion
  - id: micro-behaviors/process/create/launch::create-process-api-name
- id: vb-autoopen-hidden-createprocess
  desc: Auto-open and windowless CreateProcess clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/process/create/macro/autoexec::auto-open-sub-decl
  - id: micro-behaviors/process/create/launch::create-process-api-name
  - id: micro-behaviors/process/create/hidden::vb-create-no-window
  - id: micro-behaviors/data/decode/hex::vbscript-hex-pair-byte-conversion
# The clue sets above become a conviction once the CreateProcess import is
# itself concealed under a meaningless local name: the macro auto-runs,
# rebuilds a command from hex and starts it through an API it has taken
# pains to hide. A macro with a legitimate reason to start a process names
# the API it imports.
- id: vb-autoopen-hex-concealed-createprocess
  desc: Auto-open runs hex-decoded command via hidden CreateProcess
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.005,T1106
  all:
  - id: vb-autoopen-hex-createprocess
  - id: objectives/anti-static/obfuscation/name-mangling/import-name::vba-createprocess-renamed-declare
- id: vb-autoopen-windowless-concealed-createprocess
  desc: Auto-open hides windowless CreateProcess import
  crit: hostile
  conf: 0.98
  attack: T1059.005,T1106,T1564.003
  all:
  - id: vb-autoopen-hidden-createprocess
  - id: objectives/anti-static/obfuscation/name-mangling/import-name::vba-createprocess-renamed-declare
