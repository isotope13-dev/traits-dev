defaults:
  platforms: [windows]
  for: [html]

composite_rules:
- id: htmlhelp-shortcut-obfuscated-auto-fire
  desc: HTML Help Shortcut auto-fires through an obfuscated Click call
  crit: hostile
  conf: 0.995
  all:
    - id: micro-behaviors/os/com/automation::htmlhelp-shortcut-command-param
    - id: metadata/lang/encoding/shape/escape::htmlhelp-shortcut-item1-numeric-entities
    - id: micro-behaviors/ui/controls/widget::html-obfuscated-click-call
  any:
    - id: micro-behaviors/data/control-flow/dispatch/computed::html-computed-indexed-call
    - id: micro-behaviors/data/control-flow/dispatch/computed::html-computed-numeric-indexed-call

