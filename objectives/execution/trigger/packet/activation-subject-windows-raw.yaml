# Covert raw-packet framing used by passive Windows implants: a 16-bit
# length field recovered by XOR with 0xAAAA, then AES-CCM unwrap + opcode
# dispatch. ATT&CK T1205 (Traffic Signaling).
defaults:
  platforms: [windows]
  for: [c, cpp, python]
  attack: T1205

composite_rules:
  - id: objectives/execution/trigger/packet::rcvall-ccm-opcode-passive-backdoor
    desc: Promiscuous receive-all AES-CCM opcode backdoor
    crit: hostile
    conf: 0.97
    for: [c, cpp]
    attack: T1205,T1059,T1620
    all:
      - id: micro-behaviors/communications/socket/options::windows-rcvall-sniff
      - id: micro-behaviors/crypto/cipher/mode::bcrypt-chain-mode-ccm-macro
      - id: micro-behaviors/data/control-flow/dispatch/selector::switch-command-variable-dispatch
      - id: micro-behaviors/data/bitwise/xor-forms/scalar::xor-0xaaaa-text
      - id: micro-behaviors/os/api-resolution/dynamic::getprocaddress-virtualprotect-source
