defaults:
  platforms:
    - unix
  for:
    - shell
composite_rules:
  - id: nping-backdoor-activation
    desc: Crafted nping packet activates backdoor
    crit: hostile
    conf: 0.98
    attack: T1205
    mbc: B0022
    all:
      - id: well-known/tool/sysadmin/nping::nping
      - id: metadata/lang/source/syntax/command/options::tcp-mode
      - id: metadata/lang/source/syntax/command/options::flags-option
      - id: objectives/execution/trigger/packet::nping-secret-knock-marker
