defaults:
  platforms:
    - unix
  for:
    - shell
composite_rules:
  - id: nping-backdoor-activation
    desc: Crafted nping packet activates backdoor
    crit: hostile
    conf: 0.98
    attack: T1205
    mbc: B0022
    all:
      - id: micro-behaviors/communications/socket/send::nping
      - id: micro-behaviors/communications/socket/send::tcp-mode
      - id: micro-behaviors/communications/socket/send::flags-option
      - id: micro-behaviors/communications/socket/port::nping-secret-knock-marker
