defaults:
  platforms:
    - unix
  for:
    - shell
composite_rules:
  - id: nping-secret-knock-marker
    desc: nping payload and knock clues
    crit: suspicious
    conf: 0.97
    all:
      - id: well-known/tool/offensive/reconnaissance/nping::source-port
      - id: well-known/tool/offensive/reconnaissance/nping::payload-data
    any:
      - id: metadata/lang/natural/phrasing/security::rootkit-listening-text
      - id: metadata/lang/natural/phrasing/security::backdoor-key-arg
      - id: metadata/lang/natural/phrasing/security::nping-root-required
      - id: micro-behaviors/communications/socket/port::crafted-single-packet-knock
