defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: python-setup-powershell-download-archive-clues
  desc: Setup script PowerShell download and archive clues
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/communications/http/download/helper::python-string-powershell-download-cradle
  - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive
  - id: micro-behaviors/process/argument/interpreter::python-string-powershell-flagged-command
