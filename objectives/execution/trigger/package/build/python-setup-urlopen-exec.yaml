defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: objectives/execution/trigger/package/build::pypi-tempfile-urlopen-exec
  desc: Setup script URL retrieval, exec and temporary-file clues
  crit: hostile
  conf: 0.95
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/fs/temp/reference::tempfile-ref
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
  - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
  - id: objectives/anti-static/obfuscation/eval/scripting/host::platform-name-check
