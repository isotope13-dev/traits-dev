defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: python-build-hook-downloads-and-launches-windows-script
  desc: Install hook downloads and launches a remote Windows script
  crit: hostile
  conf: 0.98
  attack: T1105,T1059.003,T1195.002
  mbc: B0024
  scope: archive
  for: [python, python_sdist, whl, zip, tar]
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: metadata/build/package/recipe/setup-hooks::setuptools-build-py-alias-override
  - id: metadata/build/package/recipe/setup-hooks::setup-registers-build-py-override
  - id: micro-behaviors/communications/http/lib/urllib::urllib-opener-open-request
  - id: micro-behaviors/process/create/subprocess/launch::popen-ast
  any:
  - id: micro-behaviors/communications/http/request/executable-resource::remote-windows-script-url
  - id: micro-behaviors/communications/http/request/executable-resource::concatenated-windows-script-url
- id: objectives/execution/trigger/package/build::pypi-tempfile-urlopen-exec
  desc: Setup script URL retrieval, exec and temporary-file clues
  crit: hostile
  conf: 0.95
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/fs/temp/reference::tempfile-ref
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
  - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
  - id: objectives/anti-static/obfuscation/eval/scripting/host::platform-name-check
