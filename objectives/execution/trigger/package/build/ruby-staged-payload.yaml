# Ruby extension hooks with encoded execution clues.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1195.002,T1059.004,T1140
  mbc: B0024

composite_rules:
  - id: objectives/execution/trigger/package/build::extconf-base64-spawn-clues
    desc: extconf Base64 decoding and process spawn
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decode
      - id: micro-behaviors/process/create/exec::ruby-spawn

  - id: objectives/execution/trigger/package/build::extconf-env-base64-eval-clues
    desc: extconf environment, Base64 and eval clues
    crit: suspicious
    conf: 0.99
    for: [gem, ruby]
    scope: file
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decode
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval
    any:
      - id: micro-behaviors/os/env/cicd/runner::ruby-multi-ci-env-probe
      - id: micro-behaviors/fs/path/package-manager::ruby-extconf-opt-rubygems-path-gate
      - id: micro-behaviors/fs/proc/info/uptime::ruby-extconf-proc-uptime-age-gate
      - id: micro-behaviors/fs/file/stat::ruby-extconf-dev-home-artifacts-probe
      - id: micro-behaviors/os/sysinfo/hostname/reference::ruby-hostname-sandbox-vm-regex
      - id: metadata/lang/source/syntax/pattern-match::ruby-install-analysis-cwd-regex
      - id: objectives/anti-analysis/sandbox-detect/username-gate::ruby-extconf-generated-user-sandbox-regex
    needs: 1

  - id: objectives/execution/trigger/package/build::extconf-native-build-encoded-execution-clues
    desc: extconf Base64 and process APIs with mkmf
    crit: suspicious
    conf: 0.995
    for: [gem, ruby]
    scope: file
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decode
      - id: metadata/build/package/recipe/gemspec::extconf-native-build-helper
    any:
      - id: micro-behaviors/process/create/exec::ruby-spawn
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval
      - id: micro-behaviors/process/create/fork::ruby-fork
    needs: 1

  - id: objectives/execution/trigger/package/build::gem-extconf-environment-encoded-execution
    desc: Gem extconf with environment and eval clues
    crit: suspicious
    conf: 0.995
    scope: archive
    for: [gem, ruby]
    all:
      - id: objectives/execution/trigger/package/build::extconf-env-base64-eval-clues
      - id: objectives/execution/trigger/package/build::extconf-native-build-encoded-execution-clues
