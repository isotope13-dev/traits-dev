# Install-time downloader that derives a payload, stages it under a hidden home
# path, grants execute permission, then starts it detached.
defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: python-install-hook-xor-payload-execution
  desc: Install hook XOR-decodes and runs downloaded payload
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1105,T1059.006
  scope: archive
  for: [python, python_sdist, whl, zip, tar]
  all:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/communications/http/get::requests-get
  - id: micro-behaviors/data/bitwise/mixed::python-xor-expression
  - id: micro-behaviors/fs/path/user-directory::home-hidden-dotpath
  - id: micro-behaviors/fs/chmod/remote::executable-permission-staging
  - id: micro-behaviors/process/create/subprocess/launch::popen-ast
  - id: micro-behaviors/fs/search/name::glob-call
