defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
composite_rules:
- id: objectives/execution/trigger/package/build::pypi-research-claim-install-execution-clues
  for:
  - python
  - pkginfo
  - python-sdist
  desc: Research claim and install execution clues
  crit: suspicious
  conf: 0.94
  scope: outer
  near_lines: 10
  all:
  - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
  - id: metadata/package/description/disclosure::pkginfo-security-research-claim
  any:
  - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
  - id: micro-behaviors/process/interpreter/eval/python-builtins::eval-builtin
  - id: micro-behaviors/metaprogramming/generation/compile::compile-builtin
  - id: micro-behaviors/process/create/subprocess/launch::process-execution
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::builtins-obfuscation
