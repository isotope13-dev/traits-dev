# A setuptools egg_info hook writes a victim-directed compromise marker through
# a shell. egg_info runs during package metadata preparation, before install().
defaults:
  for: [python]
  platforms: [unix, windows]
composite_rules:
  - id: python-egg-info-hook-shell-taunt
    desc: Egg-info hook writes a pwned marker
    conf: 0.98
    crit: hostile
    all:
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-egg-info
      - id: metadata/build/package/recipe/setup-hooks::setuptools-egg-info-run-override
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system-string-command
      - id: metadata/lang/natural/phrasing/security::pwned-taunt-wording
