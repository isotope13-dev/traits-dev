# Ruby extension hooks with encoded execution clues.
defaults:
  platforms: [unix, windows]
  for: [ruby, gem]
  attack: T1195.002,T1059.004
  mbc: B0024

composite_rules:
  - id: objectives/execution/trigger/package/build::extconf-encoded-socket-execution-clues
    desc: extconf encoded socket and execution clues
    crit: suspicious
    conf: 0.98
    scope: archive
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decoding
      - id: objectives/anti-static/obfuscation/encoding/base64::base64-ruby-socket-require-fragment
    any:
      - id: micro-behaviors/process/create/exec::ruby-spawn
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval

  - id: objectives/execution/trigger/package/build::extconf-base64-write-spawn-clues
    desc: extconf Base64, file write and process spawn
    crit: suspicious
    conf: 0.97
    # The extconf script itself decodes, writes and spawns. Archive scope let
    # the legs gather from unrelated members (signature files naming Base64,
    # templates writing files, Rakefiles spawning tools) while the extconf
    # recipe stayed clean.
    scope: file
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decoding
      - id: micro-behaviors/fs/write/file/full/unspecified::ruby-file-write-reference
      - id: micro-behaviors/process/create/exec::ruby-spawn

  - id: objectives/execution/trigger/package/build::extconf-ci-encoded-socket-eval-clues
    desc: extconf CI, encoded socket and eval clues
    crit: suspicious
    conf: 0.99
    scope: archive
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decoding
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval
      - id: objectives/anti-static/obfuscation/encoding/base64::base64-ruby-socket-require-fragment
      - id: metadata/lang/source/literal/fragment/env-variable::ruby-source-github-actions-marker

  - id: objectives/execution/trigger/package/build::gem-extconf-env-encoded-socket-eval-clues
    desc: Gem extconf environment, socket and eval clues
    crit: suspicious
    conf: 0.995
    scope: archive
    all:
      - id: objectives/execution/trigger/package/build::extconf-env-base64-eval-clues
      - id: objectives/anti-static/obfuscation/encoding/base64::base64-ruby-socket-require-fragment
