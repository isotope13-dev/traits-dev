# Everything in setup.py runs when pip builds or installs the sdist. Fetching a
# body over HTTP, Base64-decoding it into a shell command, executing that
# command, and POSTing output back is a complete install-time C2 loop;
# packaging never needs to run decoded network content or phone results home.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1059.006,T1041
  mbc: B0024

composite_rules:
  - id: python-setup-fetch-decode-shell-exec-exfil
    desc: setup.py shells decoded network content and re-posts output
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/build/package/recipe/setup-hooks::setup-py-subprocess
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
      - id: micro-behaviors/process/argument/positional::python-decoded-bytes-subprocess-argv
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen
      - id: micro-behaviors/communications/http/client/response-body::urlopen-response-body-read
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
      - id: micro-behaviors/communications/http/post::source-post-method-literal
    unless:
      - id: metadata/path/directory::test-directory-component
