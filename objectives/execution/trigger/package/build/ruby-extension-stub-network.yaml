defaults:
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.9
composite_rules:
  - id: objectives/execution/trigger/package/build::extconf-stub-build-network-clues
    desc: Extension stub build and HTTP request clues
    crit: suspicious
    conf: 0.97
    for: [ruby, gem]
    attack: T1195.002
    mbc: B0024
    scope: archive
    all:
      - id: micro-behaviors/os/module/load/path::extconf-loads-relative-helper
      - id: micro-behaviors/fs/write/file/unspecified::extconf-writes-empty-makefile
      - id: micro-behaviors/communications/http/client/exchange::ruby-http-request-call
    # Recipes that fetch a precompiled library instead of building one also
    # stub a Makefile, but they save what they fetched: a binary-mode write or
    # a stream copy means the request had a build purpose, so stay out.
    unless:
      - id: metadata/build/package/recipe/gemspec::extconf-native-build-helper
      - id: micro-behaviors/fs/write/file/mode::ruby-file-open-write-binary
      - id: micro-behaviors/fs/write/file/copy::io-copy-stream
