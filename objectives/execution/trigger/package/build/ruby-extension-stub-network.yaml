defaults:
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.9

traits:
  - id: ruby-spawn-then-detach
    desc: Ruby starts and detaches a process
    crit: notable
    for: [ruby]
    if:
      type: text
      regex: 'Process\.spawn\([^\r\n]{1,110}\r?\n\s*Process\.detach\(\w+\)'

  - id: ruby-joins-executable-path
    desc: Ruby builds a path to an executable
    crit: notable
    for: [ruby]
    if:
      type: text
      regex: 'File\.join\([^\r\n]{1,90},\s*["''][\w.-]+\.exe["'']\)'

composite_rules:
  - id: ruby-extconf-helper-http-executable-launch
    desc: Ruby helper fetches and detaches an executable process
    crit: suspicious
    conf: 0.96
    for: [ruby]
    all:
      - id: micro-behaviors/communications/http/lib/netlib::ruby-net-http-get-request-object
      - id: micro-behaviors/fs/write/file/binary::ruby-file-binwrite-content
      - id: ruby-joins-executable-path
      - id: ruby-spawn-then-detach

  - id: gem-extension-stub-executable-download
    desc: Gem install runs a stub build and launches a remotely fetched executable
    crit: hostile
    conf: 0.99
    for: [gem, ruby]
    attack: T1195.002,T1105
    scope: archive
    all:
      - id: micro-behaviors/os/module/load/path::extconf-loads-relative-helper
      - id: micro-behaviors/fs/write/file/build::extconf-writes-empty-makefile
      - id: ruby-extconf-helper-http-executable-launch

  # Check-in before the fetch: the extension hook POSTs to a raw external IP.
  # The URL may be stored encoded, so the decoded text supplies the IP leg.
  - id: gem-extension-hook-raw-ip-post
    desc: Gem extension hook POSTs to a raw external IP
    crit: suspicious
    conf: 0.95
    for: [gem, ruby]
    attack: T1195.002,T1071.001
    scope: archive
    all:
      - id: micro-behaviors/os/module/load/path::extconf-loads-relative-helper
      - id: micro-behaviors/communications/http/post::net-http-post
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url

  - id: objectives/execution/trigger/package/build::extconf-stub-build-network-clues
    desc: Extension stub build and HTTP request clues
    crit: suspicious
    conf: 0.97
    for: [ruby, gem]
    attack: T1195.002
    mbc: B0024
    scope: archive
    all:
      - id: micro-behaviors/os/module/load/path::extconf-loads-relative-helper
      - id: micro-behaviors/fs/write/file/build::extconf-writes-empty-makefile
      - id: micro-behaviors/communications/http/client/exchange::ruby-http-request-call
    # Recipes that fetch a precompiled library instead of building one also
    # stub a Makefile, but they save what they fetched: a binary-mode write or
    # a stream copy means the request had a build purpose, so stay out.
    unless:
      - id: metadata/build/package/recipe/gemspec::extconf-native-build-helper
      - id: micro-behaviors/fs/write/file/mode::ruby-file-open-write-binary
      - id: micro-behaviors/fs/write/file/copy::io-copy-stream
