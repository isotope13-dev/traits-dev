# A Python package runs a remotely hosted batch script from a customized
# setuptools build hook. The build hook is part of sdist installation, and the
# package uses the Windows command interpreter to launch a temp-path batch.
defaults:
  platforms: [windows, unix]
  for: [python-sdist, python]
  attack: T1195.002,T1105,T1059.003

composite_rules:
  - id: setup-hook-downloads-and-launches-remote-batch
    desc: Setup hook downloads and launches remote batch script
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/package/recipe/setup-hooks::setuptools-build-py-class
      - id: micro-behaviors/communications/url/external/github::raw-githubusercontent-any
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
      - id: micro-behaviors/fs/path/temporary-artifact::temporary-batch-path-reference
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
