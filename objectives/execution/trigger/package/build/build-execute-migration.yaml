defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
  attack: T1195.002
composite_rules:
  # An sdist build hook that launches its own bundled Windows executable is
  # materially different from compiling a native extension: installation
  # starts a second program supplied by the package, here detached and with
  # its output discarded. Keep the claim tied to the build command, process
  # launch and an executable archive member so ordinary build_py overrides
  # and packages that merely ship helper binaries do not match.
  - id: sdist-build-hook-launches-bundled-executable
    desc: Python sdist build hook launches a bundled Windows executable
    crit: hostile
    conf: 0.97
    for: [python-sdist, python, tar]
    scope: archive
    all:
      - id: metadata/build/pip::root-setup-py-path
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-build-py
      - id: metadata/build/package/recipe/setup-hooks::setuptools-build-py-run-override
      - id: metadata/build/package/recipe/setup-hooks::run-override-calls-helper-after-super
      - id: micro-behaviors/process/daemonize/detach::setup-py-build-py-detached-devnull-popen
      - id: metadata/archive/member/extension::archive-windows-executable-entry

  - id: objectives/execution/trigger/package/build::sdist-setup-py-hex-argv-gated-subprocess
    desc: Python source distribution hides gated setup-time process execution
    crit: hostile
    conf: 0.96
    for:
      - python-sdist
      - python
    scope: archive
    attack: T1195.002,T1027
    all:
      - id: micro-behaviors/metaprogramming/generation/build::setup-py-hex-argv-gated-subprocess
      - id: metadata/build/pip::root-setup-py-path
      - id: micro-behaviors/process/create/variable::variable-command-argument
  - id: sdist-setup-py-toplevel-os-system-canary
    desc: Python sdist setup.py runs top-level os.system canary command
    crit: hostile
    conf: 0.98
    for:
      - python-sdist
      - python
    scope: archive
    attack: T1195.002,T1059
    all:
      - id: objectives/execution/payload/file-exec/command/shell::python-os-system-canary-gui-app
      - id: metadata/build/pip::root-setup-py-path
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/ui/keywords::python-print-installed-message
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system-string-command
  - id: objectives/execution/trigger/package/build::python-setup-trojan
    desc: Setup download and execution clues
    crit: suspicious
    conf: 0.95
    for:
      - python
    scope: leaf
    any:
      - id: micro-behaviors/communications/http/client/exchange::setup-py-curl-exec
      - id: micro-behaviors/communications/http/client/exchange::setup-py-urlopen-exec
      - id: objectives/execution/payload/file-exec/command/chmod::setup-py-wget-tmp-bash
      - id: micro-behaviors/communications/http/client/exchange::setup-py-requests-exec
      - id: micro-behaviors/communications/http/client/exchange::setup-py-requests-eval
      - id: micro-behaviors/communications/http/client/exchange::setup-py-requests-ossystem
      - id: micro-behaviors/process/create/shell/pipeline::setup-py-download-pipe-shell
  - id: objectives/execution/trigger/package/build::build-system-trojan
    desc: Package build execution or transfer clues
    crit: suspicious
    conf: 0.95
    mbc: E1059
    unless:
      - id: metadata/package/testing/corpus/security-tests::inert-scanner-attack-corpus
      - id: metadata/path/directory::test-directory-component
    any:
      - id: objectives/execution/trigger/package/build::python-setup-trojan
      - id: metadata/package/scripts/command::npm-install-eval-or-pipeline
      - id: objectives/supply-chain/impersonation/depconf::cargo-disclosed-depconf-telegram-build-beacon
      - id: objectives/exfiltration/stealer/configuration/environment::rust-build-rs-post-exfil
      - id: objectives/execution/payload/file-exec/spawn/native::rust-build-rs-staged-payload-exec
      - id:
          objectives/execution/payload/file-exec/spawn/runtime::rust-build-rs-hostname-unverified-remote-payload-exec
      - id:
          objectives/execution/payload/file-exec/spawn/runtime::rust-build-rs-obfuscated-endpoint-payload-exec
      - id: objectives/exfiltration/stealer/configuration/environment::cargo-archive-build-rs-post-exfil
      - id:
          objectives/execution/payload/file-exec/spawn/native::cargo-archive-build-rs-staged-payload-exec
      - id: micro-behaviors/communications/http/request/body/environment::rust-proc-macro-env-http-post
