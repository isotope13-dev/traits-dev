defaults:
  platforms: [windows, unix]
  for: [xml]
  attack: T1195.002,T1041
composite_rules:
  - id: objectives/execution/trigger/package/build::nuget-build-hook-executes-interactive-application
    desc: NuGet build hook runs interactive application
    crit: suspicious
    conf: 0.98
    attack: T1195.002,T1059
    for: [nupkg, xml]
    scope: archive
    all:
      - id: metadata/build/manifest::msbuild-targets-file
      - id: metadata/build/ecosystem::msbuild-exec-interactive-application
    any:
      - id: metadata/build/msbuild::msbuild-before-build-target
      - id: metadata/build/msbuild::msbuild-after-build-target
      - id: metadata/build/msbuild::msbuild-before-compile-target
