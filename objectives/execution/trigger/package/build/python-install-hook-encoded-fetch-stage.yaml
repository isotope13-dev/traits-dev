# A custom install command decodes shell text that fetches and stages an
# executable. Packaging setup hooks execute on the installing machine.
defaults:
  platforms: [unix, windows]
  for: [python, python_sdist, whl, zip, tar]

composite_rules:
- id: python-install-hook-encoded-fetch-stage
  desc: Install hook stages fetched executable from encoded command
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1105,T1204.002
  scope: archive
  for: [python, python_sdist, whl, zip, tar]
  all:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system
  - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
  - id: micro-behaviors/fs/path/basename::base64-decoded-executable-path
  - id: micro-behaviors/fs/write/file/target::write-exe
