# The URL fetch is in setup code, but the separate subprocess call is not
# proven to launch the fetched executable.
defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
  - id: python-setup-discord-exe-process-profile
    desc: Setup code has Discord EXE and process call
    crit: suspicious
    conf: 0.98
    all:
      - id: well-known/app/communication/discord::discord-cdn-executable-url
      - id: micro-behaviors/communications/http/download/helper::setup-executable-url-retrieval-attempt
      - id: micro-behaviors/process/create/subprocess/launch::call-ast
