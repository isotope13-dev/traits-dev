# Setup code in Python packages runs automatically during build and installation.
# Spawning child processes to collect host and environment reconnaissance during
# package build indicates malicious supply-chain activity.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1082,T1059.006

composite_rules:
  - id: python-setup-subprocess-recon
    desc: setup.py launches child processes to gather host and hardware reconnaissance
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/build/package/recipe/setup-hooks::setup-py-subprocess
    any:
      - id: micro-behaviors/process/identity/query/command::whoami-exec-argument
      - id: micro-behaviors/os/sysinfo/gpu::nvidia-smi-query-gpu
      - id: micro-behaviors/fs/proc/cmdline::process-pid-cmdline
      - id: micro-behaviors/fs/proc/info/pid::init-process-metadata-procfs-access
      - id: micro-behaviors/communications/http/ip-discovery::ip-sb-geoip
    needs: 2
