defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
composite_rules:
  - id: objectives/execution/trigger/package/build::python-windows-network-launch-clues
    desc: Windows-targeted Python network and launch clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/handler/open::python-windows-start-clues
      - id: micro-behaviors/communications/transfer::python-http-or-socket-io
      - id: metadata/package/files/name::python-setup-or-init-file
    any:
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::python-win32-check
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::python-osname-nt-check
