defaults:
  platforms: [unix, windows]
  for: [ruby]
composite_rules:
  - id: objectives/execution/trigger/package/build::extconf-windows-payload-launch
    for: [ruby, gem]
    desc: extconf helper and Ruby network-spawn clues
    crit: suspicious
    conf: 0.98
    attack: T1195.002,T1105,T1059
    mbc: B0024
    scope: archive
    all:
      - id: micro-behaviors/os/module/load/path::extconf-loads-relative-helper
      # The profile keeps its observations in one Ruby file; archive scope
      # does not prove that extconf loads that particular file.
      - id: objectives/execution/staging/transfer::ruby-http-binwrite-spawn-profile
