defaults:
  platforms: [unix, windows]
  for: [python, python_sdist, tar, zip, whl]
composite_rules:
  - id: objectives/execution/trigger/package/build::setup-hook-chmod-process-clues
    desc: Setup hook, chmod and process execution clues
    crit: suspicious
    conf: 0.94
    for: [python]
    scope: file
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/fs/chmod/modify::python-chmod-call-with-exec-bit
      - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-exception-pass
      - id: metadata/build/package/recipe/setup-hooks::python-build-or-install-command-override
      - id: micro-behaviors/process/create/subprocess/launch::process-execution
    unless:
      - id: metadata/build/pip::nested-cli-setup-py
      # DWEX's install hook creates a platform launcher and registers it in
      # the user's application menu; it does not execute a bundled payload.
      - id: well-known/tool/reverse-engineering/dwex::packaging-context
