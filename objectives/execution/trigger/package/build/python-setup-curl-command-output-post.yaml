# Everything in setup.py runs when pip builds the sdist. A shell-out to curl
# whose body is a command substitution posts local command output from the
# installing host; packaging never needs to send data anywhere.
defaults:
  platforms: [unix]
  for: [python]
  attack: T1195.002,T1059.004,T1041

composite_rules:
  - id: python-setup-shell-curl-posts-command-output
    desc: setup.py shells out to curl to POST local command output at install
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/build/pip::root-setup-py
      - id: micro-behaviors/communications/http/curl/command::curl-data-command-subst
      - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url
    any:
      - id: micro-behaviors/process/create/shell/command-string::getoutput-content
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system-string-command
      - id: micro-behaviors/process/create/subprocess/launch::process-execution
