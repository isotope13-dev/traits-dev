# PEP 517 / 518 build-backend hooks. Modern Python packages declare a
# build backend in pyproject.toml. Malicious backends override
# build_wheel / build_sdist / prepare_metadata_for_build_wheel and run
# code during `pip install` even with --no-build-isolation off.
#
# Existing setup.py coverage doesn't catch these — pyproject.toml-only
# packages have no setup.py at all.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: objectives/execution/trigger/package/build::in-tree-backend-ships-staged-loader
    desc: In-tree backend with retrieval and execution clues
    crit: suspicious
    conf: 0.96
    attack: T1195.002,T1105
    for: [python-sdist, pyproject.toml, python]
    scope: archive
    all:
      - id: metadata/package/config/tooling::pep517-backend-path-declaration
      - id: objectives/execution/payload/file-exec/download/runtime::retrieval-and-execution-clues
    any:
      - id: metadata/build/package/recipe/setup-hooks::python-build-wheel-function
      - id: metadata/build/package/recipe/setup-hooks::python-prepare-wheel-metadata-function
