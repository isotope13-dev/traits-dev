defaults:
  platforms: [windows, unix]
composite_rules:
  - id: windows-start-exec
    desc: Setup, execution and start text clues
    crit: notable
    conf: 0.9
    for:
      - python
      - makefile
    all:
      - id: metadata/build/pip::root-setup-py
      - id: micro-behaviors/process/create/shell/reference::windows-start-command
      - id: micro-behaviors/process/create/subprocess/launch::python-command-exec-any

  - id: python-install-hook-downloads-and-starts-remote-executable
    desc: Python install hook downloads and starts a remote executable
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.006,T1195.002
    scope: outer
    for: [python, python_sdist, whl, zip, tar]
    all:
      - id: metadata/build/package/recipe/setup-hooks::python-install-hook
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/fs/write/file/handle/call::py-open-write-inline
      - id: micro-behaviors/process/create/shell/reference::windows-start-command
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
