defaults:
  platforms: [linux, macos, windows]
  for: [python]
composite_rules:
  - id: objectives/execution/trigger/package/build::setup-py-pythonw-http-read-clues
    desc: Setup file with pythonw and HTTP read clues
    crit: suspicious
    conf: 0.96
    platforms: [windows]
    scope: file
    all:
      - id: metadata/build/pip::root-setup-py
      - id: objectives/anti-static/obfuscation/eval/scripting/host::pythonw-exe-replace-trick
      - id: micro-behaviors/communications/http/client/response-body::urlopen-response-body-read
