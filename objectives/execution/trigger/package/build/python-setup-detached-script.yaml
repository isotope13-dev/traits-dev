defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1059.006,T1027

composite_rules:
  - id: python-setup-detached-temp-script
    desc: Setup script drops hidden temporary script and spawns detached process
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/fs/file/open/unspecified::python-open-hardcoded-tmp-path
      - id: micro-behaviors/process/create/path-execution::hidden-temp-dotfile-execution
    any:
      - id: micro-behaviors/process/daemonize/detach::python-subprocess-new-session-option
      - id: micro-behaviors/process/interpreter/python::sys-executable-popen
      - id: micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-stdio-assignment
      - id: micro-behaviors/process/argument/subcommand::python-sys-argv-membership-test
    unless:
      - id: metadata/path/directory::test-directory-component
