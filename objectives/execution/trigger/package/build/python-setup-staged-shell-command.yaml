# Install-time dead-drop command execution: setup.py fetches remotely staged
# commands over HTTP and runs the variable-held result through a shell, then
# posts data back. The setup.py filename is mandated by the packaging format,
# so gating on it is stable; every other leg is content-derived API behavior
# that survives renames of identifiers, hosts, paths and encodings. The
# loopback and base64-envelope legs corroborate the dead-drop shape (a local
# model registry, pastebin or throwaway API holding chunked payloads) without
# gating on the attacker's service or host.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1059.006
  mbc: B0024
composite_rules:
- id: setup-py-staged-command-shell-exec
  desc: Setup script executes remotely staged shell command
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/build/pip::setup-py
  - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
  - id: micro-behaviors/process/create/variable::variable-command-argument
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
  any:
  - id: micro-behaviors/communications/url/host/http::loopback-http-url-reference
  - id: micro-behaviors/communications/http/request/encoded::json-base64-envelope-post
  - id: micro-behaviors/communications/http/request/client::python-post-transport
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-data
