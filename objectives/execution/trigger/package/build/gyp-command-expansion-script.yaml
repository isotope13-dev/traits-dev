# A binding.gyp whose `sources` list is produced by GYP command expansion
# (`<!(...)`) that runs a local JavaScript file with its output thrown away and
# then echoes a placeholder source name. npm runs `node-gyp rebuild` for any
# package that ships binding.gyp, so this executes the script at install time
# without an install script in package.json. Real addons use `<!(node -p ...)`
# to print include paths; they do not silence a script and fake its output.
defaults:
  platforms: [unix, windows]
  for: [gyp]
  attack: T1195.002,T1059.007

traits:
  - id: gyp-expansion-silenced-node-script
    desc: GYP expansion runs a silenced Node script
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '<!@?\(\s*node\s+[\w./-]{1,80}\.(c|m)?js\b[^)]{0,40}(>\s*/dev/null|>\s*nul\b|&&\s*echo\s)'

composite_rules:
  - id: binding-gyp-install-time-script-launch
    desc: binding.gyp hides an install-time script launch
    crit: hostile
    conf: 0.95
    for: [npm, tar, gyp]
    scope: archive
    all:
      - id: metadata/package/files/included::binding-gyp-manifest
      - id: gyp-expansion-silenced-node-script
