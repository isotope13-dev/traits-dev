# A setup.py that, while pip evaluates it, downloads a program and hands that
# same file to the Windows shell for a detached launch (`start <path>`,
# `cmd /c start <path>`, os.startfile). Nothing the package publishes says what
# will run: the payload is whatever the remote host serves, started on every
# consumer at install time with no waiting and no result consumed. Build
# helpers that fetch a tool run it with arguments for its output; a bare
# detached start of the fetched file is a dropper hand-off.
#
# The install-time leg is module-scope retrieval, a module-invoked
# download-and-process helper, or a custom setuptools lifecycle hook. A
# download helper that nothing calls is not install-time execution.
#
# Worked example: a top-level try block fetching https://<free TLD>/syswin32.exe
# to syswin32.exe and running ['start', 'syswin32.exe'] with shell=True. The
# retrieval receiver is misspelled (urllib.urlrequest), so that release raises
# and prints the error; the rule records the attempted dropper, not success.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1195.002,T1105,T1204.002
  mbc: B0024
composite_rules:
  - id: objectives/execution/trigger/package/build::pypi-remote-executable-start-attempt
    desc: Setup downloads a program and starts it detached
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/build/pip::root-setup-py
      - id: micro-behaviors/process/deploy/file-exec/spawn::python-downloaded-file-detached-launch
    any:
      - id: micro-behaviors/communications/http/download/helper::module-scope-urlretrieve-call
      - id: micro-behaviors/communications/http/download/helper::module-scope-wget-download-call
      - id: micro-behaviors/communications/http/download/helper::module-invokes-download-process-helper
      - id: metadata/build/package/recipe/setup-hooks::python-install-hook
