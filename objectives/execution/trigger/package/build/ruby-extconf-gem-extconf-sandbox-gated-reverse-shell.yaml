defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1195.002,T1059.004
  mbc: B0024

composite_rules:
  - id: objectives/execution/trigger/package/build::gem-extconf-sandbox-gated-reverse-shell
    desc: Gem hook Base64 eval and environment clues
    crit: suspicious
    conf: 0.99
    for: [gem, ruby]
    scope: archive
    all:
      - id: micro-behaviors/process/interpreter/eval/decoded::extconf-base64-eval-install-payload
      - id: micro-behaviors/os/env/cicd/runner::ruby-multi-ci-env-probe
    any:
      - id: micro-behaviors/os/sysinfo/hostname/reference::ruby-hostname-sandbox-vm-regex
      - id: metadata/lang/source/syntax/pattern-match::ruby-install-analysis-cwd-regex
    unless:
      - id: objectives/execution/trigger/package/build::extconf-env-base64-eval-clues
