defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: objectives/execution/trigger/package/build::extconf-stub-toolchain-executable-clues
    for: [ruby, gem]
    desc: Stub toolchain and executable staging clues
    crit: suspicious
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/fs/write/file/unspecified::stubmaker-fake-toolchain
      - id: micro-behaviors/fs/path/user-directory::downloads-main-exe-path
    any:
      - id: objectives/evasion/security-bypass/tls::ruby-tls-bypass-download-exec
      - id: objectives/execution/trigger/package/build::extconf-windows-payload-launch
      - id: micro-behaviors/process/create/exec::ruby-spawn
      - id: micro-behaviors/fs/write/file/binary::ruby-file-binwrite-content
