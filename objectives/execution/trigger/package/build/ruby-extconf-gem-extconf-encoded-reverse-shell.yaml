defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1195.002,T1059.004
  mbc: B0024

composite_rules:
  - id: objectives/execution/trigger/package/build::gem-extconf-encoded-reverse-shell
    desc: Gem hook Base64 and process execution clues
    crit: suspicious
    conf: 0.98
    for: [gem, ruby]
    scope: archive
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/data/decode/base64/unspecified::ruby-base64-decode64-call
    any:
      - id: micro-behaviors/process/interpreter/eval/decoded::extconf-base64-eval-install-payload
      - id: micro-behaviors/process/deploy/file-exec/spawn::extconf-base64-spawn-install-payload
    unless:
      - id: objectives/execution/trigger/package/build::extconf-env-base64-eval-clues
      - id: objectives/execution/trigger/package/build::extconf-base64-spawn-clues
      - id: objectives/execution/trigger/package/build::extconf-native-build-encoded-execution-clues
