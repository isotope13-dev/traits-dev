defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
  attack: T1195.002
composite_rules:
  - id: sdist-setup-py-hex-argv-gated-subprocess
    desc: Python source distribution hides gated setup-time process execution
    crit: hostile
    conf: 0.96
    for:
      - python-sdist
      - python
    scope: archive
    attack: T1195.002,T1027
    all:
      - id: micro-behaviors/process/create/subprocess/launch::setup-py-hex-argv-gated-subprocess
      - id: metadata/build/pip::root-setup-py-path
      - id: micro-behaviors/process/create/subprocess/launch::variable-command-argument
  - id: python-setup-trojan
    desc: Setup download and execution clues
    crit: suspicious
    conf: 0.95
    for:
      - python
    scope: leaf
    any:
      - id: micro-behaviors/communications/http/client/exchange::setup-py-curl-exec
      - id: micro-behaviors/communications/http/client/exchange::setup-py-urlopen-exec
      - id: objectives/execution/payload/file-exec/command/chmod::setup-py-wget-tmp-bash
      - id: micro-behaviors/communications/http/client/exchange::setup-py-requests-exec
      - id: micro-behaviors/communications/http/client/exchange::setup-py-requests-eval
      - id: micro-behaviors/communications/http/client/exchange::setup-py-requests-ossystem
      - id: micro-behaviors/process/create/shell/pipeline::setup-py-download-pipe-shell
  - id: build-system-trojan
    desc: Package build execution or transfer clues
    crit: suspicious
    conf: 0.95
    mbc: E1059
    any:
      - id: objectives/execution/trigger/package::python-setup-trojan
      - id: metadata/package/scripts/command::npm-install-eval-or-pipeline
      - id: objectives/supply-chain/impersonation/depconf::cargo-disclosed-depconf-telegram-build-beacon
      - id: objectives/exfiltration/stealer/configuration/environment::rust-build-rs-post-exfil
      - id: objectives/execution/payload/file-exec/spawn/native::rust-build-rs-staged-payload-exec
      - id:
          objectives/execution/payload/file-exec/spawn/runtime::rust-build-rs-hostname-unverified-remote-payload-exec
      - id:
          objectives/execution/payload/file-exec/spawn/runtime::rust-build-rs-obfuscated-endpoint-payload-exec
      - id: objectives/exfiltration/stealer/configuration/environment::cargo-archive-build-rs-post-exfil
      - id:
          objectives/execution/payload/file-exec/spawn/native::cargo-archive-build-rs-staged-payload-exec
      - id: micro-behaviors/communications/http/request/body/environment::rust-proc-macro-env-http-post
