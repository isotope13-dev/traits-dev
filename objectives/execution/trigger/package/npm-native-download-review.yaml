  # A package lifecycle hook that disables TLS verification, streams a remote
  # archive to disk, extracts it, and executes shell commands is an install-time
  # dropper even when it does not chmod or launch a native binary. The TLS
  # bypass and shell execution distinguish this from ordinary archive setup.
  - id: npm-postinstall-tls-bypassed-archive-shell-dropper
    desc: npm postinstall downloads and executes a TLS-bypassed archive
    crit: hostile
    conf: 0.99
    scope: archive
    attack: "T1195.002,T1105,T1059.007,T1573"
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: micro-behaviors/fs/write/file/stream::create-write-stream
      - id: micro-behaviors/data/archive/extract/tar::js-tar-gzip-extract-command
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
      - id: micro-behaviors/communications/tls/verify/disable::node-https-get-verification-disabled

  # An install hook that fetches a staged archive from a hardcoded IP literal
  # with certificate verification disabled never touches an authenticated
  # endpoint: there is no hostname to verify and the bypass invites
  # substitution of the staged bytes. Legitimate bootstraps name a registry,
  # forge, or CDN host with a valid chain; a bare-IP payload server plus an
  # explicit opt-out is the self-hosted dropper shape, not a mirror fallback.
  - id: npm-postinstall-tls-bypassed-ip-archive-fetch
    desc: npm postinstall fetches archive from hardcoded IP without TLS verification
    crit: hostile
    conf: 0.99
    scope: archive
    attack: "T1195.002,T1105,T1573"
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: micro-behaviors/communications/tls/verify/disable::reject-unauthorized-false
      - id: micro-behaviors/data/archive/extract/tar::js-tar-gzip-extract-command
    unless:
      - id: metadata/path/directory::test-directory-component

  # Executing a mutable raw-forge shell script from an npm lifecycle hook is
  # an install-time remote-code chain.  The lifecycle declaration and the
  # shell pipeline must be separate observations in the same archive, so a
  # normal library containing curl in documentation does not match.
  - id: npm-postinstall-remote-shell-bootstrap
    desc: npm postinstall executes mutable remote shell installer
    crit: hostile
    conf: 0.99
    scope: archive
    for: [source, binaries, '!dex', scripts, '!jcl', npm, package.json, tar]
    attack: "T1195.002,T1105,T1059.004"
    all:
      - id: metadata/package/scripts/command::postinstall-runs-node-script
      - id: micro-behaviors/communications/http/download/curl::curl-pipe-shell-in-js-exec
      - id: well-known/app/development/code-forge/github::raw-githubusercontent-script-file
    # The pipeline must appear inside an exec or execSync call rather than a
    # printed installation instruction. The three legs prove co-occurrence
    # inside one archive, not that the
    # hook reaches the pipeline. That gap has a common benign shape: a wrapper
    # package whose postinstall installs the project's own release binary, and
    # whose run.js prints `curl -fsSL .../install.sh | sh` in a console.error
    # fallback ("download failed, try this instead").
    #
    # The release-asset URL template is what separates the two: shipping a
    # versioned `releases/download/v<x>/<artifact>` installer is the wrapper
    # idiom (esbuild/biome-style shims build exactly that URL), and a dropper
    # whose point is to fetch a mutable `main`-branch script has no reason to
    # also carry one. The long per-vendor `not:` list on curl-pipe-sh is this
    # same FP being patched one project at a time.
    unless:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: well-known/tool/development/cli/squeez::archive-context

  # A launcher that runs the binary its postinstall fetched, but also falls
  # back to `npx -y` of a package outside its own scope, executes registry
  # code the installed version never pinned. Combined with a manifest that
  # names a different repository than the package, or declares an upstream
  # source tree it does not ship, the release-binary wrapper shape is being
  # used as a loader (Apex Accelerator npm launchers).
  - id: npm-postinstall-release-binary-npx-fallback-loader
    desc: npm postinstall fetches release binary; launcher falls back to npx -y
    crit: hostile
    conf: 0.9
    scope: archive
    for: [npm, tar, package.json, javascript]
    attack: "T1195.002,T1105,T1059.007"
    all:
      - id: metadata/package/scripts/command::postinstall-runs-node-script
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/shell/package::node-spawn-npx-yes-package
    # A clone-and-rename manifest either names another repository, or keeps the
    # upstream monorepo `main`/`exports` source tree while shipping only the
    # launcher (the manifest abstains from the name check when it declares a
    # repository directory).
    any:
      - id: metadata/package/repository::npm-name-repo-mismatch
      - id: metadata/package/files/missing-entrypoint::declared-runtime-main-without-runtime-shipped

  - id: npm-postinstall-sha256-brotli-native-bootstrap
    desc: Postinstall with Brotli and file-hash clues
    crit: suspicious
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/scripts/command::postinstall-runs-node-script
      - id: micro-behaviors/data/decompress/brotli::remote-brotli-binary-stage
    unless:
      - id: micro-behaviors/crypto/hash/file::verified-versioned-release-binary-installer
      - id: micro-behaviors/os/module/lookup::npm-native-binary-wrapper-postinstall
