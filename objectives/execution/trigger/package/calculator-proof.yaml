defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar]

composite_rules:
  - id: npm-install-calculator-callback-proof
    desc: Install hook pairs Calculator and HTTP callback
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1059.003
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: micro-behaviors/process/create/shell/spawn::node-cmd-calculator-launch
      - id: micro-behaviors/communications/http/client/response-body::discarded-http-get-response
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
