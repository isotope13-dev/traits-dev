defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  mbc: B0024
composite_rules:
  - id: npm-postinstall-masked-registry-install
    desc: Postinstall XOR and alternate registry clues
    crit: suspicious
    conf: 0.97
    scope: archive
    for: [npm, package.json, javascript, typescript]
    attack: T1195.002,T1027,T1105
    all:
      - id: metadata/package/scripts/command::postinstall-runs-node-script
      - id: micro-behaviors/process/create/exec::node-spawnsync-call
      - id: micro-behaviors/os/package-manager/runtime-install::npm-install-separate-registry-flag
      - id: micro-behaviors/data/decode/xor::js-buffer-repeating-key-xor-decode
