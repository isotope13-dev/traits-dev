defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: pth-bun-bootstrap-sidecar-loader
    desc: .pth startup with Bun release, sidecar and run-call clues
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1059.006
    all:
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: well-known/lib/runtime/scripted/bun-runtime::pth-bun-github-release-url
      - id: micro-behaviors/fs/path/script::pth-index-js-sidecar-reference
      - id: metadata/lang/source/syntax/call/member::pth-subprocess-run-alias-call
