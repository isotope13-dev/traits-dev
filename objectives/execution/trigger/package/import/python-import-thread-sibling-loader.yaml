# A module that starts a daemon thread at import, and whose thread target is
# a sibling module loaded by file path, runs its payload just by being
# imported. The thread-target leg is the import-time daemon thread. The
# loader leg is an importlib file-spec load that executes the sibling. A
# decrypt-named loader or a PYTHONSTARTUP gate supplies the intent: the
# payload is decrypted or skipped in interactive or startup sessions.
# Ordinary plugin loaders that import file-path modules, and ordinary
# background workers, do not carry the decrypt or PYTHONSTARTUP leg.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1204.005,T1059.006

composite_rules:
  - id: python-import-thread-sibling-module-loader
    desc: Import-time thread runs a sibling module loaded by path
    crit: hostile
    conf: 0.9
    scope: file
    unless:
      - id: metadata/path/directory::test-directory-component
    all:
      - id: objectives/persistence/system/python-startup::python-import-time-daemon-thread
      - id: micro-behaviors/os/module/load/path::python-importlib-spec-exec-module
    any:
      - id: metadata/lang/source/naming/function/cryptography::python-decrypt-named-function
      - id: micro-behaviors/os/env/runtime::pythonstartup-env-read
