# Python packages whose import starts a daemon thread, while another module
# of the same package downloads a file and launches it hidden. Importing the
# library is the trigger: no entry point, command or user action is needed,
# and the thread hides the work behind normal library use.
defaults:
  platforms: [windows, unix]
  crit: hostile
  attack: T1204.005,T1105,T1564.003

composite_rules:
  - id: python-package-import-thread-hidden-download-run
    desc: Package import spawns thread; package runs a download hidden
    conf: 0.9
    for: [tar, zip, python_sdist, python]
    scope: outer
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/process/thread/create::python-daemon-thread
      - id: micro-behaviors/process/deploy/file-exec/spawn::python-response-move-win32-launch
      - id: micro-behaviors/process/create/hidden::python-win32-hidden-startup-launch
