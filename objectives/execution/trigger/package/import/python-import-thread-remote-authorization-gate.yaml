# Importing the package starts a module-scope daemon thread that fetches a
# remote JSON authorization flag; a denied or failed check runs a sabotage
# routine. The remote server, not the user, decides when the destructive
# branch fires, and importing the library is enough to arm it.
defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1480,T1204.005

composite_rules:
  - id: python-import-thread-remote-flag-sabotage-trigger
    desc: Import thread polls remote flag that triggers sabotage
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: micro-behaviors/process/thread/create::python-module-scope-daemon-thread
      - id: metadata/lang/source/syntax/conditional::python-remote-json-authorization-check
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: metadata/lang/source/syntax/conditional::python-false-result-callback
      - id: objectives/impact/dos/memory::python-unbounded-megabyte-retention
