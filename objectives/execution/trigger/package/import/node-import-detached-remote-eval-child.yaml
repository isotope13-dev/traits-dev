# A JavaScript library whose entry point, as a side effect of being required,
# launches a detached Node child (unref'd so the host process may exit) on a
# script shipped in the same package, and that package contains code that
# builds a Function with a `require` parameter from an HTTP response. Loading
# the library is the trigger; the detached child outlives the test run or
# build that imported it. Libraries do not fork background Node processes on
# import, least of all ones that run network-supplied code.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, javascript]
  attack: T1195.002,T1059.007,T1105

composite_rules:
  - id: node-import-detached-child-runs-remote-code
    desc: Import detaches a Node child running remote code
    crit: hostile
    conf: 0.94
    scope: archive
    all:
      - id: micro-behaviors/process/daemonize/detach::detached-true
      - id: micro-behaviors/process/control/wait::node-unref-handle
      - id: micro-behaviors/fs/path/self::script-dirname-ref
      - id: micro-behaviors/communications/http/get::axios-get-call
    any:
      - id: objectives/anti-static/obfuscation/eval/require::function-constructor-require
      - id: objectives/supply-chain/trojanized/library/remote-eval::function-ctor-require-token
    unless:
      - id: metadata/path/directory::test-directory-component
