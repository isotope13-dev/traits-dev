defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
composite_rules:
  - id: objectives/execution/trigger/package/import::python-import-time-user-path-modification
    desc: Module-level calls with user PATH modification
    crit: suspicious
    conf: 0.95
    for: [python]
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-level-bare-call
    any:
      - id: objectives/persistence/login/shell/profile::python-appends-path-to-login-profile
      - id: objectives/persistence/system/registry/surface::python-user-path-registry-write

