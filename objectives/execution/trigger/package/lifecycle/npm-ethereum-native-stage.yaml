defaults:
  platforms: [windows, linux]
  for: [npm, tar]

composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::npm-install-hook-native-ethereum-stage
    desc: npm install hook launches a native Ethereum-resolved stage
    crit: hostile
    conf: 0.99
    scope: archive
    attack: "T1102,T1105,T1059.007"
    for: [npm, tar, package.json, javascript, elf]
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/os/module/load/path::module-level-native-addon-require
      - id: micro-behaviors/communications/blockchain/ethereum::eth-get-storage-at-method
      - id: micro-behaviors/communications/blockchain/ethereum::jsonrpc-hex-result-prefix
      - id: micro-behaviors/communications/http/curl/body::curl-json-post-command
      - id: micro-behaviors/communications/http/download/cli/curl-wget::fetch-output-option-script
      - id: micro-behaviors/fs/path/temp::tmp-path-content
      - id: micro-behaviors/fs/chmod/modify::chmod-symbol
      - id: micro-behaviors/process/replace::c-exec-variants
      - id: micro-behaviors/process/create/fork::fork
      - id: micro-behaviors/process/daemonize/detach::setsid-import
