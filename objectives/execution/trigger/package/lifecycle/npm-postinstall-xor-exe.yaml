defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::npm-postinstall-xor-exe-clues
    desc: Postinstall and XOR executable staging clues
    crit: suspicious
    conf: 0.99
    for: [javascript, typescript, package.json, npm]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: objectives/execution/staging/acquire::node-xor-exe-detached-clues

