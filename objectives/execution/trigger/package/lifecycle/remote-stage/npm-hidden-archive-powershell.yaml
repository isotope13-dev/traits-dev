defaults:
  platforms: [windows]
  for: [javascript, typescript]
composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::npm-preinstall-hidden-archive-dropper
    desc: npm preinstall launches hidden archive executable
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1059.001,T1105,T1140,T1564.003
    for: [npm, javascript, package.json]
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-node-index-hook
      - id:
          objectives/execution/payload/file-exec/spawn/runtime::embedded-powershell-hidden-archive-exe-stager
  - id: npm-postinstall-powershell-executable-download-run
    desc: npm postinstall downloads and launches a remote executable through PowerShell
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1105,T1059.001
    for: [npm, javascript, package.json, zip]
    scope: package
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/communications/url/scheme::http-url-literal
      - id: micro-behaviors/fs/path/extension::js-executable-filename-literal
      - id: micro-behaviors/process/argument/executable::js-powershell-name-literal
      - id: metadata/lang/source/naming/action/function-name::download-and-run-name-reference
    any:
      - id: metadata/import/builtin::child-process-exec-destructure
      - id: metadata/lang/source/declaration::js-computed-exec-destructure
    needs: 1

