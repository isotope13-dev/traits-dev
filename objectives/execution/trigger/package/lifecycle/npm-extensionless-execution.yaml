defaults:
  platforms: [windows, linux]
  for: [npm, tar]

composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::npm-install-hook-runs-extensionless-path
    desc: Install hook directly executes extensionless relative path
    crit: notable
    conf: 0.88
    scope: archive
    for: [npm, tar, package.json]
    any:
      - id: metadata/package/scripts/command::preinstall-direct-extensionless-path
      - id: metadata/package/scripts/command::install-direct-extensionless-path
      - id: metadata/package/scripts/command::postinstall-direct-extensionless-path
