# An npm install hook that loads a string-array RC4-obfuscated module talking
# to paste-site paths runs a hidden network stage at install time (StegaBin
# daytonjs: scripts/test/install.js -> vendor/scrypt-js/version.js).
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, npm, tar]
  attack: T1027,T1102

composite_rules:
  - id: npm-install-hook-rc4-obfuscated-paste-client
    desc: npm install hook ships RC4-obfuscated paste-site client
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::rc4-checksum-rotated-table-runtime
      - id: micro-behaviors/communications/http/client/exchange::paste-path-http-client-clues
