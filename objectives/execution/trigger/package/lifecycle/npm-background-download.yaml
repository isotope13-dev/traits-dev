defaults:
  platforms: [windows, linux]
  for: [npm, tar]

traits:
  - id: javascript-embeds-raw-ip-curl-download
    desc: JavaScript embeds curl download from raw IP
    crit: suspicious
    conf: 0.97
    for: [javascript]
    if:
      type: text
      regex: '(?i)curl.{0,100}-o\s+\S+.{0,100}https?://\d{1,3}(\.\d{1,3}){3}'
    not:
      - regex: '(?i)-o\s+(/dev/null|NUL)(\s|$)'

composite_rules:
  - id: javascript-raw-ip-curl-rundll32-stage
    desc: JavaScript downloads a raw-IP binary and launches it through rundll32
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1105,T1059.003,T1218.011
    for: [javascript]
    scope: file
    all:
      - id: metadata/import/builtin::child-process-exec-destructure
      - id: javascript-embeds-raw-ip-curl-download
      - id: objectives/execution/lolbin/rundll32::jscript-rundll32-write-profile

  - id: npm-archive-preinstall-curl-binary-rundll32-stage
    desc: npm archive preinstall launches a downloaded raw-IP binary through rundll32
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1105,T1059.003,T1218.011
    for: [zip, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
      - id: objectives/execution/trigger/package/lifecycle::javascript-raw-ip-curl-rundll32-stage

  - id: objectives/execution/trigger/package/lifecycle::npm-postinstall-streams-chmods-background-payload
    desc: npm postinstall backgrounds downloaded executable payload
    crit: hostile
    conf: 0.99
    scope: archive
    attack: "T1105,T1059.007,T1222.002"
    mbc: E1222
    for: [npm, tar, package.json, javascript, zip]
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: objectives/execution/payload/file-exec/download/native::node-https-stream-chmod-background-launcher
