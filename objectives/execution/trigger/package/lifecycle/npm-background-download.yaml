defaults:
  platforms: [windows, linux]
  for: [npm, tar]

composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::npm-postinstall-streams-chmods-background-payload
    desc: npm postinstall backgrounds downloaded executable payload
    crit: hostile
    conf: 0.99
    scope: archive
    attack: "T1105,T1059.007,T1222.002"
    mbc: E1222
    for: [npm, tar, package.json, javascript]
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: objectives/execution/payload/file-exec/download/native::node-https-stream-chmod-background-launcher
