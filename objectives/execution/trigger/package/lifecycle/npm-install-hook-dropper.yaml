defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002
composite_rules:
- id: objectives/execution/trigger/package/lifecycle::install-hook-dropper
  desc: Install hook download or interpreter clues
  crit: suspicious
  conf: 0.95
  mbc: B0024
  unless:
  - id: well-known/tool/sysadmin/alpine-packages/package::datadog-libdatadog-package-json
  - id: well-known/tool/sysadmin/alpine-packages/package::datadog-libdatadog-package
  any:
  - id: micro-behaviors/process/interpreter/shell::scripts-preinstall-pipe
  - id: micro-behaviors/process/interpreter/shell::scripts-postinstall-pipe
  - id: micro-behaviors/process/interpreter/node::scripts-preinstall-node-e
  - id: objectives/execution/trigger/package/lifecycle::scripts-postinstall-node-e
