defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: npm-obfuscated-post-module-clues
    desc: Obfuscated postinstall command and module clues
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/execution/trigger/package/lifecycle::obfuscated-postinstall-cmd-exe
      - id: micro-behaviors/communications/http/request/reference::quoted-post-token
    any:
      - id: micro-behaviors/data/control-flow/error-handling/catch::catch-before-await-or-require
      - id: micro-behaviors/os/module/require::node-system-module-import-set
