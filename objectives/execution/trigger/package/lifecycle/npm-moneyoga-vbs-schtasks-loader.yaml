---
defaults:
  platforms:
  - windows
  for:
  - javascript
  - package.json
  attack: T1195.002,T1053.005,T1105,T1059.005
  mbc: F0012,E1041
traits:
- id: bcryptkit-moneyoga-host-fragments
  desc: Obfuscated fragments form moneyoga download host
  crit: suspicious
  conf: 0.995
  for:
  - javascript
  if:
    type: yara
    source: |
      rule bcryptkit_moneyoga_host_fragments {
        strings:
          $s0 = /a0_0x337d93\(0x7e\)/
          $s1 = /a0_0x337d93\(0x7f\)/
          $s2 = /a0_0x337d93\(0xa8\)/
          $s3 = /a0_0x337d93\(0xa6\)/
          $s4 = /a0_0x337d93\(0x8f\)/
          $s5 = /a0_0x337d93\(0x79\)/
          $s6 = /a0_0x337d93\(0xa9\)/
        condition:
          (for any i0 in (1..#s0) : (for any i1 in (1..#s1) : (@s1[i1] >= @s0[i0] + !s0[i0] and @s1[i1] <= @s0[i0] + !s0[i0] + 40 and (for any i2 in (1..#s2) : (@s2[i2] >= @s1[i1] + !s1[i1] and @s2[i2] <= @s1[i1] + !s1[i1] + 40 and (for any i3 in (1..#s3) : (@s3[i3] >= @s2[i2] + !s2[i2] and @s3[i3] <= @s2[i2] + !s2[i2] + 40 and (for any i4 in (1..#s4) : (@s4[i4] >= @s3[i3] + !s3[i3] and @s4[i4] <= @s3[i3] + !s3[i3] + 40 and (for any i5 in (1..#s5) : (@s5[i5] >= @s4[i4] + !s4[i4] and @s5[i5] <= @s4[i4] + !s4[i4] + 40 and (for any i6 in (1..#s6) : (@s6[i6] >= @s5[i5] + !s5[i5] and @s6[i6] <= @s5[i5] + !s5[i5] + 40 and (true))))))))))))))
      }
- id: bcryptkit-remote-vbs-execute-fragment
  desc: Encoded VBS loader calls ExecuteGlobal
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  if:
    type: text
    substr: a0_0x337d93(0x89)
- id: bcryptkit-remote-vbs-response-fragment
  desc: Encoded VBS loader uses XMLHTTP response text
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  if:
    type: text
    substr: a0_0x337d93(0x8b)
composite_rules:
- id: npm-moneyoga-remote-vbs-scheduled-task
  desc: npm postinstall installs a task that evaluates remote VBScript
  crit: hostile
  conf: 0.995
  scope: archive
  for:
  - npm
  - tar
  - zip
  - package.json
  - javascript
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: bcryptkit-moneyoga-host-fragments
  - id: bcryptkit-remote-vbs-execute-fragment
  - id: bcryptkit-remote-vbs-response-fragment
