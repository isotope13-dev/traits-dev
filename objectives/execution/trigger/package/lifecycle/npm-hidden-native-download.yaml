defaults:
  platforms: [windows, linux]
  for: [npm, tar]

composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::npm-postinstall-downloads-and-hides-native-payload
    desc: npm postinstall downloads and hides a native payload
    crit: hostile
    conf: 0.97
    scope: archive
    attack: "T1105,T1564.003"
    for: [npm, tar, package.json, javascript]
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-node-script-error-ignored
      - id: objectives/execution/payload/file-exec/download/native::node-fetch-writefile-chmod-execfile-stealth-dropper
