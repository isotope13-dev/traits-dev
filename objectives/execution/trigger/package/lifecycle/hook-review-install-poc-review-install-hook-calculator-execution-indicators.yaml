# Calculator execution alongside an install hook suggests an execution proof
# of concept. Same-file evidence does not bind the launch to the hook. The
# separate python-install-hook-runs-calculator rule requires that binding.
defaults:
  platforms:
  - windows
  - linux
  - macos
  - unix
  for:
  - python
  - javascript
  - typescript
  - shell
  - batch
  - powershell
  - ruby
  - php
composite_rules:
- id: install-hook-calculator-execution-indicators
  desc: Install hook with calculator execution indicators
  crit: notable
  conf: 0.96
  scope: file
  all:
  - id: micro-behaviors/os/package-manager/hook-install::package-install-hook-present
  any:
  - id: micro-behaviors/process/create/exec::exec-call-launches-calculator
  - id: micro-behaviors/process/create/exec::exec-call-launches-unix-calculator
  - id: metadata/lang/source/syntax/command/launch::macos-calculator-command-argument
  - id: micro-behaviors/process/create/cmdlet::start-process-calc
