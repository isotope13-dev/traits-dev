defaults:
  platforms: [windows, unix]
  attack: T1195.002
  mbc: B0024
composite_rules:
- id: objectives/execution/trigger/package/lifecycle::bun-setup-mjs-preinstall-loader
  desc: preinstall setup and Bun execution clues
  # A package-manager bootstrap can legitimately provision a runtime. The
  # downloaded interpreter, temp staging, and preinstall context merit review,
  # but hostility comes from the sidecar payload composed elsewhere.
  crit: suspicious
  conf: 0.99
  scope: archive
  for: [javascript, typescript, package.json, npm]
  all:
  - id: metadata/package/scripts/entrypoint::preinstall-node-setup-mjs
  - id: objectives/execution/payload/file-exec/download/runtime::bun-release-temp-exec-clues
  unless:
  - id: well-known/app/development/cloudflare/
  - id: well-known/tool/detection/threat-intel/
