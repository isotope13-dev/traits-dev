defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: npm-obfuscated-hidden-shell-clues
    desc: Obfuscated postinstall hidden shell clues
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/execution/trigger/package/lifecycle::obfuscated-postinstall-cmd-exe
      - id: metadata/lang/source/declaration::js-execsync-destructure
      - id: micro-behaviors/process/argument/option::shell-obfuscated-dynamic
      - id: micro-behaviors/process/argument/visibility::windowshide-obfuscated-true
      - id: micro-behaviors/communications/http/request/reference::quoted-post-token
