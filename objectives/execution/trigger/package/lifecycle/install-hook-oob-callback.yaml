# An npm install hook runs a local script that calls an out-of-band
# interaction host (Burp Collaborator, interactsh and similar). Such hosts
# exist to confirm that attacker-supplied code ran somewhere: here, that a
# package was installed on a machine that resolved it, the dependency-
# confusion probe pattern. A real dependency has no reason to contact one.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  attack: T1195.002,T1071.001

composite_rules:
  - id: install-hook-oob-interaction-callback
    desc: Install hook calls out-of-band interaction host
    crit: hostile
    conf: 0.93
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::node-install-hook-local-script
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/get::axios-get-call
      - id: micro-behaviors/communications/http/request/client::node-scheme-selected-http-client
