defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::npm-postinstall-hidden-python-dropper
    desc: npm postinstall runs hidden HTTP-delivered Python payload
    crit: hostile
    conf: 0.995
    for: [javascript, typescript, package.json, npm]
    scope: archive
    attack: T1195.002,T1105,T1059.006,T1564.003
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: objectives/execution/payload/file-exec/download/native::node-http-base64-hidden-python-dropper
