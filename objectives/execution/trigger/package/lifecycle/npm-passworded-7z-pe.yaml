defaults:
  platforms: [windows, linux]
  for: [npm, tar]

composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::npm-postinstall-7z-stdout-remote-pe-dropper
    desc: Postinstall stages passworded 7z PE
    crit: hostile
    conf: 0.99
    scope: archive
    attack: "T1105,T1027,T1059.001"
    for: [binaries, '!dex', scripts, '!jcl', manifests, '!desktop-entry', '!systemd-service', json, npm, rust, tar, text]
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: objectives/execution/payload/file-exec/spawn/native::node-named-postinstall-passworded-pe-launch
