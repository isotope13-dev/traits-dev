defaults:
  platforms: [linux]
  for: [package.json]
  attack: T1195.002,T1105,T1059.004,T1543.003

traits:
  - id: boss-ops-oss-cgesrv-url
    desc: Downloads CGESrv binary from boss-ops OSS
    crit: suspicious
    conf: 0.995
    if:
      type: text
      substr: 'https://boss-ops.oss-cn-beijing.aliyuncs.com/CGESrv'

composite_rules:
  - id: npm-boss-ops-oss-detached-binary
    desc: npm preinstall downloads and launches a detached boss-ops binary
    crit: hostile
    conf: 0.995
    scope: file
    all:
      - id: metadata/package/scripts/lifecycle::raw-preinstall-key
      - id: boss-ops-oss-cgesrv-url
      - id: micro-behaviors/process/daemonize/detach::tmp-chmod-777-nohup-launch
