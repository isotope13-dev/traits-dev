defaults:
  platforms: [windows, linux]
  for: [npm, tar]

composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::npm-postinstall-passworded-remote-pe-dropper
    desc: npm postinstall stages and runs a passworded remote PE
    crit: hostile
    conf: 0.995
    scope: archive
    attack: "T1105,T1059.007,T1027,T1222.002"
    for: [binaries, '!dex', scripts, '!jcl', manifests, '!desktop-entry', '!systemd-service', json, npm, rust, tar, text]
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/communications/http/request/dynamic::node-selected-transport-request
      - id: micro-behaviors/data/archive/library::admzip-passworded-entry-read
      - id: micro-behaviors/fs/write/file/full/unspecified::node-fs-promises-write-file
      - id: micro-behaviors/fs/write/file/executable::node-write-file-executable-mode
      - id: micro-behaviors/data/format/executable/header::js-pe-mz-reject-check
      - id: micro-behaviors/process/create/subprocess/launch::spawn-call
