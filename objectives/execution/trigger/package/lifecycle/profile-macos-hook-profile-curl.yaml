defaults:
  platforms: [macos]
  for: [pkg]

composite_rules:

  # Archive-wide co-occurrence does not bind the URL or path to the hook.
  - id: macpkg-hook-profile-curl-clues
    desc: Installer hook, profile path and curl URL clues
    crit: suspicious
    conf: 0.95
    scope: archive
    platforms: [macos, windows, linux]
    for: [source, scripts, '!jcl', class, elf, macho, pkg]
    all:
      - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
      - id: micro-behaviors/fs/path/config/shell::system-profiled-path
      - id: micro-behaviors/communications/http/client/reference::curl-fail-silent-url-reference
    unless:
      - id: metadata/lang/source/syntax/command/download::source-curl-pipe-shell
