defaults:
  platforms: [windows]
  for: [javascript, typescript]
composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::npm-postinstall-windows-dropper
    desc: npm postinstall launches Windows batch dropper
    crit: hostile
    conf: 0.995
    for: [npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: objectives/execution/payload/file-exec/download/runtime::windows-temp-cmd-dropper-chain
    any:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
