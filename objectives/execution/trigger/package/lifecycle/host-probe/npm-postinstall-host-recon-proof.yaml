# A package lifecycle hook that runs account and host queries, reports the
# results to npm's captured error output, and deliberately fails is an
# install-time proof of execution. Treat the proof of host access as hostile
# even when the package claims an authorized assessment purpose.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1059.007,T1033,T1082
  mbc: E1041

traits:
  - id: node-install-proof-prints-to-stderr-and-fails
    desc: Prints proof to stderr, then fails
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'process\.stderr\.write\([\s\S]{0,500}process\.exit\(1\)'

  - id: node-install-proof-reports-host-fields
    desc: Output records account and host identity fields
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: "'uid='[\\s\\S]{0,300}'host='"

composite_rules:
  - id: npm-postinstall-host-recon-proof-output
    desc: npm install hook prints host reconnaissance proof
    crit: hostile
    conf: 0.99
    for: [npm, tar, package.json, javascript, typescript]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: objectives/discovery/account/enum::js-wrapped-id-exec
      - id: node-install-proof-prints-to-stderr-and-fails
      - id: node-install-proof-reports-host-fields
