# An npm package whose manifest runs a local Node script from an install-time
# lifecycle hook, and which ships a script that XOR-encodes a host profile
# (hostname and similar fields) before POSTing it. The install hook makes the
# beacon run on every machine that installs the package; the XOR wrapper hides
# the profile from a network observer without the key. A "demo" or "install
# counter" label does not change what the install-time code sends. The hook
# and the beacon are matched in the same package, not proven to be the same
# script. The hook legs are the individual lifecycle traits rather than the
# publish-root composite: a GitHub-install tarball keeps its manifest under
# <repo>-HEAD/ and never matches the registry `package/` layout.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  attack: T1195.002,T1082,T1041,T1027

composite_rules:
  - id: install-hook-xor-host-beacon
    desc: Install-hook package ships a XOR-encoded host profile beacon
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: objectives/exfiltration/stealer/system-info/host-user/callback::js-xor-encoded-host-beacon
    any:
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
      - id: metadata/package/scripts/entrypoint::install-runs-node-local-script
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
