defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::postinstall-github-optional-silent-loader
    desc: Postinstall catches GitHub dependency load
    crit: suspicious
    conf: 0.97
    mbc: B0024
    for: [npm, tar, package.json]
    scope: archive
    all:
      - id: micro-behaviors/os/module/require::postinstall-silent-caught-require
      - id: metadata/package/dependencies/source::npm-github-protocol-optional-dependency
