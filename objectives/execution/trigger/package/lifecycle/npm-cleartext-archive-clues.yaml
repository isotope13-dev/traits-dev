defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: npm-postinstall-cleartext-archive-dropper
    desc: npm hook with HTTP archive, extraction and detached spawn clues
    crit: suspicious
    conf: 0.99
    scope: archive
    for: [npm, tar, javascript]
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
      - id: micro-behaviors/communications/url/reference::js-cleartext-remote-archive-url
      - id: micro-behaviors/data/archive/extract/zip::js-archive-extraction-command
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
