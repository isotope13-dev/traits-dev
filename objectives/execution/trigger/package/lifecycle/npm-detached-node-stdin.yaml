defaults:
  platforms: [unix, windows]
  for: [npm, tar, javascript, typescript]

composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::postinstall-detached-node-stdin-clues
    desc: Postinstall, detached Node and stdin write clues
    crit: suspicious
    conf: 0.99
    scope: archive
    for:
      - npm
      - tar
      - javascript
      - typescript
      - package.json
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/process/stdio/write::detached-node-stdin-clues
