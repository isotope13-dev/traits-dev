defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: objectives/execution/trigger/package/lifecycle::preinstall-sh-js-webhook-gist-remote-stager
  desc: Preinstall sh-bundled-JS hook with gist fetch and webhook beacon
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1059.004,T1102
  for: [npm, tar, package.json, javascript, shell]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: micro-behaviors/os/package-manager/hook-install::npm-preinstall-runs-sh-bundled-js
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-uuid-path
  - id: micro-behaviors/communications/http/services/github/repository::github-gist-api-url
  - id: metadata/lang/source/syntax/command/launch::js-dollar-paren-curl-command-text
