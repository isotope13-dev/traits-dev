defaults:
  platforms: [windows, linux]
  for: [npm, tar]

composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::npm-install-extensionless-and-native-member
    desc: npm install hook and executable member clues
    crit: suspicious
    conf: 0.95
    scope: archive
    all:
      - id: objectives/execution/trigger/package/lifecycle::npm-install-hook-runs-extensionless-path
      - id: metadata/package/files/binary::npm-archive-bundled-machine-code-member
