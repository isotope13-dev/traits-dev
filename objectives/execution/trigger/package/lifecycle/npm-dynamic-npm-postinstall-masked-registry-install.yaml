defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  mbc: B0024
  attack: T1195.002,T1027,T1105
composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::npm-postinstall-masked-registry-install
    desc: Postinstall XOR and alternate registry clues
    crit: suspicious
    conf: 0.97
    scope: archive
    for: [npm, package.json, javascript, typescript]
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/process/create/exec::node-spawnsync-call
      - id: metadata/lang/source/syntax/command/options::npm-install-separate-registry-flag
      - id: micro-behaviors/data/decode/xor/repeating-key::js-buffer-repeating-key-xor-decode

  - id: npm-postinstall-xor-decoded-registry-install
    desc: Postinstall spawns npm install against XOR-decoded registry URL
    crit: hostile
    conf: 0.99
    scope: archive
    for: [npm, package.json, javascript, typescript]
    all:
      - id: npm-postinstall-masked-registry-install
      - id: objectives/supply-chain/hidden-payload/staging/script::npm-install-selects-decoded-registry
