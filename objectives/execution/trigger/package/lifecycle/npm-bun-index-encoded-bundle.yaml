defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::bun-index-encoded-bundle-clues
    desc: Bun preinstall and encoded bundle clues
    crit: suspicious
    conf: 0.98
    for: [javascript, typescript, package.json, npm]
    scope: archive
    all:
      - id: metadata/file/line::enormous-single-line
      - id: metadata/file/encoding/shape::multi-base64-string-candidates
      - id: metadata/package/scripts/entrypoint::preinstall-bun-run-index

