defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::npm-install-sidecar-dropper
    desc: Platform-specific npm sidecar execution clues
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::process-platform-content
      - id: metadata/lang/source/literal/string/fragment::install-sidecar-script-name
      - id: micro-behaviors/process/deploy/file-exec/command::node-sidecar-launch-command
      - id: metadata/import/builtin::require-child-process
      - id: micro-behaviors/process/create/shell/command-string::js-exec
