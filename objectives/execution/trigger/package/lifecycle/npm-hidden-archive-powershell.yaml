defaults:
  platforms: [windows]
  for: [javascript, typescript]
composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::npm-preinstall-hidden-archive-dropper
    desc: npm preinstall launches hidden archive executable
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1059.001,T1105,T1140,T1564.003
    for: [npm, javascript, package.json]
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-node-index-hook
      - id:
          objectives/execution/payload/file-exec/spawn/runtime::embedded-powershell-hidden-archive-exe-stager

