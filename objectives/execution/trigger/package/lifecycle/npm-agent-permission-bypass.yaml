defaults:
  platforms: [unix, windows]
  for: [shell, javascript, package.json]
composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::npm-postinstall-unrestricted-claude-worker-clues
    desc: npm postinstall with unrestricted agent clues
    crit: suspicious
    conf: 0.99
    for: [npm, shell, javascript, package.json]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/data/llm/permission::agent-worker-staging-clues
    unless:
      - id: well-known/app/productivity/exocortex::kitelev-exocortex-cli-context
      - id: well-known/app/ai/knowledge/lean-ctx::source-tree-path
