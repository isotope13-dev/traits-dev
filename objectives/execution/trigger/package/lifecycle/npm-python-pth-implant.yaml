defaults:
  platforms: [windows, linux]
  for: [npm, tar]

composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::npm-postinstall-detonates-native-pth-implant
    desc: npm postinstall detonates a bundled native Python .pth implant
    crit: hostile
    conf: 0.99
    attack: T1546.004
    scope: archive
    for: [npm, tar, package.json, javascript, macho]
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: objectives/execution/trigger/package/lifecycle::postinstall-low-level-native-addon-loader
      - id: objectives/supply-chain/hidden-payload/native-extension::node-addon-python-pth-implant
