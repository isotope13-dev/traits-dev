defaults:
  crit: suspicious
  conf: 0.99
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::npm-postinstall-obfuscated-module-network
    desc: Obfuscated postinstall module and HTTP clues
    for: [javascript, typescript, package.json, npm, tar]
    scope: archive
    attack: T1027
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::encrypted-string-table-hides-imports
      - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
      - id: micro-behaviors/communications/http/request/client::http-request-func
      - id: micro-behaviors/os/module/require::node-system-module-import-set
      - id: metadata/import/npm/adm-zip
