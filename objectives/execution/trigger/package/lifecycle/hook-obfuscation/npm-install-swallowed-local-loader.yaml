# An npm install hook runs index.js, which silently attempts to load a local
# module. The package may be incomplete or the catch may hide a failed load.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]

composite_rules:
  - id: index-js-swallows-local-module-failure
    desc: index.js silently catches a local require failure
    crit: notable
    for: [javascript]
    scope: file
    all:
      - id: metadata/package/files/included::javascript-index-basename
      - id: micro-behaviors/os/module/require::caught-local-require-swallowed-catch

  - id: npm-install-swallowed-local-module-loader
    desc: Install hook accompanies a swallowed local require
    crit: suspicious
    conf: 0.92
    scope: archive
    all:
      - id: install-runs-index-js
      - id: index-js-swallows-local-module-failure

traits:
  - id: install-runs-index-js
    desc: Install hook runs package index.js
    crit: notable
    for: [package.json]
    if:
      type: value
      path: scripts.install
      regex: '^node\s+(\./)?index\.js$'
