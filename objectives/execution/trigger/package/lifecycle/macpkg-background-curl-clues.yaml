defaults:
  platforms: [macos]
  for: [pkg]
composite_rules:
- id: objectives/execution/trigger/package/lifecycle::macpkg-background-curl-clues
  desc: Installer hook, curl, and detached command clues
  crit: suspicious
  conf: 0.99
  scope: archive
  platforms: [macos, windows, linux]
  for: [scripts, '!jcl', markdown, pkg, text]
  all:
    - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
    - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url
    - id: micro-behaviors/process/daemonize/detach::detached-background-command

# Stub installers ship an empty payload and a hook that downloads the real
# one. The two install tools are the same action: unpack what curl just saved.
