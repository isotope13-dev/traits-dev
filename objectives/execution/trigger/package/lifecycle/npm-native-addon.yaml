defaults:
  platforms: [windows, linux]
  for: [npm, tar]

composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::postinstall-low-level-native-addon-loader
    desc: npm postinstall script loads a platform-specific native addon via process.dlopen
    crit: suspicious
    conf: 0.98
    for: [javascript]
    all:
      - id: metadata/package/files/lifecycle::postinstall-js-file
      - id: micro-behaviors/process/interpreter/node::process-dlopen
      - id: micro-behaviors/fs/path/library::prebuilds-node-addon-name-pair
