defaults:
  platforms: [unix, windows, macos]
  attack: T1195.002,T1105,T1059.007
  mbc: B0024

composite_rules:
  - id: npm-postinstall-worker-response-eval
    desc: npm postinstall evaluates fetched Workers code
    crit: hostile
    conf: 0.99
    scope: archive
    for: [javascript, typescript, package.json, zip]
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/communications/url/host/domain-http::workers-dev-url
      - id: metadata/lang/source/syntax/call/relationship::then-eval-ident-callback-source
