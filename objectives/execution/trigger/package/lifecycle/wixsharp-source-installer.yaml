---
defaults:
  platforms:
  - windows
  for:
  - oledoc
composite_rules:
- id: wixsharp-source-installer
  desc: WixSharp MSI with source-backed BeforeInstall hook
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/installer/builder/wixsharp::wixsharp-managed-ui-msi
  - id: objectives/execution/trigger/package/lifecycle::source-backed-beforeinstall-hook
- id: wixsharp-userland-source-antirepair
  desc: Per-user WixSharp source installer disables repair
  crit: suspicious
  conf: 0.99
  all:
  - id: objectives/execution/trigger/package/lifecycle::wixsharp-source-installer
  - id: objectives/execution/trigger/package/lifecycle::userland-source-hooked-installer
  - id: micro-behaviors/os/package-manager/maintenance::msi-modify-repair-property-profile
