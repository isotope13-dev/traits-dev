defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]

composite_rules:
  - id: objectives/execution/trigger/package/lifecycle::npm-postinstall-header-command-clues
    desc: Postinstall shell command and HTTP header reference clues
    crit: suspicious
    conf: 0.99
    scope: archive
    for: [tar, tgz, npm, package.json, javascript]
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
      - id: micro-behaviors/process/create/shell/variable-command::exec-sync-http-response-header-command
    any:
      - id: micro-behaviors/data/encode/char-code::js-modulo-charcode-mapping
      - id: micro-behaviors/os/module/dynamic-load::node-dynamic-require-call
      - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
      - id: micro-behaviors/os/module/dynamic-load::manifest-encoded-require
