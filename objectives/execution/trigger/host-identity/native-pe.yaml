defaults:
  platforms: [windows]
  for: [pe]
  attack: T1480.001

composite_rules:
  - id: pe-hostname-conditional-payload-gate
    desc: Queries hostname to guard payload execution
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/sysinfo/hostname/query::get-computer-name
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: micro-behaviors/process/create/shell/reference::cmd-reference-create-process-w
      - id: micro-behaviors/data/bitwise/complement::x86-signed-byte-complement-loop
