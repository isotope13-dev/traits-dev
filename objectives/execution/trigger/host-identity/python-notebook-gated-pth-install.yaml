# The persistence step only runs when the host looks like a hosted notebook
# sandbox (the /mnt/data upload directory is present): the module copies one
# of its own files next to the interpreter and writes a .pth import for it.
# Keying the install to that environment keeps it dormant on developer
# machines and CI, where it would be noticed.
defaults:
  platforms: [unix]
  for: [python]
  attack: T1480,T1546.018

composite_rules:
  - id: python-notebook-path-gated-pth-self-copy
    desc: Notebook-sandbox path check gates .pth self-copy install
    crit: hostile
    conf: 0.94
    scope: file
    all:
      - id: objectives/persistence/login/python-startup::python-os-writes-import-pth
      - id: micro-behaviors/fs/path/location::python-mnt-data-path
      - id: micro-behaviors/fs/file/copy/source-destination::python-exists-and-copy
