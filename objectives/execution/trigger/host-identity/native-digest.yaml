defaults:
  for:
  - c
  - cpp
  platforms:
  - windows
  attack: T1480.001
traits:
- id: hostname-digest-return-guard
  desc: Hostname hash helper gates execution by return
  crit: suspicious
  conf: 0.96
  if:
    type: tree-sitter
    query: |-
      ((translation_unit
       (function_definition
        declarator: (function_declarator declarator: (identifier) @guard)
        body: (compound_statement) @guard_body)
       (function_definition
        body: (compound_statement
         (if_statement
          condition: (parenthesized_expression
           (unary_expression operator: "!" argument: (call_expression function: (identifier) @checked)))
          consequence: (compound_statement (return_statement)))))) @gate
       (#eq? @guard @checked)
       (#match? @guard_body "GetComputerName")
       (#match? @guard_body "CryptHashData")
       (#match? @guard_body "memcmp"))
composite_rules:
- id: hostname-crypto-digest-execution-gate
  desc: Hostname hash comparison guards execution
  crit: suspicious
  conf: 0.95
  all:
  - id: objectives/execution/trigger/host-identity::hostname-digest-return-guard
  - id: micro-behaviors/crypto/hash/digest::crypt-create-hash
  - id: micro-behaviors/mem/compare::native-buffer-cmp-call
  - id: metadata/lang/source/literal/array::portable-hex-byte-array-literal
