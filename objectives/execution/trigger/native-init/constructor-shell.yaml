# Constructor attributes identify native initialization, not preload hijacking.
# Co-occurrence does not bind the shell call to the constructor body.
defaults:
  for: [c, cpp]
  platforms: [linux]
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.004
composite_rules:
  - id: c-constructor-transformed-shell-loader
    desc: Native constructor with XOR-obfuscated shell execution
    all:
      - id: micro-behaviors/process/lifecycle/auto-exec::gcc-constructor-attr
      - id: objectives/execution/payload/script-eval/transformed/shell::c-hex-xor-system-loader
