defaults:
  platforms: [unix, windows]
  for: [whl, zip, python, text, elf, macho, pe]
  attack: T1195.002,T1105

composite_rules:
  - id: pytest-plugin-native-bridge-impostor-agent-dropper
    desc: Plugin wheel loads prebuilt bridge with cloudflared.pro agent URL
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/files/wheel-sdist::platform-independent-wheel-with-native-code
      - id: metadata/package/scripts/entrypoint::entry-points-file
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: objectives/supply-chain/trojanized/library/native-addon::cloudflared-impostor-agent-dl-url
