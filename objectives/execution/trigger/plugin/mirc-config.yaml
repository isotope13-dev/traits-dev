defaults:
  for: [text]
  platforms: [windows]

composite_rules:
  - id: mirc-config-repeated-click-process-report
    desc: Multiple mIRC click actions launch and report
    crit: suspicious
    conf: 0.95
    scope: file
    all:
      - id: metadata/file/format/structured::mirc-client-config-section
      - id: micro-behaviors/communications/irc/handler::mirc-click-action-process-then-message
