defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]

composite_rules:
  - id: objectives/execution/trigger/network::libcurl-activation-trigger
    desc: Libcurl, client header and action words
    crit: suspicious
    conf: 0.96
    all:
      - id: objectives/execution/trigger/network::c2-trigger-verb-set
      - id: micro-behaviors/communications/http/header/client::x-client-id-header
      - id: micro-behaviors/communications/http/client/curl::curl-easy-perform
