# Repo-shipped coding-agent / IDE config that executes a script belonging to a
# *different* tool's config directory.
#
# Sibling of ../ide/task.yaml (which covers the tasks.json folderOpen trigger
# itself) and ../../persistence/login/agent-hook/ (which covers droppers that
# *write* a hooks block at runtime). The gap those leave: the config checked
# into the repository as a static JSON file. Cloning such a repo and merely
# opening it in an editor or coding agent runs the command — no install step, no
# prompt.
#
# `.vscode/` and `.idea/` hold editor configuration; `.claude/`, `.cursor/` and
# friends hold agent configuration. A Claude session hook that runs a script
# from an editor directory splits the trigger from the payload so neither file
# looks self-contained. Observed in the keyv 6.0.0 npm compromise, where
# .claude/settings.json ran `node .vscode/setup.mjs` and .vscode/tasks.json ran
# `node .claude/setup.mjs`. A repository that points Claude at a shared
# `.cursor/hooks/` script is a normal dual-agent layout, not that split.
#
# Matching is on JSON value paths, not text: the command string is read from the
# parsed config so an unrelated mention of `.vscode` elsewhere in the file
# cannot satisfy it.
#
# ATT&CK: T1546 (Event Triggered Execution)  MBC: B0024
defaults:
  platforms: [windows, unix]
  for: [json]
  attack: T1546
  mbc: B0024

traits:
  - id: agent-hook-command-editor-config-dir
    desc: Agent hook runs script from editor dir
    crit: suspicious
    conf: 0.94
    if:
      type: value
      path: hooks.SessionStart[*].hooks[*].command
      regex: '\.(vscode|idea)[\\/]'

  - id: ide-task-command-claude-cursor-dir
    desc: IDE task runs Claude or Cursor script
    crit: notable
    conf: 0.94
    if:
      type: value
      path: tasks[*].command
      regex: '\.(claude|cursor)[\\/]'

  - id: ide-task-command-agent-dir-extra
    desc: IDE task runs other agent-dir script
    crit: notable
    conf: 0.94
    if:
      type: value
      path: tasks[*].command
      regex: '\.(codex|gemini|windsurf)[\\/]'

  - id: ide-task-command-setup-mjs
    desc: IDE task runs setup.mjs
    # `setup.mjs` is an attacker-chosen filename, not a payload property.  The
    # command is useful triage context; suspicion comes from an automatic
    # cross-tool trigger or from behavior in the referenced script.
    crit: notable
    conf: 0.95
    if:
      type: value
      path: tasks[*].command
      regex: '(?i)\bnode\s+[^\n]*setup\.mjs\b'

  - id: agent-hook-command-setup-mjs
    desc: Agent hook runs setup.mjs
    crit: notable
    conf: 0.95
    if:
      type: value
      path: hooks.SessionStart[*].hooks[*].command
      regex: '(?i)\bnode\s+[^\n]*setup\.mjs\b'

composite_rules:
  # Only platform-consumed Claude settings establish an automatic trigger.
  # Saved JSON snapshots still expose the neutral command declaration.
  - id: agent-sessionstart-project-config-script
    desc: Claude session hook runs editor config script
    crit: suspicious
    conf: 0.94
    all:
      - id: agent-hook-command-editor-config-dir
      - id: micro-behaviors/fs/path/agent-config/file::claude-settings-json
    unless:
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: well-known/tool/detection/agent-glovebox::glovebox-hook-settings-context

  # Payloads may generate these files at runtime rather than ship parseable
  # tasks.json/settings.json members. Reuse the serialized config atoms in
  # source so the behavior survives a switch from JavaScript to Python or a
  # shell heredoc. Proximity keeps unrelated config strings from assembling a
  # cross-tool autorun.
  - id: source-agent-session-editor-script
    desc: Source defines agent hook to editor script
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript, python, shell]
    all:
      - id: micro-behaviors/communications/ipc/agent-hook::agent-sessionstart-config-key
      - id: metadata/lang/source/syntax/key-value::quoted-command-string-field
      - id: micro-behaviors/fs/path/config/app::vscode-project-setup-path
    near_bytes: 480

  - id: source-folderopen-agent-script
    desc: Source defines folder-open agent script
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript, python, shell]
    all:
      - id: metadata/permission/activation::vscode-task-folder-open-activation
      - id: metadata/lang/source/syntax/key-value::quoted-command-string-field
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
    near_bytes: 480

  - id: reciprocal-editor-agent-autorun-chain
    desc: Defines reciprocal editor-agent autorun chain
    crit: hostile
    conf: 0.98
    for: [javascript, typescript, python, shell]
    all:
      - id: source-agent-session-editor-script
      - id: source-folderopen-agent-script
    unless:
      - id: well-known/tool/detection/threat-intel/

  - id: ide-task-command-agent-config-dir
    desc: IDE task runs script from agent dir
    crit: notable
    conf: 0.94
    any:
      - id: ide-task-command-claude-cursor-dir
      - id: ide-task-command-agent-dir-extra


  - id: agent-session-hook-cross-tool-script
    desc: Agent session hook runs cross-tool config script
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/ipc/agent-hook::agent-sessionstart-hook-command
      - id: agent-sessionstart-project-config-script
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: well-known/tool/detection/agent-glovebox::glovebox-hook-settings-context

      - id: "metadata/file/naming::test-directory-component"
  - id: ide-folder-open-cross-tool-script
    desc: IDE folder-open runs cross-tool config script
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/permission/activation::vscode-task-folder-open-activation
    # Reference the structured value atoms directly. Besides making the
    # hostile condition explicit, this avoids relying on an intermediate
    # composite when evaluating a static tasks.json file.
    any:
      - id: ide-task-command-claude-cursor-dir
      - id: ide-task-command-agent-dir-extra
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: "metadata/file/naming::test-directory-component"

  - id: agent-config-mcp-tmp-staged-package-autorun
    desc: Agent MCP config stages package in /tmp
    crit: hostile
    conf: 0.98
    for: [javascript, typescript, python, shell, json, markdown]
    all:
      - id: micro-behaviors/fs/path/agent-config/file::ai-agent-config-file-target
      - id: micro-behaviors/process/create/shell/agent-config::mcp-server-package-install-args
      - id: micro-behaviors/os/package-manager/reference-install::tmp-staged-package-install-command
      - id: micro-behaviors/process/create/agent::codex-dangerous-sandbox-bypass-flag

  - id: agent-instruction-mcp-shell-install-hijack
    desc: Agent instructions plant shell install MCP server
    crit: hostile
    conf: 0.98
    attack: T1546,T1195.002
    for: [markdown]
    all:
      - id: metadata/package/agent-skill::agent-instructions-md-basename
      - id: micro-behaviors/fs/path/agent-config/file::ai-agent-config-file-target
      - id: micro-behaviors/process/create/shell/agent-config::mcp-server-shell-command-args
      - id: micro-behaviors/process/create/shell/agent-config::mcp-server-package-install-args

  - id: agent-base-url-override-subagent-trigger
    desc: Agent base URL override with subagent trigger
    crit: hostile
    conf: 0.99
    for: [markdown, javascript, typescript, python, shell, json]
    all:
      - id: micro-behaviors/fs/path/agent-config/file::ai-agent-config-file-target
      - id: micro-behaviors/os/env/ai-provider::ai-provider-base-url-external-override
      - id: micro-behaviors/os/env/ai-provider::json-env-block-ai-base-url-override
      - id: micro-behaviors/process/create/workers::claude-task-tool-subagent-spawn

  - id: agent-instruction-provider-base-url-override
    desc: Agent instructions redirect AI provider base URL
    crit: hostile
    conf: 0.98
    attack: T1557,T1562.001
    for: [markdown]
    all:
      - id: metadata/package/agent-skill::agent-instructions-md-basename
      - id: micro-behaviors/fs/path/agent-config/file::ai-agent-config-file-target
      - id: micro-behaviors/os/env/ai-provider::ai-provider-base-url-external-override
      - id: micro-behaviors/os/env/ai-provider::json-env-block-ai-base-url-override

  - id: claude-settings-gateway-subagent-hijack
    desc: Claude settings redirect gateway and spawn subagent
    crit: hostile
    conf: 0.99
    for: [markdown]
    all:
      - id: micro-behaviors/fs/path/agent-config/file::claude-settings-path-reference
      - id: micro-behaviors/os/env/ai-provider::anthropic-base-url-external-url-assignment
      - id: micro-behaviors/process/create/workers::claude-task-tool-subagent-spawn
      - id: metadata/package/agent-skill::agent-instructions-md-basename
