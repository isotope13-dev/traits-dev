defaults:
  platforms: [windows, unix]
  for: [shell, markdown, text]
  attack: T1546

traits:
  # The SessionStart registration atom that used to live here matched a bare
  # `"SessionStart"` anywhere in the text, so it fired on any hook that merely
  # *prints* its own `hookEventName` -- the normal output of every SessionStart
  # hook, and no evidence of anything being built.  It was also a plain text
  # capability sitting in an intent-inferring tier.  It now lives, tightened to
  # the config-key and `hooks.SessionStart` spellings, as
  # micro-behaviors/communications/ipc/agent-hook::agent-sessionstart-config-key.
  - id: session-hook-curl-pipe-shell
    desc: Session hook fetches shell into interpreter
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'curl -fsSL https://raw\.githubusercontent\.com/.{0,160}\| bash'

composite_rules:
  - id: agent-sessionstart-remote-shell-bootstrap
    desc: Agent session starts mutable remote shell
    crit: hostile
    conf: 1.0
    # The curl|bash has to *be* the hook's command. Without this the two legs
    # pool across a whole repository: the `beads` tool documents its own
    # `SessionStart` hook in docs/CLAUDE_INTEGRATION.md and its published
    # install one-liner in README.md, and neither has anything to do with the
    # other.
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/ipc/agent-hook::agent-sessionstart-config-key
      - id: session-hook-curl-pipe-shell
