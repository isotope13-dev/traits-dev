defaults:
  platforms: [windows, unix]
  for: [shell, markdown, text]
  attack: T1546

traits:
  - id: shell-builds-sessionstart-hook
    desc: Shell script builds SessionStart hook
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'hooks\.SessionStart|"SessionStart"'

  - id: session-hook-curl-pipe-shell
    desc: Session hook fetches shell into interpreter
    crit: component
    conf: 0.99
    if:
      type: text
      regex: 'curl -fsSL https://raw\.githubusercontent\.com/.{0,160}\| bash'

composite_rules:
  - id: agent-sessionstart-remote-shell-bootstrap
    desc: Agent session starts mutable remote shell
    crit: hostile
    conf: 1.0
    all:
      - id: shell-builds-sessionstart-hook
      - id: session-hook-curl-pipe-shell
