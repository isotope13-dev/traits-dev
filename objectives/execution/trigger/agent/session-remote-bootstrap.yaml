defaults:
  platforms: [windows, unix]
  for: [shell, markdown, text]
  attack: T1546

traits:
  - id: shell-builds-sessionstart-hook
    desc: Shell script builds SessionStart hook
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'hooks\.SessionStart|"SessionStart"'

  - id: session-hook-curl-pipe-shell
    desc: Session hook fetches shell into interpreter
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'curl -fsSL https://raw\.githubusercontent\.com/.{0,160}\| bash'

composite_rules:
  - id: agent-sessionstart-remote-shell-bootstrap
    desc: Agent session starts mutable remote shell
    crit: hostile
    conf: 1.0
    # The curl|bash has to *be* the hook's command. Without this the two legs
    # pool across a whole repository: the `beads` tool documents its own
    # `SessionStart` hook in docs/CLAUDE_INTEGRATION.md and its published
    # install one-liner in README.md, and neither has anything to do with the
    # other.
    near_bytes: 512
    all:
      - id: shell-builds-sessionstart-hook
      - id: session-hook-curl-pipe-shell
