# Repository-controlled patches that introduce executable Git hooks.
# The article's exploit uses this artifact to turn patch content into a hook;
# the rules intentionally avoid vendor/version/endpoint strings.
defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: git-hook-path-reference
    desc: References a Git hook path
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?m)^.{0,80}\.git[\\/]hooks[\\/](pre|post)-[a-z0-9][a-z0-9-]*\b'
    unless:
      - id: well-known/app/development/git-server::git-server-package
      - id: well-known/app/development/git-server::git-server-hook-runner
      - type: text
        regex: '(?m)^#.*\.git[\\/]hooks'

composite_rules:
  - id: executable-git-hook-patch
    desc: Patch adds executable Git hook
    crit: suspicious
    conf: 0.98
    near_lines: 16
    all:
      - id: git-hook-path-reference
      - id: micro-behaviors/fs/file/executable::patch-new-file-executable-mode

  - id: git-hook-patch-command-execution
    desc: Indexed patch installs command-running Git hook
    crit: hostile
    conf: 0.99
    near_lines: 80
    all:
      - id: executable-git-hook-patch
      - id: micro-behaviors/process/create/vcs/git::git-indexed-three-way-fallback
    any:
      - id: micro-behaviors/process/create/shell/command-string::sh-c-exec
      - id: micro-behaviors/process/create/subprocess::run-ast
      - id: micro-behaviors/process/create/system::python-os-system
      - id: micro-behaviors/process/create/system::go-os-exec

  - id: git-hook-patch-object-output
    desc: Git hook patch stores command output in Git objects
    crit: hostile
    conf: 0.99
    near_lines: 80
    all:
      - id: executable-git-hook-patch
      - id: micro-behaviors/process/create/vcs/git::git-object-publication-chain
