defaults:
  platforms: [linux, macos, windows]
  for: [shell, batch, text]
composite_rules:
  - id: objectives/execution/trigger/repository::git-hook-download-pipe-shell
    desc: Git hook and download-to-shell clues
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/vcs::git-precommit-hook-path
    any:
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-sh-command
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-bash-execution
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::wget-pipe-sh
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-cmd-command-line
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-cmd-literal

  - id: objectives/execution/trigger/repository::git-postcheckout-download-pipe-shell
    desc: Git checkout hook and download-to-shell clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/vcs::git-postcheckout-hook-path
    any:
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-sh-command
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-bash-execution
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::wget-pipe-sh
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-cmd-command-line
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-cmd-literal

  - id: objectives/execution/trigger/repository::git-hook-vercel-download-pipe
    desc: Git hook and Vercel shell download clues
    crit: suspicious
    conf: 0.97
    all:
      - id: objectives/execution/payload/remote-script::vercel-download-pipe-shell
    any:
      - id: micro-behaviors/fs/path/vcs::git-precommit-hook-path
      - id: micro-behaviors/fs/path/vcs::git-postcheckout-hook-path

  - id: objectives/execution/trigger/repository::git-hook-silent-download-pipe
    for: [shell, batch]
    desc: Git hook and silent download execution clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::download-pipe-null-redirection
    any:
      - id: micro-behaviors/fs/path/vcs::git-precommit-hook-path
      - id: micro-behaviors/fs/path/vcs::git-postcheckout-hook-path
