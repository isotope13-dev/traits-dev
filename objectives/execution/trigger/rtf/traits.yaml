defaults:
  platforms: [windows, unix]
  for: [rtf]
traits:
  - id: objupdate
    desc: RTF objupdate auto-update trigger
    crit: suspicious
    conf: 0.8
    if:
      # Read from the parsed control-word inventory rather than the bytes:
      # these documents run to megabytes on a single line, and string
      # extraction returns a few truncated runs that never reach the trigger.
      type: value
      path: rtf.features[*]
      exact: objupdate
  - id: objautlink
    desc: "RTF objautlink directive automatic linking."
    crit: notable
    conf: 0.8
    if:
      type: value
      path: rtf.features[*]
      exact: objautlink
