defaults:
  platforms: [windows, unix]
  for: [nupkg, xml]
  attack: T1195.002

composite_rules:
  - id: nuget-msbuild-afterbuild-env-exfil-hook
    desc: NuGet MSBuild AfterBuild hook executes cross-platform env exfiltration
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: metadata/build/msbuild::msbuild-after-build-target
      - id: micro-behaviors/process/create/shell/command-string::msbuild-exec-command
      - id: objectives/credential-access/env/harvesting::msbuild-env-secret-filter-pattern
      - id: objectives/credential-access/env/harvesting::msbuild-env-base64-curl-post
      - id: objectives/exfiltration/oob/endpoint::msbuild-pipedream-or-webhook-post-url

  # The package's .targets runs `dotnet` on its own lib DLL during the
  # consumer's build, and that DLL fetches and writes bytes: a build-time
  # dropper inside a dependency, whatever the fetched content turns out to be.
  - id: nuget-msbuild-hook-runs-bundled-downloader
    desc: NuGet build hook runs a bundled .NET DLL that downloads and writes bytes
    crit: hostile
    conf: 0.92
    attack: T1195.002,T1105
    for: [nupkg, xml, pe]
    scope: archive
    all:
      - id: metadata/package/files/nuget::nupkg-managed-library-member
      - id: micro-behaviors/process/create/shell/command-string::msbuild-exec-dotnet-package-assembly
      - id: micro-behaviors/communications/http/client/managed::httpclient-reference-or-construction
      - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
    any:
      - id: metadata/build/msbuild::msbuild-after-build-target
      - id: metadata/build/msbuild::msbuild-before-build-target
      - id: metadata/build/msbuild::msbuild-before-compile-target

  - id: nuget-msbuild-beforebuild-canary-download-hook
    desc: NuGet MSBuild BeforeBuild hook triggers OOB hostname DownloadFile
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: micro-behaviors/communications/http/download/handler::msbuild-prebuild-hostname-download
      - id: metadata/package/documentation/disclosure::dependency-confusion-canary-disclosure
