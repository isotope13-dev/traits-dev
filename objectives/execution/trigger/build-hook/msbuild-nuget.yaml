defaults:
  platforms: [windows, unix]
  for: [nupkg, xml]
  attack: T1195.002

composite_rules:
  - id: nuget-msbuild-afterbuild-env-exfil-hook
    desc: NuGet MSBuild AfterBuild hook executes cross-platform env exfiltration
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: metadata/build/msbuild::msbuild-after-build-target
      - id: micro-behaviors/process/create/shell/command-string::msbuild-exec-command
      - id: objectives/credential-access/env/harvesting::msbuild-env-secret-filter-pattern
      - id: objectives/credential-access/env/harvesting::msbuild-env-base64-curl-post
      - id: objectives/exfiltration/oob/endpoint::msbuild-pipedream-or-webhook-post-url

  - id: nuget-msbuild-beforebuild-canary-download-hook
    desc: NuGet MSBuild BeforeBuild hook triggers OOB hostname DownloadFile
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: micro-behaviors/communications/http/download/handler::msbuild-prebuild-hostname-download
      - id: metadata/package/documentation/disclosure::dependency-confusion-canary-disclosure
