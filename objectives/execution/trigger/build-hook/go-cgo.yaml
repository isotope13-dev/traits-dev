defaults:
  platforms:
    - linux
  for:
    - go
    - zip
    - go_module
    - shell
    - elf
    - data
    - text
    - source
  attack: T1195.002,T1059.004
composite_rules:
  - id: cgo-sysroot-gcc-specs-wrapper-hook
    desc: Go cgo LDFLAGS sysroot GCC specs wrapper build hook
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/build/compiler::gcc-self-spec-wrapper-directive
      - id: micro-behaviors/dylib/load/ffi::go-cgo-sysroot-linker-flag
      - id: micro-behaviors/fs/write/copy::shell-relative-client-copy-to-tmp
      - id: metadata/lang/source/syntax/command/launch::shell-tmp-client-command-options
      - id: metadata/binary/symbols/name/qualified/network::go-http-task-shell-routine-indicators
