defaults:
  platforms: [unix, windows]
  for: [crate, cargo-toml, rust]
  attack: T1195.002,T1027

composite_rules:
  - id: cargo-build-hook-indexed-string-ip-analytics
    desc: Cargo build hook rebuilds strings and dials raw IP with analytics
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/scripts/build::cargo-build-script-declared
      - id: metadata/build/archive::archive-cargo-build-rs-entry
      - id: metadata/build/ecosystem::cargo-build-script-basename
      - id: objectives/anti-static/obfuscation/string/index-select::indexed-string-network-analytics
      - id: micro-behaviors/communications/http/services/analytics::rust-asn-event-property
      - id: micro-behaviors/data/buffer/transfer::source-write-all-helper-reference
