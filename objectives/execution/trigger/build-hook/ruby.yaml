defaults:
  platforms: [unix, windows]
  for: [gem, tar, ruby, pkg_info]
  attack: T1195.002

composite_rules:
  - id: rubygems-declared-extension-hook
    desc: RubyGem declares an install-time extension build hook
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/os/package-manager/hook-install::gem-extensions
      - id: metadata/package/files/rubygems::gem-extension-build-declaration

  - id: rubygems-rakefile-extension-identity-exfil
    desc: RubyGem extension hook posts host identity to decoded URL
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: rubygems-declared-extension-hook
      - id: objectives/exfiltration/stealer/system-info/identity::ruby-silent-encoded-identity-post

  - id: rubygems-extension-hook-direct-ip-beacon
    desc: RubyGem extension hook phones home to raw external IPv4 URL
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: rubygems-declared-extension-hook
      - id: micro-behaviors/communications/http/request/netlib::ruby-net-http-get-response-call
      - id: micro-behaviors/communications/ip/literal::direct-ip-http-client
      - id: micro-behaviors/communications/url/host/oob-http::url-external-ip-script

  - id: rubygems-extension-hook-covert-exfil
    desc: RubyGem extension covert screenshot or exfil
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041
    scope: outer
    all:
      - id: rubygems-declared-extension-hook
    any:
      - id: objectives/exfiltration/http/upload::silent-screenshot-http-upload
      - id: objectives/evasion/self-delete/scripts::ruby-http-exfil-then-self-delete
