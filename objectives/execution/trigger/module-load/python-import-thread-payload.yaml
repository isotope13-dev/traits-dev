# Import-time trigger for a payload chain: module-level code starts a
# background thread on `import`, and the same module downloads a remote
# script and launches it windowless. Merely importing the package (or
# running its console entry point) fires the download-and-run, with no
# function call by the user and no visible window.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1059.006,T1105

composite_rules:
  - id: import-thread-triggers-hidden-remote-script
    desc: Import-time thread runs hidden remote script
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/thread::module-level-thread-start
      - id: objectives/execution/payload/file-exec::python-download-hidden-pythonw-launch
