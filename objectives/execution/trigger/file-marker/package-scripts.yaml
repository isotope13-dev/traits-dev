defaults:
  for: [shell]
  platforms: [linux]
composite_rules:
  - id: rpm-file-gated-remote-shell
    desc: RPM scriptlet marker gates remote shell execution
    crit: hostile
    conf: 0.98
    scope: leaf
    all:
      - id: metadata/build/package/maintainer-scripts::rpm-install-scriptlet-body
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::shell-file-gated-curl-to-shell
  - id: pkgbuild-file-gated-remote-shell
    desc: PKGBUILD marker gates remote shell execution
    crit: hostile
    conf: 0.98
    scope: leaf
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::pkgbuild-build-phase-remote-shell
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::shell-file-gated-curl-to-shell
