defaults:
  platforms: [windows, unix]

composite_rules:
  - id: node-file-checked-ethereum-task
    desc: File check accompanies Ethereum lookup and hidden remote-eval task
    crit: hostile
    conf: 0.98
    attack: T1053.005,T1059.001,T1105
    scope: archive
    for: [npm, javascript, typescript, tar]
    all:
      - id: micro-behaviors/fs/path/check::js-exists-sync-call
      - id: objectives/persistence/system/scheduled-task::source-ethereum-provider-scheduled-beacon
      - id: objectives/persistence/system/scheduled-task::node-hidden-piped-powershell-task
    unless:
      - id: metadata/path/directory::test-directory-component
