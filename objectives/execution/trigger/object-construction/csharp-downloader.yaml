defaults:
  for: [csharp]
  platforms: [windows]
  attack: T1105
composite_rules:
  - id: csharp-background-github-executable
    desc: Constructor task with authenticated executable staging and launch
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/work/task::csharp-constructor-background-task
      - id: objectives/execution/staging/http::csharp-github-raw-temp-staging
      - id: objectives/execution/payload/file-exec/download/runtime::download-execute-csharp

  - id: csharp-background-github-executable-staging
    desc: Constructor task stages a GitHub executable under a single-instance mutex
    crit: hostile
    conf: 0.9
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/work/task::csharp-constructor-background-task
      - id: micro-behaviors/process/sync/mutex::dotnet-mutex-constructor
      - id: objectives/execution/staging/http::csharp-github-raw-temp-staging
