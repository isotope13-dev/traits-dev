defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable
  conf: 0.95

traits:
  - id: lnk-quote-tolerant-curl
    desc: Shortcut invokes curl
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\bc"*u"*r"*l"*(\.exe)?\s+'
  - id: lnk-quote-tolerant-remote-url
    desc: Shortcut has an HTTP URL in arguments
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)h"*t"*t"*p"*s?"*:"*/"*/"*[\w"]'
  - id: lnk-quote-tolerant-script-host
    desc: Shortcut invokes a Windows script host
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\b[cw]"*s"*c"*r"*i"*p"*t"*(\.exe)?\s+'
  - id: lnk-curl-output-to-temp-script
    desc: Curl output names a temporary script
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\s-o\s+"?%t(e)?mp%[\\/][^&;\r\n]{1,80}\.(vb[se]|js|wsf)\b'

composite_rules:
  - id: lnk-quoted-curl-script-launch
    desc: CMD shortcut downloads a temporary script and invokes Windows Script Host
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.005,T1027
    all:
      - id: micro-behaviors/process/config/target::lnk-cmd-target
      - id: lnk-quote-tolerant-curl
      - id: lnk-quote-tolerant-remote-url
      - id: lnk-quote-tolerant-script-host
      - id: lnk-curl-output-to-temp-script
