defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-roaming-batch-target
    desc: Shortcut targets a Roaming batch script
    crit: notable
    conf: 0.95
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)(^|[\\/])(Roaming|%AppData%)[\\/].+\.(bat|cmd)$'

  - id: lnk-disguised-relative-batch
    desc: Relative target disguises batch filename
    crit: notable
    conf: 0.96
    if:
      type: value
      path: lnk.relative_path
      regex: '(?i)\.(exe|com|scr)\.(bat|cmd)$'

composite_rules:
  - id: lnk-traversal-disguised-roaming-batch
    desc: Shortcut traverses to a disguised batch script in the Roaming profile
    crit: hostile
    conf: 0.98
    attack: T1036.007,T1059.003
    all:
      - id: lnk-roaming-batch-target
      - id: lnk-disguised-relative-batch
      - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
