# Shortcut targets that directly hand execution to a script-like file.
defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1204.002

traits:
- id: lnk-macos-metadata-scr-target
  desc: LNK targets SCR under macOS metadata path
  crit: suspicious
  conf: 0.98
  if:
    type: value
    path: lnk.relative_path
    regex: '(?i)(^|[\\/])__MACOSX[\\/][^\\/]+\.scr$'

composite_rules:
- id: lnk-macos-scr-execution-lure
  desc: LNK executes SCR from macOS metadata path
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/process/create/shortcut::lnk-relative-executable-target
  - id: lnk-macos-metadata-scr-target
