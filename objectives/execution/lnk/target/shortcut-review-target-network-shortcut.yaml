---
defaults:
  platforms:
  - windows
  for:
  - lnk
composite_rules:
- id: lnk-hidden-shell-policy-web-reference
  desc: Hidden shell, relaxed policy and URL clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/communications/url/scheme::lnk-http-scheme-argument
  - id: micro-behaviors/os/security/policy::lnk-relaxed-execution-policy
  - id: micro-behaviors/ui/window/state::hidden-or-minimized-window
  any:
  - id: micro-behaviors/process/argument/interpreter::powershell-in-args
  - id: micro-behaviors/process/config/target::lnk-powershell-family
  - id: micro-behaviors/process/config/target::lnk-cmd-target
  - id: micro-behaviors/process/argument/interpreter::lnk-powershell-argument-reference
