defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1204.002

composite_rules:
  - id: lnk-concatenated-climbing-exe-shortcut
    desc: Concatenated shortcuts climb to an executable
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/data/embedded/payload/header::lnk-appended-second-header
      - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
      - id: micro-behaviors/process/config/target::lnk-relative-binary-target
  - id: lnk-concatenated-climbing-temp-mz-shortcut
    desc: Concatenated shortcuts climb to Temp MZ payload
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/data/embedded/payload/header::lnk-appended-second-header
      - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
      - id: micro-behaviors/fs/path/temporary-artifact::lnk-temp-path-mz-filename
  - id: lnk-hidden-relocatable-systemdir-exe
    desc: Hidden relocatable shortcut launches system-directory EXE
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/fs/attributes/flags::lnk-header-hidden-system-attributes
      - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
      - id: micro-behaviors/fs/path/executable::lnk-target-systemdir-exe
      - id: micro-behaviors/process/config/target::lnk-relative-binary-target
  - id: lnk-hidden-traversal-roaming-binary
    desc: Hidden traversal shortcut launches Roaming binary
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/fs/attributes/flags::lnk-header-hidden-attribute
      - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
      - id: micro-behaviors/fs/path/executable::lnk-text-roaming-binary
      - id: micro-behaviors/process/config/target::lnk-relative-binary-target
  - id: lnk-traversal-roaming-image-lure-launcher
    desc: Traversal shortcut launches Roaming image-named binary
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
      - id: micro-behaviors/fs/path/executable::lnk-text-roaming-binary
      - id: micro-behaviors/process/config/target::lnk-relative-binary-target
    needs: 1
    any:
      - id: objectives/evasion/masquerade/file/lure::lnk-relative-camera-named-executable
      - id: objectives/evasion/masquerade/file/lure::lnk-relative-photo-named-executable
  - id: lnk-traversal-temp-exe-launcher
    desc: Traversal shortcut launches Temp executable
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
      - id: micro-behaviors/fs/path/temporary-artifact::lnk-relative-temp-exe
  - id: lnk-traversal-temp-extensionless-launcher
    desc: Traversal shortcut launches extensionless Temp payload
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
      - id: micro-behaviors/fs/path/temporary-artifact::lnk-target-local-temp-path
      - id: micro-behaviors/process/config/target::lnk-extensionless-target
  # Visible sibling of lnk-hidden-traversal-roaming-binary: the same relocatable
  # Roaming staging, but instead of a hidden launcher the attack completes with
  # a photo-style lure basename (IMG001, Photo1) that reads as a picture when
  # extensions are hidden. Attacker-chosen name corroborates in any:, per the
  # name-gating contract; the relocatable Roaming executable launch gates.
  - id: lnk-traversal-roaming-photo-named-launcher
    desc: Traversal shortcut launches Roaming photo-named executable
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
      - id: micro-behaviors/fs/path/executable::lnk-text-roaming-binary
      - id: micro-behaviors/process/config/target::lnk-relative-binary-target
    any:
      - id: objectives/evasion/masquerade/file/lure::lnk-relative-photo-style-exe
    needs: 1
