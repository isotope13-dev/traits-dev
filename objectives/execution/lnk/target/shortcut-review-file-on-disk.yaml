defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1204.002

composite_rules:
  - id: lnk-concatenated-climbing-exe-shortcut
    desc: Concatenated shortcuts climb to an executable
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/data/embedded/payload/header::lnk-appended-second-header
      - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
      - id: micro-behaviors/process/create/shortcut::lnk-relative-binary-target
  - id: lnk-hidden-relocatable-systemdir-exe
    desc: Hidden relocatable shortcut launches system-directory EXE
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/fs/attributes/flags::lnk-header-hidden-system-attributes
      - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
      - id: metadata/file/profile/path-reference::lnk-target-systemdir-exe
      - id: micro-behaviors/process/create/shortcut::lnk-relative-binary-target
