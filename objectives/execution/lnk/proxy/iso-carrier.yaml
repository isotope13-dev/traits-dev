defaults:
  platforms: [windows]
  for: [archive]
  attack: T1027,T1059.001,T1059.003,T1620

composite_rules:
  - id: iso-lnk-batch-obfuscated-carrier
    desc: ISO carries an LNK and obfuscated batch execution chain
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format::primary-volume-descriptor
      - id: metadata/file/format::embedded-lnk-member
      - id: metadata/file/format::embedded-batch-member
      - id: metadata/file/format::embedded-batch-obfuscation-marker
      - id: metadata/file/format::embedded-headless-conhost-command-marker
      - id: metadata/file/format::embedded-reflective-assembly-load-marker
