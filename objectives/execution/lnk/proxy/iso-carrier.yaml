defaults:
  platforms: [windows]
  for: [archive]
  attack: T1027,T1059.001,T1059.003,T1620

composite_rules:
  - id: iso-lnk-batch-obfuscated-carrier
    desc: ISO carries an LNK and obfuscated batch execution chain
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/structured::embedded-lnk-member
      - id: metadata/file/format/structured::embedded-batch-member
      - id: metadata/file/format/structured::embedded-batch-obfuscation-marker
      - id: metadata/file/format/structured::embedded-headless-conhost-command-marker
      - id: metadata/file/format/structured::embedded-reflective-assembly-load-marker

  - id: iso-lnk-rundll32-ordinal-dropper
    desc: ISO carries an LNK cmd chain that launches a DLL export by ordinal
    crit: hostile
    conf: 0.99
    attack: T1059.003,T1218.011,T1204.002
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/structured::embedded-lnk-member
      - id: metadata/file/format/structured::embedded-lnk-cmd-rundll32-ordinal

  - id: iso-lnk-version-proxy-stager
    desc: ISO LNK stages a local VERSION.DLL proxy
    crit: hostile
    conf: 0.99
    attack: T1574.002,T1204.002
    for: [all]
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-lnk-member
      - id: metadata/file/format/iso::iso-lnk-cmd-env-target
      - id: metadata/binary/symbols/version-proxy::basename-version-dll

  - id: iso-lnk-obfuscated-powershell-browser-loader
    desc: ISO LNK PowerShell target uses browser decoy
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1036.007,T1204.002
    for: [all]
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: micro-behaviors/process/create/shell/interpreter::powershell-executable-token
      - id: micro-behaviors/fs/path/application/executable::edge-executable-search-path
  # ISO that only ships a PDF-masquerade LNK which runs MSBuild against a
  # remote UNC project. Covers invoice/DANFE phishing discs that contain no
  # secondary payload members beyond the lure shortcut.
  - id: iso-pdf-lnk-msbuild-unc-dropper
    desc: ISO delivers PDF-lure LNK running remote MSBuild
    crit: hostile
    conf: 0.99
    attack: T1036.007,T1218,T1105,T1204.002
    # ISO images are typed as data (opaque volume); keep this on data so the
    # primary-volume-descriptor leg can match the outer image bytes.
    for: [data]
    scope: archive
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: objectives/evasion/masquerade/extension/double::lnk-name-pdf-double
      - id: objectives/execution/lnk/proxy::minimized-msbuild-unc-project
