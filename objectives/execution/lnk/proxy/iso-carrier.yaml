defaults:
  platforms: [windows]
  for: [archive]
  attack: T1059.003,T1218

composite_rules:
  - id: iso-lnk-batch-obfuscated-carrier
    desc: ISO carries an LNK and threaded encoded batch execution chain
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format::primary-volume-descriptor
      - id: metadata/file/format::embedded-lnk-member
      - id: metadata/file/format::embedded-batch-member
      - id: metadata/file/format::embedded-threaded-batch-encoding
