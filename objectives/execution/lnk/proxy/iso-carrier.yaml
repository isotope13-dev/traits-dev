defaults:
  platforms: [windows]
  for: [archive]
  attack: T1027,T1059.001,T1059.003,T1620

traits:
  # The companion PowerShell file is a separate ISO member from the LNK.
  # Keep this carrier marker byte-based so the full chain remains visible even
  # when the archive walker does not build a shared child-trait context.
  - id: iso-powershell-rundll32-chain
    desc: ISO PowerShell bypass/Rundll32 chain
    crit: suspicious
    conf: 0.99
    attack: T1059.001,T1218.011
    for: [archive, data]
    if:
      type: yara
      source: |
        rule iso_powershell_rundll32_chain {
          strings:
            $pvd = { 01 43 44 30 30 31 01 }
            $powershell = "powershell.exe" ascii wide nocase
            $bypass_exec = "-exec bypass" ascii wide nocase
            $bypass_ep = "-ep bypass" ascii wide nocase
            $bypass_full = "-executionpolicy bypass" ascii wide nocase
            $script = "-file" ascii wide nocase
            $ps1 = ".ps1" ascii wide nocase
            $rundll32 = "rundll32.exe" ascii wide nocase
            $ordinal = ",#" ascii wide
            $ordinal_ps = ",`#" ascii wide
          condition:
            $pvd at 0x8000 and $powershell and any of ($bypass_*) and $script and $ps1 and $rundll32 and any of ($ordinal*)
        }

composite_rules:
  - id: iso-powershell-rundll32-carrier
    desc: ISO delivers a PowerShell-to-Rundll32 dropper chain
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1218.011,T1204.002
    for: [iso]
    all:
      - id: iso-powershell-rundll32-chain
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking::archive-shortcut-member

  - id: iso-lnk-batch-obfuscated-carrier
    desc: ISO carries an LNK and obfuscated batch execution chain
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/structured::embedded-lnk-member
      - id: metadata/file/format/structured::embedded-batch-member
      - id: metadata/file/format/structured::embedded-batch-obfuscation-marker
      - id: metadata/file/format/structured::embedded-headless-conhost-command-marker
      - id: metadata/file/format/structured::embedded-reflective-assembly-load-marker

  - id: iso-lnk-rundll32-ordinal-dropper
    desc: ISO carries an LNK cmd chain that launches a DLL export by ordinal
    crit: hostile
    conf: 0.99
    attack: T1059.003,T1218.011,T1204.002
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/structured::embedded-lnk-member
      - id: metadata/file/format/structured::embedded-lnk-cmd-rundll32-ordinal

  - id: iso-lnk-rundll32-named-export-dropper
    desc: ISO carries an LNK that launches a named DLL export
    crit: hostile
    conf: 0.99
    attack: T1218.011,T1204.002
    for: [data]
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/structured::embedded-lnk-member
      - id: metadata/file/format/structured::embedded-lnk-rundll32-named-export

  - id: iso-lnk-powershell-rundll32-companion-dropper
    desc: ISO LNK bypasses PowerShell policy before a DLL export stage
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1218.011,T1204.002
    # ISO is surfaced as its own outer type by atomscan; archive scope keeps
    # this composite on the image while its legs come from child members.
    for: [iso]
    scope: archive
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/structured::embedded-lnk-member
      - id: micro-behaviors/process/create/shortcut::lnk-powershell-target
      - id: micro-behaviors/process/create/shortcut::lnk-minimized-window
      - id: objectives/command-and-control/dropper/lnk/target::powershell-argument-executionpolicy-bypass
      - id: objectives/command-and-control/dropper/lnk/target::powershell-script-file-argument
      - id: micro-behaviors/process/create/shell/script-host::rundll32-command-reference

  - id: udf-lnk-rundll32-ordinal-dropper
    desc: UDF image LNK launches a DLL export by ordinal
    crit: hostile
    conf: 0.99
    attack: T1059.003,T1218.011,T1204.002
    for: [iso]
    scope: outer
    all:
      - id: metadata/file/format/iso::udf-volume-marker
      - id: metadata/file/format/iso::udf-lnk-cmd-rundll32-ordinal

  - id: iso-lnk-version-proxy-stager
    desc: ISO LNK stages a local VERSION.DLL proxy
    crit: hostile
    conf: 0.99
    attack: T1574.002,T1204.002
    for: [iso]
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-lnk-member
      - id: metadata/file/format/iso::iso-lnk-cmd-env-target
      - id: metadata/binary/symbols/version-proxy::basename-version-dll

  - id: iso-lnk-obfuscated-powershell-browser-loader
    desc: ISO LNK PowerShell target uses browser decoy
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1036.007,T1204.002
    for: [iso]
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: micro-behaviors/process/create/shell/interpreter::powershell-executable-token
      - id: micro-behaviors/fs/path/application/executable::edge-executable-search-path
  # ISO that only ships a PDF-masquerade LNK which runs MSBuild against a
  # remote UNC project. Covers invoice/DANFE phishing discs that contain no
  # secondary payload members beyond the lure shortcut.
  - id: iso-pdf-lnk-msbuild-unc-dropper
    desc: ISO delivers PDF-lure LNK running remote MSBuild
    crit: hostile
    conf: 0.99
    attack: T1036.007,T1218,T1105,T1204.002
    # ISO images are typed as data (opaque volume); keep this on data so the
    # primary-volume-descriptor leg can match the outer image bytes.
    for: [data]
    scope: archive
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: objectives/evasion/masquerade/extension/double::lnk-name-pdf-double
      - id: objectives/execution/lnk/proxy::minimized-msbuild-unc-project
