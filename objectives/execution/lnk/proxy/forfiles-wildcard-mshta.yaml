defaults:
  for: [lnk]
  platforms: [windows]
  attack: T1218,T1027

traits:
  - id: lnk-powershell-wildcard-mshta-url
    desc: Shortcut resolves mshta wildcard and remote URL
    crit: notable
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)powershell\s+\.\s+\\[^\s]{1,80}\\msh\*e\s+https?://'
  - id: lnk-powershell-starts-remote-mshta
    desc: Starts mshta with a remote URL
    crit: notable
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\b(powershell|pwsh)(\.exe)?\s+start(-process)?\s+mshta(\.exe)?\s+["'']?https?://'

composite_rules:
  - id: lnk-forfiles-wildcard-mshta-browser-icon
    desc: Browser-icon shortcut proxies remote mshta via forfiles
    crit: hostile
    conf: 0.99
    all:
      - id: lnk-powershell-wildcard-mshta-url
      - id: objectives/execution/lnk/proxy::forfiles-target
      - id: micro-behaviors/ui/graphics/icon::lnk-edge-icon-location
      - id: micro-behaviors/communications/url/scheme::lnk-https-scheme-argument
  - id: lnk-forfiles-powershell-remote-mshta
    desc: Shortcut uses forfiles and PowerShell to start a remote HTA
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/lnk/proxy::forfiles-target
      - id: lnk-powershell-starts-remote-mshta
