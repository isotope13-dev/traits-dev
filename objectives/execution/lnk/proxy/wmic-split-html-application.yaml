defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable
  conf: 0.96
  attack: T1218.005,T1047,T1027

traits:
  - id: lnk-wmi-creates-process
    desc: Shortcut invokes WMI process creation
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\bprocess\s+call\s+create\b'
  - id: lnk-child-powershell-command
    desc: Shortcut passes a PowerShell command
    if:
      type: value
      path: lnk.arguments
      regex: '(?is)\b(powershell|pwsh)(\.exe)?\b.{0,80}\s-(c|command)\b'
  - id: lnk-concatenated-mshta-command
    desc: Reassembles the mshta command name
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)["'']ms["'']\s*\+\s*["'']hta(\.exe)?["'']'
  - id: lnk-alternate-concatenated-mshta-command
    desc: Reassembles mshta with other string splits
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)["''](m["'']\s*\+\s*["'']shta|msh["'']\s*\+\s*["'']ta)(\.exe)?["'']'

composite_rules:
  - id: lnk-wmic-split-remote-mshta
    desc: WMIC shortcut launches a remote HTA through a split PowerShell command
    crit: hostile
    conf: 0.99
    all:
      - id: wmic-target
      - id: lnk-wmi-creates-process
      - id: lnk-child-powershell-command
      - id: micro-behaviors/communications/url/scheme::lnk-web-scheme-argument
    any:
      - id: lnk-concatenated-mshta-command
      - id: lnk-alternate-concatenated-mshta-command
