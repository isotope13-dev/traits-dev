# LNK LOLBIN Target Detection (Extended)
# ATT&CK: T1218 (System Binary Proxy Execution)
#
# Detects LNK files targeting Living Off The Land Binaries (LOLBINs)
# that are commonly abused for code execution, download, or bypass.
# Supplements suspicious-targets.yaml with additional LOLBINs.
defaults:
  platforms: [windows]
  attack: "T1218"
  for: [lnk]
traits:
  # === Download/Transfer LOLBINs ===
  - id: bitsadmin-target
    desc: LNK targets bitsadmin.exe
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)bitsadmin\.exe$'
  # === Code execution LOLBINs ===
  - id: msbuild-target
    desc: LNK targets msbuild.exe
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)msbuild\.exe$'
  # MSBuild project/script argument delivered over UNC (often WebDAV-style
  # hosting). Legitimate local builds use a filesystem path; remote UNC XML
  # args are the classic LOLBIN remote-code pattern.
  - id: msbuild-unc-project-argument
    desc: LNK MSBuild args reference a UNC project
    crit: notable
    conf: 0.95
    attack: T1218,T1105
    if:
      type: value
      path: lnk.arguments
      # UNC host/share path ending in an MSBuild project/script extension.
      regex: '(?i)\\\\[^\s"''<>]{1,200}\.(xml|proj|targets)\b'
  - id: msbuild-argument
    desc: LNK arguments invoke msbuild.exe
    crit: notable
    conf: 0.95
    attack: T1127.001
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\bmsbuild(\.exe)?\b'
  - id: installutil-target
    desc: LNK targets installutil.exe
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)installutil\.exe$'
  - id: cmstp-target
    desc: LNK targets cmstp.exe
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)cmstp\.exe$'
  - id: wmic-target
    desc: LNK targets wmic.exe
    crit: suspicious
    conf: 0.85
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)wmic\.exe$'
  - id: forfiles-target
    desc: LNK targets forfiles.exe
    crit: suspicious
    conf: 0.85
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)forfiles\.exe$'
  - id: forfiles-powershell-argument
    desc: LNK forfiles arguments invoke PowerShell
    crit: suspicious
    conf: 0.92
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\bforfiles(\.exe)?\b[^\r\n]{0,200}\b(powershell(\.exe)?|pwsh(\.exe)?)\b'
  - id: forfiles-mshta-argument
    desc: LNK forfiles arguments invoke mshta
    crit: suspicious
    conf: 0.92
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\bforfiles(\.exe)?\b[^\r\n]{0,200}\bmshta(\.exe)?\b'

  - id: mshta-argument
    desc: LNK arguments invoke mshta.exe
    crit: notable
    conf: 0.95
    attack: T1218.005
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\bmshta(\.exe)?\b'
  - id: pcalua-target
    desc: 'LNK targets pcalua.exe'
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)pcalua\.exe$'
  # === Scripting engines ===
  - id: shell-target
    desc: LNK targets shell.exe (WSL)
    crit: suspicious
    conf: 0.85
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)(^|[\\/])shell\.exe$'
  - id: wsl-target
    desc: LNK targets wsl.exe
    crit: suspicious
    conf: 0.85
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)wsl\.exe$'
  # === .NET execution ===
  - id: csc-target
    desc: LNK targets csc.exe (C# compiler)
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)csc\.exe$'
  - id: vbc-target
    desc: LNK targets vbc.exe (VB compiler)
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)vbc\.exe$'
  - id: jsc-target
    desc: LNK targets jsc.exe (JScript compiler)
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)jsc\.exe$'
  # Map an IP-hosted WebDAV resource, then hand an SCT scriptlet on that
  # mapped drive to regsvr32/scrobj. Generic UNC rules do not cover this form.
  - id: lnk-map-public-webdav-drive
    desc: LNK maps HTTP IP to drive
    crit: suspicious
    conf: 0.97
    attack: T1105,T1021.002
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\bnet\s+use\s+[A-Z]:\s+https?://\d{1,3}(\.\d{1,3}){3}'
  - id: lnk-regsvr32-mapped-scriptlet
    desc: LNK regsvr32 executes mapped SCT scriptlet
    crit: suspicious
    conf: 0.99
    attack: T1218.010,T1059.003
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\bregsvr32\b.{0,80}\.sct.{0,20}scrobj\.dll'
composite_rules:
  # Helper: code execution LOLBINs
  - id: execution-lolbin
    desc: LNK targets execution LOLBIN
    crit: suspicious
    conf: 0.9
    any:
      - id: msbuild-target
      - id: installutil-target
      - id: cmstp-target
      - id: forfiles-target
      - id: pcalua-target
  # Helper: .NET compilers
  - id: dotnet-compiler
    desc: LNK targets .NET compiler
    crit: suspicious
    conf: 0.9
    any:
      - id: csc-target
      - id: vbc-target
      - id: jsc-target
  # Helper: WSL execution
  - id: wsl-execution
    desc: LNK targets WSL
    crit: suspicious
    conf: 0.85
    any:
      - id: shell-target
      - id: wsl-target
  # High confidence: hidden window + LOLBIN
  - id: hidden-execution-lolbin
    desc: LNK runs execution LOLBIN with hidden window
    crit: hostile
    conf: 0.95
    all:
      - id: execution-lolbin
      - id: micro-behaviors/ui/window/state::lnk-hidden-window
  # Minimized MSBuild that pulls a remote UNC project/script is a classic
  # ISO/LNK phishing LOLBIN chain (DANFE/invoice lures). Distinct from the
  # hidden-window composite above.
  - id: minimized-msbuild-unc-project
    desc: Minimized LNK runs MSBuild on a UNC project
    crit: hostile
    conf: 0.98
    attack: T1218,T1105,T1564.003,T1204.002
    all:
      - id: msbuild-target
      - id: msbuild-unc-project-argument
      - id: "micro-behaviors/ui/window/state::lnk-minimized-inactive-window"
  - id: forfiles-command-proxy
    desc: LNK uses forfiles /c command proxy
    crit: hostile
    conf: 0.96
    attack: T1202
    all:
      - id: forfiles-target
      - id: micro-behaviors/process/create/shell/command-flag::lnk-command-c-argument
  - id: headless-conhost-command-proxy
    desc: Headless conhost shortcut proxies cmd execution
    crit: hostile
    conf: 0.96
    attack: T1202
    all:
      - id: micro-behaviors/process/create/shortcut::lnk-conhost-target
      - id: micro-behaviors/process/create/shell/command-flag::lnk-conhost-headless-cmd
      - id: micro-behaviors/process/create/shell/command-flag::lnk-command-c-argument
  - id: headless-conhost-batch-carrier
    desc: Headless conhost shortcut launches a batch carrier
    crit: hostile
    conf: 0.97
    attack: T1059.003
    all:
      - id: micro-behaviors/process/create/shortcut::lnk-conhost-target
      - id: micro-behaviors/process/create/shell/command-flag::lnk-conhost-headless-cmd
      - id: micro-behaviors/process/create/shell/command-flag::lnk-command-c-argument
      - id: micro-behaviors/process/argument/file::lnk-batch-file-argument
  - id: forfiles-script-proxy
    desc: LNK uses forfiles to proxy script execution
    crit: hostile
    conf: 0.97
    attack: T1202
    all:
      - id: forfiles-command-proxy
    any:
      - id: forfiles-powershell-argument
      - id: forfiles-mshta-argument
  - id: pcalua-mshta-proxy-execution
    desc: LNK uses pcalua to proxy mshta execution
    crit: hostile
    conf: 0.99
    attack: T1218.005,T1218
    all:
      - id: pcalua-target
      - id: mshta-argument
  - id: powershell-msbuild-proxy-execution
    desc: LNK uses stealth PowerShell to proxy MSBuild execution
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1127.001,T1218
    all:
      - id: micro-behaviors/process/create/shortcut::lnk-powershell-stealth-window
      - id: msbuild-argument
  - id: hidden-bitsadmin
    desc: LNK runs bitsadmin with hidden window
    crit: hostile
    conf: 0.95
    all:
      - id: bitsadmin-target
      - id: micro-behaviors/ui/window/state::lnk-hidden-window
  - id: minimized-webdav-scriptlet-shortcut
    desc: Minimized IP WebDAV scriptlet execution
    crit: hostile
    conf: 0.995
    attack: T1105,T1204.002,T1218.010,T1059.003,T1564.003
    all:
      - id: micro-behaviors/process/create/shortcut::lnk-cmd-target
      - id: micro-behaviors/ui/window/state::lnk-minimized-inactive-window
      - id: lnk-map-public-webdav-drive
      - id: lnk-regsvr32-mapped-scriptlet
  - id: lnk-command-proxy-download-chain
    desc: LNK proxies command execution after download
    crit: hostile
    conf: 0.99
    attack: T1105,T1218
    all:
      - id: micro-behaviors/process/create/shell/command-flag::lnk-command-c-argument
      - id: micro-behaviors/communications/http/client/reference::lnk-curl-command-reference
      - id: micro-behaviors/process/create/shortcut::lnk-rundll32-target
  - id: lnk-command-proxy-bitsadmin-msiexec
    desc: LNK proxies BITSAdmin download and MSI install
    crit: hostile
    conf: 0.99
    attack: T1105,T1218.007
    all:
      - id: micro-behaviors/process/create/shell/command-flag::lnk-command-c-argument
      - id: micro-behaviors/communications/http/download/manager::lnk-bitsadmin-transfer-download
      - id: micro-behaviors/process/create/installer::lnk-msiexec-quiet-install
