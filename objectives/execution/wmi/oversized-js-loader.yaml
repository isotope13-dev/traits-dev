# Oversized WSH loaders often put thousands of padding lines between WMI setup,
# hidden-window configuration, and Create(). This composite uses independent AST
# and text facts rather than a fragile short-distance regex.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027,T1047,T1059.007,T1564.003
  mbc: E1043

composite_rules:
  - id: wsh-concatenated-hidden-wmi-command
    desc: WSH constructs a command for hidden WMI execution
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/source/string::massive-string-concatenation
      - id: micro-behaviors/os/wmi/query::wmi-process-startup-instance
      - id: micro-behaviors/process/create/flags::show-window-hidden-assignment

  - id: wsh-base64-shard-hidden-wmi-loader
    desc: Base64-sharded WSH loader launches a hidden WMI process
    crit: hostile
    conf: 0.995
    all:
      - id: wsh-concatenated-hidden-wmi-command
      - id: objectives/anti-static/obfuscation/multi-layer::js-base64-shard-array

  - id: wsh-opaque-hidden-wmi-loader
    desc: Opaque ActiveX stage launches a hidden WMI process
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/anti-static/obfuscation/eval/loader::js-opaque-activex-stage
      - id: micro-behaviors/process/create/hidden::wmi-hidden-four-argument-process-create

  - id: wsh-activex-hidden-wmi-loader
    desc: ActiveX WSH loader launches a constructed hidden WMI command
    crit: hostile
    conf: 0.99
    all:
      - id: wsh-concatenated-hidden-wmi-command
      - id: micro-behaviors/os/com/automation::wscript-shell-activex-constructor
    unless:
      - id: wsh-padding-obfuscated-hidden-wmi-loader

  - id: wsh-padding-obfuscated-hidden-wmi-loader
    desc: Heavily padded WSH loader launches a hidden WMI command
    crit: hostile
    conf: 0.99
    all:
      - id: wsh-concatenated-hidden-wmi-command
      - id: metadata/file/data-blob::high-byte-script-text
      - id: metadata/file/line::multiple-lines-over-1000-chars

  - id: wsh-decoded-dispatch-hidden-wmi-loader
    desc: Decoded API-name dispatch drives a hidden WMI process launch
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/control-flow/dispatch::js-function-derived-computed-call
      - id: micro-behaviors/data/decode/custom::js-alphabet-coded-decoder
      - id: micro-behaviors/process/create/hidden::wmi-hidden-four-argument-process-create
