defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1047
traits:
  - id: get-wmiobject-remote-process
    desc: Remote Win32_Process WMI query
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bGet-WmiObject\b[^\n]{0,160}\bWin32_Process\b[^\n]{0,160}[ \t]-ComputerName\b'
  - id: wmi-computername-target
    desc: WMI remote computer target
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)[ \t]-ComputerName[ \t]+\S{1,120}'
composite_rules:
  # Win32_Process.Create aimed at another machine. This is how an attacker moves
  # laterally (T1047) and equally how an administrator runs a command on a
  # server: the cmdlet, the -ComputerName parameter and the remote spawn are all
  # documented Windows management. Suspicious, not hostile -- an inventory or
  # collection script that gathers output from remote hosts looks exactly like
  # this. The hostile call needs attacker context, which the composite below and
  # the admin-share payload composites supply.
  - id: powershell-wmi-remote-process-spawn
    desc: Creates a process on a remote host via WMI
    crit: suspicious
    conf: 0.97
    any:
      - id: micro-behaviors/os/wmi/manipulate::create-process-wmi-cmdlet
      - id: micro-behaviors/os/wmi/manipulate::create-process-cim-cmdlet
    all:
      - id: wmi-computername-target
    near_lines: 1

  # Remote WMI execution of a base64 command line. Admin tooling passes a
  # readable command; encoding it is how an operator hides the payload from the
  # remote host's command-line logging, and it is the standard shape of
  # WMI-driven lateral movement frameworks.
  - id: powershell-wmi-remote-encoded-command-spawn
    desc: Runs an encoded command on a remote host via WMI
    crit: hostile
    conf: 0.96
    attack: T1047,T1059.001,T1027
    all:
      - id: powershell-wmi-remote-process-spawn
    any:
      - id: micro-behaviors/process/create/hidden::encodedcommand-invocation-raw
      - id: micro-behaviors/process/create/hidden::encodedcommand-flag-raw
