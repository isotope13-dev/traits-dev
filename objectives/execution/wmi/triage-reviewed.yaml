defaults:
  platforms:
  - windows
  for:
  - html
composite_rules:
- id: hta-registry-cleanup-hidden-encoded-command
  desc: HTA combines registry substring cleanup with hidden WMI launch
  crit: suspicious
  conf: 0.98
  attack: T1027,T1047,T1059.001,T1564.003
  all:
  - id: metadata/file/format/markup::hta-application-element
  - id: objectives/anti-static/obfuscation/string/delimiter::registry-encoded-command-substring-cleanup
  - id: micro-behaviors/process/create/exec::wmi-hidden-startup-create-sequence

# An HTA that creates a hidden WMI process while rebuilding its command
# strings through a split/join delimiter and staging through WScript.Shell
# is a concealed execution chain: the hidden Win32_Process.Create with a
# zeroed startup configuration is the execution core, WScript.Shell is the
# staging shell, and the split/join cleanup shows the launched strings are
# deliberately fragmented (literals such as powershell, winmgmts and
# Win32_Process are split across the delimiter, which is why the plain
# powershell/moniker legs of the downloader-gated HTA loaders stay silent
# here). Benign HTA administration keeps launched command lines readable;
# delimiter-stripped reconstruction beside a hidden process launch has no
# legitimate use in this combination.
- id: hta-obfuscated-staged-hidden-wmi-launch
  desc: Obfuscated HTA staged hidden WMI launch
  crit: hostile
  conf: 0.97
  attack: T1027.002,T1047,T1059.007,T1564.003
  mbc: B0032,E1043
  all:
  - id: metadata/file/format/markup::hta-application-element
  - id: micro-behaviors/process/create/hidden::wmi-hidden-four-argument-process-create
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: micro-behaviors/data/string/replace::raw-split-join-empty
