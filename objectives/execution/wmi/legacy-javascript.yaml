# WMI process creation is the required execution technique. These rules retain
# obfuscation, HTTP and hidden-window context without asserting a payload handoff.
defaults:
  platforms: [windows]
  for: [javascript]

traits:
  - id: afcrk-split-powershell-launch
    desc: AFcrk-split PowerShell launch command
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: powAFcrkFAbmFdInkerAFcrkFAbmFdInksh
  - id: afcrk-split-frombase64string
    desc: AFcrk-split FromBase64String call
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: se6AFcrkFAbmFdInk4s
  - id: afcrk-split-iex
    desc: AFcrk-split PowerShell iex call
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: ieAFcrkFAbmFdInkx $
  - id: afcrk-split-replace-token
    desc: AFcrk-split replacement token
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: "'fAFcrkFAbmFdInk#'"
  - id: gcfombg-split-powershell-launch
    desc: gcFombg-split PowerShell launch command
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: pogcFombgkSgmerAwegcFombgkSgmerAr
  - id: gcfombg-split-copyitem
    desc: gcFombg-split Copy-Item persistence
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: CgcFombgkSgmerAopygcFombgk
  - id: gcfombg-split-replace-token
    desc: gcFombg-split replacement token
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: fgcFombgkSgmerA#

composite_rules:
  - id: unicode-obfuscated-wsh-wmi-stage
    desc: Unicode-obfuscated WSH WMI process execution
    # The canonical download/execute and encoded-WMI composites provide the
    # hostile verdict.  This overlapping family summary remains suspicious.
    crit: suspicious
    conf: 0.99
    attack: "T1027.002,T1047,T1059.001,T1059.007,T1564.003"
    mbc: E1043
    all:
      - id: micro-behaviors/process/create/exec::js-hidden-process-create-sequence
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: objectives/anti-static/obfuscation/steganography/unicode::js-nonascii-split-join-cleanup
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text
      - id: micro-behaviors/os/env/modify::wsh-environment-item-assignment

  - id: wsh-hidden-base64-powershell-wmi-loader
    desc: WSH hidden Base64 PowerShell WMI execution
    crit: hostile
    conf: 0.98
    attack: T1059.007, T1059.001, T1047
    all:
      - id: objectives/anti-static/obfuscation/string/array::js-afcrk-repeated-marker-token
      - id: micro-behaviors/os/wmi/query::wmi-moniker-string
      - id: micro-behaviors/process/create/flags::show-window-hidden-assignment
      - id: afcrk-split-powershell-launch
      - id: afcrk-split-frombase64string
    any:
      - id: afcrk-split-iex
      - id: afcrk-split-replace-token
      - id: micro-behaviors/os/wmi/query::process-startup-spawninstance-symbol
  - id: wsh-hidden-gcfombg-powershell-wmi-loader
    desc: WSH hidden obfuscated PowerShell WMI execution
    crit: hostile
    conf: 0.98
    attack: T1059.007, T1059.001, T1047
    all:
      - id: objectives/anti-static/obfuscation/string/array::js-gcfombg-repeated-marker-token
      - id: micro-behaviors/process/create/hidden::wmi-hidden-startup-process
      - id: gcfombg-split-powershell-launch
      - id: gcfombg-split-copyitem
    any:
      - id: gcfombg-split-replace-token
      - id: objectives/execution/wmi::win32-process-fragmented
  - id: obfuscated-wsh-hidden-wmi-startup
    desc: Obfuscated WSH hidden WMI process execution
    crit: hostile
    conf: 0.96
    attack: "T1059.007,T1047,T1564.003"
    all:
      - id: micro-behaviors/process/create/hidden::wmi-hidden-startup-process
      - id: objectives/anti-static/obfuscation/string/array::js-long-marker-split-join-cleanup
      - id: micro-behaviors/os/com/automation::activex-constructor-call
  - id: env-staged-hidden-wmi-launcher
    desc: Environment-staged hidden WMI execution
    crit: hostile
    conf: 0.98
    attack: "T1059.007,T1059.001,T1047,T1564.003"
    all:
      - id: micro-behaviors/process/create/hidden::wmi-hidden-startup-process
      - id: micro-behaviors/data/string/replace::repeated-split-join-removal
      - id: micro-behaviors/os/com/automation::activex-constructor-call
      - id: micro-behaviors/os/env/read::env-item-random-variable
  - id: js-wmi-scriptpath-chunked-loader
    desc: Obfuscated WSH WMI execution reads script path
    crit: hostile
    conf: 0.99
    attack: "T1027.002,T1047,T1059.007,T1564.003"
    all:
      - id: micro-behaviors/data/source/string::js-string-append-cluster
      - id: micro-behaviors/process/create/hidden::wmi-hidden-startup-process
      - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
      - id: micro-behaviors/os/com/automation::activex-object-variable-progid
  - id: obfuscated-wsh-wmi-powershell-stager
    desc: Obfuscated WSH WMI PowerShell execution
    crit: hostile
    conf: 0.99
    attack: "T1027.002,T1047,T1059.001,T1059.007,T1564.003"
    mbc: "B0032,E1043"
    all:
      - id: micro-behaviors/process/create/exec::wmi-hidden-variable-process-create
      # Large JScript loaders can exceed the parser's bounded state budget,
      # so the neutral ActiveXObject atom uses a text fallback when call facts
      # are unavailable even though the constructor is present.
      - id: micro-behaviors/os/com/automation::activex-constructor-call
      - id: micro-behaviors/os/env/modify::wsh-environment-item-assignment
      - id: micro-behaviors/data/string/replace::repeated-split-join-removal

  - id: wsh-wmi-remote-inmemory-assembly-loader
    desc: Hidden WMI fetches and runs Unicode-obfuscated .NET code
    crit: hostile
    conf: 0.99
    attack: "T1027.002,T1047,T1059.001,T1059.007,T1105,T1140,T1564.003,T1620"
    mbc: "B0030,B0032,E1043"
    all:
      - id: objectives/execution/wmi::wmi-staged-hidden-powershell-process
      - id: micro-behaviors/communications/http/client/webclient::unicode-delimited-webclient-download
      - id: objectives/anti-static/obfuscation/steganography/unicode::js-unicode-delimited-appdomain-fragment
      - id: objectives/anti-static/obfuscation/steganography/unicode::js-unicode-delimited-base64-fragment
    near_bytes: 65536

  - id: unicode-httpwebrequest-wmi-reflective-loader
    desc: Hidden WMI launches a Unicode-obfuscated remote .NET process
    crit: hostile
    conf: 0.995
    attack: "T1027.002,T1047,T1059.001,T1059.007,T1105,T1140,T1564.003,T1620"
    mbc: "B0030,B0032,E1043"
    all:
      - id: micro-behaviors/communications/http/client/managed::unicode-delimited-httpwebrequest-download
      - id: objectives/anti-static/obfuscation/steganography/unicode::unicode-delimited-managed-loader-tokens
      - id: micro-behaviors/process/create/hidden::wmi-hidden-four-argument-process-create
      - id: micro-behaviors/os/com/automation::wscript-shell-activex-constructor

  - id: hta-remote-wmi-powershell-loader
    desc: HTA downloads and starts hidden WMI PowerShell
    crit: hostile
    conf: 0.99
    attack: "T1041,T1059.001,T1059.007,T1047,T1564.003"
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: micro-behaviors/process/create/exec::js-hidden-process-create-sequence
      - id: micro-behaviors/communications/http/url/domain::workers-dev-url
      - id: micro-behaviors/os/env/modify::wsh-environment-item-assignment
    any:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text
  - id: remote-wsh-wmi-encoded-loader
    desc: Remote WSH WMI encoded process execution
    crit: hostile
    conf: 0.99
    attack: "T1027,T1047,T1059.001,T1059.007,T1105,T1564.003"
    mbc: "B0030,B0032,E1043"
    all:
      - id: micro-behaviors/process/create/exec::js-hidden-process-create-sequence
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/communications/http/url/domain::workers-dev-url
      - id: micro-behaviors/os/env/modify::wsh-environment-item-assignment
      - id: micro-behaviors/data/source/string::massive-string-concatenation
      - id: objectives/anti-static/obfuscation/string/array::js-long-delimiter-split-join-cleanup

  - id: padded-wmi-unicode-httpwebrequest-dropper
    desc: Padded WMI execution uses HttpWebRequest
    crit: hostile
    conf: 0.99
    attack: "T1027,T1047,T1059.007,T1105,T1564.003"
    mbc: "B0030,E1043"
    all:
      - id: objectives/execution/wmi::wsh-padding-obfuscated-hidden-wmi-loader
      - id: micro-behaviors/communications/http/client/managed::unicode-delimited-httpwebrequest-download

  - id: unicode-hidden-wmi-execmethod-powershell-downloader
    desc: Unicode-hidden WMI ExecMethod PowerShell downloader
    crit: hostile
    conf: 0.99
    attack: "T1027,T1047,T1059.001,T1059.007,T1564.003"
    mbc: E1043
    all:
      - id: micro-behaviors/process/create/shell/encoded::unicode-delimited-powershell-command
      - id: micro-behaviors/process/create/hidden::wmi-hidden-process-startup
      - id: micro-behaviors/os/wmi/query::wmi-execmethod-invocation
      - id: micro-behaviors/os/com/automation::wscript-shell-literal

  - id: obfuscated-wsh-cyclic-xor-wmi-process-loader
    desc: Obfuscated WSH cyclic-XOR payload with WMI process creation
    crit: hostile
    conf: 0.97
    attack: "T1027,T1047,T1059.005"
    all:
      - id: objectives/anti-static/obfuscation/multi-layer::js-cyclic-xor-key-decrypt
      - id: micro-behaviors/os/wmi/query::wmi-process-create-call
      - id: micro-behaviors/os/com/automation::activexobject-reference
    unless:
      - id: metadata/package/testing/
