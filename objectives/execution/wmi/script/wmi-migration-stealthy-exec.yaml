defaults:
  platforms: [windows]
  conf: 1.0
composite_rules:
  - id: wmi-service-hijack-lolbin
    desc: WMI service change and ScriptRunner execution
    crit: suspicious
    attack: "T1543.003"
    all:
      - id: micro-behaviors/os/service/configure::modify-service-wmi
      - id: objectives/execution/lolbin/os::scriptrunner-execution
  - id: wmi-service-hijack-share
    desc: WMI service change near network share
    crit: suspicious
    attack: "T1543.003"
    # Proximity does not establish that the share is the service path.
    near_lines: 4
    all:
      - id: micro-behaviors/os/service/configure::modify-service-wmi
      - id: micro-behaviors/network/share::unc-path-reference
  - id: wmi-service-hijack
    desc: WMI service change with execution clues
    crit: suspicious
    any:
      - id: objectives/execution/wmi/script::wmi-service-hijack-lolbin
      - id: objectives/execution/wmi/script::wmi-service-hijack-share
  - id: stealthy-wmi-exec
    desc: WMI service change and start with policy clues
    crit: suspicious
    attack: "T1047"
    all:
      - id: objectives/execution/wmi/script::wmi-service-hijack
      - id: micro-behaviors/os/service/start::start-service-wmi
    any:
      - id: "micro-behaviors/os/registry/policy/reference::low-risk-file-types-policy-value"
      - id: "micro-behaviors/os/registry/policy/reference::insecure-guest-auth-policy-value"
