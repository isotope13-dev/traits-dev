defaults:
  for: [documents]
  platforms: [windows]

composite_rules:
  - id: office-vba-wmi-powershell-stager
    desc: Office VBA WMI PowerShell stager
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/os/com/instantiation::word-userform-com-object-clues
      - id: micro-behaviors/os/application/hook/event::autoopen-entrypoint
      - id: micro-behaviors/process/deploy/interpreter-command::powershell-encoded-flag-reference
      - id: objectives/anti-static/obfuscation/wmi::wmi-process-startup-obfuscated
      - id: objectives/anti-static/obfuscation/document/macro::office-vba-qwuhd-stager
