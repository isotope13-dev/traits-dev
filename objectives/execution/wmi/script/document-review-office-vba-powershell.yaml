defaults:
  for: [documents]
  platforms: [windows]

composite_rules:
  - id: office-vba-wmi-powershell-stager
    desc: Office VBA WMI PowerShell stager
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/file/profile/macro::word-userform-com-object-clues
      - id: micro-behaviors/os/application/hook::autoopen-entrypoint
      - id: metadata/file/profile/command-reference::powershell-encoded-flag-junked
      - id: objectives/anti-static/obfuscation/wmi::wmi-process-startup-obfuscated
      - id: objectives/anti-static/obfuscation/document/macro::office-vba-qwuhd-stager
