defaults:
  platforms: [windows]
  for: [documents, vbs, ooxml, oledoc]
  attack: T1204.002,T1047,T1105,T1059.003


composite_rules:
  - id: office-vba-wmi-curl-download-execute
    desc: Office macro WMI curl download-and-run
    crit: hostile
    conf: 0.99
    scope: outer
    all:
      - id: micro-behaviors/os/application/hook/event::document-open-handler
      - id: micro-behaviors/os/wmi/query::wmi-moniker-string
      - id: micro-behaviors/process/deploy/file-exec/command::curl-temp-output-and-execute
      - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url
      - id: micro-behaviors/os/wmi/query::win32-process-class-fragment
      - id: metadata/lang/source/syntax/call/member::proc-create-method-call
