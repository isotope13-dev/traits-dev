defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1047
composite_rules:
  # Remote WMI execution of a base64 command line. Admin tooling passes a
  # readable command; encoding it is how an operator hides the payload from the
  # remote host's command-line logging, and it is the standard shape of
  # WMI-driven lateral movement frameworks.
  - id: powershell-wmi-remote-encoded-command-spawn
    desc: Runs an encoded command on a remote host via WMI
    crit: hostile
    conf: 0.96
    attack: T1047,T1059.001,T1027
    all:
      - id: objectives/lateral-movement/smb::powershell-wmi-remote-process-spawn
    any:
      - id: metadata/lang/source/syntax/argument::encodedcommand-option-reference

  - id: powershell-wmi-create-hidden-encoded-command
    desc: Spawns a hidden encoded PowerShell command via WMI
    crit: hostile
    conf: 0.98
    for: [powershell]
    attack: T1047,T1059.001,T1027,T1564.003
    all:
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
      - id: metadata/lang/source/syntax/argument::powershell-encodedcommand-or-ec-option
      - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
    any:
      - id: micro-behaviors/process/create/wmi::create-process-wmi-cmdlet
      - id: micro-behaviors/process/create/wmi::create-process-cim-cmdlet
