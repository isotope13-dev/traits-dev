defaults:
  platforms: [windows]
  for: [html, text, data]

composite_rules:
- id: encoded-url-hidden-wmi-environment
  desc: Encoded URL and hidden WMI environment clues
  crit: hostile
  conf: 0.99
  attack: T1027,T1047,T1105,T1564.003
  all:
    - id: micro-behaviors/os/com/instantiation::wscript-shell-activex-constructor
    - id: micro-behaviors/process/create/hidden::wmi-hidden-startup-create-sequence
    - id: micro-behaviors/os/env/read/variable::user-environment-call
  any:
    - id: micro-behaviors/communications/url/encoded::encoded-http-url
    - id: metadata/file/encoding/url::utf16le-b64-https-prefix
  for:
    - html
    - text
