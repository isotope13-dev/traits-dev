defaults:
  platforms: [windows]
  for: [html]
  crit: hostile
  conf: 0.98
  attack: T1047,T1218.005,T1564.003

composite_rules:
  - id: hta-concealed-wmi-execmethod-dropper
    desc: Hidden HTA launches process via WMI ExecMethod
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: micro-behaviors/ui/window/control::hta-concealed-window
      - id: micro-behaviors/os/wmi/query::win32-process-query
      - id: micro-behaviors/os/wmi/query::wmi-execmethod-invocation
      - id: micro-behaviors/os/wmi/query::process-startup-spawninstance-text
