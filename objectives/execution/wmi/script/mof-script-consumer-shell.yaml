# MOF source that registers a permanent subscription whose consumer runs
# WScript.Shell: once compiled (by mofcomp or the autocompile folder) WMI
# runs the command as LocalSystem each time the filter fires.
defaults:
  platforms: [windows]
  for: [text, vbs]
  attack: T1546.003,T1047

composite_rules:
  - id: mof-subscription-consumer-runs-shell
    desc: MOF subscription consumer runs shell commands
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/wmi/event::mof-event-filter-instance
      - id: micro-behaviors/os/wmi/event::mof-script-consumer-instance
      - id: micro-behaviors/os/wmi/event::mof-filter-consumer-binding-instance
    any:
      - id: micro-behaviors/os/com/instantiation::wscript-shell-activex-constructor
      - id: well-known/lib/runtime/scripted/windows-script-host::wscript-shell-text
