defaults:
  platforms: [windows]
  for: [html, text, data]

composite_rules:
- id: offscreen-hidden-wmi-environment
  desc: Off-screen hidden WMI environment clues
  crit: suspicious
  conf: 0.98
  attack: T1027.002,T1047,T1059.001,T1564.003
  all:
    - id: micro-behaviors/os/com/instantiation::wscript-shell-activex-constructor
    - id: micro-behaviors/process/create/hidden::wmi-hidden-startup-create-sequence
    - id: micro-behaviors/ui/window/control::script-window-zero-negative-coordinates
    - id: micro-behaviors/os/env/read/variable::user-environment-call
    - id: objectives/anti-static/obfuscation/string/delimiter::registry-encoded-command-substring-cleanup
  any:
    - id: micro-behaviors/data/property/assign::script-item-assignment
  for:
    - html
