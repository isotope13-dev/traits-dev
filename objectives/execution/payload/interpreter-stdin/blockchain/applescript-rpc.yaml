# Co-located RPC/hex processing and a curl-to-osascript sink distinguish
# this loader from wallet balance queries. No contract or provider is fixed.
defaults:
  for: [applescript]
  platforms: [macos]
  attack: T1102,T1059.002
composite_rules:
  - id: rpc-hex-remote-applescript-pipe
    desc: RPC hex decoding with remote AppleScript pipe
    crit: hostile
    conf: 0.97
    near_lines: 24
    all:
      - id: micro-behaviors/communications/blockchain/ethereum::evm-eth-call-method
      - id: micro-behaviors/data/decode/hex::applescript-xxd-hex-command-text
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-osascript
