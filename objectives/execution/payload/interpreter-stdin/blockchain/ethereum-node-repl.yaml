defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  # Separate activation sink from the in-process eval finding. No wallet,
  # provider, stage path, XOR key, custom header, or lifecycle hook is needed.
  - id: ethereum-xor-stage-detached-repl-stdin
    desc: Ethereum XOR staging accompanies detached REPL stdin execution
    crit: hostile
    conf: 0.97
    attack: T1105,T1059.007
    all:
      - id: objectives/execution/payload/script-eval/blockchain::ethereum-derived-http-xor-inline-eval
      - id: micro-behaviors/process/deploy/script-eval/input::awaited-source-eval-helper-reuse
      - id: micro-behaviors/process/deploy/interpreter-stdin/input::detached-node-repl-stdin-eof-bypass
