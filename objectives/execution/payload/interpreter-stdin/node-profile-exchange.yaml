defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1105,T1059.004,T1082
composite_rules:
  # Host profiling alongside a response-to-shell command is unusual but is
  # also possible in provisioning tools. Keep the general technique suspicious.
  - id: node-host-profile-shell-response
    desc: Host profiling with curl-to-shell execution
    crit: suspicious
    conf: 0.98
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin::node-concatenated-curl-shell-command
      - id: metadata/import/builtin::require-child-process
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
      - id: micro-behaviors/data/encode/base64::tostring-base64
      - id: micro-behaviors/communications/socket/connect/tcp::node-net-options-connect

  # Package scope establishes co-occurrence, not which script the hook runs.
  - id: npm-preinstall-probed-profile-shell-loader
    desc: Package has preinstall hook and profiled shell loader
    crit: hostile
    conf: 0.99
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: package
    size_max: 65536
    all:
      - id: node-host-profile-shell-response
      - id: metadata/package/scripts/command::preinstall-runs-node-local-script
