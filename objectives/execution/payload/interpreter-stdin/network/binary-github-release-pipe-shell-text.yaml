defaults:
  platforms:
    - unix
    - windows
  for:
    - python


composite_rules:
  - id: binary-github-release-pipe-shell-text
    desc: Binary GitHub release pipe-to-shell text
    crit: suspicious
    conf: 0.96
    for:
      - elf
      - macho
      - pe
      - binaries
    scope: file
    near_bytes: 2048
    all:
      - id: metadata/lang/source/syntax/command/download::curl-pipe-shell-text
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/communications/url/external/github::github-release-url-pipe-shell
    unless:
  # A release-tooling binary (a static-site generator, a CLI with a `--help`
  # install section) carries its own cargo-dist one-liner as documentation
  # text; nothing in the binary runs it.
      - id: metadata/lang/source/syntax/command/download::cargo-dist-installer-oneliner-text
