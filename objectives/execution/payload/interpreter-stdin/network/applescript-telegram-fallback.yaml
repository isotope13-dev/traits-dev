defaults:
  platforms: [macos]
  for: [applescript]
traits:
  - id: applescript-constructed-curl-osascript-pipe
    desc: AppleScript builds curl to osascript command
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?s)"curl\s[^\"]{0,180}"\s*&.{0,500}"\s*\|\s*osascript"'
composite_rules:
  - id: telegram-fallback-curl-osascript-stage
    desc: Telegram fallback and remote AppleScript execution
    crit: hostile
    conf: 0.97
    attack: T1102.001,T1059.002,T1105
    all:
      - id: applescript-constructed-curl-osascript-pipe
      - id: objectives/command-and-control/channel/deaddrop/telegram::telegram-deaddrop
