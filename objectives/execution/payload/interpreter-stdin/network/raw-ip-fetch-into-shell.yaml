# A download from a raw IPv4 address handed straight to a shell: piped, given
# to `sh -c "$(...)"`, or eval'd. Installers name their vendor's host; a bare
# IP feeding a shell is a dropper wherever it is found.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1105,T1059.004

composite_rules:
  - id: raw-ip-fetch-into-shell
    desc: Raw-IP download runs as shell code
    crit: hostile
    conf: 0.96
    near_lines: 1
    all:
      - id: micro-behaviors/communications/url/host/http::downloader-raw-ipv4-host
    any:
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::raw-ip-curl-shell-pipeline
      - id: micro-behaviors/process/create/shell/command-mode::shell-c-command-substitution-fetch
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval-fetch-substitution
