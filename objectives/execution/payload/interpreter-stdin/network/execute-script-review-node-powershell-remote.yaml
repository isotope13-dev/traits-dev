defaults:
  platforms: [windows, linux, macos]
  for: [javascript, typescript]
  attack: T1059.004,T1105
  mbc: E1105


composite_rules:
  # Node hands a downloaded script to /bin/sh through exec or execSync. The
  # same chain is a classic npm dropper and a recognized CI bootstrap pattern
  # (upstream build tasks pipe vendor setup gists into bash), so the generic
  # string form stays suspicious; hostile requires a hostile destination or a
  # separate elevation leg (see node-curl-pipe-shell-exec and siblings).
  - id: node-exec-curl-pipe-remote-shell
    desc: Node exec pipes remote curl to shell
    crit: suspicious
    conf: 0.97
    near_bytes: 512
    all:
      - id: micro-behaviors/process/create/shell/pipeline::js-exec-curl-pipe-shell-literal
    any:
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
