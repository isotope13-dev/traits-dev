defaults:
  platforms:
    - windows
    - linux
    - macos
  for:
    - shell
    - python
    - javascript
    - ruby
    - perl
    - applescript
traits:
  - id: wget-pipe-python
    desc: wget output piped directly to Python stdin
    crit: suspicious
    conf: 0.75
    attack: T1059.006
    if:
      type: text
      regex: (?m)^[ \t]*wget\b[^\n|]{0,200}\|[ \t]*python3?[ \t]*(-[ \t]*)?($|[;&|])
    not:
      - substr: GET_PIP_URL
      - substr: get-pip.py
      - substr: bootstrap.pypa.io
  - id: python-c-wget-command-substitution
    desc: python -c executes wget command substitution
    crit: suspicious
    conf: 0.9
    platforms:
      - unix
      - windows
    for:
      - shell
      - python
    attack: T1059.006
    if:
      type: text
      regex: python3?\s+-c\s+"\$\(wget\s+-q\s+-O-\s+http://
  - id: curl-pipe-perl
    desc: Direct curl-to-Perl execution
    crit: suspicious
    conf: 0.75
    for:
      - shell
    attack: T1059.005
    if:
      type: text
      regex: curl\s+.{0,200}\|\s*perl\s*(-|\s*)?(\n|$)
    not:
      - substr: example.com
    unless:
      - id: metadata/package/testing/presence/path::git-tests-directory
  - id: wget-pipe-perl
    desc: wget piped to perl
    crit: suspicious
    conf: 0.75
    attack: T1059.005
    if:
      type: text
    # Require wget to have arguments and a Perl pipeline at the start of the
    # shell line. A package-name list containing
    # both "wget" and "perl" is not a download-to-interpreter pipeline.
      regex: '(?m)^[ \t]*wget\b[ \t]+.{0,200}\|[ \t]*perl\b'
  - id: wget-pipe-node
    desc: wget piped to node
    crit: suspicious
    conf: 0.75
    attack: T1059.007
    if:
      type: text
      regex: (?m)^[[:space:]]*(wget\b|[^#[:space:]][^\n]{0,220}\bwget\s+)[^|\n]{1,200}\|\s*node\b
  - id: hosted-reverse-shell-service
    desc: hosted reverse shell service URL
    crit: suspicious
    conf: 0.96
    attack: T1105
  # The URL means the same thing wherever a command line lives: install
  # hooks and Dockerfile RUN steps execute it as surely as a script does.
    for: [scripts, package.json, dockerfile, makefile]
    if:
      type: text
    # lukechilds/reverse-shell serves at reverse-shell.sh; shell.now.sh is
    # its original now.sh deployment, still present in older samples.
      regex: https?://([a-z0-9.-]*reverse-shell\.[a-z]{2,10}|shell\.now\.sh)\b
  - id: opaque-dropper-url
    desc: Opaque dropper download URL
    crit: notable
    conf: 0.8
    for:
      - shell
    if:
      type: text
      regex: https?://[a-z0-9-]{24,}\.[a-z0-9.-]+/[A-Za-z0-9_-]{40,}
composite_rules:
  - id: raw-ip-wget-stdout-shell
    desc: Raw-IP wget stdout is piped into sh
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.004
    for:
      - shell
      - python
      - javascript
      - ruby
      - perl
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/download/wget::wget-cmd
      - id: micro-behaviors/communications/http/download/cli/curl-wget::wget-q-flag
      - id: micro-behaviors/communications/http/download/cli/curl-wget::wget-stdout-flag
      - id: metadata/lang/source/syntax/command/pipeline::pipe-to-shell
  - id: ruby-launchagent-pipe-shell-exec
    desc: Ruby launches remote curl-pipe-shell service
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.004
    platforms:
      - macos
    for:
      - ruby
    all:
      - id: metadata/lang/source/syntax/command/download::source-curl-pipe-shell
      - id: micro-behaviors/os/service/launchagent::ruby-write-autostart-shell-loader-plist
      - id: micro-behaviors/os/service/start::launchctl-load-command
  - id: node-curl-pipe-shell-exec
    desc: Node.js executes curl pipe shell
    crit: hostile
    conf: 0.94
    attack: T1105, T1059.004
    mbc: B0032.001
    for:
      - javascript
    all:
      - id: micro-behaviors/process/create/shell/command-string::child-process-exec
      - id: metadata/lang/source/syntax/command/download::curl-pipe-shell-text
    any:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/communications/ip/literal::malformed-http-ip-url
      - id: hosted-reverse-shell-service
  - id: node-execfile-curl-pipe-shell
    desc: Node execFile executes remote curl-to-shell pipeline
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.004
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/process/create/shell/pipeline::execfile-curl-shell-pipeline
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  - id: node-execsync-curl-pipe-shell
    desc: SSH-stealing Node script runs curl shell stage
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.004
    for:
      - javascript
      - typescript
    near_bytes: 512
    all:
      - id: objectives/exfiltration/stealer/credential/value/key::node-read-ssh-key-curl-stdin-post
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::node-execsync-curl-shell-stdin
  - id: node-hosted-reverse-shell-pipe
    desc: Node executes hosted reverse shell
    crit: hostile
    conf: 0.96
    attack: T1105, T1059.004
    mbc: B0032.001
    for:
      - javascript
    all:
      - id: micro-behaviors/os/module/require::child-process-require
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-shell
      - id: hosted-reverse-shell-service
# The same chain written as a command line -- a shell file, a package.json
# script, a Dockerfile RUN step -- which the node-* rules cannot see. A
# dropper is a few lines; large files that merely carry the pipeline are cheat
# sheets and tooling, so the size gate keeps those at the service URL's own
# suspicious level. near_bytes binds the URL to the pipe.
  - id: shell-hosted-reverse-shell-pipe
    desc: Command line pipes hosted reverse shell into interpreter
    crit: hostile
    conf: 0.97
    attack: T1105, T1059.004
    mbc: B0032.001
    for: [shell, package.json, dockerfile]
    size_max: 16384
    near_bytes: 256
    all:
      - id: hosted-reverse-shell-service
    any:
      - id: metadata/lang/source/syntax/command/download::curl-pipe-shell-text
      - id: metadata/package/scripts/command::npm-script-curl-pipe-shell
      - id: metadata/lang/source/syntax/command/download::curl-pipe-sh-text
  - id: node-hosted-reverse-shell-curl-pipe
    desc: Node executes hosted reverse shell service
    crit: hostile
    conf: 0.97
    attack: T1105, T1059.004, T1059.007
    mbc: B0032.001
    for:
      - javascript
    all:
      - id: micro-behaviors/os/module/require::child-process-require
      - id: hosted-reverse-shell-service
    any:
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-sh-command
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-bash-execution
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-shell-word
      - id: metadata/lang/source/syntax/command/download::curl-pipe-zsh
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-ksh
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-dash
      - id: micro-behaviors/communications/http/download/curl::curl-pipe-shell-in-js-exec
  - id: npm-curl-pipe-shell-stage
    desc: Node code executes a curl response through a POSIX shell
    crit: suspicious
    conf: 0.995
    for:
      - npm
      - javascript
    attack: T1105,T1059.004
    mbc: B0032.001
    all:
      - id: metadata/import/builtin::child-process-api-destructure
      - id: micro-behaviors/communications/http/download/curl::curl-pipe-shell-in-js-exec
    unless:
      - id: micro-behaviors/communications/http/download/curl::js-exec-curl-evil-placeholder
  - id: dropper-pipe-obfuscated
    desc: Obfuscated download piped to interpreter (hostile)
    crit: hostile
    conf: 0.95
    for:
      - shell
    size_max: 1000
    all:
      - id: micro-behaviors/data/string/replace::shell-echo-tr-transform
      - id: micro-behaviors/communications/tls/verify/disable::curl-insecure
      - id: micro-behaviors/communications/http/curl/command::curl-silent-or-fail
      - id: micro-behaviors/process/create/shell/command-mode::sh-c-exec
    any:
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-sh-command
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-shell-word
      - id: metadata/lang/source/syntax/command/download::curl-pipe-zsh
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-ksh
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-dash
      - id: metadata/lang/source/syntax/command/download::curl-pipe-exec-python-shell
      - id: curl-pipe-perl
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-node-stdin
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-ruby-stdin
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::wget-pipe-sh
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::wget-pipe-shell-word
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::wget-pipe-zsh
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::wget-pipe-ksh
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::wget-pipe-dash
      - id: wget-pipe-python
      - id: wget-pipe-perl
      - id: wget-pipe-node
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::wget-pipe-ruby
  - id: nohup-opaque-curl-pipe-shell
    desc: nohup and quiet curl-to-shell pipeline near an opaque URL
    crit: hostile
    conf: 0.97
    attack: T1105,T1059.004
    for:
      - shell
    near_lines: 5
    all:
      - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-response-shell-stdin
      - id: micro-behaviors/communications/http/curl/command::curl-silent-fail-flags-text
      - id: opaque-dropper-url
  - id: embedded-iot-password-dropper
    desc: IoT password injection pipes downloaded shell stage
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1105,T1210
    near_bytes: 260
    for:
      - shell
    all:
      - id: objectives/lateral-movement/exploit/network-device/http::iot-password-wget-command
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::wget-pipe-shell
  - id: hidden-shortened-url-shell-pipeline
    desc: Short URL shell stage with hidden-window clues
    crit: hostile
    conf: 0.97
    attack: T1059,T1105,T1564.003
    for:
      - go
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::shortened-url-shell-pipeline
      - id: micro-behaviors/process/config/window::go-create-no-window
  - id: rust-shortened-url-shell-pipeline
    desc: Rust passes a shortened URL pipeline to a shell
    crit: hostile
    conf: 0.96
    attack: T1059,T1105
    for:
      - rust
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/url/shortener/
      - id: metadata/lang/source/syntax/command/download::curl-pipe-shell-literal
      - id: micro-behaviors/process/create/subprocess/configure::rust-shell-command-exec
  - id: shortened-url-shell-command-pipeline
    desc: Shell script runs a shortened URL's response
    crit: hostile
    conf: 0.95
    attack: T1059,T1105
    near_bytes: 160
    platforms:
      - unix
    for:
      - shell
    all:
      - id: micro-behaviors/communications/url/shortener/
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-command-line
  - id: spawned-shortened-url-shell-pipeline
    desc: Spawns a shell on a shortened URL pipeline
    crit: hostile
    conf: 0.97
    attack: T1059,T1105
    near_bytes: 768
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::shortened-url-shell-pipeline
    any:
      - id: metadata/lang/source/syntax/call/relationship::bare-spawn-call
      - id: micro-behaviors/process/create/subprocess/launch::spawn-call
