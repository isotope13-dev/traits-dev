defaults:
  platforms:
  - macos
  for:
  - applescript
traits:
- id: applescript-curl-pipe-shell
  desc: AppleScript pipes curl output to shell
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: do shell script "curl.{0,240}\| ?(zsh|bash|sh)\b
composite_rules:
- id: applescript-echo-tr-curl-pipe-shell
  desc: AppleScript echo, tr and curl-to-shell clues
  crit: hostile
  conf: 0.96
  attack: T1059.002,T1105
  all:
  - id: objectives/execution/payload/interpreter-stdin/network::applescript-curl-pipe-shell
  - id: micro-behaviors/data/string/transform::applescript-echo-tr-command-text
