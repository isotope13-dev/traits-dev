defaults:
  platforms: [linux, macos, windows, unix, android, ios]


composite_rules:
  - id: http-and-encoded-shell-download-clues
    desc: HTTP and percent-encoded shell download command clues
    crit: suspicious
    conf: 0.995
    for: [python]
    platforms: [unix]
    all:
      - id: metadata/lang/encoding/url::percent-encoded-shell-download-chmod-exec
    any:
      - id: micro-behaviors/communications/http/request/client::http-client
      - id: micro-behaviors/communications/http/get::http-get
    near_bytes: 1024
