defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: node-per-os-shortlink-stage
    desc: Node startup and silent errors accompany shortlink script stages
    crit: hostile
    conf: 0.95
    attack: T1059.007,T1105
    # File-local context supports a loader inference, not a proven data-flow
    # edge from the platform map to the startup call. Require all five roles.
    near_bytes: 1024
    all:
      - id: objectives/execution/payload/interpreter-stdin/network/shell::per-os-remote-script-pipelines
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::shortened-url-shell-pipeline
      - id: micro-behaviors/process/create/shell/variable-command::node-exec-command-variable
      - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
      - id: micro-behaviors/data/control-flow/error-handling/suppress::empty-named-catch-text
  # A runtime OS switch selects the host's remote-script pipe (`curl | sh`,
  # `curl | cmd`) and spawns it with stdio discarded. Installers that pick a
  # per-OS bootstrap show its output; discarding it hides a second stage.
  - id: node-per-os-silent-remote-script
    desc: Node spawns per-OS remote-script pipe with stdio discarded
    crit: hostile
    conf: 0.95
    attack: T1059.003,T1059.004,T1105
    near_bytes: 1024
    all:
      - id: objectives/execution/payload/interpreter-stdin/network/shell::per-os-remote-script-pipelines
      - id: micro-behaviors/os/sysinfo/platform/branch::node-os-platform-alias-branch
      - id: micro-behaviors/process/create/subprocess/launch::node-spawn-or-fork-call
      - id: micro-behaviors/process/stdio/configure::child-stdio-ignore-option
