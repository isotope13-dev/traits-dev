defaults:
  platforms: [windows, unix]
  for: [go]
composite_rules:
  - id: go-per-os-shortlink-hidden-stage
    desc: Go per-OS shortlink stages with shell and window-hiding call clues
    crit: hostile
    conf: 0.95
    attack: T1059,T1105,T1564.003
    # These are file-local clues; the helper implementation can be in another file.
    all:
      - id: objectives/execution/payload/interpreter-stdin/network/shell::per-os-remote-script-pipelines
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::shortened-url-shell-pipeline
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-shell-variable-command
      - id: micro-behaviors/process/create/subprocess/launch::go-command-launch
      - id: micro-behaviors/process/config/window::go-hide-window-call
