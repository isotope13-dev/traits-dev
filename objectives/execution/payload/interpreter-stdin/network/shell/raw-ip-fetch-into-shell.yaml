# A download from a raw IPv4 address handed to an interpreter: piped,
# given to `sh -c "$(...)"`, or eval'd. Raw GitHub is deliberately absent:
# official installers (Homebrew and others) are served from it.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1105,T1059.004

composite_rules:
  - id: untrusted-host-fetch-into-shell
    desc: Raw-IP download runs as code
    crit: hostile
    conf: 0.96
    for: [scripts, source, -python]
    downgrade:
      scope: archive
      all:
        - id: well-known/tool/detection/code-analysis/disclude::static-fixture-package-without-interpreter
        - type: path
          regex: '(^|[\\/])tests[\\/]fixtures[\\/]'
    near_lines: 1
    all:
      - id: micro-behaviors/communications/url/host/http::downloader-raw-ipv4-host
    any:
      # Do not use the directory selector here: it also includes
      # download-pipe-null-redirection, which is a curl health check with no
      # downloaded content executed by a shell.
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-sh-command
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::shell-pipes-downloaded-script
      - id: micro-behaviors/process/create/shell/command-mode::shell-c-command-substitution-fetch
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval-fetch-substitution
    # A bundled security-rule catalog quotes these download examples as data.
    unless:
      - id: metadata/file/catalog/pattern-rules::js-security-rule-catalog-context
