# Program source that runs a downloaded script through a shell. The verdict
# rests on the call and its argument, so it does not move with comments,
# headers, or other text around the call.
#
# - In plain sight: suspicious. Standalone installers do this.
# - From a raw IP or raw paste content:
#   hostile. Installers name their vendor's host.
# - At install or import time in a package (module-level code in setup.py or
#   __init__.py): hostile, because every install or import runs a remote
#   script.
#
# Decoded commands that pipe a download to a shell are in
# script-eval/transformed/shell/decoded-remote-shell.yaml.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1105,T1059.004

composite_rules:
  - id: python-process-call-remote-shell
    desc: Python runs a downloaded script via shell
    crit: suspicious
    conf: 0.95
    unless:
      - id: well-known/tool/offensive/xalgorix::xalgorix-pentest-skill-path
      - id: well-known/tool/detection/ai-agent/agent-glovebox::setup-remote-injection-test-context
      - id: well-known/tool/offensive/lyrie-omega::lyrie-payload-corpus-context
      - id: metadata/package/testing/harness/unit::non-python-test-corpus-context
      - id: micro-behaviors/os/package-manager/installer-script::vendor-bootstrap-download-context
      - id: metadata/package/testing/corpus/security-tests/scanner::python-scanner-setup-fixture
      - id: metadata/package/testing/presence/harness::verified-python-test-file
    near_lines: 1
    downgrade:
      scope: archive
      any:
        - id: well-known/app/ai/coding-agent/hermes-agent::hermes-agent-package
    all:
      - id: micro-behaviors/process/create/shell/pipeline::python-shell-call-downloader-literal
      - id: micro-behaviors/process/create/shell/pipeline::python-shell-call-pipe-shell-literal

  # A hostname heuristic alone cannot distinguish a vendor from an attacker.
  - id: python-process-call-untrusted-host-shell
    desc: Python pipes a script from untrusted host
    crit: hostile
    conf: 0.95
    near_lines: 1
    all:
      - id: micro-behaviors/process/create/shell/pipeline::python-shell-call-downloader-literal
      - id: micro-behaviors/process/create/shell/pipeline::python-shell-call-pipe-shell-literal
    any:
      - id: micro-behaviors/communications/url/host/http::downloader-raw-ipv4-host
      - id: micro-behaviors/communications/url/host/http::downloader-raw-paste-host

  - id: python-module-call-remote-shell
    desc: Module-level Python call runs remote script
    crit: component
    conf: 0.95
    near_lines: 1
    all:
      - id: micro-behaviors/process/create/shell/pipeline::python-shell-call-downloader-literal
      - id: micro-behaviors/process/create/shell/pipeline::python-shell-call-pipe-shell-literal
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call

  # Path facts carry no line, so the file context sits outside the
  # same-line proof above.
  - id: python-package-hook-remote-shell
    desc: Package install or import runs remote script
    crit: hostile
    conf: 0.95
    # Scanner install-hook fixtures are test inputs. Downgraded, not
    # suppressed, so a copy outside testing/fixtures keeps its severity.
    downgrade:
      scope: archive
      all:
        - type: path
          regex: '\btesting[\\/]fixtures[\\/]install_scripts[\\/]'
    all:
      - id: python-module-call-remote-shell
    any:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/file/size::init-py-file
    unless:
      - id: metadata/package/testing/corpus/security-tests/scanner::python-scanner-setup-fixture
  # An f-string's dynamic URL segment is not a literal origin, but the source
  # still shows the downloader-to-shell command at a shell-enabled call.
  - id: python-process-call-remote-shell-fstring
    desc: Python f-string process call runs a downloaded script via shell
    crit: suspicious
    conf: 0.95
    near_lines: 1
    all:
      - id: micro-behaviors/process/create/shell/pipeline::python-fstring-call-curl-pipe-shell
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
