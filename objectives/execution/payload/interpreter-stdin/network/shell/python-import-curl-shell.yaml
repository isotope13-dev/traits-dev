defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1105,T1059.004,T1195.002
traits:
  - id: python-module-try-curl-pipe-shell
    desc: Module-level try executes a curl pipeline
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (try_statement body: (block
            (expression_statement (call
              function: (attribute object: (identifier) @os attribute: (identifier) @system)
              arguments: (argument_list (string) @command))))))
          (#eq? @os "os")
          (#eq? @system "system")
          (#match? @command "(?s)curl[^\n]{0,240}\\|[ \\t]*(sh|bash)\\b"))
composite_rules:
  - id: python-import-curl-pipe-shell
    desc: Package initializer executes a curl-to-shell pipeline
    crit: hostile
    conf: 0.97
    all:
      - id: python-module-try-curl-pipe-shell
      - id: metadata/file/size::init-py-file
      - id: micro-behaviors/data/control-flow/error-handling/catch::python-import-error-handler
