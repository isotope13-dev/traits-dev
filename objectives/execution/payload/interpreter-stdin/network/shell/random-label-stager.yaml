defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  # Installers pipe curl into a shell from a vendor's short, named host. A
  # 30+ character machine-looking label on the pipeline's host names a
  # throwaway endpoint, which makes the pipe a stager, not an installer.
  - id: curl-pipe-shell-random-label-host
    desc: Pipes a download from a random-label host into a shell
    crit: hostile
    conf: 0.9
    attack: T1059.004,T1105
    scope: file
    near_bytes: 256
    all:
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-bash-execution
      - id: micro-behaviors/communications/url/host/label::long-alphanumeric-third-level-label
