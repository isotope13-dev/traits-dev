defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: download-execute-comp
  desc: npm script downloads and executes
  crit: suspicious
  conf: 0.95
  mbc: "B0024"
  attack: "T1105"
  all:
  - id: micro-behaviors/communications/http/download/package::preinstall-download-tool
  - id: micro-behaviors/process/deploy/interpreter-stdin/input::npm-preinstall-interpreter-pipe
  unless:
  # The exact curl-to-Node form has its own more specific observation in
  # remote-execution/npm.yaml. Avoid a duplicate generic download/execute claim.
  - id: micro-behaviors/process/deploy/interpreter-stdin/network::preinstall-curl-piped-node
        # Obfuscated script
