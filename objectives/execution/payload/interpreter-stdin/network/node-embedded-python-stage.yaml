defaults:
  platforms: [windows]
  for: [javascript]
composite_rules:
  # The facts occur in the same source file; the rule does not itself prove
  # which response reaches the interpreter or whether execution succeeded.
  - id: node-detached-python-remote-stage-turnstile
    desc: Detached Python stage and Turnstile clues
    crit: hostile
    conf: 0.97
    near_bytes: 5000
    attack: T1059.006,T1105,T1497
    all:
      - id: micro-behaviors/communications/url/resource-path/file::js-python-runtime-or-pip-url
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive-text
      - id: micro-behaviors/os/application/target/development::pythonw-executable-reference
      - id: micro-behaviors/communications/http/request/evented::node-evented-get-response
      - id: micro-behaviors/process/stdio/write::js-stdin-write
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
      - id: micro-behaviors/os/application/target/security::turnstile-name-reference
