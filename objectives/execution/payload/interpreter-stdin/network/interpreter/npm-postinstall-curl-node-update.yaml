defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002,T1059.007,T1105

traits:
  - id: postinstall-curl-update-pipe-node
    desc: Postinstall pipes remote update into Node
    crit: hostile
    conf: 0.99
    if:
      type: value
      path: scripts.postinstall
      regex: ^\s*curl\s+[^|;\n]{0,250}https?://[^|;\s]+/update\.php\?version=[^|;\s]+\s*\|\s*node\s*$
    unless:
    - id: metadata/package/scripts/reference::reserved-docs-domain-npm-script

