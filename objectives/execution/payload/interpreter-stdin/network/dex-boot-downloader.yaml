defaults:
  platforms: [android]
  for: [dex]
  attack: T1059.004,T1105,T1547
traits:
  - id: dex-wget-http-pipe-shell
    desc: DEX contains wget-to-shell command text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'wget\s+https?://\S{1,160}\s+-O-\)\s*\|\s*sh\b'
composite_rules:
  - id: android-boot-downloader-exec-clues
    desc: Android boot downloader and exec call clues
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/message/intent::android-boot-completed-code-reference
      - id: micro-behaviors/communications/http/download/wget::dex-busybox-wget
      - id: micro-behaviors/communications/http/download/wget::dex-toybox-wget
      - id: micro-behaviors/process/create/subprocess/launch::dex-runtime-exec-call
      - id: dex-wget-http-pipe-shell
