# Remote script and authentication evidence distinguish this from daemon APIs.
defaults:
  crit: hostile
  for:
  - macho
  platforms:
  - macos
  attack: T1059.002,T1105
composite_rules:
- id: daemonized-remote-script-loader
  desc: Detached authenticated remote script loader
  conf: 0.95
  all:
  - id: micro-behaviors/process/daemonize/detach::fork-new-session
  - id: micro-behaviors/process/create/shell/
  - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-osascript
  - id: micro-behaviors/communications/http/curl/command::curl-api-key-header
  any:
  - id: metadata/binary/section/prose::tiny-cstring-section
  - id: micro-behaviors/process/create/subprocess/reference::excessive-popen
  - id: metadata/binary/section/entropy::moderate-entropy-data-section
  downgrade:
    any:
    - id: metadata/binary/symbols/count::many-imports
    - id: metadata/lang/compiler/systems/
- id: encoded-daemon-script-loader
  desc: Encoded detached remote script loader
  conf: 0.98
  all:
  - id: objectives/execution/payload/interpreter-stdin/network::daemonized-remote-script-loader
  any:
  - id: micro-behaviors/data/bitwise/xor-forms/reference::xor-decode-name-reference
  - id: micro-behaviors/data/bitwise/xor-forms/reference::xor-string-transform-clues
  - id: objectives/anti-static/obfuscation/payload/section/content::encrypted-payload-section
  - id: metadata/binary/section/entropy::moderate-entropy-data-section
  - id: micro-behaviors/data/bitwise/xor-forms/indexed::repeating-key-buffer-xor-loop
  downgrade:
    any:
    - id: metadata/binary/symbols/count::many-imports
- id: encoded-shell-daemon-loader
  desc: Detached loader with encoded shell content
  conf: 0.99
  all:
  - id: objectives/execution/payload/interpreter-stdin/network::daemonized-remote-script-loader
  any:
  - id: objectives/anti-static/obfuscation/encoding/shell::encoded-shell-pattern
  - id: objectives/anti-static/obfuscation/payload/section/content::encrypted-payload-section
- id: generic-named-daemon-script-loader
  desc: Generic-named detached remote script loader
  conf: 0.99
  all:
  - id: objectives/execution/payload/interpreter-stdin/network::daemonized-remote-script-loader
  - id: metadata/binary/bundle::unsigned-generic-bundle-id
