defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: python-stdin-write-response-text-encode
    desc: Writes encoded HTTP response to subprocess
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\.stdin\.write\(\w+\.text\.encode\('

composite_rules:
  - id: python-http-body-stdin-with-encoded-url
    desc: HTTP body to Python stdin with encoded URL
    crit: hostile
    conf: 0.98
    attack: T1059.006,T1105
    all:
      - id: objectives/execution/payload/interpreter-stdin/network::python-http-body-to-child-stdin
      - id: micro-behaviors/process/deploy/interpreter-stdin/input::sys-executable-stdin-subprocess
      - id: micro-behaviors/process/daemonize/detach::python-subprocess-new-session-option
      - id: micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-stdio-assignment
      - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
  - id: python-detached-http-response-stdin-exec
    desc: Detached Python subprocess executing HTTP response text via stdin
    crit: hostile
    conf: 0.98
    attack: T1059.006,T1105
    all:
      - id: python-stdin-write-response-text-encode
      - id: micro-behaviors/process/daemonize/detach::python-detached-kwargs-new-session
      - id: micro-behaviors/process/deploy/interpreter-stdin/input::sys-executable-stdin-subprocess
      - id: micro-behaviors/communications/http/get::requests-get-without-reserved-literal-prefix
      - id: micro-behaviors/communications/http/response::raise-for-status
