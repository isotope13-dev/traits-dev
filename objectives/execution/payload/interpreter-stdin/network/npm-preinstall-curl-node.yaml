defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: "T1195.002,T1059.007,T1105"
  mbc: B0024
composite_rules:
- id: preinstall-curl-piped-node-exec
  desc: Preinstall pipes a fetched program into Node
  crit: hostile
  conf: 0.99
  for: [npm, tar, package.json]
  scope: file
  all:
  - id: micro-behaviors/process/deploy/interpreter-stdin/network::preinstall-curl-piped-node
  - id: metadata/package/scripts/command::preinstall-curl-http-url
  unless:
  # Documentation domains cannot serve a remotely supplied program. The pipe
  # remains a suspicious configuration fact, but this manifest does not
  # establish remote-code execution from its configured URL.
  - id: metadata/package/scripts/reference::reserved-docs-domain-npm-script
