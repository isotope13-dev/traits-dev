defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
composite_rules:
  - id: jvm-curl-runtime-loader
    desc: JVM launches a curl-piped shell payload
    crit: hostile
    conf: 0.99
    for: [class, java_class]
    platforms: [unix, macos]
    all:
      - id: metadata/binary/code/bytecode::jvm-curl-pipe-shell-string
      - id: metadata/import/jvm::java-runtime-exec-bytecode-reference
      - id: micro-behaviors/communications/url/host/domain-http::http-url-binary

