defaults:
  platforms: [macos]
  for: [shell, html, javascript, markdown]
  attack: T1059.004,T1027,T1204.004


composite_rules:
  - id: macos-decoded-herestring-curl-shell
    desc: Decoded shell here-string and curl-to-shell execution
    crit: hostile
    conf: 0.98
    attack: T1059.004,T1105,T1204.004
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin/decoded::shell-herestring-base64-decode
    any:
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-bash-execution
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-shell
      - id: metadata/lang/source/syntax/command/download::curl-pipe-shell-text
    near_bytes: 2048
