defaults:
  for: [python]
  platforms: [unix]

traits:
  - id: python-os-system-curl-ip-python
    desc: Shell runs Python from raw-IP URL
    crit: suspicious
    conf: 0.98
    attack: T1105,T1059.006
    if:
      type: text
      regex: 'os[.]system\(["\x27]curl\s+https?://[0-9.]+(:[0-9]+)?/[^\s|]{1,200}\s*\|\s*python3?'

composite_rules:
  - id: python-setup-curl-ip-python
    desc: Setup executes Python downloaded from raw IP
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1105,T1059.006
    scope: file
    all:
      - id: python-os-system-curl-ip-python
      - id: metadata/package/files/included::setup-py-basename
