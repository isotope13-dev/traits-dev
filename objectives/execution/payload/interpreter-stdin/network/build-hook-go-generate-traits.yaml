# go generate is explicit, not a go build/install hook. Arguments are Go-quoted,
# not implicitly interpreted by a shell. Facts below require an invoked shell.
# ATT&CK: T1195.002 (Supply Chain Compromise)
defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [go]
  attack: T1195.002
  mbc: B0024
composite_rules:
  - id: go-generate-remote-shell-loader
    desc: Go generate downloads and runs a shell payload
    crit: hostile
    conf: 0.99
    for: [go, zip, tar]
    scope: archive
    all:
      - id: metadata/lang/source/syntax/command/download::go-generate-curl-pipe-shell-directive
      - id: metadata/build/config::go-explicit-generator
      - id: metadata/lang/source/syntax/command/download::curl-pipe-shell-text
