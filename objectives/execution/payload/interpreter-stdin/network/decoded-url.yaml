defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: openssl-decoded-url-shell-pipeline
    desc: Pipes response from Base64-decoded URL to shell
    crit: suspicious
    conf: 0.97
    attack: T1027,T1059.004,T1105
    if:
      type: tree-sitter
      language: shell
      query: |
        ((pipeline
          . (command name: (command_name) @fetch
            argument: (command_substitution
              (pipeline
                (command name: (command_name) @decoder
                  argument: (word) @format
                  argument: (word) @decode))))
          . "|"
          . (command name: (command_name) @shell) .)
          (#eq? @fetch "curl")
          (#eq? @decoder "openssl")
          (#eq? @format "base64")
          (#eq? @decode "-d")
          (#match? @shell "^(/(usr/)?bin/)?(sh|bash|zsh)$"))
