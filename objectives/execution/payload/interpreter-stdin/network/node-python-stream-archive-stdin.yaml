defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
composite_rules:
  - id: node-python-archive-interpreter-stdin
    desc: Node downloads archive and feeds interpreter
    crit: hostile
    conf: 0.95
    attack: T1059
    mbc: B0024
    for:
      - javascript
      - typescript
    any:
      - id: micro-behaviors/communications/http/download/helper::python-standalone-release-reference
      - id: objectives/execution/payload/file-exec/download/runtime::node-distribution-archive-exec-clues
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin/input::node-spawn-interpreter-stdin
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-archive
