defaults:
  platforms: [unix, windows]
  for: [npm, tar, javascript, typescript]

composite_rules:
  - id: paste-payload-detached-node-stdin
    desc: Paste payload to detached Node stdin
    crit: hostile
    conf: 0.99
    attack: T1102.001,T1059.007
    scope: file
    for:
      - javascript
      - typescript
    near_bytes: 2048
    all:
      - id: micro-behaviors/process/stdio/write::detached-node-stdin-clues
      - id: micro-behaviors/communications/http/get::axios-get-call
      - id: micro-behaviors/data/decode/base64/unspecified::atob-decode
    any:
      - id: objectives/command-and-control/infrastructure/paste::jsonkeeper-b64-endpoint
      - id: objectives/command-and-control/infrastructure/paste::jsonkeeper
