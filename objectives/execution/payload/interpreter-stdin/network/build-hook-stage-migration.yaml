defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
  attack: T1195.002
composite_rules:
- id: python-packaging-curl-pipe-execute
  desc: Packaging code pipes a curl payload to Python
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: metadata/build/pip::packaging-setuptools-imported-setup-call
  - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url
  - id: metadata/lang/source/syntax/command/download::curl-pipe-exec-python-shell
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system
