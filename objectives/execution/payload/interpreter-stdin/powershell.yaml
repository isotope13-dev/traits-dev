# A shell or batch command that pipes curl download output into PowerShell
# delivers and executes a remote payload without writing to disk.
defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1105,T1059.001
  mbc: B0030

composite_rules:
  - id: curl-pipe-powershell-dropper
    desc: Piped curl download executes in PowerShell
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-powershell
      - id: micro-behaviors/communications/http/download/cli::curl-wget-bare-domain
    any:
      - id: metadata/lang/source/syntax/command::pipe-to-powershell
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
    needs: 1


