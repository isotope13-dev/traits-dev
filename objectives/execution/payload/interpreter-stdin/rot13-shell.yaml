defaults:
  platforms:
  - unix
  for:
  - shell
  conf: 0.99
composite_rules:
- id: rot13-curl-shell-stage
  desc: Executes a ROT13-hidden curl-to-shell command
  crit: hostile
  attack: T1105,T1059.004
  all:
  - id: rot13-curl-shell-command-flow
  any:
  - id: micro-behaviors/process/create/shell/command-string::sh-c-exec
  - id: micro-behaviors/process/create/shell/spawn::shell-exec
  near_lines: 1
traits:
- id: rot13-curl-shell-command-flow
  desc: ROT13 curl pipeline feeds shell command
  crit: suspicious
  if:
    type: tree-sitter
    query: |-
      ((command
       name: (command_name (word) @exec)
       argument: (word) @shell argument: (word) @flag
       argument: (string (command_substitution (pipeline
       (command name: (command_name (word) @echo) argument: (raw_string) @encoded)
       (command name: (command_name (word) @tr)
        argument: (raw_string) @alphabet argument: (raw_string) @rotation))))) @launch
       (#eq? @exec "exec") (#eq? @shell "sh") (#eq? @flag "-c")

      (#eq? @echo "echo") (#eq? @tr "tr")
      (#eq? @alphabet "'A-Za-z'") (#eq? @rotation "'N-ZA-Mn-za-m'")
      (#match? @encoded "^'phey[ \\t]+[^|]{1,160}[|][ \\t]*(fu|onfu)[ \\t]*'$")
      (#match? @encoded "uggcf?://")
      )
