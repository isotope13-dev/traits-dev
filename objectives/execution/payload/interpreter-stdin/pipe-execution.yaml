defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - shell
  - python
  - javascript
  - ruby
  - perl
  - applescript
traits:
- id: curl-pipe-shell-word
  desc: curl piped to shell
  crit: suspicious
  conf: 0.7
  attack: T1059.004
  unless:
  - id: metadata/build
  - id: metadata/lang/source/syntax/key-value::security-rule-runtime-script-floating-url
  - id: well-known/tool/detection/
  if:
    type: text
    regex: curl\s+.{0,200}\|\s*shell\b
- id: curl-pipe-ksh
  desc: curl piped to ksh
  crit: suspicious
  conf: 0.7
  attack: T1059.004
  unless:
  - id: well-known/tool/detection/
  - id: metadata/lang/source/syntax/key-value::security-rule-runtime-script-floating-url
  - type: basename
    regex: (?i)(^|[\\/!])(METADATA|PKG-INFO|README(\..*)?)$
  - id: metadata/package/freeform::pkg-description-content-type-markdown
  - id: metadata/package/files/dependency::vsix-bundled-output-path
  - id: metadata/build/docker::dockerfile-basename
  - id: metadata/path::test-directory-component
  if:
    type: text
    regex: curl\s+.{0,200}\|\s*ksh\b
- id: curl-pipe-dash
  desc: curl piped to dash
  crit: suspicious
  conf: 0.7
  attack: T1059.004
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: well-known/tool/detection/
  - id: metadata/lang/source/syntax/key-value::security-rule-runtime-script-floating-url
  - type: basename
    regex: (?i)(^|[\\/!])(METADATA|PKG-INFO|README(\..*)?)$
  - id: metadata/package/freeform::pkg-description-content-type-markdown
  - id: metadata/package/files/dependency::vsix-bundled-output-path
  - id: metadata/build/docker::dockerfile-basename
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
  if:
    type: text
    regex: curl\s+.{0,200}\|\s*dash\b
- id: wget-pipe-python
  desc: wget output piped directly to Python stdin
  crit: suspicious
  conf: 0.75
  attack: T1059.006
  if:
    type: text
    regex: (?m)^[ \t]*wget\b[^\n|]{0,200}\|[ \t]*python3?[ \t]*(-[ \t]*)?($|[;&|])
  not:
  - substr: GET_PIP_URL
  - substr: get-pip.py
  - substr: bootstrap.pypa.io
  unless:
  - id: well-known/tool/development/vscode-extension/vscode-marketplace::bwat-dev-vsix
  - id: well-known/tool/development/vscode-extension/vscode-marketplace::bwat-dev-member-path
  - id: well-known/lib/data/apache-beam::beam-package-context
  - id: metadata/package/testing/
  - id: well-known/tool/detection/
- id: python-c-wget-command-substitution
  desc: python -c executes wget command substitution
  crit: suspicious
  conf: 0.9
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  attack: T1059.006
  if:
    type: text
    regex: python3?\s+-c\s+"\$\(wget\s+-q\s+-O-\s+http://
- id: curl-pipe-perl
  desc: Direct curl-to-Perl execution
  crit: suspicious
  conf: 0.75
  for:
  - shell
  attack: T1059.005
  if:
    type: text
    regex: curl\s+.{0,200}\|\s*perl\s*(-|\s*)?(\n|$)
  not:
  - substr: example.com
  unless:
  - id: metadata/package/testing/presence/path::git-tests-directory
  - id: well-known/tool/offensive/nmap::nmap-source-tree
- id: wget-pipe-perl
  desc: wget piped to perl
  crit: suspicious
  conf: 0.75
  attack: T1059.005
  if:
    type: text
    regex: (?m)^[[:space:]]*(wget\b|[^#[:space:]][^\n]{0,220}\bwget\s+).{0,200}\|\s*perl
  unless:
  - type: path
    regex: App/cpanminus/
  - id: well-known/tool/development/vscode-extension/vscode-marketplace::bwat-dev-vsix
  - id: well-known/tool/development/vscode-extension/vscode-marketplace::bwat-dev-member-path
  - id: metadata/package/testing/
  - id: well-known/tool/detection/
- id: wget-pipe-node
  desc: wget piped to node
  crit: suspicious
  conf: 0.75
  attack: T1059.007
  if:
    type: text
    regex: (?m)^[[:space:]]*(wget\b|[^#[:space:]][^\n]{0,220}\bwget\s+)[^|\n]{1,200}\|\s*node\b
  unless:
  - id: well-known/tool/development/vscode-extension/vscode-marketplace::bwat-dev-vsix
  - id: well-known/tool/development/vscode-extension/vscode-marketplace::bwat-dev-member-path
  - id: metadata/package/testing/
  - id: well-known/tool/detection/
- id: wget-pipe-ruby
  desc: wget piped to ruby
  crit: suspicious
  conf: 0.75
  attack: T1059
  if:
    type: text
    regex: (?m)^[[:space:]]*(wget\b|[^#[:space:]][^\n]{0,220}\bwget\s+).{0,200}\|\s*ruby
  unless:
  - id: well-known/tool/development/vscode-extension/vscode-marketplace::bwat-dev-vsix
  - id: well-known/tool/development/vscode-extension/vscode-marketplace::bwat-dev-member-path
  - id: metadata/package/testing/
  - id: well-known/tool/detection/
- id: hosted-reverse-shell-service
  desc: hosted reverse shell service URL
  crit: suspicious
  conf: 0.96
  attack: T1105
  if:
    type: text
    regex: https?://[a-z0-9.-]*reverse-shell\.[a-z]{2,10}\b
- id: opaque-dropper-url
  desc: Opaque dropper download URL
  crit: notable
  conf: 0.8
  for:
  - shell
  if:
    type: text
    regex: https?://[a-z0-9-]{24,}\.[a-z0-9.-]+/[A-Za-z0-9_-]{40,}
composite_rules:
- id: raw-ip-wget-stdout-shell
  desc: Raw-IP wget stdout is piped into sh
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.004
  for:
  - shell
  - python
  - javascript
  - ruby
  - perl
  unless:
  - id: well-known/tool/detection/
  all:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  - id: micro-behaviors/communications/http/download/wget::wget-cmd
  - id: micro-behaviors/communications/http/download/cli::wget-q-flag
  - id: micro-behaviors/communications/http/download/cli::wget-stdout-flag
  - id: metadata/lang/source/syntax/command::pipe-to-shell
- id: raw-ip-curl-stdout-shell
  desc: Raw-IP curl stdout is piped into shell
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.004
  for:
  - shell
  - python
  - javascript
  - ruby
  - perl
  scope: file
  near_bytes: 256
  unless:
  - id: well-known/tool/detection/
  all:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  any:
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-literal
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-bash-execution
- id: ruby-launchagent-pipe-shell-exec
  desc: Ruby launches remote curl-pipe-shell service
  crit: hostile
  conf: 0.98
  attack: T1105,T1059.004
  platforms:
  - macos
  for:
  - ruby
  all:
  - id: micro-behaviors/process/create/shell/pipeline::source-curl-pipe-shell
  - id: micro-behaviors/os/service/launchagent::ruby-write-autostart-shell-loader-plist
  - id: micro-behaviors/os/service/start::launchctl-load-command
- id: node-curl-pipe-shell-exec
  desc: Node.js executes curl pipe shell
  crit: hostile
  conf: 0.94
  attack: T1105, T1059.004
  mbc: B0032.001
  for:
  - javascript
  all:
  - id: micro-behaviors/process/create/shell/bridge::child-process-exec
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
  any:
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  - id: micro-behaviors/communications/ip/literal::malformed-http-ip-url
  - id: hosted-reverse-shell-service
- id: node-execsync-curl-pipe-shell
  desc: SSH-stealing Node script runs curl shell stage
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.004
  for:
  - javascript
  - typescript
  near_bytes: 512
  all:
  - id: objectives/exfiltration/stealer/credential/value/key::node-read-ssh-key-curl-stdin-post
  - id: micro-behaviors/process/deploy/interpreter-stdin::node-execsync-curl-shell-stdin
- id: node-hosted-reverse-shell-pipe
  desc: Node executes hosted reverse shell
  crit: hostile
  conf: 0.96
  attack: T1105, T1059.004
  mbc: B0032.001
  for:
  - javascript
  all:
  - id: micro-behaviors/os/module/require::child-process-require
  - id: curl-pipe-shell
  - id: hosted-reverse-shell-service
- id: node-hosted-reverse-shell-curl-pipe
  desc: Node executes hosted reverse shell service
  crit: hostile
  conf: 0.97
  attack: T1105, T1059.004, T1059.007
  mbc: B0032.001
  for:
  - javascript
  all:
  - id: micro-behaviors/os/module/require::child-process-require
  - id: hosted-reverse-shell-service
  any:
  - id: micro-behaviors/process/deploy/interpreter-stdin::curl-pipe-sh-command
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-bash-execution
  - id: curl-pipe-shell-word
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-zsh
  - id: curl-pipe-ksh
  - id: curl-pipe-dash
  - id: micro-behaviors/communications/http/download/curl::curl-pipe-shell-in-js-exec
- id: npm-curl-pipe-shell-stage
  desc: NPM package code executes a remote curl stage through a POSIX shell
  crit: suspicious
  conf: 0.995
  for:
  - npm
  - javascript
  attack: T1195.002,T1105,T1059.004
  mbc: B0032.001
  all:
  - id: metadata/import/builtin::child-process-api-destructure
  - id: micro-behaviors/communications/http/download/curl::curl-pipe-shell-in-js-exec
- id: curl-pipe-shell
  desc: Curl output piped to shell
  crit: notable
  conf: 0.95
  attack: T1059.004
  any:
  - id: micro-behaviors/process/deploy/interpreter-stdin::curl-pipe-sh-command
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-bash-execution
  - id: curl-pipe-shell-word
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-zsh
  - id: curl-pipe-ksh
  unless:
  - id: curl-pipe-dash
- id: dropper-pipe-obfuscated
  desc: Obfuscated download piped to interpreter (hostile)
  crit: hostile
  conf: 0.95
  for:
  - shell
  size_max: 1000
  all:
  - id: micro-behaviors/data/string/replace::shell-echo-tr-transform
  - id: micro-behaviors/communications/tls/verify/disable::curl-insecure
  - id: micro-behaviors/communications/http/curl::curl-silent
  - id: micro-behaviors/process/create/shell/command-string::sh-c-exec
  any:
  - id: micro-behaviors/process/deploy/interpreter-stdin::curl-pipe-sh-command
  - id: curl-pipe-shell-word
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-zsh
  - id: curl-pipe-ksh
  - id: curl-pipe-dash
  - id: micro-behaviors/process/create/shell/spawn::curl-pipe-exec-python-shell
  - id: curl-pipe-perl
  - id: micro-behaviors/process/deploy/interpreter-stdin::curl-pipe-node-stdin
  - id: micro-behaviors/process/io/stream::curl-pipe-ruby-stdin
  - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-sh
  - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-shell-word
  - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-zsh
  - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-ksh
  - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-dash
  - id: wget-pipe-python
  - id: wget-pipe-perl
  - id: wget-pipe-node
  - id: wget-pipe-ruby
- id: nohup-opaque-curl-pipe-shell
  desc: Detached quiet download from an opaque host is piped to a shell
  crit: hostile
  conf: 0.97
  attack: T1105,T1059.004
  for:
  - shell
  near_lines: 5
  all:
  - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
  - id: micro-behaviors/process/create/shell/pipeline::curl-response-shell-stdin
  - id: micro-behaviors/communications/http/curl::curl-silent-fail-flags-text
  - id: opaque-dropper-url
- id: embedded-iot-password-dropper
  desc: IoT password injection pipes downloaded shell stage
  crit: hostile
  conf: 0.99
  attack: T1059.004,T1105,T1210
  near_bytes: 260
  for:
  - shell
  all:
  - id: objectives/lateral-movement/exploit/network-device/http::iot-password-wget-command
  - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-shell
- id: shortened-url-shell-pipeline
  desc: Shell runs a shortened URL's response
  crit: hostile
  conf: 0.95
  attack: T1059,T1105
  near_bytes: 512
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - javascript
  - typescript
  - rust
  - -shell
  all:
  - id: micro-behaviors/communications/url/shortener/
  any:
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-literal
  - id: micro-behaviors/process/deploy/interpreter-stdin::curl-pipe-cmd-literal
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-in-code
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/
  - id: metadata/file/format/structured::twitter-status-created-at
- id: hidden-shortened-url-shell-pipeline
  desc: Hides execution of a shortened URL shell stage
  crit: hostile
  conf: 0.97
  attack: T1059,T1105,T1564.003
  for:
  - go
  all:
  - id: shortened-url-shell-pipeline
  - id: micro-behaviors/process/create/hidden::go-create-no-window
- id: rust-shortened-url-shell-pipeline
  desc: Rust passes a shortened URL pipeline to a shell
  crit: hostile
  conf: 0.96
  attack: T1059,T1105
  for:
  - rust
  near_bytes: 512
  all:
  - id: micro-behaviors/communications/url/shortener/
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-literal
  - id: micro-behaviors/process/create/shell/runner::rust-shell-command-exec
  unless:
  - id: well-known/tool/detection/
- id: shortened-url-shell-command-pipeline
  desc: Shell script runs a shortened URL's response
  crit: hostile
  conf: 0.95
  attack: T1059,T1105
  near_bytes: 160
  platforms:
  - unix
  for:
  - shell
  all:
  - id: micro-behaviors/communications/url/shortener/
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-command-line
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/
- id: spawned-shortened-url-shell-pipeline
  desc: Spawns a shell on a shortened URL pipeline
  crit: hostile
  conf: 0.97
  attack: T1059,T1105
  near_bytes: 768
  for:
  - javascript
  - typescript
  all:
  - id: shortened-url-shell-pipeline
  any:
  - id: micro-behaviors/process/create/spawn::bare-spawn-call
  - id: micro-behaviors/process/create/spawn::spawn-call
- id: decompressed-payload-piped-interpreter-stdin
  desc: Decompressed payload piped to spawned interpreter stdin
  crit: hostile
  conf: 0.98
  attack: T1059.007,T1027
  for:
  - javascript
  - typescript
  all:
  - id: objectives/command-and-control/dropper/node-bootstrap::stdin-exec
  any:
  - id: micro-behaviors/data/decompress/brotli::node-brotli-decompress-function
  - id: micro-behaviors/data/decompress/gzip::node-gunzip-function
  - id: micro-behaviors/data/decompress/zlib::node-inflate-function
  unless:
  - id: metadata/package/testing/
