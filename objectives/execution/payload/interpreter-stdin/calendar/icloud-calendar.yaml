defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: icloud-calendar-shell-deaddrop
    desc: Executes downloaded calendar content as shell
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1105
    all:
      - id: micro-behaviors/communications/http/services/apple::icloud-published-calendar-url
    any:
      - id: objectives/execution/payload/interpreter-stdin/calendar::published-calendar-to-shell
      - id: objectives/execution/payload/interpreter-stdin/calendar::published-calendar-pipe-shell
