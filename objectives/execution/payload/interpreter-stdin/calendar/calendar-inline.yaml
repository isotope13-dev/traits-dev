defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: published-calendar-pipe-shell
    desc: Pipes a published calendar response into shell
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      language: shell
      query: |
        (pipeline
          . (command name: (command_name (word) @curl)
            . argument: (word) @flags
            . argument: [(word) (raw_string) (string (string_content))] @url .)
          . (command) @shell .
          (#eq? @curl "curl") (#match? @flags "^-[fsSL]+$")
          (#match? @url "^['\"]?https?://([a-z0-9-]+\\.)?caldav\\.icloud\\.com/published/")
          (#match? @shell "^(/(usr/)?bin/)?(ba|z|k)?sh(\\s+-s)?$"))
