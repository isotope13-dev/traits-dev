composite_rules:
- id: evm-contract-resolved-osascript
  for:
  - shell
  - applescript
  desc: EVM-resolved host delivers an AppleScript to osascript
  crit: hostile
  conf: 0.99
  attack: T1102,T1105,T1059.002
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/http/post::eth-call-derived-authority-post
  - id: micro-behaviors/process/create/script/osascript::pipe-osascript
  platforms:
  - macos
