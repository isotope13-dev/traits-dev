defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
traits:
  - id: node-concatenated-curl-shell-call
    desc: Node executes concatenated curl-shell command
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression
            object: (call_expression function: (identifier) @require
              arguments: (arguments (string (string_fragment) @module)))
            property: (property_identifier) @exec)
          arguments: (arguments (binary_expression) @command)) @evidence
          (#eq? @require "require")
          (#match? @module "^(node:)?child_process$")
          (#any-of? @exec "exec" "execSync")
          (#match? @command "^['\"]curl\\s")
          (#match? @command "\\|\\s*(ba)?sh['\"]$"))
