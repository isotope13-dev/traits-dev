defaults:
  platforms: [macos, unix]
  for: [shell]
composite_rules:
  - id: macos-remote-fed-stdin-interpreter
    desc: Calendar execution with macOS trust changes
    crit: hostile
    conf: 0.92
    attack: T1059.004,T1105
    all:
      - id: objectives/execution/payload/interpreter-stdin::icloud-calendar-shell-deaddrop
    any:
      - id: micro-behaviors/fs/attributes/xattr::xattr-clear
      - id: micro-behaviors/crypto/sign::codesign-ad-hoc-signing
      - id: micro-behaviors/crypto/sign::codesign-force-adhoc
    needs: 1
    unless:
      - id: micro-behaviors/ui/help::documented-curl-pipe-usage
      - id: micro-behaviors/ui/help::help-text-curl-pipe-usage
  - id: aes-gcm-decompressed-stdin-interpreter-spawn
    desc: AES-GCM and Brotli stage piped to hidden interpreter stdin
    crit: hostile
    conf: 0.98
    platforms: [unix, windows]
    for: [javascript, typescript]
    attack: T1059.007,T1027,T1140
    all:
      - id: micro-behaviors/crypto/decrypt::node-aes-gcm-decipher-initialization
      - id: micro-behaviors/data/decompress/brotli::node-brotli-decompress-function
      - id: micro-behaviors/process/io/stream::js-stdin-write
      - id: metadata/lang/source/syntax/key-value::node-windowshide-true-option
    any:
      - id: micro-behaviors/process/create/direct::bun-spawn-call
      - id: micro-behaviors/process/create/exec::spawn-variable-program
