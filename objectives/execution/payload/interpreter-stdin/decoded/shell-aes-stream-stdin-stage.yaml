defaults:
  platforms: [unix]
  for: [shell]
  attack: T1059.004,T1027
composite_rules:
  # A shell script decrypts an embedded AES stream and feeds the output to a
  # shell's stdin. The command names are often assembled from variables, so
  # the literal `openssl` may be absent; the cipher option and the stdin
  # handoff still establish the stage.
  - id: shell-aes-stream-stdin-stage
    desc: Shell decrypts an AES stream and pipes it into a shell
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: metadata/lang/source/syntax/command/options::openssl-cli-aes-stream-decrypt
      - id: micro-behaviors/process/deploy/interpreter-stdin/input::variable-text-piped-into-shell-stdin
      - id: micro-behaviors/process/create/shell/variable-command::shell-multiple-dynamic-command-targets
