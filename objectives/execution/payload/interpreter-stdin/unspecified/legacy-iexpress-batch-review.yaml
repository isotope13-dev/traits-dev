defaults:
  platforms:
  - windows
composite_rules:
- id: iexpress-piped-file-command
  desc: IExpress executes file contents piped to cmd
  crit: hostile
  conf: 0.99
  all:
  - id: well-known/lib/platform/microsoft-advpack::advpack-delnode-entrypoint-text
  - id: micro-behaviors/process/create/shell/pipeline::cmd-file-piped-command-interpreter
  - id: metadata/binary/symbols/name/process::create-process-a
  any:
  - id: metadata/installer/builder/iexpress::iexpress
  - id: metadata/installer/builder/iexpress::wextract-tool
  for:
  - pe
