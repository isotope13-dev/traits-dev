defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
  attack: T1195.002
composite_rules:
  - id: setup-py-install-base64-shell-pipe
    desc: Install hook pipes a decoded blob to a shell
    crit: hostile
    conf: 0.97
    scope: archive
    for:
      - python
      - package.json
      - tar
      - zip
      - whl
    attack: T1195.002,T1027,T1059.004
    mbc: B0032,E1027
    all:
      - id: metadata/build/package/recipe/setup-hooks::python-install-hook
      - id: micro-behaviors/process/deploy/interpreter-stdin/decoded::base64-input-shell-execution
