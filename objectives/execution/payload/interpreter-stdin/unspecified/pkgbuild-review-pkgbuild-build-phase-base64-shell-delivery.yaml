defaults:
  platforms: [linux]
  for: [shell]
  attack: T1195.002
composite_rules:
  - id: pkgbuild-build-phase-base64-shell-delivery
    desc: PKGBUILD has encoded URL and decoded shell execution clues
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.004,T1105,T1195.002
    near_lines: 80
    all:
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-build-fn
      - id: objectives/anti-static/obfuscation/encoding/base64::double-base64-pipe-sh
      - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
    unless:
      - id: well-known/tool/detection/security-scanner-identity::ks-aur-test-or-crate-member
