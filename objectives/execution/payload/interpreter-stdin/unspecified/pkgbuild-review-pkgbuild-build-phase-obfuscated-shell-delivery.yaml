defaults:
  platforms: [linux]
  for: [shell]
  attack: T1195.002
composite_rules:
  - id: pkgbuild-build-phase-obfuscated-shell-delivery
    desc: PKGBUILD build phase decodes and executes a shell downloader
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.004,T1105,T1195.002
    scope: file
    all:
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-build-fn
      - id: objectives/anti-static/obfuscation/encoding/base64::double-base64-pipe-sh
      - id: objectives/anti-static/obfuscation/encoding/content::encoded-downloader-pattern
    unless:
      - id: well-known/tool/detection/security-scanner-identity::ks-aur-test-or-crate-member
