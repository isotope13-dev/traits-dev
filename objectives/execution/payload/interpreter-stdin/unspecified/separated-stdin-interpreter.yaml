defaults:
  platforms: [macos, unix]
  for: [shell]
composite_rules:
  - id: aes-gcm-decompressed-stdin-interpreter-spawn
    desc: AES-GCM and Brotli stage piped to hidden interpreter stdin
    crit: hostile
    conf: 0.98
    platforms: [unix, windows]
    for: [javascript, typescript]
    attack: T1059.007,T1027,T1140
    all:
      - id: micro-behaviors/crypto/decrypt/initialize::node-aes-gcm-decipher-initialization
      - id: micro-behaviors/data/decompress/brotli::node-brotli-decompress-function
      - id: micro-behaviors/process/stdio/write::js-stdin-write
      - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
    any:
      - id: micro-behaviors/process/create/exec::bun-spawn-call
      - id: micro-behaviors/process/create/variable::spawn-variable-program
  - id: shell-octal-aes-variable-piped-stdin
    desc: Octal-obfuscated AES decryption script pipes variable stage into shell stdin
    crit: hostile
    conf: 0.98
    attack: T1059.004,T1027,T1140
    all:
      - id: objectives/anti-static/obfuscation/decryption::shell-aes-decrypt-with-dynamic-commands-and-hex
      - id: micro-behaviors/data/decode/char-code::shell-printf-octal-substitution-format
      - id: micro-behaviors/process/deploy/interpreter-stdin/input::variable-text-piped-into-shell-stdin
