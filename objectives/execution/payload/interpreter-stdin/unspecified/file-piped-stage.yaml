defaults:
  platforms: [windows]
  for: [batch]
  attack: T1059.003,T1105

composite_rules:
  - id: echoed-remote-fetch-pipe-stager
    desc: Writes remote fetch-to-cmd pipeline into local stage file
    crit: hostile
    conf: 0.98
    near_lines: 0
    all:
      - id: micro-behaviors/process/create/shell/pipeline::echo-fetch-pipe-cmd-redirect
      - id: micro-behaviors/fs/write/file/redirect::batch-echo-redirect

  - id: batch-disguised-ext-piped-stage
    desc: Extension-mismatched batch script pipes stage file to interpreter
    crit: hostile
    conf: 0.97
    attack: T1059.003,T1036.008
    all:
      - id: metadata/file/extension/mismatch::batch-content-extension-mismatch
      - id: micro-behaviors/process/create/shell/pipeline::more-or-type-pipe-to-cmd

  - id: shell-fetch-stage-piped-to-interpreter
    desc: Unix shell downloads and pipes disguised stage file to shell
    crit: hostile
    conf: 0.96
    platforms: [linux, macos]
    attack: T1059.004,T1105
    for: [shell]
    all:
      - id: objectives/execution/payload/interpreter-stdin/unspecified::cat-nonscript-suffix-pipe-shell
      - id: micro-behaviors/communications/http/download/cli/curl-wget::curl-wget-command
