defaults:
  platforms: [windows]
  for: [batch]
  attack: T1059.003,T1105

composite_rules:
  - id: echoed-remote-fetch-pipe-stager
    desc: Writes remote fetch-to-cmd pipeline into local stage file
    crit: hostile
    conf: 0.98
    near_lines: 0
    all:
      - id: micro-behaviors/process/create/shell/pipeline::echo-fetch-pipe-cmd-redirect
      - id: micro-behaviors/fs/write/file/redirect::batch-echo-redirect

  - id: batch-disguised-ext-piped-stage
    desc: Extension-mismatched batch script pipes stage file to interpreter
    crit: hostile
    conf: 0.97
    attack: T1059.003,T1036.008
    all:
      - id: metadata/file/extension/mismatch::batch-content-extension-mismatch
      - id: micro-behaviors/process/create/shell/pipeline::more-or-type-pipe-to-cmd

  - id: shell-fetch-stage-piped-to-interpreter
    desc: Unix shell downloads and pipes disguised stage file to shell
    crit: hostile
    conf: 0.96
    platforms: [linux, macos]
    attack: T1059.004,T1105
    for: [shell]
    all:
      - id: objectives/execution/payload/interpreter-stdin/unspecified::cat-nonscript-suffix-pipe-shell
      - id: micro-behaviors/communications/http/download/cli/curl-wget::curl-wget-command

  # An ftp.exe -s: script whose bang escape feeds a media-named stage into a
  # shell interpreter (`!more res.ico|cmd`): indirect execution of a second
  # stage disguised as an image. The bang line supplies the FTP-script context;
  # the pipe supplies the disguised stage. No terminator command is required.
  - id: ftp-media-stage-pipe-exec
    desc: FTP script pipes media-named stage into interpreter
    crit: hostile
    conf: 0.97
    attack: T1202,T1059.003,T1036.008
    for: [batch, text, media]
    all:
      - id: micro-behaviors/communications/ftp/client::ftp-bang-local-shell-escape
    any:
      - id: objectives/execution/payload/interpreter-stdin/unspecified::image-suffix-pipe-interpreter
      - id: objectives/execution/payload/interpreter-stdin/unspecified::photo-suffix-pipe-interpreter
