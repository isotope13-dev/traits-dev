defaults:
  platforms:
    - windows
    - linux
    - macos
  for:
    - shell
    - python
    - javascript
    - ruby
    - perl
    - applescript
composite_rules:
  - id: decompressed-payload-piped-interpreter-stdin
    desc: Decompressed payload piped to spawned interpreter stdin
    crit: hostile
    conf: 0.98
    attack: T1059.007,T1027
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin/input::node-spawn-interpreter-stdin
    any:
      - id: micro-behaviors/data/decompress/brotli::node-brotli-decompress-function
      - id: micro-behaviors/data/decompress/gzip::gunzip-call-text
      - id: micro-behaviors/data/decompress/zlib::node-inflate-function
