defaults:
  platforms: [windows]
  attack: T1059.003

traits:
  - id: cat-nonscript-suffix-pipe-shell
    desc: Non-script suffix piped into Unix shell
    crit: suspicious
    conf: 0.95
    platforms: [linux, macos]
    attack: T1059.004
    for: [shell, text]
    if:
      type: text
      regex: '\bcat\s+\S{1,120}\.(log|ico|tmp)\s*\|\s*(ba)?sh\b'
  # Windows sibling of cat-nonscript-suffix-pipe-shell: the stage wears a media
  # suffix (`more res.ico|cmd`), so cmd.exe or PowerShell is fed image-named
  # text through the pipe. No benign pipeline feeds an image into a shell
  # interpreter; the suffix classes are split across two traits to stay inside
  # the three-alternation regex budget.
  - id: image-suffix-pipe-interpreter
    desc: Image-suffix file piped into Windows interpreter
    crit: suspicious
    conf: 0.95
    attack: T1059.003,T1036.008
    for: [batch, text, media, ico]
    if:
      type: text
      regex: '(?i)\b(more|type)\s+\S{1,100}\.(ico|png|gif)\^?\|[ \t\^]*[cp][a-z]{2}'
  - id: photo-suffix-pipe-interpreter
    desc: Photo-suffix file piped into Windows interpreter
    crit: suspicious
    conf: 0.95
    attack: T1059.003,T1036.008
    for: [batch, text, media, ico]
    if:
      type: text
      regex: '(?i)\b(more|type)\s+\S{1,100}\.(jpe?g|bmp|tiff?)\^?\|[ \t\^]*[cp][a-z]{2}'
