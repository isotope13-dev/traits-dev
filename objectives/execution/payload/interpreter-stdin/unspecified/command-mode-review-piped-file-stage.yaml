defaults:
  platforms: [windows]
  attack: T1059.003

traits:
  - id: cat-nonscript-suffix-pipe-shell
    desc: Non-script suffix piped into Unix shell
    crit: suspicious
    conf: 0.95
    platforms: [linux, macos]
    attack: T1059.004
    for: [shell, text]
    if:
      type: text
      regex: '\bcat\s+\S{1,120}\.(log|ico|tmp)\s*\|\s*(ba)?sh\b'
