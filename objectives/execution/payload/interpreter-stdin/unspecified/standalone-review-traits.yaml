defaults:
  platforms: [windows, unix]
composite_rules:
  - id: python-release-stdin-payload-execution
    desc: Python release clues and stdin payload execution
    crit: hostile
    conf: 0.99
    attack: T1059.006
    for:
      - javascript
      - typescript
    all:
      - id: metadata/lang/source/shape::python-standalone-release-marker-context
      - id: micro-behaviors/process/deploy/interpreter-stdin/input::js-python-stdin-payload-exec
      - id: metadata/import/builtin::require-child-process
