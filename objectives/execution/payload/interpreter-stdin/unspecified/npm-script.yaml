# An npm script piping content into an interpreter (`| sh`, `| bash`,
# `| perl`, `| python`). Specific documented installers and local text
# pipes are carved out by package context.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: npm-script-pipe-to-interpreter
    desc: npm script pipes content to interpreter
    crit: suspicious
    conf: 0.9
    attack: T1059
    if:
      type: value
      path: scripts.*
      # A single pipe; `a || sh x.sh` is a logical-or fallback that runs a
      # file, not content piped into an interpreter.
      regex: '(^|[^|])\|\s*(sh|bash|perl|python[23]?)\b'
    unless:
      - id: metadata/package/scripts/lifecycle::pipe-execute-benign-package-context
      # Documented opt-in installers a developer runs by hand.
      - type: value
        path: scripts.*
        regex: '^\s*curl https://tinybird\.co \| sh\s*$'
      - type: value
        path: scripts.*
        substr: https://rustwasm.github.io/wasm-pack/installer/init.sh
