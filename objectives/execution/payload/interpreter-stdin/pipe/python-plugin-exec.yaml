defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059.006,T1564.003
  mbc: B0022

composite_rules:
  - id: python-hidden-stdin-compiled-plugin-exec
    desc: Python launches hidden child interpreter and executes dynamic code
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/interpreter/python::subprocess-run-sys-executable
      - id: micro-behaviors/process/stdio/write::python-child-stdin-write
      - id: micro-behaviors/process/stdio/read::stdin-read-or-reference
      - id: micro-behaviors/process/interpreter/eval/constructed::exec-compiled-code
      - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
    any:
      - id: micro-behaviors/process/config/launch::python-create-no-window-hex
      - id: micro-behaviors/process/config/launch::python-create-no-window-constant-define
      - id: micro-behaviors/process/config/launch::creationflags
      - id: micro-behaviors/process/config/launch::python-qualified-create-no-window
