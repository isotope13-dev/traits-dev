defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-container-stealth-write-exec-indicators
    desc: Go payload, stealth, file-write and process-start indicators
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/string/container::payload-container-name-text
      - id: objectives/anti-analysis/sandbox-detect/routine-name::stealth-check-runner
      - id: micro-behaviors/data/decompress/zstd::go-zstd-decoder-pclntab
      - id: micro-behaviors/fs/write/file/full/reference::go-write-file-reference
      - id: micro-behaviors/process/create/runtime-symbol::go-native-exec-command-reference
      - id: micro-behaviors/process/create/runtime-symbol::go-cmd-start-method-symbol
