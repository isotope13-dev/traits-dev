defaults:
  platforms: [windows]
  for: [python]

composite_rules:
  - id: obfuscated-zip-forfiles-launcher
    desc: Obfuscated ZIP and forfiles payload launch
    crit: suspicious
    conf: 0.98
    attack: T1027,T1059.003
    # File-scoped co-occurrence; do not claim an unproved byte-to-process flow.
    all:
      - id: objectives/anti-static/obfuscation/encoding/layered::base64-xor-transform
      - id: micro-behaviors/data/archive/zip::python-zipfile-handle
      - id: micro-behaviors/process/create/shell/command-string::forfiles-payload-command-array
