defaults:
  platforms: [windows]
  for: [python]

composite_rules:
  - id: obfuscated-zip-forfiles-launcher
    desc: Obfuscated ZIP and forfiles payload launch
    crit: suspicious
    conf: 0.98
    attack: T1027,T1059.003
    # File-scoped co-occurrence; do not claim an unproved byte-to-process flow.
    all:
      - id: objectives/anti-static/obfuscation/encoding/layered::base64-xor-transform
      - id: micro-behaviors/data/archive/zip::python-zipfile-handle
      - id: micro-behaviors/process/create/shell/command-string::forfiles-payload-command-array

  # XOR/base64 zip, ZoneId=0 on the extracted files, then forfiles. Each
  # leg alone is a clue; together the script clears the download mark and
  # launches the decoded archive.
  - id: zone-cleared-decoded-zip-forfiles
    desc: Zone-cleared zip launches via forfiles
    crit: hostile
    conf: 0.98
    attack: T1553.005,T1027,T1059.003
    all:
      - id: obfuscated-zip-forfiles-launcher
      - id: objectives/evasion/security-bypass/policy/execution::local-zone-record-with-forfiles-launch
