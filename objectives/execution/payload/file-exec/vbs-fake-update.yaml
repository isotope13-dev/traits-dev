defaults:
  platforms:
  - windows
  for:
  - vbs
composite_rules:
- id: fake-update-concealed-archive-execution
  desc: Fake Microsoft update stages and launches an archive executable
  crit: hostile
  conf: 0.99
  attack: T1036,T1059.005,T1105
  all:
  - id: micro-behaviors/process/deploy::vbs-curl-tar-folder-exe-launch
  - id: objectives/anti-static/obfuscation/string/reconstruct::vbs-fragmented-curl-tar-paths
  - id: metadata/vendor/string::vbs-microsoft-update-header
  - id: metadata/vendor/string::vbs-microsoft-copyright-header
