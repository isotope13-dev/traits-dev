defaults:
  platforms: [windows]

composite_rules:
  - id: powershell-defender-exclusion-iwr-7za-dropper
    desc: Defender exclusion with IWR 7-Zip extract and payload launch
    crit: hostile
    conf: 0.98
    attack: T1562.001,T1105,T1204.002
    mbc: B0030
    for: [powershell]
    near_bytes: 16384
    all:
      - id: micro-behaviors/os/security/defender::defender-exclusion-command
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/data/archive/extract/password::sevenzip-invoke-variable-password-extract
      - id: micro-behaviors/process/create/exec::start-process-call
      - id: micro-behaviors/fs/path/temp::env-temp
