defaults:
  platforms: [windows]
  for: [html]
  crit: hostile
  conf: 0.98
composite_rules:
  - id: obfuscated-vbscript-appdata-download-invocation
    desc: VBScript conceals script download and invocation
    attack: T1059.005,T1059.001,T1105,T1027
    all:
      - id: micro-behaviors/process/interpreter/scripting::html-vbscript-block
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-expression-command-text
      - id: micro-behaviors/communications/http/download/encoded::encoded-urlmon-appdata-script-download
      - id: micro-behaviors/process/create/shellexec::decoded-appdata-wsh-item-launch
      - id: objectives/anti-static/obfuscation/string/case::powershell-case-randomized
