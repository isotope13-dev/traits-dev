defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-appdata-download-and-invocation
    desc: PowerShell downloads and invokes AppData scripts
    crit: suspicious
    conf: 0.95
    attack: T1059.001,T1105
    # These are nearby operations, not a same-path data-flow claim.
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/download/cli::powershell-web-appdata-script-output
      - id: micro-behaviors/process/interpreter/eval/source::powershell-appdata-script-invocation
