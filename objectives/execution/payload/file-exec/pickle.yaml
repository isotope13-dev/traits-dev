defaults:
  platforms: [unix]
  for: [pickle]

composite_rules:
  - id: pickle-downloaded-script-detached-launch
    desc: Pickle exec downloads and detaches same script
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/interpreter/pickle::exec-shell-downloader
      - id: micro-behaviors/process/deploy::pickle-urlretrieve-setsid-same-path
