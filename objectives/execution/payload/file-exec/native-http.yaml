defaults:
  platforms: [linux, macos]
  for: [elf, macho]
  attack: T1105,T1071.001
  mbc: B0030

composite_rules:
  - id: macho-execvp-http-downloader
    desc: HTTP XOR stage loader with hidden-file execution APIs
    crit: hostile
    conf: 0.97
    platforms: [macos]
    for: [macho]
    size_max: 131072
    all:
      - id: micro-behaviors/process/create/execv::c-exec-variants
      - id: micro-behaviors/communications/http/get::get
      - id: micro-behaviors/communications/http/message::http-header-field-delimiter
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: micro-behaviors/communications/socket/connect::connect-import
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/data/encoding/xor::macho-stack-indexed-byte-xor-loop
      - id: micro-behaviors/communications/socket/receive::recv-symbol
      - id: micro-behaviors/fs/write/file/handle::write--fwrite
      - id: micro-behaviors/fs/chmod/modify::chmod-symbol
      - id: micro-behaviors/fs/path/temp::hidden-tmp-path
    any:
      - id: micro-behaviors/fs/path/log/application::stop-log-path-reference
      - id: micro-behaviors/process/info/name::bracketed-kworker-name-reference
      - id: micro-behaviors/communications/http/query::formatted-get-query-template
    needs: 1
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/sysadmin/unix-benign/
      - id: "metadata/file/naming::test-directory-component"
  - id: macho-execvp-tcp-downloader
    desc: Hidden TCP stage loader with byte XOR decoding and execvp
    crit: hostile
    conf: 0.96
    platforms: [macos]
    for: [macho]
    attack: T1105,T1140
    size_max: 131072
    all:
      - id: micro-behaviors/process/create/execv::c-exec-variants
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: micro-behaviors/communications/socket/connect::connect-import
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/socket/receive::recv-symbol
      - id: micro-behaviors/data/encoding/xor::macho-stack-indexed-byte-xor-loop
      - id: micro-behaviors/fs/write/file/handle::write--fwrite
      - id: micro-behaviors/fs/chmod/modify::chmod-symbol
      - id: micro-behaviors/fs/path/temp::hidden-tmp-path
    any:
      - id: micro-behaviors/fs/path/log/application::stop-log-path-reference
      - id: micro-behaviors/process/info/name::bracketed-kworker-name-reference
    needs: 1
    unless:
      - id: macho-execvp-http-downloader
      - id: metadata/package/testing/
      - id: well-known/tool/sysadmin/unix-benign/
      - id: "metadata/file/naming::test-directory-component"
  - id: linux-fexecve-http-downloader
    desc: HTTP XOR loader with memfd and fexecve APIs
    crit: hostile
    conf: 0.97
    platforms: [linux]
    for: [elf]
    size_max: 131072
    all:
      - id: micro-behaviors/process/create/exec::fexecve-import
      - id: objectives/execution/payload/file-exec::xor-anonymous-stage-loader
      - id: micro-behaviors/communications/http/get::get
      - id: micro-behaviors/communications/http/message::http-header-field-delimiter
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: micro-behaviors/communications/socket/connect::connect-import
      - id: micro-behaviors/communications/socket/create::posix-socket-import
    any:
      - id: micro-behaviors/fs/path/log/application::stop-log-path-reference
      - id: micro-behaviors/process/info/name::per-cpu-kworker-name-reference
      - id: micro-behaviors/communications/http/query::formatted-get-query-template
    needs: 1
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/sysadmin/unix-benign/
      - id: "metadata/file/naming::test-directory-component"
  - id: linux-fexecve-tcp-downloader
    desc: TCP loader with fexecve execution references
    crit: hostile
    conf: 0.96
    platforms: [linux]
    for: [elf]
    size_max: 131072
    all:
      - id: micro-behaviors/process/create/exec::fexecve-import
      - id: objectives/execution/payload/file-exec::xor-anonymous-stage-loader
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: micro-behaviors/communications/socket/connect::connect-import
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/socket/receive::recv-symbol
    any:
      - id: micro-behaviors/fs/path/log/application::stop-log-path-reference
      - id: micro-behaviors/process/info/name::per-cpu-kworker-name-reference
    needs: 1
    unless:
      - id: linux-fexecve-http-downloader
      - id: metadata/package/testing/
      - id: well-known/tool/sysadmin/unix-benign/
      - id: "metadata/file/naming::test-directory-component"

  # Multiverze-style ARM TCP pullers: recv a stage over a socket and fexecve
  # it without an XOR decode loop (distinct from xor-anonymous-stage-loader).
  - id: linux-fexecve-plain-tcp-downloader
    desc: Plain TCP stage loader executing received image with fexecve
    crit: hostile
    conf: 0.96
    platforms: [linux]
    for: [elf]
    size_max: 131072
    all:
      - id: micro-behaviors/process/create/exec::fexecve-import
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: micro-behaviors/communications/socket/connect::connect-import
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/socket/receive::recv-symbol
    any:
      - id: micro-behaviors/fs/path/log/application::stop-log-path-reference
      - id: micro-behaviors/process/info/name::per-cpu-kworker-name-reference
    needs: 1
    unless:
      - id: linux-fexecve-tcp-downloader
      - id: linux-fexecve-http-downloader
      - id: metadata/package/testing/
      - id: well-known/tool/sysadmin/unix-benign/
      - id: "metadata/file/naming::test-directory-component"

  - id: linux-kworker-name-fexecve-tcp-stager
    desc: TCP fexecve stager referencing kworker process name
    crit: hostile
    conf: 0.95
    platforms: [linux]
    for: [elf]
    size_max: 131072
    all:
      - id: micro-behaviors/process/create/exec::fexecve-import
      - id: micro-behaviors/process/info/name::per-cpu-kworker-name-reference
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: micro-behaviors/communications/socket/connect::connect-import
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/socket/receive::recv-symbol
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/sysadmin/unix-benign/
      - id: "metadata/file/naming::test-directory-component"
