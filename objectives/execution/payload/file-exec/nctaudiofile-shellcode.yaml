defaults:
  platforms: [windows]
  for: [html, javascript]
composite_rules:
  - id: packed-activex-urlmon-winexec-payload
    desc: ActiveX exploit with URLMon and WinExec payload
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/exploit/memory::packed-nctaudiofile2-shellcode-overflow
      - id: micro-behaviors/communications/http/client/urlmon::packed-urldownloadtofile-permuted-words
      # WinExec's ROR13 hash 0x0e8afe98, split into little-endian words.
      - id: micro-behaviors/os/api-resolution/hash-based::packed-x86-winexec-hash-words
