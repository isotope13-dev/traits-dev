defaults:
  platforms: [windows]
  for: [html]
  crit: hostile
  conf: 0.98
composite_rules:
  - id: vbscript-encoded-temp-download-launch
    desc: VBScript hides download and TEMP script launch
    attack: T1059.005,T1059.001,T1105
    all:
      - id: micro-behaviors/process/interpreter/scripting::html-vbscript-block
      - id: micro-behaviors/process/interpreter/eval/direct::base64-powershell-eval-command
      - id: micro-behaviors/communications/http/download/encoded::encoded-urlmon-file-download-call
      - id: micro-behaviors/process/create/shellexec::decoded-temp-wsh-script-launch
      - id: objectives/anti-static/obfuscation/string/case::powershell-case-randomized
