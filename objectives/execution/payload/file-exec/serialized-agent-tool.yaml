# A single serialized exec_command request, as stored in a training row or
# Responses-style tool-call artifact. Read structured fields so key order and
# JSON escaping do not matter. Nested conversations are outside this rule.
# Stored instructions do not prove that a model is poisoned or a call ran.
# Path identity is not asserted here; the shell AST rule proves that claim.
defaults:
  platforms: [unix]
  for: [json]
  crit: suspicious
  conf: 0.94
  attack: T1105,T1059.004

composite_rules:
  - id: serialized-agent-hidden-temp-shell-chain
    desc: Agent tool request stages and invokes hidden scripts
    all:
      - id: micro-behaviors/data/llm/tool-call::serialized-exec-command-name
      - id: metadata/lang/source/syntax/command::json-hidden-temp-shell-arguments
