# CDN executable URL alongside a linked HTTP-file-to-hidden-shell activation.
# The chain binds the saved path to execution; the URL leg is co-occurrence,
# not proof that this particular URL supplies the saved bytes.
# Updaters remain possible; the bytes justify suspicion rather than hostility.
defaults:
  platforms: [windows]
  for: [python]
composite_rules:
  - id: python-cdn-executable-hidden-shell
    desc: Hidden HTTP file launch beside Discord executable URL
    crit: suspicious
    conf: 0.98
    attack: T1105,T1059.003
    all:
      - id: micro-behaviors/process/deploy/file-exec::python-streamed-download-hidden-shell
      - id: micro-behaviors/communications/http/url/cloud::discord-cdn-executable-url
