# Untrusted CDN executable source plus a linked hidden-shell activation.
# Updaters remain possible; the bytes justify suspicion rather than hostility.
defaults:
  platforms: [windows]
  for: [python]
composite_rules:
  - id: python-cdn-executable-hidden-shell
    desc: CDN executable feeds a hidden shell
    crit: suspicious
    conf: 0.98
    attack: T1105,T1059.003
    all:
      - id: micro-behaviors/process/deploy/file-exec::python-streamed-download-hidden-shell
      - id: micro-behaviors/communications/http/url/cloud::discord-cdn-executable-url
