defaults:
  platforms: [windows]
composite_rules:
- id: node-windows-wsh-persistence-remote-dropper
  desc: Node Windows dropper fetches remote payload with logon persistence
  crit: hostile
  conf: 0.98
  attack: T1105,T1059.005,T1059.007,T1547.001
  scope: file
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/communications/http/request/client::node-http-client-scheme-selection
  - id: micro-behaviors/fs/write/file/full::node-write-sync-buffer
  - id: micro-behaviors/os/autorun/login-items::windows-logon-script-reference
  - id: micro-behaviors/os/autorun/login-items::shortcut-creation-startup-reference
  - id: objectives/evasion/self-delete/file/script::js-self-deletion-pattern
  - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
