defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: node-unverified-detached-response-launch
    desc: Unverified detached payload with self-removal
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.007,T1564.003
    scope: leaf
    near_bytes: 2048
    all:
      - id: micro-behaviors/process/deploy/file-exec::node-buffered-response-runtime-launch
      - id: micro-behaviors/communications/tls/verify/disable::node-https-get-verification-disabled
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/fs/delete/file/self::unlink-filename
