defaults:
  platforms: [windows]
  for: [html]
composite_rules:
  # Browser-hosted native payload preparation and process launch establish
  # boundary crossing; ordinary standalone VBS automation is excluded.
  # This is co-occurrence, not a source-to-sink variable binding.
  - id: wsh-browser-embedded-pe-launch
    desc: Browser hex PE staging accompanies WSH launch
    crit: hostile
    conf: 0.98
    near_lines: 24
    attack: T1059.005,T1027.009
    all:
      - id: micro-behaviors/fs/write/content::wsh-hex-pe-write-context
      - id: micro-behaviors/process/interpreter/scripting::html-vbscript-block
      - id: micro-behaviors/process/create/shell/script-host::wscript-shell-run-create
