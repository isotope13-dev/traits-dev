defaults:
  for: [html]
  platforms: [windows]
composite_rules:
  - id: http-exe-saved-hidden-launch
    desc: Saved HTTP executable launches hidden
    crit: hostile
    conf: 0.98
    attack: T1105,T1204
    near_bytes: 6000
    all:
      - id: micro-behaviors/communications/http/url/script::http-executable-url-reference
      - id: micro-behaviors/fs/write/stream::vbs-write-http-response-body
      - id: micro-behaviors/fs/write/stream::wsh-savetofile
      - id: micro-behaviors/process/create/shellexec::shellexecute-hidden-showcmd
