# Admission: the entry graft restores the host's control flow and scans an
# inline PE. The linked write/close/launch layout activates that image.
# A host product name such as 7-Zip suppresses the static second-MZ trait,
# so the scan-and-launch code is the evidence.
defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
composite_rules:
  - id: parasitic-inline-pe-file-launch
    desc: Parasitic entry graft writes and launches an inline PE
    crit: hostile
    conf: 0.98
    attack: T1554,T1106
    all:
      - id: objectives/impact/infect/binary/rewrite::parasitic-entrypoint-api-resolution-profile
      - id: metadata/binary/instruction/sequence::x86-buffer-and-path-call-layout
    near_bytes: 1024
