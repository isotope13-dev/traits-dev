# WSH JScript/VBScript droppers built with javascript-obfuscator: the
# PowerShell launch line survives only as \x20-escaped token arrays, and the
# MSXML/FileSystemObject ProgIDs stay fully string-encrypted, so ProgID- and
# URL-shaped composites miss the sample. The stable residue is the
# ActiveXObject constructor, obfuscator name mangling, and the escaped
# "powershell -nop -ep bypass -file" launch of a staged script path.
defaults:
  crit: hostile
  conf: 0.96
  for: [javascript]
  platforms: [windows]
  attack: T1027,T1059.001,T1059.007,T1105,T1562.001
composite_rules:
  - id: obfuscated-wsh-powershell-file-exec
    desc: Obfuscated WSH script launches a staged script via PowerShell -file
    all:
      - id: micro-behaviors/os/com/automation::activex-constructor-call
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
    any:
      - id: micro-behaviors/process/create/flags::powershell-nop-ep-bypass-file-command
      - id: micro-behaviors/process/argument/option::escaped-noprofile-policy-bypass-fragment
      - id: micro-behaviors/process/argument/option::escaped-file-argument-fragment
    needs: 1
