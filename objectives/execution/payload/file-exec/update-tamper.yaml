defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  # The update dialog requires consent. This is downloaded image activation
  # within an admitted security-update tamperer, not a silent drive-by claim.
  - id: update-tamper-proxy-replaces-and-launches-image
    desc: Tampering proxy replaces and launches fetched image
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/evasion/anti-av/verification::eset-update-signature-suppression-proxy
      - id: micro-behaviors/process/deploy::x86-image-swap-relaunch
      - id: micro-behaviors/communications/http/download/url::downurl-stage-directive-pe
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-text-download-flow
