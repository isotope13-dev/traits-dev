# Payload installer stage on Android: an APK received as a stream is written
# into a PackageInstaller MODE_FULL_INSTALL session and committed, right
# after the Play Store app was disabled from a shell. The staged package is
# activated through the platform installer while the store's scanner is
# offline -- the installer sink of a dropper chain. The system-wide disable
# literal is required: the per-user `disable-user --user N` suppression is
# the managed-provisioning shape (store suppressed for one user around a
# staged install, restored afterwards), not the device-wide Play Protect
# blinding the dropper form performs.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1631,T1629.003

composite_rules:
  - id: store-disabled-apk-session-install
    desc: Commits APK install session after disabling store
    crit: hostile
    conf: 0.95
    near_bytes: 1800
    all:
      - id: micro-behaviors/os/package-manager/management::android-launched-play-store-disable
      - id: micro-behaviors/os/package-manager/management::android-play-store-system-disable-literal
      - id: micro-behaviors/os/package-manager/sideload::android-programmatic-apk-install
      - id: micro-behaviors/os/package-manager/sideload::android-session-payload-write-commit
