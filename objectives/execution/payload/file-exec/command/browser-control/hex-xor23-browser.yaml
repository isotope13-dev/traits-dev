defaults:
  for: [html]
  platforms: [windows]
  crit: hostile
  conf: 0.98
  attack: T1189,T1027
composite_rules:
- id: hex-xor23-concealed-browser-download-launch
  desc: Concealed browser response save and file launch
  all:
  - id: objectives/anti-static/obfuscation/eval/loader::vbs-execute-hex-xor-code
  - id: micro-behaviors/fs/write/stream::xor23-write-http-response-body
  - id: micro-behaviors/fs/write/stream::xor23-savetofile-method
  - id: micro-behaviors/os/handler/open::xor23-shellexecute-method
# Same chain matched on the raw hex text. Multi-line payloads decode to
# 0x1A/0x1D line breaks, so the hex decoder above never yields their text.
- id: hex-xor23-text-concealed-download-launch
  desc: XOR-23 hex hides .exe fetch, save, launch
  attack: T1189,T1027,T1105
  all:
  - id: objectives/anti-static/obfuscation/eval/loader::vbs-execute-hex-xor-code
  - id: micro-behaviors/communications/url/resource-path/file::xor23-hex-text-http-executable-url
  - id: micro-behaviors/fs/write/stream::xor23-hex-text-responsebody
  - id: micro-behaviors/fs/write/stream::xor23-hex-text-savetofile
  - id: micro-behaviors/os/handler/open::xor23-hex-text-shellexecute
