defaults:
  platforms: [windows, unix]
  crit: suspicious
  attack: "T1105"
  mbc: "E1105"
  for: [python, shell]

composite_rules:
  - id: high-bit-array-download-save-execute
    desc: High-bit array downloads and executes file
    crit: hostile
    conf: 0.98
    for: [html]
    platforms: [windows]
    all:
      - id: micro-behaviors/communications/http/client/xmlhttp::numeric-array-high-bit-get-request
      - id: micro-behaviors/communications/http/client/xmlhttp::numeric-array-high-bit-http-send
      - id: micro-behaviors/fs/write/file/stream::numeric-array-high-bit-save-to-file
      - id: metadata/lang/encoding/hex::numeric-array-high-bit-shell-run
