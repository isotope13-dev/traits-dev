defaults:
  platforms: [windows]
  for: [html, javascript]
  attack: T1105,T1059.007

traits:
  - id: split-xmlhttp-progid
    desc: Constructs XMLHTTP from string fragments
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Micro["'']\s*\+\s*["'']soft\.XM["'']\s*\+\s*["'']LHT["'']\s*\+\s*["'']TP'

  - id: split-adodb-stream-progid
    desc: Constructs ADODB.Stream from string fragments
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)AD["'']\s*\+\s*["'']ODB\.St["'']\s*\+\s*["'']ream'

  - id: dynamic-object-codebase
    desc: Inserts object with dynamic codebase
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)<object\s+classid=.{0,100}codebase='

composite_rules:
  - id: split-com-http-stream-object-download
    desc: Obfuscated COM downloader inserts executable object
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: split-xmlhttp-progid
      - id: split-adodb-stream-progid
      - id: dynamic-object-codebase
      - id: micro-behaviors/communications/http/client/response-body::javascript-response-body
      - id: micro-behaviors/fs/write/file/stream::js-savetofile-dynamic-path-mode-2
