defaults:
  for: [java_class]
  platforms: [windows]
  attack: T1059.007,T1027

traits:
  - id: java-wscript-token
    desc: Java class references Windows Script Host
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: wscript
      case_insensitive: true
  - id: java-random-js-output-name
    desc: Java class names script with random-looking stem
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '^[a-z]{10,20}\.js$'
      is: random_like

composite_rules:
  - id: java-resource-random-js-wscript-loader
    desc: Java extracts and runs randomly named script
    crit: hostile
    conf: 0.97
    all:
      - id: java-wscript-token
      - id: java-random-js-output-name
      - id: metadata/import/jvm::java-runtime-exec-bytecode-reference
      - id: metadata/import/jvm::jvm-fileoutputstream-bytecode
      - id: micro-behaviors/data/embedded/payload/resource::java-class-getresourceasstream
      - id: micro-behaviors/os/user/lookup::java-user-home-property-constant
