composite_rules:
- platforms:
  - windows
  for:
  - batch
  - powershell
  attack: T1027, T1059.001, T1059.003
  id: encoded-powershell-batch-write-invoke
  desc: Encoded PowerShell batch write and invocation
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/lang/source/syntax/argument::encodedcommand-option-reference
  - id: micro-behaviors/fs/write/file/full/unspecified::decoded-powershell-base64-batch-write
  - id: metadata/lang/source/syntax/operator::decoded-powershell-call-batch-variable
