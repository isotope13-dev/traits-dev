# Batch counterpart of windows-raw-ip.yaml: certutil's URL cache fetches an
# executable from a bare external IPv4 address and the script starts it.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1105,T1204.002
  crit: hostile
composite_rules:
  - id: batch-raw-ip-certutil-download-launch
    desc: Batch fetches an executable from a raw IP with certutil and starts it
    conf: 0.95
    near_lines: 8
    all:
      - id: micro-behaviors/process/deploy/file-exec::batch-certutil-exe-download-launch
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/
