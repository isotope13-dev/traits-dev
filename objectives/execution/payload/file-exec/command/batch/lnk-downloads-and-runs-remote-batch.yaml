defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1204.002

composite_rules:
  - id: lnk-downloads-and-runs-remote-batch
    desc: LNK BITS download and batch launch clues
    crit: hostile
    conf: 0.97
    attack: T1105,T1204.002
    all:
      - id: micro-behaviors/communications/http/download/cli/utility::lnk-args-bitsadmin-download
      - id: micro-behaviors/fs/path/script::lnk-args-http-batch-reference
      - id: micro-behaviors/process/interpreter/shell::lnk-args-call-batch
