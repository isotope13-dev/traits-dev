defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027

composite_rules:
  - id: vbs-staged-obfuscated-batch-dropper
    desc: VBScript writes and runs an array-staged obfuscated batch loader
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.003,T1059.005
    mbc: B0032
    all:
      - id: objectives/anti-static/obfuscation/string/fragmentation::vbs-envvar-spliced-echo
      - id: objectives/anti-static/obfuscation/string/fragmentation::vbs-envvar-base64-assignment-fragments
      - id: micro-behaviors/fs/write/content::create-text-file-method-name
      - id: micro-behaviors/os/com/instantiation::filesystemobject-constructor
      - id: micro-behaviors/process/create/shell/interpreter::wsh-progid-near-run
