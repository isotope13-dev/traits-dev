defaults:
  platforms: [windows]
  for: [batch]

composite_rules:
  - id: batch-python-remote-code-launcher
    desc: Batch launches a staged Python fetcher
    crit: hostile
    conf: 0.98
    attack: T1059.003,T1059.006,T1105,T1027,T1564.003
    all:
      - id: micro-behaviors/process/deploy/interpreter-command::batch-exe-inline-requests-text
      - id: micro-behaviors/communications/http/get::batch-http-response-text
      - id: metadata/lang/source/literal/embedded-source::batch-python-exec-base64-text
    any:
      - id: micro-behaviors/ui/window/state::start-minimized-window
      - id: micro-behaviors/fs/path/binary::users-public-executable-path
