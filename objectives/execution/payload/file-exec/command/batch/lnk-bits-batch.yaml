defaults:
  platforms: [windows]
  for: [lnk]

composite_rules:
  - id: lnk-concealed-bits-batch-launch
    desc: Concealed LNK downloads and starts a TEMP batch
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1105,T1197,T1564.003
    all:
      - id: micro-behaviors/process/deploy/file-exec/command::lnk-bits-temp-batch-launch
      - id: micro-behaviors/process/config/target::lnk-powershell-family
      - id: micro-behaviors/ui/window/state::lnk-concealed-interpreter-window
