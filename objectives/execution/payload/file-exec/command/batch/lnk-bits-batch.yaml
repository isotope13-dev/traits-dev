defaults:
  platforms: [windows]
  for: [lnk]

composite_rules:
  - id: lnk-concealed-bits-batch-launch
    desc: Concealed LNK downloads and starts a TEMP batch
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1105,T1197,T1564.003
    all:
      - id: micro-behaviors/process/deploy/file-exec::lnk-bits-temp-batch-launch
      - id: micro-behaviors/process/create/shortcut::lnk-powershell-family
      - id: micro-behaviors/process/create/shortcut::lnk-concealed-interpreter-window
