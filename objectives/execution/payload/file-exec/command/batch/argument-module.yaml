defaults:
  platforms:
    - "windows"
  for:
    - "batch"
composite_rules:
  - 
    id: "batch-argument-fragmented-data-module"
    desc: "Argument hides data-module export invocation"
    crit: "hostile"
    conf: 0.9
    all:
      - 
        id: "metadata/lang/source/syntax/command/invocation::batch-argument-executable-suffix"
      - 
        id: "micro-behaviors/process/deploy/library::batch-data-file-export-call"
