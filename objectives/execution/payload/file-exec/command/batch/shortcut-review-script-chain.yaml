defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1059.005
  mbc: F0007

composite_rules:
  - id: lnk-minimized-batch-stage-chain
    desc: Shortcut chains minimized batch stages
    crit: hostile
    conf: 0.96
    scope: outer
    for: [lnk, batch, vhd]
    all:
      - id: micro-behaviors/process/create/shortcut::lnk-cmd-with-args
      - id: micro-behaviors/process/argument/file::lnk-batch-file-argument
      - id: micro-behaviors/process/create/shortcut::minimized-interpreter-window
      - id: metadata/lang/source/syntax/command/control::start-variable-command-text
