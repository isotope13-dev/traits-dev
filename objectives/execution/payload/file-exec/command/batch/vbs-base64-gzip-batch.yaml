defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027

composite_rules:
  - id: vbs-base64-gzip-temp-batch
    desc: VBScript Base64 and gzip clues with temp batch execution
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/line::vbs-long-average-lines
      - id: micro-behaviors/data/codec::msxml-datatype-bin-base64
      - id: micro-behaviors/data/decompress/gzip::wsh-gzipstream-reference
      - id: micro-behaviors/process/create/variable::wsh-runs-temp-batch
      - id: micro-behaviors/data/control-flow/dispatch/run::run-zero-style-argument
