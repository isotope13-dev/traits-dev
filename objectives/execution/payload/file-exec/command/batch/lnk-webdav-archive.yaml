defaults:
  platforms: [windows]
  for: [lnk]
composite_rules:
  # Required command co-occurrence, not a claim that the parser binds archive
  # filenames to members. The browser disguise supplies the attack admission.
  - id: minimized-browser-webdav-archive-batch-launch
    desc: Disguised minimized LNK copies archives and invokes batch
    crit: hostile
    conf: 0.98
    attack: T1059.003,T1105,T1204.002
    all:
      - id: objectives/evasion/masquerade/file/lure::browser-icon-webdav-archive-batch-lure
      - id: micro-behaviors/process/argument/option::lnk-slash-c-switch
      - id: micro-behaviors/ui/window/state::lnk-minimized-inactive-window

  - id: lnk-webdav-port-unc-executable-launch
    desc: LNK launches executable from WebDAV @port UNC
    crit: hostile
    conf: 0.98
    attack: T1105,T1204.002
    all:
      - id: micro-behaviors/fs/path/network::lnk-webdav-unc-share-path
      - id: micro-behaviors/fs/path/network::lnk-remote-unc-environment-exe-target
      - id: micro-behaviors/process/config/target::lnk-relative-binary-target
