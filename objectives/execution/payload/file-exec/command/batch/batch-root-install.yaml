# DOS installer stub: enter \windows\system, copy an exe onto C:\install.exe,
# enter \windows\temp, and launch a bare program name. The copied path and
# the launched name are different, so each composite states only the
# relationship its legs actually show.
defaults:
  platforms: [windows]
  for: [batch, text]
  attack: T1059.003
  conf: 0.94

composite_rules:
  - id: batch-system-dir-root-install
    desc: Copies an exe onto drive-root install.exe from Windows system
    crit: hostile
    near_lines: 2
    all:
      - id: micro-behaviors/fs/file/copy/source-destination::windows-copy-command
      - id: micro-behaviors/fs/path/drive-root::drive-root-install-exe
      - id: micro-behaviors/fs/directory/traverse::dos-cd-windows-system
  - id: batch-root-install-then-temp-launch
    desc: Plants drive-root install.exe then launches from Windows temp
    crit: hostile
    near_lines: 6
    all:
      - id: batch-system-dir-root-install
      - id: micro-behaviors/process/create/shell/batch::batch-bare-launch-after-windows-temp
