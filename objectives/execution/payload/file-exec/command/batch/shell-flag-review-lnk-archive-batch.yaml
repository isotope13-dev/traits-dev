defaults:
  platforms: [windows]
  for: [lnk]
composite_rules:
  - id: lnk-headless-extract-copy-batch-commands
    desc: LNK headless shell, extraction and batch commands
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/data/archive/extract/tar::lnk-tar-temp-extraction
      - id: micro-behaviors/fs/file/copy/source-destination::lnk-temp-config-to-batch-copy
      - id: micro-behaviors/process/deploy/file-exec/command::lnk-temp-batch-command-tail
      - id: micro-behaviors/process/config/launch::lnk-conhost-headless-cmd
