# Batch CAB-dropper: the script extracts an embedded payload from itself with
# extrac32 (the Cabinet extractor, reading the running script %~f0 as the
# archive) and starts the executable staged under Temp. Either leg alone is
# ordinary administration; the extract-then-execute chain in one script is the
# dropper pattern (cf. bitsadmin-download-and-start-temp).
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1218,T1204.002
  crit: hostile
composite_rules:
  - id: batch-cab-self-extract-launch
    desc: Batch self-extracts its CAB payload and starts the dropped EXE
    conf: 0.95
    near_lines: 8
    all:
      - id: micro-behaviors/data/archive/extract/cab::extrac32-self-extract
      - id: micro-behaviors/process/create/path-execution::start-percent-tmp-exe
