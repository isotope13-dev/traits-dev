defaults:
  platforms: [windows]
  for: [lnk]
composite_rules:
  - id: lnk-hidden-extracted-config-batch-launch
    desc: Hidden shortcut extracts config and runs batch
    crit: hostile
    conf: 0.97
    attack: T1059.003,T1036
    # The source and destination are not bound by these projections. The
    # conjunction establishes staging, not byte-for-byte path equality.
    all:
      - id: micro-behaviors/process/config/target::lnk-cmd-with-args
      - id: micro-behaviors/data/archive/extract/tar::lnk-tar-archive-extraction
      - id: micro-behaviors/fs/file/copy/source-destination::lnk-config-to-batch-copy
      - id: micro-behaviors/ui/window/state::lnk-hidden-window
      - id: micro-behaviors/process/deploy/file-exec/command::lnk-temp-batch-command-tail
