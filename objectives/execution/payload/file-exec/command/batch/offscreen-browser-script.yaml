defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1059.003,T1105

composite_rules:
  - id: offscreen-browser-script-staging
    desc: Concealed browser Blob download beside copied-script execution
    crit: hostile
    conf: 0.98
    near_lines: 12
    # Concealment supplies attack context; the copy/execute leg compares paths.
    all:
      - id: objectives/evasion/process/hidden/window::offscreen-tiny-browser-inline-html
      - id: micro-behaviors/communications/http/request/client::encoded-javascript-http-fetch
      - id: micro-behaviors/communications/http/download/browser::encoded-response-blob-download
      - id: micro-behaviors/process/deploy/file-exec::batch-copied-script-execution
