defaults:
  for: [c, objective_c]
  platforms: [unix]
  attack: T1105,T1036.005

traits:
  - id: native-hidden-service-name-download-execute
    desc: Native hidden service-name downloader
    crit: hostile
    conf: 0.96
    if:
      type: yara
      source: |
        rule native_hidden_service_name_download_execute {
          strings:
            $chain = /system[ \t]*\([ \t]*"curl[ \t]+-[a-zA-Z]*k[a-zA-Z]*[ \t]+https?:\/\/[^"\n]{1,300}[ \t]+-o[ \t]+\/(var\/)?tmp\/\.(sshd|systemd|cron|dbus|kworker)[^ "\n;]*[^"\n]{0,100}&&[ \t]*chmod[ \t]+\+x[ \t]+\/(var\/)?tmp\/\.[^ "\n;]+[ \t]+&&[ \t]+\/(var\/)?tmp\/\.[^ "\n;]+[ \t]+&"/
          condition:
            $chain
        }
