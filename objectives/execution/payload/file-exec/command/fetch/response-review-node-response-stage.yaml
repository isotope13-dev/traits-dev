defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105,T1059.007,T1027.013
  mbc: B0024,B0032
composite_rules:
  - id: node-encrypted-http-response-stage
    desc: Node decrypts and executes an HTTP response stage
    crit: hostile
    conf: 0.995
    near_lines: 120
    all:
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::os-platform-call
      - id: micro-behaviors/os/sysinfo/platform/runtime/version::os-release-call
      - id: micro-behaviors/crypto/decrypt/initialize::createDecipheriv
      - id: micro-behaviors/fs/write/file/full/unspecified::node-write-file-promise
      - id: micro-behaviors/process/create/shell/command-string::js-exec
    unless:
      - id: metadata/path/directory::test-directory-component
