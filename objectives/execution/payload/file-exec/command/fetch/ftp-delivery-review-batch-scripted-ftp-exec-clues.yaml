defaults:
  platforms: [windows]
  for: [batch]
  attack: T1105,T1059.003
  mbc: B0024
composite_rules:
  - id: batch-scripted-ftp-exec-clues
    desc: Scripted FTP and executable launch clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/ftp/client::windows-ftp-script-command
      - id: micro-behaviors/process/create/path-execution::start-unquoted-executable-command
