defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  attack: T1105
  mbc: E1105


composite_rules:
  - id: python-urlretrieve-temp-exe-popen
    desc: Python URL retrieve, temp EXE and shell clues
    crit: hostile
    conf: 0.96
    attack: T1105,T1059.006
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/lib/urllib::python-urlretrieve-qualified
      - id: micro-behaviors/fs/temp/directory::python-tempdir-exe
      - id: micro-behaviors/process/create/shell/command-mode::popen-shell-true
