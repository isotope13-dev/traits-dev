defaults:
  platforms: [unix, android]
  for: [shell, text]
  conf: 0.94

composite_rules:
  - id: repeated-temp-download-and-remote-shell-pipeline
    desc: Repeated downloads and background launches accompany a remote shell pipeline
    crit: hostile
    conf: 0.96
    attack: T1105,T1059.004
    all:
      - id: micro-behaviors/process/create/path-execution::repeated-background-absolute-path-launch
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::raw-ip-curl-shell-pipeline
    any:
      - id: micro-behaviors/communications/http/download/wget::repeated-wget-absolute-output
      - id: micro-behaviors/communications/http/download/wget::repeated-wget-output-document-absolute
