defaults:
  platforms: [windows]
  for: [batch]
  attack: T1105,T1059.003
  mbc: B0024
composite_rules:
  - id: batch-bootstrap-download-exec
    desc: Batch fetches and runs editor config script
    crit: hostile
    conf: 0.97
    near_lines: 20
    all:
      - id: micro-behaviors/fs/path/application/editor::batch-editor-dir
      - id: micro-behaviors/communications/http/download/shell::batch-script-download
      - id: micro-behaviors/process/deploy/file-exec/command::batch-script-run
