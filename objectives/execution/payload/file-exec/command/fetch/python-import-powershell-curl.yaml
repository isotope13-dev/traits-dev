defaults:
  for: [python]
  platforms: [windows]

traits:
  - id: python-import-powershell-curl-download-launch
    desc: Import downloads and starts EXE via PowerShell
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1105,T1059.001
    if:
      type: tree-sitter
      query: |
        ((module
          (expression_statement (assignment left: (identifier) @downloadcmd
            right: (string (interpolation expression: (identifier) @path1)) @download))
          (expression_statement (assignment right: (call
            function: (attribute object: (identifier) @sub1 attribute: (identifier) @run1)
            arguments: (argument_list (list (string) @ps1 (string) @flag1 (identifier) @downloadarg)))))
          (if_statement consequence: (block
            (expression_statement (assignment left: (identifier) @launchcmd
              right: (string (interpolation expression: (identifier) @path2)) @launch))
            (expression_statement (assignment right: (call
              function: (attribute object: (identifier) @sub2 attribute: (identifier) @run2)
              arguments: (argument_list (list (string) @ps2 (string) @flag2 (identifier) @launcharg))))))))
          (#eq? @downloadcmd @downloadarg) (#eq? @launchcmd @launcharg) (#eq? @path1 @path2)
          (#eq? @sub1 "subprocess") (#eq? @sub2 "subprocess")
          (#eq? @run1 "run") (#eq? @run2 "run")
          (#match? @ps1 "(?i)^.powershell([.]exe)?.$") (#match? @ps2 "(?i)^.powershell([.]exe)?.$")
          (#match? @flag1 "(?i)^.-command.$") (#match? @flag2 "(?i)^.-command.$")
          (#match? @download "(?i)curl([.]exe)? .{0,10}https?://")
          (#match? @download " -o ") (#match? @launch "(?i)start-process"))
