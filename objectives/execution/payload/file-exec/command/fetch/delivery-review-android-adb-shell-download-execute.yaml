defaults:
  platforms: [unix, android]
  for: [elf, shell, c, cpp]
  attack: "T1105, T1059.004"
  mbc: B0022
composite_rules:
  - id: android-adb-shell-download-execute
    desc: Android ADB shell download execute
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/adb::shell-v2-session
      - id: micro-behaviors/fs/directory/chdir::android-local-tmp-cd
      - id: metadata/lang/source/syntax/command/launch::shell-two-script-commands
    any:
      - id: micro-behaviors/communications/http/download/busybox::busybox-wget-http-script
      - id: micro-behaviors/communications/http/download/curl::curl-http-script
      - id: micro-behaviors/communications/ip/literal::http-ip-url
    needs: 2
