defaults:
  platforms: [windows, unix]
  for: [lua]
traits:
  - id: lua-bitsadmin-execute-delete-template
    desc: Formats BITS download-execute-delete commands
    crit: suspicious
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: string.format
      arg:
        index: 0
        kind: string
        regex: '(?i)bitsadmin(\.exe)?\s+/transfer.{0,120}&&\s*"?%s"?\s*&&\s*del\s+"?%s"?'
composite_rules:
  - id: lua-bitsadmin-payload-command-generator
    desc: Builds BITS payload execution commands
    crit: hostile
    conf: 0.98
    attack: T1197,T1059.003
    all:
      - id: lua-bitsadmin-execute-delete-template
      - id: micro-behaviors/data/encode/base64/primitive::lua-windows-base64-command-request
      - id: micro-behaviors/data/control-flow/registration::lua-register-command-call
      - id: micro-behaviors/communications/http/server/listener::lua-start-python-file-server
