defaults:
  for: [documents]
  platforms: [windows]

composite_rules:
  - id: office-vba-webclient-comspec-download
    desc: Office VBA COMSPEC and WebClient download chain
    crit: suspicious
    conf: 0.99
    all:
      - id: objectives/execution/interpreter/document/macro::vba-autoopen-obfuscated-comspec-url-clues
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
    any:
      - id: metadata/document/office/markup::office-url-text-count
      - id: micro-behaviors/fs/path/executable::public-exe-drop-path
