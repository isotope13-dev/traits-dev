defaults:
  for: [python]
  platforms:
  - unix
  - windows
  crit: suspicious
  attack: T1195.002

traits:
- id: python-exec-string-run-executable
  desc: Dynamic Python string runs an executable
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: 'exec\s*\(\s*["''][A-Za-z_]\w*\.run\([^\n]{0,100}\.exe'

- id: python-setup-downloaded-executable-dynamic-run
  desc: Setup code writes an executable download target
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: 'open\s*\([^)]{0,100}\.exe[^)]{0,40}\)\s*\.\s*write\s*\('

- id: python-setup-exec-runs-method
  desc: Setup code executes a run method dynamically
  crit: notable
  conf: 0.95
  if:
    type: symbol
    kind: call
    exact: exec.run

composite_rules:
- id: setup-dynamic-run-executable-download
  desc: Setup downloads executable and dynamically runs one
  crit: hostile
  conf: 0.98
  attack: T1105,T1195.002,T1059.006
  scope: file
  near_bytes: 512
  all:
  - id: objectives/execution/staging/store::setup-executable-script-write
  - id: python-exec-string-run-executable
  - id: micro-behaviors/communications/http/request/url::requests-get-url-literal
  - id: micro-behaviors/communications/http/download/url::executable-url-reference-a

- id: setup-py-download-write-module-exec
  desc: Setup downloads and runs a written executable
  crit: hostile
  conf: 0.99
  attack: T1105,T1195.002,T1059.006
  mbc: E1105
  all:
  - id: objectives/execution/staging/store::setup-executable-script-write
  - id: objectives/execution/payload/file-exec/command/fetch::python-setup-downloaded-executable-dynamic-run
  - id: python-setup-exec-runs-method
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call

- id: setup-py-requests-drop-exec
  desc: Setup GET, file write and shell clues
  crit: hostile
  conf: 0.98
  attack: T1105,T1195.002
  mbc: E1105
  all:
  - id: micro-behaviors/communications/http/client/exchange::setup-py-requests-ossystem
  - id: micro-behaviors/fs/write/file/handle/unspecified::py-inline-write-executable-path
