# A script that carries its own download command and Start-Process launch in
# one file: the executable is fetched from an executable-suffixed URL and then
# started, in JavaScript or Python, without a separate installer.
defaults:
  platforms:
  - windows
  attack: T1105,T1059.001
  for:
  - javascript
  - python
composite_rules:
- id: embedded-executable-download-command
  desc: Embedded command downloads to a file
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/communications/http/download/cli/web-cmdlet::embedded-iwr-outfile-download
  - id: micro-behaviors/communications/http/download/curl::curl-output-file
- id: downloaded-batch-file-started
  desc: Downloads and launches a batch file
  crit: hostile
  conf: 0.96
  for: [javascript]
  attack: T1105,T1059.003
  near_bytes: 1200
  all:
  - id: objectives/execution/payload/file-exec/command/fetch::embedded-executable-download-command
  - id: micro-behaviors/fs/path/extension::batch-command-extension-literal
  - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-start-launch
- id: embedded-executable-start-command
  desc: Embedded command starts a process
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/process/deploy/file-exec/spawn::powershell-outfile-start-process-chain
  - id: metadata/lang/source/literal/string/command::python-string-start-process-command
- id: embedded-executable-url-reference
  desc: Literal references an executable URL
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/communications/url/resource-path/file::http-executable-url-reference
  - id: micro-behaviors/communications/url/resource-path/file::executable-url-reference-embedded
- id: script-downloads-and-starts-executable
  desc: Script downloads an executable and starts it
  crit: hostile
  conf: 0.95
  near_bytes: 1500
  all:
  - id: objectives/execution/payload/file-exec/command/fetch::embedded-executable-download-command
  - id: objectives/execution/payload/file-exec/command/fetch::embedded-executable-start-command
  - id: objectives/execution/payload/file-exec/command/fetch::embedded-executable-url-reference
- id: python-http-binary-tempfile-launch
  desc: Python downloads a binary URL and launches it
  crit: hostile
  conf: 0.96
  for:
  - python
  all:
  - id: micro-behaviors/process/deploy/file-exec/spawn::python-module-http-tempfile-binary-launch
  - id: micro-behaviors/communications/http/request/executable-resource::requests-get-binary-url
- id: python-install-hook-downloads-and-runs-temp-exe
  desc: Install hook downloads an EXE to temp and runs it
  crit: hostile
  conf: 0.95
  for:
  - python
  near_bytes: 1500
  all:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/communications/http/lib/urllib::urllib-download-to-binary-output
  - id: micro-behaviors/fs/temp/directory::python-tempdir-exe
  - id: micro-behaviors/process/create/subprocess/launch::run-ast
