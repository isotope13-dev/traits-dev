defaults:
  conf: 0.99
  platforms: [linux]
  for: [desktop-entry]
  attack: T1059.004,T1105,T1140
  mbc: B0023
composite_rules:
  - id: desktop-elf-header-rebuild-dropper
    desc: Desktop stamps ELF magic then runs
    crit: hostile
    conf: 0.96
    attack: T1027,T1105,T1204.002
    all:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::desktop-exec-download-tool
      - id: metadata/package/entrypoint/command::desktop-exec-elf-magic-stamp
    any:
      - id: metadata/package/entrypoint/command::desktop-entry-chmod-relative-launch
      - id: metadata/package/entrypoint/command::desktop-entry-chmod-variable-launch
