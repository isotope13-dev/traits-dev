# Fetch, decode, write and launch suggest a staged payload; the rule does not
# bind the response or written path to the process target.
defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-http-decode-write-start
    desc: PowerShell fetch, decode, write and launch
    crit: suspicious
    conf: 0.97
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
      - id: micro-behaviors/fs/write/file/full/bytes::write-all-bytes
      - id: micro-behaviors/process/create/cmdlet::start-process-call
    any:
      - id: micro-behaviors/data/decode/base64/unspecified::powershell-frombase64string
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::powershell-indexed-xor-variable
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::powershell-modulo-xor-references
  - id: powershell-suspicious-tld-archive-fetch-launch
    desc: PowerShell downloads and launches an archive payload from a .help domain
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.001
    all:
      - id: objectives/execution/staging/store::remote-archive-extract-executable-launch
      - id: micro-behaviors/communications/url/resource-path/archive::archive-url-reference-a
      - id: micro-behaviors/communications/url/host/name::tld-help
