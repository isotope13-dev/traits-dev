# PHP curl download, chmod, and local-launch chain.
# PHP server-side dropper patterns.
# The combination below is a complete download/chmod/execute chain, not a
# generic curl or chmod capability.  It covers web-plugin backdoors that fetch
# a binary and launch it from the application user's home directory.
defaults:
  crit: hostile
  conf: 0.99
  platforms: [unix, windows]
  for: [php]
  attack: T1105,T1059.004

composite_rules:
  - id: php-curl-chmod-local-exec
    desc: PHP downloads, chmods, and executes a payload
    all:
      - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
      - id: metadata/lang/source/syntax/command/launch::chmod-then-local-execute-command
    near_bytes: 1200

  - id: php-curl-chmod-variable-path-execution
    desc: PHP downloads a file with curl, changes its permissions, and launches it
    crit: suspicious
    conf: 0.98
    scope: file
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/http/client/reference::curl-fail-silent-url-reference
      - id: micro-behaviors/process/create/shell/command-mode::php-shell-exec
      - id: micro-behaviors/fs/chmod/modify::chmod-call
      - id: micro-behaviors/process/create/variable::proc-open-variable-argument
