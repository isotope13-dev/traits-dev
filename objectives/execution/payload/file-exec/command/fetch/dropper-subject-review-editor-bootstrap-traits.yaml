defaults:
  platforms: [unix]
  for: [shell]
  attack: T1105,T1059.004
  mbc: B0024
composite_rules:
  - id: bootstrap-download-exec
    desc: Editor config script download execution
    crit: hostile
    conf: 0.99
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/download/shell::script-download
      - id: micro-behaviors/fs/chmod/executable/editor::script-chmod
      - id: micro-behaviors/process/daemonize/background::script-nohup
  # Variable form of the stager above: the editor dir is assigned once and the
  # download, chmod and background launch all go through that variable.
  - id: bootstrap-var-download-exec
    desc: Runs script fetched into editor dir variable
    crit: hostile
    conf: 0.97
    near_lines: 20
    all:
      - id: micro-behaviors/fs/path/application/editor::editor-dir-var
      - id: micro-behaviors/communications/http/download/shell::fetch-output-to-var
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/daemonize/background::nohup-shell-script-execution
  - id: node-payload-download-exec
    desc: Node runs JS fetched into editor dir
    crit: hostile
    conf: 0.96
    attack: T1105,T1059.007
    near_lines: 60
    all:
      - id: micro-behaviors/communications/http/download/shell::js-download
      - id: micro-behaviors/process/deploy/file-exec/command::node-run-js
