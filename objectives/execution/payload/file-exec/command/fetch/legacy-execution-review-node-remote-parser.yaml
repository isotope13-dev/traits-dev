defaults:
  crit: hostile
  conf: 0.99
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
- id: batch-remote-parser-runtime-launch
  desc: Batch downloads and launches a remote runtime parser
  for: [batch]
  platforms: [windows]
  attack: "T1059.003,T1105"
  all:
  - id: micro-behaviors/fs/path/script::batch-variable-runtime-script-launch
  - id: micro-behaviors/process/deploy/interpreter-command::batch-start-process-self-arg
  any:
  - id: micro-behaviors/communications/http/download/cli/web-cmdlet::iwr-outfile-download
  - id: micro-behaviors/communications/http/curl/command::batch-curl-http-url
  needs: 1
