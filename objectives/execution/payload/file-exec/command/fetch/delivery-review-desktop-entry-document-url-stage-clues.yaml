defaults:
  conf: 0.99
  platforms: [linux]
  for: [desktop-entry]
  attack: T1059.004,T1105,T1140
  mbc: B0023
composite_rules:
  - id: desktop-entry-document-url-stage-clues
    desc: Desktop stager and document URL references
    # The Exec value names a browser and URL, but does not bind either to
    # activation or prove the document is a decoy.
    crit: suspicious
    all:
      - id: objectives/execution/payload/file-exec/command/fetch::desktop-entry-staged-executable-dropper
      - id: metadata/package/entrypoint/command::desktop-entry-browser-remote-document
