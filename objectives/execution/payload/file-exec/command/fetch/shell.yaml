defaults:
  attack: T1105
  mbc: B0024
  platforms: [unix, windows]
  for: [shell]
composite_rules:
  - id: raw-ip-masqueraded-shell-dropper
    desc: Raw-IP download executes temp stage
    crit: hostile
    conf: 0.99
    attack: T1105,T1036.007,T1059.004
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/download/fallback::downloader-fallback-chain
      - id: objectives/evasion/masquerade/extension/mismatch::shell-temp-nonscript-extension
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  # IoT-botnet loader shape: `case $(uname -m)` picks an architecture-named
  # binary, which is fetched from a hardcoded public IP held in a variable,
  # staged in /tmp, made executable, started detached, then deleted. Updaters
  # fetch from named hosts and keep the binary, so the raw address plus the
  # delete-after-launch step is what separates this from an installer.
  - id: shell-arch-selected-ip-bot-loader
    desc: Arch-selected binary fetched from raw IP, run, deleted
    crit: hostile
    conf: 0.95
    attack: T1105,T1059.004,T1070.004
    platforms: [unix]
    near_lines: 60
    all:
      - id: micro-behaviors/os/sysinfo/platform/arch::uname-arch-case-normalization
      - id: micro-behaviors/os/sysinfo/platform/arch::multiple-architecture-references
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-assignment
      - id: micro-behaviors/communications/url/construction/template::shell-variable-host-url
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-target
      - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
      - id: micro-behaviors/fs/delete/file/command::rm-local-named-file
    unless:
      - id: micro-behaviors/os/package-manager/installer-script::installer-script
