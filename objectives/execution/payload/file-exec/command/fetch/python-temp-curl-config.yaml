defaults:
  for: [python]
  platforms: [unix]

traits:
  - id: python-echo-to-interpolated-program
    desc: Pipes interpolated value to program
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'echo\s+["'']\{\w+\}["'']\s*\|\s*\{\w+\}'

composite_rules:
  - id: python-temp-download-config-launch-cleanup
    desc: Downloads and launches temporary binary with config and cleanup
    crit: hostile
    conf: 0.97
    attack: T1105,T1059.004,T1070.004
    scope: file
    all:
      - id: micro-behaviors/communications/http/download/curl::curl-slo-variable-output
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-plusx-variable-output
      - id: micro-behaviors/os/sysinfo/directories::python-gettempdir-reference
      - id: micro-behaviors/process/daemonize/detach::python-subprocess-new-session-option
      - id: micro-behaviors/fs/delete/directory::shutil-rmtree
      - id: python-echo-to-interpolated-program

  - id: python-import-temp-download-chmod-config-launch
    desc: Import launches temporary download with piped config
    crit: hostile
    conf: 0.97
    attack: T1105,T1059.004
    scope: file
    all:
      - id: micro-behaviors/communications/http/download/curl::curl-slo-variable-output
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-plusx-variable-output
      - id: micro-behaviors/os/sysinfo/directories::python-gettempdir-reference
      - id: micro-behaviors/process/create/subprocess/launch::python-module-level-popen
      - id: micro-behaviors/process/daemonize/detach::python-subprocess-new-session-option
      - id: python-echo-to-interpolated-program
