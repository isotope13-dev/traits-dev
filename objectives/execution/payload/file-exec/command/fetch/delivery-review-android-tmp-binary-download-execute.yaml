defaults:
  platforms: [unix, android]
  for: [elf, shell, c, cpp]
  attack: "T1105, T1059.004"
  mbc: B0022
composite_rules:
  - id: android-tmp-binary-download-execute
    desc: Android tmp binary download execute
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/temp::android-local-tmp-path
      - id: micro-behaviors/communications/http/download/cli/curl-wget::android-tmp-output-download
      - id: micro-behaviors/process/create/shell/tmp-exec::android-tmp-chmod-exec
