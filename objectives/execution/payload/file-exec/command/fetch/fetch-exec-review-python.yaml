defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  mbc: "B0030"


composite_rules:
  - id: shell-download-python-exec-delete
    desc: Shell downloads, runs, and removes Python script
    crit: suspicious
    conf: 0.96
    attack: "T1059.006,T1105,T1070.004"
    for: [shell]
    near_bytes: 192
    all:
      - id: micro-behaviors/communications/http/download/shell::shell-curl-wget-url-fetch
      - id: micro-behaviors/process/interpreter/python::python-local-script
      - id: micro-behaviors/fs/delete/file/command::delete-rm-hardcoded
    unless:
      - id: micro-behaviors/os/package-manager/installer-script::installer-script
      - id: micro-behaviors/os/package-manager/installer-script::verified-github-release-installer
