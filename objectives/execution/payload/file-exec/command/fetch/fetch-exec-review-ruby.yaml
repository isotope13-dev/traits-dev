# The source attempts to route a response to a temporary-script executor.
# Tempfile.new block semantics can prevent execution. TLS bypass is an
# additional same-file observation; this does not assert that the caller ran.
defaults:
  platforms: [unix, windows]
  for: [ruby]

composite_rules:
  - id: ruby-unverified-http-body-subprocess-exec
    desc: Attempts downloaded-script execution with TLS bypass
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/deploy/file-exec/command::ruby-http-body-script-subprocess-flow
      - id: micro-behaviors/communications/tls/verify/disable::openssl-verify-none

  # This combination defines an offensive execution/reconnaissance helper:
  # response bytes are routed to a script runner without TLS verification,
  # alongside arbitrary Ruby evaluation and a PTY identity/environment probe.
  # Individual eval, shell and HTTP primitives remain neutral. A broken
  # constructor in an attempted runner does not erase its retained purpose.
  - id: ruby-unverified-download-pty-eval-toolkit
    desc: Unverified remote-script and PTY/eval toolkit
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/deploy/file-exec/command::ruby-http-body-script-subprocess-flow
      - id: micro-behaviors/communications/tls/verify/disable::openssl-verify-none
      - id: micro-behaviors/process/tty/pty::ruby-pty-shell-identity-environment-writes
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval
