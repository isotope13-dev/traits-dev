defaults:
  platforms: [unix]
  for: [shell]
  attack: T1027,T1105,T1204.002

composite_rules:
  - id: openssl-hidden-dmg-download-mount-open
    desc: Encrypted URL feeds silent DMG download and app launch
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/crypto/key/representation/material::openssl-hardcoded-pass
      - id: micro-behaviors/crypto/decrypt/transform/symmetric::openssl-aes-decrypt
      - id: micro-behaviors/data/decode/command::openssl-base64-decode-command
      - id: micro-behaviors/fs/volume/mount::download-disk-image-mount-open
      - id: micro-behaviors/os/console/io::dense-stderr-suppression
