defaults:
  platforms: [macos]
  for: [applescript]
traits:
  - id: applescript-shell-curl-start
    desc: AppleScript invokes curl through shell
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'do shell script "curl\b'
  - id: hidden-temp-chmod-and-launch
    desc: Hidden temp path chmod and launch
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'chmod\s+\+x\s+/(var/)?tmp/\.[\w.-]+\s*&&\s*/(var/)?tmp/\.[\w.-]+'
  - id: applescript-curl-insecure-flags
    desc: AppleScript curl disables TLS verification
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'do shell script "curl\s+-[A-Za-z]*k[A-Za-z]*\b'
  - id: disguised-sshd-temp-path
    desc: Hidden temporary path resembles sshd
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '/(var/)?tmp/\.sshd\b'
composite_rules:
  # Proximity is evidence of a command chain, not proof that the paths match.
  - id: applescript-hidden-curl-chmod-launch-clues
    desc: Hidden temp curl, chmod and launch
    crit: suspicious
    conf: 0.96
    attack: T1059.002,T1105,T1564.001
    near_bytes: 512
    all:
      - id: applescript-shell-curl-start
      - id: hidden-temp-chmod-and-launch
      - id: micro-behaviors/communications/http/download/curl::curl-hidden-tmp-output-file
  - id: applescript-hidden-curl-chmod-launch
    desc: Insecure hidden download mimics sshd
    crit: hostile
    conf: 0.96
    attack: T1059.002,T1105,T1564.001,T1036
    all:
      - id: applescript-hidden-curl-chmod-launch-clues
      - id: applescript-curl-insecure-flags
      - id: disguised-sshd-temp-path
