defaults:
  platforms: [windows]
  for: [oledoc, ooxml]
  attack: T1105


composite_rules:
  - id: auto-open-vba-curl-dropper
    desc: Auto-open VBA downloads payload via curl
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.005,T1204.002
    for: [oledoc, ooxml, vbs]
    scope: outer
    all:
      - id: micro-behaviors/os/application/hook/event::raw-auto-open-entrypoint
      - id: micro-behaviors/process/interpreter/wsh::vba-windows-shell-run
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/communications/url/resource-path/file::http-executable-url-reference
