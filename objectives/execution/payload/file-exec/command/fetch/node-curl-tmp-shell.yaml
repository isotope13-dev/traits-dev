defaults:
  for: [javascript]
  platforms: [unix]
  attack: T1105,T1059.004

traits:
  - id: node-curl-tmp-shell-execute
    desc: Downloads and runs temporary shell payload
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration (variable_declarator name: (object_pattern (shorthand_property_identifier_pattern) @exec)
            value: (call_expression function: (identifier) @require arguments: (arguments (string (string_fragment) @module)))))
          (expression_statement (assignment_expression
            left: (member_expression object: (identifier) @exports)
            right: (function_expression body: (statement_block (try_statement body: (statement_block
              (expression_statement (call_expression function: (identifier) @download_exec
                arguments: (arguments (string (string_fragment) @download))))
              (expression_statement (call_expression function: (identifier) @chmod_exec
                arguments: (arguments (string (string_fragment) @chmod))))
              (expression_statement (call_expression function: (identifier) @run_exec
                arguments: (arguments (string (string_fragment) @run)))))))))))
          (#eq? @exec "execSync")
          (#eq? @require "require")
          (#eq? @module "child_process")
          (#eq? @exports "exports")
          (#eq? @exec @download_exec)
          (#eq? @exec @chmod_exec)
          (#eq? @exec @run_exec)
          (#match? @download "^curl[[:space:]]+[^[:space:]]+[[:space:]]*>[[:space:]]*/tmp/shell[[:space:]]*$")
          (#match? @chmod "^chmod[[:space:]]+[+]x[[:space:]]+/tmp/shell[[:space:]]*$")
          (#match? @run "^/tmp/shell[[:space:]]*&?[[:space:]]*$"))
