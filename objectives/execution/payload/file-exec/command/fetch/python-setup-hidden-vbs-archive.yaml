defaults:
  for: [python]
  platforms: [windows]

traits:
  - id: python-setup-powershell-archive-hidden-vbs
    desc: Passes hidden download command to helper
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((module (if_statement consequence: (block
          (expression_statement (call function: (identifier) @run
            arguments: (argument_list (string) @command))))))
          (#match? @command "(?i)Invoke-WebRequest")
          (#match? @command "https?://") (#match? @command "(?i)-OutFile")
          (#match? @command "(?i)Expand-Archive") (#match? @command "(?i)-DestinationPath")
          (#match? @command "(?i)WScript[.]exe") (#match? @command "(?i)python[.]exe")
          (#match? @command "(?i)-WindowStyle[[:space:]]+Hidden"))


  - id: python-base64-run-shell-helper
    desc: Encoded run helper starts shell command
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule encoded_run_shell_helper {
          strings:
            $def = "def run(cmd)" base64
            $process = "subprocess.Popen" base64
            $shell = "shell=True" base64
          condition:
            all of them
        }

composite_rules:
  - id: python-setup-hidden-vbs-archive-launch
    desc: Setup downloads archive and starts hidden Python via WScript
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1105,T1059.001,T1059.005
    scope: file
    all:
      - id: python-setup-powershell-archive-hidden-vbs
      - id: python-base64-run-shell-helper
      - id: micro-behaviors/process/interpreter/eval/python-builtins::python-module-level-base64-exec
      - id: metadata/package/files/included::setup-py-basename
