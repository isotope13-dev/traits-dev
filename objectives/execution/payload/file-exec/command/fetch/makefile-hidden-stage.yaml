defaults:
  platforms: [unix]
  for: [makefile]
  attack: T1105,T1036

composite_rules:
  - id: makefile-hidden-download-background-stage
    desc: Make recipe downloads and backgrounds hidden executable
    crit: suspicious
    conf: 0.97
    all:
      - id: objectives/execution/staging/store::hidden-fetch-chmod-launch-clues
      - id: micro-behaviors/communications/http/curl/command::curl-insecure-silent-follow
      - id: micro-behaviors/process/daemonize/background::hidden-tmp-background-exec
