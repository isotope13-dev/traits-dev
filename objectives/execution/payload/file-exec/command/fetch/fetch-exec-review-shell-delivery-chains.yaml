defaults:
  attack: T1105
  mbc: B0030
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: writable-peler-raw-ip-multiarch-runner
    desc: Writable peler raw-IP multiarch runner
    crit: hostile
    conf: 0.98
    near_lines: 20
    all:
      - id: micro-behaviors/process/create/path-execution::local-execution
      - id: micro-behaviors/fs/path/basename::writable-dir-peler-arch-runner
      - id: micro-behaviors/fs/directory/chdir::writable-dir-fallback-exact-chain
      - id: micro-behaviors/communications/url/host/oob-http::curl-wget-ipv4-url
  - id: main-arch-raw-ip-runner
    desc: Raw-IP architecture payload runner
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/url/host/oob-http::curl-wget-ipv4-url
      - id: micro-behaviors/fs/path/file::main-short-relative-path
      - id: micro-behaviors/process/create/path-execution::local-execution
  - id: variable-host-fallback-dropper-exec
    desc: Variable-host fallback download executes payload
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.004,T1222.002
    near_lines: 20
    all:
      - id: micro-behaviors/communications/transfer::multiple-download-clients
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-assignment
      - id: micro-behaviors/communications/url/construction/template::shell-variable-host-url
      - id: micro-behaviors/fs/chmod/executable/evidence::executable-mode-evidence
      - id: micro-behaviors/process/create/path-execution::local-execution
    any:
      - id: "micro-behaviors/os/sysinfo/platform/arch::multiple-architecture-references"
      - id: micro-behaviors/fs/delete/directory::shell-recursive-delete
  - id: botnet-multi-arch-dropper
    desc: "Botnet dropper targeting multiple architectures"
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/client/response-body::http-response-acquisition
      - id: micro-behaviors/fs/chmod/executable/evidence::executable-mode-evidence
      - id: micro-behaviors/process/create/path-execution::local-execution
      - id: micro-behaviors/fs/delete/file/command::delete-rm-hardcoded
      - id: micro-behaviors/os/sysinfo/platform/arch::multi-arch-payload-bundle
