defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1204.002

composite_rules:
  - id: lnk-downloads-and-runs-remote-batch
    desc: LNK downloads and immediately runs a remote batch file
    crit: hostile
    conf: 0.97
    attack: T1105,T1204.002
    all:
      - id: micro-behaviors/communications/http/download/cli/utility::lnk-args-bitsadmin-download
      - id: metadata/file/profile/network-context/process::lnk-args-http-batch-reference
      - id: metadata/file/profile/shortcut/script-and-command::lnk-args-call-batch
