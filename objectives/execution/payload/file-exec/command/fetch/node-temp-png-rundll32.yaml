defaults:
  for: [javascript]
  platforms: [windows]
  attack: T1105,T1218.011

traits:
  - id: node-curl-temp-png-rundll32
    desc: Downloads and runs disguised DLL
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((program
          (import_statement
            (import_clause (named_imports (import_specifier name: (identifier) @exec)))
            source: (string (string_fragment) @module))
          (export_statement declaration: (function_declaration body: (statement_block
            (return_statement (new_expression arguments: (arguments (arrow_function body: (statement_block
              (lexical_declaration (variable_declarator name: (identifier) @url
                value: (string (string_fragment) @url_text)))
              (lexical_declaration (variable_declarator name: (identifier) @path
                value: (string (string_fragment) @path_text)))
              (lexical_declaration (variable_declarator name: (identifier) @command
                value: (template_string (string_fragment) @prefix
                  (template_substitution (identifier) @path_use)
                  (string_fragment) @middle
                  (template_substitution (identifier) @url_use)
                  (string_fragment) @suffix)))
              (expression_statement (call_expression function: (identifier) @exec_use
                arguments: (arguments (identifier) @command_use))))))))))))
          (#eq? @exec "exec")
          (#eq? @module "child_process")
          (#eq? @exec @exec_use)
          (#eq? @path @path_use)
          (#eq? @url @url_use)
          (#eq? @command @command_use)
          (#match? @url_text "^https?://")
          (#match? @path_text "(?i)^%temp%[/\\\\]temp[.]png$")
          (#match? @prefix "(?i)cmd[.]exe[[:space:]]+/c[[:space:]]+curl[[:space:]].*-o[[:space:]]+\"$")
          (#eq? @middle "\" \"")
          (#match? @suffix "(?i)^\"[[:space:]]*&&[[:space:]]*rundll32[[:space:]]+%temp%[/\\\\]temp[.]png,[a-z0-9_]+"))
