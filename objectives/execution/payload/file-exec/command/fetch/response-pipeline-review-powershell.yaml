defaults:
  platforms: [windows]
  for: [powershell]
traits: []
composite_rules:
  - id: ps-webclient-temp-exe-invoke
    desc: PowerShell WebClient TEMP EXE invoke
    crit: hostile
    conf: 0.98
    mbc: "B0023"
    attack: T1105
    all:
      - id: micro-behaviors/communications/http/download/webclient::ps-downloadfile-call
      - id: micro-behaviors/data/control-flow/dispatch/indirect::powershell-variable-or-command-invocation
      - id: objectives/anti-static/obfuscation/string/reconstruct/character::webclient-name-concatenation-clues
      - id: micro-behaviors/fs/path/temporary-artifact::temp-exe-character-fragments
# Only the prefixes that say the path was downloaded or staged. `-exec` moved
# out when it went notable: a bare `any:` shares its legs' criticality, so
# keeping it here would have let `& $exePath` alone raise this roll-up to
# suspicious -- the same finding, at two different tiers depending on which leg
# hit. `ps-webclient-temp-exe-invoke` still reaches it through the notable
# roll-up below, with ps-downloadfile-call supplying the download.
  - id: ps-tcp-stream-staged-script-invoke
    desc: PowerShell streams and executes script from temp path
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1105
    mbc: B0030
    all:
      - id: micro-behaviors/communications/socket/tcp::powershell-tcpclient-stream
      - id: micro-behaviors/fs/write/file/full/bytes::write-all-bytes
      - id: micro-behaviors/process/create/path-execution::powershell-call-operator-target
      - id: micro-behaviors/os/env/path::env-temp-dup
