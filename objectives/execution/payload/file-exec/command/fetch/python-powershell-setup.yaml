defaults:
  for: [python]
  platforms: [windows]

traits:
  - id: setup-powershell-download-start-same-path
    desc: PowerShell downloads and starts same path
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((function_definition body: (block
          (expression_statement (assignment left: (identifier) @download_cmd
            right: (string (interpolation expression: (identifier) @download_path)) @download))
          (expression_statement (assignment right: (call function: (attribute object: (identifier) @sub1 attribute: (identifier) @run1)
            arguments: (argument_list (identifier) @download_arg))))
          (if_statement consequence: (block
            (expression_statement (assignment left: (identifier) @start_cmd
              right: (string (interpolation expression: (identifier) @start_path)) @start))
            (expression_statement (assignment right: (call function: (attribute object: (identifier) @sub2 attribute: (identifier) @run2)
              arguments: (argument_list (identifier) @start_arg))))))))
          (#eq? @sub1 "subprocess") (#eq? @sub2 "subprocess")
          (#eq? @run1 "run") (#eq? @run2 "run")
          (#eq? @download_cmd @download_arg) (#eq? @start_cmd @start_arg)
          (#eq? @download_path @start_path)
          (#match? @download "Invoke-WebRequest.*https?://.*[.]exe.*-OutFile")
          (#match? @start "Start-Process"))

composite_rules:
  - id: setup-powershell-download-execute
    desc: Install hook downloads and starts an executable
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1105,T1059.001
    scope: file
    all:
      - id: setup-powershell-download-start-same-path
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
