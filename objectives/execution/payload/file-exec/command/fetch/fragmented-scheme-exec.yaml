# Node.js droppers that construct an HTTP(S) URL scheme from split character
# literals, save a remote stage into a temporary directory, and execute it via
# child_process.exec.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1105,T1027,T1059.007
  mbc: B0030,B0032

composite_rules:
  - id: node-fragmented-url-download-exec
    desc: Downloads and spawns payload from split URL
    crit: hostile
    conf: 0.97
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/url/construction/fragment::fragmented-http-scheme-construction
      - id: micro-behaviors/communications/http/request/client::js-http-get-or-fetch
      - id: micro-behaviors/os/sysinfo/directories::node-os-tmpdir
      - id: micro-behaviors/process/create/shell/command-string::child-process-exec
