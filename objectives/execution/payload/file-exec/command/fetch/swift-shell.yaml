# Swift call facts currently omit arguments. Bind the Process receiver,
# shell assignment, literal command array and launch in the parsed source.
# All command predicates apply to the same argument; an unused command string
# beside an unrelated Process launch must not qualify.
defaults:
  platforms: [unix]
  for: [swift]

traits:
  - id: swift-hidden-curl-chmod-shell-execution
    desc: Swift runs a hidden download-and-execute chain
    crit: hostile
    conf: 0.97
    attack: T1105,T1059.004
    if:
      type: tree-sitter
      query: |
        (_
          (property_declaration
            name: (pattern bound_identifier: (simple_identifier) @binding)
            value: (call_expression (simple_identifier) @constructor))
          (assignment
            target: (directly_assignable_expression
              (navigation_expression target: (simple_identifier) @shell_receiver
                suffix: (navigation_suffix suffix: (simple_identifier) @shell_property)))
            result: (line_string_literal) @shell)
          (assignment
            target: (directly_assignable_expression
              (navigation_expression target: (simple_identifier) @args_receiver
                suffix: (navigation_suffix suffix: (simple_identifier) @args_property)))
            result: (array_literal
              element: (line_string_literal) @flag
              element: (line_string_literal) @command))
          [
            (try_expression expr: (call_expression
              (navigation_expression target: (simple_identifier) @run_receiver
                suffix: (navigation_suffix suffix: (simple_identifier) @run_method))))
            (call_expression
              (navigation_expression target: (simple_identifier) @run_receiver
                suffix: (navigation_suffix suffix: (simple_identifier) @run_method)))
          ]
          (#eq? @constructor "Process")
          (#eq? @binding @shell_receiver)
          (#eq? @binding @args_receiver)
          (#eq? @binding @run_receiver)
          (#eq? @shell_property "launchPath")
          (#eq? @args_property "arguments")
          (#any-of? @run_method "run" "launch")
          (#match? @shell "^\"/bin/(sh|bash|zsh)\"$")
          (#eq? @flag "\"-c\"")
          (#match? @command "^\"curl\\s+-[a-zA-Z]*k")
          (#match? @command "-o\\s+/(tmp|var/tmp)/\\.")
          (#match? @command "&&\\s*chmod\\s+\\+x\\s+/(tmp|var/tmp)/\\.")
          (#match? @command "&&\\s*/(tmp|var/tmp)/\\.[^ ;]+\\s*&"))
