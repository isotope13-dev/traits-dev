defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
traits:
  - id: "lua-curl-start-batch-command"
    desc: "Lua downloads and launches a batch file"
    crit: "suspicious"
    conf: 0.96
    if:
      type: "symbol"
      kind: "call"
      exact: "os.execute"
      arg:
        from:
          value: "(?i)\\bcurl\\b.{1,220}[&;].{0,35}\\bstart\\b.{0,100}\\.bat"
composite_rules:
  - id: "lua-concealed-curl-batch-stage"
    desc: "Lua hides its window and downloads then starts a batch stage"
    crit: "hostile"
    conf: 0.97
    all:
      - id: "lua-curl-start-batch-command"
      - id: "micro-behaviors/ui/window/visibility::lua-hide-window-call"
