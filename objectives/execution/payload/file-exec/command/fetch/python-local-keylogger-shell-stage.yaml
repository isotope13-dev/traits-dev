defaults:
  for: [python]
  platforms: [windows]

traits:
  - id: python-install-local-keylogger-shell-stage
    desc: Install stages named keylogging and shell files
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1059.006,T1105
    if:
      type: tree-sitter
      query: |
        ((module
          (function_definition name: (identifier) @helper body: (block
            (expression_statement (assignment left: (identifier) @listener right: (call
              function: (attribute object: (identifier) @requests1 attribute: (identifier) @get1)
              arguments: (argument_list (keyword_argument name: (identifier) @urlkey1 value: (string) @url1)))))
            (expression_statement (call function: (attribute object: (call function: (identifier) @open1
              arguments: (argument_list (string) @listenerpath (string) @mode1)) attribute: (identifier) @write1)
              arguments: (argument_list (attribute object: (identifier) @listener2 attribute: (identifier) @content1))))
            (expression_statement (assignment left: (identifier) @keylog right: (call
              function: (attribute object: (identifier) @requests2 attribute: (identifier) @get2)
              arguments: (argument_list (keyword_argument name: (identifier) @urlkey2 value: (string) @url2)))))
            (expression_statement (call function: (attribute object: (call function: (identifier) @open2
              arguments: (argument_list (string) @keypath (string) @mode2)) attribute: (identifier) @write2)
              arguments: (argument_list (attribute object: (identifier) @keylog2 attribute: (identifier) @content2))))
            (expression_statement (assignment left: (identifier) @shell right: (call
              function: (attribute object: (identifier) @requests3 attribute: (identifier) @get3)
              arguments: (argument_list (keyword_argument name: (identifier) @urlkey3 value: (string) @url3)))))
            (expression_statement (call function: (attribute object: (call function: (identifier) @open3
              arguments: (argument_list (string) @shellpath (string) @mode3)) attribute: (identifier) @write3)
              arguments: (argument_list (attribute object: (identifier) @shell2 attribute: (identifier) @content3))))
            (expression_statement (call function: (attribute object: (identifier) @subprocess attribute: (identifier) @popen)
              arguments: (argument_list (string) @launch
                (keyword_argument name: (identifier) @creationflags value: (integer) @flag))))))
          (if_statement condition: (comparison_operator) @condition consequence: (block
            (expression_statement (call function: (identifier) @invoke)))))
          (#eq? @helper @invoke) (#match? @condition "sys[.]argv") (#match? @condition "install")
          (#eq? @requests1 "requests") (#eq? @requests2 "requests") (#eq? @requests3 "requests")
          (#eq? @get1 "get") (#eq? @get2 "get") (#eq? @get3 "get")
          (#eq? @urlkey1 "url") (#eq? @urlkey2 "url") (#eq? @urlkey3 "url")
          (#match? @url1 "127[.]0[.]0[.]1.*listener_exe") (#match? @url2 "127[.]0[.]0[.]1.*payload_exe")
          (#match? @url3 "127[.]0[.]0[.]1.*Rshell_exe") (#eq? @listener @listener2) (#eq? @keylog @keylog2) (#eq? @shell @shell2)
          (#eq? @open1 "open") (#eq? @open2 "open") (#eq? @open3 "open")
          (#match? @mode1 "wb") (#match? @mode2 "wb") (#match? @mode3 "wb")
          (#eq? @write1 "write") (#eq? @write2 "write") (#eq? @write3 "write")
          (#eq? @content1 "content") (#eq? @content2 "content") (#eq? @content3 "content")
          (#match? @keypath "(?i)log_my_keys[.]exe") (#match? @shellpath "(?i)rshell[.]exe")
          (#eq? @listenerpath @launch) (#eq? @subprocess "subprocess") (#eq? @popen "Popen")
          (#eq? @creationflags "creationflags") (#eq? @flag "8"))
