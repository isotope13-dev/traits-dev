defaults:
  conf: 0.99
  platforms: [linux]
  for: [desktop-entry]
  attack: T1059.004,T1105,T1140
  mbc: B0023
composite_rules:
  - id: desktop-entry-staged-executable-dropper
    desc: Desktop Entry downloads decodes and runs payload
    crit: hostile
    all:
      - id: micro-behaviors/process/config/target::desktop-exec-shell-command-mode
      - id: micro-behaviors/communications/http/download/cli/curl-wget::desktop-exec-download-tool
      - id: objectives/anti-static/obfuscation/eval/desktop::desktop-exec-decode-stage
      - id: objectives/anti-static/obfuscation/eval/desktop::desktop-exec-drop-path
      - id: micro-behaviors/fs/chmod/executable/mode::desktop-exec-chmod
      - id: metadata/package/entrypoint/command::desktop-entry-chmod-variable-launch
