defaults:
  for:
  - python
  platforms:
  - unix
composite_rules:
- id: python-hidden-ip-download-execution
  desc: Shell fetches an IP-hosted hidden temp executable and backgrounds it
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/process/create/shell/command-string::python-fetch-hidden-temp
  - id: micro-behaviors/process/create/shell/command-string::python-chmod-hidden-temp
  - id: micro-behaviors/process/create/shell/command-string::python-background-hidden-temp
  near_bytes: 256
  unless:
  - id: metadata/lang/source/shape::python-literal-module-quoted-source
