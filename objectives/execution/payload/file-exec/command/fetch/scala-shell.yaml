defaults:
  platforms: [unix]
  for: [scala]
  attack: T1105,T1059.004

traits:
  - id: scala-shell-command-sequence
    desc: Scala constructs shell command sequence
    crit: notable
    if:
      type: text
      regex: '(?s)Seq\s*\(\s*["''](sh|bash)["'']\s*,\s*["'']-c["'']'

  - id: scala-hidden-chmod-launch
    desc: Scala text marks hidden file executable
    crit: notable
    if:
      type: text
      regex: '(?i)chmod\s+\+x\s+/(var/)?tmp/\.[a-z0-9._-]+.{0,60}&&\s*/(var/)?tmp/\.'

composite_rules:
  - id: scala-shell-hidden-download-launch
    desc: Scala shell command stages hidden executable
    crit: hostile
    conf: 0.97
    all:
      - id: scala-shell-command-sequence
      - id: micro-behaviors/communications/http/download/curl::shell-curl-hidden-output
      - id: scala-hidden-chmod-launch
      - id: micro-behaviors/process/daemonize/background::hidden-tmp-background-exec
