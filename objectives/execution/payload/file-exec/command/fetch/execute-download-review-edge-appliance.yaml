defaults:
  crit: hostile
  conf: 0.98
  platforms: [unix, appliance]
  for: [scripts, binaries, source]
  attack: "T1105,T1059.004,T1222.002"
  mbc: B0024


composite_rules:
  - id: busybox-ftp-archive-execute
    for: [shell]
    desc: BusyBox FTP archive download, extraction and temporary execution
    all:
      - id: micro-behaviors/communications/ftp/download/busybox::ftpget-archive
      - id: micro-behaviors/data/archive/extract/tar::tar-gzip-extract
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-absolute-path
      - id: micro-behaviors/process/daemonize/background::background-tmp-execution
