defaults:
  attack: T1105,T1059.004
  for: [scripts, macho]
  platforms: [unix]

composite_rules:
- id: localbin-download-stage-exec
  desc: Downloads local-bin payload and executes staged copy
  crit: hostile
  conf: 0.97
  for: [macho]
  all:
  - id: micro-behaviors/communications/http/download/shell::localbin-download-stage-composite
  - id: metadata/file/profile/staging::localbin-to-tmpdir-exec
  - id: micro-behaviors/communications/http/download/shell::curl-wget-command-check
- id: localbin-download-temp-exec-shell-clues
  desc: Local-bin download and temporary launch with shell clues
  crit: hostile
  conf: 0.97
  for: [macho]
  all:
  - id: micro-behaviors/communications/http/download/shell::curl-wget-command-check
  - id: micro-behaviors/communications/http/download/shell::localbin-download-stage-composite
  - id: metadata/file/profile/staging::localbin-to-tmpdir-exec
  any:
  - id: micro-behaviors/process/create/shell/spawn::system-fn
  - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
