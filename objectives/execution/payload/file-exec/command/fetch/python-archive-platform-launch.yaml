defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: python-archive-fetch-select-execute-flow
    desc: Downloads archive then selects and runs target
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((function_definition body: (block (try_statement body: (block
          (if_statement condition: (not_operator argument: (call function: (identifier) @download
            arguments: (argument_list (identifier) @url (identifier) @archive))))
          (if_statement condition: (not_operator argument: (call function: (identifier) @extract
            arguments: (argument_list (identifier) @archive2 (identifier) @dir))))
          (expression_statement (assignment left: (identifier) @target right: (call function: (identifier) @find
            arguments: (argument_list (identifier) @dir2 (call function: (identifier) @target_name)))))
          (return_statement (call function: (identifier) @execute
            arguments: (argument_list (identifier) @target2)))))))
          (#eq? @download "download") (#eq? @extract "extract") (#eq? @archive @archive2)
          (#eq? @find "find_file") (#eq? @dir @dir2) (#eq? @target_name "get_target_file")
          (#eq? @execute "execute") (#eq? @target @target2))
  - id: python-platform-system-service-targets
    desc: Names Linux and macOS service targets
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        rule platform_service_names {
          strings:
            $linux = "systemd-resolved"
            $mac = "com.apple.systemevents"
          condition:
            all of them
        }

composite_rules:
  - id: python-remote-archive-service-masquerade-launch
    desc: Downloads archive and launches a service-named target
    crit: hostile
    conf: 0.98
    attack: T1105,T1036.005
    scope: file
    all:
      - id: python-archive-fetch-select-execute-flow
      - id: python-platform-system-service-targets
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen
      - id: micro-behaviors/data/archive/extract/zip::python-zipfile-extractall
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
