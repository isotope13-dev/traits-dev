defaults:
  for: [python]
  platforms: [windows, unix]

traits:
  - id: base64-marshal-filebin-executable-clues
    desc: Encoded payload names filebin and execution
    crit: suspicious
    conf: 0.95
    if:
      type: yara
      source: |
        rule encoded_filebin_executable {
          strings:
            $host = "filebin.net/" base64
            $exe = ".exe" base64
            $requests = "requests" base64
            $process = "subprocess" base64
          condition:
            all of them
        }


  - id: base64-marshal-pixeldrain-executable-clues
    desc: Encoded payload names PixelDrain and execution
    crit: suspicious
    conf: 0.95
    if:
      type: yara
      source: |
        rule encoded_pixeldrain_executable {
          strings:
            $host = "pixeldrain.com/api/file/" base64
            $exe = ".exe" base64
            $requests = "requests" base64
            $process = "subprocess" base64
          condition:
            all of them
        }

composite_rules:
  - id: python-execs-encoded-filebin-executable-loader
    desc: Executes encoded marshal loader with filebin executable clues
    crit: hostile
    conf: 0.97
    attack: T1059.006,T1105
    scope: file
    all:
      - id: base64-marshal-filebin-executable-clues
      - id: micro-behaviors/data/serialize/unsafe::exec-marshal-loads-text
      - id: micro-behaviors/process/interpreter/eval/python-builtins::module-scope-exec-builtin

  - id: python-execs-encoded-pixeldrain-executable-loader
    desc: Executes encoded marshal loader with PixelDrain executable clues
    crit: hostile
    conf: 0.97
    attack: T1059.006,T1105
    scope: file
    all:
      - id: base64-marshal-pixeldrain-executable-clues
      - id: micro-behaviors/data/serialize/unsafe::exec-marshal-loads-text
      - id: micro-behaviors/process/interpreter/eval/python-builtins::module-scope-exec-builtin
