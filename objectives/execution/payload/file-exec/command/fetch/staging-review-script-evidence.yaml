composite_rules:
- platforms:
  - windows
  for:
  - batch
  id: batch-hidden-vbs-download-persistence
  desc: Hidden VBS download and Run-key clues
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/download/cli/web-cmdlet::iwr-outfile-download
  - id: micro-behaviors/process/config/window::wscript-shell-run-hidden-window
  - id: objectives/persistence/login/startup/registry::run-key-wscript-vbs-launcher
  - id: micro-behaviors/fs/file/attributes::attrib-hidden-system
  - id: micro-behaviors/fs/delete/file/self::batch-self-delete
  - id: micro-behaviors/process/interpreter/wsh::cscript-batch-mode
- platforms:
  - windows
  for:
  - class
  - java_class
  - jar
  - zip
  id: jvm-cmd-curl-temp-script-clues
  desc: JVM cmd, curl and temp-script clues
  crit: suspicious
  conf: 0.99
  scope: archive
  all:
  - id: micro-behaviors/process/argument/interpreter::java-cmd-exe-c-bytecode-clues
  - id: micro-behaviors/communications/http/download/curl::jvm-curl-windows-script-url
  - id: micro-behaviors/fs/path/temporary-artifact::temporary-batch-path-reference
  - id: metadata/import/jvm::java-runtime-exec-bytecode-reference
- platforms:
  - windows
  - macos
  for:
  - swift
  - shell
  - zip
  - tar
  id: swift-curl-powershell-process-clues
  desc: Swift curl, PowerShell and process clues
  crit: suspicious
  conf: 0.99
  scope: archive
  all:
  - id: micro-behaviors/communications/http/download/curl::source-curl-script-url
  - id: micro-behaviors/communications/http/download/cli/curl-wget::fetch-output-option-script
  - id: micro-behaviors/process/argument/lifecycle::code-powershell-noninteractive-options
  - id: micro-behaviors/process/create/subprocess/launch::swift-source-process-run
