# macOS shell droppers and stub .pkg installer hooks that bypass static payload
# inspection by downloading a remote archive, extracting an .app bundle into
# /Applications, loosening bundle permissions to world-writable 777 so
# unprivileged user stages can mutate root-installed bundle contents, and
# directly executing the inner Contents/MacOS Mach-O binary.
defaults:
  platforms: [macos]
  for: [shell]
  attack: T1105,T1059.004

composite_rules:
  - id: macos-remote-zip-world-writable-app-exec
    desc: Drops, chmods 777, and runs /Applications app
    crit: hostile
    conf: 0.97
    attack: T1105,T1222.002,T1059.004
    mbc: B0024
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::shell-download-output-call
      - id: micro-behaviors/communications/url/reference::shell-http-url-reference
      - id: micro-behaviors/data/archive/extract/zip::extract-zip-applications-destination
      - id: micro-behaviors/fs/chmod/executable/dangerous::chmod-777-macos-app-bundle
    any:
      - id: micro-behaviors/process/create/path-execution::shell-macos-app-bundle-exec
      - id: micro-behaviors/process/create/path-execution::shell-exec-macos-app-bundle
      - id: micro-behaviors/process/daemonize/detach::nohup-quoted-macos-app-bundle
      - id: micro-behaviors/process/daemonize/detach::nohup-unquoted-macos-app-bundle

  - id: macpkg-hook-remote-zip-app-exec
    desc: Installer hook drops and runs /Applications app
    crit: suspicious
    conf: 0.94
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::shell-download-output-call
      - id: micro-behaviors/communications/url/reference::shell-http-url-reference
      - id: micro-behaviors/data/archive/extract/zip::extract-zip-applications-destination
      - id: micro-behaviors/process/create/path-execution::shell-macos-app-bundle-exec
    any:
      - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
      - id: micro-behaviors/os/env/read/named::macos-installer-package-path-env
