defaults:
  platforms: [windows]
  crit: notable
  conf: 0.95

traits:
  - id: batch-library-loader-data-argument
    desc: Windows library loader takes a data file
    for: [batch]
    if:
      type: text
      regex: '(?i)\b(rundll32|regsvr32)(\.exe)?[ \t]+[^&|\r\n]{0,110}\.(dat|db|des)\b'

  - id: batch-variable-command-data-argument
    desc: Batch variable command takes a data file
    for: [batch]
    if:
      type: text
      regex: '(?im)^[ \t]*(call[ \t]+)?["'']?%\w+%["'']?[ \t]+[^&|\r\n]{0,110}\.(dat|db|des)\b'

  - id: native-library-data-name
    desc: Native image has a data suffix
    for: [pe, dll]
    if:
      type: value
      path: file.basename
      regex: '(?i)\.(dat|db|des|bin)$'

composite_rules:
  - id: shortcut-batch-target
    desc: Shortcut points to or names a batch script
    for: [lnk]
    any:
      - id: micro-behaviors/process/config/target::lnk-relative-command-target
      - id: micro-behaviors/process/argument/file::lnk-batch-file-argument

  - id: batch-renamed-library-loader-data-argument
    desc: Batch references a library loader and invokes a data file argument
    for: [batch]
    all:
      - id: batch-variable-command-data-argument
      - id: micro-behaviors/os/application/target/utility::regsvr32-reference-or-call

  - id: native-library-with-data-suffix
    desc: Windows DLL uses a data filename extension
    for: [pe, dll]
    all:
      - id: native-library-data-name
      - id: metadata/binary/header/characteristics::pe-dll-characteristics

  - id: archive-shortcut-disguised-native-library
    desc: Shortcut and script stage a Windows DLL disguised as a data file
    for: [iso, zip, rar, 7z, lnk, batch, pe, dll]
    scope: archive
    crit: hostile
    conf: 0.98
    all:
      - id: shortcut-batch-target
      - id: native-library-with-data-suffix
    any:
      - id: batch-library-loader-data-argument
      - id: batch-renamed-library-loader-data-argument
      - id: objectives/execution/payload/file-exec/command/batch::batch-renamed-regsvr32-loader
