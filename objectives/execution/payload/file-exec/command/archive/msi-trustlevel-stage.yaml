defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: batch-msi-image-trustlevel-stage
    desc: Hidden MSI staging and trust-level launch
    crit: suspicious
    conf: 0.95
    attack: T1218.007
    near_lines: 12
    all:
      - id: micro-behaviors/data/archive/extract/app-package::batch-msi-administrative-image
      - id: micro-behaviors/os/package-manager/config::batch-msiexec-user-target
      - id: micro-behaviors/os/package-manager/config::msiexec-quiet-switch
      - id: micro-behaviors/os/privilege/restrict::batch-runas-trustlevel
      - id: objectives/evasion/process/hidden/launcher::batch-wsh-hidden-self-relaunch

  - id: batch-hidden-msi-download-trustlevel-launch
    desc: Hidden MSI staging and trust-level launch with TEMP download
    crit: hostile
    conf: 0.97
    attack: T1105,T1218.007
    near_lines: 12
    all:
      - id: batch-msi-image-trustlevel-stage
      - id: micro-behaviors/communications/http/download/curl::batch-curl-download-to-temp
