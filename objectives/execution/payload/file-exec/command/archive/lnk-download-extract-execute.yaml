defaults:
  crit: hostile
  platforms: [windows]
  for: [lnk]
  attack: T1204.002,T1105,T1059
  conf: 0.97

# LNK download cradles that hide behind conhost, fetch a remote archive with
# curl, expand it with tar, and execute the staged script. Each leg is a
# distinct role (proxy, download, extraction, execution, concealment), so one
# observation cannot satisfy the threshold twice.
composite_rules:
  - id: lnk-hidden-curl-archive-script-stage
    desc: Hidden LNK curl-downloads an archive for script execution
    all:
      - id: micro-behaviors/process/config/target::lnk-conhost-target
      - id: micro-behaviors/communications/http/download/cli/curl-wget::lnk-arg-curl-output-download
      - id: micro-behaviors/data/archive/extract/tar::lnk-tar-archive-extraction
      - id: micro-behaviors/process/deploy/file-exec/command::lnk-php-script-execution
    any:
      - id: micro-behaviors/process/config/launch::lnk-conhost-headless-cmd
      - id: micro-behaviors/ui/window/state::hidden-or-minimized-window
