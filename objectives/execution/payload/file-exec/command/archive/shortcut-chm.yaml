defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1105


composite_rules:
  - id: lnk-chm-decompile-dropper
    desc: LNK downloads CHM and launches extraction
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::lnk-arg-curl-output-download
      - id: micro-behaviors/data/archive/extract/chm::lnk-arg-hh-decompile
    any:
      - id: micro-behaviors/process/config/launch::lnk-conhost-headless-cmd
      - id: micro-behaviors/process/argument/file::lnk-arg-launch-second-lnk
  - id: lnk-chm-staged-shortcut-dropper
    desc: LNK downloads and decompiles a staged shortcut
    crit: hostile
    conf: 0.99
    attack: T1105,T1218
    all:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::lnk-arg-curl-output-download
      - id: micro-behaviors/data/archive/extract/chm::lnk-arg-hh-decompile
      - id: micro-behaviors/process/argument/file::lnk-arg-launch-second-lnk
      - id: micro-behaviors/ui/window/state::hidden-or-minimized-window
