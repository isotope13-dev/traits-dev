defaults:
  platforms: [windows]
  for: [batch, powershell, shell, scripts]
  attack: T1574.002,T1105


composite_rules:
  - id: batch-pem-tar-background-launch
    desc: Batch PEM marker, extraction and background launch
    crit: hostile
    conf: 0.97
    for: [batch]
    all:
      - id: micro-behaviors/crypto/certificate/usage::pem-begin
      - id: micro-behaviors/fs/path/app-data/platform::localappdata-env-var-reference
      - id: micro-behaviors/data/archive/extract/tar::batch-system-tar-extract
      - id: micro-behaviors/process/daemonize/background::batch-start-background-directory
