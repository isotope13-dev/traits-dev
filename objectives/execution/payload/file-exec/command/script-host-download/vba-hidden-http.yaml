defaults:
  for: [vbs]
  platforms: [windows]
composite_rules:
  - id: vba-autoopen-http-hidden-launch
    desc: Auto-open macro saves HTTP content with hidden shell execution
    crit: hostile
    attack: T1059.005,T1105,T1564.003
    all:
      - id: micro-behaviors/os/application/hook/event::vba-auto-open-sub-decl
      - id: micro-behaviors/fs/write/stream::vbs-write-http-response-body
      - id: micro-behaviors/fs/write/stream::adodb-stream-progid
      - id: objectives/execution/interpreter/document/macro::vba-hidden-window-shell
    any:
      - id: micro-behaviors/fs/write/stream::vba-savetofile-default-mode
      - id: micro-behaviors/fs/write/stream::wsh-savetofile
