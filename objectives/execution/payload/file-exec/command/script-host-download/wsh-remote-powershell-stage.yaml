# WSH JavaScript retrieves a remote PowerShell script, writes a local script
# file and launches it through a policy-bypassed PowerShell command. This is a
# same-file behavior profile; static co-occurrence does not prove payload
# identity beyond the source's explicit responseText-to-write flow.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1059.001,T1059.007,T1105,T1562.001
composite_rules:
  - id: wsh-remote-powershell-stage-and-launch
    desc: WSH downloads, writes and launches a policy-bypassed PowerShell script
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
      - id: micro-behaviors/process/create/shell/interpreter::powershell-nop-ep-bypass-file-command
      - id: micro-behaviors/process/deploy/interpreter-command::wsh-powershell-policy-launch
      - id: micro-behaviors/communications/url/resource-path/file::executable-url-reference-b

  # In-memory sibling: the script reads a COM HTTP response and launches
  # PowerShell with -EncodedCommand, so no script file is written. Same-file
  # co-occurrence only; it does not prove the response feeds the command.
  - id: wsh-http-response-encoded-powershell-launch
    desc: WSH HTTP reader launches encoded PowerShell
    crit: suspicious
    conf: 0.9
    attack: T1059.001,T1059.007,T1105,T1027.010
    all:
      - id: micro-behaviors/communications/http/client/xmlhttp::http-client-any-obfuscated
      - id: micro-behaviors/process/argument/option::powershell-encoded-command-text
      - id: micro-behaviors/data/control-flow/dispatch/run::script-run-method-call
    any:
      - id: micro-behaviors/communications/http/client/response-body::js-com-response-text-member
      - id: micro-behaviors/communications/http/client/response-body::response-text
