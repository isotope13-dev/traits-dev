defaults:
  platforms: [windows]
  for: [html]
  attack: T1105,T1059.005
  mbc: B0023


composite_rules:
  - id: hta-response-stage-write-execute
    desc: HTA stages an HTTP response to disk and executes it
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/client/response-body::javascript-response-body
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
      - id: micro-behaviors/os/handler/open::shellexecute-method-reference
      - id: metadata/lang/source/syntax/statement::execute-token-line
