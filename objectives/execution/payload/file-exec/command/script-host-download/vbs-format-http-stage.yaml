defaults:
  for: [vbs]
  platforms: [windows]
  attack: T1027,T1059.005,T1059.001

traits:
  - id: vbs-format-iex-fragments
    desc: Script formats reversed IEX fragments
    crit: notable
    if:
      type: text
      regex: '(?i)\{1\}\{0\}[''\"]\s*-\s*f\s*[''\"]x[''\"]\s*,\s*[''\"]ie[''\"]'
  - id: vbs-invoked-http-string
    desc: Script invokes an HTTP URL string
    crit: notable
    if:
      type: text
      regex: '(?i)\.invoke\(\s*[''\"]https?://'
  - id: vbs-webclient-fragment
    desc: Script contains WebClient name fragment
    crit: component
    if:
      type: text
      substr: WebCl

composite_rules:
  - id: vbs-reconstructed-hidden-http-stage
    desc: Reconstructed hidden HTTP PowerShell stage
    crit: hostile
    conf: 0.98
    all:
      - id: vbs-format-iex-fragments
      - id: vbs-invoked-http-string
      - id: vbs-webclient-fragment
      - id: wsh-marker-cleanup
      - id: micro-behaviors/os/com/instantiation::vbs-computed-createobject
      - id: micro-behaviors/process/create/hidden::wsh-run-hidden-wait-statement
