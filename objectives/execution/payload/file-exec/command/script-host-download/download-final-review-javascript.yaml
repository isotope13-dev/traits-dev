defaults:
  crit: hostile
  for:
    - javascript
  platforms:
    - windows

composite_rules:
  - id: js-downloader-wsh-classic
    conf: 0.95
    desc: JavaScript WSH downloader with file drop and execute
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/communications/http/client/xmlhttp::http-client-msxml-serverxmlhttp-progid
      - id: micro-behaviors/process/create/shell/interpreter::wsh-progid-near-run
      - id: micro-behaviors/fs/write/file/handle/unspecified::file-write
