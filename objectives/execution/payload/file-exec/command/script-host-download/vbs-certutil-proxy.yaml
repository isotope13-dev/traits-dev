defaults:
  platforms:
  - windows
  for:
  - vbs
composite_rules:
- id: vbs-certutil-regsvr32-text-payload
  desc: Certutil fetches a text-named regsvr32 stage
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/download/cli::certutil-urlcache-split-force
  - id: micro-behaviors/process/create/shell/script-host::vbs-regsvr32-text-stage-command
- id: vbs-certutil-rundll32-text-payload
  desc: Certutil fetches a text-named rundll32 stage
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/download/cli::certutil-urlcache-split-force
  - id: micro-behaviors/process/create/shell/script-host::vbs-rundll32-text-stage-command
- id: vbs-webrequest-response-expression-loader
  desc: WSH runs policy-bypassed response evaluation
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/client/initialize::vbs-webrequest-create-command-text
  - id: micro-behaviors/communications/http/client/response-body::vbs-response-stream-read-command-text
  - id: micro-behaviors/process/create/shell/wsh::wsh-run-paren-hidden-false
  - id: micro-behaviors/os/security/policy::powershell-policy-bypass-token-sequence
  - id: metadata/file/profile/operation-reference::powershell-expression-command-text
