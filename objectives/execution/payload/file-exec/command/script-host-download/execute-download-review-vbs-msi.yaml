defaults:
  crit: hostile
  platforms: [windows]
  for: [vbs]
  attack: T1059.003,T1105,T1218.007


composite_rules:
  - id: vbs-xmlhttp-fso-command-clues
    desc: VBScript HTTP response, file-write and command execution clues
    conf: 0.99
    attack: T1059.005,T1105
    all:
      - id: micro-behaviors/communications/http/client/xmlhttp::activex-http-progid
      - id: micro-behaviors/communications/http/client/vba::http-open-send
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/communications/http/client/response-body::response-text
    any:
      - id: micro-behaviors/data/control-flow/dispatch/run::run-zero-style-argument
      - id: micro-behaviors/process/create/hidden::wscript-shell-hidden-run
      - id: micro-behaviors/process/argument/option::powershell-flagged-command-line
