defaults:
  platforms: [windows]
  for: [html, javascript]
  attack: T1105,T1203
  mbc: B0024
composite_rules:
  - id: scriptlet-startup-ftp-executable-dropper
    desc: Startup Scriptlet HTA fetches FTP executable
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/persistence/login/startup/folder::scriptlet-startup-hta-shell-persistence
      - id: micro-behaviors/communications/ftp/client::windows-ftp-script-command
      - id: micro-behaviors/communications/ftp/client::ftp-script-echo-get-executable
