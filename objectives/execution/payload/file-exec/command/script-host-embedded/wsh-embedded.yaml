defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
- id: wsh-obfuscated-activex-progid-signal
  desc: Obfuscated WSH ActiveX ProgID staging signal
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/os/com/automation::activex-object-variable-progid
  - id: objectives/anti-static/obfuscation/name-mangling/variables::selfpath-random-function-names

- id: obfuscated-wsh-activex-savetofile-dropper
  desc: Obfuscated WSH decodes, saves, and executes an embedded payload
  crit: hostile
  conf: 0.98
  attack: T1059.007, T1027, T1140
  mbc: B0017, B0018, B0032
  all:
  - id: micro-behaviors/os/com/automation::activex-constructor-call
  - id: wsh-obfuscated-activex-progid-signal
  - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
  - id: micro-behaviors/data/property/access::wscript-bracket-member-access
  - id: micro-behaviors/data/property/access::msxml-node-typed-value
  - id: metadata/lang/source/shape::javascript-run-token-or-call
  any:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
  - id: objectives/execution/activex/com::activex-object-question-delimited-progid
  - id: micro-behaviors/data/control-flow/dispatch/named::js-function-derived-computed-call
  - id: micro-behaviors/data/string/replace::js-bracket-split-join-remove
  - id: objectives/anti-static/obfuscation/name-mangling/variables::js-random-named-functions
- id: wsh-unicode-padded-activex-script-dropper
  desc: WSH unicode padded dropper with ActiveX staging
  crit: hostile
  conf: 0.98
  attack: T1059.007,T1027,T1140,T1204.002
  mbc: B0023,B0032
  all:
  - id: metadata/lang/encoded/unicode-escape::javascript-unicode-escape-volume
  - id: micro-behaviors/data/property/access::msxml-node-typed-value
  - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
  - id: micro-behaviors/os/com/automation::activex-constructor-call
  - id: micro-behaviors/data/property/access::wscript-bracket-member-access
  any:
  - id: micro-behaviors/data/control-flow/dispatch/named::script-run-method-call
  - id: metadata/lang/source/literal/value::run-name-string-token
  unless:
    - id: objectives/execution/payload/file-exec/command/script-host-embedded::obfuscated-wsh-activex-savetofile-dropper

- id: obfuscated-unicode-wsh-activex-modiloader-dropper
  desc: Heavily obfuscated WSH ActiveX dropper with unicode padding
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.007,T1140
  all:
  - id: wsh-unicode-padded-activex-script-dropper
  any:
  - id: objectives/anti-static/obfuscation/name-mangling/variables::js-random-named-functions
  - id: metadata/file/profile/identifier-population::numeric-suffix-identifiers

- id: obfuscated-wsh-charcode-decoded-payload-run
  desc: Char-code WSH dropper decodes, saves, runs payload
  crit: hostile
  conf: 0.97
  attack: T1027,T1059.007
  all:
  - id: micro-behaviors/os/com/automation::activex-object-variable-progid
  - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
  - id: micro-behaviors/data/property/access::msxml-node-typed-value
  - id: objectives/anti-static/obfuscation/string/dynamic::char-code-helper-member-name
  - id: micro-behaviors/data/property/access::wscript-bracket-member-access
  any:
  - id: metadata/lang/source/literal/value::run-name-string-token
  - id: micro-behaviors/data/control-flow/dispatch/named::script-run-method-call
  needs: 1
