# Concealed WSH remote-script staging: require the complete PowerShell
# file-launch command, text-file creation, a remote executable URL and a Run
# call with a zero argument. A bare -File or -NoProfile fragment
# does not establish staging or activation. The ProgIDs may be encrypted.
# This is a same-file code profile, not a source-to-sink flow proof.
defaults:
  crit: hostile
  conf: 0.96
  for: [javascript]
  platforms: [windows]
  attack: T1027,T1059.001,T1059.007,T1105
composite_rules:
  - id: obfuscated-wsh-powershell-file-exec
    desc: Obfuscated WSH remote-script write and PowerShell file-launch clues
    all:
      - id: micro-behaviors/os/com/automation::activex-constructor-call
      - id: metadata/lang/javascript-features::generated-name-or-state-syntax
      - id: micro-behaviors/process/create/flags::powershell-nop-ep-bypass-file-command
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
      - id: micro-behaviors/communications/http/url/script::executable-url-reference-b
      - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-number-argument
