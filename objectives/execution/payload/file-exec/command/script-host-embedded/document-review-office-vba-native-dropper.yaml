defaults:
  platforms: [windows]
  for: [oledoc, ooxml]
  attack: T1105


composite_rules:
  - id: auto-open-vba-stream-dropper
    desc: Auto-open VBA stream file dropper
    crit: hostile
    conf: 0.99
    attack: T1059.005
    all:
      - id: micro-behaviors/os/application/hook/event::raw-auto-open-entrypoint
      - id: micro-behaviors/fs/write/file/stream::vba-adodb-stream-file-write
      - id: micro-behaviors/process/interpreter/wsh::vba-windows-shell-run
  - id: worksheet-cell-staged-exe-dropper
    for: [oledoc, ooxml, vbs]
    desc: Workbook macro rebuilds hidden exe from sheet cells
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.005,T1204.002,T1564.003
    scope: archive
    all:
      - id: micro-behaviors/data/document/spreadsheet::vba-worksheet-range-value-reference
      - id: micro-behaviors/fs/write/file/stream::vba-random-access-file-write
      - id: objectives/execution/interpreter/document/macro::vba-hidden-window-shell
