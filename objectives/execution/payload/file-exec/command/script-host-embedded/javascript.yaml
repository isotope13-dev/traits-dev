# Compromised sites commonly hide a small loader inside a legitimate library
# or application script. The line-count leg establishes a surrounding carrier;
# the remaining legs require the embedded stage to be prefix-obscured, decoded
# directly into Function, and executed immediately.
- id: prefixed-base64-javascript-carrier-loader
  desc: JavaScript carrier executes a prefix-obscured Base64 stage
  crit: hostile
  conf: 0.98
  attack: T1027.013,T1059.007,T1140
  mbc: B0032
  scope: file
  all:
  - id: metadata/file/line::file-has-30-plus-lines
  - id: micro-behaviors/data/decode/base64/unspecified::atob-literal-fixed-prefix-strip
  - id: micro-behaviors/metaprogramming/generation/function::function-from-decoder-or-buffer
  - id: micro-behaviors/process/interpreter/eval/constructed::new-function-iife

- id: passworded-unrar-then-exec-installer
  desc: Passworded unrar then launches extracted installer
  crit: hostile
  conf: 0.97
  attack: T1105,T1059.007
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/data/archive/extract/password::node-unrar-passworded-extractor
  - id: metadata/lang/source/syntax/comparison::js-extname-exe-or-msi
  - id: micro-behaviors/data/control-flow/direct-call::bare-exec-filepath-call
- id: padded-buffer-then-execfile
  desc: Padded file buffer is written and executed
  crit: hostile
  conf: 0.96
