defaults:
  platforms:
  - windows
  for:
  - vbs
composite_rules:
- id: wsh-hidden-hex-program-launch
  desc: WSH hides a hex-built PowerShell program
  crit: suspicious
  conf: 0.98
  all:
  - id: objectives/anti-static/obfuscation/string/delimiter::vbs-padded-wscript-shell-progid-chunks
  - id: micro-behaviors/data/decode/char-code::powershell-hex-integer-conversion-text
  - id: micro-behaviors/process/create/shell/spawn::powershell-variable-program-command
  - id: micro-behaviors/process/create/hidden::wsh-run-hidden-wait-statement
