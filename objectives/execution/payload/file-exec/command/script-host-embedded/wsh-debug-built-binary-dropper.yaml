defaults:
  platforms: [windows]
  for: [vbs, html]

traits:
  - id: wsh-move-binary-to-windir
    desc: WSH command moves an exe into %windir%
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bmove\s+[\w.-]{1,30}\.exe\s+%windir%\\[\w.-]{1,30}\.exe'

  - id: wsh-run-windir-binary
    desc: WSH Run launches an exe from %windir%
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.Run\s*\(?\s*"%windir%\\[\w.-]{1,30}\.exe"'

composite_rules:
  # A WSH script that writes debug.exe memory-enter rows with an rcx length,
  # pipes the file into debug.exe and runs commands hidden is building a
  # binary on disk from text (the pre-PowerShell way to smuggle a PE through
  # a script). Unlike hta-debug-binary-dropper this does not need a concealed
  # HTA window, so it covers scriptlet/VBS carriers (e.g. the ONZ.EXE backdoor
  # dropper that rebuilds a hex decoder with debug, decodes a UPX Win32 PE into
  # %windir% and runs it).
  - id: wsh-debug-built-binary-hidden-dropper
    desc: WSH script builds a binary with debug.exe and runs it hidden
    crit: hostile
    conf: 0.95
    attack: T1059.005,T1140
    all:
      - id: micro-behaviors/process/create/hidden::wscript-shell-hidden-run
      - id: metadata/lang/source/syntax/command/pipeline::any-debug-stdin-redirect
    any:
      - id: micro-behaviors/fs/write/content::wsh-write-debug-memory-script
      - id: micro-behaviors/fs/write/content::wsh-write-debug-split-memory-script

  # The same ONZ-style chain when the debug.exe launch is rewritten (for
  # example `type short.src`): the script still writes the debug memory rows,
  # moves a decoded executable into %windir% and runs it hidden. Requiring the
  # move and the windir launch keeps the finding off converters that only
  # emit a debug script.
  - id: wsh-debug-script-windir-payload-hidden-run
    desc: WSH writes debug rows, moves exe into windir and runs it hidden
    crit: hostile
    conf: 0.93
    attack: T1059.005,T1140
    all:
      - id: micro-behaviors/process/create/hidden::wscript-shell-hidden-run
      - id: wsh-move-binary-to-windir
      - id: wsh-run-windir-binary
    any:
      - id: micro-behaviors/fs/write/content::wsh-write-debug-memory-script
      - id: micro-behaviors/fs/write/content::wsh-write-debug-split-memory-script
