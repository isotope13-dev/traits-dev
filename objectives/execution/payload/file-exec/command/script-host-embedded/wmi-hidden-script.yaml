# Windows Script Host loaders can write an executable script to a variable path
# and pass that path to Win32_Process.Create with a hidden startup object. The
# variable binding prevents a brittle same-call extension matcher, while the
# combination of executable-script creation, FileSystemObject, and hidden WMI
# execution establishes the drop-and-launch behavior.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1047,T1059.007,T1105,T1564.003

composite_rules:
  - id: wsh-script-drop-hidden-wmi-launch
    desc: WSH drops script for hidden WMI launch
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/profile/com-progid::filesystemobject-progid
      - id: micro-behaviors/fs/write/content::script-extension-with-text-file-creation
    any:
      - id: micro-behaviors/process/create/hidden::wmi-hidden-four-argument-process-create
      - id: micro-behaviors/process/create/hidden::wmi-hidden-execmethod-process-create

  - id: obfuscated-wmi-hidden-powershell-stage
    desc: Obfuscated JavaScript stages a command through hidden WMI
    crit: hostile
    conf: 0.98
    attack: T1047,T1059.007,T1027,T1564.003
    all:
      - id: micro-behaviors/os/com/instantiation::activex-object-variable-progid
      - id: micro-behaviors/process/interpreter/wsh::wsh-getobject-variable-argument
      - id: micro-behaviors/os/wmi/query::wmi-showwindow-zero-variable
      - id: micro-behaviors/data/control-flow/dispatch/named::create-method-call
      - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
      - id: micro-behaviors/data/string/concat::js-string-append-cluster
      - id: micro-behaviors/data/string/access::js-charcode-length-modulo-index

  - id: unicode-concealed-startup-copy-hidden-wmi-powershell
    desc: Obfuscated WSH copies itself to Startup and runs PowerShell hidden via WMI
    crit: hostile
    conf: 0.98
    attack: T1027.002,T1047,T1059.001,T1059.007,T1547.001,T1564.003
    all:
      - id: objectives/anti-static/obfuscation/string/conceal::js-nonascii-delimiter-regex-strip
      - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
      - id: micro-behaviors/fs/path/autostart::wsh-special-folders-startup
      - id: micro-behaviors/fs/file/copy/call::copyfile-method-call
      - id: micro-behaviors/os/wmi/query::wmi-execmethod-invocation
      - id: micro-behaviors/os/wmi/query::wmi-process-startup-instance
