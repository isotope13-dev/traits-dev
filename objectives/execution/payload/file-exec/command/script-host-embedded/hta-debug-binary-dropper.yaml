defaults:
  platforms: [windows]
  for: [asp, html, vbs]

composite_rules:
  # Covers the generated ASP/HTA dropper stage emitted by debug.exe HTA builders:
  # writes embedded hex memory-enter rows and rcx length to a temporary file,
  # pipes it into debug.exe hidden inside a concealed HTA window, and stages or
  # deletes the intermediate DOS output.
  - id: hta-debug-binary-dropper
    desc: Concealed HTA runs binary built via debug.exe
    crit: hostile
    conf: 0.98
    attack: T1059.005,T1218.005
    all:
      - id: micro-behaviors/fs/write/content::wsh-write-debug-memory-script
      - id: metadata/lang/source/syntax/command/pipeline::shell-debug-stdin-redirect
      - id: micro-behaviors/process/create/hidden::run-window-style-clues
      - id: micro-behaviors/ui/window/control::any-hta-concealed-window
    any:
      - id: micro-behaviors/fs/delete/file/library::wsh-deletefile-call
      - id: micro-behaviors/fs/file/copy/call::copyfile-member-text
      - id: micro-behaviors/fs/file/copy/call::copyfile-case-variant-member
      - id: micro-behaviors/communications/http/header/content-type::http-content-type-application-hta
