defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
- id: brotli-exe-then-hidden-run
  desc: Defender-excluded Brotli exe with hidden VBS run
  crit: hostile
  conf: 0.96
  attack: T1105,T1059.005
  all:
  - id: micro-behaviors/fs/path/extension::javascript-brotli-executable-suffix
  - id: micro-behaviors/data/decompress/brotli::js-create-brotli-decompress
  - id: micro-behaviors/data/control-flow/dispatch/run::js-vbs-hidden-window-run
  - id: objectives/evasion/anti-av/platform/defender::javascript-defender-exclusion-command-proximity
  near_bytes: 16384
