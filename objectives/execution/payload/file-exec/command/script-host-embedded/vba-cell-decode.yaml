defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
composite_rules:
  - id: vba-cell-decode-save-shell-clues
    desc: Auto-open macro combines worksheet decoding, file save and Shell
    scope: archive
    crit: suspicious
    conf: 0.96
    attack: T1027.009,T1059.005
    all:
      - id: micro-behaviors/os/application/hook/event::vba-auto-open-sub-decl
      - id: micro-behaviors/data/codec::msxml-datatype-bin-base64
      - id: micro-behaviors/fs/write/stream::adodb-stream-progid
      - id: micro-behaviors/data/document/spreadsheet::vba-sheet-range-access
      - id: micro-behaviors/data/property/access::msxml-node-typed-value
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file
      - id: micro-behaviors/process/create/shell/command-string::vba-shell-statement
