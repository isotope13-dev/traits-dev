defaults:
  platforms: [windows]
  for: [html]

composite_rules:
- id: htmlhelp-shortcut-certutil-vbscript-loader
  desc: HTML Help shortcut decodes and runs VBScript
  crit: hostile
  conf: 0.99
  all:
    - id: micro-behaviors/os/com/automation::htmlhelp-shortcut-command-param
    - id: micro-behaviors/ui/controls/widget::html-object-click-call
    - id: micro-behaviors/data/decode/to-file::certutil-force-decode-command
    - id: metadata/lang/source/syntax/command/launch::wscript-batch-vbscript-engine-command
  any:
    - id: well-known/app/system/microsoft/html-help::htmlhelp-shortcut-clsid
    - id: well-known/app/system/microsoft/html-help::htmlhelp-hhctrl-clsid
    - id: well-known/app/system/microsoft/html-help::htmlhelp-hhctrl-alternate-clsid

