defaults:
  platforms: [windows]
  for: [html]

composite_rules:
- id: htmlhelp-shortcut-certutil-vbscript-loader
  desc: HTML Help shortcut decodes and runs VBScript
  crit: hostile
  conf: 0.99
  all:
    - id: micro-behaviors/os/com/automation::htmlhelp-shortcut-command-param
    - id: micro-behaviors/ui/controls/widget::html-object-click-call
    - id: micro-behaviors/data/decode/to-file::certutil-force-decode-command
    - id: micro-behaviors/process/create/shell/script-file::wscript-batch-vbscript-engine-command
  any:
    - id: metadata/file/profile/com/class-id::htmlhelp-shortcut-clsid
    - id: metadata/file/profile/com/class-id::htmlhelp-hhctrl-clsid
    - id: metadata/file/profile/com/class-id::htmlhelp-hhctrl-alternate-clsid

