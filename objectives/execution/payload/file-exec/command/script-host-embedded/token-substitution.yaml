# Generic text includes UTF-16 scripts with unknown extensions and junk padding.
# Four long-token substitutions plus shell creation and a variable Run argument
# support obfuscated command activation without depending on payload spellings.
defaults:
  platforms: [windows]
  for: [vbs, text]
composite_rules:
  - id: vbs-token-substitution-shell-launch
    desc: VBScript shell launch with repeated token substitution
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.005
    near_lines: 80
    all:
      - id: objectives/anti-static/obfuscation/string/recovery::vbs-long-token-character-substitution-chain
      - id: micro-behaviors/os/com/instantiation::wscript-shell-createobject
      - id: metadata/lang/source/syntax/call/member::run-variable-path
