composite_rules:
- platforms:
  - unix
  for:
  - python
  - pyc
  id: python-hidden-temp-symlink-launch-profile
  desc: Python hidden temp symlink and interpreter launch
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/fs/temp/directory::python-hidden-svc-prefix-mkdtemp
  - id: micro-behaviors/fs/link::python-source-link-symlink-call
  - id: micro-behaviors/process/create/subprocess/reference::python-executable-link-path-subprocess
  - id: objectives/execution/staging/runtime::python-generate-stager-call-text
  - id: micro-behaviors/fs/write/file/mode::python-stager-path-open-write-mode
  - id: metadata/lang/source/syntax/call/member::python-stager-path-chmod-755-text
