---
composite_rules:
- platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  id: jscript-batch-exec-adodb-fragment-clues
  desc: JScript batch execution and ADODB fragment clues
  crit: suspicious
  conf: 0.95
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/process/create/subprocess/reference::batch-script-execution
  - id: metadata/lang/source/literal/string/shape::adodb-fragment-dodb
  any:
  - id: micro-behaviors/data/string/reverse::split-reverse-join-string
  - id: micro-behaviors/data/encode/charset::windows-1251-charset
