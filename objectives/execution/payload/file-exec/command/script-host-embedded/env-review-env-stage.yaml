defaults:
  platforms: [windows]
  for: [javascript, text, data]
  attack: T1059.007

composite_rules:
- id: wsh-embedded-blob-environment-loader
  desc: WSH stages embedded blobs through process environment and launches hidden
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.001,T1059.007,T1140,T1564.003
  for: [javascript]
  all:
  - id: metadata/file/encoding/base64::multiple-long-base64-literals
  - id: micro-behaviors/fs/write/file/stream::js-savetofile-dynamic-path-mode-2
  - id: micro-behaviors/os/env/read/variable::wsh-process-environment
  - id: micro-behaviors/data/decode/custom::js-multi-charcode-decoder
  - id: micro-behaviors/data/string/concat/expression::massive-concatenation-chain
  - id: micro-behaviors/process/create/hidden::wscript-shell-hidden-run

