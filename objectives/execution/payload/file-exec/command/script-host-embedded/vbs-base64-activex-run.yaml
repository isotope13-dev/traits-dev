defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027

composite_rules:
  - id: vbs-base64-activex-run
    desc: VBScript Base64 and ActiveX clues with shell Run
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.005,T1140
    all:
      - id: metadata/file/line::vbs-long-average-lines
      - id: micro-behaviors/data/encode/payload::vbs-appended-large-base64-payload
      - id: micro-behaviors/data/property/access::msxml-node-typed-value
      - id: micro-behaviors/os/com/instantiation::activex-object-variable-progid
      - id: micro-behaviors/process/create/shell/interpreter::wsh-progid-near-run
  - id: vbs-obfuscated-embedded-pe-dropper
    desc: Obfuscated VBScript decodes an embedded PE, writes it, and launches it hidden
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.005,T1140,T1204.002
    all:
      - id: objectives/anti-static/obfuscation/string/concat::vbs-createobject-concat
      - id: micro-behaviors/data/embedded/payload/native::line-wrapped-base64-pe-image
      - id: micro-behaviors/data/property/access::msxml-node-typed-value
      - id: micro-behaviors/fs/write/stream::wsh-savetofile
      - id: micro-behaviors/data/control-flow/dispatch/run::run-zero-boolean-text
