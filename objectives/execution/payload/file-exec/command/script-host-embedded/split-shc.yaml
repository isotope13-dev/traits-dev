defaults:
  platforms:
  - macos
  for:
  - macho
  attack: T1027,T1140
  mbc: B0032
composite_rules:
- id: shc-encrypted-script-launcher
  desc: SHC wrapper decrypts and executes script
  crit: suspicious
  conf: 0.95
  size_max: 262144
  all:
  - id: metadata/lang/compiler/generated::shc-script-wrapper
  - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::arc4-routine-symbol
  - id: metadata/binary/section/ratio::data-larger-than-cstring
  - id: micro-behaviors/process/replace::c-exec-variants
  - id: metadata/signature/absent::unsigned-macho
