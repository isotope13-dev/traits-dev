defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
  attack: T1059.007
composite_rules:
- id: obfuscated-wsh-com-dropper
  for: [vbs]
  desc: Obfuscated WSH stages and evaluates hidden script
  crit: hostile
  conf: 0.95
  mbc: B0017
  all:
  - id: micro-behaviors/fs/write/stream::wsh-savetofile
  - id: micro-behaviors/process/interpreter/eval/powershell::powershell-expression-command-text
  - id: micro-behaviors/process/create/hidden::wsh-hidden-async-run
  - id: micro-behaviors/fs/file/io-mode::vbs-stream-binary-mode
  any:
  - id: objectives/anti-static/obfuscation/wsh::vbs-execute-concat-code
  - id: micro-behaviors/os/com/instantiation::vbs-computed-createobject
  - id: objectives/execution/interpreter/script/wsh::wscript-shell-obfuscated
  - id: metadata/lang/source/naming/function/system::split-expandenv-name-fragment
  unless:
  - id: metadata/build/scaffold::windows-wget-js-bootstrap-helper
  downgrade:
    any:
    - id: well-known/app/productivity/winmerge/
- id: singapore-delimited-wsh-download-run
  desc: Singapore-delimited WSH download and run
  for: [javascript]
  crit: hostile
  conf: 0.98
  attack: T1059.007, T1105, T1027
  mbc: B0017, B0018, B0032
  all:
  - id: micro-behaviors/data/string/replace::singapore-delimiter-cleanup
  - id: metadata/lang/source/literal/fragment/single::singapore-activex-shard
  - id: metadata/lang/source/literal/fragment/single::singapore-wsc-name-fragment
  - id: metadata/lang/source/literal/fragment/single::singapore-oresxs-fragment
  - id: well-known/lib/platform/microsoft-ado::split-adodb-stream-progid
  - id: metadata/lang/source/literal/fragment/single::split-respon-name-fragment
  - id: metadata/lang/source/literal/fragment/single::split-savetofile-overwrite
  - id: micro-behaviors/os/env/path::temp-exe-fragmented-path
  - id: micro-behaviors/data/control-flow/dispatch/named::wscript-shell-run-indirect
  any:
  - id: micro-behaviors/communications/http/client/xmlhttp::xmlhttp-status-200-text-profile
  - id: micro-behaviors/communications/http/message::http-prefix
- id: meredith-obfuscated-wsh-download-run
  for: [javascript]
  desc: Meredith-obfuscated WSH download and run
  crit: hostile
  conf: 0.98
  attack: T1059.007, T1105, T1027
  mbc: B0017, B0018, B0032
  all:
  - id: objectives/anti-static/obfuscation/encoding/lookup::js-meredith-base64-decoder
  - id: objectives/anti-static/obfuscation/syntax::js-dynamic-global-constructor-chain
  - id: metadata/lang/encoding/base64::meredith-encoded-activexobject
  - id: metadata/lang/encoding/base64::meredith-encoded-expandenv
  - id: metadata/lang/encoding/base64::meredith-encoded-wscript-host
  - id: metadata/lang/encoding/base64::meredith-encoded-responsebody
  - id: metadata/lang/encoding/base64::meredith-encoded-http-prefix
  - id: metadata/lang/encoding/base64::meredith-encoded-run-method
  - id: objectives/anti-analysis/environment-detect/wsh::obfuscated-wscript-host-check
  - id: micro-behaviors/fs/write/file/stream::wsh-save-to-file
- id: tokenized-wsh-powershell-responsetext-ps1-stager
  for: [javascript, vbs]
  desc: Tokenized WSH responseText PowerShell PS1 stager
  crit: hostile
  conf: 0.98
  attack: T1059.007, T1059.001, T1105, T1027
  mbc: B0017, B0032
  all:
  - id: micro-behaviors/process/argument/interpreter::powershell-command-options-text
  - id: micro-behaviors/process/argument/option::escaped-executable-noprofile-fragment
  - id: micro-behaviors/process/argument/option::escaped-noprofile-policy-bypass-fragment
  - id: micro-behaviors/process/argument/option::escaped-file-argument-fragment
  - id: metadata/lang/source/literal/fragment/single::responsete-text-fragment
  - id: micro-behaviors/fs/write/content::fso-text-file-write-api
  - id: well-known/lib/platform/msxml::msxml2-xml-progid-prefix
  - id: micro-behaviors/os/com/instantiation::activex-constructor-call
  - id: micro-behaviors/fs/path/extension::ps1
  any:
  - id: metadata/lang/source/syntax/control-flow::js-while-switch-pattern
  - id: metadata/lang/javascript-features::pipe-delimited-digit-literal
- id: wsh-unicode-padded-base64-dropper
  for: [javascript]
  desc: WSH unicode padded base64 stream dropper
  crit: hostile
  conf: 0.98
  attack: T1059.007,T1027,T1140
  mbc: B0023,B0032
  all:
  - id: metadata/lang/encoding/unicode-escape::unicode-escape-javascript-unicode-escape-volume
  - id: micro-behaviors/data/property/access::msxml-node-typed-value
  - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
  any:
  - id: micro-behaviors/data/control-flow/dispatch/run::script-run-method-call
  - id: metadata/lang/source/literal/string/command::run-name-string-token
  unless:
  - id: objectives/execution/payload/file-exec/command/script-host-embedded::wsh-unicode-padded-activex-script-dropper
