# This HTA builds a PE with DEBUG.EXE's memory-edit commands, waits for the
# debugger to write the generated file, launches that file hidden, and cleans
# up both the staging script and the original local document.  The objective
# matcher requires the ordered write-and-launch path; DEBUG syntax or hidden
# Run calls on their own remain neutral capabilities.
defaults:
  platforms: [windows]
  for: [html]

composite_rules:
  - id: html-debug-generated-pe-hidden-dropper
    desc: HTA writes a PE with DEBUG and launches the generated file hidden
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/com/instantiation::wscript-shell-activex-constructor
      - id: micro-behaviors/fs/write/content::debug-script-memory-edit
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
      - id: micro-behaviors/fs/write/content::debug-script-pe-dos-header
      - id: micro-behaviors/fs/write/content::debug-script-pe-signature
      - id: micro-behaviors/data/control-flow/dispatch/run::run-zero-style-argument
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
      - id: micro-behaviors/fs/delete/file/self::html-deletefile-call
      - id: debug-output-variable-hidden-run

traits:
  # HTML's embedded JScript is exposed as text rather than a call/value-flow
  # graph, so bind the DEBUG name directive to the later WSH Run with the same
  # source identifier. This avoids treating an unrelated hidden Run elsewhere
  # in the page as activation of the staged image.
  - id: debug-output-variable-hidden-run
    desc: Runs the DEBUG-named output file hidden
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)f\.WriteLine\("n "\s*\+\s*fname2\).*?\.Run\(fname2,0,true\)'
