defaults:
  platforms: [windows]
  for: [html, javascript, powershell, batch]
  attack: T1059.001,T1059.003,T1059.005,T1105,T1204.002
  mbc: B0024


composite_rules:
  - id: browser-cache-script-recovery
    desc: Browser cache recovery and temporary script launch
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.003,T1059.005,T1140,T1105
    all:
      - id: micro-behaviors/fs/path/cache::browser-profile-cache-data-path
      # findstr already binds its output to TEMP; arbitrary .txt/.b64 names
      # supplied no independent evidence that the output was encoded.
      - id: micro-behaviors/fs/write/file/redirect::findstr-temp-redirect
      - id: micro-behaviors/data/decode/to-file::certutil-temp-script-decode-clues
      - id: micro-behaviors/process/interpreter/scripting::temp-script-host-path
    near_bytes: 4096
  - id: browser-cache-recursive-script-recovery
    desc: Recursive browser cache recovery and script launch
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.003,T1059.005,T1140,T1105
    all:
      - id: objectives/execution/payload/file-exec/command/browser-cache::browser-cache-script-recovery
      - id: micro-behaviors/fs/directory/readdir/command::batch-recursive-for-loop
    near_bytes: 4096
