defaults:
  platforms: [windows]
  for: [vbs, javascript, html]

traits:
  - id: legacy-browser-cache-directory
    desc: References a legacy browser cache
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)Temporary Internet Files|Content\.IE5|INetCache'

  - id: browser-com-navigation
    desc: Navigates with Internet Explorer automation
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)InternetExplorer\.Application.{0,640}\.Navigate2?\b'

  - id: copy-run-delete-script-file
    desc: Copies, runs and deletes a file
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)\.CopyFile\b[^\r\n]{1,110}[\s;]+\w+\.Run\b.{1,90}\.DeleteFile\b'

  - id: browser-cache-remote-string
    desc: Assigns a browser download URL
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)=\s*["'']https?://[a-z0-9][\w.-]+'

composite_rules:
  - id: legacy-browser-cache-payload-execution
    desc: Browser automation retrieves a file through cache to run and delete
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.005,T1070.004
    all:
      - id: legacy-browser-cache-directory
      - id: browser-com-navigation
      - id: copy-run-delete-script-file
      - id: browser-cache-remote-string
    near_bytes: 1600
