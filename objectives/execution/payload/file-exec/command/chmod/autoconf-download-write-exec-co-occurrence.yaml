defaults:
  platforms:
  - unix
  for:
  - shell
  crit: component

composite_rules:
  - id: autoconf-download-write-exec-co-occurrence
    desc: Autoconf script has nearby download, write, chmod, and exec operations
    conf: 0.9
    scope: file
    all:
      - id: objectives/execution/payload/file-exec/command/chmod::shell-download-write-exec-co-occurrence
      - id: metadata/build/autotools::autoconf-generated-script
