defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
  attack: T1195.002
composite_rules:
  - id: setup-py-wget-tmp-bash
    desc: setup.py downloads shell script to /tmp and runs it
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/build/pip::setup-py
      - id: micro-behaviors/communications/http/download/wget::wget-shell-script-to-tmp
      - id: micro-behaviors/process/deploy/file-exec/command::setup-py-chmod-bash-tmp-sh
    any:
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/os/module/load/name::dunder-import-call
