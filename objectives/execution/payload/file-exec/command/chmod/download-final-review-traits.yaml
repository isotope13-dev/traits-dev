defaults:
  platforms: [windows, unix]
  crit: suspicious
  attack: "T1105"
  mbc: "E1105"
  for: [python, shell]

composite_rules:
  - id: shell-silent-ip-download-chmod-background-exec
    desc: Silent IP download armed and backgrounded with cleanup
    crit: hostile
    conf: 0.97
    attack: "T1105, T1059.004"
    for: [shell]
    all:
      - id: micro-behaviors/communications/http/download/shell::silent-ipv4-url-download
      - id: micro-behaviors/process/deploy/file-exec/command::chmod-exec-literal-local
      - id: micro-behaviors/process/daemonize/background::background-local-exec
    any:
      - id: objectives/evasion/self-delete/cleanup/remove::rm-self-dollar-zero
    needs: 1
  - id: shell-hidden-wget-chmod-detached-stage
    desc: Shell stages hidden payload and detaches it
    crit: hostile
    conf: 0.98
    attack: "T1105, T1059.004"
    mbc: "B0024"
    for: [shell]
    near_lines: 20
    all:
      - id: micro-behaviors/fs/path/hidden::hidden-writable-path
      - id: micro-behaviors/communications/url/host/oob-http::curl-wget-ipv4-url
      - id: micro-behaviors/communications/http/download/wget::wget-output-document-option
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/daemonize/detach::nohup-hidden-output
  - id: shell-hidden-payload-download-chmod-exec
    desc: Shell downloads and arms hidden shell payload
    crit: hostile
    conf: 0.97
    attack: "T1105, T1059.004"
    mbc: "B0024"
    for: [shell]
    near_lines: 20
    all:
      - id: micro-behaviors/fs/path/hidden::hidden-writable-path
      - id: micro-behaviors/communications/url/host/oob-http::curl-wget-ipv4-url
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/daemonize/background::nohup-shell-script-execution
  - id: shell-multi-architecture-detached-downloader
    desc: Shell downloader selects an architecture and launches a fetched payload detached
    crit: hostile
    conf: 0.99
    attack: "T1105,T1059.004"
    mbc: "B0024"
    for: [shell]
    all:
      - id: micro-behaviors/communications/transfer::multiple-download-clients-architecture-references
      - id: micro-behaviors/process/deploy/file-exec/command::shell-download-chmod-exec
      - id: metadata/lang/source/syntax/command/launch::chmod-then-local-execute-command
    any:
      - id: micro-behaviors/process/daemonize/detach::nohup-hidden-output
      - id: micro-behaviors/process/daemonize/devnull::background-execution-devnull
