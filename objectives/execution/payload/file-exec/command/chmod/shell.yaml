defaults:
  attack: T1105
  mbc: B0024
  platforms: [unix, windows]
  for: [shell]
composite_rules:
  - id: busybox-download-chmod-temp-exec
    desc: BusyBox download arms and launches a temporary payload
    crit: suspicious
    conf: 0.97
    attack: "T1105, T1059.004, T1222.002"
    all:
      - id: micro-behaviors/communications/http/download/busybox::wget
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-absolute-path
      - id: micro-behaviors/process/daemonize/background::background-tmp-execution
    near_lines: 30
  - id: raw-ip-busybox-multiarch-dropper
    desc: Raw-IP BusyBox multi-architecture dropper
    crit: hostile
    conf: 0.99
    attack: "T1105, T1059.004"
    all:
      - id: metadata/lang/source/naming/architecture::multi-architecture-name-set
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-literal
    any:
      - id: objectives/execution/staging/transfer::raw-ip-busybox-transfer-chmod-exec
      - id: objectives/execution/payload/file-exec/command/chmod::busybox-download-chmod-temp-exec
  - id: multi-protocol-raw-ip-script-dropper-cleanup
    desc: Raw-IP multi-protocol dropper also deletes staged paths
    crit: hostile
    conf: 0.99
    attack: "T1105,T1059.004,T1222.002,T1070.004"
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/transfer::multiple-download-clients
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/fs/chmod/executable/dangerous::chmod-arm-executable
      - id: micro-behaviors/fs/delete/directory::shell-recursive-delete
    any:
      - id: micro-behaviors/process/create/path-execution::local-execution
      - id: micro-behaviors/process/create/shell/interpreter::interpreter-local-relative-script
    unless:
      - id: metadata/build/autotools::autoconf-generated-script
      - id: micro-behaviors/os/package-manager/installer-script::installer-script
      - id: objectives/execution/payload/file-exec/command/chmod::raw-ip-repeated-download-exec-cleanup
      - id: objectives/evasion/indicator-removal/cleanup::raw-ip-arch-loader-cleanup
  - id: raw-ip-loop-download-chmod-var-exec
    desc: External-IP loop download chmod and execute
    crit: hostile
    conf: 0.98
    attack: "T1105, T1059.004, T1222.002"
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/download/shell::wget-loop-variable-download
      - id: micro-behaviors/process/deploy/file-exec/command::chmod-exec-var-local
  - id: raw-ip-system-path-download-chmod-detached
    desc: Raw-IP download replaces and detaches a system executable
    crit: hostile
    conf: 0.99
    attack: "T1105, T1059.004, T1222.002"
    all:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/communications/http/download/wget::wget-output-document-option
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-system-path-executable
      - id: micro-behaviors/process/daemonize/detach::nohup-system-path-launch
  - id: raw-ip-temp-download-chmod-exec
    desc: Raw-IP temp download chmod execute
    crit: hostile
    conf: 0.99
    attack: "T1105, T1059.004, T1222.002"
    all:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/communications/http/download/wget::wget-output-document-option
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-tmp-file
      - id: metadata/lang/source/syntax/command/launch::tmp-path-execution
      - id: micro-behaviors/process/daemonize/background::background-tmp-execution
  - id: self-deleting-download-chmod-exec
    desc: Self-deleting download chmod execute
    crit: hostile
    conf: 0.97
    attack: "T1105, T1070.004"
    all:
      - id: objectives/execution/staging/transfer::shell-download-chmod-local-exec
    any:
      - id: objectives/evasion/self-delete/file/script::self-delete-shell
      - id: objectives/evasion/self-delete/cleanup/remove::rm-self-dollar-zero
  - id: self-deleting-multiarch-download-dropper
    desc: Self-deleting multi-architecture download dropper
    crit: hostile
    conf: 0.98
    attack: "T1105, T1059.004, T1070.004"
    all:
      - id: objectives/execution/payload/file-exec/command/chmod::self-deleting-download-chmod-exec
      - id: "micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist"
    any:
      - id: micro-behaviors/communications/http/download/curl::shell-silent-ip-download
      - id: micro-behaviors/communications/url/host/oob-http::curl-external-ip-request
      - id: well-known/tool/sysadmin/busybox::busybox-command
  - id: raw-ip-loop-download-chmod-exec
    desc: Raw IP loop download chmod execute
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/staging/transfer::raw-ip-download-chmod-local-exec
      - id: micro-behaviors/communications/http/download/shell::wget-loop-variable-download
  - id: busybox-redirected-multiarch-dropper
    desc: BusyBox redirected multi-architecture dropper
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/staging/transfer::raw-ip-redirected-download-chmod-exec
      - id: well-known/tool/sysadmin/busybox::busybox-command
      - id: "micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist"
  - id: busybox-raw-ip-bulk-multiarch-dropper
    desc: BusyBox raw-IP bulk multi-architecture dropper
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/payload/file-exec/command/shell::raw-ip-bulk-download-chmod-exec
      - id: well-known/tool/sysadmin/busybox::busybox-command
      - id: "micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist"
  - id: raw-ip-curl-bulk-download-chmod-exec
    desc: Raw IP curl bulk download chmod execute
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/staging/http::raw-ip-curl-literal-download-chmod-local-exec
      - id: micro-behaviors/communications/http/download/shell::curl-http-literal-download-cluster
  - id: raw-ip-curl-bulk-multiarch-dropper
    desc: Raw IP curl bulk multi-architecture dropper
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/payload/file-exec/command/chmod::raw-ip-curl-bulk-download-chmod-exec
      - id: "micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist"
  - id: raw-ip-bulk-self-deleting-dropper
    desc: Raw IP bulk self-deleting dropper
    crit: hostile
    conf: 0.98
    attack: "T1105, T1070.004"
    any:
      - id: objectives/execution/payload/file-exec/command/shell::raw-ip-bulk-download-chmod-exec
      - id: objectives/execution/payload/file-exec/command/chmod::raw-ip-curl-bulk-download-chmod-exec
    all:
      - id: objectives/evasion/self-delete/cleanup/remove::rm-self-dollar-zero
  - id: multiarch-download-execute-loop
    desc: Multi-architecture download execute loop
    crit: hostile
    conf: 0.98
    attack: "T1105, T1059.004"
    all:
      - id: "micro-behaviors/os/sysinfo/platform/arch::multi-arch-target"
      - id: objectives/execution/staging/transfer::shell-download-chmod-local-exec
    any:
      - id: micro-behaviors/communications/http/download/shell::fetch-var-output-var
      - id: micro-behaviors/communications/http/download/shell::wget-loop-variable-download
      - id: micro-behaviors/process/create/path-execution::local-variable-adb-argument
    needs: 2
  - id: raw-ip-multiarch-dropper
    desc: Raw IP multi-architecture dropper
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
      - id: objectives/execution/payload/file-exec/command/chmod::multiarch-download-execute-loop
  - id: raw-ip-multiarch-wget-dropper
    desc: Raw-IP multi-architecture wget dropper
    crit: hostile
    conf: 0.99
    attack: "T1105, T1059.004"
    all:
      - id: objectives/execution/staging/transfer::shell-download-chmod-local-exec
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: "micro-behaviors/os/sysinfo/platform/arch::multiple-architecture-references"
      - id: micro-behaviors/communications/http/download/shell::wget-insecure-tls-download
    unless:
      - id: metadata/build/autotools::autoconf-generated-script
  - id: adb-tagged-multiarch-dropper
    desc: ADB-tagged multi-architecture dropper
    crit: hostile
    conf: 0.98
    attack: "T1105, T1059.004"
    all:
      - id: micro-behaviors/process/create/path-execution::local-variable-adb-argument
      - id: objectives/execution/payload/file-exec/command/chmod::multiarch-download-execute-loop
  - id: multiarch-protocol-literal-exec
    desc: Multi-architecture protocol fallback execution
    crit: hostile
    conf: 0.99
    attack: "T1105,T1059.004,T1222.002"
    all:
      - id: micro-behaviors/communications/transfer::multiple-download-clients
      - id: "micro-behaviors/os/sysinfo/platform/arch::multiple-architecture-references"
      - id: micro-behaviors/fs/chmod/executable/dangerous::chmod-777-near-local-exec
      - id: micro-behaviors/process/create/path-execution::local-execution
    unless:
      - id: objectives/execution/payload/file-exec/command/chmod::raw-ip-repeated-download-exec-cleanup
      - id: well-known/lib/ai/inspect-evals::eval-corpus-context
      - id: metadata/package/documentation/security-exercise::ctf-writeup-shell-walkthrough
      - id: objectives/execution/staging/store::raw-ip-multiarch-fallback-launch
  - id: raw-ip-ftp-multiarch-payload-sweep
    desc: Repeated raw-IP FTP payloads are armed, run and deleted across architectures
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.004,T1222.002,T1070.004
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-literal
      - id: micro-behaviors/communications/ftp/download/busybox::repeated-ftpget-utility-fetch
      - id: micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
      - id: micro-behaviors/process/create/path-execution::execute-dot-slash-literal
      - id: micro-behaviors/fs/delete/file/command::rm-local-named-file
  - id: raw-ip-shell-self-deleting-dropper
    desc: Raw-IP shell dropper deletes its launcher
    crit: hostile
    conf: 0.99
    attack: "T1105,T1059.004,T1070.004"
    platforms: [unix]
    all:
      - id: micro-behaviors/process/daemonize/detach::raw-ip-chmod-nohup-context
      - id: objectives/evasion/self-delete/cleanup/remove::rm-self-dollar-zero
