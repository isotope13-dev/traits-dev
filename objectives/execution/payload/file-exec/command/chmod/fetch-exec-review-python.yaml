defaults:
  for: [python]
  platforms: [linux, macos, windows, unix, android, ios]
  mbc: "B0030"


composite_rules:
  - id: python-hidden-temp-world-writable-payload
    desc: Python launches hidden temporary payload after HTTP fetch
    crit: hostile
    conf: 0.99
    attack: T1105,T1222.002,T1059.006,T1564.001
    platforms: [unix]
    near_bytes: 320
    all:
      - id: micro-behaviors/communications/http/client/response-body::python-client-response-body-cooccurrence
      - id: "micro-behaviors/fs/path/hidden::hidden-tmp-dotfile-path"
      - id: micro-behaviors/fs/chmod/modify::chmod-call-with-octal-777
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
  - id: unverified-python-release-bootstrap
    desc: Python downloads and launches an unverified release archive
    crit: suspicious
    conf: 0.92
    attack: "T1059.006,T1105,T1222.002"
    near_lines: 48
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/data/archive/extract/tar::python-tarfile-extractall
      - id: micro-behaviors/fs/chmod/executable/mode::python-executable
      - id: micro-behaviors/process/create/subprocess/launch::run-ast
    unless:
      - id: well-known/tool/development/lint/rumdl::cold-start-benchmark-context
      - id: metadata/build/recognized-contexts::python-release-binary-cli-shim
      - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context
      - id: micro-behaviors/data/archive/extract/tar::python-tar-member-path-guard
      - id: micro-behaviors/os/package-manager/installer-script::vendor-bootstrap-download-context
