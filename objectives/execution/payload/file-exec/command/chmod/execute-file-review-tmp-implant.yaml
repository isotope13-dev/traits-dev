defaults:
  platforms: [linux, macos]
  for: [scripts, source, manifests]
  attack: T1105,T1059.004
  mbc: B0024


composite_rules:
  - id: fetch-chmod-detached-temp
    desc: Fetch, chmod and detached launch from temp
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-tmp-file
      - id: metadata/lang/source/syntax/command/launch::detached-temp-path-launch
    any:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::fetch-output-flag-script
      - id: micro-behaviors/communications/http/download/cli/curl-wget::fetch-output-flag-embedded-command
      - id: micro-behaviors/communications/url/host/oob-http::curl-schemeless-external-ip-request
      - id: micro-behaviors/communications/url/host/oob-http::curl-external-ip-request
