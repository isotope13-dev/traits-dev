defaults:
  platforms: [unix]
  for: [ruby]

composite_rules:
  - id: ruby-encoded-domain-world-writable-download-launch
    desc: Ruby resolves an encoded domain and launches a world-writable download
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.006,T1027
    all:
      - id: micro-behaviors/process/deploy/file-exec/command::ruby-http-body-executable-file-launch
      - id: micro-behaviors/communications/url/host/name::base64-domain-content
      - id: micro-behaviors/fs/chmod/executable/dangerous::ruby-0777-parens
