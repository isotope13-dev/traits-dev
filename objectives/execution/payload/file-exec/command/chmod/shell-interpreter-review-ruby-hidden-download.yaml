defaults:
  for: [ruby]
  platforms: [unix]
traits:
  - id: ruby-hidden-temp-shell-fetch-chmod-run-chain
    desc: Hidden temp fetch and launch shell command
    crit: suspicious
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^(system|exec)$'
      arg:
        index: 0
        kind: string
        regex: '^(curl|wget) [^\n]{1,300}https?://[^\n]{1,350} (-o|-O) /(var/)?tmp/\.[^\s;&]+[^\n]{0,90}&& chmod (\+x|0?755|0?777) /(var/)?tmp/\.[^\s;&]+ && /(var/)?tmp/\.[^\s;&]+( &)?$'

composite_rules:
  - id: ruby-hidden-temp-split-fetch-chmod-run
    desc: Hidden temp fetch chmod and execute sequence
    crit: suspicious
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::fetch-output-hidden-path-script
      - id: micro-behaviors/process/create/exec::ruby-system-process-call
    any:
      - id: micro-behaviors/fs/chmod/modify::ruby-chmod-call-with-octal-exec-mode
      - id: micro-behaviors/fs/chmod/modify::ruby-chmod-call-with-symbolic-exec-mode

  - id: ruby-hidden-temp-fetch-chmod-run-chain
    desc: Hidden temp fetch chmod and launch chain
    crit: suspicious
    conf: 0.98
    any:
      - id: ruby-hidden-temp-shell-fetch-chmod-run-chain
      - id: ruby-hidden-temp-split-fetch-chmod-run
