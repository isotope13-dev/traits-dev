# Staged interpreter/code runner: a PHP page writes operator code to a
# temporary file, marks it executable (0755), launches it through a shell
# (python/perl/ruby/node/gcc/java stages), and deletes it afterwards
# (b374k's eval_go). Probing several execution APIs for availability plus
# the write/arm/run/clean cycle distinguishes a staged code-execution
# feature from ordinary temporary-file use; compile-and-test build tools
# in PHP do not probe interpreter availability this way.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1059.004

composite_rules:
  - id: php-temp-write-chmod-exec-cleanup
    desc: PHP stages a temp script, arms it executable, executes and deletes it
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/write/file/handle/unspecified::php-fwrite
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-0755-mode
      - id: micro-behaviors/fs/delete/file/library::php-unlink
      - id: micro-behaviors/metaprogramming/reflection/resolve::php-multiple-execution-availability-checks
    any:
      - id: micro-behaviors/process/create/shell/command-string::php-system-call
      - id: micro-behaviors/process/create/shell/command-mode::php-shell-exec
      - id: micro-behaviors/process/create/shell/command-mode::php-exec
      - id: micro-behaviors/process/create/shell/command-mode::php-passthru
      - id: micro-behaviors/process/create/shell/command-mode::popen
      - id: micro-behaviors/process/create/subprocess/launch::proc-open
