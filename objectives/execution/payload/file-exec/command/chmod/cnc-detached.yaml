defaults:
  platforms: [linux]
  for: [shell]
  attack: T1105,T1059.004
composite_rules:
  - id: shell-downloader-cnc-hidden-launch
    desc: Downloader arms hidden detached payload with CNC environment
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/command-and-control/botnet/config::shell-cnc-environment-hidden-launch
      - id: micro-behaviors/communications/http/curl/command::curl-command-call
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/daemonize/detach::detached-background-command
