defaults:
  platforms: [unix, openwrt]
  for: [lua]
  attack: T1105
  mbc: E1105


composite_rules:
  - id: lua-https-hidden-executable
    desc: Lua HTTPS download and hidden executable launch clues
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/stream::lua-https-stream-file
      - id: micro-behaviors/fs/path/hidden::hidden-dir-literal
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-make-executable
      - id: metadata/lang/source/naming/function/system::lua-os-execute-symbol
