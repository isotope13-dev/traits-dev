defaults:
  platforms:
  - unix
  for:
  - shell
  crit: component

composite_rules:
  - id: shell-download-write-exec-co-occurrence
    desc: Script has nearby download, file-write, chmod, and local-exec operations
    conf: 0.95
    near_lines: 25
    all:
      - id: micro-behaviors/communications/http/request/client::curl-wget-command-position
      - id: micro-behaviors/fs/write/file/redirect::shell-file-write-command
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/create/path-execution::execute-dot-slash-literal
    any:
      - id: micro-behaviors/communications/http/curl/command::curl-command-call
      - id: micro-behaviors/communications/http/download/cli/curl-wget::wget-command-call
      - id: micro-behaviors/communications/http/download/shell::wget-http-literal-download
