defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  attack: T1105
  mbc: E1105


composite_rules:
  - id: python-urlretrieve-chmod-run
    desc: Python URL retrieve, chmod and process clues
    crit: suspicious
    conf: 0.96
    attack: T1105,T1059.006
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
      - id: micro-behaviors/fs/chmod/executable/mode::python-executable
    any:
      - id: micro-behaviors/process/create/subprocess/launch::run-ast
      - id: micro-behaviors/process/create/exec::python-subprocess-run-call-text
    needs: 1
    unless:
      - id: micro-behaviors/os/package-manager/installer-script::vendor-bootstrap-download-context
      - id: metadata/build/recognized-contexts::release-cli-smoke-test-context
      - id: well-known/tool/development/lint/rumdl::cold-start-benchmark-script
      - id: metadata/build/recognized-contexts::consent-gated-vendor-tunnel-bootstrap
      - id: metadata/build/recognized-contexts::python-release-binary-cli-shim
      - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context
      - id: micro-behaviors/crypto/hash/file::manifest-field-digest-compare
  # Release scripts fetch the AppImageKit project's appimagetool to package
  # the distribution image — the documented AppImage packaging step.
  # Release scripts fetch the AppImageKit project's appimagetool to package
  # the distribution image — the documented AppImage packaging step.
      - id: metadata/build/recognized-contexts::appimagetool-packaging-download-url
