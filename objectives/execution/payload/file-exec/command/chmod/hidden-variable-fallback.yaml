defaults:
  for: [shell]
  platforms: [unix]

composite_rules:
  - id: hidden-download-writable-fallback-launch
    desc: Hidden download armed amid writable-path retries and silenced indirect launch
    crit: hostile
    conf: 0.97
    attack: T1105,T1059.004
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/download/shell::fetch-var-output-var
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/fs/path/hidden::variable-directory-dotfile-assignment
      - id: micro-behaviors/fs/search/content::skip-unwritable-variable-path
      - id: micro-behaviors/process/stdio/configure::silenced-indirect-variable-launch
