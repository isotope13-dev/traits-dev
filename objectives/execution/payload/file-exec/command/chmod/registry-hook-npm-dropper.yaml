defaults:
  platforms: [unix, windows]
  for: [pkginfo]
composite_rules:
- id: postinstall-temp-dropper
  desc: Registry metadata drops and runs tmp payload
  crit: hostile
  conf: 0.995
  attack: "T1105"
  all:
  - id: metadata/package/scripts/reference::versioned-postinstall-hook
  - id: micro-behaviors/communications/http/download/curl::curl-url-temp-output-reference
  - id: micro-behaviors/fs/chmod/executable/mode::versioned-lifecycle-chmod-temp-payload
  - id: micro-behaviors/process/create/shell/local::versioned-lifecycle-temp-payload-exec
  any:
  - id: metadata/file/profile/network-context/cdn::versioned-lifecycle-fastly-lookalike
  - id: micro-behaviors/communications/url/resource-path/collection::telemetry-image-uv-path
  - id: micro-behaviors/process/create/shell/local::versioned-lifecycle-background-exec
  - id: metadata/package/publishing::npm-registry-dist-tarball-url
