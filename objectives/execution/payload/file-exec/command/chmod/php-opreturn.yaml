defaults:
  platforms: [unix, windows]
  for: [php, zip]
composite_rules:
  - id: php-opreturn-payload-launch
    desc: PHP Bitcoin-derived command data accompanies likely temporary payload launch
    crit: hostile
    conf: 0.98
    attack: T1102,T1105,T1059.004
    scope: archive
    all:
      - id: micro-behaviors/data/format/bitcoin-script::bitcoin-opreturn-source
      - id: micro-behaviors/communications/http/client/file-read::file-get-contents-url
      - id: micro-behaviors/process/create/shell/variable-command::php-bitcoin-selected-command-source
      - id: micro-behaviors/data/decode/hex::php-hex-byte-decode
      - id: micro-behaviors/process/deploy/file-exec/command::php-curl-temp-chmod-launch
