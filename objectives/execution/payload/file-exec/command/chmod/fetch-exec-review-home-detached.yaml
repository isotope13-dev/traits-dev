# Single-client raw-IP fetch with home staging and detached launch: the
# script curls a payload from a bare external-IP URL into a file, marks that
# file executable, and launches it detached with its output discarded
# (`nohup ... >/dev/null 2>&1 &`). Unlike the multi-client and multi-arch
# neighbors, one download client is enough when the staging path (a home
# directory rather than an installer location), the insecure transfer flags,
# and the hidden detached launch each corroborate concealment. Legitimate
# updaters fetch from DNS names over verified TLS into program locations and
# keep daemon output; a bare-IP fetch armed and hidden-launched this way has
# no legitimate use.
defaults:
  attack: T1105,T1059.004,T1222.002
  mbc: B0030
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: raw-ip-home-fetch-chmod-detached-launch
    desc: Raw-IP fetch arms home payload for detached launch
    crit: hostile
    conf: 0.97
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/download/cli/curl-wget::fetch-output-flag-script
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-target
      - id: micro-behaviors/process/daemonize/detach::detached-background-command
    any:
      - id: micro-behaviors/communications/http/download/shell::download-to-home
      - id: micro-behaviors/communications/tls/verify/disable::curl-insecure
      - id: micro-behaviors/communications/http/download/curl::curl-silent-output
      - id: micro-behaviors/communications/http/download/shell::wget-insecure-tls-download
      - id: micro-behaviors/communications/http/download/cli/curl-wget::wget-q-flag
    needs: 1
