defaults:
  platforms: [windows]
  attack: "T1204.002"
  for: [lnk]

composite_rules:
- id: lnk-certutil-hidden-powershell
  desc: LNK certutil decoding and hidden PowerShell
  crit: hostile
  conf: 0.98
  attack: T1140,T1059.001,T1564.003
  mbc: B0030
  all:
  - id: micro-behaviors/data/decode/to-file::lnk-certutil-decode
  - id: micro-behaviors/process/create/hidden::lnk-powershell-windowstyle-hidden-argument
  - id: metadata/file/profile/shortcut/options::lnk-exec-bypass-flags
