defaults:
  platforms: [windows]
  attack: "T1204.002"
  for: [lnk]
  mbc: B0030

composite_rules:
- id: lnk-certutil-hidden-powershell
  desc: LNK certutil decoding and hidden PowerShell
  crit: hostile
  conf: 0.98
  attack: T1140,T1059.001,T1564.003
  all:
  - id: micro-behaviors/data/decode/to-file::lnk-certutil-decode
  - id: micro-behaviors/ui/window/state::lnk-powershell-windowstyle-hidden-argument
  - id: micro-behaviors/process/argument/interpreter::lnk-execution-related-flags

- id: lnk-obfuscated-decoder-and-script-command
  desc: LNK combines obfuscated certutil decoding with a chained script command
  crit: hostile
  conf: 0.97
  attack: T1140,T1059.003,T1204.002
  all:
  - id: micro-behaviors/data/decode/to-file::lnk-variable-fragment-certutil-decode
  - id: micro-behaviors/process/argument/option::lnk-slash-c-switch
  - id: micro-behaviors/process/argument/option::lnk-args-command-chain-operator
  - id: micro-behaviors/process/argument/file::lnk-args-script-stage
