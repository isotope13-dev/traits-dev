defaults:
  platforms: [windows]
  for: [pe]
  attack: T1059.001

composite_rules:
  # The reviewed handler writes supplied bytes to a temporary file, then
  # launches .ps1 files with policy bypass. These legs establish the API
  # profile, not a binding between arbitrary write and launch arguments.
  - id: managed-plugin-backdoor-powershell-file-references
    desc: Plugin backdoor with file-write and PowerShell bypass launch APIs
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/command-and-control/backdoor/dispatch/module::managed-plugin-tasking-backdoor
      - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
      - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
      - id: micro-behaviors/os/security/policy::powershell-policy-bypass-text
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start-call
