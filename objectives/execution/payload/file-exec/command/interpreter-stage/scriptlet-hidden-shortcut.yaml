defaults:
  platforms: [windows]
  for: [xml, javascript]
  attack: T1218.010,T1036.007
traits:
  - id: scriptlet-hidden-document-shortcut-launch
    desc: Scriptlet silently launches document-named LNK
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule scriptlet_hidden_document_shortcut_launch {
          strings:
            $container = "<scriptlet>" nocase
            $registration = "<Registration" nocase
            $shell = "WScript.Shell" nocase
            $hidden_run = /\.Run\(["'][^\r\n]{1,400}\.(docx?|pdf|xlsx?)\.lnk["'],\s*0\)/ nocase
            $process_guard = "CommandLine FROM Win32_Process" nocase
          condition:
            all of them
        }
