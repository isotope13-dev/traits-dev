# Runtime byte-array decryption and staged PowerShell script evaluation across
# Windows shortcuts, batch launchers, and PowerShell stagers.
defaults:
  platforms: [windows]
  for: [lnk, powershell, batch]
  attack: T1140,T1059.001,T1027
  mbc: B0032,E1059

composite_rules:
  - id: decrypted-byte-array-staged-eval
    desc: Decrypts byte array and evaluates PowerShell
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/string/numeric::decimal-byte-sequence-literal
      - id: micro-behaviors/data/decode/custom::keyed-byte-loop-decoder
      - id: micro-behaviors/data/decode/utf8::dotnet-encoding-getstring
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-stage-eval
