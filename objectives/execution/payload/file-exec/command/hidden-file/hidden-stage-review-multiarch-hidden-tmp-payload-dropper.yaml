defaults:
  for: [scripts, manifests, html, xml, dockerfile, package-lock.json, groovy]
  platforms: [linux, macos, windows]

composite_rules:
- id: multiarch-hidden-tmp-payload-dropper
  desc: Multi-architecture shell dropper downloads and executes hidden payload
  crit: hostile
  conf: 0.99
  for:
    - shell
  platforms:
    - linux
    - macos
  attack: T1105,T1059.004,T1564.001,T1082
  all:
    - id: micro-behaviors/communications/http/download/cli/curl-wget::fetch-output-hidden-path-script
    - id: micro-behaviors/fs/chmod/executable/hidden::chmod-hidden-tmp-executable
    - id: micro-behaviors/process/daemonize/background::hidden-tmp-background-exec
    - id: micro-behaviors/os/sysinfo/platform/arch::multi-arch-target
  unless:
    - id: micro-behaviors/os/package-manager/installer-script::installer-script
