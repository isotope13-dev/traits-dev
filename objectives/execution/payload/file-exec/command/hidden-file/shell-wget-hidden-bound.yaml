defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: wget-hidden-output-chmod-exec
    desc: wget hidden output made executable and run
    crit: suspicious
    conf: 0.96
    attack: T1105,T1222.002
    if:
      type: tree-sitter
      language: shell
      query: |
        ((program
          (command name: (command_name) @wget
            argument: (word) @output_flag . argument: (_) @output)
          (command name: (command_name) @chmod
            . argument: (word) @mode . argument: (_) @chmod_path)
          (command name: (command_name) @exec
            . argument: (_) @exec_path))
          (#eq? @wget "wget")
          (#eq? @output_flag "-O")
          (#eq? @chmod "chmod")
          (#eq? @mode "+x")
          (#eq? @exec "exec")
          (#eq? @output @chmod_path)
          (#eq? @output @exec_path)
          (#match? @output "/[.][A-Za-z0-9_-]+[\"']?$"))
