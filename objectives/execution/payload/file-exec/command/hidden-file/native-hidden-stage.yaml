defaults:
  platforms: [unix]
  for: [c]

composite_rules:
  - id: c-hidden-temp-download-exec
    desc: Native source downloads, chmods and invokes a hidden temporary stage
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.004,T1564.001
    scope: file
    near_lines: 8
    all:
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/communications/http/download/cli/curl-wget::short-flag-hidden-temp-dotfile
      - id: micro-behaviors/fs/chmod/remote::chmod-executable-mode-string
      - id: metadata/lang/source/syntax/command/launch::embedded-temp-path-execution
      - id: micro-behaviors/process/create/shell/variable-command::c-system-command-call
