defaults:
  for: [scripts, manifests, html, xml, dockerfile, package-lock.json, groovy]
  platforms: [linux, macos, windows]

composite_rules:
- id: structured-download-chmod-background-hidden-stage
  desc: Structured command downloads and backgrounds hidden stage
  crit: suspicious
  conf: 0.98
  for:
    - vbs
    - package-lock.json
    - plist
    - dockerfile
  near_lines: 3
  all:
    - id: micro-behaviors/communications/http/download/cli/curl-wget::hidden-output-download-context
    - id: micro-behaviors/fs/chmod/executable/hidden::chmod-hidden-path-command-container
    - id: metadata/lang/source/syntax/command/launch::structured-hidden-tmp-background-exec
