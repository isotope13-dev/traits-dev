defaults:
  for:
  - python
  platforms:
  - unix
composite_rules:
- id: python-hidden-ip-download-execution
  desc: Shell fetches an IP-hosted hidden temp executable and backgrounds it
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/download/wget::python-fetch-hidden-temp
  - id: micro-behaviors/fs/chmod/executable/hidden::python-chmod-hidden-temp
  - id: micro-behaviors/process/daemonize/background::python-background-hidden-temp
  near_bytes: 256
  unless:
  - id: metadata/lang/source/shape::python-literal-module-quoted-source

- id: python-hidden-temp-script-drop-exec
  desc: Python stages and executes detached hidden temporary script
  crit: hostile
  conf: 0.97
  attack: T1059.006,T1564.001
  all:
  - id: micro-behaviors/process/create/path-execution::hidden-temp-dotfile-execution
  - id: micro-behaviors/fs/file/open/unspecified::open-hidden-temp-path
  any:
  - id: micro-behaviors/process/daemonize/detach::python-subprocess-new-session-option
  - id: micro-behaviors/process/interpreter/python::sys-executable-popen
  - id: micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-stdio-assignment
  - id: micro-behaviors/fs/path/hidden::tmp-hidden-file
  unless:
  - id: metadata/lang/source/shape::python-literal-module-quoted-source
  - id: metadata/path/directory::test-directory-component
