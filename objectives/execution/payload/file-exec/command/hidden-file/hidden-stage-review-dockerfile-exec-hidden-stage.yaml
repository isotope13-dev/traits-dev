defaults:
  for: [scripts, manifests, html, xml, dockerfile, package-lock.json, groovy]
  platforms: [linux, macos, windows]

composite_rules:
- id: dockerfile-exec-hidden-stage
  desc: Dockerfile executes hidden download stage
  crit: suspicious
  conf: 0.98
  attack: T1105,T1059.004
  for: [dockerfile]
  near_lines: 20
  all:
    - id: objectives/execution/staging/acquire::dockerfile-hidden-fetch-chmod-clues
    - id: micro-behaviors/process/daemonize/background::dockerfile-hidden-tmp-background-exec
