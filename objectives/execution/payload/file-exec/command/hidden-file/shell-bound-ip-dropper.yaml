defaults:
  platforms: [unix]
  for: [shell]
  crit: hostile
traits:
  - id: shell-ip-hidden-chmod-execution
    desc: IP download arms and runs hidden payload
    conf: 0.98
    size_max: 50000
    if:
      type: tree-sitter
      language: shell
      query: |
        ((list
          (list
            (command name: (command_name) @client
              argument: (word) @flags
              . argument: (word) @url
              . argument: (word) @output_flag
              . argument: (_) @destination .)
            "&&"
            (command name: (command_name) @chmod
              . argument: (word) @mode
              . argument: (_) @armed .))
          "&&" (command name: (command_name (_) @executed) .)) @chain
          (#eq? @client "curl") (#match? @flags "^-[fsSL]+$")
          (#match? @url "^https?://[0-9]{1,3}(\\.[0-9]{1,3}){3}(:[0-9]+)?/")
          (#match? @output_flag "^(-o|--output)$")
          (#match? @destination "^~/\\.[A-Za-z0-9_.-]+$")
          (#eq? @chmod "chmod") (#eq? @mode "+x")
          (#eq? @destination @armed) (#eq? @destination @executed))
    unless:
      - {type: symbol, kind: function, exact: curl}
      - {type: symbol, kind: function, exact: chmod}
