defaults:
  platforms: [macos]
  for: [applescript]
composite_rules:
  - id: applescript-hidden-curl-chmod-launch
    desc: Insecure curl, hidden launch and sshd path clues
    crit: hostile
    conf: 0.96
    attack: T1059.002,T1105,T1564.001,T1036
    all:
      - id: applescript-hidden-curl-chmod-launch-clues
      - id: micro-behaviors/communications/tls/verify/disable::applescript-curl-insecure-flags
      - id: micro-behaviors/fs/path/hidden::disguised-sshd-temp-path
