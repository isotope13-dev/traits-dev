defaults:
  platforms: [unix, android]
  for: [shell]

traits:
  - id: shell-download-exec-same-hidden-temp-file
    desc: Downloads and runs same hidden temp file
    crit: notable
    conf: 0.97
    attack: T1105,T1059.004
    if:
      type: tree-sitter
      language: shell
      query: |
        ((list
          (list
            [(command name: (command_name) @fetch
                argument: (word) @output
                . argument: (_) @downloaded) @download
             (redirected_statement body: (command name: (command_name) @fetch
                argument: (word) @output
                . argument: (_) @downloaded) @download)]
            "&&"
            (command name: (command_name) @chmod
              . argument: (word) @mode
              . argument: (_) @armed .))
          "&&"
          [(command name: (command_name (_) @launched))
           (command name: (command_name) @exec . argument: (_) @launched)]) @evidence
          (#match? @fetch "(^|/)(curl|wget)$")
          (#match? @download "\\s['\"]?https?://")
          (#match? @output "^(-[a-zA-Z]*[oO]|--output(-document)?)$")
          (#match? @downloaded "^['\"]?/(tmp|var/tmp|dev/shm)/\\.[A-Za-z0-9_.-]+['\"]?$")
          (#match? @chmod "(^|/)chmod$")
          (#match? @mode "^([aug]+)?\\+x$|^0?[17][057][057]$")
          (#eq? @exec "exec")
          (#eq? @downloaded @armed)
          (#eq? @downloaded @launched))
