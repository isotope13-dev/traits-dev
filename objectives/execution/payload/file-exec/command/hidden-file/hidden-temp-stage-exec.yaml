defaults:
  platforms: [unix]
  for: [shell, python, ruby, perl, javascript, typescript]
  attack: T1105,T1059.004,T1564.001
  mbc: B0024

composite_rules:
  - id: endpoint-reachability-probe-clue
    desc: Netcat port probe or curl status probe
    platforms: [unix, windows]
    for: [shell, scripts]
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/communications/socket/netcat::nc-zero-io-port-probe
      - id: micro-behaviors/communications/http/curl/command::curl-null-sink-status-probe

  - id: hidden-dotfile-staging-clue
    desc: Downloads payload to hidden dotfile
    platforms: [unix, windows]
    for: [shell, scripts]
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/communications/http/download/curl::shell-curl-hidden-output
      - id: micro-behaviors/communications/http/download/cli/curl-wget::download-to-hidden-temp-dotfile

  - id: direct-ip-or-arch-binary-source
    desc: External IP URL or OS/arch binary path
    platforms: [unix, windows]
    for: [shell, scripts]
    crit: notable
    conf: 0.93
    any:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/communications/url/resource-path/automation::api-download-os-arch-binary

  - id: hidden-temp-dotfile-download-exec
    desc: Stages and runs probed or IP-hosted dotfile
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::download-to-hidden-temp-dotfile
      - id: micro-behaviors/process/create/path-execution::hidden-temp-dotfile-execution
      - id: micro-behaviors/communications/http/url/transfer::remote-transfer-url-or-client-clue
    any:
      - id: direct-ip-or-arch-binary-source
      - id: endpoint-reachability-probe-clue
    unless:
      - id: metadata/lang/embedded::shell
      - id: metadata/lang/source/shape::python-literal-module-quoted-source
      - id: metadata/package/testing/presence/fixture::synthetic-data-generator-filename

  - id: probed-endpoint-hidden-binary-stager
    desc: Probes remote endpoint and stages dotfile
    platforms: [unix, windows]
    for: [shell, scripts]
    crit: hostile
    conf: 0.98
    attack: T1105,T1046,T1564.001
    all:
      - id: endpoint-reachability-probe-clue
      - id: micro-behaviors/communications/http/curl/command::curl-write-out-status-format
      - id: hidden-dotfile-staging-clue
      - id: direct-ip-or-arch-binary-source
    unless:
      - id: metadata/lang/embedded::shell

  - id: bearer-raw-ip-hidden-arch-binary-drop
    desc: Bearer raw-IP fetch drops hidden binary
    platforms: [unix, windows]
    for: [shell, scripts]
    crit: hostile
    conf: 0.97
    attack: T1105,T1564.001
    all:
      - id: micro-behaviors/communications/http/authorization-header::bearer-prefix
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/communications/url/resource-path/automation::api-download-os-arch-binary
      - id: hidden-dotfile-staging-clue
    unless:
      - id: metadata/lang/embedded::shell

  # Perl stagers favor argv-form system() over shell text, so the generic
  # hidden-dotfile rules above miss them: the download target, the chmod and
  # the exec of a variable-held path are still the same staging shape.
  - id: perl-hidden-tmp-download-chmod-exec
    desc: Perl downloads to hidden tmp file and executes it
    for: [perl]
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/fs/path/hidden::tmp-hidden-file
      - id: micro-behaviors/fs/chmod/modify::perl-chmod-call
      - id: micro-behaviors/process/replace::perl-exec-variable
      - id: micro-behaviors/communications/http/client/reference::curl-fail-silent-url-reference
