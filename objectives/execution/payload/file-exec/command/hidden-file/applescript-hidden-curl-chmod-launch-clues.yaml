defaults:
  platforms: [macos]
  for: [applescript]
composite_rules:
  - id: applescript-hidden-curl-chmod-launch-clues
    desc: AppleScript curl, hidden chmod and launch clues
    crit: suspicious
    conf: 0.96
    attack: T1059.002,T1105,T1564.001
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/curl/command::applescript-shell-curl-start
      - id: micro-behaviors/process/deploy/file-exec/command::hidden-temp-chmod-and-launch
      - id: micro-behaviors/communications/http/download/curl::curl-hidden-tmp-output-file
