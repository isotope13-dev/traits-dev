defaults:
  platforms: [windows]
  for: [lnk]
  crit: hostile
composite_rules:
  - id: shortcut-com-download-hidden-script
    desc: Shortcut stages hidden script through COM
    conf: 0.98
    all:
      - id: metadata/file/profile/shortcut/com-automation::lnk-arg-msxml-serverhttp
      - id: metadata/file/profile/shortcut/com-automation::lnk-arg-adodb-stream
      - id: metadata/file/profile/shortcut/com-automation::lnk-arg-responsebody
      - id: metadata/file/profile/shortcut/com-automation::lnk-arg-savetofile
      - id: metadata/file/profile/temp-path::lnk-temp-script-path-argument
      - id: micro-behaviors/process/argument/file::powershell-script-file-argument
      - id: micro-behaviors/process/create/shortcut::lnk-hidden-window-flag
      - id: micro-behaviors/fs/delete/file/script::lnk-arg-delete-temp-script
