defaults:
  platforms: [unix]
  for: [csharp]

traits:
  - id: dotnet-shell-hides-remote-temp-execution
    desc: Process.Start hides a remote shell stage
    crit: hostile
    conf: 0.97
    attack: T1105,T1059.004
    if:
      type: tree-sitter
      language: csharp
      query: |
        ((invocation_expression
          function: (member_access_expression expression: (_) @process name: (identifier) @method)
          arguments: (argument_list
            . (argument (_) @shell)
            . (argument (_) @stage) .)) @evidence
          (#match? @process "(^|\\.)Process$") (#eq? @method "Start")
          (#match? @shell "^@?\"([^\"]*/)?(ba|da|z|k|a)?sh\"$")
          (#match? @stage "^@?\"-[a-z]*c\\s+.*\\b(curl|wget)\\s+[^\\n]{0,200}https?://")
          (#match? @stage "\\s(-[a-zA-Z]*[oO]|--output(-document)?)\\s+/(tmp|var/tmp|dev/shm)/\\.")
          (#match? @stage "2\\s*>\\s*/dev/null[^\\n]{0,80}&&\\s*chmod\\s+[^\\n]{0,60}&&")
          (#match? @stage "&&\\s*(exec\\s+)?/(tmp|var/tmp|dev/shm)/\\.[\\w.-]+\\s*&"))
