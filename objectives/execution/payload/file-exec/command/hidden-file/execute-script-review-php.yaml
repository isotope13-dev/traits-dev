defaults:
  crit: hostile
  conf: 0.99
  platforms: [unix, windows]
  for: [php]
  attack: T1105,T1059.004


composite_rules:
  - id: php-hidden-temp-http-shell
    desc: PHP HTTP request, hidden temp and shell execution clues
    all:
      - id: micro-behaviors/communications/http/client/file-read::php-http-file-request
      - id: micro-behaviors/fs/path/hidden::hidden-tmp-path
      - id: micro-behaviors/process/create/shell/command-mode::php-shell-exec
    any:
      - id: micro-behaviors/communications/http/curl/binding::php-curl-request
      - id: micro-behaviors/communications/http/client/file-read::php-http-file-request
