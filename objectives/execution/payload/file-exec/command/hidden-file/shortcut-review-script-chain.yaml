defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1059.005
  mbc: F0007

composite_rules:
  - id: lnk-delayed-expansion-hidden-powershell-stager
    desc: LNK assembles downloader and stages hidden PowerShell
    crit: hostile
    conf: 0.99
    attack: T1059.003,T1059.001,T1105,T1204.002
    all:
      - id: micro-behaviors/process/config/launch::lnk-conhost-headless-cmd
      - id: metadata/lang/source/syntax/command/control::lnk-delayed-expansion-variable-assignments
      - id: micro-behaviors/communications/http/download/cli/utility::lnk-arg-fetch-to-temp
      - id: micro-behaviors/fs/path/temporary-artifact::lnk-temp-script-path-argument
      - id: micro-behaviors/process/argument/file::powershell-script-file-argument
      - id: micro-behaviors/os/security/policy::lnk-relaxed-execution-policy
      - id: micro-behaviors/ui/window/state::lnk-powershell-windowstyle-hidden-argument

  # A shortcut that runs a batch file through cmd with a minimized window,
  # where the batch stage launches the next script stage minimized with
  # variable-supplied arguments, is a staged delivery chain (the classic
  # disk-image LNK -> CMD -> payload layout), not an application shortcut.
