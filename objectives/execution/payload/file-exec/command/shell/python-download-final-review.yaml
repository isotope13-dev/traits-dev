defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  attack: T1105
  mbc: E1105


composite_rules:
  - id: python-temp-exe-popen-shell-clues
    desc: Python temp EXE and shell Popen clues
    crit: hostile
    conf: 0.95
    attack: T1059.006,T1105
    near_lines: 20
    all:
      - id: micro-behaviors/fs/temp/directory::python-tempdir-exe
      - id: micro-behaviors/process/create/shell/command-mode::popen-shell-true
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
