# Drop-and-execute into the per-user WindowsApps directory.
#
# An implant writes a follow-on executable into
# %LocalAppData%\Microsoft\WindowsApps and launches it. The directory is on the
# default PATH, so the payload can later be started by bare name, and a per-user
# write needs no elevation. QuickFox's Assist.dll plugin used this staging step;
# the shape generalizes to any dropper that targets this alias directory.
defaults:
  platforms: [windows]
  for: [csharp, powershell, pe, dll]
  attack: T1105,T1036
  mbc: B0023

composite_rules:
  - id: windowsapps-powershell-drop-execute
    crit: hostile
    desc: WindowsApps and svchost launch clues
    conf: 0.98
    for: [powershell]
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/fs/path/application/windowsapps::windowsapps-user-path
      - id: micro-behaviors/fs/write/file/full/bytes::write-all-bytes
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-start-launch
    any:
      - id: micro-behaviors/process/info/name::numeric-svchost-executable-name
      - id: micro-behaviors/process/info/name::variable-suffixed-svchost-executable-name
    needs: 1
