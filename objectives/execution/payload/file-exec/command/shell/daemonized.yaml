# Require a remote-script pipeline as well as native API references.
defaults:
  platforms:
  - macos
  for:
  - macho
  attack: T1059.004
  mbc: B0022
composite_rules:
- id: obfuscated-shell-dropper
  desc: Obfuscated shell dropper with cleanup
  crit: suspicious
  conf: 0.94
  all:
  - id: metadata/signed/trust-level::adhoc
  - id: micro-behaviors/process/create/shell/spawn::system-fn
  - id: micro-behaviors/fs/read/file/handle::fscanf
  - id: micro-behaviors/fs/delete/file/library::delete-comp
  - id: objectives/command-and-control/dropper/staging/memory::curl-osascript
  any:
  - id: micro-behaviors/crypto/symmetric/xor/loop::repeating-key-buffer-decode
  - id: metadata/binary/section/entropy::high-entropy-const-region
  unless:
  - id: well-known/lib/runtime/scripted/cpython::cpython-macos-runtime-library
- id: daemonized-shell-dropper
  desc: Daemonized shell dropper with cleanup
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/signed/trust-level::adhoc
  - id: micro-behaviors/process/create/shell/spawn::system-fn
  - id: micro-behaviors/fs/read/file/handle::fscanf
  - id: micro-behaviors/fs/delete/file/library::delete-comp
  - id: micro-behaviors/process/daemonize/detach::fork-new-session
  - id: objectives/command-and-control/dropper/staging/memory::curl-osascript
  unless:
  - id: well-known/lib/runtime/scripted/cpython::cpython-macos-runtime-library
- id: sparse-daemon-shell-dropper
  desc: String-sparse daemonized shell dropper
  crit: hostile
  conf: 0.97
  all:
  - id: daemonized-shell-dropper
  - id: "metadata/file/profile/string-population::binary-strings-at-most-50"
