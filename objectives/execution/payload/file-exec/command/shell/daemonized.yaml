# Require a remote-script pipeline as well as native API references.
defaults:
  platforms:
  - macos
  for:
  - macho
  attack: T1059.004
  mbc: B0022
composite_rules:
- id: obfuscated-shell-dropper
  desc: Obfuscated shell dropper with cleanup
  crit: suspicious
  conf: 0.94
  all:
  - id: metadata/signature/ad-hoc::adhoc
  - id: micro-behaviors/process/create/subprocess/reference::system-command-api-clues
  - id: micro-behaviors/fs/read/file/handle::fscanf
  - id: micro-behaviors/fs/delete/path::native-unlink-remove-evidence
  - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-osascript
  any:
  - id: micro-behaviors/data/bitwise/xor-forms/indexed::repeating-key-buffer-xor-loop
  - id: metadata/binary/section/entropy::high-entropy-const-region
  unless:
  - id: well-known/lib/runtime/scripted/cpython::cpython-macos-runtime-library
- id: daemonized-shell-dropper
  desc: Daemonized shell dropper with cleanup
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/signature/ad-hoc::adhoc
  - id: micro-behaviors/process/create/subprocess/reference::system-command-api-clues
  - id: micro-behaviors/fs/read/file/handle::fscanf
  - id: micro-behaviors/fs/delete/path::native-unlink-remove-evidence
  - id: micro-behaviors/process/daemonize/detach::fork-new-session
  - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-osascript
  unless:
  - id: well-known/lib/runtime/scripted/cpython::cpython-macos-runtime-library
- id: sparse-daemon-shell-dropper
  desc: String-sparse daemonized shell dropper
  crit: hostile
  conf: 0.97
  all:
  - id: daemonized-shell-dropper
  - id: "metadata/binary/layout/strings::binary-strings-at-most-50"
