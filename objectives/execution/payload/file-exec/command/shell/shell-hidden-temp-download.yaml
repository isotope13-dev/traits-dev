# Requires both commands in one && list and the exact same staging path.
# Suspicious: an installer can intentionally download and run a shell script.
# The destination is a hidden temporary file, independent of a host or basename.
defaults:
  platforms: [unix]
  for: [shell]
  crit: suspicious
  conf: 0.97
  attack: T1105,T1059.004

composite_rules:
  - id: node-extract-launch-discovered-executables
    desc: Node extracts and launches discovered executables
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    platforms: [windows, unix]
    attack: T1105,T1204,T1059.007
    scope: file
    all:
      - id: micro-behaviors/data/archive/extract/zip::js-zip-extract-all-to
      - id: micro-behaviors/fs/directory/readdir/language::node-extname-exe-walk
      - id: micro-behaviors/process/create/spawn::child-process-destructured-spawn-call
