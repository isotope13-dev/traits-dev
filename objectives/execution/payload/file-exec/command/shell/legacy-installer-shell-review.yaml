defaults:
  platforms:
  - linux
  - unix
  - macos
  - android
  - ios
  for:
  - shell
composite_rules:
- id: archive-exec-dynamic-dns-reference
  desc: Archive extraction and local execution with dynamic-DNS reference
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/data/archive/extract/tar::tar-extract
  - id: micro-behaviors/process/create/path-execution::execute-dot-slash-literal
  - id: micro-behaviors/communications/url/host/dynamic-dns::dynamic-dns-host-reference
