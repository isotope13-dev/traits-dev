defaults:
  platforms: [windows, unix]
  for: [python, python-sdist]
  attack: T1195.002,T1059

traits:
  - id: python-os-system-canary-gui-app
    desc: Runs GUI canary via os.system
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '\bos\.system\(\s*[''"](mspaint|calc|notepad)(\.exe)?[''"]\s*\)'

composite_rules:
  - id: python-setup-toplevel-os-system-canary-app
    desc: setup.py executes canary GUI application via top-level os.system
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: python-os-system-canary-gui-app
      - id: metadata/build/pip::root-setup-py
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/ui/keywords::python-print-installed-message
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system-string-command
