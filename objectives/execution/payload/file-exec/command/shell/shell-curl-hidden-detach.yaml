# Bind the download, chmod and silent detached launch to the same quoted path,
# and its parent variable to a hidden home directory. Installers can do this
# too: the chain is suspicious, not proof of a hostile payload.
defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: shell-curl-hidden-chmod-detached-script
    desc: Hidden download chmodded and detached silently
    crit: suspicious
    conf: 0.97
    attack: T1105,T1059.004,T1564.001
    if:
      type: tree-sitter
      query: |
        ((program
          (variable_assignment name: (variable_name) @dir
            value: (string) @hidden)
          (command name: (command_name) @curl
            argument: (word) @silent
            argument: (word) @follow
            argument: (word) @output_flag
            argument: (string
              (simple_expansion (variable_name) @download_dir)
              (string_content)) @download
            argument: (string) @url)
          (command name: (command_name) @chmod
            argument: (word) @mode
            argument: (string) @armed)
          (redirected_statement
            body: (command name: (command_name) @nohup
              argument: (word) @shell
              argument: (string) @launched)
            redirect: (file_redirect destination: (word) @null)
            redirect: (file_redirect) @stderr)
          "&") @chain
          (#match? @hidden "^\"\\$HOME/\\.[A-Za-z0-9_./-]+\"$")
          (#eq? @dir @download_dir)
          (#eq? @curl "curl") (#eq? @silent "-s")
          (#eq? @follow "-L") (#eq? @output_flag "-o")
          (#match? @url "^\"https?://")
          (#eq? @chmod "chmod") (#eq? @mode "+x")
          (#eq? @download @armed) (#eq? @download @launched)
          (#eq? @nohup "nohup") (#match? @shell "^(ba)?sh$")
          (#eq? @null "/dev/null") (#eq? @stderr "2>&1"))
