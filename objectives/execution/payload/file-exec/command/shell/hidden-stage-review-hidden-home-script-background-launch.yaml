defaults:
  for: [scripts, manifests, html, xml, dockerfile, package-lock.json, groovy]
  platforms: [linux, macos, windows]

composite_rules:
- id: hidden-home-script-background-launch
  desc: Arms and backgrounds a hidden home-dir script
  crit: hostile
  conf: 0.98
  for:
    - shell
  attack: T1105,T1059.004
  all:
    - id: micro-behaviors/fs/path/hidden::env-home-hidden-path
    - id: micro-behaviors/fs/chmod/executable/hidden::chmod-hidden-home-executable
    - id: micro-behaviors/process/daemonize/background::nohup-shell-script-execution
