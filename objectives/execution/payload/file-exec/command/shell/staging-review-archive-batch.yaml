defaults:
  platforms:
  - unix
  - appliance
  for:
  - shell
  crit: hostile
  conf: 0.99
composite_rules:
- id: shell-embedded-tar-firewall-local-launch
  desc: Embedded tar, firewall and local launch clues
  all:
  - id: micro-behaviors/os/firewall/firewalld::add-port-rule
  - id: micro-behaviors/data/archive/extract/tar::appended-tar-archive
  - id: micro-behaviors/process/create/path-execution::multi-local-executable-launch
- id: shell-embedded-tar-local-launch-self-remove
  desc: Embedded tar, local launch and cleanup clues
  all:
  - id: micro-behaviors/data/archive/extract/tar::appended-tar-archive
  - id: micro-behaviors/process/create/path-execution::multi-local-executable-launch
  - id: objectives/evasion/self-delete/cleanup/remove::rm-self-dollar-zero
  - id: micro-behaviors/fs/delete/file/command::rm-force-variable-target
  near_lines: 80
