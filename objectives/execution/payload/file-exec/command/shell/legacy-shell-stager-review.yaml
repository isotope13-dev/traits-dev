defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
  attack: T1059.004
composite_rules:
- id: architecture-variable-payload-loader
  desc: Architecture-selected payload made executable and run
  crit: hostile
  conf: 0.99
  attack: T1059.004,T1222.002
  all:
  - id: micro-behaviors/fs/file/copy/command::architecture-payload-to-variable
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
  - id: micro-behaviors/process/create/path-execution::local-execution
  - id: micro-behaviors/fs/delete/directory::rm-f
  near_lines: 20
- id: writable-dir-payload-staging-loader
  desc: Writable-directory payload staging and execution
  crit: hostile
  conf: 0.99
  attack: T1059.004,T1222.002
  all:
  - id: micro-behaviors/fs/proc/mounts::noexec-mount-enumeration
  - id: micro-behaviors/fs/path/temp::temporary-directory-candidate-loop
  - id: micro-behaviors/fs/directory/staging::directory-write-test-before-copy
  - id: micro-behaviors/fs/file/copy/command::recursive-copy-variable-destination-portable
  - id: micro-behaviors/process/create/path-execution::local-execution
  - id: micro-behaviors/fs/delete/directory::rm-f
