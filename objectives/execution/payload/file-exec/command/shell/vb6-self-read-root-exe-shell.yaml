defaults:
  platforms:
    - windows
  for: [pe]
  attack: T1027.009
composite_rules:
  - id: vb6-self-read-root-exe-shell
    desc: VB6 self-read and root EXE shell clues
    crit: suspicious
    conf: 0.96
    mbc: B0024
    all:
      - id: micro-behaviors/fs/read/file/handle::vb6-self-name-binary-read-clues
      - id: metadata/file/profile/shell-execution::vb6-binary-open-root-shell-clues
    any:
      - id: micro-behaviors/data/string/split::vb6-split-variable-arguments
      - id: metadata/file/profile/script-transformation::vb6-rc4-name-or-asc-mid
      - id: metadata/lang/source/syntax/declaration::vb6-uppercase-constant-text
