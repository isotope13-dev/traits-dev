defaults:
  for:
  - systemd
  platforms:
  - linux
  attack: T1105,T1059.004
composite_rules:
- id: unit-hidden-remote-download-background-exec
  desc: Unit fetches and backgrounds hidden stage
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/process/deploy/file-exec/command::literal-hidden-download-background-exec
  - id: micro-behaviors/communications/tls/verify/disable::unit-curl-insecure-command
- id: desktop-hidden-remote-download-background-exec
  desc: Desktop fetches and backgrounds hidden stage
  crit: hostile
  conf: 0.98
  for:
  - desktop
  all:
  - id: micro-behaviors/process/deploy/file-exec/command::literal-hidden-download-background-exec
  - id: micro-behaviors/communications/tls/verify/disable::desktop-curl-insecure-command
