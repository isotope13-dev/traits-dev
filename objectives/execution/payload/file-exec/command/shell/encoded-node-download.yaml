defaults:
  platforms: [unix]
  for: [javascript, typescript]
traits:
  - id: hex-fetch-chmod-local-launch-chain
    desc: Hex command downloads and launches executable
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        (call_expression function: (identifier) @exec
          arguments: (arguments (call_expression function: (member_expression
            object: (call_expression function: (member_expression
              object: (identifier) @buffer property: (property_identifier) @from)
              arguments: (arguments (string (string_fragment) @command)
                (string (string_fragment) @encoding)))
            property: (property_identifier) @to_string)))
          (#any-of? @exec "exec" "execSync") (#eq? @buffer "Buffer")
          (#eq? @from "from") (#eq? @to_string "toString") (#eq? @encoding "hex")
          (#match? @command "(?i)^6375726c20")
          (#match? @command "(?i)63686d6f64202b78")
          (#match? @command "(?i)2626202e2f"))
composite_rules:
  - id: node-hex-download-chmod-execute
    desc: Executes concealed download and launch chain
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.004,T1027
    all:
      - id: hex-fetch-chmod-local-launch-chain
      - id: micro-behaviors/process/create/shell/command-string::node-exec-decoded-buffer-command
