# The article records a temporary payload self-test before VMFS impact.
# Proximity does not prove execution order or that both commands use the
# same executable. Maintenance tooling remains a plausible explanation.
defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: temporary-selftest-with-vmfs-target
    desc: Temporary self-test near VMFS program target
    crit: suspicious
    conf: 0.92
    ref: https://securelist.com/esxi-ransomware/121959/
    near_lines: 15
    all:
      - id: micro-behaviors/process/argument/lifecycle::temporary-program-selftest-call
      - id: micro-behaviors/process/argument/file::shell-vmfs-program-target
