# Source-local API context, without claiming a proven file-to-exec flow.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: concealed-reversed-url-file-command-stage
    desc: Concealed download and shell-exec references
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.003,T1027
    near_bytes: 2048
    all:
      - id: metadata/lang/source/syntax/call/invocation::javascript-exec-call
      - id: objectives/anti-static/obfuscation/imports/concealment::escaped-require-module
      - id: micro-behaviors/data/string/reverse::split-reverse-join-string
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: micro-behaviors/fs/write/file/stream::create-write-stream
