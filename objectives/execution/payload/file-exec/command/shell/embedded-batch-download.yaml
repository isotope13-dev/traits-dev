defaults:
  platforms: [windows]
  for: [class, swift]
  attack: T1105,T1059.003
composite_rules:
  - id: jvm-runtime-temp-batch-download-execute
    desc: JVM Runtime executes a downloaded temporary batch script
    crit: hostile
    conf: 0.98
    for: [class]
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/download/curl::curl-http-download-command-reference
      - id: micro-behaviors/process/deploy/file-exec/command::temporary-batch-command-chain
      - id: metadata/import/jvm::java-runtime-exec-bytecode-reference
      - id: micro-behaviors/process/argument/interpreter::java-cmd-exe-c-bytecode-clues

  - id: cmd-curl-temp-batch-download-execute
    desc: cmd.exe downloads and executes temporary batch script
    crit: hostile
    conf: 0.99
    for: [c, cpp, batch, csharp, powershell]
    all:
      - id: micro-behaviors/process/deploy/file-exec/command::temporary-batch-command-chain
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
      - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url
