# A native or managed image that carries a headless cmd.exe line with a BITSAdmin
# transfer and a script-host run with // switches fetches a file and runs it
# through the script host. Legitimate installers do not pair a download with a
# script-host switch in one command line.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: cmd-bitsadmin-download-script-host-run
    desc: Command line BITSAdmin download then script-host run
    crit: hostile
    conf: 0.9
    attack: T1105,T1059.005
    scope: file
    all:
      - id: micro-behaviors/communications/http/download/cli/utility::bitsadmin-transfer-download-template
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-command-text
      - id: micro-behaviors/process/info/name::windows-script-host-switch-invocation
