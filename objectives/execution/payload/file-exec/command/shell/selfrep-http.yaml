defaults:
  for:
    - shell
  platforms:
    - unix
composite_rules:
  - id: raw-ip-bulk-download-chmod-exec
    desc: Bulk HTTP selfrep payload activation
    crit: hostile
    conf: 0.98
    any:
      - id: metadata/file/profile/staging::raw-ip-redirected-download-chmod-exec
      - id: objectives/command-and-control/dropper/delivery/fetch-exec::raw-ip-repeated-download-chmod-exec
    all:
      - id: micro-behaviors/communications/http/download/shell::wget-http-literal-download-cluster
      - id: objectives/command-and-control/botnet/loader::selfrep-launch-argument
    unless:
      - id: objectives/command-and-control/dropper/delivery/fetch-exec::raw-ip-repeated-download-exec-cleanup
      - id: metadata/file/profile/staging::raw-ip-multiarch-fallback-launch
      - id: objectives/execution/payload/file-exec/command/shell::raw-ip-bulk-multiarch-download-exec
    attack: T1105,T1059.004
