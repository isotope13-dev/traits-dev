defaults:
  for:
    - shell
  platforms:
    - unix
  attack: T1105,T1059.004
composite_rules:
  - id: raw-ip-bulk-download-chmod-exec
    desc: Bulk HTTP selfrep payload activation
    crit: hostile
    conf: 0.98
    any:
      - id: objectives/execution/staging/transfer::raw-ip-redirected-download-chmod-exec
      - id: objectives/execution/payload/file-exec/command/chmod::raw-ip-repeated-download-chmod-exec
    all:
      - id: micro-behaviors/communications/http/download/shell::wget-http-literal-download-cluster
      - id: objectives/command-and-control/botnet/loader::selfrep-launch-argument
  - id: raw-ip-multiarch-bulk-wget-chmod-exec
    desc: Repeated raw-IP wget fetches and executes multi-architecture binaries
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/payload/file-exec/command/chmod::raw-ip-repeated-download-chmod-exec
      - id: micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist
      - id: objectives/execution/payload/file-exec/command/fetch::raw-ip-wget-chmod-local-exec
