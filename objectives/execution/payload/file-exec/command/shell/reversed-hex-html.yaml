defaults:
  platforms: [windows]
  for: [html]
traits:
  - id: reversed-hex-write
    desc: Writes reversed long hexadecimal string
    crit: notable
    if:
      type: text
      regex: '(?i)\.Write\s+StrReverse\s*\(\s*"[0-9a-f]{500}'
  - id: reversed-certutil-decodehex
    desc: Reversed certutil hex decoding command
    crit: notable
    if:
      type: text
      substr: 'xehedoced- litutrec'
  - id: reversed-rundll32
    desc: Reversed rundll32 command
    crit: notable
    if:
      type: text
      substr: '23lldnur'
composite_rules:
  - id: html-reversed-hex-dll-loader
    desc: HTML reconstructs and executes hex DLL
    crit: hostile
    conf: 0.99
    all:
      - id: reversed-hex-write
      - id: reversed-certutil-decodehex
      - id: reversed-rundll32
