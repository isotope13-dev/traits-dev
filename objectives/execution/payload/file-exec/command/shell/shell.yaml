defaults:
  attack: T1105
  mbc: B0024
  platforms: [unix, windows]
  for: [shell]
composite_rules:
  - id: htmlhelp-curl-interpreter-stage
    desc: HTML Help Shortcut pipes remote curl output into a command interpreter
    crit: hostile
    conf: 0.99
    attack: T1105,T1059,T1218.001
    platforms: [windows]
    for: [html]
    all:
      - id: micro-behaviors/communications/http/download/curl::curl-response-piped-to-command-interpreter
      - id: objectives/command-and-control/dropper/delivery/chm::htmlhelp-shortcut-obfuscated-auto-fire

  - id: htmlhelp-network-share-command-stage
    desc: HTML Help Shortcut executes a command supplied from a network share
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.003,T1218.001
    platforms: [windows]
    for: [html]
    all:
      - id: micro-behaviors/process/create/shell/command-string::network-share-file-piped-to-cmd
      - id: objectives/command-and-control/dropper/delivery/chm::htmlhelp-shortcut-obfuscated-auto-fire

  - id: busybox-download-chmod-temp-exec
    desc: BusyBox download arms and launches a temporary payload
    crit: suspicious
    conf: 0.97
    attack: "T1105, T1059.004, T1222.002"
    all:
      - id: micro-behaviors/communications/http/download/busybox::wget
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-absolute-path
      - id: micro-behaviors/process/create/local-exec::background-tmp-execution
    near_lines: 30
  - id: raw-ip-busybox-multiarch-dropper
    desc: Raw-IP BusyBox multi-architecture dropper
    crit: hostile
    conf: 0.99
    attack: "T1105, T1059.004"
    all:
      - id: metadata/file/string/identity::multi-architecture-name-set
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-literal
    any:
      - id: micro-behaviors/process/deploy/file-exec::raw-ip-busybox-transfer-chmod-exec
      - id: objectives/execution/payload/file-exec/command/shell::busybox-download-chmod-temp-exec
  - id: encrypted-variable-payload-detached-dropper
    desc: Downloads, decrypts, makes executable, and detaches a shell payload
    crit: hostile
    conf: 0.99
    attack: T1105,T1140,T1222.002,T1059.004
    all:
      - id: micro-behaviors/communications/http/download/shell::fetch-var-output-var
      - id: micro-behaviors/crypto/symmetric/aes/openssl::openssl-aes-decrypt
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
      - id: "micro-behaviors/os/sysinfo/platform/arch::multi-arch-target"
  - id: multi-protocol-raw-ip-script-dropper-cleanup
    desc: Raw-IP multi-protocol dropper also deletes staged paths
    crit: hostile
    conf: 0.99
    attack: "T1105,T1059.004,T1222.002,T1070.004"
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/transfer::multiple-download-clients
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/fs/chmod/executable/dangerous::chmod-arm-executable
      - id: micro-behaviors/fs/delete/directory::shell-recursive-delete
    any:
      - id: micro-behaviors/process/create/local-exec::local-execution
      - id: micro-behaviors/process/create/local-exec::interpreter-local-relative-script
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/autotools::autoconf-generated-script
      - id: micro-behaviors/os/package-manager/installer-script::installer-script
      - id: objectives/command-and-control/dropper/delivery/fetch-exec::raw-ip-repeated-download-exec-cleanup
      - id: objectives/evasion/indicator-removal/cleanup::raw-ip-arch-loader-cleanup

  # A shell script that selects an architecture, retrieves an executable from
  # a literal IP, arms it, detaches it, and removes its launcher is a complete
  # dropper chain. These legs are deliberately structural so the rule remains
  # useful when the server, architecture names, or payload name changes.
      - id: metadata/path::test-directory-component
  - id: raw-ip-loop-download-chmod-var-exec
    desc: External-IP loop download chmod and execute
    crit: hostile
    conf: 0.98
    attack: "T1105, T1059.004, T1222.002"
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/download/shell::wget-loop-variable-download
      - id: micro-behaviors/process/create/local-exec::chmod-exec-var-local
  - id: raw-ip-shell-fetch-chmod-detach
    desc: Shell fetches a raw-IP payload, arms it, and detaches it
    crit: hostile
    conf: 0.99
    attack: "T1105,T1059.004,T1222.002"
    platforms: [unix]
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-target
      - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
    any:
      - id: micro-behaviors/communications/http/download/cli::fetch-output-flag-script
      - id: micro-behaviors/communications/http/download/shell::shell-dev-tcp-http-get-download

  - id: raw-ip-system-path-download-chmod-detached
    desc: Raw-IP download replaces and detaches a system executable
    crit: hostile
    conf: 0.99
    attack: "T1105, T1059.004, T1222.002"
    all:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/communications/http/download/wget::wget-output-document-option
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-system-path-executable
      - id: micro-behaviors/process/daemonize/detach::nohup-system-path-launch
  - id: raw-ip-temp-download-chmod-exec
    desc: Raw-IP temp download chmod execute
    crit: hostile
    conf: 0.99
    attack: "T1105, T1059.004, T1222.002"
    all:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/communications/http/download/wget::wget-output-document-option
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-tmp-file
      - id: micro-behaviors/process/create/local-exec::tmp-path-execution
      - id: micro-behaviors/process/create/local-exec::background-tmp-execution
  - id: raw-ip-masqueraded-shell-dropper
    desc: Raw-IP download executes temp stage
    crit: hostile
    conf: 0.99
    attack: T1105,T1036.007,T1059.004
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/download/fallback::downloader-fallback-chain
      - id: objectives/command-and-control/dropper/delivery/execute-download/script::temp-nonscript-shell-launch
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  - id: self-deleting-download-chmod-exec
    desc: Self-deleting download chmod execute
    crit: hostile
    conf: 0.97
    attack: "T1105, T1070.004"
    all:
      - id: micro-behaviors/process/create/local-exec::shell-download-chmod-local-exec
    any:
      - id: objectives/evasion/self-delete/file/script::self-delete-shell
      - id: objectives/evasion/self-delete/cleanup/remove::rm-self-dollar-zero
  - id: self-deleting-multiarch-download-dropper
    desc: Self-deleting multi-architecture download dropper
    crit: hostile
    conf: 0.98
    attack: "T1105, T1059.004, T1070.004"
    all:
      - id: self-deleting-download-chmod-exec
      - id: "micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist"
    any:
      - id: micro-behaviors/communications/http/download/curl::shell-silent-ip-download
      - id: micro-behaviors/communications/http/url/external-ip::curl-external-ip-request
      - id: micro-behaviors/process/create/shell/busybox::busybox-command
  - id: raw-ip-loop-download-chmod-exec
    desc: Raw IP loop download chmod execute
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/local-exec::raw-ip-download-chmod-local-exec
      - id: micro-behaviors/communications/http/download/shell::wget-loop-variable-download
  - id: busybox-redirected-multiarch-dropper
    desc: BusyBox redirected multi-architecture dropper
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/local-exec::raw-ip-redirected-download-chmod-exec
      - id: micro-behaviors/process/create/shell/busybox::busybox-command
      - id: "micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist"
  - id: busybox-raw-ip-bulk-multiarch-dropper
    desc: BusyBox raw-IP bulk multi-architecture dropper
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/payload/file-exec/command/shell::raw-ip-bulk-download-chmod-exec
      - id: micro-behaviors/process/create/shell/busybox::busybox-command
      - id: "micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist"
  - id: raw-ip-curl-bulk-download-chmod-exec
    desc: Raw IP curl bulk download chmod execute
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/deploy/file-exec::raw-ip-curl-literal-download-chmod-local-exec
      - id: micro-behaviors/communications/http/download/shell::curl-http-literal-download-cluster
  - id: raw-ip-curl-bulk-multiarch-dropper
    desc: Raw IP curl bulk multi-architecture dropper
    crit: hostile
    conf: 0.98
    all:
      - id: raw-ip-curl-bulk-download-chmod-exec
      - id: "micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist"
  - id: raw-ip-bulk-self-deleting-dropper
    desc: Raw IP bulk self-deleting dropper
    crit: hostile
    conf: 0.98
    attack: "T1105, T1070.004"
    any:
      - id: objectives/execution/payload/file-exec/command/shell::raw-ip-bulk-download-chmod-exec
      - id: raw-ip-curl-bulk-download-chmod-exec
    all:
      - id: objectives/evasion/self-delete/cleanup/remove::rm-self-dollar-zero
  - id: multiarch-download-execute-loop
    desc: Multi-architecture download execute loop
    crit: hostile
    conf: 0.98
    attack: "T1105, T1059.004"
    all:
      - id: "micro-behaviors/os/sysinfo/platform/arch::multi-arch-target"
      - id: micro-behaviors/process/create/local-exec::shell-download-chmod-local-exec
    any:
      - id: micro-behaviors/communications/http/download/shell::fetch-var-output-var
      - id: micro-behaviors/communications/http/download/shell::wget-loop-variable-download
      - id: objectives/command-and-control/dropper/delivery/execute-download/script::adb-argument-local-payload
    needs: 2
  - id: raw-ip-multiarch-dropper
    desc: Raw IP multi-architecture dropper
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
      - id: multiarch-download-execute-loop
  - id: raw-ip-hidden-temp-multiarch-fallback-launch
    desc: Raw-IP multi-architecture fallback loader launches a hidden staged executable
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.004,T1564.001
    platforms: [unix]
    all:
      - id: objectives/evasion/file-hiding/staging::hidden-temp-fallback-fetch-exec
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/os/sysinfo/platform/arch::uname-arch-case-normalization
      - id: micro-behaviors/os/sysinfo/platform/arch::multiple-architecture-references
  - id: raw-ip-multiarch-wget-dropper
    desc: Raw-IP multi-architecture wget dropper
    crit: hostile
    conf: 0.99
    attack: "T1105, T1059.004"
    all:
      - id: micro-behaviors/process/create/local-exec::shell-download-chmod-local-exec
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: "micro-behaviors/os/sysinfo/platform/arch::multiple-architecture-references"
      - id: micro-behaviors/communications/http/download/shell::wget-insecure-tls-download
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/autotools::autoconf-generated-script
      - id: metadata/path::test-directory-component
  - id: adb-tagged-multiarch-dropper
    desc: ADB-tagged multi-architecture dropper
    crit: hostile
    conf: 0.98
    attack: "T1105, T1059.004"
    all:
      - id: objectives/command-and-control/dropper/delivery/execute-download/script::adb-argument-local-payload
      - id: multiarch-download-execute-loop
  - id: multiarch-protocol-literal-exec
    desc: Multi-architecture protocol fallback execution
    crit: hostile
    conf: 0.99
    attack: "T1105,T1059.004,T1222.002"
    all:
      - id: micro-behaviors/communications/transfer::multiple-download-clients
      - id: "micro-behaviors/os/sysinfo/platform/arch::multiple-architecture-references"
      # The 777 must arm the payload that is then run locally; a world-writable
      # data directory elsewhere in a multiarch installer is not this attack.
      - id: micro-behaviors/fs/chmod/executable/dangerous::chmod-777-near-local-exec
      - id: micro-behaviors/process/create/local-exec::local-execution
    unless:
      - id: objectives/command-and-control/dropper/delivery/fetch-exec::raw-ip-repeated-download-exec-cleanup
      # cybench challenge resources carry real worm droppers verbatim.
      - id: well-known/lib/ai/inspect-evals::eval-corpus-context
      # Official CTF writeups (HackTheBox Cyber Apocalypse and peers) quote
      # the dissected worm dropper verbatim, cron persistence and all; the
      # authorship header plus the unregistrable .htb lab domain identify
      # the training corpus.
      - id: metadata/package/documentation/security-testing::ctf-writeup-shell-walkthrough
      - id: micro-behaviors/process/deploy/file-exec::raw-ip-multiarch-fallback-launch
  - id: raw-ip-ftp-multiarch-payload-sweep
    desc: Repeated raw-IP FTP payloads are armed, run and deleted across architectures
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.004,T1222.002,T1070.004
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-literal
      - id: micro-behaviors/communications/ftp/download/busybox::repeated-ftpget-utility-fetch
      - id: micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
      - id: micro-behaviors/process/create/local-exec::execute-dot-slash-literal
      - id: micro-behaviors/fs/delete/file/command::rm-local-named-file
  - id: raw-ip-shell-self-deleting-dropper
    desc: Raw-IP shell dropper deletes its launcher
    crit: hostile
    conf: 0.99
    attack: "T1105,T1059.004,T1070.004"
    platforms: [unix]
    all:
      - id: objectives/execution/payload/file-exec/command/shell::raw-ip-shell-fetch-chmod-detach
      - id: objectives/evasion/self-delete/cleanup/remove::rm-self-dollar-zero

# An agent skill that instructs downloading a password-protected binary and
# also carries a fetch-substitution shell (`$(curl ...)` inside a command
# substitution). The passworded download tells the agent to fetch what
# scanners cannot open; the substitution shell is what runs beside it.
#
# Worked example: the netcode-openclaw trading skills, whose SKILL.md
# directs Windows agents to AuthTool.exe (password: 1234) while embedding a
# base64-masked curl-to-bash line behind an Apple-looking URL echo.
