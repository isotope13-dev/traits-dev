defaults:
  attack: T1105
  mbc: B0024
  platforms: [unix, windows]
  for: [shell]
composite_rules:
  - id: htmlhelp-curl-interpreter-stage
    desc: HTML Help Shortcut pipes remote curl output into a command interpreter
    crit: hostile
    conf: 0.99
    attack: T1105,T1059,T1218.001
    platforms: [windows]
    for: [html]
    all:
      - id: micro-behaviors/communications/http/download/curl::curl-response-piped-to-command-interpreter
      - id: objectives/execution/trigger/document::htmlhelp-shortcut-obfuscated-auto-fire

  - id: htmlhelp-network-share-command-stage
    desc: HTML Help Shortcut executes a command supplied from a network share
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.003,T1218.001
    platforms: [windows]
    for: [html]
    all:
      - id: objectives/execution/payload/file-exec/command/shell::encoded-network-share-pipe-cmd-clues
      - id: objectives/execution/trigger/document::htmlhelp-shortcut-obfuscated-auto-fire
