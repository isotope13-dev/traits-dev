# buffer-envjs inspects a bundled JPEG's APP13 metadata and executes that
# payload as hidden PowerShell as soon as its main module is loaded.
defaults:
  platforms: [windows]
  for: [javascript, package.json]
  attack: T1059.001,T1204.002,T1105
  mbc: F0012

traits:
  - id: node-jpeg-app13-marker
    desc: Checks JPEG APP13 marker
    crit: notable
    conf: 0.999
    for: [javascript]
    if:
      type: text
      regex: '(?i)marker\s*===\s*0xED'

  - id: node-jpeg-app13-runs-payload
    desc: Passes JPEG payload to PowerShell helper
    crit: notable
    conf: 0.999
    for: [javascript]
    if:
      type: text
      regex: '(?i)runPowerShell\s*\(\s*payload\s*\)'

  - id: node-jpeg-spawns-cmd
    desc: Spawns Windows command interpreter
    crit: notable
    conf: 0.999
    for: [javascript]
    if:
      type: text
      regex: '(?is)spawn\s*\(\s*["'']cmd\.exe["'']'

  - id: node-jpeg-encoded-command-flag
    desc: Uses PowerShell encoded-command flag
    crit: notable
    conf: 0.999
    for: [javascript]
    if:
      type: text
      substr: -EncodedCommand

  - id: node-loads-bundled-jpeg-payload-at-import
    desc: Loads bundled JPEG payload during module import
    crit: suspicious
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: 'rnbuffer\s*\(\s*path\.join\s*\(\s*__dirname\s*,\s*["'']stest\.jpg["'']\s*\)\s*\)'

  - id: node-jpeg-app13-marker-slice
    desc: Slices payload after JPEG APP13 marker
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)marker\s*===\s*0xED[\s\S]{0,160}\.slice\s*\('

composite_rules:
  - id: node-jpeg-app13-marker-runs-payload
    desc: Passes marked JPEG payload to helper
    crit: suspicious
    conf: 0.999
    for: [javascript]
    scope: file
    near_bytes: 1000
    all:
      - id: node-jpeg-app13-marker
      - id: node-jpeg-app13-runs-payload

  - id: node-jpeg-powershell-encoded-command
    desc: Runs PowerShell with encoded command
    crit: suspicious
    conf: 0.999
    for: [javascript]
    scope: file
    near_bytes: 500
    all:
      - id: node-jpeg-spawns-cmd
      - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
      - id: node-jpeg-encoded-command-flag

  - id: node-jpeg-app13-payload-to-hidden-powershell
    desc: Sends JPEG APP13 metadata to hidden PowerShell
    crit: suspicious
    conf: 0.999
    for: [javascript]
    scope: file
    near_bytes: 2300
    all:
      - id: node-jpeg-app13-marker-runs-payload
      - id: node-jpeg-powershell-encoded-command

  - id: node-jpeg-app13-slice-hidden-powershell-argv
    desc: Slices JPEG APP13 payload into hidden PowerShell
    crit: suspicious
    conf: 0.999
    near_bytes: 1500
    all:
      - id: node-jpeg-app13-marker-slice
    any:
      - id: micro-behaviors/process/argument/interpreter::argv-array-hidden-encodedcommand
      - id: micro-behaviors/process/argument/interpreter::argv-array-encodedcommand-hidden-window

  - id: npm-node-jpeg-app13-hidden-powershell
    desc: Package import executes a bundled JPEG payload as hidden PowerShell
    crit: hostile
    conf: 0.999
    scope: archive
    for: [npm, zip, tar, javascript]
    all:
      - id: node-loads-bundled-jpeg-payload-at-import
    any:
      - id: node-jpeg-app13-payload-to-hidden-powershell
      - id: node-jpeg-app13-slice-hidden-powershell-argv
