# A hidden staged file is chmodded and run in the background with stderr
# discarded. This can also occur in self-updaters, so it is suspicious rather
# than hostile. A raw IP or an architecture list alone does not prove C2.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1105,T1059.004

traits:
  - id: shell-wget-hidden-variable-exec
    desc: Wget dotfile runs in background without stderr
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((program
          (variable_assignment name: (variable_name) @stage
            value: (string (string_content) @hidden))
          (if_statement
            (list (command name: (command_name (word) @fetch)
              argument: (word) @output_flag
              . argument: (string (simple_expansion (variable_name) @downloaded))
              . argument: (_) @url)))
          (if_statement
            (redirected_statement body: (command name: (command_name (word) @chmod)
              argument: (word) @mode
              . argument: (string (simple_expansion (variable_name) @chmod_target))))
            (redirected_statement
              body: (command name: (command_name (concatenation
                (word) @relative (string (simple_expansion (variable_name) @launched)))))
              redirect: (file_redirect descriptor: (file_descriptor) @stderr
                destination: (word) @null))
            "&") @launch)
          (#match? @hidden "^\\.[A-Za-z0-9_-][A-Za-z0-9._-]*$")
          (#eq? @fetch "wget") (#eq? @output_flag "-O")
          (#eq? @chmod "chmod") (#eq? @mode "+x")
          (#eq? @stage @downloaded) (#eq? @stage @chmod_target)
          (#eq? @stage @launched) (#eq? @relative "./")
          (#eq? @stderr "2") (#eq? @null "/dev/null"))
