defaults:
  crit: hostile
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript, typescript]
composite_rules:
  - id: js-mixed-buffer-encoded-write-exec
    desc: JavaScript mixed-encoding write and shell exec
    conf: 0.95
    all:
      - id: micro-behaviors/data/decode/buffer::mixed-buffer-encodings
      - id: metadata/lang/encoding/hex::hex-encoded-content-references
      - id: micro-behaviors/fs/write/file/full/unspecified::write-file-sync
      - id: micro-behaviors/process/create/shell/command-string::js-exec
    near_lines: 80
  - id: js-hex-base64-write-exec
    desc: JavaScript hex/Base64 decode, write and shell exec
    conf: 0.97
    attack: T1027
    mbc: B0032
    all:
      - id: micro-behaviors/data/decode/hex::buffer-from-hex-to-utf8
      - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64-to-utf8
      - id: micro-behaviors/fs/write/file/full/unspecified::write-file-sync
      - id: micro-behaviors/process/create/shell/command-string::js-exec
    near_lines: 80
