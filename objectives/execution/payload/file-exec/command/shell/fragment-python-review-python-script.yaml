defaults:
  attack: T1105
  mbc: B0024
  platforms:
    - unix
    - windows
  for:
    - python
composite_rules:
  - id: python-encoded-carrier-write-exec-dropper
    desc: Python decodes an embedded carrier, writes it, and launches it
    crit: hostile
    conf: 0.98
    attack: T1027,T1140,T1059.006,T1195.002
    mbc: B0032,E1059.006
    scope: file
    near_lines: 80
    all:
      - id: metadata/file/encoding/shape::large-base64-like-literal
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decoding
      - id: micro-behaviors/fs/file/io-mode::write-append-create-mode
      - id: micro-behaviors/process/create/shell/command-mode::popen-shell-true
