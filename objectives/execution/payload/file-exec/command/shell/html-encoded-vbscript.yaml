defaults:
  platforms: [windows]
  for: [html]
traits:
  - id: vbscript-binary-com-constructor
    desc: Constructs COM object from binary text
    crit: notable
    if:
      type: text
      regex: '(?i)CreateObject\s*\(\s*\w+\s*\(\s*"([01]{8}\s+){8}'
  - id: vbscript-percent-unescape
    desc: Unescapes percent-encoded script text
    crit: notable
    if:
      type: text
      regex: '(?i)UnEscape\s*\(\s*"([^"\r\n]{0,80}%[0-9a-f]{2}){4}'
  - id: vbscript-write-decoded-script
    desc: Writes decoded text and starts it
    crit: notable
    if:
      type: text
      regex: '(?i)\.CreateTextFile\s*\([^\r\n]{0,120}[\s\S]{0,250}\.WriteLine[\s\S]{0,600}\.Run\b'
composite_rules:
  - id: html-binary-com-percent-script-loader
    desc: HTML hides COM and launches decoded script
    crit: hostile
    conf: 0.99
    all:
      - id: vbscript-binary-com-constructor
      - id: vbscript-percent-unescape
      - id: vbscript-write-decoded-script
