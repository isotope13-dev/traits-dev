defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1102,T1059.004,T1105
traits:
  - id: axios-text-to-copy-field-reaches-exec
    desc: Executes a fetched textToCopy field
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)\{\s*textToCopy\s*\}\s*=\s*[A-Za-z_$][\w$]*\.data.{0,500}exec\s*\(\s*textToCopy\b'
composite_rules:
  - id: ethers-contract-axios-command-loader
    desc: Smart contract controls fetched shell commands
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/command-and-control/infrastructure/blockchain/contract::ethers-json-rpc-provider
      - id: objectives/command-and-control/infrastructure/blockchain/contract::ethers-contract-instance
      - id: objectives/command-and-control/infrastructure/blockchain/contract::ethers-contract-zero-arg-read
      - id: micro-behaviors/communications/http/get::axios-get-call
      - id: metadata/import/builtin::require-child-process
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: axios-text-to-copy-field-reaches-exec
