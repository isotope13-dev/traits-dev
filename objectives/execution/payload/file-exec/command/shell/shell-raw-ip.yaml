defaults:
  platforms:
  - unix
  for:
  - shell
  attack: T1105,T1059.004
  crit: hostile
composite_rules:
- id: external-ip-writable-download-exec
  desc: Multi-arch raw-IP launch with cwd fallback
  conf: 0.97
  near_lines: 20
  all:
  - id: micro-behaviors/process/deploy/file-exec::shell-download-chmod-exec
  - id: micro-behaviors/os/sysinfo/platform/arch::multi-arch-target
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  any:
  - id: micro-behaviors/fs/directory/chdir::writable-dir-fallback-exact-chain
  - id: micro-behaviors/fs/directory/chdir::writable-dir-fallback-chain
- id: raw-ip-cleanup-download-exec
  desc: Raw-IP download and launch near local file removal
  conf: 0.97
  near_lines: 10
  all:
  - id: micro-behaviors/fs/delete/file/command::rm-local-named-file
  - id: micro-behaviors/process/deploy/file-exec::shell-download-chmod-exec
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
- id: raw-ip-bulk-multiarch-download-exec
  desc: Multi-arch raw-IP launch and payload cleanup
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/download/shell::wget-http-literal-download-cluster
  - id: objectives/evasion/indicator-removal/cleanup::shell-download-exec-delete
  unless:
  - id: micro-behaviors/process/deploy/file-exec::raw-ip-multiarch-fallback-launch
- id: raw-ip-schemeless-wget-detached-launch
  desc: Schemeless raw-IP wget payload launched detached
  conf: 0.95
  attack: T1105,T1059.004,T1564
  near_lines: 30
  all:
  - id: micro-behaviors/communications/url/host/oob-http::wget-schemeless-external-ip-request
  - id: micro-behaviors/process/deploy/file-exec::shell-download-chmod-exec
  any:
  - id: micro-behaviors/process/daemonize/detach::background-ampersand-hidden
  - id: micro-behaviors/process/daemonize/detach::disown-command
  needs: 1
  unless:
  - id: metadata/build/archive::source-archive-member
  - id: metadata/build/autotools::autoconf-generated-script
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
