defaults:
  platforms:
    - unix
    - windows
  for:
    - shell

traits:
  - id: fetch-tar-nohup-command
    desc: Fetch, tar and nohup command text
    crit: suspicious
    conf: 0.85
    if:
      type: string_literal
      regex: (wget|curl).{1,200}&&\s*tar.{1,50}&&\s*cd.{1,50}&&\s*nohup
  - id: fetch-chmod-nohup-command
    desc: Fetch, chmod and nohup command text
    crit: suspicious
    conf: 0.85
    if:
      type: string_literal
      regex: (wget|curl).{1,200}&&\s*chmod\s+\+x.{1,50}&&\s*nohup

composite_rules:
  - id: multi-client-socket-fallback-detached-exec
    desc: Multi-client and /dev/tcp fallback dropper launches detached stage
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.004
    all:
      - id: micro-behaviors/communications/transfer::multiple-download-clients
      - id: micro-behaviors/communications/socket/tcp::dev-tcp-path
      - id: micro-behaviors/fs/chmod/executable/dangerous::chmod-777
      - id: micro-behaviors/process/create/path-execution::local-execution
      - id: micro-behaviors/process/daemonize/detach::detached-background-command
