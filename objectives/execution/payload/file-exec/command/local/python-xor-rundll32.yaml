defaults:
  for: [python]
  platforms: [windows]

traits:
  - id: encoded-rundll32-xor-file-launch
    desc: XOR file loader contains encoded rundll32
    crit: hostile
    conf: 0.99
    attack: T1027,T1218.011
    if:
      type: yara
      source: |
        rule encoded_rundll32_xor_file_launch {
          strings:
            $command = "\\xae\\xa9\\xb2\\xb8\\xb0\\xb0\\xef\\xee"
            $export = /["'],[ \t]*[A-Za-z_][A-Za-z0-9_]{2,32}[ \t]/
            $read = ".read(1)"
            $xor = " ^ "
            $write = ".write(bytes(["
            $run = "subprocess.run("
          condition:
            all of them
        }

# The YARA trait above matches this build's encoded constant. This composite
# covers copies that change the key or the encoded command: a file-to-file XOR
# decryptor, a command decoded with XOR, and a rundll32 export template.
composite_rules:
  - id: python-xor-file-decrypt-rundll32-export-launch
    desc: Python XOR-decrypts a file and runs it via rundll32 export
    crit: hostile
    conf: 0.96
    attack: T1027,T1140,T1218.011
    scope: file
    all:
      - id: micro-behaviors/process/argument/file::python-rundll32-export-template
      - id: micro-behaviors/data/bitwise/mixed::python-xor-expression
      - id: micro-behaviors/data/decode/xor/reconstruction::python-xor-byte-comprehension-text-decode
      - id: micro-behaviors/fs/file/io-mode::write-append-create-mode
      - id: micro-behaviors/process/create/subprocess/launch::python-subprocess-launch-calls
