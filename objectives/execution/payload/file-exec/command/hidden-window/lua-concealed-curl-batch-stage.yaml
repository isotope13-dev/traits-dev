defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
composite_rules:
  - id: "lua-concealed-curl-batch-stage"
    desc: "Lua curl, batch launch and window hiding clues"
    crit: "hostile"
    conf: 0.97
    all:
      - id: "objectives/execution/payload/file-exec/command/fetch::lua-curl-start-batch-command"
    any:
      - id: "micro-behaviors/ui/window/visibility::lua-hide-window-call"
      - id: "micro-behaviors/ui/window/visibility::lua-showwindow-zero-local-call"
