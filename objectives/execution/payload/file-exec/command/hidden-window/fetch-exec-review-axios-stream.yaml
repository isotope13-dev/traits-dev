defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1105,T1059.007,T1027
  mbc: B0024
  crit: hostile

composite_rules:
- id: hex-url-stream-hidden-command
  desc: Hex URL, streamed download and hidden command
  conf: 0.99
  near_lines: 50
  all:
  - id: metadata/lang/encoding/hex::hex-encoded-http
  - id: micro-behaviors/data/decode/hex::buffer-from-hex-to-utf8
  - id: micro-behaviors/communications/http/get::axios-get-call
  - id: micro-behaviors/communications/http/get::axios-stream-response-download
  - id: micro-behaviors/fs/write/file/stream::create-write-stream
  - id: micro-behaviors/process/create/shell/command-string::js-exec
  - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
