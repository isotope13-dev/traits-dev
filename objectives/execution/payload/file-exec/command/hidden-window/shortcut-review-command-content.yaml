defaults:
  platforms: [windows]
  attack: "T1204.002"
  for: [lnk]

composite_rules:
- id: powershell-lnk-download-execute
  desc: Hidden PowerShell LNK download and launch clues
  crit: hostile
  conf: 0.98
  attack: T1059.001,T1105,T1564.003
  mbc: B0030
  all:
  - id: micro-behaviors/process/config/target::lnk-powershell-target
  - id: micro-behaviors/ui/window/state::lnk-powershell-stealth-window
  - id: micro-behaviors/communications/http/download/webclient::lnk-download-method
  any:
  - id: micro-behaviors/process/create/cmdlet::lnk-start-process-command
  - id: micro-behaviors/fs/path/temporary-artifact::lnk-temp-executable-path
  - id: micro-behaviors/process/argument/file::lnk-args-data-extension
