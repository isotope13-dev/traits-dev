# Node launches PowerShell with an obfuscated windowsHide flag and passes a
# command that downloads to a variable path and runs it (`curl -o $o; & $o`).
defaults:
  platforms: [windows]
  for: [javascript, typescript]
composite_rules:
  - id: hidden-powershell-curl-run-variable
    desc: Hidden PowerShell downloads a file and runs it
    crit: hostile
    conf: 0.97
    attack: T1564.003,T1059.001,T1105
    all:
      - id: micro-behaviors/process/argument/visibility::windowshide-obfuscated-true
      - id: micro-behaviors/process/argument/executable::js-powershell-name-literal
      - id: micro-behaviors/communications/http/download/executable::embedded-curl-output-variable-invoke
