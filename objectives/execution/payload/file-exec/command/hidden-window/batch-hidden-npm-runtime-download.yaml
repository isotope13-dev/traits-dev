defaults:
  platforms:
  - windows
  for:
  - batch
  crit: suspicious

composite_rules:
- id: batch-hidden-npm-runtime-download
  desc: Batch download, hidden PowerShell and runtime clues
  conf: 0.99
  attack: T1059.003,T1105,T1027
  all:
  - id: micro-behaviors/fs/path/script::batch-variable-runtime-script-launch
  - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
  - id: micro-behaviors/os/package-manager/reference-install::npm-install-shell-boundary-text
  any:
  - id: micro-behaviors/communications/http/download/cli/web-cmdlet::iwr-outfile-download
  - id: micro-behaviors/communications/http/curl/command::batch-curl-http-url
  needs: 1
