# WSH opens a .lnk shortcut through cmd with the Run window hidden, from a
# COM scriptlet or after a WMI query of running processes (the loader's
# single-instance guard). The shortcut's own target and arguments run
# invisibly and the script never names them -- the shortcut is the staged
# payload (LNK chain loaders drop a shortcut next to a decoy and fire it this
# way). A plain launcher script opening a shortcut is not enough.
defaults:
  for: [javascript, vbs, xml]
  platforms: [windows]
  attack: T1204.002,T1564.003

composite_rules:
  - id: wsh-hidden-cmd-shortcut-launch
    desc: WSH silently launches a shortcut through cmd
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/process/config/window::wsh-hidden-cmd-run-shortcut
    any:
      - id: micro-behaviors/os/com/registration::windows-scriptlet-or-script-component
      - id: micro-behaviors/os/wmi/query::win32-process-query
