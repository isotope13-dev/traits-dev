defaults:
  for: [powershell]
  platforms: [windows]
  crit: hostile
  conf: 0.96
  attack: T1059.001,T1140

composite_rules:
  - id: powershell-aes-xor-hidden-dropper
    desc: PowerShell AES and XOR decrypts payload for hidden execution
    all:
      - id: micro-behaviors/crypto/decrypt/initialize
      - id: micro-behaviors/data/bitwise/mixed
      - id: micro-behaviors/fs/write
      - id: micro-behaviors/process/config/window
