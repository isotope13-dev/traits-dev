# buffer-envjs inspects a bundled JPEG's APP13 metadata and executes that
# payload as hidden PowerShell as soon as its main module is loaded.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1059.001,T1204.002,T1105
  mbc: F0012

traits:
  - id: node-jpeg-app13-marker-slice
    desc: Slices payload after JPEG APP13 marker
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)marker\s*===\s*0xED[\s\S]{0,160}\.slice\s*\('

  - id: node-loads-bundled-jpeg-payload-at-import
    desc: Processes bundled JPEG during module load
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'rnbuffer\s*\(\s*path\.join\s*\(\s*__dirname\s*,\s*["'']stest\.jpg["'']\s*\)\s*\)'

composite_rules:
  - id: node-jpeg-app13-payload-to-hidden-powershell
    desc: Sends JPEG APP13 metadata to hidden PowerShell
    crit: suspicious
    conf: 0.999
    near_bytes: 1500
    all:
      - id: node-jpeg-app13-marker-slice
    any:
      - id: micro-behaviors/process/argument/interpreter::argv-array-hidden-encodedcommand
      - id: micro-behaviors/process/argument/interpreter::argv-array-encodedcommand-hidden-window

  - id: npm-node-jpeg-app13-hidden-powershell
    desc: Package import executes a bundled JPEG payload as hidden PowerShell
    crit: hostile
    conf: 0.999
    scope: archive
    for: [npm, zip, tar, javascript]
    all:
      - id: node-jpeg-app13-payload-to-hidden-powershell
      - id: node-loads-bundled-jpeg-payload-at-import
