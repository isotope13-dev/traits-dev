defaults:
  platforms: [windows]
  for: [lnk]
  crit: hostile
composite_rules:
  - id: shortcut-com-download-hidden-script
    desc: Shortcut COM staging and hidden PowerShell window clues
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/client/xmlhttp::lnk-arg-msxml-serverhttp
      - id: micro-behaviors/os/com/automation::lnk-arg-adodb-stream
      - id: micro-behaviors/communications/http/client/response-body::lnk-arg-responsebody
      - id: micro-behaviors/data/stream/write::lnk-arg-savetofile
      - id: micro-behaviors/fs/path/temporary-artifact::lnk-temp-script-path-argument
      - id: micro-behaviors/process/argument/file::powershell-script-file-argument
      - id: micro-behaviors/ui/window/state::lnk-hidden-window-flag
      - id: micro-behaviors/fs/delete/file/script::lnk-arg-delete-temp-script
