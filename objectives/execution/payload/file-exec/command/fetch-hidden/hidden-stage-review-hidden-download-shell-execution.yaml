defaults:
  for: [scripts, manifests, html, xml, dockerfile, package-lock.json, groovy]
  platforms: [linux, macos, windows]

composite_rules:
- id: hidden-download-shell-execution
  desc: Downloads and runs a hidden temporary file
  crit: hostile
  conf: 0.97
  platforms:
    - unix
  near_bytes: 0
  all:
    - id: micro-behaviors/communications/http/download/curl::shell-curl-hidden-output
    - id: micro-behaviors/process/deploy/file-exec/command::shell-downloaded-file-invocation
