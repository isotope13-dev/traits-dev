defaults:
  attack: T1105
  mbc: B0024
  platforms: [unix, windows]
  for: [shell]

composite_rules:
  - id: raw-ip-hidden-temp-multiarch-fallback-launch
    desc: Raw-IP multi-architecture fallback loader launches a hidden staged executable
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.004,T1564.001
    platforms: [unix]
    all:
      - id: objectives/evasion/file-hiding/staging::hidden-temp-fallback-fetch-exec
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/os/sysinfo/platform/arch::uname-arch-case-normalization
      - id: micro-behaviors/os/sysinfo/platform/arch::multiple-architecture-references
