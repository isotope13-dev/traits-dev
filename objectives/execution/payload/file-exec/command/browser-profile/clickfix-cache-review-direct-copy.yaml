defaults:
  for: [batch, html, javascript, powershell]
  platforms: [windows]
  attack: T1059.003,T1059.005,T1036

composite_rules:
  - id: firefox-profile-entry-script-launch
    desc: Firefox profile entry copied to a script and launched
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/directory/readdir/command::batch-recursive-for-loop
      - id: micro-behaviors/fs/path/application/browser/profile::firefox-profile-directory
      - id: micro-behaviors/fs/write/file/copy::batch-loop-copy-to-script
    any:
      - id: micro-behaviors/process/interpreter/scripting::localappdata-temp-script-host-path
      - id: micro-behaviors/process/interpreter/scripting::temp-script-host-path
    near_bytes: 512
  - id: firefox-profile-size-selected-script-launch
    desc: Size-selected Firefox profile entry copied to a script and launched
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/payload/file-exec/command/browser-profile::firefox-profile-entry-script-launch
      - id: micro-behaviors/fs/file/attributes::batch-file-size-equality
    near_bytes: 512
