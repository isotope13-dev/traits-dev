defaults:
  for: [batch, html, javascript, powershell]
  platforms: [windows]

composite_rules:
  - id: size-selected-profile-script-loader
    desc: Browser profile size selection with script copying and execution
    crit: hostile
    conf: 0.98
    attack: T1059.003,T1059.005,T1105
    all:
      - id: micro-behaviors/fs/path/application/browser/profile::browser-localappdata-userdata-root
      - id: micro-behaviors/fs/directory/readdir/command::batch-recursive-for-loop
      - id: micro-behaviors/fs/file/attributes::batch-file-size-equality
      - id: micro-behaviors/fs/file/copy/command::batch-for-file-to-temp-script
    any:
      - id: micro-behaviors/process/interpreter/scripting::temp-script-host-path
      - id: micro-behaviors/process/interpreter/scripting::tmp-script-host-command
    near_bytes: 512
