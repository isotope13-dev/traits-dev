defaults:
  platforms: [windows]
  for: [vbs, text]
  attack: T1059.005,T1564.003

traits:
  - id: wsh-assigns-its-script-path
    desc: WSH assigns its running script path
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?im)^\s*\w+\s*=\s*WScript\.ScriptFullName\b'

  - id: wsh-copy-into-public-downloads
    desc: Script copies a file into Public Downloads
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)\\Users\\Public\\Downloads\\["''].{0,140}?\b\w+\.CopyFile\s'

  - id: wsh-wmi-initializes-hidden-startup
    desc: WSH creates a hidden WMI startup instance
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?im)\.SpawnInstance_\s*\r?\n\s*\w+\.ShowWindow\s*=\s*0\b'

  - id: wsh-runs-command-with-zero-window
    desc: WSH Run requests hidden window style
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\s*\w+\.Run\s+\w+\s*,\s*0\s*,\s*True\b'

composite_rules:
  - id: wsh-public-copy-hidden-wmi-relaunch
    desc: WSH stages a copy in Public Downloads and starts a hidden process
    crit: hostile
    conf: 0.98
    all:
      - id: wsh-assigns-its-script-path
      - id: wsh-copy-into-public-downloads
      - id: wsh-wmi-initializes-hidden-startup
      - id: wsh-runs-command-with-zero-window
