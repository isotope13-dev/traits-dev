# A WSH script (JScript/VBScript, including scriptlet bodies) that hides a
# Run window whose command line has PowerShell download a URL to a file, and
# that conceals its own code with split literals, a concatenated ProgID or
# machine-generated identifiers. The script host stages the payload through a
# second interpreter while keeping both the download and the window out of
# sight.
defaults:
  for: [javascript, vbs]
  platforms: [windows]
  attack: T1059.001,T1105,T1564.003,T1027

composite_rules:
  - id: obfuscated-wsh-hidden-powershell-download
    desc: Obfuscated WSH hides PowerShell file download
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/hidden::wscript-shell-hidden-run
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::embedded-powershell-outfile-download
    any:
      - id: micro-behaviors/os/com/instantiation::activex-concatenated-progid
      - id: metadata/lang/source/naming/population::high-entropy-identifier-ratio
      - id: micro-behaviors/data/string/concat/expression::dense-string-fragment-concatenation
