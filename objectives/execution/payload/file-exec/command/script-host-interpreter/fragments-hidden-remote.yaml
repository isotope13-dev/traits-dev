defaults:
  platforms: [windows]
  for: [vbs, html]
  crit: notable
  conf: 0.95

traits:
  - id: wsh-run-variable-argument-hidden
    desc: WSH Run hides a variable command
    for: [vbs, html, javascript]
    crit: component
    if:
      type: text
      regex: '(?i)\.Run[ \t]*\(?[ \t]*\w+[ \t]*,[ \t]*0\b'

  - id: wsh-command-text-http-url
    desc: WSH script contains HTTP URL text
    for: [vbs, html, javascript]
    crit: component
    if:
      type: text
      regex: '(?i)["'' \t]https?://[A-Za-z0-9][\w.-]{2,120}'

  - id: vbs-embedded-replacement-chain
    desc: Repeated Replace call text
    count_min: 4
    if:
      type: text
      regex: '(?i)\bReplace[ \t]*\('

  - id: wsh-getobject-new-clsid-moniker
    desc: WSH creates COM object by CLSID
    for: [vbs, html, javascript]
    if:
      type: text
      regex: '(?i)\bGetObject\s*\(\s*["'']new:\{?[0-9a-f-]{36}'

  - id: wsh-embedded-invoke-expression
    desc: WSH text contains PowerShell Invoke-Expression
    for: [vbs, html, javascript]
    if:
      type: text
      word: Invoke-Expression
      case_insensitive: true

composite_rules:
  - id: vbs-constructed-hidden-http-command
    desc: VBScript builds and hides a remote command with repeated replacements
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/data/string/concat/expression::vbs-four-variable-concatenation
      - id: vbs-embedded-replacement-chain
      - id: wsh-command-text-http-url
      - id: wsh-run-variable-argument-hidden

  - id: wsh-clsid-moniker-hidden-remote-command
    desc: WSH activates COM by CLSID and hides an obfuscated remote command
    crit: hostile
    conf: 0.96
    for: [vbs, html, javascript]
    all:
      - id: wsh-getobject-new-clsid-moniker
      - id: wsh-command-text-http-url
      - id: wsh-run-variable-argument-hidden
    any:
      - id: micro-behaviors/data/string/reverse::strreverse-invocation
      - id: wsh-embedded-invoke-expression
