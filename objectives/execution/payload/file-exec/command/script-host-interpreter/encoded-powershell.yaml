defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: hidden-encoded-powershell-executable-download
    desc: Hidden encoded PowerShell downloads and invokes executable paths
    crit: suspicious
    conf: 0.96
    attack: T1059.001,T1027,T1105
    all:
      - id: metadata/lang/source/syntax/command/launch::powershell-encoded-payload-command-text
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::encoded-iwr-outfile-command
      - id: micro-behaviors/process/interpreter/eval/decoded::encoded-iex-executable-path
