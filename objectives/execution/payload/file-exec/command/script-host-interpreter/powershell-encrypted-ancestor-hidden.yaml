# Admission is the combined concealment: encrypted source staged for a hidden
# child while the launching ancestry's windows are also suppressed.
defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-encrypted-stage-with-ancestor-concealment
    desc: Encrypted staging with concealed child launch
    crit: hostile
    conf: 0.98
    attack: T1027,T1140,T1564.003
    all:
      - id: objectives/anti-static/obfuscation/payload/encrypted::powershell-encrypted-written-child-stage
      - id: micro-behaviors/ui/window/handle-control::powershell-window-parent-process-clues
      - id: micro-behaviors/process/create/hidden::powershell-hidden-argument-launch
