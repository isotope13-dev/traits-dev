defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1204.002

composite_rules:
  - id: lnk-script-host-nonscript-input
    desc: LNK script host runs non-script extension input
    crit: hostile
    conf: 0.96
    attack: T1059.005
    all:
      - id: micro-behaviors/process/config/target::lnk-script-host-target
    any:
      - id: micro-behaviors/process/argument/file::lnk-args-data-extension
      - id: micro-behaviors/fs/path/media::lnk-args-media-extension
      - id: micro-behaviors/fs/path/document::lnk-args-document-extension
