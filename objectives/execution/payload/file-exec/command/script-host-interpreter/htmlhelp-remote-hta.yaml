defaults:
  platforms: [windows]
  for: [html]

traits:
  - id: htmlhelp-item1-remote-mshta-command
    desc: Help shortcut specifies remote HTA launch
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bItem1\b[^>]{0,160}\bmshta(\.exe)?[ \t]+["'']?https?://'

composite_rules:
  - id: htmlhelp-remote-mshta-auto-launch
    desc: HTML Help invokes MSHTA on a remote endpoint
    crit: hostile
    conf: 0.99
    attack: T1218.001,T1218.005,T1105
    all:
      - id: micro-behaviors/os/com/automation::htmlhelp-shortcut-command-param
      - id: htmlhelp-item1-remote-mshta-command
    any:
      - id: micro-behaviors/ui/controls/widget::html-object-click-call
      - id: micro-behaviors/ui/controls/widget::html-obfuscated-click-call
    near_bytes: 1000
