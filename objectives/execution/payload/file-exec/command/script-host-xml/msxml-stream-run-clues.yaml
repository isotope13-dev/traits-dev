# These are co-occurring operations, not proof that decoded/downloaded bytes
# reach the launched process. Dormant MSXML helpers must not imply a payload.
defaults:
  platforms: [windows]
  for: [javascript, vbs]
  crit: notable
composite_rules:
  - id: msxml-adodb-no-wait-run
    desc: MSXML value, stream save and no-wait Run
    conf: 0.99
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/data/property/access::msxml-node-typed-value
      - id: micro-behaviors/os/com/instantiation::activex-constructor-call
      - id: micro-behaviors/data/control-flow/dispatch/run::wsh-run-style-argument-clues
    any:
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file
      - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
