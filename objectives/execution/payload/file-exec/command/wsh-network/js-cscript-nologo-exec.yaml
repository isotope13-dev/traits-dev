# JavaScript executes a script file via Windows Script Host (cscript //nologo)
# using execFile/execFileSync.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1059.005,T1059.007

composite_rules:
  - id: js-cscript-nologo-exec
    desc: JavaScript executes a file via cscript //nologo
    crit: suspicious
    conf: 0.9
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/process/interpreter/wsh::js-cscript-nologo
      - id: metadata/lang/source/naming/interface/execution::execfile-identifier-text
