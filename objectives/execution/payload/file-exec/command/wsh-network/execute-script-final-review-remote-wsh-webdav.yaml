defaults:
  for: [vbs]
  platforms: [windows]
  attack: T1105,T1059.007

composite_rules:
  - id: wsh-webdav-tunnel-clues
    desc: WSH, SSL WebDAV and tunnel clues
    crit: hostile
    conf: 0.99
    all:
    - id: micro-behaviors/communications/http/webdav::webdav-ssl-unc-path
    - id: micro-behaviors/communications/url/host/name::cloudflare-tunnel-host-reference
    any:
    - id: micro-behaviors/process/interpreter/scripting::wsh-windows-interpreter-option
    - id: micro-behaviors/data/control-flow/dispatch/run::wscript-shell-run-statement
    - id: micro-behaviors/os/com/automation::wscript-shell-literal

  # WSH (including .wsf jobs, typed xml) launching a command straight off an
  # SSL WebDAV UNC share: the trycloudflare/WebDAV loader chain that runs a
  # remote .bat/.vbs stage without writing it locally first.
  - id: wsh-shell-run-webdav-unc
    desc: WSH shell runs SSL WebDAV command
    crit: hostile
    conf: 0.97
    for: [vbs, xml]
    attack: T1105,T1059.005
    all:
    - id: micro-behaviors/os/com/automation::wscript-shell-literal
    - id: micro-behaviors/data/control-flow/dispatch/run::wscript-shell-run-statement
    - id: micro-behaviors/communications/http/webdav::webdav-ssl-unc-path
    near_bytes: 400

  # The settings-stub form of the same chain: a Windows Script Host settings
  # file (.wsh) whose [ScriptFile] Path= names a script on an SSL WebDAV
  # share. Opening the stub makes WSH fetch and run that script through the
  # WebDAV redirector -- the delivered stage never touches disk as a
  # download, and the loader is a few dozen bytes of INI. Loader campaigns
  # host the share on ephemeral tunnels precisely so the stub outlives the
  # infrastructure; the tunnel-host form has its own composite under
  # command-and-control/infrastructure/domain/tunnel.
