defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1105,T1059.005,T1059.003
  mbc: B0030


composite_rules:
  - id: wsh-ip-curl-batch-download-execution
    desc: WSH IP curl and batch execution clues
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/com/instantiation::wscript-shell-createobject
      - id: micro-behaviors/data/control-flow/dispatch/run::wscript-shell-run-statement
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/download/cli/curl-wget::fetch-output-flag-script
      - id: micro-behaviors/process/create/subprocess/reference::batch-script-exec-wscript
