defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  crit: hostile
  conf: 0.95
  for: [javascript, xml]

composite_rules:
- id: wsf-copy-hidden-cmd
  desc: WSF file copy and hidden cmd launch
  platforms: [windows]
  for: [xml]
  attack: "T1059.005, T1105"
  all:
  - id: metadata/lang/source/syntax/array::xml-array-symbol
  - id: micro-behaviors/fs/file/copy/call::wsf-fso-variable-copy
  - id: micro-behaviors/process/create/hidden::wsf-hidden-fragmented-cmd-run
- id: js-webdav-copy-hidden-wsh
  for: [javascript]
  desc: JScript WebDAV copy and hidden WSH clues
  platforms: [windows]
  attack: "T1059.007, T1105"
  all:
  - id: micro-behaviors/communications/http/webdav::js-webdav-temp-copy-batch-clues
  - id: micro-behaviors/process/create/hidden::wscript-shell-hidden-run
