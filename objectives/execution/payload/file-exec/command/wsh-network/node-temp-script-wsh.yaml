# Node code fetches a remote file into the temp directory and hands a file
# to cscript/wscript with a forced script engine (`//nologo //e:jscript`).
# Node has no reason to run its own downloads through Windows Script Host.
# The legs are same-file co-occurrence: nothing binds the written file to
# the WSH argument, so flow-broken mutations (user-command trigger, early
# return, other engine, other path) match too. The bound activation chain is
# convicted by supply-chain/.../vscode::vscode-activation-http-jscript-stage.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1105,T1059.007
composite_rules:
  - id: node-download-temp-script-wsh-run
    desc: Node temp download beside WSH engine switch
    crit: notable
    conf: 0.97
    all:
      - id: metadata/lang/runtime::wsh-nologo-engine-switch
      - id: micro-behaviors/os/sysinfo/directories::node-os-tmpdir
      - id: metadata/import/builtin::require-child-process
    any:
      - id: micro-behaviors/communications/http/download/handler::node-https-get-write-stream-pipe
      - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
