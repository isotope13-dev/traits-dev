defaults:
  platforms: [windows]
  for: [oledoc]
  attack: T1204.002
  conf: 0.98

composite_rules:
  - id: ole-package-embedded-executable
    desc: OLE Package embeds executable payload
    crit: hostile
    all:
      - id: metadata/document/ole::ole-package-executable-name
      - id: metadata/document/ole::ole-embedded-pe
