defaults:
  platforms: [windows]
  for: [oledoc]
  attack: T1204.002
  conf: 0.98

traits:
  - id: ole-package-executable-target
    desc: OLE Package targets executable binary
    crit: suspicious
    conf: 0.95
    if:
      type: hex
      pattern: "(50 61 63 6B 61 67 65 | 70 61 63 6B 61 67 65) 00 [1-256] (2E 65 78 65 | 2E 73 63 72 | 2E 62 61 74 | 2E 63 6D 64 | 2E 70 69 66 | 2E 63 6F 6D) 00"

composite_rules:
  - id: ole-package-embedded-executable
    desc: OLE Package embeds executable payload
    crit: hostile
    all:
      - id: ole-package-executable-target
      - id: metadata/document/ole::ole-embedded-pe
