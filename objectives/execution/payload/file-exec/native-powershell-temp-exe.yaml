defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105,T1059.001,T1564.003
composite_rules:
  - id: native-hidden-powershell-temp-exe-launch
    desc: PE embeds concealed same-file payload launch
    crit: hostile
    conf: 0.98
    near_bytes: 512
    all:
      - id: micro-behaviors/process/deploy::powershell-download-launch-same-temp-exe
      - id: objectives/evasion/process/hidden/execution::ps-double-hidden-window
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/process/create/shell/command-mode::cmd-powershell-direct-launch
