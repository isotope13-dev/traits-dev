defaults:
  platforms: [unix]
  for: [shell]
  attack: T1105,T1059.004
composite_rules:
- id: external-ip-writable-download-exec
  desc: Multi-arch raw-IP launch with cwd fallback
  crit: hostile
  conf: 0.97
  near_lines: 20
  all:
  - id: micro-behaviors/process/deploy::shell-download-chmod-exec
  - id: micro-behaviors/fs/directory/chdir::writable-dir-fallback-chain
  - id: micro-behaviors/os/sysinfo/platform/arch::multi-arch-target
  - id: micro-behaviors/communications/ip/literal::http-ip-url
- id: raw-ip-literal-download-chmod-local-exec
  desc: Raw-IP download, chmod and local launch co-occur
  crit: suspicious
  conf: 0.97
  all:
    - id: micro-behaviors/communications/http/download/shell::wget-http-literal-download
    - id: micro-behaviors/process/create/local-exec::chmod-exec-literal-local
  any:
    - id: micro-behaviors/communications/ip/literal::http-ip-url
    - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
    - id: micro-behaviors/communications/ip/literal::external-ipv4-script
  unless:
    - id: metadata/build/archive::source-archive-member
    - id: metadata/build/autotools::autoconf-generated-script
    - id: metadata/package/testing/
    # The Huawei exploit composite describes the same embedded wget/chmod/
    # execute chain together with the vulnerable endpoint and request shape.
    - id: objectives/lateral-movement/exploit/network-device/upnp::huawei-hg532-upnp-exploit
    # The repeated chain reports the same fetch/permission/launch behavior
    # with stronger evidence and should replace this single-stage finding.
    - id: objectives/command-and-control/dropper/delivery/fetch-exec::raw-ip-repeated-download-exec-cleanup
    # The repeated chain supplies stronger evidence and replaces both the
    # individual wget and curl delivery findings.
    - id: objectives/command-and-control/dropper/delivery/fetch-exec::raw-ip-repeated-download-chmod-exec
    - id: "metadata/file/naming::test-directory-component"
- id: raw-ip-bulk-multiarch-download-exec
  desc: Multi-arch raw-IP launch and payload cleanup
  crit: hostile
  conf: 0.98
  all:
    - id: micro-behaviors/communications/http/download/shell::wget-http-literal-download-cluster
    - id: objectives/evasion/indicator-removal/cleanup::shell-download-exec-delete
  unless:
    - id: objectives/command-and-control/botnet/iot::raw-ip-multiarch-protocol-dropper
