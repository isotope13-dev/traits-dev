defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
composite_rules:
  - id: xor-record-http-native-file-launcher
    desc: HTTP task client writes and launches files
    crit: hostile
    conf: 0.97
    attack: T1105
    all:
      - id: objectives/command-and-control/channel/http-beacon::mpress-mac-command-client
      - id: metadata/binary/instruction/sequence::x86-word-gated-buffer-write-close-handoff
      - id: micro-behaviors/process/create/exec::create-process-a
      - id: micro-behaviors/fs/write/file/handle::write-file
