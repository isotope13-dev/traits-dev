# A streamed download bound to a hidden shell launch, staged in APPDATA
# from a Discord attachment executable URL. A vendor updater fetches from
# its own accountable endpoint; an ephemeral Discord attachment EXE staged
# in APPDATA and launched without a window has no update contract.
# The helper GET leg binds the configured attachment URL to its HTTP call.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1105,T1059.003,T1564.003

composite_rules:
  - id: python-discord-appdata-hidden-dropper
    desc: Discord executable GET with APPDATA staging and hidden launch
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/deploy/file-exec::python-streamed-download-hidden-shell
      - id: micro-behaviors/communications/http/download/handler::python-streamed-download-appdata
      - id: micro-behaviors/communications/http/get::python-helper-get-discord-executable-url
