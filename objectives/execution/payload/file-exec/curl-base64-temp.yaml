defaults:
  platforms:
  - windows
  for:
  - batch
composite_rules:
- id: excluded-curl-base64-temp-exe-start
  desc: Runs a curl-decoded TEMP executable alongside broad Defender exclusions
  crit: hostile
  conf: 0.99
  attack: T1105,T1140,T1059.003
  all:
  - id: micro-behaviors/process/deploy::curl-base64-temp-exe-start
  - id: micro-behaviors/os/security/defender::temp-directory-and-process-exclusions
