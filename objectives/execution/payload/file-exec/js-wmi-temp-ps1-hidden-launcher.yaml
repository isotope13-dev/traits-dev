# A WSH script that writes a PowerShell script to the temp folder through
# FileSystemObject, builds the powershell.exe path from pieces, and starts it
# through a WMI Win32_Process method rather than WScript.Shell.Run
# runs hidden code while keeping the parent-child chain away from wscript.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1059.007,T1047,T1059.001
composite_rules:
  - id: js-wmi-process-launch-of-temp-powershell-script
    desc: JS writes temp PowerShell and starts it through WMI
    crit: hostile
    conf: 0.88
    all:
      - id: micro-behaviors/fs/write/content::powershell-extension-near-text-file-creation
      - id: micro-behaviors/os/wmi/query::wmi-execmethod-invocation
      - id: micro-behaviors/os/wmi/query::win32-process-query
      - id: micro-behaviors/os/com/automation::wscript-shell-activex-constructor
    unless:
      - id: metadata/signed/platform/
