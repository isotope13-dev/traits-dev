defaults:
  platforms: [windows]
  for: [go]
  attack: T1105,T1140,T1059.001,T1564.003
  mbc: B0030,C0026

composite_rules:
  - id: go-powershell-certutil-stage
    desc: Concealed Go launcher downloads and decodes PowerShell
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/anti-static/obfuscation/instruction/insertion-junk::go-extreme-inline-whitespace-run
      - id: micro-behaviors/process/deploy::go-powershell-certutil-script-launch
      # The Start-Process that runs the decoded script is itself hidden.
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
