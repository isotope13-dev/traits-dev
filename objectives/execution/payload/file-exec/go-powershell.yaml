defaults:
  platforms: [windows]
  for: [go]
  attack: T1105,T1140,T1059.001,T1564.003
  mbc: B0030,C0026

composite_rules:
  - id: go-powershell-certutil-stage
    desc: Padded PowerShell launch with download-decode-run commands
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/anti-static/obfuscation/instruction/insertion-junk::go-whitespace-padded-powershell-launch
      - id: micro-behaviors/process/create/subprocess::go-powershell-launch-call
      - id: micro-behaviors/process/deploy/file-exec::go-powershell-certutil-script-launch
      # The Start-Process that runs the decoded script is itself hidden.
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden

  # A Go loader that fetches a ZIP over HTTP, references archive/zip beside
  # exec and an -EncodedCommand PowerShell launch line is running a staged
  # payload chain, not an archive updater: encoded-command launchers have no
  # benign archive-update role. The package-reference leg survives degraded
  # Go PE parses where pclntab function symbols are unavailable.
  - id: go-zip-fetch-encoded-powershell-stage
    desc: Go fetches a ZIP archive and launches encoded PowerShell
    crit: hostile
    conf: 0.97
    attack: T1105,T1059.001,T1027
    for: [pe]
    all:
      - id: micro-behaviors/communications/http/download/url::archive-url-reference-binary
      - id: micro-behaviors/data/archive/zip::archive-zip-import
      - id: micro-behaviors/process/create/subprocess::go-native-exec-command-reference
      - id: micro-behaviors/process/interpreter/powershell/command::encoded-command-line
