# A WSH script whose strings are hidden behind an RC4-decoded string array,
# that fetches content through an MSXML HTTP object, and that writes a
# script file under the temp folder through FileSystemObject (including a
# PowerShell path built from parts) is a staged dropper: the obfuscation
# hides what it fetches, and the temp script is how it runs it.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1059.007,T1105,T1027
composite_rules:
  - id: js-rc4-string-array-fetch-and-temp-script-write
    desc: RC4-obfuscated JS fetching and writing a temp script
    crit: hostile
    conf: 0.85
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-implementation
      - id: micro-behaviors/communications/http/client/xmlhttp::msxml-http-variants
      - id: micro-behaviors/fs/write/content::create-script-file
      - id: micro-behaviors/fs/write/content::create-powershell-from-bound-path
    unless:
      - id: metadata/signed/platform/
