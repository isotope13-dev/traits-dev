# An AES-GCM decipher whose plaintext is written to a file and handed to a
# process launcher: the decrypted bytes are the executed payload, not data.
# The sidecar here is a shipped data file (tag prefixed, key and nonce
# hardcoded), so nothing in the package name or manifest explains the
# execution. Decrypt-and-run is a delivery mechanism, not a program.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027,T1059,T1564.001
  mbc: B0030

composite_rules:
  - id: node-gcm-sidecar-decrypt-exec
    desc: AES-GCM decryption with file write and launch
    crit: hostile
    conf: 0.95
    near_lines: 40
    all:
      - id: micro-behaviors/crypto/decrypt::node-aes-gcm-decipher-initialization
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync
    any:
      - id: micro-behaviors/process/create/direct::bun-spawn-call
      - id: micro-behaviors/process/create/exec::js-execfile-call
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
