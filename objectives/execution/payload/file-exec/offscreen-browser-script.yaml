defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1059.003,T1105

composite_rules:
  - id: offscreen-browser-script-staging
    desc: Hidden encoded browser fetch with script-fragment execution
    crit: hostile
    conf: 0.98
    near_lines: 12
    # The browser concealment supplies attack context. These legs establish
    # nearby staging and execution; they do not assert path equality.
    all:
      - id: objectives/evasion/process/hidden/window::offscreen-tiny-browser-inline-html
      - id: micro-behaviors/communications/http/request/client::encoded-javascript-http-fetch
      - id: micro-behaviors/fs/file/concat::cmd-wildcard-script-concatenation
      - id: micro-behaviors/process/create/script/file::batch-script-output-capture
