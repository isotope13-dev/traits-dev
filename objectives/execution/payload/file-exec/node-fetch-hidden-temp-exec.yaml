defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1105,T1059,T1564.001
  mbc: B0030

composite_rules:
  # A remote body written to a dot-named file under /tmp, given the exec bit
  # and launched is a dropper whatever the host serves. Installers that fetch a
  # binary name it for the product and keep it; hiding the name is the tell.
  - id: node-fetch-hidden-temp-exec
    desc: Node fetches a binary into a hidden temp file and runs it
    crit: hostile
    conf: 0.96
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync
      - id: micro-behaviors/fs/path/temp::tmp-hidden-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/exec::js-execfile-call
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
