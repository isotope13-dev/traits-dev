# PowerShell stagers that hand a downloaded script to a child shell. The
# acquisition (WebClient.DownloadFile), the script-extension URL, the cmd
# relay and the abbreviated `-Exec Bypass` flag are each independent atoms;
# together they are the file-exec sink for the staged script.
defaults:
  platforms: [windows]
  for: [powershell, batch]

composite_rules:
- id: ps-downloadfile-cmd-bypass-relaunch
  desc: Downloaded script relaunched by bypassed cmd PowerShell
  # The staged path is the DownloadFile destination and the -File argument in
  # the same short script, so acquisition and activation bind on one file.
  crit: hostile
  conf: 0.98
  attack: T1105,T1059.001,T1204.002
  near_lines: 4
  all:
  - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
  - id: micro-behaviors/communications/http/download/url::executable-url-reference-b
  - id: micro-behaviors/process/create/shell/command-mode::cmd-powershell-direct-launch
  - id: micro-behaviors/process/create/flags::execution-policy-bypass-abbrev-flag
