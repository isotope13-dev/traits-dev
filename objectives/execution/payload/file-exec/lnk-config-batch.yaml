defaults:
  platforms: [windows]
  for: [lnk]
composite_rules:
  - id: lnk-headless-archive-config-batch
    desc: Headless LNK extracts config and runs batch
    crit: hostile
    conf: 0.99
    attack: T1204.002,T1059.003
    all:
      - id: micro-behaviors/data/archive/extract/tar::lnk-tar-temp-extraction
      - id: micro-behaviors/fs/file/copy::lnk-temp-config-to-batch-copy
      - id: micro-behaviors/process/create/shell/command-flag::lnk-temp-batch-command-tail
      - id: micro-behaviors/process/create/shell/command-flag::lnk-conhost-headless-cmd
