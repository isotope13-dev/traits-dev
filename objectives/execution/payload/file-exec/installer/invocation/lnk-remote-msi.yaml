defaults:
  for: [lnk]
  platforms: [windows]
  attack: T1218.007

traits:
  - id: lnk-msiexec-target
    desc: Shortcut targets Windows Installer
    crit: notable
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)(^|[\\/])msiexec\.exe$'
  - id: lnk-http-msi-install-argument
    desc: Shortcut installs an MSI from HTTP
    crit: notable
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)/i\s+["'']?https?://[^\s"'']{1,240}\.msi'
  - id: lnk-msi-quiet-option
    desc: Shortcut requests silent MSI installation
    crit: notable
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)(^|\s)/q(n|uiet)\b'

composite_rules:
  - id: lnk-remote-msi-install
    desc: Shortcut installs a remote MSI
    crit: suspicious
    conf: 0.94
    all:
      - id: lnk-msiexec-target
      - id: lnk-http-msi-install-argument
  - id: lnk-remote-msi-silent-install
    desc: Shortcut silently installs a remote MSI
    crit: suspicious
    conf: 0.97
    all:
      - id: lnk-remote-msi-install
      - id: lnk-msi-quiet-option
