defaults:
  platforms: [unix, windows]
  for: [ruby, python, shell]
  attack: T1554,T1407

traits:
  - id: meterpreter-smali-start-hook
    desc: Code inserts Meterpreter Android start hook
    crit: notable
    if:
      type: text
      substr: 'Lcom/metasploit/stage/Payload;->start(Landroid/content/Context;)V'
  - id: apktool-decompile-command
    desc: APKTool command decompiles an Android package
    crit: notable
    if:
      type: text
      regex: '(?i)\bapktool\s+d\s+[^\n]{1,120}\s+-o\s+'
  - id: apktool-build-command
    desc: APKTool command rebuilds Android package
    crit: component
    if:
      type: text
      regex: '(?i)\bapktool\s+b\s+-o\s+'

composite_rules:
  - id: apk-meterpreter-smali-injector
    desc: Code repackages APK with Meterpreter hook
    crit: suspicious
    conf: 0.99
    all:
      - id: meterpreter-smali-start-hook
      - id: apktool-decompile-command
      - id: apktool-build-command
      - id: well-known/tool/offensive/metasploit::meterpreter-network-payload-reference
