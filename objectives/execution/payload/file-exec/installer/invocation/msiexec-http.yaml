defaults:
  platforms: [windows]
  for: [powershell, batch, scripts]
  attack: T1218.007,T1105

traits:
  # Homoglyph switches borrow lookalike LETTERS (Latin Extended, Greek,
  # Cyrillic). CJK comments and fullwidth punctuation after an ASCII switch
  # (e.g. `/qn；`) are documentation, not a spoofed switch, so only the
  # confusable-letter scripts qualify here.
  - id: msiexec-nonascii-switch
    desc: msiexec switch uses confusable non-ASCII letter
    crit: notable
    conf: 0.93
    if:
      type: text
      encoding: none
      regex: '(?i)\bmsiexec(\.exe)?\b[^\r\n]{0,48}[-/][A-Za-z]*[\xC3-\xC5\xCD-\xCF\xD0-\xD2][\x80-\xBF]'

composite_rules:
  # Relay tampering and a silent remote installer, followed by a hidden,
  # policy-bypassed downloaded script, establish a concealed deployment chain.
  # No campaign hostname, payload basename or product identity is required.
  # Proximity is evidence of a coherent chain, not proof of payload contents.
  - id: redirected-msi-hidden-script-deployment
    desc: Remote MSI deployment with hosts redirection and hidden script staging
    crit: hostile
    conf: 0.98
    for: [batch]
    near_lines: 8
    all:
      - id: objectives/command-and-control/channel/proxy::hosts-loopback-portproxy-redirect
      - id: micro-behaviors/os/package-manager/install::msiexec-remote-url-install
      - id: micro-behaviors/os/package-manager/config::msiexec-quiet-switch
      - id: objectives/evasion/process/hidden/execution::batch-temp-download-hidden-powershell-file
  - id: msiexec-quiet-ipv4-http-install
    desc: Quiet msiexec install from a raw IPv4 URL
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/package-manager/install::msiexec-ipv4-http
      - id: micro-behaviors/os/package-manager/config::msiexec-quiet-switch
  - id: msiexec-homoglyph-ipv4-install
    desc: Homoglyph msiexec IPv4 URL install
    crit: hostile
    conf: 0.98
    all:
      - id: msiexec-nonascii-switch
      - id: micro-behaviors/os/package-manager/install::msiexec-ipv4-http
  - id: msiexec-homoglyph-quiet-install
    desc: Homoglyph msiexec quiet remote install
    crit: hostile
    conf: 0.97
    all:
      - id: msiexec-nonascii-switch
      - id: micro-behaviors/os/package-manager/config::msiexec-quiet-switch
