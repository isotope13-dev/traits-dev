defaults:
  platforms: [windows]
  for: [rtf]
  crit: hostile
  conf: 0.99
  attack: T1203,T1218.007

composite_rules:
  - id: rtf-obfuscated-autoload-remote-msi
    desc: Obfuscated auto-updating OLE carries a remote MSI install command
    all:
      - id: objectives/anti-static/obfuscation/document/rtf::autoupdate-control-interleaved-payload
      - id: micro-behaviors/os/package-manager/install::msiexec-remote-url-install
