defaults:
  crit: hostile
  platforms: [windows]
  for: [batch, powershell, vbs, javascript, python, scripts, lnk]
  attack: T1105,T1218.007


composite_rules:
  - id: remote-msi-rundll32-clues
    for: [batch, javascript, powershell, vbs]
    desc: Remote MSI installer and Rundll32 command clues
    conf: 0.98
    near_lines: 12
    attack: T1105,T1218.007,T1218.011
    all:
      - id: objectives/execution/payload/file-exec/installer/invocation::remote-msi-download-install
      - id: metadata/lang/source/syntax/command/launch::rundll32-command-syntax-reference
  - id: remote-msi-onion-clues
    for: [batch, javascript, powershell, vbs]
    desc: Remote MSI installer and onion endpoint clues
    conf: 0.97
    near_lines: 12
    attack: T1105,T1218.007,T1090.003
    all:
      - id: objectives/execution/payload/file-exec/installer/invocation::remote-msi-download-install
      - id: micro-behaviors/communications/proxy/tor::onion-domain-reference
  - id: shortcut-remote-msiexec
    for: [lnk]
    desc: Shortcut invokes remote MSI installation
    conf: 0.98
    attack: T1105,T1218.007,T1204.002
    all:
      - id: micro-behaviors/os/package-manager/reference-install::lnk-remote-msiexec-url
      - id: micro-behaviors/process/config/launch::lnk-has-arguments

  # The rundll32 and onion siblings above pin specific follow-ons. Scripts
  # that fetch a remote MSI and install it silently with elevation need no
  # follow-on: quiet plus hidden plus runas on a download-and-invoke chain
  # is the concealment. No proximity bound: camouflage padding can separate
  # the download line from the install line by hundreds of thousands of lines.
  - id: remote-msi-quiet-elevated-or-hidden
    for: [batch, javascript, powershell, vbs]
    desc: Remote MSI with quiet and elevated or hidden execution clues
    conf: 0.97
    all:
      - id: objectives/execution/payload/file-exec/installer/invocation::remote-msi-download-install
      - id: micro-behaviors/os/package-manager/config::msiexec-quiet-switch
    any:
      - id: micro-behaviors/os/privilege/elevation::shellexecute-quoted-runas-verb
      - id: micro-behaviors/os/privilege/elevation::wsh-shellexecute-runas
      - id: micro-behaviors/process/argument/visibility::shellexecute-hidden-showcmd
    needs: 1
