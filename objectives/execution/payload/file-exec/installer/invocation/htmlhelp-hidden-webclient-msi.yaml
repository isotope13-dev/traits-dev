defaults:
  platforms: [windows]
  for: [html]

traits:
  - id: powershell-renames-download-for-msi
    desc: PowerShell renames a file for MSI install
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\.msi\b[^\r\n]{1,90}\bRename-Item\b'

composite_rules:
  - id: htmlhelp-hidden-remote-msi-install
    desc: HTML Help starts hidden PowerShell to download and quietly install an MSI
    crit: hostile
    conf: 0.99
    attack: T1218.001,T1218.007,T1105
    all:
      - id: micro-behaviors/os/com/automation::htmlhelp-shortcut-command-param
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
      - id: micro-behaviors/os/package-manager/config::msiexec-quiet-switch
      - id: micro-behaviors/communications/http/client/webclient::webclient-download-file
      - id: powershell-renames-download-for-msi
    any:
      - id: micro-behaviors/ui/controls/widget::html-object-click-call
      - id: micro-behaviors/ui/controls/widget::html-obfuscated-click-call
    near_bytes: 2600
