# A hidden Start-Process window on a quiet MSI install is ordinary managed
# deployment (see the notable decimal-msi fixtures), so it cannot carry a
# hostile verdict alone. The second-stage pattern pairs that silent remote
# install with registering a LocalSystem service in the same script: the
# downloaded package is immediately turned into system-level persistence
# outside any installer UI or approval flow.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1105

composite_rules:
  - id: remote-msi-hidden-install-registers-service
    desc: Hidden remote MSI install registers a LocalSystem service
    crit: hostile
    conf: 0.96
    attack: T1105,T1218.007,T1543.003
    all:
      - id: objectives/execution/payload/file-exec/installer/invocation::remote-msi-download-install
      - id: micro-behaviors/os/package-manager/config::msiexec-quiet-switch
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/os/service/create::sc-local-system-auto-start
