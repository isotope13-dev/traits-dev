defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1195.002,T1059


composite_rules:
  - id: remote-json-forced-global-shell-update
    desc: Remote JSON reaches forced global install with hardcoded consent
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/execution/payload/script-eval/network/child::remote-response-reaches-shell-command
      - id: micro-behaviors/os/security/command-policy::constant-yes-install-branch
      - id: micro-behaviors/os/package-manager/runtime-install::npm-force-install
      - id: micro-behaviors/communications/url/resource-path/file::remote-tgz-url
