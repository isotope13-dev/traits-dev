defaults:
  platforms: [windows]
  for: [pe]
  size_max: 524288
composite_rules:
- id: 7zip-uninstaller-overlay-wrapper
  desc: 7-Zip uninstaller overlay wrapper
  crit: suspicious
  conf: 0.97
  all:
  - id: well-known/tool/sysadmin/7zip/installer::7zip-uninstaller-profile
  - id: well-known/tool/sysadmin/7zip/installer::7zip-sfx-runtime
  - id: metadata/binary/layout/ratio::overlay-over-90pct
  any:
  - id: micro-behaviors/os/sysinfo/directories::temp-path-api-name
  - id: micro-behaviors/fs/file/copy/call::copyfile-w
  - id: metadata/binary/symbols/name/process::create-process-w
  - id: metadata/build/manifest::require-administrator
  needs: 2
- id: 7zip-uninstaller-embedded-decoy
  desc: Packed wrapper with embedded 7-Zip uninstaller decoy
  crit: suspicious
  conf: 0.98
  all:
  - id: well-known/tool/sysadmin/7zip/utility::sevenzip-product-label-reference
  - id: metadata/binary/layout/embedded::pe-embedded
  any:
  - id: well-known/tool/sysadmin/7zip/utility::sevenzip-dll-text-reference
  - id: metadata/build/protector::aspack-name-reference
  - id: micro-behaviors/dylib/lookup::sparse-pe-dynamic-linking
  - id: metadata/binary/section/ratio::overlay-over-20pct-pe
  needs: 2
  downgrade:
    any:
    - id: metadata/installer/product/
- id: 7zip-uninstaller-download-loader
  desc: 7-Zip decoy downloads staged loader
  crit: hostile
  conf: 0.98
  all:
  - id: 7zip-uninstaller-embedded-decoy
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
  - id: objectives/evasion/masquerade/identity/mimicry::non-microsoft-windowsupdate-path
  any:
  - id: micro-behaviors/dylib/lookup::sparse-pe-dynamic-linking
  - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
  - id: metadata/build/protector::aspack-name-reference
  - id: metadata/build/manifest::require-administrator
  needs: 2
  downgrade:
    any:
    - id: metadata/installer/product/
- id: 7zip-uninstaller-embedded-dropper
  desc: Packed 7-Zip uninstaller decoy dropper
  crit: hostile
  conf: 0.99
  all:
  - id: well-known/tool/sysadmin/7zip/utility::sevenzip-product-label-reference
  - id: metadata/binary/layout/embedded::pe-embedded
  - id: metadata/binary/symbols/name/process::create-process-w
  any:
  - id: well-known/tool/sysadmin/7zip/utility::sevenzip-dll-text-reference
  - id: metadata/build/protector::aspack-name-reference
  - id: micro-behaviors/dylib/lookup::sparse-pe-dynamic-linking
  downgrade:
    any:
    - id: metadata/installer/product/
- id: 7zip-uninstaller-embedded-c2-loader
  desc: Packed 7-Zip decoy with C2 endpoint
  crit: hostile
  conf: 0.99
  all:
  - id: well-known/tool/sysadmin/7zip/utility::sevenzip-product-label-reference
  - id: metadata/binary/layout/embedded::pe-embedded
  - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-data-literal
  any:
  - id: metadata/build/protector::aspack-name-reference
  - id: micro-behaviors/dylib/lookup::sparse-pe-dynamic-linking
  - id: metadata/binary/section/ratio::overlay-over-20pct-pe
  needs: 2
  downgrade:
    any:
    - id: metadata/installer/product/
- id: 7zip-uninstaller-java-stage-dropper
  desc: 7-Zip uninstaller with Java stage
  crit: hostile
  conf: 0.995
  all:
  - id: objectives/execution/payload/file-exec/installer/invocation::7zip-uninstaller-overlay-wrapper
  - id: metadata/build/manifest::require-administrator
  - id: metadata/vendor/string::java-platform-string
  any:
  - id: micro-behaviors/data/runtime/keywords
  # Preserve the exact relocated members of the former keyword selector.
  - id: metadata/lang/source/syntax/command/pipeline::pipe-to-bash
  - id: metadata/lang/source/syntax/command/pipeline::pipe-to-sh
  - id: metadata/lang/source/syntax/command/pipeline::pipe-to-zsh
  - id: metadata/lang/source/syntax/command/pipeline::pipe-to-python
  - id: metadata/lang/source/syntax/command/pipeline::pipe-to-node
  - id: metadata/lang/source/syntax/command/pipeline::pipe-to-perl
  - id: metadata/lang/source/syntax/command/pipeline::pipe-to-ruby
  - id: metadata/lang/source/syntax/command/pipeline::pipe-to-powershell
  - id: metadata/lang/source/syntax/command/pipeline::pipe-to-cmd
  - id: metadata/lang/source/syntax/command/pipeline::pipe-to-shell
  - id: metadata/lang/source/syntax/command/pipeline::pipe-to-script-runtime
  - id: metadata/lang/source/syntax/command/pipeline::pipe-to-windows-shell
  - id: metadata/lang/source/syntax/command/pipeline::pipe-to-interpreter
  - id: micro-behaviors/data/compress::gzip-sync
  - id: micro-behaviors/dylib/lookup::get-proc-address
  - id: micro-behaviors/os/registry/read::registry-query-value-api
  needs: 2
  downgrade:
    any:
    - id: metadata/installer/product/
- id: mozilla-webapprt-7zip-overlay-dropper
  desc: Mozilla WebAppRT 7-Zip overlay dropper
  crit: hostile
  conf: 0.995
  size_min: 1000000
  size_max: 1300000
  all:
  - id: micro-behaviors/fs/path/application/executable::webapprt-filename-reference
  - id: metadata/signature/claim/signer::mozilla-corporation
  - id: well-known/tool/sysadmin/7zip/installer::7zip-uninstaller-overlay-profile
  - id: metadata/binary/layout/embedded::pe-embedded
  - id: metadata/binary/symbols/name/process::create-process-w
  any:
  - id: micro-behaviors/os/sysinfo/directories::temp-path-api-name
  - id: metadata/build/manifest::ole-admin-manifest-literal
  - id: micro-behaviors/os/registry/open::reg-open-key-ex-w-symbol
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-imports
  needs: 2
- id: 7zip-uninstaller-writable-entry-wrapper
  desc: 7-Zip uninstaller wrapped by a self-unpacking stub
  crit: hostile
  conf: 0.95
  attack: T1027.002,T1036
  all:
  - id: 7zip-uninstaller-embedded-decoy
  - id: metadata/binary/section/header::pe-entry-in-writable-section
