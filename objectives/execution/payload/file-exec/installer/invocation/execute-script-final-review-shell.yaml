defaults:
  attack: T1105
  mbc: B0024
  platforms:
    - unix
    - windows
  for:
    - shell

composite_rules:
  - id: android-ip-netcat-apk-install
    desc: Android IP, netcat and APK install clues
    crit: hostile
    conf: 0.99
    attack: "T1105, T1059.004"
    platforms: [unix, android]
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-literal
      - id: micro-behaviors/communications/socket/netcat::wrapped-nc
      - id: micro-behaviors/fs/write/file/redirect::shell-output-redirect-to-data
      - id: micro-behaviors/os/package-manager/sideload::android-shell-package-install
