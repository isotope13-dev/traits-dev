---
defaults:
  platforms:
  - windows
  for:
  - oledoc
composite_rules:
- id: elevated-flash-branded-installer
  desc: Flash-branded MSI requires embedded executable elevation
  crit: suspicious
  conf: 0.98
  scope: outer
  platforms:
  - windows
  - macos
  - android
  for:
  - oledoc
  - pe
  - zip
  - xpi
  - macho
  - apk
  all:
  - id: micro-behaviors/os/privilege/request::msi-bytes-enforced-runasadmin
  - id: metadata/package/files/msi/identity::msi-office-flashplayer-subject
  - id: metadata/package/files/msi/identity::msi-office-flashplayer-application
  unless:
  - id: metadata/signature/verified/platform/
  - id: metadata/installer/product::known-installer-context
