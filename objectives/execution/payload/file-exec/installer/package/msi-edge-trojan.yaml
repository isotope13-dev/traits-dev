# MSI trojan that uses msedge_proxy.exe as application front
# while embedding persistence/management libraries
defaults:
  platforms: [windows]
  for: [oledoc]
  conf: 0.92
traits:
  - id: msi-edge-install-path
    desc: MSI installs to Edge Application path
    crit: notable
    if:
      type: text
      substr: \Microsoft\Edge\Application\msedge_proxy.exe
composite_rules:
  - id: msi-edge-proxy-trojan
    desc: MSI trojan fronted by Edge proxy app
    crit: hostile
    conf: 0.96
    attack: T1036.005
    all:
      - id: objectives/execution/lolbin/os::msi-edge-proxy-app
      - id: metadata/file/profile/installer/msi/properties::msi-task-wmi-library-text-profile
    any:
      - id: micro-behaviors/fs/file/create::create-shortcut
      - id: metadata/file/profile/installer/msi/properties::msi-modify-repair-property-profile
  - id: msi-lolbin-persistence-combo
    desc: MSI with LOLBin launch and scheduler
    crit: suspicious
    conf: 0.93
    all:
      - id: objectives/execution/lolbin/os::msi-edge-proxy-app
    any:
      - id: metadata/file/profile/installer/msi/libraries::taskscheduler-dll-text
      - id: metadata/file/profile/installer/msi/libraries::wmi-dll-text
