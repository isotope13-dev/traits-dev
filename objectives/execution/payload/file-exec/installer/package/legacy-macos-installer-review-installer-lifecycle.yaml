---
defaults:
  platforms:
  - macos
composite_rules:
- id: macos-elevated-package-install-references
  for:
  - macho
  desc: macOS package references with administrator shell request
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/os/package-manager/config::macos-root-package-install-references
  - id: micro-behaviors/os/privilege/elevation::applescript-shell-admin-request-embedded
  any:
  - id: micro-behaviors/process/daemonize/devnull::background-shell-launch
  - id: micro-behaviors/os/handler/open::usr-bin-open-command
