defaults:
  platforms: [windows]
  for: [oledoc, msi]
  attack: T1105
traits:
  - id: msi-image-bytes-code-stage
    desc: MSI script extracts code from image bytes
    crit: component
    conf: 0.95
    for: [msi]
    if:
      type: raw
      regex: '(?s)\$imageBytes\s*=.{0,120}ReadAllBytes\(.{0,500}\$codeBytes\s*='
  - id: msi-image-code-invoke
    desc: MSI script executes decoded code bytes
    crit: component
    conf: 0.95
    for: [msi]
    if:
      type: raw
      regex: '(?s)GetString\(\$codeBytes\).{0,120}Invoke-Expression\s+\$code'
  - id: chrome-updater-msi-identity
    desc: MSI claims Chrome updater identity
    crit: notable
    conf: 0.98
    if:
      type: value
      path: office.subject
      exact: ChromeUpdate
  - id: msi-byte-list-generic
    desc: MSI references a generic byte list
    crit: component
    conf: 0.95
    for: [msi]
    if:
      type: text
      substr: Generic.List[byte]
  - id: msi-byte-list-decoder-call
    desc: MSI decodes a byte list to text
    crit: component
    conf: 0.95
    for: [msi]
    if:
      type: raw
      regex: 'GetString\(\$\w+\.ToArray\('
  - id: msi-powershell-runspace-create
    desc: MSI creates a PowerShell runspace
    crit: component
    conf: 0.95
    for: [msi]
    if:
      type: text
      substr: powershell]::Create()
  - id: msi-powershell-add-script
    desc: MSI adds a script to PowerShell
    crit: component
    conf: 0.95
    for: [msi]
    if:
      type: raw
      regex: 'AddScript\(\$\w+\)'
  - id: msi-powershell-runspace-invoke
    desc: MSI invokes a PowerShell runspace
    crit: component
    conf: 0.95
    for: [msi]
    if:
      type: text
      substr: .Invoke()
  - id: msi-defender-exclusion-powershell
    desc: MSI PowerShell adds Defender exclusion
    crit: suspicious
    conf: 0.96
    attack: T1562.001
    if:
      type: text
      regex: (?i)Add-MpPrefer`?ence.{0,80}-Exclusion(Path|Process)
  - id: msi-webclient-payload-download
    desc: MSI PowerShell downloads staged payload
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: (?i)Net\.WebClient.{0,80}\.Download(File|Data)\(
  - id: msi-disguised-stage-url
    desc: MSI downloads disguised payload URL
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: (?i)https://[A-Za-z0-9.-]{4,80}/[^"']{1,80}\.(png|jar)
  - id: msi-conhost-hidden-powershell
    desc: MSI schedules headless PowerShell
    crit: suspicious
    conf: 0.96
    attack: T1053.005
    if:
      type: text
      regex: (?i)conhost\.exe.{0,40}--headless.{0,40}powershell\.exe
  - id: msi-scheduledtask-logon
    desc: MSI registers logon scheduled task
    crit: suspicious
    conf: 0.95
    attack: T1053.005
    if:
      type: text
      regex: (?i)New-ScheduledTaskTrigger\s+-AtLogOn
  - id: msi-aes-reflective-loader
    desc: MSI embeds PBKDF AES loader
    crit: suspicious
    conf: 0.97
    attack: T1620
    if:
      type: text
      substr: Rfc2898DeriveBytes
# Qualified type reference only: bare GZipStream matches .NET metadata tokens in
# shipped third-party libraries (e.g. gRPC transport compression), not stager code.
  - id: msi-gzip-decompress-stage
    desc: MSI contains GZip stage decompressor
    crit: suspicious
    conf: 0.94
    attack: T1027
    if:
      type: text
      regex: (?i)(System\.)?IO\.Compression\.GZipStream
  - id: msi-reflective-assembly-load
    desc: MSI embeds reflective assembly load
    crit: suspicious
    conf: 0.97
    attack: T1620
    if:
      type: text
      regex: (?i)Reflection\.Assembly.{0,24}::Load\(
  - id: msi-reflective-entrypoint-invoke
    desc: MSI invokes reflected assembly entrypoint
    crit: suspicious
    conf: 0.96
    attack: T1620
    if:
      type: text
      regex: (?i)(EntryPoint|GetMethod).{0,80}\.Invoke\(
  - id: msi-powershell-exe-raw
    desc: MSI embeds PowerShell executable text
    crit: component
    conf: 0.9
    attack: T1059.001
    if:
      type: text
      regex: (?i)powershell(\.exe)?
  - id: msi-hidden-window-raw
    desc: MSI embeds hidden window flag
    crit: notable
    conf: 0.9
    attack: T1059.001
    if:
      type: text
      regex: (?i)(WindowStyle\s+Hidden|-w\s+h|-w\s+hidden)
  - id: msi-encoded-command-raw
    desc: MSI embeds encoded command flag
    crit: notable
    conf: 0.9
    attack: T1059.001
    if:
      type: raw
      regex: (?i)([-/](EncodedCommand|enc)\b|(powershell|pwsh)(\.exe)?.{0,80}[-/]e\b)
  - id: msi-systeminfo-json-beacon
    desc: MSI beacons antivirus metadata
    crit: suspicious
    conf: 0.94
    attack: T1082
    if:
      type: text
      regex: (?i)AntiVirusProduct.{0,240}ConvertTo-Json
  - id: msi-generated-ca-dll
    desc: MSI embeds generated custom-action DLL
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: msi_ca_[0-9]{8,12}\.dll
  - id: msi-userprofile-desktop-stage
    desc: MSI payload references user desktop
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: USERPROFILE.{0,32}\\Desktop\\
  - id: msi-sideload-target-cryptbase-raw
    desc: MSI references cryptbase.dll sideload target
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: cryptbase.dll
  - id: msi-sideload-target-version-raw
    desc: MSI references version.dll sideload target
    crit: component
    conf: 0.9
    if:
      type: text
      substr: version.dll
  - id: msi-exe2msi-winrar-sfx-profile
    desc: MSI exe2msi WinRAR SFX profile
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule msi_exe2msi_winrar_sfx_profile {
          strings:
            $title = "exe2msiSetupPackage" ascii wide
            $author = "QwertyLab" ascii wide
            $sfx = "WinRAR SFX module" ascii wide
            $path = "Path=C:\\Program Files (x86)" ascii wide
            $setup = "Setup=" ascii wide
            $silent = "Silent=1" ascii wide
            $overwrite = "Overwrite=1" ascii wide
          condition:
            uint32(0) == 0xe011cfd0 and
            $title and $author and $sfx and $path and
            #setup >= 2 and $silent and $overwrite
        }
  - id: msi-sfx-sideload-targets-yara
    desc: MSI SFX sideload target pair
    crit: notable
    conf: 0.92
    if:
      type: yara
      source: |
        rule msi_sfx_sideload_targets {
          strings:
            $version = "version.dll" ascii wide
            $cryptbase = "cryptbase.dll" ascii wide
          condition:
            uint32(0) == 0xe011cfd0 and $version and $cryptbase
        }
  - id: msi-run-key-background-cmd-launch
    desc: MSI Run key launches a background command
    crit: suspicious
    conf: 0.97
    attack: T1547.001,T1059.003
    if:
      type: text
      regex: '(?i)CurrentVersion\\Run.{0,200}cmd.{0,20}start.{0,10}/b.{0,120}INSTALLFOLDER.{0,100}exe'
  - id: msi-csrss-msmpeng-camouflage-set
    desc: MSI uses faux CSRSS and Defender names
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)csrss\.log.{0,220}csrss_sys\.mda.{0,220}csrss_win\.dkd.{0,500}msmpeng_svc\.exe'
composite_rules:
  # Single-encoded MSI custom actions read a Binary-table stream, write it to
  # a temp .ps1 through ADODB.Stream, and launch that file with hidden-window
  # PowerShell. Nibble- or Chr-encoded variants hide these legs below a decode
  # layer; those remain covered by the obfuscation composites.
  - id: msi-vbs-temp-powershell-stage-launch
    desc: MSI script stages and launches a hidden PS1
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1105,T1564.003
    for: [vbs]
    all:
      - id: metadata/lang/source/syntax/member::vbs-session-database-or-property-text-reference
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file
      - id: micro-behaviors/fs/path/temp::windows-temp-path
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
      - id: micro-behaviors/data/control-flow/dispatch/run::script-run-method-text
  - id: msi-image-code-persistent-loader
    desc: MSI persists image-disguised PowerShell code loader
    crit: hostile
    conf: 0.99
    for: [msi]
    attack: T1027,T1053.005,T1562.001
    all:
      - id: metadata/package/files/msi/identity::msi-installation-database-title
      - id: msi-image-bytes-code-stage
      - id: msi-image-code-invoke
      - id: msi-defender-exclusion-powershell
      - id: msi-scheduledtask-logon
      - id: msi-hidden-encoded-powershell
  - id: msi-inprocess-powershell-byte-decoder
    desc: MSI reconstructs and invokes a PowerShell script
    crit: suspicious
    conf: 0.98
    attack: T1027,T1059.001
    for: [msi]
    near_bytes: 3200
    all:
      - id: msi-byte-list-generic
      - id: msi-byte-list-decoder-call
      - id: msi-powershell-runspace-create
      - id: msi-powershell-add-script
      - id: msi-powershell-runspace-invoke
  - id: msi-obfuscated-inprocess-powershell-loader
    desc: MSI runs a reconstructed obfuscated PowerShell stage in process
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1218.007
    for: [msi]
    all:
      - id: msi-inprocess-powershell-byte-decoder
      - id: metadata/package/files/msi/identity::msi-installation-database-title
# Downgraded to suspicious: two of the four legs are universal MSI structure.
# Every MSI has an installation-database title and an OLE security flag, and
# the File table's `short|long` alias is how MSI has always stored names -- WiX
# generates one per file with a random 8.3 stem. What is left is "an MSI that
# mentions powershell.exe", which is also every Tauri/WiX bundle: the Pake
# builds ship `InvokeBootstrapper` + `powershell.exe -NoProfile` as their
# standard bootstrapper custom action.
  - id: msi-powershell-table-implant
    desc: MSI table combines PowerShell and renamed file targets
    crit: suspicious
    conf: 0.97
    attack: T1059.001,T1218.007,T1036.007
    for: [msi]
    all:
      - id: metadata/package/files/msi/identity::msi-installation-database-title
      - id: metadata/package/files/msi-content::msi-file-table-source-target-alias
      - id: metadata/package/files/msi-script::msi-powershell-executable-raw
      - id: metadata/package/files/msi/configuration::ole-security-flag
    unless:
      - id: well-known/tool/packaging/wix::wix-authored-msi
  - id: msi-hidden-batch-archive-dropper
    desc: MSI hides a batch launcher for an archived payload
    crit: hostile
    conf: 0.99
    attack: "T1059.003,T1059.005,T1564.003"
    for: [oledoc]
    all:
      - id: micro-behaviors/process/create/exec::msi-wscript-shell-run-call
      - id: micro-behaviors/process/argument/file::msi-hidden-programdata-batch-arguments
      - id: metadata/package/files/msi-content::msi-rar-unrar-file-pair
      - id: metadata/package/files/msi-content::msi-multiple-batch-files
  - id: chrome-updater-ntuser-cabinet-dropper
    desc: Chrome updater MSI carries ntuser payload
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1027.009
    mbc: B0030
    all:
      - id: chrome-updater-msi-identity
      - id: metadata/package/files/msi-content::msi-ntuser-member-raw
      - id: metadata/package/files/msi-cabinet::embedded-disk1-cab-raw
  - id: msi-randomized-userland-payload-stage
    desc: MSI stages randomized userland payloads
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/app-data/platform::msi-localappdata-install-root
      - id: metadata/package/files/msi-content::msi-file-table-source-target-alias
      - id: objectives/execution/payload/file-exec/installer/script-package::randomized-vbs-install-names
      - id: metadata/package/files/msi/strings::msi-localappdata-directory-name-pair
  - id: chromeseqx-inno-dropper-chain
    desc: ChromeSeqx helper launches staged Inno payload
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/files/msi/identity::msi-installation-database-title
      - id: metadata/package/files/msi/embedded::dual-embedded-pe-streams
      - id: metadata/package/files/msi-cabinet::embedded-disk1-cab-raw
      - id: micro-behaviors/process/config/installer::advanced-installer-elevated-embedded-exe-launch
      - id: metadata/package/files/msi-content::chromeseqx-oooo-pair
    any:
      - id: well-known/lib/platform/advanced-installer::ai-custom-action-dll-raw
      - id: well-known/lib/platform/advanced-installer::packaging-tool-banner-raw
  - id: advanced-installer-powershell-loader
    desc: Advanced Installer PowerShell payload loader
    crit: hostile
    conf: 0.99
    for: [oledoc]
    all:
      - id: well-known/lib/platform/advanced-installer::powershell-script-launcher-dll-text
      - id: well-known/lib/platform/advanced-installer::ai-custom-action-dll-raw
      - id: msi-webclient-payload-download
      - id: msi-aes-reflective-loader
      - id: msi-reflective-assembly-load
    any:
      - id: msi-conhost-hidden-powershell
      - id: msi-scheduledtask-logon
  - id: msi-defender-bypass-persistent-loader
    desc: MSI disables Defender and persists loader
    crit: hostile
    conf: 0.99
    for: [oledoc]
    all:
      - id: well-known/lib/platform/advanced-installer::powershell-script-launcher-dll-text
      - id: msi-webclient-payload-download
      - id: msi-aes-reflective-loader
      - id: msi-reflective-assembly-load
      - id: msi-defender-exclusion-powershell
      - id: msi-scheduledtask-logon
# Custom-action script reads a Binary-table stream, copies it through
# VirtualAlloc/VirtualProtect, and invokes the loaded assembly entry point.
# The script is the powershell member; the MSI type itself does not carry
# these legs.
  - id: msi-stream-reflective-entrypoint
    desc: MSI stream script runs reflective payload
    crit: hostile
    conf: 0.98
    for: [powershell]
    attack: T1620,T1059.001
    all:
      - id: micro-behaviors/os/com/installer::powershell-msi-record-read-stream
      - id: micro-behaviors/process/inject/runtime/call::powershell-native-memory-entry-thread
      - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load-call
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/invocation::powershell-entrypoint-then-invoke
  - id: msi-reflective-assembly-loader
    desc: MSI embeds reflective assembly loader
    crit: hostile
    conf: 0.99
    attack: T1620
    all:
      - id: metadata/package/files/msi/identity::msi-installation-database-title
      - id: metadata/package/files/msi-script::msi-powershell-executable-raw
      - id: msi-reflective-assembly-load
      - id: msi-reflective-entrypoint-invoke
  - id: msi-encrypted-reflective-stage-loader
    desc: MSI encrypted reflective stage loader
    crit: hostile
    conf: 0.99
    attack: T1620
    all:
      - id: metadata/package/files/msi/identity::msi-installation-database-title
      - id: msi-aes-reflective-loader
      - id: msi-gzip-decompress-stage
      - id: msi-reflective-assembly-load
      - id: msi-reflective-entrypoint-invoke
    any:
      - id: msi-hidden-encoded-powershell
      - id: well-known/lib/platform/advanced-installer::powershell-script-launcher-dll-text
  - id: msi-hidden-encoded-powershell
    desc: MSI embeds hidden encoded PowerShell
    crit: suspicious
    conf: 0.95
    attack: T1059.001
    all:
      - id: msi-powershell-exe-raw
      - id: msi-hidden-window-raw
      - id: msi-encoded-command-raw
  - id: msi-defender-wsh-amsi-bypass
    desc: MSI disables Defender and WSH AMSI
    crit: hostile
    conf: 0.99
    attack: T1562.001
    for: [oledoc]
    all:
      - id: well-known/lib/platform/advanced-installer::powershell-script-launcher-dll-text
      - id: msi-defender-exclusion-powershell
      - id: objectives/evasion/anti-av/amsi::windows-script-amsi-disable-registry
  - id: msi-custom-action-hollowing-dropper
    desc: MSI custom-action process hollowing dropper
    crit: hostile
    conf: 0.99
    attack: T1055.012
    all:
      - id: well-known/lib/runtime/scripted/cpython::python-msi-library
      - id: msi-generated-ca-dll
      - id: metadata/binary/symbols/name/process::msi-embedded-create-process-a
      - id: micro-behaviors/process/inject/runtime/thread-context::msi-embedded-set-thread-context
      - id: micro-behaviors/process/inject/runtime/call::msi-embedded-write-process-memory
      - id: micro-behaviors/mem/alloc/virtual::msi-embedded-virtual-alloc-ex
    any:
      - id: micro-behaviors/process/inject/runtime/thread-context::msi-embedded-get-thread-context
      - id: micro-behaviors/process/inject/runtime/thread-context::msi-embedded-resume-thread
      - id: msi-userprofile-desktop-stage
      - id: objectives/evasion/masquerade/identity/fabricated::visual-cpp-kingston-msi-masquerade
      - id: micro-behaviors/fs/file/create::shortcut-arguments
    needs: 2
  - id: msi-sideload-target-pair
    desc: MSI references common sideload DLL targets
    crit: suspicious
    conf: 0.91
    attack: T1574.002
    all:
      - id: msi-sideload-target-cryptbase-raw
      - id: msi-sideload-target-version-raw
  - id: msi-exe2msi-winrar-sfx-stager
    desc: exe2msi wrapper stages WinRAR SFX
    crit: suspicious
    conf: 0.97
    for: [oledoc]
    all:
      - id: well-known/tool/packaging/exe2msi::exe2msi-wrapper-package
      - id: micro-behaviors/process/config/installer::winrar-sfx-silent-overwrite-setup-clues
      - id: micro-behaviors/data/archive/extract/destination::program-files-x86-destination-text
  - id: msi-winrar-sfx-sideload-stager
    desc: MSI WinRAR SFX stages sideload payloads
    crit: hostile
    conf: 0.98
    attack: T1574.002
    all:
      - id: msi-exe2msi-winrar-sfx-profile
      - id: msi-sfx-sideload-targets-yara
  - id: msi-resource-backed-hollowing-loader
    desc: MSI resource-backed hollowing loader
    crit: hostile
    conf: 0.99
    attack: T1055.012
    for: [oledoc]
    all:
      - id: msi-custom-action-hollowing-dropper
      - id: micro-behaviors/data/embedded/payload/resource::msi-embedded-resource-loader-apis
      - id: micro-behaviors/dylib/load/runtime::msi-embedded-load-library-a
      - id: micro-behaviors/dylib/lookup::ole-get-proc-address-reference
  - id: msi-hidden-script-downloader
    desc: MSI hides policy-bypassed PowerShell that downloads a script
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1105,T1027,T1564.003,T1195.002
    for: [oledoc]
    all:
      - id: metadata/package/files/msi/identity::ole2-installer-kind
      - id: micro-behaviors/process/argument/interpreter::powershell-hidden-bypass-encoded-command
      - id: objectives/execution/payload/file-exec/installer/package::msi-webclient-payload-download
# A build engine renamed as an innocuous application is installed with a
# project file below LocalAppData and invoked directly from the MSI action
# table.  This is MSBuild proxy execution rather than a normal build command.
  - id: msi-renamed-msbuild-project-loader
    desc: MSI launches a renamed MSBuild project loader from LocalAppData
    crit: hostile
    conf: 0.99
    attack: T1127.001
    scope: file
    for: [oledoc]
    all:
      - id: micro-behaviors/process/create/exec::msi-exe-csproj-nologo-command
      - id: metadata/package/files/msi/strings::msi-csproj-file-table-alias
      - id: micro-behaviors/fs/path/app-data/platform::msi-localappdata-install-root
      - id: metadata/package/files/msi-content::msi-file-table-source-target-alias

  - id: python-msi-peruser-payload-auto-launch
    desc: Python MSI drops a per-user payload and auto-launches it after install
    crit: hostile
    conf: 0.98
    attack: T1204.002,T1036.005,T1195.002
    all:
      - id: well-known/lib/runtime/scripted/cpython::python-msi-library
      - id: micro-behaviors/fs/path/app-data/platform::msi-localappdata-install-root
      - id: micro-behaviors/process/config/installer::msi-launch-installed-application-action
    any:
      - id: metadata/package/files/msi/identity::msi-verification-lure-subject
      - id: metadata/package/files/msi/identity::msi-generic-installer-basename

  - id: msi-localappdata-launchfile-alias-dropper
    desc: MSI LaunchFile dropper with aliased payload table
    crit: hostile
    conf: 0.98
    attack: T1204.002,T1027.009,T1195.002
    all:
      - id: micro-behaviors/fs/path/app-data/platform::msi-localappdata-install-root
      - id: micro-behaviors/process/config/installer::msi-launchfile-custom-action
      - id: metadata/package/files/msi-content::msi-file-table-source-target-alias
      - id: micro-behaviors/process/config/installer::msi-customaction-launchfile-reference

  - id: msi-runkey-camouflaged-background-payload
    desc: MSI installs a camouflaged background payload and persists at logon
    crit: hostile
    conf: 0.99
    attack: T1547.001,T1036.005,T1059.003,T1195.002
    all:
      - id: metadata/package/files/msi/identity::msi-installation-database-title
      - id: msi-run-key-background-cmd-launch
      - id: msi-csrss-msmpeng-camouflage-set

  - id: msi-customaction-packed-dll-loader
    desc: MSI package executes embedded packed DLL payload
    crit: hostile
    conf: 0.98
    attack: T1218.007,T1027.002
    scope: outer
    for: [oledoc, msi, pe]
    all:
      - id: metadata/package/files/msi/identity::msi-installation-database-title
      - id: metadata/binary/section/layout::empty-executable-text-section
    any:
      - id: objectives/anti-static/pack/loader-noise::sparse-empty-text-minimal-import-packed-pe
      - id: objectives/anti-static/pack/detect::empty-text-minimal-import-packed-pe
      - id: objectives/anti-static/obfuscation/payload/section/layout::empty-code-dominant-packed-loader
      - id: metadata/binary/layout/entropy::high-entropy-overlay
      - id: objectives/anti-static/pack/overlay::high-entropy-overlay-with-random-sections-and-few-imports
      - id: micro-behaviors/communications/http/server/module::http-extension-proc-export
    needs: 2
