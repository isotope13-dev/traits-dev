defaults:
  platforms: [android, unix, windows]
  for: [android_apk, zip]
  crit: suspicious
  conf: 0.9
  attack: "T1105"
  mbc: "E1105"


composite_rules:
- id: android-remote-apk-installer
  desc: Android remote APK installer
  crit: hostile
  conf: 0.97
  for: [android_apk, zip, dex]
  all:
  - id: objectives/command-and-control/channel/http/uri::android-support-c2-workflow
  - id: micro-behaviors/os/package-manager/sideload::android-apk-mime-type
  - id: micro-behaviors/os/package-manager/sideload::package-installer-service-class

- id: android-cipher-asset-sideload-session-dropper
  desc: Android APK decrypts opaque asset into PackageInstaller session
  crit: hostile
  conf: 0.98
  for: [android_apk, zip, dex, xml]
  scope: archive
  all:
  - id: micro-behaviors/os/package-manager/sideload::android-cipher-asset-packageinstaller-clues
  - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-with-opaque-asset
  - id: micro-behaviors/os/package-manager/sideload::android-vpn-install-session-clues
  - id: metadata/permission/management::android-request-install-packages-request
