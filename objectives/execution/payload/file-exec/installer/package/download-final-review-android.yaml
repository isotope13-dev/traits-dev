defaults:
  platforms: [android, unix, windows]
  for: [android_apk, zip]
  crit: suspicious
  conf: 0.9
  attack: "T1105"
  mbc: "E1105"


composite_rules:
- id: android-remote-apk-installer
  desc: Android remote APK installer
  crit: hostile
  conf: 0.97
  for: [android_apk, zip, dex]
  all:
  - id: objectives/command-and-control/channel/http/uri::android-support-c2-workflow
  - id: micro-behaviors/os/package-manager/sideload::android-apk-mime-type
  - id: micro-behaviors/os/package-manager/sideload::package-installer-service-class
- id: android-http-payload-fetch-alternative
  desc: Android HTTP payload fetch over GET or POST
  crit: component
  conf: 1.0
  for: [android_apk, zip, dex]
  any:
  - id: micro-behaviors/communications/http/client/response-body::android-urlconnection-get-response-vocabulary
  - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-dex
- id: android-fetched-apk-install-prompt
  desc: Android fetched APK install prompt with evasion context
  crit: hostile
  conf: 0.91
  for: [android_apk, zip, dex]
  all:
  - id: micro-behaviors/os/package-manager/sideload::android-sideload-api-vocabulary
  - id: android-http-payload-fetch-alternative
  any:
  - id: micro-behaviors/os/privilege/manifest::device-admin-receiver-class
  - id: micro-behaviors/process/terminate/kill::android-kill-background-processes-api
