defaults:
  platforms: [android]
  for: [dex]
  attack: T1105,T1631
traits:
  - id: dex-http-input-call
    desc: DEX opens HTTP response stream
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Ljava/net/HttpURLConnection;->getInputStream'
  - id: dex-file-output-write-call
    desc: DEX writes file output stream
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Ljava/io/FileOutputStream;->write'
  - id: dex-uri-from-file-call
    desc: DEX creates URI from file
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Landroid/net/Uri;->fromFile'
  - id: dex-context-start-activity-call
    desc: DEX starts activity from context
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Landroid/content/Context;->startActivity'
  - id: dex-kill-background-processes-call
    desc: DEX calls background process termination
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Landroid/app/ActivityManager;->killBackgroundProcesses'
composite_rules:
  # The cluster represents nearby call sites, not proven data flow.
  - id: dex-http-file-install-call-cluster
    desc: HTTP input, file write and activity call cluster
    crit: notable
    conf: 0.95
    near_bytes: 1024
    all:
      - id: dex-http-input-call
      - id: dex-file-output-write-call
      - id: dex-uri-from-file-call
      - id: dex-context-start-activity-call
  - id: android-http-file-install-kill-clues
    desc: APK install call cluster with process termination
    crit: hostile
    conf: 0.96
    near_bytes: 4096
    all:
      - id: dex-http-file-install-call-cluster
      - id: dex-kill-background-processes-call
    # MIME text lives in the DEX string table, separate from code offsets.
    any:
      - id: micro-behaviors/os/package-manager/sideload::android-apk-mime-type
