defaults:
  platforms: [android]
  for: [dex]
  attack: T1105,T1631
composite_rules:
  # The cluster represents nearby call sites, not proven data flow.
  - id: dex-http-file-install-call-cluster
    desc: HTTP input, file write and activity call cluster
    crit: notable
    conf: 0.95
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/request/client::dex-http-input-call
      - id: micro-behaviors/fs/file/open/write::dex-file-output-write-call
      - id: micro-behaviors/os/message/intent::dex-uri-from-file-call
      - id: micro-behaviors/os/message/intent::dex-context-start-activity-call
  # A downloader that terminates other apps' background processes and
  # prompts installation of a file it wrote: the cleaner/booster disguise of
  # Android droppers. The HTTP read often sits in a separate downloader class
  # reached by callback, so it is file-wide evidence rather than proximity.
  # Self-updaters write and install APKs but do not kill other apps; cleaners
  # kill processes but do not install downloaded APKs.
  - id: android-http-file-install-kill-clues
    desc: HTTP download, APK install prompt, app killing
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/request/client::dex-http-input-call
      - id: micro-behaviors/process/terminate/kill::dex-kill-background-processes-call
      - id: micro-behaviors/os/package-manager/sideload::written-file-apk-install-prompt
