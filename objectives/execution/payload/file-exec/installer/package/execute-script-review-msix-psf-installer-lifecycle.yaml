---
defaults:
  platforms:
  - windows
composite_rules:
- id: msix-psf-hidden-script-network-fetch
  desc: MSIX hidden PowerShell and network request clues
  crit: suspicious
  conf: 0.88
  for:
  - zip
  - json
  - powershell
  scope: archive
  all:
  - id: metadata/file/format/appx::appx-manifest-member
  - id: micro-behaviors/process/config/installer::psf-start-script-ps1
  - id: micro-behaviors/process/config/installer::psf-start-script-hidden
  any:
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
  - id: micro-behaviors/communications/http/client/library::powershell-rest-request
  - id: micro-behaviors/communications/http/client/managed::webclient-download-method-text
  - id: micro-behaviors/communications/http/client/managed::downloadstring
