defaults:
  platforms: [windows]
  for: [msi, oledoc]
  attack: T1218.007,T1036.005

traits:
  - id: msi-creator-claims-microsoft
    desc: MSI creator field claims Microsoft Corp
    crit: notable
    conf: 0.95
    if:
      type: value
      path: office.creator
      regex: '(?i)^Microsoft\s+Corp(oration|\.)?$'

composite_rules:
  - id: unsigned-msi-forged-microsoft-implant-dropper
    desc: Unsigned MSI claims Microsoft creator while carrying shell-capable HTTP payload
    crit: hostile
    conf: 0.98
    scope: outer
    for: [msi, oledoc, pe, dll]
    all:
      - id: msi-creator-claims-microsoft
      - id: metadata/signed/trust-level::unsigned
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
      - id: micro-behaviors/communications/http/form::multipart-form
    unless:
      - id: metadata/signed/platform/
