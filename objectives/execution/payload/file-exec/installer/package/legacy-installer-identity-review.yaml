defaults:
  platforms:
  - windows
composite_rules:
- id: msi-renamed-garena-loader-sidecars
  desc: MSI installs renamed Garena loader and sidecars with launch action
  crit: hostile
  conf: 0.995
  all:
  - id: metadata/package/files/msi/strings::msi-garena-voice-library-layout
  - id: metadata/package/files/msi/strings::msi-garena-loader-opaque-sidecars
  - id: metadata/package/files/msi/strings::msi-termina-random-source-alias
  - id: micro-behaviors/fs/path/app-data/platform::msi-localappdata-install-root
  - id: micro-behaviors/process/config/installer::msi-launchfile-custom-action
  for:
  - oledoc
