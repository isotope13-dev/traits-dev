---
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: winrar-sfx-xeno-injector-clues
  desc: Silent SFX with Xeno injector references
  crit: suspicious
  conf: 0.98
  attack: T1204.002, T1055
  mbc: B0023, E1055
  all:
  - id: micro-behaviors/data/archive/extract/destination::sfx-temp-path-directive
  - id: micro-behaviors/data/archive/extract/options::sfx-silent-directive
  - id: micro-behaviors/fs/path/binary::xenoinjector-exe-reference
  - id: micro-behaviors/fs/path/binary::xeno-versioned-executable-reference
  any:
  - id: well-known/tool/sysadmin/winrar-sfx::winrar-sfx
  - id: micro-behaviors/ui/window/display::start-dialog-label-text
  - id: well-known/tool/sysadmin/winrar-sfx::winrar-sfx-registry-text
