defaults:
  platforms: [windows, macos, linux]
  for: [data]
  crit: notable
  conf: 0.95
composite_rules:
  # Co-located bytecode strings are clues, not a recovered call graph.
  - id: jsc-remote-archive-elevation-string-cluster
    desc: Remote ZIP, extraction and elevation strings
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/download/url::archive-url-reference-binary
      - id: micro-behaviors/fs/file/open/write::node-create-write-stream-api-name
      - id: micro-behaviors/data/archive/extract/zip::js-zip-extract-all-to
      - id: micro-behaviors/fs/temp/directory::data-mkdtempsync-reference
      - id: micro-behaviors/process/create/cmdlet::data-powershell-start-process-text
      - id: micro-behaviors/os/privilege/elevation::data-powershell-runas-option
  - id: jsc-compiled-remote-archive-elevation
    desc: Compiled JS archive and elevation clues
    crit: hostile
    conf: 0.96
    attack: T1027,T1105,T1548.002
    all:
      - id: metadata/file/extension/identity::jsc-file-extension
      - id: jsc-remote-archive-elevation-string-cluster
      - id: metadata/import/builtin::data-child-process-module-reference
