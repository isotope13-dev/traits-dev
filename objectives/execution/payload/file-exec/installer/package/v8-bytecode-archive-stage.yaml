defaults:
  platforms: [windows, macos, linux]
  for: [data]
  crit: notable
  conf: 0.95
traits:
  - id: jsc-archive-url
    desc: Bytecode contains remote ZIP URL
    if:
      type: text
      regex: 'https?://[^\x00-\x20"'']{1,200}\.zip'
  - id: jsc-node-write-stream-name
    desc: Bytecode contains Node file-stream API name
    if:
      type: text
      substr: createWriteStream
  - id: jsc-zip-extract-api-name
    desc: Bytecode contains ZIP extraction API name
    if:
      type: text
      substr: extractAllTo
  - id: jsc-temp-directory-api-name
    desc: Bytecode contains temporary-directory API name
    if:
      type: text
      substr: mkdtempSync
  - id: jsc-powershell-process-command
    desc: Bytecode contains PowerShell start command
    if:
      type: text
      substr: 'powershell Start-Process '
  - id: jsc-powershell-runas-option
    desc: Bytecode contains PowerShell elevation option
    if:
      type: text
      substr: '-Verb runAs'
composite_rules:
  # Co-located bytecode strings are clues, not a recovered call graph.
  - id: jsc-remote-archive-elevation-string-cluster
    desc: Remote ZIP, extraction and elevation strings
    near_bytes: 8192
    all:
      - id: jsc-archive-url
      - id: jsc-node-write-stream-name
      - id: jsc-zip-extract-api-name
      - id: jsc-temp-directory-api-name
      - id: jsc-powershell-process-command
      - id: jsc-powershell-runas-option
  - id: jsc-compiled-remote-archive-elevation
    desc: Compiled JS archive and elevation clues
    crit: hostile
    conf: 0.96
    attack: T1027,T1105,T1548.002
    all:
      - id: metadata/file/extension/identity::jsc-file-extension
      - id: jsc-remote-archive-elevation-string-cluster
      - id: metadata/import/builtin::data-child-process-module-reference
