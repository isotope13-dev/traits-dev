---
defaults:
  platforms:
  - android
  for:
  - apk
composite_rules:
- id: android-decode-install-permission-vpn-filter
  for:
  - android_apk
  - dex
  - xml
  desc: Android decode loop, install permission and VPN filter co-occur
  crit: suspicious
  conf: 0.995
  scope: outer
  all:
  - id: micro-behaviors/data/decode/xor/feedback::dalvik-lcg-byte-xor-decode-loop
  - id: metadata/permission/management::android-request-install-packages-request
  - id: micro-behaviors/network/tunnel::android-vpn-application-exclusion-filter
