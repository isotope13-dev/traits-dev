defaults:
  platforms: [windows]
  for: [oledoc]
  crit: suspicious
  conf: 0.99
composite_rules:
  - id: msi-wscript-powershell-option-profile
    desc: MSI text has WScript encoded PS options
    all:
      - id: micro-behaviors/process/argument/interpreter::msi-wscript-powershell-launch-text
      - id: micro-behaviors/process/argument/interpreter::msi-powershell-hidden-or-encoded-option-text
  - id: msi-hidden-powershell-launch-encoded
    desc: MSI decoded PowerShell and hidden option references
    all:
      - id: well-known/lib/runtime/scripted/windows-script-host::msi-encoded-wscript-shell-reference
      - id: micro-behaviors/process/argument/interpreter::msi-encoded-hidden-window-option
      - id: micro-behaviors/fs/path/application/interpreter::msi-powershell-executable-encoded
      - id: micro-behaviors/process/argument/interpreter::msi-encoded-command-option
  - id: msi-powershell-launch-profile
    desc: MSI PowerShell and encoded option references
    any:
      - id: objectives/execution/payload/file-exec/installer/script-package::msi-wscript-powershell-option-profile
      - id: objectives/execution/payload/file-exec/installer/script-package::msi-hidden-powershell-launch-encoded
