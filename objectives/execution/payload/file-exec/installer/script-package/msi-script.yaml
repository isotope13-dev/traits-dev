defaults:
  platforms: [windows]
  for: [oledoc, msi]
  attack: T1105
traits:
  - id: installfolder-wscript-launcher
    desc: MSI launches installed VBS
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: wscript\.exe\s+"\[INSTALLFOLDER\].{0,200}\.vbs"
  - id: installfolder-powershell-payload
    desc: MSI references installed PS1
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: \[INSTALLFOLDER\].{0,200}\.ps1
  - id: embedded-script-filenames
    desc: MSI embeds named script stages
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)\b(november_block25\.vbs|charlie_script48\.ps1)\b
  - id: embedded-vbs-stage
    desc: MSI references VBS stage
    crit: notable
    conf: 0.9
    if:
      type: text
    # A bare ".vbs" substring also matches validation-schema tokens such as
    # the ICE listing "ice08.vbsice09.vbs..." in WiX's darice.cub, which names
    # validator scripts rather than staging a payload. Require a token
    # boundary so only real stage filename references match.
      regex: (?i)\.vbs\b
    unless:
      - id: metadata/lang/locale/catalog::gettext-po-catalog
  - id: embedded-ps1-stage
    desc: MSI references PS1 stage
    crit: notable
    conf: 0.9
    if:
      type: text
    # Symmetric with embedded-vbs-stage: schema-concatenated tokens must not
    # read as staged payloads.
      regex: (?i)\.ps1\b
    unless:
      - id: metadata/lang/locale/catalog::gettext-po-catalog
  - id: wscript-vbs-file-vbscript
    desc: MSI runs VBS through WScript
    crit: suspicious
    conf: 0.97
    attack: T1059.005
    if:
      type: text
      regex: '(?i)wscript\.exe\s+//B\s+//?E:vbscript\s+"[\w.-]{6,}\.vbs"'
  - id: wscript-extensionless-vbscript
    desc: MSI runs extensionless VBScript
    crit: suspicious
    conf: 0.97
    attack: T1059.005
    if:
      type: text
      regex: wscript\.exe\s+//B\s+/e:vbscript\s+"[A-Za-z0-9_-]{6,}"
  - id: msi-launchmain-wscript-silent-vbs
    desc: MSI LaunchMain runs silent VBS via WScript
    crit: suspicious
    conf: 0.98
    attack: T1059.005,T1204.002
    if:
      type: raw
      regex: 'LaunchMain.{0,200}wscript\.exe.{0,120}//B.{0,60}silent\.vbs'
  - id: randomized-vbs-install-names
    desc: MSI installs randomized VBS names
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)[A-Za-z0-9_-]{6,}\|[A-Za-z0-9_-]{6,}\.vbs
  - id: msi-vbs-localappdata-exe-path
    desc: MSI VBS builds LocalAppData EXE path
    crit: suspicious
    conf: 0.95
    attack: T1059.005
    if:
      type: text
      regex: '%LOCALAPPDATA%"\).{0,160}\\[A-Za-z0-9]{8,24}\\[A-Za-z0-9]{8,16}\.exe'
  - id: msi-vbs-hidden-shell-run
    desc: MSI VBS runs process hidden
    crit: suspicious
    conf: 0.95
    attack: T1059.005
    if:
      type: text
      regex: '(?i)(vbs\.)?Run\s+("[^"]{4,320}"|[A-Za-z0-9_]{6,}),\s*0,\s*(True|False)'
  - id: msi-vbs-hidden-command-run
    desc: MSI VBS runs PowerShell hidden
    crit: suspicious
    conf: 0.96
    attack: T1059.005
    if:
      type: text
      regex: '(?i)\.Run\s+"powershell.{1,240},\s*0,\s*False'
  - id: msi-powershell-irm-iex-pipeline
    desc: MSI PowerShell IRM eval pipeline
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)powershell\s+""?irm\s+[a-z0-9][a-z0-9.-]*\.[a-z]{2,}\|iex'
  - id: msi-vbs-sleep-before-exec
    desc: MSI VBS sleeps before execution
    crit: notable
    conf: 0.88
    attack: T1497.003
    if:
      type: text
      regex: 'WScript\.Sleep\s+[1-9][0-9]{3,5}'
  - id: msi-batch-vbs-launcher-files
    desc: MSI stages BAT with VBS launcher
    crit: suspicious
    conf: 0.96
    attack: T1059.003
    if:
      type: text
      regex: (?i)\.bat\|[A-Za-z0-9_]+\.bat.{0,120}\.vbs\|[A-Za-z0-9_]+\.vbs
  - id: msi-localappdata-wscript-bat
    desc: MSI installs WScript-named BAT
    crit: suspicious
    conf: 0.96
    attack: T1059.003
    if:
      type: text
      regex: (?i)LocalAppDataFolder.{0,160}wscript_[0-9]{3,6}\.bat
  - id: msi-explorer-folder-vbs-target
    desc: MSI uses Windows explorer directory
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: \[WindowsFolder\]explorer\.exe.{0,120}\.vbs

composite_rules:
  - id: embedded-script-filename-pair
    desc: MSI references both VBS and PowerShell scripts
    crit: notable
    conf: 0.95
    all:
      - id: embedded-vbs-stage
      - id: embedded-ps1-stage
  - id: msi-localappdata-vbs-exe-launcher
    desc: MSI launches randomized userland EXE via VBS
    crit: hostile
    conf: 0.98
    attack: T1059.005
    all:
      - id: objectives/execution/payload/file-exec/installer/package::msi-randomized-userland-payload-stage
      - id: wscript-vbs-file-vbscript
  - id: msi-script-launcher
    desc: MSI launches staged script payload
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/installer/layout::script-payload-cabinet
      - id: embedded-script-filenames
      - id: installfolder-wscript-launcher
  - id: msi-vbs-powershell-chain
    desc: MSI stages a VBS launcher for a PowerShell payload
    crit: suspicious
    conf: 0.98
    all:
      - id: embedded-script-filename-pair
      - id: installfolder-wscript-launcher
      - id: installfolder-powershell-payload
  - id: msi-script-dropper-persistence
    desc: MSI dropper with Run persistence
    crit: hostile
    conf: 0.98
    for: [oledoc]
    all:
      - id: msi-vbs-powershell-chain
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
      - id: objectives/persistence/login/startup/registry::script-style-run-value
  - id: msi-wscript-userland-dropper
    desc: MSI WScript staged payload dropper
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/files/msi/identity::msi-installation-database-title
      - id: metadata/package/files/msi-cabinet::embedded-mscf-cabinet
      - id: micro-behaviors/fs/path/app-data/platform::msi-localappdata-install-root
      - id: micro-behaviors/process/interpreter/wsh::wscript-vbscript-custom-action-raw
      - id: wscript-extensionless-vbscript
      - id: metadata/package/files/msi/strings::msi-localappdata-directory-name-pair
      - id: metadata/package/files/msi-content::msi-file-table-source-target-alias
  - id: msi-localappdata-vbs-exe-dropper
    desc: MSI LocalAppData VBS EXE dropper
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/files/msi/identity::msi-installation-database-title
      - id: metadata/package/files/msi-cabinet::embedded-mscf-cabinet
      - id: micro-behaviors/fs/path/app-data/platform::msi-localappdata-install-root
      - id: metadata/package/files/msi-content::msi-file-table-source-target-alias
      - id: msi-vbs-localappdata-exe-path
      - id: msi-vbs-hidden-shell-run
    any:
      - id: micro-behaviors/process/interpreter/wsh::wscript-vbscript-custom-action-raw
      - id: wscript-vbs-file-vbscript
      - id: wscript-extensionless-vbscript
  - id: msi-extensionless-vbs-hidden-exe
    desc: MSI extensionless VBS hidden EXE launcher
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/files/msi/identity::msi-installation-database-title
      - id: micro-behaviors/process/interpreter/wsh::wscript-vbscript-custom-action-raw
      - id: wscript-extensionless-vbscript
      - id: msi-vbs-localappdata-exe-path
      - id: msi-vbs-hidden-shell-run
    any:
      - id: metadata/package/files/msi-content::msi-file-table-source-target-alias
      - id: msi-vbs-sleep-before-exec
      - id: metadata/package/files/msi-content::random-software-installed-marker-raw
  - id: msi-hidden-powershell-irm-eval
    desc: MSI hidden PowerShell IRM eval
    crit: hostile
    conf: 0.99
    attack: T1059.001
    for: [oledoc]
    all:
      - id: metadata/package/files/msi/identity::msi-installation-database-title
      - id: micro-behaviors/process/create/exec::msi-wscript-shell-run-call
      - id: msi-vbs-hidden-command-run
      - id: msi-powershell-irm-iex-pipeline
  - id: msi-hidden-encoded-powershell-custom-action
    desc: MSI custom action launches hidden encoded PowerShell with policy bypass
    crit: hostile
    conf: 0.99
    attack: "T1059.001,T1059.005,T1564.003,T1195.002"
    for: [oledoc]
    all:
      - id: metadata/package/files/msi/identity::msi-installation-database-title
      - id: micro-behaviors/process/create/exec::msi-wscript-shell-run-call
      - id: micro-behaviors/process/argument/interpreter::powershell-command-options-text
      - id: metadata/lang/source/syntax/argument::encodedcommand-option-reference
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-window
      - id: micro-behaviors/os/security/execution-policy::execution-policy-bypass-short-flag
  - id: msi-localappdata-wscript-batch-dropper
    desc: MSI stages WScript-launched batch dropper
    crit: hostile
    conf: 0.99
    attack: T1059.003
    all:
      - id: metadata/package/files/msi/identity::msi-installation-database-title
      - id: metadata/package/files/msi-cabinet::embedded-mscf-cabinet
      - id: micro-behaviors/fs/path/app-data/platform::msi-localappdata-install-root
      - id: msi-batch-vbs-launcher-files
      - id: msi-localappdata-wscript-bat
      - id: msi-explorer-folder-vbs-target
  - id: msi-node-runtime-wscript-silent-dropper
    desc: Fake Node Runtime MSI runs silent VBS launcher
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1195.002,T1059.005,T1204.002
    all:
      - id: metadata/package/files/msi/identity::node-runtime-foundation-wix-identity
      - id: msi-launchmain-wscript-silent-vbs
      - id: micro-behaviors/fs/path/app-data/platform::msi-localappdata-install-root

