defaults:
  platforms: [windows]
  for: [pe]


composite_rules:
  - id: msi2exe-ps1-cmd-dropper
    desc: msi2exe stub stages paired Ps1File and CmdFile
    crit: hostile
    conf: 0.97
    attack: T1204.002,T1059.001,T1105
    all:
      - id: well-known/tool/packaging/msi2exe::msi2exe-stub-pdb
      - id: metadata/package/files/msi-script::embedded-powershell-payload-raw
      - id: micro-behaviors/process/config/installer::installer-table-cmdfile-entry
      - id: metadata/binary/symbols/name/process::create-process-a
