defaults:
  platforms: [windows]
  for: [pe]


composite_rules:
  - id: msi2exe-ps1-cmd-dropper
    desc: msi2exe stub stages paired Ps1File and CmdFile
    crit: hostile
    conf: 0.97
    attack: T1204.002,T1059.001,T1105
    all:
      - id: metadata/file/profile/tool-reference::msi2exe-stub-pdb
      - id: metadata/binary/installer/database::embedded-powershell-payload-raw
      - id: metadata/file/profile/installation::installer-table-cmdfile-entry
      - id: metadata/binary/symbols/name/process::create-process-a
    unless:
      - id: metadata/signed/platform/
