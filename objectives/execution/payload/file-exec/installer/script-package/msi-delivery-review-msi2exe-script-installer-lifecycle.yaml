---
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: msi2exe-sysupdate-script-evidence
  desc: msi2exe script and sysupdate registry path evidence
  crit: suspicious
  conf: 0.96
  all:
  - id: well-known/tool/packaging/msi2exe::msi2exe-tool-token
  - id: micro-behaviors/os/registry/software/reference::sysupdate-registry-path
  - id: metadata/package/files/msi-script::embedded-powershell-payload-raw
  - id: micro-behaviors/process/config/installer::installer-table-cmdfile-entry
