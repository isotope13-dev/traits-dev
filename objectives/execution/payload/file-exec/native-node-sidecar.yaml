defaults:
  platforms:
  - macos
  - linux
  for:
  - macho
  - elf
  crit: hostile
  conf: 0.98
composite_rules:
- id: native-addon-hidden-sidecar-node-dropper
  desc: Native addon launches hidden sidecar with Node
  attack: T1059.007,T1027
  platforms:
  - linux
  for:
  - elf
  all:
  - id: metadata/binary/framework::node-api-native-addon
  - id: objectives/supply-chain/hidden-payload/trojan::native-addon-hidden-sidecar-node-stage
- id: detached-native-addon-hidden-sidecar-node-stage
  desc: Detached native addon launches hidden Node stage
  attack: T1059.007,T1027
  platforms:
  - linux
  for:
  - elf
  all:
  - id: objectives/supply-chain/hidden-payload/trojan::native-addon-hidden-sidecar-node-stage
  - id: micro-behaviors/process/daemonize/detach::fork-new-session
- id: native-addon-hidden-sidecar-temp-js-dropper
  desc: Native addon stages hidden sidecar to temp JS
  attack: T1195.002,T1059.007,T1564.001
  platforms:
  - windows
  for:
  - pe
  all:
  - id: metadata/binary/symbols/exports::node-api-addon-export
  - id: micro-behaviors/fs/path-ops::relative-dotfile-path-format
  - id: micro-behaviors/fs/path-ops::dot-prefixed-js-path-format
  - id: micro-behaviors/fs/attributes/flags::set-file-attributes-a
  - id: micro-behaviors/process/argument/file::node-script-path-command-template
  - id: micro-behaviors/process/create/exec::create-process-a
