# A TCP-to-file launch is also normal updater behavior. The file-infection
# behavior supplies attack admission; the native chain binds the received
# buffer to a written file and its later process launch. No endpoint or
# attacker-selected payload filename gates this observation.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
composite_rules:
  - id: pe-infector-tcp-payload-execution
    desc: PE infector receives and launches TCP payload
    crit: hostile
    conf: 0.98
    attack: T1105
    all:
      - id: objectives/impact/infect/virus::native-recursive-pe-file-infector
      - id: micro-behaviors/process/deploy/file-exec::x86-tcp-buffer-write-process-launch
