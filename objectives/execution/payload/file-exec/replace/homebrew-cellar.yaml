defaults:
  platforms: [macos]
  for: [shell]
  attack: T1105,T1554
  mbc: B0025

composite_rules:
  - id: homebrew-cellar-remote-tool-replace
    desc: Downloads and swaps Homebrew Cellar binary before shell launch
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/package-manager::homebrew-cellar-path
      - id: micro-behaviors/process/deploy/file-exec/command::shell-curl-wget-http-fetch
      - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
      - id: micro-behaviors/fs/file/move::mv-command
    any:
      - id: micro-behaviors/process/create/shell/interpreter::zsh-exec
      - id: micro-behaviors/fs/link::shell-ln-symbolic-link-command
    unless:
      - id: metadata/package/manager::homebrew-formula-class
