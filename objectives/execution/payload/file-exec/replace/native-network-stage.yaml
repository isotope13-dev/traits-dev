# Network stage loader connects over a POSIX socket, receives a payload, writes
# it to a hidden temporary path, marks it executable, and hands off execution
# while deleting the staged file via a forked split. Extends hidden stage
# replacement coverage across ELF and Mach-O and across compiler optimizations.
defaults:
  platforms: [linux, macos]
  for: [elf, macho]
  crit: hostile
  attack: T1105
  mbc: E1105

composite_rules:
  - id: native-hidden-stage-materialization
    desc: Writes and marks hidden temp stage executable
    crit: component
    conf: 0.90
    all:
      - id: objectives/evasion/indicator-removal/self::native-stage-file-write-capability
      - id: objectives/evasion/indicator-removal/self::native-stage-chmod-capability
    any:
      - id: micro-behaviors/fs/path/hidden::nul-terminated-hidden-temp-stage-path
      - id: micro-behaviors/fs/path/hidden::hidden-tmp-dotfile-path
      - id: micro-behaviors/fs/path/hidden::hidden-tmp-path
      - id: micro-behaviors/fs/path/hidden::var-tmp-hidden
      - id: micro-behaviors/fs/path/hidden::dev-shm-hidden-path

  - id: native-socket-hidden-stage-replacement
    desc: Socket stager writes, runs hidden payload
    conf: 0.96
    all:
      - id: micro-behaviors/communications/socket/connect/attempt::connect-import
      - id: micro-behaviors/communications/socket/receive::recv-symbol
      - id: micro-behaviors/fs/delete/path::native-fork-exec-delete-same-path
      - id: native-hidden-stage-materialization
    unless:
      - id: objectives/execution/payload/file-exec/replace::macho-http-xor-stage-replacement
      - id: objectives/execution/payload/file-exec/replace::macho-tcp-xor-stage-replacement
