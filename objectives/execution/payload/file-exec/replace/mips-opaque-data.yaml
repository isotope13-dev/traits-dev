# MIPS file-write and process-replacement syscall chain with opaque data.
defaults:
  platforms:
  - linux
  - android
  for:
  - elf
composite_rules:
- id: mips-opaque-data-write-execve
  desc: MIPS opaque data with write and execve syscalls
  crit: hostile
  conf: 0.995
  attack: T1106
  all:
  - id: objectives/anti-static/obfuscation/payload/section/layout::mips-encrypted-payload-blob
  - id: micro-behaviors/process/replace::mips-o32-execve-syscall
  - id: micro-behaviors/os/syscall/raw::mips-o32-open-syscall
  - id: micro-behaviors/os/syscall/raw::mips-o32-write-syscall
  any:
  - id: micro-behaviors/fs/path/temp::native-transient-staging-directory
  - id: metadata/binary/header/program::elf-executable-stack
