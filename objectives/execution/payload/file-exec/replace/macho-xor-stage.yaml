defaults:
  platforms:
  - macos
  for:
  - macho
  crit: hostile
  attack: T1105,T1140
  mbc: E1105
composite_rules:
- id: macho-http-xor-stage-replacement
  desc: HTTP XOR stager executes hidden payload
  conf: 0.97
  all:
  - id: micro-behaviors/process/replace::c-exec-variants
  - id: micro-behaviors/communications/http/get::get
  - id: micro-behaviors/communications/http/message::http-header-field-delimiter
  - id: micro-behaviors/communications/socket/connect/attempt::connect-import
  - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: micro-behaviors/data/encoding/xor/unspecified-key::macho-stack-indexed-byte-xor-loop
  - id: micro-behaviors/communications/socket/receive::recv-symbol
  - id: micro-behaviors/fs/write/file/handle/unspecified::write--fwrite
  - id: micro-behaviors/fs/chmod/modify::chmod-symbol
  - id: micro-behaviors/fs/path/hidden::hidden-tmp-path
- id: macho-tcp-xor-stage-replacement
  desc: TCP XOR stager executes hidden payload
  conf: 0.96
  all:
  - id: micro-behaviors/process/replace::c-exec-variants
  - id: micro-behaviors/communications/socket/connect/attempt::connect-import
  - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: micro-behaviors/communications/socket/receive::recv-symbol
  - id: micro-behaviors/data/encoding/xor/unspecified-key::macho-stack-indexed-byte-xor-loop
  - id: micro-behaviors/fs/write/file/handle/unspecified::write--fwrite
  - id: micro-behaviors/fs/chmod/modify::chmod-symbol
  - id: micro-behaviors/fs/path/hidden::hidden-tmp-path
  unless:
  - id: macho-http-xor-stage-replacement
