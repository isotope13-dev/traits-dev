# The numeric observations establish source syntax, not a recovered executable.
# These source observations co-occur; no general value-flow binding is claimed.
# Concealed evaluation, password construction from a text-file workflow,
# executable selection and hidden process launching together admit this chain.
# No domain, key, password, script variable or archive filename gates it.
defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: offset-passworded-archive-hidden-launch
    desc: Offset evaluation beside hidden archive launch syntax
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.001,T1105
    all:
      - id: micro-behaviors/process/interpreter/eval/constructed::powershell-offset-scriptblock-eval
      - id: metadata/lang/encoding::negative-offset-https-downloadfile-call
      - id: metadata/lang/encoding::negative-offset-sevenzip-signature
      - id: metadata/lang/encoding::negative-offset-extract-argument-list
      - id: metadata/lang/encoding::negative-offset-password-variable-argument
      - id: metadata/lang/encoding::negative-offset-text-file-filter
      - id: metadata/lang/encoding::negative-offset-executable-file-filter
      - id: metadata/lang/encoding::negative-offset-start-process-command
      - id: metadata/lang/encoding::negative-offset-hidden-window-option
