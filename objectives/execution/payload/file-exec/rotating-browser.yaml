defaults:
  for: [html]
  platforms: [windows]
composite_rules:
  - id: rotating-browser-saved-payload-shell-launch
    desc: Concealed browser HTTP response, file save and shell launch
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/anti-static/obfuscation/encoding/custom::rotating-substitution-document-writer
      - id: micro-behaviors/communications/http/client/response-body::rotating-responsebody-member
      - id: micro-behaviors/fs/write/file/stream::rotating-savetofile-member
      - id: micro-behaviors/process/create/shellexec::rotating-hex-shellexecute
      - id: micro-behaviors/process/interpreter/shell::rotating-hex-cmd-exe
