# curl-argv variant of node-fetch-hidden-temp-exec: instead of the fetch API
# plus a write call, the code spawns curl/wget with a remote URL and an -o
# output path, so the download never appears as a filesystem write. The chain
# still requires the hidden temp entry, an owner/exec chmod of the staged
# path, and a detached launch of that path; installers and updaters name the
# download for the product and keep it visible, so concealment plus the
# launch is what makes this a dropper rather than a fetch.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105,T1059,T1564.001
  mbc: B0030

composite_rules:
  - id: node-curl-hidden-temp-exec
    desc: Node curls a payload into a hidden temp file and runs it
    crit: hostile
    conf: 0.96
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/download/cli::curl-wget-argv
      - id: micro-behaviors/fs/path/temp::node-tmpdir-hidden-entry-reference
      - id: micro-behaviors/process/create/exec::spawn-variable-program
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-text
      - id: micro-behaviors/fs/chmod/modify::node-chmod-owner-only-700
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
