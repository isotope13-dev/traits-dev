defaults:
  for: [python]
  platforms: [unix, windows]
composite_rules:
  - id: stun-task-payload-execution
    desc: STUN transaction task channel downloads and launches executable content
    crit: hostile
    conf: 0.99
    attack: T1095,T1105
    near_lines: 35
    all:
      - id: objectives/command-and-control/channel/covert::zero-id-stun-task-requests
      - id: micro-behaviors/process/deploy::download-chmod-launch
