# The bound resource-to-file activation is neutral on its own. Concealed
# executable delivery plus own-image cleanup and complemented on-disk state
# admits this covert loader profile, independently of filenames and Run writes.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

composite_rules:
  - id: self-deleting-complement-state-resource-loader
    desc: Self-deleting concealed-state resource loader
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/deploy/file-exec::x86-resource-buffer-stage-launch
      - id: metadata/binary/resource/embedded-media::encrypted-zip-rsrc-pe
      - id: objectives/evasion/self-delete/file/script::x86-module-path-retry-delete-batch
      - id: micro-behaviors/data/arithmetic::x86-byte-complement-512
      - id: metadata/binary/instruction/sequence::x86-msmp-state-magic-compare
