# Same-file code profile: both decoder operations are required. This does
# not prove value flow between helper calls or successful payload execution.
defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
- id: wsh-xor-base64-hidden-ps1-exec
  desc: XOR/Base64 decoder and PS1 staging with hidden bypass launch
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.001,T1059.007
  all:
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: micro-behaviors/os/com/automation::filesystemobject-progid
  - id: micro-behaviors/fs/write/content::fso-text-file-write-api
  - id: micro-behaviors/fs/write/content::javascript-concat-ps1-extension
  - id: micro-behaviors/process/argument/option::powershell-policy-bypass-argument
  - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
  - id: micro-behaviors/data/control-flow/dispatch::exec-method-call-text
  - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
  - id: micro-behaviors/data/codec::msxml-datatype-bin-base64
