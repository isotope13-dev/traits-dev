defaults:
  for: [python]
  platforms: [windows]
  attack: T1105,T1059.006,T1564.003
  mbc: E1105

composite_rules:
  - id: python-download-hidden-pythonw-launch
    desc: Downloads remote script and launches it with hidden pythonw
    crit: hostile
    conf: 0.98
    scope: file
    # The download leg must put a response body on disk (urlretrieve or a
    # write of the response): a Windows-aware daemon that relaunches itself
    # under pythonw and separately calls an HTTP API downloads no script.
    all:
      - id: micro-behaviors/process/interpreter/python::pythonw-subprocess-no-window-profile
    any:
      - id: micro-behaviors/communications/http/lib/urllib::python-urlretrieve-qualified
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-content
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-text
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-read
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-body-path
      - id: micro-behaviors/fs/write/file/response-body::python-write-fetch-body-path
