defaults:
  for: [python]
  platforms: [windows]
  attack: T1105,T1059.006,T1564.003
  mbc: E1105

composite_rules:
  - id: python-download-hidden-pythonw-launch
    desc: Downloads remote script and launches it with hidden pythonw
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/process/interpreter/python::pythonw-subprocess-no-window-profile
    any:
      - id: micro-behaviors/communications/http/lib/urllib::python-urlretrieve-qualified
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
      - id: micro-behaviors/communications/http/lib/urllib::urllib-download-to-binary-output
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/communications/http/lib/requests::requests-get
