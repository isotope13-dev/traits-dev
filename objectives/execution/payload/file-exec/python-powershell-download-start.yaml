defaults:
  platforms: [windows]
  for: [python]
  attack: T1105,T1059.001
  mbc: B0030

composite_rules:
  - id: python-powershell-command-download-start
    desc: Python runs PowerShell to fetch and start an exe
    # A single `powershell -Command` string that downloads an executable with
    # curl.exe and launches it with Start-Process is a download-and-run
    # cradle; the executable URL leg keeps data-file downloads out.
    crit: hostile
    conf: 0.96
    near_lines: 40
    all:
      - id: micro-behaviors/process/create/shell/command-flag::python-powershell-command-option
      - id: micro-behaviors/communications/http/download/cli::fetch-output-flag-embedded-command
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-embedded
      - id: micro-behaviors/process/create/launch::python-string-start-process
