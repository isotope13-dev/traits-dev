# Downloader shellcode resolves the download and native launch APIs by hash.
defaults:
  platforms: [windows]
  for: [data]
  crit: hostile
  conf: 0.99
  attack: T1203,T1105,T1106

composite_rules:
  - id: ani-overflow-download-launch-shellcode
    desc: ANI overflow contains download and launch shellcode
    all:
      - id: objectives/execution/exploit/memory::ani-duplicate-header-overflow
      - id: micro-behaviors/os/api-resolution/hash-based::raw-x86-ror13-export-loop
      - id: micro-behaviors/os/api-resolution/hash-based::raw-x86-url-cache-download-hash
      - id: micro-behaviors/os/api-resolution/hash-based::raw-x86-createprocess-hash
  - id: ani-xor-download-launch-shellcode
    desc: ANI overflow conceals download and launch shellcode
    all:
      - id: objectives/execution/exploit/memory::ani-overflow-xor-code-staging
      - id: micro-behaviors/os/api-resolution/hash-based::xor-x86-url-file-download-hash
      - id: micro-behaviors/os/api-resolution/hash-based::xor-x86-winexec-hash
