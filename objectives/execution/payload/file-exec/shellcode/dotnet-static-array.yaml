defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: dotnet-xor-static-array-thread-loader
    desc: XOR static array runs in native thread
    crit: hostile
    conf: 0.99
    attack: T1620,T1027,T1140
    all:
      - id: micro-behaviors/mem/combined::dotnet-large-array-native-memory-api-profile
      - id: micro-behaviors/process/deploy/native-call::cil-xor-array-rx-thread-local-layout
    unless:
      - id: objectives/anti-static/obfuscation/obfuscator/managed/
