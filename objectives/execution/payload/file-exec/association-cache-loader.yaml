defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # An ordinary updater can use the same cache-to-process chain. The
  # extension-concealing EXE association hijack supplies attack admission.
  - id: association-hijacker-cache-payload-launch
    desc: EXE association hijacker downloads and launches cache payload
    crit: hostile
    conf: 0.98
    attack: T1105
    all:
      - id: micro-behaviors/process/deploy/file-exec::x86-urlmon-cache-path-winexec
      - id: objectives/evasion/hijack-execution-flow/file-association::extensionless-executable-association-wrapper
