# Delay, launch, cleanup: the batch stager idiom sleeps past sandbox
# windows with w32tm, starts a masqueraded payload from Windows Tasks, and
# deletes the previous temp stage. Each leg alone stays suspicious; the
# conjunction in one file is a staged malicious launch.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1036.005,T1497
composite_rules:
  - id: batch-delayed-tasks-launch-cleanup
    desc: Delayed Tasks payload launch with stage cleanup
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/time/query::w32tm-local-stripchart-command
      - id: objectives/evasion/masquerade/path::tasks-system-name-launch
      - id: micro-behaviors/fs/delete/file/command::batch-deletes-temp-bat
