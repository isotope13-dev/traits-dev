# Hidden WSH dispatch, remote executable URL, text-file creation and a
# PowerShell file-launch command must occur in the same script.
composite_rules:
- id: obfuscated-wsh-remote-script-file-command
  crit: hostile
  conf: 0.98
  desc: Obfuscated WSH script URL with PowerShell file-launch command
  attack: T1027,T1059.001,T1059.007,T1105,T1562.001
  all:
  - id: micro-behaviors/os/com/automation::activex-constructor-call
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
  - id: micro-behaviors/communications/http/url/path::executable-url-reference-b
  - id: micro-behaviors/fs/write/content::fso-text-file-write-api
  any:
  - id: micro-behaviors/process/create/flags::powershell-nop-ep-bypass-file-command
  - id: micro-behaviors/process/argument/option::escaped-noprofile-policy-bypass-fragment
  needs: 1
  unless:
  - id: objectives/command-and-control/dropper/delivery/download::obfuscated-js-activex-ps1-http-stager
  for:
  - javascript
  platforms:
  - windows
