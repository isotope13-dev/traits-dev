defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
- id: obfuscated-wsh-activex-savetofile-dropper
  desc: Obfuscated WSH decodes, saves, and executes an embedded payload
  crit: hostile
  conf: 0.98
  attack: T1059.007, T1027, T1140
  mbc: B0017, B0018, B0032
  all:
  - id: micro-behaviors/os/com/automation::activex-constructor-call
  - id: micro-behaviors/os/com/automation::activex-object-variable-progid
  - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
  - id: micro-behaviors/data/property/access::wscript-bracket-member-access
  - id: micro-behaviors/data/property/access::msxml-node-typed-value
  - id: micro-behaviors/data/control-flow/dispatch::script-run-method-call
  any:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
  - id: objectives/execution/activex/com::activex-object-question-delimited-progid
  - id: micro-behaviors/data/control-flow/dispatch::js-function-derived-computed-call
  - id: micro-behaviors/data/string/replace::js-bracket-split-join-remove
- id: wsh-unicode-padded-activex-script-dropper
  desc: WSH unicode padded dropper with ActiveX staging
  crit: hostile
  conf: 0.98
  attack: T1059.007,T1027,T1140,T1204.002
  mbc: B0023,B0032
  all:
  - id: metadata/lang/encoded/unicode-escape::javascript-unicode-escape-volume
  - id: micro-behaviors/data/property/access::msxml-node-typed-value
  - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
  - id: micro-behaviors/os/com/automation::activex-constructor-call
  - id: micro-behaviors/data/property/access::wscript-bracket-member-access
  any:
  - id: micro-behaviors/data/control-flow/dispatch::script-run-method-call
  - id: micro-behaviors/data/property/access::run-name-string-token

- id: obfuscated-wsh-payload-write-and-run
  desc: Obfuscated WSH script writes and runs a payload
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.007
  all:
  - id: micro-behaviors/os/com/automation::activex-object-variable-progid
  - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
  - id: micro-behaviors/data/property/access::wscript-bracket-member-access
  - id: micro-behaviors/data/property/access::run-name-string-token
  - id: micro-behaviors/data/control-flow/dispatch::js-function-derived-computed-call
  - id: micro-behaviors/data/control-flow/dispatch::js-arithmetic-falsy-final-flags
