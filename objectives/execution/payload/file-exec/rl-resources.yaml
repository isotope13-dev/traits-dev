defaults:
  platforms:
  - windows
  for:
  - pe
  arch:
  - x86
composite_rules:
- id: rl-packed-encrypted-resource-dropper
  desc: WinINet impersonator carries concealed native payload resources
  crit: hostile
  conf: 0.98
  attack: T1027,T1036
  all:
  - id: metadata/binary/resource/identity::reginst-resource-label
  - id: metadata/binary/resource/identity::image-resource-label
  - id: micro-behaviors/ui/dialog/error::loader-error-caption
  - id: metadata/binary/section/label::vr-writable-section
  - id: metadata/binary/section/label::mmym-small-executable-section
  - id: micro-behaviors/mem/combined::virtual-memory-api-name-triad
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  any:
  - id: well-known/lib/platform/microsoft-wininet::wininet-internal-name
  - id: well-known/lib/platform/microsoft-wininet::wininet-original-filename
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  needs: 1
