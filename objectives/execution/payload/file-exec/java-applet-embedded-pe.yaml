defaults:
  platforms: [windows]
  for: [html]
composite_rules:
  - id: java-applet-embedded-pe-hidden-launch
    desc: Java applet stages encoded MZ bytes and launches hidden
    crit: hostile
    conf: 0.99
    attack: T1203,T1027.009,T1564.003
    all:
      - id: micro-behaviors/os/com/automation::microsoft-java-activex-bridge-reference
      - id: micro-behaviors/fs/write/content::percent-encoded-mz-construction
      - id: micro-behaviors/fs/write/content::unescaped-content-write
      - id: micro-behaviors/fs/write/content::fso-open-text-file-write
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run
      - id: micro-behaviors/data/control-flow/dispatch::run-zero-style-argument
