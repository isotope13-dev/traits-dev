defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1105


composite_rules:
  - id: conhost-curl-temp-payload-launcher
    desc: Hidden LNK downloader stages temp payloads
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/config/target::conhost-target-raw
      - id: micro-behaviors/process/config/launch::lnk-conhost-headless-cmd
      - id: micro-behaviors/communications/http/download/cli/curl-wget::curl-silent-output-args
      - id: micro-behaviors/fs/path/temporary-artifact::lnk-temp-executable-path
      - id: micro-behaviors/process/daemonize/background::temp-path-background-launch
    any:
      - id: micro-behaviors/process/daemonize/background::repeated-background-start
      - id: micro-behaviors/communications/url/host/http::http-ip-endpoint-pair
      - id: metadata/file/text-distribution::compact-shortcut-string-surface
  - id: multi-stage-temp-payload-launcher
    desc: LNK stages BIN and EXE payloads
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::curl-silent-output-args
      - id: micro-behaviors/fs/file/extension::bin-extension-reference
      - id: micro-behaviors/fs/path/temporary-artifact::lnk-temp-executable-path
      - id: micro-behaviors/process/daemonize/background::temp-path-background-launch
    any:
      - id: micro-behaviors/process/daemonize/background::cmd-start-background
      - id: micro-behaviors/communications/url/host/http::http-ip-endpoint-pair
