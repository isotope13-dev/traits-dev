defaults:
  platforms: [windows]
  for: [javascript, typescript]
composite_rules:
  - id: node-powershell-xor-exe-loader
    desc: PowerShell downloads and launches XOR EXE
    crit: hostile
    conf: 0.995
    attack: "T1105"
    all:
      - id: micro-behaviors/communications/http/download/handler::powershell-download-xor-temp-write
      - id: micro-behaviors/process/create/hidden::powershell-hidden-temp-process
      - id: micro-behaviors/process/create/shell/interpreter::powershell-exe-spawn
      - id: micro-behaviors/process/daemonize/detach::detached-true
      - id: micro-behaviors/process/stdio/configure::child-stdio-ignore-option
    any:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/fs/delete/directory::fs-rm-recursive
