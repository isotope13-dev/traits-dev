defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1059.003,T1105

traits:
  - id: node-temp-batch-download-exec-flow
    desc: Downloads and executes temporary batch file
    crit: notable
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration (variable_declarator name: (identifier) @source value: (string (string_fragment) @url)))
          (lexical_declaration (variable_declarator name: (identifier) @filename value: (call_expression
            function: (member_expression object: (identifier) @path1 property: (property_identifier) @basename)
            arguments: (arguments (identifier) @source_name))))
          (lexical_declaration (variable_declarator name: (identifier) @temp value: (member_expression
            object: (member_expression object: (identifier) @process property: (property_identifier) @env)
            property: (property_identifier) @temp_name)))
          (lexical_declaration (variable_declarator name: (identifier) @target value: (call_expression
            function: (member_expression object: (identifier) @path2 property: (property_identifier) @join)
            arguments: (arguments (identifier) @temp_used (identifier) @filename_used))))
          (expression_statement (call_expression function: (member_expression
            object: (call_expression function: (member_expression object: (identifier) @https property: (property_identifier) @get)
              arguments: (arguments (identifier) @source_get (arrow_function parameters: (formal_parameters (identifier) @response)
                body: (statement_block
                  (lexical_declaration (variable_declarator name: (identifier) @stream value: (call_expression
                    function: (member_expression object: (identifier) @fs property: (property_identifier) @write)
                    arguments: (arguments (identifier) @target_write))))
                  (expression_statement (call_expression function: (member_expression object: (identifier) @response_used property: (property_identifier) @pipe)
                    arguments: (arguments (identifier) @stream_used)))
                  (expression_statement (call_expression function: (member_expression object: (identifier) @stream_event property: (property_identifier) @on)
                    arguments: (arguments (string (string_fragment) @finish) (arrow_function body: (statement_block
                      (expression_statement (call_expression function: (member_expression object: (identifier) @stream_close property: (property_identifier) @close)
                        arguments: (arguments (arrow_function body: (statement_block
                          (expression_statement (call_expression function: (identifier) @exec arguments: (arguments
                            (template_string (template_substitution (identifier) @target_exec)))))))))))))))))))))))
          (#eq? @source @source_name) (#eq? @source @source_get)
          (#match? @url "(?i)^https?://[^?#]+\\.bat([?#]|$)")
          (#eq? @path1 "path") (#eq? @path2 "path") (#eq? @basename "basename") (#eq? @join "join")
          (#eq? @process "process") (#eq? @env "env") (#eq? @temp_name "TEMP") (#eq? @temp @temp_used) (#eq? @filename @filename_used)
          (#eq? @https "https") (#eq? @get "get") (#eq? @fs "fs") (#eq? @write "createWriteStream")
          (#eq? @target @target_write) (#eq? @response @response_used) (#eq? @pipe "pipe")
          (#eq? @stream @stream_used) (#eq? @stream @stream_event) (#eq? @stream @stream_close)
          (#eq? @on "on") (#eq? @finish "finish") (#eq? @close "close") (#eq? @exec "exec") (#eq? @target @target_exec))

composite_rules:
  - id: node-temp-batch-download-exec
    desc: Downloads and runs temporary batch payload
    crit: hostile
    conf: 0.99
    all:
      - id: node-temp-batch-download-exec-flow
      - id: metadata/import/builtin::child-process-module-reference
