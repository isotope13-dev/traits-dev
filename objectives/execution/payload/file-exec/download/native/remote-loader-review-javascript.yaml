defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
  attack: T1105

composite_rules:
- id: remote-node-fetch-write-exec-cleanup
  desc: Remote JavaScript fetched and executed
  crit: suspicious
  conf: 0.97
  attack: T1059.007,T1105
  for:
  - javascript
  scope: leaf
  near_bytes: 900
  all:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync
  - id: micro-behaviors/process/create/exec::js-execfile-call
  - id: micro-behaviors/fs/delete/directory::fs-rm-recursive
  - id: micro-behaviors/fs/write/file/target::node-writes-script-js
  unless:
  - id: well-known/app/browser-extension/ai-web-extensions::ai-web-extensions-remote-runner-file
  - id: well-known/app/browser-extension/ai-web-extensions::ai-web-extensions-remote-runner-context
