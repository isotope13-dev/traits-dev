# A small native stub that downloads an executable with URLDownloadToFile,
# deletes its Zone.Identifier stream with cmd so SmartScreen and Office never
# see the Mark of the Web, and starts it with CreateProcess. Fetching a
# program over HTTP and stripping the mark that would warn the user before
# running it is a loader whatever the payload turns out to be.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105,T1553.005
  mbc: E1105
composite_rules:
  - id: urlmon-download-motw-strip-launch
    desc: Native stub downloads an EXE, strips Mark of the Web, and runs it
    crit: hostile
    conf: 0.93
    size_max: 262144
    all:
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-import
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe
      - id: micro-behaviors/fs/path/stream::zone-identifier-reference
      - id: micro-behaviors/process/create/native-symbol::create-process-w
      - id: metadata/signature/absent::unsigned-missing-signature-record
