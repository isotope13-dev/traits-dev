defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - npm
  - tar
  - package.json
composite_rules:
- id: npm-postinstall-staged-native-launch
  desc: npm install hook with native stage context
  crit: hostile
  conf: 0.97
  attack: T1059.007,T1105
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: objectives/execution/payload/file-exec/download/native::same-file-remote-native-stage
  unless:
  - id: micro-behaviors/os/module/lookup::npm-native-binary-wrapper
  - id: well-known/app/publishing/decocms/
