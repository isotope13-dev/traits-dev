defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries

composite_rules:
  - id: node-dns-streamed-launch-source-clues
    desc: Node DNS streamed launch and source clues
    crit: hostile
    conf: 0.98
    attack: T1105
    mbc: B0024
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/process/deploy/file-exec/spawn::node-dns-streamed-temp-file-launch
    any:
      - id: micro-behaviors/data/encoding/base64::node-base64-buffer-clues
      - id: metadata/file/line::very-long-source-line
