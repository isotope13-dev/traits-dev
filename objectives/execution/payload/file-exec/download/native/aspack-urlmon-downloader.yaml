defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105,T1027.002
  mbc: E1105

composite_rules:
  - id: aspack-urlmon-downloader
    desc: Small unsigned ASPack-packed URLDownloadToFile downloader
    crit: hostile
    conf: 0.94
    size_max: 131072
    all:
      - id: metadata/build/protector::aspack-x86-unpacking-stub
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: objectives/anti-static/pack/detect::pe-wx-section
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
      - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-text-pe
