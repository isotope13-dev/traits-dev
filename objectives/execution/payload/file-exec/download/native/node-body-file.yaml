defaults:
  for: [javascript]
  platforms: [unix, windows]
composite_rules:
  - id: node-response-write-execfile
    desc: Writes HTTP body then chmods and executes the same path
    crit: suspicious
    conf: 0.96
    near_lines: 30
    all:
      - id: micro-behaviors/communications/http/client/exchange::fetch-call
      - id: micro-behaviors/fs/write/file/response-body::node-write-body-reader-result
      - id: micro-behaviors/process/deploy/file-exec/spawn::node-written-chmod-execfile-path
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
