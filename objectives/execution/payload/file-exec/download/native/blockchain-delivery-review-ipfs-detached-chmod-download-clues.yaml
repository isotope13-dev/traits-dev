defaults:
  platforms: [windows, unix]
  for: [javascript, python, shell]


composite_rules:
- id: ipfs-detached-chmod-download-clues
  desc: IPFS download, chmod and detached spawn clues
  crit: hostile
  conf: 0.97
  attack: T1105
  mbc: B0024
  for:
    - javascript
    - typescript
  near_bytes: 8192
  all:
    - id: micro-behaviors/communications/http/services/ipfs::ipfs-gateway
    - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
    - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
    - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
