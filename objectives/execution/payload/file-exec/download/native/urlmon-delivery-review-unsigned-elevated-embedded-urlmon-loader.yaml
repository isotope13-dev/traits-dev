defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105
  mbc: E1105

composite_rules:
- id: unsigned-elevated-embedded-urlmon-loader
  crit: hostile
  desc: Unsigned elevated URLMon and PE launch clues
  conf: 0.98
  attack: T1105,T1129,T1548.002
  size_max: 1048576
  all:
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
  - id: metadata/binary/layout/embedded::pe-embedded
  - id: metadata/build/manifest::require-administrator
  - id: micro-behaviors/process/create/exec::create-process-api-name
  - id: micro-behaviors/dylib/load/runtime::load-library-ex-a
