defaults:
  platforms: [unix]
  for: [python]
  attack: T1105,T1059
  mbc: B0024

composite_rules:
  - id: python-c2-decoded-chmod-detached-popen
    desc: Decodes Base64 HTTP payload and spawns detached binary
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/data/decode/base64/call::b64decode-call
      - id: micro-behaviors/fs/file/io-mode::write-append-create-mode
      - id: micro-behaviors/fs/chmod/executable/mode::python-executable-mode-literal
      - id: micro-behaviors/process/daemonize/spawn::python-popen-detached-process
    any:
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-object
