defaults:
  platforms: [windows]
  for: [pe]
  attack: "T1105, T1204.002"
  mbc: E1105

composite_rules:
  - id: urlmon-game-lure-multistage-dropper
    desc: URLMon game-lure download and launch clues
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
      - id: micro-behaviors/communications/url/http-path/route::local-host-life-download-raw-url
      - id: micro-behaviors/fs/path/file::camera-focus-config-text-name
      - id: micro-behaviors/fs/path/file::italian-image-executable-name-text
      - id: metadata/binary/symbols/name/process::create-process-a
    any:
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
      - id: micro-behaviors/fs/file/move::move-file
      - id: metadata/lang/natural/diagnostic::italian-download-status-burst
    needs: 2
    unless:
      - id: metadata/signed/platform::microsoft
      - id: metadata/vendor/identity::microsoft-corp-versioninfo
