---
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: xor-installer-url-flags-download-api
  desc: Encoded installer URL, flags and download API
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/download/url::xor-decoded-executable-url
  - id: micro-behaviors/os/package-manager/config::xor-decoded-silent-installer-flags
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
  any:
  - id: micro-behaviors/fs/delete/file/self::comspec-shortpath-self-delete-profile
  - id: micro-behaviors/os/registry/autostart/reference::run-or-runonce-key-reference
  needs: 1
