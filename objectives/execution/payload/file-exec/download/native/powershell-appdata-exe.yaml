defaults:
  platforms: [windows]
  for: [powershell, batch]

composite_rules:
- id: powershell-appdata-download-invoke-item-cluster
  desc: Downloads an AppData executable and invokes it
  crit: notable
  conf: 0.98
  near_bytes: 8192
  all:
  - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
  - id: micro-behaviors/os/handler/open::powershell-invoke-item
  any:
  - id: micro-behaviors/communications/http/download/cli/web-cmdlet::iwr-outfile-download
  - id: micro-behaviors/communications/http/download/cli/web-cmdlet::powershell-restmethod-outfile
