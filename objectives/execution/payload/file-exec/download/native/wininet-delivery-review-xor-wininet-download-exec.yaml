defaults:
  platforms: [unix, windows]
  for: [pe, dll]
  attack: T1105
  mbc: E1105

composite_rules:
  - id: xor-wininet-download-exec
    crit: hostile
    desc: XOR HTTP download with launch API
    conf: 0.98
    attack: T1105,T1027.002
    platforms:
      - windows
    size_max: 524288
    all:
      - id: micro-behaviors/communications/http/download/url::xor-decoded-download-url
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-http-api
    any:
      - id: micro-behaviors/process/create/subprocess/reference::create-process-a-api-reference
      - id: micro-behaviors/process/create/native-symbol::create-process-w
      - id: micro-behaviors/os/handler/open::shell-execute
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-shellexec-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-createprocess-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-exec-api
      - id: micro-behaviors/dylib/lookup::encoded-shellexecute-name
    unless:
      - id: metadata/installer/product/
