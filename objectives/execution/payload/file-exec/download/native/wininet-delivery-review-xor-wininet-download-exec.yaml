defaults:
  platforms: [unix, windows]
  for: [pe, dll]
  attack: T1105
  mbc: E1105

composite_rules:
  - id: xor-wininet-download-exec
    crit: hostile
    desc: XOR HTTP and process-launch clues
    conf: 0.98
    attack: T1105,T1059.003,T1027.002
    platforms:
      - windows
    size_max: 524288
    all:
      - id: micro-behaviors/communications/url/host/domain-http::xor-decoded-http-url
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-http-api
    any:
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/os/handler/open::shell-execute
    unless:
      - id: metadata/installer/product/
