defaults:
  platforms: [windows]
  for: [pe, go]
  attack: T1105

composite_rules:
  - id: go-http-zip-extract-exec
    desc: Go fetches remote ZIP, extracts and executes
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/get::go-http-get-any
      - id: micro-behaviors/communications/http/download/url::archive-url-reference-binary
      - id: micro-behaviors/data/archive/zip::go-zip-reader-any
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-any
    unless:
      - id: micro-behaviors/communications/http/download/url::github-source-archive-url
      - id: micro-behaviors/communications/url/external/github::github-archive-ref-download
      - id: metadata/signature/verified/

  - id: go-elevated-http-zip-stage-exec
    desc: Go self-elevates via RunAs to stage remote ZIP
    crit: hostile
    conf: 0.98
    attack: T1105,T1548.002
    all:
      - id: go-http-zip-extract-exec
      - id: micro-behaviors/process/create/cmdlet::powershell-uac-start-process-any
      - id: micro-behaviors/fs/directory/create::go-mkdirall-any
    unless:
      - id: metadata/signature/verified/
