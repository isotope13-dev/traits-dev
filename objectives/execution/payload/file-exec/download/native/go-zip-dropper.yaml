defaults:
  platforms: [windows]
  for: [pe, go]

composite_rules:
  - id: go-elevated-http-zip-stage-exec
    desc: Go self-elevates via RunAs to stage remote ZIP
    crit: hostile
    conf: 0.98
    attack: T1105,T1548.002
    all:
      - id: micro-behaviors/data/archive/extract/capability::go-http-zip-subprocess-cooccurrence
      - id: micro-behaviors/process/create/cmdlet::powershell-uac-start-process-any
      - id: micro-behaviors/fs/directory/create::go-mkdirall-any
    unless:
      - id: metadata/signature/verified/
