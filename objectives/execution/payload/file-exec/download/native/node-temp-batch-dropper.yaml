defaults:
  platforms:
  - windows
  for:
  - javascript
  attack: T1105,T1059.003,T1070.004
traits:
- id: node-timestamped-temp-batch
  desc: Creates timestamped temporary batch file
  crit: notable
  if:
    type: text
    substr: path.join(this.workDir, `svc_${Date.now()}.bat`)
- id: node-hidden-batch-call
  desc: Invokes downloaded batch file
  crit: notable
  if:
    type: text
    substr: exec(`call ${servicePath}`
- id: node-remove-batch-file
  desc: Removes temporary batch file
  crit: notable
  if:
    type: text
    substr: fs.unlinkSync(servicePath)
composite_rules:
- id: node-juvenile-temp-batch-dropper
  desc: Attempts to download execute and remove a batch file
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/communications/url/path::juvenile-program-endpoint
  - id: node-timestamped-temp-batch
  - id: node-hidden-batch-call
  - id: node-remove-batch-file
