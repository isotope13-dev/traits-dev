defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1105
  crit: suspicious

composite_rules:
- id: node-fetch-chmod-exec-stealth-dropper
  desc: Node file fetch, chmod and detached run clues
  conf: 0.95
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
  - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
  - id: micro-behaviors/process/stdio/configure::child-output-ignored-option
  any:
  - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
  - id: micro-behaviors/process/lifecycle/respawn::node-self-respawn
  needs: 1
  unless:
  - id: micro-behaviors/communications/url/external/github::foreground-github-release-launch
- id: node-fetch-writefile-chmod-execfile-stealth-dropper
  desc: Node fetch, write, chmod and hidden exec clues
  conf: 0.98
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync
  - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
  - id: micro-behaviors/process/create/exec::js-execfile-call
  - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
  - id: micro-behaviors/process/stdio/configure::child-output-ignored-option
- id: node-fetch-promise-chmod-execfile-stealth-dropper
  desc: Node fetch, chmod and hidden execFile clues
  conf: 0.96
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/fs/write/file/content::node-write-file-promise-destructured
  - id: micro-behaviors/fs/chmod/modify::node-chmod-call
  - id: micro-behaviors/process/create/exec::js-execfile-call
  - id: micro-behaviors/process/daemonize/detach::detached-true
  - id: micro-behaviors/process/stdio/configure::child-stdio-ignore-option
  - id: micro-behaviors/process/stdio/configure::child-output-ignored-option
- id: node-fetch-writefile-chmod-detached-spawn
  desc: Node response write, chmod and detached spawn
  conf: 0.99
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
  - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
  - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
  - id: micro-behaviors/process/stdio/configure::child-output-ignored-option
  unless:
  - id: micro-behaviors/communications/url/external/github::foreground-github-release-launch
