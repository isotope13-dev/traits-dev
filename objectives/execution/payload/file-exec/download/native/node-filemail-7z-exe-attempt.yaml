defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1105,T1059.001,T1027.013

traits:
  - id: node-filemail-filekey-download
    desc: References Filemail keyed download endpoint
    crit: notable
    if:
      type: text
      substr: 'https://3005.filemail.com/api/file/get?filekey='
  - id: node-infected-7z-extract
    desc: Attempts passworded 7-Zip extraction
    crit: notable
    if:
      type: text
      substr: "['x','-pinfected','-y',a,`-o${t}`]"
  - id: node-hidden-powershell-start-exe
    desc: Starts extracted executable through PowerShell
    crit: notable
    if:
      type: text
      substr: "['-NoProfile','-WindowStyle','Hidden','-Command',`Start-Process"
  - id: node-exe-output-directory-attempt
    desc: Uses extractor path as output directory
    crit: notable
    if:
      type: text
      substr: 'const b=e(x.p,z)'

composite_rules:
  - id: node-filemail-passworded-7z-exe-attempt
    desc: Attempts hidden launch from downloaded archive
    crit: hostile
    conf: 0.99
    all:
      - id: node-filemail-filekey-download
      - id: node-infected-7z-extract
      - id: node-hidden-powershell-start-exe
      - id: node-exe-output-directory-attempt
