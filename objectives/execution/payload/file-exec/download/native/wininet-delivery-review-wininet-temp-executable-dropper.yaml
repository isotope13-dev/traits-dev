defaults:
  platforms: [unix, windows]
  for: [pe, dll]
  attack: T1105
  mbc: E1105

composite_rules:
  - id: wininet-temp-executable-dropper
    crit: hostile
    desc: WinINet, executable URL and temp launch clues
    conf: 0.97
    platforms:
      - windows
    size_max: 65536
    all:
      - id: micro-behaviors/communications/http/client/wininet::wininet-session-request-api-set
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-import
      - id: metadata/binary/symbols/name/process::create-process-a
    unless:
      - id: metadata/installer/product/
