defaults:
  for: [oledoc]
  platforms: [windows]
  crit: notable

traits:
  - id: encoded-managed-pe-header
    desc: Encoded PE header
    if:
      type: raw
      regex: '^TVqQ'
  - id: encoded-discord-attachment-wide
    desc: Encoded wide Discord domain
    if:
      type: raw
      regex: 'AHMAYwBvAHIAZABhAHAAcAAuAGMA|aQBzAGMAbwByAGQAYQBwAHAALgBj|AGkAcwBjAG8AcgBkAGEAcABwAC4A'
  - id: encoded-http-response-stream
    desc: Encoded response stream API name
    if:
      type: raw
      regex: 'UmVzcG9uc2VTdHJl|dFJlc3BvbnNlU3Ry|ZXRSZXNwb25zZVN0cmVh'
  - id: encoded-gzip-stream
    desc: Encoded GZip stream API name
    if:
      type: raw
      regex: 'cFN0cmVh|aXBTdHJl|WmlwU3Ry'
  - id: encoded-reflective-member
    desc: Encoded reflective member API name
    if:
      type: raw
      regex: 'b2tlTWVtYm|dm9rZU1lbWJl|bnZva2VNZW1iZ'

composite_rules:
  - id: encoded-discord-managed-loader
    desc: Encoded managed Discord assembly loader
    crit: hostile
    conf: 0.97
    attack: T1027,T1105,T1620
    all:
      - id: encoded-managed-pe-header
      - id: encoded-discord-attachment-wide
      - id: encoded-http-response-stream
      - id: encoded-gzip-stream
      - id: encoded-reflective-member
