defaults:
  for: [oledoc, text]
  platforms: [windows]
  attack: T1027,T1105,T1620

traits:
  - id: base64-managed-discord-reflective-loader
    desc: Encoded managed Discord assembly loader
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule base64_managed_discord_reflective_loader {
          strings:
            $mz = "TVqQ"
            $cdn0 = "AHQAcABzADoALwAvAGMAZABuAC4AZABpAHMAYwBvAHIAZABhAHAAcAAuAGMAbwBtAC8AYQB0AHQAYQBjAGgAbQBlAG4AdABz"
            $cdn1 = "dAB0AHAAcwA6AC8ALwBjAGQAbgAuAGQAaQBzAGMAbwByAGQAYQBwAHAALgBjAG8AbQAvAGEAdAB0AGEAYwBoAG0AZQBuAHQAcwAv"
            $cdn2 = "AHQAdABwAHMAOgAvAC8AYwBkAG4ALgBkAGkAcwBjAG8AcgBkAGEAcABwAC4AYwBvAG0ALwBhAHQAdABhAGMAaABtAGUAbgB0AHMA"
            $response = "GetResponseStream" base64
            $gzip = "GZipStream" base64
            $invoke = "InvokeMember" base64
            $types = "GetTypes" base64
          condition:
            $mz and 1 of ($cdn*) and all of ($response, $gzip, $invoke, $types)
        }
