defaults:
  for: [pe]
  platforms: [windows]
  attack: T1105,T1059.001

composite_rules:
  - id: dotnet-doh-executable-hidden-shell
    desc: Managed downloader combines DoH and hidden shell
    crit: suspicious
    conf: 0.97
    scope: file
    all:
      - id: objectives/execution/staging/transfer::managed-http-hidden-shell-api-profile
      - id: micro-behaviors/communications/http/client/managed::httpclient-get-temp-launch-references
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe
      - id: micro-behaviors/communications/dns/doh::doh-google-json
  - id: dotnet-doh-executable-shell-launch
    desc: Managed downloader combines DoH and shell launch
    crit: suspicious
    conf: 0.94
    scope: file
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/communications/dns/doh::doh-google-json
      - id: micro-behaviors/communications/http/get::getasync
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start-call
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
    unless:
      - id: dotnet-doh-executable-hidden-shell
