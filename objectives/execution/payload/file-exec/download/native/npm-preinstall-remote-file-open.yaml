defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: npm-preinstall-hook-remote-file-opener-dropper
    desc: npm preinstall hook runs concealed remote file opener
    crit: hostile
    conf: 0.995
    attack: "T1027,T1059.007,T1105"
    for: [javascript, typescript, package.json, npm]
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
      - id: micro-behaviors/communications/http/request/computed::js-computed-http-object-call
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/process/argument/executable::string-table-cross-platform-file-openers
      - id: micro-behaviors/fs/path/extension::js-executable-filename-literal
      - id:
          objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
