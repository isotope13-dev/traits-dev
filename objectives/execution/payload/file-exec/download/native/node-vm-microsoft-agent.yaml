defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1027,T1105,T1036

traits:
  - id: node-vm-platform-agent-bytecode
    desc: VM bytecode updates and launches agent
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((string (string_fragment) @bytecode)
          (#match? @bytecode "b3JtCAItCAhhcmNoCBhET1dOTE9BRF9NQVAICndpbjMy")
          (#match? @bytecode "FnZlcnNpb24udHh0CB5CSU5BUllfQkFTRV9VUkwIGC92ZXJzaW9u")
          (#match? @bytecode "cmVjdXJzaXZlCAIvCBhkb3dubG9hZEZpbGUIDGxlbmd0aAZA")
          (#match? @bytecode "cml0ZUZpbGVTeW5jCBJjaG1vZFN5bmMF7QEIDi0tYWdl")
          (#match? @bytecode "aGlsZF9wcm9jZXNzCApzcGF3bgQDCAp1bnJlZoIF"))
  - id: node-vm-platform-agent-wrapper
    desc: VM wrapper configures Microsoft-named agent
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((program
          (variable_declaration (variable_declarator name: (identifier) @stem value: (string (string_fragment) @stem_value)))
          (variable_declaration (variable_declarator name: (identifier) @base value: (string (string_fragment) @base_value)))
          (variable_declaration (variable_declarator name: (identifier) @map value: (object
            (pair key: (string (string_fragment) @platform) value: (string (string_fragment) @binary)))))
          (function_declaration name: (identifier) @main body: (statement_block
            (return_statement (call_expression function: (identifier) @dispatch))))
          (expression_statement (call_expression function: (subscript_expression
            object: (call_expression function: (subscript_expression
              object: (call_expression function: (identifier) @main_use)
              index: (string (string_fragment) @catch)))
            index: (string (string_fragment) @finally)))))
          (#eq? @stem "UNIT_STEM")
          (#eq? @stem_value "MicrosoftSystem64")
          (#eq? @base "BINARY_BASE_URL")
          (#match? @base_value "^https?://")
          (#eq? @map "DOWNLOAD_MAP")
          (#eq? @platform "win32-x64")
          (#eq? @binary "MicrosoftSystem64-win.exe")
          (#eq? @main @main_use)
          (#eq? @catch "catch")
          (#eq? @finally "finally")
          (#match? @dispatch "^vmn_[0-9a-f]+$"))

composite_rules:
  - id: node-vm-platform-agent-installer
    desc: VM bytecode configures agent installer
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: node-vm-platform-agent-bytecode
      - id: node-vm-platform-agent-wrapper
  - id: npm-vm-platform-agent-install
    desc: Install hook runs VM agent installer
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: node-vm-platform-agent-installer
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
