defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105
  mbc: E1105


composite_rules:
- id: payload-download-execute-log-clues
  desc: Payload download and execution log clues
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/lang/natural/payload-status::payload-worker-download-log
  - id: metadata/lang/natural/payload-status::download-payload-url-log
  - id: metadata/lang/natural/payload-status::execute-payload-command-log
  any:
  - id: metadata/lang/natural/payload-status::serverxmlhttp-download-success-log
  - id: metadata/lang/natural/payload-status::urlmon-download-success-log
  - id: micro-behaviors/communications/http/client/xmlhttp::http-client-msxml-serverxmlhttp-progid
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
  unless:
  - id: metadata/installer/product/
