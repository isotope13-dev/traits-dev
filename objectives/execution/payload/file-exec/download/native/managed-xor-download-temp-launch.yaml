# Managed PE that decodes its strings, downloads bytes to temp, and launches them.
# Each leg is a reviewed notable composite; neither alone proves a dropper.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105,T1027

composite_rules:
  - id: managed-xor-decoded-download-temp-launch
    desc: Managed XOR-decoded downloader launches saved temp EXE
    crit: hostile
    conf: 0.93
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/managed::httpclient-get-temp-launch-references
      - id: micro-behaviors/data/codec::managed-byte-xor-with-base64-api-references
  # GitHub-hosted payload fetched to temp and launched; benign updaters can match.
  # Squirrel.Windows updaters fetch from GitHub to temp and launch their own
  # Update.exe, so that shared context lowers the finding to notable.
  - id: managed-github-download-temp-launch
    desc: Managed GitHub API download saved to temp and launched
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/managed::httpclient-get-temp-launch-references
      - id: micro-behaviors/communications/http/services/github/client::github-api-host
    downgrade:
      any:
      - id: metadata/installer/builder/squirrel-windows::squirrel-updater-context
