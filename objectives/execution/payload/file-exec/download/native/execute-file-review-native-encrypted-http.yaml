defaults:
  platforms: [linux]
  for: [elf]
  attack: "T1105,T1059.004"
  mbc: B0024



composite_rules:
  - id: native-chacha-http-exec-clues
    desc: Native ChaCha, HTTP and execution clues
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/crypto/symmetric/stream/sigma::compact-opaque-sigma-rodata-profile
      - id: micro-behaviors/communications/http/header/content-length::content-length-header
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/socket/connect/attempt::connect-symbol
      - id: micro-behaviors/fs/write/file/handle/unspecified::write--fwrite
      - id: micro-behaviors/fs/chmod/modify::chmod-symbol
      - id: micro-behaviors/process/replace::c-exec-variants
      - id: micro-behaviors/fs/delete/path::native-remove-api-or-call-clues
