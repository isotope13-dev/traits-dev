# Shortcut-argument download-then-execute chains.
#
# `script-host/` above holds download-and-run evidence inside PowerShell and
# other script files. This leaf is the same payload chain when the whole
# fetch-save-invoke sequence is embedded in Windows shortcut (.lnk)
# arguments: the shortcut is the dropper. Legitimate shortcuts launch local
# targets; none fetch a payload to disk and immediately invoke it.
defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1105,T1059.001,T1204.002

composite_rules:
  # PowerShell fetch cmdlet + -OutFile (response written to a file) + an
  # invocation of a variable path in the same argument string. Each leg is
  # listed separately, so junk padding or argument reordering cannot split
  # the observation. Every leg is content-derived; nothing here keys on a
  # shortcut name, icon, or size.
  - id: lnk-fetch-outfile-invoke
    desc: Shortcut fetches a file then runs it
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::kv-powershell-download-command
      - id: micro-behaviors/process/argument/file::kv-outfile-option
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::lnk-arg-powershell-variable-call
      - id: micro-behaviors/process/create/cmdlet::lnk-start-process-command
