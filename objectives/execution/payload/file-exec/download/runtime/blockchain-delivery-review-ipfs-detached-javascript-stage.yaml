defaults:
  platforms: [windows, unix]
  for: [javascript, python, shell]


composite_rules:
- id: ipfs-detached-javascript-stage
  desc: Downloads an IPFS JavaScript stage and launches it detached
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.007,T1564.003
  mbc: B0024,F0011
  for:
    - javascript
    - typescript
  near_bytes: 6000
  all:
    - id: micro-behaviors/communications/http/services/ipfs::ipfs-gateway
    - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
    - id: micro-behaviors/process/interpreter/node::node-interpreter-target
    - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
