---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1105
  mbc: E1105
traits:
- id: python-install-hook-carves-and-runs-platform-gated-payload
  desc: Install hook carves and runs gated payload
  crit: hostile
  conf: 0.99
  attack: T1140,T1059.006,T1195.002
  if:
    type: yara
    source: |
      rule python_install_hook_carves_and_runs_platform_gated_payload {
        strings:
          $s0 = /subprocess\.check_output/s
          $s1 = /(IOPlatformUUID|SU9QbGF0Zm9ybVVVSUQ=)/s
          $s2 = /uuid\s+in\s*\[/s
          $s3 = /dest_dir/s
          $s4 = /content\[\d+:\]/s
          $s5 = /subprocess\.Popen/s
        condition:
          (for any i0 in (1..#s0) : (for any i1 in (1..#s1) : (@s1[i1] >= @s0[i0] + !s0[i0] and @s1[i1] <= @s0[i0] + !s0[i0] + 600 and (for any i2 in (1..#s2) : (@s2[i2] >= @s1[i1] + !s1[i1] and @s2[i2] <= @s1[i1] + !s1[i1] + 500 and (for any i3 in (1..#s3) : (@s3[i3] >= @s2[i2] + !s2[i2] and @s3[i3] <= @s2[i2] + !s2[i2] + 300 and (for any i4 in (1..#s4) : (@s4[i4] >= @s3[i3] + !s3[i3] and @s4[i4] <= @s3[i3] + !s3[i3] + 500 and (for any i5 in (1..#s5) : (@s5[i5] >= @s4[i4] + !s4[i4] and @s5[i5] <= @s4[i4] + !s4[i4] + 300 and (true))))))))))))
      }
- id: python-install-downloads-and-runs-raw-github-script
  desc: Runs raw GitHub Python from install hook
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.006,T1195.002
  if:
    type: yara
    source: |
      rule python_install_downloads_and_runs_raw_github_script {
        strings:
          $s0 = /class\s+\w+\s*\(\s*install\s*\)/s
          $s1 = /def\s+run\s*\(/s
          $s2 = /raw\.githubusercontent\.com\/[A-Za-z0-9._\/-]{1,120}\.py/s
          $s3 = /requests\.get\s*\(/s
          $s4 = /open\s*\([^)]{0,100}wb[^)]{0,100}\)/s
          $s5 = /\.write\s*\(\w+\.content\)/s
          $s6 = /subprocess\.(call|run|Popen)\s*\([^)]{0,80}python\s+[A-Za-z0-9._\/-]+\.py/s
        condition:
          (for any i0 in (1..#s0) : (for any i1 in (1..#s1) : (@s1[i1] >= @s0[i0] + !s0[i0] and @s1[i1] <= @s0[i0] + !s0[i0] + 1200 and (for any i2 in (1..#s2) : (@s2[i2] >= @s1[i1] + !s1[i1] and @s2[i2] <= @s1[i1] + !s1[i1] + 700 and (for any i3 in (1..#s3) : (@s3[i3] >= @s2[i2] + !s2[i2] and @s3[i3] <= @s2[i2] + !s2[i2] + 300 and (for any i4 in (1..#s4) : (@s4[i4] >= @s3[i3] + !s3[i3] and @s4[i4] <= @s3[i3] + !s3[i3] + 120 and (for any i5 in (1..#s5) : (@s5[i5] >= @s4[i4] + !s4[i4] and @s5[i5] <= @s4[i4] + !s4[i4] + 300 and (for any i6 in (1..#s6) : (@s6[i6] >= @s5[i5] + !s5[i5] and @s6[i6] <= @s5[i5] + !s5[i5] + 300 and (true))))))))))))))
      }
- id: python-ioplatformuuid-target-gate
  desc: Filters victim macOS IOPlatformUUID list
  crit: suspicious
  conf: 0.97
  attack: T1480.001
  if:
    type: text
    regex: '(?s)(IOPlatformUUID|SU9QbGF0Zm9ybVVVSUQ=).{0,260}\buuid\s+in\s*\['
- id: python-carves-binary-tail-and-spawns
  desc: Writes carved byte slice and spawns Popen
  crit: suspicious
  conf: 0.97
  attack: T1140,T1059.006
  if:
    type: text
    regex: '(?s)\.write\(\s*\w+\[\d+:\]\s*\).{0,200}subprocess\.Popen\('
- id: raw-github-python-script-url
  desc: References raw GitHub Python script URL
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'raw\.githubusercontent\.com/[\w./-]{1,120}\.py\b'
- id: python-subprocess-runs-local-py-script
  desc: Runs local Python script via subprocess
  crit: notable
  conf: 0.92
  attack: T1059.006
  if:
    type: text
    regex: 'subprocess\.(call|run|Popen)\s*\([^)\n]{0,80}\bpython3?\s+[\w./-]+\.py'


