defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  attack: T1105
  mbc: E1105

traits:
  - id: python-ioplatformuuid-target-gate
    desc: Filters victim macOS IOPlatformUUID list
    crit: suspicious
    conf: 0.97
    attack: T1480.001
    if:
      type: text
      regex: '(?s)(IOPlatformUUID|SU9QbGF0Zm9ybVVVSUQ=).{0,260}\buuid\s+in\s*\['
  - id: python-carves-binary-tail-and-spawns
    desc: Writes carved byte slice and spawns Popen
    crit: suspicious
    conf: 0.97
    attack: T1140,T1059.006
    if:
      type: text
      regex: '(?s)\.write\(\s*\w+\[\d+:\]\s*\).{0,200}subprocess\.Popen\('
  - id: raw-github-python-script-url
    desc: References raw GitHub Python script URL
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'raw\.githubusercontent\.com/[\w./-]{1,120}\.py\b'
  - id: python-subprocess-runs-local-py-script
    desc: Runs local Python script via subprocess
    crit: notable
    conf: 0.92
    attack: T1059.006
    if:
      type: text
      regex: 'subprocess\.(call|run|Popen)\s*\([^)\n]{0,80}\bpython3?\s+[\w./-]+\.py'


composite_rules:
  - id: python-install-hook-platform-gated-binary-tail-execution
    desc: Install hook extracts and runs an embedded binary for selected hosts
    crit: hostile
    conf: 0.99
    attack: T1140,T1059.006,T1195.002
    scope: file
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: python-ioplatformuuid-target-gate
      - id: python-carves-binary-tail-and-spawns
  - id: python-install-hook-runs-downloaded-github-script
    desc: Install hook downloads and executes a raw GitHub Python script
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.006,T1195.002
    scope: file
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: raw-github-python-script-url
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/communications/http/client/response-body::python-response-body-member-reference
      - id: micro-behaviors/fs/write/user-paths::python-file-write-alternative
      - id: python-subprocess-runs-local-py-script

  - id: python-install-hook-download-winexec
    desc: Install hook downloads and executes Windows program
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.006,T1195.002
    scope: file
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/communications/http/client/response-body::python-response-body-member-reference
      - id: metadata/lang/source/naming/interface/execution::python-ctypes-win32-exec
  - id: python-http-executable-download-and-execute
    desc: Python downloads executable over HTTP and executes child process
    crit: hostile
    conf: 0.97
    attack: T1105,T1059.006
    all:
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
      - id: micro-behaviors/communications/http/client/exchange::python-http-request-file-write
    any:
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
      - id: micro-behaviors/os/handler/open::os-startfile-call
      - id: micro-behaviors/process/create/subprocess/launch::run-ast
  - id: python-http-temp-exe-popen
    desc: Python HTTP, temp EXE and Popen clues
    crit: hostile
    conf: 0.96
    attack: T1105,T1059.006
    near_lines: 30
    all:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/fs/temp/directory::python-tempdir-exe
    any:
      - id: micro-behaviors/process/create/subprocess/launch::popen-content
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
  - id: python-requested-urlretrieve-execute
    desc: Runs executable fetched from API-provided URL
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.006
    scope: archive
    for: [python, python_sdist, whl, zip, tar]
    near_lines: 80
    all:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/communications/http/download/helper::urlretrieve-call-near-process-launch
      - id: micro-behaviors/process/deploy/file-exec/spawn::python-urlretrieve-same-path-argv
  - id: python-githubusercontent-exe-retrieve-run
    desc: Python GitHub EXE retrieve and process clues
    crit: hostile
    conf: 0.98
    all:
      - id: well-known/app/development/code-forge/github::githubusercontent-executable-url
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
    any:
      - id: micro-behaviors/process/create/exec::python-subprocess-run-call-text
      - id: micro-behaviors/process/create/subprocess/launch::popen-content
  - id: python-import-powershell-github-exe-fetch-run
    desc: Import-time PowerShell fetches and starts a GitHub-hosted executable
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.001,T1059.006,T1195.002
    scope: archive
    for: [python, python_sdist, whl, zip, tar]
    all:
      - id: well-known/app/development/code-forge/github::githubusercontent-executable-url
      - id: micro-behaviors/communications/http/download/cli/curl-wget::fetch-output-option-script
      - id: micro-behaviors/process/deploy/interpreter-command::python-powershell-command-argv
      - id: micro-behaviors/process/create/subprocess/launch::run-ast
  - id: pyproject-download-table-process-clues
    desc: Pyproject download table and process clues
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1105
    scope: archive
    for:
      - python
      - pyproject.toml
      - python-sdist
      - whl
    all:
      - id: metadata/package/config/tooling::pyproject-downloader-table
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
    any:
      - id: micro-behaviors/process/create/subprocess/launch::run-ast
      - id: micro-behaviors/process/create/exec::python-subprocess-run-call-text
    needs: 1
  - id: python-get-write-pythonw
    desc: Python HTTP, response write and pythonw clues
    crit: hostile
    conf: 0.97
    attack: T1105,T1059.006
    scope: file
    near_lines: 10
  # The write leg is what makes this a dropper: requests.get plus a pythonw
  # relaunch alone is any Windows-aware Python app that calls an API.
    all:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/os/application/target/development::pythonw-executable-reference
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
    any:
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-content
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-text
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-body-path
  - id: python-get-write-shell-launch
    desc: Python HTTP response write and shell execution clues
    crit: hostile
    conf: 0.97
    attack: T1105,T1059.006
    scope: file
    near_lines: 15
    all:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system-string-command
    any:
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-content
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-text
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-body-path
  - id: python-pythonw-fetch-startupinfo-clues
    desc: Pythonw fetch and startup configuration clues
    crit: hostile
    conf: 0.97
    attack: T1105,T1564.003
    near_lines: 4
    all:
      - id: objectives/execution/payload/file-exec/download/runtime::python-get-write-pythonw
      - id: micro-behaviors/process/config/launch::creationflags
      - id: micro-behaviors/process/config/launch::startupinfo
