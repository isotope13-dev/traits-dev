defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  attack: T1105
  mbc: E1105


composite_rules:
  - id: python-http-temp-exe-popen
    desc: Python HTTP, temp EXE and Popen clues
    crit: hostile
    conf: 0.96
    attack: T1105,T1059.006
    near_lines: 30
    all:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/fs/temp/directory::python-tempdir-exe
    any:
      - id: micro-behaviors/process/create/subprocess/launch::popen-content
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
  - id: python-githubusercontent-exe-retrieve-run
    desc: Python GitHub EXE retrieve and process clues
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/url/github::githubusercontent-executable-url
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
    any:
      - id: micro-behaviors/process/create/subprocess/launch::run-content
      - id: micro-behaviors/process/create/subprocess/launch::popen-content
  - id: pyproject-download-table-process-clues
    desc: Pyproject download table and process clues
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1105
    scope: archive
    for:
      - python
      - pyproject.toml
      - python-sdist
      - whl
    all:
      - id: metadata/package/config/tooling::pyproject-downloader-table
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
    any:
      - id: micro-behaviors/process/create/subprocess/launch::run-ast
      - id: micro-behaviors/process/create/subprocess/launch::run-content
    needs: 1
  - id: python-get-write-pythonw
    desc: Python HTTP, response write and pythonw clues
    crit: hostile
    conf: 0.97
    attack: T1105,T1059.006
    scope: file
    near_lines: 10
  # The write leg is what makes this a dropper: requests.get plus a pythonw
  # relaunch alone is any Windows-aware Python app that calls an API.
    all:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/os/application/target/development::pythonw-executable-reference
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
    any:
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-content
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-text
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-body-path
  - id: python-pythonw-fetch-startupinfo-clues
    desc: Pythonw fetch and startup configuration clues
    crit: hostile
    conf: 0.97
    attack: T1105,T1564.003
    near_lines: 4
    all:
      - id: objectives/execution/payload/file-exec/download/runtime::python-get-write-pythonw
      - id: micro-behaviors/process/config/launch::creationflags
      - id: micro-behaviors/process/config/launch::startupinfo
