defaults:
  platforms: [windows, unix]
composite_rules:
- id: obfuscated-bun-release-sidecar-loader
  desc: Obfuscated Bun download and sidecar execution clues
  crit: hostile
  conf: 0.98
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/communications/http/download/github::bun-release-archive-url
  - id: micro-behaviors/communications/http/request/dynamic::node-http-response-pipe
  - id: micro-behaviors/process/create/variable::js-execfile-computed-program
  - id: micro-behaviors/fs/path/script::named-javascript-sidecar-reference
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
  unless:
  - id: well-known/tool/detection/threat-intel/
- id: bun-release-temp-exec-clues
  desc: Bun release, temp directory and execution clues
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/communications/url/reference::runtime-release-archive-reference
  - id: micro-behaviors/fs/temp/directory::node-mkdtemp-os-tmpdir
  - id: micro-behaviors/process/create/variable::js-execfilesync-resolved-program
  any:
  - id: micro-behaviors/fs/chmod/modify::node-chmod
  - id: micro-behaviors/data/archive/extract/zip::unzip-tool-reference
  - id: micro-behaviors/fs/delete/directory::fs-rm-recursive
  unless:
  - id: well-known/app/development/cloudflare/
  - id: metadata/build/ecosystem::verified-runtime-release-download-script-context
- id: cap-style-bun-execution-loader
  desc: Bun loader launches execution.js payload
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/execution/payload/file-exec/download/runtime::bun-release-temp-exec-clues
  - id: micro-behaviors/fs/path/script::bun-execution-js-sidecar
  any:
  - id: micro-behaviors/fs/delete/directory::fs-rm-recursive
  - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
  unless:
  - id: well-known/app/development/cloudflare/
# Opaque co-shipped payload (Math_Symbol.js / execution.js) joined via path.join
# and handed to the downloaded Bun binary — install-time dropper class.
- id: bun-opaque-payload-temp-runtime-loader
  desc: Temp Bun runtime launches named sidecar
  crit: suspicious
  conf: 0.98
  all:
  - id: objectives/execution/payload/file-exec/download/runtime::bun-release-temp-exec-clues
  - id: micro-behaviors/fs/path/construct::named-sidecar-path-or-launch
  any:
  - id: micro-behaviors/fs/delete/directory::fs-rm-recursive
  - id: micro-behaviors/process/exit/handler::promise-both-paths-exit-zero
  - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
  unless:
  - id: well-known/app/development/cloudflare/
- id: bun-silent-temp-runtime-loader
  desc: Temp runtime loader hides failures
  crit: hostile
  conf: 0.97
  all:
  - id: objectives/execution/payload/file-exec/download/runtime::bun-release-temp-exec-clues
  - id: micro-behaviors/process/exit/handler::promise-both-paths-exit-zero
  unless:
  - id: well-known/app/development/cloudflare/
