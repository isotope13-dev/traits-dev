defaults:
  platforms:
  - unix
  for:
  - package.json
  attack: T1195.002,T1105,T1059.004
traits:
- id: npm-preinstall-download-chmod-nohup
  desc: Preinstall downloads and launches with nohup
  crit: hostile
  conf: 0.995
  if:
    type: value
    path: scripts.preinstall
    regex: ^\s*curl\b.{0,180}https?://.{0,180}&&\s*chmod\s+(777|\+x).{0,120}&&\s*nohup\s+/tmp/
  unless:
  - id: metadata/package/scripts/reference::reserved-docs-domain-npm-script
