defaults:
  platforms:
  - windows
  for:
  - python
  attack: T1105
  mbc: B0023

composite_rules:
- id: python-configured-binary-stager
  desc: Python package fetches and launches a configured binary stage
  crit: hostile
  conf: 0.99
  for:
  - whl
  - python-sdist
  - python
  scope: archive
  attack: T1195.002,T1105,T1059.006
  all:
  - id: micro-behaviors/communications/url/reference::python-remote-asset-url-config
  - id: metadata/lang/source/naming/function/communication::python-binary-fetch-helper
  - id: micro-behaviors/communications/http/client/response-body::urlopen-response-body-read
  - id: micro-behaviors/communications/tls/verify/disable::tls-validation-fully-disabled
  - id: micro-behaviors/fs/file/open/write::python-method-open-write-binary
  - id: micro-behaviors/fs/temp/mktemp::tempfile-mkdtemp
  - id: micro-behaviors/process/create/subprocess/launch::run-ast
  - id: micro-behaviors/process/create/subprocess/launch::popen-ast
  - id: micro-behaviors/process/config/launch::combined-creationflags
  - id: metadata/lang/source/naming/function/command::python-detached-helper-launch
- id: python-downloader-clears-event-logs
  desc: Python package downloads a stage and clears Windows event logs
  crit: hostile
  conf: 0.99
  for:
  - whl
  - python-sdist
  - python
  scope: archive
  attack: T1195.002,T1105,T1070.001
  all:
  - id: micro-behaviors/communications/url/reference::python-remote-asset-url-config
  - id: metadata/lang/source/naming/function/communication::python-binary-fetch-helper
  - id: micro-behaviors/communications/http/client/response-body::urlopen-response-body-read
  - id: micro-behaviors/fs/file/open/write::python-method-open-write-binary
  - id: micro-behaviors/process/create/subprocess/launch::run-ast
  - id: micro-behaviors/process/config/launch::creationflags
  - id: objectives/evasion/indicator-removal/logs::python-eventlog-clear-argv
- id: python-import-time-configured-binary-stager
  desc: Import triggers remote binary staging
  crit: hostile
  conf: 0.99
  for:
  - whl
  - python-sdist
  - python
  scope: archive
  attack: T1195.002,T1105,T1059.006
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
  - id: objectives/execution/payload/file-exec/download/runtime::python-configured-binary-stager
