defaults:
  platforms: [unix, windows]
composite_rules:
  - id: node-download-interpreter-launch-cooccurrence
    desc: Node code has download and interpreter-launch paths
    crit: notable
    conf: 0.84
    attack: "T1105,T1059"
    platforms: [linux, macos, windows, unix, android, ios]
    for: [javascript, typescript]
    near_lines: 320
    all:
      - id: micro-behaviors/process/create/shell/interpreter::node-script-interpreter-launch
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
