defaults:
  platforms: [unix, windows]
  attack: T1195.002, T1105, T1059

# An npm install hook that streams an executable from a literal external IP
# over plain HTTP, marks it executable, and runs it. The checksum shipped in
# the same package does not change the behaviour: the install runs a native
# payload that no reviewer has seen. Each leg is a generic micro-behaviour;
# the raw-IP HTTP URL is the discriminator that keeps ordinary postinstall
# binary fetchers (named hosts over HTTPS) out of this composite.
traits:
  # Download helpers that wrap the response in a retry, redirect or header
  # object put the write stream and the pipe far apart; the sibling
  # node-http-stream-to-file window (500 chars) misses them.
  - id: node-response-written-to-file
    # Any stream piped into it (a local file copy too); the dropper composite
    # supplies the HTTP response.
    desc: Write stream opened before a pipe call
    crit: notable
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: 'createWriteStream\s*\([^)]{1,120}\)[\s\S]{0,900}\.pipe\s*\('

composite_rules:
  - id: install-script-raw-ip-binary-dropper
    desc: Install hook fetches and runs a binary from plaintext IP
    crit: hostile
    conf: 0.95
    scope: package
    for: [npm, javascript, package.json]
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: objectives/execution/payload/file-exec/download/runtime::node-response-written-to-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
      - id: micro-behaviors/process/create/exec::node-spawnsync-call
      - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
