defaults:
  platforms: [unix, windows]
  for: [python]


  attack: T1195.002,T1105,T1059.006
  mbc: B0024
composite_rules:
  - id: import-time-download-and-interpret
    desc: Import-time download and interpreter execution clues
    crit: hostile
    conf: 0.96
    # Fetch, write and run are one sequence. Pooled over a 13,000-line
    # orchestrator, a loopback health check, a model-zip download elsewhere and
    # an unrelated interpreter call add up to a dropper that is not in the file.
    near_lines: 40
    all:
      # Fetch, and the response written to a file rather than used in memory.
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-read
      - id: micro-behaviors/process/argument/file::interpreter-variable-script-argv
      # Module scope: the code runs on import, not on call.
      - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
    any:
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/communications/http/request/client::request-python
