---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1195.002,T1105,T1059.006
  mbc: B0024
traits:
- id: python-module-fetches-and-runs-pyz-from-temp
  desc: Import downloads and runs a remote pyz
  crit: hostile
  conf: 0.99
  if:
    type: yara
    source: |
      rule python_module_fetches_and_runs_pyz_from_temp {
        strings:
          $s0 = /sys\.platform\.startswith\(/s
          $s1 = /linux/s
          $s2 = /\)/s
          $s3 = /https?:\/\/[^\s]{1,253}\.pyz/s
          $s4 = /urlopen\([^)]{0,120}\)/s
          $s5 = /\.write\(response\.read\(\)\)/s
          $s6 = /subprocess\.run\(\[/s
          $s7 = /python3/s
          $s8 = /PATH\s*\]\)/s
        condition:
          (for any i0 in (1..#s0) : (for any i1 in (1..#s1) : (@s1[i1] >= @s0[i0] + !s0[i0] and @s1[i1] <= @s0[i0] + !s0[i0] + 10 and (for any i2 in (1..#s2) : (@s2[i2] >= @s1[i1] + !s1[i1] and @s2[i2] <= @s1[i1] + !s1[i1] + 10 and (for any i3 in (1..#s3) : (@s3[i3] >= @s2[i2] + !s2[i2] and @s3[i3] <= @s2[i2] + !s2[i2] + 300 and (for any i4 in (1..#s4) : (@s4[i4] >= @s3[i3] + !s3[i3] and @s4[i4] <= @s3[i3] + !s3[i3] + 500 and (for any i5 in (1..#s5) : (@s5[i5] >= @s4[i4] + !s4[i4] and @s5[i5] <= @s4[i4] + !s4[i4] + 300 and (for any i6 in (1..#s6) : (@s6[i6] >= @s5[i5] + !s5[i5] and @s6[i6] <= @s5[i5] + !s5[i5] + 300 and (for any i7 in (1..#s7) : (@s7[i7] >= @s6[i6] + !s6[i6] and @s7[i7] <= @s6[i6] + !s6[i6] + 20 and (for any i8 in (1..#s8) : (@s8[i8] >= @s7[i7] + !s7[i7] and @s8[i8] <= @s7[i7] + !s7[i7] + 20 and (true))))))))))))))))))
      }
- id: python-linux-platform-gate
  desc: Guards code on Linux sys.platform check
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'sys\.platform\.startswith\(\s*["'']linux["'']\s*\)'
- id: python-tmp-pyz-subprocess-run
  desc: Runs staged temp pyz with python3
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: '(?s)["'']/tmp/[\w.-]{1,64}\.pyz["''].{0,320}subprocess\.run\(\s*\[\s*["'']python3["'']'

composite_rules:
- id: import-time-download-and-interpret
  desc: Import-time download and interpreter execution clues
  crit: hostile
  conf: 0.96
  near_lines: 40
  all:
  - id: micro-behaviors/fs/write/file/response-body::python-write-response-read
  - id: micro-behaviors/process/argument/file::interpreter-variable-script-argv
  - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
  any:
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
  - id: micro-behaviors/communications/http/get::requests-get
  - id: micro-behaviors/communications/http/request/client::request-python
- id: python-import-time-pyz-temp-execution
  desc: Python module downloads and executes a remote pyz archive at import time
  crit: hostile
  conf: 0.99
  scope: file
  near_lines: 20
  all:
    - id: python-linux-platform-gate
    - id: micro-behaviors/communications/http/download/url::python-remote-zipapp-url
    - id: python-tmp-pyz-subprocess-run
    - id: micro-behaviors/fs/write/file/response-body::python-write-response-read
    - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
- id: python-import-time-curl-pyz-detached-execution
  desc: Import downloads and launches detached Python zipapp
  crit: hostile
  conf: 0.99
  scope: file
  near_bytes: 800
  all:
    - id: micro-behaviors/communications/http/download/url::python-remote-zipapp-url
    - id: micro-behaviors/communications/http/curl/command::python-curl-argv-list
    - id: micro-behaviors/fs/path/archive::python-temp-zipapp-path
    - id: micro-behaviors/process/daemonize/detach::python-detached-daemon-process
    - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
