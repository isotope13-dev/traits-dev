defaults:
  platforms: [windows]
  for: [python]
  attack: T1105,T1204.002

composite_rules:
  - id: python-import-curl-github-executable-launch
    desc: Import downloads and launches GitHub executable
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: well-known/app/development/code-forge/github::github-raw-executable-url
      - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/process/create/shell/reference::windows-start-command-a
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system-string-command
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
