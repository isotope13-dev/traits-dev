defaults:
  platforms:
  - windows
  attack: T1195.002,T1105,T1059
traits:
- id: node-pages-exe-temp-download-spawn
  desc: Downloads and spawns a Pages executable
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /https:\/\/[a-z0-9-]+\.pages\.dev\/[^"'\s]+\.exe/s
          $b0_1 = /os\.tmpdir\s*\(\s*\)/s
          $b0_2 = /https\.get\s*\(/s
          $b0_3 = /createWriteStream\s*\(\s*exeFilePath\s*\)/s
          $b0_4 = /\.pipe\s*\(/s
          $b0_5 = /spawn\s*\(\s*exeFilePath\s*,/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 200 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 500 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 500 and
                    for any i4 in (1..#b0_4) : (
                      @b0_4[i4] >= (@b0_3[i3] + !b0_3[i3]) and
                      @b0_4[i4] <= (@b0_3[i3] + !b0_3[i3]) + 300 and
                      for any i5 in (1..#b0_5) : (
                        @b0_5[i5] >= (@b0_4[i4] + !b0_4[i4]) and
                        @b0_5[i5] <= (@b0_4[i4] + !b0_4[i4]) + 500 and
                        true
                      )
                    )
                  )
                )
              )
            )
          )
      }
composite_rules:
- id: npm-install-pages-exe-download-spawn
  desc: npm install downloads and executes a Pages executable
  crit: hostile
  conf: 0.995
  for:
  - zip
  - npm
  - tar
  - javascript
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: node-pages-exe-temp-download-spawn
