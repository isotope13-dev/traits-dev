defaults:
  platforms: [windows]
  for: [pyc]
  attack: T1105
  mbc: E1105

# A frozen Python dropper stages its payload as a passworded archive on a
# public file share, pulls it with the standard library, extracts it, and
# launches the result -- all from bytecode where source-level call facts are
# unavailable. The share URL plus extraction plus child process is the
# dropper shape; the fetch, TLS-subversion, and archive-password legs
# corroborate the staging mechanism. A legitimate updater uses its own
# infrastructure and verifies transport; it does not combine an anonymous
# share with a passworded archive and a hidden launch.
composite_rules:
  - id: pyc-fileshare-passworded-archive-execute
    desc: Bytecode fetches passworded archive from file share and executes it
    crit: hostile
    conf: 0.96
    attack: T1105,T1059.006
    all:
      - id: well-known/app/storage/dropbox::dropbox-download-url
      - id: micro-behaviors/data/archive/extract/capability::bytecode-archive-extractall-name
      - id: metadata/binary/code/bytecode::pyc-subprocess-api-text
    any:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-pyc-symbol
      - id: micro-behaviors/communications/tls/verify/disable::pyc-cert-none-verify-mode-names
      - id: micro-behaviors/data/archive/zip::pyzipper-aes-pyc
      - id: micro-behaviors/data/archive/zip::zipfile-setpassword-pyc
