defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-archive-executable-dropper
    desc: Install-named script downloads an archive and launches a detached process
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1105,T1059.001
    scope: leaf
    size_max: 20000
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: micro-behaviors/communications/http/download/url::archive-url-reference
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file-text
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
      - id: micro-behaviors/fs/directory/readdir/language::node-recursive-executable-search
