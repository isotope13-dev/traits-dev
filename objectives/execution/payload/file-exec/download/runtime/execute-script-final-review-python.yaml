defaults:
  attack: T1105
  mbc: E1105
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]


composite_rules:
  - id: python-unverified-filehost-watchdog
    desc: Python unverified file-hosted watchdog
    crit: hostile
    conf: 0.995
    attack: T1105,T1059.006
    near_lines: 120
    all:
      - id: micro-behaviors/communications/http/services/file-hosting::catbox-moe
      - id: micro-behaviors/communications/http/lib/urllib::urllib-download-to-binary-output
      - id: micro-behaviors/data/compression::lzma-open-stream
      - id: metadata/package/integrity::artifact-digest-placeholder
      - id: micro-behaviors/fs/chmod/executable/mode::python-executable
      - id: micro-behaviors/process/lifecycle/supervise::python-detached-worker-watchdog

  # Importing this module invokes PowerShell, which downloads a GitHub-hosted
  # executable and starts the resulting file. The shell call, executable URL,
  # launch command, and import-time side effect establish the delivery chain.
