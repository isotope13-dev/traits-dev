defaults:
  platforms:
    - unix
    - windows
  for:
    - python


  attack: T1105
  mbc: E1105
composite_rules:
  - id: python-github-response-write-startfile
    desc: Import-time GitHub fetch, write and startfile clues
    crit: hostile
    conf: 0.99
    near_lines: 40
    all:
      - id: metadata/file/size::init-py-file
      - id: well-known/app/development/code-forge/github::github-raw-executable-url
      - id: micro-behaviors/communications/url/path::mutable-branch-ref-path
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/communications/http/client/response-body::python-client-response-body-cooccurrence
      - id: micro-behaviors/fs/file/open/unspecified::binary-write-mode
      - id: micro-behaviors/os/handler/open::os-startfile-call
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
