# A raw Pastebin response selects a Discord-hosted archive that the Python
# source stages in the Windows temporary directory and launches hidden. The
# combination is a concealed remote payload handoff, not an ordinary update.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1105

composite_rules:
  - id: python-pastebin-discord-hidden-archive-launch
    desc: Pastebin, hidden archive, and process launch
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/communications/http/services/pastebin::pastebin-raw-fetch
      - id: micro-behaviors/communications/url/external/attachment::discord-cdn-archive-url
      - id: micro-behaviors/fs/path/temp::windows-temp-path
      - id: micro-behaviors/fs/file/attributes::attrib-hidden
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
