defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-git-clone-move-launch-clues
    desc: Git clone, move and launch clues
    crit: suspicious
    conf: 0.90
    needs: 3
    any:
      - id: micro-behaviors/revision-control/git/transfer::python-git-clone-call
      - id: micro-behaviors/fs/file/move::python-rename-call
      - id: micro-behaviors/os/handler/open::os-startfile-call

  - id: python-repeated-git-clone-move-launch-clues
    desc: Repeated Git clone, move and launch clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/revision-control/git/transfer::python-repeated-repo-clone-calls
      - id: micro-behaviors/fs/file/move::python-rename-call
      - id: micro-behaviors/os/handler/open::os-startfile-call
