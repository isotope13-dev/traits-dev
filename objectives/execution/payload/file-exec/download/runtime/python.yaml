defaults:
  platforms: [windows, unix, android, ios]
  for: [python]
  attack: T1105
  mbc: E1105


composite_rules:
  - id: python-google-drive-jar-dropper
    desc: Google Drive JAR download and execute
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/fs/file/open/unspecified::binary-write-mode
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-jar-argv
      - id: micro-behaviors/communications/http/services/drive-google::google-drive-direct-download-url

# A Python script that drops a downloaded executable into the user's AppData
# and launches it through a raw Win32 call. The AppData landing zone plus the
# ctypes WinExec/ShellExecute launch is the dropper idiom -- a legitimate
# installer uses the user's package manager or Program Files, not a hidden
# per-user directory and a syscall.
#
# Worked example: the `discconnect` PyPI package, whose install hook fetches
# `Driver.exe` from filetransfer.io into %LOCALAPPDATA% and WinExecs it.
  - id: python-download-appdata-exe-launch
    desc: Attempts urllib download and AppData executable launch
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-download-to-binary-output
      - id: metadata/lang/source/naming/interface/execution::python-ctypes-win32-exec
    any:
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
      - id: micro-behaviors/fs/path/construct::python-path-join-appdata-exe

  # Hidden PowerShell plus iwr -OutFile and Start-Process.
  - id: python-hidden-iwr-outfile-start
    desc: Hidden PowerShell downloads and starts a file
    crit: hostile
    conf: 0.96
    attack: T1105,T1059.001
    scope: file
    all:
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system-text
      - id: micro-behaviors/process/config/window::python-powershell-w-hidden
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::iwr-outfile-download
      - id: metadata/lang/source/literal/string/command::python-string-start-process-command

  # A script that treats a throwaway tunnel endpoint as its code source: it
  # reads a body from the tunnel host and then replaces its own process image
  # with os.execv, so the relaunch runs whatever the tunnel returned. Vendor
  # updaters fetch from their own domain, not an ephemeral tunnel, and they
  # restart through a package manager, not execv on the running interpreter.
  #
  # Worked example: bhp_pro 1.7.3 update00() fetches bhp<ver>.py from
  # shy-lion-88.telebit.io, overwrites its script file and re-execs through
  # sys.executable.
  - id: python-tunnel-body-execv-relaunch
    desc: Fetches tunnel content and execv-relaunches itself
    crit: hostile
    conf: 0.88
    scope: file
    all:
      - id: well-known/dual-use/tunnel/ephemeral-host::ephemeral-tunnel-host-literal
      - id: micro-behaviors/communications/http/client/response-body::remote-response-body-read
      - id: micro-behaviors/process/replace::python-os-execv-call
