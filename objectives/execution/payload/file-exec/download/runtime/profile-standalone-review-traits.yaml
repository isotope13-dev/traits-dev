defaults:
  platforms: [windows, unix]
composite_rules:
  - id: node-distribution-archive-exec-clues
    desc: Node distribution, archive and exec clues
    crit: suspicious
    conf: 0.85
    for: [pyc, python]
    all:
      - id: micro-behaviors/communications/url/host/domain-http::nodejs-distribution-url
      - id: micro-behaviors/fs/path/archive::node-versioned-archive-reference
      - id: objectives/anti-static/obfuscation/payload/bytecode::exec-functions
    any:
      - id: micro-behaviors/data/archive/extension::tar-gz
      - id: micro-behaviors/data/archive/extension::zip-extension
    unless:
      - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context
