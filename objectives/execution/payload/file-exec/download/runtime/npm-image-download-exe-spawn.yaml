defaults:
  platforms: [windows]
  for: [package.json]
  attack: T1195.002,T1105,T1059.007

traits:
  - id: npm-hook-image-download
    desc: Install hook downloads image URL
    crit: notable
    conf: 0.99
    if:
      type: value
      path: scripts.preinstall
      regex: 'https\.get\(["\x27]https://[^"\x27\s]{1,160}\.(jpg|png)["\x27]'

  - id: npm-hook-exe-stream
    desc: Install hook writes executable stream
    crit: notable
    conf: 0.99
    if:
      type: value
      path: scripts.preinstall
      regex: 'createWriteStream\(["\x27]x\.exe["\x27]\)'

  - id: npm-hook-stream-finish-exec
    desc: Install hook runs streamed executable
    crit: notable
    conf: 0.99
    if:
      type: value
      path: scripts.preinstall
      regex: '(?s)r\.pipe\(f\).{0,100}f\.on\(["\x27]finish["\x27].{0,100}spawn\(["\x27]x\.exe["\x27]'

composite_rules:
  - id: npm-preinstall-image-to-exe-spawn
    desc: npm preinstall downloads image URL and launches it as executable
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: npm-hook-image-download
      - id: npm-hook-exe-stream
      - id: npm-hook-stream-finish-exec
