# Python downloads a file and runs it: no pipe for pipe-to-shell rules to see.
defaults:
  platforms: [unix]
  for: [python]
  attack: T1105,T1059.004

composite_rules:
  # setup.py runs on every install.
  - id: python-setup-downloads-and-runs-script
    desc: setup.py downloads and runs a temp script
    crit: hostile
    conf: 0.95
    attack: T1105,T1059.004,T1195.002
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/communications/http/download/write::python-urlopen-body-written-to-file
      - id: micro-behaviors/process/create/path-execution::python-shell-runs-temp-script

  # One command fetches from a raw IP, marks the file executable, and runs it.
  - id: python-process-call-raw-ip-stage
    desc: Python fetches, arms and runs a raw-IP stage
    crit: hostile
    conf: 0.96
    near_lines: 1
    all:
      - id: micro-behaviors/process/create/shell/pipeline::python-shell-call-downloader-literal
      - id: micro-behaviors/communications/url/host/http::downloader-raw-ipv4-host
      - id: micro-behaviors/process/create/path-execution::python-shell-call-chmod-then-run

  # Install-time download from a raw IP, even before anything runs it.
  - id: python-setup-raw-ip-download
    desc: setup.py downloads from a raw IP at install
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: python-setup-raw-ip-download-call

  - id: python-setup-raw-ip-download-call
    desc: Python downloader call names a raw IP
    crit: component
    conf: 0.92
    near_lines: 1
    all:
      - id: micro-behaviors/process/create/shell/pipeline::python-shell-call-downloader-literal
      - id: micro-behaviors/communications/url/host/http::downloader-raw-ipv4-host
