defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-oob-stage-dropper
    desc: Install-named script has OOB download and detached execution clues
    crit: hostile
    conf: 0.995
    attack: T1195.002, T1105, T1059.004
    size_max: 20000
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: metadata/lang/source/literal/fragment/env-variable::dep-confusion-env-knobs
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-moika-endpoint
      - id: micro-behaviors/fs/path/hidden::postinstall-hidden-temp-payload
      - id: micro-behaviors/process/daemonize/detach::install-script-detached-download-clues
      - id: metadata/import/builtin::require-child-process
    any:
      - id: micro-behaviors/process/daemonize/detach::install-named-script-detach-options
      - id: micro-behaviors/process/create/path-execution::install-named-cross-platform-script-execution
