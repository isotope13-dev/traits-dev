defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1105

composite_rules:
  - id: download-execute-csharp
    desc: C# download and launch clues with staging context
    crit: suspicious
    conf: 0.94
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/download/write::csharp-file-download-clues
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start
    any:
      - id: micro-behaviors/os/env/path::temp-environment-variable-read
      - id: micro-behaviors/fs/path/temp::get-temp-path-raw
      - id: micro-behaviors/process/config/launch::use-shell-execute-property
    needs: 1
