defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1105,T1059.006
  mbc: E1105

composite_rules:
- id: python-http-executable-downloader-launch
  desc: Executable URL, HTTP GET and subprocess clues
  crit: suspicious
  conf: 0.99
  scope: file
  all:
  - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
  - id: micro-behaviors/communications/http/get::requests-get
  - id: micro-behaviors/process/config/launch::creationflags
  any:
  - id: micro-behaviors/process/create/subprocess/launch::call-ast
  - id: micro-behaviors/process/create/subprocess/launch::run-ast
  - id: micro-behaviors/process/create/subprocess/launch::popen-ast
- id: python-discord-webhook-executable-stage
  desc: Module downloads executable and posts to Discord webhook
  crit: hostile
  conf: 0.97
  scope: file
  all:
  - id: micro-behaviors/communications/http/webhook::discord-webhook-file-launch-clues
  - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
  - id: micro-behaviors/communications/http/get::requests-get
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
