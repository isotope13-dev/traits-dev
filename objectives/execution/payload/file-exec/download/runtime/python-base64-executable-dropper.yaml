defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1105,T1059.006
  mbc: E1105

composite_rules:
- id: python-http-executable-downloader-launch
  desc: Python downloads a Windows executable and launches the downloaded file
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
  - id: micro-behaviors/communications/http/get::requests-get
  any:
  - id: micro-behaviors/process/create/subprocess/launch::call-ast
  - id: micro-behaviors/process/create/subprocess/launch::run-ast
  - id: micro-behaviors/process/create/subprocess/launch::popen-ast
