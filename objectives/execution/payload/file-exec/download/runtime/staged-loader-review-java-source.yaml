defaults:
  platforms: [windows, unix]
  for: [java]
  attack: T1105
  mbc: B0042


composite_rules:
- id: java-cross-platform-persistent-downloader
  desc: Java downloads an executable and installs login persistence
  crit: hostile
  conf: 0.99
  attack: "T1105,T1547.001,T1543.002"
  all:
  - id: micro-behaviors/communications/http/lib/httpclient::java-url-openconnection
  - id: micro-behaviors/fs/write/file/executable::java-write-executable-file-source
  - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-source
  any:
  - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
  - id: micro-behaviors/fs/path/config/autorun::java-systemd-service-path-source
# NOTE: the Minecraft-token-collector-launches-a-child-stage composite is not
# duplicated here.  Its evidence is the session-token read, so it lives with the
# rest of that family as
# objectives/credential-access/gaming/minecraft::minecraft-token-child-process-stage.
