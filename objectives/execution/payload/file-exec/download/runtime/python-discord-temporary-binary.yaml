defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1105,T1204.002
composite_rules:
  - id: python-discord-temporary-binary-launch
    desc: Runs downloaded Discord binary from temp file
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/deploy/file-exec/spawn::python-module-http-tempfile-binary-launch
      - id: micro-behaviors/communications/url/external/attachment::discord-cdn-executable-url
