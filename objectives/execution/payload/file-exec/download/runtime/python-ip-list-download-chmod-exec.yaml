# A Python module that downloads executables from a raw IP, marks them
# executable, and launches them is a staged payload loader.
defaults:
  platforms: [linux, macos, windows, unix]
  for: [python]
  attack: T1105

composite_rules:
  - id: python-ip-list-download-chmod-exec
    desc: Downloads and runs executable from raw IP
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/download/write::python-response-content-binary-write
      - id: micro-behaviors/fs/chmod/remote::chmod-executable-mode-string
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system-interpolated-command
      - id: micro-behaviors/os/sysinfo/platform/host::platform-system
