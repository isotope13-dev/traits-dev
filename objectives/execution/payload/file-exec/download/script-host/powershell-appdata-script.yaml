defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
- id: powershell-appdata-download-invocation-cluster
  desc: Downloads a script to AppData and invokes it
  crit: suspicious
  conf: 0.95
  near_bytes: 512
  all:
  - id: micro-behaviors/communications/http/download/cli/web-cmdlet::powershell-web-appdata-script-output
  - id: micro-behaviors/process/interpreter/eval/source::powershell-appdata-script-invocation
