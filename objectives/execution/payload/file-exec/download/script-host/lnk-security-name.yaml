defaults:
  for: [lnk]
  platforms: [windows]
  attack: T1105,T1036

traits:
  - id: lnk-download-temp-security-name
    desc: Shortcut downloads to a security tool filename
    crit: notable
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)Invoke-WebRequest.{0,300}GetTempPath.{0,100}smartscreen\.exe'
  - id: lnk-execute-temp-security-name
    desc: Shortcut executes the same security filename
    crit: notable
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)Start-Process.{0,120}GetTempPath.{0,100}smartscreen\.exe'
  - id: lnk-acrobat-icon-reference
    desc: Shortcut icon references Adobe Acrobat
    crit: notable
    if:
      type: value
      path: lnk.icon_location
      regex: '(?i)Adobe[\\/]Acrobat[^\r\n]{0,100}\.exe'

composite_rules:
  - id: lnk-acrobat-icon-security-name-download
    desc: Acrobat-icon shortcut downloads fake security binary
    crit: hostile
    conf: 0.98
    all:
      - id: lnk-download-temp-security-name
      - id: lnk-execute-temp-security-name
      - id: lnk-acrobat-icon-reference
      - id: micro-behaviors/process/config/target::lnk-powershell-target
      - id: micro-behaviors/communications/url/host/http::lnk-arg-http-raw-ip
