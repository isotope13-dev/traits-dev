# PowerShell droppers that assemble an HTTP(S) URL scheme from split character
# literals ("h"+"t"+"t"+"p"...) to evade static URL extraction, download a
# remote script to local user storage, and invoke it via computed call operator.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1105,T1027,T1059.001
  mbc: B0030,B0032

composite_rules:
  - id: powershell-fragmented-url-download-exec
    desc: Downloads and runs script from split URL
    crit: hostile
    conf: 0.98
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/url/construction/fragment::fragmented-http-scheme-construction
      - id: micro-behaviors/os/env/path::powershell-user-staging-env
      - id: micro-behaviors/data/control-flow/dispatch/computed::powershell-variable-call-operator
    any:
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::iwr-outfile-download
      - id: micro-behaviors/communications/http/client/library::iwr-uri
      - id: micro-behaviors/communications/http/client/xmlhttp::msxml-xmlhttp-progid-text
