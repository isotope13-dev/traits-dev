defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  # A decoded downloader reports the account, writes content, and launches a
  # hidden script with policy bypass. This is a coherent payload-chain
  # inference, not a proof of variable equality or a successful download.
  - id: concealed-account-reporting-script-launch
    desc: Concealed account-reporting downloader launches hidden script
    crit: hostile
    conf: 0.97
    attack: T1105,T1059.001
    near_bytes: 1024
    all:
      - id: objectives/exfiltration/stealer/system-info/account::concealed-powershell-account-report
      - id: micro-behaviors/fs/write/file/full/string::encoded-powershell-variable-content-write
      - id: micro-behaviors/process/create/hidden::start-process-hidden-window-option
      - id: micro-behaviors/process/argument/file::powershell-variable-script-file-option
      - id: micro-behaviors/os/security/execution-policy::powershell-policy-bypass-switch-text
