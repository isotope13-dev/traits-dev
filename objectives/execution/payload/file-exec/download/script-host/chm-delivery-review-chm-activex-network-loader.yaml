defaults:
  platforms: [windows]
  for: [chm]


composite_rules:
- id: chm-activex-network-loader
  desc: Active single-topic CHM carries a network loader
  crit: hostile
  conf: 0.97
  scope: archive
  for: [chm, pe]
  all:
    - id: metadata/document/chm::chm-single-topic-objinst
    - id: metadata/document/chm::chm-contains-executable
    - id: micro-behaviors/communications/http/client/wininet::internet-open-or-request
    - id: micro-behaviors/os/handler/open::shell-execute-a
  unless:
    - id: metadata/document/chm::chm-data-basename
