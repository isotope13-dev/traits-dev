---
defaults:
  crit: hostile
  for:
  - javascript
  platforms:
  - windows
composite_rules:
- id: activex-xmlhttp-executable-url-clues
  crit: suspicious
  conf: 0.98
  desc: ActiveX, XMLHTTP and executable URL clues
  all:
  - id: micro-behaviors/os/com/instantiation::activex-constructor-call
  - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-progid
  - id: micro-behaviors/communications/url/resource-path/file::executable-url-reference-b
  - id: metadata/lang/javascript-features::generated-name-or-state-syntax
  any:
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: micro-behaviors/fs/write/content::fso-text-file-write-api
  needs: 1
  unless:
  - id: objectives/execution/interpreter/powershell::obfuscated-com-http-powershell-file-launch
- id: wscript-activex-executable-url-clues
  crit: suspicious
  conf: 0.98
  desc: WScript, ActiveX and executable URL clues
  all:
  - id: micro-behaviors/os/com/instantiation::activex-constructor-call
  - id: metadata/lang/javascript-features::generated-name-or-state-syntax
  - id: micro-behaviors/communications/url/resource-path/file::executable-url-reference-b
  - id: metadata/lang/runtime::wscript-host-reference
  unless:
  - id: objectives/execution/interpreter/powershell::obfuscated-com-http-powershell-file-launch
- id: rc4-activex-ps1-url-temp-clues
  crit: suspicious
  conf: 0.97
  desc: RC4, ActiveX, PS1 URL and temp clues
  all:
  - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::js-rc4-implementation
  - id: objectives/anti-static/obfuscation/name-mangling/function-name::hex-named-hex-argument-call
  - id: micro-behaviors/os/com/instantiation::activex-constructor-call
  - id: micro-behaviors/os/com/instantiation::activex-obfuscated-progid
  - id: micro-behaviors/communications/url/reference::http-ps1-url-reference
  - id: micro-behaviors/os/com/automation::filesystemobject-progid
  - id: micro-behaviors/fs/path/temp::js-escaped-c-temp-path
