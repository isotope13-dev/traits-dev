defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1105,T1059.001
composite_rules:
  # HttpWebRequest sibling of the BITS exact-size retry form. The script
  # writes a response stream to a temp executable, repeats (resuming with a
  # range request across mirror URLs) until the file length equals one
  # expected byte count, launches the file, and then reports the launch
  # through two unrelated HTTP clients, one of them a hidden curl.exe.
  # Size checking and launching are ordinary installer behavior; the
  # hidden second reporting channel for one launch event is the
  # concealment leg, so this reads as a staged downloader, not an updater.
  - id: http-exact-size-retry-launch-beacon
    desc: PowerShell downloads a file to an exact size, runs it, beacons launch
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/download/manager::powershell-download-length-equality
      - id: micro-behaviors/communications/http/client/managed::getresponsestream
      - id: objectives/command-and-control/channel/http/beacon::powershell-dual-channel-launch-beacon
