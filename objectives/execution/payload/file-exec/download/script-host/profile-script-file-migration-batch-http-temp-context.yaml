# A TEMP download near a batch-script call suggests staged execution.
# The path comparison does not establish that both references name one file.
defaults:
  platforms: [windows]
  for: [batch]

composite_rules:
  - id: batch-temp-http-download-call-profile
    desc: Batch TEMP curl near script call
    crit: suspicious
    conf: 0.99
    near_lines: 8
    all:
      - id: micro-behaviors/communications/http/curl/command::batch-curl-call
      - id: micro-behaviors/communications/http/download/curl::batch-curl-output-temp
      - id: micro-behaviors/communications/http/curl/command::batch-curl-http-url
      - id: micro-behaviors/process/interpreter/eval/source::batch-call-script
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
