# Trojan-Downloader.JS.Psyme pattern: an exploit page fetches a binary with
# XMLHTTP, saves the response over the installed Windows Media Player
# executable (SaveToFile mode 2 overwrites), then starts it by navigating to
# the mms:// handler. The overwritten player is the payload launcher.
defaults:
  platforms: [windows]
  for: [vbs, javascript, html]
  attack: T1105,T1204
composite_rules:
  - id: xmlhttp-download-overwrites-media-player
    desc: Script downloads a binary over Windows Media Player and launches it
    crit: hostile
    conf: 0.97
    all:
      # Directory reference: the ProgID atom does not scan HTML, so exploit
      # pages are covered by the html-scoped XMLHTTP client atoms here.
      - id: micro-behaviors/communications/http/client/xmlhttp
      - id: micro-behaviors/fs/write/stream::stream-write-response-body
      - id: micro-behaviors/fs/write/stream::wsh-savetofile
      - id: micro-behaviors/fs/path/application/executable::wmplayer-install-path-probe
      - id: micro-behaviors/ui/window/navigation/location::mms-scheme-location-assignment
