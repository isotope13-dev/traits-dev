
composite_rules:
- for:
  - javascript
  platforms:
  - unix
  - windows
  id: transformed-response-write-helper-launch
  desc: Transformed response and executable-launch clues
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/crypto/symmetric/stream/chacha::transformed-response-returned
  - id: micro-behaviors/fs/write/file/full/bytes::awaited-data-executable-write
  - id: micro-behaviors/process/create/path-execution::launched-helper-path-from-setup
  - id: micro-behaviors/communications/tls/verify/disable::reject-unauthorized-false
  - id: micro-behaviors/data/parse/json::json-parse-data-identifier
- platforms:
  - windows
  for:
  - pe
  id: native-embedded-wsh-http-shell-execute
  desc: Embedded WSH HTTP and ShellExecute clues
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/process/interpreter/wsh::embedded-http-file-dropper
  - id: micro-behaviors/os/handler/open::shell-execute-ex
  any:
  - id: metadata/build/manifest::admin-manifest
  - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
  - id: micro-behaviors/time/query::multiple-clock-api-references
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-com
  needs: 2
