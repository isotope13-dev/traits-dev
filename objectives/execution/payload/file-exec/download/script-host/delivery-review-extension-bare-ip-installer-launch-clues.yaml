defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript, scripts]
  attack: T1189,T1105
  mbc: B0011

composite_rules:
- id: extension-bare-ip-installer-launch-clues
  crit: suspicious
  desc: VSIX, IP installer and process launch clues
  conf: 0.97
  attack: T1204.002,T1105
  scope: archive
  for:
  - html
  - javascript
  - typescript
  - scripts
  - crx
  - xpi
  all:
  - id: micro-behaviors/communications/url/resource-path/file::public-ip-installer-url-reference
  - id: micro-behaviors/process/create/exec::node-process-launch-call
  - id: metadata/package/files/included::vsix-manifest-entry
  - id: metadata/package/files/included::vsix-package-json-entry
