defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-boot-download-script-runner
    desc: Boot-file downloader with script URL and preset script runner
    crit: suspicious
    attack: T1105,T1059.005
    all:
      - id: micro-behaviors/communications/http/download/helper::go-boot-file-fetch-routine
      - id: micro-behaviors/process/interpreter/wsh::go-preset-script-runner
      - id: micro-behaviors/communications/url/resource-path/file::script-url-reference-pe
