defaults:
  for: [python]
  platforms: [linux, macos, windows]
composite_rules:
  - id: python-http-output-helper-child-module-run
    desc: Fetches Python for child module execution and serializes JSON
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.006
    all:
      - id: micro-behaviors/process/deploy/module-load::python-http-file-helper-child-module
      - id: micro-behaviors/data/serialize/object::json-dump
