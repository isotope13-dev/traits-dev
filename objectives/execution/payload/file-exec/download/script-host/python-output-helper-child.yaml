defaults:
  for: [python]
  platforms: [linux, macos, windows]
composite_rules:
  - id: python-http-output-helper-child-module-run
    desc: Downloads Python for child module execution
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.006
    all:
      - id: micro-behaviors/process/deploy/module-load::python-http-file-helper-child-module
    # The module-load leg binds HTTP output to the executed module path.
    # A JSON manifest is optional: an inline child loader executes the same
    # downloaded code without needing serialized arguments.
    any:
      - id: micro-behaviors/data/serialize/object::json-dump
      - id: micro-behaviors/process/deploy/interpreter-command::sys-executable-c-subprocess
    needs: 1
