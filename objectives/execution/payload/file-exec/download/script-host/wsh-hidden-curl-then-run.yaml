# A WSH script runs curl in a hidden console to save a remote file under
# %TEMP%, then hidden-runs the saved file through cmd /c: download and
# execution of unverified code with no window at any step.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1105,T1059.003,T1564.003

composite_rules:
  - id: wsh-hidden-curl-download-then-run
    desc: Curls a file to TEMP, hidden-runs it
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/download/curl::script-shell-curl-file-download
      - id: micro-behaviors/process/create/hidden::wsh-hidden-cmd-run-variable-path
      - id: micro-behaviors/os/env/path::wsh-temp-expand
      - id: micro-behaviors/data/control-flow/dispatch/run::vbs-run-style-zero
