defaults:
  platforms: [windows]
  for: [json]
  crit: notable
  conf: 0.98

traits:
  - id: vscode-mshta-folder-open-command-first
    desc: Remote MSHTA task precedes folderOpen trigger
    if:
      type: value
      path: tasks[*]
      regex: '"command":"mshta(\.exe)?\s+https?://[^"]*".*"runOptions":\{"runOn":"folderOpen"'
      case_insensitive: true
