defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1105,T1197,T1059.001
composite_rules:
  # BITS is the stealthy download primitive: a background transfer job that
  # avoids the browser and most command-line download logging. Pairing it
  # with Start-Process execution is a downloader; pairing that pair with
  # policy bypass or self-deletion is a hostile one. Legitimate updaters and
  # installers download and launch without hiding the interpreter or
  # deleting their own script, so the concealment legs carry the hostile
  # claim, not the transfer alone.
  - id: bits-concealed-download-execute
    desc: BITS download executed with concealment or cleanup
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/download/manager::bits-transfer-command-text
      - id: micro-behaviors/process/create/cmdlet::start-process-filepath-text
    any:
      - id: objectives/evasion/self-delete/file/script::self-delete-powershell
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-argument

  # Exact-size retry form: the transfer is repeated, with a sleep between
  # attempts, until the downloaded file's length equals one expected size,
  # and the completed file is then executed. Verifying a size once is
  # ordinary integrity checking; looping until an exact byte count
  # arrives and launching the result is a staged downloader, but a
  # determined updater could do the same, so this stays suspicious
  # without the concealment legs of the hostile form above.
  - id: bits-exact-size-retry-download-execute
    desc: BITS download retried to exact size then executed
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/download/manager::bits-transfer-command-text
      - id: micro-behaviors/communications/http/download/manager::powershell-download-length-equality
      - id: micro-behaviors/process/create/cmdlet::start-process-filepath-text
    any:
      - id: micro-behaviors/time/sleep/interval::ps-start-sleep
