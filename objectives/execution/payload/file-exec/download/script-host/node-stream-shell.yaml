defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: node-stream-download-shell-script
    desc: Node streams download to a shell script file
    crit: hostile
    conf: 0.97
    attack: "T1105,T1059.004"
    all:
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: micro-behaviors/fs/path/script::shell-script-ref
