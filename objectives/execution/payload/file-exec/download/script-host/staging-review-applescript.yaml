defaults:
  platforms:
  - macos
  for:
  - applescript
  crit: hostile
  attack: T1105,T1059.004,T1140

composite_rules:
- id: applescript-http-base64-task-launch-clues
  desc: AppleScript HTTP, Base64 write and task clues
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/lib/nsurlsession::applescript-nsurlrequest-http-request
  - id: micro-behaviors/fs/write/file/full/bytes::applescript-base64-and-file-write
  - id: micro-behaviors/process/create/subprocess/launch::applescript-nstask-shell-exec
- id: applescript-tcc-http-base64-shell-helper-clues
  desc: TCC write, HTTP, Base64 and shell helper clues
  conf: 0.98
  all:
  - id: metadata/lang/source/naming/function/communication::applescript-safehttpgetrequest-call
  - id: metadata/lang/source/naming/function/transform::applescript-base64decodetofile-call
  - id: metadata/lang/source/naming/function/command::applescript-dosh-helper-call
  - id: micro-behaviors/communications/http/lib/nsurlsession::applescript-nsurlsession-class-text
  - id: objectives/evasion/tcc-manipulation::tcc-access-table-write
  - id: objectives/command-and-control/infrastructure/network::fragmented-url-scheme
