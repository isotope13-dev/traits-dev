defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1105
  mbc: B0030


composite_rules:
- id: powershell-country-gated-download-execute
  desc: PowerShell country-gated executable dropper
  crit: hostile
  conf: 0.99
  attack: T1480,T1105,T1204.002
  mbc: B0027,B0030
  all:
  - id: objectives/anti-analysis/geofencing/target-gating::powershell-country-selected-execution
  - id: micro-behaviors/communications/http/client/webclient::net-webclient-object
  - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
  - id: micro-behaviors/process/create/command::start-process-call
  unless:
  - id: metadata/signed/platform/
- id: powershell-github-release-exe-launch
  desc: PowerShell downloads GitHub release EXE and launches it
  crit: notable
  conf: 0.98
  attack: T1105,T1204.002
  all:
  - id: micro-behaviors/communications/url/external/github::github-release-download
  - id: micro-behaviors/communications/http/client/webclient::net-webclient-object
  - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
  - id: micro-behaviors/process/create/command::start-process-call
- id: powershell-js-to-exe-masquerade
  desc: PowerShell downloads JS as EXE
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/download/webclient::webclient-downloads-js-to-exe
  - id: micro-behaviors/process/create/command::start-process-call

  # Junk-heavy droppers separate WebClient construction from DownloadFile by
  # thousands of characters, so the bounded downloadfile-call atom misses even
  # though `.downloadfile(` and the remote `.py` URL still live in one script.
- id: powershell-webclient-pythonw-script-dropper
  desc: WebClient fetches Python script and runs pythonw
  crit: suspicious
  conf: 0.97
  attack: T1105,T1059.006,T1204.002
  all:
  - id: micro-behaviors/communications/http/client/webclient::webclient-download-python-source
  - id: micro-behaviors/communications/url/http-path/resource::python-code-url-reference
  - id: micro-behaviors/os/application/target/development::pythonw-executable-reference
  - id: micro-behaviors/process/create/command::start-process-call
- id: powershell-webclient-wscript-script-dropper
  desc: WebClient downloads script and executes via Windows Script Host
  crit: suspicious
  conf: 0.98
  attack: T1105,T1059.005,T1204.002
  all:
  - id: micro-behaviors/communications/http/client/initialize::powershell-system-webclient-construction
  - id: "micro-behaviors/process/info/name::windows-script-host-executable-reference"
  any:
  - id: micro-behaviors/communications/http/download/webclient::downloadfile-temp-encoded-script
  - id: objectives/evasion/masquerade/extension-mismatch::downloadfile-text-source-to-script

  # A remote response is decoded, written as an executable, launched hidden,
  # and followed by deletion of the script that performed the handoff.
