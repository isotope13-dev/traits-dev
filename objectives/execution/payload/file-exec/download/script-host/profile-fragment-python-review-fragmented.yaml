defaults:
  platforms: [windows, unix]
  for: [javascript]
composite_rules:
  - id: fragmented-temp-exe-run-clues
    desc: TEMP, EXE and execution fragments
    crit: suspicious
    conf: 0.94
    all:
      - id: objectives/execution/staging/reconstruct::fragmented-temp-save-url-clues
      - id: metadata/lang/source/literal/fragment/syntax::dot-spl-fragment
      - id: metadata/lang/source/literal/fragment/syntax::ngs-open-text-fragment
      - id: metadata/lang/source/literal/fragment/single::fromc-string-fragment
      - id: metadata/lang/source/literal/fragment/syntax::92-close-plus-fragment
      - id: metadata/lang/source/literal/fragment/syntax::plus-quoted-e-fragment
    any:
      - id: metadata/lang/source/literal/fragment/syntax::un-fn-text-fragment
      - id: metadata/build/minifier::minified-text-shape

