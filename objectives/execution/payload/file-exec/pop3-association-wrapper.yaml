defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # Mail clients and updaters can save and launch files. Require the
  # extension-concealing executable association wrapper as attack admission.
  - id: pop3-tagged-exe-association-loader
    desc: POP3 tagged-EXE loader with association hijack
    crit: hostile
    conf: 0.97
    attack: T1105
    all:
      - id: micro-behaviors/communications/email/access/pop3::native-retrieval-command-set
      - id: metadata/binary/instruction::x86-nine-byte-argument-x-tag-call-gate
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/fs/write/file/handle::write--fwrite
      - id: objectives/evasion/hijack-execution-flow/file-association::extensionless-executable-association-wrapper
