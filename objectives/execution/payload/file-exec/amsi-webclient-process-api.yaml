defaults:
  platforms: [windows]
  for: [pe, powershell]
composite_rules:
  - id: amsi-bypass-webclient-process-api
    desc: AMSI bypass with download and process API
    crit: hostile
    conf: 0.98
    attack: T1562.001,T1105,T1059.001
    near_bytes: 4096
    all:
      - id: objectives/evasion/anti-av/amsi::base64-amsi-init-failed-reflection-bypass
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
      - id: micro-behaviors/process/create/direct::native-process-launch-call-text
