# An obfuscated Node program that spawns processes and builds a passworded
# 7-Zip extraction command is unpacking a payload that scanners cannot read
# in transit. The password is embedded in the program itself, so the archive
# offers no confidentiality to the user, only to the defender. Each leg alone
# is ordinary: obfuscators protect commercial apps, installers extract
# passworded archives. Together they describe a concealed extraction stage.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1027, T1140
  mbc: B0032

composite_rules:
  - id: node-obfuscated-passworded-7z-extract-spawn
    desc: Obfuscated Node extracts passworded 7z and spawns processes
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/data/archive/extract/password::node-7zip-password-extract-argv
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: micro-behaviors/os/module/require::child-process-require
