
composite_rules:
- platforms:
  - windows
  for:
  - powershell
  id: powershell-archive-fetch-extract-hidden-launch
  desc: PowerShell archive fetch, extract and launch
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/communications/url/resource-path/archive::archive-url-reference-a
  - id: micro-behaviors/communications/http/download/cli/web-cmdlet::iwr-outfile-download
  - id: micro-behaviors/data/archive/extract/zip::zipfile-openread
  - id: micro-behaviors/data/archive/extract/zip::powershell-extract-to-file
  - id: micro-behaviors/fs/file/attributes::powershell-extract-hidden-attribute-text
  - id: micro-behaviors/process/create/cmdlet::start-process-call
