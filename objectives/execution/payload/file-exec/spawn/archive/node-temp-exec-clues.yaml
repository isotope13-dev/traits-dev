defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
composite_rules:
  - id: node-temp-exec-staging-clues
    desc: Node temporary exec with staging clues
    crit: suspicious
    conf: 0.85
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/process/create/path-execution::node-direct-temp-exec-clues
      - id: micro-behaviors/process/create/exec::node-process-launch-call
    any:
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: objectives/execution/staging/store::node-archive-library-or-extract-clues
      - id: micro-behaviors/fs/path/extension::js-executable-extension-check
      - id: micro-behaviors/fs/chmod/modify::node-chmod
    near_lines: 12
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: node-temp-exec-context-filtered
    desc: Node temporary exec outside policy context
    crit: notable
    conf: 0.85
    for:
      - javascript
      - typescript
    all:
      - id: objectives/execution/payload/file-exec/spawn/archive::node-temp-exec-staging-clues
    unless:
      - id: micro-behaviors/os/security/command-policy::command-policy-implementation-context
  - id: node-archive-extract-temp-exec
    desc: Node archive extraction and temporary exec
    crit: notable
    conf: 0.95
    near_bytes: 4096
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/data/archive/extract/
      - id: objectives/execution/payload/file-exec/spawn/archive::node-temp-exec-staging-clues
    unless:
      - id: micro-behaviors/data/archive/extract/tar::tar-stdout-extract-command
      - id: metadata/path/software::release-asset-verifier-basename
