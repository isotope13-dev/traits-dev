
composite_rules:
- platforms:
  - unix
  - windows
  for:
  - npm
  - javascript
  id: npm-raw-github-download-spawn-clues
  desc: npm raw GitHub, download and spawn clues
  crit: suspicious
  conf: 0.94
  attack: T1105,T1059
  scope: archive
  all:
  - id: well-known/app/development/code-forge/github::raw-githubusercontent-refs
  - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
  any:
  - id: micro-behaviors/process/interpreter/node::spawn-node-process
  - id: micro-behaviors/process/interpreter/shell::spawn-bash
