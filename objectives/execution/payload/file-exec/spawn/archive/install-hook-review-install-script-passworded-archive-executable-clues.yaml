defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-passworded-archive-executable-clues
    desc: Install script has passworded archive and executable launch clues
    crit: suspicious
    conf: 0.99
    attack: T1195.002,T1105,T1027,T1059.001
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: objectives/execution/payload/file-exec/spawn/archive::node-spawn-password-stdout-clues
      - id: micro-behaviors/data/format/pe-parser::node-pe-magic-offset-read-clues
      - id: micro-behaviors/fs/path/temporary-artifact::node-temp-exe-name-path-clues
      - id: micro-behaviors/process/daemonize/detach::install-named-script-detach-options
    any:
      - id: micro-behaviors/process/create/path-execution::start-process-temp-executable
      - id: micro-behaviors/process/daemonize/detach::detached-true
