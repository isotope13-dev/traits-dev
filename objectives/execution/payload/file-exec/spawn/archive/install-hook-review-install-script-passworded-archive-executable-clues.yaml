defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-passworded-archive-executable-clues
    desc: Install script has passworded archive and executable launch clues
    crit: suspicious
    conf: 0.99
    attack: T1195.002,T1105,T1027,T1059.001
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: metadata/file/profile/archive::node-spawn-password-stdout-clues
      - id: metadata/file/profile/pe-api::node-pe-magic-offset-read-clues
      - id: metadata/file/profile/process/artifact::node-temp-exe-name-path-clues
      - id: micro-behaviors/process/daemonize/detach::install-named-script-detach-options
    any:
      - id: micro-behaviors/process/create/command::start-process-temp-executable
      - id: metadata/file/profile/command-options::detached-true
