defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
composite_rules:
  - id: node-spawn-password-stdout-clues
    desc: Node spawn, password and stdout option clues
    crit: suspicious
    conf: 0.93
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/process/create/exec::node-spawnsync-call
      - id: metadata/lang/source/literal/string/command::node-stdout-option-literal
      - id: metadata/lang/source/syntax/command/options::node-password-option-template
