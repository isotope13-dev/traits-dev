defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
  attack: T1105
  mbc: B0024

composite_rules:
  - id: node-http-detached-temp-exec
    desc: Node HTTP and detached temporary execution
    crit: hostile
    conf: 0.95
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: micro-behaviors/process/daemonize/detach::detached-true
      - id: objectives/execution/payload/file-exec/spawn/archive::node-temp-exec-staging-clues
