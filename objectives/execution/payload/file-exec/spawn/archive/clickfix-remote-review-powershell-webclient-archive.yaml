defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1105,T1204.002
  mbc: B0030



composite_rules:
  - id: clickfix-webclient-archive-launch
    desc: ClickFix URL, WebClient download, archive extraction and process launch
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/url/resource-path/content::clickfix-path-token
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
      - id: micro-behaviors/data/archive/extract/capability::powershell-expand-archive-command
      - id: micro-behaviors/process/create/cmdlet::start-process-call
    near_bytes: 8192
