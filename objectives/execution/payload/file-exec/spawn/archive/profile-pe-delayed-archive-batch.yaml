defaults:
  platforms: [windows]
  for: [pe]


composite_rules:
  - id: pe-hidden-attributes-archive-batch-exec-clues
    desc: PE hidden attributes, archive URL, batch path and WinExec clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/shell/command-string::pe-delayed-shell-remote-archive-clues
      - id: micro-behaviors/process/create/shell/command-string::pe-delayed-shell-variable-batch-clues
      - id: micro-behaviors/fs/file/attributes::pe-hidden-system-attribute-flags
      - id: metadata/binary/symbols/name/process::winexec
