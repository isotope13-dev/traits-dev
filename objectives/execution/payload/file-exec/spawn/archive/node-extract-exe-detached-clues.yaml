---
composite_rules:
- id: node-zip-extract-exe-walk-detached-clues
  desc: Node ZIP extraction, EXE walk, detached clues
  crit: suspicious
  conf: 0.96
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/archive/extract/zip::js-zip-extract-all-to
  - id: micro-behaviors/fs/directory/readdir/language::node-extname-exe-walk
  - id: micro-behaviors/process/daemonize/detach::detached-true
- id: node-zip-extract-http-decrypt-clues
  desc: Node ZIP extraction, HTTP and decrypt clues
  crit: suspicious
  conf: 0.97
  all:
  - id: objectives/execution/payload/file-exec/spawn/archive::node-zip-extract-exe-walk-detached-clues
  - id: micro-behaviors/communications/http/request/client::http-client-usage
  any:
  - id: metadata/import/module::local-decrypt-helper-import
  - id: micro-behaviors/crypto/decrypt/transform/unspecified::js-decrypt-helper-call
  - id: micro-behaviors/crypto/decrypt/transform/unspecified::javascript-decrypt-method-call
defaults:
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
