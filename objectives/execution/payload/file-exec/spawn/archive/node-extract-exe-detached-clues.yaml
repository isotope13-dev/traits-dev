---
composite_rules:
- id: node-passworded-remote-archive-executable-dropper
  desc: Downloads and launches a passworded archive payload
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.007
  all:
  - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
  - id: micro-behaviors/data/archive/extract/password::node-archive-extract-password-option
  - id: micro-behaviors/process/create/variable::spawn-destination-variable
  - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
  any:
  - id: micro-behaviors/os/privilege/elevation::node-elevated-powershell-runas-launch
  - id: objectives/supply-chain/trojanized/library/hidden-dep::npm-detached-child-process-marker
- id: node-zip-extract-exe-walk-detached-clues
  desc: Node ZIP extraction, EXE walk, detached clues
  crit: suspicious
  conf: 0.96
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/archive/extract/zip::js-zip-extract-all-to
  - id: micro-behaviors/fs/directory/readdir/language::node-extname-exe-walk
  - id: micro-behaviors/process/daemonize/detach::detached-true
- id: node-zip-extract-http-decrypt-clues
  desc: Node ZIP extraction, HTTP and decrypt clues
  crit: suspicious
  conf: 0.97
  all:
  - id: objectives/execution/payload/file-exec/spawn/archive::node-zip-extract-exe-walk-detached-clues
  - id: micro-behaviors/communications/http/request/client::http-client-usage
  any:
  - id: metadata/import/module::local-decrypt-helper-import
  - id: micro-behaviors/crypto/decrypt/transform/unspecified::js-decrypt-helper-call
  - id: micro-behaviors/crypto/decrypt/transform/unspecified::javascript-decrypt-method-call
defaults:
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
