defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, typescript, vbs, html]
  attack: T1105
  mbc: B0024



composite_rules:
  - id: node-remote-archive-script-launch
    desc: Node HTTPS, archive extraction and script-host launch
    crit: hostile
    conf: 0.99
    attack: T1059.005,T1059.007,T1105,T1204.002
    for: [javascript, typescript]
    near_bytes: 1600
    all:
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync
      - id: micro-behaviors/data/archive/extract/tar::node-spawn-tar-extract
      - id: micro-behaviors/data/archive/extract/tar::node-tar-extract-flag
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
      - id: micro-behaviors/process/interpreter/scripting::temp-script-host-path
