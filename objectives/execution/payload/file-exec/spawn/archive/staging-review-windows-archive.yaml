
composite_rules:
- attack: T1105
  for:
  - pe
  platforms:
  - windows
  id: wininet-temp-file-shell-execute-clues
  desc: WinINet, temp file and ShellExecute clues
  crit: hostile
  conf: 0.96
  mbc: B0024
  unless:
  - id: metadata/installer/product/
  - id: metadata/binary/resource/identity::pe-version-resource
  all:
  - id: micro-behaviors/communications/http/client/wininet::internet-open
  - id: micro-behaviors/communications/http/client/wininet::http-open-request
  - id: micro-behaviors/communications/http/client/wininet::http-send-request
  - id: micro-behaviors/communications/http/client/wininet::internet-read-file
  - id: micro-behaviors/os/sysinfo/directories::temp-path-api-name
  - id: micro-behaviors/fs/file/open/unspecified::file-create-win
  - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
  - id: micro-behaviors/os/handler/open::shell-execute
  any:
  - id: micro-behaviors/communications/url/resource-path/archive::wininet-image-file-zip-path
  - id: micro-behaviors/communications/url/resource-path/archive::wininet-download-zip-path
  - id: micro-behaviors/communications/url/resource-path/archive::wininet-upload-zip-path
  - id: micro-behaviors/fs/path/application/executable::hex-named-temp-exe-path-text
  - id: micro-behaviors/data/codec::rtl-decompress-buffer
  - id: metadata/build/manifest::require-administrator
  - id: micro-behaviors/data/format/mime::wildcard-application-mime
  needs: 2
