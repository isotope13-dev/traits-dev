defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1105
  mbc: B0024

composite_rules:
  - id: js-runtime-temp-staging-exec
    desc: Temp-staged JavaScript runtime executed
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/download/github::js-runtime-release-archive-url
      - id: micro-behaviors/fs/temp/directory::node-mkdtemp-os-tmpdir
      - id: micro-behaviors/process/create/variable::js-execfilesync-resolved-program
    unless:
      - id: well-known/app/development/cloudflare/
  - id: selfremoving-js-runtime-dropper
    desc: Downloaded JS runtime deleted after use
    conf: 0.96
    attack: T1070.004
    all:
      - id: objectives/execution/payload/file-exec/spawn/archive::js-runtime-temp-staging-exec
      - id: micro-behaviors/fs/delete/directory::fs-rm-recursive
    unless:
      - id: well-known/app/development/cloudflare/
