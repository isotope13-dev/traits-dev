defaults:
  platforms: [windows]
  for: [python]
  attack: T1027,T1497,T1564

traits:
  - id: python-score-else-exit
    desc: Python exits above a score threshold
    crit: notable
    if:
      type: text
      regex: 'if\s+[a-zA-Z_][a-zA-Z0-9_]*\s*<\s*0\.5\s*:\s*pass\s*else\s*:\s*exit\s*\(\s*0\s*\)'

composite_rules:
  - id: python-sandbox-gated-xor-archive-launch
    desc: Sandbox-gated XOR archive extraction and hidden launch
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-analysis/sandbox-detect/score::python-sandbox-score-call
      - id: python-score-else-exit
      - id: objectives/execution/payload/file-exec/spawn/archive::python-xor-archive-hidden-launcher
