defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
# A validated XOR-concealed executable header and a file-write/launch stub
# distinguish executable staging from an ordinary byte transform or extractor.
# The stub binds the written pathname to ShellExecute; no family is asserted.
composite_rules:
  - id: cyclic-xor-pe-file-launch
    desc: XOR-concealed PE with file-write and execution stub
    crit: hostile
    conf: 0.97
    attack: T1027,T1140
    all:
      - id: metadata/file/encoding/xor::visible-key-cyclic-xor-pe
      - id: micro-behaviors/data/encoding/xor/cyclic-key::x86-signed-remainder-byte-xor-loop
      - id: micro-behaviors/process/deploy/file-exec/spawn::x86-buffer-file-write-shell-launch-stub
      - id: micro-behaviors/fs/file/open/call::fopen
      - id: micro-behaviors/fs/write/file/handle/call::write--fwrite
      - id: micro-behaviors/os/handler/open::shell-execute-a
