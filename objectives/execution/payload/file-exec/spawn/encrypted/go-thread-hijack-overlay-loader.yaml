defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # A Go image that reads, writes and resumes a thread context, allocates
  # executable memory, carries a high-entropy overlay, and names the Startup
  # folder is a staged loader: the overlay is the encrypted stage, the thread
  # context is the hijack, and the Startup path is the persistence location.
  # The rule claims that structure, not a decoded payload.
  - id: go-thread-hijack-overlay-loader
    desc: Go loader hijacks a thread context and carries an encrypted overlay
    crit: hostile
    conf: 0.92
    attack: T1055.003,T1027,T1547.001
    all:
      - id: micro-behaviors/process/info/thread::thread-context-triple-no-suspend
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: metadata/binary/layout/entropy::overlay-entropy-at-least-6p5
      - id: micro-behaviors/fs/path/autostart::windows-startup-directory
