defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: hostile
  attack: T1027,T1140,T1620,T1622

composite_rules:
  - id: managed-anti-analysis-aes-process-stager
    desc: Managed anti-analysis gates AES stage writing and process launch
    conf: 0.97
    all:
      - id: objectives/anti-analysis/debugger-detect/loader::managed-profiler-debugger-failfast-startup
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/crypto/symmetric/aes/initialize::dotnet-aes-create-import
      - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor-text
      - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
      - id: micro-behaviors/process/create/exec::create-process-api-name
