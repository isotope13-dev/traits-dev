defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  # An unsigned native image whose executable resources carry most of its
  # bytes at high entropy, and which resolves APIs dynamically from a writable
  # entry, is a staged loader: the resource is the encrypted stage. Resource
  # APIs are resolved at runtime in these images, so no static resource-API
  # import is required. The rule claims the staging structure, not a decoded
  # payload.
  - id: native-unsigned-rwx-resource-loader
    desc: Unsigned native PE carries dominant encrypted RWX resources
    crit: hostile
    conf: 0.92
    attack: T1027,T1140,T1055
    all:
      - id: metadata/binary/resource/entropy::unsigned-dominant-rwx-resources
      - id: micro-behaviors/dylib/lookup::unsigned-writable-entry-high-entropy-api-lookup
