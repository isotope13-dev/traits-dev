# Replication intent is inferred by the objective wrapper; the byte-level
# self-copy/launch mechanism retains its matcher and severity in process/deploy.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]

composite_rules:
  - id: native-footer-self-replica-launch
    desc: Footer-controlled executable replication
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/deploy/file-exec::native-footer-replica-loop-layout
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/process/info/current::get-module-filename-wide
