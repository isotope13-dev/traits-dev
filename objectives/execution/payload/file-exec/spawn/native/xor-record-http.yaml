defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
  attack: T1105
composite_rules:
  - id: xor-record-http-native-file-launcher
    desc: HTTP task client writes and launches files
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/channel/http/beacon::mpress-mac-command-client
      - id: metadata/binary/instruction/sequence::x86-word-gated-buffer-write-close-handoff
      - id: micro-behaviors/process/create/exec::create-process-a
      - id: micro-behaviors/fs/write/file/handle::write-file

  # Reconstructed images may retain executable code but lose the import
  # directory. Require both the XOR command-record protocol and its checked
  # buffer -> write -> close -> path handoff. The original MPRESS import
  # stream resolves those helpers to WriteFile and CreateProcessA. Neither
  # family labels nor a particular C2 endpoint establishes this chain.
  # This profile reports code, not successful execution or network contact.
  - id: xor-record-http-file-launch-code
    desc: HTTP XOR task client with checked file-write and launch code
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/instruction/sequence::x86-command-record-header-check
      - id: micro-behaviors/data/encoding/xor::x86-inline-64-byte-key-xor-loop
      - id: micro-behaviors/communications/http/header/content-type::form-urlencoded-header-pe
      - id: micro-behaviors/communications/url/http-query::mpress-fragmented-mac-format
      - id: metadata/binary/instruction/sequence::x86-word-gated-buffer-write-close-handoff
    unless:
      - id: xor-record-http-native-file-launcher
