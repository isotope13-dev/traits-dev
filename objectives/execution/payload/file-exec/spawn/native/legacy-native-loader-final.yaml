defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
composite_rules:
- id: embedded-pe-resolver-process-network-clues
  desc: Embedded PE, manual resolver and process/network APIs
  crit: hostile
  conf: 0.95
  attack: T1620
  size_max: 524288
  all:
  - id: metadata/binary/layout/embedded::pe-embedded
  - id: micro-behaviors/os/api-resolution/manual::peb-export-resolver-x64
  - id: micro-behaviors/process/create/exec::create-process-api-name
  any:
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
  - id: micro-behaviors/communications/http/client/wininet::internet-open
  - id: micro-behaviors/process/terminate/kill::terminate-process
  needs: 2
  unless:
  - id: metadata/installer/product/
- id: packed-pe-network-process-api-profile
  desc: Packed PE with network, allocation and process APIs
  crit: hostile
  conf: 0.95
  attack: T1620
  all:
  - id: metadata/binary/layout/entropy::low-entropy-binary-with-dense-region
  - id: metadata/binary/instruction/sequence/unspecified::allocation-like-argument-patterns
  - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-pe-with-networking
  - id: micro-behaviors/process/create/exec::child-process-creation-evidence
  any:
  - id: micro-behaviors/communications/socket/connect/attempt::connect-api
  - id: micro-behaviors/communications/ip/resolve::resolve-getaddrinfo-import
  - id: micro-behaviors/crypto/symmetric/stream/sigma::chacha-salsa-constant
  needs: 2
- id: packed-temp-copy-shell-api-profile
  desc: Packed PE with temp-copy and ShellExecute APIs
  crit: hostile
  conf: 0.97
  attack: T1105
  mbc: B0024
  all:
  - id: micro-behaviors/fs/temp/directory::temp-copy-shellexec-api-profile
  any:
  - id: metadata/binary/section/label/packing::upx-section
  - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
  - id: micro-behaviors/os/service/dispatch::service-dispatch-triad
  needs: 2
  downgrade:
    any:
    - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-singlefile-host-context
    - id: well-known/lib/runtime/managed/jvm::jli-symbol-set
    - id: well-known/tool/packaging/jsmooth::jsmooth-java-launcher
    - id: well-known/lib/ui/flutter::flutter-windows-desktop-runner
    - id: well-known/lib/runtime/compiled/unity-il2cpp::unity-il2cpp-graphics-reference
    - id: micro-behaviors/os/service/name::bits-service-name-reference
    - id: well-known/app/media/windows-media-player::windows-media-player-name-reference
- id: file-xor-overwrite-process-api-profile
  desc: File read, XOR, overwrite and process API clues
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/binary/symbols/name/process::create-process-w
  - id: micro-behaviors/fs/file/open/unspecified::file-create-win
  - id: micro-behaviors/fs/read/file/handle::read-file
  - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
  - id: micro-behaviors/fs/file/truncate::set-end-of-file-win
  - id: micro-behaviors/data/bitwise/xor-forms/indexed::backward-byte-xor-loop-i386
  any:
  - id: micro-behaviors/fs/path/extension::exe-name-or-extension
  - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::rc4-bytecode
