defaults:
  mbc: E1059
  platforms:
  - unix
  - windows
  crit: suspicious
  attack: T1195.002
composite_rules:
- id: rust-build-rs-staged-payload-exec
  desc: build.rs stages and executes payload
  crit: hostile
  conf: 0.98
  for:
  - rust
  all:
  - id: objectives/execution/staging/store::rust-build-rs-staged-payload-write
  - id: micro-behaviors/process/create/subprocess/configure::rust-build-rs-exec-staged-path
  any:
  - id: "micro-behaviors/process/create/subprocess/launch::rust-command-status-call"
  - id: micro-behaviors/process/create/subprocess/capture::rust-build-rs-command-output
  - id: micro-behaviors/process/create/subprocess/launch::rust-command-spawn-call
  - id: micro-behaviors/fs/chmod/executable/mode::rust-executable-permissions
- id: cargo-build-hook-staged-payload-exec
  desc: Cargo build hook stages and executes native payload
  crit: hostile
  conf: 0.98
  for:
  - rust
  - crate
  - tar
  - cargo-toml
  scope: archive
  all:
  - id: "metadata/package/scripts/build::cargo-build-script-declared"
  - id: objectives/execution/payload/file-exec/spawn/native::rust-build-rs-staged-payload-exec
  any:
  - id: metadata/build/archive::archive-native-binary-entry
  - id: metadata/build/archive::archive-platform-native-binary-entry
- id: cargo-archive-build-rs-staged-payload-exec
  desc: Cargo archive build.rs stages and executes native payload
  crit: hostile
  conf: 0.98
  for:
  - rust
  - crate
  - cargo-toml
  - tar
  scope: archive
  all:
  - id: metadata/build/archive::archive-cargo-crate-build-script
  - id: objectives/execution/payload/file-exec/spawn/native::rust-build-rs-staged-payload-exec
  any:
  - id: metadata/build/archive::archive-native-binary-entry
  - id: metadata/build/archive::archive-platform-native-binary-entry
  unless:
  - id: "metadata/package/scripts/build::cargo-build-script-declared"
