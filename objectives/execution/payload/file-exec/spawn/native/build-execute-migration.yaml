defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
  attack: T1195.002
composite_rules:
  - id: rust-build-rs-temp-embedded-detached-exec
    desc: Build script launches an embedded temp executable detached
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1059,T1564.003
    mbc: E1059
    for:
      - rust
    all:
      - id: metadata/build/ecosystem::cargo-build-script-basename
      - id: metadata/lang/source/syntax/directive::rust-include-bytes
      - id: micro-behaviors/os/sysinfo/directories::rust-temp-dir
      - id: micro-behaviors/fs/write/file/full/unspecified::fs-write
      - id: micro-behaviors/fs/chmod/executable/mode::rust-executable-permissions
      - id: metadata/lang/source/syntax/argument::rust-indirect-command-new
      - id: micro-behaviors/process/create/subprocess/launch::rust-command-spawn-call
      - id: micro-behaviors/process/daemonize/spawn::rust-spawn-detached-unix
      - id: micro-behaviors/process/fd/stdio::rust-child-stdout-null
      - id: micro-behaviors/process/fd/stdio::rust-child-stderr-null
