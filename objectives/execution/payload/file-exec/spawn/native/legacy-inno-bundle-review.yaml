defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: identity-mismatch-appended-7z-spawn
  desc: Identity-mismatched PE reads an appended 7-Zip archive and spawns
  crit: hostile
  conf: 0.99
  attack: T1036.005,T1027.009,T1105
  all:
  - id: objectives/evasion/masquerade/version-resource/contradiction::softwareok-free-manga-identity-contradiction
  - id: micro-behaviors/data/embedded/payload/archive::late-embedded-7z-archive
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
  - id: micro-behaviors/process/create/exec::child-process-creation-evidence
  unless:
  - id: metadata/installer/product::known-installer-context
