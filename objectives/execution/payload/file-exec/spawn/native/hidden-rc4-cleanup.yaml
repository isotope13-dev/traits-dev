defaults:
  platforms: [linux]
  for: [elf]
  arch: [aarch64]
composite_rules:
  # The former temp-staging rule required only same-file symbol text. Static
  # libc contains those operations even when application code never uses them.
  # Require the linked hidden transform -> input deletion -> chmod(0755) ->
  # same-output execl path, plus hex key parsing and RC4 scheduling.
  # The external ciphertext/key and the output payload are not embedded.
  - id: static-hidden-tmp-payload-exec-stub
    desc: Hidden RC4 staging deletes input before execution
    crit: hostile
    conf: 0.95
    attack: T1027,T1564.001,T1070.004
    all:
      - id: metadata/binary/linking/records::elf-dynamic-linker-metadata-and-needed-libs-absent
      - id: micro-behaviors/fs/path/hidden::hidden-tmp-file-cluster
      - id: micro-behaviors/data/decode/hex-pair::aarch64-sscanf-hex-byte-loop
      - id: micro-behaviors/crypto/symmetric/stream/rc4/key-schedule::rc4-swap-pattern
      - id: micro-behaviors/process/deploy/file-exec/spawn::aarch64-hidden-transform-cleanup-exec
