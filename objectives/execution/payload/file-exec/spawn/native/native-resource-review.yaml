# Reviewed native staging evidence; descriptions name the observed mechanism.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: winword-claim-temp-write-process
  desc: WinWord claim with temp, write and process APIs
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/signature/absent::unsigned-missing-signature-record
  - id: objectives/evasion/masquerade/version-resource/office-suite::fake-winword-version-resource
  - id: micro-behaviors/fs/read/file/handle::pe-wide-module-path-file-io-imports
  - id: metadata/binary/section/entropy::large-high-entropy-writable-data-section
  - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
  - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
  - id: micro-behaviors/process/config/launch::x86-create-no-window-immediate
  - id: metadata/binary/symbols/name/process::create-process-w
  unless:
  - id: objectives/impact/infect/binary/rewrite::repeated-standard-pe-overlay-infector
  - id: objectives/impact/infect/binary/rewrite::self-copying-repeated-pe-image-stack
  attack: T1036.005,T1106
- id: xor-profile-file-process-api-clues
  desc: XOR, user-profile file and process API clues
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/data/bitwise/xor-forms/indexed::x64-mask-xor-buffer-loop
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  - id: micro-behaviors/fs/path/location::shell-get-folder-path-a
  - id: micro-behaviors/dylib/lookup::get-module-handle-ansi
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  - id: micro-behaviors/fs/file/open/unspecified::createfile-api-text-reference
  - id: micro-behaviors/fs/write/file/handle/unspecified::writefile-api-text-reference
  - id: micro-behaviors/process/create/exec::create-process-api-name
  - id: micro-behaviors/fs/delete/file/library::deletefile-a-text
  unless:
  - id: metadata/installer/product/
  attack: T1106,T1140
- id: gcm-resource-temp-process-clues
  desc: GCM resource, temp and child-process clues
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/binary/resource/entropy::dominant-high-entropy-resources
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/crypto/decrypt/transform/symmetric::bcrypt-gcm-decrypt-api-set
  - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-import
  - id: metadata/binary/symbols/name/process::create-process-w
  unless:
  - id: metadata/installer/product/
  attack: T1106,T1140
- id: xor-resource-random-file-process-clues
  desc: XOR resource, random filename and process clues
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/binary/layout/embedded::pe-embedded
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/data/bitwise/xor-forms/indexed::x86-copy-byte-xor-loop
  - id: micro-behaviors/fs/file/create::gcc-random-lowercase-exe-name
  - id: micro-behaviors/fs/write/file/handle/unspecified::write--fwrite
  - id: metadata/binary/symbols/name/process::create-process-a
  unless:
  - id: metadata/installer/product/
  attack: T1106,T1140
- id: delphi-resource-crypto-process-clues
  desc: Delphi resource, crypto and process clues
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/lang/compiler/managed::delphi
  - id: metadata/binary/layout/ratio::overlay-over-90pct
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-keyword
  - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2
  - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
  - id: metadata/binary/symbols/name/process::create-process-w
  - id: micro-behaviors/os/privilege/token/use::adjust-token-privileges-any
  unless:
  - id: metadata/installer/product/
  attack: T1106,T1140
