defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: npm-preinstall-sectionless-elf-dropper
  desc: npm preinstall executes sectionless bundled ELF
  crit: hostile
  conf: 0.97
  attack: T1195.002,T1105
  mbc: B0024,F0011
  for: [npm, tar, package.json, elf]
  scope: archive
  all:
  - id: metadata/package/scripts/command::preinstall-direct-extensionless-path
  - id: metadata/binary/section/header::elf-no-section-headers
  - id: metadata/binary/header/program::elf-entry-in-last-segment
