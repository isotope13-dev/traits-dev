  - id: micro-behaviors/communications/socket/receive::recv-symbol
  - id: micro-behaviors/fs/write/file/handle::write--fwrite
  - id: micro-behaviors/fs/chmod/modify::chmod-symbol
  - id: micro-behaviors/fs/path/temp::hidden-tmp-path
  any:
  - id: micro-behaviors/fs/path/log/application::stop-log-path-reference
  - id: micro-behaviors/process/info/name::bracketed-kworker-name-reference
  - id: micro-behaviors/communications/http/query::formatted-get-query-template
  needs: 1
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/sysadmin/unix-benign/
  - id: metadata/path::test-directory-component
