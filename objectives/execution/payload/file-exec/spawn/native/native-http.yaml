defaults:
  platforms:
  - linux
  - macos
  for:
  - elf
  - macho
  attack: T1105,T1071.001
  mbc: B0030
  crit: hostile
composite_rules:
- id: linux-fexecve-http-downloader
  desc: HTTP XOR loader with memfd and fexecve APIs
  conf: 0.97
  platforms:
  - linux
  for:
  - elf
  size_max: 131072
  all:
  - id: metadata/binary/symbols/name/process::fexecve-import
  - id: objectives/execution/payload/file-exec/spawn/native::xor-anonymous-stage-loader
  - id: micro-behaviors/communications/http/get::get
  - id: micro-behaviors/communications/http/message::http-header-field-delimiter
  - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
  - id: micro-behaviors/communications/socket/connect/attempt::connect-import
  - id: micro-behaviors/communications/socket/create::posix-socket-import
  any:
  - id: micro-behaviors/fs/path/log/application::stop-log-path-reference
  - id: micro-behaviors/process/info/name::per-cpu-kworker-name-reference
  - id: micro-behaviors/communications/http/request/query::formatted-get-query-template
  needs: 1
- id: linux-fexecve-tcp-downloader
  desc: TCP loader with fexecve execution references
  conf: 0.96
  platforms:
  - linux
  for:
  - elf
  size_max: 131072
  all:
  - id: metadata/binary/symbols/name/process::fexecve-import
  - id: objectives/execution/payload/file-exec/spawn/native::xor-anonymous-stage-loader
  - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
  - id: micro-behaviors/communications/socket/connect/attempt::connect-import
  - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: micro-behaviors/communications/socket/receive::recv-symbol
  any:
  - id: micro-behaviors/fs/path/log/application::stop-log-path-reference
  - id: micro-behaviors/process/info/name::per-cpu-kworker-name-reference
  needs: 1
  unless:
  - id: linux-fexecve-http-downloader
- id: linux-fexecve-tcp-stage-loader
  desc: TCP receive and fexecve stage loader indicators
  conf: 0.96
  platforms:
  - linux
  for:
  - elf
  size_max: 131072
  all:
  - id: metadata/binary/symbols/name/process::fexecve-import
  - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
  - id: micro-behaviors/communications/socket/connect/attempt::connect-import
  - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: micro-behaviors/communications/socket/receive::recv-symbol
  any:
  - id: micro-behaviors/fs/path/log/application::stop-log-path-reference
  - id: micro-behaviors/process/info/name::per-cpu-kworker-name-reference
  needs: 1
  unless:
  - id: linux-fexecve-tcp-downloader
  - id: linux-fexecve-http-downloader
- id: linux-kworker-name-fexecve-tcp-stager
  desc: TCP fexecve stager referencing kworker process name
