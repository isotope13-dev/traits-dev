defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
composite_rules:
  # The outer reader restores its original host and its appended infector,
  # then passes their paths to the same CreateProcessA helper. Admission
  # requires the matching three-image writer, not a chosen product name.
  - id: footer-bound-host-and-infector-launch
    desc: Footer-based host restoration with embedded infector launch
    crit: hostile
    conf: 0.98
    attack: T1106,T1554
    all:
      - id: micro-behaviors/data/parse/binary::x86-path-triple-length-footer-reader
      - id: micro-behaviors/process/create/exec::create-process-a
      - id: micro-behaviors/data/serialize/binary::x86-three-stream-footer-writer
