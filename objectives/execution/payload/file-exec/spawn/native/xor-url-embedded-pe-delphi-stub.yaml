# A small Borland-built stub with a writable and executable code section and
# a large high-entropy body that holds embedded PEs. Its HTTP URL only
# appears after an XOR decode, and its imports are built around WinExec and
# process control. That combination is a dropper: the embedded files are the
# cargo and the hidden URL is where it reports or fetches more.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027,T1105,T1204.002
composite_rules:
  - id: xor-hidden-url-dropper-with-high-entropy-body
    desc: XOR-hidden URL dropper with WinExec
    crit: hostile
    conf: 0.85
    all:
      - id: metadata/binary/layout/entropy::high-entropy-region-mass-64k
      - id: metadata/binary/section/header::writable-entry-with-wx-section
      - id: micro-behaviors/communications/url/encoded::binary-xor-http-url
      - id: micro-behaviors/process/create/exec::winexec
    unless:
      - id: metadata/signed/platform/
