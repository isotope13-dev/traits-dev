defaults:
  platforms:
  - windows
  for:
  - pe
  crit: hostile
  conf: 0.97
composite_rules:
- id: signed-resource-process-api-clues
  desc: Signed resource, checksum and process API clues
  all:
  - id: metadata/binary/layout/checksum::certificate-directory-checksum-mismatch
  - id: metadata/binary/resource/identity::dos-header-prefix-in-resource
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
  any:
  - id: metadata/binary/symbols/name/process::create-process-w
  - id: micro-behaviors/os/handler/open::shell-execute
- id: initengine-resource-winexec-clues
  desc: InitEngine command and resource WinExec clues
  all:
  - id: micro-behaviors/data/format/command::initengine-rundll-argument-template
  - id: micro-behaviors/data/embedded/payload/resource::unsigned-resource-winexec-api-profile
  unless:
  - id: metadata/installer/product/
- id: resource-winexec-dll-export-clues
  desc: Resource WinExec and DLL export command clues
  all:
  - id: micro-behaviors/data/embedded/payload/resource::unsigned-resource-winexec-api-profile
  any:
  - id: micro-behaviors/process/argument/file::dll-export-argument-command-format
  - id: micro-behaviors/process/argument/file::dll-init-export-command-format
  unless:
  - id: metadata/installer/product/
