defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: nsis-document-lure-opaque-overlay-spawn
  desc: NSIS document lure with opaque overlay and process-launch APIs
  crit: hostile
  conf: 0.98
  attack: T1027.009,T1105,T1204.002
  all:
  - id: well-known/tool/packaging/nsis::nsis
  - id: metadata/binary/layout/overlay::nsis-dominant-opaque-overlay
  - id: metadata/binary/layout/entropy::high-entropy-overlay
  - id: metadata/signature/absent::unsigned-missing-signature-record
  - id: objectives/evasion/masquerade/file/lure::nsis-document-or-version-lure
  - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
  - id: metadata/binary/symbols/name/process::create-process-w
  any:
  - id: micro-behaviors/os/handler/open::shell-execute-ex
  - id: micro-behaviors/os/registry/value/write::registry-set-value-api
  - id: micro-behaviors/os/privilege/token/use::adjust-token-privileges
  needs: 1
  unless:
  - id: metadata/installer/product/
