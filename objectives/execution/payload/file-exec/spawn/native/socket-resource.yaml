defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

composite_rules:
  - id: self-deleting-resource-loader-socket-payload-transfer
    desc: Self-deleting resource loader receives streamed payload data
    crit: hostile
    conf: 0.98
    attack: T1105
    all:
      - id: metadata/binary/resource/embedded-media::encrypted-zip-rsrc-pe
      - id: micro-behaviors/process/deploy/file-exec/spawn::x86-resource-buffer-stage-launch
      - id: objectives/evasion/self-delete/file/script::x86-module-path-retry-delete-batch
      - id: micro-behaviors/data/bitwise/complement::x86-indexed-buffer-complement-loop
      - id: micro-behaviors/communications/socket/receive::x86-length-prefixed-recv-forward
