# The bound resource-to-file activation is neutral on its own. Concealed
# executable delivery plus own-image cleanup and complemented on-disk state
# admits this covert loader profile, independently of filenames and Run writes.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

composite_rules:
  - id: self-deleting-complement-state-resource-loader
    desc: Self-deleting concealed-state resource loader
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/deploy/file-exec/spawn::x86-resource-buffer-stage-launch
      - id: metadata/binary/resource/embedded-media::encrypted-zip-rsrc-pe
      - id: objectives/evasion/self-delete/file/script::x86-module-path-retry-delete-batch
      - id: micro-behaviors/data/codec::x86-byte-complement-512
      - id: metadata/binary/instruction/sequence::x86-msmp-state-magic-compare

  - id: encrypted-zip-resource-payload-launcher
    desc: Concealed encrypted-resource payload extraction and execution
    crit: hostile
    conf: 0.98
    attack: T1105,T1070.004
    all:
      - id: metadata/binary/resource/embedded-media::encrypted-zip-rsrc-pe
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/process/create/shellexec::shell-execute
      - id: micro-behaviors/data/codec::x86-byte-complement-512
      - id: metadata/binary/instruction/sequence::x86-msmp-state-magic-compare
      - id: micro-behaviors/fs/delete/file/command::retry-delete-batch-template
