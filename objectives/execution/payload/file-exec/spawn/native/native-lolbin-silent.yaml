# Unwanted fetch-and-install prepared inside an unsigned native binary.
# Admission: the binary is unsigned and composes two different signed-LOLBin
# download commands plus an unattended install switch. Legitimate installers
# ship their own download logic; they do not embed certutil, bitsadmin and
# curl command templates side by side to fetch a payload and install it
# without prompting (ATT&CK T1105 acquisition, T1218.007 MSI install).
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: unsigned-lolbin-silent-install-chain
    desc: Unsigned binary prepares LOLBin downloads and silent installs
    crit: hostile
    conf: 0.95
    attack: T1105,T1218.007
    all:
      - id: micro-behaviors/process/create/installer::quiet-norestart-switch-combo
      - id: metadata/signed/trust-level::unsigned
    any:
      - id: micro-behaviors/communications/http/download/cli::certutil-urlcache-download-template
      - id: micro-behaviors/communications/http/download/cli::bitsadmin-transfer-download-template
      - id: micro-behaviors/communications/http/download/curl::curl-remote-output-template
    needs: 2
