defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
  attack: T1105,T1027,T1059.001
  mbc: B0024
composite_rules:
  - id: node-named-postinstall-passworded-pe-launch
    desc: Node postinstall-named script launches temp PE
    crit: hostile
    conf: 0.98
    for:
      - javascript
      - typescript
    all:
      - id: metadata/package/files/lifecycle::postinstall-js-file
      - id: metadata/file/profile/archive::node-spawn-password-stdout-clues
      - id: metadata/file/profile/pe-api::node-pe-magic-offset-read-clues
      - id: metadata/file/profile/process/artifact::node-temp-exe-name-path-clues
      - id: micro-behaviors/process/create/command::start-process-temp-executable
    any:
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: micro-behaviors/communications/http/download/handler::node-https-get-write-stream-pipe
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file-text
  - id: npm-archive-passworded-pe-launch
    desc: npm archive with passworded PE launch clues
    crit: hostile
    conf: 0.98
    for:
      - npm
      - tar
      - javascript
    scope: archive
    all:
      - id: objectives/execution/payload/file-exec/spawn/native::node-named-postinstall-passworded-pe-launch
      - id: metadata/filename/identity::package-json-basename
