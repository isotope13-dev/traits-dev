defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # The false Office identity supplies admission; resource extraction and a
  # process API alone also occur in ordinary installers. The decoder handles
  # all three modulo residues, with its keys taken from the resource header.
  # This static profile does not claim an HTTP source or successful execution.
  - id: office-claim-decoded-resource-dll-launch
    desc: Office-claim resource decoder with rundll32 launch profile
    crit: hostile
    conf: 0.96
    attack: T1140,T1218.011
    all:
      - id: objectives/evasion/masquerade/version-resource/claim::unsigned-office-claim-resource-dropper
      - id: micro-behaviors/fs/path/system::rundll32-system32-path
      - id: micro-behaviors/process/argument/file::dll-init-export-command-format
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/process/create/exec::create-process-a
    unless:
      - id: metadata/signed/platform/
