defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009

composite_rules:
  - id: fragmented-pe-autoit-ea06-archive-dropper
    desc: Archive rebuilds PE for padded EA06 payload
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1059.003
    scope: archive
    for: [cab, pe, 7z, zip, batch, data]
    all:
      - id: metadata/lang/compiled::autoit-ea06-offset-padded-header
      - id: micro-behaviors/fs/write/file/redirect::batch-set-prompt-mz-redirect
      - id: micro-behaviors/fs/file/concat::cmd-binary-file-concatenation
      - id: micro-behaviors/process/create/path-execution::start-unquoted-executable-command
