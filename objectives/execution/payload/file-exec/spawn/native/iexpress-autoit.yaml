defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009

traits:
  - id: iexpress-autoit-script-payload
    desc: IExpress cabinet launches AutoIt script payload
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)"AutoIt3\.exe"\s+[^\r\n"]{1,80}\.a3x\b'

  - id: iexpress-autoit-au3-payload
    desc: AutoIt source launched by IExpress
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)"AutoIt3\.exe"\s+[^\r\n"]{1,80}\.au3\b'

composite_rules:
  - id: iexpress-autoit-packed-dropper
    desc: IExpress wrapper launches a packed AutoIt payload
    crit: hostile
    conf: 0.99
    all:
      - id: iexpress-autoit-script-payload
      - id: metadata/binary/installer/sfx::wextract-tool
      - id: metadata/lang/compiled::autoit-script-resource-entry
      - id: metadata/lang/compiled::autoit-runtime-resource-entry
      - id: metadata/binary/layout/entropy::peak-region-entropy-7p5
      - id: metadata/binary/layout/entropy::binary-peak-region-mass-over-8k
      - id: metadata/signed/trust-level::unsigned-missing-signature-record

  - id: iexpress-tampered-autoit-au3-dropper
    desc: IExpress launches tampered AutoIt source
    crit: hostile
    conf: 0.99
    all:
      - id: iexpress-autoit-au3-payload
      - id: metadata/binary/installer/sfx::wextract-tool
      - id: metadata/lang/compiled::autoit-au3-resource-entry
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch

  - id: fragmented-pe-autoit-ea06-archive-dropper
    desc: Archive rebuilds PE for padded EA06 payload
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1059.003
    scope: archive
    for: [cab, pe, 7z, zip, batch, data]
    all:
      - id: metadata/lang/compiled::autoit-ea06-offset-padded-header
      - id: micro-behaviors/fs/write/file/redirect::batch-set-prompt-mz-redirect
      - id: micro-behaviors/fs/file/concat::cmd-binary-file-concatenation
      - id: micro-behaviors/process/create/shell/command-mode::start-unquoted-executable-command
