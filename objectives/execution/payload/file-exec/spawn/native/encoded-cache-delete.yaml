defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: xor-concealed-cache-download-process-reboot-delete
    desc: Concealed cache download and process/self-delete APIs
    crit: hostile
    conf: 0.96
    attack: T1105,T1204.002,T1070.004
    all:
      - id: micro-behaviors/data/encoding/xor::native-xor-variadic-positive-values
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-cache-str
      - id: micro-behaviors/process/create/exec::create-process-a
      - id: micro-behaviors/fs/delete/file/reboot::x86-movefileex-delete-reboot-arguments
