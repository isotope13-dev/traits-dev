# File-stage chain classified by direct process or shell-handler launch.
defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
  attack: T1027
  mbc: C0025

composite_rules:

  - id: dotnet-encrypted-resource-hidden-process-stager
    for: [pe]
    desc: Unsigned .NET resource stager prepares a hidden child-process launch
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1140,T1059
    mbc: B0009.014
    # Keep the hidden process launch bound to the resource/decrypt/write chain.
    # Large application frameworks commonly contain all of these capabilities
    # in separate subsystems without staging a child-process payload.
    near_bytes: 8192
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
      - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
      - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
      - id: metadata/binary/symbols/name/process::dotnet-processstartinfo-name
      - id: micro-behaviors/process/config/window::dotnet-console-window-option-reference
    unless:
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
      - id: well-known/app/system/stresstimulus::logicnp-cryptolicensing
