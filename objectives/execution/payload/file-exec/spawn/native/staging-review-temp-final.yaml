defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: temp-self-read-write-pe-launch-profile
  desc: Temp, self-read, PE check and launch API profile
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/process/info/current::get-module-filename-wide
  - id: micro-behaviors/fs/file/open/unspecified::file-create-win
  - id: micro-behaviors/fs/read/file/handle::read-file
  - id: micro-behaviors/os/sysinfo/directories::temp-path-api-name
  - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
  - id: micro-behaviors/os/handler/open::shell-execute
  - id: micro-behaviors/fs/file/pe-inspect::inline-pe-signature-check
- id: multi-pe-drive-temp-write-launch-profile
  desc: Multi-PE drive, temp, write and launch references
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/binary/layout/embedded::repeated-standard-pe-images
  - id: metadata/binary/layout/size::large-overlay-1mb
  - id: micro-behaviors/fs/enumerate/drives::logical-drive-type-enumeration
  - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
  - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
  - id: micro-behaviors/os/handler/open::shell-execute-a
