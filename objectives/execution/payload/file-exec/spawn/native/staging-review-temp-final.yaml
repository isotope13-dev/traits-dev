defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: temp-self-read-write-pe-launch-profile
  desc: Temp, self-read, PE check and launch API profile
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/process/info/current::get-module-filename-wide
  - id: micro-behaviors/fs/file/open::file-create-win
  - id: micro-behaviors/fs/read/file/handle::read-file
  - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-name
  - id: micro-behaviors/fs/write/file/handle::write-file
  - id: micro-behaviors/process/create/shellexec::shell-execute
  - id: micro-behaviors/fs/file/pe-inspect::inline-pe-signature-check
  unless:
  - id: metadata/signed/platform/
- id: dotnet-temp-embedded-pe-launch-profile
  desc: Dotnet embedded PE and temp launch clues
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: micro-behaviors/data/embedded/resource::dotnet-getmanifestresourcestream
  - id: micro-behaviors/fs/path/temp::dotnet-gettemppath-token
  - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
  any:
  - id: metadata/file/profile/process/creation-api::dotnet-process-start-split-tokens
  - id: metadata/binary/symbols/name/process::dotnet-processstartinfo-name
  unless:
  - id: metadata/signed/platform/
- id: multi-pe-drive-temp-write-launch-profile
  desc: Multi-PE drive, temp, write and launch references
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/binary/layout/embedded::repeated-standard-pe-images
  - id: metadata/binary/layout/size::large-overlay-1mb
  - id: micro-behaviors/fs/enumerate/drives::logical-drive-type-enumeration
  - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
  - id: micro-behaviors/fs/write/file/handle::write-file
  - id: micro-behaviors/process/create/shellexec::shell-execute-a
  unless:
  - id: metadata/signed/platform/
