# GZip and VB late binding alone do not establish hostile staging. Require
# the executable launch configuration and a Defender exclusion command.
# These are file-scoped observations; their co-occurrence does not by itself
# resolve the output pathname or prove that an exclusion succeeds.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: managed-gzip-temp-launch-with-defender-exclusion
    desc: GZip temp EXE launcher with AV exclusion command
    crit: hostile
    conf: 0.96
    attack: T1204.002,T1562.001
    all:
      - id: micro-behaviors/data/embedded/resource::dotnet-resource-reader-access
      - id: micro-behaviors/data/codec::dotnet-gzip-compression
      - id: metadata/file/profile/file-write-api::dotnet-writeallbytes-token
      - id: metadata/file/profile/process::dotnet-process-start-split-tokens
      - id: micro-behaviors/process/config::managed-temp-exe-launch-record
      - id: micro-behaviors/os/security/defender::defender-exclusion-command-reference
