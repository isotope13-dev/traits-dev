defaults:
  platforms:
  - windows
  for:
  - python
  attack: T1105
  mbc: B0023
composite_rules:
- id: python-pe-stager-chain
  desc: Python temporary-file, rename, process and removal clues
  crit: hostile
  conf: 0.97
  near_lines: 120
  all:
  - id: micro-behaviors/fs/temp/mktemp
  - id: micro-behaviors/fs/file/rename
  - id: micro-behaviors/process/create/subprocess/launch::python-process-launch-evidence
  - id: micro-behaviors/process/config/launch::creationflags
  - id: micro-behaviors/fs/delete/file/library::py-remove
  any:
  - id: micro-behaviors/fs/file/rename::rename-target-exe
  - id: micro-behaviors/data/format/executable/magic::exec-format-magic-reference
  - id: objectives/evasion/masquerade/file/prefix::artifact-prefix-masquerade
  downgrade:
    any:
    - id: metadata/path/directory::test-directory-component
