# File-stage chain classified by direct process or shell-handler launch.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1105,T1204.002
  size_min: 1048576

composite_rules:
  - id: special-folder-encrypted-overlay-dropper
    desc: Special-folder drop from encrypted PE overlay
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/layout/overlay::large-high-entropy-overlay
      - id: micro-behaviors/fs/path/location::shell-get-folder-path-a
      - id: micro-behaviors/fs/directory/create::create-directory-a
      - id: micro-behaviors/fs/file/open/unspecified::file-create-win
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
      - id: micro-behaviors/os/handler/open::shell-execute
    any:
      - id: objectives/evasion/masquerade/path::microsoft-windowshelper-dir
      - id: objectives/evasion/masquerade/path::helper-exe-format-path
    unless:
      - id: metadata/installer/product/
      # Generic CLR-name text also occurs in unrelated native PE overlays.
