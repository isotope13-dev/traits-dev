defaults:
  for: [pe]
  platforms: [windows]
  attack: T1027.009,T1140

composite_rules:
  # A repair utility may write MZ; an installer may write and launch files.
  # Require the concealed API resolver as well. No filename or collector
  # identity is needed, and each required operation remains visible alone.
  - id: header-restoring-hashed-api-file-stager
    desc: MZ-restoring file stager with hashed APIs and launch
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/embedded/payload/header::restore-dos-magic-byte-stores-x86
      - id: objectives/anti-static/obfuscation/imports/api-hashing::loadlibrarya-ror13-hash
      - id: objectives/anti-static/obfuscation/imports/api-hashing::getprocaddress-ror13-hash
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/process/create/shellexec::shell-executeex-call
