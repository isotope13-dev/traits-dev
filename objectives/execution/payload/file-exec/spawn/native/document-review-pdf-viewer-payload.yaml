defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll, binaries, source]
  attack: T1140
  mbc: B0032


composite_rules:
  - id: document-xor-temp-child-stager
    for: [c]
    desc: Document XOR temp executable launcher
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/format/pdf::document-format-marker
      - id: micro-behaviors/fs/path/executable::windows-temp-executable-source
      - id: metadata/binary/symbols/name/process::create-process-a
    any:
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::indexed-xor-array-assignment
      - id: micro-behaviors/data/property/assign::indexed-value-xor-assignment
