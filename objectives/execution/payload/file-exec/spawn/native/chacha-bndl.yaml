# File-stage chain classified by direct process or shell-handler launch.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:

- id: temp-exe-dropper-launcher
  desc: BNDL temp-file and process-launch clues
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/data/archive/custom::bndl-exe-archive
  - id: micro-behaviors/os/sysinfo/directories::temp-path-api-reference
  - id: micro-behaviors/fs/directory/create::create-directory-w
  - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
  - id: metadata/binary/symbols/name/process::create-process-w
  any:
  - id: micro-behaviors/time/query::get-tick-count
  - id: micro-behaviors/fs/file/open/unspecified::file-create-win
  unless:
  - id: metadata/installer/product/

- id: chacha-bndl-temp-exe-dropper
  desc: BNDL temp launch with ChaCha/Salsa clues
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/anti-static/obfuscation/payload/encrypted::bndl-chacha-high-entropy-rdata
  - id: temp-exe-dropper-launcher
