defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  # A PowerShell script that decodes Base64 data and builds a ProcessStartInfo
  # from obfuscated variables, then starts it with Diagnostics.Process.Start,
  # launches a payload it has just assembled. The decoded value is the target,
  # not a fixed command, so the rule claims the staged launch.
  - id: powershell-decoded-process-launcher
    desc: PowerShell decodes Base64 and starts an obfuscated process launch
    crit: hostile
    conf: 0.93
    attack: T1059.001,T1027,T1140
    scope: file
    all:
      - id: micro-behaviors/process/create/subprocess/launch::powershell-diagnostics-process-start
      - id: micro-behaviors/process/create/subprocess/configure::powershell-processstartinfo-object
      - id: objectives/anti-static/obfuscation/name-mangling/variables::ps-alternating-alphanumeric-vars
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
