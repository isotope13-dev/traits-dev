composite_rules:
- platforms:
  - unix
  - windows
  for:
  - npm
  - javascript
  id: npm-raw-github-download-spawn-clues
  desc: npm raw GitHub, download and spawn clues
  crit: suspicious
  conf: 0.94
  attack: T1105,T1059
  scope: archive
  all:
  - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-refs
  - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
  any:
  - id: micro-behaviors/process/create/exec::spawn-node-process
  - id: metadata/file/profile/execution-api::spawn-bash
- platforms:
  - windows
  for:
  - powershell
  id: powershell-com-archive-base64-write-launch
  desc: PowerShell COM archive and encoded launch clues
  crit: hostile
  conf: 0.99
  attack: T1105,T1027,T1059.001
  all:
  - id: micro-behaviors/data/archive/extract/capability::powershell-http-shell-com-extraction
  - id: objectives/execution/payload/file-exec/spawn/runtime::powershell-base64-write-start-process-clues
  near_lines: 80
