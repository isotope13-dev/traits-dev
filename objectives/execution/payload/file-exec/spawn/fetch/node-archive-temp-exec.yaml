defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
  attack: T1105
  mbc: B0024
composite_rules:
  - id: node-http-archive-temp-exec
    desc: Node HTTP, archive and temporary execution
    crit: hostile
    conf: 0.98
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: metadata/file/profile/archive::node-archive-library-or-extract-clues
      - id: micro-behaviors/process/deploy/file-exec/spawn::node-temp-exec-context
  - id: node-http-detached-temp-exec
    desc: Node HTTP and detached temporary execution
    crit: hostile
    conf: 0.95
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: metadata/file/profile/command-options::detached-true
      - id: micro-behaviors/process/deploy/file-exec/spawn::node-temp-exec-context
