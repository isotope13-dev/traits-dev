defaults:
  platforms: [windows, unix]
  for: [javascript]

composite_rules:
  - id: obfuscated-wsh-counter-exe-dropper-v2
    desc: Obfuscated WSH counter EXE dropper
    crit: hostile
    conf: 0.98
    attack: T1059.007, T1105, T1027
    mbc: B0017, B0018, B0032
    all:
      - id: metadata/lang/source/shape::js-eval-assignment-return
      - id: metadata/file/profile/function-population::many-no-param-functions
      - id: metadata/lang/source/literal/fragment/single::msxml-name-fragments
      - id: metadata/file/profile/url-construction::fragmented-counter-query-clues
      - id: metadata/file/profile/process/launch::temp-exe-staging-alt
  - id: obfuscated-wsh-http-exe-dropper
    desc: Obfuscated WSH HTTP EXE dropper
    crit: hostile
    conf: 0.97
    attack: T1059.007, T1105, T1027
    mbc: B0017, B0018, B0032
    all:
      - id: metadata/lang/source/shape::js-eval-assignment-return
      - id: metadata/file/profile/transfer/http-download::fragmented-temp-save-url-clues
      - id: metadata/file/profile/download-execution::fragmented-temp-exe-run-clues
      - id: metadata/lang/source/literal/fragment/syntax::un-fn-text-fragment
    any:
      - id: metadata/build/minifier::minified-text-shape
      - id: "metadata/file/profile/identifier-population::sequential-identifiers"
  - id: obfuscated-wsh-http-exe-download-launch
    desc: Obfuscated WSH retrieves a remote executable, saves it, and launches it
    crit: hostile
    conf: 0.98
    attack: T1059.007, T1105, T1204.002
    mbc: B0017, B0024
    all:
      - id: micro-behaviors/communications/http/client/xmlhttp::http-client-any-obfuscated
      - id: micro-behaviors/communications/url/encoded::base64-decoded-ipv4-http-url
      - id: micro-behaviors/fs/write/file/stream::wsh-save-to-file
      - id: micro-behaviors/process/create/shell/wsh::wsh-shell-bracket-run-call
      - id: micro-behaviors/fs/path/extension::js-executable-filename-literal
    any:
      - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
      - id: metadata/build/minifier::minified-text-shape
      - id: "metadata/file/profile/identifier-population::sequential-identifiers"
