defaults:
  attack: T1105
  mbc: B0024
  platforms:
    - unix
    - windows
  for:
    - python
composite_rules:
  - id: python-remote-manifest-hidden-transient-exec
    desc: Runs remote payload invisibly from temp storage
    crit: hostile
    conf: 0.995
    attack: T1105,T1059.006,T1027
    scope: file
    near_lines: 120
    all:
      - id: metadata/file/profile/executable-config::python-executable-resource-manifest-schema
      - id: micro-behaviors/fs/write/file/response-body::python-write-fetch-body-path
      - id: micro-behaviors/process/create/hidden::python-ctypes-winexec-hidden
      - id: micro-behaviors/fs/temp/mktemp::tempfile-mkdtemp
      - id: micro-behaviors/fs/delete/directory::shutil-rmtree
      - id: micro-behaviors/crypto/hash/digest/sha2::python-sha256-operation
  - id: python-github-zip-exe-detached-dropper
    desc: Python GitHub ZIP EXE detached dropper
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/communications/http/download/release::python-release-zip-path-reference
      - id: micro-behaviors/fs/path/package-manager::pip-exe-path-clues
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen
      - id: micro-behaviors/data/archive/extract/zip::python-zipfile-extractall
      - id: micro-behaviors/process/create/subprocess/launch::popen-content
    any:
      - id: micro-behaviors/process/daemonize/detach::python-subprocess-new-session-option
      - id: micro-behaviors/process/config::python-detached-hidden-hex
  - id: python-inline-github-zip-dropper
    desc: Inline Python GitHub ZIP dropper
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/execution/payload/file-exec/spawn/fetch::python-github-zip-exe-detached-dropper
      - id: micro-behaviors/process/create/eval::sys-executable-c-popen
