defaults:
  platforms: [windows]
  for: [html]
  conf: 0.97

composite_rules:
  - id: privileged-xul-embedded-pe-write-and-launch
    desc: Privileged XUL script writes and launches an embedded PE
    crit: hostile
    all:
      - id: micro-behaviors/os/security/policy::mozilla-universal-xpconnect-request
      - id: metadata/file/encoding/escape::js-unescape-mz-percent-u-text
      - id: micro-behaviors/fs/write/file/stream::mozilla-file-output-stream
      - id: micro-behaviors/os/com/invoke::xul-init-with-path
      - id: micro-behaviors/os/com/invoke::xul-local-file-launch
