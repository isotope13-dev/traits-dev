defaults:
  platforms: [unix, windows]
  for: [pe, dll]
  attack: T1105
  mbc: E1105
composite_rules:
  - id: wininet-decompress-shellexec-clues
    crit: suspicious
    desc: WinINet, decompression and ShellExecute clues
    conf: 0.98
    attack: T1105,T1140,T1059.003
    platforms:
      - windows
    size_max: 524288
    all:
      - id: micro-behaviors/fs/path/system/library::wininet-dll-name-reference
      - id: micro-behaviors/data/codec::rtl-decompress-buffer
      - id: micro-behaviors/os/handler/open::shell-execute-api-text
    any:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
      - id: micro-behaviors/communications/http/client/wininet::internet-close-handle-str
      - id: micro-behaviors/data/format/mime::wildcard-application-mime
    needs: 1
    unless:
      - id: metadata/installer/product/
