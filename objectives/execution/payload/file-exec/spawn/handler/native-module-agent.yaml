defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # Concealed DLL-upload/load replies and a socket client supply the covert
  # module-agent context, independently of changeable protocol command bytes.
  # The neutral trait binds a record-buffer write to opening that file;
  # ordinary updater staging can match the capability without this objective.
  - id: concealed-module-agent-record-file-execution
    desc: Concealed module agent writes and opens payload files
    crit: hostile
    conf: 0.98
    attack: T1105
    all:
      - id: objectives/anti-static/obfuscation/string/encoding::strided-complemented-module-status
      - id: micro-behaviors/communications/socket/connect/attempt::winsock-client-ordinal-api-set
      - id: micro-behaviors/process/deploy/file-exec/open::x86-record-buffer-write-open-chain
