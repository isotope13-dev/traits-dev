defaults:
  platforms: [windows]
  for: [pe]


composite_rules:
  - id: unsigned-winhttp-file-io-shellexecute
    desc: Unsigned WinHTTP, file IO and ShellExecute clues
    crit: hostile
    conf: 0.96
    attack: T1105,T1071.001,T1027
    mbc: B0024
    size_max: 524288
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
      - id: micro-behaviors/fs/file/binary::seek-and-descriptor-io
      - id: metadata/signature/absent::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/os/handler/open::shell-execute-a
      - id: micro-behaviors/os/handler/open::shell-execute-api-text
    needs: 1
    unless:
      - id: well-known/lib/ui/dear-imgui/
