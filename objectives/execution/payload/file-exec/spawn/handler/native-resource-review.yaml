# Reviewed native staging evidence; descriptions name the observed mechanism.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: resource-aes-shellexecute-delete-clues
  desc: Resource, AES, ShellExecute and delete clues
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/binary/resource/size::oversized-rsrc
  - id: metadata/binary/resource/entropy::dominant-high-entropy-resources
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/crypto/symmetric/aes/constant::aes-sbox-bytes
  - id: metadata/binary/symbols/name/process::shell-execute
  - id: micro-behaviors/fs/delete/file/command::cmd-del-force-quiet-text
  attack: T1106,T1140,T1070.004
- id: resource-temp-openas-process-clues
  desc: Resource, temp, OpenAs and process clues
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-reference
  - id: micro-behaviors/fs/write/file/handle::write-file
  - id: objectives/execution/lolbin/os::rundll32-openas-execution
  any:
  - id: metadata/binary/symbols/name/process::create-process-a
  - id: metadata/binary/symbols/name/process::shell-execute-a
  downgrade:
    any:
    - id: metadata/signed/platform/
  attack: T1218,T1106
- id: resource-decompress-shellexecute-clues
  desc: Resource, decompression and ShellExecute clues
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/binary/resource/size::oversized-rsrc
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/data/codec::rtl-decompress-buffer
  - id: metadata/file/profile/open-handler::shell-execute-api-text
  any:
  - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-name
  - id: metadata/binary/layout/size::multi-megabyte-pe-negligible-code
  unless:
  - id: metadata/signed/platform/
  attack: T1106,T1140
