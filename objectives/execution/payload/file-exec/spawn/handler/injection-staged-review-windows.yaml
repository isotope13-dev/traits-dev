defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: openas-resource-remote-memory-apis
    desc: OpenAs resource and remote-memory clues
    crit: hostile
    conf: 0.97
    attack: T1055
    mbc: B0033
    all:
      - id: objectives/execution/payload/file-exec/spawn/handler::resource-temp-openas-process-clues
      - id: micro-behaviors/process/attach/rights::open-process
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/mem/read/cross-process::read-process-memory
    any:
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-enumeration-with-access
      - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
    downgrade:
      any:
        - id: well-known/tool/development/editor/visual-studio::diagnostics-hub
        - id: well-known/tool/reverse-engineering/ida-debugger::ida-debugger-server
        - id: well-known/tool/reverse-engineering/scylla/
