defaults:
  for:
    - pe
  platforms:
    - windows
  attack: T1105

composite_rules:
  - id: arweave-graphql-documents-exec-dropper
    desc: Arweave dead-drop fetches and executes EXE from Documents staging path
    crit: hostile
    conf: 0.997
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
    all:
      - id: metadata/file/profile/blockchain::arweave-winhttp-windows-api-clues
      - id: micro-behaviors/process/create/shellexec::shell-execute
    any:
      - id: metadata/file/profile/staging::path-screenshot-album-payload
      - id: micro-behaviors/fs/file/open::createfile-api
      - id: micro-behaviors/fs/write/file/handle::writefile-api
      - id: metadata/binary/section/permission::writable-rdata
    needs: 2
