defaults:
  for:
    - pe
  platforms:
    - windows
  attack: T1105

composite_rules:
  - id: arweave-graphql-documents-exec-dropper
    desc: Arweave dead-drop fetches and executes EXE from Documents staging path
    crit: hostile
    conf: 0.997
    unless:
      - id: metadata/installer/product/
    all:
      - id: objectives/command-and-control/infrastructure/blockchain/arweave::arweave-winhttp-windows-api-clues
      - id: micro-behaviors/os/handler/open::shell-execute
    any:
      - id: micro-behaviors/fs/path/media::path-screenshot-album-payload
      - id: micro-behaviors/fs/file/open/unspecified::createfile-api
      - id: micro-behaviors/fs/write/file/handle/unspecified::writefile-api
      - id: metadata/binary/section/permission::writable-rdata
    needs: 2
