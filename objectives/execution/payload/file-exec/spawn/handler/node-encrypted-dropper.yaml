# Electron dropper that fetches an encrypted payload over HTTP, Base64-decodes
# and cipher-decrypts it, writes an executable file to disk, and launches it
# through the OS default file handler (shell.openPath).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1105,T1140,T1204.002
  mbc: B0024

composite_rules:
  - id: node-cipher-decrypt-write-openpath-routine
    desc: Decrypts Base64 file and calls shell.openPath
    crit: notable
    conf: 0.95
    near_bytes: 2500
    all:
      - id: micro-behaviors/crypto/decrypt/initialize::createDecipheriv
      - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64
      - id: micro-behaviors/fs/write/file/full/unspecified::write-file-sync
      - id: micro-behaviors/os/handler/open::electron-shell-openpath-call

  - id: electron-http-decrypted-exe-openpath-dropper
    desc: Fetches, decrypts, and opens EXE via handler
    crit: hostile
    conf: 0.99
    all:
      - id: node-cipher-decrypt-write-openpath-routine
      - id: micro-behaviors/fs/path/extension::dot-exe-string
      - id: micro-behaviors/communications/url/host/domain-http::js-hardcoded-remote-endpoint
    any:
      - id: micro-behaviors/communications/http/request/client::node-http-imported-request-stream
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/get::axios-get-call
      - id: micro-behaviors/communications/http/request/evented::node-evented-get-response
    unless:
      - id: micro-behaviors/communications/url/host/tld-http::single-nonexistent-fetch-example
      - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context
      - id: micro-behaviors/crypto/hash/file::node-sha256-sidecar-verified-download
