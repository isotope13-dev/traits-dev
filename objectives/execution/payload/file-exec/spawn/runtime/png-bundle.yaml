defaults:
  platforms: [windows]
  for: [png]
composite_rules:
  # The declared PE member and retained loader's linked write -> hidden DLL
  # launch -> marker-selected script/carrier erasure admit this attack claim.
  # Merely carrying a PE, or an extractor that does not launch it, is insufficient.
  # No first-stage invocation or successful DLL execution is claimed.
  - id: png-bundle-hidden-dll-cleanup
    desc: PNG bundles a hidden DLL loader that erases scripts and its carrier
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1059.001,T1218.011,T1070.004
    all:
      - id: metadata/file/format/media::stg3-png-pe-bundle
      - id: micro-behaviors/process/deploy/file-exec/spawn::powershell-bundle-hidden-dll-deploy
      - id: objectives/evasion/indicator-removal/cleanup::powershell-marker-selected-script-delete
      - id: objectives/evasion/indicator-removal/cleanup::powershell-carrier-read-delete
