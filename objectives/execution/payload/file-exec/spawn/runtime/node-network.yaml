defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1105,T1059.007
composite_rules:
- id: same-file-remote-native-stage
  desc: JavaScript fetches, enables, and launches a native stage
  crit: suspicious
  conf: 0.96
  scope: file
  near_bytes: 2048
  unless:
  - id: metadata/package/testing/
  - id: micro-behaviors/process/lifecycle/respawn::node-self-daemon-cli-benign-context
  - id: well-known/app/ai/agent-runtime/nebula-ai::nebula-ai-context
  - id: metadata/path/directory::test-directory-component
  all:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: metadata/file/profile/file-write-api::node-write-file-sync-call
  - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
  - id: metadata/file/profile/execution-api::spawn-call
