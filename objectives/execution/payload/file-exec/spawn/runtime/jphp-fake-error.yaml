defaults:
  platforms: [windows, unix]
  for: [class]
traits:
  - id: jphp-random-temp-executable-staging
    desc: JPHP random temp-EXE staging API names
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule jphp_random_temp_executable_staging {
          strings:
            $generated = "$php_module_" ascii
            $temp = "java.io.tmpdir" ascii
            $exe = ".exe" ascii
            $read = "getContents" ascii
            $write = "putContents" ascii
            $open = "open" ascii
            $hash = "md5" ascii
            $encoding = "base64_encode" ascii
          condition:
            uint32be(0) == 0xcafebabe and all of them
        }
composite_rules:
  - id: jphp-temp-executable-fake-dll-error
    desc: JPHP temp-EXE stager with DLL-error distraction
    crit: hostile
    conf: 0.98
    for: [class, jar, zip, pe]
    scope: archive
    all:
      - id: jphp-random-temp-executable-staging
      - id: well-known/lib/runtime/scripted/jphp::generated-module-class
      - id: micro-behaviors/ui/dialog/error::missing-dll-reinstallation-message
      - id: metadata/import/jvm::jphp-static-invocation-helper-reference
      - id: metadata/import/jvm::jphp-function-invocation-helper-reference
