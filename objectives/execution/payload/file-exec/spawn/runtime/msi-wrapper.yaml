defaults:
  platforms: [windows]
  attack: T1027.009

composite_rules:
  - id: msi-embedded-iexpress-autoit-dropper
    desc: Masqueraded MSI stages AutoIt payload
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/source/syntax/command/launch::autoit-a3x-command
      - id: well-known/tool/packaging/iexpress::iexpress-wextract-manifest-embedded
      - id: metadata/document/office/properties::msi-wrapper-application
      - id: metadata/document/office/properties::internet-explorer-wrapper-title

