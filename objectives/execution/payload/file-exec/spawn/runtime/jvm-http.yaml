defaults:
  platforms: [unix]
  for: [class, java_class, jar]
  attack: T1106

composite_rules:
  - id: jvm-bytecode-download-temp-exec
    desc: JVM bytecode temp path and process context
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/encoding/hex::jvm-http-temp-update-hex
      - id: metadata/binary/symbols/name/process::java-processbuilder-bytecode
      - id: metadata/lang/encoding/hex::jvm-payload-path-hex-bytes
