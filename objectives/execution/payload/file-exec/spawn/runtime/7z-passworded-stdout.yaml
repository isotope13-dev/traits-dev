# Password-protected 7z extracted to stdout, PE-checked, then written under a
# random temp name and launched. Encrypted archive plus in-memory extract keeps
# scanners blind until the payload is already a disk image; launching it is the
# dropper, independent of whether the script is named postinstall.js.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1027.002,T1105,T1059.001
  mbc: B0024

composite_rules:
  - id: passworded-7z-stdout-temp-pe-launch
    desc: Passworded 7z stdout PE launch
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/payload/file-exec/spawn/archive::node-spawn-password-stdout-clues
      - id: micro-behaviors/data/format/pe-parser::node-pe-magic-offset-read-clues
      - id: micro-behaviors/fs/path/temporary-artifact::node-temp-exe-name-path-clues
      - id: micro-behaviors/process/create/path-execution::start-process-temp-executable
