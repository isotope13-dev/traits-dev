defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
traits:
  - id: wsh-hex-byte-write
    desc: Writes decoded hexadecimal bytes
    crit: notable
    if:
      type: text
      regex: '(?i)\.Write\s+Chr\s*\(\s*CLng\s*\(\s*["'']&H["'']\s*&\s*Mid\s*\('
composite_rules:
  - id: wsh-hex-executable-drop-run
    desc: Script writes and launches a hex-encoded executable
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1059.005
    all:
      - id: metadata/file/encoding/shape::assigned-mz-prefixed-hex-string
      - id: wsh-hex-byte-write
      - id: micro-behaviors/fs/write/content::create-text-file-method-name
      - id: micro-behaviors/fs/path/temp::fso-getspecialfolder-temp
      - id: micro-behaviors/process/create/shell/interpreter::wsh-progid-near-run
    unless:
      - id: metadata/package/documentation/page::documentation-heading-html-page
