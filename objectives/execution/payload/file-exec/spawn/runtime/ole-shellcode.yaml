defaults:
  platforms: [windows]
  for: [oledoc]
  conf: 0.98
composite_rules:
  - id: ole-decoded-payload-write-launch
    desc: OLE XOR-decodes payload and writes/launches it
    crit: hostile
    attack: T1204.002
    all:
      - id: micro-behaviors/process/create/exec::ole-hashed-write-close-launch-shellcode
      - id: micro-behaviors/os/api-resolution/digest-export::ole-export-hash-resolver
    any:
      - id: micro-behaviors/data/decode/xor::ole-x86-byte-xor-loop
      - id: micro-behaviors/data/decode/xor::ole-x86-dec-xor-loop
      - id: micro-behaviors/data/decode/xor::ole-x86-skip-nul-key-xor-loop
  - id: ole-skip-key-xor-drop-launch
    desc: OLE XOR-decodes file then launches it
    crit: hostile
    attack: T1204.002
    all:
      - id: micro-behaviors/os/api-resolution/digest-export::ole-export-hash-resolver
      - id: micro-behaviors/data/decode/xor::ole-x86-skip-nul-key-xor-loop
      - id: micro-behaviors/process/create/embedded::ole-createalways-hidden-launch
  - id: ole-svchost-temp-exe-drop
    desc: OLE shellcode drops SVCHOST.EXE and temp.exe
    crit: hostile
    attack: T1036.005
    all:
      - id: micro-behaviors/fs/path/basename::ole-svchost-exe-dword-suffix
      - id: micro-behaviors/fs/path/basename::ole-temp-exe-dword-suffix
      - id: micro-behaviors/process/create/embedded::ole-createalways-hidden-launch
