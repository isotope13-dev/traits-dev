# Hex-XOR PowerShell source whose completed activation sink is a downloaded executable.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027,T1059.001,T1140
  mbc: B0032,C0043
composite_rules:
  - id: powershell-hex-xor-download-execute
    desc: PowerShell hex-XOR ScriptBlock stage downloads and launches an executable
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1105,T1204.002
    all:
      - id: objectives/execution/payload/script-eval/transformed/constructed::powershell-hex-xor-scriptblock-loader
      - id: objectives/execution/payload/file-exec/download/runtime::powershell-webclient-executable-url-start
    near_bytes: 4096
