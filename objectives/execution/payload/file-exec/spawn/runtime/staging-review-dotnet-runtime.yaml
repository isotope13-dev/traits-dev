defaults:
  platforms:
  - windows
  crit: hostile
composite_rules:
- mbc: B0009.014
  attack: T1027.009,T1140,T1059.001,T1105
  for:
  - pe
  id: dotnet-resource-extract-hidden-command-profile
  desc: Embedded PE, extraction and hidden command clues
  conf: 0.98
  all:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: metadata/binary/layout/embedded::pe-embedded
  - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
  - id: micro-behaviors/process/lifecycle/auto-exec::dotnet-module-initializer
  - id: micro-behaviors/data/archive/extract/zip::extract-to-directory
  - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
  - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::activator
  - id: micro-behaviors/process/config/window::dotnet-console-window-option-reference
  - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
  unless:
  - id: metadata/signature/verified/platform::microsoft
  - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
- attack: T1027.009
  for:
  - csharp
  id: dotnet-resource-temp-latebound-execution
  desc: Resource, temp file and late-bound process clues
  conf: 0.97
  all:
  - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
  - id: micro-behaviors/data/embedded/payload/resource::resourcemanager-getobject-call
  - id: micro-behaviors/data/embedded/payload/resource::resourcemanager-getresourceset-call
  - id: micro-behaviors/fs/path/temp::get-temp-path-raw
  - id: micro-behaviors/fs/write/file/handle/unspecified::filestream-create
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::process-type-start-member-name
