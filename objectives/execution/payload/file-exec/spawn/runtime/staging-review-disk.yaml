defaults:
  platforms:
  - windows
composite_rules:
- for:
  - class
  - java_class
  - jar
  - zip
  id: java-inetcache-exe-process-references
  desc: Java INetCache EXE and process API references
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/fs/path/cache::windows-inetcache-path
  - id: micro-behaviors/fs/path/extension::java-executable-reference
  - id: metadata/import/jvm::jvm-fileoutputstream-bytecode
  - id: metadata/file/profile/process/launch::java-processbuilder-start-bytecode
  - id: metadata/import/jvm::java-processbuilder-redirect-output
  unless:
  - id: metadata/path/directory::test-directory-component
- for:
  - javascript
  - typescript
  attack: T1059.006,T1140,T1564.003
  id: node-base64-inetcache-hidden-python-stage
  desc: Node Base64, INetCache and hidden Python spawn
  crit: hostile
  conf: 0.995
  scope: file
  near_lines: 100
  all:
  - id: micro-behaviors/data/decode/base64::buffer-from-base64
  - id: metadata/file/profile/file-write-api::node-write-file-sync
  - id: micro-behaviors/fs/path/cache::windows-inetcache-path-text
  - id: micro-behaviors/process/interpreter/embedded-python::node-spawn-python-identifier
  - id: metadata/file/profile/command-options::detached-true
  - id: micro-behaviors/process/fd/stdio::child-stdio-ignore-option
  - id: metadata/file/profile/command-options::node-windowshide-true-option
