# Server-driven Electron/Node loader: an Axios POST carries the request to
# the operator, a stage is AES-256-CBC decrypted, written as an executable
# file, and launched through the desktop shell. Each stage role accepts its
# plain, literal, and lower-first Base64 string-table spellings so renamed
# builds of the same loader keep matching.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1105, T1027.013
  mbc: B0022
composite_rules:
- id: electron-c2-decrypt-drop-execute
  desc: Electron loader decrypts remote stage, drops EXE, launches it
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/crypto/decrypt/initialize::createdecipheriv-any-form
  - id: micro-behaviors/crypto/symmetric/aes/mode::aes-256-cbc-any-form
  - id: micro-behaviors/fs/write/file/unspecified::write-file-sync-any-form
  - id: micro-behaviors/os/handler/open::electron-shell-openpath-any-form
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
