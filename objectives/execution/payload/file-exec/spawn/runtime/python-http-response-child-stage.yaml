defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1105,T1059.006
  mbc: B0024,E1059
  crit: hostile

composite_rules:
  - id: python-fetches-response-script-and-launches-it
    desc: Python fetches, writes, and launches a script
    conf: 0.97
    scope: file
    near_lines: 80
    all:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-body-path
    any:
      - id: micro-behaviors/process/interpreter/python::subprocess-run-sys-executable
      - id: micro-behaviors/process/interpreter/python::sys-executable-popen
