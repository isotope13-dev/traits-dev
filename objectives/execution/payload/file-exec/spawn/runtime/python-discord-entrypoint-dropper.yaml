# A wheel console entry co-occurring with the hidden APPDATA download
# chain. The header does not bind the declared command target to that code,
# or establish modification of a legitimate package. Preserve the observed
# chain and entry declaration without claiming either relationship.
defaults:
  platforms: [windows]
  for: [whl]
  attack: T1105,T1059.003,T1564.003

composite_rules:
  - id: wheel-console-script-discord-dropper
    desc: Wheel console entry beside hidden Discord download chain
    crit: hostile
    conf: 0.98
    scope: archive
    for: [whl, python, text]
    all:
      - id: metadata/package/scripts/entrypoint::console-header-in-entry-points-file
      - id: objectives/execution/payload/file-exec/spawn/runtime::python-discord-appdata-hidden-dropper
