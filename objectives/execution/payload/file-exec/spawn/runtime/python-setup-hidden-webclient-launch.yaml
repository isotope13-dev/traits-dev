defaults:
  platforms: [windows]
  for: [python]
  attack: T1195.002,T1105,T1059.001
  mbc: E1105

composite_rules:
- id: python-setup-hidden-webclient-executable-launch
  desc: Python setup script silently downloads and starts a GitHub executable
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
  - id: micro-behaviors/communications/url/external/github::github-raw-file-url
  - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
  - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
