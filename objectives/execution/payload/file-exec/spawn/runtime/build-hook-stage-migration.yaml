defaults:
  for: [rust]
  mbc: B0024
  platforms:
  - unix
  - windows
  crit: suspicious
  attack: T1195.002
composite_rules:
- id: rust-build-rs-hostname-unverified-remote-payload-exec
  desc: Cargo build hook launches a hostname-unverified remote payload
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1105,T1059,T1553
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  - id: objectives/execution/staging/acquire::rust-build-rs-hostname-unverified-remote-payload-stage
  - id: objectives/execution/payload/file-exec/spawn/runtime::rust-hostname-unverified-temp-executable-dropper
- id: rust-build-rs-obfuscated-endpoint-payload-exec
  desc: Cargo build hook launches a remote payload from an obfuscated endpoint
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1027.001,T1105,T1059
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  - id: objectives/execution/payload/file-exec/spawn/runtime::rust-obfuscated-endpoint-temp-executable-dropper
- id: rust-build-rs-hidden-wscript-payload-exec
  desc: Cargo build hook launches hidden remote PowerShell through WScript
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1105,T1059.001,T1059.005,T1564.003
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  - id: objectives/execution/payload/file-exec/spawn/runtime::rust-hidden-wscript-temp-powershell-stage
