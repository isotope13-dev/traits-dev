defaults:
  for: [csharp]
  platforms: [windows]
  attack: "T1105"
composite_rules:
  - id: csharp-appdata-drop-execute
    desc: C# AppData drop and execute
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/write/file/full/unspecified::csharp-appdata-writeallbytes
      - id: micro-behaviors/process/create/subprocess/launch::csharp-appdata-process-start
    any:
      - id: micro-behaviors/fs/write/file/unspecified::csharp-file-copy-variable-text
      - id: micro-behaviors/process/info/current::csharp-current-mainmodule-filename
      - id: objectives/persistence/login/registry/run-key::csharp-run-key-persistence
