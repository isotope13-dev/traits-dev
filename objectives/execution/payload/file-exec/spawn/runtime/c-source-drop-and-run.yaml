defaults:
  platforms: [windows]
  for: [c, cpp, html, text]
  attack: T1204.002
composite_rules:
  - id: c-source-drops-file-to-system-dir-and-runs
    desc: Source writes a file into a system or temp dir and runs it
    crit: hostile
    conf: 0.9
    near_lines: 90
    all:
      - id: micro-behaviors/os/sysinfo/directories::windows-or-temp-directory-call
      - id: micro-behaviors/fs/file/open::source-createfile-write-access
      - id: micro-behaviors/fs/write/file/handle::write-file-source-reference
      - id: metadata/file/profile/operation-reference::source-shellexecute-open-call
