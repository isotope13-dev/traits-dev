# Windows counterpart of shell-raw-ip.yaml: a script fetches an executable
# from a bare external IPv4 address and launches it with Start-Process. The
# launch chain is neutral (micro-behaviors/process/deploy/file-exec); the
# raw-IP source is the attack-specific leg that admits it. A named host would
# be an ordinary updater, so no host name is matched here.
defaults:
  platforms: [windows]
  attack: T1105,T1204.002
  crit: hostile
composite_rules:
  - id: powershell-raw-ip-download-launch
    desc: PowerShell fetches an executable from a raw IP and starts it
    for: [powershell]
    conf: 0.95
    near_lines: 8
    all:
      - id: micro-behaviors/process/deploy/file-exec::powershell-downloadfile-exe-start-process
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/
