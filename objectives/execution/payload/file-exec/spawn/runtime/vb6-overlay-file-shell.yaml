defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1204.002,T1059
composite_rules:
  - id: vb6-upx-overlay-write-shell
    desc: UPX VB6 overlay, binary write and shell execution
    crit: hostile
    conf: 0.85
    all:
      - id: metadata/lang/runtime::vb6-application-framework
      - id: metadata/binary/section/label/packing::upx-section-pair
      - id: metadata/binary/layout/ratio::overlay-at-least-half
      - id: micro-behaviors/fs/write/file/handle/unspecified::vb6-binary-file-write
      - id: micro-behaviors/process/create/exec::vb6-shell-execution
  - id: vb6-overlay-pe-write-shell
    desc: VB6 embedded PE, binary write and shell execution
    crit: hostile
    conf: 0.92
    all:
      - id: metadata/lang/runtime::vb6-application-framework
      - id: metadata/binary/layout/ratio::overlay-at-least-half
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: micro-behaviors/fs/write/file/handle/unspecified::vb6-binary-file-write
      - id: micro-behaviors/process/create/exec::vb6-shell-execution
    unless:
      - id: metadata/installer/product/
      - id: metadata/binary/layout/embedded::embedded-pe-child
