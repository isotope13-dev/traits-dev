defaults:
  platforms: [windows, unix]
  for: [javascript, python, shell]

composite_rules:
- id: ethereum-address-crypto-detached-file-launch
  desc: Ethereum address and detached file-launch clues
  crit: hostile
  conf: 0.99
  attack: T1102,T1105,T1059.007,T1564.003
  mbc: B0024,F0011
  for:
    - javascript
    - typescript
  all:
    - id: micro-behaviors/data/format/crypto-address::ethereum-address-literal
    - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
    - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync
    - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
  any:
    - id: micro-behaviors/crypto/key/import::webcrypto-aes-gcm-importkey
    - id: micro-behaviors/crypto/asymmetric/curve25519::x25519-key-exchange-term
    - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2
