defaults:
  attack: T1105
  mbc: B0024
  platforms:
    - unix
    - windows
  for:
    - python
composite_rules:
  - id: python-embedded-b64-blob-write-exec-dropper
    desc: Decodes an embedded base64 blob to disk and runs it
    crit: hostile
    conf: 0.96
    scope: file
    near_lines: 120
    all:
      - id: metadata/file/encoding/shape::python-base64-alphabet-run
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
      - id: micro-behaviors/fs/file/io-mode::write-append-create-mode
    any:
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system-text
      - id: micro-behaviors/process/create/shell/reference::python-aliased-os-system
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
