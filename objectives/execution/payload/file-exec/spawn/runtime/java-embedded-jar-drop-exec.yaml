defaults:
  platforms: [windows, unix]
  for: [java]
  attack: T1105
  mbc: B0042

composite_rules:
- id: java-embedded-jar-drop-exec
  desc: Base64 ZIP, file write and JAR option clues
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/file/encoding/compression::java-embedded-zip-base64-source
  - id: micro-behaviors/data/decode/base64/reference::java-base64-decoder-accessor
  - id: micro-behaviors/process/argument/file::java-jar-processbuilder-source
  - id: micro-behaviors/fs/write/file/stream::java-fileoutputstream-source
  any:
  - id: micro-behaviors/data/string/mutate::java-append-calls
  - id: metadata/lang/source/naming/variable::java-pid-output-parser-source
  needs: 1
