defaults:
  platforms: [unix, windows]
  for: [python]
  crit: hostile
  attack: T1027,T1105,T1059.006
composite_rules:
  - id: python-image-archive-process-stage
    desc: Image-named HTTP ZIP extraction and launch
    conf: 0.99
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/parse/zip::python-image-http-zip-container
      - id: micro-behaviors/data/archive/extract/zip::python-zipfile-extractall
    any:
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: micro-behaviors/os/handler/open::os-startfile-call
