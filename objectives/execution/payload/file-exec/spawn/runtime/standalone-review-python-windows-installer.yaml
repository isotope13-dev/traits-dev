defaults:
  platforms: [windows]
  for: [batch, powershell, scripts, javascript]
  attack: T1105
composite_rules:
  - id: javascript-python-overlay-runtime-bootstrap
    for: [javascript]
    desc: JavaScript launcher stages Python overlay surveillance runtime
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.006
    all:
      - id: micro-behaviors/fs/path/basename::cpython-windows-installer-reference
      - id: micro-behaviors/os/package-manager/config::quiet-python-user-install
      - id: micro-behaviors/os/package-manager/install::pyperclip-keyboard-install-text
      - id: micro-behaviors/ui/window/automation::screen-automation-dependency-text
      - id: metadata/lang/source/syntax/call/argument-identifier::spawn-identifier-program-and-argument-text
      - id: micro-behaviors/fs/path/script::node-local-python-script-path

