composite_rules:
- platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for:
  - javascript
  - typescript
  id: node-write-process-encoded-content-clues
  desc: Node write, process and encoded content clues
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/fs/write/file/unspecified::node-local-write-process-clues
  any:
  - id: micro-behaviors/data/decode/buffer::mixed-buffer-encodings
  - id: metadata/lang/encoding/hex::hex-encoded-content-references
  - id: metadata/file/encoding/base64::large-base64-like-string
- platforms:
  - windows
  for:
  - powershell
  id: powershell-base64-write-start-process-clues
  desc: PowerShell Base64, write and launch clues
  crit: suspicious
  conf: 0.97
  attack: T1027,T1059.001
  all:
  - id: micro-behaviors/data/decode/base64/unspecified::powershell-frombase64string
  - id: micro-behaviors/fs/write/file/full/bytes::write-all-bytes
  - id: micro-behaviors/process/create/cmdlet::saps-alias
  near_lines: 8
