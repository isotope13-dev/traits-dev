defaults:
  platforms: [windows, unix]
  for: [class]

traits:
  - id: jvm-buffered-file-output-write
    desc: References buffered output stream writes
    crit: component
    conf: 0.93
    if:
      type: import
      exact: java/io/BufferedOutputStream.write

  - id: jvm-temporary-file-create-reference
    desc: References temporary file creation
    crit: component
    conf: 0.94
    if:
      type: import
      regex: '^java/(io/File|nio/file/Files)\.createTempFile$'

composite_rules:
  - id: jvm-socket-tempfile-process-staging
    desc: JVM class combines socket input, temporary-file staging, launch and cleanup
    crit: hostile
    conf: 0.97
    attack: T1105,T1059,T1070.004
    scope: file
    all:
      - id: metadata/import/jvm::socket-input-stream-reference
      - id: jvm-temporary-file-create-reference
      - id: micro-behaviors/fs/file/open/write::jvm-fileoutputstream-constructor
      - id: jvm-buffered-file-output-write
      - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-bytecode
      - id: metadata/import/jvm::java-processbuilder-redirect-errors
      - id: metadata/import/jvm::java-file-delete-bytecode
