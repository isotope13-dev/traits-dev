defaults:
  platforms: [windows, unix]
  for: [java]
  attack: T1105
  mbc: B0042

composite_rules:
  # Kept suspicious rather than hostile: the source proves a backdoor-labeled
  # decoded-file writer, but an empty/template Base64 value may leave it inert
  # and there is no execution stage in this file.
- id: java-embedded-jar-runtime-drop-exec
  desc: Java embedded JAR runtime drop exec
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/file/encoding/compression::java-embedded-zip-base64-source
  - id: micro-behaviors/data/string/mutate::java-append-calls
  - id: micro-behaviors/fs/write/file/stream::java-fileoutputstream-source
  - id: micro-behaviors/process/interpreter/runtime/jvm::java-jar-command-string-source
  - id: micro-behaviors/process/create/subprocess/launch::java-runtime-exec-source
  any:
  - id: micro-behaviors/data/stream/read::java-input-stream-access
  - id: metadata/lang/source/naming/variable::java-pid-output-parser-source
  needs: 1
