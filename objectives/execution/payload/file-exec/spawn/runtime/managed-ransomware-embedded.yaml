defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Admission comes from the independently established encrypt-and-extort
  # behavior. The embedded PE, decoder, temporary-name helper, byte writer,
  # and process-start references indicate a staged executable launch. They
  # do not establish that every embedded image runs or that launch succeeds.
  - id: managed-ransomware-embedded-pe-launch
    desc: Ransomware carries Base64 PE drop-and-launch profile
    crit: hostile
    conf: 0.97
    attack: T1027.009,T1140,T1106
    all:
      - id: objectives/impact/ransom/encrypt/bulk-encryption::managed-ransom-stream-replacement
      - id: micro-behaviors/data/embedded/payload/header::pe-dos-stub-base64
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/fs/temp/file::gettempfilename-api-name
      - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
      - id: micro-behaviors/process/config/launch::dotnet-start-name-config-references
