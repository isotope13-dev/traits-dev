defaults:
  platforms: [windows]
  for: [html]
composite_rules:
  - id: htmlhelp-scripted-download-launch
    attack: T1218.001
    mbc: E1218
    desc: Scripted Help activates a downloaded executable
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/com/automation::htmlhelp-shortcut-command-param
      - id: micro-behaviors/ui/controls/widget::html-object-click-call
      - id: micro-behaviors/process/deploy/file-exec/spawn::webclient-downloadfile-same-variable-launch
    any:
      - id: metadata/file/profile/com/class-id::htmlhelp-shortcut-clsid
      - id: metadata/file/profile/com/class-id::htmlhelp-hhctrl-clsid
      - id: metadata/file/profile/com/class-id::htmlhelp-hhctrl-alternate-clsid
      - id: micro-behaviors/process/config/target::htmlhelp-shortcut-item1-named-target
