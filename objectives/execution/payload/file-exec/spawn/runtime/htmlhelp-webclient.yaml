defaults:
  platforms: [windows]
  for: [html]
composite_rules:
  - id: htmlhelp-hidden-webclient-file-launch
    desc: HTML Help hides downloaded-file launch
    crit: hostile
    conf: 0.99
    attack: T1218.001,T1105,T1564.003
    all:
      - id: objectives/execution/trigger/document::htmlhelp-hidden-bypass-scripted-execution
      - id: micro-behaviors/process/deploy/file-exec::webclient-downloadfile-same-variable-launch
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
      - id: micro-behaviors/process/argument/option::powershell-hidden-command-text
