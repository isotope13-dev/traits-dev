defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: winrar-sfx-silent-legacy-executable
  desc: WinRAR SFX silently runs a legacy executable payload
  crit: hostile
  conf: 0.97
  attack: T1204.002,T1036.007
  all:
    - id: well-known/tool/sysadmin/winrar-sfx::winrar-sfx
    - id: micro-behaviors/data/archive/extract/options::sfx-silent-directive
    - id: micro-behaviors/process/config/installer::sfx-setup-legacy-executable
