defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: winrar-sfx-silent-programdata-cmd
  desc: Silent WinRAR SFX drops CMD into ProgramData
  crit: suspicious
  conf: 0.98
  attack: T1204.002,T1059.003,T1036
  all:
    - id: well-known/tool/sysadmin/winrar-sfx::winrar-sfx
    - id: micro-behaviors/data/archive/extract/destination::sfx-programdata-path
    - id: micro-behaviors/process/config/installer::sfx-setup-cmd-script
    - id: micro-behaviors/data/archive/extract/options::sfx-silent-overwrite-pair

