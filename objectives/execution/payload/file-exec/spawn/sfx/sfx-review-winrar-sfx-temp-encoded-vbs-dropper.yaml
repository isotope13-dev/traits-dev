defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: winrar-sfx-temp-encoded-vbs-dropper
  desc: WinRAR SFX temp extract launches encoded VBScript
  crit: hostile
  conf: 0.97
  attack: T1204.002,T1059.005
  all:
    - id: well-known/tool/sysadmin/winrar-sfx::winrar-sfx
    - id: micro-behaviors/data/archive/extract/destination::sfx-temp-mode-directive
    - id: micro-behaviors/process/config/installer::sfx-setup-encoded-vbs

