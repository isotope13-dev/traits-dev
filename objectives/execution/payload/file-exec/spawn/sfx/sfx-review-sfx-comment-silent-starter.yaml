defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: sfx-comment-silent-starter-presetup
  desc: SFX starter presetup names executable
  crit: component
  conf: 1.0
  for: [data]
  any:
    - id: micro-behaviors/process/config/installer::sfx-comment-presetup-exe-ascii
    - id: micro-behaviors/process/config/installer::sfx-comment-presetup-exe-utf16
- id: sfx-comment-silent-starter-silence
  desc: SFX starter requests silent install
  crit: component
  conf: 1.0
  for: [data]
  any:
    - id: micro-behaviors/data/archive/extract/options::sfx-comment-silent-ascii
    - id: micro-behaviors/data/archive/extract/options::sfx-comment-silent-utf16
- id: sfx-comment-silent-starter-overwrite
  desc: SFX starter requests silent overwrite
  crit: component
  conf: 1.0
  for: [data]
  any:
    - id: micro-behaviors/data/archive/extract/options::sfx-comment-overwrite-ascii
    - id: micro-behaviors/data/archive/extract/options::sfx-comment-overwrite-utf16
- id: sfx-comment-silent-starter-decoy
  desc: SFX starter Setup opens decoy
  crit: component
  conf: 1.0
  for: [data]
  any:
    - id: micro-behaviors/process/config/installer::sfx-comment-setup-decoy-ascii
    - id: micro-behaviors/process/config/installer::sfx-comment-setup-decoy-utf16
- id: sfx-comment-silent-starter
  desc: Silent SFX starter runs payload behind decoy
  crit: hostile
  conf: 0.97
  attack: T1204.002
  for: [data]
  all:
    # A bare SFX comment fragment (RAR Starter pattern): the script hides
    # its UI, overwrites without asking, launches an executable before
    # extraction finishes, and opens a picture or document as a lure while
    # the payload runs. Ordinary silent installers do not pair hidden
    # pre-extraction execution with a viewer decoy.
    - id: sfx-comment-silent-starter-presetup
    - id: sfx-comment-silent-starter-silence
    - id: sfx-comment-silent-starter-overwrite
    - id: sfx-comment-silent-starter-decoy
