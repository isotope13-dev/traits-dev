defaults:
  platforms: [windows]
  for: [pe, lnk]
composite_rules:
- id: winrar-sfx-silent-shortcut-launch
  desc: Silent temp SFX auto-runs a bundled shortcut
  crit: hostile
  conf: 0.95
  scope: outer
  attack: T1204.002,T1547.009
  all:
  - id: well-known/tool/sysadmin/winrar-sfx::winrar-sfx
  - id: micro-behaviors/data/archive/extract/destination::sfx-temp-mode-directive
  - id: micro-behaviors/ui/window/suppression::sfx-silent-raw-directive
  - id: micro-behaviors/process/config/installer::sfx-setup-shortcut
  - id: micro-behaviors/process/config/target::lnk-script-host-target
