defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: iso-winrar-silent-legacy-executable-dropper
  desc: ISO carries a silent WinRAR SFX for a legacy executable payload
  crit: hostile
  conf: 0.98
  for: [iso, data]
  attack: T1204.002,T1036.007
  all:
    - id: metadata/file/format/iso/structure::primary-volume-descriptor
    - id: metadata/file/format/iso/member::iso-winrar-sfx-module
    - id: metadata/file/format/iso/payload::iso-sfx-setup-silent-pif

