defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009

composite_rules:
  - id: iexpress-autoit-packed-dropper
    desc: IExpress wrapper launches a packed AutoIt payload
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/interpreter/autoit::iexpress-autoit-script-payload
      - id: well-known/tool/packaging/iexpress::wextract-tool
      - id: metadata/lang/compiled::autoit-script-resource-entry
      - id: metadata/lang/compiled::autoit-runtime-resource-entry
      - id: metadata/binary/layout/entropy::peak-region-entropy-7p5
      - id: metadata/binary/layout/entropy::binary-peak-region-mass-over-8k
      - id: metadata/signature/absent::unsigned-missing-signature-record
  - id: iexpress-tampered-autoit-au3-dropper
    desc: IExpress launches tampered AutoIt source
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/interpreter/autoit::iexpress-autoit-au3-payload
      - id: well-known/tool/packaging/iexpress::wextract-tool
      - id: metadata/lang/compiled::autoit-au3-resource-entry
      - id: metadata/signature/certificate/integrity::pe-signature-digest-mismatch
