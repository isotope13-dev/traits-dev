defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: winrar-sfx-temp-rat-dropper
  desc: WinRAR SFX extracts and launches a RAT-named payload from temp
  crit: hostile
  conf: 0.995
  attack: T1204.002,T1027.009
  all:
    - id: well-known/tool/sysadmin/winrar-sfx::winrar-sfx
    - id: micro-behaviors/data/archive/extract/destination::sfx-temp-mode-directive
    - id: micro-behaviors/process/config/installer::sfx-setup-rat-executable
