defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: sfx-password-archive-extractor-dropper
    desc: SFX unpacks passworded archive to drop payload
    crit: hostile
    conf: 0.98
    attack: T1204.002,T1027.009
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/process/config/installer::sfx-runprogram-password-extract
    any:
      - id: metadata/binary/layout/overlay::large-opaque-high-entropy-overlay
      - id: metadata/binary/layout/overlay::overlay-80kb-high-entropy
      - id: metadata/binary/layout/overlay::7z-sfx-config-marker
      - id: micro-behaviors/process/config/installer::sfx-runprogram-cmd-shell
    unless:
      - id: metadata/installer/product/
