defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: silent-sfx-executable-dropper
    desc: 7z SFX silently executes dropped executable without progress UI
    # A silent run is an installer convention on its own. The suspicious
    # verdict needs the unsigned, high-entropy overlay leg in
    # unsigned-silent-7zip-sfx-runprogram, so this observation is notable.
    crit: notable
    conf: 0.85
    attack: T1204.002
    all:
      - id: micro-behaviors/process/config/installer::sfx-runprogram-executable
      - id: micro-behaviors/ui/controls/progress::sfx-progress-disabled
