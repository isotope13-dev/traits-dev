defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: unsigned-silent-7zip-sfx-runprogram
  desc: Unsigned silent 7-Zip SFX runs a configured executable
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/binary/installer/archive::7zip-sfx-archive-profile
  - id: metadata/binary/layout/overlay::large-high-entropy-overlay
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/process/config/installer::sfx-runprogram-executable
  - id: micro-behaviors/ui/controls/progress::sfx-progress-disabled
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: renamed-unsigned-silent-7zip-sfx-runprogram
  desc: Renamed unsigned silent 7-Zip SFX runs an executable
  crit: hostile
  conf: 0.98
  attack: T1036.005,T1027.009,T1204.002
  all:
  - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
  - id: metadata/binary/installer/archive::7zip-sfx-archive-profile
  - id: metadata/binary/layout/overlay::large-high-entropy-overlay
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/process/config/installer::sfx-runprogram-executable
  - id: micro-behaviors/ui/controls/progress::sfx-progress-disabled
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: silent-temp-7zsfxmod-exchanger-runprogram
  desc: Silent 7ZSfxMod extracts and runs Exchanger-D from temp
  crit: hostile
  conf: 0.995
  attack: T1027.009,T1204.002
  all:
  - id: metadata/binary/installer/archive::7zsfxmod-profile
  - id: metadata/binary/layout/overlay::large-high-entropy-overlay
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/process/config/installer::sfx-runprogram-escaped-quote-value
  - id: micro-behaviors/ui/controls/progress::sfx-progress-disabled
  - id: micro-behaviors/data/archive/extract/destination::sfx-temp-install-path
  - id: micro-behaviors/process/config/installer::sfx-exchanger-d-runprogram
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: silent-temp-7zsfxmod-dynamics-soni-runprogram
  desc: Silent 7ZSfxMod extracts and runs Dynamics_Soni from temp
  crit: hostile
  conf: 0.995
  attack: T1027.009,T1204.002
  all:
  - id: metadata/binary/installer/archive::7zsfxmod-profile
  - id: metadata/binary/layout/overlay::large-high-entropy-overlay
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/ui/controls/progress::sfx-progress-disabled
  - id: micro-behaviors/data/archive/extract/destination::sfx-temp-install-path
  - id: micro-behaviors/process/config/installer::sfx-dynamics-soni-runprogram
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: silent-7zip-sfx-affiliate-runprogram
  desc: Silent 7-Zip SFX runs an affiliate site_id program
  crit: hostile
  conf: 0.97
  attack: T1027.009,T1204.002
  all:
  - id: metadata/binary/installer/archive::7zip-sfx-archive-profile
  - id: metadata/binary/layout/overlay::large-high-entropy-overlay
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/process/config/installer::sfx-runprogram-affiliate-site-id
  - id: micro-behaviors/ui/controls/progress::sfx-progress-disabled
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: admin-sfx-multiple-runprograms
  desc: Elevated SFX runs multiple programs from packed overlay
  crit: hostile
  conf: 0.99
  attack: T1027.009,T1105,T1548.002
  all:
  - id: micro-behaviors/process/config/installer::sfx-multiple-runprogram-stages
  - id: metadata/binary/layout/ratio::overlay-over-90pct
  - id: metadata/binary/layout/entropy::high-entropy-overlay
  - id: metadata/binary/layout/checksum::pe-checksum-zeroed
  - id: metadata/build/manifest::pe-requires-admin
  - id: micro-behaviors/process/create/shellexec::win-shellexecute
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/signed/platform/
- id: installvibes-elevated-resource-7zip-spawn
  desc: InstallVibes-signed elevated 7-Zip resource and shell launch
  crit: hostile
  conf: 0.995
  scope: outer
  attack: T1036.005,T1027.009,T1204.002,T1548.002
  all:
  - id: metadata/signed/unknown::installvibes
  - id: metadata/binary/resource/entropy::dominant-high-entropy-resources
  - id: metadata/binary/layout/embedded::7z-archive-signature-in-resource
  - id: metadata/build/manifest::pe-requires-admin
  - id: micro-behaviors/os/privilege/elevation::runas-verb-token
  - id: micro-behaviors/process/create/shellexec::shell-executeex-call
  unless:
  - id: metadata/signed/platform::microsoft
  - id: metadata/binary/installer/family::known-benign-installer
