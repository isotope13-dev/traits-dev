defaults:
  platforms: [unix, windows]

traits:
  - id: jvm-desktop-open-reference
    desc: JVM references Desktop.open
    crit: notable
    conf: 0.94
    for: [class]
    if:
      type: import
      exact: java/awt/Desktop.open

  - id: jar-extensionless-resource
    desc: JAR embeds an extensionless resource
    crit: component
    conf: 0.91
    for: [jar]
    if:
      type: value
      path: archive.members[*].path
      regex: '^(resources|assets)/[a-zA-Z0-9_-]{4,40}$'

composite_rules:
  - id: jvm-resource-process-with-desktop-open
    desc: JVM reads and writes resources beside a process launch and Desktop.open
    crit: notable
    conf: 0.95
    for: [class]
    scope: file
    all:
      - id: micro-behaviors/data/embedded/payload/resource::java-classpath-resource-stream
      - id: micro-behaviors/fs/file/open/write::jvm-fileoutputstream-constructor
      - id: micro-behaviors/fs/chmod/executable/mode::jvm-owner-execute-permission
      - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-bytecode
      - id: jvm-desktop-open-reference

  - id: jar-encrypted-executable-with-display-decoy
    desc: JAR combines concealed resources, decryption, executable launch and a decoy
    crit: hostile
    conf: 0.98
    attack: T1027.013,T1204.002,T1059
    for: [jar, class]
    scope: archive
    all:
      - id: jar-extensionless-resource
      - id: jvm-resource-process-with-desktop-open
      - id: micro-behaviors/crypto/cipher/reference::java-raw-key-cipher-use
