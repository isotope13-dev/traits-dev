defaults:
  platforms: [windows, unix]
  for: [java]
  attack: T1105
  mbc: B0042

composite_rules:
  # Requiring the encrypted bundled resource, HTTP body handling, and a child
  # process together distinguishes a staged loader from ordinary packaging.
- id: java-bundled-encrypted-stage-launch
  desc: Java decrypts a bundled stage and launches it
  crit: hostile
  conf: 0.98
  for: [class, java_class, jar]
  attack: T1027,T1105,T1140,T1204.002
  mbc: B0030,B0042
  scope: archive
  all:
  - id: micro-behaviors/data/embedded/payload/resource::java-class-getresourceasstream
  - id: micro-behaviors/crypto/cipher/reference::java-raw-key-cipher-use
  - id: micro-behaviors/communications/http/lib/urlconnection::jvm-http-urlconnection-inputstream
  - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-bytecode

  # Kept suspicious rather than hostile: the source proves a backdoor-labeled
  # decoded-file writer, but an empty/template Base64 value may leave it inert
  # and there is no execution stage in this file.
- id: java-encrypted-stage-drop-exec
  desc: Java decrypts and executes staged file
  crit: hostile
  conf: 0.99
  for: [class, java_class]
  all:
  - id: objectives/execution/staging/store::java-encrypted-file-dropper
  - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-bytecode
  - id: micro-behaviors/process/control/wait::java-process-waitfor-bytecode

- id: java-encrypted-zip-stage-drop-exec
  desc: Java decrypts ZIP entries and launches a staged process
  crit: hostile
  conf: 0.99
  for: [class, java_class]
  all:
  - id: micro-behaviors/crypto/cipher/reference::java-raw-key-cipher-use
  - id: micro-behaviors/data/decode/base64/call::java-base64-decoding-bytecode
  - id: micro-behaviors/data/archive/extract/zip::jvm-zip-entry-extraction-to-file
  - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-bytecode
  - id: micro-behaviors/process/stdio/configure::java-processbuilder-redirected-stdio

