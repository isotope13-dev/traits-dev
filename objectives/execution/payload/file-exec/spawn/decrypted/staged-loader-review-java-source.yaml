defaults:
  platforms: [windows, unix]
  for: [java]
  attack: T1105
  mbc: B0042

composite_rules:
  # Kept suspicious rather than hostile: the source proves a backdoor-labeled
  # decoded-file writer, but an empty/template Base64 value may leave it inert
  # and there is no execution stage in this file.
- id: java-encrypted-stage-drop-exec
  desc: Java decrypts and executes staged file
  crit: hostile
  conf: 0.99
  for: [class, java_class]
  all:
  - id: objectives/execution/staging/store::java-encrypted-file-dropper
  - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-bytecode
  - id: micro-behaviors/process/control/wait::java-process-waitfor-bytecode

- id: java-encrypted-zip-stage-drop-exec
  desc: Java decrypts ZIP entries and launches a staged process
  crit: hostile
  conf: 0.99
  for: [class, java_class]
  all:
  - id: micro-behaviors/crypto/cipher/unspecified::java-raw-key-cipher-use
  - id: micro-behaviors/data/decode/base64/unspecified::java-base64-decoding-bytecode
  - id: micro-behaviors/data/archive/extract/zip::jvm-zip-entry-extraction-to-file
  - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-bytecode
  - id: micro-behaviors/process/stdio/configure::java-processbuilder-redirected-stdio

