defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027,T1140,T1059.007
  mbc: B0024

composite_rules:
  - id: node-decrypted-temp-file-spawn
    desc: Writes decrypted payload to /tmp and passes path to child process
    crit: suspicious
    conf: 0.94
    near_lines: 15
    all:
      - id: micro-behaviors/fs/write/file/stage::node-write-decrypted-temp-file
      - id: micro-behaviors/process/argument/positional::node-spawn-temp-path-arg
    unless:
      - id: metadata/path/directory::test-directory-component
