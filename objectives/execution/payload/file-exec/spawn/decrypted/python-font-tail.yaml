# The carrier is decrypted and made executable before a new-session child is
# launched. These are coherent same-file clues, not proven data flow.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1027.009,T1140,T1105
composite_rules:
  - id: python-encrypted-font-tail-execution
    desc: Fetches font-carried encrypted stage and launches it detached
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: objectives/execution/staging/reconstruct::encrypted-font-executable-staging
      - id: micro-behaviors/process/create/subprocess/launch::python-subprocess-launch-calls
      - id: micro-behaviors/process/daemonize/detach::python-subprocess-new-session-option
    any:
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/communications/http/get::requests-get
