defaults:
  platforms: [windows]
  for: [c, cpp, html, text]
  attack: T1027.009,T1204.002
composite_rules:
  # Binder/stub pattern: the program locates its own image, seeks past the
  # stub into appended overlay records, decrypts each record with a keyed
  # byte transform, drops the plaintext into a Windows system or temp
  # directory, and launches the dropped file. The decrypt leg separates this
  # from ordinary self-extracting installers, which do not carry a
  # subtract-then-XOR keyed record transform beside the drop-and-run chain.
  - id: c-self-overlay-decrypt-drop-exec
    desc: Self overlay decrypt, system-dir drop and launch
    crit: hostile
    conf: 0.98
    near_lines: 90
    all:
      - id: micro-behaviors/fs/path/self::source-self-module-path-read
      - id: micro-behaviors/fs/file/seek::source-setfilepointer-from-begin
      - id: micro-behaviors/fs/file/open/write::source-createfile-write-access
      - id: micro-behaviors/data/encode/xor::c-subtract-xor-keyed-transform
      - id: micro-behaviors/os/sysinfo/directories::windows-or-temp-directory-call
      - id: micro-behaviors/os/handler/open::source-shellexecute-open-call
