# Node.js dropper that fetches an encrypted payload over HTTP, Base64-decodes
# and cipher-decrypts it, writes it to disk, and launches the staged path as a
# detached background process with ignored stdio and unref().
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1105,T1140,T1059.007
  mbc: B0024

composite_rules:
  - id: node-cipher-decrypt-write-detached-spawn-routine
    desc: Decrypts Base64 file into detached spawn
    crit: notable
    conf: 0.96
    near_bytes: 2500
    all:
      - id: micro-behaviors/crypto/decrypt/initialize::createDecipheriv
      - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64
      - id: micro-behaviors/fs/write/file/full/unspecified::write-file-sync
      - id: micro-behaviors/process/create/variable::spawn-variable-program
      - id: micro-behaviors/process/daemonize/detach::detached-true
      - id: micro-behaviors/process/stdio/configure::child-stdio-ignore-option
      - id: micro-behaviors/process/control/wait::node-unref-handle

  - id: node-http-decrypted-detached-dropper
    desc: Fetches, decrypts, and spawns detached stage
    crit: hostile
    conf: 0.99
    all:
      - id: node-cipher-decrypt-write-detached-spawn-routine
      - id: micro-behaviors/communications/url/host/domain-http::js-hardcoded-remote-endpoint
    any:
      - id: micro-behaviors/communications/http/request/client::node-http-imported-request-stream
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/get::axios-get-call
      - id: micro-behaviors/communications/http/request/evented::node-evented-get-response
    unless:
      - id: micro-behaviors/communications/url/host/tld-http::single-nonexistent-fetch-example
      - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context
      - id: micro-behaviors/crypto/hash/file::node-sha256-sidecar-verified-download
