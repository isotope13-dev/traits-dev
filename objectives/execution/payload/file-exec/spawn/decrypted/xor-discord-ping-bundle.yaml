defaults:
  for: [pe]
  platforms: [windows]
  attack: T1027,T1140,T1105

traits:
  - id: xor-discord-ping-tool-bundle
    desc: XOR-packed Discord bot and ping tool bundle
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule xor_discord_ping_tool_bundle {
          strings:
            $key = "q<!rq+09952q:d(j54w$tu4y=3/!=a=h" ascii
            $bot = { 2B 78 48 01 12 44 42 5D 66 71 73 23 71 4A 4D 12 50 }
            $ping = { 01 55 4F 15 2E 5F 5F 56 55 1B 57 09 5F }
            $encoded_pe = { 3C 66 B1 72 72 2B 30 39 3D 35 32 71 C5 9B 28 6A }
            $execute = "ShellExecuteA" ascii
            $write = "fwrite" ascii
          condition:
            uint16(0) == 0x5a4d and all of them and #encoded_pe >= 2
        }
