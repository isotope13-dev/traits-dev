defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027,T1140,T1059.003
  mbc: B0024

composite_rules:
  - id: pe-decoded-payload-drop-and-execute
    desc: Decodes payload to file and executes shell
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/bitwise/complement::x86-signed-byte-complement-loop
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: micro-behaviors/process/create/shell/reference::cmd-reference-create-process-w
      - id: micro-behaviors/fs/file/open/unspecified::file-create-win
