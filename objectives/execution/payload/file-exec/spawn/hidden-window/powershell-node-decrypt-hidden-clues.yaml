defaults:
  for: [powershell]
  platforms: [windows]
composite_rules:
  - id: powershell-node-decrypt-hidden-clues
    desc: Node decrypt/write and hidden-context clues
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/execution/staging/runtime::powershell-node-decrypt-write-clues
    any:
      - id: micro-behaviors/process/create/hidden::powershell-hidden-node-start
      - id: micro-behaviors/process/create/hidden::powershell-node-variable-hidden-start-text
      - id: micro-behaviors/process/argument/interpreter::powershell-js-domain-argument-text
      - id: micro-behaviors/process/sync/mutex::global-guid-mutex-management
      - id: micro-behaviors/ui/window/control::powershell-terminal-showwindow-text
      - id: micro-behaviors/ui/window/display::user32-showwindow-pinvoke
      - id: micro-behaviors/ui/window/handle-control::powershell-showwindow-mainwindow-hide
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
      - id: metadata/file/line::powershell-long-line
    needs: 3
