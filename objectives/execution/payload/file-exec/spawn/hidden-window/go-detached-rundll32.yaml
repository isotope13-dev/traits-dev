defaults:
  platforms: [windows]
  for: [pe]
  attack: T1218.011,T1548.002,T1564.003

traits:
  - id: go-main-ps-get-sys-proc-attr-symbol
    desc: Go psGetSysProcAttr helper symbol
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: main.psGetSysProcAttr

composite_rules:
  - id: go-elevated-detached-rundll32-launcher
    desc: Go binary checks AV product state, self-elevates, and launches detached Rundll32
    crit: hostile
    conf: 0.99
    all:
      - id: go-main-ps-get-sys-proc-attr-symbol
      - id: objectives/supply-chain/trojanized/app/crypto-auth-dropper::go-main-launch-detached-symbol
      - id: objectives/supply-chain/trojanized/app/crypto-auth-dropper::go-main-rundll32-symbol
      - id: objectives/supply-chain/trojanized/app/crypto-auth-dropper::go-main-run-me-elevated-symbol
      - id: objectives/supply-chain/trojanized/app/crypto-auth-dropper::go-main-decode-product-state-symbol
