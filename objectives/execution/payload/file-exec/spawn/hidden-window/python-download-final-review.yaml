defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  attack: T1105
  mbc: E1105


composite_rules:
  - id: python-hidden-powershell-zip-launch
    desc: Hidden PowerShell, ZIP extraction and launch clues
    crit: hostile
    conf: 0.96
    attack: T1105,T1059.001,T1564.003
    all:
      - id: micro-behaviors/process/config/window::python-powershell-w-hidden
      - id: micro-behaviors/data/archive/extract/zip::extract-to-directory
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
  - id: python-unparsed-hidden-pythonw-fetch
    desc: Hidden pythonw and HTTP response write clues
    crit: hostile
    conf: 0.97
    attack: T1105,T1564.003
    scope: file
    near_lines: 8
    all:
      - id: micro-behaviors/communications/http/lib/requests::requests-get-text
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-text
      - id: micro-behaviors/os/application/target/development::pythonw-executable-reference
      - id: micro-behaviors/process/create/subprocess/launch::popen-content
      - id: micro-behaviors/process/config/launch::python-qualified-create-no-window
  - id: python-thread-urlretrieve-temp-exe
    desc: Threaded URL retrieve and hidden EXE clues
    crit: hostile
    conf: 0.97
    attack: T1105,T1059.006
    scope: file
    near_lines: 18
    all:
      - id: micro-behaviors/communications/http/lib/urllib::python-urlretrieve-qualified
      - id: micro-behaviors/fs/temp/directory::python-named-temp-exe
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
      - id: micro-behaviors/process/thread/create::python-daemon-thread
      - id: micro-behaviors/process/config/launch::python-create-no-window-hex
