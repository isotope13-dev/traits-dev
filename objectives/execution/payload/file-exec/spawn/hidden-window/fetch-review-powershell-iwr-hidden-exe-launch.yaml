defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1105
  mbc: B0030

composite_rules:
- id: powershell-iwr-hidden-exe-launch
  desc: PowerShell downloads executable via Invoke-WebRequest and launches it hidden
  crit: hostile
  conf: 0.98
  attack: T1105,T1204.002,T1564.003
  unless:
  - id: micro-behaviors/crypto/verify::powershell-sha256-mismatch-aborts
  - id: micro-behaviors/os/package-manager/run::start-process-msiexec
  - id: well-known/lib/platform/browser-automation/automation-context::playwright-core-chrome-reinstall-helper
  - id: metadata/build/recognized-contexts::sysmanage-prerequisite-installer-context
  all:
  - id: micro-behaviors/process/deploy/file-exec/command::powershell-same-variable-hidden-launch
  - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
  near_bytes: 8192
