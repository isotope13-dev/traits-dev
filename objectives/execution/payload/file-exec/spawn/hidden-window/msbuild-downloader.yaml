# Inline task execution plus download, hidden child launch and a BITS disguise
# distinguishes this chain from ordinary MSBuild HTTP asset retrieval.
defaults:
  platforms: [windows]
  for: [xml]
composite_rules:
  - id: msbuild-bits-disguised-hidden-downloader
    desc: MSBuild HTTP downloader hides child process with BITS user agent
    crit: hostile
    conf: 0.97
    attack: T1127.001,T1105,T1564.003
    all:
      - id: objectives/execution/staging/http::msbuild-inline-http-process-launch
      - id: micro-behaviors/process/config/window::managed-process-hidden-window-style
      - id: micro-behaviors/communications/http/download/webclient::xml-downloadfile-invocation
      - id: micro-behaviors/communications/http/request/header/user-agent::managed-bits-user-agent-assignment
