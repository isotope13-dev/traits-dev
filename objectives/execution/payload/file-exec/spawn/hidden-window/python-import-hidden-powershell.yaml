defaults:
  platforms:
    - unix
    - windows
  for:
    - python

composite_rules:
  - id: python-import-hidden-powershell
    desc: Import-time process and hidden PowerShell clues
    crit: suspicious
    conf: 0.96
    scope: file
    near_lines: 15
    all:
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
      - id: micro-behaviors/process/argument/visibility::argv-array-windowstyle-hidden
      - id: "micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-text"
      - id: micro-behaviors/data/control-flow/module-exec::python-column0-noarg-call-assignment
