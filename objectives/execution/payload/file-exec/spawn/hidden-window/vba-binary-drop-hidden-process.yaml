# The open event writes bytes to a file with binary file I/O and starts it
# through CreateProcess with CREATE_NO_WINDOW (&H8000000).
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1204.002,T1106

composite_rules:
  - id: vba-open-event-drops-binary-runs-hidden
    desc: Open event drops file, runs it hidden
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/application/hook/event::vba-auto-open-sub-decl
      - id: micro-behaviors/fs/write/file/binary::vb6-binary-file-write-source
      - id: micro-behaviors/process/create/exec::create-process-api-name
      - id: metadata/lang/source/literal/hex::vb-hex-08000000
