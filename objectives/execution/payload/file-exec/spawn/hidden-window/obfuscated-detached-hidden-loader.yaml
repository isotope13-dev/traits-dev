defaults:
  for: [javascript]
  platforms: [windows, unix]

# Obfuscated JavaScript that starts a detached child with its window hidden is
# a loader: the child outlives the parent and runs out of sight. The escaped
# option names alone do not prove this; they are only evidence when the same
# source carries the obfuscator's own string-table machinery.
composite_rules:
  - id: escaped-detached-hidden-spawn-pair
    desc: Escaped detached and windowsHide options sit together
    crit: notable
    near_bytes: 300
    all:
      - id: objectives/execution/payload/file-exec/spawn/hidden-window::escaped-detached-option
      - id: objectives/execution/payload/file-exec/spawn/hidden-window::escaped-windowshide-option
  - id: obfuscated-detached-hidden-child-loader
    desc: Obfuscated JavaScript starts a detached hidden-window child
    crit: hostile
    conf: 0.9
    attack: T1564.003,T1059.007
    all:
      - id: objectives/execution/payload/file-exec/spawn/hidden-window::escaped-detached-hidden-spawn-pair
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::js-obfuscator-output-marker
