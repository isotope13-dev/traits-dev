defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1548.002,T1564.003,T1204.002
  mbc: B0030

composite_rules:
  - id: powershell-elevated-sibling-exe-hidden-launch
    desc: PowerShell hides console, elevates, and launches sibling EXE hidden
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/evasion/process/hidden/console::powershell-hides-console-window
      - id: micro-behaviors/fs/path/construct::powershell-join-path-executable
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/process/create/cmdlet::start-process-symbol-call
    any:
      - id: objectives/privilege-escalation/elevation-control/prompt-loop::powershell-psi-verb-runas
      - id: micro-behaviors/os/privilege/elevation::powershell-start-process-runas
