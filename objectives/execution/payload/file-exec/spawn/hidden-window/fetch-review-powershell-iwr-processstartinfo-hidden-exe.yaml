defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1105
  mbc: B0030

composite_rules:
- id: powershell-iwr-processstartinfo-hidden-exe
  desc: Invoke-WebRequest stages an executable and hides its start
  crit: hostile
  conf: 0.97
  for: [powershell, pe]
  attack: T1105,T1204.002,T1564.003
  near_bytes: 8192
  unless:
  - id: micro-behaviors/os/package-manager/run::start-process-msiexec
  - id: well-known/lib/platform/browser-automation/automation-context::playwright-core-chrome-reinstall-helper
  - id: metadata/build/recognized-contexts::sysmanage-prerequisite-installer-context
  all:
  - id: micro-behaviors/communications/http/download/cli/web-cmdlet::iwr-outfile-download
  - id: micro-behaviors/process/config/window::powershell-processstartinfo-hidden-window
  any:
  - id: micro-behaviors/communications/url/resource-path/file::http-executable-url-in-binary
  - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
