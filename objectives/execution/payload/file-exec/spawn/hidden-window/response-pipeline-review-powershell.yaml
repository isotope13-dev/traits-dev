defaults:
  platforms: [windows]
  for: [powershell]
traits: []
composite_rules:
  - id: ps-decode-drop-temp-hidden-reexec
    desc: PowerShell drops decoded TEMP script launched hidden
    crit: hostile
    conf: 0.96
    mbc: "B0030"
    attack: "T1059.001,T1027,T1564.003"
    all:
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/fs/write/file/full/string::write-all-text
      - id: micro-behaviors/fs/path/temp::env-temp
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
    unless:
      - id: metadata/package/testing/presence/ci::powershell-ci-verification-harness
