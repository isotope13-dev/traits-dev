defaults:
  platforms: [windows, unix]
  size_min: 200
  size_max: 1000000

composite_rules:
  - id: csrsshost-embedded-pe-stealth-dropper
    desc: Embedded PE stealth dropper and csrsshost name
    crit: hostile
    conf: 0.995
    for:
      - javascript
    all:
      - id: micro-behaviors/fs/path/executable::csrsshost-exe-string
      - id: objectives/execution/payload/file-exec/detached::embedded-pe-stealth-dropper
