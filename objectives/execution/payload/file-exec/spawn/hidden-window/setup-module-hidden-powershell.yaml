defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]

composite_rules:
  - id: setup-module-hidden-powershell
    desc: Setup module has hidden PowerShell execution clues
    crit: suspicious
    conf: 0.95
    scope: file
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system-text
      - id: micro-behaviors/process/config/window::python-powershell-w-hidden
