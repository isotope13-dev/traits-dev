defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1105
  mbc: B0030

composite_rules:
- id: powershell-encoded-http-hidden-file-dropper
  desc: PowerShell decodes and launches a remote file hidden, then deletes its loader
  crit: hostile
  conf: 0.99
  attack: T1105,T1204.002,T1564.003,T1070.004
  mbc: B0030,B0032,F0007
  near_bytes: 16384
  all:
  - id: objectives/execution/payload/file-exec/command/fetch::powershell-http-decode-write-start
  - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  - id: micro-behaviors/fs/delete/file/self::powershell-self-delete
