defaults:
  for: [javascript]
  platforms: [windows, unix]
traits:
  - id: escaped-detached-option
    desc: Escaped detached option name
    crit: notable
    if:
      type: text
      substr: '\x64\x65\x74\x61\x63\x68\x65\x64'
  - id: escaped-windowshide-option
    desc: Escaped windowsHide option name
    crit: notable
    if:
      type: text
      substr: '\x77\x69\x6e\x64\x6f\x77\x73\x48\x69\x64\x65'
  - id: escaped-unref-method
    desc: Escaped unref method name
    crit: notable
    if:
      type: text
      substr: '\x75\x6e\x72\x65\x66'
composite_rules:
  - id: obfuscated-collector-hidden-spawn
    desc: Credential collector with hidden detached spawn clues
    crit: hostile
    attack: T1059.007,T1564.003
    all:
      - id: objectives/exfiltration/stealer/credential/sweep::obfuscated-credential-tree-multipart-collector
      - id: escaped-hidden-detached-spawn-clues
  - id: escaped-hidden-detached-spawn-clues
    desc: Spawn call near escaped process option names and unref
    crit: notable
    near_bytes: 500
    all:
      - id: metadata/lang/source/syntax/call/relationship::bare-spawn-call
      - id: escaped-detached-option
      - id: escaped-windowshide-option
      - id: escaped-unref-method
