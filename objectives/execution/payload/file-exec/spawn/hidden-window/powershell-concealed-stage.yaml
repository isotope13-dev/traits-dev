defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-concealed-encrypted-hidden-launch
    desc: Concealed type resolution, encrypted staging and hidden process launch
    crit: hostile
    conf: 0.97
    attack: T1027,T1140,T1564.003
    all:
      - id: objectives/anti-static/obfuscation/reflection/encoded::powershell-hex-xor-indexed-types
      - id: objectives/anti-static/obfuscation/payload/encrypted::powershell-reassembled-encrypted-write
      - id: micro-behaviors/process/config/window::powershell-processstartinfo-no-window
      - id: micro-behaviors/process/create/subprocess/launch::powershell-startinfo-and-start
