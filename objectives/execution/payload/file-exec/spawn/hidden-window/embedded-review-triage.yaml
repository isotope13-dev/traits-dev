defaults:
  platforms: [windows]
  for: [vbs]
  mbc: B0023
composite_rules:
  - id: vbs-obfuscated-stream-save-hidden-run
    attack: T1027,T1059.005,T1564.003
    desc: Obfuscated VBScript saves stream to file and executes with hidden window
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/write/stream::wsh-savetofile
      - id: micro-behaviors/process/create/hidden::wsh-run-hidden-statement
      - id: micro-behaviors/os/com/instantiation::vbs-computed-createobject
    any:
      - id: objectives/anti-static/obfuscation/wsh::chr-concatenated-com-progid
      - id: objectives/anti-static/obfuscation/string/concat::vbs-amp-fragment-concat
      - id: objectives/anti-static/obfuscation/string/fragmentation::vbs-xor-character-code--right
      - id: objectives/execution/payload/file-exec/command/script-host-download::wsh-xor-decode-loop

  - id: wsh-obfuscated-script-stager
    attack: T1027,T1059.001,T1059.005,T1564.003
    desc: VBScript stages encoded content for hidden script evaluation
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/bitwise/xor-forms/scalar::vbs-numeric-code-xor
      - id: micro-behaviors/os/com/instantiation::vbs-computed-createobject
      - id: micro-behaviors/fs/write/stream::wsh-savetofile
      - id: micro-behaviors/process/create/hidden::wsh-run-hidden-statement
      - id: metadata/file/line::vbs-long-average-lines
      - id: micro-behaviors/process/interpreter/eval/powershell::embedded-powershell-delete-then-eval
    any:
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file-observed
