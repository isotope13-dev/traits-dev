defaults:
  platforms: [windows]
  for: [pyc]
  attack: T1059.006,T1564.003,T1027
  mbc: E1059

composite_rules:
  - id: pyc-hex-temp-exe-hidden-spawn
    desc: Python bytecode decodes hex payload to temp EXE and runs hidden
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: metadata/file/encoding/hex::long-hex-text-run
      - id: micro-behaviors/data/decode/hex::pyc-hex-decode-name
      - id: micro-behaviors/os/sysinfo/directories::python-gettempdir-reference
      - id: micro-behaviors/fs/path/executable::pyc-exe-filename-text
      - id: metadata/binary/code/bytecode::pyc-hidden-child-launch
