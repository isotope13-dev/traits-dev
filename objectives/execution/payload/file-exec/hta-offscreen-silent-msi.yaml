# ClickFix/RMM-lure HTAs park their window off-screen, relaunch themselves
# elevated through mshta with the runas verb, scrub the Zone.Identifier
# stream from themselves and the fetched package, and hand an MSI to a
# silent msiexec transaction. Each step is individually a dual-use API; the
# required combination is not a shape legitimate updaters take (the sibling
# timed-error batch lure establishes the same family conviction for the
# batch-script variant).
defaults:
  platforms: [windows]
  for: [html]
  attack: T1105,T1218.007,T1548.002,T1564.003

composite_rules:
  - id: hta-offscreen-elevated-silent-msi-chain
    desc: Off-screen HTA elevates, silent-installs an MSI
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: micro-behaviors/ui/window/control::window-offscreen-or-trivial-resize
      - id: micro-behaviors/fs/delete/file/command::cmd-deletes-zone-identifier-stream
      - id: micro-behaviors/os/privilege/elevation::shellexecute-quoted-runas-verb
      - id: micro-behaviors/process/argument/option::quiet-package-install-args
