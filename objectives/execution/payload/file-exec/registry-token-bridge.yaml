defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  # Credential theft supplies admission; a normal updater retains only the
  # neutral same-path chain. This does not infer the fetched program's code.
  - id: registry-token-theft-downloaded-file-launch
    desc: Token theft beside downloaded file execution
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.004
    near_bytes: 1024
    all:
      - id: objectives/exfiltration/stealer/credential/value/token::shell-registry-token-curl-stdin-upload
      - id: micro-behaviors/process/deploy/file-exec::shell-curl-chmod-same-variable-exec
