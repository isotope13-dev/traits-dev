# Batch executes hidden encoded PowerShell dropper targeting AppData
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1059.001,T1059.003,T1105,T1564.003
  mbc: B0030,E1059

composite_rules:
  - id: batch-hidden-encoded-powershell-appdata-dropper
    desc: Batch launches hidden encoded PowerShell dropper staging executable in AppData
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/hidden::powershell-hidden-window
      - id: micro-behaviors/process/argument/option::powershell-encoded-command-text
      - id: objectives/anti-static/obfuscation/string/concat::powershell-concatenated-url
      - id: micro-behaviors/process/deploy/file-exec::powershell-appdata-download-invoke-item-cluster
