composite_rules:
- id: three-phase-resource-rundll32-stager
  desc: Decoded resource and rundll32 launch template
  crit: hostile
  conf: 0.96
  attack: T1140,T1218.011
  for:
  - pe
  - dll
  all:
  - id: metadata/binary/resource/entropy::high-entropy-resource-small-pe
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/process/create/spawn::child-process-creation-api
  - id: metadata/binary/section/permission::pe-multiple-executable-writable-sections
  - id: micro-behaviors/data/decode/custom::x86-three-phase-subtract-byte-decoder
  - id: micro-behaviors/process/create/construction::rundll32-plugin-argument-template
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
  - id: well-known/tool/
  platforms:
  - windows
