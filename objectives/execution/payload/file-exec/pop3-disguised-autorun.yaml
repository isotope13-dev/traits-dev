defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # Mail clients can save attachments, and updaters can validate and execute
  # images. Require the disguised system-name autorun installation as well.
  - id: pop3-disguised-autorun-loader
    desc: POP3 retrieval and tagged EXE launch with disguised autorun
    crit: hostile
    conf: 0.97
    attack: T1105
    all:
      - id: micro-behaviors/communications/email/access/pop3::native-retrieval-command-set
      - id: metadata/binary/instruction::x86-nine-byte-argument-x-tag-call-gate
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/fs/write/file/handle::write--fwrite
      - id: objectives/evasion/masquerade/process/name::runservices-browser-input-process-masquerade
