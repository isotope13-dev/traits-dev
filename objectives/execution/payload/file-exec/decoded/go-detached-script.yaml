# Go dropper: an embedded Base64/hex blob is decoded, written to disk and
# handed to /bin/sh in a new session, so the stage outlives the host binary
# and never shows on its terminal.
defaults:
  platforms: [unix]
  for: [go]
  attack: T1140,T1059.004
composite_rules:
  - id: go-decoded-script-detached-shell
    desc: Go runs a decoded script in a new session
    crit: suspicious
    conf: 0.92
    near_lines: 40
    all:
      - id: micro-behaviors/data/decode/to-file::go-decoded-bytes-written-to-file
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-bin-sh
      - id: micro-behaviors/process/daemonize/detach::go-setsid-sysprocattr
  # Only deploying when it already holds root is how an implant avoids a
  # half-install that would surface errors; utilities that need root say so.
  - id: go-root-gated-decoded-script-dropper
    desc: Root-only Go drop of a decoded detached script
    crit: hostile
    conf: 0.93
    near_lines: 40
    all:
      - id: go-decoded-script-detached-shell
      - id: micro-behaviors/os/privilege/check::geteuid-root-check
