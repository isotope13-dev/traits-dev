# Decode-then-run dropper: a Base64 blob is written to a path held in a
# variable and that path is handed to an interpreter in a new session, so
# the stage outlives the installer and never touches its terminal.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1140,T1059.004
composite_rules:
  - id: shell-decoded-script-detached-run
    desc: Decoded script launched in a detached session
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/data/decode/to-file::base64-decode-to-variable-path
      - id: micro-behaviors/process/daemonize/detach::detached-interpreter-variable-script
