defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1105,T1027

traits:
  - id: dns-txt-key-lookup
    desc: Script resolves TXT key record
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: 'dns\.resolveTxt\(["\x27]_check\._tcp\.[a-z0-9.-]+["\x27]'

  - id: txt-record-hex-key
    desc: Script decodes TXT record as key
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: '(?s)records\[0\]\[0\].{0,100}Buffer\.from\(data,\s*["\x27]hex["\x27]\)'

  - id: decrypt-license-payload
    desc: Script decrypts bundled license file
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: '(?s)readFileSync\(["\x27]license\.bin["\x27]\).{0,120}createDecipheriv\(["\x27]aes-256-cbc'

  - id: write-decrypted-license
    desc: Script writes decrypted license file
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: 'writeFileSync\(["\x27]license\.txt["\x27],\s*decrypted\)'

  - id: preinstall-exec-decrypted-license
    desc: Install hook executes license file
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      regex: 'node\s+preinstall\.js\s*&&\s*chmod\s+\+x\s+\./license\.txt\s*&&\s*\./license\.txt'

composite_rules:
  - id: npm-dns-key-aes-license-exec
    desc: Install hook executes bundled payload decrypted with DNS key
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar, javascript, package.json]
    scope: archive
    all:
      - id: dns-txt-key-lookup
      - id: txt-record-hex-key
      - id: decrypt-license-payload
      - id: write-decrypted-license
      - id: preinstall-exec-decrypted-license
