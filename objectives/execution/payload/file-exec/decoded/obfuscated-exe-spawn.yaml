# Obfuscated JavaScript whose decoded strings resolve to a detached,
# hidden-window, stdio-suppressed executable launch.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: js-exe-target-literal-or-join
    desc: JavaScript builds or names executable target
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/os/application/target/development::js-javaw-exe-literal
      - id: micro-behaviors/fs/path/construct::node-executable-path-join
      - id: micro-behaviors/fs/path/extension::js-executable-filename-literal
  - id: obfuscated-decoded-exe-hidden-launcher
    desc: Obfuscated JavaScript spawns detached hidden-window executable silently
    crit: hostile
    conf: 0.96
    attack: T1027.002,T1564.003,T1059.007
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::js-obfuscator-output-marker
      - id: micro-behaviors/process/create/subprocess/launch::node-spawn-or-fork-call
      - id: micro-behaviors/process/stdio/configure::child-stdio-ignore-option
      - id: micro-behaviors/process/config/window::windowshide-boolean-setting
      - id: micro-behaviors/process/daemonize/detach::detached-obfuscated-true
      - id: objectives/execution/payload/file-exec/decoded::js-exe-target-literal-or-join
    unless:
      - id: metadata/path/directory::test-directory-component
      - id: metadata/build/minifier::intentional-obfuscated-javascript-artifact-context
