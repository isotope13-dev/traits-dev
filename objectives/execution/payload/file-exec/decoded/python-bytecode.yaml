defaults:
  for: [pyc]
  platforms: [windows, unix]

composite_rules:
  # A shared bytecode name table supplies corroboration, not recovered flow.
  # Ordinary crypto tools and temporary-process launchers each miss a role.
  - id: pyc-encrypted-temp-launcher
    desc: Bytecode combines AEAD unpacking, temporary files and process launch
    crit: suspicious
    conf: 0.93
    near_bytes: 512
    all:
      - id: micro-behaviors/crypto/decrypt/transform/reference::pyc-decrypt-and-verify-reference
      - id: micro-behaviors/data/decompress/stream::pyc-decompress-identifier
      - id: micro-behaviors/fs/temp/mktemp::pyc-named-temporary-file
      - id: micro-behaviors/process/create/subprocess/launch::pyc-popen-reference

  - id: pyc-analysis-aware-encrypted-launcher
    desc: Encrypted temporary launcher with debugger and VM checks
    crit: hostile
    conf: 0.98
    platforms: [windows]
    attack: T1027
    all:
      - id: pyc-encrypted-temp-launcher
      - id: micro-behaviors/process/debug/detect::is-debugger-present-python-text
    any:
      - id: micro-behaviors/os/virtualization/hypervisor::virtualbox-guest-driver-reference
      - id: micro-behaviors/os/virtualization/hypervisor::vmmouse-string
