defaults:
  platforms: [windows]
  attack: T1204.002
  for: [lnk]

composite_rules:
  - id: lnk-minimized-webdav-ssl-script-host
    desc: LNK runs minimized script host from WebDAV
    crit: hostile
    conf: 0.99
    attack: T1059.005,T1105
    all:
      - id: micro-behaviors/process/config/target::lnk-script-host-target
      - id: "micro-behaviors/ui/window/state::lnk-minimized-inactive-window"
      - id: micro-behaviors/communications/http/webdav::webdav-ssl-unc-lnk-argument
      - id: micro-behaviors/process/config/launch::lnk-has-arguments
  - id: lnk-minimized-webdav-script-host
    desc: Minimized LNK launches a script host from WebDAV
    crit: hostile
    conf: 0.98
    attack: T1059.005,T1105,T1187
    all:
      - id: micro-behaviors/process/config/target::lnk-script-host-target
      - id: "micro-behaviors/ui/window/state::lnk-minimized-inactive-window"
      - id: micro-behaviors/process/config/launch::lnk-has-arguments
      - id: micro-behaviors/communications/http/webdav::webdav-redirector-lnk-argument
