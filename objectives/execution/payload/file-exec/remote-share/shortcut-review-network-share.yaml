defaults:
  platforms: [windows]
  for: [lnk]


composite_rules:
  - id: cmd-remote-share-launch-chain
    desc: Cmd LNK chains launches from remote shares
    crit: hostile
    conf: 0.99
    attack: T1021.002,T1202
    all:
      - id: micro-behaviors/process/argument/option::lnk-slash-c-switch
      - id: micro-behaviors/process/config/target::lnk-cmd-target
      - id: micro-behaviors/process/argument/file::unc-launch-chain
  - id: cmd-minimized-remote-script-host-launch
    desc: Minimized cmd launches a remote Windows script from an IP share
    crit: hostile
    conf: 0.995
    attack: T1021.002,T1059.003,T1059.005,T1204.002,T1564.003
    all:
      - id: micro-behaviors/process/argument/option::lnk-slash-c-switch
      - id: micro-behaviors/process/config/target::lnk-cmd-target
      - id: "micro-behaviors/ui/window/state::lnk-minimized-inactive-window"
      - id: micro-behaviors/fs/path/network::unc-ipv4-share-argument
      - id: micro-behaviors/process/argument/file::unc-script-host-argument
  # A shortcut that resolves to a host on the internet, written so it resolves
  # from wherever it lands. The expandable-environment block names `\\<ip>`,
  # which Windows connects to -- and authenticates to -- the moment the icon is
  # drawn; the relative path climbs four or more levels first, which is what a
  # shortcut does when its author does not know how deep the victim will
  # extract it.
  #
  # Neither half is conclusive alone. Corporate shortcuts do point at UNC
  # shares, and MSI-advertised shortcuts do use deep parent chains. A shortcut
  # that needs both is not pointing at a file server.
