defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: unc-executable-reverse-shell
    desc: Runs a reverse-shell executable from a network share
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/launch::batch-direct-unc-executable
      - id: objectives/command-and-control/reverse-shell/netcat::batch-nc-exe-reverse-shell
