---
defaults:
  platforms:
  - windows
  for:
  - lnk
composite_rules:
- id: cmd-minimized-unc-executable-reference
  desc: Minimized cmd shortcut references a remote executable
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/process/argument/option::lnk-slash-c-switch
  - id: micro-behaviors/process/config/target::lnk-cmd-target
  - id: micro-behaviors/ui/window/state::lnk-minimized-inactive-window
  - id: micro-behaviors/fs/path/network::unc-executable-path-argument
