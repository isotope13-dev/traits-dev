# Windows Script Host running a script that lives on a WebDAV share -- an
# HTTP(S) server reached through the WebClient redirector (\\host@SSL\...,
# \DavWWWRoot\) -- with the Run window hidden. The stage executes straight
# off the remote path; it is never written locally where a scanner would see
# it. Plain SMB shares (logon scripts on \\domain\NETLOGON) are not matched.
defaults:
  for: [vbs, javascript, xml]
  platforms: [windows]
  attack: T1059.005,T1564.003,T1105

composite_rules:
  - id: wsh-hidden-run-remote-share-script
    desc: WSH silently runs a script from WebDAV
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/control-flow/dispatch/run::wscript-shell-run-statement
      - id: micro-behaviors/fs/path/network::quoted-unc-script-path
      - id: micro-behaviors/communications/http/webdav::webdav-redirector-unc-reference
    any:
      - id: micro-behaviors/process/create/hidden::wsh-run-hidden-statement
      - id: micro-behaviors/process/create/hidden::wscript-shell-hidden-run
      - id: micro-behaviors/process/config/window::wscript-shell-run-hidden-window
    near_bytes: 400
