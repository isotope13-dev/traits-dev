# The script copies an archive from a WebDAV redirector path, unpacks it and
# hidden-runs a generated batch that calls regsvr32 on the unpacked DLL: a
# remote DLL is registered (its DllRegisterServer executed) from an
# attacker web server.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1218.010,T1105

composite_rules:
  - id: wsh-webdav-copy-hidden-regsvr32
    desc: Copies from WebDAV and hidden-runs regsvr32
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/webdav::wsh-davwwwroot-unc-string
      - id: micro-behaviors/fs/file/copy/call::fso-copyfile
      - id: micro-behaviors/os/application/target/utility::regsvr32-name-reference
      - id: micro-behaviors/process/create/hidden::wsh-hidden-cmd-run-variable-path
