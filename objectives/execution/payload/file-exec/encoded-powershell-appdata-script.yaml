defaults:
  platforms: [windows]
composite_rules:
  # The base64 PowerShell argument downloads a script over HTTP into %APPDATA%
  # and runs it with the call operator in the same pipeline: a fetch-and-run
  # stager, not a one-off download.
  - id: encoded-powershell-fetch-run-appdata-script
    desc: Encoded PowerShell downloads and runs an AppData script
    crit: hostile
    conf: 0.95
    attack: T1059.001,T1105,T1027.010
    all:
      - id: micro-behaviors/communications/http/get::encoded-powershell-web-get
      - id: micro-behaviors/communications/http/download/cli::encoded-appdata-script-output
      - id: micro-behaviors/process/interpreter/eval/indirect::encoded-appdata-script-invocation
