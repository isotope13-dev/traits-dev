defaults:
  platforms: [windows]
composite_rules:
  # Require concealment as well as decoded download/output/dispatch evidence.
  # Encoding and AppData alone also occur in legitimate deployment scripts.
  # The atoms show co-occurring paths, not equality of arbitrary basenames.
  - id: encoded-powershell-fetch-run-appdata-script
    desc: Concealed download and AppData script dispatch
    crit: hostile
    conf: 0.95
    attack: T1059.001,T1105,T1027.010
    all:
      - id: micro-behaviors/communications/http/get::encoded-powershell-web-get
      - id: micro-behaviors/communications/http/download/cli::encoded-appdata-script-output
      - id: micro-behaviors/process/interpreter/powershell/command::encoded-powershell-appdata-script-command
    any:
      - id: objectives/execution/interpreter/vbscript/loader::html-vbscript-hidden-encoded-powershell-launch
      - id: objectives/anti-static/obfuscation/syntax::vbs-concealed-shell-encoded-powershell
