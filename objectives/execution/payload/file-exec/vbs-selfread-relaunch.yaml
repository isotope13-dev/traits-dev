# Self-reading VBScript droppers decode their payload out of the script's own
# body (Mid/Slice + long-delimiter splitting), then hand the reconstructed
# command to cmd.exe with delayed expansion (`/v:on /c set E00n=...&& ... !E00n!`)
# so no single command line ever carries the payload. The self-path leg binds
# the decoded stage to this file; the delayed-expansion leg is the activation.
defaults:
  platforms: [windows]
  for: [vbs]

composite_rules:
- id: vbs-selfread-delayed-expansion-relaunch
  desc: VBScript self-decodes payload through cmd delayed expansion
  crit: hostile
  conf: 0.97
  attack: T1059.003,T1027
  all:
  - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
  - id: micro-behaviors/data/decode/custom::mid-sliced-variable
  - id: micro-behaviors/process/create/shell/command-mode::cmd-delayed-expansion-c
  - id: micro-behaviors/data/control-flow/dispatch::script-run-method-call
  any:
  - id: objectives/anti-static/obfuscation/eval/powershell-loader::ps-format-string-readalllines
  - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-method-invoke
  needs: 1
