defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: node-remote-stage-detached-launch
  desc: Node stages a remotely fetched file and launches a hidden detached child
  crit: hostile
  conf: 0.97
  attack: T1105,T1059.007
  all:
  - id: micro-behaviors/communications/http/request/evented::node-aliased-get-response-cycle
  - id: micro-behaviors/fs/write/file/full/unspecified::node-write-file-sync-join-path
  - id: micro-behaviors/process/create/hidden::detached-hidden-spawn
  - id: micro-behaviors/process/interpreter/node::spawn-current-runtime-process
  - id: micro-behaviors/process/control/wait::node-unref-handle
  unless:
  - id: metadata/path/directory::test-directory-component
