# Both legs bind the configured Discord executable URL to a streamed
# download and the saved file to a hidden shell. The landing directory is
# incidental: changing APPDATA to a cache path must retain this detection.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1105,T1059.003,T1564.003

composite_rules:
  - id: python-discord-streamed-hidden-dropper
    desc: Streams a Discord executable to disk and launches it hidden
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/deploy/file-exec/spawn::python-streamed-download-hidden-shell
      - id: micro-behaviors/communications/http/request/executable-resource::python-helper-get-discord-executable-url
