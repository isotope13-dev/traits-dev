defaults:
  for: [javascript]
  platforms: [unix, windows]
composite_rules:
  - id: node-response-write-detached-interpreter
    desc: HTTP response write with detached Node interpreter launch
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/client/exchange::fetch-call
      - id: micro-behaviors/fs/write/file/response-body::node-write-body-reader-result
      - id: micro-behaviors/process/interpreter/node::node-spawn-current-executable
      - id: micro-behaviors/process/control/wait::node-unref-handle
    any:
      - id: micro-behaviors/process/daemonize/detach::node-detached-negated-flag-option
      - id: micro-behaviors/process/config/launch::node-detached-true-option
