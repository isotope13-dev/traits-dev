defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.009,T1106,T1622
  mbc: B0009

composite_rules:
  - id: dotnet-zip-procthread-launcher
    desc: Unsigned .NET loader spawns native child from embedded ZIP resource
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: micro-behaviors/data/embedded/resource::dotnet-cil-manifest-resource-stream-call
      - id: micro-behaviors/data/archive/extract/zip::ziparchive-entry
      - id: micro-behaviors/process/create/native-symbol::create-process-w
      - id: micro-behaviors/process/create/native-symbol::init-proc-thread-attribute-list
      - id: micro-behaviors/process/create/native-symbol::update-proc-thread-attribute
      - id: micro-behaviors/process/resources/limits::create-job-object
      - id: objectives/anti-analysis/debugger-detect/check::debugger-api
    unless:
      - id: metadata/signature/verified/
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
