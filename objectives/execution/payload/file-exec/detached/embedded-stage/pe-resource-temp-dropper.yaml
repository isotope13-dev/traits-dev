# Native PE dropper that extracts an embedded PE from resources to the
# Windows temp directory and spawns a child process with CREATE_NO_WINDOW.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1564.003
  mbc: B0009

composite_rules:
  - id: pe-embedded-resource-temp-hidden-dropper
    desc: Unsigned PE extracts embedded PE from resources to temp and runs hidden
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/layout/embedded::embedded-pe-image
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-load-lock-chain
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-import
      - id: micro-behaviors/fs/file/open/call::file-create-win
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: micro-behaviors/process/config/window::x64-createprocess-no-window
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product/
