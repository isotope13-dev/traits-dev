# These co-occurring capabilities do not establish the child process target.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1564.003
  mbc: B0009

composite_rules:
  - id: pe-embedded-resource-temp-hidden-dropper
    desc: Unsigned PE embeds an image and can launch a windowless process
    crit: notable
    conf: 0.96
    attack: none
    mbc: none
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/layout/embedded::embedded-pe-image
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-load-lock-chain
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-import
      - id: micro-behaviors/fs/file/open/call::file-create-win
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: micro-behaviors/process/config/window::x64-createprocess-no-window
    unless:
      - id: metadata/installer/product/
      # Official Rufus (Akeo Consulting) carries its UEFI:NTFS image and helper
      # tools as embedded resources and runs them hidden. Its version metadata
      # survives UPX unpacking, where the Authenticode chain does not.
      - id: well-known/app/utility/rufus::rufus-official-context
    # An UPX-unpacked member carries no certificate table of its own. A
    # validly signed container vouches for the image it wraps.
    downgrade:
      scope: parent
      any:
        - id: metadata/signature/verified/
