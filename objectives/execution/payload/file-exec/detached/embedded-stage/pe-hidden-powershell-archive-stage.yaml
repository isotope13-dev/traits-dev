defaults:
  platforms: [windows]
  for: [pe]
  attack: T1059.001,T1140,T1027
  mbc: E1027

composite_rules:
  # A PE that carries a hidden, policy-bypassing PowerShell command and an
  # Expand-Archive cmdlet in the same region. The usual use is unpacking a
  # bundled stage that is then launched from a user-writable path. Legitimate
  # installers can also do this, so the composite is limited to one file and
  # to the hidden-window invocation.
  - id: pe-hidden-powershell-expand-archive-stage
    desc: PE extracts a bundled archive via hidden PowerShell with policy bypass
    crit: hostile
    conf: 0.9
    scope: file
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-hidden
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive
