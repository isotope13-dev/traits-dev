# A ChaCha/Salsa "expand 32-byte k" constant stored XOR-masked exists only to
# defeat crypto-constant scanners; libraries keep it in clear. Beside a temp
# directory lookup, a file write and a CREATE_NO_WINDOW process launch, it is
# the shape of a dropper that decrypts an embedded stage into %TEMP% and runs
# it hidden (TrojanPony libcurl.dll side-load loaders, 2026). The rule does
# not identify the stage it launches.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.013,T1140
  mbc: B0023

composite_rules:
  - id: concealed-cipher-temp-hidden-launch
    desc: Masked stream-cipher constant with temp file write and windowless process launch
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/crypto/symmetric/stream/sigma::xor-concealed-stream-cipher-sigma
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-import
      - id: micro-behaviors/fs/write/file/handle/call/
      - id: micro-behaviors/process/config/window::x64-createprocess-no-window
      - id: micro-behaviors/process/create/exec::child-process-execution
    unless:
      - id: metadata/signature/verified/
      - id: metadata/installer/product/
