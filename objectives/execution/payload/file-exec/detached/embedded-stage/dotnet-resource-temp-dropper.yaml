defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1564.003,T1070.004
  mbc: B0009

composite_rules:
  - id: dotnet-embedded-pe-temp-hidden-dropper
    desc: .NET dropper extracts embedded PE to temp, runs hidden, and cleans up
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/layout/embedded::embedded-pe-image
      - id: micro-behaviors/data/embedded/resource::dotnet-cil-manifest-resource-stream-call
      - id: micro-behaviors/fs/path/temp::dotnet-gettemppath-token
      - id: micro-behaviors/process/create/runtime-symbol::dotnet-processstartinfo-name
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start-call
      - id: micro-behaviors/process/config/window::dotnet-console-window-option-reference
    any:
      - id: micro-behaviors/fs/delete/file/library::dotnet-file-delete-call
      - id: micro-behaviors/fs/delete/directory::dotnet-directory-delete-call
    unless:
      - id: metadata/signature/verified/platform/
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
