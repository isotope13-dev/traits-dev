defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1140,T1059.007,T1027
  mbc: E1027

composite_rules:
  # Local AES-256-CBC decrypt of a bundled blob, file write, and detached
  # launch in one source file. Each leg is a generic Node API; the composite
  # claims only that a shipped blob is decrypted, written to disk, and run
  # without a console. The key and IV need not be hard-coded for the match.
  - id: node-local-aes-exe-detached-stage
    desc: Local AES-256-CBC decrypt, file write and detached launch
    crit: hostile
    conf: 0.95
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/crypto/decrypt/initialize::createDecipheriv
      - id: micro-behaviors/crypto/symmetric/aes/mode::aes-256-cbc
      - id: micro-behaviors/fs/read/file/content/whole::readfilesync-call
      - id: micro-behaviors/fs/write/file/reference::node-write-file-sync-call
      - id: micro-behaviors/process/create/subprocess/launch::node-spawn-or-fork-call
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
