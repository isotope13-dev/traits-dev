defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009
  mbc: B0009

# Portable launchers unpack their own payload and start it the same way, so
# this composite is notable on its own. A known-product identity elsewhere
# (for example well-known/game/cheat/product) supplies the hostile context.
composite_rules:
  - id: dotnet-zip-managed-spawn
    desc: Unsigned .NET launcher starts a program from its embedded ZIP
    crit: notable
    conf: 0.9
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/data/embedded/resource::dotnet-cil-manifest-resource-stream-call
      - id: micro-behaviors/data/archive/extract/zip::dotnet-zip-entry-extract
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start-call
    unless:
      - id: metadata/signature/verified/
