defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1140,T1059.007,T1027
  mbc: E1027

composite_rules:
  # Nearby decoding, transformation, writing and detached-launch clues.
  # Proximity does not prove data flow or a native executable target. The
  # daemonization leg suppresses stdio; it does not require windowsHide.
  # Local sidecars qualify without any network acquisition.
  - id: node-local-xor-exe-detached-stage
    desc: Base64/XOR decode, file write and detached launch
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/decode/base64/call::buffer-from-base64
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::indexed-xor-array-assignment
      - id: micro-behaviors/fs/write/file/reference::node-write-file-sync-call
      - id: micro-behaviors/process/create/subprocess/launch::node-spawn-or-fork-call
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn

  - id: node-base64-file-detached-launch
    desc: Base64 decoding, executable filename, file write and detached launch
    crit: suspicious
    conf: 0.9
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/decode/base64/call::buffer-from-base64
      - id: micro-behaviors/fs/read/file/content/whole::readfilesync-call
      - id: micro-behaviors/fs/path/extension::js-executable-filename-literal
      - id: micro-behaviors/fs/write/file/reference::node-write-file-sync-call
      - id: micro-behaviors/process/create/subprocess/launch::node-spawn-or-fork-call
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
