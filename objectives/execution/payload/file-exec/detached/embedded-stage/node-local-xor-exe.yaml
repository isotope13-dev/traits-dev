defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1105,T1059.007,T1027
  mbc: B0024,E1027

composite_rules:
  # Covers local sidecars as well as downloaded stages: a Base64 blob is
  # decoded, XOR-transformed, written as a file, then launched detached with
  # its output hidden. Requiring all stages keeps ordinary XOR utilities and
  # visible installers out of the objective.
  - id: node-local-xor-exe-detached-stage
    desc: Decodes and launches hidden executable
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/decode/base64/call::buffer-from-base64
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::indexed-xor-array-assignment
      - id: micro-behaviors/fs/write/file/reference::node-write-file-sync-call
      - id: micro-behaviors/process/create/subprocess/launch::node-spawn-or-fork-call
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
