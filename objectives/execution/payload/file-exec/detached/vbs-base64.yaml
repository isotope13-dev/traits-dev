defaults:
  platforms: [windows]

composite_rules:
  - id: vbs-hidden-powershell-base64-stager
    desc: VBScript stages encoded code activation for hidden PowerShell
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1059.005,T1564.003
    for: [vbs]
    # Require actual script-file staging; flags plus an unrelated decoder
    # do not establish a payload handoff. No network acquisition is claimed.
    all:
      - id: micro-behaviors/data/codec::msxml-base64-type-and-value
      - id: micro-behaviors/fs/write/content::create-text-file-method-name
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/data/decode/base64/unspecified::powershell-frombase64string
      - id: micro-behaviors/data/control-flow/dispatch/run::run-zero-style-argument
      - id: micro-behaviors/process/argument/option::powershell-flagged-command-line
    any:
      - id: micro-behaviors/process/interpreter/eval/decoded::base64-powershell-eval-command
      - id: micro-behaviors/os/module/load/memory::encoded-powershell-assembly-load
