defaults:
  platforms: [unix, windows]
  for: [shell]
composite_rules:
  - id: encrypted-font-tail-execution
    desc: Font-concealed executable decoding accompanies download and detached launch
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1140,T1105
    scope: file
    all:
      - id: objectives/execution/staging/reconstruct::encrypted-font-executable-staging
      # A literal URL is the same acquisition technique as a variable URL.
      # Require a parsed downloader call so printed commands cannot supply it.
      - id: micro-behaviors/communications/http/download/cli/curl-wget::shell-download-output-call
    any:
      - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-start-launch
