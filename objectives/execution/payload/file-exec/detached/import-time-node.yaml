defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
  attack: T1059.007
composite_rules:
  - id: obfuscated-deferred-executable-stage
    desc: Deferred obfuscated Node stage downloads, arms, and launches an executable
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007,T1105,T1222.002
    near_bytes: 6000
    all:
      - id: micro-behaviors/data/encode/char-code::long-numeric-array-literal
      - id: micro-behaviors/data/string/conversion::fromcharcode-call
      - id: micro-behaviors/os/module/require::dynamic-import-call-expression
      - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: metadata/file/profile/execution-api::detached-ignored-unref-spawn
    unless:
      - id: micro-behaviors/data/control-flow/module-exec::async-iife-invoke
  - id: obfuscated-import-time-executable-stage
    desc: Import-time obfuscated executable stage
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007,T1105,T1222.002
    near_bytes: 10000
    all:
      - id: micro-behaviors/data/control-flow/module-exec::async-iife-invoke
      - id: micro-behaviors/data/string/conversion::fromcharcode-call
      - id: micro-behaviors/os/module/require::dynamic-import-call-expression
      - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: metadata/file/profile/execution-api::indirect-detached-hidden-spawn
    any:
      - id: micro-behaviors/communications/http/request/evented::node-evented-get-response
      - id: metadata/file/profile/file-write-api::node-write-file-sync
  - id: import-time-decrypted-stage
    desc: Library import launches decrypted dependency stage
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/import/module::local-decrypt-helper-import
      - id: micro-behaviors/fs/path/construct::node-modules-package-data-path-reference
      - id: micro-behaviors/fs/read/file/full::readfilesync-call
      - id: micro-behaviors/crypto/decrypt::cryptojs-block-cipher-decrypt-call
      - id: metadata/file/profile/command-options::detached-true
      - id: micro-behaviors/process/fd/stdio::child-stdio-ignore-option
      - id: micro-behaviors/process/control/wait::node-unref-handle
      - id: micro-behaviors/process/stdio/write::js-stdin-write
  - id: bundled-decrypt-stdin-node-stage
    desc: Bundled library decrypts dependency data into detached Node
    crit: hostile
    conf: 0.99
    unless:
      - id: import-time-detached-node-stage
    all:
      - id: micro-behaviors/fs/path/construct::node-modules-package-data-path-reference
      - id: micro-behaviors/fs/read/file/full::readfilesync-call
      - id: micro-behaviors/crypto/decrypt::cryptojs-block-cipher-decrypt-call
      - id: micro-behaviors/process/create/exec::spawn-node-process
      - id: metadata/file/profile/execution-api::detached-ignored-unref-spawn
      - id: micro-behaviors/process/stdio/write::js-stdin-write
  - id: hidden-native-payload-extraction-and-launch
    desc: Hidden native payload extraction and detached launch
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007
    near_bytes: 2048
    all:
      - id: micro-behaviors/fs/read/file/target::read-adjacent-javascript-file
      - id: micro-behaviors/fs/path/construct::local-script-path
      - id: metadata/import/builtin::import-zlib
      - id: micro-behaviors/data/decompress/gzip::gunzip-call-text
      - id: micro-behaviors/fs/temp/directory::os-tmpdir
      - id: micro-behaviors/os/module/require::child-process-require
      - id: metadata/file/profile/file-write-api::node-write-file-sync
      - id: micro-behaviors/fs/write/file/executable::node-write-file-executable-mode
      - id: metadata/file/profile/execution-api::detached-ignored-unref-spawn
      - id: micro-behaviors/process/control/wait::node-unref-handle
  - id: import-time-detached-node-stage
    desc: Library import-time launches a detached Node stage
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: micro-behaviors/data/control-flow/module-exec::async-iife-invoke
      - id: micro-behaviors/process/create/exec::spawn-node-process
      - id: metadata/file/profile/command-options::detached-true
      - id: micro-behaviors/process/fd/stdio::child-stdio-ignore-option
      - id: micro-behaviors/process/control/wait::node-unref-handle
      - id: micro-behaviors/process/stdio/write::js-stdin-write
    any:
      - id: micro-behaviors/crypto/decrypt::cryptojs-block-cipher-decrypt-call
      - id: micro-behaviors/crypto/decrypt::cryptojs-block-cipher-decrypt-text
      - id: metadata/import/builtin::child-process-import-runtime
      - id: metadata/import/builtin::require-child-process
  - id: import-time-bundled-native-payload-launch
    desc: Library import arms and silently detaches a bundled native payload
    crit: hostile
    conf: 0.99
    attack: T1059.007,T1222.002,T1564.003
    mbc: B0024,F0011
    near_bytes: 8192
    all:
      - id: micro-behaviors/data/control-flow/module-exec::js-async-iife-import-hook
      - id: micro-behaviors/fs/path/construct::node-module-relative-path
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
      - id: micro-behaviors/process/create/spawn::child-process-creation-api
      - id: metadata/file/profile/command-options::detached-true
    any:
      - id: micro-behaviors/process/fd/stdio::child-stdio-ignore-option
      - id: metadata/file/profile/process::node-child-output-discarded
  - id: hash-gated-import-time-native-payload
    desc: Import-time native payload launch is gated by a fixed SHA-256 digest
    crit: hostile
    conf: 0.995
    attack: T1059.007,T1222.002,T1564.003
    mbc: B0024,F0011
    near_bytes: 8192
    all:
      - id: import-time-bundled-native-payload-launch
      - id: micro-behaviors/os/security/auth/digest-comparison::source-fixed-sha256-context
  - id: import-time-ipfs-detached-node-stage
    desc: Library import launches a detached IPFS JavaScript stage
    crit: hostile
    conf: 0.995
    attack: T1105,T1059.007,T1564.003
    near_bytes: 10000
    all:
      - id: micro-behaviors/process/create/eval::spawn-node-eval
      - id: objectives/command-and-control/dropper/delivery/blockchain::ipfs-detached-javascript-stage
    any:
      - id: micro-behaviors/data/control-flow/module-exec::js-synchronous-iife-invoke
      - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
  - id: import-time-obfuscated-ipfs-detached-node-stage
    desc: Library import launches an obfuscated detached IPFS JavaScript stage
    crit: hostile
    conf: 0.995
    attack: T1105,T1059.007,T1027,T1564.003
    near_bytes: 10000
    all:
      - id: micro-behaviors/communications/http/services/ipfs::public-ipfs-gateway-literal
      - id: micro-behaviors/process/create/eval::spawn-node-eval
      - id: metadata/file/profile/co-occurrence/network-process::obfuscated-exe-download-hidden-detached-spawn
    any:
      - id: micro-behaviors/data/control-flow/module-exec::js-synchronous-iife-invoke
      - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
  - id: import-time-appdata-exe-poll-detached-spawn
    desc: Module load polls AppData exe then spawns hidden
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.007,T1036
    near_bytes: 2048
    all:
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
      - id: micro-behaviors/fs/watch::node-recursive-file-existence-poll
      - id: metadata/file/profile/execution-api::detached-ignored-unref-spawn
  - id: import-time-remote-executable-stage
    desc: Library import downloads and detaches an executable stage
    crit: hostile
    conf: 0.995
    attack: T1105,T1059.007,T1222.002
    near_bytes: 10000
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/fs/write/file/full/unspecified::node-write-file-promise
      - id: micro-behaviors/fs/write/file/executable::node-write-file-executable-mode
      - id: metadata/file/profile/execution-api::detached-ignored-unref-spawn
      - id: micro-behaviors/data/control-flow/module-exec::module-leading-promise-chain-call
  - id: import-time-buffered-native-stage
    desc: Library import stages and detaches a fetched executable
    crit: hostile
    conf: 0.995
    attack: T1105,T1059.007,T1222.002
    near_bytes: 10000
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-leading-promise-chain-call
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: metadata/file/profile/file-write-api::node-write-file-sync
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
      - id: metadata/file/profile/execution-api::detached-ignored-unref-spawn
    unless:
      - id: micro-behaviors/communications/url/external/github::foreground-github-release-launch
  - id: import-time-streamed-hidden-executable-stage
    desc: Library import streams a remote payload to a hidden executable stage
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.007,T1222.002
    near_bytes: 6000
    all:
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file-text
      - id: micro-behaviors/fs/path/hidden::hidden-tmp-dotfile-path
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: metadata/file/profile/execution-api::detached-ignored-unref-spawn
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: npm-import-concealed-sidecar-native-stage
    desc: npm entry import conceals a native payload sidecar
    crit: hostile
    conf: 0.995
    attack: T1105,T1059.007,T1222.002
    scope: archive
    for:
      - npm
      - tar
      - javascript
    all:
      - id: micro-behaviors/os/module/require::cjs-caught-local-require
      - id: import-time-buffered-native-stage
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: npm-split-host-import-time-loader
    desc: npm native stage reconstructs an obfuscated CDN host
    crit: suspicious
    conf: 0.99
    attack: T1105,T1027,T1583.006
    scope: archive
    for:
      - npm
      - tar
      - javascript
    all:
      - id: micro-behaviors/data/string/concat::js-inline-string-array-join
      - id: micro-behaviors/os/module/require::cjs-caught-local-require
      - id: import-time-buffered-native-stage
    unless:
      - id: metadata/path/directory::test-directory-component
