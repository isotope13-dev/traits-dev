# A dependency-free, repository-less npm package whose install hook runs a
# local script that silently spawns process.execPath against a sibling
# package-relative file in detached, stdio-ignored, unref'd mode.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript, typescript]
  attack: T1195.002,T1059.007

composite_rules:
  - id: npm-hollow-install-detached-worker
    desc: Dependency-free npm package install hook detaches local worker
    crit: suspicious
    conf: 0.94
    scope: package
    all:
      - id: metadata/package/dependencies/presence::npm-install-hook-without-dependencies
      - id: micro-behaviors/os/package-manager/hook-install::lifecycle-hook-runs-node-script
      - id: micro-behaviors/process/interpreter/node::execpath-package-relative-spawn
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
    unless:
      - id: micro-behaviors/os/package-manager/hook-install::install-project-scaffold-context
