defaults:
  platforms: [windows]
  conf: 0.98
  attack: T1204.002,T1036

traits:
  - id: npm-screensaver-postinstall
    desc: Postinstall invokes development script
    crit: notable
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '^npm[[:space:]]+run[[:space:]]+dev([[:space:]]|$)'
  - id: npm-screensaver-dev-script
    desc: Development script starts bundled screensaver
    crit: notable
    for: [package.json]
    if:
      type: value
      path: scripts.dev
      regex: '^start[[:space:]]+lib[/\\]mutations[.]scr([[:space:]]|$)'
  - id: npm-screensaver-bundled-pe
    desc: Bundles executable screensaver in lib
    crit: notable
    for: [pe]
    if:
      type: path
      regex: 'lib[/\\]mutations[.]scr$'

composite_rules:
  - id: npm-postinstall-runs-screensaver-pe
    desc: Install runs bundled Windows screensaver
    crit: hostile
    scope: archive
    for: [zip, npm, package.json, pe]
    all:
      - id: npm-screensaver-postinstall
      - id: npm-screensaver-dev-script
      - id: npm-screensaver-bundled-pe
