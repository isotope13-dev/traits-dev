defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027,T1059.007
composite_rules:
  # Stage-1 launchers that hide their sink and options behind identifier
  # aliasing (spawn(_0x....execPath, ...) with decoder-built option values)
  # defeat literal-anchored composites such as node-dropper and
  # import-time-detached-node-stage. The aliasing-resistant residue is the
  # combination below: machine-obfuscated source (whitespace-padded XOR /
  # char-code tables) that configures a hidden (windowsHide) detached child
  # and releases it with unref(). The spawned program and stdio values stay
  # computed, so this rule does not claim which image runs or where its
  # output goes.
  - id: obfuscated-hidden-detached-child-launch
    desc: Obfuscated script launches a hidden detached child
    crit: suspicious
    conf: 0.9
    all:
      - id: objectives/anti-static/obfuscation/instruction/insertion-junk::whitespace-padded-obfuscator-payload
      - id: micro-behaviors/process/create/hidden::detached-hidden-spawn
      - id: micro-behaviors/process/create/variable::spawn-variable-program
      - id: micro-behaviors/process/control/wait::node-unref-handle
    unless:
      - id: metadata/path/directory::test-directory-component
