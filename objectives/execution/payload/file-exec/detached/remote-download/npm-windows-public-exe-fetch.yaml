defaults:
  for: [javascript]
  platforms: [windows]
  attack: T1105,T1204.002

traits:
  - id: npm-public-exe-postinstall
    desc: Postinstall runs local script
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '^node[[:space:]]+(\./)?scripts/postinstall[.]js([[:space:]]|$)'
  - id: node-public-exe-win-gate
    desc: Compares OS platform to Windows
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "os.platform() === 'win32'"
  - id: node-public-exe-http-fetch
    desc: Requests Windows executable over HTTP
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: "http[.]get\\('http://[0-9.]+/windows[.]exe', \\(res\\) =>"
  - id: node-public-exe-finish
    desc: Registers a stream finish handler
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "file.on('finish', () =>"
composite_rules:
  - id: node-windows-public-exe-download
    desc: Downloads and starts public executable
    crit: suspicious
    conf: 0.98
    scope: file
    all:
      - id: metadata/package/files/included::scripts-postinstall-js-path
      - id: node-public-exe-win-gate
      - id: node-public-exe-http-fetch
      - id: micro-behaviors/fs/write/file/target::users-public-path
      - id: micro-behaviors/communications/http/response::node-response-pipe
      - id: node-public-exe-finish
      - id: micro-behaviors/process/create/subprocess/launch::node-spawn-or-fork-call
      - id: micro-behaviors/process/control/wait::node-unref-handle
  - id: npm-install-windows-public-exe-download
    desc: Install downloads and starts Windows executable
    crit: hostile
    conf: 0.98
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: node-windows-public-exe-download
      - id: npm-public-exe-postinstall
