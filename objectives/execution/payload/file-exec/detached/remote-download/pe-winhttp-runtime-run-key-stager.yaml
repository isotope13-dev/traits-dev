# Windows PE that fetches a runtime archive over WinHTTP, extracts it with a
# standalone 7-Zip, registers a Run-key autostart, and starts the staged agent
# with pythonw. The download and extraction establish the payload chain; the
# Run key and pythonw launch are its activation legs. A validly signed PE
# vouches for its own installer payload and is not graded here.
defaults:
  for: [pe]
  platforms: [windows]
  attack: T1105,T1547.001
  mbc: E1105

traits:
  - id: pe-pythonw-interpreter-text
    desc: References the pythonw.exe interpreter
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)pythonw\.exe'
  - id: pe-standalone-7zr-extractor-text
    desc: Names the standalone 7zr.exe extractor
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '7zr.exe'

composite_rules:
  - id: pe-winhttp-runtime-run-key-pythonw-stager
    desc: PE fetches runtime archive, autostarts it via pythonw
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-read-data
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run
      - id: pe-pythonw-interpreter-text
      - id: pe-standalone-7zr-extractor-text
    unless:
      - id: metadata/signature/verified/
