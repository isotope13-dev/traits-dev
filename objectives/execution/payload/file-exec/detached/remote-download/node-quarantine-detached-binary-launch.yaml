defaults:
  for: [javascript, typescript]
  platforms: [unix]
  attack: T1105,T1204.002

composite_rules:
  # Generic loader shape with no configured URL or script filename: a Node
  # download fetches bytes, the file is written and renamed into place,
  # macOS quarantine is cleared, and a detached child starts. The composite
  # cannot tie the spawned program to the downloaded file, so the near misses
  # (spawn of another binary, or a write of other bytes) stay notable.
  - id: node-quarantine-detached-binary-launch
    desc: Downloads binary, clears quarantine, starts detached
    crit: notable
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/fs/attributes/xattr::node-xattr-clear-argv
      - id: micro-behaviors/process/daemonize/spawn::node-detached-child-process
      - id: micro-behaviors/fs/file/rename::node-temp-write-then-rename
    any:
      - id: micro-behaviors/communications/http/download/handler::javascript-fetch-helper-call
      - id: micro-behaviors/communications/http/download/handler::javascript-download-helper-call
      - id: micro-behaviors/communications/http/download/write::node-downloadfile-await
