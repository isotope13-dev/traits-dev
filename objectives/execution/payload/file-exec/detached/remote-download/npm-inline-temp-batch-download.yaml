# An npm lifecycle command that streams an HTTPS response into a script file
# in the temp directory and then executes a script from that directory. The
# written and executed file names are deliberately not correlated: a hook that
# downloads to one temp script and runs another is the same install-time
# dropper, and varying names, hiding or cleanup must not defeat the match.
defaults:
  for: [package.json]
  platforms: [windows]
  attack: T1105,T1059.003

traits:
  - id: npm-inline-https-response-pipe-to-file
    desc: Pipes HTTPS response into a file
    crit: notable
    conf: 0.95
    if:
      type: value
      path: npm.lifecycle_scripts[*].command
      regex: 'https?[.]get\(.{0,300}[.]pipe\(\s*fs[.]createWriteStream\('
  - id: npm-inline-temp-script-name
    desc: Temp directory path names a script file
    crit: notable
    conf: 0.95
    if:
      type: value
      path: npm.lifecycle_scripts[*].command
      regex: '(TEMP|TMP|tmpdir\(\)),\s*.[^"'']{1,80}[.](bat|cmd|exe|ps1|vbs)'
  - id: npm-inline-exec-joined-path
    desc: Executes a joined file path
    crit: notable
    conf: 0.95
    if:
      type: value
      path: npm.lifecycle_scripts[*].command
      regex: '[.](exec|execSync|execFile|spawn|spawnSync)\(\s*path[.]join\('

composite_rules:
  - id: npm-inline-temp-script-download-exec
    desc: Install downloads and executes temp script
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: metadata/package/scripts/command::npm-lifecycle-node-inline-reference
      - id: npm-inline-https-response-pipe-to-file
      - id: npm-inline-temp-script-name
      - id: npm-inline-exec-joined-path
