# Hidden temporary downloads alongside executable detached launches.
# Proximity establishes co-occurrence, not a shared destination variable.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105,T1059,T1564.001
  mbc: B0030

composite_rules:
  - id: node-curl-hidden-temp-exec
    desc: Node hidden temporary download near executable detached launch
    crit: hostile
    conf: 0.96
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::curl-wget-argv
      - id: micro-behaviors/fs/path/hidden::node-tmpdir-hidden-entry
      - id: micro-behaviors/process/create/variable::spawn-variable-program
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-text
      - id: micro-behaviors/fs/chmod/modify::node-chmod-owner-only-700
    unless:
      - id: metadata/path/directory::test-directory-component
