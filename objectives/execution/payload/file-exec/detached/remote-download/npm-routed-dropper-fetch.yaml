defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1105,T1204.002

traits:
  - id: node-routed-dropper-base
    desc: Defines private-network dropper base
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: "const BASE = 'http://10[.][0-9.]+:[0-9]+'"
  - id: node-routed-dropper-win-route
    desc: Builds Windows dropper URL
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'const url = `${BASE}/droppers/windows.exe`'
  - id: node-routed-dropper-fetch-function
    desc: Defines file download helper
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'function fetchToFile(url, destPath, cb)'
  - id: node-routed-dropper-output
    desc: Opens download destination
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'fs.createWriteStream(destPath, { mode: 0o600 })'
  - id: node-routed-dropper-completion
    desc: Calls callback after file closes
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "file.on('finish', () => file.close(() => cb(null)))"
  - id: node-routed-dropper-win-fetch
    desc: Downloads Windows executable
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'fetchToFile(url, winPath, (err) =>'
  - id: node-routed-dropper-win-spawn
    desc: Starts downloaded executable
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'spawn(winPath, [], {'
composite_rules:
  - id: node-routed-windows-dropper
    desc: Fetches and starts routed Windows dropper
    crit: suspicious
    conf: 0.98
    scope: file
    all:
      - id: metadata/package/files/included::scripts-postinstall-js-path
      - id: node-routed-dropper-base
      - id: micro-behaviors/fs/path/binary::users-public-executable-path
      - id: node-routed-dropper-win-route
      - id: node-routed-dropper-fetch-function
      - id: node-routed-dropper-output
      - id: micro-behaviors/communications/http/response::node-response-pipe
      - id: node-routed-dropper-completion
      - id: node-routed-dropper-win-fetch
      - id: node-routed-dropper-win-spawn
      - id: micro-behaviors/process/control/wait::node-unref-handle
  - id: npm-install-routed-windows-dropper
    desc: Install fetches and starts Windows dropper
    crit: hostile
    conf: 0.98
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: node-routed-windows-dropper
      - id: npm-public-exe-postinstall
