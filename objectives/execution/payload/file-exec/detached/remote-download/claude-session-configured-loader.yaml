defaults:
  platforms: [unix, windows]
  conf: 0.98
  attack: T1105,T1204.002

traits:
  - id: claude-session-loader-hook-path
    desc: Is Claude plugin hooks file
    crit: notable
    for: [json]
    if:
      type: path
      regex: 'hooks[/\\]hooks[.]json$'
  - id: claude-session-loader-hook
    desc: Session start runs plugin loader
    crit: notable
    for: [json]
    if:
      type: text
      regex: 'SessionStart[\s\S]{0,180}CLAUDE_PLUGIN_ROOT'
  - id: claude-session-loader-hook-script
    desc: Hook names installer script
    crit: notable
    for: [json]
    if:
      type: text
      substr: '/scripts/install-and-run.mjs'
  - id: claude-session-loader-config-path
    desc: Is loader download configuration
    crit: notable
    for: [json]
    if:
      type: path
      regex: 'config[/\\]download[.]json$'
  - id: claude-session-loader-config-url
    desc: Configures remote binary URL
    crit: notable
    for: [json]
    if:
      type: value
      path: downloadUrl
      regex: '^http://[0-9.]+:[0-9]+/'
  - id: claude-session-loader-script-path
    desc: Is plugin installer script
    crit: notable
    for: [javascript]
    if:
      type: path
      regex: 'scripts[/\\]install-and-run[.]mjs$'
  - id: claude-session-loader-config-read
    desc: Reads configured download URL
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: 'url = d.downloadUrl || ""'
  - id: claude-session-loader-local-check
    desc: Skips hosts containing local marker
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: 'h.toLowerCase().includes(".local")'
  - id: claude-session-loader-download
    desc: Downloads configured binary
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: 'const data = await fetchBinary(url)'
  - id: claude-session-loader-write
    desc: Writes downloaded binary to temp file
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: 'await writeFile(tmp, data, { mode: 0o600 })'
  - id: claude-session-loader-rename
    desc: Moves download to execution path
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: 'await rename(tmp, bin)'
  - id: claude-session-loader-quarantine
    desc: Clears macOS quarantine attributes
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: 'execFileSync("xattr", ["-c", pathname]'
  - id: claude-session-loader-start
    desc: Spawn call text uses binary and arguments
    # A bare spawn form is common in Node tooling; only the composite's
    # download, write, and rename legs make the launch hostile.
    crit: component
    attack: none
    for: [javascript]
    if:
      type: text
      substr: 'spawn(bin, args, {'
composite_rules:
  - id: claude-session-loader-code
    desc: Loads and starts configured temp binary
    crit: suspicious
    scope: file
    for: [javascript]
    all:
      - id: claude-session-loader-script-path
      - id: claude-session-loader-config-read
      - id: claude-session-loader-local-check
      - id: claude-session-loader-download
      - id: claude-session-loader-write
      - id: claude-session-loader-rename
      - id: claude-session-loader-quarantine
      - id: claude-session-loader-start
      - id: micro-behaviors/process/control/wait::node-unref-handle
  - id: claude-session-configured-binary-loader
    desc: Session hook downloads and starts binary
    crit: hostile
    scope: archive
    for: [zip, npm, javascript, json]
    all:
      - id: claude-session-loader-code
      - id: claude-session-loader-hook-path
      - id: claude-session-loader-hook
      - id: claude-session-loader-hook-script
      - id: claude-session-loader-config-path
      - id: claude-session-loader-config-url
