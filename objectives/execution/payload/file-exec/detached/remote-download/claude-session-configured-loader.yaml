defaults:
  platforms: [unix, windows]
  conf: 0.98
  attack: T1105,T1204.002

traits:
  - id: claude-session-loader-hook-path
    desc: Is Claude plugin hooks file
    crit: notable
    for: [json]
    if:
      type: path
      regex: 'hooks[/\\]hooks[.]json$'
  - id: claude-session-loader-hook
    desc: Session start runs plugin script
    crit: notable
    for: [json]
    if:
      type: text
      regex: 'SessionStart[\s\S]{0,180}CLAUDE_PLUGIN_ROOT[}]?[/\\]scripts[/\\]'
  - id: claude-session-loader-hook-script
    desc: Hook names installer script
    crit: notable
    for: [json]
    if:
      type: text
      regex: 'CLAUDE_PLUGIN_ROOT[}]?[/\\]scripts[/\\][A-Za-z0-9_.-]{1,40}[.]m?js'
  - id: claude-session-loader-config-url
    desc: Configures remote binary URL
    crit: notable
    for: [json]
    if:
      type: value
      path: downloadUrl
      regex: '^http://[0-9.]+:[0-9]+/'
  - id: claude-session-loader-config-read
    desc: Reads configured download URL
    crit: notable
    for: [javascript]
    if:
      type: text
      regex: '\w{1,20}\s*=\s*\w{1,20}[.]download\w{0,10}\s*\|\|'
  - id: claude-session-loader-local-check
    desc: Skips hosts containing local marker
    crit: notable
    for: [javascript]
    if:
      type: text
      regex: '[.]toLowerCase\(\)[.]includes\([''"][.]local[''"]\)'
  - id: claude-session-loader-quarantine
    desc: Clears macOS quarantine attributes
    crit: notable
    for: [javascript]
    if:
      type: text
      regex: 'execFileSync\([''"]xattr[''"],\s*\[[''"]-c[''"]'
  - id: claude-session-loader-staged-start
    desc: Spawns renamed downloaded file
    # Linking the same variables defeats name-agnostic matches on unrelated
    # download helpers and spawns of some other program.
    crit: component
    attack: none
    for: [javascript]
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (lexical_declaration (variable_declarator
            name: (identifier) @data
            value: (await_expression (call_expression
              function: [(identifier) (member_expression property: (property_identifier))] @fetch
              arguments: (arguments (identifier))))))
          (expression_statement (await_expression (call_expression
            function: [(identifier) (member_expression property: (property_identifier))] @write
            arguments: (arguments . (identifier) @tmp (identifier) @data_use (object (pair key: (property_identifier) @mode))))))
          (expression_statement (await_expression (call_expression
            function: [(identifier) (member_expression property: (property_identifier))] @rename
            arguments: (arguments . (identifier) @tmp_use (identifier) @bin .))))
          [
            (lexical_declaration (variable_declarator value: (call_expression
              function: (identifier) @spawn
              arguments: (arguments . (identifier) @bin_use (identifier) (object)))))
            (expression_statement (call_expression
              function: (identifier) @spawn
              arguments: (arguments . (identifier) @bin_use (identifier) (object))))
          ]) @evidence
          (#match? @fetch "(fetch|[Dd]ownload)")
          (#match? @write "(^|[.])writeFile(Sync)?$") (#eq? @mode "mode")
          (#match? @rename "(^|[.])rename(Sync)?$")
          (#eq? @spawn "spawn")
          (#eq? @data @data_use) (#eq? @tmp @tmp_use) (#eq? @bin @bin_use))
composite_rules:
  - id: claude-session-loader-code
    desc: Loads and starts configured temp binary
    crit: suspicious
    scope: file
    for: [javascript]
    all:
      - id: claude-session-loader-config-read
      - id: claude-session-loader-local-check
      - id: claude-session-loader-quarantine
      - id: claude-session-loader-staged-start
      - id: micro-behaviors/process/control/wait::node-unref-handle
  - id: claude-session-configured-binary-loader
    desc: Session hook downloads and starts binary
    crit: hostile
    scope: archive
    for: [zip, npm, javascript, json]
    all:
      - id: claude-plugin-configured-binary-loader
      - id: claude-session-loader-hook-path
      - id: claude-session-loader-hook
      - id: claude-session-loader-hook-script
  # The SessionStart hook only chooses when the loader runs; the loader
  # itself already fetches a binary named by a bundled http://IP:port config,
  # clears macOS quarantine, and starts it detached with no integrity check.
  # A plugin script ready to run that way is a loader without the hook.
  - id: claude-plugin-configured-binary-loader
    desc: Plugin script starts binary from configured IP URL
    crit: hostile
    conf: 0.93
    scope: archive
    for: [zip, npm, javascript, json]
    all:
      - id: claude-session-loader-code
      - id: claude-session-loader-config-url
