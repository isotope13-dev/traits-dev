defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-http-stream-hidden-executable
    desc: HTTP executable streamed and launched hidden
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.007,T1564.003
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((program
          (lexical_declaration "const" (variable_declarator
            name: (identifier) @http_binding
            value: (call_expression function: (identifier) @http_require
              arguments: (arguments . (string (string_fragment) @http_module) .))))
          (lexical_declaration "const" (variable_declarator
            name: (identifier) @fs_binding
            value: (call_expression function: (identifier) @fs_require
              arguments: (arguments . (string (string_fragment) @fs_module) .))))
          (lexical_declaration "const" (variable_declarator
            name: (object_pattern (shorthand_property_identifier_pattern) @spawn_binding)
            value: (call_expression function: (identifier) @child_require
              arguments: (arguments . (string (string_fragment) @child_module) .))))
          (lexical_declaration "const" (variable_declarator
            name: (identifier) @url_binding value: (string (string_fragment) @url)))
          (lexical_declaration "const" (variable_declarator
            name: (identifier) @path_binding
            value: (call_expression function: (member_expression
              property: (property_identifier) @join)
              arguments: (arguments (string (string_fragment) @filename)))))
          (expression_statement (call_expression
            function: (member_expression object: (identifier) @http
              property: (property_identifier) @get)
            arguments: (arguments . (identifier) @url_use
              (arrow_function parameter: (identifier) @response
                body: (call_expression
                  function: (member_expression
                    object: (call_expression
                      function: (member_expression object: (identifier) @response_use
                        property: (property_identifier) @pipe)
                      arguments: (arguments (call_expression
                        function: (member_expression object: (identifier) @fs
                          property: (property_identifier) @write_stream)
                        arguments: (arguments . (identifier) @path_write .))))
                    property: (property_identifier) @on)
                  arguments: (arguments . (string (string_fragment) @finish)
                    (arrow_function body: (statement_block
                      (expression_statement (call_expression
                        function: (member_expression object: (call_expression
                          function: (identifier) @spawn
                          arguments: (arguments . (identifier) @path_exec . (array)
                            (object
                              (pair key: (property_identifier) @detached value: (true))
                              (pair key: (property_identifier) @stdio value: (string (string_fragment) @ignore))
                              (pair key: (property_identifier) @hidden value: (true)))))
                          property: (property_identifier) @unref))))))))))))
          (#eq? @http_require "require") (#match? @http_module "^(node:)?https?$")
          (#eq? @fs_require "require") (#match? @fs_module "^(node:)?fs$")
          (#eq? @child_require "require") (#match? @child_module "^(node:)?child_process$")
          (#eq? @spawn_binding "spawn") (#eq? @spawn_binding @spawn)
          (#eq? @http_binding @http) (#eq? @get "get")
          (#eq? @url_binding @url_use) (#match? @url "(?i)^https?://[^/]+/.+\\.exe([?#].*)?$")
          (#eq? @join "join") (#match? @filename "(?i)\\.exe$")
          (#eq? @response @response_use) (#eq? @pipe "pipe")
          (#eq? @fs_binding @fs) (#eq? @write_stream "createWriteStream")
          (#eq? @path_binding @path_write) (#eq? @path_binding @path_exec)
          (#eq? @on "on") (#eq? @finish "finish")
          (#eq? @detached "detached") (#eq? @stdio "stdio") (#eq? @ignore "ignore")
          (#eq? @hidden "windowsHide") (#eq? @unref "unref"))
