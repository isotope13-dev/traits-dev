defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1105,T1204.002

traits:
  - id: npm-moralis-esm-main
    desc: Declares bundled ESM entry
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: main
      regex: '^(\./)?lib/esm/index[.]js$'
  - id: node-moralis-esm-entry
    desc: Is ESM library entry
    crit: notable
    conf: 0.98
    if:
      type: path
      regex: 'lib[/\\]esm[/\\]index[.]js$'
  - id: node-moralis-installer-class
    desc: Declares installer in library entry
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'class Installer {'
  - id: node-moralis-installer-base
    desc: Selects Bitbucket download base
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: "#BASE_URL = 'https://bitbucket[.]org/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+/downloads'"
  - id: node-moralis-platform-paths
    desc: Builds platform-specific payload paths
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: '`${this.#BASE_URL}/windows.exe`'
  - id: node-moralis-tempdir
    desc: Creates temporary installer directory
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "fs.mkdtempSync(path.join(os.tmpdir(), 'sys-'))"
  - id: node-moralis-download
    desc: Downloads platform payload to temp file
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'await this.#download(m, url, tmpFile)'
  - id: node-moralis-check-binary
    desc: Checks downloaded binary header
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'this.#validateBinary(fs, tmpFile, platform)'
  - id: node-moralis-execute-binary
    desc: Executes downloaded binary
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'execFileSync(tmpFile, args, { stdio: '
  - id: node-moralis-cleanup
    desc: Removes temporary installer directory
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'this.#cleanup(fs, tmpDir)'
  - id: node-moralis-starts-installer
    desc: Library start triggers installer
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'new Installer().install()'
  - id: node-moralis-start-core
    desc: Starts expected library core
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'return core.start(config)'

composite_rules:
  - id: node-moralis-start-download-exec
    desc: Library start downloads and runs binary
    crit: suspicious
    conf: 0.98
    scope: file
    all:
      - id: node-moralis-esm-entry
      - id: node-moralis-installer-class
      - id: node-moralis-installer-base
      - id: node-moralis-platform-paths
      - id: node-moralis-tempdir
      - id: node-moralis-download
      - id: node-moralis-check-binary
      - id: node-moralis-execute-binary
      - id: node-moralis-cleanup
      - id: node-moralis-starts-installer
      - id: node-moralis-start-core
  - id: npm-moralis-start-download-exec
    desc: Package start downloads and runs binary
    crit: hostile
    conf: 0.98
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: node-moralis-start-download-exec
      - id: npm-moralis-esm-main
