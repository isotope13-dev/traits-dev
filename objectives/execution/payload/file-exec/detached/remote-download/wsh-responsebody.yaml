defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1059.007,T1105
composite_rules:
  - id: js-wsh-responsebody-hidden-dropper
    desc: HTTP response staged for rundll32 execution
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/client/response-body::wsh-response-body
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file
      - id: micro-behaviors/data/control-flow/dispatch/run::wsh-run-style-argument-clues
      - id: micro-behaviors/os/com/instantiation::wscript-shell-activex-constructor
      - id: micro-behaviors/fs/write/stream::js-responsebody-variable-write
      - id: micro-behaviors/process/deploy/file-exec/spawn::js-adodb-saved-path-hidden-rundll32
  # Same staging chain launched through Shell.Application.ShellExecute with a
  # hidden show-command (0). The ProgIDs may be string-encoded, so the legs
  # use the method and argument shapes that remain visible in the script.
  - id: js-responsebody-shellexecute-hidden-dropper
    desc: HTTP response saved to disk then ShellExecute-launched hidden
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-open
      - id: micro-behaviors/fs/write/stream::stream-write-response-body
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file
      - id: micro-behaviors/os/handler/open::shellexecute-method-reference
      - id: micro-behaviors/process/argument/visibility::shellexecute-hidden-showcmd
