defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1105,T1204.002

traits:
  - id: node-hex-sync-decoder
    desc: Decodes hex input to text
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "Buffer.from(hex, 'hex').toString()"
  - id: node-hex-sync-close-on-finish
    desc: Closes completed download before starting
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "f.on('finish', () => f.close(() =>"
  - id: node-hex-sync-method
    desc: Declares archive sync method
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'async syncArchive(archiveFilePath)'
  - id: node-hex-sync-temp-exe
    desc: Builds decoded executable temp path
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: "path[.]join\\(os[.]tmpdir\\(\\), this[.]_hexDecode\\('[0-9a-fA-F]+2e657865'\\)\\)"
  - id: node-hex-sync-https-get
    desc: Fetches decoded HTTPS URL
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: "require\\('https'\\)[.]get\\(this[.]_hexDecode\\('68747470733a2f2f[0-9a-fA-F]+'\\), r =>"
  - id: node-hex-sync-stream-target
    desc: Opens temporary download path
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "const f = require('fs').createWriteStream(d)"
  - id: node-hex-sync-pipe
    desc: Pipes response into download file
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'r.pipe(f)'

composite_rules:
  - id: node-hex-sync-download-detached-exe
    desc: Downloads encoded executable and spawns detached process
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 7000
    all:
      - id: node-hex-sync-decoder
      - id: node-hex-sync-close-on-finish
      - id: node-hex-sync-method
      - id: node-hex-sync-temp-exe
      - id: node-hex-sync-https-get
      - id: node-hex-sync-stream-target
      - id: node-hex-sync-pipe
      - id: micro-behaviors/process/create/subprocess/launch::node-spawn-or-fork-call
      - id: micro-behaviors/process/daemonize/detach::detached-true
      - id: micro-behaviors/process/stdio/configure::child-stdio-ignore-option
      - id: micro-behaviors/process/control/wait::node-unref-handle
