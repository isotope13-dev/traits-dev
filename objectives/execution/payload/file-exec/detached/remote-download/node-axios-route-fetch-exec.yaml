# A server route that downloads whatever URL the caller posts and runs the
# result. The handler binds the URL field out of the request body, streams
# the response into a file, arms it with execute permission, and detaches
# the launch, so anyone who can reach the endpoint turns the host into a
# one-shot dropper. Each capability is ordinary alone; the route binding is
# what makes the chain network-triggered.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105,T1204.002

composite_rules:
  - id: node-route-downloads-caller-url
    desc: Route downloads caller URL and runs file
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/http/server/route::app-router-post-endpoint
      - id: micro-behaviors/communications/http/server/request::javascript-request-body-url-field
      - id: micro-behaviors/communications/http/get::axios-config-stream-response
      - id: micro-behaviors/fs/write/file/stream::create-write-stream
      - id: micro-behaviors/fs/chmod/remote::executable-permission-staging
      - id: micro-behaviors/process/daemonize/detach::detached-true
