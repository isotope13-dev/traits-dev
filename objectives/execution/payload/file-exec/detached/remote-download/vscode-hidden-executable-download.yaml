# A VS Code extension that streams a remote executable to disk and launches
# that path detached with its window hidden is installing an unreviewed payload.
defaults:
  platforms: [windows]
  for: [vsix, javascript, typescript, package.json]

composite_rules:
  - id: vscode-downloads-and-launches-hidden-executable
    desc: VS Code extension launches a hidden downloaded executable
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1105,T1059.007,T1564.003,T1195.002
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: metadata/permission/activation::on-startup-finished
      - id: micro-behaviors/fs/write/file/stream::create-write-stream
      - id: micro-behaviors/communications/http/response/call::node-response-pipe
      - id: micro-behaviors/communications/url/resource-path/file::http-executable-url-reference
      - id: micro-behaviors/process/create/hidden::detached-hidden-spawn
      - id: micro-behaviors/process/create/variable::spawn-variable-program
