defaults:
  for: [javascript]
  platforms: [windows]
  attack: T1105,T1204.002

traits:
  - id: hooks-windows-install
    desc: Runs bundled postinstall hook
    crit: notable
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '^node\s+(\./)?[.]hooks/postinstall[.]js$'
  - id: hooks-windows-path
    desc: Is bundled postinstall hook
    crit: notable
    if:
      type: path
      regex: '[.]hooks[/\\]postinstall[.]js$'
  - id: hooks-windows-url
    desc: Selects fixed executable download
    crit: notable
    if:
      type: text
      regex: 'http://([0-9]{1,3}[.]){3}[0-9]{1,3}/(svchost|UnityGameManager)[.]exe'
  - id: hooks-windows-temp
    desc: Selects temporary executable path
    crit: notable
    if:
      type: text
      regex: "path[.]join\\(process[.]env[.]TEMP, '(svchost|UnityGameManager)[.]exe'\\)"
  - id: hooks-windows-stream
    desc: Streams HTTP response to file
    crit: component
    if:
      type: text
      substr: 'response.pipe(file)'
  - id: hooks-windows-completion
    desc: Executes file after download completes
    crit: notable
    if:
      type: text
      substr: 'file.close(executeFile)'
  - id: hooks-windows-exec
    desc: Executes downloaded file path
    crit: notable
    if:
      type: text
      regex: 'exec\(`"?\$\{filePath\}"?`'
  - id: hooks-windows-start
    desc: Starts executable download
    crit: notable
    if:
      type: text
      substr: 'downloadFile(fileUrl, filePath)'

composite_rules:
  - id: hooks-windows-download-exec
    desc: Hook downloads and runs executable
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: hooks-windows-path
      - id: hooks-windows-url
      - id: hooks-windows-temp
      - id: hooks-windows-stream
      - id: hooks-windows-completion
      - id: hooks-windows-exec
      - id: hooks-windows-start
  - id: npm-hooks-windows-download-exec
    desc: Install downloads and runs executable
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: hooks-windows-install
      - id: hooks-windows-download-exec
