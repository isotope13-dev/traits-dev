defaults:
  for: [python]
  platforms: [windows]
  attack: T1105,T1059.006,T1564.003
  mbc: E1105

composite_rules:
  - id: python-http-download-detached-executable-launch
    desc: Downloads executable from HTTP and launches detached process
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
      - id: micro-behaviors/communications/http/client/exchange::python-http-request-file-write
    any:
      - id: micro-behaviors/process/config/launch::python-create-no-window-getattr
      - id: micro-behaviors/process/config/launch::python-detached-process-use
      - id: micro-behaviors/process/config/launch::create-new-process-group
      - id: micro-behaviors/os/handler/open::os-startfile-call
  - id: python-fetch-temp-script-pythonw-launch
    desc: Writes fetched script to TEMP and runs it with pythonw
    crit: hostile
    conf: 0.95
    near_lines: 10
    all:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/os/env/read/named::temp-environment-variable-read
      - id: micro-behaviors/fs/file/io-mode::write-append-create-mode
      - id: micro-behaviors/os/application/target/development::pythonw-executable-reference
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
