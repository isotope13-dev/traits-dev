# The JavaScript loader launches PowerShell with a source string that decodes
# its negative integer array and invokes the resulting ScriptBlock. The
# encoded command vocabulary includes DownloadFile, msiexec.exe, and the quiet
# /qn /norestart switches, alongside an HTTP URL whose host is encoded as a
# decimal IPv4 value. Together these establish an obfuscated remote installer
# launch pattern; no successful download or installed payload identity is
# asserted. The benign offset-encoded vendor installer control uses an HTTPS
# DNS host and remains outside this rule.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1027,T1059.001,T1105,T1218.007

composite_rules:
  - id: node-offset-powershell-quiet-msi-stager
    desc: Node runs offset-decoded PowerShell MSI stager
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/create/exec::node-powershell-launch
      - id: micro-behaviors/process/interpreter/eval/constructed::powershell-offset-scriptblock-eval
      - id: metadata/lang/encoding::offset1000-downloadfile-token
      - id: metadata/lang/encoding::offset1000-msiexec-token
      - id: metadata/lang/encoding::offset1000-msi-quiet-no-restart-token
      - id: metadata/lang/encoding::offset1000-http-decimal-host-url
