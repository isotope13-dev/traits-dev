defaults:
  platforms: [windows]
  for: [python]
  attack: T1140,T1564.003,T1059.006
  mbc: B0032

composite_rules:
  - id: python-decrypted-payload-detached-launch
    desc: Decrypted payload launched detached from AppData
    crit: suspicious
    conf: 0.98
    near_lines: 30
    all:
      - id: micro-behaviors/crypto/decrypt::python-cipher-decryptor-call
      - id: micro-behaviors/fs/path/construct::python-pathlib-environ-appdata
      - id: micro-behaviors/fs/write/file/full::python-pathlib-write-bytes
      - id: micro-behaviors/process/create/subprocess::popen-ast
    any:
      - id: micro-behaviors/process/create/flags::python-qualified-create-no-window
      - id: micro-behaviors/process/create/flags::python-create-no-window-use
      - id: micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-stdio-assignment
