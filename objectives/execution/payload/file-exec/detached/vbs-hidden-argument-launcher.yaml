# A one-statement VBS covert launcher: WScript.Shell runs the first script
# argument with the window hidden (style 0) and without waiting. Each leg is
# dual-use alone -- a fixed hidden command is ordinary automation, and a
# visible argument launch is ordinary delegation -- but together they are a
# detached execution primitive whose only function is to run another stage's
# payload invisibly: the command is entirely caller-supplied, the console
# never appears, and the launcher does not wait. Observed as GUID-staged
# single-line drops invoked by droppers, LNK shortcuts, and Run-key payloads
# that need the child window suppressed.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1059.005,T1564.003
composite_rules:
  - id: vbs-hidden-first-argument-detached-launch
    desc: Hidden VBS launcher runs first argument detached
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/variable::vbs-inline-shell-first-argument
      - id: micro-behaviors/process/create/hidden::wsh-hidden-async-run
