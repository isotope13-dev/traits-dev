defaults:
  for: [javascript, typescript]
  platforms: [windows]
  attack: T1105,T1204.002

composite_rules:
  # Generic dropper shape with no hosted URL or script filename: a Node
  # download helper fetches an archive, the archive is extracted, and an
  # extracted executable is launched with its window hidden.
  - id: node-archive-exe-hidden-dropper
    desc: Downloads zip, extracts, launches hidden executable
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/data/archive/zip::seven-extractfull-call
      - id: micro-behaviors/fs/path/extension::source-executable-extension-check
      - id: micro-behaviors/process/create/variable::spawn-destination-variable
      - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
    any:
      - id: micro-behaviors/communications/http/download/write::node-downloadfile-await
      - id: micro-behaviors/communications/http/download/handler::javascript-download-helper-call

  - id: node-detached-archive-exe-dropper
    desc: Detached Node relaunch downloads zip, extracts, runs hidden executable
    crit: hostile
    conf: 0.93
    scope: file
    all:
      - id: node-archive-exe-hidden-dropper
      - id: micro-behaviors/process/lifecycle/respawn::node-self-respawn
