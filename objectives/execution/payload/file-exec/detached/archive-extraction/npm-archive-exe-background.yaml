defaults:
  for: [javascript]
  platforms: [windows]
  attack: T1105,T1204.002

traits:
  # Any bundled Node script as the install hook: the script name is the
  # collector's choice, so the dropper evidence lives in the file composite.
  - id: archive-exe-hook
    desc: Install runs a bundled Node script
    crit: notable
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '^node[[:space:]]+(\./)?[A-Za-z0-9_.-]+[.]js[[:space:]]*$'
  - id: archive-exe-url
    desc: Selects hosted zip payload
    crit: notable
    if:
      type: text
      substr: "https://files.catbox.moe/"
  # Self-relaunch through the same script; the env flag name varies per copy.
  - id: archive-exe-background
    desc: Relaunches installer in background
    crit: notable
    if:
      type: text
      regex: 'spawn\(\s*process\.execPath\s*,\s*\[\s*__filename\s*\]'
  - id: archive-exe-config
    desc: Fetches remote loader configuration
    crit: notable
    if:
      type: text
      regex: 'await\s+(fetch|get|load)\w*Config\w*\s*\('
  - id: archive-exe-rotation
    desc: Downloads configured payload
    crit: notable
    if:
      type: text
      regex: 'await\s+download\w*\(\s*[\w.]*[Uu]rls?\s*,'
  - id: archive-exe-exe
    desc: Selects extracted executable
    crit: notable
    if:
      type: text
      regex: '\.endsWith\(\s*\S\.exe\S\s*\)'
  - id: archive-exe-launch
    desc: Starts extracted executable
    crit: notable
    if:
      type: text
      regex: 'spawn\(\s*\w*[Ee]xe\w*\s*,'

composite_rules:
  # Download, extract, and run the extracted executable hidden. Filename and
  # helper names are not required: the behaviors are the evidence.
  - id: archive-exe-background-loader
    desc: Downloads archive and launches extracted executable
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: archive-exe-background
      - id: micro-behaviors/data/archive/zip::seven-extractfull-call
      - id: archive-exe-exe
      - id: archive-exe-launch
      - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
    any:
      - id: archive-exe-fixed-download
      - id: archive-exe-config-download
  - id: archive-exe-fixed-download
    desc: Downloads hosted archive
    crit: notable
    scope: file
    all:
      - id: archive-exe-url
      - id: micro-behaviors/communications/http/download/write::node-downloadfile-await
  - id: archive-exe-config-download
    desc: Downloads archive from remote configuration
    crit: notable
    scope: file
    all:
      - id: archive-exe-config
      - id: archive-exe-rotation
  - id: npm-archive-exe-background-loader
    desc: Install downloads and starts extracted executable
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: archive-exe-hook
      - id: archive-exe-background-loader
