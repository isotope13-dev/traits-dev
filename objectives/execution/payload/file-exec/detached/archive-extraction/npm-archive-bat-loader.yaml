defaults:
  for: [javascript]
  platforms: [windows]
  attack: T1105,T1059.003

traits:
  - id: archive-bat-hook
    desc: Install runs source dependencies script
    crit: notable
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '^node[[:space:]]+(\./)?src/dependencies[.]js[[:space:]]*$'
  - id: archive-bat-batch
    desc: Selects batch file
    crit: notable
    if:
      type: text
      substr: "f.endsWith('.bat')"
  - id: archive-bat-invoke
    desc: Runs extracted batch
    crit: notable
    if:
      type: text
      substr: "await executeBat(extractPath)"
  - id: archive-bat-temp
    desc: Uses temporary archive path
    crit: notable
    if:
      type: text
      substr: "path.join(process.env.TEMP,"

composite_rules:
  - id: archive-bat-loader
    desc: Downloads archive and runs extracted batch file
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: metadata/path/directory::source-dependencies-js-path
      - id: micro-behaviors/communications/http/download/write::node-downloadfile-await
      - id: micro-behaviors/data/archive/zip::seven-extractfull-call
      - id: archive-bat-batch
      - id: micro-behaviors/process/create/shell/interpreter::cmd-exe-spawn
      - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
      - id: archive-bat-invoke
      - id: archive-bat-temp
  - id: npm-archive-bat-loader
    desc: Install downloads and runs extracted batch file
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: archive-bat-hook
      - id: archive-bat-loader
