defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: makeself-hidden-base64-loader
    desc: Hidden temporary base64 payload loader
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/decode/command::base64-decode-to-file
      - id: micro-behaviors/process/create/local-exec::hidden-tmp-background-exec
      - id: micro-behaviors/process/daemonize/detach::nohup-hidden-output
      - id: micro-behaviors/data/decode/base64::base64-decode-command
