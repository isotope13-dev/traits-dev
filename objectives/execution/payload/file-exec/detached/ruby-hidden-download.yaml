defaults:
  for: [ruby]
  platforms: [unix]
composite_rules:
  - id: ruby-hidden-temp-download-launch
    desc: Executes hidden temporary download chain
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/interpreter::ruby-hidden-temp-fetch-chmod-run-chain
    any:
      - id: micro-behaviors/fs/path/temp::hidden-tmp-path
      - id: micro-behaviors/fs/path/temp::var-tmp-hidden
