      - id: micro-behaviors/process/create/exec::node-detached-os-default-handler-spawn
      - id: objectives/persistence/system/package-manager::npm-managed-self-update-context
      - id: micro-behaviors/process/lifecycle/respawn::node-self-respawn
      - id: micro-behaviors/process/lifecycle/respawn::node-detached-script-self-relaunch-context
