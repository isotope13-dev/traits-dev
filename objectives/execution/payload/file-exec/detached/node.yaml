defaults:
  platforms:
    - windows
    - unix
  mbc: B0024
  for:
    - javascript
    - typescript
traits:
  - id: github-raw-batch-url
    desc: GitHub raw batch payload URL
    crit: suspicious
    conf: 0.95
    attack: T1105
    for:
      - javascript
    if:
      type: text
      regex: github\.com/.{1,40}/.{1,60}/raw/refs/heads/.{1,40}/.{1,80}\.(bat|cmd)
  - id: node-update-package-self-reference
    desc: Current package identity in update commands
    crit: notable
    conf: 0.9
    for:
      - javascript
    if:
      type: text
      regex: PKG\.name[\s\S]{0,400}(npm install -g|npx -y|brew upgrade)
composite_rules:
  - id: js-charcode-encoded-program
    desc: Embedded char-code program
    crit: component
    near_bytes: 16384
    all:
      - id: micro-behaviors/data/encode/char-code::long-numeric-array-literal
      - id: micro-behaviors/data/string/conversion::fromcharcode-call-text
  - id: js-encoded-node-self-respawn-loader
    desc: Encoded JS loader respawns Node on a decoded program
    crit: hostile
    conf: 0.96
    attack: T1027, T1059.007
    mbc: B0032, E1027
    near_bytes: 16384
    all:
      - id: micro-behaviors/process/interpreter/node::node-spawn-current-executable
    any:
      - id: js-charcode-encoded-program
      - id: micro-behaviors/data/decode/base64/unspecified::long-base64-blob-decode-pair
    unless:
      - id: micro-behaviors/process/lifecycle/respawn::node-self-respawn
      - id: metadata/path/directory::test-directory-component
  - id: js-encoded-dynamic-require-loader
    desc: JS loader requires modules by decoded name
    crit: hostile
    conf: 0.95
    attack: T1027, T1105, T1059.007
    mbc: B0032, E1027
    near_bytes: 16384
    all:
      - id: objectives/anti-static/obfuscation/payload/encoded/carrier::js-encoded-require
    any:
      - id: micro-behaviors/data/string/conversion::fromcharcode-call-text
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decode-call-text
    unless:
      - id: metadata/path/directory::test-directory-component
  # obfuscator.io string-array rotation plus a native addon conceals what
  # the addon does; commercial extensions (MarsCode) ship exactly this.
  - id: js-obfuscated-native-module-loader
    desc: Obfuscated JavaScript loads a native Node module
    crit: suspicious
    conf: 0.97
    attack: T1027,T1059.007,T1129
    mbc: B0032,E1027
    all:
      - id: metadata/lang/source/syntax/control-flow::truthy-array-while-text
      - id: metadata/lang/source/syntax/control-flow::parseint-decoder-loop
      - id: metadata/lang/source/literal/string/label::push-string-literal
      - id: metadata/lang/source/syntax/array::bracketed-shift-string
      - id: micro-behaviors/os/module/load/name::cjs-native-node-module-require
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: npm-hook-node-self-respawn-loader
    desc: Install hook self-respawns Node on a decoded program
    crit: hostile
    conf: 0.98
    attack: T1059.007, T1027, T1195.002
    mbc: B0032, F0011
    for:
      - package.json
    all:
      - id: metadata/package/scripts/inline::manifest-node-inline-with-conversion
      - id: micro-behaviors/process/identity/query/process::manifest-node-execpath-respawn
  - id: temp-payload-staging
    desc: Temporary payload staging write
    crit: component
    conf: 0.9
    for:
      - javascript
    near_lines: 80
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/temp/directory::os-tmpdir
    any:
      - id: micro-behaviors/fs/write/file/stream::create-write-stream
      - id: micro-behaviors/fs/write/file/executable::node-write-file-executable-mode
      - id: micro-behaviors/fs/chmod/modify::node-chmod
  - id: node-payload-retrieval-or-staging
    desc: Node retrieval, staging or shell context
    crit: component
    conf: 0.9
    for:
      - javascript
    any:
      - id: temp-payload-staging
      - id: objectives/execution/staging/transfer::fetch-write-exec
      - id: objectives/execution/staging/transfer::fetch-write-spawn-delete-clues
      - id: objectives/execution/staging/transfer::js-ip-write-exec-profile
      - id: github-raw-batch-url
      - id: micro-behaviors/data/encode/embedded::pe-base64-blob
      - id: metadata/file/encoding/compression::gzip-base64-like-literal
  - id: node-dropper
    desc: Node.js dropper spawning payload
    crit: hostile
    conf: 0.95
    attack: T1059.007
    near_lines: 128
    for:
      - javascript
    near_bytes: 8192
    all:
      - id: micro-behaviors/process/interpreter/node::node-spawn-current-executable
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
      - id: node-payload-retrieval-or-staging
    unless:
      - id: node-runtime-installer-helper-context
      - id: micro-behaviors/process/lifecycle/respawn::node-self-respawn
      - id: node-detached-update-check-worker
      - id: well-known/tool/development/toolchain/deno::source-archive-context
  - id: node-detached-update-check-worker
    desc: Node CLI detached update or release handoff
    crit: exception
    conf: 0.9
    for:
      - javascript
    near_bytes: 2048
    all:
      - id: micro-behaviors/process/interpreter/node::node-spawn-current-executable
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
    any:
      - id: micro-behaviors/os/package-manager/upgrade::update-check-worker-command
      - id: micro-behaviors/os/package-manager/upgrade::npm-registry-version-cache-fetch
      - id: node-verified-release-self-update
  - id: node-verified-release-self-update
    desc: Verifies and relaunches an updated release of its own package
    crit: exception
    conf: 0.96
    for:
      - javascript
    near_bytes: 16384
    all:
      - id: micro-behaviors/crypto/hash/digest/sha2::node-sha256-near-strict-inequality
      - id: micro-behaviors/communications/http/download/release::node-release-asset-url-name-fields
      - id: node-update-package-self-reference
      - id: micro-behaviors/process/interpreter/node::node-spawn-current-executable
  - id: node-runtime-installer-helper-context
    desc: Validates and installs a Node runtime package
    crit: exception
    conf: 0.94
    all:
      - id: metadata/lang/source/naming/runtime::node-runtime-package-name-symbol
      - id: metadata/lang/source/naming/action/installation::node-install-downloaded-runtime-symbol
      - id: metadata/lang/source/naming/action/installation::node-validate-runtime-stage-symbol
  - id: node-embedded-native-stage-loader
    desc: Reads an adjacent bundle, extracts executable, and launches detached
    crit: hostile
    conf: 0.98
    attack: T1027, T1059.007, T1195.002
    mbc: B0032, F0011
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/module/require::child-process-require
      - id: micro-behaviors/fs/read/file/target::read-adjacent-javascript-file
      - id: micro-behaviors/fs/path/construct::local-script-path
      - id: metadata/import/builtin::import-zlib
      - id: micro-behaviors/data/decompress/gzip::gunzip-call-text
      - id: micro-behaviors/fs/temp/directory::os-tmpdir
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync
      - id: micro-behaviors/fs/write/file/executable::node-write-file-executable-mode
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
  - id: node-import-time-fetched-executable
    desc: Node import-time writes and detaches fetched executable
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.007,T1222.002,T1564.003
    mbc: B0024,F0011
    for:
      - javascript
    near_lines: 120
    near_bytes: 8192
    all:
      - id: micro-behaviors/data/control-flow/module-exec::js-async-iife-import-hook
      - id: metadata/import/builtin::child-process-api-destructure
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
  - id: detached-node-stdin-remote-loader
    desc: Detached Node executes fetched stdin payload
    crit: hostile
    conf: 0.98
    attack: T1105, T1059.007, T1195.002
    for:
      - javascript
    near_lines: 40
    all:
      - id: micro-behaviors/os/module/require::child-process-require
      - id: micro-behaviors/process/interpreter/node::spawn-node-process
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
      - id: micro-behaviors/communications/http/get::axios-get-call
      - id: micro-behaviors/data/decode/base64/unspecified::atob-decode
      - id: micro-behaviors/process/stdio/write::js-stdin-write
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: remote-fetch-detached-python-stdin-loader
    desc: Detached Python executes fetched stdin payload
    crit: hostile
    conf: 0.98
    attack: T1105, T1059.003, T1195.002
    for:
      - javascript
    near_lines: 50
    all:
      - id: micro-behaviors/os/module/require::child-process-require
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/process/stdio/write::js-stdin-write
      - id: micro-behaviors/process/interpreter/python::node-spawn-python-interpreter
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: node-detached-sibling-stage-spawn
    desc: Node detached sibling spawn with payload staging or retrieval
    crit: hostile
    conf: 0.9
    attack: T1059.007
    for:
      - javascript
    near_lines: 60
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
      - id: micro-behaviors/fs/path/construct::local-script-path
      - id: node-payload-retrieval-or-staging
    any:
      - id: micro-behaviors/os/module/require::child-process-require
      - id: metadata/import/builtin::child-process-api-destructure
    unless:
      - id: micro-behaviors/process/daemonize/detach::node-lazy-daemon-spawn
      - id: micro-behaviors/os/console/control::chcp-65001-command
      - id: metadata/path/directory::test-directory-component
  - id: node-stealth-java-sidecar
    desc: Hidden Node launches Java sidecar
    crit: hostile
    conf: 0.96
    attack: T1059.007
    for:
      - javascript
    near_bytes: 8192
    all:
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
      - id: micro-behaviors/process/argument/interpreter::node-jar-launch-argument
      - id: micro-behaviors/process/interpreter/runtime/jvm::node-java-process-target
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: embedded-pe-stealth-dropper
    desc: Embedded PE dropped and run detached
    crit: hostile
    conf: 0.99
    attack: T1105
    for:
      - javascript
    all:
      - id: micro-behaviors/data/encode/embedded::pe-base64-blob
      - id: micro-behaviors/fs/write/file/full/unspecified::write-file-sync
      - id: micro-behaviors/fs/chmod/modify::node-chmod
      - id: micro-behaviors/fs/temp/directory::os-tmpdir
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
      - id: micro-behaviors/fs/path/extension::exe-name-or-extension
  - id: hidden-native-download-exec
    desc: Compact hidden native download-and-execute chain
    crit: hostile
    conf: 0.96
    attack: T1105
    near_lines: 128
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: micro-behaviors/process/create/exec::js-execfile-call
      - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
    any:
      - id: micro-behaviors/data/string/conversion::js-xor-character-call
      - id: micro-behaviors/data/encoding/base64::node-base64-buffer-clues
    unless:
      - id: metadata/build/bundler/runtime::js-webpack-bundle
      - id: metadata/path/directory::test-directory-component
  - id: github-temp-shell-stager
    desc: GitHub temp shell stager with detached exec
    crit: hostile
    conf: 0.98
    attack: T1195.002
    for:
      - javascript
    all:
      - id: micro-behaviors/os/module/require::child-process-require
      - id: micro-behaviors/process/daemonize/detach::detached-true
      - id: micro-behaviors/process/stdio/configure::child-stdio-ignore-option
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
      - id: micro-behaviors/fs/path/temp::temp-var-tmp
      - id: micro-behaviors/communications/http/download/github::github-raw-mutable-fetch
    any:
      - id: micro-behaviors/communications/http/download/github::github-raw-curl-fetch
      - id: well-known/app/development/code-forge/github::raw-githubusercontent-script-file
  - id: node-detached-remote-javascript-stage
    desc: Detached Node child evaluates fetched JavaScript
    crit: hostile
    conf: 0.99
    attack: T1059.007,T1105,T1195.002
    near_lines: 40
    all:
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
      - id: metadata/lang/source/syntax/call/relationship::node-e-option-near-http-text
      - id: metadata/lang/source/syntax/call/relationship::node-e-option-near-eval-text
  - id: decrypt-to-detached-node-stdin
    desc: Cipher decrypt feeds detached Node via stdin
    crit: hostile
    conf: 0.97
    attack: T1059.007, T1027, T1195.002
    for:
      - javascript
    near_lines: 128
    all:
      - id: micro-behaviors/crypto/decrypt/transform/symmetric::cryptojs-block-cipher-decrypt-text
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
      - id: micro-behaviors/process/stdio/write::js-stdin-write
    any:
      - id: micro-behaviors/process/interpreter/node::spawn-node-process
      - id: micro-behaviors/process/interpreter/node::node-interpreter-target
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: obfuscated-concealed-process-import-spawn
    desc: Obfuscated code hides child_process and spawns
    crit: hostile
    conf: 0.95
    attack: T1027, T1059.007
    mbc: B0032, F0011
    all:
      - id: micro-behaviors/os/module/dynamic-load::node-split-literal-require
      - id: micro-behaviors/data/collection/array::js-bracket-push-shift-call-text
    any:
      - id: micro-behaviors/process/stdio/configure::child-stdio-ignore-option
      - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
      - id: micro-behaviors/process/create/exec::node-spawnsync-call
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: decrypt-write-dynamic-require-stealth-spawn
    desc: Decrypts to disk then dynamically requires spawn for a hidden child
    crit: hostile
    conf: 0.96
    attack: T1195.002,T1027.013,T1059.007,T1106
    mbc: B0024, F0011
    near_bytes: 16384
    all:
      - id: micro-behaviors/crypto/decrypt/initialize::createDecipheriv
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call
      - id: micro-behaviors/os/module/dynamic-load::node-variable-require-call
      - id: micro-behaviors/process/daemonize/detach::detached-true
      - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: js-fetch-drop-hidden-detached-launch
    desc: Runs a downloaded file hidden and detached
    crit: hostile
    conf: 0.95
    attack: T1105,T1059.007,T1564.003
    mbc: B0024, F0011
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/write/file/content::node-write-file-promise-destructured
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
      - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/get::axios-get-call
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
