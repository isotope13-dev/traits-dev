defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1105,T1059.007,T1027,T1564.003
  crit: hostile
composite_rules:
- id: obfuscated-http-xor-inline-stage-loader
  desc: Obfuscated JavaScript decodes an HTTP stage and evaluates it inline
  conf: 0.98
  attack: T1105,T1059.007,T1027
  mbc: B0032
  for:
  - javascript
  - typescript
  all:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::strong-js-obfuscation
  - id: micro-behaviors/communications/http/request
  - id: micro-behaviors/data/arithmetic::indexed-xor-array-assignment
  - id: micro-behaviors/process/interpreter/eval/indirect::js-computed-helper-receives-eval
- id: node-http-xor-eval-detached-stage
  desc: HTTP and XOR accompany shared eval and hidden child source
  conf: 0.97
  near_bytes: 12000
  all:
  - id: micro-behaviors/process/create/eval::awaited-source-eval-and-child-reuse
  - id: micro-behaviors/communications/http/request/client::http-request
  - id: micro-behaviors/data/decode/xor::js-repeating-key-buffer-xor-loop
  - id: micro-behaviors/process/create/spawn::detached-hidden-spawn
  - id: micro-behaviors/process/daemonize/detach::node-spawn-result-unref
- id: node-options-http-xor-eval-detached-stage
  desc: Node HTTP payload is XOR-decoded, evaluated, and launched hidden
  conf: 0.97
  near_bytes: 12000
  all:
  - id: micro-behaviors/process/create/eval::awaited-source-eval-and-child-reuse
  - id: micro-behaviors/communications/http/request/configuration::node-http-options-request-call
  - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
  - id: micro-behaviors/process/daemonize/detach::detached-obfuscated-true
  - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-true
