# Preserve the value-flow route and cover anonymous generators, which the
# current flow producer leaves opaque. Both routes relate cipher output to eval.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027,T1140,T1059.007
composite_rules:
  - id: cipher-derived-source-evaluation
    desc: Cipher-derived source feeds eval execution
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/decrypt::createDecipheriv
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::decryption-derived-eval-argument
      - id: objectives/anti-static/obfuscation/payload/encrypted::literal-key-generator-source-concealment
