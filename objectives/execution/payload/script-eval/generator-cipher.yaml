# Literal-key AES decryption followed by execution in the same generator.
# Bind the cipher receiver and plaintext variable, rather than joining an
# unrelated decryptor and eval elsewhere in the file.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027,T1140,T1059.007
composite_rules:
  - id: literal-key-generator-decrypt-eval
    desc: Literal-key cipher output evaluated by generator
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/decrypt::createDecipheriv
      - id: micro-behaviors/process/interpreter/eval/direct::decryption-derived-eval-argument
