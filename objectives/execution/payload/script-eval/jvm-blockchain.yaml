# The command-building class is required to decode bytes and use that value as
# argv[2], not merely mention /bin/sh beside blockchain strings. The companion
# reader and execution helper must be present in the same archive. This is a
# static chain signature, not proof of a successful RPC or shell invocation.
defaults:
  platforms: [unix, windows]
  for: [class, jar]
  attack: T1102,T1059.004
  mbc: B0022
composite_rules:
  - id: jvm-ethereum-storage-shell-command
    desc: JVM hex shell command with storage RPC reader
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/process/create/shell/selection::jvm-decoded-posix-shell-command
      - id: micro-behaviors/communications/http/url/rpc::eth-get-storage-at-method-field
      - id: micro-behaviors/data/decode/hex::java-radix16-string-parse
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode
