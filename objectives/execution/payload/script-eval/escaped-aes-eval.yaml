# A fragmented command name conceals the AES decoder. Bind its pipeline
# result to the immediately following eval; ordinary encrypted configuration
# reads and unrelated eval calls do not establish this activation chain.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1059.004,T1027,T1140
traits:
  - id: shell-aes-stage-eval-with-fragmented-names
    desc: Fragmented AES decoder feeds variable eval
    crit: suspicious
    conf: 0.96
    # Shell flow facts currently retain expansions as literals. Join the
    # assignment and eval structurally, rather than asserting flow from two
    # unrelated operations anywhere in a file. Adjacency excludes reassignment.
    if:
      type: tree-sitter
      query: |
        ((program
          (variable_assignment name: (variable_name) @stage
            value: (command_substitution
              (pipeline
                (command
                  name: (command_name (concatenation
                    (expansion (variable_name))
                    (expansion (variable_name))))
                  argument: (word) @enc
                  . argument: (word) @decrypt
                  . argument: (word) @cipher))))
          . (command name: (command_name (word) @eval)
            argument: (string (simple_expansion (variable_name) @used)))) @activation
          (#eq? @enc "enc") (#eq? @decrypt "-d")
          (#match? @cipher "^-aes-(128|192|256)-(ctr|cbc)$")
          (#eq? @eval "eval") (#eq? @stage @used))
