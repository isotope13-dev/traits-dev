# Required roles bind an escaped evaluator token to a quoted reversal stage
# and an embedded child-shell/hex-byte reconstruction program. Metrics only
# constrain that content-derived mechanism; no sample names or exact counts.
defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: positional-reversed-shell-source-eval
    desc: Obfuscated eval runs reversed shell source
    crit: hostile
    conf: 0.98
    attack: T1059.004,T1027
    all:
      - id: micro-behaviors/process/interpreter/eval/indirect::positional-escaped-eval-reverse-stage
      - id: micro-behaviors/data/string/reverse::shell-rev-here-string-program
      - id: metadata/lang/encoding/shape::reversed-bash-variable-token
      - id: metadata/lang/encoding/shape::reversed-hex-expansion-templates
      - id: metadata/file/profile/syntax-tree::shell-multiple-dynamic-command-targets
      - id: metadata/file/profile/string-population::shell-large-program-string
