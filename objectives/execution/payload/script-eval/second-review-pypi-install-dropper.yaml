composite_rules:
- platforms:
  - unix
  - windows
  for:
  - python
  attack: T1195.002,T1059.006
  id: pypi-install-dropper
  desc: Setup hook evaluates downloaded Python response bytes
  crit: hostile
  conf: 0.95
  all:
  - id: metadata/build/pip::root-setup-py
  - id: metadata/build/package/recipe/setup-hooks::python-install-hook
  any:
  - id: micro-behaviors/process/deploy/script-eval::python-get-response-text-exec
  - id: objectives/command-and-control/dropper/script-eval/response-eval/remote-body-exec::exec-get-content
  - id: micro-behaviors/process/deploy/script-eval::python-urllib-response-exec
