defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: concealed-function-payload-with-dom-protection
    desc: Concealed payload with source-hiding DOM hooks
    crit: hostile
    conf: 0.98
    attack: T1059.007,T1027,T1564
    all:
      - id: objectives/anti-static/obfuscation/eval/loader::js-hex-xor-atob-filter-constructor-stage
      - id: micro-behaviors/process/hook/interception::browser-source-shadow-accessors
      - id: micro-behaviors/process/hook/interception::browser-dom-remove-child-hook
      - id: micro-behaviors/process/hook/interception::browser-dom-append-child-hook
      - id: micro-behaviors/process/hook/xhr::xhr-wallet-address-exclusion-guard
