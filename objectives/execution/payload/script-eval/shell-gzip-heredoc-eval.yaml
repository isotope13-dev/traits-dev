# A shell stage whose only job is to decode a base64 heredoc, gunzip it into
# a variable and eval it. The real script never exists on disk or in the
# file's readable text, which is how ClickFix-delivered macOS stealer stages
# are shipped: a few lines of loader around one opaque blob.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1059.004,T1140,T1027.010
composite_rules:
  - id: shell-base64-gunzip-heredoc-eval
    desc: Shell decodes a gzip heredoc and evals the result
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/data/decode/base64::base64-decode-command
      - id: micro-behaviors/data/decode/processor::gunzip-tool
      - id: micro-behaviors/data/encode/base64::repeated-base64-literals
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval-variable
    unless:
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component
