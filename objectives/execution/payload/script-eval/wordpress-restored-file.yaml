defaults:
  platforms: [unix, windows]
  for: [php]
composite_rules:
  - id: wordpress-concealed-restored-file-include
    desc: Hidden WordPress plugin evaluates its restored file
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/evasion/file-hiding/plugin::wordpress-plugin-admin-list-removal
      - id: micro-behaviors/process/interpreter/eval/source::php-restore-then-include-same-path
      - id: micro-behaviors/process/hook/event::wordpress-early-plugins-loaded-hook
    any:
      - id: micro-behaviors/mem/create/shared::shm-read
      - id: micro-behaviors/mem/create/shared::sysv-read-variable
      - id: micro-behaviors/data/compression::php-base64-wrapped-decompression
