defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: obfuscated-native-browser-script-cookie-stage
    desc: Obfuscated browser script/cookie staging profile
    crit: hostile
    conf: 0.96
    attack: T1059.007,T1185,T1027
    all:
      - id: micro-behaviors/data/string/reverse::native-subtract-and-four-byte-string-chunks
      - id: micro-behaviors/data/format/html::native-http-script-and-cookie-html-fragments
      - id: micro-behaviors/communications/http/client/wininet::internet-open-url
