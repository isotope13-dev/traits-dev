# The published AdFection browser stager decrypts incoming bytes, compiles
# decoded text as a function expression, and immediately evaluates that wrapper.
# Bound the two operations to a small span. Text matching also covers scripts
# embedded in HTML, where facts has no call graph.
# This observes proximity, not a proven binding between the two local names;
# legitimate encrypted plugin loaders remain possible, hence suspicious.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1027,T1059.007
composite_rules:
  - id: webcrypto-decrypt-near-decoded-function
    desc: WebCrypto decrypt near decoded-text compilation
    crit: suspicious
    conf: 0.94
    near_bytes: 384
    all:
      - id: micro-behaviors/crypto/symmetric/decrypt::webcrypto-decrypt-call-text
      - id: micro-behaviors/process/interpreter/eval/compile::js-function-textdecoder-argument

  # The full pushed-payload chain, not proximity alone: a Base64-transported
  # blob is decrypted with WebCrypto and the plaintext compiled for execution
  # in one source window. The transport decode and the execution sink are
  # what lift this past ordinary crypto demo code to a payload chain.
  - id: webcrypto-pushed-blob-compiled
    desc: Pushed blob decoded, decrypted and compiled
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.007,T1105
    near_bytes: 768
    all:
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text
      - id: micro-behaviors/crypto/symmetric/decrypt::webcrypto-decrypt-call-text
    any:
      - id: micro-behaviors/process/interpreter/eval/compile::js-function-textdecoder-argument
      - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-constructor
      - id: micro-behaviors/process/interpreter/eval/compile::html-new-function-constructor-text
