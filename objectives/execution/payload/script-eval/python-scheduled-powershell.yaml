defaults:
  platforms:
  - windows
  for:
  - python
composite_rules:
- id: python-scheduled-hidden-powershell-remote-eval
  desc: Registers hidden PowerShell response-eval task
  crit: hostile
  conf: 0.99
  attack: T1059.001,T1105
  all:
  - id: micro-behaviors/process/deploy/script-eval::python-schtasks-response-eval-action
  - id: metadata/import/builtin::python-subprocess-import
  unless:
  - id: metadata/lang/source/shape::python-static-string-print-module
