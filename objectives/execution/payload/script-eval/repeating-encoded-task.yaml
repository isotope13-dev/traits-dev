defaults:
  platforms: [windows]
  for: [scripts, source]

composite_rules:
  # A hidden encoded task periodically evaluates the fetched response. A
  # download-only task does not establish this activation sink.
  - id: repeating-hidden-encoded-task-remote-eval
    desc: Hidden repeating task evaluates remote script
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1105
    all:
      - id: objectives/persistence/system/scheduled-task::repeating-encoded-powershell-download-task
      - id: micro-behaviors/process/argument/option::powershell-hidden-command-text
      - id: micro-behaviors/process/deploy/script-eval::encoded-powershell-downloadstring-result-eval
