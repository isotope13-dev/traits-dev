defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: ethereum-blockchain-derived-node-stage
    desc: Ethereum lookup and XOR accompany awaited Node child source
    crit: hostile
    conf: 0.995
    attack: T1102,T1105,T1027,T1059.007
    # Moved from dropper/delivery/blockchain to the payload sink. The awaited
    # source must reach the child; unrelated eval or child code cannot
    # establish that sink. In-process eval remains a separate observation.
    near_bytes: 12000
    all:
      - id: metadata/import/builtin::require-child-process
      - id: micro-behaviors/communications/blockchain/client::ethereum-blockchain-history-query
      - id: micro-behaviors/data/transaction/query::ethereum-transaction-recipient-ip-split
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
      - id: micro-behaviors/data/decode/base64::buffer-from-base64
      - id: micro-behaviors/data/decode/xor::js-repeating-key-buffer-xor-loop
      - id: micro-behaviors/process/create/eval::awaited-source-node-inline-child
