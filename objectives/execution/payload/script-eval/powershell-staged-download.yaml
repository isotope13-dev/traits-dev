defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1059.001,T1105
  mbc: B0030

composite_rules:
  # The outer decoder evaluates one Base64 literal whose decoded PowerShell
  # assigns a WebClient DownloadString response to $script and evaluates that
  # same variable. The opaque User-Agent supplies attack-specific concealment.
  - id: powershell-base64-remote-response-eval
    desc: Base64-hidden PowerShell evaluates fetched script with opaque User-Agent
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.001,T1105
    near_bytes: 1
    all:
      - id: objectives/anti-static/obfuscation/encoding/base64::powershell-decoded-variable-eval
      - id: micro-behaviors/process/deploy/script-eval::base64-webclient-opaque-useragent-source

  # The staged download above, launched hidden with TLS verification
  # disabled: a download cradle that hides its window and blinds itself to
  # MITM is a payload stager, not an updater.
  - id: powershell-hidden-cradle-launch
    desc: Hidden download cradle with certificate bypass
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-near-downloadstring
      - id: micro-behaviors/process/create/managed::powershell-processstartinfo-hidden-window
      - id: micro-behaviors/communications/tls/verify/disable::powershell-callback-accepts-all-certificates
  - id: powershell-empire-cradle-module
    desc: Empire stages a hidden download cradle
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: powershell-hidden-cradle-launch
      - id: well-known/tool/offensive/powershell-empire::extra-exec-module-functions-b
