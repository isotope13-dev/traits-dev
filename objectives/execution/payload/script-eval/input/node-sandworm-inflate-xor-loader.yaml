defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1059.007,T1027,T1552.001

traits:
  - id: node-sandworm-xor-key
    desc: Uses Sandworm payload XOR key
    crit: suspicious
    if:
      type: text
      substr: '214,232,243,62,189,212,19,46,155,184,197,42,240,85,159,72,224,228,85,241,242,61,45,131,88,247,12,49,40,249,46,54'
  - id: node-inflate-base64-binary
    desc: Inflates a base64 binary payload
    crit: notable
    if:
      type: text
      substr: "require('zlib').inflateSync(Buffer.from(d,'base64')).toString('binary')"
  - id: node-indirect-eval-payload
    desc: Evaluates decoded payload indirectly
    crit: notable
    if:
      type: text
      substr: '(0,eval)(_p)'

composite_rules:
  - id: node-sandworm-inflate-xor-loader
    desc: Loads compressed encrypted Sandworm credential stealer
    crit: hostile
    conf: 0.99
    all:
      - id: node-sandworm-xor-key
      - id: node-inflate-base64-binary
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::js-modulo-key-xor-byte-mask
      - id: node-indirect-eval-payload
