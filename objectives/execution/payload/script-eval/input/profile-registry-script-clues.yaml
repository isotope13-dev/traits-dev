# Preserve byte proximity as well as line proximity for minified sources.
defaults:
  platforms:
  - windows
composite_rules:
- for:
  - javascript
  - powershell
  - vbs
  id: powershell-registry-read-scriptblock-clues
  desc: PowerShell registry read and ScriptBlock clues
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/os/registry/read::powershell-registry-read
  - id: micro-behaviors/metaprogramming/generation/function::powershell-scriptblock-constructor-text
  near_lines: 6
  near_bytes: 1024
- for:
  - javascript
  - vbs
  - html
  id: powershell-registry-read-expression-clues
  desc: PowerShell registry read and expression clues
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/os/registry/read::powershell-registry-read
  - id: micro-behaviors/process/interpreter/eval/powershell::powershell-expression-command-text
  near_lines: 8
  near_bytes: 4096
  unless:
  - id: well-known/tool/development/vcs/github-web::blob-page-rendered-source
