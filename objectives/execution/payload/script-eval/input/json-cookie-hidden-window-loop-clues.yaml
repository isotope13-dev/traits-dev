defaults:
  platforms: [unix, windows]
  for: [documents, data, javascript]
composite_rules:
  - id: json-cookie-hidden-window-loop-clues
    for: [javascript]
    desc: Cookie code, loop and hidden-window clues
    crit: suspicious
    conf: 0.995
    all:
      - id: micro-behaviors/data/embedded/script::json-cookie-javascript-push-loop-clues
      - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
    any:
      - id: micro-behaviors/data/embedded/script::json-cookie-detached-or-unref-text
