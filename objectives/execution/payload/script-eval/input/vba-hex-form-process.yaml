defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1059.005

traits:
  - id: vba-form-hex-hidden-process
    desc: Launches decoded form data invisibly
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule vba_form_hex_hidden_process {
          strings:
            $open = "Document_Open()" nocase
            $form = /UserForm[0-9]+\.[A-Za-z0-9_]+\.Text/ nocase
            $decode = /Val\s*\(\s*["']&H["']\s*&\s*Mid/ nocase
            $binary = /Open\s+[^\r\n]{1,100}\s+For\s+Binary\s+Access\s+Write/ nocase
            $process = "CreateProcessA" nocase
            $hidden = "CREATE_NO_WINDOW" nocase
          condition:
            all of them
        }
