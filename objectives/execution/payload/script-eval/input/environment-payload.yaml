defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: powershell-eval-environment-payload
    desc: PowerShell evaluates environment payload text
    crit: suspicious
    conf: 0.95
    attack: T1059.001
    if:
      type: text
      regex: '(?im)(^|[;|])\s*(iex|Invoke-Expression)[ \t]+\$env:\w*payload\w*\b'
