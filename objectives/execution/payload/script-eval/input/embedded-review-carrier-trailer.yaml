defaults:
  platforms: [windows, linux, macos]
  attack: T1027.003,T1059
  mbc: B0032.001
composite_rules:
  - id: powershell-trailer-marked-file-range-iex
    desc: Evaluates a script slice from a marker-tagged file
    crit: hostile
    conf: 0.98
    for: [powershell]
    attack: T1027.003,T1059.001
    near_lines: 80
    all:
      - id: micro-behaviors/data/embedded/payload/trailer/
      - id: micro-behaviors/data/buffer/carve::powershell-file-range-to-string
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call

  - id: javascript-trailer-marked-file-range-eval
    desc: Evaluates a script slice from a marker-tagged file
    crit: hostile
    conf: 0.96
    for: [javascript, typescript]
    near_lines: 60
    all:
      - id: micro-behaviors/data/embedded/payload/trailer/
      - id: micro-behaviors/data/buffer/carve::javascript-file-range-to-string
    any:
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-variable-argument
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-call-expression-arg
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-tostring-result
      - id: micro-behaviors/process/interpreter/eval/constructed/

  - id: python-trailer-marked-file-range-exec
    desc: Executes a script slice from a marker-tagged file
    crit: hostile
    conf: 0.96
    for: [python]
    near_lines: 60
    all:
      - id: micro-behaviors/data/embedded/payload/trailer/
      - id: micro-behaviors/data/buffer/carve::python-file-range-read
    any:
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-after-file-read
