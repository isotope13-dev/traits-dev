defaults:
  platforms:
  - windows
  for:
  - javascript
  - vbs
  - html
  crit: hostile
  conf: 0.99
composite_rules:
- attack: T1027,T1059.001,T1112,T1204.002
  id: hta-registry-write-powershell-run-clues
  desc: HTA registry write and PowerShell Run clues
  all:
  - id: metadata/file/format/markup::hta-application-element
  - id: micro-behaviors/os/com/instantiation::wscript-shell-activex-constructor
  - id: micro-behaviors/os/registry/value/write::wscript-regwrite
  - id: objectives/execution/payload/script-eval/input::powershell-registry-read-expression-clues
  - id: micro-behaviors/data/control-flow/dispatch/run::run-zero-number-argument
- attack: T1027,T1059.001,T1070.004,T1112
  id: hta-registry-powershell-run-delete-clues
  desc: HTA registry PowerShell Run and delete clues
  all:
  - id: objectives/execution/payload/script-eval/input::hta-registry-write-powershell-run-clues
  - id: micro-behaviors/os/registry/delete::powershell-registry-value-delete
