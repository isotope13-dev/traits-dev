defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1059.005,T1027

traits:
  - id: vba-author-base64-hidden-shell
    desc: Macro decodes author property into hidden shell
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule vba_author_base64_hidden_shell {
          strings:
            $open = "Workbook_Open(" nocase
            $property = /BuiltinDocumentProperties\s*\(\s*["']Author["']\s*\)/ nocase
            $decode = "Base64DecodeString(" nocase
            $shell = /\bShell\s*\([^\r\n]{1,100}vbHide/ nocase
          condition:
            all of them
        }
