defaults:
  platforms: [windows]
  for: [javascript, text, data]
  attack: T1059.007

composite_rules:
- id: wsh-environment-iex-hidden-launcher
  for: [javascript]
  desc: Hidden WSH environment IEX launcher
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-environment-text
  - id: metadata/lang/source/syntax/assignment/call::call-assigned-long-string-text
  - id: micro-behaviors/os/env/read/variable::wsh-process-environment
  - id: micro-behaviors/os/env/write::env-dynamic-assignment
  any:
  - id: objectives/execution/interpreter/scripting/host::shell-application-execution-clues
  - id: objectives/execution/interpreter/scripting/host::shell-application-fragmented-hidden-flags
  - id: objectives/execution/interpreter/scripting/host::wscript-run-fragmented-window-clues
  - id: objectives/execution/interpreter/scripting/host::wscript-exec-fragmented-window-clues
  - id: metadata/lang/source/literal/fragment/sequence::split-conhost-powershell-text
  - id: metadata/lang/source/literal/fragment/sequence::window-noprofile-text-fragments
