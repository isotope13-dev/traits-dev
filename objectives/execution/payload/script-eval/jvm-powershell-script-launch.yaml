defaults:
  platforms: [windows]
  for: [source, scripts]
  attack: T1059.001
composite_rules:
  - id: jvm-powershell-script-launch
    desc: JVM launches noninteractive PowerShell script
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-source
      - id: micro-behaviors/process/create/flags::powershell-noninteractive-flag
      - id: micro-behaviors/data/control-flow/loop::embedded-powershell-while-true
