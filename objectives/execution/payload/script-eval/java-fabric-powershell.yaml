# The game initializer hands remote source to a hidden OS interpreter.
# Neither a Fabric import nor download/eval alone supplies this admission.
defaults:
  platforms: [windows]
  for: [class]
  attack: T1059.001,T1105
traits:
  - id: fabric-hidden-powershell-web-eval-bytes
    desc: Fabric hidden PowerShell web-eval byte profile
    crit: suspicious
    conf: 0.98
    # Match the same execution context during the archive's cheap YARA pass;
    # otherwise a small injected initializer can miss the class sampling cap.
    # No class, archive, host or campaign-specific name is required.
    if:
      type: yara
      source: |
        rule fabric_hidden_powershell_web_eval {
          strings:
            $fabric = "net/fabricmc/api/ClientModInitializer" ascii
            $entry = "onInitializeClient" ascii
            $builder = "java/lang/ProcessBuilder" ascii
            $ctor = { 01 00 06 3C 69 6E 69 74 3E }
            $start = { 01 00 05 73 74 61 72 74 }
            $process_result = "()Ljava/lang/Process;" ascii
            $powershell = "powershell.exe" ascii nocase
            $command = "-Command" ascii nocase
            $hidden = /-WindowStyle.{0,40}Hidden/is
            $cradle = /\b(irm|Invoke-RestMethod)\b[^\r\n|]{0,120}\|[ \t]*(iex|Invoke-Expression)\b/ nocase
          condition:
            uint32be(0) == 0xcafebabe and all of them
        }

composite_rules:
  - id: java-fabric-hidden-powershell-web-eval
    desc: Fabric initializer runs hidden web evaluation
    crit: hostile
    conf: 0.98
    all:
      - id: fabric-hidden-powershell-web-eval-bytes
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode
