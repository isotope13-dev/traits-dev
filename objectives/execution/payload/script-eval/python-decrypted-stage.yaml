# Decrypts a staged ciphertext blob and executes the recovered script.
defaults:
  platforms: [windows, unix]
  for: [python, whl]
  attack: T1027,T1140,T1059.006
  mbc: B0032,B0024

composite_rules:
  - id: python-decrypted-payload-script-eval
    desc: Decrypts staged payload and executes code
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/file/encoded::large-base64-like-literal
      - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2
    any:
      - id: micro-behaviors/process/interpreter/python::python-getattr-builtins
      - id: micro-behaviors/metaprogramming/reflection::python-getattr-call
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
      - id: micro-behaviors/process/interpreter/eval/constructed::exec-compiled-code
