# A matched async resolver and its consuming variable must feed the sink.
# Transaction queries, XOR utilities and unrelated template evals do not qualify.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  conf: 0.98
  attack: T1102,T1059.007,T1140
traits:
  - id: xor-blockchain-helper-result-eval-binding
    desc: Awaited blockchain XOR helper feeds eval
    crit: suspicious
    if:
      type: tree-sitter
      query: |
        (statement_block
          (function_declaration name: (identifier) @resolver
            body: (statement_block) @resolver_body)
          (try_statement body: (statement_block
            (_ (variable_declarator name: (identifier) @payload
              value: (await_expression (call_expression function: (identifier) @caller))))
            (expression_statement (call_expression function: (identifier) @eval
              arguments: (arguments (identifier) @evaluated)))))
          (#eq? @resolver @caller)
          (#eq? @payload @evaluated)
          (#eq? @eval "eval")
          (#match? @resolver_body "eth_getTransactionByHash")
          (#match? @resolver_body "result.{0,16}input")
          (#match? @resolver_body "charCodeAt")
          (#match? @resolver_body "fromCharCode")
          (#match? @resolver_body "\\^")
        ) @bound
  - id: xor-blockchain-helper-detached-node-eval-binding
    desc: Awaited blockchain XOR helper feeds Node
    crit: suspicious
    if:
      type: tree-sitter
      query: |
        (statement_block
          (function_declaration name: (identifier) @resolver
            body: (statement_block) @resolver_body)
          (try_statement body: (statement_block
            (_ (variable_declarator name: (identifier) @payload
              value: (await_expression (call_expression function: (identifier) @caller))))
            (expression_statement (call_expression
              function: (_ object: (call_expression
                function: (_) @spawn
                arguments: (arguments
                  (string (string_fragment) @runtime)
                  (array
                    (string (string_fragment) @flag)
                    (parenthesized_expression (binary_expression
                      right: (parenthesized_expression (identifier) @child))))
                  (object) @options)))))))
          (#eq? @resolver @caller)
          (#eq? @payload @child)
          (#eq? @runtime "node")
          (#eq? @flag "-e")
          (#match? @spawn "spawn")
          (#match? @options "detached[ \\t]*:[ \\t]*true")
          (#match? @resolver_body "eth_getTransactionByHash")
          (#match? @resolver_body "result.{0,16}input")
          (#match? @resolver_body "charCodeAt")
          (#match? @resolver_body "fromCharCode")
          (#match? @resolver_body "\\^")
        ) @bound
  - id: xor-blockchain-helper-error-eval-binding
    desc: Blockchain XOR result feeds error-callback eval
    crit: suspicious
    if:
      type: tree-sitter
      query: |
        (statement_block
          (function_declaration name: (identifier) @resolver
            body: (statement_block) @resolver_body)
          (try_statement body: (statement_block
            (_ (variable_declarator name: (identifier) @payload
              value: (await_expression (call_expression function: (identifier) @caller))))
            (expression_statement (call_expression
              function: [
                (subscript_expression object: (call_expression)
                  index: (string (string_fragment) @on))
                (member_expression object: (call_expression)
                  property: (property_identifier) @on)
              ]
              arguments: (arguments
                (string (string_fragment) @error)
                (function_expression body: (statement_block
                  (expression_statement (call_expression function: (identifier) @eval
                    arguments: (arguments (identifier) @evaluated))))))))))
          (#eq? @resolver @caller)
          (#eq? @payload @evaluated)
          (#eq? @on "on")
          (#eq? @error "error")
          (#eq? @eval "eval")
          (#match? @resolver_body "eth_getTransactionByHash")
          (#match? @resolver_body "result.{0,16}input")
          (#match? @resolver_body "charCodeAt")
          (#match? @resolver_body "fromCharCode")
          (#match? @resolver_body "\\^")
        ) @bound
composite_rules:
  # Some obfuscated npm loaders do not expose their blockchain resolver as a
  # parseable helper: the JSON-RPC method names are XOR/Base64 string-table
  # entries. The combination below still captures their payload handoff: an
  # XOR string-table decoder feeds indirect eval, then an explicitly detached
  # and hidden child is launched after host profiling.
  - id: obfuscated-eval-detached-hidden-child
    desc: Obfuscated JavaScript evaluates code and launches a hidden detached child
    crit: hostile
    conf: 0.91
    attack: T1027,T1059.007,T1564.003
    all:
      - id: objectives/anti-static/obfuscation/encoding/xor::atob-map-charcode-numeric-xor
      - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-variable
      - id: micro-behaviors/process/create/spawn::detached-hidden-spawn
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair

  - id: xor-blockchain-helper-result-eval
    desc: Evaluates XOR-decoded blockchain source
    crit: hostile
    all:
      - id: micro-behaviors/communications/blockchain/client::ethereum-transaction-by-hash-literal
      - id: micro-behaviors/data/string/conversion::js-repeating-key-xor-character-reconstruction
    any:
      - id: xor-blockchain-helper-result-eval-binding
      - id: xor-blockchain-helper-error-eval-binding
  - id: xor-blockchain-helper-detached-node-eval
    desc: Detached Node executes blockchain source
    crit: hostile
    all:
      - id: xor-blockchain-helper-detached-node-eval-binding
      - id: micro-behaviors/communications/blockchain/client::ethereum-transaction-by-hash-literal
      - id: micro-behaviors/data/string/conversion::js-repeating-key-xor-character-reconstruction
