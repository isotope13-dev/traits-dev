defaults:
  platforms: [windows]
  for: [python]
composite_rules:
  - id: defender-excluded-decrypted-marshal-execution
    desc: Key-search bytecode with Defender exclusions
    crit: hostile
    conf: 0.99
    attack: T1059.006,T1140
    all:
      - id: micro-behaviors/process/deploy/script-eval::python-decrypted-marshal-exec
      - id: micro-behaviors/crypto/key/generate::python-chacha-counter-key-candidates
      - id: micro-behaviors/os/security/defender::python-interpreter-exclusion-argument
