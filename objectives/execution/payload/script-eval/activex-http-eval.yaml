defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
  - id: activex-remote-ip-eval-dropper
    desc: ActiveX client fetches external IP payload and evaluates response
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.007,T1071.001
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/os/com/automation::activex-constructor-call
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-response-text
    unless:
      - id: micro-behaviors/communications/http/url/tld::reserved-documentation-tld-url
