defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
  - id: activex-remote-ip-eval-dropper
    desc: ActiveX, external-IP URL and HTTP response eval
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.007
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/os/com/automation::activex-constructor-call
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-response-text
    unless:
      - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url

  # Payload activation is distinct from a reusable command channel. Preserve
  # the existing direct-IP, ServerXMLHTTP, and synchronous-fetch match scopes.
  - id: direct-ip-sync-response-eval-dropper
    desc: Direct-IP URL, synchronous GET and response eval
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.007
    mbc: C0002
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/client/xmlhttp::xhr-sync-get
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-response-text
    unless:
      - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url

  - id: activex-serverxmlhttp-sync-eval-dropper
    desc: ServerXMLHTTP, synchronous GET and response eval
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.007
    # Reserved documentation endpoints cannot supply the remote stage.
    unless:
      - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url
    all:
      - id: micro-behaviors/os/com/automation::activex-constructor-call
      - id: micro-behaviors/communications/http/client/xmlhttp::http-client-msxml-serverxmlhttp-progid
      - id: micro-behaviors/communications/http/client/xmlhttp::xhr-sync-get
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-response-text

  - id: activex-sync-http-eval-dropper
    desc: ActiveX synchronous HTTP fetch and eval
    crit: hostile
    conf: 0.98
    attack: "T1059.007,T1105"
    all:
      - id: micro-behaviors/os/com/automation::activex-constructor-call
      - id: micro-behaviors/communications/http/client/xmlhttp::xhr-sync-get
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-response-text
    unless:
      - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url
      - id: well-known/lib/web/client-side/browser-libraries::dojo-toolkit-library
      - id: well-known/lib/web/authoring/syntaxhighlighter::shjs-syntax-highlighter
