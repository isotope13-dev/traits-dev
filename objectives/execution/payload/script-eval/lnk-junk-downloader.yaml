defaults:
  platforms: [windows]
  for: [lnk]
composite_rules:
  - id: lnk-junk-stripped-downloader-eval
    desc: Hidden LNK strips inserted text from a downloader before evaluation
    crit: hostile
    conf: 0.97
    attack: T1059.001,T1105,T1027
    all:
      - id: objectives/anti-static/obfuscation/string/junking::lnk-interleaved-downloadstring-spelling
      - id: micro-behaviors/data/string/replace::lnk-remove-alphabetic-token
      - id: metadata/lang/source/naming/action::lnk-invoke-expression-reference
      - id: micro-behaviors/process/create/shortcut::lnk-powershell-target
      - id: micro-behaviors/process/create/shortcut::lnk-hidden-window-flag
