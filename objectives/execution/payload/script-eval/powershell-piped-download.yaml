# A remote download piped directly into PowerShell executes script content
# straight from stdin in memory without writing the payload to disk.
defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1059.001,T1105
  mbc: B0030

composite_rules:
  # Node launchers can carry the same in-memory fetch-and-evaluate cradle as
  # a native PowerShell script. The node-specific atom already ties the
  # policy bypass, interpreter launch, and remote script source together.
  - id: node-powershell-remote-fetch-execute
    desc: Node CLI launches PowerShell to fetch and execute a remote script
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/create/shell/script-host::powershell-exe-spawn
      - id: micro-behaviors/process/argument/option::powershell-policy-bypass-argument
      - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-script-file
    any:
      - id: micro-behaviors/process/deploy/script-eval::embedded-irm-iex-pipeline
      - id: micro-behaviors/communications/http/download/cli::embedded-powershell-irm-iex-command

  - id: powershell-piped-download-eval
    desc: PowerShell evaluates downloaded stream from stdin
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-powershell
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
      - id: metadata/lang/source/syntax/command/pipeline::pipe-to-powershell
    any:
      - id: micro-behaviors/communications/http/download/cli::curl-wget-bare-domain
      - id: metadata/file/extension/mismatch::batch-content-extension-mismatch
    needs: 1


