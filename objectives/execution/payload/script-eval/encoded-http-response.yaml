defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.99
  attack: T1059.007,T1105,T1027
traits:
  # The anonymous promise callback is not represented in the current flow
  # facts. Bind its parameter to the evaluated response field in the AST.
  - id: encoded-axios-response-data-eval
    desc: Encoded Axios URL delivers evaluated response
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression
            object: (call_expression
              function: (member_expression
                object: (call_expression function: (identifier) @require
                  arguments: (arguments (string (string_fragment) @axios)))
                property: (property_identifier) @get)
              arguments: (arguments (call_expression function: (identifier) @decode)))
            property: (property_identifier) @then)
          arguments: (arguments (arrow_function
            [(identifier) @response
             (formal_parameters . (identifier) @response .)]
            body: (statement_block (expression_statement (call_expression
              function: (identifier) @eval
              arguments: (arguments (member_expression
                object: (identifier) @evaluated
                property: (property_identifier) @data))))))))
          (#eq? @require "require") (#eq? @axios "axios")
          (#eq? @get "get") (#eq? @decode "atob")
          (#eq? @then "then") (#eq? @eval "eval")
          (#eq? @response @evaluated) (#eq? @data "data"))
composite_rules:
  - id: encoded-axios-body-execution-loader
    desc: Concealed URL response executes as JavaScript
    crit: hostile
    all:
      - id: encoded-axios-response-data-eval
      - id: micro-behaviors/data/decode/base64::atob-decode
