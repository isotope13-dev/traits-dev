defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html, php]
  attack: T1059.007

composite_rules:
  - id: binary-character-synthetic-event-replay
    desc: Binary character decoding beside synthetic handler execution
    crit: suspicious
    conf: 0.93
    near_bytes: 512
    # Execution mechanism, independent of how the binary digits were stored.
    # These bounded observations do not prove variable-level data flow; keep
    # the claim and severity at suspicious co-occurrence rather than malware.
    all:
      - id: micro-behaviors/data/decode/base2::js-binary-parseint
      - id: micro-behaviors/process/interpreter/eval/constructed::dom-handler-synthetic-click
    any:
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-carrier
      - id: micro-behaviors/data/string/conversion::fromcharcode-call
