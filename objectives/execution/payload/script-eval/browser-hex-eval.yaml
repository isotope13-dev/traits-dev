defaults:
  platforms: [windows, unix]

composite_rules:
- id: browser-fetch-text-obfuscated-global-eval
  desc: Fetch response text near encoded global evaluation
  crit: hostile
  conf: 0.97
  attack: T1027.002,T1105,T1059.007
  mbc: B0009.016
  for:
  - javascript
  near_bytes: 1400
  all:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
  - id: micro-behaviors/process/interpreter/eval/indirect::js-global-eval-hex-escaped-key
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
