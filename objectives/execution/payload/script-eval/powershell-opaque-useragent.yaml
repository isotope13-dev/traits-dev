defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  # A long opaque header in a decoded fetch-to-evaluator pipeline can serve
  # as a payload-access token. The content alone cannot prove server-side
  # gating, so this remains suspicious and does not claim authentication.
  # Require the header and sink in the same pipeline, not file co-occurrence.
  - id: base64-irm-opaque-useragent-eval
    desc: Concealed remote eval with opaque User-Agent
    crit: suspicious
    conf: 0.97
    attack: T1027,T1105,T1059.001
    # The encoded match begins inside the same literal captured by the bound
    # decoder/evaluator query (one byte after its opening quote).
    near_bytes: 1
    all:
      - id: objectives/anti-static/obfuscation/encoding/base64::powershell-decoded-variable-eval
      - id: micro-behaviors/process/deploy/script-eval::base64-irm-opaque-useragent-pipeline
