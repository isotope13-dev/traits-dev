defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: obfuscated-etherhiding-hex-stage-dropper
    desc: Obfuscated blockchain-resolved HTTP stage is dynamically executed
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.007,T1027
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::global-alias-obfuscation
      # A chosen stage route is not a technique. Require the computed HTTP
      # request instead; header staging and execution remain necessary even
      # when the byte transform or route changes.
      - id: micro-behaviors/communications/http/request/computed::js-computed-http-object-call
      - id: micro-behaviors/communications/http/response::x-payload-header-prefix
      - id: micro-behaviors/communications/http/url/rpc::blockscout-host-fragment
    any:
      - id: micro-behaviors/process/interpreter/eval/indirect::js-computed-helper-receives-eval
      - id: micro-behaviors/process/create/eval::js-helper-receives-spawn-inline-source
