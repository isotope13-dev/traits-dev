defaults:
  platforms: [windows, unix]
  for: [javascript, python, shell]

composite_rules:
- id: ethereum-recipient-detached-eval-socket-stage
  desc: Detached node-eval dials recipient C2
  crit: hostile
  conf: 0.98
  attack: T1102,T1105,T1059.007,T1564.003
  mbc: B0024,B0032
  for:
    - javascript
    - typescript
  near_bytes: 12000
  all:
    - id: micro-behaviors/process/deploy/interpreter-command::spawn-node-eval-first-option
    - id: micro-behaviors/process/daemonize/detach::detached-true
    - id: micro-behaviors/communications/socket/connect/attempt::socket-connect-port-host
    - id: micro-behaviors/data/transaction/query::ethereum-transaction-recipient-field
  unless:
    - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url
