defaults:
  platforms: [windows, unix]
  for: [javascript, python, shell]

composite_rules:
- id: blockchain-staged-delivery
  desc: Staged payload delivery through blockchain infrastructure
  crit: hostile
  conf: 0.95
  all:
    - id: micro-behaviors/communications/http/services/blockchain::tronscan-or-bscscan-host-reference
    - id: micro-behaviors/communications/http/services/blockchain::ethereum-or-polygon-explorer-reference
    - id: micro-behaviors/communications/http/services/blockchain::solscan-or-aptoslabs-host-reference
    - id: micro-behaviors/communications/http/services/blockchain::tron-or-blockcypher-host
    - id: micro-behaviors/communications/http/services/blockchain::etherscan-or-bscscan-api-name-reference
  any:
    - id: objectives/execution/payload/script-eval/network/constructed::remote-response-or-https-evaluation
