defaults:
  platforms: [unix]
  for: [npm, tar, javascript, typescript]
composite_rules:
  - id: node-package-ethereum-storage-hex-shell
    desc: Package combines Ethereum storage reads with hex-decoded shell execution
    crit: hostile
    conf: 0.97
    attack: T1102,T1059.004
    scope: package
    all:
      - id: micro-behaviors/communications/blockchain/ethereum::eth-get-storage-at-method
      - id: micro-behaviors/process/create/shell/command-mode::node-hex-variable-shell-command
