defaults:
  platforms: [windows, unix]
  for: [javascript, python, shell]

composite_rules:
- id: ethereum-recipient-dead-drop-stage-loader
  desc: Ethereum recipient dead drop feeds Node stage
  crit: hostile
  conf: 0.995
  attack: T1102,T1105,T1140,T1027,T1059.007
  mbc: B0024,B0032
  for:
    - javascript
    - typescript
  near_bytes: 12000
  all:
    - id:
        objectives/command-and-control/channel/deaddrop/blockchain::ethereum-recipient-byte-c2-resolution-javascript
    - id: micro-behaviors/communications/http/response::response-payload-base64-header
    - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64
    - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
    - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-call-expression-arg
    - id: micro-behaviors/process/deploy/interpreter-command::spawn-node-eval
