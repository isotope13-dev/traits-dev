defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
composite_rules:
- id: php-ethereum-storage-hex-shell-command
  desc: PHP executes a shell command decoded from Ethereum storage
  crit: hostile
  conf: 0.98
  attack: T1102,T1059.004
  for: [php, zip, tar]
  scope: archive
  all:
  - id: micro-behaviors/communications/blockchain/ethereum::eth-get-storage-at-method-field
  - id: micro-behaviors/communications/http/services/cloudflare::ethereum-cloudflare-provider
  - id: micro-behaviors/data/decode/hex::php-hex-byte-decode
  - id: micro-behaviors/process/create/shell/command-mode::php-shell-exec
  - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path

- id: blockchain-remote-payload-eval
  desc: Blockchain dead-drop payload eval
  crit: hostile
  conf: 0.98
  mbc: B0032
  attack: T1102,T1059.007
  all:
  - id: objectives/command-and-control/infrastructure/blockchain/multi-chain::blockchain-c2-fetch
  - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
  unless:
  - id: objectives/execution/payload/script-eval/blockchain::blockchain-tx-interpreter-loader
