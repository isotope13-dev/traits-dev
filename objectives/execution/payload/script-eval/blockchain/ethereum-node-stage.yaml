defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  # Some Ethereum-derived loaders execute their decoded response in-process
  # instead of reusing the awaited source as a detached child's input. Keep
  # this execution sink separate from the child-stage rule below: transaction
  # recipient bytes produce the HTTP host, the response is decoded, and eval
  # runs in the loader itself.
  - id: ethereum-derived-http-xor-inline-eval
    desc: Ethereum XOR stage evaluated in process
    crit: hostile
    conf: 0.98
    attack: T1102,T1105,T1059.007,T1027
    near_bytes: 20480
    all:
      - id: micro-behaviors/communications/blockchain/client::ethereum-blockchain-history-query
      - id: micro-behaviors/data/transaction/query::ethereum-transaction-recipient-ip-split
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
      - id: micro-behaviors/data/decode/xor/repeating-key::js-repeating-key-buffer-xor-loop
    any:
      # Require the awaited source to reach eval. A payload-header read and
      # an unrelated eval do not prove in-process stage execution.
      - id: micro-behaviors/process/deploy/script-eval/input::awaited-source-eval-helper-reuse
      # The camera/Tailwind loader uses a short-circuit eval and forwards
      # the same awaited source to spawn, rather than an awaited helper.
      # This binding also works when the HTTP header fallback is removed.
      - id: micro-behaviors/process/deploy/script-eval/input::awaited-source-eval-and-child-reuse
      # Inline evaluation remains an execution sink when the child receives
      # unrelated input, or no child is launched at all.
      - id: micro-behaviors/process/deploy/script-eval/input::awaited-source-inline-eval

  - id: ethereum-blockchain-derived-node-stage
    desc: Ethereum XOR stage passed to Node child
    crit: hostile
    conf: 0.995
    attack: T1102,T1105,T1027,T1059.007
    # Moved from dropper/delivery/blockchain to the payload sink. The awaited
    # source must reach the child; unrelated eval or child code cannot
    # establish that sink. In-process eval remains a separate observation.
    near_bytes: 20480
    all:
      - id: micro-behaviors/communications/blockchain/client::ethereum-blockchain-history-query
      - id: micro-behaviors/data/transaction/query::ethereum-transaction-recipient-ip-split
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
      # Raw response bodies are XOR-decoded directly; Base64 is only used
      # by the optional HTTP-header fallback, not by the child handoff.
      - id: micro-behaviors/data/decode/xor/repeating-key::js-repeating-key-buffer-xor-loop
      - id: micro-behaviors/process/deploy/script-eval/input::awaited-source-node-inline-child
    any:
      - id: metadata/import/builtin::require-child-process
      - id: metadata/import/builtin::helper-call-child-process-module-name

  - id: ethereum-recipient-xor-stage-loader
    desc: Ethereum recipient IPv4 resolves XOR-decoded JS stage
    crit: hostile
    conf: 0.99
    attack: T1102,T1105,T1027,T1059.007
    near_bytes: 12000
    all:
      - id: micro-behaviors/communications/blockchain/client::ethereum-jsonrpc-client-query
      - id: micro-behaviors/data/transaction/query::ethereum-recipient-ipv4-assembly
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
      - id: micro-behaviors/data/decode/xor/repeating-key::js-repeating-key-buffer-xor-loop
    any:
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
      - id: micro-behaviors/process/deploy/interpreter-command::spawn-node-eval
