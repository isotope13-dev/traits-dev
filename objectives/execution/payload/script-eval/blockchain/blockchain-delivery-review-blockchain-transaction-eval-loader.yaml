defaults:
  platforms: [windows, unix]
  for: [javascript, python, shell]

composite_rules:
- id: blockchain-transaction-eval-loader
  desc: Blockchain transaction eval loader
  crit: hostile
  conf: 0.96
  attack: T1105
  for:
    - javascript
  all:
    - id: micro-behaviors/communications/blockchain/client::blockchain-provider-reference-cluster
    - id: metadata/lang/natural/vocabulary/finance::blockchain-transaction-text
  any:
    - id: micro-behaviors/metaprogramming/generation/function::embedded-eval-variable-source
    - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-variable-argument
    - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
