defaults:
  for:
  - javascript
  - vbs
  platforms:
  - windows
  attack: T1059.001,T1059.007,T1105
composite_rules:
- id: wsh-hidden-decode-download-eval
  desc: Hidden WSH stdin stage downloads/evals code
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/lang/source/naming/action/token::exec-member-symbol
  - id: micro-behaviors/process/io/stream::wsh-exec-stdin-write-close
  - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
  - id: micro-behaviors/communications/http/client/webclient::webclient-download-data
  - id: micro-behaviors/process/interpreter/eval/direct::powershell-expression-command-text
  - id: micro-behaviors/data/decode/base64::powershell-frombase64string
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
