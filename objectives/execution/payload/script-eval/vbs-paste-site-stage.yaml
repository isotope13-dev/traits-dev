# A VBScript that GETs a paste-site document and runs the response body with
# ExecuteGlobal: the next stage is hosted as an anonymous paste and executed
# in the script's global scope with no integrity check. Legitimate scripts do
# not distribute their own code through public paste services; the paste host
# is the admitting fact, the fetch-to-eval chain the activation.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1059.005,T1105,T1102

composite_rules:
  - id: vbs-paste-site-response-executeglobal
    desc: VBScript executes code fetched from paste site
    crit: hostile
    conf: 0.95
    near_bytes: 2048
    all:
      - id: micro-behaviors/process/deploy/script-eval::vbs-response-text-executeglobal
      - id: objectives/collection/file-targeting/remote-list::vbs-http-get
    any:
      - id: objectives/command-and-control/infrastructure/paste::paste-ee
      - id: micro-behaviors/communications/http/services/file-hosting::pastebin
      - id: objectives/command-and-control/infrastructure/paste::hastebin
      - id: objectives/command-and-control/infrastructure/paste::ghostbin
      - id: objectives/command-and-control/infrastructure/paste::dpaste
      - id: objectives/command-and-control/infrastructure/paste::rentry
      - id: objectives/command-and-control/infrastructure/paste::pastefy
      - id: objectives/command-and-control/infrastructure/paste::privatebin
      - id: objectives/command-and-control/infrastructure/paste::textbin
