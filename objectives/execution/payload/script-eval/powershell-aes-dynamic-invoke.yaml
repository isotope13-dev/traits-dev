defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  # Moved from execution/interpreter/eval/invoke without matcher changes:
  # the observed result is activation of an encrypted script wrapper.
  # The required facts co-occur; they do not prove buffer-to-evaluator flow.
  - id: powershell-aes-decrypt-scriptblock-execute
    desc: AES script wrapper with dynamic invocation
    crit: hostile
    conf: 0.98
    attack: T1027,T1140,T1059.001
    mbc: B0030,E1059
    all:
      - id: objectives/anti-static/obfuscation/payload/encrypted::powershell-aes-wrapped-script-construction
      - id: micro-behaviors/data/control-flow/dispatch/computed::powershell-variable-call-operator
