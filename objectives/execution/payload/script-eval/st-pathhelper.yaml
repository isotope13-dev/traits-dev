# The st-pathhelper incident used the string steveJoe alongside RC4 and eval.
# A string, a field pair, or a cipher alone cannot establish remote execution.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  size_max: 5000000
  attack: T1059.007
composite_rules:
  - id: stevejoe-eval-with-loader-indications
    desc: steveJoe string with variable eval reference
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/lang/source/literal/string::stevejoe-string-literal
    any:
      - id: micro-behaviors/metaprogramming/generation::embedded-eval-variable-source
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
    needs: 1
