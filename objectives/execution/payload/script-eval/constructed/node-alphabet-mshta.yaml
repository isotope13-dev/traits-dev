# The bootstrap fixes the alphabet used by the encoded command. The payload
# fragment spells the Windows mshta executable; no destination is matched.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027,T1218.005

traits:
  - id: node-alphabet-mshta-bootstrap
    desc: Builds character alphabet for encoded command
    crit: notable
    if:
      type: text
      substr: '[゛,べ,ㄌ,パ,ゅ,,ぢ,お,ぼ,そ,,,,モ,,ヒ]="."+{},つ=[],[,バ,ゐ,ビ,ぜ,せ,ゔ,ひ,,,く,ツ,,,フ]=[!!ぢ]+!ぢ+ぢ.ぢ,[,,,,,,,,,ソ,,,,,ネ]=゛[モ+=ㄌ+く+ひ+お+バ+ゐ+ぢ+お+ㄌ+バ]+つ,[,,,,,,,,き,,,,,だ,ゼ,,ヤ,,,,,,,ろ,,,,,,,,,ぷ]=[][ぜ+フ+ゔ+ゔ]+つ,ぅ=[お+ㄌ+ソ+お+バ+フ+く+ネ],[と,,す,,た,,っ,,づ,,ね,,ゃ,,ォ,,う,,し]=[+き,++き,++き,++き,++き,++き,++き,++き,++き,++き]+つ,か=つ[モ][モ],い=か(ビ,バ+ビ+お+ゐ+バ+く+ぼ+ビ+゛+お+ㄌ+ソ+お+バ+フ+く+ネ+だ+っ+ゃ+ゼ),[リ,ほ,こ,ㄑ,ざ]=[い(+[た+ね]),い(+[す+ォ]),い(+[た+た]),い(+[た+と]),い(+[っ+づ])],[ぽ,,ぇ,,,,ヴ,,,,ぞ]=か(バ+ビ+お+ゐ+バ+く+ぼ+ビ+ひ+ぢ+せ+リ+ビ)()((つ+つ)[フ+お+せ+ゔ+フ+ぢ+ひ]()),ば=か(ビ,バ+ビ+お+ゐ+バ+く+ぼ+ソ+お+バ+フ+く+ネ+゛+ぜ+バ+ㄌ+こ+ぇ+ほ+せ+バ+ぇ+ㄌ+ツ+ビ+だ+ビ+ゼ),[ヌ,ㄙ,ク,ヶ,ロ,て,ど,ㄈ,で,ヺ,ト,ㄡ,ㄥ,ダ,ヂ,ヌ,ス,じ]=[ば(+[づ+っ]),ば(+[づ+づ]),ば(+[う+す+し+づ]),ば(+[す+と]),ば(+[す+た+と]),ば(+[ね+し]),ば(+[し+ね]),ば(+[ゃ+す]),ば(+[っ+づ]),ば(+[ォ+ォ]),ば(+[す+す+っ]),ば(+[っ+し]),ば(+[す+す+し]),ば(+[ね+う]),ば(+[う+づ]),ば(+[づ+っ]),ば(+[う+と]),ば(+[う+ォ])],'
  - id: node-alphabet-mshta-command
    desc: Encodes Windows mshta executable
    crit: notable
    if:
      type: text
      substr: 'こ,ひ,ほ,お,せ,゛,ビ,ロ,ビ'
  - id: node-alphabet-mshta-eval
    desc: Evaluates constructed character array
    crit: notable
    if:
      type: text
      substr: 'か(ビ,ビ+ろ+せ+ゔ+だ+ビ+ろ+せ+ゔ+だ+ビ+ゼ+ゼ)(['

composite_rules:
  - id: node-alphabet-mshta-loader
    desc: Stages encoded mshta execution
    crit: hostile
    conf: 0.99
    all:
      - id: node-alphabet-mshta-bootstrap
      - id: node-alphabet-mshta-command
      - id: node-alphabet-mshta-eval
