defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1059.007

traits:
  - id: babel-expression-eval
    desc: Babel visitor evaluates expression source
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: '(?s)Expression\s*\(path\s*\).{0,200}path\.toString\s*\(\s*\).{0,200}eval\s*\(\s*code\s*\)'

  - id: constructor-execsync-id
    desc: Constructor payload invokes id command
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: 'Number\.constructor\s*\([^\n]{0,200}execSync\s*\(\s*["\x27]id["\x27]'

  - id: parse-babel-source
    desc: Script parses Babel source
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: 'babel\.parseSync\s*\(\s*source\s*\)'

  - id: traverse-babel-ast
    desc: Script traverses Babel AST
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: 'babelTraverse\s*\(\s*ast\s*,'

composite_rules:
  - id: babel-constructor-command-proof
    desc: Babel expression evaluation executes embedded command proof
    crit: suspicious
    conf: 0.99
    for: [javascript]
    scope: file
    all:
      - id: babel-expression-eval
      - id: constructor-execsync-id
      - id: parse-babel-source
      - id: traverse-babel-ast

  - id: npm-install-babel-command-proof
    desc: npm install hook runs Babel command execution proof
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar, javascript, package.json]
    scope: archive
    all:
      - id: babel-constructor-command-proof
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
