defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027,T1059.001,T1059.007

# This signature matches a character-alphabet encoding of the command itself,
# not the decoded destination. The alphabet bootstrap fixes the mapping of the
# glyph identifiers; the two fragments cover the headless PowerShell downloader
# and its pipe to iex. Other alphabet mappings need separate decoding support.
traits:
  - id: node-alphabet-command-bootstrap
    desc: Builds coercion-based character alphabet
    crit: notable
    if:
      type: text
      substr: '[ボ,ノ,ば,ギ,む,,ハ,き,ピ,ち,,,,ㄗ,,チ]="."+{},ワ=[],[,ㄒ,ル,か,つ,ヹ,づ,ゾ,,,し,ゕ,,,で]=[!!ハ]+!ハ+ハ.ハ,[,,,,,,,,,ヴ,,,,,ㄓ]=ボ[ㄗ+=ば+し+ゾ+き+ㄒ+ル+ハ+き+ば+ㄒ]+ワ,[,,,,,,,,ィ,,,,,ロ,ょ,,ア,,,,,,,ㄚ,,,,,,,,,ㄫ]=[][つ+で+づ+づ]+ワ,ㄊ=[き+ば+ヴ+き+ㄒ+で+し+ㄓ],[ㄘ,,ㄐ,,ㄤ,,ㄢ,,ユ,,ベ,,る,,ㄉ,,ㄣ,,ね]=[+ィ,++ィ,++ィ,++ィ,++ィ,++ィ,++ィ,++ィ,++ィ,++ィ]+ワ,ㄟ=ワ[ㄗ][ㄗ],ㄙ=ㄟ(か,ㄒ+か+き+ル+ㄒ+し+ピ+か+ボ+き+ば+ヴ+き+ㄒ+で+し+ㄓ+ロ+ㄢ+る+ょ),[い,ブ,ゴ,ㄆ,れ]=[ㄙ(+[ㄤ+ベ]),ㄙ(+[ㄐ+ㄉ]),ㄙ(+[ㄤ+ㄤ]),ㄙ(+[ㄤ+ㄘ]),ㄙ(+[ㄢ+ユ])],[ぶ,,ァ,,,,ゎ,,,,ご]=ㄟ(ㄒ+か+き+ル+ㄒ+し+ピ+か+ゾ+ハ+ヹ+い+か)()((ワ+ワ)[で+き+ヹ+づ+で+ハ+ゾ]()),ド=ㄟ(か,ㄒ+か+き+ル+ㄒ+し+ピ+ヴ+き+ㄒ+で+し+ㄓ+ボ+つ+ㄒ+ば+ゴ+ァ+ブ+ヹ+ㄒ+ァ+ば+ゕ+か+ロ+か+ょ),[ヾ,ェ,が,ヺ,ぞ,ム,ㄥ,゛,ネ,ゖ,ー,ㄪ,ヤ,サ,テ,も,す,ェ,ぅ,ㄞ,ざ,う,ひ,ォ,ザ,ソ,べ,ウ,コ,プ,ヾ,ㄡ]=[ド(+[ユ+ㄢ]),ド(+[ユ+ユ]),ド(+[ㄣ+ㄐ+ね+ユ]),ド(+[ㄐ+ㄘ]),ド(+[ㄐ+ㄤ+ㄘ]),ド(+[ベ+ね]),ド(+[る+ㄐ]),ド(+[ㄢ+ユ]),ド(+[ㄉ+ㄉ]),ド(+[ㄐ+ㄐ+ㄢ]),ド(+[ㄢ+ね]),ド(+[ね+ベ]),ド(+[ㄣ+ㄘ]),ド(+[ㄉ+ㄢ]),ド(+[ㄐ+ㄐ+ね]),ド(+[ベ+ㄣ]),ド(+[る+ㄢ]),ド(+[ユ+ユ]),ド(+[ㄢ+ㄣ]),ド(+[ㄣ+ベ]),ド(+[ㄉ+ㄣ]),ド(+[ㄐ+ㄤ+ユ]),ド(+[ㄉ+ㄤ]),ド(+[ㄉ+ユ]),ド(+[ユ+ベ]),ド(+[ㄣ+ユ]),ド(+[ㄣ+ㄣ]),ド(+[ㄐ+ㄤ+ㄤ]),ド(+[る+ㄤ]),ド(+[ね+ㄤ]),ド(+[ユ+ㄢ]),ド(+[ㄣ+ㄉ])],'
  - id: node-alphabet-headless-iwr
    desc: Encodes headless PowerShell download command
    crit: notable
    if:
      type: text
      substr: 'ハ,ば,し,ブ,ば,ゾ,き,ボ,か,ぞ,か,ピ,ザ,ザ,ブ,か,ヹ,ゕ,づ,か,ゾ,ゾ,ピ,い,ば,テ,か,ㄒ,ゾ,ブ,か,づ,づ,ピ,ザ,ハ,ピ,プ,゛,で,テ,ㄒ,ピ'
  - id: node-alphabet-pipe-iex
    desc: Encodes pipeline into PowerShell evaluation
    crit: notable
    if:
      type: text
      substr: 'ピ,う,ピ,で,か,ぞ,プ,゛'
  - id: node-alphabet-constructed-eval
    desc: Evaluates constructed character array
    crit: notable
    if:
      type: text
      substr: 'ㄟ(か,か+ㄚ+ヹ+づ+ロ+か+ㄚ+ヹ+づ+ロ+か+ょ+ょ)(['

composite_rules:
  - id: node-alphabet-headless-download-flow
    desc: Encodes downloader and evaluation pipeline
    crit: notable
    near_bytes: 500
    all:
      - id: node-alphabet-headless-iwr
      - id: node-alphabet-pipe-iex
  - id: node-alphabet-headless-powershell-loader
    desc: Stages encoded headless PowerShell downloader
    crit: hostile
    conf: 0.99
    all:
      - id: node-alphabet-command-bootstrap
      - id: node-alphabet-headless-download-flow
      - id: node-alphabet-constructed-eval
