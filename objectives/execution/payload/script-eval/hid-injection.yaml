defaults:
  platforms: [windows]
  for: [c, cpp, python, text, powershell]

composite_rules:
  - id: hid-run-remote-script-eval
    desc: HID Run-dialog download-eval injection
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1200
    near_bytes: 512
    all:
      - id: micro-behaviors/hardware/input/keyboard/simulate::run-dialog-shortcut-output
      - id: micro-behaviors/hardware/input/keyboard/simulate::download-eval-command-output
    any:
      - id: micro-behaviors/hardware/input/keyboard/simulate::enter-key-output
      - id: micro-behaviors/hardware/input/keyboard/simulate::self-submitting-download-eval-output
