# PowerShell stagers that carry their own RC4 routine, decrypt an embedded
# Base64 blob and hand the plaintext to a ScriptBlock. The key and ciphertext
# travel together, so the encryption only hides the payload from static
# review. Worked example: Metasploit Rex::Powershell to_mem_rc4 template.
defaults:
  for: [powershell]
  platforms: [windows]
  attack: T1027.013,T1059.001,T1140

composite_rules:
  - id: powershell-rc4-decrypted-scriptblock-loader
    desc: PowerShell RC4-decrypts Base64 and runs it as ScriptBlock
    crit: hostile
    conf: 0.95
    scope: file
    near_lines: 60
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4/transform::powershell-rc4-like-state-xor-loop
      - id: micro-behaviors/data/decode/base64/call::powershell-frombase64string
      - id: micro-behaviors/process/interpreter/eval/constructed::powershell-expression-scriptblock-call
    # An unrendered Ruby template has neither a key nor a payload, so it cannot
    # execute a decoded stage. The capability findings stay visible.
    unless:
      - id: metadata/build/scaffold::ruby-format-payload-placeholder
