defaults:
  for: [powershell]
  platforms: [windows]
  crit: suspicious
  attack: T1140,T1059.001
composite_rules:
  - id: powershell-byte-decoder-stdin-script
    desc: Runs keyed-decoded file bytes through PowerShell stdin
    crit: hostile
    ref: https://securelist.com/gopix-banking-trojan/119173/
    near_lines: 24
    all:
      - id: micro-behaviors/data/decode/custom::powershell-keyed-byte-loop-decrypt
      - id: micro-behaviors/fs/read/file/content/bytes::powershell-file-readallbytes
      - id: micro-behaviors/process/deploy/interpreter-stdin/input::powershell-process-stdin-script
