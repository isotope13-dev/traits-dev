defaults:
  for: [javascript]
  platforms: [unix]
  attack: T1059.007,T1056.002,T1105

traits:
  - id: optimizer-sudo-cli
    desc: Exposes optimizer setup command
    crit: notable
    for: [package.json]
    if:
      type: value
      path: bin.react-state-optimizer
      regex: '^(\./)?scripts/setup[.]js$'
  - id: optimizer-sudo-path
    desc: Is optimizer setup script
    crit: notable
    if:
      type: path
      regex: "(^|[/\\\\])scripts[/\\\\]setup[.]js$"
  - id: optimizer-sudo-prompt
    desc: Requests user sudo password
    crit: notable
    if:
      type: text
      substr: "Password for ${user}:"
  - id: optimizer-sudo-sudo
    desc: Verifies supplied sudo password
    crit: notable
    if:
      type: text
      substr: "spawnSync('sudo', ['-S', '-v', '-k']"
  - id: optimizer-sudo-channel
    desc: Retrieves remote channel page
    crit: notable
    if:
      type: text
      substr: "https://t.me/s/roblox_f847yt83w7it"
  - id: optimizer-sudo-encoded-channel
    desc: Contains encoded channel address
    crit: notable
    if:
      type: text
      substr: "dGk3dzM4dHl0NDhmX3hvbGJvci9zL2VtLnQvLzpzcHR0aA=="
  - id: optimizer-sudo-fetch
    desc: Downloads configured payload
    crit: notable
    if:
      type: text
      substr: "await fetchText(gistUrl)"
  - id: optimizer-sudo-write
    desc: Writes decrypted temporary script
    crit: notable
    if:
      type: text
      substr: "fs.writeFileSync(tempFile, decrypted)"
  - id: optimizer-sudo-launch
    desc: Starts decrypted Node script
    crit: notable
    if:
      type: text
      substr: "spawn(process.execPath, [tempFile]"

composite_rules:
  - id: optimizer-sudo-stage
    desc: Passes sudo password to downloaded decrypted stage
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: optimizer-sudo-path
      - id: optimizer-sudo-prompt
      - id: optimizer-sudo-sudo
      - id: optimizer-sudo-fetch
      - id: micro-behaviors/crypto/cipher/mode::node-aes-gcm-decipher-call
      - id: optimizer-sudo-write
      - id: optimizer-sudo-launch
      - id: objectives/supply-chain/trojanized/package/install-hook::npm-password-forwarded-to-payload
    any:
      - id: optimizer-sudo-channel
      - id: optimizer-sudo-encoded-channel
  - id: npm-optimizer-sudo-stage
    desc: Optimizer CLI passes password to remote stage
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: optimizer-sudo-cli
      - id: optimizer-sudo-stage
