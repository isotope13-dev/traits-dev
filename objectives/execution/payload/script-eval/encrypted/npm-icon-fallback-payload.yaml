defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1027,T1059.007,T1552.001

traits:
  - id: icon-fallback-entry
    desc: Uses icon generator module as entry point
    crit: component
    for: [package.json]
    if:
      type: value
      path: main
      regex: '^(\./)?dist/lib/index[.]js$'
  - id: icon-fallback-missing
    desc: Tests for absent icon input
    crit: component
    if:
      type: text
      substr: "if (!node_fs_1.default.existsSync(src))"
  - id: icon-fallback-default
    desc: Selects bundled default script
    crit: component
    if:
      type: text
      substr: "node_path_1.default.join(__dirname, 'default.js')"
  - id: icon-fallback-spawn
    desc: Starts default script in Node
    crit: component
    if:
      type: text
      substr: "child_process_1.spawn)(process.execPath, [defaults]"
  - id: icon-fallback-detached
    desc: Detaches and silences child
    crit: component
    if:
      type: text
      substr: "detached: true, stdio: ['ignore', 'ignore', 'ignore']"
  - id: icon-fallback-script
    desc: Is bundled default script
    crit: component
    if:
      type: path
      regex: "(^|[/\\\\])default[.]js$"
  - id: icon-fallback-title
    desc: Disguises payload process
    crit: component
    if:
      type: text
      substr: "process.title = \"kworker/sync\""
  - id: icon-fallback-cipher
    desc: Contains encrypted stealer payload
    crit: component
    if:
      type: text
      substr: "cf79e27b525e502ad56db7e3bfa6963f190749bde2a9ce56a447720b06bf607c"
  - id: icon-fallback-algorithm
    desc: Selects AES cipher algorithm
    crit: component
    if:
      type: text
      substr: 'const algorithm = "aes-256-cbc"'
  - id: icon-fallback-decipher-alt
    desc: Decrypts payload with selected algorithm
    crit: component
    if:
      type: text
      substr: "createDecipheriv(algorithm, key, iv)"
  - id: icon-fallback-eval-alt
    desc: Evaluates decrypted payload
    crit: component
    if:
      type: text
      substr: 'eval(Buffer.from(decrypted.toString("utf8")).toString("utf8"))'
  - id: icon-fallback-eval
    desc: Evaluates decrypted payload
    crit: component
    if:
      type: text
      substr: "eval(Buffer.from(parseLib(data)).toString('utf8'))"

composite_rules:
  - id: icon-fallback-start
    desc: Missing icon input starts detached hidden script
    crit: suspicious
    scope: file
    all:
      - id: metadata/package/files/included::javascript-index-basename
      - id: icon-fallback-missing
      - id: icon-fallback-default
      - id: icon-fallback-spawn
      - id: icon-fallback-detached
  - id: icon-fallback-stealer
    desc: Decrypts and executes disguised stealer payload
    crit: suspicious
    scope: file
    all:
      - id: icon-fallback-script
      - id: icon-fallback-title
      - id: icon-fallback-cipher
    any:
      - id: icon-fallback-parselib
      - id: icon-fallback-buffer-decrypt
  - id: icon-fallback-parselib
    desc: Decrypts and evaluates payload
    crit: notable
    scope: file
    all:
      - id: micro-behaviors/crypto/decrypt/initialize::node-aes-256-cbc-decipher-text
      - id: icon-fallback-eval
  - id: icon-fallback-buffer-decrypt
    desc: Decrypts and evaluates buffer payload
    crit: notable
    scope: file
    all:
      - id: icon-fallback-algorithm
      - id: icon-fallback-decipher-alt
      - id: icon-fallback-eval-alt
  - id: npm-icon-fallback-stealer
    desc: Icon generator launches encrypted stealer on missing input
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: icon-fallback-entry
      - id: icon-fallback-start
      - id: icon-fallback-stealer
