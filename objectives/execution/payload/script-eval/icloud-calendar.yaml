defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: icloud-calendar-shell-eval
    desc: Evaluates downloaded calendar content as shell
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1105
    all:
      - id: micro-behaviors/process/deploy/script-eval::published-calendar-eval
      - id: micro-behaviors/communications/http/services/apple::icloud-published-calendar-url
