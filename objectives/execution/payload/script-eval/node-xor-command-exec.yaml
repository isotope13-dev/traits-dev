defaults:
  crit: hostile
  conf: 0.98
  attack: T1059.007,T1027
  platforms: [windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-xor-decoded-command-execution
    desc: Node executes an XOR-decoded command
    all:
      - id: node-xor-command-decoder
      - id: node-child-process-exec-decoded-value

traits:
  - id: node-xor-command-decoder
    desc: Decodes text with a repeating XOR key
    crit: suspicious
    if:
      type: text
      regex: 'sigBuffer\s*\[\s*i\s*\][^\n]{0,180}\^\s*keyBuffer\s*\[\s*i\s*%\s*keyBuffer\.length\s*\]'

  - id: node-child-process-exec-decoded-value
    desc: Executes decoded text through child_process.exec
    crit: notable
    if:
      type: text
      regex: >-
        require\s*\(\s*['"]child_process['"]\s*\)[\s\S]{0,240}exec\s*\(\s*decoded\s*,
