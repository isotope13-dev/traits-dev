# A legacy browser stager rebuilds the responseText property through
# fragments, then applies custom RC4 and Base64 decoders to the returned code.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1105,T1059.007,T1027.013
  mbc: B0032

traits:
  - id: html-rc4-base64-response-stage
    desc: RC4/Base64 decode an obfuscated response
    crit: suspicious
    conf: 0.97
    if:
      type: yara
      source: |
        rule html_rc4_base64_response_stage {
          strings:
            $ksa = /for\(\w+=0;\w+<\w+;\w+\+\+\)\{[^}]{0,300}=\([^;]{1,180}\)%\w+;\w+=\w+\[\w+\];\w+\[\w+\]=\w+\[\w+\];\w+\[\w+\]=\w+/
            $prga = /\w+\+=\w+\[\w+\]\(\w+\[\w+\]\(\w+\)\^\w+\[\(\w+\[\w+\]\+\w+\[\w+\]\)%\w+\]\)/
            $base64 = /\w+=\w+\*64\+\w+\[\w+\]\(\w+\[\w+\]\(\w+\)\)/
            $response = /\(\d+,"r"\+\w+\+\w+\+"n"\+"se"\+"T"\+"ex"\+\w+\)/
          condition:
            all of them
        }

composite_rules:
  - id: html-obfuscated-remote-response-loader
    desc: Executes concealed decoded browser response code
    crit: hostile
    conf: 0.97
    all:
      - id: html-rc4-base64-response-stage
      - id: micro-behaviors/data/control-flow/dispatch::html-computed-property-call-text
      - id: metadata/lang/source/syntax/assignment::adjacent-short-string-assignments
      - id: micro-behaviors/data/control-flow/error-handling::empty-named-catch-text
