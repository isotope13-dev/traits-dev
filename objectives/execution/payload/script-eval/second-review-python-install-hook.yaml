composite_rules:
- platforms:
  - unix
  - windows
  for:
  - python
  attack: T1059.006,T1105
  id: install-hook-remote-response-eval
  desc: Build/install hook with remote code evaluation
  crit: suspicious
  conf: 0.95
  near_bytes: 4096
  all:
  - id: metadata/build/package/recipe/setup-hooks::cmdclass-install-phase-override
  any:
  - id: micro-behaviors/process/deploy/script-eval::python-urllib-response-exec
  - id: micro-behaviors/process/deploy/script-eval::python-get-response-text-exec
  - id: objectives/command-and-control/dropper/script-eval/response-eval/remote-body-exec::exec-get-content
  - id: objectives/command-and-control/dropper/script-eval/response-eval/remote-body-exec::eval-get-text
