# A shell script that decrypts a staged blob with the openssl CLI and executes
# it either through shell stdin or a dynamically selected shell, with command
# names rebuilt from printf escapes, keeps its real payload out of the file.
defaults:
  platforms: [unix]
  for: [shell, scripts]
  attack: T1059.004,T1027,T1140
composite_rules:
  - id: shell-decrypts-stage-and-pipes-to-shell-with-escaped-names
    desc: Shell decrypts a stage and runs it, escaped names
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/crypto/symmetric/decrypt::openssl-cli-aes-stream-decrypt
      - id: micro-behaviors/data/decode/char-code/escape-sequence::shell-printf-octal-substitution-format
    any:
      - id: micro-behaviors/process/create/shell/stdin-feed::variable-text-piped-into-shell-stdin
      - id: micro-behaviors/process/create/shell/spawn::sh-dynamic-command-target
