defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1059.007,T1105
traits:
- id: fetch-json-message-function-require
  desc: Executes fetched JSON message with Node require
  crit: hostile
  conf: 0.99
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /\bfetch\s*\(\s*["']https?:\/\/[^"']+["']/s
          $b0_1 = /\.then\s*\(\s*\w+\s*=>\s*\w+\.json\s*\(\s*\)\s*\)/s
          $b0_2 = /\b(const|let|var)\s+(\w+)\s*=\s*\w+\.message\s*;/s
          $b0_3 = /new\s+Function\s*\(\s*["']require["']\s*,\s*\w+\s*\)\s*\(\s*require\s*\)/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 300 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 300 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 300 and
                    true
                  )
                )
              )
            )
          )
      }
