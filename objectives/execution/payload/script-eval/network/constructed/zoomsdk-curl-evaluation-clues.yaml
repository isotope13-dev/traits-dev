defaults:
  platforms: [windows]
  for: [powershell]
traits: []
composite_rules:
  - id: zoomsdk-curl-evaluation-clues
    desc: ZoomSDK and curl or PowerShell evaluation clues
    crit: suspicious
    conf: 0.96
    all:
      - id: well-known/lib/vendor-sdk/zoom::zoomsdk-text-reference
    needs: 3
    any:
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
      - id: micro-behaviors/process/argument/interpreter::powershell-command-options-text
      - id: micro-behaviors/communications/http/user-agent::user-agent-name-reference
      - id: micro-behaviors/communications/http/curl/command::curl-command-call
      - id: well-known/tool/sysadmin/microsoft-powershell::pwsh-text-token
