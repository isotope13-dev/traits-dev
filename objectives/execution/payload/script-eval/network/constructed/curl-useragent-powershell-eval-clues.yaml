defaults:
  platforms: [windows]
  for: [powershell]
traits: []
composite_rules:
  - id: curl-useragent-powershell-eval-clues
    desc: Curl, user-agent and PowerShell evaluation clues
    crit: suspicious
    conf: 0.94
    all:
      - id: objectives/execution/payload/script-eval/network/constructed::curl-useragent-iex-clues
    any:
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
      - id: micro-behaviors/os/security/defender::defender-exclusion-command
      - id: metadata/file/line::powershell-long-line
