defaults:
  platforms: [windows]
  for: [powershell]
traits: []
composite_rules:
  - id: zoomsdk-iex-network-clues
    desc: ZoomSDK, IEX and network or evaluation clues
    crit: suspicious
    conf: 0.99
    all:
      - id: objectives/execution/payload/script-eval/network/constructed::zoomsdk-iex-http-clues
    any:
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
      - id: micro-behaviors/os/security/defender::defender-exclusion-command
      - id: micro-behaviors/os/security/defender::defender-disable-realtime
      - id: metadata/file/line::powershell-long-line
