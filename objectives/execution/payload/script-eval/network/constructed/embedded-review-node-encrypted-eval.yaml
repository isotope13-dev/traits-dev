defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027.013
  mbc: B0024
composite_rules:
  - id: encrypted-remote-function-loader
    desc: Decrypts a remote endpoint then executes fetched code
    conf: 0.98
    attack: T1027.013, T1105, T1059.007
    near_lines: 40
    all:
      - id: micro-behaviors/crypto/decrypt/initialize::createDecipheriv
      - id: micro-behaviors/communications/http/request/client::node-https-get-dynamic
      - id: micro-behaviors/metaprogramming/generation/function::js-function-constructor-require-parameter
      - id: micro-behaviors/os/module/require::require-function-passed-to-call
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/bundler/runtime::js-webpack-bundle
      - id: well-known/tool/development/runtime/ganache/
