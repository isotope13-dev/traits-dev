defaults:
  platforms: [windows]
  for: [powershell]
traits: []
composite_rules:
  - id: zoomsdk-network-execution-clues
    desc: ZoomSDK and network or evaluation clues
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/execution/payload/script-eval/network/constructed::zoomsdk-curl-evaluation-clues
    any:
      - id: micro-behaviors/os/security/defender::defender-exclusion-command
      - id: micro-behaviors/os/security/defender::defender-disable-realtime
      - id: metadata/file/line::powershell-long-line
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
