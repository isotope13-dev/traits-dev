defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1027.013,T1105,T1059.007
  mbc: B0032
composite_rules:
  - id: obfuscated-url-dynamic-code-construction
    for: [javascript]
    desc: Obfuscated URL and dynamic code construction
    crit: hostile
    conf: 0.95
    near_bytes: 32768
    all:
      - id: metadata/lang/source/naming/declaration::hex-identifier-declarations
      - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
    any:
      # `new Function(body)` where body is a variable -- the accumulated
      # response of the download, never a literal the reviewer can read.
      - id: micro-behaviors/metaprogramming/generation/function::js-new-function-variable-argument
      # `new Function(atob(...))` / `Function(decode(...))` -- the body is the
      # decoder's output.
      - id: micro-behaviors/metaprogramming/generation/function::function-from-decoder-or-buffer
      # `fetch(u).then(r => r.text()).then(eval)` -- the response is piped
      # straight into eval with no intervening handling.
      - id: micro-behaviors/process/interpreter/eval/indirect::js-promise-eval-callback
    unless:
      # A declared, inspectable obfuscation build step is not this pattern.
      - id: metadata/build/minifier::intentional-javascript-obfuscator-build
      - id: metadata/build/minifier::intentional-obfuscator-dist-artifact
      - id: metadata/build/minifier::intentional-obfuscator-release-artifact
