defaults:
  platforms: [windows]
  attack: "T1204.002"
  for: [lnk]
  mbc: B0030

composite_rules:
- id: lnk-powershell-remote-stager
  desc: LNK PowerShell fetches and executes remote script
  crit: hostile
  conf: 0.98
  attack: T1059.001,T1105
  all:
  - id: micro-behaviors/os/env/runtime::lnk-comspec-environment-reference
  - id: micro-behaviors/process/argument/option::lnk-slash-c-switch
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::lnk-irm-alias-argument
  - id: micro-behaviors/process/interpreter/eval/constructed::lnk-powershell-scriptblock-call-operator
- id: lnk-hidden-powershell-remote-stager
  desc: LNK hidden PowerShell fetches and executes script
  crit: hostile
  conf: 0.99
  attack: T1059.001,T1105,T1564.003
  all:
  - id: micro-behaviors/ui/window/state::lnk-powershell-windowstyle-hidden-argument
  - id: micro-behaviors/os/env/runtime::lnk-comspec-environment-reference
  - id: micro-behaviors/process/argument/option::lnk-slash-c-switch
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::lnk-irm-alias-argument
  - id: micro-behaviors/process/interpreter/eval/constructed::lnk-powershell-scriptblock-call-operator
