defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
composite_rules:
- id: node-rsa-function-https-detach-clues
  desc: RSA, function, HTTPS and detached-process clues
  crit: suspicious
  conf: 0.99
  near_bytes: 1600
  all:
  - id: micro-behaviors/process/interpreter/eval/indirect::rsa-verify-near-require-constructor
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/communications/http/response::node-http-get-data-handler
  - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
- id: require-response-function-clues
  desc: Require forwarding and response-function clues
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/os/module/require::require-function-passed-to-call
  any:
  - id: micro-behaviors/process/interpreter/eval/indirect::require-function-near-data-property
  - id: objectives/execution/payload/script-eval/network/constructed::response-data-function-constructor-clues
  unless:
  - id: objectives/supply-chain/trojanized/library/remote-eval::detached-http-response-loader
- id: response-data-function-constructor-clues
  desc: Response-data and Function constructor clues
  crit: suspicious
  conf: 0.98
  near_bytes: 720
  all:
  - id: micro-behaviors/communications/http/client/response-body::response-data-property-assignment
  - id: micro-behaviors/process/interpreter/eval/constructed::js-function-constructor-alias-require-invocation
