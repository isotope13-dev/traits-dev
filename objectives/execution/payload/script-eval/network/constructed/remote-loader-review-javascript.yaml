- id: https-streamed-require-loader
  desc: HTTPS GET contains response-data Function loader
  crit: hostile
  conf: 0.99
  attack: T1059.007,T1105
  mbc: B0009.016
  near_lines: 8
  all:
  - id: micro-behaviors/process/deploy/script-eval/network::function-require-streamed-data
  any:
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/communications/tls/verify/disable::node-https-get-verification-disabled
# The reply of a Node http(s).get call is compiled by the Function constructor
# and the generated function is invoked at once with the caller's `require`,
# so whoever serves the URL runs arbitrary code with full module access.
# Chunk collection style, parameter order and the extra host objects passed
# beside require (process, console) vary between builds.
- id: http-get-reply-require-function-loader
  desc: HTTP GET reply run with Node require
  crit: hostile
  conf: 0.98
  attack: T1059.007,T1105
  mbc: B0009.016
  near_bytes: 512
  all:
  - id: micro-behaviors/process/deploy/script-eval/network::http-get-reply-require-function
  - id: micro-behaviors/process/interpreter/eval/constructed::js-function-constructor-any-args-require-invocation
