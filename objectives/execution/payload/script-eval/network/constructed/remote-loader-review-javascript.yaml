  mbc: B0009.016
  near_lines: 24
  all:
  - id: objectives/anti-static/obfuscation/eval/dynamic::response-data-field-ref
  - id: objectives/anti-static/obfuscation/eval/require::function-constructor-require
  - id: micro-behaviors/os/module/require::require-function-passed-to-call
