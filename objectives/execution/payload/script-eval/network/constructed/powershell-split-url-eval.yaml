defaults:
  platforms: [windows, unix]
  for: [powershell]
  attack: T1059.001,T1027

traits:
  - id: powershell-multi-var-concat
    desc: Concatenates three or more PowerShell variables
    crit: notable
    conf: 0.88
    if:
      type: text
      exclude_comments: true
      regex: '\$[A-Za-z0-9_]+\s*=\s*\$[A-Za-z0-9_]+\s*\+\s*\$[A-Za-z0-9_]+\s*\+'

composite_rules:
  - id: powershell-split-variable-url-web-eval
    desc: Reconstructs split-variable URL and evaluates web response
    crit: hostile
    conf: 0.98
    near_lines: 12
    all:
      - id: powershell-multi-var-concat
      - id: objectives/execution/payload/script-eval/network/in-process::powershell-webresponse-variable-eval
