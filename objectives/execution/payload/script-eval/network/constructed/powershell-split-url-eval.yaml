defaults:
  platforms: [windows, unix]
  for: [powershell]
  attack: T1059.001,T1027

composite_rules:
  - id: powershell-split-variable-url-web-eval
    desc: Reconstructs split-variable URL and evaluates web response
    crit: hostile
    conf: 0.98
    near_lines: 12
    all:
      - id: micro-behaviors/data/string/assembly::powershell-multi-var-concat
      - id: objectives/execution/payload/script-eval/network/in-process::powershell-webresponse-variable-eval
