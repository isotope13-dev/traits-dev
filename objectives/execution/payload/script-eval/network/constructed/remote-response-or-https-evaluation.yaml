defaults:
  platforms: [windows, unix]
  for: [javascript, python, shell]

composite_rules:
- id: remote-response-or-https-evaluation
  desc: Remote response or HTTPS evaluation clues
  crit: suspicious
  conf: 0.9
  for:
    - javascript
    - typescript
    - python
  any:
    - id:
        objectives/execution/payload/script-eval/network/decoded::checked-json-message-base64-exec
    - id: objectives/execution/payload/script-eval/network/in-process::fetch-atob-json-eval-loader
    - id:
        objectives/execution/payload/script-eval/network/constructed::node-https-evaluation-clues
