defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1195.002,T1059.007,T1105

traits:
  - id: fetch-base64-url
    desc: Script fetches base64 encoded HTTPS URL
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'fetch\s*\(\s*atob\s*\(["\x27]aHR0cHM6[A-Za-z0-9+/=]{8,300}["\x27]\)'

  - id: fetched-text-to-function
    desc: Script compiles fetched CommonJS source
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?s)res\.text\(\).{0,200}new Function\(["\x27]module["\x27],\s*["\x27]exports["\x27]'

  - id: invoke-fetched-commonjs-module
    desc: Script invokes compiled CommonJS module
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'func\(module,\s*module\.exports,\s*require\)'

  - id: invoke-loaded-export
    desc: Script invokes loaded module export
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?s)await loadModule\(\).{0,40}\bget\(\)'

composite_rules:
  - id: node-encoded-url-commonjs-module-loader
    desc: Script loads and invokes remote CommonJS from encoded URL
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: fetch-base64-url
      - id: fetched-text-to-function
      - id: invoke-fetched-commonjs-module
      - id: invoke-loaded-export
