defaults:
  platforms: [windows]
  for: [powershell]
traits: []
composite_rules:
  - id: zoomsdk-iex-http-clues
    desc: ZoomSDK, IEX and HTTP-related references
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
      - id: well-known/lib/vendor-sdk/zoom::zoomsdk-text-reference
    needs: 1
    any:
      - id: micro-behaviors/communications/http/client/library::iwr-name
      - id: micro-behaviors/data/property/access::powershell-parenthesized-content-member
      - id: micro-behaviors/communications/http/user-agent::powershell-useragent-token
