defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1105,T1059.007,T1082
  mbc: B0030
composite_rules:
  - id: host-profile-post-function-constructor
    desc: Function constructor and host-profile POST
    crit: hostile
    conf: 0.95
    near_bytes: 8192
    all:
      - id: micro-behaviors/metaprogramming/generation/function::js-new-function-constructor
      - id: micro-behaviors/os/sysinfo/profile::node-host-query-set
    any:
      - id: micro-behaviors/communications/http/request/json::http-post-json
      - id: micro-behaviors/communications/http/post::node-http-request-post
