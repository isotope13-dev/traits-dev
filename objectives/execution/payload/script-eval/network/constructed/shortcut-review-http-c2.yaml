defaults:
  platforms:
  - windows
  for:
  - lnk
  attack: T1071.001
  mbc: B0030

composite_rules:
  - id: lnk-powershell-download-scriptblock-exec
    desc: Hidden shortcut runs a ScriptBlock over downloaded content
    crit: hostile
    conf: 0.96
    attack: T1059.001,T1105,T1204.002
    all:
      - id: micro-behaviors/ui/window/state::minimized-interpreter-window
      - id: micro-behaviors/metaprogramming/generation/function::lnk-powershell-scriptblock-constructor
      - id: micro-behaviors/communications/http/client/reference::lnk-string-fetch-references
    any:
      - id: micro-behaviors/communications/url/scheme::lnk-https-scheme-argument
      - id: micro-behaviors/communications/url/scheme::lnk-http-scheme-argument
