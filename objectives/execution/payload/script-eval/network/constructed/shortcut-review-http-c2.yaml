defaults:
  platforms:
  - windows
  for:
  - lnk
  attack: T1071.001
  mbc: B0030

composite_rules:
  - id: lnk-powershell-download-scriptblock-exec
    desc: Concealed PowerShell shortcut fetches content and invokes a ScriptBlock
    crit: hostile
    conf: 0.96
    attack: T1059.001,T1105,T1204.002
    # Co-occurrence establishes the loader profile, not response-to-eval flow.
    # Construction alone also occurs in script inspection tools; require the
    # call operator. Concealment may come from the header or launch arguments.
    all:
      - id: micro-behaviors/process/config/target::lnk-interpreter-target-with-arguments
      - id: micro-behaviors/process/interpreter/eval/constructed::lnk-powershell-scriptblock-call-operator
      - id: micro-behaviors/communications/http/client/reference::lnk-string-fetch-references
      - id: micro-behaviors/communications/url/scheme::lnk-web-scheme-argument
    any:
      - id: micro-behaviors/ui/window/state::lnk-minimized-inactive-window
      - id: micro-behaviors/ui/window/state::lnk-hidden-window
      - id: micro-behaviors/ui/window/state::lnk-hidden-window-flag
