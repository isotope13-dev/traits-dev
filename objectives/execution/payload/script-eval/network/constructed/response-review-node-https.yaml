defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
  crit: hostile
composite_rules:
  - id: node-https-evaluation-clues
    desc: Node HTTPS request and variable evaluation clues
    conf: 0.96
    attack: T1059.007
    mbc: E1105.016
    all:
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/metaprogramming/generation/function::embedded-eval-variable-source
    any:
      - id: metadata/lang/source/syntax/call/relationship::end-handler-eval-pattern
      - id: micro-behaviors/communications/http/request/body/construction::request-write-call
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::os-platform-call
    unless:
      - id: metadata/path/directory::test-directory-component
    crit: suspicious
