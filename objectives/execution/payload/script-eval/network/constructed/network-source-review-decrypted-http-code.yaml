# Explicit transfers keep ciphertext (argument 2) separate from a remotely
# fetched key/IV (arguments 0/1). A fetch anywhere beside eval is insufficient.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.98
  attack: T1059.007

composite_rules:
- id: fetch-json-result-function-exec
  desc: Executes a function derived from fetched JSON
  crit: suspicious
  conf: 0.92
  near_bytes: 100
  all:
  - id: micro-behaviors/communications/http/client/exchange::fetch-json-promise-chain
  - id: micro-behaviors/process/interpreter/eval/constructed::indirect-function-result-invocation

