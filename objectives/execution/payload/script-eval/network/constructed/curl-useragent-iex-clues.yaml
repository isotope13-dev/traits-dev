defaults:
  platforms: [windows]
  for: [powershell]
traits: []
composite_rules:
  - id: curl-useragent-iex-clues
    desc: Curl, user-agent and PowerShell IEX references
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
      - id: micro-behaviors/communications/http/user-agent::user-agent-name-reference
      - id: micro-behaviors/communications/http/curl/command::curl-command-call
    near_lines: 3

# Loading bytes with AppDomain.Load and invoking their entry point keeps the
# downloaded managed stage in memory instead of creating a file on disk.
