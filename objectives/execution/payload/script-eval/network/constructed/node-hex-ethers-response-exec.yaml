defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1059.007,T1027,T1105
traits:
- id: node-remote-async-function-exec
  desc: Executes remote message as async function
  crit: suspicious
  if:
    type: text
    substr: new Function("return (async () => {".concat(methodData, "})();"))()
composite_rules:
- id: node-hex-ethers-remote-async-loader
  desc: Fetches and executes encoded remote JavaScript
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/lang/encoding/hex::node-hex-ethers-endpoint-literal
  - id: micro-behaviors/communications/http/request/client::axios-client-reference
  - id: micro-behaviors/data/decode/hex::buffer-from-hex-to-utf8
  - id: micro-behaviors/data/decode/base64/unspecified::json-message-base64-decode
  - id: node-remote-async-function-exec
