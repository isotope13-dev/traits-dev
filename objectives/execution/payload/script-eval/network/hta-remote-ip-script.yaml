# An .hta runs under mshta with full local privileges (ActiveX, WScript,
# file system), not in the browser sandbox. A remote <script src> in that
# file whose host is an IP literal or IP-named hosting address pulls
# attacker JavaScript into that privileged context on open.
defaults:
  for: [html]
  platforms: [windows]
  attack: T1218.005,T1105

composite_rules:
  - id: hta-loads-remote-ip-host-script
    desc: HTA loads script from IP-addressed remote host
    crit: hostile
    conf: 0.94
    near_bytes: 400
    all:
      - id: metadata/file/extension/identity::hta-html-application-extension
      - id: micro-behaviors/communications/http/client/resource::remote-script-element-source
      - id: micro-behaviors/communications/ip/literal::http-ip-url-filtered-text
