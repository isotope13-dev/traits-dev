# Hacked-CMS injection (`__cfgoid` family): an inline script checks for its
# own cookie, sets it, and only on that first visit document.writes a
# <script> whose src is a jQuery-named PHP endpoint on another host. The
# cookie gate keeps repeat visitors and admins from seeing the payload; the
# written script then runs whatever that server returns in the page.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189,T1059.007

composite_rules:
  - id: cookie-gated-fake-jquery-script-write
    desc: Cookie gate writes script from fake jQuery PHP URL
    crit: hostile
    conf: 0.95
    near_bytes: 2000
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/lib-mimic::jquery-named-php-url
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
      - id: micro-behaviors/communications/http/cookie-store::document-cookie-write
      - id: micro-behaviors/communications/http/cookie-store::cookie-helper-get-function
