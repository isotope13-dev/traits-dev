# Remote PowerShell response piped to an Invoke-Expression alias assembled at
# runtime (&('i'+'e'+'x')), as in later LenAI ClickFix builds. Splitting the
# alias hides the literal "iex" from command-line and AMSI string checks.
defaults:
  platforms: [windows]
  for: [powershell, batch, html, javascript, text]
  attack: T1059.001,T1027,T1105
traits:
  - id: concatenated-iex-invocation
    desc: Invoke-Expression alias built from fragments
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '&\s*\(\s*["'']i(e)?["'']\s*\+\s*["''](e["'']\s*\+\s*["''])?(x|ex)["'']\s*\)'
  - id: pipe-to-concatenated-command-name
    desc: Pipeline into call operator with built name
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '\|\s*&\s*\(\s*["''](i|ie)["'']\s*\+\s*["''](e|x|ex)["'']\s*(\+|\))'
composite_rules:
  - id: webrequest-piped-to-concatenated-iex
    desc: PowerShell download piped to built iex alias
    crit: hostile
    conf: 0.95
    near_bytes: 600
    all:
      - id: concatenated-iex-invocation
      - id: pipe-to-concatenated-command-name
    any:
      - id: micro-behaviors/communications/http/client/library::irm-alias
      - id: micro-behaviors/communications/http/client/library::irm-name
      - id: micro-behaviors/communications/http/client/library::iwr-name
