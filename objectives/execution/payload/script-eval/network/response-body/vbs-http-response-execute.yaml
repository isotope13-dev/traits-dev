# A VBScript that creates an MSXML/WinHTTP client, keeps the response body,
# and runs an Execute/ExecuteGlobal statement within the same short span. The
# body of an HTTP reply is code chosen by whoever controls the server; no
# configuration or update script needs to evaluate it as VBScript. The
# statement form is required (validated VBScript Execute line), so a dotted
# `.Execute` method or prose about Execute does not match.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1059.005,T1105

composite_rules:
  - id: vbs-http-response-execute
    desc: VBScript executes an HTTP response body
    crit: hostile
    conf: 0.95
    near_bytes: 1600
    all:
      - id: micro-behaviors/communications/http/client/reference::http-client-com-class-reference
      - id: micro-behaviors/process/interpreter/eval/direct::validated-vbs-execute-statement
    any:
      - id: micro-behaviors/communications/http/client/response-body::vbs-response-text-assignment
      - id: micro-behaviors/process/deploy/script-eval/input::vbs-execute-response-text-direct
