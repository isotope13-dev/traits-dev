defaults:
  platforms: [windows]
  for: [class, java]
composite_rules:
  - id: java-powershell-remote-eval-command
    desc: Java PowerShell remote-eval command references
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
    any:
      - id: objectives/execution/payload/script-eval/network/response-body::embedded-irm-iex-pipeline
      - id: objectives/execution/payload/script-eval/network/response-body::embedded-iex-irm-call
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::embedded-powershell-irm-iex-command
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::embedded-iwr-pipe-iex
