# Python that executes the body of an HTTP GET response at module scope
# hands control of the process to whoever serves that URL as soon as the
# file is imported or run. The flow-backed atom already ties the `exec`
# argument to the response value; requiring module-scope execution
# beside it keeps the claim to install-time style loaders rather than
# library helpers that only run remote code when called. Hosts, headers
# and whether the body passes through `compile` first are not legs.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059.006,T1105
  mbc: B0009.016

composite_rules:
  - id: python-http-response-exec-loader
    desc: Python executes HTTP response body as code
    crit: hostile
    conf: 0.97
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/deploy/script-eval/network::python-get-response-text-exec
      - id: micro-behaviors/process/interpreter/eval/python-builtins::module-scope-exec-builtin
    any:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/process/interpreter/eval/constructed::python-requests-fetch-compile-exec-cooccurrence
    unless:
      - id: metadata/package/testing/presence/harness::verified-python-test-file
      # Documentation examples fetch from reserved special-use TLDs; a
      # function-scoped remote-run helper also stays out because it has no
      # module-scope exec.
      - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url
