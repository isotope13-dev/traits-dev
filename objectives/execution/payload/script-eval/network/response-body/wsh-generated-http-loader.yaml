# A script writes out (WriteLine/echo) a second-stage VBScript whose lines
# create an MSXML HTTP object and run the response body with ExecuteGlobal:
# the generated file is a throwaway loader for remote code.
defaults:
  platforms: [windows]
  for: [vbs, html, batch]
  attack: T1059.005,T1105

composite_rules:
  - id: generated-loader-executes-http-response
    desc: Writes a loader that executes HTTP responses
    crit: hostile
    conf: 0.95
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/deploy/script-eval/input::generated-executeglobal-response-text
      - id: micro-behaviors/communications/http/client/xmlhttp::msxml-xmlhttp-progid-text
