# A PowerShell stager that requests a payload from a hard-coded IP address and
# evaluates the response body: `$uri = "http://<ip>:<port>/<id>"` followed by
# `Invoke-WebRequest -Uri $uri` and `Invoke-Expression $response.Content`. A
# raw-IP origin has no domain to take down or vet, and the response is run
# without being written to disk. Documentation hosts and loopback addresses
# are excluded by the IP literal rule itself.
defaults:
  platforms: [windows, unix]
  for: [powershell]
  attack: T1059.001,T1105

composite_rules:
  - id: powershell-raw-ip-fetch-evaluates-response
    desc: PowerShell fetches from a raw IP and evaluates the response
    crit: hostile
    conf: 0.95
    near_lines: 8
    all:
      - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-eval-response-content-member
