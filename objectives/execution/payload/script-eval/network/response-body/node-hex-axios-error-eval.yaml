defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1059.007,T1027,T1105
traits:
- id: node-eval-axios-error-response
  desc: Evaluates HTTP error response body
  crit: suspicious
  if:
    type: text
    substr: eval(err.response.data || "404")
- id: node-constructor-trigger-error-report
  desc: Triggers error report during construction
  crit: notable
  if:
    type: text
    substr: this.reportErr("")
composite_rules:
- id: node-hex-axios-error-response-loader
  desc: Evaluates response from concealed HTTP endpoint
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/lang/encoding/hex::node-hex-moralis-endpoint-literal
  - id: metadata/import/package::axios-module-hex-lookup
  - id: node-eval-axios-error-response
  - id: node-constructor-trigger-error-report
