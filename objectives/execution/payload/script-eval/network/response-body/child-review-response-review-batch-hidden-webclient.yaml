defaults:
  attack: "T1027, T1059.001, T1105"
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: batch-webclient-iex-plain-ip
    desc: Batch WebClient eval with public IP context
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-eval-followon
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-flag
      - id: micro-behaviors/communications/ip/literal::batch-public-ip-literal
  - id: batch-webclient-iex-plain-download
    desc: Batch WebClient eval with cleartext download
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-eval-followon
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-flag
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::downloadstring-cleartext-http-url
  - id: batch-hidden-policy-bypass-webclient-iex
    desc: Batch runs a hidden policy-bypassed PowerShell web response
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1105,T1564.003
    all:
      - id: metadata/file/extension/executable::bat
    any:
      - id: objectives/execution/payload/script-eval/network/response-body::batch-webclient-iex-plain-ip
      - id: objectives/execution/payload/script-eval/network/response-body::batch-webclient-iex-plain-download
    needs: 1
