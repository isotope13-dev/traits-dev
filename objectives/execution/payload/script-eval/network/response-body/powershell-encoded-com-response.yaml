defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: sent-com-response-eval
    desc: Sends COM request and evaluates its response
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?im)\.Send\(\s*\)[;\s]+(iex|Invoke-Expression)\s*\(?\s*\$\w+\.responseText\b'

composite_rules:
  - id: encoded-clsid-com-response-eval
    desc: Encoded HTTP COM loader evaluates the remote response
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.001,T1105
    all:
      - id: micro-behaviors/communications/http/client/xmlhttp::clsid-xmlhttp-b64-unicode
      - id: micro-behaviors/communications/url/encoded::encoded-http-url
      - id: micro-behaviors/os/com/instantiation::get-type-from-clsid
      - id: sent-com-response-eval
    near_bytes: 1024
