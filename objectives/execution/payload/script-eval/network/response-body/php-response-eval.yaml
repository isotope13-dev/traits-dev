# PHP loader that evaluates code fetched over HTTP. The fetch, the decode of
# the response, and the eval of an assembled source string sit together in
# one file. Each atom alone is common in PHP (cURL clients, JSON parsing, and
# eval of literal templates occur in libraries), so the hostile claim needs
# the eval of an expression with a network request beside it.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1105

composite_rules:
  - id: php-http-response-eval
    desc: PHP evaluates source built near an HTTP response fetch
    crit: hostile
    conf: 0.95
    near_lines: 120
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::eval-expression-argument
      - id: micro-behaviors/communications/http/curl/binding::php-curl-request
    any:
      - id: micro-behaviors/data/parse/json::php-json-decode
      - id: micro-behaviors/data/decode/base64/call::php-base64-decode-call
