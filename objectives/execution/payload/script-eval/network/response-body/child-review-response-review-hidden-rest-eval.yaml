defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: batch-concealed-rest-response-eval
    desc: Concealed batch evaluates downloaded PowerShell
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/payload/script-eval/network/response-body::embedded-iex-irm-call
      - id: metadata/lang/source/syntax/expansion::batch-percent-substring-slicing
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-window
