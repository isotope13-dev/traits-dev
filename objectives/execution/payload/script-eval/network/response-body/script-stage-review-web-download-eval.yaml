defaults:
  crit: notable
  platforms:
    - unix
  for:
    - shell
traits:
  - id: powershell-webrequest-iex-command-literal
    desc: Command literal pipes PowerShell download to IEX
    crit: notable
    conf: 0.92
    for:
      - scripts,-powershell,-batch,-shell,-python
    if:
      type: literal
      regex: (?i)(iwr|irm|Invoke-(WebRequest|RestMethod))\b.{0,160}\\?\|\s*(iex|Invoke-Expression)\b
      exclude_docstrings: true
  - id: powershell-webrequest-iex-script-text
    desc: Script text contains download-to-IEX pipeline
    crit: notable
    conf: 0.92
    for:
      - powershell
      - batch
      - shell
    if:
      type: text
      regex: (?i)(iwr|irm|Invoke-(WebRequest|RestMethod))\b.{0,160}\\?\|\s*(iex|Invoke-Expression)\b
    platforms:
      - windows
      - unix
  - id: powershell-webrequest-iex-document-text
    desc: Document text contains download-to-IEX pipeline
    crit: notable
    conf: 0.92
    for:
      - markdown
      - html
    if:
      type: text
      regex: (?i)(iwr|irm|Invoke-(WebRequest|RestMethod))\b.{0,160}\\?\|\s*(iex|Invoke-Expression)\b
      exclude_html_comments: true
  - id: powershell-downloadstring-iex-inline
    desc: PowerShell evaluator near DownloadString call
    crit: notable
    conf: 0.92
    for:
      - scripts
      - source
      - markdown
      - html
      - text
      - data
    if:
      type: text
      regex: (?i)(iex|Invoke-Expression)[^\r\n]{0,40}DownloadString\s*\(
  - id: powershell-downloadstring-scriptblock-invoke
    desc: ScriptBlock::Create evaluates DownloadString
    crit: suspicious
    conf: 0.96
    platforms:
      - windows
      - unix
    for:
      - powershell
      - ruby
    if:
      type: text
      regex: (?i)\[scriptblock\]\s*::\s*create\s*\([^\r\n]{0,60}\.DownloadString\s*\(
    downgrade:
      scope: file-or-parent
      any:
        - id: well-known/app/infrastructure/ansible::ansible-community-sdist-context
        - id: well-known/app/infrastructure/ansible::ansible-remoting-bootstrap-script-url
composite_rules:
  - id: powershell-webrequest-to-iex-pipeline
    desc: PowerShell download-to-IEX command text
    crit: notable
    conf: 0.92
    platforms:
      - windows
      - unix
    for:
      - scripts
      - source
      - markdown
      - html
    any:
      - id: objectives/execution/payload/script-eval/network/response-body::powershell-webrequest-iex-command-literal
      - id: objectives/execution/payload/script-eval/network/response-body::powershell-webrequest-iex-document-text
      - id: objectives/execution/payload/script-eval/network/response-body::powershell-webrequest-iex-script-text
