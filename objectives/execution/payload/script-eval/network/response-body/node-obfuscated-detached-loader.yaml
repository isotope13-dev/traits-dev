defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1195.002,T1059.007,T1105

traits:
  - id: js-loader-staged-dependencies
    desc: Stages database and machine-ID modules
    crit: notable
    if:
      type: text
      regex: "'axios'.{0,40}'better-sqlite3'.{0,40}'node-machine-id'.{0,40}'socket.io-client'"
  - id: js-loader-detached-hidden-options
    desc: Configures hidden detached child
    crit: notable
    if:
      type: text
      substr: "'windowsHide':!![],'shell':![],'detached':!![]"
  - id: js-loader-embedded-stage-fragment
    desc: Embeds encoded second-stage decoder
    crit: notable
    if:
      type: text
      regex: "ndi5.{0,30}fRyG"
  - id: js-loader-outer-rotation-key
    desc: Rotates loader string table
    crit: notable
    if:
      type: text
      substr: '0x49640'

composite_rules:
  - id: node-encoded-staged-download-exec
    desc: Stages and launches encoded remote loader
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: js-loader-staged-dependencies
      - id: js-loader-detached-hidden-options
      - id: micro-behaviors/data/encoding/base64::lower-first-base64-alphabet
      - id: js-loader-embedded-stage-fragment
      - id: js-loader-outer-rotation-key
