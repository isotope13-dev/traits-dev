defaults:
  platforms: [windows, unix]
  for: [powershell]
  attack: T1059.001,T1105

composite_rules:
  - id: powershell-iwr-ps1-url-eval
    desc: PowerShell fetches remote .ps1 via iwr and evaluates it with iex
    crit: notable
    conf: 0.90
    near_lines: 25
    all:
      - id: micro-behaviors/communications/url/
      - id: micro-behaviors/communications/http/
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
