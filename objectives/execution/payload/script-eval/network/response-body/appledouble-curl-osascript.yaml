defaults:
  platforms: [macos]
  for: [cpio]
  attack: T1027,T1059.002,T1105
traits:
  - id: apple-sidecar-remote-shell-fetch
    desc: Archive carries shell HTTP command substitution
    crit: suspicious
    conf: 0.96
    if:
      type: raw
      regex: 'shell=\$\(curl\s+[^\n]{0,100}https?://'
  - id: apple-sidecar-shell-execution
    desc: Archive carries AppleScript shell execution
    crit: suspicious
    conf: 0.96
    if:
      type: raw
      regex: 'osascript\s+-e\s+"do shell script \$shell"'
  - id: apple-sidecar-error-dialog
    desc: Archive carries compatibility error dialog
    crit: notable
    conf: 0.9
    if:
      type: raw
      regex: 'display\s+dialog\s+"This app does not support this version\."'
composite_rules:
  - id: apple-sidecar-misleading-dialog-remote-exec
    desc: Apple archive hides remote execution behind error
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 1024
    all:
      - id: apple-sidecar-remote-shell-fetch
      - id: apple-sidecar-shell-execution
      - id: apple-sidecar-error-dialog
