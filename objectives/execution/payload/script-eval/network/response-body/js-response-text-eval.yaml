# JavaScript/TypeScript that evaluates an HTTP response body at module
# scope executes remote code immediately when imported or run.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1059.007,T1105
  mbc: B0009.016

composite_rules:
  - id: js-module-http-response-eval-loader
    desc: JavaScript module evaluates HTTP response text
    crit: hostile
    conf: 0.97
    near_bytes: 512
    all:
      - id: micro-behaviors/process/deploy/script-eval/network::js-module-response-text-eval-flow
      - id: micro-behaviors/communications/http/client/response-body::remote-response-body-read
    unless:
      - id: metadata/filename/testing::js-test-or-spec-basename
      - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url

  - id: js-env-decoded-http-response-eval-stager
    desc: Decoded env var URL fetched and evaluated
    crit: hostile
    conf: 0.98
    mbc: B0024
    near_bytes: 512
    all:
      - id: micro-behaviors/data/decode/base64/structured::atob-process-env-value
      - id: micro-behaviors/communications/http/client/response-body::remote-response-body-read
      - id: micro-behaviors/process/deploy/script-eval/network::js-response-text-eval-flow
    unless:
      - id: metadata/filename/testing::js-test-or-spec-basename
      - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url

  - id: js-fetch-response-eval-callback
    desc: JavaScript passes HTTP response body to eval callback
    crit: hostile
    conf: 0.96
    near_bytes: 128
    all:
      - id: micro-behaviors/communications/http/client/response-body::remote-response-body-read
      - id: micro-behaviors/process/interpreter/eval/indirect::js-promise-eval-callback
    unless:
      - id: metadata/filename/testing::js-test-or-spec-basename
      - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url
