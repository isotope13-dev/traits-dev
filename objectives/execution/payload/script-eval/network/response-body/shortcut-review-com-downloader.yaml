defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1105
  mbc: B0030

traits:
  - id: lnk-arg-invokes-http-response-text
    desc: LNK PowerShell invokes an HTTP responseText body
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b[A-Za-z_]\w*\.send\(\)\s*;\s*&\s*\$[A-Za-z_]\w*\s+\$[A-Za-z_]\w*\.responseText\b'

composite_rules:
  - id: lnk-com-response-invocation-downloader
    desc: LNK invokes a synchronously downloaded HTTP response as PowerShell
    crit: hostile
    conf: 0.97
    attack: T1059.001,T1105
    all:
      - id: micro-behaviors/communications/http/client/reference::lnk-serverxmlhttp-reference
      - id: objectives/execution/payload/script-eval/network/response-body::lnk-arg-invokes-http-response-text
