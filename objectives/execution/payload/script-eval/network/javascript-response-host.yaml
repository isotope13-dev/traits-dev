# Match the same host-to-request relationship under the JS and TS parse trees.
# The JS grammar ambiguously parses `await (await fetch(...)).text()` as an
# await-named call; require that exact identifier in that representation.
# Adjacent declarations and capture equality reject overwritten/unrelated hosts.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  conf: 0.98
  attack: T1102.001
traits:
  - id: js-indirected-http-response-eval
    desc: Dead-drop hostname directs HTTP code evaluation
    crit: suspicious
    attack: T1102.001,T1059.007
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration . (variable_declarator name: (identifier) @host value: (await_expression (call_expression function: (member_expression object: (parenthesized_expression (await_expression (call_expression function: (identifier) @fetch1 arguments: (arguments (_))))) property: (property_identifier) @text1) arguments: (arguments)))) .)
          . (lexical_declaration . (variable_declarator name: (identifier) @code value: (await_expression (call_expression function: (member_expression object: (parenthesized_expression (await_expression (call_expression function: (identifier) @fetch2 arguments: (arguments [
                    (template_string . (string_fragment) @scheme . (template_substitution (identifier) @used_host) . (string_fragment))
                    (binary_expression left: (binary_expression left: (string (string_fragment) @scheme) operator: "+" right: (identifier) @used_host) operator: "+" right: (string))
                    (binary_expression left: (string (string_fragment) @scheme) operator: "+" right: (identifier) @used_host)
                  ])))) property: (property_identifier) @text2) arguments: (arguments)))) .) . (expression_statement (call_expression function: (identifier) @eval arguments: (arguments . (identifier) @executed .))))
          (#eq? @fetch1 "fetch")
          (#eq? @fetch2 "fetch")
          (#eq? @text1 "text")
          (#eq? @text2 "text")
          (#eq? @host @used_host)
          (#match? @scheme "^https?://$")
          (#eq? @eval "eval")
          (#eq? @code @executed))
        ((statement_block
          (lexical_declaration . (variable_declarator name: (identifier) @host value: (call_expression function: (member_expression object: (call_expression function: (identifier) @await1 arguments: (arguments (await_expression (call_expression function: (identifier) @fetch1 arguments: (arguments (_)))))) property: (property_identifier) @text1) arguments: (arguments))) .)
          . (lexical_declaration . (variable_declarator name: (identifier) @code value: (call_expression function: (member_expression object: (call_expression function: (identifier) @await2 arguments: (arguments (await_expression (call_expression function: (identifier) @fetch2 arguments: (arguments [
                    (template_string . (string_fragment) @scheme . (template_substitution (identifier) @used_host) . (string_fragment))
                    (binary_expression left: (binary_expression left: (string (string_fragment) @scheme) operator: "+" right: (identifier) @used_host) operator: "+" right: (string))
                    (binary_expression left: (string (string_fragment) @scheme) operator: "+" right: (identifier) @used_host)
                  ]))))) property: (property_identifier) @text2) arguments: (arguments))) .) . (expression_statement (call_expression function: (identifier) @eval arguments: (arguments . (identifier) @executed .))))
          (#eq? @fetch1 "fetch")
          (#eq? @fetch2 "fetch")
          (#eq? @text1 "text")
          (#eq? @text2 "text")
          (#eq? @host @used_host)
          (#match? @scheme "^https?://$")
          (#eq? @await1 "await")
          (#eq? @await2 "await")
          (#eq? @eval "eval")
          (#eq? @code @executed))
    unless:
      - id: metadata/lang/source/origin::plain-source-layer-path

composite_rules:
  # The bound atom establishes the two-hop acquisition-to-eval chain. Keep
  # the existing interpreter sink requirement when relocating the stager.
  - id: js-deaddrop-http-eval-stager
    desc: Dead-drop HTTP body is evaluated
    crit: hostile
    conf: 0.98
    attack: T1102.001,T1059.007
    near_lines: 8
    all:
      - id: js-indirected-http-response-eval
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
    unless:
      - id: metadata/lang/source/origin::plain-source-layer-path

