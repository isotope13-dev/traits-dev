defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1105,T1059.007

composite_rules:
  - id: numeric-stack-node-remote-task
    desc: Obfuscated network task runner compiles code with Node host access
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/string/numeric::js-numeric-stack-string-decoder
      - id: nearby-fetch-node-code
  - id: nearby-fetch-node-code
    desc: Fetches network data beside Node code compilation and invocation
    crit: notable
    near_lines: 25
    all:
      - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
      - id: micro-behaviors/process/interpreter/eval/node-context::js-generated-function-node-host-context
