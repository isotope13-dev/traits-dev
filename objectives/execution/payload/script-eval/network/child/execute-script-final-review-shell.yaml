defaults:
  attack: T1105
  mbc: B0024
  platforms:
    - unix
    - windows
  for:
    - shell

composite_rules:
  - id: shell-ip-fetch-command-substitution
    # These observations may be quoted or unrelated; they do not bind the
    # URL to the fetch command or establish that the command is executed.
    desc: Shell fetch command text and external IP URL
    crit: notable
    conf: 0.98
    attack: T1105,T1059.004
    all:
      - id: micro-behaviors/process/create/shell/command-mode::shell-c-command-substitution-fetch
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
    unless:
      - id: well-known/tool/detection/cordon-scanner::cordon-defensive-scanner-context
