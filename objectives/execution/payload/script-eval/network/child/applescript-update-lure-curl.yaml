defaults:
  platforms: [macos]
  for: [applescript]
traits:
  - id: applescript-curl-shell-output-assignment
    desc: AppleScript assigns shell curl output
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'set [A-Za-z_][A-Za-z0-9_]* to do shell script "curl\b'
composite_rules:
  # The individual facts do not independently bind the same variable.
  - id: meeting-update-curl-output-script-eval-clues
    desc: Meeting lure, curl and script evaluation
    crit: hostile
    conf: 0.96
    attack: T1105,T1059.002
    all:
      - id: applescript-curl-shell-output-assignment
      - id: micro-behaviors/process/interpreter/eval/direct::run-script-variable-text-reference
      - id: objectives/evasion/masquerade/brand/meeting::meeting-softwareupdate-url-lure
