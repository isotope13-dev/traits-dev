defaults:
  platforms: [windows]
  for: [pe]


composite_rules:
  - id: winhttp-temp-powershell-policy-bypass
    desc: WinHTTP temp write and PowerShell bypass clues
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-temp-write-api-cluster
      - id: objectives/evasion/security-bypass/policy/execution::bypass-execution-policy
      - id: metadata/binary/symbols/name/process::create-process-w
    any:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-temp-file-write-clues
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive
      - id: objectives/command-and-control/beacon/network/http::direct-http-c2-binary-ip
    downgrade:
      any:
        - id: metadata/installer/product/

  # Keep the file-I/O sink requirement below. A bare unsigned WinHTTP
  # request/response plus any ShellExecute reference also matches benign
  # version checks that open a website; Mem Reduct 3.4 fetches VERSION and a
  # language file, while its ShellExecute sites are separate shell opens.
