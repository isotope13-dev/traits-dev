defaults:
  platforms:
  - windows
  for:
  - vbs
composite_rules:
- id: vbs-webrequest-response-expression-loader
  desc: WSH runs policy-bypassed response evaluation
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/client/initialize::vbs-webrequest-create-command-text
  - id: micro-behaviors/communications/http/client/response-body::vbs-response-stream-read-command-text
  - id: metadata/file/profile/process/hidden::wsh-run-paren-hidden-false
  - id: micro-behaviors/os/security/policy::powershell-policy-bypass-token-sequence
  - id: metadata/file/profile/eval-reference::powershell-expression-command-text
