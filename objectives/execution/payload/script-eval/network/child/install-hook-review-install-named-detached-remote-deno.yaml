defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-named-detached-remote-deno
    desc: Install-named script references detached remote Deno execution
    crit: suspicious
    conf: 0.99
    attack: T1105,T1059.007
    scope: leaf
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: micro-behaviors/process/daemonize/detach::install-named-script-detach-options
      - id: micro-behaviors/process/deploy/script-eval/network::js-remote-deno-run-all-permissions
