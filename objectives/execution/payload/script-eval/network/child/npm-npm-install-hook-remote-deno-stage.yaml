defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: npm-install-hook-remote-deno-stage
  for: [npm, package.json, javascript]
  desc: npm install hook detaches unrestricted remote Deno stage
  crit: hostile
  conf: 0.99
  scope: archive
  attack: T1195.002,T1105,T1059.007,T1480
  all:
  - id: metadata/package/scripts/lifecycle::has-install-script
  - id: metadata/package/scripts/entrypoint::install-runs-node-local-script
  - id: micro-behaviors/process/daemonize/detach::install-named-script-detach-options
  - id: micro-behaviors/process/deploy/script-eval/network::js-remote-deno-run-all-permissions
