defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  attack: T1105
  mbc: E1105

composite_rules:
  - id: python-powershell-irm-iex
    desc: Python launches PowerShell remote evaluation
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/payload/script-eval/network/response-body::powershell-irm-iex-command-string
      - id: micro-behaviors/process/create/subprocess/launch::popen-content
  - id: python-hidden-remote-powershell
    desc: Hidden PowerShell and remote evaluation clues
    crit: hostile
    conf: 0.96
    attack: T1105, T1059.001, T1562.001
    all:
      - id: objectives/execution/payload/script-eval/network/response-body::powershell-irm-iex-command-string
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-policy-bypass-options
    unless:
      - id: well-known/tool/development/agent/ai-cli/shibaclaw::shibaclaw-official-release-updater-context
  - id: encoded-powershell-download-exec
    desc: Encoded PowerShell download and evaluation
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1105,T1564.003
    all:
      - id: metadata/lang/encoding/base64::encoded-invoke-webrequest
      - id: metadata/lang/encoding/base64::encoded-outfile-option
      - id: metadata/lang/encoding/base64::encoded-invoke-expression
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
