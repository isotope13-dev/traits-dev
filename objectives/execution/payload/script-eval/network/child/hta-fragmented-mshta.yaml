defaults:
  platforms: [windows]
  for: [html]
  attack: T1218.005,T1027

traits:
  - id: hta-split-mshta-command
    desc: HTA assembles a fragmented mshta command
    crit: notable
    if:
      type: text
      regex: '(?is)"msht".{0,100}"a\.e".{0,100}"xe "'
  - id: hta-split-http-scheme
    desc: HTA assembles a fragmented HTTP scheme
    crit: notable
    if:
      type: text
      regex: '(?is)"http".{0,100}":/".{0,100}"/"'
  - id: hta-vbs-variable-run
    desc: HTA invokes Run with a variable
    crit: component
    if:
      type: text
      regex: '(?im)\b[a-z_][a-z0-9_]*\.run\s+[a-z_][a-z0-9_]*'

composite_rules:
  - id: hidden-hta-fragmented-mshta-network
    desc: Hidden HTA assembles and runs remote mshta command
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: micro-behaviors/os/com/instantiation::vbs-createobject-variable-progid
      - id: micro-behaviors/ui/window/control::hta-taskbar-hidden
      - id: hta-split-mshta-command
      - id: hta-split-http-scheme
      - id: hta-vbs-variable-run
