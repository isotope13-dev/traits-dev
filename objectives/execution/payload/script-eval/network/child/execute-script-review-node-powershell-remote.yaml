defaults:
  platforms: [windows, linux]
  for: [javascript, typescript]
  attack: T1059.001,T1105
  mbc: E1105


composite_rules:
  - id: node-exec-powershell-remote-script
    desc: Node exec and PowerShell remote script clues
    crit: hostile
    conf: 0.97
    # The exec, the policy bypass, and the fetched script are one call.
    # An earlier or later exec checking versions or running unrelated commands
    # must not join an installer command string elsewhere in the same file.
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-argument
    any:
      - id: well-known/app/development/code-forge/github::raw-githubusercontent-script-file
      - id: micro-behaviors/communications/http/download/url::executable-url-reference
      - id: objectives/execution/payload/script-eval/network/response-body::embedded-irm-iex-pipeline
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::embedded-powershell-irm-iex-command
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::embedded-iwr-pipe-iex
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::embedded-iwr-outfile-download
    # Anthropic's own Claude Code bootstrap (`irm https://claude.ai/install.ps1
    # | iex`), run by setup wizards on the user's behalf, is the vendor
    # installer rather than a payload fetched from an attacker host. Astral's
    # uv bootstrap (`irm https://astral.sh/uv/install.ps1 | iex`) is the same
    # shape: the documented Windows install command that agent and Python
    # toolchain launchers run when the user asks for uv.
    unless:
      - id: micro-behaviors/communications/http/services/anthropic::claude-official-installer-url
      - id: well-known/tool/packaging/uv::uv-install-sh-bootstrap-url
      # Install commands handed to a shown VS Code terminal run where the
      # user watches: transparent dependency setup, not a silent fetch.
      - id: micro-behaviors/ui/terminal::terminal-shown-text-submit

  - id: node-spawn-detached-powershell-remote-script
    desc: Node spawns detached PowerShell remote script cradle
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/hidden::detached-hidden-spawn
      - id: micro-behaviors/process/create/shell/interpreter::powershell-exe-spawn
    any:
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::embedded-iwr-pipe-iex
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::embedded-powershell-irm-iex-command
      - id: objectives/execution/payload/script-eval/network/response-body::embedded-irm-iex-pipeline
    unless:
      - id: micro-behaviors/communications/http/services/anthropic::claude-official-installer-url
      - id: well-known/tool/packaging/uv::uv-install-sh-bootstrap-url
