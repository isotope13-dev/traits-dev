defaults:
  platforms:
    - windows
    - unix
  for:
    - python
composite_rules:
  - id: python-curl-node-remote-exec
    desc: Curl-fetched JavaScript runs through Node
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.007
    for: [python, whl]
    scope: archive
    all:
      - id: objectives/execution/staging/transfer::python-curl-node-eval-proximity
      - id: micro-behaviors/data/control-flow/module-exec::python-import-once-sentinel
      - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-exception-pass

