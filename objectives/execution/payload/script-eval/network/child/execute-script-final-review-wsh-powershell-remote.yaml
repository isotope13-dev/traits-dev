defaults:
  platforms:
  - windows
  for:
  - vbs
  - javascript
  attack: T1059.001,T1059.005,T1105
  mbc: B0030
  crit: hostile
  conf: 0.98

composite_rules:
- id: wsh-powershell-remote-script
  desc: WSH and PowerShell remote evaluation clues
  all:
  - id: micro-behaviors/data/control-flow/dispatch/run::wscript-shell-run-statement
  any:
  - id: objectives/execution/payload/script-eval/network/response-body::powershell-downloadstring-iex-inline
  - id: micro-behaviors/process/deploy/script-eval/network::embedded-powershell-webclient-script-eval
  - id: micro-behaviors/communications/http/download/cli/web-cmdlet::embedded-powershell-irm-iex-command
  - id: micro-behaviors/communications/http/download/cli/web-cmdlet::embedded-iwr-pipe-iex
- id: wsh-hidden-powershell-webclient-download
  for:
  - vbs
  desc: WSH hidden PowerShell and WebClient download
  all:
  - id: micro-behaviors/data/control-flow/dispatch/run::wscript-shell-run-statement
  - id: micro-behaviors/communications/http/client/managed::webclient-download-operation-text
  - id: micro-behaviors/process/argument/option::powershell-flagged-command-line
  any:
  - id: micro-behaviors/process/create/hidden::wsh-run-hidden-wait-statement
  - id: micro-behaviors/process/create/hidden::wsh-hidden-async-run
  - id: micro-behaviors/process/create/hidden::wsh-run-hidden-statement
