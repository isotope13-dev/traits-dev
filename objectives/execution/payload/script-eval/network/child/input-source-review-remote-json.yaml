defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: remote-response-reaches-shell-command
    desc: HTTP response contributes to shell command
    if:
      type: symbol
      kind: call
      regex: '^((child_process|cp|proc)\.)?(exec|execSync)$'
      arg:
        index: 0
        from:
          call: '(^|\.)(fetch|fetchRemoteText|requestText)$'
          through:
            - call: '^JSON\.parse$'
              arguments: [0]
