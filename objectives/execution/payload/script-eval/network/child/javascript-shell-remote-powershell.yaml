# JavaScript extensions and tooling can invoke a shell with a remote script
# cradle embedded in the command string. The combination confirms payload
# retrieval, evaluation, and shell execution in one source member.
defaults:
  platforms: [windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-shell-remote-powershell-eval
    desc: Node shell executes a downloaded PowerShell script
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1059.007,T1105
    near_bytes: 4096
    all:
      - id: metadata/import/builtin::child-process-exec-destructure
      - id: micro-behaviors/data/control-flow/dispatch/named::javascript-exec-call
      - id: micro-behaviors/process/deploy/script-eval/network::embedded-powershell-webclient-script-eval
      - id: micro-behaviors/communications/url/reference::http-ps1-url-reference
