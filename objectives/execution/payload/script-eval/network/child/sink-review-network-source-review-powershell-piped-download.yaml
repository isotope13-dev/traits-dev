# A remote download piped directly into PowerShell executes script content
# straight from stdin in memory without writing the payload to disk.
defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1059.001,T1105
  mbc: B0030

composite_rules:
  # A Node launcher that combines PowerShell policy bypass with a remote
  # fetch-and-evaluate command is suspicious even when the host is not a
  # known raw GitHub payload source.
- id: node-powershell-remote-fetch-evaluate
  desc: Node launches PowerShell to fetch and evaluate a remote script
  crit: suspicious
  conf: 0.94
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/process/create/shell/interpreter::powershell-exe-spawn
  - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-argument
  - id: objectives/execution/payload/script-eval/network/response-body::embedded-irm-iex-pipeline

  # Node launchers can carry the same in-memory fetch-and-evaluate cradle as
  # a native PowerShell script. The node-specific atom already ties the
  # policy bypass, interpreter launch, and remote script source together.
- id: node-powershell-remote-fetch-execute
  desc: Node CLI launches PowerShell to fetch and execute a remote script
  crit: hostile
  conf: 0.98
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/process/create/shell/interpreter::powershell-exe-spawn
  - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-argument
  - id: well-known/app/development/code-forge/github::raw-githubusercontent-script-file
  any:
  - id: objectives/execution/payload/script-eval/network/response-body::embedded-irm-iex-pipeline
  - id: micro-behaviors/communications/http/download/cli/web-cmdlet::embedded-powershell-irm-iex-command

