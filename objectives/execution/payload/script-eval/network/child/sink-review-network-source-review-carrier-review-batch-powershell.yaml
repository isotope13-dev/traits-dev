defaults:
  attack: T1027, T1059.001, T1105
  platforms: [windows]
  for: [batch]
composite_rules:
- id: batch-delayed-expansion-iex-downloadstring-stager
  desc: Batch hides a PowerShell WebClient IEX downloader in split variables
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/anti-static/obfuscation/eval/powershell-loader::batch-webclient-iex-fragments-profile
  - id: micro-behaviors/process/interpreter/scripting::delayed-expansion
  - id: micro-behaviors/process/interpreter/eval/powershell::powershell-expression-command-text
  - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-text
- id: batch-obfuscated-ps-webclient-stage
  desc: Obfuscated batch PowerShell WebClient stager
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/lang/source/literal/fragment/sequence::caret-split-cmd-powershell-text
  - id: metadata/lang/source/literal/fragment/sequence::fragmented-powershell-window-flags-text
  - id: metadata/lang/source/literal/fragment/sequence::downloadstring-fragment-marker-text
  - id: metadata/lang/source/literal/fragment/sequence::delayed-expansion-iex-newobject-fragments
