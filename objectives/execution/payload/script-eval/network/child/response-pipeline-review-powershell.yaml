defaults:
  platforms: [windows]
  for: [powershell]
traits: []
composite_rules:
  - id: hidden-ep-bypass-irm-cradle
    desc: Hidden EP-bypass IRM fetch-eval cradle
    crit: hostile
    conf: 0.98
    mbc: "B0030"
    attack: "T1059.001,T1105,T1564.003"
    all:
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-ep-bypass-launch-text
      - id: micro-behaviors/process/deploy/script-eval/network::powershell-irm-eval-text
    near_bytes: 256
  - id: hidden-encoded-opaque-irm-response-eval
    desc: Hidden encoded PowerShell evaluates a remote script at an opaque URL path
    crit: hostile
    conf: 0.98
    mbc: "B0030"
    attack: "T1027,T1059.001,T1105,T1564.003"
    all:
      - id: micro-behaviors/process/deploy/interpreter-command::encodedcommand-invocation-source
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
      - id: micro-behaviors/communications/http/client/exchange::irm-opaque-path-reference
      - id: objectives/execution/payload/script-eval/network/response-body::powershell-web-response-piped-eval-text
  - id: hidden-window-policy-bypassed-irm-eval
    desc: Hidden-window PowerShell bypasses policy and evaluates a remote response
    crit: hostile
    conf: 0.99
    mbc: "B0030"
    attack: "T1059.001, T1105, T1564.003"
    for: [batch, powershell]
    all:
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-flag
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
    any:
      - id: micro-behaviors/process/deploy/script-eval/network::ps-restmethod-bare-domain-eval-call
      - id: objectives/execution/payload/script-eval/network/response-body::powershell-web-response-piped-eval-text
      - id: micro-behaviors/process/deploy/script-eval/network::powershell-nested-rest-response-eval
    unless:
      - id: objectives/evasion/security-bypass/policy/execution::benign-executionpolicy-wrapper-context
      - id: well-known/tool/sysadmin/scoop::scoop-bootstrap-installer-context
      - id: well-known/app/productivity/ferronote::ferronote-windows-installer-context
    near_bytes: 256
  - id: ps-command-irm-ipv4-eval
    desc: PowerShell -c IRM eval from raw IPv4 host
    crit: hostile
    conf: 0.98
    mbc: "B0030"
    attack: "T1059.001,T1105"
    for: [batch]
    all:
      - id: micro-behaviors/process/argument/interpreter::powershell-c-flag
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::irm-external-ipv4-host
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-expression-command-text
  - id: ps-hidden-child-irm-eval
    desc: Hidden child PowerShell fetches and evaluates a remote script
    crit: hostile
    conf: 0.99
    mbc: "B0030"
    attack: "T1059.001,T1105,T1564.003"
    all:
      - id: objectives/execution/payload/script-eval/network/response-body::embedded-irm-iex-pipeline
      - id: metadata/lang/source/syntax/command/launch::start-process-powershell-command
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
    near_lines: 0
    unless:
      - id: metadata/package/documentation/powershell-help::powershell-comment-help-irm-iex-example
      - id: metadata/path/directory::test-directory-component
# Self-decoding dropper: decode a base64 blob to a script, write it into TEMP,
# and re-launch it through a hidden powershell process. Distinct from the
# download-and-eval composites above — the payload ships inside the script and
# is staged to disk, not fetched. The base64-decode of the executed body plus a
# random-TEMP drop plus a hidden re-exec is the Stealc/Emotet loader shape;
# legitimate installers ship or download their helper scripts in cleartext.
  - id: native-pe-remote-irm-defender-dropper
    desc: Native PE launches remote PowerShell eval while adding a Defender exclusion
    crit: hostile
    conf: 0.99
    mbc: "B0030"
    attack: "T1059.001,T1105,T1562.001"
    for: [pe, dll]
    all:
      - id: micro-behaviors/process/deploy/interpreter-command::powershell-command-text
      - id: objectives/execution/payload/script-eval/network/response-body::pe-irm-iex-pipeline-text
      - id: micro-behaviors/os/security/defender::defender-exclusion-command
    any:
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: metadata/binary/symbols/name/process::shell-execute-ex-a
      - id: micro-behaviors/os/privilege/elevation::runas-string
    unless:
      - id: metadata/installer/product/
  - id: wsh-policy-bypassed-remote-powershell
    desc: Policy-bypassed remote PowerShell eval
    crit: hostile
    conf: 0.99
    mbc: "B0030"
    attack: "T1059.001,T1059.005,T1105"
    for: [vbs]
    all:
      - id: micro-behaviors/process/argument/option::powershell-flagged-command-line
      - id: micro-behaviors/os/security/policy::execution-policy-bypass
      - id: objectives/execution/payload/script-eval/network/response-body::powershell-rest-response-piped-eval-line
  - id: zoomsdk-chromechip-hidden-stage
    desc: ZoomSDK chromechip hidden stage
    crit: hostile
    conf: 0.99
    mbc: "B0023"
    attack: "T1105"
    all:
      - id: micro-behaviors/fs/path/log/application::chromechip-log-text
      - id: micro-behaviors/process/deploy/script-eval/input::hidden-powershell-getcontent-iex
    any:
      - id: objectives/execution/staging/http::iwr-zoomsdk-chromechip-log
      - id: objectives/execution/staging/http::iwr-zoomsdk-outfile
