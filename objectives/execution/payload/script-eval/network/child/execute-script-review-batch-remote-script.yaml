defaults:
  crit: hostile
  platforms: [windows]
  for: [batch]
  attack: T1105,T1059.001
  mbc: B0030


composite_rules:
  - id: batch-hidden-ip-powershell-script
    desc: Batch hidden PowerShell script and raw IP download clues
    conf: 0.99
    attack: T1105,T1059.001,T1564.003
    all:
      - id: micro-behaviors/communications/http/download/webclient::downloadfile-method-name-batch
      - id: micro-behaviors/process/create/shell/script-file::powershell-script-execution
      - id: micro-behaviors/fs/path/temp::temp-powershell-script-path
      - id: micro-behaviors/process/argument/option::powershell-policy-bypass-flag
      - id: micro-behaviors/communications/ip/literal::batch-public-ip-literal
    any:
      - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
