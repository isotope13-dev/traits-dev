defaults:
  platforms: [linux, unix, macos, android, ios, windows]
  for: [python, pyc]
  mbc: "B0024"
  attack: "T1105"

composite_rules:
  - id: python-shell-dropper
    for: [python]
    desc: "Inline Python download and execute pattern"
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/deploy/interpreter-command::python-c-flag
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
