defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  attack: T1105
  mbc: E1105


composite_rules:
  - id: python-aliased-hidden-powershell-download
    desc: Aliased subprocess and hidden PowerShell download
    crit: hostile
    conf: 0.96
    attack: T1105,T1059.001,T1564.003
    all:
      - id: metadata/import/builtin::alias-subprocess
      - id: micro-behaviors/process/config/window::python-powershell-w-hidden
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
  - id: python-hidden-powershell-webclient-extract
    desc: Hidden PowerShell, WebClient and extraction clues
    crit: hostile
    conf: 0.95
    attack: T1105,T1059.001
    all:
      - id: micro-behaviors/process/config/window::python-powershell-w-hidden
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
      - id: micro-behaviors/data/archive/extract/zip::extract-to-directory
