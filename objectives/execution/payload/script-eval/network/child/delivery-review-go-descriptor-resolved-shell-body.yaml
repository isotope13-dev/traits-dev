{
  "composite_rules": [
    {
      "id": "go-descriptor-resolved-shell-body",
      "desc": "Go resolves remote endpoint then fetches and starts its shell body",
      "crit": "hostile",
      "conf": 0.95,
      "for": [
        "go"
      ],
      "platforms": [
        "unix"
      ],
      "attack": "T1105,T1059.004",
      "all": [
        {
          "id": "micro-behaviors/process/deploy/script-eval/network::go-descriptor-fetch-shell-body"
        },
        {
          "id": "micro-behaviors/process/create/subprocess/launch::go-command-start"
        },
        {
          "id": "metadata/import/go/github/com/bitfield/script::github/com/bitfield/script"
        },
        {
          "id": "metadata/import/go/strings::strings"
        },
        {
          "id": "metadata/import/go/os/exec::os/exec"
        }
      ]
    }
  ]
}
