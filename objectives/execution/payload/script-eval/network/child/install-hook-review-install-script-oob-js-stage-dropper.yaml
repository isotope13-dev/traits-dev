defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-oob-js-stage-dropper
    desc: Install-named script has OOB JavaScript staging and detached execution clues
    crit: hostile
    conf: 0.995
    attack: T1195.002, T1105, T1059.007
    size_max: 20000
    scope: leaf
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: metadata/lang/source/literal/fragment/env-variable::dep-confusion-env-knobs
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-moika-endpoint
      - id: micro-behaviors/process/daemonize/detach::install-script-detached-js-download-clues
    any:
      - id: micro-behaviors/process/interpreter/node::node-spawn-current-executable
      - id: metadata/import/builtin::require-child-process
