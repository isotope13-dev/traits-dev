defaults:
  for: [javascript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

composite_rules:
  - id: vscode-hidden-debug-fetch-runtime
    desc: Debug runtime and hidden fetch-execute clues
    platforms: [windows]
    near_bytes: 1000
    all:
      - id: micro-behaviors/process/config/target::vscode-debug-powershell-runtime
      - id: micro-behaviors/process/config/window::vscode-debug-hidden-window-args
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::embedded-iwr-pipe-iex

  - id: vscode-launch-config-hidden-powershell-remote-eval
    desc: Debug configuration executes hidden PowerShell remote cradle
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1105
    platforms: [windows]
    all:
      - id: micro-behaviors/fs/path/config/app::vscode-launch-json-filename
      - id: objectives/execution/payload/script-eval/network/child::vscode-hidden-debug-fetch-runtime
