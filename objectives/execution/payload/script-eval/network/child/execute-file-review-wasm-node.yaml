defaults:
  platforms: [windows, unix]
  for: [wasm]
  attack: T1105,T1059


composite_rules:
  - id: wasm-xor-host-http-execution-clues
    desc: WASM XOR, host shell and HTTP execution clues
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/data/decode/xor/transform::wasm-constant-xor-data-loops
      - id: micro-behaviors/process/interpreter/wasm::go-wasm-host-value-call
      - id: micro-behaviors/process/interpreter/wasm::go-wasm-host-value-invoke
      - id: metadata/import/builtin::encoded-child-process-reference
      - id: metadata/lang/source/naming/function/runtime::wasm-execsync-method-reference
      - id: micro-behaviors/communications/http/download/shell::wasm-powershell-http-template-prefix
      - id: metadata/lang/source/syntax/command/pipeline::wasm-iex-pipeline-reference
