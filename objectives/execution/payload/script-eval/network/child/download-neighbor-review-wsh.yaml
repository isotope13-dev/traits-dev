defaults:
  platforms: [windows]
  for: [html, vbs]
  attack: T1105

composite_rules:
  - id: vbs-webclient-iex-stager
    desc: VBScript downloads PowerShell text and evaluates it
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1059.005,T1105
    for: [vbs]
    all:
      - id: micro-behaviors/process/argument/option::powershell-flagged-command-line
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-downloadstring
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-expression-command-text
  - id: wsh-hidden-mshta-remote-run
    desc: WSH runs MSHTA on a remote URL, hidden
    crit: hostile
    conf: 0.97
    attack: T1059.005,T1218.005,T1564.003
    for: [vbs]
    all:
      - id: metadata/lang/source/syntax/command/launch::mshta-remote-url-command
      - id: micro-behaviors/data/control-flow/dispatch/run::run-zero-style-argument
  - id: wsh-reversed-mshta-hidden-remote-run
    desc: Reversed WSH runs remote MSHTA hidden
    crit: hostile
    conf: 0.97
    attack: T1059.005,T1218.005,T1027,T1564.003
    for: [vbs]
    all:
      - id: objectives/anti-static/obfuscation/string/reverse::reversed-mshta-name
      - id: objectives/anti-static/obfuscation/string/reverse::reversed-wscript-shell-progid
      - id: micro-behaviors/data/control-flow/dispatch/run::wsh-run-url-argument
      - id: micro-behaviors/data/control-flow/dispatch/run::run-zero-style-argument
