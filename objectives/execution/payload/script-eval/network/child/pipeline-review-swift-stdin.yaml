defaults:
  platforms: [freebsd, unix]
  for: [swift]

composite_rules:
  - id: swift-urlsession-shell-stdin-profile
    desc: Swift URLSession and shell stdin clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/file/profile/script/network::swift-urlsession-shell-stdin-pipe
      - id: micro-behaviors/process/stdio/write::swift-shell-stdin-write
