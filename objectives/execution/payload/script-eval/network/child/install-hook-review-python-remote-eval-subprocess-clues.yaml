defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1195.002
  mbc: B0024
composite_rules:
- id: python-remote-eval-subprocess-clues
  crit: suspicious
  desc: Python has endpoint, eval and subprocess clues
  conf: 0.95
  all:
  - id: micro-behaviors/os/sysinfo/platform/runtime/platform::python-osname-nt-check
  - id: micro-behaviors/communications/url/host/oob-http::python-http-ip-port-url
  - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
  any:
  - id: micro-behaviors/process/interpreter/python::sys-executable-popen
  - id: micro-behaviors/process/create/subprocess/launch::popen-content
  unless:
  - id: metadata/path/directory::test-directory-component
