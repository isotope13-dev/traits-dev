defaults:
  platforms: [windows]
  for: [powershell]
  crit: hostile
  conf: 0.98
  attack: T1059.001,T1105,T1564.003
composite_rules:
  - id: powershell-hidden-http-evaluation-clues
    desc: Hidden PowerShell near web request and IEX
    all:
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-window
      - id: micro-behaviors/process/create/cmdlet::start-process-call
    near_lines: 40
  - id: powershell-hidden-remote-download-cradle
    desc: Hidden PowerShell evaluates downloaded remote script
    crit: hostile
    conf: 0.98
    for: [powershell, text, data, scripts, batch]
    mbc: B0030
    all:
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
      - id: objectives/execution/payload/script-eval/network/response-body::embedded-iex-irm-call
  # Legitimate vendor bootstrap cradles (Chocolatey, Scoop) use HTTPS and DNS
  # hostnames. Fetching cleartext HTTP from a raw external IPv4 host via
  # WebClient.DownloadString and passing it to Invoke-Expression is a direct
  # C2 stager cradle.
