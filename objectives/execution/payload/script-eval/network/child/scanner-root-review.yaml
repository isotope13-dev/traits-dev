defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.8
  attack: T1046

composite_rules:
  - id: hostile-mass-scan-exec
    desc: xargs shell launches curl-piped Python
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/shell/command-mode::xargs-bash-c
      - id: metadata/lang/source/syntax/command/download::curl-pipe-exec-python-shell
  - id: hostile-curl-pipe-python
    desc: External IPv4 curl response executed by Python
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/source/syntax/command/download::curl-pipe-exec-python-shell
      - id: micro-behaviors/communications/ip/literal::curl-external-ipv4-url
    near_bytes: 128
