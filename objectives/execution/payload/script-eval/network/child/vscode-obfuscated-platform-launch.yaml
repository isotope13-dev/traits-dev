# Obfuscated editor extensions that dynamically load Node's process module
# and branch on the host OS conceal platform-specific command launch behavior.
defaults:
  platforms: [windows, unix]
  for: [vsix, javascript, typescript, package.json]
  attack: T1059.007,T1027,T1195.002

composite_rules:
  - id: vscode-obfuscated-platform-gated-child-process
    desc: Obfuscated VS Code extension gates child process by OS
    crit: suspicious
    conf: 0.94
    scope: archive
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: obfuscated-platform-launch-source

  - id: obfuscated-platform-launch-source
    desc: Obfuscated module loader checks OS and creates processes
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    scope: file
    all:
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::process-platform-dot-or-bracket-reference
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: obfuscated-module-load-source
    any:
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: micro-behaviors/os/module/dynamic-load::node-computed-child-process-binding
      - id: micro-behaviors/os/module/dynamic-load::js-array-join-child-process-token

  - id: obfuscated-module-load-source
    desc: Source loads a computed module name
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    any:
      - id: micro-behaviors/os/module/dynamic-load::node-dynamic-require-call
      - id: micro-behaviors/os/module/dynamic-load::node-split-literal-require

  - id: vscode-obfuscated-computed-exec-launch
    desc: Obfuscated VS Code extension loads computed child process exec
    crit: suspicious
    conf: 0.94
    scope: archive
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: metadata/lang/source/declaration::js-computed-exec-destructure
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
