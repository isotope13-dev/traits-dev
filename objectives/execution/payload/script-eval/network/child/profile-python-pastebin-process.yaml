defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: python-pastebin-process-clues
  desc: Paste site URL and Python process execution clues
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/services/file-hosting::pastebin
  - id: micro-behaviors/communications/http/client/initialize::urllib-request-symbol
  - id: micro-behaviors/process/create/subprocess/launch::call-ast
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system
