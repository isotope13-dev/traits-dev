defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
  attack: T1059.004
composite_rules:
- id: shell-ip-curl-subshell-loader
  desc: Shell executes IP curl payload
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/process/deploy/script-eval/network::sh-c-curl-subshell
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  - id: micro-behaviors/communications/http/curl/command::curl-silent-or-fail
- id: bash-c-curl-ip-loader
  desc: sh command loads IP payload
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/process/deploy/script-eval/network::sh-c-curl-subshell
  - id: micro-behaviors/process/create/shell/command-mode::sh-c-exec
  - id: micro-behaviors/communications/ip/literal::http-ip-url-filtered-text
