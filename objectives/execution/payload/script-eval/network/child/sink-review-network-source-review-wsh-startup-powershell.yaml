defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1059.001,T1105
composite_rules:
  # Require writing evaluator text, creating an autostart file, and an actual
  # process-create call. An unconsumed cradle literal or commented Run call
  # does not establish a payload handoff. File scope alone does not establish
  # that independently built paths name the same file.
- id: js-startup-batch-powershell-webclient-dropper
  desc: Startup file writes remote PowerShell eval with WMI launch
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/fs/write/content::create-text-file-in-startup
  - id: micro-behaviors/fs/write/content::create-batch-from-bound-path
  - id: micro-behaviors/fs/write/content::text-file-write-powershell-cradle
  - id: micro-behaviors/process/create/wmi::js-wmi-process-create
  - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
  - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-flag
- id: js-startup-batch-powershell-webclient-review
  desc: Startup file writes remote PowerShell eval without a launch
  crit: suspicious
  conf: 0.9
  # The hostile dropper above needs the WMI process launch. Without it the
  # same startup-written hidden PowerShell cradle is a review-level staging
  # artifact, so commented, mismatched, or non-process Create calls land here.
  # When the launch is present the hostile dropper already reports the file.
  unless:
  - id: micro-behaviors/process/create/wmi::js-wmi-process-create
  all:
  - id: micro-behaviors/fs/write/content::create-text-file-in-startup
  - id: micro-behaviors/fs/write/content::create-batch-from-bound-path
  - id: micro-behaviors/fs/write/content::text-file-write-powershell-cradle
  - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
  - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-flag
