defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1059.006,T1190

traits:
  - id: fastapi-request-body-method-call
    desc: References an awaited request body
    crit: component
    conf: 0.95
    attack: none
    if:
      type: text
      substr: request.body()

composite_rules:
  - id: fastapi-header-authenticated-python-body-exec
    desc: FastAPI route executes header-selected request body
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/communications/http/server/framework::python-http-route-basic-method
      - id: fastapi-request-body-method-call
      - id: micro-behaviors/crypto/hash/digest/md5::python-md5-digest
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
      - id: micro-behaviors/communications/http/server/framework::fastapi-http-exception-marker
