defaults:
  crit: hostile
  platforms: [windows]
  for: [powershell, html]
  attack: T1071.004

composite_rules:
  # Some droppers inline nslookup directly inside IEX instead of assigning
  # its output first. A second and third IEX in the pipeline execute the TXT
  # answer while evading the variable-capture form above.
  - id: powershell-inline-nslookup-txt-double-eval
    desc: PowerShell double-evaluates DNS TXT tasking
    conf: 0.99
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/dns/txt::powershell-inline-nslookup-txt-iex
      - id: micro-behaviors/communications/dns/txt::nslookup-txt-explicit-resolver
      - id: micro-behaviors/communications/dns/txt::powershell-nslookup-txt-double-iex
