defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1059,T1105
  mbc: E1059
composite_rules:
  - id: php-http-response-decoded-function-eval
    desc: PHP evals Base64 server code inside a function
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/process/interpreter/eval/constructed::php-eval-function-wrapped-source
      - id: micro-behaviors/data/decode/base64/call::php-base64-decode-call
      - id: micro-behaviors/data/parse/json::php-json-decode
    any:
      - id: micro-behaviors/communications/http/curl/binding::php-curl-request
      - id: micro-behaviors/communications/http/request/wordpress::wp-remote-post
