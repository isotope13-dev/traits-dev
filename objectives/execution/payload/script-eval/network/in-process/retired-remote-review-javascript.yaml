defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
  attack: T1105
composite_rules:
- id: fetch-atob-json-eval-loader
  desc: Base64-decoded URL JSON content eval
  crit: hostile
  conf: 0.98
  attack: T1059.007
  mbc: B0009.016
  all:
  - id: micro-behaviors/communications/http/client/exchange::fetch-atob-json-callback
  any:
  - id: micro-behaviors/process/interpreter/eval/javascript::content-assignment-before-eval
  - id: micro-behaviors/process/interpreter/eval/javascript::eval-content-property
- id: axios-atob-json-eval-loader
  desc: Axios decoded URL payload eval loader
  crit: hostile
  conf: 0.99
  attack: T1059.007
  mbc: B0009.016
  all:
  - id: micro-behaviors/communications/http/get::axios-require-get-call
  - id: micro-behaviors/process/deploy/script-eval/network::eval-response-data-content
  - id: micro-behaviors/communications/url/encoded::atob-encoded-http-url-literal
- id: detached-fetch-text-eval-loader
  desc: Detached process fetches and evals text
  crit: hostile
  conf: 0.99
  attack: T1059.007
  all:
  - id: micro-behaviors/process/deploy/script-eval/network::await-fetch-text-eval
  - id: micro-behaviors/process/daemonize/detach::detached-true
  - id: micro-behaviors/process/control/wait::node-unref-handle
  any:
  - id: micro-behaviors/os/module/require::child-process-require
  - id: micro-behaviors/process/create/shell/command-string::child-process-exec
  - id: micro-behaviors/communications/url/host/domain-http::workers-dev-url
- id: workers-fetch-text-eval-loader
  desc: Workers URL fetches text into eval
  crit: hostile
  conf: 0.98
  attack: T1059.007
  all:
  - id: micro-behaviors/process/deploy/script-eval/network::await-fetch-text-eval
  - id: micro-behaviors/communications/url/host/domain-http::workers-dev-url
  any:
  - id: micro-behaviors/process/daemonize/detach::detached-true
  - id: micro-behaviors/process/control/wait::node-unref-handle
- id: encoded-async-fetch-eval-loader
  desc: Encoded async loader fetch-evals remote code
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.007,T1195.002
  mbc: B0009.016
  all:
  - id: metadata/file/encoding/base64::base64-contains-eval-await-fetch
  - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
- id: encoded-vercel-fetch-eval-stager
  desc: Encoded fetch-eval via Vercel-hosted app
  crit: hostile
  conf: 0.98
  attack: T1105,T1059.007,T1195.002
  mbc: B0009.016
  all:
  - id: metadata/file/encoding/base64::base64-contains-eval-await-fetch
  - id: micro-behaviors/communications/http/services/cloud::vercel-app
- id: browser-xhr-response-eval-loader
  desc: External XMLHttpRequest response evaluated as JavaScript
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.007
  mbc: B0024
  for:
  - javascript
  scope: leaf
  near_bytes: 1400
  unless:
  - id: metadata/lang/source/origin::native-binary-embedded-javascript
  - id: well-known/lib/web/authoring/syntaxhighlighter::shjs-syntax-highlighter
  - id: objectives/execution/interpreter/eval/remote::same-origin-xhr-eval-array-data
  - id: micro-behaviors/communications/http/header/security::js-csrf-token-header-from-meta
  - id: micro-behaviors/communications/http/client/xmlhttp::js-xhr-root-relative-get
  all:
  - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
  - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-open
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-response-text
- id: browser-inline-script-xhr-eval-loader
  desc: Base64 data-URL script executes a remote XMLHttpRequest response
  crit: hostile
  conf: 0.99
  attack: T1027,T1105,T1059.007
  mbc: B0024
  for:
  - javascript
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/url/scheme::javascript-base64-data-url-text
  - id: objectives/execution/payload/script-eval/network/in-process::browser-xhr-response-eval-loader
