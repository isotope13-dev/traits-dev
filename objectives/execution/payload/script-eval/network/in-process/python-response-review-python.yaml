defaults:
  platforms:
    - windows
    - unix
  for:
    - python
composite_rules:
  - id: fixed-endpoint-urllib-source-exec
    desc: API function fetches and executes Python source from a fixed code endpoint
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.006
    mbc: B0024
    all:
      - id: micro-behaviors/communications/url/construction/build-http::api-code-path-module-constant
      - id: micro-behaviors/process/deploy/script-eval/network::non-url-param-request-compile-exec-flow
  - id: remote-transform-service-code-execution
    for:
      - python
      - whl
      - python-sdist
    desc: Executes code obtained from a remote encode or decode service
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.006,T1027
    mbc: B0024,B0032
    scope: archive
    all:
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/url/host/domain-http::workers-dev-domain
      - id: micro-behaviors/communications/url/resource-path/automation::code-transform-endpoint-path
      - id: micro-behaviors/communications/http/lib/requests::response-json-code-field
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-variable
  - id: urllib-module-code-exec
    desc: urllib-fetched Python module execution
    crit: hostile
    conf: 0.98
    attack: T1105, T1059.006
    mbc: B0024, B0032
    all:
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/fs/read/file/stream::decoded-read-module-code-assignment
      - id: micro-behaviors/process/interpreter/eval/python-builtins::python-exec-module-code-variable
      - id: micro-behaviors/communications/url/resource-path/file::module-py-url-path
    any:
      - id: micro-behaviors/communications/tls/verify/disable::tls-validation-fully-disabled
      - id: micro-behaviors/data/parse/json::json-loads-call
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
  - id: obfuscated-remote-exec
    desc: Executes code from obfuscated URL
    crit: hostile
    conf: 0.99
    attack: T1105
    mbc: B0024
    any:
      - id: micro-behaviors/process/deploy/script-eval/network::python-get-response-text-exec
      - id: micro-behaviors/process/deploy/script-eval/network::exec-get-content
      - id: micro-behaviors/process/deploy/script-eval/network::eval-get-text
    all:
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
      - id: objectives/anti-static/obfuscation/string/encoding::join-chr-comprehension
  - id: bitshift-obfuscated-exec
    desc: Executes code with bitshift-obfuscated URL
    crit: hostile
    conf: 0.98
    attack: T1105
    mbc: B0024
    any:
      - id: micro-behaviors/process/deploy/script-eval/network::python-get-response-text-exec
      - id: micro-behaviors/process/deploy/script-eval/network::exec-get-content
      - id: micro-behaviors/process/deploy/script-eval/network::eval-get-text
    all:
      - id: micro-behaviors/data/bitwise/shift::bitshift-array
      - id: objectives/anti-static/obfuscation/string/encoding::join-chr-comprehension
  - id: encoded-urllib-eval-pythonw-clues
    desc: Encoded Python, urllib eval and pythonw clue
    crit: hostile
    conf: 0.99
    attack: T1027,T1105,T1059.006
    mbc: B0032,B0024
    all:
      - id: micro-behaviors/process/deploy/script-eval/network::python-urllib-response-exec
      - id: objectives/anti-static/obfuscation/encoding/content::encoded-python-exec
      - id: objectives/anti-static/obfuscation/eval/scripting/host::pythonw-exe-replace-trick
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: alternate-port-urlopen-eval-clues
    desc: HTTP 8080, urlopen and eval clues
    crit: hostile
    conf: 0.96
    attack: T1105,T1059.006
    all:
      - id: micro-behaviors/process/deploy/script-eval/network::urlopen-before-exec
      - id: micro-behaviors/communications/url/host/port-http::http-alt-port-8080
      - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-exception-pass
