defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: scoop-bootstrap-deno-remote-exec-clues
    desc: Scoop bootstrap and remote Deno execution
    crit: suspicious
    conf: 0.98
    for: [powershell, batch, text]
    all:
      - id: well-known/tool/sysadmin/scoop::ps-scoop-bootstrap-irm-iex
      - id: micro-behaviors/process/deploy/script-eval/network::ps-deno-run-remote-all-permissions
    any:
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
      - id: objectives/execution/payload/script-eval/network/response-body::powershell-rest-response-piped-eval-line
      - id: micro-behaviors/communications/ip/literal::http-ip-url
