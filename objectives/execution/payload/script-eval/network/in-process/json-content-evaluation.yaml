defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: remote-json-content-eval
    desc: Evaluates fetched JSON content as code
    crit: hostile
    conf: 0.98
    attack: T1059.007,T1105
    near_bytes: 512
    all:
      - id: micro-behaviors/process/deploy/script-eval/network::fetch-near-content-eval
      - id: micro-behaviors/communications/http/request/json::fetch-call-near-json-parse
      - id: micro-behaviors/communications/url/host/http::fetch-absolute-url-target
      - id: objectives/execution/payload/script-eval/network/in-process::http-response-eval
