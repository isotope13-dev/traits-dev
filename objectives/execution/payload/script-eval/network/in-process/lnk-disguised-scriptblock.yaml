defaults:
  for: [lnk]
  platforms: [windows]
  attack: T1059.001,T1036

traits:
  - id: lnk-spreadsheet-description
    desc: Shortcut description resembles spreadsheet
    crit: notable
    if:
      type: value
      path: lnk.description
      regex: '(?i)MS.{1,8}xcel.{0,12}Workshe'

composite_rules:
  - id: lnk-spreadsheet-hidden-http-scriptblock
    desc: Spreadsheet-themed shortcut runs hidden HTTP script
    crit: hostile
    conf: 0.98
    all:
      - id: lnk-spreadsheet-description
      - id: micro-behaviors/communications/http/client/winhttp::lnk-arg-winhttp-request
      - id: micro-behaviors/communications/url/host/http::lnk-arg-http-raw-ip
      - id: micro-behaviors/process/interpreter/eval/constructed::lnk-powershell-scriptblock-call-operator
      - id: micro-behaviors/ui/window/state::lnk-hidden-window-flag
