defaults:
  platforms: [windows]
  for: [html]
  attack: T1218.005,T1059.007,T1105

composite_rules:
  # Companion to hta-offscreen-serverxmlhttp-response-eval below: that rule
  # covers the literal ServerXMLHTTP + eval shape, while this one covers the
  # XMLHTTP-family fetch whose response is rendered into the document via
  # document.write, in either literal or character-code-obfuscated spelling.
  # Rendering a remote response into a hidden HTA document executes it with
  # full HTA trust, which is the same remote-code-execution outcome.
- id: hta-hidden-xmlhttp-response-write
  desc: Hidden HTA fetches remote content and writes response into document
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/file/format/markup::hta-application-element
  - id: micro-behaviors/ui/window/control::hta-concealed-window
  - id: micro-behaviors/communications/http/client/xmlhttp::xmlhttp-client-literal-or-charcode
  - id: micro-behaviors/ui/window/insert-html::response-text-document-write

  # Moved from command-and-control/dropper/delivery/fetch-exec. Separate
  # responseText and eval tokens did not prove the former data-flow claim.
- id: hta-offscreen-serverxmlhttp-response-eval
  desc: Offscreen HTA sync-fetches and evaluates response text
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/file/format/markup::hta-application-element
  - id: micro-behaviors/ui/window/control::window-moveto-standalone-negative
  - id: micro-behaviors/os/com/instantiation::activex-constructor-call
  - id: micro-behaviors/communications/http/client/xmlhttp::http-client-msxml-serverxmlhttp-progid
  - id: micro-behaviors/communications/http/client/xmlhttp::xhr-sync-get
  - id: micro-behaviors/process/deploy/script-eval/input::html-response-text-binding-eval
