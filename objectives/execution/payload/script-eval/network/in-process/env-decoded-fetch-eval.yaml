defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007,T1105,T1027

composite_rules:
  - id: env-decoded-fetch-eval-stager
    desc: Evaluates text fetched from env-decoded URL
    crit: hostile
    conf: 0.98
    near_lines: 12
    all:
      - id: micro-behaviors/data/decode/base64/structured::atob-process-env-value
      - id: micro-behaviors/process/deploy/script-eval/network::response-text-eval-sink
    any:
      - id: micro-behaviors/communications/http/request/client/initialize::node-fetch-dynamic-import
      - id: micro-behaviors/communications/http/request/client/initialize::node-fetch-import
      - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
