# Receive and Python exec occur nearby, but the received value is not bound
# to exec. Legitimate remote administration can share this shape.
defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
- id: python-socket-receive-near-exec
  desc: Socket receive near Python namespace exec
  crit: suspicious
  conf: 0.88
  near_lines: 40
  all:
  - id: micro-behaviors/communications/socket/receive::python-socket-named-recv-assignment
  - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-variable-namespace
