defaults:
  for: [powershell]
  platforms: [windows]
  attack: T1059.001

composite_rules:
  - id: powershell-webresponse-variable-eval
    desc: PowerShell evaluates downloaded response content
    crit: suspicious
    conf: 0.9
    near_lines: 10
    all:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
      - id: micro-behaviors/data/property/access::powershell-parenthesized-content-member
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
    unless:
      - id: well-known/app/media/spotx::spotx-context
