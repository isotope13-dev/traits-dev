defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
  attack: T1105
composite_rules:
- id: userscript-privileged-response-eval-loader
  desc: Privileged userscript request executes its response
  crit: hostile
  conf: 0.995
  attack: T1105,T1059.007
  mbc: B0024
  near_bytes: 900
  all:
  - id: micro-behaviors/process/deploy/script-eval/network::userscript-gm-response-eval-flow
  - id: micro-behaviors/communications/http/client/xmlhttp::userscript-gm-xmlhttp-request
  - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-variable-argument
  - id: micro-behaviors/browser-extension/lifecycle::userscript-script-metadata-read
- id: remote-json-eval-loader
  desc: HTTP response JSON content executed as JavaScript
  crit: hostile
  conf: 0.99
  attack: T1059.007
  mbc: B0009.016
  all:
  - id: micro-behaviors/process/deploy/script-eval/network::eval-response-data-content
  - id: micro-behaviors/communications/http/get::node-https-get-reference
