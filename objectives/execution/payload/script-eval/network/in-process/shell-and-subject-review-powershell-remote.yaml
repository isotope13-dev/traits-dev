defaults:
  platforms: [windows]
  for: [powershell]
  crit: hostile
  conf: 0.98
  attack: T1059.001,T1105
composite_rules:
  - id: text-powershell-webclient-downloadstring-eval
    desc: PowerShell evaluates cleartext WebClient response text
    crit: hostile
    conf: 0.97
    for: [text]
    all:
      - id: objectives/execution/payload/script-eval/network/response-body::powershell-downloadstring-iex-inline
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-downloadstring
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::downloadstring-cleartext-http-url
  - id: powershell-webclient-external-ip-eval
    desc: PowerShell evaluates cleartext WebClient response from IPv4
    mbc: B0030,E1059
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-downloadstring
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::downloadstring-cleartext-http-url
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
  - id: powershell-webclient-script-download-cradle
    desc: PowerShell downloads and evaluates remote script
    mbc: B0030,E1059
    all:
      - id: objectives/execution/payload/script-eval/network/response-body::powershell-iex-near-downloadstring
      - id: micro-behaviors/communications/url/resource-path/file::executable-url-reference-b
