defaults:
  platforms:
    - unix
    - windows
  for:
    - python
composite_rules:
  - id: python-remote-manifest-builtin-dispatch
    desc: Fetches manifest beside builtin dispatch
    crit: suspicious
    conf: 0.98
    scope: file
    near_lines: 120
    all:
      - id: micro-behaviors/fs/path/metadata-store::python-manifest-json-filename
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
      - id: micro-behaviors/data/parse/json::json-loads-call
    any:
      - id: micro-behaviors/metaprogramming/reflection/invoke::python-getattr-builtin-call
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
