defaults:
  platforms: [windows, unix]
  for: [javascript]
  attack: T1189,T1105,T1059.007

composite_rules:
  # Injected-page loader (TDS style): the browser fetches a remote JSON tuple,
  # stores one element and compiles another with `new Function(...)()`, while
  # the page referrer is reported to the server so it can pick which visitors
  # receive code. Remote code selection keyed on visitor context, plus either
  # string-table concealment or a server-issued Web Storage token, has no
  # ordinary deployment shape. Hosts, key names and query fields are not gates.
  - id: visitor-context-fetch-json-function-loader
    desc: Fetched JSON code run with referrer context
    crit: hostile
    conf: 0.95
    size_max: 200000
    all:
      - id: micro-behaviors/communications/http/request/reference::js-fetch-invocation-surface
      - id: micro-behaviors/process/interpreter/eval/constructed::parsed-json-element-function-iife
      - id: micro-behaviors/communications/url/navigation-http::browser-referrer-property-reference
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: objectives/anti-static/obfuscation/eval/loader::obfuscated-function-constructor-payload
      - id: micro-behaviors/data/db/web-storage::dom-storage-bracket-accessor
      - id: micro-behaviors/data/db/read/key-value::dom-storage-getitem
