# Explicit transfers keep ciphertext (argument 2) separate from a remotely
# fetched key/IV (arguments 0/1). A fetch anywhere beside eval is insufficient.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.98
  attack: T1059.007

traits:
- id: http-response-eval
  desc: Evaluates HTTP response content as code
  if:
    type: symbol
    kind: call
    exact: eval
    arg:
      index: 0
      from:
        call: '^fetch$'
        through:
        - call: '\.(json|text|arrayBuffer)$'
          receiver: true
        - call: '^Buffer\.from$'
          arguments: [0]
        - call: '\.(subarray|slice|substring)$'
          receiver: true
        - call: '(^|\.)subtle\.decrypt$'
          arguments: [2]
        - call: '^TextDecoder\.decode$'
          arguments: [0]

- id: slack-history-response-eval
  desc: Evaluates Slack history response content
  if:
    type: symbol
    kind: call
    exact: eval
    arg:
      index: 0
      from:
        call: '^fetch$'
        literal: '^https://slack\.com/api/conversations\.history\b'
        through:
        - call: '\.json$'
          receiver: true
        - call: '^Buffer\.from$'
          arguments: [0]
        - call: '\.(subarray|slice)$'
          receiver: true
        - call: '(^|\.)subtle\.decrypt$'
          arguments: [2]
        - call: '^TextDecoder\.decode$'
          arguments: [0]

composite_rules:
- id: external-http-response-eval
  desc: Evaluates externally hosted HTTP content
  crit: suspicious
  conf: 0.95
  mbc: B0009.016
  near_bytes: 1400
  not:
  - substr: 'fromText eval for '
  - substr: 'dart2wasm'
  all:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: objectives/execution/payload/script-eval/network/in-process::http-response-eval
  any:
  - id: micro-behaviors/communications/url/encoded::encoded-http-url
  - id: metadata/lang/encoding/hex::js-dense-hex-escapes
  - id: micro-behaviors/communications/http/request/json::fetch-external-url
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  unless:
  - id: micro-behaviors/process/deploy/script-eval/network::fetch-near-content-eval
  - id: metadata/lang/source/syntax/call/relationship::preview-fetch-eval-context
  - id: micro-behaviors/communications/url/host/http::loopback-http-url-reference
