defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  attack: T1105
  mbc: E1105


composite_rules:
  - id: python-thread-exec-http-clues
    desc: Python HTTP and threaded exec clues
    crit: hostile
    conf: 0.97
    attack: T1105,T1059.006
    scope: file
    near_lines: 12
    all:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/process/thread/create::python-thread-target-exec
      - id: micro-behaviors/process/thread/create::python-thread-create
