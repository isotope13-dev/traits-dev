defaults:
  attack: T1105,T1059.006
  platforms: [linux, macos, windows, unix, android, ios]
  mbc: "B0030"


composite_rules:
  - id: python-http-response-import-exec
    desc: Python executes fetched HTTP response at import
    crit: hostile
    conf: 0.99
    for: [python]
    near_bytes: 192
    all:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/communications/http/client/response-body::python-client-response-body-cooccurrence
      - id: objectives/execution/interpreter/eval/remote::exec-text-attribute
      - id: micro-behaviors/process/interpreter/eval/python-builtins::module-scope-exec-builtin
  - id: python-requests-response-text-exec
    desc: Python exec() on requests GET response text
    crit: hostile
    conf: 0.98
    for: [python, whl, python-sdist]
    scope: file
    near_bytes: 2000
    all:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: objectives/execution/interpreter/eval/remote::exec-text-attribute
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
