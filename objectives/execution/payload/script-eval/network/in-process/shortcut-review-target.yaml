defaults:
  platforms: [windows]
  attack: T1204.002
  for: [lnk]

composite_rules:
  - id: minimized-powershell-download-execute
    desc: LNK minimizes a PowerShell download-and-evaluate chain
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1105
    all:
      - id: objectives/execution/payload/script-eval/network/stream::powershell-download-execute
      - id: "micro-behaviors/ui/window/state::lnk-minimized-inactive-window"
