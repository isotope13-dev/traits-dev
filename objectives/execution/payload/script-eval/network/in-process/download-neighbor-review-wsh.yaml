defaults:
  platforms: [windows]
  for: [html, vbs]
  attack: T1105

composite_rules:
  - id: wsh-xmlhttp-response-execute-downloader
    desc: WSH executes downloaded script text in memory
    crit: hostile
    conf: 0.98
    attack: T1059.005,T1105
    for: [vbs]
    all:
      - id: micro-behaviors/communications/http/client/xmlhttp::activex-http-progid
      - id: micro-behaviors/communications/http/client/vba::http-open-send
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
  - id: wsh-character-built-url-response-execution
    desc: WSH builds a URL from character codes and executes its response
    crit: hostile
    conf: 0.99
    attack: T1059.005,T1105,T1027
    for: [vbs]
    all:
      - id: micro-behaviors/communications/http/client/xmlhttp::activex-http-progid
      - id: micro-behaviors/communications/http/client/vba::http-open-send
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
      - id: micro-behaviors/data/encode/char-code::chr-wrapper-function
