defaults:
  platforms: [windows]
  for: [powershell]
  mbc: B0030
traits: []
composite_rules:
  - id: ps-irm-public-code-pipeline
    desc: One-line PowerShell fetches public code and runs it via IEX
    crit: hostile
    conf: 0.99
    attack: "T1059.001,T1105"
    for: [powershell, batch]
    all:
      - id: objectives/execution/payload/script-eval/network/response-body::powershell-rest-response-piped-eval-line
      - id: metadata/file/line::file-one-liner
    any:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::irm-jsdelivr-github-cdn-path
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::irm-jsonkeeper-path
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::irm-github-gist-path
  # The protocol-less host is distinctive here: it is still a remote fetch,
  # but a URL-literal-only extractor will not surface it as a URL.
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/app/productivity/ferronote::ferronote-windows-installer-context
      - id: well-known/app/ai/gateway/ollama::official-install-ps1-url
      - id: micro-behaviors/os/package-manager/install::bun-powershell-piped-installer-command
      - id: metadata/package/documentation/powershell-help::powershell-comment-help-piped-url-example
      - id: metadata/package/documentation/powershell-help::powershell-comment-help-irm-iex-example
      - id: well-known/app/communication/slack::official-install-windows-ps1-url
  - id: ps-iwr-public-code-pipeline
    desc: One-line IWR dropper executes public code via IEX
    crit: hostile
    conf: 0.99
    attack: "T1059.001,T1105"
    for: [powershell, batch]
    all:
      - id: objectives/execution/payload/script-eval/network/response-body::powershell-web-response-piped-eval-text
      - id: metadata/file/line::file-one-liner
    any:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::irm-jsdelivr-github-cdn-path
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::irm-jsonkeeper-path
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::irm-github-gist-path
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/app/productivity/ferronote::ferronote-windows-installer-context
      - id: well-known/app/ai/gateway/ollama::official-install-ps1-url
      - id: micro-behaviors/os/package-manager/install::bun-powershell-piped-installer-command
      - id: metadata/package/documentation/powershell-help::powershell-comment-help-piped-url-example
      - id: metadata/package/documentation/powershell-help::powershell-comment-help-irm-iex-example
      - id: well-known/app/communication/slack::official-install-windows-ps1-url
  - id: ps-irm-opaque-eval
    desc: IRM cradle evaluates code from an opaque URL token
    crit: hostile
    conf: 0.99
    attack: "T1059.001,T1105"
    all:
      - id: micro-behaviors/process/deploy/script-eval/network::powershell-irm-eval-text
      - id: micro-behaviors/communications/http/client/exchange::irm-opaque-path-reference
    near_bytes: 256
  - id: hidden-window-irm-eval
    desc: Hidden-window PowerShell evaluates an IRM response
    crit: suspicious
    conf: 0.98
    attack: "T1059.001,T1105,T1204.004"
    near_bytes: 256
    all:
      - id: micro-behaviors/process/deploy/script-eval/network::powershell-irm-eval-text
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-window
    any:
      - id: micro-behaviors/communications/http/client/library::useb-flag

  - id: clickfix-tracked-irm-cradle
    desc: IRM cradle with Verification ID trailer
    crit: suspicious
    conf: 0.97
    attack: "T1059.001,T1105,T1204.004"
    near_bytes: 200
    all:
      - id: micro-behaviors/process/deploy/script-eval/network::powershell-irm-eval-text
      - id: metadata/lang/source/comment::clickfix-verification-id-comment

  - id: clickfix-code-verification-irm-cradle
    desc: IRM cradle with Code Verification marker
    crit: hostile
    conf: 0.98
    attack: "T1059.001,T1105,T1204.004"
    for: [powershell, batch, html, javascript]
    near_bytes: 240
    all:
      - id: metadata/lang/source/comment::clickfix-code-verification-comment
    any:
      - id: micro-behaviors/process/deploy/script-eval/network::powershell-irm-eval-text
      - id: objectives/execution/payload/script-eval/network/response-body::embedded-iex-irm-call
      - id: objectives/execution/payload/script-eval/network/response-body::embedded-irm-iex-pipeline
# Tiny iex(irm …) cradles pointed at a raw IPv4 host — no DNS, no vendor CDN.
# Catches future ClickFix/one-liner stagers that skip http:// and pipe forms.
  - id: ps-irm-ipv4-eval
    desc: PowerShell IRM eval from raw IPv4 host
    crit: hostile
    conf: 0.99
    attack: "T1059.001,T1105"
    all:
      - id: micro-behaviors/process/deploy/script-eval/network::powershell-irm-eval-text
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::irm-external-ipv4-host
    near_bytes: 256
  - id: powershell-webclient-downloadstring-scriptblock-stager
    desc: PowerShell WebClient download into ScriptBlock execution
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.001
    all:
      - id: micro-behaviors/communications/http/client/webclient::powershell-webclient-download-evidence
      - id: micro-behaviors/metaprogramming/generation/function::powershell-scriptblock-constructor-text
    any:
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
      - id: micro-behaviors/process/interpreter/eval/constructed::powershell-invoke-scriptblock-command
      - id: micro-behaviors/process/interpreter/eval/constructed::powershell-scriptblock-invoke-method
      - id: micro-behaviors/process/create/path-execution::powershell-call-operator-target
    near_lines: 12
  - id: ps-network-eval-defender-exclusion
    desc: PowerShell network eval with Defender exclusion
    crit: hostile
    conf: 0.98
    attack: T1059.001
    all:
      - id: objectives/execution/payload/script-eval/network/response-body::powershell-web-response-piped-eval-text
      - id: micro-behaviors/os/security/defender::defender-exclusion-command

