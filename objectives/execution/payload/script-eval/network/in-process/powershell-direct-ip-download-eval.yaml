# Download cradle whose source is a raw external IP URL: the string is fetched
# and evaluated in one script, with no hostname to identify a vendor.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1059.001,T1105

composite_rules:
  - id: powershell-direct-ip-download-eval
    desc: PowerShell evaluates text fetched from raw IP
    crit: suspicious
    conf: 0.88
    near_lines: 8
    all:
      - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
      - id: micro-behaviors/communications/http/client/managed::powershell-downloadstring-call
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-expression-eval
