defaults:
  crit: hostile
  conf: 0.99
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
- id: node-obfuscated-remote-parser-vm-loader
  desc: JavaScript executes an HTTP response in a VM
  attack: T1105,T1059.007
  mbc: B0024
  # File-level co-occurrence alone does not establish remote execution.
  # Require a response accumulator that reaches VM execution as well.
  scope: file
  all:
  - id: objectives/execution/payload/script-eval/network/vm::node-http-response-executed-in-vm
  - id: micro-behaviors/data/parse/json::json-parse-call
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/data/string/conversion::fromcharcode-call
  - id: micro-behaviors/process/interpreter/vm::vm-runInContext
  - id: micro-behaviors/os/module/dynamic-load::node-variable-require-call

