defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007,T1105
  mbc: B0024,E1105
composite_rules:
  - id: node-http-response-executed-in-vm
    desc: Executes the HTTP response body in a Node VM
    crit: hostile
    conf: 0.95
    scope: file
    near_bytes: 2000
    all:
      - id: micro-behaviors/process/interpreter/vm::vm-runInContext
      - id: micro-behaviors/process/interpreter/vm::stream-buffer-vm-evaluation
      - id: metadata/lang/source/syntax/call/member::node-data-event-call-text
      - id: metadata/lang/source/syntax/call/member::node-end-event-call-text
      - id: micro-behaviors/communications/http/request/client::http-client-usage
    unless:
      # An empty context carries no host bindings, so the payload cannot
      # reach require, process, or fs -- the populated full-runtime shape
      # above does not apply (e.g. a validator engine run in a fresh
      # context). The notable vm-with-http combination still fires.
      - id: micro-behaviors/process/interpreter/vm::vm-createContext-no-args
