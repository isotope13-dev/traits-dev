defaults:
  platforms: [unix, windows]
  for: [text]
  attack: T1027,T1105,T1059.006
traits:
  - id: python-base64-requests-text
    desc: Base64 content calls requests.get and reads text
    crit: notable
    if:
      type: encoded
      encoding: base64
      regex: 'requests\.get\([^\n]{1,200}\)\.text'
  - id: python-base64-python-command
    desc: Base64 content launches Python with -c
    crit: notable
    if:
      type: encoded
      encoding: base64
      regex: 'subprocess\.Popen\(\s*\[\s*["'']python[0-9.]*["'']\s*,\s*["'']-c["'']'
composite_rules:
  - id: python-base64-fetch-and-python-command
    desc: Encoded Python fetches text and launches Python
    crit: hostile
    conf: 0.97
    scope: file
    near_bytes: 1024
    all:
      - id: python-base64-requests-text
      - id: python-base64-python-command
      - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
