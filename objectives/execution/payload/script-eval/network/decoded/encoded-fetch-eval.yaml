defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
composite_rules:
- id: encoded-eval-fetch-and-url-clues
  desc: Encoded evaluation with remote fetch clues
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/file/encoding/shape::encoded-eval-expression-reference
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
  unless:
  - id: objectives/execution/payload/script-eval/network/in-process::encoded-async-fetch-eval-loader
  - id: objectives/execution/payload/script-eval/network/in-process::encoded-vercel-fetch-eval-stager
  - id: metadata/path/directory::test-directory-component
