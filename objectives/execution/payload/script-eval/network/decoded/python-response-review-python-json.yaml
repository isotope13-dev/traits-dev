defaults:
  platforms:
    - windows
    - unix
  for:
    - python
  attack: T1105
  mbc: E1105
composite_rules:
  - id: json-message-base64-exec
    desc: Fetches base64 code from JSON and executes it
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/communications/http/client/response-body::python-response-json-call
      - id: micro-behaviors/data/collection/map::mapping-get-message-key
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
  # The five legs must share one code window: without proximity a large benign
  # application (e.g. a localhost MCP automation server that fetches JSON APIs,
  # decodes image payloads, and exposes a documented exec feature) satisfies
  # every leg thousands of lines apart with no data flow between them.
    near_lines: 40
  - id: urllib-json-payload-base64-exec
    desc: Fetches a JSON payload with urllib, decodes it, and executes it
    crit: hostile
    conf: 0.99
    attack: T1105, T1059.006, T1140
    all:
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/data/parse/json::json-loads-call
      - id: micro-behaviors/data/collection/map::python-payload-mapping-access
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
  # Same co-occurrence hazard as json-message-base64-exec above: the fetch,
  # decode, and exec legs must share one code window to establish a staging
  # chain rather than unrelated uses across a large file.
    near_lines: 40
  - id: checked-json-message-base64-exec
    desc: Validates HTTP response, extracts JSON payload, and executes decoded code
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/execution/payload/script-eval/network/decoded::json-message-base64-exec
      - id: micro-behaviors/communications/http/response::raise-for-status
    any:
      - id: micro-behaviors/data/decode/hex::python-fromhex
      - id: micro-behaviors/communications/url/scheme::hex-encoded-https
