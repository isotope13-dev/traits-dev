defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
  size_max: 2000000
composite_rules:
  - id: http-xor-helper-response-eval
    desc: HTTP, XOR and eval clues coexist
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/data/bitwise/xor-forms/scalar::xor-charcode-decoder-helper
      - id: micro-behaviors/communications/http/client/exchange::http-request-by-node-client
      - id: metadata/lang/source/syntax/call/member::node-data-event-call-text
      - id: metadata/lang/source/syntax/call/member::node-end-event-call-text
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call-of-decoder-result
