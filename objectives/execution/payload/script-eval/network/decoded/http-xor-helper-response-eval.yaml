defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
  size_max: 2000000

composite_rules:
  - id: xhr-xor-decoded-response-function-execution
    desc: JavaScript XOR-decodes an XMLHttpRequest response and executes it with Function
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.007,T1105
    all:
      - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-open
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::js-modulo-key-xor-byte-mask
      - id: micro-behaviors/metaprogramming/generation/function::js-function-ctor-call-text
    near_bytes: 4096

  - id: fetch-xor-script-element-execution
    desc: Fetches, XOR-decodes and appends a script payload
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.007,T1105
    all:
      - id: micro-behaviors/communications/http/client/response-body::fetch-response-body-read
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::js-modulo-key-xor-byte-mask
      - id: micro-behaviors/ui/window/insert-html::browser-appends-inline-script-body
    near_bytes: 4096

  - id: xhr-xor-script-element-execution
    desc: Reads an XMLHttpRequest response, XOR-decodes it and appends it as a script
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.007,T1105
    all:
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-open
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::js-modulo-key-xor-byte-mask
      - id: micro-behaviors/ui/window/insert-html::browser-appends-inline-script-body
    near_bytes: 4096

  - id: http-xor-helper-response-eval
    desc: HTTP, XOR and eval clues coexist
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/data/bitwise/xor-forms/scalar::xor-charcode-decoder-helper
      - id: micro-behaviors/communications/http/client/exchange::http-request-by-node-client
      - id: metadata/lang/source/syntax/call/member::node-data-event-call-text
      - id: metadata/lang/source/syntax/call/member::node-end-event-call-text
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call-of-decoder-result
