defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  attack: T1105
  mbc: E1105


composite_rules:
  - id: python-http-base64-exec-clues
    desc: Python HTTP and Base64 execution clues
    crit: hostile
    conf: 0.97
    attack: T1105,T1027,T1059.006
    mbc: B0032,E1105
    all:
      - id: micro-behaviors/process/interpreter/eval/python-builtins::python-exec-base64-result
    any:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/process/deploy/script-eval/network::urlopen-before-exec
    unless:
      - id: metadata/package/testing/presence/harness::verified-python-test-file
  # Rust integration tests may embed Python snippets as planted search
  # fixtures; those strings are test input, not a remote payload loader.
      - id: metadata/package/testing/presence/harness::rust-tests-directory-path
      - id: well-known/tool/detection/agent/skill-scanner::cisco-skill-scanner-archive-context
