defaults:
  attack: T1105
  mbc: B0024
  for:
    - javascript
  platforms:
    - windows
composite_rules:
  - id: activex-xmlhttp-marker-remote-eval
    desc: ActiveX XMLHTTP marker-rewritten remote eval
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/payload/script-eval/network/response-body::activex-http-response-eval
      - id: objectives/anti-static/obfuscation/string/fragmentation::js-response-split-join-marker
      - id: objectives/anti-static/obfuscation/string/fragmentation::js-join-substring-char
  - id: base-title-fetch-base64-eval
    desc: Base-title, fetched response and Base64 eval
    crit: hostile
    conf: 0.97
    attack: T1105,T1059.007
    near_bytes: 1024
    all:
      - id: metadata/lang/source/literal/string/property::base-title-attribute-or-encoded-text
      - id: micro-behaviors/communications/http/client/response-body::fetch-response-body-read
      - id: micro-behaviors/data/decode/base64/unspecified::atob-decode
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-call-expression-arg
