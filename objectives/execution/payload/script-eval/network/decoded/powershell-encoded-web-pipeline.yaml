defaults:
  platforms: [windows, unix]
  for: [powershell]
  attack: T1059.001,T1027,T1105

traits:
  - id: powershell-encoded-command-literal
    desc: PowerShell launch takes literal encoded command
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((command
          command_name: (command_name) @launcher
          command_elements: (command_elements
            (command_parameter) @flag
            . (command_argument_sep)
            . [(generic_token) (array_literal_expression)] @evidence))
         (#match? @launcher "(?i)^(powershell|pwsh)(\\.exe)?$")
         (#match? @flag "(?i)^-(e|enc|encodedcommand)$")
         (#match? @evidence "^[\"']?[A-Za-z0-9+/]{16,}={0,2}[\"']?$"))

  - id: encoded-web-response-eval-pipeline
    desc: Encoded PowerShell evaluates a web response
    crit: notable
    conf: 0.97
    if:
      type: encoded
      encoding: base64
      regex: '(?im)^\s*(irm|Invoke-RestMethod)\b[^\r\n|]{0,120}\|\s*(iex|Invoke-Expression)\b'

composite_rules:
  - id: powershell-launches-encoded-web-pipeline
    desc: PowerShell launches encoded web response evaluation
    crit: hostile
    conf: 0.97
    scope: leaf
    # Decoded evidence starts inside the literal's optional opening quote.
    near_bytes: 1
    all:
      - id: encoded-web-response-eval-pipeline
      - id: powershell-encoded-command-literal
