defaults:
  for: [python]
  platforms: [windows, unix]
traits:
  - id: encoded-jenkins-http-text-execution
    desc: Encoded Jenkins check and HTTP text execution
    crit: suspicious
    unless:
      - type: encoded
        encoding: base64
        regex: 'https?://(localhost|127[.]|10[.]|192[.]168[.])'
      - type: encoded
        encoding: base64
        regex: 'https?://(\[::1\]|169[.]254[.])'
      - type: encoded
        encoding: base64
        regex: 'https?://172[.](1[6-9]|2[0-9]|3[01])[.]'
      - type: encoded
        encoding: base64
        regex: 'https?://[^/\s"'']{1,120}[.](invalid|test)(/|["''])'
      - type: encoded
        encoding: base64
        regex: 'https?://(www[.])?example[.](com|org|net)(/|["''])'
    if:
      type: encoded
      encoding: base64
      regex: '(?s)if.{0,4}JENKINS_URL.{0,8}in\s+os\.environ.{0,120}requests\.get.{0,80}exec\(\w+\.text'
composite_rules:
  - id: encoded-jenkins-gated-http-exec
    desc: Encoded source checks Jenkins and executes HTTP text
    crit: hostile
    conf: 0.98
    attack: T1059.006,T1105,T1027
    all:
      - id: encoded-jenkins-http-text-execution
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
