defaults:
  for: [powershell, batch]
  platforms: [windows]
  attack: T1027
  mbc: C0025
composite_rules:
  - id: ps-iwr-aes-scriptblock-stage-loader
    desc: PowerShell downloads AES ciphertext and runs decrypted ScriptBlock
    crit: hostile
    conf: 0.99
    attack: T1105,T1027,T1059.001
    mbc: C0025,B0030,E1059
    for: [powershell]
    all:
      - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
      - id: micro-behaviors/fs/read/file/content/bytes::powershell-file-readallbytes
      - id: micro-behaviors/metaprogramming/generation/function::powershell-scriptblock-constructor-text
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::download
    any:
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/process/info/name::windows-script-host-executable-reference
    needs: 1
  - id: ps-remote-base64-xor-inmemory-loader
    desc: PowerShell downloads and evaluates a Base64/XOR stage
    crit: hostile
    conf: 0.99
    attack: T1105,T1140,T1027,T1059.001
    mbc: B0030,B0032,E1059
    for: [powershell]
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::powershell-modulo-xor-references
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call

