---
defaults:
  platforms:
  - windows
  for:
  - powershell
traits:
- id: base64-irm-opaque-useragent-pipeline
  desc: Decoded IRM-to-IEX opaque User-Agent pipeline
  crit: notable
  conf: 0.97
  if:
    type: encoded
    encoding: base64
    regex: (?i)\birm\s[^|\r\n]{1,160}-UserAgent\s+["'][a-z]{80,256}["']\s*\|\s*iex\b
composite_rules:
- id: base64-webclient-opaque-useragent-source
  desc: Encoded stage fetches and evaluates response with opaque User-Agent
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/client/managed::encoded-stage-webclient-constructor
  - id: micro-behaviors/communications/http/header/user-agent-read::encoded-stage-opaque-useragent-value
  - id: micro-behaviors/communications/http/client/managed::encoded-stage-useragent-header-use
  - id: micro-behaviors/communications/http/download/webclient::encoded-stage-downloadstring-into-script
  - id: micro-behaviors/process/interpreter/eval/decoded::encoded-stage-iex-script-variable
  near_bytes: 1
