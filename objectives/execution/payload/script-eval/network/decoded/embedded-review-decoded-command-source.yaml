defaults:
  platforms:
    - windows
  for:
    - scripts
    - source
    - class
    - java_class
  crit: hostile
composite_rules:
  - id: powershell-base64-nested-ip-eval-stager
    desc: Base64 PowerShell wrapper evaluates nested IP stager
    conf: 0.98
    for:
      - powershell
    attack: T1027,T1140,T1059.001,T1105
    mbc: B0030,B0032,E1059
    near_lines: 10
    all:
      - id: micro-behaviors/data/decode/base64::powershell-frombase64string
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
      - id: metadata/file/profile/eval-reference::base64-powershell-eval-command
      - id: micro-behaviors/communications/url/host/oob-http::url-external-ip-encoded
