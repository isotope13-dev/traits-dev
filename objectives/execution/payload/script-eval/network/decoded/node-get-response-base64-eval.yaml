defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105,T1059.007,T1140
  mbc: E1105.016
composite_rules:
  # The Agama/electron-native-notify loader shape: a GET callback's `data`
  # handler Base64-decodes the reply and hands it to eval. Each leg is an
  # ordinary capability; the loader is their co-location, which fits in a
  # few hundred bytes. Byte proximity, not lines: bundles are one line.
  - id: node-get-response-base64-eval
    desc: HTTP GET response data is Base64-decoded and evaluated
    crit: hostile
    conf: 0.96
    scope: file
    near_bytes: 600
    all:
      - id: micro-behaviors/communications/http/request/evented::node-evented-get-response
      - id: micro-behaviors/process/deploy/script-eval/transformed::base64-eval-proximity
