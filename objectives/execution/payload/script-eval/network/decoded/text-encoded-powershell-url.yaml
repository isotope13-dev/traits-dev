defaults:
  platforms: [windows]
  for: [text]
  attack: T1059.001,T1027,T1105

composite_rules:
  - id: encoded-powershell-http-stage-text
    desc: Encoded PowerShell command carries Base64 HTTP stage URL
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/deploy/interpreter-command::text-powershell-encoded-command
      - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
