defaults:
  platforms: [unix, windows]
  for: [python]
  crit: hostile
  attack: T1027,T1059.006,T1105
composite_rules:
  - id: python-image-response-code-execution
    desc: Executes decoded image-masqueraded HTTP code
    conf: 0.99
    all:
      - id: micro-behaviors/process/deploy/script-eval/network::python-image-response-decoded-exec
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
