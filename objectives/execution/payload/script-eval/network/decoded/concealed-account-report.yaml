defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: concealed-account-reporting-response-eval
    desc: Concealed account-reporting request evaluates remote response
    crit: hostile
    conf: 0.97
    attack: T1059.001,T1105
    near_bytes: 256
    all:
      - id: objectives/exfiltration/stealer/system-info/account::concealed-powershell-account-report
      - id: micro-behaviors/process/deploy/script-eval/network::powershell-inline-downloadstring-eval
