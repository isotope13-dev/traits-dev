defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1105,T1059.006,T1027
traits:
  - id: python-encoded-url-conditional-source-exec
    desc: Executes encoded-URL response after a check
    crit: hostile
    conf: 0.97
    if:
      type: tree-sitter
      language: python
      query: |
        ((block
          (expression_statement (assignment left: (identifier) @source
            right: (call function: (attribute
              object: (call function: (attribute
                object: (call function: (identifier) @fetch
                  arguments: (argument_list (call function: (attribute
                    object: (identifier) @base64 attribute: (identifier) @b64decode)
                    arguments: (argument_list (string)))))
                attribute: (identifier) @read))
              attribute: (identifier) @decode))))
          (if_statement consequence: (block
            (expression_statement (call function: (identifier) @exec
              arguments: (argument_list (identifier) @source_used))))))
          (#eq? @fetch "urlopen")
          (#eq? @base64 "base64")
          (#eq? @b64decode "b64decode")
          (#eq? @read "read")
          (#eq? @decode "decode")
          (#eq? @exec "exec")
          (#eq? @source @source_used))
