defaults:
  platforms: [windows, unix]
  for: [powershell]
  attack: T1059.001,T1105

composite_rules:
  - id: powershell-utf8-decoded-webresponse-eval
    desc: UTF-8 decodes web response bytes into IEX
    crit: suspicious
    conf: 0.95
    near_lines: 12
    all:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
      - id: micro-behaviors/data/property/access::powershell-parenthesized-content-member
      - id: micro-behaviors/data/decode/charset::powershell-utf8-getstring
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-expression-eval
    unless:
      - id: well-known/app/media/spotx::spotx-context
