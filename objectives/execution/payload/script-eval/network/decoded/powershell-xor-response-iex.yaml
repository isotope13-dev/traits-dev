# A PowerShell stager reads an HTTP response, XOR-decrypts it byte by byte,
# and hands the decoded text to Invoke-Expression. The XOR keeps the payload
# opaque to network inspection and to file scanners; running decrypted
# server content is a loader regardless of what the server returns.
# Seen in the Vinci RAT stager (eSentire, 2026-11): hex-encoded body,
# 4-byte key from the Trace-Id request header.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027,T1059.001,T1105

composite_rules:
  - id: powershell-xor-decrypted-response-iex
    desc: XOR-decrypts an HTTP response and runs it with Invoke-Expression
    crit: hostile
    conf: 0.97
    ref: https://www.esentire.com/blog/vinci-rat-lives-in-the-microsoft-store
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/client/response-body
      - id: micro-behaviors/data/bitwise/mixed::powershell-xor-operator
    any:
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-argument-getstring
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-getstring-piped-to-iex
