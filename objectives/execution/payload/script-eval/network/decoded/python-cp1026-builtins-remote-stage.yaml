defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1027.009,T1105,T1059.006
  mbc: E1105

composite_rules:
  - id: python-cp1026-obfuscated-remote-exec
    desc: Python contains a CP1026-obfuscated remote-code loader
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: objectives/anti-static/obfuscation/eval/scripting/decode::getattr-builtins-bitwise
      - id: micro-behaviors/data/decode/charset::python-ebcdic-escaped-bytes-literal-decode
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
