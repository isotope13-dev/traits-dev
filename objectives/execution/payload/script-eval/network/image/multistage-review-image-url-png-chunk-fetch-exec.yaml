defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
- id: image-url-png-chunk-fetch-exec
  desc: Image URL, PNG parsing and Python execution
  crit: hostile
  conf: 0.99
  for:
  - python
  - python-sdist
  - tar
  attack: T1105,T1027.003,T1059.006
  mbc: B0032
  near_lines: 100
  all:
  - id: micro-behaviors/communications/url/resource-path/media::image-file-url
  - id: micro-behaviors/data/format/media/raster::png-chunk-parser
  - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
  any:
  - id: micro-behaviors/communications/http/request/client/
  - id: micro-behaviors/communications/http/request/url::requests-get-url-literal
  - id: micro-behaviors/communications/http/request/url-computed::requests-post-metadata-url
  - id: micro-behaviors/communications/http/request/url::urllib-url-literal
  - id: micro-behaviors/communications/http/request/agent-control::python-urlopen-agent-endpoint
  - id: micro-behaviors/communications/http/request/url::python-column0-requests-get
  - id: micro-behaviors/communications/http/request/url-computed::python-fstring-url-get
  - id: micro-behaviors/communications/http/request/url::python-client-url-literal
  - id: micro-behaviors/communications/http/request/verb::python-http-post-any
  - id: micro-behaviors/communications/http/request/verb::httpx-client-post-request
  - id: micro-behaviors/communications/http/request/oob::webhook-site-source-call
  - id: micro-behaviors/communications/http/request/executable-resource/
  - id: micro-behaviors/communications/http/client/response-body::response-stream-python
  - id: micro-behaviors/communications/http/lib/
  - id: micro-behaviors/communications/http/client/exchange::urllib-word
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
  - id: micro-behaviors/communications/http/client/initialize::urllib-request-symbol
  - id: micro-behaviors/communications/http/client/initialize::urllib-request-data-body
  - id: micro-behaviors/communications/http/client/response-body::urlopen-response-body-read
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
  - id: micro-behaviors/communications/http/response::raise-for-status
  - id: micro-behaviors/communications/http/get::requests-get
  unless:
  - id: micro-behaviors/data/format/media/raster::python-imaging-library-import
  - id: metadata/path/directory::test-directory-component
