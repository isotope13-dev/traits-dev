defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
- id: image-url-png-chunk-fetch-exec
  desc: Image URL and PNG chunk markers near Python execution
  crit: hostile
  conf: 0.99
  # Network, parser, and execution must belong to the same Python source.
  # Archive pooling joined independent libraries and embedded scripts.
  scope: leaf
  attack: T1105,T1027.003,T1059.006
  mbc: B0032
  near_lines: 100
  all:
  - id: micro-behaviors/communications/url/resource-path/media::image-file-url
  - id: micro-behaviors/data/format/media/raster::png-chunk-parser
  - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
  # A library import or the word urllib cannot prove a transfer.
  any:
  - id: micro-behaviors/communications/http/get::requests-get
  - id: micro-behaviors/communications/http/request/httpx/
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
  - id: micro-behaviors/communications/http/client/exchange::python-http-client-request
  - id: micro-behaviors/communications/http/request/verb::python-http-post-any
  unless:
  - id: micro-behaviors/data/format/media/raster::python-imaging-library-import
  - id: metadata/path/directory::test-directory-component
