defaults:
  platforms: [windows]
  for: [zip, npm, tar, package.json, javascript]
  attack: T1195.002,T1218.005

traits:
  - id: js-exec-remote-mshta-url
    desc: Launches remote URL using mshta
    crit: suspicious
    for: [javascript]
    if:
      type: text
      regex: '(?i)mshta\.exe["'']?\s+https?://[^\s"'']{4,200}'

  - id: js-child-process-exec-command
    desc: Executes command through child process
    crit: component
    for: [javascript]
    if:
      type: text
      regex: '\bexec\s*\(\s*command\s*[,)]'

composite_rules:
  - id: npm-install-remote-mshta-launch
    desc: Install hook launches remote mshta payload
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: js-exec-remote-mshta-url
      - id: js-child-process-exec-command
