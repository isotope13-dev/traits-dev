defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
composite_rules:
  - id: node-https-socket-base64-eval
    desc: Node HTTPS, socket data and Base64 eval clues
    crit: hostile
    conf: 0.95
    attack: T1059.007
    mbc: B0024
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/communications/http/request/client::node-https-get-dynamic
      - id: micro-behaviors/communications/socket/receive::node-socket-data-event
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
      - id: micro-behaviors/data/encoding/base64::node-base64-buffer-clues
