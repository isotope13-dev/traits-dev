defaults:
  platforms: [windows]
  attack: "T1204.002"
  for: [lnk]

composite_rules:
- id: powershell-download-execute
  desc: LNK PowerShell downloads and evaluates remote content
  crit: hostile
  conf: 0.98
  attack: T1059.001,T1105
  all:
  - id: micro-behaviors/process/config/target::lnk-powershell-family
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::kv-powershell-download-command
  - id: micro-behaviors/process/interpreter/eval/constructed::kv-powershell-pipeline-evaluator
