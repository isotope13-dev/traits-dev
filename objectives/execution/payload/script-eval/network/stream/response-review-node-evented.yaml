defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105,T1059.007
  mbc: E1105.016
composite_rules:
  - id: node-evented-get-chunk-eval
    desc: HTTP response chunks are evaluated
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/deploy/script-eval/input::node-get-response-chunk-eval
    any:
      - id: metadata/import/builtin::require-https
      - id: metadata/import/builtin::require-http
      - id: metadata/import/npm/https
      - id: metadata/import/npm/http

  # Proximity is measured in BYTES, not lines: a webpack/ncc bundle is one
  # physical line, so `near_lines` imposed no constraint at all there and the
  # legs were free to match megabytes apart -- Next.js's compiled
  # `edge-runtime/index.js` carries an unrelated `https.get`, an unrelated
  # `res.on('end')` and an unrelated `eval(<var>)` in one 525 KB line. The
  # loader this rule describes fits in a few hundred bytes.
  - id: node-evented-get-remote-eval
    desc: Evented HTTP GET response body is evaluated
    crit: hostile
    conf: 0.96
    scope: file
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/http/request/evented::node-evented-get-response
      - id: metadata/lang/source/syntax/call/member::node-end-event-call-text
    any:
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-variable-argument
      - id: objectives/execution/interpreter/eval/remote::js-eval-message-data

  - id: target-gated-remote-code-loader
    desc: Target-software gate guards a remote-code loader
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: objectives/execution/payload/script-eval/network/stream::node-evented-get-remote-eval
      - id: objectives/discovery/host/process::high-value-software-presence-gate

  # Parenthesized JSON-style eval is an unsafe response parser; it does not
  # by itself establish that the extension intentionally loads remote code.
