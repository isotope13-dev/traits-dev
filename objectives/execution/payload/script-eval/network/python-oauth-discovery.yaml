defaults:
  for:
  - python
  platforms:
  - unix
  - windows
composite_rules:
- id: oauth-command-url-http-payload
  desc: OAuth command-bearing GET data accompanies HTTP response writes
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/execution/exploit/command-injection::oauth-authorization-endpoint-command-injection
  - id: micro-behaviors/communications/http/server/response::python-get-handler-oauth-command-data
  - id: micro-behaviors/communications/http/server/request::python-http-response-body-write
  unless:
  - id: metadata/lang/source/shape::python-literal-module-quoted-source
