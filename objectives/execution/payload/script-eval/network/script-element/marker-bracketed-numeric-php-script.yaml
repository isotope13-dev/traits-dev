defaults:
  platforms: [windows, unix]
  for: [html]


composite_rules:
  - id: marker-bracketed-numeric-php-script
    desc: HTML markers and plaintext PHP URL clues
    crit: suspicious
    conf: 0.98
    near_bytes: 512
    all:
      - id: metadata/document/html/markup::hex-comment-framed-script-block
      - id: micro-behaviors/communications/url/resource-path/file::remote-php-script-numeric-id
      - id: micro-behaviors/communications/http/client/script::plaintext-http-script-element-source
      - id: micro-behaviors/communications/http/client/script::remote-script-element-source
