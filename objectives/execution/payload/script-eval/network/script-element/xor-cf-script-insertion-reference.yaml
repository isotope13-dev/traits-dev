defaults:
  platforms: [windows, unix]
  for: [html]

traits:
- id: xor-cf-script-insertion-reference
  desc: XOR-encoded cf.js insertion code
  crit: suspicious
  conf: 0.95
  if:
    type: encoded
    encoding: xor
    regex: createElement\(['"]script['"]\)[\s\S]{0,220}cf\.js\?v=1[\s\S]{0,220}appendChild
