defaults:
  platforms: [windows, unix]
  for: [javascript]

composite_rules:
  - id: email-variable-encoded-script-element-clues
    desc: Email variable and encoded script element clues
    crit: suspicious
    conf: 0.96
    for: [html]
    all:
      - id: micro-behaviors/ui/controls/input::email-assigned-variable
      - id: micro-behaviors/communications/http/client/script::base64-encoded-script-element
