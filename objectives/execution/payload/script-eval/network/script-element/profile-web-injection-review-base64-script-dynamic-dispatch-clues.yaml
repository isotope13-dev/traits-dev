defaults:
  platforms: [windows, unix]
  attack: T1105
composite_rules:
  - id: base64-script-dynamic-dispatch-clues
    desc: Base64 script markup and dynamic dispatch
    crit: suspicious
    conf: 0.96
    attack: T1105,T1189,T1027
    for: [html, javascript]
    all:
      - id: micro-behaviors/communications/http/client/script::base64-encoded-script-element
    any:
      - id: micro-behaviors/ui/controls/input::email-assigned-variable
      - id: micro-behaviors/data/control-flow/dispatch/computed::js-computed-property-call
