defaults:
  platforms:
  - windows
  for:
  - html
  crit: hostile

composite_rules:
- id: offscreen-hta-fragment-append-clues
  crit: suspicious
  desc: Off-screen HTA with scheme fragment and DOM append
  conf: 0.98
  all:
  - id: metadata/file/extension/identity::hta-html-application-extension
  - id: micro-behaviors/ui/window/control::window-offscreen-or-trivial-resize
  - id: micro-behaviors/communications/url/construction/fragment::split-scheme-separator-fragment
  any:
  - id: micro-behaviors/data/collection/dom::source-append-child-call
  - id: micro-behaviors/data/collection/dom::html-text-append-child-call
