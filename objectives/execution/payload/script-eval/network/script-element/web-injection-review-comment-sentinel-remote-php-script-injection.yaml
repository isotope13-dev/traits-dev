defaults:
  platforms: [windows, unix]
  attack: T1105
composite_rules:
  - id: comment-sentinel-remote-php-script-injection
    desc: HTML comment markers bracket an external PHP script element
    crit: hostile
    conf: 0.98
    for: [html]
    attack: T1189,T1105
    near_bytes: 300
    all:
      - id: metadata/file/comment::comment-sentinel-before-script
      - id: micro-behaviors/communications/url/path::remote-php-script-numeric-id
      - id: metadata/file/comment::comment-sentinel-after-script
      - id: micro-behaviors/communications/http/client/script::external-script-element-load
      - id: micro-behaviors/communications/http/client/script::remote-script-element-source

  # Paired comment sentinels enclosing an inline script block that reconstructs
  # characters via an indexed array decode loop and evaluates them via an eval
  # alias or bracket lookup.
