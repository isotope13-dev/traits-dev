defaults:
  platforms: [windows, unix]
  attack: T1105
composite_rules:
  - id: financial-page-remote-loader
    desc: Financial-page gate delivers a remote script stage
    crit: hostile
    conf: 0.96
    attack: T1105,T1189
    for: [javascript]
    all:
      - id: micro-behaviors/communications/url/navigation-http::financial-page-gate
      - id: micro-behaviors/communications/http/client/script::js-remote-script-element
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
    unless:

  # Packed page-script dropper: a packed eval beside a remote script-src
  # assignment in the same script. Legitimate pages rarely pack scripts with
  # Dean Edwards anymore; a packed script that pulls remote code has no
  # legitimate use.
      - id: metadata/path/directory::test-directory-component
