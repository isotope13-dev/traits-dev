defaults:
  platforms: [windows, unix]
  attack: T1105
composite_rules:
  - id: financial-page-remote-loader
    desc: Financial-page gate delivers a remote script stage
    crit: hostile
    conf: 0.96
    attack: T1105,T1189
    for: [javascript]
    all:
      - id: micro-behaviors/communications/url/navigation-http::financial-page-gate
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
    # The script element is created in plain code, or (StatCounter, 2018)
    # only inside a Packer table beside the packed page gate.
    any:
      - id: micro-behaviors/communications/http/client/script::js-remote-script-element
      - id: micro-behaviors/communications/http/client/script::packer-table-script-element-source
    unless:
      - id: metadata/path/directory::test-directory-component
