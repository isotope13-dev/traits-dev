defaults:
  for: [javascript]
  platforms: [windows, unix]
  crit: notable

traits:
  - id: ios-user-agent-check
    desc: Checks userAgent for iOS devices
    crit: component
    if:
      type: text
      substr: iPhone|iPad|iPod

  - id: create-script-element
    desc: Creates a DOM script element
    crit: component
    if:
      type: text
      regex: 'createElement\(["'']script["'']\)'

  - id: append-script-to-dom
    desc: Appends element to document DOM
    crit: component
    if:
      type: text
      substr: .appendChild(

composite_rules:
  - id: ios-targeted-remote-script-injection
    desc: iOS-targeted remote script injection loader
    crit: hostile
    conf: 0.95
    attack: T1059.007
    size_max: 4096
    all:
      - id: ios-user-agent-check
      - id: create-script-element
      - id: append-script-to-dom
      - id: micro-behaviors/communications/url/
