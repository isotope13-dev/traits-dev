defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1105


composite_rules:
  - id: mutable-branch-remote-html-execution
    for: [javascript]
    desc: Auto-executes remote scripts from mutable branch
    attack: T1105,T1059.007
    all:
      - id: objectives/execution/payload/script-eval/network/script-element::remote-html-script-rehydration
      - id: micro-behaviors/communications/url/path::mutable-raw-branch-path
      - id: micro-behaviors/data/control-flow/module-exec::js-async-iife-import-hook
    near_bytes: 4096
