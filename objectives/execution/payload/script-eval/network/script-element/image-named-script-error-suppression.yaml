defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  - javascript
composite_rules:
- id: image-named-script-error-suppression
  desc: Image-named scripts with error suppression
  crit: suspicious
  conf: 0.97
  near_bytes: 400
  all:
  - id: objectives/execution/payload/script-eval/network/script-element::repeated-image-named-script-sources
  - id: micro-behaviors/data/control-flow/error-handling/suppress::onerror-after-return-true
