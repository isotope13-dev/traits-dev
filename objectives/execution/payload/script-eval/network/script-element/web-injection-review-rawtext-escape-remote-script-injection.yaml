defaults:
  platforms: [windows, unix]
  attack: T1189,T1105
composite_rules:
  # Raw-text escape injection payload: one attribute value closes a
  # raw-text/RCDATA element (`</title>`), plants a script element that
  # loads code from a remote host, closes it, and reopens the same class of
  # element (`<title>`) before the quote ends. Every step serves a single
  # purpose — make attacker-hosted code run wherever the template prints the
  # value inside a title or textarea, while keeping that page rendering. No
  # authored content needs this framing. The copy printed in this attribute
  # is quoted-inert: it does not escape the attribute or execute in this file.
  # Reflection into a compatible context is not established, so the finding
  # remains suspicious. A breakout through ordinary
  # elements (`</div>`), or one without the reopening tag, stays with the
  # suspicious sandwich and attribute-script rules.
  - id: rawtext-escape-remote-script-injection
    desc: Raw-text escape payload with remote loader
    crit: suspicious
    conf: 0.95
    for: [html]
    near_bytes: 320
    all:
      - id: micro-behaviors/communications/http/client/script::attribute-value-rawtext-closer-script
      - id: micro-behaviors/communications/http/client/script::attribute-value-script-rawtext-reopen
      - id: micro-behaviors/communications/http/client/script::external-script-element-load
