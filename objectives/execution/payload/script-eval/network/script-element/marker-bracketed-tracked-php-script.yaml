defaults:
  platforms: [windows, unix]
  for: [html]


composite_rules:
  - id: marker-bracketed-tracked-php-script
    desc: HTML markers and tracked PHP script URL
    crit: suspicious
    conf: 0.95
    near_bytes: 1024
    all:
      - id: metadata/document/html/markup::hex-comment-framed-script-block
      - id: micro-behaviors/communications/http/client/script::tracked-php-remote-script-src
      - id: micro-behaviors/communications/http/client/script::external-script-element-load
