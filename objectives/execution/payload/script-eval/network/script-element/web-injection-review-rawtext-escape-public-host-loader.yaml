defaults:
  platforms: [windows, unix]
  attack: T1189,T1105
composite_rules:
  # Deliverable raw-text escape loader: the complete RCDATA breakout payload
  # (attribute value closes title/textarea/style/xmp, plants a script
  # element, closes it, reopens the element) whose script src names a
  # resolvable public host. rawtext-escape-remote-script-injection stays
  # suspicious for quoted copies aimed at reserved test names, which cannot
  # fetch code. Pointing the same framing at a live host is what a stored-XSS
  # mass injection plants in a site's database (2011-era osCommerce
  # STORE_NAME loader): attacker-chosen remote code wired to run wherever the
  # template prints the value inside a title or textarea. The copy printed
  # in this attribute is quoted-inert, so the finding claims a planted
  # remote loader (site compromise), not execution in this file.
  # near_bytes keeps all legs on the one injected value.
  - id: rawtext-escape-public-host-loader
    desc: Raw-text escape plants loader from a public host
    crit: hostile
    conf: 0.93
    for: [html]
    near_bytes: 320
    all:
      - id: micro-behaviors/communications/http/client/script::attribute-value-rawtext-closer-script
      - id: micro-behaviors/communications/http/client/script::attribute-value-script-rawtext-reopen
      - id: micro-behaviors/communications/http/client/script::external-script-element-load
      - id: micro-behaviors/communications/http/client/script::rawtext-closer-public-host-script
