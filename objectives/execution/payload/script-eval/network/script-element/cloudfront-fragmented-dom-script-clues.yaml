defaults:
  platforms: [windows, unix]
  for: [javascript]

composite_rules:
  - id: cloudfront-fragmented-dom-script-clues
    desc: CloudFront URL and fragmented DOM script clues
    crit: suspicious
    conf: 0.96
    all:
      - id: well-known/app/infrastructure/content-delivery/amazon-cloudfront::cloudfront-asset-url
      - id: metadata/lang/source/literal/string/expression::createelement-fragment-teel
      - id: metadata/lang/source/literal/string/expression::js-dom-script-literal
      - id: metadata/lang/source/literal/string/label::src-string-literal
      - id: "metadata/lang/source/naming/function/runtime::append-child-literal"
      - id: micro-behaviors/data/bitwise/xor-forms/scalar::js-xor-charcode-assignment
