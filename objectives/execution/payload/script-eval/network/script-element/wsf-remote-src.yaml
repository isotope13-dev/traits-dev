# A Windows Script File (<job> root) whose <script> element takes its code
# from an http(s) src. wscript downloads and runs that code with the user's
# full rights: the file on disk is only a pointer to a remote payload. WSF
# jobs that ship with software reference local .vbs/.js files.
defaults:
  platforms: [windows]
  for: [vbs, html, javascript]
  attack: T1059.005,T1105

composite_rules:
  - id: wsf-job-runs-remote-script-src
    desc: WSF job runs script from a URL
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/interpreter/eval/source::http-script-source-tag
      - id: metadata/file/format/markup::wsh-job-root-tag
