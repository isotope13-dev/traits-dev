defaults:
  platforms: [windows, unix]
  for: [javascript]

composite_rules:
  - id: base64-xor-constructor-script-src-clues
    desc: Base64, XOR, constructor and script-source clues
    crit: suspicious
    conf: 0.99
    for: [javascript, npm, tar]
    scope: leaf
    all:
      - id: micro-behaviors/data/decode/base64/unspecified::atob-decode
      - id: micro-behaviors/data/bitwise/xor-forms/scalar::js-xor-charcode-assignment
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::js-byte-array-xor-modulo-key-loop
      - id: micro-behaviors/metaprogramming/generation/function::js-new-function-constructor
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
    near_bytes: 4096
