defaults:
  platforms: [windows, unix]
  attack: T1105
composite_rules:
  - id: extension-contextual-remote-script-loader
    desc: Extension assembles and injects a remote script
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.001
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/collection/dom::js-contextual-script-markup-injection
      - id: micro-behaviors/communications/url/construction/fragment::js-split-http-url-construction
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-api
      - id: micro-behaviors/data/db/read/key-value::chrome-storage-local-get
    near_bytes: 4096
