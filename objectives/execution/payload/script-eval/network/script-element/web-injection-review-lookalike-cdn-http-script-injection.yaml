defaults:
  platforms: [windows, unix]
  attack: T1105
composite_rules:
  - id: lookalike-cdn-http-script-injection
    desc: Lookalike CDN host serves page scripts over HTTP
    crit: hostile
    conf: 0.95
    attack: T1189,T1105
    for: [html]
    near_bytes: 300
    all:
      - id: objectives/evasion/masquerade/brand/cdn::cdnjs-path-lookalike-host
      - id: micro-behaviors/communications/http/client/script::plaintext-http-script-element-source
