defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1189,T1105,T1027
  mbc: B0024
composite_rules:
  - id: referrer-gated-encoded-script-injector
    desc: Referrer-gated decode drives remote script injection
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/url/navigation-http::browser-document-referrer-conditional
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decode-call-text
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
    any:
      - id: micro-behaviors/data/collection/dom::insert-before-call
      - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
    # Bind the gate to the delivery: without proximity, unrelated utilities
    # co-occurring in one large bundle (analytics referrer checks, a generic
    # base64 helper, a JS/CSS loader, a stylesheet insertBefore) convict.
    near_bytes: 2400

  # Packed legacy injectors may fetch executable JavaScript through jQuery's
  # `dataType: 'script'` success callback instead of inserting a script node.
  # The token table is the input to eval, and this profile requires fragments
  # for the search-referrer gate, script response, callback eval, and the
  # unusual same-origin request path in that same compact packed stage.
