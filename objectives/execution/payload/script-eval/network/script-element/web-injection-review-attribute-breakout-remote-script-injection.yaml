defaults:
  platforms: [windows, unix]
  attack: T1189,T1105
composite_rules:
  # Stored attribute breakout: a script element smuggled inside an alt/title
  # value breaks out with element closers (`</title><script ...>`) and loads
  # a remote script. The breakout leg is never hand-written markup: authors
  # never nest an element closer plus a new element inside an attribute
  # value, and escaped documentation does not match. The external-load leg
  # establishes the cross-host transfer, and near_bytes binds both legs to
  # the one injected tag instead of distant same-file co-occurrence. The
  # bare-directory versus file shape of the endpoint varies per kit and is
  # not required here; the smuggled breakout plus the remote load name the
  # injection. Visitors whose browser parses a reflection context where the
  # tag is live run whatever the remote host returns (T1189); the script
  # source is attacker-chosen remote code (T1105). The page carrying the
  # tag is evidence of compromise whether or not this snapshot shows the
  # live reflection context.
  - id: attribute-breakout-remote-script-injection
    desc: Attribute breakout smuggles a remote script loader
    crit: hostile
    conf: 0.96
    for: [html]
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/client/resource::attribute-value-breakout-script-tag
      - id: micro-behaviors/communications/http/client/script::external-script-element-load
