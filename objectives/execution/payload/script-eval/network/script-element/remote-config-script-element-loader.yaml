# A browser script that fetches a JSON response, creates a script element whose
# source is set from a variable, and contains a hardcoded remote host. Widget and
# analytics loaders share this shape, so the composite stays suspicious. Hostile
# verdicts need the family or IOC rules, or a downloaded-code execution leg.
# No proximity window: near_bytes anchors on each leg's first match, and in a
# large bundle the first fetch is often far from the script injection.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.85
  attack: T1105

composite_rules:
  - id: remote-config-script-element-loader
    desc: Fetches JSON config and injects a remote script element
    all:
      - id: micro-behaviors/communications/http/request/client/exchange::fetch-then-json
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
