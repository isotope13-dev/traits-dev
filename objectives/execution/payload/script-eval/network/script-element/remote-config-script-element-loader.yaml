# A browser script fetches JSON configuration, creates a script element whose
# source is set from a variable, and contains a hardcoded remote host. Bound the
# evidence to one small source window so unrelated bundle code does not join.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.85
  attack: T1105

composite_rules:
  - id: remote-config-script-element-loader
    desc: Fetches JSON config and injects a remote script element
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/request/client/exchange::fetch-then-json
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
    unless:
      - id: well-known/lib/ui/react::production-error-decoder
      - id: well-known/lib/observability/aegis::aegis-sdk-bookkeeping
