defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
  attack: T1105
composite_rules:
- id: ajax-json-script-response-loader
  desc: POST response supplies executed browser script
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.007
  mbc: B0024
  for:
  - javascript
  near_bytes: 2400
  all:
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/http/client/response-body::response-json-no-argument-call
  - id: micro-behaviors/process/interpreter/eval/source::ajax-script-field-near-runscript
  - id: micro-behaviors/data/property/assign::source-variable-text-property-assignment
  - id: micro-behaviors/data/collection/dom::script-element-create
- id: fetched-blob-script-loader
  desc: Executes remotely fetched JavaScript from a Blob
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.007
  mbc: B0024
  for:
  - javascript
  near_bytes: 2400
  all:
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/http/client/response-body::response-text
  - id: micro-behaviors/data/buffer/alloc::blob-construction
  - id: micro-behaviors/communications/url/object::browser-object-url
  - id: micro-behaviors/data/buffer/create::js-javascript-blob
  - id: micro-behaviors/data/collection/dom::script-element-create
- id: credentialed-xhr-script-loader
  desc: Executes credentialed XHR response as script
  crit: hostile
  conf: 0.98
  attack: T1105,T1059.007
  mbc: B0024
  for:
  - javascript
  near_bytes: 2400
  all:
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
  - id: micro-behaviors/communications/http/auth::xhr-with-credentials-enabled
  - id: micro-behaviors/communications/http/client/response-body::response-text
  - id: micro-behaviors/data/buffer/alloc::blob-construction
  - id: micro-behaviors/communications/url/object::browser-object-url
  - id: micro-behaviors/data/buffer/create::js-javascript-blob
  - id: micro-behaviors/data/collection/dom::script-element-create
- id: fetch-eval-remote-code
  desc: Extension injects code beside remote fetches
  crit: hostile
  conf: 0.95
  attack: T1059.007
  mbc: B0009.016
  near_bytes: 1400
  not:
  - substr: 'fromText eval for '
  - substr: dart2wasm
  all:
  - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
  any:
  - id: micro-behaviors/communications/url/encoded::encoded-http-url
  - id: metadata/lang/encoding/hex::js-dense-hex-escapes
  - id: micro-behaviors/communications/http/request/json::fetch-external-url
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  unless:
  - id: micro-behaviors/process/deploy/script-eval/network::fetch-near-content-eval
  - id: metadata/lang/source/syntax/call/relationship::preview-fetch-eval-context
  - id: metadata/file/extension/identity::dart-source-basename
  - id: micro-behaviors/communications/url/host/http::loopback-http-url-reference
  downgrade:
    any:
    - id: well-known/tool/reverse-engineering/exiftool::webperl-emscripten-engine
    - id: well-known/lib/development/launch-editor::open-in-editor-client-request
