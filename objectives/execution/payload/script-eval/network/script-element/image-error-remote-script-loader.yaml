defaults:
  platforms: [windows, unix]
  attack: T1189,T1105
composite_rules:
  # An image whose onerror handler creates a script element and points it at
  # another host. Fallback handlers swap the image source or hide the tag;
  # none loads code. The shape is how injected markup turns a data field
  # into a loader: in November 2026 it rode a consent-banner privacy-link
  # setting (`<img src=x onerror=...>`) to load a skimmer from S3 on retail
  # checkouts. It survives in HTML, JS, and JSON configs alike, and does not
  # depend on an attribute breakout, a feed, or the hosting service.
  - id: image-error-remote-script-loader
    desc: Image error handler loads a remote script
    ref: https://www.infohawk.com/news/2026-11-27-black-friday-webrtc-skimmer
    crit: hostile
    conf: 0.96
    for: [javascript, typescript, html, text, json]
    near_bytes: 512
    all:
      - id: micro-behaviors/ui/window/dom/create::img-onerror-script-element
    any:
      - id: micro-behaviors/communications/http/client/resource::js-remote-src-assignment
      - id: micro-behaviors/communications/http/client/resource::js-remote-src-assignment-escaped
      - id: micro-behaviors/communications/http/client/script::script-protocol-relative-src-assignment
    unless:
      - id: metadata/file/format/security-corpus::attack-payload-corpus
      - id: metadata/path/directory::test-directory-component
