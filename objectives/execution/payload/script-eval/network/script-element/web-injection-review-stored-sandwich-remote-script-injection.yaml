defaults:
  platforms: [windows, unix]
  attack: T1189,T1105
composite_rules:
  # Stored breakout-sandwich loader: a quoted attribute value carries a
  # complete breakout framing — element closer, script element, closer, and
  # reopening tag (`alt="</title><script src=...></script><title>"`) — and
  # the smuggled tag loads a remote script. The close/reopen pair proves the
  # string was built to escape its reflection context while keeping the host
  # page rendering, which is injector framing with no legitimate authoring
  # use: hand-written markup never nests elements inside an attribute value,
  # and escaped documentation does not match. The tag is quoted-inert where
  # printed here; it could execute if the value is later reflected raw in a
  # compatible context. The carrying page alone does not establish that the
  # value is stored, reflected, or executed, so this remains suspicious.
  # When the escaped and reopened element is raw-text/RCDATA (title,
  # textarea, style, xmp), rawtext-escape-remote-script-injection convicts
  # instead.
  # near_bytes binds all three legs to the one injected tag instead of
  # distant same-file co-occurrence.
  - id: stored-sandwich-remote-script-injection
    desc: Stored breakout sandwich plants remote loader
    crit: suspicious
    conf: 0.95
    for: [html]
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/client/resource::attribute-value-script-tag
      - id: micro-behaviors/communications/http/client/resource::attribute-value-breakout-sandwich-script
      - id: micro-behaviors/communications/http/client/script::external-script-element-load
