defaults:
  platforms: [windows, unix]
  attack: T1105
composite_rules:
  - id: head-leading-plaintext-script-injection
    desc: Head-leading plaintext-HTTP script injection
    crit: hostile
    conf: 0.96
    for:
    - html
    attack: T1189,T1105
    near_bytes: 512
    all:
    - id: micro-behaviors/communications/http/client/script::head-leading-remote-script
    - id: objectives/evasion/masquerade/brand/cdn::google-lookalike-script-host
    - id: micro-behaviors/communications/http/client/script::plaintext-http-script-element-source
    - id: micro-behaviors/communications/http/client/script::remote-script-element-source
