defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
  conf: 1.0

traits:
  - id: remote-aliased-urlopen-exec-string
    desc: String executes remote aliased urlopen
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # The span runs through the URL so `not` can see the canonical
      # zc.buildout bootstrap host and file; any other URL still matches.
      regex: 'exec\s*\(\s*\w*urlopen\s*\(\s*["'']\s*https?://[^"'']{0,60}'
      not:
        - substr: bootstrap.pypa.io/ez_setup.py
        - substr: peak.telecommunity.com/dist/ez_setup.py
  - id: remote-urlopen-exec-string
    desc: String embeds remote urlopen execution
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'exec\s*\(\s*urlopen\s*\(\s*Request\s*\(\s*url\s*=\s*.{0,3}https?://'
  - id: pythonw-starts-tempfile-name
    desc: Pythonw launch uses temporary filename
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'system\s*\(\s*f["'']start\s+\{.{0,80}\.replace\(.{0,80}\)\}\s+\{.{0,80}\.name\}'
  - id: write-aliased-remote-exec-string
    desc: Writes aliased remote execution text
    crit: suspicious
    if:
      type: symbol
      kind: call
      regex: '\.write$'
      arg:
        kind: string
        regex: '=\s*exec;\s*\w+\(\w+\(["'']https?://[^\n]{1,200}\.read\(\)\)'
  - id: pythonw-starts-named-file
    desc: Start command uses named file
    if:
      type: text
      regex: 'f["'']start\s+\{.{0,80}\.replace\(.{0,80}\)\}\s+\{\w+\.name\}'
  - id: conditional-launch-written-file
    desc: Written file name in conditional shell call
    if:
      type: tree-sitter
      language: python
      query: |
        (module
          (import_from_statement module_name: (dotted_name) @os
            name: (aliased_import name: (dotted_name) @system alias: (identifier) @alias))
          (expression_statement (call function: (attribute object: (identifier) @written attribute: (identifier) @write)
            arguments: (argument_list (string) @payload)))
          (try_statement body: (block (if_statement consequence: (block
            (expression_statement (call function: (identifier) @launch
              arguments: (argument_list (string
                (interpolation expression: (attribute object: (identifier) @started attribute: (identifier) @name))))))))))
          (#eq? @os "os") (#eq? @system "system") (#eq? @alias @launch)
          (#eq? @written @started) (#eq? @write "write") (#eq? @name "name")
          (#match? @payload "= *exec; *\\w+\\(\\w+\\(['\"]https?://"))
  - id: python-closed-temp-remote-eval-windowless-launch
    desc: Closed remote-eval script gets windowless launch
    if:
      type: tree-sitter
      language: python
      query: |
        (module
          (import_from_statement module_name: (dotted_name) @temp_module
            name: (aliased_import name: (dotted_name) @constructor alias: (identifier) @constructor_alias))
          (import_from_statement module_name: (dotted_name) @sys_module
            name: (aliased_import name: (dotted_name) @executable alias: (identifier) @exe_alias))
          (import_from_statement module_name: (dotted_name) @os_module
            name: (aliased_import name: (dotted_name) @system alias: (identifier) @system_alias))
          (expression_statement (assignment left: (identifier) @temp
            right: (call function: (identifier) @construct
              arguments: (argument_list (keyword_argument name: (identifier) @delete value: (false))))))
          (expression_statement (call function: (attribute object: (identifier) @write_temp attribute: (identifier) @write)
            arguments: (argument_list (string) @payload)))
          (expression_statement (call function: (attribute object: (identifier) @close_temp attribute: (identifier) @close)))
          (try_statement body: (block
            (expression_statement (call function: (identifier) @launch
              arguments: (argument_list (string
                (interpolation expression: (call function: (attribute object: (identifier) @exe attribute: (identifier) @replace)
                  arguments: (argument_list (string) @old (string) @new)))
                (interpolation expression: (attribute object: (identifier) @launch_temp attribute: (identifier) @name))) @command)))))
          (#eq? @temp_module "tempfile") (#eq? @constructor "NamedTemporaryFile")
          (#eq? @sys_module "sys") (#eq? @executable "executable")
          (#eq? @os_module "os") (#eq? @system "system")
          (#eq? @constructor_alias @construct) (#eq? @delete "delete")
          (#eq? @temp @write_temp) (#eq? @write "write")
          (#match? @payload "exec\\([^\\n]*https?://[^\\n]*[.]read\\(\\)\\)")
          (#eq? @temp @close_temp) (#eq? @close "close")
          (#eq? @system_alias @launch) (#eq? @exe_alias @exe)
          (#eq? @replace "replace") (#match? @old "^[\"']\\.exe[\"']$")
          (#match? @new "^[\"']w\\.exe[\"']$")
          (#eq? @temp @launch_temp) (#eq? @name "name")
          (#match? @command "^f[\"']start "))

composite_rules:
  - id: aliased-written-remote-exec-pythonw-launch
    desc: Written aliased remote-exec script launched via Pythonw
    crit: hostile
    conf: 0.97
    attack: "T1027,T1059.006,T1105"
    near_lines: 12
    all:
      - id: write-aliased-remote-exec-string
      - id: conditional-launch-written-file
      - id: pythonw-starts-named-file
      - id: objectives/anti-static/obfuscation/eval/scripting/host::pythonw-exe-replace-trick
      - id: micro-behaviors/data/control-flow/module-exec::python-private-alias-module-launch
  - id: hidden-pythonw-temp-remote-eval-launch
    desc: Hidden Python window launches embedded remote code
    crit: hostile
    conf: 0.98
    attack: "T1027,T1059.006,T1105"
    all:
      - id: pythonw-starts-tempfile-name
      - id: objectives/anti-static/obfuscation/eval/scripting/host::pythonw-exe-replace-trick
      - id: objectives/anti-static/obfuscation/imports/concealment::os-exec-primitive-private-alias
    any:
      - id: remote-urlopen-exec-string
      - id: remote-aliased-urlopen-exec-string
