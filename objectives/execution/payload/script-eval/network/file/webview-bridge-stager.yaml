# Hybrid desktop/launcher WebView stage download and execution via native host bridges.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1105,T1059

composite_rules:
  - id: webview-bridge-download-then-exec
    desc: Downloads and runs Lua via WebView bridge
    crit: suspicious
    conf: 0.94
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/ipc/bridge::intl-tbs-download-bridge-call
      - id: micro-behaviors/communications/ipc/bridge::intl-tbs-lua-exec-bridge-call

  - id: webview-bridge-remote-download-exec
    desc: WebView downloads remote file and executes it
    crit: hostile
    conf: 0.98
    all:
      - id: webview-bridge-download-then-exec
      - id: micro-behaviors/communications/url/host/domain-http::js-hardcoded-remote-endpoint
