defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1105,T1059.007
composite_rules:
  # Web content is written to a TEMP file and handed to cscript, so script text
  # supplied by the remote server runs on the host. The file path is held in a
  # variable, which keeps a literal script name out of the cscript command.
  - id: powershell-web-content-temp-cscript
    desc: PowerShell runs fetched web script under cscript
    crit: hostile
    conf: 0.93
    near_lines: 25
    all:
      - id: micro-behaviors/communications/http/client/library::iwr-name
      - id: micro-behaviors/fs/path/temp::env-temp
      - id: micro-behaviors/process/interpreter/wsh::powershell-cscript-variable-script
    any:
      - id: micro-behaviors/fs/write/file/full/string::powershell-set-content-call
      - id: micro-behaviors/fs/write/file/append::add-content
