defaults:
  platforms: [windows]
  for: [oledoc, ooxml]
  attack: "T1105,T1059.005"
  mbc: B0032


composite_rules:
  - id: office-vba-remote-macro-dispatch-dropper
    for: [oledoc]
    desc: Office VBA delivers and dispatches a remote macro document
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/application/hook/event::raw-auto-open-entrypoint
      - id: micro-behaviors/communications/http/client/vba::vba-remote-office-macro-url
      - id: micro-behaviors/ui/window/activation::vba-commandbar-reference
      - id: micro-behaviors/ui/window/activation::vba-commandbar-controls
      - id: micro-behaviors/ui/window/activation::vba-commandbar-onaction
      - id: micro-behaviors/ui/window/activation::vba-office-macro-action-target
      - id: micro-behaviors/ui/window/activation::vba-commandbar-execute
