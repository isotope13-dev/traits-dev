# Python stagers that construct an HTTP(S) URL scheme from split character
# literals, save a remote payload into a temporary file, and evaluate its
# contents in-process with exec().
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1105,T1027,T1059.006
  mbc: B0030,B0032

composite_rules:
  - id: python-fragmented-url-download-exec
    desc: Downloads and execs Python from split URL
    crit: hostile
    conf: 0.97
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/url/construction/fragment::fragmented-http-scheme-construction
      - id: micro-behaviors/communications/http/request/client::request-python
      - id: micro-behaviors/os/sysinfo/directories::python-temp-directory-lookup
    any:
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-file-read-result
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
