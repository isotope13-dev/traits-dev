# A package lifecycle hook that reaches an HTTPS endpoint and compiles the
# response with access to CommonJS `require` is an install-time remote-code
# loader. The HTTP and dynamic-code observations remain neutral capabilities;
# this archive-level rule supplies the npm supply-chain intent.
defaults:
  platforms: [unix, windows]
  for: [npm]

composite_rules:
  - id: npm-postinstall-remote-function-loader
    for: [npm, package.json, javascript]
    desc: npm postinstall contains HTTPS response Function loader
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: micro-behaviors/process/deploy/script-eval/network::function-require-streamed-data

  # Any preinstall/install/postinstall hook of the published package that runs
  # a local Node script, beside an http(s).get reply compiled by a Function
  # constructor with `require` access. The capability composite accepts data
  # events or async iteration for the reply, so collecting chunks with
  # `for await` instead of `res.on('data')` does not evade it. Archive scope
  # ties manifest and script by package membership, not a proven call graph.
  - id: npm-install-hook-http-reply-function-loader
    for: [npm, package.json, javascript]
    desc: Install-hook package compiles HTTP reply as code
    crit: hostile
    conf: 0.99
    scope: archive
    attack: T1195.002,T1059.007,T1105
    all:
      - id: metadata/package/scripts/entrypoint::node-install-hook-local-script
      - id: micro-behaviors/process/deploy/script-eval/network::http-get-reply-require-function
    unless:
      - id: npm-postinstall-remote-function-loader
