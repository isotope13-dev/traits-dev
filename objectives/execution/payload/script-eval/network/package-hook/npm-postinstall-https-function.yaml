# A package lifecycle hook that reaches an HTTPS endpoint and compiles the
# response with access to CommonJS `require` is an install-time remote-code
# loader. The HTTP and dynamic-code observations remain neutral capabilities;
# this archive-level rule supplies the npm supply-chain intent.
defaults:
  platforms: [unix, windows]
  for: [npm]

composite_rules:
  - id: npm-postinstall-remote-function-loader
    for: [npm, package.json, javascript]
    desc: npm postinstall contains HTTPS response Function loader
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: metadata/package/scripts/command::postinstall-runs-node-script
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: micro-behaviors/process/deploy/script-eval/network::function-require-streamed-data
