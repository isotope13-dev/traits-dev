defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1105,T1059.006
  mbc: E1105

composite_rules:
  - id: python-setup-git-clone-and-run-source
    desc: Setup code to clone a GitHub repo and run Python
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/package/recipe/setup-hooks::setup-py-subprocess
      - id: micro-behaviors/revision-control/git/transfer::python-git-clone-call
      - id: micro-behaviors/communications/url/external/github::github-service-url
      - id: micro-behaviors/process/create/subprocess/launch::run-ast
    any:
      - id: micro-behaviors/os/package-manager/dependency-setup::python-pip-install-command
      - id: micro-behaviors/process/deploy/script-eval/network::python-module-git-clone-chdir-python
  - id: python-setup-git-clone-github-source
    desc: Setup script clones a GitHub repository
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/revision-control/git/transfer::python-git-clone-call
      - id: micro-behaviors/communications/url/external/github::github-service-url
