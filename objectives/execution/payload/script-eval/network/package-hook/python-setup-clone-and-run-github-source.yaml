defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1105,T1059.006
  mbc: E1105

composite_rules:
  - id: python-setup-git-clone-and-run-source
    desc: Setup script clones a GitHub repository and runs its Python payload
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/os/package-manager/dependency-setup::python-pip-install-command
      - id: micro-behaviors/revision-control/git/transfer::python-git-clone-call
      - id: well-known/app/development/code-forge/github::github-service-url
      - id: micro-behaviors/process/create/subprocess/launch::run-ast
    any:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/pip::packaging-setuptools-imported-setup-call
