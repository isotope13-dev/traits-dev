defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1059.007,T1105

traits:
  - id: node-fetch-escaped-url-response-eval
    desc: Fetches encoded URL and evaluates response
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((program
          (function_declaration name: (identifier) @fn body: (statement_block
            (lexical_declaration (variable_declarator name: (identifier) @payload value: (await_expression
              (call_expression function: (member_expression
                object: (call_expression function: (identifier) @fetch arguments: (arguments
                  (string (escape_sequence) (escape_sequence) (escape_sequence) (escape_sequence))))
                property: (property_identifier) @then)
                arguments: (arguments (arrow_function parameters: (formal_parameters (identifier) @response)
                  body: (call_expression function: (member_expression object: (identifier) @response_use property: (property_identifier) @text))))))))
            (expression_statement (call_expression function: (identifier) @eval arguments: (arguments (identifier) @payload_use)))))
          (expression_statement (call_expression function: (identifier) @fn_use)))
          (#eq? @fetch "fetch")
          (#eq? @then "then")
          (#eq? @response @response_use)
          (#eq? @text "text")
          (#eq? @eval "eval")
          (#eq? @payload @payload_use)
          (#eq? @fn @fn_use))

composite_rules:
  - id: npm-postinstall-fetch-escaped-url-eval
    desc: Install hook evaluates fetched encoded URL
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: node-fetch-escaped-url-response-eval
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
