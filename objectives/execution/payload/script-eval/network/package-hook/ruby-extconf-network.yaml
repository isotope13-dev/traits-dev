defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: suspicious
  conf: 0.8
  attack: T1195.002,T1059,T1105
  mbc: B0024
composite_rules:
  - id: extconf-fetched-source-eval
    desc: Extension hook HTTP client and eval read clues
    crit: suspicious
    conf: 0.97
    scope: file
    near_lines: 40
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: metadata/import/package::ruby-http-client-imports
      - id: micro-behaviors/process/deploy/script-eval/input::ruby-eval-of-read-call-result
  # extconf.rb runs with the installer's privileges during `gem install`.
  # Native builds download tarballs or headers; evaluating Ruby source taken
  # from a network response hands install-time code execution to whoever
  # serves (or intercepts) that URL. The legs require the response-to-eval
  # relationship, not an HTTP import beside an unrelated eval.
  - id: extconf-evals-network-response
    desc: extconf evals Ruby fetched over network
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
    any:
      - id: micro-behaviors/process/deploy/script-eval/network::ruby-eval-of-url-fetch-result
      - id: micro-behaviors/process/deploy/script-eval/network::ruby-eval-of-http-client-response
  # A build recipe has no reason to switch certificate validation off: it is
  # reaching an endpoint whose certificate would not stand up, or is hiding the
  # request from a TLS-inspecting proxy.
