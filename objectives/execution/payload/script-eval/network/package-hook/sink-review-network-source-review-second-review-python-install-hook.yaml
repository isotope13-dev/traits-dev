defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: setup-script-evaluates-paste-response
  desc: Setup script evaluates code fetched from Pastebin
  crit: hostile
  conf: 0.99
  attack: T1059.006,T1105,T1195.002
  scope: file
  near_bytes: 4096
  all:
  - id: metadata/build/pip::root-setup-py-path
  - id: micro-behaviors/process/deploy/script-eval/network::eval-get-text
  - id: micro-behaviors/communications/http/client/exchange::paste-path-http-client-clues
- attack: T1059.006,T1105
  id: install-hook-remote-response-eval
  desc: Build/install hook with remote code evaluation
  crit: suspicious
  conf: 0.95
  near_bytes: 4096
  all:
  - id: metadata/build/package/recipe/setup-hooks::cmdclass-install-phase-override
  any:
  - id: micro-behaviors/process/deploy/script-eval/network::python-urllib-response-exec
  - id: micro-behaviors/process/deploy/script-eval/network::python-get-response-text-exec
  - id: micro-behaviors/process/deploy/script-eval/network::exec-get-content
  - id: micro-behaviors/process/deploy/script-eval/network::eval-get-text
