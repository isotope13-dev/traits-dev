defaults:
  mbc: B0024,E1059
  attack: T1105,T1059.006
  platforms:
    - windows
    - unix
  for:
    - python
composite_rules:
  - id: init-urlopen-exec-clues
    desc: Package init urlopen and exec clues
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/file/size::init-py-file
      - id: micro-behaviors/process/deploy/script-eval/network::urlopen-before-exec
      - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-exception-pass
  - id: init-direct-ip-urlopen-exec-clues
    desc: Package init URL, IP and exec clues
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/file/size::init-py-file
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-variable
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
