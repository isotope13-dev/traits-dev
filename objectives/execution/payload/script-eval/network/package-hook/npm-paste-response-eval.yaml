defaults:
  platforms: [windows, unix]
traits:
  - id: npm-pastebin-config-url
    desc: npm configuration names Pastebin origin
    crit: notable
    conf: 0.97
    for: [package.json]
    if:
      type: value
      path: config.BASE_URL
      regex: '^https?://pastebin\.com/?$'
composite_rules:
  # Proximity establishes source-level clues, not data-flow by itself.
  - id: node-module-https-buffer-eval-clues
    desc: Module HTTPS request, accumulation and end eval
    crit: notable
    conf: 0.95
    for: [javascript]
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/get::module-level-https-get-call
      - id: metadata/lang/source/syntax/assignment/value::js-addition-assignment-identifier
      - id: metadata/lang/source/syntax/call/relationship::end-handler-eval-pattern
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-variable-argument
  # Archive-wide facts can come from separate members. They show an install
  # hook and network-evaluation clues, not a proven call graph across files.
  - id: npm-install-pastebin-response-eval-clues
    desc: Install hook and paste-response evaluation clues
    crit: hostile
    conf: 0.96
    for: [zip, npm, package.json, javascript]
    scope: archive
    attack: T1059.007,T1195.002,T1105
    all:
      - id: node-module-https-buffer-eval-clues
      - id: npm-pastebin-config-url
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: metadata/package/dependencies/presence::npm-install-hook-without-dependencies
      - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64
