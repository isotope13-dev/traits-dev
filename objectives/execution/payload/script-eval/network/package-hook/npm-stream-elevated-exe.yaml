defaults:
  platforms: [windows]
  for: [package.json]
  attack: T1195.002,T1105,T1548.002

traits:
  - id: npm-postinstall-axios-stream
    desc: Downloads stream during installation
    crit: notable
    if:
      type: value
      path: scripts.postinstall
      regex: '(?s)axios.{0,400}https://.{0,400}createWriteStream'
  - id: npm-postinstall-elevated-process
    desc: Attempts elevated process on install
    crit: notable
    if:
      type: value
      path: scripts.postinstall
      substr: 'Start-Process -Verb runAs'
  - id: npm-postinstall-remote-exe-write
    desc: Writes downloaded executable on install
    crit: notable
    if:
      type: value
      path: scripts.postinstall
      regex: '(?s)https://.{0,300}\.exe.{0,300}createWriteStream'
  - id: npm-postinstall-runs-exe-helper
    desc: Runs executable download helper
    crit: notable
    if:
      type: value
      path: scripts.postinstall
      substr: 'npm run postinstall-download-exe'
  - id: npm-exe-helper-axios-stream
    desc: Downloads stream in install helper
    crit: notable
    if:
      type: value
      path: scripts.postinstall-download-exe
      regex: '(?s)axios.{0,400}https://.{0,400}createWriteStream'
  - id: npm-exe-helper-elevated-process
    desc: Attempts elevated process in helper
    crit: notable
    if:
      type: value
      path: scripts.postinstall-download-exe
      substr: 'Start-Process -Verb runAs'
  - id: npm-exe-helper-remote-exe-write
    desc: Writes executable from remote URL
    crit: notable
    if:
      type: value
      path: scripts.postinstall-download-exe
      regex: '(?s)https://.{0,300}\.exe.{0,300}createWriteStream'

composite_rules:
  - id: npm-install-stream-elevated-exe
    desc: Install attempts to download and elevate executable
    crit: hostile
    conf: 0.99
    all:
      - id: npm-postinstall-axios-stream
      - id: npm-postinstall-elevated-process
  - id: npm-install-helper-stream-elevated-exe
    desc: Install helper attempts to elevate downloaded executable
    crit: hostile
    conf: 0.99
    all:
      - id: npm-postinstall-runs-exe-helper
      - id: npm-exe-helper-axios-stream
      - id: npm-exe-helper-elevated-process
  - id: npm-install-remote-exe-elevated
    desc: Attempts elevated execution of remote executable
    crit: hostile
    conf: 0.99
    all:
      - id: npm-postinstall-remote-exe-write
      - id: npm-postinstall-elevated-process
  - id: npm-install-helper-remote-exe-elevated
    desc: Install helper attempts elevated remote executable
    crit: hostile
    conf: 0.99
    all:
      - id: npm-postinstall-runs-exe-helper
      - id: npm-exe-helper-remote-exe-write
      - id: npm-exe-helper-elevated-process
