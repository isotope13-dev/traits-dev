defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1059.004,T1059.003,T1105

traits:
  - id: toast-shell-hook
    desc: Install invokes toast setup
    crit: notable
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '^node[[:space:]]+src/core/toast-setup[.]js$'
  - id: toast-shell-script
    desc: Is toast setup script
    crit: notable
    if:
      type: path
      regex: "(^|[/\\\\])toast-setup[.]js$"

composite_rules:
  - id: toast-platform-shell-pipe
    desc: Selects platform command to execute remote response as shell script
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: toast-shell-script
      - id: micro-behaviors/communications/http/request/client/command::curl-wget-command-position
      - id: micro-behaviors/communications/http/services/cloud::vercel-app
      - id: micro-behaviors/process/create/shell/pipeline::text-shell-pipe-sink
      - id: micro-behaviors/process/create/subprocess/launch::node-spawn-or-fork-call
      - id: micro-behaviors/process/stdio/configure::child-stdio-ignore-option
  - id: npm-toast-platform-shell-pipe
    desc: Install downloads and executes remote platform script
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: toast-shell-hook
      - id: toast-platform-shell-pipe
