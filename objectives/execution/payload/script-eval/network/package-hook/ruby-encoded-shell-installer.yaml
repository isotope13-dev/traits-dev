defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1195.002,T1105

traits:
  - id: ruby-decoded-hidden-tar-shell-stage
    desc: Encoded command unpacks and runs a download
    crit: suspicious
    conf: 0.98
    if:
      type: encoded
      regex: 'curl.{0,90}-o /tmp/\.[\w.-]+\.tgz;.{0,90}tar xzf.{0,110}; bash /tmp/\.'

composite_rules:
  - id: ruby-extconf-encoded-shell-installer
    desc: Gem extension hook evaluates a concealed download and shell installer
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/data/decode/base64/call::ruby-base64-decode64-call
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval
      - id: ruby-decoded-hidden-tar-shell-stage
