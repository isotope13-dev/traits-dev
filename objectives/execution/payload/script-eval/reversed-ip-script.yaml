# Injected remote script: the page rebuilds a reversed `<script src>` tag
# whose URL host is a bare IPv4 address and writes it through a computed
# document member, so the browser fetches and runs attacker JavaScript.
# Legitimate pages neither reverse their script tags nor hide raw-IP hosts.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189,T1105

composite_rules:
  - id: reversed-ipv4-script-tag-computed-write
    desc: Computed write injects reversed raw-IP remote script
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/string/reverse::reversed-ipv4-http-url-text
      - id: micro-behaviors/data/string/reverse::reversed-script-tag-text
      - id: micro-behaviors/data/control-flow/dispatch/computed::js-computed-document-call
