defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1059.007,T1105

composite_rules:
  - id: base-contract-browser-script-stage
    desc: Injects the script stage resolved through a Base contract
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: objectives/command-and-control/infrastructure/blockchain/contract::base-rpc-resolved-browser-script-controller
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment-in-file-tail
      - id: micro-behaviors/process/create/load/remote-code::js-javascript-blob
