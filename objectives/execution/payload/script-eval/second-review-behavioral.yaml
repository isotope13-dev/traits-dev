composite_rules:
- platforms:
  - unix
  - windows
  for:
  - python
  id: pypi-setup-network-code-execution
  desc: Python install hook evaluates fetched source
  crit: hostile
  conf: 0.99
  attack: T1059.006,T1105
  near_lines: 10
  all:
  - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
  - id: micro-behaviors/process/deploy/script-eval::python-get-response-text-exec
  scope: file
  unless:
  - id: metadata/build/recognized-contexts::python-setup-network-benign-context
  mbc: E1059,E1105
