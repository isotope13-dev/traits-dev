# A script that rebuilds its next stage with a custom-alphabet 6-bit decoder
# and a modulo-key XOR, then hands the result to eval(decodeURIComponent(...)).
# The decode and the eval sink share one script, so the staged source never
# appears in the file on disk.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1027,T1140,T1059.007
  mbc: B0032

composite_rules:
  - id: js-custom-alphabet-xor-decode-eval
    desc: eval of a custom-alphabet XOR-decoded script stage
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/supply-chain/hidden-payload/encoding::eval-decode-uri
      - id: micro-behaviors/data/decode/custom::js-custom-alphabet-charcodeat-index-table
      - id: micro-behaviors/data/decode/custom::js-six-bit-shift-or-decode-accumulator
      - id: micro-behaviors/crypto/symmetric/xor/loop::js-modulo-key-xor-byte-mask
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
