# A browser page hides the scheme and assembled source of a dynamically
# inserted script behind comment-split URL fragments and markup-comment noise.
# The combined pattern captures concealed remote code loading, not remote script
# loading by itself.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1027,T1189,T1105

composite_rules:
  - id: comment-concealed-remote-script-injection
    desc: Comment-obfuscated remote script injection
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/syntax::comment-split-scheme-with-script-assembly
      - id: metadata/file/comment::many-markup-block-comments
      - id: micro-behaviors/data/collection/dom::html-text-append-child-call
