# A gem's native-extension build script runs during `gem install`. Feeding
# eval the result of an HTTP fetch there runs code the published gem never
# contained, before the user has loaded the library.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1059,T1105,T1195.002

composite_rules:
  - id: gem-extconf-evals-fetched-source
    desc: extconf.rb evals source fetched over HTTP
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: objectives/supply-chain/install-hook/package/rubygems::http-client-imports-comp
      - id: micro-behaviors/process/deploy::ruby-eval-of-fetch-call-result
