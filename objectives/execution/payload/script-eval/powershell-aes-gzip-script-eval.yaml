# A PowerShell stage that decodes a base64 payload, decrypts it with AES,
# decompresses it with GZip, and executes the recovered script via ScriptBlock.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1059.001,T1140,T1027
  mbc: B0032,E1059
composite_rules:
  - id: powershell-base64-aes-gzip-script-eval
    desc: AES gzip payload executed as ScriptBlock
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/encoding::powershell-many-base64-alphabet-lines
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-any
      - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/data/decompress/gzip::gzip-decompression-stream
      - id: micro-behaviors/metaprogramming/generation::powershell-scriptblock-constructor-text
    any:
      - id: micro-behaviors/process/interpreter/eval/constructed::powershell-scriptblock-invoke-method
      - id: micro-behaviors/data/control-flow/dispatch::powershell-variable-call-operator

  - id: powershell-base64-gzip-stream-eval
    desc: PowerShell decodes, decompresses, and evaluates a stream payload
    crit: hostile
    conf: 0.98
    near_lines: 30
    all:
      - id: micro-behaviors/data/decode/base64::powershell-frombase64string
      - id: micro-behaviors/data/decompress/gzip::gzip-decompression-stream
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
