# AutoLISP programs can use COM to retrieve code and pass the response directly
# through READ/EVAL. This rule requires that complete loader chain rather than
# treating CAD automation or an HTTP client alone as hostile.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1105,T1059.001

traits:
  - id: autolisp-com-http-response-read-eval
    desc: AutoLISP COM HTTP response read-eval
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule autolisp_com_http_response_read_eval {
          strings:
            $com = "vlax-create-object"
            $http = "request.5.1"
            $get = "get" wide ascii
            $response = "ResponseText" wide ascii
            $read_eval = "vlax-get" wide ascii
            $read = "read" wide ascii
            $eval = "eval" wide ascii
          condition:
            $com and $http and $get and $response and $read_eval and $read and $eval
        }

  - id: atlisp-auto-install-default-on
    desc: CAD core installation defaults on
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule atlisp_auto_install_default_on {
          strings:
            $setting = "AUTO_INSTALL_ATLISP" wide ascii
            $fallback = "parseBool" wide ascii
            $enabled = "true" wide ascii
          condition:
            all of them
        }

composite_rules:
  - id: default-on-autolisp-remote-code-loader
    desc: Default CAD bootstrap evaluates remote code
    crit: hostile
    conf: 0.98
    all:
      - id: autolisp-com-http-response-read-eval
      - id: atlisp-auto-install-default-on
