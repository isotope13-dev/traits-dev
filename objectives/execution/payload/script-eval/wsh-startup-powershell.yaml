defaults:
  platforms: [windows]
  for: [javascript]
composite_rules:
  # Require writing evaluator text, creating an autostart file, and an actual
  # process-create call. An unconsumed cradle literal or commented Run call
  # does not establish a payload handoff. File scope alone does not establish
  # that independently built paths name the same file.
  - id: js-startup-batch-powershell-webclient-dropper
    desc: Startup file writes remote PowerShell eval with WMI launch
    crit: hostile
    conf: 0.97
    attack: T1059.001,T1105
    all:
      - id: micro-behaviors/fs/write/content::create-text-file-in-startup
      - id: micro-behaviors/fs/write/content::create-batch-from-bound-path
      - id: micro-behaviors/fs/write/content::text-file-write-powershell-cradle
      - id: micro-behaviors/process/create/exec::js-wmi-process-create
      - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/argument/option::powershell-policy-bypass-flag
