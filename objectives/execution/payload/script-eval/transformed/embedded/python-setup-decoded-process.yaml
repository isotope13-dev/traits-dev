# setup.py evaluates code it decodes at install time, and the decoded code
# starts a process. Every install runs hidden commands.
defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: python-setup-decoded-code-runs-process
    desc: setup.py evaluates decoded command code
    crit: hostile
    conf: 0.95
    attack: T1059.006,T1027,T1195.002
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/process/create/shell/variable-command::encoded-python-process-call
    any:
      - id: objectives/anti-static/obfuscation/string/conceal::py-eval-compile-base64
      - id: objectives/anti-static/obfuscation/encoding/content::b64decode-exec
