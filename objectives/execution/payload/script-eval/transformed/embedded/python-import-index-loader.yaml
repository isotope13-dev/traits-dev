defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: python-base64-index-file-exec-method
    desc: Index method executes decoded file contents
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((class_definition name: (identifier) @class body: (block
          (function_definition name: (identifier) @method body: (block
          (expression_statement (assignment left: (attribute object: (identifier) @self1 attribute: (identifier) @path1) right: (call
            function: (attribute object: (attribute object: (identifier) @os attribute: (identifier) @pathmod) attribute: (identifier) @join)
            arguments: (argument_list (attribute object: (identifier) @self2 attribute: (identifier) @path2) (binary_operator) @indexexpr))))
          (with_statement (with_clause (with_item value: (as_pattern
            (call function: (identifier) @open arguments: (argument_list (attribute object: (identifier) @self3 attribute: (identifier) @path3) (string) @mode))
            alias: (as_pattern_target (identifier) @handle))))
            body: (block (expression_statement (assignment left: (identifier) @encoded right: (call
              function: (attribute object: (identifier) @handle2 attribute: (identifier) @read))))))
          (try_statement body: (block
            (expression_statement (assignment left: (identifier) @decoded right: (call
              function: (attribute object: (call function: (attribute object: (identifier) @base64 attribute: (identifier) @b64)
                arguments: (argument_list (identifier) @encoded2)) attribute: (identifier) @decode))))
            (expression_statement (call function: (identifier) @exec arguments: (argument_list (identifier) @decoded2)))))))))
          (#eq? @class "Index") (#eq? @method "run_index") (#eq? @self1 "self") (#eq? @self2 "self") (#eq? @self3 "self")
          (#eq? @path1 "index_file") (#eq? @path3 @path1) (#eq? @os "os") (#eq? @pathmod "path") (#eq? @join "join")
          (#match? @indexexpr "[.]index") (#eq? @open "open") (#match? @mode "r") (#eq? @handle @handle2) (#eq? @read "read")
          (#eq? @encoded @encoded2) (#eq? @base64 "base64") (#eq? @b64 "b64decode") (#eq? @decode "decode")
          (#eq? @exec "exec") (#eq? @decoded @decoded2))
  - id: python-import-runs-index-method
    desc: Import invokes fixed index loader
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((module
          (import_from_statement module_name: (relative_import) name: (dotted_name (identifier) @imported))
          (expression_statement (assignment left: (identifier) @object right: (call
            function: (attribute object: (identifier) @module attribute: (identifier) @class))))
          (expression_statement (call function: (attribute object: (identifier) @object2 attribute: (identifier) @method)
            arguments: (argument_list (string) @file))))
          (#eq? @module "index") (#eq? @imported @module) (#eq? @class "Index") (#eq? @object @object2)
          (#eq? @method "run_index") (#match? @file "[.]index"))

composite_rules:
  - id: python-import-base64-index-code-loader
    for: [python, zip, python-sdist, whl, tar]
    desc: Import invokes Base64 index-code loader
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1027,T1059.006
    scope: outer
    all:
      - id: python-base64-index-file-exec-method
      - id: python-import-runs-index-method
