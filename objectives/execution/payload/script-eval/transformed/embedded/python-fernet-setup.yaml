defaults:
  for: [python]
  platforms: [windows]

traits:
  - id: python-install-exec-embedded-fernet
    desc: Install executes embedded Fernet payload
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1027,T1059.006
    if:
      type: tree-sitter
      query: |
        ((module
          (class_definition name: (identifier) @hook superclasses: (argument_list (identifier) @install)
            body: (block (function_definition name: (identifier) @run body: (block
              (if_statement consequence: (block
                (expression_statement (call function: (identifier) @exec
                  arguments: (argument_list (call function: (attribute
                    object: (call function: (identifier) @fernet arguments: (argument_list (string) @key))
                    attribute: (identifier) @decrypt) arguments: (argument_list (string) @payload)))))))))))
          (expression_statement (call function: (identifier) @setup
            arguments: (argument_list (keyword_argument name: (identifier) @cmdclass
              value: (dictionary (pair key: (string) @installkey value: (identifier) @registered)))))))
          (#eq? @install "install") (#eq? @run "run") (#eq? @exec "exec")
          (#eq? @fernet "Fernet") (#eq? @decrypt "decrypt") (#eq? @hook @registered)
          (#eq? @setup "setup") (#eq? @cmdclass "cmdclass") (#match? @installkey "^.install.$")
          (#match? @key "^b.") (#match? @payload "^b.gAAAA"))
