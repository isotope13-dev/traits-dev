defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1027,T1059.006
traits:
  - id: python-file-base64-decoded-exec
    desc: Executes Base64-decoded file contents
    crit: hostile
    conf: 0.97
    if:
      type: tree-sitter
      language: python
      query: |
        ((function_definition
          body: (block
            (with_statement
              (with_clause (with_item value: (as_pattern
                (call function: (identifier) @open)
                alias: (as_pattern_target (identifier) @handle))))
              body: (block (expression_statement (assignment
                left: (identifier) @encoded
                right: (call function: (attribute
                  object: (identifier) @handle_use attribute: (identifier) @read))))))
            (expression_statement (assignment
              left: (identifier) @decoded
              right: (call function: (attribute
                object: (call function: (attribute object: (identifier) @base64 attribute: (identifier) @b64)
                  arguments: (argument_list (identifier) @encoded_use))
                attribute: (identifier) @decode))))
            (expression_statement (call function: (identifier) @exec
              arguments: (argument_list (identifier) @decoded_use)))))
          (#eq? @open "open")
          (#eq? @handle @handle_use)
          (#eq? @read "read")
          (#eq? @encoded @encoded_use)
          (#eq? @base64 "base64")
          (#eq? @b64 "b64decode")
          (#eq? @decode "decode")
          (#eq? @exec "exec")
          (#eq? @decoded @decoded_use))
        ((function_definition
          body: (block
            (with_statement
              (with_clause (with_item value: (as_pattern
                (call function: (identifier) @open)
                alias: (as_pattern_target (identifier) @handle))))
              body: (block (expression_statement (assignment
                left: (identifier) @decoded
                right: (call function: (attribute
                  object: (call function: (attribute object: (identifier) @base64 attribute: (identifier) @b64)
                    arguments: (argument_list (call function: (attribute object: (identifier) @handle_use attribute: (identifier) @read))))
                  attribute: (identifier) @decode))))))
            (expression_statement (call function: (identifier) @exec
              arguments: (argument_list (identifier) @decoded_use)))))
          (#eq? @open "open")
          (#eq? @handle @handle_use)
          (#eq? @read "read")
          (#eq? @base64 "base64")
          (#eq? @b64 "b64decode")
          (#eq? @decode "decode")
          (#eq? @exec "exec")
          (#eq? @decoded @decoded_use))
