defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1027,T1140,T1059.004
  mbc: B0032

composite_rules:
  - id: ruby-xor-compressed-eval-loader
    desc: Ruby byte-array XOR Zlib eval loader
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/embedded/payload/array::ruby-decimal-byte-array-literal
      - id: micro-behaviors/data/encode/xor::rb-xor-decode
      - id: micro-behaviors/data/decompress/zlib::ruby-zlib-inflate
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval
    unless:
      - id: well-known/lib/cloud/browserstack::package-member-path
