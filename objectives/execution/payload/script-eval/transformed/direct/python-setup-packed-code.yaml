defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
composite_rules:
- id: setup-py-executes-packed-blob
  desc: setup.py executes a concealed packed payload
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1059.006,T1027
  mbc: E1059.006,B0024
  scope: file
  for:
  - python
  - python-sdist
  all:
  - id: metadata/build/pip::root-setup-py
  - id: objectives/anti-static/obfuscation/payload/code-in-data::decompressed-code-executed
