# A function result is evaluated beside dense zero-width carrier data.
# U+200B/U+200C and U+200D can encode bits with byte separators, or form
# part of a radix-four alphabet alongside U+FEFF.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: eval-zero-width-bitstream-payload
    desc: Evaluates code decoded from a zero-width bitstream
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.007
    all:
      - id: metadata/lang/encoding/shape/character::dense-zero-width-bit-characters
      - id: metadata/lang/encoding/shape/character::dense-zero-width-joiner-separators
    any:
      - id: micro-behaviors/process/interpreter/eval/javascript::declared-decoder-result-eval
      - id: micro-behaviors/process/interpreter/eval/javascript::guarded-call-result-eval
