# A declared decoder's result is evaluated, and the file carries a dense
# U+200B/U+200C bit alphabet with U+200D byte separators: the evaluated code
# is stored as invisible zero-width characters.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: eval-zero-width-bitstream-payload
    desc: Evaluates code decoded from a zero-width bitstream
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.007
    all:
      - id: micro-behaviors/process/interpreter/eval/javascript::declared-decoder-result-eval
      - id: metadata/lang/encoding/shape/character::dense-zero-width-bit-characters
      - id: metadata/lang/encoding/shape/character::dense-zero-width-joiner-separators
