defaults:
  platforms: [windows]
  for: [html, scripts, documents]

composite_rules:
- id: hta-hex-chunk-eval-decoder
  desc: HTA rebuilds hex-chunked script and evals the payload
  crit: hostile
  conf: 0.98
  attack: T1218.005,T1059.007,T1027
  for: [html]
  all:
    - id: metadata/file/extension/identity::hta-html-application-extension
    - id: micro-behaviors/process/interpreter/eval/javascript::eval-call-text
    - id: micro-behaviors/data/string/conversion::fromcharcode-text-reference
    - id: micro-behaviors/data/string/conversion::charcodeat-text-expression

