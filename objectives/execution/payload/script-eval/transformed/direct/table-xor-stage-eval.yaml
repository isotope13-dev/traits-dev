# Offset-table + XOR byte-masked script decoders paired with a multi-kilobyte
# custom-alphabet string literal and direct dynamic evaluation (`eval(fn(id))`,
# `eval(id)`, or `eval(fn("..."))`) execute a concealed script stage in memory.
# Byte proximity on the decoder composite requires the offset lookup, byte-mask
# XOR, and character reconstruction to belong to one routine rather than merely
# co-occurring across unrelated modules in a bundle.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1027,T1140,T1059.007
  mbc: B0032

composite_rules:
  - id: table-xor-encoded-stage-eval
    desc: Offset-table XOR decoder evaluates encoded script stage
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: objectives/anti-static/obfuscation/encoding/custom::concealed-table-xor-character-decoder
      - id: metadata/lang/source/literal/string/shape::js-long-encoding-alphabet-text
    any:
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-nested-identifier-call-text
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-identifier-arg-text
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-nested-encoded-literal-call-text
    unless:
      - id: metadata/build/minifier::js-large-minified-bundle
      - id: well-known/lib/format/jspdf::html2pdf-bundle
      - id: well-known/lib/format/jspdf::jspdf-standard-font-data
      - id: metadata/package/testing/presence/manifest::test-fixtures
