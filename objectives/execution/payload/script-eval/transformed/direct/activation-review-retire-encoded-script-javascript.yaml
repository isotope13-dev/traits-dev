defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript, typescript]
  attack: T1027
  mbc: B0032
composite_rules:
  - id: wsh-fragmented-eval-stage
    desc: "WSH fragmented strings with dynamic eval"
    crit: hostile
    conf: 0.90
    all:
      - id: metadata/file/profile/com/interface::wscript-host-object
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
      - id: metadata/file/profile/execution-api::wsh-execution-or-stream-evidence
    any:
      - id: objectives/anti-static/obfuscation/string/fragmentation::js-split-wrapper
      - id: micro-behaviors/data/string/concat/join::js-return-array-join
      - id: objectives/anti-static/obfuscation/string/fragmentation::js-split-join-deobfuscation-dot
  - id: jscript-cc-reverse-eval
    desc: JScript evaluates reversed strings
    crit: hostile
    conf: 0.95
    for:
      - javascript
    all:
      - id: micro-behaviors/process/interpreter/scripting::jscript-cc-on
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
      - id: objectives/anti-static/obfuscation/string/reverse::js-reverse-string-obfuscation
