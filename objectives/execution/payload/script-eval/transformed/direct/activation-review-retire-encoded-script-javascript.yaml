---
defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for:
  - javascript
  - typescript
  attack: T1027
  mbc: B0032
composite_rules:
- id: wsh-stream-or-execution-evidence
  desc: WSH execution or stream evidence
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/fs/write/file/stream::js-adodb-stream-create
  - id: micro-behaviors/process/interpreter/wsh::wsh-adodb-download
  - id: micro-behaviors/process/create/hidden::wscript-shell-run-obfuscated
  - id: objectives/execution/interpreter/script/wsh::wscript-process-execution
- id: wsh-fragmented-eval-stage
  desc: WSH fragmented strings with dynamic eval
  crit: hostile
  conf: 0.9
  all:
  - id: micro-behaviors/os/com/runtime::wscript-host-object
  - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
  - id: objectives/execution/payload/script-eval/transformed/direct::wsh-stream-or-execution-evidence
  any:
  - id: objectives/anti-static/obfuscation/string/fragmentation::js-split-wrapper
  - id: micro-behaviors/data/string/concat/join::js-return-array-join
  - id: objectives/anti-static/obfuscation/string/fragmentation::js-split-join-deobfuscation-dot
- id: jscript-cc-reverse-eval
  desc: JScript evaluates reversed strings
  crit: hostile
  conf: 0.95
  for:
  - javascript
  all:
  - id: micro-behaviors/process/interpreter/scripting::jscript-cc-on
  - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
  - id: objectives/anti-static/obfuscation/string/reverse::js-reverse-string-obfuscation
