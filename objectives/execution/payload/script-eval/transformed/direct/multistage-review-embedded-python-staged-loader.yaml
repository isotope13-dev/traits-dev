defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
- id: embedded-python-staged-loader
  desc: Embedded Python with stage URL and execution
  crit: hostile
  conf: 0.99
  for:
  - pe
  platforms:
  - windows
  attack: T1105,T1027,T1059.006
  all:
  - id: objectives/anti-static/obfuscation/payload/python-embedded::embedded-python-stage-url
  - id: objectives/anti-static/obfuscation/payload/python-embedded::zlib-python-exec
  - id: objectives/anti-static/obfuscation/payload/python-embedded::embedded-python-runtime
