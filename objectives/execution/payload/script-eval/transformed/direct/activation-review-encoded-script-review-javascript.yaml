defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: obfuscated-eval-stage-loader
    desc: Obfuscated eval loader with staged blobs
    crit: hostile
    conf: 0.97
    attack: T1059.007
    mbc: B0032.001
    size_min: 8000
    all:
      - id: objectives/anti-static/obfuscation/decoders::js-trig-charcode-decoder
      - id: metadata/file/text-distribution::js-very-long-string-blobs
      - id: metadata/file/line::multiple-lines-over-1000-chars
      - id: metadata/file/text-distribution::js-base64-candidate-cluster
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
    any:
      - id: metadata/file/entropy::high-text-entropy
      - id: "metadata/file/naming::js-high-entropy-identifier-ratio"
      - id: metadata/file/text-distribution::js-max-string-over-3000
      - id: metadata/file/line::source-lines-over-1000
    unless:
      - id: metadata/path/directory::test-directory-component
