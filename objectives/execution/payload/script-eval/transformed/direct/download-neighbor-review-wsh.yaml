defaults:
  platforms: [windows]
  for: [html, vbs]
  attack: T1105

composite_rules:
  - id: wsh-msxml-xor-dynamic-code-loader
    for: [vbs]
    desc: WSH executes XOR-decoded MSXML script bytes
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.005
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
      - id: objectives/execution/payload/file-exec/command/script-host-download::wsh-vbs-repeating-key-xor-loop
      - id: micro-behaviors/data/property/access::msxml-node-typed-value
