composite_rules:
  - platforms:
      - linux
      - unix
      - macos
      - android
      - ios
    for:
      - shell
    id: resource-openssl-decrypt-eval
    desc: Resources path and OpenSSL decrypt-eval clues
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/deploy/script-eval/input::shell-openssl-output-eval
      - id: micro-behaviors/crypto/key/representation/material::openssl-hardcoded-pass
      - id: micro-behaviors/fs/path/bundle::macos-resources-dir
