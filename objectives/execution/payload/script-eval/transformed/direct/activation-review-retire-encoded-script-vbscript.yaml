defaults:
  attack: T1059.005
  platforms: [windows]
  for: [vbs]
composite_rules:
  - id: split-decoded-vbs-execute-stage
    desc: Split string table decoded and executed
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-function-call
      - id: objectives/execution/interpreter/vbscript/interpreter::vbs-mid-sliced-split-delimiter
      - id: micro-behaviors/data/encode/char-code::chr-division-decoder
  # XOR-cipher reconstruction sibling: the stage is rebuilt from decoded
  # cells and executed in memory via ExecuteGlobal rather than Execute,
  # with no download, file write, or shell launch anywhere in the flow.
  - id: xor-decoded-vbs-executeglobal-stage
    desc: XOR-decoded stage executed in memory
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
      - id: objectives/execution/payload/file-exec/command/script-host-download::wsh-vbs-xor-modulo-key
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-executeglobal
  - id: xor-decoded-vbs-execute-stage
    desc: XOR-decoded stage executed in memory via Execute
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::validated-vbs-execute-statement
    any:
      - id: objectives/execution/payload/file-exec/command/script-host-download::wsh-vbs-xor-modulo-key
      - id: objectives/anti-static/obfuscation/string/fragmentation::vbs-repeated-xor-obfuscation
  # A VBS Execute stage that launches PowerShell which itself reconstructs
  # command names with a cyclic subtraction key and dispatches repeated
  # encoded fragments. The extra PowerShell legs distinguish this layered
  # script loader from ordinary XOR-decoded VBScript.
  - id: xor-vbs-powershell-fragment-loader
    desc: XOR-decoded VBS stage carries an obfuscated PowerShell fragment loader
    crit: hostile
    conf: 0.97
    attack: T1027,T1140,T1059.001,T1059.005
    all:
      - id: objectives/execution/payload/script-eval/transformed/direct::xor-decoded-vbs-execute-stage
      - id: micro-behaviors/data/control-flow/direct-call::powershell-repeated-encoded-argument-calls
      - id: metadata/lang/source/literal/array::vbs-embedded-powershell-numeric-array
      - id: micro-behaviors/data/control-flow/dispatch/computed::powershell-variable-call-operator
      - id: micro-behaviors/data/decode/charset::powershell-indexed-key-subtraction-character-decoder
