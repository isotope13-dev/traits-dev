defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: obfuscated-hook-no-provenance-package
    desc: Encoded install hook without repository evidence
    crit: hostile
    conf: 0.97
    attack: "T1027, T1195.002"
    all:
      - id: objectives/execution/payload/script-eval/transformed/direct::install-hook-charcode-encoded-loader
      - id: metadata/package/repository::no-repo-with-hooks
    unless:
      - id: metadata/path/directory::test-directory-component
