defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  size_max: 5000000

composite_rules:
- id: generated-sdk-encoded-audioimport-exec
  desc: Generated SDK has encoded audioimport and exec
  crit: hostile
  conf: 1.0
  all:
  - id: well-known/tool/development/build/stainless::stainless-generated-sdk
  - id: objectives/execution/payload/script-eval/transformed/direct::python-base64-exec-xor-clues
  - id: objectives/anti-static/obfuscation/payload/encoded/carrier::python-encoded-audioimport-definition
- id: python-base64-exec-xor-clues
  desc: Python Base64 exec and cyclic XOR clues
  crit: suspicious
  all:
  - id: micro-behaviors/process/interpreter/eval/python-builtins::python-exec-base64-result
  - id: micro-behaviors/process/info/current::python-sys-executable
  - id: metadata/lang/source/literal/string/shape::python-large-base64-like-assignment
  - id: micro-behaviors/data/bitwise/xor-forms/indexed::python-cyclic-xor-bytes-comprehension
