defaults:
  platforms: [windows]
  for: [vbs]
composite_rules:
  - id: vbs-hidden-aes-powershell-evaluator
    desc: Hidden VBS launcher embeds AES decryption and PowerShell evaluation
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1059.001
    all:
      - id: objectives/execution/payload/file-exec/detached::vbs-hidden-powershell-base64-stager
      - id: micro-behaviors/crypto/symmetric/aes/reference::encoded-powershell-aes-managed
      - id: micro-behaviors/crypto/cipher/io::encoded-powershell-crypto-stream-finalize
      - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor-text
      - id: micro-behaviors/process/interpreter/eval/decoded::base64-powershell-eval-command
