defaults:
  platforms:
    - windows
    - unix
  for:
    - python
  attack: T1027
  mbc: B0032
composite_rules:
  - id: python-multilayer-carrier-exec
    desc: Python executes a dynamically unwrapped large encoded carrier
    crit: hostile
    conf: 0.98
    attack: T1027,T1140,T1059.006
    all:
      - id: objectives/anti-static/obfuscation/payload/encoded/carrier::python-large-base64-carrier
      - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: python-large-base64-decode-exec
    desc: Python decodes and executes a large Base64 payload
    crit: suspicious
    conf: 0.98
    attack: T1027,T1140,T1059.006
    all:
      - id: objectives/anti-static/obfuscation/payload/encoded/carrier::python-large-base64-carrier
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
      - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-single-line-dynamic-exec
    unless:
      - id: metadata/path/directory::test-directory-component
