defaults:
  for: [python]
  platforms: [unix, windows]
  attack: T1027,T1140,T1059.006

traits:
  - id: python-xz-base64-compile-exec
    desc: Executes compressed embedded Python
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: 'exec\s*\(\s*compile\s*\(\s*lzma\.decompress\s*\(\s*base64\.b64decode\s*\('

composite_rules:
  - id: python-import-xz-base64-compiled-loader
    desc: One-line compressed Python loader
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: objectives/execution/payload/script-eval/transformed/direct::python-xz-base64-compile-exec
      - id: metadata/file/line::python-one-line-source
      - id: metadata/file/line::single-long-line-outlier
      - id: metadata/file/extension/identity::python-source-extension
