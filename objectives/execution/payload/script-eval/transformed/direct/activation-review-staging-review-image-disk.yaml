composite_rules:
  - crit: hostile
    platforms:
      - windows
    for:
      - iso
      - data
    id: iso-wsh-base64-stream-eval
    desc: ISO WSH Base64 stream evaluation clues
    conf: 0.99
    attack: T1059.007,T1140
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/payload::iso-wsh-com-stream-marker
      - id: metadata/file/format/iso/payload::iso-msxml-base64-marker
      - id: metadata/file/format/iso/payload::iso-stream-text-eval-marker
