defaults:
  for:
    - powershell
    - batch
  platforms:
    - windows
composite_rules:
  - id: powershell-inline-aes-transform-eval
    desc: PowerShell evaluates an AES transform
    crit: hostile
    conf: 0.98
    for:
      - powershell
    all:
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::powershell-base64-decryption-cooccurrence
      - id: micro-behaviors/crypto/symmetric/aes/reference::dotnet-rijndael-any
      - id: micro-behaviors/process/deploy/script-eval/transformed::powershell-inline-crypto-transform-evaluation
    any:
      - id: micro-behaviors/crypto/cipher/io::dotnet-cryptostream
      - id: micro-behaviors/crypto/cipher/unspecified::dotnet-transform-final-block
    attack: T1059.001,T1027
