defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027,T1140,T1059.007
composite_rules:
  - id: cipher-derived-source-evaluation
    desc: Cipher-derived source feeds eval execution
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/decrypt/initialize::createDecipheriv
    any:
      - id: micro-behaviors/process/interpreter/eval/javascript::decryption-derived-eval-argument
      - id: objectives/anti-static/obfuscation/payload/encrypted::literal-key-generator-source-concealment
