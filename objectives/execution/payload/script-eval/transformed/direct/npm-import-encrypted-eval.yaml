defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
composite_rules:
  - id: module-encrypted-eval-clues
    desc: Module calls with encrypted evaluation clues
    crit: hostile
    attack: T1027.013,T1059.007
    conf: 0.99
    scope: archive
    for: [javascript, typescript, package.json, npm]
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-level-imported-method-call
      - id: micro-behaviors/crypto/key/representation/material::hardcoded-key-with-large-blob
      - id: micro-behaviors/metaprogramming/generation/function::js-function-constructor-require-parameter
