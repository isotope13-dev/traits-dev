defaults:
  platforms: [linux, macos, windows, unix, android, ios]
composite_rules:
  - id: jscript-cc-nested-map-eval
    desc: JScript eval with nested obfuscated map
    crit: hostile
    conf: 0.95
    for: [javascript]
    all:
      - id: micro-behaviors/process/interpreter/scripting::jscript-cc-on
      - id: objectives/anti-static/obfuscation/string/conceal::js-nested-dictionary-array-mapping
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
