defaults:
  attack: T1105
  mbc: B0024
  for:
    - javascript
  platforms:
    - windows
composite_rules:
  - id: decoded-hidden-node-background-stage
    desc: Base64 decode and eval accompany hidden detached Node execution
    crit: suspicious
    conf: 0.97
    attack: T1027,T1059.007,T1564.003
    mbc: B0032
    for:
      - javascript
      - typescript
    platforms:
      - windows
      - unix
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/decode/base64/unspecified::atob-decode
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-call-expression-arg
      - id: metadata/import/builtin::child-process-api-destructure
      - id: micro-behaviors/process/stdio/configure::child-stdio-ignore-option
      - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
  - id: packed-custom-decoder-eval-dropper
    desc: Large JavaScript custom decoder feeds an indirect eval sink
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.007
    mbc: B0032
    scope: file
    all:
      - id: metadata/build/minifier::js-large-minified-bundle
      - id: micro-behaviors/process/deploy/script-eval/transformed::packed-table-decoder-indirect-eval-stage
    unless:
  - id: encoded-string-eval-dropper
    desc: JavaScript encoded-string loader executes a concealed payload
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.007
    mbc: B0032
    for:
      - javascript
      - typescript
    all:
      - id: metadata/lang/source/literal/string/population::js-many-very-long-strings
      - id: metadata/lang/source/literal/string/population::js-high-encoded-string-ratio
      - id: micro-behaviors/data/string/conversion::fromcharcode-call
      - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-variable
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: encoded-url-eval-process-loader
    desc: Obfuscated URL payload evaluated and executed
    crit: hostile
    conf: 0.99
    attack: T1027,T1105,T1059.007
    mbc: B0032
    all:
      - id: metadata/file/encoding/base64::js-base64-shard-array
      - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-variable-argument
      - id: micro-behaviors/process/create/shell/command-string::child-process-exec
    scope: file
    unless:
      - id: well-known/lib/runtime/scripted/electron::electron-app-runtime
      - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
  - id: encoded-delete-command-loader
    desc: Encoded delete command evaluated and executed
    crit: hostile
    conf: 0.99
    attack: T1027,T1070.004,T1059.007
    mbc: B0032
    for:
      - pe
      - javascript
    all:
      - id: metadata/file/encoding/base64::js-base64-shard-array
      - id: metadata/file/encoding/shape::decoded-windows-del-command
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-variable-argument
      - id: micro-behaviors/process/create/shell/command-string::child-process-exec
    scope: outer
  - id: xor-keyed-stage-eval-dropper
    desc: Base64-keyed XOR stage evaluated in page
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.007
    for: [html, javascript]
    platforms: [windows, unix]
    near_lines: 40
    all:
      - id: micro-behaviors/data/decode/embedded/base64::atob-embedded-base64-literal
      - id: micro-behaviors/data/string/conversion::js-fromcharcode-xor-result
      - id: micro-behaviors/process/interpreter/eval/javascript::eval-call-text
  # A rotating server-side gate (bare random-token PHP script source) on a
  # page that also injects third-party scripts at runtime: the gate hides
  # the staged payload while the injector pulls the live one. Either half
  # alone is weaker; together they name the staged drop.
  - id: reversed-document-write-script-injector
    desc: Reversed string feeds document.write script injection
    crit: hostile
    conf: 0.97
    attack: T1189,T1105,T1027
    for: [html]
    platforms: [windows, unix]
    all:
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
      - id: micro-behaviors/data/string/reverse::html-split-reverse-join-string
      - id: micro-behaviors/data/string/reverse::reversed-script-tag-text
# Execution twin of the obfuscator loader above: the decoder derives the
# Function constructor's head letter ("f" from the false-string) beside a
# substitution alphabet under massed coercion. Alphabet plus constructor
# head plus coercion mass name the constructed-code stager from its
# execution shape rather than its concealment.
