defaults:
  platforms:
    - windows
  for:
    - powershell
  attack: T1059.001,T1140,T1027
  mbc: B0032,E1059
  crit: hostile
composite_rules:
  - id: powershell-base64-gzip-stream-eval
    desc: PowerShell decodes, decompresses, and evaluates a stream payload
    conf: 0.98
    near_lines: 30
    all:
      - id: micro-behaviors/data/decode/base64/unspecified::powershell-frombase64string
      - id: micro-behaviors/data/decompress/gzip::gzip-decompression-stream
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call

  - id: powershell-base64-aes-stream-eval
    desc: PowerShell decodes, decrypts via AES stream, and evaluates a script payload
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/base64/unspecified::powershell-frombase64string
      - id: micro-behaviors/crypto/cipher/io::dotnet-cryptostream
      - id: micro-behaviors/crypto/symmetric/aes/reference::dotnet-rijndael-any
      - id: micro-behaviors/crypto/decrypt/initialize::powershell-create-decryptor-call
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
