defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1027.002
  mbc: B0032

composite_rules:
  - id: digit-heavy-charcode-eval-loader
    desc: Digit-heavy JavaScript rebuilds and evals code
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.007
    all:
      - id: metadata/file/line::enormous-single-line
      - id: metadata/file/text-distribution::js-digit-ratio-over-30pct
      - id: micro-behaviors/data/string/conversion::fromcharcode-call
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-variable-argument
    near_bytes: 10000
    unless:
      - id: well-known/app/media/iphones-ru::simpla2-theme-bundle
      # Firefox vendors the Octane benchmark suite, whose js/src/octane/
      # pdfjs.js is a minified copy of pdf.js: one enormous line, font tables
      # that push the digit ratio over 30%, fromCharCode for glyph decoding
      # and an eval, all within the 10 KB window. A browser's own source tree
      # carrying a JavaScript benchmark is not a dropper.
      - id: well-known/app/communication/thunderbird::firefox-source-tree-path
