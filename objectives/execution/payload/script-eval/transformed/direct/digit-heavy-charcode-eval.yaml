defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1027.002
  mbc: B0032

composite_rules:
  - id: digit-heavy-charcode-eval-loader
    desc: Digit-heavy JavaScript rebuilds and evals code
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.007
    all:
      - id: metadata/file/line::enormous-single-line
      - id: metadata/file/text-distribution::js-digit-ratio-over-30pct
      - id: micro-behaviors/data/string/conversion::fromcharcode-call
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-variable-argument
      - id: micro-behaviors/process/interpreter/eval/javascript::js-charcode-result-eval
    near_bytes: 10000
