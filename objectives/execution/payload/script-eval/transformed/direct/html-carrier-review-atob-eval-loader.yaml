defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1105,T1059.007
  mbc: B0024

composite_rules:
  - id: atob-blob-variable-eval-delivery
    desc: Decoded Base64 blob executed via variable eval
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/decode/embedded/base64::large-base64-atob-decode
      - id: metadata/file/profile/eval-reference::eval-identifier-call-text
      - id: metadata/file/profile/eval-reference::eval-call-text
