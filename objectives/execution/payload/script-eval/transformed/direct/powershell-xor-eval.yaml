defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [powershell]
  attack: T1027
  mbc: "B0032,C0043,E1059"

composite_rules:
  - id: powershell-byte-array-xor-iex-loader
    desc: PowerShell XOR byte-array payload executed through IEX
    conf: 0.98
    attack: "T1027,T1140,T1059.001"
    near_lines: 24
    all:
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::powershell-byte-array-xor-references
    any:
      # Native .ps1 uses the symbol-call atom; WSH/HTML carriers embed the
      # Invoke-Expression / iex command text inside another language.
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-expression-command-text

  - id: powershell-hex-pair-xor-iex-loader
    desc: PowerShell hex-pair XOR decoder executes reconstructed script
    conf: 0.99
    attack: "T1027,T1140,T1059.001"
    near_lines: 24
    all:
      - id: micro-behaviors/data/decode/hex::powershell-convert-toint32-radix16
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::powershell-modulo-xor-references
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call

