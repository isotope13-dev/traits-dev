defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: install-hook-charcode-encoded-loader
  desc: Install hook inline code and conversion clues
  crit: hostile
  conf: 0.98
  attack: T1027, T1059.007, T1195.002
  mbc: E1027, B0032
  all:
  - id: "metadata/package/scripts/inline::manifest-node-inline-command"
  - id: metadata/lang/source/shape::manifest-conversion-source
  any:
  - id: metadata/lang/source/literal/array::manifest-charcode-numeric-array
  - id: metadata/lang/source/literal/array::manifest-charcode-hex-array
  - id: micro-behaviors/process/identity/query/process::manifest-node-execpath-respawn
