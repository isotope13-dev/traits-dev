defaults:
  platforms: [windows]
  attack: "T1204.002"
  for: [lnk]

composite_rules:
- id: lnk-powershell-obfuscated-stage
  desc: LNK hides PowerShell Base64 stage execution
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.001,T1105,T1564.003
  mbc: B0030
  all:
  - id: micro-behaviors/process/config/target::lnk-powershell-target
  - id: metadata/file/profile/command-options::lnk-no-profile-option
  - id: metadata/file/profile/shortcut/script-and-command::lnk-invoke-expression-reference
  - id: metadata/file/profile/shortcut/encoding::lnk-base64-convert
  - id: micro-behaviors/ui/window/state::lnk-hidden-window-flag
