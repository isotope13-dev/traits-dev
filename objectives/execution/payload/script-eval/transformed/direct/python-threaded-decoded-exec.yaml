# Decoded byte buffers are run with exec() from worker threads and every
# failure is discarded. The buffers are not source the package ships: they
# are converted from bytes at run time, and the swallowed errors keep a
# failed stage from surfacing to the user.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1059.006,T1027

composite_rules:
  - id: python-thread-silent-decoded-buffer-exec
    desc: Worker threads exec decoded byte buffers, errors discarded
    crit: hostile
    conf: 0.92
    scope: file
    all:
      - id: micro-behaviors/data/decode/charset::python-latin1-decode-call
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-variable
      - id: micro-behaviors/process/thread/create::python-thread-create
      - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-exception-pass
