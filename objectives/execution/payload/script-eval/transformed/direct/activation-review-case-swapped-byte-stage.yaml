defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: case-swapped-byte-program-eval
    desc: Eval runs case-swapped byte reconstruction
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1027
    all:
      - id: micro-behaviors/process/interpreter/eval/indirect::shell-eval-case-swapped-source
      - id: metadata/lang/encoding/shape/escape::shell-dynamic-hex-byte-templates
      - id: metadata/lang/source/literal/string/population::shell-large-program-string
      - id: metadata/lang/encoding/shape/escape::shell-dense-escape-characters
