defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027,T1059.001,T1140
  mbc: B0032,C0043
composite_rules:
  - id: code-verification-xor-eval
    desc: Code Verification marker and XOR evaluation
    crit: hostile
    conf: 0.995
    attack: T1027,T1059.001,T1140,T1204.004
    all:
      - id: metadata/file/comment::clickfix-code-verification-comment
      - id: micro-behaviors/data/decode/xor/reconstruction::powershell-hex-xor-decoder
    any:
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
      - id: metadata/file/profile/script/network::embedded-iex-irm-call
    near_bytes: 4096
