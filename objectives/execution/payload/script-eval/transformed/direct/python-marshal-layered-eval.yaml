defaults:
  platforms:
    - windows
    - unix
  for:
    - python
  attack: T1027
  mbc: B0032
composite_rules:
  - id: python-layered-decode-marshal-exec-wrapper
    desc: Python runs marshaled code behind layered decoding
    crit: suspicious
    conf: 0.93
    scope: file
    all:
      - id: micro-behaviors/data/decode/base85::b85decode-script
      - id: metadata/lang/source/naming/resource::b64decode-string
      - id: micro-behaviors/data/encoding/xor/unspecified-key::python-xor-bytes-comprehension
      - id: micro-behaviors/data/serialize/unsafe::exec-marshal-loads-text
    unless:
      - id: metadata/path/directory::test-directory-component
