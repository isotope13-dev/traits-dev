defaults:
  platforms:
    - windows
    - unix
  for:
    - python
  attack: T1027.002
  mbc: B0024
  crit: hostile
composite_rules:
  - id: embedded-zlib-base64-exec-loader
    desc: Embedded Python payload decoded with base64 and zlib then exec'd
    conf: 0.97
    all:
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
      - id: micro-behaviors/data/decompress/zlib::zlib-decompress-symbol
      - id: metadata/lang/source/naming/resource::b64decode-string
      - id: metadata/file/encoding/base64::multiple-long-base64-literals
    any:
      - id: micro-behaviors/os/module/load/name::dunder-import-call
      - id: objectives/anti-static/obfuscation/reflection/class::python-import-chain
