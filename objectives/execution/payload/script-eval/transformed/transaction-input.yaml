defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - scripts
  - source
composite_rules:
- id: blockchain-tx-interpreter-loader
  desc: XOR transaction stage near interpreter eval
  crit: hostile
  conf: 0.98
  attack: T1102,T1059.006,T1059.007
  mbc: B0032
  near_bytes: 4096
  all:
  - id: objectives/anti-static/obfuscation/string/encrypt::blockchain-xor-code-concealment
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
