# The decode-to-exec source binding and deceptive exception handler supply
# admission. HTTP APIs are corroboration, not proof of a response-to-sink flow.
defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
- id: python-base64-gzip-exec-with-error-cover
  for: [whl, python]
  desc: Executes encoded Python with deceptive file errors
  crit: hostile
  conf: 0.99
  attack: T1059.006,T1036
  mbc: E1059
  scope: file
  all:
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
  - id: micro-behaviors/data/collection/map::mapping-get-code-command-script-payload-key
  - id: micro-behaviors/data/decompress/gzip::python-base64-gzip-decode
  - id: micro-behaviors/process/interpreter/eval/constructed::python-gzip-base64-compile-exec
  - id: objectives/evasion/decoy/social::python-payload-error-cover-handler
