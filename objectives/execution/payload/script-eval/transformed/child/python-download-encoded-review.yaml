defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  attack: T1105
  mbc: E1105

composite_rules:
  - id: hidden-encoded-powershell-archive
    desc: Hidden encoded PowerShell and archive clues
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/source/syntax/command/launch::powershell-encoded-payload-command-text
      - id: metadata/lang/encoding/base64::wide-base64-expand-archive
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
    any:
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/process/create/subprocess/launch::process-execution
  - id: hidden-encoded-powershell-execution
    desc: Hidden encoded PowerShell execution
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/source/syntax/command/launch::powershell-encoded-payload-command-text
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
    any:
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/process/create/subprocess/launch::process-execution
  - id: argv-hidden-encoded-powershell
    desc: Hidden argv and encoded PowerShell evaluation
    crit: hostile
    conf: 0.97
    attack: T1059.001,T1564.003
    near_lines: 15
    all:
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
      - id: micro-behaviors/process/argument/visibility::argv-array-windowstyle-hidden
      - id: metadata/lang/encoding/base64::encoded-invoke-expression
    any:
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/process/create/subprocess/launch::process-execution
