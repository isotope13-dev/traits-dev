defaults:
  for: [documents]
  platforms: [windows]

composite_rules:
  - id: fragmented-vba-encoded-powershell-payload
    for: [documents, oledoc, ooxml, vbs]
    desc: Fragmented VBA auto-open encoded PowerShell payload
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.001,T1204.002
    all:
    - id: micro-behaviors/os/application/hook/event::fragmented-vba-workbook-open-entrypoint
    - id: metadata/file/profile/com/progid::fragmented-vba-wscript-shell-object
    - id: metadata/file/profile/process/hidden::fragmented-vba-powershell-launch
    - id: metadata/lang/encoding/shape/fragment::fragmented-vba-encoded-command-payload
