defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: ps-hidden-compressed-scriptblock-child
    desc: Hidden .NET child runs compressed ScriptBlock
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1140,T1564.003
    all:
      - id: micro-behaviors/process/create/subprocess/configure::powershell-processstartinfo-object
      - id: micro-behaviors/process/config/window::powershell-processstartinfo-hidden-window
      - id: micro-behaviors/process/config/window::powershell-processstartinfo-no-window
      - id: micro-behaviors/process/stdio/configure::powershell-processstartinfo-redirected-output
      - id: micro-behaviors/data/decode/base64/unspecified::powershell-frombase64string
      - id: micro-behaviors/data/decompress/stream::powershell-compressionmode-decompress
      - id: micro-behaviors/metaprogramming/generation/function::powershell-scriptblock-constructor-text
    near_bytes: 4096
