defaults:
  for: [batch]
  platforms: [windows]
  attack: T1059.001
composite_rules:
  - id: hidden-powershell-xor-blob-char-iex
    desc: Hidden PowerShell decodes XOR blob into iex
    crit: hostile
    conf: 0.97
    attack: T1059.001,T1140,T1027
    for: [batch, powershell]
    all:
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
      - id: micro-behaviors/data/decode/xor/reconstruction::powershell-xor-char-decode-loop
      - id: metadata/lang/source/literal/fragment/sequence::powershell-iex-character-codes
