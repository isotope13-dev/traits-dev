# A PS1-to-EXE executable keeps its script in an encrypted resource, extracts
# it to a temp file and launches PowerShell on it: decrypted source run by a
# separately launched interpreter. The converter itself is a dual-use tool;
# what admits this as an attack chain is the recovered script destroying user
# files. The legs are the converter's runtime identity, the stub's
# resource-to-temp-to-launch API set, and a destructive finding cleave made on
# the script it decrypted from the resource.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1059.001,T1027.009

composite_rules:
  - id: ps-to-exe-runs-destructive-script
    desc: PS2EXE stub runs a decrypted destructive script
    crit: hostile
    conf: 0.96
    # Reports on the PE; mixes in findings from the PowerShell it decrypted.
    for: [pe, powershell]
    scope: outer
    all:
      - id: well-known/dual-use/packaging/ps-to-exe::negated-converter-vocabulary
      - id: micro-behaviors/os/module/resource::resource-temp-shellexec-api-profile
    any:
      - id: objectives/impact/destroy/user-data::powershell-recursive-disk-byte-corruption
      - id: objectives/impact/destroy/user-data::powershell-recursive-file-prefix-corruption
      - id: objectives/impact/deface/wallpaper::powershell-file-corruptor-wallpaper-defacement
      - id: objectives/impact/ransom/note::powershell-corruptor-wallpaper-key-drop
