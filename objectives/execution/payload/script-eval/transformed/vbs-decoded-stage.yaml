# Restore definitions omitted when their consumers migrated in cb7cce1abda.
defaults:
  attack: T1059.005
  platforms:
  - windows
  for:
  - vbs
composite_rules:
- id: split-decoded-vbs-execute-stage
  desc: Split string table decoded and executed
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-function-call
  - id: objectives/execution/interpreter/vbscript/interpreter::vbs-mid-sliced-split-delimiter
  - id: micro-behaviors/data/encode/char-code::chr-division-decoder
- id: xor-decoded-vbs-execute-stage
  desc: XOR-decoded stage executed in memory via Execute
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::validated-vbs-execute-statement
  any:
  - id: objectives/execution/payload/file-exec/command/script-host-download::wsh-vbs-xor-modulo-key
  - id: objectives/anti-static/obfuscation/string/fragmentation::vbs-repeated-xor-obfuscation
