defaults:
  platforms: [linux]
  for: [shell]
  attack: T1195.002
composite_rules:
  - id: pkgbuild-build-phase-obfuscated-variable-stage
    desc: PKGBUILD combines encoded delivery with shell variable evaluation
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.004,T1105,T1195.002
    all:
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-build-fn
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval-variable
      - id: objectives/anti-static/obfuscation/encoding/content::encoded-downloader-pattern
    unless:
      - id: well-known/tool/detection/security-scanner-identity::ks-aur-test-or-crate-member
