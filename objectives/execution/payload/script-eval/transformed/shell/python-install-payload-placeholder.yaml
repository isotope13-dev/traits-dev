defaults:
  platforms: [unix, windows]
  for: [python, zip]
  attack: T1195.002,T1059.004

traits:
  - id: python-install-os-system-payload-placeholder
    desc: Install hook passes placeholder to shell
    crit: suspicious
    conf: 0.97
    for: [python]
    if:
      type: text
      regex: 'os\.system\s*\(\s*\w+\s*\(\s*["'']{1,3}CODE_REPLACE'

composite_rules:
  - id: python-install-hook-shell-payload-placeholder
    desc: Install hook retains a shell payload placeholder
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: python-install-os-system-payload-placeholder
