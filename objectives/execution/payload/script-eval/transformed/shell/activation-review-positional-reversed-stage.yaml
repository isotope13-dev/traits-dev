defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: positional-reversed-shell-source-eval
    desc: Obfuscated eval runs reversed shell source
    crit: hostile
    conf: 0.98
    attack: T1059.004,T1027
    all:
      - id: micro-behaviors/process/interpreter/eval/indirect::positional-escaped-eval-reverse-stage
      - id: micro-behaviors/data/string/reverse::shell-rev-here-string-program
      - id: metadata/lang/encoding/shape/fragment::reversed-bash-variable-token
      - id: metadata/lang/encoding/shape/fragment::reversed-hex-expansion-templates
      - id: micro-behaviors/process/create/shell/variable-command::shell-multiple-dynamic-command-targets
      - id: metadata/lang/source/literal/string/population::shell-large-program-string
