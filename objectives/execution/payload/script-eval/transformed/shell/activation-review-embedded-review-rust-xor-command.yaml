defaults:
  for: [rust]
  platforms: [unix]
composite_rules:
  - id: rust-xor-array-shell-loader
    desc: XOR-decoded byte array runs as shell command
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/process/deploy/interpreter-command::rust-xor-array-shell-argument
      - id: micro-behaviors/data/bitwise/mixed::source-xor-operation
