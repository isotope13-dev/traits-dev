defaults:
  platforms: [unix]
  for: [shell]
  attack: T1059.004,T1140,T1027.010
composite_rules:
  - id: shell-base64-gunzip-heredoc-eval
    desc: Shell decodes a gzip heredoc and evals the result
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/data/decode/command::base64-decode-command
      - id: micro-behaviors/data/decode/processor::gunzip-tool
      - id: metadata/file/encoding/base64::repeated-base64-literals
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval-variable
    unless:
      - id: metadata/path/directory::test-directory-component
