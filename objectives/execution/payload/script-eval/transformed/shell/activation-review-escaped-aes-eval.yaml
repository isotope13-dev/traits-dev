defaults:
  platforms: [unix]
  for: [shell]
  attack: T1059.004,T1027,T1140
traits:
  - id: shell-aes-stage-eval-with-variable-command
    desc: Variable-named AES decoder feeds adjacent eval
    crit: suspicious
    conf: 0.96
    # Shell flow facts currently retain expansions as literals. Join the
    # assignment and eval structurally, rather than asserting flow from two
    # unrelated operations anywhere in a file. Adjacency excludes reassignment.
    if:
      type: tree-sitter
      query: |
        ((program
          (variable_assignment name: (variable_name) @stage
            value: (command_substitution
              (pipeline
                (command
                  name: (command_name [
                    (concatenation (expansion (variable_name))
                      (expansion (variable_name)))
                    (expansion (variable_name))])
                  argument: (word) @enc
                  . argument: (word) @decrypt
                  . argument: (word) @cipher))))
          . (command name: (command_name (word) @eval)
            argument: (string (simple_expansion (variable_name) @used)))) @activation
          (#eq? @enc "enc") (#eq? @decrypt "-d")
          (#match? @cipher "^-aes-(128|192|256)-(ctr|cbc)$")
          (#eq? @eval "eval") (#eq? @stage @used))

composite_rules:
  - id: shell-concealed-hex-aes-stage-eval
    desc: Octal-named AES pipeline evaluates embedded hex stage
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/execution/payload/script-eval/transformed/shell::shell-aes-stage-eval-with-variable-command
      - id: micro-behaviors/data/decode/char-code::shell-printf-octal-substitution-format
      - id: metadata/lang/encoding/hex::hex-long-hex-string-literal
  - id: shell-octal-dynamic-command-aes-stdin-stage
    desc: Octal command substitution and AES stream decryption feed shell stdin
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/source/syntax/command/options::openssl-cli-aes-stream-decrypt
      - id: micro-behaviors/data/decode/char-code::shell-printf-octal-substitution-format
      - id: micro-behaviors/process/create/shell/variable-command::shell-multiple-dynamic-command-targets
      - id: metadata/lang/encoding/hex::hex-long-hex-string-literal
      - id: micro-behaviors/process/deploy/interpreter-stdin/input::variable-text-piped-into-shell-stdin
