defaults:
  platforms:
    - windows
  for:
    - scripts
    - source
    - class
    - java_class
  crit: hostile
composite_rules:
  - id: zig-xor-shell-loader
    desc: Zig XOR payload is handed to a shell
    conf: 0.98
    platforms:
      - unix
    for:
      - zig
      - tar
      - gz
      - zip
    scope: archive
    all:
      - id: micro-behaviors/data/embedded/payload/array::zig-hex-byte-array-literal
      - id: micro-behaviors/data/bitwise/mixed::source-xor-operation
      - id: metadata/lang/source/syntax/member::zig-child-init
      - id: metadata/lang/source/syntax/argument::zig-shell-c-command
  - id: c-hex-xor-system-loader
    desc: C XOR-decodes an embedded byte payload into a system command
    conf: 0.98
    platforms:
      - unix
    for:
      - c
    near_lines: 40
    all:
      - id: metadata/lang/source/literal/array::portable-hex-byte-array-literal
      - id: micro-behaviors/data/bitwise/mixed::source-xor-operation
      - id: micro-behaviors/process/create/shell/variable-command::c-system-identifier-input
  - id: ruby-decimal-xor-shell-loader
    desc: Ruby XOR-decodes an embedded byte payload for shell execution
    conf: 0.98
    platforms:
      - unix
    for:
      - ruby
    near_lines: 40
    all:
      - id: micro-behaviors/data/embedded/payload/array::ruby-decimal-byte-array-literal
      - id: micro-behaviors/data/bitwise/mixed::source-xor-operation
      - id: micro-behaviors/process/create/shell/interpreter::ruby-system-shell-interpreter
  - id: hex-xor-unix-shell-loader
    desc: XOR-decoded byte payload executes through a shell
    conf: 0.98
    platforms:
      - unix
    for:
      - go
    near_lines: 80
    all:
      - id: metadata/lang/source/literal/array::portable-hex-byte-array-literal
      - id: micro-behaviors/data/bitwise/mixed::source-xor-operation
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-shell-variable-command
  - id: go-zero-width-shell-command-loader
    desc: Go executes zero-width decoded command in shell
    crit: hostile
    conf: 0.99
    platforms:
      - unix
    for:
      - go
      - zip
    attack: T1027,T1059.004
    mbc: B0024,B0032
    scope: archive
    all:
      - id: micro-behaviors/data/decode/invisible-unicode::zero-width-command-data-decoder
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-shell-variable-command
      - id: micro-behaviors/process/create/subprocess/launch::go-command-launch
  - id: hex-xor-command-shell-loader
    desc: XOR-decoded command is executed through cmd.exe
    conf: 0.99
    for:
      - scripts
      - source
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/bitwise/mixed::source-xor-operation
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
      - id: micro-behaviors/process/create/exec::child-process-execution
    any:
      - id: metadata/lang/encoding/hex::hex-long-hex-string-literal
      - id: metadata/lang/source/literal/array::portable-hex-byte-array-literal
      - id: micro-behaviors/data/embedded/payload/array::ruby-decimal-byte-array-literal
  - id: perl-packed-hex-command-loader
    desc: Perl decodes packed XOR bytes before a command invocation
    conf: 0.98
    for:
      - perl
    all:
      - id: micro-behaviors/data/bitwise/mixed::source-xor-operation
      - id: micro-behaviors/data/decode/hex::perl-packed-hex-byte-decode
      - id: micro-behaviors/process/create/exec::system-process-call
      - id: metadata/lang/encoding/hex::hex-long-hex-string-literal
  - id: jvm-hex-command-shell-loader
    desc: JVM hex-decoded payload is executed through cmd.exe
    conf: 0.99
    for:
      - class
      - java_class
    all:
      - id: metadata/file/encoding/container::hex-class-string-long
      - id: micro-behaviors/data/decode/hex::java-radix16-string-parse
      - id: micro-behaviors/process/argument/interpreter::java-cmd-exe-c-bytecode-clues
      - id: metadata/import/jvm::jvm-process-creation-method-reference
  - id: csharp-base64-shell-loader
    desc: C# decodes base64 before launching a shell
    conf: 0.99
    for:
      - csharp
      - nupkg
    platforms:
      - unix
      - windows
    scope: archive
    all:
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/process/argument/interpreter::dotnet-unix-shell-command
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start
  - id: dotnet-zero-width-shell-command-loader
    desc: .NET executes zero-width decoded command in shell
    crit: hostile
    conf: 0.99
    platforms:
      - unix
      - windows
    for:
      - csharp
      - nupkg
    attack: T1027,T1059.004
    mbc: B0024,B0032
    scope: archive
    all:
      - id: micro-behaviors/data/decode/invisible-unicode::zero-width-command-data-decoder
      - id: micro-behaviors/process/argument/interpreter::dotnet-unix-shell-command
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start
  - id: swift-base64-shell-loader
    desc: Swift decodes base64 before shell execution
    conf: 0.99
    for:
      - swift
    platforms:
      - unix
      - macos
    near_lines: 40
    all:
      - id: micro-behaviors/data/decode/base64/reference::swift-base64-decoder-call
      - id: micro-behaviors/process/create/subprocess/reference::swift-shell-command-exec
      - id: micro-behaviors/process/create/subprocess/launch::swift-source-process-run

    unless:
      - id: metadata/package/testing/corpus/security-tests::swift-single-base64-hello-command
