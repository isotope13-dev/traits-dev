defaults:
  for: [batch]
  platforms: [windows]
composite_rules:
  - id: batch-char-reconstruction-webclient-clues
    desc: Batch character reconstruction and WebClient clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/argument/interpreter::powershell-option-or-operator-prefix
      - id: metadata/lang/source/syntax/type-expression::powershell-char-array-cast-text
      - id: micro-behaviors/data/string/concat/join::powershell-numeric-char-array-join
      - id: micro-behaviors/metaprogramming/generation/function::script-decoded-scriptblock-create
      - id: micro-behaviors/communications/http/client/webclient::script-decoded-webclient-downloadstring
    any:
      - id: micro-behaviors/data/string/concat/join::batch-powershell-empty-string-join
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-parenthesized-variable
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
  # The Formbook-style batch launcher: a hidden PowerShell rebuilds its script
  # from XOR-encoded blobs and runs the result through an `iex` that was never
  # written out. Each leg is explainable alone; decoding into a command whose
  # name is itself hidden has no administrative purpose.
