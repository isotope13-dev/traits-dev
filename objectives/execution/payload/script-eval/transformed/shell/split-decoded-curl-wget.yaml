defaults:
  platforms:
  - linux
  - macos
  - windows
  crit: suspicious
  attack: T1027
  mbc: E1014
  for:
  - shell
  - python
traits:
- id: decoded-http-client-url-command
  desc: Encoded HTTP client command with URL
  crit: notable
  conf: 0.95
  for: [python]
  if:
    type: encoded
    encoding: [base64, hex]
    regex: '^[ \t]*(/[^\s;&|]{1,80}/)?(curl|wget)[ \t][^\r\n;&|]{0,160}https?://[^\s;|]'

composite_rules:
- id: python-decoded-http-command
  desc: Encoded HTTP command with decode-to-shell flow
  conf: 0.95
  attack: T1027,T1105
  for: [python]
  all:
  - id: decoded-http-client-url-command
  - id: micro-behaviors/process/create/shell/variable-command::python-decoded-shell-command
  unless:
  - id: micro-behaviors/process/create/shell/pipeline::encoded-remote-shell-fetch
- id: decoded-http-client-command
  desc: Encoded HTTP command with decode-to-execution clues
  crit: suspicious
  conf: 0.95
  for:
  - shell
  - python
  - text
  - javascript
  - typescript
  any:
  - id: micro-behaviors/communications/http/curl/command::decoded-curl-command
  - id: micro-behaviors/communications/http/download/encoded::decoded-wget-command
  - id: micro-behaviors/communications/http/download/encoded::decoded-powershell-download-command
  all:
  - id: objectives/anti-static/obfuscation/payload/encoded/exec::decoded-command-execution-sink
  unless:
  - id: metadata/file/format/security-corpus::policy-command-jsonl
- id: encoded-powershell-download-concealment
  desc: Encoded PowerShell download command concealed
  crit: hostile
  conf: 0.96
  attack: T1027,T1059.001
  all:
  - id: micro-behaviors/communications/http/download/encoded::decoded-powershell-download-command
  - id: metadata/lang/source/syntax/command/launch::powershell-encoded-payload-command-text
