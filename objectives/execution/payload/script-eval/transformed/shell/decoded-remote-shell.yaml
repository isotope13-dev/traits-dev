# A decoded command that downloads a script and pipes it to a shell, actually
# executed: the decoder's output reaches a process call, or the
# decode is piped straight into a shell. The decoded layer must itself be the
# download-to-shell pipeline.
defaults:
  platforms: [unix, windows]
  attack: T1105,T1059,T1027

composite_rules:
  - id: decoded-command-runs-remote-shell
    desc: Decoded command pipes a download to shell
    crit: hostile
    conf: 0.96
    for: [python, javascript, typescript, ruby]
    all:
      - id: micro-behaviors/process/create/shell/pipeline::encoded-remote-shell-fetch
    any:
      - id: micro-behaviors/process/create/shell/variable-command::python-decoded-shell-command
      - id: micro-behaviors/process/create/shell/variable-command::js-decoded-shell-command
      - id: micro-behaviors/process/create/shell/variable-command::js-required-decoded-shell-command
      - id: ruby-decoded-command-to-system

  - id: decoded-http-command-runs-remote-shell
    desc: Decoded HTTP download executes through shell
    crit: hostile
    conf: 0.96
    for: [go, php, perl]
    all:
      - id: micro-behaviors/process/create/shell/pipeline::encoded-http-fetch-piped-to-shell
    any:
      - id: micro-behaviors/process/create/shell/variable-command::php-base64-derived-shell-command
      - id: micro-behaviors/process/create/shell/variable-command::php-hex-derived-shell-command
      - id: micro-behaviors/process/create/shell/variable-command::perl-decoded-shell-command
      - id: go-runs-decoded-shell-command

  - id: ruby-decoded-command-to-system
    desc: Ruby Kernel runs a decoded command
    crit: component
    conf: 0.95
    for: [ruby]
    all:
      - id: ruby-system-with-decoded-argument
      - id: micro-behaviors/data/decode/base64/call::ruby-base64-decode64-call

  - id: ruby-system-with-decoded-argument
    desc: Ruby system call receives decoded argument
    crit: component
    conf: 0.95
    for: [ruby]
    near_lines: 0
    all:
      - id: micro-behaviors/process/create/exec::ruby-system-process-call
      - id: micro-behaviors/process/create/shell/variable-command::ruby-decoded-shell-command

  - id: go-runs-decoded-shell-command
    desc: Go launch and decoded shell command
    crit: component
    conf: 0.95
    for: [go]
    all:
      - id: micro-behaviors/process/create/subprocess/launch::go-command-launch
      - id: micro-behaviors/process/create/shell/variable-command::go-decoded-shell-command

  # Any decode-into-shell shape: base64, xxd, printf, rev, tr and the like.
  - id: shell-decoded-remote-shell
    desc: Shell decodes and runs a download pipeline
    crit: hostile
    conf: 0.96
    for: [shell]
    unless:
      - id: metadata/package/testing/corpus/security-tests/scanner::rust-scanner-payload-unit-test
      - id: metadata/file/format/security-corpus::json-labeled-attack-corpus-record
      - id: metadata/package/testing/harness/unit::rust-test-source-file
      - id: metadata/package/testing/corpus/security-tests/scanner::js-scanner-rule-id-test-context
    downgrade:
      scope: archive
      all:
        - id: well-known/tool/detection/code-analysis/disclude::static-fixture-package-without-interpreter
        - type: path
          regex: '(^|[\\/])tests[\\/]fixtures[\\/]'
    all:
      - id: micro-behaviors/process/create/shell/pipeline::encoded-remote-shell-fetch
    any:
      - id: micro-behaviors/process/create/shell/pipe::base64-decode-piped-to-shell
      - id: micro-behaviors/process/deploy/interpreter-stdin/decoded/

  # Every other language: the program decodes data, can run a command, and
  # the decoded layer is a download piped to a shell. Weaker than the
  # dataflow rule above, so it needs all three in one file.
  - id: program-decoded-remote-shell
    desc: Program decodes and runs a download pipeline
    crit: hostile
    conf: 0.93
    for: [scripts, source]
    unless:
      - id: metadata/file/format/security-corpus::labeled-detection-input-records
    all:
      - id: micro-behaviors/process/create/shell/pipeline::encoded-remote-shell-fetch
      - id: program-decoder-call
    any:
      - id: micro-behaviors/process/create/shell/command-mode/
      - id: micro-behaviors/process/create/shell/command-string/

  - id: program-decoder-call
    desc: Program calls a data decoder
    crit: component
    conf: 0.9
    for: [scripts, source]
    any:
      - id: micro-behaviors/data/decode/base64/call/
      - id: micro-behaviors/data/decode/hex/
      - id: micro-behaviors/data/decode/base32/
      - id: micro-behaviors/data/decode/codecs/
