# A decoded command that downloads a script and pipes it to a shell, actually
# executed: the decoder's output reaches a process call (Python, Node), or the
# decode is piped straight into a shell. The decoded layer must itself be the
# download-to-shell pipeline.
defaults:
  platforms: [unix, windows]
  attack: T1105,T1059,T1027

composite_rules:
  - id: decoded-command-runs-remote-shell
    desc: Decoded command pipes a download to shell
    crit: hostile
    conf: 0.96
    for: [python, javascript, typescript]
    all:
      - id: micro-behaviors/process/create/shell/pipeline::encoded-remote-shell-fetch
    any:
      - id: micro-behaviors/process/create/shell/variable-command::python-decoded-shell-command
      - id: micro-behaviors/process/create/shell/variable-command::js-decoded-shell-command

  # Any decode-into-shell shape: base64, xxd, printf, rev, tr and the like.
  - id: shell-decoded-remote-shell
    desc: Shell decodes and runs a download pipeline
    crit: hostile
    conf: 0.96
    for: [shell]
    all:
      - id: micro-behaviors/process/create/shell/pipeline::encoded-remote-shell-fetch
    any:
      - id: micro-behaviors/process/create/shell/pipe::base64-decode-piped-to-shell
      - id: micro-behaviors/process/deploy/interpreter-stdin/decoded/

  # Every other language: the program decodes data, can run a command, and
  # the decoded layer is a download piped to a shell. Weaker than the
  # dataflow rule above, so it needs all three in one file.
  - id: program-decoded-remote-shell
    desc: Program decodes and runs a download pipeline
    crit: hostile
    conf: 0.93
    for: [scripts, source]
    all:
      - id: micro-behaviors/process/create/shell/pipeline::encoded-remote-shell-fetch
      - id: program-decoder-call
    any:
      - id: micro-behaviors/process/create/shell/command-mode/
      - id: micro-behaviors/process/create/shell/command-string/

  - id: program-decoder-call
    desc: Program calls a data decoder
    crit: component
    conf: 0.9
    for: [scripts, source]
    any:
      - id: micro-behaviors/data/decode/base64/call/
      - id: micro-behaviors/data/decode/hex/
      - id: micro-behaviors/data/decode/base32/
      - id: micro-behaviors/data/decode/codecs/
