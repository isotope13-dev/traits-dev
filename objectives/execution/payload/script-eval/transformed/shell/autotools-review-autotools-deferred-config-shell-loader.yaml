defaults:
  platforms: [unix, windows]
  for: [shell]
  attack: T1195.002
composite_rules:
  - id: autotools-deferred-config-shell-loader
    desc: Autoconf defers a source-carrier decode pipeline
    crit: hostile
    conf: 0.995
    for: [shell, text]
    all:
      - id: micro-behaviors/process/create/shell/pipeline::config-command-eval-shell
      - id: micro-behaviors/fs/search/command::recursive-srcdir-search
      - id: micro-behaviors/data/decode/command::eval-transform-decompress-pipeline
