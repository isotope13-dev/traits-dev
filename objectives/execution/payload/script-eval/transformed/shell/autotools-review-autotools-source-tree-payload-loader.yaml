defaults:
  platforms: [unix, windows]
  for: [shell]
  attack: T1195.002
composite_rules:
  - id: autotools-source-tree-payload-loader
    desc: Autotools build finds, decodes, and executes source payload
    crit: hostile
    conf: 0.99
    for: [shell, text]
    all:
      - id: micro-behaviors/fs/search/command::recursive-srcdir-search
      - id: micro-behaviors/data/decode/command::eval-transform-decompress-pipeline
      - id: micro-behaviors/process/create/shell/pipeline::eval-variable-piped-to-shell
    any:
      - id: metadata/build/autotools::autotools-input-script-basename
      - id: metadata/build/autotools::autoconf-init-marker
      - id: metadata/build/autotools::autoconf-m4-ac-defun
      - id: metadata/build/autotools::autoconf-m4-define
