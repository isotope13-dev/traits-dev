# A string literal spelling a download-to-shell pipeline backwards, reversed
# at runtime and handed to a process call. Nothing needs a backwards curl but
# a command hidden from readers and scanners. The value regex is the forward
# pipeline `\b(curl|wget)\s… | /usr/bin/sh\b`, mirrored.
defaults:
  platforms: [unix, windows]
  attack: T1105,T1059,T1027

traits:
  - id: js-reversed-command-runs-remote-shell
    desc: Node runs a reversed download-to-shell command
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)exec(Sync)?$'
      arg:
        index: 0
        from:
          value: '\b(?:hs|hsab|hsz|hsad)(?:/nib(?:/rsu)?/)?\s*\|[^\n]{0,200}\s(?:lruc|tegw)\b'
          through:
            - call: '\.join$'
              receiver: true
            - call: '\.reverse$'
              receiver: true
            - call: '\.split$'
              receiver: true
