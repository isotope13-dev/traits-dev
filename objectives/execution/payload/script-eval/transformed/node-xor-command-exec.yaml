defaults:
  crit: hostile
  conf: 0.98
  attack: T1059.007,T1027
  platforms: [windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-xor-decoded-command-execution
    desc: Node executes an XOR-decoded command
    all:
      - id: micro-behaviors/data/decode/xor::js-repeating-key-xor-string-decode
      - id: node-child-process-exec-decoded-value

traits:
  - id: node-child-process-exec-decoded-value
    desc: Executes decoded text through child_process.exec
    crit: notable
    if:
      type: text
      regex: >-
        require\s*\(\s*['"]child_process['"]\s*\)[\s\S]{0,240}exec\s*\(\s*decoded\s*,
