defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
- id: obfuscated-browser-stage-loader
  desc: Browser self-decoding stage loader
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/file/profile/encoding::browser-xor-utf8-decoding-profile
  - id: micro-behaviors/data/decode/url::browser-escape-fallback-decoder
  - id: micro-behaviors/data/decode/base64::base64-decode-call-text
  - id: micro-behaviors/process/interpreter/eval/constructed::new-function-iife
- id: hidden-browser-payload-execution
  desc: Hidden browser payload decoded and executed
  crit: hostile
  conf: 0.985
  all:
  - id: objectives/execution/payload/script-eval/transformed::obfuscated-browser-stage-loader
  - id: metadata/lang/source/naming/variable::hex-variable-names
  - id: metadata/lang/source/naming/function/name-form::hex-function-names
  - id: metadata/file/line::source-lines-over-1000
- id: obfuscated-eval-stage-loader
  desc: Obfuscated eval loader with staged blobs
  crit: hostile
  conf: 0.97
  attack: T1059.007
  mbc: B0032.001
  size_min: 8000
  size_max: 30000
  all:
  - id: objectives/anti-static/obfuscation/syntax::js-trig-charcode-decoder
  - id: metadata/file/profile/string-population::js-very-long-string-blobs
  - id: metadata/file/line::multiple-lines-over-1000-chars
  - id: metadata/file/profile/string-population::js-base64-candidate-cluster
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
  any:
  - id: metadata/file/profile/text-shape::high-text-entropy
  - id: "metadata/file/profile/identifier-population::js-high-entropy-identifier-ratio"
  - id: metadata/file/profile/string-population::js-max-string-over-3000
  - id: metadata/file/line::source-lines-over-1000
  unless:
  - id: metadata/path/directory::test-directory-component
