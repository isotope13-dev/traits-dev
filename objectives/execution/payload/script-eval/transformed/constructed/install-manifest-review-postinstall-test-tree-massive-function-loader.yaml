defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: postinstall-test-tree-massive-function-loader
    desc: Postinstall names test script with an encoded Function loader
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007,T1195.002
    for: [npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/scripts/reference::postinstall-runs-test-directory-script
      - id: objectives/anti-static/obfuscation/eval/loader::massive-unicode-string-function-loader
