defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: prepare-zero-width-dynamic-loader
  desc: Prepare hook decodes zero-width text into dynamic code
  crit: hostile
  conf: 0.995
  for:
  - javascript
  - typescript
  - package.json
  - npm
  scope: archive
  attack: T1195.002,T1027,T1140,T1059.007
  all:
  - id: metadata/package/scripts/lifecycle::filtered-prepare-hook
  - id: micro-behaviors/data/decode/invisible-unicode::embedded-zero-width-radix-four-decoder
  - id: micro-behaviors/metaprogramming/generation/function::js-new-function-variable-argument
  any:
  - id: micro-behaviors/data/string/unicode::zero-width-format-codepoint-set
  - id: metadata/lang/encoding/shape/character::multiple
