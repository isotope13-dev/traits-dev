defaults:
  for: [batch, powershell]
  platforms: [windows]
composite_rules:
  - id: encoded-download-xor-eval
    desc: Encoded PowerShell downloads, XORs and evaluates a script
    crit: hostile
    attack: T1059.001
    all:
      - id: micro-behaviors/communications/http/download/webclient::base64-downloadstring-http
      - id: metadata/lang/encoding/base64::encoded-powershell-bxor
      - id: micro-behaviors/process/interpreter/eval/decoded::base64-powershell-eval-command
      - id: micro-behaviors/communications/http/download/webclient::base64-download-xor-iex-sequence
