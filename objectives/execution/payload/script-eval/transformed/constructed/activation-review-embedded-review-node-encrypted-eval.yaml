defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027.013
  mbc: B0024
composite_rules:
  - id: decrypt-then-new-function-require
    desc: Decrypts a payload then evals via new Function
    conf: 0.97
    near_lines: 80
    all:
      - id: micro-behaviors/crypto/decrypt/initialize::createDecipheriv
      - id: micro-behaviors/metaprogramming/generation/function::js-function-constructor-require-parameter
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/bundler/runtime::js-webpack-bundle
      - id: well-known/tool/development/runtime/ganache/
  # A multi-megabyte ciphertext literal keeps tree-sitter from emitting
  # createDecipheriv as a symbol, so the rule above never starts. The
  # same call and the new Function(require)(require) site are still
  # visible as text, a handful of lines apart around that one literal.
  - id: aes-gcm-text-then-function-require
    desc: Decrypts AES-GCM then runs new Function
    conf: 0.97
    near_lines: 80
    all:
      - id: micro-behaviors/crypto/decrypt/initialize::node-aes-gcm-decipher-initialization
      - id: micro-behaviors/process/interpreter/eval/constructed::js-function-constructor-require-invocation
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/bundler/runtime::js-webpack-bundle
      - id: well-known/tool/development/runtime/ganache/
  - id: package-level-decrypt-eval-loader
    desc: Package decrypts and evals an embedded payload
    conf: 0.98
    attack: T1027.013, T1059.007
    for: [javascript, typescript, package.json, npm, tar]
    scope: archive
    all:
      - id: micro-behaviors/crypto/key/representation/material::hardcoded-key-with-large-blob
      - id: micro-behaviors/metaprogramming/generation/function::js-function-constructor-require-parameter
    any:
      - id: micro-behaviors/crypto/decrypt/initialize::createDecipheriv
      - id: micro-behaviors/crypto/kdf/algorithm::node-memory-hard-kdf
    unless:
      - id: well-known/tool/development/runtime/ganache/
