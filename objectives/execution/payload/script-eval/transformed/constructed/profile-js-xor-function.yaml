defaults:
  platforms: [linux, macos, windows]
  for: [javascript]

composite_rules:
  - id: js-xor-function-code-generation
    desc: JavaScript XOR string reconstruction near Function execution
    crit: suspicious
    conf: 0.97
    attack: T1027,T1059.007
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/encode/xor::js-fromcharcode-numeric-xor
      - id: micro-behaviors/process/interpreter/eval/constructed::new-function-iife
