defaults:
  platforms: [windows]
  for: [javascript, typescript]
composite_rules:
  - id: objectives/execution/payload/script-eval/transformed/constructed::npm-archive-powershell-xor-reflective-loader
    desc: npm tarball ships XOR reflective PowerShell loader
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1027,T1620,T1059.001,T1036.008
    platforms: [windows, unix]
    for: [npm, tar, package.json, powershell, shell]
    scope: archive
    unless:
      - id: metadata/path/directory::test-directory-component
    all:
      - id: objectives/execution/interpreter/eval/invoke::powershell-base64-xor-reflected-loader
      - id: metadata/file/extension/mismatch::script-content-as-image-extension
