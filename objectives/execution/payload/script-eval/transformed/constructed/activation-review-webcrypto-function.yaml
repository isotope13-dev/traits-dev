defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1027,T1059.007
composite_rules:
  - id: analysis-probed-encrypted-script-compiler
    desc: Analysis probes beside encrypted code compiler
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/anti-analysis/debugger-detect/browser::js-stack-getter-empty-flag-probe
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decode-call-text
      - id: micro-behaviors/metaprogramming/generation/function::webcrypto-decrypt-near-decoded-function
    any:
      - id: micro-behaviors/os/sysinfo/platform/browser::js-webdriver-member-read
      - id: micro-behaviors/os/sysinfo/platform/browser::html-webdriver-member-read
