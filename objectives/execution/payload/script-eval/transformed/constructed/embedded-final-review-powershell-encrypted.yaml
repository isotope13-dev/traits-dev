defaults:
  for: [powershell, batch]
  platforms: [windows]
  attack: T1027
  mbc: C0025
composite_rules:
  - id: ps-encoded-xor-eval-stage-loader
    desc: Encoded PowerShell XOR-decodes and evaluates a stage
    crit: hostile
    conf: 0.97
    for: [powershell, vbs, html, batch]
    all:
      - id: micro-behaviors/data/decode/base64/reference::encoded-dotnet-frombase64string-text
      - id: metadata/lang/encoding/base64::encoded-powershell-bxor
      - id: metadata/lang/encoding/base64::encoded-powershell-modulo-rotation
    any:
      - id: micro-behaviors/process/interpreter/eval/decoded::base64-powershell-eval-command
      - id: micro-behaviors/metaprogramming/generation/function::encoded-powershell-scriptblock-constructor

  - id: scheduled-task-args-base64-xor-scriptblock
    desc: Task arguments, Base64/XOR and ScriptBlock
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1053.005
    mbc: B0032,E1059,F0012
    for: [powershell]
    all:
      - id: micro-behaviors/os/autorun/task-action::powershell-scheduled-task-arguments
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::powershell-modulo-xor-references
      - id: micro-behaviors/metaprogramming/generation/function::powershell-scriptblock-constructor-text

# Bytewise XOR of Base64-decoded data followed by reflected .NET invocation
# is a distinct in-memory stage path from the AES and modulo-XOR loaders above.
