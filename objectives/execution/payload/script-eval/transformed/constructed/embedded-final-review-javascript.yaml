defaults:
  attack: T1105
  mbc: B0024
  for:
    - javascript
  platforms:
    - windows
composite_rules:
  - id: custom-decoder-charcode-eval-dropper
    desc: JavaScript custom decoder executes an encoded stage through an indirect property
    crit: hostile
    conf: 0.98
    attack: T1027,T1140,T1059.007
    mbc: B0032
    scope: file
    all:
      - id: micro-behaviors/data/decode/custom::js-alphabet-coded-decoder-source
      - id: objectives/anti-static/obfuscation/reflection/indirect::js-charcode-constructor-stage
    downgrade:
      any:
        - id: well-known/lib/vendor-sdk/freemius::freemius-js-ref
