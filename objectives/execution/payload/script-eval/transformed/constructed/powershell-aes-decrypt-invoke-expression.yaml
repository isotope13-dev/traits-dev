# Encrypted-stage activation: the decoded bytes are handed straight to
# Invoke-Expression (an unrelated IEX beside a decryptor stays notable).
# Sibling of the ScriptBlock sink in activation-review-powershell-aes-dynamic-invoke.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027,T1140

composite_rules:
- id: powershell-decrypt-then-invoke-expression
  desc: PowerShell decrypts bytes and runs them with IEX
  crit: hostile
  conf: 0.92
  all:
  - id: micro-behaviors/crypto/decrypt/transform/call::powershell-base64-decryption-cooccurrence
  - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-of-decoded-bytes
  near_lines: 40
