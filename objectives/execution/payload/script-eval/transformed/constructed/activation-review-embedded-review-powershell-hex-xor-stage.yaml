defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027,T1059.001,T1140
  mbc: B0032,C0043
composite_rules:
  - id: powershell-hex-xor-scriptblock-loader
    desc: PowerShell hex-XOR decoder materializes a ScriptBlock
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/xor/reconstruction::powershell-hex-xor-decoder
      - id: metadata/lang/scripted::powershell-leading-block-comment
      - id: micro-behaviors/metaprogramming/generation/function::powershell-scriptblock-constructor-text
    near_bytes: 4096

