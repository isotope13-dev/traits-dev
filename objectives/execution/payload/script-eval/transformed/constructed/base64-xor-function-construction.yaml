defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - typescript
    - html
    - php
    - binaries
  crit: notable
  conf: 0.88

traits:
  - id: js-base64-xor-function-construction
    desc: Base64 XOR data constructs JavaScript code
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: yara
      source: |
        rule js_prefix_base64_xor_function_execution {
          strings:
            $atob = /atob\s*\(/ nocase
            $xor = /charCodeAt\s*\(\s*\w+\s*\)\s*\^\s*\w+\.charCodeAt\s*\(/ nocase
            $function = /new\s+Function\s*\(\s*decodeURIComponent\s*\(/ nocase
          condition:
            all of them and
            @atob <= @xor + 4096 and @xor <= @atob + 4096 and
            @atob <= @function + 4096 and @function <= @atob + 4096 and
            @xor <= @function + 4096 and @function <= @xor + 4096
        }

composite_rules:
  - id: js-base64-xor-textdecoder-iife-stage
    desc: Base64 XOR payload decoded with TextDecoder and executed via Function IIFE
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.007,T1140
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/decode/embedded/base64::large-base64-atob-decode
      - id: micro-behaviors/data/bitwise/xor-forms/scalar::js-charcode-xor-operation
      - id: micro-behaviors/data/decode/utf8::textdecoder-bracket-decode-call
      - id: micro-behaviors/process/interpreter/eval/constructed::new-function-iife
  - id: js-digit-array-xor-constructor-stage
    desc: Numeric-array and atob XOR decoders with Function execution
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.007,T1140
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/decode/xor/reconstruction::base64-charcode-xor-proximity
      - id: micro-behaviors/metaprogramming/generation/function::js-array-filter-constructor-split
      - id: micro-behaviors/data/decode/xor/reconstruction::js-array-xor-character-reconstruction
      - id: metadata/lang/source/literal/array::repeated-large-integer-arrays
      - id: micro-behaviors/process/interpreter/eval/constructed::new-function-iife
