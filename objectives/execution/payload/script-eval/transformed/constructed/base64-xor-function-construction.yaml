defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - typescript
    - html
    - php
    - binaries
  crit: notable
  conf: 0.88

traits:
  - id: js-base64-xor-function-construction
    desc: Base64 XOR data constructs JavaScript code
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: yara
      source: |
        rule js_prefix_base64_xor_function_execution {
          strings:
            $atob = /atob\s*\(/ nocase
            $xor = /charCodeAt\s*\(\s*\w+\s*\)\s*\^\s*\w+\.charCodeAt\s*\(/ nocase
            $function = /new\s+Function\s*\(\s*decodeURIComponent\s*\(/ nocase
          condition:
            all of them and
            @atob <= @xor + 4096 and @xor <= @atob + 4096 and
            @atob <= @function + 4096 and @function <= @atob + 4096 and
            @xor <= @function + 4096 and @function <= @xor + 4096
        }
