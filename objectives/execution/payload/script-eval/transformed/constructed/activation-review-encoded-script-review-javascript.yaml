defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: obfuscated-browser-stage-loader
    desc: Browser self-decoding stage loader
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/decode/utf8::browser-xor-utf8-decoding-profile
      - id: micro-behaviors/data/decode/url::browser-escape-fallback-decoder
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decode-call-text
      - id: micro-behaviors/process/interpreter/eval/constructed::new-function-iife
  - id: hidden-browser-payload-execution
    desc: Hidden browser payload decoded and executed
    crit: hostile
    conf: 0.985
    all:
      - id: objectives/execution/payload/script-eval/transformed/constructed::obfuscated-browser-stage-loader
      - id: metadata/lang/source/naming/variable::hex-variable-names
      - id: metadata/lang/source/naming/function/name-form::hex-function-names
      - id: metadata/file/line::source-lines-over-1000
