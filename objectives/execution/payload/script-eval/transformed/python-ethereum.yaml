traits:
- id: python-storage-base32-shell-flow
  desc: Ethereum storage helper feeds Base32 shell
  crit: suspicious
  conf: 0.99
  if:
    type: tree-sitter
    language: python
    query: "((module\n  (function_definition\n    name: (identifier) @fetch\n    body: (block\n      (expression_statement\n\
      \        (assignment\n          right: (call\n            function: (attribute\n              object: (call\n\
      \                function: (attribute object: (identifier) @json attribute: (identifier) @dumps)\n       \
      \         arguments: (argument_list\n                  (dictionary (pair value: (string) @rpcmethod))))))))))\n\
      \  (function_definition\n    body: (block\n      (expression_statement\n        (assignment\n          left:\
      \ (identifier) @raw\n          right: (subscript value: (call function: (identifier) @used_fetch))))\n   \
      \   (try_statement\n        body: (block\n          (expression_statement\n            (assignment\n     \
      \         left: (identifier) @script\n              right: (call\n                function: (attribute\n \
      \                 object: (call\n                    function: (attribute object: (identifier) @base64 attribute:\
      \ (identifier) @decode32)\n                    arguments: (argument_list\n                      (binary_operator\
      \ left: (subscript value: (identifier) @used_raw))))\n                  attribute: (identifier) @decode))))))\n\
      \      (expression_statement\n        (call\n          function: (attribute object: (identifier) @subprocess\
      \ attribute: (identifier) @run)\n          arguments: (argument_list\n            (list . (string) @shell\
      \ . (string) @dashc . (identifier) @used_script)))))))\n  (#eq? @fetch @used_fetch)\n  (#eq? @raw @used_raw)\n\
      \  (#eq? @script @used_script)\n  (#eq? @json \"json\")\n  (#eq? @dumps \"dumps\")\n  (#match? @rpcmethod\
      \ \"eth_getStorageAt\")\n  (#eq? @base64 \"base64\")\n  (#eq? @decode32 \"b32decode\")\n  (#eq? @decode \"\
      decode\")\n  (#eq? @subprocess \"subprocess\")\n  (#match? @run \"^(run|Popen|call)$\")\n  (#match? @shell\
      \ \"/bin/(ba)?sh\")\n  (#match? @dashc \"-c\"))"
composite_rules:
- id: python-ethereum-storage-shell-command
  desc: Ethereum storage decoded to shell command
  crit: hostile
  conf: 0.99
  all:
