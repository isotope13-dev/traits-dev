# Promote the bound operation only with independent hex-decoder evidence.
# The structural primitive binds the table slots and source/sink operands;
# the parser-projected decoder observation corroborates the transformation.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: concealed-client-eval-response-data
    desc: Hex-concealed Axios response data evaluated
    crit: hostile
    conf: 0.99
    attack: T1059.007,T1105,T1027
    all:
      - id: micro-behaviors/process/deploy/script-eval::hex-table-axios-response-eval
      - id: micro-behaviors/data/decode/hex::hex-pair-regex-byte-parser

  - id: hex-concealed-x-header-response-eval-loader
    desc: Hex-concealed X-header POST evaluates remote script
    crit: hostile
    conf: 0.99
    attack: T1071.001,T1059.007,T1027
    all:
      - id: objectives/execution/payload/script-eval::concealed-client-eval-response-data
      - id: objectives/anti-static/obfuscation/string/array::hex-table-concealed-http-x-header
      - id: micro-behaviors/data/control-flow/error-handling::empty-arrow-catch-handler
