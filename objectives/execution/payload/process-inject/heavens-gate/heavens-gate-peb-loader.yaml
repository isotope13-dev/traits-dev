defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: heavens-gate-peb-loader
    desc: Unsigned PE uses Heaven's Gate x64 transition and PEB API resolution
    crit: hostile
    conf: 0.96
    attack: T1055,T1106
    all:
      - id: micro-behaviors/os/compat/wow64::x86-heavens-gate-transition
      - id: micro-behaviors/os/api-resolution/manual/
      - id: micro-behaviors/process/create/
    unless:
      - id: metadata/signature/verified/
