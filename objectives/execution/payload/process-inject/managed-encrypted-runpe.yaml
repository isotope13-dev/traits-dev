defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: managed-encrypted-pe-context-transfer
  desc: Managed encrypted PE with remote entry-point rewrite
  crit: hostile
  conf: 0.98
  attack: T1055.012,T1140
  all:
  - id: metadata/binary/framework::dotnet-metadata
  - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
  - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor-text
  - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
  - id: micro-behaviors/mem/unmap::concatenated-unmap-view-api-name
  - id: micro-behaviors/mem/write/arbitrary::concatenated-write-process-memory-api-name
  - id: micro-behaviors/process/thread/config::concatenated-set-thread-context-api-name
  - id: micro-behaviors/process/thread/lifecycle::concatenated-resume-thread-api-name
  - id: metadata/binary/instruction/operand::cil-entry-context-write
  - id: metadata/binary/instruction/operand::cil-delegate-call-allocation-flags
