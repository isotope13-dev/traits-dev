defaults:
  for: [powershell]
  platforms: [windows]
  crit: hostile
  conf: 0.98
  attack: T1055.001

composite_rules:
  - id: powershell-offensive-library-remote-injection
    desc: Decoded attack image passed to remote reflective loader
    all:
      - id: micro-behaviors/process/inject/remote-thread::powershell-remote-thread-memory-api-profile
      - id: micro-behaviors/data/decode/base64::powershell-pebytes-buffer-decode
      - id: micro-behaviors/process/inject/remote-thread::powershell-remote-reflective-image-call
    any:
      - id: objectives/credential-access/memory::powershell-reflective-logonpasswords
      - id: well-known/tool/offensive/mimikatz::reflective-dcsync-wrapper
      - id: objectives/command-and-control/backdoor/control/rmm::powershell-reflective-vnc-access
    unless:
      - id: metadata/lang/source/syntax/command::powershell-local-pe-wrapper-argumentlist
