defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]

composite_rules:
  - id: tls-flattened-remote-image-injection
    desc: TLS-flattened remote image thread handoff
    crit: hostile
    conf: 0.98
    attack: T1055,T1027
    all:
      - id: micro-behaviors/process/inject/remote-thread::concealed-remote-image-transfer-call-blocks
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::tls-state-relative-table-flattening
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
