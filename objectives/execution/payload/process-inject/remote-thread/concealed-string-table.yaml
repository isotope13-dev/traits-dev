defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]

composite_rules:
  - id: concealed-string-table-rwx-thread-loader
    desc: Concealed string table accompanies remote RWX write and thread calls
    crit: hostile
    conf: 0.97
    attack: T1055,T1027.013
    all:
      - id: micro-behaviors/process/inject/payload::x64-rwx-buffer-write-thread-pattern
      - id: objectives/anti-static/obfuscation/string/runtime-decrypt::lcg-decrypted-string-table
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
