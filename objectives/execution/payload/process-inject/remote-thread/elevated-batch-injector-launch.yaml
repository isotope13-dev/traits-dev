# Self-elevating batch wrapper that starts a sibling injector executable with two
# more sibling files as arguments. Typical shape: the batch checks for admin
# rights, re-launches itself with RunAs, then runs <injector> <target> <dll>
# from its own folder. Batch scripts are text, so the legs are text atoms; the
# composite is file-local because the batch is the only member in scope.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1055,T1548.002

traits:
  - id: batch-sibling-triple-exe-launch
    desc: Batch launches sibling exe with two files
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '"%~dp0[^"\r\n]{1,80}\.exe"\s+"%~dp0[^"\r\n]{1,80}"\s+"%~dp0[^"\r\n]{1,80}"'

composite_rules:
  - id: elevated-batch-injector-launch
    desc: Elevated batch launches sibling injector with payload files
    crit: suspicious
    conf: 0.85
    scope: file
    all:
      - id: micro-behaviors/os/privilege/check::net-session-admin-check-raw
      - id: micro-behaviors/process/config/launch::runas-verb
      - id: objectives/execution/payload/process-inject/remote-thread::batch-sibling-triple-exe-launch
