defaults:
  platforms: [windows]
  for: [pe]
  size_max: 524288

composite_rules:
  - id: authorized-use-injection-clues
    desc: Authorized-use text and injection clues
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/binary/provenance/version-fields::pe-authorized-use-comment
    any:
      - id: micro-behaviors/process/info/query::anchor-dll-targeting-method
      - id: objectives/execution/payload/memory-branch/shellcode::inject-banner
      - id: micro-behaviors/process/attach/rights::remote-process-rights-name-cluster
      - id: objectives/execution/payload/process-inject/remote-thread::remote-injection-api-error-cluster
