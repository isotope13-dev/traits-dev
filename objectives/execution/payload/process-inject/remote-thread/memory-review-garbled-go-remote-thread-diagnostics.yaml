defaults:
  platforms:
    - windows
  for:
    - pe
  attack: T1055.003
composite_rules:
  - id: garbled-go-reports-remote-thread-injection
    desc: Garbled Go remote-thread injection diagnostics
    crit: suspicious
    conf: 0.96
    attack: T1055,T1027
    for: [pe, dll]
    all:
      - id: micro-behaviors/mem/combined::virtual-memory-allocation-protection-api-pair
      - id: micro-behaviors/process/info/thread::thread-context-pair-get-set
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garbled-type-pointer
    any:
      - id: micro-behaviors/process/inject/remote-thread::injected-data-starts-thread-log
      - id: micro-behaviors/process/inject/remote-thread::remote-thread-wait-log
