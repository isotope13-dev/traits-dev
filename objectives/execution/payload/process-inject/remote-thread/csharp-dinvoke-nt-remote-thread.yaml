# C# NT remote-thread injection through DInvoke resolution: the full remote
# chain (open, alloc, write, protect, thread) with NT APIs resolved from a
# manually mapped module copy or dynamic delegate dispatch, evading
# user-mode hooks and static imports. No legitimate use.
defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1055
composite_rules:
  - id: csharp-dinvoke-nt-remote-thread-injection
    desc: C# DInvoke manual-map NT remote-thread injection
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/inject/remote-thread::csharp-nt-remote-alloc-write-thread
      - id: micro-behaviors/process/attach/rights::csharp-nt-open-process-name
    any:
      - id: micro-behaviors/os/api-resolution/manual::csharp-call-mapped-module-export
      - id: micro-behaviors/os/api-resolution/manual::csharp-manual-map-module-to-memory
      - id: micro-behaviors/metaprogramming/reflection/invoke::dotnet-dynamic-invoke-reference
