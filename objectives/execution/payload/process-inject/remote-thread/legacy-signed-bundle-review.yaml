defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: signed-multipe-remote-injection-profile
  desc: Signed multi-PE bundle with remote-injection indicators
  crit: hostile
  conf: 0.995
  attack: T1027.009,T1055
  all:
  - id: metadata/binary/layout/embedded::signed-pe-with-embedded-payloads
  - id: metadata/binary/layout/embedded::embedded-pe-three-plus
  any:
  - id: micro-behaviors/process/inject/runtime/call::binaryinjector-header-ref
  - id: micro-behaviors/process/inject/runtime/call::mavinject-injectrunning-string
  - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
  - id: micro-behaviors/process/inject/remote-thread::remote-memory-thread-api-profile
  - id: micro-behaviors/process/inject/runtime/memory::runtime-dll-remote-memory-api-profile
  downgrade:
    any:
    - id: metadata/installer/product/
    - id: metadata/signature/verified/platform::microsoft
