defaults:
  platforms: [macos]
  for: [objc, macho]
  attack: T1055
composite_rules:
  - id: macos-mach-thread-injection
    desc: Mach task-write and thread-related clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/inject/remote-thread::mach-task-write-thread-text
    any:
      - id: micro-behaviors/process/thread/create::mach-allocation-thread-text
      - id: objectives/command-and-control/reverse-shell/dev-tcp::reverse-shell-shell
