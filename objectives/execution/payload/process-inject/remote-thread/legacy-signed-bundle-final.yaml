defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: mozilla-appv-com-remote-memory-profile
  desc: Mozilla and App-V references with COM and remote-memory APIs
  crit: hostile
  conf: 0.998
  size_min: 2500000
  size_max: 4500000
  all:
  - id: well-known/app/enterprise/microsoft-office-c2r::appv-isv-subsystems-dll-reference
  - id: micro-behaviors/os/registry/com/reference::clsid-inprocserver32-key-path
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  any:
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/signature/verified/signer::mozilla-corporation
  - id: metadata/signature/unverified/signer::mozilla-corporation
  - id: metadata/signature/self-signed/signer::mozilla-corporation
  - id: metadata/signature/invalid/tampered/signer::mozilla-corporation
  - id: metadata/signature/invalid/bad-signature/signer::mozilla-corporation
  - id: metadata/signature/verified/subject::mozilla-corporation
  - id: metadata/signature/unverified/subject::mozilla-corporation
  - id: metadata/signature/self-signed/subject::mozilla-corporation
  - id: metadata/signature/invalid/tampered/subject::mozilla-corporation
  - id: metadata/signature/invalid/bad-signature/subject::mozilla-corporation
  - id: metadata/binary/layout/checksum::pe-checksum-mismatch
  - id: micro-behaviors/fs/path/application/executable::webapprt-filename-reference
  - id: micro-behaviors/communications/http/client/wininet::wininet-http-api-cluster
  - id: micro-behaviors/os/service/name::trustedinstaller-label-reference
  - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
  - id: micro-behaviors/hardware/input/keyboard/poll::key-state-ui-timer-pe-api-set
  - id: micro-behaviors/os/privilege/token/adjust::token-privilege-adjustment-references
  needs: 4
