defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
  attack: T1620

composite_rules:
  - id: go-resource-thread-context-apis
    desc: Go resource and thread-context APIs
    crit: suspicious
    conf: 0.96
    attack: T1055.012
    mbc: E1055.012
    all:
      - id: metadata/lang/compiler/systems::go-pe-symtab
      - id: metadata/signature/absent::unsigned-pe-executable
      - id: metadata/binary/resource/entropy::high-entropy-rsrc
      - id: micro-behaviors/mem/unmap::nt-unmap-view-of-section-name
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
    any:
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/dylib/load/runtime::load-library-w
    needs: 1
