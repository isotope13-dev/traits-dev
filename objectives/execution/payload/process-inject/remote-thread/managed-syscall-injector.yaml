# A managed (.NET) binary that resolves native functions into delegates,
# carries raw x64 syscall stubs, and names a remote allocate/write/execute
# API set. Together these describe a process injector that calls the kernel
# directly to bypass user-mode API hooks, the shape of Apollo's Injection
# module (Injection.Techniques.Syscall_x64) and of D/Invoke-based injectors.
# A managed debugger or profiler may resolve delegates and touch remote
# memory, but has no reason to embed its own syscall stubs.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055
  mbc: E1055

composite_rules:
  - id: managed-syscall-stub-remote-injector
    desc: .NET injector with direct syscall stubs and remote write/execute APIs
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/os/syscall/raw::windows-x64-syscall-stub
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
    any:
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
      - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
