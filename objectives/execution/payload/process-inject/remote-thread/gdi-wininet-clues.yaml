defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: gdi-bitmap-injection-wininet-api-profile
    desc: GDI bitmap, remote-thread and dynamic WinInet API references
    crit: notable
    conf: 0.96
    near_bytes: 16384
    all:
      - id: micro-behaviors/ui/graphics/draw::gdi-bitblt
      - id: micro-behaviors/ui/graphics/image::gdi-create-compatible-bitmap
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
      - id: micro-behaviors/communications/http/dynamic::dynamic-wininet-http-api-cluster
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/installer/product/
