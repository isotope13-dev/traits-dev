defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1055
composite_rules:
  - id: game-cheat-overlay-remote-thread-injection
    desc: Game-cheat overlay uses remote-thread injection
    crit: hostile
    conf: 0.98
    all:
      - id: well-known/game/cheat/control::game-cheat-overlay
      - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference

  - id: game-targeted-process-injection
    desc: Game-targeted remote-thread injection with cheat controls
    crit: hostile
    conf: 0.98
    all:
      - id: well-known/game/cheat/tamper::emulator-game-target
      - id: well-known/game/cheat/control::cheat-control-set
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
