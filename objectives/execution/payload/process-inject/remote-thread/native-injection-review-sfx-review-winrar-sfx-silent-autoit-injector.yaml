defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: winrar-sfx-silent-autoit-injector
  desc: Silent WinRAR SFX and AutoIt injection APIs
  crit: hostile
  conf: 0.99
  scope: outer
  attack: T1055,T1204.002,T1036.007
  all:
    - id: well-known/tool/sysadmin/winrar-sfx::winrar-sfx
    - id: micro-behaviors/data/archive/extract/options::sfx-silent-directive
    - id: micro-behaviors/process/config/installer::sfx-setup-legacy-executable
    - id: micro-behaviors/process/inject/remote-thread::autoit-wininet-remote-memory-apis
