defaults:
  for: [c, cpp]
  platforms: [windows]
  conf: 0.95
  attack: T1055

composite_rules:
  - id: encrypted-http-remote-thread-apis
    desc: HTTP decrypt and remote-thread APIs
    crit: suspicious
    all:
      - id: micro-behaviors/communications/http/client/wininet::wininet-open-url-src
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::bcrypt-decrypt-source
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-source
      - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-ex
    near_lines: 80
