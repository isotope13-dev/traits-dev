defaults:
  platforms:
    - windows
  for:
    - pe
  attack: T1055
  mbc: B0033

composite_rules:
  - id: amsi-patch-concealed-remote-write
    crit: hostile
    desc: AMSI patch and concealed remote write
    conf: 0.95
    all:
      - id: objectives/evasion/anti-av/amsi::concealed-amsi-session-local-patch
      - id: micro-behaviors/process/attach/rights::open-process
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-binary
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: objectives/anti-static/obfuscation/imports/concealment::tls-rotate-xor-api-names
      - id: metadata/signature/absent::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/process/thread/create::create-thread
      - id: micro-behaviors/process/info/thread::resume-thread-import
    unless:
      - id: metadata/installer/product/
