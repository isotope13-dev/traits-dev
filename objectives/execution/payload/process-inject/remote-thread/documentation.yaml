defaults:
  platforms: [windows]
  for: [html, markdown, text]
  crit: hostile
  conf: 0.97
  attack: T1055

composite_rules:
  - id: documented-remote-shellcode-execution
    desc: Documents shellcode execution in a selected remote process via a remote thread
    near_bytes: 512
    all:
      - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-name-in-documentation
      - id: micro-behaviors/process/inject/remote-thread::shellcode-execution-remote-process-in-documentation
      - id: micro-behaviors/process/inject/remote-thread::pid-target-selection-in-documentation
