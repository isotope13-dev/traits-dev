---
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1055
  mbc: B0033
composite_rules:
- id: node-addon-obfuscated-dynamic-loader
  desc: Node addon conceals remote-injection and executable-memory APIs
  crit: hostile
  conf: 0.96
  all:
  - id: metadata/binary/symbols/exports::node-api-addon-export
  - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
  - id: micro-behaviors/mem/protect/modify/executable::executable-page-protection-evidence
  - id: micro-behaviors/data/bitwise/xor-forms/indexed::x64-rbp-xor-imm8-counted-loop
  - id: micro-behaviors/mem/write/arbitrary::xor-writeprocessmemory-name-prefix
  - id: micro-behaviors/process/inject/remote-thread::xor-createremotethread-name-prefix
- id: opaque-payload-thread-injector
  desc: PE opaque payload with thread-context injection
  crit: hostile
  conf: 0.98
  arch:
  - x86-64
  size_max: 5242880
  all:
  - id: objectives/anti-static/obfuscation/payload/section/layout::large-high-entropy-gfx-section
  - id: micro-behaviors/os/api-resolution/digest-export/resolution::multiply-shift-xor-export-walk
  - id: micro-behaviors/process/info/thread::get-thread-context-import
  - id: micro-behaviors/process/info/thread::set-thread-context-import
  - id: micro-behaviors/process/info/thread::resume-thread-import
  - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
- id: garbled-go-toolhelp-shellcode-stager
  desc: Garbled Go enumerates processes and stages shellcode
  crit: hostile
  conf: 0.96
  attack: T1027,T1055,T1057
  all:
  - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garbled-type-pointer
  - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
  - id: objectives/anti-static/obfuscation/loader-profile::stack-obfuscated-buffer-thread
