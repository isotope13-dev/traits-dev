defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055,T1562.001
  mbc: B0033

composite_rules:
  - id: injection-target-system-process
    desc: References common Windows host process injection target
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/os/application/target/system::explorer-executable-reference
      - id: micro-behaviors/fs/path/host-process::windows-svchost-name
      - id: micro-behaviors/fs/path/host-process::windows-runtime-broker-name
      - id: micro-behaviors/fs/path/host-process::windows-smss-name
      - id: micro-behaviors/fs/path/host-process::windows-application-frame-host-name

  - id: syscall-enumerated-process-injection
    desc: Enumerates target processes and injects via direct or indirect syscalls
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-symbol
      - id: injection-target-system-process
    any:
      - id: objectives/evasion/anti-av/syscall::resolved-direct-syscall-gateway
      - id: objectives/evasion/anti-av/syscall::windows-direct-syscalls
      - id: objectives/evasion/anti-av/syscall::indirect-syscall-gate
      - id: objectives/evasion/anti-av/syscall::runtime-ssn-gadget-hunt
      - id: objectives/evasion/anti-av/syscall::runtime-ssn-gadget-memory-hunt
      - id: objectives/evasion/anti-av/syscall::runtime-halos-gate-ssn-hunt
      - id: objectives/evasion/anti-av/syscall::hand-resolved-api-syscall-gadget-hunt
      - id: objectives/evasion/anti-av/syscall::extracted-ssn-indirect-trampoline-bypass
