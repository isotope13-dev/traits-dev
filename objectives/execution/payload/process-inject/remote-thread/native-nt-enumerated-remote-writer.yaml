defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  # Ntdll-direct injection without the Win32 wrappers. The shared API-set
  # misses this path because its ntdll leg needs the text reference that
  # the symbol-level write trait suppresses.
  - id: enumerated-nt-remote-write-thread-injector
    desc: Enumerates processes, then writes and starts a remote thread via ntdll
    crit: hostile
    conf: 0.93
    attack: T1055
    all:
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-symbol
      - id: micro-behaviors/process/attach/rights::nt-open-process-name
      - id: micro-behaviors/mem/write/arbitrary::write-memory-sym--ntwritevirtualmemory
      - id: micro-behaviors/process/inject/remote-thread::native-remote-thread-create--ntcreatethreadex
