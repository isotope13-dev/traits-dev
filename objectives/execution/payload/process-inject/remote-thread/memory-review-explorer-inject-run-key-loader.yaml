defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: explorer-inject-run-key-loader
    desc: Explorer injection with Run-key persistence
    crit: hostile
    conf: 0.97
    attack: T1055,T1547.001
    all:
      - id: micro-behaviors/process/inject/remote-thread::explorer-reference-remote-thread-api-set
      - id: micro-behaviors/os/registry/autostart/write::managed-run-path-write-api-references
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run
