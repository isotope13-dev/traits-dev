defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: self-issued-google-remote-apis
    desc: Self-issued Google name and remote APIs
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
      - id: metadata/signed/unknown::google-llc
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
