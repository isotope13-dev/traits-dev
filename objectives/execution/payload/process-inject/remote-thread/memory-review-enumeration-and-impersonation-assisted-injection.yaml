defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: enumeration-and-impersonation-assisted-injection
    for:
      - pe
    desc: Process targeting and token impersonation with injection APIs
    crit: hostile
    conf: 0.99
    mbc: B0033
    attack: T1055,T1057,T1134.001
    all:
      - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
      - id: micro-behaviors/os/privilege/token/use::dynamic-process-token-impersonation
    unless:
      - id: metadata/signature/verified/signer::microsoft-corporation
