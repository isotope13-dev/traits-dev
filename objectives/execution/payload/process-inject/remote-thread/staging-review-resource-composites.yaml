composite_rules:
- platforms:
  - windows
  for:
  - pe
  id: native-api-hashed-resource-injection
  desc: Resource and API-hashed injection clues
  crit: hostile
  conf: 0.99
  attack: T1027.007,T1027.009,T1055,T1620
  all:
  - id: micro-behaviors/data/embedded/payload/resource::find-resource-any
  - id: micro-behaviors/data/embedded/payload/resource::load-resource
  - id: micro-behaviors/data/embedded/payload/resource::lock-resource
  - id: micro-behaviors/os/api-resolution/digest-export/resolution::multiply-shift-xor-export-walk
  - id: micro-behaviors/process/inject/runtime/call::nt-write-virtual-memory-name
  - id: micro-behaviors/process/thread/create::nt-create-thread-ex-name
  - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
