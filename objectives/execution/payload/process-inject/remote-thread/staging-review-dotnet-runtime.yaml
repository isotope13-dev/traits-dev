composite_rules:
- mbc: E1055
  attack: T1027.009,T1055
  platforms:
  - windows
  for:
  - pe
  id: reactor-resource-crypto-process-write
  desc: Reactor-packed loader with remote injection APIs
  crit: hostile
  conf: 0.98
  # The .NET Reactor runtime stub itself P/Invokes OpenProcess, VirtualProtect
  # and WriteProcessMemory to patch its own image and decrypts Rijndael
  # resources, so every Reactor-protected module (including EZIRIZ's own
  # tool) carries those four clues. Remote injection additionally needs memory
  # or a thread created in another process.
  all:
  - id: metadata/build/protector::dotnet-reactor-module-guid-type
  - id: micro-behaviors/crypto/symmetric/aes/reference::dotnet-rijndael-any
  - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  any:
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex-dup
  - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
  - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-text
  - id: micro-behaviors/process/thread/create::nt-create-thread-ex-name
  unless:
  - id: objectives/evasion/masquerade/binary/loader::dotnet-template-product-identity-context
  - id: metadata/signature/verified/platform::microsoft
  - id: well-known/app/media/dvdvideosoft::free-disc-burner-utility
  - id: well-known/app/utility/cummins-insite-update-manager::cummins-insite-update-manager-context
  - id: well-known/app/utility/cummins-license-configuration-tool::cummins-lct-context
  - id: well-known/lib/vendor-sdk/winpure/
