defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust]

traits:
  - id: source-remote-rwx-protection
    desc: Makes remote pages writable and executable
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '(^|\.|::)VirtualProtectEx$'
      arg: {index: 3, kind: identifier, name: PAGE_EXECUTE_READWRITE}

composite_rules:
  - id: source-remote-write-rwx-thread
    desc: Remote thread and memory API references with RWX protection
    crit: suspicious
    conf: 0.96
    attack: T1055
    all:
      - id: micro-behaviors/process/inject/remote-thread::source-remote-memory-thread-api-references
      - id: source-remote-rwx-protection
    unless:
      - id: micro-behaviors/mem/combined::suspended-remote-executable-staging
