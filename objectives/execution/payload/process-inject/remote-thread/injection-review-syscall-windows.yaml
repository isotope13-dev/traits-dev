defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: xll-native-remote-thread-apis
    desc: XLL autostart and native injection APIs
    crit: hostile
    attack: T1055
    conf: 0.99
    mbc: B0033
    all:
      - id: micro-behaviors/os/application/hook/event::xll-auto-open
      - id: micro-behaviors/process/attach/rights::nt-open-process-name
      - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
      - id: micro-behaviors/process/inject/runtime/call::nt-write-virtual-memory-name
      - id: micro-behaviors/process/thread/create::nt-create-thread-ex-name
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
