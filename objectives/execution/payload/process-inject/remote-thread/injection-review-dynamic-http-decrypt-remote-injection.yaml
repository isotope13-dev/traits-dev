# Concealed remote-write and remote-thread API names occur alongside
# dynamic resolution, executable protection, HTTP, and decryption.
# The imgdecode 1.0.1/1.0.2 npm native addons are examples of this profile;
# the co-occurrence alone does not prove the download-to-thread data flow.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1055,T1105,T1140,T1027.007
  mbc: B0033
composite_rules:
  - id: dynamic-http-decrypt-remote-injection
    desc: Concealed remote-injection APIs with HTTP decryption
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/communications/http/client/wininet::internet-open-url
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::bcrypt-decrypt-api
      - id: micro-behaviors/mem/protect/modify/executable::executable-page-protection-evidence
      - id: micro-behaviors/mem/write/arbitrary::xor-writeprocessmemory-name-prefix
      - id: micro-behaviors/process/inject/remote-thread::xor-createremotethread-name-prefix
