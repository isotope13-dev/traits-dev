defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: unsigned-embedded-pe-remote-thread-injector
    desc: Unsigned PE with embedded images and remote-thread injection APIs
    crit: suspicious
    conf: 0.95
    attack: T1055
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/layout/embedded::embedded-pe-multi
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
      - id: micro-behaviors/process/attach/rights::open-process
    unless:
      - id: metadata/installer/product/
      # Frida's agent injector embeds helper images and remote-thread APIs.
      - id: well-known/tool/reverse-engineering/frida::frida-tool-context

  - id: unsigned-embedded-pe-native-thread-loader
    desc: Unsigned PE embeds an image and uses native remote-thread API
    crit: hostile
    conf: 0.93
    attack: T1055
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/layout/embedded::embedded-pe-image
      - id: micro-behaviors/process/inject/remote-thread::native-remote-thread-create--rtlcreateuserthread-text
      - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
    any:
      - id: micro-behaviors/process/attach/rights::open-process-binary-name
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
    needs: 1
    unless:
      - id: metadata/installer/product/
      - id: well-known/tool/reverse-engineering/frida::frida-tool-context

  - id: go-obfuscated-embedded-pe-remote-thread-injector
    desc: Obfuscated Go dropper embeds PEs with sandbox evasion and injection
    crit: hostile
    conf: 0.97
    attack: T1055,T1027
    all:
      - id: unsigned-embedded-pe-remote-thread-injector
      - id: objectives/anti-analysis/sandbox-detect/environment::go-issandbox-func
      - id: objectives/anti-static/obfuscation/instruction/insertion-junk::go-mutateself-func

  - id: unsigned-suspended-remote-thread-dll-injector
    desc: Unsigned PE launches suspended target and injects via remote thread
    crit: hostile
    conf: 0.95
    for: [pe, dll]
    attack: T1055.001
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/process/create/exec::x64-createprocess-suspended
      - id: micro-behaviors/process/inject/runtime/memory::x64-remote-allocation-write-calls
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
      - id: micro-behaviors/process/thread/lifecycle::resume-thread-call
      - id: micro-behaviors/dylib/load/runtime::windows-load-library-import
    unless:
      # pywin32 binding modules name CreateRemoteThread and WriteProcessMemory.
      - id: well-known/lib/native/pywin32::pywin32-extension-module
      # radare2's debugger and I/O components legitimately use remote-memory APIs.
      - id: well-known/tool/reverse-engineering/radare2::radare2-libr-source-path
      - id: well-known/tool/reverse-engineering/frida::frida-tool-context
      - id: well-known/lib/runtime/native-platform/cygwin::cygwin-family-runtime
      - id: well-known/lib/runtime/scripted/electron::chromium-engine-binary-context
    # Installer builders use remote-thread APIs. Their product family expands
    # past the 64-rule unless cap, so it demotes to suspicious instead.
    downgrade:
      any:
      - id: metadata/installer/product/

  - id: unsigned-x64-remote-write-thread-injector
    desc: Unsigned x64 PE injects code via remote allocation, write, and thread
    crit: hostile
    conf: 0.95
    for: [pe, dll]
    arch: [x86-64]
    attack: T1055.001
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/process/inject/runtime/memory::x64-remote-allocation-write-calls
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
      - id: micro-behaviors/process/create/native-symbol::create-process-api-reference
    any:
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-symbol
      - id: micro-behaviors/os/registry/autostart/write::run-path-write-api-references
    needs: 1
    unless:
      # pywin32 binding modules name CreateRemoteThread and WriteProcessMemory.
      - id: well-known/lib/native/pywin32::pywin32-extension-module
      # radare2's debugger and I/O components legitimately use remote-memory APIs.
      - id: well-known/tool/reverse-engineering/radare2::radare2-libr-source-path
      - id: well-known/tool/reverse-engineering/frida::frida-tool-context
      - id: well-known/lib/runtime/native-platform/cygwin::cygwin-family-runtime
      - id: well-known/lib/runtime/scripted/electron::chromium-engine-binary-context
    downgrade:
      any:
      - id: metadata/installer/product/
