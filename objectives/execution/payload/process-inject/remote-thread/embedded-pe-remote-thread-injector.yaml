defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: unsigned-embedded-pe-remote-thread-injector
    desc: Unsigned PE with embedded images and remote-thread injection APIs
    crit: suspicious
    conf: 0.95
    attack: T1055
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/layout/embedded::embedded-pe-multi
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
      - id: micro-behaviors/process/attach/rights::open-process
    unless:
      - id: metadata/installer/product/
      # Frida's agent injector embeds helper images and remote-thread APIs.
      - id: well-known/tool/reverse-engineering/frida::frida-tool-context

  - id: go-obfuscated-embedded-pe-remote-thread-injector
    desc: Obfuscated Go dropper embeds PEs with sandbox evasion and injection
    crit: hostile
    conf: 0.97
    attack: T1055,T1027
    all:
      - id: unsigned-embedded-pe-remote-thread-injector
      - id: objectives/anti-analysis/sandbox-detect/environment::go-issandbox-func
      - id: objectives/anti-static/obfuscation/instruction/insertion-junk::go-mutateself-func
