defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: unsigned-embedded-pe-remote-thread-injector
    desc: Unsigned carrier injects embedded PE remotely
    crit: hostile
    conf: 0.98
    attack: T1055.002
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/layout/embedded::embedded-pe-multi
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
      - id: micro-behaviors/process/attach/rights::open-process
    unless:
      - id: metadata/installer/product/
