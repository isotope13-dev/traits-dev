defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: winlogon-credential-logon-injection
    desc: Winlogon credential-logon injection
    crit: hostile
    attack: T1055.001,T1134.001,T1562.001
    conf: 0.99
    all:
      - id: micro-behaviors/process/info/name::winlogon-executable-reference
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-script
      - id: micro-behaviors/os/security/auth/verify::powershell-lsa-logon-helper-reference
      - id: micro-behaviors/communications/ipc/named-pipe::powershell-writes-password-bytes-to-pipe
