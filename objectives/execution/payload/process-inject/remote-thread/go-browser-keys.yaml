defaults:
  for:
  - pe
  platforms:
  - windows
composite_rules:
- id: go-reflective-browser-key-extractor
  desc: Reflective injection with browser-key extraction
  crit: hostile
  conf: 0.98
  attack: T1055,T1555.003
  all:
  - id: micro-behaviors/data/config/browser-preference::chromium-app-bound-encrypted-key-field
  - id: micro-behaviors/crypto/decrypt::go-embedded-dll-decrypt-call
  - id: micro-behaviors/process/inject/dll::go-reflective-injection-call
  - id: micro-behaviors/crypto/key/export::go-pipe-v20-key-retrieval-call
  - id: micro-behaviors/process/thread/create::nt-create-thread-ex-name
  - id: micro-behaviors/process/inject/runtime/call::nt-write-virtual-memory-name
