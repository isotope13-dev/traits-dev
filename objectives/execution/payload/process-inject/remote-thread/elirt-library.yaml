defaults:
  platforms: [windows]
  for: [static-lib, pe, dll]
  attack: T1055
  mbc: B0013

composite_rules:
  - id: elirt-injection-library
    desc: Binary implements EliRT remote-thread process injection
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/inject/remote-thread::elirt-remote-thread-library
      - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
