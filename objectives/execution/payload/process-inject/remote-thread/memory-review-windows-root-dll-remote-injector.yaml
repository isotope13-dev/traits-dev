defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: windows-root-dll-remote-injector
    desc: Remote process injector references a Windows-root DLL
    crit: hostile
    conf: 0.97
    attack: T1055,T1574.001
    scope: leaf
    all:
      - id: micro-behaviors/fs/path/windows-root::windows-root-dll-reference
      - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
