defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
composite_rules:
  # Persistence supplies the unwanted-loader admission. The code evidence
  # survives damaged/missing resource data; successful injection is not claimed.
  - id: persistent-resource-dll-thread-loader
    desc: Persistent resource loader with DLL-thread handoff
    crit: hostile
    conf: 0.97
    attack: T1055.001
    all:
      - id: micro-behaviors/process/inject/dll::x86-remote-dll-export-thread
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
    any:
      - id: objectives/persistence/system/service/loader::lanmanserver-servicedll-replacement-injector
      - id: objectives/persistence/login/registry/autostart::active-setup-self-copy-dll-injector
      - id: objectives/persistence/system/service/install::hidden-resource-injector-auto-service
