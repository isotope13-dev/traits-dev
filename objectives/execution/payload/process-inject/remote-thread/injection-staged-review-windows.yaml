defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: delayed-noaccess-remote-thread-source
    desc: Delayed no-access remote thread staging
    crit: hostile
    conf: 0.99
    attack: T1055
    mbc: B0033
    for: [c, cpp]
    all:
      - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-ex-noaccess-source
      - id: micro-behaviors/mem/protect/constant::page-execute-readwrite
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-source
      - id: micro-behaviors/process/config/launch::create-suspended-flag-reference
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/time/sleep/interval::sleep-source
      - id: micro-behaviors/process/thread/lifecycle::resume-thread
