defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: wininet-dynamic-process-memory-loader
    desc: WinInet delivery with dynamic remote-memory staging
    crit: hostile
    conf: 0.97
    attack: T1105,T1055
    all:
      - id: micro-behaviors/communications/http/client/wininet::wininet-session-request-api-set
      - id: micro-behaviors/process/create/exec::create-process-api-name
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex
      - id: objectives/execution/payload/process-inject/hollowing/process::dynamic-procedure-resolution
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/section/entropy::large-high-entropy-rwx-reloc
