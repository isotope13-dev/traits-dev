composite_rules:
- for:
  - pe
  - dll
  platforms:
  - windows
  attack: T1027.009,T1055,T1053.005
  id: embedded-pe-remote-thread-system-task
  desc: Embedded PE, remote thread and SYSTEM task
  crit: hostile
  conf: 0.99
  scope: outer
  all:
  - id: metadata/binary/layout/embedded::pe-code-headers-high-entropy
  - id: micro-behaviors/process/inject/dll::embedded-pe-remote-thread-api-profile
  - id: objectives/persistence/login/scheduled-task/masquerade::microsoft-namespace-repeating-system-task
  unless:
  - id: metadata/installer/product/
