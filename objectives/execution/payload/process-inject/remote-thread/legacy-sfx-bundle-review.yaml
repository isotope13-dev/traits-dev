defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: microsoft-nsis-embedded-remote-injection-apis
  desc: Microsoft-signed NSIS bundle with remote injection APIs
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/signature/verified/platform::microsoft
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/layout/ratio::many-pe-embedded
  - id: metadata/binary/layout/size::large-overlay-1mb
  - id: well-known/tool/packaging/nsis::nsis
  - id: metadata/installer/recognition::installer-plugin-dll-name-pair
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex
  any:
  - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
  - id: micro-behaviors/fs/path/basename::mavinject32-executable-reference
  - id: metadata/binary/layout/ratio::tnameserv-name
  - id: well-known/tool/packaging/nsis::nsis-uac-bridge
  needs: 2
