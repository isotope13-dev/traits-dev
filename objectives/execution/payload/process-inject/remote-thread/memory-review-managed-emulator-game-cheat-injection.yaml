defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: managed-emulator-game-cheat-injection
    desc: Managed cheat injection into an Android emulator process
    crit: hostile
    conf: 0.98
    attack: T1055
    for:
      - pe
    all:
      - id: well-known/game/cheat::cheat-control-set
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-text
      - id: micro-behaviors/process/attach/rights::open-process-binary-name
    any:
      - id: well-known/game/cheat::emulator-game-target
      - id: well-known/game/cheat::gameloop-emulator-target
