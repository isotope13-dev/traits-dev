defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: managed-keylogger-remote-thread-injection
    desc: Keylogger with managed remote-thread injection calls
    crit: hostile
    conf: 0.97
    attack: T1055
    # Actual CIL calls are necessary: unused native interop declarations do
    # not supply injection. Do not infer hollowing or successful execution.
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: micro-behaviors/process/inject/remote-thread::managed-remote-allocation-write-thread-calls
