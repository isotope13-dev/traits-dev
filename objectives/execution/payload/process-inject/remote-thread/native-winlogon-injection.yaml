# Native injection into Winlogon: the loader references winlogon.exe while
# holding SeDebugPrivilege and writes into the target before starting a
# remote thread or rewriting its thread context. Signed security software
# that injects for defensive hooks is excluded; unsigned debug-privileged
# Winlogon writes are the classic hidden-process/System-token staging step.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: native-winlogon-injection
    desc: Native injection targets Winlogon under debug privileges
    crit: hostile
    conf: 0.97
    attack: T1055.001,T1134
    all:
      - id: micro-behaviors/process/info/name::winlogon-executable-reference
      - id: micro-behaviors/os/privilege/token/adjust::debug-privilege-process-access
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-binary
    any:
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
      - id: micro-behaviors/process/control/thread::native-set-thread-context-name
    needs: 1
    unless:
      - id: metadata/signature/verified/
