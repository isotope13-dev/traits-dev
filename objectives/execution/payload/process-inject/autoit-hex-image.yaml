# The required source profile combines an embedded image, the suspended-image
# transplant routine, remote writes, and a concealed memory-writing API name.
# It does not identify the embedded image's eventual purpose or payload family.
defaults:
  platforms: [windows]
  for: [text, data, vbs]
  attack: T1055.012
composite_rules:
  - id: autoit-hex-image-hollowing
    desc: Hex image accompanies obfuscated AutoIt hollowing
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/encoding::assigned-mz-prefixed-hex-string
      - id: objectives/evasion/process/injection/hollowing/process::autoit-suspended-image-replacement-source
      - id: micro-behaviors/mem/write/arbitrary::autoit-write-process-memory-call
      - id: objectives/anti-static/obfuscation/string/concat::autoit-process-memory-api-character-array
