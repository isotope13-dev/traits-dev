defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Reviewed CIL allocates a byte array, writes it to a suspended child,
  # sets Eip to the allocation, then resumes the child. Calls alone establish
  # no successful injection; the independent ransom lockout admits abuse.
  - id: managed-ransom-thread-context-injection-attempt
    desc: Ransom locker calls image-unmap and thread-redirection APIs
    crit: hostile
    conf: 0.97
    attack: T1055.012
    all:
      - id: objectives/impact/ransom/extortion::managed-ransom-input-lockout
      - id: micro-behaviors/process/inject/thread-context::managed-unmap-write-context-resume-calls
      - id: micro-behaviors/process/create/launch::create-process-api-name
