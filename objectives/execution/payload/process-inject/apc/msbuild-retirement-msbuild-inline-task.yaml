defaults:
  platforms: [windows]
  for: [xml]
  attack: T1127.001

composite_rules:
- id: msbuild-inline-apc-process-write
  desc: MSBuild inline task with memory-write and APC references
  crit: hostile
  conf: 0.96
  all:
  - id: metadata/build/msbuild::msbuild-inline-task-declaration
  - id: micro-behaviors/os/callback/apc::queue-user-apc
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-text
