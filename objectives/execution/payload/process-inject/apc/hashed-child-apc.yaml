defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055.004
composite_rules:
  # Early Bird APC injection with every step resolved by CRC32 name digest:
  # create a child process (suspended), write into it, queue an APC on its
  # primary thread and resume it so the APC runs before the entry point.
  # Hashing exactly this API set keeps it out of the import table; benign
  # software that creates processes imports the APIs it calls.
  - id: crc32-hashed-child-write-apc-resume
    desc: Hashed child create, write, APC and resume
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/api-resolution/digest-export/targets::crc32-nt-write-virtual-memory
      - id: micro-behaviors/os/api-resolution/digest-export/targets::crc32-nt-queue-apc-thread
      - id: micro-behaviors/os/api-resolution/digest-export/targets::crc32-nt-resume-thread
    any:
      - id: micro-behaviors/os/api-resolution/digest-export/targets::crc32-nt-create-user-process
      - id: micro-behaviors/os/api-resolution/digest-export/targets::crc32-create-process-internal-w
