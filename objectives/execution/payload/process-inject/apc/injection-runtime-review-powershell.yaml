defaults:
  conf: 0.99
  crit: hostile
  for: [powershell, batch]
  platforms: [windows]
  attack: T1055
  mbc: B0033

composite_rules:
  - id: powershell-apc-hex-payload
    desc: PowerShell APC and hex payload clues
    all:
      - id: micro-behaviors/process/inject/apc::powershell-apc-process-api-profile
      - id: micro-behaviors/data/encode/hex::powershell-csharp-hex-byte-decoder
  - id: powershell-gzip-thread-context-injection
    desc: PowerShell gzip and thread-context injection
    attack: T1055.012,T1027,T1140
    for: [powershell]
    all:
      - id: micro-behaviors/data/decompress/stream::powershell-compressionmode-decompress
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-text
      - id: micro-behaviors/process/info/thread::get-thread-context
      - id: micro-behaviors/process/thread/config::set-thread-context
      - id: micro-behaviors/process/thread/lifecycle::resume-thread
      - id: micro-behaviors/mem/combined::powershell-rwx-protection-evidence
      - id: objectives/evasion/self-delete/file/script::remove-ps1
    any:
      - id: metadata/lang/scripted::obfuscated-add-type-definition
      - id: metadata/lang/scripted::add-type-definition
      - id: micro-behaviors/metaprogramming/generation/compile::powershell-add-type-variable
