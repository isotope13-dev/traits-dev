defaults:
  platforms:
    - windows
  for:
    - c
    - cpp
  attack: T1055.004
composite_rules:
  - id: native-suspended-child-apc-injection
    desc: Suspended-child APC injection API profile
    crit: hostile
    conf: 0.97
    unless:
      - id: well-known/lib/platform/wine::wine-compatibility-test-source
    all:
      - id: micro-behaviors/process/create/exec::createprocess-suspended-identifier
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
      - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-ex
      - id: micro-behaviors/process/inject/apc::queue-user-apc-zero-data-call
      - id: micro-behaviors/process/thread/lifecycle::resume-thread
