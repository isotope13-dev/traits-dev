defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: native-suspended-pe-section-context-loader
    desc: Suspended PE section mapping and entry rewrite
    crit: hostile
    conf: 0.99
    attack: T1055.012
    all:
      - id: metadata/binary/code/arguments::x64-suspended-process-stack-arguments
      - id: micro-behaviors/process/inject/runtime/thread-context::x64-pe-section-copy-arguments
      - id: micro-behaviors/process/inject/runtime/thread-context::x64-base-relative-context-rcx-store
      - id: micro-behaviors/process/inject/runtime/thread-context::remote-memory-thread-context-api-set
      - id: micro-behaviors/process/create/spawn::create-process-w
