defaults:
  platforms: [windows]
  for: [batch]

composite_rules:
  - id: encoded-hollowing-name-and-apis
    desc: Encoded process-hollowing name and APIs
    crit: hostile
    attack: T1055.012
    conf: 0.99
    all:
      - id: metadata/lang/encoding/base64::encoded-process-hollowing-name
      - id: metadata/lang/encoding/base64::encoded-create-process-a-name
      - id: metadata/lang/encoding/base64::encoded-virtual-alloc-ex-name
      - id: metadata/lang/encoding/base64::encoded-get-thread-context-name
      - id: metadata/lang/encoding/base64::encoded-set-thread-context-name
      - id: metadata/lang/encoding/base64::encoded-resume-thread-name
