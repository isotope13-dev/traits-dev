defaults:
  platforms:
    - windows
  for: [scripts, binaries]

composite_rules:
  - id: version-proxy-hollowing-loader
    desc: Version proxy and hollowing API clues
    crit: hostile
    conf: 0.99
    attack: T1574.002
    for: [pe]
    all:
      - id: metadata/binary/symbols/version-proxy::version-proxy-extra-loader-exports
      - id: micro-behaviors/communications/socket/init::wsa-startup
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
