defaults:
  attack: T1055.012,T1620
  platforms:
  - windows
  for:
  - powershell
  - pe
  - zip
composite_rules:
- id: powershell-masked-native-host-image-transplant
  desc: Masked assembly launcher redirects a suspended native host
  crit: hostile
  scope: outer
  conf: 0.98
  all:
  - id: objectives/execution/payload/module-load/transformed::powershell-xor-masked-assembly-module-load
  - id: micro-behaviors/process/interpreter/runtime/clr::powershell-masked-assembly-native-host-profile
  any:
  - id: micro-behaviors/process/inject/runtime/thread-context::cil-suspended-context-entry-transplant
  - id: micro-behaviors/process/inject/runtime/thread-context::cil-local-suspended-context-entry-transplant
  - id: micro-behaviors/process/deploy/image-map::x86-header-relative-entry-jump
  - id: objectives/anti-static/obfuscation/obfuscator/managed::dotnet-reactor-obfuscator
  - id: objectives/anti-static/obfuscation/anti-decompile::suppress-ildasm-managed-pe
  needs: 1
- id: c-sec-image-carrier-dll-stomping
  desc: Stomps mapped SEC_IMAGE DLL and flushes icache
  crit: hostile
  conf: 0.98
  for: [c, cpp]
  all:
  - id: micro-behaviors/mem/write/arbitrary::image-creation-and-mapped-pe-copy-source
  - id: micro-behaviors/mem/write/arbitrary::c-sec-image-carrier-flush-icache
  - id: objectives/execution/payload/image-map::mapped-pe-dll-attach-source
