# Process Doppelganging / Transacted Hollowing: write a payload into a
# transacted file, create an NT image section, roll back the transaction so
# the payload never persists on disk, then map and execute it.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, go, rust]
  attack: T1055.013
  mbc: E1055

composite_rules:
  - id: process-doppelganging-section
    desc: Transacted file rolled back after NT section creation
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/file/handle::create-transaction-api
      - id: micro-behaviors/fs/file/handle::create-file-transacted-api
      - id: micro-behaviors/fs/file/handle::rollback-transaction-api
      - id: micro-behaviors/mem/create/shared::nt-create-section-api-string
      - id: micro-behaviors/mem/map::nt-map-view-section-api-string

  - id: process-doppelganging-injection
    desc: Process Doppelganging via rolled-back transaction and thread hijack
    crit: hostile
    conf: 0.98
    for: [pe, dll]
    all:
      - id: process-doppelganging-section
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-binary
      - id: micro-behaviors/process/info/thread::thread-context-triple-no-suspend
    unless:
      - id: metadata/signature/verified/
