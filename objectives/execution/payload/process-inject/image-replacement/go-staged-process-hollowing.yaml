# Go binary downloads staged payload via HTTP and hollows a process image.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105,T1055.012

composite_rules:
  - id: go-staged-process-hollowing-loader
    desc: Go staged process hollowing payload loader
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/get::go-native-http-get-reference
      - id: metadata/lang/compiler/systems::go-runtime-symbol
      - id: micro-behaviors/process/info/thread::thread-context-triple-no-suspend
      - id: micro-behaviors/mem/combined::remote-process-memory-api-cluster
    any:
      - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
      - id: micro-behaviors/process/inject/runtime/thread-context::remote-memory-thread-context-api-set
      - id: micro-behaviors/process/inject/runtime/call::remote-allocate-write-api-profile
    unless:
      - id: metadata/signature/verified/
