# Embedded data and RunPE type names indicate an injection-oriented loader.
defaults:
  for:
  - pe
  platforms:
  - windows
  attack: T1027.009, T1055.012
  mbc: F0001.006
composite_rules:
- id: nativeaot-embedded-data-runpe-clues
  desc: NativeAOT embedded data with RunPE type clues
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/lang/compiler/aot::nativeaot-runtime-markers
  - id: objectives/anti-static/obfuscation/payload/section/layout::large-high-entropy-gfx-section
  - id: objectives/anti-static/obfuscation/payload/section/layout::nativeaot-gfx-embedded-section-descriptor
  - id: objectives/execution/payload/process-inject/hollowing/runtime::nativeaot-runpe-type-cluster
  unless:
  - id: metadata/installer/product/
