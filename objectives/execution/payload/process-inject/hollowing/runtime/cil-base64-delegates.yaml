defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055.012
composite_rules:
  - id: cil-base64-delegate-image-replacement
    desc: Suspended image replacement with API delegates
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/inject/runtime/call::cil-base64-image-replacement-profile
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
  - id: cil-suspended-process-hollowing
    desc: Managed assembly hollows suspended process with thread-context rewrite
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/inject/runtime/call::managed-image-replacement-api-set
    any:
      - id: micro-behaviors/process/inject/runtime/thread-context::cil-suspended-context-entry-transplant
      - id: micro-behaviors/process/inject/runtime/thread-context::cil-local-suspended-context-entry-transplant
    needs: 1
