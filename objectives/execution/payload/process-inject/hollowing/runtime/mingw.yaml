defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055.012
  mbc: E1055.012

# binary.data_to_file_ratio / binary.rsrc_to_file_ratio are phantom analyzer
# fields (never emitted), so the old lacks-substantial-* legs never fired.
# Fragtor-class MinGW RunPE loaders pad with slash-numeric COFF sections
# and/or embed a split replica-name marker. Remote allocation and write
# primitives distinguish hollowing from MinGW runtime thread management.

composite_rules:
  - id: objectives/execution/payload/process-inject/hollowing/runtime::mingw-runpe-import-cluster
    desc: MinGW RunPE import cluster with slash-numeric padding
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/lang/compiler/native::mingw-built-pe
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex-dup
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
    any:
      - id: metadata/binary/section/layout::many-slash-numeric-sections
      - id: metadata/binary/section/layout::slash-numeric-large-zero-section
      - id: objectives/impact/infect/virus::mutated-exe-replica-name
