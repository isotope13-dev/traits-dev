# PowerShell stagers that decode a managed assembly in memory and hand it a
# .NET Framework host executable (aspnet_compiler.exe, RegAsm.exe) to hollow.
# The SnakeKeylogger quote-request chain passes the host path and the final
# payload to the loaded assembly; the host name is a loader argument, not a
# string the Framework host tools would ever carry themselves. Without the
# loaded assembly's hollowing code in view (or a typed MZ image, which
# powershell-masked-host.yaml convicts on) this stays suspicious.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1055.012,T1620
  mbc: E1055.012

composite_rules:
- id: powershell-decoded-assembly-aspnet-host
  desc: Decoded assembly load with aspnet_compiler target
  crit: suspicious
  conf: 0.93
  all:
  - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load-call
  - id: well-known/lib/runtime/managed/dotnet-runtime::aspnet-tool-exe-name
  any:
  - id: micro-behaviors/data/bitwise/xor-forms/indexed::powershell-modulo-xor-references
  - id: micro-behaviors/crypto/decrypt/initialize::powershell-create-decryptor-call
  needs: 1
  near_lines: 60

- id: powershell-decoded-assembly-regasm-host
  desc: Decoded assembly load with RegAsm target
  crit: suspicious
  conf: 0.93
  all:
  - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load-call
  - id: well-known/lib/runtime/managed/dotnet-runtime::regasm-exe-name
  any:
  - id: micro-behaviors/data/bitwise/xor-forms/indexed::powershell-modulo-xor-references
  - id: micro-behaviors/crypto/decrypt/initialize::powershell-create-decryptor-call
  needs: 1
  near_lines: 60

# Inline P/Invoke hollowing: unmapping the host image, writing the payload
# into the remote process and redirecting its thread context is the RunPE
# sequence itself, whatever executable is chosen as the host.
- id: powershell-inline-pinvoke-hollowing
  desc: PowerShell P/Invoke process hollowing APIs
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/mem/unmap::script-native-section-unmap-text
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: micro-behaviors/process/thread/config::set-thread-context
  near_bytes: 8192

- id: powershell-inline-hollowing-aspnet-host
  desc: PowerShell unmap and write APIs with aspnet_compiler
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/mem/unmap::script-native-section-unmap-text
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: well-known/lib/runtime/managed/dotnet-runtime::aspnet-tool-exe-name
  near_bytes: 8192
