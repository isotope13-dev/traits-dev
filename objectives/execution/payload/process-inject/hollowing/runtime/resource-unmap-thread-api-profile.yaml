defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: resource-unmap-thread-api-profile
    desc: Resource unmap and thread API clues
    crit: suspicious
    conf: 0.88
    all:
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: micro-behaviors/mem/unmap::native-section-unmap-api-references
      - id: micro-behaviors/mem/read/cross-process::read-process-memory
      - id: micro-behaviors/mem/write/arbitrary::remote-memory-write-api-references
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: metadata/binary/resource/size::oversized-rsrc
      - id: micro-behaviors/data/embedded/payload/resource::sizeof-resource
    any:
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/enumerate/wmi::win32-process-select-all-query
      - id: micro-behaviors/os/registry/software/reference::avast-uninstall-key
      - id: metadata/build/manifest::require-administrator
    needs: 2
    downgrade:
      any:
        - id: well-known/tool/development/editor/visual-studio::diagnostics-hub
        - id: well-known/tool/reverse-engineering/ida-debugger::ida-debugger-server
        - id: well-known/tool/reverse-engineering/scylla/
