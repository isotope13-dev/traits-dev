# A managed PE that hides CreateProcessA, ReadProcessMemory, and WriteProcessMemory
# behind Base64 strings and dynamic delegates while also calling VirtualAllocEx,
# SetThreadContext, and ResumeThread implements process hollowing.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: managed-encoded-process-hollowing
    desc: Obfuscated .NET assembly performs encoded process hollowing
    crit: hostile
    conf: 0.98
    attack: T1055.012
    scope: file
    all:
      - id: objectives/anti-static/obfuscation/decoders::managed-encoded-remote-memory-api-references
      - id: micro-behaviors/process/thread/config
      - id: micro-behaviors/process/thread/lifecycle
      - id: micro-behaviors/mem/alloc/virtual
