defaults:
  platforms:
  - windows
  for:
  - class
  attack: T1055.012
  mbc: E1055.012
composite_rules:
- id: objectives/execution/payload/process-inject/hollowing/runtime::java-process-hollowing
  desc: Java process hollowing via native execution bridge
  crit: hostile
  conf: 0.99
  all:
  - id: well-known/lib/platform/jna::core-types-import
  - id: micro-behaviors/process/create/exec::create-process-api-name
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex-dup
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: micro-behaviors/mem/unmap::nt-unmap-view-of-section-import
  - id: micro-behaviors/process/thread/lifecycle::resume-thread
  any:
  - id: micro-behaviors/process/info/thread::get-thread-context
  - id: micro-behaviors/process/thread/config::set-thread-context
