# Managed RunPE: CIL call sites (not just P/Invoke declarations) create a
# child process, unmap its image, write a replacement, rewrite the thread
# context and resume it. The call atoms accept both the kernel32 names and
# their ntdll Nt/Zw forms, so the rule survives switching API layer, host
# executable, payload source or encoding. Call co-occurrence does not prove
# that all calls share one process handle; the full replacement sequence
# has no other ordinary managed use.
#
# Dynamic-resolution variant: engines that load kernel32 themselves and bind
# CreateProcessA/ZwUnmapViewOfSection/SetThreadContext through
# GetProcAddress + function-pointer delegates leave no managed call sites.
# Their staged failure strings ("Failed to unmap section", "Failed to update
# PEB", "Failed to set thread context", "Failed to resume thread") are the
# hollowing state machine made visible; no ordinary managed binary carries
# that sequence.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055.012
  mbc: E1055.012
traits:
  - id: runpe-unmap-failure-string
    desc: RunPE unmap failure string
    crit: notable
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      substr: 'Failed to unmap section'
  - id: runpe-peb-failure-string
    desc: RunPE PEB update failure string
    crit: notable
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      substr: 'Failed to update PEB'
  - id: runpe-thread-context-failure-string
    desc: RunPE thread context failure string
    crit: notable
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      substr: 'Failed to set thread context'
  - id: runpe-resume-failure-string
    desc: RunPE resume failure string
    crit: notable
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      substr: 'Failed to resume thread'
composite_rules:
  - id: managed-runpe-image-replacement-calls
    desc: Managed child-image replacement call sequence
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/process/create/exec::create-process-api-name
      - id: micro-behaviors/process/inject/thread-context::managed-unmap-write-context-resume-calls
    unless:
      - id: metadata/build/generated::winmd-metadata
  - id: managed-dynamic-resolve-runpe-engine
    desc: Managed engine resolves hollowing APIs dynamically
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: runpe-unmap-failure-string
      - id: runpe-peb-failure-string
      - id: runpe-thread-context-failure-string
      - id: runpe-resume-failure-string
    any:
      - id: micro-behaviors/mem/unmap::zw-unmap-section-name
      - id: micro-behaviors/process/create/exec::create-process-api-name
