defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1055.012
  mbc: E1055.012
traits:
  - id: objectives/execution/payload/process-inject/hollowing/runtime::nt-unmap-section-vb6
    desc: Unmaps host image for hollowing (VB6)
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: NtUnmapViewOfSection
    unless:
      - id: metadata/file/format/record-sequence::hashed-text-record
      # File-scoped: a real unmap call beside the binding banner is suppressed.
      - id: metadata/lang/upstream::freebasic-windows-binding
  - id: objectives/execution/payload/process-inject/hollowing/runtime::image-base-rebase-vb6
    desc: VB6 remote image base rewrite
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: ByVal Ctx.Ebx + 8, Pinh.OptionalHeader.ImageBase
  - id: objectives/execution/payload/process-inject/hollowing/runtime::entrypoint-pivot-vb6
    desc: VB6 remote entrypoint pivot
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: Ctx.Eax = Pinh.OptionalHeader.ImageBase
  - id: objectives/execution/payload/process-inject/hollowing/runtime::dynamic-api-thunk-vb6
    desc: VB6 dynamic API thunk dispatcher
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: lMod = GetProcAddress(LoadLibraryA(sLib), sMod)
composite_rules:
  - id: objectives/execution/payload/process-inject/hollowing/runtime::suspended-hollowing-primitives-vb6
    desc: VB6 suspended process hollowing primitives
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/subprocess/reference::create-process-vb6
      - id: micro-behaviors/process/config/launch::create-suspended-vb6
      - id: objectives/execution/payload/process-inject/hollowing/runtime::nt-unmap-section-vb6
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex-vb6
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: objectives/execution/payload/process-inject/hollowing/runtime::thread-context-hollowing-vb6
    desc: VB6 thread context hollowing chain
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/payload/process-inject/hollowing/runtime::suspended-hollowing-primitives-vb6
      - id: micro-behaviors/process/info/thread::get-thread-context-vb6
      - id: micro-behaviors/process/thread/config::set-thread-context-vb-reference
      - id: micro-behaviors/process/info/thread::resume-thread-vb6
    any:
      - id: objectives/execution/payload/process-inject/hollowing/runtime::image-base-rebase-vb6
      - id: objectives/execution/payload/process-inject/hollowing/runtime::entrypoint-pivot-vb6
  - id: objectives/execution/payload/process-inject/hollowing/runtime::concealed-hollowing-loader-vb6
    desc: VB6 concealed process hollowing loader
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/execution/payload/process-inject/hollowing/runtime::thread-context-hollowing-vb6
      - id: objectives/execution/payload/process-inject/hollowing/runtime::dynamic-api-thunk-vb6
