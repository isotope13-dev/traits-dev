# Process hollowing through ntdll. The loader writes into a remote image, points the
# suspended thread at it with NtSetContextThread, and resumes it with NtResumeThread.
# The Win32 hollowing composites in windows.yaml need CreateProcess, Get/SetThreadContext
# and ResumeThread names, so a loader that calls the Nt names directly escapes them.
# All three legs are PE imports; the write leg already covers Nt/Zw write names.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055.012

composite_rules:
  - id: native-nt-hollowing-stager
    desc: Native ntdll hollowing writes a remote image and resumes it
    crit: hostile
    conf: 0.93
    scope: file
    all:
      - id: micro-behaviors/mem/write/arbitrary::process-memory-write-call
      - id: micro-behaviors/process/info/thread::native-set-thread-context-import
      - id: micro-behaviors/process/info/thread::native-resume-thread-import
    unless:
      # Wine's builtin kernelbase and ntdll implement NtWriteVirtualMemory,
      # NtSetContextThread and NtResumeThread as their own job, so a Wine
      # DLL imports all three names without hollowing anything.
      - id: well-known/lib/platform/wine::wine-builtin-dll-marker
