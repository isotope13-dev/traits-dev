# The API combination supports an image-replacement loader review, but does
# not bind the network bytes to the remote write or establish authorization.
# Keep this suspicious and describe the co-occurrence rather than execution.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: managed-downloader-image-replacement-profile
    desc: Managed downloader with image-replacement APIs
    crit: suspicious
    conf: 0.96
    attack: T1055.012
    scope: leaf
    all:
      - id: micro-behaviors/process/inject/runtime/call::managed-image-replacement-api-set
      - id: micro-behaviors/process/create/native-symbol::create-process-api-name
      - id: micro-behaviors/process/thread/lifecycle::resume-thread
      - id: micro-behaviors/communications/http/get::getbytearrayasync
      - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor-text
    unless:
      - id: well-known/tool/reverse-engineering/corvus::corvus-reverse-engineering-tool
  # Persistence, a network-fed download, and remote image replacement in one
  # managed image are a loader, not a review candidate: the fetched bytes need
  # not be bound to the write for the activation chain to be hostile.
  - id: managed-downloader-run-key-image-replacement
    desc: Managed downloader persists via Run key and replaces images
    crit: hostile
    conf: 0.96
    attack: T1055.012,T1547.001,T1105
    scope: leaf
    all:
      - id: micro-behaviors/os/registry/autostart/write::managed-run-path-write-api-references
      - id: micro-behaviors/communications/http/get::getbytearrayasync
      - id: micro-behaviors/process/inject/runtime/call::managed-image-replacement-api-set
      - id: micro-behaviors/process/thread/lifecycle::resume-thread
