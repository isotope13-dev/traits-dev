# The three ntdll calls that hollow a process (remote write, context swap,
# resume) beside BCrypt AES-GCM decryption and generated filler code are a
# crypter stub: the image to inject sits encrypted in the file, is decrypted at
# run time, and the injection routine is buried in padding to resist analysis.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
  attack: T1055.012,T1027.002
composite_rules:
  - id: junk-padded-native-hollowing-decrypting-loader
    desc: Junk-padded loader decrypts a blob and hollows a process
    crit: hostile
    conf: 0.92
    scope: file
    all:
      - id: micro-behaviors/mem/write/arbitrary::process-memory-write-call
      - id: micro-behaviors/process/info/thread::native-set-thread-context-import
      - id: micro-behaviors/process/info/thread::native-resume-thread-import
      - id: micro-behaviors/crypto/decrypt/transform/symmetric::bcrypt-gcm-decrypt-api-set
      - id: metadata/binary/instruction/padding::repeated-identical-stack-load-runs
    unless:
      - id: well-known/lib/platform/wine::wine-builtin-dll-marker
