# The unmap and CLR names, PE-header checks, and section names are independent
# observations. They do not establish a call to unmap a target or a write of
# a payload into another process.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055.012,T1027
composite_rules:
  - id: native-unmap-view-loader-with-random-section-names
    desc: Unmap and CLR names with PE checks and nonstandard sections
    crit: suspicious
    conf: 0.82
    all:
      - id: micro-behaviors/mem/unmap::nt-unmap-view-of-section-name
      - id: metadata/binary/section/layout::multiple-nonstandard-section-names
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: micro-behaviors/fs/path/system/library::mscoree-dll-name
    unless:
      - id: metadata/installer/product/
      # phlib's PE mapped-image parser (PE checks, section unmapping).
      - id: well-known/tool/sysadmin/systeminformer::phlib-mapped-image-api
      - id: well-known/tool/browser::google-chrome-runtime-component
      - id: well-known/lib/runtime/scripted/electron::chromium-engine-binary-context
      - id: well-known/tool/browser::verified-google-chromium-distribution-binary
      - id: well-known/app/browser/brave::brave-signed-browser-binary-context
