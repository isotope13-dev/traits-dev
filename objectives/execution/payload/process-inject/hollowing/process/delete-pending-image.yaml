# Bind delete-pending TRUE and SEC_IMAGE setup to their imported APIs.
# Support both disp32 and disp8 stack layouts without campaign constants.
defaults:
  platforms:
  - windows
  for:
  - pe
  arch:
  - x86-64
  attack: T1055
traits:
- id: delete-pending-executable-section
  desc: Embedded delete-pending image setup sequence
  crit: suspicious
  conf: 0.98
  if:
    type: yara
    source: |
      import "pe"
      rule delete_pending_executable_section {
        strings:
          $dispose = {
            C6 84 24 ?? ?? ?? ?? 01
            41 B9 01 00 00 00 C7 44 24 20 0D 00 00 00
            4C 8D 84 24 ?? ?? ?? ?? 48 8B C8
            48 8D 54 24 ?? [0-8] FF 15 ?? ?? ?? ??
          }
          $short = {
            C6 44 24 ?? 01 C7 44 24 20 0D 00 00 00
            4C 8D 74 24 ?? 4C 8D 44 24 ??
            48 89 F1 4C 89 F2 41 B9 01 00 00 00 FF 15 ?? ?? ?? ??
          }
          $image = { C7 44 24 28 00 00 00 01 [0-40] FF 15 ?? ?? ?? ?? }
        condition:
          pe.is_64bit() and $image and ($dispose or $short) and
          pe.imports("ntdll.dll", "NtWriteFile") and
          pe.imports("ntdll.dll", "NtMapViewOfSection") and
          for any s in pe.sections : (
            s.characteristics & pe.SECTION_MEM_EXECUTE != 0 and
            for any m in (1..#image) : (
              @image[m] >= s.raw_data_offset and
              @image[m]+!image[m] <= s.raw_data_offset+s.raw_data_size and
              s.virtual_address+@image[m]-s.raw_data_offset+!image[m]+
                int32(@image[m]+!image[m]-4) ==
                pe.import_rva("ntdll.dll", "NtCreateSection") and (
                for any d in (1..#dispose) : (
                  @dispose[d] >= s.raw_data_offset and
                  @dispose[d]+!dispose[d] <= s.raw_data_offset+s.raw_data_size and
                  @image[m] > @dispose[d] and @image[m] < @dispose[d]+512 and
                  uint32(@dispose[d]+3) == uint32(@dispose[d]+26) and
                  s.virtual_address+@dispose[d]-s.raw_data_offset+!dispose[d]+
                    int32(@dispose[d]+!dispose[d]-4) ==
                    pe.import_rva("ntdll.dll", "NtSetInformationFile")
                )
                or
                for any d in (1..#short) : (
                  @short[d] >= s.raw_data_offset and
                  @short[d]+!short[d] <= s.raw_data_offset+s.raw_data_size and
                  @image[m] > @short[d] and @image[m] < @short[d]+512 and
                  uint8(@short[d]+3) == uint8(@short[d]+22) and
                  s.virtual_address+@short[d]-s.raw_data_offset+!short[d]+
                    int32(@short[d]+!short[d]-4) ==
                    pe.import_rva("ntdll.dll", "NtSetInformationFile")
                )
              )
            )
          )
      }
  downgrade:
    any:
    - id: metadata/binary/code/control-transfer::pe-return-entry-without-callbacks
composite_rules:
- id: delete-pending-image-context-redirection
  desc: Ghosted-image context-redirection code sequence
  crit: suspicious
  conf: 0.98
  all:
  - id: delete-pending-executable-section
  - id: micro-behaviors/process/inject/runtime/thread-context::x64-context-rcx-write-call
  - id: micro-behaviors/process/info/thread::set-thread-context-import
  - id: micro-behaviors/process/info/thread::resume-thread-import
  downgrade:
    any:
    - id: metadata/binary/code/control-transfer::pe-return-entry-without-callbacks
