# The x64 call setup requests FileDispositionInformation (13) with a one-byte
# TRUE buffer. SEC_IMAGE creation and a call bound to the imported API
# distinguish ghosted image preparation from ordinary temporary-file cleanup.
# Diagnostic strings are optional: release builds can omit them.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
  attack: T1055
traits:
  - id: delete-pending-executable-section
    desc: Embedded delete-pending image setup sequence
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: "import \"pe\"\nrule delete_pending_executable_section {\n  strings:\n    $dispose = {\n      C6 84 24 ?? ?? ?? ?? 01\n      41 B9 01 00 00\
        \ 00 C7 44 24 20 0D 00 00 00\n      4C 8D 84 24 ?? ?? ?? ?? 48 8B C8\n      48 8D 54 24 ?? [0-8] FF 15 ?? ?? ?? ??\n    }\n    $image = { C7 44 24\
        \ 28 00 00 00 01 [0-40] FF 15 ?? ?? ?? ?? }\n  condition:\n    pe.is_64bit() and all of them and\n    pe.imports(\"ntdll.dll\", \"NtSetInformationFile\"\
        ) and\n    pe.imports(\"ntdll.dll\", \"NtWriteFile\") and\n    pe.imports(\"ntdll.dll\", \"NtCreateSection\") and\n    pe.imports(\"ntdll.dll\", \"\
        NtMapViewOfSection\") and\n    for any s in (0..pe.number_of_sections-1) : (\n      pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE != 0 and\n\
        \      $dispose in (pe.sections[s].raw_data_offset ..\n        pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size) and\n      $image in\
        \ (pe.sections[s].raw_data_offset ..\n        pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size) and\n      for any d in (1..#dispose)\
        \ : (\n        @dispose[d] >= pe.sections[s].raw_data_offset and\n        @dispose[d]+!dispose[d] <= pe.sections[s].raw_data_offset +\n          pe.sections[s].raw_data_size\
        \ and\n        uint32(@dispose[d]+3) == uint32(@dispose[d]+26) and\n        for any i in (0..pe.number_of_imports-1) : (\n          for any f in (0..pe.import_details[i].number_of_functions-1)\
        \ : (\n            pe.import_details[i].functions[f].name == \"NtSetInformationFile\" and\n            pe.sections[s].virtual_address + @dispose[d]\
        \ -\n              pe.sections[s].raw_data_offset + !dispose[d] +\n              int32(@dispose[d]+!dispose[d]-4) ==\n              pe.import_details[i].functions[f].rva\n\
        \          )\n        )\n      )\n    ) and\n    for any s in (0..pe.number_of_sections-1) : (\n      pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE\
        \ != 0 and\n      for any m in (1..#image) : (\n        @image[m] >= pe.sections[s].raw_data_offset and\n        @image[m]+!image[m] <= pe.sections[s].raw_data_offset\
        \ +\n          pe.sections[s].raw_data_size and\n        for any d in (1..#dispose) : (\n          @image[m] > @dispose[d] and @image[m] < @dispose[d]+512\n\
        \        ) and\n        for any i in (0..pe.number_of_imports-1) : (\n          for any f in (0..pe.import_details[i].number_of_functions-1) : (\n\
        \            pe.import_details[i].functions[f].name == \"NtCreateSection\" and\n            pe.sections[s].virtual_address + @image[m] -\n       \
        \       pe.sections[s].raw_data_offset + !image[m] +\n              int32(@image[m]+!image[m]-4) ==\n              pe.import_details[i].functions[f].rva\n\
        \          )\n        )\n      )\n    )\n}\n"
    downgrade:
      any:
      - id: metadata/binary/code/control-transfer::pe-return-entry-without-callbacks

composite_rules:
  - id: delete-pending-image-context-redirection
    desc: Ghosted-image context-redirection code sequence
    crit: suspicious
    conf: 0.98
    all:
    - id: delete-pending-executable-section
    - id: micro-behaviors/process/inject/runtime/thread-context::x64-context-rcx-write-call
    - id: micro-behaviors/process/info/thread::set-thread-context-import
    - id: micro-behaviors/process/info/thread::resume-thread-import
    downgrade:
      any:
      - id: metadata/binary/code/control-transfer::pe-return-entry-without-callbacks
