defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055.012
  mbc: E1055.012

composite_rules:
  - id: entrypoint-redirection-hollowing-loader
    desc: Entrypoint redirection process hollowing loader
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/inject/runtime/call::entrypoint-redirection-diagnostic
      - id: micro-behaviors/process/create/exec::create-process-api-reference
      - id: micro-behaviors/process/info/thread::resume-thread-import
    any:
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/mem/map::nt-map-view-section-api-string
      - id: metadata/binary/layout/embedded::pe-embedded
