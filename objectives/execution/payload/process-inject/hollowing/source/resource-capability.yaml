# Resource-backed process-hollowing capability on compiled Windows binaries.
# File-wide API observations support an injection-capability profile.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055.012
  mbc: E1055.012.014

composite_rules:
  - id: objectives/execution/payload/process-inject/hollowing/source::resource-and-thread-control-injection-capabilities
    desc: Resource extraction with spawned-process injection capabilities
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
    any:
      - id: micro-behaviors/process/config/launch::create-suspended-flag-reference
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::thread-context-api-reference-set
    unless:
      - id: metadata/lang/upstream::windows-system-implementer-dll
