defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1055

traits:
  - id: rust-injector-strategy-creation
    desc: Rust injector creates execution strategy
    crit: notable
    if:
      type: text
      regex: 'Factory::create\s*\(\s*technique\s*\)'
  - id: rust-injector-strategy-execute
    desc: Rust executes injection against target
    crit: notable
    if:
      type: text
      regex: '\.execute\s*\(\s*technique\s*,\s*payload\s*,\s*target\s*\)'
  - id: rust-injector-evasion-techniques
    desc: Rust lists hollowing and reflective injection
    crit: notable
    if:
      type: text
      regex: '(?s)ProcessHollowing.{0,80}ReflectiveDll'

composite_rules:
  - id: rust-process-injection-strategy-facade
    desc: Rust dispatches an injection technique and payload
    crit: hostile
    conf: 0.96
    all:
      - id: rust-injector-strategy-creation
      - id: rust-injector-strategy-execute
      - id: rust-injector-evasion-techniques
