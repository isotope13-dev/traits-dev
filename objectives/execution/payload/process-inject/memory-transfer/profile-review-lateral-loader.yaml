defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: base64-loader-remote-process-api-profile
    desc: Base64, dynamic loading and remote-process APIs
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/file/encoding/base64::large-base64-like-string
      - id: objectives/anti-static/obfuscation/reflection/class::dynamic-load-pattern
      - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
    downgrade:
      any:
        - id: well-known/game/steam/
        - id: metadata/binary/section/label/packing::upx-section
        - id: metadata/installer/product/
        - id: well-known/app/system/crayens/
