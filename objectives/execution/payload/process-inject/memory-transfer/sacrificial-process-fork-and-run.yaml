# Fork-and-run post-exploitation: start a throwaway ("sacrificial") process,
# inject a loader stub into it, then stream an assembly, PE or PowerShell
# script to that stub over a named pipe and read its output back. Apollo's
# execute_assembly, execute_pe and powerpick work this way, as do Cobalt
# Strike-style implants and forks that keep the operator status messages.
defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
  attack: T1055

traits:
  - id: sacrificial-process-injection-message
    desc: Reports injecting into a sacrificial process
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\binject(ed|ing)?\b[^\n]{0,40}\binto (a |the )?sacrificial process'

composite_rules:
  - id: sacrificial-process-fork-and-run
    desc: Injects a loader into a sacrificial process and feeds it over a named pipe
    crit: hostile
    conf: 0.94
    all:
      - id: sacrificial-process-injection-message
    any:
      - id: micro-behaviors/communications/ipc/named-pipe::pipe-path-prefix
      - id: micro-behaviors/communications/ipc/named-pipe::dotnet-named-pipe-client-stream
      - id: micro-behaviors/communications/ipc/named-pipe::connect-named-pipe
