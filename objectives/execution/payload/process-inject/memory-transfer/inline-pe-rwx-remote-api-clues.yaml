defaults:
  for:
    - pe
    - dll
  platforms:
    - windows

composite_rules:
  - id: inline-pe-rwx-remote-api-clues
    desc: Inline PE RWX and remote API clues
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/file/pe-inspect::inline-pe-signature-check
      - id: micro-behaviors/mem/combined::rwx-flag-or-argument-patterns
    any:
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
    needs: 1
    unless:
      - id: metadata/lang/compiler/managed::dotnet-metadata
