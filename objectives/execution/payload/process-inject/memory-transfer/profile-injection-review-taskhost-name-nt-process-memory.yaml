defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: taskhost-name-nt-process-memory
    desc: Taskhost name and NT process-memory APIs
    crit: suspicious
    conf: 0.97
    all:
      - id: well-known/app/system/microsoft/core-utilities::taskhostw-executable-reference
      - id: micro-behaviors/process/inject/runtime/call::ntdll-write-memory-api-references
      - id: micro-behaviors/os/syscall/invoke::ntdll-direct-process-op
    unless:
      - id: metadata/binary/symbols/count::many-exports-200
      - id: well-known/tool/sysadmin/systeminformer
