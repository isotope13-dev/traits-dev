defaults:
  platforms: [macos]
  for: [objc, macho]
  attack: T1055
composite_rules:
  - id: macos-spawn-mach-crypto-injection
    desc: macOS spawn, Mach memory write and crypto clues
    crit: hostile
    conf: 0.995
    for: [macho]
    attack: T1055,T1027
    all:
      - id: metadata/binary/symbols/name/process::posix-spawn-import
      - id: metadata/binary/symbols/name/process::posix-spawn-attr-control
      - id: micro-behaviors/process/attach/mach::task-for-pid
      - id: micro-behaviors/process/attach/mach::task-memory-write
      - id: micro-behaviors/os/kernel/routines::thread-get-state
      - id: micro-behaviors/crypto/cipher/unspecified::commoncrypto-cccrypt
      - id: micro-behaviors/crypto/kdf/algorithm::commoncrypto-pbkdf
      - id: metadata/file/encoding/base64::large-base64-like-string
