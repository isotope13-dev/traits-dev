defaults:
  platforms: [windows]
  for: [csharp]
composite_rules:
  - id: csharp-remote-thread-shellcode-injection
    desc: C# remote-thread shellcode injection clues
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/mem/write/arbitrary::process-inject-api-source
      - id: micro-behaviors/dylib/lookup::csharp-winexec-procaddress
      - id: metadata/lang/source/naming/injection::csharp-shellcode-buffer
      - id: micro-behaviors/mem/protect/constant::page-execute-readwrite

  - id: csharp-source-shellcode-process-injector
    desc: C# PID and shellcode-path injector clues
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/lang/source/naming/injection::csharp-injector-service-components
      - id: metadata/lang/source/naming/injection::csharp-resolve-shellcode-path
      - id: metadata/lang/source/naming/injection::csharp-validate-target-pid
      - id: metadata/lang/source/naming/injection::csharp-shellcode-pid-flow

  - id: csharp-service-loads-and-injects-shellcode
    desc: C# shellcode loading and PID injection clues
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/source/naming/injection::csharp-injector-service-components
      - id: metadata/lang/source/naming/injection::csharp-shellcode-loader-call
      - id: micro-behaviors/process/inject/payload::csharp-load-and-inject-shellcode
