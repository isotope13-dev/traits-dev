defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: unsigned-winhttp-remote-memory-apis
    desc: Unsigned WinHTTP and remote-memory APIs
    crit: suspicious
    conf: 0.99
    for: [pe, dll]
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-download-context
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/mem/combined::remote-process-memory-api-cluster
      - id: micro-behaviors/fs/temp/directory::temp-copy-shellexec-api-profile
