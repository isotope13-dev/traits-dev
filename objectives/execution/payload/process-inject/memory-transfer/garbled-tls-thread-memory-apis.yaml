defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: garbled-tls-thread-memory-apis
    desc: Garbled Go TLS and thread-memory APIs
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garbled-type-pointer
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/process/info/thread::thread-context-api-reference-get
      - id: micro-behaviors/process/info/thread::thread-context-api-reference-set
