defaults:
  platforms: [windows]
  for: [pe]
  size_max: 524288

composite_rules:
  - id: cli-rc4-shellcode-remote-apis
    desc: RC4 shellcode arguments and remote APIs
    crit: hostile
    attack: T1055.002
    conf: 0.98
    mbc: "B0009"
    all:
      - id: metadata/file/profile/process/injection::cli-rc4-key-arg-hint
      - id: metadata/file/profile/process/injection::shellcode-file-arg-hint
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
    any:
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-text
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex-dup
    unless:
      - id: metadata/signed/platform/
