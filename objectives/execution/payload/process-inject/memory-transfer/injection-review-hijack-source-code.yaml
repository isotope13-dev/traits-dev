defaults:
  for: [c, cpp]
  platforms: [unix]
  attack: T1055
  mbc: B0033

composite_rules:
- id: code-cave-got-memory-write
  desc: Code-cave and GOT memory-write injection
  crit: hostile
  conf: 0.95
  all:
  - id: metadata/lang/source/naming/variable::mem-fd-identifier-repeated
  - id: micro-behaviors/fs/file/seek::lseek-code-cave-offset
  - id: micro-behaviors/fs/file/seek::lseek-got-offset
  - id: micro-behaviors/fs/write/file/descriptor::write-mem-fd-call
  any:
  - id: metadata/lang/natural/phrasing/execution::code-cave-reference
  - id: metadata/lang/natural/phrasing/execution::shellcode-write-string
  - id: metadata/lang/natural/phrasing/execution::got-overwrite-string
  - id: metadata/lang/source/naming/variable::code-cave-address-name
  - id: metadata/lang/source/naming/variable::dlopen-addr-name
  - id: micro-behaviors/os/kernel/syscall::reads-syscall-table-handler-address
  needs: 2
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: got-overwrite-shellcode-write
  desc: GOT overwrite and shellcode-write clues
  crit: hostile
  conf: 0.95
  all:
  - id: metadata/lang/natural/phrasing/execution::got-overwrite-string
  - id: metadata/lang/natural/phrasing/execution::shellcode-write-string
  - id: micro-behaviors/fs/file/seek::lseek-got-offset
  - id: micro-behaviors/fs/write/file/descriptor::write-mem-fd-call
  any:
  - id: metadata/lang/source/naming/variable::got-addr-name
