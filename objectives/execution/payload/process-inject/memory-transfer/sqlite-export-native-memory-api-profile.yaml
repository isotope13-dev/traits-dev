defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: sqlite-export-native-memory-api-profile
    desc: SQLite exports and native memory APIs
    crit: suspicious
    conf: 0.98
    ref: sha256:a97d6fabe19316c920aed2004cb8d5ea3a699ce3a1a02c54ba60e0b6cabe9b64
    all:
      - id: metadata/binary/symbols/exports::sqlite-api-with-private-wrapper-exports
      - id: micro-behaviors/process/inject/runtime/call::nt-write-virtual-memory-name
      - id: micro-behaviors/mem/protect/modify/api-reference::nt-protect-virtual-memory-name
      - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
    any:
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: metadata/binary/layout/ratio::overlay-dominates-80pct
