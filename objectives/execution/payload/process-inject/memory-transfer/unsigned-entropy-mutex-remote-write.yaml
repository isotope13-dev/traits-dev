defaults:
  platforms:
    - windows
  for:
    - pe

composite_rules:
  - id: unsigned-entropy-mutex-remote-write
    crit: suspicious
    desc: Unsigned entropy mutex and remote-write APIs
    conf: 0.97
    size_min: 1048576
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: metadata/binary/layout/entropy::low-entropy-binary-with-dense-region
      - id: micro-behaviors/process/sync/mutex::create-mutex
    unless:
      - id: metadata/installer/product/
      # Electron's bundled Chromium runtime commonly imports these APIs.
      - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
