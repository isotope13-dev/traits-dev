# Loader diagnostics that name the shellcode-write step of a memory-transfer
# mapper. The log line is compiled into the module whose code performs the
# write, so it is operation evidence, not a source-code mention. Alone it is
# notable staging evidence; hostile consumers pair it with a payload context.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: shellcode-write-failure-diagnostic
    desc: Shellcode-write failure diagnostic in a loader
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)failed\s+to\s+write\s+shellcode'
