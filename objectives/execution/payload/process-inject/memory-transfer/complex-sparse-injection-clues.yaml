defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
composite_rules:
  - id: complex-sparse-injection-clues
    for: [elf, macho, pe]
    desc: Sparse complex binary with injection API clues
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/binary/code/complexity::single-complex-function
      - id: metadata/binary/layout/strings::binary-strings-at-most-five
    any:
      - id: micro-behaviors/process/inject/remote-thread::remote-memory-write-thread-api-set
      - id: micro-behaviors/process/inject/thread-context::process-thread-context-api-profile
