defaults:
  for:
    - elf
  platforms:
    - linux

composite_rules:
  - id: go-ptrace-and-process-memory
    desc: Go ptrace and process memory references
    crit: suspicious
    conf: 0.85
    for:
      - elf
      - go
    all:
      - id: micro-behaviors/process/attach/debugger::go-ptrace-control
    any:
      - id: micro-behaviors/mem/write/arbitrary::ptrace-poke-source-call
      - type: trait
        id: micro-behaviors/fs/proc/memory::proc-mem-glob-text
      - type: trait
        id: micro-behaviors/mem/write/arbitrary::process-vm-writev-source-reference
    unless:
      - id: well-known/lib/cloud/google-cloud-go::source-tree
