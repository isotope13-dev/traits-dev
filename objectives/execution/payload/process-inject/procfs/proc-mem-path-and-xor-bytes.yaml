defaults:
  platforms: [netscaler, appliance, unix]
  for: [scripts, binaries, go, java, kotlin, csharp, swift]

composite_rules:
  - id: proc-mem-path-and-xor-bytes
    for: [shell, python, javascript, ruby, go, perl]
    desc: Process memory path and XOR instruction bytes
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/proc/memory::proc-mem-path-variants
      - id: micro-behaviors/data/embedded/payload/array::escaped-x64-xor-instruction
