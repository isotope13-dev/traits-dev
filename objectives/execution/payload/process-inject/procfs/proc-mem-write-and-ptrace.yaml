defaults:
  for:
    - elf
  platforms:
    - linux

composite_rules:
  - id: proc-mem-write-and-ptrace
    desc: Proc memory write and ptrace references
    crit: suspicious
    conf: 0.98
    for: [rust, c, go]
    all:
      - type: trait
        id: micro-behaviors/mem/write/arbitrary::proc-pid-mem-write-source
    any:
      - id: micro-behaviors/mem/write/arbitrary::ptrace-poke-source-call
      - type: trait
        id: micro-behaviors/mem/write/arbitrary::process-vm-writev-source-reference
