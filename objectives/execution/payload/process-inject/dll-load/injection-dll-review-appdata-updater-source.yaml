defaults:
  platforms: [windows]
  for: [c, cpp]

composite_rules:
  - id: appdata-updater-remote-dll-injector
    desc: Updater-disguised remote DLL injection
    crit: hostile
    attack: T1055.001
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/library::appdata-microsoft-updater-dll
      - id: micro-behaviors/process/inject/dll::remote-thread-resolved-loadlibrary
      - id: micro-behaviors/process/inject/remote-thread::source-remote-memory-thread-api-references
