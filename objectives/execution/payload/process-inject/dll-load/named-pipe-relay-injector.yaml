defaults:
  platforms: [windows]
  for: [c]
composite_rules:
  - id: remote-dll-injection-named-pipe-output-relay
    desc: Remote DLL injector relays output over pipe
    crit: hostile
    conf: 0.97
    attack: T1055.001,T1559
    all:
      - id: micro-behaviors/process/inject/remote-thread::loadlibrary-remote-thread-source-api-references
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/communications/ipc/named-pipe::named-pipe-server
      - id: micro-behaviors/fs/read/file/handle::win32-readfile-source-call
