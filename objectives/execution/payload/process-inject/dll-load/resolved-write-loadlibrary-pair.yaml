# A binary that imports VirtualAllocEx, CreateRemoteThread and the process
# snapshot API but resolves WriteProcessMemory by name has kept the one call
# that marks remote injection out of its import table.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: selectively-hidden-writeprocessmemory-injector
    desc: Imports remote alloc/thread, hides WriteProcessMemory
    crit: suspicious
    conf: 0.92
    attack: T1055.001,T1027.007
    all:
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-text
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-symbol
