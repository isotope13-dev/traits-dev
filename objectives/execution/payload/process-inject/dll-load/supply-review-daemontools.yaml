defaults:
  platforms: [windows]
  for: [pe]
  size_max: 524288

composite_rules:
  - id: anchor-module-injection-clues
    desc: Module-targeted process injection clues
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/process/info/query::anchor-dll-targeting-method
    any:
      - id: metadata/file/profile/process/artifact::toolhelp-snapshot-flag-cluster
      - id: metadata/file/profile/process/artifact::remote-process-rights-name-cluster
      - id: metadata/file/profile/process/artifact::remote-injection-api-error-cluster
      - id: metadata/file/profile/process/artifact::inject-banner
  - id: rc4-shellcode-injection-clues
    desc: RC4 and remote injection clues
    crit: hostile
    conf: 0.985
    attack: "T1055"
    mbc: "B0009"
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4/transform::rc4-transform-method
      - id: metadata/file/profile/process/artifact::remote-injection-api-error-cluster
    any:
      - id: metadata/file/profile/process/artifact::rc4-encrypt-banner
      - id: metadata/file/profile/process/artifact::inject-banner
