defaults:
  platforms: [windows]
  attack: T1055.001
  mbc: E1055

composite_rules:
  - id: window-hook-library-api-pattern
    desc: Binary references window-hook and library-loading APIs
    crit: suspicious
    conf: 0.96
    for: [pe, dll]
    all:
      - id: micro-behaviors/ui/window/enumerate::window-handle-lookup
      - id: micro-behaviors/ui/window/enumerate::get-window-thread-process-id
      - id: micro-behaviors/dylib/load/runtime::windows-load-library-api
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/ui/window/hook::pe-windows-hook-install
    any:
      - id: micro-behaviors/os/message/queue::post-thread-message-api
      - id: micro-behaviors/fs/file/pe-inspect::image-directory-entry-to-data
      - id: micro-behaviors/os/api-resolution/dynamic::dynamic-windows-hook-api-resolution
    unless:
      # Chromium uses the same APIs for its own window management.
      - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong

  # Imports alone do not establish injection. A small, resource-free loader
  # that also parses PE headers gives additional evidence of a custom payload.
  - id: window-hook-thread-dll-injector
    desc: Small PE-parsing window-hook loader
    crit: hostile
    conf: 0.95
    for: [pe, dll]
    all:
      - id: window-hook-library-api-pattern
      - id: metadata/binary/layout/size::small-pe
      - id: metadata/binary/resource/size::no-resources
      - id: micro-behaviors/data/format/pe-parser::inline-pe-signature-check
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
  - id: source-window-hook-thread-dll-injector
    desc: Source injects DLL via foreign window hook
    crit: hostile
    conf: 0.96
    for: [c, cpp]
    near_lines: 80
    all:
      - id: micro-behaviors/ui/window/enumerate::find-window-source
      - id: micro-behaviors/ui/window/enumerate::get-window-thread-process-id-call-source
      - id: micro-behaviors/dylib/load/source::load-library-source
      - id: micro-behaviors/dylib/lookup::get-proc-address-source-call
      - id: micro-behaviors/ui/window/hook::set-windows-hook-ex-call-or-name-source
    any:
      - id: micro-behaviors/os/message/queue::post-thread-message-source
      - id: micro-behaviors/fs/file/pe-inspect::image-directory-entry-to-data-source
