defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: spooler-target-remote-loadlibrary
    desc: Spooler targeting and remote LoadLibrary
    crit: hostile
    conf: 0.96
    for: [c]
    attack: "T1055.001,T1057"
    all:
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-source
      - id: micro-behaviors/os/service/print::spoolsv-executable-reference
      - id: micro-behaviors/process/inject/dll::remote-thread-resolved-loadlibrary
