defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: managed-xor-resource-remote-dll-injector
    desc: Unsigned .NET XOR resource dropper injects DLL into remote process
    crit: hostile
    conf: 0.98
    attack: T1055.001,T1027
    mbc: E1055
    all:
      - id: objectives/anti-static/obfuscation/encoding/buffer::clr-resource-cyclic-xor-dropper
      - id: micro-behaviors/process/inject/remote-thread::managed-remote-allocation-write-thread-calls
      - id: micro-behaviors/process/inject/dll::remote-loadlibrary-api-profile
      - id: micro-behaviors/process/attach/rights::open-process
    unless:
      - id: metadata/signature/verified/
