defaults:
  for:
    - pe
  platforms:
    - windows

composite_rules:
  - id: filename-timestamp-thread-apis
    desc: Filename timestamp and thread APIs
    crit: suspicious
    conf: 0.97
    for:
      - pe
      - dll
    all:
      - id: metadata/binary/provenance/version-info::pe-original-filename-mismatch
      - id: metadata/binary/provenance/build::pe-far-future-timestamp
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::thread-context-api-pair
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    unless:
      - id: metadata/build/reproducible::pe-reproducible-build
