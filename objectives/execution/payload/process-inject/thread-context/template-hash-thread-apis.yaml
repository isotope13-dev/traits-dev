defaults:
  for:
    - pe
  platforms:
    - windows

composite_rules:
  - id: template-hash-thread-apis
    desc: PE template hash and thread APIs
    crit: suspicious
    conf: 0.99
    for:
      - pe
      - dll
    all:
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::multiply-shift-xor-export-walk
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/process/enumerate/psapi::enum-processes
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    unless:
      - id: metadata/signature/verified/platform::microsoft
