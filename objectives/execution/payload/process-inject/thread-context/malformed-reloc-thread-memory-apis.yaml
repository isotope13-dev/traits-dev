defaults:
  for:
    - pe
  platforms:
    - windows

composite_rules:
  - id: malformed-reloc-thread-memory-apis
    desc: Malformed PE relocation and thread APIs
    crit: suspicious
    conf: 0.96
    for:
      - pe
      - dll
    all:
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: metadata/binary/header/malformed::malformed-pe-structure
      - id: metadata/binary/section/ratio::oversized-low-entropy-reloc-declaration
