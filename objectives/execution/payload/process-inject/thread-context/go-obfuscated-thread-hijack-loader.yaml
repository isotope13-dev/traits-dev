# A Go binary whose identifiers are machine-generated (the garble pattern) and
# that writes a thread's register context, resumes it, allocates memory, and
# resolves exports at run time is a hijack loader. Each import is common in
# debuggers and runtimes. Garbled names and the thread-context write together
# are not a normal Go application.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055.003,T1027

composite_rules:
  - id: go-obfuscated-thread-hijack-loader
    desc: Obfuscated Go binary writes thread context and resumes it
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: objectives/anti-static/obfuscation/name-mangling/type-names::obfuscated-go-identifiers
