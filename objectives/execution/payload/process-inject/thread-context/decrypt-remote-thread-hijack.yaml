# Decrypt-then-hijack loader: a CryptoAPI decrypt stage, a cross-process open, and a
# thread-context read/write with resume. Loaders that decrypt an embedded payload and
# then redirect a thread in another process (a shell or settings host, for example) match
# this set. Each leg is common alone, so the file-local conjunction is the evidence.
# The suspend/get-context/set-context/resume quartet is also winpthreads' pthread_cancel,
# which rewrites its own threads' RIP, and OpenProcess there is only a self-PID check.
# The `any` leg requires a remote allocation, cross-process write, or remote thread,
# which is what separates a hijack of another process from that runtime plumbing.
# Any threaded MinGW build that also calls CryptDecrypt satisfies the five `all` legs
# without touching another process; requiring the cross-process leg, rather than
# suppressing on the winpthreads library, keeps real MinGW-built injectors in scope.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055.003,T1140

composite_rules:
  - id: decrypt-remote-thread-hijack
    desc: Decrypts a payload then hijacks a remote thread context and resumes it
    crit: hostile
    conf: 0.85
    scope: file
    all:
      - id: micro-behaviors/crypto/decrypt/transform/call::crypt-decrypt
      - id: micro-behaviors/process/attach/rights::open-process
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
    any:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/process/inject/runtime/call::ntdll-write-memory-api-references
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
