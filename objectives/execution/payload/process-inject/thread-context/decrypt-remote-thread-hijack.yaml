# Decrypt-then-hijack loader: a CryptoAPI decrypt stage, a cross-process open, and a
# thread-context read/write with resume. Loaders that decrypt an embedded payload and
# then redirect a thread in another process (a shell or settings host, for example) match
# this set. Each leg is common alone, so the file-local conjunction is the evidence.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055.003,T1140

composite_rules:
  - id: decrypt-remote-thread-hijack
    desc: Decrypts a payload then hijacks a remote thread context and resumes it
    crit: hostile
    conf: 0.85
    scope: file
    all:
      - id: micro-behaviors/crypto/decrypt/transform/call::crypt-decrypt
      - id: micro-behaviors/process/attach/rights::open-process
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
