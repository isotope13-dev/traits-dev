defaults:
  for:
    - pe
  platforms:
    - windows

composite_rules:
  - id: nsis-debug-pe-thread-apis
    desc: NSIS debugger PE and thread APIs
    crit: suspicious
    conf: 0.97
    size_max: 1048576
    all:
      - id: well-known/tool/packaging/nsis::nsis
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    any:
      - id: micro-behaviors/data/parse/portable-executable::pe-mz-compare-x64
      - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
    unless:
      - id: metadata/signature/verified/platform::microsoft
      - id: metadata/binary/header/characteristics::pe-dll-characteristics
