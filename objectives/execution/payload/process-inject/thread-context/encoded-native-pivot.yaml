defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]

composite_rules:
  - id: encoded-suspended-child-rip-pivot
    desc: Encoded payload loader with suspended-child memory writes and RIP pivot
    crit: hostile
    conf: 0.99
    attack: T1055.003,T1027
    all:
      - id: micro-behaviors/process/create/exec::x64-createprocess-suspended
      - id: micro-behaviors/process/inject/runtime/memory::x64-remote-allocation-write-calls
      - id: micro-behaviors/process/thread/config::x64-context-rip-write-call
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::x64-alternating-key-byte-xor
      - id: micro-behaviors/process/info/thread::resume-thread-import
