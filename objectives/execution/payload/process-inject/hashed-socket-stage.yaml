defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: explorer-loader-hashed-socket-xor-stage
    desc: Explorer loader embeds hashed Winsock resolution and XOR-to-call stage
    crit: hostile
    conf: 0.98
    attack: T1055,T1105,T1140
    # The injection/persistence context supplies admission. The code
    # signatures describe the staged loader, without claiming its final
    # payload identity or a successful connection.
    all:
      - id: objectives/evasion/process/injection/memory::explorer-startup-script-injector
      - id: micro-behaviors/os/api-resolution/digest-export::x64-bkdr131-winsock-resolution
      - id: micro-behaviors/data/encoding/xor::x64-wrapped-xor-loop-before-call
