defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: rustaegis-io-completion-memory-apis
    desc: RustAegis IO completion and memory APIs
    crit: suspicious
    conf: 0.99
    all:
      - id: well-known/lib/runtime/compiled/protection/rustaegis::rustaegis-protected-binary
      - id: micro-behaviors/process/inject/runtime/ntapi::encrypted-nt-allocate-virtual-memory
      - id: micro-behaviors/process/inject/runtime/ntapi::encrypted-nt-write-virtual-memory
      - id: micro-behaviors/process/thread/runtime::encrypted-zw-set-io-completion
      - id: micro-behaviors/process/thread/runtime::encrypted-io-completion-object-type
    any:
      - id: micro-behaviors/process/thread/runtime::encrypted-post-queued-completion-status
      - id: micro-behaviors/process/inject/runtime/ntapi::encrypted-nt-open-process
