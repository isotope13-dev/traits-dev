# ShieldBeaver ClickFix: net use maps a WebDAV share (host@port\path) to a
# drive letter, a script on the mapped drive runs, and the mapping is deleted.
defaults:
  platforms: [windows]
  for: [batch, powershell, text]
  attack: T1021.002,T1105,T1070.005
traits:
  - id: net-use-webdav-drive-map
    desc: WebDAV share mapped via net use
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bnet(\.exe)?\s+use\s+[a-z]:\s+\\\\[^\s\\]{1,100}@(ssl|\d{1,5})\\'
  - id: net-use-webdav-ip-drive-map
    desc: net use maps an IP-hosted WebDAV share
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bnet(\.exe)?\s+use\s+[a-z]:\s+\\\\(\d{1,3}\.){3}\d{1,3}@(ssl|\d{1,5})\\'
  - id: net-use-drive-unmap
    desc: net use deletes a mapped drive letter
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\bnet(\.exe)?\s+use\s+[a-z]:\s+/(d|delete)\b'
  - id: mapped-drive-script-launch
    desc: Script launched from a mapped drive letter
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?im)(^|&|\|)\s*[d-z]:\\[^\s\\]{1,60}\.(cmd|bat|exe|ps1|vbs)\b'
composite_rules:
  - id: webdav-map-run-script-unmap
    desc: WebDAV drive mapped, script run, mapping removed
    crit: hostile
    conf: 0.9
    near_bytes: 800
    all:
      - id: net-use-webdav-drive-map
      - id: mapped-drive-script-launch
      - id: net-use-drive-unmap
