defaults:
  platforms: [macos]
  for: [pkg]
  attack: T1195.002
composite_rules:
- id: macpkg-hook-sudo-github-script-clues
  desc: Installer hook, sudo input, and GitHub script clues
  crit: suspicious
  conf: 0.98
  platforms: [macos, windows, linux]
  for: [pkg, shell, python, javascript]
  all:
    - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
    - id: micro-behaviors/os/privilege/elevation::sudo-stdin-password
    - id: well-known/app/development/code-forge/github::raw-githubusercontent-script-file

