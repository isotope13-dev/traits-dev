defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]

  attack: T1105
  mbc: E1105
composite_rules:
  - id: python-import-powershell-github-executable
    desc: Import-time PowerShell and GitHub executable clues
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1105,T1059.001
    near_lines: 30
    all:
      - id: micro-behaviors/process/argument/executable::python-call-powershell-token
      - id: well-known/app/development/code-forge/github::github-raw-executable-url
      - id: metadata/lang/source/literal/string/command::python-string-start-process-command
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
