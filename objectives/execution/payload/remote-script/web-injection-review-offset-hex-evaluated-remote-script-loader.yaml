defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1027,T1105
  mbc: B0032
composite_rules:
  - id: offset-hex-evaluated-remote-script-loader
    desc: Offset-hex remote script loader and eval clues
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.007,T1105,T1189
    near_bytes: 6000
    all:
      - id: micro-behaviors/data/decode/custom::js-fromcharcode-hex-offset-rebuild
      - id: micro-behaviors/process/interpreter/eval/indirect::eval-assigned-to-variable
      - id: metadata/lang/encoding/hex::offset-hex-http-token
      - id: metadata/lang/encoding/hex::offset-hex-script-token
      - id: metadata/lang/encoding/hex::offset-hex-element-token

  # The colon-delimited sibling of the rule above: the same offset-charcode
  # rebuild and eval-alias sink, but the payload keywords ("http://",
  # "createElement", "iframe") are shifted by 9 and joined with colons, and
  # the decoded stage injects a hidden remote iframe (drive-by) instead of
  # naming a script token. The long colon-hex run is required as the bulk
  # carrier so short coincidental token runs cannot complete the rule.
  - id: colon-hex-evaluated-hidden-iframe-loader
    desc: Colon-hex hidden-iframe loader and eval clues
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.007,T1105,T1189
    near_bytes: 6000
    all:
      - id: metadata/lang/encoding/hex::colon-hex-sequence-long
      - id: micro-behaviors/data/decode/custom::js-fromcharcode-eval-offset-rebuild
      - id: micro-behaviors/process/interpreter/eval/indirect::eval-assigned-to-variable
      - id: metadata/lang/encoding/hex::colon-hex-http-token
      - id: metadata/lang/encoding/hex::colon-hex-iframe-token
      - id: metadata/lang/encoding/hex::colon-hex-element-token
