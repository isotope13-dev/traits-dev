defaults:
  platforms: [linux]
  for: [shell]
  attack: T1195.002
composite_rules:
  - id: pkgbuild-phase-fetch-extract-execute
    desc: PKGBUILD phase fetches, extracts, runs remote script
    crit: hostile
    conf: 0.96
    near_lines: 40
    all:
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-build-fn
      - id: micro-behaviors/communications/http/download/package::pkgbuild-build-phase-fetch
      - id: micro-behaviors/data/archive/extract/tar::tar-gzip-extract
      - id: micro-behaviors/process/create/shell/interpreter::shell-srcdir-script-invocation
