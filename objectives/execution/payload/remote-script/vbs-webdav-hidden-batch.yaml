defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: vbs-concatenated-hidden-cmd-run
    desc: Launches concatenated cmd hidden
    crit: notable
    conf: 0.96
    if:
      type: yara
      source: |
        rule vbs_concatenated_hidden_cmd_run {
          strings:
            $shell = "CreateObject(\"WScript\"&\".\"&\"Shell\")"
            $run = "b.Run\"c\"&\"m\"&\"d\"&\".\"&\"e\"&\"x\"&\"e\""
            $hidden = ",0,False"
          condition:
            all of them and @shell < @run and @run < @hidden and @hidden - @run < 160
        }

composite_rules:
  - id: vbs-hidden-webdav-batch-loader
    desc: Executes reconstructed WebDAV batch
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/staging/reconstruct::vbs-webdav-array-batch-stager
      - id: vbs-concatenated-hidden-cmd-run
