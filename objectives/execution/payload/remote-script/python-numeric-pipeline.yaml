defaults:
  for: [python]
  platforms: [unix]

traits:
  - id: python-decoded-curl-bash-pipeline
    desc: Shell pipeline invokes decoded curl and bash
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((function_definition body: (block
          (try_statement body: (block
            (expression_statement (assignment left: (identifier) @bash_name right: (lambda body: (_) @bash_body)))
            (expression_statement (assignment left: (identifier) @curl_name right: (lambda body: (_) @curl_body)))
            (try_statement body: (block
              (expression_statement (call function: (attribute object: (identifier) @sub attribute: (identifier) @run)
                arguments: (argument_list
                  (string (interpolation expression: (call function: (identifier) @curl_call))
                    (interpolation expression: (call function: (identifier) @bash_call))) @pipeline
                  (keyword_argument name: (identifier) @shell value: (true)))))))))))
          (#eq? @sub "subprocess") (#eq? @run "run") (#eq? @shell "shell")
          (#eq? @bash_name @bash_call) (#eq? @curl_name @curl_call)
          (#match? @bash_body "98,[[:space:]]*97,[[:space:]]*115,[[:space:]]*104")
          (#match? @curl_body "99,[[:space:]]*117,[[:space:]]*114,[[:space:]]*108")
          (#match? @pipeline "[|]"))

composite_rules:
  - id: python-install-runs-numeric-curl-bash
    desc: Install hook runs decoded curl-to-bash pipeline
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1059.004,T1105
    scope: file
    all:
      - id: python-decoded-curl-bash-pipeline
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
