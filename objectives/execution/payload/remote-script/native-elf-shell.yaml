# A native Linux implant embeds an external-IP downloader command, stages the
# fetched script, and invokes that shell script through the MIPS execve path.
# The source-address and source-to-shell chain establish remote payload
# execution without assuming a final command or payload identity.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1105,T1059.004
  mbc: B0030

composite_rules:
  - id: mips-raw-ip-shell-stage-loader
    desc: MIPS ELF fetches and executes a shell stage from an external IP
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/arch/iot::mips
      - id: micro-behaviors/process/create/local-exec::native-download-then-shell-script
      - id: micro-behaviors/communications/ip/literal::http-literal-ip-url
      - id: micro-behaviors/process/create/exec::mips-o32-execve-syscall
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/autotools::autoconf-generated-script
      - id: "metadata/file/naming::test-directory-component"
