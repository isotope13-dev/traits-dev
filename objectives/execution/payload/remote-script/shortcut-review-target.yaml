defaults:
  platforms: [windows]
  attack: T1204.002
  for: [lnk]

composite_rules:
  - id: minimized-obfuscated-remote-command
    desc: LNK minimizes obfuscated remote command stage
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.003,T1105,T1204.002,T1564.003
    all:
      - id: micro-behaviors/process/config/target::lnk-interpreter-target-with-arguments
      - id: "micro-behaviors/ui/window/state::lnk-minimized-inactive-window"
      - id: objectives/anti-static/obfuscation/string/fragmentation::lnk-cmd-delayed-substring-slicing
      - id: objectives/anti-static/obfuscation/string/fragmentation::lnk-delimiter-stripped-https
  # A shortcut that installs and then executes a remote module with
  # unrestricted permissions is a remote-code loader. The runtime-runner leg
  # (`deno run --allow-all|-A https://...`) is required, and the launch must
  # additionally be concealed or policy-relaxed: a visible, policy-respecting
  # shortcut stays with the suspicious runner observation.
  - id: lnk-concealed-remote-runtime-exec
    desc: Concealed shortcut runs a remote Deno stage
    crit: hostile
    conf: 0.97
    attack: T1059.001,T1105,T1204.002
    all:
      - id: micro-behaviors/process/deploy/script-eval/network::lnk-deno-run-remote-all-permissions
    any:
      - id: micro-behaviors/ui/window/state::lnk-hidden-window-flag
      - id: micro-behaviors/ui/window/state::lnk-minimized-inactive-window
      - id: objectives/anti-static/obfuscation/document/whitespace::lnk-command-padding-shape
      - id: micro-behaviors/os/security/policy::lnk-relaxed-execution-policy
