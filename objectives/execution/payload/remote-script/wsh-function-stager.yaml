# SocGholish's first stage (Proofpoint: GhoLoader) is a few hundred bytes of
# WSH JScript, delivered as "Google Launcher.js" or a fake browser update:
# build MSXML2.XMLHTTP through ActiveXObject (often from split strings), POST
# a fixed token synchronously, and run the reply through the Function
# constructor. A file that small has no other job than fetch-and-run.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1059.007,T1105

composite_rules:
  - id: wsh-sync-post-function-stager
    desc: Tiny WSH script runs a POST reply as code
    crit: hostile
    conf: 0.95
    size_max: 4096
    ref: https://adamnet.works/blog/socgholish-trojanized-figma-rust-tor-backdoor/
    all:
      - id: micro-behaviors/os/com/instantiation::activex-constructor-call
      - id: micro-behaviors/communications/http/client/xmlhttp::xhr-sync-post
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: micro-behaviors/metaprogramming/generation/function::js-new-function-constructor
