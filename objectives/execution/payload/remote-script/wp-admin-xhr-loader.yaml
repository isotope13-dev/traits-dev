# Injected web loaders targeting WordPress wp-admin endpoints via
# XMLHttpRequest with random cache-busting tokens.
defaults:
  platforms: [windows, unix]
  for: [javascript, python]
  attack: T1189,T1059
  mbc: B0001

composite_rules:
  - id: wp-admin-xhr-token-loader
    desc: WordPress admin XHR loader with random token generator
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/communications/url/resource-path/administration::wp-admin-endpoint-url
      - id: micro-behaviors/communications/http/request/client/initialize::xmlhttprequest-constructor-text
      - id: micro-behaviors/communications/http/request/params::rand-pair-token-function
