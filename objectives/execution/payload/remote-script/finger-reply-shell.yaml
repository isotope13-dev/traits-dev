# FrameFinger ClickFix: the pasted command resolves finger.exe through a
# wildcard `where` lookup (or a caret/quote-split name), queries user@host
# over the Finger protocol and pipes every reply line into cmd.exe.
defaults:
  platforms: [windows]
  for: [batch, powershell, html, javascript, text]
  attack: T1059.003,T1105,T1218
traits:
  - id: user-host-reply-piped-to-shell
    desc: user@host query output piped to a shell
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)\b[\w.-]{1,64}@[\w.-]{4,}\s*\^?\|\s*(cmd|powershell|pwsh)\b'
  - id: where-wildcard-finger-lookup
    desc: Wildcard where lookup resolving finger
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bwhere\s+(/\w+\s+)?,[\w*?.]*f[\w*?.]*n[\w*?.]*e[\w*?.]*r[\w*?.]*,'
  - id: nested-minimized-comspec-launch
    desc: Nested minimized COMSPEC command launches
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)%comspec%\s+/c\s+start\s+/min\s+%comspec%\s+/c\s+start\s+/min\s+%comspec%'
composite_rules:
  - id: finger-query-reply-piped-to-shell
    desc: Finger query reply piped to a shell
    crit: hostile
    conf: 0.95
    near_bytes: 300
    all:
      - id: user-host-reply-piped-to-shell
    any:
      - id: micro-behaviors/communications/finger::finger-command-query
      - id: where-wildcard-finger-lookup
