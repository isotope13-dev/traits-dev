# Ad-injection extension background: it periodically downloads a "code"
# blob from its server, caches it in localStorage, and hands it to content
# scripts on request over a runtime port, so the server decides what runs
# inside every page the user opens, without an extension update.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1176,T1105
composite_rules:
  - id: extension-relays-cached-remote-code-to-pages
    desc: Extension relays server-supplied code to pages
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/browser-extension/lifecycle::runtime-port-getcode-action
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-api
      - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: micro-behaviors/data/db/write::dom-storage-setitem-call
    any:
      - id: micro-behaviors/browser-extension/lifecycle::remote-code-update-url-field
      - id: micro-behaviors/communications/url/host/domain-http::extension-external-url-literal
