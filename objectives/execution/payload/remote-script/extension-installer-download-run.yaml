# A JavaScript fetch call and a shell or PowerShell-bypass launch that appear
# close together, the shape of a downloaded installer script run by a host
# process. Vendor toolchain installers do this with user consent, so the
# composite stays suspicious: the fetched script is never inspected here.
#
# Proximity is required. The fetch leg is a generic fetch() call, so a
# file-wide match joins an unrelated API request (for example a balance query)
# to a local restart helper that spawns a shell, and bundled packages carry
# fetch and process helpers in separate functions megabytes apart. Neither is
# a download-and-run flow. Minified bundles put whole modules on one line, so
# the window is measured in bytes: a line window spans the entire bundle.

defaults:
  for: [javascript]
  platforms: [windows, unix]

composite_rules:
  - id: extension-installer-download-run
    desc: Fetch call near a shell or PowerShell-bypass launch
    crit: suspicious
    near_bytes: 300
    all:
      - id: micro-behaviors/communications/http/client/exchange::fetch-call
      - id: micro-behaviors/process/create/exec::child-process-execution
    any:
      - id: micro-behaviors/os/security/execution-policy::powershell-policy-bypass-argv-pair
      - id: micro-behaviors/process/argument/interpreter::shell-command-spawn-unix
    needs: 1
