# An editor extension fetches an installer script from a vendor endpoint and
# runs it through a shell or with a PowerShell execution-policy bypass. Vendor
# toolchain installers do this with user consent, so the composite stays
# suspicious: the fetched script is never inspected here.

defaults:
  for: [javascript]
  platforms: [windows, unix]

composite_rules:
  - id: extension-installer-download-run
    desc: Extension fetches a script and runs it via a shell
    crit: suspicious
    all:
      - id: micro-behaviors/communications/http/client/exchange::fetch-call
      - id: micro-behaviors/process/create/exec::child-process-execution
    any:
      - id: micro-behaviors/os/security/execution-policy::powershell-policy-bypass-argv-pair
      - id: micro-behaviors/process/argument/interpreter::shell-command-spawn-unix
    needs: 1
