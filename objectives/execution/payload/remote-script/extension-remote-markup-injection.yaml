# The worker downloads per-site "widget" data from its server and stores
# it; a content script on every site later interpolates that data, raw,
# into innerHTML. The server therefore decides markup (and script, via a
# closed </style>) rendered inside every page the user opens.
defaults:
  platforms: [unix, windows]
  for: [npm, chrome-manifest, crx, javascript, typescript, zip]
  attack: T1176,T1185

composite_rules:
  - id: fetched-data-injected-into-every-page
    desc: Remotely fetched data interpolated into innerHTML on every site
    crit: hostile
    conf: 0.85
    scope: archive
    all:
      - id: metadata/permission/host::broad-content-script-matches
      - id: micro-behaviors/ui/window/insert-html::innerhtml-style-template-interpolation
      - id: micro-behaviors/communications/http/request/json::fetch-call-near-json-parse
      - id: micro-behaviors/data/db/write::chrome-storage-local-set
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
