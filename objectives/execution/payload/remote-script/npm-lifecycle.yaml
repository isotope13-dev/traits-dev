# A lifecycle hook npm runs on the installing machine that downloads with
# curl or wget and then, chained with `&&`, runs an interpreter. Outside
# those hooks the same shape is a codegen idiom a developer invokes by hand.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: npm-lifecycle-download-execute
    desc: Lifecycle hook downloads and runs code
    crit: suspicious
    conf: 0.95
    attack: T1105
    mbc: B0024
    if:
      type: value
      path: npm.lifecycle_scripts[*].command
      regex: '\b(curl|wget)\b.{0,300}&&.{0,300}\b(perl|python[0-9.]*|ruby|node|sh|bash)\b'
    unless:
      - id: metadata/package/scripts/lifecycle::download-execute-known-good-package-context
