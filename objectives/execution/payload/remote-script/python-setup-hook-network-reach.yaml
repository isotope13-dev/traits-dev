defaults:
  platforms:
  - unix
  - windows
  attack: T1059.006,T1082
  for:
  - python
composite_rules:
- id: python-install-hook-curl-and-environment
  desc: Install hook runs curl and iterates environment
  crit: suspicious
  conf: 0.85
  near_bytes: 1500
  all:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/communications/http/curl/command::python-curl-argv-list
  - id: micro-behaviors/os/env/enumerate/entries::python-environ-items-loop
- id: python-setup-fetches-pastebin-raw
  desc: Setup script fetches raw Pastebin text
  crit: suspicious
  conf: 0.85
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/communications/http/request/package::setup-import-url-fetch
  - id: micro-behaviors/communications/http/services/pastebin::pastebin-raw-fetch
