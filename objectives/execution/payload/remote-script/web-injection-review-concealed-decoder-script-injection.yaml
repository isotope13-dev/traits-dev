defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1189,T1105,T1027
composite_rules:
  # A smuggled remote script element (a Base64 blob decoding to a
  # <script src="https://..."> tag) is staged through a runtime string-table
  # decoder and invoked through computed dispatch, so no sink
  # (document.write), decode stage (atob/unescape), or URL appears literally.
  # The decoder leg requires a fragment-concatenated global parse call, the
  # shape that resolves each concealed name at runtime. The dispatch legs
  # require the computed call that hides the sink: the addition-indexed form
  # fires on both carriers, while the plain computed-property form covers
  # single-lookup dispatch on HTML carriers whose inline scripts lack a
  # cached JavaScript AST. Any single leg is neutral plumbing or a
  # suspicious clue, but together they establish a concealed remote-script
  # injection: the carrier decodes and runs a remotely hosted script.
  - id: concealed-decoder-driven-remote-script-injection
    desc: Concealed decoder drives remote script injection
    crit: hostile
    conf: 0.97
    attack: T1189,T1027,T1059.007
    all:
      - id: micro-behaviors/communications/http/client/script::base64-encoded-script-element
      - id: micro-behaviors/data/decode/custom::js-fragment-named-global-parse-call
    any:
      - id: micro-behaviors/data/control-flow/dispatch/computed::html-computed-property-call-text
      - id: micro-behaviors/data/control-flow/dispatch/computed::js-addition-indexed-member-call
