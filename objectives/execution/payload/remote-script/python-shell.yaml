defaults:
  platforms: [unix, windows]
  for: [python, whl, python-sdist]
  attack: T1105,T1059.004
  mbc: B0024
  crit: hostile
  conf: 0.98

composite_rules:
  - id: python-remote-shell-script-download-exec
    desc: Downloads and executes a remote shell script
    scope: file
    all:
      - id: micro-behaviors/communications/http/download/helper::urlretrieve-call-near-process-launch
      - id: metadata/lang/source/syntax/command/launch::shell-exec-script-path
