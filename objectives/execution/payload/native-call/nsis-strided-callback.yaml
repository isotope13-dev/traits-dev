# Bind allocation output, ReadFile destination and callback to one register.
# No campaign names, fixed sizes, fixed register number or fixed stride.
defaults:
  platforms: [windows]
  for: [data, text]
  size_max: 2000000
composite_rules:
  - id: strided-nsis-file-rwx-callback-chain
    desc: Concealed file-to-RWX callback command chain
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1106,T1620
    all:
      - id: objectives/anti-static/obfuscation/string/reconstruct::strided-nsis-kernel32-command
      - id: micro-behaviors/process/deploy/native-call::strided-nsis-file-rwx-callback-commands
