defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

composite_rules:
  - id: x86-host-gap-decoder-native-stage
    desc: Host-gap decoder activates reconstructed native payload
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1620
    all:
      - id: objectives/anti-static/obfuscation/control-flow/poly::x86-mixed-width-host-gap-decoder
      - id: micro-behaviors/process/deploy/native-call::x86-gap-protected-buffer-offset-call
      - id: micro-behaviors/mem/protect/modify::virtual-protect
