# PowerShell shellcode runner: bytes copied into unmanaged memory, the region
# flipped to PAGE_EXECUTE_READWRITE, and a delegate bound to that pointer.
#
# The powershell-loader chains in anti-static/obfuscation/eval ask
# VirtualAlloc for RWX up front. This is the variant that takes ordinary
# unmanaged memory (AllocHGlobal, a byte array, VirtualAlloc with PAGE_READWRITE)
# and changes its protection afterwards, so no allocation API is required: a
# runner that swaps allocators still copies, protects and binds.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1620,T1106
  mbc: B0023

composite_rules:
  - id: protected-buffer-delegate-call
    desc: PowerShell binds a delegate to copied RWX bytes
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/mem/copy::marshal-copy-powershell
      - id: micro-behaviors/mem/protect/modify::powershell-virtualprotect-rwx-argument
      - id: micro-behaviors/os/api-resolution/dynamic::powershell-function-pointer-delegate
