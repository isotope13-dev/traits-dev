# PowerShell shellcode runner: bytes copied into unmanaged memory, the region
# flipped to PAGE_EXECUTE_READWRITE, and a delegate bound to that pointer.
#
# The powershell-loader chains in anti-static/obfuscation/eval ask
# VirtualAlloc for RWX up front. This is the variant that takes ordinary
# unmanaged memory (AllocHGlobal, a byte array, VirtualAlloc with PAGE_READWRITE)
# and changes its protection afterwards, so no allocation API is required: a
# runner that swaps allocators still copies, protects and binds.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1620,T1106
  mbc: B0023

composite_rules:
  - id: protected-buffer-delegate-call
    desc: PowerShell binds a delegate to copied RWX bytes
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/mem/copy::marshal-copy-powershell
      - id: micro-behaviors/mem/protect/modify/executable::powershell-virtualprotect-numeric-execute
      - id: micro-behaviors/os/api-resolution/dynamic::powershell-function-pointer-delegate

  # Remote injection through delegates: the process handle, allocation, write
  # and remote thread names appear as script strings, and a delegate binds the
  # resolved export. Each call is made through a function pointer, so the
  # APIs need no P/Invoke declaration. Each leg is a reusable remote-injection
  # fact. The composite needs all five.
  - id: powershell-delegate-remote-thread-injection
    desc: PowerShell delegates inject code into a remote process
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/attach/rights::open-process-script
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex-text
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-text
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-script
      - id: micro-behaviors/os/api-resolution/dynamic::powershell-function-pointer-delegate
