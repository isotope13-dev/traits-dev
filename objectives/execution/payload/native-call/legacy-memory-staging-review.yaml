composite_rules:
- id: pxk2-image-memory-thread-activation
  desc: PXK2 image carrier with memory-protection and thread APIs
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/lang/source/literal/string/label::pxk2-key-or-failure-reference
  - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
  - id: micro-behaviors/process/thread/create::create-thread-text
  any:
  - id: metadata/binary/symbols/name/api-resolution::winapi-virtual-alloc-symbol
  - id: micro-behaviors/fs/file/pe-inspect::inline-pe-signature-check
  for:
  - pe
  - dll
  platforms:
  - windows
- id: post-quantum-layered-local-thread-stage
  for:
  - c
  desc: Post-quantum and symmetric crypto with memory and thread APIs
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/crypto/asymmetric/kem::kyber-kem-usage
  - id: micro-behaviors/crypto/symmetric/gost/cbc::gost-cbc-usage
  - id: micro-behaviors/crypto/decrypt/transform/unspecified::aes-kerberos-or-bcrypt-decrypt-reference
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-source
  - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-local-or-remote-reference
  - id: micro-behaviors/process/thread/create::create-thread-source
  platforms:
  - linux
  - macos
  - windows
