defaults:
  platforms:
  - linux
  for:
  - c
  attack: T1027
traits:
- id: decoded-native-executable-mapping
  desc: Decoded native mapping becomes executable code
  crit: suspicious
  conf: 0.98
  if:
    type: tree-sitter
    query: "\n(function_definition\n body: (compound_statement\n   (declaration declarator: (init_declarator\n\
      \     declarator: (pointer_declarator declarator: (identifier) @alias)\n     value: (cast_expression\
      \ value: (identifier) @alias_region)))\n   (for_statement body: (expression_statement\n   \
      \  (assignment_expression\n       left: (subscript_expression argument: (identifier) @xor_output)\n\
      \       right: (binary_expression operator: \"^\"))))\n   (if_statement condition: (parenthesized_expression\
      \ (binary_expression\n     left: (call_expression function: (identifier) @protect\n       arguments:\
      \ (argument_list (identifier) @protected (_) (binary_expression\n         left: (identifier)\
      \ @read_flag operator: \"|\" right: (identifier) @exec_flag))))))\n   (expression_statement\
      \ (call_expression\n     function: (parenthesized_expression (cast_expression value: (identifier)\
      \ @entry)))) @body\n (#eq? @alias @xor_output)\n (#eq? @alias_region @protected)\n (#eq? @protected\
      \ @entry)\n (#eq? @protect \"mprotect\")\n (#eq? @read_flag \"PROT_READ\")\n (#eq? @exec_flag\
      \ \"PROT_EXEC\"))\n)\n\n\n(function_definition body: (compound_statement\n (expression_statement\
      \ (call_expression function: (identifier) @cipher\n   arguments: (argument_list (_) (cast_expression\
      \ value: (identifier) @decoded) (_))))\n (if_statement condition: (parenthesized_expression\
      \ (binary_expression\n   left: (call_expression function: (identifier) @protect\n     arguments:\
      \ (argument_list (identifier) @protected (_) (binary_expression\n       left: (identifier)\
      \ @read_flag operator: \"|\" right: (identifier) @exec_flag))))))\n (declaration declarator:\
      \ (init_declarator declarator: (identifier) @entry\n   value: (cast_expression value: (identifier)\
      \ @code)))\n (expression_statement (call_expression function: (identifier) @invoked\n   arguments:\
      \ (argument_list (identifier) @argument (_))))) @loader\n (#eq? @cipher \"rc4_crypt\")\n (#eq?\
      \ @protect \"mprotect\")\n (#eq? @read_flag \"PROT_READ\")\n (#eq? @exec_flag \"PROT_EXEC\"\
      )\n (#eq? @decoded @protected)\n (#eq? @decoded @code)\n (#eq? @code @argument)\n (#eq? @entry\
      \ @invoked))\n"
