composite_rules:
- id: x64-tcp-rwx-read-jump-micro-elf
  desc: Micro ELF connects, reads and jumps into RWX memory
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/os/syscall/raw::x64-socket-inline-connect-early
  - id: micro-behaviors/os/syscall/raw::x64-mmap-rwx-syscall-early
  - id: micro-behaviors/os/syscall/raw::x64-read-stage-jump-rsi
  - id: metadata/binary/section/header::elf64-no-section-headers
  - id: metadata/binary/layout/size::micro-elf
  for: &id001
  - elf
  platforms: &id002
  - linux
- id: x64-tcp-rwx-read-jump
  desc: ELF connects, reads and jumps into RWX memory
  crit: hostile
  conf: 0.96
  unless:
  - id: objectives/execution/payload/native-call::x64-tcp-rwx-read-jump-micro-elf
  all:
  - id: micro-behaviors/os/syscall/raw::x64-socket-inline-connect-early
  - id: micro-behaviors/os/syscall/raw::x64-mmap-rwx-syscall-early
  - id: micro-behaviors/os/syscall/raw::x64-read-stage-jump-rsi
  for: *id001
  platforms: *id002
- id: x64-rwx-mmap-connect-clues
  desc: ELF RWX mmap and socket-connect clues
  crit: suspicious
  conf: 0.95
  unless:
  - id: objectives/execution/payload/native-call::x64-tcp-rwx-read-jump-micro-elf
  - id: objectives/execution/payload/native-call::x64-tcp-rwx-read-jump
  all:
  - id: micro-behaviors/os/syscall/raw::x64-mmap-rwx-syscall-early
  - id: micro-behaviors/os/syscall/raw::x64-socket-inline-connect-early
  for: *id001
  platforms: *id002
- id: x64-rwx-mmap-read-jump-clues
  desc: ELF RWX mmap and read-then-jump clues
  crit: suspicious
  conf: 0.95
  unless:
  - id: objectives/execution/payload/native-call::x64-tcp-rwx-read-jump-micro-elf
  - id: objectives/execution/payload/native-call::x64-tcp-rwx-read-jump
  all:
  - id: micro-behaviors/os/syscall/raw::x64-mmap-rwx-syscall-early
  - id: micro-behaviors/os/syscall/raw::x64-read-stage-jump-rsi
  for: *id001
  platforms: *id002
- id: capi-file-decrypt-memory-thread-clues
  desc: CryptoAPI file decrypt and executable-memory thread clues
  crit: suspicious
  conf: 0.85
  all:
  - id: micro-behaviors/crypto/provider/cryptoapi::crypt-acquire-context
  - id: micro-behaviors/crypto/provider/cryptoapi::crypt-import-key
  - id: micro-behaviors/crypto/decrypt/transform/unspecified::crypt-decrypt
  - id: micro-behaviors/fs/file/open/unspecified::file-create-win
  - id: micro-behaviors/fs/read/file/handle::read-file
  - id: micro-behaviors/mem/protect/modify/executable::executable-page-protection-evidence
  - id: micro-behaviors/process/thread/create::create-thread
  downgrade:
    any:
    - id: metadata/installer/product/
    - id: metadata/filename/name-form::is-microsoft-named
    - id: metadata/signature/verified/signer::nortonlifelock-inc.
  for: &id003
  - pe
  - dll
  platforms: &id004
  - windows
- id: capi-rwx-reloc-memory-thread-clues
  desc: CryptoAPI memory-thread clues with opaque RWX relocation
  crit: hostile
  conf: 0.97
  attack: T1027.002,T1140,T1620
  size_min: 131072
  all:
  - id: objectives/execution/payload/native-call::capi-file-decrypt-memory-thread-clues
  - id: metadata/binary/section/entropy::large-high-entropy-rwx-reloc
  - id: micro-behaviors/process/info/query::peb-access-x86
  - id: metadata/signature/absent::unsigned-missing-signature-record
  unless:
  - id: metadata/lang/compiler/managed::dotnet-metadata
  - id: well-known/lib/data/sap-hana/
  - id: well-known/lib/runtime/scripted/php-runtime::runtime-binary-context
  - id: well-known/app/enterprise/athoc::athocafrc-legacy-module-context
  - id: well-known/tool/sysadmin/osquery::osquery-tool-context
  for: *id003
  platforms: *id004
