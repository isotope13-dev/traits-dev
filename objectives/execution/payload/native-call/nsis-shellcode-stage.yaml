# NSIS installer bundling the System.dll Win32 FFI memory bridge alongside an
# obfuscated or GetPC raw shellcode stage.
defaults:
  platforms: [windows]
  for: [pe, data]
  attack: T1106,T1027,T1204.002

composite_rules:
  - id: nsis-system-ffi-obfuscated-shellcode-stage
    desc: NSIS stages obfuscated shellcode via System.dll
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: well-known/tool/packaging/nsis::nsis
      - id: metadata/binary/symbols/name/export::system-dll-plugin-export-profile
      - id: micro-behaviors/mem/combined::virtual-memory-allocation-protection-api-pair
    any:
      - id: objectives/anti-static/obfuscation/instruction/junk::simd-jump-junk-chain
      - id: micro-behaviors/data/decode/xor/transform::x86-byte-xor-getpc-loop
      - id: metadata/binary/instruction/call::x86-simd-sled-pop-getpc
    unless:
      - id: metadata/signature/verified/platform/
