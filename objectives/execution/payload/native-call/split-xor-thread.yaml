defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86-64]
  attack: T1027,T1140
composite_rules:
  - id: xor-decoded-rx-thread-payload
    desc: XOR-decoded executable thread payload
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/encoding/xor/cyclic-key::x64-four-byte-key-xor-copy-loop
      - id: micro-behaviors/mem/protect/modify/executable::x64-rx-buffer-thread-argument
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/process/thread/create::create-thread
  - id: xor-decoded-rx-thread-payload-x86
    desc: XOR-decoded executable thread payload (x86)
    crit: hostile
    conf: 0.99
    arch: [x86]
    all:
      - id: micro-behaviors/data/encoding/xor/cyclic-key::x86-four-byte-key-xor-copy-loop
      - id: micro-behaviors/mem/protect/modify/executable::x86-rx-buffer-thread-argument
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/process/thread/create::create-thread
