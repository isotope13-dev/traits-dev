defaults:
  for: [c, cpp]
  platforms: [windows]
  attack: T1620

composite_rules:
  # Local memory execution does not establish remote process injection, C2,
  # or the purpose of the supplied bytes. JIT/test harnesses can do this too.
  # Replace the former unbound CryptoAPI API-co-occurrence verdicts with the
  # copy/allocation/thread relationship, independent of the chosen decoder.
  - id: copied-executable-buffer-local-thread
    desc: Copies bytes into executable memory and starts a local thread there
    crit: suspicious
    conf: 0.99
    near_bytes: 1
    all:
      - id: micro-behaviors/process/thread/create::copied-buffer-thread-entry-source
      - id: micro-behaviors/process/thread/create::allocated-thread-entry-source
