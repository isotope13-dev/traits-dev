defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
composite_rules:
  - id: x64-scattered-decoder-native-stage
    desc: Scattered decoder invokes concealed native stage
    crit: hostile
    conf: 0.99
    attack: T1027,T1620
    # The buffer rewind/base/offset call is one contiguous relationship.
    # Fiber and Nt section API names are neither required nor inferred.
    all:
      - id: objectives/anti-static/obfuscation/control-flow/poly::x64-scattered-add-sub-decoder
      - id: micro-behaviors/process/deploy/native-call::x64-buffer-protection-offset-call
      - id: micro-behaviors/mem/protect/modify::virtual-protect
