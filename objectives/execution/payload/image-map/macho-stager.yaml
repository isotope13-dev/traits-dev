# Compiled Mach-O in-memory loader stub. A shellcode stager cannot link
# against dyld, so it finds the shared cache with a raw syscall, maps memory
# with direct syscall wrappers, then hands a dylib to the legacy NS* or dyld4
# memory-module loader. The three roles are independent evidence.
defaults:
  platforms: [macos]
  for: [macho]

composite_rules:
  - id: macho-libc-free-memory-module-stager
    desc: Mach-O stub maps a dylib in memory using raw syscalls
    crit: hostile
    conf: 0.95
    attack: T1620
    all:
      - id: micro-behaviors/dylib/load/memory::mach-o-memory-module-loader
      - id: micro-behaviors/dylib/lookup::dyld-shared-cache-syscall-wrapper
    any:
      - id: micro-behaviors/mem/map::direct-mmap-syscall-wrapper
      - id: micro-behaviors/mem/protect/modify/api-reference::direct-mprotect-syscall-wrapper
