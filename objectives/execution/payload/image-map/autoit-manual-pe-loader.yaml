# AutoIt has no PE loader of its own, so a script that parses DOS/NT headers
# with DllStructCreate, commits RWX memory, resolves imports by hand and calls
# the mapped entry point is mapping an embedded image in-process. Banker
# droppers ship the DLL as a hex string inside the script and call an export.
defaults:
  platforms: [windows]
  for: [text]
  attack: T1620
  mbc: B0032
  crit: notable
  conf: 0.9

traits:
  - id: autoit-pe-header-struct
    desc: AutoIt struct over the PE DOS header
    if:
      type: text
      regex: '(?i)DllStructCreate\s*\(\s*"[^"\n]{0,60}e_lfanew'
  - id: autoit-virtualalloc-rwx-image
    desc: AutoIt commits RWX memory for an image
    if:
      type: text
      regex: '(?i)"VirtualAlloc"\s*,\s*"ptr"\s*,[^\n]{1,80}"dword"\s*,\s*64\b'
  - id: autoit-manual-import-resolve
    desc: AutoIt resolves imports with GetProcAddress
    if:
      type: text
      regex: '(?i)"GetProcAddress"\s*,\s*"ptr"\s*,[^\n]{1,40}"(str|ptr)"'
  - id: autoit-mapped-entry-call
    desc: AutoIt calls a mapped image address
    if:
      type: text
      regex: '(?i)\bDllCallAddress\s*\('

composite_rules:
  - id: autoit-in-memory-pe-loader
    desc: AutoIt manually maps an embedded PE image and calls into it
    crit: hostile
    conf: 0.97
    near_lines: 260
    all:
      - id: autoit-pe-header-struct
      - id: autoit-virtualalloc-rwx-image
      - id: autoit-manual-import-resolve
      - id: autoit-mapped-entry-call
