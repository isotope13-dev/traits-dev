defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: opaque-go-crypto-pe-memory
    attack: T1620
    desc: Opaque Go PE parsing, AES and executable-memory clues
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/lang/compiler/systems::go-opaque-module-path
      - id: micro-behaviors/data/parse/portable-executable::pe-mz-compare-x64
      - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
      - id: metadata/binary/instruction/call::x64-ecx-3000-edi-40-near-call
      - id: metadata/binary/symbols/name/qualified/security::go-internal-aes-cbc-decrypter-string
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    unless:
      - id: metadata/installer/product/
