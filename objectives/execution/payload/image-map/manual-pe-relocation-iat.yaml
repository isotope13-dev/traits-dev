defaults:
  platforms: [windows, unix]
  for: [powershell]

composite_rules:
  - id: c-manual-pe-relocation-and-iat-resolver
    desc: Manually relocates PE image and resolves IAT
    crit: hostile
    conf: 0.98
    for: [c, cpp]
    attack: T1620
    all:
      - id: micro-behaviors/mem/write/arbitrary::c-pe-base-relocation-directory-loop
      - id: micro-behaviors/mem/write/arbitrary::c-pe-import-descriptor-manual-resolve
      - id: objectives/execution/payload/image-map::mapped-pe-dll-attach-source
