defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
  crit: notable
composite_rules:
  - id: fnv-winhttp-and-pe-mapping-api-profile
    desc: FNV/WinHTTP profile beside PE-mapping APIs
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/client/winhttp::fnv-winhttp-encoded-endpoint-crypto-clues
      - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
      - id: micro-behaviors/mem/protect/modify/api-reference::nt-protect-virtual-memory-name
      - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
