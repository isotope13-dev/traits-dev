defaults:
  platforms: [windows]
  crit: suspicious
  conf: 0.96
  attack: T1620
composite_rules:
  - id: mapped-pe-dll-attach-source
    desc: Manually lays out PE sections and calls DLL attach
    for: [c, cpp]
    all:
      - id: micro-behaviors/process/deploy/image-map::mapped-instance-dll-attach-call
      - id: micro-behaviors/process/deploy/image-map::mapped-pe-raw-section-copy-source
      - id: micro-behaviors/data/format/executable/header::pe-first-thunk-member-access
  - id: mapped-pe-dll-attach-x64
    desc: PE section copying with DLL entry dispatch
    for: [pe, dll]
    arch: [x86-64]
    near_bytes: 2048
    all:
      - id: micro-behaviors/process/deploy/image-map::x64-pe-raw-section-copy
      - id: micro-behaviors/process/deploy/image-map::x64-pe-entry-and-dll-attach
  - id: mapped-pe-dll-attach-python
    desc: Maps PE sections and calls DLL attach
    for: [python]
    all:
      - id: micro-behaviors/process/deploy/image-map::mapped-pe-raw-section-copy-python
      - id: micro-behaviors/process/deploy/image-map::mapped-instance-dll-attach-call
      - id: micro-behaviors/data/format/executable/header::pe-first-thunk-member-access
  - id: c-module-overloading-reflective-pe-execution
    desc: Overwrites SEC_IMAGE view with PE and runs entry
    crit: hostile
    conf: 0.98
    for: [c, cpp]
    all:
      - id: micro-behaviors/mem/write/arbitrary::image-creation-and-mapped-pe-copy-source
      - id: mapped-pe-dll-attach-source
