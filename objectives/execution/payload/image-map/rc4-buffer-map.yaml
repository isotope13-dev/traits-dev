defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  attack: T1140,T1620
composite_rules:
  # Admission is the layered arithmetic/RC4 concealment and encoded data,
  # paired with a call-bound buffer-to-native-entry activation chain.
  - id: concealed-rc4-native-image-loader
    desc: Concealed RC4 buffer mapped to native entry
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/deploy/image-map::x86-rc4-buffer-to-manual-pe-map
      - id: micro-behaviors/crypto/symmetric/stream/rc4::x86-byte-state-signed-mask-prga
      - id: micro-behaviors/data/arithmetic::x86-buffer-add-xor-loop
      - id: metadata/file/encoding/base64::pe-dense-data-base64-like-blobs
