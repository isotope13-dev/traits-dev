defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]

composite_rules:
  - id: cipher-section-context-substitution
    desc: Cipher and section-map context substitution
    crit: hostile
    conf: 0.99
    attack: T1620
    all:
      - id: metadata/binary/instruction/sequence/unspecified::x64-section-debug-context-stores
      - id: micro-behaviors/crypto/symmetric/stream/transform::x64-index-sum-stream-xor
      - id: micro-behaviors/mem/map::nt-map-view-section-api-string
      - id: micro-behaviors/os/exception/error-handling::add-vectored-exception-handler
