defaults:
  platforms:
    - windows
composite_rules:
  - id: sidecar-exception-memory-api-profile
    desc: Sidecar, exception-table and memory API references
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/extension::short-bin-sidecar-reference
      - id: micro-behaviors/os/exception/register::unwind-and-memory-api-profile
    any:
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::pe-api-hashing-indicator-single
      - id: micro-behaviors/dylib/lookup::sparse-pe-dynamic-linking
      - id: objectives/evasion/self-delete/file/script::module-path-delete
    for: [pe, dll]
    unless:
      # The Go runtime resolves Win32 imports lazily (sparse import table) and
      # registers unwind data and VirtualAlloc itself; every Go PE carries the
      # last two legs, so the profile carries no image-mapping signal there.
      - id: metadata/lang/compiler/systems::go-binary-comp
