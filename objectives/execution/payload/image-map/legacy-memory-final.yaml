defaults:
  platforms:
  - windows
composite_rules:
- id: capi-inline-pe-executable-memory-clues
  desc: CryptoAPI, inline PE header and executable-memory clues
  crit: hostile
  conf: 0.98
  attack: T1140,T1620
  all:
  - id: micro-behaviors/crypto/provider/cryptoapi::capi-key-buffer-api-profile
  - id: micro-behaviors/mem/protect/modify/executable::executable-page-protection-evidence
  - id: micro-behaviors/data/embedded/payload/header::inline-pe-header-validation-sequence
  unless:
  - id: metadata/installer/product/
  - id: well-known/lib/platform/advanced-installer::advanced-installer-helper-context
  for:
  - pe
  - dll
- id: kernel-registry-triggered-pe-map
  desc: Kernel registry callback and manual PE mapping
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/os/kernel/callback::registry-thread-callback-lifecycle
  - id: metadata/binary/instruction/operand::x64-stack-structure-comparison-pattern
  - id: objectives/command-and-control/backdoor/loader/native-reflect::x64-manual-pe-mapper
  for: &id001
  - pe
  arch: &id002
  - x86-64
- id: kernel-callback-sparse-pe-map
  desc: Kernel callbacks and sparse-import manual PE mapper
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/os/kernel/callback::registry-and-thread-callbacks
  - id: objectives/command-and-control/backdoor/loader/native-reflect::x64-manual-pe-mapper
  - id: metadata/binary/symbols/imports::pe-imports-max-six
  - id: metadata/binary/symbols/imports::pe-single-import-dll
  for: *id001
  arch: *id002
