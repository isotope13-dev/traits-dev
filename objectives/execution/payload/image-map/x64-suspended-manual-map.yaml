# x64 manual mapping after a suspended launch.
#
# All three legs bind Windows API calls through RIP-relative IAT operands, so
# none of them is an import that might never be used. Together they establish
# that the module launches processes suspended AND manually maps a PE image
# into remote memory (allocate, write, then validate the copied MZ/PE headers
# through ReadProcessMemory) — a reflective-loading dropper chain, not
# debugging or ordinary cross-process inspection. The legs do not prove the
# mapped image landed in the very process that was suspended; the composite
# claims the two behaviors, not that binding.
defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86-64]

composite_rules:
  - id: x64-suspended-launch-remote-pe-map
    desc: Suspended-process launch with remote PE mapping
    crit: hostile
    conf: 0.92
    attack: T1055,T1620
    all:
      - id: micro-behaviors/process/create/exec::x64-createprocess-suspended
      - id: micro-behaviors/process/inject/runtime/memory::x64-remote-allocation-write-calls
      - id: micro-behaviors/mem/read/cross-process::x64-remote-pe-header-validation
