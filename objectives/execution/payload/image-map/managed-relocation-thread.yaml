defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: managed-relocation-thread-loader
    desc: Managed relocation field and memory and thread API references
    crit: notable
    conf: 0.95
    all:
      - id: metadata/lang/compiler/managed::dotnet-metadata
      - id: micro-behaviors/data/format/executable/header::managed-base-relocation-table-name
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/process/thread/create::create-thread
