defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1620,T1105,T1027

composite_rules:
  - id: obfuscated-node-pe-url-memory-loader
    desc: Obfuscated Node agent exposes URL-backed in-memory PE execution
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/source/naming/function::load-pe-from-url-name-reference
      - id: metadata/lang/source/naming/function::execute-in-memory-name-reference
      - id: metadata/lang/source/naming/function::download-and-run-name-reference
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime
      - id: metadata/import/builtin::require-child-process
