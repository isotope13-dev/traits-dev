defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1620,T1105,T1027

composite_rules:
  - id: obfuscated-node-pe-url-memory-loader
    desc: Obfuscated Node agent exposes URL-backed in-memory PE execution
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/source/naming/action/function-name::load-pe-from-url-name-reference
      - id: metadata/lang/source/naming/action/function-name::execute-in-memory-name-reference
      - id: metadata/lang/source/naming/action/function-name::download-and-run-name-reference
      - id: well-known/tool/packaging/javascript-obfuscator::plain-string-array-runtime
      - id: metadata/import/builtin::require-child-process
