defaults:
  platforms: [macos]
  for: [c, cpp]

traits:
  - id: jit-map-flag-reference
    desc: MAP_JIT mapping flag reference
    crit: component
    if:
      type: text
      word: MAP_JIT

composite_rules:
  - id: packed-macho-jit-resolved-symbol-execution
    desc: Mach-O loader APIs with JIT-resolved symbol call
    crit: hostile
    conf: 0.97
    all:
      - id: packed-macho-memory-loader-source
      - id: micro-behaviors/process/deploy/module-load::macho-jit-resolved-symbol-call

  - id: packed-macho-linked-symbol-execution
    desc: Mach-O memory loader and linked symbol call
    crit: hostile
    conf: 0.97
    all:
      - id: packed-macho-memory-loader-source
      - id: micro-behaviors/process/deploy/module-load::macho-linked-module-symbol-call

  - id: packed-macho-memory-loader-source
    desc: Mach-O loader APIs with aPLib and JIT flag
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/dylib/load/memory::mach-o-dyld4-memory-module-loader
      - id: micro-behaviors/dylib/load/memory::mach-o-legacy-memory-module-loader
      - id: micro-behaviors/data/decompress/aplib::aplib-safe-decompressor
      - id: jit-map-flag-reference
