# Concealed-payload loader chain for x86 PE binaries. Every leg is
# required: smuggled resolution of the hardening API, RWX hardening
# through the resolved pointer, an indexed keyed decode loop, a dispatch
# table of decoded chunks, invocation of the decoded buffer, and a
# timing-derived gate. Together they establish a program that hides its
# payload from static analysis and executes it with anti-emulation
# gating. Dynamic analysis of the reference carrier confirmed the
# decoded image performs installer behaviors (disguised updater copy,
# runas elevation, AppInit persistence, file cleanup, privilege
# escalation, forced reboot); the static matcher below claims only the
# conceal-and-execute chain, which has no legitimate use.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: x86-concealed-payload-loader-chain
    desc: x86 loader executes concealed decoded payload
    crit: hostile
    conf: 0.95
    attack: T1620,T1027
    arch: [x86]
    all:
      - id: micro-behaviors/os/api-resolution/digest-export/walk::x86-virtualprotect-loader-walk-resolve
      - id: micro-behaviors/mem/protect/modify/executable::x86-resolved-virtualprotect-rwx-call
      - id: micro-behaviors/data/decode/xor/transform::x86-indexed-key-xor-decode-loop
      - id: micro-behaviors/data/control-flow/dispatch/computed::x86-code-address-table-init
      - id: metadata/binary/instruction/sequence/control-flow::x86-call-triple-to-section-start
      - id: micro-behaviors/time/query::x86-tick-qpc-derived-decode-gate
