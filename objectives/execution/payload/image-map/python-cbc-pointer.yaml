defaults:
  for: [pyc]
  platforms: [windows]
composite_rules:
  - id: pyc-cbc-decrypted-buffer-pointer-execution
    desc: CBC decryption with native-pointer execution
    crit: hostile
    conf: 0.98
    attack: T1140,T1620
    all:
      - id: metadata/binary/code/bytecode::py37-nested-result-copy-sequence
      - id: micro-behaviors/process/inject/runtime/call::pyc-allocated-buffer-pointer-call-profile
      - id: metadata/binary/code/bytecode::python-bytecode-cbc-mode-ref
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::pyc-decrypt-reference
