defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055,T1620

composite_rules:
  - id: iis-native-module-reflective-pe-loader
    desc: IIS module PE and executable-memory clues
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/plugin::registermodule-name
      - id: micro-behaviors/communications/http/server/module::iis-native-module-pipeline-diagnostic
      - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/process/thread/create::create-thread
      - id: metadata/signature/absent::unsigned-missing-signature-record
