defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: unsigned-mz-rw-memory-loader
    desc: Unsigned PE with writable MZ image and memory APIs
    crit: hostile
    conf: 0.95
    attack: T1620,T1055
    for:
      - pe
    arch:
      - x86-64
    all:
      - id: micro-behaviors/data/parse/portable-executable::pe-mz-compare-x64
      - id: micro-behaviors/mem/alloc/virtual::virtualalloc-readwrite-commit-register-x64
      - id: metadata/file/profile/memory/protection-api::virtual-protect
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
