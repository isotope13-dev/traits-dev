defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: unsigned-mz-rw-memory-loader
    desc: Unsigned PE with writable MZ image and memory APIs
    crit: hostile
    conf: 0.95
    attack: T1620,T1055
    for:
      - pe
    arch:
      - x86-64
    all:
      - id: micro-behaviors/data/parse/portable-executable::pe-mz-compare-x64
      - id: micro-behaviors/mem/alloc/virtual::virtualalloc-readwrite-commit-register-x64
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: metadata/signature/absent::unsigned-missing-signature-record
    # mingw-w64 pseudo-reloc.c checks its own MZ header and imports
    # VirtualProtect, supplying two legs from the CRT (ASR flasher tools).
    unless:
      - id: metadata/installer/product/
      - id: metadata/lang/compiler/native::mingw-pseudo-reloc-runtime
