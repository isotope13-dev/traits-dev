defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  attack: T1620

composite_rules:
  - id: executable-header-reflective-pe-loader
    desc: Executable DOS header and PE entry dispatch
    crit: hostile
    conf: 0.98
    # Evaluated on the decrypted image, not its encrypted outer carrier.
    # Header code plus mapped-header parsing plus DLL/EXE entry dispatch
    # distinguishes this from ordinary PE inspection and error handling.
    all:
      - id: micro-behaviors/process/inject/runtime/call::executable-dos-header-call-pop-x86
      - id: micro-behaviors/process/inject/runtime/call::mapped-pe-signature-check-x86
      - id: micro-behaviors/process/inject/runtime/call::mapped-pe-entry-dispatch-x86

  - id: executable-mz-reflective-dll-bootstrap
    desc: Executable MZ header ReflectiveLoader scan
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/inject/dll::executable-mz-reflective-dll-trampoline-x86
      - id: micro-behaviors/data/embedded/payload/header::x86-inline-mz-eax-compare
      - id: metadata/binary/instruction/sequence/unspecified::pe-signature-immediate-compare
