defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  attack: T1620

composite_rules:
  - id: reflective-dll-remote-injection-apis
    desc: Reflective DLL with remote process injection APIs
    crit: hostile
    conf: 0.98
    attack: T1055
    all:
      - id: micro-behaviors/process/inject/dll::executable-mz-reflective-dll-trampoline-x86
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex-dup
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-binary
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread

  - id: executable-header-reflective-pe-loader
    desc: Executable DOS header and PE entry dispatch
    crit: hostile
    conf: 0.98
    # Evaluated on the decrypted image, not its encrypted outer carrier.
    # Header code plus mapped-header parsing plus DLL/EXE entry dispatch
    # distinguishes this from ordinary PE inspection and error handling.
    all:
      - id: micro-behaviors/process/inject/runtime/call::executable-dos-header-call-pop-x86
      - id: micro-behaviors/process/inject/runtime/call::mapped-pe-signature-check-x86
      - id: micro-behaviors/process/inject/runtime/call::mapped-pe-entry-dispatch-x86

  - id: executable-mz-reflective-dll-bootstrap
    desc: Executable MZ header ReflectiveLoader scan
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/inject/dll::executable-mz-reflective-dll-trampoline-x86
      - id: micro-behaviors/data/embedded/payload/header::x86-inline-mz-eax-compare
      - id: metadata/binary/instruction/sequence/comparison::pe-signature-immediate-compare

  - id: executable-mz-backward-image-loader
    desc: Executable DOS header calls a backward PE image loader
    crit: hostile
    conf: 0.99
    # Executable header trampoline plus bounded MZ/PE memory scan. The scan
    # alone also occurs in image inspection and is only notable.
    all:
      - id: micro-behaviors/process/inject/dll::executable-mz-reflective-dll-trampoline-x86
      - id: micro-behaviors/data/embedded/payload/header::x86-backward-image-search
