defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1620

composite_rules:
  - id: concealed-native-pe-image-mapper
    desc: Concealed PE payload is manually mapped in memory
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/deploy/image-map::native-pe-image-map-status-strings
      - id: micro-behaviors/data/format/pe-parser::x86-base-relocation-type-dispatch
      - id: micro-behaviors/mem/combined::virtual-memory-allocation-protection-api-pair
      - id: objectives/anti-static/obfuscation/payload/section/content::encrypted-loader-data-geometry
