defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1620

composite_rules:
  - id: self-signed-microsoft-claim-manual-payload-map
    desc: Self-signed Microsoft claim maps encrypted PE payload
    crit: hostile
    conf: 0.99
    attack: T1620,T1036.005
    all:
      - id: micro-behaviors/process/deploy/image-map::native-pe-image-map-status-strings
      - id: micro-behaviors/data/format/pe-parser::x86-base-relocation-type-dispatch
      - id: micro-behaviors/mem/alloc/virtual::virtualalloc-readwrite-commit-resolved-x64-register-order
      - id: objectives/anti-static/obfuscation/payload/section/content::encrypted-loader-data-geometry
      - id: metadata/signature/self-signed/signer::microsoft-corporation
      - id: metadata/signature/claim/subject::microsoft-corp-marker-cert
  - id: concealed-native-pe-image-mapper
    desc: Concealed PE payload is manually mapped in memory
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/deploy/image-map::native-pe-image-map-status-strings
      - id: micro-behaviors/data/format/pe-parser::x86-base-relocation-type-dispatch
      - id: micro-behaviors/mem/combined::virtual-memory-allocation-protection-api-pair
      - id: objectives/anti-static/obfuscation/payload/section/content::encrypted-loader-data-geometry
  - id: x64-tls-peb-xor-reflective-pe-mapper
    desc: TLS callback maps PE via PEB walk and XOR memory APIs
    crit: hostile
    conf: 0.97
    for: [pe, dll]
    arch: [x86-64]
    attack: T1620,T1027.002
    all:
      - id: metadata/binary/layout/tls::pe-tls-callback-table
      - id: micro-behaviors/os/api-resolution/manual::gs-peb-ldr-access-x64
      - id: micro-behaviors/os/api-resolution/export-table::x64-pe-signature-export-rva-read
      - id: micro-behaviors/mem/alloc/virtual::xor-decoded-virtual-alloc-api
      - id: micro-behaviors/mem/protect/modify/encoded-reference::xor-decoded-virtual-protect-api
    any:
      - id: micro-behaviors/data/format/pe-parser::x64-rex-base-relocation-type-dispatch
      - id: micro-behaviors/data/format/pe-parser::x86-base-relocation-type-dispatch
    unless:
      - id: metadata/installer/product/
      - id: metadata/signature/verified/platform/
