defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
composite_rules:
  - id: x64-encrypted-image-loader
    desc: Concealed native loader decrypts and relocates an image payload
    crit: hostile
    conf: 0.97
    attack: T1620,T1027
    all:
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::x64-djb2-xor-export-walk
      - id: micro-behaviors/data/decode/xor/transform::x64-xorshift-secret-decode
      - id: micro-behaviors/crypto/decrypt/transform/symmetric::x64-cbc-padded-decrypt-call
    any:
      - id: metadata/binary/instruction/sequence/image-layout::pe-dir64-relocation-loop-x64
      - id: metadata/binary/instruction/sequence/image-layout::pe-dir64-bounded-relocation-loop-x64
