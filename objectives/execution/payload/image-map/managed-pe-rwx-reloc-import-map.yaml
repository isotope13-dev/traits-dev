# Managed code that reads the PE header from a byte array, allocates RWX
# memory, applies base relocations and binds imports by hand is a reflective
# loader: the DLL runs without Windows ever loading it from disk.
defaults:
  platforms: [windows]
  for: [csharp, powershell]
  attack: T1620
  mbc: B0003

traits:
  - id: managed-pe-header-parse-from-bytes
    desc: Managed code parses PE header bytes
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?is)ToInt32\(\w{1,20},\s*0x3C\).{0,240}0x0*4550\b'

composite_rules:
  - id: managed-pe-rwx-reloc-import-mapper
    desc: Managed code maps a PE with RWX memory, relocs, imports
    crit: hostile
    conf: 0.97
    near_lines: 300
    all:
      - id: managed-pe-header-parse-from-bytes
      - id: micro-behaviors/mem/alloc/virtual::virtualalloc-rwx-source-reference
      - id: micro-behaviors/data/bitwise/mask::low-twelve-bit-mask-expression
      - id: micro-behaviors/dylib/lookup::get-proc-address-source-call
