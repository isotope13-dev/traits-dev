defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: encrypted-socket-buffer-execution
    desc: Executes decrypted network code in memory
    crit: hostile
    conf: 0.99
    attack: T1105,T1620
    all:
      - id: micro-behaviors/mem/combined::x86-recv-decrypt-call-buffer
      - id: micro-behaviors/crypto/decrypt::crypt-decrypt
