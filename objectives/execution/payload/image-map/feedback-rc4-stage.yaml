defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
composite_rules:
  - id: feedback-concealed-rc4-dll-image-activation
    desc: Parasitic RC4 stage maps and activates a DLL
    crit: hostile
    conf: 0.98
    attack: T1027,T1620
    # The established parasitic-entry finding supplies attack admission;
    # encryption plus mapping alone could describe a legitimate protector.
    # The transform and section-to-entry chain are nearby. This is a rule
    # for recovered stages; it cannot decode the carrier on its own.
    near_bytes: 6144
    all:
      - id: objectives/impact/infect/virus::inline-trampoline-feedback-parasite
      - id: micro-behaviors/data/decode/xor/feedback::x86-multiply-rotate-feedback-xor-loop
      - id: micro-behaviors/crypto/symmetric/stream/rc4/transform::x86-byte-register-state-prga
      - id: micro-behaviors/process/deploy/image-map::x86-pe-sections-to-dll-entry
