defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: opaque-go-rwx-pe-thread-apis
    attack: T1620
    desc: Opaque Go PE parsing with RWX and thread APIs
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/lang/compiler/systems::go-opaque-module-path
      - id: micro-behaviors/data/parse/portable-executable::pe-mz-compare-x64
      - id: metadata/binary/instruction/call::x64-ecx-3000-edi-40-forward-call
      - id: micro-behaviors/process/info/thread::thread-context-pair-get-set
      - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-text-pe
    unless:
      - id: metadata/installer/product/
