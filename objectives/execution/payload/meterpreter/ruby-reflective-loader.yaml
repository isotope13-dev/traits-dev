defaults:
  for: [ruby]
  platforms: [windows]
traits:
  - id: ruby-meterpreter-reflective-stage
    desc: Constructs a reflective Meterpreter DLL stage
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule ruby_meterpreter_reflective_stage {
          strings:
            $module = "Payload::Windows::MeterpreterLoader"
            $load = "load_rdi_dll(MetasploitPayloads.meterpreter_path('metsrv', 'x86.dll'))"
            $asm = "asm_invoke_metsrv(asm_opts)"
            $patch = "dll[ 0, bootstrap.length ] = bootstrap"
            $stage = "stage_meterpreter(opts) + generate_config(opts)"
          condition:
            all of them
        }
