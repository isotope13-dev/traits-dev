defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1189

traits:
  - id: bxss-script-source
    desc: Script element points to BXSS host
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: 'script\.src\s*=\s*["\x27]https?://[a-z0-9-]+\.bxss\.in["\x27]'

  - id: injected-script-element
    desc: Script creates script element
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: 'document\.createElement\s*\(\s*["\x27]script["\x27]\s*\)'

  - id: append-script-element
    desc: Script appends script element to body
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: 'document\.body\.appendChild\s*\(\s*script\s*\)'

composite_rules:
  - id: browser-bxss-script-injection
    desc: Module injects external BXSS script
    crit: suspicious
    conf: 0.99
    for: [javascript]
    scope: file
    all:
      - id: bxss-script-source
      - id: injected-script-element
      - id: append-script-element
      - id: metadata/lang/source/declaration::parenthesized-anonymous-function
      - id: micro-behaviors/data/control-flow/module-exec::js-synchronous-iife-close

  - id: npm-entry-bxss-script-injection
    desc: npm module entrypoint injects remote BXSS script
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar, javascript, package.json]
    scope: archive
    all:
      - id: browser-bxss-script-injection
      - id: metadata/package/entrypoint/module::main-root-javascript-entry
