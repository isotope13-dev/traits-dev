# An extension background script that downloads a payload, decrypts it with
# WebCrypto AES-GCM and runs it as a script in the visited page's own world
# (userScripts.register or scripting.executeScript with world MAIN). The
# extension package never contains the code that ends up running, so review of
# the package cannot establish what the payload does with the page.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1059.007,T1105,T1027
  crit: hostile
  conf: 0.9

composite_rules:
  - id: extension-decrypted-payload-main-world-injector
    desc: Extension decrypts a fetched payload and injects it into the page world
    all:
      - id: micro-behaviors/communications/http/client/script::fetch-call
      - id: micro-behaviors/crypto/provider/webcrypto::webcrypto-aes-gcm-decrypt
      - id: micro-behaviors/process/inject/webextension::chrome-scripting-main-world
      - id: micro-behaviors/process/inject/webextension::userscripts-register-api
