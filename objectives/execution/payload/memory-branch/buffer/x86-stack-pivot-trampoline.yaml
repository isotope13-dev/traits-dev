# x86 code that reloads ESP from an absolute address and then jumps through a
# pointer held in data abandons its own call stack for a saved one and enters
# code whose address is only known at run time -- how a crypter hands control
# to the payload it just decrypted. Compilers restore ESP from the frame, not
# from a global. The 2018 Dofoil/Smoke Loader crypter (MediaGet update
# hijack) pushed this trampoline's address and `ret`'d into it.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1620,T1027.002

traits:
  - id: x86-global-stack-pivot-indirect-jump
    desc: ESP reloaded from global, then indirect jump
    # Notable alone: NSIS's System.dll plug-in, which calls arbitrary Win32
    # functions for install scripts, uses the same idiom legitimately.
    crit: notable
    conf: 0.88
    if:
      type: hex
      section: .text
      pattern: '8B 25 ?? ?? ?? ?? [0-24] FF 25 ?? ?? ?? ??'

composite_rules:
  - id: crypter-stub-pivots-into-runtime-code
    desc: Crypter stub pivots its stack and jumps into runtime-resolved code
    crit: hostile
    conf: 0.93
    all:
      - id: x86-global-stack-pivot-indirect-jump
    any:
      - id: objectives/anti-static/obfuscation/string/broken-api::runtime-repaired-api-stub
      - id: objectives/anti-static/obfuscation/decoy-imports::ddi-decoy-iat-crypter
      - id: objectives/anti-static/obfuscation/decoy-imports::gdi-driver-ddi-decoy-imports
