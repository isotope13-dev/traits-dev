defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
composite_rules:
  - id: png-xor-loader
    ref: https://www.reversinglabs.com/blog/threat-researchers-notebook-bubbleloader
    desc: PNG XOR loader with obfuscated allocation and handoff
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/anti-static/obfuscation/instruction/junk::x64-repeated-fabricated-return-jumps
      - id: objectives/anti-static/obfuscation/steganography/image::png-resource-xor-decoder
      - id: micro-behaviors/mem/alloc/virtual::x64-virtualalloc-rwx-jump
      - id: micro-behaviors/process/deploy/native-call::x64-copy-buffer-offset-jump
