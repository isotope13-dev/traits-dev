# Decrypting embedded bytes into a fresh RWX buffer and calling it runs code
# that never appears in the file. Packers and protectors do the same, so this
# stays suspicious; family and context rules raise it.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1140,T1620
composite_rules:
  - id: x86-decrypt-to-rwx-and-call
    desc: Decrypts embedded bytes into RWX memory and calls them
    crit: suspicious
    conf: 0.9
    near_bytes: 200
    all:
      - id: micro-behaviors/data/decode/xor/feedback::x86-rol16-multiply-key-xor-loop
      - id: micro-behaviors/mem/alloc/virtual::x86-rwx-alloc-then-call-buffer
