# Sideloaded or staged Windows DLL loaders that read an encrypted companion
# payload file from disk, decode it with a custom byte cipher into VirtualAlloc
# memory, mark the buffer executable with VirtualProtect, and transfer control.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_max: 5242880
  attack: T1574.001,T1140,T1620

traits:
  - id: file-open-read-api-pair-imports
    desc: Imports CreateFile API for file reads
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: import
      regex: '^CreateFile[AW]$'

  - id: readfile-import-symbol
    desc: Imports ReadFile API
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: import
      exact: ReadFile

composite_rules:
  - id: companion-file-decrypt-executable-stage
    desc: Reads local companion file and decodes bytes into executable memory
    crit: hostile
    conf: 0.98
    all:
      - id: file-open-read-api-pair-imports
      - id: readfile-import-symbol
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    any:
      - id: micro-behaviors/data/encode/custom::x64-rolling-bit-rotation-xor-decoder
      - id: micro-behaviors/data/encode/custom::x86-rolling-bit-rotation-xor-decoder
      - id: micro-behaviors/data/encode/custom::x86-lookup-table-byte-decoder
      - id: micro-behaviors/data/encode/custom::x86-indexed-substitution-byte-decoder
    unless:
      - id: metadata/signature/verified/platform/
