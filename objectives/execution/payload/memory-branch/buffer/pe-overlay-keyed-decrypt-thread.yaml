# A PE reads a keyed-decrypted payload from its own overlay into RWX memory and
# starts it on a new thread. The keyed XOR loop, the decrypt buffer protection
# calls, and the thread start are the loader; the overlay is the payload store.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027,T1620

composite_rules:
  - id: pe-overlay-keyed-decrypt-thread-loader
    desc: PE decrypts its overlay into RWX memory and starts a thread
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::pe-x64-keyed-table-xor-loop
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-import
      - id: micro-behaviors/process/thread/create::create-thread
      - id: metadata/binary/layout/ratio::large-file-overlay-at-least-half
