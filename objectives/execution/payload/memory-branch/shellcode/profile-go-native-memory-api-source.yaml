defaults:
  platforms: [windows]

composite_rules:
  - id: go-windows-native-shellcode-loader-source
    for: [go]
    desc: Go NT memory APIs and long hex literal
    crit: suspicious
    conf: 0.96
    attack: T1055.004,T1027.009
    all:
      - id: micro-behaviors/fs/path/system/library::ntdll-module-name-source
      - id: micro-behaviors/os/syscall/invoke::nt-native-memory-api-source
      - id: micro-behaviors/data/decode/hex::go-hex-decode-string
      - id: metadata/lang/encoding/hex::hex-long-hex-string-literal
