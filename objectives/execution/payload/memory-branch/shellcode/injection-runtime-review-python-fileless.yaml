defaults:
  mbc: B0033
  crit: hostile
  platforms: [windows, unix]
  attack: T1055
  for: [python]

composite_rules:
  - id: text-python-ctypes-shellcode-loader
    desc: Text Python RWX buffer and pointer call
    conf: 0.98
    for: [text]
    platforms: [windows]
    attack: T1036.008,T1055.001,T1620
    near_lines: 40
    all:
      - id: metadata/file/extension/identity::doc-or-config-extension
      - id: micro-behaviors/mem/alloc/virtual::python-virtualalloc-near-rwx-number
      - id: "micro-behaviors/mem/copy::text-python-ctypes-memmove-call"
      - id: micro-behaviors/process/inject/runtime/call::text-python-cfunctype-function-pointer-call
  - id: python-ctypes-shellcode-loader
    desc: Python executable buffer and thread
    conf: 0.99
    platforms: [windows]
    attack: T1055.001,T1620
    all:
      - id: micro-behaviors/mem/alloc/virtual::python-virtualalloc-near-rwx-number
      - id: "micro-behaviors/mem/copy::python-ctypes-memmove"
      - id: micro-behaviors/process/thread/create::python-ctypes-create-thread
    any:
      - id: micro-behaviors/data/decode/base64::base64-decoding
      - id: micro-behaviors/crypto/symmetric/stream/rc4::source-rc4-implementation
    needs: 1
