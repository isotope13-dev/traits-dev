defaults:
  crit: hostile
  for: [powershell, batch]
  platforms: [windows]
  attack: T1055
  mbc: B0033

composite_rules:
  - id: powershell-inprocess-shellcode-loader
    for: [powershell]
    desc: PowerShell executable buffer and thread
    conf: 0.99
    attack: T1055.001,T1620
    near_lines: 80
    all:
      - id: micro-behaviors/mem/alloc/virtual::powershell-virtualalloc-reference
      - id: micro-behaviors/mem/alloc/virtual::powershell-virtualalloc-allocation-flag-evidence
      - id: micro-behaviors/mem/combined::powershell-rwx-protection-evidence
      - id: "micro-behaviors/mem/copy::marshal-copy-powershell"
    any:
      - id: micro-behaviors/process/thread/create::powershell-create-thread-pinvoke
      - id: micro-behaviors/process/thread/create::powershell-emitted-createthread-pinvoke
    unless:
      - id: metadata/build/scaffold::ruby-format-payload-placeholder
  - id: powershell-decoded-delegate-shellcode
    for: [powershell]
    desc: PowerShell decoded buffer and native delegate
    conf: 0.96
    attack: T1620,T1106
    near_lines: 80
    all:
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/mem/alloc/virtual::powershell-virtualalloc-reference
      - id: micro-behaviors/mem/alloc/virtual::powershell-delegate-rwx-alloc-arguments
      - id: micro-behaviors/mem/copy::marshal-copy-powershell
      - id: micro-behaviors/os/api-resolution/dynamic::powershell-function-pointer-delegate
      - id: micro-behaviors/os/api-resolution/dynamic::powershell-bound-delegate-invoked
    unless:
      - id: metadata/build/scaffold::ruby-format-payload-placeholder
