# Templates retain the attack algorithm, even when payload bytes and variable
# names are filled in by a generator. Do not use scaffold markers as an
# exemption. These composites cover separate native-thread and JIT mechanisms.
defaults:
  for: [powershell]
  platforms: [windows]
  crit: hostile
  conf: 0.97
  attack: T1620

composite_rules:
  - id: powershell-decoded-buffer-protect-thread
    desc: PowerShell decodes, copies and executes a buffer
    near_lines: 80
    all:
      - id: micro-behaviors/data/decode/base64/unspecified::powershell-frombase64string
      - id: micro-behaviors/mem/alloc/virtual::powershell-virtualalloc-reference
      - id: micro-behaviors/mem/copy::marshal-copy-powershell
      - id: micro-behaviors/mem/protect/modify/executable::powershell-virtualprotect-execute-argument
      - id: micro-behaviors/process/thread/create::powershell-static-createthread-call
      - id: micro-behaviors/process/thread/create::powershell-copied-buffer-thread-entry

  - id: powershell-decoded-msil-method-overwrite
    desc: PowerShell stages decoded bytes with MSIL method-pointer copying
    all:
      - id: micro-behaviors/mem/combined::powershell-msil-pointer-block-copy
      - id: micro-behaviors/data/decode/base64/unspecified::powershell-frombase64string
      - id: micro-behaviors/mem/alloc/heap::dotnet-unmanaged-allocation-name
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/assembly::powershell-assembly-method-invoke
      - id: micro-behaviors/metaprogramming/reflection/invoke::powershell-array-then-literal-static-invoke
      - id: metadata/lang/source/syntax/assignment/call::powershell-first-array-entry-helper-pointer

  - id: powershell-rwx-buffer-thread
    desc: PowerShell copies a buffer into RWX memory and starts a thread
    near_lines: 40
    all:
      - id: micro-behaviors/mem/alloc/virtual::powershell-virtualalloc-commit-rwx-call
      - id: micro-behaviors/mem/copy::marshal-copy-powershell
      - id: micro-behaviors/process/thread/create::powershell-static-createthread-call
      - id: micro-behaviors/process/thread/create::powershell-copied-buffer-thread-entry

  - id: powershell-decoded-buffer-delegate-thread
    desc: PowerShell stages decoded bytes for a resolved native thread
    near_lines: 80
    all:
      - id: micro-behaviors/mem/combined::powershell-delegate-alloc-copy-protect
      - id: micro-behaviors/data/decode/base64/unspecified::powershell-frombase64string
      - id: micro-behaviors/process/thread/create::powershell-copied-buffer-thread-entry
