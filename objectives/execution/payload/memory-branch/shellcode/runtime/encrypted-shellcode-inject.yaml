defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055,T1140
  mbc: B0033

traits:
  - id: encrypted-shellcode-read-banner
    desc: Logs reading encrypted shellcode
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(reading|loading|decrypting)\s+encrypted\s+shellcode'

  - id: injecting-bytes-format-banner
    desc: Formats injected payload byte count
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)injecting\s+%[zl]{0,2}[udi]\s+bytes'

composite_rules:
  - id: encrypted-shellcode-injection-runtime
    desc: Decrypts and injects shellcode payload with status output
    crit: suspicious
    conf: 0.97
    all:
      - id: encrypted-shellcode-read-banner
      - id: injecting-bytes-format-banner
