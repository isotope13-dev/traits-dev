defaults:
  for: [rust]
  platforms: [windows, unix]
  crit: component

traits:
  - id: rust-anonymous-map-call
    desc: Rust calls anonymous memory mapping
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '(^|\.)map_anon$'

  - id: rust-mapping-exec-transition
    desc: Rust makes a mapping executable
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '(^|\.)make_exec$'

  - id: rust-mapping-slice-copy
    desc: Rust copies bytes from a slice
    if:
      type: symbol
      kind: call
      regex: '(^|\.)copy_from_slice$'

  - id: rust-transmute-pointer-to-function
    desc: Rust casts a pointer to function
    if:
      type: text
      regex: '\bfn\s*\([^\r\n]{0,35}\)[^\r\n=]{0,22}=\s*[\w:]*transmute\s*\('

composite_rules:
  - id: rust-anonymous-mapping-payload-stager
    desc: Rust stages file bytes in an anonymous executable mapping
    crit: hostile
    conf: 0.96
    attack: T1055
    all:
      - id: rust-anonymous-map-call
      - id: rust-mapping-slice-copy
      - id: rust-mapping-exec-transition
      - id: rust-transmute-pointer-to-function
    any:
      - id: micro-behaviors/fs/read/file/content/whole::rust-fs-read
      - id: micro-behaviors/fs/read/file/content/whole::rust-read-to-end
    needs: 1
    near_lines: 60
