defaults:
  platforms: [unix, windows]
  for: [powershell]
  attack: T1027

composite_rules:
  - id: powershell-boolean-masked-shellcode
    crit: hostile
    desc: Encoded delegate shellcode with AND/NOT masking
    conf: 0.98
    attack: T1027,T1140,T1620
    all:
      - id: objectives/execution/payload/memory-branch/shellcode::powershell-decoded-delegate-shellcode
