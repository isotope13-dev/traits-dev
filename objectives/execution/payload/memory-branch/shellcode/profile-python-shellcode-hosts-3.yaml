defaults:
  platforms:
  - windows
  for:
  - python
composite_rules:
- id: python-alertable-shellcode-host
  desc: Python shellcode and alertable-spawn names
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/process/deploy/native-call::python-spawn-shellcode
  - id: micro-behaviors/process/thread/runtime::python-spawn-alertable
- id: python-shellcode-dll-host
  desc: Python shellcode and DLL-spawn names
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/process/deploy/native-call::python-spawn-shellcode
  - id: micro-behaviors/process/deploy/library::python-spawn-dll
