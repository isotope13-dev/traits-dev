defaults:
  platforms: [unix]
  for: [go]
  attack: T1055
  mbc: B0033

composite_rules:
  - id: go-unix-local-shellcode-exec-source
    desc: Go source executes bytes from RX memory
    crit: hostile
    conf: 0.97
    near_lines: 20
    all:
      - id: micro-behaviors/mem/protect/modify/unspecified::go-syscall-mprotect
      - id: micro-behaviors/mem/protect/constant::go-syscall-prot-exec
      - id: micro-behaviors/data/control-flow/dispatch/indirect::go-unsafe-function-pointer-call
