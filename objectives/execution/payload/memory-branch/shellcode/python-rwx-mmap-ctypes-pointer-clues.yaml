defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [python]

composite_rules:
  - id: python-rwx-mmap-ctypes-pointer-clues
    desc: Python RWX mmap and ctypes pointer clues
    conf: 0.93
    platforms: [unix]
    unless:
      - id: metadata/package/testing/presence/harness::python-test-directory-path
    all:
      - id: "micro-behaviors/mem/map::python-mmap-prot-exec"
      - id: micro-behaviors/process/inject/runtime/call::python-cfunctype-from-buffer-address

  # Staged delivery with an integrity gate: bytes are accumulated, their
  # SHA-256 is checked against an operator-supplied digest, and only a matching
  # buffer is flipped RWX and jumped to. The hash gate distinguishes a verified
  # in-memory payload stager from an incidental digest computation.
