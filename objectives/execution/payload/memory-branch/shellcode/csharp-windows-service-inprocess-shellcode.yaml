defaults:
  platforms: [windows]
  for: [csharp]
composite_rules:
  - id: csharp-windows-service-inprocess-shellcode
    desc: C# service with shellcode and executable-memory clues
    crit: suspicious
    conf: 0.98
    for: [pe]
    all:
      - id: objectives/execution/payload/memory-branch/shellcode::csharp-loadshellcode-method-ref
      - id: micro-behaviors/os/service/dispatch::csharp-servicebase-type-ref
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-string
      - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-text-pe
