defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: x64-rwx-rolling-xor-memory-loader
    attack: T1027,T1140,T1620
    desc: x64 rolling-XOR payload loader in executable memory
    crit: hostile
    conf: 0.995
    all:
      - id: metadata/binary/instruction/call::x64-reg-40-3000-call-register
    any:
      - id: micro-behaviors/data/decode/xor/feedback::x64-rolling-byte-xor-decode-loop
      - id: micro-behaviors/data/decode/xor/feedback::x64-rolling-byte-xor-decode-loop-accumulator
    unless:
      - id: metadata/installer/product/
