# Fault-driven staged memory execution: the loader prepares a shellcode buffer
# in allocated virtual memory, intentionally strips page permissions to
# PAGE_NOACCESS (1), and immediately calls the staged address so an access-
# violation handler unpacks the page in place and resumes execution.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  attack: T1055,T1620
  mbc: B0032

composite_rules:
  - id: page-noaccess-veh-xor-stage-exec
    desc: Runs staged memory via NOACCESS fault unpacker
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/exception/handler::x64-veh-av-xor-unpack-continue
      - id: micro-behaviors/mem/protect/modify/unspecified::x64-page-noaccess-trap-call
      - id: micro-behaviors/mem/sync/cache::flush-instruction-cache

  - id: transposed-hex-noaccess-trap-stage
    desc: Decodes transposed hex stage into NOACCESS trap
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/hex-pair::x64-transposed-hex-pair-decoder
      - id: metadata/file/encoding/hex::long-hex-text-run
      - id: micro-behaviors/mem/alloc/virtual::alloc-memory-sym--ntallocatevirtualmemory
      - id: micro-behaviors/mem/protect/modify/unspecified::x64-page-noaccess-trap-call
