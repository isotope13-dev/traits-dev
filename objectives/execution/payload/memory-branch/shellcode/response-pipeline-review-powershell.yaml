defaults:
  platforms: [windows]
  for: [powershell]
traits: []
composite_rules:
  - id: ps-http-inprocess-shellcode-loader
    desc: PowerShell network-delivered in-process shellcode loader
    crit: hostile
    conf: 0.99
    attack: T1105,T1055.001,T1620
    mbc: B0030
    near_lines: 80
    all:
      - id: objectives/execution/payload/memory-branch/shellcode::powershell-inprocess-shellcode-loader
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
