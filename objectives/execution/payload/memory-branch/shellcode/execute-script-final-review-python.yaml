defaults:
  attack: T1105
  mbc: E1105
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]

composite_rules:
  - id: text-python-http-shellcode-loader
    desc: Text Python HTTP and shellcode loader
    crit: hostile
    conf: 0.99
    for: [text]
    platforms: [windows]
    attack: T1036.008,T1105,T1620
    mbc: B0024,B0033
    near_lines: 80
    all:
      - id: micro-behaviors/communications/http/lib/urllib::text-python-urlopen-response-body-read
      - id: objectives/execution/payload/memory-branch/shellcode::text-python-ctypes-shellcode-loader
