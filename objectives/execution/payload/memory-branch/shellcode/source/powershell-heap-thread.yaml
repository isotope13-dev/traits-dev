defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.94

traits:
  - id: powershell-native-calloc-call
    desc: PowerShell calls native heap allocation
    if:
      type: text
      regex: '(?i)::\s*(calloc|malloc)\s*\('

  - id: powershell-native-memset-call
    desc: PowerShell calls native byte fill
    if:
      type: text
      regex: '(?i)::\s*memset\s*\('

  - id: powershell-quoted-hexadecimal-byte-list
    desc: PowerShell carries a quoted hex byte list
    if:
      type: text
      regex: '(?i)["'']\s*(0x[0-9a-f]{1,2}\s*,\s*){31}0x[0-9a-f]{1,2}'

composite_rules:
  - id: powershell-inline-native-heap-thread-stage
    desc: PowerShell compiles native calls and runs a byte buffer from heap memory
    crit: hostile
    conf: 0.97
    attack: T1620
    near_bytes: 6500
    all:
      - id: micro-behaviors/metaprogramming/generation/compile::powershell-add-type-memberdefinition
      - id: powershell-quoted-hexadecimal-byte-list
      - id: powershell-native-calloc-call
      - id: micro-behaviors/mem/protect/modify/executable::powershell-virtualprotect-execute-argument
      - id: micro-behaviors/process/thread/create::powershell-static-createthread-call
    any:
      - id: powershell-native-memset-call
      - id: micro-behaviors/mem/copy::marshal-copy-powershell
