defaults:
  platforms:
  - windows
  for:
  - python
composite_rules:
- id: python-heap-shellcode-loader
  desc: Python heap-copy, pointer and input clues
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/mem/alloc/heap::python-heapalloc-call
  - id: micro-behaviors/process/inject/runtime/call::python-rtlmovememory-call
  - id: micro-behaviors/dylib/load/ffi::python-cfunctype-pointer-wrapper
  any:
  - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
  - id: metadata/import/python/urllib/request
