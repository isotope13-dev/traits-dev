defaults:
  platforms: [windows]
  for: [pe]
  size_max: 524288

composite_rules:
  - id: rc4-shellcode-cli-text-clues
    desc: RC4 shellcode command-line text clues
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/crypto/encrypt/transform::rc4-encrypt-banner
      - id: objectives/execution/payload/memory-branch/shellcode::inject-banner
      - id: micro-behaviors/crypto/symmetric/stream/rc4/transform::rc4-transform-method
