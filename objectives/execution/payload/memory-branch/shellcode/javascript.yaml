defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1055,T1140

composite_rules:
  - id: node-ffi-encrypted-shellcode-loader
    desc: Node FFI decrypts and runs shellcode
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/dylib/load/ffi::node-ffi-rs-binding
      - id: micro-behaviors/mem/combined::javascript-virtualalloc-rwx-reference
      - id: micro-behaviors/mem/copy::javascript-rtlmovememory-reference
    any:
      - id: micro-behaviors/crypto/decrypt/initialize::createDecipheriv
      - id: metadata/lang/source/literal/string/cryptography::aes-256-gcm-dash

  - id: koffi-rwx-buffer-copy-thread-execution
    desc: Koffi executes copied bytes from an RWX VirtualAlloc buffer
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/dylib/load/binding::koffi-import
      - id: micro-behaviors/dylib/load/binding::koffi-load-call
      - id: micro-behaviors/mem/combined::javascript-virtualalloc-rwx-reference
      - id: micro-behaviors/mem/copy::javascript-copy-target-from-virtualalloc
      - id: micro-behaviors/process/thread/create::allocated-thread-entry-source

  # Declaring WriteProcessMemory together with CreateThread through a native
  # FFI binding prepares in-process or remote payload execution from
  # JavaScript. Definition-only WinAPI typings do not import koffi, so the
  # import leg excludes them.
  - id: koffi-write-memory-thread-declarations
    desc: Koffi FFI declares memory write and thread
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/dylib/load/binding::koffi-import
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-text
      - id: micro-behaviors/process/thread/create::javascript-createthread-reference
