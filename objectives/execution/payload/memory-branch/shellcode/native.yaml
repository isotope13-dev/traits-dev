defaults:
  platforms: [windows]
  attack: T1055
  mbc: B0033

composite_rules:
  - id: go-rwx-syscall-self-injection
    desc: Garbled Go loader executes a computed entry point from RWX memory
    crit: hostile
    conf: 0.99
    for:
      - pe
    arch:
      - x86-64
    attack: T1027,T1620
    all:
      - id: metadata/lang/compiler/systems::go-buildinfo
      - id: metadata/binary/instruction/call::x64-ecx-3000-edi-40-call-alternative
      - id: micro-behaviors/process/inject/runtime/call::go-syscall-computed-entry-dispatch-x64
      - id: objectives/anti-static/obfuscation/name-mangling/type-names::obfuscated-go-identifiers
  - id: go-local-shellcode-loader
    desc: Go local shellcode loader with executable-memory evidence
    crit: suspicious
    conf: 0.92
    for:
      - pe
    all:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/process/thread/create::create-thread
      - id: metadata/binary/symbols/name/api-resolution::go-syscall-proc-call
    any:
      - id: metadata/binary/instruction/operand::push-imm8-40-repeated
      - id: metadata/binary/instruction/call::push-40-1000-near-or-indirect-call
      - id: metadata/binary/instruction/operand::x64-load-r8-r9-40
      - id: objectives/execution/payload/memory-branch/shellcode::native-shellcode-function-marker
      - id: objectives/execution/payload/memory-branch/shellcode::native-shellcode-execution-marker
    unless:
      - id: well-known/lib/platform/sonic::go-sonic-loader-marker
  - id: go-decoded-shellcode-loader
    desc: Go shellcode loader with encoded-payload evidence
    crit: hostile
    conf: 0.97
    for:
      - pe
    all:
      - id: go-local-shellcode-loader
    any:
      - id: metadata/file/encoding/base64::pe-dense-data-base64-like-blobs
      - id: objectives/execution/payload/memory-branch/shellcode::native-shellcode-function-marker
      - id: objectives/execution/payload/memory-branch/shellcode::native-shellcode-execution-marker
    unless:
      - id: well-known/app/security/packetfence::packetfence-windows-agent-path
      - id: well-known/tool/development/toolchain/nvm-windows::nvm4w-go-module-path
  - id: go-dynamic-shellcode-loader
    desc: Go shellcode loader with dynamic API dispatch
    crit: hostile
    conf: 0.97
    for:
      - pe
    all:
      - id: go-local-shellcode-loader
      - id: micro-behaviors/os/api-resolution/manual::go-syscall-dynamic-api-dispatch
    any:
      - id: metadata/binary/section/entropy::high-entropy-rdata-section
  - id: ror13-rwx-thread-shellcode-loader-x86
    desc: ROR13 shellcode staged in an RWX thread
    crit: hostile
    conf: 0.995
    attack: T1027.002,T1027.007,T1055,T1620
    mbc: B0032
    for:
      - pe
      - dll
    arch:
      - x86
    all:
      - id: objectives/anti-static/obfuscation/imports/api-hashing::ror13-peb-export-resolver-x86
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::shikata-ga-nai-stub
      - id: micro-behaviors/mem/alloc/virtual::virtualalloc-rwx-commit-ror13-x86
      - id: micro-behaviors/process/thread/create::create-thread-buffer-ror13-x86
    unless:
      - id: metadata/installer/product/
  - id: ror13-rwx-thread-shellcode-loader-x64
    desc: Embedded ROR13 shellcode launched from an RWX buffer
    crit: hostile
    conf: 0.995
    attack: T1027.007,T1055,T1620
    mbc: B0032
    for:
      - pe
      - dll
    arch:
      - x86-64
    all:
      - id: objectives/anti-static/obfuscation/imports/api-hashing::ror13-peb-export-resolver-x64
      - id: metadata/binary/instruction/call::x64-reg-40-3000-zero-call-memory
      - id: micro-behaviors/process/thread/create::create-thread-buffer-import-x64-stack-args
    unless:
      - id: metadata/installer/product/
  - id: encrypted-manual-export-thread-loader
    desc: Encrypted manual-export loader that allocates memory and starts a thread
    crit: hostile
    conf: 0.99
    for:
      - pe
      - dll
    arch:
      - x86-64
    attack: T1027.013,T1055
    all:
      - id: micro-behaviors/os/api-resolution/manual::x64-pe-export-directory-walk
      - id: micro-behaviors/crypto/decrypt/transform/symmetric::x64-xxtea-decrypt-round
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/process/thread/create::create-thread
  - id: x86-tea-payload-self-injection-loader
    desc: x86 TEA payload decrypted and executed in-process
    crit: hostile
    conf: 0.98
    for:
      - pe
      - dll
    arch:
      - x86
    attack: T1027,T1055,T1620
    all:
      - id: micro-behaviors/crypto/symmetric/xxtea::x86-tea-round-mix
      - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-text-pe
      - id: metadata/binary/instruction/sequence/unspecified::x86-global-pointer-indirect-call
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/installer/product/
