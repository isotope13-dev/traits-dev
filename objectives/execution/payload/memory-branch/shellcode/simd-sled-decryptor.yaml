# Position-independent x86 shellcode stub interleaved with SIMD short-jump sleds
# that XOR-decrypts an opaque payload in memory and branches to it via register.
defaults:
  platforms: [windows]
  for: [data]
  size_max: 2000000
  attack: T1027,T1140,T1620
  mbc: B0032

composite_rules:
  - id: simd-junk-sled-xor-decrypt-exec
    desc: SIMD-sled stub XOR-decrypts and calls buffer
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/anti-static/obfuscation/instruction/junk::simd-jump-junk-chain
      - id: micro-behaviors/data/decode/xor/transform::x86-simd-sled-indexed-xor
      - id: metadata/binary/instruction/call::x86-simd-sled-register-call
    any:
      - id: metadata/file/entropy::very-high-entropy-data-file
      - id: metadata/file/entropy::high-overall-entropy-70
