defaults:
  platforms: [unix, windows]
  for: [binaries, scripts]

composite_rules:
  - id: ntdll-remap-shellcode-runner
    desc: NTDLL remap with memory and anti-analysis clues
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/mem/map::ntdll-image-remap-cluster
      - id: objectives/execution/payload/memory-branch/shellcode::shellcode-execution-status
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
    any:
      - id: objectives/anti-analysis/debugger-detect/combined-checks::debugger-and-clock-api-profile
      - id: objectives/anti-analysis/debugger-detect/check::debugger-api
