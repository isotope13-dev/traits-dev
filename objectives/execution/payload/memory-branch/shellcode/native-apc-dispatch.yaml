defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, python, rust]
  crit: component

traits:
  - id: native-apc-allocation-call
    desc: Calls native virtual memory allocation
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|[.:])(Nt|Zw)_?Allocate_?Virtual_?Memory(_?Ex)?$'

  - id: native-apc-memory-write-call
    desc: Calls native virtual memory write
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|[.:])(Nt|Zw)_?Write_?Virtual_?Memory$'
      arg:
        index: 2

  - id: native-apc-queue-call
    desc: Calls native APC queue operation
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|[.:])(Nt|Zw)_?Queue_?Apc_?Thread(_?Ex2?)?$'
      arg:
        index: 1

  - id: native-apc-alert-call
    desc: Calls native alert dispatch
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|[.:])(Nt|Zw)_?Test_?Alert$'

composite_rules:
  - id: source-native-apc-memory-stager
    desc: Source stages memory and dispatches a native APC
    crit: hostile
    conf: 0.96
    attack: T1055.004
    all:
      - id: native-apc-allocation-call
      - id: native-apc-memory-write-call
      - id: native-apc-queue-call
      - id: native-apc-alert-call
    near_bytes: 1024
