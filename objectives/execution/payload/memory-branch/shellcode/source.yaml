# Shellcode staged from source: a payload carried as a byte array, written into
# a page the program then makes executable, and entered through a function
# pointer.
#
# The three steps are the technique. Each one alone is ordinary -- firmware
# tables and test vectors are byte arrays, a JIT asks for executable pages, and
# an FFI trampoline casts a pointer to a function -- but a file that does all
# three is running code it shipped as data, which is what a loader stub is.
#
# Found on `Rust-for-Malware-Development/Custom_Shellcode/calc_shellcode2.rs`,
# fifty-one lines holding `let shellcode: [u8; 215] = [0x48, 0x31, 0xdb, ...]`,
# `VirtualAlloc(..., 0x04)`, `copy_nonoverlapping`, `VirtualProtect(..., 0x40)`
# and `transmute(mem)` -- and scoring nothing at all. The byte-array atom
# existed and was read only by three encrypted-payload composites; there was no
# source-level executable-page atom anywhere in the tree.
#
# Written against the steps rather than a language. The array atom already
# covers C, C++, Go and Rust; the protection constant is the same number in all
# of them; and the entry leg lists the three spellings that actually occur --
# Rust's `transmute`, C's cast to a no-argument function pointer, and handing the
# address to `CreateThread` instead of calling it directly.
defaults:
  platforms: [windows]
  for: [c, cpp, rust, go, csharp]
  attack: T1055,T1027
  mbc: C0007

composite_rules:
  - id: source-embedded-shellcode-stager
    for: [rust, c, go]
    desc: Source stages and runs an embedded payload
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/lang/source/literal/array::portable-hex-byte-array-literal
      - id: micro-behaviors/mem/combined::source-execute-memory-request
    # How the staged page is entered. A variant that adds a fourth way still
    # needs the two `all:` legs, because without them it has nothing to run.
    any:
      - id: micro-behaviors/mem/copy::rust-mem-transmute-call
      - id: metadata/lang/source/syntax/operator::c-noarg-function-pointer-cast
      - id: micro-behaviors/process/thread/create::create-thread-source
    # The three capabilities must describe one staging sequence. Without a
    # locality bound, a large portable library can contribute GUID arrays,
    # unrelated executable-page patching, and an ordinary function-pointer
    # cast from different parts of the file.
    near_bytes: 4096
  - id: source-rx-thread-shellcode
    desc: Source threads a page it made executable
    crit: hostile
    conf: 0.96
    for: [groovy]
    all:
      - id: micro-behaviors/mem/combined::source-execute-memory-request
      - id: micro-behaviors/process/thread/create::create-thread-source
  # Native-APC shellcode staging from Go source: the payload arrives as data
  # (hex string, byte array, or base64), is staged through ntdll's native
  # allocation/protection stubs, and is entered by queueing an APC. Unlike
  # source-embedded-shellcode-stager above, the staging APIs are the Nt*
  # syscalls (not VirtualAlloc/VirtualProtect) and entry is an APC queue (not
  # transmute/cast/CreateThread). Seen in Go loaders that combine
  # hex.DecodeString with NtAllocateVirtualMemory, NtProtectVirtualMemory and
  # NtQueueApcThreadEx against the current thread.
  - id: go-payload-data-indicators
    desc: Go encoded or array payload data
    crit: notable
    conf: 0.9
    for: [go]
    any:
      - id: metadata/lang/encoding/hex::hex-long-hex-string-literal
      - id: metadata/lang/source/literal/array::portable-hex-byte-array-literal
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decoding
  - id: go-native-apc-shellcode-loader
    desc: Go native-APC shellcode staging and execution
    crit: hostile
    conf: 0.97
    attack: T1055.004,T1027
    for: [go]
    all:
      - id: micro-behaviors/process/inject/runtime/call::go-nt-allocate-virtual-memory-wrapper
      - id: micro-behaviors/process/inject/runtime/call::go-nt-protect-virtual-memory-wrapper
      - id: objectives/execution/payload/memory-branch/shellcode::go-payload-data-indicators
    # Entry runs the staged page through the APC queue. The Ex spelling is
    # the one loaders resolve; the plain spelling covers the same primitive.
    any:
      - id: micro-behaviors/process/inject/runtime/call::go-nt-queue-apc-thread-ex-wrapper
      - id: micro-behaviors/process/inject/runtime/call::go-nt-queue-apc-thread-wrapper
      - id: micro-behaviors/process/inject/apc::nt-queue-apc-thread-ex-reference
      - id: micro-behaviors/process/inject/apc::nt-queue-apc-thread-reference
    needs: 1
    # The allocation, protection, payload and queue must describe one staging
    # sequence, not coincidental matches scattered across a large file.
    near_bytes: 4096
