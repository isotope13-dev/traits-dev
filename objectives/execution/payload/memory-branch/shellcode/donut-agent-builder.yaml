defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-donut-create-call
    desc: Python calls Donut payload generation
    if:
      type: symbol
      kind: call
      exact: donut.create

  - id: python-builder-embeds-key-and-callback
    desc: Builder embeds a key and callback
    if:
      type: tree-sitter
      language: python
      query: |
        ((call
          function: (attribute attribute: (identifier) @method)
          arguments: (argument_list
            (keyword_argument name: (identifier) @option value: (string) @params))) @evidence
          (#eq? @method "create")
          (#eq? @option "params")
          (#match? @params "(?i)\\{[\\w.]*?(psk|shared_key|session_key)[\\w.]*\\}")
          (#match? @params "(?i)\\{[\\w.]*?(urls?|endpoint|callback|listeners?)[\\w.]*\\}"))

composite_rules:
  - id: python-donut-keyed-remote-agent-builder
    desc: Python builds a native agent stage containing a key and callback
    crit: hostile
    conf: 0.97
    attack: T1620
    near_bytes: 300
    all:
      - id: python-donut-create-call
      - id: python-builder-embeds-key-and-callback
