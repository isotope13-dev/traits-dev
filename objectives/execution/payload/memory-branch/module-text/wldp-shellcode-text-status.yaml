defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: wldp-shellcode-text-status
    desc: WLDP shellcode and text-section clues
    crit: suspicious
    attack: T1055.013
    conf: 0.995
    arch: [x86-64]
    size_max: 5242880
    all:
      - id: objectives/execution/payload/memory-branch/shellcode::rwx-shellcode-status-text
      - id: objectives/execution/payload/memory-branch/module-text::shellcode-text-section-status
      - id: micro-behaviors/fs/path/library::windows-lockdown-policy-module
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/installer/product/
