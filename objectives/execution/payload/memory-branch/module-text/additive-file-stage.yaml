defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
  attack: T1620

composite_rules:
  - id: hashed-api-additive-module-code-loader
    desc: Hash-resolved loader decodes and overwrites module code
    crit: hostile
    conf: 0.99
    # The same compact routine resolves APIs, transforms a file buffer,
    # and copies it into a loaded module's code region. Names, hash seeds,
    # additive keys, host product, and payload filenames are not required.
    near_bytes: 768
    all:
      - id: micro-behaviors/os/api-resolution/digest-export/hash::x64-double-add-name-hash
      - id: micro-behaviors/data/encoding/additive::x64-fixed-dword-add-loop
      - id: micro-behaviors/mem/copy::x64-module-code-backward-copy
