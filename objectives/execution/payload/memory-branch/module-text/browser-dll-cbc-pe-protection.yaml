defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: browser-dll-cbc-pe-protection
    desc: Browser DLL CBC PE and protection clues
    crit: suspicious
    conf: 0.88
    all:
      - id: micro-behaviors/fs/path/system/library::windows-browser-runtime-dll-name
      - id: micro-behaviors/mem/combined::cbc-pe-header-protection-api-profile
    any:
      - id: micro-behaviors/process/exit/terminate::corexitprocess-string
