---
defaults:
  platforms:
  - windows
  for:
  - c
  - cpp
  attack: T1055.002
  mbc: E1055
composite_rules:
- id: module-text-shellcode-thread
  desc: Shellcode written into loaded module then threaded
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/dylib/load/source::loadlibrary-winspool
  - id: micro-behaviors/mem/combined::source-rwx-memory-api-call
  - id: micro-behaviors/process/thread/create::create-thread-source
  near_bytes: 1024
- id: winspool-text-shellcode-inject
  desc: winspool.drv text-section shellcode inject
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/lang/source/naming/module::winspool-drv-name
  - id: micro-behaviors/mem/combined::source-rwx-memory-api-call
  - id: micro-behaviors/process/thread/create::create-thread-source
  near_bytes: 512
