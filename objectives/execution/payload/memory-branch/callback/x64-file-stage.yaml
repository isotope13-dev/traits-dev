defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: x64-encrypted-file-locale-callback
    desc: Encrypted file staged as locale callback
    crit: hostile
    conf: 0.98
    attack: T1620,T1106
    all:
      - id: micro-behaviors/process/deploy/callback::x64-rx-buffer-callback-argument
      - id: micro-behaviors/os/sysinfo/platform/locale::enum-date-formats
      - id: micro-behaviors/fs/read/file/handle::read-file
      - id: micro-behaviors/crypto/symmetric/aes/constant::aes-sbox-bytes-pe-rdata
