defaults:
  platforms: [windows]
  for: [text]
  conf: 0.95
  crit: notable

traits:
  - id: autoit-fileinstall-temp
    desc: AutoIt extracts embedded file to temp
    if:
      type: text
      regex: '(?i)\bFileInstall\s*\([^,\n]{1,180},\s*@TempDir\s*&'

  - id: autoit-execute-fragmented-expression
    desc: AutoIt evaluates joined expression fragments
    if:
      type: text
      regex: '(?i)\bExecute\s*\(\s*"[^"\n]{0,80}"(\s*&\s*"[^"\n]{0,80}"){2,4}'

  - id: autoit-native-structure-at-pointer
    desc: AutoIt constructs structure at supplied pointer
    if:
      type: text
      regex: '(?i)\bDllStructCreate\s*\(.{1,140},\s*\$\w+(\s*\[\s*0\s*\])?\s*\)'

  - id: autoit-native-structure-write
    desc: AutoIt writes data to native structure
    if:
      type: text
      regex: '(?i)\bDllStructSetData\s*\(\s*\$\w+\s*,'

  - id: autoit-computed-native-call
    desc: AutoIt computes native call target and types
    if:
      type: text
      regex: '(?i)\bDllCall\s*\(\s*(\w+\s*\([^)\n]{1,80}\)\s*,\s*){3}'

composite_rules:
  - id: autoit-obfuscated-temp-native-loader
    desc: AutoIt stages a temp file and uses obfuscated native buffer calls
    crit: hostile
    conf: 0.97
    near_lines: 16
    all:
      - id: autoit-fileinstall-temp
      - id: autoit-execute-fragmented-expression
      - id: autoit-native-structure-at-pointer
      - id: autoit-native-structure-write
      - id: autoit-computed-native-call
