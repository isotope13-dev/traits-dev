defaults:
  for: [c]
  platforms: [windows]
  attack: T1620
composite_rules:
  - id: desktop-executable-buffer
    desc: Native source combines executable memory and a cast desktop callback
    crit: suspicious
    conf: 0.95
    near_lines: 32
    all:
      - id: micro-behaviors/ui/window/enumerate::enum-desktops-source
      - id: micro-behaviors/process/deploy/callback::desktop-callback-pointer-cast
      - id: micro-behaviors/mem/combined::source-execute-memory-request
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-source
  - id: desktop-rx-buffer-binary
    for: [pe]
    arch: [x86-64]
    desc: Allocated executable buffer dispatched through desktop enumeration
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/process/deploy/callback::x64-rx-desktop-buffer
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
