defaults:
  platforms: [windows]
  for: [pe]
  size_min: 65536
  size_max: 1048576

composite_rules:
  - id: vb6-callwindowproc-wx-section-clues
    desc: VB6 CallWindowProc and writable-code clues
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/lang/runtime::vb6-application-framework
      - id: micro-behaviors/dylib/lookup::vb6-dll-function-call
      - id: micro-behaviors/ui/window/message::call-window-proc
      - id: metadata/binary/section/permission::three-plus-wx-sections
    any:
      - id: metadata/binary/section/permission::executable-rsrc-section
      - id: metadata/binary/section/permission::near-zero-entropy-rwx-section
      - id: objectives/anti-static/obfuscation/imports/concealment::vb6-pcode-concealed-runtime-profile
      - id: micro-behaviors/data/string/runtime::vb6-runtime-string-decoding
    needs: 2
