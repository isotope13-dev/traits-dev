defaults:
  for: [pe]
  platforms: [windows]
  attack: T1105,T1027

composite_rules:
  - id: xor-wininet-pe-downloader
    desc: PE with XOR-decoded WinINet download and ShellExecute APIs
    crit: hostile
    conf: 0.95
    mbc: B0024
    scope: file
    all:
      - id: micro-behaviors/data/bitwise/xor-forms
      - id: micro-behaviors/communications/http/client/wininet
      - id: micro-behaviors/process/create/shell
