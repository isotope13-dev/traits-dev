defaults:
  for: [pe]
  platforms: [windows]
  attack: T1105,T1027

composite_rules:
  - id: xor-wininet-pe-downloader
    desc: PE with XOR-decoded WinINet download and ShellExecute APIs
    crit: hostile
    conf: 0.95
    mbc: B0024
    scope: file
    all:
      - id: micro-behaviors/data/bitwise/xor-forms
      # A WinINet DLL-name or InternetSetOption reference (proxy setup in
      # WebView hosts and VPN clients) is not a download; require the read.
      - id: micro-behaviors/communications/http/client/wininet::internet-read-file
      - id: micro-behaviors/process/create/shell
    # A signed host can carry a self-unpacked member whose XOR loops and
    # update-check reads come from its own code. Let a verified container
    # lower the claim one step.
    downgrade:
      scope: parent
      any:
        - id: metadata/signature/verified/
