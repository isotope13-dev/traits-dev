defaults:
  for: [pe]
  platforms: [windows]
  attack: T1036,T1055
  mbc: B0011

composite_rules:
  - id: trojanized-signed-shellcode-loader
    desc: Tampered signed PE unpacks shellcode with sandbox delay
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: metadata/signature/certificate/integrity::pe-signature-digest-mismatch
      - id: metadata/binary/instruction/operand::x64-bts-r8-12-r9-6-shellcode-rwx
      - id: objectives/anti-analysis/timing/evasion::rdtscp-kuser-tick-sandbox-delay
      - id: metadata/binary/section/layout::dominant-low-entropy-writable-data-layout
