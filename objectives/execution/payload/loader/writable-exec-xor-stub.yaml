defaults:
  for: [pe]
  platforms: [windows]
  attack: T1027,T1620

composite_rules:
  - id: writable-exec-xor-return-stub
    desc: PE with writable executable section and inline XOR-decode stub
    crit: hostile
    conf: 0.95
    mbc: B0011
    scope: file
    all:
      - id: metadata/binary/section/permission::writable-text-section
      - id: micro-behaviors/data/decode/xor/feedback::x86-callpop-inline-xor-return
      - id: metadata/binary/instruction/opcode::pe-entrypoint-immediate-ret
