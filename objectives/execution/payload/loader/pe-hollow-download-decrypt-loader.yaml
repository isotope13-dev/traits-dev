# PE that reads a remote blob, decrypts it with BCrypt, and runs it by writing
# into a suspended thread's context. Each leg is a separate capability. Their
# file-level co-occurrence is the loader claim: the remote blob is the payload
# the hollow runs.
defaults:
  for: [pe]
  platforms: [windows]
  attack: T1055.012

composite_rules:
  - id: pe-hollow-download-decrypt-loader
    desc: Downloads, decrypts, and hollows a remote payload
    crit: hostile
    conf: 0.93
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/wininet::internet-read-file
      - id: micro-behaviors/crypto/decrypt/transform/call::bcrypt-decrypt-api
      - id: micro-behaviors/process/info/thread::thread-context-write-resume-import-profile
