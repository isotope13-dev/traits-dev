defaults:
  for: [pe]
  platforms: [windows]
  attack: T1055,T1620

composite_rules:
  - id: dotnet-xor-assembly-loader
    desc: .NET PE with repeating-key XOR decoder and Assembly.Load
    crit: hostile
    conf: 0.95
    mbc: B0011
    scope: file
    all:
      - id: micro-behaviors/data/encoding/xor/cyclic-key
      - id: micro-behaviors/process/interpreter/runtime/clr
      - id: micro-behaviors/metaprogramming/reflection/resolve::assembly-load
