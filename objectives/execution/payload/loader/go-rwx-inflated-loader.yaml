defaults:
  for: [pe]
  platforms: [windows]
  attack: T1055,T1027.001

composite_rules:
  - id: go-rwx-inflated-loader
    desc: Bloated Go PE with RWX allocation and dynamic Proc.Call
    crit: hostile
    conf: 0.95
    mbc: B0011
    scope: file
    all:
      - id: metadata/lang/compiler/systems::go-pe-rich-symbols
      - id: metadata/binary/section/ratio::inflated-data-section
      - id: micro-behaviors/os/api-resolution/dynamic::go-syscall-proc-call
      - id: micro-behaviors/mem/combined::rwx-flag-or-argument-patterns
