defaults:
  for: [pe]
  platforms: [windows]
  attack: T1055,T1620

composite_rules:
  - id: native-clr-bytearray-loader
    desc: Native PE decodes resource and loads CLR byte-array assembly
    crit: suspicious
    conf: 0.95
    mbc: B0011
    scope: file
    all:
      - id: micro-behaviors/process/interpreter/runtime/clr::native-appdomain-load-byte-array
      - id: micro-behaviors/data/decode
      - id: metadata/binary/resource
