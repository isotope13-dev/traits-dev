defaults:
  for: [pe]
  platforms: [windows]
  attack: T1620,T1055

composite_rules:
  - id: reflective-pe-reloc-loader
    desc: PE with VirtualProtect RX, relocation dispatch, and export walk
    crit: hostile
    conf: 0.95
    mbc: B0011
    scope: file
    all:
      - id: micro-behaviors/mem/protect/modify/executable::x86-rx-protect-buffer-then-call
      - id: micro-behaviors/data/format/pe-parser::x86-base-relocation-type-dispatch
    any:
      - id: micro-behaviors/os/api-resolution/digest-export/walk::pe-export-directory-walk-x86
      - id: micro-behaviors/os/api-resolution/digest-export/walk::checked-pe-export-directory-walk-x86
