# Compiled .NET dropper: reads its own image, Base64-decodes and AES-decrypts
# embedded blobs, writes the plaintext to a temp path, launches it, then kills
# itself. The C# source rule (csharp-self-decrypted-pe32) needs source text, so a
# compiled or VB.NET build is blind to it. These legs are IL call facts, which
# survive compilation. Each leg is common alone; the self-read, decrypt, write,
# launch, and self-kill chain in one PE is the dropper.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027,T1059

traits:
  - id: dotnet-base64-decode-call
    desc: .NET Base64 decode call
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '(^|\.)Convert\.FromBase64String$'

  - id: dotnet-file-write-bytes-call
    desc: .NET WriteAllBytes file write call
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(File|FileSystemProxy)\.WriteAllBytes$'

  - id: dotnet-process-kill-call
    desc: .NET Process.Kill call
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '(^|\.)Process\.Kill$'

composite_rules:
  - id: dotnet-self-decrypt-drop-launch
    desc: Compiled .NET dropper decrypts own image blobs and launches them
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/process/info/selfpath::managed-executable-path-getter
      - id: dotnet-base64-decode-call
      - id: micro-behaviors/crypto/decrypt/initialize::csharp-create-decryptor-symbol
      - id: dotnet-file-write-bytes-call
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start-call
      - id: dotnet-process-kill-call
