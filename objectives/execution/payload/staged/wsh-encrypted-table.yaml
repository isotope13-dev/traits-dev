# Arithmetic and alphabet shuffling conceal every COM ProgID and method name.
# Require independent payload, decode, dispatch, host and script-quoting roles.
# This detects the loader, without attributing the decrypted RAT's family.
defaults:
  platforms: [windows]
  for: [javascript]
composite_rules:
  - id: wsh-encrypted-table-script-stage
    desc: WSH script stage with encrypted shards and concealed method dispatch
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.007
    all:
      - id: micro-behaviors/os/com/runtime::wscript-root-return
      - id: metadata/lang/source/literal/string/population::js-custom-alphabet-shards
      - id: micro-behaviors/data/control-flow/dispatch/computed::js-nested-table-method-calls
      - id: micro-behaviors/data/string/sanitize::js-double-single-quotes
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::indexed-xor-array-assignment
