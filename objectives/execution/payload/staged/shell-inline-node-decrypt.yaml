# A shell script reads ciphertext out of a hidden entry under /usr, decrypts
# it with an inline `node -e` program, and starts the result detached with
# its output discarded. Each step is ordinary alone; together they are a
# loader whose payload is never on disk in clear until the moment it runs.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1140,T1027.013

composite_rules:
  - id: shell-node-decrypt-hidden-payload-launch
    desc: Shell decrypts a hidden /usr payload via inline node and runs it detached
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/crypto/decrypt/initialize::shell-inline-node-decipher
      - id: micro-behaviors/fs/path/system/directory::usr-data-dir-hidden-entry
      - id: micro-behaviors/process/daemonize/detach::nohup-hidden-output
