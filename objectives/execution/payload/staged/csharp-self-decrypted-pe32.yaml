defaults:
  platforms: [windows]
  for: [csharp]

traits:
  - id: csharp-self-decrypted-pe32-handoff
    desc: Decrypts and hands off embedded PE stage
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule csharp_self_decrypted_pe32_handoff {
          strings:
            $read = "File.ReadAllText(Application.ExecutablePath)"
            $decode = "Convert.FromBase64String(strArray[1])"
            $handoff = "PE32.PhysicalEducation(data, Application.ExecutablePath)"
            $decrypt = "rijndaelManaged.CreateDecryptor().TransformFinalBlock"
            $kill = "Process.GetCurrentProcess().Kill()"
            $hidden = "this.Opacity = 0.0"
          condition:
            all of them and @read < @decode and @decode < @handoff and
            @handoff < @kill and @kill < @decrypt
        }
