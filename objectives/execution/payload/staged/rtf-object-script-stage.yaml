defaults:
  platforms: [windows]
  for: [rtf]
  attack: T1204.002,T1059

traits:
  # The command line an exploit object runs once it loads, recovered from
  # the decoded `\objdata` strings: `cmd /c` handing a URL to PowerShell,
  # mshta, certutil or bitsadmin. msiexec is covered by the installer rule.
  - id: rtf-object-cmd-lolbin-url
    desc: Object text pipes cmd into URL downloader
    crit: suspicious
    conf: 0.93
    attack: T1105,T1059.003
    if:
      type: text
      regex: '(?i)cmd(\.exe)?[ &]{1,4}/c .{0,60}(powershell|mshta|certutil|bitsadmin).{0,200}https?://'

composite_rules:
  # Object Packager writes its file to the temp directory as the object
  # loads; a packaged script plus `\objupdate` stages a script for a
  # second object, or the user, to run.
  - id: rtf-autoload-package-script-file
    desc: Auto-updated Package object carries a script
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/document/rtf/ole::package-class-hex
      - id: metadata/document/rtf/ole::script-filename-hex
      - id: metadata/document/rtf/ole::objupdate

  - id: rtf-autoload-object-download-command
    desc: Auto-updated object runs a download command
    crit: hostile
    conf: 0.95
    attack: T1105,T1203
    all:
      - id: rtf-object-cmd-lolbin-url
      - id: metadata/document/rtf/ole::objupdate
      - id: metadata/document/rtf/ole::object-control-feature
