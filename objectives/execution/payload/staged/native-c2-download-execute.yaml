defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: native-download-execute-status
    desc: Native download and execute status
    crit: notable
    if:
      type: text
      regex: '(?i)\bDownloading and executing file (from|via)\b'

composite_rules:
  - id: native-c2-download-execute
    desc: Native C2 client downloads and executes files
    crit: hostile
    conf: 0.99
    attack: T1105
    all:
      - id: native-download-execute-status
      - id: objectives/command-and-control/beacon/network/tcp::native-c2-attack-command-client
      - id: micro-behaviors/process/create/subprocess/reference::create-process-a-api-reference
