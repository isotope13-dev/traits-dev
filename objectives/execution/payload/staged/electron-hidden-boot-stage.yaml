# A trojanized Electron entry bundle suppresses every window before the
# legitimate application bundle loads, then side-effect requires a sibling
# module at the top of the entry file. Either alone has legitimate uses
# (portable helpers stub nothing; tests stub without side-effect loader
# requires); together they describe a concealed boot stage.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1564.003

composite_rules:
  - id: electron-hidden-boot-stage
    desc: Electron hides windows, boots sibling script
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/ui/window/electron::electron-visibility-prototype-suppressed
      - id: micro-behaviors/os/module/load/name::cjs-side-effect-local-require
