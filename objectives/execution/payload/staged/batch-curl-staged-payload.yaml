# Batch script downloads a staged executable payload to temp and executes it,
# combined with evasion (self-delete), persistence (Run key), or process termination.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1105,T1059.003
  mbc: B0024

composite_rules:
  - id: batch-curl-staged-payload-loader
    desc: Batch downloads and launches staged payload
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/download/curl::batch-curl-download-to-temp
      - id: micro-behaviors/process/create/path-execution::start-executable-command
    any:
      - id: micro-behaviors/os/registry/autostart/write::batch-reg-add-run-key-direct
      - id: micro-behaviors/fs/delete/file/self::batch-self-delete
      - id: micro-behaviors/process/terminate/command::batch-taskkill-image-name
