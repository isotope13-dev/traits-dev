defaults:
  platforms: [windows]
  for: [jpeg, text]
  size_min: 100000

traits:
  - id: hex-wrapped-notepad-loader-call
    desc: Hex-wrapped Mice Notepad loader call
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: "5B-4D-69-63-65-5D-3A-3A-59-55-28-27-6E-6F-74-65-70-61-64-2E-65-78-65-27-2C-24-4D-4E-42-32-32-29"
  - id: hex-wrapped-gzip-stage-call
    desc: Hex-wrapped decompression stage call
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: "24-4D-4E-42-32-32-3D-20-75-4F-58-43-64-6C-42-4B-20-24-4D-4E-42-32"

composite_rules:
  - id: hex-wrapped-gzip-notepad-loader
    desc: Hex-wrapped gzip stage targets Notepad
    crit: hostile
    conf: 0.99
    all:
      - id: hex-wrapped-notepad-loader-call
      - id: hex-wrapped-gzip-stage-call
