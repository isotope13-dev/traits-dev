# A small single-line Node script whose every string sits in custom-alphabet
# tables, leaving only the child_process/fs/os module names readable: a
# concealed host-command stage, not a shipped library bundle.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: string-locked-node-exec-stage
    desc: String-locked Node stage exposing only exec, fs and os
    crit: hostile
    conf: 0.9
    attack: T1027.013,T1059.007
    size_max: 262144
    all:
      - id: objectives/anti-static/obfuscation/string/encoding::js-custom-alphabet-string-tables
      - id: metadata/build/bundler/wrapper::obfuscated-key-module-child-process-export
      - id: metadata/file/text-distribution::near-zero-whitespace-source
