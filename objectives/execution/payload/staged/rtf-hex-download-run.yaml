# A document's hex buffer (shape value, object data) carrying both a URL
# and a `cmd /c` command line: the fetch-and-run stage of an exploit
# document, readable without decoding any code.
defaults:
  platforms: [windows]
  for: [rtf]
  attack: T1105,T1059.003

composite_rules:
  - id: rtf-hex-buffer-fetch-and-run
    desc: RTF hex hides URL and shell command
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/lang/encoding/hex::rtf-hex-cmd-run-switch
      - id: metadata/lang/encoding/hex::rtf-hex-http-url
