defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: extracted-resource-archive-child-launcher
    desc: PE extracts an archive and launches a child
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/binary/resource/embedded-media::zip-local-signatures-pe
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: micro-behaviors/fs/attributes/flags::set-file-attributes-w
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
