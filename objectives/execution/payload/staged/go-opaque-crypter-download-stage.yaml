defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027,T1105,T1059
  mbc: B0032,E1105

composite_rules:
  - id: go-opaque-crypter-download-stage
    desc: Opaque Go crypter stages encrypted payload and downloads PE
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/compiler/systems::go-opaque-module-path
      - id: metadata/lang/compiler/systems::go-opaque-build-path
      - id: metadata/file/encoding/hex::pe-rdata-lowercase-hex64
      - id: metadata/binary/section/entropy::large-writable-data-entropy-78
      - id: micro-behaviors/data/decompress/zstd::go-zstd-decoder-pclntab
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe
      - id: micro-behaviors/communications/http/get::go-native-http-get-reference
      - id: micro-behaviors/process/create/runtime-symbol::go-cmd-start-method-symbol
    unless:
      - id: metadata/installer/product/
      - id: metadata/signature/verified/
