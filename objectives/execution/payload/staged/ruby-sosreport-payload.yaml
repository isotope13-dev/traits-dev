defaults:
  for: [ruby]
  platforms: [linux]
traits:
  - id: ruby-sosreport-stages-exploit-and-payload
    desc: Stages privilege exploit and payload
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule ruby_sosreport_stages_exploit_and_payload {
          strings:
            $module = "Msf::Exploit::Local"
            $read = "'cve-2015-5287', 'sosreport-rhel7.py'"
            $write = "write_file path, data"
            $chmod = "chmod path"
            $exploit = "upload_and_chmodx exe_path, exe_data"
            $payload = "upload_and_chmodx payload_path, generate_payload_exe"
          condition:
            all of them
        }
