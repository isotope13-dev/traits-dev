defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-war-jsp-backdoor-packaging
    desc: Packages configured JSP backdoor into WAR
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule ruby_war_jsp_backdoor_packaging {
          strings:
            $module = "module GodOfWar"
            $read = "payload_raw = File.read(payload_file)"
            $write = "File.write(File.join(@output, \"#{@output}.jsp\"), payload_raw)"
            $web = "<jsp-file>/#{@output}.jsp</jsp-file>"
            $zip = "Zip::File.open(final_war, Zip::File::CREATE)"
            $reverse = "payload = 'reverse_shell_ui'"
          condition:
            all of them
        }
