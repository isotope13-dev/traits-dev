# Shell fetches a second stage from a very long random-label hostname into a
# hidden dotfile under /tmp, /var/tmp or /dev/shm and runs it with an
# interpreter. The existing hidden-temp-dotfile composite needs an IP-hosted or
# probed source; this one covers the dynamic-DNS C2 hostname form.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1105,T1059.004,T1564.001
  mbc: B0024

composite_rules:
  - id: random-host-hidden-temp-stage-exec
    desc: Runs hidden temp stage from random-label host
    crit: hostile
    conf: 0.96
    near_lines: 12
    all:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::download-to-hidden-temp-dotfile
      - id: micro-behaviors/process/create/path-execution::hidden-temp-dotfile-execution
      - id: micro-behaviors/communications/url/host/label::long-alphanumeric-third-level-label
