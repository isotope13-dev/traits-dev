# Native counterpart of dotnet-self-decrypt-drop-launch: a compiled stub keeps
# executables as one large encrypted blob in its writable data, imports an AES
# key through CryptoAPI, decrypts each blob, writes the plaintext under the
# temp directory and starts it with ShellExecute. The decrypted programs are
# invisible to static scanning, so the stub's own chain is the evidence. Each
# leg is common alone; a big high-entropy data section beside CryptoAPI key
# import and decryption, a temp-path write and a shell launch is a dropper.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1140,T1204.002
composite_rules:
  - id: native-self-decrypt-drop-launch
    desc: Native stub decrypts an embedded executable blob, drops and launches it
    crit: hostile
    conf: 0.9
    scope: file
    size_min: 1048576
    all:
      - id: metadata/binary/section/entropy::large-high-entropy-writable-payload-section
      - id: micro-behaviors/crypto/provider/cryptoapi::capi-key-buffer-api-profile
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-import
      - id: micro-behaviors/os/handler/open::shell-execute-a
    any:
      - id: micro-behaviors/fs/write/file/handle/call::write--fwrite
      - id: micro-behaviors/fs/write/file/handle/call::write-file
    unless:
      - id: metadata/installer/product/
