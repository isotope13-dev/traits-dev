# A managed stub carries a large initialized byte array, decodes it, allocates
# memory, changes its protection, and starts a thread at the buffer. The array
# size and API-name evidence are static markers; the sample's method body was
# separately traced to confirm the copy, protection change, and thread start.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1620,T1027

traits:
  - id: dotnet-large-static-array-marker
    desc: Large .NET static array marker
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '__StaticArrayInitTypeSize=[1-9][0-9]{4,}'

composite_rules:
  - id: dotnet-static-shellcode-loader
    desc: Runs a static payload from protected memory
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-string
      - id: micro-behaviors/mem/protect/modify::virtual-protect-text-pe
      - id: micro-behaviors/process/threading/create::create-thread-text
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: dotnet-large-static-array-marker
    unless:
      - id: metadata/signed/platform/
      - id: objectives/anti-static/obfuscation/obfuscator/managed/
      - id: metadata/build/protector::smartassembly-or-poweredby-build-markers
      - id: metadata/build/protector::dotnet-reactor-module-guid-type
