defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.003,T1620
composite_rules:
  - id: bitmap-pe-appdomain-vb-dispatch
    desc: Bitmap PE with sized helper and VB dispatch
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/embedded/payload/image::bmp-rgb-column-pe-header
      - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-resource-pixel-api-references
      - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-currentdomain
      - id: micro-behaviors/process/interpreter/reflection/runtime::gettypes-member-token
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-latecall-token
      - id: metadata/binary/instruction/sequence::cil-sized-helper-to-virtual-call-sequence
  # Both variants reconstruct an assembly from bitmap columns. Activation
  # uses AppDomain.Load through VB late binding or CallByName; Activator in
  # unrelated form-management code is not evidence for this payload path.
  - id: bitmap-pe-reflective-dispatch
    desc: Bitmap-concealed PE reaches managed dispatch
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/steganography/image::dotnet-bitmap-column-pe-concealment
      - id: metadata/binary/instruction/sequence::cil-helper-array-call-cast
    any:
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-callbyname-token
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-latecall-token
      - id: micro-behaviors/metaprogramming/reflection::invoke-member-token
    unless:
      - id: metadata/signed/platform/

  - id: bitmap-pe-invokemember-vb-dispatch
    desc: Bitmap-concealed assembly reaches VB late-bound invocation
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/steganography/image::bitmap-pe-invokemember-exportedtypes-concealment
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-latecall-token

  - id: bitmap-pe-static-load-dispatch
    desc: Bitmap-concealed PE with sized helper reaches VB dispatch
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/steganography/image::dotnet-bitmap-column-pe-concealment
      - id: micro-behaviors/data/control-flow/sequence::cil-sized-helper-load-type-array
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-latecall-token
    unless:
      - id: metadata/signed/platform/

  - id: bitmap-pe-vb-appdomain-dispatch
    desc: Bitmap-concealed PE reaches VB late binding in AppDomain
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/steganography/image::dotnet-bitmap-column-pe-concealment
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-latecall-token
      - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-currentdomain
    unless:
      - id: metadata/signed/platform/

  - id: bitmap-pe-vb-reflective-dropper
    desc: Bitmap-concealed PE with VB reflective dropper chain
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/steganography/image::dotnet-bitmap-column-pe-concealment
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-latecall-token
      - id: micro-behaviors/metaprogramming/reflection::dotnet-reflection-invoke-references
    unless:
      - id: metadata/signed/platform/
