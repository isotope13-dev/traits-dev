# Application stub that decrypts an embedded DEX from assets and splices it into
# the running classloader while spelling the classloader names out as int arrays
# (dalvik.system.*, pathList, dexElements). The names are hidden on purpose, so
# the usual descriptor- and field-name loader rules cannot see this variant. A
# host app has no reason to hide these names from its own constant pool.
defaults:
  platforms: [android]
  for: [dex]
  attack: T1406,T1027.002,T1129
  mbc: B0030

composite_rules:
  - id: int-array-name-asset-dex-loader
    desc: Application stub decrypts asset DEX with int-array classloader names
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/anti-static/obfuscation/string/array::dex-int32-classloader-names
      - id: micro-behaviors/process/lifecycle/initialize::attach-base-context
      - id: micro-behaviors/data/embedded/resource::dex-android-asset-open-call
      - id: micro-behaviors/crypto/decrypt/initialize::dex-cipher-decrypt-mode-init-call
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::dex-reflective-field-write-call
