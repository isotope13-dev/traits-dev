# Android staged loader using a hidden asset DEX and reflective classloader patching.
defaults:
  platforms: [android]
  for: [apk, zip]
  crit: suspicious
  conf: 0.95
  attack: "T1406"

composite_rules:
- id: staged-dex-loader
  desc: APK hides and loads a second-stage DEX from assets
  crit: hostile
  conf: 0.995
  mbc: "B0030"
  all:
  - id: micro-behaviors/os/module/load/class::reflective-classloader-patch
  - id: metadata/file/profile/android-asset-context::android-hex-dex-file-write-clues

  # The same objective as `staged-dex-loader` reached a different way, which is
  # why that rule does not cover these: it requires the classic
  # BaseDexClassLoader / dexElements / pathList patching triad, and this variant
  # never touches dexElements. It copies a payload out of the APK's own assets
  # into the app's private files directory and then swaps the thread context
  # classloader to pick it up, with setAccessible() clearing the way.
  #
  # Reading assets, writing to getFilesDir() and using a ClassLoader are each
  # ordinary on their own -- plugin hosts and dynamic-feature apps do all three.
  # What is not ordinary is doing them together *and* reaching through
  # reflection to defeat member visibility while re-pointing the loader: a
  # legitimate dynamic-feature app uses the framework's own APIs and has no
  # reason to bypass access checks to install its code path.
  # The `any:` group is what makes the claim checkable. Every `all:` leg is a
  # plain substring hit in the merged DEX -- `getAssets`, `getFilesDir`,
  # `Ljava/io/FileOutputStream;`, `setContextClassLoader`, `Ljava/lang/ClassLoader;`
  # and `setAccessible` -- and a DEX pools the strings of the app *and every
  # bundled library* into one sorted table, so co-presence says nothing about
  # whether one class does all six (and byte proximity is meaningless there).
  # Gson or Retrofit supplies `setAccessible`, any library supplies the rest.
  # Eleven of the corpus's Android samples matched on that alone: Mullvad VPN,
  # NewPipe, RustDesk, shadowsocks-android, SD Maid SE and friends -- none of
  # which referenced a single dynamic-code-loading API. "Swaps the classloader
  # to pick the payload up" requires a class that can load a DEX; if none of
  # these is present, no staged code can be loaded and the objective is unmet.
- id: asset-staged-context-classloader-loader
  for: [apk, zip, dex]
  desc: APK asset staging accompanies classloader replacement
  crit: suspicious
  conf: 0.97
  mbc: "B0030"
  unless:
  - id: well-known/lib/vendor-sdk/google-mobile-ads/
  all:
  - id: micro-behaviors/data/embedded/resource::dalvik-get-assets-reference
  - id: micro-behaviors/fs/path/app-data/platform::dalvik-get-files-dir-reference
  - id: micro-behaviors/fs/write/file/stream::dalvik-file-output-stream-class
  - id: micro-behaviors/os/module/load/class::android-context-classloader-setter
  - id: micro-behaviors/os/module/load/class::dalvik-classloader-descriptor
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::reflective-access-bypass
  - id: micro-behaviors/os/module/load/class::dynamic-dex-loading-api

- id: android-staged-classloader-socket
  desc: Staged classloader implant opens a socket
  crit: suspicious
  conf: 0.96
  scope: outer
