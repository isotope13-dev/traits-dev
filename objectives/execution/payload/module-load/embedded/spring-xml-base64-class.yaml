# Spring XML carrying a compiled Java class as a Base64 bean value and
# defining it through SpEL: the configuration file is the class loader's
# payload container, and activating the context loads the embedded code.
defaults:
  platforms: [unix, windows]
  for: [xml]
  attack: T1620,T1027

composite_rules:
  - id: spring-xml-embedded-classfile-load
    desc: Spring XML loads an embedded Java classfile
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/execution/interpreter/document/xml::xml-spring-beans-namespace
      - id: micro-behaviors/data/embedded/classfile::base64-java-classfile
      - id: objectives/execution/interpreter/document/xml::xml-spel-define-class
