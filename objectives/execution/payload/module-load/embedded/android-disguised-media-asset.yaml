defaults:
  platforms: [android]
  for: [apk, zip]
  crit: suspicious
  conf: 0.95

traits:
- id: android-asset-media-path
  desc: Media file path under Android assets directory
  crit: notable
  conf: 0.95
  for: [png, jpeg, webp, gif]
  if:
    type: path
    regex: '(^|[\\/])assets[\\/]'

composite_rules:
- id: android-opaque-media-asset
  desc: Opaque blob under a media name in Android assets directory
  crit: notable
  conf: 0.95
  for: [png, jpeg, webp, gif]
  all:
  - id: android-asset-media-path
  - id: objectives/evasion/masquerade/extension-mismatch::media-named-file-is-opaque-blob

- id: android-disguised-media-asset-reflective-loader
  desc: Opaque media-named asset beside reflection, cipher and file-write references
  crit: suspicious
  conf: 0.99
  attack: "T1036.008"
  mbc: "B0030"
  for: [apk, zip, dex, media]
  scope: outer
  all:
  - id: android-opaque-media-asset
  - id: micro-behaviors/data/embedded/resource::dalvik-get-assets-reference
  - id: micro-behaviors/fs/write/file/stream::dalvik-file-output-stream-class
  - id: micro-behaviors/crypto/provider/library::android-cipher-class
  - id: metadata/binary/symbols/name/token/execution::invoke-word-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::reflective-access-bypass

  # Android Meterpreter-style stager: the app keeps the device awake, connects
  # out or listens on a socket, and loads whatever DEX the operator streams
  # back with DexClassLoader. Renamed packages keep this API set. Ads SDKs,
  # media WakeLocks, and an in-app FTP server place the same four references
  # in a multidex blob; that co-occurrence is not a streamed stager. The
  # stager claim is the compact dex.
