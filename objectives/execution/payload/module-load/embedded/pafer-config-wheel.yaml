defaults:
  platforms: [unix, windows]
  for: [whl, python, pkginfo]
  attack: T1195.002,T1059.006
  mbc: E1059

composite_rules:
  - id: pypi-wheel-embedded-xz-pafer-config-execution
    desc: Wheel bundles XZ-compressed pafer config payload and loads at import
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/files/wheel-sdist::wheel-package-config-member
      - id: micro-behaviors/data/embedded/payload/compression::xz-stream-magic-in-archive-container
      - id: objectives/supply-chain/hidden-payload/package::python-pafer-import-time-config-bootstrap
