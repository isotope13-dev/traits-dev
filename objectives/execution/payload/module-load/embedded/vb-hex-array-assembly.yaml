# VB source that carries a PE image as a hex byte-array literal and loads
# managed code with Assembly.Load: an in-memory plugin/payload loader that
# never writes the embedded module to disk.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1620

composite_rules:
  - id: vb-embedded-pe-array-assembly-load
    desc: VB loads assembly with embedded PE byte array
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/data/embedded/payload/array::embedded-pe-in-vb-hex-array
      - id: micro-behaviors/metaprogramming/reflection/resolve::assembly-load-text
