# A decrypt-named Python routine that loads a module from a file path and
# executes it is a staged loader: the executed module is a payload carried
# beside the loader and unpacked at run time. The decrypt name is the
# intent leg. An importlib file-spec load alone is a plugin mechanism and
# stays notable on its own.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1027,T1059.006

composite_rules:
  - id: python-sibling-decrypt-module-loader
    desc: Decrypt-named routine loads and executes a file-path module
    crit: hostile
    conf: 0.9
    scope: file
    unless:
      - id: metadata/path/directory::test-directory-component
    all:
      - id: metadata/lang/source/naming/function/cryptography::python-decrypt-named-function
      - id: micro-behaviors/os/module/load/path::python-importlib-spec-exec-module
