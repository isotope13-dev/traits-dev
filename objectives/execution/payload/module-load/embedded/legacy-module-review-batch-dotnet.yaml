defaults:
  platforms: [windows]
  for: [batch]
  mbc: B0024
composite_rules:
- id: batch-hidden-self-read-dotnet-stage
  desc: Hidden batch invokes staged .NET entry point
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.001,T1620
  scope: file
  near_bytes: 2500
  all:
  - id: objectives/execution/payload/file-exec/command/batch::powershell-reads-own-batch-content
  - id: metadata/lang/source/syntax/array::ps-final-line-index
  - id: micro-behaviors/os/module/load/memory::batch-assembly-byte-load
  - id: micro-behaviors/metaprogramming/reflection/invoke::batch-assembly-entrypoint-invoke
  - id: micro-behaviors/metaprogramming/generation/compile::batch-add-type-source-compile
  - id: micro-behaviors/data/decode/charset::powershell-utf8-getstring
  - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-argument
  - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
- id: batch-hidden-reversed-gzip-appdomain-entrypoint-loader
  desc: Hidden batch invokes reversed embedded .NET stage
  crit: hostile
  conf: 0.995
  attack: T1027,T1059.001,T1059.003,T1140,T1564.001,T1564.003,T1620
  scope: file
  all:
  - id: micro-behaviors/fs/path/script::batch-self-derived-filename
  - id: micro-behaviors/fs/file/copy/source-destination::windows-copy-command
  - id: micro-behaviors/fs/path/application/interpreter::syswow64-powershell-path
  - id: micro-behaviors/fs/file/attributes::attrib-hidden-system
  - id: micro-behaviors/data/encode/payload::batch-gzip-base64-carrier
  - id: metadata/file/line::last-line-over-1000
  - id: micro-behaviors/data/decode/base64/unspecified::powershell-frombase64string
  - id: micro-behaviors/data/codec::powershell-gzipstream
  - id: micro-behaviors/data/decompress/stream::powershell-compressionmode-decompress
  - id: micro-behaviors/data/collection/array::powershell-array-reverse-call
  - id: micro-behaviors/os/module/load/memory::powershell-appdomain-load-variable
  - id: micro-behaviors/metaprogramming/reflection/invoke::powershell-entrypoint-delegate-dispatch
  - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
