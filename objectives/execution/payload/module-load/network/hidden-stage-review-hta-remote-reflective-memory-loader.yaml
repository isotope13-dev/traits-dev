defaults:
  platforms: [windows]
  for: [html, scripts, documents]

composite_rules:
- id: hta-remote-reflective-memory-loader
  for: [javascript, vbs, html]
  desc: HTA downloads bytes and reflectively loads a .NET assembly in memory
  crit: hostile
  conf: 0.99
  attack: T1047,T1059.001,T1105,T1140,T1620,T1564.003
  all:
    - id: micro-behaviors/os/env/write::hta-wscript-user-environment-clues
    - id: micro-behaviors/process/interpreter/eval/source::powershell-iex-env-command
    - id: micro-behaviors/communications/http/client/webclient::net-webclient-object
    - id: micro-behaviors/communications/http/client/webclient::webclient-download-data
    - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
    - id: micro-behaviors/metaprogramming/reflection/invoke::hta-appdomain-reflection-clues

