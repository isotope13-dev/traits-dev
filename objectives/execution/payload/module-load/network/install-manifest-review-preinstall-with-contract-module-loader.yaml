defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: preinstall-with-contract-module-loader
    desc: Node preinstall with contract module loader
    crit: hostile
    conf: 0.99
    for: [npm, tar, package.json, javascript, typescript]
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
      - id: objectives/execution/payload/module-load/network::contract-base64-module-bootstrap
