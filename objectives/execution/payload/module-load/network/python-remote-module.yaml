defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1105,T1059.006
  mbc: B0024,E1059

composite_rules:
  - id: python-remote-module-tempdir-stager
    desc: Stages fetched Python module in hidden tempdir and runs it
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/process/interpreter/eval/constructed::python-remote-source-module-loader
      - id: micro-behaviors/fs/path/hidden::python-path-join-dot-prefix
      - id: micro-behaviors/os/env/read/variable::python-os-getenv-call
      - id: micro-behaviors/process/interpreter/eval/constructed::python-getattr-mod-run-main-fallback

  - id: python-split-module-spec-subprocess-stager
    desc: Split-module package fetches script and runs jobmod child
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/lang/source/syntax/call/invocation::python-private-url-argument-call
      - id: micro-behaviors/process/interpreter/eval/constructed::python-spec-from-file-location-jobmod-bootstrap
      - id: micro-behaviors/process/interpreter/eval/constructed::python-mod-run-json-argv-manifest
