defaults:
  platforms:
  - windows
composite_rules:
- for: &id001
  - pe
  - dll
  id: dotnet-http-offset-reflection-clues
  desc: HTTP offset decoding and reflection references
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: micro-behaviors/communications/http/client/managed::downloadstring
  - id: micro-behaviors/data/decode/custom::vb-integer-offset-byte-decoder
  - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-currentdomain
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::gettypes-member-token
  - id: micro-behaviors/metaprogramming/reflection/resolve::get-methods-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/invocation::invoke-token
- attack: T1027.009,T1105,T1140,T1620
  mbc: B0030,E1059
  for:
  - pe
  id: dotnet-reactor-http-compressed-reflective-stage
  desc: Reactor, HTTP, gzip and reflection clues
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: metadata/build/protector::dotnet-reactor-module-guid-type
  - id: micro-behaviors/communications/http/get::getbytearrayasync
  - id: micro-behaviors/data/codec::dotnet-gzip-compression
  - id: micro-behaviors/metaprogramming/reflection/invoke::invoke-member-token
- for:
  - csharp
  id: csharp-http-aes-reflective-stage
  desc: C# HTTP, Rijndael and reflection clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/client/managed::request
  - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
  - id: micro-behaviors/crypto/decrypt/initialize::dotnet-rijndael-decryptor
  any:
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/assembly::csharp-assembly-load-reflected-invoke
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-newlatebinding
- attack: T1105,T1140,T1620
  mbc: E1059
  for: *id001
  id: dotnet-network-resource-aes-stage
  desc: Network resource loader and Rijndael clues
  crit: hostile
  conf: 0.97
  all:
  - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-network-resource-method-loader
  - id: micro-behaviors/crypto/decrypt/initialize::dotnet-rijndael-decryptor
- for: *id001
  id: http-reflection-wav-url-profile
  desc: HTTP reflection loader and WAV URL
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: micro-behaviors/communications/http/client/managed::request
  - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
  - id: micro-behaviors/communications/http/client/managed::dotnet-http-response-method-reference
  - id: micro-behaviors/metaprogramming/reflection/resolve::dotnet-entrypoint-reflection
  - id: micro-behaviors/communications/url/resource-path/media::wav-file-url
- attack: T1620
  mbc: E1059
  for: *id001
  id: http-3des-reflection-loader
  desc: HTTP, TripleDES and reflection clues
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: micro-behaviors/communications/http/get::getbytearrayasync
  - id: micro-behaviors/crypto/symmetric/3des::triple-des-transform-codec-api-references
  - id: micro-behaviors/metaprogramming/reflection/invoke::invoke-member-token
  - id: objectives/execution/staging/runtime::managed-staged-method-names
  any:
  - id: micro-behaviors/communications/http/client/managed::custom-user-agent-headers
  - id: micro-behaviors/communications/http/header/value::ipad-safari-15-ua-pe
  - id: micro-behaviors/communications/url/resource-path/media::wav-file-url
  unless:
  - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
- attack: T1105,T1140,T1620
  mbc: B0024,E1059
  for: *id001
  id: http-3des-reflective-memory-loader
  desc: HTTP, TripleDES and memory execution clues
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: micro-behaviors/communications/http/get::getbytearrayasync
  - id: micro-behaviors/crypto/symmetric/3des::triple-des-provider
  - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
  - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::dotnet-create-delegate-reference
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::load-member-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::gettypes-member-token
  any:
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-string
  - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-text-pe
  - id: micro-behaviors/process/thread/create::create-thread-text
  needs: 2
  unless:
  - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
- for: *id001
  id: http-3des-wav-ipad-reflection
  desc: 3DES reflection, WAV URL and iPad UA
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/execution/payload/module-load/network::http-3des-reflection-loader
  - id: micro-behaviors/communications/url/resource-path/media::wav-file-url
  - id: micro-behaviors/communications/http/header/value::ipad-safari-15-ua-pe
- attack: T1105,T1140,T1620
  mbc: B0009.014
  for: *id001
  id: dotnet-unsigned-http-reflective-loader
  desc: Unsigned HTTP and dynamic-code references
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: metadata/signature/absent::unsigned-missing-signature-record
  - id: micro-behaviors/metaprogramming/reflection/invoke::dotnet-http-decode-dynamic-code-cluster
