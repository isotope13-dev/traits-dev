# A Git clone whose output is discarded, followed by putting a dot-directory
# on the import path, loads code that never shipped in the package: the
# cloned repository becomes importable while the user sees nothing of the
# transfer. Ordinary plugin installers report clone progress or errors and
# keep checkouts in visible project directories.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1105,T1129
  mbc: B0024

composite_rules:
  - id: python-silent-git-clone-hidden-import-path
    desc: Silently cloned repo added to import path from hidden dir
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/revision-control/git/transfer::python-subprocess-git-clone
      - id: micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-stdio-assignment
      - id: micro-behaviors/os/module/search-path::sys-path-dot-directory-input
