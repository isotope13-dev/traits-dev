defaults:
  platforms: [android]
  for: [dex]
  attack: T1027,T1406,T1129
traits:
  - id: dex-staged-apk-name
    desc: DEX references staged APK filename
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)^(main|payload|stage|update)\.apk$'
composite_rules:
  # These clusters use code offsets, not argument-level data-flow analysis.
  - id: dex-reflective-parent-write-cluster
    desc: Parent field lookup and reflective write call cluster
    crit: notable
    conf: 0.95
    near_bytes: 128
    all:
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::dex-parent-field-lookup-call
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::dex-reflective-field-access-call
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::dex-reflective-field-write-call
  - id: dex-activity-component-disable-cluster
    desc: Activity component lookup and disable call cluster
    crit: notable
    conf: 0.95
    near_bytes: 64
    all:
      - id: micro-behaviors/os/application/config::dex-activity-component-name-call
      - id: micro-behaviors/os/application/config::dex-component-disable-call
  - id: android-reflective-network-loader-component-disable
    desc: Reflective DEX loader with network and component-disable clues
    crit: hostile
    conf: 0.96
    all:
      - id: dex-reflective-parent-write-cluster
      - id: dex-activity-component-disable-cluster
      - id: micro-behaviors/os/module/load/class::android-dex-classloader-constructor
      - id: micro-behaviors/communications/socket/listen::dex-local-server-socket-call
      - id: micro-behaviors/communications/http/request/client::dex-url-open-connection-call
      - id: dex-staged-apk-name
      - id: micro-behaviors/os/message/intent::android-boot-completed-code-reference
