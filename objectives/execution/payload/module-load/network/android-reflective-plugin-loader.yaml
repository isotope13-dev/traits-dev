defaults:
  platforms: [android]
  for: [dex]
  attack: T1027,T1406,T1129
traits:
  - id: dex-parent-field-lookup-call
    desc: DEX reflectively looks up parent field
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: 'Ljava/lang/Class;->getDeclaredField'
      arg: {index: 0, kind: string, exact: parent}
  - id: dex-reflective-field-access-call
    desc: DEX changes reflected field accessibility
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Ljava/lang/reflect/Field;->setAccessible'
  - id: dex-reflective-field-write-call
    desc: DEX writes reflected field
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Ljava/lang/reflect/Field;->set'
  - id: dex-activity-component-name-call
    desc: DEX reads activity component name
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Landroid/app/Activity;->getComponentName'
  - id: dex-local-server-socket-call
    desc: DEX constructs local server socket
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Landroid/net/LocalServerSocket;-><init>'
  - id: dex-url-open-connection-call
    desc: DEX opens URL connection
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Ljava/net/URL;->openConnection'
  - id: dex-staged-apk-name
    desc: DEX references staged APK filename
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)^(main|payload|stage|update)\.apk$'
composite_rules:
  # These clusters use code offsets, not argument-level data-flow analysis.
  - id: dex-reflective-parent-write-cluster
    desc: Parent field lookup and reflective write call cluster
    crit: notable
    conf: 0.95
    near_bytes: 128
    all:
      - id: dex-parent-field-lookup-call
      - id: dex-reflective-field-access-call
      - id: dex-reflective-field-write-call
  - id: dex-activity-component-disable-cluster
    desc: Activity component lookup and disable call cluster
    crit: notable
    conf: 0.95
    near_bytes: 64
    all:
      - id: dex-activity-component-name-call
      - id: micro-behaviors/os/application/config::dex-component-disable-call
  - id: android-reflective-network-loader-component-disable
    desc: Reflective DEX loader with network and component-disable clues
    crit: hostile
    conf: 0.96
    all:
      - id: dex-reflective-parent-write-cluster
      - id: dex-activity-component-disable-cluster
      - id: micro-behaviors/os/module/load/class::android-dex-classloader-constructor
      - id: dex-local-server-socket-call
      - id: dex-url-open-connection-call
      - id: dex-staged-apk-name
      - id: micro-behaviors/os/message/intent::android-boot-completed-code-reference
