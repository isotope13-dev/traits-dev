defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  mbc: B0024
composite_rules:
  - id: postinstall-remote-bundle-bootstrap
    desc: npm postinstall remote bundle bootstrap
    crit: hostile
    conf: 0.995
    scope: archive
    for:
      - javascript
      - typescript
      - package.json
      - npm
    attack: T1195.002,T1105,T1059.007
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/os/package-manager/runtime-install::runtime-npm-install-comp
      - id: micro-behaviors/communications/http/request/client::node-scheme-selected-http-client
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync
      - id: micro-behaviors/os/module/dynamic-load::node-variable-require-call
      - id: micro-behaviors/data/archive/extract/tar::gzip-extract-strip-one-component
