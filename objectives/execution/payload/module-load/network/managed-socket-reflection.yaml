defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: encrypted-socket-managed-plugin-client
    desc: Encrypted socket client loads assemblies and invokes reflected methods
    crit: suspicious
    conf: 0.96
    attack: T1620,T1095
    all:
      - id: micro-behaviors/process/interpreter/runtime/clr::cil-assembly-load-call
      - id: micro-behaviors/metaprogramming/reflection/invoke::managed-methodbase-invoke-call
      - id: metadata/lang/source/naming/function/communication::dotnet-connect-async-method-token
      - id: micro-behaviors/communications/socket/receive::dotnet-receive-async-method-token
      - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
