# Completed encrypted payload chain classified by its activation sink.
defaults:
  # Batch droppers often embed the AES stage as a PowerShell here-string /
  # labeled region; keep these atoms on both so invoice/Rechnung-style
  # multi-stage bats are not invisible to encrypted-stage composites.
  for: [powershell, batch]
  platforms: [windows]
  attack: T1027
  mbc: C0025

composite_rules:
- id: ps-remote-rc4-appdomain-loader
  desc: PowerShell remotely stages an RC4-decrypted .NET assembly
  crit: hostile
  conf: 0.99
  attack: T1105,T1140,T1620
  mbc: B0030,B0024
  for: [powershell]
  all:
  - id: micro-behaviors/communications/http/client/webclient::webclient-download-data
  - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::source-rc4-managed-implementation
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/assembly::powershell-appdomain-currentdomain-load
