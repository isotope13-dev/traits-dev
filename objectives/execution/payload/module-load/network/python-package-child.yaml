defaults:
  platforms: [unix, windows]
  for: [whl, python-sdist, python]

composite_rules:
  # Package-level co-occurrence is useful triage context but does not bind
  # the downloaded bytes to the child's argv across arbitrary helper modules.
  - id: python-package-fetch-child-module-profile
    desc: Package combines HTTP fetch, tempdir and child module bootstrap
    crit: suspicious
    conf: 0.95
    scope: package
    all:
      - id: micro-behaviors/os/module/load/path::python-inline-child-file-module
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/data/stream/transfer::python-read-result-to-stream-write
      - id: micro-behaviors/fs/temp/mktemp::tempfile-mkdtemp
