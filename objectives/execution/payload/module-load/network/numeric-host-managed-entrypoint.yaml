defaults:
  platforms: [windows, unix]
  for: [powershell, csharp]

traits:
  - id: byte-array-download-call
    desc: Calls a managed byte download method
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)\.\s*(DownloadData(TaskAsync)?|GetByteArrayAsync)\s*\('

  - id: managed-entrypoint-invoke
    desc: Reflectively invokes a managed entry point
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?is)\.EntryPoint\b.{0,150}\.Invoke\s*\(\s*\$?null\b'

composite_rules:
  - id: numeric-host-download-managed-entrypoint
    desc: Downloads assembly bytes from a numeric host and invokes the entry point
    crit: hostile
    conf: 0.98
    attack: T1105,T1620
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: byte-array-download-call
      - id: managed-entrypoint-invoke
    any:
      - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load-call
      - id: micro-behaviors/metaprogramming/reflection/resolve::assembly-load
    near_bytes: 1024
