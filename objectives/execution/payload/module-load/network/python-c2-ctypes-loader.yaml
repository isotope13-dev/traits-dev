defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1105,T1129
  mbc: B0024

composite_rules:
  - id: python-c2-decoded-ctypes-load
    desc: Decodes Base64 HTTP payload and loads via ctypes
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/data/decode/base64/call::b64decode-call
      - id: micro-behaviors/fs/file/io-mode::write-append-create-mode
      - id: micro-behaviors/dylib/load/runtime::ctypes-cdll
    any:
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-object
