defaults:
  platforms: [windows]
  for: [powershell]
traits: []
composite_rules:
  - id: powershell-remote-fileless-assembly-execution
    desc: PowerShell executes remotely loaded .NET assembly
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.001,T1620
    mbc: B0030,B0024
    all:
      - id: micro-behaviors/communications/http/client/exchange::powershell-response-or-download-reference
      - id: micro-behaviors/os/module/load/memory::powershell-memory-assembly-load-evidence
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/assembly::powershell-assembly-entrypoint-invoke

