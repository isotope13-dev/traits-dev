# Coherent package-level chain; scope does not prove cross-file data flow.
# The constructor hook, module-relative staging and silent initializer distinguish
# this from an ordinary archive downloader. No exfiltration or final payload claim.
defaults:
  platforms:
  - unix
  - windows
  for:
  - whl
  - python
  crit: hostile
  conf: 0.97
composite_rules:
- id: remote-archive-model-input-hook
  desc: Remote ZIP staging accompanies a silent core-model input hook
  scope: archive
  all:
  - id: objectives/supply-chain/trojanized/package/runtime::silent-model-input-sidecar-hook
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-bound-as-response
  - id: micro-behaviors/data/archive/extract/zip::python-zipfile-extractall
  - id: micro-behaviors/fs/directory/copy::shutil-copytree
  - id: micro-behaviors/fs/path/self::python-module-directory
  - id: micro-behaviors/data/control-flow/error-handling/suppress::broad-exception-return-suppression
  - id: micro-behaviors/data/control-flow/module-exec::module-level-bare-call
