defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: managed-entrypoint-invocation
    desc: Invokes a managed assembly entry point
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?s)\.EntryPoint.{0,500}\.Invoke\(\$null'

composite_rules:
  - id: powershell-network-base64-assembly-dispatch
    desc: PowerShell download, reversal and Base64 assembly dispatch
    crit: hostile
    conf: 0.98
    attack: T1027,T1105,T1140,T1620
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/client/managed::webclient
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/data/collection/array::powershell-descending-index-slice
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load-call
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/invocation::dotnet-reflected-method-invoke

  - id: obfuscated-download-memory-entrypoint
    desc: Obfuscated remote assembly executes in memory
    crit: hostile
    conf: 0.97
    attack: T1027,T1105,T1620
    all:
      - id: micro-behaviors/communications/http/client/webclient::webclient-download-data
      - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load-call
      - id: micro-behaviors/metaprogramming/generation/emit::powershell-dynamic-assembly-module
      - id: micro-behaviors/mem/copy::marshal-copy-via-type-variable
      - id: metadata/lang/source/naming/population::high-entropy-identifier-ratio
      - id: managed-entrypoint-invocation
