defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: managed-entrypoint-invocation
    desc: Invokes a managed assembly entry point
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?s)\.EntryPoint.{0,500}\.Invoke\(\$null'

composite_rules:
  - id: obfuscated-download-memory-entrypoint
    desc: Obfuscated remote assembly executes in memory
    crit: hostile
    conf: 0.97
    attack: T1027,T1105,T1620
    all:
      - id: micro-behaviors/communications/http/client/webclient::webclient-download-data
      - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load-call
      - id: micro-behaviors/metaprogramming/generation/emit::powershell-dynamic-assembly-module
      - id: micro-behaviors/mem/copy::marshal-copy-via-type-variable
      - id: metadata/lang/source/naming/population::high-entropy-identifier-ratio
      - id: managed-entrypoint-invocation
