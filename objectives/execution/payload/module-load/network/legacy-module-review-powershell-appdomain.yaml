defaults:
  crit: hostile
  platforms: [windows]
  for: [powershell]
  attack: T1620
  mbc: B0024

composite_rules:
- id: ps-pastebin-appdomain-stage-loader
  desc: PowerShell Pastebin AppDomain stage loader
  conf: 0.98
  all:
  - id: objectives/command-and-control/backdoor/loader/managed-reflect::ps-appdomain-base64-method-loader
  - id: micro-behaviors/communications/http/services/file-hosting::pastebin
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::download
  any:
  - id: micro-behaviors/fs/write/file/redirect::out-file
  - id: micro-behaviors/fs/write/file/full/string::powershell-set-content-call
