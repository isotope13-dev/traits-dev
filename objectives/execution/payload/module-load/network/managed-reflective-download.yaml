defaults:
  platforms: [windows, unix]
  for: [pe, dll]
  crit: notable
  conf: 0.95

traits:
  - id: cil-downloads-network-byte-buffer
    desc: Managed code downloads a byte buffer
    if:
      type: symbol
      kind: call
      regex: '^System\.Net\.(WebClient\.DownloadData(TaskAsync)?|Http\.HttpClient\.GetByteArrayAsync)$'
  - id: cil-reflective-assembly-type-lookup
    desc: Looks up types in a managed assembly
    if:
      type: symbol
      kind: call
      regex: '^System\.Reflection\.Assembly\.GetTypes?$'
  - id: cil-compact-method-table
    desc: Assembly has few managed methods
    if:
      type: metrics
      field: pe.clr.method_count
      min: 1
      max: 12

composite_rules:
  - id: cil-network-assembly-reflective-dispatch
    desc: Managed download, assembly load and reflective invocation co-occur
    crit: suspicious
    conf: 0.94
    near_bytes: 1024
    all:
      - id: cil-downloads-network-byte-buffer
      - id: micro-behaviors/process/interpreter/runtime/clr::cil-assembly-load-call
      - id: cil-reflective-assembly-type-lookup
      - id: micro-behaviors/metaprogramming/reflection/invoke::cil-reflective-member-dispatch
  - id: compact-managed-network-reflective-loader
    desc: Compact loader downloads and reflectively dispatches a managed assembly
    crit: hostile
    conf: 0.98
    attack: T1105,T1620
    all:
      - id: cil-network-assembly-reflective-dispatch
      - id: cil-compact-method-table
  - id: archive-compact-managed-network-reflective-loader
    for: [iso, tar, zip, 7z, cab, rar, pe, dll]
    scope: archive
    desc: Archive carries a compact managed network loader
    crit: hostile
    conf: 0.98
    attack: T1105,T1620
    all:
      - id: metadata/archive/member/extension::archive-windows-executable-entry
      - id: compact-managed-network-reflective-loader
