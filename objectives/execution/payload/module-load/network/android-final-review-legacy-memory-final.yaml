composite_rules:
- id: embedded-memload-decrypt-tls-override-clues
  desc: Embedded memload, decryption and TLS-override clues
  crit: hostile
  conf: 0.98
  attack: T1027,T1105,T1620
  for:
  - dll
  all:
  - id: micro-behaviors/dylib/load/memory::custom-memory-loader-module
  - id: micro-behaviors/crypto/decrypt/initialize::embedded-createdecipheriv-reference
  - id: objectives/evasion/security-bypass/tls::reject-unauthorized-false-native
  - id: micro-behaviors/communications/http/content-length::raw-content-length-header
  unless:
  - id: well-known/lib/runtime/scripted/bun-runtime::runtime-context
  platforms:
  - windows
