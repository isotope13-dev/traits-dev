defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
  attack: T1105
composite_rules:
- id: temporary-javascript-module-loader
  desc: Remote JavaScript written imported and deleted
  crit: suspicious
  conf: 0.96
  attack: T1059.007,T1105
  near_bytes: 1200
  all:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/fs/write/file/target::node-writes-javascript-path
  - id: micro-behaviors/os/module/require::node-dynamic-import-file-url
  - id: micro-behaviors/fs/delete/file/library::fs-unlinkSync
  unless:
  - id: well-known/app/browser-extension/ai-web-extensions::ai-web-extensions-bump-helper-context
  - id: metadata/path/directory::test-directory-component
- id: jsonkeeper-node-module-compile-loader
  desc: JsonKeeper payload compiled as Node module
  crit: hostile
  conf: 0.995
  attack: T1102.001,T1059.007,T1036
  mbc: B0009.016
  all:
  - id: micro-behaviors/communications/http/client/exchange::axios-atob-data-content
  - id: micro-behaviors/os/module/load/memory::module-compile-marker
  - id: micro-behaviors/os/module/load/name::error-js-module-constructor
  any:
  - id: objectives/command-and-control/infrastructure/paste::jsonkeeper-b64-endpoint
  - id: objectives/command-and-control/infrastructure/paste::jsonkeeper-b64-endpoint-literal
- id: axios-decoded-url-module-compile-loader
  desc: Decoded URL fetch with Node module compilation
  crit: hostile
  conf: 0.99
  attack: T1105,T1140,T1059.007
  mbc: B0009.016
  near_lines: 24
  all:
  - id: micro-behaviors/communications/http/client/exchange::axios-get-atob-url
  - id: micro-behaviors/os/module/load/memory::module-compile-marker
  - id: micro-behaviors/data/decode/base64/unspecified::atob-decode
- id: remote-worker-module-compile-loader
  desc: HTTP response compiled inside worker
  crit: hostile
  conf: 0.99
  attack: T1102.001,T1059.007
  mbc: B0009.016
  all:
  - id: micro-behaviors/communications/http/get::axios-get-call
  - id: micro-behaviors/process/thread/runtime::worker-threads-require
  - id: micro-behaviors/process/thread/worker::new-worker-instance
  - id: micro-behaviors/communications/ipc/message::postmessage-call
  - id: micro-behaviors/os/module/load/memory::module-compile-marker
  any:
  - id: micro-behaviors/process/thread/worker::worker-eval-option
  - id: micro-behaviors/process/thread/worker::new-worker-instance
# Contagious-Interview loaders keep the stage in a JSON paste bin and run
# the response body through `new Function('require', body)(require)`.
- id: paste-bin-response-function-require-loader
  desc: Paste-bin response run as Function with require
  crit: hostile
  conf: 0.98
  attack: T1102.001,T1059.007
  near_bytes: 600
  all:
  - id: objectives/command-and-control/infrastructure/paste::jsonkeeper
  - id: micro-behaviors/communications/http/get::axios-get-call
  - id: micro-behaviors/metaprogramming/generation/function::js-function-constructor-require-parameter
  - id: micro-behaviors/process/interpreter/eval/constructed::js-function-then-require-call
