defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1620

composite_rules:
  - id: gcm-pe-loader-with-analysis-checks
    desc: GCM PE loader with debugger and hypervisor checks
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/crypto/cipher::bcrypt-chaining-mode-gcm
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/os/virtualization/hypervisor::cpuid-hypervisor-vendor-query
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
