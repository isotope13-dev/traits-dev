defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: cyclic-xor-autorun-module-loader
    desc: Disguised autorun bundle with XOR and DLL activation
    crit: hostile
    conf: 0.96
    attack: T1547.001,T1036.005
    # The autorun disguise supplies admission; neither the XOR loop nor
    # LoadLibrary alone is malicious. The call shape retains the loaded
    # module -> export lookup -> invocation relationship.
    all:
      - id: objectives/evasion/masquerade/process/path::svchost-lookalike-autorun-copy
      - id: micro-behaviors/data/encoding/xor::x86-cyclic-word-key-byte-xor-loop
      - id: metadata/binary/instruction/sequence::x86-checked-iat-result-forward-invoke-shape
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/fs/write/file/handle::write-file
