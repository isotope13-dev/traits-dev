# An app that declares SMS read and overlay-window grants, and loads a
# DexClassLoader stage out of an inflated asset, keeps the code that uses those
# grants out of the shipped dex.  Commercial packers load inflated assets too,
# but a packed app that also draws over other apps and reads SMS is the
# banking-dropper shape (Wroba and similar).
defaults:
  platforms: [android]
  attack: T1406.002,T1627

composite_rules:
  - id: android-sms-overlay-app-loads-inflated-asset-dex
    desc: SMS overlay app loads an inflated asset DEX stage
    crit: hostile
    conf: 0.93
    for: [zip, android_apk, xml, dex]
    scope: outer
    all:
      - id: metadata/permission/storage::android-read-sms-declared-request
      - id: metadata/permission/manifest::android-system-alert-window-request
      - id: micro-behaviors/process/create/loader::dex-class-loader
      - id: micro-behaviors/process/create/loader::dalvik-inflater-input-stream
      - id: micro-behaviors/process/create/loader::dalvik-get-assets-reference
    unless:
      - id: well-known/app/communication/sms-forwarder::smsforwarder-manifest-identity
      - id: well-known/app/communication/android-incallui::incallui-manifest-identity
      - id: metadata/file/naming::test-directory-component
      - id: well-known/app/communication/mobilego::mobilego-manifest-identity
