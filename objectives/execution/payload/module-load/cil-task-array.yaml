# This rule records co-occurrence in a shell-task backdoor. The CIL helper
# independently requires supplied-byte loading and instance invocation; the
# task-dispatch rule supplies attack admission. It does not bind intermethod
# call tokens or assert that a particular received packet reaches the helper.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1620

composite_rules:
  - id: cil-task-managed-payload-activation
    desc: Shell-task backdoor includes supplied-byte managed activation
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/remote-command/shell::cil-encrypted-task-shell-dispatch
      - id: micro-behaviors/process/deploy/module-load::cil-byte-array-instance-invocation
