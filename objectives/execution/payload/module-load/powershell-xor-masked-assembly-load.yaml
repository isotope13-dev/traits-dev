# A PowerShell stage that XOR-decodes an embedded executable image into a
# typed byte array and hands those bytes to [Reflection.Assembly]::Load,
# then reaches the entry point through reflected GetMethod/Invoke. The MZ
# image bytes plus the masking plus the buffer load together are the crypter
# shape; no ordinary plugin host embeds a typed PE image and unmasks it at
# load time.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027.002,T1620

composite_rules:
  - id: powershell-xor-masked-assembly-module-load
    desc: XOR-masked image bytes loaded as .NET assembly
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load-call
      - id: micro-behaviors/data/embedded/payload/array::powershell-typed-mz-byte-array
      - id: micro-behaviors/data/encoding/xor::powershell-modulo-xor-references
    any:
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-method-invoke
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-entrypoint-then-invoke
    needs: 1
