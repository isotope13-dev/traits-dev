defaults:
  for: [go]
  platforms: [unix, windows]
traits:
  - id: go-load-reassembled-native-plugin
    desc: Reassembles chunks and loads native plugin
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule go_load_reassembled_native_plugin {
          strings:
            $chunk = "func (m *Manager) AddChunk("
            $finish = "func (m *Manager) FinalizeBundle("
            $append = "combined = append(combined, part...)"
            $load = "return m.Load(ctx, manifest, combined)"
            $native = "loadNativePlugin(binary)"
          condition:
            all of them
        }
