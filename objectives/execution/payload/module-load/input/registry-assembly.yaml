# Registry.GetValue supplies the byte array to the assembly loader, either
# directly or through one transform call. Unlike a file-wide GetValue+Load
# composite this does not join unrelated settings reads and plugin loads.
# The syntax query covers the nested expression; intermediate-variable flows and
# RegistryKey receivers require further structural work and are not claimed.
defaults:
  platforms: [windows]
  for: [csharp]
traits:
  - id: registry-value-assembly-load
    desc: Loads registry value bytes as an assembly
    crit: suspicious
    conf: 0.97
    attack: T1620
    if:
      type: tree-sitter
      query: |
        ((invocation_expression
          function: (member_access_expression
            expression: (_) @loader
            name: (identifier) @load)
          arguments: (argument_list .
            (argument
              (cast_expression
                type: (array_type) @bytes
                value: (invocation_expression
                  function: (member_access_expression
                    expression: (_) @registry
                    name: (identifier) @read)))) .)) @call
          (#match? @loader "^(System\\.Reflection\\.)?Assembly$")
          (#eq? @load "Load")
          (#match? @bytes "^byte\\s*\\[\\s*\\]$")
          (#match? @registry "^(Microsoft\\.Win32\\.)?Registry$")
          (#eq? @read "GetValue"))

        ((invocation_expression
          function: (member_access_expression
            expression: (_) @loader
            name: (identifier) @load)
          arguments: (argument_list .
            (argument
              (invocation_expression
                arguments: (argument_list .
                  (argument
                    (cast_expression
                      type: (array_type) @bytes
                      value: (invocation_expression
                        function: (member_access_expression
                          expression: (_) @registry
                          name: (identifier) @read)))) .))) .)) @call
          (#match? @loader "^(System\\.Reflection\\.)?Assembly$")
          (#eq? @load "Load")
          (#match? @bytes "^byte\\s*\\[\\s*\\]$")
          (#match? @registry "^(Microsoft\\.Win32\\.)?Registry$")
          (#eq? @read "GetValue"))
