# Manual PE loader in C source that walks the PEB loader list, queries PEB
# ApiSetMap for api-ms-/ext-ms- contract DLLs, and resolves forwarded exports.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1106,T1620

traits:
  - id: c-peb-apiset-map-lookup
    desc: Reads Windows PEB API-set map
    crit: notable
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      regex: '(?i)(->|\.)api_set_map\b|\bApiSetNamespace\b'

  - id: c-apiset-contract-prefix-literal
    desc: Matches Windows API-set DLL prefix
    crit: notable
    conf: 0.9
    if:
      type: literal
      regex: '(?i)^(api|ext)-ms-$'

  - id: c-export-directory-rva-bounds-check
    desc: Checks RVA range inside PE export table
    # Any `a >= b && c - d < e` bounds test matches (frame timers too); only
    # the PE resolver composite gives it the export-table meaning.
    crit: component
    conf: 0.85
    if:
      type: text
      exclude_comments: true
      regex: '\w+\s*>=\s*\w+\s*&&\s*\w+\s*-\s*\w+\s*<\s*\w+'

composite_rules:
  - id: c-manual-pe-apiset-forwarder-resolver
    desc: C source manually resolves PEB ApiSetMap and forwarded exports
    crit: suspicious
    conf: 0.94
    all:
      - id: objectives/anti-static/obfuscation/api-hashing::c-peb-ldr-walk-source
      - id: objectives/anti-static/obfuscation/api-hashing::c-pe-export-directory-fields
      - id: c-peb-apiset-map-lookup
      - id: c-apiset-contract-prefix-literal
      - id: c-export-directory-rva-bounds-check
    unless:
      - id: well-known/lib/platform/wine::wine-source-tree
