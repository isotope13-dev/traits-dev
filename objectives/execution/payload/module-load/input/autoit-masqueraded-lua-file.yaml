# An AutoIt script that opens a local DLL in @ScriptDir, builds a disguised
# config/data filename (.ini/.dat/.cfg) under @ScriptDir, and loads/executes
# it via luaL_loadfile + lua_pcall is executing a masqueraded Lua payload.
defaults:
  platforms: [windows]
  for: [text]
  size_max: 2000000
  attack: T1036.008,T1059

composite_rules:
  - id: autoit-lua-executes-config-file-payload
    desc: AutoIt executes disguised config/data file through Lua VM
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/interpreter/autoit::autoit-scriptdir-dllopen
      - id: micro-behaviors/process/interpreter/autoit::autoit-scriptdir-config-path
      - id: objectives/anti-static/obfuscation/string/junking::autoit-junked-lua-loadfile-name
      - id: micro-behaviors/process/interpreter/autoit::autoit-junked-lua-pcall-name
