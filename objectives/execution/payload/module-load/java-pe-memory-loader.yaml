defaults:
  platforms: [windows]
  for: [class, java_class]
  attack: T1620

composite_rules:
  - id: jvm-downloads-and-runs-pe-in-memory
    desc: JVM runs downloaded PE from executable memory
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/lib/urlconnection::jvm-urlconnection-open-connection
      - id: micro-behaviors/mem/alloc/executable::page-execute-readwrite-java-ref
      - id: micro-behaviors/process/create/thread::jvm-jna-kernel32-create-thread
      - id: well-known/lib/platform/jna::core-types-import
