# Reconstructed bytes, assembly loading and reflected invocation co-occur.
# This profile does not bind the decoded buffer to Load or prove a backdoor.
defaults:
  platforms: [windows, unix]
  for: [powershell]
composite_rules:
  - id: powershell-xor-reflected-assembly-invocation
    desc: XOR reconstruction with reflective assembly invocation
    crit: suspicious
    conf: 0.95
    attack: T1620,T1059.001
    all:
      - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load-call
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-method-invoke
      - id: micro-behaviors/data/encoding/xor::powershell-modulo-xor-references
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
    unless:
      - id: well-known/tool/development/
      - id: well-known/dual-use/remote-admin/
