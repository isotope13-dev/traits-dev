# A trojanized (and often validly signed) PE whose startup path allocates an
# RWX buffer, block-copies an embedded blob out of its own image into it and
# jumps in. The blob is not data the program reads: it is the first stage,
# normally encrypted and self-decrypting (a `call` over the blob into a decoder
# at its tail). The compiler spells the VirtualAlloc flags as `or r9d, 0x40`
# after `add r8d, 0x3000`, so these patterns key on the call shape rather than
# on a pushed constant.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  attack: T1055,T1620

traits:
  - id: x64-rwx-virtualalloc-call
    desc: x64 VirtualAlloc call requesting RWX
    crit: suspicious
    conf: 0.9
    # JavaScript engines allocate RWX pages for JIT code; a Bun-compiled CLI
    # (Oven's runtime embedded in the executable) carries that call by design.
    unless:
      - id: well-known/lib/runtime/scripted/bun-runtime/
    if:
      type: hex
      section: .text
      pattern: '(41 B9 40 00 00 00|41 83 C9 40) [0-20] FF 15 ?? ?? ?? ??'

  - id: x64-rep-movsb-jump-register
    desc: x64 blob copy followed by register jump
    crit: suspicious
    conf: 0.9
    if:
      type: hex
      section: .text
      pattern: 'FC F3 A4 41 FF E?'

composite_rules:
  - id: pe-embedded-blob-rwx-copy-and-run
    desc: PE copies embedded blob into RWX memory and runs it
    crit: hostile
    conf: 0.95
    all:
      - id: x64-rwx-virtualalloc-call
      - id: x64-rep-movsb-jump-register
