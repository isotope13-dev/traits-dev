# An app that declares SMS read access, loads a DexClassLoader stage out of an
# inflated asset and switches a component's enabled state (the way a launcher
# icon is removed) is a packed SMS dropper: the code that uses the SMS grant is
# not in the shipped dex.  Commercial packers load inflated assets too, but a
# packed app does not also hide its own entry point behind an SMS grant.
defaults:
  platforms: [android]
  attack: T1406.002,T1655,T1627

composite_rules:
  - id: android-sms-app-loads-inflated-asset-dex-and-hides-icon
    desc: SMS app loads asset DEX stage and hides its launcher
    crit: hostile
    conf: 0.93
    for: [zip, android_apk, xml, dex]
    scope: outer
    all:
      - id: micro-behaviors/os/privilege/manifest::read-sms-declared-grant
      - id: micro-behaviors/process/create/loader::dex-class-loader
      - id: micro-behaviors/process/create/loader::dalvik-inflater-input-stream
      - id: micro-behaviors/process/create/loader::dalvik-get-assets-reference
      - id: objectives/evasion/process/hidden/launcher::android-set-component-enabled-setting-reference
    unless:
      - id: well-known/app/communication/sms-forwarder::smsforwarder-manifest-identity
      - id: well-known/app/communication/android-incallui::incallui-manifest-identity
      - id: metadata/file/naming::test-directory-component
