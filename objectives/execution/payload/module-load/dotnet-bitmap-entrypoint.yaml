# Bitmap resource extraction followed by managed assembly activation.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # Some .NET droppers hide the second assembly in RGB pixels instead of a
  # conventional encrypted resource blob. Requiring pixel extraction together
  # with an opaque managed resource, AppDomain loading, and delegated entry
  # point execution distinguishes that behavior from ordinary image handling
  # or resource-backed plugin bundles.
  - id: dotnet-bitmap-resource-entrypoint-loader
    desc: .NET extracts an opaque bitmap resource and runs a loaded assembly entry point
    crit: hostile
    conf: 0.98
    attack: "T1027.003,T1140,T1620"
    mbc: B0032.001
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/resource/entropy::clr-resource-high-entropy
      - id: metadata/binary/resource/size::clr-resource-large
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-getmanifestresourcestream
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-resource-reader
      - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-type-token
      - id: micro-behaviors/ui/graphics/image::getpixel-api-name
      - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-currentdomain
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::load-member-token
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::get-entrypoint-token
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::dotnet-create-delegate-reference
