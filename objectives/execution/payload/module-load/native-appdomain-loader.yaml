defaults:
  platforms: [windows]
  for: [pe]
  attack: T1620

composite_rules:
  - id: native-clr-appdomain-byte-array-stage-loader
    desc: Native PE loads staged assembly into CLR AppDomain
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/interpreter/runtime/clr::native-appdomain-load-byte-array
      - id: micro-behaviors/process/interpreter/runtime/clr::clr-metahost-interface-guids
      - id: objectives/anti-static/obfuscation/payload/resource::native-table-decoded-clr-resource
      - id: objectives/anti-analysis/debugger-detect/combined-checks::native-clr-profiler-pointer-gate
    unless:
      - id: metadata/signed/platform/
