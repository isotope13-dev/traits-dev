# A compiled ASP.NET page that answers HTTP requests by resolving native
# exports at runtime, allocating executable memory and starting a native
# thread in it. The page handler supplies the trigger, the delegate
# conversion supplies the call mechanism, and the NtAllocateVirtualMemory /
# NtCreateThreadEx pair supplies the execution primitive: together they run a
# shellcode blob without touching disk. Legitimate web applications never
# resolve these process-injection primitives from a request handler.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1505.003,T1620
composite_rules:
  - id: dotnet-page-native-thread-shellcode-exec
    desc: Web page resolves native exports to thread-execute shellcode
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/server/managed::http-context
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
      - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
      - id: micro-behaviors/process/create/thread::nt-create-thread-ex-name
    unless:
      - id: metadata/signed/platform/
