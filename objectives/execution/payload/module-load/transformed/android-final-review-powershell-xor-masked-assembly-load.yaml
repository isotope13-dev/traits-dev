# This profile detects co-occurring XOR decoding, an embedded typed MZ byte
# array, and reflective .NET assembly loading in PowerShell. It does not bind
# those observations to the same byte buffer; in the reviewed sample, the
# XOR-decoded managed loader is separate from the PE bytes passed to it.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027.002,T1620

composite_rules:
- id: powershell-xor-masked-assembly-module-load
  desc: PowerShell XOR decoding and reflective .NET load alongside embedded PE bytes
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load-call
  - id: micro-behaviors/data/embedded/payload/array::powershell-typed-mz-byte-array
  - id: micro-behaviors/data/bitwise/xor-forms/indexed::powershell-modulo-xor-references
  any:
  - id: micro-behaviors/metaprogramming/reflection/invoke::powershell-assembly-method-invoke
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/invocation::powershell-entrypoint-then-invoke
  needs: 1

- id: powershell-xor-reflective-invoke-cluster
  desc: XOR decoding with reflective assembly invocation
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load-call
  - id: micro-behaviors/data/bitwise/xor-forms/indexed::powershell-modulo-xor-references
  any:
  - id: micro-behaviors/metaprogramming/reflection/invoke::powershell-assembly-method-invoke
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/invocation::powershell-entrypoint-then-invoke
