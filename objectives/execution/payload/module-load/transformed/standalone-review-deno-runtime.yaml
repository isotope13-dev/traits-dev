defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: deno-profile-network-data-uri-loader
    desc: Deno profile and network data-URI loader
    crit: hostile
    conf: 0.99
    for: [javascript]
    all:
      - id: micro-behaviors/os/sysinfo/profile::deno-host-information-queries
      - id: micro-behaviors/communications/socket/listen::deno-localhost-tcp-listen
      - id: metadata/file/profile/network::promise-health-race-clues
      - id: metadata/file/profile/network::mv2-token-path-text
      - id: micro-behaviors/os/module/dynamic-load::deno-base64-data-uri-import
