defaults:
  platforms: [android]
  for: [dex]
traits:
  - id: dex-large-base64-data
    desc: DEX contains very large Base64-shaped string
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '^[A-Za-z0-9+/]+={0,2}$'
      length_min: 50000
    not:
      - regex: '^(iVBORw0KGgo|/9j/4|R0lGOD[dl]h|UklGR|JVBERi0)'
  - id: dex-digit-interleaved-identifiers
    desc: Repeated digit-interleaved DEX identifier text
    crit: notable
    conf: 0.94
    count_min: 4
    if:
      type: text
      regex: '^([A-Za-z][0-9]+){4}[A-Za-z0-9]*$'
composite_rules:
  - id: android-asset-cipher-zip-reflection-calls
    desc: Asset, cipher, ZIP and reflection calls coexist
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/cipher/io::dex-cipher-input-stream-constructor
      - id: micro-behaviors/data/archive/extract/zip::dex-zip-input-stream-constructor
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::dex-reflective-constructor-call
      - id: micro-behaviors/data/embedded/resource::dex-android-asset-open-call
