# Managed fileless loader: an unsigned .NET stub reads an encrypted managed
# resource, Base64-decodes a shipped key/IV, decrypts it with a symmetric
# cipher stream, loads the plaintext bytes as an assembly without touching
# disk, and dispatches the entry through a delegate. PureCrypter-style
# Stage 1 does exactly this (TripleDES over a high-entropy resource,
# AppDomain.Load, Assembly.GetType, Delegate.CreateDelegate,
# Delegate.DynamicInvoke); AES/RC2 variants share the shape, so no single
# cipher is required. Either half alone is dual-use -- plugin hosts load
# assemblies without the decrypt leg, and config decryptors decrypt without
# the reflective delegate dispatch -- so every leg is required together.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1140,T1620
  mbc: B0032

composite_rules:
- id: dotnet-decrypted-resource-delegate-loader
  desc: Decrypted resource assembly loaded via delegate dispatch
  crit: hostile
  conf: 0.97
  scope: file
  all:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: metadata/signature/absent::unsigned-missing-signature-record
  - id: metadata/binary/resource/entropy::clr-resource-high-entropy
  - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
  - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
  - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
  - id: micro-behaviors/crypto/cipher/io::dotnet-cryptostream
  - id: micro-behaviors/process/interpreter/runtime/clr::managed-assembly-load-api
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::dotnet-create-delegate-reference
  - id: micro-behaviors/metaprogramming/reflection/invoke::dotnet-dynamic-invoke-reference
