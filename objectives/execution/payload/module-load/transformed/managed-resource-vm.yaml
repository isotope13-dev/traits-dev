defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # The encoded interpreter alone can be software protection. Require its
  # separate disguised payload transform, file and resource reads, native
  # delegate resolution, runtime method generation, and reflected dispatch.
  # No GeoAPI name, resource name, hash, or campaign filename is required.
  - id: managed-resource-vm-reflective-loader
    desc: Encoded managed VM with disguised XOR and reflective staging
    crit: hostile
    conf: 0.97
    attack: T1027,T1140,T1620
    all:
      - id: objectives/anti-static/obfuscation/bytecode::managed-encoded-vm-dispatch
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::cil-disguised-cyclic-xor
      - id: micro-behaviors/data/embedded/resource::dotnet-cil-resource-read-call
      - id: micro-behaviors/fs/read/file/content/whole::cil-file-readallbytes-call
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::dynamic-method-api-token
      - id: micro-behaviors/metaprogramming/reflection/invoke::managed-methodbase-invoke-call
