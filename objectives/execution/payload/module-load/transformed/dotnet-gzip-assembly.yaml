# Managed fileless stager: a .NET PE carries an HTTP form-encoded payload,
# gzip-decompresses it, loads the result as an assembly, and dispatches it
# through reflection. Mirrors the PowerShell HTTP+gzip+assembly loader in
# powershell-gzip-assembly.yaml for compiled .NET binaries. Co-occurrence
# alone cannot prove the loaded bytes came from the network, so this stays
# suspicious without additional exploit evidence.
defaults:
  for: [pe]
  platforms: [windows]
  attack: T1105,T1620

composite_rules:
  - id: dotnet-http-gzip-assembly-loader
    desc: HTTP payload gzip-decompressed and loaded as assembly
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/data/codec::dotnet-gzip-compression
      - id: micro-behaviors/process/interpreter/runtime/clr::cil-assembly-load-call
      - id: micro-behaviors/metaprogramming/reflection/invoke::managed-methodbase-invoke-call
      - id: micro-behaviors/communications/http/header/content-type::url-encoded-content-type
