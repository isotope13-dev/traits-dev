defaults:
  for: [powershell]
  platforms: [windows]
composite_rules:
  # Capability conjunction: helper calls prevent proving a byte-to-load flow.
  - id: powershell-http-gzip-assembly-loader
    desc: HTTP, gzip decompression and managed assembly loading co-occur
    crit: suspicious
    conf: 0.95
    attack: T1105,T1620
    all:
      - id: micro-behaviors/communications/http/client/library::iwr-name
      - id: micro-behaviors/data/codec::powershell-gzipstream
      - id: micro-behaviors/data/decompress/stream::powershell-compressionmode-decompress
      - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load-call
