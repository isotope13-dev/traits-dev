defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
- id: dotnet-encrypted-reflection-loader
  desc: AES, decryption-name and reflection references
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: metadata/binary/symbols/name/token/security::decryptdata-name-reference
  - id: micro-behaviors/crypto/symmetric/aes/reference::dotnet-rijndael-any
  - id: micro-behaviors/metaprogramming/reflection/invoke::invoke-member-token
  any:
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::get-exported-types-token
  - id: micro-behaviors/metaprogramming/reflection/resolve::get-methods-token
  - id: micro-behaviors/metaprogramming/reflection/resolve::assembly-load-text
  - id: micro-behaviors/data/encode/base64/primitive::dotnet-to-base64string
  needs: 2
  unless:
      # A self-contained single-file publish bundles the whole BCL (AES/Rijndael
      # type names, reflection InvokeMember, GetExportedTypes, Convert.ToBase64String)
      # as metadata string tables inside the native host stub -- that is the
      # runtime library's own API surface, not application code chaining decrypt
      # and reflective invoke.
  - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-singlefile-host-context
