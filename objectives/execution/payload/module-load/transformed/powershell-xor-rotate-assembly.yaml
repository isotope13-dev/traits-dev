defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027,T1140,T1620
  mbc: C0025,B0024

composite_rules:
  - id: powershell-xor-rotate-framework-assembly-loader
    desc: PowerShell decrypts XOR-rotated assembly with Framework host
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/bitwise/mixed::powershell-xor-rotate-transform
      - id: micro-behaviors/data/decode/custom::powershell-keyed-byte-loop-decrypt
      - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load-call
      - id: micro-behaviors/fs/path/binary::dotnet-framework-runtime-exe-path
      - id: metadata/file/line::very-long-source-line
