defaults:
  platforms: [windows]
  for: [batch]
  attack: T1127.001

composite_rules:
- id: msbuild-property-reflective-assembly-load
  desc: MSBuild reflectively loads Base64 assembly
  crit: suspicious
  conf: 0.98
  for: [batch, xml]
  near_bytes: 512
  all:
  - id: micro-behaviors/os/module/load/memory::msbuild-property-assembly-load
  - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
  - id: metadata/lang/source/syntax/call/member::chained-create-instance-fragment

- id: msbuild-xml-reflective-loader
  desc: MSBuild project instantiates decoded managed payload
  crit: hostile
  conf: 0.99
  for: [xml]
  all:
  - id: metadata/build/msbuild::msbuild-project-root
  - id: objectives/execution/payload/module-load/transformed::msbuild-property-reflective-assembly-load

- id: batch-msbuild-reflective-loader
  desc: MSBuild decodes and instantiates managed payload
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/fs/path/binary::dotnet-framework-runtime-exe-path
  - id: objectives/execution/payload/module-load/transformed::msbuild-property-reflective-assembly-load
  - id: micro-behaviors/os/env/write::msbuild-all-property-functions-enabled

