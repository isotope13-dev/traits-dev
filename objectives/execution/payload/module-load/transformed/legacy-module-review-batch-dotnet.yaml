defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
- id: batch-encrypted-reflective-dotnet-loader
  desc: Batch encrypted reflective .NET loader
  crit: hostile
  conf: 0.99
  attack: T1620
  mbc: B0024
  all:
  - id: micro-behaviors/fs/read/file/self::batch-self-read-last-line-clues
  - id: micro-behaviors/crypto/decrypt/transform/symmetric::ps-aes-decryptor-stage
  - id: micro-behaviors/data/decompress/gzip::ps-gzip-decompress-stage
  - id: micro-behaviors/os/module/load/memory::ps-byte-array-assembly-load
  - id: micro-behaviors/metaprogramming/reflection/invoke::ps-entrypoint-indirect-invoke
  any:
  - id: objectives/evasion/process/hidden/launcher::batch-hidden-runas-self-relaunch
  - id: micro-behaviors/data/string/reverse::ps-reversed-base64-stage
  - id: metadata/file/line::batch-long-average-lines
  - id: micro-behaviors/process/argument/interpreter::powershell-command-launch
  needs: 2
- id: batch-base64-encrypted-reflective-dotnet-loader
  desc: Batch Base64 carrier decrypts and reflectively runs .NET
  crit: hostile
  conf: 0.995
  for: [batch, data]
  attack: T1027,T1140,T1620
  mbc: B0024
  all:
  - id: metadata/file/encoding/base64::encoded-ps-aes-managed
  - id: metadata/file/encoding/base64::encoded-ps-gzip-stream
  - id: metadata/file/encoding/base64::encoded-ps-reflective-assembly-load
  - id: metadata/file/encoding/base64::encoded-ps-entrypoint-invoke

- id: batch-elevated-encrypted-dotnet-stage
  desc: Elevated encrypted .NET stage loader
  crit: hostile
  conf: 0.98
  attack: T1059.003
  mbc: B0030
  all:
  - id: objectives/evasion/process/hidden/launcher::batch-hidden-runas-self-relaunch
  - id: objectives/evasion/security-bypass/policy/execution::bypass-execution-policy
  - id: micro-behaviors/crypto/decrypt/transform/symmetric::ps-aes-decryptor-stage
  - id: micro-behaviors/data/decompress/gzip::ps-gzip-decompress-stage
  - id: micro-behaviors/os/module/load/memory::ps-byte-array-assembly-load
  any:
  - id: micro-behaviors/metaprogramming/reflection/invoke::ps-entrypoint-indirect-invoke
  - id: micro-behaviors/fs/read/file/self::batch-self-read-last-line-clues
  - id: metadata/file/line::batch-long-average-lines
- id: chunked-base64-encrypted-reflective-dotnet-loader
  desc: Chunked Base64 PowerShell stage decrypts and reflectively loads .NET
  crit: hostile
  conf: 0.995
  for: [batch, vbs, data]
  attack: T1027,T1140,T1620
  mbc: B0024
  all:
  - id: metadata/file/encoding/base64::b64-chunk-ps-aes-decrypt
  - id: metadata/file/encoding/base64::b64-chunk-ps-gzip-memorystream
  - id: metadata/file/encoding/base64::b64-chunk-ps-reflection-assembly
