defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: managed-programdata-fsc-path
    desc: Microsoft ProgramData FSC file path
    crit: component
    if:
      type: text
      regex: '(?i)ProgramData[\\/]Microsoft[\\/][a-z0-9_-]{1,64}\.fsc'
  - id: managed-exported-types-call
    desc: Calls managed GetExportedTypes
    crit: component
    if:
      type: symbol
      kind: call
      exact: System.Reflection.Assembly.GetExportedTypes
composite_rules:
  - id: managed-disk-reflection-calls
    desc: Nearby file read, assembly load and reflection calls
    crit: component
    near_bytes: 256
    all:
      - id: micro-behaviors/fs/read/file/content/whole::cil-file-readallbytes-call
      - id: micro-behaviors/process/interpreter/runtime/clr::cil-assembly-load-call
      - id: managed-exported-types-call
      - id: micro-behaviors/metaprogramming/reflection/invoke::managed-methodbase-invoke-call
  - id: obfuscated-programdata-reflective-loader
    desc: Obfuscated managed loader references an FSC file in Microsoft ProgramData
    crit: hostile
    attack: T1620
    all:
      - id: managed-disk-reflection-calls
      - id: managed-programdata-fsc-path
      - id: metadata/lang/encoding/shape/character::managed-pe-format-marker-population-206d
      - id: metadata/lang/encoding/shape/character::managed-pe-format-marker-population-206f
