defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: fivem-encrypted-payload-injector
  desc: Encrypted payload injection into FiveM
  crit: hostile
  conf: 0.98
  attack: T1055
  all:
  - id: fivem-injection-status
  - id: payload-decrypt-status
  - id: gcm-pe-loader-with-analysis-checks
  - id: micro-behaviors/process/attach/rights::nt-open-process-name
  - id: micro-behaviors/process/inject/runtime/call::nt-write-virtual-memory-name

- id: gcm-pe-loader-with-analysis-checks
  desc: GCM cipher, PE header, memory protection and analysis-check references
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/crypto/cipher/mode::bcrypt-chaining-mode-gcm
  - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-import
  - id: micro-behaviors/os/virtualization/hypervisor::cpuid-hypervisor-vendor-query
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  unless:
  - id: well-known/tool/sysadmin/osquery::osquery-tool-context

traits:
- id: fivem-injection-status
  desc: FiveM process injection status text
  crit: notable
  conf: 0.98
  if:
    type: text
    section: .rdata
    substr: FiveM detected. Injecting into running game

- id: payload-decrypt-status
  desc: Payload decryption status text
  crit: notable
  conf: 0.97
  if:
    type: text
    section: .rdata
    substr: Decrypting payload
