defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
    - csharp
composite_rules:
  - id: dotnet-reflection-injection-persist-host-clues
    for:
      - pe
    desc: .NET reflection, config and host-name clues
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/execution/payload/module-load/transformed::dotnet-encrypted-reflection-loader
      - id: micro-behaviors/os/autorun/keyword::dotnet-injection-persistence-token
      - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-framework-host-exe-reference
    any:
      - id: micro-behaviors/os/autorun/keyword::dotnet-startup-persistence-config-token
      - id: well-known/lib/runtime/managed/dotnet-runtime::msbuild-exe-name
      - id: well-known/lib/runtime/managed/dotnet-runtime::aspnet-tool-exe-name
      - id: micro-behaviors/os/env/reference::dotnet-complus-host-env
    needs: 2
