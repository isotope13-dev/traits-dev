defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: chacha-pe-loader-with-analysis-checks
    desc: ChaCha20 constant, PE header, PEB walk and analysis checks
    crit: suspicious
    conf: 0.95
    attack: T1027,T1497.001
    all:
      - id: micro-behaviors/crypto/symmetric/stream/sigma::chacha-salsa-constant
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: micro-behaviors/process/info/query::peb-access-x64
      - id: micro-behaviors/os/virtualization/hypervisor::cpuid-hypervisor-vendor-query
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
    unless:
      - id: well-known/tool/sysadmin/osquery::osquery-tool-context
      # Google-signed Chrome helpers carry BoringSSL ChaCha20, PE parsing, a
      # PEB read and debugger checks as ordinary browser hardening.
      - id: metadata/signature/verified/signer::google-llc
