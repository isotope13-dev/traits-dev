defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [powershell]
  attack: T1027

composite_rules:
  - id: powershell-reflected-b64-xor-assembly-loader
    desc: Reflects Base64, XORs bytes, loads assembly entry
    conf: 0.99
    attack: T1027,T1140,T1059.001,T1620
    all:
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::dotnet-frombase64-getmethods-like
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::indexed-bxor-key-loop
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/assembly::powershell-split-assembly-load-invoke
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/assembly::powershell-assembly-entrypoint-invoke
      - id: metadata/file/line::very-long-source-line

  - id: powershell-gettype-convert-xor-entrypoint
    desc: Split Convert GetType XOR assembly entrypoint loader
    conf: 0.98
    attack: T1027,T1059.001,T1620
    all:
      - id: 
          micro-behaviors/metaprogramming/reflection/inspect/class/inspection::powershell-reflection-method-enumeration
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::indexed-bxor-key-loop
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/assembly::powershell-assembly-entrypoint-invoke
      - id: metadata/file/line::powershell-long-line
    any:
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::dotnet-frombase64-getmethods-like
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/assembly::powershell-split-assembly-load-invoke
