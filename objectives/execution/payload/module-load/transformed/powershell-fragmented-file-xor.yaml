defaults:
  platforms: [windows]
  for: [powershell, text]

composite_rules:
  # Generated command strings split identifiers as well as the type and Load
  # name. Indexed-XOR source matchers cannot see those generated identifiers.
  - id: powershell-fragmented-file-xor-loader
    desc: Evaluates a file decoder with XOR and concealed static Load
    crit: hostile
    conf: 0.98
    attack: T1140,T1059.001,T1620
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/fs/read/file/content/bytes::powershell-file-readallbytes
      - id: metadata/lang/source/syntax/operator::powershell-bxor-op
      - id: objectives/anti-static/obfuscation/string/broken-api::powershell-fragmented-static-load
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-text
