defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, javascript, typescript]
  crit: hostile
  conf: 0.98
  attack: T1480.001,T1027.013,T1059.007
composite_rules:
# Combine the two spellings of the caller-keyed trigger without emitting a
# second hostile finding for the same behavior. The loader and ciphertext
# stage are shared; javascript-obfuscator rewrites JSON.stringify as a
# subscript, while plain implementations commonly retain the member call.
- id: caller-json-keyed-encrypted-module-load
  desc: Caller JSON keys and loads an encrypted module
  scope: archive
  all:
    - id: micro-behaviors/crypto/decrypt/transform/symmetric::node-scrypt-gcm-file-decrypt-write
    - id: objectives/anti-static/obfuscation/payload/data-file::javascript-module-is-base64-only
  any:
    - id: micro-behaviors/os/module/dynamic-load::caller-json-subscript-module-path
    - id: micro-behaviors/os/module/dynamic-load::caller-json-member-module-path
- id: caller-data-keyed-encrypted-module-load
  desc: Caller data keys decryption and loading of a module
  crit: suspicious
  conf: 0.96
  scope: archive
  all:
    - id: micro-behaviors/os/module/dynamic-load::caller-keyed-decipher-module-path
    - id: objectives/anti-static/obfuscation/payload/data-file::javascript-module-is-base64-only
  unless:
    - id: caller-json-keyed-encrypted-module-load
