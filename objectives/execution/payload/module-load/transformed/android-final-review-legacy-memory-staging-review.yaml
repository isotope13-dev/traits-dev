composite_rules:
- id: hta-base64-reflective-assembly-activation
  desc: HTA decodes and reflectively activates a .NET assembly
  mbc: E1059
  all:
  - id: metadata/file/format/markup::hta-application-element
  - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
  - id: micro-behaviors/metaprogramming/reflection/resolve::assembly-load-variable-argument
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::script-activator-createinstance-call
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/invocation::dotnet-reflected-method-invoke
  for:
  - html
  platforms:
  - windows
  conf: 0.99
  crit: hostile
