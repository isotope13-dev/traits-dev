defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1027.002,T1059.007

traits:
  - id: computed-module-extension-hook
    desc: Assigns a computed Node module extension
    crit: notable
    if:
      type: text
      regex: 'Module\[[^\]]{1,80}\]\[[^\]]{1,80}\]\s*=\s*function'

  - id: computed-node-crypto-call
    desc: Calls a computed Node crypto method
    crit: notable
    if:
      type: text
      regex: 'crypto\[[^\]]{1,100}\]\('

composite_rules:
  - id: obfuscated-crypto-module-extension-loader
    desc: Obfuscated Node extension handler uses crypto
    crit: hostile
    conf: 0.97
    scope: file
    near_bytes: 3500
    all:
      - id: computed-module-extension-hook
      - id: computed-node-crypto-call
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
