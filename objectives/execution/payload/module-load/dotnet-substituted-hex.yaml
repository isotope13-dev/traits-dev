defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: substituted-hex-reflective-assembly-loader
    desc: Substituted PE with reflective assembly APIs
    crit: hostile
    conf: 0.98
    attack: T1027,T1620
    all:
      - id: objectives/anti-static/obfuscation/encoding/custom::substituted-hex-pe-header
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/metaprogramming/reflection::dotnet-assembly-type-reference
      - id: micro-behaviors/process/interpreter/reflection/runtime::invoke-member-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::load-member-token
      - id: micro-behaviors/metaprogramming/reflection::get-method-token
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-newlatebinding
