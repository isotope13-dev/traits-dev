defaults:
  platforms:
    - windows
    - unix
  for:
    - jar
    - zip
    - class

composite_rules:
  - attack: T1528,T1105,T1129,T1027
    id: minecraft-token-abi-jar-loader
    desc: Token-handoff JAR loader with obfuscated ABI resolver
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: objectives/anti-static/obfuscation/string/runtime-decrypt::jvm-obfuscated-abi-reader
      - id: objectives/credential-access/gaming/minecraft::minecraft-token-jar-handoff
      - id: micro-behaviors/communications/http/message::jvm-handwritten-request-line
      - id: micro-behaviors/communications/socket/ssl::jvm-sslsocket-handshake-call

  - attack: T1105,T1129,T1027
    id: jvm-abi-resolved-classloader-stager
    desc: JVM ABI dead-drop resolver pairs with dynamic classloader staging
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: objectives/anti-static/obfuscation/string/runtime-decrypt::jvm-obfuscated-abi-reader
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-defineclass-name-constant
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-findclass
      - id: micro-behaviors/communications/socket/ssl::jvm-sslsocket-handshake-call
