# Native object modules are loaded by a custom COFF runtime and invoked by symbol.
# The decoded blockchain rendezvous supplies attack admission; RWX alone does not.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1620,T1105
composite_rules:
  - id: blockchain-resolved-coff-module-execution
    desc: Dead-drop endpoint feeds COFF RWX entry execution
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/format/pe-parser::coff-symbol-table-parser-source
      - id: micro-behaviors/mem/alloc/executable::virtualalloc-rwx-source
      - id: micro-behaviors/mem/copy::native-memcpy-byte-copy
      - id: micro-behaviors/process/deploy/module-load::http-coff-rwx-symbol-entry-call
      - id: objectives/command-and-control/channel/deaddrop/blockchain::solana-account-data-c2-resolution
