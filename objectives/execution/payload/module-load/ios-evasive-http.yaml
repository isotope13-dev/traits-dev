defaults:
  platforms:
  - ios
  for:
  - macho
  arch:
  - aarch64
composite_rules:
- id: ios-evasive-http-memory-loader
  desc: Emulator-probe and HTTP memory-loader code
  crit: hostile
  conf: 0.97
  attack: T1620,T1105
  all:
  - id: objectives/anti-analysis/emulator-detect::corellium-daemon-stat-probe
  - id: micro-behaviors/communications/http/client/initialize::cfhttp-response-stream
  - id: micro-behaviors/data/codec::apple-compression-decode-buffer
  - id: micro-behaviors/data/decompress/lzma::apple-arm64-lzma-decode-call-layout
  - id: micro-behaviors/mem/map::apple-arm64-rwx-map-arguments
  - id: metadata/binary/instruction/sequence::arm64-context-entry-lookup-call-layout
  - id: metadata/binary/instruction/sequence::arm64-context-entry-invoke-call-layout
  any:
  - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha-salsa-constant
  - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha-salsa-constant-macho-bytes
