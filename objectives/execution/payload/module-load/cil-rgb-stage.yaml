defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1620
composite_rules:
  - id: cil-bitmap-loaded-type-instantiation
    desc: Instantiates types from pixel-hidden managed code
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/steganography/image::cil-rgb-bitmap-assembly-stage
      - id: micro-behaviors/metaprogramming/reflection::activator
      - id: metadata/binary/symbols/name/token::dotnet-create-instance-method-name

  # Iterator extraction can fill a field in a separate method. The field is
  # converted to an array, loaded and its indexed type used in initialization.
  # Combine the validated PE carrier, indexed-call layout and activation
  # references. This is a static co-occurrence signature, not a flow proof.
  - id: cil-bitmap-field-loaded-type-instantiation
    desc: Bitmap PE beside field-backed managed type activation
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/steganography/image::dotnet-bitmap-column-pe-concealment
      - id: metadata/binary/instruction/sequence::cil-field-indexed-result-array-call
      - id: micro-behaviors/metaprogramming/reflection::activator
      - id: metadata/binary/symbols/name/token::dotnet-create-instance-method-name
