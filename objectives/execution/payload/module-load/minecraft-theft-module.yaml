defaults:
  platforms: [windows, unix]
  for: [class, jar]
traits:
  - id: reflective-full-theft-entrypoint
    desc: Reflective full-theft module entrypoint string
    crit: suspicious
    conf: 0.98
    for: [class]
    if:
      type: value
      path: class.strings[*]
      exact: performFullTheft
composite_rules:
  - id: minecraft-token-remote-theft-module
    desc: Minecraft token handoff with remote theft-module activation
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: reflective-full-theft-entrypoint
      - id: objectives/credential-access/gaming/minecraft::minecraft-token-jar-handoff
      - id: micro-behaviors/communications/http/lib/httpclient::java-httpclient-send
