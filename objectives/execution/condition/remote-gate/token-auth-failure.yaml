defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1204.002,T1485
  mbc: B0025

composite_rules:
  - id: remote-auth-failure-payload-gate
    desc: Remote token authorization failure gates payload execution
    crit: hostile
    conf: 0.98
    # The claim is a causal gate: one code region that checks a token, sees
    # 401, and destroys data in that branch. The legs are ordinary capability
    # facts, and without a proximity bound they pool anywhere in a file --
    # a CI server's user-facing token-validation endpoint (reports "Invalid
    # token (HTTP 401)"), and a janitorial tmp-artifact rmtree thousands of
    # lines away scored hostile together. One code region is a few dozen
    # lines, not a module.
    near_lines: 80
    all:
      - id: micro-behaviors/communications/http/response::http-status-unauthorized-check
      - id: micro-behaviors/communications/http/token-auth::github-api-token-live-check
    any:
      - id: micro-behaviors/fs/delete/directory::home-directory-wipe
      - id: micro-behaviors/fs/delete/directory::shutil-rmtree
      - id: micro-behaviors/fs/delete/file/library::fs-rmSync
    unless:
      - id: well-known/tool/detection/
