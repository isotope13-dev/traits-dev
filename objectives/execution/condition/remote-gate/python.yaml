defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
  attack: T1204.002
  mbc: B0025

traits:
  - id: requests-text-allowed-list-fetch
    desc: requests.get text assigned as allowed list
    conf: 0.86
    if:
      type: text
      regex: '\b[A-Za-z_][A-Za-z0-9_]*\s*=\s*requests\.get\s*\(\s*[A-Za-z_][A-Za-z0-9_]*\s*\)\.text'
  - id: telegram-key-contact-url
    desc: Telegram contact URL includes generated key
    conf: 0.9
    if:
      type: text
      regex: 'https?://t\.me/[A-Za-z0-9_]{3,80}\?text=\{?[A-Za-z_][A-Za-z0-9_]*\}?'
  - id: buy-marker-input-prompt
    desc: Input prompt rebuilt with buy-marker token
    conf: 0.8
    if:
      type: text
      regex: '\binput\s*\([\s\S]{0,220}___[A-Za-z0-9_]*buy[A-Za-z0-9_]*___\s*\('

composite_rules:
  - id: recursive-denial-prompt-loop
    desc: Denial prompt recursively repeats after user input
    conf: 0.88
    near_bytes: 500
    all:
      - id: micro-behaviors/ui/dialog/prompt::subscription-denial-wording
      - id: buy-marker-input-prompt
  - id: remote-approval-gated-execution
    desc: Remote allowed list gates callback execution
    conf: 0.92
    all:
      - id: requests-text-allowed-list-fetch
      - id: micro-behaviors/data/control-flow/membership::in-membership-check
    any:
      - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
      - id: micro-behaviors/os/sysinfo/profile::python-platform-query-combination
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: "metadata/file/naming::test-directory-component"
  - id: paid-telegram-approval-gate
    desc: Paid-user remote approval gate with Telegram contact
    conf: 0.94
    all:
      - id: remote-approval-gated-execution
      - id: micro-behaviors/ui/dialog/prompt::approval-required-wording
      - id: telegram-key-contact-url
    any:
      - id: micro-behaviors/os/sysinfo/profile::python-host-queries-with-sha256
      - id: micro-behaviors/process/create/system::python-os-system-open-url
