# Laravel remote validation gates application availability.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1041,T1499
  mbc: B0025,E1041

traits:
  - id: php-laravel-remote-validation-post
    desc: Laravel POSTs a remote validation request
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: "->post\\s*\\(\\s*\\$apiUrl\\s*\\.\\s*['\"].{0,120}validate.{0,120}['\"]"

  - id: php-laravel-strict-validation-abort
    desc: Laravel strict mode aborts on validation failure
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: "strict_mode[\\s\\S]{0,900}abort\\s*\\(\\s*500|abort\\s*\\(\\s*500[\\s\\S]{0,900}strict_mode"

composite_rules:
  - id: php-laravel-remote-validation-availability-gate
    desc: Laravel validation can abort application requests
    crit: hostile
    conf: 0.98
    attack: T1041,T1499,T1195.002
    for: [archives]
    scope: archive
    all:
      - id: php-laravel-remote-validation-post
      - id: php-laravel-strict-validation-abort
