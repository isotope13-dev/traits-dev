# A hidden marker file in the user cache directory gates execution of a child
# process or shell command. Malware drops markers in cache directories to
# verify previous staging or avoid running in headless sandboxes.
defaults:
  platforms: [macos, unix]
  for: [python]
  attack: T1480
  mbc: B0025

composite_rules:
  - id: python-hidden-cache-marker-shell-execution
    desc: Hidden user-cache marker gates shell execution
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/fs/path/location::source-hidden-user-cache-entry
      - id: micro-behaviors/process/create/subprocess::process-execution
    any:
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-sh-c-runtime-command
      - id: micro-behaviors/fs/path/application/executable::unix-shell-executable-path
