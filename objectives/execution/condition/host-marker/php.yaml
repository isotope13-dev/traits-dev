# Run-once gate keyed on the machine: a marker file named from a host-name
# digest is dropped in the temp directory and its presence short-circuits the
# payload on every later load. Installers write markers too, but they name
# them after the product, not after a hash of the host, and they do not put
# them in the system temp directory.
defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1480

composite_rules:
  - id: host-digest-temp-marker-gate
    desc: Host-name digest marker in temp gates execution
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/os/sysinfo/hostname::php-hostname-digest
      - id: micro-behaviors/fs/temp/directory::sys-get-temp-dir
      - id: micro-behaviors/fs/file/timestamp::php-touch-call

  - id: hostname-crypto-digest-execution-gate
    desc: Compares CryptoAPI hostname digest with target hash
    crit: suspicious
    conf: 0.95
    platforms: [windows]
    for: [c, cpp]
    attack: T1480.001
    all:
      - id: micro-behaviors/os/sysinfo/hostname::get-computer-name
      - id: micro-behaviors/crypto/provider::crypt-acquire-context
      - id: micro-behaviors/data/buffer/alloc::fixed-thirtytwo-byte-array
      - id: micro-behaviors/data/embedded/payload/array::portable-hex-byte-array-literal
      - id: micro-behaviors/mem/compare::native-buffer-cmp-call
