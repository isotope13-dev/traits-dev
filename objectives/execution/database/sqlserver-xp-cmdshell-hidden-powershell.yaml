# A procedure that enables xp_cmdshell and relays a variable command into a
# hidden PowerShell window is operator tooling for command execution from the
# database service, not routine administration.
defaults:
  for: [text, scripts, source]
  platforms: [windows]

composite_rules:
  - id: sqlserver-xp-cmdshell-hidden-powershell
    desc: SQL enables xp_cmdshell and relays variable to hidden PowerShell
    crit: hostile
    conf: 0.95
    attack: T1505.001,T1059.001
    near_lines: 12
    all:
      - id: micro-behaviors/data/db/config::sqlserver-enable-xp-cmdshell
      - id: micro-behaviors/process/create/shell/command-mode::sqlserver-xp-cmdshell-variable-command
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
