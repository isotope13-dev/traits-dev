defaults:
  for: [text]
  platforms: [windows]

composite_rules:
  - id: sqlserver-embedded-unsafe-clr
    desc: Embedded PE and unsafe CLR procedure with strict security disabled
    crit: suspicious
    near_lines: 20
    all:
      - id: metadata/file/encoding/hex::sqlserver-nvarchar-mz
      - id: micro-behaviors/data/db/schema/stored-code::sqlserver-unsafe-clr-assembly
      - id: micro-behaviors/data/db/schema/stored-code::sqlserver-external-clr-procedure
      - id: micro-behaviors/data/db/security::sqlserver-disable-clr-strict-security
