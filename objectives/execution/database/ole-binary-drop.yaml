defaults:
  platforms: [windows]
  for: [text, vbs]
composite_rules:
  - id: sqlserver-embedded-executable-launch
    desc: SQL OLE stages hex MZ data beside hidden executable launch
    crit: hostile
    conf: 0.98
    attack: T1059.003,T1027.009
    near_lines: 30
    all:
      - id: metadata/file/encoding/hex::sqlserver-varbinary-mz
      - id: micro-behaviors/fs/write/stream::adodb-stream-progid
      - id: micro-behaviors/fs/write/stream::sqlserver-ole-write-variable
      - id: micro-behaviors/fs/write/stream::sqlserver-ole-save-executable
      - id: micro-behaviors/os/com/instantiation::sqlserver-ole-wscript-shell
      - id: micro-behaviors/os/com/invoke::sqlserver-ole-hidden-executable
