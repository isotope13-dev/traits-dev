defaults:
  for: [text]
  platforms: [windows]
  crit: hostile
  conf: 0.98

composite_rules:
  - id: sqlserver-xp-concealed-download
    desc: xp_cmdshell beside HTTP executable download and hidden launch
    near_lines: 6
    all:
      - id: micro-behaviors/process/create/shell/command-mode::sqlserver-xp-cmdshell-invocation
      - id: micro-behaviors/communications/http/download/webclient::downloadfile-http-url-text
      - id: micro-behaviors/communications/http/download/webclient::ps-downloadfile-exe-dll
      - id: micro-behaviors/process/create/hidden::start-process-hidden-window-option

  - id: sqlserver-agent-concealed-download
    desc: SQL Agent PowerShell step with concealed executable delivery
    near_lines: 10
    all:
      - id: sqlserver-agent-download-execute
      - id: micro-behaviors/communications/http/download/webclient::downloadfile-http-url-text
      - id: micro-behaviors/process/create/hidden::start-process-hidden-window-option

  - id: sqlserver-ole-concealed-download
    desc: SQL OLE shell beside executable download and hidden launch
    near_lines: 12
    all:
      - id: sqlserver-ole-shell-execution
      - id: micro-behaviors/communications/http/download/webclient::downloadfile-http-url-text
      - id: micro-behaviors/communications/http/download/webclient::ps-downloadfile-exe-dll
      - id: micro-behaviors/process/create/hidden::start-process-hidden-window-option
