# Database-hosted execution: a shell command returns file bytes through SQL.
# No sensitive source or unauthorized destination is established, so this is
# suspicious rather than a claim of confirmed theft.
defaults:
  for: [scripts, source, text, data]
  platforms: [windows]
  attack: T1041
composite_rules:
  - id: xp-cmdshell-file-chunks
    desc: SQL executes shell to return file chunks
    crit: suspicious
    conf: 0.97
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/create/shell/database::sqlserver-xp-windows-command
      - id: micro-behaviors/fs/read/file/full::powershell-file-readallbytes
      - id: micro-behaviors/data/encode/base64::powershell-base64-byte-slice
      - id: micro-behaviors/process/fd/stdio::powershell-console-writeline
