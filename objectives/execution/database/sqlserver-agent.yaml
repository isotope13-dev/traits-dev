defaults:
  platforms: [windows]
  for: [text]
composite_rules:
  - id: sqlserver-agent-download-execute
    desc: SQL Agent PowerShell step downloads an executable and starts a process
    crit: suspicious
    attack: T1059.001,T1105
    near_lines: 10
    all:
      - id: micro-behaviors/data/db/query::sqlserver-agent-add-jobstep
      - id: micro-behaviors/data/db/query::sqlserver-agent-powershell-subsystem
      - id: micro-behaviors/communications/http/download/webclient::ps-downloadfile-exe-dll
      - id: micro-behaviors/process/create/cmdlet::sql-command-start-process
