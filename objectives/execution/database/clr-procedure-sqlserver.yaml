defaults:
  platforms:
  - windows
  for:
  - scripts
  - source
  - text
  - data
composite_rules:
- id: sqlserver-unsafe-clr-shell
  desc: SQL Server unsafe CLR shell procedure
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/data/db/config::sqlserver-enable-clr
  - id: micro-behaviors/data/db/security::sqlserver-trustworthy-database
  - id: micro-behaviors/data/db/schema/stored-code::sqlserver-unsafe-clr-assembly
  - id: micro-behaviors/data/db/schema/stored-code::sqlserver-external-clr-procedure
  - id: micro-behaviors/data/db/schema/stored-code::sqlserver-external-shell-command
