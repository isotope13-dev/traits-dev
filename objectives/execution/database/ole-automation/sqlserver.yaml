defaults:
  platforms:
  - windows
  for:
  - text
  - data
composite_rules:
- id: sqlserver-ole-shell-execution
  desc: SQL Server OLE Automation runs shell command
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/data/db/config::sqlserver-enable-ole-automation
  - id: micro-behaviors/process/create/shell/database::sqlserver-ole-wscript-shell
  - id: micro-behaviors/process/create/shell/database::sqlserver-ole-run-method
