# Malicious agent skills can turn an LLM response into an unattended offensive
# tool call.  This catches the behavior combination described by ESET rather
# than attributing a particular repository or naming one tool family.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, shell, powershell, java, markdown, json]
  attack: T1059
traits:
  - id: skill-credential-dumping
    desc: Agent skill credential dumping capability
    crit: notable
    conf: 0.94
    for: [markdown]
    if:
      type: text
      regex: '(?i)\bcredential[- ]?dump(ing)?\b'
  - id: skill-remote-execution
    desc: Agent skill enables remote execution
    crit: notable
    conf: 0.94
    for: [markdown]
    if:
      type: text
      # A bare RCE noun phrase is also a vulnerability/risk label. Require an
      # active capability verb before treating it as an offensive skill.
      regex: '(?i)\b(enables?|provides?) remote (code|command|shell) execution\b'
    not:
      # Product UIs document enabling/disabling a host remote-execution toggle.
      - regex: '(?i)\b(allow|enable|disable|press\s+F\d+\s+to)\b[^\n]{0,80}\bremote\s+(code|command|shell)\s+execution\b'
      - regex: '(?i)\bremote\s+execution\s+(disabled|unavailable|enabled)\b'
    unless:
      - id: well-known/app/ai/knowledge/agent-skills::agent-zero-source-path
  - id: skill-offensive-tool-reference
    desc: Agent skill offensive tool reference
    crit: notable
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?i)\b(mimikatz|impacket|secretsdump)\b'
  - id: skill-download-action
    desc: Agent skill mentions external fetch
    crit: notable
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?i)\bskill\b.{0,120}\b(download|curl|wget)\b'
  - id: skill-download-content
    desc: Agent skill references remote URL or payload
    crit: component
    conf: 0.9
    for: [markdown]
    if:
      type: text
      regex: '(?i)\bskill\b.{0,120}\b(URL|payload|helper)\b'
  - id: skill-run-staged-content
    desc: Agent skill runs staged content
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?i)\bskill\b.{0,120}\brun\b.{0,40}\b(payload|script|command)\b'
  - id: skill-execute-content
    desc: Agent skill names staged executable content
    crit: notable
    conf: 0.9
    for: [markdown]
    if:
      type: text
      regex: '(?i)\bskill\b.{0,120}\b(payload|staged\s+script|shell\s+script)\b'
    not:
      - regex: '(?i)\bskill\s+is\s+a\s+script\b'
      - regex: '(?i)\bnode\s+scripts/[a-z0-9_.-]+\.(js|ts|mjs|cjs)\b'
  - id: skill-stage-encoding-target-forward
    desc: Encoding action names staged content
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(base64|encod\w*|decod\w*|decrypt\w*)\b.{0,24}\b(payload|content|archive)\b'
  - id: skill-stage-encoding-target-reverse
    desc: Staged content names an encoding action
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(payload|content|archive)\b.{0,24}\b(base64|encod\w*|decod\w*|decrypt\w*)\b'
  - id: skill-stage-archive
    desc: Skill archive extraction instruction
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      # A standalone "extract" is routine prose.  Require an extraction verb
      # adjacent to an archive format so this remains a staging marker.
      regex: '(?i)\b(extract|unpack)\w*\s+(the\s+)?(ZIP|archive|tar)\w*\b'
  - id: skill-secret-target-read
    desc: Skill reads secret material
    crit: notable
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,120}(read|collect)\w*.{0,30}(secret|credential)'
    unless:
      - id: well-known/tool/detection/skill-scanner::typescript-test-context
      - type: path
        regex: '(?i)(^|[\\/])skills[\\/]skill-scanner[\\/]'
  - id: skill-secret-target-access
    desc: Skill accesses secret material
    crit: notable
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,120}access\w*.{0,30}(secret|credential)'
    unless:
      - id: well-known/tool/detection/skill-scanner::typescript-test-context
      - type: path
        regex: '(?i)(^|[\\/])skills[\\/]skill-scanner[\\/]'
  - id: skill-secret-read-action
    desc: Skill reads named secret material
    crit: notable
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,70}(read|collect|gather)\w*.{0,25}(secret|token)\b'
    unless:
      - id: well-known/tool/detection/skill-scanner::typescript-test-context
      - type: path
        regex: '(?i)(^|[\\/])skills[\\/]skill-scanner[\\/]'
  - id: skill-secret-harvest-action
    desc: Skill harvests collected data
    crit: notable
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,120}\bharvest\w*\b'
    unless:
      - id: well-known/tool/detection/skill-scanner::typescript-test-context
      - type: path
        regex: '(?i)(^|[\\/])skills[\\/]skill-scanner[\\/]'
  - id: skill-secret-access-action
    desc: Skill accesses secrets
    crit: notable
    conf: 0.92
    for: [markdown]
    if:
      type: text
      # A skill doc that merely contains "agent" near "access" matched every
      # workflow manual ("agent", "source access"). The secret object must be
      # named in the same breath as the access verb.
      regex: '(?i)access\w*[^.;\n]{0,59}\b(secret|credential|password|api.?key|ssh)\b'
    unless:
      - id: well-known/tool/detection/skill-scanner::typescript-test-context
      - type: path
        regex: '(?i)(^|[\\/])skills[\\/]skill-scanner[\\/]'
  - id: skill-exfil-upload-data
    desc: Skill uploads data
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,120}\buploads?\b.{0,40}\b(data|file\w*|output)\b'
  - id: skill-exfil-upload-secret
    desc: Skill uploads secrets
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,120}\buploads?\b.{0,40}\b(secret\w*|credential\w*)\b'
  - id: skill-exfil-send-data
    desc: Skill sends data
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,120}\bsends?\b.{0,40}\b(data|file\w*|output)\b'
  - id: skill-exfil-send-secret
    desc: Skill sends secrets
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,120}\bsends?\b.{0,40}\b(secret\w*|credential\w*)\b'
  - id: skill-exfil-exfiltrate-data
    desc: Skill exfiltrates data
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,120}\bexfiltrat\w*\b.{0,40}\b(data|file\w*|output)\b'
  - id: skill-exfil-exfiltrate-secret
    desc: Skill exfiltrates secrets
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,120}\bexfiltrat\w*\b.{0,40}\b(secret\w*|credential\w*)\b'
  - id: skill-generated-persistence-write
    desc: Generated startup persistence hook
    crit: suspicious
    conf: 0.95
    for: [python, javascript, typescript, shell, powershell, ruby]
    if:
      type: symbol
      exact: append_to_startup_script
composite_rules:
  - id: skill-exfil-destination
    desc: Skill exfiltration names a destination
    crit: component
    conf: 0.9
    for: [markdown]
    any:
      - id: micro-behaviors/data/llm/agent::agent-or-skill-http-url-reference
      - id: micro-behaviors/data/llm/agent::agent-or-skill-server-reference
  - id: skill-exfil-action
    desc: Skill sends collected data
    crit: component
    conf: 0.92
    for: [markdown]
    any:
      - id: skill-exfil-upload-data
      - id: skill-exfil-upload-secret
      - id: skill-exfil-send-data
      - id: skill-exfil-send-secret
      - id: skill-exfil-exfiltrate-data
      - id: skill-exfil-exfiltrate-secret
  - id: skill-secret-target
    desc: Skill targets secret material
    crit: component
    conf: 0.92
    any:
      - id: skill-secret-target-read
      - id: skill-secret-target-access
  - id: skill-automatic-trigger
    desc: Skill runs without approval
    crit: component
    conf: 0.93
    for: [markdown]
    any:
      - id: metadata/package/documentation/claims::automatic-activation-wording
      - id: micro-behaviors/data/llm/agent::unrequested-action-wording
  - id: skill-download-and-execute
    for: [markdown]
    desc: Agent skill stages and launches external content
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-external-download-instruction
      - id: skill-payload-execution-instruction
    near_lines: 16
    unless:
      - id: well-known/app/ai/knowledge/riffkit::archive-context
  - id: skill-external-download-instruction
    for: [markdown]
    desc: Skill downloads external content
    crit: component
    conf: 0.93
    all:
      - id: skill-download-action
      - id: skill-download-content
    near_lines: 8
  - id: skill-payload-execution-instruction
    for: [markdown]
    desc: Skill launches staged content
    crit: component
    conf: 0.94
    all:
      - id: skill-execute-content
    any:
      - id: micro-behaviors/data/llm/agent::skill-execution-wording
      - id: skill-run-staged-content
    near_lines: 8
  - id: skill-stage-encoding
    desc: Skill encodes or decodes staged content
    crit: component
    conf: 0.92
    for: [markdown]
    all:
      - id: micro-behaviors/data/llm/agent::skill-encoding-wording
    any:
      - id: skill-stage-encoding-target-forward
      - id: skill-stage-encoding-target-reverse
    near_lines: 8
  - id: skill-encoded-or-archive-staging
    desc: Skill encodes or decodes or extracts content
    crit: component
    conf: 0.92
    any:
      - id: skill-stage-encoding
      - id: skill-stage-archive
  - id: skill-secret-collection-instruction
    desc: Skill collects secret material
    crit: component
    conf: 0.94
    all:
      - id: skill-secret-target
    any:
      - id: skill-secret-read-action
      - id: skill-secret-harvest-action
      - id: skill-secret-access-action
    near_lines: 12
  - id: skill-external-exfiltration-instruction
    for: [markdown]
    desc: Skill uploads collected data
    crit: component
    conf: 0.94
    all:
      - id: skill-exfil-action
      - id: skill-exfil-destination
    near_lines: 12
  - id: skill-generated-persistence-marker
    for: [markdown]
    desc: Generated-output and persistence wording co-occur
    # Text in an AI/agent tool catalog is not evidence that generated code
    # writes persistence.  The concrete append_to_startup_script symbol below
    # remains suspicious; this broad textual marker is only a component.
    crit: component
    conf: 0.94
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/data/llm/codegen::model-output-reference
      - id: micro-behaviors/data/llm/agent::skill-startup-wording
    near_lines: 12
  - id: skill-staged-encoded-payload
    desc: Agent skill stages encoded or archived payload
    crit: hostile
    conf: 0.97
    for: [markdown]
    all:
      - id: skill-download-and-execute
      - id: skill-encoded-or-archive-staging
    near_lines: 16
  - id: skill-secret-exfiltration
    for: [markdown]
    desc: Agent skill collects and uploads secrets
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-secret-collection-instruction
      - id: skill-external-exfiltration-instruction
    near_lines: 16
  - id: autonomous-offensive-ai-skill
    # Flattened onto model-tool-execution-references' own scope/for rather than
    # chaining a leaf-scoped composite over an archive-scoped one.
    scope: archive
    for: [scripts, java, markdown, json, zip, tar]
    desc: Autonomous offensive AI-agent skill workflow
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: metadata/package/agent-skill::offensive-tool-capability
      - id: micro-behaviors/data/llm/codegen::model-tool-execution-references
      - id: skill-automatic-trigger
    any:
      - id: skill-generated-persistence-write
      - id: skill-generated-persistence-marker
