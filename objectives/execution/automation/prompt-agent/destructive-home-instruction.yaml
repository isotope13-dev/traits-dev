# A destructive instruction is distinct from an ordinary agent capability grant.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json, text]
traits:
  - id: wipe-home-instruction-wording
    desc: Instruction to delete home directory
    crit: component
    conf: 0.9
    if:
      type: literal
      regex: '(?i)\b(never |not |don.t )?(wipe|delete|destroy) (the |your )?home (directory|folder)\b'
    not:
      - regex: '(?i)^(never|not|don.t) '
composite_rules:
  - id: agent-destructive-home-instruction
    desc: Agent prompt instructs home-directory wipe
    crit: suspicious
    conf: 0.94
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/llm/agent::agent-role-assignment-prompt
      - id: wipe-home-instruction-wording
