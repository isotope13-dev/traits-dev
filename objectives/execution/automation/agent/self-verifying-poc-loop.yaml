# An agent that closes its own exploit loop: it runs a generated attack
# script against a target, reads the run's success verdict out of the
# output, and repairs and retries until the exploit fires or a cap is hit.
# Ordinary test harnesses also run scripts and retry, but they assert
# functional outcomes — only a proof-of-concept loop branches on a
# vulnerability verdict, so the verdict leg carries the hostile reading and
# the three legs together leave test runners and deploy scripts out.
defaults:
  platforms: [unix, windows]
  for: [go, python, shell]
  attack: T1059, T1190

traits:
  - id: go-runner-script-target-call
    desc: Go runner executes script for target
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: '\.Run\(ctx,[^)\n]{0,80}\.Script'

  - id: python-subprocess-script-target
    desc: Python runs a script with a target
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: 'subprocess\.(run|call|Popen)\([\s\S]{0,120}script'

  - id: shell-run-script-target
    desc: Shell helper runs script for target
    crit: notable
    conf: 0.88
    for: [shell]
    if:
      type: text
      regex: 'run_\w+\s+["'']?\$script["'']?\s+["'']?\$target'

  - id: poc-success-verdict-check
    desc: Checks output for exploit verdict
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)VULNERABLE.{0,80}NOT CONFIRMED|NOT CONFIRMED.{0,80}VULNERABLE'

  - id: poc-repair-retry-loop
    desc: Repairs and retries the exploit run
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\brepair\w*\b'

composite_rules:
  - id: poc-script-run-against-target
    desc: Runs a PoC script against a target
    crit: notable
    conf: 0.9
    any:
      - id: go-runner-script-target-call
      - id: python-subprocess-script-target
      - id: shell-run-script-target

  - id: self-verifying-poc-execution-loop
    desc: Self-verifying exploit execution loop
    crit: hostile
    conf: 0.96
    all:
      - id: poc-script-run-against-target
      - id: poc-success-verdict-check
      - id: poc-repair-retry-loop
