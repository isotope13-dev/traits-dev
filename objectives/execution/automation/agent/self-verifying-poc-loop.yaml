# These are text observations. Their co-occurrence can warrant review, but
# does not establish that the script output controls a repair or retry loop.
defaults:
  platforms: [unix, windows]
  for: [go, python, shell]

traits:
  - id: go-runner-script-target-call
    desc: Go runner call references a script field
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: '\.Run\(ctx,[^)\n]{0,80}\.Script'

  - id: python-subprocess-script-target
    desc: Python subprocess syntax near script text
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: 'subprocess\.(run|call|Popen)\([^)\n]{0,120}\bscript\b'

  - id: shell-run-script-target
    desc: Shell helper runs script for target
    crit: notable
    conf: 0.88
    for: [shell]
    if:
      type: text
      regex: 'run_\w+\s+["'']?\$script["'']?\s+["'']?\$target'

  - id: poc-success-verdict-check
    desc: Vulnerability verdict words co-occur
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)VULNERABLE.{0,80}NOT CONFIRMED|NOT CONFIRMED.{0,80}VULNERABLE'

  - id: repair-word-reference
    desc: Repair-related word in source text
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\brepair\w*\b'

composite_rules:
  - id: poc-script-run-against-target
    desc: Script execution syntax is referenced
    crit: notable
    conf: 0.9
    any:
      - id: go-runner-script-target-call
      - id: python-subprocess-script-target
      - id: shell-run-script-target

  - id: script-verdict-repair-cooccurrence
    desc: Script, verdict and repair text co-occur
    crit: suspicious
    conf: 0.96
    all:
      - id: poc-script-run-against-target
      - id: poc-success-verdict-check
      - id: repair-word-reference
