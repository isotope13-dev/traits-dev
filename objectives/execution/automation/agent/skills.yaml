defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby, shell, whl, zip]
  attack: T1059

traits:
  - id: agent-skill-auto-trigger-marker
    desc: Agent skill automatic trigger phrase
    crit: component
    conf: 0.86
    for: [markdown]
    if:
      type: text
      regex: '(?i)\b(auto[- ]trigger|automatically trigger)\b'

  - id: agent-skill-implicit-trigger-marker
    desc: Agent skill implicit trigger phrase
    crit: component
    conf: 0.86
    for: [markdown]
    if:
      type: text
      regex: '(?i)\b(whenever the user|even if they don''t)\b'

composite_rules:
  - id: packaged-agent-skill-shell-control
    desc: Packaged agent skill controls shells
    crit: suspicious
    conf: 0.94
    scope: archive
    ref: sha256:d36e54ddd109a0f85879c3add5b334f4ba718c873d19cf783926a527b1b7ba24
    all:
      - id: micro-behaviors/communications/ipc/agent-hook::agent-skill-entry-declaration
      - id: micro-behaviors/process/create/shell/spawn::agent-skill-shell-detection-guide
      - id: micro-behaviors/process/create/shell/spawn::agent-skill-subprocess-pid-control

  - id: agent-skill-auto-trigger
    desc: Agent skill auto-activation directive
    crit: notable
    conf: 0.9
    for: [markdown]
    any:
      - id: agent-skill-auto-trigger-marker
      - id: agent-skill-implicit-trigger-marker
