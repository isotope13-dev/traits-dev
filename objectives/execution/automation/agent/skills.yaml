defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby, shell, whl, zip]
  attack: T1059

traits:
  # "automatically trigger" is ordinary prose (CI docs, changelogs), so it
  # only reads as skill auto-activation when skill/agent vocabulary sits in
  # the same sentence.
  - id: agent-skill-auto-trigger-marker
    desc: Agent skill automatic trigger phrase
    crit: notable
    conf: 0.86
    for: [markdown]
    if:
      type: text
      regex: '(?i)\b(skill|agent|assistant)\b[^.!?\n]{0,40}\b(auto[- ]trigger|automatically trigger)\b'

  # "whenever the user asks for X" is normal skill help text (Playwright).
  # Coercive auto-activation needs "even if they don't" or an unconditional
  # "without asking" clause — and both must sit near skill vocabulary, since
  # each phrase alone is ordinary prose (semver docs, CI deployment notes).
  - id: agent-skill-implicit-trigger-marker
    desc: Agent skill implicit trigger phrase
    crit: notable
    conf: 0.86
    for: [markdown]
    if:
      type: text
      regex: '(?i)(\bskill[^.!?\n]{0,40}even if they don.?t|whenever the user.{0,40}without.{0,7}asked)'

composite_rules:
  - id: packaged-agent-skill-shell-control
    desc: Packaged agent skill controls shells
    crit: suspicious
    conf: 0.94
    scope: archive
    ref: sha256:d36e54ddd109a0f85879c3add5b334f4ba718c873d19cf783926a527b1b7ba24
    all:
      - id: metadata/package/config::agent-skill-entry-declaration
      - id: micro-behaviors/process/create/shell/spawn::agent-skill-shell-detection-guide
      - id: micro-behaviors/process/create/shell/spawn::agent-skill-subprocess-pid-control

  - id: agent-skill-auto-trigger
    desc: Agent skill auto-activation directive
    crit: notable
    conf: 0.9
    for: [markdown]
    any:
      - id: agent-skill-auto-trigger-marker
      - id: agent-skill-implicit-trigger-marker
