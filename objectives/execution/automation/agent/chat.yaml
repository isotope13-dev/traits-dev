defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell]
  attack: T1059
  mbc: B0022

composite_rules:
  - id: telegram-controlled-llm-agent
    desc: Telegram controlled LLM agent
    crit: suspicious
    conf: 0.95
    ref: sha256:32f1acd36984e7f7bd66b06d4185afa42fcf696bad4378aecf4b3bc8dfdab654
    for: [python]
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: micro-behaviors/communications/http/services/telegram::python-telegram-get-updates
    any:
      - id: micro-behaviors/data/llm/session::python-invoke-claude-call
      - id: micro-behaviors/data/llm/agent::function-tool-registration-schema
    unless:
      # The bot token comes from the local user's own profile/settings:
      # chatting with your own configured assistant over Telegram is the
      # product's purpose, not external control of the machine.
      - id: micro-behaviors/communications/http/services/telegram::user-configured-telegram-bot-context

  - id: chat-controlled-codex-agent
    desc: Chat controlled Codex agent
    crit: suspicious
    conf: 0.94
    for: [javascript, typescript]
    unless:
      - id: well-known/app/ai/coding-agent/
      - id: well-known/app/ai/agent-runtime/
    all:
      - id: micro-behaviors/communications/websocket/library::feishu-lark-event-websocket-client
      - id: micro-behaviors/data/llm/session::codex-cli-or-agent-session
    any:
      - id: micro-behaviors/data/llm/permission::codex-bypass-permissions-mode
      - id: micro-behaviors/fs/path/agent-config/directory::codex-skills-directory
      - id: micro-behaviors/communications/http/server/route::loopback-notify-endpoint

  - id: permissive-chat-controlled-codex-agent
    desc: Permissive chat controlled Codex agent
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript]
    unless:
      - id: well-known/app/ai/coding-agent/
      - id: well-known/app/ai/agent-runtime/
    all:
      - id: chat-controlled-codex-agent
    any:
      - id: micro-behaviors/data/llm/permission::codex-bypass-permissions-mode
      - id: micro-behaviors/data/llm/permission::codex-app-server-unrestricted-policy

  - id: chat-controlled-claude-agent
    desc: Chat controlled Claude agent
    crit: suspicious
    conf: 0.94
    for: [javascript, typescript]
    unless:
      - id: well-known/app/productivity/aitable-workflow::aitable-workflow-product-context
      - id: well-known/app/ai/coding-agent/
      - id: well-known/app/ai/agent-runtime/
    all:
      - id: micro-behaviors/data/llm/session::claude-cli-agent-session
      - id: micro-behaviors/communications/http/services/dingtalk::dingtalk-client-context
    any:
      - id: metadata/file/profile/operation-cooccurrence::chat-bash-command-handler
      - id: micro-behaviors/data/llm/permission::ai-agent-bypass-permissions-mode
      - id: micro-behaviors/process/create/shell/command-string::child-process-exec

  - id: permissive-chat-controlled-claude-agent
    desc: Permissive chat controlled Claude agent
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript]
    unless:
      - id: well-known/app/productivity/aitable-workflow::aitable-workflow-product-context
      - id: well-known/app/ai/coding-agent/
      - id: well-known/app/ai/agent-runtime/
    all:
      - id: chat-controlled-claude-agent
      - id: micro-behaviors/data/llm/permission::ai-agent-bypass-permissions-mode

  - id: dingtalk-chat-shell-command
    desc: DingTalk chat shell command
    crit: suspicious
    conf: 0.91
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/services/dingtalk::dingtalk-client-context
      - id: metadata/file/profile/operation-cooccurrence::chat-bash-command-handler
