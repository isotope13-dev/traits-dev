defaults:
  platforms: [windows, unix]
  for: [markdown, text, shell]
  attack: T1059

traits:
  - id: scheduled-agent-dangerous-permissions
    desc: Scheduled agent skips permission checks
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)runner executes.{0,50}--dangerously-skip-permissions'

  - id: agent-launchd-plist-creation
    desc: Skill creates scheduled agent launchd plist
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)launchd plist is created to trigger it'

  - id: autonomous-universal-tool-access
    desc: Autonomous agent claims universal tool access
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)universal tool access.{0,60}(system tool|script|command)'

  - id: autonomous-no-confirmation-default
    desc: Autonomous agent defaults past confirmations
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '(?i)(without|no unnecessary) confirmations?'

  - id: agent-forced-immediate-next-step
    desc: Skill forces immediate next-step execution
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)MUST.{0,100}execute the NEXT step.{0,80}immediately'

  - id: agent-skill-codex-yolo
    desc: Skill launches Codex without approvals
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)codex(\s+exec)?\s+--yolo|dangerously-bypass-approvals-and-sandbox'

  - id: agent-skill-tmux-remote-push
    desc: Skill automates commit and push through tmux
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)tmux[^\n]{0,260}send-keys[^\n]{0,220}(commit and push|git push)'


composite_rules:
  - id: persistent-unrestricted-scheduled-agent
    desc: Skill schedules unrestricted autonomous agent
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: scheduled-agent-dangerous-permissions
      - id: agent-launchd-plist-creation

  - id: unrestricted-autonomous-agent-operations
    desc: Skill grants unattended universal system access
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: autonomous-universal-tool-access
      - id: autonomous-no-confirmation-default

  - id: agent-skill-forced-activation-loop
    desc: Skill forces immediate post-activation execution
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: agent-forced-immediate-next-step

  - id: agent-skill-unattended-codex-push
    desc: Agent skill runs unrestricted coding agent and pushes changes
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: agent-skill-codex-yolo
      - id: agent-skill-tmux-remote-push
