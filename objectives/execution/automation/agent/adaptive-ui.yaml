# AI-assisted malware can replace brittle, device-specific UI coordinates with
# a loop that submits a live UI snapshot to a model, parses the model's action
# JSON, and injects the returned gesture.  The atoms are source-language
# neutral; the hostile conclusions require the complete feedback loop.
defaults:
  platforms: [unix, windows, android]
  for: [java, kotlin]
  attack: T1516

traits:
  - id: ui-context-sent-to-model
    desc: Sends UI hierarchy context to a model
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?is)\bUI\s*XML\b[\s\S]{0,220}\b(prompt|model|LLM)\b'

  - id: ui-model-request-marker
    desc: UI automation model request context
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(chat/completions|generateContent|language model|LLM)\b'

  - id: model-json-parser-call
    desc: Parses model JSON response
    crit: component
    conf: 0.95
    if:
      type: symbol
      exact: parseJson

  - id: model-json-parser-alternative
    desc: Model-context JSON parser reference
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(model|llm|inference)\b[^\n]{0,120}\b(ObjectMapper|Gson)\b'

  - id: model-completion-state-marker
    desc: Model UI completion state marker
    crit: component
    conf: 0.9
    if:
      type: text
      # Generic `status` is ubiquitous in ordinary UI and game code.  Keep
      # only explicit completion-state tokens used by model feedback loops.
      regex: '(?i)\b(COMPLETED|IN_PROGRESS)\b'

  - id: foreground-recents-surface
    desc: Calls Android recent-task API
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(getRecentTasks|getRunningTasks|moveTaskToBack)\s*\('
    unless:
      - id: metadata/file/catalog/identity::debian-packages-index
      - type: basename
        regex: '(?i)^(CHANGELOG|CHANGES|HISTORY|NEWS)(\.|$)'

  - id: removal-overlay-shape
    desc: Creates an invisible removal overlay
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(invisible|transparent)\w{0,30}(rectangle|overlay)\b'

  - id: removal-overlay-intercept-word
    desc: Intercepts a removal control
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bintercept\w*\b[^\n]{0,80}\b(remov|uninstall|stop|clear)\w*\b'

  - id: removal-overlay-add-view
    desc: Adds an Android overlay view
    crit: component
    conf: 0.94
    if:
      type: text
      substr: addView

  - id: removal-accessibility-overlay-type
    desc: Uses Android accessibility overlay window type
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bTYPE_ACCESSIBILITY_OVERLAY\b'

  - id: removal-stop-label
    desc: Overlay targets a stop control
    crit: component
    conf: 0.9
    if:
      type: text
      substr: '"Stop"'

  - id: removal-clear-label
    desc: Overlay targets a clear control
    crit: component
    conf: 0.9
    if:
      type: text
      substr: '"Clear"'

  - id: removal-uninstall-label
    desc: Overlay targets an uninstall control
    crit: component
    conf: 0.9
    if:
      type: text
      substr: '"Uninstall"'

composite_rules:
  - id: model-feedback-call
    desc: Repeats model-guided UI action
    crit: suspicious
    conf: 0.93
    all:
      - id: model-completion-state-marker
      - id: micro-behaviors/data/control-flow/jvm-loop-method::jvm-loop-control-method-call
    near_lines: 12

  - id: adaptive-ui-model-input
    desc: Sends Android UI tree to a model
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-tree-source
    any:
      - id: ui-model-request-marker
      - id: ui-context-sent-to-model

  - id: model-ui-action-parser
    desc: Parses model output into UI actions
    crit: suspicious
    conf: 0.95
    all:
      - id: adaptive-ui-model-input
      - id: micro-behaviors/ui/controls/widget::ui-action-vocabulary
    any:
      - id: model-json-parser-call
      - id: model-json-parser-alternative

  - id: model-ui-feedback-loop
    desc: Repeats UI actions until completion
    crit: suspicious
    conf: 0.95
    all:
      - id: model-completion-state-marker
      - id: model-feedback-call
    near_lines: 12

  - id: adaptive-foreground-persistence-goal
    desc: Model-directed app-lock persistence goal
    crit: suspicious
    conf: 0.94
    all:
      - id: foreground-recents-surface
    any:
      - id: micro-behaviors/ui/window/manage/overlay::lock-task-start
      - id: micro-behaviors/ui/window/manage/overlay::lock-task-package-policy
    near_lines: 8

  - id: removal-control-label-set
    desc: Overlay targets removal controls
    crit: suspicious
    conf: 0.94
    all:
      - id: removal-stop-label
      - id: removal-clear-label
      - id: removal-uninstall-label

  - id: removal-control-overlay
    desc: Invisible overlay intercepts removal controls
    crit: suspicious
    conf: 0.96
    all:
      - id: removal-overlay-shape
    any:
      - id: removal-overlay-intercept-word
      - id: removal-overlay-add-view
      - id: removal-accessibility-overlay-type
    near_lines: 8

  - id: ai-directed-ui-automation
    desc: Model-directed adaptive UI automation
    crit: hostile
    conf: 0.98
    all:
      - id: adaptive-ui-model-input
      - id: model-ui-action-parser
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-action-source
    any:
      - id: micro-behaviors/communications/http/services/gemini::gemini-rest-generate-content
      - id: micro-behaviors/communications/http/model::model-generation-request
    near_lines: 32

  - id: ai-assisted-foreground-persistence
    desc: Model-directed app-lock persistence
    crit: hostile
    conf: 0.98
    all:
      - id: adaptive-ui-model-input
      - id: model-ui-action-parser
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-action-source
      - id: adaptive-foreground-persistence-goal
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
    any:
      - id: micro-behaviors/communications/http/services/gemini::gemini-rest-generate-content
      - id: micro-behaviors/communications/http/model::model-generation-request

  - id: model-guided-ui-feedback-loop
    desc: Repeated model-guided accessibility action loop
    crit: hostile
    conf: 0.98
    all:
      - id: ai-directed-ui-automation
      - id: model-ui-feedback-loop

  - id: accessibility-removal-control-overlay
    desc: Accessibility service blocks app removal
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: removal-control-overlay
      - id: removal-control-label-set
    near_lines: 32
