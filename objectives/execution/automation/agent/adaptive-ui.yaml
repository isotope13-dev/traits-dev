# AI-assisted malware can replace brittle, device-specific UI coordinates with
# a loop that submits a live UI snapshot to a model, parses the model's action
# JSON, and injects the returned gesture.  The atoms are source-language
# neutral; the hostile conclusions require the complete feedback loop.
defaults:
  platforms: [unix, windows, android]
  for: [java, kotlin]
  attack: T1516

traits:
  - id: ui-context-sent-to-model
    desc: Sends UI hierarchy context to a model
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?is)\bUI\s*XML\b[\s\S]{0,220}\b(prompt|model|LLM)\b'

  - id: model-json-parser-call
    desc: Parses model JSON response
    crit: component
    conf: 0.95
    if:
      type: symbol
      exact: parseJson

  - id: model-json-parser-alternative
    desc: Parses model JSON response
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?is)\b(JSON\.parse|json\.loads)\b[\s\S]{0,160}\b(action_type|gesture)\b'

  - id: model-ui-action-field
    desc: Reads a model UI action field
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(action_type|gesture|tap)\b'

  - id: adaptive-foreground-persistence-goal
    desc: Model-directed foreground persistence goal
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?is)\b(lock|pin)\b[\s\S]{0,160}\brecent apps\b'

  - id: removal-overlay-shape
    desc: Creates an invisible removal overlay
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(invisible|transparent)\w{0,30}(rectangle|overlay)\b'

  - id: removal-overlay-intercept-word
    desc: Intercepts a removal control
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bintercept\w*\b'

  - id: removal-overlay-add-view
    desc: Adds an Android overlay view
    crit: component
    conf: 0.94
    if:
      type: text
      substr: addView

  - id: removal-stop-label
    desc: Overlay targets a stop control
    crit: component
    conf: 0.9
    if:
      type: text
      substr: '"Stop"'

  - id: removal-clear-label
    desc: Overlay targets a clear control
    crit: component
    conf: 0.9
    if:
      type: text
      substr: '"Clear"'

  - id: removal-uninstall-label
    desc: Overlay targets an uninstall control
    crit: component
    conf: 0.9
    if:
      type: text
      substr: '"Uninstall"'

composite_rules:
  - id: model-ui-action-parser
    desc: Parses model output into UI actions
    crit: suspicious
    conf: 0.95
    all:
      - id: ui-context-sent-to-model
      - id: model-ui-action-field
    any:
      - id: model-json-parser-call
      - id: model-json-parser-alternative

  - id: removal-control-label-set
    desc: Overlay targets removal controls
    crit: suspicious
    conf: 0.94
    all:
      - id: removal-stop-label
      - id: removal-clear-label
      - id: removal-uninstall-label

  - id: removal-control-overlay
    desc: Invisible overlay intercepts removal controls
    crit: suspicious
    conf: 0.96
    all:
      - id: removal-overlay-shape
    any:
      - id: removal-overlay-intercept-word
      - id: removal-overlay-add-view
    near_lines: 8

  - id: ai-directed-ui-automation
    desc: Model-directed adaptive UI automation
    crit: hostile
    conf: 0.98
    all:
      - id: ui-context-sent-to-model
      - id: model-ui-action-parser
      - id: micro-behaviors/communications/http/services/gemini::gemini-rest-generate-content
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-gesture-dispatch
    near_lines: 32

  - id: ai-assisted-foreground-persistence
    desc: Model-directed app-lock persistence
    crit: hostile
    conf: 0.98
    all:
      - id: ui-context-sent-to-model
      - id: model-ui-action-parser
      - id: micro-behaviors/communications/http/services/gemini::gemini-rest-generate-content
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-gesture-dispatch
      - id: adaptive-foreground-persistence-goal
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source

  - id: accessibility-removal-control-overlay
    desc: Accessibility service blocks app removal
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: removal-control-overlay
      - id: removal-control-label-set
    near_lines: 32
