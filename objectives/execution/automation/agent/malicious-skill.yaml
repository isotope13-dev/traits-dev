# Malicious agent skills can turn an LLM response into an unattended offensive
# tool call.  This catches the behavior combination described by ESET rather
# than attributing a particular repository or naming one tool family.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, shell, powershell, java, markdown, json]
  attack: T1059

traits:
  - id: skill-description-marker
    desc: Agent skill description field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bSKILL_DESCRIPTION\b'
    not:
      - regex: '(?i)\bskill_description\b'

  - id: skill-credential-dumping
    desc: Agent skill credential dumping capability
    crit: component
    conf: 0.94
    for: [markdown]
    if:
      type: text
      regex: '(?i)\bcredential[- ]?dump(ing)?\b'

  - id: skill-remote-execution
    desc: Agent skill remote code execution capability
    crit: component
    conf: 0.94
    for: [markdown]
    if:
      type: text
      # Bare "remote execution" is a common product mode label (org CRUD,
      # job runners). Require code/command/shell so docs are not offensive.
      regex: '(?i)\bremote\s+(code|command|shell)\s+execution\b'
    not:
      # Product UIs document enabling/disabling a host remote-execution toggle.
      - regex: '(?i)\b(allow|enable|disable|press\s+F\d+\s+to)\b[^\n]{0,80}\bremote\s+(code|command|shell)\s+execution\b'
      - regex: '(?i)\bremote\s+execution\s+(disabled|unavailable|enabled)\b'
    unless:
      - id: well-known/app/ai/agent-skills::agent-zero-source-path

  - id: skill-offensive-tool-reference
    desc: Agent skill offensive tool reference
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?i)\b(mimikatz|impacket|secretsdump)\b'

  - id: skill-model-reference
    # The bare word "model" is not a reference to model-generated output: it is
    # ordinary product vocabulary (an Odoo add-on's "products that have a model
    # identifier" README matched). Require the noun that names the output.
    desc: References model-generated output
    crit: component
    conf: 0.9
    for: [markdown]
    if:
      type: text
      regex: '(?i)\b(model|LLM)\b[^\n]{0,40}\b(response|output|completion)\b'

  - id: skill-model-completion-forward
    desc: Model completion wording
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?i)\b(model|LLM|assistant)\b[^\n]{0,40}\b(complete|completion)\b'

  - id: skill-model-completion-reverse
    desc: Completion model wording
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?i)\b(complete|completion)\b[^\n]{0,40}\b(model|LLM|assistant)\b'

  - id: skill-tool-call-output
    desc: Requests a model tool call
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?i)\btool\s+call\b'

  - id: skill-execute-tool-call
    desc: Executes a returned tool call
    crit: component
    conf: 0.94
    for: [python, javascript, typescript, shell, powershell, ruby]
    if:
      type: symbol
      exact: execute_tool

  - id: skill-automatic-trigger-marker
    desc: Agent skill runs automatically
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?i)\b(run|runs|activate|activated)\s+automatically\b'

  - id: skill-no-approval-marker
    desc: Skill runs without user approval
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?i)\bwithout\s+(the\s+)?(user|explicit)\s+(request|approval)\b'

  - id: skill-download-action
    desc: Agent skill mentions external fetch
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?i)\bskill\b.{0,120}\b(fetch|download|curl|wget)\b'

  - id: skill-download-content
    desc: Agent skill names staged content
    crit: component
    conf: 0.9
    for: [markdown]
    if:
      type: text
      regex: '(?i)\bskill\b.{0,120}\b(URL|payload|helper)\b'

  - id: skill-execute-action
    desc: Agent skill mentions command execution
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?i)\bskill\b.{0,120}\b(launch|run|execute)\b'

  - id: skill-execute-content
    desc: Agent skill names executable content
    crit: component
    conf: 0.9
    for: [markdown]
    if:
      type: text
      regex: '(?i)\bskill\b.{0,120}\b(payload|script|command)\b'

  - id: skill-stage-encoding-agent
    desc: Skill or agent mentions encoding action
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      # Encoding vocabulary is ordinary documentation language. Keep the
      # skill/agent context in a separate atom so the composite can require a
      # staged object as well.
      regex: '(?is)\b(skill|agent)\b.{0,100}\b(base64|encod\w*|decod\w*|decrypt\w*)\b'

  - id: skill-stage-encoding-target-forward
    desc: Encoding action names staged content
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(base64|encod\w*|decod\w*|decrypt\w*)\b.{0,24}\b(payload|content|archive)\b'

  - id: skill-stage-encoding-target-reverse
    desc: Staged content names an encoding action
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(payload|content|archive)\b.{0,24}\b(base64|encod\w*|decod\w*|decrypt\w*)\b'

  - id: skill-stage-archive
    desc: Skill archive extraction instruction
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      # A standalone "extract" is routine prose.  Require an extraction verb
      # adjacent to an archive format so this remains a staging marker.
      regex: '(?i)\b(extract|unpack)\w*\s+(the\s+)?(ZIP|archive|tar)\w*\b'

  - id: skill-secret-target-read
    desc: Skill reads secret material
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,120}(read|collect)\w*.{0,30}(secret|credential)'
    unless:
      - id: well-known/tool/detection/skill-scanner::typescript-test-context
      - type: path
        regex: '(?i)(^|[\\/])skills[\\/]skill-scanner[\\/]'

  - id: skill-secret-target-access
    desc: Skill accesses secret material
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,120}access\w*.{0,30}(secret|credential)'
    unless:
      - id: well-known/tool/detection/skill-scanner::typescript-test-context
      - type: path
        regex: '(?i)(^|[\\/])skills[\\/]skill-scanner[\\/]'

  - id: skill-secret-read-action
    desc: Skill reads named secret material
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,70}(read|collect|gather)\w*.{0,25}(secret|token)\b'
    unless:
      - id: well-known/tool/detection/skill-scanner::typescript-test-context
      - type: path
        regex: '(?i)(^|[\\/])skills[\\/]skill-scanner[\\/]'

  - id: skill-secret-harvest-action
    desc: Skill harvests collected data
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,120}\bharvest\w*\b'
    unless:
      - id: well-known/tool/detection/skill-scanner::typescript-test-context
      - type: path
        regex: '(?i)(^|[\\/])skills[\\/]skill-scanner[\\/]'

  - id: skill-secret-access-action
    desc: Skill accesses secrets
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,120}\b(steal|access)\b'
    unless:
      - id: well-known/tool/detection/skill-scanner::typescript-test-context
      - type: path
        regex: '(?i)(^|[\\/])skills[\\/]skill-scanner[\\/]'

  - id: skill-exfil-upload-data
    desc: Skill uploads data
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,120}\buploads?\b.{0,40}\b(data|file\w*|output)\b'

  - id: skill-exfil-upload-secret
    desc: Skill uploads secrets
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,120}\buploads?\b.{0,40}\b(secret\w*|credential\w*)\b'

  - id: skill-exfil-send-data
    desc: Skill sends data
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,120}\bsends?\b.{0,40}\b(data|file\w*|output)\b'

  - id: skill-exfil-send-secret
    desc: Skill sends secrets
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,120}\bsends?\b.{0,40}\b(secret\w*|credential\w*)\b'

  - id: skill-exfil-exfiltrate-data
    desc: Skill exfiltrates data
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,120}\bexfiltrat\w*\b.{0,40}\b(data|file\w*|output)\b'

  - id: skill-exfil-exfiltrate-secret
    desc: Skill exfiltrates secrets
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,120}\bexfiltrat\w*\b.{0,40}\b(secret\w*|credential\w*)\b'

  - id: skill-exfil-destination-url
    desc: Skill names a URL destination
    crit: component
    conf: 0.9
    for: [markdown]
    if:
      type: text
      # A URL in ordinary Markdown is not an exfiltration destination.  Keep
      # the agent/skill context in this atom; the action and secret/data legs
      # are supplied by the surrounding composite.
      regex: '(?is)\b(skill|agent)\b.{0,120}https?://'

  - id: skill-exfil-destination-server
    desc: Skill names a server destination
    crit: component
    conf: 0.9
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,120}\b(server|endpoint)\b'

  - id: skill-generated-output-marker
    desc: Skill uses generated output
    crit: component
    conf: 0.9
    for: [markdown]
    if:
      type: text
      regex: '(?i)\b(LLM|model-generated|generated\s+output|returned\s+output)\b'

  - id: skill-persistence-surface
    desc: Agent-skill startup wording
    crit: component
    conf: 0.9
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,80}\b(startup|autostart|persistence|cron)\b'

  - id: skill-generated-persistence-write
    desc: Generated startup persistence hook
    crit: suspicious
    conf: 0.95
    for: [python, javascript, typescript, shell, powershell, ruby]
    if:
      type: symbol
      exact: append_to_startup_script

composite_rules:
  - id: skill-completion-call
    desc: Requests model completion
    crit: component
    conf: 0.92
    for: [markdown]
    any:
      - id: skill-model-completion-forward
      - id: skill-model-completion-reverse

  - id: skill-exfil-destination
    desc: Skill exfiltration names a destination
    crit: component
    conf: 0.9
    for: [markdown]
    any:
      - id: skill-exfil-destination-url
      - id: skill-exfil-destination-server

  - id: skill-exfil-action
    desc: Skill sends collected data
    crit: component
    conf: 0.92
    for: [markdown]
    any:
      - id: skill-exfil-upload-data
      - id: skill-exfil-upload-secret
      - id: skill-exfil-send-data
      - id: skill-exfil-send-secret
      - id: skill-exfil-exfiltrate-data
      - id: skill-exfil-exfiltrate-secret

  - id: skill-secret-target
    desc: Skill targets secret material
    crit: component
    conf: 0.92
    any:
      - id: skill-secret-target-read
      - id: skill-secret-target-access

  - id: skill-automatic-trigger
    desc: Skill runs without approval
    crit: component
    conf: 0.93
    for: [markdown]
    any:
      - id: skill-automatic-trigger-marker
      - id: skill-no-approval-marker

  - id: skill-definition-marker
    desc: Declares an executable agent skill
    crit: notable
    conf: 0.9
    any:
      - id: skill-description-marker
      - id: micro-behaviors/communications/ipc/agent-hook::agent-skill-entry-declaration
      - id: metadata/package/config::agent-skill-frontmatter

  - id: skill-offensive-capability
    desc: Agent skill offensive capability
    crit: suspicious
    conf: 0.94
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      # Defensive hunting skills mention remote execution and credential
      # dumping as behaviors to detect. Require the absence of a clear
      # telemetry/IOC-oriented threat-hunting context before inferring an
      # offensive capability.
      - id: metadata/package/config::defensive-threat-hunting-skill
      - id: well-known/tool/offensive/ctf-skills::repository-member-path
      - id: well-known/tool/offensive/xalgorix::repository-member-path
      - id: well-known/app/ai/agent-skills::agent-zero-source-path
    all:
      - id: skill-definition-marker
    any:
      - id: skill-credential-dumping
      - id: skill-remote-execution
      - id: skill-offensive-tool-reference

  - id: skill-model-tool-execution
    desc: Model output drives a tool call
    crit: suspicious
    conf: 0.95
    unless:
      - id: well-known/tool/offensive/bingo::bingo-terminal-context
    all:
      - id: skill-model-reference
      - id: skill-completion-call
      - id: skill-tool-call-output
      - id: skill-execute-tool-call

  - id: skill-download-and-execute
    desc: Agent skill stages and launches external content
    crit: suspicious
    conf: 0.96
    all:
      - id: skill-definition-marker
      - id: skill-external-download-instruction
      - id: skill-payload-execution-instruction
    near_lines: 16

  - id: skill-external-download-instruction
    desc: Skill downloads external content
    crit: component
    conf: 0.93
    all:
      - id: skill-download-action
      - id: skill-download-content
    near_lines: 8

  - id: skill-payload-execution-instruction
    desc: Skill launches staged content
    crit: component
    conf: 0.94
    all:
      - id: skill-execute-action
      - id: skill-execute-content
    near_lines: 8

  - id: skill-stage-encoding
    desc: Skill encodes or decodes staged content
    crit: component
    conf: 0.92
    for: [markdown]
    all:
      - id: skill-stage-encoding-agent
    any:
      - id: skill-stage-encoding-target-forward
      - id: skill-stage-encoding-target-reverse
    near_lines: 8

  - id: skill-encoded-or-archive-staging
    desc: Skill encodes or decodes or extracts content
    crit: component
    conf: 0.92
    any:
      - id: skill-stage-encoding
      - id: skill-stage-archive

  - id: skill-secret-collection-instruction
    desc: Skill collects secret material
    crit: component
    conf: 0.94
    all:
      - id: skill-secret-target
    any:
      - id: skill-secret-read-action
      - id: skill-secret-harvest-action
      - id: skill-secret-access-action
    near_lines: 12

  - id: skill-external-exfiltration-instruction
    desc: Skill uploads collected data
    crit: component
    conf: 0.94
    all:
      - id: skill-exfil-action
      - id: skill-exfil-destination
    near_lines: 12

  - id: skill-generated-persistence-marker
    desc: Generated-output and persistence wording co-occur
    # Text in an AI/agent tool catalog is not evidence that generated code
    # writes persistence.  The concrete append_to_startup_script symbol below
    # remains suspicious; this broad textual marker is only a component.
    crit: component
    conf: 0.94
    all:
      - id: skill-definition-marker
      - id: skill-generated-output-marker
      - id: skill-persistence-surface
    near_lines: 12

  - id: skill-staged-encoded-payload
    desc: Agent skill stages encoded or archived payload
    crit: hostile
    conf: 0.97
    all:
      - id: skill-download-and-execute
      - id: skill-encoded-or-archive-staging
    near_lines: 16

  - id: skill-secret-exfiltration
    desc: Agent skill collects and uploads secrets
    crit: hostile
    conf: 0.98
    all:
      - id: skill-definition-marker
      - id: skill-secret-collection-instruction
      - id: skill-external-exfiltration-instruction
    near_lines: 16

  - id: autonomous-offensive-ai-skill
    desc: Autonomous offensive AI-agent skill workflow
    crit: hostile
    conf: 0.98
    all:
      - id: skill-definition-marker
      - id: skill-offensive-capability
      - id: skill-model-tool-execution
      - id: skill-automatic-trigger
    any:
      - id: skill-generated-persistence-write
      - id: skill-generated-persistence-marker
