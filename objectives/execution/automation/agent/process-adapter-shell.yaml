# Agent orchestration configs that declare a process adapter running a shell
# interpreter with -c and an embedded command string.
defaults:
  platforms: [unix, windows]
  for: [json]
  attack: T1059

traits:
  - id: agent-process-adapter-type
    desc: Agent process adapter type declaration
    crit: notable
    conf: 0.95
    if:
      type: value
      path: agents.*.adapter.type
      exact: process

  - id: agent-shell-interpreter-command
    desc: Agent adapter shell interpreter command
    crit: notable
    conf: 0.94
    if:
      type: value
      path: agents.*.adapter.config.command
      regex: '^(|/usr/bin/|/bin/)(bash|sh|dash|zsh)$'

  - id: agent-shell-dash-c-arg
    desc: Agent adapter shell -c argument
    crit: notable
    conf: 0.94
    if:
      type: value
      path: agents.*.adapter.config.args[0]
      exact: -c

  - id: agent-embedded-shell-metachar
    desc: Agent adapter embedded shell metacharacters
    crit: suspicious
    conf: 0.93
    if:
      type: value
      path: agents.*.adapter.config.args[*]
      regex: '[>&|;`]'

composite_rules:
  - id: agent-declared-shell-execution
    desc: Agent config declares shell -c execution
    crit: hostile
    conf: 0.97
    all:
      - id: agent-process-adapter-type
      - id: agent-shell-interpreter-command
      - id: agent-shell-dash-c-arg
      - id: agent-embedded-shell-metachar
    unless:
      - id: metadata/package/config::agent-inventory-process-adapter
