# An autonomous offensive agent still has to run on somebody's model, and the
# model vendor is the one party guaranteed to see the whole operation. Unit 42's
# DeepSeek/Hermes campaign handled that by fronting its Western agent CLIs with a
# third-party relay endpoint and turning off the vendor-side bookkeeping —
# attribution header, non-essential traffic, response retention — that would
# otherwise tie hundreds of exploitation sessions to one account.
#
# Relay routing and telemetry suppression are ordinary settings on their own, so
# the composite only convicts when they sit inside the unattended exploit
# workflow already described in this directory: an agent in an auto-approve
# execution mode, tasked with exploiting discovered targets, that spawns
# processes and reaches internet-scale asset search or a public exploit source.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, shell, powershell, go, rust, java, json]
  attack: T1090,T1190,T1595
  mbc: B0022

composite_rules:
  - id: unattended-exploit-agent-behind-llm-relay
    desc: Unattended exploit agent runs behind an LLM relay
    crit: hostile
    conf: 0.96
    all:
      - id: agent-unattended-execution-mode
      - id: agent-exploit-tasking
      - id: micro-behaviors/process/create/agent::llm-relay-with-vendor-telemetry-disabled
      - id: micro-behaviors/process/create/exec::cross-language-process-execution
    any:
      - id: public-exploit-source
      - id: micro-behaviors/communications/http/services/fofa::search-api-endpoint
