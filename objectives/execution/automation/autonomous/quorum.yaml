# CLOSEDQUORUM-class tasking: instead of a C2 server, the implant polls
# several hosted AI models with host facts and a fixed menu of attack
# actions, keeps only strict-format answers, executes the plurality winner,
# and reports the decision plus each model's reason to a webhook. Staged
# loot follows the same channel in fixed-size pieces, one post per second.
#
# The atoms below stay language-local; the composites convict only when the
# quorum mechanics, the offensive action set, and the reporting channel
# coincide, so a benign multi-model router or a plain Discord notifier
# cannot reach them.
defaults:
  platforms: [unix, windows]
  for: [python, powershell]

traits:
  # PowerShell has no dict-map dispatch idiom; the same surface is a switch
  # statement whose cases are steal/inject/persist labels. Attacker-chosen
  # labels, so this atom only describes the dispatch shape; the composite
  # supplies the quorum context that makes it hostile.
  - id: powershell-offensive-action-switch
    desc: PowerShell switch has offensive case
    crit: notable
    conf: 0.94
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bswitch\b[\s\S]{0,800}["''](steal|inject|persist)["'']'

composite_rules:
  # The core technique: several model providers consulted, one vote each,
  # plurality winner dispatched to pre-implemented attack handlers.
  - id: ai-quorum-offensive-dispatch
    desc: AI model quorum vote dispatches offensive actions
    crit: hostile
    conf: 0.97
    attack: T1102.003
    near_bytes: 8000
    all:
      - id: micro-behaviors/communications/http/llm::multiple-chat-completions-urls
    any:
      - id: micro-behaviors/data/control-flow/branch::python-decision-counter
      - id: micro-behaviors/data/control-flow/branch::powershell-group-vote-selection
      - id: python-offensive-action-map
      - id: powershell-offensive-action-switch
    needs: 2

  # The operator-visibility half: the winning decision and each model's
  # stated reason are posted to a webhook before/during execution, so the
  # channel is both C2 reporting and the exfil path for stolen data.
  - id: ai-quorum-decision-webhook-report
    desc: Voted AI decision and reasons reported to webhook
    crit: hostile
    conf: 0.95
    attack: T1567.002
    near_bytes: 8000
    all:
      - id: micro-behaviors/communications/http/webhook::generic-webhook-url
      - id: micro-behaviors/data/llm/decision::model-action-reason-schema
    any:
      - id: micro-behaviors/data/control-flow/branch::python-decision-counter
      - id: micro-behaviors/data/control-flow/branch::powershell-group-vote-selection
      - id: python-offensive-action-map
      - id: powershell-offensive-action-switch
    needs: 2

  # The exfil half: staged loot leaves in fixed-size pieces with a fixed
  # one-second pace between posts, keeping every request small.
  - id: chunked-throttled-webhook-exfil
    desc: Fixed-size chunks trickled to a webhook
    crit: hostile
    conf: 0.93
    attack: T1041
    near_bytes: 2000
    any:
      - id: micro-behaviors/data/buffer/chunk::python-fixed-step-chunk-loop
      - id: micro-behaviors/data/buffer/chunk::powershell-fixed-step-chunk-loop
      - id: micro-behaviors/time/sleep/interval::python-sleep-1s-plus-arg
      - id: micro-behaviors/time/sleep/interval::ps-one-second-sleep
      - id: micro-behaviors/communications/http/upload::python-post-content-field
      - id: micro-behaviors/communications/http/webhook::webhook-post-method-field
    needs: 3
