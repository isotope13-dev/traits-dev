# Runtime LLM controllers differ from ordinary scanners because the model
# chooses the next operational action, observes the result, and retries or
# changes paths without a human selecting each step.  The atoms stay generic;
# offensive intent is established only by the composite.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, go, rust, lua, powershell, shell]
  attack: T1059,T1587.004

traits:
  - id: llm-recon-stage
    desc: LLM reconnaissance stage
    crit: component
    conf: 0.9
    if:
      type: text
      # Keep reconstruction/reconstructed prose out of reconnaissance.
      regex: '(?i)\brecon(naiss\w*)?\b'

  - id: llm-enumeration-stage
    desc: LLM enumeration stage
    crit: notable
    conf: 0.9
    if:
      type: text
      # Enumeration alone describes ordinary APIs and documentation.  Keep
      # this atom tied to a model/controller marker on the same source line.
      regex: '(?i)\b(llm|agent|model)\b.{0,60}\benumerat\w*\b'

  - id: llm-network-scan-stage
    desc: LLM network scan stage
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(network|port)\s+scan\w*\b'

  - id: llm-exploit-vulnerability
    desc: LLM vulnerability exploitation stage
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bexploit\w*\s+(a\s+|the\s+)?vulnerabilit\w*\b'

  - id: llm-exploit-host-target
    desc: LLM host exploitation stage
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bexploit\w*\s+(a\s+|the\s+)?(host|service|target)\b'

  - id: llm-credential-harvest
    desc: LLM credential harvest stage
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bcredential\s+(harvest\w*|dump\w*)\b'

  - id: llm-credential-theft
    desc: LLM credential theft stage
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bcredential\s+(theft|steal\w*)\b'
    unless:
      - id: micro-behaviors/data/llm/decision::offensive-action-schema

  - id: llm-lateral-movement
    desc: LLM lateral movement stage
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\blateral\s+movement\b'
    unless:
      - id: micro-behaviors/data/llm/decision::offensive-action-schema

  - id: llm-exfiltration-data
    desc: LLM data exfiltration stage
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bexfiltrat\w*\s+(data|file|secret)\b'

  - id: llm-encryption-data
    desc: LLM file encryption stage
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bencrypt\w*\s+(file|data|document)\b'

  - id: llm-ransomware-stage
    desc: LLM ransomware stage
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bransom\w*\b'

  - id: llm-next-action-directive
    desc: LLM next-action directive
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bnext\s+(action|command|step)\b'

  - id: llm-prior-failure
    desc: Controller records a failed prior action
    crit: notable
    conf: 0.9
    for: [python, javascript, typescript, go, rust, lua, powershell]
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^(previous|prior|last)[_-](step|action|attempt)[_-](failed|failure)$'

  - id: llm-alternative-step
    desc: Controller selects an alternative action
    crit: notable
    conf: 0.9
    for: [python, javascript, typescript, go, rust, lua, powershell]
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^(alternative|alternate)[_-](action|step|command)$'

  # Two attack-purpose cases in one dispatch surface. Requiring executable
  # switch/map syntax avoids matching prose that merely lists capabilities.
  - id: python-theft-action-handler
    desc: Python maps a theft action
    crit: component
    conf: 0.97
    for: [python]
    if:
      type: text
      regex: '["''](steal|harvest|exfil\w*|dump[-_]\w+)["'']\s*:\s*[A-Za-z_]\w*'

  - id: switch-theft-action-case
    desc: Switch contains a theft action case
    crit: component
    conf: 0.97
    for: [go, javascript, typescript, java, kotlin, csharp]
    if:
      type: text
      regex: '\bcase\s*["''](steal|harvest|exfil\w*|dump[-_]\w+)["'']\s*:'

  - id: python-intrusion-action-handler
    desc: Python maps an intrusion action
    crit: component
    conf: 0.97
    for: [python]
    if:
      type: text
      regex: '["''](inject|hollow|persist|encrypt)["'']\s*:\s*[A-Za-z_]\w*'

  - id: switch-intrusion-action-case
    desc: Switch contains an intrusion action case
    crit: component
    conf: 0.97
    for: [go, javascript, typescript, java, kotlin, csharp]
    if:
      type: text
      regex: '\bcase\s*["''](inject|hollow|persist|encrypt)["'']\s*:'

composite_rules:
  - id: python-offensive-action-map
    desc: Python map joins offensive action handlers
    crit: suspicious
    conf: 0.97
    for: [python]
    near_lines: 12
    all:
      - id: python-theft-action-handler
      - id: python-intrusion-action-handler

  - id: switch-offensive-action-set
    desc: Switch joins multiple offensive action cases
    crit: suspicious
    conf: 0.97
    for: [go, javascript, typescript, java, kotlin, csharp]
    near_lines: 24
    all:
      - id: switch-theft-action-case
      - id: switch-intrusion-action-case

  - id: offensive-action-handler-set
    desc: Dispatch table exposes offensive handlers
    crit: suspicious
    conf: 0.97
    any:
      - id: python-offensive-action-map
      - id: switch-offensive-action-set

  - id: model-directed-offensive-action-dispatch
    for: [python, go, javascript, typescript]
    desc: Model response selects offensive handler
    crit: hostile
    conf: 0.99
    near_bytes: 6000
    all:
      - id: micro-behaviors/data/control-flow/branch::model-response-action-dispatch
      - id: offensive-action-handler-set

  - id: multi-model-voted-offensive-controller
    for: [python, go, javascript, typescript]
    desc: Models vote on autonomous offensive actions
    crit: hostile
    conf: 0.99
    attack: T1059,T1102,T1587.004
    near_bytes: 8000
    all:
      - id: model-directed-offensive-action-dispatch
      - id: micro-behaviors/communications/http/llm::multiple-hosted-llm-chat-endpoints
      - id: micro-behaviors/data/control-flow/branch::structured-decision-plurality

  - id: llm-recon-indicator
    desc: LLM reconnaissance indicator
    crit: component
    conf: 0.9
    any:
      - id: llm-recon-stage
      - id: llm-enumeration-stage
      - id: llm-network-scan-stage

  - id: llm-access-stage
    desc: LLM exploitation or credential stage
    crit: component
    conf: 0.9
    any:
      - id: llm-exploit-vulnerability
      - id: llm-exploit-host-target
      - id: llm-credential-harvest
      - id: llm-credential-theft
      - id: llm-lateral-movement

  - id: llm-impact-stage
    desc: LLM exfiltration or encryption stage
    crit: component
    conf: 0.9
    any:
      - id: llm-exfiltration-data
      - id: llm-encryption-data
      - id: llm-ransomware-stage

  - id: llm-offensive-attack-plan
    desc: LLM offensive action plan
    crit: suspicious
    conf: 0.95
    all:
      - id: llm-recon-indicator
      - id: llm-next-action-directive
    any:
      - id: llm-access-stage
      - id: llm-impact-stage
    near_bytes: 1000

  - id: llm-adaptive-attack-retry
    for: [python, javascript, rust, go, lua, powershell]
    desc: LLM controller retries after failure
    crit: notable
    conf: 0.95
    all:
      - id: llm-prior-failure
      - id: llm-alternative-step
    near_bytes: 600

  - id: autonomous-offensive-llm-controller
    for: [python, javascript, rust, go, lua, powershell]
    desc: LLM response drives an adaptive offensive loop
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
      - id: micro-behaviors/process/create/eval::model-response-command-execution
      - id: llm-offensive-attack-plan
      - id: llm-adaptive-attack-retry
    near_bytes: 5000

  # A model can task an implant without returning shell text. Here the model
  # selects a constrained action and the program dispatches the corresponding
  # pre-implemented attack capability.
  - id: autonomous-offensive-llm-capability-dispatch
    for: [python, javascript, typescript, go, rust, csharp]
    desc: Model response dispatches autonomous implant capabilities
    crit: hostile
    conf: 0.99
    attack: T1102.002
    all:
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
      - id: micro-behaviors/data/llm/decision::offensive-action-schema
    any:
      - id: micro-behaviors/data/llm/decision::model-decision-capability-switch
      - id: micro-behaviors/data/llm/decision::model-decision-controller-functions
    near_bytes: 5000

  # The Taiwan operation added a swarm layer: separate agents pursued attack
  # paths concurrently while the controller retained the ability to choose a
  # new path after a failure. The delegation and parallel-dispatch atoms are
  # neutral; this composite supplies the offensive context.
  - id: autonomous-offensive-agent-swarm
    for: [python, javascript, rust, go, powershell]
    desc: Autonomous agent swarm runs adaptive offensive tasks
    crit: hostile
    conf: 0.99
    attack: T1059,T1190,T1595
    all:
      - id: micro-behaviors/process/create/workers::agent-parallel-delegation
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
      - id: micro-behaviors/process/create/eval::model-response-command-execution
      - id: objectives/execution/automation/agent::agent-exploit-tasking
      - id: llm-adaptive-attack-retry
    near_bytes: 8000

  - id: autonomous-llm-credential-exfiltration
    for: [python]
    desc: LLM controller harvests and exfiltrates secrets
    crit: hostile
    conf: 0.99
    attack: T1059,T1552.001,T1041
    all:
      - id: autonomous-offensive-llm-controller
      - id: objectives/exfiltration/stealer/env::python-environ-json-urllib-exfil
    near_bytes: 6000
