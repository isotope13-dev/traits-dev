# Runtime LLM controllers differ from ordinary scanners because the model
# chooses the next operational action, observes the result, and retries or
# changes paths without a human selecting each step.  The atoms stay generic;
# offensive intent is established only by the composite.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, go, rust, lua, powershell, shell]
  attack: T1059,T1587.004

traits:
  - id: llm-recon-stage
    desc: LLM reconnaissance stage
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(reconnaissance|enumerat\w*|scan\w*)\b'

  - id: llm-access-stage
    desc: LLM exploitation or credential stage
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(exploit\w*|credential\w*|lateral\w*)\b'

  - id: llm-impact-stage
    desc: LLM exfiltration or encryption stage
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(exfiltrat\w*|encrypt\w*|ransom\w*)\b'

  - id: llm-next-action-directive
    desc: LLM next-action directive
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(next|action|command|step)\b'

  - id: llm-prior-failure
    desc: Previous step failure marker
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(previous|last|prior)\b.{0,80}\bfail\w*\b'

  - id: llm-alternative-step
    desc: LLM controller chooses an alternative
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(adapt\w*|alternative|retry|another)\b'

composite_rules:
  - id: llm-offensive-attack-plan
    desc: LLM offensive action plan
    crit: suspicious
    conf: 0.95
    all:
      - id: llm-recon-stage
      - id: llm-next-action-directive
    any:
      - id: llm-access-stage
      - id: llm-impact-stage
    near_bytes: 1000

  - id: llm-adaptive-attack-retry
    desc: LLM controller retries after failure
    crit: notable
    conf: 0.95
    all:
      - id: llm-prior-failure
      - id: llm-alternative-step
    near_bytes: 600

  - id: autonomous-offensive-llm-controller
    desc: LLM response drives an adaptive offensive loop
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
      - id: micro-behaviors/process/create/eval::model-response-command-execution
      - id: llm-offensive-attack-plan
      - id: llm-adaptive-attack-retry
    near_bytes: 5000

  - id: autonomous-llm-credential-exfiltration
    desc: LLM controller harvests and exfiltrates secrets
    crit: hostile
    conf: 0.99
    attack: T1059,T1552.001,T1041
    all:
      - id: autonomous-offensive-llm-controller
      - id: objectives/exfiltration/stealer/credential/env::python-environ-json-urllib-exfil
    near_bytes: 6000
