defaults:
  crit: hostile
  conf: 0.96
  platforms: [linux, android]
  for: [elf]
  attack: T1106

composite_rules:
  - id: tiny-elf-direct-ip-http-execution-stager
    desc: Tiny ELF executes direct-IP HTTP staging logic
    size_max: 4096
    all:
      - id: objectives/command-and-control/beacon/network/http::direct-ip-tiny-elf-http-stager
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
    any:
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"
      - id: metadata/binary/section/header::elf-no-section-headers
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/sysadmin/unix-benign/
      - id: "metadata/file/naming::test-directory-component"
  - id: sectionless-tiny-elf-http-execution-stager
    desc: Sectionless tiny ELF executes HTTP staging logic
    size_max: 512
    all:
      - id: objectives/command-and-control/beacon/network/http::sectionless-syscall-tiny-elf-http-stager
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: metadata/binary/section/header::elf-no-section-headers
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/sysadmin/unix-benign/
      - id: "metadata/file/naming::test-directory-component"
  - id: static-uclibc-shell-resolver-execution
    desc: IoT credential-attack bot references shell and resolver
    attack: T1059.004
    all:
      - id: metadata/binary/header/identity::elf-executable-type
      - id: objectives/lateral-movement/brute-force/iot-creds::uclibc-iot-credential-attack-shell-profile
      - id: micro-behaviors/fs/path/binary::bin-sh-path-reference
      - id: micro-behaviors/fs/path/config/system::config-resolv
    unless:
      - id: well-known/tool/sysadmin/busybox::busybox-banner
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      - id: well-known/tool/sysadmin/busybox::busybox-standalone-applet
      - id: well-known/tool/sysadmin/unix-benign/
  - id: static-uclibc-prctl-shell-resolver-execution
    desc: IoT credential-attack bot includes prctl and shell references
    attack: T1059.004
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::uclibc-iot-credential-attack-shell-profile
      - id: micro-behaviors/process/control/prctl::prctl-syscall-x64
    unless:
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      - id: well-known/tool/sysadmin/unix-benign/
