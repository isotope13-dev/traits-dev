defaults:
  crit: hostile
  conf: 0.96
  platforms: [linux, android]
  for: [elf]
  attack: T1106

composite_rules:
  # The compiled-stager profile the composites below convict on: a statically
  # linked uClibc executable that also reaches a shell and the system resolver
  # configuration. BusyBox multi-calls and known-benign static Unix tools are
  # excluded; what remains is the IoT-implant staging shape.
  - id: static-uclibc-shell-resolver-access
    desc: Static uClibc ELF with shell and resolver configuration access
    crit: suspicious
    conf: 0.9
    attack: T1059.004
    all:
      - id: metadata/binary/header/identity::elf-executable-type
      - id: well-known/lib/native/uclibc::static-uclibc-string-tables
      - id: micro-behaviors/fs/path/config/system
    any:
      - id: micro-behaviors/process/interpreter/shell::bin-sh
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text
      - id: micro-behaviors/process/create/shell/spawn::system-fn
    unless:
      - id: well-known/tool/sysadmin/busybox::busybox-banner
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      # Standalone ash/hush applets lack the multi-call banner but are BusyBox.
      - id: well-known/tool/sysadmin/busybox::busybox-standalone-applet
      - id: well-known/tool/sysadmin/unix-benign/

  - id: tiny-elf-direct-ip-http-execution-stager
    desc: Tiny ELF executes direct-IP HTTP staging logic
    size_max: 4096
    all:
      - id: objectives/command-and-control/beacon/network/http::direct-ip-tiny-elf-http-stager
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
    any:
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"
      - id: metadata/binary/section/header::elf-no-section-headers
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/sysadmin/unix-benign/
      - id: "metadata/file/naming::test-directory-component"
  - id: sectionless-tiny-elf-http-execution-stager
    desc: Sectionless tiny ELF executes HTTP staging logic
    size_max: 512
    all:
      - id: objectives/command-and-control/beacon/network/http::sectionless-syscall-tiny-elf-http-stager
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: metadata/binary/section/header::elf-no-section-headers
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/sysadmin/unix-benign/
      - id: "metadata/file/naming::test-directory-component"
  - id: static-uclibc-shell-resolver-execution
    desc: Static uClibc stager couples shell and resolver access
    attack: T1059.004
    all:
      - id: metadata/binary/header/identity::elf-executable-type
      - id: static-uclibc-shell-resolver-access
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text
      - id: micro-behaviors/fs/path/config/system::config-resolv
    unless:
      - id: well-known/tool/sysadmin/busybox::busybox-banner
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      - id: well-known/tool/sysadmin/busybox::busybox-standalone-applet
      - id: well-known/tool/sysadmin/unix-benign/
  - id: static-uclibc-prctl-shell-resolver-execution
    desc: Static uClibc stager couples shell, resolver and prctl control
    attack: T1059.004
    all:
      - id: static-uclibc-shell-resolver-access
      - id: micro-behaviors/process/control/prctl::prctl-syscall-x64
    unless:
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      - id: well-known/tool/sysadmin/unix-benign/
