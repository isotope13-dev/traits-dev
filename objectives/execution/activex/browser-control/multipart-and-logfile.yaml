defaults:
  for:
  - html
  platforms:
  - windows
  conf: 0.98
  crit: suspicious
traits:
- id: multipart-filename-header-splice
  desc: Filename field splices a Content-Type header
  if:
    type: text
    regex: '(?i)filename=.{0,100}CRLF.{0,40}Content-Type:'
- id: vbs-register-overwrite-buffer
  desc: VBScript builds EIP-bearing overflow buffer
  if:
    type: text
    regex: (?is)EIP\s*=\s*unescape\(.{0,90}buf2\s*=\s*unescape
composite_rules:
- id: picturepusher-header-injection
  desc: PicturePusher posts forged multipart filename headers
  all:
  - id: multipart-filename-header-splice
  - id: micro-behaviors/data/property/assign::activex-posturl-assignment
  - id: micro-behaviors/os/com/invoke::activex-addstring-call
- id: vimpx-logfile-overflow
  desc: VImpX LogFile receives register-overwrite payload
  all:
  - id: vbs-register-overwrite-buffer
  - id: micro-behaviors/data/property/assign::activex-logfile-assign
  - id: micro-behaviors/os/com/instantiation::vimpx-clsid
- id: ebcrypt-addstring-crash
  desc: Known EBCRYPT control receives AddString crash input
  all:
  - id: micro-behaviors/os/com/invoke::addstring-single-a-call
  - id: micro-behaviors/os/com/instantiation::ebcrypt-addstring-clsid
