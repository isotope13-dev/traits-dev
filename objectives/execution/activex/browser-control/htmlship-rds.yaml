defaults:
  for: [html]
  platforms: [windows]
composite_rules:
  - id: htmlship-rds-response-save-launch
    desc: Concealed RDS HTTP-body save and shell launch
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/anti-static/obfuscation/encoding/custom::rotating-substitution-document-writer
      - id: micro-behaviors/os/com/automation::rds-dataspace-clsid
      - id: micro-behaviors/communications/http/client/response-body::htmlship-response-body-member
      - id: micro-behaviors/fs/write/file/stream::htmlship-savetofile-member
      - id: metadata/lang/encoding/shape/fragment::htmlship-shellexecute-member
