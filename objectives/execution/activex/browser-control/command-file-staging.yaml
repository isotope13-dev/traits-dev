defaults:
  for:
  - html
  platforms:
  - windows
  conf: 0.98
composite_rules:
- id: browser-command-file-staging
  desc: Unsafe browser writer stages command-bearing executable content
  crit: hostile
  all:
  - id: objectives/execution/activex/browser-control::known-unsafe-control-file-write
  - id: micro-behaviors/fs/write/file/stream::savetofile-executable-output
  any:
  - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-command-text
  - id: micro-behaviors/communications/url/scheme::hcp-protocol-uri
