defaults:
  for: [html]
  platforms: [windows]
composite_rules:
  - id: concealed-noscript-cloaked-installer
    desc: Cloaked page decodes DownloadAndInstall call
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/installer::rotating-downloadandinstall-call
      - id: objectives/anti-static/obfuscation/encoding/custom::rotating-substitution-document-writer
      - id: micro-behaviors/ui/window/html::noscript-empty-iframe
