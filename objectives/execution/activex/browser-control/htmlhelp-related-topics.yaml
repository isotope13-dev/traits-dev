defaults:
  for: [html]
  platforms: [windows]
  conf: 0.99
  attack: T1203
traits:
  - id: htmlhelp-javascript-eval-command
    crit: suspicious
    desc: HTML Help Item1 command evaluates JavaScript
    if:
      type: text
      regex: '(?i)command(;|%3b)javascript(:|%3a)eval(\(|%28)'
composite_rules:
  - id: htmlhelp-local-zone-script-abuse
    desc: HTML Help couples local CHM and JavaScript
    crit: hostile
    all:
      - id: micro-behaviors/os/com/automation::htmlhelp-hhctrl-clsid
      - id: micro-behaviors/ui/help::htmlhelp-related-topics-param
      - id: micro-behaviors/ui/help::htmlhelp-global-window-param
      - id: micro-behaviors/process/create/shellexec::htmlhelp-item1-local-chm-command
      - id: htmlhelp-javascript-eval-command
      - id: micro-behaviors/ui/controls/widget::html-object-click-call

  # Capturing assign before navigating the opener preserves a script entry
  # point while res:/mk:@MSITStore transitions reach the local help zone.
  - id: htmlhelp-opener-local-zone-exploit
    desc: HTML Help opener local-zone execution exploit
    crit: hostile
    all:
      - id: micro-behaviors/ui/window/navigation::opener-assign-method-capture
      - id: micro-behaviors/ui/window/navigation::opener-res-navigation
      - id: micro-behaviors/ui/window/navigation::msitstore-location-replace
      - id: micro-behaviors/ui/help::showhelp-call
      - id: micro-behaviors/ui/controls/widget::htmlhelp-split-shortcut-command-param
      - id: micro-behaviors/ui/controls/widget::html-object-click-call

  # (htmlhelp-shortcut-local-command-launch lives with the other HTML Help
  # chain in execution/exploit/chain/htmlhelp-script.yaml.)
