# MS00-075 / CVE-2000-1061: a web applet exposes unsafe COM objects.
# Registry mutation through this bridge supplies the unauthorized action;
# encoding, a CLSID, or an ordinary registry write alone does not convict.
defaults:
  platforms: [windows]
  for: [html, javascript]
composite_rules:
  - id: java-applet-shell-registry-bypass
    desc: Java applet selects unsafe WScript.Shell and writes registry
    crit: hostile
    conf: 0.99
    attack: T1203
    all:
      - id: micro-behaviors/os/com/automation::microsoft-java-activex-bridge-reference
      - id: micro-behaviors/os/com/automation::set-wscript-shell-clsid
      - id: micro-behaviors/os/registry/write::wscript-regwrite
      - id: micro-behaviors/ui/window/insert-html::browser-document-write-unescape
