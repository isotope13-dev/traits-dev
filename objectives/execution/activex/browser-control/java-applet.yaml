# MS00-075 / CVE-2000-1061: a web applet exposes unsafe COM objects.
# Registry mutation through this bridge supplies the unauthorized action;
# encoding, a CLSID, or an ordinary registry write alone does not convict.
defaults:
  platforms: [windows]
  for: [html, javascript]
  attack: T1203
composite_rules:
  - id: java-applet-shell-registry-bypass
    desc: Java applet selects unsafe WScript.Shell and writes registry
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/com/automation::microsoft-java-activex-bridge-reference
      - id: micro-behaviors/os/com/automation::set-wscript-shell-clsid
      - id: micro-behaviors/os/registry/write::wscript-regwrite
      # Decoders may write via an intermediate variable rather than nesting
      # unescape directly inside document.write.
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
  - id: java-applet-shell-file-execution-bypass
    desc: Java ActiveX applet writes a file and launches WSH
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/com/automation::microsoft-java-activex-bridge-reference
      - id: micro-behaviors/os/com/automation::com-create-instance-call
      - id: micro-behaviors/os/com/automation::wsh-shell-clsid
      - id: micro-behaviors/fs/write/content::unescaped-content-write
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run
  - id: java-applet-filesystem-write-bypass
    desc: Java ActiveX bridge with local file writes
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/com/automation::microsoft-java-activex-bridge-reference
      - id: micro-behaviors/os/com/automation::com-create-instance-call
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
