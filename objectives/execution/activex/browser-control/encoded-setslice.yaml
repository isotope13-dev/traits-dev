defaults:
  for: [html, javascript]
  platforms: [windows]
  conf: 0.98
traits:
  - id: decimal-xor10-setslice-overflow
    desc: "XOR-10 decimal setSlice overflow fragment"
    crit: component
    if:
      type: text
      substr: "121,111,126,89,102,99,105,111,34,58,114,61,108,108,108,108,108,108,111"
  - id: md5-xor-setslice-overflow-part-1
    desc: "MD5-XOR setSlice overflow call fragment"
    crit: component
    if:
      type: text
      substr: "%01F%1F%095%3D%11W@%1C%15%5DL6Z%5BP%5CJUAV_UT%03%04ST%1CA"
composite_rules:
  - id: decimal-xor-setslice-overflow-writer
    desc: XOR writer carries setSlice overflow code
    crit: hostile
    attack: T1203
    all:
      - id: decimal-xor10-setslice-overflow
      - id: micro-behaviors/data/decode/xor::js-array-xor-character-reconstruction
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call-text
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
  - id: md5-xor-setslice-overflow-writer
    desc: MD5-XOR writer carries setSlice overflow code
    crit: hostile
    attack: T1203
    all:
      - id: md5-xor-setslice-overflow-part-1
      - id: micro-behaviors/crypto/key/representation::md5-browser-default-passphrase
      - id: objectives/anti-static/obfuscation/encoding/xor::percent-xor-document-concealment
