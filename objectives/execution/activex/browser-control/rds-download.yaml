defaults:
  for: [html]
  platforms: [windows]
composite_rules:
  - id: rds-browser-download-save-hidden-launch
    desc: Browser RDS response save and hidden launch
    crit: hostile
    conf: 0.99
    attack: T1203,T1105
    all:
      - id: micro-behaviors/os/com/automation::rds-dataspace-clsid
      - id: micro-behaviors/communications/http/client/xmlhttp::msxml-xmlhttp-progid-text
      - id: micro-behaviors/fs/write/stream::wsh-savetofile
      - id: micro-behaviors/fs/write/stream::vbs-write-http-response-body
      - id: micro-behaviors/process/create/shellexec::shellexecute-hidden-showcmd
