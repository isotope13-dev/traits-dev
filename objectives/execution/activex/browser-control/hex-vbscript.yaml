defaults:
  for: [html]
  platforms: [windows]
composite_rules:
  - id: hex-vbscript-rds-save-launch
    desc: Hex-hidden RDS browser response save and launch
    crit: hostile
    conf: 0.99
    attack: T1203,T1105,T1059.005
    all:
      - id: micro-behaviors/os/com/automation::rds-dataspace-clsid
      - id: micro-behaviors/process/interpreter/scripting::html-vbscript-block
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
      - id: micro-behaviors/fs/write/stream::hex-vbs-write-responsebody
      - id: micro-behaviors/fs/write/stream::hex-vbs-savetofile
      - id: micro-behaviors/process/create/shellexec::hex-vbs-shellexecute
