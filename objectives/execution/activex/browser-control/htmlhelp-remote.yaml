defaults:
  for: [html]
  platforms: [windows]
composite_rules:
  - id: htmlhelp-local-zone-remote-script
    desc: HTML Help zone abuse embeds remote script
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/activex/browser-control::htmlhelp-local-zone-script-abuse
      - id: micro-behaviors/communications/http/client/resource::percent-script-http-src
      - id: micro-behaviors/ui/window/insert-html::source-unescape-then-document-write
