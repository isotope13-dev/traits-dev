defaults:
  platforms: [windows]
  for: [html, text]
  attack: T1203
composite_rules:
  - id: rawparse-shellcode-overflow
    desc: rawParse call with oversized buffer and x86 heap spray
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/parse/keywords::js-rawparse-member-call
      - id: micro-behaviors/os/com/automation::html-activex-classid-object
      - id: micro-behaviors/data/buffer/carve::js-length-bound-string-grow
      - id: objectives/execution/exploit/memory::js-native-shellcode-array-spray
  - id: dollar-decimal-rawparse-shellcode-overflow
    desc: Decimal-packed rawParse exploit fills return-address buffer
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/exploit/memory::dollar-decimal-native-shellcode-spray
      - id: micro-behaviors/data/parse/keywords::dollar-decimal-rawparse-call
      - id: micro-behaviors/data/buffer/carve::dollar-decimal-newline-buffer-fill
  - id: substitution-rawparse-shellcode-overflow
    for: [html]
    desc: Substitution-packed rawParse exploit fills return-address buffer
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/exploit/memory::substitution-native-shellcode-spray
      - id: micro-behaviors/data/parse/keywords::substitution-hex-rawparse-member
      - id: micro-behaviors/data/buffer/carve::substitution-newline-buffer-fill
