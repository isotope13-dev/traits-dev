defaults:
  for: [html]
  platforms: [windows]
  crit: notable
  conf: 0.98
composite_rules:
  - id: nested-decimal-rds-download-launch
    desc: "Nested decimal RDS download-save-launch API chain"
    crit: hostile
    all:
      - id: micro-behaviors/ui/window/insert-html::vbs-document-write-call-text
      - id: well-known/lib/platform/microsoft-ado::nested-decimal-rds-clsid
      - id: micro-behaviors/communications/url/encoded::http-scheme-character-code-sequence
      - id: micro-behaviors/fs/write/file/stream::nested-decimal-savetofile
      - id: micro-behaviors/fs/write/stream::nested-decimal-http-body-stream-write
      - id: metadata/lang/encoding/shape/character::nested-decimal-shellexecute
  - id: decimal-musicstore-file-traversal
    desc: "Decimal MusicStore arbitrary-file path traversal"
    crit: hostile
    all:
      - id: micro-behaviors/data/decode/custom::vbscript-chr-eval-index
      - id: micro-behaviors/data/string/split::vbscript-comma-split
      - id: micro-behaviors/ui/window/insert-html::vbs-document-write-call-text
      - id: objectives/anti-static/obfuscation/encoding/numeric::decimal-musicstore-download-method
      - id: micro-behaviors/fs/path/traversal::decimal-double-backslash-parent-path
      - id: micro-behaviors/communications/url/encoded::http-scheme-character-code-sequence
