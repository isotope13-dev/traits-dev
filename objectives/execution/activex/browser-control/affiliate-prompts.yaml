defaults:
  for: [html]
  platforms: [windows]
  crit: suspicious
  conf: 0.95
traits:
  - id: onload-toolbar-install-prompt-source
    desc: Onload toolbar installation prompt source
    if:
      type: text
      exclude_html_comments: true
      regex: 'src=["]http://install\.[^>]{0,60}/ist/scripts/prompt\.php\?event_type=onload'
      case_insensitive: true
  - id: recurrent-activex-affiliate-script
    desc: Recurring ActiveX affiliate script offers
    if:
      type: text
      exclude_html_comments: true
      regex: '/getActivex\.aspx\?[^"''>]{0,100}recurrence=always&retry=[2-9]'
      case_insensitive: true

composite_rules:
  - id: repeated-onload-toolbar-install-prompt
    desc: Onload toolbar prompt requests recurring retries
    crit: suspicious
    conf: 0.98
    all:
      - id: onload-toolbar-install-prompt-source
      - id: micro-behaviors/communications/http/query::recurring-prompt-retry-parameters
    near_bytes: 256
