defaults:
  platforms: [windows]
  for: [html]
  attack: T1203
composite_rules:
  - id: scriptlet-browser-command-hta-write
    desc: Scriptlet browser exploit writes command-running HTA
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/com/automation::html-activex-classid-object
      - id: micro-behaviors/os/com/automation::scriptlet-typelib-clsid
      - id: micro-behaviors/os/com/automation::wsh-shell-clsid
      - id: micro-behaviors/fs/write/content::object-hta-path-assignment
      - id: micro-behaviors/fs/write/content::parameterless-write-method-call
      - id: micro-behaviors/process/create/shell/script-host::command-com-c-command-text
  - id: scriptlet-browser-shell-hta-write
    desc: Scriptlet exploit writes a Startup shell HTA
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/com/automation::html-activex-classid-object
      - id: micro-behaviors/os/com/automation::scriptlet-typelib-clsid
      - id: micro-behaviors/os/com/automation::wsh-shell-clsid
      - id: micro-behaviors/fs/write/content::object-startup-hta-path-assignment
      - id: micro-behaviors/fs/write/content::document-write-call-cooccurrence
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-command-text
