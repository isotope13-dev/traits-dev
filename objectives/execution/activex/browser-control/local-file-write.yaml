defaults:
  for:
  - html
  platforms:
  - windows
  attack: T1203
  conf: 0.98
composite_rules:
- id: known-unsafe-control-file-write
  desc: Known unsafe browser control invokes SaveToFile
  crit: suspicious
  all:
  - id: micro-behaviors/os/com/automation::html-activex-classid-object
  - id: micro-behaviors/process/interpreter/scripting::script-block-savetofile-call
  any:
  - id: metadata/file/profile/com-class-id::argos-mail-data-clsid
  - id: metadata/file/profile/com-class-id::chilkat-data-clsid
  - id: metadata/file/profile/com-class-id::chilkat-string-clsid
  - id: metadata/file/profile/com-class-id::ultra-crypto-clsid
  - id: metadata/file/profile/com-class-id::pdfbuilderx-clsid
  - id: metadata/file/profile/com-class-id::vimpx-clsid
  - id: metadata/file/profile/com-class-id::zune-encprofile-clsid
  - id: metadata/file/profile/com-class-id::secureblackbox-clsid
  - id: metadata/file/profile/com-class-id::hp-digital-imaging-clsid
  - id: metadata/file/profile/com-class-id::dewizard-clsid
  - id: metadata/file/profile/com-class-id::precisionid-barcode-clsid
  - id: metadata/file/profile/com-class-id::ebcrypt-save-clsid
  - id: metadata/file/profile/com-class-id::kingview-chart-clsid
  - id: metadata/file/profile/com-class-id::ca-event-client-clsid
- id: activex-object-savetofile
  desc: Unsafe browser file writer targets executable or boot configuration
  crit: hostile
  all:
  - id: known-unsafe-control-file-write
  any:
  - id: micro-behaviors/fs/write/file/stream::savetofile-executable-output
  - id: micro-behaviors/fs/path/config/system::legacy-boot-config-path
- id: scripted-savetofile-file-write
  desc: Browser exploit writes critical configuration through traversal
  crit: hostile
  all:
  - id: known-unsafe-control-file-write
  - id: micro-behaviors/fs/path/config/system::legacy-boot-config-path
  - id: micro-behaviors/fs/path/traversal::html-multiple-parent-path
