defaults:
  for:
  - html
  platforms:
  - windows
  attack: T1203
  conf: 0.98
composite_rules:
- id: known-unsafe-control-file-write
  desc: Known unsafe browser control invokes SaveToFile
  crit: suspicious
  all:
  - id: micro-behaviors/os/com/automation::html-activex-classid-object
  - id: micro-behaviors/process/interpreter/scripting::script-block-savetofile-call
  any:
  - id: well-known/lib/vendor-sdk/argos-mail::argos-mail-data-clsid
  - id: well-known/lib/vendor-sdk/chilkat::chilkat-data-clsid
  - id: well-known/lib/vendor-sdk/chilkat::chilkat-string-clsid
  - id: well-known/lib/vendor-sdk/ultra-crypto::ultra-crypto-clsid
  - id: well-known/lib/vendor-sdk/pdfbuilderx::pdfbuilderx-clsid
  - id: well-known/lib/vendor-sdk/vimpx::vimpx-clsid
  - id: well-known/app/media/zune::zune-encprofile-clsid
  - id: well-known/lib/vendor-sdk/secureblackbox::secureblackbox-clsid
  - id: well-known/app/system/hp-digital-imaging::hp-digital-imaging-clsid
  - id: well-known/lib/vendor-sdk/dewizard::dewizard-clsid
  - id: well-known/lib/vendor-sdk/precisionid::precisionid-barcode-clsid
  - id: well-known/lib/vendor-sdk/ebcrypt::ebcrypt-save-clsid
  - id: well-known/app/infrastructure/kingview::kingview-chart-clsid
  - id: well-known/lib/vendor-sdk/ca-event-client::ca-event-client-clsid
- id: activex-object-savetofile
  desc: Unsafe browser file writer targets executable or boot configuration
  crit: hostile
  all:
  - id: known-unsafe-control-file-write
  any:
  - id: micro-behaviors/fs/write/file/stream::savetofile-executable-output
  - id: micro-behaviors/fs/path/config/system::legacy-boot-config-path
- id: scripted-savetofile-file-write
  desc: Browser exploit writes critical configuration through traversal
  crit: hostile
  all:
  - id: known-unsafe-control-file-write
  - id: micro-behaviors/fs/path/config/system::legacy-boot-config-path
  - id: micro-behaviors/fs/path/traversal::html-multiple-parent-path
