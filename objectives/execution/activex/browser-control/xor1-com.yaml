defaults:
  for: [html]
  platforms: [windows]
composite_rules:
  - id: xor1-browser-com-response-drop
    desc: Obfuscated browser COM factory drops HTTP response
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/arithmetic::charcode-xor-one
      - id: objectives/anti-static/obfuscation/encoding/xor::character-xor-eval
      - id: micro-behaviors/os/com/automation::rds-dataspace-clsid
      - id: micro-behaviors/fs/write/stream::xor1-write-responsebody
      - id: micro-behaviors/fs/write/stream::xor1-savetofile
      - id: micro-behaviors/process/create/shellexec::xor1-shellexecute
