defaults:
  for: [html]
  platforms: [windows]
composite_rules:
  - id: xor1-browser-com-response-drop
    desc: XOR browser script hides response save and launch
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/bitwise::charcode-xor-one
      - id: objectives/anti-static/obfuscation/encoding/xor::character-xor-eval
      - id: micro-behaviors/fs/write/stream::xor1-write-responsebody
      - id: micro-behaviors/fs/write/stream::xor1-savetofile
      - id: micro-behaviors/process/create/shellexec::xor1-shellexecute
    any:
      - id: metadata/file/profile/com-encoded::rds-dataspace-clsid
      - id: metadata/lang/natural/diagnostic::not-found-error-title
