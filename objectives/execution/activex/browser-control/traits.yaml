defaults:
  platforms:
  - windows
  for:
  - html
  - makefile
  - vbs
  conf: 0.98
  attack: T1203
traits:
- id: vmware-vie-createprocess-clsid
  desc: VMware VIE CreateProcess control CLSID
  crit: notable
  if:
    type: text
    substr: 0F748FDE-0597-443C-8596-71854C5EA20A
    case_insensitive: true
- id: vmware-vie-startprocess-clsid
  desc: VMware VIE StartProcess control CLSID
  crit: notable
  if:
    type: text
    substr: 7B9C5422-39AA-4C21-BEEF-645E42EB4529
    case_insensitive: true
- id: sopcast-player-clsid
  desc: SopCast browser player control CLSID
  crit: notable
  if:
    type: text
    substr: 8FEFF364-6A5F-4966-A917-A3AC28411659
    case_insensitive: true
- id: speech-weblaunch-clsid
  desc: Speech WebLaunch browser control CLSID
  crit: notable
  if:
    type: text
    substr: 93CEA8A4-6059-4E0B-ADDD-73848153DD5E
    case_insensitive: true
- id: office-viewer-clsid
  desc: Office Viewer browser control CLSID
  crit: notable
  if:
    type: text
    substr: 97AF4A45-49BE-4485-9F55-91AB40F288F2
    case_insensitive: true
- id: acer-aplaunch-clsid
  desc: Acer APlaunch browser control CLSID
  crit: notable
  if:
    type: text
    substr: D9998BD0-7957-11D2-8FED-00606730D3AA
    case_insensitive: true
- id: hp-update-clsid
  desc: HP Update browser control CLSID
  crit: notable
  if:
    type: text
    substr: B00FBC78-73CB-4216-8D01-96770CC020C3
    case_insensitive: true
- id: mitsubishi-icolaunch-clsid
  desc: Mitsubishi iCOLaunch browser control CLSID
  crit: notable
  if:
    type: text
    substr: C28A127E-4A85-11D3-A5FF-00A0249E352D
    case_insensitive: true
- id: flexnet-download-clsid
  desc: FlexNet download manager control CLSID
  crit: notable
  if:
    type: text
    substr: FCED4482-7CCB-4E6F-86C9-DCB22B52843C
    case_insensitive: true
- id: browser-control-createprocess
  desc: Script calls a CreateProcess method
  crit: notable
  if:
    type: text
    regex: '\.CreateProcess\s*\('
- id: browser-control-startprocess
  desc: Script calls a StartProcess method
  crit: notable
  if:
    type: text
    regex: '\.StartProcess\s*\('
- id: browser-control-external-player
  desc: Script calls SetExternalPlayer
  crit: notable
  if:
    type: text
    regex: '\.SetExternalPlayer\s*\('
- id: browser-control-weblaunch
  desc: Script calls DoWebLaunch
  crit: notable
  if:
    type: text
    regex: '\.DoWebLaunch\s*\('
- id: browser-control-openwebfile
  desc: Script calls OpenWebFile
  crit: notable
  if:
    type: text
    regex: '\.OpenWebFile\s*\('
- id: browser-control-executeasync
  desc: Script calls ExecuteAsync
  crit: notable
  if:
    type: text
    regex: '\.ExecuteAsync\s*\('
- id: browser-control-filename-assign
  desc: Script assigns an ActiveX FileName
  crit: notable
  if:
    type: text
    regex: '\.FileName\s*='
- id: browser-control-createjob
  desc: Script calls CreateJob on a control
  crit: notable
  if:
    type: text
    regex: '\.CreateJob\s*\('
- id: browser-control-method-run
  desc: Script calls a control Run method
  crit: notable
  if:
    type: text
    regex: '\.Run\s*\('
- id: parent-relative-executable-path
  desc: Parent-relative Windows path to an executable
  crit: notable
  if:
    type: text
    regex: '(?i)(\.\.\\{1,2}){3}.{0,80}\.exe'
- id: script-comma-mz-header
  desc: Script stores MZ header byte tokens
  crit: suspicious
  for: [html, vbs, javascript, makefile]
  if:
    type: text
    regex: '(?i)["'']4D\s*,\s*5A\s*,'
- id: xbl-constructor-script-eval
  desc: XBL constructor evaluates a script payload
  crit: suspicious
  for: [html, makefile, javascript]
  if:
    type: text
    regex: '(?is)mozilla\.org/xbl.{0,400}eval\s*\(\s*unescape\s*\('
- id: html-shellexecute-quoted-exe
  desc: ShellExecute launches a quoted executable
  crit: suspicious
  if:
    type: text
    regex: '(?i)\.ShellExecute\s*\(?\s*["''][^"'']{1,40}["'']'
- id: vbs-redim-preserve
  desc: VBScript resizes an array while preserving it
  crit: notable
  if:
    type: text
    regex: '(?i)\bredim\s+preserve\b'
- id: wsh-exec-call
  desc: WScript.Shell Exec method call
  crit: notable
  if:
    type: text
    regex: '(?i)\.Exec\s*\('
- id: activex-posturl-assignment
  desc: ActiveX control assigns a PostURL
  crit: notable
  if:
    type: text
    regex: '(?i)\.PostURL\s*='
- id: activex-addstring-call
  desc: ActiveX control calls AddString
  crit: notable
  if:
    type: text
    regex: '(?i)\.AddString\s+'
- id: opera-setpreference-call
  desc: Script calls opera.setPreference
  crit: notable
  if:
    type: text
    regex: '(?i)opera\.setPreference\s*\('
- id: opera-external-application-pref
  desc: Opera external-application preference name
  crit: notable
  if:
    type: text
    substr: External Application
- id: xul-init-with-path
  desc: XUL file object initialized from a path
  crit: notable
  if:
    type: text
    regex: '(?i)\.initWithPath\s*\('
- id: xul-process-run
  desc: XUL process.run launch call
  crit: notable
  if:
    type: text
    regex: '(?i)\.run\s*\(\s*true\s*,'
- id: activex-logfile-assign
  desc: ActiveX LogFile property is assigned
  crit: notable
  if:
    type: text
    regex: '(?i)\.LogFile\s*='
- id: js-collect-garbage-call
  desc: Script calls CollectGarbage
  crit: notable
  if:
    type: text
    regex: '(?i)\bCollectGarbage\s*\('
- id: js-unescape-repeat-call
  desc: Repeats an unescaped string by count
  crit: notable
  if:
    type: text
    regex: '(?i)unescape\s*\([^)]{0,48}\)\.repeat\s*\('
composite_rules:
  - id: vmware-vie-createprocess
    desc: VMware VIE browser process-creation abuse
    crit: hostile
    all:
      - id: vmware-vie-createprocess-clsid
      - id: browser-control-createprocess
    near_bytes: 2000
  - id: vmware-vie-startprocess
    desc: VMware VIE browser process-launch abuse
    crit: hostile
    all:
      - id: vmware-vie-startprocess-clsid
      - id: browser-control-startprocess
    near_bytes: 2000
  - id: sopcast-external-player-launch
    desc: SopCast browser external-player launch abuse
    crit: hostile
    all:
      - id: sopcast-player-clsid
      - id: browser-control-external-player
    near_bytes: 2000
  - id: speech-web-launch-traversal
    desc: Speech ActiveX browser executable traversal
    crit: hostile
    all:
      - id: speech-weblaunch-clsid
      - id: browser-control-weblaunch
    near_bytes: 2000
  - id: office-viewer-openwebfile-launch
    desc: Office Viewer browser executable-launch abuse
    crit: hostile
    all:
      - id: office-viewer-clsid
      - id: browser-control-openwebfile
    near_bytes: 2000
  - id: acer-aplunch-activex-run
    desc: Acer APlaunch browser process-launch abuse
    crit: hostile
    all:
      - id: acer-aplaunch-clsid
      - id: browser-control-method-run
    near_bytes: 2000
  - id: hp-update-executeasync-browser
    desc: HP Update browser ExecuteAsync launch abuse
    crit: hostile
    all:
      - id: hp-update-clsid
      - id: browser-control-executeasync
    near_bytes: 2000
  - id: mitsubishi-icolaunch-filename
    desc: SCADA browser executable FileName assignment
    crit: hostile
    all:
      - id: mitsubishi-icolaunch-clsid
      - id: browser-control-filename-assign
    near_bytes: 2000
  - id: job-scheduler-browser-download
    desc: FlexNet browser download scheduler abuse
    crit: hostile
    all:
      - id: flexnet-download-clsid
      - id: browser-control-createjob
    near_bytes: 2000
  - id: unsafe-browser-control-executable-target
    desc: Unsafe COM control with executable target
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/system::escaped-system32-executable-path
    any:
      - id: vmware-vie-createprocess
      - id: vmware-vie-startprocess
      - id: sopcast-external-player-launch
      - id: speech-web-launch-traversal
      - id: office-viewer-openwebfile-launch
      - id: acer-aplunch-activex-run
      - id: hp-update-executeasync-browser
      - id: mitsubishi-icolaunch-filename
    needs: 1
    near_bytes: 2000
  - id: unsafe-browser-control-remote-executable
    desc: Unsafe COM control with a remote executable
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/url/path::http-executable-url-reference
    any:
      - id: office-viewer-openwebfile-launch
      - id: sopcast-external-player-launch
      - id: job-scheduler-browser-download
    needs: 1
    near_bytes: 2000
  - id: activex-parent-path-executable
    desc: ActiveX object with a parent-path executable
    crit: hostile
    for: [html, makefile]
    all:
      - id: micro-behaviors/os/com/automation::html-activex-classid-object
      - id: parent-relative-executable-path
    near_bytes: 2500
  - id: activex-object-savetofile
    desc: ActiveX object writes through SaveToFile
    crit: hostile
    for: [html]
    all:
      - id: micro-behaviors/os/com/automation::html-activex-classid-object
      - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
    near_bytes: 2500
  - id: activex-object-remote-executable
    desc: ActiveX object paired with a remote executable
    crit: hostile
    for: [html, makefile]
    all:
      - id: micro-behaviors/os/com/automation::html-activex-classid-object
      - id: micro-behaviors/communications/http/url/path::http-executable-url-reference
    near_bytes: 2500
  - id: html-wscript-shell-launch
    desc: HTML script launches a process through WScript
    crit: hostile
    for: [html, vbs]
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run
    near_bytes: 1500
  - id: html-shell-application-execute
    desc: Page launches through Shell.Application
    crit: hostile
    for: [html, vbs]
    all:
      - id: micro-behaviors/os/com/automation::shell-application-progid
      - id: html-shellexecute-quoted-exe
    near_bytes: 2500
  - id: vbs-redim-shell-launch
    desc: Resized array launches Shell.Application
    crit: hostile
    for: [html, vbs]
    all:
      - id: vbs-redim-preserve
      - id: micro-behaviors/os/com/automation::shell-application-progid
      - id: html-shellexecute-quoted-exe
  - id: script-mz-byte-dropper
    desc: MZ byte tokens accompany a WScript launch
    crit: hostile
    for: [html, vbs]
    all:
      - id: script-comma-mz-header
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
    near_bytes: 4000
  - id: traversed-executable-target
    desc: Parent-relative path names an executable target
    crit: hostile
    for: [html, vbs]
    all:
      - id: parent-relative-executable-path
      - id: micro-behaviors/fs/path/application/executable::unc-exe-path-reference
    near_bytes: 400
  - id: activex-embedded-wscript-shell
    desc: ActiveX page embeds a WScript.Shell launch
    crit: hostile
    for: [html]
    all:
      - id: micro-behaviors/os/com/automation::html-activex-classid-object
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
    near_bytes: 3000
  - id: wscript-exec-command
    desc: WScript.Shell Exec launches a command
    crit: hostile
    for: [html, vbs]
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: wsh-exec-call
    near_bytes: 400
  - id: html-wscript-text-dropper
    desc: HTML script writes a file through WScript
    crit: hostile
    for: [html, vbs]
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/fs/write/content::create-text-file-api
    near_bytes: 2500
  - id: activex-loopback-post
    desc: ActiveX control posts toward a host
    crit: hostile
    for: [html, makefile]
    all:
      - id: micro-behaviors/os/com/automation::html-activex-classid-object
      - id: activex-posturl-assignment
    near_bytes: 1500
  - id: activex-addstring-upload
    desc: ActiveX control uploads a caller-built string
    crit: hostile
    for: [html, makefile]
    all:
      - id: micro-behaviors/os/com/automation::html-activex-classid-object
      - id: activex-addstring-call
    near_bytes: 1500
  - id: opera-preference-executable
    desc: Opera preference points at a system executable
    crit: hostile
    all:
      - id: opera-setpreference-call
      - id: micro-behaviors/fs/path/system::escaped-system32-executable-path
    near_bytes: 800
  - id: opera-external-app-preference
    desc: Opera mail handler set to external app
    crit: hostile
    all:
      - id: opera-setpreference-call
      - id: opera-external-application-pref
    near_bytes: 400
  - id: xul-path-process-launch
    desc: XUL path launched as a process
    crit: hostile
    all:
      - id: xul-init-with-path
      - id: xul-process-run
    near_bytes: 800
  - id: xul-system-executable-launch
    desc: XUL launch targets a Windows executable path
    crit: hostile
    for: [html, vbs]
    all:
      - id: xul-init-with-path
      - id: micro-behaviors/fs/path/application/executable::unc-exe-path-reference
    near_bytes: 800
  - id: activex-repeated-unescape
    desc: ActiveX page repeats an unescaped spray string
    crit: hostile
    for: [html, makefile]
    all:
      - id: micro-behaviors/os/com/automation::html-activex-classid-object
      - id: js-unescape-repeat-call
    near_bytes: 2500
  - id: activex-unicode-unescape-control
    desc: ActiveX control accompanies a Unicode unescape
    crit: hostile
    for: [html, makefile]
    all:
      - id: micro-behaviors/os/com/automation::html-activex-classid-object
      - id: micro-behaviors/data/decode/url::js-unicode-unescape-payload
    near_bytes: 2500
    unless:
      - id: objectives/execution/activex/com::activex-unicode-unescape-heap-spray
      - id: activex-repeated-unescape
  - id: activex-startup-folder-drop
    desc: ActiveX object targets the Startup folder
    crit: hostile
    for: [html, makefile]
    all:
      - id: micro-behaviors/os/com/automation::html-activex-classid-object
      - id: micro-behaviors/fs/path/autostart::windows-startup-directory
    near_bytes: 3500
  - id: activex-logfile-savetofile
    desc: ActiveX save follows a log-file assignment
    crit: hostile
    for: [html, vbs]
    all:
      - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
      - id: activex-logfile-assign
    near_bytes: 2000
  - id: activex-garbage-collect-spray
    desc: ActiveX page collects garbage after a spray
    crit: hostile
    for: [html, makefile]
    all:
      - id: micro-behaviors/os/com/automation::html-activex-classid-object
      - id: js-collect-garbage-call
    near_bytes: 4000
    unless:
      - id: objectives/execution/activex/com::activex-unicode-unescape-heap-spray
      - id: objectives/execution/exploit/memory::js-native-shellcode-array-spray
  - id: wsh-startup-script-drop
    desc: Startup folder receives a dropped script
    crit: hostile
    for: [html, vbs]
    all:
      - id: micro-behaviors/fs/path/location::wsh-startup-folder-lookup
      - id: html-wscript-text-dropper
    near_bytes: 2500
