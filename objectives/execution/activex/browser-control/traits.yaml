defaults:
  platforms:
  - windows
  for:
  - html
  - makefile
  - vbs
  conf: 0.98
  attack: T1203
traits:
- id: script-comma-mz-header
  desc: Script stores MZ header byte tokens
  crit: suspicious
  for: [html, vbs, javascript, makefile]
  if:
    type: text
    regex: '(?i)["'']4D\s*,\s*5A\s*,'
- id: xbl-constructor-script-eval
  desc: XBL constructor evaluates a script payload
  crit: suspicious
  for: [html, makefile, javascript]
  if:
    type: text
    regex: '(?is)mozilla\.org/xbl.{0,400}eval\s*\(\s*unescape\s*\('
- id: opera-external-application-pref
  desc: Assigns Opera external mail application
  crit: notable
  if:
    type: text
    regex: (?i)opera\.setPreference\(['"]Mail['"],\s*['"]External Application['"]
composite_rules:
- id: vmware-vie-createprocess
  desc: VMware VIE browser process-creation abuse
  crit: hostile
  all:
  - id: micro-behaviors/os/com/instantiation::vmware-vie-createprocess-clsid
  - id: micro-behaviors/os/com/invoke::browser-control-createprocess
  near_bytes: 2000
- id: vmware-vie-startprocess
  desc: VMware VIE browser process-launch abuse
  crit: hostile
  all:
  - id: micro-behaviors/os/com/instantiation::vmware-vie-startprocess-clsid
  - id: micro-behaviors/os/com/invoke::browser-control-startprocess
  near_bytes: 2000
- id: sopcast-external-player-launch
  desc: SopCast browser external-player launch abuse
  crit: hostile
  all:
  - id: micro-behaviors/os/com/instantiation::sopcast-player-clsid
  - id: micro-behaviors/os/com/invoke::browser-control-external-player
  near_bytes: 2000
- id: speech-web-launch-traversal
  desc: Gateway WebLaunch traverses to an executable
  crit: hostile
  all:
  - id: micro-behaviors/os/com/instantiation::speech-weblaunch-clsid
  - id: micro-behaviors/os/com/invoke::browser-control-weblaunch
  - id: micro-behaviors/fs/path/traversal::parent-relative-executable-path
  near_bytes: 2000
- id: office-viewer-openwebfile-launch
  desc: Office Viewer browser executable-launch abuse
  crit: hostile
  all:
  - id: micro-behaviors/os/com/instantiation::office-viewer-clsid
  - id: micro-behaviors/os/com/invoke::browser-control-openwebfile
  near_bytes: 2000
- id: acer-aplunch-activex-run
  desc: Acer APlaunch browser process-launch abuse
  crit: hostile
  all:
  - id: micro-behaviors/os/com/instantiation::acer-aplaunch-clsid
  - id: micro-behaviors/data/control-flow/dispatch::script-run-method-call
  near_bytes: 2000
- id: hp-update-executeasync-browser
  desc: HP Update browser ExecuteAsync launch abuse
  crit: hostile
  all:
  - id: micro-behaviors/os/com/instantiation::hp-update-clsid
  - id: micro-behaviors/os/com/invoke::browser-control-executeasync
  near_bytes: 2000
- id: mitsubishi-icolaunch-filename
  desc: SCADA browser executable FileName assignment
  crit: hostile
  all:
  - id: micro-behaviors/os/com/instantiation::mitsubishi-icolaunch-clsid
  - id: micro-behaviors/data/property/assign::browser-control-filename-assign
  near_bytes: 2000
- id: job-scheduler-browser-download
  desc: FlexNet browser download scheduler abuse
  crit: hostile
  all:
  - id: micro-behaviors/os/com/instantiation::flexnet-download-clsid
  - id: micro-behaviors/os/com/invoke::browser-control-createjob
  near_bytes: 2000
- id: unsafe-browser-control-executable-target
  desc: Unsafe COM control with executable target
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/fs/path/system::escaped-system32-executable-path
  any:
  - id: vmware-vie-createprocess
  - id: vmware-vie-startprocess
  - id: sopcast-external-player-launch
  - id: speech-web-launch-traversal
  - id: office-viewer-openwebfile-launch
  - id: acer-aplunch-activex-run
  - id: hp-update-executeasync-browser
  - id: mitsubishi-icolaunch-filename
  needs: 1
  near_bytes: 2000
- id: unsafe-browser-control-remote-executable
  desc: Unsafe COM control with a remote executable
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/url/path::http-executable-url-reference
  any:
  - id: office-viewer-openwebfile-launch
  - id: sopcast-external-player-launch
  - id: job-scheduler-browser-download
  needs: 1
  near_bytes: 2000
- id: activex-parent-path-executable
  desc: ActiveX object with a parent-path executable
  crit: hostile
  for:
  - html
  - makefile
  all:
  - id: micro-behaviors/os/com/automation::html-activex-classid-object
  - id: micro-behaviors/fs/path/traversal::parent-relative-executable-path
  near_bytes: 2500
- id: activex-object-remote-executable
  desc: ActiveX object paired with a remote executable
  crit: hostile
  for: [html, makefile]
  all:
  - id: micro-behaviors/os/com/automation::html-activex-classid-object
  - id: micro-behaviors/communications/http/url/path::http-executable-url-reference
  near_bytes: 2500
- id: script-mz-byte-dropper
  desc: MZ byte tokens accompany a WScript launch
  crit: hostile
  for: [html, vbs]
  all:
  - id: script-comma-mz-header
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  near_bytes: 4000
- id: traversed-executable-target
  desc: Parent-relative path names an executable target
  crit: hostile
  for:
  - html
  - vbs
  all:
  - id: micro-behaviors/fs/path/traversal::parent-relative-executable-path
  - id: micro-behaviors/fs/path/application/executable::unc-exe-path-reference
  near_bytes: 400
- id: activex-embedded-wscript-shell
  desc: ActiveX page embeds a WScript.Shell launch
  crit: hostile
  for: [html]
  all:
  - id: micro-behaviors/os/com/automation::html-activex-classid-object
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  near_bytes: 3000
  # WScript.Shell.Exec and CreateTextFile are ordinary VBS automation
  # (capture a helper's stdout, append a log, write a request file).
  # The hostile claim is the HTML browser host; standalone VBS stays on
  # the notable Exec and text-file atoms.
- id: opera-preference-executable
  desc: Opera preference points at a system executable
  crit: hostile
  all:
  - id: micro-behaviors/data/config/write::opera-setpreference-call
  - id: micro-behaviors/fs/path/system::escaped-system32-executable-path
  near_bytes: 800
- id: opera-external-app-preference
  desc: Opera mail handler assigned an external application
  crit: hostile
  all:
  - id: micro-behaviors/data/config/write::opera-setpreference-call
  - id: opera-external-application-pref
  near_bytes: 400
- id: xul-path-process-launch
  desc: XUL path launched as a process
  crit: hostile
  all:
  - id: micro-behaviors/os/com/invoke::xul-init-with-path
  - id: micro-behaviors/os/com/invoke::xul-process-run
  - id: micro-behaviors/os/com/instantiation::xpcom-process-component-id
  near_bytes: 800
- id: xul-system-executable-launch
  desc: XUL launch targets a Windows executable path
  crit: hostile
  for:
  - html
  - vbs
  all:
  - id: micro-behaviors/os/com/invoke::xul-init-with-path
  - id: micro-behaviors/fs/path/application/executable::unc-exe-path-reference
  - id: micro-behaviors/os/com/instantiation::xpcom-process-component-id
  near_bytes: 800
- id: activex-repeated-unescape
  desc: ActiveX page repeats an unescaped spray string
  crit: hostile
  for:
  - html
  - makefile
  all:
  - id: micro-behaviors/os/com/automation::html-activex-classid-object
  - id: micro-behaviors/data/buffer/carve::js-unescape-repeat-call
  - id: objectives/execution/exploit/shellcode::browser-x86-native-payload-signature
  near_bytes: 2500
  unless:
  - id: metadata/file/format/conformance::unclosed-script-with-spaced-end

- id: activex-unicode-unescape-control
  desc: Browser control accompanies decoded native payload
  crit: hostile
  for:
  - html
  - makefile
  all:
  - id: micro-behaviors/os/com/automation::html-activex-classid-object
  - id: micro-behaviors/data/decode/url::js-unicode-unescape-payload
  - id: objectives/execution/exploit/shellcode::browser-x86-native-payload-signature
  near_bytes: 2500
  unless:
  - id: objectives/execution/activex/com::activex-unicode-x86-array-payload
  - id: activex-repeated-unescape
- id: activex-garbage-collect-spray
  desc: ActiveX page collects garbage after a spray
  crit: hostile
  for:
  - html
  - makefile
  all:
  - id: micro-behaviors/os/com/automation::html-activex-classid-object
  - id: micro-behaviors/mem/gc::js-collect-garbage-call
  near_bytes: 4000
  unless:
  - id: metadata/file/format/conformance::unclosed-script-with-spaced-end
  - id: objectives/execution/activex/com::activex-unicode-x86-array-payload
  - id: objectives/execution/exploit/memory::js-native-shellcode-array-spray
- id: wsh-startup-script-drop
  desc: Startup folder receives a dropped script
  crit: hostile
  for: [html, vbs]
  all:
  - id: micro-behaviors/fs/path/location::wsh-startup-folder-lookup
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: micro-behaviors/fs/write/content::fso-text-file-write-api
  near_bytes: 2500
- id: wsh-write-hidden-launch-cleanup
  desc: WSH writes, hidden-launches, deletes staging
  crit: hostile
  for: [html]
  # The write, hidden launch, and delete have to be one staging sequence.
  # A visible countdown page writes a flag, launches a helper, and deletes
  # its request file from separate handlers, which spans well past this window.
  near_bytes: 640
  all:
  - id: micro-behaviors/fs/write/content::fso-text-file-write-api
  - id: micro-behaviors/data/control-flow/dispatch::run-zero-style-argument
  - id: micro-behaviors/fs/delete/file/self::html-deletefile-call
- id: scriptlet-typelib-statement-overwrite
  desc: Scriptlet Typelib overwrites files from script
  crit: hostile
  for: [html, vbs]
  all:
  - id: micro-behaviors/os/com/automation::scriptlet-typelib-clsid
  - id: micro-behaviors/fs/write/content::scriptlet-blanking-statement-write
  - id: micro-behaviors/process/interpreter/scripting::html-vbscript-block
