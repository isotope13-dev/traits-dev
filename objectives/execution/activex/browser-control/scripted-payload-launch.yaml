# Script-driven unsafe-ActiveX file writes. An <object> with a classid that
# reaches a SaveToFile-style method is already covered; these composites add
# the drive-by framing: the unsafe method is invoked from page script, and
# in the second shape the page additionally stages an obfuscated command
# launch through WScript.Shell. Both shapes are HTML exploit pages, not
# installed controls, so they live with the browser-control exploits.
defaults:
  for: [html]
  platforms: [windows]
  attack: T1203

composite_rules:
  - id: scripted-savetofile-file-write
    desc: Page script drives SaveToFile file write
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/com/automation::html-activex-classid-object
      - id: micro-behaviors/process/interpreter/scripting::script-block-savetofile-call
    unless:
      - id: well-known/app/ai/coding-agent/
  # (scripted-wscript-obfuscated-launch lives with the other COM-automation
  # launch in execution/activex/com/vbscript-shell-launch.yaml.)
