# A single indexed decimal array reconstructs the browser RDS downloader and its launcher.
defaults:
  for: [html, javascript]
  platforms: [windows]
composite_rules:
  - id: direct-decimal-array-rds-response-launch
    desc: RDS decimal-array downloader saves and opens its response
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.005
    all:
      - id: micro-behaviors/data/decode/char-code::vbscript-numeric-array-execute
      - id: micro-behaviors/os/com/instantiation::direct-decimal-rds-classid-assignment
      - id: micro-behaviors/communications/http/get::direct-decimal-array-synchronous-get
      - id: micro-behaviors/fs/write/stream::direct-decimal-array-responsebody-write
      - id: micro-behaviors/fs/write/file/stream::direct-decimal-array-save-exename
      - id: micro-behaviors/metaprogramming/generation/source::direct-decimal-array-wsh-run-launcher
      - id: micro-behaviors/os/handler/open::direct-decimal-array-hidden-shellexecute
