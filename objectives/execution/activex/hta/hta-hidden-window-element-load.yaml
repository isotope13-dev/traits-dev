defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, php, binaries]
  crit: notable
  conf: 0.88

composite_rules:
  - id: hta-hidden-window-element-load
    desc: HTA hides window and loads concealed element
    crit: suspicious
    conf: 0.88
    for: [html]
    all:
      - id: metadata/file/extension/identity::hta-html-application-extension
      - id: micro-behaviors/ui/window/control::window-moveto-large-coordinate
      - id: micro-behaviors/data/collection/dom::variable-tag-createelement
