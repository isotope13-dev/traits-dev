defaults:
  platforms: [windows]
  for: [html, text, data]

composite_rules:
- id: hidden-hta-computed-activex-clues
  desc: Hidden HTA with computed ActiveX clues
  crit: suspicious
  conf: 0.97
  attack: T1027,T1218.005,T1564.003
  for:
    - html
  all:
    - id: metadata/document/html/encoding::hta-nonascii-text-clues
    - id: micro-behaviors/ui/window/control::hta-hidden-or-minimized-window-request
    - id: micro-behaviors/os/com/instantiation::script-computed-activex-object
