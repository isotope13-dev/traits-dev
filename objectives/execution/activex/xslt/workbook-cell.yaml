defaults:
  for: [oledoc, ooxml]
  platforms: [windows]
  crit: notable
  conf: 0.93

traits:
  - id: vba-msxml-dom-document-creation
    desc: VBA creates an MSXML DOM document
    if:
      type: value
      path: office.vba.modules[*].source
      regex: '(?i)\bCreateObject\s*\(\s*"(MSXML2\.DOMDocument|Microsoft\.XMLDOM)'

  - id: vba-dom-transform-method
    desc: VBA invokes an XML transform
    if:
      type: value
      path: office.vba.modules[*].source
      regex: '(?i)\.TransformNode(ToObject)?\s*[( ]'

  - id: vba-dom-load-method
    desc: VBA loads an external document value
    crit: component
    if:
      type: value
      path: office.vba.modules[*].source
      regex: '(?i)\.Load\s*\(\s*[a-z_]'

  - id: vba-worksheet-cell-value
    desc: VBA reads a worksheet cell value
    if:
      type: value
      path: office.vba.modules[*].source
      regex: '(?i)\b(Cells|Range)\s*\([^\r\n]{1,55}\)\s*\.Value2?\b'

  - id: vba-remote-image-url
    desc: Workbook contains a remote image URL
    if:
      type: text
      regex: '(?i)https?://[^\s"''<>]{4,135}\.(jpe?g|png|gif)\b'

composite_rules:
  - id: workbook-event-loads-disguised-remote-xslt
    desc: Workbook event loads a cell-supplied image URL for XML transformation
    crit: hostile
    conf: 0.96
    attack: T1059.005,T1220
    all:
      - id: vba-msxml-dom-document-creation
      - id: vba-dom-transform-method
      - id: vba-dom-load-method
      - id: vba-worksheet-cell-value
      - id: vba-remote-image-url
    any:
      - id: micro-behaviors/os/application/hook/event::workbook-open-handler
      - id: micro-behaviors/os/application/hook/event::workbook-activate-handler
      - id: micro-behaviors/os/application/hook/event::worksheet-activate-handler
