defaults:
  platforms: [windows]
  for: [vbs, html, javascript, xml]
  attack: T1059
  mbc: E1059
traits:
  - id: xslt-microsoft-extension-namespace
    desc: Microsoft XSLT extension namespace
    crit: notable
    conf: 0.95
    for: [xml]
    if:
      type: text
      substr: urn:schemas-microsoft-com:xslt

  - id: xslt-extension-script-attribute
    desc: XSLT declares an extension script prefix
    crit: notable
    conf: 0.96
    for: [xml]
    if:
      type: text
      regex: '<[\w.-]+:script\s+implements-prefix\s*='

  - id: xslt-evaluates-built-function
    desc: XSLT invokes a constructed Function
    crit: notable
    conf: 0.96
    for: [xml]
    if:
      type: text
      regex: '\breturn\s+\(Function\(\w+\)\)\(\)'

  - id: xslt-numbered-script-functions
    desc: XSLT script has numerous numbered functions
    crit: notable
    conf: 0.9
    for: [xml]
    count_min: 8
    if:
      type: text
      regex: '\bfunction\s+[a-z]{4,16}\d{1,6}\('

  - id: xslt-jscript-language-encoded
    desc: Percent-encoded JScript marker
    crit: notable
    conf: 0.9
    for: [xml]
    if:
      type: text
      regex: '(?i)%4a%53%63%72%69%70%74'

  - id: xslt-transform-node-call
    desc: ASP XSLT TransformNode call
    crit: notable
    conf: 0.86
    if:
      type: text
      # The MSXML COM method is spelled `TransformNode`; jscodeshift codemods
      # call a local helper named `transformNode`, which must not match here.
      regex: '\bTransformNode\s*\('
  - id: xslt-shell-exec-call
    desc: XSLT shell Exec call
    crit: suspicious
    conf: 0.92
    if:
      type: text
      # `Xsl` is a common minified variable name (for example a RegExp object
      # whose `.exec()` parses a stack trace); it does not identify XSLT.
      # Keep the adjacent MSXML/TransformNode context required for this rule.
      regex: '(?i)\b(msxml|transformnode)\b[\s\S]{0,80}\.Exec\s*\('
composite_rules:
  - id: xslt-obfuscated-function-stage
    desc: Microsoft XSLT extension runs a constructed and obfuscated script stage
    crit: hostile
    conf: 0.97
    for: [xml]
    all:
      - id: xslt-microsoft-extension-namespace
      - id: xslt-extension-script-attribute
      - id: xslt-evaluates-built-function
      - id: xslt-numbered-script-functions

  - id: embedded-xslt-shell-creation
    desc: XSLT script block creates a shell object
    crit: suspicious
    conf: 0.94
    for: [xml, csharp]
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/interpreter/scripting::xslt-ms-script-block
      - id: micro-behaviors/os/com/instantiation::wscript-shell-createobject
  - id: rust-msxml-script-transform
    desc: Rust transforms XML carrying Microsoft script
    crit: suspicious
    conf: 0.94
    for: [rust]
    all:
      - id: micro-behaviors/process/interpreter/scripting::xslt-ms-script-block
      - id: micro-behaviors/data/parse/xml::rust-msxml-transform-call
      - id: micro-behaviors/data/parse/xml::rust-msxml-load-xml-call
  - id: xslt-actctx-binaryformatter-loader
    desc: XSLT ActCtx BinaryFormatter loader chain
    crit: suspicious
    conf: 0.98
    for: [javascript]
    all:
      - id: micro-behaviors/os/com/automation::windows-actctx-manifest-class
      - id: micro-behaviors/data/serialize/unsafe::binary-formatter
      - id: micro-behaviors/data/serialize/unsafe::binary-formatter-deserialize-call

  - id: xslt-scriptlet-binaryformatter-loader
    desc: XSLT JScript BinaryFormatter payload loader
    crit: hostile
    conf: 0.99
    for: [xml]
    attack: T1059.007,T1140,T1218
    mbc: B0032,C0026
    all:
      - id: micro-behaviors/process/interpreter/scripting::xslt-ms-script-block
      - id: micro-behaviors/os/com/automation::windows-actctx-manifest-class
      - id: micro-behaviors/os/com/instantiation::activex-object-text
      - id: micro-behaviors/data/serialize/unsafe::binary-formatter
    any:
      - id: metadata/lang/runtime::markup-jscript-language
      - id: xslt-jscript-language-encoded

  - id: xslt-scriptlet-command-exec
    desc: XSLT scriptlet command execution
    crit: hostile
    conf: 0.99
    for: [html, javascript]
    all:
      - id: micro-behaviors/process/interpreter/scripting::xslt-ms-script-block
      - id: metadata/lang/runtime::markup-jscript-language
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: xslt-shell-exec-call
      - id: micro-behaviors/process/stdio/read::wsh-process-output-readall
    any:
      - id: xslt-transform-node-call
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: xslt-shell-output-command-runner
    desc: XSLT shell command output runner
    crit: hostile
    conf: 0.97
    for: [vbs, html, javascript]
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: xslt-shell-exec-call
      - id: micro-behaviors/process/stdio/read::wsh-process-output-readall
    any:
      - id: micro-behaviors/data/control-flow/dispatch/run::run-zero-style-argument
      - id: objectives/anti-static/obfuscation/wsh::vbs-execute-concat-code
  - id: xslt-script-download-run
    desc: XSLT script saves then runs a download
    crit: hostile
    conf: 0.97
    for: [xml]
    attack: T1105,T1059.007
    all:
      - id: micro-behaviors/process/interpreter/scripting::xslt-ms-script-block
      - id: micro-behaviors/os/com/instantiation::activex-object-text
      - id: micro-behaviors/fs/write/file/stream::js-savetofile-dynamic-path-mode-2
