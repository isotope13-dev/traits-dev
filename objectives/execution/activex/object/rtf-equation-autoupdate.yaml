# Equation Editor 3.0 objects are the delivery surface for CVE-2017-11882
# and CVE-2018-0802. A writer that embeds a real equation leaves it for the
# user to activate; `\objupdate` forces Word to load the object on open.
defaults:
  platforms: [windows]
  for: [rtf]
  attack: T1203,T1204.002

composite_rules:
  - id: rtf-autoupdate-equation-object
    desc: RTF force-loads an Equation Editor object
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/document/rtf/ole::objupdate
    any:
      - id: metadata/document/rtf/properties::rtf-object-equation-3
      - id: metadata/document/ole::equation-editor-reference
