defaults:
  platforms: [windows]
  for: [rtf]
  attack: T1203,T1204.002

composite_rules:
  # Word writes `{\*\objclass Equation.3}` beside every formula it saves.
  # A document that leaves the declaration out, so the class exists only
  # inside the hex header, and still forces the object to refresh on open
  # hands the Equation Editor server an object nobody inserted.
  # When the class is readable as text (decoded or declared),
  # rtf-autoupdate-equation-object already reports the same fact; this rule
  # covers the hex-only, nibble-spaced form and stays silent otherwise so
  # one Equation object is not counted twice.
  - id: rtf-undeclared-equation-object-autoload
    desc: Undeclared Equation object forced to load
    crit: hostile
    conf: 0.95
    mbc: E1203.029
    all:
      - id: metadata/document/rtf/ole::equation-class-hex
      - id: metadata/document/rtf/ole::objupdate
    unless:
      - id: metadata/document/rtf/ole::objclass-declared
      - id: metadata/document/rtf/properties::rtf-object-equation-3
      - id: metadata/document/ole::equation-editor-reference

  # A macro-enabled workbook embedded with `\objupdate` is activated as the
  # document opens, putting its VBA project in front of the user without
  # anything being double-clicked.
  - id: rtf-autoload-macro-workbook-object
    desc: RTF auto-loads embedded macro-enabled workbook
    crit: hostile
    conf: 0.93
    attack: T1204.002,T1137
    all:
      - id: metadata/document/rtf/ole::macro-enabled-object-class
      - id: metadata/document/rtf/ole::objupdate
      - id: metadata/document/office/macro::excel-vba-project
