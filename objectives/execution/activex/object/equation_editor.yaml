defaults:
  attack: T1203
  platforms: [unix, windows]
  for: [rtf, pe, oledoc]
traits:
  - id: equation-editor
    desc: "Contains Microsoft Equation Editor 3.0 object"
    crit: suspicious
    conf: 0.8
    mbc: "B0006.002"
    if:
      type: text
      substr: "Equation.3"
      case_insensitive: true
    unless:
      - id: metadata/document/office/container/
      - id: well-known/tool/development/opencores::documentation-context
      - id: well-known/tool/development/opencores::documentation-tree-context
      - id: well-known/tool/development/opencores::specifications-template-context
    downgrade:
      any:
        - id: metadata/binary/resource/
  # A bare Equation Editor CLSID is a structural fact of any document that
  # embeds a real equation object. CVE-2017-11882 intent lives in the
  # hostile composites below (CLSID + exploit-shaped payload evidence), not
  # in the CLSID alone — keeping this suspicious false-positives every
  # hardware/math Word doc that ships equations.
  - id: equation-editor-dangerous-clsid
    desc: Microsoft Equation Editor CLSID
    crit: notable
    conf: 0.96
    for: [oledoc]
    mbc: "B0006.002"
    if:
      type: value
      path: office.dangerous_clsids[*].clsid
      exact: "0002ce02-0000-0000-c000-000000000046"
    unless:
      - id: well-known/tool/development/opencores::documentation-context
      - id: well-known/tool/development/opencores::documentation-tree-context
      - id: well-known/tool/development/opencores::specifications-template-context
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::archive-test-directory-member-path
      - id: well-known/lib/format/roo-xls::test-files-ole-path
  # Matches the OLE10Native stream (embedded Package/PBrush/etc. payload),
  # NOT the ordinary "Equation Native" equation-object stream. Combined with
  # the Equation Editor CLSID in the composites below, this is the
  # equation-doc-plus-embedded-payload exploit surface.
  - id: equation-editor-native-payload-stream
    desc: OLE10Native embedded object stream
    crit: notable
    conf: 0.97
    for: [oledoc]
    mbc: "B0006.002"
    if:
      type: value
      path: office.streams[*]
      regex: '(?i)ole10native$'
    unless:
      - id: well-known/tool/development/opencores::documentation-context
      - id: well-known/tool/development/opencores::documentation-tree-context
      - id: well-known/tool/development/opencores::specifications-template-context
composite_rules:
  - id: cve-2017-11882
    desc: "CVE-2017-11882 Exploitation (Equation Editor) with Payload"
    crit: hostile
    conf: 0.95
    all:
      - id: equation-editor
    any:
      - id: micro-behaviors/process/create/launch::regsvr32
      - id: micro-behaviors/process/create/launch::regsvr32-encoded
      - id: micro-behaviors/process/create/launch::regsvr32-raw-hex
      - id: objectives/command-and-control/dropper/delivery/download-execute::squiblydoo
  # ObjectPool is the normal OLE container for any embedded object,
  # including a legitimate "Equation Native" formula. CLSID + ObjectPool
  # is therefore every math Word doc, not CVE-2017-11882. Exploit-shaped
  # evidence is packed/high-entropy OLE or an OLE10Native payload stream.
  - id: equation-editor-ole-exploit-surface
    desc: Equation Editor embedded OLE exploit surface
    crit: hostile
    conf: 0.96
    scope: file
    for: [oledoc]
    all:
      - id: equation-editor-dangerous-clsid
    any:
      - id: metadata/document/ole::ole-high-entropy
      - id: equation-editor-native-payload-stream
    unless:
      - id: well-known/tool/development/opencores::documentation-context
      - id: well-known/tool/development/opencores::documentation-tree-context
      - id: well-known/tool/development/opencores::specifications-template-context
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::archive-test-directory-member-path
      - id: well-known/lib/format/roo-xls::test-files-ole-path
  - id: equation-editor-native-payload-exploit
    desc: Equation Editor OLE native payload exploit
    crit: hostile
    conf: 0.98
    scope: file
    for: [oledoc]
    all:
      - id: equation-editor-dangerous-clsid
      - id: equation-editor-native-payload-stream
    unless:
      - id: well-known/tool/development/opencores::documentation-context
      - id: well-known/tool/development/opencores::documentation-tree-context
      - id: well-known/tool/development/opencores::specifications-template-context
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::archive-test-directory-member-path
      - id: well-known/lib/format/roo-xls::test-files-ole-path
  - id: equation-editor-large-payload-exploit
    desc: Equation Editor OLE exploit with large payload body
    crit: hostile
    conf: 0.97
    scope: file
    for: [oledoc]
    all:
      - id: equation-editor-dangerous-clsid
      - id: metadata/document/ole::large-ole-document-body
      - id: metadata/document/ole::ole-high-entropy
    unless:
      - id: well-known/tool/development/opencores::documentation-context
      - id: well-known/tool/development/opencores::documentation-tree-context
      - id: well-known/tool/development/opencores::specifications-template-context
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::archive-test-directory-member-path
      - id: well-known/lib/format/roo-xls::test-files-ole-path
  - id: ooxml-autoload-equation-editor-exploit-surface
    desc: OOXML auto-loads a dangerous Equation Editor OLE object
    crit: hostile
    conf: 0.98
    attack: T1203,T1204.002
    for: [ooxml]
    scope: archive
    all:
      - id: metadata/document/office/markup::ooxml-embedded-ole-object
      - id: metadata/document/office/markup::ooxml-embedded-ole-autoload
      - id: equation-editor-dangerous-clsid
