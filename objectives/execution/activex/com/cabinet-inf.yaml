defaults:
  platforms: [windows]
  for: [html, javascript]
  conf: 0.98

composite_rules:
  # An ordinary ActiveX installation does not navigate to an INF through
  # a constructed dotted protocol. This is the CAB acquisition portion of
  # the MSHTML exploit, independent of the host, CLSID and payload name.
  - id: mshtml-cabinet-inf-exploit
    desc: MSHTML CAB installation with INF protocol abuse
    crit: hostile
    attack: T1203
    all:
      - id: micro-behaviors/os/com/automation::activex-htmlfile-constructor
      - id: micro-behaviors/os/com/automation::activex-codebase-version-fragment
      - id: micro-behaviors/communications/http/url/path::remote-cabinet-url
      - id: micro-behaviors/fs/path/config/system::inf-path-reference
      - id: micro-behaviors/communications/url/construction/fragment::dotted-scheme-variable-concatenation
