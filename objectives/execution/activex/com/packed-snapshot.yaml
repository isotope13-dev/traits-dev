defaults:
  platforms: [windows]
  for: [html, javascript]
traits:
  - id: snapshot-viewer-eval-function
    desc: Snapshot Viewer control precedes eval function
    crit: suspicious
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)F0E42D50-368C-11D0-AD81-00A0C90DC8D9[\s\S]{0,160}eval\(function\('
