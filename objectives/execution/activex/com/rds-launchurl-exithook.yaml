# RDS launchURL exit hook: the page instantiates RDS.DataControl, keeps
# a launchURL call ready, and registers it on page unload, so leaving the
# page fires the attacker URL with the control's privileges. Control plus
# launch primitive plus persistence; any one alone stays neutral.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1203
composite_rules:
  - id: rds-launchurl-exit-hook
    desc: RDS launchURL fires on page exit
    crit: hostile
    conf: 0.97
    near_bytes: 3000
    all:
      - id: micro-behaviors/os/com/instantiation::rds-datacontrol-clsid
      - id: micro-behaviors/os/com/invoke::rds-launchurl-call
      - id: micro-behaviors/ui/window/event::script-unload-handler-registration
