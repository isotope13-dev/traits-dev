defaults:
  platforms: [unix, windows, macos]
composite_rules:
- id: jscript-file-hidden-shellexecute-profile
  desc: JScript write with hidden ShellExecute
  crit: suspicious
  conf: 0.97
  platforms: [windows]
  for: [javascript]
  all:
  - id: micro-behaviors/os/com/automation::filesystemobject-progid
  - id: micro-behaviors/fs/write/content::fso-text-file-write-api
  - id: micro-behaviors/fs/write/content::fso-text-file-then-write-call
  - id: micro-behaviors/os/handler/open::shell-application-execute-context
  - id: micro-behaviors/os/handler/open::shell-application-shellexecute-hidden
