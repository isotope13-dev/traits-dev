defaults:
  platforms: [unix, windows, macos]
composite_rules:
- id: jscript-file-hidden-shellexecute-profile
  desc: JScript write with hidden ShellExecute
  crit: suspicious
  conf: 0.97
  platforms: [windows]
  for: [javascript]
  all:
  - id: micro-behaviors/os/com/automation::filesystemobject-progid
  - id: micro-behaviors/fs/write/content::create-text-file-api
  - id: micro-behaviors/fs/write/content::write-text-file-method
  - id: micro-behaviors/process/create/shellexec::shell-application-execute-context
  - id: micro-behaviors/process/create/shell/wsh::shell-application-shellexecute-hidden
