defaults:
  platforms: [windows]
  for: [html, javascript]
composite_rules:
  - id: rds-stream-probe-hidden-remote-page
    desc: RDS stream probe with hidden remote iframe
    crit: hostile
    conf: 0.95
    attack: T1203
    all:
      - id: micro-behaviors/os/com/automation::rds-dataspace-clsid
      - id: micro-behaviors/data/collection/dom::document-create-element
      - id: micro-behaviors/communications/http/client/resource::external-iframe-element-load
      - id: micro-behaviors/ui/window/style::css-display-none
    any:
      - id: micro-behaviors/fs/write/stream::adodb-stream-progid
      - id: micro-behaviors/os/com/automation::html-adodb-stream-progid-reference
