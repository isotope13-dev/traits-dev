# VBScript pages that drive Shell.Application to launch a command. Unlike
# the ActiveX-control exploits, there is no classid object here: page script
# instantiates the shell automation object and calls ShellExecute, the
# CVE-2014-6332 VBScript pattern. The three roles (VBScript carrier,
# shell-automation ProgID, execute call) each have to hold.
defaults:
  for: [html, vbs]
  platforms: [windows]
  attack: T1203

composite_rules:
  # A classid object page that pairs WScript.Shell with unescape() decoding
  # stages an obfuscated command launch (the NMSDVDX file-overwrite shape,
  # where EnableLog drops the file and hcp:// launches it). The decoding
  # leg separates staged launches from plain shell references.
  - id: scripted-wscript-obfuscated-launch
    desc: Page script pairs WScript.Shell with unescape decoding
    crit: hostile
    conf: 0.95
    for: [html]
    all:
      - id: micro-behaviors/os/com/automation::html-activex-classid-object
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/data/decode/url::js-unescape-call-text
    unless:
      - id: well-known/app/ai/coding-agent/
