# OUACtrl-driven Office document staging. After instantiating the Office UA
# control and working its dialog (ShowDialog plus tab selection), the page
# retargets a frame at a Word, Excel or PowerPoint document, handing
# execution to Office under the lowered settings. The document type, not its
# attacker-chosen filename, gates the rule.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1203

composite_rules:
  - id: ouactrl-staged-office-document
    desc: OUACtrl exploit stages Office document through dialog bypass
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/com/automation::activex-constructor-call
      - id: micro-behaviors/ui/window/automation::showdialog-dialog-id-call
      - id: micro-behaviors/ui/window/automation::selecttabsdm-tab-id-call
      - id: micro-behaviors/ui/window/navigation::frame-location-office-document
    near_bytes: 2000
