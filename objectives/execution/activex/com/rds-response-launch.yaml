# RDS factories bypass the browser's normal COM creation boundary. HTTP
# response access, stream saving and Shell.Application execution distinguish
# the downloader exploit from pages that merely enumerate COM controls.
defaults:
  platforms: [windows]
  for: [html, javascript]
composite_rules:
  - id: rds-http-response-save-and-launch
    desc: RDS factory with HTTP save-and-launch APIs
    crit: hostile
    conf: 0.98
    attack: T1203,T1105
    all:
      - id: metadata/file/profile/com-encoded::rds-dataspace-clsid
      - id: micro-behaviors/os/com/instantiation::activex-constructor-call
      - id: micro-behaviors/communications/http/client/response-body::javascript-response-body
      - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
      - id: metadata/file/profile/com-progid::shell-application-progid
      - id: micro-behaviors/process/create/shellexec::shellexecute-method-call
    near_bytes: 6000
