defaults:
  for: [html]
  platforms: [windows]
composite_rules:
  - id: concealed-printable-native-code-execution
    desc: Offscreen browser combines printable native code with COM Run
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/decode/custom::printable-x86-self-decoder
      - id: micro-behaviors/fs/write/content::fso-open-text-file-write
      - id: micro-behaviors/os/com/automation::wscript-shell-activex-constructor
      - id: micro-behaviors/data/control-flow/dispatch::run-zero-style-argument
      - id: micro-behaviors/ui/window/control::window-moveto-large-coordinate
