defaults:
  for:
  - html
  platforms:
  - windows
  crit: hostile
  conf: 0.98
  attack: T1203
composite_rules:
- id: packed-baidubar-executable-download
  desc: Packed BaiduBar download dispatch with URI/file arguments
  all:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::packer-eval-pattern
  - id: micro-behaviors/os/application/target::packed-baidubar-progid-tokens
  - id: metadata/file/encoding::packed-hex-ds-tokens
  - id: metadata/file/encoding::packed-hex-lad-tokens
  - id: metadata/file/encoding::packed-exe-extension-token
  - id: micro-behaviors/data/control-flow/dispatch::js-computed-property-call
  - id: micro-behaviors/communications/url/path::packed-uri-file-arguments
- id: percent-baidubar-executable-download
  desc: Percent-escaped BaiduBar DloadDS downloads an executable
  all:
  - id: micro-behaviors/ui/window/insert-html::source-unescape-then-document-write
  - id: micro-behaviors/os/application/target::percent-hex-baidubar-name
  - id: micro-behaviors/communications/http/download/browser::percent-hex-dloadds-name
  - id: micro-behaviors/communications/http/url/path::percent-cab-exe-arguments
