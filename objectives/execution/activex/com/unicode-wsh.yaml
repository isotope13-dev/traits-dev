defaults:
  for: [javascript, html, text]
  platforms: [windows]
composite_rules:
  - id: concealed-unicode-pe-drop-execute
    desc: Offscreen ActiveX writes and launches encoded PE
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/embedded/payload/header::escaped-pe-i386-header
      - id: micro-behaviors/ui/window/control::move-window-far-offscreen
      - id: micro-behaviors/fs/write/content::write-mz-header
      - id: micro-behaviors/fs/write/content::fso-append-unicode-mode
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-method-call
      - id: micro-behaviors/fs/write/content::create-text-file-variable-path
      - id: micro-behaviors/process/create/shell/wsh::run-variable-path
