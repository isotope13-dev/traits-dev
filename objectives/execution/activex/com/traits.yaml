- id: wsh-obfuscated-activex-hidden-dropper
  desc: WSH script builds an obfuscated ActiveX object and runs a hidden process
  crit: hostile
  conf: 0.95
  for: [javascript]
  attack: T1059.007
    # A runtime-obscured COM constructor (computed or concatenated ProgID, or
    # a local constructor alias) AND a window-hidden Run() of a command.
    # Obscuring the COM class and then launching an invisible process is the
    # JScript dropper signature. A plain variable ProgID is not obscuring:
    # a COM factory taking the ProgID as a parameter still passes readable
    # string literals at every call site.
  all:
  - id: micro-behaviors/data/control-flow/dispatch::run-zero-boolean-arguments
  any:
  - id: activex-object-computed-progid
  - id: activex-object-aliased-constructor
  - id: micro-behaviors/os/com/automation::activex-concatenated-progid
  - id: activex-bracket-concat-access
