defaults:
  crit: notable
  conf: 0.8
  platforms:
    - windows
  for:
    - javascript
    - vbs
    - html
  attack: T1059.005
  mbc: E1243
traits:
  - id: activex-wmi
    desc: WbemScripting.SWbemLocator
    if:
      type: string_literal
      substr: WbemScripting.SWbemLocator
    attack: T1047
    mbc: E1043
  - id: activex-object-global-lookup-unicode
    desc: this lookup for ActiveXObject
    crit: notable
    if:
      type: encoded
      encoding: unicode-escape
      regex: (?i)\bthis\s*\[\s*['"]ActiveXObject['"]\s*\]
    attack: T1202
  - id: activex-bracket-concat-access
    desc: ActiveXObject via bracket concatenation
    crit: notable
    conf: 0.94
    for: [javascript, html]
    if:
      type: text
      regex: '\[["'']Active["'']\s*\+\s*["'']XObject["'']\]'
    attack: T1027
  - id: activex-object-computed-progid
    desc: ActiveXObject built with computed ProgID
    crit: notable
    conf: 0.9
    # `new ActiveXObject((function(){...String.fromCharCode...})())` — the COM
    # ProgID is built at runtime by an inline function instead of being a string
    # literal ("WScript.Shell", "Scripting.FileSystemObject", ...). Legitimate
    # WSH code always passes a literal ProgID; reconstructing it solely hides the
    # class from static AV/string scanners. Hallmark of obfuscated JScript droppers.
    if:
      type: text
      regex: 'new\s+ActiveXObject\s*\(\s*\(\s*function'
    attack: T1027
  - id: activex-object-aliased-constructor
    desc: ActiveXObject via local alias
    crit: notable
    conf: 0.95
    # Aliasing the COM constructor is useful triage context, but is not hostile
    # by itself; composites add decoded ProgIDs or hidden execution behavior.
    if:
      type: text
      regex: '\b\w+\s*=\s*ActiveXObject\s*;'
    attack: T1027
    unless:
    - id: well-known/lib/ui/svg-pan-zoom::package-path
    - id: metadata/package/testing/presence/harness::test-directory-path
  - id: activex-object-question-delimited-progid
    desc: 'activex object question delimited progid'
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '\([''"]\?\?[''"]\)\s*\[.{1,80}\]\([''"][''"]\)[\s\S]{0,260}\bnew\s+ActiveXObject\s*\('
    attack: T1027
  - id: activex-indirect-hidden-run
    desc: ActiveX indirect hidden process launch
    crit: notable
    conf: 0.96
    if:
      type: text
      # WSH commonly stores the Boolean show-window flag in a variable and
      # calls the aliased COM object's Run method later. Keep the assignment
      # and invocation in one bounded match.
      regex: '(?is)\b\w+\s*\.\s*Run\s*\([^)]{1,100},\s*\(1\+-1\),\s*\w+\s*\)'
    attack: T1059.007
  - id: activex-indirect-environment-staging
    desc: COM default-property staging assignment
    crit: notable
    conf: 0.95
    if:
      type: text
      # JScript COM default-property syntax permits assignments such as
      # `env("randomName") = encodedChunk`.  In JavaScript a call-shaped
      # assignment target is only valid against a COM default property, so
      # any identifier receiver matches: droppers alias the Environment
      # object to a generated name before staging.  The quoted 8-40 char
      # name keeps ordinary short-keyed calls out.
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\s*\(\s*["''][A-Za-z0-9_$]{8,40}["'']\s*\)\s*=\s*[A-Za-z_$]'
    attack: T1027,T1059.007
  - id: js-length-bound-string-grow
    desc: Grows string past a length bound
    crit: notable
    conf: 0.86
    for: [javascript, html, elixir, scala, ruby, objectivec]
    platforms: [windows, unix]
    if:
      type: text
      regex: 'while\s*\([\w$]{1,16}\.length\s*<\s*(0x[\da-fA-F]{3,}|[0-9]{4,})\)[^\n]{0,40}\+='
  - id: js-scaled-length-string-double
    desc: Doubles string below scaled length
    crit: notable
    conf: 0.86
    for: [javascript, html]
    if:
      type: text
      regex: '(?s)while\s*\(\w+\.length\s*\*\s*2\s*<\s*\w+\s*\).{0,80}\w+\s*\+=\s*\w+'
  - id: js-do-while-string-double
    desc: Doubles a string until a length bound
    crit: notable
    conf: 0.86
    for: [javascript, html, elixir, scala, ruby, objectivec]
    platforms: [windows, unix]
    if:
      type: text
      regex: 'do\s*\{[^}]{0,40}\+=[^;]{1,24};\s*}\s*while\s*\([^)]{1,40}\.length'
  - id: concatenated-activex-progid
    desc: Builds ActiveX ProgID from fragments
    crit: suspicious
    conf: 0.94
    for: [javascript, html, elixir, scala, ruby]
    attack: T1027
    if:
      type: text
      regex: '["''][A-Za-z]{2,8}["'']\s*\+\s*["''][A-Za-z]{2,10}\.[A-Za-z]'
    unless:
      # Generated source maps embed the original bundle text, including
      # ordinary string concatenation. The map is not executed.
      - id: metadata/build/bundler/vscode::javascript-source-map-file
  - id: js-padding-char-spray
    desc: Appends one char to a padding buffer
    crit: notable
    conf: 0.86
    for: [javascript, html, elixir, scala]
    if:
      type: text
      regex: 'Padding\s*\+=\s*["''][^"'']{1,4}["'']'
composite_rules:
  - id: hta-obfuscated-activex-document-stager
    desc: Obfuscated ActiveX stages HTA document content
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007,T1105,T1564.003
    mbc: B0023,B0032
    for: [javascript]
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: objectives/evasion/process/hidden/execution::hidden-hta-window
      - id: micro-behaviors/os/com/automation::activex-object-variable-progid
      - id: micro-behaviors/data/encode/char-code::fromcharcode-call
      - id: micro-behaviors/data/source/property/computed::js-computed-call-false-third-argument
      - id: micro-behaviors/process/create/load/remote-code::js-computed-document-member-argument
    near_bytes: 4096

  - id: obfuscated-activex-file-stager
    desc: Obfuscated COM script writes decoded payload
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007,T1105
    mbc: B0023,B0032
    for: [javascript]
    all:
      - id: micro-behaviors/data/decode/custom::js-alphabet-coded-decoder-source
      - id: micro-behaviors/process/interpreter/eval/indirect::js-eval-alias-assignment
      - id: micro-behaviors/process/interpreter/jscript::activex-object
      - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
    near_bytes: 16384

  - id: activex-file-network
    for: [javascript]
    desc: File + network operations
    crit: suspicious
    conf: 0.85
    attack: T1071
    all:
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
      - id: micro-behaviors/communications/http/client/xmlhttp::activex-network-access
    unless:
      - id: metadata/lang/source::yara-rule-source
  - id: activex-shell-execution
    desc: Shell command execution via COM
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
    any:
      - id: micro-behaviors/process/create/shell/wsh::wsh-process-launch-method
  # Bare Shell.Application.ShellExecute is the normal UAC-elevation helper
  # shape (MSDN elevate.js and vendors of it in GIS/install toolchains). Keep
  # it notable; hostile composites still require hidden/obfuscated launch.
  - id: activex-shell-app-execute
    desc: Shell.Application ShellExecute invocation
    crit: notable
    conf: 0.9
    attack: T1059.007
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::tests-path-filename
    all:
      - id: micro-behaviors/os/com/automation::shell-application-progid
      - id: micro-behaviors/process/create/shell/wsh::shellexecute-method-call
  - id: obfuscated-hidden-activex-command-loader
    desc: Obfuscated ActiveX script launches hidden command
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007,T1564.003
    for: [javascript]
    all:
      - id: activex-shell-app-execute
      - id: micro-behaviors/process/create/shell/wsh::shell-application-shellexecute-hidden
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
      - id: objectives/anti-static/obfuscation/string/junking::consonant-vowel-gibberish-source
  - id: obfuscated-vbs-shellexecute-loader
    desc: Obfuscated VBScript launches a command through Shell.Application
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.005,T1059.007
    for: [vbs]
    all:
      - id: activex-shell-app-execute
      - id: objectives/anti-static/obfuscation/wsh::vbs-execute-concat-code
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-process-run
  - id: wsh-obfuscated-activex-hidden-dropper
    desc: WSH script builds an obfuscated ActiveX object and runs a hidden process
    crit: hostile
    conf: 0.95
    for: [javascript]
    attack: T1059.007
    # A runtime-obscured COM constructor (computed ProgID, variable ProgID, or
    # a local alias) AND a window-hidden Run() of a command. Obscuring the COM
    # class and then launching an invisible process is the JScript dropper
    # signature; the constructor alternatives cover equivalent alias shapes.
    all:
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-hidden-window-text
    any:
      - id: activex-object-computed-progid
      - id: micro-behaviors/os/com/automation::activex-object-variable-progid
      - id: activex-object-aliased-constructor
      - id: concatenated-activex-progid
      - id: activex-bracket-concat-access
      - id: micro-behaviors/os/com/automation::wscript-shell-multi-chunk-progid
  - id: wsh-aliased-activex-hidden-environment-stager
    for: [javascript]
    desc: Obfuscated ActiveX script stages an environment payload and launches it hidden
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1059.007
    all:
      - id: activex-object-aliased-constructor
      # A single COM default-property assignment is not payload staging. The
      # cluster requires the many encoded environment entries used as a carrier.
      - id: micro-behaviors/os/env/modify::encoded-call-assignment-cluster
      - id: micro-behaviors/data/decode/xor::charcode-modulo-key-index
      - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-hidden-window-text
  - id: wsh-aliased-activex-hidden-runner
    for: [javascript, html]
    desc: Obfuscated ActiveX object launches a hidden child process
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007
    all:
      - id: activex-object-aliased-constructor
      - id: activex-indirect-hidden-run
      - id: micro-behaviors/data/decode/xor::charcode-modulo-key-index
  - id: wsh-obfuscated-environment-powershell-loader
    for: [javascript]
    desc: Obfuscated WSH environment-staged hidden loader
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007,T1564.003
    all:
      - id: micro-behaviors/process/interpreter/jscript::createobject-call
      - id: micro-behaviors/os/env/modify::wsh-environment-indexed-staging
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-hidden-window-text
      - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
      # The decoder may terminate in unescape() or in a computed
      # String.fromCharCode() call with an XOR byte mask.
    any:
      - id: micro-behaviors/data/decode/custom::js-charcode-mask-unescape-decoder
      - id: micro-behaviors/data/encode/char-code::fromcharcode-xor-rebuild
      - id: micro-behaviors/data/encode/char-code::computed-string-method-xor-rebuild
  - id: obfuscated-wsh-powershell-file-dropper
