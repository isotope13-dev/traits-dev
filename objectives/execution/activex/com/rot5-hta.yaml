defaults:
  platforms: [windows]
  for: [html, javascript, data]
  conf: 0.98

composite_rules:
  - id: percent-rot5-concealed-download-execute
    desc: Encoded COM page conceals download and launch
    crit: hostile
    attack: T1105,T1027,T1204.002
    all:
      - id: micro-behaviors/communications/http/client/xmlhttp::rot5-xmlhttp-progid
      - id: micro-behaviors/communications/http/client/response-body::rot5-response-body
      - id: micro-behaviors/fs/write/file/stream::rot5-stream-save-to-file
      - id: micro-behaviors/process/create/shellexec::rot5-shell-execute
      - id: objectives/anti-static/obfuscation/encoding/layered::eval-percent-document-writer
      - id: objectives/anti-static/obfuscation/encoding/layered::percent-encoded-charcode-decoder
