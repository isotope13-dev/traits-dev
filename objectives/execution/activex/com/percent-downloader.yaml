defaults:
  platforms: [windows]
  for: [html]
composite_rules:
  - id: concealed-rds-shell-stream-probe
    desc: Concealed RDS shell and stream factory probes
    crit: hostile
    conf: 0.99
    attack: T1203
    all:
      - id: micro-behaviors/os/com/instantiation::percent-decoded-com-factory-overload
      - id: micro-behaviors/os/com/automation::rds-dataspace-clsid
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/fs/write/stream::html-adodb-stream-progid-reference
      - id: micro-behaviors/ui/window/insert-html::source-unescape-then-document-write
