defaults:
  for: [html, javascript, text]
  platforms: [windows]
  attack: T1203
composite_rules:
  - id: baidubar-remote-cab-executable-download
    desc: BaiduBar remote CAB executable download abuse
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/com/automation::baidubar-tool-progid
      - id: micro-behaviors/communications/http/download/browser::baidubar-dloadds-method
      - id: micro-behaviors/communications/http/url/path::remote-cab-exe-arguments
    near_bytes: 600
