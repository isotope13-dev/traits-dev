# Python RAT-style dependency pins in a requirements file: Windows WMI plus
# a crypto library and/or local interface enumeration. Legitimate apps almost
# never combine those three on a four-line requirements list.
#
# The pins must sit near each other: a bare co-occurrence fires on any long
# package catalog (PyCharm's python plugin ships a 2000-line
# available_modules.txt inventory naming both wmi and netifaces 273 lines
# apart). near_lines keeps the four-line-requirements shape; a real RAT
# requirements file still lists its handful of deps adjacently.
defaults:
  platforms: [windows, unix]
  for: [requirements.txt, text]
  attack: T1059.006
  mbc: B0011

composite_rules:
  - id: pip-req-wmi-crypto-netifaces
    desc: Requirements pin WMI, crypto, and netifaces
    crit: hostile
    conf: 0.96
    near_lines: 10
    all:
      - id: metadata/build/pip::pip-req-wmi
      - id: metadata/build/pip::pip-req-pycrypto
      - id: metadata/build/pip::pip-req-netifaces
  - id: pip-req-wmi-crypto
    desc: Requirements pin WMI with a crypto library
    crit: hostile
    conf: 0.94
    near_lines: 10
    all:
      - id: metadata/build/pip::pip-req-wmi
      - id: metadata/build/pip::pip-req-pycrypto
  - id: pip-req-wmi-netifaces
    desc: Requirements pin WMI with netifaces
    crit: hostile
    conf: 0.93
    near_lines: 10
    all:
      - id: metadata/build/pip::pip-req-wmi
      - id: metadata/build/pip::pip-req-netifaces
