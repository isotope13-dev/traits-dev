# A related stager uses a new shell's -c argument instead of in-process eval.
# Join the decrypt output to that argument; a dynamic tool name supplies the
# concealment context. Successful decryption or hostile payload content is
# not established by the matcher alone.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1059.004,T1027,T1140
traits:
  - id: shell-dynamic-aes-stage-shell-c
    desc: Dynamic AES decoder feeds shell command text
    crit: suspicious
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((program
          (variable_assignment name: (variable_name) @stage
            value: (command_substitution
              (pipeline
                (command name: (command_name (expansion (variable_name)))
                  argument: (word) @enc
                  . argument: (word) @decrypt
                  . argument: (word) @cipher))))
          . (command name: (command_name (word) @shell)
            argument: (word) @flag
            . argument: (string (simple_expansion (variable_name) @used)))) @activation
          (#eq? @enc "enc") (#eq? @decrypt "-d")
          (#match? @cipher "^-aes-(128|192|256)-(ctr|cbc)$")
          (#match? @shell "^(/bin/)?(zsh|bash|sh)$")
          (#eq? @flag "-c") (#eq? @stage @used))
