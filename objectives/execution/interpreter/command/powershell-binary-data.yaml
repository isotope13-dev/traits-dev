# Binary character conversion and indexed PowerShell command invocation.
defaults:
  platforms:
  - windows
  for:
  - data
composite_rules:
- id: powershell-binary-character-indexed-invocation
  desc: Binary character decoding and indexed invocation
  crit: suspicious
  conf: 0.97
  all:
  - id: objectives/anti-static/obfuscation/string/concat::ps-binary-array-char-decode-data
  - id: objectives/anti-static/obfuscation/string/index-select::ps-pshome-index-invoke-data
  attack: T1059.001,T1027
