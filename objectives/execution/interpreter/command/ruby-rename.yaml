# Ruby command-execution observations with nearby executable renaming.
# The matchers do not prove the renamed path is the command's target.
defaults:
  platforms: [unix, windows]

composite_rules:
  - id: ruby-command-execution-evidence
    desc: Ruby command execution references
    crit: component
    for: [ruby]
    any:
      - id: micro-behaviors/process/replace::ruby-exec
      - id: micro-behaviors/process/create/subprocess/launch::ruby-popen
      - id: micro-behaviors/process/create/shell/substitution::ruby-subshell-command
      - id: micro-behaviors/process/create/shell/substitution::ruby-backtick-command-substitution
      - id: micro-behaviors/process/create/shell/variable-command::ruby-io-popen-interpolated
      - id: micro-behaviors/process/create/shell/variable-command::ruby-open3-interpolated-command
      - id: micro-behaviors/process/create/shell/command-mode::ruby-open3-bash-c-command
      - id: micro-behaviors/process/create/shell/interpreter::ruby-system-shell-interpreter
  - id: ruby-executable-rename-with-shell-call
    desc: Ruby executable rename with shell call
    crit: suspicious
    conf: 1.0
    for: [ruby]
    all:
      - id: ruby-command-execution-evidence
    any:
      - id: micro-behaviors/fs/file/rename::ruby-rename-to-exe
      - id: micro-behaviors/fs/file/rename::ruby-fileutils-mv-to-exe

  - id: ruby-image-rename-with-exec
    desc: Ruby image rename with command execution
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/file/rename::ruby-rename-image-to-executable
      - id: micro-behaviors/process/replace::ruby-exec
    any:
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::ruby-host-os-config-access
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::windows-os-check

  - id: ruby-os-probe-rename-and-exec
    desc: Ruby OS probe near rename and exec
    crit: suspicious
    conf: 0.85
    for: [ruby]
    near_lines: 40
    all:
      - id: micro-behaviors/process/replace::ruby-exec
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::platform-fingerprint
    any:
      - id: micro-behaviors/fs/file/rename::ruby-rename
      - id: micro-behaviors/fs/file/rename::ruby-rename-executable-argument
      - id: micro-behaviors/fs/file/rename::ruby-rename-image-to-executable

  - id: extconf-os-probe-ruby-exec
    desc: extconf.rb OS probe with Ruby exec
    crit: suspicious
    conf: 1.0
    for: [ruby]
    unless:
      - id: metadata/package/files/dependency::ruby-vendor-bundle-gem-path
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::windows-os-check
      - id: micro-behaviors/process/replace::ruby-exec

  - id: extconf-ruby-image-rename-with-exec
    desc: extconf.rb image rename with command launch
    crit: hostile
    conf: 0.98
    for: [ruby]
    attack: T1195.002
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: ruby-image-rename-with-exec

  - id: alpine-apk-extconf-rename-with-exec
    desc: Alpine apk includes extconf rename and exec
    crit: hostile
    conf: 0.98
    platforms: [linux, windows, unix]
    for: [alpine_apk, apk_alpine, tar, pkginfo, text, python, ruby, javascript, package.json]
    attack: T1195.002
    scope: outer
    all:
      - id: metadata/package/files/system-package::alpine-pkginfo-origin-field
      - id: extconf-ruby-image-rename-with-exec

  - id: extconf-exe-rename-with-ruby-exec
    desc: extconf.rb .exe rename with Ruby exec
    crit: hostile
    conf: 0.95
    for: [ruby]
    attack: T1059
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/fs/file/rename::ruby-rename-executable-argument
      - id: micro-behaviors/process/replace::ruby-exec

  - id: extconf-http-rename-and-exec
    desc: extconf HTTP, rename and exec clues
    crit: hostile
    conf: 0.98
    for: [ruby]
    attack: T1195.002
    all:
      - id: micro-behaviors/os/package-manager/hook-install::ruby-extconf-httparty-get
      - id: micro-behaviors/fs/file/rename::ruby-rename-executable-argument
      - id: micro-behaviors/process/replace::ruby-exec

  - id: extconf-rename-with-ruby-exec
    desc: extconf.rb rename with Ruby exec
    crit: hostile
    conf: 0.95
    for: [ruby]
    attack: T1195.002
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/fs/file/rename::ruby-rename
      - id: micro-behaviors/process/replace::ruby-exec
