# Runtime parameters can turn an innocuous SAP external-command definition
# into execution of a second program. These rules require the higher-level
# SAPXPG exec-gadget behavior before identifying its payload type.
defaults:
  for: [json]
  platforms: [unix, windows]
  conf: 0.98
  attack: T1059

composite_rules:
  - id: sapxpg-nested-executable
    desc: SAPXPG exec gadget names another executable
    crit: suspicious
    all:
      - id: well-known/app/enterprise/sap::sapxpg-process-event
      - id: micro-behaviors/process/argument/option::process-exec-gadget
      - id: micro-behaviors/process/argument/positional::process-executable-path-argument

  - id: sapxpg-shell-interpreter
    desc: SAPXPG exec gadget invokes a shell
    crit: suspicious
    attack: T1059.004
    all:
      - id: well-known/app/enterprise/sap::sapxpg-process-event
      - id: micro-behaviors/process/argument/option::process-exec-gadget
      - id: micro-behaviors/process/argument/positional::process-shell-path-argument
