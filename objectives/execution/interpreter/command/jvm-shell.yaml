# A JVM program that executes a shell command reconstructed from custom decoded
# or steganographic data is running dynamic payloads via the system shell.
defaults:
  platforms: [unix, macos, linux]
  for: [java, kotlin, jar, class, java_class]
  attack: T1059.004,T1027
  mbc: B0030

composite_rules:
  - id: jvm-decoded-stego-shell-execution
    desc: JVM executes shell command from decoded stego
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/data/decode/invisible-unicode::zero-width-command-data-decoder
      - id: micro-behaviors/fs/path/application/interpreter::jvm-command-shell-path
    any:
      - id: metadata/import/jvm::java-runtime-exec-bytecode-reference
      - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-bytecode
      - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-source
      - id: micro-behaviors/process/create/subprocess/configure::kotlin-processbuilder-shell
      - id: micro-behaviors/process/create/shell/command-mode::jvm-processbuilder-sh-command-start

  - id: jvm-source-decoded-stego-shell-execution
    desc: JVM source executes shell command from decoded stego
    crit: hostile
    conf: 0.99
    for: [java, kotlin]
    all:
      - id: micro-behaviors/process/create/shell/command-mode::jvm-processbuilder-sh-command-start
      - id: micro-behaviors/process/deploy/interpreter-command::jvm-sh-c-argument-pass
      - id: micro-behaviors/data/decode/invisible-unicode::zero-width-command-data-decoder
    any:
      - id: micro-behaviors/process/create/subprocess/configure::kotlin-processbuilder-shell
      - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-source

