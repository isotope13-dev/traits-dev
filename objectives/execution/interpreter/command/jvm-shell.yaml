# A JVM program that executes a shell command reconstructed from custom decoded
# or steganographic data is running dynamic payloads via the system shell.
defaults:
  platforms: [unix, macos, linux]
  for: [java, kotlin, jar, class, java_class]
  attack: T1059.004,T1027
  mbc: B0030

composite_rules:
  - id: jvm-decoded-stego-shell-execution
    desc: JVM executes shell command from decoded stego
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/create/shell/interpreter::jvm-processbuilder-sh-command-start
      - id: micro-behaviors/process/create/shell/interpreter::jvm-sh-c-argument-pass
      - id: micro-behaviors/data/decode/custom::zero-width-command-data-decoder
    any:
      - id: micro-behaviors/process/create/shell/spawn::kotlin-processbuilder-shell
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-source
