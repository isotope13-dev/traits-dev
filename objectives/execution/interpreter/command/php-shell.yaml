defaults:
  platforms: [unix, macos, linux]
  for: [php]
  attack: T1059.004,T1027
  mbc: B0030

composite_rules:
  - id: php-decoded-stego-shell-execution
    desc: PHP executes shell command from decoded stego
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/create/shell/command-mode::php-shell-exec
      - id: micro-behaviors/data/decode/invisible-unicode::zero-width-command-data-decoder
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
    unless:
      - id: metadata/path/directory::test-directory-component
