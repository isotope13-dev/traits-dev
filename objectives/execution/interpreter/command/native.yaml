defaults:
  platforms: [macos]
  for: [macho]
  attack: T1059.004,T1027

composite_rules:
  - id: macho-obfuscated-command-runner
    desc: Mach-O obfuscated command runner
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/payload/import::imports-at-most-50-macho
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: micro-behaviors/process/create/popen::c-popen
      - id: micro-behaviors/dylib/load/runtime::dlopen-dlsym
  - id: macho-global-init-obfuscated-shell
    desc: Mach-O global initializer runs an obfuscated shell pipeline
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.004
    all:
      - id: micro-behaviors/process/lifecycle/auto-exec::macho-module-initializer
      - id: micro-behaviors/process/create/direct::fork-execl-piped-stdio
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text
      - id: objectives/anti-static/obfuscation/payload/string-sparse::extreme-string-sparsity-macho
