defaults:
  for: [pe, dll]
  platforms: [windows]

composite_rules:
  - id: junked-mutex-gated-system-directory-winexec
    desc: Junk-obfuscated mutex-gated system-directory WinExec
    crit: hostile
    conf: 0.97
    attack: T1106,T1027
    all:
      - id: objectives/anti-static/obfuscation/instruction/junk::dead-register-xor-churn
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/os/sysinfo/directories::get-system-directory
      - id: micro-behaviors/process/sync/mutex::open-mutex
      - id: metadata/binary/metrics/structural::minimal-exports
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: metadata/binary/installer/family/
