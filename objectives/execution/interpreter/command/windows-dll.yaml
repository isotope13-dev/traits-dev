defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: opaque-child-basename-ghibkjhm
    desc: Opaque Ghibkjhm child basename
    crit: component
    conf: 0.99
    if:
      type: text
      exact: Ghibkjhm
  - id: decoy-token-jklmno
    desc: Sequential jklmno decoy token
    crit: component
    conf: 0.99
    if:
      type: text
      exact: jklmno
  - id: engel-mutex-name
    desc: Engel mutex name
    crit: component
    conf: 0.99
    if:
      type: text
      exact: Engel

composite_rules:
  - id: opaque-child-decoy-mutex-launch-cluster
    desc: Opaque child, decoy, and mutex identifiers in launcher DLL
    crit: hostile
    conf: 0.99
    attack: T1106
    all:
      - id: opaque-child-basename-ghibkjhm
      - id: decoy-token-jklmno
      - id: engel-mutex-name
      - id: micro-behaviors/process/create/exec::winexec
  - id: mutex-gated-system-directory-winexec
    desc: Mutex-gated WinExec launch from system directory
    crit: hostile
    conf: 0.93
    attack: T1106
    all:
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/os/sysinfo/directories::get-system-directory
      - id: micro-behaviors/process/sync/mutex::open-mutex
      - id: metadata/binary/metrics/structural::minimal-exports
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: metadata/binary/installer/family/
