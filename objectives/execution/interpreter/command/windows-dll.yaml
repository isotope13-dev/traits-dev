defaults:
  for: [pe, dll]
  platforms: [windows]

composite_rules:
  - id: mutex-gated-system-directory-winexec-dll
    desc: DLL launches a system-directory program after a mutex check
    crit: suspicious
    conf: 0.91
    attack: T1106
    all:
      - id: metadata/binary/metrics/pe-details::pe-dll-characteristics
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/os/sysinfo/directories::get-system-directory
      - id: micro-behaviors/process/sync/mutex::mutex-instance-check
    any:
      - id: metadata/binary/metrics/structural::minimal-exports
      - id: metadata/binary/resource::small-pe-no-resources
      - id: micro-behaviors/fs/path/construct::sprintf-format-api
    needs: 2
    unless:
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/signed/platform/

  - id: junked-mutex-gated-system-directory-winexec
    desc: Junk-obfuscated DLL launches a system-directory program
    crit: hostile
    conf: 0.97
    attack: T1106,T1027
    all:
      - id: objectives/anti-static/obfuscation/instruction/junk::dead-register-xor-churn
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/os/sysinfo/directories::get-system-directory
      - id: micro-behaviors/process/sync/mutex::open-mutex
      - id: metadata/binary/metrics/structural::minimal-exports
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: metadata/binary/installer/family/

  - id: sparse-mutex-gated-system-directory-launcher
    desc: Sparse DLL launches a system-directory program after a mutex check
    crit: hostile
    conf: 0.95
    attack: T1106
    all:
      - id: mutex-gated-system-directory-winexec-dll
      - id: metadata/binary/metrics/structural::minimal-exports
      - id: metadata/binary/resource::small-pe-no-resources
    any:
      - id: metadata/binary/metrics/size::tiny-pe
      - id: metadata/binary/metrics/structural::high-import-density
      - id: micro-behaviors/os/env/access::get-environment-strings
    needs: 2
    unless:
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/signed/platform/
