defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007

composite_rules:
  # The infection marker supplies intent; child_process.exec supplies the
  # attempted execution. This does not claim that a malformed command succeeds.
  - id: node-exec-with-infection-status
    desc: Node command execution attempt accompanies infection status
    crit: hostile
    conf: 0.97
    scope: file
    near_lines: 12
    all:
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: objectives/impact/infect/terms::infected-status-term
    unless:
      - id: metadata/build/
      - id: metadata/package/testing/
