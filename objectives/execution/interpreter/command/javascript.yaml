defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1059.007
  crit: hostile
  conf: 0.97
composite_rules:
- id: node-exec-with-infection-status
  desc: Node command execution attempt accompanies infection status
  scope: file
  near_lines: 12
  all:
  - id: micro-behaviors/process/create/shell/command-string::js-exec
  - id: objectives/impact/infect/terms::infected-status-term
  unless:
  - id: metadata/path/directory::test-directory-component
- id: deaddrop-staged-node-eval-socket
  desc: Dead-drop resolution stages node eval socket
  near_bytes: 4000
  all:
  - id: micro-behaviors/process/interpreter/node::node-spawn-eval-argument
  - id: micro-behaviors/communications/socket/connect/attempt::socket-connect-port-host
  - id: micro-behaviors/data/transaction/query::ethereum-recipient-four-byte-slices
  any:
  - id: micro-behaviors/communications/rpc::jsonrpc-2-protocol-object
  - id: well-known/app/finance/blockscout::blockscout-account-transaction-list
  unless:
  - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url
