defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007

composite_rules:
  # The infection marker supplies intent; child_process.exec supplies the
  # attempted execution. This does not claim that a malformed command succeeds.
  - id: node-exec-with-infection-status
    desc: Node command execution attempt accompanies infection status
    crit: hostile
    conf: 0.97
    scope: file
    near_lines: 12
    all:
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: objectives/impact/infect/terms::infected-status-term
    unless:
      - id: metadata/build/
      - id: metadata/package/testing/
  # Blockchain dead-drop resolvers that hand the decoded endpoint to a raw
  # socket dialer hide the dial inside a string evaluated by a freshly
  # spawned interpreter (spawn('node', ['-e', "require('net').connect..."])),
  # so the socket atom alone never sees a call site. The spawned inline eval
  # is the staging sink: decode plus dial string plus fresh interpreter is
  # the dead-drop-to-shell shape, not generic socket code.
  - id: deaddrop-staged-node-eval-socket
    desc: Dead-drop resolution stages node eval socket
    crit: hostile
    conf: 0.97
    near_bytes: 4000
    all:
      - id: micro-behaviors/process/interpreter/node::node-spawn-eval-argument
      - id: micro-behaviors/communications/socket/connect::socket-connect-port-host
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-recipient-four-byte-slices
    any:
      - id: micro-behaviors/communications/rpc::jsonrpc-2-protocol-object
      - id: micro-behaviors/crypto/library/blockchain/client::blockscout-account-transaction-list
