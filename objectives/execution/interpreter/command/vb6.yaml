defaults:
  platforms: [windows]
  for: [pe]
  attack: T1059.003,T1027

composite_rules:
  - id: vb6-obfuscated-cmd-reference
    desc: VB6 obfuscated runtime with cmd.exe /c
    crit: suspicious
    conf: 0.94
    all:
      - id: objectives/anti-static/obfuscation/imports/concealment::vb6-obfuscated-runtime-dispatch
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-command
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-concealed-cmd-reference
    desc: VB6 concealed Win32 APIs with cmd.exe /c
    crit: suspicious
    conf: 0.94
    all:
      - id: objectives/anti-static/obfuscation/imports/concealment::vb6-concealed-win32-apis
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-command
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
