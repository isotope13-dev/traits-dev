# Configuration statements are represented under micro-behaviors/data/db/config.
# This rule retains the separate process-launch profile.
defaults:
  platforms: [windows]
  # SQL scripts and dumps are commonly typed as plain text; keep language
  # carriers too for embedded enablement inside installers and loaders.
  for: [powershell, c, cpp, csharp, python, batch, text]
  attack: T1059.003

composite_rules:
  - id: sql-server-command-shell-launch
    desc: SQL Server launches a command shell
    crit: hostile
    conf: 0.98
    near_bytes: 512
    all:
      - id: micro-behaviors/fs/path/basename::sqlservr-executable-reference
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
    any:
      - id: micro-behaviors/process/create/exec::create-process-a
      - id: micro-behaviors/process/create/exec::start-process-call
