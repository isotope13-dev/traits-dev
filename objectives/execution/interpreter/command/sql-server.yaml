# SQL Server configuration and process-launch artifacts used as an OS-command
# launcher. These rules describe the command-execution technique, not a named
# ransomware family.
defaults:
  platforms: [windows]
  # SQL scripts and dumps are commonly typed as plain text; keep language
  # carriers too for embedded enablement inside installers and loaders.
  for: [powershell, c, cpp, csharp, python, batch, text]
  attack: T1059.003

traits:
  - id: sql-xp-cmdshell-option
    desc: SQL Server xp_cmdshell option
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bsp_configure\s*[''"]xp_cmdshell[''"]'

  - id: sql-xp-cmdshell-enable-value
    desc: xp_cmdshell enabled value
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)xp_cmdshell[''"]?\s*,\s*1\b'

  - id: sql-reconfigure-command
    desc: SQL Server RECONFIGURE command
    crit: notable
    conf: 0.92
    if:
      type: text
      word: RECONFIGURE

  - id: sqlservr-process-reference
    desc: SQL Server process image reference
    crit: component
    conf: 0.9
    if:
      type: text
      word: sqlservr.exe

  - id: command-shell-image-reference
    desc: Windows command-shell image reference
    crit: component
    conf: 0.9
    if:
      type: text
      word: cmd.exe

composite_rules:
  - id: sql-server-xp-cmdshell-enable
    desc: Enables SQL Server xp_cmdshell
    crit: hostile
    conf: 0.99
    near_lines: 4
    all:
      - id: sql-xp-cmdshell-option
      - id: sql-xp-cmdshell-enable-value
      - id: sql-reconfigure-command
    unless:
      - id: well-known/tool/offensive/bingo/
      - id: well-known/tool/offensive/mcpsec/
      - id: well-known/tool/offensive/impacket::source-tree-member
  - id: sql-server-command-shell-launch
    desc: SQL Server launches a command shell
    crit: hostile
    conf: 0.98
    near_bytes: 512
    all:
      - id: sqlservr-process-reference
      - id: command-shell-image-reference
    any:
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/process/create/start-process::start-process-call
