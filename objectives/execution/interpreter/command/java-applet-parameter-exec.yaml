defaults:
  for: [class, java_class]
  platforms: [windows, unix]
  attack: T1059

traits:
  - id: java-applet-class-reference
    desc: Java class references Applet
    crit: component
    conf: 0.9
    if:
      type: import
      exact: java/applet/Applet

  - id: java-applet-parameter-import
    desc: Java class imports parameter lookup
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: import
      exact: getParameter

  - id: java-applet-platform-command-keys
    desc: Applet has platform-specific command keys
    crit: notable
    conf: 0.92
    if:
      type: value
      path: class.strings[*]
      regex: '^(windows|linux|unix)[12]$'

composite_rules:
  - id: java-applet-parameter-command-execution
    desc: Applet executes commands from input parameters
    crit: hostile
    conf: 0.96
    all:
      - id: java-applet-class-reference
      - id: java-applet-parameter-import
      - id: java-applet-platform-command-keys
      - id: metadata/import/jvm::java-runtime-exec-bytecode-reference
