defaults:
  platforms: [windows]
  for: [javascript, text, data]
composite_rules:
- id: shell-application-execution-clues
  for: [javascript]
  desc: Shell Application execution clues
  crit: suspicious
  conf: 0.98
  all:
  - id: objectives/execution/interpreter/scripting/host::shell-application-split-join
  - id: micro-behaviors/os/handler/open::shellexecute-method-reference
  any:
  - id: micro-behaviors/process/create/hidden::conhost-headless
  - id: micro-behaviors/process/config/window::conhost-split-headless-clues
  - id: metadata/lang/source/literal/fragment/sequence::split-conhost-powershell-text
  - id: micro-behaviors/os/handler/open::shell-application-execute-context
