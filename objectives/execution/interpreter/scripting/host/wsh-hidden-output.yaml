# Capturing a child process's stdout through WScript.Shell.Exec is a plain
# scripting capability: uninstallers, inventory scripts and setup wrappers all
# do it, and they routinely also launch something with a hidden window. The
# original form of this rule accepted "hidden window run" as its intent leg and
# therefore called Microsoft's own OffScrub10.vbs Office-removal script a
# hostile hidden-command runner. The only leg that carries attacker intent is
# the runtime assembly of the executed code, so the composite now requires it
# and is named for that. The bare capability stays visible through the
# individual notable atoms (`exec-method`, `wsh-process-output-readall`).
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1059.005

composite_rules:
  - id: vbs-concat-execute-with-output-capture
    desc: VBScript Execute concat code, captures output
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/wsh::vbs-execute-concat-code
      - id: micro-behaviors/os/wsh/file::wscript-shell-object
      - id: objectives/execution/interpreter/scripting/host::exec-method
      - id: micro-behaviors/process/io/wsh::wsh-process-output-readall
