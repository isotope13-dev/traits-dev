# The script writes `net use` into a batch variable and then `run`s an
# executable. That is the worm launching the share-mapping step it just
# staged, not a chat client mentioning either command.
defaults:
  platforms: [windows, unix]
  for: [mirc]
  attack: T1059
composite_rules:
  - id: mirc-runs-staged-net-use
    desc: mIRC runs a staged net use
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/network/share::stages-net-use-line
      - id: objectives/command-and-control/channel/irc/client::mirc-launches-exe
