defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript, typescript]
composite_rules:
- id: jscript-obfuscated-batch-execution
  desc: "JScript batch execution and obfuscation"
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/process/interpreter/scripting::jscript-cc-on
  - id: micro-behaviors/process/create/subprocess/reference::batch-script-execution
  any:
  - id: objectives/anti-static/obfuscation/string/conceal::js-createobject-reversed
  - id: objectives/anti-static/obfuscation/string/conceal::js-adodb-savetofile-reversed
  - id: objectives/anti-static/obfuscation/string/conceal::js-xmlhttp-responsebody-reversed
  attack: "T1059.003"
  mbc: "E1100"
