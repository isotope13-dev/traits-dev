  - id: micro-behaviors/os/env/read/variable::wsh-environment-symbol
  - id: metadata/lang/source/literal/fragment/sequence::split-cmd-powershell-text
  - id: metadata/lang/source/literal/fragment/sequence::split-conhost-powershell-text
  - id: metadata/lang/encoding/shape/fragment::conhost-name-split-join
- id: wscript-exec-fragmented-window-clues
  for: [javascript]
  desc: WScript Exec and fragmented window clues
  crit: suspicious
  conf: 0.98
  all:
  - id: objectives/execution/interpreter/scripting/host::exec-invocation-patterns
  - id: metadata/lang/source/literal/fragment/sequence::window-noprofile-text-fragments
  any:
  - id: objectives/execution/interpreter/scripting/host::wscript-shell-split-join
  - id: micro-behaviors/os/env/read/variable::wsh-environment-symbol
  - id: metadata/lang/source/literal/fragment/sequence::split-cmd-powershell-text
  - id: metadata/lang/source/literal/fragment/sequence::split-conhost-powershell-text
  - id: metadata/lang/encoding/shape/fragment::conhost-name-split-join
