  - id: metadata/lang/source/literal/fragment/sequence::split-conhost-powershell-text
  - id: micro-behaviors/os/handler/open::shell-application-execute-context
- id: shell-application-sharded-bypass-clues
  for: [javascript]
  desc: Shell Application sharded bypass clues
  crit: suspicious
  conf: 0.98
  all:
  - id: objectives/execution/interpreter/scripting/host::shell-application-split-join-sharded
  - id: micro-behaviors/os/handler/open::shellexecute-method-reference
  - id: metadata/lang/source/literal/fragment/sequence::hidden-noprofile-bypass-fragments
