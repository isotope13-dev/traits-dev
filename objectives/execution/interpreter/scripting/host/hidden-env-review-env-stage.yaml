defaults:
  platforms: [windows]
  for: [javascript, text, data]
composite_rules:
- id: shell-application-fragmented-hidden-flags
  for: [javascript]
  desc: Shell Application fragmented window flags
  crit: suspicious
  conf: 0.98
  all:
