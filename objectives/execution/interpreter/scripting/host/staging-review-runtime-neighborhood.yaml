defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: hostile
composite_rules:
- id: pe-wsh-hidden-powershell-base64-clues
  desc: PE WSH, hidden run and Base64 PowerShell clues
  conf: 0.99
  attack: T1027,T1059.001,T1059.005
  all:
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: micro-behaviors/data/decode/base64/reference::pe-powershell-frombase64string
  - id: micro-behaviors/metaprogramming/generation/function::pe-scriptblock-create-reference
  - id: micro-behaviors/process/interpreter/wsh::wsh-shell-run-hidden
- id: pe-wsh-hidden-obfuscated-command-clues
  desc: PE WSH, hidden run and obfuscated text clues
  conf: 0.98
  attack: T1027,T1059.005
  all:
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: micro-behaviors/process/interpreter/wsh::wsh-obfuscated-base64-fragments
  - id: micro-behaviors/metaprogramming/generation/function::pe-scriptblock-create-reference
  - id: micro-behaviors/process/interpreter/wsh::wsh-shell-run-hidden
