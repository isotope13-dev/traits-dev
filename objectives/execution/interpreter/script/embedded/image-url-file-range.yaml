# An encoded PowerShell script evaluates a local file range near an image URL.
# The matchers do not bind the URL response to that file range.
defaults:
  platforms:
  - linux
  - macos
  - windows
composite_rules:
- id: rust-downloaded-image-range-script-loader
  desc: Encoded PowerShell evaluates file range near image URL
  crit: suspicious
  conf: 0.99
  attack: T1027,T1059.001,T1105
  for:
  - rust
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/url/path::image-file-url
  - id: micro-behaviors/process/create/direct::rust-command-curl-wget
  - id: micro-behaviors/process/create/direct::rust-command-powershell
  - id: micro-behaviors/data/buffer/carve::encoded-powershell-file-range-to-string
  - id: micro-behaviors/process/interpreter/eval/direct::base64-powershell-eval-command
- id: portable-downloaded-image-range-script-loader
  desc: Encoded PowerShell evaluates file range near image URL
  crit: suspicious
  conf: 0.97
  attack: T1027,T1059.001
  for:
  - python
  - javascript
  - typescript
  - go
  - csharp
  - batch
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/url/path::image-file-url
  - id: micro-behaviors/data/buffer/carve::encoded-powershell-file-range-to-string
  - id: micro-behaviors/process/interpreter/eval/direct::base64-powershell-eval-command
