defaults:
  platforms: [windows]
  attack: "T1204.002"
  for: [lnk]

composite_rules:
- id: lnk-htmlfile-execscript
  desc: LNK htmlfile COM and execScript call
  crit: hostile
  conf: 0.95
  attack: T1059.007
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::lnk-execscript-call
  any:
  - id: micro-behaviors/os/com/instantiation::lnk-htmlfile-activex
  - id: micro-behaviors/os/com/instantiation::lnk-createobject-htmlfile
