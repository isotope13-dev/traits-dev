    type: text
    substr: ErrorActionPreference
- id: powershell-vars-in-javascript--rx-2
  desc: 'Matches ''Set-ExecutionPolicy'''
  crit: notable
  conf: 0.9
  size_max: 200000
  per_kb_min: 0.2
