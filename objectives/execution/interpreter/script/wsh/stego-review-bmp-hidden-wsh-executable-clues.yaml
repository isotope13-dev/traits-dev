defaults:
  platforms: [unix, windows]
  for: [media, scripts]

composite_rules:
- id: bmp-hidden-wsh-executable-clues
  desc: BMP script and hidden WSH executable clues
  crit: hostile
  conf: 0.99
  attack: T1027.003,T1059.007,T1105
  for:
    - bmp
  all:
    - id: micro-behaviors/os/com/instantiation::wscript-shell-activex-constructor
    - id: micro-behaviors/os/com/instantiation::bmp-wsh-fso-object
    - id: metadata/lang/source/syntax/array::bmp-data-array-65535-clues
    - id: objectives/anti-static/obfuscation/steganography/image::bmp-fromcharcode-reference
    - id: metadata/lang/source/syntax/call/member::bmp-run-zero-argument-text
    - id: micro-behaviors/fs/path/executable::bmp-public-download-exe-path
    - id: metadata/file/format/media::media-container-recognized
