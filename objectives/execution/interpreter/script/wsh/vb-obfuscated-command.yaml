defaults:
  platforms:
  - windows
  for:
  - vbs
composite_rules:
- id: vb-junk-filter-hidden-command
  desc: VB junk-character decoding near hidden WSH run
  crit: suspicious
  conf: 0.99
  all:
  - id: objectives/anti-static/obfuscation/string/junking::vbs-junk-alphabet-character-decoder
  - id: micro-behaviors/process/create/hidden::run-zero-style-argument
  - id: objectives/anti-static/obfuscation/name-mangling/variables::vbs-generated-identifiers
  any:
  - id: objectives/anti-static/obfuscation/string/concat::vbs-createobject-concat
  - id: micro-behaviors/os/com/automation::vbs-computed-createobject
  needs: 1
