defaults:
  platforms: [windows]
  for: [javascript]
traits:
  - id: repeated-base64-template-substitutions
    desc: Repeated substitutions in Base64-shaped text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '([A-Za-z0-9+/]{6,}\{[0-9]\}){3}'
composite_rules:
  - id: long-wsh-placeholder-decoder-execution
    desc: Obfuscated WSH execution with large encoded data
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.007
    all:
      - id: repeated-base64-template-substitutions
      - id: metadata/file/line::single-long-line-outlier
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-call-expression-arg
      - id: objectives/execution/interpreter/script/wsh::jscript-obfuscated-wsh-adodb-template-chain
