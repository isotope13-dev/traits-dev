defaults:
  platforms:
  - unix
  - windows
  - macos
  for:
  - javascript
  - vbs
traits:
- id: wscript-createobject
  desc: WScript.CreateObject
  crit: notable
  conf: 0.7
  platforms:
  - windows
  if:
    type: string_literal
    substr: WScript.CreateObject
  attack: T1202
- id: wscript-getobject
  desc: WScript.GetObject
  crit: notable
  conf: 0.7
  platforms:
  - windows
  if:
    type: string_literal
    substr: WScript.GetObject
  attack: T1202
composite_rules:
- id: wscript-execution-comp
  desc: Windows Script Host execution
  crit: notable
  conf: 0.75
  platforms:
  - windows
  attack: T1202
  needs: 2
  any:
  - id: wscript-createobject
  - id: wscript-getobject
  - id: micro-behaviors/time/sleep/interval::wscript-sleep-literal
- id: wscript-process-execution
  desc: WScript process execution
  crit: hostile
  conf: 0.85
  platforms:
  - windows
  attack: T1202
  mbc: E1243
  all:
  - id: objectives/execution/interpreter/script/wsh::wscript-execution-comp
  unless:
  - id: metadata/import/builtin::node-protocol-esm-import
  - id: metadata/import/builtin::child-process-import-runtime
  any:
  - id: micro-behaviors/process/create/exec::child-process-alias-spawn
  - id: micro-behaviors/process/create/exec::child-process-creation-evidence
  - id: micro-behaviors/process/create/exec::child-process-destructured-spawn-call
  - id: micro-behaviors/process/create/exec::child-process-member-spawn
  - id: micro-behaviors/process/create/subprocess/launch::node-child-process-fork-call
  - id: micro-behaviors/process/create/exec::powershell-assigned-token-process-call
  - id: micro-behaviors/os/api-resolution/digest-export/encoded::x86-winexec-hash-exe-name-clues
  - id: micro-behaviors/process/create/hidden::node-detached-hidden-powershell-policy-bypass
  - id: micro-behaviors/process/deploy/interpreter-command::encodedcommand-child-process-js
  - id: micro-behaviors/process/create/subprocess/launch::runtime-exec
  - id: micro-behaviors/process/create/subprocess/launch::runtime-getruntime-exec
  needs: 1
- id: script-based-malware
  desc: Script-based malware framework
  crit: hostile
  conf: 0.9
  platforms:
  - windows
  attack: T1202
  mbc: E1243
  needs: 3
  any:
  - id: objectives/execution/activex/
  - id: wscript-createobject
  - id: micro-behaviors/time/sleep/interval::wscript-sleep-literal
- id: obfuscated-wscript-activex-self-runner
  desc: Obfuscated WScript ActiveX self-runner
  crit: hostile
  conf: 0.95
  platforms:
  - windows
  attack: T1059.007, T1027
  mbc: B0032
  for:
  - javascript
  all:
  - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
  - id: micro-behaviors/os/com/instantiation::activex-constructor-call
  - id: micro-behaviors/data/property/access::wscript-bracket-member-access
  any:
  - id: objectives/execution/interpreter/scripting/host::activex-object-obfuscated
  - id: metadata/file/encoding/base64::js-base64-shard-array
  - id: micro-behaviors/data/collection/array::js-bracket-push-shift-call-text
  needs: 2
- id: obfuscated-hidden-wmi-loader
  desc: Obfuscated WSH hides a WMI process
  crit: hostile
  conf: 0.99
  attack: T1027,T1047,T1059.007,T1564.003
  mbc: B0032
  all:
  - id: micro-behaviors/os/com/instantiation::activex-constructor-call
  - id: micro-behaviors/process/create/wmi::wmi-hidden-process-create
  - id: metadata/lang/encoding/shape/character::non-ascii-script-text
