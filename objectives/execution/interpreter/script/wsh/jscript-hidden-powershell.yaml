# Encrypted-string JScript droppers that hand off to PowerShell: the
# command line ("powershell -NoProfile ... -File ...") survives only as
# escaped fragments next to the obfuscator.io decoder.
defaults:
  platforms: [windows]
  for: [javascript]
  crit: hostile
  attack: T1059.001,T1059.007,T1027.013

composite_rules:
  - id: obfuscated-jscript-powershell-file-launch
    desc: RC4-obfuscated JScript assembles a PowerShell -NoProfile -File launch
    conf: 0.92
    all:
      - id: metadata/build/obfuscator::obfuscator-io-rc4-string-array
      - id: micro-behaviors/process/argument/option::escaped-executable-noprofile-fragment
      - id: micro-behaviors/process/argument/option::escaped-file-argument-fragment
