defaults:
  attack: T1059.001
  platforms: [windows]
  for: [javascript, vbs, batch, powershell, pe, oledoc]
composite_rules:
  - id: detached-powershell-policy-bypass-launch
    desc: Detached hidden child runs PowerShell policy bypass
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1059.007,T1564.003
    for: [javascript]
    # A real launch keeps the PowerShell argv beside the detached spawn. This
    # prevents vendored archive helpers and an unrelated daemon spawn elsewhere
    # in a large JavaScript bundle from combining into a fictitious attack.
    near_bytes: 2048
    all:
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/process/create/flags::execution-policy-bypass
    unless:
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-benign-context
      - id: metadata/build/ci/github-actions::action-bundle-context
