defaults:
  platforms: [windows]
  for: [html, scripts, documents]

composite_rules:
- id: obfuscated-wsh-eval-shellexecute
  desc: WSH eval and ShellExecute with naming clues
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.007,T1105
  for: [javascript]
  all:
    - id: micro-behaviors/os/handler/open::shellexecute-method-reference
    - id: micro-behaviors/os/com/automation::filesystemobject-progid
    - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
    - id: metadata/file/text-distribution::repeated-consonant-vowel-token

