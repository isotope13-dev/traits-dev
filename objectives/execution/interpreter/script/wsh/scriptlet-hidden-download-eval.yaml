defaults:
  for: [javascript, html]
  platforms: [windows]

composite_rules:
  - id: scriptlet-hidden-powershell-download-eval
    desc: Scriptlet with hidden PowerShell download and eval
    crit: hostile
    conf: 0.96
    attack: T1218.005,T1059.001
    near_bytes: 1024
    all:
      - id: micro-behaviors/os/com/automation::windows-com-scriptlet-element
      - id: micro-behaviors/process/create/hidden::wsh-aliased-run-hidden-window-text
      - id: objectives/execution/payload/script-eval/network/response-body::powershell-downloadstring-iex-inline
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
