defaults:
  platforms: [unix, windows, macos]
composite_rules:
- id: wsh-xmlhttp-adodb-run-profile
  desc: WSH XMLHTTP, ADODB and run clues
  crit: suspicious
  conf: 0.95
  all:
  - id: objectives/execution/interpreter/script/wsh::wscript-shell
  - id: micro-behaviors/process/create/shell/script-host::wscript-shell-run
  - id: micro-behaviors/fs/write/stream::adodb-save-to-file
  any:
  - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-open
  - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-send
- id: jscript-xml-obfuscated-run-profile
  desc: JScript XML and obfuscated run clues
  crit: suspicious
  conf: 0.98
  platforms: [windows]
  for: [javascript]
  all:
  - id: micro-behaviors/data/codec::msxml-base64-type-and-value
  - id: micro-behaviors/fs/write/stream::adodb-stream-progid
  - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-obfuscated
  - id: micro-behaviors/process/create/flags::execution-policy-bypass
