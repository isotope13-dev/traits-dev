defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027,T1059.007
  mbc: B0032

composite_rules:
  - id: obfuscated-rc4-activex-wsh-loader
    desc: Obfuscated RC4 JScript loader uses ActiveX and WSH
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007,T1106
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::js-rc4-implementation
      - id: micro-behaviors/os/com/instantiation::activex-constructor-call
      - id: metadata/lang/runtime::wscript-host-reference
      - id: micro-behaviors/data/bitwise/xor/expression::digit-dense-long-line-xor-expression
      - id: micro-behaviors/data/property/access::wscript-bracket-member-access
