defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027,T1059.007
  mbc: B0032

composite_rules:
  - id: obfuscated-rc4-activex-wsh-loader
    desc: Obfuscated RC4 JScript loader uses ActiveX and WSH
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007,T1106
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-implementation
      - id: micro-behaviors/process/interpreter/jscript::activex-object
      - id: micro-behaviors/process/create/script/wsh::wscript-marker
      - id: objectives/anti-static/obfuscation/code-metrics/line-shape::js-packed-numeric-xor-blob
      - id: objectives/anti-static/obfuscation/syntax::js-wscript-bracket-member-access
