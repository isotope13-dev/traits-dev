# WSH relaunch through a hidden ShellExecute call is suspicious when the runas
# verb is itself concealed. Generic PowerShell Start-Process -Verb RunAs code is
# a neutral elevation capability and lives under micro-behaviors.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1548.002
  mbc: F0015

traits:
  - id: charcode-runas-shellexecute-verb
    desc: Runas charcode near ShellExecute
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # The verb is decoded immediately before the WSH ShellExecute call;
      # matching that relationship avoids treating ordinary `runas` prose as
      # elevation behavior.
      regex: 'ShellExecute\s*\([\s\S]{0,180}114,117,110,97,115'

composite_rules:
  - id: hidden-wsh-self-elevation
    desc: WSH relaunches itself hidden with the runas verb
    crit: hostile
    conf: 0.99
    attack: T1059.007,T1548.002,T1564.003
    all:
      - id: charcode-runas-shellexecute-verb
      - id: micro-behaviors/process/create/shell/wsh::shellexecute-hidden-showcmd
      - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
