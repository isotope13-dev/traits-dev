defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
composite_rules:
  - id: jscript-conditional-batch-exec
    desc: JScript conditional compilation and batch exec
    crit: suspicious
    conf: 0.95
    attack: T1059.007
    mbc: B0032
    for:
      - javascript
    all:
      - id: micro-behaviors/process/interpreter/scripting::jscript-cc-on
      - id: micro-behaviors/process/create/subprocess/reference::batch-script-execution
    any:
      - id: objectives/anti-static/obfuscation/string/conceal::js-string-transformation-clues
      - id: objectives/anti-static/obfuscation/string/reverse::js-reverse-string-obfuscation
      - id: micro-behaviors/data/string/split::js-empty-delimiter-split
