defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
composite_rules:
  - id: wsh-or-activex-creation-clues
    desc: WScript or ActiveX creation clues
    crit: component
    conf: 0.8
    for:
      - javascript
    any:
      - id: micro-behaviors/os/com/instantiation::activex-constructor-call
      - id: objectives/execution/interpreter/script/wsh::wscript-createobject
    unless:
      - id: well-known/tool/development/vscode-extension/vscode-marketplace::m365-agents-toolkit-vsix
