defaults:
  platforms: [windows, unix]
  for: [package.json]
traits:
  - id: npm-preinstall-script
    desc: npm preinstall hook present
    crit: notable
    conf: 1.0
    unless:
      - id: metadata/package/files/dependency::node-modules-path
      - id: metadata/package/scripts/
      - type: value
        path: "scripts.preinstall"
        exact: "npx only-allow pnpm"
      - id: well-known/lib/format/xmljs::libxmljs-native-addon-context
    if:
      type: text
      regex: '"preinstall"\s*:\s*"[^"\n]{1,512}"'
composite_rules:
  - id: npm-postinstall-windows-program-poc
    desc: POC package runs a Windows executable from npm postinstall
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/process/interpreter/npm::postinstall-windows-executable
      - id: metadata/package/placeholder::npm-name-poc
