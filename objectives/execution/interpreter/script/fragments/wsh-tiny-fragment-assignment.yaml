defaults:
  crit: suspicious
  platforms: [windows]
traits:
  # `var x = "en";` is also ordinary locale and bundler output (a rollup
  # snapshot assigns such literals), so this component alone is notable; the
  # Nemucod claim needs the Fil/Sav/ADOD/WScr and Resp/SaveT fragments below.
  - id: wsh-tiny-fragment-assignment-network
    crit: notable
    desc: 'Variable assignment of known network fragments'
    for:
      - javascript
    if:
      type: string_literal
      regex: var\s+[a-zA-Z0-9_]+\s*=\s*"(op|en|se|nd)";
      case_insensitive: false
  - id: wsh-tiny-fragment-assignment-1
    desc: Known fragments (Fil/Sav/ADOD/WScr) assignment
    for:
      - javascript
    if:
      type: string_literal
      case_insensitive: false
      regex: var\s+\w+\s*=\s*"(Fil|Sav|ADOD|WScr)";
  - id: wsh-tiny-fragment-assignment-2
    desc: 'Variable assignment of fragments'
    for:
      - javascript
    if:
      type: string_literal
      case_insensitive: false
      regex: var\s+\w+\s*=\s*"(Resp|SaveT)";
composite_rules:
  - id: wsh-tiny-fragment-assignment
    desc: Variable assignment of known WSH fragments (Nemucod)
    any:
      - id: wsh-tiny-fragment-assignment-1
      - id: wsh-tiny-fragment-assignment-2
