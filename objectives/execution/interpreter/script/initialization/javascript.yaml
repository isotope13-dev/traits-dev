defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  # Scope is an additional claim: function-only attack implementations keep
  # their underlying attack finding without this initialization finding.
  - id: node-initialization-reverse-shell-command
    desc: Node initialization invokes a reverse-shell command
    crit: hostile
    conf: 0.99
    attack: T1059.007,T1059.004
    scope: file
    near_bytes: 0
    all:
      - id: objectives/command-and-control/reverse-shell/dev-tcp::node-executes-bash-tcp-shell
      - id: micro-behaviors/process/create/shell/command-string::module-level-imported-node-shell-command
  - id: browser-initialization-cookie-exfiltration
    desc: Top-level browser code sends session cookies
    crit: hostile
    conf: 0.98
    attack: T1059.007,T1539,T1041
    scope: file
    near_bytes: 0
    all:
      - id: objectives/exfiltration/stealer/application-state/cookie::document-cookie-external-fetch-url
      - id: micro-behaviors/communications/http/request/get::program-scope-fetch-appends-property
