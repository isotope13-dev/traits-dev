defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1059.006

composite_rules:
  - id: python-argc-gated-runpy-bootstrap
    desc: Python startup inspects CPython argc via ctypes and launches a sibling script
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/process/info/commandline::py-getargcargv
      - id: micro-behaviors/process/interpreter/python::python-argc-runpy-profile
      - id: micro-behaviors/process/interpreter/python::runpy-run-path
      - id: micro-behaviors/process/info/current::python-sys-executable-text
      - id: micro-behaviors/process/fd/stdio::python-stdio-stream-replacement
