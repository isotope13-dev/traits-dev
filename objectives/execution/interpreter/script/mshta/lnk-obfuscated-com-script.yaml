defaults:
  for: [lnk]
  platforms: [windows]
  attack: T1218.005,T1027

traits:
  - id: lnk-mshta-escaped-com-script
    desc: Shortcut obfuscates remote COM script launch
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule lnk_mshta_escaped_com_script {
          strings:
            $mshta = "mshta" ascii nocase
            $javascript = "javascript:" ascii nocase
            $object = "GetObject(" ascii nocase
            $catch = "catch(" ascii nocase
            $hex = /\\x[0-9a-fA-F]{2}/ ascii
            $octal = /\\[0-7]{3}/ ascii
            $remote = /(\\x73|\\163)(\\x63|\\143)(\\x72|\\162)(\\x69|\\151)(\\x70|\\160)(\\x74|\\164)(\\x3a|\\072|\\72)(\\x68|\\150|\\x48|\\110)(\\x74|\\164|\\x54|\\124)(\\x74|\\164|\\x54|\\124)(\\x70|\\160|\\x50|\\120)/ ascii nocase
          condition:
            uint32(0) == 0x4c and filesize < 128KB and $mshta and $javascript and $object and $catch and $remote and (#hex + #octal >= 20)
        }
