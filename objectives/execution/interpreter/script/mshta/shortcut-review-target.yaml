defaults:
  platforms: [windows]
  attack: T1204.002
  for: [lnk]

composite_rules:
  - id: minimized-remote-mshta-stage
    desc: LNK minimizes a remote mshta stage through pcalua
    crit: hostile
    conf: 0.99
    attack: T1105,T1218.005
    all:
      - id: objectives/execution/lnk/proxy::pcalua-mshta-proxy-execution
      - id: micro-behaviors/communications/url/scheme::lnk-https-scheme-argument
      - id: "micro-behaviors/ui/window/state::lnk-minimized-inactive-window"
