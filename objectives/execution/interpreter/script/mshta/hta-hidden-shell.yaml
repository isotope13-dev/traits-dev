# HTA can hide its own window and use WScript.Shell to start another hidden
# process. Those features can appear in administration tools, so this rule
# requires the complete HTA + ActiveX shell + hidden Run chain.
defaults:
  platforms: [windows]
  for: [html, javascript]
  attack: T1059.007,T1059.001,T1564.003

composite_rules:
  - id: hidden-hta-activex-hidden-shell-run
    desc: Hidden HTA starts a hidden shell process
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: micro-behaviors/ui/window/control::hta-windowstate-minimized-or-hidden
      - id: micro-behaviors/ui/window/control::hta-taskbar-hidden
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-hidden-text
    unless:
      - id: objectives/execution/interpreter/script/mshta::steam-workshop-hidden-mshta-stager

  - id: hta-hidden-padded-wsh-runner
    desc: Hidden HTA launches concealed shell command
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.005,T1218.005,T1564.003
    for: [html]
    all:
      - id: micro-behaviors/ui/window/control::hta-hidden-or-minimized-window-request
      - id: micro-behaviors/process/create/exec::wsh-reference-near-variable-call
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-hidden-text
    any:
      - id: objectives/anti-static/obfuscation/string/delimiter::vbs-padded-wscript-shell-progid-chunks

  - id: hidden-hta-powershell-bypass-batch-dropper
    desc: Hidden HTA writes a batch and runs concealed PowerShell
    crit: hostile
    conf: 0.98
    attack: T1059.005,T1059.001,T1218.005
    for: [html]
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: micro-behaviors/ui/window/control::hta-hidden-or-minimized-window-request
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-argument
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-hidden-text
    any:
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-command-text
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-command

  - id: hta-silent-scriptlet-execution
    desc: HTA executes remote scriptlet moniker and suppresses errors
    crit: hostile
    conf: 0.98
    attack: T1059.007,T1218.005
    for: [html]
    all:
      - id: metadata/file/extension/identity::hta-html-application-extension
      - id: micro-behaviors/os/com/automation::getobject-concat-url-clue
      - id: micro-behaviors/data/control-flow/error-handling::empty-named-catch-text

  # Statement-form twin of hidden-hta-activex-hidden-shell-run above: the same
  # hidden HTA + ActiveX shell chain, but the Run window style arrives in a
  # variable (`WshShell.Run cmd, flagVar`) instead of a literal `,0` tail, so
  # the hidden-text atoms miss it. The variable style still hides the window
  # at runtime.
  - id: hidden-hta-activex-variable-shell-run
    desc: Hidden HTA runs shell with computed style
    crit: hostile
    conf: 0.96
    for: [html]
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: micro-behaviors/ui/window/control::hta-taskbar-hidden
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-variable-window-style
    unless:
      - id: objectives/execution/interpreter/script/mshta::steam-workshop-hidden-mshta-stager

  # Chromeless HTA (no caption, menu, or border) that rebuilds its command
  # from a numeric character-code table and runs it with a computed window
  # style: nothing user-visible on screen, no command text on disk. Either
  # concealment layer alone is only notable; the three together are the
  # dropper shape.
  - id: hta-chromeless-charcode-shell-run
    desc: Chromeless HTA runs decoded command hidden
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.005,T1218.005,T1564.003
    for: [html]
    all:
      - id: micro-behaviors/ui/window/control::hta-chromeless-window
      - id: micro-behaviors/data/collection/array::vbs-numeric-charcode-array
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-variable-window-style


