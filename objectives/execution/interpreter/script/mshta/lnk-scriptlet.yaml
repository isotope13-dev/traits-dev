defaults:
  platforms: [windows]
  for: [lnk]
composite_rules:
  - id: lnk-inline-mshta-remote-scriptlet-execution
    desc: Shortcut MSHTA JavaScript executes remote scriptlet
    crit: hostile
    conf: 0.99
    attack: T1218.005,T1059.007
    all:
      - id: micro-behaviors/process/config/target::lnk-cmd-with-args
      - id: objectives/execution/interpreter/script/mshta::lnk-mshta-javascript-command
      - id: micro-behaviors/os/com/invoke::lnk-remote-scriptlet-exec-call
