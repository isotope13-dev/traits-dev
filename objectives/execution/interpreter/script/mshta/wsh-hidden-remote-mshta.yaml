# WScript.Shell.Run starts mshta on an http(s) URL with window style 0: the
# remote document runs as a fully trusted HTA with no visible window.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1218.005,T1564.003

composite_rules:
  - id: wsh-hidden-run-mshta-remote-url
    desc: Script hidden-runs MSHTA on a remote URL
    crit: hostile
    conf: 0.96
    near_bytes: 400
    all:
      - id: metadata/lang/source/syntax/command/launch::mshta-remote-url-command
      - id: micro-behaviors/data/control-flow/dispatch/run::wsh-run-url-argument
      - id: micro-behaviors/data/control-flow/dispatch/run::vbs-run-style-zero
