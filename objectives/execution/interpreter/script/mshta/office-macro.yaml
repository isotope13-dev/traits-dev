# The required sink is mshta script interpretation, not a fetched stage.
defaults:
  platforms: [windows]
  for: [vbs]

composite_rules:
  - id: office-macro-mshta-variable-moniker
    desc: Macro launches mshta with a built moniker
    crit: hostile
    conf: 0.95
    attack: T1218.005,T1059.005
    mbc: C0002
    all:
      - id: micro-behaviors/process/create/launch::mshta-command-text
      - id: micro-behaviors/process/create/launch::mshta-execution
      - id: micro-behaviors/process/script/wsh::wsh-getobject-variable-argument
