defaults:
  platforms: [windows]
  for: [html]
  attack: T1059.001,T1105,T1218.005

composite_rules:
  - id: minimized-hta-powershell-fetch-eval
    desc: Minimized HTA runs remote PowerShell
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: metadata/file/profile/com/progid::wscript-shell-literal
      - id: micro-behaviors/data/control-flow/dispatch/named::script-run-method-text
      - id: metadata/file/profile/script/network::powershell-webrequest-iex-document-text
      - id: micro-behaviors/ui/window/control::hta-taskbar-hidden
      - id: micro-behaviors/ui/window/event::html-body-onload-handler
