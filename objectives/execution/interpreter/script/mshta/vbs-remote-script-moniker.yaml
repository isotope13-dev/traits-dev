defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1059.005,T1105

traits:
  - id: vbs-concatenated-remote-script-moniker
    desc: VBS assembles remote script moniker
    crit: hostile
    conf: 0.97
    if:
      type: yara
      source: |
        rule vbs_concatenated_remote_script_moniker {
          strings:
            $script = /["']script:["']/ nocase
            $scheme = /["']https?:["']/ nocase
            $address = /["']\/\/[A-Za-z0-9.-]+\/[^"']*["']/ nocase
            $call = /GetObject\s*\([^\r\n]{1,120}\+[^\r\n]{1,120}\)/ nocase
          condition:
            all of them
        }
