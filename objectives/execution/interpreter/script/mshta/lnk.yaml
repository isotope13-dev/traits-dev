defaults:
  platforms: [windows]
  for: [lnk]

composite_rules:
  - id: lnk-minimized-split-mshta-remote-stage
    desc: Minimized cmd shortcut starts split-token remote mshta
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.003,T1218.005,T1204.002,T1564.003
    all:
      - id: micro-behaviors/process/create/shortcut::lnk-cmd-target
      - id: micro-behaviors/process/create/shortcut::lnk-minimized-window
      - id: micro-behaviors/communications/http/url/scheme::lnk-https-argument
      - id: objectives/anti-static/obfuscation/string/fragmentation::lnk-mshta-split-token-assignments
