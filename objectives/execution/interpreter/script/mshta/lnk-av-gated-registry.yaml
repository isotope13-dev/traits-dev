defaults:
  for: [lnk]
  platforms: [windows]
  attack: T1218.005,T1497.001,T1070.004

traits:
  - id: lnk-antivirus-defender-only-gate
    desc: Shortcut exits when non-Defender AV is found
    crit: notable
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)AntiVirusProduct.{0,180}Windows Defender.{0,80}\bExit\b'
  - id: lnk-wildcard-mshta-registry-child
    desc: Shortcut resolves mshta via registry wildcard
    crit: notable
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)Applications\\msh\*e.{0,60}PSChildName'
  - id: lnk-location-based-shortcut-delete
    desc: Shortcut deletes itself using current location
    crit: notable
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)Get-Location.{0,100}Join-Path.{0,140}\.lnk.{0,30}\bdel\s+\$'

composite_rules:
  - id: lnk-av-gated-registry-mshta-self-delete
    desc: AV-gated shortcut runs remote mshta and self-deletes
    crit: hostile
    conf: 0.99
    all:
      - id: lnk-antivirus-defender-only-gate
      - id: lnk-wildcard-mshta-registry-child
      - id: lnk-location-based-shortcut-delete
      - id: micro-behaviors/process/config/target::lnk-powershell-target
      - id: micro-behaviors/communications/url/scheme::lnk-https-scheme-argument
      - id: micro-behaviors/fs/path/media::lnk-args-media-extension
