# npm/Node loaders that download an HTA document and hand it to mshta.exe
# (Acevatex nextjsupdater / originaldevelopmentstelemetry downloadAndRunUpdate).
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  crit: hostile
  conf: 0.95
  attack: T1218.005,T1105

composite_rules:
  - id: node-remote-hta-mshta-launch
    desc: Node code fetches remote HTA and runs mshta
    all:
      - id: micro-behaviors/process/create/exec::js-child-process-mshta
    any:
      - id: micro-behaviors/communications/url/resource-path/file::hta-document-url-literal
      - id: metadata/lang/source/syntax/command/launch::mshta-remote-url-command
    needs: 1
