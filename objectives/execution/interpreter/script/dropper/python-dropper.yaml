defaults:
  platforms: [unix, windows]
  for: [python, whl, python-sdist]
  attack: T1105,T1059.004
  mbc: B0024
  crit: hostile
  conf: 0.98

composite_rules:
  - id: python-temp-shell-script-dropper
    desc: Downloads and executes a shell script dropper
    scope: file
    all:
      - id: micro-behaviors/communications/http/download/helper::urlretrieve-call-near-process-launch
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
      - id: micro-behaviors/fs/path/temp::tmp-path-content
