# A JavaScript program that accepts an arbitrary command string, invokes it
# through hidden PowerShell, and discards child output is a command dropper.
# This objective is intentionally independent of npm provenance so the same
# behavior is caught in vendored scripts and bundled Node applications.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1059.007,T1564.003"
  mbc: E1059

composite_rules:
  - id: hidden-argv-powershell-command-dropper
    desc: Hidden PowerShell argv command dropper
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/process/create/shell/bridge::js-argv-command-string
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
      - id: micro-behaviors/process/daemonize/spawn::powershell-hidden
      - id: micro-behaviors/process/create/spawn::stdio-ignore
      - id: metadata/import/builtin::require-child-process
