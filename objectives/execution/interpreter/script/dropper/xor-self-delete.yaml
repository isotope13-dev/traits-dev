# Custom XOR decoders plus staged-file deletion are a high-confidence script
# dropper shape. Each primitive remains neutral/notable in its canonical
# directory; these composites express the execution/evasion objective.
defaults:
  crit: hostile
  platforms: [windows]
  for: [javascript]
  attack: T1027,T1059.007,T1070.004
  mbc: B0006

composite_rules:
  - id: javascript-xor-stage-self-cleanup
    desc: Obfuscated XOR JavaScript deletes its staged files
    conf: 0.99
    all:
      - id: objectives/anti-static/obfuscation/eval/loader::javascript-fragmented-xor-obfuscation
      - id: micro-behaviors/fs/delete/file/library::wsh-deletefile-call

  - id: javascript-xor-url-stage-self-cleanup
    desc: URL-bearing XOR JavaScript removes its staged payloads
    conf: 0.995
    all:
      - id: javascript-xor-stage-self-cleanup
    any:
      - id: micro-behaviors/communications/url/encoded::encoded-http-url
      - id: micro-behaviors/communications/url/encoded::encoded-https-url

  - id: javascript-xor-decoder-loop-self-cleanup
    desc: XOR decoder loop removes files after staged execution
    conf: 0.995
    all:
      - id: javascript-xor-stage-self-cleanup
      - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
