defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
  # Both alternatives establish concealed file staging and hidden dispatch.
  # This groups one evidence role for cleanup consumers.
  - id: wsh-concealed-file-staging
    desc: WSH conceals PS1 staging and hidden execution
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/write/content::javascript-concat-ps1-extension
    any:
      - id: obfuscated-wsh-encoded-file-stager
      - id: objectives/execution/payload/file-exec/command/script-host-interpreter::wsh-xor-base64-hidden-ps1-exec
