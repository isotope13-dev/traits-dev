# WSL can invoke Windows executables directly. Pairing an explicit WSL probe
# with hidden, policy-bypassed PowerShell process creation suggests a possible
# boundary crossing; proximity alone does not prove that the operations connect.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, go]
  attack: T1059.001,T1564.003

composite_rules:
  - id: wsl-hidden-powershell-boundary-crossing
    for: [javascript, go]
    desc: WSL gate launches hidden bypassed PowerShell
    crit: suspicious
    conf: 0.99
    # The WSL probe, the hidden flag, and the bypassed launch must belong to
    # one gate. Without proximity, a large bundle pools WSL-tagged telemetry,
    # a hidden-window supervisor, and installer PATH-management PowerShell
    # spread across hundreds of kilobytes into a crossing verdict.
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/sysinfo/platform/runtime/environment::wsl-runtime-detection
      - id: micro-behaviors/process/argument/visibility::argv-array-windowstyle-hidden
      - id: micro-behaviors/os/security/execution-policy::powershell-policy-bypass-argv-pair
    any:
      - id: micro-behaviors/process/create/shell/command-string::child-process-exec
      - id: micro-behaviors/process/create/subprocess/launch::process-execution
      - id: metadata/lang/source/syntax/call/construction::go-powershell-command
