# WSL can invoke Windows executables directly. Pairing an explicit WSL probe
# with hidden, policy-bypassed PowerShell process creation identifies code that
# crosses that interoperability boundary for concealed execution.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, go]
  attack: T1059.001,T1564.003

composite_rules:
  - id: wsl-hidden-powershell-boundary-crossing
    for: [javascript, go]
    desc: WSL gate launches hidden bypassed PowerShell
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/discovery/system/fingerprint/os::wsl-runtime-detection
      - id: micro-behaviors/process/create/hidden::argv-array-windowstyle-hidden
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-argv-pair
    any:
      - id: micro-behaviors/process/create/shell/bridge::child-process-exec
      - id: micro-behaviors/process/create/subprocess::process-execution
      - id: micro-behaviors/process/create/direct::go-powershell-command
    unless:
      # GitHub Copilot CLI legitimately combines all three legs in separate
      # features: WSL-aware browser discovery (/etc/wsl.conf probe plus
      # /mnt/... Chrome paths), a detached background-command runner
      # (-WindowStyle Hidden with output redirected to a log file), and
      # policy-bypassed helper launches (default-browser ProgId query,
      # browser Start, extension-zip extraction). Nothing crosses the
      # boundary with a payload; the bundle identity carries the context.
      - id: well-known/app/ai/coding-agent/github-copilot-runtime::github-copilot-app-bundle
