defaults:
  platforms: [unix, windows, macos]
# WSH-based Dropper Patterns
# Detects Windows Script Host droppers with PowerShell execution
composite_rules:
  - id: wsh-powershell-dropper
    desc: "WSH dropper executing PowerShell with bypass"
    crit: hostile
    conf: 0.95
    attack: "T1059.007"
    for: [javascript]
    platforms: [windows]
    all:
      - id: micro-behaviors/os/com/object::wscript-shell-literal
      - id: micro-behaviors/os/com/object::filesystemobject-progid
      - id: objectives/execution/interpreter/script/wsh::execution-policy-bypass
    unless:
      - id: well-known/app/development/vscode-extension/vscode-vibrancy-continued::runtime-marker
  # Same family when WScript.Shell is string-encrypted but ActiveXObject,
  # FSO, Temp staging, and the nop/ep bypass -File argv remain visible.
  - id: obfuscated-activex-temp-ps-file-stager
    desc: Obfuscated ActiveX Temp PowerShell file stager
    crit: hostile
    conf: 0.98
    attack: "T1027,T1059.001,T1059.007,T1105,T1562.001"
    for: [javascript]
    platforms: [windows]
    all:
      - id: micro-behaviors/process/interpreter/jscript::activex-object
      - id: micro-behaviors/os/com/object::filesystemobject-progid
      - id: micro-behaviors/process/create/flags::powershell-nop-ep-bypass-file-command
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
      - id: objectives/execution/interpreter/script/wsh::execution-policy-bypass
    any:
      - id: micro-behaviors/fs/path/temp::js-escaped-c-temp-path
      - id: micro-behaviors/fs/path/temp::js-tempfolder-staging-key
      - id: micro-behaviors/fs/directory/mkdir::wsh-createfolder-bracket
      - id: micro-behaviors/fs/directory/mkdir::wsh-createfolder-method-name
    needs: 1
  - id: obfuscated-wsh-remote-powershell-stager
    desc: Obfuscated WSH fetches and launches a remote PowerShell payload
    crit: hostile
    conf: 0.99
    attack: "T1027,T1059.007,T1105"
    for: [javascript]
    platforms: [windows]
    all:
      - id: micro-behaviors/os/com/object::wscript-shell-literal
      - id: micro-behaviors/os/com/object::filesystemobject-progid
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-obfuscated
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-b
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
    any:
      - id: micro-behaviors/fs/directory/mkdir::wsh-createfolder
      - id: micro-behaviors/process/interpreter/jscript::activex-object
  - id: obfuscated-wsh-powershell-dropper
    desc: "Obfuscated WSH PowerShell dropper"
    crit: hostile
    conf: 0.97
    attack: "T1059.007,T1027"
    for: [javascript]
    platforms: [windows]
    all:
      - id: wsh-powershell-dropper
    any:
      - id: objectives/anti-static/obfuscation/string/array::self-defending-regex
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
      - id: objectives/anti-static/obfuscation/code-metrics/structure::large-digit-heavy-obfuscator-bundle
  - id: embedded-powershell-script
    desc: "Embedded PowerShell-like code in non-PowerShell file"
    crit: suspicious
    conf: 0.82
    for: [javascript, typescript]
    all:
      - id: objectives/execution/interpreter/script/embedded::powershell-vars-in-javascript
      - id: objectives/execution/interpreter/script/embedded::powershell-cmdlet-patterns
  - id: obfuscated-wsh-dropper
    desc: "Obfuscated WSH dropper with char expansion"
    crit: hostile
    conf: 0.95
    for: [javascript]
    platforms: [windows]
    all:
      - id: objectives/anti-static/obfuscation/string/reconstruct::char-expansion-obfuscation
      - id: objectives/anti-static/obfuscation/string/base64::base64-script-function-definition
    any:
      - id: micro-behaviors/os/com/object::wscript-shell-literal
      - id: objectives/execution/interpreter/script/embedded::powershell-cmdlet-patterns
  - id: public-folder-dropper
    desc: "File dropper using Public folder with random names"
    crit: hostile
    conf: 0.9
    attack: "T1564.001"
    for: [javascript, powershell]
    platforms: [windows]
    all:
      - id: objectives/command-and-control/dropper/staging/public-folder::public-folder-short-random
    any:
      - id: micro-behaviors/os/com/object::filesystemobject-progid
      - id: objectives/execution/interpreter/script/embedded::powershell-cmdlet-patterns
  - id: wsh-public-self-copy-relaunch
    desc: "WSH self-copy to Public folder and relaunch"
    crit: hostile
    conf: 0.94
    attack: "T1059.007"
    for: [javascript]
    platforms: [windows]
    all:
      - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
      - id: micro-behaviors/os/com/object::filesystemobject-progid
      - id: micro-behaviors/os/com/object::shell-application-progid
      - id: micro-behaviors/process/create/shell/wsh::shellexecute-method-call
      - id: objectives/command-and-control/dropper/staging/public-folder::public-folder-short-random
    any:
      - id: micro-behaviors/process/create/shell/script-host::wscript-host-exec
      - id: micro-behaviors/process/create/shell/script-host::wscript-exe
  - id: wsh-public-script-self-copy-relaunch
    desc: WSH copies a script to Public and relaunches it hidden
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007,T1564.001
    for: [javascript]
    platforms: [windows]
    all:
      - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
      - id: micro-behaviors/os/com/object::filesystemobject-progid
      - id: micro-behaviors/fs/file/copy::fso-copyfile
      - id: micro-behaviors/os/com/object::shell-application-progid
      - id: micro-behaviors/process/create/shell/wsh::shell-application-shellexecute-hidden
      - id: objectives/command-and-control/dropper/staging/public-folder::public-folder-script-fragment
      - id: micro-behaviors/process/create/shell/script-host::wscript-host-exec
  - id: obfuscated-wsh-powershell-policy-loader
    desc: Obfuscated WSH stages policy-bypassed PowerShell
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1059.007,T1562.001
    for: [javascript]
    platforms: [windows]
    all:
      - id: micro-behaviors/os/com/object::wscript-shell-literal
      - id: micro-behaviors/os/com/object::shell-application-progid
      - id: micro-behaviors/process/create/shell/wsh::shell-application-shellexecute-hidden
      - id: objectives/anti-static/obfuscation/string/concat::powershell-concatenated-name
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-argument
      - id: objectives/anti-static/obfuscation/string/base64::base64-script-function-definition
      - id: objectives/anti-static/obfuscation/string/reconstruct::char-expansion-obfuscation
  - id: base64-payload-dropper
    desc: "Base64-encoded payload with WSH execution"
    crit: hostile
    conf: 0.9
    for: [javascript, typescript]
    all:
      - id: objectives/anti-static/obfuscation/string/base64::base64-script-function-definition
      - id: objectives/anti-static/obfuscation/string/reconstruct::char-expansion-obfuscation
    any:
      - id: micro-behaviors/os/com/object::wscript-shell-literal
      - id: objectives/execution/interpreter/script/embedded::powershell-vars-in-javascript
  - id: wsh-js-downloader
    desc: "JScript/WSH Downloader with file write"
    crit: hostile
    conf: 0.95
    for: [javascript]
    platforms: [windows]
    all:
      - id: micro-behaviors/fs/write/stream::adodb-binary-write
    any:
      - id: micro-behaviors/process/interpreter/jscript::activex-object
      - id: objectives/execution/interpreter/script/wsh::wscript-createobject
    unless:
      - id: metadata/build/scaffold::windows-wget-js-bootstrap-helper
  - id: wsh-fso-dropper
    desc: WSH writes a payload with FileSystemObject and executes it
    crit: hostile
    conf: 0.95
    attack: "T1059.007"
    for: [javascript]
    platforms: [windows]
    all:
      - id: micro-behaviors/fs/write/content::create-text-file-api
      - id: micro-behaviors/fs/write/content::write-text-file-method
      - id: micro-behaviors/os/com/object::wscript-shell-literal
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run
    any:
      - id: micro-behaviors/fs/write/content::create-script-file
      - id: micro-behaviors/fs/write/content::create-javascript-file
      - id: micro-behaviors/data/encode/payload::large-encoded-blob-literal
      - id: micro-behaviors/data/source/string::massive-string-concatenation
      - id: micro-behaviors/data/source/string::emoji-saturated-string-literals
    unless:
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/lang/encoded/unicode-escape::app-asar-path
      - id: well-known/app/productivity/winmerge/
      - id: well-known/app/productivity/winmerge::winmerge-known-plugin-script-name
  - id: obfuscated-wsh-encoded-file-stager
    desc: Obfuscated WSH writes an encoded payload and hides execution
    crit: hostile
    conf: 0.98
    attack: "T1027,T1059.007,T1105"
    for: [javascript]
    platforms: [windows]
    all:
      - id: micro-behaviors/os/com/object::wscript-shell-literal
      - id: micro-behaviors/os/com/object::filesystemobject-progid
      - id: micro-behaviors/fs/write/content::create-text-file-api
      - id: micro-behaviors/process/create/flags::show-window-hidden-assignment
    any:
      - id: micro-behaviors/data/encode/payload::large-encoded-blob-literal
      - id: micro-behaviors/data/source/string::massive-string-concatenation
  - id: wsh-obfuscated-reflective-dotnet-loader
    desc: WSH stages an obfuscated .NET assembly for hidden execution
    crit: hostile
    conf: 0.99
    attack: "T1027,T1059.007,T1620"
    for: [javascript]
    platforms: [windows]
    all:
      - id: micro-behaviors/os/com/object::wscript-shell-literal
      - id: objectives/execution/activex/com::activex-indirect-environment-staging
      - id: micro-behaviors/process/interpreter/reflection/runtime::obfuscated-powershell-assembly-load
      - id: micro-behaviors/process/create/flags::show-window-hidden-assignment
      - id: micro-behaviors/data/encode/payload::large-encoded-blob-literal
  - id: obfuscated-wsh-http-script-dropper
    desc: Obfuscated WSH HTTP script dropper
    crit: hostile
    conf: 0.98
    attack: "T1105,T1059.007"
    for: [javascript]
    platforms: [windows]
    all:
      - id: wsh-powershell-dropper
      - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-progid
      - id: micro-behaviors/fs/write/content::create-text-file-literal
  - id: shell-application-powershell-dropper
    desc: "Shell.Application PowerShell download-execute dropper"
    crit: hostile
    conf: 0.97
    attack: "T1059.007"
    for: [javascript]
    platforms: [windows]
    all:
      - id: micro-behaviors/os/com/object::shell-application-progid
      - id: micro-behaviors/process/create/shell/wsh::shellexecute-method-call
      - id: objectives/execution/interpreter/script/wsh::execution-policy-bypass
      - id: micro-behaviors/communications/http/download/webclient::webclient-download-call
    any:
      - id: micro-behaviors/process/create/start-process::start-process-call
      - id: micro-behaviors/fs/path/location::path-suspicious-appdata-exe
      - id: micro-behaviors/process/daemonize/spawn::powershell-hidden
  - id: tokenized-wsh-powershell-download-execute
    desc: "Tokenized WSH PowerShell download execute dropper"
    crit: hostile
    conf: 0.97
    attack: "T1059.007"
    for: [javascript]
    platforms: [windows]
    all:
      - id: micro-behaviors/os/com/object::wscript-shell-literal
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-obfuscated
      - id: objectives/anti-static/obfuscation/string/recovery::js-token-substitution-deobfuscation
    any:
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-tokenized
      - id: objectives/execution/interpreter/script/wsh::execution-policy-bypass-tokenized
      - id: micro-behaviors/process/daemonize/spawn::powershell-hidden-tokenized
      - id: micro-behaviors/process/create/start-process::start-process-tokenized
  - id: wsh-powershell-webclient-appdata-execute
    desc: "WSH PowerShell WebClient APPDATA execute"
    crit: hostile
    conf: 0.97
    attack: "T1059.007"
    for: [javascript]
    platforms: [windows]
    all:
      - id: micro-behaviors/communications/http/download/webclient::webclient-download-call
      - id: micro-behaviors/process/daemonize/spawn::powershell-hidden
      - id: micro-behaviors/fs/path/location::path-suspicious-appdata-exe
      - id: micro-behaviors/process/create/start-process::start-process-caret
    any:
      - id: micro-behaviors/os/com/object::wscript-shell-literal
      - id: micro-behaviors/os/com/object::wscript-shell-literal
  - id: pe-embedded-wsh-file-dropper
    desc: Native PE carries obfuscated WSH download and file launch
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.005,T1106
    for: [pe]
    platforms: [windows]
    all:
      - id: objectives/anti-static/obfuscation/payload/fragmentation::pe-script-obfuscated-helper-functions
      - id: micro-behaviors/process/create/shell/script-host::wscript-host-exec
      - id: micro-behaviors/communications/http/download/wsh::pe-embedded-downloadfile-helper
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/fs/file/write/direct::write-file
