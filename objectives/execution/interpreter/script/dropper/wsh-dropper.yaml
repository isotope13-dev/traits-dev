# The WMI Create has a Run fallback: when the hidden WMI launch throws,
# the same environment-staged command runs via WScript.Shell.Run with a
# hidden window. Hidden Run plus staged payload plus marker-stripping
# obfuscation is the loader's second execution path, not benign fallback
# handling: ordinary scripts do not stage obfuscated payloads to run hidden.
- id: wsh-environment-staged-hidden-run-loader
