defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  crit: hostile
  conf: 0.9
  for:
  - javascript
composite_rules:
- id: obfuscated-jscript-dynamic-execution
  desc: Computed call with WSH context
  crit: suspicious
  all:
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::computed-expression-this-method-call
  - id: micro-behaviors/os/com/runtime::wscript-host-object
  any:
  - id: metadata/lang/source/function::high-function-density
  - id: metadata/lang/source/function::many-one-liner-functions
  - id: metadata/lang/source/comment::no-comments-code
- id: obfuscated-jscript-temp-dropper-staging
  desc: Obfuscated JScript temp-path staging chain
  crit: suspicious
  conf: 0.94
  attack: T1059.007, T1105
  all:
  - id: metadata/lang/source/literal/fragment/single::fromc-string-fragment
  - id: metadata/lang/source/literal/fragment/syntax::un-fn-text-fragment
- id: obfuscated-jscript-temp-exe-dropper
  desc: Obfuscated JScript WSH temp EXE dropper
  crit: hostile
  conf: 0.97
  attack: T1059.007, T1105, T1027
  mbc: B0017, B0018, B0032
  all:
  - id: obfuscated-jscript-temp-dropper-staging
  - id: metadata/lang/source/syntax/assignment/value::js-function-nonnumeric-add-assign
  - id: objectives/execution/interpreter/eval/dynamic::js-indirect-eval-this
