defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  crit: hostile
  conf: 0.9
  for:
  - javascript
composite_rules:
- id: obfuscated-jscript-dynamic-execution
  desc: Obfuscated Windows Script Host JScript computed execution via this[...]
  crit: suspicious
  all:
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::computed-expression-this-method-call
  - id: metadata/file/profile/com-interface::wscript-host-object
  any:
  - id: metadata/file/profile/function-population::high-function-density
  - id: metadata/file/profile/function-population::many-one-liner-functions
  - id: metadata/file/comment::no-comments-code
  unless:
  - id: well-known/lib/ui/ckeditor/distribution/
  - id: well-known/tool/development/vscode-extension/dbcode::extension-context
- id: obfuscated-jscript-temp-dropper-staging
  desc: Obfuscated JScript temp-path staging chain
  crit: suspicious
  conf: 0.94
  attack: T1059.007, T1105
  all:
  - id: objectives/command-and-control/dropper/fragmented::from-charcode-fragment
  - id: objectives/command-and-control/dropper/fragmented::run-call-fragment
- id: obfuscated-jscript-temp-exe-dropper
  desc: Obfuscated JScript WSH temp EXE dropper
  crit: hostile
  conf: 0.97
  attack: T1059.007, T1105, T1027
  mbc: B0017, B0018, B0032
  all:
  - id: obfuscated-jscript-temp-dropper-staging
  - id: objectives/anti-static/obfuscation/string/concat::js-dense-string-building
  - id: objectives/execution/interpreter/eval/dynamic::js-indirect-eval-this
