defaults:
  crit: notable
  conf: 0.92
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: action-events-execute-script-call
    desc: Calls ActionEvents executeScript method
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: ActionEvents.executeScript

  - id: execute-script-method-call
    desc: Calls execute.script method
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: execute.script

composite_rules:
  - id: action-events-exec
    desc: Calls a script execution action API
    any:
      - id: action-events-execute-script-call
      - id: execute-script-method-call
