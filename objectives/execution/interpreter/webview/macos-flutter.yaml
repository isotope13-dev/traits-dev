defaults:
  platforms: [macos]
  for: [macho, dylib, javascript, html]
  attack: T1059
  mbc: B0024

composite_rules:
  - id: flutter-webview-bridge-process-exec
    for: [macho]
    desc: Flutter WebView bridge process execution
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/ipc/bridge::flutter-webview-native-invoke-bridge
      - id: micro-behaviors/process/thread/runtime::dart-isolate-remote-runner
    any:
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
      - id: metadata/binary/symbols/name/process::process-start
      - id: metadata/binary/symbols/name/process::run-executable-with-arguments
      - id: metadata/binary/symbols/name/process::invoke-execute-symbol
  - id: flutter-webview-js-channel-process-runner
    for: [macho]
    desc: Flutter WebView JavaScript channel process runner
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/communications/ipc/bridge::flutter-webview-js-channel-bridge
      - id: metadata/binary/symbols/name/process::process-start
    any:
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
      - id: metadata/binary/symbols/name/process::process-start
      - id: metadata/binary/symbols/name/process::run-executable-with-arguments
      - id: metadata/binary/symbols/name/process::invoke-execute-symbol
  - id: flutter-webview-polled-process-dispatch
    for: [macho]
    desc: Flutter WebView bridge with process and polling references
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/ipc/bridge::flutter-webview-js-channel-bridge
      - id: metadata/binary/symbols/name/process::process-start
      - id: micro-behaviors/communications/url/resource-path/collection::polling-interval-path
    any:
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
      - id: metadata/binary/symbols/name/process::process-start
      - id: metadata/binary/symbols/name/process::run-executable-with-arguments
      - id: metadata/binary/symbols/name/process::invoke-execute-symbol