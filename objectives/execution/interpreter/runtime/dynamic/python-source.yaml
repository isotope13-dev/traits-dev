defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059.006

traits:
  - id: python-read-compile-exec-chain
    desc: Python reads, compiles, and executes source
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: 'compile\(\w+\.read\(\).{0,80}["'']exec["'']\)[\s\S]{0,400}\bexec\('
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: well-known/tool/detection/
      - id: well-known/lib/runtime/scripted/cpython::cpython-repl-startup-path
      # pipenv loads the target environment's own Python from a local file.
      - type: path
        regex: pipenv/environment\.py
  - id: exec-sandbox-name-assignment
    desc: Python synthetic exec sandbox name
    crit: notable
    conf: 0.9
    ref: sha256:a6dfb93ccf1c019100eb55c65b0d5ccc26f835cf876f96fe8366a3376449052a
    if:
      type: text
      regex: '__name__["'']?\]\s*=\s*["'']__exec_sandbox__["'']'

  - id: globals-copy-before-exec
    desc: Python globals copy before exec
    crit: notable
    conf: 0.88
    ref: sha256:a6dfb93ccf1c019100eb55c65b0d5ccc26f835cf876f96fe8366a3376449052a
    if:
      type: text
      regex: 'globals\(\)\.copy\(\)[\s\S]{0,180}exec\s*\('

composite_rules:
  - id: python-source-read-compile-exec
    desc: Python reads compiles executes source
    crit: suspicious
    conf: 0.94
    ref: sha256:a6dfb93ccf1c019100eb55c65b0d5ccc26f835cf876f96fe8366a3376449052a
    all:
      - id: micro-behaviors/fs/read/file/handle::file-open-content
      - id: micro-behaviors/process/interpreter/python::exec-builtin
      - id: micro-behaviors/process/interpreter/python::compile-source-exec-mode
    any:
      - id: exec-sandbox-name-assignment
      - id: globals-copy-before-exec
