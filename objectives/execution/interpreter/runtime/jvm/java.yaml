# Java Execution and Security Traits
# Detects dangerous Java patterns in source code
# MBC: Execution, Defense Evasion
# ATT&CK: T1059 (Command and Scripting Interpreter)
defaults:
  platforms: [windows, unix]
  for: [java]
traits:
  # ============================================================
  # COMMAND EXECUTION
  # ============================================================
  - id: runtime-exec
    desc: Runtime.exec() command execution
    crit: notable
    conf: 0.95
    mbc: "C0033"
    attack: "T1059"
    if:
      type: symbol
      kind: call
      exact: "Runtime.exec"
    unless:
      - id: well-known/lib/runtime/managed/openjdk::jdk-distribution-artifact
  - id: runtime-getruntime-exec
    desc: Runtime.getRuntime().exec() command execution
    crit: notable
    conf: 0.95
    mbc: "C0033"
    attack: "T1059"
    if:
      type: symbol
      kind: call
      exact: "getRuntime.exec"
    unless:
      - id: well-known/lib/runtime/managed/openjdk::jdk-distribution-artifact
  # ============================================================
  # REFLECTION (ANTI-ANALYSIS / EVASION)
  # ============================================================
  - id: class-forname
    desc: Dynamic class loading via reflection
    crit: notable
    conf: 0.9
    mbc: "F0006"
    if:
      type: symbol
      kind: call
      exact: "Class.forName"
    unless:
      - id: well-known/lib/runtime/managed/openjdk::jdk-distribution-artifact
  - id: method-invoke
    desc: Dynamic method invocation via reflection
    crit: notable
    conf: 0.95
    mbc: "F0006"
    if:
      type: symbol
      kind: call
      regex: '\.invoke$'
    unless:
      - id: well-known/lib/runtime/managed/openjdk::jdk-distribution-artifact
  - id: getdeclaredmethod
    desc: Access private methods via reflection
    crit: notable
    conf: 0.9
    mbc: "F0006"
    if:
      type: symbol
      kind: call
      exact: getDeclaredMethod
    unless:
      - id: well-known/lib/runtime/managed/openjdk::jdk-distribution-artifact
  - id: getdeclaredfield
    desc: Access private fields via reflection
    crit: notable
    conf: 0.9
    mbc: "F0006"
    if:
      type: symbol
      kind: call
      exact: getDeclaredField
    unless:
      - id: well-known/lib/runtime/managed/openjdk::jdk-distribution-artifact
  # ============================================================
  # NATIVE CODE LOADING
  # ============================================================
  - id: system-loadlibrary
    desc: Load native library
    crit: notable
    conf: 0.9
    mbc: "C0033"
    attack: "T1129"
    if:
      type: symbol
      kind: call
      exact: "System.loadLibrary"
    unless:
      - id: well-known/lib/runtime/managed/openjdk::jdk-distribution-artifact
  - id: system-load
    desc: Load native library by path
    crit: notable
    conf: 0.9
    mbc: "C0033"
    attack: "T1129"
    if:
      type: symbol
      kind: call
      exact: "System.load"
    unless:
      - id: well-known/lib/runtime/managed/openjdk::jdk-distribution-artifact
  # Neutral JVM capabilities whose canonical observations live under
  # micro-behaviors, referenced from there rather than restated here:
  #   URLClassLoader  -> micro-behaviors/process/interpreter/runtime/jvm
  #   setAccessible   -> micro-behaviors/data/source/dynamic/reflect::java-set-accessible
  #   defineClass     -> micro-behaviors/data/embedded/classfile::runtime-define-class
  # ScriptEngine API calls are neutral capabilities.  Their canonical
  # observations live under micro-behaviors/process/interpreter/runtime/jvm;
  # dropper composites add the staging context that makes them suspicious.
  # ============================================================
  # JNDI (Log4Shell vector)
  # ============================================================
  - id: initialcontext
    desc: JNDI InitialContext (potential injection)
    crit: suspicious
    conf: 0.85
    if:
      type: text
      word: "javax/naming/InitialContext"
    unless:
      - id: well-known/lib/runtime/managed/openjdk::jdk-distribution-artifact
  - id: jndi-lookup
    desc: JNDI lookup (Log4Shell attack vector)
    crit: notable
    conf: 0.9
    mbc: "C0033"
    if:
      type: symbol
      kind: call
      regex: '\.lookup$'
    unless:
      - id: well-known/lib/runtime/managed/openjdk::jdk-distribution-artifact
