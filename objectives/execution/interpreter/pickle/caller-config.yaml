defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1059.006,T1195.002
  mbc: E1059

composite_rules:
  - id: python-caller-frame-magic-compressed-pickle-exec
    desc: Unpickles caller-frame compressed default.config before check
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/data/serialize/unsafe::python-caller-pickle-postcheck
      - id: micro-behaviors/data/serialize/unsafe::python-magic-gzip-xz-zlib-decompress-dispatch
      - id: micro-behaviors/data/serialize/unsafe::python-caller-find-spec-default-config
