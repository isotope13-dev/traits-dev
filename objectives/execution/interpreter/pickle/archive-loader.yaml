defaults:
  platforms: [unix]
  for: [tar]
  attack: T1059.006
  mbc: E1059

traits:
  - id: tar-pickle-builtins-exec-global
    desc: TAR pickle invokes builtins.exec
    crit: suspicious
    conf: 0.9
    if:
      type: raw
      regex: 'builtins.{0,16}exec'

  - id: tar-pickle-url-retrieval
    desc: TAR content downloads a URL resource
    crit: suspicious
    conf: 0.95
    if:
      type: raw
      regex: 'urllib.{0,32}urlretrieve'

  - id: tar-pickle-subprocess-launch
    desc: TAR content launches a subprocess
    crit: suspicious
    conf: 0.95
    if:
      type: raw
      regex: 'subprocess.{0,12}Popen'

composite_rules:
  - id: tar-pickle-download-and-execute
    desc: Pickle in TAR executes code that downloads and launches a payload
    crit: hostile
    conf: 0.98
    all:
      - id: tar-pickle-builtins-exec-global
      - id: tar-pickle-url-retrieval
      - id: tar-pickle-subprocess-launch
