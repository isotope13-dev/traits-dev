# Untrusted pickle config files resolved from caller context (pafer / webreader).
defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1059.006,T1195.002
  mbc: E1059

composite_rules:
  - id: python-unpickle-caller-resolved-config
    desc: Python unpickles a config blob after resolving the caller path
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/serialize/unsafe::pickle-loads
      - id: objectives/supply-chain/hidden-payload/pafer-pickle-config::python-decompressed-pickle-config-load
      - id: objectives/supply-chain/hidden-payload/pafer-pickle-config::python-sys-getframe-caller-globals
