defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1059.006
  crit: suspicious
  conf: 0.98
traits:
- id: executable-reducer
  desc: Pickle reducer returns an execution callable
  if:
    type: tree-sitter
    language: python
    query: |
      ((function_definition
         name: (identifier) @method
         body: (block
           (return_statement
             (tuple . (_) @executor (tuple)))))
       (#match? @method "^__reduce(_ex)?__$")
       (#match? @executor "^(os\\.(system|popen)|subprocess\\.(Popen|call|run|check_output)|builtins\\.(eval|exec)|eval|exec)$"))
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
  - id: well-known/tool/detection/code-analysis/semgrep::rule-pack-fixture
composite_rules:
- id: executable-pickle-multipart-send
  desc: Executable reducer with pickle serialization and multipart send
  all:
  - id: executable-reducer
  - id: micro-behaviors/data/serialize/unsafe::pickle-dumps
  - id: micro-behaviors/communications/socket/framing::python-send-multipart
