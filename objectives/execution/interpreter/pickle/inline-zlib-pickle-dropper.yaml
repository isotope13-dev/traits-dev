# Unpickling attacker bytes is code execution (a REDUCE opcode can call
# builtins.exec). Generating a script whose whole body is
# pickle.loads(zlib.decompress(b'x\x9c...')) hides the real program from any
# reader of the dropped file; when the generator also runs that write from a
# background thread or aims it at an autostart location there is no
# serialization use case left.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1059.006,T1027

composite_rules:
  - id: python-inline-zlib-pickle-exec-dropper
    desc: Drops a script that executes an inline zlib-compressed pickle
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/fs/write/file/stream::python-writes-inline-zlib-pickle-loader
    any:
      - id: micro-behaviors/process/thread/create::python-thread-create
      - id: micro-behaviors/fs/write/file/startup::python-bound-startup-script-write
      - id: micro-behaviors/fs/path/hidden::python-path-join-dot-prefix
