defaults:
  platforms: [unix, windows]
  for: [python]
  crit: suspicious
composite_rules:
  - id: module-scope-http-torch-load
    desc: Import-time PyTorch load uses HTTP data
    conf: 0.98
    near_bytes: 0
    all:
      - id: micro-behaviors/data/serialize/unsafe::torch-load-http-derived-input
      - id: micro-behaviors/data/serialize/unsafe::module-scope-torch-load
