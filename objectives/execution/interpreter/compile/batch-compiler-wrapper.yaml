# Batch-to-EXE compilers wrap a script in a small Delphi stub that stores
# the script in an encrypted data block and runs it through cmd.exe. The
# stub is legitimate software; what it carries is the question. A stub that
# also has an edited DOS header and a high-entropy appended block is
# hiding a script from anyone who reads the file.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1059.003,T1027.002
traits:
  - id: abyssmedia-vendor-url
    desc: Abyssmedia vendor URL string
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: abyssmedia\.com
      case_insensitive: true
composite_rules:
  - id: batch-compiler-stub-with-encrypted-script-block
    desc: Batch compiler stub with encrypted script block
    crit: suspicious
    conf: 0.75
    all:
      - id: abyssmedia-vendor-url
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-command-text
      - id: metadata/binary/section/entropy::writable-data-section-entropy-over-7
      - id: metadata/binary/layout/overlay::high-entropy-overlay
    unless:
      - id: metadata/signed/platform/
