defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - typescript
  attack: T1059.001,T1027
  crit: hostile
composite_rules:
  - id: pe-hidden-encoded-remote-script-launch
    desc: PE hides an encoded PowerShell launch that fetches and evaluates a remote script
    conf: 0.98
    for:
      - pe
    platforms:
      - windows
    attack: T1059.001,T1105,T1204.002,T1564.003
    near_bytes: 1024
    all:
      - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: objectives/execution/payload/script-eval/network/response-body::embedded-irm-iex-pipeline
  - id: encoded-powershell-download-cradle
    desc: Encoded PowerShell executes downloaded remote script
    conf: 0.98
    for:
      - text
      - data
      - documents
      - scripts
    platforms:
      - windows
    attack: T1059.001,T1105,T1027
    # The decode and the fetch-evaluate are one command: they sit within a
    # single statement. Distant mentions (a detector documenting both idioms
    # in different sections of one file) are not a cradle.
    near_bytes: 1024
    all:
      - id: objectives/execution/payload/script-eval/network/response-body::embedded-iex-irm-call
    any:
      - id: micro-behaviors/process/argument/interpreter::powershell-base64-ec-option
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
    unless:
      - id: well-known/app/browser-extension/execfence::execfence-bundle-context
      - id: well-known/app/browser-extension/execfence::execfence-extension-context
