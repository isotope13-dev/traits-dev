# Fileless encoded-payload launch: a spawn bridge starts PowerShell with
# -EncodedCommand carrying a staged payload, behind a hidden window or an
# execution-policy bypass. -EncodedCommand exists to keep code out of argv
# quoting and off command-line readers; management tooling may use it with
# visible windows and default policy, so the concealment or bypass flag is
# required evidence — with it, this is the standard no-file dropper launch.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1059.001,T1027

composite_rules:
  - id: encoded-payload-powershell-spawn
    desc: Spawns PowerShell to evaluate an encoded payload
    crit: hostile
    conf: 0.97
    # The argv pieces and the spawn sit in one statement in every observed
    # launcher; the window keeps scattered option mentions from binding.
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/interpreter/powershell/command::encodedcommand-flag-js
      - id: micro-behaviors/process/create/shell/bridge::child-process-exec
    any:
      - id: micro-behaviors/process/create/hidden::argv-array-windowstyle-hidden
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-argv-pair
