defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  attack: T1059.001,T1027
  crit: hostile
composite_rules:
- id: pe-hidden-encoded-remote-script-launch
  desc: PE hides an encoded PowerShell launch that fetches and evaluates a remote script
  conf: 0.98
  for:
  - pe
  platforms:
  - windows
  attack: T1059.001,T1105,T1204.002,T1564.003
  near_bytes: 1024
  all:
  - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
  - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
  - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
  - id: micro-behaviors/process/deploy/script-eval::embedded-irm-iex-pipeline
- id: encoded-payload-powershell-spawn
  desc: Spawns PowerShell to evaluate an encoded payload
  conf: 0.97
  near_bytes: 1024
  all:
  - id: metadata/lang/source/syntax/argument::encodedcommand-flag-js
  - id: micro-behaviors/process/create/shell/bridge::child-process-exec
  any:
  - id: micro-behaviors/process/create/hidden::argv-array-windowstyle-hidden
  - id: micro-behaviors/process/create/flags::powershell-policy-bypass-argv-pair
- id: encoded-powershell-download-cradle
  desc: Encoded PowerShell executes downloaded remote script
  conf: 0.98
  for:
  - text
  - data
  - documents
  - scripts
  platforms:
  - windows
  attack: T1059.001,T1105,T1027
  all:
  - id: micro-behaviors/process/argument/option::powershell-base64-ec-option
  - id: micro-behaviors/process/deploy/script-eval::embedded-iex-irm-call
