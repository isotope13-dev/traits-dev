defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: pypi-base64-powershell-downloader
  desc: PyPI setup.py launches a hidden Base64-concealed downloader
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.001
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/process/create/subprocess/launch::popen-content
  - id: metadata/lang/encoding/base64::encoded-invoke-webrequest
  - id: metadata/lang/encoding/base64::encoded-outfile-option
  - id: micro-behaviors/fs/path/basename::base64-decoded-executable-path
  - id: micro-behaviors/process/argument/visibility::argv-array-windowstyle-hidden
