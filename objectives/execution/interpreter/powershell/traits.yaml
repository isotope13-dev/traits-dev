defaults:
  platforms:
    - unix
    - windows
  for:
    - powershell
traits:
  - id: pwsh-downloader
    crit: suspicious
    conf: 0.9
    desc: 'PS downloader using.DownloadFile'
    if:
      type: string_literal
      regex: /new-object system.net.webclient\)\.downloadfile/i

composite_rules:
  - id: powershell-wscript-staged-script-execution
    desc: PowerShell launches staged script using Windows Script Host
    crit: hostile
    conf: 0.98
    attack: T1059.005,T1059.001
    all:
      - id: "micro-behaviors/process/info/name::windows-script-host-executable-reference"
    any:
      - id: micro-behaviors/communications/http/download/webclient::downloadfile-temp-encoded-script
      - id: objectives/evasion/masquerade/extension-mismatch::downloadfile-text-source-to-script

  - id: powershell-hidden-encoded-tcpclient-stage
    desc: Launches hidden EncodedCommand payload constructing TcpClient
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1027.010,T1564.003
    all:
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
      - id: metadata/lang/source/syntax/argument::powershell-encodedcommand-or-ec-option
      - id: micro-behaviors/communications/socket/tcp::decoded-tcpclient-type-reference
