# PowerShell hosted inside an MSBuild CodeTaskFactory inline task: the
# .csproj is a LOLBAS stager that compiles C# which opens a runspace and
# AddScript()s a payload. Ordinary MSBuild files that merely mention
# PowerShell as a build tool do not open RunspaceFactory from inline C#.
defaults:
  platforms: [windows]
  for: [xml]
  attack: T1059.001,T1127.001
  mbc: E1059

composite_rules:
  - id: msbuild-inline-powershell-runspace
    desc: MSBuild inline task hosts a PowerShell runspace
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/command-and-control/dropper/execution/build::msbuild-inline-task
      - id: micro-behaviors/process/interpreter/powershell/host::runspace-factory
      - id: micro-behaviors/process/interpreter/powershell/host::add-script
