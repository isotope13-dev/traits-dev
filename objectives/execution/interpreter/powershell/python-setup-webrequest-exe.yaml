defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: setup-py-powershell-iwr-dropper
  desc: setup.py PowerShell webrequest dropper
  crit: hostile
  conf: 0.98
  mbc: E1105
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/communications/http/download/url::executable-url-reference
  - id: micro-behaviors/communications/http/download/helper::python-string-powershell-webrequest
  - id: metadata/lang/source/literal/string/command::powershell-invoke-expression-exe
  any:
  - id: micro-behaviors/process/create/subprocess/launch::run-ast
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system
  - id: micro-behaviors/process/create/shell/command-mode::python-os-popen-call
