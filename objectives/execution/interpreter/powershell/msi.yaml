# PowerShell launched by an MSI-hosted Windows Script Host custom action.
defaults:
  platforms: [windows]
  for: [msi]
  attack: T1059.001,T1059.007,T1564.003

traits:
  - id: wscript-shell-run-launcher
    desc: WScript.Shell Run launcher embedded in an MSI
    crit: notable
    conf: 0.98
    if:
      type: raw
      regex: '(?i)CreateObject\(\s*["'']Wscript\.Shell["'']\s*\)\.Run\b'
  - id: hidden-noprofile-powershell
    desc: Hidden no-profile PowerShell launch
    crit: suspicious
    conf: 0.98
    if:
      type: raw
      regex: '(?i)\bpowershell\.exe\s+-NoP\s+-W\s+Hidden\b'
  - id: encoded-powershell-command
    desc: PowerShell encoded-command option
    crit: suspicious
    conf: 0.98
    if:
      type: raw
      regex: '(?i)\bpowershell\.exe\b.{0,80}-(Enc|EncodedCommand)\b'

  # MSI tables may store the interpreter path and its switches in separate
  # fields, so a rule that requires `powershell.exe` immediately before the
  # switches misses custom actions such as `-NoP -W Hidden -Exec Bypass -Enc`.
  # Keep each switch atomic and infer hostile intent only from the tight
  # hidden/bypass/encoded combination below; individual switches, including
  # no-profile, are also used by administrators.
  - id: msi-hidden-window-switch
    desc: MSI custom action hides PowerShell window
    crit: notable
    conf: 0.96
    if:
      type: raw
      regex: '(?i)\b-(W|WindowStyle)\s+Hidden\b'
  - id: msi-policy-bypass-switch
    desc: MSI custom action bypasses PowerShell policy
    crit: notable
    conf: 0.97
    if:
      type: raw
      regex: '(?i)\b-(Exec(utionPolicy)?|EP)\s+(Bypass|Unrestricted)\b'
  - id: msi-encoded-command-switch
    desc: MSI passes encoded PowerShell command
    crit: notable
    conf: 0.97
    if:
      type: raw
      regex: '(?i)\b-(Enc(odedCommand)?)\b'

composite_rules:
  - id: msi-hidden-encoded-powershell
    desc: MSI launcher hides and encodes PowerShell execution
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1059.007,T1564.003
    all:
      - id: wscript-shell-run-launcher
      - id: hidden-noprofile-powershell
      - id: encoded-powershell-command

  - id: msi-hidden-policy-bypass-encoded-powershell
    desc: MSI launches hidden policy-bypassed encoded PowerShell
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1564.003
    all:
      - id: msi-hidden-window-switch
      - id: msi-policy-bypass-switch
      - id: msi-encoded-command-switch
    near_bytes: 160
