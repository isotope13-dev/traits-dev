# A script interpreter launching PowerShell with an offset-decoded
# ScriptBlock payload.
defaults:
  platforms: [windows, unix]
  attack: T1059.001,T1027,T1140
  crit: hostile
  conf: 0.96

composite_rules:
  - id: offset-scriptblock-powershell-launch
    desc: Launches PowerShell to evaluate an offset-decoded ScriptBlock
    near_bytes: 8192
    all:
      - id: objectives/anti-static/obfuscation/encoding/arithmetic::powershell-offset-integer-array-script-eval
    any:
      - id: micro-behaviors/process/create/spawn::node-spawn-powershell-process
      - id: micro-behaviors/process/create/eval::python-powershell-command-argv
