# PowerShell / script PoC payload success patterns.
# calc.exe + "Payload executed" is a ubiquitous malware demo of code execution.
defaults:
  platforms: [windows]
  for: [powershell, batch, pe]
  attack: T1059.001

traits:
  # Attack-language success banner used by PoC payloads and malware demos.
  - id: payload-executed-banner
    desc: Payload execution success banner
    crit: suspicious
    conf: 0.9
    if:
      type: literal
      regex: '(?i)payload\s+executed'

composite_rules:
  - id: calc-poc-payload-success
    desc: Calc.exe PoC payload announces successful execution
    crit: hostile
    conf: 0.95
    for: [powershell, batch]
    near_lines: 8
    all:
      - id: micro-behaviors/process/create/start-process::start-process-calc
      - id: payload-executed-banner
