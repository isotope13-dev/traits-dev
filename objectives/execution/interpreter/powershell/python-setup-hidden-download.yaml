defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: pypi-powershell-dropper
  desc: PyPI setup.py PowerShell download-execute chain
  crit: hostile
  conf: 0.95
  attack: T1059.001
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/process/create/subprocess/launch::popen-ast
  - id: micro-behaviors/communications/http/download/helper::python-string-powershell-download-cradle
  - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
