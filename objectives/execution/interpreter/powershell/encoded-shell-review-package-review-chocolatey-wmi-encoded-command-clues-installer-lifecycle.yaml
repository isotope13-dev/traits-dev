---
defaults:
  platforms:
  - windows
  for:
  - nupkg
composite_rules:
- id: chocolatey-wmi-encoded-command-clues
  desc: Chocolatey hook with WMI and encoded hidden command clues
  crit: suspicious
  conf: 0.99
  scope: archive
  for:
  - source
  - "!objectivec"
  - batch
  - beam
  - class
  - javascript
  - lua
  - nupkg
  - ole
  - pe
  - perl
  - php
  - powershell
  - pyc
  - python
  - ruby
  - static-lib
  - vbs
  - wasm
  all:
  - id: metadata/package/files/nuget::chocolatey-install-script-member
  - id: micro-behaviors/os/wmi/query::cimv2-namespace-reference
  - id: metadata/lang/source/syntax/command/launch::encoded-command-line
  - id: micro-behaviors/process/argument/visibility::powershell-hidden-window
