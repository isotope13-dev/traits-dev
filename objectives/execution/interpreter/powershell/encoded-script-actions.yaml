defaults:
  for: [html, vbs]
  platforms: [windows]
composite_rules:
  - id: concealed-powershell-appdata-script-actions
    desc: Concealed PowerShell download and script calls
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/get::encoded-powershell-web-get
      - id: micro-behaviors/communications/http/download/cli::encoded-appdata-script-output
      - id: micro-behaviors/process/interpreter/eval/indirect::encoded-appdata-script-invocation
      - id: objectives/anti-static/obfuscation/syntax::vbs-concealed-shell-encoded-powershell
