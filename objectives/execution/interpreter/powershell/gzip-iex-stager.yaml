defaults:
  for: [powershell, text]
  platforms: [windows]
traits:
  - id: ps-gzip-b64-magic
    desc: Base64-encoded gzip header in script
    crit: notable
    if:
      type: text
      substr: H4sI
  - id: ps-iex-call
    desc: PowerShell Invoke-Expression iex call
    crit: notable
    if:
      type: text
      regex: "(?i)\\biex\\s*\\("
  - id: ps-decompress-token
    desc: Obfuscated or plain Decompress token
    crit: component
    if:
      type: text
      regex: "(?i)decom['\"]?\\+?['\"]?press"
composite_rules:
  - id: powershell-gzip-iex-stager
    desc: PowerShell script decompresses base64 gzip payload into iex
    crit: hostile
    conf: 0.95
    attack: T1059.001,T1027
    all:
      - id: ps-gzip-b64-magic
      - id: ps-iex-call
      - id: ps-decompress-token
    # Saved-search exports quote these spellings as query text.
    unless:
      - id: metadata/file/catalog/pattern-rules::splunk-saved-search-export
