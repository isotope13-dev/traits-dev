defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1059.001,T1027
composite_rules:
  - id: inline-powershell-stride-decoder-invoker
    desc: Command line runs inline stride decoder and invoker
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/string/assembly::powershell-inline-command-defines-function
      - id: objectives/anti-static/obfuscation/string/index-select::ps-strided-character-reconstruction
      - id: objectives/anti-static/obfuscation/string/index-select::ps-variable-dot-invocation
