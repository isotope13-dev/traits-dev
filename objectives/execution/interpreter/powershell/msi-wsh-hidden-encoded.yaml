defaults:
  platforms: [windows]
  for: [oledoc]
composite_rules:
  - id: msi-wsh-hidden-encoded-clues
    desc: MSI WSH hidden encoded PowerShell clues
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/create/exec::msi-wscript-shell-run-call
      - id: micro-behaviors/process/argument/visibility::msi-hidden-window-option-text
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-argument
      - id: micro-behaviors/process/argument/interpreter::msi-encoded-command-option-text
