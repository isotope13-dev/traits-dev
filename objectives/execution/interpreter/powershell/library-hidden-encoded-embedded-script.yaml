# A library that base64-encodes a PowerShell script it carries and launches
# it with a hidden window keeps the script out of command-line logs and
# out of the user's sight (eldergrovebyte clipper).
defaults:
  platforms: [windows]
  for: [swift, csharp, go, rust]
  attack: T1059.001,T1027.010,T1564.003

composite_rules:
  - id: embedded-powershell-loop-hidden-encoded-launch
    desc: Library launches its embedded PowerShell loop hidden and encoded
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/argument/interpreter::argv-array-hidden-encodedcommand
      - id: micro-behaviors/data/control-flow/loop/unconditional::embedded-powershell-while-true
      - id: micro-behaviors/process/create/exec::child-process-execution
