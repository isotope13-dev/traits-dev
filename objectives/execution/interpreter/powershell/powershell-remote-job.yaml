# Start-Job creates a separate PowerShell process for its ScriptBlock.
defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-downloaded-job-policy-bypass
    desc: Policy bypass with downloaded encoded job source
    crit: suspicious
    conf: 0.98
    attack: T1059.001,T1105
    all:
      - id: micro-behaviors/process/create/eval::powershell-download-base64-job
      - id: micro-behaviors/os/security/policy::powershell-process-policy-bypass-scope-first
    # The source-to-job chain is bound by syntax. The policy bypass co-occurs
    # in this file; neither an endpoint nor a family marker gates the rule.
