defaults:
  platforms: [windows]
  for: [javascript, typescript]
composite_rules:
  - id: node-hidden-encoded-powershell-clues
    desc: Hidden encoded shell and child-process clues
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/process/argument/visibility::hidden-encoded-powershell-command-text
      - id: metadata/import/builtin::require-child-process
      - id: metadata/file/encoding/shape::large-base64-like-literal
