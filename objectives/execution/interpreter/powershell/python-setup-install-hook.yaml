---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
traits:
- id: python-setup-discord-audio-download-and-launch-sequence
  desc: Downloads Discord MP3, launches with PowerShell
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.001,T1195.002
- id: discord-cdn-mp3-attachment-url
  desc: References Discord CDN MP3 attachment URL
  crit: suspicious
  conf: 0.97
  attack: T1105
  if:
    type: text
    regex: 'cdn\.discordapp\.com/attachments/\d+/\d+/[\w.-]{1,80}\.mp3'
- id: curl-exe-start-process-mp3
  desc: Downloads MP3 with curl and Start-Process
  crit: suspicious
  conf: 0.97
  attack: T1105,T1059.001
  if:
    type: yara
    source: |
      rule python_setup_discord_audio_download_and_launch_sequence {
        strings:
          $s0 = /curl\.exe/s
          $s1 = /cdn\.discordapp\.com\/attachments\/[0-9]+\/[0-9]+\//s
          $s2 = /\.mp3/s
          $s3 = /Start-Process/s
        condition:
          (for any i0 in (1..#s0) : (for any i1 in (1..#s1) : (@s1[i1] >= @s0[i0] + !s0[i0] and @s1[i1] <= @s0[i0] + !s0[i0] + 500 and (for any i2 in (1..#s2) : (@s2[i2] >= @s1[i1] + !s1[i1] and @s2[i2] <= @s1[i1] + !s1[i1] + 160 and (for any i3 in (1..#s3) : (@s3[i3] >= @s2[i2] + !s2[i2] and @s3[i3] <= @s2[i2] + !s2[i2] + 500 and (true))))))))
      }
composite_rules:
- id: python-setup-install-discord-audio-launcher
  desc: Install hook downloads and launches an audio file from Discord
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.001,T1195.002
  scope: file
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: discord-cdn-mp3-attachment-url
  - id: curl-exe-start-process-mp3
- id: python-setup-hidden-vbs-download-and-launch
  desc: setup hook downloads and hides a remote VBS launcher
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.001,T1195.002
  scope: file
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
  - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
  - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
  - id: micro-behaviors/process/argument/interpreter::powershell-command-options-text
- id: setup-py-powershell-install-hook
  desc: setup.py install hook launches PowerShell
  crit: suspicious
  conf: 0.96
  mbc: E1059.001
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: metadata/build/package/recipe/setup-hooks::python-install-hook
  - id: micro-behaviors/process/argument/interpreter::powershell-command-options-text
  any:
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system
  - id: micro-behaviors/process/create/subprocess/launch::process-execution
  unless:
  - id: well-known/tool/reverse-engineering/dwex::packaging-context
