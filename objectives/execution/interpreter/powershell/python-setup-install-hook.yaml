defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: setup-py-powershell-install-hook
  desc: setup.py install hook launches PowerShell
  crit: suspicious
  conf: 0.96
  mbc: E1059.001
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: metadata/build/package/recipe/setup-hooks::python-install-hook
  - id: micro-behaviors/process/argument/interpreter::powershell-command-options-text
  any:
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system
  - id: micro-behaviors/process/create/subprocess/launch::process-execution
  unless:
  - id: well-known/tool/reverse-engineering/dwex::packaging-context
