defaults:
  for: [javascript]
  platforms: [windows]
composite_rules:
# Concealed COM/HTTP and PowerShell file-launch code co-occur. This static
# profile does not bind a response body to a written file or prove execution.
# Concealed interpreter invocation is supported; a payload chain is not.
- id: obfuscated-com-http-powershell-file-launch
  crit: hostile
  conf: 0.98
  desc: Obfuscated COM/HTTP and bypassed PowerShell file-launch clues
  attack: T1027,T1059.001,T1059.007
  all:
  - id: micro-behaviors/os/com/automation::activex-constructor-call
  - id: micro-behaviors/os/com/automation::filesystemobject-progid
  - id: micro-behaviors/process/create/flags::powershell-nop-ep-bypass-file-command
  - id: objectives/anti-static/obfuscation/string/array::rc4-hex-calls-computed-activex
  any:
  - id: micro-behaviors/communications/http/url/path::executable-url-reference-b
  - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-progid
  - id: micro-behaviors/communications/http/client/xmlhttp::msxml-http-variants
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-com
  - id: micro-behaviors/communications/ip/literal::javascript-external-http-ip-url
  needs: 1

