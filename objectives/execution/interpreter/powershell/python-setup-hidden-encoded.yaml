defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: pypi-encoded-powershell-dropper
  desc: PyPI setup.py launches hidden encoded PowerShell
  crit: hostile
  conf: 0.96
  attack: T1059.001
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/process/create/subprocess/launch::popen-ast
  - id: metadata/lang/source/syntax/command/launch::powershell-encoded-payload-command-text
  - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
  - id: micro-behaviors/process/config/launch::creationflags
