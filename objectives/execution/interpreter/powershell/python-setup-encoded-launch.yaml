defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: pypi-powershell-encoded-dropper
  desc: Setup script launches hidden encoded PowerShell
  crit: hostile
  conf: 0.98
  attack: T1059.001
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/process/create/subprocess/launch::popen-content
  - id: metadata/lang/source/syntax/command/launch::powershell-encoded-payload-command-text
  - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
