defaults:
  platforms: [windows]
  for: [pe]
  attack: T1059.001

traits:
  - id: powershell-command-exe-string
    desc: PowerShell Command invocation string
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(powershell\.exe -Command ")'
  - id: hidden-bypass-file-command
    desc: Hidden PowerShell bypass file execution
    crit: suspicious
    conf: 0.96
    if:
      type: text
      exact: powershell.exe -ExecutionPolicy Bypass -WindowStyle Hidden -NoProfile -File "

  # Same capability with NoProfile/NonInteractive placed before Bypass.
  - id: hidden-bypass-file-command-noprofile
    desc: Hidden PowerShell bypass with NoProfile flags
    crit: suspicious
    conf: 0.96
    if:
      type: text
      exact: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -WindowStyle Hidden -File "
  # Rust agents pack the switch and both interpreter names into one
  # string table entry with no spaces: `-Commandpowershell.exe/ccmd.exe`.
  - id: adjacent-powershell-cmd-switch
    desc: Adjacent PowerShell and cmd command switch
    crit: notable
    conf: 0.93
    if:
      type: raw
      regex: '-Command.{0,4}powershell\.exe.{0,8}cmd\.exe'
      section: rdata
  - id: powershell-command-read-from-file
    desc: PowerShell command read from file
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: Comando letto dal file
  - id: italian-hidden-powershell-status
    desc: Italian hidden PowerShell status
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: finestra nascosta

composite_rules:
  - id: powershell-bypass-base64-iex-execution
    desc: Startup redirector embeds Base64 IEX execution with policy bypass
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1140
    all:
      - id: micro-behaviors/data/decode/base64::powershell-frombase64string
      - id: micro-behaviors/os/security/policy::powershell-policy-bypass-text
      - id: objectives/persistence/login/startup/registry::user-shell-folders-startup-redirection
  - id: downloaded-config-powershell-execution
    desc: Executes PowerShell from downloaded config
    crit: suspicious
    conf: 0.95
    all:
      - id: powershell-command-exe-string
      - id: powershell-command-read-from-file
      - id: italian-hidden-powershell-status
      - id: micro-behaviors/process/create/exec::create-process-a
    any:
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
      - id: objectives/command-and-control/dropper/delivery/urlmon::local-host-life-download-raw-url
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
