defaults:
  attack: T1059.005
  for: [scripts, binaries]
  platforms:
    - windows
traits:
  - id: vbs-shell-concat-fragment
    desc: VBScript shell concat fragment
    crit: notable
    conf: 0.88
    attack: T1059.001
    for: [vbs, html, scripts, text]
    if:
      type: text
      regex: '(?i)(^|[^&])&\s*\(?\s*["'']shell["'']'
  - id: vbs-powershell-hidden-bypass
    desc: VBScript hidden PowerShell bypass
    crit: suspicious
    conf: 0.96
    attack: T1059.001
    for: [vbs]
    unless:
      - id: micro-behaviors/process/create/shell/wsh::vbs-hidden-powershell-file-run
    if:
      type: text
      regex: '(?i)powershell.{0,40}-(w|WindowStyle)\s+Hidden.{0,80}-ExecutionPolicy\s+Bypass'
  - id: vbs-powershell-env-iex
    desc: VBScript PowerShell env IEX
    crit: suspicious
    conf: 0.97
    attack: T1059.001
    for: [vbs]
    if:
      type: text
      regex: IEX\s+\$env:[A-Za-z_][A-Za-z0-9_]{3,40}
composite_rules:
  - id: vbs-mid-sliced-split-delimiter
    desc: VBScript Mid-sliced Split delimiter
    crit: suspicious
    conf: 0.9
    for: [vbs, html]
    all:
      - id: micro-behaviors/data/decode/custom::mid-sliced-variable
      - id: micro-behaviors/data/string/split::vbs-split-variable-delimiter
    near_lines: 15
  - id: vbs-split-powershell-launch
    desc: VBScript split PowerShell launch
    crit: suspicious
    conf: 0.9
    attack: T1059.001
    for: [vbs, html, scripts, text]
    all:
      - id: vbs-mid-sliced-split-delimiter
      - id: vbs-shell-concat-fragment
  - id: vbs-hidden-wscript-launcher
    for: [vbs]
    desc: Hidden VBScript WScript.Shell launcher
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-launcher
      - id: micro-behaviors/process/create/flags::show-window-hidden-assignment
  - id: vbs-hidden-split-powershell-runner
    desc: Hidden split PowerShell runner
    crit: hostile
    conf: 0.96
    attack: T1059.001
    for: [vbs]
    all:
      - id: vbs-split-powershell-launch
      - id: micro-behaviors/process/create/hidden::wscript-shell-hidden-run
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
  - id: vbs-hidden-env-powershell-launcher
    desc: VBScript launches hidden env PowerShell
    crit: hostile
    conf: 0.98
    attack: T1059.001
    for: [vbs]
    all:
      - id: vbs-powershell-hidden-bypass
      - id: vbs-powershell-env-iex
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: vbs-hidden-async-powershell-launcher
    desc: Hidden async policy-bypassed PowerShell
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1059.005,T1564.003
    for: [vbs]
    all:
      - id: micro-behaviors/process/argument/option::powershell-flagged-command-line
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/process/create/hidden::wsh-run-hidden-async-statement
      - id: micro-behaviors/process/create/flags::execution-policy-bypass
    unless:
      - id: micro-behaviors/process/create/shell/wsh::vbs-hidden-powershell-file-run

  - id: vbs-hidden-async-powershell-url-runner
    desc: Hidden async PowerShell runner with remote URL argument
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1059.005,T1105,T1564.003
    for: [vbs]
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/process/create/hidden::wsh-run-hidden-async-statement
      - id: micro-behaviors/process/argument/option::powershell-flagged-command-line
    any:
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-url-argument
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script

  - id: vbs-hidden-split-powershell-xor-loader
    desc: Hidden split PowerShell XOR loader
    crit: hostile
    conf: 0.98
    attack: T1059.005,T1059.001,T1027
    for: [vbs]
    all:
      - id: objectives/command-and-control/dropper/file-exec/command/script-host-download::wsh-hidden-powershell-xor-loader
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: vbs-hidden-obfuscated-payload-runner
    for: [vbs]
    desc: Hidden obfuscated VBScript payload runner
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/hidden::wsh-run-hidden-async-statement
      - id: objectives/anti-static/obfuscation/multi-layer::vbs-chunked-base64-payload-table
      - id: micro-behaviors/os/env/read::wsh-vbs-environment-method
  - id: vbs-obfuscated-dynamic-payload
    desc: Obfuscated VBScript dynamically evaluates payload
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.005
    for: [vbs]
    all:
      - id: micro-behaviors/data/encode/char-code::dense-chr-construction
      - id: metadata/file/line::vbs-long-average-lines
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
