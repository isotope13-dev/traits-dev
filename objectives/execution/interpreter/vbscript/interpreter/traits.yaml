defaults:
  attack: T1059.005
  for: [scripts, binaries]
  platforms:
    - windows
traits:
  - id: wscript-createobject-dup
    desc: WScript.CreateObject call
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'WScript\.CreateObject\s*\('
  - id: vbs-powershell-launch
    desc: VBScript launching PowerShell
    crit: suspicious
    conf: 0.9
    attack: T1059.001
    # A plain-text SQL log can quote a PowerShell command without containing
    # a VBScript or HTML script host.
    for: [vbs, html]
    if:
      type: text
      regex: '(?i)\bpowershell(\.exe)?\b\s+[-/][A-Za-z]'
    not:
      - substr: "run 'Connect-AzAccount' from PowerShell"
    unless:
      - id: well-known/tool/sysadmin/microsoft-office::office-license-cleanup-benign-context
      - id: metadata/binary/resource/
      - id: metadata/binary/resource::resources-dll-extension
      - id: well-known/tool/detection/ai-guardrail/
      # The matcher is "a powershell command line with a flag" — it never
      # checks for VBScript, and `for:` includes `text`, so any plain-text file
      # quoting a PowerShell invocation matches. Go's own build-ACL test script
      # (go/src/cmd/go/testdata/script/build_acl_windows.txt, `exec powershell
      # -Command 'Get-Acl main.exe ...'`) verifies that go build sets Windows
      # file permissions correctly. The VBScript intent this trait is named for
      # comes from the WScript.Shell leg in the composites that consume it.
      - id: well-known/tool/development/go-toolchain::go-toolchain-source-path
      - id: well-known/dual-use/transfer/rclone::rclone-release-documentation-context
      - id: metadata/file/format/structured::sourcemap
  - id: vbs-mid-power-slice
    desc: VBScript Mid power slice
    crit: suspicious
    conf: 0.88
    attack: T1059.001
    for: [vbs, html, scripts, text]
    if:
      type: text
      regex: '(?i)Mid\s*\([^)]{0,60}power[^)]{0,20}\)'
    unless:
      - id: metadata/library/generated::sphinx-searchindex-js
      - id: metadata/package/documentation::documentation-dir-path
  - id: vbs-shell-concat-fragment
    desc: VBScript shell concat fragment
    crit: component
    conf: 0.88
    attack: T1059.001
    for: [vbs, html, scripts, text]
    if:
      type: text
      regex: '(?i)(^|[^&])&\s*\(?\s*["'']shell["'']'
  - id: vbs-powershell-hidden-bypass
    desc: VBScript hidden PowerShell bypass
    crit: suspicious
    conf: 0.96
    attack: T1059.001
    for: [vbs]
    if:
      type: text
      regex: '(?i)powershell.{0,40}-(w|WindowStyle)\s+Hidden.{0,80}-ExecutionPolicy\s+Bypass'
  - id: vbs-powershell-env-iex
    desc: VBScript PowerShell env IEX
    crit: suspicious
    conf: 0.97
    attack: T1059.001
    for: [vbs]
    if:
      type: text
      regex: IEX\s+\$env:[A-Za-z_][A-Za-z0-9_]{3,40}
  - id: vbs-hidden-exec
    desc: WSH .Run hidden window, waits for exit
    crit: suspicious
    conf: 0.85
    for: [vbs]
    unless:
      - id: metadata/file/string/identity::windows-safe-mode-toggle-script
      - id: well-known/tool/development/ai-cli/agents-live::run-hidden-wrapper-tool
      - id: well-known/tool/sysadmin/microsoft-office::office-license-cleanup-benign-context
      - id: well-known/lib/network/curl::mk-ca-bundle-script
      - id: well-known/tool/sysadmin/microsoft-office::offscrub-removal-benign-context
      - id: well-known/tool/sysadmin/microsoft-office::office-mui-patch-repair-benign-context
      - id: well-known/tool/sysadmin/microsoft-office::office-repatches-benign-context
      - id: well-known/tool/sysadmin/microsoft-office::office-unpatches-benign-context
      - id: well-known/app/enterprise/fusioninventory::fusioninventory-agent-deployment-benign-context
    if:
      type: text
      regex: '(?i)\.run\s+[^,]{1,120},\s*0\s*,\s*true'
  - id: vbs-hidden-async-run
    desc: Hidden asynchronous WSH command
    crit: notable
    conf: 0.94
    attack: T1059.001
    for: [vbs]
    if:
      type: text
      regex: '(?i)\.run\s+[^,\r\n]{1,240},\s*0\s*,\s*(false|0)\b'
  - id: vbs-execute-dynamic
    desc: VBScript Execute evaluates dynamic source
    crit: suspicious
    conf: 0.85
    for: [vbs, html]
    if:
      type: text
      # VBScript's Execute statement takes an expression after the keyword.
      # A parenthesized token here is commonly a JScript helper function call
      # embedded in a WSF container, not VBScript dynamic evaluation.
      regex: '(?im)(^|[\n:])\s*Execute(Global)?\b\s+($|[^(])'
    unless:
      - id: well-known/app/communication/thunderbird::firefox-omni-runtime-path
      - id: metadata/file/string/corpus::hashed-text-record
      - id: well-known/app/development/yaklang::yaklang-documentation-index-context
composite_rules:
  - id: wscript-shell-exec
    desc: WScript.Shell execution pattern
    crit: notable
    conf: 0.85
    any:
      - id: objectives/execution/interpreter/vbscript/interpreter::wscript-createobject-dup
      - id: micro-behaviors/process/create/shell/script-host::wscript-shell-run-create
  - id: vbs-wscript-shell-launcher
    desc: VBScript WScript.Shell launcher
    crit: notable
    conf: 0.95
    all:
      - id: wscript-shell-exec
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-statement
  - id: vbs-split-powershell-launch
    desc: VBScript split PowerShell launch
    crit: suspicious
    conf: 0.9
    attack: T1059.001
    for: [vbs, html, scripts, text]
    all:
      - id: vbs-mid-power-slice
      - id: vbs-shell-concat-fragment
  - id: vbs-hidden-wscript-launcher
    desc: Hidden VBScript WScript.Shell launcher
    crit: hostile
    conf: 0.98
    all:
      - id: vbs-wscript-shell-launcher
      - id: objectives/execution/wmi::wmi-showwindow-hidden-property
  - id: vbs-hidden-split-powershell-runner
    desc: Hidden split PowerShell runner
    crit: hostile
    conf: 0.96
    attack: T1059.001
    for: [vbs, html, scripts, text]
    all:
      - id: vbs-split-powershell-launch
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-hidden-run
      - id: vbs-execute-dynamic
  - id: vbs-hidden-env-powershell-launcher
    desc: VBScript launches hidden env PowerShell
    crit: hostile
    conf: 0.98
    attack: T1059.001
    for: [vbs]
    all:
      - id: vbs-powershell-hidden-bypass
      - id: vbs-powershell-env-iex
      - id: micro-behaviors/os/com/object::wscript-shell-literal
  - id: vbs-hidden-async-powershell-launcher
    desc: Hidden async policy-bypassed PowerShell
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1059.005,T1564.003
    for: [vbs]
    all:
      - id: vbs-powershell-launch
      - id: micro-behaviors/os/com/object::wscript-shell-literal
      - id: vbs-hidden-async-run
      - id: objectives/execution/interpreter/script/wsh::execution-policy-bypass
  - id: vbs-hidden-split-powershell-xor-loader
    desc: Hidden split PowerShell XOR loader
    crit: hostile
    conf: 0.98
    attack: T1059.005,T1059.001,T1027
    for: [vbs]
    all:
      - id: objectives/command-and-control/dropper/execution/wsh::wsh-hidden-powershell-xor-loader
      - id: micro-behaviors/os/com/object::wscript-shell-literal
  - id: vbs-hidden-obfuscated-payload-runner
    desc: Hidden obfuscated VBScript payload runner
    crit: hostile
    conf: 0.98
    all:
      - id: vbs-hidden-async-run
      - id: objectives/anti-static/obfuscation/multi-layer::vbs-chunked-base64-payload-table
      - id: micro-behaviors/os/env/access::wsh-vbs-environment-method
  - id: vbs-obfuscated-dynamic-payload
    desc: Obfuscated VBScript dynamically evaluates payload
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.005
    for: [vbs]
    all:
      - id: micro-behaviors/data/encode/char-code::dense-chr-construction
      - id: objectives/anti-static/obfuscation/string/anomaly::script-host-line-bloat
      - id: objectives/execution/interpreter/vbscript/interpreter::vbs-execute-dynamic
  - id: vbs-arithmetic-dynamic-payload
    desc: Arithmetic-rebuilt VBScript payload execution
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.005
    for: [vbs]
    all:
      - id: micro-behaviors/data/encode/char-code::arithmetic-hex-chr-reconstruction
      - id: objectives/execution/interpreter/vbscript/loader::execute-variable-sink
      - id: metadata/file/metrics::single-long-line
