composite_rules:
- platforms:
  - windows
  for:
  - vbs
  attack: T1053.005,T1059.001,T1059.005,T1564.003
  id: vbs-task-installer-hidden-powershell-file-run
  desc: Task installer launches hidden PowerShell file
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/persistence/system/scheduled-task::vbs-short-interval-user-script-task
  - id: micro-behaviors/os/security/policy::execution-policy-bypass
  - id: micro-behaviors/process/create/exec::vbs-hidden-powershell-file-run
