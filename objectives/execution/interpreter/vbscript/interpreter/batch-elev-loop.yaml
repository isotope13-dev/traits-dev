# Batch that writes a WScript elevation-retry loop around a hidden elevated
# payload — used by fake-update droppers after Startup self-copy.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1059.005,T1548.002

composite_rules:
  - id: batch-vbs-elev-retry-hidden-ps
    desc: Batch writes VBS elevation retry around hidden PowerShell
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/persistence/login/startup/folder::batch-vbs-filesystemobject-echo
      - id: micro-behaviors/os/privilege/elevation::runas-verb
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
      - id: objectives/execution/interpreter/vbscript/interpreter::wscript-run
