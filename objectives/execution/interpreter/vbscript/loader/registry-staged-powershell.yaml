defaults:
  platforms: [windows]
  for: [vbs]

composite_rules:
  - id: padded-registry-stage-hidden-powershell
    desc: Padded VBScript stages registry data and launches hidden PowerShell
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.001,T1059.005,T1112,T1564.003
    all:
      - id: objectives/anti-static/obfuscation/string/junking::mass-comment-padding
      - id: micro-behaviors/data/string/concat/expression::vbs-many-long-literal-concatenations
      - id: micro-behaviors/os/registry/value/write::wscript-regwrite
      - id: micro-behaviors/os/handler/open::shell-application-execute-context
      - id: micro-behaviors/process/argument/visibility::shellexecute-hidden-showcmd
      - id: objectives/anti-static/obfuscation/string/concat::vbs-powershell-executable-char-suffix
