defaults:
  for: [vbs]
  platforms: [windows]
composite_rules:
  - id: padded-xor-temp-script-loader
    desc: Comment-padded XOR script stages a temporary WScript payload
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.005,T1059.007
    all:
      - id: objectives/anti-static/obfuscation/string/junking::mass-comment-padding
      - id: micro-behaviors/data/bitwise/xor/expression::vbs-indexed-array-xor
      - id: micro-behaviors/fs/path/temp::fso-getspecialfolder-temp
      - id: micro-behaviors/fs/write/content::create-text-file-method-name
      - id: micro-behaviors/process/interpreter/wsh::vbs-quoted-wscript-command
      - id: micro-behaviors/process/create/shell/interpreter::wsh-progid-near-run
