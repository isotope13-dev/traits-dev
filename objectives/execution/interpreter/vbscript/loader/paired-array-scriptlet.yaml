defaults:
  platforms: [windows]
  for: [vbs]
composite_rules:
  - id: vbs-paired-array-scriptlet-activation
    desc: Arrays conceal remote scriptlet activation
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/char-code::vbs-paired-array-char-offset
      - id: micro-behaviors/os/com/instantiation::script-protocol-getobject
      - id: micro-behaviors/communications/url/scheme::script-moniker-url
  - id: shifted-scriptlet-dynamic-activation
    desc: Shifted scriptlet prefix with dynamic COM call
    crit: hostile
    conf: 0.98
    near_lines: 3
    all:
      - id: micro-behaviors/data/decode/char-code::vbs-paired-array-char-offset
      - id: metadata/lang/encoding/shape/offset::vbs-reconstructed-getobject-name
      - id: metadata/lang/encoding/shape/offset::vbs-dynamic-one-argument-call
      - id: metadata/lang/encoding/shape/offset::vbs-three-offset-array
    any:
      - id: metadata/lang/encoding/shape/offset::vbs-additive-scriptlet-array-recipe
      - id: metadata/lang/encoding/shape/offset::vbs-subtractive-scriptlet-array-recipe
  # Generic form of the above: the moniker never appears in clear text, so
  # the script-protocol leg cannot match. Character codes plus a delta array
  # are summed into a string that goes straight to GetObject.
  - id: offset-array-getobject-activation
    desc: GetObject activates a moniker rebuilt from a byte array and an offset array
    crit: hostile
    conf: 0.97
    attack: T1059.005,T1027,T1218
    near_lines: 5
    all:
      - id: micro-behaviors/data/decode/char-code::vbs-paired-array-char-offset
      - id: metadata/lang/encoding/shape/offset::vbs-small-signed-offset-array
      - id: metadata/lang/source/syntax/call/invocation::getobject-variable-call-text
