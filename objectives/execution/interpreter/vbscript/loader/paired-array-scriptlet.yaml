defaults:
  platforms: [windows]
  for: [vbs]
composite_rules:
  - id: vbs-paired-array-scriptlet-activation
    desc: Arrays conceal remote scriptlet activation
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/char-code::vbs-paired-array-char-offset
      - id: micro-behaviors/os/com/instantiation::script-protocol-getobject
      - id: micro-behaviors/communications/url/scheme::script-moniker-url
  - id: shifted-scriptlet-dynamic-activation
    desc: Shifted scriptlet prefix with dynamic COM call
    crit: hostile
    conf: 0.98
    near_lines: 3
    all:
      - id: micro-behaviors/data/decode/char-code::vbs-paired-array-char-offset
      - id: metadata/lang/encoding/shape::vbs-reconstructed-getobject-name
      - id: metadata/lang/encoding/shape::vbs-dynamic-one-argument-call
      - id: metadata/lang/encoding/shape::vbs-three-offset-array
    any:
      - id: metadata/lang/encoding/shape::vbs-additive-scriptlet-array-recipe
      - id: metadata/lang/encoding/shape::vbs-subtractive-scriptlet-array-recipe
