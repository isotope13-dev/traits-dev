defaults:
  platforms: [windows]
composite_rules:
  # An HTA/HTML page whose VBScript starts PowerShell through a hidden
  # command shell with bypassed policy and an encoded command, naming the
  # shell with Chr/ChrW arithmetic so no plain string gives it away.
  - id: html-vbscript-hidden-encoded-powershell-launch
    desc: Page VBScript hides an encoded PowerShell launch
    crit: hostile
    conf: 0.95
    attack: T1059.005,T1059.001,T1218.005,T1027
    for: [html]
    all:
      - id: micro-behaviors/process/interpreter/scripting::html-vbscript-block
      - id: micro-behaviors/process/create/flags::vbs-charquoted-hidden-run
      - id: micro-behaviors/process/create/flags::execution-policy-bypass-abbrev-flag
      - id: micro-behaviors/data/decode/charset::vbs-chrw-concat-chain
