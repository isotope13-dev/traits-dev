defaults:
  platforms: [windows]
composite_rules:
  # Hidden Run syntax, character-code construction and encoded/bypass options
  # support concealment. They do not establish the downloaded content or bind
  # an arbitrary Run argument to the PowerShell string. Payload findings also
  # require decoded download, output-path and command-dispatch observations.
  - id: html-vbscript-hidden-encoded-powershell-launch
    desc: VBScript hidden Run with encoded PowerShell
    crit: suspicious
    conf: 0.95
    attack: T1059.005,T1059.001,T1218.005,T1027
    for: [html]
    all:
      - id: micro-behaviors/process/interpreter/scripting::html-vbscript-block
      - id: micro-behaviors/process/create/flags::vbs-charquoted-hidden-run
      - id: micro-behaviors/process/create/flags::execution-policy-bypass-abbrev-flag
      - id: micro-behaviors/data/decode/char-code::vbs-chrw-concat-chain
      - id: micro-behaviors/process/argument/option::powershell-base64-ec-option
