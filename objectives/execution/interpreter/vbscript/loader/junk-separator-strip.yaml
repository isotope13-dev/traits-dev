# Junk-separator stripping stager: the payload command is built as one long
# concatenation with a multi-byte junk token interleaved between every pair
# of characters, a helper Replace()s the token back out, and the assembled
# script/handler is executed. The specific token is per-build; the shape —
# a strip helper whose second argument is one long non-ASCII literal, plus
# an Execute/IEX sink — is the stager.
defaults:
  attack: T1027,T1059.001
  platforms:
    - windows
  for:
    - vbs

traits:
  - id: vbs-strip-helper-long-literal
    desc: Replace strips a long non-ASCII literal
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\w+\s*=\s*Replace\(\w+,\s*"[^"\r\n]{16,}"\s*,\s*""\)'

composite_rules:
  - id: vbs-junk-strip-execute-stager
    desc: Junk separator stripped into an executed script
    crit: hostile
    conf: 0.9
    near_lines: 200
    all:
      - id: vbs-strip-helper-long-literal
      - id: objectives/execution/interpreter/vbscript/wmi::hidden-wmi-process-launch
