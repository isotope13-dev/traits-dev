  - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
  - id: micro-behaviors/fs/write/stream::wsh-savetofile
- id: vbs-msxml-stream-executeglobal
  desc: MSXML Base64 stream feeds ExecuteGlobal
  crit: hostile
  conf: 0.97
  attack: T1027,T1059.005,T1140
  all:
  - id: micro-behaviors/data/codec::msxml-base64-type-and-value
  - id: micro-behaviors/fs/write/stream::adodb-stream-progid
  - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
- id: numeric-array-chr-execute-loader
