  crit: hostile
  conf: 0.96
  attack: T1027,T1059.005
  all:
  - id: micro-behaviors/data/decode/charset::vbs-numeric-array-literal
  - id: micro-behaviors/data/decode/charset::vbs-chr-array-element-minus-key
  - id: micro-behaviors/data/string/conversion::vb-chr-function-reference
  - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
