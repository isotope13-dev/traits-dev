defaults:
  attack: T1059.005
  for:
  - vbs
  platforms:
  - windows
traits:
- id: noop-delay-loop
  desc: No-op loop delay padding
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '(?i)For\s+\w+\s*=\s*\d+\s+To\s+\d+\s*:\s*Next'
- id: split-frombase64string-builder
  desc: Split FromBase64String builder
  crit: suspicious
  conf: 0.9
  attack: T1027
  if:
    type: text
    regex: '(?i)["'']FromBase["'']\s*\+\s*["'']64String\s*\('
- id: split-unicode-decoder-builder
  desc: Split Unicode decoder builder
  crit: suspicious
  conf: 0.9
  attack: T1027
  if:
    type: text
    regex: '(?i)stem\.Text\.Encod["'']\s*&\s*["'']ing|Unicode\.GetSt["'']\s*&\s*["'']ring'
- id: powershell-reverses-decoded-command
  desc: PowerShell reverses decoded command
  crit: suspicious
  conf: 0.9
  attack: T1027
  if:
    type: text
    regex: '(?i)\[-1\.\.-\$[A-Za-z_][A-Za-z0-9_]*\.Length\]\s*-\s*join\s*["'']{2}'
- id: powershell-join-index-range-reversal
  desc: PowerShell -join on descending index range
  crit: suspicious
  conf: 0.9
  attack: T1027
  if:
    type: text
    regex: '(?i)-join\s+\$[A-Za-z_][A-Za-z0-9_]*\[\(\$[A-Za-z_][A-Za-z0-9_]*\.Length-1\)\.\.0\]'
- id: powershell-spaced-char-concat-loop
  desc: PowerShell loop appends one-character substrings
  crit: suspicious
  conf: 0.9
  attack: T1027
  if:
    type: text
    regex: '(?i)\.Substring\(\$[A-Za-z]+,\s*1\);\$[A-Za-z]+=\$[A-Za-z]+\+\$[A-Za-z]+'
- id: powershell-adipiscing-helper-name
  desc: PowerShell Adipiscing spaced-string helper name
  crit: suspicious
  conf: 0.9
  attack: T1027
  if:
    type: text
    regex: (?i)piscing\s*\(\[String\]\$
- id: powershell-split-join-reversal-fragment
  desc: PowerShell -join on split index-range fragment
  crit: suspicious
  conf: 0.88
  attack: T1027
  if:
    type: text
    regex: (?i)\{-join\s+\$[A-Za-z]+\[\(\$[A-Za-z]+\.Le
- id: execute-function-result
  desc: Execute of a function result
  crit: notable
  conf: 0.9
  for: [vbs, text, static-lib]
  if:
    type: text
      # VBScript Execute(decoded). A dotted method (.Execute(request)) is not
      # it, nor an RPC method, nor a comment.
    regex: '(?im)^([^\r\n''#]{0,200}:)?[ \t]*Execute\s*\(\s*[A-Za-z_]\w*\s*\)'
  not:
  - regex: '(?i)\brpc\s+execute\b'
  unless:
  - type: basename
    exact: winrm.vbs
  - id: metadata/file/format/serialization::protobuf-schema-source
  - id: metadata/package/testing/
  - type: text
    regex: '(?m)^package\s+[A-Za-z_]\w*'
  - id: "metadata/file/naming::test-directory-component"
- id: vbs-mod-offset-chr
  desc: Indexes a string in a loop
  crit: suspicious
  conf: 0.92
  for: [vbs, text, static-lib]
  if:
    type: text
    regex: '(?i)for [A-Za-z_]+=1 to len\('
composite_rules:
- id: padded-wsh-hidden-command-loader
  desc: Padded WSH launches a fragmented command hidden
  crit: hostile
  conf: 0.97
  attack: T1027,T1059.005,T1564.003
  for: [vbs, html]
  all:
  - id: objectives/anti-static/obfuscation/string/delimiter::vbs-padded-wscript-shell-progid-chunks
  - id: micro-behaviors/data/string/concat::vbs-many-long-literal-concatenations
  - id: micro-behaviors/data/control-flow/dispatch::run-zero-style-argument
- id: execute-mod-char-decoder
  desc: Executes a modulo character decoder
  crit: hostile
  conf: 0.94
  for: [vbs, text, static-lib]
  all:
  - id: execute-function-result
  - id: vbs-mod-offset-chr
- id: execute-shifted-decoder
  desc: Executes a character-shifted decoder
  crit: hostile
  conf: 0.94
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-function-call
  - id: objectives/anti-static/obfuscation/string/encoding::rotating-character-shift-cipher
- id: obfuscated-msxml-vbs-payload-loader
  desc: Obfuscated VBScript decodes a staged payload through MSXML
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.005,T1140
  for: [vbs, mp3]
  all:
  - id: micro-behaviors/data/property/access::msxml-node-typed-value
  - id: micro-behaviors/os/com/automation::vbs-computed-createobject
  - id: objectives/command-and-control/dropper/staging/encoded/script::vbs-hex-fragment-accumulator

- id: msxml-executeglobal-vbs-loader
  desc: VBScript decodes bytes with MSXML and executes them
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.005,T1140
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
  - id: micro-behaviors/data/property/access::msxml-node-typed-value
  - id: micro-behaviors/os/com/automation::vbs-computed-createobject

- id: array-reconstructed-vbs-stage-loader
  desc: Array-reconstructed VBScript stage loader
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.005
  all:
  - id: micro-behaviors/data/encode/char-code::array-payload-reconstruction
  - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
  - id: objectives/command-and-control/dropper/file-exec/command/script-host-download::wsh-high-byte-obfuscated-script
- id: xor-decoded-dynamic-exec-loader
  desc: XOR-decoded VBScript dynamic loader
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/data/encode/char-code::xor-array-payload-reconstruction
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
  - id: micro-behaviors/process/interpreter/eval/direct::validated-vbs-execute-statement
  - id: micro-behaviors/process/interpreter/eval/direct::eval-identifier-call-text
- id: xor-decoded-executeglobal-loader
  desc: XOR-decoded VBScript eval loader
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/data/encode/char-code::xor-array-payload-reconstruction
  - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
  any:
  - id: micro-behaviors/data/encode/char-code::dense-chr-construction
  - id: noop-delay-loop
- id: xor-decoded-wsh-stage-loader
  desc: XOR-decoded VBScript WSH stage loader
  crit: suspicious
  conf: 0.97
  all:
  - id: xor-decoded-dynamic-exec-loader
  any:
  - id: micro-behaviors/os/com/automation::wscript-createobject-call
  - id: micro-behaviors/process/create/exec::wsh-progid-near-run
  - id: micro-behaviors/communications/http/client/xmlhttp::xmlhttp-object
  - id: micro-behaviors/fs/write/file/stream::adodb-stream
  # Hostile: ExecuteGlobal of a runtime-built variable is dynamic code execution
  # with no benign use once paired with an obfuscation technique that hides the
  # payload from static analysis. Each composite pairs that dynamic-exec sink
  # with a distinct obfuscation technique, so a loader using any one technique is
  # caught and multi-technique loaders surface multiple independent hostile
  # signals. The XOR composites above stay suspicious; these target the
  # non-XOR string-reassembly loaders (e.g. Array() lookup-table deobfuscators).
- id: obfuscated-vbs-executeglobal-loader
  desc: Obfuscated VBScript ExecuteGlobal loader (line bloat)
  crit: hostile
  conf: 0.9
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
  - id: metadata/file/line::vbs-long-average-lines
- id: chr-built-vbs-executeglobal-loader
  desc: Char-reconstructed VBScript ExecuteGlobal loader
  crit: hostile
  conf: 0.9
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
  - id: micro-behaviors/data/encode/char-code::dense-chr-construction
- id: chr-built-vbs-execute-loader
  desc: Char-reconstructed VBScript Execute loader
  crit: hostile
  conf: 0.92
  attack: T1027,T1059.005
  for: [vbs, html]
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
  - id: micro-behaviors/data/encode/char-code::dense-chr-construction
  # Sibling of the dense-Chr composite above for the indirection variant:
  # the payload hides behind a helper that returns Chr() of its argument,
  # so no bare Chr() call appears at the obfuscated use site.
- id: wrapped-chr-vbs-executeglobal-loader
  desc: Chr-wrapper-hidden VBScript ExecuteGlobal loader
  crit: hostile
  conf: 0.9
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
  - id: micro-behaviors/data/encode/char-code::chr-wrapper-function
- id: array-table-vbs-executeglobal-loader
  desc: Array-table-deobfuscated VBScript ExecuteGlobal loader
  crit: hostile
  conf: 0.9
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
  - id: metadata/lang/source/syntax::vbs-many-array-call-syntax
- id: xor-decoded-vbs-executeglobal-loader
  desc: XOR-modulo decoded VBScript ExecuteGlobal loader
  crit: hostile
  conf: 0.96
  attack: T1027,T1059.005
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
  - id: objectives/command-and-control/dropper/file-exec/command/script-host-download::wsh-vbs-xor-modulo-key
  # Numeric-table variant (Emotet epoch shape): the stage hides as dividable
  # codes decoded with chr(Clng(cell) / N) and the result feeds Execute.
  # Unlike the ExecuteGlobal loaders above, the sink here is the Execute
  # statement calling a function on the rebuilt stage.
- id: arithmetic-decoded-vbs-execute-loader
  desc: Division-decoded VBScript Execute loader
  crit: hostile
  conf: 0.94
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-function-call
  - id: micro-behaviors/data/encode/char-code::chr-division-decoder
  - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
  # Multi-round XOR-subtraction cipher (`(N - (A Xor B)) Mod 256`): the
  # decoded stage lands in a variable that ExecuteGlobal runs, and every
  # name in the file is machine-generated to frustrate static analysis.
- id: xor-sub-mod-decoded-vbs-loader
  desc: XOR-subtracted stage executed from generated names
  crit: hostile
  conf: 0.94
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
  - id: objectives/command-and-control/dropper/file-exec/command/script-host-download::wsh-vbs-xor-modulo-key
  - id: objectives/anti-static/obfuscation/name-mangling/variables::vbs-generated-identifiers
- id: reversed-base64-vbs-stage-loader
  desc: Reversed Base64 VBScript stage loader
  crit: hostile
  conf: 0.96
  attack: T1027
  all:
  - id: split-frombase64string-builder
  - id: split-unicode-decoder-builder
  - id: powershell-reverses-decoded-command
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
  - id: micro-behaviors/process/interpreter/eval/direct::validated-vbs-execute-statement
  - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
- id: hidden-vbs-powershell-base64-loader
  desc: Hidden VBScript PowerShell Base64 loader
  crit: hostile
  conf: 0.98
  attack: T1059.001
  all:
  - id: objectives/execution/interpreter/vbscript/interpreter::vbs-split-powershell-launch
  - id: split-frombase64string-builder
  - id: split-unicode-decoder-builder
  - id: powershell-reverses-decoded-command
  - id: micro-behaviors/process/create/hidden::wscript-shell-hidden-run
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
  - id: micro-behaviors/process/interpreter/eval/direct::validated-vbs-execute-statement
  - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
- id: msxml-xor-executeglobal-vbs-stage
  desc: VBScript decodes an MSXML payload with XOR and executes it dynamically
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.005,T1105
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
  - id: objectives/command-and-control/dropper/file-exec/command/script-host-download::wsh-vbs-repeating-key-xor-loop
  - id: micro-behaviors/data/codec::msxml-datatype-bin-base64
- id: delayed-msxml-executeglobal-vbs-loader
  desc: Delayed VBScript MSXML dynamic-code loader
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.005
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
  - id: micro-behaviors/data/parse/xml::msxml-domdocument-progid
  - id: noop-delay-loop

- id: obfuscated-vbs-execute-variable-loader
  desc: Generated-name VBScript Execute loader
  crit: hostile
  conf: 0.96
  attack: T1027,T1059.005
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
  - id: objectives/anti-static/obfuscation/name-mangling/variables::vbs-generated-identifiers
  any:
  - id: micro-behaviors/process/create/exec::wsh-reference-near-variable-call
  - id: objectives/anti-static/obfuscation/string/concat::vbs-createobject-concat
  - id: objectives/anti-static/obfuscation/wsh::vbs-split-mid-chrw-decoder
  - id: micro-behaviors/data/string/conversion::vbs-mid-chrw-cooccurrence

- id: padded-reversed-powershell-vbs-loader
  desc: Padded VBScript reversed PowerShell loader
  crit: hostile
  conf: 0.97
  attack: T1027,T1059.001
  all:
  - id: powershell-reverses-decoded-command
  - id: objectives/anti-static/obfuscation/name-mangling/variables::vbs-generated-identifiers
  any:
  - id: objectives/evasion/anti-av/code-padding::dense-message-box-padding
  - id: objectives/evasion/anti-av/code-padding::empty-vb-statement-separator-padding

- id: hidden-reversed-powershell-vbs-runner
  desc: Hidden WSH runs reversed PowerShell
  crit: hostile
  conf: 0.97
  attack: T1027,T1059.001,T1564.003
  all:
