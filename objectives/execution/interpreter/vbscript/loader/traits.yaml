  - id: micro-behaviors/process/create/shell/wsh::wsh-run-paren-hidden-false
  - id: micro-behaviors/os/com/automation::wscript-shell-literal

- id: junk-padded-vbs-process-env-hidden-run
  desc: Junk-padded VBScript process env staging hidden run
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.005,T1564.003
  all:
  - id: micro-behaviors/data/string/concat::vbs-many-long-literal-concatenations
  - id: micro-behaviors/os/env/read::wsh-environment-object
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: micro-behaviors/data/control-flow/dispatch::run-zero-style-argument

- id: generated-vbs-variable-run-loader
  desc: Generated-name WSH runs a variable
  crit: hostile
  conf: 0.95
  attack: T1027,T1059.005
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
  - id: objectives/anti-static/obfuscation/name-mangling/variables::vbs-generated-identifiers
  - id: micro-behaviors/process/create/exec::wsh-reference-near-variable-call

- id: chr-concat-savetofile-dropper
  desc: Chr-built strings written then launched
  crit: hostile
  conf: 0.96
  for: [vbs, text]
  all:
  - id: micro-behaviors/data/encode/char-code::chr-plus-concat
  - id: micro-behaviors/fs/write/file/stream::savetofile-method-token

- id: chr-concat-wsh-run-dropper
  desc: Chr-built strings launched via WSH Run
  crit: hostile
  conf: 0.95
  for: [vbs, text]
  all:
  - id: micro-behaviors/data/encode/char-code::chr-plus-concat
  - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-statement

- id: chr-savetofile-wsh-run
  desc: Chr dropper saves then runs a payload
  crit: hostile
  conf: 0.97
  for: [vbs, text]
  all:
  - id: micro-behaviors/data/encode/char-code::chr-plus-concat
  - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
  - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-statement

  # HTML embeds the same VBScript loader, and the SaveToFile call is a
  # lowercase statement. The dotted WSH matcher already folds that case.
- id: vbs-fragment-savetofile-shellexecute
  desc: Fragmented script saves then launches
  crit: hostile
  conf: 0.97
  for: [vbs, html]
  near_lines: 40
  all:
  - id: objectives/anti-static/obfuscation/string/concat::vbs-amp-fragment-concat
  - id: micro-behaviors/process/create/shellexec::shellexecute-method-call
