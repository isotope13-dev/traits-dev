defaults:
  attack: T1059.005
  for:
    - vbs
  platforms:
    - windows
traits:
  - id: executeglobal-variable
    desc: ExecuteGlobal on variable
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bExecuteGlobal\s*(\(\s*)?[A-Za-z_]\w*\b'
  - id: execute-variable-sink
    desc: Execute statement on variable
    crit: suspicious
    conf: 0.92
    for: [vbs, html, scala]
    if:
      type: text
      # A line of prose ("execute permission") is not the VBScript statement.
      regex: '^[ \t]*Execute\b\s*(\(\s*[A-Za-z_]\w*|[A-Za-z_]\w*\s*$)'
      case_insensitive: true
    unless:
      - type: basename
        exact: Packages.db
      - id: metadata/build/bundler/vscode::javascript-source-map-file
      - id: well-known/app/communication/thunderbird::firefox-omni-runtime-path
      - id: well-known/tool/offensive/nmap::nmap-source-tree
  - id: eval-variable
    desc: Eval on decoded variable
    crit: notable
    conf: 0.88
    for: [vbs, html]
    if:
      type: text
      regex: '(?i)\bEval\s*\(\s*\w+\s*\)'
  - id: noop-delay-loop
    desc: No-op loop delay padding
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)For\s+\w+\s*=\s*\d+\s+To\s+\d+\s*:\s*Next'
  - id: array-table-obfuscation
    desc: Many Array() lookup tables (obfuscation)
    crit: notable
    conf: 0.85
    count_min: 8
    if:
      type: text
      regex: '(?i)\bArray\s*\('
    unless:
      # JavaScript source maps may be classified as VBS by an archive-member
      # path; their embedded JavaScript arrays are not VBScript obfuscation.
      - id: metadata/file/format/structured::sourcemap-sources-content
  - id: split-frombase64string-builder
    desc: Split FromBase64String builder
    crit: suspicious
    conf: 0.9
    attack: T1027
    if:
      type: text
      regex: '(?i)["'']FromBase["'']\s*\+\s*["'']64String\s*\('
  - id: split-unicode-decoder-builder
    desc: Split Unicode decoder builder
    crit: suspicious
    conf: 0.9
    attack: T1027
    if:
      type: text
      regex: '(?i)stem\.Text\.Encod["'']\s*&\s*["'']ing|Unicode\.GetSt["'']\s*&\s*["'']ring'
  - id: powershell-reverses-decoded-command
    desc: PowerShell reverses decoded command
    crit: suspicious
    conf: 0.9
    attack: T1027
    if:
      type: text
      regex: '(?i)\[-1\.\.-\$[A-Za-z_][A-Za-z0-9_]*\.Length\]\s*-\s*join\s*["'']{2}'
  - id: vbs-amp-fragment-concat
    desc: VBScript joins short string fragments
    crit: suspicious
    conf: 0.9
    for: [vbs, html, ruby]
    count_min: 6
    if:
      type: text
      regex: '(?i)["''][A-Za-z0-9.]{1,4}["'']\s*&\s*["''][A-Za-z0-9.]{1,4}["'']'
  - id: vbs-savetofile-call
    desc: Writes a stream with SaveToFile
    crit: notable
    conf: 0.92
    for: [vbs, html, ruby]
    if:
      type: text
      regex: '(?i)\.savetofile\b'
composite_rules:
  - id: obfuscated-msxml-vbs-payload-loader
    desc: Obfuscated VBScript decodes a staged payload through MSXML
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.005,T1140
    for: [vbs, mp3]
    all:
      - id: micro-behaviors/data/decode/base64::msxml-node-typed-value
      - id: objectives/anti-static/obfuscation/wsh::vbs-createobject-variable-arg
      - id: objectives/command-and-control/dropper/execution/wsh-reconstruct::vbs-hex-fragment-accumulator

  - id: msxml-executeglobal-vbs-loader
    desc: VBScript decodes bytes with MSXML and executes them
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.005,T1140
    all:
      - id: executeglobal-variable
      - id: micro-behaviors/data/decode/base64::msxml-node-typed-value
      - id: objectives/anti-static/obfuscation/wsh::vbs-createobject-variable-arg

  - id: execute-variable
    desc: VBScript Execute on variable
    crit: suspicious
    conf: 0.92
    all:
      - id: execute-variable-sink
      - id: metadata/lang/scripted::vbscript-valid

  - id: html-embedded-vbs-hex-execute
    desc: HTML embeds VBScript hex decode then Execute
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.005
    for: [html, vbs]
    all:
      - id: execute-variable-sink
      - id: micro-behaviors/data/decode/hex::vbscript-ampersand-h-left-pair

  - id: html-embedded-vbs-hex-eval
    desc: HTML hex-decodes a stage then evals it
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.005,T1059.007
    for: [html, vbs]
    all:
      - id: execute-variable-sink
      - id: micro-behaviors/data/decode/hex::vbscript-ampersand-h-left-pair
      - id: eval-variable


  - id: stride-decoded-registry-wsh-loader
    desc: Registry-aware WSH executes a stride-decoded stage
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.005
    all:
      - id: micro-behaviors/data/decode/custom::fixed-stride-character-decoder
      - id: execute-variable
      - id: micro-behaviors/os/com/object::wscript-shell-literal
      - id: micro-behaviors/os/registry/read::wscript-regread

  # GuLoader-class VBS rebuilds a stage by walking a padded string at a
  # fixed stride, then Execute()s it through WScript.Shell. Unlike the
  # registry sibling, this shape never touches RegRead.
  - id: stride-decoded-wsh-execute-loader
    desc: WSH executes a stride-decoded stage
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.005
    all:
      - id: micro-behaviors/data/decode/custom::fixed-stride-character-decoder
      - id: execute-variable
      - id: micro-behaviors/os/com/object::wscript-shell-literal

  - id: array-reconstructed-vbs-stage-loader
    desc: Array-reconstructed VBScript stage loader
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.005
    all:
      - id: micro-behaviors/data/encode/char-code::array-payload-reconstruction
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
      - id: objectives/command-and-control/dropper/execution/wsh::wsh-high-byte-obfuscated-script
  - id: xor-decoded-dynamic-exec-loader
    desc: XOR-decoded VBScript dynamic loader
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/data/encode/char-code::xor-array-payload-reconstruction
    any:
      - id: executeglobal-variable
      - id: execute-variable
      - id: eval-variable
  - id: xor-decoded-executeglobal-loader
    desc: XOR-decoded VBScript eval loader
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/data/encode/char-code::xor-array-payload-reconstruction
      - id: executeglobal-variable
    any:
      - id: micro-behaviors/data/encode/char-code::dense-chr-construction
      - id: noop-delay-loop
  - id: xor-decoded-wsh-stage-loader
    desc: XOR-decoded VBScript WSH stage loader
    crit: suspicious
    conf: 0.97
    all:
      - id: xor-decoded-dynamic-exec-loader
    any:
      - id: micro-behaviors/os/com/object::wscript-createobject-call
      - id: micro-behaviors/process/create/shell/script-host::wscript-shell-run-create
      - id: micro-behaviors/communications/http/client/vba::xmlhttp-object
      - id: micro-behaviors/fs/write/file/stream::adodb-stream
  # Hostile: ExecuteGlobal of a runtime-built variable is dynamic code execution
  # with no benign use once paired with an obfuscation technique that hides the
  # payload from static analysis. Each composite pairs that dynamic-exec sink
  # with a distinct obfuscation technique, so a loader using any one technique is
  # caught and multi-technique loaders surface multiple independent hostile
  # signals. The XOR composites above stay suspicious; these target the
  # non-XOR string-reassembly loaders (e.g. Array() lookup-table deobfuscators).
  - id: obfuscated-vbs-executeglobal-loader
    desc: Obfuscated VBScript ExecuteGlobal loader (line bloat)
    crit: hostile
    conf: 0.9
    all:
      - id: executeglobal-variable
      - id: objectives/anti-static/obfuscation/string/fragmentation::script-host-line-bloat
  - id: chr-built-vbs-executeglobal-loader
    desc: Char-reconstructed VBScript ExecuteGlobal loader
    crit: hostile
    conf: 0.9
    all:
      - id: executeglobal-variable
      - id: micro-behaviors/data/encode/char-code::dense-chr-construction
  - id: array-table-vbs-executeglobal-loader
    desc: Array-table-deobfuscated VBScript ExecuteGlobal loader
    crit: hostile
    conf: 0.9
    all:
      - id: executeglobal-variable
      - id: array-table-obfuscation
  - id: reversed-base64-vbs-stage-loader
    desc: Reversed Base64 VBScript stage loader
    crit: hostile
    conf: 0.96
    attack: T1027
    all:
      - id: split-frombase64string-builder
      - id: split-unicode-decoder-builder
      - id: powershell-reverses-decoded-command
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
      - id: execute-variable
      - id: executeglobal-variable
  - id: hidden-vbs-powershell-base64-loader
    desc: Hidden VBScript PowerShell Base64 loader
    crit: hostile
    conf: 0.98
    attack: T1059.001
    all:
      - id: objectives/execution/interpreter/vbscript/interpreter::vbs-split-powershell-launch
      - id: split-frombase64string-builder
      - id: split-unicode-decoder-builder
      - id: powershell-reverses-decoded-command
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-hidden-run
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
      - id: execute-variable
      - id: executeglobal-variable
  - id: msxml-xor-executeglobal-vbs-stage
    desc: VBScript decodes an MSXML payload with XOR and executes it dynamically
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.005,T1105
    all:
      - id: executeglobal-variable
      - id: objectives/command-and-control/dropper/execution/wsh::wsh-vbs-repeating-key-xor-loop
      - id: micro-behaviors/data/decode/base64::msxml-datatype-bin-base64
  - id: delayed-msxml-executeglobal-vbs-loader
    desc: Delayed VBScript MSXML dynamic-code loader
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.005
    all:
      - id: executeglobal-variable
      - id: micro-behaviors/os/com/object::msxml-domdocument-progid
      - id: noop-delay-loop

  - id: obfuscated-vbs-execute-variable-loader
    desc: Generated-name VBScript Execute loader
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.005
    all:
      - id: execute-variable-sink
      - id: objectives/anti-static/obfuscation/name-mangling/variables::vbs-generated-identifiers
    any:
      - id: objectives/command-and-control/dropper/execution/wsh::wsh-variable-run-call
      - id: objectives/anti-static/obfuscation/string/concat::vbs-createobject-concat
      - id: objectives/anti-static/obfuscation/wsh::vbs-split-mid-chrw-decoder
      - id: objectives/anti-static/obfuscation/wsh::vbs-mid-chrw-decoder-step

  - id: padded-reversed-powershell-vbs-loader
    desc: Padded VBScript reversed PowerShell loader
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.001
    all:
      - id: powershell-reverses-decoded-command
      - id: objectives/anti-static/obfuscation/name-mangling/variables::vbs-generated-identifiers
    any:
      - id: objectives/evasion/anti-av/code-padding::dense-message-box-padding
      - id: objectives/evasion/anti-av/code-padding::empty-vb-statement-separator-padding

  - id: hidden-reversed-powershell-vbs-runner
    desc: Hidden WSH runs reversed PowerShell
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.001,T1564.003
    all:
      - id: powershell-reverses-decoded-command
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-paren-hidden-false
      - id: micro-behaviors/os/com/object::wscript-shell-literal

  - id: junk-appended-vbs-execute-loader
    desc: Junk-appended VBScript Execute loader
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.005
    all:
      - id: execute-variable-sink
      - id: objectives/anti-static/obfuscation/string/junking::dense-variable-string-appends

  - id: generated-vbs-variable-run-loader
    desc: Generated-name WSH runs a variable
    crit: hostile
    conf: 0.95
    attack: T1027,T1059.005
    all:
      - id: execute-variable-sink
      - id: objectives/anti-static/obfuscation/name-mangling/variables::vbs-generated-identifiers
      - id: objectives/command-and-control/dropper/execution/wsh::wsh-variable-run-call

  - id: chr-concat-savetofile-dropper
    desc: Chr-built strings written then launched
    crit: hostile
    conf: 0.96
    for: [vbs, text]
    all:
      - id: micro-behaviors/data/encode/char-code::chr-plus-concat
      - id: micro-behaviors/fs/write/file/stream::savetofile-method-token

  - id: chr-concat-wsh-run-dropper
    desc: Chr-built strings launched via WSH Run
    crit: hostile
    conf: 0.95
    for: [vbs, text]
    all:
      - id: micro-behaviors/data/encode/char-code::chr-plus-concat
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-statement

  - id: chr-savetofile-wsh-run
    desc: Chr dropper saves then runs a payload
    crit: hostile
    conf: 0.97
    for: [vbs, text]
    all:
      - id: micro-behaviors/data/encode/char-code::chr-plus-concat
      - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-statement

  - id: vbs-fragment-savetofile-shellexecute
    desc: Fragmented script saves then launches
    crit: hostile
    conf: 0.97
    for: [vbs, html, ruby]
    near_lines: 40
    all:
      - id: vbs-amp-fragment-concat
      - id: vbs-savetofile-call
      - id: micro-behaviors/process/create/shell/wsh::shellexecute-method-call
