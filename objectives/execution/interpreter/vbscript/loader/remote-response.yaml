# The whole script is six lines: fetch a URL, read the response body, run it.
#
# Nothing is stored, nothing is decoded, and the file contains no payload to
# find -- what runs on the host is whatever the paste was serving that minute.
# It is the cheapest stager there is, and the only durable thing about it is
# the shape: a response body reaching an evaluator with no step in between.
#
# The transport is deliberately a loose leg. MSXML2.ServerXMLHTTP, WinHttp,
# XMLHTTP and MSXML2.XMLHTTP are interchangeable here, and a variant that
# switches one for another changes nothing about what the script does.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1059.005,T1105
  mbc: E1059.005

composite_rules:
  # The URL moniker is assembled from "sC" + "ri" + "pt:ht" + "tp" +
  # "s://" and passed to GetObject through the same runtime variable. The
  # two split-scheme atoms plus the variable call distinguish remote script
  # loading from a loose URL string or unrelated GetObject call.
  - id: vbs-obfuscated-script-url-moniker-execution
    desc: Runs split remote script URL via GetObject
    crit: hostile
    conf: 0.93
    attack: T1027,T1059.005,T1105
    all:
      - id: objectives/anti-static/obfuscation/string/fragmentation::wsh-getobject-split-scheme-profile
      - id: objectives/anti-static/obfuscation/string/fragmentation::split-moniker-scheme-seam
      - id: objectives/anti-static/obfuscation/string/fragmentation::split-scheme-separator-fragment
    near_bytes: 256

  # Inline concatenation twin of vbs-obfuscated-script-url-moniker-execution:
  # the script constructs the remote scriptlet URL directly inside GetObject(...)
  # using string concatenation across the scheme separator.
  - id: vbs-concat-script-url-moniker-execution
    desc: Runs concatenated scriptlet URL via GetObject
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.005,T1105
    for: [vbs, text]
    all:
      - id: micro-behaviors/os/com/automation::getobject-concat-url-clue
      - id: objectives/anti-static/obfuscation/string/fragmentation::split-scheme-separator-fragment


  # Generated identifiers and paste hosting are separate corroborating clues.
  - id: generated-name-vbs-paste-stager
    desc: Machine-named VBScript stages from a paste site
    crit: hostile
    conf: 0.95
    attack: T1027,T1102.001
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/variables::vbs-generated-identifiers
      - id: objectives/command-and-control/infrastructure/paste/
    unless:
      - id: well-known/tool/detection/
