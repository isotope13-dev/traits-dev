# The whole script is six lines: fetch a URL, read the response body, run it.
#
# Nothing is stored, nothing is decoded, and the file contains no payload to
# find -- what runs on the host is whatever the paste was serving that minute.
# It is the cheapest stager there is, and the only durable thing about it is
# the shape: a response body reaching an evaluator with no step in between.
#
# The transport is deliberately a loose leg. MSXML2.ServerXMLHTTP, WinHttp,
# XMLHTTP and MSXML2.XMLHTTP are interchangeable here, and a variant that
# switches one for another changes nothing about what the script does.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1059.005,T1105
  mbc: E1059.005

composite_rules:
  - id: vbs-remote-response-executeglobal
    desc: Runs an HTTP response body as VBScript
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: objectives/execution/interpreter/vbscript/loader::executeglobal-variable
    any:
      - id: micro-behaviors/communications/http/client/xmlhttp::http-client-msxml-serverxmlhttp-progid
      - id: objectives/collection/file-targeting/remote-list::vbs-http-get

  # The same dropper read from the other direction: not "what does it do with
  # the response" but "who wrote this file and where does it fetch from".
  #
  # `vbs-remote-response-executeglobal` above convicts on the execution path,
  # which a variant evades by reaching the interpreter some other way -- a
  # `.Run` through WScript.Shell, a scheduled task, a registry stage. What it
  # keeps is the two things that are not about execution at all: every
  # identifier regenerated per build so the campaign shares no string, and a
  # paste service standing in for infrastructure the operator would otherwise
  # have to register and keep up.
  #
  # Neither leg is about the other, which is the point. A script that is
  # entirely machine-named has no legitimate reading; a script that fetches
  # from a paste site might be a lazy configuration loader. Together they are
  # a staged payload with disposable hosting.
  - id: generated-name-vbs-paste-stager
    desc: Machine-named VBScript stages from a paste site
    crit: hostile
    conf: 0.95
    attack: T1027,T1102.001
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/variables::vbs-generated-identifiers
      - id: objectives/command-and-control/infrastructure/paste/
    unless:
      - id: well-known/tool/detection/
