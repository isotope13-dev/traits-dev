defaults:
  platforms: [windows]
  for: [vbs, html]

composite_rules:
  - id: hta-msxml-executeglobal-profile
    for: [vbs]
    desc: Hidden HTA with MSXML and ExecuteGlobal
    crit: suspicious
    conf: 0.99
    attack: T1059.005,T1218.005
    all:
      - id: micro-behaviors/ui/window/control::hta-hidden-or-minimized-window-request
      - id: micro-behaviors/data/property/access::msxml-node-typed-value
      - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
