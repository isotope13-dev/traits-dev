defaults:
  platforms: [windows]
  for: [oledoc]
  attack: T1204.002

traits:
  - id: ole-package-dangerous-clsid
    desc: OLE Package embedded executable class
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: office.dangerous_clsids[*].clsid
      exact: "0003000c-0000-0000-c000-000000000046"

  - id: ole-package-start-command
    desc: OLE Package launches command via start.exe
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bstart(\.exe)?\s+/[a-z]'

composite_rules:
  - id: ole-package-shell-execution
    desc: OLE Package launches command line
    crit: hostile
    conf: 0.98
    attack: T1204.002,T1059
    all:
      - id: ole-package-dangerous-clsid
      - id: ole-package-start-command
