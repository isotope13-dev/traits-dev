defaults:
  platforms: [unix, windows]
  for: [xml]
  attack: T1059.004
  mbc: E1203

traits:
  - id: xml-processbuilder-bean-start
    desc: XML bean starts ProcessBuilder
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '<bean[^>]{1,160}java\.lang\.ProcessBuilder[^>]{1,160}init-method\s*=\s*["'']start["'']'

  - id: xml-windows-command-argv
    desc: XML bean supplies cmd.exe command arguments
    crit: notable
    conf: 0.97
    platforms: [windows]
    if:
      type: text
      regex: '<value>\s*cmd\.exe\s*</value>[\s\S]{0,100}<value>\s*/c\s*</value>'

  - id: xml-windows-staged-exec
    desc: XML command starts a staged Windows path
    crit: notable
    conf: 0.98
    platforms: [windows]
    if:
      type: text
      regex: '<value>[^<]{0,240}start\s+[A-Za-z]:\\'

  - id: xml-spring-beans-namespace
    desc: Spring beans XML namespace
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '<beans\b[^>]{0,240}xmlns\s*=\s*["'']https?://www\.springframework\.org/schema/beans["'']'

  - id: xml-spel-java-reflection
    desc: SpEL invokes Java reflection
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '#\{[^\r\n}]{0,320}(getClass\s*\(\)|\.forName\s*\()'

  - id: xml-spel-script-engine
    desc: SpEL references a Java script engine
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '#\{[^\r\n}]{0,320}(ScriptEngineManager|javax\.script)'

  - id: xml-spel-eval-call
    desc: SpEL invokes a script evaluation method
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '#\{[^\r\n}]{0,320}(getEngineByName|\.eval\s*\()'

  - id: xml-spel-file-writer
    desc: SpEL invokes Java FileWriter
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '#\{[^\r\n}]{0,320}java\.io\.FileWriter'

  - id: xml-spel-processbuilder
    desc: SpEL invokes Java ProcessBuilder
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '#\{[^\r\n}]{0,320}java\.lang\.ProcessBuilder'

  - id: xml-spel-runtime-exec
    desc: SpEL invokes Java runtime execution
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '#\{[^\r\n}]{0,320}(java\.lang\.Runtime|\.exec\s*\(|\.start\s*\()'

  - id: xml-shell-command-argv
    desc: XML bean supplies shell command arguments
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '<value>\s*(sh|bash)\s*</value>[\s\S]{0,100}<value>\s*-c\s*</value>'

  - id: xml-shell-remote-fetch
    desc: XML value contains curl or wget fetch
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '<value>.{0,120}(curl|wget).{0,120}https?://.{1,120}</value>'

  - id: xml-shell-world-writable-mode
    desc: XML value contains chmod 777 command
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '<value>.{0,120}\bchmod\s+0?777\s+.{1,80}</value>'

  - id: xml-shell-local-binary-exec
    desc: XML value contains local binary invocation
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '<value>.{0,120}\./[A-Za-z0-9._-]{2,40}(\s|<|;)'

  # WebLogic WorkContext payloads use XMLDecoder's `java` bean element rather
  # than the Spring `<bean>` shape covered below.  The decoder alone is dual
  # use; the hostile composites require it to construct ProcessBuilder and a
  # shell command that retrieves a remote stage.
  - id: xml-workcontext-decoder
    desc: XMLDecoder Java bean in an XML document
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '<java\b[^>]{0,240}\bclass\s*=\s*["'']java\.beans\.XMLDecoder["'']'
  - id: xml-workcontext-processbuilder
    desc: XMLDecoder constructs Java ProcessBuilder
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '<void\b[^>]{0,240}\bclass\s*=\s*["'']java\.lang\.ProcessBuilder["'']'
  - id: xml-workcontext-shell-argv
    desc: XMLDecoder supplies a shell and command argument
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '<string>\s*(/usr/bin/|/bin/)?(ba)?sh\s*</string>[\s\S]{0,180}<string>\s*-c\s*</string>'
  - id: xml-workcontext-downloader-fallback
    desc: XMLDecoder downloader fallback
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '<string>[^<]{0,160}\bcurl\b[^<]{0,100}\|\|\s*wget\b'
  - id: xml-workcontext-wget-lwp-fallback
    desc: XMLDecoder wget-lwp fallback
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '<string>[^<]{0,180}\bwget\b[^<]{0,120}\|\|\s*lwp-download\b'

composite_rules:
  - id: spring-xml-shell-execution
    desc: Spring XML launches shell command
    crit: suspicious
    conf: 0.98
    all:
      - id: xml-processbuilder-bean-start
      - id: xml-shell-command-argv

  - id: spring-xml-spel-script-evaluation
    desc: Spring XML SpEL evaluates a script engine
    crit: suspicious
    conf: 0.99
    all:
      - id: xml-spel-script-engine
      - id: xml-spel-eval-call
    near_bytes: 700

  - id: spring-xml-spel-native-execution
    desc: Spring XML SpEL executes Java functionality
    crit: hostile
    conf: 0.99
    attack: T1059.007
    all:
      - id: xml-spring-beans-namespace
      - id: xml-spel-java-reflection
      - id: spring-xml-spel-script-evaluation
    any:
      - id: xml-spel-file-writer
      - id: xml-spel-processbuilder
      - id: xml-spel-runtime-exec
    near_bytes: 1200

  - id: spring-xml-windows-remote-dropper
    desc: Spring XML downloads a payload through cmd.exe
    crit: hostile
    conf: 0.99
    platforms: [windows]
    attack: T1059.003,T1105
    all:
      - id: xml-processbuilder-bean-start
      - id: xml-windows-command-argv
      - id: xml-shell-remote-fetch
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
    near_bytes: 700

  - id: spring-xml-windows-staged-execution
    desc: Spring XML starts a staged Windows payload
    crit: hostile
    conf: 0.99
    platforms: [windows]
    attack: T1059.003,T1105
    all:
      - id: xml-processbuilder-bean-start
      - id: xml-windows-command-argv
      - id: xml-shell-remote-fetch
      - id: xml-windows-staged-exec
    near_bytes: 700

  - id: spring-xml-remote-native-dropper
    desc: Spring XML downloads and executes native payload
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1105,T1222.002
    all:
      - id: spring-xml-shell-execution
      - id: xml-shell-remote-fetch
      - id: xml-shell-world-writable-mode
      - id: xml-shell-local-binary-exec
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
    near_bytes: 280

  - id: weblogic-workcontext-shell-rce
    desc: XMLDecoder WorkContext shell launch
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1190
    all:
      - id: xml-workcontext-decoder
      - id: xml-workcontext-processbuilder
      - id: xml-workcontext-shell-argv
    any:
      - id: xml-workcontext-downloader-fallback
    near_bytes: 2400

  - id: weblogic-workcontext-raw-ip-stager
    desc: XMLDecoder WorkContext raw-IP fallback
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1105,T1190
    all:
      - id: weblogic-workcontext-shell-rce
      - id: xml-workcontext-downloader-fallback
      - id: xml-workcontext-wget-lwp-fallback
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
    near_bytes: 2400
