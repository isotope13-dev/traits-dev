defaults:
  platforms: [windows]
  for: [oledoc, ooxml]
  attack: T1059.005

traits:
  - id: wordbasic-shell-statement
    desc: WordBasic Shell statement opcode
    crit: notable
    conf: 0.92
    for: [oledoc]
    if:
      type: hex
      pattern: 67 2D 80

composite_rules:
  - id: auto-open-vba-process-execution
    desc: Auto-open VBA process execution
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/create/macro/autoexec::raw-auto-open-entrypoint
      - id: micro-behaviors/process/create/macro/office::vba-windows-shell-run

  - id: wordbasic-shell-format-execution
    desc: WordBasic document executes drive format shell
    crit: hostile
    conf: 0.98
    for: [oledoc]
    all:
      - id: wordbasic-shell-statement
      - id: objectives/impact/wipe/disk/format::piped-format-drive-confirmation
