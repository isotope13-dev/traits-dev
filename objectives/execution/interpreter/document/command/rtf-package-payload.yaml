# OLE Package objects in RTF whose packaged file is itself a program. The
# Package server writes the file to %TEMP% and hands it to the shell when the
# object is activated, so the "document" is a launcher for the payload it
# carries. A packaged PE (DOS stub message in the hex) or a Script-Encoder
# script has no reading-material use inside a document.
defaults:
  platforms: [windows]
  for: [rtf]
  attack: T1204.002

composite_rules:
  - id: rtf-package-object-carries-program
    desc: RTF Package object carries a program
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/document/rtf/properties::rtf-object-package
    any:
      - id: metadata/document/rtf/ole::objdata-hex-dos-stub-message
      - id: metadata/document/rtf/ole::objdata-decoded-dos-stub-message
      - id: metadata/document/rtf/ole::objdata-encoded-vbscript-marker
