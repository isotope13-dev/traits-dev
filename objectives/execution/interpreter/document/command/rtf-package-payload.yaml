# OLE Package objects in RTF whose packaged file is itself a program. The
# Package server writes the file to %TEMP% and hands it to the shell when the
# object is activated, so the "document" is a launcher for the payload it
# carries. A packaged PE (DOS stub message in the hex) or a Script-Encoder
# script has no reading-material use inside a document.
defaults:
  platforms: [windows]
  for: [rtf]
  attack: T1204.002

traits:
  - id: rtf-decoded-wscript-constructor-fragment
    desc: Object data contains a script COM constructor
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Object\([ \t]*"{1,2}(WScript\.She|Scripting\.FileSystemObject)'

  - id: rtf-decoded-vbs-shell-application
    desc: Object data selects Shell.Application
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?im)^\s*set\s+\w+\s*=\s*"Shell\.Application"'

  - id: rtf-decoded-force-closes-word
    desc: Object payload forces Word to close
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\btaskkill\s+/f\s+/im\s+winword\.exe\b'

composite_rules:
  - id: rtf-packaged-html-object-shell-stage
    desc: RTF forces an HTML object update beside a packaged shell stage
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/document/rtf/properties::rtf-object-package
      - id: metadata/document/rtf/ole::rtf-parsed-ole-link-class
      - id: metadata/document/rtf/ole::html-object-control-feature
      - id: metadata/document/rtf/ole::objupdate
      - id: rtf-decoded-vbs-shell-application
      - id: rtf-decoded-force-closes-word

  - id: rtf-auto-links-packaged-wscript-stage
    desc: RTF auto-updates an OLE link beside a packaged WScript stage
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/document/rtf/properties::rtf-object-package
      - id: metadata/document/rtf/ole::rtf-parsed-ole-link-class
      - id: metadata/document/rtf/ole::objautlink
      - id: metadata/document/rtf/ole::objupdate
      - id: rtf-decoded-wscript-constructor-fragment

  - id: rtf-package-object-carries-program
    desc: RTF Package object carries a program
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/document/rtf/properties::rtf-object-package
    any:
      - id: metadata/document/rtf/ole::objdata-hex-dos-stub-message
      - id: metadata/document/rtf/ole::objdata-decoded-dos-stub-message
      - id: metadata/document/rtf/ole::objdata-encoded-vbscript-marker
      - id: metadata/document/rtf/ole::objdata-temp-path-program-name
