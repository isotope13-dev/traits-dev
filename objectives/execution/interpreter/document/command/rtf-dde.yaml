# DDEAUTO command instructions are distinct from OLE URL-moniker exploits
# such as CVE-2017-0199. Each application matcher stays inside one fldinst.
defaults:
  for: [rtf]
  platforms: [windows]
  attack: T1559.002
  crit: suspicious
  conf: 0.98
traits:
  - id: rtf-ddeauto-cmd-instruction
    desc: RTF DDEAUTO invokes the command shell
    if:
      type: raw
      regex: '(?i)\\fldinst[{\s]{1,8}DDEAUTO\s+"?([^{}\s"]{1,80}\\)?cmd(\.exe)?[\s"}]'
  - id: rtf-ddeauto-script-host-instruction
    desc: RTF DDEAUTO invokes a script host
    if:
      type: raw
      regex: '(?i)\\fldinst[{\s]{1,8}DDEAUTO\s+"?([^{}\s"]{1,80}\\)?[wc]script(\.exe)?[\s"}]'
  - id: rtf-ddeauto-powershell-instruction
    desc: RTF DDEAUTO invokes PowerShell
    if:
      type: raw
      regex: '(?i)\\fldinst[{\s]{1,8}DDEAUTO\s+"?([^{}\s"]{1,80}\\)?powershell(\.exe)?[\s"}]'
  - id: rtf-ddeauto-mshta-instruction
    desc: RTF DDEAUTO invokes MSHTA
    if:
      type: raw
      regex: '(?i)\\fldinst[{\s]{1,8}DDEAUTO\s+"?([^{}\s"]{1,80}\\)?mshta(\.exe)?[\s"}]'
  - id: rtf-ddeauto-bitsadmin-instruction
    desc: RTF DDEAUTO invokes BITSAdmin
    if:
      type: raw
      regex: '(?i)\\fldinst[{\s]{1,8}DDEAUTO\s+"?([^{}\s"]{1,80}\\)?bitsadmin(\.exe)?[\s"}]'
composite_rules:
  # Require the executable target inside the DDEAUTO instruction itself.
  # A separate hyperlink must never supply this execution leg.
- id: rtf-ddeauto-shell-execution
  desc: RTF DDEAUTO shell command execution
  crit: hostile
  all:
  - id: metadata/document/rtf/properties::rtf-field-ddeauto
  any:
  - id: rtf-ddeauto-cmd-instruction
  - id: rtf-ddeauto-script-host-instruction
  - id: rtf-ddeauto-powershell-instruction
  - id: rtf-ddeauto-mshta-instruction
  - id: rtf-ddeauto-bitsadmin-instruction
