# Describes an embedded infection kit, not successful document modification.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: embedded-customxml-native-thread-template
    desc: Embedded CustomXML VBA native-thread template
    crit: suspicious
    conf: 0.99
    attack: T1027.009,T1620
    if:
      type: yara
      source: |
        rule ooxml_native_thread_infection_templates {
          strings:
            $trigger = /<customUI[^\r\n]{0,180}onLoad=/
            $source = ".CustomXMLParts"
            $decode = ".nodeTypedValue"
            $copy = /RtlMoveMemory[ \t]+[a-zA-Z_][a-zA-Z0-9_]*,[ \t]*[a-zA-Z_][a-zA-Z0-9_]*\(0\),/
            $protect = /VirtualProtect[ \t]+[a-zA-Z_][a-zA-Z0-9_]*,[ \t]*[a-zA-Z_][a-zA-Z0-9_]*,[ \t]*PAGE_EXECUTE_READ/
            $thread = /CreateThread\(0,[ \t]*0,[ \t]*[a-zA-Z_][a-zA-Z0-9_]*,[ \t]*0,[ \t]*0,/
          condition:
            all of them
        }
