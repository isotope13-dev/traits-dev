# Spring XML whose SpEL defines a Java class from bytes it Base64-decodes in
# the same expression (ReflectUtils/ClassLoader.defineClass over
# Base64Utils/java.util.Base64). Loading the context runs the attacker's
# class: the payload of remote application-context exploits such as ActiveMQ
# CVE-2023-46604. Legitimate SpEL reads properties and calls beans; it does
# not mint classes from inline bytes.
defaults:
  platforms: [unix, windows]
  for: [xml]
  attack: T1059,T1620
  mbc: E1203

traits:
  - id: xml-spel-define-class
    desc: SpEL defines a Java class from bytes
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '#\{[^\r\n}]{0,400}\.defineClass\s*\('

  # Base64 must appear inside the defineClass argument list of the same
  # expression, so a decode elsewhere in the file does not complete it.
  - id: xml-spel-define-class-from-base64
    desc: SpEL defines a class from Base64 bytes
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '#\{[^\r\n}]{0,300}\.defineClass\s*\([^\r\n}]{0,300}(Base64|Decoder\(\))'

composite_rules:
  - id: spring-xml-spel-inline-class-definition
    desc: Spring XML SpEL defines a Base64-decoded class
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/interpreter/document/xml::xml-spring-beans-namespace
      - id: xml-spel-define-class-from-base64
