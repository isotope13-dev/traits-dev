# Excel 4.0 macros (XLM) driven from VBA. XLM predates VBA and Excel still
# runs it, but the sheets that hold it are not part of a modern workbook's
# surface -- so a macro that *builds* one at runtime, writes formulas into its
# cells, and asks Excel to run them is using a second interpreter that most
# document inspection never looks at.
#
# The related shape here is the payload that never appears in code at all: the
# command is spread one character per worksheet cell, gathered by a loop over
# the used range, and handed to `Shell`. The VBA reads as a text-processing
# routine, and the string it assembles exists only in the sheet data.
#
# `for:` includes `vbs` because extracted VBA project source is classified
# that way; the same code inside an intact workbook arrives as oledoc/ooxml.
defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  attack: T1059.005
  mbc: B0032

traits:
  - id: excel4-macro-sheet-creation
    desc: Creates an Excel 4.0 macro sheet
    crit: suspicious
    conf: 0.95
    if:
      # `Excel4MacroSheets.Add(Before:=Worksheets(1)).Name = "feedA"`. A
      # workbook that wants XLM ships the sheet; only a dropper manufactures
      # one after opening.
      type: text
      regex: '(?i)Excel4MacroSheets\s*\.\s*Add'

  - id: xlm-run-cell-address
    desc: Runs a macro at a built address
    crit: suspicious
    conf: 0.92
    if:
      # `Run("" & "C" & 4)` -- Application.Run against an XLM cell reference,
      # with the column letter and row number kept apart so the address never
      # appears as a string.
      type: text
      regex: '(?i)\bRun\s*\(+[^)\n]{0,24}"[A-Z]"\s*&\s*[0-9]'

  - id: xlm-return-formula-assembly
    desc: Assembles an XLM RETURN formula
    crit: suspicious
    conf: 0.92
    if:
      # `"=RE" & mi & "RN()"` builds `=RETURN()`, the XLM statement that ends
      # a macro -- written split so the formula text is not searchable.
      type: text
      regex: '"=RE"\s*&'

  - id: worksheet-hidden-assignment
    desc: Hides the active worksheet at runtime
    crit: suspicious
    conf: 0.85
    attack: T1564
    if:
      # `ActiveSheet.Visible = 0`, and the arithmetic spelling `= 5 - 6 + 1`
      # the same droppers use to keep the constant out of the text.
      type: text
      regex: '(?i)ActiveSheet\s*\.\s*Visible\s*=\s*[0-9]'

  - id: cell-constant-character-harvest
    desc: Harvests characters from worksheet cells
    crit: suspicious
    conf: 0.95
    attack: T1027
    if:
      # `For Each kl In ActiveSheet.UsedRange.SpecialCells(xlCellTypeConstants)`
      # followed by `Mid(kl.Text, 3, 1)` -- one character taken from each
      # populated cell. The payload lives in the spreadsheet, not the code.
      type: text
      regex: '(?is)SpecialCells\s*\(\s*xlCellTypeConstants[\s\S]{0,200}\bMid\s*\('

  - id: vba-hidden-window-shell
    desc: Shell launch with the window hidden
    crit: suspicious
    conf: 0.9
    attack: T1564.003
    if:
      # `Shell@ ((((b))), 0` -- window style 0 is vbHide. The `@` type
      # suffix and the redundant parentheses are noise the droppers add.
      type: text
      regex: '(?i)\bShell\s*@?\s*\(+[^;\n]{0,40}\)+\s*,\s*0\b'

  - id: stored-excel4-macro-sheet
    desc: Workbook holds an Excel 4.0 macro sheet
    for: [oledoc]
    crit: notable
    conf: 0.9
    if:
      # A BOUNDSHEET record declaring sheet type 1. Excel still runs these but
      # has not written one since the 1990s, so a recent workbook carrying one
      # was built by something that wanted the older interpreter.
      type: value
      path: office.features[*]
      exact: xlm_macros

  - id: workbook-auto-open-name
    desc: Workbook defines Auto_Open
    for: [oledoc]
    crit: notable
    conf: 0.9
    attack: T1204.002
    if:
      # The built-in defined name Excel calls the moment the file is opened.
      # Ordinary on a macro-driven workbook; the half that turns a dormant
      # macro sheet into something that runs without being asked.
      type: value
      path: office.features[*]
      exact: auto_open

  - id: very-hidden-worksheet
    desc: Workbook has a very hidden sheet
    for: [oledoc]
    crit: notable
    conf: 0.85
    attack: T1564
    if:
      # Sheet visibility 2 cannot be undone from Excel's own UI, only from
      # code. Legacy workbooks do use it to protect calculation sheets, so on
      # its own this is a fact about the file rather than a claim about it.
      type: value
      path: office.features[*]
      exact: veryhidden_sheets

composite_rules:
  # Manufacture the macro sheet, then run what was written into it. Together
  # these are an XLM interpreter being stood up inside a VBA project, which is
  # not something a spreadsheet does for its own sake.
  - id: runtime-excel4-macro-injection
    desc: Builds and runs an Excel 4.0 macro sheet
    crit: hostile
    conf: 0.97
    attack: T1059.005,T1027
    all:
      - id: excel4-macro-sheet-creation
    any:
      - id: xlm-run-cell-address
      - id: xlm-return-formula-assembly
      - id: worksheet-hidden-assignment

  # The command was never in the code: it is reassembled from cell text and
  # handed straight to a hidden shell.
  - id: cell-stored-command-hidden-launch
    desc: Runs a command reassembled from cell text
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.005
    all:
      - id: cell-constant-character-harvest
      - id: vba-hidden-window-shell

  # The whole XLM dropper family in one shape: the workbook carries a macro
  # sheet for an interpreter that predates VBA, and names it Auto_Open so it
  # runs on open with no prompt beyond the macro banner. Legacy workbooks that
  # still ship XLM do not auto-run it -- they leave it for a person to call --
  # and anything written this century that wants to run code on open uses VBA.
  - id: auto-running-excel4-macro-sheet
    desc: Auto-opening Excel 4.0 macro sheet
    crit: hostile
    conf: 0.95
    attack: T1059.005,T1204.002
    all:
      - id: stored-excel4-macro-sheet
      - id: workbook-auto-open-name

  # The same workbook, hidden: the sheet that holds the formulas is set to a
  # visibility a reader cannot reverse, so opening the file runs code from a
  # surface Excel will not show.
  - id: hidden-auto-running-macro-sheet
    desc: Auto-running macro sheet is hidden
    crit: hostile
    conf: 0.96
    attack: T1059.005,T1564
    all:
      - id: stored-excel4-macro-sheet
      - id: workbook-auto-open-name
      - id: very-hidden-worksheet

  # A macro sheet Excel stopped writing thirty years ago, in a workbook whose
  # author field is a random token rather than a name. Legacy XLM workbooks
  # come from people and carry their names; this pairing is a builder that
  # filled the field with whatever its generator produced.
  - id: generated-excel4-macro-workbook
    desc: Machine-authored Excel 4.0 workbook
    crit: suspicious
    conf: 0.9
    all:
      - id: stored-excel4-macro-sheet
      - id: objectives/evasion/masquerade/document::generated-document-author-identity

  # The macro sheet carries a generated name. A workbook that still uses XLM
  # for its own sake keeps the sheet it was built with; a per-victim build
  # names it from a generator so no two samples share a sheet-name signature.
  - id: obfuscated-excel4-macro-workbook
    desc: Excel 4.0 sheet with a generated name
    crit: suspicious
    conf: 0.9
    all:
      - id: stored-excel4-macro-sheet
      - id: objectives/evasion/masquerade/document::randomly-named-worksheet
