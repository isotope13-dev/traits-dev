# VBA-as-loader composites.
#
# Atomic Declare-import detections live in
# `micro-behaviors/process/create/load/vba/`. These composites combine them
# into attacker-intent signals: shellcode allocation, URL-driven droppers, and
# COM/runtime loaders.
defaults:
  for: [oledoc, ooxml, vbs]
  platforms: [windows]

traits:
  - id: vba-document-content-payload
    desc: VBA reads document content payload
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: Content.Characters.Parent
  - id: vba-join-cvar-call
    desc: VBA Join CVar call
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\bJoin\s*\(\s*CVar\s*\('

composite_rules:
  - id: vba-delimiter-split-rejoin
    desc: VBA delimiter split rejoin
    crit: suspicious
    conf: 0.88
    all:
      - id: micro-behaviors/data/string/split::vb-split-expression-long-literal
      - id: vba-join-cvar-call
  - id: vba-shellcode-loader
    desc: VBA imports shellcode loader APIs
    crit: hostile
    conf: 0.97
    attack: T1059.005
    all:
      - id: micro-behaviors/mem/alloc/virtual::vba-declare-virtualalloc
      - id: micro-behaviors/mem/copy::vba-declare-memcopy-primitive
  - id: vba-shellcode-loader-with-thread
    desc: VBA shellcode loader thread handover
    crit: hostile
    conf: 0.98
    attack: T1055
    all:
      - id: vba-shellcode-loader
    any:
      - id: micro-behaviors/process/thread/create::vba-declare-createthread
      - id: micro-behaviors/process/inject/remote-thread::vba-declare-createremotethread
  - id: vba-url-dropper
    for: [oledoc, ooxml]
    desc: VBA URL dropper with auto-trigger
    crit: hostile
    conf: 0.96
    attack: T1105
    all:
      - id: micro-behaviors/os/application/hook::vba-auto-open-sub-decl
    any:
      - id: micro-behaviors/communications/http/client/urlmon::vba-declare-urlmon-fetcher
      - id: micro-behaviors/communications/http/client/wininet::vba-declare-wininet-http-fetcher
  - id: vba-com-runtime-loader
    desc: VBA COM runtime non-literal ProgID
    crit: hostile
    conf: 0.96
    attack: T1559.001
    any:
      - id: micro-behaviors/os/com/instantiation::vba-declare-cogetobject
      - id: micro-behaviors/os/com/instantiation::vba-declare-cocreateinstance
      - id: micro-behaviors/os/com/instantiation::vba-declare-cogetinstancefromfile
    all:
      - id: micro-behaviors/os/com/instantiation::createobject-non-literal-arg
  - id: vba-shell-and-http-dropper
    for: [oledoc, ooxml]
    desc: VBA shell-plus-HTTP dropper
    crit: hostile
    conf: 0.95
    attack: T1059.005
    all:
      - id: micro-behaviors/os/application/hook::vba-auto-open-sub-decl
    any:
      - id: micro-behaviors/os/com/instantiation::office-wscript-shell-object-import
      - id: micro-behaviors/os/application/shell-namespace::createobject-shell-application
  - id: vba-shell-and-http-dropper-with-fetcher
    for: [ole_doc, ooxml]
    desc: VBA shell dropper with HTTP fetch
    crit: hostile
    conf: 0.97
    attack: T1105
    all:
      - id: vba-shell-and-http-dropper
    any:
      - id: micro-behaviors/communications/http/client/reference::createobject-http-fetcher
      - id: micro-behaviors/data/stream/configure::createobject-adodb-stream
  - id: vba-runtime-built-imports
    desc: VBA imports built at runtime
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/document/office/macro::vba-declare-non-literal-lib
      - id: micro-behaviors/os/com/instantiation::createobject-non-literal-arg
  - id: raw-vba-powershell-autostart
    for: [oledoc]
    desc: Raw VBA PowerShell autostart loader
    crit: hostile
    conf: 0.97
    attack: T1059.005
    all:
      - id: micro-behaviors/os/application/hook::raw-auto-open-entrypoint
      - id: micro-behaviors/os/com/instantiation::raw-createobject-call
      - id: micro-behaviors/os/com/instantiation::office-wscript-shell-object-import
      - id: micro-behaviors/process/create/shell/command-string::raw-shell-call
      - id: micro-behaviors/process/create/shell/encoded::raw-caesar3-powershell-encodedcommand
  - id: fragmented-office-vba-shell-url-dropper
    desc: Fragmented VBA auto-open shell URL dropper
    crit: hostile
    conf: 0.99
    attack: T1059.005,T1105,T1204.002
    for: [oledoc]
    all:
      - id: micro-behaviors/os/application/hook::fragmented-vba-auto-open-entrypoint
      - id: micro-behaviors/communications/http/client/urlmon::fragmented-vba-urlmon-download-api
      - id: micro-behaviors/process/create/shell/wsh::fragmented-vba-wscript-shell-object
      - id: micro-behaviors/data/control-flow/dispatch/named::raw-vba-run-method-call
  - id: vba-autoopen-hidden-wmi-loader
    for: [oledoc, ooxml]
    desc: Auto-open VBA hidden WMI loader
    crit: hostile
    conf: 0.97
    attack: T1047
    all:
      - id: micro-behaviors/os/application/hook::vba-auto-open-sub-decl
    any:
      - id: objectives/execution/wmi::wmi-hidden-cvar-process-create
      - id: micro-behaviors/process/create/exec::wmi-hidden-variable-process-create
  - id: vba-content-hidden-wmi-loader
    desc: VBA document-content WMI loader
    crit: hostile
    conf: 0.97
    attack: T1047
    all:
      - id: vba-document-content-payload
    any:
      - id: objectives/execution/wmi::wmi-hidden-cvar-process-create
      - id: micro-behaviors/process/create/exec::wmi-hidden-variable-process-create
  - id: vba-obfuscated-wmi-stage-loader
    desc: Obfuscated VBA WMI stage loader
    crit: hostile
    conf: 0.96
    attack: T1027, T1047
    all:
      - id: vba-delimiter-split-rejoin
    any:
      - id: objectives/execution/wmi::wmi-hidden-cvar-process-create
      - id: micro-behaviors/process/create/exec::wmi-hidden-variable-process-create
