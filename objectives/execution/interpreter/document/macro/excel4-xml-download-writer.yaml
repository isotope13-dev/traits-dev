# An Excel 4.0 macrosheet that uses FOPEN/FWRITELN to write out a second-stage
# script whose lines fetch a remote file and save the HTTP response body to
# disk (XMLHTTP + ADODB.Stream SaveToFile). The workbook never downloads
# anything itself; it plants a downloader for Windows Script Host to run.
defaults:
  for: [xml]
  platforms: [windows]
  attack: T1059.005,T1105
  mbc: B0032

composite_rules:
  - id: excel4-writes-http-download-script
    desc: XLM writes a script that downloads a file
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/document/office/macro::excel4-macrosheet-xml-root
      - id: micro-behaviors/fs/write/file/full/string::excel4-fopen-fwriteln-text-file
      - id: micro-behaviors/fs/write/file/response-body::excel4-fwriteln-response-body-save
