defaults:
  for: [vbs]
  platforms: [windows]
  attack: T1059.005,T1055,T1027

traits:
  - id: vba-open-memory-enumeration-callback-payload
    desc: Auto-open VBA allocates callback payload
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule vba_open_memory_enumeration_callback_payload {
          strings:
            $open = "Workbook_Open" ascii nocase
            $allocate = "NtAllocateVirtualMemory" ascii
            $callback = "Internal_EnumUILanguages" ascii
            $convert = "WideCharToMultiByte" ascii
            $bytes = /=[ \t]*&H[0-9a-fA-F]{1,2}[ \t]*:/
          condition:
            all of ($open, $allocate, $callback, $convert) and #bytes > 100
        }
