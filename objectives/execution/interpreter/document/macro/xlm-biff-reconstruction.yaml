defaults:
  for: [oledoc]
  platforms: [windows]
  attack: T1027,T1059.005

traits:
  - id: biff-xlm-formula-reconstruction-tokens
    desc: BIFF repeats XLM SET.NAME tokens
    crit: notable
    conf: 0.96
    count_min: 5
    unless:
      - id: metadata/package/files/msi/identity::ole2-installer-kind
    if:
      type: raw
      regex: '[\x22\x42\x62][\x00-\xff]\x58\x00'
  - id: biff-xlm-formula-token
    desc: BIFF contains an XLM FORMULA token
    crit: notable
    unless:
      - id: metadata/package/files/msi/identity::ole2-installer-kind
    if:
      type: raw
      regex: '[\x22\x42\x62][\x00-\xff]\x60\x80'
  - id: biff-xlm-indirect-token
    desc: BIFF contains an XLM INDIRECT token
    crit: notable
    unless:
      - id: metadata/package/files/msi/identity::ole2-installer-kind
    if:
      type: raw
      regex: '[\x22\x42\x62][\x00-\xff]\x94\x00'
  - id: biff-xlm-address-token
    desc: BIFF contains an XLM ADDRESS token
    crit: notable
    unless:
      - id: metadata/package/files/msi/identity::ole2-installer-kind
    if:
      type: raw
      regex: '[\x22\x42\x62][\x00-\xff]\xDB\x00'
  - id: biff-xlm-run-dispatch-burst
    desc: BIFF repeats XLM RUN tokens
    crit: notable
    count_min: 50
    unless:
      - id: metadata/package/files/msi/identity::ole2-installer-kind
    if:
      type: raw
      regex: '[\x22\x42\x62][\x00-\xff]\x11\x80'
  - id: biff-xlm-char-burst
    desc: BIFF repeats XLM CHAR tokens
    crit: notable
    count_min: 50
    unless:
      - id: metadata/package/files/msi/identity::ole2-installer-kind
    if:
      type: raw
      regex: '[\x21\x41\x61]\x6F\x00'

composite_rules:
  - id: autorun-xlm-formula-reconstruction
    desc: Auto-running XLM reconstructs formulas
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/execution/interpreter/document/macro::auto-running-excel4-macro-sheet
      - id: biff-xlm-formula-reconstruction-tokens
      - id: biff-xlm-formula-token
      - id: biff-xlm-indirect-token
      - id: biff-xlm-address-token
  - id: autorun-xlm-scattered-character-dispatch
    desc: Auto-running XLM scatters character dispatch
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/execution/interpreter/document/macro::auto-running-excel4-macro-sheet
      - id: biff-xlm-run-dispatch-burst
      - id: biff-xlm-char-burst
