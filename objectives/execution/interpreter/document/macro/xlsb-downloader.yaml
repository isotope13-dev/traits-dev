defaults:
  platforms: [windows]
  for: [ooxml]
  attack: T1204.002,T1105

traits:
  # Match the actual compressed member bytes within the local ZIP entry.
  # The reviewed sheets share a built-in Auto_Open name in the workbook,
  # cached native download and launch API names, and XLM CALL formulas.
  # A mismatch in the ZIP CRC or a file name alone is not a payload match.
  - id: xlsb-known-downloader-macro-part
    desc: Known XLM downloader macro sheet fingerprint
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "hash"

        rule xlsb_known_downloader_macro_part {
          strings:
            $member = /xl\/macrosheets\/sheet[0-9]+\.bin/ ascii
          condition:
            for any entry in (1..#member) : (
              @member[entry] >= 30 and
              uint32(@member[entry]-30) == 0x04034b50 and
              (uint16(@member[entry]-24) & 9) == 0 and
              uint16(@member[entry]-22) == 8 and
              uint16(@member[entry]-4) == !member[entry] and
              with packed_size = uint32(@member[entry]-12),
                   data_start = @member[entry]+!member[entry]+uint16(@member[entry]-2) : (
                packed_size > 0 and packed_size <= 65536 and
                with digest = hash.sha256(data_start, packed_size) : (
                  digest == "065474134ba9bf4a1c5debfb9b70c8ba9e763bb4bb382256b047c73857035484" or
                  digest == "0db2c390a8309be161fd793690d05e9dcec901fba9022382792c48430c1590a6" or
                  digest == "15992f9dcd38ce1ee82c0ae0c4013a070bae0de312225a76cdd25719e3e9b9af" or
                  digest == "3ed123a1eff1cc92f9ef246da2abd33f0f064f2b027f302557d621ff50b26d5f" or
                  digest == "45b88d3b1d4f3114b70c82181643694d80b91864779c6c3281ca3ed8d3b930c8" or
                  digest == "4f718913783418111b3e3ab21a7872b7d1d6db8c74799373c91608759cc718c3" or
                  digest == "62671fc9eec0eda74d6c19e90de8c9e2b5f06708a1cde4a3964fcb6fce3b43f9" or
                  digest == "69a2d14e675a85d283177cabbe26c3362be68627d6a8605e04112808df92562a" or
                  digest == "94b3ec9d19f1e39369ae629d88b7b549939b57012ecd7df36d72b02a3877ca66" or
                  digest == "966cfea979d8ab7d0c134aef5b1f2dbfb7d6227a4496e55f0f7ce6f5e3d0b69d" or
                  digest == "ab6cc762a5158dc0afb4baf602d020bd6f79e7759c65780334acf6e3eb19ea0a" or
                  digest == "b1a0f33222a51692dc4172e88b265eeba9f4acd49421eef2772df2133580a282" or
                  digest == "c752e4c35bce94d60bb8be9ec0ecda36189e4517d99a997352848780d3ebfafd" or
                  digest == "ec43a06721fafc0cef65dfe3ce8dd44300406ee9567cac256f88af8d73c4ab73" or
                  digest == "f5b95e3610b6b4dd83eb5219cad29a3ef938041b9c9debdf98b40c5d9485487c"
                )
              )
            )
        }

composite_rules:
  - id: xlsb-known-downloader-workbook
    desc: Binary workbook carries a known XLM downloader
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: metadata/document/office/macro::xlsb-binary-workbook-part
      - id: xlsb-known-downloader-macro-part
