# An RTF that embeds Excel worksheets holding a VBA project and forces them
# to update on open. Activating the embedded workbook loads its macros; the
# `\objupdate` makes Word instantiate it without a click, so the user sees
# the macro prompt (or none, under a permissive policy) as soon as the
# document opens. Repeating the same object several times is the usual
# delivery shape: dismissing one prompt raises the next.
defaults:
  platforms: [windows]
  for: [rtf]
  attack: T1204.002,T1059.005

composite_rules:
  - id: rtf-autoupdate-macro-workbook-object
    desc: RTF force-loads embedded macro workbook
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/document/rtf/ole::objupdate
      - id: metadata/document/rtf/ole::rtf-object-excel-sheet-class
      - id: metadata/document/rtf/ole::objdata-hex-vba-typelib-reference
