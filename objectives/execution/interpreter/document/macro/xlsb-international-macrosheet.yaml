# Excel 4.0 macros stored as an *international* macro sheet inside a
# binary .xlsb workbook: the formulas live in BIFF12 records that XML-based
# scanners never read, and the international sheet type is an Excel 5
# localisation leftover that current authoring never produces. This
# combination is the 2020 XLM downloader shape (Auto_Open, CALL URLMon /
# URLDownloadToFileA, ShellExecuteA).
defaults:
  platforms: [windows]
  for: [ooxml]
  attack: T1204.002,T1059
composite_rules:
  - id: xlsb-international-xlm-macrosheet
    desc: Binary workbook carries international XLM macros
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/document/office/macro::xlsb-binary-workbook-part
      - id: metadata/document/office/macro::ooxml-international-macrosheet-part
