defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1059.005

traits:
  - id: vba-embedded-ole-hidden-doc-launch
    desc: Activates package and hidden document macro
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule vba_embedded_ole_hidden_doc_launch {
          strings:
            $auto = "Sub AutoOpen()" nocase
            $package = /\.OLEFormat\.ClassType\s*=\s*["']Package["']/ nocase
            $verb = /\.DoVerb\s+200/ nocase
            $hidden = /OpenNoRepairDialog[^\r\n]{1,200}Visible\s*:=\s*False/ nocase
            $run = "Application.Run" nocase
          condition:
            all of them
        }
