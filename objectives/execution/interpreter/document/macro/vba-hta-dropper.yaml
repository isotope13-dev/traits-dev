# Document macro dropper: AutoOpen writes a file through
# FileSystemObject.CreateTextFile and launches a path that the module only
# stores reversed, via WScript.Shell (here an HTA started through
# explorer.exe so the parent is not Word).
defaults:
  platforms: [windows]
  for: [vbs, ooxml, oledoc]
  attack: T1204.002,T1218.005
composite_rules:
  - id: autoopen-writes-and-launches-reversed-path
    desc: AutoOpen writes and runs a reversed-path script
    crit: hostile
    conf: 0.95
    # The macro is split across VBA modules; join them at the document.
    scope: archive
    all:
      - id: micro-behaviors/os/application/hook/event::vba-auto-open-sub-decl
      - id: micro-behaviors/fs/write/content::create-text-file-method-name
      - id: micro-behaviors/data/string/reverse::strreverse-literal-script-path
      - id: micro-behaviors/os/com/instantiation::wscript-shell-createobject
