# VBA creates an Excel 4.0 macro sheet at runtime, writes formulas held in
# variables into it and runs a computed cell address: the XLM code never
# exists in the file as macro-sheet content.
defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  attack: T1059.005,T1027

composite_rules:
  - id: vba-runtime-xlm-sheet-formula-run
    desc: Writes and runs runtime XLM formulas
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/data/collection/create::excel4-macro-sheet-creation
      - id: micro-behaviors/data/document/spreadsheet::vba-cell-formula-from-variable
      - id: metadata/lang/source/syntax/call/arguments::vba-run-concatenated-cell-address
