# VBA creates an Excel 4.0 macro sheet at runtime, writes formulas held in
# variables into it and runs a computed cell address: the XLM code never
# exists in the file as macro-sheet content.
defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  attack: T1059.005,T1027

traits:
  - id: vba-open-event-dispatches-sheet-macro
    for: [oledoc, ooxml]
    desc: Workbook open dispatches a worksheet macro
    crit: notable
    conf: 0.94
    if:
      type: value
      path: office.vba.modules[*].source
      regex: '(?is)\bSub\s+(Workbook_|Auto_)Open\b.*?Application\.Run\s*\(?\s*[\w.]*Sheets?\('
  - id: vba-writes-split-xlm-exec-formula
    for: [oledoc, ooxml]
    desc: VBA assembles an XLM EXEC formula
    crit: notable
    conf: 0.97
    if:
      type: value
      path: office.vba.modules[*].source
      regex: '(?i)\.Range\([^)]{1,48}\)(\.Formula\w*)?\s*=\s*"=("\s*&\s*")?EXEC"\s*&'

composite_rules:
  - id: vba-runtime-xlm-sheet-formula-run
    desc: Writes and runs runtime XLM formulas
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/data/collection/create::excel4-macro-sheet-creation
      - id: micro-behaviors/data/document/spreadsheet::vba-cell-formula-from-variable
      - id: metadata/lang/source/syntax/call/arguments::vba-run-concatenated-cell-address
  - id: vba-open-builds-and-dispatches-xlm-exec
    for: [oledoc, ooxml]
    desc: Workbook open builds and dispatches Excel 4 command formulas
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/interpreter/document/macro::stored-excel4-macro-sheet
      - id: vba-open-event-dispatches-sheet-macro
      - id: vba-writes-split-xlm-exec-formula
