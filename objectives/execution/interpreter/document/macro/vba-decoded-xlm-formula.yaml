defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1059.005

traits:
  - id: vba-decoded-xlm-formula-run
    desc: Runs decoded hidden Excel 4 formulas
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule vba_decoded_xlm_formula_run {
          strings:
            $sheet = "Excel4MacroSheets.Add" nocase
            $formula = /\.Formula\s*=/ nocase
            $run = /\bRun\s*\(/ nocase
            $hide = /ActiveSheet\.Visible\s*=\s*0/ nocase
            $decode = /Mid\s*\([^\r\n]{1,80}\)\s*&\s*Mid\s*\(/ nocase
          condition:
            all of them
        }
