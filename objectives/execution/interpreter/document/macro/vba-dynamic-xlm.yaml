defaults:
  for: [vbs]
  platforms: [windows]
  attack: T1059.005,T1027

traits:
  - id: vba-reconstruct-hidden-xlm-formulas
    desc: VBA reconstructs and runs hidden XLM formulas
    crit: hostile
    conf: 0.97
    if:
      type: yara
      source: |
        rule vba_reconstruct_hidden_xlm_formulas {
          strings:
            $xlm = /Excel4MacroSheets\.Add/ nocase
            $typed = /Worksheets\.Add\([^\r\n]{1,120}Type[ \t]*:=[ \t]*3/ nocase
            $hidden = /ActiveSheet\.Visible[ \t]*=[ \t]*(0|xlSheetHidden)/ nocase
            $formula = ".FormulaLocal" ascii nocase
            $split = /Split[ \t]*\(/ nocase
            $run = /Run[ \t]*\(/ nocase
            $cells = ".UsedRange" ascii nocase
          condition:
            1 of ($xlm, $typed) and all of ($hidden, $formula, $split, $run, $cells)
        }
