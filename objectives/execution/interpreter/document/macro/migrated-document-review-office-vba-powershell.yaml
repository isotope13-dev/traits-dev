---
defaults:
  for:
  - documents
  platforms:
  - windows
composite_rules:
- id: vba-autoopen-obfuscated-comspec-url-clues
  desc: Auto-open VBA with obfuscated COMSPEC and URL clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/os/application/hook/event::autoopen-entrypoint
  - id: well-known/lib/runtime/scripted/windows-script-host::wscript-shell-object
  - id: micro-behaviors/os/com/instantiation::createobject-call
  - id: micro-behaviors/process/create/shell/command-string::comspec-batch-stager
  - id: metadata/document/office/markup::office-url-text-count
  - id: objectives/anti-static/obfuscation/document/ui-controls::cmd-env-substring-expansion
