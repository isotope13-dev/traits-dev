defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  - text
  attack: T1505.003,T1059
  mbc: B0030
  conf: 0.96
composite_rules:
- id: assert-evaluates-request-input
  desc: Legacy PHP assert evaluates request input
  for:
  - php
  crit: hostile
  all:
  - id: micro-behaviors/data/control-flow/assert::php-assert-call
  - id: micro-behaviors/data/control-flow/assert::php-assert-direct-request-input
  unless:
  - id: metadata/path/directory::test-directory-component
  - id: well-known/tool/detection/code-analysis/semgrep::rule-pack-fixture
