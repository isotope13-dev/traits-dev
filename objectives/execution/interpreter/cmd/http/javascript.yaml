defaults:
  platforms: [unix]
  for: [javascript, typescript]

composite_rules:
  - id: javascript-web-request-shell-execution
    desc: Request command reaches POSIX shell
    crit: suspicious
    conf: 0.98
    attack: "T1059.004"
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/server/request::javascript-request-body-command-field
      - id: micro-behaviors/process/create/shell/interpreter::node-posix-shell-command-variable
