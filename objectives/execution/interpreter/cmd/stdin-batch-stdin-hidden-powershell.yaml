defaults:
  platforms: [windows]
  for: [batch]
  attack: T1059.001,T1564.003
composite_rules:
  - id: batch-stdin-fed-hidden-powershell-with-dynamic-call
    desc: Batch feeds hidden PowerShell script via stdin
    crit: hostile
    conf: 0.85
    all:
      - id: micro-behaviors/process/interpreter/pipeline::batch-echo-variable-piped-to-interpreter-stdin
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/interpreter/eval/indirect::powershell-variable-call
