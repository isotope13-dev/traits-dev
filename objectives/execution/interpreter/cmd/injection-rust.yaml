# A command payload corpus plus URL formatting and an HTTP client suggests
# remote injection testing. It does not establish a local shell invocation.
defaults:
  for: [rust]
  platforms: [unix, windows]

traits:
  - id: rust-shell-separator-identity-payload
    desc: Identity command follows shell separator
    crit: notable
    if:
      type: literal
      kind: string
      regex: '^[;|](whoami|id)$'

  - id: rust-formatted-query-value
    desc: Formats query with URL encoded value
    crit: notable
    if:
      type: text
      exclude_comments: true
      regex: 'format!\("\{\}\{\}\{\}\{\}=\{\}"[^;\n]{1,100}urlencode\('

composite_rules:
  - id: rust-http-shell-injection-probes
    desc: HTTP query construction with shell injection payload corpus
    crit: suspicious
    conf: 0.95
    all:
      - id: rust-shell-separator-identity-payload
      - id: metadata/lang/source/syntax/command/control::parenthesized-command-literal
      - id: rust-formatted-query-value
      - id: micro-behaviors/process/create/subprocess/configure::rust-command-curl-wget
    near_bytes: 10000
