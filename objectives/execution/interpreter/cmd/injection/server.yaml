# Web-facing command injection is the combination of an HTTP handler, request
# data, and a shell execution sink. The composites describe that structural
# chain so future variants are covered without relying on a product or CVE
# name.
defaults:
  platforms: [unix, windows]

traits:
  - id: java-post-mapping
    desc: Java POST mapping annotation
    crit: notable
    conf: 0.94
    for: [java]
    if:
      type: text
      regex: '(?m)^\s*@PostMapping\b'

  - id: java-request-mapping-post
    desc: Java request mapping declares POST
    crit: notable
    conf: 0.94
    for: [java]
    if:
      type: text
      regex: '(?is)@RequestMapping\([^)]{0,70}RequestMethod\.POST'

  - id: java-request-param-annotation
    desc: Java request parameter annotation
    crit: notable
    conf: 0.94
    for: [java]
    if:
      type: text
      regex: '@RequestParam\b'

  - id: java-command-concat
    desc: Java command string concatenates input
    crit: suspicious
    conf: 0.96
    for: [java]
    if:
      type: text
      regex: '(?m)\b(String\s+)?(cmd|command)\s*=\s*["''][^"''\r\n]{1,120}["'']\s*\+\s*[A-Za-z_$][\w$]*'
    unless:
      - id: well-known/lib/runtime/openjdk::bundled-jdk-src-context

  - id: java-runtime-shell-exec
    desc: Java Runtime exec invokes shell
    crit: notable
    conf: 0.98
    for: [java]
    if:
      type: text
      regex: '(?s)Runtime\.getRuntime\(\)\.exec\([^)]{0,120}["'']/bin/sh["'']\s*,\s*["'']-c["'']'

  - id: java-processbuilder-shell-exec
    desc: Java ProcessBuilder invokes shell
    crit: notable
    conf: 0.98
    for: [java]
    if:
      type: text
      regex: '(?s)new\s+ProcessBuilder\([^)]{0,120}["'']/bin/sh["'']\s*,\s*["'']-c["'']'

composite_rules:
  - id: java-post-handler
    desc: Java POST handler annotation
    crit: notable
    conf: 0.95
    for: [java]
    any:
      - id: java-post-mapping
      - id: java-request-mapping-post

  - id: java-request-input
    desc: Java HTTP request parameter input
    crit: notable
    conf: 0.95
    for: [java]
    any:
      - id: java-request-param-annotation
      - id: micro-behaviors/communications/http/request/params::servlet-get-parameter-call

  - id: java-shell-interpreter-exec
    desc: Java exec invokes a shell interpreter
    crit: suspicious
    conf: 0.98
    for: [java]
    any:
      - id: java-runtime-shell-exec
      - id: java-processbuilder-shell-exec

  - id: python-web-request-command-injection
    desc: Python request data reaches shell command
    crit: hostile
    conf: 0.995
    attack: T1059.006,T1190
    mbc: B0024
    for: [python]
    all:
      - id: micro-behaviors/communications/http/server/request::http-request-input
      - id: micro-behaviors/process/create/subprocess::shell-true
      - id: micro-behaviors/process/create/construction::command-spreading
    near_lines: 35

  - id: java-web-shell-command-execution
    desc: Java HTTP handler invokes shell command
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1190
    mbc: B0024
    for: [java]
    all:
      - id: java-post-handler
      - id: java-shell-interpreter-exec
    near_lines: 45

  - id: java-web-request-command-injection
    desc: Java request input reaches shell command
    crit: hostile
    conf: 0.995
    attack: T1059.004,T1190
    mbc: B0024
    for: [java]
    all:
      - id: java-post-handler
      - id: java-request-input
      - id: java-command-concat
      - id: java-shell-interpreter-exec
    near_lines: 45
