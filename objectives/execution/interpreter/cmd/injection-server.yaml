# Web-facing command injection is the combination of an HTTP handler, request
# data, and a shell execution sink. The composites describe that structural
# chain so future variants are covered without relying on a product or CVE
# name.
defaults:
  platforms: [unix, windows]
  mbc: B0024

composite_rules:
  - id: python-web-request-command-injection
    desc: Python request data reaches shell command
    crit: hostile
    conf: 0.995
    attack: T1059.006,T1190
    for: [python]
    all:
      - id: micro-behaviors/communications/http/server/request::http-request-input
      - id: micro-behaviors/process/create/shell-subprocess::shell-true
      - id: micro-behaviors/process/create/construction::command-spreading
    near_lines: 35
    unless:
      # A CTF challenge target is a vulnerable web app on purpose; that is the
      # exercise, not what the package does to the host installing it.
      - id: well-known/lib/ai/inspect-evals::eval-corpus-context
      # Semgrep ships the vulnerable code it hunts for as its test fixture.
      - id: well-known/tool/detection/semgrep::rule-pack-fixture

  - id: java-web-shell-command-execution-runtime
    desc: Java HTTP handler invokes shell command through Runtime
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1190
    for: [java]
    all:
      - id: micro-behaviors/communications/http/server/route::java-post-handler
      - id: micro-behaviors/process/create/shell/interpreter::java-runtime-shell-exec
    near_lines: 45

  - id: java-web-shell-command-execution-processbuilder
    desc: Java HTTP handler invokes shell command through ProcessBuilder
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1190
    for: [java]
    all:
      - id: micro-behaviors/communications/http/server/route::java-post-handler
      - id: micro-behaviors/process/create/shell/interpreter::java-processbuilder-shell-exec
    near_lines: 45

  - id: java-web-shell-command-execution
    desc: Java HTTP handler invokes shell command
    crit: suspicious
    conf: 0.98
    attack: T1059.004,T1190
    for: [java]
    any:
      - id: java-web-shell-command-execution-runtime
      - id: java-web-shell-command-execution-processbuilder

  - id: java-web-request-command-injection-runtime
    desc: Java request input reaches Runtime shell command
    crit: hostile
    conf: 0.995
    attack: T1059.004,T1190
    for: [java]
    all:
      - id: micro-behaviors/communications/http/server/route::java-post-handler
      - id: micro-behaviors/communications/http/request/params::java-request-input
      - id: micro-behaviors/process/create/construction::java-command-prefix-concat
      - id: micro-behaviors/process/create/shell/interpreter::java-runtime-shell-exec
    near_lines: 45

  - id: java-web-request-command-injection-processbuilder
    desc: Java request input reaches ProcessBuilder shell command
    crit: hostile
    conf: 0.995
    attack: T1059.004,T1190
    for: [java]
    all:
      - id: micro-behaviors/communications/http/server/route::java-post-handler
      - id: micro-behaviors/communications/http/request/params::java-request-input
      - id: micro-behaviors/process/create/construction::java-command-prefix-concat
      - id: micro-behaviors/process/create/shell/interpreter::java-processbuilder-shell-exec
    near_lines: 45

  - id: java-web-request-command-injection
    desc: Java request input reaches shell command
    crit: suspicious
    conf: 0.98
    attack: T1059.004,T1190
    for: [java]
    any:
      - id: java-web-request-command-injection-runtime
      - id: java-web-request-command-injection-processbuilder
