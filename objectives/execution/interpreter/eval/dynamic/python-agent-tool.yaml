defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059.006

composite_rules:
  - id: agent-skill-arbitrary-python-execution
    desc: Agent skill tool exposes arbitrary Python evaluation and execution
    crit: hostile
    conf: 0.98
    near_lines: 45
    all:
      - id: metadata/package/agent-skill::agent-skill-file
      - id: micro-behaviors/process/interpreter/eval/direct::eval-builtin
      - id: micro-behaviors/process/interpreter/eval/direct::exec-variable
      - id: micro-behaviors/process/interpreter/eval/compile::compile-source-exec-mode
    # Maya's script tool compiles the caller's source and runs it on the
    # application main thread. That is the host editor, not a hidden payload.
    unless:
      - id: micro-behaviors/process/interpreter/scripting::maya-main-thread-script-marshal
      - id: micro-behaviors/process/interpreter/scripting::pymxs-confirmed-caller-exec
