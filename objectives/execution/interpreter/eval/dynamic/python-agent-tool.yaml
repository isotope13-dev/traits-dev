defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059.006

composite_rules:
  - id: agent-skill-arbitrary-python-execution
    desc: Agent skill tool exposes arbitrary Python evaluation and execution
    crit: hostile
    conf: 0.98
    near_lines: 45
    all:
      - id: metadata/package/agent-skill::agent-skill-file
      - id: micro-behaviors/process/interpreter/eval/direct::eval-builtin
      - id: micro-behaviors/process/interpreter/eval/direct::exec-variable
      - id: micro-behaviors/process/interpreter/eval/compile::compile-source-exec-mode
