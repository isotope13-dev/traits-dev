defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059.006

composite_rules:
  - id: agent-skill-eval-and-exec
    desc: Agent skill bundles Python eval and exec code
    crit: hostile
    conf: 0.97
    scope: archive
    for: [python, markdown, zip, tar]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/process/interpreter/eval/python-builtins::eval-builtin
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
    # A scanner package may ship intentionally unsafe skill fixtures for
    # testing; do not classify the scanner's own distribution as a trojanized
    # skill bundle.
    unless:
      - id: well-known/tool/detection/agent/skill-scanner::cisco-skill-scanner-archive-context

  - id: agent-skill-arbitrary-python-execution
    desc: Agent skill tool exposes arbitrary Python evaluation and execution
    crit: hostile
    conf: 0.98
    near_lines: 45
    all:
      - id: metadata/package/agent-skill::agent-skill-file
      - id: micro-behaviors/process/interpreter/eval/python-builtins::eval-builtin
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-variable
      - id: micro-behaviors/metaprogramming/generation/compile::compile-source-exec-mode
    # Maya's script tool compiles the caller's source and runs it on the
    # application main thread. That is the host editor, not a hidden payload.
    unless:
      - id: micro-behaviors/process/interpreter/scripting::maya-main-thread-script-marshal
      - id: micro-behaviors/process/interpreter/scripting::pymxs-confirmed-caller-exec
