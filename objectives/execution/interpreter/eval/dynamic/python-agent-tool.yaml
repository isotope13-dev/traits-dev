defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059.006

composite_rules:
  - id: agent-skill-arbitrary-python-execution
    desc: Agent skill tool exposes arbitrary Python evaluation and execution
    crit: hostile
    conf: 0.98
    near_lines: 45
    all:
      - id: metadata/package/config::agent-skill-tool-file
      - id: micro-behaviors/process/interpreter/python::eval-builtin
      - id: micro-behaviors/process/interpreter/python::exec-variable
      - id: micro-behaviors/process/interpreter/python::compile-source-exec-mode

