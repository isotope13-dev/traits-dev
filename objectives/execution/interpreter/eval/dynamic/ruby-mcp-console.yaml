defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-mcp-opt-in-console-evaluation
    desc: Evaluates Ruby through opt-in MCP console
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule ruby_mcp_opt_in_console_evaluation {
          strings:
            $namespace = "module Woods"
            $optin = "console_unsafe_eval_confirmation"
            $guard = "console_eval refused by EvalGuard"
            $eval = "Object.new.instance_eval(code, '(console_eval)', 1)"
          condition:
            all of them
        }
