defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: string-command-eval-marker
    desc: String command parser recognizes eval requests
    crit: notable
    conf: 0.98
    attack: T1059.007
    if:
      type: text
      # Require eval/exec to begin the command token (or follow a delimiter).
      # This excludes API names such as `.scriptEval(` in ordinary tooling.
      regex: '(?i)(startsWith|includes)\(["'']([\w./-]{0,24}[:/_-])?(eval|exec)\('

  - id: eval-variable
    desc: eval with variable argument
    crit: notable
    conf: 0.9
    attack: T1059.007
    if:
      type: string_literal
      regex: eval\s*\(\s*[a-zA-Z_$][a-zA-Z0-9_$]*\s*\)
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/library/structure/
      - id: metadata/build/recognized-contexts::benign-build-tooling-context

  - id: js-interpreter-constructor-timeout
    desc: JavaScript interpreter constructor timeout
    crit: suspicious
    conf: 0.94
    attack: T1059.007
    if:
      type: text
      # Match constructors that are actually used as embedded interpreters;
      # DatabaseSync and other ordinary APIs also accept `{ timeout: ... }`.
      regex: 'new\s+(VM|NodeVM|Isolate)\s*\(\s*\w+\s*,\s*\{\s*timeout\s*:'
    unless:
      - id: metadata/package/testing/harness/runtime/

  - id: js-interpreter-evaluate-call
    desc: JavaScript VM evaluate call
    crit: suspicious
    conf: 0.94
    attack: T1059.007
    if:
      type: text
      regex: '\b(vm|nodevm|isolate)\.evaluate\s*\(\s*\w+\s*\)'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/lib/development/uglifyjs::compressor-source
      - id: metadata/library/jsonata::jsonata-query-evaluate

  - id: constructor-property-access
    desc: JavaScript accesses constructor property
    crit: component
    conf: 0.65
    attack: T1059.007
    mbc: B0032
    if:
      type: text
      regex: \[\s*["']constructor["']\s*\]
    unless:
      - id: well-known/lib/web/jquery::obfuscated-jquery-source
  # Removed: `\w+\[\w+\]\s*\(` (computed-property call) is too generic to
  # be an objective on its own — it fires on any dispatch/action table
  # (`window[name](payload)`, `handlers[evt](e)`). Real indirect-eval
  # detection is handled by the AST and `bracket-eval` traits in
  # obfuscated_js.yaml that require an eval/Function target specifically.
  - id: eval-function-definition
    desc: eval() compiling a function string
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: eval\s*\(\s*["']\[?function
    unless:
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/library/structure::js-large-minified-bundle
      - id: metadata/build/bundler::parcel-bundled--parcelrequire
  - id: eval-call-expression-arg
    desc: eval() with call expression argument
    crit: notable
    conf: 0.9
    attack: T1059.007
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: (identifier) @fn
          arguments: (arguments
            (call_expression) @arg)
          (#eq? @fn "eval"))
    unless:
      - id: metadata/library/svga::svga-autoloader-bundle
      - id: objectives/execution/interpreter/eval/dynamic/
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/harness/runtime::v8-native-intrinsic-call
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - type: basename
        regex: "\\.scrbl$"
  - id: eval-contents-of-helper
    desc: eval(contentsOf(...)) Node test helper
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: eval(contentsOf(
  - id: synced-extension-task-field
    desc: Reads synced browser task list
    crit: component
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: 'storage\.sync\.get\(\s*\[[^\]]{0,120}\btasks_r\b'

  - id: synced-extension-task-code
    desc: Executes code from synced browser task
    crit: suspicious
    conf: 0.99
    attack: T1059.007
    for: [javascript, typescript]
    if:
      type: text
      regex: 'new\s+Function\s*\(\s*task\.code\s*\)'

  - id: code-bearing-object-field-reference
    desc: Evaluates an object code field
    crit: component
    conf: 0.88
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(eval|(new\s+)?Function)\s*\([^)]{0,120}\.(script|code|payload)\b'
    unless:
      # Documentation JSX commonly uses `code`/`payload` as rendered object
      # fields; this atom requires an evaluator call and does not establish
      # dynamic execution from a member reference alone.
      - id: metadata/file/profile/identity::docusaurus-docs-bundle

  # This is a component for the composite below. A payload interpolation is
  # ordinary templating by itself; it becomes an execution signal when the
  # generated file is handed to a child Node process.
  - id: node-payload-template
    desc: JavaScript template embeds a payload variable
    crit: component
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '\$\{\s*payload\s*\}'

  - id: node-temporary-payload-path
    desc: Node temporary JavaScript payload path
    crit: component
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '\btemp-payload-[\s\S]{0,80}\.(m?js)\b'

composite_rules:
  - id: js-embedded-interpreter-evaluate
    desc: Embedded interpreter evaluates JavaScript strings
    crit: suspicious
    conf: 0.96
    attack: T1059.007
    mbc: B0032
    all:
      - id: js-interpreter-constructor-timeout
      - id: js-interpreter-evaluate-call
    near_bytes: 512

  - id: hex-mangled-decoded-computed-execution
    desc: Hex-mangled JavaScript executes a custom-decoded computed stage
    crit: hostile
    conf: 0.98
    attack: T1027,T1140,T1059.007
    mbc: B0032
    scope: file
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling
      - id: micro-behaviors/data/decode/custom::js-alphabet-coded-decoder-source
      - id: micro-behaviors/process/interpreter/eval::js-computed-charcode-call
      - id: micro-behaviors/data/encode/char-code::fromcharcode-xor-rebuild
    unless:
      - id: metadata/library/mermaid::mermaid-bundle-marker
      - id: well-known/app/publishing/wordpress-plugins/
      - id: well-known/lib/core/freemius::freemius-js-ref

  - id: packed-arithmetic-decoder-runtime-stage
    desc: Arithmetic-decoded JavaScript stage executes via eval
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007,T1140
    mbc: B0032
    all:
      - id: micro-behaviors/data/decode/custom::fromcharcode-large-offset-expression
      - id: micro-behaviors/process/interpreter/eval::js-eval-variable-argument
      - id: metadata/file/metrics::single-long-line
    unless:
      - id: metadata/package/testing/

  - id: js-alphabet-decoder-aliased-eval-stage
    desc: JavaScript alphabet decoder executes its result through aliased eval
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1059.007
    mbc: B0032
    scope: file
    all:
      - id: micro-behaviors/data/decode/custom::js-alphabet-coded-decoder-source
      - id: micro-behaviors/data/decode/custom::js-charcode-byte-mask
      - id: micro-behaviors/process/interpreter/eval::js-eval-alias-assignment
      - id: metadata/library/structure::js-medium-minified-line
    unless:
      - id: metadata/package/testing/

  - id: jsdom-dynamic-execution
    desc: Dynamic code execution within JSDOM sandbox
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/interpreter/vm::jsdom-run-scripts
      - id: micro-behaviors/process/interpreter/eval::js-eval-raw
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: eval-function-reference
    desc: eval passed as function reference
    crit: suspicious
    conf: 0.95
    attack: T1059.007
    any:
      - id: micro-behaviors/process/interpreter/runtime/eval::eval-as-first-arg
      - id: micro-behaviors/process/interpreter/runtime/eval::eval-as-last-arg
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/library/structure/
  - id: eval-transformed-code
    desc: eval() executing transformed code
    crit: notable
    conf: 0.94
    attack: T1059.007
    all:
      - id: micro-behaviors/process/interpreter/eval::js-eval-raw
      - id: eval-call-expression-arg
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/harness/runtime::v8-native-intrinsic-call
      - id: metadata/library/svga::svga-autoloader-bundle
      - id: objectives/execution/interpreter/eval/dynamic/
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: encrypted-array-function-stage
    desc: Encrypted byte array decoded and executed as a JavaScript stage
    crit: hostile
    conf: 0.97
    attack: "T1027, T1059.007, T1140"
    all:
      - id: objectives/anti-static/obfuscation/payload/jscript::embedded-encrypted-byte-array
      - id: objectives/anti-static/obfuscation/payload/jscript::embedded-secret-key-byte-array
      - id: micro-behaviors/process/interpreter/eval::js-charcode-constructor-stage
  - id: indirect-eval-decoded-stage
    desc: Indirect eval executes a decoded JavaScript stage
    crit: hostile
    conf: 0.96
    attack: "T1027, T1059.007, T1140"
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/string/conversion::js-fromcharcode-alias
      - id: micro-behaviors/process/interpreter/eval::js-indirect-eval-variable
    any:
      - id: micro-behaviors/data/control-flow/loop::js-length-loop-compound-add
      - id: metadata/file/metrics::js-extreme-digit-ratio-large-source
    unless:
      - id: objectives/anti-static/obfuscation/payload/container::source-map-extension
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/package/testing/
      - id: metadata/library/structure::vscode-extension-generated-asset
      - id: metadata/library/vscode::vscode-extension-out-output-path
      - id: metadata/library/mermaid::mermaid-bundle-marker
      - id: well-known/app/browser/google-web::google-recaptcha-runtime

  - id: javascript-remote-encoded-command-invocation
    desc: JavaScript pairs a fetched PHP endpoint with an encoded command API
    crit: hostile
    conf: 0.995
    attack: T1105,T1059.007,T1027
    all:
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-encoded
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/process/interpreter/eval::js-base64-decoded-computed-call
    unless:
      - id: metadata/package/testing/

  - id: webextension-all-url-remote-eval
    desc: All-URL extension executes WebSocket commands
    crit: hostile
    conf: 0.995
    attack: T1059.007,T1071.001,T1176
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: string-command-eval-marker
      - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
      - id: micro-behaviors/process/interpreter/eval::js-eval-variable-argument
      - id: metadata/permission/manifest::host-permission-all-urls

  - id: webextension-synced-task-code-execution
    desc: All-site extension executes code supplied through synced task storage
    crit: hostile
    conf: 0.995
    attack: T1059.007,T1176
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: metadata/permission/manifest::permission-all-urls
      - id: synced-extension-task-field
      - id: synced-extension-task-code
      - id: micro-behaviors/data/db/web-storage::chrome-storage-sync
      - id: micro-behaviors/communications/http/url/path::browser-location-host-read

  - id: webextension-all-url-remote-code-injection
    desc: All-site extension injects remotely supplied code
    crit: hostile
    conf: 0.98
    attack: T1059.007,T1105,T1176
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: metadata/permission/manifest::is-chrome-manifest
      - id: metadata/permission/manifest::permission-scripting
      - id: metadata/permission/host::broad-host-access
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
      - id: micro-behaviors/process/inject/webextension::chrome-scripting-main-world
      - id: micro-behaviors/process/interpreter/eval::js-new-function-variable-argument
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: code-bearing-object-field-reference
    # Nothing in the legs above establishes where the injected code comes from
    # — `js-fetch-call` is any fetch — so the "remotely supplied" claim does not
    # survive an extension whose script source is a desktop client on the
    # loopback interface. That architecture (AI browser agents, automation
    # recorders, userscript bridges) matches every other leg by design.
    unless:
      - id: metadata/package/quality/benign-context::loopback-bridge-driven-extension

  - id: axios-payload-temporary-child-execution
    desc: Axios payload staged in a temporary script and child-launched
    crit: hostile
    conf: 0.995
    attack: T1059.007,T1105
    mbc: B0009.016,E1059
    near_lines: 150
    all:
      - id: micro-behaviors/communications/http/get::axios-get-call
      - id: objectives/anti-static/obfuscation/eval/dynamic::optional-response-record-value-ref
      - id: node-payload-template
      - id: node-temporary-payload-path
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync
      - id: micro-behaviors/fs/file/delete::fs-unlinkSync
      - id: metadata/import/builtin::require-child-process
    any:
      - id: micro-behaviors/process/create/spawn::fork-call
      - id: micro-behaviors/process/create/shell/bridge::js-exec
    unless:
      - id: metadata/package/testing/
