defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
traits:
- id: string-command-eval-marker
  desc: String command parser recognizes eval requests
  crit: notable
  conf: 0.98
  attack: T1059.007
  unless:
  - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
  - id: metadata/file/format/source-map::sourcemap
  if:
    type: text
    regex: (?i)(startsWith|includes)\(["']([\w./-]{0,24}[:/_-])?(eval|exec)\(
- id: js-interpreter-constructor-timeout
  desc: JavaScript interpreter constructor timeout
  crit: suspicious
  conf: 0.94
  attack: T1059.007
  if:
    type: text
    regex: 'new\s+(VM|NodeVM|Isolate)\s*\(\s*\w+\s*,\s*\{\s*timeout\s*:'
  unless:
  - id: metadata/package/testing/harness/runtime/
- id: js-interpreter-evaluate-call
  desc: JavaScript VM evaluate call
  crit: suspicious
  conf: 0.94
  attack: T1059.007
  if:
    type: text
    regex: \b(vm|nodevm|isolate)\.evaluate\s*\(\s*\w+\s*\)
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: well-known/lib/development/uglifyjs::compressor-source
  - id: well-known/lib/data/jsonata-legacy::jsonata-query-evaluate
- id: eval-contents-of-helper
  desc: eval(contentsOf(...)) Node test helper
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: eval(contentsOf(
- id: synced-extension-task-field
  desc: Reads synced browser task list
  crit: notable
  conf: 0.98
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: storage\.sync\.get\(\s*\[[^\]]{0,120}\btasks_r\b
- id: synced-extension-task-code
  desc: Executes code from synced browser task
  crit: suspicious
  conf: 0.99
  attack: T1059.007
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: new\s+Function\s*\(\s*task\.code\s*\)
- id: runtime-message-interpolated-code-field
  desc: Runtime message code built by interpolation
  crit: notable
  conf: 0.88
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: sendMessage\s*\(\s*\{[\s\S]{0,200}\bcode\s*:\s*[`"'"][^`"'"]{0,160}\$\{
  unless:
  - id: metadata/package/documentation/page::docusaurus-docs-bundle
- id: node-temporary-payload-path
  desc: Node temporary JavaScript payload path
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \btemp-payload-[\s\S]{0,80}\.(m?js)\b
- id: js-script-element-create
  desc: Creates a JavaScript script element
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'createElement\s*\([^)]{0,16}script'
- id: js-script-src-variable-assignment
  desc: Assigns a variable to a script source
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\.src\s*=\s*[A-Za-z_$][\w$]*'
composite_rules:
- id: js-dynamic-script-element-injection
  desc: Creates and appends a script with a variable source
  crit: suspicious
  conf: 0.94
  near_bytes: 1800
  all:
  - id: js-script-element-create
  - id: js-script-src-variable-assignment
  - id: metadata/lang/source/literal/value::append-child-literal
- id: xor-decoded-remote-script-element
  desc: XOR-decoded string is used as a dynamically injected script source
  crit: hostile
  conf: 0.97
  attack: T1027,T1059.007,T1105
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/data/decode/xor::js-base64-xor-decode-loop
