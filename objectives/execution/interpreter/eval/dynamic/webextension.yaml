defaults:
  platforms: [windows, unix]

composite_rules:
  - id: all-site-main-world-message-eval-bridge
    desc: All-site main-world extension evaluates page messages
    crit: suspicious
    conf: 0.98
    attack: T1059.007,T1176
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: metadata/permission/activation::content-script-main-world
      - id: metadata/permission/host::content-script-all-urls
      - id: micro-behaviors/communications/ipc/message::postmessage-listener
      - id: micro-behaviors/process/interpreter/eval::js-eval-raw
