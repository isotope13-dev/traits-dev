defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1059.007
traits:
  - id: noop-delay-loop
    desc: No-op loop delay padding
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'for\s*\(\s*var\s+\w+\s*=\s*\d+\s*;\s*\w+\s*<\s*\d+\s*;\s*\w+\+\+\s*\)\s*\{\s*\}'
composite_rules:
  - id: large-numeric-reconstructed-code-execution
    desc: Large numeric JavaScript payload executes reconstructed code
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.007
    all:
      - id: metadata/file/profile/text-shape::js-extreme-digit-ratio-large-source
      - id: micro-behaviors/data/string/conversion::fromcharcode-call
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
  - id: xor-array-eval-loader
    desc: XOR-decoded array and dynamic evaluation occur nearby
    crit: suspicious
    conf: 0.98
    # A file-wide XOR decoder plus any eval is common in bundled applications:
    # e.g. encoded lookup tables and a compatibility eval("require") helper.
    # Keep the finding to nearby code; proximity does not claim data flow.
    scope: file
    near_bytes: 131072
    all:
      - id: micro-behaviors/data/decode/xor::js-character-xor-near-numeric-array
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
      - id: micro-behaviors/metaprogramming/generation::embedded-eval-variable-source
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-call-expression-arg
  - id: xor-array-function-loader
    desc: JavaScript XOR array Function loader
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/xor::js-character-xor-near-numeric-array
      - id: micro-behaviors/metaprogramming/generation::js-new-function-variable-argument
    any:
      - id: noop-delay-loop
      - id: micro-behaviors/os/com/automation::activex-constructor-call
  # XOR and Base64 decoding may be separate helpers; proximity does not prove
  # that their output is the source passed to Function.
  - id: xor-base64-function-cooccurrence
    desc: XOR and Base64 decoding near a Function constructor
    crit: suspicious
    conf: 0.98
    attack: T1027,T1059.007
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/decode/xor::fromcharcode-xor-rebuild
      - id: micro-behaviors/data/decode/base64::atob-decode
      - id: micro-behaviors/metaprogramming/generation::js-new-function-variable-argument
  - id: xor-array-com-stage-loader
    desc: JavaScript XOR array COM stage loader
    crit: suspicious
    conf: 0.97
    scope: file
    near_bytes: 131072
    all:
      - id: micro-behaviors/data/decode/xor::js-character-xor-near-numeric-array
    any:
      - id: micro-behaviors/os/com/automation::activex-constructor-call
      - id: micro-behaviors/communications/http/client/xmlhttp::msxml-xmlhttp-progid-text
      - id: micro-behaviors/fs/write/file/stream::adodb-stream
    unless:
      - id: well-known/lib/crypto/node-forge::node-forge-crypto-library

  # Wacatac-style PDF.js lures keep WScript/PowerShell strings inside XOR
  # numeric arrays while cleartext still shows DeleteFile of staged .vbs
  # paths. Pairing the XOR reconstructor with FSO cleanup and the huge
  # string-table blob catches future XOR-array script droppers even when
  # CreateObject/WScript never appear as literals.
  - id: xor-array-staged-file-cleanup-dropper
    desc: XOR-array JavaScript dropper cleans staged files
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.007,T1070.004
    all:
      - id: micro-behaviors/data/decode/xor::js-character-xor-near-numeric-array
      - id: micro-behaviors/fs/delete/file/library::wsh-deletefile-call
      - id: metadata/file/profile/string-population::js-many-very-long-strings
