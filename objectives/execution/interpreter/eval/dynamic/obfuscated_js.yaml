# Obfuscated Dynamic Execution Patterns (JavaScript)
# Detects evasive eval usage
# ATT&CK: T1027 + T1059.007
defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  # The first indexed coercion constructs "f"; two computed properties then
  # reach Function and pass a generated body. The hostile composite below
  # requires this head and the immediate invocation suffix in one JSFuck run.
  - id: jsfuck-computed-constructor-head
    desc: JSFuck computed constructor call head
    crit: suspicious
    conf: 0.94
    for: [javascript, html]
    if:
      type: text
      regex: '\(!\[\]\+\[\]\)\[\+\[\]\]\[[\s\S]{0,240}\]\[[\s\S]{0,240}\]\('

  - id: immediate-call-suffix
    desc: Obfuscated table value immediately invoked
    crit: suspicious
    conf: 0.9
    for: [javascript, html]
    if:
      type: text
      regex: '\$\w+\[(\d+|[!+{}\[\]]{1,160})\]\)\(\)\s*;'

  # Indirect execution through this[eval|Function|constructor]. A generic
  # computed dispatch such as this[type]() is ordinary library code and is
  # intentionally excluded.
  - id: js-indirect-eval-this
    desc: Indirect eval through named object property
    crit: notable
    conf: 0.8
    attack: "T1059.007"
    if:
      type: text
      regex: 'this\[\s*(eval|Function|constructor)\s*\]\s*\('
    unless:
      - id: well-known/lib/web/
      - id: well-known/lib/ui/ckeditor/distribution/
      # this[mangledName]() is ordinary computed method dispatch in minified
      # bundles (e.g. transformers.js), not indirect eval. js-known-bundler-output
      # subsumes webpack/esbuild/large-module/large-minified output.
      - id: metadata/build/
  - id: js-indirect-eval-this-assign
    desc: Indirect eval through variable alias
    crit: notable
    conf: 0.8
    attack: "T1059.007"
    if:
      type: text
      regex: '\b\w+\s*=\s*this\[\s*[''"]?(eval|Function)[''"]?\s*\]'
      case_insensitive: true
    unless:
      - id: metadata/build/generated::laya-engine-runtime-marker
      - id: well-known/lib/format/marked/
      - type: basename
        regex: '(^jsbn(-combined|2)?\.js$|\.m?js\.map$)'
      - type: basename
        regex: (^|[\\/])(.+[\\/])?node_modules[\\/]ipv6[\\/]
      - type: basename
        regex: (^|[\\/])builtin-plugins[\\/]tabby-terminal[\\/]dist[\\/]
      - type: basename
        regex: ^(rimraf|run-(script-)?os|ipv6(grep)?)$
  # An obfuscator-style computed global evaluator lookup.
  - id: js-indirect-eval-window-mangled
    desc: window[_0x...] obfuscator bracket lookup
    crit: suspicious
    conf: 0.8
    attack: "T1059.007"
    if:
      type: text
      regex: '(window|self|global)\[_0x[a-fA-F0-9]+\]\('
    downgrade:
      any:
        - id: metadata/build/bundler/asset::js-large-module-bundle
        - id: micro-behaviors/process/interpreter/vm/
  # Construction of "eval" string (e.g., 'e'+'val')
  - id: js-eval-construction
    desc: Constructed eval string
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '[''"]e[''"]\s*\+\s*[''"]val[''"]'
  - id: js-ascii-char-map-prefix
    desc: ASCII char map array prefix
    crit: suspicious
    conf: 0.96
    size_max: 20000
    if:
      type: text
      substr: "var EFUpp=['','','','','','','','','','','"
  - id: js-parseint-tostring-remap
    desc: parseInt toString radix remap
    crit: suspicious
    conf: 0.93
    size_max: 20000
    if:
      type: text
      regex: 'parseInt\(\w+,\w+\);\w+=\w+\.toString\(\w+\);'
  - id: js-char-map-radix-lookup
    desc: Char map radix lookup return
    crit: suspicious
    conf: 0.92
    size_max: 20000
    if:
      type: text
      substr: return EFUpp[jYAdx(
composite_rules:
  # JSFuck alone is evasive but can also be an inert or non-executing string.
  # The coercion-built constructor head and immediate invocation in the same
  # encoded run establish concealed dynamic code execution.
  - id: jsfuck-dynamic-code-execution
    desc: JSFuck immediately invokes a generated function
    crit: hostile
    conf: 0.96
    attack: T1027.002,T1059.007
    mbc: B0032
    for: [javascript, html]
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::jsfuck-pattern
      - id: jsfuck-computed-constructor-head
      - id: immediate-call-suffix
    near_bytes: 20000

  - id: js-assign-common-root
    desc: Common global object assignment (root, self, global)
    crit: notable
    conf: 0.9
    size_max: 50000
    any:
      - id: micro-behaviors/data/source/language::js-global-object-alias-assignment
      - id: micro-behaviors/data/source/language::js-global-object-self-assignment
  - id: js-ascii-map-eval-reconstruction
    desc: ASCII-map numeric decoder feeding eval
    crit: hostile
    conf: 0.98
    all:
      - id: js-ascii-char-map-prefix
      - id: js-parseint-tostring-remap
      - id: micro-behaviors/data/arithmetic::js-parsefloat-nan-check
      - id: js-char-map-radix-lookup
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
    any:
      - id: objectives/anti-static/obfuscation/code-metrics/structure::minified-code
      - id: objectives/anti-static/obfuscation/string/conceal::js-junk-math-1
