defaults:
  for: [groovy]
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.84

traits:
  - id: groovy-dynamic-evaluate
    desc: GroovyShell or Eval dynamically evaluates script
    if:
      type: text
      regex: 'GroovyShell[\s\S]{0,80}\.evaluate\s*\(|\bEval\.me\s*\(\s*["'']|\bevaluate\s*\(\s*["'']'
    unless:
      - id: metadata/package/testing/presence/harness::test-fixture-directory
      - id: metadata/build/artifact::gradle-build-script-basename
      - type: path
        dirname: true
        regex: '(^|[\\/])tests?([\\/]|$)'
