# HTA files that are bare <html> run by extension: mshta does not require
# the HTA:APPLICATION element, so element-gated encoded-script rules miss
# them. This convicts the launcher instead — split-string eval feeding a
# concatenation-split script write next to a Script Encoder block — which
# only an encoded-payload stager combines in one full-trust document.
defaults:
  platforms: [windows]
  for: [html]

composite_rules:
  - id: hta-screnc-eval-launcher
    desc: HTA launches encoded script through eval-built code
    crit: hostile
    conf: 0.98
    attack: T1218.005,T1059.007,T1027
    all:
      - id: metadata/file/extension/identity::hta-html-application-extension
      - id: metadata/file/encoding::microsoft-script-encoder-text-marker
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-concat-string
      - id: micro-behaviors/ui/window/insert-html::split-tag-document-write
    near_bytes: 2048
