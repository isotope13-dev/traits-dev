defaults:
  platforms: [windows]
  for: [vbs, html]

composite_rules:
  - id: hta-media-dynamic-eval-profile
    desc: HTA media element near dynamic script eval
    crit: suspicious
    conf: 0.99
    attack: T1218.005
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: metadata/document/html::hta-media-element-reference
    any:
      - id: objectives/anti-static/obfuscation/eval/scripting/host::wsh-reconstructed-payload-exec
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
