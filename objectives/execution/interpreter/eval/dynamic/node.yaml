defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-vm
    desc: Executing code via Node.js VM
    crit: notable
    conf: 0.9
    unless:
      - id: metadata/package/testing/harness/runtime::test-basename-spec
    if:
      type: string_literal
      regex: vm\.runIn(New)?Context
    downgrade:
      any:
        - id: metadata/package/testing/harness/runtime/
composite_rules:
  - id: node-capable-massive-unicode-function-loader
    desc: Enormous Unicode-escaped Function executes with Node require access
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007
    all:
      - id: objectives/anti-static/obfuscation/eval/loader::massive-unicode-string-function-loader
      - id: micro-behaviors/os/module/require::node-require-returning-getter
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/llm-scanner/
