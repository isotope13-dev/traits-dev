defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-vm
    desc: Executing code via Node.js VM
    crit: notable
    conf: 0.9
    unless:
      - id: metadata/package/testing/harness/runtime::test-basename-spec
    if:
      type: string_literal
      regex: vm\.runIn(New)?Context
    downgrade:
      any:
        - id: metadata/package/testing/harness/runtime/
        - id: metadata/package/testing/harness/runtime/
composite_rules:
  - id: node-capable-permutation-eval
    desc: Permutation-decoded stage executes with Node require access
    crit: hostile
    conf: 0.98
    attack: T1059.007
    all:
      - id: objectives/anti-static/obfuscation/eval/loader::node-capable-indexed-stage-loader
      - id: objectives/anti-static/obfuscation/eval/loader::numeric-stage-function-run
    unless:
      - id: metadata/package/testing/
      - id: metadata/library/structure::js-large-module-bundle
