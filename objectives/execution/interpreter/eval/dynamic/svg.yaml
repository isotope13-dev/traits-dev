defaults:
  platforms: [windows, unix]
  for: [svg]
  attack: T1059.007
  mbc: B0032
traits:
  - id: svg-hex-constructor-token
    desc: Hex-escaped constructor property name
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '\x63\x6f\x6e\x73\x74\x72\x75\x63\x74\x6f\x72'

  - id: svg-hex-fromcharcode-token
    desc: Hex-escaped fromCharCode property name
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '\x66\x72\x6f\x6d\x43\x68\x61\x72\x43\x6f\x64\x65'

composite_rules:
  - id: svg-hex-encoded-constructor-property
    desc: Hex-escaped constructor property chain
    crit: suspicious
    conf: 0.93
    all:
      - id: svg-hex-constructor-token
      - id: svg-hex-fromcharcode-token
    # The constructor call and the fromCharCode decode sit in one script,
    # with the decoder loop between them. 400 bytes split that pair.
    near_bytes: 2048
  - id: svg-constructor-property-chain
    desc: SVG bracketed constructor property chain
    crit: suspicious
    conf: 0.93
    # Keep the constructor alternative tied to actual SVG document content.
    # Besides improving precision, the required content leg prevents this
    # composite from being discarded as a low-value one-of alias.
    all:
      - id: metadata/file/format/markup::svg-document-namespace
    any:
      - id: micro-behaviors/data/source/property/read::js-bracket-constructor-property-read
      - id: svg-hex-encoded-constructor-property
  - id: svg-base64-literal
    desc: Base64-like string inside SVG script
    crit: notable
    conf: 0.86
    all:
      - id: micro-behaviors/data/format/html::html-svg-script-element
      - id: micro-behaviors/data/encode/base64::svg-base64-string
    near_bytes: 4096
