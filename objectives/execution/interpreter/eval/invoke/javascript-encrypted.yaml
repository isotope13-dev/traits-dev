# Compilation evidence in a concealed WSH stager, rather than a policy bypass.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027,T1059.001,T1059.007

composite_rules:
  - id: obfuscated-wsh-encrypted-scriptblock-stager
    desc: Obfuscated WSH stages encrypted ScriptBlock code
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/interpreter/jscript::activex-object
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
      - id: micro-behaviors/fs/write/content::create-text-file-api
      - id: micro-behaviors/process/create/script/wsh::wscript-marker
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/process/interpreter/eval/compile::encoded-powershell-scriptblock-constructor
