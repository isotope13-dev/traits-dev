# PowerShell Dynamic Execution
# MBC: E1059 (Command and Scripting Interpreter)
# ATT&CK: T1059.001
defaults:
  platforms: [unix, windows]
  for: [powershell, batch, shell]
  mbc: "E1059"
  attack: "T1059.001"
traits:
  - id: iex-via-verbose-preference
    desc: IEX rebuilt from $VerbosePreference
    crit: suspicious
    conf: 0.95
    for: [powershell]
    attack: T1027
    mbc: E1027
    if:
      type: text
      regex: \$VerbosePreference(\.[A-Za-z]+\(\))?\s*(\.substring|\[\d+)
      case_insensitive: true
  - id: call-operator-get-command-dynamic
    desc: Dynamic call-operator via Get-Command
    crit: suspicious
    conf: 0.9
    for: [powershell]
    if:
      type: text
      regex: '&\s*\(\s*Get-Command\s+\$[A-Za-z_][A-Za-z0-9_]*\s*\)'
      case_insensitive: true
  - id: wildcard-get-command-iex
    desc: Wildcard lookup resolves IEX
    crit: suspicious
    conf: 0.97
    for: [powershell]
    attack: T1027
    mbc: E1027
    if:
      type: text
      regex: '(?i)Get-Command\s+\*voke-\*pression'
  - id: call-operator-get-command-scriptblock
    desc: Get-Command ScriptBlock invocation
    crit: suspicious
    conf: 0.95
    for: [powershell]
    if:
      type: text
      regex: '&\s*\(\s*(gcm|Get-Command)\s+[A-Za-z0-9_$:-]{3,}\s*\)\.ScriptBlock\b'
      case_insensitive: true
  - id: call-operator-gcm-wildcard-iex
    desc: Wildcard Get-Command resolves IEX
    crit: suspicious
    conf: 0.95
    for: [powershell]
    attack: T1027
    mbc: E1027
    if:
      type: text
      regex: '&\s*\(\s*(gcm|Get-Command)\s+i\*{8,}x\s*\)'
      case_insensitive: true
composite_rules:
  - id: ast-getscriptblock-reference
    desc: PowerShell GetScriptBlock method token
    crit: notable
    conf: 0.94
    for: [powershell, batch]
    any:
      - id: metadata/lang/source/syntax/member::powershell-getscriptblock-method
      - id: objectives/anti-static/obfuscation/string/reverse::reversed-getscriptblock-token

  - id: powershell-hex-xor-multi-eval-loader
    desc: PowerShell executes a hex-XOR payload through eval fallbacks
    crit: hostile
    conf: 0.99
    attack: "T1027,T1140,T1059.001"
    mbc: "B0032,C0043,E1059"
    for: [powershell]
    all:
      - id: micro-behaviors/data/encode/payload::powershell-hex-here-string-carrier
      - id: micro-behaviors/data/encoding/xor::powershell-modulo-xor-references
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-multiple-eval-paths

  - id: obfuscated-scriptblock-loader
    desc: Obfuscated PowerShell ScriptBlock loader
    crit: hostile
    conf: 0.99
    for: [powershell]
    all:
      - id: metadata/file/line::powershell-long-line-count
      - id: micro-behaviors/process/interpreter/reflection/dispatch::powershell-call-operator
      - id: micro-behaviors/metaprogramming/generation::powershell-scriptblock-constructor-text
      - id: objectives/anti-static/obfuscation/string/reconstruct::single-char-concat-pattern

  - id: powershell-obfuscated-reflection-scriptblock-loader
    desc: Obfuscated PowerShell payload invokes reflected code
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1129
    mbc: B0032,E1059
    for: [powershell]
    all:
      - id: objectives/anti-static/obfuscation/string/fragmentation::powershell-obfuscated-byte-loader
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-reflection-method-enumeration
      - id: micro-behaviors/metaprogramming/generation::powershell-scriptblock-constructor-text

  - id: obfuscated-powershell-file-write-dynamic-invoke
    desc: Obfuscated PowerShell decodes and dynamically invokes code while writing a file
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.001
    mbc: B0032,E1059
    for: [powershell]
    scope: file
    all:
      - id: micro-behaviors/data/arithmetic::powershell-indexed-arithmetic-assignment
      - id: micro-behaviors/data/control-flow/dispatch::powershell-variable-call-operator
      - id: metadata/file/literal::powershell-numeric-array-8-plus
      - id: micro-behaviors/fs/write/file/full::out-file

  # A variable call operator is common PowerShell control flow. Require
  # stronger obfuscation evidence so ordinary indexed arithmetic used by
  # installers does not become a staged-eval finding.
  - id: obfuscated-powershell-staged-dynamic-eval
    desc: PowerShell dynamically invokes code with opaque transform evidence
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.001
    mbc: B0032,E1059
    for: [powershell, batch]
    near_lines: 20
    all:
      - id: micro-behaviors/data/control-flow/dispatch::powershell-variable-call-operator
    any:
      - id: objectives/anti-static/obfuscation/instruction/junk::powershell-arithmetic-opaque-junk
      - id: micro-behaviors/crypto/symmetric/xor/rotational::powershell-xor-rotate-transform

  - id: ps-scriptblock-call-operator-invoke
    desc: ScriptBlock invoked via PowerShell call operator
    crit: component
    conf: 0.9
    for: [powershell]
    any:
      - id: micro-behaviors/process/interpreter/reflection/dispatch::powershell-call-operator
      - id: micro-behaviors/data/control-flow/dispatch::powershell-variable-call-operator
  - id: base64-xor-scriptblock-loader
    desc: Base64 plus XOR decoded scriptblock loader
    crit: hostile
    conf: 0.97
    for: [powershell]
    all:
      - id: micro-behaviors/metaprogramming/generation::powershell-scriptblock-constructor-text
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/data/encoding/xor::powershell-modulo-xor-references
      - id: ps-scriptblock-call-operator-invoke

  - id: base64-decode-to-iex
    desc: PowerShell base64 decode to IEX
    crit: suspicious
    conf: 0.95
    for: [powershell]
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
      - id: micro-behaviors/data/decode/base64::from-base64-string-concat
  - id: base64-xor-decode-to-iex
    desc: PowerShell Base64 XOR decode to IEX
    crit: hostile
    conf: 0.98
    for: [powershell]
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/crypto/symmetric/xor/loop::indexed-bxor-loop
      - id: metadata/file/line::powershell-long-line
  - id: powershell-base64-xor-reflected-loader
    desc: PowerShell Base64/XOR and reflected execution
    crit: hostile
    conf: 0.97
    attack: T1027,T1140,T1059.001,T1620
    mbc: B0032.001,E1059
    for: [powershell]
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/crypto/symmetric/xor/loop::indexed-bxor-byte-cast-rhs
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-method-invoke
  - id: powershell-remote-wildcard-eval
    desc: PowerShell downloads text and evaluates it through wildcard command resolution
    crit: hostile
    conf: 0.99
    for: [powershell]
    attack: T1105,T1059.001,T1027
    mbc: B0024,E1059,E1027
    all:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-downloadstring
      - id: wildcard-get-command-iex

  - id: powershell-aes-decrypt-scriptblock-execute
    desc: AES-decrypted ScriptBlock executed in-process
    crit: hostile
    conf: 0.98
    for: [powershell]
    attack: T1027,T1140,T1059.001
    mbc: B0030,E1059
    all:
      - id: objectives/anti-static/obfuscation/payload/encrypted::powershell-aes-wrapped-script-construction
      - id: micro-behaviors/data/control-flow/dispatch::powershell-variable-call-operator

  - id: powershell-task-xml-remote-eval
    desc: Remote task XML plus wildcard PowerShell eval
    crit: hostile
    conf: 0.99
    for: [powershell]
    attack: T1053.005,T1105,T1059.001
    mbc: F0012,B0024,E1059
    all:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-downloadstring
      - id: micro-behaviors/os/autorun/scheduled::powershell-schtasks-xml-create
      - id: wildcard-get-command-iex
  - id: base64-rc4-gzip-scriptblock-loader
    desc: PowerShell Base64 RC4 gzip ScriptBlock loader
    crit: hostile
    conf: 0.98
    for: [powershell]
    all:
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/crypto/symmetric/xor/rotational::rotation-counter-update
      - id: micro-behaviors/data/decompress/gzip::gzip-decompression-stream
      - id: call-operator-get-command-scriptblock
      - id: metadata/file/line::powershell-long-line
  - id: encoded-base64-decode-to-iex
    desc: Encoded PowerShell base64 decode to IEX
    crit: suspicious
    conf: 0.95
    for: [batch, powershell, vbs, html]
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::base64-powershell-eval-command
      - id: micro-behaviors/data/decode/base64::encoded-dotnet-frombase64string-text
    unless:
      # The help example is the generator's own printed launcher, not a run.
      - id: well-known/tool/offensive/powersploit::powersploit-out-encoded-command
  - id: encoded-base64-decode-to-scriptblock
    desc: Encoded PowerShell base64 decode to ScriptBlock
    crit: suspicious
    conf: 0.95
    for: [batch, powershell, vbs, html]
    near_bytes: 4096
    all:
      - id: micro-behaviors/metaprogramming/generation::encoded-powershell-scriptblock-constructor
      - id: micro-behaviors/data/decode/base64::encoded-dotnet-frombase64string-text
  - id: powershell-concatenated-base64-reflection-execution
    desc: PowerShell concatenates Base64 and executes reflected script code
    crit: hostile
    conf: 0.99
    for: [powershell]
    attack: T1027,T1140,T1059.001
    all:
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-method-invoke
      - id: micro-behaviors/metaprogramming/generation::powershell-scriptblock-constructor-text
    any:
      - id: micro-behaviors/data/decode/base64::from-base64-string-concat
      - id: micro-behaviors/data/decode/base64::base64-decoder-near-reflection-method-lookup
  - id: powershell-compressed-stage-write-launch
    desc: PowerShell decodes compressed stage and launches it
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1059.001
    mbc: B0032,E1059
    for: [powershell]
    all:
      - id: metadata/file/encoding::multiple-long-base64-literals
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-method-invoke
      - id: micro-behaviors/data/decompress/gzip::gzip-decompression-stream
      - id: micro-behaviors/fs/write/file/full::write-all-text
      - id: micro-behaviors/process/create/exec::start-process-call
    any:
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/fs/path/application/executable::powershell-executable-token
  - id: ps-encoded-scriptblock-addtype
    desc: PowerShell encoded scriptblock
    crit: hostile
    conf: 0.98
    for: [powershell]
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
      - id: micro-behaviors/process/interpreter/eval/constructed::powershell-invoke-scriptblock-command
      - id: micro-behaviors/metaprogramming/generation::powershell-add-type
      - id: micro-behaviors/data/encode/base64::to-base64-string
  - id: ps-custom-base32-decoded-script-execution
    desc: Custom base32 decoded script execution
    crit: hostile
    conf: 0.99
    for: [powershell]
    all:
      - id: micro-behaviors/data/decode/base32::ps-custom-base32-decoder
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call

  - id: powershell-http-tasking-command-eval
    desc: PowerShell evaluates commands returned by HTTP tasking
    crit: hostile
    conf: 0.99
    attack: T1071.001,T1059.001
    mbc: B0030
    for: [powershell]
    all:
      - id: micro-behaviors/communications/http/client/resource::powershell-register-endpoint-request
      - id: micro-behaviors/communications/http/request/route::powershell-poll-route-request
      - id: objectives/command-and-control/dropper/script-eval/response-pipeline::ps-c2-report-endpoint
      - id: objectives/command-and-control/dropper/script-eval/response-pipeline::ps-remote-command-response-field
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::request-powershell
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call

  - id: powershell-char-iex-aliased-curl
    desc: Char-built IEX runs aliased curl
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.001,T1105
    for: [powershell]
    all:
      - id: micro-behaviors/process/interpreter/eval/indirect::powershell-char-built-iex
      - id: micro-behaviors/process/interpreter/eval/indirect::powershell-set-alias-curl-concat
      - id: micro-behaviors/communications/http/client/library::useb-flag

  - id: powershell-offset-char-iex-stager
    desc: Offset-decoded payload evaluated via IEX
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.001
    for: [powershell]
    all:
      - id: micro-behaviors/data/encode/char-code::powershell-offset-char-decode
      - id: micro-behaviors/process/interpreter/eval/indirect::powershell-char-built-iex

  - id: powershell-offset-char-aliased-curl
    desc: Offset-decoded URL fetched via aliased curl
    crit: hostile
    conf: 0.96
    attack: T1027,T1105
    for: [powershell]
    all:
      - id: micro-behaviors/data/encode/char-code::powershell-offset-char-decode
      - id: micro-behaviors/process/interpreter/eval/indirect::powershell-set-alias-curl-concat

  - id: powershell-hex-xor-substring-iex
    desc: Hex XOR stage invoked via Substring IEX
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.001,T1140
    for: [powershell, python, text]
    all:
      - id: micro-behaviors/data/encode/char-code::powershell-hex-pair-bxor
      - id: micro-behaviors/data/encode/char-code::powershell-call-substring-iex

  # IEX over an offset/count slice of a file's bytes: the script executes
  # code stored inside another file rather than the file itself, the shape of
  # a loader whose payload rides in a carrier. Loading a whole .ps1 through
  # IEX has no reason to pick a byte range.
  - id: powershell-iex-file-byte-range
    desc: Executes a byte range of a file as script
    crit: suspicious
    conf: 0.94
    for: [powershell]
    attack: T1059.001,T1027.003
    near_lines: 2
    all:
      - id: micro-behaviors/data/buffer/carve::powershell-file-range-to-string
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
