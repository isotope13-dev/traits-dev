# Shell/Code Execution - Generic
# MBC: E1059 (Command and Scripting Interpreter)
# ATT&CK: T1059
defaults:
  attack: T1059
  mbc: E1059
  platforms: [unix, windows]
composite_rules:
- id: dotnet-deserialized-reflective-exec
  desc: Unsigned .NET binary deserializes and reflectively invokes code
  crit: hostile
  conf: 0.96
  for: [pe, dll]
  attack: T1059,T1140
  all:
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/data/serialize/unsafe::binary-formatter
  - id: micro-behaviors/data/embedded/payload/resource::assemblyresolve-hook
  - id: micro-behaviors/process/interpreter/reflection/runtime::invoke-member-token
  - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
  unless:
  - id: metadata/signed/platform/
  # A self-contained single-file publish bundles the entire BCL (BinaryFormatter,
  # AppDomain.AssemblyResolve, reflection InvokeMember, File.ReadAllBytes) as
  # metadata string tables inside the native host stub. Those are the runtime
  # library's own API surface, not the application calling them together.
  - id: metadata/binary/framework::dotnet-singlefilehost-runtime
  - id: metadata/binary/framework::dotnet-framework-api-surface
  # The framework's own assemblies. `dotnet-framework-api-surface` covers the
  # single-file host that inlines the BCL; this covers the BCL shipped as
  # discrete DLLs. Windows 11's netfx3 on-demand CAB carries System.Web.dll and
  # System.Workflow.ComponentModel.dll, which *implement* BinaryFormatter and
  # reflective invoke -- and are catalog-signed, not Authenticode-signed, so the
  # `unsigned-missing-signature-record` leg above matches them.
  - id: well-known/lib/runtime/managed/dotnet-runtime::microsoft-dotnet-system-assembly-original
  - id: well-known/tool/sysadmin/chocolatey::official-library-dll

- id: shell-eval
  desc: Dynamic code evaluation
  crit: notable
  conf: 0.66
  for: [shell]
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::shell-eval
  unless:
  - id: metadata/build/autotools/
  - id: well-known/tool/development/cli/fzf::fzf-binary
  - id: metadata/file/format/structured::sourcemap-sources-content
