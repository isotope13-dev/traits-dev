# Shell/Code Execution - Generic
# MBC: E1059 (Command and Scripting Interpreter)
# ATT&CK: T1059
defaults:
  attack: T1059
  mbc: E1059
  platforms: [unix, windows]
composite_rules:
# The deserialization leg requires Deserialize *syntax* on the
# BinaryFormatter, not the mere type reference: a bare BinaryFormatter
# mention is satisfied by serialize-only helpers (the classic
# serialize-to-a-MemoryStream object-size probe, which never touches
# untrusted bytes) that ship inside large line-of-business suites next to
# COM late-binding, assembly probing resolvers and full-file reads. Those
# suites match every other leg here without deserializing anything, so
# presence alone convicts them of "deserializes and reflectively invokes
# code" they never perform. The syntax atom is a component precisely
# because it is only the call shape; this composite supplies the
# surrounding load/invoke chain that turns the shape into the attack.
- id: dotnet-deserialized-reflective-exec
  desc: Unsigned .NET binary deserializes and reflectively invokes code
  crit: hostile
  conf: 0.96
  for:
  - pe
  - dll
  attack: T1059,T1140
  all:
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/data/serialize/unsafe::binary-formatter-deserialize-syntax
  - id: micro-behaviors/process/interpreter/runtime/clr::assembly-resolve-event-api
  - id: micro-behaviors/process/interpreter/reflection/runtime::invoke-member-token
  - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework::dotnet-singlefilehost-runtime
  - id: metadata/binary/framework::dotnet-framework-api-surface
  - id: well-known/lib/runtime/managed/dotnet-runtime::microsoft-dotnet-system-assembly-original
  - id: well-known/tool/sysadmin/chocolatey::official-library-dll
  - id: well-known/tool/offensive/peas::winpeas-current-audit-assembly
- id: shell-eval
  desc: Dynamic code evaluation
  crit: notable
  conf: 0.66
  for: [shell]
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::shell-eval
  unless:
  - id: metadata/build/autotools/
  - id: well-known/tool/development/cli/fzf::fzf-binary
  - id: metadata/file/format/source-map::sourcemap-sources-content
