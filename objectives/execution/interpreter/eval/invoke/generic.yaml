# Shell/Code Execution - Generic
# MBC: E1059 (Command and Scripting Interpreter)
# ATT&CK: T1059
defaults:
  attack: T1059
  mbc: E1059
  platforms: [unix, windows]
traits:
- id: python-runpy-basename
  desc: Python runpy stdlib file
  crit: notable
  conf: 0.95
  for: [python]
  if:
    type: path
    basename: true
    exact: runpy.py
- id: python-optparse-basename
  desc: Python optparse stdlib file
  crit: notable
  conf: 0.95
  for: [python]
  if:
    type: path
    basename: true
    exact: optparse.py
composite_rules:
- id: dotnet-deserialized-reflective-exec
  desc: Unsigned .NET binary deserializes and reflectively invokes code
  crit: hostile
  conf: 0.96
  for: [pe, dll]
  attack: T1059,T1140
  all:
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/data/serialize/unsafe::binary-formatter
  - id: micro-behaviors/data/embedded/payload/resource::assemblyresolve-hook
  - id: micro-behaviors/process/interpreter/reflection/runtime::invoke-member-token
  - id: micro-behaviors/fs/file/read::dotnet-readallbytes-token
  unless:
  - id: metadata/signed/platform/
  # A self-contained single-file publish bundles the entire BCL (BinaryFormatter,
  # AppDomain.AssemblyResolve, reflection InvokeMember, File.ReadAllBytes) as
  # metadata string tables inside the native host stub. Those are the runtime
  # library's own API surface, not the application calling them together.
  - id: metadata/binary/framework::dotnet-singlefilehost-runtime

- id: shell-eval
  desc: Dynamic code evaluation
  crit: notable
  conf: 0.66
  for: [shell]
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::shell-eval
  unless:
  - id: metadata/build/autotools/
  - id: well-known/tool/development/fzf::fzf-binary
  - id: metadata/file/format/structured::sourcemap-sources-content
- id: python-eval
  desc: Python dynamic code evaluation
  crit: notable
  conf: 0.5
  for: [python]
  any:
  - id: micro-behaviors/process/interpreter/python::eval-builtin
  - id: micro-behaviors/process/interpreter/python::exec-builtin
  - id: micro-behaviors/process/interpreter/python::compile-builtin
  unless:
  - id: python-runpy-basename
  - id: python-optparse-basename
  - id: metadata/library/python-stdlib
  - id: metadata/package/testing/presence/harness::python-test-file
  - id: metadata/package/testing/presence/harness/
  - id: well-known/lib/ai/scikit-learn
  - id: well-known/lib/core/psutil/
  - id: well-known/tool/detection/security-scanner::code-pattern-catalog
