defaults:
  platforms: [windows]
  for: [data]
composite_rules:
  - id: untyped-powershell-aes-decrypt-then-scriptblock-invoke
    desc: AES-decrypted text run as ScriptBlock
    crit: hostile
    conf: 0.95
    attack: T1059.001
    all:
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-aes-managed-untyped
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor-untyped
      - id: micro-behaviors/metaprogramming/generation::powershell-scriptblock-constructor-untyped
      - id: micro-behaviors/process/interpreter/eval/constructed::powershell-scriptblock-invoke-return-untyped
