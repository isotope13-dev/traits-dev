defaults:
  platforms: [windows]
  for: [html]
composite_rules:
  - id: concealed-hta-compressed-powershell-eval
    desc: Fragmented COM launches hidden compressed eval
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1027,T1564.003
    all:
      - id: micro-behaviors/os/com/automation::activex-concatenated-progid
      - id: objectives/execution/interpreter/eval/invoke::encoded-base64-decode-to-iex
      - id: micro-behaviors/data/decompress/gzip::wsh-gzipstream-reference
      - id: objectives/execution/interpreter/script/wsh::powershell-bypass-hidden
    # Either Run-invocation shape establishes the launch role:
    # script-run-method-call is case-sensitive by design (lowercase .run(
    # is a common pipeline helper), while run-zero-style-argument matches
    # the hidden-window `, 0` form case-insensitively.
    any:
      - id: micro-behaviors/data/control-flow/dispatch::script-run-method-call
      - id: micro-behaviors/data/control-flow/dispatch::run-zero-style-argument
