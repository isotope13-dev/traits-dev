# Multi-strategy dynamic execution fallbacks across PowerShell, JavaScript, and
# Python loaders that decode a payload and try distinct execution sinks in turn.
defaults:
  platforms: [windows, unix]
  mbc: E1059

composite_rules:
  - id: powershell-decoded-stage-fallback-executor
    desc: PowerShell tries multiple execution sinks
    crit: component
    conf: 0.96
    for: [powershell]
    all:
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-try-catch-eval-sink
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-multiple-eval-paths
    any:
      - id: micro-behaviors/metaprogramming/generation/compile::powershell-add-type
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-pipelined-outstring-iex
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-dot-sourced-variable

  - id: powershell-multi-sink-fallback-executor
    desc: PowerShell decoded multi-sink fallback executor
    crit: hostile
    conf: 0.99
    for: [powershell]
    attack: T1059.001,T1027,T1140
    mbc: B0032,E1059
    all:
      - id: powershell-decoded-stage-fallback-executor
      - id: micro-behaviors/data/decode/charset::powershell-utf8-getstring
    any:
      - id: micro-behaviors/data/decode/hex::powershell-convert-tobyte-radix16
      - id: micro-behaviors/data/decode/hex::powershell-convert-fromhexstring
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::request-powershell

  - id: powershell-base64-xor-reflective-assembly-loader
    desc: PowerShell Base64 XOR reflective .NET loader
    crit: hostile
    conf: 0.98
    for: [powershell]
    scope: file
    attack: T1620,T1140,T1059.001
    mbc: B0032.001,E1059
    all:
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::powershell-modulo-xor-references
      - id: micro-behaviors/metaprogramming/reflection/invoke::powershell-assembly-method-invoke
    any:
      - id: metadata/file/encoding/base64::powershell-large-base64-literal
      - id: metadata/file/encoding/shape::powershell-many-base64-alphabet-lines

  - id: js-decoded-multi-sink-eval-fallback
    desc: JavaScript decoded multi-sink eval fallback
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    attack: T1059.007,T1027,T1140
    # The fallback chain is one routine: decode and every sink sit together.
    # File-wide co-occurrence in large bundles (base64 helpers, setImmediate
    # polyfills, lodash.template, protobufjs inquire) is not a fallback.
    near_bytes: 1536
    all:
      - id: micro-behaviors/process/interpreter/eval/javascript::js-try-catch-eval-sink
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
      - id: micro-behaviors/metaprogramming/generation/function::js-function-ctor-call-text
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decode-call-text

  - id: python-decoded-multi-sink-eval-fallback
    desc: Python decoded multi-sink eval fallback
    crit: hostile
    conf: 0.98
    for: [python]
    attack: T1059.006,T1027,T1140
    all:
      - id: micro-behaviors/process/interpreter/eval/python-builtins::python-try-except-eval-sink
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
      - id: micro-behaviors/process/interpreter/eval/python-builtins::eval-builtin
    any:
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
      - id: micro-behaviors/data/decode/hex::python-fromhex
      - id: micro-behaviors/data/decode/hex::python-unhexlify
