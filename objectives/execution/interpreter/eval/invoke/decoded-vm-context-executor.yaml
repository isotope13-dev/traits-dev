# Suppressed-error VM execution of a decoded stage: base64 is decoded and the
# result is run through Node's vm module inside a try block, so a failing
# sink is swallowed and (in multi-sink loaders) the next sink is tried. The
# try-wrapped vm call is what separates this from merely decoding near a vm
# use: bare `Buffer.from(x, 'base64')` beside an unrelated
# `vm.runInNewContext(config, ctx)` stays notable. Single-sink sibling of
# the multi-sink fallback executor. Bundles and test fixtures legitimately
# decode assets and drive vm in tests.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: hostile
  conf: 0.97
  attack: T1059.007,T1027
composite_rules:
  - id: js-decoded-vm-context-executor
    desc: Suppressed-error VM run of decoded stage
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decode-call-text
      - id: micro-behaviors/process/interpreter/eval/javascript::js-try-block-vm-context
    any:
      - id: micro-behaviors/process/interpreter/vm::vm-runInThisContext
      - id: micro-behaviors/process/interpreter/vm::vm-runInNewContext-call
      - id: micro-behaviors/process/interpreter/vm::vm-runInContext-call
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/path/directory::test-directory-component
