defaults:
  platforms: [windows]
  for: [text, powershell]
composite_rules:
  - id: hidden-file-eval-hollowing-stage
    desc: Hidden WSH PowerShell evaluates a staged process-hollowing script
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1059.005
    all:
      - id: objectives/execution/payload/process-inject/hollowing/runtime::hex-reflected-process-hollowing
      - id: micro-behaviors/process/deploy/script-eval/input::hidden-powershell-file-eval
      - id: micro-behaviors/os/com/instantiation::wscript-shell-createobject
