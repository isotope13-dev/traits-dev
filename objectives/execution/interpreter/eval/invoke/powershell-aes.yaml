defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  # These APIs establish co-occurrence, not arbitrary variable data flow.
  # Encrypted legitimate automation remains plausible, so do not convict
  # solely on this outer wrapper or attribute its hidden payload family.
  - id: powershell-wrapped-aes-scriptblock-invocation
    desc: Wrapped AES script construction with ScriptBlock invocation
    crit: suspicious
    conf: 0.97
    attack: T1059.001
    all:
      - id: objectives/anti-static/obfuscation/payload/encrypted::powershell-aes-wrapped-script-construction
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-invoke-return-as-is
