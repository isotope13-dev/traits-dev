defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-wrapped-aes-scriptblock-invocation
    desc: Wrapped AES script construction with ScriptBlock invocation
    crit: hostile
    conf: 0.97
    attack: T1059.001
    all:
      - id: objectives/anti-static/obfuscation/payload/encrypted::powershell-aes-wrapped-script-construction
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-scriptblock-invoke-method
