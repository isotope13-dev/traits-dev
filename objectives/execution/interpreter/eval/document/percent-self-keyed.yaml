defaults:
  platforms: [windows, unix]
  for: [html]
traits:
  - id: appended-percent-function-eval
    desc: Encoded eval follows HTML document end
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)</html>\s*(<!--[^>]{0,160}-->\s*)?<script>eval\(unescape\('
      exclude_html_comments: true
composite_rules:
  - id: appended-self-keyed-payload-eval
    desc: Appended self-keyed decoder evaluates payload
    crit: hostile
    conf: 0.99
    all:
      - id: appended-percent-function-eval
      - id: objectives/anti-static/obfuscation/encoding/xor::percent-self-keyed-xor-eval
      - id: objectives/anti-static/obfuscation/encoding/xor::percent-decoded-variable-eval
  - id: incrementing-xor-charcode-eval
    desc: Evaluates incrementing XOR character decoder
    crit: hostile
    conf: 0.98
    platforms: [windows]
    near_bytes: 80
    all:
      - id: micro-behaviors/data/decode/xor::js-incrementing-xor-charcode
      - id: micro-behaviors/process/interpreter/eval/direct::eval-identifier-call-text
