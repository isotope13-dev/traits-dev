defaults:
  platforms: [windows, unix]
  for: [pdf, xml]
  crit: notable
  conf: 0.95

traits:
  - id: xfa-initialization-event
    desc: XFA declares a form initialization event
    if:
      type: raw
      regex: '<(\w+:)?event\b[^>]{0,140}\bactivity\s*=\s*["'']initialize\b'

  - id: xfa-script-field-value-read
    desc: XFA script reads a raw field value
    if:
      type: raw
      regex: '<script\b[^>]{0,140}>[\s\S]{0,480}\.rawValue\b'

  - id: xfa-catch-eval-call
    desc: XFA catch block evaluates a value
    if:
      type: raw
      regex: '\bcatch\s*\(\s*\w+\s*\)\s*\{[^}]{0,72}\beval\s*\('

  - id: xfa-catch-decimal-escaped-eval
    desc: XFA catch calls decimal-escaped eval
    if:
      type: raw
      regex: '\bcatch\s*\(\w+\)\s*\{\s*\w+\s*=\s*(e&#118;al|&#101;val|ev&#97;l|eva&#108;)\s*\('

  - id: xfa-catch-hex-escaped-eval
    desc: XFA catch calls hex-escaped eval
    if:
      type: raw
      regex: '(?i)\bcatch\s*\(\w+\)\s*\{\s*\w+\s*=\s*(e&#x76;al|&#x65;val|ev&#x61;l|eva&#x6c;)\s*\('

composite_rules:
  - id: xfa-initializer-evaluates-form-field-via-catch
    desc: XFA initializer reads a form field and evaluates code in a catch block
    crit: hostile
    conf: 0.96
    near_bytes: 2048
    all:
      - id: xfa-initialization-event
      - id: xfa-script-field-value-read
    any:
      - id: xfa-catch-eval-call
      - id: xfa-catch-decimal-escaped-eval
      - id: xfa-catch-hex-escaped-eval
