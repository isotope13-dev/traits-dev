# PromptLock-like behavior: a program asks a local or hosted model for source
# and routes the model's response into an interpreter.  The atomics remain
# language-neutral so the same technique can be recognized in future
# controller implementations.
defaults:
  platforms: [unix, windows]
  for: [python, go, lua, shell, javascript, typescript, powershell, rust]
  attack: T1059

composite_rules:
  - id: agentic-generated-environment-access
    for: [python]
    desc: Model-driven Agent method accesses environment
    crit: suspicious
    conf: 0.96
    attack: T1059.006,T1082
    all:
      - id: micro-behaviors/data/llm/session::python-agentic-ellipsis-method
      - id: micro-behaviors/os/env/read/variable::python-os-getenv-call
    near_bytes: 2400
    unless:
      # Tests and examples pair agent doubles with ordinary config reads
      # (tracing hosts, fixture setup); the model drives neither.
      - id: metadata/path/directory::example-directory-component

  - id: agentic-generated-sensitive-file-access
    for: [python]
    desc: Model-driven Agent method accesses account file
    crit: suspicious
    conf: 0.98
    attack: T1059.006,T1033
    all:
      - id: micro-behaviors/data/llm/session::python-agentic-ellipsis-method
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd-open
    near_bytes: 2400

  - id: agentic-generated-dynamic-execution
    for: [python]
    desc: Model-driven Agent method exposes dynamic Python execution
    crit: hostile
    conf: 0.98
    attack: T1059.006,T1106
    all:
      - id: micro-behaviors/data/llm/session::python-agentic-ellipsis-method
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
    near_bytes: 2400
    unless:
      # Test scaffolding builds synthetic modules with exec next to test
      # doubles; no model output reaches the interpreter.
      - id: metadata/path/directory::test-directory-component

  - id: agentic-generated-file-destruction
    for: [python]
    desc: Model-driven Agent method exposes recursive file deletion
    crit: hostile
    conf: 0.98
    attack: T1059.006,T1070.004
    all:
      - id: micro-behaviors/data/llm/session::python-agentic-ellipsis-method
      - id: micro-behaviors/fs/delete/directory::shutil-rmtree
    near_bytes: 2400

  - id: agentic-generated-secret-upload
    for: [python]
    desc: Model-driven Agent uploads a secret-bearing result
    crit: hostile
    conf: 0.99
    attack: T1059.006,T1041,T1552.001
    all:
      - id: micro-behaviors/data/llm/session::python-agentic-ellipsis-method
      - id: micro-behaviors/os/env/secret-name::python-sensitive-env-read
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/http/request/body/construction::http-post-with-body-argument
    near_bytes: 2400

  - id: llm-response-command-clues
    for: [python, go, javascript, typescript, powershell]
    desc: LLM endpoint near generated-command call
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
      - id: micro-behaviors/process/interpreter/eval/constructed::generated-command-call-clues
    near_bytes: 3000

  - id: llm-generated-command-execution
    for: [python, go, javascript, typescript, powershell]
    desc: Executes commands generated by an LLM
    crit: suspicious
    conf: 0.98
    attack: T1059,T1106
    all:
      - id: micro-behaviors/data/llm/agent::llm-command-generation-instruction
      - id: micro-behaviors/process/interpreter/eval/constructed::generated-command-call-clues
    any:
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
      - id: micro-behaviors/communications/http/llm::local-llm-inference-endpoint
    near_bytes: 4000

  - id: llm-generated-interpreter-execution
    desc: Executes source generated by an LLM
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/llm/codegen::llm-code-generation-instruction
      - id: micro-behaviors/process/interpreter/eval/constructed::generated-source-execution-clues
    any:
      - id: micro-behaviors/communications/http/llm::local-llm-inference-endpoint
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
