# PromptLock-like behavior: a program asks a local or hosted model for source
# and routes the model's response into an interpreter.  The atomics remain
# language-neutral so the same technique can be recognized in future
# controller implementations.
defaults:
  platforms: [unix, windows]
  for: [python, go, lua, shell, javascript, typescript, powershell, rust]
  attack: T1059

composite_rules:
  - id: llm-model-response-shell-execution
    desc: Unreviewed model output reaches a shell
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
      - id: micro-behaviors/process/create/eval::model-response-shell-command
    near_bytes: 3000

  - id: llm-generated-command-execution
    desc: Executes commands generated by an LLM
    crit: suspicious
    conf: 0.98
    attack: T1059,T1106
    all:
      - id: micro-behaviors/data/llm::llm-command-generation-instruction
      - id: micro-behaviors/process/create/eval::model-response-shell-command
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
    near_bytes: 4000

  - id: llm-generated-interpreter-execution
    desc: Executes source generated by an LLM
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/llm::llm-code-generation-instruction
      - id: micro-behaviors/process/create/eval::model-response-interpreter
    any:
      - id: micro-behaviors/communications/http/llm::local-llm-inference-endpoint
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
