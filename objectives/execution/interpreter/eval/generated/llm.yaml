# PromptLock-like behavior: a program asks a local or hosted model for source
# and routes the model's response into an interpreter.  The atomics remain
# language-neutral so the same technique can be recognized in future
# controller implementations.
defaults:
  platforms: [unix, windows]
  for: [python, go, lua, shell, javascript, typescript, powershell, rust]
  attack: T1059

composite_rules:
  - id: agentic-generated-environment-access
    desc: Model-driven Agent method accesses environment
    crit: suspicious
    conf: 0.96
    attack: T1059.006,T1082
    all:
      - id: micro-behaviors/process/create/agent::python-agentic-ellipsis-method
      - id: micro-behaviors/os/env/vars/access::python-os-getenv-call
    near_bytes: 2400

  - id: agentic-generated-sensitive-file-access
    desc: Model-driven Agent method accesses account file
    crit: suspicious
    conf: 0.98
    attack: T1059.006,T1033
    all:
      - id: micro-behaviors/process/create/agent::python-agentic-ellipsis-method
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd-open
    near_bytes: 2400

  - id: agentic-generated-dynamic-execution
    desc: Model-driven Agent method exposes dynamic Python execution
    crit: hostile
    conf: 0.98
    attack: T1059.006,T1106
    all:
      - id: micro-behaviors/process/create/agent::python-agentic-ellipsis-method
      - id: micro-behaviors/process/interpreter/python::exec-builtin
    near_bytes: 2400

  - id: agentic-generated-file-destruction
    desc: Model-driven Agent method exposes recursive file deletion
    crit: hostile
    conf: 0.98
    attack: T1059.006,T1070.004
    all:
      - id: micro-behaviors/process/create/agent::python-agentic-ellipsis-method
      - id: micro-behaviors/fs/directory/delete::shutil-rmtree
    near_bytes: 2400

  - id: agentic-generated-secret-upload
    desc: Model-driven Agent uploads a secret-bearing result
    crit: hostile
    conf: 0.99
    attack: T1059.006,T1041,T1552.001
    all:
      - id: micro-behaviors/process/create/agent::python-agentic-ellipsis-method
      - id: micro-behaviors/os/env/vars/credentials::python-sensitive-env-read
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/communications/http/request/body::http-post-with-body-argument
    near_bytes: 2400

  - id: llm-model-response-shell-execution
    desc: Unreviewed model output reaches a shell
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
      - id: micro-behaviors/process/create/eval::model-response-shell-command
    near_bytes: 3000

  - id: llm-generated-command-execution
    desc: Executes commands generated by an LLM
    crit: suspicious
    conf: 0.98
    attack: T1059,T1106
    all:
      - id: micro-behaviors/data/llm::llm-command-generation-instruction
      - id: micro-behaviors/process/create/eval::model-response-shell-command
    any:
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
      - id: micro-behaviors/communications/http/llm::local-llm-inference-endpoint
    near_bytes: 4000

  - id: llm-generated-interpreter-execution
    desc: Executes source generated by an LLM
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/llm::llm-code-generation-instruction
      - id: micro-behaviors/process/create/eval::model-response-interpreter
    any:
      - id: micro-behaviors/communications/http/llm::local-llm-inference-endpoint
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
