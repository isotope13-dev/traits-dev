# Eval of a script fetched through a ServiceNow REST message.
#
# A Glide script pulls a response body with RESTMessageV2's getBody() and
# passes it to eval(): fileless, SaaS-resident code execution in which the
# executed logic never exists in the tenant. This is the execution
# primitive of the SnowFall C2 (MDSec, "When it Snows it Pours", 2026) and
# of injected-playbook style abuse. The data-flow (response body into
# eval) has no legitimate ServiceNow integration pattern.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json, text, data]
  attack: T1059.007

traits:
  - id: servicenow-response-body-eval
    desc: Evals fetched HTTP response body
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\.getBody\s*\(\s*\)[\s\S]{0,300}\beval\s*\('
