# Generic JSON has structured values but no parser-extracted source literals.
# Keep this text fallback disjoint from the existing source-literal matcher.
# This is an embedded shell-call expression, not proof of template rendering.
defaults:
  platforms: [unix, windows]
  for: [json]

traits:
  - id: jinja-json-os-command-sink
    desc: JSON Jinja traversal with shell-call expression
    crit: suspicious
    conf: 0.98
    attack: T1059.006
    if:
      type: text
      regex: '(?s)\{\{[^}]{0,180}__(globals|builtins)__[^}]{0,120}\.(system|popen)\s*\('
    unless:
      - id: metadata/package/documentation/security-advisory::json-ghsa-poc-advisory-context
      - id: metadata/package/documentation/security-advisory::osv-advisory-report-structure
      - id: metadata/package/documentation/security-testing::structured-security-testing-catalog
      - id: metadata/file/format/structured::serialized-news-article-catalog
