defaults:
  platforms: [unix, windows]
  for: [markdown, php, html, csharp, java]
  attack: T1505.003
  mbc: B0024

traits:
  - id: php-request-shell-execution
    desc: PHP request parameter passed to shell execution
    crit: notable
    conf: 0.99
    for: [markdown, php]
    if:
      type: text
      regex: '(?is)\b(system|exec)\s*\(\s*\$_(GET|POST|REQUEST)\s*\['

  - id: php-request-shell-execution-alt
    desc: PHP request parameter to shell function
    crit: notable
    conf: 0.99
    for: [markdown, php]
    if:
      type: text
      regex: '(?is)\b(shell_exec|passthru)\s*\(\s*\$_(GET|POST|REQUEST)\s*\['

  - id: aspx-request-process-execution
    desc: ASPX request parameter to process creation
    crit: notable
    conf: 0.99
    for: [markdown, csharp]
    if:
      type: text
      regex: '(?is)\bProcess\.Start\s*\([^\n]{0,240}\bRequest\s*\[.{0,40}\]'

  - id: jsp-request-process-execution
    desc: JSP request parameter passed to Runtime.exec
    crit: notable
    conf: 0.99
    for: [markdown, java]
    if:
      type: text
      regex: '(?is)Runtime\.getRuntime\s*\(\s*\)\.exec\s*\(\s*request\.getParameter\s*\('

composite_rules:
  - id: request-parameter-webshell
    desc: Web shell executes request-supplied command
    crit: hostile
    conf: 0.99
    any:
      - id: php-request-shell-execution
      - id: php-request-shell-execution-alt
      - id: aspx-request-process-execution
      - id: jsp-request-process-execution
