# Remote Code Evaluation - PHP
# Detects eval() on data fetched from external sources
# ATT&CK: T1059.001, T1505.003
# Classic memory webshell and backdoor pattern
defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [php]
  attack: "T1059.001"
  mbc: "E1059"
traits:
  - id: create-function-junk-injected
    desc: create_function name with embedded junk chars
    conf: 0.95
    attack: T1027.010
    if:
      type: string_literal
      regex: cr\w{3,}ate_\w{3,}nction
  - id: ob-start-eval-capture
    desc: ob_start wrapping eval to capture output
    conf: 0.9
    attack: T1505.003
    if:
      type: string_literal
      regex: ob_s\w*t\w*art.{0,60}e\w*val
  - id: eval-gz-b64-chain-in-string
    desc: 'eval)) chain embedded in code string'
    conf: 0.92
    attack: T1059.004
    if:
      type: string_literal
      regex: e\w*val.{0,30}gz\w*un\w*compress
    unless:
      - id: "metadata/lang/source/shape::yara-rule-source"
      - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member
  - id: eval-user-input
    desc: PHP eval argument contains HTTP request input
    attack: T1059
    conf: 0.98
    for:
    - php
    - javascript
    if:
      type: tree-sitter
      language: php
      kind: call
      regex: (?s)^(?i:eval)\s*(/\*.{0,300}?\*/\s*)?\([^)]{0,200}\$_(GET|POST|REQUEST|COOKIE)
    unless:
    - id: metadata/package/documentation/security-testing::authorized-fenced-testing-skill
    - type: path
      regex: (?i)\.yar(a)?$
    - id: well-known/app/publishing/wordpress-plugins/security::bitfire-plugin-path
    - id: well-known/tool/offensive/bingo/
    - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
    - id: well-known/app/publishing/wordpress-plugins/security::centershield-decoded-signature-literal
    - id: well-known/tool/offensive/cdk::container-toolkit-binary
    downgrade:
      any:
        - id: metadata/package/documentation/security-testing::structured-technique-payload-catalog
  - id: php-decoded-request-eval
    desc: PHP evaluates decoded HTTP request parameter
    crit: suspicious
    conf: 0.99
    attack: T1059
    if:
      type: tree-sitter
      language: php
      query: |
        ((function_call_expression
          function: (name) @eval
          arguments: (arguments . (argument (function_call_expression
            function: (name) @decoder
            arguments: (arguments . (argument (subscript_expression
              (variable_name) @request)) .))) .))
          (#eq? @eval "eval")
          (#match? @decoder "(?i)^(base64_decode|str(_rot13|rev)|gz(inflate|uncompress|decode))$")
          (#match? @request "^\\$_(GET|POST|REQUEST)$"))
        ((function_call_expression
          function: (name) @eval
          arguments: (arguments . (argument (function_call_expression
            function: (name) @outer_decoder
            arguments: (arguments . (argument (function_call_expression
              function: (name) @inner_decoder
              arguments: (arguments . (argument (subscript_expression
                (variable_name) @request)) .))) .))) .))
          (#eq? @eval "eval")
          (#match? @outer_decoder "(?i)^(base64_decode|str(_rot13|rev)|gz(inflate|uncompress|decode))$")
          (#match? @inner_decoder "(?i)^(base64_decode|str(_rot13|rev)|gz(inflate|uncompress|decode))$")
          (#match? @request "^\\$_(GET|POST|REQUEST)$"))
