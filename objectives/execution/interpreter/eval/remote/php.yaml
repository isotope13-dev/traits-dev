# Remote Code Evaluation - PHP
# Detects eval() on data fetched from external sources
# ATT&CK: T1059.001, T1505.003
# Classic memory webshell and backdoor pattern
defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [php]
  attack: "T1059.001"
  mbc: "E1059"
traits:
  - id: create-function-junk-injected
    desc: create_function name with embedded junk chars
    conf: 0.95
    attack: T1027.010
    if:
      type: string_literal
      regex: cr\w{3,}ate_\w{3,}nction
  - id: ob-start-eval-capture
    desc: ob_start wrapping eval to capture output
    conf: 0.9
    attack: T1505.003
    if:
      type: string_literal
      regex: ob_s\w*t\w*art.{0,60}e\w*val
  - id: eval-gz-b64-chain-in-string
    desc: 'eval)) chain embedded in code string'
    conf: 0.92
    attack: T1059.004
    if:
      type: string_literal
      regex: e\w*val.{0,30}gz\w*un\w*compress
    unless:
      - id: metadata/lang/source::yara-rule-source
      - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member
  - id: eval-user-input
    desc: PHP eval receives direct HTTP request input
    attack: T1059.006
    conf: 0.98
    # Include script carriers because PHP is often embedded in a file whose
    # outer extension is JavaScript. The regex itself remains PHP-specific.
    for: [php, javascript]
    # `eval(... $_GET|$_POST|$_REQUEST ...)` — a request superglobal reaching an
    # eval() argument. The `eval(` prefix plus the superglobal keeps it FP-safe.
    #
    # A block comment is allowed between the keyword and its parenthesis:
    # PHP ignores it, and a payload hiding in a JavaScript carrier uses that
    # to split the one token pair a scanner keys on. OpenX 2.8.10 wrote
    # `eval/*for(var p in q){...}*/($_[1]($_[0]($_POST[...])))`, which is the
    # same call this rule already describes with camouflage wedged into the
    # gap. Nothing legitimate separates `eval` from its argument list this
    # way, so accepting the gap costs no precision.
    if:
      type: text
      regex: '\beval\s*(/\*[\s\S]{0,300}?\*/\s*)?\([^)]{0,200}\$_(GET|POST|REQUEST)'
    unless:
      - type: path
        regex: '(?i)\.yar(a)?$'
      - id: well-known/app/publishing/wordpress-plugins/security::bitfire-plugin-path

      - id: well-known/tool/offensive/bingo/
