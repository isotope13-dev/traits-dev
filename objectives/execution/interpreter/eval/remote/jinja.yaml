# Server-side Jinja expression injection.
# The dangerous shape is the template object graph reaching Python builtins,
# not ordinary use of Jinja templates for presentation.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  attack: "T1059.006,T1190"

traits:
  - id: jinja-expression-delimiter
    desc: Jinja expression delimiter in source
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '\{\{[\s\S]{0,320}\}\}'

  - id: jinja-globals-traversal
    desc: Jinja traversal reaches Python globals
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?is)\{\{.{0,260}__globals__.{0,260}\}\}'

  - id: jinja-builtins-traversal
    desc: Jinja traversal reaches Python builtins
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)\{\{.{0,260}__builtins__.{0,260}\}\}'

  - id: jinja-builtins-exec-sink
    desc: Jinja builtins reaches exec
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)\{\{.{0,420}__builtins__.{0,220}\bexec\b'

  - id: jinja-builtins-eval-sink
    desc: Jinja builtins reaches eval
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)\{\{.{0,420}__builtins__.{0,220}\beval\b'

  - id: jinja-os-command-sink
    desc: Jinja traversal reaches shell command
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)\{\{.{0,420}(os\.system|subprocess|popen)'

composite_rules:
  - id: jinja-template-code-execution
    desc: Jinja object traversal executes Python code
    crit: hostile
    conf: 0.995
    mbc: "B0024"
    all:
      - id: jinja-expression-delimiter
      - id: jinja-globals-traversal
      - id: jinja-builtins-traversal
    any:
      - id: jinja-builtins-exec-sink
      - id: jinja-builtins-eval-sink
      - id: jinja-os-command-sink
    near_bytes: 1024
