# Server-side Jinja expression injection.
# The dangerous shape is the template object graph reaching Python builtins,
# not ordinary use of Jinja templates for presentation.
defaults:
  platforms: [unix, windows]
  for: [scripts, json, data]
  attack: "T1059.006,T1190"

traits:
  - id: jinja-globals-traversal
    desc: Jinja traversal reaches Python globals
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?is)\{\{.{0,260}__globals__.{0,260}\}\}'
    unless:
      - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/tool/offensive/phantom-agent::phantom-payload-corpus-context
      - id: metadata/package/testing/presence/harness::python-test-file

      - id: well-known/tool/offensive/bingo/
  - id: jinja-builtins-traversal
    desc: Jinja traversal reaches Python builtins
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)\{\{.{0,260}__builtins__.{0,260}\}\}'
    unless:
      - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
      - id: well-known/tool/offensive/phantom-agent::phantom-payload-corpus-context
      - id: metadata/package/testing/presence/harness::python-test-file

      - id: well-known/tool/offensive/bingo/
  - id: jinja-builtins-exec-sink
    desc: Jinja builtins reaches exec
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)\{\{[^{\n]{0,420}__builtins__[^_\n]{0,220}\bexec\b'
    unless:
      - id: well-known/tool/offensive/phantom-agent::phantom-payload-corpus-context
      - id: metadata/package/testing/presence/harness::python-test-file

      - id: well-known/tool/offensive/bingo/
  - id: jinja-builtins-eval-sink
    desc: Jinja builtins reaches eval
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)\{\{[^{\n]{0,420}__builtins__[^_\n]{0,220}\beval\b'
    unless:
      - id: well-known/tool/offensive/phantom-agent::phantom-payload-corpus-context
      - id: metadata/package/testing/presence/harness::python-test-file

  - id: jinja-os-command-sink
    desc: Jinja builtins traversal reaches shell
    crit: suspicious
    conf: 0.98
    if:
      type: text
      # Python f-strings and PowerShell templates also use doubled braces;
      # require the Jinja object-graph traversal before treating a command
      # reference as a template injection sink.
      regex: '(?is)\{\{.{0,180}(__globals__|__builtins__).{0,120}(os\.system|subprocess|popen)'
    unless:
      - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/tool/offensive/phantom-agent::phantom-payload-corpus-context
      - id: metadata/package/testing/presence/harness::python-test-file

      - id: well-known/tool/offensive/bingo/
composite_rules:
  - id: jinja-template-code-execution
    desc: Jinja object traversal executes Python code
    crit: hostile
    conf: 0.995
    mbc: "B0024"
    all:
      - id: jinja-globals-traversal
      - id: jinja-builtins-traversal
    any:
      - id: jinja-builtins-exec-sink
      - id: jinja-builtins-eval-sink
      - id: jinja-os-command-sink
    near_bytes: 1024
    unless:
      - id: well-known/tool/offensive/phantom-agent::phantom-package-member
      - id: metadata/package/testing/presence/harness::python-test-file

      - id: well-known/tool/offensive/bingo/
  - id: jinja-socket-shell-execution
    desc: Jinja code execution opens a socket-backed shell
    crit: hostile
    conf: 0.995
    mbc: "B0024"
    attack: "T1059.006,T1059.004,T1055"
    all:
      - id: jinja-template-code-execution
      - id: objectives/command-and-control/reverse-shell/dup::inline-python-socket-dup2
    near_bytes: 1024
