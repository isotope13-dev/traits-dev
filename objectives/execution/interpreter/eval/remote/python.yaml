# Remote Code Evaluation - Python
# Detects eval/exec on data extracted from external sources
# ATT&CK: T1059.006 (Python), T1195.002 (Supply Chain)
# These patterns are strong indicators of supply-chain attacks
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: "T1059.006"
traits:
  - id: http-json-code-field-read
    desc: Reads source from HTTP JSON code field
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: >-
        \b\w+\s*=\s*\w+\.json\(\)[\s\S]{0,120}\.get\(["']code["']

  - id: python-post-route-to-exec
    desc: Python POST route reaches variable exec
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '@[\w.]+\.post[\s\S]{0,1000}exec\s*\(\s*\w+\s*,\s*\w+\s*\)'

  # eval() on chained .get() calls — pulls a nested value out of a config
  # or response object and executes it as Python.
  # Pattern: eval(x.get(...).get(...).get(...))
  #
  # Trait calibration is *deliberately* suspicious even though this pattern
  # ships in some legitimate ML SDKs (e.g. ultralytics's Triton client uses
  # `eval(config.get("parameters",{}).get("metadata",{}).get("string_value","None"))`
  # to unpack server-provided metadata). That is genuinely an RCE: anyone
  # who controls the inference server can return arbitrary Python and the
  # client executes it. Flagging it loudly is the right behavior — a security
  # engineer reading the diff should see it, not have it suppressed because
  # the upstream maintainers have accepted the risk.
  #
  # `\b` excludes `ast.literal_eval` (which does NOT execute arbitrary code).
  - id: eval-chained-get
    desc: Python eval executes chained get data
    crit: suspicious
    conf: 0.95
    attack: "T1195.002"
    mbc: "E1059"
    if:
      type: text
      regex: "\\beval\\s*\\(.{0,220}\\.get\\s*\\(.{0,160}\\)\\s*\\.get\\s*\\("
  # `\b` excludes ast.literal_eval, which is the safe stdlib alternative.
  # exec() on chained .get() calls
  - id: exec-chained-get
    desc: exec on chained .get() calls
    crit: suspicious
    conf: 0.95
    attack: "T1195.002"
    mbc: "E1059"
    if:
      type: text
      regex: '\bexec\s*\([^(\n]{0,220}\.get\s*\([^(\n]{0,160}\)\s*\.get\s*\('
  # Client config evaluation - ML/inference server pattern
  - id: eval-client-config
    desc: eval on client config value
    crit: notable
    conf: 0.9
    attack: "T1195.002"
    mbc: "E1059"
    if:
      type: text
      regex: "\\beval\\s*\\(.{0,220}client.{0,120}\\.get"
  # Evaluate string_value field - common malicious config pattern
  - id: eval-string_value
    desc: eval on string_value field
    crit: notable
    conf: 0.95
    attack: "T1195.002"
    mbc: "E1059"
    if:
      type: text
      regex: "\\beval\\s*\\(.{0,220}string_value"
  # eval/exec with bracket access on received data
  - id: eval-bracket-http-fields
    desc: eval on HTTP field bracket access
    crit: notable
    conf: 0.85
    if:
      type: tree-sitter
      kind: call
      regex: '\beval\s*\(\s*(response|request|body)\w*\s*\['
  - id: eval-bracket-result-content
    desc: eval on result or content bracket access
    crit: notable
    conf: 0.85
    if:
      type: tree-sitter
      kind: call
      regex: '\beval\s*\(\s*(result|content|json)\w*\s*\['
  - id: exec-text-attribute
    desc: exec() evaluates an object's text attribute
    mbc: E1059
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bexec\s*\(\s*[A-Za-z_]\w{0,40}\.text\s*\)'
composite_rules:
  - id: python-http-json-code-execution
    desc: Executes source from an HTTP JSON field
    crit: suspicious
    conf: 0.96
    scope: archive
    for: [python, whl]
    attack: T1105,T1059.006
    mbc: E1059
    all:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: http-json-code-field-read
      - id: micro-behaviors/process/interpreter/eval/constructed::exec-compiled-code

  - id: eval-bracket-access
    desc: eval on remote data bracket access
    crit: notable
    conf: 0.85
    mbc: "E1059"
    unless:
      - id: well-known/tool/detection/
    any:
      - id: eval-bracket-http-fields
      - id: micro-behaviors/process/interpreter/eval/direct::python-eval-subscripted-config
      - id: eval-bracket-result-content
  - id: python-remote-response-code-execution
    desc: Executes Python code returned by HTTP response
    crit: hostile
    conf: 0.99
    mbc: "B0024"
    near_bytes: 8000
    all:
      - id: micro-behaviors/communications/http/request/client::request-python
      - id: micro-behaviors/data/collection/map::mapping-get-code-key
      - id: micro-behaviors/metaprogramming/generation::compile-exec-mode
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  - id: python-web-request-code-execution
    desc: Non-loopback endpoint executes request-supplied Python code
    crit: hostile
    conf: 0.99
    attack: "T1059.006,T1190"
    mbc: "B0024"
    all:
      - id: python-post-route-to-exec
      - id: micro-behaviors/process/interpreter/eval/direct::exec-variable-namespace
    unless:
      - id: micro-behaviors/communications/http/server/framework::python-uvicorn-loopback-run
