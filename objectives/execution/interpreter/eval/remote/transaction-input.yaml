defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - scripts
  - source
composite_rules:
- id: blockchain-tx-spawn-loader
  desc: Spawns detached Node stage from blockchain transaction payload
  crit: hostile
  conf: 0.98
  attack: T1102,T1059.007
  mbc: B0032
  for:
  - javascript
  - typescript
  near_bytes: 4096
  all:
  - id: objectives/anti-static/obfuscation/string/encrypt::blockchain-xor-code-concealment
  - id: micro-behaviors/process/create/spawn::computed-node-spawn-detached-true
  any:
  - id: micro-behaviors/process/create/eval::spawn-node-eval
  - id: micro-behaviors/process/create/eval::spawn-node-eval-computed-access
