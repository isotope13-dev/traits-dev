defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: module-execs-requests-response-text
    desc: Import executes downloaded HTTP response text
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1059.006,T1105
    if:
      type: tree-sitter
      query: |
        ((module (try_statement body: (block
          (expression_statement (assignment left: (identifier) @code right: (attribute
            object: (call function: (attribute object: (identifier) @requests attribute: (identifier) @get)
              arguments: (argument_list (string) @url)) attribute: (identifier) @text)))
          (expression_statement (call function: (identifier) @exec arguments: (argument_list (identifier) @code2))))))
          (#eq? @requests "requests") (#eq? @get "get") (#eq? @text "text") (#eq? @exec "exec")
          (#eq? @code @code2) (#match? @url "https?://")
          (#not-match? @url "https?://(localhost|127[.]|10[.]|192[.]168[.])")
          (#not-match? @url "https?://172[.](1[6-9]|2[0-9]|3[01])[.]"))
