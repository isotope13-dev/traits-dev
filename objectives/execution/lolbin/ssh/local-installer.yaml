defaults:
  platforms: [windows]
  for: [scripts, source, binaries, lnk]
  crit: suspicious
  conf: 0.97
  attack: T1218.007,T1105
traits:
  - id: local-command-msiexec
    desc: SSH LocalCommand launches Windows Installer
    if:
      type: text
      regex: '(?i)\bLocalCommand\s*=[^\r\n"\x27]{0,100}\bmsiexec(\.exe)?\b'
