defaults:
  for: [scripts, source, lnk]
  platforms: [unix, windows]
  conf: 0.97
  attack: T1218,T1105

composite_rules:
  - id: local-shell-remote-installer
    desc: SSH local shell launches a remote MSI installer
    crit: suspicious
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/ssh/client::local-command-shell
      - id: micro-behaviors/communications/ssh/client::local-command-enabled
      - id: local-command-msiexec
      - id: micro-behaviors/communications/http/url/endpoint::remote-msi-package-url
