# A DLL that exports the COM class-factory pair and also a bare lowercase
# `run` entry point: two ways in, one for an InprocServer32 registration and
# one for `rundll32 <dll>,run`. COM servers export the Dll* registration
# family, not an ad-hoc rundll32 verb.
defaults:
  platforms: [windows]
  for: [dll]
  attack: T1218.011,T1546.015

traits:
composite_rules:
  - id: com-server-with-rundll32-entry
    desc: COM server DLL also exports a rundll32 entry
    crit: suspicious
    conf: 0.88
    all:
      - id: metadata/binary/symbols/exports::com-export-pair
      - id: metadata/binary/symbols/exports::export-run-entry
