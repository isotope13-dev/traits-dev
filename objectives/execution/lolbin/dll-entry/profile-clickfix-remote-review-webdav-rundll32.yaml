defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, html, vbs, text]


composite_rules:
  - id: headless-conhost-webdav-run-export-clues
    desc: Headless conhost, WebDAV share and DLL Run export clues
    crit: suspicious
    conf: 0.99
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/create/hidden::conhost-headless-dash-cmd
      - id: micro-behaviors/communications/http/webdav::delayed-ssl-webdav-share
      - id: micro-behaviors/process/argument/file::dll-named-run-export-argument
