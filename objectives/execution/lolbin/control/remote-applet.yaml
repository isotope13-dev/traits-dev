defaults:
  platforms: [windows]
  for: [scripts, source, binaries, lnk]
  crit: suspicious
  conf: 0.97
  attack: T1218.002,T1105
traits:
  - id: unc-applet-command
    desc: Control launcher references remote UNC applet
    if:
      type: text
      regex: '(?i)\bcontrol(\.exe)?["\x27]?\s+["\x27]?(\x5c){2}[\w.-]+(@SSL)?(@\d+)?\x5c'
