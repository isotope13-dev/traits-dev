defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1218.011,T1057,T1106
  mbc: E1057


composite_rules:
  - id: dotnet-process-lookup-rundll32
    desc: Dotnet process lookup and Rundll32 launch
    crit: hostile
    conf: 0.98
    all:
      - id: well-known/app/system/microsoft/rundll32::rundll32-start
      - id: well-known/app/system/microsoft/rundll32::rundll32-export-argument
      - id: micro-behaviors/process/enumerate/managed::get-processes-by-name
      - id: micro-behaviors/process/attach/rights::open-process
    near_bytes: 1800
