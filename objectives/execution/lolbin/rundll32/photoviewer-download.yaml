# Rundll32 photoviewer ImageView_Fullscreen LOLBAS remote download cradle
defaults:
  platforms: [windows]
  for: [batch, powershell, text]
  attack: T1218.011,T1105
  mbc: B0024,B0030

composite_rules:
  - id: rundll32-photoviewer-fullscreen-download
    desc: Rundll32 PhotoViewer downloads remote payload
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/cli::photoviewer-fullscreen-url
    any:
      - id: objectives/command-and-control/dropper/delivery/clickfix/remote-command::caret-split-rundll32
      - id: objectives/anti-static/obfuscation/string/delimiter::rundll32-obfuscated-split
      - id: micro-behaviors/process/create/shell/script-host::rundll32-command-reference
