defaults:
  platforms:
  - windows
  for:
  - batch
  - powershell
  - text
composite_rules:
- id: conhost-curl-tar-rundll32-profile
  desc: Conhost/curl/tar before rundll32 call
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/process/create/hidden::conhost-headless-cmd-invocation
  - id: micro-behaviors/communications/http/download/cli::curl-insecure-temp-single-letter
  - id: micro-behaviors/data/archive/extract/tar::temp-tar-extract-delete
  - id: objectives/execution/lolbin/rundll32::rundll32-endpointdlp-ordinal
