defaults:
  platforms: [windows]
  for: [scripts, source, binaries, lnk, xml]
  crit: suspicious
  conf: 0.97
  attack: T1218.002,T1105
traits:
  - id: control-rundll-unc-applet
    desc: Shell32 applet command targets remote UNC
    if:
      type: text
      regex: '(?i)\bshell32(\.dll)?,Control_RunDLL\s+["\x27]?(\x5c){2,4}[\w.@-]{1,253}\x5c'
