defaults:
  for: [text, xml]
  platforms: [windows]
  crit: suspicious
  conf: 0.98
  attack: T1218.011

composite_rules:
  - id: task-url-handler-exe-action
    desc: Task action proxies executable opening through rundll32
    near_lines: 4
    all:
      - id: micro-behaviors/os/autorun/task-xml-scheduled::task-rundll32-command-xml
      - id: micro-behaviors/os/handler/open::task-url-handler-exe-arguments
