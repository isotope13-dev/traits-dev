# Browser cache payload executed via conhost proxy
defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1202,T1204.002,T1105
  mbc: B0030

composite_rules:
  - id: photoviewer-inetcache-conhost-execution
    desc: PhotoViewer fetch beside INetCache execution through conhost
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/cache::windows-inetcache-path-text
      - id: micro-behaviors/process/create/indirect::conhost-proxy-exec
      - id: micro-behaviors/communications/http/download/cli::photoviewer-fullscreen-url
