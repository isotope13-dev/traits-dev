defaults:
  platforms: [windows]
  crit: hostile
  attack: T1218.011

composite_rules:
  - id: dllmain-detached-rundll32-self-spawn-source
    desc: DllMain spawns detached rundll32 on own DLL
    conf: 0.97
    for: [c, cpp]
    all:
      - id: micro-behaviors/process/lifecycle/auto-exec::dllmain-process-attach-condition
      - id: micro-behaviors/fs/path/self::null-handle-module-path-call
      - id: metadata/lang/source/syntax/command/launch::rundll32-command-syntax-reference
      - id: micro-behaviors/process/create/subprocess/launch::create-process-source
    any:
      - id: micro-behaviors/process/config/launch::detached-process-source-token
      - id: micro-behaviors/process/create/hidden::create-process-no-window-argument
  - id: dll-rundll32-export-self-launch
    desc: PE DLL spawns rundll32 to invoke export
    conf: 0.96
    for: [pe, dll]
    size_max: 2097152
    all:
      - id: metadata/binary/header/characteristics::pe-dll-characteristics
      - id: metadata/lang/source/syntax/command/launch::rundll32-command-syntax-reference
      - id: micro-behaviors/process/create/exec::child-process-execution
    any:
      - id: micro-behaviors/process/info/current::get-module-filename-ansi
      - id: micro-behaviors/process/info/current::get-module-filename-wide
    unless:
      - id: metadata/signature/verified/platform::microsoft
      # The INF setup engine (advpack.dll) schedules its own DelNodeRunDLL32
      # through rundll32 by design; installers redistribute it unsigned.
      - id: micro-behaviors/os/package-manager/install::advpack-setup-entry-exports
