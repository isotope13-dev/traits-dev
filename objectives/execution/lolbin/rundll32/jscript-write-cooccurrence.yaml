defaults:
  platforms: [windows]
composite_rules:
  - id: jscript-rundll32-write-profile
    desc: rundll32 near JScript file-write clues
    crit: notable
    conf: 1.0
    near_lines: 40
  # Lines do not bound a minified bundle: Slack's dist/main.bundle.cjs is
  # 1.9 MB across 308 lines with a 222 KB longest line, so "within 40 lines"
  # spans hundreds of kilobytes and can pair an unrelated file write with a
  # legitimate URL-handler launch. Keep the write evidence close to the
  # rundll32 reference so unrelated code paths in a large source file do not
  # form this profile.
    near_bytes: 512
    all:
      - id: well-known/app/system/microsoft/rundll32::rundll32-command-reference
    any:
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file
      - id: micro-behaviors/fs/write/file/content::js-file-write
    unless:
      - id: well-known/tool/offensive/metasploit::framework-source-release-context
