defaults:
  platforms:
  - unix
  - windows
composite_rules:
- id: rundll32-cloudflare-tunnel-profile
  desc: Rundll32 export with Cloudflare tunnel clue
  crit: suspicious
  conf: 0.97
  attack: T1218.011
  for:
  - batch
  - powershell
  all:
  - id: objectives/command-and-control/infrastructure/domain/tunnel::cloudflare-tunnel
  - id: micro-behaviors/process/create/shell/script-host::rundll32-exec-with-args
