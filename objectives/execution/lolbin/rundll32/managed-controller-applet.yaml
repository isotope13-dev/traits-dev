# Both controller builds launch the sidecar CPL before opening their panel.
# Keep this actual local execution surface distinct from their embedded VB
# client source and unrelated UI resource/communications crypto helpers.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-rat-controller-hidden-applet-launch
    desc: RAT panel has hidden Control_RunDLL launch APIs
    crit: hostile
    conf: 0.98
    attack: T1218.002
    all:
      - id: objectives/command-and-control/backdoor/control/desktop::dotnet-rat-controller-attack-suite
      - id: micro-behaviors/process/create/shell/script-host::shell32-control-rundll-argument
      - id: micro-behaviors/process/create/hidden::dotnet-hidden-process-launch-setup
