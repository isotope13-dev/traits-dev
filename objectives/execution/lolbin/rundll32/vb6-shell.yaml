# Rundll32 is the required execution surface; no staged DLL is identified.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: vb6-rundll32-shell
  desc: VB6 Shell invokes rundll32
  all:
  - id: metadata/lang/source/syntax/command/invocation::rundll32-command-syntax-reference
  - id: micro-behaviors/process/create/exec::vb6-shell-execution
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  crit: suspicious
  attack: T1218.011
