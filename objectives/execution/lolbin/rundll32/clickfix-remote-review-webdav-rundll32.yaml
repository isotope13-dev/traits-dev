defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, html, vbs, text]
  attack: T1204.002,T1105,T1218.011
  mbc: B0024


composite_rules:
  - id: caret-webdav-rundll32-run
    desc: Caret-obfuscated Rundll32 and WebDAV Run export
    crit: hostile
    conf: 0.99
    attack: T1027,T1105,T1218.011
    near_bytes: 1024
    all:
      - id: objectives/anti-static/obfuscation/string/delimiter::caret-split-rundll32
      - id: micro-behaviors/communications/http/webdav::delayed-ssl-webdav-share
      - id: micro-behaviors/process/argument/file::dll-named-run-export-argument
  - id: headless-conhost-webdav-ordinal-loader
    for: [batch, javascript, powershell, vbs]
    desc: Headless conhost with reconstructed WebDAV ordinal loader
    crit: hostile
    conf: 0.995
    attack: T1204.004,T1027,T1105,T1218.011
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/create/hidden::conhost-headless
      - id: micro-behaviors/process/create/shell/command-mode::cmd-delayed-expansion-c
      - id: micro-behaviors/communications/http/webdav::webdav-ssl-unc-path
      - id: objectives/anti-static/obfuscation/string/delimiter::cmd-prefix-toolchain-reconstruction
      - id: objectives/execution/lolbin/os::webdav-ordinal-export-argument
