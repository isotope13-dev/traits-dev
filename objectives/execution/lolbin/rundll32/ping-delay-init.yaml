# The ping template and the init-export format are the launch, separate from
# the filename alphabet that identifies the same family.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1218.011,T1059.003

composite_rules:
  - id: ping-delayed-rundll32-init-launch
    desc: Ping delay then rundll32 DLL export launch
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/shell/command-mode::ping-delayed-shell-command-template
      - id: micro-behaviors/fs/path/system::rundll32-system32-path
      - id: micro-behaviors/process/create/exec::winexec
    any:
      - id: micro-behaviors/process/argument/file::dll-init-export-command-format
      - id: micro-behaviors/process/argument/file::dll-export-argument-command-format
    unless:
      - id: metadata/signed/platform/
