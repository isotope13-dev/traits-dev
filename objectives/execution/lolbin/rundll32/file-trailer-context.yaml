# A footer-indexed file write near rundll32 is evidence of this execution
# surface, but these clauses do not bind the written path to the DLL argument.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1218.011
  mbc: B0032.001

composite_rules:
  - id: powershell-trailer-index-dll-rundll32
    desc: Footer-indexed file write near rundll32
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/embedded/payload/trailer::powershell-footer-relative-int-read
      - id: micro-behaviors/fs/write/file/full::write-all-bytes
      - id: micro-behaviors/process/create/launch::rundll32-exe-literal
    any:
      - id: micro-behaviors/data/embedded/payload/trailer::powershell-seek-end-magic-compare
      - id: micro-behaviors/data/embedded/payload/trailer::powershell-length-relative-magic-compare
