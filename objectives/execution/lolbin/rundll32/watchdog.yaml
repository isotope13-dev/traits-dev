# Spawns temporary timed watchdog batch to kill rundll32 LOLBAS window
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1218.011,T1059.003
  mbc: E1059

composite_rules:
  - id: rundll32-watchdog-timed-termination
    desc: PhotoViewer cache execution with timed rundll32 termination
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/terminate/command::rundll32-taskkill-command
      - id: photoviewer-inetcache-conhost-execution
      - id: micro-behaviors/time/sleep/interval::timeout-command-delay
      - id: micro-behaviors/fs/path/temp::temporary-batch-path-reference
