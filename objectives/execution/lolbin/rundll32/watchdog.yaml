# Spawns temporary timed watchdog batch to kill rundll32 LOLBAS window
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1218.011,T1059.003
  mbc: B0024

composite_rules:
  - id: rundll32-watchdog-timed-termination
    desc: Spawns timed watchdog script to terminate rundll32 LOLBAS process
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/terminate/command::batch-taskkill-image-name
      - id: micro-behaviors/time/sleep/interval::timeout-command-delay
      - id: micro-behaviors/fs/path/temp::temporary-batch-path-reference
