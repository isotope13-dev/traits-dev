# A JavaScript program hands the Windows rundll32 host a DLL and an export
# name while hiding the launch from plain text: the program name is spelled
# across string concatenation and the `<dll>,<export>` argument is assembled
# the same way. Fragmenting a rundll32 launch line has no purpose other than
# keeping it out of a name-based search; the 2025 eslint-plugin-prettier
# compromise spawned `rundll32 <package>/node-gyp.dll,main` from an install
# script written this way.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1218.011

composite_rules:
  - id: js-fragmented-rundll32-dll-export-launch
    desc: Fragmented JavaScript launch of rundll32 with a DLL export
    crit: hostile
    conf: 0.96
    scope: file
    all:
      # The rundll32 name, hidden. The fragmented form below keeps the rule on
      # builds that split only the argument; the plain form inherits the
      # url.dll protocol-handler exclusion from its own legs.
      - id: objectives/anti-static/obfuscation/string/fragmentation::js-split-dll-export-argument
    any:
      - id: objectives/anti-static/obfuscation/string/fragmentation::js-lolbin-name-split-concat
      - id: micro-behaviors/process/create/shell/script-host::rundll32-command-reference
    unless:
      - id: metadata/package/testing/harness/unit/
      - id: metadata/package/testing/presence/manifest::test-fixtures
