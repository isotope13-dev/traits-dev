defaults:
  platforms: [unix, windows, macos]
composite_rules:
- id: jscript-rundll32-write-profile
  desc: rundll32 near JScript file-write clues
  crit: suspicious
  conf: 1.0
  platforms: [windows]
  near_lines: 40
  # Lines do not bound a minified bundle: Slack's dist/main.bundle.cjs is
  # 1.9 MB across 308 lines with a 222 KB longest line, so "within 40 lines"
  # spans hundreds of kilobytes and can pair an unrelated file write with a
  # legitimate URL-handler launch. Keep the write evidence close to the
  # rundll32 reference so unrelated code paths in a large source file do not
  # form this profile.
  near_bytes: 512
  all:
  - id: micro-behaviors/process/create/shell/script-host::rundll32-command-reference
  any:
  - id: micro-behaviors/fs/write/stream::adodb-save-to-file
  - id: micro-behaviors/fs/write/file/full::js-file-write
  unless:
  - id: well-known/tool/offensive/metasploit::framework-source-release-context
- id: jscript-msxml-hidden-rundll32-payload
  desc: MSXML-decoded payload saved and launched by hidden rundll32
  crit: hostile
  conf: 0.98
  attack: T1059.007, T1218.011, T1564.003
  platforms: [windows]
  for: [javascript]
  near_lines: 40
  near_bytes: 4096
  all:
  - id: micro-behaviors/process/deploy/file-exec::js-adodb-saved-path-hidden-rundll32
  - id: micro-behaviors/data/decode/base64::msxml-text-to-bytes
  - id: micro-behaviors/process/create/shell/wsh::msxml-adodb-no-wait-run
  unless:
  - id: well-known/tool/offensive/metasploit::framework-source-release-context
- id: jscript-adodb-hidden-rundll32-dropper
  desc: ADODB saved path launched by hidden rundll32
  crit: hostile
  conf: 0.98
  attack: T1059.007, T1218.011, T1564.003
  platforms: [windows]
  for: [javascript]
  near_lines: 40
  near_bytes: 4096
  all:
  - id: micro-behaviors/process/deploy/file-exec::js-adodb-saved-path-hidden-rundll32
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  # Require evidence of a remote executable acquisition as well as the
  # hidden launch. The saved-path observation alone also occurs in local
  # installers and test harnesses; a WinHTTP client plus an executable URL
  # makes this a much more specific downloader-and-execute chain.
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-com
  - id: micro-behaviors/communications/http/url/script::executable-url-reference-b
  unless:
  - id: well-known/tool/offensive/metasploit::framework-source-release-context
