defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1059.007, T1218.011, T1564.003
composite_rules:
  - id: jscript-msxml-hidden-rundll32-payload
    desc: MSXML-decoded payload saved and launched by hidden rundll32
    crit: hostile
    conf: 0.98
    near_lines: 40
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/deploy/file-exec/spawn::js-adodb-saved-path-hidden-rundll32
      - id: micro-behaviors/data/decode/base64/unspecified::msxml-text-to-bytes
      - id: objectives/execution/payload/file-exec/command/script-host-xml::msxml-adodb-no-wait-run
    unless:
      - id: well-known/tool/offensive/metasploit::framework-source-release-context
  - id: jscript-adodb-hidden-rundll32-dropper
    desc: ADODB saved path launched by hidden rundll32
    crit: hostile
    conf: 0.98
    near_lines: 40
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/deploy/file-exec/spawn::js-adodb-saved-path-hidden-rundll32
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
  # Bind response bytes to a saved stream instead of requiring an executable
  # URL suffix. Endpoints can serve DLL bytes without advertising an extension.
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-com
      - id: micro-behaviors/fs/write/stream::js-responsebody-variable-write
    unless:
      - id: well-known/tool/offensive/metasploit::framework-source-release-context
