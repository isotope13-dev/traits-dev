defaults:
  platforms: [unix, windows, macos]
composite_rules:
- id: jscript-rundll32-write-profile
  desc: rundll32 near JScript file-write clues
  crit: suspicious
  conf: 1.0
  platforms: [windows]
  near_lines: 40
  # Lines do not bound a minified bundle: Slack's dist/main.bundle.cjs is
  # 1.9 MB across 308 lines with a 222 KB longest line, so "within 40 lines"
  # spans hundreds of kilobytes and paired its rundll32 reference with an
  # unrelated file write. A JScript dropper writes the payload and invokes it
  # right there.
  near_bytes: 4096
  all:
  - id: micro-behaviors/process/create/shell/script-host::rundll32-command-reference
  any:
  - id: micro-behaviors/fs/write/stream::adodb-save-to-file
  - id: micro-behaviors/fs/write/file/full::js-file-write
  unless:
  - id: well-known/tool/offensive/metasploit::framework-source-release-context
- id: jscript-adodb-hidden-rundll32-dropper
  desc: JScript writes file with ADODB.Stream and executes hidden rundll32
  crit: hostile
  conf: 0.98
  attack: T1059.007, T1105, T1218.011, T1564.003
  platforms: [windows]
  for: [javascript]
  near_lines: 40
  near_bytes: 4096
  all:
  - id: micro-behaviors/process/create/shell/script-host::rundll32-command-reference
  - id: micro-behaviors/fs/write/stream::adodb-save-to-file
  - id: micro-behaviors/process/create/shell/wsh::wsh-run-style-and-false-wait-spelling
  unless:
  - id: well-known/tool/offensive/metasploit::framework-source-release-context
