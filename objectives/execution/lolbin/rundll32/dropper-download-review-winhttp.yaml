defaults:
  platforms: [windows]
  for: [pe]


composite_rules:
  - id: xor-winhttp-rundll32-execution-clues
    desc: XOR WinHTTP and Rundll32 execution clues
    crit: hostile
    conf: 0.99
    attack: T1105,T1218.011
    mbc: B0024
    all:
      - id: micro-behaviors/communications/http/client/winhttp::xor-decoded-winhttp-request-flow
      - id: micro-behaviors/communications/url/host/domain-http::xor-decoded-http-url
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-createprocess-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-rundll32-host
    any:
      - id: micro-behaviors/mem/alloc/virtual::xor-decoded-virtual-alloc-api
      - id: metadata/binary/instruction/sequence/unspecified::allocation-like-argument-patterns
    downgrade:
      any:
        - id: metadata/installer/product/
