# PhotoViewer ImageView_Fullscreen remote URL download cradle
defaults:
  platforms: [windows]
  for: [batch, powershell, text]
  crit: notable
  conf: 0.95

traits:
  - id: photoviewer-fullscreen-url
    desc: PhotoViewer ImageView_Fullscreen remote URL
    if:
      type: text
      regex: '(?i)ImageView_Fullscreen\s+https?://'
