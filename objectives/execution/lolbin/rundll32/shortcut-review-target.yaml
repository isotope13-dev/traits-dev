defaults:
  platforms: [windows]
  attack: T1204.002
  for: [lnk]

composite_rules:
  - id: lnk-cmd-rundll32-ordinal
    desc: LNK cmd launches rundll32 by ordinal
    crit: suspicious
    conf: 0.99
    attack: T1059.003,T1218.011,T1204.002
    all:
      - id: micro-behaviors/process/config/target::lnk-cmd-target
      - id: micro-behaviors/process/argument/option::lnk-slash-c-switch
      - id: micro-behaviors/process/argument/executable::rundll32-ordinal-argument
      - id: micro-behaviors/ui/graphics/icon::lnk-shell32-icon-location
