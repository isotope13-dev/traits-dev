defaults:
  platforms: [windows]
  for: [text, batch, ico, png, jpeg]
  attack: T1202,T1059.003

composite_rules:
  - id: ftp-script-bang-pipe-exec
    desc: FTP command script pipes bang shell escape to interpreter
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/ftp/client::ftp-bang-pipe-interpreter
    any:
      - id: micro-behaviors/communications/ftp/client::ftp-script-session-terminator
      - id: micro-behaviors/communications/ftp/client::ftp-raw-media-session-terminator

  - id: ftp-script-disguised-media-shell-escape
    desc: Media-named FTP script executes local command via bang escape
    crit: hostile
    conf: 0.97
    attack: T1202,T1036.008
    for: [ico, png, jpeg]
    all:
      - id: metadata/file/format/media::media-content-is-text
      - id: micro-behaviors/communications/ftp/client::ftp-raw-media-session-terminator
    any:
      - id: micro-behaviors/communications/ftp/client::ftp-bang-local-shell-escape
      - id: micro-behaviors/communications/ftp/client::ftp-bang-pipe-interpreter
