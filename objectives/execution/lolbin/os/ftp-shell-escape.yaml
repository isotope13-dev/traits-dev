defaults:
  platforms: [windows]
  # `media` covers png/jpeg/gif/wav/mp3/aiff/tiff script carriers; ico is a
  # separate type, and bmp-named text files are typed as text. An ftp.exe
  # -s: script works no matter which asset extension it wears.
  for: [text, batch, ico, media]
  attack: T1202,T1059.003

composite_rules:
  # The two raw media terminators are one alternative split across file-type
  # caps; a plain-text bye/quit line (text-typed files) is covered separately.
  - id: ftp-media-session-terminator-alternative
    desc: FTP media session terminator alternative
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/ftp/client::ftp-raw-media-session-terminator
      - id: micro-behaviors/communications/ftp/client::ftp-raw-media-session-terminator-alt

  - id: ftp-script-bang-pipe-exec
    desc: FTP command script pipes bang shell escape to interpreter
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/ftp/client::ftp-bang-pipe-interpreter
    any:
      - id: micro-behaviors/communications/ftp/client::ftp-script-session-terminator
      - id: ftp-media-session-terminator-alternative

  - id: ftp-script-disguised-media-shell-escape
    desc: Media-named FTP script executes local command via bang escape
    crit: hostile
    conf: 0.97
    attack: T1202,T1036.008
    for: [ico, media]
    all:
      - id: metadata/file/format/media::media-content-is-text
      - id: ftp-media-session-terminator-alternative
    any:
      - id: micro-behaviors/communications/ftp/client::ftp-bang-local-shell-escape
      - id: micro-behaviors/communications/ftp/client::ftp-bang-pipe-interpreter
