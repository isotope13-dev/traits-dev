defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows]
  for: [scripts, source]
  attack: T1112,T1218.011

composite_rules:
  - id: user-reg-import-rundll32-sta-handoff
    desc: Registry import precedes pathless COM activation
    near_lines: 2
    all:
      - id: micro-behaviors/os/registry/manipulate::reg-import-user-writable-file
      - id: micro-behaviors/process/create/shell/script-host::rundll32-sta-clsid-activation
