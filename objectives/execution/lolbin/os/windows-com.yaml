defaults:
  crit: hostile
  conf: 0.99
  platforms:
  - windows
  for:
  - scripts
  - source
  attack: T1112,T1218.011
composite_rules:
- id: user-reg-import-rundll32-sta-handoff
  desc: User registry import with pathless COM activation
  near_lines: 2
  all:
  - id: micro-behaviors/os/registry/manipulate::reg-import-user-writable-file
  - id: micro-behaviors/process/create/shell/script-host::rundll32-sta-clsid-activation
- id: remote-msiexec-pathless-com-dropper
  desc: Remote MSI install with pathless COM activation
  for: [batch, powershell, vbs, javascript, python, scripts, lnk]
  near_lines: 16
  attack: T1105,T1218.007,T1218.011
  all:
  - id: micro-behaviors/process/create/installer::remote-msi-download-install
  - id: micro-behaviors/process/create/shell/script-host::rundll32-sta-clsid-activation
