defaults:
  platforms: [windows]
  for: [scripts, source]
  crit: suspicious
  attack: T1218

composite_rules:
  - id: systemroot-orchestrator-redirection
    desc: SystemRoot assignment with orchestrator stub; possible proxy execution
    conf: 0.95
    near_lines: 30
    all:
      - id: micro-behaviors/os/env/modify::systemroot-assignment
      - id: micro-behaviors/process/create/launch::uie-orchestrator-stub-reference

  - id: redirected-orchestrator-staging
    desc: SystemRoot assignment with copying and UUS path; possible payload staging
    conf: 0.93
    near_lines: 30
    all:
      - id: micro-behaviors/os/env/modify::systemroot-assignment
      - id: micro-behaviors/fs/path/system::uie-orchestrator-update-path
    any:
      - id: micro-behaviors/fs/file/copy::windows-copy-command
      - id: micro-behaviors/fs/file/copy::powershell-copy-item-command
      - id: micro-behaviors/fs/file/copy::shutil-copy
