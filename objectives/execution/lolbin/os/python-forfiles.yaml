# Python can use forfiles /c as a proxy for launching a selected file. Keep
# the process API, executable and command template in one bounded matcher;
# a bare forfiles reference does not establish execution.
defaults:
  for: [python]
  platforms: [windows]

traits:
  - id: python-forfiles-cmd-call-path
    desc: Python proxies file execution via forfiles
    crit: suspicious
    conf: 0.97
    attack: T1218
    if:
      type: text
      regex: '(?s)subprocess\.Popen\(\s*\[\s*["'']forfiles\.exe["''].{0,300}cmd /c call @path'
