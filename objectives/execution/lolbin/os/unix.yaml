# Unix LOLBins (Living-off-the-Land Binaries)
# MBC: C0049 (Execution - LoLBins)
# ATT&CK: T1218 (System Binary Proxy Execution)
defaults:
  platforms: [unix]
  conf: 0.9
traits:
- id: python-shell-exec-system
  desc: python -c exec/system/popen
  crit: component
  for: [shell]
  if:
    type: text
    regex: '\bpython[23]?\s+-c\s+[''"].{0,200}\b(exec|system|popen)\b'
- id: python-shell-spawn-subprocess
  desc: python -c spawn/subprocess
  crit: component
  for: [shell]
  if:
    type: text
    regex: '\bpython[23]?\s+-c\s+[''"].{0,200}\b(spawn|subprocess)\b'
- id: perl-shell-execution
  desc: Shell execution via perl -e
  crit: notable
  for: [shell]
  if:
    type: text
    regex: 'perl\s+-e\s+[''"].{0,200}(exec\(|system\()'

- id: ruby-shell-execution
  desc: Shell execution via ruby -e
  crit: notable
  for: [shell]
  if:
    type: text
    regex: 'ruby\s+-e\s+[''"].{0,200}(exec\(|system\()'

# MOVED: suspicious-bash-c-redirection ->
# micro-behaviors/process/create/shell/command-mode::bash-c-output-discarded.
# The matcher only observes "runs /bin/bash -c and discards the output" — a
# neutral shell-invocation capability, not a living-off-the-land technique, and
# the idiom that every SysV/systemd wrapper, Dockerfile RUN line, cron helper
# and package post-install script uses. Composites that need the stealth
# reading (e.g. well-known/malware/supply-chain/abpai-skills-codex) reference
# the capability and supply their own anchor.

- id: python-c-constructed-arg
  desc: python -c builds command non-literally
  crit: component
  for: [shell]
  if:
    type: text
    regex: '\bpython[23]?\s+-c\s+[''"].{0,200}(\.format\(|f[''"]\{|\[[''"]\w{1,12}[''"]\])'
- id: python-c-subprocess-shell-arg
  desc: python -c subprocess shell=True arg
  crit: component
  for: [shell]
  if:
    type: text
    regex: '\bpython[23]?\s+-c\s+[''"].{0,200}subprocess\.\w{1,6}\([^)]{0,80}shell\s*=\s*True'

composite_rules:
- id: python-shell-execution
  desc: Shell execution via python -c
  crit: notable
  conf: 1.0
  for: [shell]
  any:
  - id: python-shell-exec-system
  - id: python-shell-spawn-subprocess
- id: unix-lolbin
  desc: Any Unix LOLbin execution
  crit: notable
  unless:
  - id: well-known/app/infrastructure/docker::source-tree
  any:
  - id: python-shell-execution
  - id: perl-shell-execution
  - id: ruby-shell-execution
  - id: micro-behaviors/process/create/shell/command-string::sh-c-exec

# --- python -c inline dropper with a constructed (non-literal) command ------
# Suspicious tier: cleartext command built via format/fstring/dict/var inside a
# `python -c` one-liner. Gated on the shell-level python -c invocation so real
# .py files using os.system(f"...") are NOT matched (those are for:[python]).
- id: python-c-constructed-dropper
  desc: python -c constructed shell-exec command
  crit: suspicious
  conf: 0.85
  for: [shell]
  attack: T1059.006
  all:
  - id: python-shell-execution
  - id: python-c-constructed-arg
- id: python-c-subprocess-shell-true
  desc: python -c subprocess shell=True dropper
  crit: suspicious
  conf: 0.85
  for: [shell]
  attack: T1059.006
  all:
  - id: python-shell-execution
  - id: python-c-subprocess-shell-arg

# REMOVED: stealth-lolbin-execution. Its `any:` had been whittled down to a
# single leg (the bash -c redirection atom), making it an alias of a neutral
# capability wrapped in an ever-growing per-project `unless:` list — dokku,
# adguardhome, proxmox helper scripts, autoconf output. Suppressing benign
# projects one at a time was the tell that the underlying observation carries
# no intent; the capability now lives at notable in
# micro-behaviors/process/create/shell/command-mode.
