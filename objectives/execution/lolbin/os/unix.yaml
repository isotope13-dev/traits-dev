# Unix LOLBins (Living-off-the-Land Binaries)
# MBC: C0049 (Execution - LoLBins)
# ATT&CK: T1218 (System Binary Proxy Execution)
defaults:
  platforms: [unix]
  for: [shell]
  conf: 0.9
traits:
- id: python-c-subprocess-shell-arg
  desc: python -c subprocess shell=True arg
  crit: notable
  if:
    type: text
    regex: '\bpython[23]?\s+-c\s+[''"].{0,200}subprocess\.\w{1,6}\([^)]{0,80}shell\s*=\s*True'

- id: python-c-kdc-test-script
  desc: Heimdal kdc test script
  crit: notable
  conf: 0.95
  if:
    type: path
    regex: '(^|[\\/])check-kdc\.in$'
- id: python-c-exec-open-then-format
  desc: python -c execs a file then formats
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'python[23]?\s+-c\s+[''"]exec\(open\([^)]{1,40}\.py[''"]\)\.read\(\)\).{0,40}\.format\('
composite_rules:
- id: python-c-constructed-dropper
  desc: python -c constructed shell-exec command
  crit: suspicious
  conf: 0.85
  attack: T1059.006
  # The construction and the shell-exec must sit in the same command cluster:
  # unbounded co-occurrence matched JSON-extraction one-liners in one region
  # and exec helpers in another of the same large script.
  near_lines: 5
  all:
  - id: micro-behaviors/process/create/shell/command-string::python-shell-execution
  - id: micro-behaviors/process/create/eval::shell-python-c-format-or-subscript
  unless:
    # Heimdal's kdc test passes os.environ["KCC"] to check_output as an
    # argv list. The subscript is an env lookup, not a built shell command.
    - id: python-c-kdc-test-script
    # `exec(open("version.py").read())` loads constants; a later `.format`
    # prints them. That is not a command built for system or popen.
    - id: python-c-exec-open-then-format
- id: python-c-subprocess-shell-true
  desc: python -c subprocess shell=True dropper
  crit: suspicious
  conf: 0.85
  attack: T1059.006
  all:
  - id: micro-behaviors/process/create/shell/command-string::python-shell-execution
  - id: python-c-subprocess-shell-arg

# REMOVED: stealth-lolbin-execution. Its `any:` had been whittled down to a
# single leg (the bash -c redirection atom), making it an alias of a neutral
# capability wrapped in an ever-growing per-project `unless:` list — dokku,
# adguardhome, proxmox helper scripts, autoconf output. Suppressing benign
# projects one at a time was the tell that the underlying observation carries
# no intent; the capability now lives at notable in
# micro-behaviors/process/create/shell/command-mode.
