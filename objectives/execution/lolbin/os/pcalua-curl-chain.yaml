# LenAI ClickFix batch flow: a copy of curl.exe renamed to x1.exe downloads
# a.cmd, pcalua.exe (Program Compatibility Assistant) launches it so the
# process is parented by a trusted binary, then the staged files are deleted.
defaults:
  platforms: [windows]
  for: [batch, powershell, text]
  attack: T1218,T1105,T1036.003
traits:
  - id: pcalua-script-launch
    desc: Pcalua launches a script or executable
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bpcalua(\.exe)?\s[^\r\n]{0,40}-a\s+["'']?\S{1,120}\.(cmd|bat|ps1|vbs|js|hta)\b'
  - id: curl-copied-to-renamed-executable
    desc: curl.exe copied to a renamed executable
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(copy|xcopy|cp)\s+("[^"\r\n]{0,80}|\S{0,80})\bcurl(\.exe)?"?\s+\S{1,80}\.exe\b'
composite_rules:
  - id: renamed-curl-pcalua-download-chain
    desc: Renamed curl download launched via pcalua
    crit: hostile
    conf: 0.95
    near_bytes: 1500
    all:
      - id: pcalua-script-launch
      - id: curl-copied-to-renamed-executable
