# Windows modules that stage payload downloads through signed system
# binaries. Each command template is neutral download capability on its own
# (installers and deployment scripts embed one); a native module carrying
# several rival LOLBin download chains as format templates is dropper
# staging - the chains are fallbacks for fetching a payload to run.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105,T1197
traits:
  - id: bitsadmin-transfer-download-template
    desc: bitsadmin transfer download template
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: (?i)bitsadmin(\.exe)?"?\s+/transfer\s+\S+\s+/download
  - id: certutil-urlcache-download-template
    desc: certutil urlcache download template
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: (?i)certutil(\.exe)?"?\s+-urlcache\s+-split\s+-f\s
  - id: curl-remote-output-template
    desc: curl remote download to local output template
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)curl(\.exe)?"?( +-[-A-Za-z]){1,4} +-o +"?%s"? +"?%s
composite_rules:
  - id: multi-lolbin-download-staging
    desc: Downloads payloads via bitsadmin, certutil and curl chains
    crit: hostile
    conf: 0.93
    attack: T1105,T1197,T1218
    all:
      - id: bitsadmin-transfer-download-template
      - id: certutil-urlcache-download-template
      - id: curl-remote-output-template
    unless:
      - id: metadata/signed/platform/
