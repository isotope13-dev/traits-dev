# Windows LOLBins (Living-off-the-Land Binaries)
# MBC: C0049 (Execution - LoLBins)
# ATT&CK: T1218 (System Binary Proxy Execution)
defaults:
  platforms: [windows]
  conf: 0.9
traits:
- id: msiexec-unattended-switch
  desc: msiexec unattended install switch
  crit: component
  conf: 0.88
  for: [batch, powershell, python]
  if:
    type: text
    regex: '/(passive|quiet|qn)\b'
    case_insensitive: true
- id: msiexec-allusers-property
  desc: msiexec ALLUSERS property
  crit: component
  conf: 0.88
  for: [batch, powershell, python]
  if:
    type: text
    substr: ALLUSERS=
    case_insensitive: true
- id: rundll32-exe-string
  desc: Explicit rundll32.exe string
  crit: component
  conf: 0.92
  for: [javascript, vbs, batch, powershell, python]
  if:
    type: text
    word: rundll32.exe
- id: shell32-openas-rundll
  desc: shell32 OpenAs_RunDLL export string
  crit: component
  conf: 0.98
  for: [javascript, vbs, batch, powershell, python]
  if:
    type: text
    exact: shell32,OpenAs_RunDLL
- id: rundll32-suspicious-export
  desc: Rundll32 with suspicious export
  crit: suspicious
  conf: 0.85
  for: [javascript, vbs, batch, powershell, python]
  if:
    type: text
    regex: >-
      (^|[;&|`"'(])\s*rundll32(\.exe)?\s+[^\r\n,]{1,160},\s*(qwerty|Run|start)\b
    case_insensitive: true
- id: cmd-start-rundll32-template
  desc: cmd start rundll32 execution template
  crit: suspicious
  conf: 0.95
  for: [pe, dll, batch, powershell]
  if:
    type: text
    exact: cmd /c start "" rundll32.exe "
- id: nemucod-export-fragments
  desc: 'Fragments of Nemucod-style export call'
  crit: suspicious
  for: [javascript, vbs]
  if:
    type: text
    regex: '",qwe".{0,50}"rty".{0,50}"323"'
    case_insensitive: true
  # GuardDog: MITRE ATT&CK T1218 System Binary Proxy Execution
- id: regsvr32-execution--rx-3
  desc: Regex component marker
  crit: component
  for: [batch, powershell, python]
  if:
    type: text
    substr: i:https
    case_insensitive: true
  count_max: 1021590
- id: control-cpl-execution
  desc: control.exe with CPL file
  crit: suspicious
  attack: "T1218.002"
  for: [batch, powershell, python]
  if:
    type: text
    regex: 'control(\.exe)?\s+\S+\.cpl'
    case_insensitive: true
- id: cmstp-execution
  desc: cmstp.exe execution
  crit: suspicious
  attack: "T1218.003"
  for: [batch, powershell, python]
  unless:
    - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    - id: well-known/dual-use/tunnel/mihomo::mihomo-comment-bundle
    - id: metadata/file/profile/identity::generated-attack-map-context
  if:
    type: text
    # Require a non-comment, non-variable-expansion command line.  A bare
    # token search also finds `cmstp` inside encoded batch comment padding.
    regex: '(?im)^[ \t]*[^\r\n]{0,240}\bcmstp(\.exe)?\b'
    case_insensitive: true
- id: installutil-execution
  desc: InstallUtil.exe execution
  crit: suspicious
  attack: "T1218.004"
  for: [batch, powershell, python]
  unless:
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: metadata/file/profile/identity::generated-attack-map-context
  if:
    type: text
    # A filename or NSIS include named installUtil.nsh is not execution.
    # Require an executable token at the start of a command line.
    regex: '(?im)^[ \t]*["'']?(InstallUtil\.exe|[A-Za-z]:[\\/].{0,80}[\\/]InstallUtil\.exe)\b'
    case_insensitive: true
- id: odbcconf-regsvr
  desc: odbcconf.exe with REGSVR
  crit: suspicious
  attack: "T1218.008"
  for: [batch, powershell, python]
  if:
    type: text
    regex: 'odbcconf(\.exe)?\s+.{0,120}\{\s*REGSVR\s+\S+\s*\}'
    case_insensitive: true
- id: regsvcs-execution
  desc: Direct regsvcs.exe command invocation
  crit: suspicious
  conf: 0.95
  attack: "T1218.009"
  for: [batch, powershell, python]
  if:
    type: text
    regex: '(?im)^[ \t]*(&[ \t]*)?([A-Za-z]:[\\/].{0,100}[\\/])?regsvcs(\.exe)?\b'
    case_insensitive: true
  unless:
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: metadata/file/profile/identity::generated-attack-map-context
- id: regsvcs-start-process
  desc: Start-Process launches regsvcs.exe
  crit: suspicious
  conf: 0.97
  attack: "T1218.009"
  for: [powershell]
  if:
    type: text
    regex: '(?i)Start-Process.{0,100}\bregsvcs(\.exe)?\b'
    case_insensitive: true
  unless:
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: metadata/file/profile/identity::generated-attack-map-context
- id: regsvcs-process-startinfo
  desc: ProcessStartInfo launches regsvcs.exe
  crit: suspicious
  conf: 0.97
  for: [powershell, python]
  if:
    type: text
    regex: '(?i)ProcessStartInfo\s*\(.{0,100}\bregsvcs(\.exe)?\b'
    case_insensitive: true
  unless:
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: metadata/file/profile/identity::generated-attack-map-context
- id: regsvcs-subprocess
  desc: Python subprocess launches regsvcs.exe
  crit: suspicious
  conf: 0.97
  attack: "T1218.009"
  for: [python]
  if:
    type: text
    regex: '(?i)subprocess\..{0,120}["'']regsvcs(\.exe)?\b'
    case_insensitive: true
  unless:
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: metadata/file/profile/identity::generated-attack-map-context
- id: regasm-execution
  desc: Direct regasm.exe command invocation
  crit: suspicious
  conf: 0.95
  attack: "T1218.009"
  for: [batch, powershell, python]
  if:
    type: text
    regex: '(?im)^[ \t]*(&[ \t]*)?([A-Za-z]:[\\/].{0,100}[\\/])?regasm(\.exe)?\b'
    case_insensitive: true
  unless:
  - id: well-known/lib/platform/wine::wine-source-tree
  - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: metadata/file/profile/identity::generated-attack-map-context
- id: regasm-start-process
  desc: Start-Process launches regasm.exe
  crit: suspicious
  conf: 0.97
  attack: "T1218.009"
  for: [powershell]
  if:
    type: text
    regex: '(?i)Start-Process.{0,100}\bregasm(\.exe)?\b'
    case_insensitive: true
  unless:
  - id: well-known/lib/platform/wine::wine-source-tree
  - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: metadata/file/profile/identity::generated-attack-map-context
- id: regasm-process-startinfo
  desc: ProcessStartInfo launches regasm.exe
  crit: suspicious
  conf: 0.97
  attack: "T1218.009"
  for: [powershell, python]
  if:
    type: text
    regex: '(?i)ProcessStartInfo\s*\(.{0,100}\bregasm(\.exe)?\b'
    case_insensitive: true
  unless:
  - id: well-known/lib/platform/wine::wine-source-tree
  - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: metadata/file/profile/identity::generated-attack-map-context
- id: regasm-subprocess
  desc: Python subprocess launches regasm.exe
  crit: suspicious
  conf: 0.97
  attack: "T1218.009"
  for: [python]
  if:
    type: text
    regex: '(?i)subprocess\..{0,120}["'']regasm(\.exe)?\b'
    case_insensitive: true
  unless:
  - id: well-known/lib/platform/wine::wine-source-tree
  - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: metadata/file/profile/identity::generated-attack-map-context
- id: verclsid-execution
  desc: verclsid.exe with CLSID
  crit: suspicious
  attack: "T1218.012"
  for: [batch, powershell, python]
  if:
    type: text
    regex: 'verclsid(\.exe)?\s+.{0,120}\{\s*\S+\s*\}'
    case_insensitive: true
  unless:
  - id: metadata/file/profile/identity::generated-attack-map-context
- id: mavinject-execution
  desc: mavinject.exe DLL injection
  crit: suspicious
  attack: "T1218.013"
  for: [batch, powershell, python]
  if:
    type: text
    regex: 'mavinject(\.exe)?\s+\d+\s+/INJECTRUNNING'
    case_insensitive: true
- id: mmc-embedding
  desc: mmc.exe with -Embedding
  crit: suspicious
  attack: "T1218.014"
  for: [batch, powershell, python]
  if:
    type: text
    regex: 'mmc(\.exe)?\s+-Embedding'
    case_insensitive: true
  unless:
  - id: metadata/file/profile/identity::generated-attack-map-context
- id: scriptrunner-execution
  desc: ScriptRunner.exe with -appvscript (LOLBin)
  crit: suspicious
  attack: "T1218"
  for: [scripts]
  if:
    type: text
    regex: 'ScriptRunner(\.exe)?\s+-appvscript'
    case_insensitive: true
- id: finger-remote-query
  desc: finger.exe remote query execution
  crit: suspicious
  for: [batch, powershell, javascript, vbs, html]
  if:
    type: text
    regex: 'finger(\.exe)?\s+([-/][A-Za-z0-9?._-]+\s+){0,2}[A-Za-z0-9._-]{1,64}@[A-Za-z0-9.-]{1,253}'
    case_insensitive: true
  unless:
    - id: well-known/tool/detection/debian-security-tracker::security-tracker-cve-leaf
    - id: metadata/document/html/
  conf: 1.0
  attack: "T1105"

- id: webdav-ordinal-export-argument
  desc: WebDAV payload referenced by ordinal export
  crit: suspicious
  conf: 0.97
  attack: T1105,T1218.011
  for: [batch, powershell, vbs, javascript]
  if:
    type: text
    regex: '(?i)@SSL[^\r\n]{0,160}\b[A-Za-z0-9][A-Za-z0-9._-]{1,63},\s*#\d+\b'

composite_rules:
- id: xor-winhttp-rundll32-proxy-exec
  desc: Obfuscated remote payload execution through rundll32
  crit: hostile
  conf: 0.99
  attack: T1105,T1218.011
  mbc: B0024
  for: [pe, dll]
  all:
  - id: micro-behaviors/communications/http/client/winhttp::xor-decoded-winhttp-request-flow
  - id: objectives/anti-static/obfuscation/decoders::xor-decoded-createprocess-api
  - id: objectives/anti-static/obfuscation/decoders::xor-decoded-rundll32-host
  - id: objectives/anti-static/obfuscation/decoders::xor-decoded-virtual-alloc-api
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: metadata/binary/installer/family/
- id: msiexec-unattended-machine-install
  desc: Unattended system-wide msiexec install
  crit: suspicious
  for: [batch, powershell, python]
  all:
  - id: micro-behaviors/process/create/installer::msiexec-package-verb
  - id: msiexec-unattended-switch
  - id: msiexec-allusers-property
  unless:
  # An installer that pinned and verified the package's digest is a
  # bootstrap, not msiexec LOLBin abuse.
  - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context
- id: msiexec-execution
  desc: msiexec.exe execution
  crit: suspicious
  attack: "T1218.007"
  for: [batch, powershell, python]
  all:
  - id: micro-behaviors/process/create/installer::msiexec-package-verb
  - id: micro-behaviors/fs/path/extension::msi
  unless:
  downgrade:
    any:
    - type: raw
      regex: 'msiexec(\.exe)?[^\\r\\n]{0,64}-Embedding\b'
      case_insensitive: true
    - type: raw
      regex: 'msiexec(\.exe)?\s+/[ilxapqfy]'
      case_insensitive: true
    - id: objectives/execution/lolbin/os/
    - type: text
      substr: ChocolateyProcessAsAdmin
    - type: text
      substr: Start-ChocolateyProcessAsAdmin
- id: rundll32-openas-execution
  desc: OpenAs_RunDLL execution via rundll32
  crit: suspicious
  conf: 0.98
  for: [javascript, vbs, batch, powershell, python]
  all:
  - id: rundll32-exe-string
  - id: shell32-openas-rundll
- id: windows-lolbin
  desc: Any Windows LOLbin execution
  crit: notable
  unless:
  - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  any:
  - id: micro-behaviors/process/create/shell/script-host::rundll32-command-reference
  - id: rundll32-openas-execution
  - id: cmd-start-rundll32-template
  - id: regsvr32-execution
  - id: control-cpl-execution
  - id: cmstp-execution
  - id: installutil-execution
  - id: micro-behaviors/process/create/launch::mshta-execution
  - id: msiexec-execution
  - id: msiexec-unattended-machine-install
  - id: odbcconf-regsvr
  - id: regsvcs-execution
  - id: regsvcs-start-process
  - id: regsvcs-process-startinfo
  - id: regsvcs-subprocess
  - id: regasm-execution
  - id: regasm-start-process
  - id: regasm-process-startinfo
  - id: regasm-subprocess
  - id: verclsid-execution
  - id: mavinject-execution
  - id: mmc-embedding
  - id: scriptrunner-execution
  - id: finger-remote-query
- id: regsvr32-execution
  desc: regsvr32.exe LOLBin scriptlet execution
  crit: suspicious
  conf: 1.0
  attack: "T1218.010"
  for: [batch, powershell, python]
  unless:
  - id: well-known/app/productivity/winmerge::winmerge-shell-extension-register
  - id: well-known/app/media/obs-studio
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/tool/offensive/bingo/
  all:
  - id: micro-behaviors/process/create/launch::regsvr32
  any:
  - id: micro-behaviors/dylib/library/com::scrobj
  - id: regsvr32-execution--rx-3

- id: rundll32-ordinal-webdav-loader
  desc: Rundll32 loads a remote WebDAV payload by ordinal
  crit: hostile
  conf: 0.99
  attack: T1105,T1218.011
  for: [batch, powershell, vbs, javascript]
  all:
  - id: micro-behaviors/communications/http/webdav::webdav-ssl-unc-path
  - id: webdav-ordinal-export-argument
  any:
  - id: micro-behaviors/process/create/shell/script-host::rundll32-ordinal-host

- id: caret-obfuscated-rundll32-webdav-loader
  desc: Caret-obfuscated ordinal WebDAV loader
  crit: hostile
  conf: 0.99
  attack: T1027,T1105,T1218.011
  for: [batch, powershell]
  all:
  - id: micro-behaviors/communications/http/webdav::webdav-ssl-unc-path
  - id: webdav-ordinal-export-argument
  any:
  - id: objectives/anti-static/obfuscation/string/delimiter

- id: delayed-rundll32-webdav-loader
  desc: Delayed-expansion ordinal WebDAV loader
  crit: hostile
  conf: 0.99
  attack: T1027,T1105,T1218.011
  for: [batch, powershell]
  all:
  - id: micro-behaviors/communications/http/webdav::webdav-ssl-unc-path
  - id: webdav-ordinal-export-argument
  - id: objectives/anti-static/obfuscation/string/delimiter::cmd-delayed-rundll32-assembly

- id: rundll32-webdav-cookie-persistence
  desc: Rundll32 persists a WebDAV session cookie
  crit: hostile
  conf: 0.99
  attack: T1105,T1218.011
  for: [batch, powershell, vbs, javascript]
  all:
  - id: micro-behaviors/communications/http/webdav::webdav-ssl-unc-path
  - id: micro-behaviors/process/create/shell/script-host::rundll32-davsetcookie

- id: pcalua-webdav-ordinal-loader
  desc: Pcalua launches an ordinal WebDAV loader
  crit: hostile
  conf: 0.99
  attack: T1105,T1218
  for: [batch, powershell]
  all:
  - id: micro-behaviors/process/create/launch::pcalua-interpreter-launch
  - id: micro-behaviors/communications/http/webdav::webdav-ssl-unc-path
  - id: webdav-ordinal-export-argument
