defaults:
  platforms: [windows]
  for: [msi]
composite_rules:
  - id: msbuild-appdata-data-project
    desc: MSI proxies AppData data-file execution through MSBuild
    crit: suspicious
    conf: 0.97
    attack: T1127.001
    all:
      - id: micro-behaviors/process/create/compile::msi-localappdata-data-project
      - id: metadata/binary/installer/database::msi-localappdata-install-root
