defaults:
  platforms: [windows]
  for: [msi]
composite_rules:
  - id: msbuild-appdata-data-project
    desc: MSI proxies AppData data-file execution through MSBuild
    crit: suspicious
    conf: 0.97
    attack: T1127.001
    all:
      - id: well-known/tool/development/build/msbuild::msi-localappdata-data-project
      - id: micro-behaviors/fs/path/app-data/platform::msi-localappdata-install-root
