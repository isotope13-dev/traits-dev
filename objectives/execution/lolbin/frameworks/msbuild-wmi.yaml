composite_rules:
  - id: powershell-msbuild-runspace-wmi-dispatch
    desc: MSBuild runspace task with WMI method dispatch
    crit: suspicious
    conf: 0.96
    for: [powershell]
    platforms: [windows]
    all:
      - id: powershell-msbuild-inline-runspace
      - id: micro-behaviors/os/wmi/manipulate::powershell-invoke-wmi-method-call
