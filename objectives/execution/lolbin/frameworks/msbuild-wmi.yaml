composite_rules:
- id: powershell-msbuild-runspace-wmi-dispatch
  desc: Executes an MSBuild runspace task through WMI
  crit: hostile
  conf: 0.96
  for:
  - powershell
  platforms:
  - windows
  all:
  - id: powershell-msbuild-inline-runspace
  - id: micro-behaviors/os/wmi/manipulate::powershell-invoke-wmi-method-call
  - id: micro-behaviors/os/wmi/manipulate::powershell-wmi-process-create-argument-map
