defaults:
  platforms: [windows]
  for: [batch]
  attack: T1127.001

composite_rules:
- id: batch-msbuild-hybrid-script-exec
  desc: MSBuild executes a hybrid batch project
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/fs/path/binary::dotnet-framework-runtime-exe-path
  - id: well-known/tool/development/build/msbuild::batch-msbuild-script-input
  - id: micro-behaviors/os/env/write::msbuild-all-property-functions-enabled

- id: batch-msbuild-shellcode-project-invocation
  desc: MSBuild project and shellcode-template references
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/fs/path/binary::dotnet-framework-runtime-exe-path
  - id: micro-behaviors/metaprogramming/generation/build::msbuild-project-argument
  - id: metadata/lang/source/naming/injection::msbuild-shellcode-template-reference
