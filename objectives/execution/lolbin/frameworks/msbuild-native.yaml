# Preserve the native-buffer/thread variant formerly swept into the broad
# msbuild-proxy-exec disjunction. A wait loop, a download or a PowerShell
# namespace alone cannot satisfy this. References do not prove that the copied
# buffer is the thread entry point, so this remains suspicious.
defaults:
  platforms: [windows]
  for: [xml]

traits:
  - id: msbuild-native-task-executes-mimikatz
    desc: MSBuild inline task runs Mimikatz
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: Executing Mimikatz

composite_rules:
  - id: msbuild-native-memory-thread-api-profile
    desc: MSBuild task has allocation/copy/thread APIs
    crit: suspicious
    conf: 0.95
    attack: T1127.001
    all:
      - id: metadata/build/msbuild::msbuild-inline-task-declaration
      - id: micro-behaviors/mem/alloc/virtual::xml-virtualalloc-api-reference
      - id: micro-behaviors/mem/copy::marshal-copy
      - id: micro-behaviors/process/thread/create::xml-create-thread-reference

  - id: msbuild-inline-mimikatz-memory-payload
    desc: Inline MSBuild task loads and executes a Mimikatz payload in memory
    crit: hostile
    conf: 0.995
    attack: T1003.001,T1127.001,T1620
    all:
      - id: objectives/execution/lolbin/frameworks::msbuild-native-memory-thread-api-profile
      - id: msbuild-native-task-executes-mimikatz
