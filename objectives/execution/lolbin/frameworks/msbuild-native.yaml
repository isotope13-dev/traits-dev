# Preserve the native-buffer/thread variant formerly swept into the broad
# msbuild-proxy-exec disjunction. A wait loop, a download or a PowerShell
# namespace alone cannot satisfy this. References do not prove that the copied
# buffer is the thread entry point, so this remains suspicious.
defaults:
  platforms: [windows]
  for: [xml]

composite_rules:
  - id: msbuild-native-memory-thread-api-profile
    desc: MSBuild task has allocation/copy/thread APIs
    crit: suspicious
    conf: 0.95
    attack: T1127.001
    all:
      - id: metadata/build/manifest::msbuild-inline-task-declaration
      - id: micro-behaviors/mem/alloc/virtual::xml-virtualalloc-api-reference
      - id: micro-behaviors/mem/copy::marshal-copy
      - id: micro-behaviors/process/thread/create::xml-create-thread-reference
