# InstallUtil.exe LOLBin Detection
# InstallUtil is a legitimate .NET tool frequently abused to execute malicious assemblies
# MITRE ATT&CK: T1218.004 (Signed Binary Proxy Execution: InstallUtil)
defaults:
  crit: suspicious
  conf: 0.9
  attack: "T1218.004"
  platforms: [windows]
  for: [powershell, javascript, batch, python]
traits:
  - id: installutil-path-reference
    desc: "InstallUtil.exe path reference (LOLBin abuse)"
    if:
      type: encoded
      # Match Framework path with installutil - handle corrupted characters
      regex: 'Framework(64)?.{0,30}installutil'
      case_insensitive: true
  - id: installutil-exe-reference
    desc: "InstallUtil.exe executable reference"
    conf: 0.85
    if:
      type: encoded
      substr: "installutil.exe"
      case_insensitive: true
    unless:
      # CodeBuddy's CLI lists InstallUtil.exe in its program deny-list.
      - id: well-known/app/ai/coding-agent/codebuddy::codebuddy-headless-context
  - id: installutil-logfile-flag
    desc: "InstallUtil /logfile flag (output redirection)"
    conf: 0.8
    if:
      type: encoded
      regex: 'installutil.{0,20}/logfile'
      case_insensitive: true
  - id: installutil-logtoconsole-flag
    desc: 'InstallUtil /LogToConsole=false flag'
    conf: 0.85
    if:
      type: encoded
      regex: 'installutil.{0,20}/LogToConsole=false'
      case_insensitive: true
  # The payload side of T1218.004: an assembly carrying an Installer
  # subclass is what InstallUtil (or any installer host) will run. The
  # namespace reference alone is ordinary installer code, so it stays a
  # notable atom; the composites below add what the subclass does.
  - id: dotnet-installer-subclass-reference
    desc: ".NET Installer subclass reference"
    crit: notable
    conf: 0.92
    for: [pe, dll, csharp]
    if:
      type: text
      # The optional api: prefix is how a technique catalogue cites the type.
      # That citation is not an Installer subclass in the assembly.
      regex: 'api:System\.Configuration\.Install|System\.Configuration\.Install'
    not:
      - regex: '^api:'

composite_rules:
  - id: installer-subclass-hidden-process-launch
    desc: Installer subclass launches a hidden process
    crit: suspicious
    conf: 0.92
    for: [pe, dll]
    # Framework facades and the PowerShell engine list both APIs in the
    # metadata string heap, kilobytes apart. One installer method names them
    # together.
    near_bytes: 8192
    all:
      - id: dotnet-installer-subclass-reference
      - id: micro-behaviors/process/create/hidden::dotnet-hidden-process-launch-setup
  - id: installer-subclass-public-file-write
    desc: Installer subclass writes to a public folder
    crit: suspicious
    conf: 0.9
    for: [pe, dll]
    all:
      - id: dotnet-installer-subclass-reference
      - id: micro-behaviors/fs/write/file/full::dotnet-writealltext-token
      - id: micro-behaviors/fs/path/personal::windows-public-path
  # High-confidence LOLBin abuse pattern
  - id: installutil-lolbin-abuse
    desc: "InstallUtil LOLBin execution with stealth flags"
    crit: suspicious
    conf: 0.95
    all:
      - id: installutil-path-reference
    any:
      - id: installutil-logfile-flag
      - id: installutil-logtoconsole-flag
