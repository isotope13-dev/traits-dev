# SAP's external-program controller is a legitimate execution surface. Alert
# when structured process telemetry shows that a sapxpg child received a
# secondary-execution gadget in runtime arguments; do not key on a particular
# SAP SID, operating-system account, payload binary, or command definition.
defaults:
  for: [json]
  platforms: [unix, windows]
  conf: 0.98
  attack: T1059

composite_rules:
  - id: sapxpg-exec-gadget
    desc: SAPXPG child receives an exec gadget
    crit: suspicious
    all:
      - id: well-known/app/enterprise/sap::sapxpg-process-event
      - id: micro-behaviors/process/argument/option::process-exec-gadget
