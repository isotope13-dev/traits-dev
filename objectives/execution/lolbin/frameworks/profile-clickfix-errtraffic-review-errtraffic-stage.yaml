defaults:
  platforms: [windows]
  for: [powershell, html, javascript]


composite_rules:
  - id: verification-comment-servicemodelreg-injection-clues
    desc: Verification, ServiceModelReg and injection clues
    crit: suspicious
    conf: 0.99
    for: [powershell]
    near_bytes: 4096
    all:
      - id: metadata/lang/source/comment::clickfix-code-verification-comment
      - id: well-known/lib/runtime/managed/dotnet-runtime::servicemodelreg-exe-name
    any:
      - id: micro-behaviors/process/inject/runtime/memory::powershell-process-memory-api-profile
      - id: micro-behaviors/process/inject/runtime/memory::ps-kernel32-injection-api-references
      - id: micro-behaviors/process/config/launch::create-suspended-flag-reference
