# Visual Studio runs GetFrameworkPaths during the design-time build as soon
# as a project is opened, before the user compiles. Microsoft's own target
# only returns framework directories. A project that overrides that name and
# runs Exec is Trusted Developer Utilities proxy execution (T1127.001). This
# is not an inline CodeTaskFactory load and not a package install hook.
defaults:
  platforms: [windows]
  for: [xml]
  attack: T1127.001

traits:
  - id: getframeworkpaths-target
    desc: Target named GetFrameworkPaths
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)<Target\b[^>]{0,200}\bName\s*=\s*["'']GetFrameworkPaths["'']'

  - id: msbuild-exec-command
    desc: MSBuild Exec task with a command
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)<Exec\b[^>]{0,80}\bCommand\s*='

  - id: msbuild-makedir-task
    desc: MSBuild MakeDir task
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)<MakeDir\b'

  - id: msbuild-copy-sources
    desc: MSBuild Copy task names sources
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)<Copy\b[^>]{0,80}\bSourceFiles\s*='

  - id: msbuild-exec-executable
    desc: MSBuild Exec task names an executable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)<Exec\b[^>]{0,300}\.exe\b'

composite_rules:
  - id: getframeworkpaths-design-time-exec
    desc: Design-time GetFrameworkPaths target runs Exec
    crit: hostile
    conf: 0.97
    near_bytes: 500
    all:
      - id: getframeworkpaths-target
      - id: msbuild-exec-command

  - id: getframeworkpaths-stage-and-launch
    desc: GetFrameworkPaths stages and launches an exe
    crit: hostile
    conf: 0.98
    attack: T1127.001,T1105
    near_bytes: 500
    all:
      - id: getframeworkpaths-target
      - id: msbuild-exec-executable
    any:
      - id: msbuild-makedir-task
      - id: msbuild-copy-sources
    needs: 1
