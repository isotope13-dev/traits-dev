composite_rules:
  - id: squiblydoo
    desc: Squiblydoo (Regsvr32 bypass) technique detected
    conf: 0.95
    attack: T1218.010
    any:
      - id: squiblydoo-plain
      - id: squiblydoo-encoded
      - id: squiblydoo-raw-hex
  - id: squiblydoo-plain
    desc: Squiblydoo pattern (plain text)
    conf: 0.8
    all:
      - id: micro-behaviors/fs/path/application/executable::regsvr32-reference-or-call
      - id: micro-behaviors/dylib/library/com::scrobj
      - id: micro-behaviors/process/argument/option::install-url-argument
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
      - id: well-known/tool/offensive/bingo/
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
  - id: squiblydoo-encoded
    for: [pe, batch, javascript, powershell, vbs]
    desc: Squiblydoo pattern (encoded)
    conf: 0.8
    all:
      - id: micro-behaviors/fs/path/application/executable::regsvr32-encoded-name
      - id: micro-behaviors/dylib/library/com::scrobj-encoded
      - id: micro-behaviors/process/argument/option::encoded-install-url-argument
  - id: squiblydoo-raw-hex
    desc: Squiblydoo pattern (hex encoded)
    conf: 0.8
    all:
      - id: micro-behaviors/fs/path/application/executable::regsvr32-hex-name
      - id: micro-behaviors/dylib/library/com::scrobj-raw-hex
      - id: micro-behaviors/process/argument/option::hex-install-url-argument
defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [scripts, binaries]
