defaults:
  platforms: [windows]
  conf: 0.9
  for: [batch, powershell, python]
composite_rules:
  - id: regsvr32-execution
    desc: Regsvr32 scriptlet-execution command text
    crit: suspicious
    conf: 1.0
    attack: "T1218.010"
    unless:
      - id: well-known/app/productivity/winmerge::winmerge-shell-extension-register
      - id: well-known/app/media/obs-studio
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/tool/offensive/bingo/
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
      - id: well-known/tool/detection/
    all:
      - id: micro-behaviors/fs/path/application/executable::regsvr32-reference-or-call
    any:
      - id: micro-behaviors/dylib/library/com::scrobj
      - id: micro-behaviors/process/argument/option::install-url-argument
  - id: regsvr32-dllinstall-proxy-exec
    desc: "Invokes regsvr32 /n /i: for DllInstall"
    crit: suspicious
    conf: 0.96
    attack: "T1218.010"
    all:
      - id: micro-behaviors/fs/path/application/executable::regsvr32-reference-or-call
      - id: micro-behaviors/process/argument/option::regsvr32-no-register-install-args
  - id: regsvr32-dllinstall-run-key-persistence
    for: [batch]
    desc: "Persists and executes DLL via regsvr32 /n /i:"
    crit: hostile
    conf: 0.98
    attack: "T1218.010,T1547.001"
    all:
      - id: regsvr32-dllinstall-proxy-exec
      - id: micro-behaviors/os/registry/write::batch-reg-add-run-key-direct
