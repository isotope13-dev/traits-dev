defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
  - id: http-response-scriptlet-stage
    desc: HTTP response staging with hidden regsvr32 scriptlet command
    crit: hostile
    conf: 0.98
    attack: T1218.010,T1105
    near_bytes: 800
    all:
      - id: micro-behaviors/fs/write/stream::js-write-http-response-text
      - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
      - id: micro-behaviors/fs/write/file/stream::adodb-stream
      - id: micro-behaviors/os/application/target/utility::regsvr32-reference-or-call
      - id: micro-behaviors/fs/path/system/library::scrobj-name-reference
      - id: micro-behaviors/data/control-flow/dispatch/run::js-run-zero-boolean-arguments
