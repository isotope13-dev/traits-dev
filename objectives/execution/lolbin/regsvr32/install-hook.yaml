defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
  # An install hook can hand a remote scriptlet URL to regsvr32 directly,
  # without using a Python HTTP client or shell command API.  The combined
  # DllInstall + scrobj invocation is an install-time payload execution path.
  - id: pypi-custom-install-regsvr32-scriptlet
    desc: PyPI install hook executes remote regsvr32 scriptlet
    crit: hostile
    conf: 0.98
    attack: "T1195.002,T1218.010"
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
      - id: objectives/execution/lolbin/regsvr32::regsvr32-execution
      - id: micro-behaviors/process/argument/option::install-url-argument
