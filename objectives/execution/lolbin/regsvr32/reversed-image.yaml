defaults:
  platforms: [windows]
  for: [html]
  conf: 0.98

composite_rules:
  # An encoded drive-path regsvr32 command, image-extension write stage,
  # reversal and eval discriminate this from normal COM registration.
  # Matching profiles do not assert a shared path or successful execution.
  - id: reversed-regsvr32-image-stage-profile
    desc: Concealed regsvr32 command with JPEG write stage
    crit: hostile
    attack: T1218.010,T1027
    all:
      - id: objectives/anti-static/obfuscation/string/reverse::base64-reversed-regsvr32-drive-command
      - id: micro-behaviors/fs/write/file/stream::encoded-reversed-jpeg-save-call
      - id: micro-behaviors/fs/write/file/stream::encoded-reversed-responsebody-write
      - id: micro-behaviors/data/string/reverse::html-split-reverse-join-string
      - id: micro-behaviors/process/interpreter/eval/direct::eval-identifier-call-text
