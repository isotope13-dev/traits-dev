# regsvr32 run with /s /n /i in any order calls a DLL's DllInstall silently
# without registering it -- the proxy-execution form of regsvr32. Programs
# that pass each switch as its own argument (Rust's Command) keep them as
# back-to-back literals, so no space is required between them. Windows
# Active Setup also uses `regsvr32 /s /n /i:U`, so this stays suspicious.
# Seen in the JAVS `fffmpeg.exe` implant (2024): run_dll_regsrv task.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1218.010
traits:
  - id: regsvr32-silent-dllinstall-switches
    desc: regsvr32 with /s /n /i DllInstall switches
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)regsvr32(\.exe)?["\s]{0,2}(/[isn]\s?){3}'
