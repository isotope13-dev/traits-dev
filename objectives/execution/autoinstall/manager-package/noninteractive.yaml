defaults:
  platforms:
    - unix
    - android
    - ios
  for:
    - elf
    - shell
  crit: suspicious
  conf: 0.85
traits:
  - id: package-validation-script
    desc: Package validation script marker
    crit: notable
    if:
      type: text
      substr: This validates new installations
composite_rules:
  - id: multi-package-manager-install
    desc: Installs via several package managers
    crit: notable
    needs: 2
    any:
      - id: micro-behaviors/os/package-manager/install::apt-get-install
      - id: micro-behaviors/os/package-manager/install::yum-install
      - id: micro-behaviors/os/package-manager/install::dnf-install
      - id: micro-behaviors/os/package-manager/install::package-manager-conditional
    unless:
      - id: metadata/build/package-builder::build-install-helper-script
      - id: package-validation-script
      - id: metadata/build/recognized-contexts::benign-app-fp-context
