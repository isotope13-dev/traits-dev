defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: python-setup-interactive-requests-install
  desc: Setup script prompts near pip install requests
  crit: notable
  conf: 0.95
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/ui/terminal::setup-input-call-literal
  - id: micro-behaviors/ui/terminal::setup-install-prompt-word
  - id: micro-behaviors/os/package-manager/reference-install::pip-install-requests-command-literal
  near_lines: 1
