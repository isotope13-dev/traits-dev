defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: install-time-gated-execution
  desc: Platform-gated dependency install in setup.py
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/os/sysinfo/platform/runtime/platform::sys-platform-check
  - id: micro-behaviors/process/info/commandline::python-sys-argv-access
  - id: objectives/execution/autoinstall/pip::main-call-content
