defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: pypi-install-autoinstall-dropper
  desc: PyPI setup.py executes pip install command
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/build/pip::root-setup-py
  - id: metadata/build/package/recipe/setup-hooks::python-install-hook
  - id: micro-behaviors/process/create/subprocess/launch::python-command-exec-any
  any:
  - id: micro-behaviors/os/package-manager/dependency-setup::subprocess-pip-install-string
  - id: micro-behaviors/os/package-manager/dependency-setup::subprocess-pip-install-list
  - id: micro-behaviors/os/package-manager/dependency-setup::python-runtime-pip-install
  - id: micro-behaviors/os/package-manager/dependency-setup::python-uv-pip-install-command
  - id: micro-behaviors/os/package-manager/dependency-setup::os-system-pip-install
  - id: micro-behaviors/os/package-manager/dependency-setup::os-system-pip-install-requests
  - id: micro-behaviors/os/package-manager/dependency-setup::pip-main-install
