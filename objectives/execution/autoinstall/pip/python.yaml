defaults:
  platforms: [windows, unix]
  for:
    - python
  mbc: B0024
  attack: T1059.006
  crit: notable
traits:
  - id: sys-executable
    desc: pip install using sys.executable
    conf: 0.95
    if:
      type: text
      regex: sys\.executable.{0,120}--break-system-packages
  - id: main-call-content
    desc: Direct pip.main() call in source
    conf: 0.85
    if:
      type: text
      substr: 'pip.main('
  - id: github-vcs-install
    desc: pip installs GitHub VCS package
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: '(os\.system|subprocess|pip\.)[\s\S]{0,60}git\+https://github\.com/[^"'']{1,60}'
  - id: except-module-not-found-content
    desc: Import fallback invokes pip
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'except ModuleNotFoundError[\s\S]{0,500}\bpip\s*(\.main\s*)?\('
  - id: except-import-error-content
    desc: ImportError fallback invokes pip
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: 'except ImportError[\s\S]{0,500}\bpip\s*(\.main\s*)?\('
  - id: python-pip-main-fallback-function
    desc: Import-failure function calls pip.main
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      kind: function
      regex: '(?s)\btry\b.{0,600}\bexcept\s+(ImportError|ModuleNotFoundError)\b.{0,600}\bpip\.main\s*\('
  # Self-updater tell: a tool that queries the PyPI JSON API for its own latest
  # release before offering an upgrade. Malware that abuses --break-system-packages
  # to force-install attacker packages on PEP 668 systems does not check PyPI for
  # its own version. Used to clear the break-system-packages-autoinstall FP on
  # legitimate self-updating CLI packages.
  - id: subprocess-requests-install
    desc: Subprocess command includes the requests package
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'subprocess\.(run|Popen|call)\(\s*\[[^\]]{0,240}["'']requests["'']'
composite_rules:
  - id: yara-pip-fallback-install
    desc: Try import with pip install
    conf: 0.95
    crit: suspicious
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/build/pip::python-packaging-tool-tests
      # jieba's optional-paddle bootstrap (fixed public package, user-invoked,
      # logged) is not a silent fallback install; the marker lives in
      # well-known/lib/data alongside the other data-library markers.
      - id: well-known/lib/ai/jieba::jieba-paddle-bootstrap
      # CPython's own bundled ensurepip module (`ensurepip/__init__.py`,
      # shipped with every 2.7.9+/3.4+ interpreter) is exactly this shape --
      # `import ssl` guarded by `except ImportError`, then `import pip;
      # pip.main(args)` -- because it *is* pip's official bootstrap, not a
      # payload smuggled through a dependency's import-time fallback.
      - id: well-known/lib/stdlib/python-stdlib::python-stdlib-install-path
      - id: "metadata/file/naming::test-directory-component"
    all:
      - id: micro-behaviors/data/control-flow/error-handling::python-import-error-handler
      - id: metadata/build/pip::pip-or-pkg-resources-import
    any:
      - id: micro-behaviors/os/package-manager/install::subprocess-pip-install-call
      - id: sys-executable
      - id: micro-behaviors/os/package-manager/install::os-system-pip-install
      - id: main-call-content
  - id: pip-fallback-install-content
    desc: Try-import with pip.main() auto-install
    conf: 0.9
    crit: suspicious
    all:
      - id: micro-behaviors/os/package-manager/install::python-pip-module-import
      - id: python-pip-main-fallback-function
      - id: main-call-content
    any:
      - id: except-module-not-found-content
      - id: except-import-error-content
  - id: break-system-packages-autoinstall
    desc: Runtime pip bootstrap bypasses the PEP 668 package guard
    conf: 0.9
    # This is a risky dependency-bootstrap capability, not hostile intent by
    # itself. The hachazal keypair helper uses it only after optional crypto
    # imports fail, so keep the capability visible as notable.
    crit: notable
    all:
      - id: micro-behaviors/os/package-manager/install::break-system-packages-literal
    any:
      - id: micro-behaviors/os/package-manager/install::subprocess-pip-install-call
      - id: sys-executable
      - id: micro-behaviors/os/package-manager/install::os-system-pip-install
      - id: main-call-content
    unless:
      # This library exposes an explicit opt-in helper for installing optional
      # dependencies; its own package identity is benign context for that API.
      - id: well-known/lib/ai/agent-utilities::agent-utilities-library-context
      # AI-agent tools self-install/uninstall their own package at runtime
      # (e.g. clawmetry's `pip uninstall --break-system-packages clawmetry`).
      - id: well-known/tool/detection/ai-guardrail/
      # Legitimate self-updating CLI packages check PyPI for their own latest
      # release, then offer `pip install --upgrade <self> --break-system-packages`.
      - id: micro-behaviors/communications/http/services/registry::package-json-endpoint
      # Test monitors may bootstrap an optional metrics dependency at runtime;
      # the surrounding test-harness identity makes this a fixture behavior.
      - id: metadata/package/testing/presence/harness::test-directory
      # comfy-test's screenshot reporter bootstraps its own optional test
      # dependencies in disposable environments.
      - id: well-known/app/ai/media/comfy-test::screenshot-test-dependency-bootstrap

  # A library that installs another package the moment it is imported.
  #
  # `import yocolor` should colour text; the top.gg typosquat ran
  # `os.system(f"{sys.executable} -m pip install <url>")` at module scope, so
  # merely importing it fetched and installed a second package -- from
  # `files.pypihosted.org`, a lookalike of PyPI's real file host. Installing at
  # import time gives the attacker execution on any machine that so much as
  # imports the module, and it happens outside the resolver, so no lockfile,
  # audit or dependency scanner ever sees the package that arrives.
  #
  # A package that self-installs a missing dependency does exist (setup shims,
  # notebook helpers), so the module-scope + remote-URL pairing is what makes
  # this an objective rather than a capability.
  - id: import-time-remote-pip-install
    desc: Import-time pip install from a URL
    crit: hostile
    conf: 0.95
    attack: T1195.002,T1059.006
    all:
      - id: micro-behaviors/os/package-manager/install::python-runtime-pip-install
      - id: micro-behaviors/os/package-manager/install::pip-install-remote-url
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/recognized-contexts::benign-build-tooling-context

# A skill tool that shells pip install at runtime. This is an analyst-useful
# execution and supply-chain risk, but is not hostile by itself: legitimate
# skills bootstrap pinned optional dependencies into a private venv. Separate
# import-time, remote-URL, and typo-squat rules carry hostile intent where it
# is actually present.
      - id: "metadata/file/naming::test-directory-component"
