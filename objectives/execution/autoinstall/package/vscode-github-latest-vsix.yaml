defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002

composite_rules:
  - id: vscode-latest-release-vsix-install
    desc: Extension installs latest GitHub release VSIX
    crit: suspicious
    conf: 0.96
    all:
      - id: well-known/lib/development/vscode::require-vscode
      - id: micro-behaviors/communications/url/external/github::github-release-api-latest
      - id: micro-behaviors/communications/http/download/release::github-api-browser-download-url-member
      - id: micro-behaviors/fs/write/file/stream::create-write-stream
      - id: micro-behaviors/os/package-manager/ide-extension::vsix-package-file-literal
      - id: micro-behaviors/os/package-manager/ide-extension::vscode-install-extension-from-file
