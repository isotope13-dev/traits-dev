defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007

composite_rules:
  - id: vscode-direct-floating-npx-execution
    desc: Extension executes a floating npx package
    crit: suspicious
    conf: 0.94
    all:
      - id: well-known/lib/development/vscode::require-vscode
      - id: metadata/import/builtin::require-child-process
      - id: micro-behaviors/os/package-manager/run::node-exec-floating-npx-argument
