defaults:
  platforms: [unix, windows]
  for: [vsix, package.json, javascript]
  attack: T1105

composite_rules:
  - id: vscode-floating-chromium-without-sandbox
    desc: Extension runs floating Chromium without sandbox
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: micro-behaviors/os/package-manager/run::latest-chromium-resolver-unsandboxed-launch
