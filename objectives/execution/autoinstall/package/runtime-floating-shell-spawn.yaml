# A JavaScript launcher that starts a floating npx package through a shell and
# hands it the caller's full environment. Each leg is common alone. Together
# they run unpinned third-party code on every start with the caller's secrets in
# its environment. Nearby evidence limits unrelated file-wide correlations.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: runtime-floating-shell-spawn
    desc: Shell launches a floating npx package with inherited env
    crit: suspicious
    conf: 0.85
    near_lines: 10
    all:
      - id: metadata/lang/source/syntax/key-value::js-shell-true-property
      - id: micro-behaviors/process/create/subprocess/launch::spawn-call
      - id: micro-behaviors/os/env/enumerate/entries::js-process-env-spread
      - id: micro-behaviors/os/package-manager/run::npx-floating-command-literal
