defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007

composite_rules:
  - id: vscode-floating-npm-install-field
    desc: Extension terminal runs unversioned npm installer
    crit: suspicious
    conf: 0.95
    all:
      - id: well-known/lib/development/vscode::require-vscode
      - id: micro-behaviors/os/package-manager/run::floating-npm-cli-install-field
      - id: micro-behaviors/os/package-manager/run::terminal-runs-cli-install-field
