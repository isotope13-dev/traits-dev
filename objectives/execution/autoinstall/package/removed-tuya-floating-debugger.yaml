defaults:
  platforms: [unix, windows]
  for: [vsix, javascript]
  attack: T1059.007

composite_rules:
  - id: removed-identity-floating-debugger
    desc: Removed extension installs floating debugger
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: well-known/tool/development/vscode-extension/tuya-open::removed-ide-identity
      - id: objectives/execution/autoinstall/package::generated-floating-debugger-dependencies
