defaults:
  for: [javascript, typescript, vsix, zip]
  platforms: [unix, windows]
  conf: 0.95
composite_rules:
  - id: manifest-loader-with-cors-loopback-proxy
    desc: Manifest script loader with CORS URL proxy
    crit: hostile
    scope: archive
    all:
      - id: micro-behaviors/communications/http/client/script::manifest-script-loader-cooccurrence
      - id: micro-behaviors/communications/http/server/middleware::cors-loopback-query-url-proxy
