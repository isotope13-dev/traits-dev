defaults:
  for: [javascript, vsix, package.json]
  platforms: [unix, windows]
composite_rules:
  - id: nx-latest-with-git-hook-bypass
    desc: Latest Nx task with Git hook bypass
    crit: suspicious
    scope: archive
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: micro-behaviors/os/package-manager/run::vscode-nx-latest-task-option
      - id: micro-behaviors/revision-control/git/write::node-git-commit-bypasses-hooks
