defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007

composite_rules:
  - id: vscode-helper-floating-npx-execution
    desc: Extension helper executes floating npx fallback
    crit: suspicious
    conf: 0.97
    all:
      - id: well-known/lib/development/vscode::require-vscode
      - id: micro-behaviors/os/package-manager/run::node-exec-floating-npx-fallback-helper
