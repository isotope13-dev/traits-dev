defaults:
  for: [javascript, typescript]
  platforms: [macos, linux]
  conf: 0.95
composite_rules:
  - id: floating-brew-and-agent-permission-bypass
    desc: Floating brew with agent permission bypass
    crit: hostile
    scope: file
    all:
      - id: micro-behaviors/data/llm/permission::terminal-send-near-claude-bypass-argument
    any:
      - id: micro-behaviors/os/package-manager/run::vscode-terminal-floating-brew
      - id: micro-behaviors/os/package-manager/run::vscode-terminal-floating-brew-sequence
