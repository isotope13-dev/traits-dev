defaults:
  platforms: [unix, windows]
  for: [javascript, vsix, package.json]
composite_rules:
  - id: playwright-default-unsandboxed-launch
    for: [javascript]
    desc: Playwright launches Chromium without default sandbox
    crit: suspicious
    scope: file
    all:
      - id: micro-behaviors/os/security/sandbox::playwright-default-unsandboxed-if-statement
      - id: micro-behaviors/os/security/sandbox::playwright-chromium-launch-headless-default
  - id: vscode-floating-npx-with-unsandboxed-playwright
    desc: Extension runs floating npx and unsandboxed browser
    crit: hostile
    scope: archive
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: playwright-default-unsandboxed-launch
    any:
      - id: micro-behaviors/os/package-manager/run::vscode-terminal-floating-npx
      - id: micro-behaviors/os/package-manager/run::vscode-terminal-floating-npx-sequence
  - id: vscode-floating-npx-with-explicit-unsandboxed-browser
    desc: Floating npx and unsandboxed browser launch
    crit: hostile
    scope: archive
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: micro-behaviors/os/security/sandbox::playwright-chromium-explicit-no-sandbox
    any:
      - id: micro-behaviors/os/package-manager/run::vscode-terminal-floating-npx
      - id: micro-behaviors/os/package-manager/run::vscode-terminal-floating-npx-sequence
