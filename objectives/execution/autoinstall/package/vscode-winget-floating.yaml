defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1059.007

composite_rules:
  - id: vscode-terminal-floating-winget
    desc: Extension runs floating winget package
    crit: suspicious
    conf: 0.96
    all:
      - id: well-known/lib/development/vscode::require-vscode
      - id: micro-behaviors/os/package-manager/run::vscode-terminal-winget-floating

  - id: encoded-floating-winget-dispatch
    desc: Obfuscated extension dispatches floating installer
    crit: hostile
    conf: 0.96
    all:
      - id: well-known/lib/development/vscode::require-vscode
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-mangled-parseint-loop-assignment
      - id: micro-behaviors/os/package-manager/run::encoded-ollama-winget-install
      - id: micro-behaviors/os/package-manager/run::encoded-ollama-terminal-indices
      - id: micro-behaviors/os/package-manager/run::encoded-ollama-rotation-checksum
