# An install-time helper that bootstraps the bun runtime, then runs a
# script next to itself with output discarded and all errors exiting 0, is
# smuggling a second-stage payload past npm's Node-only tooling.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  attack: T1195.002,T1059.007
composite_rules:
  - id: silent-bun-bootstrap-sidecar-exec
    desc: Bootstraps bun and silently runs co-shipped script
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/package-manager/runtime-install::bun-setup-zero-exits
      - id: micro-behaviors/process/stdio/configure::child-stdio-ignore-option
      - id: micro-behaviors/fs/path/self::script-dirname-ref
