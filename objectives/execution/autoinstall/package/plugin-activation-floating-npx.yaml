# A plugin's activation hook that installs or launches a latest-tag npm package
# runs whatever the registry serves at that moment, on every load, with no
# pinned version to review. The hook and the launcher often live in different
# members of the same package (entry file and installer module), so the
# hostile composite joins members. The same floating launch inside an ordinary
# script without an activation hook stays suspicious. An unpinned npx call
# alone is common in scaffolding and is not evidence here.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1105

traits:
  - id: exported-plugin-apply-hook
    desc: Exports a plugin apply activation hook
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'export\s+(async\s+)?function\s+apply\s*\('

composite_rules:
  - id: plugin-activation-runs-floating-npx
    desc: Plugin activation launches a latest-tag npx package with --yes
    crit: hostile
    conf: 0.96
    scope: archive
    for: [javascript, typescript, npm, tar]
    all:
      - id: exported-plugin-apply-hook
      - id: micro-behaviors/os/package-manager/upgrade::js-floating-package-spec-literal
      - id: micro-behaviors/os/package-manager/upgrade::js-npx-yes-runner-args
      - id: micro-behaviors/process/create/subprocess/launch::spawn-call

  - id: floating-global-package-install-launch
    desc: Launcher globally installs a latest-tag npm package
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/os/package-manager/upgrade::js-floating-package-spec-literal
      - id: micro-behaviors/os/package-manager/upgrade::js-global-install-args-array
      - id: micro-behaviors/process/create/subprocess/launch::spawn-call
