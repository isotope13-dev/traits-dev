defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007

composite_rules:
  # Command palette helpers that open a named, visible terminal and run
  # `npx tool@latest` are the user launching a tool. Consumers such as the
  # removed-package and Cursor credential composites supply the intent.
  - id: vscode-terminal-floating-npm
    desc: Extension runs floating npm in terminal
    crit: notable
    conf: 0.97
    all:
      - id: well-known/lib/development/vscode::require-vscode
    any:
      - id: micro-behaviors/os/package-manager/run::vscode-terminal-floating-npm-submit
      - id: micro-behaviors/os/package-manager/run::vscode-terminal-floating-npm-statement
