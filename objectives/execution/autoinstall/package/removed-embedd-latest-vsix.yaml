defaults:
  platforms: [unix, windows]
  for: [vsix, javascript]
  attack: T1195.002

composite_rules:
  - id: removed-identity-latest-vsix-install
    desc: Removed extension installs latest release VSIX
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: well-known/tool/development/vscode-extension/embedd::removed-project-manager-identity
      - id: objectives/execution/autoinstall/package::vscode-latest-release-vsix-install
