defaults:
  platforms: [unix, windows]
  for: [vsix, package.json, macho, elf, pe]

composite_rules:
  - id: vscode-go-floating-release-update
    desc: Extension bundles latest-release updater
    crit: suspicious
    conf: 0.94
    scope: archive
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: micro-behaviors/os/package-manager/run::go-github-latest-release-updater
