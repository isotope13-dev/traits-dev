defaults:
  platforms:
  - unix
  - windows
  conf: 0.9
  attack: T1059.007
traits:
- id: javascript-npm-approve-all-install-scripts
  desc: JavaScript approves all npm install scripts
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  - typescript
  if:
    type: tree-sitter
    kind: call
    regex: (?s)spawnSync\s*\(\s*['"]npm['"].{0,80}\binstall-scripts\b.{0,80}\bapprove\b.{0,80}--all
- id: src-npx-package-flag
  desc: Source npx declares transient package
  crit: suspicious
  for:
  - shell
  - makefile
  if:
    type: text
    regex: (?m)(^|[;&|'"])[ \t]*npx\s+(--package|-p)\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}
  not:
  - regex: '@decocms/'
  unless:
  - id: metadata/path::test-directory-component
  - id: metadata/file/profile/test-indications/
  - id: metadata/package/testing/presence/path::test-fixture-directory-path
  - id: well-known/app/development/cloudflare::framework-autoconfig
  - id: metadata/build
  - id: well-known/app/ai/agent-runtime/moda/
  - id: metadata/package/tooling::opencomputer-source-tree
  - id: metadata/file/extension/identity::markdown-file-basename
  - type: text
    regex: (?m)^[ \t]+npx\s+(?:--package|-p)\s+\S+\s+\S+[ \t]{3,}[A-Za-z]
- id: src-npm-exec-yes-package
  desc: Source npm exec auto-installs unpinned package
  crit: suspicious
  for:
  - shell
  - javascript
  - typescript
  - makefile
  unless:
  - id: metadata/build
  if:
    type: text
    regex: (?m)(^|[;&|'"`])[ \t]*npm\s+exec\s+(-y|--yes)\s+[A-Za-z0-9@][^@\s]{1,79}($|[ \t])
- id: src-npm-exec-package-call
  desc: JavaScript runs npm exec package
  crit: suspicious
  for:
  - javascript
  - typescript
  unless:
  - id: well-known/lib/runtime/scripted/node-runtime::bundled-npm-source
  if:
    type: symbol
    kind: call
    regex: (^|\.)(exec|execSync|spawn|spawnSync|execFile|execFileSync)$
    arg:
      kind: string
      regex: \bnpm\s+exec\s+(--package|-p)\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}
- id: src-npm-x-package-flag
  desc: Source npm x declares package
  crit: suspicious
  for:
  - shell
  - javascript
  - typescript
  - makefile
  if:
    type: text
    regex: (?m)(^|[;&|'"`])[ \t]*npm\s+x\s+(--package|-p)\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}
- id: src-pnpx-package
  desc: Shell invokes pnpx transient package
  crit: suspicious
  for:
  - shell
  if:
    type: symbol
    kind: call
    exact: pnpx
  unless:
  - id: metadata/package/testing/presence/scripted/
  - id: metadata/build
- id: js-exec-pnpx-package
  desc: JavaScript exec call invokes pnpx package
  crit: suspicious
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    regex: (^|\.)(exec|execSync)$
    arg:
      kind: string
      substr: 'pnpx '
  unless:
  - id: metadata/package/testing/presence/scripted/
  - id: metadata/build
  - id: micro-behaviors/process/create/shell/build::prettier-write-command
- id: makefile-pnpx-recipe
  desc: Make recipe invokes pnpx transient package
  crit: suspicious
  for:
  - makefile
  if:
    type: text
    regex: (?m)^[ \t]*pnpx[ \t]+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}
  unless:
  - id: metadata/build/make::makefile-pnpx-prettier-local-file
- id: js-bunx-exec-string
  desc: JavaScript exec call invokes bunx package
  crit: suspicious
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    regex: (^|\.)(exec|execSync)$
    arg:
      kind: string
      substr: 'bunx '
  unless:
  - id: metadata/package/testing/presence/scripted/
  - id: metadata/build
  - id: micro-behaviors/process/create/shell/build::prettier-write-command
- id: script-npm-install-preinstall
  desc: preinstall hook installs a package
  crit: suspicious
  for:
  - package.json
  unless:
  - id: metadata/package/scripts/lifecycle::preinstall-addon-builder-bootstrap
  if:
    type: value
    path: scripts.preinstall
    regex: \bnpm\s+install\s+(@?[A-Za-z0-9][A-Za-z0-9._-]*/)?[A-Za-z0-9][A-Za-z0-9._-]{1,79}
- id: script-npm-install-install
  desc: install hook installs a package
  crit: suspicious
  for:
  - package.json
  if:
    type: value
    path: scripts.install
    regex: \bnpm\s+install\s+(@?[A-Za-z0-9][A-Za-z0-9._-]*/)?[A-Za-z0-9][A-Za-z0-9._-]{1,79}
- id: script-npm-install-postinstall
  desc: postinstall hook installs a package
  crit: suspicious
  for:
  - package.json
  if:
    type: value
    path: scripts.postinstall
    regex: \bnpm\s+install\s+(@?[A-Za-z0-9][A-Za-z0-9._-]*/)?[A-Za-z0-9][A-Za-z0-9._-]{1,79}
  unless:
  - id: metadata/package/scripts/lifecycle::postinstall-host-runtime-bootstrap
- id: script-npm-install-prepare
  desc: prepare hook installs a package
  crit: suspicious
  for:
  - package.json
  if:
    type: value
    path: scripts.prepare
    regex: \bnpm\s+install\s+(@?[A-Za-z0-9][A-Za-z0-9._-]*/)?[A-Za-z0-9][A-Za-z0-9._-]{1,79}
- id: script-npx-yes-package
  desc: preinstall hook npx auto-installs package
  crit: notable
  for:
  - package.json
  unless:
  - id: micro-behaviors/os/package-manager/publish/
  - id: micro-behaviors/os/package-manager/installer-script/
  - id: well-known/lib/platform/browser-automation/frameworks::playwright-browser-install-script
  if:
    type: value
    path: scripts.preinstall
    regex: \bnpx\s+(-y|--yes)\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}
- id: script-npx-yes-install
  desc: install hook npx auto-installs package
  crit: notable
  for:
  - package.json
  unless:
  - id: micro-behaviors/os/package-manager/publish/
  - id: micro-behaviors/os/package-manager/installer-script/
  - id: well-known/lib/platform/browser-automation/frameworks::playwright-browser-install-script
  if:
    type: value
    path: scripts.install
    regex: \bnpx\s+(-y|--yes)\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}
- id: script-npx-yes-postinstall
  desc: postinstall hook npx auto-installs package
  crit: notable
  for:
  - package.json
  unless:
  - id: micro-behaviors/os/package-manager/publish/
  - id: micro-behaviors/os/package-manager/installer-script/
  - id: well-known/lib/platform/browser-automation/frameworks::playwright-browser-install-script
  if:
    type: value
    path: scripts.postinstall
    regex: \bnpx\s+(-y|--yes)\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}
- id: script-npx-yes-prepare
  desc: prepare hook npx auto-installs package
  crit: notable
  for:
  - package.json
  unless:
  - id: micro-behaviors/os/package-manager/publish/
  - id: micro-behaviors/os/package-manager/installer-script/
  - id: well-known/lib/platform/browser-automation/frameworks::playwright-browser-install-script
  if:
    type: value
    path: scripts.prepare
    regex: \bnpx\s+(-y|--yes)\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}
- id: script-npx-versioned-package
  desc: Package script npx versioned package
  crit: notable
  for:
  - package.json
  unless:
  - id: well-known/lib/data/elastic-elasticsearch-js::elasticsearch-js-package-context
  if:
    type: value
    path: scripts[*]
    regex: \bnpx\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}@[0-9]
- id: script-pnpm-dlx-preinstall
  desc: preinstall hook pnpm dlx package
  crit: suspicious
  for:
  - package.json
  if:
    type: value
    path: scripts.preinstall
    regex: \bpnpm\s+dlx\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}
- id: script-pnpm-dlx-install
  desc: install hook pnpm dlx package
  crit: suspicious
  for:
  - package.json
  if:
    type: value
    path: scripts.install
    regex: \bpnpm\s+dlx\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}
- id: script-pnpm-dlx-postinstall
  desc: postinstall hook pnpm dlx package
  crit: suspicious
  for:
  - package.json
  if:
    type: value
    path: scripts.postinstall
    regex: \bpnpm\s+dlx\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}
- id: script-pnpm-dlx-prepare
  desc: prepare hook pnpm dlx package
  crit: suspicious
  for:
  - package.json
  if:
    type: value
    path: scripts.prepare
    regex: \bpnpm\s+dlx\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}
- id: script-yarn-dlx-preinstall
  desc: preinstall hook yarn dlx package
  crit: suspicious
  for:
  - package.json
  if:
    type: value
    path: scripts.preinstall
    regex: \byarn\s+dlx\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}
- id: script-yarn-dlx-install
  desc: install hook yarn dlx package
  crit: suspicious
  for:
  - package.json
  if:
    type: value
    path: scripts.install
    regex: \byarn\s+dlx\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}
- id: script-yarn-dlx-postinstall
  desc: postinstall hook yarn dlx package
  crit: suspicious
  for:
  - package.json
  if:
    type: value
    path: scripts.postinstall
    regex: \byarn\s+dlx\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}
- id: script-yarn-dlx-prepare
  desc: prepare hook yarn dlx package
  crit: suspicious
  for:
  - package.json
  if:
    type: value
    path: scripts.prepare
    regex: \byarn\s+dlx\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}
- id: build-npx-yes-package
  desc: Build npx auto-installs package
  crit: notable
  for:
  - dockerfile
  - github-actions
  if:
    type: text
    regex: \bnpx\s+(-y|--yes)\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}
- id: build-npx-versioned-package
  desc: Build npx runs versioned package
  crit: notable
  for:
  - dockerfile
  - github-actions
  if:
    type: text
    regex: \bnpx\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}@[0-9]
- id: build-npm-exec-yes-package
  desc: Build npm exec auto-installs package
  crit: notable
  for:
  - dockerfile
  - github-actions
  if:
    type: text
    regex: \bnpm\s+exec\s+(-y|--yes)\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}
- id: build-pnpx-package
  desc: Build pnpx transient package
  crit: notable
  for:
  - dockerfile
  - github-actions
  if:
    type: text
    regex: \bpnpx\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}
- id: build-yarn-dlx-package
  desc: Build yarn dlx transient package
  crit: notable
  for:
  - dockerfile
  - github-actions
  if:
    type: text
    regex: \byarn\s+dlx\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}
composite_rules:
- id: script-npm-install-package
  desc: Install hook auto-installs a package
  crit: suspicious
  for:
  - package.json
  any:
  - id: script-npm-install-preinstall
  - id: script-npm-install-install
  - id: script-npm-install-postinstall
  - id: script-npm-install-prepare
