defaults:
  for: [elf, javascript, typescript, vsix, zip, tar]
  platforms: [unix, windows]
  conf: 0.95
composite_rules:
  - id: checkmarx-old-cli-and-asca-update
    desc: Old CLI with latest ASCA update request
    crit: suspicious
    scope: archive
    all:
      - id: metadata/lang/go-build::checkmarx-cli-before-2-3-60
      - id: micro-behaviors/os/package-manager/run::checkmarx-asca-latest-request
  - id: checkmarx-old-cli-and-sca-scan
    desc: Old CLI with SCA realtime scan call
    crit: suspicious
    scope: archive
    all:
      - id: metadata/lang/go-build::checkmarx-cli-before-2-3-60
      - id: micro-behaviors/os/package-manager/run::checkmarx-sca-realtime-call
  - id: checkmarx-old-cli-with-floating-engines
    desc: Old CLI with ASCA and SCA engine paths
    crit: hostile
    scope: archive
    all:
      - id: checkmarx-old-cli-and-asca-update
      - id: checkmarx-old-cli-and-sca-scan
