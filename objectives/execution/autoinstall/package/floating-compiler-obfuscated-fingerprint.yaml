defaults:
  for: [javascript, typescript, vsix]
  platforms: [unix, windows]
  conf: 0.95
composite_rules:
  - id: floating-compiler-with-obfuscated-editor-fingerprint
    desc: Floating compiler with obfuscated editor fingerprint
    crit: hostile
    scope: archive
    all:
      - id: micro-behaviors/os/package-manager/run::npx-spawn-near-tsc-literal
      - id: objectives/discovery/system/fingerprint/editor::obfuscated-editor-session-fingerprint
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::rc4-checksum-rotated-table-runtime
