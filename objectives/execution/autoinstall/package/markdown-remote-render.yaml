defaults:
  platforms: [windows, unix]
  for: [javascript, vsix, package.json]
composite_rules:
  # A floating CDN Mermaid tag in exported HTML is a pinning gap, not intent.
  - id: floating-mermaid-export
    desc: Markdown export loads floating Mermaid script
    crit: notable
    scope: archive
    all:
      - id: micro-behaviors/os/package-manager/run::markdown-mermaid-latest-export
      - id: metadata/package/runtime::vscode-extension
  - id: floating-mermaid-and-remote-diagrams
    desc: Floating script and remote diagram source
    crit: hostile
    scope: archive
    all:
      - id: floating-mermaid-export
      - id: objectives/collection/app-data/code-context::markdown-plantuml-public-render
