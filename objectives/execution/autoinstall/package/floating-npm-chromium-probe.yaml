defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  conf: 0.95
composite_rules:
  - id: floating-npm-with-latest-unsandboxed-chromium
    desc: Floating npm with latest unsandboxed browser
    crit: hostile
    scope: file
    all:
      - id: micro-behaviors/os/package-manager/run::floating-global-npm-near-terminal-adapter
    any:
      - id: micro-behaviors/os/package-manager/run::latest-chromium-with-unsandboxed-probe
      - id: micro-behaviors/os/package-manager/run::latest-chromium-with-unsandboxed-probe-text
