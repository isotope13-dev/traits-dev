defaults:
  platforms: [unix, windows]
  for: [vsix, javascript]
  attack: T1059.007

composite_rules:
  - id: removed-identity-floating-install
    desc: Removed extension submits unversioned npm install
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: well-known/tool/development/vscode-extension/sfra::removed-sfra-toolkit-identity
      - id: objectives/execution/autoinstall/package::vscode-terminal-floating-npm
