defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007

composite_rules:
  - id: generated-floating-debugger-dependencies
    desc: Installs generated floating debugger dependencies
    # npm-installing a manifest the tool itself wrote is a pinning gap.
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/package-manager/run::serialized-manifest-floating-dependency
      - id: micro-behaviors/os/package-manager/run::write-lan-debugger-manifest
      - id: micro-behaviors/os/package-manager/run::node-wrapper-npm-install
