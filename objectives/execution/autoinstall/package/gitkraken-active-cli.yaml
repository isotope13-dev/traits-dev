defaults:
  platforms: [windows, unix]
  for: [javascript, vsix, package.json]
composite_rules:
  - id: active-gitkraken-cli
    desc: Runs floating GitKraken CLI release
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/package-manager/run::active-gitkraken-cli-installer
      - id: metadata/package/runtime::vscode-extension
    scope: archive
  - id: foreign-gitlens-active-cli
    desc: Foreign GitLens runs floating CLI release
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: active-gitkraken-cli
      - id: objectives/supply-chain/impersonation/extensions::gitlens-republished-under-foreign-publisher
