# Require an invoked auth-gated helper and a variable-valued exec call. The
# package literal and command variable are not proven to be the same value.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007

traits:
  - id: calls-auth-gated-installer-helper
    desc: Calls the gated installer helper
    crit: component
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '^(onAtLeastOneProviderAuthenticated|dispatchInstaller)$'

composite_rules:
  - id: vscode-floating-npx-process-clues
    desc: VS Code code combines a floating npx command with gated variable execution
    crit: suspicious
    conf: 0.86
    all:
      - id: well-known/lib/development/vscode::require-vscode
      - id: micro-behaviors/os/package-manager/run::npx-floating-command-literal
      - id: metadata/import/builtin::require-child-process
      - id: micro-behaviors/process/create/shell/variable-command::child-process-exec-variable-command
      - id: calls-auth-gated-installer-helper
    any:
      - id: micro-behaviors/process/create/shell/command-string::compiled-member-exec-call
      - id: micro-behaviors/process/create/shell/command-string::child-process-exec-call-site
      - id: micro-behaviors/process/create/shell/command-string::child-process-inline-exec-call
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
