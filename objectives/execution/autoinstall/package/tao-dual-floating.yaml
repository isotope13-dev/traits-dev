defaults:
  platforms: [windows, unix]
  for: [javascript, vsix, package.json]
composite_rules:
  - id: floating-cline-terminal-install
    desc: Extension installs floating Cline CLI
    crit: suspicious
    scope: archive
    all:
      - id: micro-behaviors/os/package-manager/run::cline-global-install-terminal
      - id: metadata/package/runtime::vscode-extension
  - id: floating-browser-fallback
    desc: Extension runs floating Chromium fallback
    crit: suspicious
    scope: archive
    all:
      - id: micro-behaviors/os/package-manager/run::latest-chromium-download-and-launch-fallback
      - id: metadata/package/runtime::vscode-extension
  - id: floating-cline-and-chromium
    desc: Floating CLI installer and browser fallback
    crit: hostile
    scope: archive
    all:
      - id: floating-cline-terminal-install
      - id: floating-browser-fallback
