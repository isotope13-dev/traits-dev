defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  conf: 0.95
composite_rules:
  - id: latest-go-and-github-language-servers
    desc: Latest Go and GitHub installer paths
    crit: hostile
    scope: file
    all:
      - id: micro-behaviors/os/package-manager/run::go-installer-latest-with-default-call
      - id: micro-behaviors/communications/http/services/github/release::github-latest-release-asset-download
