defaults:
  platforms: [windows, unix]
  for: [javascript, vsix, package.json]
composite_rules:
  - id: floating-agent-skills-terminal
    desc: Extension runs floating agent skills installer
    crit: suspicious
    scope: archive
    all:
      - id: micro-behaviors/os/package-manager/run::vscode-terminal-floating-agent-skills
      - id: metadata/package/runtime::vscode-extension
  - id: floating-rcs-webview-script
    desc: Extension loads latest remote webview script
    crit: notable
    scope: archive
    all:
      - id: micro-behaviors/ui/window/webview::latest-rcs-script-template
      - id: metadata/package/runtime::vscode-extension
