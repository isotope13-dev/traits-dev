# Two shapes of the same claim. The manifest trait matches a postinstall value
# that is itself a floating npx command. The composite covers a postinstall
# that runs the package's index.js, where the floating npx call lives in an
# archive member. The composite requires the index entry leg, so an unrelated
# npx call elsewhere in the archive is not enough without that link.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1059.007,T1195.002

traits:
  - id: npm-postinstall-command-floating-npx
    desc: npm postinstall command is floating npx
    crit: hostile
    conf: 0.97
    if:
      type: value
      path: scripts.postinstall
      regex: '^npx\s+(-[\w-]+\s+){0,4}(@[\w.-]+/)?\w[\w.-]*(@(latest|next|[~^][\d.]+))?(\s|$)'

composite_rules:
  - id: npm-postinstall-executes-floating-npx-package
    desc: npm postinstall executes a floating npx package
    crit: hostile
    conf: 0.97
    for: [zip, npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: micro-behaviors/os/package-manager/hook-install::npm-postinstall-runs-index-entry
      - id: micro-behaviors/os/package-manager/run::node-exec-floating-npx-argument
      - id: micro-behaviors/os/package-manager/run::npx-floating-command-literal
