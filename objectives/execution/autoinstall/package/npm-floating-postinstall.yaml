defaults:
  platforms: [unix, windows]
  for: [zip, npm, tar, package.json, javascript]
  attack: T1059.007,T1195.002

composite_rules:
  - id: npm-postinstall-executes-floating-npx-package
    desc: npm postinstall executes a floating npx package
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/os/package-manager/run::node-exec-floating-npx-argument
      - id: micro-behaviors/os/package-manager/run::npx-floating-command-literal
