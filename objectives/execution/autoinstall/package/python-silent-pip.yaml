# A Python program that installs packages into its own interpreter at run
# time, with the pip output discarded, installs code the user never reviewed.
# Auto-installing a declared optional dependency is common; the discard of
# pip's output while the install goes into the system interpreter (the
# --break-system-packages retry pattern) is what makes it silent.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1195.002
composite_rules:
  - id: python-silent-runtime-pip-install
    desc: Python silently pip-installs packages at runtime
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/os/package-manager/dependency-setup::python-runtime-pip-install
      - id: micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-stdio-assignment
    # The silent stdio must sit in the same install statement. Measured on
    # bhp_pro 1.7.3 the nearest pair is ~170 bytes apart; a consent-gated
    # control keeps its pip run and a later DEVNULL Popen ~380 bytes apart.
    near_bytes: 250
    # The DEVNULL leg's 700-char window can start at the pip call and reach a
    # later tunnel Popen's stdio, reading a consented cloudflared notebook
    # bootstrap as a silent install. Those bootstraps pin the forward target
    # to loopback behind an explicit prompt or install subcommand; malware
    # discarding pip's output does not.
    unless:
      - id: metadata/build/recognized-contexts::consent-gated-vendor-tunnel-bootstrap
      - id: metadata/build/recognized-contexts::command-gated-vendor-tunnel-bootstrap
