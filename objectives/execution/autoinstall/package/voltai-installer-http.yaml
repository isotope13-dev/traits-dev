defaults:
  platforms: [windows, unix]
  for: [javascript, vsix, package.json]
  crit: hostile
  conf: 0.98
composite_rules:
  - id: mutable-installer-with-plaintext-bearer
    desc: Mutable installer with plaintext bearer fallback
    scope: archive
    all:
      - id: micro-behaviors/os/package-manager/run::downloaded-mutable-installer-bash
      - id: micro-behaviors/communications/http/credential::voltai-bearer-over-http-fallback
      - id: metadata/package/runtime::vscode-extension
