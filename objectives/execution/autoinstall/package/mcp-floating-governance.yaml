defaults:
  platforms: [windows, unix]
  for: [javascript, vsix, package.json]
  crit: hostile
  conf: 0.98
composite_rules:
  - id: floating-checks-with-independent-risk
    desc: Floating MCP checks with independent risk
    scope: archive
    all:
      - id: micro-behaviors/os/package-manager/run::mcp-error-detector-floating-npx
      - id: metadata/package/runtime::vscode-extension
    any:
      - id: objectives/collection/monitor/telemetry::stack-report-without-optout-reference
      - id: objectives/collection/app-data/code-context::code-context-report-post
      - id: objectives/evasion/security-bypass/llm/override::prepended-mcp-startup-directive
