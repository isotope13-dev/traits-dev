defaults:
  platforms: [windows, unix]
  for: [javascript, vsix]
  crit: hostile
  conf: 0.99
composite_rules:
  - id: encoded-floating-npm-with-obfuscation
    desc: Obfuscated extension executes floating npm install
    all:
      - id: micro-behaviors/os/package-manager/run::encoded-kuai-floating-npm-dispatch-either
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::rc4-array-computed-require
