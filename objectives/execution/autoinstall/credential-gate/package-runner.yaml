defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: credential-probes-gate-remote-package-runner
  desc: Credential probes gate remote package execution
  crit: hostile
  conf: 0.98
  attack: T1555,T1059.007
