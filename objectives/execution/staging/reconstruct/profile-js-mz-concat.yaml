defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript, typescript]
composite_rules:
  - id: js-mz-long-concat-clues
    desc: JScript MZ check and long concat clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/format/executable/header::js-pe-mz-check
      - id: micro-behaviors/data/string/concat/expression::massive-concatenation-chain
