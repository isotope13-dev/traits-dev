---
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: nsis-inetc-system-memory-api-profile
  desc: NSIS INetC, System plugin and memory API references
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/file/profile/network-context/process::nsis-inetc-temp-process-profile
  - id: metadata/file/profile/installer/lifecycle::system-dll-plugin-export-profile
  - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
  any:
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
  - id: micro-behaviors/dylib/lookup::sparse-pe-dynamic-linking
  unless:
  - id: metadata/signed/platform/
