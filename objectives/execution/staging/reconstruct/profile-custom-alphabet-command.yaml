# Custom alphabet, symmetric cryptography and command-creation evidence.
# The rules do not establish what is decoded, decrypted or executed.
defaults:
  crit: notable
  platforms: [windows, linux, macos]

composite_rules:
  - id: go-custom-alphabet-crypto-command
    desc: Custom Base64 alphabet, cryptography and command creation
    conf: 0.92
    for: [go]
    all:
      - id: "micro-behaviors/data/encoding/base64::go-base64-codec-factory-symbol"
      - id: "micro-behaviors/data/encoding/base64::custom-base64-alphabet-source-form"
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-call
    any:
      - id: metadata/lang/source/naming/interface/runtime::go-cipher-new-gcm
      - id: micro-behaviors/crypto/key/representation/material::symmetric-key-from-private-key-field
      - id: micro-behaviors/crypto/symmetric/aes/initialize::aes-new-cipher
      - id: micro-behaviors/crypto/provider/library::aes-cbc-encrypter
    needs: 1

  - id: python-custom-alphabet-crypto-command
    desc: Custom Base64 alphabet, cryptography and command creation
    conf: 0.92
    for: [python]
    all:
      - id: micro-behaviors/data/decode/table::python-alphabet-substitution-decode
      - id: "micro-behaviors/data/encoding/base64::custom-base64-alphabet-source-form"
      - id: micro-behaviors/process/create/subprocess/launch::process-execution
    any:
      - id: micro-behaviors/crypto/symmetric/aes/reference::aesgcm-name-reference
      - id: micro-behaviors/crypto/symmetric/config::python-gcm-mode-symbol
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::python-decrypt-method-call
    needs: 1

  - id: go-dynamic-alphabet-crypto-command
    desc: Dynamic Base64 alphabet, cryptography and command creation
    conf: 0.94
    for: [go]
    all:
      - id: micro-behaviors/data/decode/table::go-dynamic-base64-alphabet
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-call
    any:
      - id: metadata/lang/source/naming/interface/runtime::go-cipher-new-gcm
      - id: micro-behaviors/crypto/key/representation/material::symmetric-key-from-private-key-field
      - id: micro-behaviors/crypto/symmetric/aes/initialize::aes-new-cipher
      - id: micro-behaviors/crypto/provider/library::aes-cbc-encrypter
    needs: 1
