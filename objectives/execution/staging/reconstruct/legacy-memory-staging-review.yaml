composite_rules:
- id: sevenzip-brand-overlay-rwx-copy
  desc: 7-Zip branded PE reads overlay with RWX memory copy
  crit: hostile
  conf: 0.99
  size_max: 1048576
  attack: T1036.005,T1027.009,T1140,T1620
  all:
  - id: metadata/file/string/application-name::pe-product-name-7zip
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-large-overlay
  - id: objectives/evasion/process/injection/shellcode::rwx-memcpy-injection
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: objectives/impact/infect/binary/rewrite::parasitic-text-loader-overlay-host
  for:
  - pe
  platforms:
  - windows
