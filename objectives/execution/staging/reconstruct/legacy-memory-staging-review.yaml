composite_rules:
- id: sevenzip-brand-overlay-rwx-copy
  desc: 7-Zip branded PE reads overlay with RWX memory copy
  crit: hostile
  conf: 0.99
  size_max: 1048576
  attack: T1036.005,T1027.009,T1140,T1620
  all:
  - id: well-known/tool/sysadmin/7zip/utility::pe-product-name-7zip
  - id: metadata/signature/absent::unsigned-missing-signature-record
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-large-overlay
  - id: micro-behaviors/mem/copy::allocation-pattern-memcpy-clues
  unless:
  - id: metadata/signature/verified/platform/
  - id: metadata/installer/product/
  - id: objectives/impact/infect/binary/rewrite::parasitic-text-loader-overlay-host
  for:
  - pe
  platforms:
  - windows
