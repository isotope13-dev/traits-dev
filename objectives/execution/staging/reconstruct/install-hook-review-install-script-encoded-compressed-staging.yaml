defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-encoded-compressed-staging
    desc: Install script decodes, decompresses, and writes data with detach clues
    crit: suspicious
    conf: 0.98
    attack: T1195.002,T1027,T1105
    scope: leaf
    for:
      - javascript
      - typescript
    near_bytes: 8192
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64
      - id: micro-behaviors/data/decompress/zlib::node-inflate-function
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call
      - id: micro-behaviors/process/daemonize/detach::detached-true
