defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  size_max: 10485760

composite_rules:
  - id: uuid-loop-allocation-protection-clues
    desc: UUID decoding allocation and protection clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/format/string::uuid-from-string-api
      - id: micro-behaviors/mem/alloc/virtual::virtualalloc-readwrite-commit-resolved-x64
      - id: metadata/binary/instruction/operand::x64-load-r8-r9-20
      - id: micro-behaviors/data/format/string::uuid-decode-16byte-advance-loop-x64
    any:
      - id: micro-behaviors/mem/protect/modify/executable::virtualprotect-executable-read-register-x64
      - id: micro-behaviors/data/format/string::dense-uuid-hyphen-string-table
    unless:
      - id: metadata/signature/verified/platform::microsoft
      - id: metadata/signature/verified/signer::microsoft-corporation
      - id: metadata/lang/compiler/managed::dotnet-metadata
