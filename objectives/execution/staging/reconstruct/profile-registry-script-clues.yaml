defaults:
  platforms:
  - windows
  for:
  - pe
  - batch
composite_rules:
- id: hklm-guid-powershell-encoding-clues
  desc: HKLM GUID, PowerShell and encoding clues
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/os/registry/key/reference::hklm-software-guid-key-text
  - id: objectives/execution/staging/reconstruct::powershell-options-registry-encoding-clues
  any:
  - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
  - id: metadata/lang/source/syntax/argument::encodedcommand-option-reference
- id: powershell-options-registry-encoding-clues
  desc: PowerShell, registry and encoding clues
  crit: suspicious
  conf: 0.9
  near_bytes: 4096
  all:
  - id: micro-behaviors/process/argument/interpreter::powershell-command-options-text
  - id: objectives/execution/staging/reconstruct::registry-set-or-binary-type-clue
  - id: objectives/execution/staging/reconstruct::powershell-property-or-encoding-clue
  downgrade:
    any:
    - id: well-known/tool/sysadmin/disk-utility::winhex-xways
    - id: well-known/app/system/aks-engine/
