defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: nuitka-resource-extraction-clues
    desc: Nuitka resource and extraction API clues
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/anti-static/pack/self-extractor::nuitka-onefile-resource-process-profile
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: metadata/binary/resource/size::oversized-low-entropy-rsrc
    unless:
      - id: metadata/installer/product/

  - id: nuitka-serialized-payload-injection-loader
    desc: Serialized decrypt, payload write and injection clues
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/crypto/decrypt/transform/status::background-payload-decryption-diagnostic
      - id: micro-behaviors/fs/write/file/target::payload-written-diagnostic
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
      - id: metadata/binary/code/bytecode::python-serialized-aes-counter-decrypt
      - id: micro-behaviors/data/decode/base85::python-serialized-b85decode
      - id: metadata/binary/code/bytecode::python-serialized-hidden-popen
      - id: objectives/anti-analysis/environment-detect/runtime::analysis-detected-legit-work-only
