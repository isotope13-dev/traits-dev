defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: binary-fragment-concatenation
    desc: Obfuscated binary fragment concatenation
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)cmd%[a-z][a-z0-9_]*%/c%[a-z][a-z0-9_]*%copy%[a-z][a-z0-9_]*%/b%[a-z][a-z0-9_]*%'

  - id: reconstructed-executable-header
    desc: Obfuscated partial executable header write
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)set%[a-z][a-z0-9_]*%/p%[a-z][a-z0-9_]*%="M%[a-z][a-z0-9_]*%"'

composite_rules:
  - id: av-aware-obfuscated-fragment-loader
    desc: Obfuscated batch reconstructs a binary after checking security software
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.003,T1518.001
    all:
      - id: objectives/anti-static/obfuscation/string/concat::batch-heavy-obfuscation
      - id: objectives/discovery/host/security::batch-tasklist-av-name-filter
      - id: binary-fragment-concatenation
      - id: reconstructed-executable-header
