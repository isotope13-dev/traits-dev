# A shell script whose only job is to decode an inline blob holding a remote
# URL and pipe it into sh from a detached subshell with all output thrown
# away (fake "Downloads.app" bundles, trojanized repo helpers). The URL and
# the fetch command never appear in clear text, and the detached subshell
# lets the visible part of the script (often `open ~/`) finish instantly.
defaults:
  platforms: [unix, macos]
  for: [shell]
  crit: hostile
  attack: T1059.004,T1140,T1105

composite_rules:
  - id: detached-shell-runs-encoded-remote-fetch
    desc: Detached shell decodes and runs a hidden remote URL
    conf: 0.94
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin/decoded::encoded-blob-piped-to-shell
      - id: micro-behaviors/process/daemonize/background::subshell-detached-output-discarded
    any:
      - id: micro-behaviors/communications/url/scheme::hex-encoded-https
      - id: micro-behaviors/data/decode/multiple-encoding::double-base64-payload
