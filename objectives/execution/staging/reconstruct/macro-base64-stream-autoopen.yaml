defaults:
  platforms: [windows]
  for: [oledoc, ooxml, scripts]
composite_rules:
  - id: vba-hidden-sheet-base64-staging
    desc: Auto-open macro hides a sheet and decodes Base64 data
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/application/hook/event::vba-auto-open-sub-decl
      - id: micro-behaviors/data/codec::msxml-datatype-bin-base64
      - id: micro-behaviors/fs/write/stream::adodb-stream-progid
      - id: micro-behaviors/ui/window/visibility::vba-hide-worksheet
