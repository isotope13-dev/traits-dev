defaults:
  platforms: [unix, windows]
  for: [gyp]
  attack: T1195.002
  mbc: B0024
composite_rules:
  - id: gyp-binary-sidecar-decoding-clues
    desc: gyp expansion with binary member and decoding clues
    crit: suspicious
    conf: 0.98
    for: [npm, tar, javascript, gyp]
    scope: archive
    all:
      - id: metadata/build/ecosystem::gyp-source-command-expansion
      - id: metadata/archive/member/extension::archive-bin-member
    any:
      - id: objectives/anti-static/obfuscation/encoding/numeric::numeric-reconstruction-with-eval-syntax
      - id: objectives/anti-static/obfuscation/encoding/numeric::charcode-packed-numeric-source
      - id: micro-behaviors/crypto/decrypt/transform/symmetric::node-aes-gcm-hex-input-and-tag-slice
      - id: micro-behaviors/crypto/decrypt/initialize::node-aes-gcm-decipher-initialization
      - id: micro-behaviors/data/decode/hex::node-update-with-hex-buffer
