# These co-located operations do not prove that the decoded bytes reach PHP.
# Keep the composite suspicious; PHP deployment scripts can share the pattern.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1027.009

traits:
  - id: python-printf-append-redirect-command
    desc: Embedded printf append redirection command
    crit: component
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: 'printf\s+[^"\r\n]{1,32}>>'

  - id: embedded-base64-decode-redirect-command
    desc: Embedded base64 decode output redirection
    crit: component
    conf: 0.92
    for: [python, javascript, typescript, ruby, go]
    if:
      type: text
      regex: 'base64\s+(-d|--decode)[^;\r\n]{0,24}>'

  - id: embedded-shell-mv-php-target
    desc: Embedded shell moves staged file to PHP
    crit: component
    conf: 0.92
    for: [python, javascript, typescript, ruby, go]
    if:
      type: text
      regex: '\bmv\s+[^\r\n;]{1,50}\.php\b'

composite_rules:
  - id: shell-fragment-decode-php-deployment
    desc: Shell joins fragments and decodes beside PHP deployment
    crit: suspicious
    conf: 0.9
    near_lines: 8
    all:
      - id: micro-behaviors/fs/read/file/content/command::shell-concatenates-fragment-glob
      - id: micro-behaviors/data/decode/command::base64-decode-command
      - id: micro-behaviors/fs/file/move::shell-moves-php-script

  - id: staged-printf-base64-php-webshell-drop
    desc: Stages base64 PHP webshell via printf and base64 decode
    crit: hostile
    conf: 0.97
    for: [python]
    attack: T1027.009,T1505.003
    all:
      - id: micro-behaviors/data/embedded/script::embedded-php-open-tag-literal
      - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
      - id: python-printf-append-redirect-command
      - id: embedded-base64-decode-redirect-command
      - id: embedded-shell-mv-php-target
