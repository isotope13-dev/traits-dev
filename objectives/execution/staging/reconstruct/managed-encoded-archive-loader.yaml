defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: encoded-archive-powershell-loader
    desc: Encoded archive download and PowerShell execution
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.001,T1105
    all:
      - id: micro-behaviors/process/deploy/file-exec/spawn::dotnet-download-temp-process-references
      - id: micro-behaviors/communications/url/encoded::binary-base64-http-url
      - id: micro-behaviors/communications/url/resource-path/file::pe-application-setup-update-zip-url-text
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-argument
      - id: micro-behaviors/process/enumerate/managed::get-processes-by-name
