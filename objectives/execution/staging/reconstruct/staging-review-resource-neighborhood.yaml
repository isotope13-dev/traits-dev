defaults:
  platforms:
  - windows
  for:
  - pe
  crit: suspicious
  conf: 0.88
composite_rules:
- id: admin-pe-resource-network-crypto-hidden-ps
  desc: Resource PE, network, crypto and hidden PowerShell clues
  all:
  - id: metadata/binary/resource/identity::dos-header-prefix-in-large-resource
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
  - id: micro-behaviors/crypto/decrypt/transform/unspecified::bcrypt-decrypt-api
  - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
  - id: metadata/build/manifest::require-administrator
- id: signed-resource-crypto-network-pe-protection
  desc: Signed resource, crypto, network and PE-protection clues
  all:
  - id: metadata/signature/certificate/chain::ca-issued-intact-signature
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/crypto/decrypt/transform/unspecified::bcrypt-decrypt-api
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
  - id: micro-behaviors/mem/combined::cbc-pe-header-protection-api-profile
