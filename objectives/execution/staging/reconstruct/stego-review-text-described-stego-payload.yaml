defaults:
  platforms: [unix, windows]
  for: [media, scripts]

composite_rules:
- id: text-described-stego-payload
  desc: Scripted image stego payload extraction
  crit: hostile
  conf: 0.9
  all:
    - id: metadata/file/profile/encoding/reference::textual-stego-tail-marker
    - id: micro-behaviors/data/encode/embedded::reversed-pe-base64-header
  any:
    - id: micro-behaviors/data/decode/command::base64-api-or-command
    - id: objectives/anti-static/obfuscation/encoding/
    - id: metadata/lang/source/syntax/call/invocation::decoded-function-constructor-text
