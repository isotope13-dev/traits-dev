defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: vbs-webdav-array-batch-stager
    desc: Reconstructs and stages WebDAV batch file
    crit: hostile
    conf: 0.99
    attack: T1105
    if:
      type: yara
      source: |
        rule vbs_webdav_array_batch_stager {
          strings:
            $unc = "Array(92,92,"
            $dav = "64,83,83,76,92,68,97,118,87,87,87,82,111,111,116,92"
            $rebuild = "c=c&Chr(k(j))"
            $copy = "a.CopyFile e,h,True"
            $run = "b.Run\"c\"&\"m\"&\"d\"&\".\"&\"e\"&\"x\"&\"e\""
            $hidden = ",0,False"
          condition:
            all of them and @unc < @dav and @dav < @rebuild and
            @rebuild < @copy and @copy < @run and @run < @hidden
        }
