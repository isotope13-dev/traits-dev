# The page body is not in the file: a script decodes it from fragments and
# writes it into the document at load, so the delivered HTML and the
# rendered HTML differ completely. Used to carry phishing redirects and
# credential pages past mail and web gateways.
defaults:
  platforms: [windows, linux, macos]
  for: [html, javascript]
  attack: T1027.006,T1204.001

composite_rules:
  - id: document-write-reconstructed-page
    desc: Page writes itself from decoded string-table fragments at load
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/control-flow/dispatch/computed::js-computed-document-call
      - id: metadata/lang/encoding/shape/fragment::unescape-of-table-lookup-concatenation
      - id: metadata/lang/encoding/shape/fragment::percent-encoded-fragment-string-table
