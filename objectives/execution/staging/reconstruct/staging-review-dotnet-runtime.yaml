defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- attack: T1059.005
  id: dotnet-base64-write-vbs-name
  desc: Base64 decode, file write and VBS name clues
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/fs/write/file/full/bytes::dotnet-base64-decode-and-write-reference
  - id: micro-behaviors/fs/write/file/content::dotnet-vbs-name-and-write-reference
- attack: T1059
  id: dotnet-base64-write-script-clues
  desc: Base64 decode, file write and script clues
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/fs/write/file/full/bytes::dotnet-base64-decode-and-write-reference
  any:
  - id: micro-behaviors/fs/write/file/content::dotnet-vbs-name-and-write-reference
  - id: micro-behaviors/fs/path/extension::bat-dup
  - id: micro-behaviors/fs/write/file/full/unspecified::dotnet-ps1-file-write
  downgrade:
    any:
    - id: metadata/vendor/string::microsoft-corp-marker-rsrc
    - id: metadata/vendor/identity::microsoft-corp-versioninfo
- attack: T1070.004
  id: dotnet-vbs-write-delete-powershell
  desc: VBS write, deletion and PowerShell clues
  crit: hostile
  conf: 0.95
  all:
  - id: objectives/execution/staging/reconstruct::dotnet-base64-write-vbs-name
  - id: micro-behaviors/fs/delete/file/script::vbs-delete-command-text
  any:
  - id: metadata/import/framework::sma-namespace
  - id: metadata/import/framework::runspace-factory
- attack: T1059.001
  id: dotnet-vbs-write-powershell-script
  desc: VBS write and PowerShell script clues
  crit: hostile
  conf: 0.95
  all:
  - id: objectives/execution/staging/reconstruct::dotnet-base64-write-vbs-name
  - id: metadata/import/framework::sma-namespace
  - id: metadata/lang/source/naming/function/runtime::add-script
