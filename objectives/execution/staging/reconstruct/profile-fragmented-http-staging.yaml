defaults:
  platforms: [windows, unix]
  for: [javascript]
composite_rules:
  - id: fragmented-temp-save-url-clues
    desc: TEMP, save and URL fragments
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/lang/source/literal/fragment/single::temp-env-fragment
      - id: metadata/lang/source/literal/fragment/single::vet-string-fragment
      - id: objectives/anti-static/obfuscation/string/conceal::save-to-file-fragment-oFil
    any:
      - id: micro-behaviors/communications/url/construction/fragment::js-fragmented-url-protocol
      - id: micro-behaviors/data/string/concat/expression::massive-concatenation-chain

  - id: fragmented-http-stream-size-clues
    desc: HTTP, response and stream-size fragments
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/lang/source/shape::js-eval-assignment-return
      - id: metadata/lang/source/function::many-no-param-functions
      - id: metadata/lang/source/literal/fragment/single::msxml-name-fragments
      - id: metadata/lang/source/literal/fragment/single::xo-res-fragment
      - id: metadata/lang/source/literal/fragment/syntax::body-close-fragment
      - id: metadata/lang/source/literal/fragment/single::xa-siz-fragment
      - id: metadata/lang/source/literal/fragment/single::e-over-100-fragment
