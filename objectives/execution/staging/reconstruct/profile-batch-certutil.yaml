defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: batch-sliced-certutil-exe-path-profile
    desc: Batch sliced certutil and EXE path clues
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/decode/to-file::certutil-decode-temp
      - id: micro-behaviors/fs/path/temporary-artifact::batch-exe-path-reference
      - id: metadata/lang/source/syntax/expansion::batch-percent-substring-slicing
    any:
      - id: micro-behaviors/process/config/window::wscript-shell-run-hidden-window
      - id: micro-behaviors/data/control-flow/dispatch/run::run-zero-boolean-arguments
      - id: micro-behaviors/process/daemonize/spawn::start-no-new-window
    needs: 1
