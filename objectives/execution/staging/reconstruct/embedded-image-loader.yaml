# Embedded PowerShell can be inert data in the containing PE. Report the
# script's capabilities without claiming that the PE invokes it.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: embedded-powershell-footer-index
    desc: PowerShell compares footer bytes
    crit: notable
    if:
      type: text
      regex: '\$\w+\[\$\w+\s*-\s*\d\]\s*-eq\s*0x[0-9a-fA-F]{2}\s*-and'
  - id: embedded-powershell-buffer-slice
    desc: PowerShell allocates entry-sized bytes
    crit: notable
    if:
      type: text
      regex: 'New-Object byte\[\]\s+\$\w+\.\w+'

composite_rules:
  - id: embedded-footer-indexed-hidden-dll-loader
    desc: Contains script with footer checks and hidden DLL launch
    crit: hostile
    all:
      - id: embedded-powershell-footer-index
      - id: embedded-powershell-buffer-slice
      - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/os/application/target/system::rundll32-executable-reference
    near_bytes: 8192
