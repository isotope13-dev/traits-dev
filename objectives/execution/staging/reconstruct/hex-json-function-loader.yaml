defaults:
  platforms: [unix, windows]
  for: [font, data, text, javascript]
traits:
  - id: hex-json-field-function-loader
    desc: Hex loader executes JSON field
    crit: hostile
    conf: 0.99
    if:
      type: encoded
      encoding: hex
      regex: 'error.{0,24}res\.data\.cookie;.{0,80}Function.{0,60}error\);handler\(require\)'
