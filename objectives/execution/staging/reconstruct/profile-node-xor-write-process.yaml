defaults:
  crit: suspicious
composite_rules:
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - pe
  id: node-xor-write-process-clues
  desc: Node XOR, file-write and process clues
  conf: 0.98
  near_bytes: 8192
  all:
  - id: micro-behaviors/data/bitwise/xor-forms/indexed::indexed-xor-array-assignment
  - id: micro-behaviors/fs/write/file/content::synchronous-file-write-call-or-embedded-text
  any:
  - id: micro-behaviors/process/argument/interpreter::node-jar-launch-argument
  - id: micro-behaviors/process/create/shell/interpreter::node-powershell-launch
  unless:
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: metadata/path/directory::test-directory-component
