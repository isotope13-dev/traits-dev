defaults:
  platforms: [unix, windows]
  for: [rust]
composite_rules:
  - id: build-rs-decoded-write-command-clues
    desc: Build script decode, write and command clues
    crit: suspicious
    conf: 0.94
    scope: file
    all:
      - id: metadata/build/ecosystem::cargo-build-script-basename
      - id: micro-behaviors/data/decode/codecs::rust-base64-or-hex-decode
      - id: micro-behaviors/fs/write/file/full/unspecified::fs-write
      - id: metadata/lang/source/syntax/argument::rust-indirect-command-new
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::set-permissions-call
      - id: micro-behaviors/os/sysinfo/directories::rust-temp-dir

