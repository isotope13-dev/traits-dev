defaults:
  platforms: [windows]
  for: [text, batch, cmd]

traits:
  - id: ftp-copy-then-start-same-executable
    desc: FTP-style copy and start same filename
    crit: notable
    conf: 0.96
    if:
      type: yara
      source: |
        rule ftp_copy_then_start_same_executable {
          strings:
            $copy = /(^|\n)![ \t]*copy[^\r\n]{0,24}\/b[ \t]+[^\r\n]{1,200}\+[^\r\n]{1,200}[ \t]+"?[A-Za-z0-9_.-]{1,180}\.exe/ ascii nocase
            $start = /(^|\n)![ \t]*start[ \t]+(""[ \t]+"?(\.\\+)?[A-Za-z0-9_.-]{1,180}\.exe|(\.\\+)?[A-Za-z0-9_.-]{1,180}\.exe)/ ascii nocase
            $name = /[A-Za-z0-9_.-]{1,180}\.exe/ ascii nocase
          condition:
            #copy > 0 and #start > 0 and #name >= 2 and
            for any c in (1..#copy) : (
              (@copy[c] + !copy[c] == filesize or
                uint8(@copy[c] + !copy[c]) == 32 or uint8(@copy[c] + !copy[c]) == 9 or
                uint8(@copy[c] + !copy[c]) == 10 or uint8(@copy[c] + !copy[c]) == 13 or
                uint8(@copy[c] + !copy[c]) == 34) and
              for any i in (1..#name) : (
                @name[i] >= @copy[c] and @name[i] + !name[i] == @copy[c] + !copy[c] and
                (uint8(@name[i] - 1) == 32 or uint8(@name[i] - 1) == 9 or
                  uint8(@name[i] - 1) == 34) and
                for any j in (1..#name) : (
                  @name[j] > @name[i] and !name[i] == !name[j] and
                  (uint8(@name[j] - 1) == 32 or uint8(@name[j] - 1) == 9 or
                    uint8(@name[j] - 1) == 34 or uint8(@name[j] - 1) == 92) and
                  for all k in (0..(!name[i] - 1)) : (
                    (uint8(@name[i] + k) | 32) == (uint8(@name[j] + k) | 32)
                  ) and
                  for any s in (1..#start) : (
                    @start[s] > @copy[c] and
                    @name[j] >= @start[s] and @name[j] + !name[j] <= @start[s] + !start[s] and
                    (@start[s] + !start[s] == filesize or
                      uint8(@start[s] + !start[s]) == 32 or uint8(@start[s] + !start[s]) == 9 or
                      uint8(@start[s] + !start[s]) == 10 or uint8(@start[s] + !start[s]) == 13 or
                      uint8(@start[s] + !start[s]) == 34 or uint8(@start[s] + !start[s]) == 38 or
                      uint8(@start[s] + !start[s]) == 124)
                  )
                )
              )
            )
        }
