defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
  attack: T1059.004
  mbc: B0030
composite_rules:
- id: python-reverse-shell-payload-emitter
  desc: Shell script writes a Python remote-shell payload
  crit: hostile
  conf: 0.95
  attack: T1059.004,T1059.006
  near_lines: 40
  all:
  - id: micro-behaviors/fs/write/file/redirect::shell-echo-file-write
  - id: micro-behaviors/communications/socket/create::shell-embeds-python-socket-call
  - id: metadata/lang/source/syntax/call/invocation::shell-connect-method-text
  - id: metadata/import/builtin::shell-embedded-python-subprocess-import
- id: parameterized-reverse-shell-generator
  desc: Generates a remote shell with operator-supplied callback
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/metaprogramming/generation/source::shell-emitted-payload-connect-target
  - id: micro-behaviors/fs/write/file/redirect::shell-echo-file-write
  any:
  - id: metadata/import/builtin::python-subprocess-import
  - id: micro-behaviors/metaprogramming/generation/source::shell-appends-payload-module
