defaults:
  platforms:
    - windows
    - unix
  for:
    - python
  attack: T1027
  mbc: B0032
composite_rules:
  - id: python-marshal-bytecode-reconstruction
    desc: Python reconstructs compressed marshaled bytecode
    crit: suspicious
    conf: 0.98
    attack: T1027,T1140,T1059.006
    all:
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
      - id: micro-behaviors/data/decompress/zlib::zlib-decompress-symbol
      - id: micro-behaviors/data/serialize/unsafe::marshal-bytecode-materialization
    near_bytes: 4096
    unless:
      - id: metadata/path/directory::test-directory-component
