# Classified by required operations; references do not establish data flow.
defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
composite_rules:
  - id: swift-hex-xor-process-loader
    desc: Swift hex/XOR decoding with process launch
    crit: suspicious
    conf: 0.99
    # One source file must hold the decoded bytes, the XOR, and the launch.
    # Archive scope joined unrelated Swift files of a package, e.g. a test
    # fixture hex literal, a sandbox XOR routine, and a tracker's Process call.
    for: [swift]
    scope: file
    all:
      - id: metadata/lang/encoding/hex::hex-long-hex-string-literal
      - id: micro-behaviors/data/decode/hex::swift-radix16-byte-decode
      - id: micro-behaviors/data/bitwise/mixed::source-xor-operation
      - id: micro-behaviors/process/create/subprocess/launch::swift-source-process-run

