defaults:
  platforms:
    - windows
  for:
    - csharp
composite_rules:
  - id: html-hex-decode-write-profile
    desc: HTML extraction, hex and file-write clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/parse/html::script-tag-regex-extraction
      - id: micro-behaviors/data/decode/hex::dotnet-hexstring-conversion
      - id: micro-behaviors/fs/write/file/full/bytes::writeallbytes-any
    any:
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/communications/http/client/managed::downloaddata
