composite_rules:
- platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for:
  - python
  id: python-base64-pe-execution-permission-clues
  desc: Python Base64 PE and launch-or-permission clues
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/file/encoding/shape::base64-pe-script-carrier
  - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
  any:
  - id: micro-behaviors/os/handler/open::os-startfile-call
  - id: micro-behaviors/process/create/subprocess/launch::process-execution
  - id: micro-behaviors/fs/chmod/executable/evidence::executable-mode-evidence