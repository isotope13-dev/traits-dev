# Classified by required operations; references do not establish data flow.
defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
composite_rules:
  - id: swift-openssl-base64-exec
    desc: Passworded decode with executable-mode flag
    crit: suspicious
    conf: 0.97
    for: [swift]
    platforms: [unix]
    all:
      - id: micro-behaviors/data/decode/base64/reference::swift-base64-decoder-call
      - id: micro-behaviors/crypto/key/representation/material::openssl-hardcoded-pass
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-make-executable

