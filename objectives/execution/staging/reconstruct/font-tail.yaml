# Executable preparation from an encrypted suffix hidden behind a font carrier.
# These are same-file clues; they do not prove that the decoded bytes were run.
defaults:
  platforms: [unix, windows]
  for: [shell, python]
  crit: suspicious
  conf: 0.94
  attack: T1027.009,T1140
composite_rules:
  - id: encrypted-font-executable-staging
    desc: Font-tail AES decoding accompanies executable permission changes
    scope: file
    all:
      - id: objectives/anti-static/obfuscation/payload/container::font-delimited-encrypted-payload
      - id: micro-behaviors/fs/chmod/executable/mode::script-grants-execute-permission

  - id: encrypted-font-hidden-staging
    desc: Decrypted font tail staged beneath hidden home directory
    crit: hostile
    conf: 0.95
    attack: T1027.009,T1564.001
    scope: file
    near_lines: 40
    all:
      - id: objectives/anti-static/obfuscation/payload/container::font-delimited-encrypted-payload
      - id: objectives/execution/staging/http::hidden-home-write-alternative

