defaults:
  platforms:
    - openwrt
    - unix
  for:
    - zig
traits:
  - id: zig-base64-hidden-temp-shell-text
    desc: Base64 text near hidden temp shell path
    crit: component
    conf: 0.94
    if:
      type: text
      regex: base64_decode[\s\S]{0,500}/tmp/\.[A-Za-z0-9._-]+\.sh
composite_rules:
  - id: zig-base64-hidden-shell-path-clues
    desc: Zig Base64 and hidden shell path text
    crit: notable
    conf: 0.97
    all:
      - id: objectives/execution/staging/reconstruct::zig-base64-hidden-temp-shell-text
      - id: micro-behaviors/fs/path/hidden::zig-hidden-temp-shell-path
