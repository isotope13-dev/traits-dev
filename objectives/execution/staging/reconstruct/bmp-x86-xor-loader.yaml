# The entry stub searches for an XOR key by restoring a NOP sentinel, then
# decodes subsequent 32-bit words until the C4 sentinel. The fixed key is
# included because the companion recovery-inhibition observation describes
# strings recovered using that key.
defaults:
  platforms: [windows]
  for: [bmp]
traits:
  - id: bmp-x86-key-search-payload-decoder
    desc: BMP carries x86 XOR key-search decoder
    crit: hostile
    conf: 0.99
    if:
      type: hex
      pattern: '55 89 E5 8B 45 08 EB 00 89 45 EC 8D 15 ?? ?? ?? ?? 8D 05 ?? ?? ?? ?? 83 E8 08 29 C2 8B 45 EC 01 C2 31 DB B8 2C B6 98 0E 31 04 1A 81 3C 1A 90 90 90 90 74 ?? 83 FB 00 75 ?? 31 04 1A 40 EB ?? EB ?? 83 C3 04 81 3C 1A C4 C4 C4 C4'
