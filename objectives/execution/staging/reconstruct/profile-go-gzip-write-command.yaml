defaults:
  crit: suspicious
composite_rules:
- platforms:
  - unix
  - windows
  for:
  - go
  conf: 0.92
  id: go-gzip-write-temp-command-clues
  desc: Go gzip, file write and temp command clues
  all:
  - id: micro-behaviors/data/compression::go-base64-gzip-decode
  - id: micro-behaviors/fs/write/file/full/unspecified::go-os-writefile
  - id: micro-behaviors/process/create/path-execution::go-command-temporary-path
