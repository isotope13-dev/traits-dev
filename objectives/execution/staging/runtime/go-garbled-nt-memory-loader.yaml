defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-garbled-nt-memory-loader
    attack: T1055.012,T1620
    desc: Garbled Go NT memory and thread execution clues
    crit: suspicious
    conf: 0.97
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garbled-type-pointer
      - id: objectives/evasion/anti-av/syscall::indirect-nt-api-self-injection
      - id: micro-behaviors/process/info/thread::thread-context-triple-no-suspend
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/process/thread/create::create-thread
    any:
      - id: metadata/binary/symbols/name/crypto::go-chacha20-xor-keystream-reference
      - id: metadata/import/go/net/http
    needs: 1
