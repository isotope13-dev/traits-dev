defaults:
  platforms: [windows, unix]
composite_rules:
  - id: python-release-spawn-hex-clues
    desc: Python release, spawn and hex decode clues
    crit: suspicious
    conf: 0.98
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/communications/http/download/helper::python-standalone-release-reference
      - id: micro-behaviors/process/deploy/runtime::interpreter-path-api-reference
      - id: micro-behaviors/process/create/exec::child-process-member-spawn
      - id: micro-behaviors/data/decode/hex::buffer-from-hex-string
    any:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/communications/url/scheme::hex-encoded-https
      - id: metadata/lang/encoding/hex::js-dense-hex-escapes
