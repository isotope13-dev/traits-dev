defaults:
  platforms:
    - unix
    - windows
  for:
    - python
composite_rules:
  - id: python-embedded-pe-temp-shell-clues
    desc: Embedded PE, temp EXE and shell clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/embedded/payload/array::escaped-pe-bytes-literal
      - id: micro-behaviors/fs/path/temporary-artifact::python-temp-exe-text
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system-text
