defaults:
  platforms: [openbsd, bsd, unix]
  for: [go, elf]

composite_rules:
  - id: go-runtime-compiled-hidden-stager
    for: [go]
    desc: Go build command and stager references
    crit: notable
    conf: 0.98
    all:
      - id: metadata/lang/source/naming/variable::go-encoded-stager-const
      - id: metadata/lang/source/syntax/call/construction::go-build-command
      - id: micro-behaviors/fs/path/script::go-temp-stager-source
