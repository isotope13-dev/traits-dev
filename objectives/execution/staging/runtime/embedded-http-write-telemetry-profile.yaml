composite_rules:
- platforms:
  - windows
  for:
  - pe
  id: embedded-http-write-telemetry-profile
  desc: Embedded WSH HTTP, file-write and status clues
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/process/interpreter/wsh::embedded-http-file-dropper
  - id: micro-behaviors/process/interpreter/wsh::embedded-http-status-telemetry
  any:
  - id: micro-behaviors/os/com/automation::filesystemobject-progid
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-com
  - id: metadata/build/manifest::admin-manifest
