defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: vb6-hidden-child-resource-api-clues
    desc: VB6 hidden-process and resource API clues
    crit: suspicious
    conf: 0.8
    all:
      - id: metadata/lang/runtime::vb6-application-framework
      - id: metadata/binary/resource/entropy::high-entropy-rsrc
      - id: micro-behaviors/process/config/launch::x86-create-no-window-immediate
      - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
      - id: micro-behaviors/mem/copy::rtl-move-memory-name
    unless:
      - id: metadata/installer/product/
