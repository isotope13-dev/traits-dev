defaults:
  for:
    - pe
    - dll
  platforms:
    - windows

composite_rules:
  - id: overlay-inline-pe-rwx-clues
    desc: Overlay PE RWX and host-name clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/file/pe-inspect::inline-pe-signature-check
      - id: micro-behaviors/mem/combined::rwx-flag-or-argument-patterns
      - id: metadata/binary/layout/entropy::low-overlay-entropy
      - id: micro-behaviors/os/sysinfo/hostname/query::get-computer-name
    any:
      - id: metadata/lang/compiler/native::mingw-runtime-marker
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    needs: 1
    unless:
      - id: metadata/lang/compiler/managed::dotnet-metadata
