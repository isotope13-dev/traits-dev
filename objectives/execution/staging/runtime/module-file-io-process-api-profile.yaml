defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
composite_rules:
- id: module-file-io-process-api-profile
  desc: Module-path, file-I/O and process API profile
  conf: 0.94
  all:
  - id: micro-behaviors/fs/file/copy/call::copyfile-w
  - id: metadata/binary/symbols/name/process::create-process-w
  - id: micro-behaviors/fs/path/check::get-module-filename
  - id: micro-behaviors/fs/delete/file/library::deletefile-w
  - id: micro-behaviors/fs/file/open/unspecified::file-create-win
  - id: micro-behaviors/fs/file/handle::set-file-pointer
  - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
  - id: micro-behaviors/time/query::get-tick-count
  unless:
  - id: metadata/lang/compiled::autoit-compiled-script
  - id: well-known/app/system/iobit::iobit-component-context
  - id: well-known/lib/native/madexcept/
