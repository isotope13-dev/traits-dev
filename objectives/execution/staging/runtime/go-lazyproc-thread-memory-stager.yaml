defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-lazyproc-thread-memory-stager
    attack: T1620
    desc: Go dynamic dispatch with thread and memory clues
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/api-resolution/manual::go-syscall-dynamic-api-dispatch
      - id: micro-behaviors/process/thread/lifecycle::thread-control-apis-3of4
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/process/thread/create::create-thread
      - id: metadata/binary/symbols/imports::pe-single-import-dll
    any:
      - id: objectives/anti-static/obfuscation/name-mangling/type-names
      - id: metadata/binary/section/ratio::inflated-data-section
      - id: metadata/binary/resource/size::no-resources
    needs: 2
    unless:
      - id: micro-behaviors/communications/http/server/listener::listenandserve-call
