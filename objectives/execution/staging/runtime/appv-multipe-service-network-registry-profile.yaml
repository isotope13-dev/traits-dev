defaults:
  platforms:
    - windows
  for:
    - pe
composite_rules:
  - id: appv-multipe-service-network-registry-profile
    desc: App-V multi-PE with network and service API references
    crit: suspicious
    conf: 0.996
    all:
      - id: well-known/app/enterprise/microsoft-office-c2r::appv-isv-subsystems-dll-reference
      - id: metadata/binary/section/label/packing::c2r-section-name
      - id: metadata/binary/layout/ratio::multiple-pe-embedded
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-api-cluster
      - id: micro-behaviors/os/service/configure::service-reconfiguration-control-api-set
    any:
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path
      - id: micro-behaviors/os/registry/com/reference::clsid-inprocserver32-key-path
      - id: micro-behaviors/fs/file/create::create-shortcut
      - id: objectives/evasion/masquerade/identity/fabricated::office-policy-registry
    needs: 2
