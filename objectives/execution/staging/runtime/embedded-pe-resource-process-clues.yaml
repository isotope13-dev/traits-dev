defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: embedded-pe-resource-process-clues
    desc: Embedded PE, resource and process API clues
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: metadata/binary/symbols/name/process::create-process-a
    any:
      - id: metadata/binary/resource/entropy::dominant-high-entropy-rsrc-section
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: micro-behaviors/os/env/path::temp-var
    needs: 2
    unless:
      - id: metadata/installer/product/
