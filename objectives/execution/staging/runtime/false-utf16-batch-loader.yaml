defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: false-utf16-batch-header
    desc: UTF-16 marker precedes ASCII batch header
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule false_utf16_ascii_batch_header {
          strings:
            $header = { FF FE 26 63 6C 73 0D 0A }
          condition:
            $header at 0
        }
  - id: raw-antivirus-process-check
    desc: Raw batch checks antivirus processes
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        rule false_bom_av_process_check {
          strings:
            $avast = "tasklist /FI \"IMAGENAME eq AvastUI.exe\"" nocase
            $avg = "tasklist /FI \"IMAGENAME eq avgui.exe\"" nocase
          condition:
            any of them
        }
  - id: raw-powershell-archive-fetch
    desc: Raw batch downloads and extracts archives
    crit: notable
    conf: 0.94
    if:
      type: yara
      source: |
        rule false_bom_archive_fetch {
          strings:
            $fetch = "Invoke-WebRequest"
            $extract = "Expand-Archive"
          condition:
            all of them
        }
  - id: raw-startup-script-placement
    desc: Raw batch moves a script into Startup
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        rule false_bom_startup_script {
          strings:
            $script = "startuppp.bat"
            $startup = "Windows\\Start Menu\\Programs\\Startup"
          condition:
            all of them
        }
  - id: raw-startup-batch-target
    desc: Raw batch names Startup and batch file
    crit: notable
    conf: 0.94
    if:
      type: yara
      source: |
        rule false_bom_startup_batch_target {
          strings:
            $startup = "Startup"
            $batch = ".bat"
          condition:
            all of them
        }

composite_rules:
  - id: false-bom-antivirus-aware-startup-loader
    desc: Misencoded batch stages a startup loader
    crit: hostile
    conf: 0.98
    attack: T1027,T1105,T1547.001
    all:
      - id: false-utf16-batch-header
      - id: raw-antivirus-process-check
      - id: raw-powershell-archive-fetch
      - id: raw-startup-script-placement
  - id: false-bom-hidden-startup-python-loader
    desc: Misencoded batch stages startup and Python
    crit: hostile
    conf: 0.97
    attack: T1027,T1105,T1547.001
    all:
      - id: false-utf16-batch-header
      - id: raw-startup-batch-target
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::hidden-archive-download-extract-context
      - id: micro-behaviors/process/interpreter/python::python-script-from-batch
