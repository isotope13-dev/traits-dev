defaults:
  for:
    - pe
    - dll
  platforms:
    - windows

composite_rules:
  - id: payload-thread-pe-memory-clues
    desc: Payload thread PE and allocation clues
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/lang/natural/phrasing/execution::payload-thread-text
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
    any:
      - id: micro-behaviors/data/format/pe-parser::nt-headers-structure-reference
      - id: metadata/lang/natural/phrasing/execution::original-entry-point-terms
      - id: metadata/lang/natural/phrasing/execution::detected-payload-architecture-text
