# Hex text and API names do not identify shellcode or its execution.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: hex-peb-memory-protection-clues
  desc: Hex text, PEB and memory API clues
  conf: 0.95
  arch:
  - x86-64
  all:
  - id: metadata/file/encoding/hex::long-hex-text-run
  - id: micro-behaviors/process/info/query::peb-access-x64
  - id: micro-behaviors/mem/alloc/virtual::alloc-memory-sym--ntallocatevirtualmemory
  - id: micro-behaviors/mem/protect/modify/api-reference::nt-protect-virtual-memory-name
  any:
  - id: micro-behaviors/mem/sync/cache::nt-flush-instruction-cache
  - id: micro-behaviors/fs/path/system/library::wininet-dll-name-reference
  needs: 1
  unless:
  - id: metadata/installer/product/
  - id: metadata/binary/symbols/count::many-imports-20
  crit: suspicious
