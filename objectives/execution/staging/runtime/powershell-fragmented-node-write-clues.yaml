defaults:
  for: [powershell]
  platforms: [windows]
composite_rules:
  - id: powershell-fragmented-node-write-clues
    desc: Fragmented Node, encoding and write clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/lang/source/literal/fragment/sequence::fragmented-https-node-text
      - id: metadata/lang/source/literal/fragment/sequence::fragmented-de-wi-x64-text
      - id: metadata/lang/encoding/base64::multiple-base64-literals
      - id: micro-behaviors/fs/write/file/full/string::write-all-text
    any:
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
      - id: micro-behaviors/process/create/cmdlet::start-process-call
    needs: 2
