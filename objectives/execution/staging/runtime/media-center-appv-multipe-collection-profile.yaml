defaults:
  platforms:
    - windows
  for:
    - pe
composite_rules:
  - id: media-center-appv-multipe-collection-profile
    desc: Media Center and App-V multi-PE with collection clues
    crit: suspicious
    conf: 0.997
    size_min: 2500000
    size_max: 4000000
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/binary/layout/ratio::multiple-pe-embedded
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: well-known/app/enterprise/microsoft-office-c2r::appv-isv-subsystems-dll-reference
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-api-cluster
    any:
      - id: metadata/binary/debug::office-protocolhandler-pdb-reference
      - id: micro-behaviors/ui/window/hook::set-windows-hook-text
      - id: micro-behaviors/ui/graphics/image::create-dib-section
      - id: micro-behaviors/communications/http/user-agent::adobe-logtransport-user-agent
      - id: micro-behaviors/os/service/configure::service-reconfiguration-control-api-set
      - id: micro-behaviors/hardware/input/keyboard/poll::key-state-ui-timer-pe-api-set
      - id: objectives/evasion/masquerade/identity/fabricated::office-policy-registry
      - id: micro-behaviors/fs/path/application/executable::media-center-ext-host-filename
      - id: well-known/game/mahjong-titans::mahjong-titans-name-reference
    needs: 5
