defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: module-map-write-process-profile
    desc: Module, mapping, write and launch API clues
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/process/info/current::get-module-filename
      - id: micro-behaviors/mem/map::win32-file-mapping
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
    any:
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/os/handler/open::shell-execute-ex
