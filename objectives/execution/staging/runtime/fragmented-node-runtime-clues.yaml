defaults:
  crit: suspicious
  for: [powershell]
  platforms: [windows]
composite_rules:
  - id: fragmented-node-runtime-clues
    desc: Fragmented Node runtime clues
    conf: 0.95
    all:
      - id: metadata/lang/source/literal/fragment/sequence::fragmented-de-wi-x64-text
    any:
      - id: metadata/lang/source/literal/fragment/sequence::fragmented-node-distribution-url-text
      - id: metadata/lang/source/literal/fragment/sequence::fragmented-https-node-text
      - id: metadata/lang/source/literal/fragment/sequence::fragmented-node-executable-text
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive
      - id: metadata/lang/source/literal/fragment/sequence::fragmented-nodejs-path-text
      - id: micro-behaviors/communications/http/client/library::iwr-name
    needs: 3
