defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: source-named-obfuscated-resource-writer-launch
    desc: Source-named obfuscated resource writer with process launch APIs
    crit: hostile
    conf: 0.98
    attack: T1027
    all:
      - id: metadata/file/extension/mismatch::pe-named-as-source
      - id: objectives/anti-static/obfuscation/encoding/buffer::zero-width-managed-resource-xor-writer
      - id: micro-behaviors/data/embedded/payload/resource::managed-resource-write-hidden-launch-api-profile
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start-call
