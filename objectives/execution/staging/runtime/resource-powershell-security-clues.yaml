defaults:
  platforms:
    - windows
  for:
    - pe
composite_rules:
  - id: resource-powershell-security-clues
    desc: Resource, PowerShell and security-option clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/embedded/resource::resource-access-temp-api-clues
    any:
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-line
      - id: micro-behaviors/os/privilege/elevation::powershell-start-process-runas
      - id: micro-behaviors/communications/http/request/client::invoke-webrequest-tls12-chain
      - id: micro-behaviors/os/security/defender::defender-exclusion-command
    needs: 3
