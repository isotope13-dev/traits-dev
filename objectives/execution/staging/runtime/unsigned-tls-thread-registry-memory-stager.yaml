defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: unsigned-tls-thread-registry-memory-stager
    attack: T1112,T1620
    crit: suspicious
    desc: Unsigned TLS, thread, registry and memory clues
    conf: 0.98
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: micro-behaviors/mem/alloc/virtual::virtualalloc-readwrite-commit-resolved-x64
      - id: micro-behaviors/process/info/thread::thread-context-api-reference-set
      - id: micro-behaviors/process/thread/lifecycle::resume-thread
      - id: micro-behaviors/os/registry/value/write::registry-set-value-api
    unless:
      - id: metadata/installer/product/
      - id: well-known/app/development/hp-digital-imaging::hp-signed-scanner-component
      - id: well-known/app/development/hp-digital-imaging::hp-scanapi-component
