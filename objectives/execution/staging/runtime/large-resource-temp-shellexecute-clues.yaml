defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: large-resource-temp-shellexecute-clues
    desc: Large resource, temp and ShellExecute clues
    crit: suspicious
    conf: 0.985
    all:
      - id: metadata/binary/layout/size::multi-megabyte-pe-negligible-code
      - id: metadata/binary/resource/size::oversized-rsrc
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-rdata
      - id: micro-behaviors/os/handler/open::shell-execute-rdata
