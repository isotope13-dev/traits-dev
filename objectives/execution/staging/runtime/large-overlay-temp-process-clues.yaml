defaults:
  platforms:
    - windows
  for: [scripts, binaries]

composite_rules:
  - id: large-overlay-temp-process-clues
    desc: Large overlay, temp and process clues
    crit: suspicious
    conf: 0.96
    for: [pe]
    all:
      - id: micro-behaviors/fs/path/system/library::multiple-windows-dll-name-references
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
    any:
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-enumeration-with-access
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
      - id: micro-behaviors/os/service/configure::change-service-config2-w-symbol
      - id: micro-behaviors/os/privilege/token/use::adjust-token-privileges
      - id: micro-behaviors/os/compat/wow64::wow64-fs-redirect
    needs: 2
