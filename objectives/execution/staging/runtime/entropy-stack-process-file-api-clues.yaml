defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: entropy-stack-process-file-api-clues
    desc: Entropy, process-name and file API clues
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/binary/section/entropy::large-high-entropy-writable-data-section
      - id: objectives/anti-static/obfuscation/string/reconstruct/stack::stack-create-process-truncated
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/fs/file/open/unspecified::file-create-win
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
    unless:
      - id: metadata/installer/product/
