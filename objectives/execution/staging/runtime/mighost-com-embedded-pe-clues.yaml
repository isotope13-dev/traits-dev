# MigHost and COM registry clues do not establish a hijack or payload execution.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: mighost-com-embedded-pe-clues
  desc: MigHost, COM and embedded PE clues
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/binary/layout/ratio::pe-signature-present
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/section/ratio::pe-largest-section-under-ten-percent
  - id: well-known/app/system/microsoft/migration::mighost-command-template
  - id: well-known/app/system/microsoft/migration::mighost-load-dll-server-log
  - id: well-known/app/system/microsoft/migration::mighost-volatile-registry-log
  - id: micro-behaviors/os/registry/com/reference::proxystubclsid32-registry-fragment
  any:
  - id: micro-behaviors/os/registry/com/reference::clsid-inprocserver32-key-path
  - id: micro-behaviors/os/registry/com/reference::clsid-registry-key-path
  - id: micro-behaviors/communications/http/form::multipart-form
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-send-request-text
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-receive-response-text
  - id: micro-behaviors/os/privilege/token/use::adjust-token-privileges-text
  - id: objectives/credential-access/credential-manager/store-api::credential-manager-read-client
  - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
  - id: micro-behaviors/os/sysinfo/platform/artifact::get-user-default-ui-language
  needs: 3
  unless:
  - id: well-known/app/system/microsoft/migration::mighost-binary-identity
