defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: unsigned-source-pe-write-hidden-launch-api-profile
    desc: Unsigned source-named PE has write and hidden-launch API references
    crit: notable
    conf: 0.98
    all:
      - id: metadata/file/extension/mismatch::pe-named-as-source
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
      - id: micro-behaviors/process/config/window::dotnet-console-window-option-reference
    any:
      - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
      - id: micro-behaviors/os/registry/value/write::dotnet-registrykey-setvalue-references
      - id: micro-behaviors/communications/http/ip-discovery::ipinfo-io
