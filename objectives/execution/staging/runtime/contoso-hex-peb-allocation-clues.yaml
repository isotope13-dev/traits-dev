# Hex text and API names do not identify shellcode or its execution.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: contoso-hex-peb-allocation-clues
  desc: Contoso claim, hex, PEB and allocation clues
  conf: 0.96
  arch:
  - x86-64
  all:
  - id: objectives/evasion/masquerade/version-resource/claim::windows-runtime-suite-x-product-claim
  - id: metadata/file/encoding/hex::long-hex-text-run
  - id: micro-behaviors/process/info/query::peb-access-x64
  - id: micro-behaviors/mem/alloc/virtual::alloc-memory-sym--ntallocatevirtualmemory
  any:
  - id: micro-behaviors/fs/path/system/library::wininet-dll-name-reference
  - id: micro-behaviors/communications/http/dynamic::http-send-request-ansi-string
  needs: 1
  unless:
  - id: metadata/signature/verified/platform/
  - id: metadata/installer/product/
  crit: suspicious
