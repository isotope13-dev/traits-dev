defaults:
  platforms:
    - unix
    - windows
  for:
    - python
composite_rules:
  - id: python-base64-shell-remove-clues
    desc: Base64 text, shell and file-remove clues
    crit: suspicious
    conf: 0.96
    scope: file
    near_lines: 20
    all:
      - id: metadata/file/encoding/shape::python-base64-alphabet-run
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system-text
      - id: micro-behaviors/fs/delete/file/library::python-short-alias-remove
