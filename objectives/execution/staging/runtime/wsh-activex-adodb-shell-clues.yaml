defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
composite_rules:
  - id: wsh-activex-adodb-shell-clues
    desc: ActiveX, binary stream write and shell clues
    crit: suspicious
    conf: 0.95
    for:
      - javascript
    all:
      - id: micro-behaviors/os/com/instantiation::activex-constructor-call
      - id: micro-behaviors/fs/write/stream::adodb-binary-write
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
