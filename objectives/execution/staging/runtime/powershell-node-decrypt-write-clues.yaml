defaults:
  for: [powershell]
  platforms: [windows]
composite_rules:
  - id: powershell-node-decrypt-write-clues
    desc: Node runtime, decryption and write clues
    crit: suspicious
    conf: 0.96
    all:
      - id: objectives/execution/staging/runtime::fragmented-node-runtime-clues
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::powershell-base64-decryption-cooccurrence
      - id: micro-behaviors/fs/write/file/full/string::write-all-text
    any:
      - id: micro-behaviors/fs/path/script::powershell-js-filename-path
      - id: micro-behaviors/process/create/cmdlet::start-process-call
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
