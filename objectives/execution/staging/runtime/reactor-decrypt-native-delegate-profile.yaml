composite_rules:
- platforms:
  - windows
  for:
  - pe
  id: reactor-decrypt-native-delegate-profile
  desc: Reactor, decryption and native delegate clues
  crit: suspicious
  conf: 0.98
  all:
  - id: objectives/anti-static/obfuscation/obfuscator/managed::dotnet-reactor-obfuscator
  - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
  - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
  - id: micro-behaviors/mem/alloc/heap::dotnet-unmanaged-allocation-name
  - id: metadata/signature/absent::unsigned-missing-signature-record
  any:
  - id: metadata/lang/compiler/managed::reflection-emit
  - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::activator
  - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
  needs: 2
  unless:
  - id: well-known/lib/ai/argutrack-dnn::official-runtime-binary
