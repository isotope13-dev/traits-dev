defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: embedded-pe-noop-export-process-clues
    desc: Embedded PE with no-op and export-name clues
    crit: suspicious
    conf: 0.99
    all:
      - id: objectives/execution/staging/runtime::embedded-pe-resource-process-clues
      - id: objectives/anti-static/obfuscation/instruction/junk::dense-noop-function-stubs
      - id: objectives/anti-static/obfuscation/name-mangling/export-name::disassembler-style-export-flood
    unless:
      - id: metadata/installer/product/
