defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript, typescript]
composite_rules:
- id: jscript-adodb-responsebody-staging
  desc: JScript stages response through ADODB
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/fs/write/file/stream::js-adodb-stream-create
  - id: micro-behaviors/fs/write/file/stream::js-adodb-stream-set-type
  - id: micro-behaviors/fs/write/file/stream::js-adodb-stream-write-responsebody
  - id: micro-behaviors/fs/write/file/stream::js-savetofile-dynamic-path-mode-2
