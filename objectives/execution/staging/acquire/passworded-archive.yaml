# Download and passworded archive extraction in shell source.
defaults:
  platforms:
  - macos
  for:
  - scripts
  - source
  - macho
composite_rules:
- id: passworded-archive-download-extraction
  downgrade:
    scope: archive
    all:
    - id: well-known/tool/detection/code-analysis/disclude::static-fixture-package-without-interpreter
    - type: path
      regex: (^|[\\/])tests[\\/]fixtures[\\/]
  for:
  - shell
  desc: Password archive download and extraction clues
  crit: suspicious
  conf: 0.93
  all:
  - id: micro-behaviors/data/archive/extract/password::cli-passworded-archive-extraction
  - id: micro-behaviors/communications/http/download/cli/curl-wget::curl-wget-command
  unless:
  - id: well-known/lib/ai/inspect-evals::eval-corpus-context
  - id: metadata/package/testing/corpus/security-tests::inert-scanner-attack-corpus
