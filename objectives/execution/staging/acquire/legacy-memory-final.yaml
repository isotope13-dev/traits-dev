composite_rules:
- id: socket-receive-executable-mmap-clues
  for:
  - c
  desc: Socket receive and executable mmap with length or marker clues
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/mem/map::mmap-exec-source
  - id: micro-behaviors/communications/socket/receive::recv-symbol
  any:
  - id: metadata/file/format/firmware::vxws-marker-text
  - id: metadata/file/format/firmware::vxws-marker-integer-text
  - id: metadata/binary/section/bytes::swxv-marker-code-bytes
  - id: micro-behaviors/data/parse/length-prefix::length-prefixed-receive-source
  platforms:
  - appliance
  - unix
