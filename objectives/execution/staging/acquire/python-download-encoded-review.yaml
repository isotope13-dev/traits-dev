defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  attack: T1105
  mbc: E1105

composite_rules:
  - id: encoded-powershell-github-archive-clues
    desc: Encoded GitHub download and archive clues
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/encoding/base64::encoded-invoke-webrequest
      - id: metadata/lang/encoding/base64::encoded-outfile-option
      - id: metadata/lang/encoding/url::decoded-github-raw-path
    any:
      - id: micro-behaviors/process/argument/file::decoded-javaw-jar-argument-clues
      - id: metadata/lang/encoding/base64::wide-base64-javaw-exe
      - id: metadata/lang/encoding/base64::wide-base64-expand-archive
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive
