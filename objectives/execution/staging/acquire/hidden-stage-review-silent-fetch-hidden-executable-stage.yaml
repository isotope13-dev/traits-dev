defaults:
  for: [scripts, manifests, html, xml, dockerfile, package-lock.json, groovy]
  platforms: [linux, macos, windows]

composite_rules:
- id: silent-fetch-hidden-executable-stage
  desc: Silent download arms a hidden executable stage
  crit: suspicious
  conf: 0.96
  for:
    - shell
  platforms:
    - linux
    - macos
  attack: T1105,T1564.001,T1222.002
  near_bytes: 256
  all:
    - id: micro-behaviors/communications/http/download/curl::curl-silent-output
    - id: micro-behaviors/communications/http/download/cli/curl-wget::fetch-output-hidden-path-script
    - id: micro-behaviors/fs/chmod/executable/hidden::chmod-hidden-home-executable
