defaults:
  platforms: [windows, unix]
  for: [data]
  attack: T1105
  crit: hostile
  conf: 0.97

# Version-gated Flash loaders: the movie reads the player version ($version),
# builds a remote URL from it, and loads that movie for execution (GetURL2 in
# its load-target form). Absolute remote staging plus environment-gated
# payload selection is the exploit-kit SWF downloader shape; benign
# version-aware movies (upgrade prompts, player bootstraps) carry UI or
# fallback logic and do not reduce to this bare staging program.
composite_rules:
  - id: swf-packed-version-gated-loader
    desc: Packed Flash loads version-gated remote stage
    all:
      # CWS magic plus a 2KB ceiling: the whole artifact is the packed loader,
      # leaving no room for benign player or UI logic beside staging.
      - id: metadata/file/format/swf::compressed-swf-header
      - id: micro-behaviors/os/sysinfo/platform/version::flash-player-version-query
      - id: micro-behaviors/communications/http/download/url::flash-geturl2-http-stage
  - id: swf-version-aware-remote-stage-load
    desc: Flash movie stages version-gated remote movie
    conf: 0.95
    all:
      # Any Flash container (FWS/CWS/ZWS): this branch covers uncompressed and
      # recompressed movies whose bytecode the packed legs above cannot see.
      - id: metadata/file/format/swf::swf-movie-header
      # The AVM1 /:$version read, visible in the raw bytes of uncompressed
      # movies (CWS hides it; the packed composite covers that spelling).
      - id: micro-behaviors/os/sysinfo/platform/version::avm1-version-path-read
      # GetURL2 in its load-target (movie) form rather than variable loading.
      - id: micro-behaviors/communications/http/download/url::swf-geturl2-movie-load
      # The stage is fetched over HTTP(S) ...
      - id: micro-behaviors/communications/url/reference::swf-http-url
      # ... and the referenced payload is itself a Flash movie.
      - id: micro-behaviors/fs/path/document::swf-movie-filename
