defaults:
  attack: T1105
  platforms:
  - unix
  for:
  - shell
composite_rules:
- id: external-ip-wildcard-chmod-stage
  desc: External-IP payload download with wildcard executable staging
  crit: hostile
  conf: 0.98
  attack: T1105,T1222.002
  near_lines: 20
  all:
  - id: micro-behaviors/communications/http/download/shell::shell-curl-wget-url-fetch
  - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x-wildcard
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  any:
  - id: micro-behaviors/fs/directory/chdir::writable-dir-fallback-exact-chain
  - id: micro-behaviors/fs/directory/chdir::writable-dir-fallback-chain
- id: external-ip-multiarch-wildcard-stage
  desc: Multi-architecture external payload staging
  crit: hostile
  conf: 0.98
  attack: T1105,T1222.002
  near_lines: 20
  all:
  - id: objectives/execution/staging/acquire::external-ip-wildcard-chmod-stage
  - id: micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist
- id: fetcher-fallback-download-exec
  desc: Fallback fetchers stage a file for conditional execution
  crit: hostile
  conf: 0.97
  attack: T1105,T1059.004
  near_lines: 20
  all:
  # A quoted list of alternative download tools (wget/curl/fetch/lynx),
  # tried in turn so the transfer survives a missing binary.
  - id: micro-behaviors/communications/http/download/fallback::fetcher-name-list-value
  # The selected fetcher is invoked through a variable with arguments,
  # so the downloader command and its target survive renaming.
  - id: micro-behaviors/process/create/shell/variable-command::shell-variable-exec-with-args
  # The staged file is executed through a shell when it exists, closing
  # the download-to-execution chain. Proximity binds the three roles;
  # no single leg or pair establishes the staged execution.
  - id: micro-behaviors/process/interpreter/eval/source::shell-conditional-script-operation
