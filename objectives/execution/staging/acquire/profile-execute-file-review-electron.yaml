defaults:
  platforms: [windows]
  for: [javascript, typescript]


composite_rules:
  - id: electron-download-antivm-function-clues
    desc: Electron download and anti-VM function names
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/write/file/copy::download-to-file-symbol
      - id: objectives/evasion/anti-av/blinding::electron-anti-vm-routine
    unless:
      - id: metadata/path/directory::test-directory-component
