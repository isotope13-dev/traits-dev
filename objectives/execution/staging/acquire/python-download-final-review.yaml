defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  attack: T1105
  mbc: E1105


composite_rules:
  - id: python-http-temp-exe-write-clues
    desc: Python HTTP, binary write and temp EXE clues
    crit: hostile
    conf: 0.96
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/fs/file/open/unspecified::binary-write-mode
      - id: micro-behaviors/fs/temp/directory::python-tempdir-exe
  - id: python-daemon-urlretrieve-temp-exe
    desc: Python daemon, URL retrieve and temp EXE
    crit: hostile
    conf: 0.95
    attack: T1105,T1055
    near_lines: 25
    all:
      - id: micro-behaviors/process/thread/create::python-daemon-thread
      - id: micro-behaviors/communications/http/lib/urllib::python-urlretrieve-qualified
      - id: micro-behaviors/fs/temp/directory::python-tempdir-exe
  - id: python-remote-dylib-download-chmod
    desc: Python remote dylib download and chmod clues
    crit: hostile
    conf: 0.98
    attack: T1105,T1574.004
    scope: file
    near_lines: 30
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
      - id: micro-behaviors/process/deploy/library::source-remote-dylib-url
      - id: micro-behaviors/fs/chmod/executable/mode::python-executable
