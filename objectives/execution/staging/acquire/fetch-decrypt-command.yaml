defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
composite_rules:
  - id: fetch-decrypt-and-command-clues
    desc: Remote fetch, decryption and command clues
    conf: 0.99
    near_lines: 40
    all:
      - id: micro-behaviors/crypto/decrypt/transform/symmetric::cryptojs-block-cipher-decrypt-call
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/url/reference::remote-or-encoded-php-url-reference
    any:
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: objectives/anti-static/obfuscation/reflection/indirect::js-base64-decoded-computed-call
    crit: suspicious
