defaults:
  platforms: [unix, appliance]
  for: [shell]
  attack: T1105,T1222.002
  mbc: E1105


composite_rules:
  - id: tftp-temp-executable-mode
    desc: TFTP temporary download and executable permissions
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/tftp/download::command
      - id: micro-behaviors/communications/tftp/download::tftp-download-to-temp
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-absolute-path
    near_lines: 8
