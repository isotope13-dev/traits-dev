defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
  attack: T1059.007
traits:
- id: comma-activex-replace-shard
  desc: Comma-sharded ActiveXObject constructor
  crit: notable
  conf: 0.94
  size_max: 50000
  if:
    type: text
    regex: '"A"\+"Rt"\+\(.{0,160}"i"\)\+3\+"Ob"\+"jec\+"'
- id: comma-xmlhttp-replace-shard
  desc: Comma-sharded XMLHTTP ProgID
  crit: notable
  conf: 0.94
  size_max: 50000
  if:
    type: text
    regex: '"SX"\+"ML"\+\(.{0,80}"2\."\)\+"XM"\+"LHTT"'
- id: comma-wscript-replace-shard
  desc: Comma-sharded WScript ProgID
  crit: notable
  conf: 0.94
  size_max: 50000
  if:
    type: text
    regex: '"WU"\+\(.{0,160}"cr"\)\+\(.{0,160}"ip"\)\+\(.{0,160}"t:"\)'
- id: sharded-respon-name-fragment
  desc: Sharded ResponseBody property fragments
  crit: notable
  conf: 0.93
  size_max: 50000
  if:
    type: text
    regex: '"R"\+\(.{0,160}"es"\)\+"pon"\+\w+'
- id: comma-savetofile-name-fragment
  desc: Comma-sharded SaveToFile method name
  crit: notable
  conf: 0.92
  size_max: 50000
  if:
    type: text
    regex: '"sav"\+"eT"\+"oF"\+\(.{0,160}"ile"\)'
- id: temp-exe-comma-shard
  desc: Comma-sharded TEMP executable path
  crit: notable
  conf: 0.92
  size_max: 50000
  if:
    type: text
    regex: '"%"\+"TE"\+\(.{0,160}"MP%"\).{0,160}"\."\+"exe"'
composite_rules:
- id: comma-sharded-wsh-com-name-clues
  desc: Comma-sharded WSH COM names
  crit: notable
  all:
  - id: comma-activex-replace-shard
  - id: comma-xmlhttp-replace-shard
  - id: comma-wscript-replace-shard
- id: comma-sharded-wsh-temp-exe-acquisition
  desc: Comma-sharded WSH stages temp executable
  crit: hostile
  conf: 0.97
  attack: T1059.007, T1105, T1027
  all:
  - id: comma-sharded-wsh-com-name-clues
  - id: sharded-respon-name-fragment
  - id: comma-savetofile-name-fragment
  - id: temp-exe-comma-shard
