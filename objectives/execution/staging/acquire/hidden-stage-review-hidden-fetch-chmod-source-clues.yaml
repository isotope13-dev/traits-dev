defaults:
  for: [scripts, manifests, html, xml, dockerfile, package-lock.json, groovy]
  platforms: [linux, macos, windows]

composite_rules:
- id: hidden-fetch-chmod-source-clues
  desc: C source has hidden fetch and chmod clues
  crit: suspicious
  conf: 0.96
  for:
    - c
    - cpp
  near_lines: 20
  all:
    - id: micro-behaviors/communications/http/download/cli/curl-wget::hidden-output-download-context
    - id: micro-behaviors/fs/chmod/executable/hidden::chmod-hidden-path-source
