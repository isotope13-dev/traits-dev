defaults:
  platforms: [windows]
  for: [javascript, typescript]
composite_rules:
  - id: hidden-powershell-temp-cmd-clues
    desc: Hidden PowerShell and temp CMD download clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/script-host::powershell-exe-spawn
      - id: micro-behaviors/process/create/hidden::argv-array-windowstyle-hidden
      - id: micro-behaviors/communications/http/download/handler::powershell-iwr-temp-cmd-text
    any:
      - id: metadata/file/profile/command-options::node-windowshide-true-option
      - id: micro-behaviors/process/fd/stdio::child-stdio-ignore-option
      - id: micro-behaviors/communications/http/services/file-hosting::catbox-moe
  - id: objectives/execution/staging/acquire::windows-temp-cmd-dropper-chain
    desc: Downloads and executes temporary CMD payload
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/execution/staging/acquire::hidden-powershell-temp-cmd-clues
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-spawn
      - id: micro-behaviors/process/argument/positional::windows-temp-cmd-argument-text
