defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
- id: retrieval-and-execution-clues
  desc: Data retrieval clues near execution
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/data/collection/retrieval::remote-or-image-data-clues
  any:
  - id: micro-behaviors/process/create/subprocess/launch::process-execution
  - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
  - id: micro-behaviors/process/interpreter/eval/python-builtins::eval-builtin
  - id: micro-behaviors/os/handler/open::os-startfile-call
  near_lines: 80
  downgrade:
    any:
    - id: metadata/path/directory::test-directory-component
    - id: well-known/lib/ai/scikit-learn
    - id: well-known/lib/platform/psutil
    - id: well-known/tool/development/testing/piglit
    - id: well-known/app/system/remotepower::documented-rmm-release-context
