defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  size_max: 5000000

composite_rules:
- id: python-github-blob-execution-clues
  size_min: 512
  size_max: 500000000
  desc: GitHub blob and execution-related clues
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/revision-control/git/read::github-api-blob-fetch
  any:
  - id: micro-behaviors/process/create/path-execution::python-safe-run-temp-argument
  - id: well-known/lib/ai/ultralytics::ultralytics-runner-reference
  - id: micro-behaviors/process/create/shell/reference::python-linux-platform-system-reference
  unless:
  - id: metadata/path/directory::test-directory-component
