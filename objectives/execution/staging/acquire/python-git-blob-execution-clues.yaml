defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  size_max: 5000000

composite_rules:
- id: python-github-blob-execution-clues
  size_min: 512
  size_max: 500000000
  desc: GitHub blob and execution-related clues
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/revision-control/git/read::github-api-blob-fetch
  any:
  - id: micro-behaviors/process/create/path-execution::python-safe-run-temp-argument
  - id: well-known/lib/ai/ultralytics::ultralytics-runner-reference
  - id: micro-behaviors/process/create/shell/reference::python-linux-platform-system-reference
  unless:
  - id: metadata/path/directory::test-directory-component
- id: python-github-blob-download-and-run
  desc: Python downloads a GitHub blob to temp and runs it
  crit: hostile
  conf: 0.96
  attack: T1105,T1059.006
  near_bytes: 1500
  all:
  - id: micro-behaviors/communications/http/download/helper::safe-download-import
  - id: micro-behaviors/revision-control/git/read::gitapi-param
  - id: micro-behaviors/process/create/path-execution::python-safe-run-temp-argument
