defaults:
  platforms: [windows]
  for: [pe]


composite_rules:
  - id: packed-pe-executable-url-clues
    desc: Packed PE and executable URL clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe
    any:
      - id: objectives/anti-static/pack/fsg::fsg-packed-pe
      - id: metadata/binary/section/ratio::pe-no-executable-sections
    unless:
      - id: metadata/signature/verified/developer/
