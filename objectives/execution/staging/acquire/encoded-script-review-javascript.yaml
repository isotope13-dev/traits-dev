defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1105
composite_rules:
- id: wsh-temp-exe-http-acquisition
  desc: WSH HTTP stages temp executable
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/client/xmlhttp::msxml-xmlhttp-progid-text
  - id: micro-behaviors/fs/write/stream::adodb-stream-progid
  - id: micro-behaviors/communications/http/client/response-body::wsh-response-body
  - id: micro-behaviors/fs/write/file/stream::wsh-save-to-file
  - id: micro-behaviors/fs/path/temp::any-temp-path
  - id: micro-behaviors/fs/path/extension::exe-name-or-extension
  - id: metadata/lang/source/syntax/control-flow::do-while-readystate-host-clues
  any:
  - id: micro-behaviors/os/env/read/variable::wsh-expand-environment-strings-call
  - id: metadata/lang/encoding/unicode-escape::expand-environment-strings-name

- id: wsh-comma-fragment-temp-exe-acquisition
  desc: WSH comma fragments stage temp executable
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/execution/interpreter/scripting/host::wscript-shell-comma-obfuscated
  - id: objectives/execution/interpreter/scripting/host::xmlhttp-comma-obfuscated
  - id: objectives/execution/interpreter/scripting/host::adodb-stream-comma-obfuscated
  - id: micro-behaviors/fs/write/file/stream::wsh-save-to-file
  - id: micro-behaviors/fs/path/temp::any-temp-path
  - id: micro-behaviors/fs/path/extension::exe-name-or-extension
  any:
  - id: micro-behaviors/os/env/read/variable::wsh-expand-environment-strings-call
  - id: metadata/lang/encoding/unicode-escape::expand-environment-strings-name

