defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  crit: hostile
  conf: 0.95
  for: [javascript, xml]

composite_rules:
- id: js-hex-xmlhttp-adodb-file-write
  desc: Hexadecimal JScript HTTP and stream file write
  crit: hostile
  conf: 0.97
  attack: T1059.007, T1105, T1027
  mbc: B0023, B0032
  platforms: [windows]
  for: [javascript]
  size_min: 512
  size_max: 20000
  all:
  - id: micro-behaviors/process/interpreter/scripting::jscript-cc-on
  - id: micro-behaviors/communications/http/client/xmlhttp::msxml-xmlhttp-progid-text
  - id: micro-behaviors/fs/write/file/stream::adodb-hex-stream-any
  - id: micro-behaviors/fs/write/file/stream::savetofile-hex-save-any
  - id: micro-behaviors/data/property/access::wscript-bracket-member-access
  any:
  - id: micro-behaviors/fs/write/file/stream::savetofile-hex-tofi-any
  - id: micro-behaviors/fs/write/file/stream::savetofile-hex-ofil-fragment
- id: js-obfuscated-responsebody-save
  for: [javascript]
  desc: Obfuscated WSH response body and file save
  platforms: [windows]
  attack: "T1059.007, T1105"
  all:
  - id: objectives/execution/interpreter/scripting/host::wscript-shell-obfuscated-dup
  - id: objectives/execution/interpreter/scripting/host::adodb-stream-obfuscated
  - id: micro-behaviors/communications/http/client/response-body::wsh-response-body
  - id: micro-behaviors/fs/write/file/stream::wsh-save-to-file
  any:
  - id: micro-behaviors/os/env/read/variable::wsh-expand-environment-strings-call
  - id: metadata/lang/encoding/unicode-escape::expand-environment-strings-name
  - id: micro-behaviors/data/control-flow/dispatch/named::wscript-shell-run-indirect
