defaults:
  platforms: [windows]
  for: [pyc]
  attack: T1105,T1204.002

traits:
  - id: pyc-requests-identifier
    desc: Bytecode references requests module
    crit: notable
    if:
      type: symbol
      kind: identifier
      exact: requests
  - id: pyc-get-identifier
    desc: Bytecode references get
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: get
  - id: pyc-write-identifier
    desc: Bytecode references write
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: write
  - id: pyc-startfile-identifier
    desc: Bytecode references startfile
    crit: notable
    if:
      type: symbol
      kind: identifier
      exact: startfile
  - id: pyc-exe-url
    desc: Bytecode embeds an executable URL
    crit: notable
    if:
      type: text
      regex: 'https?://[^\s"'']{1,150}\.exe'

composite_rules:
  - id: pyc-http-exe-download-launch
    desc: Bytecode references executable download and launch
    crit: suspicious
    conf: 0.93
    size_max: 8192
    all:
      - id: pyc-requests-identifier
      - id: pyc-get-identifier
      - id: pyc-write-identifier
      - id: pyc-startfile-identifier
      - id: pyc-exe-url
