defaults:
  platforms: [windows]
  for: [pe]


composite_rules:
  - id: go-pe-executable-url-ip-exec-clues
    desc: Go PE executable URL, IP and exec clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/url::cleartext-executable-url-reference-pe
      - id: metadata/binary/symbols/name/process::go-os-exec-package-reference
    any:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
      - id: micro-behaviors/communications/ip/literal::http-ip-url-text
    needs: 1
    unless:
      - id: metadata/signature/verified/
