defaults:
  platforms: [unix, windows]
  for: [data]

composite_rules:
  - id: swf-version-identifier-stage-clues
    desc: Flash version identifier with remote stage clues
    crit: suspicious
    conf: 0.9
    # Host-agnostic tripwire beside the packed profile: a Flash movie that
    # names a flashVersion local while carrying a remote URL and an SWF stage
    # name. The identifier alone does not prove the $version read (a renamed
    # local defeats it), so this stays suspicious; the hostile composites
    # require the version query plus the movie-load operation itself.
    all:
      - id: metadata/file/format/swf::swf-movie-header
      - id: micro-behaviors/os/sysinfo/platform/version::flash-version-identifier
      - id: micro-behaviors/communications/url/reference::swf-http-url
      - id: micro-behaviors/fs/path/document::swf-movie-filename
