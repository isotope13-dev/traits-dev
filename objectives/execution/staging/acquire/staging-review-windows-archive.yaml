composite_rules:
- platforms:
  - windows
  for:
  - batch
  attack: T1105,T1059.003
  id: batch-curl-ip-tar-appdata-clues
  desc: Batch curl, public IP and AppData tar clues
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/download/curl::batch-curl-output-flag
  - id: micro-behaviors/data/archive/extract/tar::tar-extract
  - id: micro-behaviors/fs/path/app-data/platform::windows-appdata-directory-path
  - id: micro-behaviors/communications/ip/literal::batch-public-ip-literal
  any:
  - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
  - id: metadata/lang/source/syntax/command/control::start-empty-window-title
  - id: micro-behaviors/process/create/path-execution::start-quoted-executable-command
