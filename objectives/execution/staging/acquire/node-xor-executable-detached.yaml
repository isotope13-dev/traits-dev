defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: node-xor-exe-detached-clues
    desc: XOR, executable path and detached option clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: micro-behaviors/data/decode/xor::node-xor-executable-decode-clues
      - id: metadata/file/profile/command-options::detached-true
    any:
      - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file-text

