defaults:
  for: [scripts, manifests, html, xml, dockerfile, package-lock.json, groovy]
  platforms: [linux, macos, windows]

composite_rules:
- id: dockerfile-hidden-fetch-chmod-clues
  desc: Dockerfile hidden fetch and chmod clues
  crit: suspicious
  conf: 0.97
  for:
    - dockerfile
  near_lines: 20
  all:
    - id: micro-behaviors/communications/http/download/shell::dockerfile-fetch-hidden-tmp-clues
    - id: micro-behaviors/fs/chmod/executable/hidden::dockerfile-chmod-hidden-temp-executable
