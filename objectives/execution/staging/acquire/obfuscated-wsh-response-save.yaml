defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
composite_rules:
  - id: wsh-obfuscated-response-save
    desc: Obfuscated WSH response and file save
    crit: hostile
    conf: 0.95
    attack: T1105
    mbc: B0024
    for:
      - javascript
    all:
      - id: objectives/execution/interpreter/script/wsh::wsh-or-activex-creation-clues
      - id: micro-behaviors/communications/http/client/response-body::wsh-response-body
      - id: micro-behaviors/fs/write/file/stream::wsh-save-to-file
      - id: objectives/anti-static/obfuscation/string/conceal::js-string-transformation-clues
    unless:
      - id: metadata/build/scaffold::windows-wget-js-bootstrap-helper
    downgrade:
      any:
        - id: well-known/app/productivity/winmerge::winmerge-bundled-plugin-script
