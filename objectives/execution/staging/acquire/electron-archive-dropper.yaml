# Node archive dropper: an HTTP-downloaded payload is decrypted with a local
# helper, extracted from a ZIP archive, and every collected executable is
# launched detached. Each leg alone is ordinary plumbing (updaters fetch and
# unpack archives); the required combination -- remote fetch plus local
# decrypt plus archive extraction plus executable walk plus detached launch --
# is the dropper chain. Legs are referenced, not redefined, so directory
# selectors keep their existing membership.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: hostile
  conf: 0.97
  attack: T1105, T1027
  mbc: B0032

composite_rules:
  - id: node-decrypted-archive-exe-dropper
    desc: Decrypted download extracted and executables launched detached
    all:
      - id: micro-behaviors/communications/http/request/client::http-client-usage
      - id: micro-behaviors/data/archive/extract/zip::js-zip-extract-all-to
      - id: micro-behaviors/fs/directory/readdir/language::node-extname-exe-walk
      - id: micro-behaviors/process/daemonize/detach::detached-true
    any:
      - id: metadata/import/module::local-decrypt-helper-import
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::js-decrypt-helper-call
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::javascript-decrypt-method-call
