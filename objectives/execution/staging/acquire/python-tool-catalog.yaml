# A Python menu catalog that clones third-party tooling whose own printed
# purpose is attack-only: building backdoor payloads that bypass antivirus,
# generating webcam-spy payloads that report to an attacker, or remote
# access trojans. The purpose wording is the catalog's description of the
# tool it deploys, so renamed repositories and reworded banners that keep
# the stated purpose still match; a plain clone of a legitimate tool lacks
# every purpose leg.
defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: python-catalog-payload-builder-deployment
    desc: Python clones AV-bypass or webcam-spy payload tooling
    crit: hostile
    conf: 0.93
    attack: T1588.002,T1059.006
    all:
      - id: micro-behaviors/revision-control/git/transfer::git-clone-command
    any:
      - id: metadata/lang/natural/phrasing/security::av-bypass-payload-claim
      - id: metadata/lang/natural/phrasing/security::webcam-to-attacker-claim
    unless:
      - id: metadata/lang/source/shape::python-literal-module-quoted-source

  - id: python-catalog-rat-deployment
    desc: Python clones self-described remote-access-trojan tooling
    crit: hostile
    conf: 0.93
    attack: T1588.002,T1219
    all:
      - id: micro-behaviors/revision-control/git/transfer::git-clone-command
      - id: metadata/lang/natural/vocabulary/remote-access::rat-tool-claim
    unless:
      - id: metadata/lang/source/shape::python-literal-module-quoted-source
