defaults:
  crit: hostile
  platforms: [windows]
  for: [batch]
  attack: T1105,T1059.001
  mbc: B0030


composite_rules:
  - id: batch-curl-ip-temp-download
    desc: Batch curl download to TEMP from an IP URL
    conf: 0.98
    near_lines: 1
    all:
      - id: micro-behaviors/communications/http/curl/command::batch-curl-call
      - id: micro-behaviors/communications/http/download/curl::batch-curl-output-temp
      - id: micro-behaviors/communications/http/curl/command::batch-curl-http-url
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/os/env/path::temp-env-var
