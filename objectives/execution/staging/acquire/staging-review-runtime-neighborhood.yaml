composite_rules:
- platforms:
  - windows
  for:
  - pe
  - dll
  id: xor-python-url-user-process-clues
  desc: XOR Python URL, user path and process clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/download/helper::xor16-official-python-release-url
  - id: micro-behaviors/fs/path/application/interpreter::xor16-python-executable-name
  - id: micro-behaviors/os/env/reference::xor16-localappdata-name
  - id: metadata/binary/symbols/name/process::create-process-w
  unless:
  - id: metadata/installer/product/
