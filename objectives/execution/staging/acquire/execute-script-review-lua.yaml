defaults:
  platforms: [unix, openwrt]
  for: [lua]
  attack: T1105
  mbc: E1105


composite_rules:
  - id: lua-wget-payload-staging
    desc: Lua wget with payload and staging clues
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/download/wget::wget-output-document-option
      - id: micro-behaviors/fs/path/reference::lua-payload-or-inject-filename
    any:
      - id: micro-behaviors/fs/path/hidden::hidden-dir-literal
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-make-executable
      - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
      - id: micro-behaviors/metaprogramming/generation/function::lua-dynamic-load
      - id: micro-behaviors/dylib/load/runtime::lua-package-loadlib
    needs: 2
