defaults:
  platforms: [windows]
  for: [text, batch]
  size_max: 4096
  attack: T1105
  mbc: B0024
composite_rules:
  # A complete throwaway FTP stager script: it opens an unattributed external
  # IPv4 on an explicit nonstandard port, logs in with dummy one-line
  # credentials, retrieves a program file, and closes the session. Each leg
  # alone is neutral transfer evidence (a short login is not necessarily
  # throwaway, an explicit port does not alone establish a raw endpoint), but
  # the five-way conjunction in one small script has no legitimate automation
  # use: real FTP automation names a host, uses the service port, and presents
  # service credentials. Retrieving documents, staging from a named or
  # private host, or authenticating without the dummy login stays with the
  # neutral transfer composites. This rule does not claim the plant executes
  # or persists, only that the script acquires it from the throwaway source.
  - id: ftp-throwaway-login-external-port-exe-fetch
    desc: Throwaway-login FTP fetch of remote executable
    crit: hostile
    conf: 0.97
    near_lines: 12
    all:
      - id: micro-behaviors/communications/ftp/client::ftp-script-external-executable-fetch
      - id: micro-behaviors/communications/ftp/client::ftp-explicit-port-short-login-fetch
      - id: micro-behaviors/communications/ftp/client::ftp-script-session-terminator
