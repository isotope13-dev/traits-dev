# URL and command clues suggest acquisition; linkage is not established.
defaults:
  platforms:
  - windows
  for:
  - batch
composite_rules:
- id: batch-exe-dll-url-temp-background
  desc: EXE/DLL URLs with curl, temp and background
  crit: suspicious
  conf: 0.95
  attack: T1105
  all:
  - id: micro-behaviors/communications/http/download/url::batch-assigned-exe-http-url
  - id: micro-behaviors/communications/http/download/url::batch-assigned-dll-http-url
  - id: micro-behaviors/communications/http/download/curl::batch-curl-output-flag
  - id: micro-behaviors/fs/path/temp::windows-temp-path
  - id: micro-behaviors/process/daemonize/background::batch-background-variable-command
