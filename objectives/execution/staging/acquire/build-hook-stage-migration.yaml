defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
  attack: T1195.002
composite_rules:
- id: python-setup-encoded-dropper
  desc: Setup hook decoded fetch and launch clues
  crit: hostile
  conf: 0.98
  for:
  - python
  platforms:
  - unix
  scope: file
  all:
  - id: metadata/build/pip::setup-py
  - id: metadata/build/pip::packaging-setuptools-import
  - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
  - id: micro-behaviors/communications/http/curl/command::decoded-curl-command
  - id: micro-behaviors/process/create/path-execution::decoded-relative-command-text
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
- id: setup-py-encrypted-build-hook-fetch
  desc: setup.py build hook decrypts and fetches a remote payload
  crit: hostile
  conf: 0.99
  for:
  - python
  scope: file
  attack: T1195.002,T1027,T1105
  all:
  - id: metadata/build/pip::setup-py
  - id: metadata/build/package/recipe/setup-hooks::setuptools-build-py-run-override
  - id: metadata/build/package/recipe/setup-hooks::run-override-calls-helper-after-super
  - id: micro-behaviors/crypto/symmetric/aes/reference::aesgcm-name-reference
  - id: micro-behaviors/crypto/decrypt/transform/unspecified::python-decrypt-method-call
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
  unless:
  - id: metadata/path/directory::test-directory-component
- id: rust-build-rs-hostname-unverified-remote-payload-stage
  desc: Unverified HTTP and temporary path clues
  crit: suspicious
  conf: 0.98
  for:
  - rust
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  - id: micro-behaviors/communications/http/download/handler::rust-http-response-materialized
  - id: micro-behaviors/fs/path/temp::rust-temp-path
  - id: micro-behaviors/communications/socket/ssl::rustls-no-hostname-verification
