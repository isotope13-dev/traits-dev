defaults:
  for: [powershell]
  platforms: [windows]
composite_rules:
  - id: powershell-encoded-python-token-clues
    desc: Encoded portable Python and code.py clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/lang/encoding/base64::base64-utf16-python-embed-version-token
      - id: metadata/lang/encoding/base64::base64-utf16-code-py-token
      - id: metadata/lang/encoding/base64::base64-utf16-pythonw-token
    any:
      - id: metadata/lang/encoding/base64::base64-utf16-webrequest-uri-token
      - id: metadata/lang/encoding/base64::base64-utf16-gettemppath-token
      - id: metadata/file/line::powershell-long-line
    needs: 2
  - id: powershell-encoded-python-webrequest-clues
    desc: Encoded Python and web request token clues
    crit: suspicious
    conf: 0.99
    all:
      - id: objectives/execution/staging/acquire::powershell-encoded-python-token-clues
      - id: metadata/lang/encoding/base64::base64-utf16-webrequest-uri-token
    any:
      - id: metadata/lang/encoding/base64::base64-utf16-gettemppath-token
      - id: metadata/file/line::powershell-long-line
      - id: metadata/file/line::single-long-line-outlier
    needs: 2
