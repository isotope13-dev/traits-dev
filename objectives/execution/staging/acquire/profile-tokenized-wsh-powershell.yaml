defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
composite_rules:
  - id: tokenized-wsh-powershell-ps1-profile
    for: [javascript, vbs]
    desc: Tokenized WSH PowerShell and PS1 clues
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/lang/source/literal/fragment/single::quoted-powersh-fragment
      - id: metadata/lang/source/literal/fragment/single::quoted-ell-exe-fragment
      - id: metadata/lang/source/syntax/command/options::quoted-nop-token
      - id: metadata/lang/source/syntax/command/options::quoted-ep-token
      - id: metadata/lang/source/syntax/command/options::quoted-bypass-token
      - id: metadata/lang/source/syntax/command/options::quoted-file-token
      - id: micro-behaviors/os/com/instantiation::activex-constructor-call
      - id: micro-behaviors/fs/path/extension::ps1
    any:
      - id: metadata/lang/source/literal/fragment/single::quoted-msxml2-prefix
      - id: metadata/lang/source/literal/fragment/single::quoted-xmlhttp-token
      - id: micro-behaviors/communications/url/host/tld-http::tld-xyz
    needs: 2
  - id: tokenized-wsh-powershell-http-profile
    for: [javascript, vbs]
    desc: Tokenized WSH PowerShell and HTTP clues
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/lang/source/literal/fragment/single::quoted-powersh-fragment
      - id: metadata/lang/source/literal/fragment/single::quoted-ell-exe-fragment
      - id: metadata/lang/source/syntax/command/options::quoted-nop-token
      - id: metadata/lang/source/syntax/command/options::quoted-ep-token
      - id: metadata/lang/source/syntax/command/options::quoted-bypass-token
      - id: metadata/lang/source/syntax/command/options::quoted-file-token
      - id: micro-behaviors/os/com/instantiation::activex-constructor-call
      - id: micro-behaviors/fs/path/extension::ps1
    any:
      - id: micro-behaviors/communications/url/reference::http-ps1-url-reference
      - id: well-known/lib/platform/msxml::msxml2-xml-progid-prefix
      - id: micro-behaviors/communications/url/encoded::encoded-http-url
      - id: micro-behaviors/communications/http/message::http-prefix
    needs: 2
