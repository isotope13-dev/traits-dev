defaults:
  platforms: [linux, windows, macos]
  for: [python]
  attack: T1105,T1195.002

composite_rules:
  - id: python-import-triggers-xmrig-release-fetch
    desc: Import triggers XMRig release archive request
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: well-known/app/finance/xmrig::xmrig-product
      - id: micro-behaviors/communications/http/download/release::xmrig-release-download-url
      - id: micro-behaviors/communications/http/request/url::python-column0-requests-get
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
