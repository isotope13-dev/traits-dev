defaults:
  platforms: [windows]
  for: [html, javascript, vbs]
  attack: T1105
  mbc: B0024
composite_rules:
  - id: encoded-vbscript-hidden-ftp-script
    desc: Encoded VBScript runs hidden FTP script
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/anti-static/obfuscation/syntax::html-vbscript-encode-payload
      - id: micro-behaviors/communications/ftp/client::windows-ftp-script-command
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
      - id: micro-behaviors/data/control-flow/dispatch/run::run-zero-style-argument
