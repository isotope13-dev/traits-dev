---
defaults:
  platforms:
  - windows
  for:
  - pe
  crit: suspicious
composite_rules:
- id: admin-resource-entry-protection-api-clues
  desc: Admin resource entry and protection API clues
  conf: 0.96
  all:
  - id: metadata/build/manifest::pe-requires-admin
  - id: metadata/binary/section/permission::executable-rsrc-section
  - id: metadata/binary/section/header::pe-entry-in-writable-section
  - id: metadata/binary/symbols/count::imported-functions-under-10
  - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
  any:
  - id: micro-behaviors/dylib/load/runtime::load-library-a
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  unless:
  - id: metadata/signature/verified/developer/
  - id: metadata/binary/section/label/packing::upx-section
- id: native-resource-allocation-shape-clues
  desc: Native resource and allocation-pattern clues
  conf: 0.97
  all:
  - id: micro-behaviors/data/embedded/payload/resource::native-resource-api-resolution
  - id: metadata/binary/instruction/sequence/unspecified::allocation-like-argument-patterns
  - id: metadata/signature/absent::unsigned
  any:
  - id: metadata/binary/resource/size::oversized-rsrc
  - id: metadata/binary/section/entropy::large-near-constant-rsrc-section
  - id: metadata/file/entropy::high-overall-entropy-70
  - id: metadata/binary/header/malformed::malformed-pe-structure
  needs: 2
  unless:
  - id: metadata/installer/product/
  - id: metadata/filename/name-form::is-microsoft-named
- id: resource-allocation-pattern-entropy-clues
  desc: Resource API, allocation and entropy clues
  conf: 0.96
  all:
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: metadata/binary/instruction/sequence/unspecified::allocation-like-argument-patterns
  - id: metadata/signature/absent::unsigned
  any:
  - id: metadata/file/entropy::high-overall-entropy-70
  - id: metadata/binary/header/malformed::malformed-pe-structure
  - id: metadata/binary/section/entropy::large-near-constant-rsrc-section
  - id: metadata/binary/resource/size::oversized-low-entropy-rsrc
  needs: 3
  unless:
  - id: metadata/filename/name-form::is-microsoft-named
- id: mfc-resource-allocation-shape-clues
  desc: MFC resource and allocation-pattern clues
  conf: 0.93
  all:
  - id: metadata/binary/provenance/version-fields::pe-mfc-template-description
  - id: micro-behaviors/data/embedded/payload/resource::native-resource-api-resolution
  - id: metadata/binary/instruction/sequence/unspecified::allocation-like-argument-patterns
  any:
  - id: metadata/binary/header/malformed::malformed-pe-structure
  - id: metadata/binary/section/entropy::large-near-constant-rsrc-section
  - id: metadata/signature/absent::unsigned
  needs: 2
  unless:
  - id: metadata/installer/product/
- id: unsigned-mfc-resource-protection-api-clues
  desc: Unsigned MFC resource and protection API clues
  conf: 0.94
  all:
  - id: metadata/binary/provenance/version-fields::pe-mfc-template-description
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: metadata/signature/absent::unsigned
  - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
  any:
  - id: micro-behaviors/data/embedded/payload/resource::native-resource-api-resolution
  - id: micro-behaviors/data/embedded/payload/resource::fragmented-native-resource-resolution
  needs: 1
  unless:
  - id: metadata/installer/product/
- id: resource-wmi-com-api-clues
  desc: Resource and WMI COM API clues
  conf: 0.96
  unless:
  - id: metadata/installer/product/
  - id: well-known/app/system/iobit::iobit-signed-component-context
  - id: micro-behaviors/communications/url/host/name::cpuz-binary
  all:
  - id: micro-behaviors/data/embedded/payload/resource::find-resource-a
  - id: micro-behaviors/data/embedded/payload/resource::load-resource
  - id: micro-behaviors/data/embedded/payload/resource::lock-resource
  - id: micro-behaviors/data/embedded/payload/resource::sizeof-resource
  - id: micro-behaviors/os/com/invoke::wmi-com-proxy-setup
  any:
  - id: metadata/binary/resource/entropy::major-high-entropy-rsrc-section
  - id: metadata/binary/resource/entropy::high-entropy-rsrc
  - id: objectives/discovery/system/fingerprint/hardware::wmi-host-profile-queries
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-capability
  - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present-symbol
  needs: 2
