defaults:
  attack: T1105
  mbc: B0024
  platforms:
    - unix
    - windows
  for:
    - shell

composite_rules:
  - id: android-ip-netcat-apk-temp
    desc: Android IP, netcat and APK temp-write clues
    crit: hostile
    conf: 0.99
    attack: "T1105, T1059.004"
    platforms: [unix, android]
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-literal
      - id: micro-behaviors/communications/socket/netcat::wrapped-nc
      - id: micro-behaviors/fs/write/file/shell::android-dd-apk-temp-output
      - id: micro-behaviors/fs/path/temp::android-local-tmp-path
