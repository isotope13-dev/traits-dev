defaults:
  platforms: [windows]
  for: [text, batch]
  size_max: 4096
  attack: T1105
  mbc: B0024
composite_rules:
  # An authenticated FTP command file that retrieves a remote program and
  # writes it into the Windows directory: the staged acquisition half of a
  # BAT.Ftp-style downloader. The open command names the remote source, the
  # credential lines supply the login without any account relationship, and
  # the get destination plants the executable where Windows loads system
  # files from. Retrieving documents, staging outside the Windows directory,
  # or authenticating without an executable plant stays with the neutral or
  # suspicious transfer composites. This rule does not claim the plant
  # executes or persists, only that the script stages it there.
  - id: ftp-authenticated-windows-exe-stage
    desc: Authenticated FTP fetch stages executable under Windows
    crit: hostile
    conf: 0.97
    near_lines: 12
    all:
      - id: micro-behaviors/communications/ftp/client::ftp-windows-dir-executable-fetch
      - id: micro-behaviors/communications/ftp/client::ftp-script-user-auth
