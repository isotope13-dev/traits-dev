defaults:
  platforms: [android, unix]
  for: [shell]

composite_rules:
- id: termux-github-raw-executable-install
  desc: Termux installer downloads GitHub raw executables
  crit: suspicious
  conf: 0.98
  all:
  - id: well-known/app/development/code-forge/github::shell-raw-github-base-url
  - id: micro-behaviors/communications/http/download/curl::curl-output-file
  - id: micro-behaviors/fs/chmod/executable/mode::termux-chmod-bin-variable
  - id: micro-behaviors/fs/path/application/prefix::termux-usr-prefix
  - id: metadata/lang/source/literal/string/fragment::termux-short-command-list
  any:
  - id: metadata/lang/source/literal/string/fragment::termux-lfs-command-list
  - id: well-known/app/development/code-forge/github::raw-githubusercontent-any
  - id: micro-behaviors/communications/http/curl/command::curl-silent-or-fail
