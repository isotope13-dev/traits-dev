defaults:
  platforms: [unix, windows]
  for: [media, scripts]

composite_rules:
- id: cloud-image-pe-lolbin-clues
  for:
    - scripts
    - '!applescript'
    - '!jcl'
    - '!shell'
  desc: Cloud image PE and LOLBin clues
  crit: suspicious
  conf: 0.96
  all:
    - id: objectives/execution/staging/acquire::cloud-storage-reversed-pe-header-clues
    - id: metadata/file/encoding/shape::base64-pe-script-carrier
  any:
    - id: micro-behaviors/os/application/target/development::mshta-name-reference
    - id: micro-behaviors/process/create/exec::mshta-powershell-call
    - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
