defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  arch:
  - x86
  attack: T1095,T1105,T1620
  mbc: B0032.014
composite_rules:
- id: ror13-reverse-tcp-rwx-stager-x86
  desc: ROR13 TCP stager into RWX memory
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/anti-static/obfuscation/imports/api-hashing::ror13-peb-export-resolver-x86
  - id: micro-behaviors/communications/socket/init::ws2-32-stack-load-ror13-x86
  - id: micro-behaviors/communications/socket/connect/attempt::connect-ror13-hash-call
  - id: micro-behaviors/mem/alloc/virtual::virtualalloc-rwx-commit-ror13-x86
- id: ror13-reverse-tcp-rwx-stager-x64
  desc: x64 ROR13 TCP stager into RWX memory
  crit: hostile
  conf: 0.99
  arch:
  - x86-64
  all:
  - id: micro-behaviors/communications/socket/init::ws2-32-stack-load-ror13-x64
  - id: micro-behaviors/communications/socket/connect/attempt::connect-ror13-hash-call
  - id: micro-behaviors/communications/socket/receive::recv-ror13-hash-call-x64
  - id: micro-behaviors/mem/alloc/virtual::virtualalloc-rwx-commit-ror13-x64
- id: powershell-ror13-reverse-tcp-rwx-stager-x64
  desc: PowerShell executes a ROR13 reverse-TCP stage loader
  crit: hostile
  conf: 0.99
  for:
  - powershell
  arch:
  - all
  all:
  - id: objectives/execution/payload/memory-branch/shellcode::powershell-inprocess-shellcode-loader
  - id: micro-behaviors/communications/socket/init::ws2-32-byte-array-powershell-x64
  - id: micro-behaviors/communications/socket/connect/attempt::connect-ror13-hash-call-powershell-x64
  - id: micro-behaviors/communications/socket/receive::recv-ror13-hash-call-powershell-x64
