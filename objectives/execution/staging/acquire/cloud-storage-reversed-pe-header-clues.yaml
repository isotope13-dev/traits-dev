defaults:
  platforms: [unix, windows]
  for: [scripts, html]

composite_rules:
- id: aliyun-storage-reversed-pe-header-clues
  desc: Alibaba OSS URL and reversed PE header text
  crit: suspicious
  conf: 0.9
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/http/services/cloud::aliyun-oss-object-url
  - id: micro-behaviors/communications/url/reference::cloud-storage-endpoint-alternatives
  - id: micro-behaviors/data/encode/embedded::reversed-pe-base64-header
- id: cloud-storage-reversed-pe-header-clues
  desc: Cloud-storage URL and reversed PE header text
  crit: suspicious
  conf: 0.9
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/url/reference::cloud-storage-endpoint-alternatives
  - id: micro-behaviors/data/encode/embedded::reversed-pe-base64-header
