defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: multiarch-fallback-launch-cleanup
    desc: Multi-arch launch and variable deletion co-occur
    crit: notable
    conf: 0.99
    near_lines: 24
    all:
      - id: objectives/execution/staging/store::multiarch-fallback-launch-profile
      - id: micro-behaviors/fs/delete/file/command::rm-force-variable-target
    unless:
      - id: metadata/build/autotools::autoconf-generated-script
      - id: micro-behaviors/os/package-manager/installer-script::installer-script
      - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context
      - id: micro-behaviors/crypto/hash/file::sha512-pinned-download-context
      - id: metadata/path/directory::test-directory-component

  # Each leg is independent: the multi-arch fallback launch with variable
  # cleanup, an EXIT trap, and a raw external IPv4 endpoint. The legs sit far
  # apart in a dropper, so no proximity bound is applied. Installers that clean
  # up after themselves lack the external endpoint.
  - id: multiarch-staged-binary-exit-cleanup
    desc: Multi-arch raw-IP staged binary removed by EXIT trap
    crit: hostile
    conf: 0.97
    attack: T1070.004,T1105
    all:
      - id: objectives/execution/staging/store::multiarch-fallback-launch-cleanup
      - id: micro-behaviors/process/exit/handler::shell-quoted-exit-trap
      - id: micro-behaviors/communications/ip/literal::shell-external-ipv4-reference
    unless:
      - id: metadata/build/autotools::autoconf-generated-script
      - id: micro-behaviors/os/package-manager/installer-script::installer-script
