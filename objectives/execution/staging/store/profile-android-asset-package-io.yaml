composite_rules:
- platforms:
  - android
  for:
  - android_apk
  - dex
  id: apk-pak-xor-stream-package-clues
  desc: APK PAK asset, XOR and package-I/O clues
  crit: suspicious
  conf: 0.995
  scope: outer
  all:
  - id: metadata/package/files/android-assets::apk-pak-asset-member
  - id: micro-behaviors/data/decode/xor/feedback::dalvik-lcg-byte-xor-decode-loop
  - id: micro-behaviors/data/embedded/resource::dalvik-asset-manager-class
  - id: micro-behaviors/fs/write/file/stream::dalvik-file-output-stream-class
  - id: micro-behaviors/os/package-manager/management::android-package-archive-inspection
