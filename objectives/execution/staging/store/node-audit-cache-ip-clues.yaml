defaults:
  platforms: [unix, windows]

composite_rules:
  - id: node-ip-php-audit-cache-clues
    desc: Node IP PHP URL and audit cache write clues
    crit: suspicious
    conf: 0.98
    for: [javascript]
    all:
      - id: micro-behaviors/communications/url/resource-path/file::url-ip-php-endpoint-script
      - id: micro-behaviors/communications/tls/verify/disable::node-tls-verification-env-disable
      - id: micro-behaviors/fs/write/file/full/unspecified::write-file-sync
      - id: micro-behaviors/fs/path/cache::audit-cache-path
