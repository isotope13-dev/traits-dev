defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: setup-executable-script-write
  desc: Setup writes an executable or script
  crit: suspicious
  conf: 0.85
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/fs/write/file/handle/unspecified::py-inline-write-executable-path
  any:
  - id: micro-behaviors/process/create/subprocess/launch::python-command-exec-any
  - id: micro-behaviors/communications/http/request/client::request-python
  unless:
  - id: well-known/app/infrastructure/amazon-web-services/aws-elasticbeanstalk::awsebcli-source-tree
  - id: metadata/build/pip::setuptools-package-index
  downgrade:
    any:
    - id: metadata/package/testing/presence/harness::unittest-module
