defaults:
  platforms: [android]
  for: [apk, zip]
  crit: suspicious
  conf: 0.95

composite_rules:
- id: android-native-entropy-file-write-chmod-clues
  for: [android_apk, zip, elf]
  desc: Short JNI exports, file-write and chmod references with high entropy
  crit: suspicious
  conf: 0.995
  all:
  - id: objectives/execution/staging/store::jni-export-file-api-clues
  - id: metadata/binary/layout/entropy::elf-high-entropy-data-large-or-string-sparse

