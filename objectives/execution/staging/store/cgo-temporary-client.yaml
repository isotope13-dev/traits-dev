defaults:
  platforms:
    - linux
  for:
    - go
    - zip
    - go_module
    - shell
    - elf
    - data
    - text
    - source
composite_rules:
  - id: cgo-temporary-client-stage
    desc: cgo sysroot and temporary client staging
    crit: suspicious
    conf: 0.97
    scope: archive
    all:
      - id: metadata/build/compiler::gcc-self-spec-wrapper-directive
      - id: micro-behaviors/dylib/load/ffi::go-cgo-sysroot-linker-flag
      - id: micro-behaviors/fs/write/copy::shell-relative-client-copy-to-tmp
      - id: micro-behaviors/fs/chmod/executable/mode::shell-tmp-client-mode-700
      - id: metadata/lang/source/syntax/command/launch::shell-tmp-client-command-options
  - id: cgo-temporary-client-binary-stage
    desc: cgo sysroot wrapper staging bundled HTTP tasking client binary
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: cgo-temporary-client-stage
      - id: metadata/binary/symbols/name/qualified/network::go-http-task-shell-routine-indicators
