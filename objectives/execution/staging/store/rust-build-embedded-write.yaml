defaults:
  platforms: [unix, windows]
  for: [rust]
composite_rules:
  - id: build-rs-embedded-write-command-clues
    desc: Build script embedded bytes, write and command
    crit: suspicious
    conf: 0.95
    scope: file
    all:
      - id: metadata/build/ecosystem::cargo-build-script-basename
      - id: metadata/lang/source/syntax/directive::rust-include-bytes
      - id: micro-behaviors/fs/write/file/full/unspecified::fs-write
      - id: metadata/lang/source/syntax/argument::rust-indirect-command-new
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::set-permissions-call
      - id: micro-behaviors/os/sysinfo/directories::rust-temp-dir
      - id: micro-behaviors/process/daemonize/spawn::rust-spawn-detached-unix
      - id: micro-behaviors/process/config/launch::rust-detached-process-call
      - id: micro-behaviors/process/config/launch::rust-create-no-window-call
    needs: 2

