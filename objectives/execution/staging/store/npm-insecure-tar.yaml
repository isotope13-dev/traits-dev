defaults:
  platforms: [windows, linux]
  for: [npm, tar]

composite_rules:
  # The HTTPS download, TLS-off, raw-IP URL and 0755 chmod legs must sit in
  # one Node script. Archive pooling joined a database client's TLS option, a
  # docs URL and an unrelated chmod across a monorepo (ruflo, 2026-11).
  # tar-extract is shell-typed, so it stays an archive-level leg.
  - id: insecure-node-download-and-chmod
    desc: Node script downloads from raw IP and chmods executable
    crit: component
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: micro-behaviors/communications/tls/verify/disable::reject-unauthorized-false
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755

  - id: npm-postinstall-insecure-tar-native-loader
    desc: npm postinstall insecure tar download and mode clues
    crit: suspicious
    conf: 0.99
    scope: archive
    attack: "T1105"
    for: [binaries, '!dex', scripts, '!jcl', npm, package.json, tar, text, xml, javascript, typescript]
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: insecure-node-download-and-chmod
      - id: micro-behaviors/data/archive/extract/tar::tar-extract
