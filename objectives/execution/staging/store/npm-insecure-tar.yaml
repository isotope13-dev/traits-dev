defaults:
  platforms: [windows, linux]
  for: [npm, tar]

composite_rules:
  - id: npm-postinstall-insecure-tar-native-loader
    desc: npm postinstall insecure tar download and mode clues
    crit: suspicious
    conf: 0.99
    scope: archive
    attack: "T1105"
    for: [binaries, '!dex', scripts, '!jcl', npm, package.json, tar, text, xml]
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: micro-behaviors/communications/tls/verify/disable::reject-unauthorized-false
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/data/archive/extract/tar::tar-extract
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
