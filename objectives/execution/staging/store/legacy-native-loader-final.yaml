composite_rules:
- id: userprofile-directory-file-write-clues
  desc: User-profile directory and file-write staging clues
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/os/env/path::userprofile-var
  - id: micro-behaviors/fs/directory/create::create-directory-a
  - id: micro-behaviors/fs/file/open/unspecified::file-create-win
  - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
  any:
  - id: objectives/anti-analysis/self-modify/runtime::xor-modulo-key-loop-x64
  - id: micro-behaviors/data/bitwise/xor-forms/indexed::native-byte-xor-loop
  - id: metadata/binary/section/ratio::large-data-section
  - id: metadata/binary/section/ratio::data-section-1p5x-code
  - id: micro-behaviors/dylib/load/runtime::load-library-ex-w
  - id: micro-behaviors/dylib/lookup::get-proc-address
  needs: 2
  downgrade:
    any:
    - id: metadata/filename/name-form::is-microsoft-named
    - id: metadata/filename/brand::is-windows-named
    - id: metadata/binary/resource/identity::pe-version-resource
    - id: metadata/lang/compiler/native/
    - id: metadata/binary/debug::pe-dwarf-debug-section
  for:
  - pe
  - dll
  platforms:
  - windows
