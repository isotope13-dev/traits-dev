defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: dotnet-resource-temp-launch-clues
    desc: Managed TEMP launch near resource write
    crit: suspicious
    conf: 0.94
    near_bytes: 32768
    all:
      - id: metadata/lang/compiler/managed::dotnet-metadata
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: micro-behaviors/data/embedded/resource::dotnet-resource-reader-access
      - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
      - id: micro-behaviors/fs/temp/file::gettempfilename-api-name
      - id: micro-behaviors/process/config/launch::dotnet-start-name-config-references
    unless:
      - id: metadata/signature/verified/platform::microsoft
      - id: well-known/app/system/bible-converter/
