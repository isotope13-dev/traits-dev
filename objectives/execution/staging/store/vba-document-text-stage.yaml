# The open event saves the document body as plain text (carrying an encoded
# payload hidden in the document), starts a process on it and deletes the
# staged files afterwards.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027,T1106,T1070.004

composite_rules:
  - id: vba-document-text-staged-then-run
    desc: Stages document text, runs, then deletes
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/os/application/hook/event::vba-auto-open-sub-decl
      - id: micro-behaviors/fs/write/file/target::vba-document-saveas-plain-text
      - id: micro-behaviors/process/create/exec::create-process-api-name
      - id: micro-behaviors/fs/delete/file/command::vb6-kill-file-source
