defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  # A managed image that ships a high-entropy resource and an AES decryptor,
  # and writes byte arrays to environment-rooted paths that nest system
  # directory names, stages a payload under a fake system location. IL
  # virtualization can hide the call sites, so the legs are the metadata
  # and token evidence the same image still exposes.
  - id: managed-masquerade-drop-stage
    desc: Managed image stages decrypted bytes under fake system paths
    crit: hostile
    conf: 0.93
    attack: T1036.005,T1027
    all:
      - id: objectives/evasion/masquerade/path::env-rooted-nested-system-directory
      - id: metadata/binary/resource/entropy::clr-resource-high-entropy
      - id: micro-behaviors/crypto/symmetric/aes/reference::dotnet-rijndael
      - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
