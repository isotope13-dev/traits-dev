defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: python-custom-install-request-write-shell-clues
    desc: Custom setup HTTP, executable write and shell clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
      - id: micro-behaviors/communications/http/request/client::request-python
      - id: micro-behaviors/fs/write/file/handle/unspecified::py-inline-write-executable-path
      - id: micro-behaviors/process/create/shell/
