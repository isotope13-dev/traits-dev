defaults:
  platforms: [android]
  for: [elf]
  crit: suspicious
  conf: 0.88
composite_rules:
  - id: jni-export-file-api-clues
    desc: JNI export and file operation API clues
    conf: 0.97
    all:
      - id: metadata/binary/symbols/name/export::short-obfuscated-jni-exports
      - id: micro-behaviors/fs/file/open/unspecified::fopen
      - id: micro-behaviors/fs/write/file/descriptor::write
      - id: micro-behaviors/fs/chmod/modify::chmod-symbol

