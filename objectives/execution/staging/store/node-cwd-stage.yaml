defaults:
  platforms: [unix, windows]
composite_rules:
  - id: objectives/execution/staging/store::npm-lifecycle-stream-download-to-cwd
    desc: npm hook streams shell download to working dir
    crit: hostile
    conf: 0.98
    scope: archive
    for: [npm, package.json, javascript]
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: micro-behaviors/fs/directory/cwd::process-cwd-call
      - id: micro-behaviors/fs/path/script::shell-script-ref
