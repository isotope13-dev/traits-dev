composite_rules:
- platforms:
  - windows
  for:
  - vbs
  id: vbs-copyhere-read-write-run-clues
  desc: VBS CopyHere, file I/O and Run clues
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/data/archive/extract/capability::shell-copyhere-method-token
  - id: micro-behaviors/data/control-flow/dispatch/run::wscript-shell-run-statement
  - id: micro-behaviors/fs/write/content::create-text-file-method-name
  - id: micro-behaviors/fs/read/file/handle::open-text-file-read
  any:
  - id: micro-behaviors/fs/delete/file/library::wsh-deletefile-call
  - id: micro-behaviors/fs/path/check::fso-file-exists
