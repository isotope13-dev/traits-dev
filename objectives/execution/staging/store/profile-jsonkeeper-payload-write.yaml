defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
- id: jsonkeeper-payload-js-write-profile
  desc: JSONKeeper and payload.js write clues
  crit: suspicious
  conf: 0.88
  near_lines: 20
  all:
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: objectives/command-and-control/infrastructure/paste::jsonkeeper
  - id: micro-behaviors/data/parse/json::json-parse-call
  - id: micro-behaviors/fs/write/file/content::js-payload-file-write-text
  any:
  - id: micro-behaviors/fs/write/file/content::js-cookie-property-file-write-text
  - id: micro-behaviors/fs/path/extension::js-reference
  unless:
  - id: metadata/path/directory::test-directory-component
- id: secret-name-jsonkeeper-write-profile
  desc: Secret name and JSONKeeper write clues
  crit: suspicious
  conf: 0.92
  all:
  - id: objectives/execution/staging/store::jsonkeeper-payload-js-write-profile
  - id: micro-behaviors/data/parse/vocabulary::secret-key-name
- id: secret-jsonkeeper-js-file-profile
  desc: Secret JSONKeeper and JS file clues
  crit: suspicious
  conf: 0.96
  near_lines: 20
  all:
  - id: objectives/execution/staging/store::secret-name-jsonkeeper-write-profile
  - id: objectives/command-and-control/infrastructure/paste::jsonkeeper
  any:
  - id: micro-behaviors/fs/path/extension::js-reference
  unless:
  - id: metadata/path/directory::test-directory-component
