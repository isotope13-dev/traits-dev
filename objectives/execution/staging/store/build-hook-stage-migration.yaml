defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
  attack: T1195.002
composite_rules:
- id: setup-py-encrypted-build-hook-write
  desc: setup.py build hook decrypts and writes plaintext
  crit: hostile
  conf: 0.995
  for:
  - python
  scope: file
  attack: T1195.002,T1027,T1140
  all:
  - id: metadata/build/pip::setup-py
  - id: metadata/build/package/recipe/setup-hooks::setuptools-build-py-run-override
  - id: metadata/build/package/recipe/setup-hooks::run-override-calls-helper-after-super
  - id: objectives/anti-static/obfuscation/crypto::environment-slice-hash-key
  - id: micro-behaviors/crypto/symmetric/aes/reference::aesgcm-name-reference
  - id: micro-behaviors/crypto/decrypt/transform/unspecified::python-decrypt-method-call
  - id: micro-behaviors/data/decode/hex::python-fromhex
  - id: micro-behaviors/fs/path/temp::tmp-path-content
  - id: micro-behaviors/fs/write/file/full/string::python-pathlib-write-text
  unless:
  - id: metadata/path/directory::test-directory-component
- id: rust-build-rs-staged-payload-write
  desc: build.rs stages payload bytes in OUT_DIR
  crit: suspicious
  conf: 0.94
  for:
  - rust
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  - id: micro-behaviors/os/env/read/named::cargo-out-dir-reference
  - id: micro-behaviors/data/embedded/payload/native::rust-build-rs-include-native-bytes
  any:
  - id: micro-behaviors/fs/write/file/unspecified::rust-build-rs-write-out-dir
  - id: micro-behaviors/fs/file/copy/source-destination::rust-build-rs-copy-out-dir
  - id: micro-behaviors/fs/write/file/full/unspecified::fs-write
  - id: micro-behaviors/fs/write/file/handle/unspecified::rust-write-all
