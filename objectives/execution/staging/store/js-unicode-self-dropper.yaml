defaults:
  for: [javascript]
  platforms: [windows]
composite_rules:
  - id: js-unicode-self-dropper
    desc: Encoded self-reading WSH dropper with archive and hidden-launch clues
    crit: hostile
    conf: 0.96
    attack: T1140,T1059.007
    # Independent roles: encoded material and decoder, self source, binary
    # serialization and disk sink, archive handling, and hidden dispatch.
    # Tokens cover computed method names without claiming data-flow proof.
    all:
      - id: objectives/anti-static/obfuscation/encoding/arithmetic::shifted-unicode-payload
      - id: micro-behaviors/process/info/selfpath::scriptfullname-literal
      - id: micro-behaviors/fs/write/stream::adodb-stream-progid
      - id: micro-behaviors/data/property/access::msxml-node-typed-value
      - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
      - id: micro-behaviors/data/archive/extract/capability::shell-copyhere-method-token
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/data/control-flow/dispatch/computed::js-computed-zero-false-call
