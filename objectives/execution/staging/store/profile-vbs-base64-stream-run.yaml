defaults:
  platforms:
  - windows
composite_rules:
- for:
  - vbs
  id: vbs-base64-stream-delete-run-clues
  desc: VBS Base64, stream, delete and Run clues
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/os/com/instantiation::createobject-reference
  - id: micro-behaviors/fs/write/stream::adodb-save-to-file
  - id: micro-behaviors/fs/delete/file/library::wsh-deletefile-call
  - id: metadata/file/line::vbs-long-average-lines
  - id: micro-behaviors/data/control-flow/dispatch/run::run-zero-style-argument
  any:
  - id: micro-behaviors/data/decode/base64/unspecified::powershell-frombase64string
  - id: micro-behaviors/data/decode/base64/unspecified::base64-decoder-near-reflection-method-lookup
