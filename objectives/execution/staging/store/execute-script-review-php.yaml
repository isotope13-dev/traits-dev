defaults:
  crit: hostile
  conf: 0.99
  platforms: [unix, windows]
  for: [php]
  attack: T1105,T1059.004


composite_rules:
  - id: php-request-write-executable-mode
    desc: PHP request, file write and executable mode clues
    crit: hostile
    conf: 0.98
    attack: T1105,T1222.002
    all:
      - id: micro-behaviors/fs/write/file/full/call::php-file-put-contents
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-0755-mode
      - id: micro-behaviors/communications/http/request/superglobal::post-dup
    any:
      - id: micro-behaviors/data/decode/base64/structured::php-base64-request-param
      - id: micro-behaviors/communications/http/client/file-read::php-http-variable-source-read
      - id: micro-behaviors/communications/http/request/superglobal::php-request-selected-resource-open

  # Download-and-detach dropper in a single PHP file: the body is fetched over
  # HTTP, written to disk, and started as a backgrounded shell job whose output
  # is discarded, so the child outlives the host process (laravel-lang/actions
  # helpers.php, May 2026). The fetched payload is not visible, but a fetch,
  # a file write, and a silent detached launch together are a loader.
  - id: php-fetch-write-detached-launch
    desc: PHP fetches a remote file, writes it, and launches it detached
    crit: hostile
    conf: 0.9
    attack: T1105,T1204.002
    near_lines: 80
    all:
      - id: micro-behaviors/fs/write/file/full/call::php-file-put-contents
      - id: micro-behaviors/process/daemonize/devnull::php-background-execution-devnull
    any:
      - id: micro-behaviors/communications/http/client/file-read::php-file-get-url-variable
      - id: micro-behaviors/communications/http/client/file-read::file-get-contents-url
      - id: micro-behaviors/communications/http/curl/binding::php-curl-request
