defaults:
  platforms:
  - windows
composite_rules:
- for:
  - pe
  id: dotnet-resource-write-exe-config-clues
  desc: Resource access, EXE config and file-write clues
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/lang/natural/process-status::exe-arrow-boolean-text
  - id: micro-behaviors/data/embedded/resource::dotnet-resource-reader-access
  - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
  any:
  - id: micro-behaviors/crypto/decrypt/initialize::dotnet-rijndael-decryptor
  - id: micro-behaviors/os/env/path::appdata-path-lookup
  - id: micro-behaviors/process/sync/mutex::create-mutex
- for:
  - batch
  - javascript
  - powershell
  - vbs
  id: script-decimal-pe-stream-write
  desc: Decimal PE and stream-write clues
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/data/embedded/payload/array::decimal-mz-dos-header-array
  any:
  - id: micro-behaviors/fs/write/stream::wsh-savetofile
  - id: micro-behaviors/fs/write/file/stream::adodb-stream
  - id: micro-behaviors/fs/write/file/stream::vba-adodb-savetofile-call
  needs: 2
- for:
  - batch
  - javascript
  - powershell
  - vbs
  id: script-decimal-pe-system-path-clues
  desc: Decimal PE stream and System32 path clues
  crit: suspicious
  conf: 0.97
  all:
  - id: objectives/execution/staging/store::script-decimal-pe-stream-write
  - id: micro-behaviors/fs/path/binary::system32-executable-path
