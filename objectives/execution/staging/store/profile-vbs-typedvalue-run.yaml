defaults:
  platforms:
  - windows
composite_rules:
- for:
  - vbs
  id: vbs-typedvalue-savetofile-run-clues
  desc: VBS typed value, SaveToFile and Run clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/data/property/access::msxml-node-typed-value
  - id: micro-behaviors/data/control-flow/dispatch/run::script-run-method-call
  - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
  any:
  - id: micro-behaviors/data/encode/payload::vbs-appended-large-base64-payload
  - id: micro-behaviors/os/com/instantiation::vbs-createobject-variable-progid
  - id: micro-behaviors/os/com/instantiation::vbs-computed-createobject
  - id: objectives/anti-static/obfuscation/string/concat::vbs-amp-fragment-concat
  - id: objectives/anti-static/obfuscation/name-mangling/variables::vbs-generated-identifiers
