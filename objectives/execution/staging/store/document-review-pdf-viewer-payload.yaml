defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll, binaries, source]
  attack: T1140
  mbc: B0032


composite_rules:
  - id: pdf-sentinel-xor-temp-dropper
    for: [c]
    desc: PDF-sentinel-gated XOR payload dropped as a temporary executable
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/app/productivity/sumatrapdf::sumatrapdf-encryption-sentinel
      - id: micro-behaviors/fs/path/executable::windows-temp-executable-source
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file-source
    any:
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::indexed-xor-array-assignment
      - id: micro-behaviors/data/property/assign::indexed-value-xor-assignment
