defaults:
  platforms:
  - windows
  - unix
  for:
  - python
composite_rules:
- id: python-ctr-antidebug-temp-launch-profile
  desc: AES-CTR, debugger and temp launch clues
  crit: suspicious
  conf: 0.99
  for:
  - python
  - pyc
  platforms:
  - windows
  all:
  - id: micro-behaviors/process/debug/detect::is-debugger-present-python-text
  - id: micro-behaviors/crypto/cipher/mode::cipher-mode-keyword--mode-ctr
  - id: metadata/import/python/crypto/cipher
  - id: micro-behaviors/fs/temp/directory::tmp-prefix-token
  - id: micro-behaviors/os/env/path::temp-var
  - id: micro-behaviors/process/create/exec::win-start-empty-title
