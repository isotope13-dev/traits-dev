defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: download-hidden-copy-detached-launch
    desc: Download, executable dotfile copy and detached launch co-occur
    crit: suspicious
    conf: 0.95
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::shell-download-output-call
      - id: objectives/evasion/file-hiding/dotfile-create::cp-chmod-hidden-dotfile-executable
      - id: micro-behaviors/process/daemonize/detach::detached-background-command
