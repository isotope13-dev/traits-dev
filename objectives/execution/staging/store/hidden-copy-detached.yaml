defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: download-hidden-copy-detached-launch
    desc: Download, executable dotfile copy and detached launch co-occur
    crit: suspicious
    conf: 0.95
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::shell-download-output-call
      - id: objectives/evasion/file-hiding/dotfile-create::cp-chmod-hidden-dotfile-executable
      - id: micro-behaviors/process/daemonize/detach::detached-background-command

  # Each role adds independent context; ordinary hidden agent installers need
  # not disable certificate checks or fetch from a literal public IP.
  - id: insecure-raw-ip-hidden-stage-cleanup
    desc: Raw-IP hidden executable staging with TLS bypass and forced cleanup
    crit: hostile
    conf: 0.97
    attack: T1105,T1059.004
    near_lines: 25
    all:
      - id: download-hidden-copy-detached-launch
      - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
      - id: micro-behaviors/communications/tls/verify/disable::shell-python-unverified-context
      - id: micro-behaviors/fs/delete/file/command::rm-force-variable-target
