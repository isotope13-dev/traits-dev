defaults:
  for: [pe, dll]
  platforms: [windows]

composite_rules:
  - id: unsigned-rwx-registry-temp-api-profile
    desc: Registry-write APIs with RWX, TEMP and IP references
    crit: notable
    conf: 0.995
    all:
      - id: micro-behaviors/dylib/lookup::unsigned-writable-entry-api-lookup-debugger-imports
      - id: micro-behaviors/os/registry/value/write::registry-write-api-chain
      - id: micro-behaviors/fs/write/file/handle/unspecified::pe-temp-write-process-api-profile
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
