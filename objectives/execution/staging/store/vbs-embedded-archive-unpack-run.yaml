# VBS writes an archive decoded from its own text, unpacks it with
# Shell.Application CopyHere, launches what it unpacked through
# ShellExecute and deletes the archive.
defaults:
  platforms: [windows]
  for: [vbs]
  crit: hostile
  attack: T1140,T1204.002,T1070.004

composite_rules:
  - id: vbs-embedded-archive-unpack-and-launch
    desc: VBS writes an embedded archive, unpacks it with CopyHere and launches it
    conf: 0.93
    all:
      - id: micro-behaviors/data/property/access::msxml-node-typed-value
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file
      - id: micro-behaviors/data/archive/extract/capability::shell-copyhere-method
      - id: micro-behaviors/os/handler/open::shellexecute-method-reference
      - id: micro-behaviors/fs/delete/file/library::wsh-deletefile-call
