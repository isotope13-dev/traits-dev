defaults:
  platforms: [unix, windows]

composite_rules:
  - id: npm-preinstall-ip-cache-clues
    desc: npm preinstall, IP PHP and audit cache write clues
    crit: suspicious
    conf: 0.99
    scope: archive
    for: [npm, tar, package.json, javascript]
    all:
      - id: metadata/package/scripts/lifecycle::npm-preinstall-script
      - id: micro-behaviors/os/package-manager/dependency-setup::node-main-preinstall-chain
      - id: objectives/execution/staging/store::node-ip-php-audit-cache-clues
