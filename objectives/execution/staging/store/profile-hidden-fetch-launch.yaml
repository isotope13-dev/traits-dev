defaults:
  for: [scripts, manifests, html, xml, dockerfile, package-lock.json, groovy, makefile]
  platforms: [linux, macos, windows]
composite_rules:
  - id: hidden-fetch-chmod-launch-clues
    desc: Hidden download, chmod and launch co-occur
    crit: notable
    conf: 0.97
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::hidden-output-download-context
      - id: micro-behaviors/fs/chmod/executable/hidden::chmod-hidden-path-command-container
    any:
      - id: micro-behaviors/process/deploy/file-exec/command::hidden-stage-chmod-execute
      - id: micro-behaviors/process/create/path-execution::hidden-home-path-invocation
      - id: micro-behaviors/process/daemonize/background::hidden-tmp-background-exec
    unless:
      - id: metadata/package/testing/presence/fixture::synthetic-data-generator-filename
