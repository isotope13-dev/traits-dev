defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: python-bat-run-then-delete
  desc: Runs a batch file then deletes it
  crit: hostile
  conf: 0.95
  attack: T1059.003,T1070.004
  scope: file
  all:
  - id: metadata/lang/source/literal/string/command::python-cmd-c-bat
  - id: micro-behaviors/fs/delete/file/command::cmd-del-command
  - id: micro-behaviors/process/create/subprocess/launch::process-execution
