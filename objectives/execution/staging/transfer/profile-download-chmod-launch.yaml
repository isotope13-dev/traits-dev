defaults:
  platforms:
    - unix
    - windows
  for:
    - shell
  crit: notable
composite_rules:
  - id: shell-download-chmod-local-exec
    desc: Shell download, chmod and temporary launch cluster
    conf: 0.96
    near_lines: 30
    all:
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-tmp-file
      - id: metadata/lang/source/syntax/command/launch::tmp-path-execution
    any:
      - id: micro-behaviors/communications/http/download/wget::wget-output-document-option
      - id: micro-behaviors/communications/http/download/cli/curl-wget::fetch-output-flag-script
  - id: raw-ip-download-chmod-local-exec
    desc: Download/launch cluster with external-IP URL
    conf: 0.97
    all:
      - id: objectives/execution/staging/transfer::shell-download-chmod-local-exec
    any:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
  - id: raw-ip-redirected-download-chmod-exec
    desc: File-output fetch with local chmod/launch command
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/shell::fetch-output-to-literal
      - id: micro-behaviors/process/deploy/file-exec/command::chmod-exec-literal-local
    any:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
  - id: raw-ip-output-multiarch-exec-cluster
    desc: Raw-IP file-output multi-architecture execution cluster
    conf: 0.98
    all:
      - id: objectives/execution/staging/transfer::raw-ip-redirected-download-chmod-exec
      - id: micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist
  # The fetch writes into a shell variable (dropper staging path), so the
  # literal-output composites above never see it. The chain is file-scoped
  # because the raw-IP URL often sits in a config assignment far from the
  # command that uses it.
  - id: raw-ip-variable-output-chmod-launch
    desc: Raw-IP download to variable path, chmod and launch
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/download/shell::fetch-output-to-var
      - id: micro-behaviors/process/deploy/file-exec/command::chmod-exec-quoted-var-local
