defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript

composite_rules:
  - id: js-insecure-curl-exe-near-shell
    desc: curl EXE download near shell exec
    crit: suspicious
    conf: 0.97
    for:
      - javascript
      - typescript
    near_lines: 45
    all:
      - id: micro-behaviors/communications/http/download/curl::source-curl-insecure-executable-download
    any:
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/process/config/window::js-exec-wrapper-with-hidden-options
