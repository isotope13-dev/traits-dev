defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: batch-curl-temp-powershell-output
    desc: curl writes a temporary PowerShell script
    crit: notable
    if:
      type: text
      regex: '(?i)\bcurl(\.exe)?\b[^\r\n&|]{0,220}\s-o\s+"?%temp%\\[^\s"&|]{1,80}\.ps1'

  - id: batch-curl-decimal-host
    desc: curl uses a numeric host
    crit: notable
    if:
      type: text
      regex: '(?i)\bcurl(\.exe)?\b[^\r\n&|]{0,220}\s[1-9][0-9]{7,9}/[^\s&|]{1,80}'

  - id: batch-powershell-temp-script
    desc: PowerShell runs a temporary script
    crit: notable
    if:
      type: text
      regex: '(?i)\bpowershell(\.exe)?\b[^\r\n&|]{0,120}-f(ile)?\s+"?%temp%\\[^\s"&|]{1,80}\.ps1'

composite_rules:
  - id: batch-decimal-curl-hidden-powershell
    desc: Decimal-host curl download near hidden PowerShell script execution
    crit: hostile
    attack: T1105,T1059.001
    near_lines: 2
    all:
      - id: batch-curl-temp-powershell-output
      - id: batch-curl-decimal-host
      - id: batch-powershell-temp-script
      - id: objectives/evasion/security-bypass/policy/execution::batch-concealed-policy-override-call
