defaults:
  crit: notable
  conf: 0.99
  platforms:
  - unix
  for:
  - elf

composite_rules:
  - id: raw-ip-http-execv-unlink-profile
    desc: ELF exec/unlink names and raw-IP HTTP indicators co-occur
    all:
      - id: micro-behaviors/communications/http/get::manual-http10-dynamic-get
      - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-elf
      - id: micro-behaviors/process/create/fork::fork
      - id: micro-behaviors/process/replace::c-exec-variants
      - id: micro-behaviors/fs/delete/path::unlink
