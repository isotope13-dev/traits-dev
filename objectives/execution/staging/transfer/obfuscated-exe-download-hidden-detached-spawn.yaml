defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript

composite_rules:
  - id: obfuscated-exe-download-hidden-detached-spawn
    desc: Obfuscated executable URL and hidden process context
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/variable::spawn-destination-variable
      - id: micro-behaviors/process/argument/visibility::windowshide-obfuscated-true
      - id: micro-behaviors/process/daemonize/detach::detached-obfuscated-true
      - id: micro-behaviors/communications/http/download/url::executable-url-reference
    any:
      - id: micro-behaviors/communications/http/request/computed::js-computed-http-object-call
      - id: micro-behaviors/communications/http/download/handler::node-url-destination-download-call
    unless:
      - id: metadata/path/directory::test-directory-component
