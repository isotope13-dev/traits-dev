# WinHTTP response handling and Start-Process coexist; the launched command
# is not shown to use the retrieved response.
#
# The hostile sibling below requires the full stager chain on top of that
# pairing: heavy obfuscation, an in-memory ZIP extraction stage, and user
# staging-path context. Honest installers and updaters download, extract and
# run without disguising every identifier, which is what keeps the two rungs
# apart.
defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: ps-winhttp-response-start-profile
    desc: PowerShell WinHTTP fetch paired with a Start-Process launch
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-com
      - id: micro-behaviors/communications/http/client/response-body::response-body
      - id: micro-behaviors/process/create/cmdlet::start-process-call
    any:
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/create/exec::child-process-execution
  - id: obfuscated-ps-fetch-zip-extract-launch
    desc: Obfuscated PowerShell fetches an archive, extracts it, and launches the payload
    crit: hostile
    conf: 0.95
    attack: T1027,T1105,T1059.001
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-com
      - id: micro-behaviors/communications/http/client/response-body::response-body
      - id: micro-behaviors/data/archive/extract/zip::powershell-in-memory-zip-entry-extract
      - id: micro-behaviors/process/create/cmdlet::start-process-call
      - id: objectives/anti-static/obfuscation/string/concat::ps-chararray-obfuscation
    any:
      - id: micro-behaviors/os/env/path::powershell-user-staging-env
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
    unless:
      - id: metadata/installer/product/
