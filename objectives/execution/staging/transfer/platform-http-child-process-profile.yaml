defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable

composite_rules:
  - id: platform-http-child-process-profile
    desc: Platform branch, HTTP and child-process clues
    conf: 0.9
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/sysinfo/platform/branch::multi-platform-branch
      - id: micro-behaviors/os/module/require::child-process-require
      - id: micro-behaviors/communications/http/client/response-body::http-response-acquisition
    any:
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/process/create/subprocess/launch::spawn-call
