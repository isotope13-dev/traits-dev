defaults:
  for:
  - pe
  platforms:
  - windows

composite_rules:
  - id: managed-github-hidden-shell-api-profile
    desc: Managed hidden-shell/GitHub API profile
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/process/create/subprocess/reference::shell-execution-comp
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
      - id: metadata/lang/compiler/managed::dotnet-assembly
    any:
      - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
