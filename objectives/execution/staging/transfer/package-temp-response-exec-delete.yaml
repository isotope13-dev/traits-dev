defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript

composite_rules:
  - id: package-temp-response-exec-delete
    for:
      - javascript
      - typescript
      - npm
      - tar
      - package.json
    desc: Package temp response process context
    crit: suspicious
    conf: 0.99
    scope: archive
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/fs/write/file/full/unspecified::node-write-file-promise
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/fs/delete/file/library::node-fs-promises-unlink
      - id: micro-behaviors/os/sysinfo/directories::node-os-tmpdir
      - id: metadata/package/entrypoint/module::pkg-main-field
    unless:
      - id: metadata/path/directory::test-directory-component
