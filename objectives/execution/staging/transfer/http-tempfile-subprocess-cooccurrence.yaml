defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable

composite_rules:
  - id: http-tempfile-subprocess-cooccurrence
    desc: HTTP GET, tempfile and subprocess co-occur
    conf: 0.9
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/fs/temp/mktemp::python-tempfile
    any:
      - id: micro-behaviors/process/create/exec::python-subprocess-run-call-text
      - id: micro-behaviors/process/create/subprocess/launch::call-ast
      - id: micro-behaviors/process/create/subprocess/launch::popen-content
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
