# Importing the module immediately runs a download loop that writes remote
# artifacts beneath the user's home cache directory with an HTTP client.
# Nothing the caller does selects the files: the list and the origin are
# fixed in the package, which stages content for a later step.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1105

composite_rules:
  - id: python-import-time-home-cache-artifact-download
    desc: Import-time loop downloads artifacts into home cache
    crit: hostile
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/data/control-flow/module-exec::python-import-calls-named-downloader
      - id: micro-behaviors/fs/path/location::python-cache-path-home
    any:
      - id: micro-behaviors/communications/http/client/initialize::httpx-client
      - id: metadata/import/python/httpx
      - id: metadata/import/python/requests
      - id: metadata/import/python/urllib/request
