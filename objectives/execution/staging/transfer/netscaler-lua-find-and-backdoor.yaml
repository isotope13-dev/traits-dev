defaults:
  platforms: [netscaler, appliance, unix]
  for: [scripts, binaries, go, java, kotlin, csharp, swift]

composite_rules:
  - id: netscaler-lua-find-and-backdoor
    desc: NetScaler Lua search and backdoor script text
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/search/name::nsconfig-lua-find-command
      - id: objectives/execution/payload/script-eval/network/constructed::eval-or-download-backdoor-text
