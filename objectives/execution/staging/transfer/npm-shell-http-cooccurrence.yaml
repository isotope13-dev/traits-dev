defaults:
  platforms:
  - linux
  - macos
  - windows

composite_rules:
  # File-scoped: a child_process import in one module and a fetch in another
  # module of the same package is ordinary CLI structure, not a staged download.
  - id: npm-shell-http-cooccurrence
    desc: JavaScript file combines child-process exec and HTTP
    crit: notable
    conf: 0.85
    for: [javascript]
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/module/require::node-system-module-import-set
      - id: micro-behaviors/process/create/shell/command-string::child-process-exec
    any:
      - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
      - id: micro-behaviors/communications/http/request/client/call::generic-request-method-call
