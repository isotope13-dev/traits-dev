---
defaults:
  platforms:
  - android
  for:
  - dex
  crit: notable
  conf: 0.95
composite_rules:
- id: android-boot-wget-http-clues
  desc: Boot reference and wget HTTP text in DEX
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/os/message/intent::android-boot-completed-reference
  - id: micro-behaviors/communications/http/download/wget::dex-wget-http-url
- id: android-busybox-toybox-wget-clues
  desc: DEX text contains wget, busybox and toybox commands
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/communications/http/download/wget::dex-wget-http-url
  - id: micro-behaviors/communications/http/download/wget::dex-busybox-wget
  - id: micro-behaviors/communications/http/download/wget::dex-toybox-wget
- id: android-boot-busybox-wget-clues
  desc: Boot reference and busybox wget text in DEX
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/os/message/intent::android-boot-completed-reference
  - id: micro-behaviors/communications/http/download/wget::dex-busybox-wget
