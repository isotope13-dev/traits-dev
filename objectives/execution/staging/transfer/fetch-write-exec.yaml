defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript

composite_rules:
  - id: fetch-write-exec
    desc: JavaScript fetch/write with subprocess activity
    crit: notable
    conf: 0.9
    near_lines: 30
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/fs/write/file/content::js-file-write
    any:
      - id: micro-behaviors/process/create/exec::js-execfile-call
      - id: micro-behaviors/process/create/variable::spawn-variable-program
