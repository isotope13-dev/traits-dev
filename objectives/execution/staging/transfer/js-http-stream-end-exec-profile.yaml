defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript

composite_rules:
  - id: js-http-stream-end-exec-profile
    desc: HTTP client and shell exec near end-handler syntax
    crit: notable
    conf: 0.95
    near_lines: 30
    all:
      - id: micro-behaviors/communications/http/request/client::http-client-usage
      - id: micro-behaviors/process/create/shell/command-string::js-exec
    any:
      - id: metadata/lang/source/syntax/call/relationship::js-end-handler-near-exec-variable
      - id: metadata/lang/source/syntax/call/relationship::js-end-handler-near-exec-template
