# These are co-occurring operations, not proof that decoded/downloaded bytes
# reach the launched process. Dormant MSXML helpers must not imply a payload.
defaults:
  platforms: [windows]
  for: [javascript, vbs]
  crit: notable
composite_rules:
  - id: http-response-adodb-no-wait-run
    desc: HTTP body, ADODB save and no-wait Run
    conf: 0.98
    for: [javascript]
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/communications/http/client/response-body::wsh-response-body
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file
      - id: micro-behaviors/data/control-flow/dispatch/run::wsh-run-style-argument-clues
