# Shell launcher that fetches a file to a named output, marks it executable,
# and runs it, where the source is pinned to a fixed address: either curl
# --resolve maps a hostname to a chosen IP, or the URL is a raw IPv4 literal.
# A DNS-hosted installer that chmods its own download is not this shape.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1105

composite_rules:
  # Variable targets (`chmod +x "$OUT"`) and literal paths (`chmod +x ./x`) are
  # separate shell shapes. Either one grants the exec bit to the download.
  - id: shell-exec-bit-grant
    desc: Shell grants execute bit to a fetched path
    scope: file
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::script-grants-execute-permission
      - id: micro-behaviors/fs/chmod/executable/mode::shell-chmod-any

  - id: shell-pinned-download-chmod-launch
    desc: Shell fetches a pinned or raw-IP download, then chmods it
    crit: hostile
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::fetch-output-flag-script
      - id: shell-exec-bit-grant
    any:
      - id: micro-behaviors/communications/http/curl/command::shell-curl-host-resolution-override
      - id: micro-behaviors/communications/ip/literal::direct-ip-http-client
    needs: 1
