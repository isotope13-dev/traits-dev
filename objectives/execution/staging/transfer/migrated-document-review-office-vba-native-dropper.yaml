---
defaults:
  platforms:
  - windows
  for:
  - oledoc
  - ooxml
composite_rules:
- id: auto-open-vba-http-stream-shell-clues
  desc: Auto-open VBA HTTP stream write and shell object clues
  crit: suspicious
  conf: 0.98
  for:
  - oledoc
  - ooxml
  - xlsx
  - vbs
  scope: archive
  near_lines: 50
  all:
  - id: micro-behaviors/os/application/hook/event::vba-auto-open-sub-decl
  - id: micro-behaviors/communications/http/client/xmlhttp::xmlhttp-object
  - id: micro-behaviors/communications/http/client/response-body::wsh-response-body-adodb
  - id: micro-behaviors/fs/write/stream::adodb-stream-progid
  - id: micro-behaviors/fs/write/stream::adodb-save-to-file
  - id: micro-behaviors/os/com/automation::shell-application-progid
  - id: micro-behaviors/fs/write/stream::open-method-call
- id: fragmented-vba-urlmon-wscript-clues
  desc: Fragmented VBA auto-open, URLMon and WScript shell clues
  crit: suspicious
  conf: 0.99
  for:
  - oledoc
  all:
  - id: micro-behaviors/os/application/hook/event::fragmented-vba-auto-open-entrypoint
  - id: micro-behaviors/communications/http/client/urlmon::fragmented-vba-urlmon-download-api
  - id: well-known/lib/runtime/scripted/windows-script-host::fragmented-vba-wscript-shell-object
