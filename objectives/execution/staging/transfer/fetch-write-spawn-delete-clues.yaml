defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript

composite_rules:
  - id: fetch-write-spawn-delete-clues
    desc: Fetch/write/spawn with file deletion context
    crit: suspicious
    conf: 0.92
    near_lines: 40
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/fs/write/file/content::js-file-write
      - id: micro-behaviors/fs/delete/file/
    any:
      - id: micro-behaviors/process/create/exec::js-execfile-call
      - id: micro-behaviors/process/create/variable::spawn-variable-program
  # Same as fetch-write-exec: when the launched process is tar unpacking the
  # fetched archive (and the archive is cleaned up afterwards), the chain is
  # a dependency installer, not a fetched program being run.
    downgrade:
      any:
        - id: micro-behaviors/data/archive/extract/tar::node-spawn-tar-extract
        - id: micro-behaviors/data/archive/extract/zip/
    unless:
      - id: well-known/app/infrastructure/pulumi::pulumi-source-tree
  # `which claude` plus the Messages API is a local-CLI attempt with an API
  # fallback. The temp file holds the prompt; the fetch does not supply it.
      - id: micro-behaviors/communications/http/services/anthropic::claude-cli-which-with-messages-api
      - id: micro-behaviors/process/create/exec::node-detached-os-default-handler-spawn
      - id: micro-behaviors/communications/url/host/http::loopback-client-url-cooccurrence
      - id: micro-behaviors/process/daemonize/detach::node-lazy-daemon-spawn
  # A download renamed into its final place is installed and kept; the delete
  # is failure cleanup of the temp file.
      - id: micro-behaviors/fs/file/rename::node-temp-write-then-rename
