defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript

composite_rules:
  - id: js-ip-write-exec-profile
    desc: External IP, file write and shell exec clues
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
      - id: micro-behaviors/fs/write/file/full/unspecified::write-file-sync
      - id: micro-behaviors/process/create/shell/command-string::js-exec
