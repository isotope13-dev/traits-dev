defaults:
  platforms: [windows]
  for: [batch]

composite_rules:
  - id: temp-exe-launch-near-archive-download-extract
    desc: TEMP launch, HTTP download and archive-extraction clues
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::iwr-outfile-download
      - id: micro-behaviors/data/archive/extract/capability::powershell-archive-extract
      - id: micro-behaviors/process/create/path-execution::batch-start-temp-exe
