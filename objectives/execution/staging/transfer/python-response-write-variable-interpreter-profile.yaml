# The interpreter receives a variable path, while HTTP response material is
# written nearby. The matcher does not prove that variable names the write.
defaults:
  platforms: [windows, unix, android, ios]
  for: [python]

composite_rules:
  - id: python-downloads-and-runs-remote-source
    desc: Python downloads source code and runs it
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.006
    scope: file
    all:
      - id: micro-behaviors/communications/http/get::requests-get-without-reserved-literal-prefix
      - id: micro-behaviors/communications/http/client/exchange::python-http-request-file-write
      - id: micro-behaviors/communications/url/resource-path/file::python-code-url-reference
      - id: micro-behaviors/process/interpreter/python::subprocess-run-sys-executable

  - id: python-response-write-variable-interpreter-profile
    desc: HTTP response write near variable-path Python interpreter
    crit: suspicious
    conf: 0.98
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/process/argument/file::interpreter-variable-script-argv
      - id: micro-behaviors/fs/temp/directory::python-temporary-directory-context
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-content
      - id: micro-behaviors/communications/url/resource-path/file::python-code-url-reference
