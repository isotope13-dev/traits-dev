defaults:
  crit: notable
  conf: 0.99
  platforms:
  - unix
  for:
  - elf

composite_rules:
  - id: raw-ip-http-daemon-execv-profile
    desc: ELF exec name, raw-IP HTTP and daemon indicators co-occur
    all:
      - id: micro-behaviors/communications/http/get::manual-http10-dynamic-get
      - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
      - id: micro-behaviors/process/daemonize/detach::full-daemon
      - id: micro-behaviors/process/replace::c-exec-variants
