defaults:
  platforms: [windows]
traits:
- id: webclient-start-process-source-sequence
  desc: WebClient download near Start-Process text
  crit: notable
  conf: 0.9
  for: [powershell, batch, vbs, javascript, html]
  if:
    type: text
    regex: (?is)WebClient\)?\.Download\w+.{0,240}\bStart-Process\b.{0,120}
    case_insensitive: true
composite_rules:
- id: batch-webclient-download-temp-exe-start
  desc: Batch downloads a temporary executable and starts it
  crit: hostile
  conf: 0.96
  attack: T1105
  for: [batch]
  near_lines: 4
  all:
  - id: micro-behaviors/communications/http/download/webclient::ps-downloadfile-exe-dll
  - id: micro-behaviors/fs/path/temporary-artifact::batch-exe-path-reference
  - id: micro-behaviors/process/create/cmdlet::start-process-filepath-text
