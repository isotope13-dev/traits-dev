defaults:
  for: [python]
  platforms: [unix, windows]
composite_rules:
  - id: python-module-os-system-curl-profile
    desc: Module os.system with curl host clue
    crit: suspicious
    conf: 0.96
    near_lines: 3
    all:
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/communications/http/curl/command::curl-dotted-host
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
    # The Go test suite that embeds the Base64 fixture is the parent file of this
    # decoded layer. Its python snippet is validator input, not a staged script.
    unless:
      - id: metadata/package/testing/harness/unit::go-test-source-file
