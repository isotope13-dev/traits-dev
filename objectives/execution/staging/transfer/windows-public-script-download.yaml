defaults:
  platforms: [windows]
  for: [powershell, batch, text]
  crit: notable
  conf: 0.94

traits:
  - id: windows-public-script-path
    desc: Windows script path in public directory
    if:
      type: text
      regex: '(?i)[\\/]Users[\\/]+Public[\\/][^:"''\r\n]{1,70}\.(bat|cmd|ps1)\b'

  - id: windows-repeated-webclient-download
    desc: Repeated WebClient file download calls
    count_min: 3
    if:
      type: text
      regex: '(?i)\.DownloadFile\s*\(\s*["'']https?://'

composite_rules:
  - id: public-directory-repeated-raw-ip-script-download
    desc: Windows stages multiple scripts from an IP in a public directory
    crit: hostile
    conf: 0.95
    attack: T1105
    all:
      - id: windows-public-script-path
      - id: windows-repeated-webclient-download
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/client/webclient::webclient-download-file
