defaults:
  for: [python]
  platforms: [unix, windows]
composite_rules:
  - id: python-os-system-wget-followon-profile
    desc: os.system near wget follow-on text
    crit: suspicious
    conf: 0.95
    platforms: [unix]
    # The wget line has to sit at the os.system call. A usage docstring that
    # shows a `wget URL && tar` batch line, in a tool that runs commands read
    # from a file, is documentation and does not launch the download.
    near_lines: 3
    all:
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/communications/http/download/wget::wget-url-followon-command-text
