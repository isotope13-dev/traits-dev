defaults:
  crit: notable
  for:
  - nupkg
  platforms:
  - windows
  - unix

composite_rules:
  - id: nuget-tool-hidden-shell-github-api-profile
    desc: NuGet tool hidden-shell/GitHub API profile
    conf: 0.98
    scope: outer
    for: [nupkg, xml, pe]
    all:
      - id: metadata/package/entrypoint/command::dotnet-tool-command-manifest
      - id: objectives/execution/staging/transfer::managed-github-hidden-shell-api-profile
