defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable

composite_rules:
  - id: platform-url-stream-exec-profile
    desc: Platform and URL near shell-exec and end-handler clues
    conf: 0.98
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/sysinfo/platform/branch::node-os-platform-alias-branch
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
      - id: micro-behaviors/data/control-flow/dispatch/named::evaluate-helper-identifier-call
      - id: metadata/lang/source/syntax/call/relationship::js-end-handler-near-exec-variable
      - id: micro-behaviors/process/create/shell/command-string::js-exec
