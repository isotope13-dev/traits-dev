defaults:
  for:
  - pe
  platforms:
  - windows

composite_rules:
  - id: managed-http-hidden-shell-api-profile
    desc: Managed hidden-shell/HTTP URL API profile
    crit: notable
    conf: 0.97
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/communications/http/client/managed::httpclient
      - id: micro-behaviors/process/create/subprocess/reference::shell-execution-comp
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
    any:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/communications/url/host/domain-http::workers-dev-url
      - id: micro-behaviors/communications/url/host/domain-http::http-url-binary
    unless:
      - id: well-known/lib/ai/openai::openai-dotnet-official-library
