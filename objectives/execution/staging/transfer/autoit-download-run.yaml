defaults:
  platforms: [windows]
  for: [text, data, vbs]

composite_rules:
  # InetGet fetches a file and Run/RunWait launches a program within the same
  # routine. The launched path need not be the download target; proximity is
  # the only join.
  - id: autoit-download-then-run
    desc: AutoIt downloads a file then launches a program
    crit: suspicious
    conf: 0.9
    near_lines: 30
    all:
      - id: micro-behaviors/communications/http/download/write::autoit-inetget-file-download
      - id: micro-behaviors/process/create/exec::autoit-run-call

  # The downloaded binary is flagged hidden+system before launch. Legitimate
  # updaters have no reason to conceal the executable they deploy.
  - id: autoit-download-hide-run
    desc: AutoIt downloads, hides with +RSH, then runs a program
    crit: hostile
    conf: 0.85
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/download/write::autoit-inetget-file-download
      - id: micro-behaviors/fs/attributes/flags::autoit-set-hidden-system-attributes
      - id: micro-behaviors/process/create/exec::autoit-run-call
