# Copies both a staged payload module and a shellcode script into a build or
# target directory prior to packaging or deployment.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  attack: T1105,T1059.007

composite_rules:
  - id: node-payload-shellcode-stage-copy
    desc: Copies staged payload and shellcode scripts into build directory
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/file/copy/call::fs-copy
      - id: objectives/supply-chain/trojanized/app/patch::shellcode-js-filename-literal
      - id: objectives/supply-chain/trojanized/app/patch::payload-stage-path-join
