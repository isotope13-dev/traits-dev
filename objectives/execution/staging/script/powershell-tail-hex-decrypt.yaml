defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027,T1140
  mbc: B0032
composite_rules:
  - id: powershell-tail-hex-decrypt-stager
    desc: Extracts trailing hex lines from file and decrypts staged payload
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/read/stream::readalllines-api-reference
      - id: micro-behaviors/fs/read/stream::powershell-select-last-variable
      - id: micro-behaviors/data/string/sanitize::powershell-strip-non-hex
      - id: micro-behaviors/crypto/decrypt/initialize::powershell-create-decryptor-call
    any:
      - id: micro-behaviors/data/decode/hex::powershell-hex-integer-conversion
      - id: micro-behaviors/data/decode/hex::powershell-convert-fromhexstring
