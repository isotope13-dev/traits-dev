defaults:
  for: [javascript]
  platforms: [windows]

traits:
  - id: wsh-run-hidden-wait
    desc: WSH Run uses hidden window
    crit: component
    if:
      type: text
      regex: '(?i)\.Run\s*\([^\r\n]{1,100},\s*0\s*,\s*true\s*\)'

composite_rules:
  - id: wsh-http-hidden-powershell-file
    desc: WSH HTTP client and hidden PowerShell file launch with policy bypass
    crit: hostile
    attack: T1059.001
    all:
      - id: metadata/file/format/markup::wsh-job-root-tag
      - id: micro-behaviors/communications/http/client/xmlhttp::activex-http-progid
      - id: micro-behaviors/communications/http/client/xmlhttp::xhr-sync-get
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: micro-behaviors/communications/http/download/url::executable-url-reference
      - id: micro-behaviors/fs/write/content::script-extension-with-text-file-creation
      - id: micro-behaviors/process/create/shell/interpreter::powershell-nop-ep-bypass-file-command
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: wsh-run-hidden-wait

  - id: wsh-xmlhttp-hidden-powershell-staging
    desc: WSH HTTP response and text write with hidden PowerShell file launch
    crit: hostile
    attack: T1059.001,T1105
    all:
      - id: micro-behaviors/communications/http/client/xmlhttp::activex-http-progid
      - id: micro-behaviors/communications/http/client/xmlhttp::xhr-sync-get
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: micro-behaviors/communications/url/resource-path/file::executable-url-reference-b
      - id: micro-behaviors/fs/write/content::fso-text-file-then-write-call
      - id: micro-behaviors/os/com/instantiation::wscript-shell-activex-constructor
      - id: micro-behaviors/process/create/shell/interpreter::powershell-nop-ep-bypass-file-command
      - id: wsh-run-hidden-wait
