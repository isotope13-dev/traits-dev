defaults:
  platforms:
    - unix
    - windows
  for:
    - python


composite_rules:
  - id: python-github-exe-download-process-clues
    desc: GitHub EXE, download and process clues
    crit: suspicious
    conf: 0.98
    all:
      - id: well-known/app/development/code-forge/github::github-raw-executable-url
    needs: 2
    any:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
      - id: micro-behaviors/communications/http/download/cli/curl-wget::fetch-output-flag-embedded-command
      - id: micro-behaviors/process/create/exec::python-subprocess-run-call-text
      - id: micro-behaviors/process/create/subprocess/launch::popen-content
      - id: micro-behaviors/process/create/variable::variable-command-argument
