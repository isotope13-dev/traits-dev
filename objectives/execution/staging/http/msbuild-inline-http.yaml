defaults:
  platforms: [windows]
  for: [xml]
composite_rules:
- id: msbuild-inline-http-process-launch
  desc: MSBuild inline HTTP download with process launch clues
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/build/msbuild::msbuild-inline-task-declaration
  - id: micro-behaviors/communications/http/client/managed::msbuild-code-webclient
  - id: micro-behaviors/communications/http/client/managed::msbuild-code-download-string
  - id: micro-behaviors/process/create/subprocess/reference::xml-process-start-api-text
  downgrade:
    any:
    - id: well-known/lib/runtime/scripted/python-runtime::cpython-msbuild-source-property
    - id: well-known/tool/sysadmin/oneget::oneget-msbuild-build-context
    - id: metadata/package/manager::nuget-restore-targets
    - id: well-known/app/finance/bitcoin-core::bitcoin-core-msbuild-context
    - id: well-known/lib/network/npm-packages/applicationinsights::dotnet-msbuild-context
