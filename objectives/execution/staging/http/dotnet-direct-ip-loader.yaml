defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105,T1027
  mbc: E1105

composite_rules:
  - id: obfuscated-dotnet-direct-ip-loader
    desc: Unsigned obfuscated .NET loader stages payloads from raw external IP
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/client/managed::httpwebrequest
      - id: objectives/anti-analysis/debugger-detect/check::debugger-api
      - id: micro-behaviors/process/create/exec::child-process-execution
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/managed::obfuscar-obfuscated-assembly
      - id: objectives/anti-static/obfuscation/obfuscator/managed::dotnet-reactor-obfuscator
      - id: objectives/anti-static/obfuscation/obfuscator/managed::confuserex-obfuscated-assembly
      - id: metadata/binary/code/entropy::code-region-entropy-78
    unless:
      - id: metadata/signature/verified/
