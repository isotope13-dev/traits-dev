defaults:
  platforms: [android, unix]
  for: [python]

composite_rules:
  - id: github-native-library-write-clues
    desc: GitHub native library URL with Python file and executable-mode clues
    crit: notable
    conf: 0.96
    all:
      - id: well-known/app/development/code-forge/github::raw-githubusercontent-native-library
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/fs/path/library::libpython-shared-object
      - id: micro-behaviors/fs/file/io-mode::write-append-create-mode
      - id: micro-behaviors/fs/chmod/executable/mode::python-executable
