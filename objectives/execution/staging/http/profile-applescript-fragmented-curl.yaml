defaults:
  platforms:
  - macos
  for:
  - applescript
  crit: suspicious
  conf: 0.96
composite_rules:
- id: applescript-url-curl-option-clues
  desc: AppleScript URL and curl option clues
  all:
  - id: micro-behaviors/communications/url/resource-path/automation::applescript-https-script-or-update-url
  any:
  - id: metadata/lang/source/literal/fragment/sequence::applescript-fragmented-curl-flags
  - id: well-known/app/network/curl::applescript-curl-quiet-insecure-options
  - id: metadata/lang/source/literal/fragment/sequence::applescript-fragmented-output-tempfile-text
  - id: micro-behaviors/communications/http/download/shell::applescript-curl-output-tempfile-text
- id: applescript-fragmented-curl-insecure-url-clues
  desc: Fragmented curl flags and URL or lure clues
  all:
  - id: objectives/anti-static/obfuscation/string/concat::applescript-concatenated-curl
  - id: metadata/lang/source/literal/fragment/sequence::applescript-fragmented-curl-flags
  any:
  - id: objectives/evasion/masquerade/brand/meeting::teams-live-lookalike-domain
  - id: objectives/evasion/masquerade/brand/meeting::meeting-live-lookalike-domain
  - id: micro-behaviors/communications/url/resource-path/automation::applescript-https-script-or-update-url
