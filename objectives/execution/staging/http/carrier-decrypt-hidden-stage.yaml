# Encrypted-second-stage dropper shape: a fetched carrier is carved at a
# delimiter, the tail decoded and decrypted, and the plaintext staged beneath
# a hidden dot-entry in the user's home. Each role is required in one file, so
# an unrelated archive member cannot supply a leg, and proximity keeps the
# roles in one region of larger files.
#
# These are same-file co-occurrences, not proven data flow. A local carrier
# without a remote fetch (an offline "restore" script for the user's own
# backup) lacks the source leg and stays with the lower-severity container
# traits; an ordinary downloader that writes what it fetched lacks the carve
# and decrypt legs. No execution is claimed: the staged bytes may wait for a
# later stage outside this file.
defaults:
  platforms: [unix, windows]
  for: [python, shell]
  attack: T1105,T1027.009

composite_rules:
  # Role alternatives. Each group states one required role of the chain and
  # stays neutral on its own; the chain composite below owns the claim.
  - id: remote-fetch-alternative
    desc: Fetches a remote body over HTTP
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/client/response-body::remote-response-body-read
      - id: micro-behaviors/communications/http/download/shell::shell-curl-wget-url-fetch
      - id: micro-behaviors/communications/http/download/shell::shell-fetch-variable-http-url

  - id: decryption-alternative
    desc: Decrypts content with a symmetric cipher
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/crypto/decrypt/transform/symmetric::pycrypto-aes-decrypt-context
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::python-decrypt-base64-ciphertext
      - id: micro-behaviors/crypto/decrypt/transform/symmetric::openssl-aes-decrypt

  - id: python-hidden-home-write
    desc: Python writes beneath a hidden home dot-path
    crit: notable
    conf: 0.9
    for: [python]
    all:
      # XDG base directories (~/.local/share, ~/.cache, ~/.config) are where
      # ordinary applications cache downloaded data; a licensed asset pack
      # decrypted into ~/.local/share/<app>/ is not hidden staging.
      - id: micro-behaviors/fs/path/user-directory::home-custom-hidden-dotdir
      - id: python-file-write-alternative

  # Any writable open() or Path.write_bytes; the members already surface
  # as notable file-write atoms, so the grouping itself is a component and
  # claims no staging (the hidden home dot-path leg supplies that).
  - id: python-file-write-alternative
    desc: Python writes a file via open or write_bytes
    crit: component
    conf: 0.9
    for: [python]
    any:
      - id: micro-behaviors/fs/file/io-mode::write-append-create-mode
      - id: micro-behaviors/fs/write/file/full/bytes::python-pathlib-write-bytes

  - id: hidden-home-write-alternative
    desc: Hidden home dot-path staging alternative
    crit: notable
    conf: 0.9
    any:
      - id: python-hidden-home-write
      - id: micro-behaviors/fs/write/user-paths::shell-redirect-hidden-home-dotpath

  # Suspicious, not hostile: a licensed asset pack fetched, split at a header
  # marker, decrypted with a per-user key and cached under a legacy ~/.<app>
  # directory has the same four roles. The hostile reading needs a disguise
  # (font-delimited-encrypted-remote-payload) or a launch of the staged bytes
  # (the encrypted-font execution composites), which supply it separately.
  - id: decrypted-carrier-hidden-stage
    desc: Fetched payload decrypted and staged hidden
    crit: suspicious
    conf: 0.93
    scope: file
    near_lines: 40
    all:
      - id: remote-fetch-alternative
      - id: micro-behaviors/data/buffer/carve::delimited-input-tail
      - id: decryption-alternative
      - id: hidden-home-write-alternative

  - id: font-carrier-decrypted-hidden-stage
    desc: Fetched font carrier decrypted and staged to hidden home path
    crit: hostile
    conf: 0.96
    scope: file
    near_lines: 40
    all:
      - id: decrypted-carrier-hidden-stage
      - id: micro-behaviors/fs/path/font::quoted-font-path

