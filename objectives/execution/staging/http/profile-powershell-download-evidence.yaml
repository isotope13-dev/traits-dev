---
defaults:
  platforms:
  - windows
  for:
  - powershell
composite_rules:
- id: iwr-zoomsdk-chromechip-log
  desc: ZoomSDK IWR chromechip log
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/client/library::iwr-name
  - id: micro-behaviors/fs/path/log/application::chromechip-log-text-ci
  - id: well-known/lib/vendor-sdk/zoom::zoomsdk-text-reference
  any:
  - id: micro-behaviors/communications/http/user-agent::powershell-useragent-token
  - id: micro-behaviors/communications/http/download/cli/web-cmdlet::iwr-outfile-download
- id: iwr-zoomsdk-outfile
  desc: ZoomSDK IWR OutFile download
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/client/library::iwr-name
  - id: micro-behaviors/communications/http/download/cli/web-cmdlet::iwr-outfile-download
  - id: well-known/lib/vendor-sdk/zoom::zoomsdk-text-reference
  any:
  - id: micro-behaviors/communications/http/user-agent::powershell-useragent-token
