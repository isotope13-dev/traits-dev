defaults:
  platforms: [macos]
  for: [pkg]
  attack: T1553.001
composite_rules:
- id: macpkg-hook-fetch-dylib-strip-quarantine
  desc: Installer hook downloads executable dylib, clears xattrs
  crit: hostile
  conf: 0.9
  scope: archive
  for: [scripts, '!batch', '!jcl', '!powershell', '!vbs', pkg]
  all:
    - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
    - id: micro-behaviors/communications/http/download/curl::curl-output-staging-path
    - id: micro-behaviors/fs/path/library::dylib-name-literal
    - id: micro-behaviors/fs/attributes/xattr::xattr-clear
    - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-target
