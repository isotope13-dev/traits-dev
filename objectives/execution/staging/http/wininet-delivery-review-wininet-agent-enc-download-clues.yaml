defaults:
  platforms: [unix, windows]
  for: [pe, dll]
  attack: T1105
  mbc: E1105
composite_rules:
  - id: wininet-agent-enc-download-clues
    crit: hostile
    desc: WinINet, agent.enc and execution clues
    conf: 0.97
    attack: T1105,T1027.002
    platforms:
      - windows
    size_max: 65536
    all:
      - id: micro-behaviors/communications/http/client/wininet::wininet-session-request-api-set
      - id: micro-behaviors/communications/http/client/wininet::internet-read-file
      - id: micro-behaviors/communications/http/download/url::staged-agent-enc-url-reference-pe
    any:
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
    unless:
      - id: metadata/installer/product/
