defaults:
  crit: hostile
  conf: 0.95
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]

composite_rules:
  - id: python-download-name-temp-ip-clues
    crit: suspicious
    desc: Python download name, temp paths and IP URL
    all:
      - id: "metadata/lang/source/naming/action/function-name::download-execute-symbol-name"
      - id: micro-behaviors/fs/path/temp::multiple-temporary-directory-references
      - id: micro-behaviors/communications/url/host/oob-http::python-http-ip-port-url
  - id: python-download-name-ip-path-process-clues
    crit: suspicious
    desc: Python download name, IP URL and path/process clues
    all:
      - id: "metadata/lang/source/naming/action/function-name::download-execute-symbol-name"
      - id: micro-behaviors/communications/url/host/oob-http::python-http-ip-port-url
      - id: micro-behaviors/fs/path/hidden::temp-or-former-hidden-path
    any:
      - id: micro-behaviors/process/info/query::python-is-process-running-function
      - id: micro-behaviors/process/info/query::python-isprocessrunning-function
      - id: micro-behaviors/process/info/query::python-check-if-running-function
      - id: micro-behaviors/process/info/query::python-process-running-function
      - id: metadata/lang/source/naming/architecture::arch-64bit-string
      - id: micro-behaviors/process/create/subprocess/launch::run-ast
