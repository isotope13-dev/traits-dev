---
defaults:
  platforms:
  - windows
  for:
  - lnk
composite_rules:
- id: lnk-powershell-and-hta-url
  desc: LNK PowerShell and HTA URL references
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/process/argument/interpreter::lnk-powershell-executable-reference
  - id: micro-behaviors/communications/url/resource-path/file::lnk-text-hta-url-reference
