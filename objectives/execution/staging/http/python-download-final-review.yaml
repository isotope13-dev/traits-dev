defaults:
  platforms:
    - unix
    - windows
  for:
    - python


composite_rules:
  - id: python-shortener-process-clues
    desc: Python URL shortener and process clues
    crit: suspicious
    conf: 0.95
    near_lines: 30
    all:
      - id: micro-behaviors/communications/url/shortener::tinyurl
    any:
      - id: micro-behaviors/process/create/exec::python-subprocess-run-call-text
      - id: micro-behaviors/process/create/subprocess/launch::call-ast
