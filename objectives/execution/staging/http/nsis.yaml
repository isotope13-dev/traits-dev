defaults:
  for: [text]
  platforms: [windows]
traits:
  - id: nsis-push-http-url
    desc: Pushes URL onto installer stack
    crit: notable
    if:
      type: text
      regex: '(?im)^Push https?://[^\s]{1,180}'
  - id: nsis-inetc-get-call
    desc: Invokes installer HTTP download plugin
    crit: notable
    if:
      type: text
      regex: '(?im)^CallInstDLL \$PLUGINSDIR\\inetc\.dll get\b'
  - id: nsis-launch-temp-executable
    desc: Launches executable from temporary directory
    crit: suspicious
    if:
      type: text
      regex: '(?im)^ExecShell open \$TEMP\\[^\r\n ]{1,80}\.exe\b'
composite_rules:
  - id: nsis-http-temp-payload-launch
    desc: Installer HTTP download beside temporary executable launch
    crit: suspicious
    conf: 0.97
    attack: T1105
    near_lines: 6
    all:
      - id: nsis-push-http-url
      - id: nsis-inetc-get-call
      - id: nsis-launch-temp-executable
