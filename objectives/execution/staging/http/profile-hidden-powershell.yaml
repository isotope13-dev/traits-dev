defaults:
  platforms: [windows]
  for: [powershell]
  conf: 0.99

composite_rules:
  - id: powershell-hidden-start-with-executable-url
    desc: Executable URL and hidden PowerShell process options
    crit: notable
    all:
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
      - id: micro-behaviors/process/create/cmdlet::start-process-call
    unless:
      - id: metadata/build/recognized-contexts::sysmanage-prerequisite-installer-context
      - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context

  - id: powershell-hidden-iwr-exe-saps-profile
    desc: Hidden PowerShell EXE download and saps clues
    crit: suspicious
    all:
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::powershell-iwr-exe-to-temp
      - id: micro-behaviors/process/create/cmdlet::saps-alias
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-window
