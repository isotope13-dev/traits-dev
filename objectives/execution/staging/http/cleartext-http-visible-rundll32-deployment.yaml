# The same saved-path relationship with an explicitly visible Run call.
# Call facts do not link two calls by the identity of their path variable.
# Keep the hidden-window observation separate, without broadening its claim.
defaults:
  platforms: [windows]
  for: [javascript]
  crit: notable
composite_rules:
  - id: cleartext-http-visible-rundll32-deployment
    desc: Cleartext HTTP bytes staged for visible rundll32
    crit: suspicious
    conf: 0.95
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/deploy/file-exec/spawn::parsed-adodb-saved-path-visible-rundll32
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/fs/write/stream::js-responsebody-variable-write
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-com
      - id: micro-behaviors/communications/url/host/domain-http::js-insecure-remote-http-url
