defaults:
  for: [data]
  platforms: [windows, unix]


composite_rules:
  - id: flash-version-and-http-stage-clues
    desc: Flash version probe and HTTP stage clues
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/os/sysinfo/platform/version::flash-player-version-query
      - id: micro-behaviors/communications/http/download/url::flash-geturl2-http-stage
