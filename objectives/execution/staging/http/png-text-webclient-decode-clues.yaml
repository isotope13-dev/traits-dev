defaults:
  platforms:
    - windows
  for:
    - png
    - text
  crit: suspicious
composite_rules:
  - id: png-text-webclient-decode-clues
    desc: PNG or text carrier with WebClient download and decode clues
    conf: 0.99
    all:
      - id: well-known/lib/runtime/scripted/windows-script-host::wscript-shell-text
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/communications/http/download/webclient::downloadfile-exe-windows-tasks-text
      - id: micro-behaviors/communications/http/client/webclient::downloadstring-text
