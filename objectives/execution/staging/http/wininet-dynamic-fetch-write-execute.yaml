# Zlob-style Trojan-Downloader: the WinINet HTTP workflow (open, connect,
# request, send, read) is resolved at runtime with LoadLibraryA/GetProcAddress,
# so only a connectivity check stays statically imported and import-only
# matchers miss the fetch. The fetched bytes are written to disk and a new
# process is started from the same image. Ordinary updaters and installers
# keep their WinINet APIs in the import table instead of resolving each one
# dynamically, and signed or installer carriers are excluded below.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105
  mbc: E1105
composite_rules:
  - id: dynamic-wininet-fetch-write-execute
    desc: Dynamic WinINet download written to disk and launched
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/dynamic::dynamic-wininet-http-api-cluster
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
      - id: micro-behaviors/process/create/exec::child-process-creation-evidence
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/installer/product/
      # The SZ freeware's self-updater downloads and launches its new build.
      - id: well-known/app/utility/the-sz::the-sz-freeware-context
