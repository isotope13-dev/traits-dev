defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105
  mbc: E1105
composite_rules:
- id: packed-urlmon-wininet-winsock-clues
  crit: suspicious
  desc: Packed URLMon, WinINet and Winsock clues
  conf: 0.99
  size_max: 524288
  all:
  - id: metadata/binary/resource/table::wide-settings-resource-name
