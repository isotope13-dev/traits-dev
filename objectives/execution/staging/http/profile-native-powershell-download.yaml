# Download and command references do not prove AMSI was disabled or a file ran.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: native-powershell-archive-wininet-clues
  desc: PowerShell archive and WinINet references
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/process/deploy/interpreter-command::powershell-command-text
  - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive-text
  - id: micro-behaviors/communications/http/client/wininet::internet-connect
- id: native-amsi-field-download-invokeitem-clues
  desc: Encoded AMSI field, download and Invoke-Item clues
  crit: suspicious
  conf: 0.95
  all:
  - id: objectives/evasion/anti-av/amsi::base64-amsi-init-failed-field
  - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
  - id: micro-behaviors/os/handler/open::powershell-invoke-item
  - id: micro-behaviors/communications/url/scheme::http-url-shaped-text
