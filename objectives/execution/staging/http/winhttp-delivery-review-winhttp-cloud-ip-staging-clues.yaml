defaults:
  for: [pe]
  platforms: [windows]
  attack: T1105
  mbc: E1105
composite_rules:
  - id: winhttp-cloud-ip-staging-clues
    desc: WinHTTP, cloud URL and IP staging clues
    crit: suspicious
    conf: 0.95
    size_max: 524288
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-downloader-flow-text
      - id: well-known/app/storage/google-drive::gdrive-download-url
      - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
    any:
      - id: micro-behaviors/communications/url/query/selection::good-substr-query-path
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/os/sysinfo/directories::temp-path-api-name
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
    needs: 2
