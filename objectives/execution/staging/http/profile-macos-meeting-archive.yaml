defaults:
  platforms: [macos]
  for: [macho, shell]

composite_rules:
  - id: macos-zip-app-download-staging
    desc: macOS app ZIP download and extraction staging
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/data/archive/extract/zip::unzip-extraction
      - id: micro-behaviors/data/archive/package::app-archive-name
  - id: meeting-themed-archive-download-clues
    desc: Meeting-themed app ZIP download and extraction clues
    crit: suspicious
    conf: 0.97
    all:
      - id: objectives/execution/lure/video-meeting::meeting-app-archive-lure
      - id: objectives/execution/staging/http::macos-zip-app-download-staging
