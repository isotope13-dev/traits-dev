defaults:
  platforms: [unix, windows]
  for: [pe, dll]
  attack: T1105
  mbc: E1105
composite_rules:
  - id: wininet-raw-ip-pe-download-runner
    crit: hostile
    desc: WinINet, raw-IP and executable download clues
    conf: 0.98
    platforms:
      - windows
    size_max: 65536
    all:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/communications/http/client/wininet::wininet-session-request-api-set
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe
      - id: micro-behaviors/communications/http/client/wininet::internet-read-file
    any:
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    unless:
      - id: metadata/installer/product/
