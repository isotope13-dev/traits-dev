defaults:
  platforms:
  - macos
  for:
  - applescript
  crit: suspicious
composite_rules:
- id: applescript-curl-compile-load-clues
  desc: AppleScript curl, compile and load clues
  conf: 0.99
  all:
  - id: micro-behaviors/metaprogramming/generation/compile::applescript-osacompile-repeated-path-clues
  - id: micro-behaviors/os/module/load/path::load-script-posix-file
  any:
  - id: objectives/execution/staging/http::applescript-fragmented-curl-insecure-url-clues
  - id: objectives/execution/staging/http::applescript-url-curl-option-clues
