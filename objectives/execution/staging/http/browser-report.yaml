defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1219,T1105
composite_rules:
  - id: browser-agent-download-telegram-report
    desc: Scripted remote-agent download co-occurs with Telegram reporting
    crit: suspicious
    conf: 0.96
    all:
      - id: objectives/command-and-control/backdoor/control/rmm::remote-access-agent-delivery
      - id: micro-behaviors/communications/http/download/browser::js-scripted-anchor-download
      - id: micro-behaviors/communications/messaging/telegram::javascript-telegram-json-message
