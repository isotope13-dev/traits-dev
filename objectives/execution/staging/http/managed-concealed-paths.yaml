defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-decoder-http-byte-write-clues
    desc: AES/XOR string decoding accompanies HTTP byte retrieval and writes
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/anti-static/obfuscation/decoders::managed-base64-modulo-key-string-decoder
      - id: micro-behaviors/crypto/symmetric/aes/initialize::dotnet-aes-create-import
      - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor-text
      - id: micro-behaviors/communications/http/get::getbytearrayasync
      - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
  - id: managed-http-aes-process-hollowing
    desc: Unsigned .NET assembly fetches, decrypts and hollows process
    crit: hostile
    conf: 0.97
    attack: T1105,T1027,T1055.012
    mbc: E1055.012
    all:
      - id: micro-behaviors/communications/http/get::getbytearrayasync
      - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor-text
      - id: micro-behaviors/mem/alloc/virtual::managed-virtual-alloc-ex-call
      - id: micro-behaviors/mem/write/arbitrary::process-memory-write-call
      - id: micro-behaviors/process/thread/config::managed-thread-context-write-call
      - id: micro-behaviors/process/thread/lifecycle::resume-thread-call
    unless:
      - id: metadata/signature/verified/platform/
