defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-decoder-http-byte-write-clues
    desc: AES/XOR string decoding accompanies HTTP byte retrieval and writes
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/anti-static/obfuscation/decoders::managed-base64-modulo-key-string-decoder
      - id: micro-behaviors/crypto/symmetric/aes/initialize::dotnet-aes-create-import
      - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor-text
      - id: micro-behaviors/communications/http/get::getbytearrayasync
      - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
