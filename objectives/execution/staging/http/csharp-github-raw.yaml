defaults:
  platforms: [windows]
  for: [csharp]
composite_rules:
  - id: csharp-github-raw-temp-staging
    desc: Authenticated GitHub raw staging with temp and executable paths
    crit: suspicious
    conf: 0.94
    near_lines: 25
    all:
      - id: micro-behaviors/communications/http/download/write::csharp-http-response-file-stream
      - id: micro-behaviors/communications/http/header/accept::csharp-github-raw-media-type
      - id: micro-behaviors/communications/http/authorization-header::dotnet-bearer-auth-header
      - id: micro-behaviors/fs/path/temp::get-temp-path-raw
      - id: micro-behaviors/fs/path/executable::csharp-combine-executable-name

  - id: csharp-github-raw-temp-dropper
    desc: Single-instance C# stager pulls authenticated GitHub raw exe to temp
    crit: hostile
    conf: 0.9
    attack: T1105
    near_bytes: 4096
    all:
      - id: objectives/execution/staging/http::csharp-github-raw-temp-staging
      - id: micro-behaviors/process/sync/mutex::dotnet-mutex-constructor
