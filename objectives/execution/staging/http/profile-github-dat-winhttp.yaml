defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
- id: github-dat-winhttp-download-clues
  desc: WinHTTP GitHub DAT download clues
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-response-flow
  - id: well-known/app/development/code-forge/github::raw-githubusercontent-host-string
  - id: micro-behaviors/communications/url/resource-path/file::repository-main-dat-path
  any:
  - id: micro-behaviors/communications/http/header/value::sandbox-downloader-user-agent
  - id: micro-behaviors/fs/path/data-file::numbered-dat-name
  - id: micro-behaviors/fs/file/open/unspecified::file-create-win
  - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
  - id: metadata/binary/symbols/name/process::create-process-w
  needs: 2
