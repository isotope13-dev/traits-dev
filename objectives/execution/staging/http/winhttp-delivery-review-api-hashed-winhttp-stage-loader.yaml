defaults:
  for: [pe]
  platforms: [windows]
  attack: T1105
  mbc: E1105
composite_rules:
  - id: api-hashed-winhttp-stage-loader
    desc: API-hashed WinHTTP staged loader
    crit: hostile
    conf: 0.96
    size_max: 524288
    all:
      - id: objectives/execution/staging/http::winhttp-cloud-ip-staging-clues
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::pe-api-hashing-indicator-single
      - id: metadata/signature/absent::unsigned
    any:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/os/sysinfo/directories::temp-path-api-name
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
    needs: 3
