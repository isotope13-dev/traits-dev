defaults:
  platforms: [macos]
  for: [shell, javascript, typescript, go, python, macho]


composite_rules:
  - id: macos-architecture-curl-apple-cache-clues
    for: [shell]
    desc: Architecture-aware curl and Apple-like cache clues
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/os/sysinfo/platform/arch::arch-aware-curl-download
      - id: micro-behaviors/fs/path/cache::macos-apple-cache-directory
      - id: well-known/app/system/apple/launch-services::apple-like-cache-service-name
    near_bytes: 4096
