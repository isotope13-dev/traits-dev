defaults:
  platforms: [windows, unix, android, ios]
  for: [python]
composite_rules:
  - id: python-urlopen-write-chmod-launch-profile
    desc: Python urllib read, file output, chmod and launch clues
    crit: notable
    conf: 0.98
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/client/response-body::urlopen-response-body-read
      - id: micro-behaviors/communications/http/lib/urllib::urllib-download-to-binary-output
      - id: micro-behaviors/fs/chmod/modify::python-chmod-call-with-exec-bit
      - id: micro-behaviors/process/create/subprocess/launch::process-execution

  # A downloaded file copied to disk, made executable, and handed to a
  # detached subprocess is a payload hand-off across helper functions.
  - id: python-urlopen-detached-payload
    desc: Python detaches a downloaded file
    crit: hostile
    conf: 0.97
    platforms: [unix, windows]
    attack: T1105,T1059.006
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/communications/http/download/write::python-copyfileobj-response-handle
      - id: micro-behaviors/fs/chmod/modify::python-path-chmod
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
      - id: micro-behaviors/process/daemonize/detach::python-detached-daemon-process
