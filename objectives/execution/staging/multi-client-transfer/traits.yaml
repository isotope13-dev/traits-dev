# The shell and Python evidence comes from separate archive members. Their
# co-occurrence does not establish that they are stages of the same program.
defaults:
  platforms: [unix]

composite_rules:
  - id: multi-client-shell-download-exec
    desc: Archive contains a shell stager and Python download
    crit: notable
    conf: 0.96
    attack: T1105,T1059.004,T1222.002
    for: [archives, shell, python]
    scope: archive
    all:
      - id: micro-behaviors/process/deploy/file-exec/command::shell-download-chmod-exec
      - id: micro-behaviors/communications/http/request/client/command::curl-wget-command-position
      - id: micro-behaviors/communications/http/download/write::python-urlopen-body-written-to-file
