# Unlike a single-client stager, these scripts keep multiple independent HTTP
# transfer paths before making the downloaded file executable and launching it.
defaults:
  platforms: [unix]

composite_rules:
  - id: multi-client-shell-download-exec
    desc: Multiple HTTP clients stage and launch an executable
    crit: hostile
    conf: 0.96
    attack: T1105,T1059.004,T1222.002
    for: [archives, shell, python]
    scope: archive
    all:
      - id: micro-behaviors/process/deploy/file-exec/command::shell-download-chmod-exec
      - id: micro-behaviors/communications/http/request/client::curl-wget-command-position
      - id: micro-behaviors/communications/http/download/write::python-urlopen-body-written-to-file
