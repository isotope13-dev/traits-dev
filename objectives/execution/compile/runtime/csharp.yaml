defaults:
  for: [csharp, pe, dll]
  platforms: [windows]
traits:
- id: compile-assembly-from-file
  desc: Runtime compilation from source files
  crit: notable
  conf: 0.9
  attack: "T1027.004"
  if:
    type: symbol
    kind: call
    regex: '(^|\.)CompileAssemblyFromFile$'
- id: generate-in-memory
  desc: Compiler emits an in-memory assembly
  crit: notable
  conf: 0.94
  attack: T1027.004
  if:
    type: symbol
    kind: member
    regex: '(^|\.)GenerateInMemory$'
- id: in-memory-roslyn-emit
  desc: Roslyn emits assembly in memory
  crit: notable
  conf: 0.95
  attack: T1027.004
  for: [powershell, batch, csharp]
  if:
    type: text
    regex: (?i)(Compilation.{0,120}MemoryStream.{0,120}Emit|EtimE#E#N-1)
- id: roslyn-emit-memory-stream
  desc: Roslyn Emit call on MemoryStream variable
  crit: notable
  conf: 0.9
  attack: T1027.004
  for: [powershell, batch, csharp]
  if:
    type: text
    regex: '\.Emit\(\s*\w*[Mm]emory[Ss]tream'
- id: embedded-resource-compiler-parameter
  desc: Compiler embeds resource files
  crit: notable
  conf: 0.88
  if:
    type: text
    substr: EmbeddedResources.AddRange
composite_rules:
- id: roslyn-in-memory-emit
  desc: Roslyn in-memory assembly emit pattern
  crit: notable
  conf: 0.95
  attack: T1027.004
  for: [powershell, batch, csharp]
  any:
  - id: in-memory-roslyn-emit
  - id: roslyn-emit-memory-stream
- id: runtime-in-memory-code-compilation
  desc: Runtime C# source compilation emits an in-memory assembly
  crit: notable
  conf: 0.97
  attack: "T1027.004,T1620"
  all:
  - id: micro-behaviors/metaprogramming/generation::runtime-csharp-compilation-references
  - id: generate-in-memory
- id: runtime-executable-resource-compilation
  desc: Runtime executable resource compilation
  crit: suspicious
  conf: 0.96
  attack: "T1027.004"
  all:
  - id: micro-behaviors/process/create/compile::csharp-code-provider
  - id: compile-assembly-from-file
  - id: micro-behaviors/process/create/compile::generate-executable
  - id: embedded-resource-compiler-parameter
- id: runtime-roslyn-compilation
  desc: Runtime Roslyn C# compilation
  crit: notable
  conf: 0.97
  attack: T1027.004
  for: [powershell, batch, csharp]
  all:
  - id: roslyn-in-memory-emit
  any:
  - id: micro-behaviors/metaprogramming/ast::roslyn-syntax-tree-parse-text
  - id: metadata/lang/source/naming/function::roslyn-metadata-reference-api-text