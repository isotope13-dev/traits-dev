defaults:
  for: [csharp, pe, dll]
  platforms: [windows]
traits:
- id: csharp-code-provider
  desc: CSharpCodeProvider API reference
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: CSharpCodeProvider
- id: codedom-provider-factory
  desc: CodeDomProvider runtime compiler factory call
  crit: notable
  conf: 0.94
  if:
    type: symbol
    kind: call
    exact: CodeDomProvider.CreateProvider
- id: compile-assembly-from-source
  desc: CompileAssemblyFromSource API reference
  crit: notable
  conf: 0.95
  attack: "T1027.004"
  if:
    type: text
    substr: CompileAssemblyFromSource
- id: compile-assembly-from-file
  desc: Runtime compilation from source files
  crit: notable
  conf: 0.9
  attack: "T1027.004"
  if:
    type: symbol
    kind: call
    regex: '(^|\.)CompileAssemblyFromFile$'
- id: generate-executable
  desc: GenerateExecutable compiler API reference
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: GenerateExecutable
- id: generate-in-memory
  desc: Compiler emits an in-memory assembly
  crit: notable
  conf: 0.94
  attack: T1027.004
  if:
    type: symbol
    kind: member
    regex: '(^|\.)GenerateInMemory$'
- id: in-memory-roslyn-emit
  desc: Roslyn emits assembly in memory
  crit: notable
  conf: 0.95
  attack: T1027.004
  for: [powershell, batch, csharp]
  if:
    type: text
    regex: (?i)(Compilation.{0,120}MemoryStream.{0,120}Emit|EtimE#E#N-1)
- id: roslyn-emit-memory-stream
  desc: Roslyn Emit call on MemoryStream variable
  crit: notable
  conf: 0.9
  attack: T1027.004
  for: [powershell, batch, csharp]
  if:
    type: text
    regex: '\.Emit\(\s*\w*[Mm]emory[Ss]tream'
- id: roslyn-syntax-tree-parse
  desc: Roslyn parses source syntax tree
  crit: notable
  conf: 0.88
  for: [powershell, batch, csharp]
  if:
    type: text
    regex: (?i)Syntax.{0,16}Tree.{0,80}ParseText
- id: roslyn-metadata-reference
  desc: Roslyn metadata reference creation
  crit: notable
  conf: 0.88
  for: [powershell, batch, csharp]
  if:
    type: text
    regex: (?i)Metadata.{0,24}Reference.{0,80}CreateFromFile
- id: embedded-resource-compiler-parameter
  desc: Compiler embeds resource files
  crit: notable
  conf: 0.88
  if:
    type: text
    substr: EmbeddedResources.AddRange
composite_rules:
- id: csharp-runtime-compiler-provider
  desc: .NET runtime C# compiler provider
  crit: notable
  conf: 0.94
  any:
  - id: csharp-code-provider
  - id: codedom-provider-factory
- id: roslyn-in-memory-emit
  desc: Roslyn in-memory assembly emit pattern
  crit: notable
  conf: 0.95
  attack: T1027.004
  for: [powershell, batch, csharp]
  any:
  - id: in-memory-roslyn-emit
  - id: roslyn-emit-memory-stream
- id: runtime-code-compilation
  desc: Runtime C# code compilation
  crit: notable
  conf: 0.95
  attack: "T1027.004"
  all:
  - id: csharp-runtime-compiler-provider
  - id: compile-assembly-from-source
  unless:
  - id: well-known/lib/runtime/dotnet-runtime::dotnet-framework-system-native-image
- id: runtime-in-memory-code-compilation
  desc: Runtime C# source compilation emits an in-memory assembly
  crit: suspicious
  conf: 0.97
  attack: "T1027.004,T1620"
  all:
  - id: runtime-code-compilation
  - id: generate-in-memory
- id: runtime-executable-resource-compilation
  desc: Runtime executable resource compilation
  crit: suspicious
  conf: 0.96
  attack: "T1027.004"
  all:
  - id: csharp-code-provider
  - id: compile-assembly-from-file
  - id: generate-executable
  - id: embedded-resource-compiler-parameter
- id: runtime-roslyn-compilation
  desc: Runtime Roslyn C# compilation
  crit: notable
  conf: 0.97
  attack: T1027.004
  for: [powershell, batch, csharp]
  all:
  - id: roslyn-in-memory-emit
  any:
  - id: roslyn-syntax-tree-parse
  - id: roslyn-metadata-reference
