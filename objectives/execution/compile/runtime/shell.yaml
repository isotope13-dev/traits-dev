# A shell script that writes source code, compiles it, and runs the result.
#
# Compiling at run time is normal inside a build system; what is not normal is
# a script that *carries* the source it compiles, runs the product immediately,
# and then deletes both. That sequence exists to keep a payload out of the
# shipped archive: nothing executable is distributed, and after the build there
# is nothing left on disk to find. The 2002 sendmail source-tarball compromise
# hid a reverse shell in a heredoc inside a configure test and ran it under the
# name of the victim's login shell.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1027.004
  mbc: B0032

traits:
  - id: heredoc-writes-native-source
    desc: Heredoc writes C source to disk
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(cat|tee)\s*>+\s*\S+\.(c|cc|cpp|m)\s*<<'
  # `PATH=. $PROG` runs whatever sits in the working directory, bypassing the
  # user's real PATH. Build scripts invoke tools by name or by absolute path.
  - id: path-dot-command-prefix
    desc: Runs a program from the working directory
    crit: suspicious
    conf: 0.9
    attack: T1574.007
    if:
      type: text
      regex: 'PATH=\.[:\s]\s*[\$\./\w]'
  - id: removes-compiled-source-and-binary
    desc: Deletes the source it just compiled
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'rm\s+-f\s+[^\n;]{0,60}\.c\b'

composite_rules:
  - id: shell-compiles-and-runs-carried-source
    desc: Script compiles and runs carried source
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: heredoc-writes-native-source
      - id: micro-behaviors/process/create/shell/build/
    any:
      - id: path-dot-command-prefix
      - id: removes-compiled-source-and-binary
      - id: objectives/command-and-control/backdoor/shell/reverse::embedded-c-reverse-shell-source
    unless:
      - id: metadata/package/testing/harness/unit/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/build/autotools::autoconf-generated-script
