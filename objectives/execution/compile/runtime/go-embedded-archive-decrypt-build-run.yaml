# Actual Go run arguments distinguish compilation from toolchain probes.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - go
  attack: T1027.004,T1140,T1059
composite_rules:
- id: go-decrypt-embedded-archive-then-build-run
  desc: Archive decryption with Go compile-and-run
  crit: hostile
  conf: 0.96
  scope: file
  all:
  - id: micro-behaviors/data/archive/zip::zip-reader
  - id: micro-behaviors/fs/write/file/full::go-os-writefile
  - id: micro-behaviors/crypto/decrypt::go-gcm-open
  - id: micro-behaviors/process/argument/subcommand::go-run-child-subcommand
  unless:
  - id: objectives/execution/compile/runtime::go-gated-decrypt-and-run
