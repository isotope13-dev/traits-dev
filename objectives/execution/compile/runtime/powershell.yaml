defaults:
  platforms: [android, windows, unix]
  for: [powershell]
  attack: T1027

traits:
  - id: ps-codedom-compile-source
    desc: PowerShell compiles C# source at runtime
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: "CompileAssemblyFromSource"
    unless:
      # Ansible's Add-CSharpType module util (ansible.module_utils.powershell.
      # Ansible.ModuleUtils.AddType) legitimately compiles+loads C# module code
      # in-memory and is vendored verbatim into module_utils and integration
      # test fixtures across hundreds of collections. The Ansible.ModuleUtils
      # substr was meant to catch it but that string is only in the FILENAME,
      # not the body; the function definition is the reliable anchor.
      - type: text
        substr: Ansible.ModuleUtils
      - type: text
        regex: 'Function\s+Add-CSharpType\b'
      - type: text
        substr: required extended attribute for the source to be trusted

  - id: ps-roslyn-compile-source
    desc: PowerShell Roslyn compile source
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: "CSharpCompilation"
    unless:
      # Ansible's Add-CSharpType module util (ansible.module_utils.powershell.
      # Ansible.ModuleUtils.AddType) legitimately compiles+loads C# module code
      # in-memory and is vendored verbatim into module_utils and integration
      # test fixtures across hundreds of collections. The Ansible.ModuleUtils
      # substr was meant to catch it but that string is only in the FILENAME,
      # not the body; the function definition is the reliable anchor.
      - type: text
        substr: Ansible.ModuleUtils
      - type: text
        regex: 'Function\s+Add-CSharpType\b'
      - type: text
        substr: required extended attribute for the source to be trusted

  - id: ps-inmemory-assembly-load
    desc: PowerShell in-memory assembly load
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'Assembly\]::Load\(\$ms\.ToArray\(\)\)|CompiledAssembly'
    unless:
      # Ansible's Add-CSharpType module util (ansible.module_utils.powershell.
      # Ansible.ModuleUtils.AddType) legitimately compiles+loads C# module code
      # in-memory and is vendored verbatim into module_utils and integration
      # test fixtures across hundreds of collections. The Ansible.ModuleUtils
      # substr was meant to catch it but that string is only in the FILENAME,
      # not the body; the function definition is the reliable anchor.
      - type: text
        substr: Ansible.ModuleUtils
      - type: text
        regex: 'Function\s+Add-CSharpType\b'
      - type: text
        substr: required extended attribute for the source to be trusted

composite_rules:
  - id: ps-compile-load-assembly
    desc: PowerShell compile-load assembly
    crit: hostile
    conf: 0.98
    all:
      - id: ps-inmemory-assembly-load
    any:
      - id: ps-codedom-compile-source
      - id: ps-roslyn-compile-source
    unless:
      - id: well-known/tool/sysadmin/alpine-packages::alpine-ansible-core-package
      - id: well-known/tool/sysadmin/container/
