# Compile-then-run and runtime compiler context. A compiler invocation alone
# is a capability; these profiles require a nearby execution-oriented shape.
defaults:
  platforms: [unix, windows]
  for: [python, shell]
  crit: suspicious
  attack: T1059
  mbc: E1059
traits:
  - id: gcc-compile-execute
    desc: GCC compile followed by execution
    conf: 0.85
    if:
      type: string_literal
      regex: (?i)\bgcc\b[^;\n]{0,120}&&\s*(exec\s+)?[./][A-Za-z0-9_./-]+
    unless:
      - id: well-known/lib/platform/wine::wine-source-tree
      - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
      - id: well-known/tool/reverse-engineering/radare2::radare2-go-module-source-path
      - id: well-known/tool/offensive/bingo/
      - id: metadata/package/testing/harness/runtime::benchmark-task-agent-record
  - id: compiler-payload-build-gcc
    desc: GCC builds source then executes
    conf: 0.8
    if:
      type: string_literal
      regex: \b(gcc|g\+\+)\b.{0,15}\.(c|cpp|o).{0,15}exec
  - id: compiler-payload-build-clang
    desc: Clang builds source then executes
    conf: 0.8
    if:
      type: string_literal
      regex: \b(clang|cc)\b.{0,15}\.(c|cpp|o).{0,15}exec
composite_rules:
  - id: compiler-execution
    desc: Compile and execute payload
    conf: 0.9
    any:
      - id: gcc-compile-execute
      - id: compiler-payload-build-gcc
      - id: compiler-payload-build-clang
