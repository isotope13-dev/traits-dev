# The bound run-subcommand observation also covers CommandContext.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - go
  attack: T1027.004,T1140,T1059
composite_rules:
- id: go-gated-decrypt-and-run
  desc: Gated archive decryption with Go compile-and-run
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/data/archive/zip::zip-reader
  - id: micro-behaviors/crypto/decrypt::go-gcm-open
  - id: micro-behaviors/fs/write/file/full::go-os-writefile
  - id: micro-behaviors/process/argument/subcommand::go-run-child-subcommand
  any:
  - id: micro-behaviors/crypto/hash/digest::go-fixed-sha256-comparison
  - id: micro-behaviors/crypto/hash/digest::go-hex-digest-literal-comparison
  - id: micro-behaviors/data/control-flow/branch::go-large-integer-field-comparison
