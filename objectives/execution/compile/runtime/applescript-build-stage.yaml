defaults:
  platforms: [macos]
  for: [applescript]
  crit: notable
  conf: 0.95
traits:
  - id: applescript-remote-compile-command-fragment
    desc: Pipe to encrypted AppleScript compilation
    if:
      type: text
      substr: '| osacompile -x -o'
  - id: applescript-build-vendor-parameter
    desc: Build vendor request parameter
    if:
      type: text
      substr: '&build_vendor='
  - id: applescript-build-version-parameter
    desc: Build version request parameter
    if:
      type: text
      substr: '&build_version='
  - id: applescript-framework-stage-path
    desc: AppleScript under CoreFrameworks directory
    if:
      type: text
      regex: '/CoreFrameworks/[^[:space:]]+\.scpt'
composite_rules:
  # These are fragments from compiled AppleScript; their co-occurrence does
  # not by itself prove that the remote script ran successfully.
  - id: compiled-build-tagged-remote-script-stage
    desc: Compiled build-tagged remote script staging
    crit: hostile
    conf: 0.97
    attack: T1059.002,T1105
    all:
      - id: applescript-remote-compile-command-fragment
      - id: applescript-build-vendor-parameter
      - id: applescript-build-version-parameter
      - id: applescript-framework-stage-path
      - id: micro-behaviors/process/create/shell/command-string::applescript-build-names-shell-call-clues
