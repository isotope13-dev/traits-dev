# A VB builder that fetches encrypted program source from a URL, decrypts
# it, and compiles it to a standalone executable with CodeDOM. The source
# never ships with the builder, so the compiled stub cannot be reviewed
# from the builder itself: a malware-stub build path, not a plugin system.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027.004

composite_rules:
  - id: vb-download-decrypt-compile-executable
    desc: VB compiles downloaded encrypted source to EXE
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::vb-download-string-then-decrypt
      - id: micro-behaviors/metaprogramming/generation/compile::compile-assembly-from-source-ref
      - id: micro-behaviors/metaprogramming/generation/compile::generate-executable
