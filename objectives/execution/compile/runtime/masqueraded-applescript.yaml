defaults:
  platforms: [macos]
  for: [shell, applescript]
composite_rules:
  - id: apple-agent-remote-applescript-compile
    desc: Apple-masqueraded agent compiles downloaded AppleScript
    crit: hostile
    conf: 0.98
    attack: T1059.002,T1105
    all:
      - id: objectives/evasion/masquerade/identity/service::user-launchagent-apple-label-masquerade
      - id: micro-behaviors/process/create/script/apple-event::curl-pipe-osacompile
      - id: micro-behaviors/process/create/script/apple-event::shell-osascript-variable-command
