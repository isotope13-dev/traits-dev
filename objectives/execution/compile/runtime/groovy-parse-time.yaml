# Groovy code that runs while the script is being compiled, not when it runs.
#
# A sandbox that guards Groovy by intercepting execution -- a SecureASTCustomizer,
# a whitelist of allowed method calls, a "just parse it and check it first" step --
# has already lost if the payload fires during the parse:
#
#   @groovy.transform.ASTTest(value={
#       assert java.lang.Runtime.getRuntime().exec("calc")
#   })
#   def x
#
# `@ASTTest` is meant for compiler-plugin authors to assert things about the
# syntax tree; its closure is evaluated by the compiler. `@GrabResolver` plus
# `@Grab` is the same idea aimed at the network: the dependency is fetched and
# put on the classpath while the script is being read, from whatever repository
# root the annotation names, with `@GrabConfig(disableChecksums=true)` to stop
# anything objecting to what comes back.
defaults:
  platforms: [unix, windows]
  for: [groovy, java, kotlin, scala]
  attack: T1059,T1195.001
  mbc: E1059

traits:
  - id: groovy-asttest-annotation
    desc: Groovy ASTTest compile-time closure
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: 'groovy.transform.ASTTest'
    unless:
      # Compiler-plugin and AST-transform test suites import ASTTest to
      # exercise the transform itself; the annotation under test is the
      # fixture, not a parse-time payload.
      - id: metadata/package/testing/presence/harness::test-directory

  - id: groovy-grab-resolver-root
    desc: Grab resolver names a repository root
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '@GrabResolver\s*\(\s*[^)]{0,60}root\s*='

  - id: groovy-grab-checksums-disabled
    desc: Grab configured to skip checksums
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '@GrabConfig\s*\(\s*disableChecksums\s*=\s*true'

composite_rules:
  - id: groovy-parse-time-execution
    for: [java, kotlin]
    desc: Groovy executes during compilation
    crit: hostile
    conf: 0.95
    any:
      - id: groovy-asttest-annotation
      - id: groovy-grab-resolver-root
      - id: groovy-grab-checksums-disabled
    all:
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
