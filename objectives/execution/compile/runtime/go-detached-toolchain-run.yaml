# The bound run-subcommand observation also covers CommandContext.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - go
  attack: T1059,T1127
composite_rules:
- id: go-detached-toolchain-run
  desc: Gated encrypted Go loader releases its child
  crit: suspicious
  conf: 0.9
  near_lines: 40
  all:
  - id: objectives/execution/compile/runtime::go-gated-decrypt-and-run
  - id: micro-behaviors/process/control/wait::go-process-release
