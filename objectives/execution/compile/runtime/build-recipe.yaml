# A build recipe that compiles a source file, runs it, and pipes what it prints
# into a shell.
#
# The openssh 3.4p1 trojan of 2002 added one line to
# `openbsd-compat/Makefile.in`:
#
#   @ $(CC) bf-test.c -o bf-test; ./bf-test>bf-test.out; sh ./bf-test.out &
#
# `bf-test.c` looked like a Blowfish compatibility check and its real body
# XOR-decoded an 800-byte array to stdout. Nothing in the tree contains a
# readable script: the payload only exists while `make` is running.
#
# A recipe line legitimately compiles and runs a probe -- autoconf does it
# constantly -- but it reads the *exit status*, never the program's stdout as
# a script. Interpreting the output is the tell, and it survives renaming the
# helper, switching `$(CC)` for `gcc`, or piping instead of using a temp file.
defaults:
  platforms: [unix]
  for: [shell, text]
  attack: T1195.002,T1059.004
  mbc: B0024

traits:
  - id: recipe-compiles-runs-and-shells-output
    desc: Recipe compiles, runs, then shells output
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(\$\(CC\)|g?cc|clang)\s+[\w./-]{1,30}\.c[^\n]{0,80};[^\n]{0,40};\s*(sh|bash|\.)\s'

  # A build recipe that evaluates a computed variable and pipes the result
  # into a shell executes content that exists nowhere in the tree as text.
  # Probes read exit statuses; `eval $var | $SHELL` runs the variable.
  - id: build-eval-variable-piped-to-shell
    desc: Evaluated build variable piped to a shell
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'eval\s+\$[A-Za-z_][\w$]*\s*\|\s*(\$SHELL|\bsh\b|\bbash\b)'

  # A `tr` invocation whose first translation set carries escape sequences
  # is a staged stream decoder, not whitespace normalization: ordinary
  # plumbing (`tr -d '\r'`, `tr 'a-z' 'A-Z'`, single-char separators) never
  # needs escapes inside a set.
  - id: recipe-staged-tr-decoder
    desc: Build recipe stages a tr stream decoder
    crit: component
    conf: 0.88
    if:
      type: text
      regex: 'tr\s+[''"][^''"]{0,40}\\[tnr\\][^''"]{0,40}[''"]\s+[''"][^''"]{2,80}[''"]'

composite_rules:
  - id: build-recipe-executes-program-output
    desc: Build recipe shells its own program output
    crit: hostile
    conf: 0.96
    any:
      - id: recipe-compiles-runs-and-shells-output
      - id: micro-behaviors/process/create/shell/pipeline::local-program-output-to-shell
    all:
      # The helper prints something that is not in the file as text -- the
      # payload lives only in the pipe between it and the shell.
      - id: micro-behaviors/crypto/symmetric/xor/emit::xor-decoded-array-to-stream

  # The tr-decoded twin of the composite above: instead of compiling a
  # helper, the recipe decodes a byte stream with a staged `tr` decoder and
  # evals the result into a shell. Same tell -- the executed script exists
  # nowhere in the tree -- reached through translation tables rather than a
  # compiler. Seen in the xz 5.6.0/5.6.1 build-to-host stage one, where a
  # `tr "\t \-_\" \" \t_\-"` map feeds `eval $gl_config_gt | $SHELL`.
  - id: build-recipe-executes-decoded-variable
    desc: Build recipe executes a decoded variable
    crit: hostile
    conf: 0.95
    all:
      - id: build-eval-variable-piped-to-shell
      - id: recipe-staged-tr-decoder
    unless:
      - id: metadata/package/testing/
