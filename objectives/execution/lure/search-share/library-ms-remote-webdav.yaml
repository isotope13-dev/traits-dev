# A Windows library (.library-ms) or search connector (.searchConnector-ms)
# whose folder location is a WebDAV share on another server. Double-clicking
# it opens an Explorer window that shows the remote share's files as a local
# folder, so the victim launches the attacker's .lnk/.url/script stage
# from it (AsyncRAT, XWorm and Remcos delivery). SharePoint and OneDrive
# library mappings are excluded by the location atom.
defaults:
  platforms: [windows]
  for: [xml]
  attack: T1204.002,T1105

composite_rules:
  - id: shell-location-remote-webdav-lure
    desc: Library file opens remote WebDAV folder
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/file/format/windows-shell::shell-location-document
      - id: micro-behaviors/communications/http/webdav::shell-location-webdav-unc-url
