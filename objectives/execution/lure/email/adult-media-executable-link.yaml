# An adult-media offer near a Windows executable link. Their short proximity
# excludes ordinary adult-content references and unrelated download links.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1204.002
  mbc: E1203

traits:
  - id: adult-media-video-bait
    desc: Adult-content video bait text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(free|watch)\b[^<]{0,60}\b(video|photo)\b[^<]{0,40}\b(nude|naked|porn)\b'
      exclude_html_comments: true
      case_insensitive: true

composite_rules:
  - id: adult-media-executable-lure
    desc: Adult-media lure links an executable
    crit: hostile
    conf: 0.94
    near_bytes: 250
    all:
      - id: adult-media-video-bait
      - id: micro-behaviors/communications/url/navigation-http::executable-html-hyperlink
