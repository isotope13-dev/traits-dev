# Payment-dispute mail whose "payment details" attachment is a Windows
# program. A message carrying an executable, directly or inside an archive,
# is uncommon but has legitimate uses (a vendor sending a tool), so that
# delivery alone is suspicious. Telling the reader the attachment holds
# their payment or billing details while it is in fact a program is the
# deception: no billing record is an executable.
#
# Worked example: a 2006 "[order ref N] Credit Card Chargeback" .msg from a
# spoofed hosting billing desk, carrying `ref N.zip` whose only member is an
# FSG-packed `ref N.exe` downloader.
#
# The attachment is analyzed as a member of the message and its findings are
# lifted onto the message; the body legs carry no member location, so only
# outer scope pools them. The archive types admit the lifted member-name
# finding; the Outlook legs still require the input to be the message.
defaults:
  platforms: [windows]
  for: [msg, oledoc, zip, 7z, rar, cab]
  attack: T1566.001,T1204.002
  mbc: E1204

composite_rules:
  - id: message-executable-attachment
    desc: Outlook message delivers a Windows program
    crit: suspicious
    conf: 0.88
    scope: outer
    all:
      - id: metadata/document/ole::outlook-message
      - id: metadata/document/ole::outlook-message-attachment
    any:
      - id: metadata/document/ole::outlook-message-executable-attachment
      - id: metadata/archive/member/extension::archive-windows-executable-entry
      - id: metadata/archive/layout::archive-misplaced-executable-member
  - id: payment-details-executable-attachment
    desc: Payment-details mail attaches a Windows program
    crit: hostile
    conf: 0.93
    scope: outer
    all:
      - id: message-executable-attachment
      - id: micro-behaviors/communications/email/content::payment-details-attachment-pointer
