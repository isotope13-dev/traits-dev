# An email whose attachment is an SVG carrying script. No mail client runs
# script in an SVG, so the only purpose of attaching one is to have the
# recipient open it in a browser, where it runs as a page: the SVG-smuggling
# lure that assembles a download or a credential form client-side, out of
# reach of the mail gateway's static scan.
#
# The attachment is analyzed as a member of the message and its findings are
# lifted onto the message, so file scope sees them; its own findings
# (the decoder, the obfuscation) roll up beside this one; this rule records
# the delivery. Attachment names are the sender's choice and often disguise
# the type (`.xhtml`, `.html`, `.pdf.svg`), so the SVG leg is content-typed.
#
# Worked example: a Colombian judicial-notice lure forwarded inside a bank's
# incident desk (Sept 2026), attaching a 7.7 MB SVG named `...Decomiso.xhtml`
# whose script XOR-decrypts a Base64 payload assembled from scrambled shards.
defaults:
  platforms: [windows, unix]
  attack: T1566.001,T1027.006
  mbc: E1204

composite_rules:
  - id: email-attaches-scripted-svg
    desc: Email attaches an SVG that carries script
    crit: hostile
    conf: 0.93
    for: [oledoc, svg]
    # The message and its attachments are one delivery: the envelope legs
    # carry no member location and the SVG leg carries the attachment's, so
    # only outer scope pools them. Nothing unrelated can join -- the input is
    # the message.
    scope: outer
    all:
      - id: metadata/document/ole::outlook-message
      - id: metadata/document/ole::outlook-message-attachment
      - id: micro-behaviors/data/format/html::inline-svg-script-body
