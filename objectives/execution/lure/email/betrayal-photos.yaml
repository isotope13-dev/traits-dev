# Betrayal-bait lures: a "friend" warns the reader their partner is being
# unfaithful and offers photo proof, with the call to action downloading a
# Windows executable. No legitimate page pairs an infidelity warning with an
# executable download; the pretext atoms stay notable so genuine relationship
# advice pages do not convict, and the executable link supplies the abuse.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1204.002
  mbc: E1203

traits:
  - id: betrayal-photos-pretext
    desc: Claims partner betrayal with photo proof
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'tra.{0,2}do[^<]{0,110}fotos|cheating[^<]{0,110}photos'
      case_insensitive: true
      exclude_html_comments: true

  - id: fake-friend-claim
    desc: Fake friend greeting in lure copy
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: "sou um amigo!|um amigo!|i'?m a friend!"
      case_insensitive: true
      exclude_html_comments: true

  - id: fake-friend-urgent-notice
    desc: Urgent-notice lure phrase
    crit: component
    conf: 0.85
    if:
      type: text
      regex: 'um aviso|this is a warning'
      case_insensitive: true
      exclude_html_comments: true

composite_rules:
  - id: betrayal-photos-executable-lure
    desc: Betrayal warning links photo bait to executable
    crit: hostile
    conf: 0.95
    near_bytes: 2000
    all:
      - id: betrayal-photos-pretext
      - id: micro-behaviors/communications/http/url/navigation::executable-html-hyperlink

  - id: fake-friend-notice-executable-lure
    desc: Fake friend warning links to executable
    crit: hostile
    conf: 0.94
    near_bytes: 2000
    all:
      - id: fake-friend-claim
      - id: fake-friend-urgent-notice
      - id: micro-behaviors/communications/http/url/navigation::executable-html-hyperlink
