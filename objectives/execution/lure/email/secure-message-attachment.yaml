# Secure-message notification lures: a wire/encrypted-mail notice telling the
# recipient to open an attached HTML page, which harvests the password
# instead. Legitimate secure-message notifications also say "open the
# attachment", so conviction requires the HTML attachment structure and a
# live password input beside the lure; confirm the sender before triage.
# The `makefile` scope is deliberate: raw mailed bodies mistype as
# makefile in the file sniffer, so html-only scoping would leave the raw
# message blind.
defaults:
  platforms: [windows, unix]
  for: [html, makefile, text]
  attack: T1566.001
  mbc: E1204

traits:
  - id: secure-message-open-attachment-lure
    desc: Secure-message notice points at the attachment
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'view the secure message[\s\S]{0,60}open the attachment'
      case_insensitive: true
  - id: html-attachment-part
    desc: HTML mail part with attachment disposition
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'text/html[\s\S]{0,120}Content-Disposition: attachment'

composite_rules:
  - id: secure-message-htm-harvest-lure
    desc: Secure-message lure with HTML password harvest
    crit: hostile
    conf: 0.95
    all:
      - id: secure-message-open-attachment-lure
      - id: html-attachment-part
      - id: objectives/credential-access/phishing/landing::harvest-password-input
