# Invoice-proforma zip lures: a payment-pressure invoice mail (stamp, sign
# and return the proforma so payment can proceed) carrying a zip archive,
# blasted with no visible recipients and posing as a thread reply. A zip
# alone is ordinary and invoices are legitimate business, so each leg is
# only notable; the pairing turning suspicious is the pressure lure plus
# the executable container plus the bulk/forged-thread shape. The
# attachment payload itself stays opaque to the scanner (the archived
# executable never surfaces as decoded strings), so this records the
# delivery for triage: confirm the sender and detonate the zip. The
# `makefile` scope is deliberate: raw mailed bodies mistype as makefile
# in the file sniffer, so html-only scoping would leave them blind.
defaults:
  platforms: [windows, unix]
  for: [html, makefile, text]
  attack: T1566.001

traits:
  - id: proforma-invoice-pressure-lure
    desc: Proforma-invoice payment-pressure lure text
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: 'proforma|factura'
      case_insensitive: true
    unless:
      - id: metadata/file/format/security-corpus::trait-expectation-catalog

  - id: zip-attachment-part
    desc: Zip mail part with attachment disposition
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'application/zip[\s\S]{0,120}Content-Disposition: attachment'
  - id: bcc-blast-recipients
    desc: Mail addressed to undisclosed recipients
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: 'undisclosed-recipients'
  - id: reply-subject-marker
    desc: Mail subject poses as a thread reply
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '^Subject: RE:'
  - id: in-reply-to-header
    desc: Mail has an In-Reply-To header
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '^In-Reply-To:'
  - id: references-header
    desc: Mail has a References header
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '^References:\s*<'

composite_rules:
  - id: invoice-zip-payment-lure
    desc: Proforma-invoice pressure mail with zip
    crit: suspicious
    conf: 0.9
    all:
      - id: proforma-invoice-pressure-lure
      - id: zip-attachment-part
      - id: bcc-blast-recipients
  - id: fabricated-reply-zip-lure
    desc: Reply-posing zip mail without thread headers
    crit: suspicious
    conf: 0.88
    all:
      - id: reply-subject-marker
      - id: zip-attachment-part
    unless:
      - id: in-reply-to-header
      - id: references-header
