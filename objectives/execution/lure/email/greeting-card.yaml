defaults:
  platforms: [windows, unix]
  for: [html]
  crit: hostile
  conf: 0.98

composite_rules:
  - id: greeting-card-executable-pickup
    desc: Card-pickup instructions link an executable
    all:
      - id: micro-behaviors/ui/dialog/prompt::greeting-card-pickup-notice
      - id: micro-behaviors/communications/http/url/navigation::executable-html-hyperlink
      - id: micro-behaviors/ui/dialog/prompt::card-pickup-browser-instruction
