defaults:
  platforms: [windows, unix]
  for: [html]
  crit: hostile
  conf: 0.98

composite_rules:
  - id: greeting-card-executable-pickup
    desc: Card-pickup instructions link an executable
    all:
      - id: micro-behaviors/ui/dialog/prompt::greeting-card-pickup-notice
      - id: micro-behaviors/communications/url/navigation-http::executable-html-hyperlink
      - id: micro-behaviors/ui/dialog/prompt::card-pickup-browser-instruction

  # The card is presented as something to launch,
  # while the page delivers a remote-access agent. Card prose or an honest
  # support download alone cannot satisfy this rule. File scope includes the
  # inline JavaScript extracted from HTML; no fetched payload is required.
  - id: greeting-card-remote-agent-installation
    desc: E-card launch instructions disguise a ScreenConnect download
    for: [html, javascript]
    scope: file
    attack: T1204.002,T1219
    all:
      - id: micro-behaviors/ui/help/interaction::ecard-launch-instruction
      - id: well-known/dual-use/remote-admin/screenconnect/client::screenconnect-clientsetup-name-script
      - id: micro-behaviors/communications/http/download/browser::js-scripted-anchor-download
