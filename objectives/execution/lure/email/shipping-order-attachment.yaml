# Shipping-order zip lures: a custom-order / parking-list notice with a
# zip archive attached, sometimes blasted as bulk "Dear All" mail. The
# archived executable never surfaces as decoded strings, so this records
# the delivery pairing for triage: confirm the sender and detonate the
# zip. Either lure wording alone also appears in legitimate logistics
# mail, so each leg is only notable; the pairing turns suspicious. The
# `makefile`/`text` scopes are deliberate: raw mailed bodies mistype as
# makefile in the file sniffer, so html-only scoping would leave the raw
# message blind.
defaults:
  platforms: [windows, unix]
  for: [html, makefile, text]
  attack: T1566.001

traits:
  - id: shipping-order-lure
    desc: Shipping-order lure wording
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: 'custom order|parking list'
      case_insensitive: true
  - id: dear-all-blast
    desc: Bulk Dear-All mail greeting
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: 'Dear All,'

composite_rules:
  - id: shipping-order-zip-lure
    desc: Shipping-order lure mail with zip
    crit: suspicious
    conf: 0.9
    all:
      - id: shipping-order-lure
      - id: zip-attachment-part
  - id: bulk-dear-all-zip-lure
    desc: Bulk Dear-All mail with zip
    crit: suspicious
    conf: 0.88
    all:
      - id: dear-all-blast
      - id: zip-attachment-part
