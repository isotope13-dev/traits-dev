# Android sideloading lures. Streaming-service and brand-lure landing pages
# that distribute Android malware share a mechanical shape: a JavaScript
# Android User-Agent gate (non-Android visitors see an error and no download
# button), an anchor or location handoff that starts an .apk download, and a
# beacon that reports the visitor's User-Agent to a distribution backend so
# the operator gets per-device notification. Pages that fingerprint which
# social in-app browser (Instagram, TikTok, Facebook) opened them do so to
# show per-app unknown-sources instructions. All legs are structural page
# mechanics, not campaign prose.
defaults:
  platforms: [android, unix, windows]
  for: [html, javascript, typescript]
  attack: T1566

composite_rules:
  - id: android-ua-gated-apk-download-lure
    desc: Android-gated web page serves an APK and reports the device
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/user-agent::android-useragent-regex-gate
      - id: micro-behaviors/communications/http/download/browser::js-apk-download-trigger
      - id: micro-behaviors/communications/http/user-agent::useragent-appended-to-url

  - id: social-inapp-browser-apk-lure
    desc: In-app browser fingerprinting page serves an APK download
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/user-agent::inapp-browser-ua-fingerprint
      - id: micro-behaviors/communications/http/download/browser::js-apk-download-trigger
    any:
      - id: micro-behaviors/communications/http/user-agent::android-useragent-regex-gate
      - id: micro-behaviors/communications/http/user-agent::mobile-user-agent-read
