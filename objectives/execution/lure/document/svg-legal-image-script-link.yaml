defaults:
  platforms: [windows, unix]
  for: [svg]
  attack: T1566,T1204

traits:
  - id: svg-legal-image-script-download
    desc: SVG legal image links to remote script
    crit: hostile
    conf: 0.97
    if:
      type: yara
      source: |
        rule svg_legal_image_script_download {
          strings:
            $image = "data:image/" nocase
            $anchor = /<a\s+[^>]{0,300}(xlink:)?href\s*=\s*["']https?:\/\/[^"'\s>]{1,500}\.(bat|cmd|vbs|ps1)([?#][^"'\s>]*)?["']/ nocase
            $legal = /(notificacion|juridic|judicial|convocatoria|citatorio)/ nocase
          condition:
            all of them
        }
