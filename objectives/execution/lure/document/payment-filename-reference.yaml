defaults:
  platforms: [windows, unix]
  for: [html]
  conf: 0.88
traits:
  - id: payment-document-archive-name
    desc: Payment-themed filename reference
    crit: component
    if:
      type: text
      regex: '(?i)(payment|invoice|remittance|receipt|neft)[^/\s"''<>]{0,60}\.(zip|rar|7z|exe|scr)\b'

