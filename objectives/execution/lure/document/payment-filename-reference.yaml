defaults:
  platforms: [windows, unix]
  for: [html]
  conf: 0.88
traits:
  - id: payment-document-archive-name
    desc: Payment-themed filename reference
    crit: component
    if:
      type: text
      regex: '(?i)(payment|invoice|remittance|receipt|neft)[^/\s"''<>]{0,60}\.(zip|rar|7z|exe|scr)\b'


  # The lure word sits inside a url= value (meta refresh or redirect
  # parameter), not in surrounding page text or comments.
  - id: url-value-payment-word
    desc: URL value names a payment document
    crit: component
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)url\s*=\s*[''"]?[^"''\s>]{0,160}(payment|invoice|remittance|receipt|neft)'
