defaults:
  platforms: [windows]
  for: [html, scripts, documents]

composite_rules:
- id: zip-xlsx-hta-lure-delivery
  desc: ZIP delivers spreadsheet-extension HTA lure
  crit: hostile
  conf: 0.97
  attack: T1204.002,T1027,T1218.005
  for: [zip, html]
  all:
    - id: metadata/archive/member/filename/role::archive-xlsx-hta-member
    - id: objectives/execution/payload/script-eval/transformed/direct::hta-hex-chunk-eval-decoder
