defaults:
  for: [pdf]
  platforms: [windows, unix]
  attack: T1204.002

traits:
  # These glyph sequences identify the reused Acrobat-themed protected-file
  # lure in decoded PDF drawing commands. They are template evidence, not a
  # claim that an arbitrary document using the same font is malicious.
  - id: pdf-acrobat-template-heading-glyphs
    desc: PDF uses Acrobat lure heading glyphs
    crit: notable
    if:
      type: value
      path: pdf.streams[*].decoded_text
      substr: '000100020003000400050006000700080009000A000B0008000C0007000D000E'
  - id: pdf-acrobat-template-body-glyphs
    desc: PDF uses Acrobat lure body glyphs
    crit: notable
    if:
      type: value
      path: pdf.streams[*].decoded_text
      substr: '00010002000300040005000600070004000800090004000A000B0004000C0008'

composite_rules:
  - id: pdf-acrobat-protected-file-archive-lure
    desc: Acrobat-themed prompt leads to archive
    crit: hostile
    conf: 0.96
    all:
      - id: pdf-acrobat-template-heading-glyphs
      - id: pdf-acrobat-template-body-glyphs
      - id: metadata/document/pdf/action::pdf-action-archive-url
