# A shortcut whose target is an executable named as a business document. The
# victim receives "Receipt 05097" or "PO #025", sees a familiar icon and a
# name with no extension in Explorer, and double-clicks a program.
#
# The shortcut is the delivery vehicle rather than the payload, which is why
# it carries no command line and nothing else here fires on it: every field is
# an ordinary shortcut field. The lie is in the target's *name*.
#
# Split in two only to stay inside the alternation budget.
defaults:
  platforms: [windows]
  for: [lnk]
  crit: suspicious
  conf: 0.9
  attack: T1204.002,T1036.005
  mbc: F0008

traits:
  - id: lnk-billing-lure-executable-target
    desc: Shortcut runs a billing-named executable
    if:
      type: value
      path: lnk.target_path
      # Truncated to the 8.3 stem: Windows shortens `receipt#008.exe` to
      # `RECEIP~1.EXE`, and `lnk.target_path` carries the short form, so
      # matching the full word missed exactly those.
      regex: '(?i)(receip|invoic)[^\\]{0,16}\.(exe|scr)$'

  - id: lnk-order-lure-executable-target
    desc: Shortcut runs an order-named executable
    if:
      type: value
      path: lnk.target_path
      # `PO#` is the other spelling malspam uses for the same lure.
      regex: '(?i)(order|po#|statement)[^\\]{0,16}\.(exe|scr)$'

composite_rules:
  # The archive-delivery dropper in full. A zip holds two files: a shortcut
  # named for a receipt or a purchase order, and -- beside it -- the program
  # the shortcut runs. Explorer hides the `.lnk` extension and shows the
  # shortcut's icon, so what the victim sees is a document and what they run
  # is a PE.
  #
  # Neither leg convicts alone: shortcuts do point at siblings, and a file can
  # legitimately be called `invoice.exe`. The pair has no innocent form,
  # because a program a vendor shipped is not something a shortcut has to
  # reach by relative path from its own directory.
  - id: lnk-lure-named-sibling-payload
    desc: Shortcut runs a document-named sibling
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/command-and-control/dropper/lnk/file-on-disk::lnk-relative-sibling-executable
    needs: 1
    any:
      - id: lnk-billing-lure-executable-target
      - id: lnk-order-lure-executable-target

  # The same lure, caught by what the builder left behind instead. The working
  # directory a shortcut carries is the one its author had -- `D:\ico`,
  # `E:\faq` -- a scratch folder on a second drive that will not exist on the
  # victim's machine. A shortcut made on the machine it runs on does not point
  # its working directory somewhere that machine has never had.
  - id: lnk-lure-named-staged-payload
    desc: Document-named shortcut from a staging dir
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/command-and-control/dropper/lnk/file-on-disk::lnk-workingdir-builder-staging-dir
    needs: 1
    any:
      - id: lnk-billing-lure-executable-target
      - id: lnk-order-lure-executable-target

  # A screensaver beside its shortcut. `.scr` is a PE that Windows runs on
  # double-click exactly like `.exe`, and no program has shipped one as its
  # entry point in twenty years -- the extension survives only because it is
  # the shortest way to make a program not look like one. Delivered as the
  # shortcut's own neighbour, it is a payload in an archive.
  - id: lnk-screensaver-sibling-payload
    desc: Shortcut runs a screensaver beside itself
    crit: hostile
    conf: 0.95
    attack: T1204.002,T1036.008
    all:
      - id: objectives/command-and-control/dropper/lnk/file-on-disk::lnk-screensaver-target
      - id: objectives/command-and-control/dropper/lnk/file-on-disk::lnk-relative-sibling-executable
