# A shortcut whose target is an executable named as a business document. The
# victim receives "Receipt 05097" or "PO #025", sees a familiar icon and a
# name with no extension in Explorer, and double-clicks a program.
#
# The shortcut is the delivery vehicle rather than the payload, which is why
# it carries no command line and nothing else here fires on it: every field is
# an ordinary shortcut field. The lie is in the target's *name*.
#
# Split in two only to stay inside the alternation budget.
defaults:
  platforms: [windows]
  for: [lnk]
  crit: suspicious
  conf: 0.9
  attack: T1204.002,T1036.005
  mbc: F0008

traits:
  - id: lnk-billing-lure-executable-target
    desc: Shortcut runs a billing-named executable
    if:
      type: value
      path: lnk.target_path
      # Truncated to the 8.3 stem: Windows shortens `receipt#008.exe` to
      # `RECEIP~1.EXE`, and `lnk.target_path` carries the short form, so
      # matching the full word missed exactly those.
      regex: '(?i)(receip|invoic)[^\\]{0,16}\.(exe|scr)$'

  - id: lnk-order-lure-executable-target
    desc: Shortcut runs an order-named executable
    if:
      type: value
      path: lnk.target_path
      # `PO#` is the other spelling malspam uses for the same lure.
      regex: '(?i)(order|po#|statement)[^\\]{0,16}\.(exe|scr)$'
