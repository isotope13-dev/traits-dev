# Script handoffs are suspicious even without a known hosting provider or RMM.
# Auto-navigation requires the target in the OpenAction dictionary itself;
# an unrelated script hyperlink and a benign page destination do not suffice.
defaults:
  for: [pdf]
  platforms: [windows, macos, linux]
  attack: T1566.001,T1204.001
traits:
  - id: pdf-uri-script-download
    desc: PDF URI links to script payload
    crit: suspicious
    conf: 0.94
    if:
      type: value
      path: pdf.actions[*].snippet
      regex: '(?i)^https?://[^/\s<>()"]+/[^\s<>()"]*\.(vbs|vbe|hta|js|jse|wsf|wsh|ps1|sh|py)([?#]|$)'
    unless:
      # A script-extension link into a public code forge documents source —
      # the Cilium 2022 fuzzing audit links its oss-fuzz-build.sh harness on
      # GitHub. Lures deliver from drop sites, not from project repositories.
      - id: metadata/document/pdf/action::pdf-uri-code-forge-target
  - id: pdf-openaction-script-download
    desc: PDF OpenAction navigates to script payload
    crit: suspicious
    conf: 0.97
    if:
      type: raw
      regex: '(?i)/OpenAction\s*<<[^<>]{0,80}/URI\s*\(https?://[^()<>]{1,220}\.(vbs|hta|ps1)([?#]|\))'
