defaults:
  platforms: [windows, unix]
  for: [markdown]
composite_rules:
  - id: raw-zip-disguised-as-image-and-page
    desc: Raw ZIP linked as both an inline image and navigation page
    crit: suspicious
    conf: 0.97
    attack: T1036.005,T1195.002,T1204.002
    all:
      - id: metadata/package/documentation/page::readme-image-source-is-zip
      - id: metadata/package/documentation/page::navigation-label-targets-zip
    any:
      - id: micro-behaviors/communications/http/url/forge::github-raw-zip-link
      - id: metadata/package/documentation/page::readme-github-raw-refs-link

