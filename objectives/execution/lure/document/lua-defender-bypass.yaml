defaults:
  platforms: [windows, unix]
  for: [zip, markdown, lua, batch, pe, text]

composite_rules:
  # Archive co-occurrence does not prove that the documentation's exact URL
  # points to the observed member, or that a legitimate component was replaced.
  # Require the deceptive image/page presentation and actual AV-bypass content.
  - id: zip-page-image-lure-with-defender-bypass
    desc: ZIP image/page lure beside Lua AV bypass
    crit: hostile
    conf: 0.98
    attack: T1204.002,T1036
    scope: outer
    all:
      - id: raw-zip-disguised-as-image-and-page
      - id: objectives/anti-static/obfuscation/string/reconstruct::archive-batch-with-indexed-lua-reassembly
      - id: objectives/evasion/anti-av/platform/defender::obfuscated-lua-defender-exclusion
