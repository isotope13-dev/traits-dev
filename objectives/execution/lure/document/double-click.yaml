defaults:
  platforms: [windows]
  for: [documents]
  attack: T1204.002
  crit: suspicious
  conf: 0.94

composite_rules:
  - id: document-double-click-execution-lure
    desc: Double-click instruction with embedded executable
    # Opening an XML file in an editor is ordinary tutorial prose. Preserve
    # the instruction observation in ui/help; an execution lure also needs
    # an executable attachment in this document, not another archive member.
    all:
      - id: micro-behaviors/ui/help::document-double-click-instruction
    any:
      - id: metadata/document/pdf/properties::pdf-embedded-native-executable
      - id: metadata/document/pdf/properties::pdf-embedded-script-payload
      - id: metadata/document/pdf/properties::pdf-embedded-jar-payload
      - id: metadata/document/office/markup::ooxml-embedded-native-executable
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
