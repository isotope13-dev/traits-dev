defaults:
  platforms: [windows]
  for: [documents]
  attack: T1204.002
  crit: suspicious
  conf: 0.94

traits:
  - id: document-double-click-execution-lure
    desc: Document instructs user to double-click object
    if:
      type: text
      regex: '(?i)\bdouble-click\s+(on\s+)?(me\b|the\s+[a-z0-9_.-]+\.[a-z]{3,4}\b)'
