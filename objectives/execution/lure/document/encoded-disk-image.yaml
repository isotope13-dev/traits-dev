defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  - id: document-lure-saves-encoded-disk-image
    desc: Document lure saves an encoded disk image
    crit: hostile
    conf: 0.97
    attack: T1027.006,T1204.002
    all:
      - id: metadata/file/encoding/container::base64-img-extension-pattern
      - id: micro-behaviors/ui/window/display::html-document-downloaded-status
      - id: metadata/file/encoding/shape::large-base64-compatible-string-assignment
      - id: micro-behaviors/communications/http/download/browser::base64-archive-download-cooccurrence
      - id: micro-behaviors/communications/http/download/handler::browser-ms-save-or-open-blob
      - id: micro-behaviors/communications/http/download/browser::browser-archive-download-name

  - id: html-document-masked-image-reconstruction
    desc: HTML reconstructs a document-masked disk image
    crit: hostile
    conf: 0.98
    attack: T1027,T1204.002
    all:
    - id: metadata/file/encoding/container::base64-img-extension-pattern
    - id: micro-behaviors/ui/window/display::html-document-downloaded-status
    - id: metadata/file/encoding/shape::large-base64-compatible-string-assignment
    - id: micro-behaviors/communications/http/download/browser::base64-archive-download-cooccurrence
    - id: micro-behaviors/ui/window/click::programmatic-element-click
    any:
    - id: micro-behaviors/communications/url/object::browser-object-url
    - id: micro-behaviors/ui/window/dom/tree::dom-blob-download-link

  - id: document-download-lure-smuggled-archive
    desc: Page reports a completed download and unavailable preview beside an embedded ZIP
    crit: hostile
    conf: 0.98
    attack: T1027.006,T1204.002
    all:
      - id: micro-behaviors/ui/window/display::html-document-downloaded-status
      - id: micro-behaviors/ui/dialog/prompt::preview-unavailable-wording
      - id: metadata/file/encoding/compression::base64-zip-inline-archive
    any:
      - id: micro-behaviors/communications/http/download/handler::browser-ms-save-or-open-blob
      - id: micro-behaviors/communications/http/download/handler::browser-ms-save-or-open-blob-hex
      - id: micro-behaviors/ui/window/dom/tree::object-url-click-or-download-attribute
      - id: micro-behaviors/ui/window/dom/tree::dom-blob-object-url-download
      - id: objectives/anti-static/obfuscation/payload/browser-download::base64-zip-computed-download
  - id: document-lure-drops-zip-shortcut
    desc: Document lure drops a zipped shortcut
    crit: hostile
    conf: 0.98
    attack: T1027.006,T1204.002
    all:
      - id: micro-behaviors/ui/window/display::html-document-downloaded-status
      - id: metadata/file/encoding/compression::base64-zip-inline-archive
      - id: metadata/file/encoding/compression::base64-zip-lnk-entry
    any:
      - id: micro-behaviors/communications/http/download/handler::browser-ms-save-or-open-blob
      - id: micro-behaviors/communications/http/download/handler::browser-ms-save-or-open-blob-hex
      - id: micro-behaviors/ui/window/dom/tree::object-url-click-or-download-attribute
      - id: micro-behaviors/ui/window/dom/tree::dom-blob-object-url-download
      - id: objectives/anti-static/obfuscation/payload/browser-download::base64-zip-computed-download
