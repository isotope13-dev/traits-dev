defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  - id: document-lure-saves-encoded-disk-image
    desc: Document lure saves an encoded disk image
    crit: hostile
    conf: 0.97
    attack: T1027.006,T1204.002
    all:
      - id: metadata/file/encoding::base64-img-extension-pattern
      - id: micro-behaviors/ui/window/display::html-document-downloaded-status
      - id: metadata/file/encoding::large-base64-compatible-string-assignment
      - id: micro-behaviors/communications/http/download/browser::base64-archive-download-cooccurrence
      - id: micro-behaviors/communications/http/download/handler::browser-ms-save-or-open-blob
      - id: micro-behaviors/communications/http/download/browser::browser-archive-download-name

  - id: html-document-masked-image-reconstruction
    desc: HTML reconstructs a document-masked disk image
    crit: hostile
    conf: 0.98
    attack: T1027,T1204.002
    all:
    - id: metadata/file/encoding::base64-img-extension-pattern
    - id: micro-behaviors/ui/window/display::html-document-downloaded-status
    - id: metadata/file/encoding::large-base64-compatible-string-assignment
    - id: micro-behaviors/communications/http/download/browser::base64-archive-download-cooccurrence
    - id: micro-behaviors/ui/window/click::programmatic-element-click
    any:
    - id: micro-behaviors/communications/url/object::browser-object-url
    - id: micro-behaviors/ui/window/dom/tree::dom-blob-download-link
