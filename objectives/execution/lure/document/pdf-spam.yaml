# PDFs that exist to be found rather than read.
#
# The search-engine spam page is a document with no content of its own: a
# page of links, seeded on whatever sites the operator could write to, each
# offering the software the reader searched for. Following one reaches an
# installer. The document is the doorway, and it is built by a generator, so
# the wording of any single link is disposable -- what holds is that the
# links promise cracked software and land in the upload directories of sites
# that have nothing to do with distributing it.
#
# The second shape here is the opposite: a page with no links at all, whose
# entire visible text tells the reader this document cannot be shown until
# they install something. The file the reader is looking at is proof that
# their viewer works.
defaults:
  platforms: [windows, unix]
  for: [pdf]
  attack: T1566.001

traits:
  - id: pdf-cracked-software-link
    desc: PDF link offers cracked software
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pdf.actions[*].snippet
      regex: '(?i)[-_/](crack|keygen|torrent|serial)[-_/.]'

  - id: pdf-link-into-upload-directory
    desc: PDF link targets an upload directory
    crit: notable
    conf: 0.85
    if:
      # `/wp-content/uploads/` and `/system/files/webform/` are where a
      # content system files what visitors upload. A link farm points at them
      # because they are the parts of a stranger's site it could write to.
      type: value
      path: pdf.actions[*].snippet
      regex: '(?i)/(wp-content/uploads|system/files/webform)/'

  - id: pdf-many-upload-directory-links
    desc: PDF links repeatedly into upload directories
    crit: notable
    conf: 0.9
    if:
      # One conference slide hosted under wp-content/uploads is a citation.
      # A doorway repeats the pattern because that is where it planted the bait.
      type: metrics
      field: pdf.upload_directory_uri_count
      min: 4

  - id: pdf-viewer-download-instruction
    desc: PDF says to download a viewer
    crit: suspicious
    conf: 0.9
    if:
      # The reader is already looking at the rendered page. A document that
      # spends it asking them to install a viewer is not a document.
      type: text
      regex: '(?i)\b(pdf|document)\s+viewer\b[\s\S]{0,30}\bdownload\b'

  - id: pdf-many-link-annotations
    desc: PDF carries twenty or more link annotations
    crit: notable
    conf: 0.85
    if:
      # A report with a bibliography reaches this honestly, so it is a
      # measurement rather than a claim. What it establishes is volume: the
      # composites below are about documents whose *purpose* is their links,
      # and one or two outbound references cannot make that case.
      type: metrics
      field: pdf.annotation_count
      min: 20

  - id: pdf-dense-link-annotations
    desc: PDF averages four-plus links per page
    crit: notable
    conf: 0.88
    if:
      # Density rather than count, which is the part a long document cannot
      # reach by being long. Four outbound links on every page, page after
      # page, is a directory, and a directory that arrives as a PDF is a
      # doorway someone built to be indexed.
      type: metrics
      field: pdf.annotations_per_page
      min: 4

composite_rules:
  # Links promising cracked software, filed in the upload directories of
  # unrelated sites. Neither half is a claim on its own -- documentation
  # links into WordPress media, and a page may name a product honestly -- but
  # a document built from both is a doorway.
  - id: pdf-cracked-software-link-farm
    desc: PDF is a cracked-software link farm
    crit: hostile
    conf: 0.93
    all:
      - id: pdf-cracked-software-link
      - id: pdf-link-into-upload-directory

  # A document whose whole content is outbound links into other people's
  # upload directories, and which starts doing something the moment it opens.
  #
  # `pdf-cracked-software-link-farm` above needs the bait to be named -- a URL
  # with `crack` or `keygen` in the path. This wave does not always name it,
  # and does not need to: twenty-plus link annotations, all pointing into the
  # writable corners of unrelated sites, plus an OpenAction, is the doorway
  # shape whatever the links promise. That is what makes it durable -- the
  # bait rotates with whatever people search for, and the structure does not.
  - id: pdf-openaction-upload-link-doorway
    desc: PDF opens into a farm of upload-directory links
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/document/pdf/action::pdf-has-openaction
      - id: pdf-many-upload-directory-links
      - id: pdf-many-link-annotations
      - id: micro-behaviors/communications/http/url/navigation::pdf-external-http-navigation

  # The same page with its text hidden. Three-point type is not small, it is
  # unreadable: it exists for whatever indexes the file, not for whoever opens
  # it. Next to dozens of outbound links, the document has a visible layer for
  # the reader and an invisible one for the crawler.
  - id: pdf-cloaked-text-link-doorway
    desc: PDF hides its text behind a wall of links
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/data/format/pdf::pdf-tiny-text-font
      - id: pdf-many-link-annotations
      - id: micro-behaviors/communications/http/url/navigation::pdf-external-http-navigation

  # The doorway page's other half: the metadata.
  #
  # Where the rules above read the link structure, this reads what the
  # generator wrote about the file. The author field is the search phrase the
  # page targets with a nonce word appended, which is a thing no person types
  # and a thing no honest tool produces -- and the links go into the upload
  # directories of sites that have nothing to do with the subject.
  #
  # This is the variant with too few links to be caught by density: a handful
  # of outbound links on a long page, which is what the family switched to.
  # The metadata did not change with it.
  - id: pdf-search-phrase-metadata-doorway
    desc: PDF metadata is a search phrase for its links
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/document/pdf/properties::pdf-keyword-phrase-author
      - id: pdf-link-into-upload-directory
      - id: micro-behaviors/communications/http/url/navigation::pdf-external-http-navigation

  # Two ways of naming a destination without naming it. A bare IPv4 has no
  # domain to check and no certificate to mismatch; a web.archive.org URL
  # borrows a domain the reader trusts and redirects out of it. A document
  # that offers both is not linking to a place, it is routing around the
  # reader's ability to see where they are going.
  - id: pdf-unnamed-destination-redirect
    desc: PDF links via a raw IP and an archive redirect
    crit: hostile
    conf: 0.93
    attack: T1566.002
    all:
      - id: objectives/execution/interpreter/eval/document::pdf-uri-ip-phishing
      - id: micro-behaviors/communications/http/url/archive::pdf-action-archive-url
      - id: micro-behaviors/communications/http/url/navigation::pdf-http-external-ip-uri

