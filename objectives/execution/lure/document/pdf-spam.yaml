# PDFs that exist to be found rather than read.
#
# The search-engine spam page is a document with no content of its own: a
# page of links, seeded on whatever sites the operator could write to, each
# offering the software the reader searched for. Following one reaches an
# installer. The document is the doorway, and it is built by a generator, so
# the wording of any single link is disposable -- what holds is that the
# links promise cracked software and land in the upload directories of sites
# that have nothing to do with distributing it.
#
# The second shape here is the opposite: a page with no links at all, whose
# entire visible text tells the reader this document cannot be shown until
# they install something. The file the reader is looking at is proof that
# their viewer works.
defaults:
  platforms: [windows, unix]
  for: [pdf]
  attack: T1566.001

traits:
  - id: pdf-cracked-software-link
    desc: PDF link offers cracked software
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pdf.actions[*].snippet
      regex: '(?i)[-_/](crack|keygen|torrent|serial)[-_/.]'

  - id: pdf-link-into-upload-directory
    desc: PDF link targets an upload directory
    crit: component
    conf: 0.85
    if:
      # `/wp-content/uploads/` and `/system/files/webform/` are where a
      # content system files what visitors upload. A link farm points at them
      # because they are the parts of a stranger's site it could write to.
      type: value
      path: pdf.actions[*].snippet
      regex: '(?i)/(wp-content/uploads|system/files/webform)/'

  - id: pdf-viewer-download-instruction
    desc: PDF says to download a viewer
    crit: suspicious
    conf: 0.9
    if:
      # The reader is already looking at the rendered page. A document that
      # spends it asking them to install a viewer is not a document.
      type: text
      regex: '(?i)\b(pdf|document)\s+viewer\b[\s\S]{0,30}\bdownload\b'

composite_rules:
  # Links promising cracked software, filed in the upload directories of
  # unrelated sites. Neither half is a claim on its own -- documentation
  # links into WordPress media, and a page may name a product honestly -- but
  # a document built from both is a doorway.
  - id: pdf-cracked-software-link-farm
    desc: PDF is a cracked-software link farm
    crit: hostile
    conf: 0.93
    all:
      - id: pdf-cracked-software-link
      - id: pdf-link-into-upload-directory
