# A Desktop Entry is an application launcher: the desktop executes its Exec=
# line when the user opens the file, on any desktop that honors freedesktop
# entries. Presenting that launcher under a document name or the standard
# office-document icon turns one double-click into execution of whatever the
# Exec line hides.
#
# These matchers read the entry as text, so they fire when the entry travels
# under an attacker-chosen extension that leaves it unparsed (.unknown, .sh,
# .run) or inside another script. Entries the engine parses as desktop-entry
# are covered by objectives/evasion/masquerade/document and
# objectives/anti-static/obfuscation/eval/desktop, which read the parsed
# desktop_entry.* values; this file deliberately excludes that type so the
# two families do not double-claim one artifact.
defaults:
  platforms: [linux, macos]
  for: [elf, scripts, source, text, github-actions, makefile, data]

traits:
  - id: desktop-entry-document-name
    desc: Entry Name presents a document file name
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?mi)^Name=[^\r\n=]{0,200}\.(pdf|docx?|xlsx?)\s*$'

  - id: desktop-entry-document-icon
    desc: Entry Icon value presents an office document
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?mi)^Icon=x-office-(document|presentation|spreadsheet)\s*$'

composite_rules:
  - id: desktop-entry-document-masquerade
    desc: Application-type entry presents a document identity
    crit: suspicious
    conf: 0.95
    attack: T1036
    near_lines: 16
    all:
      - id: metadata/file/format/structured::desktop-entry-header
      - id: metadata/file/format/structured::desktop-entry-application-type
    any:
      - id: desktop-entry-document-name
      - id: desktop-entry-document-icon

  # One double-click runs a hidden command chain: the entry the user believes
  # is a document pipes a Base64 blob straight into a shell. Legitimate
  # launchers name their application and never decode-and-execute on open.
  - id: desktop-entry-document-lure-hidden-exec
    desc: Document-impersonating entry pipes decoded commands to a shell
    crit: hostile
    conf: 0.97
    attack: T1036,T1059.004,T1204.002
    near_lines: 16
    all:
      - id: desktop-entry-document-masquerade
      - id: micro-behaviors/process/create/shell/pipeline::base64-decode-shell-stdin
