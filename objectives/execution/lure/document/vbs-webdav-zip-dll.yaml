defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1059.005

traits:
  - id: vbs-webdav-zip-hidden-register
    desc: Registers DLL from remote WebDAV archive
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule vbs_webdav_zip_hidden_register {
          strings:
            $dav = "DavWWWRoot" nocase
            $copy = /\.CopyFile\s+[^\r\n]{1,200}\.zip/ nocase
            $extract = ".CopyHere" nocase
            $register = /regsvr32\s+[^\r\n"']+\.dll/ nocase
            $hidden = /\.Run\s+[^\r\n]{1,160},\s*0\s*,/ nocase
          condition:
            all of them
        }
