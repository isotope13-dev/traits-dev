defaults:
  platforms: [unix, windows, ios]
  for: [html, javascript, elixir, scala]
  attack: T1189
  mbc: B0031
composite_rules:
  - id: executable-lure-with-concealed-php-frame
    desc: Executable link and concealed PHP frame clues
    crit: suspicious
    conf: 0.96
    for: [html]
    near_bytes: 700
    all:
      - id: micro-behaviors/communications/url/navigation-http::relative-executable-html-hyperlink
      - id: micro-behaviors/communications/http/client/frame::relative-php-iframe-endpoint
      - id: micro-behaviors/ui/window/visibility::tiny-iframe-at-most-one
      - id: micro-behaviors/ui/window/style::css-visibility-hidden
