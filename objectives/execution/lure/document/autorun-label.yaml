# A bare Documents category advertises browsing documents, while the same
# AutoRun section launches a native program. A descriptive software task
# ('Install document viewer') or opening an actual PDF is a near miss.
defaults:
  for: [text]
  platforms: [windows]
  size_max: 4096
composite_rules:
  - id: autorun-document-label-executable-launch
    desc: Document-browsing AutoPlay label launches executable
    crit: suspicious
    conf: 0.95
    attack: T1204.002
    all:
      - id: micro-behaviors/os/autorun/media::autorun-inf-launch-program
      - id: micro-behaviors/os/autorun/media::autorun-shellexecute-executable
      - id: micro-behaviors/os/autorun/media::autorun-document-action-label
    # These text-only detections require one section; a launch directive
    # in an unrelated section cannot borrow the AutoRun display label.
    unless:
      - id: metadata/file/format/structured::ini-section-header-after-first-line
    near_bytes: 1024
