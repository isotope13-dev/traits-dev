# Fake-document download kits that share a CSS webfont plus a Word-icon
# image labeled as a PDF, then hop through a gate page into a ZIP payload.
# The font family name and img/font1.woff2 path are kit handwriting, not
# ordinary site theming; the icon/alt mismatch is the document lure.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
  mbc: B0030
  crit: notable
  conf: 0.92

traits:
  - id: css-fmtt-font-face
    desc: CSS @font-face declares family fmtt
    if:
      type: text
      regex: '(?i)@font-face[^}]{0,72}font-family\s*:\s*[''"]fmtt[''"]'
  - id: kit-font1-woff2-path
    desc: Kit font1.woff2 webfont path
    if:
      type: text
      regex: '(?i)(src|url)\s*[:(][^;)]{0,40}font1\.woff2'
  - id: microsoft-word-png-src
    desc: Image source names a Microsoft Word PNG
    if:
      type: text
      regex: '(?i)src\s*=\s*[''"][^''"]{0,48}microsoft-word[^''"]{0,16}\.png'
  - id: html-pdf-icon-alt
    desc: Image alt attribute set to PDF Icon
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?i)\balt\s*=\s*[''"]PDF Icon[''"]'
  - id: html-refresh-secure-html
    desc: Meta refresh targets secure.html
    if:
      type: text
      regex: '(?i)http-equiv\s*=\s*[''"]refresh[''"][^>]{0,48}secure\.html'
  - id: html-project-zip-href
    desc: Project-path ZIP payload href
    if:
      type: text
      regex: '(?i)(href|url)=[''"][^''"]{0,32}project/[^''"]{0,48}\.zip'
  - id: html-ftx-epoch-path
    desc: Per-recipient ftx slug-epoch-hex path
    if:
      type: text
      regex: '/ftx/[A-Za-z0-9]{6}-\d{10}-[a-fA-F0-9]{12}/'

composite_rules:
  - id: fmtt-font1-document-kit
    desc: Document lure page ships fmtt font1.woff2 kit
    crit: hostile
    conf: 0.97
    all:
      - id: css-fmtt-font-face
      - id: kit-font1-woff2-path
    any:
      - id: microsoft-word-png-src
      - id: html-refresh-secure-html
  - id: word-png-pdf-alt-lure
    desc: Word PNG presented with PDF Icon alt
    crit: hostile
    conf: 0.96
    all:
      - id: microsoft-word-png-src
      - id: html-pdf-icon-alt
    any:
      - id: html-refresh-secure-html
      - id: html-project-zip-href
      - id: html-ftx-epoch-path
