# The same macro-bearing workbook embedded and force-updated again and
# again. Each copy raises its own macro prompt as the document opens;
# dismissing one brings the next, until the reader enables content. A
# document that needs one spreadsheet embeds it once.
defaults:
  platforms: [windows]
  for: [rtf]
  attack: T1204.002

composite_rules:
  - id: rtf-repeated-macro-object-prompts
    desc: RTF repeats macro objects to force prompts
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/document/rtf/ole::repeated-objupdate-objects
      - id: metadata/document/rtf/ole::objdata-hex-vba-typelib-reference
