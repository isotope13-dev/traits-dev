# A macOS application bundle named to read as a document. The user is sent
# "Urgent Report.app" or "Invoice.app", Finder shows the name without the
# extension, and double-clicking it runs a program rather than opening a file.
#
# The name is the whole attack: nothing inside the bundle has to look unusual,
# because the victim was never deciding whether to run software. Keyed on the
# bundle directory in the path rather than on any plist key, since the name a
# user sees is the directory's, and a stub Info.plist may declare something
# else entirely -- the sample this was written from is "Urgent Report.app"
# whose plist calls itself `PDF.viewer`.
#
# Real applications are named for what they do. An app named for an invoice or
# a scan is describing its lure, not its function. Split three ways only to
# stay inside the alternation budget; they are one signal.
defaults:
  platforms: [macos]
  for: [plist, macho, data]
  crit: suspicious
  conf: 0.9
  attack: T1036.005
  mbc: F0008

traits:
  - id: billing-lure-app-bundle-name
    desc: App bundle named as a billing document
    if:
      type: path
      regex: '(?i)/(urgent|invoice|receipt)[\w -]{0,24}\.app'

  - id: report-lure-app-bundle-name
    desc: App bundle named as a report
    if:
      type: path
      regex: '(?i)/(statement|report|scan)[\w -]{0,24}\.app'

  - id: document-lure-app-bundle-name
    desc: App bundle named as a document file
    if:
      type: path
      regex: '(?i)/(document|resume|contract)[\w -]{0,24}\.app'
