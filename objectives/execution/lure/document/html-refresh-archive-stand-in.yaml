# A page that poses as a document, tells the reader the "actual file" is in
# their downloads, and meta-refreshes to an external archive URL. The page is
# only a pointer that auto-fetches the archived payload for the user to open.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1204.002,T1105

composite_rules:
  - id: html-stand-in-refresh-archive-download
    desc: Stand-in page auto-downloads an archive to open
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/ui/window/navigation/refresh::browser-meta-refresh-archive-download
      - id: micro-behaviors/ui/window/message::downloaded-file-open-instruction
