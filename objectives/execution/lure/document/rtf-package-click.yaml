# The reader is told to double-click an icon, and the icon is an OLE Package
# whose packaged file is a program. Activating it writes the program to
# %TEMP% and runs it; the instruction exists to get that click.
defaults:
  platforms: [windows]
  for: [rtf]
  attack: T1204.002

composite_rules:
  - id: rtf-double-click-packaged-program-lure
    desc: RTF asks reader to open packaged program
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/document/rtf/properties::rtf-object-package
      - id: metadata/document/rtf/ole::objdata-hex-executable-filename
    any:
      - id: micro-behaviors/ui/help/interaction::double-click-embedded-icon-instruction
      - id: micro-behaviors/ui/help/interaction::document-double-click-instruction
