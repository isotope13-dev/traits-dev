defaults:
  platforms:
  - windows
composite_rules:
- crit: suspicious
  for:
  - iso
  - data
  - pe
  id: iso-document-exe-dotnet-resource-markers
  desc: ISO document EXE and .NET resource clues
  conf: 0.99
  attack: T1204.002
  all:
  - id: metadata/file/format/iso/structure::primary-volume-descriptor
  - id: metadata/file/format/iso/member::iso-document-exe-lure
  - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
  - id: metadata/file/format/managed-runtime::embedded-dotnet-resource-loader
  - id: metadata/file/format/managed-runtime::embedded-dotnet-reflection-marker
- crit: suspicious
  for: &id001
  - iso
  - data
  id: iso-document-exe-vb6-helper-markers
  desc: ISO document EXE and VB6 helper markers
  conf: 0.98
  attack: T1204.002
  all:
  - id: metadata/file/format/iso/structure::primary-volume-descriptor
  - id: metadata/file/format/iso/member::iso-document-exe-lure
  - id: metadata/file/format/iso/payload::iso-vb6-runtime-identity
  - id: metadata/file/format/iso/payload::iso-vb6-runtime-helper-cluster
- crit: suspicious
  for: *id001
  id: iso-sparse-pdf-exe-text
  desc: Sparse ISO with PDF.EXE text
  conf: 0.97
  attack: T1204.002
  all:
  - id: metadata/file/format/iso/structure::primary-volume-descriptor
  - id: metadata/file/format/iso/member::iso-pdf-exe-member
  - id: metadata/file/format/iso/structure::single-payload-image
  - id: metadata/file/format/iso/structure::sparse-file-tree
  - id: metadata/file/format/iso/structure::contains-executable-member
- crit: hostile
  for: *id001
  id: iso-sparse-dwg-exe-member
  desc: Sparse ISO with DWG.EXE member
  conf: 0.97
  attack: T1036.007,T1204.002
  all:
  - id: metadata/file/format/iso/structure::primary-volume
  - id: metadata/file/format/iso/member::iso-member-dwg-exe-lure
  - id: metadata/file/format/iso/structure::single-payload-image
  - id: metadata/file/format/iso/structure::sparse-file-tree
  - id: metadata/file/format/iso/structure::contains-executable-member
