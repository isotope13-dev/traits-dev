# Payment-themed names are only a delivery lure when they occur in an actual
# ISO image alongside an executable member.  The terms alone are common in
# source code, documentation, and ordinary archives.
defaults:
  platforms: [windows, unix]
  for: [archive, data]
  attack: T1204.002

traits:
  - id: payment-term-core
    desc: Payment-themed lure term
    crit: component
    conf: 0.82
    if:
      type: raw
      regex: '(?i)(payment|pago|saldo)'

  - id: payment-term-document
    desc: Invoice or receipt lure term
    crit: component
    conf: 0.82
    if:
      type: raw
      regex: '(?i)(invoice|receipt|factura|remittance)'

  - id: payment-term-proforma
    desc: Proforma payment lure term
    crit: component
    conf: 0.82
    if:
      type: raw
      regex: '(?i)proforma'

  - id: payment-term-proof
    desc: Proof-of-payment lure term
    crit: component
    conf: 0.82
    if:
      type: raw
      regex: '(?i)proof[_ -]?of'

composite_rules:
  - id: payment-term
    desc: Payment-themed delivery lure term
    crit: component
    conf: 0.82
    any:
      - id: payment-term-core
      - id: payment-term-document
      - id: payment-term-proforma
      - id: payment-term-proof

  - id: iso-payment-executable-member
    desc: ISO image carries a payment-themed executable member
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/structured::embedded-executable-member
      - id: payment-term
