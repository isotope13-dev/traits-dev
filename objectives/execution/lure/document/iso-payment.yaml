# Payment-themed names are only a delivery lure when they occur in an actual
# ISO image alongside an executable member.  The terms alone are common in
# source code, documentation, and ordinary archives.
#
# The lure terms themselves used to be duplicated here as bare `type: raw`
# regexes over the whole file.  They could never fire: cleave types ISO images
# as `unknown`, and neither `raw` (cap 3 file types) nor `text` (cap 19) can be
# widened to `all` from this directory, so no `for:` list reached the container.
# The volume-descriptor-anchored copies in metadata/file/format/structured are
# the surviving implementation -- they carry the ISO anchor inside the matcher,
# which is both reachable and narrower than anything expressible here.
defaults:
  platforms: [windows, unix]
  for: [iso]
  attack: T1204.002

composite_rules:
  - id: iso-payment-executable-member
    for: [iso, data]
    desc: ISO image carries a payment-themed executable member
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/structure::embedded-executable-member
      - id: metadata/file/format/iso/structure::embedded-payment-term

  # A mounted image runs a script member as readily as a PE, so the billing-
  # document lure needs no executable at all: "Invoice ID-(6457687).vbs" and a
  # decoy picture under Read/ is the whole of one PowerISO-built delivery.
  - id: iso-payment-script-member
    desc: ISO image carries a payment-named script
    crit: suspicious
    conf: 0.94
    attack: T1204.002,T1036.007
    all:
      - id: metadata/file/format/iso/structure::primary-volume
      - id: metadata/file/format/iso/member::iso-member-document-lure-script
  # The walked-image form of iso-document-exe-lure, which anchors on raw
  # bytes and so only reaches images that fell back to `data`.
  - id: iso-payment-listed-executable
    desc: ISO lists a payment-named executable
    crit: suspicious
    conf: 0.95
    attack: T1204.002,T1036.007
    all:
      - id: metadata/file/format/iso/structure::primary-volume
      - id: metadata/file/format/iso/member::iso-member-document-lure-executable
  # ...and when that script's own job is to hand a remote URL to a script
  # host or MSHTA, the image is a downloader stage with a billing-document
  # name on it. `for:` lists the member script types: container composites
  # only count member findings whose member type is in `for:`.
  - id: iso-payment-script-remote-launch
    desc: Payment-named ISO script launches a remote URL
    crit: hostile
    conf: 0.97
    attack: T1204.002,T1036.007,T1218.005
    for: [iso, vbs, javascript, html, batch]
    all:
      - id: metadata/file/format/iso/member::iso-member-document-lure-script
    any:
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-url-argument
      - id: objectives/execution/interpreter/script/mshta::mshta-remote-url
