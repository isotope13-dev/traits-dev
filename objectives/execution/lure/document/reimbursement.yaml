# Remote content is unavailable: these observations support suspicion, not
# credential theft or confirmed payload execution. No destination is pinned.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: suspicious
  conf: 0.85
composite_rules:
  - id: personalized-reimbursement-redirect
    desc: Personalized confidential reimbursement page auto-redirects
    all:
      - id: micro-behaviors/ui/keywords::reimbursement-report-heading
      - id: micro-behaviors/ui/keywords::recipient-specific-report-claim
      - id: micro-behaviors/ui/keywords::confidential-information-claim
      - id: micro-behaviors/ui/window/navigation::browser-meta-refresh-external-url
  - id: verified-reimbursement-redirect
    desc: Reimbursement redirect asserts verification with short token
    all:
      - id: micro-behaviors/ui/keywords::reimbursement-report-heading
      - id: micro-behaviors/ui/keywords::verified-document-status-claim
      - id: micro-behaviors/ui/keywords::short-verification-token-display
      - id: micro-behaviors/ui/window/navigation::browser-meta-refresh-external-url
