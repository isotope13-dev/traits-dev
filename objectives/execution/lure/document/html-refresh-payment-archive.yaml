defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.001,T1204.002
  mbc: B0030
composite_rules:
  - id: html-refresh-payment-archive-download
    desc: Payment-themed filename and archive refresh
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/ui/window/navigation/refresh::browser-meta-refresh-archive-download
      - id: objectives/execution/lure/document::payment-document-archive-name

  # The payment-named archive URL sits inside the zero-delay refresh URL itself,
  # not elsewhere on the page.
  - id: instant-refresh-payment-archive
    desc: Instant refresh to payment-named archive
    crit: component
    conf: 0.9
    near_bytes: 300
    all:
      - id: objectives/execution/lure/document::url-value-payment-word
      - id: objectives/execution/lure/document::payment-document-archive-name
      - id: micro-behaviors/communications/url/resource-path/file::archive-file-url
    any:
      - id: micro-behaviors/ui/window/navigation/refresh::meta-refresh-instant-external
      - id: micro-behaviors/ui/window/navigation/refresh::meta-refresh-content-first-instant-external

  # Mailed HTML redirector: a page with nothing to read whose only effect is
  # an immediate off-site download of a payment-themed archive or executable.
  # Genuine download pages explain what is being downloaded.
  - id: blank-page-instant-payment-archive-download
    desc: Blank page auto-downloads payment-named archive
    crit: hostile
    conf: 0.93
    all:
      - id: instant-refresh-payment-archive
    any:
      - id: metadata/document/html/structure::empty-html-body
      - id: micro-behaviors/ui/window/navigation/refresh::html-body-without-text
