defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002,T1204.002
composite_rules:
  - id: html-refresh-payment-archive-download
    desc: HTML auto-downloads payment-named archive
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/ui/window/navigation::browser-meta-refresh-archive-download
      - id: micro-behaviors/communications/http/url/archive::payment-document-archive-name
