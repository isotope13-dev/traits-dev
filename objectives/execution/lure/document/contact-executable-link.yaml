# A Windows Contacts card whose injected link points at a local executable
# or shortcut by relative or drive path (`hidden\payload.lnk`). The card is
# shipped beside the payload; clicking the contact's "e-mail" or "website"
# runs the file instead of opening a mail client or browser.
defaults:
  platforms: [windows]
  for: [xml]
  attack: T1204.002

composite_rules:
  - id: contact-card-executable-link-lure
    desc: Contact card link launches a local executable
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/file/format/windows-shell::contact-card-root
      - id: micro-behaviors/communications/url/reference::escaped-anchor-local-executable-href
