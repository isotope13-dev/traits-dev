defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1204.002,T1059.003,T1036
  mbc: F0008

composite_rules:
  - id: lnk-cmd-payload-and-decoy-document
    desc: Shortcut chains payload execution with opening a decoy document
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/shortcut::lnk-cmd-with-args
      - id: micro-behaviors/process/create/shortcut::lnk-args-command-chain-operator
      - id: micro-behaviors/fs/path/document::lnk-args-document-extension
    any:
      - id: micro-behaviors/process/create/shortcut::lnk-args-msi-or-exe-stage
      - id: micro-behaviors/process/create/shortcut::lnk-args-script-stage
