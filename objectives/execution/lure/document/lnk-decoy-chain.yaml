defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1204.002,T1059.003,T1036
  mbc: F0008

composite_rules:
  - id: lnk-cmd-payload-and-decoy-document
    desc: Shortcut chains payload execution with opening a decoy document
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/config/target::lnk-cmd-with-args
      - id: micro-behaviors/process/argument/option::lnk-args-command-chain-operator
      - id: micro-behaviors/os/handler/open::lnk-start-document-command
      - id: micro-behaviors/ui/window/state::lnk-hidden-window
      # The extension pair is the deception mechanism, not a campaign stem.
      # Ordinary application shortcuts can open their manuals after launch.
      - id: metadata/file/extension/executable::lnk-document-double-extension
    any:
      - id: micro-behaviors/process/argument/file::lnk-args-msi-or-exe-stage
      - id: micro-behaviors/process/argument/file::lnk-args-script-stage
