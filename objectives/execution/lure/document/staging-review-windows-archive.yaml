composite_rules:
- platforms:
  - windows
  for:
  - batch
  - powershell
  - text
  attack: T1105
  id: appdata-tar-exe-document-lure-clues
  desc: AppData tar, executable and document-lure clues
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/data/archive/extract/tar::batch-tar-extract-appdata-text
  - id: micro-behaviors/process/create/path-execution::appdata-exe-command-text
  any:
  - id: metadata/file/profile/open-handler::explorer-document-or-image-command
  - id: objectives/evasion/masquerade/extension/double
