# HTML smuggling of a password-protected archive. The page carries the ZIP
# inline (data: URI or script variable), so no download crosses the web or
# mail gateway, and the archive entry is encrypted, so nothing scanning the
# saved file can read it either. The page then prints the password for the
# reader. Each half has benign forms - sites link encrypted archives, and
# pages mention passwords - but a page that both ships the encrypted archive
# itself and tells the reader the key is coaching them past inspection.
# 2022 Qakbot/IcedID "Password is NNNNN" iframe smuggling pages fit this.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1027.006,T1204.002
composite_rules:
  - id: password-shown-for-inline-encrypted-zip
    desc: Page shows password for inline encrypted ZIP
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/file/encoding/compression::base64-zip-encrypted-entry
      - id: micro-behaviors/ui/window/display::inline-password-value-text
    any:
      - id: metadata/file/encoding/compression::data-uri-zip-archive
      - id: metadata/file/encoding/compression::base64-zip-string-assignment
      - id: micro-behaviors/data/buffer/alloc::blob-construction
  - id: password-shown-for-reversed-svg-carrier
    desc: Page shows password for reversed SVG smuggling carrier
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/string/reverse::reversed-svg-data-uri-text
      - id: micro-behaviors/ui/window/display::inline-password-value-text
    any:
      - id: micro-behaviors/data/string/reverse::descending-character-loop
      - id: micro-behaviors/communications/http/client/resource::element-src-reversed-value-assignment
  - id: password-shown-for-fragmented-svg-carrier
    desc: Page shows password for fragmented SVG smuggling carrier
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/ui/window/display::inline-password-value-text
    any:
      - id: objectives/command-and-control/dropper/delivery/html::html-reversed-fragment-svg-staging
      - id: objectives/command-and-control/dropper/delivery/html::html-fragment-svg-embed-staging
