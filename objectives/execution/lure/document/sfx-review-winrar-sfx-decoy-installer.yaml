# Silent WinRAR SFX that launches an installer payload and opens a document
# decoy from the same hidden extraction: one Setup directive runs the
# installer package while another opens a picture or document in its
# viewer, so the victim watches the decoy while the payload installs.
# Ordinary installers do not pair a hidden install with a viewer decoy;
# the starter-comment sibling (objectives/execution/payload/file-exec/spawn/sfx)
# covers bare comment fragments whose payload runs from Presetup.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: winrar-sfx-decoy-document-installer
  desc: Silent SFX runs installer behind document decoy
  crit: hostile
  conf: 0.97
  attack: T1204.002,T1036
  all:
    - id: well-known/tool/sysadmin/winrar-sfx::winrar-sfx
    - id: micro-behaviors/data/archive/extract/options::sfx-silent-overwrite-pair
    - id: micro-behaviors/process/config/installer::sfx-setup-installer-msi-directive
  any:
    - id: micro-behaviors/process/config/installer::sfx-comment-setup-decoy-ascii
    - id: micro-behaviors/process/config/installer::sfx-comment-setup-decoy-utf16-overlay
