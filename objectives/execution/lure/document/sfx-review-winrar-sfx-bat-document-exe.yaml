defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: winrar-sfx-bat-document-exe
  desc: Silent SFX batch with document and exe
  scope: outer
  for: [pe, rar, 7z, zip, tar, cab]
  crit: hostile
  conf: 0.96
  attack: T1204.002,T1036
  all:
    - id: well-known/tool/sysadmin/winrar-sfx::winrar-sfx
    - id: micro-behaviors/process/config/installer::sfx-setup-batch-script
    - id: micro-behaviors/fs/path/document::sfx-office-name-byte-pattern
    - id: metadata/archive/member/extension::archive-windows-executable-entry
    - id: micro-behaviors/data/archive/extract/options::sfx-silent-overwrite-pair
    - id: micro-behaviors/data/archive/extract/destination::sfx-path-temp
