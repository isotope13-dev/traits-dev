# Spanish-language court-notice lure vocabulary. Colombian and wider LatAm
# campaigns (Blind Eagle-style RAT loaders) open with a fake court or
# prosecutor notice; the 2026-09 chain used it in the email subject, the fake
# Fiscalía page title and 45 dropped-file names (`Demanda_Ejecutiva_...`,
# `Citatorio_Juzgado_...`). Each term alone is ordinary legal Spanish (law
# firms, court portals), so the terms are components and the lure is two
# different families of them in one file -- still lure CONTENT, not a verdict.
defaults:
  platforms: [windows, unix]
  for: [html, svg, javascript, oledoc, ooxml, pdf, vbs, powershell]
  attack: T1566,T1204
  crit: component
  conf: 0.75
traits:
  - id: es-court-term
    desc: Spanish court office term
    if:
      type: text
      regex: '(?i)juzgado|despacho[ _]judicial'
  - id: es-prosecutor-term
    desc: Spanish prosecutor office term
    if:
      type: text
      regex: '(?i)fiscal[ií]a[ _]general'
  - id: es-judicial-summons-term
    desc: Spanish judicial summons term
    if:
      type: text
      regex: '(?i)notificaci[oó]n[ _]judicial|citatorio|emplazamiento'
  - id: es-lawsuit-term
    desc: Spanish lawsuit or seizure term
    if:
      type: text
      regex: '(?i)demanda[ _](ejecutiva|laboral|civil|penal)|embargo'
composite_rules:
  - id: spanish-judicial-notice-lure
    desc: Spanish court-notice lure vocabulary
    crit: notable
    conf: 0.8
    needs: 2
    any:
      - id: es-court-term
      - id: es-prosecutor-term
      - id: es-judicial-summons-term
      - id: es-lawsuit-term
