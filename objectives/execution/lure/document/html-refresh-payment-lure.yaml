# Automated client-side redirection to a payment or invoice lure document
# (fatura, invoice, receipt, comprobante). Threat actors distribute minimal
# HTML redirector stubs in email attachments to bypass gateway attachment
# filters and route victims directly to hosted payment/invoice phishing pages.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, text]
  attack: T1566.002,T1204.002
  mbc: B0030

composite_rules:
  - id: html-redirect-payment-document-lure
    desc: HTML redirects to payment or invoice lure document
    crit: suspicious
    conf: 0.9
    near_bytes: 2048
    all:
      - id: micro-behaviors/ui/window/navigation::browser-external-redirect
      - id: micro-behaviors/communications/url/path::payment-lure-document-url
