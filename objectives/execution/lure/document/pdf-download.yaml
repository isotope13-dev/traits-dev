defaults:
  platforms:
  - windows
  - unix
  for:
  - pdf
  attack: T1566.001
traits:
- id: pdf-auto-open-archive-download
  desc: PDF OpenAction launches an archive URL
  crit: suspicious
  conf: 0.94
  if:
    type: raw
    regex: (?s)/OpenAction\s*<<.{0,96}/S\s*/URI.{0,96}https?://.{1,128}\.(zip|7z|rar)
