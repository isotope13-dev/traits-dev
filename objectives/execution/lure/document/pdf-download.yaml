# PDF documents that hand the reader a payload to fetch.
#
# A link annotation is present in essentially every PDF that contains a
# hyperlink, so it carries no weight by itself; what the link points at does.
# An installer or a direct executable is a payload. An archive is not: product
# documentation routinely links its own sample .zip, so archive links only
# become an objective when the document also opens something on its own.
defaults:
  platforms: [windows, unix]
  for: [pdf]
  attack: T1566.001
traits:
  - id: pdf-uri-msi-download
    desc: PDF URL to MSI payload
    crit: suspicious
    conf: 0.92
    if:
      type: value
      path: pdf.actions[*].snippet
      regex: '(?i)https?://[^\s<>()"]{4,220}\.msi([?#]|$)'
composite_rules:
  - id: pdf-annotated-payload-download
    desc: PDF annotation downloads payload
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/document/pdf/properties::pdf-annotation-object
    any:
      - id: pdf-uri-msi-download
      - id: micro-behaviors/communications/http/url/cloud::cloud-executable-url

  - id: pdf-auto-open-archive-download
    desc: Auto-opening PDF links to an archive
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/document/pdf/properties::pdf-has-openaction
    any:
      - id: micro-behaviors/communications/http/url/archive::pdf-action-archive-url
      - id: micro-behaviors/communications/http/url/cloud::cloud-archive-url
