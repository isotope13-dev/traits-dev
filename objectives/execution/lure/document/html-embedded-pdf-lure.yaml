# An HTML page whose only body is a fullscreen PDF data URI. The PDF is one
# image with a link annotation covering the page. The destination is often
# encrypted, so the URI action and the full-page rectangle are the visible
# evidence; a normal embedded report does not make the whole page one link.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.001
traits:
  - id: fullscreen-pdf-data-object
    desc: Fullscreen object embeds a PDF
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)<object [^>]{0,20}width="100%" height="100%" data="data:application/pdf;base64,'
      exclude_html_comments: true
  # Base64 of `/Subtype/Link/Rect[0 0 ` at each 3-byte alignment.
  # The rectangle starts at the page origin, which is the full-page link.
  - id: embedded-pdf-origin-link
    desc: Embedded PDF link starts at origin
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'L1N1YnR5cGUvTGluay9SZWN0WzA|dWJ0eXBlL0xpbmsvUmVjdFswIDAg|U3VidHlwZS9MaW5rL1JlY3RbMC'
  # Base64 of `/Subtype/Image/Width ` at each alignment.
  - id: embedded-pdf-image-xobject
    desc: Embedded PDF contains an image
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'L1N1YnR5cGUvSW1hZ2UvV2lkdGgg|dWJ0eXBlL0ltYWdlL1dpZH|U3VidHlwZS9JbWFnZS9XaWR'
composite_rules:
  - id: fullscreen-pdf-origin-link-lure
    desc: Fullscreen PDF page is one origin link
    crit: hostile
    conf: 0.95
    all:
      - id: fullscreen-pdf-data-object
      - id: embedded-pdf-origin-link
  - id: image-pdf-origin-link-lure
    desc: Image PDF page is one origin link
    crit: hostile
    conf: 0.94
    all:
      - id: embedded-pdf-image-xobject
      - id: embedded-pdf-origin-link
