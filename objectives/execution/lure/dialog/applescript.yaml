defaults:
  # Compatibility-lure wording is meaningful in user-facing script prompts,
  # not in arbitrary application source comments.
  for: [applescript, shell]
  platforms:
    - macos
  attack: T1204.002
traits:
  - id: compat-wizard
    desc: Compatibility Wizard lure text
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: (?i)Compatibility Wizard
  - id: compat-issue
    desc: Compatibility issue lure text
    crit: suspicious
    conf: 0.85
    if:
      type: text
      # Lure copy addresses the victim ("your computer", "some issues").
      # Third-person maintenance notes ("fix the pytest compatibility
      # issue") describe the author's own repair, not a dialog shown to
      # a victim.
      regex: (?i)\b((your)\s+\w+\s+(has\s+)?|some\s+)compatibility\s+issues?\b
  - id: file-not-opened
    desc: File couldn't be opened lure
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)couldn't be opened
  - id: missing-extensions
    desc: Missing extensions lure text
    crit: suspicious
    conf: 0.85
    for: [applescript]
    if:
      type: text
      regex: (?i)\b(extensions\s+(are\s+)?missing|missing\s+extensions)\b
  - id: missing-required-ext
    desc: Missing required extensions lure
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: (?i)Missing required extensions
  - id: missing-required-comp
    desc: Missing required components lure
    crit: suspicious
    conf: 0.85
    for: [applescript]
    unless:
      - type: text
        regex: '(?i)test\s+"[^"]*(url|uri)[^"]*missing required components'
    if:
      type: text
      regex: (?i)Missing required components
  - id: required-components
    desc: Required components lure text
    crit: notable
    conf: 0.8
    for: [applescript]
    if:
      type: text
      regex: (?i)required components
  - id: required-extensions
    desc: Required extensions lure text
    crit: notable
    conf: 0.8
    unless:
      - id: metadata/lang/generated::codegen-source-path
    if:
      type: text
      regex: (?i)required extensions
  - id: check-updates
    desc: AppleScript check-for-updates text
    crit: notable
    conf: 0.75
    for: [applescript]
    if:
      type: text
      regex: (?i)check(ing)?\s+(for\s+|system\s+)?updates
  # The wording alone is what an honest installer prints while it works
  # ("Installing components" as a progress heading); the lure reading comes
  # from the composites that pair it with a fake-update message.
  - id: install-components
    desc: Install components progress text
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\binstall(ing)?\s+(the\s+|missing\s+|required\s+|additional\s+)?components\b'
composite_rules:
  - id: missing-message
    desc: Missing components/extensions message
    crit: suspicious
    conf: 0.85
    any:
      - id: missing-extensions
      - id: missing-required-ext
      - id: missing-required-comp
  - id: user-action-instruction
    desc: User action instruction text
    crit: notable
    conf: 0.75
    any:
      - id: micro-behaviors/ui/help/interaction::click-button-instruction
      - id: micro-behaviors/ui/dialog/prompt::press-to-continue
  - id: update-message
    desc: Update-related lure message
    crit: notable
    conf: 0.8
    any:
      - id: metadata/lang/natural/phrasing/documentation::system-update-message-text
      - id: check-updates
  - id: compat-lure
    desc: Compatibility-related lure message
    crit: suspicious
    conf: 0.9
    any:
      - id: compat-wizard
      - id: compat-issue
      - id: missing-extensions
      - id: missing-required-ext
  - id: compat-wizard-attack
    desc: Compatibility Wizard user execution lure
    crit: suspicious
    conf: 0.95
    all:
      - id: compat-wizard
      - id: missing-message
  - id: fake-update-attack
    desc: Fake system update user execution
    crit: suspicious
    conf: 0.9
    all:
      - id: update-message
      - id: install-components
  - id: missing-components-attack
    desc: Missing components user execution lure
    crit: suspicious
    conf: 0.9
    all:
      - id: missing-message
      - id: user-action-instruction
  - id: lure-with-shell
    desc: User execution lure with shell references
    crit: suspicious
    conf: 0.95
    for:
      - applescript
    all:
      - id: compat-lure
      - id: micro-behaviors/process/create/shell/command-string::shell-execution-references
  # Umbrella for "the dialog is a pretext for making the user act". Each leg
  # is already a recognized lure on its own; this exists so the hostile rules
  # below can be written once against the class rather than once per pretext,
  # and so a new pretext only has to be added here.
  - id: user-execution-dialog-lure
    desc: Dialog pretext for user execution
    crit: suspicious
    conf: 0.92
    any:
      - id: compat-lure
      - id: compat-wizard-attack
      - id: fake-update-attack
      - id: missing-components-attack

  # A deceptive dialog alongside script-load and shell references is a
  # behavioral clue; those references do not establish a network fetch.
  - id: lure-driven-remote-stage-execution
    desc: Deceptive dialog with script and shell clues
    crit: hostile
    conf: 0.96
    attack: T1204.002,T1105
    for: [applescript]
    all:
      - id: user-execution-dialog-lure
      - id: micro-behaviors/os/module/load/path::applescript-load-shell-references

  # Same conclusion where the stage is loaded on a timer rather than inline:
  # the delay is there so the fetch and the execution do not happen while a
  # sandbox is still watching.
  - id: lure-driven-delayed-stage-load
    desc: Dialog lure with a delayed stage load
    crit: hostile
    conf: 0.95
    attack: T1204.002,T1497.003
    for: [applescript]
    all:
      - id: user-execution-dialog-lure
      - id: micro-behaviors/os/module/load/path::applescript-shell-load-delay-clues

  - id: lure-missing-extensions-timed-load
    desc: Missing-extensions lure with delayed stage load
    crit: hostile
    conf: 0.95
    attack: T1204.002,T1497.003
    for: [applescript]
    all:
      - id: missing-extensions
      - id: micro-behaviors/os/module/load/path::applescript-shell-load-delay-clues
