# Executable and installer download lures rendered dynamically inside `about:blank`
# popups (including popups spawned via nested-iframe `contentWindow.open` sandbox
# escapes to bypass download restrictions inside sandboxed preview frames).
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  attack: T1204.001,T1189
  mbc: B0011

composite_rules:
  - id: blank-popup-executable-download-lure
    desc: Blank popup injects executable or installer download lure
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/ui/window/navigation/open::blank-popup-window-open
      - id: micro-behaviors/ui/window/dom/render::popup-window-markup-injection
      - id: micro-behaviors/ui/window/dom/render::popup-script-execution-sink
    any:
      - id: micro-behaviors/communications/http/download/browser::installer-download-link
      - id: micro-behaviors/communications/url/resource-path/file::http-executable-url-reference

  - id: escaped-popup-auto-triggered-installer-download
    desc: Escaped sandbox popup auto-triggers installer download
    crit: hostile
    conf: 0.99
    scope: file
    attack: T1189,T1204.001,T1562.001
    near_bytes: 4096
    all:
      - id: objectives/evasion/security-bypass/policy/browser::nested-iframe-popup-escape
      - id: micro-behaviors/ui/window/dom/render::popup-window-markup-injection
      - id: micro-behaviors/communications/http/download/browser::installer-download-link
    any:
      - id: micro-behaviors/ui/window/click::programmatic-element-click
      - id: micro-behaviors/ui/window/click::element-id-programmatic-click
      - id: micro-behaviors/ui/window/navigation/location::browser-location-external-method
      - id: micro-behaviors/ui/window/navigation/location::browser-location-external-assign
