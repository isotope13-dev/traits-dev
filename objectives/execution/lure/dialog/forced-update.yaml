# A "your version can no longer run, download the update" screen is a
# social-engineering stage: the installed program does nothing but push the
# user to fetch and run an archive. TrojanPony's PromptReel lure (2026) ships a
# .NET "app" whose only window says so and whose button opens a ZIP on an
# InfinityFree subdomain. Real self-updaters download and verify their own
# packages; they do not send the user to a browser for an archive.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1204.002

traits:
  - id: app-can-no-longer-run-update-text
    desc: Lure text says app must be updated
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)can no longer (run|be used|start)\b.{0,40}\b(download|install|get) (the |an )?update'

composite_rules:
  - id: forced-update-archive-download-lure
    desc: Program claims it can no longer run and opens a remote archive as the update
    crit: hostile
    conf: 0.95
    all:
      - id: app-can-no-longer-run-update-text
      - id: micro-behaviors/communications/url/resource-path/archive::executable-remote-archive-url
    any:
      - id: micro-behaviors/process/config/launch::use-shell-execute-property
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start-call
      - id: micro-behaviors/process/create/exec::child-process-execution

  - id: forced-update-lure-free-host-archive
    desc: Forced-update lure text with an update archive on a free web host
    crit: hostile
    conf: 0.96
    all:
      - id: app-can-no-longer-run-update-text
      - id: micro-behaviors/communications/url/resource-path/archive::executable-remote-archive-url
    any:
      - id: objectives/command-and-control/infrastructure/domain/hosting::infinityfree-subdomain-url-a
      - id: objectives/command-and-control/infrastructure/domain/hosting::infinityfree-subdomain-url-b
      - id: objectives/command-and-control/infrastructure/domain/hosting::free-webhost-domain
