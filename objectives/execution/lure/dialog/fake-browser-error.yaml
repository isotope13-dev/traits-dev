# Fake browser-error pages that tell the visitor to approve an install.
# The title is the whole document title, so a help article that merely
# mentions the error does not match.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.94
  attack: T1204.001

traits:
  - id: install-update-yes-prompt
    desc: Update text asks to click Yes
    if:
      type: text
      regex: '(?i)\b(updat\w*|install\w*)\b[^<\n]{0,48}\b(click|select)\b[^<\n]{0,24}\byes\b'
      exclude_html_comments: true

composite_rules:
  - id: fake-browser-error-install-lure
    desc: Fake error page loads install script
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/document/html::browser-error-title
      - id: install-update-yes-prompt
      - id: micro-behaviors/communications/http/client/resource::remote-script-element-source
