# An extension that runs on every site and covers pages with a top-layer
# "your browser is not supported, download ..." panel. The extension's own
# browser is by definition supported; the panel exists to push a download.
defaults:
  platforms: [windows, unix]
  attack: T1176,T1204.001

composite_rules:
  - id: content-script-browser-unsupported-lure
    desc: All-site extension overlays a fake browser-unsupported download lure
    crit: hostile
    conf: 0.96
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript, json]
    all:
      - id: metadata/permission/host::broad-content-script-matches
      - id: micro-behaviors/ui/dialog/error::browser-unsupported-download-wording
      - id: objectives/impact/ui/manipulation/interstitial::top-layer-z-index
