# Deceptive lures that instruct visitors to approve an ActiveX security prompt
# or click YES in browser dialogs under false claims of Authenticode certification.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1204.001,T1036.008

traits:
  - id: certified-authenticode-claim
    desc: Claims Microsoft Authenticode certification
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bcertified\s+by\s+Microsoft\s+Authenticode\b'
      exclude_html_comments: true

  - id: dialog-box-yes-prompt
    desc: Instructs user to click Yes in dialog
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(press|click)\s+(<[^>]{1,24}>\s*)?yes\b.{0,60}dialog\s+box'
      exclude_html_comments: true

composite_rules:
  - id: authenticode-dialog-approval-lure
    desc: Page lures user to approve ActiveX Authenticode dialog
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/com/automation::html-activex-classid-object
      - id: certified-authenticode-claim
      - id: dialog-box-yes-prompt
    near_bytes: 2000
