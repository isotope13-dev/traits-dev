defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: remus-browser-delivery-link
    desc: PowerShell opens a known Remus payload link in the default browser
    crit: hostile
    conf: 0.999
    attack: T1105,T1204.001
    all:
      - id: micro-behaviors/communications/url/http-path/resource::wappinger-s44-token-url
      - id: micro-behaviors/process/create/command::start-process-call
