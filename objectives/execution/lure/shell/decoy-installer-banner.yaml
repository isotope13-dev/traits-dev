# Paste-and-run one-liners that print a familiar installer URL (bun.sh,
# brew.sh, claude.ai) and then execute a shell stage from a raw external IP.
# The banner names a domain; the fetched host is a bare address, so the text
# shown to the user does not describe what runs.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1204.004,T1036,T1105,T1059.004
composite_rules:
- id: decoy-installer-banner-raw-ip-shell
  desc: Installer URL decoy before raw-IP shell stage
  crit: hostile
  conf: 0.95
  near_bytes: 320
  all:
  - id: micro-behaviors/os/console/banner::echo-installer-domain-url
  any:
  - id: micro-behaviors/process/deploy/interpreter-stdin/network::raw-ip-shell-c-fetch-substitution
  - id: micro-behaviors/process/deploy/interpreter-stdin/network::raw-ip-curl-shell-pipeline
