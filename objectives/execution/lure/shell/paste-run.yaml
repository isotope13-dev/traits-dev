# ClickFix / paste-and-run lures: text that instructs a user (or an agent
# acting for one) to paste and run a shell command. Sibling of lure/clipboard/
# (the Windows Win+R variant); this covers terminal download-pipe-exec and
# destructive `rm -rf` paste-run. Generic command tokens live in
# micro-behaviors/data/keywords/; the run/paste cues below are the
# attack-context-specific fragments.
defaults:
  platforms: [unix, windows]
  for: [html, scripts, markdown]
  attack: T1204
traits:

- id: run-rm-rf-this
  desc: Run/paste cue before `rm -rf`
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\b(run|execute|paste)\s+(this|the)\b.{0,80}\brm\s+-rf\b'
    case_insensitive: true

- id: run-rm-rf-following
  desc: Run/paste the following `rm -rf`
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\b(run|execute|paste)\s+(following|command)\b.{0,80}\brm\s+-rf\b'
    case_insensitive: true

- id: run-rm-rf-shell
  desc: Run/paste `rm -rf` in a shell/terminal
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\b(run|execute|paste)\s+(shell command|in (a )?terminal)\b.{0,80}\brm\s+-rf\b'
    case_insensitive: true

- id: run-rm-rf-into-shell
  desc: Run/paste `rm -rf` into a shell
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\b(run|execute|paste)\s+(into (a )?shell)\b.{0,80}\brm\s+-rf\b'
    case_insensitive: true

- id: paste-rm-rf-literal
  desc: Paste cue before quoted `rm -rf`
  crit: notable
  conf: 0.92
  if:
    type: text
    # "Run `rm -rf build-dir`" is ordinary cleanup guidance. The deceptive
    # execution cue this family models is asking the user to paste a command.
    regex: '\bpaste\s+[`"'']rm\s+-rf\b'
    case_insensitive: true

- id: user-run-cue-instruct
  desc: User or operator instruction cue
  crit: component
  conf: 0.84
  if:
    type: text
    regex: '\b(ask|tell|instruct) (the )?(user|operator)\b'
    case_insensitive: true

composite_rules:
- id: user-run-cue
  desc: Instructs user/operator to run a command
  crit: component
  conf: 0.84
  near_bytes: 16
  all:
  - id: user-run-cue-instruct
  any:
  - id: micro-behaviors/ui/help::command-run-instruction
  - id: micro-behaviors/ui/help::paste-command-instruction

- id: paste-run-destructive-shell
  desc: Paste-and-run destructive shell command
  crit: suspicious
  conf: 0.92
  any:
  - id: run-rm-rf-this
  - id: run-rm-rf-following
  - id: run-rm-rf-shell
  - id: run-rm-rf-into-shell
  - id: paste-rm-rf-literal
  unless:
  - id: metadata/package/testing/corpus/
  - id: metadata/package/documentation/agent-safety::injection-review-inert-examples
  # agent-glovebox is a defensive agent sandbox; its evals, risk tests and docs quote the operations it grades.
  - id: well-known/tool/detection/agent-glovebox::archive-context
  - id: metadata/package/testing/presence/harness::test-directory
  - id: "metadata/file/naming::test-directory-component"
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/app/ai/coding-agent/command-code::command-code-package-context

- id: download-pipe-exec
  desc: Paste-and-run download-pipe execution
  crit: notable
  conf: 0.88
  near_bytes: 220
  all:
  - id: micro-behaviors/communications/http/client/library::powershell-http-observations
  - id: micro-behaviors/data/runtime/keywords::pipe-to-interpreter
  any:
  - id: user-run-cue
  - id: metadata/package/documentation/claims::run-download-client-wording
  unless:
  - id: well-known/tool/detection/security-scanner/
