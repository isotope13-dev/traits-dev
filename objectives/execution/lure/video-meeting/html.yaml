defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  attack: T1204.001
traits:
- id: meeting-app-brand-lure
  # A brand literal is only a fragment of lure evidence. Keep it available to
  # the media-capture lures below, but do not report a bare spreadsheet token
  # such as SheetJS's uppercase ZOOM command as a meeting-app lure.
  desc: Meeting app brand token
  crit: component
  conf: 0.86
  if:
    type: literal
    kind: string
    # Case-sensitive on purpose: these are brand names, and a lure spells them
    # as such. Matching case-insensitively made the bare word `zoom` a meeting
    # brand, while SheetJS uses uppercase ZOOM for a spreadsheet command.
    regex: '^(Zoom|Google Meet|Microsoft Teams|Webex)$'

# Browser media capture next to a generic secure WebSocket is normal for video
# calls and transcription services. Lure intent requires the stronger clipboard
# or recording-upload evidence below.
composite_rules:
- id: fake-video-meeting-media-lure
  desc: Fake video meeting media lure
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/hardware/input/media::browser-media-capture-api
  - id: meeting-app-brand-lure
  - id: meeting-device-permission-lure
  any:
  - id: objectives/execution/lure/clipboard/page::generic-windows-clipboard-execution-lure
  - id: objectives/execution/lure/clipboard/page::generic-windows-command-clipboard-lure
  - id: micro-behaviors/communications/http/upload::mediarecorder-upload-endpoint-context
- id: fake-meeting-camera-exfiltration
  desc: Fake meeting camera exfiltration
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/hardware/input/media::browser-media-capture-api
  - id: meeting-app-brand-lure
  - id: micro-behaviors/communications/http/upload::mediarecorder-upload-endpoint-context
- id: fake-meeting-clickfix-execution
  for: [html]
  desc: Fake meeting ClickFix execution
  crit: hostile
  conf: 0.98
  all:
  - id: fake-video-meeting-media-lure
  - id: objectives/execution/lure/clipboard/page::generic-windows-command-clipboard-lure
- id: meeting-device-permission-lure
  # A genuine lure pairs a permission-grant verb with a capture-device word in
  # proximity ("allow access to your camera and microphone"). A lone neutral
  # word (clinify docs saying "allow") is not a lure — hence the co-occurrence
  # requirement; the neutral terms live in metadata/permission/capture/media-terms.yaml.
  desc: Meeting device permission lure
  crit: component
  conf: 0.86
  near_bytes: 80
  all:
  - id: metadata/permission/capture::capture-device-term
  any:
  - id: metadata/permission/capture::permission-grant-access-verb
  - id: metadata/permission/capture::permission-grant-device-verb
