# ClickOnce manifests that pose as Microsoft software.
#
# Microsoft does not ship unsigned ClickOnce deployments, and it does not
# host them on third-party domains. A manifest whose install prompt reads
# "Microsoft Windows" but which is unsigned, or which pulls its application
# from a lookalike host, is a one-click lure that installs and runs the
# attacker's .NET payload under the user's account.
defaults:
  for: [xml, text, documents]
  platforms: [windows]
  crit: hostile
  attack: T1204.002,T1036.005,T1127
  mbc: B0025

composite_rules:
  - id: unsigned-clickonce-claims-microsoft
    desc: Unsigned ClickOnce deployment presents itself as Microsoft software
    conf: 0.93
    all:
      - id: metadata/package/files/clickonce::clickonce-deployment-manifest
      - id: metadata/package/files/clickonce::clickonce-unsigned-identity-token
      - id: metadata/package/files/clickonce::clickonce-microsoft-publisher-claim

  - id: clickonce-microsoft-claim-lookalike-codebase
    desc: ClickOnce deployment claiming Microsoft fetches from a lookalike host
    conf: 0.95
    all:
      - id: metadata/package/files/clickonce::clickonce-microsoft-publisher-claim
      - id: metadata/package/files/clickonce::clickonce-codebase-brand-subdomain

  - id: clickonce-microsoft-claim-plain-http
    desc: ClickOnce deployment claiming Microsoft installs its application over plain HTTP
    conf: 0.9
    all:
      - id: metadata/package/files/clickonce::clickonce-microsoft-publisher-claim
      - id: metadata/package/files/clickonce::clickonce-codebase-plain-http
