defaults:
  platforms: [windows, unix]
  for: [html]
  crit: suspicious
  conf: 0.9


composite_rules:
- id: html-macro-delivery-lure
  desc: HTML lure delivers remote macro document
  crit: hostile
  conf: 0.98
  attack: T1204.002
  all:
  - id: objectives/execution/lure/macro-document::html-macro-url-download-attribute-clues
  - id: metadata/document/html/page::browser-open-and-downloads-macro-clues
- id: html-decrypted-redownload-macro-lure
  desc: HTML claims decrypted re-download of macro document
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/execution/lure/macro-document::html-macro-url-download-attribute-clues
  - id: metadata/document/html/page::redownload-decrypted-claim
