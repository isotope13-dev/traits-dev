defaults:
  platforms: [windows, unix]
  for: [html]
  crit: suspicious
  conf: 0.9


composite_rules:
- id: html-macro-url-download-attribute-clues
  desc: HTML macro URL and download attribute clues
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/communications/url/resource-path/file::office-macro-document-url
  - id: micro-behaviors/communications/http/download/browser::html-anchor-download-attribute
- id: shared-file-wording-macro-download-clues
  desc: Shared-file wording and macro download clues
  crit: suspicious
  conf: 0.97
  all:
  - id: objectives/execution/lure/macro-document::html-macro-url-download-attribute-clues
  any:
  - id: well-known/app/storage/dropbox::encrypted-shared-dropbox-text
  - id: metadata/document/html/page::secure-share-language
