# An Internet Shortcut is a click-to-open pointer. Aimed through file:// at a
# remote SSL WebDAV root or a public-IP share and ending in something Windows
# runs on open (another shortcut, a PE or a script), one click runs
# attacker-hosted code. Software distribution does not ship this.
defaults:
  platforms: [windows]
  for: [text]

composite_rules:
- id: url-shortcut-remote-share-launchable-target
  desc: Internet Shortcut opens an executable, script or shortcut on a remote file share
  crit: hostile
  conf: 0.97
  attack: T1204.002,T1105
  all:
    - id: metadata/file/format/structured::windows-internet-shortcut-header
    - id: micro-behaviors/communications/url/reference::url-assignment-launchable-target
  any:
    - id: micro-behaviors/communications/url/reference::url-assignment-webdav-ssl-share
    - id: micro-behaviors/communications/url/reference::url-assignment-public-ip-file-share

# Mailed as an archive so the gateway sees an archive, not a shortcut. Opening
# the extracted .url mounts the attacker's WebDAV share in Explorer, where
# the next-stage lure (LNK, script, installer) is one more click away.
- id: archived-url-shortcut-webdav-share
  desc: Archive's only file is an Internet Shortcut mounting a remote WebDAV share
  crit: hostile
  conf: 0.95
  for: [zip, 7z, rar, iso, text]
  scope: outer
  attack: T1204.002,T1105,T1566.001
  all:
    - id: metadata/archive/layout::archive-sole-member
    - id: micro-behaviors/communications/http/webdav::internet-shortcut-webdav-ssl-target
