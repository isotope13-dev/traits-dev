# An Internet Shortcut that points at a script or executable on a share at a
# public IP address: clicking it fetches and runs code from an internet host
# over SMB/WebDAV, bypassing the browser download path entirely.
defaults:
  platforms: [windows]
  for: [text]
  attack: T1204.002,T1105

composite_rules:
- id: url-shortcut-internet-share-runnable
  desc: Shortcut runs a file from an internet share
  crit: hostile
  conf: 0.95
  all:
    - id: metadata/file/format/structured::windows-internet-shortcut-header
    - id: micro-behaviors/communications/url/reference::url-assignment-public-ip-file-share
    - id: micro-behaviors/communications/url/reference::url-assignment-remote-runnable-target
