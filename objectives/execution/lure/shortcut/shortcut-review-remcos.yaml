defaults:
  platforms: [windows]
  for: [lnk, powershell]
  attack: T1204.002

composite_rules:
  - id: lnk-bigint-xor-temp-script-fetch
    for: [lnk]
    desc: Shortcut lure fetches script with XOR clues
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/config/target::lnk-powershell-target
      - id: micro-behaviors/data/bitwise/mixed::powershell-bigint-xor-byte-operations
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::powershell-webrequest-temp-ps1
    any:
      - id: objectives/evasion/masquerade/file/double-ext::image-double-extension-lnk
      - id: micro-behaviors/ui/graphics/icon::lnk-shell32-icon-location
