defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1204.002

composite_rules:
  - id: lnk-document-lure-script-host
    desc: Document-named LNK launches a script host
    crit: hostile
    conf: 0.97
    attack: T1059.005,T1204.002
    all:
      - id: micro-behaviors/process/config/target::lnk-script-host-target
      - id: metadata/file/extension/executable::lnk-pdf-double-extension
      - id: micro-behaviors/process/config/launch::lnk-has-arguments
  - id: lnk-root-dll-update-lure
    desc: LNK targets volume-root dll.dll payload
    crit: hostile
    conf: 0.97
    attack: T1204.002,T1036.005
    all:
      - id: micro-behaviors/fs/path/binary::utf16-drive-root-dll
      - id: objectives/evasion/masquerade/identity/mimicry::french-auto-update-lure
  - id: lnk-chained-shortcut-data-lure
    desc: Data-named shortcut chains to another shortcut
    crit: hostile
    conf: 0.95
    attack: T1204.002,T1036.008
    all:
      - id: metadata/file/format/structured::lnk-target-is-a-shortcut
      - id: micro-behaviors/fs/path/data-file::lnk-relative-data-extension
