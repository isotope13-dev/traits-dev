defaults:
  platforms: [windows]
  for: [text]

composite_rules:
- id: url-shortcut-archive-icon-or-name-clues
  desc: Archive shortcut with icon or name clues
  crit: suspicious
  conf: 0.96
  all:
    - id: metadata/file/format/structured::windows-internet-shortcut-header
    - id: metadata/file/extension/identity::url-shortcut-extension
    - id: micro-behaviors/communications/url/reference::internet-shortcut-archive-url
  any:
    - id: micro-behaviors/fs/path/library::zipfldr-icon-file-reference
    - id: objectives/evasion/masquerade/file/double-ext::document-extension-url-shortcut-name

