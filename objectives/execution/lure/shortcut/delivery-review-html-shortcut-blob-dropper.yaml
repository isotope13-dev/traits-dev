defaults:
  platforms: [windows]
  for: [html]
  attack: T1204.002

composite_rules:
  - id: html-shortcut-blob-dropper
    desc: HTML fetches and drops shortcut
    crit: hostile
    conf: 0.99
    # `dom-anchor-element-creation` is for: [javascript, typescript] -- the
    # DOM/fetch APIs it and its sibling legs require only evaluate in the
    # javascript-typed node, matching the established
    # fetch-and-download profile in metadata/file/profile/transfer/http-download.
    for: [javascript]
    all:
      - id: micro-behaviors/communications/http/download/browser::fetch-response-blob
      - id: micro-behaviors/data/collection/dom::dom-anchor-element-creation
      - id: micro-behaviors/ui/window/click::programmatic-element-click
      - id: micro-behaviors/communications/http/download/browser::download-attribute-shortcut
    any:
      - id: micro-behaviors/communications/http/download/browser::fetches-remote-lnk
      - id: micro-behaviors/communications/ip/literal::http-ip-url
