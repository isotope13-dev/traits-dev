defaults:
  platforms: [windows]
  attack: T1204.002
  for: [lnk]

composite_rules:
  - id: minimized-powershell-policy-bypass-script
    desc: Minimized PowerShell LNK bypasses policy to run a script
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1204.002
    all:
      - id: micro-behaviors/process/config/target::lnk-powershell-family
      - id: "micro-behaviors/ui/window/state::lnk-minimized-inactive-window"
      - id: micro-behaviors/os/security/policy::lnk-relaxed-execution-policy
      - id: micro-behaviors/process/argument/file::powershell-script-file-argument
      - id: micro-behaviors/ui/graphics/icon::lnk-shell32-icon-location
