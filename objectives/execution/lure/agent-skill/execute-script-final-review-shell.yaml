defaults:
  attack: T1105
  mbc: B0024
  platforms:
    - unix
    - windows
  for:
    - shell

composite_rules:
  - id: skill-passworded-download-fetch-shell
    desc: Skill instructs passworded download and shell fetch
    crit: hostile
    conf: 0.97
    attack: T1204.002,T1059.004
    for: [markdown]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: metadata/package/documentation/claims::executable-archive-password-instructions
      - id: micro-behaviors/process/create/shell/command-mode::shell-c-command-substitution-fetch
    unless:
      - id: metadata/package/documentation/security-exercise::technique-catalog-notes
    downgrade:
      any:
        - id: well-known/tool/detection/agent/snyk-agent-scan::upstream-skill-fixture-context
  - id: skill-release-exe-fetch-shell
    desc: Skill instructs release executable and shell fetch
    crit: hostile
    conf: 0.97
    for: [markdown]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/communications/url/external/github::github-release-executable-download
      - id: micro-behaviors/process/create/shell/command-mode::shell-c-command-substitution-fetch
    downgrade:
      any:
        - id: well-known/tool/detection/agent/snyk-agent-scan::upstream-skill-fixture-context
  - id: skill-masked-installer-ip-fetch
    desc: Masked skill installer and IP URL clues
    crit: hostile
    conf: 0.97
    for: [shell, markdown, text]
    all:
      - id: objectives/supply-chain/trojanized/app/agent-skill::skill-decoy-echo-masked-installer
      - id: micro-behaviors/communications/ip/literal::http-ip-url
    unless:
      - id: metadata/package/testing/harness/unit::javascript-vitest-unit-test-context

  # Unlike the two composites above, neither leg here is attack-shaped on its
  # own: a GitHub release-asset URL plus "a curl command names a URL" is what
  # every project's own install documentation looks like. The skill frontmatter
  # is what makes this an *agent* instruction rather than a README -- a
  # SKILL.md steering an agent to curl down a release binary is the delivery
  # step; a maintainer documenting `curl -fLO
  # https://github.com/<own-repo>/releases/download/$RELEASE/<app>.zip` is not.
  # Observed on slskdN's docs/self-hosted-relay-tester-guide.md and its
  # memory-bank changelogs, which record the project's own release URLs and
  # dozens of unrelated `curl` invocations.
