# "Prerequisite" sections in skills and READMEs that are the payload
# (ClawHavoc / AMOS delivery, 2026): one platform gets a passworded archive
# to run, the other a base64 blob piped to bash that pulls a stage from a
# bare IP address.
defaults:
  platforms: [windows, macos, unix]
  for: [markdown, text]
  crit: hostile
  attack: T1204.002,T1027.013,T1105

composite_rules:
  - id: instruction-base64-shell-fetches-raw-ip
    desc: Instructions pipe base64 to a shell that fetches from a bare IP
    conf: 0.96
    for: [markdown]
    all:
      - id: micro-behaviors/process/create/shell/pipe::base64-decode-piped-to-shell
      - id: micro-behaviors/communications/ip/literal::http-ip-url-filtered-text
      - id: micro-behaviors/process/create/shell/command-mode::shell-c-command-substitution-fetch

  - id: instruction-passworded-download-then-run
    desc: Instructions fetch a passworded archive, unpack and run it
    conf: 0.9
    all:
      - id: metadata/lang/natural/instruction::extract-with-supplied-password-instruction
    any:
      - id: micro-behaviors/communications/url/external/github::github-release-zip-link
      - id: metadata/package/documentation/page::readme-zip-extension-link
