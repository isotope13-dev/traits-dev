defaults:
  platforms: [windows]
  attack: T1204.002

traits:
  - id: cheat-injector-unlock-code-line
    desc: Text gives an unlock code
    crit: notable
    conf: 0.9
    for: [text]
    if:
      type: text
      regex: '(?i)(^|[^;#\s])\s*(unlock code|password)\s*[-:]'
  - id: cheat-injector-perform-injection-step
    desc: Text says to perform injection
    crit: notable
    conf: 0.9
    for: [text]
    if:
      type: text
      regex: '(?i)perform\s+the\s+injection'

composite_rules:
  # A readme that hands out an unlock code and tells the user to inject into
  # a game. Both phrases are needed; a generic injector readme carries neither
  # an unlock code nor a password-gated launcher. The note alone is a lure, not
  # attack evidence: the hostile claim needs the nested archive that
  # objectives/evasion/decoy/lure::game-injection-bundle-with-password-note joins.
  - id: encrypted-cheat-injector-readme
    desc: Game readme gives unlock code and injection steps
    crit: notable
    conf: 0.93
    scope: file
    for: [text]
    attack: T1204.002,T1055
    all:
      - id: cheat-injector-unlock-code-line
      - id: cheat-injector-perform-injection-step

  # Password-gated nested archive with a short member list. The readme inside
  # the archive is not visible to archive-scoped composites, so this leg stays
  # suspicious on its own.
  - id: encrypted-nested-archive-lure-layout
    desc: Encrypted nested ZIP with a readme beside it
    crit: suspicious
    conf: 0.85
    scope: archive
    for: [zip]
    all:
      - id: metadata/archive/encryption::archive-encrypted-member
      - id: metadata/archive/member/extension::archive-nested-zip-member
