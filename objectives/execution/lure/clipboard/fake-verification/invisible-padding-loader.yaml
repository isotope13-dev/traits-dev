# ClickFix command lines padded with invisible characters or carrying a fake
# verification ID so the pasted text looks like a CAPTCHA step. Observed in
# GzipGnaw ("# CloudFlare Captcha ID: ..." after irm|iex), TokenTooth and
# SkinFrame (zero-width spaces inside the msiexec message property).
defaults:
  platforms: [unix, windows]
  attack: T1204.004,T1027
  for: [batch, powershell, shell, html, javascript, text]
traits:
  - id: verification-id-comment-after-loader
    desc: Loader command with fake verification ID
    crit: suspicious
    conf: 0.9
    if:
      type: text
      # Remote-code sink followed on the same line by a trailing comment that
      # names a CAPTCHA / Ray / verification ID: the ID is never read by the
      # shell, it only dresses the pasted command up as a human check.
      regex: '(?i)\|\s*(iex|bash|sh)\b[^\r\n#]{0,20}#[^\r\n]{0,24}\b(captcha|ray|verification)\s*id'
  - id: msiexec-mixed-script-property
    desc: msiexec property mixes Latin and Cyrillic
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bmsiexec(\.exe)?\s[^\r\n]{0,200}[A-Za-z][\x{0400}-\x{04FF}]'
composite_rules:
  - id: clipboard-loader-with-verification-id
    desc: Clipboard loader dressed with verification ID
    crit: hostile
    conf: 0.95
    attack: T1204.004,T1059.001,T1115
    for: [html, javascript, typescript]
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: verification-id-comment-after-loader
  - id: invisible-padded-remote-command
    desc: Remote command padded with invisible characters
    crit: hostile
    conf: 0.9
    near_bytes: 400
    all:
      - id: metadata/lang/encoding/shape/character::zero-width-format-character
    any:
      - id: micro-behaviors/os/package-manager/install::msiexec-remote-url-install
      - id: objectives/execution/payload/script-eval/network/response-body::powershell-webrequest-to-iex-pipeline
