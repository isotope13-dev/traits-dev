defaults:
  platforms: [macos, windows]
  for: [html]
  attack: T1204.001
traits:
- id: fake-verification-id-message
  desc: Fake reCAPTCHA verification ID output
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: 'reCAPTCHA Verification ID:.{0,80}id="verification-id"'
- id: verification-id-dom
  desc: Verification ID DOM marker
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: id="verification-id"
- id: verify-button-id
  desc: Verify button DOM marker
  crit: notable
  conf: 0.75
  if:
    type: text
    substr: id="verify-button"
- id: hidden-checkbox-window
  desc: Hidden checkbox verification window
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: 'id="checkbox-window" class="checkbox-window".{0,40}display'
- id: hidden-step-ui
  desc: Multi-step hidden verification UI
  crit: suspicious
  conf: 0.88
  count_min: 4
  if:
    type: text
    regex: 'class="step[123]".{0,40}display'
- id: data-uri-favicon
  desc: Empty data URI favicon
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: 'id="dynamic-favicon" href="data:,"'
- id: storage-dev-cloudflare-verify-domain
  desc: Cloudflare verify lure on storage.dev
  crit: suspicious
  conf: 0.93
  if:
    type: text
    regex: '[a-z0-9-]*cloudflare-verify[a-z0-9-]*\.t3\.storage\.dev'
- id: compact-verification-html
  desc: Compact staged verification HTML
  crit: notable
  conf: 0.72
  size_max: 8192
  if:
    type: metrics
    field: binary.string_count
    min: 45
    max: 90
- id: unusual-web-traffic-warning
  desc: Fake unusual web traffic warning
  crit: suspicious
  conf: 0.96
  if:
    type: text
    substr: Unusual Web Traffic Detected
- id: automated-verification-failed
  desc: Claims automated verification attempts failed
  crit: suspicious
  conf: 0.94
  if:
    type: text
    substr: Automated verification attempts have failed
- id: localstorage-cls-gate
  desc: Uses localStorage cls counter to gate lure
  crit: suspicious
  conf: 0.9
  if:
    type: text
    substr: localStorage.cls
- id: encoded-localstorage-cls-gate
  desc: Encoded localStorage cls counter marker
  crit: suspicious
  conf: 0.95
  if:
    type: text
    substr: bG9jYWxTdG9yYWdlLmNscy
- id: verification-code-decoy-text
  desc: Fake verification code decoy text
  crit: notable
  conf: 0.93
  if:
    type: text
    substr: Cloudflare protection
- id: click-count-gate
  desc: "Multi-click gating pre revealing instructions"
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: clickCount\s*===\s*clickCounts
- id: verification-failure-message
  desc: Reports a failed verification or security check
  crit: notable
  conf: 0.94
  platforms: [windows]
  if:
    type: text
    regex: '(?i)\b(verification\s+failed|security\s+check\s+failed)\b'
- id: verification-identity-prompt
  desc: Prompts the user to verify identity
  crit: notable
  conf: 0.92
  platforms: [windows]
  if:
    type: text
    regex: '(?i)\bverify\s+(it.?s|it\s+is)\s+you\b'
composite_rules:
- id: fake-human-verification-cue
  desc: Page presents a fake human-verification action
  crit: component
  conf: 0.86
  platforms: [windows]
  any:
  - id: objectives/credential-access/phishing/captcha::verify-human-text
  - id: objectives/credential-access/phishing/captcha::not-a-robot-text
  - id: objectives/credential-access/phishing/captcha::checking-human-text
- id: staged-verification-ui-lure
  desc: Staged hidden verification interface
  crit: suspicious
  conf: 0.95
  all:
  - id: hidden-checkbox-window
  - id: verify-button-id
  any:
  - id: hidden-step-ui
  - id: micro-behaviors/process/create/load/script::local-script-element-load
  - id: compact-verification-html
  - id: data-uri-favicon
- id: manual-verification-failure-lure
  desc: Verification failure paired with manual prompt
  crit: suspicious
  conf: 0.94
  platforms: [windows]
  all:
  - id: verification-failure-message
  any:
  - id: objectives/execution/lure/clipboard/instruction::manual-repair-instruction
  - id: verification-identity-prompt
  near_bytes: 700
