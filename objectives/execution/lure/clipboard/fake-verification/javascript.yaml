defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1204.001
traits:
  - id: checkbox-click-trigger
    desc: Checkbox click starts action
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: "\\$\\(['\"]#checkbox1['\"]\\)\\.click\\s*\\("
  - id: verify-php-stage
    desc: Loads verify.php stage
    crit: notable
    conf: 0.9
    if:
      type: text
      word: verify.php
  - id: verify-text-to-textarea
    desc: Verify response assigned textarea
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: "\\.value\\s*=\\s*verifyText\\b"
composite_rules:
  - id: verify-response-clipboard-copy
    desc: Server response copied to clipboard
    crit: suspicious
    conf: 0.94
    all:
      - id: verify-php-stage
      - id: verify-text-to-textarea
      - id: micro-behaviors/os/clipboard/write::browser-dom-clipboard-copy
    any:
      - id: checkbox-click-trigger
      - id: objectives/execution/lure/clipboard/instruction::instruction-panel-reveal
