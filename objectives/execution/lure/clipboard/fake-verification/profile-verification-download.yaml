defaults:
  platforms: [windows]
  for: [powershell, html, javascript]


composite_rules:
  - id: verification-comment-download-clues
    desc: Verification comment and PowerShell download clues
    crit: suspicious
    conf: 0.98
    for: [powershell]
    near_bytes: 2048
    all:
      - id: metadata/lang/source/comment::clickfix-code-verification-comment
    any:
      - id: micro-behaviors/communications/http/client/managed::downloaddata
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::request-powershell
      - id: micro-behaviors/process/deploy/script-eval/network::embedded-powershell-webclient-script-eval
