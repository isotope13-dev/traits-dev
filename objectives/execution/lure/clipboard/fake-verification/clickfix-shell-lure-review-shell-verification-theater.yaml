defaults:
  platforms: [macos, linux]
  for: [shell]
  attack: T1204.004,T1059.004,T1105
  mbc: B0030


composite_rules:
  - id: shell-verification-theater-binary-launch
    desc: Download and executable launch with verification message
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/ui/keywords::human-verification-passed-message
      - id: micro-behaviors/communications/http/curl/command::curl-command-call
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/create/shell/variable-command::execute-quoted-var
