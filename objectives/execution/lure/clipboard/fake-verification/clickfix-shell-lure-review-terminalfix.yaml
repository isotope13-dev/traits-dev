defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1059.001,T1204.002,T1036.005
  mbc: B0030


composite_rules:
  - id: verification-console-archive-launch
    desc: Verification console with archive download and launch clues
    crit: hostile
    conf: 0.97
    attack: T1059.001,T1204.002,T1105
    all:
      - id: micro-behaviors/ui/terminal::powershell-colored-verification-console
      - id: objectives/execution/staging/store::powershell-download-extract-and-execute
    any:
      - id: micro-behaviors/fs/path/application/state::programdata-hex-directory-path
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
