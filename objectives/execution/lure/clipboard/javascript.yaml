defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1204.001
traits:
  - id: checkbox-click-trigger
    desc: Checkbox click starts action
    crit: component
    conf: 0.86
    if:
      type: text
      regex: "\\$\\(['\"]#checkbox1['\"]\\)\\.click\\s*\\("
  - id: verify-php-stage
    desc: Loads verify.php stage
    crit: notable
    conf: 0.9
    if:
      type: text
      word: verify.php
  - id: send-tg-php-stage
    desc: Sends data to Telegram relay
    crit: suspicious
    conf: 0.92
    if:
      type: text
      word: send_tg.php
  - id: verify-text-to-textarea
    desc: Verify response assigned textarea
    crit: component
    conf: 0.88
    if:
      type: text
      regex: "\\.value\\s*=\\s*verifyText\\b"
  - id: open-fix-beacons
    desc: Open and fix query beacons
    crit: component
    conf: 0.86
    count_min: 2
    if:
      type: text
      regex: "\\?(open=open|fix=fix)"
  - id: instruction-panel-reveal
    desc: Reveals hidden instruction panel
    crit: component
    conf: 0.82
    if:
      type: text
      regex: "#instruction[\\s\\S]{0,80}visible"
  - id: windows-paste-execution-instruction
    desc: Windows paste-run instruction
    crit: notable
    conf: 0.94
    platforms: [windows]
    if:
      type: text
      regex: '(?i)Windows?\s+key.{0,80}\+\s*R.{0,80}(paste|Ctrl\s*\+\s*V).{0,80}(Enter|Return)'

composite_rules:
  - id: remote-response-clipboard-copy
    desc: Remote response text is copied to the browser clipboard
    crit: suspicious
    conf: 0.94
    attack: T1105,T1115
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
      - id: micro-behaviors/os/clipboard/access::browser-clipboard-write
    near_bytes: 512

  - id: fake-captcha-remote-response-clipboard
    desc: Fake CAPTCHA copies a remotely fetched command for Windows execution
    crit: hostile
    conf: 0.98
    attack: T1105,T1115,T1204.001,T1059.001
    all:
      - id: objectives/credential-access/phishing/captcha::not-a-robot-text
      - id: remote-response-clipboard-copy
      - id: micro-behaviors/ui/window/manage/click::browser-click-listener
      - id: windows-paste-execution-instruction
    near_bytes: 1024

  - id: remote-response-clipboard-stager
    desc: Remote response staged for clipboard copy
    crit: hostile
    conf: 0.98
    attack: T1105,T1204.001
    all:
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: micro-behaviors/data/decode/base64::atob-decode
      - id: micro-behaviors/os/clipboard/access::browser-dom-clipboard-copy
      - id: micro-behaviors/communications/ipc/message::postmessage-function-override
      - id: micro-behaviors/ui/window/manage/dom::browser-iframe-srcdoc-assignment
  - id: verify-response-clipboard-copy
    desc: Server response copied to clipboard
    crit: suspicious
    conf: 0.94
    all:
      - id: verify-php-stage
      - id: verify-text-to-textarea
      - id: micro-behaviors/os/clipboard/access::browser-dom-clipboard-copy
    any:
      - id: checkbox-click-trigger
      - id: instruction-panel-reveal
  - id: telegram-relay-post
    desc: Posts staged content to Telegram relay
    crit: suspicious
    conf: 0.93
    near_lines: 5
    all:
      - id: send-tg-php-stage
      - id: micro-behaviors/communications/http/post::post
  - id: clickfix-clipboard-execution-lure
    desc: ClickFix clipboard execution lure
    crit: hostile
    conf: 0.98
    all:
      - id: verify-response-clipboard-copy
      - id: telegram-relay-post
    any:
      - id: open-fix-beacons
      - id: instruction-panel-reveal
      - id: checkbox-click-trigger
