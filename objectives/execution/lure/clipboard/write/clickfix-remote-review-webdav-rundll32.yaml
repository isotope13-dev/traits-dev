defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, html, vbs, text]
  attack: T1204.002,T1105,T1218.011
  mbc: B0024


composite_rules:
  - id: clipboard-webdav-ordinal-loader
    desc: Clipboard write and reconstructed WebDAV ordinal loader
    crit: hostile
    conf: 0.995
    attack: T1204.004,T1027,T1105,T1218.011
    for: [javascript]
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: micro-behaviors/communications/http/webdav::webdav-ssl-unc-path
      - id: objectives/anti-static/obfuscation/string/delimiter::cmd-prefix-toolchain-reconstruction
      - id: objectives/execution/lolbin/os::webdav-ordinal-export-argument
