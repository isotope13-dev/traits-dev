defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1102,T1105,T1115,T1204.001
  mbc: B0024


composite_rules:
  - id: blockchain-command-clipboard-lure
    desc: Blockchain RPC and context API clipboard command lure
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/blockchain/ethereum::jsonrpc-eth-call-body
      - id: micro-behaviors/communications/url/query/command::api-index-context-windows-download-query
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: micro-behaviors/ui/help/interaction::html-winr-shortcut-instruction
    any:
      - id: micro-behaviors/ui/help/interaction::paste-enter-instruction-generic
      - id: objectives/execution/lure/clipboard/instruction::fake-captcha-winr-paste-instructions
      - id: objectives/execution/lure/clipboard/instruction::remote-ctrlv-instruction
    near_bytes: 4096
  - id: etherhiding-command-clipboard-lure
    for: [javascript]
    desc: Polygon resolver and context API clipboard command lure
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/command-and-control/infrastructure/blockchain/polygon::polygon-etherhiding-resolver
      - id: micro-behaviors/communications/url/query/command::api-index-context-windows-download-query
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: micro-behaviors/ui/help/interaction::html-winr-shortcut-instruction
    near_bytes: 4096

  # Adding a remote script element captures the poisoned-page delivery stage;
  # the command/clipboard composite above remains useful for inline stages.
  - id: blockchain-external-script-clipboard-lure
    for: [html]
    desc: External script and blockchain clipboard command lure
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/lure/clipboard/write::blockchain-command-clipboard-lure
      - id: micro-behaviors/communications/http/client/script::external-script-element-load
    near_bytes: 4096
  - id: clipboard-irm-execution-lure
    desc: Win+R clipboard lure with IRM execution
    crit: suspicious
    conf: 0.97
    scope: leaf
    near_bytes: 1024
    all:
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: micro-behaviors/ui/help/interaction::html-winr-shortcut-instruction
    any:
      - id: objectives/execution/payload/script-eval/network/response-body::embedded-iex-irm-call
      - id: objectives/execution/payload/script-eval/network/response-body::embedded-irm-iex-pipeline
