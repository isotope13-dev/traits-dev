defaults:
  platforms: [windows, unix]
  for: [javascript, html]
  attack: T1105
  mbc: B0024

composite_rules:
  - id: clipboard-finger-command
    for: [html]
    desc: Clipboard write and finger command clues
    crit: hostile
    conf: 0.97
    any:
      - id: micro-behaviors/communications/finger::finger-command-user-host
      - id: micro-behaviors/communications/finger::finger-command-user-ip
      - id: micro-behaviors/communications/finger::encoding-and-finger-command-clues
      - id: objectives/command-and-control/channel/finger::finger-output-command-execution
    all:
      - id: objectives/execution/lure/clipboard/write::browser-clipboard-write
  - id: camera-clipboard-archive-command
    desc: Camera API and clipboard archive command clues
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1059.005,T1105,T1123,T1204.002
    near_bytes: 1800
    all:
      - id: micro-behaviors/hardware/input/media::browser-media-capture-api
      - id: objectives/execution/staging/http::browser-curl-archive-script-host-clues
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
