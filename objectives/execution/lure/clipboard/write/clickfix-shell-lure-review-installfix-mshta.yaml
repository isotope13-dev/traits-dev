defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows]
  for: [html, javascript]
  attack: T1204.001,T1218.005,T1059.001,T1105
  mbc: B0030,E1218.005


composite_rules:
  - id: clipboard-browser-gpu-launcher
    desc: OS-gated clipboard with Chromium GPU shell and remote MSHTA
    all:
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: micro-behaviors/communications/http/fingerprint::navigator-useragent-regex-test-branch
      - id: micro-behaviors/process/create/shell/command-mode::chromium-gpu-launcher-shell
      - id: metadata/lang/source/syntax/command/launch::mshta-remote-url-command
    near_bytes: 2400
  - id: clipboard-mshta-package
    desc: Clipboard lure with remote MSHTA package
    all:
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: objectives/execution/interpreter/script/mshta::mshta-remote-package-url
      - id: micro-behaviors/ui/help/interaction::html-winr-shortcut-instruction
      - id: micro-behaviors/ui/help/interaction::paste-enter-instruction-generic
    near_bytes: 2400
  - id: clipboard-irm-iex-cradle
    desc: Clipboard lure with hidden IRM evaluation
    all:
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-ep-bypass-flags
      - id: micro-behaviors/ui/help/interaction::html-winr-shortcut-instruction
    any:
      - id: objectives/execution/payload/script-eval/network/response-body::embedded-irm-iex-pipeline
      - id: objectives/execution/payload/script-eval/network/response-body::embedded-iex-irm-call
    near_bytes: 2400
