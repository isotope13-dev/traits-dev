# Clipboard writing is the required lure mechanism. The nearby command
# profile does not prove the exact clipboard value or a victim paste/run.
defaults:
  conf: 0.97
  platforms: [macos, windows]
  for: [html, javascript]
  mbc: B0024

composite_rules:
  - id: clipboard-curl-zsh-profile
    desc: Clipboard write near curl-to-zsh command
    crit: suspicious
    near_bytes: 1600
    attack: T1059.004,T1204.004
    all:
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: objectives/command-and-control/dropper/delivery/pipe::curl-pipe-zsh
  - id: clipboard-iex-temp-cleanup-profile
    desc: Clipboard write near IEX temp cleanup
    crit: suspicious
    platforms: [windows]
    near_bytes: 1600
    attack: T1059.001,T1204.001
    all:
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: objectives/command-and-control/dropper/delivery/fallback-download::iex-getcontent-raw-cleanup
