defaults:
  platforms: [windows]
  for: [html, javascript, powershell, batch]
  attack: T1059.001,T1059.003,T1059.005,T1105,T1204.002
  mbc: B0024


composite_rules:
  - id: browser-cache-carving-command-clipboard
    desc: Browser cache carving command and clipboard write
    crit: hostile
    conf: 0.99
    attack: T1059.003,T1059.005,T1204.002
    for: [html, javascript]
    all:
      - id: micro-behaviors/fs/path/cache::browser-profile-cache-data-path
      - id: micro-behaviors/fs/directory/readdir/command::batch-recursive-for-loop
      - id: micro-behaviors/fs/write/file/redirect::findstr-temp-redirect
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
    near_bytes: 4096
  - id: cached-image-script-recovery-clipboard
    desc: Image request, cache script recovery and clipboard write
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.005,T1140,T1105,T1204.002
    for: [html, javascript]
    all:
      - id: objectives/execution/payload/file-exec/command/browser-cache::browser-cache-script-recovery
      - id: micro-behaviors/communications/http/client/resource::configured-image-request-clues
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
    near_bytes: 4096
