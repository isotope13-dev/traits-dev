defaults:
  platforms: [macos, windows]
  for: [html]
  attack: T1204.001
traits:
- id: verification-code-copy-button
  desc: Verification code panel with copy button
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: Verification Code
- id: copied-button-feedback
  desc: Copy button changed to Copied feedback
  crit: component
  conf: 0.82
  if:
    type: text
    substr: Copied!
- id: browser-clipboard-write
  desc: Browser clipboard write call
  crit: suspicious
  conf: 0.97
  if:
    type: symbol
    exact: writeText
- id: encoded-browser-clipboard-write
  desc: Encoded browser clipboard write marker
  crit: suspicious
  conf: 0.96
  if:
    type: text
    substr: bmF2aWdhdG9yLmNsaXBib2FyZC53cml0ZVRleHQ
- id: encoded-copy-button
  desc: Encoded copy button marker
  crit: suspicious
  conf: 0.94
  if:
    type: text
    substr: Y29weS1idXR0b24
- id: encoded-copy-button-label
  desc: Encoded Copy button label
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: Q29weTwvYnV0dG9u
- id: clipboard-writes-windows-command--rx-11
  desc: 'Matches ''bitsadmin'''
  crit: notable
  conf: 0.94
  platforms: [windows]
  if:
    type: text
    substr: bitsadmin
    case_insensitive: true
- id: clipboard-writes-windows-command--rx-12
  desc: 'Matches ''certutil'''
  crit: notable
  conf: 0.94
  platforms: [windows]
  if:
    type: text
    substr: certutil
    case_insensitive: true
- id: clipboard-writes-windows-command--rx-15
  desc: Regex component marker
  crit: component
  conf: 0.94
  platforms: [windows]
  if:
    type: text
    regex: '(?i)\bcscript\b'
- id: clipboard-writes-windows-command--rx-16
  desc: Regex component marker
  crit: component
  conf: 0.94
  platforms: [windows]
  if:
    type: text
    regex: '(?i)\bwscript\b'
composite_rules:
- id: clipboard-writes-windows-command
  desc: Clipboard writes Windows command
  crit: suspicious
  conf: 0.94
  platforms: [windows]
  all:
  - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
  any:
  - id: micro-behaviors/process/create/shell/lang::powershell-keyword
  - id: clipboard-writes-windows-command--rx-11
  - id: clipboard-writes-windows-command--rx-12
  - id: micro-behaviors/process/create/launch::regsvr32
  - id: micro-behaviors/mem/read/dump::comsvcs-dump--rx-2
  - id: clipboard-writes-windows-command--rx-15
  - id: clipboard-writes-windows-command--rx-16
  # msiexec is a LOLBin: ClickFix lures that run `msiexec /i <url>.msi` straight
  # from the Run dialog sidestep the PowerShell/cmd tokens above entirely.
  - id: micro-behaviors/process/create/installer::msiexec-package-verb
