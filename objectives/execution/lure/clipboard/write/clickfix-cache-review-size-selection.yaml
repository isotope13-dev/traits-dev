defaults:
  for: [batch, html, javascript, powershell]
  platforms: [windows]

composite_rules:
  - id: clipboard-size-selected-profile-loader
    desc: Clipboard write with size-selected browser profile script launch
    crit: hostile
    conf: 0.99
    for: [html, javascript]
    attack: T1204.002,T1059.003,T1059.005
    all:
      - id: objectives/execution/payload/file-exec/command/browser-profile::size-selected-profile-script-loader
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
    near_bytes: 2048
