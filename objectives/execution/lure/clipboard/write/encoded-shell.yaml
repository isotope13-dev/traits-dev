defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  attack: T1204.004,T1059.004,T1027
composite_rules:
  - id: clipboard-encoded-url-shell-pipeline
    desc: Clipboard write near Base64 URL shell pipeline
    crit: suspicious
    conf: 0.94
    near_lines: 0
    all:
      - id: micro-behaviors/communications/http/url/encoded::base64-decoded-http-url
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: micro-behaviors/process/create/shell/pipeline::curl-decoded-url-shell-pipeline
