defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1204.004,T1218.007,T1115

traits:
  - id: browser-copies-remote-msi-command
    desc: Browser copies remote MSI install command
    crit: suspicious
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '^(navigator|browser)\.clipboard\.writeText$'
      arg:
        index: 0
        kind: string
        regex: '(?i)\bmsiexec(\.exe)?\s+/i\s+["'']?https?://'

  # HTML has no extracted call arguments; bind the literal at the write call.
  - id: html-copies-remote-msi-command
    desc: HTML copies remote MSI install command
    crit: suspicious
    conf: 0.97
    platforms: [windows]
    for: [html]
    if:
      type: text
      regex: '(?i)\bnavigator\.clipboard\.writeText\s*\(\s*["'']msiexec(\.exe)?\s+/i\s+["'']?https?://'
