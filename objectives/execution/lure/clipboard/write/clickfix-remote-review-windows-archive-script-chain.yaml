defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, typescript, vbs, html]
  attack: T1105
  mbc: B0024


composite_rules:
  - id: clipboard-curl-hta-download-clues
    desc: Clipboard write, curl and HTA command clues
    crit: hostile
    conf: 0.99
    attack: T1059.003,T1105,T1204.004
    for: [javascript, html]
    near_bytes: 1600
    all:
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: micro-behaviors/fs/path/extension::hta-extension
      - id: micro-behaviors/process/argument/option::windows-interpreter-command-syntax
    any:
      - id: micro-behaviors/communications/http/download/curl::source-curl-output-option
      - id: objectives/anti-static/obfuscation/string/delimiter::cmd-delayed-curl-fragment-pair
