# ClickFix / InstallFix lures that plant finger.exe user@host queries on the
# clipboard for Win+R paste-run. Distinct from finger-remote-query in lolbin/
# (which excludes HTML docs); here the clipboard+Run context is the signal.
defaults:
  platforms: [windows]
  for: [html, javascript]
  attack: T1204.001,T1105
  mbc: B0030

traits:
  - id: clipboard-finger-user-at-host
    desc: finger.exe user-at-host query text
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bfinger(\.exe)?\s+[A-Za-z0-9._-]{1,64}@[A-Za-z0-9.-]{1,253}\b'

composite_rules:
  - id: clickfix-clipboard-finger-remote-query
    desc: ClickFix clipboard stages finger remote query
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/clipboard/access::browser-clipboard-write
      - id: clipboard-finger-user-at-host
      - id: objectives/execution/lure/clipboard::html-winr-shortcut-instruction
      - id: objectives/execution/lure/clipboard::paste-enter-instruction-generic
    near_bytes: 1600
