defaults:
  platforms: [macos, windows]
  for: [html]
  attack: T1204.001
traits:
- id: hidden-instruction-panel
  desc: Hidden instruction panel in DOM
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: '<div id="instruction" class="cb-container" style="display: none;" role="alert">'
- id: macos-command-space-instruction
  desc: Instructs user to open Spotlight
  crit: notable
  conf: 0.97
  platforms: [macos]
  if:
    type: text
    regex: '<b>⌘</b>\s*\+\s*<b>SPACE</b>.{0,50}open spotlight'
- id: terminal-launch-instruction
  desc: Instructs user to launch Terminal
  crit: notable
  conf: 0.96
  platforms: [macos]
  if:
    type: text
    regex: 'Type\s*<b>Terminal</b>\s*and press\s*<b>return</b>'
- id: terminal-paste-execution
  desc: Instructs pasting command into Terminal
  crit: notable
  conf: 0.98
  platforms: [macos]
  if:
    type: text
    regex: 'Paste\s*\(<b>⌘</b>\s*\+\s*<b>V</b>\).{0,50}<b>return</b>'
- id: win-r-open-run-instruction
  desc: Open Run with Win plus R
  crit: notable
  conf: 0.98
  platforms: [windows]
  if:
    type: text
    substr: Win + R to open Run.
- id: ctrl-v-paste-command-instruction
  desc: Paste command with Ctrl plus V
  crit: notable
  conf: 0.98
  platforms: [windows]
  if:
    type: text
    substr: Copy and paste Ctrl + V the following command
- id: encoded-ctrl-v-lure
  desc: Encoded Ctrl + V instruction marker
  crit: notable
  conf: 0.9
  platforms: [windows]
  if:
    type: text
    substr: Q3RybCArIFY
- id: remote-winr-instruction
  desc: Page instructs the Windows Run shortcut
  crit: suspicious
  conf: 0.97
  for: [html, powershell]
  if:
    type: text
    regex: '(?i)Windows Key.{0,120}\+\s*<b>R</b>'
- id: remote-ctrlv-instruction
  desc: Page instructs a Ctrl-V paste
  crit: suspicious
  conf: 0.97
  for: [html, powershell]
  if:
    type: text
    regex: '(?i)Ctrl.{0,80}\+\s*<b>V</b>'
- id: remote-ctrls-instruction
  desc: Page instructs a Ctrl-S save keystroke
  crit: suspicious
  conf: 0.97
  for: [html, powershell]
  if:
    type: text
    regex: '(?i)Ctrl.{0,80}\+\s*<b>S</b>'
  # Pages extracted from a CHM fixture cannot see the test tree path
  # themselves; the container's path demotes them instead.
  downgrade:
    scope: archive
    any:
      - id: metadata/package/testing/presence/resource::test-resources-tree-path
- id: win-x-key-instruction
  desc: Instructs the Win plus X shortcut
  crit: notable
  conf: 0.96
  platforms: [windows]
  if:
    type: text
    regex: '(?i)\b(win\s*\+\s*x|windows?\s+key\s*\+\s*x)\b'
- id: manual-repair-instruction
  desc: Requests manual repair or verification
  crit: notable
  conf: 0.94
  platforms: [windows]
  if:
    type: text
    regex: '(?i)\bmanual\s+(repair|verification)\s+required\b'
# Right-clicking Start to reach the terminal is genuine Windows 11 help-desk
# wording too, so like its Win+X sibling this stays notable: the clipboard
# write plus an obfuscated staged command in the composites below supplies
# the ClickFix intent.
- id: right-click-start-instruction
  desc: Instructs right-clicking the Start menu
  crit: notable
  conf: 0.9
  platforms: [windows]
  if:
    type: text
    regex: '(?i)\bright-click\b.{0,80}\bstart\b'
composite_rules:
- id: fake-captcha-winr-paste-instructions
  desc: Fake verification page gives paste instructions
  crit: suspicious
  conf: 0.98
  for: [html, powershell]
  all:
  - id: objectives/execution/lure/clipboard/page::remote-human-check-page
  - id: remote-winr-instruction
  - id: remote-ctrlv-instruction
- id: fake-captcha-winr-paste-execution-lure
  desc: Fake verification instructs Win+R paste run
  crit: hostile
  conf: 0.99
  attack: T1204.001,T1204.004
  for: [html, powershell]
  all:
  - id: fake-captcha-winr-paste-instructions
  any:
  - id: micro-behaviors/os/clipboard/write::browser-execcommand-copy
  - id: micro-behaviors/os/clipboard/write::browser-clipboarddata-setdata
  - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
# Save-dialog ClickFix variant: instead of Win+R the page walks the victim
# through Ctrl+S (browser save dialog) then Ctrl+V paste plus Enter, with the
# copied text a Windows shell command. The staged interpreter command is a
# required leg: bare save-then-paste wording without a shell payload is only
# odd documentation, not a paste-run lure.
- id: fake-captcha-savedialog-paste-instructions
  desc: Fake verification page gives save-dialog paste instructions
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/ui/controls/captcha::not-a-robot-text
  - id: remote-ctrls-instruction
  - id: remote-ctrlv-instruction
- id: fake-captcha-savedialog-paste-execution-lure
  desc: Fake verification instructs save-dialog paste run
  crit: hostile
  conf: 0.98
  attack: T1204.001,T1204.004
  all:
  - id: fake-captcha-savedialog-paste-instructions
  - id: micro-behaviors/process/argument/option::windows-interpreter-command-syntax
  any:
  - id: micro-behaviors/os/clipboard/write::browser-execcommand-copy
  - id: micro-behaviors/os/clipboard/write::browser-clipboarddata-setdata
  - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
- id: windows-terminal-launch-instruction
  desc: Win plus X followed by terminal launch guidance
  crit: notable
  conf: 0.96
  platforms: [windows]
  all:
  - id: win-x-key-instruction
  - id: micro-behaviors/ui/terminal::windows-terminal-name-reference
  near_bytes: 220
- id: windows-run-instruction
  desc: Windows Run dialog execution instruction
  crit: notable
  conf: 0.94
  platforms: [windows]
  scope: leaf
  any:
  - id: micro-behaviors/ui/help/interaction::run-dialog-instruction-wording
  - id: remote-winr-instruction
- id: windows-terminal-paste-execution-lure
  desc: Fake verification page directs clipboard paste into Windows Terminal
  crit: hostile
  conf: 0.98
  attack: T1204.001,T1059.001
  platforms: [windows]
  scope: leaf
  all:
  - id: windows-terminal-launch-instruction
  - id: micro-behaviors/ui/help/interaction::paste-enter-instruction-generic
  - id: objectives/execution/lure/clipboard/fake-verification::manual-verification-failure-lure
  - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
  - id: micro-behaviors/process/argument/option::windows-interpreter-command-syntax
