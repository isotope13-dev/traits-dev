defaults:
  platforms: [macos, windows]
  for: [html]
  attack: T1204.001
traits:
- id: win-r-instruction
  desc: Instructs Run dialog open
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: Press <strong>Win</strong>
- id: ctrl-v-instruction
  desc: Instructs clipboard paste
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: Then press <strong>Ctrl</strong>
- id: r-key-instruction
  desc: Instructs user to use R key
  crit: notable
  conf: 0.75
  if:
    type: text
    substr: <strong>R</strong>
- id: v-key-instruction
  desc: Instructs user to use V key
  crit: notable
  conf: 0.75
  if:
    type: text
    substr: <strong>V</strong>
- id: enter-instruction
  desc: Instructs user to press Enter
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: Press <strong>Enter</strong>
- id: hidden-instruction-panel
  desc: Hidden instruction panel in DOM
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: '<div id="instruction" class="cb-container" style="display: none;" role="alert">'
- id: macos-command-space-instruction
  desc: Instructs user to open Spotlight
  crit: notable
  conf: 0.97
  platforms: [macos]
  if:
    type: text
    regex: '<b>⌘</b>\s*\+\s*<b>SPACE</b>.{0,50}open spotlight'
- id: terminal-launch-instruction
  desc: Instructs user to launch Terminal
  crit: notable
  conf: 0.96
  platforms: [macos]
  if:
    type: text
    regex: 'Type\s*<b>Terminal</b>\s*and press\s*<b>return</b>'
- id: terminal-paste-execution
  desc: Instructs pasting command into Terminal
  crit: notable
  conf: 0.98
  platforms: [macos]
  if:
    type: text
    regex: 'Paste\s*\(<b>⌘</b>\s*\+\s*<b>V</b>\).{0,50}<b>return</b>'
- id: win-r-open-run-instruction
  desc: Open Run with Win plus R
  crit: notable
  conf: 0.98
  platforms: [windows]
  if:
    type: text
    substr: Win + R to open Run.
- id: ctrl-v-paste-command-instruction
  desc: Paste command with Ctrl plus V
  crit: notable
  conf: 0.98
  platforms: [windows]
  if:
    type: text
    substr: Copy and paste Ctrl + V the following command
- id: encoded-ctrl-v-lure
  desc: Encoded Ctrl + V instruction marker
  crit: notable
  conf: 0.9
  platforms: [windows]
  if:
    type: text
    substr: Q3RybCArIFY
- id: run-dialog-instruction-generic--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.9
  platforms: [windows]
  if:
    type: text
    regex: '(?i)\brun\s+dialog\b'
    case_insensitive: true
- id: run-dialog-instruction-generic--rx-2
  desc: Presses a Windows shortcut key
  crit: notable
  conf: 0.9
  platforms: [windows]
  if:
    type: text
    regex: '(?i)\bpress\s+((the|your)\s+)?(windows?\s+key|win\s*\+\s*r|r\s+key|run\s+dialog)\b'
- id: run-dialog-instruction-generic--rx-3
  desc: Regex component marker
  crit: component
  conf: 0.9
  platforms: [windows]
  if:
    type: text
    substr: 229E
    case_insensitive: true
- id: run-dialog-instruction-generic--rx-4
  desc: Windows shortcut key marker
  crit: component
  conf: 0.9
  platforms: [windows]
  if:
    type: text
    regex: '(?i)\bwindows?\s+key\b|\bwin\s*\+\s*r\b|\bhold\s+(the\s+)?win(dows)?\b'
- id: run-dialog-instruction-generic--rx-5
  desc: Regex component marker
  crit: component
  conf: 0.9
  platforms: [windows]
  if:
    type: text
    regex: '(?i)\bhold\b.{0,24}\b(win(dows)?|key|r)\b'
- id: run-dialog-instruction-generic--rx-6
  desc: "Matches 'bopenb.'"
  crit: notable
  conf: 0.9
  platforms: [windows]
  if:
    type: text
    regex: '(?i)\bopen\b.{0,40}\b(run|dialog)\b'
- id: paste-enter-instruction-generic--rx-7
  desc: "Matches 'bpasteb'"
  crit: notable
  conf: 0.88
  platforms: [windows]
  # InstallFix/ClickFix delivery scripts are often shipped as .js as well as .html
  for: [html, javascript]
  if:
    # Require one user-facing string to contain the full instruction. Source
    # keywords such as `return` must not complete an unrelated "paste" label.
    type: literal
    kind: string
    regex: '(?i)(Ctrl\s*(\+|and)\s*V|\bpaste\b).{0,120}\b(Enter|Return)\b'
- id: paste-enter-instruction-generic--rx-8
  desc: "Matches 'bpasteb'"
  crit: notable
  conf: 0.88
  platforms: [windows]
  if:
    type: literal
    kind: string
    regex: '(?i)\b(Enter|Return)\b.{0,120}(Ctrl\s*(\+|and)\s*V|\bpaste\b)'
- id: remote-winr-instruction
  desc: Page instructs the Windows Run shortcut
  crit: suspicious
  conf: 0.97
  for: [html, powershell]
  if:
    type: text
    regex: '(?i)Windows Key.{0,120}\+\s*<b>R</b>'
- id: remote-ctrlv-instruction
  desc: Page instructs a Ctrl-V paste
  crit: suspicious
  conf: 0.97
  for: [html, powershell]
  if:
    type: text
    regex: '(?i)Ctrl.{0,80}\+\s*<b>V</b>'
- id: html-winr-shortcut-instruction
  desc: Page instructs Windows Run shortcut
  # Notable, matching its win-x-key-instruction and
  # windows-terminal-name-instruction siblings below: the matcher only finds a
  # mention of the Win+R shortcut, which is ordinary keyboard documentation.
  # AutoIt's own CHM help page for Send() documents `Send("#r")` as Win+R and
  # was reported as an execution lure. The ClickFix composites below supply the
  # intent by additionally requiring a clipboard write and a shell invocation.
  crit: notable
  conf: 0.94
  # InstallFix/ClickFix delivery scripts are often shipped as .js as well as .html
  for: [html, javascript]
  if:
    type: text
    regex: '(?i)\b(windows?|win)(\s+key)?\s*\+\s*r\b'
- id: win-x-key-instruction
  desc: Instructs the Win plus X shortcut
  crit: notable
  conf: 0.96
  platforms: [windows]
  if:
    type: text
    regex: '(?i)\b(win\s*\+\s*x|windows?\s+key\s*\+\s*x)\b'
- id: windows-terminal-name-instruction
  desc: Names Windows Terminal or PowerShell
  crit: notable
  conf: 0.94
  platforms: [windows]
  if:
    type: text
    regex: '(?i)\b(windows\s+terminal|powershell|command\s+prompt)\b'
- id: manual-repair-instruction
  desc: Requests manual repair or verification
  crit: notable
  conf: 0.94
  platforms: [windows]
  if:
    type: text
    regex: '(?i)\bmanual\s+(repair|verification)\s+required\b'
- id: macos-terminal-paste-word
  desc: Paste instruction marker
  crit: notable
  conf: 0.86
  platforms: [macos]
  if:
    type: text
    word: paste
  unless:
    # Marketplace extension install pages tell users to paste into Quick Open.
    - id: well-known/tool/development/vscode-extension/vscode-marketplace::marketplace-extension-detail-page
composite_rules:
- id: fake-captcha-winr-paste-instructions
  desc: Fake verification page gives paste instructions
  crit: suspicious
  conf: 0.98
  for: [html, powershell]
  all:
  - id: objectives/execution/lure/clipboard/page::remote-human-check-page
  - id: remote-winr-instruction
  - id: remote-ctrlv-instruction
- id: windows-terminal-launch-instruction
  desc: Win plus X followed by terminal launch guidance
  crit: notable
  conf: 0.96
  platforms: [windows]
  all:
  - id: win-x-key-instruction
  - id: windows-terminal-name-instruction
  near_bytes: 220
- id: windows-run-instruction
  desc: Windows Run dialog execution instruction
  crit: notable
  conf: 0.94
  platforms: [windows]
  scope: leaf
  any:
  - id: run-dialog-instruction-generic
  - id: remote-winr-instruction
- id: windows-terminal-paste-execution-lure
  desc: Fake verification page directs clipboard paste into Windows Terminal
  crit: hostile
  conf: 0.98
  attack: T1204.001,T1059.001
  platforms: [windows]
  scope: leaf
  all:
  - id: windows-terminal-launch-instruction
  - id: paste-enter-instruction-generic
  - id: objectives/execution/lure/clipboard/fake-verification::manual-verification-failure-lure
  - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
  - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
- id: run-dialog-instruction-generic-verb
  desc: Run dialog instruction verb
  crit: component
  conf: 0.84
  platforms: [windows]
  any:
  - id: run-dialog-instruction-generic--rx-2
  - id: run-dialog-instruction-generic--rx-5
  - id: run-dialog-instruction-generic--rx-6
- id: run-dialog-instruction-generic-marker
  desc: Run dialog instruction marker
  crit: component
  conf: 0.86
  platforms: [windows]
  any:
  - id: run-dialog-instruction-generic--rx-1
  - id: run-dialog-instruction-generic--rx-3
  - id: run-dialog-instruction-generic--rx-4
- id: run-dialog-instruction-generic
  desc: Generic Win+R Run instruction
  crit: notable
  conf: 0.9
  platforms: [windows]
  scope: leaf
  all:
  - id: run-dialog-instruction-generic-verb
  - id: run-dialog-instruction-generic-marker
  unless:
  - id: metadata/document/html/
- id: paste-enter-instruction-generic
  desc: Generic paste then enter instruction
  crit: notable
  conf: 0.88
  platforms: [windows]
  for: [html, javascript]
  any:
  - id: paste-enter-instruction-generic--rx-7
  - id: paste-enter-instruction-generic--rx-8
- id: macos-terminal-command-paste
  desc: Terminal paste-and-return instruction
  crit: notable
  conf: 0.94
  platforms: [macos]
  near_lines: 8
  all:
  - id: objectives/execution/lure/clipboard/page::macos-terminal-name
  - id: macos-terminal-paste-word
  - id: objectives/execution/lure/clipboard/page::macos-terminal-return-word
