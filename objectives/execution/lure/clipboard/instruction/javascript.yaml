defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1204.001
traits:
  - id: instruction-panel-reveal
    desc: Reveals hidden instruction panel
    conf: 0.82
    if:
      type: text
      regex: "#instruction[\\s\\S]{0,80}visible"
  - id: windows-paste-execution-instruction
    desc: Windows paste-run instruction
    conf: 0.94
    platforms: [windows]
    if:
      type: text
      regex: '(?i)Windows?\s+key.{0,80}\+\s*R.{0,80}(paste|Ctrl\s*\+\s*V).{0,80}(Enter|Return)'
