# The Windows Installer variant of the ClickFix clipboard command. Instead of a
# powershell/cmd one-liner the lure copies `msiexec /i <remote .msi> /qn`, run
# straight from the Run dialog to silently install a remote MSI (T1218.007) —
# the shape the Psychedelic-stealer campaign used from hacked Ukrainian sites.
# The generic clickfix composites above never matched it because msiexec is not
# a windows-command-shell invocation, and the hostile msiexec composites only
# convict raw-IPv4 URLs; this catches the domain-hosted lure too. Intent is the
# clipboard write plus a Run-dialog instruction next to a remote-MSI install.
- id: clickfix-msiexec-clipboard-install
  desc: ClickFix page copies a remote MSI install command
  crit: hostile
  conf: 0.98
  attack: T1204.001,T1218.007,T1105
  for: [html, javascript]
  scope: leaf
  near_bytes: 1600
  all:
  - id: objectives/execution/lure/clipboard/instruction::html-winr-shortcut-instruction
  - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
  - id: micro-behaviors/process/create/installer::msiexec-package-verb
  - id: micro-behaviors/process/create/installer::remote-msi-package-url
- id: fake-software-update-clipboard-execution
