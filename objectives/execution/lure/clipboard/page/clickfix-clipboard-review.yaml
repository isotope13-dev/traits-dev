defaults:
  platforms: [windows, unix]
  for: [javascript, html]
  attack: T1105
  mbc: B0024

composite_rules:
  - id: browser-error-finger-command
    desc: Browser error warning and finger command clues
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/ui/keywords::browser-stopped-abnormally-wording
    any:
      - id: micro-behaviors/communications/finger::finger-command-user-host
      - id: micro-behaviors/communications/finger::finger-command-user-ip
      - id: micro-behaviors/fs/file/copy/command::finger-copy-or-rename-ct
  - id: macos-terminal-remote-command
    desc: Terminal paste instructions and remote interpreter command
    crit: hostile
    conf: 0.96
    platforms: [macos]
    attack: T1059.004,T1059.002
    all:
      - id: micro-behaviors/ui/terminal::macos-terminal-copy-paste-instructions
    any:
      - id: micro-behaviors/process/deploy/interpreter-stdin/decoded::base64-decode-near-shell-execution
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-shell
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-osascript
  - id: ai-public-page-terminal-download
    desc: AI public page and terminal download instructions
    crit: hostile
    conf: 0.98
    platforms: [macos]
    for: [html]
    all:
      - id: micro-behaviors/communications/url/reference::ai-public-artifact-url
      - id: micro-behaviors/ui/help/interaction::terminal-paste-download-pipeline
    near_bytes: 8192
  - id: interview-camera-clipboard-command
    desc: Interview fields and camera clipboard command lure
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1059.005,T1105,T1123,T1204.002
    near_bytes: 4096
    all:
      - id: objectives/execution/lure/clipboard/write::camera-clipboard-archive-command
      - id: micro-behaviors/ui/controls/form::interview-test-company-question-fields
      - id: micro-behaviors/communications/url/navigation-http::interview-invite-redirect-array
