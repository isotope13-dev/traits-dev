defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1204.001
traits:
  - id: send-tg-php-stage
    desc: Sends data to Telegram relay
    crit: suspicious
    conf: 0.92
    if:
      type: text
      word: send_tg.php
  - id: open-fix-beacons
    desc: Open and fix query beacons
    crit: component
    conf: 0.86
    if:
      type: text
      regex: "\\?(open=open|fix=fix)"
composite_rules:
  - id: fake-captcha-remote-response-clipboard
    desc: Fake CAPTCHA copies a remotely fetched command for Windows execution
    crit: hostile
    conf: 0.98
    attack: T1105,T1115,T1204.001,T1059.001
    all:
      - id: objectives/credential-access/phishing/captcha::not-a-robot-text
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: micro-behaviors/ui/window/click::browser-click-listener
      - id: objectives/execution/lure/clipboard/instruction::windows-paste-execution-instruction
    near_bytes: 1024
  - id: remote-response-clipboard-stager
    desc: Remote response staged for clipboard copy
    crit: hostile
    conf: 0.98
    attack: T1105,T1204.001
    all:
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: micro-behaviors/data/decode/symbol-base64::atob-decode
      - id: micro-behaviors/os/clipboard/write::browser-dom-clipboard-copy
      - id: micro-behaviors/communications/ipc/message::postmessage-function-override
      - id: micro-behaviors/ui/window/insert-html::browser-iframe-srcdoc-assignment
  - id: telegram-relay-post
    desc: Posts staged content to Telegram relay
    crit: suspicious
    conf: 0.93
    near_lines: 5
    all:
      - id: send-tg-php-stage
      - id: micro-behaviors/communications/http/post::post
  - id: clickfix-clipboard-execution-lure
    desc: ClickFix clipboard execution lure
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/lure/clipboard/fake-verification::verify-response-clipboard-copy
      - id: telegram-relay-post
    any:
      - id: open-fix-beacons
      - id: objectives/execution/lure/clipboard/instruction::instruction-panel-reveal
      - id: objectives/execution/lure/clipboard/fake-verification::checkbox-click-trigger
