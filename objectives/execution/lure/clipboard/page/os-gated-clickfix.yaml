# OS-gated ClickFix lures: the page sniffs the visitor's user agent, shows the
# clipboard-poisoning lure only to Windows victims, and turns everyone else
# away with a "requires a Windows PC" denial. The gate keeps casual review
# and non-Windows scanners from seeing the weapon.
defaults:
  platforms: [windows]
  for: [html, javascript]
  attack: T1204.001

traits:
  - id: windows-pc-required-denial
    desc: Denies non-Windows page visitors
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)(mac\s?os is not supported|requires a windows (pc|computer) to access)'

composite_rules:
  - id: os-gated-clickfix-clipboard-execution
    desc: OS-gated ClickFix clipboard lure
    crit: hostile
    conf: 0.98
    attack: T1204.001,T1059.001
    near_bytes: 2000
    all:
      - id: objectives/execution/lure/clipboard/instruction::html-winr-shortcut-instruction
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-regex-test-branch
      - id: windows-pc-required-denial
    any:
      - id: objectives/credential-access/phishing/captcha::verify-human-text

  - id: fake-verification-clipboard-shell-execution
    desc: Fake verification copies Windows shell command
    crit: hostile
    conf: 0.97
    attack: T1204.001,T1059.001
    for: [html]
    near_bytes: 2000
    all:
      - id: objectives/execution/lure/clipboard/fake-verification::fake-human-verification-cue
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
      - id: objectives/execution/lure/clipboard/instruction::html-winr-shortcut-instruction
