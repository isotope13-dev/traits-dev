# Explicit TAXONOMY.md classification policy: these findings assert provider
# security-holding status, including inert replacements, not payload execution.
defaults:
  platforms: [all]
  conf: 0.99

composite_rules:
  - id: npm-security-holder-package
    desc: npm manifest declares security-held replacement
    crit: hostile
    for: [package.json]
    scope: file
    all:
      - id: metadata/package/versioning/scheme::npm-security-holder-version
      - id: metadata/package/freeform::npm-security-holder-repository-signal

  # Qualification is required here: the loader checks the exact policy ID
  # before applying the directory namespace to locally named composites.
  - id: objectives/supply-chain/security-hold::registry-security-held-package
    desc: Registry reports package security-holding status
    crit: hostile
    for: [registry]
    scope: file
    any:
      - id: metadata/registry::registry-security-hold
      - id: metadata/registry::registry-security-hold-record
