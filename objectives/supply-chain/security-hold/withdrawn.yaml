# Provider security withdrawals. Registry facts retain the exact reason in
# metadata; these rules set the endpoint triage disposition for the affected
# coordinate. They apply equally to a package and to its fetched dependencies.
defaults:
  for: [registry]
  platforms: [all]
  attack: T1195.002

traits:
  # Multiple advisories identify version 0.0.1 as the affected release. Keep
  # this platform-neutral metadata fact shared by their package-specific
  # release composites.
  - id: advisory-listed-0-0-1-release-version
    desc: Advisory-listed 0.0.1 release version
    crit: component
    for: [pkginfo]
    if:
      type: value
      path: version
      exact: 0.0.1
    unless:
      - id: known-malicious-fkaks-name

  # The malware advisory covers every published version, including archived
  # tarballs whose visible code does not expose the malicious component. Keep
  # the exact package identity as the evidence rather than inferring behavior
  # from the inert replacement or its withdrawn dependency.
  - id: known-malicious-harness-memory
    desc: Advisory-listed malicious npm package
    crit: hostile
    conf: 0.99
    for: [package.json]
    ref: https://osv.dev/vulnerability/MAL-2026-16428
    if:
      type: value
      path: name
      exact: '@wizloft/harness-memory'

  # GitHub's malware advisory covers every published version. The staged
  # placeholder carries no executable code, so report the authoritative
  # package identity independently of behavior findings.
  - id: known-malicious-developmentstelemetry
    desc: Advisory-listed malicious npm package
    crit: hostile
    conf: 0.99
    for: [package.json]
    ref: https://github.com/advisories/GHSA-v4vq-23qw-j3r8
    if:
      type: value
      path: name
      exact: developmentstelemetry

  # GitHub's malware advisory applies to every published version, so package
  # identity remains useful after npm replaces the tarball with a holder.
  - id: known-malicious-mypackagetest
    desc: Known malicious npm package identity
    crit: hostile
    conf: 0.99
    for: [package.json]
    ref: https://github.com/advisories/GHSA-gfh2-8j8w-933m
    if:
      type: value
      path: name
      exact: '@tomhundley/mypackagetest'

  # OSV's advisory for initializers names every published version as
  # affected, including the inert npm security-holder replacement. Keep this
  # identity IOC separate from behavior rules: the package coordinate itself
  # is the evidence available in the replacement archive.
  - id: known-malicious-initializers
    desc: Known malicious npm package identity
    crit: hostile
    conf: 0.99
    for: [package.json]
    ref: https://osv.dev/vulnerability/MAL-2026-18
    if:
      type: value
      path: name
      exact: initializers

  # GitHub's malware advisory covers every published motionframe-plugins
  # version. Its package identity remains the decisive evidence even when the
  # visible plugin source does not expose the malicious dependency's payload.
  - id: known-malicious-motionframe-plugins
    desc: Advisory-listed malicious npm package
    crit: hostile
    conf: 0.99
    for: [package.json]
    ref: https://github.com/advisories/GHSA-8j58-xfpr-cqfv
    if:
      type: value
      path: name
      exact: motionframe-plugins

  # GitHub's malware advisories cover every published version, including
  # pre-release placeholders that were part of the same malicious package.
  - id: known-malicious-tailwindcss-animatemotion
    desc: Advisory-listed malicious npm package
    crit: hostile
    conf: 0.99
    for: [package.json]
    ref: https://github.com/advisories/GHSA-3r65-5c5p-4pq5
    if:
      type: value
      path: name
      exact: tailwindcss-animatemotion

  - id: known-malicious-tailwindcss-visual-kit
    desc: Advisory-listed malicious npm package
    crit: hostile
    conf: 0.99
    for: [package.json]
    ref: https://github.com/advisories/GHSA-f37w-2g4f-58r3
    if:
      type: value
      path: name
      exact: tailwindcss-visual-kit

  # The advisories cover every published version. Package identity is the
  # available evidence in these inert archives, so retain an exact identity
  # match independently of runtime behavior.
  - id: known-malicious-nuadg-jhtvh-util
    desc: Advisory-listed malicious npm package
    crit: hostile
    conf: 0.99
    for: [package.json]
    ref: https://github.com/advisories/GHSA-h68g-7c77-4w37
    if:
      type: value
      path: name
      exact: nuadg-jhtvh-util

  - id: known-malicious-vcnwi-ihpgp-util
    desc: Advisory-listed malicious npm package
    crit: hostile
    conf: 0.99
    for: [package.json]
    ref: https://github.com/advisories/GHSA-6wmj-hgpg-2pp6
    if:
      type: value
      path: name
      exact: vcnwi-ihpgp-util

  # OSV's malware advisory covers all published tailwind-theme-engine
  # versions, including the inspected 2.0.0 release.
  - id: known-malicious-tailwind-theme-engine
    desc: Advisory-listed malicious npm package
    crit: hostile
    conf: 0.99
    for: [package.json]
    ref: https://osv.dev/vulnerability/MAL-2026-15846
    if:
      type: value
      path: name
      exact: tailwind-theme-engine

  # The OSV record covers fkaks 0.0.1. Its wheel is metadata-only, but the
  # source distribution for this release executes an environment and process
  # exfiltration hook during package installation.
  - id: known-malicious-fkaks-name
    desc: fkaks package name
    crit: notable
    conf: 1
    for: [pkginfo]
    ref: https://osv.dev/vulnerability/MAL-2026-6382
    if:
      type: value
      path: name
      exact: fkaks

  - id: known-malicious-fkaks-version
    desc: Affected fkaks release version
    crit: notable
    conf: 1
    for: [pkginfo]
    ref: https://osv.dev/vulnerability/MAL-2026-6382
    if:
      type: text
      regex: '(?im)^Name: fkaks[ \t]*\r?\n([^\r\n]{0,200}\r?\n){0,5}Version: 0\.0\.1[ \t]*$'

composite_rules:
  - id: known-malicious-fkaks-release
    desc: Advisory-listed malicious fkaks 0.0.1 release
    crit: hostile
    conf: 0.99
    for: [whl, pkginfo]
    ref: https://osv.dev/vulnerability/MAL-2026-6382
    attack: T1195.002,T1552.001,T1041
    scope: archive
    all:
      - id: known-malicious-fkaks-name
      - id: known-malicious-fkaks-version

  # The validator recognizes this exact file-scoped policy: either official
  # registry fact independently establishes the security hold.
  - id: registry-security-held-package
    desc: Registry reports a security hold
    crit: suspicious
    conf: 0.99
    scope: file
    any:
      - id: metadata/registry::registry-security-hold
      - id: metadata/registry::registry-security-hold-record
    # Report the original release's security withdrawal, not a hostile verdict
    # on npm's inert replacement. The removed-coordinate rule below still
    # requires the independent historical-release removal fact.
    unless:
      - id: metadata/registry::registry-security-holder-version

  - id: declared-dependency-security-held
    desc: Declared dependency under registry security hold
    for: [package.json]
    crit: suspicious
    conf: 0.99
    scope: file
    # The follow phase attributes this to the exact declaring file, including
    # when no payload can be fetched. Unknown resolution never supplies it.
    # Suspicious, not hostile: the count also covers npm's still-listed inert
    # holder (benign packages commonly declare "fs": "0.0.1-security"). A
    # dependency release actually removed under the hold is convicted by
    # registry-security-withdrawn-package-coordinate below.
    all:
      - id: metadata/package/dependencies/declaration::declared-dependency-security-held

  - id: registry-security-withdrawn-package-coordinate
    desc: Release removed under registry security hold
    crit: hostile
    conf: 0.97
    # Same registry document, never outer scope: pairing one dependency's hold
    # with a different dependency's ordinary removal would fabricate a verdict.
    # A historical publication timestamp must survive for version-removed to
    # be set. A 404, private name, or network failure cannot supply these facts.
    # The inert replacement and reserved core-module names remain listed and
    # do not satisfy version-removed. The hold is either npm's holder record
    # or the provider's own hold on this removed version (npm deletes a single
    # malicious version under a malware advisory, leaving no holder).
    all:
      - id: metadata/registry::version-removed
    any:
      - id: metadata/registry::registry-security-hold-record
      - id: metadata/registry::registry-security-hold

  - id: registry-security-withdrawn-deprecation
    desc: Registry withdrew release for security reasons
    crit: hostile
    conf: 0.98
    # Security must be tied to withdrawal in the provider's own reason. A
    # vulnerability warning, ordinary deprecation or unspecified unpublish is
    # insufficient, even when the dependency's original bytes are unavailable.
    all:
      - id: metadata/registry::registry-security-withdrawal-reason
      - id: metadata/registry::deprecated

