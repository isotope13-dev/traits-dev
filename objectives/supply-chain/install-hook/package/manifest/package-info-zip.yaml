defaults:
  for: [data]
  platforms: [unix, windows]
  attack: "T1195.002"

traits:
- id: npm-package-info-member
  desc: Archive contains npm sidecar snapshot
  crit: suspicious
  conf: 0.95
  if:
    type: value
    path: archive.members[*].path
    regex: '^package_info-[a-z0-9-]{1,80}-[0-9]+\.[0-9]+\.[0-9]+\.json$'

- id: npm-index-member
  desc: Archive contains index entrypoint
  crit: component
  conf: 0.88
  if:
    type: value
    path: archive.members[*].path
    regex: '(^|/)index\\.js$'

- id: npm-writer-member
  desc: Archive contains writer helper
  crit: suspicious
  conf: 0.95
  if:
    type: value
    path: archive.members[*].path
    regex: '(^|/)writer\\.js$'

- id: npm-private-prepare-writer-member
  desc: Archive contains prepare-writer helper
  crit: suspicious
  conf: 0.98
  if:
    type: value
    path: archive.members[*].path
    regex: '(^|/)prepare-writer\.js$'

- id: npm-commitlint-member
  desc: Archive contains commitlint config
  crit: notable
  conf: 0.9
  if:
    type: value
    path: archive.members[*].path
    regex: '(^|/)commitlint\\.config\\.js$'

- id: npm-private-helper-layout
  desc: Archive hides helper in private tree
  crit: suspicious
  conf: 0.97
  if:
    type: value
    path: archive.members[*].path
    regex: 'lib/private/prepare-writer\.js$'

- id: npm-writer-layout
  desc: Archive exposes writer helper path
  crit: suspicious
  conf: 0.94
  if:
    type: value
    path: archive.members[*].path
    regex: 'package/lib/writer\.js$'

- id: macos-temp-staging-path
  desc: Archive preserves macOS temp staging path
  crit: suspicious
  conf: 0.96
  if:
    type: value
    path: archive.members[*].path
    regex: 'tmp[a-z0-9]+/package/'

# archive-nested-package-json-entry (metadata/package/files/included) is
# for: [npm, zip] only. This whole file is specifically about the
# camouflaged case, where the archive analyzer still populates
# archive.members[*] but the top-level type reads as opaque `data`, so it
# needs the same member-path check scoped to that type. Scored a step above
# the properly-typed npm/zip sibling: an npm package whose container does not
# even read as an archive is itself an evasion signal, not just a scope split.
- id: nested-package-json-entry-in-data-archive
  desc: Disguised data archive has nested package.json
  crit: suspicious
  conf: 0.92
  if:
    type: value
    path: "archive.members[*].path"
    regex: '^package/.+/package\.json$'

composite_rules:
- id: npm-package-info-archive
  desc: Archive pairs npm package with sidecar snapshot
  crit: suspicious
  conf: 0.97
  all:
  - id: npm-package-info-member
  - id: nested-package-json-entry-in-data-archive
  - id: npm-index-member

- id: npm-private-helper-chain
  desc: Archive exposes writer to private helper chain
  crit: suspicious
  conf: 0.985
  all:
  - id: npm-package-info-archive
  - id: npm-writer-member
  - id: npm-private-prepare-writer-member
  - id: npm-private-helper-layout
  - id: npm-writer-layout

- id: npm-camouflaged-private-helper-chain
  desc: Archive preserves staged helper-chain npm package
  crit: hostile
  conf: 0.992
  mbc: "B0024"
  all:
  - id: npm-private-helper-chain
  - id: macos-temp-staging-path
  any:
  - id: npm-commitlint-member
  - id: metadata/package/files/included::archive-nested-package-json-entry
