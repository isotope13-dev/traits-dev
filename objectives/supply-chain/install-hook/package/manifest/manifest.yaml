  # The other half of the void-elements shape, and the one that does not depend
  # on the fetch happening to be cleartext. A hook that first installs packages
  # and then redirects a command's stdout over one of the package's own module
  # files rebuilds the shipped source from code that was resolved at install
  # time -- unpinned, unreviewed, and different on every machine and every day.
  # Install-time codegen from material already in the tarball (jsonpath's
  # `node lib/aesprim.js > generated/...`) does not reach for a package manager
  # first, so it does not match.
  - id: install-hook-installs-deps-then-rewrites-module-source
    desc: Install hook installs deps then rewrites module source
    crit: suspicious
    conf: 0.94
    attack: "T1195.002"
    mbc: B0024
    all:
      - id: install-hook-runs-pkg-install
    any:
      - id: preinstall-writes-module-source
      - id: postinstall-writes-module-source

  # The two halves of void-elements@0.1.1 read together. The manifest hook
  # redirects a script's stdout over a module file, and somewhere in the
  # package that script fetches its content over cleartext HTTP. The result is
  # that the module `require()` loads is whatever an on-path attacker returns
  # -- no lockfile, integrity hash, or TLS covers it, and it is re-fetched on
  # every install forever. Archive scope is safe here because
  # `*-writes-module-source` is a narrow leg: a hook that writes over a
  # source file is uncommon, so it cannot pool with unrelated code the way
  # a bare "has a hook" leg would.
  - id: install-hook-rebuilds-module-over-cleartext-http
    desc: Install hook rebuilds a module from cleartext HTTP
    crit: hostile
    conf: 0.96
    attack: "T1195.002,T1105,T1557"
    mbc: B0024
    for: [npm, tar, package.json, javascript, typescript, python, ruby]
    scope: archive
    any:
      - id: preinstall-writes-module-source
      - id: postinstall-writes-module-source
    all:
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-request-target
