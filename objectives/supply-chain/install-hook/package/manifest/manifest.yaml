# npm Package Metadata Patterns
# Detects suspicious metadata patterns in package.json
# These patterns often indicate malicious or typosquatting packages
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  # `main` carrying a `..` segment resolves outside the directory that holds
  # the manifest. On a published package that is anomalous: the entry point
  # should live in the package's own file list. The one ubiquitous exception is
  # the generated per-subpath resolver stub of a dual CJS/ESM build, where the
  # climb is the mechanism — that shape is suppressed by name below.
  - id: npm-main-parent-entrypoint
    desc: npm main traverses out of package
    crit: suspicious
    conf: 0.94
    attack: T1195.002
    if:
      type: value
      path: main
      regex: '(^|/)\.\.(/|$)'
    unless:
      - id: metadata/package/files/dependency::node-modules-path
      - id: metadata/package/entrypoint::subpath-entry-shim-manifest
      - id: metadata/package/completeness::npm-main-bindings-node
      - id: metadata/package/completeness::tree-sitter-language-bindings-main
      - id: well-known/lib/development/tree-sitter-grammar-npm::tree-sitter-grammar-npm-package
      - type: path
        regex: '(^|/)package/(?:[^/]+/)+package\.json$'
      - id: metadata/package/tooling::jupyterlab-package-path
      # A source-workspace package may deliberately emit a bundled action into
      # a parent .github/actions directory; the release command documents that
      # the parent main entrypoint is build output, not package traversal.
      - type: value
        path: scripts.release
        regex: '\bncc\s+build\b.{0,80}\s-o\s+\.\./'
  # === Install Hooks ===
  # preinstall detection lives with the install-time behavior rules. Composites
  # reference that objective trait directly rather than duplicating metadata.
  - id: postinstall-runs-npm-install
    desc: postinstall hook runs npm install
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: "scripts.postinstall"
      regex: "\\bnpm\\s+(install|i|add)\\s"
    unless:
      - id: metadata/package/runtime::vscode-extension
      - id: well-known/lib/development/extension::vscode-workspace-install-extension
      - id: metadata/package/scripts/lifecycle::postinstall-local-prefix-install
      # A source-repo toolchain adding a host runtime (electron, esbuild) the
      # manifest deliberately does not record: the embedding host provides it.
      - id: metadata/package/scripts/lifecycle::postinstall-host-runtime-bootstrap
  - id: postinstall-runs-yarn-add
    desc: postinstall hook runs yarn add
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: "scripts.postinstall"
      regex: "\\byarn\\s+(add|global add)\\s"
  - id: postinstall-runs-pnpm-add
    desc: postinstall hook runs pnpm add
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: "scripts.postinstall"
      regex: "\\bpnpm\\s+(add|install)\\s"
  - id: preinstall-runs-npm-install
    desc: preinstall hook runs npm install
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: "scripts.preinstall"
      regex: "\\bnpm\\s+(install|i|add)\\s"
    unless:
      - id: metadata/package/testing/presence/harness::example-directory
      # A preinstall that does nothing but bootstrap the native-addon build
      # tool pulls no undeclared payload; anything chained onto it still fires.
      - id: metadata/package/scripts/lifecycle::preinstall-addon-builder-bootstrap
  # An install hook that redirects a command's stdout over a source file
  # generates code on the consumer's machine: whatever the hook prints becomes
  # a module require() can load. void-elements@0.1.1 regenerates its own `main`
  # this way from a scraped web page, so the module that runs is never the
  # module that was published or reviewed. The shape is ecosystem-agnostic --
  # the redirect target is a module the package itself loads -- and it is the
  # hook phase that matters: a `build`/`prepare` script generating sources runs
  # for the author, preinstall and postinstall run for every consumer.
  #
  # The redirect on its own is notable, not suspicious: install-time codegen is
  # ordinary practice. jsonpath ships `node lib/aesprim.js > generated/
  # aesprim-browser.js`, which patches the already-installed esprima into a
  # browser build -- purely local, no network, and unchanged since 1.0.1.
  # What convicts is the *input* to the redirect, so the composites below
  # supply it: content pulled over cleartext HTTP, or dependencies fetched by
  # the same hook that then rewrites the package's own sources.
  - id: preinstall-writes-module-source
    desc: preinstall redirects output into a module file
    crit: notable
    conf: 0.93
    attack: "T1195.002"
    if:
      type: value
      path: "scripts.preinstall"
      regex: '>\s*[\w./-]{0,40}\.(js|mjs|cjs|ts|py|rb)\b'
  - id: postinstall-writes-module-source
    desc: postinstall redirects output into a module file
    crit: notable
    conf: 0.93
    attack: "T1195.002"
    if:
      type: value
      path: "scripts.postinstall"
      regex: '>\s*[\w./-]{0,40}\.(js|mjs|cjs|ts|py|rb)\b'
  - id: preinstall-runs-yarn-add
    desc: preinstall hook runs yarn add
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: "scripts.preinstall"
      regex: "\\byarn\\s+(add|global add)\\s"
    unless:
      - id: metadata/package/testing/presence/harness::example-directory
  - id: preinstall-runs-pnpm-add
    desc: preinstall hook runs pnpm add
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: "scripts.preinstall"
      regex: "\\bpnpm\\s+(add|install)\\s"
    unless:
      - id: metadata/package/testing/presence/harness::example-directory
  - id: build-runs-shell-sidecar
    desc: Build script launches shell sidecar
    crit: notable
    conf: 0.88
    if:
      type: value
      path: "scripts.build"
      regex: "\\b(bash|sh)\\s+(\\./)?[A-Za-z0-9_./-]{1,120}\\.sh\\b"
  - id: healthcheck-runs-shell-sidecar
    desc: Health check launches shell sidecar
    crit: suspicious
    conf: 0.94
    if:
      type: value
      path: "scripts.health-check"
      regex: "\\b(bash|sh)\\s+(\\./)?[A-Za-z0-9_./-]{1,120}\\.sh\\b"
  - id: npm-script-background-shell
    desc: npm script backgrounds shell sidecar
    crit: suspicious
    conf: 0.92
    if:
      type: value
      path: "scripts"
      # Require an actual shell script invocation followed by a background
      # ampersand. Redirections alone (for example `test.sh 2>/dev/null`) are
      # ordinary package test scripts, not background sidecars.
      regex: "(^|[;&|])\\s*(bash|sh)\\s+(\\./)?[A-Za-z0-9_./-]{1,120}\\.sh\\b[^&]{0,80}&(\\s|$)"
    unless:
      - id: well-known/app/ai/gateway/neurolink::benign-archive-context
      # === Repository Format Patterns ===
  - id: repo-shorthand-format
    # GitHub shorthand: "User/repo-name" (no full URL)
    desc: Repository uses GitHub shorthand format
    crit: component
    conf: 0.8
    if:
      type: value
      path: "repository"
      regex: "^[A-Za-z0-9_.-]+/[a-z0-9][a-z0-9._-]*$"
    unless:
      - type: value
        path: "repository"
        exact: "npm/security-holder"
      # Package name is a hyphenated multi-word name
      # === Description Patterns ===
  - id: desc-modern-web-apps
    desc: Description mentions modern web apps
    crit: notable
    conf: 0.5
    if:
      type: value
      path: "description"
      regex: "modern.{0,100}(web|app)"
      case_insensitive: true
  - id: desc-universal-headless-ui
    desc: Description universal headless UI wording
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: description
      substr: headless
      case_insensitive: true
  - id: desc-universal-react-native
    desc: Description mentions React Native
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: description
      substr: react native
      case_insensitive: true
  - id: desc-universal-cross-platform
    desc: Description mentions cross-platform
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: description
      regex: 'cross[- ]platform'
      case_insensitive: true
  - id: desc-universal-component-phrase
    desc: Universal phrasing before component
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: description
      regex: 'universal.{0,40}component'
      case_insensitive: true
  - id: desc-universal-library-phrase
    desc: Universal phrasing before library
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: description
      regex: 'universal.{0,40}library'
      case_insensitive: true
  - id: desc-universal-app-phrase
    desc: Universal phrasing before app
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: description
      regex: 'universal.{0,40}app'
      case_insensitive: true
  - id: desc-universal-gluestack-scope
    desc: Package name under gluestack-ui scope
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: name
      substr: "@gluestack-ui/"
  - id: desc-universal-react-native-scope
    desc: Package name under react-native scope
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: name
      substr: "@react-native/"
  - id: desc-universal-tamagui-scope
    desc: Package name under tamagui scope
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: name
      substr: "@tamagui/"
  - id: desc-universal
    desc: Description mentions universal
    crit: notable
    conf: 0.5
    if:
      type: value
      path: "description"
      substr: "universal"
      case_insensitive: true
    unless:
      - id: desc-universal-legitimate-ui-copy
      - id: desc-universal-known-ui-scope-name
  - id: desc-powerful-library
    desc: Description mentions powerful library
    crit: notable
    conf: 0.5
    if:
      type: value
      path: "description"
      regex: "powerful.{0,100}(library|framework)"
      case_insensitive: true
  - id: desc-hijack-secrets
    desc: Description advertises hijacking secrets
    crit: suspicious
    conf: 0.99
    attack: "T1195.002"
    if:
      type: value
      path: "description"
      regex: "hijack.{0,20}secret"
      case_insensitive: true
  - id: desc-easy
    desc: Description contains "easy"
    crit: notable
    conf: 0.5
    unless:
      - type: value
        path: devDependencies
        exists: true
      - type: value
        path: repository.url
        exists: true
    if:
      type: value
      path: "description"
      substr: "easy"
      case_insensitive: true
  - id: desc-generic-js-utility
    desc: Generic JS utility placeholder phrase
    crit: notable
    conf: 0.78
    attack: T1195.002
    if:
      type: value
      path: "description"
      regex: "(?i)some useful (js|javascript) (lib|libs|utilities)"
  - id: desc-generic-js-utility-helpers
    desc: Generic JS helper placeholder phrase
    crit: notable
    conf: 0.78
    attack: T1195.002
    if:
      type: value
      path: "description"
      regex: "(?i)some useful (js|javascript) (utils|helper|helpers)"
  - id: desc-generic-useful-lib
    desc: Generic useful JS library placeholder
    crit: notable
    conf: 0.72
    if:
      type: value
      path: "description"
      regex: "(?i)^(a )?(useful|handy) (js|javascript) (lib|library)$"
  - id: desc-generic-useful-node-pkg
    desc: Generic useful node package placeholder
    crit: notable
    conf: 0.72
    if:
      type: value
      path: "description"
      regex: "(?i)^(a )?(useful|handy) (node|npm) (package|module)$"
  - id: desc-analyst-server
    desc: 'Description refs "analyst server"'
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: "description"
      regex: "analyst server"
      case_insensitive: true
    attack: "T1195.002"
  - id: cross-ecosystem-cocoapods-name
    desc: CocoaPods reverse-domain package name in npm
    crit: suspicious
    conf: 0.9
    attack: T1195.002
    if:
      type: value
      path: name
      regex: "^org\\.cocoapods\\."
  - id: cross-ecosystem-java-name
    desc: Java-style reverse-domain package name
    crit: notable
    conf: 0.9
    if:
      type: value
      path: name
      regex: "^(com|org|io|net)\\.[a-z][a-z0-9]*\\.[a-z]"
    unless:
      - id: metadata/package/ecosystem::unity-package-manager-manifest
  - id: tabby-builtin-plugin-keyword
    desc: Tabby builtin plugin package marker
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: tabby-builtin-plugin
# === Composite Rules ===
composite_rules:
  - id: desc-universal-legitimate-ui-copy
    desc: Universal in legitimate UI package description
    crit: baseline
    conf: 0.9
    any:
      - id: desc-universal-headless-ui
      - id: desc-universal-react-native
      - id: desc-universal-cross-platform
      - id: desc-universal-component-phrase
      - id: desc-universal-library-phrase
      - id: desc-universal-app-phrase
  - id: desc-universal-known-ui-scope-name
    desc: Universal marketing on known UI monorepo scope
    crit: baseline
    conf: 0.95
    any:
      - id: desc-universal-gluestack-scope
      - id: desc-universal-react-native-scope
      - id: desc-universal-tamagui-scope
  # A local postinstall is ordinary in isolation. Coupling it to a package
  # that advertises activity/device tracking is higher risk because install
  # time can silently add tracking to the host project.
  - id: postinstall-tracking-purpose
    desc: Postinstall on package advertising activity tracking
    crit: suspicious
    conf: 0.93
    attack: T1195.002
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: metadata/package/description/function::desc-click-device-tracking-purpose

  - id: npm-secret-hijack-hook
    desc: Postinstall package advertises secret hijack
    crit: hostile
    conf: 0.995
    attack: "T1195.002"
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: desc-hijack-secrets
  # Install hook group
  - id: install-hooks-comp
    desc: Package has install hook
    crit: notable
    conf: 0.6
    unless:
      - id: metadata/package/scripts/lifecycle::npm-inert-pre-postinstall-pair
    any:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/package/scripts/lifecycle::has-install-script
        # Install hook that installs packages (highly suspicious)
        # Legitimate packages declare dependencies in package.json - running install commands
        # in hooks is a supply chain attack indicator
  - id: install-hook-runs-pkg-install
    desc: Install hook runs npm/yarn/pnpm install command
    crit: suspicious
    conf: 0.9
    attack: "T1195.002"
    any:
      - id: postinstall-runs-npm-install
      - id: postinstall-runs-yarn-add
      - id: postinstall-runs-pnpm-add
      - id: preinstall-runs-npm-install
      - id: preinstall-runs-yarn-add
      - id: preinstall-runs-pnpm-add
  - id: preinstall-installs-and-runs-local-node
    desc: preinstall adds a package then runs local Node code
    crit: hostile
    conf: 0.97
    attack: "T1195.002,T1059.007"
    all:
      - id: preinstall-runs-npm-install
      - id: objectives/supply-chain/install-hook/scripts/local-script::preinstall-runs-node-local-script
  - id: broad-floating-deps-with-hooks
    desc: Install-hook package has broad floating dependencies
    crit: suspicious
    conf: 0.86
    attack: "T1195.002"
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
      - id: metadata/package/dependencies/manifest/count::many-runtime-deps
      - id: metadata/package/dependencies/manifest/range::npm-floating-dependency-range
    unless:
      - id: metadata/package/publishing::is-private
      - id: metadata/package/testing/presence/fixture/
  # Version 1.0.0 with install hooks
  - id: version-1-0-0-with-hooks
    desc: Version 1.0.0 with install hooks
    crit: suspicious
    conf: 0.75
    all:
      - id: metadata/package/versioning/sentinel::npm-version-exactly-1-0-0
      - id: metadata/package/scripts/lifecycle::install-hooks
    unless:
      - id: objectives/supply-chain/install-hook/scripts/prepare/
      - id: metadata/package/completeness::npm-source-native-addon-wrapper
      - id: metadata/package/testing/presence/harness::example-directory
      - id: metadata/package/publishing::is-private
    downgrade:
      any:
        - id: metadata/package/freeform::pkg-skeleton-small
        - id: metadata/package/freeform::npm-template-manifest-placeholder
  - id: npm-registry-provenance-with-hooks
    desc: Install-hook package points provenance to npm
    crit: suspicious
    conf: 0.86
    attack: "T1195.002"
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
    any:
      - id: metadata/package/homepage::npmjs-homepage-url
      - id: metadata/package/repository::npmjs-repository-url
    unless:
      - id: metadata/package/repository::repo-url-git-host
      # The two install-hook shapes this used to name. A 2026-06 cleanup
      # widened them to metadata/package/scripts/, which also holds the
      # install-hooks leg, so the rule could never fire.
      - id: metadata/package/scripts/lifecycle::postinstall-protobuf-codegen-download
      - id: metadata/package/scripts/lifecycle::postinstall-local-ts-subpackage-build
        # Missing repository with install hooks
  - id: obfuscated-hook-no-provenance-package
    desc: Anonymous package hides a char-code-encoded install hook
    crit: hostile
    conf: 0.97
    attack: "T1027, T1195.002"
    all:
      - id: objectives/supply-chain/install-hook/scripts/encoded-body::lifecycle-node-eval-charcode-program
      - id: metadata/package/scripts/lifecycle::no-repo-with-hooks
  - id: desc-simple-easy
    desc: Description mentions simple/easy
    crit: component
    conf: 0.5
    any:
      - id: metadata/package/description/function::description-simple
      - id: desc-easy
        # Generic descriptions group
  - id: generic-descriptions
    desc: Package has generic marketing description
    crit: notable
    conf: 0.5
    needs: 2
    any:
      - id: metadata/package/description/function::desc-lightweight
      - id: desc-modern-web-apps
      - id: desc-universal
      - id: desc-powerful-library
      - id: desc-simple-easy
    unless:
      - id: metadata/package/files/dependency::node-modules-path
        # Generic description with hooks
  - id: generic-desc-with-hooks
    desc: Generic description with install hooks
    crit: suspicious
    conf: 0.8
    all:
      - id: generic-descriptions
      - id: metadata/package/scripts/lifecycle::install-hooks
    unless:
      - id: objectives/supply-chain/install-hook/scripts/prepare/
      - id: metadata/package/publishing::open-collective-postinstall-context
        # === Cloned/Copied Package Identity ===
  - id: cloned-package-identity
    desc: Package with shorthand repo but missing bugs/homepage (possible copy)
    crit: notable
    conf: 0.75
    attack: "T1195.002"
    all:
      - id: repo-shorthand-format
      - id: metadata/package/name/vocabulary::npm-hyphenated-multiword-name
    unless:
      - id: metadata/package/freeform/
      - id: metadata/package/repository::has-bugs-url-field
      - id: metadata/package/homepage::has-homepage-field
      - id: metadata/package/files/package-json::has-files-field
      - id: metadata/package/runtime::has-engines
      - id: metadata/package/author/identity::has-contributors
  - id: mature-cloned-package
    desc: Mature version package with incomplete copied metadata
    crit: notable
    conf: 0.85
    attack: "T1195.002"
    mbc: "F0004"
    all:
      - id: "metadata/package/versioning/scheme::npm-nonzero-major-version-prefix"
      - id: repo-shorthand-format
      - id: metadata/package/name/vocabulary::npm-hyphenated-multiword-name
    unless:
      - id: metadata/package/repository::has-bugs-url-field
      - id: metadata/package/homepage::has-homepage-field
      - id: metadata/package/files/package-json::has-files-field
      - id: metadata/package/runtime::has-engines
      - id: metadata/package/author/identity::has-contributors
      - id: metadata/package/files/dependency::node-modules-path
        # === Fake Security Research ===
  - id: fake-security-research
    desc: Undisclosed security-research claim with install hook
    crit: notable
    conf: 0.9
    attack: "T1195.002"
    all:
      - id: metadata/package/description/disclosure::claims-security-research
      - id: metadata/package/scripts/lifecycle::install-hooks
    unless:
      - id: objectives/supply-chain/impersonation/manifest/attack-label::bug-bounty-marker-1
      - id: metadata/package/description/disclosure::description-mentions-poc
      - id: metadata/package/description/disclosure::desc-dependency-confusion
  - id: fake-security-research-with-exfil
    desc: Security research claim paired with exfiltration endpoint
    crit: hostile
    conf: 0.97
    attack: "T1195.002"
    all:
      - id: fake-security-research
    any:
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: objectives/supply-chain/recon-exfil/oast
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
  - id: placeholder-manifest-denies-install-scripts-runs-hook
    desc: Placeholder denies install scripts but declares a hook
    crit: hostile
    conf: 0.96
    attack: "T1195.002"
    for: [npm, tar, zip, package.json]
    scope: archive
    all:
      - id: metadata/package/description/disclosure::desc-denies-install-scripts
      - id: metadata/package/scripts/lifecycle::install-hooks
  - id: disclosed-security-research-bin-oast-exfil
    desc: Research-disclosed npm bin exfiltrates to OAST
    crit: hostile
    conf: 0.97
    attack: "T1195.002"
    mbc: "E1041"
    scope: archive
    for: [npm, package.json, javascript]
    all:
      - id: metadata/package/description/disclosure::claims-security-research
      - id: metadata/package/entrypoint::bin-field-declared
      - id: objectives/supply-chain/recon-exfil/npm-install-targeting::js-sysinfo-oast-https-post-exfil
  - id: dependency-confusion-recognized-marker
    desc: Dependency confusion recognized provenance marker
    crit: component
    conf: 0.9
    any:
      - id: objectives/supply-chain/install-hook/scripts/prepare::prepare-is-build-tool
      - id: metadata/package/repository::has-repository-evidence
      - id: metadata/package/entrypoint::has-bin-field
      - id: metadata/package/publishing::is-private
      - id: metadata/package/testing/presence/fixture::npm-fixture-package-name
      - id: metadata/package/scripts/lifecycle::postinstall-local-ts-subpackage-build
      - id: metadata/package/scripts/lifecycle::postinstall-protobuf-codegen-download
      - id: tabby-builtin-plugin-keyword
  - id: junk-package-postinstall-webhook
    desc: Junk npm package sends install callback to webhook.site
    crit: hostile
    conf: 0.99
    attack: "T1195.002, T1041"
    mbc: "E1041"
    all:
      - id: metadata/package/freeform::pkg-skeleton-small
      - id: objectives/supply-chain/install-hook/scripts/host-profile::postinstall-webhook-install-beacon
    any:
      - id: metadata/package/scripts/develop::npm-init-default-test
      - id: metadata/package/description/presence::short-description
      - id: metadata/package/empty::npm-empty-description-any
      - id: metadata/package/empty::npm-no-keywords
    needs: 2
  - id: sfdc-placeholder-package
    desc: sfdc package looks like placeholder squatter
    crit: hostile
    conf: 0.985
    attack: "T1195.002"
    mbc: "B0024"
    all:
      - id: metadata/package/name/convention::npm-name-sfdc-prefix
      - id: metadata/package/freeform::pkg-skeleton-small
      - id: metadata/package/entrypoint::has-index-entry
    any:
      - id: metadata/package/scripts/develop::npm-init-default-test
      - id: metadata/package/empty::npm-empty-description-any
      - id: metadata/package/empty::npm-no-author
      - id: metadata/package/empty::npm-no-keywords
    needs: 2
    unless:
