# npm runs a package's test suite from the `test` lifecycle; `postinstall` is
# the consumer-facing hook. Wiring `postinstall` to a test-named script is not
# a packaging pattern — it is the shape a staged loader leaves behind. Test
# trees are routinely excluded from the published tarball by the `files`
# whitelist or `.npmignore`, so the hook installs as a no-op decoy until the
# author drops real code at that path in a follow-up release (observed on
# runtime-sentinel 1.0.0 -> 1.0.1, where `node test/monitor.js` became
# `node src/test.js` carrying an HTTPS response `new Function` loader).
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002
  crit: suspicious

traits:
  - id: postinstall-runs-test-directory-script
    desc: postinstall runs a test-directory script
    conf: 0.9
    if:
      type: value
      path: "scripts.postinstall"
      regex: '^(node|bun)\s+(\./)?tests?/\S{1,60}\.[cm]?js$'
    unless:
      # A vendored dependency's own manifest is not the package being installed.
      - id: metadata/package/files/dependency::node-modules-path

  - id: postinstall-runs-test-named-script
    desc: postinstall runs a test-named Node script
    conf: 0.88
    if:
      type: value
      path: "scripts.postinstall"
      regex: '^(node|bun)\s+(\S{0,60}[/.])?tests?\.[cm]?js$'
    unless:
      - id: metadata/package/files/dependency::node-modules-path
