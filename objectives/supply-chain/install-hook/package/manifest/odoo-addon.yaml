# Odoo / OpenERP addon manifests name Python callables that the server imports
# and runs as a side effect of installing, upgrading or removing the module.
# Raw key facts live with the neutral package-manifest metadata; this file keeps
# only the archive-level execution objective for a manifest plus a dynamic
# Python payload.
#
# The manifest is a bare Python dict literal, so its hook keys are matched from
# source text. The quoted-key-and-colon form avoids matching framework code that
# merely reads a key such as `module_info.get('post_init_hook')`.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95
  attack: T1195.002
  mbc: B0024

composite_rules:
  # An addon that both opens an install-time callback and ships dynamic code
  # execution is the trojanized-addon shape: the hook is the trigger, the
  # dynamic call is the payload the reviewer cannot read. Ordinary OCA/vendor
  # addons declare hooks (sequence seeding, data migration) but call the ORM,
  # not exec/eval on assembled source. `scope: archive` because the hook is
  # declared in the manifest and the payload lives in a sibling module file.
  - id: odoo-install-hook-with-dynamic-execution
    desc: Odoo install hook with dynamic execution
    crit: suspicious
    conf: 0.9
    for: [python, whl, python-sdist, egg, zip, tar]
    scope: archive
    all:
      - id: metadata/package/manifest/ecosystem::odoo-addon-manifest
      - id: micro-behaviors/process/interpreter/python::exec-builtin
    any:
      - id: metadata/package/manifest/ecosystem::odoo-post-init-hook-key
      - id: metadata/package/manifest/ecosystem::odoo-pre-init-hook-key
      - id: metadata/package/manifest/ecosystem::odoo-uninstall-hook-key

  - id: odoo-install-hook-with-dynamic-evaluation
    desc: Odoo install hook with dynamic evaluation
    crit: suspicious
    conf: 0.9
    for: [python, whl, python-sdist, egg, zip, tar]
    scope: archive
    all:
      - id: metadata/package/manifest/ecosystem::odoo-addon-manifest
      - id: micro-behaviors/process/interpreter/python::eval-builtin
    any:
      - id: metadata/package/manifest/ecosystem::odoo-post-init-hook-key
      - id: metadata/package/manifest/ecosystem::odoo-pre-init-hook-key
      - id: metadata/package/manifest/ecosystem::odoo-uninstall-hook-key
