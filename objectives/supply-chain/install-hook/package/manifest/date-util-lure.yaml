# npm manifests that advertise date/time helpers while shipping a
# postinstall node script — the facade used by recent npm recon
# trojans (dayjs/moment keyword bait). Suspicious on the manifest
# alone; the JS payload carries the hostile exfil composites.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002

traits:
  - id: npm-keyword-dayjs-or-moment
    desc: package.json keywords include dayjs or moment
    crit: notable
    conf: 0.9
    if:
      type: value
      path: keywords
      regex: '(?i)(dayjs|moment)'
    unless:
      - id: well-known/lib/core/moment::moment-package
      - id: well-known/lib/core/dayjs::dayjs-package
      - id: metadata/library/vscode::vscode-extension-marker

  - id: npm-keyword-timezone-or-datefmt
    desc: package.json keywords have timezone or date-fmt
    crit: notable
    conf: 0.9
    if:
      type: value
      path: keywords
      regex: '(?i)(timezone|date-fmt|dateformat)'

  - id: npm-date-format-description-bait
    desc: Description claims lightweight date formatting
    crit: notable
    conf: 0.9
    if:
      type: value
      path: description
      regex: '(?i)date\s+format|timezone\s+util|lightweight\s+date'

  - id: npm-devtools-author-token
    desc: package.json author is opaque dev-tools token
    crit: notable
    conf: 0.88
    if:
      type: value
      path: author
      regex: '(?i)^(dev-tools|devtools|tooling|utils)$'

composite_rules:
  - id: npm-date-util-postinstall-lure
    desc: Date-util package.json lure with postinstall hook
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: objectives/supply-chain/install-hook/package/manifest::generic-desc-with-hooks
    any:
      - id: npm-keyword-dayjs-or-moment
      - id: npm-keyword-timezone-or-datefmt
      - id: npm-date-format-description-bait

  - id: npm-opaque-author-date-postinstall
    desc: Opaque author date-util package with postinstall
    crit: suspicious
    conf: 0.94
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: npm-devtools-author-token
    any:
      - id: npm-keyword-dayjs-or-moment
      - id: npm-keyword-timezone-or-datefmt
      - id: npm-date-format-description-bait
