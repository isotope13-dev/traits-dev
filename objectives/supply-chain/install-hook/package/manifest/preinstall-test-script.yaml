defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  attack: T1195.002

traits:
  - id: preinstall-runs-test-named-script
    desc: npm preinstall invokes a test-named Node script
    conf: 0.9
    if:
      type: value
      path: scripts.preinstall
      regex: '^node\s+(\./)?(\S{1,60}/)?[\w.-]{1,60}\.test\.[cm]?js$'

  - id: misplaced-preinstall-test-named-script
    desc: Top-level preinstall names a Node test script
    conf: 0.95
    # npm only runs scripts.preinstall. Preserve the suspicious declaration
    # from the Zod diff without claiming this misplaced field executes.
    if:
      type: value
      path: preinstall
      regex: '^node\s+(\./)?(\S{1,60}/)?[\w.-]{1,60}\.test\.[cm]?js$'

composite_rules:
  - id: preinstall-with-contract-module-loader
    desc: Node preinstall with contract module loader
    crit: hostile
    conf: 0.99
    for: [npm, tar, package.json, javascript, typescript]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
      - id: objectives/command-and-control/dropper/module-load::contract-base64-module-bootstrap
