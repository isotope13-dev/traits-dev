# Chocolatey's tools/chocolateyInstall.ps1 is an automatic package lifecycle
# hook. Fetching an unpinned response and immediately evaluating it there is
# install-time remote code execution; the random activation file is irrelevant.
defaults:
  platforms: [windows]
  for: [nupkg, archives]
  attack: T1195.002,T1105,T1059.001

composite_rules:
  # Evaluated on the install script itself, not on the package. Under
  # `scope: archive` the three legs only had to exist *somewhere* in the
  # archive, so Chocolatey's own 2.6.0 source tarball convicted itself: the
  # `chocolateyInstall.ps1` members are all fixtures under `tests/packages/`,
  # and the only `iex` in the tree is in `build.ps1`, the project's build
  # script. The tarball contains no `Invoke-WebRequest` in any .ps1 at all.
  #
  # The filename does less work here than it did before, not more: it selects
  # which file to read, and the conviction rests on a download and an `iex`
  # being in that file within a kilobyte of each other.
  - id: chocolatey-install-remote-powershell-eval
    desc: Chocolatey hook evaluates remote PowerShell
    crit: hostile
    conf: 0.99
    for: [powershell]
    near_bytes: 1024
    all:
      - id: metadata/package/files/nuget::chocolatey-install-script-path
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::request-powershell
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
