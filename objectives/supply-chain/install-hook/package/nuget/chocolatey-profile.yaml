defaults:
  platforms: [windows]
  for: [nupkg]
  attack: T1195.002

composite_rules:
  - id: chocolatey-install-profile-dynamic-exec
    desc: Chocolatey install hook adds dynamic profile execution
    crit: suspicious
    conf: 0.94
    scope: archive
    ref: sha256:c0b1dd711360b1389cb8e44f2e984d971ba6d3ab8c59da42eb8b12bdc1b4189a
    all:
      - id: metadata/package/files/nuget::chocolatey-install-script-member
      - id: objectives/persistence/login/shell/config::powershell-profile-dynamic-exec-persistence

  - id: chocolatey-wmi-encoded-loader
    desc: Chocolatey hook runs encoded WMI PowerShell
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/files/nuget::chocolatey-install-script-member
      - id: micro-behaviors/os/wmi/query::cimv2-namespace-reference
      - id: micro-behaviors/process/interpreter/powershell/command::encoded-command-line
      - id: micro-behaviors/process/create/hidden::powershell-hidden-window

  - id: chocolatey-dll-side-loader
    desc: Chocolatey hook downloads an appdata executable
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/files/nuget::chocolatey-install-script-member
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-b
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
      - id: micro-behaviors/os/wsh/file::shortcut-target-path

  - id: chocolatey-run-key-uninstall-persistence
    desc: Chocolatey hook creates Run-key persistence
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/files/nuget::chocolatey-install-script-member
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command
      - id: micro-behaviors/process/create/script/file::powershell-script-launch-string

  - id: chocolatey-npmrc-credential-exfil
    desc: Chocolatey hook posts npm credentials
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/files/nuget::chocolatey-install-script-member
      - id: micro-behaviors/fs/path/secret-config::npmrc-credentials
      - id: micro-behaviors/fs/read/file/full::get-content
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::ps-post

  - id: chocolatey-defender-exclusion-stage
    desc: Chocolatey hook disables Defender for a stage
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/files/nuget::chocolatey-install-script-member
      - id: micro-behaviors/os/security/defender::defender-exclusion-command
      - id: micro-behaviors/communications/http/download/cli::powershell-http-transfer-command-reference

  - id: chocolatey-profile-remote-persistence
    desc: Chocolatey hook adds a remote PowerShell profile
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/files/nuget::chocolatey-install-script-member
      - id: objectives/persistence/login/shell/config::powershell-profile-write
      - id: micro-behaviors/fs/write/file/append::add-content
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::useb-flag

  - id: chocolatey-scheduled-remote-stage
    desc: Chocolatey hook schedules a remote PowerShell stage
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/files/nuget::chocolatey-install-script-member
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/scheduled::schtasks-minute-create-sequence
      - id: objectives/command-and-control/dropper/execution/fileless::ps-command-wrapper-useb-remote-eval

  - id: chocolatey-eventlog-clear
    desc: Chocolatey hook clears event logs
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/files/nuget::chocolatey-install-script-member
      - id: objectives/evasion/indicator-removal/logs::wevtutil-cl
      - id: micro-behaviors/fs/path/temp::env-temp
