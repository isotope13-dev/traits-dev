defaults:
  platforms: [unix, windows]
  for: [javascript, text, markdown]

traits:
  - id: npm-registry-http-ip-endpoint
    desc: npm registry is HTTP raw IP
    crit: suspicious
    conf: 0.94
    attack: T1195.002
    if:
      type: text
      regex: '--registry[= ]http://[0-9.]+|value: .http://[0-9.]+'

  - id: scaffolding-npmrc-registry-template
    desc: Template writes registry into .npmrc
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'registry\s*=\s*\{\{'

composite_rules:
  - id: cli-scaffold-insecure-registry-install
    desc: Scaffold CLI defaults installs to HTTP IP registry
    crit: hostile
    conf: 0.96
    attack: T1195.002
    mbc: B0024
    for: [npm, package.json, javascript, text, markdown]
    scope: archive
    all:
      - id: metadata/package/entrypoint::bin-field-declared
      - id: npm-registry-http-ip-endpoint
      - id: scaffolding-npmrc-registry-template
      - id: micro-behaviors/communications/http/url/domain::js-insecure-remote-http-url
