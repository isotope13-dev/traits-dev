defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: "T1195.002"
traits:
  - id: remote-http-dependency
    desc: Package depends on remote HTTP tarball
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: dependencies.*
      regex: '^http://[^"\s]+\.t(ar\.gz|gz)$'
    # Pinned github.com archives are public release bytes, not an install-hook
    # tarball hosted by an attacker.
    not:
      - regex: '^http://github\.com/[^/]+/[^/]+/archive/[^/]+\.tar\.gz$'
      - regex: '^http://(localhost|127\.0\.0\.1)(:[0-9]+)?/'
    unless:
      - id: metadata/package/testing/presence/fixture::test-fixture-package-json-path
composite_rules:
  - id: remote-dependency-install-loader
    desc: Remote dependency triggers install loader
    crit: hostile
    conf: 0.98
    all:
      - id: remote-http-dependency
      - id: metadata/package/scripts/lifecycle::preinstall-node-index-hook
