# Direct URL Dependencies - npm
# GuardDog-inspired: Detects packages with direct URL/Git dependencies
# These dependencies are not immutable and can be used to inject untrusted code
# ATT&CK: T1195.002 (Compromise Software Supply Chain)
# MBC: E1195 (Supply Chain Compromise)
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85
  attack: "T1195.002"
  mbc: "E1195"
traits:
  - id: jpartifacts-runtime-dependency
    desc: Runtime dependency uses jpartifacts host
    crit: suspicious
    conf: 1.0
    if:
      type: value
      path: dependencies.*
      regex: '^http://npm[.]jpartifacts[.]com(/|$)'
  - id: storeartifact-runtime-dependency
    desc: Runtime URL dependency uses storeartifact host
    crit: suspicious
    conf: 1.0
    if:
      type: value
      path: dependencies.*
      regex: '^http://packages[.]storeartifact[.]com(/|$)'
  - id: storageartifact-development-dependency
    desc: Dev dependency uses storageartifact host
    crit: suspicious
    conf: 1.0
    if:
      type: value
      path: devDependencies.*
      regex: '^http://registry[.]storageartifact[.]com(/|$)'
composite_rules:
  # PhantomRaven's Remote Dynamic Dependency carriers delegate installation to
  # this attacker-controlled HTTP service. Pair the family-owned host anchor
  # with manifest structure so reports naming the host do not match.
  - id: phantomraven-rdd-runtime-dependency
    desc: Runtime dependency uses PhantomRaven host
    crit: hostile
    conf: 1.0
    all:
      - id: jpartifacts-runtime-dependency
      - id: metadata/package/dependencies/direct-url::devdep-plaintext-http
  - id: phantomraven-storeartifact-rdd-install-hook
    desc: PhantomRaven URL dependency with install hook
    crit: hostile
    conf: 0.99
    for: [package.json, npm, tar]
    scope: package
    all:
      - id: storeartifact-runtime-dependency
      - id: metadata/package/dependencies/direct-url::runtime-direct-url-dependency
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: phantomraven-storageartifact-rdd-install-hook
    desc: PhantomRaven development URL dependency with install hook
    crit: hostile
    conf: 0.99
    for: [package.json, npm, tar]
    scope: package
    all:
      - id: storageartifact-development-dependency
      - id: metadata/package/dependencies/direct-url::dev-url-dependency
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: public-package-remote-dependency-side-effect-import
    for: [package.json, javascript, npm]
    desc: Public package loads a direct-URL runtime dependency for side effects
    crit: hostile
    conf: 0.98
    scope: package
    all:
      - id: metadata/package/dependencies/source::npm-https-runtime-dependency
      - id: metadata/package/publishing::npm-public-publish-access
      - id: micro-behaviors/os/module/require::esm-side-effect-package-import
    unless:
      - id: well-known/tool/development/aube::aube-published-npm-package
      - id: well-known/tool/development/aube::aube-package-test-fixture
      - id: well-known/tool/development/aube::aube-lifecycle-scanner-source
      # The official SheetJS release channel is a tarball on its own CDN.
      - id: well-known/lib/format/sheetjs-xlsx::sheetjs-cdn-tarball-dependency
      - id: metadata/package/publishing::is-private
      # Shipped TypeScript declaration files match test-or-declaration-file
      # under metadata/package/testing/; a broad testing/ unless suppressed this
      # composite on ordinary published packages that include index.d.ts.
      - id: metadata/package/testing/presence/manifest::package-test-or-template-path
      # A tagged GitHub release tarball is a pinned UI asset, not a mutable drop host.
      - id: metadata/package/dependencies/source::npm-github-release-tarball-dependency
      # A GitHub repository URL is a public VCS repository, not a direct drop host.
      - id: metadata/package/dependencies/source::npm-github-repository-dependency
  - id: dynamic-dns-plaintext-tarball-dependency
    desc: Dynamic-DNS plaintext tarball dependency
    crit: hostile
    conf: 0.995
    all:
      - id: metadata/package/dependencies/direct-url::dep-custom-port-tarball-kv
      - id: micro-behaviors/communications/url/host/name::dynamic-dns-hostname
  # `multiple-url-dependencies` moved to
  # metadata/package/dependencies/direct-url/: pinning several deps to URLs is a
  # neutral manifest property common in legitimate apps (React Native SDK
  # tarballs, the author's own fork branches), not install-hook intent. The
  # hostile supply-chain composites here pair URL deps with real risk evidence
  # (phantom deps, plaintext HTTP, confusion staging) instead of a bare count.
  - id: phantom-url-dependency-postinstall-dropper
    desc: Unused URL dependency activated by postinstall dropper
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1105,T1547.001
    for: [npm, tar, package.json, javascript]
    scope: outer
    all:
      - id: metadata/package/dependencies/reconciliation::npm-phantom-runtime-dependency
      - id: metadata/package/dependencies/direct-url::runtime-direct-url-dependency
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: objectives/persistence/login/startup/shortcut::node-windows-wsh-persistence-remote-dropper
  - id: mutable-url-dependency-install-activation
    desc: Postinstall activates mutable URL dependency
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1059.007
    for: [npm, tar, zip, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/dependencies/direct-url::dep-github-mutable-branch-archive
      - id: metadata/package/dependencies/source::npm-single-https-runtime-dependency
      - id: micro-behaviors/os/module/require::postinstall-bare-module-require
      - id: micro-behaviors/os/module/require::node-bracket-module-require-call
  - id: npm-gcs-tarball-hex-identity-preinstall-payload
    desc: GCS tarball dependency runs hex identity OAST preinstall
    crit: hostile
    conf: 0.99
    for: [package.json, npm]
    scope: package
    all:
      - id: metadata/package/dependencies/direct-url::gcs-bucket-runtime-dependency-kv
      - id: objectives/exfiltration/stealer/system-info/identity::npm-preinstall-hex-identity-oob-benchmark-exfil
  - id: url-dep-minimal-metadata
    for: [package.json, npm]
    desc: URL dependency with minimal package metadata
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/dependencies/direct-url::direct-url-dependency
      # Import reconciliation is supporting context, not proof of disuse.
      - id: metadata/package/dependencies/reconciliation::npm-phantom-runtime-dependency
    # "Minimal metadata" was pinned to a <=15-character description, one narrow
    # proxy for it. A tiny manifest overall is the same claim and the canonical
    # trait for it, so a stub whose description happens to run to 19 characters
    # ("Placeholder package") no longer slips the rule its own name describes.
    any:
      - id: metadata/package/description/presence::short-description
      - id: metadata/file/size::small-versioned-npm-manifest
    unless:
      # A stub manifest under a `test/`/`template/` tree is linter-corpus
      # input, not a shipped package: dependency-confusion scanners keep
      # deliberately bad manifests there as fixtures for their own tests.
      - id: metadata/package/testing/presence/manifest::package-test-or-template-path
      # Private workspace/CI helper manifests are not registry-published
      # packages. A commit-pinned VCS dev dependency in one is ordinary build
      # plumbing, even when the manifest is intentionally tiny.
      - id: metadata/package/publishing::is-private
      - id: metadata/package/repository::has-repository-evidence
      - id: well-known/lib/runtime/scripted/electron::electron-app-bundle-exception
      - id: well-known/app/infrastructure/argo-cd::argo-cd-source-tree
      - id: well-known/app/security/securityctrl::defensive-placeholder-context
      # `pkg-skeleton-small` is a byte-size proxy (<=2 KB) and a compact
      # manifest can still be a real one: Katello's bastion gem ships an
      # 800-byte package.json with nineteen build dependencies, one of them a
      # tag-pinned GitHub shorthand. A manifest that resolves eight or more
      # runtime dependencies is not "minimal metadata" whatever its size.
      - id: metadata/package/dependencies/count::npm-dependency-fanout
