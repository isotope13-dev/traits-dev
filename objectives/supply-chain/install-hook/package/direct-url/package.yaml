# Direct URL Dependencies - npm
# GuardDog-inspired: Detects packages with direct URL/Git dependencies
# These dependencies are not immutable and can be used to inject untrusted code
# ATT&CK: T1195.002 (Compromise Software Supply Chain)
# MBC: E1195 (Supply Chain Compromise)
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85
  attack: "T1195.002"
  mbc: "E1195"
traits:
  # The attacker's own staging path names the technique. A dependency tarball
  # served from a URL whose host/path contains a dependency-confusion marker
  # (e.g. .../depenconf/pkg.tgz) is self-identifying malicious infrastructure;
  # no legitimate dependency resolves from such a location.
  - id: dep-url-depconf-staging-marker
    desc: Dependency URL contains confusion staging marker
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: dependencies.*
      regex: '://[^"\s]{0,256}(depenconf|dep[-_]?confusion|dependency[-_]?confusion)'
  - id: jpartifacts-runtime-dependency
    desc: Runtime dependency uses jpartifacts host
    crit: suspicious
    conf: 1.0
    if:
      type: value
      path: dependencies.*
      regex: '^http://npm[.]jpartifacts[.]com(/|$)'
composite_rules:
  # PhantomRaven's Remote Dynamic Dependency carriers delegate installation to
  # this attacker-controlled HTTP service. Pair the family-owned host anchor
  # with manifest structure so reports naming the host do not match.
  - id: phantomraven-rdd-runtime-dependency
    desc: Runtime dependency uses PhantomRaven host
    crit: hostile
    conf: 1.0
    all:
      - id: jpartifacts-runtime-dependency
      - id: metadata/package/dependencies/direct-url::devdep-plaintext-http
  - id: unpinned-github-phantom-runtime-dependency
    desc: Unused mutable GitHub runtime dependency
    crit: hostile
    conf: 0.99
    mbc: B0024
    scope: archive
    all:
      - id: metadata/package/dependencies/direct-url::dep-github-mutable-branch-archive
      - id: metadata/package/dependencies/manifest::npm-phantom-runtime-dependency
  - id: remote-phantom-runtime-dependency
    desc: Unused direct-URL runtime dependency
    crit: suspicious
    conf: 0.9
    mbc: B0024
    scope: archive
    all:
      - id: metadata/package/dependencies/manifest::npm-https-runtime-dependency
      - id: metadata/package/dependencies/manifest::npm-phantom-runtime-dependency
    unless:
      - id: metadata/package/manifest/publishing::is-private
      - id: well-known/app/security/securityctrl::repository-host
  - id: public-package-remote-dependency-side-effect-import
    desc: Public package loads a direct-URL runtime dependency for side effects
    crit: hostile
    conf: 0.98
    scope: package
    all:
      - id: metadata/package/dependencies/manifest::npm-https-runtime-dependency
      - id: metadata/package/manifest/publishing::npm-public-publish-access
      - id: micro-behaviors/os/module/load::esm-side-effect-package-import
    unless:
      - id: well-known/tool/development/aube::aube-published-npm-package
      - id: well-known/tool/development/aube::aube-package-test-fixture
      - id: well-known/tool/development/aube::aube-lifecycle-scanner-source
      - id: metadata/package/manifest/publishing::is-private
      - id: metadata/package/testing/
  - id: dynamic-dns-plaintext-tarball-dependency
    desc: Dynamic-DNS plaintext tarball dependency
    crit: hostile
    conf: 0.995
    all:
      - id: metadata/package/dependencies/direct-url::dep-http-url-kv
      - id: metadata/package/dependencies/direct-url::dep-custom-port-tarball-kv
      - id: micro-behaviors/communications/url/host::dynamic-dns-hostname
  # `multiple-url-dependencies` moved to
  # metadata/package/dependencies/direct-url/: pinning several deps to URLs is a
  # neutral manifest property common in legitimate apps (React Native SDK
  # tarballs, the author's own fork branches), not install-hook intent. The
  # hostile supply-chain composites here pair URL deps with real risk evidence
  # (phantom deps, plaintext HTTP, confusion staging) instead of a bare count.
  - id: url-dependency-with-hooks
    desc: Runtime direct URL dependency with install hooks
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/dependencies/direct-url::runtime-direct-url-dependency
      - id: metadata/package/scripts/lifecycle::install-hooks
    unless:
      - id: metadata/package/dependencies/direct-url::package-dependencies-field
      - id: metadata/package/manifest/repository/
      - id: metadata/package/testing/presence/manifest::package-test-or-template-path
      # Private workspace packages are not published to the registry. Their
      # pinned VCS dependencies plus prepare/build hook are source-tree build
      # plumbing, not a hostile package-install delivery path.
      - id: metadata/package/manifest/publishing::is-private
      # A hook that only runs `bower install` hands off to a second manifest
      # the same tooling already reads; it delivers nothing itself.
      - id: metadata/package/scripts/lifecycle::package-manager-bootstrap-hook
  - id: duplicated-plaintext-http-dependency
    desc: Plain HTTP dependency in runtime and dev scopes
    # Duplicating one URL across development and runtime scopes is risky but
    # does not establish attacker control. Campaign infrastructure or payload
    # behavior must supply the conviction.
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/package/dependencies/direct-url::dep-plaintext-http
      - id: metadata/package/dependencies/direct-url::devdep-plaintext-http
    unless:
      - id: metadata/package/manifest/publishing::is-private
  - id: duplicated-plaintext-http-minimal
    desc: Minimal package duplicates plain HTTP dependency
    crit: suspicious
    conf: 0.97
    all:
      - id: duplicated-plaintext-http-dependency
      - id: metadata/package/dependencies/direct-url::inflated-version-anomaly
      - id: metadata/package/manifest/description::short-description
  - id: url-dep-minimal-metadata
    desc: URL dependency with minimal package metadata
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/dependencies/direct-url::direct-url-dependency
      # The sibling composites in this file (unpinned-github-phantom-runtime-
      # dependency, remote-phantom-runtime-dependency) already require the
      # dependency to be unused before calling it staged for install-hook
      # abuse; this rule skipped that check and convicted on manifest size
      # alone. webpack's exports-loader (author Tobias Koppers) pins its
      # source-map dependency to a GitHub tarball and its ~400-byte
      # package.json easily reads as "minimal" by the size proxy below, but
      # index.js genuinely `require("source-map")`s it -- a real, exercised
      # dependency, not a phantom one planted only to be fetched at install.
      - id: metadata/package/dependencies/manifest::npm-phantom-runtime-dependency
    # "Minimal metadata" was pinned to a <=15-character description, one narrow
    # proxy for it. A tiny manifest overall is the same claim and the canonical
    # trait for it, so a stub whose description happens to run to 19 characters
    # ("Placeholder package") no longer slips the rule its own name describes.
    any:
      - id: metadata/package/manifest/description::short-description
      - id: metadata/package/manifest/freeform::pkg-skeleton-small
    unless:
      # A stub manifest under a `test/`/`template/` tree is linter-corpus
      # input, not a shipped package: dependency-confusion scanners keep
      # deliberately bad manifests there as fixtures for their own tests.
      - id: metadata/package/testing/presence/manifest::package-test-or-template-path
      # Private workspace/CI helper manifests are not registry-published
      # packages. A commit-pinned VCS dev dependency in one is ordinary build
      # plumbing, even when the manifest is intentionally tiny.
      - id: metadata/package/manifest/publishing::is-private
      - id: metadata/package/manifest/repository/
      - id: well-known/lib/runtime/electron::electron-app-bundle-exception
      - id: well-known/lib/runtime/electron::electron-webpack-main-entrypoint
      - id: well-known/app/infrastructure/argo-cd::argo-cd-source-tree
      - id: well-known/app/security/securityctrl::defensive-placeholder-context
      # `pkg-skeleton-small` is a byte-size proxy (<=2 KB) and a compact
      # manifest can still be a real one: Katello's bastion gem ships an
      # 800-byte package.json with nineteen build dependencies, one of them a
      # tag-pinned GitHub shorthand. A manifest that resolves eight or more
      # runtime dependencies is not "minimal metadata" whatever its size.
      - id: metadata/package/dependencies/manifest::npm-dependency-fanout
  # `inflated-single-url-dependency` moved to
  # objectives/supply-chain/impersonation/depconf/inflated-url-stub.yaml: it
  # describes a confusion squat's versioning move, and this directory is
  # install-time execution, which that package does not do.
  - id: dependency-confusion-staging-url
    desc: Package uses dependency-confusion staging URL
    crit: hostile
    conf: 0.995
    all:
      - id: dep-url-depconf-staging-marker
      - id: metadata/package/dependencies/direct-url::runtime-url-dependency
