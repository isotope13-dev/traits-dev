# Direct URL Dependencies - npm
# GuardDog-inspired: Detects packages with direct URL/Git dependencies
# These dependencies are not immutable and can be used to inject untrusted code
# ATT&CK: T1195.002 (Compromise Software Supply Chain)
# MBC: E1195 (Supply Chain Compromise)
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85
  attack: "T1195.002"
  mbc: "E1195"
traits:
  - id: package-dependencies-field
    desc: Manifest includes packageDependencies field
    crit: component
    conf: 0.7
    if:
      type: value
      path: "packageDependencies"
  - id: dep-github-mutable-branch-archive
    desc: Mutable GitHub branch dependency
    crit: suspicious
    conf: 0.97
    if:
      type: value
      path: dependencies.*
      regex: '^https://github\.com/[^/]+/[^/]+/archive/refs/heads/[^/]+\.tar\.gz(\?.*)?$'
  # The attacker's own staging path names the technique. A dependency tarball
  # served from a URL whose host/path contains a dependency-confusion marker
  # (e.g. .../depenconf/pkg.tgz) is self-identifying malicious infrastructure;
  # no legitimate dependency resolves from such a location.
  - id: dep-url-depconf-staging-marker
    desc: Dependency URL contains confusion staging marker
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: dependencies.*
      regex: '://[^"\s]{0,256}(depenconf|dep[-_]?confusion|dependency[-_]?confusion)'
  # A dependency resolved from a generic object-storage bucket (GCS/S3/Azure/R2)
  # rather than the registry or a VCS is a supply-chain red flag: bucket content
  # is mutable and trivially attacker-controlled. One notable trait per provider.
  - id: dep-bucket-gcs
    desc: Dependency URL on GCS bucket
    crit: notable
    conf: 0.85
    if:
      type: value
      path: dependencies.*
      regex: '://[a-z0-9.-]{0,63}storage\.googleapis\.com'
  - id: dep-bucket-s3
    desc: Dependency URL on an AWS S3 bucket
    crit: notable
    conf: 0.85
    if:
      type: value
      path: dependencies.*
      regex: '://[a-z0-9.-]{0,40}s3[.-][a-z0-9.-]{0,30}amazonaws\.com'
  - id: dep-bucket-azure
    desc: Dependency URL on Azure Blob bucket
    crit: notable
    conf: 0.85
    if:
      type: value
      path: dependencies.*
      regex: '://[a-z0-9.-]{0,63}blob\.core\.windows\.net'
  - id: dep-bucket-r2-do
    desc: Dependency URL on R2/Spaces bucket
    crit: notable
    conf: 0.85
    if:
      type: value
      path: dependencies.*
      regex: '://[a-z0-9.-]{0,63}(r2\.cloudflarestorage\.com|digitaloceanspaces\.com)'
  # A `git+ssh:` / `git+https:` dependency whose authority is a raw external
  # IPv4: the install clones straight off an operator-run box, bypassing both
  # the registry and any hosted forge, so the fetched tree is unmirrored,
  # unreviewable, and revocable only by whoever owns that address. The Git
  # transports already covered by metadata/package/dependencies (npm-git-ssh-
  # dependency / npm-git-url-dependency) report the transport but not the host,
  # so a clone from 45.x currently reads the same as one from github.com.
  # Corporate monorepos that do clone over Git use a hostname, or an RFC1918
  # address that `is: external_ip` rejects.
  #
  # Text-anchored rather than `type: value`: value conditions carry no `is:`
  # octet validator, and a bare `\d{1,3}` regex would accept a version-numbered
  # commitish (`...#1.2.3.4`). Starting the match at the `"git+` quote and
  # forbidding `/` inside the userinfo/host span confines the IP to the URL
  # authority, so a fragment or path segment cannot trip it.
  - id: dep-git-clone-from-raw-ip
    desc: Git dependency on raw external IP
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '"git\+[a-z]{2,5}://[^"@/]{0,40}@?(\d{1,3}\.){3}\d{1,3}[:/]'
      is: external_ip
  - id: devdep-https-url-kv
    desc: DevDependency value uses HTTPS URL
    crit: notable
    conf: 0.8
    if:
      type: value
      path: devDependencies.*
      regex: '^https://'
  - id: dep-http-url-kv
    desc: Dependency value uses HTTP URL
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: dependencies.*
      regex: '^http://'
  - id: dep-custom-port-tarball-kv
    desc: Plaintext custom-port tarball dependency
    crit: suspicious
    conf: 0.99
    if:
      type: value
      path: dependencies.*
      regex: '^http://[^/:]{1,253}:[1-9][0-9]{3,4}/[^"? ]{1,240}\.tgz$'
  - id: devdep-http-url-kv
    desc: DevDependency value uses HTTP URL
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: devDependencies.*
      regex: '^http://'
  # Direct HTTP URL in dependencies
  - id: devdep-https-url-text
    desc: DevDependency using HTTPS URL
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '"devDependencies"\s*:\s*\{[^}]{0,1000}:\s*"https://'
    downgrade:
      any:
        - id: metadata/package/manifest/publishing::is-private
  # Direct tarball URLs
  - id: dep-tarball-url
    desc: Dependency using direct tarball URL
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '"dependencies"\s*:\s*\{.{0,1000}\.tgz"'
  # file:// protocol
  - id: dep-file-protocol
    desc: Dependency using file:// protocol
    crit: notable
    conf: 0.70
    if:
      type: text
      regex: '"dependencies"\s*:\s*\{[^}]{0,1000}file://'
  # Relative paths (dep values only; not package "exports" ./ paths)
  - id: dep-relative-path
    desc: Dependency using relative path
    crit: notable
    conf: 0.65
    if:
      type: value
      path: dependencies.*
      regex: '^(\.\.?/|file:\.\.?/)'
    unless:
      - id: metadata/package/manifest/runtime::vscode-extension
  # Plain HTTP (not HTTPS) dependency
  - id: dep-plaintext-http
    desc: Dependency fetched over plain HTTP
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '"dependencies"\s*:\s*\{[^}]{0,1000}"http://'
  - id: devdep-plaintext-http
    desc: DevDependency fetched over plain HTTP
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '"devDependencies"\s*:\s*\{[^}]{0,1000}"http://'
composite_rules:
  - id: unpinned-github-phantom-runtime-dependency
    desc: Unused mutable GitHub runtime dependency
    crit: hostile
    conf: 0.99
    mbc: B0024
    scope: archive
    all:
      - id: dep-github-mutable-branch-archive
      - id: metadata/package/dependencies/manifest::npm-phantom-runtime-dependency
  - id: remote-phantom-runtime-dependency
    desc: Unused direct-URL runtime dependency
    crit: suspicious
    conf: 0.9
    mbc: B0024
    scope: archive
    all:
      - id: metadata/package/dependencies/manifest::npm-https-runtime-dependency
      - id: metadata/package/dependencies/manifest::npm-phantom-runtime-dependency
    unless:
      - id: metadata/package/manifest/publishing::is-private
      - id: well-known/app/security/securityctrl::repository-host
  - id: public-package-remote-dependency-side-effect-import
    desc: Public package loads a direct-URL runtime dependency for side effects
    crit: hostile
    conf: 0.98
    scope: package
    all:
      - id: metadata/package/dependencies/manifest::npm-https-runtime-dependency
      - id: metadata/package/manifest/publishing::npm-public-publish-access
      - id: micro-behaviors/os/module/load::esm-side-effect-package-import
    unless:
      - id: well-known/tool/development/aube::aube-published-npm-package
      - id: well-known/tool/development/aube::aube-package-test-fixture
      - id: well-known/tool/development/aube::aube-lifecycle-scanner-source
      - id: metadata/package/manifest/publishing::is-private
      - id: metadata/package/testing/
  - id: dynamic-dns-plaintext-tarball-dependency
    desc: Dynamic-DNS plaintext tarball dependency
    crit: hostile
    conf: 0.995
    all:
      - id: dep-http-url-kv
      - id: dep-custom-port-tarball-kv
      - id: micro-behaviors/communications/url/host::dynamic-dns-hostname
  # Any HTTP/HTTPS URL in dependencies
  - id: remote-url-dependency
    desc: Package depends on a remote URL
    crit: notable
    conf: 0.8
    any:
      - id: metadata/package/dependencies/manifest::npm-https-runtime-dependency
      - id: devdep-https-url-kv
      - id: dep-tarball-url
  # Direct URL Dependency (all types)
  - id: direct-url-dependency
    desc: Package has direct URL dependencies
    crit: notable
    conf: 0.85
    any:
      - id: remote-url-dependency
      - id: metadata/package/dependencies/manifest::npm-git-dependency
      - id: metadata/package/dependencies/manifest::npm-github-shorthand-dependency
  # Multiple URL dependencies
  - id: multiple-url-dependencies
    desc: Package has multiple direct URL deps
    crit: hostile
    conf: 0.90
    needs: 2
    any:
      - id: metadata/package/dependencies/manifest::npm-https-runtime-dependency
      - id: dep-http-url-kv
      - id: devdep-http-url-kv
      - id: metadata/package/dependencies/manifest::npm-git-dependency
      - id: metadata/package/dependencies/manifest::npm-github-shorthand-dependency
      - id: dep-tarball-url
    unless:
      - id: metadata/package/testing/presence/fixture/
      - id: well-known/tool/development/aube::aube-package-test-fixture
      - id: metadata/package/testing/presence/manifest::package-test-or-template-path
  # URL dependency with install hooks
  - id: url-dependency-with-hooks
    desc: Runtime direct URL dependency with install hooks
    crit: hostile
    conf: 0.98
    all:
      - id: runtime-direct-url-dependency
      - id: metadata/package/scripts/lifecycle::install-hooks
    unless:
      - id: package-dependencies-field
      - id: metadata/package/manifest/repository/
      - id: metadata/package/testing/presence/manifest::package-test-or-template-path
      # Private workspace packages are not published to the registry. Their
      # pinned VCS dependencies plus prepare/build hook are source-tree build
      # plumbing, not a hostile package-install delivery path.
      - id: metadata/package/manifest/publishing::is-private
      # A hook that only runs `bower install` hands off to a second manifest
      # the same tooling already reads; it delivers nothing itself.
      - id: metadata/package/scripts/lifecycle::package-manager-bootstrap-hook
  # Plain HTTP dep composite
  - id: plaintext-http-dependency
    desc: Dependency fetched over plain HTTP
    crit: suspicious
    conf: 0.95
    any:
      - id: dep-http-url-kv
      - id: devdep-http-url-kv
      - id: dep-plaintext-http
      - id: devdep-plaintext-http
  - id: runtime-url-dependency
    desc: Runtime dependency uses remote URL
    crit: notable
    conf: 0.95
    any:
      - id: dep-http-url-kv
      - id: metadata/package/dependencies/manifest::npm-https-runtime-dependency
      - id: dep-plaintext-http
  - id: runtime-direct-url-dependency
    desc: Runtime dependency uses a direct URL or VCS reference
    crit: notable
    conf: 0.95
    any:
      - id: runtime-url-dependency
      # Do not use the npm-git-dependency umbrella here: it intentionally
      # includes devDependencies, while this composite claims a runtime
      # dependency. A normal build-only github: dependency plus a harmless
      # engine-check preinstall otherwise becomes a hostile runtime finding.
      - id: metadata/package/dependencies/manifest::npm-git-url-dependency
      - id: metadata/package/dependencies/manifest::npm-git-ssh-dependency
      - id: metadata/package/dependencies/manifest::npm-github-protocol-dependency
      - id: metadata/package/dependencies/manifest::npm-github-protocol-optional-dependency
      - id: metadata/package/dependencies/manifest::npm-github-shorthand-dependency
  - id: dev-url-dependency
    desc: Dev dependency uses remote URL
    crit: notable
    conf: 0.95
    any:
      - id: devdep-http-url-kv
      - id: devdep-https-url-kv
      - id: devdep-plaintext-http
      - id: devdep-https-url-text
  - id: runtime-and-dev-url-dependency
    desc: Remote dependency appears in runtime and dev scopes
    crit: notable
    conf: 0.95
    all:
      - id: runtime-url-dependency
      - id: dev-url-dependency
  - id: duplicated-plaintext-http-dependency
    desc: Plain HTTP dependency in runtime and dev scopes
    crit: hostile
    conf: 0.985
    all:
      - id: dep-plaintext-http
      - id: devdep-plaintext-http
    unless:
      - id: metadata/package/manifest/publishing::is-private
  - id: inflated-version-anomaly
    desc: Package shows inflated version anomaly
    crit: component
    conf: 0.9
    any:
      - id: metadata/package/quality/version-sentinel::npm-version-major-40-plus
      - id: metadata/package/versioning::npm-unrealistic-major-version
  - id: duplicated-plaintext-http-minimal
    desc: Minimal package duplicates plain HTTP dependency
    crit: hostile
    conf: 0.995
    all:
      - id: duplicated-plaintext-http-dependency
      - id: inflated-version-anomaly
      - id: metadata/package/manifest/description::short-description
  - id: url-dep-minimal-metadata
    desc: URL dependency with minimal package metadata
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: direct-url-dependency
    # "Minimal metadata" was pinned to a <=15-character description, one narrow
    # proxy for it. A tiny manifest overall is the same claim and the canonical
    # trait for it, so a stub whose description happens to run to 19 characters
    # ("Placeholder package") no longer slips the rule its own name describes.
    any:
      - id: metadata/package/manifest/description::short-description
      - id: metadata/package/manifest/freeform::pkg-skeleton-small
    unless:
      - id: metadata/package/manifest/repository/
      - id: well-known/lib/runtime/electron::electron-app-bundle-exception
      - id: well-known/lib/runtime/electron::electron-webpack-main-entrypoint
      - id: well-known/app/infrastructure/argo-cd::argo-cd-source-tree
  # `inflated-single-url-dependency` moved to
  # objectives/supply-chain/impersonation/depconf/inflated-url-stub.yaml: it
  # describes a confusion squat's versioning move, and this directory is
  # install-time execution, which that package does not do.
  - id: dependency-confusion-staging-url
    desc: Package uses dependency-confusion staging URL
    crit: hostile
    conf: 0.995
    all:
      - id: dep-url-depconf-staging-marker
      - id: runtime-url-dependency
