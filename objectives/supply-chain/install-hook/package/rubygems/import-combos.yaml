defaults:
  platforms:
    - unix
    - windows
  for:
    - ruby
  attack: T1195.002
traits:
  - id: eval-base64-decode
    desc: eval with Base64 decode
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: eval\s*\(\s*Base64\.decode64
  - id: hex-escape-dense-dup
    desc: Dense hex escape sequences
    crit: baseline
    conf: 0.85
    count_min: 10
    if:
      type: string_literal
      regex: \\x[0-9a-f]{2}\\x[0-9a-f]{2}
  - id: netrc-path
    desc: .netrc file path
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      substr: .netrc
    unless:
      # Listed in sensitive-file blocklists, not targeted for theft.
      - type: text
        regex: '(?i)sensitive_patterns|sensitive_file\?'
      - id: well-known/lib/format/ruby-netrc::netrc-library-context
      - id: well-known/lib/format/ruby-netrc::netrc-gem-path
      - id: well-known/lib/format/ruby-netrc::netrc-class
  - id: chrome-config-path
    desc: Chrome config path
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      regex: \.config/(google-chrome|chromium)
  - id: tcpsocket-exec
    desc: TCPSocket with exec
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: TCPSocket\.new.{0,50}(exec|system|spawn|`)
  - id: socket-stdin
    desc: Socket redirecting stdin
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: Socket\.tcp.{0,100}\$stdin
  - id: stdin-reopen
    desc: STDIN reopen pattern
    crit: suspicious
    conf: 0.9
    if:
      type: string_literal
      regex: dup2.{0,30}STDIN|STDIN.{0,30}reopen
    unless:
      - id: well-known/lib/runtime/scripted/cruby::source-tree
      - id: well-known/lib/runtime/scripted/jruby::runtime-context
      - id: metadata/package/testing/
composite_rules:
  - id: http-client-imports-comp
    desc: HTTP client imports
    crit: notable
    conf: 0.5
    any:
      - id: metadata/import/ruby/net/http
      - id: metadata/import/ruby/faraday
      - id: metadata/import/ruby/httparty
      - id: metadata/import/ruby/rest-client
  - id: eval-imports
    desc: Ruby string source evaluation
    crit: notable
    conf: 0.75
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-instance-eval-string-argument
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-class-eval-string-argument
  # Generic gemspec process creation is already reported by the neutral
  # micro-behaviors/process/create traits. A recipe filename plus execution
  # does not establish an install hook or supply-chain trust violation.
  - id: extconf-remote-download
    desc: Native extension downloads remote code
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: http-client-imports-comp
    any:
      - id: micro-behaviors/communications/http/download/url::executable-url-reference
      - id: micro-behaviors/process/create/shell/lang::ruby-shell-exec-imports
  - id: extconf-tracking-pixel
    desc: Native extension contacts tracking pixel or logging service
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: http-client-imports-comp
      - id: objectives/discovery/system/fingerprint/network::tracking-service-lookup
  - id: extconf-http-fetch
    desc: extconf.rb performs HTTParty GET during build
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/communications/http/request/client::httparty-get
  - id: network-eval-exec-chain-comp
    desc: Network fetch with eval and exec
    crit: suspicious
    conf: 0.9
    all:
      - id: http-client-imports-comp
      - id: eval-imports
    any:
      - id: micro-behaviors/process/create/shell/lang::ruby-shell-exec-imports
      - id: micro-behaviors/os/module/load::ruby-load-source-call
  - id: credential-path-access
    desc: Accesses credential storage paths
    crit: suspicious
    conf: 0.9
    # A bare credential-path mention is not access: Ruby SSH clients and test
    # harnesses routinely SELECT a key identity (`:keys => ["~/.ssh/id_rsa"]`,
    # beaker acceptance configs, `Net::SSH.start(..., keys:)`) without reading
    # it. Require file-read/write capability in the same file so the match
    # means the code can actually open the store it names.
    all:
      - id: micro-behaviors/fs/file/read-write::ruby-file-read-write-or-fileutils
    unless:
      # An SSH client resolves key paths because that is what it does; a linter
      # or compliance cop that DETECTS them names the same paths. net-ssh,
      # hrr_rb_ssh, cookstyle's Chef/Security/SshPrivateKey cop and inspec's
      # ssh_key resource all tripped this from inside vendored .gem caches.
      - id: well-known/lib/network/net-ssh/
      - id: well-known/lib/network/hrr/
      - id: well-known/tool/detection/
      - id: well-known/lib/format/ruby-netrc::netrc-library-context
      - id: well-known/lib/format/ruby-netrc::netrc-gem-path
      - id: well-known/lib/format/ruby-netrc::netrc-class
      - id: well-known/tool/offensive/
      - id: metadata/package/testing/
    any:
      - id: micro-behaviors/fs/path/private-key::ssh-private-key
      - id: micro-behaviors/fs/path/token::aws-credentials
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: chrome-config-path
  - id: netrc-credential-access
    desc: Reads .netrc with HTTP client capability
    crit: suspicious
    conf: 0.9
    scope: leaf
    all:
      - id: netrc-path
      - id: micro-behaviors/fs/file/read-write::ruby-file-read-write-or-fileutils
      - id: http-client-imports-comp
    unless:
      - id: well-known/lib/format/ruby-netrc::netrc-library-context
      - id: well-known/lib/format/ruby-netrc::netrc-gem-path
      - id: well-known/lib/format/ruby-netrc::netrc-class
  - id: webhook-exfil-comp
    desc: Webhook data exfiltration
    crit: suspicious
    conf: 0.85
    all:
      - id: http-client-imports-comp
    any:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: objectives/exfiltration/messaging/webhook::telegram-bot-api
  - id: gemspec-remote-eval
    desc: Gemspec downloads and evaluates remote code
    crit: hostile
    conf: 0.95
    mbc: B0024
    all:
      - id: metadata/package/files/rubygems::gemspec-file
      - id: http-client-imports-comp
      - id: eval-imports
  - id: credential-stealer
    desc: Steals and exfiltrates credentials
    crit: hostile
    conf: 0.95
    mbc: E1555
    attack: T1555
    all:
      - id: micro-behaviors/fs/file/read-write::ruby-file-read-write-or-fileutils
      - id: http-client-imports-comp
    any:
      - id: credential-path-access
      - id: netrc-credential-access
  - id: reverse-shell-pattern-comp
    desc: Ruby reverse shell pattern
    crit: hostile
    conf: 0.95
    mbc: B0030
    attack: T1059.004
    all:
      - id: metadata/import/ruby/socket
    any:
      - id: tcpsocket-exec
      - id: socket-stdin
      - id: stdin-reopen
    unless:
      - id: metadata/package/testing/
