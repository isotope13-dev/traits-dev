# RubyGems Installation Hooks
# GuardDog: Detects Gem installation hooks that execute code during install
# ATT&CK: T1195.002 (Supply Chain Compromise)
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: suspicious
  conf: 0.95
  attack: "T1195.002"
traits:
  # A bare `post_install:` substring is not evidence of a gemrc hook: it is also
  # RBS method-signature syntax (`def self.post_install: () -> ...`, which is
  # how the stock rbs gem's rubygems.rbs reads), a Ruby keyword argument, and an
  # ordinary YAML key. Require the gemrc config document itself nearby, in
  # either order, so the match means what the id says.
  - id: ruby-gemrc-post-install-hook
    desc: gemrc config near a post_install key
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'gemrc[\s\S]{0,200}post_install:|post_install:[\s\S]{0,200}gemrc'
    unless:
      - id: well-known/tool/development/build/homebrew::source-tree
  - id: ruby-gem-wrapper-replacement
    desc: Ruby replaces gem command wrapper
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '/usr/local/bin/gem[\s\S]{0,220}\.real'
  - id: ruby-gem-sources-cache-write
    desc: Ruby writes RubyGems sources cache
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: cached_sources
composite_rules:
# A gem install-time hook that evaluates Ruby source from a string crosses the
# package-install trust boundary and is a suspicious review signal; hostile
# intent requires corroborating behavior.
  # Benign-context group: the Ruby platform itself. The CRuby/MRI source tree
  # and rbenv's gem-rehash plugin both register install hooks and evaluate
  # Ruby strings as part of normal toolchain operation, so either one alone
  # explains an eval-in-hook match. Grouped as one exception (instead of two
  # separate unless: legs) to keep the host rule's suppression list within
  # budget; the semantics are exactly the OR of the two grouped legs.
  - id: ruby-platform-source-context
    desc: CRuby source tree or rbenv gem-rehash plugin context
    crit: exception
    conf: 0.99
    any:
      - id: well-known/tool/packaging/rbenv::rbenv-gem-rehash-plugin-context
      - id: well-known/lib/runtime/scripted/cruby::source-tree
  - id: gem-install-hook-dynamic-eval
    desc: Gem install hook runs dynamic code evaluation
    # String-source evaluation in an install hook is a useful review signal.
    # Block-form class_eval and instance_eval are ordinary Ruby metaprogramming
    # and are deliberately excluded by eval-imports.
    crit: suspicious
    conf: 0.96
    mbc: B0024
    all:
      - id: objectives/supply-chain/install-hook/package/rubygems::eval-imports
    any:
      - id: micro-behaviors/os/package-manager/hook-install::gem-post-install
      - id: micro-behaviors/os/package-manager/hook-install::gem-pre-install
      - id: micro-behaviors/os/package-manager/hook-install::gem-installer-post-install
      - id: metadata/build/package/recipe/gemspec::filename-extconf
    unless:
      - id: objectives/supply-chain/install-hook/package/rubygems::ruby-platform-source-context
      - id: well-known/lib/runtime/scripted/jruby::runtime-context
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/package/testing/presence/harness::ruby-test-file
      - id: objectives/supply-chain/install-hook/extconf::extconf-sandbox-gated-eval-payload
      - id: objectives/supply-chain/install-hook/extconf::extconf-decoy-native-build-with-staged-payload
      - id: objectives/command-and-control/backdoor/shell/reverse::ruby-build-hook-encoded-reverse-shell
  - id: rubygems-config-install-hook
    desc: RubyGems config install hook persistence
    crit: hostile
    conf: 0.98
    all:
      - id: ruby-gemrc-post-install-hook
    any:
      - id: ruby-gem-wrapper-replacement
      - id: ruby-gem-sources-cache-write
  # GuardDog: Any gem installation hook
