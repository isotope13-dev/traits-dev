defaults:
  platforms:
  - unix
  - windows
  for:
  - pkginfo
  conf: 0.9
traits:
- id: pypi-empty-description
  desc: PyPI metadata has empty description
  crit: notable
  conf: 0.75
  if:
    type: value
    path: info.description
    exact: ''
- id: pypi-dynamic-metadata-triad
  desc: Dynamic PyPI metadata triad
  crit: suspicious
  if:
    type: value
    path: info.dynamic
    substr: Author
- id: pypi-arabic-exe-download-summary
  desc: Arabic EXE download lure
  crit: suspicious
  conf: 0.98
  if:
    type: value
    path: info.summary
    regex: تحميل.{0,40}تشغيل.{0,24}exe.{0,24}رابط
composite_rules:
- id: pypi-minimal-malware-facade-metadata
  desc: Sparse PyPI metadata consistent with throwaway malware facade package
  crit: suspicious
  conf: 0.94
  all:
  - id: metadata/filename/identity::meta-json-basename
  - id: pypi-empty-description
  - id: metadata/package/dependencies/presence::pypi-no-runtime-deps
  any:
  - id: metadata/package/homepage::pypi-no-homepage
  - id: metadata/package/author/identity::pypi-no-author-email
  - id: pypi-dynamic-metadata-triad
- id: pypi-exe-link-dropper-lure
  desc: PyPI metadata markets downloading and running EXE from URL
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/filename/identity::meta-json-basename
  - id: pypi-arabic-exe-download-summary
  any:
  - id: pypi-minimal-malware-facade-metadata
