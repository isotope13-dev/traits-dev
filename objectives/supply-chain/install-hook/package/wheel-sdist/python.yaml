defaults:
  platforms: [unix]
  for: [python, pyc]
  attack: T1195.002

traits:
  - id: python-pip-list-metadata
    desc: Python pip list metadata
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: --format=json
    unless:
      - type: text
        regex: "def _pip_list_tool[\\s\\S]{0,300}pip[\"'], [\"']list[\"'], [\"']--format=json"
      # Pipenv's Windows runtime installer queries available CPython versions
      # through `pymanager list --online --format=jsonl`; that is not pip
      # package inventory.
      - type: text
        regex: '(?i)pymanager[\s\S]{0,300}--format=jsonl'
      - id: well-known/tool/sysadmin/alpine-packages/package::alpine-ansible-core-package

  - id: python-metadata-report-post
    desc: Python metadata report POST
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: packages_with_anomalies

composite_rules:
  - id: python-package-metadata-exfil
    desc: Python package metadata exfil
    crit: hostile
    conf: 0.98
    all:
      - id: python-pip-list-metadata
      - id: micro-behaviors/os/package-manager/dependency-probe::pypi-json-api-url
      - id: python-metadata-report-post
