defaults:
  platforms:
  - macos
composite_rules:
- id: flat-pkg-hook-ip-download-executable
  desc: Package hook downloads from an IP and starts a background executable
  crit: hostile
  conf: 0.96
  for:
  - pkg
  - shell
  scope: archive
  all:
  - id: micro-behaviors/os/package-manager/installer-script::pkg-scripts-hook-path
  - id: micro-behaviors/communications/http/download/curl::shell-silent-ip-download
  - id: micro-behaviors/fs/chmod/executable/mode::shell-owner-executable-numeric-mode
  - id: micro-behaviors/process/daemonize/detach::nohup-command
