# macOS installer packages run postinstall/preinstall scripts with the
# installer's privileges.  These composites keep the lifecycle context on the
# package artifact while reusing neutral shell capabilities from the members.
defaults:
  platforms: [macos]
  for: [pkg]
  attack: T1195.002

composite_rules:

  # Stub installers ship an empty payload and a hook that downloads the real
  # one. The two install tools are the same action: unpack what curl just saved.
  - id: macpkg-profile-network-command
    desc: Installer hook adds network profile command
    crit: suspicious
    conf: 0.95
    scope: archive
    platforms: [macos, windows, linux]
    for: [source, scripts, '!jcl', class, elf, macho, pkg]
    all:
      - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
      - id: micro-behaviors/fs/path/config/shell::system-profiled-path
      - id: micro-behaviors/communications/http/download/curl::curl-fail-silent-url-reference
    unless:
      - id: micro-behaviors/process/create/shell/pipeline::source-curl-pipe-shell
