# macOS installer packages run postinstall/preinstall scripts with the
# installer's privileges.  These composites keep the lifecycle context on the
# package artifact while reusing neutral shell capabilities from the members.
defaults:
  platforms: [macos]
  for: [pkg]
  attack: T1195.002

composite_rules:
  - id: macpkg-background-curl-beacon
    desc: macOS package hook installs a curl beacon
    crit: hostile
    conf: 0.99
    scope: archive
    platforms: [macos, windows, linux]
    for: [scripts, '!jcl', markdown, pkg, text]
    all:
      - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
      - id: micro-behaviors/communications/http/curl::curl-command-remote-url
      - id: micro-behaviors/process/create/background::detached-background-command

  # Stub installers ship an empty payload and a hook that downloads the real
  # one. The two install tools are the same action: unpack what curl just saved.
  - id: macpkg-ditto-downloaded-zip
    desc: Downloads a zip and extracts it
    crit: notable
    conf: 0.9
    for: [shell]
    all:
      - id: micro-behaviors/communications/http/download/curl::curl-zip-output
      - id: micro-behaviors/data/archive/create/utility::macos-ditto-extract-zip
  - id: macpkg-installer-downloaded-pkg
    desc: Downloads a package and installs it
    crit: notable
    conf: 0.9
    for: [shell]
    all:
      - id: micro-behaviors/communications/http/download/curl::curl-output-file-command
      - id: micro-behaviors/os/package-manager/sideload::macos-installer-pkg
  - id: macpkg-remote-payload-install
    desc: Installer hook installs a downloaded payload
    crit: hostile
    conf: 0.96
    scope: archive
    for: [shell, pkg]
    all:
      - id: metadata/build/package/recipe::macos-installer-hook-basename
    any:
      - id: macpkg-ditto-downloaded-zip
      - id: macpkg-installer-downloaded-pkg

  - id: macpkg-zshrc-remote-shell-hook
    desc: macOS package hooks a zsh profile with remote code
    crit: hostile
    conf: 0.99
    scope: archive
    for: [source, applescript, html, javascript, lua, markdown, perl, php, pkg, python, ruby, shell]
    all:
      - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
      - id: micro-behaviors/fs/path/config/shell::zshrc-filename
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text

  - id: macpkg-xattr-dylib-dropper
    desc: macOS package stages and unhides a dylib
    crit: hostile
    conf: 0.99
    scope: archive
    platforms: [macos, windows, linux]
    for: [source, scripts, '!jcl', '!vbs', class, macho, pe, pkg]
    all:
      - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
      - id: micro-behaviors/fs/path/library::dylib-name-literal
      - id: micro-behaviors/fs/attributes/xattr::xattr-clear
      - id: micro-behaviors/communications/http/download/curl::curl-output-staging-path

  - id: macpkg-nested-pkg-dropper
    desc: macOS package hook downloads another installer payload
    crit: hostile
    conf: 0.99
    scope: archive
    platforms: [macos, windows, linux]
    for: [scripts, '!jcl', macho, markdown, objectivec, pkg, swift, text]
    all:
      - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
      - id: objectives/command-and-control/dropper/execution/installer::pkg-payload-reference
      - id: micro-behaviors/communications/http/curl::curl-command-remote-url

  - id: macpkg-receipt-erasure-hook
    desc: macOS package hook erases installer receipts
    crit: hostile
    conf: 0.98
    scope: archive
    for: [pkg, shell]
    all:
      - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
      - id: micro-behaviors/os/package-manager/management::macos-pkg-forget-receipts

  - id: macpkg-profile-remote-hook
    desc: macOS package hook installs a remote shell profile
    crit: hostile
    conf: 0.99
    scope: archive
    platforms: [macos, windows, linux]
    for: [source, scripts, '!jcl', class, elf, macho, pkg]
    all:
      - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
      - id: micro-behaviors/process/interpreter/shell::system-profiled-path
      - id: micro-behaviors/communications/http/download/curl::curl-fail-silent-url-reference

  - id: macpkg-user-folder-wipe-hook
    desc: macOS package hook recursively wipes user files
    crit: hostile
    conf: 0.99
    scope: archive
    for: [scripts, '!batch', '!jcl', '!powershell', '!vbs', objectivec, pkg, swift]
    all:
      - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
      - id: micro-behaviors/fs/delete/directory::shell-recursive-delete
      - id: micro-behaviors/fs/path/location::documents-folder-target

  - id: macpkg-hook-chmod-staged-fetch
    desc: Hook fetches remote executable file
    crit: hostile
    conf: 0.97
    platforms: [macos, windows, linux]
    for: [pkg, shell]
    all:
      - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
      - id: micro-behaviors/communications/http/curl::curl-command-remote-url
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-absolute-path

  - id: macpkg-hook-sudo-remote-script
    desc: Hook sudo-runs GitHub script
    crit: hostile
    conf: 0.98
    platforms: [macos, windows, linux]
    for: [pkg, shell, python, javascript]
    all:
      - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
      - id: micro-behaviors/process/create/sudo::sudo-stdin-password
      - id: objectives/command-and-control/channel/deaddrop/github::github-raw-command-script-url

  - id: macpkg-hook-password-ip-post
    desc: Hook POSTs credentials to IP
    crit: hostile
    conf: 0.98
    platforms: [macos, windows, linux]
    for: [pkg, shell, batch, powershell]
    all:
      - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
      - id: micro-behaviors/communications/http/curl::curl-post-custom-header
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url

  - id: macpkg-hook-background-fetch
    desc: Hook backgrounds curl fetch
    crit: hostile
    conf: 0.96
    platforms: [macos, windows, linux]
    for: [pkg, shell, python, javascript, typescript]
    all:
      - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
      - id: micro-behaviors/communications/http/curl::curl-command-remote-url
      - id: micro-behaviors/process/create/background::fetch-background-ampersand
