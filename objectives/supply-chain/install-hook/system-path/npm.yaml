# Install hooks that place an executable name on the system-wide PATH.
#
# npm already has a declarative way to expose a command: the manifest `bin`
# field, which the client links into the consuming project's `node_modules/.bin`
# (or the npm prefix for a global install) and unlinks again on uninstall. A
# postinstall script that instead writes into /usr/bin or /usr/local/bin itself
# is doing something the package manager deliberately does not do: it takes
# whatever privileges the install happens to run with (root in CI images and
# container builds), affects every user on the host, escapes npm's bookkeeping,
# and survives `npm uninstall`. When the linked name differs from the declared
# `bin` name, the command it publishes is not one the consumer asked for.
#
# Notable rather than suspicious: sloppy-but-honest CLI wrappers reach for the
# same shape when they just want a global command, and nothing here proves the
# published name shadows a pre-existing system binary. Rules that can show that
# -- a link name unrelated to the manifest `bin` name, or a target that already
# exists in the system tree -- should compose this and raise the verdict.
defaults:
  platforms: [unix]
  attack: T1195.002,T1222.002
  mbc: E1105

composite_rules:
  - id: install-hook-links-into-system-bin
    desc: Install hook symlinks a command into a system bin directory
    crit: notable
    conf: 0.95
    for: [npm, archives]
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/fs/link/symlink::system-bin-symlink-create
