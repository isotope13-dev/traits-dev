# Ruby gem require-time installer spawn (supply-chain loaders)
# ATT&CK: T1195.002
defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1195.002
  mbc: B0024
  crit: notable

traits:
# Guard bit so require-time code can spawn an installer once, without
# recursing when the installer re-requires the library.
- id: ruby-deployment-guard-env
  desc: Ruby __RUBY_DEPLOYMENT install guard env
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'ENV\[["'']__RUBY_DEPLOYMENT["'']\]'

- id: ruby-install-async-call
  desc: Ruby install_async method invocation
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '\.install_async\b'

- id: ruby-spawn-rbconfig-ruby
  desc: Process.spawn launches RbConfig.ruby
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'Process\.spawn\([^)\n]{0,120}RbConfig\.ruby'

composite_rules:
# Require/import of a gem immediately detaches a Ruby child that runs an
# installer — SleeperGem and similar loaders use this to hide from
# install-hook-only scanners. Evidence spans the require guard file and
# the installer that Process.spawns RbConfig.ruby.
- id: ruby-require-time-async-installer
  desc: Gem require spawns async Ruby installer
  crit: hostile
  conf: 0.95
  scope: archive
  all:
  - id: ruby-deployment-guard-env
  - id: ruby-install-async-call
  - id: ruby-spawn-rbconfig-ruby
