defaults:
  platforms: [unix, windows]
  for: [package.json]

  attack: T1195.002
composite_rules:
- id: placeholder-install-pingback-package
  desc: Declared placeholder names a pingback hook
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/package/scripts/command::pingback-postinstall
  - id: metadata/package/description/disclosure::desc-dependency-confusion
  any:
  - id: metadata/package/documentation/disclosure::private-package-readme
  - id: metadata/package/documentation/disclosure::private-registry-warning
  - id: metadata/package/description/disclosure::placeholder-description
  - id: metadata/package/versioning/scheme::placeholder-release-line
- id: placeholder-install-pingback-registry-metadata
  desc: Placeholder claims and named pingback hook
  crit: suspicious
  conf: 0.995
  all:
  - id: metadata/package/scripts/command::pingback-postinstall
  - id: metadata/package/description/disclosure::desc-dependency-confusion
  - id: metadata/package/documentation/disclosure::private-package-readme
  any:
  - id: metadata/package/publishing::npm-public-publish-access
  - id: metadata/package/versioning/scheme::placeholder-release-line
  - id: metadata/registry::maintainer-exviry
  - id: metadata/package/documentation/disclosure::private-registry-warning
