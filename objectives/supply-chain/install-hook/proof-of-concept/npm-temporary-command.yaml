defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: concealed-install-temporary-package-command
    desc: Install hook hides temporary-package command
    crit: hostile
    conf: 0.96
    attack: T1195.002,T1027
    all:
      - id: objectives/anti-static/obfuscation/encoding/shell::npm-postinstall-printf-command-word
      - id: micro-behaviors/fs/write/file/target::postinstall-temporary-package-manifest
      - id: micro-behaviors/fs/delete/directory::postinstall-removes-variable-directory
  # Stages a publishable package in a temp dir: a randomly named manifest
  # plus a registry credential dotfile, then deletes the staging directory.
  # Legitimate packaging never fabricates a credentialed package at install
  # time; this is the publish half of a supply-chain PoC or campaign.
  - id: install-hook-stages-credentialed-temp-package
    desc: Install hook stages credentialed temporary package
    crit: hostile
    conf: 0.96
    attack: T1195.002
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/fs/write/file/target::postinstall-temporary-package-manifest
      - id: micro-behaviors/fs/write/file/target::postinstall-random-name-manifest-template
      - id: objectives/supply-chain/install-hook/scripts/credential::script-credential-dotfile
      - id: micro-behaviors/fs/delete/directory::postinstall-removes-variable-directory
