defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-install-run-calculator-call
    desc: Python install run calls calculator
    crit: component
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (class_definition name: (identifier) @hook
            superclasses: (argument_list (identifier) @base)
            body: (block
              (function_definition name: (identifier) @method
                parameters: (parameters . (identifier) @self .)
                body: (block
                  . (expression_statement
                    (call function: (attribute object: (identifier) @os
                      attribute: (identifier) @system)
                      arguments: (argument_list . (string (string_content) @target))))))))
          . (expression_statement
            (call function: (identifier) @setup
              arguments: (argument_list
                (keyword_argument name: (identifier) @keyword
                  value: (dictionary
                    (pair key: (string (string_content) @key)
                      value: (identifier) @mapped)))))))
          (#eq? @os "os")
          (#eq? @system "system")
          (#eq? @base "install")
          (#eq? @method "run")
          (#eq? @hook @mapped)
          (#eq? @setup "setup")
          (#eq? @keyword "cmdclass")
          (#eq? @key "install")
          (#match? @target "^(calc(\\.exe)?|gnome-calculator|xcalc|kcalc)$")) @chain
    unless:
      - type: tree-sitter
        language: python
        query: |
          ([
            (assignment left: (identifier) @shadow)
            (for_statement left: (identifier) @shadow)
            (function_definition name: (identifier) @shadow)
            (class_definition name: (identifier) @shadow)
            (import_statement name: (aliased_import alias: (identifier) @shadow))
            (import_from_statement name: (aliased_import alias: (identifier) @shadow))
           ] (#match? @shadow "^(os|setup|install)$"))

composite_rules:
  - id: python-install-hook-runs-calculator
    desc: Python install hook runs calculator
    crit: hostile
    conf: 0.98
    all:
      - id: python-install-run-calculator-call
      - id: metadata/build/package/recipe/setup-hooks::python-install-hook
      - id: metadata/import/module::python-import-os
      - id: metadata/import/module::python-import-setuptools-install
      - id: metadata/import/module::python-import-setuptools-setup
