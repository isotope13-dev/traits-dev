# The publish-time template that dresses an install hook as a security check.
#
# kv.yaml already carries the structural half as prepare-unshipped-security-
# sidecar: `prepare` runs `npm run security:validate`, that script runs
# `node scripts/<name>.js`, and `files` publishes only `src`, so the file the
# hook invokes is not in the artifact anybody can read. Every hostile verdict
# built on it so far then bolts on one literal dependency name --
# lessload-dependency for one clone, npm-dep-byteboxlab for the next -- which
# means each new clone stays invisible until someone adds its name too.
#
# The camouflage does not rotate the way the dependency name does. The same
# manifests carry a block of security-labelled scripts around the hook and a
# prepublishOnly that announces an audit, and that block is the tell: `prepare`
# is npm's build hook, and a package that uses it to run "security validation"
# has inverted what the hook is for. Nothing here names a package, so a clone
# published tomorrow under a new name and a new dependency is caught on the
# manifest it ships with.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json]
  attack: T1195.002
  mbc: B0024

composite_rules:
  # Suspicious on its own: a manifest can be written this way out of genuine
  # (if unusual) habit, and the block only becomes evidence when it surrounds a
  # hook that reaches outside the published files.
  - id: security-labelled-script-block
    desc: Manifest carries a security-labelled script block
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/package/manifest/security-label::security-labelled-script-names
      - id: metadata/package/manifest/security-label::prepublish-security-audit-banner

  # Both halves together. The hook runs code the artifact does not contain, and
  # the manifest around it is arranged to make that read as diligence rather
  # than as a gap. A package with a genuine build step does not need to look
  # like an audit, and an audit that mattered would not be unreadable.
  - id: security-theatre-prepare-sidecar
    desc: Install hook disguised as a security check
    crit: hostile
    conf: 0.94
    attack: T1195.002,T1059.007
    all:
      - id: objectives/supply-chain/install-hook/scripts/prepare::prepare-unshipped-security-sidecar
      - id: security-labelled-script-block
