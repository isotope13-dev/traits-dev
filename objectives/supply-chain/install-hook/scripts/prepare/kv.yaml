defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002
traits:
  # Building blocks for "this prepare script is just a known bundler/compiler
  # invocation" — package authoring, not a security risk. `prepare` only
  # runs on git-installs and at publish, not on registry installs.
- id: prepare-runs-husky
  desc: prepare runs husky
  crit: component
  conf: 0.95
  if:
    type: value
    path: "scripts.prepare"
    regex: '\bhusky\b'
- id: prepare-runs-package-manager-build
  desc: prepare runs package-manager build
  crit: notable
  conf: 0.95
  if:
    type: value
    path: "scripts.prepare"
    regex: '^\s*(npm|pnpm|yarn|bun)\s+(run\s+)?(build|compile)\b'
# patch-package applies checked-in patches to node_modules after install. It
# is one of the most common prepare hooks there is, and it is what Tabby's
# builtin tabby-terminal plugin declares -- which, combined with base64 and
# child_process elsewhere in the Electron bundle, scored the .deb hostile.
- id: prepare-runs-patch-package
  desc: prepare runs patch-package
  crit: component
  conf: 0.95
  if:
    type: value
    path: "scripts.prepare"
    regex: '\bpatch-package\b'
- id: prepare-runs-esbuild
  desc: prepare runs esbuild
  crit: component
  conf: 0.95
  if:
    type: value
    path: "scripts.prepare"
    regex: '\besbuild\b'
- id: has-prepare
  desc: Has prepare script hook
  crit: notable
  conf: 0.82
  unless:
  - id: metadata/package/files/dependency::node-modules-path
  if:
    type: value
    path: "scripts.prepare"
- id: prepare-command-then-fail
  desc: prepare runs command then forces failure
  crit: suspicious
  conf: 0.98
  if:
    type: value
    path: "scripts.prepare"
    # With `&&`, the nonzero exit runs only after the preceding payload
    # succeeds. Optional dependencies let npm suppress that failure and remove
    # the fetched package, which is the cleanup sequence used by commit-backed
    # install payloads. Keep the launcher and filename variable.
    regex: '(?i)\S[\s\S]{0,300}\s&&\s*(exit\s+[1-9][0-9]*|false)\s*$'
- id: prepare-detached-node-sidecar
  desc: prepare detaches Node sidecar
  crit: suspicious
  conf: 0.96
  if:
    type: value
    path: "scripts.prepare"
    regex: "\\b(nohup\\s+node|start\\s+/b\\s+node)\\b"
  # prepare runs on git installs and local package installs, so an outbound
  # HTTP POST here can still push data from a consumer's machine — the
  # recon-exfil shape, distinct from the benign bundler invocations above.
- id: curl-http-post
  desc: prepare sends HTTP POST via curl
  crit: suspicious
  conf: 0.8
  attack: T1041
  if:
    type: value
    path: "scripts.prepare"
    regex: "\\bcurl\\b[^\"\\n]{0,200}((-X\\s*|--request\\s+)POST|--data[\\w-]*|\\s-d\\b)"
- id: prepare-cross-platform-background
  desc: prepare starts cross-platform Node server
  crit: suspicious
  conf: 0.98
  if:
    type: value
    path: "scripts.prepare"
    regex: "start\\s+/b\\s+node.{0,80}\\|\\|.{0,80}nohup\\s+node"
- id: prepare-runs-security-validate
  desc: prepare runs security validate script
  crit: notable
  conf: 0.98
  if:
    type: value
    path: "scripts.prepare"
    exact: "npm run security:validate"
- id: security-validate-runs-local-script
  desc: security validate runs local script file
  crit: notable
  conf: 0.98
  if:
    type: value
    path: "scripts.security:validate"
    regex: '^node\s+scripts/[A-Za-z0-9._-]+\.js$'
- id: files-src-only
  desc: package files list only src
  crit: component
  conf: 0.96
  count_min: 1
  count_max: 1
  if:
    type: value
    path: "files[*]"
    exact: src
- id: prepare-runs-webpack-rollup--webpack
  desc: prepare runs webpack or rollup (webpack)
  crit: component
  conf: 0.95
  if:
    type: value
    path: "scripts.prepare"
    regex: \bwebpack\b
- id: prepare-runs-webpack-rollup--rollup
  desc: prepare runs webpack or rollup (rollup)
  crit: component
  conf: 0.95
  if:
    type: value
    path: "scripts.prepare"
    regex: \brollup\b
- id: prepare-runs-parcel-vite--parcel
  desc: prepare runs parcel or vite (parcel)
  crit: component
  conf: 0.95
  if:
    type: value
    path: "scripts.prepare"
    regex: \bparcel\b
- id: prepare-runs-parcel-vite--vite
  desc: prepare runs parcel or vite (vite)
  crit: component
  conf: 0.95
  if:
    type: value
    path: "scripts.prepare"
    regex: \bvite\b
- id: prepare-runs-typescript-compiler--tsc
  desc: prepare runs tsc, tsup, swc, or (tsc)
  crit: component
  conf: 0.95
  if:
    type: value
    path: "scripts.prepare"
    regex: \btsc\b
- id: prepare-runs-typescript-compiler--tsup
  desc: prepare runs tsc, tsup, swc, or (tsup)
  crit: component
  conf: 0.95
  if:
    type: value
    path: "scripts.prepare"
    regex: \btsup\b
- id: prepare-runs-typescript-compiler--swc
  desc: prepare runs tsc, tsup, swc, or (swc)
  crit: component
  conf: 0.95
  if:
    type: value
    path: "scripts.prepare"
    regex: \bswc\b
- id: prepare-runs-typescript-compiler--babel
  desc: prepare runs tsc, tsup, swc, or (babel)
  crit: component
  conf: 0.95
  if:
    type: value
    path: "scripts.prepare"
    regex: \bbabel\b
- id: prepare-runs-minor-bundler--microbundle
  desc: prepare runs minor bundler (microbundle)
  crit: component
  conf: 0.95
  if:
    type: value
    path: "scripts.prepare"
    regex: \bmicrobundle\b
- id: prepare-runs-minor-bundler--ncc
  desc: prepare runs minor bundler (ncc)
  crit: component
  conf: 0.95
  if:
    type: value
    path: "scripts.prepare"
    regex: \bncc\b
- id: prepare-runs-minor-bundler--preconstruct
  desc: prepare runs minor bundler (preconstruct)
  crit: notable
  conf: 0.95
  if:
    type: value
    path: "scripts.prepare"
    regex: \bpreconstruct\b
- id: prepare-runs-minor-bundler--unbuild
  desc: prepare runs minor bundler (unbuild)
  crit: component
  conf: 0.95
  if:
    type: value
    path: "scripts.prepare"
    regex: \bunbuild\b
composite_rules:
- id: prepare-runs-webpack-rollup
  desc: prepare runs webpack or rollup
  crit: component
  conf: 0.95
  any:
  - id: prepare-runs-webpack-rollup--webpack
  - id: prepare-runs-webpack-rollup--rollup
- id: prepare-runs-parcel-vite
  desc: prepare runs parcel or vite
  crit: component
  conf: 0.95
  any:
  - id: prepare-runs-parcel-vite--parcel
  - id: prepare-runs-parcel-vite--vite
- id: prepare-runs-typescript-compiler
  desc: prepare runs tsc, tsup, swc, or babel
  crit: component
  conf: 0.95
  any:
  - id: prepare-runs-typescript-compiler--tsc
  - id: prepare-runs-typescript-compiler--tsup
  - id: prepare-runs-typescript-compiler--swc
  - id: prepare-runs-typescript-compiler--babel
- id: prepare-runs-minor-bundler
  desc: 'prepare runs minor bundler'
  crit: component
  conf: 0.95
  any:
  - id: prepare-runs-minor-bundler--microbundle
  - id: prepare-runs-minor-bundler--ncc
  - id: prepare-runs-minor-bundler--preconstruct
  - id: prepare-runs-minor-bundler--unbuild
- id: prepare-is-build-tool
  desc: prepare script invokes a known bundler/compiler
  crit: component
  conf: 0.95
  any:
  - id: prepare-runs-husky
  - id: prepare-runs-package-manager-build
  - id: prepare-runs-esbuild
  - id: prepare-runs-webpack-rollup
  - id: prepare-runs-parcel-vite
  - id: prepare-runs-typescript-compiler
  - id: prepare-runs-minor-bundler
- id: prepare-detached-node-loader
  desc: prepare launches detached Node loader
  crit: hostile
  conf: 0.99
  all:
  - id: has-prepare
  - id: prepare-cross-platform-background
  any:
  - id: prepare-detached-node-sidecar
  - id: micro-behaviors/process/daemonize/detach::nohup-hidden-output
- id: prepare-unshipped-security-sidecar
  desc: prepare runs unshipped security sidecar
  crit: suspicious
  conf: 0.97
  all:
  - id: prepare-runs-security-validate
  - id: security-validate-runs-local-script
  - id: files-src-only
- id: prepare-lessload-loader-carrier
  desc: prepare hook carries compromised lessload loader
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1059.007,T1105
  mbc: B0024
  all:
  - id: prepare-unshipped-security-sidecar
  - id: objectives/supply-chain/trojanized/hidden-dependency::lessload-dependency
  - id: objectives/supply-chain/trojanized/hidden-dependency::lessload-version-range


# A prepare hook that transforms an opaque base64 token and immediately
# executes it is materially different from a normal compiler/bundler hook.
# Archive scope joins package.json's lifecycle declaration to the source
# member that performs the decode and child-process launch.
- id: prepare-decoded-command-loader
  desc: Prepare hook decodes and executes an opaque command
  crit: hostile
  conf: 0.99
  for: [javascript, typescript, package.json, npm]
  # Package scope, not archive. The three legs live in different files by
  # nature -- `prepare` is a package.json field, the decode and the exec are
  # JS -- so they cannot be bound to one file; but across a whole archive
  # they need only co-exist somewhere, and any application bundling
  # node_modules has all three in unrelated dependencies. Tabby's Electron
  # .deb scored hostile that way. `package` ties them to one npm package,
  # which is the unit this rule actually describes.
  scope: package
  attack: T1195.002,T1027,T1140,T1059.007
  all:
  - id: has-prepare
  - id: micro-behaviors/data/decode/symbol-base64::buffer-from-base64
  - id: micro-behaviors/process/create/shell/bridge::child-process-exec

# WMI plus encoded PowerShell and a network download is not a compiler hook;
# requiring the lifecycle declaration keeps this package-install verdict tied
# to the supply-chain execution surface.
  unless:
  # A prepare that names a known build or patch tool is not an opaque command.
  - id: prepare-runs-patch-package
  - id: prepare-runs-husky
  - id: prepare-runs-esbuild
  - id: prepare-runs-package-manager-build
- id: prepare-typescript-wmi-download-loader
  desc: TypeScript prepare hook runs encoded WMI PowerShell download
  crit: hostile
  conf: 0.995
  for: [javascript, typescript, package.json, npm]
  scope: archive
  attack: T1195.002,T1047,T1059.001,T1105,T1027
  all:
  - id: has-prepare
  - id: objectives/execution/wmi::win32-process-query
  - id: micro-behaviors/process/interpreter/powershell/command::encoded-command-line
  - id: micro-behaviors/communications/http/download/webclient::decoded-webclient-downloadstring-script
  - id: micro-behaviors/process/create/hidden::encodedcommand-flag-js

# A zero-width custom decoder feeding Function/new Function from an npm
# prepare hook is a concealed build-time payload.  The decoder and dynamic
# execution must co-occur with the lifecycle hook; neither atom alone is
# hostile.
- id: prepare-zero-width-dynamic-loader
  desc: Prepare hook decodes zero-width text into dynamic code
  crit: hostile
  conf: 0.995
  for: [javascript, typescript, package.json, npm]
  scope: archive
  attack: T1195.002,T1027,T1140,T1059.007
  all:
  - id: has-prepare
  - id: micro-behaviors/data/decode/custom::embedded-zero-width-radix-four-decoder
  - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-variable-argument
  any:
  - id: micro-behaviors/data/string/unicode::zero-width-format-codepoint-set
  - id: metadata/file/invisible-unicode::multiple
