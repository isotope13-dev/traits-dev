# Install hooks that load or ship a native module.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: postinstall-windows-program
  desc: Postinstall invokes a Windows executable
  crit: suspicious
  conf: 0.96
  attack: "T1195.002,T1059.003"
  if:
    type: value
    path: "scripts.postinstall"
    regex: '(?i)(^|[;&|[:space:]])([A-Za-z]:)?[\\/A-Za-z0-9_.-]+\.exe\b'
- id: preinstall-rundll32-dll
  desc: preinstall executes DLL via rundll32
  crit: suspicious
  conf: 0.98
  attack: "T1195.002, T1218.011"
  if:
    type: value
    path: "scripts.preinstall"
    regex: "\\brundll32(\\.exe)?\\b[^\"\\n]{0,180}\\.dll\\b"
  unless:
  - id: metadata/package/files/dependency::node-modules-path
- id: preinstall-native-module-file-ref
  desc: "preinstall references DLL or native mod files"
  crit: component
  conf: 0.9
  if:
    type: value
    path: "scripts.preinstall"
    regex: "\\.(dll|node)\\b"
  unless:
  - id: metadata/package/files/dependency::node-modules-path
- id: install-rundll32-dll
  desc: install executes DLL via rundll32
  crit: suspicious
  conf: 0.98
  attack: "T1195.002, T1218.011"
  if:
    type: value
    path: "scripts.install"
    regex: "\\brundll32(\\.exe)?\\b[^\"\\n]{0,180}\\.dll\\b"
  unless:
  - id: metadata/package/files/dependency::node-modules-path
- id: postinstall-rundll32-dll
  desc: postinstall executes DLL via rundll32
  crit: suspicious
  conf: 0.98
  attack: "T1195.002, T1218.011"
  if:
    type: value
    path: "scripts.postinstall"
    regex: "\\brundll32(\\.exe)?\\b[^\"\\n]{0,180}\\.dll\\b"
  unless:
  - id: metadata/package/files/dependency::node-modules-path
  # === Notify-based Pingback Detection ===
  # Detect notify.js as postinstall target (pingback variant)
composite_rules:
- id: preinstall-renames-dll-lockout
  desc: preinstall renames DLL or native module files
  crit: notable
  conf: 0.94
  attack: "T1195.002"
  all:
  - id: objectives/supply-chain/install-hook/scripts/process-control::preinstall-rename-sync-call
  - id: preinstall-native-module-file-ref
  - id: objectives/supply-chain/install-hook/scripts/process-control::preinstall-locked-file-suffix
- id: npm-lifecycle-rundll32-dll
  desc: npm install executes DLL proxy
  crit: hostile
  conf: 0.98
  attack: "T1195.002, T1218.011"
  all:
  - id: metadata/package/scripts/lifecycle::install-hooks
  any:
  - id: preinstall-rundll32-dll
  - id: install-rundll32-dll
  - id: postinstall-rundll32-dll
- id: npm-lifecycle-includes-dll
  desc: npm install hook ships DLL
  crit: suspicious
  conf: 0.93
  attack: "T1195.002"
  all:
  - id: metadata/package/files/included::npm-includes-dll
  any:
  - id: objectives/supply-chain/install-hook/scripts/declaration::has-preinstall
  - id: objectives/supply-chain/install-hook/scripts/declaration::has-postinstall
  - id: metadata/package/scripts/lifecycle::has-install-script
# Member-based sibling of the allowlist check above: older packages predate the
# `files` allowlist convention, so the DLL member is present without a matching
# allowlist entry (eslint-config-prettier 8.x/9.x class).
- id: install-hook-ships-dll-member
  desc: Install hook package ships a DLL member
  crit: suspicious
  conf: 0.92
  attack: "T1195.002"
  scope: archive
  for: [package.json, npm, tar, archives]
  all:
  - id: metadata/package/files/binary::npm-package-with-dll
  any:
  - id: objectives/supply-chain/install-hook/scripts/declaration::has-preinstall
  - id: objectives/supply-chain/install-hook/scripts/declaration::has-postinstall
  - id: metadata/package/scripts/lifecycle::has-install-script
  unless:
  # electron-winstaller's install hook only selects the host 7z arch; the
  # vendored toolchain DLLs are the package's normal shape, not a payload.
  - id: well-known/lib/development/electron-winstaller::electron-winstaller-tool-context
  # Notify-based pingback composite
- id: npm-postinstall-windows-command-poc
  desc: Proof-of-concept package executes Windows program at install
  crit: hostile
  conf: 0.99
  attack: "T1195.002,T1059.003"
  for: [npm, package.json]
  all:
  - id: objectives/supply-chain/install-hook/scripts/declaration::has-postinstall
  - id: postinstall-windows-program
  - id: metadata/package/placeholder::npm-name-poc
- id: npm-preinstall-sectionless-elf-dropper
  desc: npm preinstall executes sectionless bundled ELF
  crit: hostile
  conf: 0.97
  attack: T1195.002,T1105
  mbc: B0024,F0011
  for: [npm, tar, archives]
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/dropper/native-loader::preinstall-direct-extensionless-path
  - id: metadata/binary/section/header::elf-no-section-headers
  - id: metadata/binary/header/program::elf-entry-in-last-segment
  # A self-targeting worm hook whose runner is absent from the archive:
  # the worm config in a preinstall hook is unambiguous malice on its own,
  # and the missing companion proves the runner was stripped — takedown
  # remnant or stripped-carrier reconstruction — rather than a complete
  # payload. Silent on complete payloads, where the companion is present
  # and only the worm-config finding fires. Legs stay inside objectives/
  # (tier policy bars objectives/ from referencing well-known/).
- id: worm-preinstall-stripped-runner
  desc: Worm preinstall hook missing its runner
  crit: hostile
  conf: 0.96
  attack: T1195.002
  for: [npm, package.json, tar, archives]
  scope: archive
  all:
  - id: objectives/supply-chain/hidden-payload/worm::install-hook-self-targeting-worm-env
  - id: objectives/supply-chain/install-hook/scripts/declaration::has-preinstall
  - id: objectives/supply-chain/install-hook/scripts/local-script::install-hook-missing-companion-loader
