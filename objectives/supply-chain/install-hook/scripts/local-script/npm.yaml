# Install hooks that run a script file shipped in the package.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: install-runs-node-local-script
  desc: install hook runs a local Node.js script
  crit: notable
  conf: 0.95
  attack: "T1195.002"
  if:
    type: value
    path: "scripts.install"
    regex: "(^|[;&]{1,2})\\s*node\\s+(\\./?)?[A-Za-z0-9_./-]{1,80}\\.([cm]?js)(\\s|$)"
  unless:
  - id: well-known/lib/format/xmljs::libxmljs-native-addon-context
  downgrade:
    any:
    - id: metadata/package/dependencies/manifest/presence::has-optional-deps
- id: preinstall-runs-node-local-script
  desc: preinstall hook runs a local Node.js script
  crit: notable
  conf: 0.97
  attack: "T1195.002"
  if:
    type: value
    path: "scripts.preinstall"
    regex: "(^|[;&]{1,2})\\s*node\\s+(\\./?)?[A-Za-z0-9_./-]{1,80}\\.([cm]?js)(\\s|$)"
  unless:
  - id: well-known/lib/format/xmljs::libxmljs-native-addon-context
  downgrade:
    any:
    - id: metadata/package/dependencies/manifest/presence::has-optional-deps
- id: postinstall-runs-ts-node-local-script
  desc: postinstall runs local ts-node script
  crit: suspicious
  conf: 0.96
  attack: "T1195.002"
  if:
    type: value
    path: "scripts.postinstall"
    regex: "^ts-node\\s+(\\./)?[A-Za-z0-9_./-]{1,80}\\.(js|ts)$"
  unless:
  - type: value
    path: "scripts.postinstall"
    substr: "node_modules/"
  - type: value
    path: "scripts.postinstall"
    substr: "--transpile-only"
- id: postinstall-runs-init-js
  desc: postinstall runs init.js
  crit: suspicious
  conf: 0.96
  attack: "T1195.002"
  if:
    type: value
    path: "scripts.postinstall"
    exact: "node init.js"
- id: postinstall-runs-shell-local-script
  desc: postinstall runs local shell script
  crit: suspicious
  conf: 0.95
  attack: "T1195.002"
  if:
    type: value
    path: "scripts.postinstall"
    regex: "^(bash|sh)\\s+(\\./)?[A-Za-z0-9_./-]{1,120}\\.sh$"
  unless:
  - id: metadata/package/files/dependency::node-modules-path
  - type: value
    path: "name"
    exact: "civicrm"
  - id: well-known/lib/runtime/scripted/electron::electron-app-bundle-exception
  - id: well-known/lib/runtime/scripted/electron::electron-webpack-main-entrypoint
  - id: well-known/tool/development/vscode-extension/antigravity-cockpit::antigravity-cockpit-dev-postinstall-context
- id: postinstall-node-script-suppressed
  desc: postinstall runs suppressed Node script
  crit: notable
  conf: 0.96
  attack: "T1195.002"
  if:
    type: value
    path: "scripts.postinstall"
    regex: "^node\\s+(\\./)?[A-Za-z0-9_./-]{1,120}\\.(c?js|mjs)\\s*\\|\\|\\s*true$"
  unless:
  - id: metadata/package/files/dependency::node-modules-path
- id: postinstall-js-file
  desc: JavaScript file named npm postinstall hook
  crit: notable
  conf: 0.84
  for: [javascript, typescript]
  if:
    type: path
    regex: 'postinstall\.(c?js|mjs)$'
- id: postinstall-runs-inject-js
  desc: postinstall runs injector script
  crit: suspicious
  conf: 0.97
  attack: "T1195.002"
  if:
    type: value
    path: "scripts.postinstall"
    regex: "^node\\s+(\\./)?scripts/inject\\.(c?js|mjs)$"
  unless:
  - id: metadata/package/files/dependency::node-modules-path
- id: inject-js-basename
  desc: JavaScript injector filename
  crit: notable
  conf: 0.8
  for: [javascript, typescript]
  if:
    type: path
    basename: true
    regex: '(?i)(^|[\\/])inject\.(c?js|mjs)$'
- id: postinstall-notify-js
  desc: postinstall runs notify.js script
  crit: suspicious
  conf: 0.96
  attack: "T1195.002"
  if:
    type: value
    path: "scripts.postinstall"
    substr: "notify.js"
- id: postinstall-notify-js-path
  desc: postinstall runs notify.js with path
  crit: suspicious
  conf: 0.94
  attack: "T1195.002"
  if:
    type: value
    path: "scripts.postinstall"
    regex: "node\\s+[^\"\\n]{0,50}notify\\.js"
  # === Test Script Abuse ===
      # Detect test scripts that perform network exfil instead of testing
- id: script-hidden-file-1
  desc: Script hidden file (base)
  crit: notable
  conf: 0.75
  if:
    type: value
    path: "scripts"
    regex: "\"(preinstall|postinstall|install)\":\".{0,220}/\\.[ac-z]"
  unless:
  # Build pipelines commonly place generated CSS/assets below a dot-prefixed
  # scratch directory. That is not hidden-payload staging when the same hook
  # creates the directory and invokes a stylesheet/build tool for the output.
  - type: value
    path: "scripts[*]"
    regex: '(?i)(mkdir|sass)[^\n]{0,160}/\.tmp(?:/|\s|$)'
- id: script-tmp-dir
  desc: Script uses /tmp directory
  crit: notable
  conf: 0.7
  if:
    type: value
    path: "scripts.preinstall"
    substr: "/tmp/"
- id: silent-npm-lifecycle-dropper
  desc: Silent npm lifecycle command execution
  crit: suspicious
  conf: 0.95
  for: [package.json, javascript]
  if:
    type: text
    regex: '(?i)"(pre|post)install"[^"\n]{0,200}\b(node|bun|npx)\b[^"\n]{0,200}/dev/null'
  unless:
  - type: value
    path: "scripts.preinstall"
    exact: ":; (node ./preinstall.js > /dev/null 2>&1 || true)"
  - id: micro-behaviors/process/exit/terminate::js-process-exit-zero
  - id: objectives/supply-chain/install-hook/hook-only::installation-method-deb
  - id: metadata/package/freeform::npm-template-manifest-placeholder
  - id: micro-behaviors/process/interpreter/node::node-eval-require-probe
      # Canonical native-module rebuilders legitimately silence stderr in a
      # postinstall (electron-rebuild -f -w … 2>/dev/null; exit 0). Not a dropper.
  - type: text
    regex: '(electron-rebuild|node-gyp-build|prebuild-install|node-pre-gyp)'
  - type: text
    regex: 'node-gyp\s+(rebuild|configure|build)'
composite_rules:
- id: script-hidden-file
  desc: Script references hidden file
  crit: notable
  conf: 0.75
  unless:
  - id: well-known/tool/development/vscode-extension/atlascode/
  - id: metadata/package/scripts/build::pkg-prepack-removes-dotgitignore
  - id: objectives/supply-chain/install-hook/scripts/credential::script-credential-dotfile
  - id: well-known/app/infrastructure/dokku::dokku-source-tree
  any:
  - id: script-hidden-file-1
- id: postinstall-missing-init-js-payload
  desc: postinstall references missing init.js payload
  crit: suspicious
  conf: 0.98
  attack: "T1195.002"
  scope: outer
  for: [package.json, npm, tar]
  all:
  - id: postinstall-runs-init-js
  - id: metadata/package/files/package-json::files-array-present
  unless:
  - id: objectives/supply-chain/install-hook/scripts/hook-file::init-js-filename
  - id: metadata/package/files/package-json::files-list-init-js
# Dead-hook staging: a lifecycle hook runs a conventional companion loader
# (`node install.js`, ...) while the published archive omits that member — the
# hook names a payload that is not there to run. Covers every hook key and
# loader name the companion atoms recognize, plus the existing init.js atom.
# Suspicious only — with the payload absent there is no hostile behavior to
# detect, and a dangling hook alone can be a packaging bug.
- id: install-hook-missing-companion-loader
  desc: Install hook references a missing companion loader
  crit: suspicious
  conf: 0.97
  attack: "T1195.002"
  scope: outer
  for: [package.json, npm, tar, javascript]
  # The hook and the files list must come from the SAME manifest (the
  # pairing is file-scoped): outer scope pools every vendored package.json
  # in an application bundle, and a vendor-pruned hook (ssh2 in VSCodium,
  # whose install.js is stripped at build time) would otherwise borrow an
  # unrelated package's files list and read as dead-hook staging.
  all:
  - id: objectives/supply-chain/install-hook/scripts/hook-file::companion-loader-hook-with-files-list
  unless:
  - id: objectives/supply-chain/install-hook/scripts/hook-file::hook-script-filename
  - id: objectives/supply-chain/install-hook/scripts/hook-file::init-js-filename
  - id: metadata/package/files/package-json::files-list-companion-loader
- id: tiny-postinstall-missing-init-js-loader
  desc: Tiny package ships dead postinstall init.js loader
  crit: hostile
  conf: 0.985
  attack: "T1195.002"
  all:
  - id: postinstall-missing-init-js-payload
  - id: metadata/package/freeform::pkg-skeleton-small
  - id: objectives/supply-chain/hidden-payload/staging::no-build-script
  any:
  - id: metadata/package/dependencies/manifest/presence::npm-no-runtime-dependencies
  - id: metadata/package/dependencies/manifest/presence::npm-no-deps-at-all
- id: postinstall-missing-init-js-runtime-stub
  desc: Runtime-empty package ships dead postinstall init.js loader
  crit: hostile
  conf: 0.99
  attack: "T1195.002"
  all:
  - id: postinstall-missing-init-js-payload
  - id: metadata/package/dependencies/manifest/presence::npm-no-runtime-dependencies
- id: scoped-postinstall-dead-init-loader
  desc: Scoped package ships dead postinstall init.js loader
  crit: hostile
  conf: 0.99
  attack: "T1195.002"
  all:
  - id: postinstall-missing-init-js-payload
  - id: metadata/package/name/vocabulary::scoped-package-name
- id: postinstall-ssh-credential-dump
  desc: postinstall dumps SSH credential files
  crit: hostile
  conf: 0.99
  attack: "T1552.004"
  mbc: "E1552"
  all:
  - id: objectives/supply-chain/install-hook/scripts/declaration::has-postinstall
  - id: objectives/supply-chain/install-hook/scripts/credential::postinstall-ssh-key-dump-pipeline
  any:
  - id: micro-behaviors/fs/path/private-key::keys
  - id: objectives/supply-chain/install-hook/scripts/credential::postinstall-find-dot-ssh
  - id: objectives/supply-chain/install-hook/scripts/credential::postinstall-xargs-cat
- id: preinstall-local-script-oob
  desc: Preinstall script prepares host-identity OOB callback
  crit: hostile
  conf: 0.96
  attack: "T1195.002"
  mbc: "E1041"
  for: [npm, package.json, javascript]
  scope: archive
  all:
  - id: preinstall-runs-node-local-script
  - id: objectives/exfiltration/oob/system-profile::node-oast-host-callback
  unless:
  - id: well-known/app/ai/coding-agent/omnius/

- id: postinstall-webhook-notify
  desc: postinstall notify script posts to webhook.site
  crit: hostile
  conf: 0.97
  attack: "T1195.002,T1041"
  for: [package.json, javascript, zip]
  scope: archive
  all:
  - id: postinstall-notify-js
  - id: objectives/exfiltration/oob/endpoint::webhook-site-uuid-path
