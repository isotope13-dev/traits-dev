# Install hooks that run a script file shipped in the package.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: postinstall-runs-ts-node-local-script
  desc: postinstall runs local ts-node script
  crit: suspicious
  conf: 0.96
  attack: "T1195.002"
  if:
    type: value
    path: "scripts.postinstall"
    regex: "^ts-node\\s+(\\./)?[A-Za-z0-9_./-]{1,80}\\.(js|ts)$"
  unless:
  - type: value
    path: "scripts.postinstall"
    substr: "node_modules/"
  - type: value
    path: "scripts.postinstall"
    substr: "--transpile-only"
- id: preinstall-runs-shell-local-script
  desc: preinstall runs local shell script
  crit: notable
  conf: 0.95
  attack: "T1195.002"
  if:
    type: value
    path: "scripts.preinstall"
    regex: "^(bash|sh)\\s+(\\./)?[A-Za-z0-9_./-]{1,120}\\.sh$"
  unless:
  - id: metadata/package/files/dependency::node-modules-path
  - id: well-known/lib/runtime/scripted/electron::electron-app-bundle-exception
- id: postinstall-runs-inject-js
  desc: postinstall runs injector script
  crit: suspicious
  conf: 0.97
  attack: "T1195.002"
  if:
    type: value
    path: "scripts.postinstall"
    regex: "^node\\s+(\\./)?scripts/inject\\.(c?js|mjs)$"
  unless:
  - id: metadata/package/files/dependency::node-modules-path
- id: postinstall-notify-js
  desc: postinstall runs notify.js script
  crit: suspicious
  conf: 0.96
  attack: "T1195.002"
  if:
    type: value
    path: "scripts.postinstall"
    substr: "notify.js"
- id: postinstall-notify-js-path
  desc: postinstall runs notify.js with path
  crit: suspicious
  conf: 0.94
  attack: "T1195.002"
  if:
    type: value
    path: "scripts.postinstall"
    regex: "node\\s+[^\"\\n]{0,50}notify\\.js"
  # === Test Script Abuse ===
      # Detect test scripts that perform network exfil instead of testing
- id: script-tmp-dir
  desc: Script uses /tmp directory
  crit: notable
  conf: 0.7
  if:
    type: value
    path: "scripts.preinstall"
    substr: "/tmp/"
composite_rules:
- id: install-sh-hook-missing-payload
  desc: Install hook references install.sh omitted from package contents
  crit: suspicious
  conf: 0.98
  attack: "T1195.002"
  scope: outer
  for: [package.json, npm, tar]
  all:
  - id: micro-behaviors/os/package-manager/hook-install::npm-install-local-shell-script-command
  - id: micro-behaviors/os/package-manager/hook-install::install-hook-omits-companion-from-files-list
  unless:
  - id: metadata/package/files/package-json::files-list-install-sh-loader
- id: tiny-hollow-missing-install-sh-hook
  desc: Tiny hollow npm package invokes an unpublished install shell script
  crit: hostile
  conf: 0.97
  attack: "T1195.002"
  for: [package.json, npm, tar, javascript]
  scope: archive
  all:
  - id: install-sh-hook-missing-payload
  - id: metadata/package/entrypoint::has-index-entry
  - id: metadata/file/profile/function-population::constant-return-function-ratio-half
  - id: metadata/package/files/package-json::files-array-present
# The omission alone can be a broken release, so it stays suspicious.
# Hostile only when the unpublished ./install.sh also has no declared
# source and no build step that could have produced it.
- id: unpublished-install-sh-loader-without-source
  desc: Unpublished install.sh loader lacks source and build metadata
  crit: hostile
  conf: 0.97
  attack: "T1195.002"
  for: [npm, package.json]
  scope: archive
  all:
  - id: install-sh-hook-missing-payload
  - id: metadata/package/repository::no-repo-with-hooks
  unless:
  - id: metadata/package/scripts/build::declares-build-stage-script
- id: script-hidden-file
  desc: Script references hidden file
  crit: notable
  conf: 0.75
  unless:
  - id: well-known/tool/development/vscode-extension/atlascode/
  - id: metadata/package/scripts/build::pkg-prepack-removes-dotgitignore
  - id: objectives/supply-chain/install-hook/scripts/credential::script-credential-dotfile
  - id: well-known/app/infrastructure/dokku::dokku-source-tree
  any:
  - id: micro-behaviors/fs/path/location::npm-install-hook-dot-path
- id: postinstall-missing-init-js-payload
  desc: postinstall references missing init.js payload
  crit: suspicious
  conf: 0.98
  attack: "T1195.002"
  scope: outer
  for: [package.json, npm, tar]
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-runs-init-js
  - id: metadata/package/files/package-json::files-array-present
  unless:
  - id: objectives/supply-chain/install-hook/scripts/hook-file::init-js-filename
  - id: metadata/package/files/package-json::files-list-init-js
- id: tiny-postinstall-missing-init-js-loader
  desc: Tiny package ships dead postinstall init.js loader
  crit: hostile
  conf: 0.985
  attack: "T1195.002"
  all:
  - id: postinstall-missing-init-js-payload
  - id: metadata/package/freeform::pkg-skeleton-small
  - id: objectives/supply-chain/hidden-payload/staging/loader::no-build-script
  any:
  - id: metadata/package/dependencies/manifest/presence::npm-no-runtime-dependencies
  - id: metadata/package/dependencies/manifest/presence::npm-no-deps-at-all
- id: postinstall-missing-init-js-runtime-stub
  desc: Runtime-empty package ships dead postinstall init.js loader
  crit: hostile
  conf: 0.99
  attack: "T1195.002"
  all:
  - id: postinstall-missing-init-js-payload
  - id: metadata/package/dependencies/manifest/presence::npm-no-runtime-dependencies
- id: scoped-postinstall-dead-init-loader
  desc: Scoped package ships dead postinstall init.js loader
  crit: hostile
  conf: 0.99
  attack: "T1195.002"
  all:
  - id: postinstall-missing-init-js-payload
  - id: metadata/package/name/vocabulary::scoped-package-name
- id: postinstall-ssh-credential-dump
  desc: postinstall dumps SSH credential files
  crit: hostile
  conf: 0.99
  attack: "T1552.004"
  mbc: "E1552"
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: objectives/supply-chain/install-hook/scripts/credential::postinstall-ssh-key-dump-pipeline
  any:
  - id: micro-behaviors/fs/path/private-key::keys
  - id: objectives/supply-chain/install-hook/scripts/credential::postinstall-find-dot-ssh
  - id: objectives/supply-chain/install-hook/scripts/credential::postinstall-xargs-cat
- id: preinstall-shell-obfuscated-curl-exfil
  desc: Preinstall shell script obfuscated curl POST exfil
  crit: hostile
  conf: 0.97
  attack: "T1195.002,T1041"
  mbc: "E1041"
  for: [npm, package.json, shell]
  scope: archive
  all:
  - id: preinstall-runs-shell-local-script
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: micro-behaviors/communications/http/curl::sh-letter-var-http-client-rebuild
  - id: micro-behaviors/communications/http/curl::sh-curl-post-backtick-data
  - id: micro-behaviors/communications/url/reference::shell-http-url-reference

- for:
  - package.json
  - javascript
  - zip
  - npm
  - tar
  id: postinstall-webhook-notify
  desc: postinstall notify script posts to webhook.site
  crit: hostile
  conf: 0.97
  attack: T1195.002,T1041
  scope: archive
  all:
  - id: postinstall-notify-js
  - id: micro-behaviors/communications/http/url/endpoint::webhook-site-uuid-path

- id: preinstall-sh-js-webhook-gist-remote-stager
  desc: Preinstall sh on JS beacons webhook and runs gist shell
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1059.004,T1102
  for: [npm, tar, package.json, javascript, shell]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: micro-behaviors/os/package-manager/hook-install::npm-preinstall-runs-sh-bundled-js
  - id: micro-behaviors/communications/http/url/endpoint::webhook-site-uuid-path
  - id: micro-behaviors/communications/http/services/github::github-gist-api-url
  - id: micro-behaviors/process/create/shell/spawn::js-dollar-paren-curl-substitution

- id: postinstall-hook-script-http-ip-callback-file
  desc: Lifecycle hook script HTTP GETs literal IP URL
  crit: suspicious
  conf: 0.94
  attack: T1195.002,T1041
  scope: file
  for: [javascript, typescript]
  all:
    - id: metadata/package/files/lifecycle::install-js-basename
    - id: micro-behaviors/communications/http/get::node-http-get-reference
    - id: micro-behaviors/communications/ip/literal::http-ip-url

- id: postinstall-hook-script-http-ip-profile-post-file
  desc: Lifecycle hook script POSTs host profile to IP URL
  crit: hostile
  conf: 0.96
  attack: T1195.002,T1041,T1082
  mbc: E1041
  scope: file
  for: [javascript, typescript]
  all:
    - id: micro-behaviors/communications/ip/literal::http-ip-url
    - id: micro-behaviors/os/sysinfo/hostname::node-inline-os-hostname-call
    - id: micro-behaviors/fs/path/self::script-directory-install-path-field
    - id: micro-behaviors/communications/http/request/dynamic::node-scheme-selected-http-post-body
  any:
    - id: metadata/package/files/lifecycle::install-js-basename
    - id: metadata/package/files/included::beacon-js-basename

- id: postinstall-hook-script-encoded-ip-callback-file
  desc: Lifecycle hook script URI-encodes and HTTP GETs IP
  crit: suspicious
  conf: 0.94
  attack: T1195.002,T1041
  scope: file
  for: [javascript, typescript]
  all:
    - id: metadata/package/files/lifecycle::install-js-basename
    - id: micro-behaviors/data/encode/url::encode-uri-component-call
    - id: micro-behaviors/communications/http/get::node-http-get-reference
    - id: micro-behaviors/communications/ip/literal::http-ip-url

- id: postinstall-hook-script-http-ip-post-callback-file
  desc: Lifecycle hook script POSTs JSON to literal IP
  crit: suspicious
  conf: 0.95
  attack: T1195.002,T1041
  scope: file
  for: [javascript, typescript]
  all:
    - id: metadata/package/files/lifecycle::install-js-basename
    - id: micro-behaviors/communications/ip/literal::http-ip-url
    - id: micro-behaviors/communications/http/request/verb::post-method-text
    - id: micro-behaviors/data/serialize/json::json-stringify-call
    - id: micro-behaviors/communications/http/request/body::node-http-request-stream-body
  any:
    - id: micro-behaviors/os/sysinfo/hostname::node-inline-os-hostname-call
    - id: micro-behaviors/fs/directory/cwd::process-cwd-call

- id: postinstall-hook-script-credential-theft-file
  desc: Lifecycle hook script targets stored credentials
  crit: suspicious
  conf: 0.88
  attack: T1195.002,T1552
  scope: file
  for: [javascript, typescript]
  all:
    - id: metadata/package/files/lifecycle::install-js-basename
  any:
    - id: micro-behaviors/fs/read/file/full::history-reference-with-file-read
    - id: objectives/credential-access/env/dotenv::dotenv-credentials-theft
    - id: micro-behaviors/fs/path/config/app::ssh-config-path-reference
    - id: objectives/credential-access/shell/history::powershell-history-theft
# The genuine `path` package is a pure library: it has no lifecycle script. A
# package that describes itself as the Node.js path module, points `main` at
# path.js, pulls in unrelated network and shell helpers, and runs a local Node
# file on install is using the name to look like a stdlib polyfill while it
# executes code at install time.
- id: npm-path-masquerade-runs-install-script
  desc: Path-module masquerade runs a postinstall script
  crit: hostile
  conf: 0.97
  attack: T1195.002,T1204.002
  for: [npm, tar, package.json]
  scope: outer
  all:
  - id: objectives/supply-chain/impersonation/core-module::npm-path-module-masquerade
  - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
  # The named script must ship in the archive. A hook whose target is absent
  # runs nothing (dead-hook staging); the suspicious masquerade covers it.
  - id: metadata/package/files/included::npm-runtime-code-member
  unless:
  - id: metadata/package/dependencies/manifest/reconciliation::npm-phantom-runtime-dependency
  - id: metadata/package/scripts/lifecycle::npm-postinstall-console-log-only
  - id: metadata/package/scripts/lifecycle::npm-inert-postinstall-script
