# npm `scripts.install` presence — context for install-hook composites.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002
traits:
  - id: install
    desc: Package declares npm install lifecycle hook
    crit: notable
    conf: 0.82
    unless:
      - id: metadata/package/files/dependency::node-modules-path
      - id: metadata/package/scripts/lifecycle::npm-install-native-addon-build
      - id: metadata/package/completeness::npm-tree-sitter-grammar-install
      - id: metadata/package/completeness::npm-source-native-addon-wrapper
      - id: well-known/lib/development/tree-sitter-grammar-npm::tree-sitter-grammar-npm-package
    if:
      type: value
      path: scripts.install
      regex: '\S'
