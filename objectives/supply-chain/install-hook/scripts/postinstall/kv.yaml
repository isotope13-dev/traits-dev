defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002

traits:
- id: curl-pipe-shell
  desc: postinstall pipes curl output to shell
  crit: suspicious
  conf: 0.96
  attack: T1105
  if:
    type: value
    path: scripts.postinstall
    regex: "\\bcurl\\b[^\"\\n]{0,120}\\|\\s*(sh|bash)\\b"
  unless:
    - id: well-known/tool/detection/agent-audit-kit::scanner-context
- id: wget-pipe-shell
  desc: postinstall pipes wget output to shell
  crit: suspicious
  conf: 0.96
  attack: T1105
  if:
    type: value
    path: scripts.postinstall
    regex: "\\bwget\\b[^\"\\n]{0,120}\\|\\s*(sh|bash)\\b"
- id: curl-pipe-node
  desc: postinstall pipes curl output to Node
  crit: suspicious
  conf: 0.95
  attack: T1105
  if:
    type: value
    path: scripts.postinstall
    regex: "\\bcurl\\b[^\"\\n]{0,120}\\|\\s*node\\b"
- id: wget-pipe-node
  desc: postinstall pipes wget output to Node
  crit: suspicious
  conf: 0.95
  attack: T1105
  if:
    type: value
    path: scripts.postinstall
    regex: "\\bwget\\b[^\"\\n]{0,120}\\|\\s*node\\b"
- id: inline-node-network
  desc: postinstall runs inline Node network code
  crit: suspicious
  conf: 0.96
  if:
    type: value
    path: scripts.postinstall
    regex: "\\bnode\\s+-e\\b[^\"\\n]{0,180}https?://"
- id: network-command-substitution
  desc: 'network command substitution'
  crit: suspicious
  conf: 0.97
  attack: T1041
  if:
    type: value
    path: scripts.postinstall
    regex: "https?://[^\"'\\s]{0,180}\\$\\("
- id: curl-http-post
  desc: postinstall sends HTTP POST via curl
  crit: suspicious
  conf: 0.8
  attack: T1041
  if:
    type: value
    path: scripts.postinstall
    regex: "\\bcurl\\b[^\"\\n]{0,200}((-X\\s*|--request\\s+)POST|--data[\\w-]*|\\s-d\\b)"
- id: eval-word
  desc: postinstall invokes eval
  crit: suspicious
  conf: 0.92
  attack: T1027
  # Hyphen-excluded on both sides so the interpreter flag spellings do not
  # count: `node --input-type=module --eval "<inline script>"` runs a script
  # that is written out in the manifest, and `webpack --devtool eval-source-map`
  # names a source-map mode. Neither evaluates a constructed string, which is
  # what the shell builtin `eval "$(...)"` and a JS `eval(...)` call do.
  if:
    type: value
    path: scripts.postinstall
    regex: "(^|[^-\\w])eval([^-\\w]|$)"
- id: base64-decode
  desc: postinstall decodes base64
  crit: suspicious
  conf: 0.9
  attack: T1027
  if:
    type: value
    path: scripts.postinstall
    regex: "\\bbase64\\s+(-d|--decode)\\b"
- id: atob-decode
  desc: postinstall uses atob decode
  crit: suspicious
  conf: 0.9
  attack: T1027
  if:
    type: value
    path: scripts.postinstall
    substr: atob
- id: buffer-from
  desc: postinstall uses Buffer.from
  crit: suspicious
  conf: 0.9
  attack: T1027
  if:
    type: value
    path: scripts.postinstall
    substr: Buffer.from
- id: temp-path
  desc: postinstall references temp path
  crit: suspicious
  conf: 0.9
  attack: T1564
  if:
    type: value
    path: scripts.postinstall
    regex: "(/tmp/|\\$TMPDIR|%TEMP%)"
- id: inline-host-identity-recon
  desc: postinstall runs inline host recon
  crit: notable
  conf: 0.98
  attack: T1082,T1033
  if:
    type: value
    path: scripts.postinstall
    regex: "execSync\\([^)]{0,160}\\bid\\b.{0,100}\\bhostname\\b"
- id: compromise-marker-output
  desc: postinstall writes compromise marker
  crit: notable
  conf: 0.98
  if:
    type: value
    path: scripts.postinstall
    case_insensitive: true
    # Classic `pwned.txt` markers plus install-time proof-of-exec beacons that
    # land under a temp path whose components advertise compromise (`PWN_…`,
    # `…/FIRED`). Self-labeled "security tests" use the same shape.
    regex: "/tmp/.{0,40}(\\bpwn|hacked|compromised|[/\\\\]fired)"
- id: postinstall-writefilesync-abs-tmp
  desc: postinstall writeFileSync to absolute temp path
  crit: suspicious
  conf: 0.96
  attack: T1564,T1059.007
  if:
    type: value
    path: scripts.postinstall
    regex: "writeFileSync\\s*\\(\\s*['\"](/tmp/|\\$TMPDIR|%TEMP%)"
- id: postinstall-inline-node-tmp-write
  desc: postinstall inline node writes temp file
  crit: suspicious
  conf: 0.96
  attack: T1059.007,T1564
  if:
    type: value
    path: scripts.postinstall
    regex: "node\\s+(-e|--eval).{0,200}writeFileSync\\([^)]{0,60}(/tmp/|\\$TMPDIR|%TEMP%)"
# Virtio block major 252 + fabricated /tmp/vdaN nodes are the container-escape
# probe used by the simple-date-formatter-* npm campaign (and cousins): create a
# host disk node from inside the container namespace, then mount/list it.
- id: mknod-virtio-block
  desc: postinstall mknod virtio block device
  crit: suspicious
  conf: 0.96
  attack: T1611
  if:
    type: value
    path: scripts.postinstall
    regex: "\\bmknod\\s+/tmp/[^\\s\"']{1,40}\\s+b\\s+252\\s+[0-9]+"
- id: mount-tmp-hostroot
  desc: postinstall mounts tmp device on hostroot
  crit: suspicious
  conf: 0.95
  attack: T1611
  if:
    type: value
    path: scripts.postinstall
    regex: "\\bmount\\s+(-[a-zA-Z]+\\s+){0,3}/tmp/[^\\s\"']{1,40}\\s+/tmp/hostroot\\b"
- id: hostroot-kube-recon
  desc: postinstall lists hostroot kubernetes paths
  crit: suspicious
  conf: 0.94
  attack: T1613
  if:
    type: value
    path: scripts.postinstall
    regex: "/tmp/hostroot/(etc/kubernetes|var/lib/kubelet/pods)"
- id: serviceaccount-token-read
  desc: postinstall reads serviceaccount token
  crit: suspicious
  conf: 0.95
  attack: T1552.007
  if:
    type: value
    path: scripts.postinstall
    substr: "/var/run/secrets/kubernetes.io/serviceaccount/token"
- id: curl-stdin-body-post
  desc: postinstall sends piped stdin as HTTP body
  crit: notable
  conf: 0.9
  attack: T1041
  if:
    type: value
    path: scripts.postinstall
    # JSON escape decoding can place a literal newline inside an inline
    # `node -e` fragment before the shell pipeline reaches curl. Bound the
    # command by size rather than excluding newlines from the entire value.
    regex: "\\bcurl\\b[\\s\\S]{0,240}(-d|--data(-binary)?)\\s+@-"
- id: hidden-dot-path
  desc: postinstall references hidden dot path
  crit: notable
  conf: 0.9
  attack: T1564
  not:
    - substr: ./.git/hooks
  if:
    type: value
    path: scripts.postinstall
    regex: "(^|[\\s;&])~?/\\."

- id: postinstall-download-tool--curl
  desc: postinstall invokes curl or wget (curl)
  crit: component
  conf: 0.85
  if:
    type: value
    path: scripts.postinstall
    regex: \bcurl\b
  # An install-time hook that runs on the consumer's machine sending an HTTP
  # POST (explicit -X POST / --request POST, or a data-bearing -d/--data flag)
  # is the recon-exfil shape — install hooks legitimately download, but rarely
  # need to push a body outward. Author-side hooks (postpublish/prepublishOnly)
  # never reach this file, so a benign Netlify build-hook trigger is unaffected.
- id: postinstall-download-tool--wget
  desc: postinstall invokes curl or wget (wget)
  crit: component
  conf: 0.85
  if:
    type: value
    path: scripts.postinstall
    regex: \bwget\b
  # An install-time hook that runs on the consumer's machine sending an HTTP
  # POST (explicit -X POST / --request POST, or a data-bearing -d/--data flag)
  # is the recon-exfil shape — install hooks legitimately download, but rarely
  # need to push a body outward. Author-side hooks (postpublish/prepublishOnly)
  # never reach this file, so a benign Netlify build-hook trigger is unaffected.
composite_rules:
  # A postinstall hook whose fetched URL embeds a shell command substitution
  # (`curl https://…$(…)`) is conclusively exfil — no legitimate installer
  # interpolates command output into a URL. Mirrors the preinstall
  # `install-script-exfil` (all: network-exfil + download-tool) so it emits.
- id: postinstall-download-tool
  desc: postinstall invokes curl or wget
  crit: component
  conf: 0.85
  any:
  - id: postinstall-download-tool--curl
  - id: postinstall-download-tool--wget
- id: postinstall-network-exfil
  desc: postinstall exfiltrates command output to network endpoint
  crit: hostile
  conf: 0.97
  attack: T1041
  all:
  - id: network-command-substitution
  - id: postinstall-download-tool
- id: postinstall-inline-recon-compromise-marker
  desc: postinstall records victim identity in a compromise marker
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1059.004,T1082,T1033
  all:
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-hook-declaration
  - id: inline-host-identity-recon
  - id: compromise-marker-output
# Install-time write of a compromise/proof-of-exec marker under a temp path is
# itself the payload: the package exists to prove code ran on the installer host.
- id: postinstall-tmp-compromise-beacon
  desc: postinstall writes temp-path compromise beacon
  crit: hostile
  conf: 0.97
  attack: T1195.002,T1059.007,T1564
  all:
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-hook-declaration
  - id: postinstall-writefilesync-abs-tmp
  - id: compromise-marker-output
- id: postinstall-inline-node-tmp-compromise-beacon
  desc: postinstall inline node writes temp compromise beacon
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1059.007,T1564
  all:
  - id: postinstall-inline-node-tmp-write
  - id: compromise-marker-output
- id: download-execute
  desc: postinstall downloads and executes a script
  crit: suspicious
  conf: 0.97
  attack: T1105
  any:
  - id: curl-pipe-shell
  - id: wget-pipe-shell
  - id: curl-pipe-node
  - id: wget-pipe-node
- id: shell-obfuscation
  desc: postinstall uses shell obfuscation or inline evaluation
  crit: suspicious
  conf: 0.93
  attack: T1027
  any:
  - id: eval-word
  - id: base64-decode
  - id: atob-decode
  - id: buffer-from
- id: hidden-temp-path
  desc: postinstall stages hidden or temporary path
  crit: suspicious
  conf: 0.9
  attack: T1564
  any:
  - id: temp-path
  - id: hidden-dot-path
- id: postinstall-virtio-block-escape-probe
  desc: postinstall probes virtio block device escape
  crit: hostile
  conf: 0.98
  attack: T1611,T1613
  all:
  - id: mknod-virtio-block
  any:
  - id: mount-tmp-hostroot
  - id: hostroot-kube-recon
  - id: serviceaccount-token-read
- id: postinstall-virtio-escape-oast-exfil
  desc: postinstall virtio escape recon posts to OAST
  crit: hostile
  conf: 0.99
  attack: T1611,T1041,T1048.003
  all:
  - id: postinstall-virtio-block-escape-probe
  - id: objectives/supply-chain/recon-exfil/oast/env::oast-fun-url
  any:
  - id: curl-http-post
  - id: curl-stdin-body-post
- id: postinstall-oast-fun-stdin-exfil
  desc: postinstall pipes recon output to oast.fun
  crit: hostile
  conf: 0.98
  attack: T1041,T1048.003
  all:
  - id: objectives/supply-chain/recon-exfil/oast/env::oast-fun-url
  - id: curl-stdin-body-post
  any:
  - id: temp-path
  - id: serviceaccount-token-read
  - id: hostroot-kube-recon
  - id: mknod-virtio-block
