# Extensionless Node targets in lifecycle scripts are uncommon and conceal
# whether the hook runs a file or a directory entrypoint.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002,T1059.007

traits:
  - id: postinstall-runs-extensionless-node-target
    desc: postinstall runs extensionless Node target
    crit: suspicious
    conf: 0.92
    if:
      type: value
      path: "scripts.postinstall"
      regex: "^node\\s+(\\./)?[A-Za-z0-9_-]{1,64}$"
    unless:
      - id: metadata/package/files/dependency::node-modules-path
      - type: path
        regex: '\\.tgz$'
