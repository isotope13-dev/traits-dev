# Install hook that runs `node -e "try { require('pkg') } catch(e) {}"` to load
# a separately-shipped optional dependency while swallowing load failures. This
# is carved out of silent-npm-lifecycle-dropper and encoded-npm-cmd because it
# is a distinct decoy-carrier pattern (payload in optionalDependencies, often
# pinned to a mutable github: URL) rather than stderr redirection.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002

traits:
  - id: postinstall-silent-caught-require
    desc: postinstall swallows try/catch require
    crit: suspicious
    conf: 0.96
    if:
      type: value
      path: scripts.postinstall
      regex: 'try\s*\{\s*require\s*\([^)]+\)\s*\}\s*catch\s*\([^)]*\)\s*\{\s*\}'
    unless:
      - id: well-known/lib/runtime/core-js::package-identity

composite_rules:
  - id: postinstall-github-optional-silent-loader
    desc: postinstall loads github optional dependency silently
    crit: hostile
    conf: 0.97
    mbc: B0024
    for: [npm, archives]
    scope: archive
    all:
      - id: postinstall-silent-caught-require
      - id: metadata/package/dependencies/manifest::npm-github-protocol-optional-dependency
