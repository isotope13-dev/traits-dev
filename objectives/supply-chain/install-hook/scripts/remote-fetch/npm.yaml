# Install hooks that fetch something and run it.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: postinstall-pipe-node
  desc: postinstall pipes output to node
  crit: suspicious
  conf: 0.94
  attack: "T1195.002, T1059.007"
  if:
    type: value
    path: "scripts.postinstall"
    regex: "(^|[^|])\\|\\s*node\\b"
  unless:
  - id: metadata/package/files/dependency::node-modules-path
- id: postinstall-node-loader-pipe
  desc: postinstall node loader pipe
  crit: suspicious
  conf: 0.95
  attack: "T1195.002, T1059.007"
  if:
    type: value
    path: "scripts.postinstall"
    regex: "^node\\s+(\\./)?[A-Za-z0-9_.-]{1,80}\\s*\\|\\s*node\\b"
  unless:
  - id: metadata/package/files/dependency::node-modules-path
- id: preinstall-node-https-get
  desc: preinstall uses Node HTTPS GET
  crit: suspicious
  conf: 0.95
  attack: "T1041"
  if:
    type: value
    path: "scripts.preinstall"
    regex: "require\\([\"']https[\"']\\).{0,80}\\.get\\("
- id: preinstall-netcat-shell
  desc: preinstall uses netcat shell exec
  crit: suspicious
  conf: 0.97
  attack: "T1059.004"
  if:
    type: value
    path: "scripts.preinstall"
    substr: "nc -c sh"
- id: postinstall-global-floating-npm-install
  desc: Postinstall globally installs npm latest
  crit: suspicious
  conf: 0.98
  attack: "T1195.002,T1105"
  if:
    type: value
    path: "scripts.postinstall"
    regex: '\bnpm\s+install\s+-(g|global)\s+[^;&]{1,120}@latest\b'
composite_rules:
- id: download-execute-comp
  desc: npm script downloads and executes
  crit: suspicious
  conf: 0.95
  mbc: "B0024"
  attack: "T1105"
  unless:
  - id: well-known/lib/development/abaplint::core-benchmark-context
  - id: metadata/package/scripts/
  - id: metadata/package/files/dependency::node-modules-path
  - id: well-known/tool/sysadmin/alpine-packages/package::alpine-langfuse-package
  - id: well-known/tool/sysadmin/alpine-packages/package::datadog-libdatadog-package-json
  - id: well-known/tool/sysadmin/alpine-packages/package::datadog-libdatadog-package
  all:
  - id: micro-behaviors/communications/http/download/package::preinstall-download-tool
  - id: micro-behaviors/process/interpreter/pipeline::npm-preinstall-interpreter-pipe
        # Obfuscated script
- id: postinstall-node-pipe-exec
  desc: npm postinstall pipes generated code into node
  crit: hostile
  conf: 0.96
  attack: "T1195.002, T1059.007"
  mbc: "B0024"
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: postinstall-node-loader-pipe
  any:
  - id: postinstall-pipe-node
  - id: objectives/supply-chain/install-hook/scripts/import-chain::scripts-postinstall-executor
- id: postinstall-curl-wget-pipe-node-exec
  desc: npm postinstall pipes curl or wget into node
  crit: hostile
  conf: 0.98
  attack: "T1195.002, T1059.007, T1105"
  mbc: "B0024"
  for: [npm, tar, package.json]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  any:
  - id: objectives/supply-chain/install-hook/scripts/postinstall::curl-pipe-node
  - id: objectives/supply-chain/install-hook/scripts/postinstall::wget-pipe-node
- id: preinstall-curl-wget-pipe-node-exec
  desc: npm preinstall pipes curl or wget into node
  crit: hostile
  conf: 0.98
  attack: "T1195.002, T1059.007, T1105"
  mbc: "B0024"
  for: [npm, tar, package.json]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: micro-behaviors/process/interpreter/node::npm-preinstall-stdin-pipe
  any:
  - id: micro-behaviors/communications/http/curl::npm-preinstall-curl
  - id: micro-behaviors/communications/http/download/wget::npm-preinstall-wget
  unless:
  # RFC 2606 documentation domains are non-routable: no remote code can be fetched.
  - id: micro-behaviors/communications/url/host::reserved-docs-domain-npm-script
- id: npm-repo-mismatch-preinstall-remote-pipe-exec
  desc: Foreign repo claim with preinstall curl pipe to node
  crit: hostile
  conf: 0.99
  attack: "T1195.002,T1105,T1059.007"
  mbc: "B0024"
  for: [npm, tar, package.json]
  scope: archive
  all:
  - id: metadata/package/repository::npm-name-repo-mismatch
  - id: preinstall-curl-wget-pipe-node-exec
- id: postinstall-pipe-pastebin-loader
  desc: npm postinstall pipes Pastebin loader into node
  crit: hostile
  conf: 0.97
  attack: "T1195.002,T1059.007,T1102"
  mbc: "B0024,C0002"
  for: [npm, tar, package.json, javascript, shell]
  scope: archive
  all:
  - id: postinstall-node-pipe-exec
  - id: micro-behaviors/communications/http/services/file-hosting::pastebin
- id: npm-install-hook-remote-deno-stage
  for: [npm, package.json, javascript]
  desc: npm install hook detaches unrestricted remote Deno stage
  crit: hostile
  conf: 0.99
  scope: archive
  attack: T1195.002,T1105,T1059.007,T1480
  all:
  - id: metadata/package/scripts/lifecycle::has-install-script
  - id: objectives/supply-chain/install-hook/scripts/local-script::install-runs-node-local-script
  - id: objectives/supply-chain/install-hook/scripts/hook-file::install-hook-detached-child-launch
  - id: objectives/command-and-control/dropper/standalone::js-remote-deno-run-all-permissions
- id: preinstall-netcat-reverse-shell
  desc: preinstall launches netcat reverse shell
  crit: hostile
  conf: 0.99
  mbc: "B0022"
  attack: "T1059.004"
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: preinstall-netcat-shell
  - id: objectives/supply-chain/install-hook/scripts/host-profile::preinstall-external-ip
  - id: objectives/supply-chain/install-hook/scripts/host-profile::preinstall-ip-port-endpoint
- id: npm-preinstall-dev-tcp-reverse-shell
  desc: Preinstall launches Bash dev-tcp reverse shell
  crit: hostile
  conf: 0.99
  mbc: "B0030"
  attack: "T1195.002,T1059.004,T1095"
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: objectives/supply-chain/install-hook/scripts/host-profile::preinstall-external-ip
  - id: objectives/command-and-control/reverse-shell/dev-tcp::reverse-shell-shell-complete
- id: preinstall-temp-fetch-chmod-exec
  desc: preinstall stages temp payload then executes it
  crit: suspicious
  conf: 0.96
  attack: "T1195.002"
  for: [shell]
  all:
  - id: micro-behaviors/communications/http/download/github::github-raw-mutable-fetch
  - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
  - id: micro-behaviors/fs/path/temp::temp-var-tmp
  any:
  - id: micro-behaviors/process/create/script/file::shell-script-execution-any
  - id: micro-behaviors/process/daemonize/detach::nohup-hidden-output
  - id: micro-behaviors/process/create/spawn::detached-true
- id: npm-postinstall-reverse-shell
  desc: npm postinstall hook launches a socket reverse shell
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1059.007,T1095
  mbc: B0030.002
  for: [npm, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: objectives/command-and-control/reverse-shell/stream-bridge::js-reverse-shell-spawn
