defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, npm, tar]

composite_rules:
- id: npm-preinstall-mshta-remote-stage
  desc: npm preinstall with remote MSHTA clues
  crit: suspicious
  conf: 0.995
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: metadata/lang/source/syntax/command/invocation::mshta-remote-url-command
  any:
  - id: micro-behaviors/process/create/exec::js-child-process
  - id: micro-behaviors/os/module/require::child-process-require
