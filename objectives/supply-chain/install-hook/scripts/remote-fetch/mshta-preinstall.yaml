defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, npm, tar]

composite_rules:
- id: npm-preinstall-mshta-remote-stage
  desc: npm preinstall with remote MSHTA clues
  crit: suspicious
  conf: 0.995
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/scripts/declaration::has-preinstall
  - id: objectives/execution/interpreter/script/mshta::mshta-remote-url
  any:
  - id: micro-behaviors/process/create/exec::exec-api-call
  - id: micro-behaviors/process/create/shell/bridge::child-process-require
