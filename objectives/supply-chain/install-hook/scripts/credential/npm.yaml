# Install hooks that read credential files -- SSH keys, dotfiles, .env.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: script-credential-dotfile
  desc: npm script references credential dotfile
  crit: notable
  conf: 0.9
  attack: "T1552.001"
  unless:
  - type: value
    path: "scripts[*]"
    regex: '(?i)docker\s+buildx?\s+build\b[^"\n]{0,400}--secret\s+'
  if:
    type: value
    path: "scripts[*]"
    regex: '[/~]?\.(npmrc|pypirc|netrc)\b'
- id: postinstall-find-dot-ssh
  desc: postinstall enumerates ~/.ssh
  crit: suspicious
  conf: 0.96
  attack: "T1552.004"
  if:
    type: value
    path: "scripts.postinstall"
    regex: "\\bfind\\s+~/?\\.ssh\\b"
- id: postinstall-xargs-cat
  desc: postinstall pipes file list to cat
  crit: suspicious
  conf: 0.93
  attack: "T1552.004"
  if:
    type: value
    path: "scripts.postinstall"
    regex: "\\|\\s*xargs\\s+cat\\b"
- id: postinstall-ssh-key-dump-pipeline
  desc: postinstall dumps ~/.ssh files
  crit: suspicious
  conf: 0.98
  attack: "T1552.004"
  if:
    type: value
    path: "scripts.postinstall"
    regex: "\\bfind\\s+~/?\\.ssh\\b[^\\n|]{0,40}\\|\\s*xargs\\s+cat\\b"
composite_rules:
- id: npm-lifecycle-ssh-key-symlink
  desc: npm install hook symlinks SSH private key
  crit: hostile
  conf: 0.98
  attack: "T1195.002, T1552.004"
  for: [shell]
  all:
  - id: objectives/credential-access/ssh/key::ln-symlink-ssh-private-key
  - id: objectives/supply-chain/install-hook/scripts/declaration::lifecycle-script-basename
- id: postinstall-dotenv-http-exfil
  desc: npm postinstall exfiltrates dotenv credentials
  crit: hostile
  conf: 0.98
  attack: "T1195.002"
  for: [javascript, typescript]
  all:
  - id: objectives/supply-chain/install-hook/scripts/local-script::postinstall-js-file
  - id: objectives/exfiltration/stealer/credential/env::dotenv-http-post-exfil
