defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: runtime-clx-cookie-signature-install
  desc: runtime clx cookie sig install
  crit: suspicious
  conf: 0.99
  attack: T1195.002
  if:
    type: string_literal
    regex: npm\s+install\s+clx-cookie-signature(\s|$)
- id: node-tar-gzip-strip-extract
  desc: Node extracts gzipped tarball
  crit: notable
  conf: 0.9
  attack: T1195.002
  if:
    type: text
    regex: tar\s+-xzf[\s\S]{0,160}--strip-components=1
- id: node-tar-gzip-flag
  desc: Tar extraction uses gzip flag
  crit: component
  conf: 0.95
  if:
    type: string_literal
    exact: -xzf
- id: node-tar-strip-components-flag
  desc: Tar extraction strips archive directory
  crit: notable
  conf: 0.95
  if:
    type: string_literal
    exact: --strip-components=1
- id: node-downloaded-tgz-write
  desc: Node writes downloaded tgz
  crit: notable
  conf: 0.88
  attack: T1105
  if:
    type: text
    regex: writeFileSync\s*\([\s\S]{0,160}(Buffer\.concat\(chunks\)|["'][^"']{0,80}\.tgz["'])
- id: node-dynamic-require-destructure
  desc: Destructures export from dynamic require
  crit: notable
  conf: 0.9
  attack: T1059.007
  if:
    # A text regex also matches the pattern inside comments and string
    # literals (e.g. codemod utilities documenting or generating
    # `require(...)` calls). Tree-sitter only matches real destructuring
    # declarations, and (#eq?) binds the callee where regexes cannot.
    type: tree-sitter
    query: |
      ((variable_declarator
         name: (object_pattern)
         value: (call_expression
           function: (identifier) @req_function
           arguments: (arguments (identifier))))
       (#eq? @req_function "require"))
- id: encoded-npm-install
  desc: Base64-encoded npm install command
  crit: suspicious
  conf: 0.95
  attack: T1195.002
  size_max: 200000
  if:
    type: encoded
    encoding: base64
    word: npm install
  unless:
  - id: micro-behaviors/process/interpreter/vm/
  - id: well-known/lib/development/vscode-webview::acquire-vscode-api
  - id: metadata/file/format/structured::sourcemap-inline-base64
  - id: metadata/file/format/markup::astrojs-package-reference
- id: encoded-stealth-no-save
  desc: Encoded stealth flag --no-save
  crit: notable
  conf: 0.9
  attack: T1195.002
  if:
    type: encoded
    substr: --no-save
  unless:
  - id: metadata/file/format/structured::sourcemap-inline-base64
- id: encoded-stealth-silent
  desc: Encoded stealth flag --silent
  crit: notable
  conf: 0.9
  attack: T1195.002
  if:
    type: encoded
    substr: --silent
  unless:
  - id: metadata/file/format/structured::sourcemap-inline-base64
- id: encoded-stealth-no-audit
  desc: Encoded stealth flag --no-audit
  crit: notable
  conf: 0.9
  attack: T1195.002
  if:
    type: encoded
    substr: --no-audit
  unless:
  - id: metadata/file/format/structured::sourcemap-inline-base64
- id: api-install-package-call
  desc: Programmatic package install API call
  crit: notable
  conf: 0.85
  attack: T1195.002
  if:
    type: text
    regex: \.install\s*\(\s*["'][@a-z0-9][\w@/.-]{1,60}["']\s*,\s*\{
- id: install-opt-no-save-prop
  desc: Install option no-save hides from manifest
  crit: notable
  conf: 0.9
  attack: T1195.002
  if:
    type: text
    regex: '["'']no-save["'']\s*:\s*true'
- id: install-opt-silent-loglevel-prop
  desc: Install option silences npm log output
  crit: notable
  conf: 0.9
  attack: T1195.002
  if:
    type: text
    regex: loglevel\s*:\s*["']silent["']
- id: install-opt-no-warnings-prop
  desc: Install option suppresses warnings
  crit: notable
  conf: 0.88
  attack: T1195.002
  if:
    type: text
    regex: '["'']no-warnings["'']\s*:\s*true'
- id: install-opt-no-progress-prop
  desc: Install option hides progress output
  crit: notable
  conf: 0.86
  attack: T1195.002
  if:
    type: text
    regex: '["'']no-progress["'']\s*:\s*true'
- id: pkgmgr-aliased-as-npm
  desc: Third-party import aliased as npm
  crit: notable
  conf: 0.85
  attack: T1036
  if:
    type: text
    regex: \{\s*\w+\s*:\s*npm\s*\}\s*=\s*require
- id: npm-invoked-as-function
  desc: npm called as a programmatic function
  crit: notable
  conf: 0.8
  attack: T1195.002
  if:
    type: text
    regex: \bnpm\s*\(\s*\)\s*\.
- id: npm-cli-as-require-target
  desc: Imports the npm CLI as a library
  crit: notable
  conf: 0.82
  attack: T1195.002
  if:
    type: text
    regex: require\(\s*["']npm["']\s*\)|\bfrom\s+["']npm["']
- id: pkg-install-in-catch
  desc: Package install inside catch handler
  crit: notable
  conf: 0.88
  attack: T1195.002
  if:
    type: text
    regex: catch\s*\([^)]{0,20}\)\s*\{[\s\S]{0,150}\.install\s*\(
composite_rules:
- id: node-tar-gzip-strip-array
  desc: Node extracts gzipped tarball with tar flags
  crit: notable
  conf: 0.98
  attack: T1105
  all:
  - id: micro-behaviors/data/archive/extract/tar::node-spawn-tar-extract
  - id: node-tar-gzip-flag
  - id: node-tar-strip-components-flag
- id: runtime-npm-install-process-call
  desc: Runtime npm install through child process
  crit: notable
  conf: 0.95
  attack: T1059.007
  all:
  - id: micro-behaviors/process/create/system::js-execfile-call
  any:
  - id: micro-behaviors/os/package-manager/runtime-install::exec-npm-install
  - id: micro-behaviors/os/package-manager/runtime-install::exec-npm-install-array
  - id: micro-behaviors/os/package-manager/runtime-install::exec-npm-install-package
  unless:
  - id: well-known/tool/development/vscode-extension/zephyr-ide::zephyr-ide-extension
  - id: metadata/package/files/dependency::node-modules-path
# Invoking npm install at runtime is how CLIs and project bootstrappers
# install a requested package. Hidden or scripted abuse is the stealth and
# secondary-tgz composites, which keep their own criticality.
- id: runtime-npm-install-comp
  desc: Runtime code invokes npm install to modify dependencies
  crit: notable
  conf: 0.93
  attack: T1059.007
  all:
  - id: metadata/import/builtin::child-process-api-destructure
  any:
  - id: micro-behaviors/os/package-manager/runtime-install::exec-npm-install
  - id: micro-behaviors/process/create/shell/build::js-npm-install-alias-via-child-process
  - id: micro-behaviors/os/package-manager/runtime-install::exec-npm-install-package
  - id: micro-behaviors/process/create/shell/build::npm-install-save-command
  downgrade:
    any:
    - id: micro-behaviors/os/package-manager/runtime-install::npm-install-build-combo
    - id: micro-behaviors/process/interpreter/vm/
    - id: metadata/build/bundler/asset::js-large-module-bundle
  unless:
  - id: metadata/package/files/dependency::node-modules-path
  - id: well-known/app/ai/assistant/apliarte-ai::apliarte-ai-local-setup-context
  - id: micro-behaviors/process/create/shell/build::npm-install-production-command-literal
  - id: well-known/app/ai/coding-agent/agenthippo/
- id: stealth-runtime-npm-install
  desc: Runtime npm install uses stealth flags
  crit: hostile
  conf: 0.97
  attack: T1195.002,T1059.007
  mbc: B0024
  near_lines: 40
  all:
  - id: runtime-npm-install-comp
  any:
  - id: micro-behaviors/os/package-manager/runtime-install::npm-no-save-option
  - id: micro-behaviors/os/package-manager/runtime-install::npm-silent-loglevel-option
  - id: micro-behaviors/os/package-manager/runtime-install::npm-no-progress-option
  - id: micro-behaviors/process/create/spawn::windowshide-option
  needs: 2
  unless:
  - id: micro-behaviors/os/package-manager/runtime-install::npm-install-build-combo
  - id: micro-behaviors/process/interpreter/vm/
  - id: well-known/app/ai/coding-agent/agenthippo/
- id: secondary-tgz-npm-bootstrap
  desc: Secondary tgz npm bootstrap
  crit: hostile
  conf: 0.97
  attack: T1195.002,T1059.007,T1105
  mbc: B0024
  all:
