defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: runtime-clx-cookie-signature-install
  desc: runtime clx cookie sig install
  crit: suspicious
  conf: 0.99
  attack: T1195.002
  if:
    type: string_literal
    regex: npm\s+install\s+clx-cookie-signature(\s|$)
- id: node-downloaded-tgz-write
  desc: Node writes downloaded tgz
  crit: notable
  conf: 0.88
  attack: T1105
  if:
    type: text
    regex: writeFileSync\s*\([\s\S]{0,160}(Buffer\.concat\(chunks\)|["'][^"']{0,80}\.tgz["'])
- id: encoded-npm-install
  desc: Base64-encoded npm install command
  crit: suspicious
  conf: 0.95
  attack: T1195.002
  size_max: 200000
  if:
    type: encoded
    encoding: base64
    word: npm install
  unless:
  - id: micro-behaviors/process/interpreter/vm/
  - id: well-known/lib/development/vscode-webview::acquire-vscode-api
  - id: metadata/file/format/source-map::sourcemap-inline-base64
  - id: metadata/file/format/markup::astrojs-package-reference
  - id: base64-markdown-example-bundle
# Base64-only like the sibling encoded-npm-install leg: without it, any
# minified line carrying unrelated \uXXXX escapes Unicode-decodes wholesale
# and a plaintext "--no-save" argv nearby counts as "encoded stealth".
- id: encoded-stealth-no-save
  desc: Encoded stealth flag --no-save
  crit: notable
  conf: 0.9
  attack: T1195.002
  if:
    type: encoded
    encoding: base64
    substr: --no-save
  unless:
  - id: metadata/file/format/source-map::sourcemap-inline-base64
- id: encoded-stealth-silent
  desc: Encoded stealth flag --silent
  crit: notable
  conf: 0.9
  attack: T1195.002
  if:
    type: encoded
    encoding: base64
    substr: --silent
  unless:
  - id: metadata/file/format/source-map::sourcemap-inline-base64
- id: encoded-stealth-no-audit
  desc: Encoded stealth flag --no-audit
  crit: notable
  conf: 0.9
  attack: T1195.002
  if:
    type: encoded
    encoding: base64
    substr: --no-audit
  unless:
  - id: metadata/file/format/source-map::sourcemap-inline-base64
- id: api-install-package-call
  desc: Programmatic package install API call
  crit: notable
  conf: 0.85
  attack: T1195.002
  if:
    type: text
    regex: \.install\s*\(\s*["'][@a-z0-9][\w@/.-]{1,60}["']\s*,\s*\{
- id: install-opt-no-save-prop
  desc: Install option no-save hides from manifest
  crit: notable
  conf: 0.9
  attack: T1195.002
  if:
    type: text
    regex: '["'']no-save["'']\s*:\s*true'
- id: install-opt-silent-loglevel-prop
  desc: Install option silences npm log output
  crit: notable
  conf: 0.9
  attack: T1195.002
  if:
    type: text
    regex: loglevel\s*:\s*["']silent["']
- id: install-opt-no-warnings-prop
  desc: Install option suppresses warnings
  crit: notable
  conf: 0.88
  attack: T1195.002
  if:
    type: text
    regex: '["'']no-warnings["'']\s*:\s*true'
- id: install-opt-no-progress-prop
  desc: Install option hides progress output
  crit: notable
  conf: 0.86
  attack: T1195.002
  if:
    type: text
    regex: '["'']no-progress["'']\s*:\s*true'
- id: pkgmgr-aliased-as-npm
  desc: Third-party import aliased as npm
  crit: notable
  conf: 0.85
  attack: T1036
  if:
    type: text
    regex: \{\s*\w+\s*:\s*npm\s*\}\s*=\s*require
- id: npm-invoked-as-function
  desc: npm called as a programmatic function
  crit: notable
  conf: 0.8
  attack: T1195.002
  if:
    type: text
    regex: \bnpm\s*\(\s*\)\s*\.
- id: npm-cli-as-require-target
  desc: Imports the npm CLI as a library
  crit: notable
  conf: 0.82
  attack: T1195.002
  if:
    type: text
    regex: require\(\s*["']npm["']\s*\)|\bfrom\s+["']npm["']
# Invoking npm install at runtime is how CLIs and project bootstrappers
# install a requested package. Hidden or scripted abuse is the stealth and
# secondary-tgz composites, which keep their own criticality.
composite_rules:
- id: base64-markdown-example-bundle
  desc: Base64 markdown examples are documentation
  crit: exception
  conf: 0.93
  all:
  - id: micro-behaviors/data/decode/base64::buffer-from-base64
  - id: metadata/lang/source/syntax/key-value::markdown-name-call-value
- id: stealth-runtime-npm-install
  desc: Runtime npm install uses stealth flags
  crit: hostile
  conf: 0.97
  attack: T1195.002,T1059.007
  mbc: B0024
  near_lines: 40
  all:
  - id: micro-behaviors/os/package-manager/runtime-install::runtime-npm-install-comp
  # windowshide-option is deliberately not a stealth leg: it only keeps a
  # console window from opening on Windows, npm's output still streams to the
  # spawning process, and well-behaved Windows launchers set it on every
  # spawn -- one sat next to an uninstall's --no-save in an honest agent
  # installer and convicted it. The quiet npm flags below are what actually
  # conceals an install from the user.
  any:
  - id: micro-behaviors/os/package-manager/runtime-install::npm-no-save-option
  - id: micro-behaviors/os/package-manager/runtime-install::npm-silent-loglevel-option
  - id: micro-behaviors/os/package-manager/runtime-install::npm-no-progress-option
  needs: 2
  unless:
  - id: micro-behaviors/os/package-manager/runtime-install::npm-install-build-combo
  - id: micro-behaviors/process/interpreter/vm/
  - id: well-known/app/ai/coding-agent/agenthippo/
- id: secondary-tgz-npm-bootstrap
  desc: Secondary tgz npm bootstrap
  crit: hostile
  conf: 0.97
  attack: T1195.002,T1059.007,T1105
  mbc: B0024
  all:
  - id: micro-behaviors/os/package-manager/runtime-install::runtime-npm-install-process-call
  - id: micro-behaviors/data/archive/extract/tar::node-tar-gzip-strip-array
  any:
  - id: micro-behaviors/data/archive/extract/tar::gzip-extract-strip-one-component
  - id: node-downloaded-tgz-write
  - id: micro-behaviors/os/package-manager/runtime-install::npm-no-audit-no-fund-command
  - id: micro-behaviors/os/package-manager/runtime-install::npm-omit-dev-option
  needs: 2
  unless:
  - id: micro-behaviors/os/package-manager/runtime-install::npm-install-build-combo
  - id: micro-behaviors/process/interpreter/vm/
- id: secondary-tgz-extracted-module-exec
  desc: Secondary tgz bootstrap executes dynamically required staged module
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1059.007,T1105
  mbc: B0024
  all:
  - id: secondary-tgz-npm-bootstrap
  - id: micro-behaviors/os/module/require::node-dynamic-require-destructure
  unless:
  - id: micro-behaviors/os/package-manager/runtime-install::npm-install-build-combo
  - id: micro-behaviors/process/interpreter/vm/
- id: clx-cookieparser-runtime-stage-install
  desc: clx-cookieparser silently installs companion stage at runtime
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1059.007
  mbc: B0024
  all:
  - id: micro-behaviors/os/package-manager/runtime-install::runtime-npm-install-comp
  - id: runtime-clx-cookie-signature-install
  any:
  - id: micro-behaviors/os/package-manager/runtime-install::npm-no-save-option
  - id: micro-behaviors/os/package-manager/runtime-install::npm-silent-loglevel-option
  - id: metadata/lang/source/syntax/key-value::node-windowshide-true-option
- id: encoded-stealth-npm-install
  desc: Encoded npm install with stealth flags
  crit: suspicious
  conf: 0.95
  attack: T1195.002
  all:
  - id: encoded-npm-install
  any:
  - id: encoded-stealth-no-save
  - id: encoded-stealth-silent
  - id: encoded-stealth-no-audit
- id: obfuscated-npm-dropper
  desc: Obfuscated npm package dropper chain
  crit: hostile
  conf: 0.95
  attack: T1195.002
  mbc: B0024
  size_max: 200000
  scope: leaf
  near_bytes: 4096
  all:
  - id: metadata/import/builtin::child-process-api-destructure
  - id: encoded-npm-install
  - id: micro-behaviors/process/fd/stdio::child-stdio-ignore-option
- id: runtime-api-stealth-install
  desc: Covert runtime package install via API
  crit: hostile
  conf: 0.96
  attack: T1195.002,T1059.007
  mbc: B0024
  near_bytes: 400
  all:
  - id: api-install-package-call
  any:
  - id: install-opt-no-save-prop
  - id: install-opt-silent-loglevel-prop
  - id: install-opt-no-warnings-prop
  - id: install-opt-no-progress-prop
  needs: 2
- id: require-failure-covert-dropper
  desc: Installs missing package on require failure
  crit: hostile
  conf: 0.95
  attack: T1195.002,T1059.007
  mbc: B0024
  near_bytes: 400
  all:
  - id: micro-behaviors/data/control-flow/error-handling::install-call-in-catch
  any:
  - id: install-opt-no-save-prop
  - id: install-opt-silent-loglevel-prop
  - id: install-opt-no-warnings-prop
  - id: install-opt-no-progress-prop
  needs: 1
- id: silent-decoded-module-loader
  desc: Silent spawn + decoded module name require chain
  crit: hostile
  conf: 0.97
  attack: T1195.002,T1027
  mbc: B0024
  near_bytes: 1600
  all:
  - id: metadata/import/builtin::require-child-process
  - id: micro-behaviors/data/decode/base64::buffer-from-base64-literal-to-text
  - id: micro-behaviors/process/fd/stdio::child-stdio-ignore-option
  - id: metadata/lang/source/syntax/key-value::node-windowshide-true-option
  - id: encoded-npm-install
- id: postinstall-cloud-host-body-pingback
  desc: Postinstall hook posts body to cloud host
  crit: hostile
  conf: 0.96
  attack: T1195.002,T1041
  mbc: B0024
  all:
  - id: metadata/package/files/lifecycle::postinstall-js-file
  - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
  - id: micro-behaviors/communications/http/services/cloud::managed-cloud-host
  any:
  - id: encoded-npm-install
  - id: metadata/import/builtin::require-crypto
- id: postinstall-remote-bundle-bootstrap
  desc: npm postinstall remote bundle bootstrap
  crit: hostile
  conf: 0.995
  scope: archive
  for:
  - javascript
  - typescript
  - package.json
  - npm
  attack: T1195.002,T1105,T1059.007
  mbc: B0024
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
  - id: micro-behaviors/os/package-manager/runtime-install::runtime-npm-install-comp
  - id: micro-behaviors/communications/http/request/client::node-scheme-selected-http-client
  - id: micro-behaviors/fs/write/file/full::node-write-file-sync
  - id: micro-behaviors/os/module/dynamic-load::node-variable-require-call
  - id: micro-behaviors/data/archive/extract/tar::gzip-extract-strip-one-component

- id: npm-postinstall-spawns-alternate-registry-install
  desc: Postinstall spawns npm install on alternate registry
  crit: hostile
  conf: 0.98
  scope: archive
  for: [npm, package.json, javascript, typescript]
  attack: T1195.002,T1105
  mbc: B0024
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
  - id: micro-behaviors/process/create/exec::node-spawnsync-call
  - id: micro-behaviors/os/package-manager/runtime-install::npm-install-separate-registry-flag
  any:
  - id: micro-behaviors/os/package-manager/runtime-install::npm-no-save-option
  - id: micro-behaviors/data/decode/xor::js-buffer-repeating-key-xor-decode
# The registry above can be masked so the package carries no readable
# address: a repeating-key XOR decode feeding the separate-registry install
# is the origin-hiding half of the same dropper, and it stands on its own --
# the sibling rule also fires when --no-save corroborates instead. Archive
# scope binds the hook, the install and the decode across members.
- id: npm-postinstall-masked-registry-install
  desc: Postinstall installs from a masked registry
  crit: hostile
  conf: 0.97
  scope: archive
  for: [npm, package.json, javascript, typescript]
  attack: T1195.002,T1027,T1105
  mbc: B0024
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
  - id: micro-behaviors/process/create/exec::node-spawnsync-call
  - id: micro-behaviors/os/package-manager/runtime-install::npm-install-separate-registry-flag
  - id: micro-behaviors/data/decode/xor::js-buffer-repeating-key-xor-decode
