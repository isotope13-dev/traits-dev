  - id: node-downloaded-tgz-write
  - id: micro-behaviors/os/package-manager/runtime-install::npm-no-audit-no-fund-command
  - id: micro-behaviors/os/package-manager/runtime-install::npm-omit-dev-option
  needs: 2
  unless:
  - id: micro-behaviors/os/package-manager/runtime-install::npm-install-build-combo
  - id: micro-behaviors/process/interpreter/vm/
- id: secondary-tgz-extracted-module-exec
