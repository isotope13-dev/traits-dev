  if:
    type: value
    path: scripts.postinstall
    regex: \bshell\b
- id: scripts-postinstall-shell-2--powershell
  desc: postinstall runs shell command (powershell)
  crit: notable
  conf: 0.5
  if:
    type: value
    path: scripts.postinstall
    regex: \bpowershell\b
composite_rules:
# Fetch and exec in one install-hook one-liner. Both legs are narrow on their
# own; together they are the manifest-level equivalent of the shell
# `curl URL | sh` hooks that npm-install-trojan already treats as hostile, with
# strictly more evidence than that rule's `eval`/`sh -c` leg. A hook that only
# downloads (urlretrieve to a path, no exec sink) is deliberately left at the
# single suspicious atom, since fetching a native artifact at install time is a
# real pattern in ML and native-addon packages.
- id: npm-install-python-fetch-exec
  desc: Install hook fetches and execs inline Python
  crit: hostile
  conf: 0.95
  for:
  - package.json
  all:
  - id: scripts-install-python-c-url
  - id: scripts-install-python-c-exec
- id: npm-postinstall-obfuscated-remote-archive-loader
  desc: npm postinstall obfuscates a remote archive native loader
  crit: hostile
  conf: 0.99
  scope: archive
  attack: "T1195.002,T1105,T1027,T1059.007"
  all:
  - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
  - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file-text
  - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive-unicode
  - id: micro-behaviors/data/decode/multiple-encoding::multiple-node-hex-base64-decodes
  - id: objectives/anti-static/obfuscation/string/dynamic::hex-escaped-bracket-property
  - id: micro-behaviors/process/create/spawn-minified::detached-bang-true
- id: scripts-preinstall-pipe-2
  desc: preinstall pipe (executors node/sh/shell/eval)
  crit: notable
  conf: 0.75
  any:
  - id: scripts-preinstall-pipe-2--node
  - id: scripts-preinstall-pipe-2--sh
  - id: scripts-preinstall-pipe-2--shell
  - id: scripts-preinstall-pipe-2--eval
- id: scripts-postinstall-pipe-2
  desc: "postinstall pipe"
  crit: notable
  conf: 0.75
  any:
  - id: scripts-postinstall-pipe-2--node
  - id: scripts-postinstall-pipe-2--sh
  - id: scripts-postinstall-pipe-2--shell
  - id: scripts-postinstall-pipe-2--eval
- id: scripts-preinstall-shell-1
  desc: preinstall runs shell command (network)
  crit: notable
  conf: 0.7
  any:
  - id: scripts-preinstall-shell-1--curl
  - id: scripts-preinstall-shell-1--wget
- id: scripts-preinstall-shell-2
  desc: preinstall runs shell command (interpreters)
  crit: notable
  conf: 0.6
  any:
  - id: scripts-preinstall-shell-2--sh
  - id: scripts-preinstall-shell-2--shell
  - id: scripts-preinstall-shell-2--powershell
- id: scripts-postinstall-shell-1
  desc: postinstall runs shell command (network)
  crit: notable
  conf: 0.7
  any:
  - id: scripts-postinstall-shell-1--curl
  - id: scripts-postinstall-shell-1--wget
- id: scripts-postinstall-shell-2
  desc: postinstall runs shell command (interpreters)
  crit: notable
  conf: 0.5
  any:
  - id: scripts-postinstall-shell-2--sh
  - id: scripts-postinstall-shell-2--shell
  - id: scripts-postinstall-shell-2--powershell
- id: scripts-preinstall-pipe
  desc: preinstall download-execute pipe
  crit: suspicious
  conf: 0.95
  for:
  - package.json
  all:
  - id: scripts-preinstall-pipe-1
  - id: scripts-preinstall-pipe-2
- id: scripts-postinstall-pipe
  desc: postinstall download-execute pipe
  crit: suspicious
  conf: 0.95
  for:
  - package.json
  all:
  - id: scripts-postinstall-pipe-1
  - id: scripts-postinstall-pipe-2
- id: scripts-preinstall-shell
  desc: preinstall runs shell command
  crit: suspicious
  conf: 0.85
  for:
  - package.json
  any:
  - id: scripts-preinstall-shell-1
  - id: scripts-preinstall-shell-2
- id: scripts-postinstall-shell
