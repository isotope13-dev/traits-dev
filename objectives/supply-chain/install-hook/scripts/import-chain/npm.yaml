- id: scripts-preinstall-shell-1--curl
  desc: preinstall runs shell command (curl)
  crit: notable
  conf: 0.7
  if:
    type: value
    path: scripts.preinstall
    regex: \bcurl\b
- id: scripts-preinstall-shell-1--wget
  desc: preinstall runs shell command (wget)
  crit: notable
  conf: 0.7
  if:
    type: value
    path: scripts.preinstall
    regex: \bwget\b
- id: scripts-preinstall-shell-2--sh
  desc: preinstall runs shell command (sh)
  crit: notable
  conf: 0.6
  if:
    type: value
    path: scripts.preinstall
    regex: \bsh\b
- id: scripts-preinstall-shell-2--shell
  desc: preinstall runs shell command (shell)
  crit: notable
  conf: 0.6
  if:
    type: value
    path: scripts.preinstall
    regex: \bshell\b
- id: scripts-preinstall-shell-2--powershell
  desc: preinstall runs shell command (powershell)
  crit: notable
  conf: 0.6
  if:
    type: value
    path: scripts.preinstall
    regex: \bpowershell\b
- id: scripts-postinstall-shell-1--curl
  desc: postinstall runs shell command (curl)
  crit: notable
  conf: 0.7
  if:
    type: value
    path: scripts.postinstall
    regex: \bcurl\b
- id: scripts-postinstall-shell-1--wget
  desc: postinstall runs shell command (wget)
  crit: notable
  conf: 0.7
  if:
    type: value
    path: scripts.postinstall
    regex: \bwget\b
- id: scripts-postinstall-shell-2--sh
  desc: postinstall runs shell command (sh)
  crit: notable
  conf: 0.5
  if:
    type: value
    path: scripts.postinstall
    regex: \bsh\b
- id: scripts-postinstall-shell-2--shell
  desc: postinstall runs shell command (shell)
  crit: notable
