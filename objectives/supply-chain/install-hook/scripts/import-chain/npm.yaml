  - id: scripts-postinstall-shell-2
- id: install-hook-exec
  desc: Install hook with command execution
  crit: suspicious
  conf: 0.85
  for:
  - package.json
  any:
  - id: scripts-preinstall-shell
  - id: scripts-postinstall-shell
- id: install-hook-dropper
  desc: Install hook downloads and executes payload
  crit: hostile
  conf: 0.95
  mbc: B0024
  unless:
  - id: metadata/package/scripts/
  - id: well-known/tool/sysadmin/alpine-packages::datadog-libdatadog-package-json
  - id: well-known/tool/sysadmin/alpine-packages::datadog-libdatadog-package
  any:
