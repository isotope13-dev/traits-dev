  - id: metadata/import/package/js-require::node-filesystem-imports
  - id: micro-behaviors/communications/http/request/client::node-http-client-imports
  any:
  - id: micro-behaviors/fs/path/sensitive/browser::login-data
  - id: objectives/credential-access/browser/firefox::logins
  - id: objectives/credential-access/browser/firefox::cookies-dup
  - id: micro-behaviors/data/db/leveldb::leveldb-ref
