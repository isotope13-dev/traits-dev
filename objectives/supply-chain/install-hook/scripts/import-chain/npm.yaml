defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1195.002
traits:
- id: atob-large
  desc: atob with large base64
  crit: suspicious
  conf: 0.85
  if:
    type: string_literal
    regex: atob\(['"][A-Za-z0-9+/=]{100,}['"]
  # pdf.js embeds an OTTO test font via atob("T1RUTw…") in _loadTestFont; that is
  # library self-test, not an install-hook obfuscated payload.
  not:
    - substr: _loadTestFont
    - regex: atob\(['"]T1RUTw
  unless:
    - id: well-known/tool/offensive/pentestkit/
    - id: well-known/lib/format/pdfjs/
    - id: metadata/package/quality/benign-context::adblock-filter-resource

- id: scripts-preinstall-pipe-1
  desc: preinstall pipe (curl/wget with |/;/&&)
  crit: suspicious
  conf: 0.9
  unless:
  - id: metadata/package/scripts/
  if:
    type: value
    path: scripts.preinstall
    regex: (curl|wget).{0,50}(\||;|&&)
- id: scripts-postinstall-pipe-1
  desc: postinstall pipe (curl/wget with |/;/&&)
  crit: suspicious
  conf: 0.9
  if:
    type: value
    path: scripts.postinstall
    regex: (curl|wget).{0,50}(\||;|&&)
- id: scripts-preinstall-node-e
  desc: preinstall node -e with URL
  crit: suspicious
  conf: 0.95
  for:
  - package.json
  unless:
  - id: metadata/package/scripts/
  if:
    type: value
    path: scripts.preinstall
    regex: node\s+-e\s+['"].{0,100}https?://
- id: scripts-postinstall-node-e
  desc: postinstall node -e with URL
  crit: suspicious
  conf: 0.95
  for:
  - package.json
  if:
    type: value
    path: scripts.postinstall
    regex: node\s+-e\s+['"].{0,100}https?://
# The Python spelling of the two node-e traits above. Every other inline-
# interpreter install hook is already covered and scores heavily -- measured on
# synthetic manifests: `curl -s URL | sh` in postinstall reaches risk 268,
# `wget -qO- URL | bash` in preinstall 305, a base64+eval one-liner 119, and
# `node -e` with a fetch+execSync 120 -- but the same dropper written as
# `python3 -c "...urlopen(...)..."` scored 6 with nothing above notable, because
# the Python fetch/exec atoms are gated to `for: [python]` and never see a
# manifest. python3 is on essentially every CI image and dev box, so this is a
# free substitution for an attacker.
#
# The URL requirement matters: `python -c` alone appears in build shims, and a
# hook that downloads a native artifact is dual-use. Measured over 559 real
# package.json files (109 with install/prepare hooks) from an npm global tree:
# zero contain `python -c`, `python -c` + a URL, or `exec(` in a hook.
# Note on the character class: `[^"]{0,N}` after the opening quote -- the shape
# the neighbouring atoms use -- cannot cross the escaped inner quotes that an
# inline one-liner always carries (`"postinstall":"python3 -c \"import ..."`),
# so it stops dead at the first `\"`. These use a bounded `.` instead, which is
# why they see the body of the hook. `type: value` on `scripts.postinstall`
# would also work (it reads the decoded string) but needs one atom per hook key.
- id: scripts-install-python-c-url
  desc: Inline Python install hook fetches a URL
  crit: suspicious
  conf: 0.95
  for:
  - package.json
  if:
    type: text
    regex: '"(pre|post)?install"\s*:\s*".{0,100}python3?\s+-c.{0,140}https?://'
- id: scripts-install-python-c-exec
  desc: Inline Python install hook calls exec()
  crit: suspicious
  conf: 0.9
  for:
  - package.json
  if:
    type: text
    regex: '"(pre|post)?install"\s*:\s*".{0,100}python3?\s+-c.{0,160}exec\('
- id: scripts-preinstall-pipe-2--node
  desc: preinstall pipe (node)
  crit: notable
  conf: 0.75
  if:
    type: value
    path: scripts.preinstall
    regex: node
- id: scripts-preinstall-pipe-2--sh
  desc: preinstall pipe (sh)
  crit: notable
  conf: 0.75
  if:
    type: value
    path: scripts.preinstall
    regex: sh
- id: scripts-preinstall-pipe-2--shell
  desc: preinstall pipe (shell)
  crit: notable
  conf: 0.75
  if:
    type: value
    path: scripts.preinstall
    regex: shell
- id: scripts-preinstall-pipe-2--eval
  desc: preinstall pipe (eval)
  crit: notable
  conf: 0.75
  if:
    type: value
    path: scripts.preinstall
    regex: eval
- id: scripts-postinstall-pipe-2--node
  desc: postinstall pipe (node)
  crit: notable
  conf: 0.75
  if:
    type: value
    path: scripts.postinstall
    regex: node
- id: scripts-postinstall-pipe-2--sh
  desc: postinstall pipe (sh)
  crit: notable
  conf: 0.75
  if:
    type: value
    path: scripts.postinstall
    regex: sh
- id: scripts-postinstall-pipe-2--shell
  desc: postinstall pipe (shell)
  crit: notable
  conf: 0.75
  if:
    type: value
    path: scripts.postinstall
    regex: shell
- id: scripts-postinstall-pipe-2--eval
  desc: postinstall pipe (eval)
  crit: notable
  conf: 0.75
  if:
    type: value
    path: scripts.postinstall
