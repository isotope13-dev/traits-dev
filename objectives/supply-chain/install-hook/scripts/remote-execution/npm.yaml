# Facts for a manifest command that downloads a remote program and executes it
# through Node. Both atoms are parsed from scripts.preinstall, not source text.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: preinstall-curl-piped-node
  desc: Preinstall pipes curl output directly into Node
  crit: suspicious
  conf: 0.99
  attack: "T1195.002,T1059.007,T1105"
  mbc: "B0024"
  if:
    type: value
    path: "scripts.preinstall"
    regex: '(?is)^\s*curl\b[^|;&#]{0,160}\bhttps?://[^|;&#]{1,180}\|\s*node(js)?(\s+-)?\s*$'
- id: preinstall-curl-http-source
  desc: Preinstall curl command names a remote URL
  crit: suspicious
  conf: 0.95
  if:
    type: value
    path: "scripts.preinstall"
    regex: '(?is)^\s*curl\b[^|;&#]{0,160}\bhttps?://[^|;&#]{1,180}'
composite_rules:
- id: preinstall-curl-piped-node-exec
  desc: Preinstall pipes a fetched program into Node
  crit: hostile
  conf: 0.99
  attack: "T1195.002,T1059.007,T1105"
  mbc: "B0024"
  for: [npm, tar, package.json]
  scope: file
  all:
  - id: preinstall-curl-piped-node
  - id: preinstall-curl-http-source
