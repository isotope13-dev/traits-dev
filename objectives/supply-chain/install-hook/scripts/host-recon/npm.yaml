# JavaScript install-hook survey composites. Shell observations are neutral
# capabilities under micro-behaviors/os/sysinfo/profile.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, shell]
  attack: T1195.002,T1033,T1082
  mbc: E1033

composite_rules:
  # Account/OS command co-occurrence is a neutral survey observation.
  - id: bundled-account-os-recon-commands
    desc: Bundled script enumerates account and OS
    crit: notable
    conf: 0.9
    any:
    - id: objectives/discovery/account/enum::js-wrapped-whoami-exec
    - id: objectives/discovery/account/enum::js-wrapped-id-exec
    - id: micro-behaviors/os/sysinfo/profile::node-host-information-query-set
    needs: 2

  - id: install-hook-bundled-account-os-recon
    desc: Install hook runs bundled account/OS reconnaissance
    crit: hostile
    conf: 0.97
    scope: archive
    # Pools the manifest's lifecycle hook with the bundled script it runs, so
    # the rule reports on the package container they both live in.
    for: [package.json, javascript, npm, tar, zip]
    all:
    - id: bundled-account-os-recon-commands
    any:
    - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
    - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
    - id: metadata/package/scripts/lifecycle::has-install-script
    needs: 1
