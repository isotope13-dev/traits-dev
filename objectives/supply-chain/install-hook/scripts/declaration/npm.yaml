# What the manifest declares: which hooks exist and how many.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: postinstall-hook-declaration
  desc: Package declares a postinstall hook
  crit: notable
  conf: 0.96
  attack: T1195.002
  unless:
  - id: metadata/package/files/dependency::node-modules-path
  # A VS Code extension's package.json is also used by its build pipeline;
  # the hook is not executed as part of VSIX installation.
  - id: metadata/package/runtime::vscode-extension
  - id: metadata/package/manager::postinstall-lerna-workspace-bootstrap
  if:
    type: value
    path: "scripts.postinstall"
- id: has-preinstall
  desc: Has preinstall script hook
  crit: notable
  conf: 0.85
  attack: "T1195.002"
  unless:
  - id: metadata/package/files/dependency::node-modules-path
  - id: metadata/package/scripts/lifecycle::preinstall-only-allow-package-manager
  - id: well-known/app/publishing/civicrm/
  - type: path
    substr: civicrm-civicrm-core-
  - id: metadata/package/runtime::vscode-extension
  - id: well-known/lib/format/xmljs::libxmljs-native-addon-context
  - id: metadata/package/scripts/lifecycle::npm-inert-preinstall-script
  - id: well-known/app/ai/coding-agent/adhdev::adhdev-preinstall-compatibility-context
  - type: value
    path: "keywords"
    regex: tabby-builtin-plugin
  if:
    type: value
    path: "scripts.preinstall"
  not:
  - exact: "npx patch-package"
  - exact: "nuxt prepare"
  - exact: "npx only-allow pnpm"
  - exact: "prisma generate"
  - exact: "ibmtelemetry --config=telemetry.yml"
  - exact: "husky install"
  - substr: "tsc || exit 0"
  - exact: "patch-package"
  - exact: "husky"
  - exact: "node -e 'process.exit(0)'"
- id: has-postinstall
  desc: Has postinstall script hook
  crit: notable
  conf: 0.85
  attack: "T1195.002"
  if:
    type: value
    path: "scripts.postinstall"
  unless:
  - id: metadata/package/files/dependency::node-modules-path
  - id: metadata/package/runtime::vscode-extension
  - type: value
    path: "keywords"
    regex: tabby-builtin-plugin
  - id: metadata/package/scripts/lifecycle::postinstall-protobuf-codegen-download
  - id: metadata/package/scripts/lifecycle::npm-inert-postinstall-script
  - id: well-known/lib/platform/browser-automation/frameworks::playwright-browser-install-script
  - id: metadata/package/manager::postinstall-lerna-workspace-bootstrap
  # node-pty packages commonly repair the native helper's executable bit in
  # postinstall. This local-only chmod helper has no install-time payload.
  - type: value
    path: "scripts.postinstall"
    exact: "node scripts/fix-pty-helper.js"
  not:
  - exact: "run-script-os"
  - exact: "npx patch-package"
  - exact: "husky install"
  - exact: "patch-package"
  - exact: "husky"
  - exact: "node -e 'process.exit(0)'"
- id: has-install
  desc: Has install script hook
  crit: notable
  conf: 1.0
  attack: "T1195.002"
  unless:
  - id: metadata/package/files/dependency::node-modules-path
  - id: well-known/lib/format/xmljs::libxmljs-native-addon-context
  - id: metadata/package/scripts/lifecycle::npm-install-native-addon-build
  if:
    type: value
    path: "scripts.install"
    exists: true
- id: has-preinstall-raw
  desc: Raw content contains preinstall hook
  crit: notable
  conf: 0.88
  unless:
  - type: text
    regex: '"preinstall"\s*:\s*"npx only-allow pnpm"'
  - id: metadata/package/scripts/lifecycle::preinstall-root-install-guard-script
  - id: well-known/lib/format/xmljs::libxmljs-native-addon-context
  - id: metadata/package/scripts/lifecycle::npm-inert-preinstall-script
  - id: metadata/package/testing/presence/manifest::package-test-or-template-path
  if:
    type: text
    regex: '"preinstall"\s*:|preinstall\s*='
- id: lifecycle-script-basename
  desc: Conventional npm lifecycle shell-script basename
  crit: notable
  for: [shell]
  if:
    type: path
    basename: true
    regex: '(preinstall|postinstall)\.(sh|bash)$'
# === Composite Rules ===
composite_rules:
- id: sparse-package-install-hook
  desc: Sparse package metadata accompanies install hook
  crit: suspicious
  conf: 0.85
  all:
  - id: metadata/package/scripts/lifecycle::install-hooks
  unless:
  - id: metadata/package/repository::has-repository-field
  - id: metadata/package/entrypoint::has-bin-field
  - id: metadata/package/publishing::is-private
  - id: metadata/package/dependencies/manifest/presence::has-dev-deps
  - id: objectives/supply-chain/impersonation/package/manifest/
  - id: objectives/supply-chain/install-hook/package/manifest::tabby-builtin-plugin-keyword
  # Real packages often omit repository/bin while still declaring keywords and a
  # description (native/WASM binaries chmod'd in postinstall). Hollow packages
  # typically lack both.
  - id: metadata/package/keywords/identity::has-keywords
  # A hook that only runs a second package manager (`bower install`,
  # `composer install`, ...) delivers nothing itself; it hands off to another
  # manifest the same tooling already reads.
  - id: metadata/package/scripts/lifecycle::package-manager-bootstrap-hook
  downgrade:
    any:
    - id: metadata/package/freeform::pkg-skeleton-small
- id: multiple-install-hooks
  desc: Manifest declares two or more install hooks
  crit: notable
  conf: 0.85
  needs: 2
  any:
  - id: has-preinstall
  - id: objectives/supply-chain/install-hook/package/manifest::postinstall-hook-key
  - id: has-install
  # A package that publishes repository metadata is the ordinary build-tooling
  # case (pre/post pairs are standard there); relocated from
  # objectives/supply-chain/impersonation/manifest/skeleton in 2026-07.
  unless:
  - id: metadata/package/repository/
- id: redundant-hook-network
  desc: Multiple hooks with network commands (redundancy)
  crit: suspicious
  conf: 0.9
  attack: "T1195.002"
  all:
  - id: objectives/supply-chain/install-hook/scripts/host-profile::script-network-exfil-vars
  - id: multiple-install-hooks
        # GuardDog: Install hook existence (supply chain risk)
- id: preinstall-local-node-inflated-package
  desc: preinstall local Node script in inflated empty-author package
  crit: hostile
  conf: 0.98
  attack: "T1195.002"
  all:
  - id: objectives/supply-chain/install-hook/scripts/local-script::preinstall-runs-node-local-script
  - id: metadata/package/versioning/sentinel::npm-version-inflated-major
  - id: metadata/package/empty::npm-empty-author
- id: preinstall-metadata-only-inflated-package
  desc: preinstall hook in sparse package with inflated version metadata
  # A sparse manifest with an unusual version can be a probe or internal
  # package. Keep it suspicious until the hook's code proves hostile behavior.
  crit: suspicious
  conf: 0.96
  attack: "T1195.002"
  all:
  - id: has-preinstall
  - id: metadata/package/freeform::pkg-skeleton-small
  - id: metadata/package/versioning/sentinel::npm-version-inflated-major
  any:
  - id: metadata/package/empty::npm-empty-author
  - id: metadata/package/empty::npm-no-license
  - id: metadata/package/dependencies/manifest/presence::npm-no-deps-devdependencies
  needs: 2
