# What the manifest declares: which hooks exist and how many.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
composite_rules:
- id: redundant-hook-network
  desc: Multiple hooks with network commands (redundancy)
  crit: suspicious
  conf: 0.9
  attack: "T1195.002"
  all:
  - id: objectives/supply-chain/install-hook/scripts/host-profile::script-network-exfil-vars
  - id: metadata/package/scripts/lifecycle::multiple-install-hooks
        # GuardDog: Install hook existence (supply chain risk)
- id: preinstall-local-node-inflated-package
  desc: preinstall local Node script in inflated empty-author package
  crit: hostile
  conf: 0.98
  attack: "T1195.002"
  all:
  - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
  - id: "metadata/package/versioning/scheme::npm-multidigit-major-starting-nine"
  - id: metadata/package/empty::npm-empty-author
# Alpine/Wolfi (and other image) layouts install the package under
# `usr/lib/node_modules/`, which suppresses empty-author and has-preinstall
# via the vendored-dependency unless. The index.js preinstall plus a 9x
# major still names the same depconf probe when those context atoms drop out.
- id: preinstall-index-inflated-major
  desc: preinstall runs Node index.js in an inflated-major package
  crit: hostile
  conf: 0.97
  attack: "T1195.002"
  scope: archive
  for: [npm, tar, package.json]
  unless:
  - id: preinstall-local-node-inflated-package
  all:
  - id: metadata/package/scripts/lifecycle::preinstall-node-index-hook
  any:
  - id: "metadata/package/versioning/scheme::npm-multidigit-major-starting-nine"
  - id: metadata/package/versioning/sentinel::npm-version-999
  - id: metadata/package/versioning/sentinel::npm-version-9999
- id: preinstall-metadata-only-inflated-package
  desc: preinstall hook in sparse package with inflated version metadata
  # A 9-leading major is not an odd version, it is the exploit primitive:
  # dependency confusion works by outranking the private package in semver
  # resolution, which is the only reason 99.1.1 or 9999.0.2 is ever published.
  # Paired with a hook that runs before the package is used and a manifest with
  # no author, licence or dependencies, nothing legitimate is being described.
  #
  # Previously suspicious, "until the hook's code proves hostile behavior".
  # That inverts the threat model for this class: a depconf probe's payload is
  # deliberately trivial -- a DNS callback proving execution -- and frequently
  # no runtime module ships at all, so waiting for payload code means the probe
  # class can never be detected. The manifest shape is the attack. This also
  # aligns the rule with preinstall-local-node-inflated-package above, which is
  # already hostile on strictly less evidence.
  crit: hostile
  conf: 0.96
  attack: "T1195.002"
  unless:
  - id: preinstall-local-node-inflated-package
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: metadata/package/freeform::pkg-skeleton-small
  - id: "metadata/package/versioning/scheme::npm-multidigit-major-starting-nine"
  any:
  - id: metadata/package/empty::npm-empty-author
  - id: metadata/package/empty::npm-no-license
  - id: metadata/package/dependencies/manifest/presence::npm-no-deps-devdependencies
  needs: 2
- id: npm-inflated-depconf-major-version
  desc: npm manifest uses inflated depconf major
  crit: suspicious
  conf: 0.9
  any:
  - id: "metadata/package/versioning/scheme::npm-multidigit-major-starting-nine"
  - id: "metadata/package/versioning/scheme::npm-major-version-prefix-90-plus"
- id: postinstall-metadata-only-inflated-package
  desc: postinstall hook in sparse inflated-major package
  crit: hostile
  conf: 0.96
  attack: "T1195.002"
  scope: archive
  for: [npm, tar, package.json]
  unless:
  - id: preinstall-local-node-inflated-package
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: npm-inflated-depconf-major-version
  any:
  - id: metadata/package/empty::npm-empty-author
  - id: metadata/package/empty::npm-no-author
  - id: metadata/package/empty::npm-no-license
  - id: metadata/package/dependencies/manifest/presence::npm-no-deps-devdependencies
  needs: 1
