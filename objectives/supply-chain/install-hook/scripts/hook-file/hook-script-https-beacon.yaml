# A preinstall hook that runs a bundled Node script, where that script opens an
# HTTPS request to a hardcoded remote host carrying a hardcoded Authorization
# value. A build step has no reason to contact a fixed third-party endpoint
# with a baked-in credential while `npm install` is running; the request tells
# the operator which machine installed the package and when, and the same hook
# can later return code instead of a lookup result.
#
# Worked example: `@mntv-analysis/ui-components` 50.1.1, whose `preinstall`
# runs `node index.js`, which calls `https://realwbx.com/ip.php` with a fixed
# Authorization header and a "Nodejs" User-Agent.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, npm]
  attack: T1195.002,T1071.001

composite_rules:
  - id: preinstall-node-script-hardcoded-https-callback
    desc: Preinstall script calls hardcoded HTTPS host with fixed Authorization
    crit: hostile
    conf: 0.9
    scope: archive
    mbc: B0024
    all:
      - id: metadata/package/scripts/lifecycle::preinstall-node-index-hook
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
      - id: micro-behaviors/communications/http/authorization-header::authorization-header-map-entry
