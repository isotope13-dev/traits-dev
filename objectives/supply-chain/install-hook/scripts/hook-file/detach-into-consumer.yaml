# An install hook that finds the installing project and leaves a process behind.
#
# `INIT_CWD` is npm's answer to "where was the install run from" -- the
# consumer's project root, not the package's own directory. A build step has no
# use for it: it compiles its own sources, in its own tree, and exits. A hook
# reads `INIT_CWD` when it wants to act on the *victim's* files.
#
# On its own that is only notable; plenty of tooling reads it to place a config
# or print a relative path. The second leg is what makes it an implant: the
# hook spawns a child `detached`, with `stdio` ignored and the handle unref'd.
# Those three together have one purpose, which is to outlive the install and
# leave nothing on the terminal. Legitimate postinstall work runs to completion
# in the foreground, because npm waits for it and the developer wants to see it
# fail.
#
# Wanting the consumer's directory and wanting to survive past the install are
# each explainable on their own: documented scaffolders copy templates into
# the consumer tree the same way. The hostile verdict therefore additionally
# requires implant evidence beside the detached child -- a remote second
# stage, credential access, or deletion of victim files. Either the hook
# phones home for more code, steals secrets, or destroys files while
# outliving the install; a hook that only adds files stays at the suspicious
# detached-child leaf.
#
# Worked example: the `@tushar-br` sets, whose `install.js` prints a banner,
# resolves `INIT_CWD`, extracts a bundled `staging_area` into it, processes a
# deletion list against the developer's tree, and detaches a background child.
# Counterexample: a disclosed starter-kit postinstall that copies templates
# and merges its own scripts, with no fetch, no credential access and no
# deletion, is setup context, not an implant.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1543
  mbc: B0024

composite_rules:
  - id: install-hook-detaches-into-consumer-tree
    desc: Install hook detaches child into consumer tree
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: install-hook-detached-child-launch
      - id: micro-behaviors/os/env/read::npm-init-cwd-read
    any:
      - id: objectives/supply-chain/install-hook/scripts/remote-fetch
      - id: micro-behaviors/process/deploy/interpreter-stdin::npm-postinstall-http-node-stdin
      - id: objectives/supply-chain/install-hook/scripts/credential
      - id: micro-behaviors/fs/delete/file/library::js-repeated-unlink-call
      - id: micro-behaviors/fs/delete/directory::npm-script-directory-delete-command
    needs: 1
