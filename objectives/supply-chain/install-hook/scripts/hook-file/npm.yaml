defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1195.002
traits:
- id: init-js-filename
  desc: File named init.js
  crit: component
  conf: 0.75
  if:
    type: path
    basename: true
    exact: init.js
- id: postinstall-user-data-executable-placeholder
  desc: Postinstall writes user-data EXE placeholder
  crit: suspicious
  conf: 0.98
  attack: T1195.002,T1105
  if:
    type: text
    regex: writeFileSync\s*\(\s*["']/mnt/user-data/outputs/[^"']{1,80}\.exe["']
- id: postinstall-never-fail-install-prose
  desc: Documents non-failing npm install hook
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: NEVER fail the npm install
- id: postinstall-explicit-success-exit
  desc: Postinstall script exits zero explicitly
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: process\.exit\s*\(\s*0\s*\)
- id: postinstall-hour-detached-sleep
  desc: Postinstall starts detached hour sleep
  crit: suspicious
  conf: 0.98
  attack: T1195.002,T1059.004
  if:
    type: text
    regex: execSync\s*\(\s*["']setsid\s+sleep\s+3600\s*&["']
- id: shell-script-ref
  desc: References shell script file (.sh)
  crit: component
  conf: 0.7
  for:
  - javascript
  - typescript
  unless:
  - id: metadata/build/
  if:
    type: text
    regex: (^|[^A-Za-z0-9_./-])[A-Za-z0-9_./-]+\.sh(["' ),]|$)
- id: batch-script-ref
  desc: References batch script file (.bat/.cmd)
  crit: component
  conf: 0.7
  for:
  - javascript
  - typescript
  unless:
  - id: metadata/build/
  if:
    type: text
    regex: (^|[^A-Za-z0-9_./-])[A-Za-z0-9_./-]+\.(bat|cmd)(["' ),]|$)
- id: chrome-browser-path
  desc: References Chrome browser executable path
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: Google/Chrome/Application/chrome.exe
- id: dep-confusion-env-knobs
  desc: dependency confusion control env vars
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: DEP_CONFUSION_(URL|PAYLOAD|SECRET|RECON_ONLY)
- id: oob-moika-endpoint
  desc: oob.moika callback or payload endpoint
  crit: suspicious
  conf: 0.98
  attack: T1041
  if:
    type: text
    regex: https?://oob\.moika\.tech/(report|payload)
- id: postinstall-sensitive-env-report
  desc: postinstall collects sensitive and full env
  crit: suspicious
  conf: 0.96
  attack: T1552.001
  if:
    type: text
    regex: sensitive_vars[\s\S]{0,120}all_env_vars|all_env_vars[\s\S]{0,120}sensitive_vars
- id: process-env-json-payload
  unless:
    - id: metadata/package/testing/corpus::inert-security-input-module
  desc: Serializes process.env in JSON
  crit: notable
  conf: 0.94
  attack: T1552.001
  if:
    type: text
    regex: JSON\.stringify\s*\([^)]{0,80}process\.env[^)]{0,80}\)
- id: postinstall-npmrc-harvest
  desc: npmrc path-list access marker
  crit: notable
  conf: 0.96
  attack: T1552.001
  if:
    type: text
    regex: npmrcPaths[\s\S]{0,500}(\.npmrc|/etc/npmrc)
- id: postinstall-project-secret-harvest
  desc: postinstall project secret harvest marker
  crit: notable
  conf: 0.9
  attack: T1552.001
  if:
    type: text
    substr: collectProjectContext
- id: postinstall-git-log-harvest
  desc: postinstall reads recent project git log
  crit: suspicious
  conf: 0.93
  attack: T1552.001
  if:
    type: text
    substr: git -C ../.. log --oneline
- id: git-branch-delete-command
  desc: Git branch delete command
  crit: notable
  conf: 0.94
  if:
    type: literal
    kind: string
    regex: \bgit\s+branch\s+-d\s+\$\{[^}]{1,80}\}
- id: git-pull-origin-command
  desc: Git pull origin command
  crit: notable
  conf: 0.9
  if:
    type: literal
    kind: string
    regex: \bgit\s+pull\s+origin\b
- id: postinstall-parent-env-harvest
  desc: postinstall reads parent project env file
  crit: suspicious
  conf: 0.96
  attack: T1552.001
  if:
    type: text
    substr: parent_env_file
- id: postinstall-hidden-temp-payload
  desc: postinstall writes hidden temp payload
  crit: suspicious
  conf: 0.96
  attack: T1105
  if:
    type: text
    regex: \._polka-ui_init(\$\{ext\}|\.sh|\.bat)?
- id: postinstall-hidden-temp-js-payload
  desc: postinstall writes hidden temp JS payload
  crit: suspicious
  conf: 0.96
  attack: T1105
  if:
    type: string_literal
    regex: \._[A-Za-z0-9_-]+_init\.js
- id: postinstall-download-and-detached-run
  desc: postinstall download and run function marker
  crit: notable
  conf: 0.92
  attack: T1105, T1059.004
  if:
    type: text
    substr: downloadAndRun
- id: postinstall-js-payload-template
  desc: postinstall downloads OS-specific JS stage
  crit: component
  conf: 0.94
  attack: T1105
  if:
    type: string_literal
    substr: ${PAYLOAD_BASE}/${osType}.js
- id: postinstall-payload-http-get
  desc: postinstall downloads payload base URL
  crit: suspicious
  conf: 0.95
  attack: T1105
  if:
    type: text
    word: PAYLOAD_BASE
- id: postinstall-json-http-post
  desc: postinstall HTTP POST function marker
  crit: notable
  conf: 0.9
  attack: T1041
  if:
    type: text
    substr: httpPost
- id: tar-gzip-extract-spawn
  desc: postinstall spawns tar gzip extraction
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: spawn\(\s*["']tar["'][\s\S]{0,120}["']-xzf["']
- id: postinstall-binary-url-env-override
  desc: postinstall binary download URL env override
  crit: notable
  conf: 0.82
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: process\.env\.[A-Z0-9_]*BINARY[A-Z0-9_]*URL
- id: postinstall-versioned-targz-asset
  desc: postinstall versioned tar.gz asset name
  crit: notable
  conf: 0.84
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \$\{[^}]{1,32}version[^}]{0,32}\}[\s\S]{0,80}\.tar\.gz
- id: hermes-agent-postinstall-marker
  desc: Hermes agent postinstall marker
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: hermes-agent
- id: calvyn-postinstall-marker
  desc: Calvyn npm postinstall marker
  crit: component
  conf: 0.86
  if:
    type: text
    substr: '[calvyn]'
- id: install-hook-package-compromise-banner
  desc: Install hook declares package compromise
  crit: suspicious
  conf: 0.94
  if:
    type: string_literal
    case_insensitive: true
    regex: \b(this|your) package is (hacked|compromised|pwned)\b
  unless:
  - id: well-known/tool/detection/tyre-kicker/
  - id: well-known/lib/format/jszip/
  - id: metadata/build/minifier::js-large-minified-bundle
- id: install-hook-unauthorized-code-phrase
  desc: Compromise banner declares unauthorized code
  crit: suspicious
  conf: 0.94
  if:
    type: string_literal
    case_insensitive: true
    regex: \bunauthori[sz]ed[\s_-]+code\b
  unless:
  - id: metadata/package/documentation/page::static-html-shell
  - id: metadata/file/extension/identity::markdown-file-basename
  # Auth middleware tests assert 401 `code: 'UNAUTHORIZED'` responses; the
  # phrase is the assertion subject, not a compromise banner.
  - id: metadata/package/testing/presence/harness::tests-path-filename
- id: install-hook-package-self-reference
  desc: Names this package, module, or dependency
  crit: component
  conf: 0.86
  if:
    type: string_literal
    case_insensitive: true
    regex: \b(this|your)\s+(package|module|dependency)\b
- id: install-hook-unauthorized-before-code
  desc: Banner places unauthorized before code
  crit: notable
  conf: 0.9
  if:
    type: string_literal
    case_insensitive: true
    regex: \bunauthori[sz]ed\b.{0,30}\bcode\b
- id: install-hook-unauthorized-code-banner-pt
  desc: Hook declares unauthorized code in Portuguese
  crit: suspicious
  conf: 0.94
  if:
    type: text
    case_insensitive: true
    regex: "c[o\xF3]digo.{0,30}n[a\xE3]o autorizado"
- id: install-hook-supply-chain-attack-banner
  desc: Install hook declares supply-chain attack
  crit: suspicious
  conf: 0.94
  if:
    type: string_literal
    case_insensitive: true
    regex: \b(this|your) (package|module|dependency)\b.{0,60}supply[- ]chain attack
- id: install-hook-hacked-marker-file
  desc: Writes a compromise or defacement marker
  crit: suspicious
  conf: 0.94
  if:
    type: text
    case_insensitive: true
    regex: writeFileSync[\s\S]{0,260}(hacked|hackeado|pwned|supply.{0,2}chain attack)
  unless:
  - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: metadata/package/testing/
  - type: text
    regex: "[\u2192\u279C]\\s*writeFileSync"
  - id: metadata/package/testing/presence/fixture::defanged-disabled-effect-context
  - id: "metadata/file/naming::test-directory-component"
composite_rules:
- id: postinstall-host-profile-placeholder-and-detached-process
  desc: Postinstall profiles the host, writes an executable lure, and detaches a process
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1082,T1033,T1059.004
  all:
  - id: metadata/package/files/included::postinstall-js-basename
  - id: micro-behaviors/data/source/syntax/schema::host-system-metric-schema
  - id: micro-behaviors/data/source/syntax/schema::host-identity-field-pair
  - id: objectives/discovery/system/fingerprint/hardware::node-data-aggregation
  - id: postinstall-user-data-executable-placeholder
  - id: postinstall-hour-detached-sleep
- id: process-env-report-payload
  desc: Serializes process.env into report payload
  crit: component
  conf: 0.94
  attack: T1552.001
  any:
  - id: process-env-json-payload
  - id: micro-behaviors/communications/http/request/body::process-env-in-body-field
- id: install-hook-unauthorized-code-banner-proximity
  desc: Banner places package near unauthorized code wording
  crit: suspicious
  conf: 0.94
  all:
  - id: install-hook-package-self-reference
  - id: install-hook-unauthorized-before-code
  near_bytes: 120
  unless:
  - id: metadata/package/documentation/page::static-html-shell
- id: install-hook-unauthorized-code-banner
  desc: Compromise banner declares unauthorized code
  crit: suspicious
  conf: 0.94
  any:
  - id: install-hook-unauthorized-code-phrase
  - id: install-hook-unauthorized-code-banner-proximity
  unless:
  - id: metadata/package/documentation/page::static-html-shell
- id: hook-script-filename
  desc: npm lifecycle hook-like filename
  crit: component
  conf: 0.9
  any:
  - type: trait
    id: metadata/package/files/included::preinstall-js-basename
  - type: trait
    id: metadata/package/files/included::postinstall-js-basename
  - type: trait
    id: metadata/package/files/included::install-js-basename
  - type: trait
    id: metadata/package/files/included::beacon-js-basename
- id: postinstall-git-config-harvest
  desc: postinstall reads project git config
  crit: suspicious
  conf: 0.95
  attack: T1552.001
  all:
  - id: hook-script-filename
  - id: micro-behaviors/fs/read/file/target::git-config-file-read
  unless:
  - id: well-known/tool/detection/tyre-kicker/
- id: postinstall-resolv-conf-harvest
  desc: postinstall reads resolver configuration
  crit: suspicious
  conf: 0.92
  attack: T1016
  all:
  - id: hook-script-filename
  - id: micro-behaviors/fs/path/config/system::config-resolv
- id: postinstall-hosts-file-harvest
  desc: postinstall reads hosts file
  crit: suspicious
  conf: 0.9
  attack: T1016
  all:
  - id: hook-script-filename
  - id: micro-behaviors/fs/path/config/system::hosts-file-path
- id: cross-platform-script-exec
  desc: Executes both shell and batch scripts
  crit: suspicious
  conf: 0.85
  for:
  - javascript
  - typescript
  all:
  - id: shell-script-ref
  - id: batch-script-ref
  - id: metadata/import/builtin::require-child-process
  any:
  - id: micro-behaviors/process/create/script/file::shell-script-execution-any
  - id: micro-behaviors/process/create/script/file::batch-script-execution
- id: postinstall-project-secret-harvest-cluster
  desc: postinstall harvests project git and env files
  crit: suspicious
  conf: 0.96
  attack: T1552.001
  all:
  - id: hook-script-filename
  - id: postinstall-project-secret-harvest
  any:
  - id: micro-behaviors/fs/read/file/target::git-config-file-read
  - id: postinstall-git-log-harvest
  - id: postinstall-parent-env-harvest
  needs: 2
- id: postinstall-vcs-project-update
  desc: postinstall mutates project checkout
  crit: hostile
  conf: 0.95
  all:
  - id: hook-script-filename
  - id: git-pull-origin-command
  - id: micro-behaviors/process/create/shell/build::npm-install-command
  any:
  - id: micro-behaviors/os/module/require::child-process-require
  - id: micro-behaviors/process/create/shell/bridge::execSync-call
- id: postinstall-vcs-branch-cleanup
  desc: postinstall deletes local branches
  crit: hostile
  conf: 0.94
  all:
  - id: hook-script-filename
  - id: git-branch-delete-command
  any:
  - id: micro-behaviors/os/module/require::child-process-require
  - id: micro-behaviors/process/create/shell/bridge::execSync-call
- id: postinstall-self-declared-compromise
  desc: npm postinstall declares compromise
  crit: hostile
  conf: 0.98
  all:
  - id: hook-script-filename
  - id: micro-behaviors/fs/write/file/full::js-file-write
  any:
  - id: install-hook-package-compromise-banner
  - id: install-hook-supply-chain-attack-banner
  - id: install-hook-unauthorized-code-banner
  - id: install-hook-unauthorized-code-banner-pt
  - id: objectives/impact/deface/proof::compromise-marker-filename
  - id: install-hook-hacked-marker-file
- id: postinstall-hacked-marker-write
  desc: npm postinstall writes hacked marker
  crit: hostile
  conf: 0.98
  all:
  - id: hook-script-filename
  - id: objectives/impact/deface/proof::compromise-marker-filename
  - id: micro-behaviors/fs/write/file/full::js-file-write
- id: postinstall-ip-command-harvest
  desc: postinstall runs IP interface discovery commands
  crit: suspicious
  conf: 0.92
  attack: T1016
  scope: leaf
  all:
  - id: hook-script-filename
  - id: micro-behaviors/network/interface::interface-command-string
  any:
  - id: metadata/import/builtin::require-child-process
- id: postinstall-network-context-harvest-cluster
  desc: postinstall collects network configuration files
  crit: suspicious
  conf: 0.93
  attack: T1016
  all:
  - id: micro-behaviors/network/interface::node-network-interfaces-call
  any:
  - id: postinstall-ip-command-harvest
  - id: postinstall-resolv-conf-harvest
  - id: postinstall-hosts-file-harvest
  needs: 2
- id: postinstall-download-and-detached-run-cluster
  desc: postinstall downloads and detached-runs stage payload
  crit: suspicious
  conf: 0.97
  attack: T1105, T1059.004
  all:
  - id: postinstall-download-and-detached-run
  - id: postinstall-payload-http-get
  - id: install-hook-detached-child-launch
- id: postinstall-js-download-detached-run-cluster
  desc: postinstall downloads and detached-runs JS stage
  crit: suspicious
  conf: 0.97
  attack: T1105, T1059.007
  scope: leaf
  all:
  - id: postinstall-payload-http-get
  - id: postinstall-js-payload-template
  - id: postinstall-hidden-temp-js-payload
  - id: install-hook-detached-child-launch
- id: install-hook-detached-child-launch
  desc: npm install hook launches detached child
  crit: suspicious
  conf: 0.95
  attack: T1059.004
  scope: leaf
  unless:
  - id: well-known/tool/development/ci/docker-actions-toolkit::docker-actions-toolkit-context
  - id: well-known/app/ai/coding-agent/bumper-guard::bumper-guard-documented-install-context
  - id: metadata/package/testing/presence/fixture::defanged-disabled-effect-context
  all:
  - id: hook-script-filename
  - id: metadata/import/builtin::require-child-process
  any:
  - id: micro-behaviors/process/create/spawn::detached-true
  - id: micro-behaviors/process/daemonize/detach::detached-obfuscated-true
  - id: micro-behaviors/process/daemonize/detach::nohup-string-command
- id: npm-postinstall-remote-archive-exe-dropper
  desc: npm postinstall downloads an archive and detached-runs an EXE
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1105,T1059.001
  scope: leaf
  size_max: 20000
  all:
  - id: hook-script-filename
  - id: micro-behaviors/communications/http/download/url::archive-url-reference
  - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file-text
  - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive
  - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
  - id: micro-behaviors/fs/enumerate/directory::node-recursive-executable-search
- id: hook-script-telegram-beacon
  desc: Lifecycle hook script sends Telegram message
  crit: notable
  conf: 0.98
  all:
  - id: hook-script-filename
  - id: micro-behaviors/communications/messaging/send::chat-send-message
  - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
- id: npm-install-hook-telegram-host-beacon
  desc: npm install hook reports host identity to Telegram
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1041
  for:
  - npm
  - tar
  - package.json
  - javascript
  scope: archive
  all:
  - id: hook-script-telegram-beacon
  - id: objectives/supply-chain/install-hook/scripts/local-script::preinstall-runs-node-local-script
- id: npm-install-hook-remote-deno-stage
  desc: npm install hook detaches remote Deno stage
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1105,T1059.007
  scope: leaf
  all:
  - id: hook-script-filename
  - id: install-hook-detached-child-launch
  - id: objectives/command-and-control/dropper/standalone::js-remote-deno-run-all-permissions
- id: postinstall-detached-cmd-bash-agent
  desc: postinstall detaches a /cmd bash HTTP agent
  crit: hostile
  conf: 0.99
  attack: T1195.002, T1059.004, T1071.001, T1105
  scope: leaf
  all:
  - id: install-hook-detached-child-launch
  - id: objectives/command-and-control/beacon/network/json::c2-command-result-endpoints
  - id: micro-behaviors/process/create/shell/bridge::js-spawnsync-bash-command
- id: postinstall-json-http-post-cluster
  desc: postinstall sends JSON report via HTTP POST
  crit: suspicious
  conf: 0.94
  attack: T1041
  all:
  - id: hook-script-filename
  - id: postinstall-json-http-post
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  any:
  - id: micro-behaviors/communications/http/header/content-type::application-json
  - id: micro-behaviors/communications/http/request/verb::post-method-text
- id: hook-full-env-report-cluster
  desc: npm hook reports full process.env
  crit: suspicious
  conf: 0.96
  attack: T1552.001, T1041
  all:
  - id: hook-script-filename
  - id: process-env-report-payload
  any:
  - id: postinstall-json-http-post
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: micro-behaviors/data/buffer/alloc::buffer-from-call
  - id: micro-behaviors/communications/http/request/body::request-write-call
  - id: micro-behaviors/communications/dns/resolver::node-dns-lookup
- id: hook-full-env-http-exfil
  desc: npm hook exfiltrates full process.env
  crit: hostile
  conf: 0.98
  attack: T1195.002, T1552.001, T1041
  all:
  - id: hook-full-env-report-cluster
  - id: objectives/exfiltration/http/upload::node-collect-exfil
- id: postinstall-unverified-binary-archive-installer
  desc: npm postinstall downloads unverified binary archive
  crit: suspicious
  conf: 0.9
  attack: T1195.002, T1105
  for:
  - javascript
  - typescript
  size_max: 20000
  all:
  - id: hook-script-filename
  - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
  - id: tar-gzip-extract-spawn
  - id: micro-behaviors/fs/chmod/modify::node-chmod
  any:
  - id: postinstall-binary-url-env-override
  - id: postinstall-versioned-targz-asset
  unless:
  - id: objectives/command-and-control/dropper/file-exec/command/script-host-download/
  - id: "objectives/command-and-control/dropper/file-exec/command/script-host-embedded"
- id: hook-script-dropper
  desc: npm hook executes shell and batch payloads
  crit: suspicious
  conf: 0.9
  size_max: 10240
  all:
  - id: hook-script-filename
  - id: cross-platform-script-exec
  unless:
  - id: objectives/command-and-control/dropper/file-exec/command/script-host-download/
  - id: "objectives/command-and-control/dropper/file-exec/command/script-host-embedded"
  - id: hermes-agent-postinstall-marker
  - id: calvyn-postinstall-marker
- id: hook-script-sidecar-launcher
  desc: npm hook launches platform specific sidecars
  crit: suspicious
  conf: 0.92
  size_max: 10240
  all:
  - id: hook-script-filename
  - id: metadata/import/builtin::require-child-process
  - id: objectives/execution/condition/platform::os-specific-execution
  any:
  - id: cross-platform-script-exec
  - id: micro-behaviors/process/create/script/file::shell-script-execution-any
  - id: micro-behaviors/process/create/script/file::batch-script-execution
- id: hook-script-browser-launcher
  desc: npm hook silently launches browser
  crit: hostile
  conf: 0.97
  size_max: 10240
  all:
  - id: hook-script-filename
  - id: metadata/import/builtin::require-child-process
  - id: micro-behaviors/process/create/spawn::detached-true
  - id: micro-behaviors/process/fd/stdio::child-stdio-ignore-option
  any:
  - id: chrome-browser-path
  - id: micro-behaviors/process/create/shell/bridge::node-starts-browser-url
- id: hook-script-telemetry-beacon
  desc: npm hook sends install analytics beacon
  crit: hostile
  conf: 0.95
  size_max: 10240
  all:
  - id: hook-script-filename
  - id: objectives/supply-chain/install-hook/scripts/local-script::postinstall-hook-script-http-ip-profile-post-file
