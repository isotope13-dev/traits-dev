defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
  attack: T1195.002
traits:
composite_rules:
  - id: postinstall-host-profile-placeholder-and-detached-process
    desc: Postinstall profiles the host, writes an executable lure, and detaches a process
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1082,T1033,T1059.004
    all:
      - id: metadata/package/files/included::postinstall-js-basename
      - id: metadata/file/profile/host-information::host-platform-arch-text-sequence
      - id: metadata/lang/source/syntax/object::host-identity-field-pair
      - id: micro-behaviors/os/sysinfo/profile::node-four-host-query-kinds
      - id: micro-behaviors/fs/write/file/executable::postinstall-user-data-executable-placeholder
      - id: micro-behaviors/process/daemonize/background::postinstall-hour-detached-sleep
  - id: postinstall-git-config-harvest
    desc: postinstall reads project git config
    crit: suspicious
    conf: 0.95
    attack: T1552.001
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: micro-behaviors/fs/read/file/target::git-config-file-read
  - id: postinstall-resolv-conf-harvest
    desc: postinstall reads resolver configuration
    crit: suspicious
    conf: 0.92
    attack: T1016
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: micro-behaviors/fs/path/config/system::config-resolv
  - id: postinstall-hosts-file-harvest
    desc: postinstall reads hosts file
    crit: suspicious
    conf: 0.9
    attack: T1016
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: micro-behaviors/fs/path/config/system::hosts-file-path
  - id: cross-platform-script-exec
    desc: Shell and batch references with script execution
    crit: suspicious
    conf: 0.85
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/fs/path/script::shell-script-ref
      - id: micro-behaviors/fs/path/script::batch-script-ref
      - id: metadata/import/builtin::require-child-process
    any:
      - id: micro-behaviors/process/create/script/file::shell-script-execution-any
      - id: micro-behaviors/process/create/script/file::batch-script-execution
  - id: postinstall-project-secret-harvest-cluster
    desc: postinstall harvests project git and env files
    crit: suspicious
    conf: 0.96
    attack: T1552.001
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: metadata/lang/source/naming/function/name-form::postinstall-project-secret-harvest
    any:
      - id: micro-behaviors/fs/read/file/target::git-config-file-read
      - id: micro-behaviors/revision-control/git/read::postinstall-git-log-harvest
      - id: metadata/lang/source/naming/variable::postinstall-parent-env-harvest
    needs: 2
  - id: postinstall-vcs-project-update
    desc: postinstall mutates project checkout
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
