# Install hooks that collect host facts and send them somewhere.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: test-script-exfil
  desc: Test script with command substitution
  crit: suspicious
  conf: 0.95
  attack: "T1041"
  if:
    type: value
    path: "scripts.test"
    regex: "https?://[^\"'\\s]{0,120}\\$\\("
      # === Script Content Patterns ===
      # Detect dangerous commands in install scripts
- id: preinstall-webhook-site-url
  desc: preinstall targets webhook.site
  crit: suspicious
  conf: 0.96
  attack: "T1041"
  if:
    type: value
    path: "scripts.preinstall"
    regex: "https?://webhook\\.site/[A-Fa-f0-9-]{20,}"
- id: postinstall-webhook-site-url
  desc: postinstall targets webhook.site
  crit: suspicious
  conf: 0.96
  attack: "T1041"
  if:
    type: value
    path: "scripts.postinstall"
    regex: "https?://webhook\\.site/[A-Fa-f0-9-]{20,}"
- id: install-webhook-site-url
  desc: install targets webhook.site
  crit: suspicious
  conf: 0.96
  attack: "T1041"
  if:
    type: value
    path: "scripts.install"
    regex: "https?://webhook\\.site/[A-Fa-f0-9-]{20,}"
- id: preinstall-node-os-hostname
  desc: preinstall reads os.hostname
  crit: suspicious
  conf: 0.94
  attack: "T1082"
  if:
    type: value
    path: "scripts.preinstall"
    regex: "require\\([\"']os[\"']\\)\\.hostname\\("
- id: preinstall-node-os-userinfo
  desc: preinstall reads os.userInfo
  crit: suspicious
  conf: 0.96
  attack: "T1033"
  if:
    type: value
    path: "scripts.preinstall"
    regex: "require\\([\"']os[\"']\\)\\.userInfo\\(\\)\\.username"
- id: preinstall-node-os-platform
  desc: preinstall reads os.platform
  crit: suspicious
  conf: 0.92
  attack: "T1082"
  if:
    type: value
    path: "scripts.preinstall"
    regex: "require\\([\"']os[\"']\\)\\.platform\\("
- id: preinstall-node-dns-lookup
  desc: preinstall resolves DNS via Node dns
    # DNS resolution inside an install hook is abnormal and is the OAST/canary
    # DNS-exfil channel: host data is encoded into a subdomain of the callback
    # domain and leaked via the resolver even when egress HTTP is filtered.
  crit: suspicious
  conf: 0.9
  attack: "T1048.003"
  if:
    type: value
    path: "scripts.preinstall"
    regex: "require\\([\"']dns[\"']\\)\\.(lookup|resolve)"
- id: preinstall-url-query-profile-keys
  desc: preinstall sends host user platform params
  crit: suspicious
  conf: 0.95
  attack: "T1041"
  if:
    type: value
    path: "scripts.preinstall"
    regex: "\\?(pkg|h)="
- id: script-sysinfo-cmd-2
  desc: Script runs system info (ifconfig/ip addr)
  crit: notable
  conf: 0.8
  if:
    type: value
    path: "scripts.preinstall"
    regex: "\\b(ifconfig|ip\\s+addr)\\b"
- id: script-sysinfo-cmd-3
  desc: Script runs pwd or env discovery
  crit: notable
  conf: 0.8
  attack: "T1083"
  if:
    type: value
    path: "scripts.preinstall"
    regex: "\\$\\(pwd\\)|\\bpwd\\b|\\$\\(id\\)"
- id: script-network-exfil-vars
  desc: 'Network request with command substitution'
  crit: suspicious
  conf: 0.95
  attack: "T1041"
  if:
    type: value
    path: "scripts.preinstall"
    regex: "https?://[^\"'\\s]{0,120}\\$\\("
- id: script-multi-param-exfil
  desc: "URL with multiple command substitution params"
  crit: suspicious
  conf: 0.95
  attack: "T1041"
  if:
    type: value
    path: "scripts.preinstall"
    regex: "\\$\\([a-z]{2,15}\\).{0,80}\\$\\([a-z]{2,15}\\)"
- id: preinstall-external-ip
  desc: preinstall embeds external IPv4
  crit: notable
  conf: 0.9
  attack: "T1071"
  if:
    type: value
    path: "scripts.preinstall"
    regex: "(\\d{1,3}\\.){3}\\d{1,3}"
    is: external_ip
- id: preinstall-ip-port-endpoint
  desc: preinstall contains IPv4 endpoint
  crit: suspicious
  conf: 0.93
  attack: "T1571"
  if:
    type: value
    path: "scripts.preinstall"
    regex: "(\\d{1,3}\\.){3}\\d{1,3}\\s+[1-9][0-9]{1,4}"
- id: test-script-network--curl
  desc: Test script performs network request (curl)
  crit: suspicious
  conf: 0.9
  if:
    type: value
    path: "scripts.test"
    regex: \bcurl\b
- id: test-script-network--wget
  desc: Test script performs network request (wget)
  crit: suspicious
  conf: 0.9
  if:
    type: value
    path: "scripts.test"
    regex: \bwget\b
- id: script-sysinfo-cmd-1--uname
  desc: Script runs system info (uname)
  crit: notable
  conf: 0.8
  if:
    type: value
    path: "scripts.preinstall"
    regex: \buname\b
- id: script-sysinfo-cmd-1--hostname
  desc: Script runs system info (hostname)
  crit: notable
  conf: 0.8
  if:
    type: value
    path: "scripts.preinstall"
    regex: \bhostname\b
composite_rules:
- id: npm-postinstall-host-profile-beacon
  desc: Suppressed npm postinstall sends host profile
  crit: hostile
  conf: 0.99
  attack: "T1195.002,T1082,T1041"
  mbc: E1041
  for: [package.json, javascript]
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/scripts/local-script::postinstall-node-script-suppressed
  - id: objectives/supply-chain/recon-exfil/install-hook::js-install-host-profile
  - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body
  - id: micro-behaviors/communications/ip/literal::external-ipv4-script
- id: test-script-network
  desc: Test script performs network request
  crit: suspicious
  conf: 0.9
  attack: "T1059"
  not:
  - substr: "jest"
  - substr: "mocha"
  - substr: "vitest"
  any:
  - id: test-script-network--curl
  - id: test-script-network--wget
- id: script-sysinfo-cmd-1
  desc: "Script runs system info"
  crit: notable
  conf: 0.8
  any:
  - id: script-sysinfo-cmd-1--uname
  - id: metadata/package/scripts/lifecycle::preinstall-whoami
  - id: script-sysinfo-cmd-1--hostname
- id: script-sysinfo-cmd
  desc: Script runs system info command
  crit: notable
  conf: 0.8
  attack: "T1082"
  any:
  - id: script-sysinfo-cmd-1
  - id: script-sysinfo-cmd-2
  - id: script-sysinfo-cmd-3
- id: install-script-exfil
  desc: Install script performs data exfiltration
  crit: hostile
  conf: 0.95
  attack: "T1041"
  all:
  - id: script-network-exfil-vars
  - id: objectives/supply-chain/install-hook/scripts/remote-fetch::download-tools
        # Download tools
- id: test-hook-exfil
  desc: Test script abused for exfiltration
  crit: suspicious
  conf: 0.9
  attack: "T1059"
  all:
  - id: test-script-exfil
  - id: install-script-exfil
        # Redundancy pattern: multiple hooks all have network commands
- id: npm-preinstall-base64-host-profile-exfil
  desc: npm preinstall exfils base64 host profile
  crit: hostile
  conf: 0.99
  attack: "T1195.002, T1041"
  mbc: "E1041"
  all:
  - id: objectives/supply-chain/install-hook/scripts/declaration::has-preinstall
  - id: script-multi-param-exfil
  - id: script-sysinfo-cmd
  - id: objectives/supply-chain/install-hook/scripts/encoded-body::script-base64
  - id: objectives/supply-chain/install-hook/scripts/remote-fetch::download-tools
  - id: objectives/supply-chain/install-hook/scripts/remote-fetch::script-http-url
- id: npm-redundant-base64-host-profile-exfil
  desc: redundant npm hooks exfil host profile
  crit: hostile
  conf: 0.99
  attack: "T1195.002, T1041"
  mbc: "E1041"
  all:
  - id: npm-preinstall-base64-host-profile-exfil
  - id: objectives/supply-chain/install-hook/scripts/declaration::multiple-install-hooks
# An install lifecycle hook that detaches a child and grants a remote Deno
# stage all permissions is an intent-level supply-chain dropper pattern. The
# runtime/IP and package names are deliberately not part of the signature.
- id: notify-pingback-install
  desc: Install hook runs notify.js pingback script
  crit: suspicious
  conf: 0.95
  attack: "T1195.002"
  any:
  - id: objectives/supply-chain/install-hook/scripts/local-script::postinstall-notify-js
  - id: objectives/supply-chain/install-hook/scripts/local-script::postinstall-notify-js-path
# Dead-hook staging: postinstall runs `node init.js` while the published
# `files` allowlist omits init.js (and no init.js member is present). Do not
# require has-postinstall / has-files-field — those suppress when a clone keeps
# upstream test/release scripts or any devDependencies, which is exactly how
# hollow string-format republishes stage before shipping the Solana C2 payload.
- id: preinstall-node-https-system-profile-exfil
  desc: preinstall exfiltrates host user info via HTTPS
  crit: hostile
  conf: 0.995
  attack: "T1195.002, T1041, T1082, T1033"
  mbc: "E1041"
    # hostname + username + https.get inside an inline node -e preinstall is
    # already a conclusive host-profile beacon. os.platform is one of several
    # corroborating signals, not a hard requirement — real beacons (e.g. the
    # OAST dependency-confusion variant) read only hostname+username and add a
    # profile query key or a DNS-exfil channel instead.
  all:
  - id: objectives/supply-chain/install-hook/scripts/declaration::has-preinstall
  - id: objectives/supply-chain/install-hook/scripts/encoded-body::encoded-npm-cmd
  - id: objectives/supply-chain/install-hook/scripts/remote-fetch::preinstall-node-https-get
  - id: preinstall-node-os-hostname
  - id: preinstall-node-os-userinfo
  any:
  - id: preinstall-node-os-platform
  - id: preinstall-url-query-profile-keys
  - id: preinstall-node-dns-lookup
- id: preinstall-webhook-system-profile-exfil
  desc: preinstall sends host user platform to webhook.site
  crit: hostile
  conf: 0.995
  attack: "T1195.002, T1041, T1082, T1033"
  mbc: "E1041"
  all:
  - id: objectives/supply-chain/install-hook/scripts/declaration::has-preinstall
  - id: preinstall-webhook-site-url
  - id: objectives/supply-chain/install-hook/scripts/remote-fetch::preinstall-node-https-get
  - id: preinstall-node-os-hostname
  - id: preinstall-node-os-userinfo
  any:
  - id: preinstall-node-os-platform
  - id: preinstall-url-query-profile-keys
- id: postinstall-webhook-install-beacon
  desc: postinstall sends install callback to webhook.site
  crit: hostile
  conf: 0.99
  attack: "T1195.002, T1041"
  mbc: "E1041"
  all:
  - id: objectives/supply-chain/install-hook/scripts/declaration::has-postinstall
  - id: postinstall-webhook-site-url
  any:
  - id: objectives/supply-chain/install-hook/scripts/encoded-body::encoded-npm-cmd
  - id: objectives/supply-chain/install-hook/scripts/import-chain::scripts-postinstall-node-e
- id: preinstall-webhook-install-beacon
  desc: preinstall sends install callback to webhook.site
  crit: hostile
  conf: 0.99
  attack: "T1195.002, T1041"
  mbc: "E1041"
  all:
  - id: objectives/supply-chain/install-hook/scripts/declaration::has-preinstall
  - id: preinstall-webhook-site-url
  any:
  - id: objectives/supply-chain/install-hook/scripts/encoded-body::encoded-npm-cmd
  - id: objectives/supply-chain/install-hook/scripts/import-chain::scripts-preinstall-node-e
- id: install-webhook-install-beacon
  desc: install sends install callback to webhook.site
  crit: hostile
  conf: 0.99
  attack: "T1195.002, T1041"
  mbc: "E1041"
  all:
  - id: objectives/supply-chain/install-hook/scripts/declaration::has-install
  - id: install-webhook-site-url
  any:
  - id: objectives/supply-chain/install-hook/scripts/encoded-body::encoded-npm-cmd
  - id: objectives/supply-chain/install-hook/scripts/local-script::install-runs-node-local-script
- id: preinstall-depconf-webhook-profile-exfil
  desc: dependency-confusion preinstall phones host profile home
  crit: hostile
  conf: 0.995
  attack: "T1195.002, T1041"
  mbc: "E1041"
  all:
  - id: objectives/supply-chain/install-hook/scripts/declaration::has-preinstall
  - id: preinstall-webhook-site-url
  - id: objectives/supply-chain/install-hook/scripts/remote-fetch::preinstall-node-https-get
  - id: preinstall-node-os-hostname
  - id: preinstall-node-os-userinfo
  - id: objectives/supply-chain/recon-exfil/inline::desc-dependency-confusion
  any:
  - id: preinstall-node-os-platform
  - id: preinstall-url-query-profile-keys
  - id: metadata/package/versioning/sentinel::npm-version-inflated-major
  - id: objectives/supply-chain/install-hook/package/manifest::fake-security-research
