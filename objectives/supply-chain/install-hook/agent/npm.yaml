defaults:
  platforms: [unix, windows]
  for: [shell, javascript, package.json]
  attack: "T1195.002,T1059,T1222.002"

composite_rules:
  # Copying the worker, marking it executable, pointing it at a home dotdir and
  # launching the agent unrestricted is ONE installer script's behaviour. Held
  # at archive scope the four legs were satisfiable from four unrelated corners
  # of a large source tree -- openviking (ByteDance's context database) matched
  # with the postinstall in npm/cli/package.json, the copy in
  # examples/openclaw-plugin/, the chmod in examples/memory-plugin-shared/, the
  # agent call in benchmark/locomo/claudecode/ and the dotdir in any of forty
  # files. Only the hook declaration is a manifest-level fact.
  - id: installer-stages-unrestricted-agent-worker
    desc: Script stages and launches an unrestricted agent
    crit: suspicious
    conf: 0.95
    scope: file
    for: [javascript]
    all:
      - id: micro-behaviors/fs/file/copy::fs-copyfileSync
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/agent::claude-dangerous-agent-session
      - id: micro-behaviors/fs/path/location::node-homedir-hidden-entry
  - id: npm-postinstall-installs-unrestricted-claude-worker
    desc: npm hook installs an unrestricted Claude task worker
    crit: hostile
    conf: 0.99
    for: [npm, shell, javascript, package.json]
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/declaration::postinstall-hook-declaration
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: installer-stages-unrestricted-agent-worker
    unless:
      - id: well-known/app/productivity/exocortex::kitelev-exocortex-cli-context
      - id: well-known/app/ai/knowledge/lean-ctx::source-tree-path
  # Install-time code that installs or refreshes AI-agent integrations
  # (Claude/Codex/Cursor plugin and skills directories under the user's home)
  # is a fast-growing supply-chain surface: the hook runs with the installer's
  # privileges and mutates configuration that coding agents later trust. It
  # is also legitimate product behavior for agent toolkits, so this rolls up
  # the neutral facts at notable and lets behavior elsewhere escalate.
  - id: npm-postinstall-configures-agent-integration
    desc: npm postinstall hook configures AI-agent integration
    crit: notable
    conf: 0.9
    for: [npm, shell, javascript, package.json]
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/declaration::postinstall-hook-declaration
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: micro-behaviors/fs/path/agent-config/
