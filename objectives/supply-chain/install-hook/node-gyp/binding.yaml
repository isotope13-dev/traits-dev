# Concealed execution through node-gyp configuration. Ordinary command
# substitution observations live in process/create/shell/command-string.
defaults:
  platforms: [unix, windows]
  for: [gyp]
  attack: T1195.002
  mbc: B0024
traits:
  # gyp `conditions` entries are `[<expr-string>, {then-dict}]`; the subclass
  # traversal hides in that expression string. gyp evaluates a top-level
  # `conditions` block during `node-gyp configure` regardless of any target,
  # which is the configure-time escape this campaign uses. The value tree only
  # resolves this now that filefacts parses gyp's Python-literal syntax (byte
  # escapes included) — before, the old `targets[*].conditions[*][0]` path
  # could never fire (conditions here sit at the manifest root, not per-target,
  # and gyp had no value tree at all). The per-target form is still covered by
  # the file-level `python-subclasses-call` text trait.
  - id: gyp-condition-python-subclass-traversal
    desc: gyp condition enumerates runtime subclasses
    crit: suspicious
    conf: 0.99
    if:
      type: value
      path: conditions[*][0]
      regex: '__subclasses__\s*\('
  # A gyp string value written as byte escapes — e.g. `"type":"\x6e\x6f\x6e\x65"`
  # (="none"), or `\U`-escaped keywords. A build manifest is human-authored
  # config; there is no reason to escape a plain keyword byte-by-byte except to
  # keep it out of a reviewer's eye and out of naive grep. Independent of the
  # Python-escape payload: the concealment itself is the tell, and it generalizes
  # to any config that hides an otherwise-printable value behind \x / \U escapes.
  - id: gyp-hex-escaped-string-value
    desc: gyp string value hidden behind byte escapes
    crit: suspicious
    conf: 0.9
    attack: T1027
    # `type: raw`, not text: string extraction decodes `\xNN`/`\U…` escapes to
    # their characters (so a text matcher would see `none`, not `\x6e…`). This
    # rule detects the *concealment syntax itself*, which only survives in the
    # undecoded bytes.
    if:
      type: raw
      regex: '"\s*(\\x[0-9a-fA-F]{2}|\\U[0-9a-fA-F]{8}|\\u[0-9a-fA-F]{4}){2,}\s*"'

composite_rules:
  # Staged delivery: a tiny install-hook entry decrypts a co-shipped high-entropy
  # `.bin` blob instead of inlining a megabyte char-code line in `index.js`.
  - id: gyp-runs-staged-encrypted-bin-sidecar
    desc: binding.gyp hook with encrypted binary sidecar payload
    crit: hostile
    conf: 0.98
    for: [npm, tar, javascript, gyp]
    scope: archive
    all:
      - id: micro-behaviors/process/create/shell/command-string::gyp-source-command-expansion
      - id: metadata/package/files/name::archive-bin-member
    any:
      - id: objectives/anti-static/obfuscation/encoding/numeric::numeric-reconstruction-with-eval-syntax
      - id: objectives/anti-static/obfuscation/encoding/numeric::charcode-packed-numeric-source
      - id: micro-behaviors/crypto/decrypt::node-aes-gcm-hex-input-and-tag-slice
      - id: micro-behaviors/crypto/decrypt::node-aes-gcm-decipher-initialization
      - id: micro-behaviors/data/decode/hex::node-update-with-hex-buffer
  # Same cross-file chain for the Python object-graph escape variant used in the
  # `conditions` block (rather than a `sources` command expansion): the escape's
  # only job is to `os.system("node <co-shipped>.js")`, and the archive ships
  # that co-shipped file as a packed single-line eval dropper. Ties the install
  # trigger to the payload it launches, filename-agnostic, so a renamed loader
  # or reshuffled binding.gyp on the next wave still lands here.
  - id: gyp-python-escape-runs-bundled-dropper
    desc: binding.gyp Python escape launches a co-shipped packed dropper
    crit: hostile
    conf: 0.98
    attack: T1059.006,T1195.002
    for: [npm, tar, javascript, python, gyp]
    scope: archive
    all:
      - id: objectives/execution/exploit/sandbox-escape::python-object-graph-command-execution
    any:
      - id: objectives/anti-static/obfuscation/encoding/numeric::numeric-reconstruction-with-eval-syntax
      - id: objectives/anti-static/obfuscation/encoding/numeric::charcode-packed-numeric-source
      - id: objectives/supply-chain/hidden-payload/eval::packed-charcode-indirect-eval-loader
  # npm automatically configures a published package whose root contains
  # binding.gyp. Pair that archive member with the complete evaluator escape;
  # the generic sandbox-escape finding remains accurate outside npm packages.
  - id: gyp-python-eval-sandbox-escape
    desc: npm binding.gyp Python escape executes command
    crit: hostile
    conf: 0.995
    attack: T1059.006,T1195.002
    for: [npm, tar, python, gyp]
    scope: archive
    all:
      - id: metadata/package/files/included::binding-gyp-manifest
      - id: objectives/execution/exploit/sandbox-escape::python-object-graph-command-execution

  - id: gyp-condition-install-command-execution
    desc: gyp condition escapes Python eval for command exec
    crit: hostile
    conf: 0.999
    attack: T1059.006,T1195.002
    all:
      - id: gyp-condition-python-subclass-traversal
      - id: objectives/execution/exploit/sandbox-escape::python-object-graph-command-execution
