defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  attack: T1105
  mbc: E1105


composite_rules:
  - id: python-import-urllib-alias-process
    desc: Import-time urllib alias and process clues
    crit: hostile
    conf: 0.97
    attack: T1105,T1059.006
    scope: file
    all:
      - id: metadata/import/python/urllib/request
      - id: micro-behaviors/communications/http/lib/urllib::urllib-import-alias-urlretrieve
      - id: micro-behaviors/process/create/subprocess/launch::process-execution
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
    any:
      - id: micro-behaviors/process/create/subprocess/launch::python-subprocess-string-command
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system-string-command
# Do not infer a fetch-and-execute chain from file-wide co-occurrence of a
# urllib import, any shell script path, and any process call. Those facts must
# be connected by a data/control-flow matcher before supporting this objective.
  - id: python-github-response-write-startfile
    desc: Import-time GitHub fetch, write and startfile
    crit: hostile
    conf: 0.99
    near_lines: 40
    all:
      - id: metadata/file/size::init-py-file
      - id: well-known/app/development/code-forge/github::github-raw-executable-url
      - id: micro-behaviors/communications/url/http-path/resource::mutable-branch-ref-path
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/communications/http/client/response-body::python-client-response-body-cooccurrence
      - id: micro-behaviors/fs/file/open::binary-write-mode
      - id: micro-behaviors/process/create/shellexec::os-startfile-call
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
