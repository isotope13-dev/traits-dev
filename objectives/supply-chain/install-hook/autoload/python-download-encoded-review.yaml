defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  attack: T1105
  mbc: E1105

composite_rules:
  - id: python-c-base64-decoded-at-import
    desc: Import-time Python command and Base64 clues
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.006
    mbc: B0032,E1059.006
    near_lines: 12
    all:
      - id: metadata/lang/source/literal/array::python-variable-minus-c-argument-array
      - id: micro-behaviors/data/decode/base64::b64decode-call
      - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
    unless:
      - id: metadata/package/testing/presence/harness::verified-python-test-file
  - id: python-import-hidden-iwr-start
    desc: Import-time hidden download and launch clues
    crit: hostile
    conf: 0.97
    attack: T1105,T1059.001
    scope: file
    near_lines: 30
    all:
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
      - id: micro-behaviors/communications/http/download/helper::python-string-powershell-download-cradle
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::iwr-outfile-download
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/data/control-flow/module-exec::python-column0-noarg-call-assignment
  - id: python-import-hidden-powershell
    desc: Import-time hidden PowerShell clues
    crit: hostile
    conf: 0.96
    attack: T1059.001,T1564.003
    scope: file
    near_lines: 15
    all:
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
      - id: micro-behaviors/process/create/hidden::argv-array-windowstyle-hidden
      - id: "micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-text"
      - id: micro-behaviors/data/control-flow/module-exec::python-column0-noarg-call-assignment
