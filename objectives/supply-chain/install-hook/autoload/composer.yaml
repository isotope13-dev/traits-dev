# Composer `autoload.files` runs a PHP file on every `require vendor/autoload.php`
# -- the framework boot path -- with no call site anywhere in the consuming
# application. A translation or helper package whose autoloaded file reaches
# out to the network and spawns a process has turned that hook into an
# install-and-run trigger (laravel-lang, May 2026: src/helpers.php).
defaults:
  platforms: [windows, unix]
  for: [php, composer.json, archives]
  attack: T1195.002,T1105

composite_rules:
  - id: composer-autoload-silent-remote-stage
    desc: Composer autoload silently launches a remote stage
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1027,T1059.004,T1105
    all:
      - id: metadata/package/manifest/ecosystem::composer-files-autoload
      - id: micro-behaviors/process/create/shell/spawn::shell-execution-comp
      - id: objectives/evasion/process/hidden/execution::php-dual-platform-silent-launch
    any:
      - id: micro-behaviors/communications/http/client/file-read::php-http-file-request
      - id: micro-behaviors/communications/http/curl::php-curl-request
    needs: 1
  - id: composer-autoload-remote-stage-dropper
    desc: Composer-autoloaded file fetches and runs a remote stage
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/manifest/ecosystem::composer-files-autoload
      - id: objectives/command-and-control/dropper/delivery/download-execute::php-remote-stage-temp-interpreter-exec
  - id: composer-autoload-fetch-and-spawn
    desc: Composer-autoloaded package fetches a URL and spawns a process
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: metadata/package/manifest/ecosystem::composer-files-autoload
      - id: micro-behaviors/process/create/shell/spawn::shell-execution-comp
    any:
      - id: micro-behaviors/communications/http/client/file-read::php-http-file-request
      - id: micro-behaviors/communications/http/curl::php-curl-request
    unless:
      - id: metadata/package/testing/harness/unit/
      - id: well-known/lib/runtime/php-runtime::source-tree
  # The full malicious-autoload shape: the hook file decodes its staging host
  # from a chr() list (no fetchable literal for a scanner), launches the
  # dropped stage silently on both Windows and Unix, and gates re-execution
  # on a per-host marker in temp. Each leg fires below hostile on its own;
  # together in one autoloaded package they are a dropper, not a helper.
  - id: composer-autoload-obfuscated-gated-dropper
    desc: Composer-autoloaded dropper with obfuscated staging and host-gated silent launch
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/manifest/ecosystem::composer-files-autoload
      - id: objectives/anti-static/obfuscation/string/encoding::array-map-chr-codepoint-list
      - id: objectives/evasion/process/hidden/execution::php-dual-platform-silent-launch
      - id: objectives/execution/condition/host-marker::host-digest-temp-marker-gate
    unless:
      - id: metadata/package/testing/harness/unit/
      - id: well-known/lib/runtime/php-runtime::source-tree
