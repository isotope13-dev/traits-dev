# An install hook that walks out of its own package directory and installs
# something into whatever project pulled it in. npm runs lifecycle scripts with
# the cwd set to the package's own folder inside `node_modules`; `cd ../..`
# leaves that folder and lands in the consumer's project root, where `npm i
# <other>` writes a dependency the consumer never asked for — into their
# `package.json` and their lock file, where it will be installed again on every
# future `npm ci`, by every teammate, in CI.
#
# That is a supply-chain foothold rather than an install step. A package that
# genuinely needs another package declares it in `dependencies`; the only reason
# to install it from a hook, from a directory that is not yours, is that you
# want the dependency to appear without having been declared. The escape is the
# part that carries the intent: `npm i` from a hook is merely irregular, but
# doing it in someone else's directory is reaching across a boundary.
#
# A `"private": true` manifest is never installed from a registry, so its hooks
# cannot reach a stranger's machine: monorepo apps use `cd ../lib && build` to
# prepare a sibling workspace, which is why the escape traits skip them.
#
# Written against the lifecycle hooks specifically. `cd ..` in a `build` or
# `test` script is ordinary monorepo plumbing; in `preinstall`/`install`/
# `postinstall` it runs on a stranger's machine. Prepare navigation is a
# neutral capability under micro-behaviors/fs/directory/chdir; source-repo
# builds routinely use it to reach sibling tooling.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: "T1195.002"
  mbc: E1195.002

traits:
  - id: preinstall-parent-directory-escape
    desc: preinstall leaves the package directory
    crit: suspicious
    conf: 0.93
    unless:
      - id: metadata/package/publishing::is-private
      - id: metadata/package/dependencies/manifest/source::npm-local-dependencies
    if:
      type: value
      path: scripts.preinstall
      # npm starts a lifecycle hook in the package directory under node_modules.
      # Two or more parent segments can reach the consumer project; `cd ../`
      # after first entering a package-owned subdirectory can just move between
      # this repository's workspaces.
      regex: '^\s*(cd|pushd)\s+["'']?(\.\.[/\\]){2,}'
  - id: install-parent-directory-escape
    desc: install hook leaves the package directory
    crit: suspicious
    conf: 0.93
    unless:
      - id: metadata/package/publishing::is-private
      - id: metadata/package/dependencies/manifest/source::npm-local-dependencies
    if:
      type: value
      path: scripts.install
      regex: '^\s*(cd|pushd)\s+["'']?(\.\.[/\\]){2,}'
  # `node ../scripts/link.mjs` names a workspace helper above the package.
  # It does not `cd` into the consumer project or install a dependency there.
  - id: postinstall-runs-parent-node-script
    desc: Postinstall runs a parent-directory Node script
    crit: notable
    conf: 0.9
    if:
      type: value
      path: scripts.postinstall
      regex: '^node\s+["'']?\.\./'
  - id: postinstall-parent-directory-escape
    desc: postinstall leaves the package directory
    crit: suspicious
    conf: 0.93
    # Multi-root VS Code extensions commonly install their client and server
    # subprojects in sequence (`cd client ... cd ../server`). The parent
    # segment returns from one child to the extension root; it does not cross
    # the package boundary that this objective describes.
    unless:
      - id: well-known/lib/development/extension::vscode-workspace-install-extension
      - id: micro-behaviors/os/package-manager/hook-install::postinstall-nested-subdir-bare-install
      - id: metadata/package/publishing::is-private
      - id: metadata/package/dependencies/manifest/source::npm-local-dependencies
    if:
      type: value
      path: scripts.postinstall
      regex: '^\s*(cd|pushd)\s+["'']?(\.\.[/\\]){2,}'

composite_rules:
  # Parent-directory navigation plus an explicit package argument proves the
  # hook is adding a dependency from outside its own package. A bare install
  # can only resolve dependencies already declared by the current project.
  - id: install-hook-injects-consumer-dependency
    desc: Install hook installs a package into the consumer project
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/os/package-manager/hook-install::install-hook-runs-pkg-install
      - id: objectives/supply-chain/install-hook/package/manifest::install-hook-adds-explicit-dependency
    any:
      - id: preinstall-parent-directory-escape
      - id: install-parent-directory-escape
      - id: postinstall-parent-directory-escape
      - id: micro-behaviors/fs/directory/chdir::npm-prepare-parent-directory
