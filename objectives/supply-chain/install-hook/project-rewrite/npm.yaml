defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]

traits:
  - id: postinstall-host-entry-write
    desc: Install helper writes a host source entry
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    # Test fixtures commonly create `src/index.*` files with writeFileSync.
    # They are not install-time host-project rewrites and must not satisfy the
    # package-level composite when the archive also declares a postinstall.
    unless:
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
      # A project scaffolder ("Scaffold a new ... project") writes the
      # `src/index.*` of the directory it was asked to create, from its own
      # arguments; it is a shipped tool, not an install-time rewrite.
      - type: text
        regex: '(?i)\bscaffold(s|ing)?\s+an?\s+new\b'
    if:
      type: text
      regex: '(?is)writeFileSync\s*\([^)]{0,160}src/(main|index)\.[a-z]+'
  - id: workflow-template-package-registry-beacon
    desc: Workflow POSTs package registry metadata
    crit: suspicious
    conf: 0.92
    for: [javascript, typescript, shell, github-actions]
    if:
      type: text
      regex: '(?i)api/package-registry'

composite_rules:
  - id: postinstall-host-project-rewrite
    for: [npm, package.json, javascript, typescript]
    desc: Install hook rewrites host project source or config
    crit: suspicious
    conf: 0.96
    attack: "T1195.002"
    # The manifest hook delegates to a sibling helper; requiring all legs in
    # one leaf file misses the package-level rewrite behavior.
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync
    any:
      - id: postinstall-host-entry-write
      - id: micro-behaviors/fs/write/file/full::node-prepends-import-to-source
    unless:
      - id: well-known/app/development/codeam-cli::codeam-cli-benign-maintenance-context
  - id: postinstall-project-rewrite-with-browser-exfil
    for: [npm, package.json, javascript, typescript]
    desc: Install hook rewrites host project and installs browser identity exfiltration
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1119,T1041"
    scope: archive
    all:
      - id: postinstall-host-project-rewrite
      - id: objectives/credential-access/browser/account-page::browser-auth-response-identity-interception
      - id: micro-behaviors/data/property/assign::user-identity-field-assignment
      - id: objectives/exfiltration/sensitive-data/browser::browser-activity-upload-path
      - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: postinstall-project-rewrite-with-form-exfil
    for: [npm, package.json, javascript, typescript]
    desc: Install hook injects remote browser form collection
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1056.001,T1041"
    scope: archive
    all:
      - id: postinstall-host-project-rewrite
      - id: objectives/exfiltration/stealer/input::browser-form-values-remote-activity-api
  - id: npm-postinstall-package-registry-workflow-beacon
    for: [npm, package.json, javascript, typescript]
    desc: postinstall adds workflow reporting repos to external registry
    crit: hostile
    conf: 0.98
    attack: "T1195.002,T1041"
    mbc: E1041
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: micro-behaviors/fs/write/file/target::node-writes-github-config-path
      - id: workflow-template-package-registry-beacon
      - id: micro-behaviors/communications/http/curl::curl-post-flag
