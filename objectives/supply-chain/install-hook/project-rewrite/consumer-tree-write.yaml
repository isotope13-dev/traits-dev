# Package-environment/exit observations retained independently of file writes.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002
  mbc: B0024

composite_rules:
  # A hook that asks whether it is running inside its own package and exits if
  # it is has drawn a line between the publisher's machine and everyone else's.
  # The benign reading is "don't run during our own build", and that is usually
  # what it means -- but it is also the cheapest possible targeting gate, and it
  # guarantees the behaviour never fires in the one environment whose owner
  # would recognise it. `npm_package_name` is npm's answer to "whose install is
  # this"; comparing it to a literal and leaving is the whole pattern.
  #
  # Notable on its own: the gate says nothing about what is being gated. It
  # earns its place by making the composites above readable -- a hook that both
  # excuses itself from its own tree and writes into everyone else's has
  # described its audience.
  - id: install-hook-skips-own-package
    desc: Install hook exits inside its own package
    crit: notable
    conf: 0.88
    scope: file
    near_lines: 4
    all:
      - id: metadata/package/files/lifecycle::postinstall-js-file
      - id: micro-behaviors/os/env/package-manager::npm-package-info
      - id: micro-behaviors/process/exit/terminate::js-process-exit-zero
