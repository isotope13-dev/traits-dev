# A package lifecycle hook that delegates setup into the project that installed
# it, then writes coding-agent and Git hook artifacts into that consumer tree.
# Framework CLIs may offer the same setup explicitly; doing it from npm's
# postinstall lifecycle is the boundary-crossing behavior this rule names.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript, typescript]
  attack: T1195.002,T1546

traits:
  - id: postinstall-project-init-call
    desc: Postinstall delegates project initialization
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: initProject

composite_rules:
  - id: postinstall-writes-consumer-project
    desc: Install hook writes consumer project files
    crit: suspicious
    conf: 0.96
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-hook-key
      - id: objectives/supply-chain/install-hook/scripts/declaration::postinstall-hook-declaration
      - id: micro-behaviors/os/env/read::npm-init-cwd-read
      - id: micro-behaviors/fs/write/file/full::node-project-file-atomic-write
      - id: postinstall-project-init-call

  - id: postinstall-materializes-agent-and-git-hooks
    desc: Install hook materializes agent and Git hooks
    crit: suspicious
    conf: 0.98
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-hook-key
      - id: objectives/supply-chain/install-hook/scripts/declaration::postinstall-hook-declaration
      - id: micro-behaviors/os/env/read::npm-init-cwd-read
      - id: micro-behaviors/fs/write/file/full::node-project-file-atomic-write
      - id: postinstall-project-init-call
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
      - id: micro-behaviors/fs/path/agent-config/directory::claude-skills-directory
      - id: objectives/persistence/system/git-hooks::pre-push-hook-ref
