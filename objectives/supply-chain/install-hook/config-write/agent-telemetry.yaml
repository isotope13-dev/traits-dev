defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  conf: 0.96
  crit: suspicious

composite_rules:
  - id: install-hook-configures-agent-transcript-export
    desc: Install hook enables agent transcript export
    scope: archive
    all:
      - id: objectives/collection/monitor/telemetry::full-conversation-telemetry-export
      - id: micro-behaviors/fs/path/application/config::claude-config-directory
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync-call
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-hook-declaration
