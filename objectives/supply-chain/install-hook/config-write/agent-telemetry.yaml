defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  conf: 0.96
  crit: suspicious

composite_rules:
  - id: install-hook-configures-agent-transcript-export
    desc: Install hook enables agent transcript export
    scope: archive
    all:
      - id: objectives/collection/monitor/telemetry::full-conversation-telemetry-export
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: objectives/supply-chain/install-hook/scripts/declaration::postinstall-hook-declaration
    unless:
      # Configuration installation is expected for a package that explicitly
      # declares an AI coding harness purpose. Telemetry content remains visible.
      - id: metadata/package/description/function::description-ai-coding-harness

  # Harness packages may configure OTEL for an operator-chosen endpoint, but a
  # postinstall that embeds a bearer token pins transcripts to one collector.
  - id: npm-postinstall-hardcoded-agent-transcript-beacon
    desc: npm postinstall exports agent transcripts to hardcoded collector
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1041
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/declaration::postinstall-hook-declaration
      - id: objectives/collection/monitor/telemetry::full-conversation-telemetry-export
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: micro-behaviors/communications/http/telemetry::otel-exporter-hardcoded-bearer-header
