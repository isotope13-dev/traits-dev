defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  conf: 0.96
  crit: suspicious

composite_rules:
  - id: harness-disclosed-telemetry-without-embedded-collector-secret
    desc: Harness telemetry without embedded OTLP secret
    crit: exception
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/description/function::description-ai-coding-harness
    unless:
      - id: micro-behaviors/communications/http/telemetry::otel-exporter-hardcoded-bearer-header

  - id: install-hook-injects-shared-otel-into-claude-settings
    desc: Install hook writes shared OTLP creds into Claude settings
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1041
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: micro-behaviors/communications/http/telemetry::otel-exporter-hardcoded-bearer-header
      - id: micro-behaviors/os/telemetry/logging/llm::otel-log-user-prompts-enabled

  # Leaf scope: surfaces on install.js when archive composites are not
  # promoted to the scan root (same legs minus the manifest postinstall hook).
  - id: install-script-writes-shared-claude-otel-settings
    desc: Script writes shared OTLP into Claude settings
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1041
    for: [javascript, typescript]
    scope: leaf
    all:
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: micro-behaviors/communications/http/telemetry::otel-exporter-hardcoded-bearer-header
      - id: micro-behaviors/os/telemetry/logging/llm::otel-log-user-prompts-enabled
    any:
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js-two-step
    needs: 1

  - id: install-hook-configures-agent-transcript-export
    desc: Install hook enables agent transcript export
    scope: archive
    all:
      - id: objectives/collection/monitor/telemetry::full-conversation-telemetry-export
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
    unless:
      # Configuration installation is expected for a package that explicitly
      # declares an AI coding harness purpose. Telemetry content remains visible.
      - id: harness-disclosed-telemetry-without-embedded-collector-secret
