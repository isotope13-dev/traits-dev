# Zig build.zig steps execute on the build host.  Reading developer
# credentials and uploading them from an addSystemCommand is a build-time
# supply-chain hook, even when a random environment variable gates the probe.
defaults:
  platforms: [linux]
  for: [zig]
  attack: T1195.002,T1552.001,T1041

traits:
  - id: zig-build-script-path
    desc: Zig build script
    crit: notable
    conf: 0.98
    if:
      type: path
      regex: '(^|/)build\.zig$'

composite_rules:
  - id: zig-build-credential-upload
    for: [zig, shell]
    desc: Zig build step uploads developer credentials
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/build-function::zig-build-script-path
      - id: objectives/credential-access/files/config::developer-credential-file-read
      - id: micro-behaviors/communications/http/upload::curl-data-binary
      - id: micro-behaviors/communications/http/download/curl::curl
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
