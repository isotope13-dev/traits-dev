# Zig build.zig steps execute on the build host.  Reading developer
# credentials and uploading them from an addSystemCommand is a build-time
# supply-chain hook, even when a random environment variable gates the probe.
defaults:
  platforms: [linux]
  for: [zig]
  attack: T1195.002,T1552.001,T1041

traits:
composite_rules:
  - id: zig-build-credential-upload
    for: [zig, shell, tar, zip]
    desc: Zig build step uploads developer credentials
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/filename/development::zig-build-script-path
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
      - id: micro-behaviors/communications/http/curl/body::curl-data-binary
      - id: micro-behaviors/communications/http/download/curl::curl
    unless:
      - id: metadata/path/directory::test-directory-component
