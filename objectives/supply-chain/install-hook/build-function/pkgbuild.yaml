# PKGBUILD build-phase execution anomalies (T1195.002).
#
# pkgver(), prepare(), and build() run on the BUILDER's machine during makepkg
# (pkgver() even during AUR-helper update checks) — before, and independent of,
# the package being installed. The legitimate channel for external inputs is the
# checksummed source=() array; code in these functions that fetches more code,
# executes a non-extracted blob, decodes-and-runs a payload, escalates with
# sudo, or persists into the builder's HOME is a supply-chain compromise of the
# build host. Build-phase network fetching is a neutral capability; the
# objective composites below add lifecycle context and anomalous combinations
# that supply intent.
defaults:
  platforms: [linux]
  for: [shell]
  attack: T1195.002

traits:
  - id: pkgbuild-build-script-invoke
    desc: PKGBUILD runs a source shell script
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(sh|bash)\s+["'']?\$?srcdir/'

composite_rules:
  - id: pkgbuild-pkgver-dynamic-exec
    # pkgver() should only print a version string. Decoding a payload, or
    # piping fetched bytes to a shell there, is pre-install code execution that
    # fires during routine AUR update checks. A normal curl|grep|sed version
    # lookup is only build-time network use and is not execution.
    desc: PKGBUILD pkgver() evaluates or executes fetched content
    crit: hostile
    conf: 0.94
    near_lines: 20
    all:
      - id: metadata/build/package::pkgbuild-pkgver-fn
    any:
      - id: micro-behaviors/process/interpreter/eval::shell-eval
      - id: micro-behaviors/data/runtime/keywords::pipe-to-shell

  - id: pkgbuild-build-floating-branch-fetch
    desc: PKGBUILD build phase fetches mutable branch content
    crit: suspicious
    conf: 0.92
    near_lines: 25
    all:
      - id: metadata/build/package::pkgbuild-build-fn
      - id: micro-behaviors/communications/http/download/package::pkgbuild-build-phase-fetch
      - id: micro-behaviors/communications/http/url/path::mutable-branch-ref-path
    unless:
      - id: metadata/package/quality/recognized-contexts::openshift-vale-download-context
      - id: metadata/package/quality/recognized-contexts::openshift-istio-download-context
      - id: micro-behaviors/communications/http/download/shell::curl-wget-onnx-asset
      - id: micro-behaviors/communications/http/download/shell::curl-wget-image-asset
      - id: micro-behaviors/communications/http/download/shell::curl-wget-audio-asset

  - id: pkgbuild-build-fetch-extract-execute
    desc: PKGBUILD build phase fetches, extracts, and runs a remote script
    crit: hostile
    conf: 0.96
    near_lines: 40
    all:
      - id: metadata/build/package::pkgbuild-build-fn
      - id: micro-behaviors/communications/http/download/package::pkgbuild-build-phase-fetch
      - id: micro-behaviors/data/archive/extract/tar::tar-gzip-extract
      - id: pkgbuild-build-script-invoke

  - id: pkgbuild-noextract-manual-exec
    # noextract keeps a downloaded source unextracted; running it directly
    # (./blob, sh blob, eval) executes fetched bytes without the usual review.
    desc: PKGBUILD runs a non-extracted source directly
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/build/package::pkgbuild-noextract-nonempty
    any:
      - id: objectives/command-and-control/dropper/execution/pipe::execute-dot-slash
      - id: micro-behaviors/data/runtime/keywords::pipe-to-shell
    unless:
      - id: micro-behaviors/data/archive/extract/capability::appimage-self-extract-command
      # Pinned binary-release repackagers commonly keep an installer/executable
      # unextracted and invoke the package tool (7z/asar) on it explicitly.
      - id: metadata/package/manifest/repository::pkgbuild-pinned-binary-release-repackager

  - id: pkgbuild-build-sudo
    # build()/prepare() run in fakeroot; a real sudo/doas there is an attempt to
    # mutate the live host during the build, not legitimate packaging.
    desc: PKGBUILD build phase uses sudo to elevate
    crit: suspicious
    conf: 0.85
    near_lines: 25
    all:
      - id: micro-behaviors/os/privilege/elevation::sudo-command-invoke
    any:
      - id: metadata/build/package::pkgbuild-build-fn
      - id: metadata/build/package::pkgbuild-prepare-fn

  - id: pkgbuild-unverified-sudo-source-exec
    # An integrity-disabled source entry is executed as root on the builder,
    # before package installation. This is the complete builder-compromise
    # chain, not merely an unusual use of sudo.
    desc: PKGBUILD sudo-runs an unverified source entry
    crit: hostile
    conf: 0.99
    near_lines: 30
    all:
      - id: pkgbuild-build-sudo
      - id: metadata/build/package::pkgbuild-checksum-skip
      - id: micro-behaviors/process/create/direct::pkgbuild-sudo-srcdir-entry

  - id: pkgbuild-build-home-persistence
    # build()/prepare() runs as the developer, so writing into the builder's own
    # shell rc or authorized_keys backdoors the build host / CI runner itself.
    desc: PKGBUILD build phase persists into builder HOME
    crit: hostile
    conf: 0.92
    near_lines: 25
    all:
      - id: micro-behaviors/fs/file/write/redirect::shell-rc-redirect-write
    any:
      - id: metadata/build/package::pkgbuild-build-fn
      - id: metadata/build/package::pkgbuild-prepare-fn
