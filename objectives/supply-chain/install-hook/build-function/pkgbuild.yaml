# PKGBUILD build-phase execution anomalies (T1195.002).
#
# pkgver(), prepare(), and build() run on the BUILDER's machine during makepkg
# (pkgver() even during AUR-helper update checks) — before, and independent of,
# the package being installed. The legitimate channel for external inputs is the
# checksummed source=() array; code in these functions that fetches more code,
# executes a non-extracted blob, decodes-and-runs a payload, escalates with
# sudo, or persists into the builder's HOME is a supply-chain compromise of the
# build host. Build-phase network fetching is a neutral capability; the
# objective composites below add lifecycle context and anomalous combinations
# that supply intent.
defaults:
  platforms: [linux]
  for: [shell]
  attack: T1195.002

traits:
  - id: pkgbuild-build-script-invoke
    desc: PKGBUILD runs a source shell script
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(sh|bash)\s+["'']?\$?srcdir/'

composite_rules:
  - id: pkgbuild-build-phase-obfuscated-shell-delivery
    desc: PKGBUILD build phase decodes and executes a shell downloader
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.004,T1105,T1195.002
    scope: file
    all:
      - id: metadata/build/package/recipe::pkgbuild-build-fn
      - id: objectives/anti-static/obfuscation/encoding/base64::base64-d-pipe-sh
      - id: objectives/anti-static/obfuscation/encoding/content::encoded-downloader-pattern
    unless:
      - id: well-known/tool/detection/security-scanner-identity::ks-aur-scanner-source-context
      - id: metadata/package/testing/presence/harness::test-directory-path

  - id: pkgbuild-build-phase-obfuscated-variable-stage
    desc: PKGBUILD combines encoded delivery with shell variable evaluation
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.004,T1105,T1195.002
    all:
      - id: metadata/build/package/recipe::pkgbuild-build-fn
      - id: micro-behaviors/process/create/eval::shell-eval-variable
      - id: objectives/anti-static/obfuscation/encoding/content::encoded-downloader-pattern
    unless:
      - id: well-known/tool/detection/security-scanner-identity::ks-aur-scanner-source-context
      - id: metadata/package/testing/presence/harness::test-directory-path

  - id: pkgbuild-build-phase-miner-launch
    desc: PKGBUILD build phase launches XMRig at a Stratum pool
    crit: hostile
    conf: 0.99
    attack: T1496,T1195.002
    all:
      - id: metadata/build/package/recipe::pkgbuild-build-fn
      - id: objectives/impact/cryptojacking/miner/tunnel::shell-xmrig-direct-invocation
      - id: micro-behaviors/communications/socket/tcp::stratum-tcp-url
      - id: micro-behaviors/fs/write/copy::coreutils-install-executable
    unless:
      - id: well-known/tool/detection/security-scanner-identity::ks-aur-scanner-source-context
      - id: metadata/package/testing/presence/harness::test-directory-path

  - id: pkgbuild-pkgver-dynamic-exec
    # pkgver() should only print a version string. Decoding a payload, or
    # piping fetched bytes to a shell there, is pre-install code execution that
    # fires during routine AUR update checks. A normal curl|grep|sed version
    # lookup is only build-time network use and is not execution.
    desc: PKGBUILD pkgver() evaluates or executes fetched content
    crit: hostile
    conf: 0.94
    near_lines: 20
    all:
      - id: metadata/build/package/recipe::pkgbuild-pkgver-fn
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval
      - id: micro-behaviors/data/runtime/keywords::pipe-to-shell

  - id: pkgbuild-phase-floating-branch-fetch
    desc: PKGBUILD phase fetches mutable branch content
    crit: suspicious
    conf: 0.92
    near_lines: 25
    all:
      - id: metadata/build/package/recipe::pkgbuild-build-fn
      - id: micro-behaviors/communications/http/download/package::pkgbuild-build-phase-fetch
      - id: micro-behaviors/communications/http/url/path::mutable-branch-ref-path
    unless:
      - id: well-known/app/infrastructure/openshift::openshift-vale-download-context
      - id: well-known/app/infrastructure/openshift::openshift-istio-download-context
      - id: micro-behaviors/communications/http/download/shell::curl-wget-onnx-asset
      - id: micro-behaviors/communications/http/download/shell::curl-wget-image-asset
      - id: micro-behaviors/communications/http/download/shell::curl-wget-audio-asset

  - id: pkgbuild-phase-fetch-extract-execute
    desc: PKGBUILD phase fetches, extracts, runs remote script
    crit: hostile
    conf: 0.96
    near_lines: 40
    all:
      - id: metadata/build/package/recipe::pkgbuild-build-fn
      - id: micro-behaviors/communications/http/download/package::pkgbuild-build-phase-fetch
      - id: micro-behaviors/data/archive/extract/tar::tar-gzip-extract
      - id: pkgbuild-build-script-invoke

  - id: pkgbuild-noextract-manual-exec
    # An executable-looking noextract entry plus ./ execution is materially
    # different from the common pattern of keeping an archive unextracted and
    # then invoking bsdtar/7z on it. Keep the broad noextract fact neutral.
    desc: PKGBUILD runs an executable noextract source
    crit: suspicious
    conf: 0.85
    near_lines: 80
    all:
      - id: metadata/build/package/recipe::pkgbuild-noextract-executable-entry
      - id: objectives/command-and-control/dropper/execution/pipe::execute-dot-slash
    unless:
      - id: micro-behaviors/data/archive/extract/capability::appimage-self-extract-command
      # Pinned binary-release repackagers commonly keep an installer/executable
      # unextracted and invoke the package tool (7z/asar) on it explicitly.
      - id: metadata/package/manifest/repository::pkgbuild-pinned-binary-release-repackager

  - id: pkgbuild-noextract-script-exec
    desc: PKGBUILD runs an executable noextract source script
    crit: suspicious
    conf: 0.9
    near_lines: 80
    all:
      - id: metadata/build/package/recipe::pkgbuild-noextract-executable-entry
      - id: pkgbuild-build-script-invoke

  - id: pkgbuild-noextract-piped-source
    desc: PKGBUILD pipes a noextract source into an interpreter
    crit: suspicious
    conf: 0.93
    near_lines: 40
    all:
      - id: metadata/build/package/recipe::pkgbuild-noextract-nonempty
      - id: micro-behaviors/process/create/direct::pkgbuild-src-pipe-shell

  - id: pkgbuild-phase-sudo
    # build()/prepare()/package() all run under fakeroot; a real sudo/doas in
    # any of them mutates the live host rather than packaging. package() is
    # the strictest case: its only job is copying files into $pkgdir.
    desc: PKGBUILD phase function elevates with sudo
    crit: suspicious
    conf: 0.85
    near_lines: 25
    all:
      - id: micro-behaviors/os/privilege/elevation::sudo-command-invoke
    any:
      - id: metadata/build/package/recipe::pkgbuild-build-fn
      - id: metadata/build/package/recipe::pkgbuild-prepare-fn
      - id: metadata/build/package/recipe::pkgbuild-package-fn
    unless:
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/fixture::pkgbuild-test-fixture-path
      - id: well-known/tool/detection/security-scanner-identity::ks-aur-scanner-source-context
      - id: micro-behaviors/os/package-manager/apt::apt-package-install-command

  - id: pkgbuild-unverified-sudo-source-exec
    # An integrity-disabled source entry is executed as root on the builder,
    # before package installation. This is the complete builder-compromise
    # chain, not merely an unusual use of sudo.
    desc: PKGBUILD sudo-runs an unverified source entry
    crit: hostile
    conf: 0.99
    near_lines: 30
    all:
      - id: pkgbuild-phase-sudo
      - id: metadata/build/package/recipe::pkgbuild-checksum-skip
      - id: micro-behaviors/process/create/direct::pkgbuild-sudo-srcdir-entry

  - id: pkgbuild-phase-home-persistence
    # build()/prepare() runs as the developer, so writing into the builder's own
    # shell rc or authorized_keys backdoors the build host / CI runner itself.
    desc: PKGBUILD phase persists into builder HOME
    crit: hostile
    conf: 0.92
    near_lines: 25
    all:
      - id: micro-behaviors/fs/file/write/redirect::shell-rc-redirect-write
    any:
      - id: metadata/build/package/recipe::pkgbuild-build-fn
      - id: metadata/build/package/recipe::pkgbuild-prepare-fn
      - id: metadata/build/package/recipe::pkgbuild-package-fn
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/fixture::pkgbuild-test-fixture-path
