# RubyGems runs extconf.rb during `gem install`. When it decodes a Base64 stage
# and spawns or evals a reverse shell, the native-extension build hook is the
# dropper — not ordinary mkmf probing.
defaults:
  platforms: [unix, windows]
  for: [ruby, gem]
  attack: T1195.002,T1059.004
  mbc: B0024

traits:
  - id: ruby-source-github-actions-marker
    desc: Ruby source references GITHUB_ACTIONS
    crit: notable
    conf: 0.92
    for: [ruby]
    if:
      type: text
      substr: GITHUB_ACTIONS

composite_rules:
  - id: extconf-base64-reverse-shell-stager
    desc: extconf.rb decodes Base64 reverse-shell stage
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/data/decode/base64::base64-decoding
      - id: objectives/anti-static/obfuscation/encoding/base64::base64-ruby-socket-require-fragment
    any:
      - id: micro-behaviors/process/create/direct::ruby-spawn
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval

  - id: extconf-base64-write-spawn-payload
    desc: extconf writes decoded Base64 then spawns Ruby
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/data/decode/base64::base64-decoding
      - id: micro-behaviors/fs/write/file/full::ruby-file-write-content
      - id: micro-behaviors/process/create/direct::ruby-spawn

  - id: extconf-ci-gated-base64-eval-stager
    desc: extconf skips CI hosts then evals decoded stage
    crit: hostile
    conf: 0.99
    attack: T1497,T1195.002,T1059.004
    scope: archive
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/data/decode/base64::base64-decoding
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval
      - id: objectives/anti-static/obfuscation/encoding/base64::base64-ruby-socket-require-fragment
      - id: ruby-source-github-actions-marker
