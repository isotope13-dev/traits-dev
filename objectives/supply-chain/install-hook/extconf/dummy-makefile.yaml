# Supply Chain: Dummy Makefile Detection
# Detects pre-packaged Makefiles designed to bypass build failures
# ATT&CK: T1195.002 (Compromise Software Supply Chain)
defaults:
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.9
traits:
  - id: empty-makefile-target-sequence
    desc: Empty all/install/clean target sequence
    crit: component
    conf: 0.95
    for: [ruby]
    if:
      type: text
      regex: '(?s)\n[ \t]*all:\s*\n[ \t]*install:\s*\n[ \t]*clean:\s*\n'
  - id: escaped-empty-makefile-target-sequence
    desc: Escaped empty Makefile target sequence
    crit: component
    conf: 0.95
    for: [ruby]
    if:
      # Quoted Ruby strings reconstruct these newlines when written.
      type: text
      regex: '\\n[ \t]*all:\s*\\n[ \t]*install:\s*\\n[ \t]*clean:\s*\\n'
composite_rules:
  - id: dummy-makefile
    desc: Dummy Makefile with empty install/all/clean targets (masks dropper failures)
    all:
      - id: metadata/build/make::makefile-basename
      - id: metadata/build/make::dummy-makefile-targets
  - id: extconf-writes-empty-makefile
    desc: extconf.rb writes a dummy Makefile with empty targets
    crit: suspicious
    conf: 0.95
    for: [ruby]
    scope: file
    all:
      - id: metadata/build/package/recipe::filename-extconf
      - id: micro-behaviors/fs/write/file/direct::ruby-makefile-write
    any:
      - id: objectives/supply-chain/install-hook/extconf::empty-makefile-target-sequence
      - id: objectives/supply-chain/install-hook/extconf::escaped-empty-makefile-target-sequence
  # The gem declares a native extension, but the recipe never calls mkmf --
  # it hand-writes a Makefile so `gem install` reports success, then talks to
  # the network. Nothing is compiled; the extension declaration exists only to
  # obtain code execution on the installing host. The `unless` keeps recipes
  # that really do build something (and merely stub a Makefile on unsupported
  # platforms) out of this.
  - id: extconf-fake-build-network-callback
    desc: extconf.rb writes a dummy Makefile and calls the network
    crit: hostile
    conf: 0.97
    for: [ruby]
    attack: T1195.002
    mbc: B0024
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/extconf::extconf-loads-relative-helper
      - id: objectives/supply-chain/install-hook/extconf::extconf-writes-empty-makefile
      - id: micro-behaviors/communications/http/request/netlib::ruby-http-request-call
    # Recipes that fetch a precompiled library instead of building one also
    # stub a Makefile, but they save what they fetched: a binary-mode write or
    # a stream copy means the request had a build purpose, so stay out.
    unless:
      - id: metadata/build/package/recipe::extconf-native-build-helper
      - id: micro-behaviors/fs/write/file/direct::ruby-file-open-write-binary
      - id: micro-behaviors/fs/write/file/direct::io-copy-stream
