defaults:
  for: [ruby]
  platforms: [unix]
traits:
  - id: ruby-shell-profile-encoded-callback
    desc: Encoded host user path callback command
    crit: suspicious
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((_ (assignment left: (identifier) @user right: (call receiver: (subshell) @who method: (identifier) @strip1))
            (assignment left: (identifier) @host right: (call receiver: (subshell) @hostname method: (identifier) @strip2))
            (assignment left: (identifier) @cwd right: (call receiver: (constant) @dir method: (identifier) @pwd))
            (assignment left: (identifier) @data right: (string
              (interpolation (identifier) @u) (string_content)
              (interpolation (identifier) @h) (string_content)
              (interpolation (identifier) @p)))
            (assignment left: (identifier) @encoded right: (call receiver: (call receiver: (array (identifier) @packed)
              method: (identifier) @pack arguments: (argument_list (string (string_content) @format))) method: (identifier) @delete))
            (call method: (identifier) @system arguments: (argument_list (string
              (interpolation (identifier) @sent)))))
          (#match? @who "whoami") (#match? @hostname "hostname")
          (#eq? @strip1 "strip") (#eq? @strip2 "strip") (#eq? @dir "Dir") (#eq? @pwd "pwd")
          (#eq? @user @u) (#eq? @host @h) (#eq? @cwd @p) (#eq? @data @packed)
          (#eq? @pack "pack") (#eq? @format "m0") (#eq? @delete "delete")
          (#eq? @system "system") (#eq? @encoded @sent))
composite_rules:
  - id: extconf-host-profile-shell-callback
    desc: Build hook launches encoded host-profile callback
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: ruby-shell-profile-encoded-callback
