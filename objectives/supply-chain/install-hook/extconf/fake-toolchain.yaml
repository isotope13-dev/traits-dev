# StubMaker-class RubyGems install hook: fake native-extension toolchain.
# Instead of compiling, the recipe writes empty Makefile targets and no-op
# compiler stand-ins (make_stub / make_stub.bat) so `gem install` reports
# success while a relative helper performs network fetch/exec.
#
# Technique class — not campaign-name gated. Future gems that stub the
# extension phase the same way should still match.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1195.002
  mbc: B0024

traits:
  - id: make-stub-unix-script
    desc: Writes a Unix make_stub no-op script
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bFile\.(write|open)\s*\(\s*[''"]make_stub[''"]'

  - id: make-stub-windows-batch
    desc: Writes a Windows make_stub.bat no-op script
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bFile\.(write|open)\s*\(\s*[''"]make_stub\.bat[''"]'

  - id: downloads-main-exe-path
    desc: Stages main.exe under user Downloads
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)(Downloads|Dir\.home).{0,80}main\.exe|main\.exe.{0,80}Downloads'

composite_rules:
  - id: fake-extension-make-stubs
    desc: Writes no-op make_stub scripts for a fake extension build
    crit: suspicious
    conf: 0.97
    all:
      - id: make-stub-unix-script
      - id: make-stub-windows-batch

  - id: stubmaker-fake-toolchain
    desc: Dummy Makefile plus make_stub toolchain stand-ins
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/supply-chain/install-hook/extconf::extconf-writes-empty-makefile
      - id: fake-extension-make-stubs

  - id: stubmaker-install-loader-chain
    desc: Fake extension stubs with Windows loader download and spawn
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: stubmaker-fake-toolchain
      - id: downloads-main-exe-path
    any:
      - id: objectives/evasion/security-bypass/tls::ruby-tls-bypass-download-exec
      - id: objectives/supply-chain/install-hook/extconf::extconf-windows-payload-launch
      - id: micro-behaviors/process/create/direct::ruby-spawn
      - id: micro-behaviors/fs/write/file/binary::ruby-file-binwrite-content
