# RubyGems runs a gem's declared extension at install time. The 2020 typosquat
# wave (activerecord_denormalize and ~700 siblings) shipped a Windows PE named
# `aaa.png` in a deep `ext/` path next to a Makefile whose targets are all
# empty, so `gem install` "builds" nothing and reports success while extconf.rb
# launches the disguised executable. The no-op Makefile and the image-named
# binary are each odd alone; in one gem they are the dropper's two halves.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1036.008
  mbc: B0024

composite_rules:
  - id: gem-extension-disguised-executable
    desc: Gem pairs no-op Makefile with image-named executable
    crit: hostile
    conf: 0.97
    for: [gem, tar, makefile, pe, elf, macho]
    scope: archive
    all:
      - id: dummy-makefile
      - id: objectives/evasion/masquerade/extension-mismatch::binary-disguised-as-image-extension
