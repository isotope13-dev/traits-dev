defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: extconf-psych-create-makefile
    desc: Psych extconf create_makefile
    crit: component
    conf: 0.95
    if:
      type: text
      substr: "create_makefile 'psych'"
  # Native-extension recipes for Rust/C/Go-backed gems shell out to their
  # language toolchain -- that is the job extconf.rb exists to do. Match the
  # toolchain names rather than one gem's exact command sequence: the previous
  # form required the literal strings `cargo --version`, `cargo build
  # --release` and `FileUtils.cp` in order, so a recipe that spells the same
  # build as `system("cargo", "--version")` plus a feature-flagged `cargo
  # build` fell straight through. Droppers shell out to a downloader or an
  # interpreter instead, so keeping the list to build tools stays specific.
  - id: extconf-build-toolchain-invocation
    desc: extconf.rb invokes a native build toolchain
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(system|%x|`)\(?\s*["'']?(cargo|rustc|cmake|meson|ninja|pkg-config|go)\b'
  - id: extconf-local-ruby-delegation
    desc: extconf.rb delegates local native build
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'system\s*\(\s*ruby\s*,\s*["'']-C["'']\s*,[\s\S]{0,160}extconf_rb_path\.to_s'

composite_rules:
  # Keep the install-hook evidence tied to the extconf file itself.  A
  # package-wide relative require plus unrelated network/process code is not
  # enough to call a native-extension build a payload launcher.
  - id: extconf-loads-relative-helper
    desc: extconf.rb loads a relative Ruby helper
    crit: notable
    conf: 0.92
    scope: file
    all:
      - id: metadata/build/package/recipe::filename-extconf
      - id: micro-behaviors/os/module/load::ruby-require-relative

  # A recipe that both drives mkmf (require "mkmf" / create_makefile /
  # create_header) and shells out to a compiler toolchain is compiling
  # something. Requiring both legs keeps a stub recipe that only *names* cargo
  # while fetching a payload out of the suppression.
  - id: extconf-genuine-toolchain-build
    desc: extconf.rb compiles with a real toolchain
    crit: notable
    conf: 0.93
    scope: file
    all:
      - id: metadata/build/package/recipe::filename-extconf
      - id: metadata/build/package/recipe::extconf-native-build-helper
      - id: extconf-build-toolchain-invocation

  - id: extconf-process-replacement
    desc: "extconf.rb replaces process via exec() (hostile behavior)"
    crit: hostile
    conf: 1.0
    all:
      - id: metadata/build/package/recipe::filename-extconf
      - id: micro-behaviors/process/create/shell/lang::ruby-exec
  - id: extconf-shell-exec
    desc: extconf.rb invokes install-time child process
    crit: notable
    scope: file
    unless:
      - id: metadata/package/files/dependency::ruby-vendor-bundle-gem-path
      - id: extconf-psych-create-makefile
      - id: extconf-genuine-toolchain-build
      - id: extconf-local-ruby-delegation
    all:
      - id: metadata/build/package/recipe::filename-extconf
    any:
      - id: micro-behaviors/process/create/system::ruby-system
      - id: micro-behaviors/process/create/shell/lang::ruby-shell-exec-imports
  - id: extconf-windows-persistence
    desc: "extconf.rb installs Windows persistence"
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/build/package/recipe::filename-extconf
    any:
      - id: objectives/persistence/login/registry/run-key::ruby-reg-add-run-key-persistence
      - id: objectives/persistence/login/startup/folder::ruby-copy-to-startup-folder
  - id: extconf-windows-payload-launch
    desc: extconf Windows-gated download-write-launch chain
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1105,T1059
    mbc: B0024
    scope: archive
    all:
      - id: extconf-loads-relative-helper
      # Keep the payload sequence inside one helper instead of pooling common
      # Ruby runtime and dependency behaviors across a large outer archive.
      - id: objectives/command-and-control/dropper/execution/download::ruby-windows-download-binwrite-spawn
    unless:
      - id: well-known/lib/web/gettext-i18n-rails-js/
      - id: well-known/lib/web/gettext-i18n-rails-js::gettext-i18n-rails-js-package-path
      - id: well-known/lib/web/gettext-i18n-rails-js::gettext-i18n-rails-js-extconf-path
