defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: suspicious
  conf: 0.8
composite_rules:
  # A request call, rather than merely importing Net::HTTP, proves that the
  # build recipe actually reaches the network.
  - id: extconf-network-request
    desc: Network request in extconf.rb (suspicious in build scripts)
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/communications/http/request/netlib::ruby-http-request-call
    unless:
      # ibm_db provisions IBM's own Db2 CLI driver from IBM's public host
      # at install time; the vendor endpoint is the recipe's identity.
      - id: well-known/lib/data/ibm-db::ibm-db-official-gem-context
  # Evaluating the body of an HTTP get inside extconf is a remote code load
  # at install time. The shell-combined composite in package/rubygems stays
  # separate: that one also requires a local shell command.
  - id: extconf-fetched-source-eval
    desc: extconf.rb evaluates source returned by an HTTP get
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1059,T1105
    mbc: B0024
    scope: file
    near_lines: 40
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: metadata/import/package::ruby-http-client-imports
      - id: micro-behaviors/process/deploy::ruby-eval-of-read-call-result
  # A build recipe has no reason to switch certificate validation off: it is
  # reaching an endpoint whose certificate would not stand up, or is hiding the
  # request from a TLS-inspecting proxy.
  - id: extconf-tls-verification-bypass
    desc: extconf.rb disables TLS certificate verification
    conf: 0.95
    attack: T1553
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/communications/tls/verify/disable::openssl-verify-none
  # A raw-IP POST from an install hook is a strong package supply-chain signal:
  # it reports to an endpoint that has no stable vendor identity or DNS name.
  - id: extconf-raw-ip-post-callback
    desc: extconf install hook posts to a raw IP
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041
    mbc: B0024
    scope: leaf
    all:
      - id: objectives/supply-chain/install-hook/extconf::extconf-loads-relative-helper
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/communications/http/post::net-http-post
      - id: micro-behaviors/communications/http/request/netlib::ruby-http-request-call
  - id: extconf-pipedream-host-beacon
    desc: extconf.rb beacons hostname to Pipedream OOB
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041
    mbc: B0024
    scope: leaf
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: objectives/exfiltration/oob/system-profile::ruby-pipedream-host-profile-http-get
  # Install-time host recon to a minted OOB name is a supply-chain hook, not
  # the same claim as a generic script posting identity. Pipedream stays on
  # its own composite because that beacon is an HTTP GET profile.
  - id: extconf-oob-host-profile-post
    desc: extconf.rb posts a host profile to an OOB service
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041,T1082
    mbc: B0024
    scope: file
    near_lines: 80
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
      - id: micro-behaviors/communications/http/post::net-http-post
      - id: micro-behaviors/os/sysinfo/hostname::ruby-socket-gethostname
