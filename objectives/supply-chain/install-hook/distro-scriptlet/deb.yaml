# Debian control members are install-time root hooks.  Keep the path anchor
# explicit so a README or payload script containing curl does not inherit a
# maintainer-script verdict.
defaults:
  platforms: [linux]
  for: [deb, shell]
  attack: T1195.002

composite_rules:
  - id: deb-control-systemd-backdoor
    desc: Debian install hook overrides an existing systemd service command
    crit: hostile
    conf: 0.99
    # Only on the maintainer script itself. The file default includes `deb`
    # and `archives`, so the rule also ran on the CONTAINER node, where every
    # member's traits are rolled up -- which is how kali-menu's `rm_conffile`
    # cleanup and an unrelated apt path combined into a hostile finding.
    for: [shell]
    attack: T1195.002,T1543.003
    all:
      - id: metadata/build/package/maintainer-scripts::debian-control-hook-path
      - id: micro-behaviors/os/service/config::systemd-service-timer-dropin-path
      - id: micro-behaviors/os/service/control::systemctl-word

  - id: deb-removal-hook-uploads-passwd
    # Reading the public account database can be ordinary inventory, but
    # sending it from a package removal hook in an HTTP request body is an
    # unrelated outbound disclosure and has no normal teardown purpose.
    desc: Debian removal hook uploads the Unix account database
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1041
    for: [shell]
    all:
      - id: metadata/build/package/maintainer-scripts::debian-prerm-script-path
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd-cat
      - id: micro-behaviors/communications/http/curl::curl-data-binary-at-source

  - id: deb-control-apt-hook-stage
    desc: Debian install hook plants an APT hook and downloads code
    crit: hostile
    conf: 0.99
    # Only on the maintainer script itself. The file default includes `deb`
    # and `archives`, so the rule also ran on the CONTAINER node, where every
    # member's traits are rolled up -- which is how kali-menu's `rm_conffile`
    # cleanup and an unrelated apt path combined into a hostile finding.
    for: [shell]
    attack: T1195.002,T1546.016,T1105
    all:
      - id: metadata/build/package/maintainer-scripts::debian-control-hook-path
      - id: micro-behaviors/fs/path/config/system::apt-conf-dropin-path
    unless:
      # `dpkg-maintscript-helper rm_conffile /etc/apt/apt.conf.d/...` is the
      # documented Debian idiom for REMOVING a conffile the package no longer
      # ships -- the opposite of planting a hook. Kali's own kali-menu package
      # calls it from all four maintainer scripts to drop 99kali-menu.
      - id: metadata/build/package/maintainer-scripts::dpkg-conffile-removal-helper

  - id: deb-control-postrm-beacon
    desc: Debian removal hook installs a background network beacon
    crit: hostile
    conf: 0.99
    # Only on the maintainer script itself. The file default includes `deb`
    # and `archives`, so the rule also ran on the CONTAINER node, where every
    # member's traits are rolled up -- which is how kali-menu's `rm_conffile`
    # cleanup and an unrelated apt path combined into a hostile finding.
    for: [shell]
    attack: T1195.002,T1053,T1071.001
    all:
      - id: metadata/build/package/maintainer-scripts::debian-control-hook-path
      - id: micro-behaviors/communications/http/request/beacon::shell-network-sleep-loop
      - id: micro-behaviors/process/create/background::detached-background-command
