# Debian control members are install-time root hooks.  Keep the path anchor
# explicit so a README or payload script containing curl does not inherit a
# maintainer-script verdict.
defaults:
  platforms: [linux]
  for: [deb, archives, shell]
  attack: T1195.002

traits:
  - id: deb-control-install-hook-path
    desc: Debian control install hook
    crit: notable
    conf: 0.99
    for: [shell]
    if:
      type: path
      regex: '(^|/)(control|DEBIAN)/(config|postinst|postrm|prerm|preinst)$'

composite_rules:
  - id: deb-control-remote-shell-stage
    desc: Debian install hook pipes a remote stage into a shell
    crit: hostile
    conf: 0.99
    scope: archive
    attack: T1195.002,T1105,T1059.004
    all:
      - id: deb-control-install-hook-path
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text

  - id: deb-control-systemd-backdoor
    desc: Debian install hook installs a systemd backdoor
    crit: hostile
    conf: 0.99
    scope: archive
    attack: T1195.002,T1543.003
    all:
      - id: deb-control-install-hook-path
      - id: objectives/persistence/system/service/systemd::systemd-dropin-path--rx-1
      - id: micro-behaviors/os/service/control::systemctl-word

  - id: deb-control-apt-hook-stage
    desc: Debian install hook plants an APT hook and downloads code
    crit: hostile
    conf: 0.99
    scope: archive
    attack: T1195.002,T1546.016,T1105
    all:
      - id: deb-control-install-hook-path
      - id: objectives/persistence/system/surface/paths::apt-hook-path

  - id: deb-control-postrm-beacon
    desc: Debian removal hook installs a background network beacon
    crit: hostile
    conf: 0.99
    scope: archive
    attack: T1195.002,T1053,T1071.001
    all:
      - id: deb-control-install-hook-path
      - id: micro-behaviors/communications/http/request/beacon::shell-network-sleep-loop
      - id: micro-behaviors/process/create/background::detached-background-command
