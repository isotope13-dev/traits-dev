# RPM exposes embedded lifecycle scriptlets as synthetic archive members under
# /rpm/scriptlets/<phase>/body. Network-fetched code executed from one of these
# members runs during package installation or upgrade, normally with root
# privileges; ordinary RPM payload files do not satisfy the path leg.
defaults:
  platforms: [linux]
  for: [shell]
  attack: T1195.002,T1105,T1059.004

traits:
  - id: rpm-install-scriptlet-body
    desc: RPM install scriptlet body
    crit: notable
    conf: 0.99
    if:
      type: path
      regex: 'scriptlets/((pre|post)(in|un|trans)|verify)/body$'

composite_rules:
  - id: rpm-scriptlet-remote-shell-stage
    desc: RPM scriptlet pipes remote code to shell
    crit: hostile
    conf: 0.99
    scope: leaf
    all:
      - id: rpm-install-scriptlet-body
      - id: micro-behaviors/process/create/shell/pipeline::http-client-pipe-interpreter

  - id: rpm-scriptlet-journal-wipe
    desc: RPM scriptlet vacuums the system journal
    crit: hostile
    conf: 0.98
    scope: leaf
    all:
      - id: rpm-install-scriptlet-body
      - id: objectives/evasion/indicator-removal/logs::shell-journalctl-vacuum-immediate

  - id: rpm-scriptlet-curl-pipe-shell
    desc: RPM scriptlet executes a curl response
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: rpm-install-scriptlet-body
      - id: micro-behaviors/process/create/shell/pipeline::curl-response-shell-stdin

  - id: rpm-scriptlet-background-network-loop
    desc: RPM scriptlet installs a beacon loop
    crit: hostile
    conf: 0.98
    scope: leaf
    all:
      - id: rpm-install-scriptlet-body
      - id: micro-behaviors/communications/http/request/beacon::shell-network-sleep-loop
      - id: micro-behaviors/process/create/background::detached-background-command

  - id: rpm-scriptlet-systemd-ssh-backdoor
    desc: RPM scriptlet installs an SSH service backdoor
    crit: hostile
    conf: 0.99
    scope: leaf
    all:
      - id: rpm-install-scriptlet-body
      - id: objectives/persistence/system/service/systemd::systemd-dropin-path--rx-1
      - id: micro-behaviors/communications/ssh/keys::ed25519-key-text-fragment
      - id: micro-behaviors/os/service/remote::sshd-ref

  - id: rpm-scriptlet-configured-remote-helper
    desc: RPM scriptlet installs a remote helper
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: rpm-install-scriptlet-body
      - id: micro-behaviors/fs/write/file/redirect::shell-heredoc-system-config-write
      - id: micro-behaviors/communications/http/download/curl::curl-fail-silent-url-reference
