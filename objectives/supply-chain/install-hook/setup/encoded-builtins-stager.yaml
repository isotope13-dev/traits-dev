# A trojanized package's setup.py runs its payload the moment `pip install`
# unpacks the sdist. Two shapes here go beyond the direct urlopen-and-exec
# loaders the sibling files cover: the payload is base64-decoded and executed
# through builtins reflection (`__import__('builtins').exec(compile(...))`),
# and what it launches is a written-out stager run by the windowed
# interpreter (`pythonw`) whose own body fetches and execs remote code.
# Legitimate setup.py files never decode-and-exec through builtins, and never
# relaunch the interpreter without a console to run a fetched file.
defaults:
  platforms: [linux, macos, windows]
  for: [python]
  attack: T1195.002,T1027,T1059.006
  mbc: B0024,E1059.006

composite_rules:
  - id: setup-py-encoded-builtins-exec-payload
    desc: setup.py execs base64 payload through builtins at load
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: metadata/build/pip::root-setup-py
      - id: objectives/anti-static/obfuscation/encoding/content::encoded-python-exec
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::import-builtins-exec
  - id: setup-py-pythonw-fetch-exec-stager
    desc: setup payload launches windowed fetch-exec stager
    crit: hostile
    conf: 0.96
    platforms: [windows]
    scope: file
    all:
      - id: metadata/build/pip::root-setup-py
      - id: objectives/anti-static/obfuscation/eval/scripting/host::pythonw-exe-replace-trick
      - id: micro-behaviors/communications/http/client/response-body::urlopen-response-body-read
