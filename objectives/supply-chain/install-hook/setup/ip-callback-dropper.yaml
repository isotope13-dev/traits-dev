# A setup.py whose module body shells out to a downloader aimed at a raw IP.
#
# setup.py runs with the installing user's privileges the moment `pip install`
# unpacks the sdist, so anything at module level -- outside the setup() call,
# outside any cmdclass -- executes before the package is ever imported. That is
# the install hook.
#
# The discriminating detail is the destination. A build recipe that genuinely
# fetches something reaches a named host: a PyPI mirror, a vendor CDN, a
# release URL on a forge. Hard-coding a bare public IP address skips DNS
# entirely, which is what an operator does when the endpoint has no domain to
# resolve and no certificate to present -- and, since the sibling rules key on
# `http://`, what slips past a scheme-anchored review.
defaults:
  platforms: [linux, macos, windows]
  for: [python]
  attack: T1195.002,T1105
  mbc: B0024

composite_rules:
  - id: setup-py-module-level-ip-downloader
    desc: setup.py shells a downloader at a raw IP
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/build/pip::setup-py
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/process/create/system::python-os-system
      - id: micro-behaviors/communications/http/url/external-ip::curl-schemeless-external-ip-request
    # Directory evidence only. The `test-directory` umbrella also accepts the
    # test_*.py filename convention, and a setup.py dropper is free to name its
    # own files -- gating on that would let the hook evade by renaming.
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
