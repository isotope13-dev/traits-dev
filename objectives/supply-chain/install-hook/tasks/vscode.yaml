# VSCode Tasks Persistence
# Detects malicious use of tasks.json for automatic code execution.
defaults:
  platforms: [unix, windows]
  # .vscode/tasks.json is typed `json`; without it every rule below is
  # skipped as a file-type mismatch and the persistence trigger is missed.
  for: [javascript, json]
traits:
  - id: tasks-run-on-open
    desc: VSCode task runs on folder open
    crit: notable
    conf: 1.0
    if:
      type: text
      regex: '"runOn":\s*"folderOpen"'
    not:
      - regex: 'tasks-to-suggest-readme\.json'
      - regex: 'code -r readme\.md'
  - id: tasks-typescript-watch-build
    desc: VSCode TypeScript watch build task
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '"command":\s*"tsc"[\s\S]{0,240}"args":\s*\[[\s\S]{0,120}"--watch"[\s\S]{0,120}\]'
  - id: tasks-node-execution
    desc: VSCode tasks.json command executes node.js
    crit: component
    conf: 0.9
    if:
      type: value
      path: tasks[*].command
      regex: '^node\s+'
  - id: tasks-hidden
    desc: VSCode task with hidden presentation
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"presentation"\s*:\s*\{[^}]{0,300}"hide"\s*:\s*true'
  - id: tasks-echo-disabled
    desc: VSCode task with echo disabled
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '"echo":\s*false'
  - id: tasks-command-curl-wget
    desc: VSCode task command downloads URL
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '"command":\s*"[^\n"]{0,80}\b(curl|wget)\b'
  - id: tasks-command-vercel
    desc: VSCode task command uses Vercel
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '"command":\s*"[^"\n]{0,240}vercel\.app'
  - id: tasks-command-shortlink
    desc: VSCode task command uses shortlink
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '"command":\s*"[^"\n]{0,240}(short\.gy|bit\.ly|tinyurl\.com)'
  - id: tasks-command-pipe-shell
    desc: VSCode task command pipes shell
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\|\s*(sh|bash|cmd)\b'
  - id: tasks-command-powershell-download
    desc: VS Code task downloads with PowerShell
    crit: component
    conf: 0.9
    if:
      type: value
      path: tasks[*].command
      regex: '\b(iwr|invoke-webrequest)\b'
      case_insensitive: true
  - id: tasks-command-powershell-pipe
    desc: VS Code task pipes to PowerShell
    crit: component
    conf: 0.9
    if:
      type: value
      path: tasks[*].command
      regex: '\|\s*(iex|invoke-expression)\b'
      case_insensitive: true
  - id: tasks-auto-approve-setting
    desc: Workspace pre-approves automatic tasks
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '"task\.allowAutomaticTasks"\s*:\s*(true|"on")'
  - id: tasks-command-exec-media
    desc: VSCode task runs font file via node
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\bnode\b[^"\n]{0,120}\.(woff2?|ttf|otf|eot)\b'
composite_rules:
  - id: vscode-task-persistence
    # Folder-open tasks are a real developer workflow (for example, starting
    # a local watcher).  The trigger plus a Node command is therefore a
    # suspicious capability, not proof of malicious persistence.  The
    # hostile composites below require a fetch-and-shell, masqueraded payload,
    # or another concrete execution chain.
    # Named for the trigger, described for the whole `any:` set: the command
    # leg matches a Node invocation OR a curl/wget download OR a shortener or
    # vercel.app host OR a font-file exec, so calling it "runs a Node command"
    # mis-reported every non-Node hit (a `curl ... | sh` task reads back as
    # Node).
    desc: VSCode folder-open task runs a fetch or exec command
    crit: suspicious
    conf: 0.96
    mbc: "C0032"
    attack: "T1547"
    all:
      - id: tasks-run-on-open
    any:
      - id: tasks-node-execution
      - id: tasks-command-curl-wget
      - id: tasks-command-exec-media
      - id: tasks-command-vercel
      - id: tasks-command-shortlink
    unless:
      - id: tasks-typescript-watch-build
  # `vscode-task-download-execution` used to sit beside this rule with an
  # identical `all:` block plus an `any:` on the vercel/shortener host atoms.
  # Every file it could match already matched this one, so it only ever
  # duplicated the verdict under a second id and split one signal across two ML
  # features; the host atoms remain evidence through `vscode-task-persistence`.
  - id: vscode-task-generic-remote-shell
    desc: VS Code autorun fetches and pipes a remote shell
    crit: hostile
    conf: 0.98
    attack: "T1195.002, T1105"
    all:
      - id: tasks-run-on-open
      - id: metadata/package/config::vscode-task-shell-command
      - id: tasks-command-curl-wget
      - id: tasks-command-pipe-shell
  - id: vscode-task-powershell-download-execution
    desc: VS Code autorun fetches and executes PowerShell
    crit: hostile
    conf: 0.98
    attack: "T1195.002, T1105, T1059.001"
    all:
      - id: tasks-run-on-open
      - id: metadata/package/config::vscode-task-shell-command
      - id: tasks-command-powershell-download
      - id: tasks-command-powershell-pipe
  - id: vscode-task-concealment
    desc: VSCode task with concealment properties
    crit: suspicious
    conf: 0.9
    all:
      - id: tasks-run-on-open
    any:
      - id: tasks-hidden
      - id: metadata/package/config::task-reveal-never
      - id: tasks-echo-disabled
    needs: 2
  - id: vscode-concealed-remote-shell-autorun
    desc: Concealed folder-open task fetches and pipes a remote shell
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1105,T1564.003"
    all:
      - id: vscode-task-generic-remote-shell
      - id: vscode-task-concealment
  - id: vscode-task-media-masquerade
    desc: VSCode autorun runs disguised media file
    crit: hostile
    conf: 0.98
    attack: "T1547, T1036.008"
    all:
      - id: tasks-run-on-open
      - id: tasks-command-exec-media
  - id: vscode-concealed-media-masquerade-autorun
    desc: Concealed folder-open task runs disguised media file
    crit: hostile
    conf: 0.99
    attack: "T1547, T1036.008, T1564.003"
    all:
      - id: vscode-task-media-masquerade
      - id: vscode-task-concealment
