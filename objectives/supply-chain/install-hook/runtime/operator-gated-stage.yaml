# Automatic package/build execution combined with hidden temporary staging and
# child-process creation is the primary verdict. A generated environment gate
# is retained as corroboration, but missing it cannot suppress the verdict.
defaults:
  platforms: [linux, macos, windows]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: package-secret-environment-gate
    desc: Package code contains embedded secret environment gate
    crit: component
    all:
      - id: micro-behaviors/os/env/gate::operator-secret-environment-gate
      - id: package-automatic-execution-surface

  - id: package-automatic-execution-surface
    desc: Package contains automatic execution surface
    crit: component
    any:
      - id: micro-behaviors/process/lifecycle/auto-exec
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
      - id: objectives/supply-chain/install-hook/build/behavioral::rust-build-rs-file
      - id: metadata/build/package/recipe::filename-extconf
      - id: metadata/package/ecosystem::composer-files-autoload
      - id: metadata/package/files/included::java-annotation-processor-service-descriptor
      - id: objectives/supply-chain/install-hook/scripts/declaration::has-postinstall

  - id: package-child-process-creation
    desc: Package payload creates child process
    crit: component
    any:
      - id: micro-behaviors/process/create/

  - id: package-network-client
    desc: Package payload initiates network communication
    crit: component
    any:
      - id: micro-behaviors/communications/socket/connect/
      - id: micro-behaviors/communications/socket/create/
      - id: micro-behaviors/communications/socket/dial/
      - id: micro-behaviors/communications/http/request/client/
      - id: micro-behaviors/communications/http/download/curl::curl
      - id: micro-behaviors/communications/http/post::swift-urlsession-data-task
      - id: micro-behaviors/communications/http/lib/nsurlsession::nsurlsession-source-data-task

  - id: package-hidden-temp-stage
    desc: Package payload stages hidden temporary file
    crit: component
    any:
      - id: micro-behaviors/fs/write/file/stage::source-hidden-temp-path-construction
      - id: micro-behaviors/fs/write/file/stage::jvm-hidden-temp-stage-path

  - id: automatic-package-hidden-process-stage
    desc: Package hook stages data and creates process
    crit: hostile
    conf: 0.97
    all:
      - id: package-automatic-execution-surface
      - id: package-hidden-temp-stage
      - id: package-child-process-creation
