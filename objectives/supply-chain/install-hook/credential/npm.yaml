defaults:
  platforms: [windows, unix]
  for: [archives, npm]
  attack: T1195.002,T1555

composite_rules:
  - id: npm-preinstall-github-credential-sweep
    desc: npm preinstall extracts GitHub token and enumerates GCM accounts
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-preinstall
      - id: objectives/credential-access/cloud/token/cli::gh-auth-token-raw
    any:
      - id: objectives/discovery/account/enum::gcm-github-list-command-string
      - id: objectives/discovery/account/enum::gcm-github-list-argv

  - id: npm-postinstall-gaming-token-stealer
    desc: npm postinstall exfiltrates gaming account tokens
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1555,T1041
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-hook-declaration
      - id: objectives/credential-access/gaming/launcher::node-minecraft-launcher-token-harvest
      - id: objectives/exfiltration/stealer/credential/token::node-minecraft-token-multipart-exfil
