# A setup.py install hook that reaches a URL carrying its own credentials.
#
# `cmdclass={"install": ...}` and a `develop`/`install` subclass are Python's
# postinstall: the code runs on the machine doing `pip install`, before anyone
# has imported anything. A URL with a password in its userinfo -- 
# `http://user:secret@host/simple/` -- is a credential shipped inside a
# published artifact, readable by everyone who downloads it.
#
# Either half alone is ordinary enough. A build backend legitimately overrides
# install commands, and a credentialed URL turns up in vendored config and
# documentation. Together they describe an install that authenticates to
# somewhere of the author's choosing on every consumer's machine, which is the
# shape of a dependency-confusion payload aimed at an internal index.
#
# Worked example: a PyPI package whose `PostInstallCommand(install)` posts to
# `http://PyPiper:<password>@servers.<redacted>.com:8010/simple/`, published at
# version 9007.0.1 so it outranks the internal package it shadows.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: "T1195.002,T1552.001"
  mbc: "E1041"

composite_rules:
  - id: python-install-hook-credentialed-url
    desc: Install hook contacts a credentialed URL
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/build/package/recipe::python-install-hook
      - id: micro-behaviors/communications/http/request/credentials::python-credentialed-url
