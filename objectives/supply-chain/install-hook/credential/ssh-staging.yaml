# An npm lifecycle hook that harvests SSH private keys. The postinstall
# command runs with the installing user's privileges; reading ~/.ssh private
# key files there and redirecting them to a staging path is the collection
# step of key theft — the keys authorize access to every host the user
# trusts. No legitimate installer reads the user's private keys.
defaults:
  platforms: [unix]
  attack: T1195.002,T1552.004

traits:
  - id: ssh-private-key-copy-redirect
    desc: Copies SSH private keys out of .ssh
    crit: suspicious
    conf: 0.95
    for: [package.json, shell]
    if:
      type: text
      regex: '(cat|cp)\s+[^|;&\n]{0,100}\.ssh/id_(rsa|ed25519|ecdsa)\b[^|;&\n]{0,100}(>|>>)'
    unless:
      # Pentest frameworks and benchmark corpora quote these commands as data.
      - id: metadata/package/testing/harness/benchmark::adversarial-benchmark-corpus
      - id: "metadata/file/naming::test-directory-component"

  - id: ssh-private-key-filename-in-hook
    desc: Command references SSH private key files
    crit: notable
    conf: 0.92
    for: [package.json, shell]
    if:
      type: text
      regex: '\.ssh/id_(rsa|ed25519|ecdsa)\b'
    unless:
      - id: metadata/package/testing/harness/benchmark::adversarial-benchmark-corpus
      - id: "metadata/file/naming::test-directory-component"

composite_rules:
  - id: postinstall-ssh-private-key-staging
    desc: Install hook stages SSH private keys
    crit: hostile
    conf: 0.97
    for: [package.json, npm, tar, zip, json]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: ssh-private-key-copy-redirect

  - id: postinstall-ssh-private-key-harvest
    desc: Install hook reads SSH private key files
    crit: hostile
    conf: 0.96
    for: [package.json, npm, tar, zip, json]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: ssh-private-key-filename-in-hook
      - id: objectives/supply-chain/install-hook/scripts/postinstall::temp-path
