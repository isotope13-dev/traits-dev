- id: rust-build-rs-hostname-unverified-remote-payload-stage
  desc: build.rs downloads hostname-unverified payload into temporary storage
  crit: suspicious
  conf: 0.98
  for:
  - rust
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  - id: micro-behaviors/communications/http/download/handler::rust-http-response-materialized
  - id: micro-behaviors/fs/path/temp::rust-temp-path
  - id: micro-behaviors/communications/socket/ssl::rustls-no-hostname-verification
- id: rust-build-rs-hostname-unverified-remote-payload-exec
  desc: Cargo build hook launches a hostname-unverified remote payload
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1105,T1059,T1553
  mbc: B0024
  for:
  - rust
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  - id: objectives/supply-chain/install-hook/build/behavioral/stage::rust-build-rs-hostname-unverified-remote-payload-stage
  - id: objectives/command-and-control/dropper/file-exec/spawn::rust-hostname-unverified-temp-executable-dropper
- id: rust-build-rs-obfuscated-endpoint-payload-exec
