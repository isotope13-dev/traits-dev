defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
  attack: T1195.002

traits:
- id: rust-build-rs-payload-path-var
  desc: build.rs references payload path variable
  crit: notable
  conf: 0.86
  for:
  - rust
  if:
    type: text
    regex: \b(payload|stage|loader)_path\b
  unless:
  - id: metadata/package/testing/
- id: rust-build-rs-rustc-link-search-native
  desc: build.rs emits native link search path
  crit: notable
  conf: 0.9
  for:
  - rust
  unless:
  - id: well-known/lib/format/blosc-src::blosc-src-native-compression-bindings
  if:
    type: text
    substr: cargo:rustc-link-search=native=
- id: openrewrite-python-package-marker
  desc: OpenRewrite Python package marker
  crit: notable
  conf: 0.95
  for:
  - python
  if:
    type: text
    substr: openrewrite

composite_rules:
- id: python-import-time-download-write-execute
  desc: Python import downloads and runs an executable
  crit: hostile
  conf: 0.98
  scope: file
  all:
  - id: metadata/build/pip::packaging-setuptools-imported-setup-call
  - id: micro-behaviors/communications/http/request/client::requests-get-url-literal
  - id: micro-behaviors/fs/write/file/target::py-open-executable-path
  - id: micro-behaviors/process/interpreter/eval/direct::module-scope-exec-builtin
- id: python-packaging-curl-pipe-execute
  desc: Packaging code pipes a curl payload to Python
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: metadata/build/pip::packaging-setuptools-imported-setup-call
  - id: micro-behaviors/communications/http/curl::curl-command-remote-url
  - id: micro-behaviors/process/create/shell/spawn::curl-pipe-exec-python-shell
  - id: micro-behaviors/process/create/system::python-os-system
- id: setup-py-embeds-fetched-module
  desc: setup.py writes a fetched body into Python
  crit: hostile
  conf: 0.96
  for:
  - python
  scope: file
  attack: T1195.002,T1105
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/fs/write/file/full::python-source-write-text
  - id: micro-behaviors/fs/write/file/full::python-pathlib-write-text
  any:
  - id: micro-behaviors/communications/http/lib/requests::requests-post
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
  unless:
  - id: metadata/package/testing/
- id: python-setup-encoded-dropper
  desc: setup.py decodes and executes downloaded payload
  crit: hostile
  conf: 0.98
  for:
  - python
  platforms:
  - unix
  scope: file
  all:
  - id: metadata/build/pip::setup-py
  - id: metadata/build/pip::packaging-setuptools-import
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: objectives/anti-static/obfuscation/payload/encoded/exec::decoded-curl-command
  - id: objectives/anti-static/obfuscation/payload/encoded/exec::decoded-local-execution
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
- id: setup-py-encrypted-build-hook-fetch
  desc: setup.py build hook decrypts and fetches a remote payload
  crit: hostile
  conf: 0.99
  for:
  - python
  scope: file
  attack: T1195.002,T1027,T1105
  all:
  - id: metadata/build/pip::setup-py
  - id: metadata/build/package/recipe/setup-hooks::setuptools-build-py-run-override
  - id: metadata/build/package/recipe/setup-hooks::run-override-calls-helper-after-super
  - id: micro-behaviors/crypto/symmetric/aes/library::cryptography-aesgcm-api
  - id: micro-behaviors/crypto/symmetric/decrypt::python-decrypt-method-call
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
  unless:
  - id: metadata/package/testing/
- id: setup-build-hook-environment-temp-staging
  desc: Build hook stages captured environment in temporary file
  crit: hostile
  conf: 0.995
  for:
  - python
  attack: T1195.002,T1552.001
  all:
  - id: objectives/supply-chain/credential-theft/env::pypi-build-hook-environment-file-harvest
  - id: micro-behaviors/fs/file/open::python-open-hardcoded-tmp-path
  - id: micro-behaviors/fs/write/file/full::python-pathlib-write-text
- id: setup-py-encrypted-build-hook-write
  desc: setup.py build hook decrypts and writes plaintext
  crit: hostile
  conf: 0.995
  for:
  - python
  scope: file
  attack: T1195.002,T1027,T1140
  all:
  - id: metadata/build/pip::setup-py
  - id: metadata/build/package/recipe/setup-hooks::setuptools-build-py-run-override
  - id: metadata/build/package/recipe/setup-hooks::run-override-calls-helper-after-super
  - id: objectives/anti-static/obfuscation/crypto::environment-slice-hash-key
  - id: micro-behaviors/crypto/symmetric/aes/library::cryptography-aesgcm-api
  - id: micro-behaviors/crypto/symmetric/decrypt::python-decrypt-method-call
  - id: micro-behaviors/data/decode/hex::python-fromhex
  - id: micro-behaviors/fs/path/temp::tmp-path-content
  - id: micro-behaviors/fs/write/file/full::python-pathlib-write-text
