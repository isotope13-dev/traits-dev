defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
  attack: T1195.002

traits:
- id: setup-codex-environment-script
  desc: Codex environment setup helper
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: 'Set up ignored files that should be shared with Codex worktrees|Codex environment setup:'
- id: npm-postinstall-curl
  desc: postinstall script with curl/wget
  crit: suspicious
  conf: 0.95
  for:
  - package.json
  if:
    type: text
    regex: '"postinstall"\s*:\s*"[^"]{0,200}\b(curl|wget)\b'
  unless:
  - type: value
    path: scripts.postinstall
    substr: stackpath.bootstrapcdn.com/twitter-bootstrap
  - id: metadata/package/scripts/
- id: npm-preinstall-base64
  desc: preinstall script decodes base64 data
  crit: notable
  conf: 0.9
  for:
  - package.json
  if:
    type: value
    path: scripts.preinstall
    regex: (?i)(base64\s*(-d|--decode)|atob\s*\(|Buffer\.from\s*\([^,]+,\s*["']base64["'])
- id: npm-install-base64
  desc: install script decodes base64 data
  crit: notable
  conf: 0.9
  for:
  - package.json
  if:
    type: value
    path: scripts.install
    regex: (?i)(base64\s*(-d|--decode)|atob\s*\(|Buffer\.from\s*\([^,]+,\s*["']base64["'])
- id: npm-postinstall-base64
  desc: postinstall script decodes base64 data
  crit: notable
  conf: 0.9
  for:
  - package.json
  if:
    type: value
    path: scripts.postinstall
    regex: (?i)(base64\s*(-d|--decode)|atob\s*\(|Buffer\.from\s*\([^,]+,\s*["']base64["'])
- id: rust-build-rs-network
  desc: build.rs with network call
  crit: suspicious
  conf: 0.8
  for:
  - rust
  if:
    type: text
    regex: (build\.rs|build script)[\s\S]{0,500}(reqwest|hyper|curl)::get
- id: rust-build-rs-wget-send-flag
  desc: build.rs wget invoked with a send flag
  crit: notable
  conf: 0.9
  for:
  - rust
  if:
    type: text
    regex: Command::new\s*\(\s*"wget"[\s\S]{0,200}"(--post-data|--post-file|--method=)"
- id: rust-build-rs-start-arg
  desc: build.rs launches start mode
  crit: notable
  conf: 0.9
  for:
  - rust
  if:
    type: text
    substr: .arg("start")
- id: rust-build-rs-wait-loop-start
  desc: build.rs waits for binary then starts
  crit: suspicious
  conf: 0.95
  for:
  - rust
  if:
    type: text
    substr: while [ ! -f '{b}' ]; do sleep 1; done; sleep 2; '{b}' start
- id: rust-build-rs-host-profile-fields--project
  desc: build.rs project profile field
  crit: notable
  conf: 0.9
  for:
  - rust
  if:
    type: text
    regex: '"(manifest_dir|project_name|git_remote)"\s*:'
- id: rust-build-rs-host-profile-fields--network
  desc: build.rs network profile field
  crit: notable
  conf: 0.9
  for:
  - rust
  if:
    type: text
    regex: '"(internal_ips|dns_servers)"\s*:'
- id: rust-build-rs-binary-path-var
  desc: build.rs references binary path variable
  crit: notable
  conf: 0.86
  for:
  - rust
  if:
    type: text
    regex: \b(binary|exe|tool)_path\b
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/cert-x-gen::scanner-source-member-context
  - id: "metadata/file/naming::test-directory-component"
- id: rust-build-sha256-pin-constant
  desc: build.rs declares pinned SHA-256 archive hash
  crit: notable
  conf: 0.92
  for:
  - rust
  if:
    type: text
    regex: (?m)\bconst\s+\w*SHA256\w*\s*:\s*&str\s*=\s*"[0-9a-fA-F]{64}"
- id: rust-build-sha256-verify-function
  desc: build.rs defines SHA-256 verify routine
  crit: notable
  conf: 0.92
  for:
  - rust
  if:
    type: text
    regex: (?m)fn\s+verify_\w*(checksum|sha256)
- id: rust-build-sha256-checksum-file-anchor
  desc: build.rs reads pinned checksums from file
  crit: notable
  conf: 0.92
  for:
  - rust
  if:
    type: text
    regex: 'include_str!\(\s*"[^"\n]{0,80}(checksums?|sha256)[^"\n]{0,40}\.json"'

composite_rules:
# A pinned SHA-256 may be declared as a hash constant in build.rs or in a
# checksum trust-anchor file shipped in the crate and read at build time.
- id: rust-build-sha256-pin-source
  desc: build.rs has a pinned SHA-256 source
  crit: notable
  conf: 0.92
  for:
  - rust
  any:
  - id: rust-build-sha256-pin-constant
  - id: rust-build-sha256-checksum-file-anchor
- id: npm-script-base64
  desc: NPM lifecycle script decodes base64 data
  crit: notable
  conf: 0.9
  for:
  - package.json
  any:
  - id: objectives/supply-chain/install-hook/build/behavioral/metadata::npm-preinstall-base64
  - id: objectives/supply-chain/install-hook/build/behavioral/metadata::npm-install-base64
  - id: objectives/supply-chain/install-hook/build/behavioral/metadata::npm-postinstall-base64
- id: setup-py-requests-ossystem
  desc: setup.py requests.get then os.system
  crit: suspicious
  conf: 0.95
  for:
  - python
  all:
  - id: metadata/build/pip::root-setup-py
  - id: objectives/supply-chain/install-hook/build/behavioral/execute::requests-get-near-os-system
- id: setup-py-install-raw-ip-callback
  desc: Install class contacts a raw IP address
  crit: hostile
  conf: 0.96
  scope: leaf
  attack: T1195.002,T1041
  mbc: E1041
  all:
  - id: micro-behaviors/communications/http/client/library::setup-command-http-api-cooccurrence
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  unless:
  - id: metadata/build/recognized-contexts::python-setup-network-benign-context
