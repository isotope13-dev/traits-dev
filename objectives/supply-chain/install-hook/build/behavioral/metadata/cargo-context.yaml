defaults:
  crit: suspicious
  conf: 0.95
  platforms: [unix, windows]
  for: [crate, tar, zip]
  attack: T1195.002,T1041

traits:
  - id: objectives/supply-chain/install-hook/build/behavioral/metadata::cargo-build-module-environment-upload
    desc: Cargo build modules upload environment data
    if:
      type: value
      path: cargo_context.targets[*].behaviors
      exact: build-environment-http-body
  - id: objectives/supply-chain/install-hook/build/behavioral/metadata::cargo-proc-macro-module-environment-upload
    desc: Procedural macro uploads environment data
    if:
      type: value
      path: cargo_context.targets[*].behaviors
      exact: proc-macro-environment-http-body
