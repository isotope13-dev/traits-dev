# Each CargoTarget object has exactly one phase and one events key.
# Two matches therefore require both keys, regardless of JSON field order.
# The selector keeps this conjunction inside one target object.
---
defaults:
  crit: suspicious
  conf: 0.95
  platforms:
  - unix
  - windows
  for:
  - crate
  - tar
  - zip
  attack: T1195.002,T1041
traits:
- id: cargo-build-module-environment-upload
  desc: Cargo build modules upload environment data
  if:
    type: value
    path: cargo_context.targets[*]
    regex: (("phase":"build"|"events":\[[^]]*"environment-http-body").*){2}
- id: cargo-proc-macro-module-environment-upload
  desc: Procedural macro uploads environment data
  if:
    type: value
    path: cargo_context.targets[*]
    regex: (("phase":"proc-macro"|"events":\[[^]]*"environment-http-body").*){2}
