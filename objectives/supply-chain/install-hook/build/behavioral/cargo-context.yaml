defaults:
  platforms: [unix, windows]
  for: [crate, tar, zip]
  attack: T1195.002,T1041

traits:
  - id: cargo-build-module-environment-upload
    desc: Cargo build modules upload environment data
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: cargo_context.targets[*].behaviors
      exact: build-environment-http-body
  - id: cargo-proc-macro-module-environment-upload
    desc: Procedural macro uploads environment data
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: cargo_context.targets[*].behaviors
      exact: proc-macro-environment-http-body
