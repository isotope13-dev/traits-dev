defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1041,T1082
  mbc: E1041

composite_rules:
  - id: cargo-build-hook-asn-analytics-exfil
    desc: Cargo build hook sends host ASN through analytics
    crit: hostile
    conf: 0.98
    scope: archive
    for: [crate, cargo-toml, rust]
    all:
      - id: metadata/package/scripts/build::cargo-build-script-declared
      - id: metadata/build/archive::archive-cargo-build-rs-entry
      - id: objectives/anti-static/obfuscation/string/reconstruct::rust-charset-index-string-rebuild
      - id: micro-behaviors/communications/socket/connect::tcpstream-connect
      - id: micro-behaviors/communications/http/services/analytics::rust-asn-event-property
      - id: micro-behaviors/communications/http/services/analytics::posthog-sdk-event-capture
