defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
  attack: T1195.002
traits:
- id: rust-build-rs-oob-endpoint-common
  desc: build.rs references common OOB endpoint
  crit: notable
  conf: 0.9
  for:
  - rust
  if:
    type: text
    regex: https?://[a-z0-9-]+\.(oast\.(me|fun|pro|live)|oastify\.com|interactsh\.com)\b
composite_rules:
- id: rust-build-rs-host-profile-fields
  desc: build.rs builds host profile fields
  crit: component
  conf: 0.9
  for:
  - rust
  any:
  - id: micro-behaviors/data/format/json::rust-host-identity-key-text
  - id: objectives/supply-chain/install-hook/build/behavioral/metadata::rust-build-rs-host-profile-fields--project
  - id: objectives/supply-chain/install-hook/build/behavioral/metadata::rust-build-rs-host-profile-fields--network
  - id: objectives/supply-chain/recon-exfil/install-hook/build::rust-build-host-user-command-recon
- id: rust-build-rs-oob-endpoint
  desc: Rust source references an OOB endpoint
  crit: component
  conf: 0.9
  for:
  - rust
  any:
  - id: objectives/supply-chain/install-hook/build/behavioral/exfil::rust-build-rs-oob-endpoint-common
  - id: micro-behaviors/communications/url/host/oob::rust-collaborator-callback-url
- id: cargo-build-hook-obfuscated-file-exfil
  desc: Cargo build hook exfiltrates a selected local file
  crit: hostile
  conf: 0.995
  scope: archive
  for:
  - rust
  - crate
  - cargo-toml
  mbc: E1041
  all:
  - id: metadata/package/scripts/build::cargo-build-script-declared
  - id: objectives/supply-chain/recon-exfil/install-hook/build::rust-build-embedded-runtime-module
  - id: micro-behaviors/data/encode/xor::rust-repeating-key-xor
  - id: objectives/supply-chain/recon-exfil/install-hook/build::rust-build-encoded-command-arguments
  - id: objectives/supply-chain/recon-exfil/install-hook/build::rust-build-file-metadata-body
  - id: micro-behaviors/process/create/direct::rust-indirect-command-new
- id: setup-py-install-raw-socket-exfil
  desc: Install hook sends host data over a raw socket
  crit: hostile
  conf: 0.96
  scope: leaf
  for:
  - python
  attack: T1195.002,T1041,T1571
  mbc: E1041
  all:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/communications/socket/connect::python-connect-ip-port
  any:
  - id: micro-behaviors/os/sysinfo/platform/host::platform-system
  - id: micro-behaviors/os/sysinfo/platform/kernel::python-uptime-check
  - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
- id: setup-py-install-host-profile-beacon
  desc: Install class beacons a host profile
  crit: hostile
  conf: 0.97
  scope: leaf
  attack: T1195.002,T1082,T1033,T1041
  mbc: E1041
  all:
  - id: micro-behaviors/communications/http/client/library::setup-command-http-api-cooccurrence
  - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
  any:
  - id: micro-behaviors/process/identity/query::python-getpass-user
  - id: micro-behaviors/os/sysinfo/platform/host::platform-system
  unless:
  - id: metadata/build/recognized-contexts::python-setup-network-benign-context
- id: rust-build-rs-env-http-post
  desc: build.rs posts environment data
  crit: suspicious
  conf: 0.94
  for:
  - rust
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  - id: micro-behaviors/communications/http/request/body/environment::environment-http-body-flow
  unless:
  - id: metadata/package/files/system-package::debian-missing-sources-vendored-crate
- id: rust-proc-macro-env-http-post
  desc: Rust proc macro posts environment data
  crit: suspicious
  conf: 0.94
  for:
  - rust
  all:
  - id: metadata/lang/source/declaration::rust-proc-macro-entrypoint
  - id: micro-behaviors/communications/http/request/body/environment::environment-http-body-flow
- id: rust-build-rs-post-exfil
  desc: build.rs posts host profile to external endpoint
  crit: hostile
  conf: 0.96
  mbc: E1041
  for:
  - rust
  all:
  - id: objectives/supply-chain/install-hook/build/behavioral/exfil::rust-build-rs-env-http-post
  - id: objectives/supply-chain/install-hook/build/behavioral/exfil::rust-build-rs-host-profile-fields
  any:
  - id: "micro-behaviors/communications/http/post::cargo-build-post-arguments"
  - id: objectives/supply-chain/install-hook/build/behavioral/execute::rust-build-rs-command-output
- id: rust-build-rs-oob-host-profile-exfil
  desc: Cargo build uploads an environment host profile
  crit: hostile
  conf: 0.98
  mbc: E1041
  for:
  - rust
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  - id: objectives/supply-chain/install-hook/build/behavioral/exfil::rust-build-rs-oob-endpoint
  - id: objectives/supply-chain/install-hook/build/behavioral/exfil::rust-build-rs-host-profile-fields
  - id: micro-behaviors/communications/http/request/body/environment::rust-environment-value-http-body-flow
- id: rust-build-rs-env-curl-upload
  desc: build.rs reads env var then sends data via curl
  crit: notable
  conf: 0.92
  for:
  - rust
  all:
  - id: objectives/supply-chain/install-hook/build/behavioral/execute::rust-build-rs-env-curl-command
  - id: "micro-behaviors/communications/http/upload::rust-curl-upload-argument"
  near_bytes: 700
- id: rust-build-rs-env-wget-upload
  desc: build.rs reads env var then sends data via wget
  crit: notable
  conf: 0.92
  for:
  - rust
  all:
  - id: objectives/supply-chain/install-hook/build/behavioral/execute::rust-build-rs-env-wget-command
  - id: objectives/supply-chain/install-hook/build/behavioral/metadata::rust-build-rs-wget-send-flag
  near_bytes: 700
- id: rust-build-rs-env-exfil
  desc: build.rs sends environment-linked data outward
  crit: suspicious
  conf: 0.9
  for:
  - rust
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  any:
  - id: micro-behaviors/communications/http/request/body/environment::environment-http-body-flow
  - id: objectives/supply-chain/install-hook/build/behavioral/exfil::rust-build-rs-env-curl-upload
  - id: objectives/supply-chain/install-hook/build/behavioral/exfil::rust-build-rs-env-wget-upload
- id: cargo-build-hook-post-exfil
  desc: Cargo build hook posts environment data
  crit: hostile
  conf: 0.97
  mbc: E1041
  for:
  - rust
  - crate
  - cargo-toml
  - tar
  scope: archive
  all:
  - id: metadata/package/scripts/build::cargo-build-script-declared
  any:
  - id: objectives/supply-chain/install-hook/build/behavioral/exfil::rust-build-rs-post-exfil
  - id: objectives/supply-chain/install-hook/build/behavioral/exfil::rust-build-rs-env-http-post
  - id: objectives/supply-chain/install-hook/build/behavioral/metadata::cargo-build-module-environment-upload
- id: cargo-build-hook-oob-profile-exfil
  desc: Cargo build hook sends a host profile to an OOB endpoint
  crit: hostile
  conf: 0.99
  mbc: E1041
  attack: T1195.002,T1041,T1082
  for:
  - rust
  - crate
  - cargo-toml
  - tar
  scope: archive
  all:
  - id: metadata/package/scripts/build::cargo-build-script-declared
  - id: objectives/supply-chain/install-hook/build/behavioral/exfil::rust-build-rs-oob-host-profile-exfil
- id: cargo-archive-build-rs-post-exfil
  desc: Cargo archive build.rs posts environment data
  crit: hostile
  conf: 0.97
  mbc: E1041
  for:
  - rust
  - crate
  - cargo-toml
  - tar
  scope: archive
  all:
  - id: metadata/build/archive::archive-cargo-crate-build-script
  any:
  - id: objectives/supply-chain/install-hook/build/behavioral/exfil::rust-build-rs-post-exfil
  - id: objectives/supply-chain/install-hook/build/behavioral/exfil::rust-build-rs-env-http-post
  - id: objectives/supply-chain/install-hook/build/behavioral/metadata::cargo-build-module-environment-upload
  unless:
  - id: metadata/package/scripts/build::cargo-build-script-declared
  - id: micro-behaviors/data/control-flow/branch::cargo-credential-http-false-branch
- id: cargo-archive-build-rs-credential-exfil
  desc: Cargo build.rs harvests developer credentials and uploads them
  crit: hostile
  conf: 0.995
  mbc: E1041
  attack: T1195.002,T1552.001,T1041
  for:
  - rust
  - crate
  - cargo-toml
  - tar
  scope: archive
  all:
  - id: metadata/build/archive::archive-cargo-build-rs-entry
  - id: micro-behaviors/os/security/auth/secret::cargo-credential-source-read
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  - id: micro-behaviors/communications/http/curl::curl-data-binary
- id: cargo-proc-macro-compile-time-exfil
  desc: Cargo proc macro exfiltrates build environment
  crit: hostile
  conf: 0.98
  mbc: E1041
  for:
  - rust
  - crate
  - cargo-toml
  - tar
  scope: archive
  all:
  - id: metadata/build/config::cargo-proc-macro-target
  - id: objectives/supply-chain/install-hook/build/behavioral/exfil::rust-proc-macro-env-http-post
