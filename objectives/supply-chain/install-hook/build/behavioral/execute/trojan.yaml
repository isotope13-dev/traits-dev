defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
  attack: T1195.002

traits:
- id: setup-py-subprocess-run
  desc: Custom build_ext class runs subprocess.run
  crit: suspicious
  conf: 0.85
  for:
  - python
  if:
    type: text
    regex: class\s+\w+\s*\([^)]{0,80}\bbuild_ext\b[^)]{0,80}\):[\s\S]{0,400}subprocess\.run\(
- id: setup-py-subprocess-call
  desc: setup.py install class with subprocess
  crit: suspicious
  conf: 0.85
  for:
  - python
  if:
    type: text
    regex: class\s+\w*Install\w*\s*\([^)]{0,160}\binstall\b[^)]{0,160}\)[\s\S]{0,600}subprocess\.
  unless:
  - id: metadata/lang/javascript-features::sourcemap-sources-content
  - id: metadata/package/testing/presence/harness/
  - id: metadata/build/pip::python-packaging-tool-tests
  - id: metadata/build/pip::setuptools-package-index
  - id: metadata/build/pip::setuptools-easy-install-source
  - id: "metadata/file/naming::test-directory-component"
  downgrade:
    any:
    - id: micro-behaviors/process/create/shell/build::make-toolchain-invocation
    - id: micro-behaviors/process/create/shell/build::make-toolchain-shell-format
    - id: micro-behaviors/process/create/shell/build::build-script-toolchain-invocation
- id: setup-py-curl-exec-call
  desc: setup.py curl/wget downloads then exec()
  crit: suspicious
  conf: 0.95
  for:
  - python
  if:
    type: text
    regex: (setup\.py|cmdclass)[\s\S]{0,500}(curl|wget)[\s\S]{0,200}exec
  unless:
  - id: well-known/tool/detection/
  - id: well-known/lib/format/conda-package/
  - id: well-known/tool/sysadmin/alpine-packages/
- id: setup-py-curl-eval-call
  desc: setup.py curl/wget downloads then eval()
  crit: suspicious
  conf: 0.95
  for:
  - python
  if:
    type: text
    regex: (setup\.py|cmdclass)[\s\S]{0,500}(curl|wget)[\s\S]{0,200}eval
- id: setup-py-urlopen-exec-call
  desc: setup.py urlopen downloads then exec()
  crit: suspicious
  conf: 0.95
  for:
  - python
  if:
    type: text
    regex: (setup\.py|cmdclass)[\s\S]{0,500}urlopen[\s\S]{0,200}exec
  unless:
  - id: well-known/tool/detection/pipguard::pipguard-defensive-scanner-source
- id: setup-py-urlopen-eval-call
  desc: setup.py urlopen downloads then eval()
  crit: suspicious
  conf: 0.95
  for:
  - python
  if:
    type: text
    regex: (setup\.py|cmdclass)[\s\S]{0,500}urlopen[\s\S]{0,200}eval
- id: setup-py-urlopen-ossystem-call
  desc: setup.py urlopen downloads then os.system()
  crit: suspicious
  conf: 0.95
  for:
  - python
  if:
    type: text
    regex: (setup\.py|cmdclass)[\s\S]{0,500}urlopen[\s\S]{0,200}os\.system
- id: setup-py-requests-exec
  desc: setup.py requests.get then exec
  crit: suspicious
  conf: 0.95
  for:
  - python
  if:
    type: text
    regex: (setup\.py|cmdclass)[\s\S]{0,500}requests\.get[\s\S]{0,200}exec
- id: setup-py-requests-eval
  desc: setup.py requests.get then eval
  crit: suspicious
  conf: 0.95
  for:
  - python
  if:
    type: text
    regex: (setup\.py|cmdclass)[\s\S]{0,500}requests\.get[\s\S]{0,200}eval
- id: setup-hidden-decoded-process-chain
  desc: Build script decodes before suppressed process
  crit: suspicious
  conf: 0.96
  for:
  - python
  if:
    type: text
    regex: (?s)b64decode.{0,900}DEVNULL.{0,900}(cmdclass|setup\s*\()
- id: wget-shell-script-to-tmp
  desc: wget downloads a shell script into /tmp
  crit: notable
  conf: 0.9
  for:
  - python
  - shell
  - text
  attack: T1105
  if:
    type: text
    regex: wget\s+https?://.{1,80}\.sh\s+-O\s+/tmp/.{1,40}\.sh
  unless:
    - id: metadata/file/format/structured::serialized-news-article-catalog
- id: setup-py-chmod-bash-tmp-sh
  desc: setup.py chmods and runs /tmp shell script
  crit: suspicious
  conf: 0.95
  for:
  - python
  if:
    type: text
    regex: chmod\s+777\s+/tmp/.{1,40}\.sh\s+&&\s+bash\s+/tmp/.{1,40}\.sh
- id: npm-install-eval-string
  desc: install script evaluates a code string
  crit: suspicious
  conf: 0.95
  for:
  - package.json
  if:
    type: text
    regex: '"(pre|post)?install"\s*:\s*"([^"]{0,100}[^-\w])?eval[^-\w]'
  unless:
  - id: well-known/tool/development/vscode-extension/vscode-marketplace::oxc-vscode-package-name
  - id: metadata/package/testing/presence/manifest::has-karma
- id: npm-install-shell-command-string
  desc: install script runs an inline shell command
  crit: suspicious
  conf: 0.9
  for:
  - package.json
  if:
    type: text
    regex: '"(pre|post)?install"\s*:\s*"[^"]{0,100}\b(sh|bash|zsh)\s+-c\b'
  unless:
  - id: well-known/tool/development/vscode-extension/vscode-marketplace::oxc-vscode-package-name
  - id: metadata/package/testing/presence/manifest::has-karma
- id: npm-script-pipe-sh
  desc: npm script pipes to shell
  crit: suspicious
  conf: 0.95
  for:
  - package.json
  if:
    type: text
    regex: '"(pre|post)?install"\s*:\s*"[^"]{0,200}\|\s*(sh|shell|zsh)'
  unless:
  - id: well-known/tool/development/vscode-extension/vscode-marketplace::oxc-vscode-package-name
  - id: metadata/package/testing/presence/manifest::has-karma
  - id: metadata/package/testing/corpus::inert-scanner-attack-corpus
- id: rust-build-rs-env-curl-command
  desc: build.rs reads env var and invokes curl
  crit: notable
  conf: 0.92
  for:
  - rust
  if:
    type: text
    regex: std::env::var\w*[\s\S]{0,290}Command::new\s*\(\s*"curl"
- id: rust-build-rs-env-wget-command
  desc: build.rs reads env var and invokes wget
  crit: notable
  conf: 0.92
  for:
  - rust
  if:
    type: text
    regex: std::env::(vars|var(_os)?)[\s\S]{0,300}Command::new\s*\(\s*"wget"
- id: rust-build-rs-command-path
  desc: build.rs runs computed binary path
  crit: notable
  conf: 0.95
  for:
  - rust
  if:
    type: text
    regex: (Command::new\(\&binary_path\))
- id: rust-build-rs-command-status
  desc: build.rs waits on command status
  crit: notable
  conf: 0.86
  for:
  - rust
  if:
    type: text
    regex: Command::new.{0,200}\.status\s*\(

- id: makefile-curl-pipe-eval
  desc: Makefile downloads and pipes to eval
  crit: suspicious
  conf: 0.9
  for:
  - shell
  if:
    type: text
    regex: (^|\n)\t(curl|wget).{0,50}\|.{0,20}eval
  unless:
  - type: text
    regex: ^#!
  - type: basename
    regex: .*\.(ya?ml|json|toml)$
    case_insensitive: true
  - id: well-known/tool/development/aube::aube-node-platform-package-loader
- id: makefile-hidden-target
  desc: Makefile with suspicious hidden command
  crit: suspicious
  conf: 0.8
  for:
  - shell
  if:
    type: text
    regex: ^\.[a-z]+:[\s\S]{0,100}(curl|wget|nc )
  unless:
  - type: text
    regex: ^#!
  - id: well-known/tool/sysadmin/rancher::dapper-release-download
- id: rust-build-sha256-checksum-compare
  desc: build.rs compares downloaded archive SHA-256
  crit: notable
  conf: 0.92
  for:
  - rust
  if:
    type: text
    regex: assert_eq!\s*\(\s*\w*(digest|hash|checksum)\w*\s*,\s*\w*SHA256\w*
- id: rust-build-tar-extract-command
  desc: build.rs extracts tar archive
  crit: notable
  conf: 0.88
  for:
  - rust
  if:
    type: text
    regex: Command::new\s*\(\s*"tar"\s*\)
- id: setup-py-clean-command-removes-build-artifacts
  desc: setup.py clean removes build artifacts
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: os\.system\([^\n]{0,120}rm\s+-[^\n]{0,120}\.egg-info

composite_rules:
- id: python-packaging-curl-download-execute
