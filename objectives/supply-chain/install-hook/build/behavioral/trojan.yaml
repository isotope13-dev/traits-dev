  # === Python Build Trojan ===
  # The same install-time network call, carrying who and where it landed.
  #
  # `setup-py-network-in-install` says a build class reaches the network, which
  # a legitimate package occasionally does -- fetching a wheel for a platform
  # it could not vendor, checking a licence server. What it does not do is
  # describe the machine while doing it. `socket.gethostname()` plus the login
  # name or the OS is a victim record, and an install hook runs on every
  # consumer before anything has been imported, so the record is taken from
  # people who only asked to install a dependency.
  #
  # Worked example: a `RunCommand(install)` that builds
  # `?action=setup&host=...&user=...&os=...` and opens it against a
  # webhook.site collector before calling `install.run(self)` so the install
  # still succeeds.
  #
  # `install-hook/dropper/setup::setup-install-host-identity-payload` describes
  # the same act as one regex -- `gethostname()` then `getuser()` then
  # `requests.get(`, in that order and within 240 characters of each other.
  # This is the structural form: it does not care about the order the fields
  # are read in, and it takes the network leg from whichever client the hook
  # actually uses, so a release that swaps `requests` for `urllib` or reads the
  # user first still lands here.
  # An install hook that both hides what it runs and throws away what it says.
  #
  # Suppressing a child's stdout and stderr during an install is the part that
  # does not have an innocent reading. A build step that compiles an extension
  # or fetches a wheel wants its errors seen -- that is how a failed install
  # gets diagnosed. Routing both streams to DEVNULL means the author expects
  # output the installing user should not read, or expects failures they should
  # not notice.
  #
  # Paired with base64 in the same hook, which is what conceals *which* command
  # runs: the string is not sensitive data, it is the command line, and the
  # only thing encoding buys is that a reader skimming setup.py sees a blob.
  #
  # Worked example: a `requests` typosquat whose install class decodes
  # `ioreg -d2 -c IOPlatformExpertDevice` and `IOPlatformUUID` from base64 to
  # read the Mac's hardware UUID, then launches a bundled binary with
  # `close_fds=True` and both streams to DEVNULL before deferring to
  # `install.run(self)` so the install still appears to succeed.
  - id: setup-py-install-hidden-decoded-exec
    desc: Install hook runs a decoded command silently
    crit: hostile
    conf: 0.96
    scope: leaf
    attack: "T1195.002,T1027,T1564.003"
    mbc: "E1027"
    all:
      - id: setup-py-or-cmdclass-marker
      - id: setup-install-or-build-class
      - id: micro-behaviors/data/decode/base64::b64decode-call
      - id: micro-behaviors/process/create/subprocess::subprocess-suppresses-stdio
    # No `metadata/package/testing/` suppression, unlike the network rules in
    # this file. A `setup.py` legitimately configures a test command -- the
    # real `requests` ships a `PyTest(TestCommand)` class -- so the marker
    # fires on any clone of a package that does, which is exactly what a
    # typosquat is. The four legs here are specific enough to stand without it:
    # a build class that decodes a string and runs it with both streams
    # discarded is not a test harness.
    unless:
      - id: setup-py-network-known-package-profile

  # An install hook that talks to a raw IP address.
  #
  # `setup-py-network-in-install` establishes that a build class reaches the
  # network; the destination is what makes this one hostile. A published
  # package that needs a network call uses a hostname -- an API it documents, a
  # CDN, a registry. A literal `http://<ip>:<port>` is where you send data when
  # you do not want a name in DNS or in the source, and no legitimate install
  # step has a reason to hardcode one. Pairing the two says the install phase
  # is reaching an unnamed host.
  #
  # Worked example: a `PostInstallCommand(install)` that globs `/home` for
  # `prices.txt` and POSTs each file's contents to `http://140.238.202.225:8080`.
  - id: setup-py-install-raw-ip-callback
    desc: Install class contacts a raw IP address
    crit: hostile
    conf: 0.96
    scope: leaf
    attack: "T1195.002,T1041"
    mbc: "E1041"
    all:
      - id: setup-py-network-in-install
      - id: micro-behaviors/communications/ip/literal::http-ip-url

  # An install hook that POSTs a body to the network, rather than just
  # fetching.
  #
  # `setup-py-network-in-install` covers any network call from a build class;
  # this narrows to the ones that *upload*. A `urlopen(url, data=...)` or a
  # POST during install is sending something out, not pulling a dependency in
  # -- and the only thing a package has to send at install time is information
  # about the machine it is installing on. The data is often obfuscated (an
  # encoded `os.environ`, a URL assembled from split strings to dodge a string
  # match), but the direction is not: bytes are leaving.
  #
  # Worked example: an `InstallCommand(install)` that json-encodes
  # `os.environ.copy()`, builds an `*.oast.fun` URL from `'oa'+'st'` fragments,
  # and `urlopen`s it with the encoded environment as the POST body.
  # An install hook that decodes a base64 blob and pipes it to a shell.
  #
  # `echo <b64> | base64 -d | bash` (or `| sh`) is the shell-side twin of
  # `exec(b64decode(...))`: the command that actually runs never appears in the
  # source, only its encoded form. Wrapped in a build class it runs at install,
  # and `os.system`/`subprocess` hands it to `/bin/sh` -- so nothing about the
  # published package reveals what executes on the consumer's machine.
  #
  # Worked example: a `CustomInstall(install)` whose `run()` calls
  # `os.system('echo %s | base64 -d | bash' % encoded)`.
  # An install hook that opens a raw socket to a hardcoded address and sends
  # host data over it.
  #
  # `setup-py-install-uploads-data` covers the HTTP case; this is the same act
  # one layer down. A build class that does `socket.connect(("<ip>", <port>))`
  # and `send(systeminfo)` is exfiltrating over a bare TCP socket -- no URL, no
  # library, just a literal address. Nothing an install legitimately does opens
  # a socket to a hardcoded IP to push the machine's uptime and platform.
  #
  # Worked example: a `PostInstallCommand(install)` that connects to
  # `("134.209.85.64", 9090)` and sends `f"{uptime} --- {systeminfo}"`.
  - id: setup-py-install-raw-socket-exfil
    desc: Install hook sends host data over a raw socket
    crit: hostile
    conf: 0.96
    scope: archive
    for: [python, package.json, tar, zip, whl, archives]
