defaults:
  platforms:
    - unix
    - windows
  for:
    - shell
  crit: suspicious
  attack: T1195.002
traits:
  - id: configure-hidden-cmd
    desc: configure with hidden command execution
    crit: suspicious
    conf: 0.85
    for: [c, shell]
    if:
      type: text
      regex: AC_INIT[\s\S]{0,500}(system|exec|popen)\s*\(
    unless:
      - id: well-known/app/development/gcc-source::gcc-source-archive-member
      - id: well-known/lib/development/modernc-ccorpus2::source-archive-path
  # A genuine autotools build script: the file is named configure / configure.ac
  # / configure.in / Makefile.in / Makefile.am, OR carries an autoconf hallmark
  # (AC_INIT, the "Generated by GNU Autoconf" banner, ac_config_*). The
  # "trojanized configure" identity requires THIS context. Generic curl/wget
  # pipe/eval detections live under command-and-control/dropper and are composed
  # with this context below.
  - id: configure-context-name
    desc: Autotools configure script filename
    crit: component
    conf: 0.9
    if:
      type: basename
      regex: '^(configure(\.(ac|in))?|Makefile\.(in|am))$'
  - id: configure-context-marker
    desc: Autoconf-generated configure script marker
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bAC_INIT\b|\bac_config_(headers|files)\b'
  # AC_DEFUN / m4_define are the fundamental autoconf macro-definition
  # primitives present in every autotools project (configure.ac, aclocal.m4,
  # every *.m4 macro file). Bare, they carry no supply-chain signal — they only
  # matter combined with command-exec/encoding in the m4-macro-def -> m4-backdoor
  # composite chain below. Keep them `component` so they feed those composites
  # without surfacing standalone on benign autotools sources.
  - id: m4-define-keyword
    desc: m4_define macro keyword
    crit: component
    conf: 0.6
    for: [c, shell, text]
    if:
      type: text
      word: m4_define
  - id: ac-defun-keyword
    desc: AC_DEFUN macro keyword
    crit: component
    conf: 0.6
    for: [c, shell, text]
    if:
      type: text
      word: AC_DEFUN
  - id: m4-system-call
    desc: system() call in M4 macro marker
    crit: suspicious
    conf: 0.75
    for: [c, shell, text]
    if:
      type: text
      regex: (\bAC_DEFUN\b|\bm4_define\b|\bm4_ifdef\b)[\s\S]{0,200}\bsystem\s*\(
  - id: m4-exec-call
    desc: exec call in M4 macro marker
    crit: suspicious
    conf: 0.75
    for: [c, shell, text]
    if:
      type: text
      regex: (\bAC_DEFUN\b|\bm4_define\b|\bm4_ifdef\b)[\s\S]{0,200}\bexec\s*\(
  - id: m4-esyscmd
    desc: M4 esyscmd (shell execution)
    crit: component
    conf: 0.8
    for: [c, shell, text]
    if:
      type: text
      word: m4_esyscmd
  - id: recursive-srcdir-search
    desc: Build logic recursively searches the source tree
    crit: component
    conf: 0.9
    for: [shell, text]
    if:
      type: text
      regex: 'grep\s+-[A-Za-z]*[rR][A-Za-z]*[^\n]{0,50}\$srcdir'
  - id: encoded-sentinel-search
    desc: Opaque source-search sentinel
    crit: suspicious
    conf: 0.98
    for: [shell, text]
    if:
      type: text
      substr: '#{4}[[:alnum:]]{5}#{4}$'
  - id: carrier-suffix-command
    desc: Command derived from carrier suffix
    crit: component
    conf: 0.92
    for: [shell, text]
    if:
      type: text
      substr: 'sed "s/.*\.//g"'
  - id: custom-character-permutation
    desc: Custom character permutation
    crit: component
    conf: 0.96
    for: [shell, text]
    if:
      type: text
      substr: 'tr "\t \-_" " \t_\-"'
  - id: eval-transform-decompress-pipeline
    desc: Carrier transform and derived decompressor
    crit: suspicious
    conf: 0.99
    for: [shell, text]
    if:
      type: text
      regex: 'sed.{0,80}eval\s+\$gl_path_map\s*\|\s*\$gl_[^\s]{1,24}_prefix\s+-d'
  - id: eval-variable-piped-to-shell
    desc: Evaluated build variable piped to shell
    crit: suspicious
    conf: 0.99
    for: [shell, text]
    if:
      type: text
      regex: 'eval\s+\$gl_config_gt\s*\|\s*\$SHELL'
  - id: config-command-eval-shell
    desc: Autoconf command evaluates shell content
    crit: suspicious
    conf: 0.99
    for: [shell, text]
    if:
      type: text
      regex: 'AC_CONFIG_COMMANDS[^\n]{0,120}eval\s+\$gl_config_gt\s*\|\s*\$SHELL'
  - id: makefile-basename
    desc: Makefile filename
    crit: component
    conf: 1.0
    if:
      type: path
      basename: true
      exact: Makefile.am
      case_insensitive: true
  - id: makefile-curl-wget
    desc: curl/wget download in build file
    crit: component
    conf: 0.85
    if:
      type: text
      regex: (curl|wget)\s+.{0,50}(http|ftp)://
  - id: makefile-install-hook
    desc: Suspicious install hook
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: install-(exec|data)-hook.{0,100}(curl|wget|sh\s+-c)
  - id: test-fixture-binary-common
    desc: "Binary blob in test fixtures"
    crit: component
    conf: 0.7
    for: [data]
    if:
      type: path
      regex: '(fixtures?|data|files)[\\/][^\\/]+\.(bin|dat|raw)$'
  - id: test-fixture-binary-compressed
    desc: Compressed blob in test fixtures
    crit: component
    conf: 0.7
    # Cleave exposes compressed fixture members as opaque data; the
    # compression codec is represented by the path suffix below.
    for: [data]
    if:
      type: path
      regex: '(fixtures?|data|files)[\\/][^\\/]+\.(xz|gz|bz2|lzma)$'
  - id: test-samples-binary
    desc: Binary blob in test samples
    crit: component
    conf: 0.7
    for: [data]
    if:
      type: path
      regex: tests?/samples?.{0,30}\.(bin|dat|raw)
  - id: test-samples-compressed
    desc: Compressed blob in test samples
    crit: component
    conf: 0.7
    # Cleave exposes compressed fixture members as opaque data; the
    # compression codec is represented by the path suffix below.
    for: [data]
    if:
      type: path
      regex: tests?/samples?.{0,30}\.(xz|gz|bz2|lzma)
  - id: test-fixture-exec-xz
    desc: Test fixture decompressed with xz and executed
    crit: notable
    conf: 0.75
    if:
      type: text
      # Require xz/xzcat/unxz as a decompressor command — not ADD of *.tar.xz
      # (Docker/build tests) or unrelated "test…xz…|shell" string adjacency.
      regex: 'test.{0,50}\b(xzcat|unxz|xz -[a-z]*d)\b[\s\S]{0,100}(sh|shell|\|)'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - type: text
        regex: test -f '[^']+' \|\| echo '\$\(srcdir\)/'
      - id: metadata/package/testing/presence/platform_suites::autoconf-testsuite
      - id: metadata/package/testing/presence/platform_suites::gnu-coreutils-test
  - id: test-fixture-exec-gzip
    desc: 'test fixture exec gzip'
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: 'test.{0,50}(gzip|gunzip)[\s\S]{0,100}(sh|shell|\|)'
    unless:
      - id: metadata/package/testing/presence/platform_suites::autoconf-testsuite
      - id: metadata/package/testing/presence/platform_suites::gnu-coreutils-test
  - id: test-fixture-exec-bzcat
    desc: "Test fixture decompressed w/ bzcat & executed"
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'test.{0,50}bzcat[\s\S]{0,100}(sh|shell|\|)'
    unless:
      - id: metadata/package/testing/presence/platform_suites::autoconf-testsuite
      - id: metadata/package/testing/presence/platform_suites::gnu-coreutils-test
  - id: object-file-in-source-unix
    desc: Pre-compiled Unix object in source tree
    crit: notable
    conf: 0.8
    size_max: 200000
    if:
      type: path
      regex: '(^|[\\/])[^\\/]{1,80}\.(o|lo)$'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: micro-behaviors/process/create/shell/git::git-operations-1
      - id: micro-behaviors/process/create/shell/git::git-operations-2
      - type: text
        regex: Generated by GNU Autoconf|ac_config_headers|exec_prefix=
  - id: libtool-la-injection
    desc: Suspicious .la file manipulation
    crit: suspicious
    conf: 0.75
    if:
      type: text
      regex: \.la.{0,50}(dlopen|RTLD_)
composite_rules:
  - id: makefile-am-curl
    desc: Makefile.am with curl/wget download
    crit: suspicious
    conf: 0.85
    all:
      - id: makefile-basename
      - id: makefile-curl-wget
  - id: env-dump-cmd
    desc: Environment dump command
    crit: notable
    conf: 0.6
    any:
      - id: micro-behaviors/os/env/vars/access::env-cmd-bare
      - id: micro-behaviors/os/env/vars/access::printenv
  - id: network-exec-relay-evidence
    desc: Network execution or relay evidence
    crit: component
    conf: 0.6
    any:
      - id: objectives/command-and-control/dropper/delivery/pipe::curl-pipe-shell
      - id: objectives/command-and-control/dropper/delivery/pipe::wget-pipe-shell
      - id: objectives/command-and-control/dropper/execution/eval::curl-pipe-eval
      - id: objectives/command-and-control/dropper/execution/eval::wget-pipe-eval
      - id: micro-behaviors/communications/socket/netcat::nc
    unless:
      - id: well-known/app/development/calvyn-code
  - id: configure-env-exfil
    desc: Configure script sends environment remotely
    crit: notable
    conf: 0.9
    all:
      - id: configure-marker
      - id: env-dump-cmd
      - id: network-exec-relay-evidence
  - id: configure-marker
    desc: Autotools configure build marker
    crit: component
    conf: 0.9
    any:
      - id: configure-context-name
      - id: configure-context-marker
      - id: metadata/build/autotools::autoconf-generated-script
  - id: configure-network-exec-in-marker
    desc: Configure script runs network-fed code
    crit: suspicious
    conf: 0.9
    all:
      - id: configure-marker
    any:
      - id: network-exec-relay-evidence
  - id: configure-trojan
    desc: Trojanized configure script
    crit: suspicious
    conf: 0.9
    any:
      # Generic curl/wget-to-shell only counts as "trojanized configure" when it
      # lands inside an actual configure script (configure-context). Standalone
      # installers and CI workflows that pipe a download to a shell are covered
      # by the dropper/pipe objectives, not by this autotools-tamper identity.
      - id: configure-network-exec-in-marker
      - id: configure-env-exfil
    unless:
      - id: well-known/app/development/calvyn-code
      - id: configure-hidden-cmd
  - id: m4-macro-def
    desc: M4 macro definition keyword
    crit: baseline
    conf: 0.6
    any:
      - id: m4-define-keyword
      - id: ac-defun-keyword
  - id: m4-cmd-exec
    desc: Command execution in M4 marker
    crit: suspicious
    conf: 0.8
    any:
      - id: m4-system-call
      - id: m4-exec-call
  - id: m4-encoding-tool
    desc: Encoding tool reference
    crit: notable
    conf: 0.6
    any:
      - id: micro-behaviors/data/decode/base64::base64-tool
      - id: micro-behaviors/data/decode/hex::xxd-tool-reference
      - id: micro-behaviors/data/decode/command::od-decode-command
  - id: m4-define-exec
    desc: M4 macro with command execution
    crit: suspicious
    conf: 0.85
    all:
      - id: m4-macro-def
      - id: m4-cmd-exec
  # Renamed from `m4-hidden-payload` ("M4 macro with encoded payload"): the two
  # legs only establish that an .m4 defines macros and shells out to a
  # binary-decoding tool, never that anything was decoded or that the output is
  # used. gnulib's AC_LIB_PREPARE_MULTILIB in lib-prefix.m4 reads an ELF class
  # byte with `od`, so every gnulib-using GNU tarball (gettext, coreutils, tar,
  # grep, sed, wget, gnutls...) claimed a hidden payload. The decoder surface is
  # still worth surfacing — it is what the xz-utils backdoor abused — but the
  # payload intent comes from m4-backdoor's m4_esyscmd leg, which is unchanged.
  - id: m4-macro-decoder-tool
    desc: M4 macro file shells out to a decoder
    crit: notable
    conf: 0.85
    all:
      - id: m4-macro-def
      - id: m4-encoding-tool
  - id: m4-backdoor
    desc: Backdoored M4 macro
    crit: hostile
    conf: 0.9
    all:
      - id: m4-macro-def
      - id: m4-esyscmd
    any:
      - id: m4-define-exec
      - id: m4-macro-decoder-tool
  - id: autotools-source-tree-payload-loader
    desc: Autotools build logic discovers, decodes, and executes a hidden source payload
    crit: hostile
    conf: 0.99
    for: [shell, text]
    all:
      - id: recursive-srcdir-search
      - id: eval-transform-decompress-pipeline
      - id: eval-variable-piped-to-shell
    any:
      - id: configure-context-name
      - id: configure-context-marker
      - id: ac-defun-keyword
      - id: m4-define-keyword
  - id: autotools-obfuscated-test-carrier-loader
    desc: Autotools build logic locates an opaque carrier and dispatches its decoder
    crit: hostile
    conf: 0.995
    for: [shell, text]
    all:
      - id: encoded-sentinel-search
      - id: carrier-suffix-command
      - id: custom-character-permutation
      - id: eval-transform-decompress-pipeline
  - id: autotools-deferred-config-shell-loader
    desc: Autoconf defers a source-carrier decode pipeline into config.status
    crit: hostile
    conf: 0.995
    for: [shell, text]
    all:
      - id: config-command-eval-shell
      - id: recursive-srcdir-search
      - id: eval-transform-decompress-pipeline
  - id: test-fixture-binary
    desc: Any binary blob in test directory
    crit: component
    conf: 0.7
    any:
      - id: test-fixture-binary-common
      - id: test-fixture-binary-compressed
      - id: test-samples-binary
      - id: test-samples-compressed
  - id: test-fixture-exec
    desc: Any test fixture execution pattern
    crit: suspicious
    conf: 0.85
    any:
      - id: test-fixture-exec-xz
      - id: test-fixture-exec-gzip
      - id: test-fixture-exec-bzcat
  - id: test-fixture-attack
    desc: Malicious test fixture pattern (XZ-style)
    crit: hostile
    conf: 0.9
    for: [tar]
    scope: archive
    all:
      - id: test-fixture-binary-compressed
    any:
      - id: autotools-source-tree-payload-loader
      - id: autotools-obfuscated-test-carrier-loader
  - id: autotools-padded-compressed-carrier
    desc: Autotools loader uses padded compressed carrier
    crit: hostile
    conf: 0.995
    for: [tar]
    scope: archive
    all:
      - id: test-fixture-binary-compressed
      - id: metadata/file/profile/metrics::repeated-uppercase-padding-runs
    any:
      - id: autotools-source-tree-payload-loader
      - id: autotools-obfuscated-test-carrier-loader
  - id: autotools-supply-chain-attack
    desc: Autotools build system supply chain attack
    crit: suspicious
    conf: 0.9
    any:
      - id: configure-trojan
      - id: m4-backdoor
      - id: test-fixture-attack
