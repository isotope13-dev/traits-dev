defaults:
  platforms:
    - unix
    - windows
  for:
    - shell
  crit: suspicious
  attack: T1195.002
composite_rules:
  - id: autotools-source-tree-payload-loader
    desc: Autotools build logic discovers, decodes, and executes a hidden source payload
    crit: hostile
    conf: 0.99
    for: [shell, text]
    all:
      - id: micro-behaviors/fs/search/command::recursive-srcdir-search
      - id: micro-behaviors/data/decode/command::eval-transform-decompress-pipeline
      - id: micro-behaviors/process/create/shell/pipeline::eval-variable-piped-to-shell
    any:
      - id: metadata/build/autotools::autotools-input-script-basename
      - id: metadata/build/autotools::autoconf-init-marker
      - id: metadata/build/autotools::autoconf-m4-ac-defun
      - id: metadata/build/autotools::autoconf-m4-define
  - id: autotools-obfuscated-test-carrier-loader
    desc: Autotools build logic locates an opaque carrier and dispatches its decoder
    crit: hostile
    conf: 0.995
    for: [shell, text]
    all:
      - id: metadata/lang/source/literal/string/shape::encoded-sentinel-search
      - id: micro-behaviors/data/string/transform::carrier-suffix-command
      - id: micro-behaviors/data/string/transform::custom-character-permutation
      - id: micro-behaviors/data/decode/command::eval-transform-decompress-pipeline
  - id: autotools-deferred-config-shell-loader
    desc: Autoconf defers a source-carrier decode pipeline into config.status
    crit: hostile
    conf: 0.995
    for: [shell, text]
    all:
      - id: micro-behaviors/process/create/shell/pipeline::config-command-eval-shell
      - id: micro-behaviors/fs/search/command::recursive-srcdir-search
      - id: micro-behaviors/data/decode/command::eval-transform-decompress-pipeline
  - id: test-fixture-attack
    desc: Malicious test fixture pattern (XZ-style)
    crit: hostile
    conf: 0.9
    for: [tar, shell, text, data]
    scope: archive
    all:
      - id: metadata/package/testing/corpus/paths::test-fixture-binary-compressed
    any:
      - id: autotools-source-tree-payload-loader
      - id: autotools-obfuscated-test-carrier-loader
  - id: autotools-padded-compressed-carrier
    desc: Autotools loader uses padded compressed carrier
    crit: hostile
    conf: 0.995
    for: [tar, shell, text, data]
    scope: archive
    all:
      - id: metadata/package/testing/corpus/paths::test-fixture-binary-compressed
      - id: metadata/file/profile/text-distribution::repeated-uppercase-padding-runs
    any:
      - id: autotools-source-tree-payload-loader
      - id: autotools-obfuscated-test-carrier-loader
  - id: autotools-build-command-or-fixture-clues
    desc: Autotools command or hostile fixture clues
    crit: suspicious
    conf: 0.9
    any:
      - id: micro-behaviors/metaprogramming/generation/build::m4-command-decoder-clues
      - id: test-fixture-attack

  # A generated `configure` that carries a network shell in a heredoc.
  #
  # Autoconf compiles and runs small probe programs constantly, so the generic
  # compile-and-run rule (`execution/compile/runtime::shell-compiles-and-runs-
  # carried-source`) excludes autoconf-generated scripts outright -- otherwise
  # every source tarball on earth would report. That exclusion is precisely the
  # hiding place: fragroute 1.2, tcpdump/libpcap 2002 and openssh 3.4p1 all put
  # their payload in the generated `configure`, where nobody reads and the
  # build system's own noise covers it.
  #
  # What separates the attack from the noise is not the compile step, it is the
  # program being compiled: an autoconf probe checks for a symbol or a header,
  # it does not open a socket to a hardcoded address and exec a shell. Naming
  # that combination lets the exclusion stay in place for honest scripts.
