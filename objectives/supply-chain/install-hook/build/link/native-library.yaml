# A Cargo build script runs with the developer's privileges on every `cargo
# build`, so anything it fetches is executed code. Downloading a prebuilt
# library and handing its directory to rustc links unverified third-party
# bytes into the final binary -- the Rust analogue of an npm postinstall that
# curls a binary. Some -sys crates genuinely do this to avoid a source build,
# so this surfaces the pattern for review rather than convicting on its own.
defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: T1195.002
  mbc: B0024
composite_rules:
  - id: build-script-links-downloaded-library
    desc: Build script links a downloaded library
    crit: suspicious
    conf: 0.9
    all:
      - id: objectives/supply-chain/install-hook/build/behavioral::rust-build-rs-file
      - id: micro-behaviors/communications/http/download/handler::rust-http-response-materialized
      - id: metadata/build/ecosystem::cargo-rustc-link-search-directive
