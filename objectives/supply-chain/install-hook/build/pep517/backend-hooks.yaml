# PEP 517 / 518 build-backend hooks. Modern Python packages declare a
# build backend in pyproject.toml. Malicious backends override
# build_wheel / build_sdist / prepare_metadata_for_build_wheel and run
# code during `pip install` even with --no-build-isolation off.
#
# Existing setup.py coverage doesn't catch these — pyproject.toml-only
# packages have no setup.py at all.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
  attack: T1195.002
  mbc: B0024

traits:
  # Modern editable .pth files can carry import-time side effects.
  - id: editable-pth-import-side-effect
    desc: Editable .pth executes import side-effect
    conf: 0.85
    if:
      type: text
      regex: '__editable__\.[A-Za-z0-9_-]{1,40}\.pth'

composite_rules:
  - id: python-install-lib-import-pth
    desc: Install hook writes an import .pth
    crit: hostile
    conf: 0.97
    attack: T1546.011,T1195.002
    scope: file
    near_lines: 15
    all:
      - id: metadata/build/package/recipe/setup-hooks::setuptools-install-lib-override
      - id: metadata/lang/source/syntax/call::pth-suffix-before-write-text
      - id: micro-behaviors/process/interpreter/python::import-statement-string-literal

  - id: python-pth-hook-urlopen-beacon
    desc: Startup .pth calls a URL beacon
    crit: hostile
    conf: 0.96
    attack: T1546.011,T1071.001
    scope: archive
    for: [python, python-sdist, whl, zip]
    all:
      - id: python-install-lib-import-pth
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass

  - id: python-install-writes-home-file
    desc: Install hook writes a home file
    crit: hostile
    conf: 0.96
    attack: T1195.002,T1565
    near_lines: 20
    all:
      - id: metadata/build/package/recipe/setup-hooks::setuptools-install-class
      - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
      - id: micro-behaviors/fs/path/location::python-expanduser-tilde
      - id: micro-behaviors/fs/file/open::write-append-create-mode

  # An in-tree backend (backend-path) whose hooks sit beside a module that
  # fetches and launches a second stage: `pip install` of the sdist imports the
  # backend from the archive itself, so the hook runs the stage before any
  # dependency is resolved and without a setup.py to inspect. The backend and
  # the stage are usually separate members, hence archive scope.
  - id: in-tree-backend-ships-staged-loader
    desc: In-tree build backend ships a staged loader
    crit: hostile
    conf: 0.96
    attack: T1195.002,T1105
    for: [python-sdist, pyproject.toml, python]
    scope: archive
    all:
      - id: metadata/package/config::pep517-backend-path-declaration
      - id: objectives/command-and-control/dropper/delivery/multistage::two-stage-fetch-and-exec
    any:
      - id: metadata/build/package/recipe/setup-hooks::python-build-wheel-function
      - id: metadata/build/package/recipe/setup-hooks::python-prepare-wheel-metadata-function
