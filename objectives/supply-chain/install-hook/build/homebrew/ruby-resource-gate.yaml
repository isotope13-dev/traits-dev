defaults:
  for: [ruby]
  platforms: [macos]
traits:
  - id: ruby-cache-marker-gated-shell-install
    desc: Hidden home-cache marker gates shell install
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        (if condition: (call receiver: (constant) @file method: (identifier) @exists
          arguments: (argument_list (call receiver: (constant) @file2 method: (identifier) @expand
            arguments: (argument_list (string (string_content) @path)))))
          consequence: (then (call method: (identifier) @system
            arguments: (argument_list (string (string_content) @command))))
          (#eq? @file "File") (#eq? @exists "exist?")
          (#eq? @file2 "File") (#eq? @expand "expand_path")
          (#match? @path "^~/Library/Caches/.*/[.]" )
          (#eq? @system "system") (#match? @command "^sh [^ ]+[.]sh$"))
composite_rules:
  - id: ruby-resource-marker-gated-install
    desc: Resource installer gated by hidden cache file
    crit: suspicious
    conf: 0.98
    all:
      - id: ruby-cache-marker-gated-shell-install
      - id: metadata/package/manager::homebrew-formula-class
