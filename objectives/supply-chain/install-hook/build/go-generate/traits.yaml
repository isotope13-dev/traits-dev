# go generate is explicit, not a go build/install hook. Arguments are Go-quoted,
# not implicitly interpreted by a shell. Facts below require an invoked shell.
# ATT&CK: T1195.002 (Supply Chain Compromise)
defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [go]
  attack: T1195.002
  mbc: B0024
traits:
  - id: go-generate-curl-pipe-shell
    desc: Go generator pipes download into shell
    conf: 0.95
    if:
      type: value
      path: source.go.generate[*].shell_body
      regex: '\b(curl|wget)\b[^\n]{0,512}\|\s*(ba|da|z)?sh\b'
  - id: go-generate-decode-pipe-shell
    desc: Go generator pipes decoded content into shell
    conf: 0.93
    if:
      type: value
      path: source.go.generate[*].shell_body
      regex: '\b(base64|xxd|openssl)\b[^\n]{0,512}\|\s*(ba|da|z)?sh\b'

composite_rules:
  - id: go-generate-remote-shell-loader
    desc: Go generate downloads and runs a shell payload
    crit: hostile
    conf: 0.99
    for: [go, archives]
    scope: archive
    all:
      - id: go-generate-curl-pipe-shell
      - id: micro-behaviors/process/lifecycle/auto-exec::go-explicit-generator
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
