# A NuGet package that runs its own code on every build of the project that
# consumes it, with the consuming project handed over as a parameter.
#
# `Systemm.Drawing.Common` -- one letter from `System.Drawing.Common` -- ships
# build/*.targets that register three tasks out of a DLL in the package and
# hook `BeforeTargets="Build"`. One of them is passed
# `ProjectDir="$(MSBuildProjectDirectory)"` and, per the author's own comment,
# removes the PackageReference and the traces in obj/ on the first ordinary
# build. After that the project file no longer mentions the package, and the
# build still runs its code, because the .targets are already restored.
#
# Analyzers and source generators legitimately ship task assemblies. What none
# of them need is the consuming project's own directory: that parameter is for
# writing into the project, not for compiling it.
defaults:
  platforms: [windows, unix]
  for: [nupkg, xml, archives]
  attack: T1195.002,T1547
  mbc: F0012

composite_rules:
  - id: nuget-build-task-rewrites-consuming-project
    desc: Package task edits the project that restores it
    crit: hostile
    conf: 0.93
    scope: archive
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: metadata/build/manifest::msbuild-targets-file
      - id: micro-behaviors/time/schedule/callback/lifecycle::msbuild-package-supplied-task-assembly
      - id: micro-behaviors/time/schedule/callback/lifecycle::msbuild-task-given-project-directory

  - id: nuget-build-hook-package-task
    desc: Package runs its own task before every build
    crit: suspicious
    conf: 0.9
    # No archive scope: a hostile NuGet package declares its task and its
    # BeforeCompile hook in the ONE .targets file it ships. Pooled across an
    # archive the three legs only have to co-exist somewhere, which is true of
    # any repo that ships MSBuild integration -- dotnet-roslyn is itself a
    # package-supplied task assembly that hooks BeforeCompile, across separate
    # eng/targets/Imports.targets and Microsoft.Managed.Core.targets files.
    all:
      - id: metadata/build/manifest::msbuild-targets-file
      - id: micro-behaviors/time/schedule/callback/lifecycle::msbuild-package-supplied-task-assembly
      - id: micro-behaviors/time/schedule/callback/lifecycle::msbuild-before-compile-target
    unless:
      - id: metadata/build/manifest::nuget-stock-restore-targets
    # The C# compiler's own MSBuild integration is the legitimate form of
    # exactly this shape.
      - id: well-known/tool/development/toolchain/roslyn/