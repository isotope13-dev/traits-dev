# A NuGet package that runs its own code on every build of the project that
# consumes it, with the consuming project handed over as a parameter.
#
# `Systemm.Drawing.Common` -- one letter from `System.Drawing.Common` -- ships
# build/*.targets that register three tasks out of a DLL in the package and
# hook `BeforeTargets="Build"`. One of them is passed
# `ProjectDir="$(MSBuildProjectDirectory)"` and, per the author's own comment,
# removes the PackageReference and the traces in obj/ on the first ordinary
# build. After that the project file no longer mentions the package, and the
# build still runs its code, because the .targets are already restored.
#
# Analyzers and generators legitimately receive the consuming project root.
# Require implemented package-reference removal and restore-trace cleanup in
# the packaged code as well as automatic build task registration.
defaults:
  platforms: [windows, unix]
  for: [nupkg, xml, pe, dll]
  attack: T1195.002,T1547
  mbc: F0012

composite_rules:
  - id: nuget-build-task-rewrites-consuming-project
    desc: NuGet build hook removes dependency traces
    crit: hostile
    conf: 0.93
    scope: archive
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: metadata/build/manifest::msbuild-targets-file
      - id: metadata/build/manifest::msbuild-property-task-assembly
      - id: metadata/build/manifest::msbuild-task-given-project-directory
      - id: metadata/build/manifest::msbuild-before-compile-target
      - id: objectives/evasion/indicator-removal/structure::dotnet-restore-record-cleanup
