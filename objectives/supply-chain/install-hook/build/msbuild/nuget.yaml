defaults:
  platforms: [windows, unix]
  for: [xml]
composite_rules:
  - id: nuget-msbuild-precompile-oob-beacon
    for: [xml, nupkg]
    desc: NuGet package runs an OOB network beacon before compilation
    crit: hostile
    conf: 0.99
    attack: T1195.002
    scope: archive
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: metadata/build/manifest::msbuild-targets-file
      - id: micro-behaviors/time/schedule/callback/lifecycle::msbuild-before-compile-target
      - id: micro-behaviors/communications/http/download/package::msbuild-downloadfile-task
      - id: objectives/exfiltration/oob/endpoint::webhook-site

  - id: nuget-targets-restore-data-exfil
    desc: NuGet targets exfils restore data via curl
    crit: hostile
    conf: 0.99
    # One MSBuild project file: the .targets that runs on restore is also the
    # thing that curls the data out. `archives` leaves the `for:` list with
    # the archive scope, or the container node rolls its members' traits back
    # up and pools them again -- TeXLive's build tarball scored hostile with
    # the three legs coming from three unrelated places.
    for: [nupkg, xml]
    scope: package
    attack: T1195.002,T1041
    all:
      - id: metadata/build/manifest::msbuild-project-root
      - id: micro-behaviors/communications/http/download/curl::curl-silent-fail-flags-embedded-text
      - id: micro-behaviors/data/encode/charset::dotnet-utf8-getbytes
