defaults:
  platforms: [windows, unix]
  for: [nupkg, xml]
  attack: T1195.002
composite_rules:
  # A generic behavioral lead survives package, task, variable, and endpoint
  # renaming. This is a co-occurrence inference, not a proven value-flow join.
  - id: msbuild-precompile-host-query-download
    desc: Build hook includes hostname and download query
    crit: suspicious
    conf: 0.93
    for: [xml]
    scope: file
    near_bytes: 2048
    all:
      - id: metadata/build/manifest::msbuild-before-compile-target
      - id: micro-behaviors/communications/http/download/package::msbuild-downloadfile-task
      - id: micro-behaviors/os/sysinfo/hostname/query::dotnet-machine-name-read
      - id: micro-behaviors/communications/url/query/profile::msbuild-query-property
  # The disclosure establishes the PoC's purpose, not operator consent.
  # Require its executable build callback too; a nuspec claim alone is inert.
  - id: nuget-dependency-confusion-host-beacon
    desc: Dependency-confusion hook reports build host
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/description/disclosure::nuspec-desc-dependency-confusion
      - id: micro-behaviors/communications/http/download/handler::nuget-msbuild-precompile-webhook-download
      - id: msbuild-precompile-host-query-download
