# An install hook that arms both OS schedulers and a mutable global package
# update turns a one-shot npm install into a standing code-replacement surface.
defaults:
  crit: hostile
  platforms: [unix]
  for: [npm, tar, tgz, package.json, shell, javascript]
  attack: T1195.002,T1053.003,T1543.004

composite_rules:
  # Archive scope on purpose: the hook declaration lives in package.json while
  # the scheduler arming lives in the install script it spawns. All three
  # systems plus a mutable global reinstall must be present. Cross-platform
  # scheduler setup alone is common in legitimate agents and is not enough.
  - id: npm-install-hook-schedules-mutable-global-update
    desc: npm install hook schedules mutable global package replacement
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/os/autorun/cron::crontab-file-install
      - id: micro-behaviors/os/service/start::launchctl-load-command-text
      - id: micro-behaviors/process/create/shell/build::global-latest-package-install
    unless:
      - id: well-known/app/ai/coding-agent/claude-multiacc::archive-context
  # Bearer-less sibling of the agent/ plant rule
  # (objectives/supply-chain/install-hook/agent::npm-postinstall-plants-global-prompt-telemetry):
  # the shipped credential is rotation-prone evidence — a release that moves
  # the token out of the bundle (env-provisioned, fetched at install, or a
  # non-hex scheme the bearer atom misses) keeps the hostile behavior, which
  # is the silent machine-wide prompt-collection plant itself. This variant
  # convicts on the install-time global write plus full-conversation content
  # export alone, so token rotation or re-auth cannot clear the verdict.
  # Precision stays high: postinstall auto-run plus a GLOBAL agent-settings
  # write plus all three content-logging flags plus a remote collector has
  # no legitimate quiet-install use; explicitly-invoked setup carries no
  # hook leg and cannot match. Bundle-carried identity text (package names,
  # bootstrap comments, repository URLs, collector hostnames) never exempts
  # this conjunction: it is publish-credential-controlled, so a repacked
  # release keeps it.
  - id: npm-postinstall-persists-agent-content-collection
    desc: npm postinstall persists agent content-collection config
    conf: 0.96
    platforms: [unix, windows]
    for: [npm, tar, package.json, javascript]
    attack: T1195.002
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/agent::npm-postinstall-writes-claude-global-settings
      - id: micro-behaviors/os/telemetry/logging/llm::full-conversation-telemetry-export
