# An install hook that arms both OS schedulers and a mutable global package
# update turns a one-shot npm install into a standing code-replacement surface.
defaults:
  crit: hostile
  platforms: [unix]
  for: [npm, tar, tgz, package.json, shell, javascript]
  attack: T1195.002,T1053.003,T1543.004

composite_rules:
  # Archive scope on purpose: the hook declaration lives in package.json while
  # the scheduler arming lives in the install script it spawns. All three
  # systems plus a mutable global reinstall must be present. Cross-platform
  # scheduler setup alone is common in legitimate agents and is not enough.
  - id: npm-install-hook-schedules-mutable-global-update
    desc: npm install hook schedules mutable global package replacement
    conf: 0.99
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/declaration::postinstall-hook-declaration
      - id: micro-behaviors/os/autorun/cron::crontab-file-install
      - id: micro-behaviors/os/service/start::launchctl-load-command-text
      - id: micro-behaviors/process/create/shell/build::global-latest-package-install
