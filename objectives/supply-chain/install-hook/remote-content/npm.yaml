# An install hook that downloads content and saves it.
#
# `npm install` runs these scripts unattended on every machine that pulls the
# package in, including CI. A hook that fetches at install time therefore hands
# whoever controls the URL a write primitive on every consumer, forever: the
# bytes the maintainer reviewed at publish time are not the bytes a user gets
# next week, and no lockfile or integrity hash covers them. It stays true even
# when the fetch is honest — generating a data file from upstream lists at
# install time is exactly this shape, and exactly this exposure.
#
# Suspicious rather than hostile: the pattern is a standing supply-chain
# exposure, not proof of intent. The hostile variants — remote YAML that
# becomes package config, a fetched native binary, an obfuscated loader — are
# separate composites in the sibling directories, and they add the intent leg
# this one deliberately leaves out.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, archives]
  attack: "T1195.002,T1105"

composite_rules:
  - id: script-fetches-and-writes-remote-content
    desc: Script saves fetched remote content to disk
    crit: notable
    conf: 0.94
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/response-body
    any:
      - id: micro-behaviors/fs/file/write/async
      - id: micro-behaviors/fs/file/write/direct

  - id: npm-install-hook-persists-remote-content
    desc: npm install hook saves fetched remote data
    crit: suspicious
    conf: 0.95
    scope: archive
    all:
      - id: script-fetches-and-writes-remote-content
    any:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle

  # Worse than a versioned release URL: a raw code-host path resolves against a
  # branch tip, so its content changes whenever anyone with push rights to a
  # third-party repository decides it should. The install hook then persists
  # whatever that branch says today.
  - id: npm-install-hook-fetches-branch-tip-content
    desc: Install hook fetches branch-tip remote content
    crit: suspicious
    conf: 0.96
    scope: archive
    all:
      - id: npm-install-hook-persists-remote-content
      - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-web-file
