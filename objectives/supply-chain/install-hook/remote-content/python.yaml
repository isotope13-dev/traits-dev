# A top-level setup.py runs while package metadata is prepared or the package
# is built. Letting an environment-controlled remote query rewrite a shipped
# Python module makes the installed package's behavior depend on mutable,
# unreviewed server output rather than the published artifact.
defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: setup-environment-query-injects-remote-module-data
    desc: Setup injects remote query result into package module
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1105
    scope: file
    near_lines: 25
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/os/env/read::python-os-getenv-call
      - id: micro-behaviors/communications/http/request/client::requests-post-json-payload
      - id: micro-behaviors/fs/write/file/full::python-pathlib-write-repr-assignment
