defaults:
  crit: hostile
  platforms:
  - windows
  - unix
  for:
  - python
  attack: T1195.002
  mbc: B0024
composite_rules:
- id: pypi-setup-callback-beacon
  desc: PyPI setup callback beacon exfiltration
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/url/external-ip::python-http-ip-port-url
  - id: micro-behaviors/communications/http/ip-discovery::ipify-api
  - id: metadata/package/files/wheel-sdist::from-setuptools-import
  any:
  - id: objectives/command-and-control/channel/deaddrop/url::py-urllib-chain
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen
  - id: metadata/package/versioning/sentinel::pypi-version-placeholder
- id: python-module-backdoor
  desc: Cross-platform Python module backdoor
  conf: 0.95
  all:
  - id: micro-behaviors/os/sysinfo/platform/runtime::python-osname-nt-check
  - id: micro-behaviors/communications/http/url/external-ip::python-http-ip-port-url
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  any:
  - id: micro-behaviors/process/create/subprocess::sys-executable-popen
  - id: micro-behaviors/process/create/subprocess::popen-content
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: setup-py-unhexlify-python-c
  desc: Install hook Popen python -c after unhexlify
  conf: 0.96
  all:
  - id: metadata/build/package/recipe/setup-hooks::cmdclass-install-phase-override
  - id: micro-behaviors/data/decode/hex::python-unhexlify-text
  - id: micro-behaviors/process/create/subprocess::sys-executable-popen
- id: setup-py-unhexlify-detached-popen
  desc: Install hook detaches an unhexlify python -c payload
  conf: 0.95
  all:
  - id: metadata/build/package/recipe/setup-hooks::cmdclass-install-phase-override
  - id: micro-behaviors/data/decode/hex::python-unhexlify-text
  - id: "micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-stdio-assignment"
- id: setup-py-detached-python-c
  desc: Install hook detaches python -c via Popen
  conf: 0.95
  all:
  - id: metadata/build/package/recipe/setup-hooks::cmdclass-install-phase-override
  - id: micro-behaviors/process/create/eval::sys-executable-c-popen
  - id: "micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-stdio-assignment"
# The detached payload need not be a python -c stage: an install hook that
# spawns any command detached with every stdio stream discarded exists only
# to outlive and hide from the installer. Legitimate hooks run their build
# steps synchronously and keep the output.
- id: setup-py-detached-devnull-popen
  desc: Install hook detaches silenced process via Popen
  conf: 0.96
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
  - id: micro-behaviors/process/create/flags::python-detached-process-use
  - id: "micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-stdio-assignment"
  any:
  - id: micro-behaviors/process/create/subprocess::popen-ast
  - id: micro-behaviors/process/create/subprocess::python-subprocess-string-command
  - id: micro-behaviors/process/create/subprocess::setup-py-subprocess
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
