defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - python
  - shell
traits:
- id: env-path-hijack-hidden
  desc: NODE_PATH/PYTHONPATH set to relative hidden dir
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(NODE_PATH|PYTHONPATH)\s*=\s*["']?(\.{1,2}[\\/])?\.[\w-]{1,30}
  not:
  - regex: (?i)["'=/]\s*\.(build|claude(-plugin)?|openclaw|hermes|codex|omx|gemini|melaya|reference|venv|virtualenv|tox|nox|local|config|cache|github|gitlab|circleci|vscode|idea|husky|yarn|pnpm|devcontainer|bin|acp|pysite)\b
  - regex: (?i)[\\/]\.libs\b
  - regex: (?i)\bNODE_PATH\s*=\s*["']?[^"'\n]*node_modules
  - regex: (?i)\b(NODE_PATH|PYTHONPATH)\s*=\s*["']?(\.{1,2}[\\/])?\.ci(-[\w]{1,24})?\b
  unless:
  - id: objectives/command-and-control/backdoor/tasking/command-http::privilege-dropping-command-service
  - type: basename
    exact: default.cache.py
- id: require-from-hidden-path
  desc: Requires a hidden module path
  crit: notable
  conf: 0.85
  for:
  - javascript
  if:
    type: symbol
    kind: call
    exact: require
    arg:
      kind: string
      regex: ^(\.\.?/|/)\.[\w-]{1,20}/
  unless:
  - id: metadata/package/files/dependency::ceraph-package-path
- id: import-from-hidden-path
  desc: Imports a hidden module path
  crit: notable
  conf: 0.85
  for:
  - javascript
  - python
  if:
    type: symbol
    kind: import
    regex: ^(\.\.?/|/)\.[\w-]{1,20}/
  not:
  - regex: (^|/)\.(claude(-plugin)?|openclaw|hermes|codex|gemini|github|gitlab|circleci|vscode|idea|config|husky|yarn|pnpm|changeset|well-known|storybook|next|nuxt|svelte-kit|react-router|devcontainer|bin|ceraph)/
  - regex: (^|/)\.(generated|output|setup|cache|turbo|vite|astro|parcel-cache|angular|metadata)/
composite_rules:
- id: sys-path-hijack-hidden
  desc: sys.path mutated with hidden-directory literal
  crit: suspicious
  conf: 0.93
  for:
  - python
  all:
  - id: micro-behaviors/os/module/search-path::sys-path-mutate
  - id: micro-behaviors/os/module/search-path::sys-path-hidden-dir-entry
  unless:
  - id: well-known/app/system/cowork-flow::cowork-flow-hook-context
  - id: metadata/package/testing/presence/harness::test-directory
  - id: metadata/package/documentation/source::documentation-dir-path
  - id: well-known/app/data/gsas-ii::gsas-ii-local-plugin-context
- id: node-module-paths-hijack-hidden
  desc: module.paths mutated with hidden-directory literal
  crit: suspicious
  conf: 0.93
  for:
  - javascript
  near_lines: 1
  all:
  - id: micro-behaviors/os/module/search-path::node-module-paths-mutate
  - id: micro-behaviors/fs/path/location::hidden-dir-literal
  unless:
  - id: metadata/build/bundler/runtime::js-webpack-bundle
  - id: metadata/build/minifier::js-webpack-bundle-minified
  - id: metadata/build/minifier::js-webpack-minified-module-call
- id: module-resolution-hijack
  desc: Module resolution hijack
  crit: suspicious
  conf: 0.95
  any:
  - id: sys-path-hijack-hidden
  - id: node-module-paths-hijack-hidden
  - id: env-path-hijack-hidden
  downgrade:
    any:
    - id: metadata/build/bundler/asset::js-large-module-bundle
    - id: micro-behaviors/process/interpreter/vm/
  unless:
  - id: well-known/lib/platform/psutil
  - id: well-known/app/system/cowork-flow::cowork-flow-hook-context
  - id: metadata/package/testing/presence/harness::test-directory
  - id: metadata/package/files/dependency::postman-sandbox-package-path
  - id: metadata/package/files/dependency::ceraph-package-path
  - id: well-known/app/data/gsas-ii::gsas-ii-local-plugin-context
