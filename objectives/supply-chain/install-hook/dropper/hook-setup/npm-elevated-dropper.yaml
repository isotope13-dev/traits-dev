# npm install hooks paired with silent elevation evidence.
# Archive scope pools the manifest and sibling script observations.
defaults:
  crit: hostile
  platforms: [windows, linux]
  for: [npm, tar]
  attack: T1195.002
composite_rules:
  - id: npm-preinstall-host-profile-query-exfil
    desc: npm hook profiles host and exfiltrates via HTTP
    conf: 0.995
    attack: T1195.002,T1041,T1016,T1082
    scope: archive
    for: [npm, tar, package.json, javascript]
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: objectives/supply-chain/install-hook/scripts/local-script::preinstall-runs-node-local-script
      - id: metadata/import/builtin::child-process-api-destructure
      - id: objectives/supply-chain/recon-exfil/install-hook/recon::js-host-profile-command-sequence
      - id: objectives/supply-chain/recon-exfil/install-hook/recon::js-http-query-exfil

  # The install hook re-launches with admin rights (RunAs) — silently when
  # paired with a hidden window / windowsHide.
  - id: npm-preinstall-silent-elevation
    desc: npm preinstall hook elevates to admin via PowerShell RunAs
    conf: 0.96
    mbc: F0015
    scope: archive
    for: [source, data, binaries, '!dex', '!elf', applescript, asar, cargo.lock, cargo-toml, chrome-manifest, composer-json, composer.lock, deb, dockerfile, gemfile.lock, github-actions, go.mod, go.sum, gyp, javascript, lua, npm, nupkg, package.json, package-lock.json, perl, php, pipfile.lock, pkginfo, plist, pnpm-lock.yaml, poetry.lock, pyproject-toml, python, registry, requirements.txt, ruby, shell, src_info, tar, vsixmanifest, xml, yarn.lock]
    all:
      - id: objectives/supply-chain/install-hook/scripts/local-script::preinstall-runs-node-local-script
      - id: micro-behaviors/os/privilege/elevation::runas-verb
    any:
      - id: micro-behaviors/process/create/spawn::windowshide-option
      - id: micro-behaviors/process/create/shell/lang::powershell-keyword
      - id: micro-behaviors/process/create/start-process::start-process-filepath
    unless:
      - id: well-known/tool/development/vcs/github-desktop/
      - id: well-known/app/ai/coding-agent/omnius/
      - id: well-known/lib/runtime/scripted/electron::electron-app-bundle-exception
      - id: well-known/tool/development/game-engine/unity-hub::official-package-context
  # The install hook hands off to an obfuscator.io-obfuscated sibling payload.
