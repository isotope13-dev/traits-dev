# Install-hook setup droppers in the easy-day-js / @mastra playbook: a setup
# script that disables TLS verification, fetches a second stage, persists it
# as a detached child that outlives the install, loots environment
# credentials, and deletes itself. Each behavior alone is common; the
# file-local combination is the dropper.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1105

composite_rules:
  - id: setup-tls-bypass-detached-selfdelete
    desc: Setup dropper bypasses TLS, persists, self-deletes
    crit: hostile
    conf: 0.98
    scope: leaf
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/socket/ssl::node-tls-verification-env-disable
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: objectives/evasion/self-delete/file/script::unlink-filename
    any:
      - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
      - id: micro-behaviors/os/env/secret-name::node-env-secret-filter

  - id: setup-loots-env-posts-bypassed-tls
    desc: Setup posts harvested secrets over bypassed TLS
    crit: hostile
    conf: 0.97
    scope: leaf
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/env/secret-name::node-env-secret-filter
      - id: micro-behaviors/communications/socket/ssl::node-tls-verification-env-disable
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/body::request-write-call

  # The dropper's opening move before persistence and self-deletion land: TLS
  # verification off, a credential-bearing environment read, and an outbound
  # HTTPS request in the same script. Suspicious rather than hostile because
  # corporate-proxy workarounds sometimes disable TLS in dev tooling; the
  # credential read is what makes the combination worth review.
  - id: setup-tls-bypassed-credential-beacon
    desc: Setup beacons credentials over bypassed TLS
    crit: suspicious
    conf: 0.93
    scope: leaf
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/socket/ssl::node-tls-verification-env-disable
      - id: micro-behaviors/os/env/secret-name::credential-env-read
    any:
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/communications/http/request/client::https-request
