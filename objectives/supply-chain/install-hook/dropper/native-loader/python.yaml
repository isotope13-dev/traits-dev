# Import-time execution of a bundled native executable.
# Shipping a binary alongside a setup hook is neutral package metadata;
# execution here must be tied to the executable itself.
defaults:
  platforms: [unix, windows]
  for: [python, python_sdist, tar, zip, whl]
  attack: T1195.002
  mbc: E1105

composite_rules:
  - id: setup-hook-chmods-and-runs-binary
    desc: setup.py hook chmods and runs a binary
    crit: hostile
    conf: 0.94
    for: [python]
    scope: file
    attack: "T1195.002,T1204.002"
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/fs/chmod/modify::python-chmod-call-with-exec-bit
      - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass
      - id: metadata/build/package/recipe/setup-hooks::python-build-or-install-command-override
      - id: micro-behaviors/process/create/subprocess::process-execution
    unless:
      - id: metadata/package/files/included::nested-cli-setup-py
