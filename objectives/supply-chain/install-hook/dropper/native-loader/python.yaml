# A Python distribution that ships a native executable and runs code at install
# time. Sibling to npm.yaml, which describes the same arrangement in a
# lifecycle script.
#
# Packaging a compiled binary is normal; the wheel format exists for it, and a
# wheel carries platform tags so pip only fetches the one matching the host.
# What is not normal is a source distribution that carries a bare `.exe`
# alongside a `cmdclass` install class -- that combination bypasses the
# mechanism built for shipping binaries, and puts an executable on the machine
# next to code that runs without being asked.
#
# Suspicious rather than hostile, and deliberately: the pair describes the
# delivery, not the payload. A prank package that runs a bundled game at
# install time and a dropper that runs a bundled implant are the same shape
# from here, and the difference lives in the binary. Rules that read the
# binary's own behaviour are what convict; this says an install will execute
# something the analyst has not looked at yet.
#
# Worked example: a PyPI package shipping `doom-ascii_win64.exe` and a WAD,
# whose `DoomInstall(install).run()` inserts the package directory on
# `sys.path` and calls a local helper before deferring to `super().run()`.
defaults:
  platforms: [unix, windows]
  for: [python, python_sdist, tar, zip, whl]
  attack: T1195.002
  mbc: E1105

composite_rules:
  - id: python-install-hook-ships-native-executable
    desc: Install hook ships a native executable
    crit: suspicious
    conf: 0.93
    scope: archive
    all:
      - id: metadata/build/package/recipe/setup-hooks::python-install-hook
      - id: metadata/build/archive::archive-windows-executable-entry
    unless:
      - id: well-known/lib/development/distlib::distlib-launcher-executable

  # A bundled native executable run at import, without a cmdclass hook.
  #
  # The rule above needs a `cmdclass` install class; this covers the package
  # that skips it and launches the binary from module scope instead --
  # `exec("subprocess.run(os.path.abspath('s.exe'))" if sys.platform=='win32'
  # else "pass")` runs the moment `setup.py` is imported, which pip does to
  # read the metadata, so the exe fires before install even completes. Shipping
  # a `.exe` in a source distribution and running it on import is not a build
  # step; a real extension is compiled from source, not carried prebuilt and
  # executed sight unseen.
  #
  # Hostile rather than suspicious: unlike the cmdclass case, which merely
  # *stages* a binary, this one runs it -- an `exec` string plus a module-scope
  # call plus the executable member is fetch-free execution of an unreviewed
  # binary.
  #
  # Worked example: a `crytic-compile` typosquat shipping `s.exe` and running
  # it via `exec(...subprocess.run('s.exe')...)` at the top of `setup.py`.
  #
  # The exec leg is `python-module-scope-exec-targets-exe`, not the bare
  # module-scope-exec atom: under archive scope a bare leg pooled a .exe
  # member with an unrelated module-scope `exec` in a different member and
  # convicted whole wheels that merely vendor a debugger's test fixtures next
  # to signed attach utilities (debugpy), or ship service exes beside an exec
  # in a GUI timer method (pywin32). Requiring the exec-side file to itself
  # name an .exe restores the connection the worked example has: the payload
  # that launches the bundled binary is the file that names it.
  - id: python-import-time-runs-bundled-executable
    desc: Bundled native executable run at import
    crit: hostile
    conf: 0.95
    scope: archive
    for: [python, package.json, tar, zip, whl]
    attack: "T1195.002,T1204.002"
    # The import-time leg has to be the `exec` itself. Pairing a bare
    # `exec-builtin` anywhere with a module-level call anywhere meant that,
    # under archive scope, any wheel shipping a .exe and containing an `exec`
    # in some unrelated module matched: pywin32 ships pythonservice.exe and
    # Pythonwin.exe and has `exec(self.dlg.doWork)` inside a Demos timer
    # method, which is neither at import time nor related to the executables.
    all:
      - id: metadata/build/archive::archive-windows-executable-entry
      - id: python-module-scope-exec-targets-exe
    unless:
      - id: well-known/tool/packaging/pymolcas::openmolcas-bundler-context
      # The stdlib ensurepip bootstrap wheels (pip/setuptools) vendor distlib
      # launcher executables (t32/t64/w32/w64) as packaging resources. Any
      # application embedding a Python runtime (e.g. a macOS app bundle's
      # packed_env) carries them, so their .exe members must not convict the
      # whole bundle -- the same carve-out as the sibling
      # wheel-native-launcher rule.
      - id: metadata/package/files/dependency::bundled-python-bootstrap-wheel-path
      - id: well-known/lib/development/distlib::distlib-launcher-executable
      # The rule is about a Python *package* running a bundled executable at
      # import. Under archive scope any tarball large enough to hold a .exe
      # somewhere and a module-scope `exec` somewhere else qualifies, and a
      # browser source tree holds thousands of both: firefox-esr's orig
      # tarball matched on the container alone, with neither leg in a Python
      # package.
      - id: well-known/app/communication/thunderbird::firefox-source-tree-path

  # The launch shape the staging rule above deliberately stops short of: the
  # packaging hook makes a shipped file executable and then runs it. A chmod
  # in setup.py exists to give a packaged file the exec bit it did not arrive
  # with, and the process call that follows is what launches it -- fetch-free
  # execution of an unreviewed binary while pip builds and installs the
  # distribution. A real native extension is compiled by build_ext; a helper
  # script that must run goes through the interpreter and needs no mode
  # change. Hand-staging a file 0o755 and subprocess-ing it bypasses both.
  #
  # The chmod and the launch must sit together (near_lines), so a build
  # script that only hardens a shipped helper's permissions cannot pool
  # against an unrelated tool invocation elsewhere in the file. The launch
  # leg is ast-subprocess-in-setup, which already binds the subprocess call
  # to the packaging entrypoint (and carries the test-tree carve-outs of
  # that rule's unless list).
  #
  # Worked example: an "audio cleanup" sdist whose build_py run() chmods the
  # bundled, extension-less ELF `auclean/_auclean_native` to 0o755 and
  # subprocess.runs it with --init during the build.
  - id: python-setup-hook-chmod-launch-staged-file
    desc: Setup hook chmods a file executable and launches it
    crit: hostile
    conf: 0.96
    attack: "T1195.002,T1059"
    mbc: "E1105,E1059"
    near_lines: 15
    all:
      - id: objectives/supply-chain/install-hook/dropper/ast::ast-subprocess-in-setup
      - id: micro-behaviors/fs/chmod/modify::python-chmod-call-with-exec-bit
    unless:
      # Test-tree code exercises the packaging machinery but never runs at
      # install time.
      - id: metadata/package/testing/presence/harness::test-directory-path

  # File-scoped join for the import-time dropper above: the module-scope exec
  # and the executable-name reference must live in the SAME member, so an
  # unrelated fixture's exec cannot pool against a .exe shipped elsewhere in
  # the archive. Atomic legs live in their technique homes; this composite
  # only states that they co-occur in the file that would do the launching.
  - id: python-module-scope-exec-targets-exe
    desc: Module-scope exec in a file that names an .exe target
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/process/interpreter/python::module-scope-exec-builtin
      - id: micro-behaviors/fs/path/extension::exe-name-or-extension
