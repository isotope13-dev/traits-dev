defaults:
  platforms: [unix, windows]
  for: [archives]
  attack: T1195.002

traits:
  # A remote shell pipeline is installer intent only when it is the lifecycle
  # command itself. Keeping this as a value matcher prevents a runtime
  # bootstrap elsewhere in an application archive from being paired with an
  # unrelated postinstall declaration.
  - id: postinstall-direct-remote-shell-launch
    desc: Postinstall remote download shell pipeline
    crit: suspicious
    conf: 0.97
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '(?i)\b(curl|wget)\b[^\n;&|]{0,220}\|\s*(/bin/)?(ba)?sh\b'
    unless:
      - id: metadata/package/testing/presence/fixture::vulnerable-config-fixture-path
      - id: well-known/tool/detection/agent-audit-kit::scanner-context
  # An npm lifecycle hook whose command is a single bare relative/absolute path
  # with no interpreter and no script extension is directly executing a
  # committed extensionless file as a program. Legitimate hooks
  # invoke an interpreter (`node x.js`, `bash x.sh`), a tool (`husky`,
  # `node-gyp rebuild`, `prebuild-install`), or a `.bin` shim — none of which
  # match a bare `./src/hooks/deps`-style path. The positive match excludes
  # script extensions; `.bin` shims are suppressed separately.
  - id: preinstall-direct-extensionless-path
    desc: Preinstall executes extensionless path
    crit: suspicious
    conf: 0.85
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      # Put the script-extension exclusion in the positive matcher. `not:`
      # filters rendered evidence, so its end anchor did not see the command.
      regex: '^\s*\.{0,2}/([\w.-]+/)*[\w-]+\s*$'
    unless:
      - type: value
        path: scripts.preinstall
        substr: 'node_modules/.bin/'
  - id: install-direct-extensionless-path
    desc: Install executes extensionless path
    crit: suspicious
    conf: 0.85
    for: [package.json]
    if:
      type: value
      path: scripts.install
      regex: '^\s*\.{0,2}/([\w.-]+/)*[\w-]+\s*$'
    unless:
      - type: value
        path: scripts.install
        substr: 'node_modules/.bin/'
  - id: postinstall-direct-extensionless-path
    desc: Postinstall executes extensionless path
    crit: suspicious
    conf: 0.85
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '^\s*\.{0,2}/([\w.-]+/)*[\w-]+\s*$'
    unless:
      - type: value
        path: scripts.postinstall
        substr: 'node_modules/.bin/'

composite_rules:
  - id: postinstall-low-level-native-addon-loader
    desc: npm postinstall script loads a platform-specific native addon via process.dlopen
    crit: suspicious
    conf: 0.98
    for: [javascript]
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-js-file
      - id: micro-behaviors/process/interpreter/node::process-dlopen
      - id: micro-behaviors/fs/path/construct::platform-prebuild-node-addon-path

  - id: npm-postinstall-detonates-native-pth-implant
    desc: npm postinstall detonates a bundled native Python .pth implant
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1546.004
    scope: archive
    for: [npm, tar, archives]
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-hook-declaration
      - id: postinstall-low-level-native-addon-loader
      - id: objectives/supply-chain/hidden-payload/native-extension::node-addon-python-pth-implant

  - id: npm-archive-bundled-machine-code-member
    desc: npm tarball ships bundled machine-code member
    crit: notable
    conf: 0.94
    scope: archive
    for: [npm, tar, archives]
    any:
      - id: metadata/file/metrics::archive-contains-executable-member
      - id: metadata/binary/anomaly/section-header::elf-no-section-headers
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: metadata/file/extension/identity::pe-content-extension-mismatch

  - id: npm-install-hook-runs-extensionless-path
    desc: Install hook directly executes extensionless relative path
    crit: suspicious
    conf: 0.88
    scope: archive
    for: [npm, tar, archives]
    any:
      - id: preinstall-direct-extensionless-path
      - id: install-direct-extensionless-path
      - id: postinstall-direct-extensionless-path

  - id: npm-install-bundled-native-binary
    # The supply-chain dropper shape behind the AUR/ALVR `atomic-lockfile`
    # attack: a package whose install hook directly runs a relative path AND
    # ships a native ELF/Mach-O/PE binary. A JS library has no reason to execute
    # a committed machine-code binary at install time — this is a native payload
    # disguised as a build/dependency step. `metadata/binary/` fires only on real
    # compiled members, never on JS/JSON/manifests.
    desc: npm install hook executes a bundled native binary
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: npm-install-hook-runs-extensionless-path
      - id: npm-archive-bundled-machine-code-member

  - id: npm-install-hook-native-credential-stealer
    # A package that runs an install-time hook AND ships a native binary that
    # harvests credentials from many apps (browsers, Discord, Telegram, SSH,
    # shells) is a trojanized supply-chain stealer — the lifecycle hook
    # auto-detonates the bundled stealer on every `npm install`.
    desc: npm install hook detonates a bundled native credential stealer
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      # Prove that the package actually contains a compiled payload. Without
      # this leg, a plain JavaScript stealer was mis-described as native.
      - id: metadata/file/metrics::archive-contains-executable-member
      - id: metadata/package/scripts/lifecycle::install-hooks
    any:
      - id: objectives/credential-access/theft/multi-app::multi-app-credential-stealer
      - id: objectives/credential-access/discord/token::native-discord-token-grabber

  - id: npm-install-hook-native-rootkit
    # A package that runs an install-time hook AND ships an eBPF directory- or
    # connection-hiding rootkit installs a kernel-level implant the moment the
    # package is installed — there is no benign reason for a JS package to carry
    # a getdents/connection-hiding eBPF rootkit.
    desc: npm install hook deploys a bundled eBPF hiding rootkit
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1014
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
    any:
      - id: objectives/evasion/kernel-hide/ebpf::getdents-offset-rewrite-hide-rootkit
      - id: objectives/evasion/kernel-hide/ebpf::ebpf-connection-hide-rootkit

  - id: npm-install-hook-tor-c2-implant
    # A package that runs an install-time hook AND ships a binary that pulls down
    # the Tor Expert Bundle to anonymize its C2/exfil is an install-triggered
    # onion-routed implant.
    desc: npm install hook deploys a bundled Tor-anonymized implant
    crit: hostile
    conf: 0.97
    scope: archive
    attack: T1090.003
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
    any:
      - id: objectives/command-and-control/channel/tor/bundle::credential-stealer-tor-exfil
      - id: well-known/dual-use/tunnel/tor::expert-bundle-artifact

  - id: npm-postinstall-downloads-and-hides-native-payload
    desc: npm postinstall downloads and hides a native payload
    crit: hostile
    conf: 0.97
    scope: archive
    attack: "T1195.002,T1105,T1564.003"
    mbc: "B0024,F0011"
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-node-script-suppressed
      - id: objectives/command-and-control/dropper/execution/native-binary::node-fetch-writefile-chmod-execfile-stealth-dropper

  - id: npm-throwaway-native-loader-stub
    desc: Tiny throwaway npm native-loader install stub
    crit: hostile
    conf: 0.9
    scope: archive
    size_max: 16384
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
      - id: metadata/package/dependencies/manifest::platform-optional-native-wrapper
      - id: metadata/package/quality/version-sentinel::release-zero
    unless:
      - id: metadata/package/manifest/repository/
      - id: metadata/package/manifest/publishing::is-private
      - id: metadata/package/testing/presence/fixture/

  # Require the complete delivery chain, not merely a lifecycle hook and a
  # helper name: an install-time script contacts an external raw-IP endpoint
  # with certificate verification disabled, extracts the response as a tar
  # archive, and makes the extracted file executable. This is the reusable
  # risky delivery chain in insecure installers. It does not establish the
  # downloaded program's purpose, nor prove install-time execution.
  - id: npm-postinstall-insecure-tar-native-loader
    desc: npm postinstall installs an unverified native tar payload
    crit: suspicious
    conf: 0.99
    scope: archive
    attack: "T1105"
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/communications/socket/ssl::reject-unauthorized-false
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/data/archive/extract/tar::tar-extract
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755

  # Install-time shell pipelines that fetch remote content and immediately
  # launch it are a reusable supply-chain dropper shape. The direct value
  # matcher keeps the hook and the dangerous command in the same manifest.
  - id: npm-postinstall-download-launch-chain
    desc: npm postinstall downloads and shell-launches remote content
    crit: hostile
    conf: 0.98
    scope: file
    attack: "T1195.002,T1105,T1059"
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: postinstall-direct-remote-shell-launch

  # A package-side install hook can delegate the payload logic to a sibling
  # Node file. Require the manifest hook and the complete remote-stream,
  # executable-mode, background-launch chain in that same archive; a normal
  # package that merely has a postinstall or an HTTP client alone cannot match.
  - id: npm-postinstall-streams-chmods-background-payload
    desc: npm postinstall backgrounds downloaded executable payload
    crit: hostile
    conf: 0.99
    scope: archive
    attack: "T1195.002,T1105,T1059.007,T1222.002"
    mbc: "B0024,E1222"
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: objectives/command-and-control/dropper/delivery/download-execute::node-https-stream-chmod-background-launcher

  # A package can move the native stage into a helper file and use a
  # passworded ZIP rather than a transparent archive. Require the lifecycle
  # hook plus the complete remote-request, passworded-entry, executable-write,
  # PE-validation, and process-launch chain across the package archive.
  - id: npm-postinstall-passworded-remote-pe-dropper
    desc: npm postinstall stages and runs a passworded remote PE
    crit: hostile
    conf: 0.995
    scope: archive
    attack: "T1195.002,T1105,T1059.007,T1027,T1222.002"
    mbc: "B0024,F0011"
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: micro-behaviors/communications/http/request/dynamic::node-selected-transport-request
      - id: micro-behaviors/data/archive/library::admzip-passworded-entry-read
      - id: micro-behaviors/fs/file/write/async::node-fs-promises-write-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-fs-promises-write-executable-mode
      - id: micro-behaviors/data/format/executable/header::js-pe-mz-reject-check
      - id: micro-behaviors/process/create/spawn::spawn-call
    unless:
      - id: metadata/package/testing/harness/runtime/

  # 7z `-so` stdout extract of a passworded remote PE, rather than admzip.
  # The lifecycle declaration plus the complete download/extract/validate/launch
  # chain in postinstall.js is the same supply-chain dropper with a different
  # archive tool.
  - id: npm-postinstall-7z-stdout-remote-pe-dropper
    desc: Postinstall stages passworded 7z PE
    crit: hostile
    conf: 0.99
    scope: archive
    attack: "T1195.002,T1105,T1027,T1059.001"
    mbc: "B0024,F0011"
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: objectives/command-and-control/dropper/node-bootstrap::postinstall-passworded-pe-dropper
    unless:
      - id: metadata/package/testing/harness/runtime/
