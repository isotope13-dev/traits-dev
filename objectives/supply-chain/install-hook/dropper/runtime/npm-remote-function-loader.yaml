# A package lifecycle hook that reaches an HTTPS endpoint and compiles the
# response with access to CommonJS `require` is an install-time remote-code
# loader. The HTTP and dynamic-code observations remain neutral capabilities;
# this archive-level rule supplies the npm supply-chain intent.
defaults:
  platforms: [unix, windows]
  for: [npm]
  attack: T1195.002,T1105,T1059.007
  mbc: B0024,B0009.016

composite_rules:
  - id: npm-postinstall-remote-function-loader
    desc: npm postinstall contains HTTPS response Function loader
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: objectives/command-and-control/dropper/delivery/fetch-eval::function-require-streamed-data
