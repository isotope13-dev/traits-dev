# Install-time hidden launcher that feeds source into a detached Node child.
# A package hook that starts an unobserved, unreferenced interpreter and writes
# code to its stdin is a payload handoff, not ordinary package preparation.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, archives, javascript, typescript]
  attack: T1195.002,T1059.007
  mbc: B0024

composite_rules:
  # Same-file handoff: detached+ignored spawn of node with a stdin.write nearby.
  # Archive-wide OR of these atoms false-positives when tests write stdin and
  # unrelated helpers open a browser with detached:true + stdio:ignore.
  - id: detached-node-stdin-handoff
    desc: Detached Node child receives code on stdin
    crit: notable
    conf: 0.95
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/process/create/spawn::node-interpreter-target
      - id: micro-behaviors/process/fd/stdio::js-stdin-write

  - id: postinstall-detached-node-stdin-loader
    desc: Postinstall detaches Node and feeds it code on stdin
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-hook-declaration
      - id: detached-node-stdin-handoff
    unless:
      - id: well-known/app/development/vscodium::archive-context
      - id: well-known/tool/detection/agent-glovebox::archive-context

  - id: paste-payload-detached-node-stdin
    desc: Paste payload to detached Node stdin
    crit: hostile
    conf: 0.99
    attack: T1102.001,T1059.007,T1195.002
    scope: file
    for: [javascript, typescript]
    near_bytes: 2048
    all:
      - id: detached-node-stdin-handoff
      - id: micro-behaviors/communications/http/get::axios-get-call
      - id: micro-behaviors/data/decode/base64::atob-decode
    any:
      - id: objectives/command-and-control/infrastructure/paste::jsonkeeper-b64-endpoint
      - id: objectives/command-and-control/infrastructure/paste::jsonkeeper
