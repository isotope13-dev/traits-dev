# Postinstall hooks that run a javascript-obfuscator-packed Node script
# routing its traffic through an operator proxy list. Legitimate packages
# do use proxies and do ship minified code, but a string-array-rotating
# runtime plus explicit proxy rotation at install time is dropper transport.
#
# Worked example: sra-testing-test postinstall (node ./index.js), whose
# obfuscated loader resolves C2 domains, POSTs host and environment recon
# through an HttpsProxyAgent rotation, then spawns telemetry.js detached.
defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript, typescript]
  attack: T1195.002,T1090,T1041
  mbc: E1041
composite_rules:
  - id: postinstall-obfuscated-proxy-beacon
    desc: Postinstall runs obfuscated proxy-aware beacon
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: micro-behaviors/communications/proxy/library::https-proxy-agent-instantiation
      - id: micro-behaviors/communications/proxy/config::proxy-list-config-key
    unless:
      - id: metadata/package/testing/harness/runtime/
