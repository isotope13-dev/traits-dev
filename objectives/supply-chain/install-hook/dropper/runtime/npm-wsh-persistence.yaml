defaults:
  platforms: [windows]
  for: [javascript, typescript, package.json, npm, tar, zip]
  attack: T1195.002,T1105,T1547.001,T1547.009

composite_rules:
  - id: npm-postinstall-wsh-persistence-dropper
    desc: npm postinstall launches a persistent Windows downloader
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: objectives/command-and-control/dropper/file-exec/detached::node-windows-wsh-persistence-remote-dropper
