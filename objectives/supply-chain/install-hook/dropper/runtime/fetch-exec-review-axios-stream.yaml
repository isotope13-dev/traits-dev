defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1105,T1059.007,T1027
  mbc: B0024
  crit: hostile

composite_rules:
- id: npm-lifecycle-hex-stream-hidden-command
  desc: NPM lifecycle with hex URL and hidden command
  conf: 0.995
  attack: T1195.002,T1105,T1059.007
  scope: archive
  for:
  - npm
  - javascript
  - typescript
  - package.json
  all:
  - id: micro-behaviors/os/env/package-manager::npm-lifecycle
  - id: objectives/execution/payload/file-exec/command/hidden-file::hex-url-stream-hidden-command
- id: npm-postinstall-hex-stream-hidden-command
  desc: NPM postinstall with hex URL and hidden command
  conf: 0.995
  attack: T1195.002,T1105,T1059.007
  scope: archive
  for:
  - npm
  - package.json
  - javascript
  - typescript
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: objectives/execution/payload/file-exec/command/hidden-file::hex-url-stream-hidden-command
