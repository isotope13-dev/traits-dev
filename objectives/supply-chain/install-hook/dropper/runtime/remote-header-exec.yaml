# npm install hooks that fetch remote data and execute a shell command carried
# in HTTP response headers. The header-command atom and obfuscation legs stay
# neutral; this rule supplies the install-time loader interpretation.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, archives]
  attack: T1195.002,T1105,T1059.007,T1027
  mbc: B0024,B0032

composite_rules:
  - id: npm-postinstall-remote-header-shell-loader
    desc: npm postinstall executes remote HTTP response header as shell
    crit: hostile
    conf: 0.99
    scope: archive
    for: [archives, tar, tgz, npm]
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: micro-behaviors/process/create/shell/bridge::exec-sync-http-response-header-command
    any:
      - id: micro-behaviors/data/encode/char-code::js-modulo-fromcharcode-decoder
      - id: micro-behaviors/data/source/dynamic/load::node-dynamic-require-call
      - id: micro-behaviors/data/source/dynamic/load::node-computed-require-call
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::manifest-encoded-require
    unless:
      - id: metadata/package/testing/
