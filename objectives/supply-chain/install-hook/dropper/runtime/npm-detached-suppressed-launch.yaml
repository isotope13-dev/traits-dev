# Postinstall hooks that background a payload with Node warnings suppressed.
# Detaching is ordinary daemon mechanics and NODE_NO_WARNINGS is ordinary
# build hygiene; together at install time they keep a dropped stage alive
# and quiet past the installer output.
#
# Worked example: sra-testing-test postinstall, which spawns telemetry.js
# detached with NODE_NO_WARNINGS set and unrefs the child handle.
defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript, typescript]
  attack: T1195.002,T1059.007
  mbc: B0024
composite_rules:
  - id: postinstall-detached-suppressed-payload-launch
    desc: Postinstall launches detached payload with warnings suppressed
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: micro-behaviors/process/daemonize/detach::detached-obfuscated-true
      - id: micro-behaviors/os/env/write::node-no-warnings-env
    unless:
      - id: metadata/package/testing/harness/runtime/
