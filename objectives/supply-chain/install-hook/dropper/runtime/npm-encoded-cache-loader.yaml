# An encoded downloader that is executed by npm's lifecycle hook is an
# install-time supply-chain dropper.  The delivery composite is intentionally
# separate so the same loader shape remains useful outside npm archives.
defaults:
  conf: 0.99
  platforms: [unix, windows]
  for: [javascript, package.json, npm]
  attack: T1195.002,T1027,T1059.007,T1105
composite_rules:
  # Require the decoder, dynamic execution, variable load, and cleanup in one
  # script. Archive-wide co-occurrence is routine in bundled applications and
  # does not prove that the lifecycle target is an obfuscated loader.
  - id: npm-preinstall-hex-command-loader
    desc: npm preinstall executes hex-decoded command
    crit: hostile
    attack: "T1195.002,T1027.013,T1059.007"
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/local-script::preinstall-runs-node-local-script
      - id: micro-behaviors/data/decode/hex::buffer-from-hex-string
      - id: metadata/import/builtin::child-process-api-destructure
      - id: micro-behaviors/process/create/shell/bridge::js-exec
    near_bytes: 430

  - id: npm-postinstall-obfuscated-self-cleaning-loader
    desc: npm postinstall executes an obfuscated self-cleaning loader
    crit: hostile
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: objectives/command-and-control/dropper/module-load::node-obfuscated-self-cleaning-loader

  - id: npm-postinstall-base64-xor-gzip-commonjs-loader
    desc: npm postinstall runs base64 XOR gzip Function loader
    crit: hostile
    attack: T1195.002,T1027,T1059.007
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: micro-behaviors/data/decode/base64::buffer-from-base64
      - id: micro-behaviors/data/decompress/gzip::node-gunzip-function
      - id: micro-behaviors/data/decode/xor::js-rolling-key-byte-xor-loop
      - id: micro-behaviors/process/interpreter/eval/compile::js-function-constructor-commonjs-wrapper
      - id: micro-behaviors/process/create/spawn::detached-true

  - id: npm-postinstall-buffer-base64-xor-function-stager
    desc: npm postinstall runs buffer XOR Base64 Function stager
    crit: hostile
    attack: T1195.002,T1027,T1059.007
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: micro-behaviors/data/decode/base64::buffer-from-base64
      - id: micro-behaviors/data/decode/xor::js-repeating-key-buffer-xor-loop
    any:
      - id: micro-behaviors/process/interpreter/eval/compile::function-ctor-call-expr-arg
      - id: micro-behaviors/process/interpreter/eval/compile::js-function-call-commonjs-wrapper