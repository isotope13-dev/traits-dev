  - id: micro-behaviors/os/module/require::cjs-caught-local-require
  - id: objectives/anti-static/obfuscation/imports/concealment::node-charcode-decoded-require
- id: install-hook-swallowed-charcode-helper
  desc: Install hook ships an obfuscated swallowed local helper
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1027
  for: [javascript, typescript, package.json, npm]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::install-runs-node-local-script
  - id: micro-behaviors/os/module/require::cjs-caught-local-require
