# Obfuscated npm Install Hook Dropper
# Generic detection for supply chain attacks using npm postinstall hooks
# combined with obfuscated payloads — catches the attack class without IOCs.
# Inspired by: axios hijack (plain-crypto-js), netstruct, and similar attacks.
# ATT&CK: T1195.002 (Supply Chain Compromise)
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  attack: T1195.002
  mbc: B0024
traits:
# NOTE: the generic charCodeAt-XOR and fromCharCode-XOR decode atoms used to
# live here. Their matchers describe neutral string-decoding capabilities, not
# install-hook behavior, so they fired on unrelated loaders (e.g. a browser
# EtherHiding stager) under a supply-chain feature. The charCodeAt form
# duplicates micro-behaviors/data/encode/xor::js-charcode-xor-operation and is
# referenced canonically below; the fromCharCode form duplicates
# micro-behaviors/data/encode/char-code::fromcharcode-xor-rebuild and is
# referenced canonically too.
- id: modular-key-index
  desc: Modular arithmetic key index
  crit: suspicious
  conf: 0.8
  attack: T1027
  if:
    type: text
    regex: "\\[\\s*\\d+\\s*\\*\\s*\\w+\\s*\\*\\s*\\w+\\s*%\\s*\\d+\\s*\\]"
- id: base64-then-xor-chain
  desc: Base64 decode chained with XOR
  crit: notable
  conf: 0.9
  attack: T1027
  for:
  - package.json
  if:
    type: text
    regex: "(atob|Buffer\\.from).{0,80}charCodeAt.{0,40}\\^"
composite_rules:
- id: install-hook-charcode-concealed-module
  desc: Install hook loads concealed character-code module
  crit: hostile
  conf: 0.99
  for: [javascript, typescript, package.json, npm]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::install-hooks
  - id: micro-behaviors/process/create/load/local::cjs-caught-local-require
  - id: objectives/anti-static/obfuscation/imports::node-charcode-decoded-require
  - id: micro-behaviors/data/control-flow/error-handling::catch-before-await-or-require
- id: xor-string-decode-infra
  desc: XOR string decoding infrastructure in an install hook
  crit: notable
  conf: 0.9
  attack: T1027
  mbc: B0032
  # The hook declaration is a manifest fact and the XOR machinery is in a
  # JavaScript member, so the two never share a file. Inheriting this file's
  # `for: [javascript, typescript]` default with no `scope:` made the rule
  # unsatisfiable: at the manifest the XOR legs are absent, at the script the
  # hook leg is, and at the container the file type was rejected outright.
  scope: archive
  for: [javascript, typescript, package.json, npm]
  all:
  - id: micro-behaviors/data/encode/xor::js-charcode-xor-operation
  - id: micro-behaviors/data/encode/char-code::fromcharcode-xor-rebuild
  - id: micro-behaviors/crypto/symmetric/xor/loop::js-xor-loop
  - id: micro-behaviors/crypto/symmetric/xor/loop::js-xor-charcode-assignment
  - id: micro-behaviors/crypto/symmetric/xor/loop::js-byte-array-xor-modulo-key-loop
  unless:
- id: obfuscated-postinstall-dropper
  desc: Obfuscated npm postinstall dropper
  crit: hostile
  conf: 0.95
  # Same shape as its leg above: restricted to package.json while requiring a
  # rule whose evidence lives in a script member, so it could never match.
  scope: archive
  for: [javascript, typescript, package.json, npm]
  # Legs flattened rather than referencing `xor-string-decode-infra`. That rule
  # is itself archive-scoped, and a composite layered over an archive-scoped
  # composite does not resolve reliably -- the inner rule's finding is not
  # available to the outer pass, so this stayed dark even with every underlying
  # condition satisfied. Inlining the hook declaration and requiring two
  # distinct decoding techniques preserves the original meaning: an install hook
  # plus real string-decoding machinery, not a single incidental XOR.
  # `scope: archive` is an argument about ONE package: the hook is declared in
  # the manifest and the decoder lives in a sibling script. A shipped desktop
  # application bundles thousands of unrelated vendored packages under one
  # archive, so the pooling stops meaning anything -- VSCodium's DMG pairs the
  # editor's own build-script `postinstall` with `charCodeAt(x)^y` and base64
  # string tables from minified bundles hundreds of megabytes away.
  unless:
  - id: well-known/lib/runtime/scripted/electron::electron-app-resources-path
  # The manifest carrying the hook has to be publishable for "npm postinstall
  # dropper" to mean anything. A manifest marked private never reaches a
  # registry: Notion's `app.asar` holds the application's own development
  # manifest (`"private": true`, electron-forge scripts, a `postinstall` that
  # runs the repository's build script) beside the webpack bundles whose
  # `charCodeAt`/base64 helpers supplied the "obfuscation" legs.
  - id: metadata/package/publishing::is-private
  - id: metadata/package/files/system-package::container-rootfs-system-content
  all:
  - id: metadata/package/scripts/lifecycle::install-hooks
  needs: 2
  any:
  - id: micro-behaviors/data/encode/xor::js-charcode-xor-operation
  - id: micro-behaviors/data/encode/char-code::fromcharcode-xor-rebuild
  - id: micro-behaviors/crypto/symmetric/xor/loop::js-xor-loop
  - id: micro-behaviors/crypto/symmetric/xor/loop::js-xor-charcode-assignment
  - id: micro-behaviors/crypto/symmetric/xor/loop::js-byte-array-xor-modulo-key-loop
  - id: base64-then-xor-chain
  - id: modular-key-index
  - id: objectives/anti-static/obfuscation/string/encoding::js-strong-obfuscation
  - id: micro-behaviors/data/encode/xor::js-xor-dynamic-char-at
  - id: objectives/anti-static/obfuscation/string/reconstruct::js-xor-numeric-array-string-reconstruction
- id: arithmetic-decoder-fromcharcode-evidence
  desc: fromCharCode decoder evidence present
  crit: component
  any:
  - id: micro-behaviors/data/encode/char-code::fromcharcode-call
  - id: micro-behaviors/data/encode/char-code::fromcharcode-in-packed-obfuscated-source
- id: arithmetic-decoder-charcode-evidence
  desc: charCode arithmetic decoder evidence present
  crit: component
  any:
  - id: micro-behaviors/data/encode/charcode::charcodeat-arithmetic
  - id: micro-behaviors/data/decode/custom::js-modulo-alphabet-caesar-decoder
- id: arithmetic-encoded-dropper
  desc: Arithmetic-decoded payload executed via Function constructor
  # Sibling of obfuscated-postinstall-dropper for the arithmetic/Caesar decoder
  # family (rot-n via charCodeAt + fromCharCode), wired into a dynamic execution
  # sink. Triangle of `encoded array literal + custom decoder + Function/eval`
  # only exists to ship and execute a hidden payload.
  crit: hostile
  conf: 0.96
  attack: T1027
  mbc: B0032
  near_lines: 60
  all:
  - id: arithmetic-decoder-fromcharcode-evidence
  - id: arithmetic-decoder-charcode-evidence
  any:
  - id: micro-behaviors/process/interpreter/eval/compile::js-function-constructor
  - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-constructor
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/tool/detection/llm-scanner/
  - id: metadata/build/minifier::intentional-obfuscated-javascript-artifact-context
- id: self-cleaning-dropper
  desc: Self-cleaning obfuscated dropper
  crit: hostile
  conf: 0.95
  attack: T1070.004
  all:
  - id: xor-string-decode-infra
  any:
  - id: objectives/evasion/self-delete/file/script::node-self-delete
  - id: objectives/evasion/self-delete/file/script::manifest-swap
- id: npm-postinstall-obfuscated-self-cleaning-dropper
  desc: npm postinstall obfuscated self-cleaning dropper
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1027,T1070.004
  for: [package.json, npm, javascript]
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
  - id: micro-behaviors/crypto/symmetric/xor/loop::js-byte-array-xor-modulo-key-loop
  - id: objectives/evasion/self-delete/file/script::node-self-delete
  - id: objectives/evasion/self-delete/file/script::manifest-swap
- id: obfuscated-postinstall-cmd-exe
  desc: Obfuscated postinstall references cmd exe
  crit: suspicious
  conf: 0.93
  all:
  - id: metadata/package/files/included::postinstall-js-basename
  - id: micro-behaviors/process/create/shell/spawn::cmd-name
  - id: micro-behaviors/fs/path/extension::exe-name-or-extension
  any:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-variable-names
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-function-names
  - id: metadata/lang/javascript-features::js-obfuscator-while-loop
  needs: 2
- id: npm-hidden-exec-embed-dropper
  desc: Obfuscated npm postinstall cmd exe dropper
  crit: hostile
  conf: 0.98
  all:
  - id: obfuscated-postinstall-cmd-exe
  - id: micro-behaviors/communications/http/post::post
  any:
  - id: micro-behaviors/data/control-flow/error-handling::catch-before-await-or-require
  - id: micro-behaviors/os/module/require::node-system-module-import-set
- id: npm-obfuscated-hidden-shell-dropper
  desc: Obfuscated npm postinstall hidden shell dropper
  crit: hostile
  conf: 0.98
  all:
  - id: obfuscated-postinstall-cmd-exe
  - id: micro-behaviors/process/create/shell/bridge::js-execsync-destructure
  - id: micro-behaviors/process/create/spawn::shell-obfuscated-dynamic
  - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-true
  - id: micro-behaviors/communications/http/post::post
# Obfuscation markers must live in the preinstall script itself. Archive pooling
# used to let a benign hook plus an unrelated vendored bundle (Prisma Studio,
# dd-trace) satisfy the composite; conversely, when the preinstall target is
# the large one-line blob, `js-large-minified-bundle` in `unless:` suppressed
# the real dropper (nebula-sdk preinstall.cjs).
- id: preinstall-script-obfuscated-loader
  desc: Preinstall script has multiple concealment or loader markers
  crit: suspicious
  conf: 0.96
  attack: T1027
  scope: file
  all:
    - id: metadata/package/files/included::preinstall-js-basename
  any:
    - id: micro-behaviors/process/interpreter/eval/compile::js-function-constructor
    - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-constructor
    - id: metadata/file/function::constant-return-functions-dominate-file
    - id: objectives/anti-static/obfuscation/code-metrics/line-shape::js-near-zero-whitespace
    - id: micro-behaviors/process/create/shell/bridge::child-process-keyword-literal
    - id: objectives/anti-static/obfuscation/code-metrics/structure::single-long-line-outlier
  needs: 2
  unless:
    - id: objectives/supply-chain/install-hook/scripts/hook-file::npm-install-hook-gzip-payload-dropper
# Caesar/char-code decoder inside a Function constructor, wired to child_process
# in the same packed preinstall script. The decoder and execution sink are text-
# mode evidence because the megabyte one-liner exceeds the JS parser guard.
- id: preinstall-modular-caesar-function-dropper
  desc: Preinstall runs modular Caesar Function constructor loader
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1027,T1059.007
  mbc: B0024,B0032
  for: [javascript, typescript, package.json, npm]
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/scripts/local-script::preinstall-runs-node-local-script
  - id: micro-behaviors/process/interpreter/eval/compile::js-function-constructor
  - id: micro-behaviors/data/decode/custom::js-modulo-alphabet-caesar-decoder
  - id: micro-behaviors/process/create/shell/bridge::child-process-keyword-literal
  unless:
  - id: metadata/build/minifier::intentional-obfuscated-javascript-artifact-context
# obfuscator.io-packed install hook. A package whose install lifecycle runs a
# bundled script, and that script is obfuscator.io output (string-array
# rotation + decoder dispatch, hex/dollar name mangling). Unlike the eval- and
# XOR-decoder droppers above, this family hides ALL of its behavior — including
# the require()/spawn/child_process/URL strings — inside the base64 string
# table (`require(a0_0x45c122(0x159))`), so no behavioral atom (shell-exec,
# http, tmpfile) can see it. The two halves live in different archive entries
# (package.json declares the hook; the obfuscated body is the target .js), so
# this is archive-scoped. obfuscator.io packing is already standalone-hostile;
# pairing it with an install hook only raises precision — no maintained library
# ships an obfuscator.io-packed install script as its published artifact.
- id: install-hook-obfuscator-io-dropper
  desc: Install hook runs obfuscator.io-packed script
  crit: hostile
  conf: 0.97
  for: [javascript, typescript, package.json, npm]
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/scripts/declaration::postinstall-hook-declaration
  any:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::advanced-array-shuffling
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::strong-js-obfuscation
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::name-mangled-concealed-runtime
  unless:
    # Test contexts only -- NOT the whole `metadata/package/testing/`
    # directory. That fold pulls in `test-or-declaration-file`, whose
    # `declaration-file-extension` leg matches the `dist/*.d.ts` member every
    # published TypeScript package ships, so any package with type
    # declarations was exonerated regardless of what its hook ran. The
    # runtime-harness directory (the is-test family the leg traits above
    # suppress on) plus the test-filename pattern keep the genuine fixture
    # carve-out.
    - id: metadata/package/testing/harness/runtime/
    - id: metadata/package/testing/presence/fixture::test-filename-pattern

# This archive rule adds the npm trust-boundary crossing: package installation
# invokes a concealed retrieval-and-open stage without an application entry
# point or user action. Its behavioral legs are intentionally flattened because
# archive composites cannot consume a separately evaluated file composite.
- id: npm-install-hook-remote-file-opener-dropper
  desc: npm install hook runs concealed remote file opener
  crit: hostile
  conf: 0.995
  attack: "T1195.002,T1027,T1059.007,T1105"
  mbc: "B0024,B0032"
  for: [javascript, typescript, package.json, npm]
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
  - id: micro-behaviors/communications/http/request/computed::js-computed-http-object-call
  - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
  - id: micro-behaviors/process/create/shell/bridge::js-exec
  - id: micro-behaviors/process/create/launch::string-table-cross-platform-file-openers
  - id: micro-behaviors/fs/path/extension::js-executable-filename-literal
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
- id: install-hook-computed-module-loader
  desc: Install hook uses an obfuscated computed Node module loader
  crit: hostile
  conf: 0.97
  attack: T1195.002,T1027.007
  mbc: B0024,B0032.014
  for: [javascript, typescript, package.json, npm]
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/scripts/local-script::install-runs-node-local-script
  - id: micro-behaviors/process/create/load/local::cjs-caught-local-require
  - id: objectives/anti-static/obfuscation/imports::node-charcode-decoded-require
- id: install-hook-swallowed-charcode-helper
  desc: Install hook ships an obfuscated swallowed local helper
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1027
  for: [javascript, typescript, package.json, npm]
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/scripts/local-script::install-runs-node-local-script
  - id: micro-behaviors/process/create/load/local::cjs-caught-local-require
  - id: micro-behaviors/data/decode/custom::fromcharcode-indexed-array
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-variable-names
