defaults:
  platforms: [unix, windows]
  attack: T1195.002
  mbc: B0024
  for: [npm, package.json, javascript]

composite_rules:
  - id: preinstall-bun-add-remote-git-trusted
    desc: Preinstall Bun-adds remote git package with lifecycle trust
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::has-preinstall-script
      - id: micro-behaviors/os/package-manager/runtime-install::exec-bun-add-remote-git
      - id: micro-behaviors/os/package-manager/config::bun-trusted-dependencies-config

  - id: preinstall-bun-remote-git-temp-staging
    desc: Preinstall stages temp manifest for remote Bun install
    crit: suspicious
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::has-preinstall-script
      - id: micro-behaviors/os/package-manager/runtime-install::exec-bun-add-remote-git
      - id: micro-behaviors/fs/path/package-manager::package-json-path-join
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call

  - id: preinstall-bun-probe-remote-git-install
    desc: Preinstall probes for Bun then installs remote git package
    crit: suspicious
    conf: 0.94
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::has-preinstall-script
      - id: micro-behaviors/os/package-manager/runtime-install::exec-bun-add-remote-git
      - id: micro-behaviors/fs/search::posix-interpreter-lookup
