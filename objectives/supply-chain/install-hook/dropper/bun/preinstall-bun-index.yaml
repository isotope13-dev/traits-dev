# Install-hook dropper that runs a root index.js via Bun at install time.
# Seen in Mini Shai-Hulud / TeamPCP waves. The prepare-and-fail mechanism is
# runtime-neutral and lives under scripts/prepare so renamed helpers and other
# launchers receive the same coverage.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002
  mbc: B0024

traits:
  - id: preinstall-bun-run-index
    desc: preinstall runs bun on index.js
    crit: suspicious
    conf: 0.97
    if:
      type: value
      path: scripts.preinstall
      regex: '(^|[;&|])\s*bun\s+run\s+index\.js\b'

composite_rules:
  # The campaign payload is a large, single-line JavaScript file whose string
  # table is decoded at runtime.  Pairing that shape with an install-time Bun
  # entrypoint is materially different from either a normal minified bundle or
  # a package that merely happens to use Bun during development.
  - id: bun-index-obfuscated-install-payload
    desc: Bun install hook launches a large encoded JavaScript payload
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1027,T1140
    mbc: B0024,B0032
    for: [javascript, typescript, package.json, npm, archives]
    scope: archive
    all:
      - id: metadata/file/line::enormous-single-line
      - id: metadata/file/encoded::multi-base64-string-candidates
      - id: preinstall-bun-run-index

  - id: bun-index-preinstall-with-github-optional
    desc: "Bun index preinstall plus github: optional dep"
    crit: hostile
    conf: 0.98
    all:
      - id: preinstall-bun-run-index
      - id: metadata/package/dependencies/manifest/source::npm-github-protocol-optional-dependency
    unless:
      - id: well-known/tool/detection/threat-intel/
