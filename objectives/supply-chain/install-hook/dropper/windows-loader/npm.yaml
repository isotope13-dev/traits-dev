# Install-hook Windows loader dropper (StubMaker-class npm rewrite).
# A lifecycle script XOR-decodes a config blob, optionally beacons the host
# platform over HTTP, then materializes a Windows EXE under the user Downloads
# folder and launches it. Technique class — not campaign-string gated.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1195.002,T1105
  mbc: B0024

traits:
  - id: homedir-downloads-path
    desc: Joins home directory with Downloads
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)homedir\s*\([^)]{0,12}\).{0,40}Downloads'

  - id: downloads-folder-exe
    desc: References an EXE under Downloads
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)Downloads.{0,40}\.exe'

  # TEMP\main.exe staging (npm OpenHack rewrite uses %TEMP% as well as Downloads).
  - id: temp-env-token
    desc: TEMP environment path token
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '(?i)(%TEMP%|\bTEMP\b|tmpdir|tmpDir|os\.tmpdir\s*\()'

  - id: main-exe-basename
    desc: References main.exe basename
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bmain\.exe\b'

  - id: vote-http-path
    desc: HTTP client uses path /vote
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)path\s*:\s*["'']/vote["'']'

composite_rules:
  - id: temp-main-exe-path
    desc: Stages main.exe under TEMP
    crit: suspicious
    conf: 0.94
    attack: T1105
    near_bytes: 80
    all:
      - id: temp-env-token
      - id: main-exe-basename

  - id: homedir-downloads-exe
    desc: Stages an EXE under user Downloads
    crit: suspicious
    conf: 0.94
    attack: T1105
    # Requires are typically at file top; dest path lives in the drop helper.
    near_lines: 80
    all:
      - id: homedir-downloads-path
      - id: downloads-folder-exe

  - id: install-hook-platform-vote-beacon
    desc: Install hook POSTs JSON to /vote
    crit: suspicious
    conf: 0.96
    attack: T1195.002,T1041
    all:
      - id: objectives/supply-chain/install-hook/scripts/hook-file::hook-script-filename
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: vote-http-path
      - id: micro-behaviors/communications/http/request/client::post-method-text

  # Vote beacon plus repeating-key XOR config decode — durable across Ruby→npm rewrites.
  - id: install-hook-xor-vote-beacon
    desc: Install hook XOR-decodes then POSTs /vote beacon
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1027,T1041
    all:
      - id: objectives/supply-chain/install-hook/scripts/hook-file::hook-script-filename
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: vote-http-path
      - id: micro-behaviors/crypto/symmetric/xor/loop::xor-modulo-key-loop
    any:
      - id: micro-behaviors/data/encode/char-code::fromcharcode-xor-rebuild
      - id: micro-behaviors/data/decode/xor::charcode-modulo-key-index
      - id: micro-behaviors/data/encode/xor::js-xor-decoder-ast
      - id: micro-behaviors/communications/http/request/client::post-method-text

  - id: xor-decoded-downloads-exe-loader
    desc: XOR-decoded config stages Downloads or TEMP EXE
    crit: suspicious
    conf: 0.96
    attack: T1027,T1105
    all:
      - id: micro-behaviors/crypto/symmetric/xor/loop::xor-modulo-key-loop
    any:
      - id: homedir-downloads-exe
      - id: temp-main-exe-path

  - id: xor-decoded-temp-or-downloads-exe
    desc: XOR decode with staged Windows EXE path
    crit: suspicious
    conf: 0.96
    attack: T1027,T1105
    all:
      - id: xor-decoded-downloads-exe-loader
    any:
      - id: micro-behaviors/data/encode/char-code::fromcharcode-xor-rebuild
      - id: micro-behaviors/data/decode/xor::charcode-modulo-key-index
      - id: micro-behaviors/data/encode/xor::js-xor-decoder-ast

  - id: install-hook-xor-downloads-exe-dropper
    desc: Install hook XOR-decodes then drops Downloads EXE
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1027,T1105,T1059
    all:
      - id: objectives/supply-chain/install-hook/scripts/hook-file::hook-script-filename
      - id: xor-decoded-temp-or-downloads-exe
      - id: micro-behaviors/process/create/spawn::detached-true
    any:
      - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file-text
      - id: micro-behaviors/communications/http/response::node-response-to-file

  - id: npm-postinstall-xor-windows-loader
    desc: npm postinstall XOR-decodes Windows loader dropper
    crit: hostile
    conf: 0.99
    for: [javascript, typescript, package.json, npm, archives]
    scope: archive
    attack: T1195.002,T1027,T1105
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-hook-declaration
      - id: install-hook-xor-downloads-exe-dropper

  - id: npm-postinstall-hidden-python-dropper
    desc: npm postinstall runs hidden HTTP-delivered Python payload
    crit: hostile
    conf: 0.995
    for: [javascript, typescript, package.json, npm, archives]
    scope: archive
    attack: T1195.002,T1105,T1059.006,T1564.003
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-hook-declaration
      - id: objectives/command-and-control/dropper/delivery/download-execute::node-http-base64-hidden-python-dropper

  # Camouflaged install-script LOLBin sideload (eslint-config-prettier/synckit
  # class): a lifecycle hook ships a Windows DLL while a name-hidden LOLBin
  # launch (split-string child_process spawn of rundll32) runs it. The hook
  # plus the concealed launcher together have no legitimate use. Either DLL
  # signal counts: the allowlist entry (newer packages) or the member itself
  # (older packages predate the `files` convention).
  - id: install-hook-hidden-lolbin-dll-sideload
    desc: Install hook sideloads bundled DLL via hidden LOLBin
    crit: hostile
    conf: 0.98
    for: [javascript, typescript, package.json, npm, archives]
    scope: archive
    attack: T1195.002,T1218.011
    all:
      - id: objectives/anti-static/obfuscation/string/conceal::js-hidden-lolbin-launch
    any:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::npm-lifecycle-includes-dll
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::install-hook-ships-dll-member
