# GitHub Actions PATH shadowing from an npm lifecycle script.
# This is an objective-level pattern: GITHUB_PATH alone is a normal runner
# capability, but a generated executable named like a package manager is not.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, archives]
  attack: T1195.002,T1574.007

traits:
  - id: appends-generated-dir-to-github-path
    desc: Adds generated directory to GITHUB_PATH
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: 'appendFileSync\s*\(\s*process\.env\.GITHUB_PATH\s*,[\s\S]{0,100}\bdir\b'
  - id: github-ci-identity-fields
    desc: Reads GitHub CI actor and repository
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'process\.env\.GITHUB_(ACTOR|REPOSITORY)\b'

composite_rules:
  - id: npm-github-path-command-shadow
    desc: npm hook shadows command through GITHUB_PATH
    crit: hostile
    conf: 0.99
    for: [archives]
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-node-script-suppressed
      - id: micro-behaviors/os/env/vars/cicd::github-path-file
      - id: micro-behaviors/fs/write/file/direct::node-write-shell-script
      - id: micro-behaviors/fs/path/construct::node-package-manager-shim-name
      - id: appends-generated-dir-to-github-path
  - id: npm-github-path-profile-beacon
    desc: npm hook profiles GitHub runner then posts
    crit: hostile
    conf: 0.98
    for: [archives]
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-node-script-suppressed
      - id: micro-behaviors/os/env/vars/cicd::github-path-file
      - id: github-ci-identity-fields
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/client::request-write-call
