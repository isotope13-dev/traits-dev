# The case-variant Go module-proxy supply-chain attack (ref below) shipped its
# payload inside an archive whose GitHub path differed only in letter case, and
# carried a Hermit bootstrap stub as the execution vehicle. The archive-shape
# anomaly is the attack; the Hermit stub itself is ordinary developer tooling
# vendored by thousands of repositories, so its identity atoms live in
# well-known/tool/packaging/hermit and stay notable there.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1195.002

composite_rules:
  - id: mixedcase-archive-bootstrap-member
    desc: Case-variant archive carries bootstrapper
    crit: hostile
    conf: 0.94
    ref: sha256:8b2c4bd9fc25f8e5a22479d4220da36adb1840f8ad61a537e8793862b841a687
    for: [zip, go.mod, shell]
    scope: archive
    all:
      - id: metadata/build/archive::github-versioned-go-mod-member
      - id: metadata/build/archive::github-versioned-hermit-bootstrap-member
      - id: metadata/package/name/identity::go-mod-uppercase-github-module
      - id: well-known/tool/packaging/hermit::hermit-nonvendor-dist-url
    any:
      - id: metadata/build/archive::github-versioned-uppercase-namespace-member
      - id: metadata/build/archive::github-versioned-uppercase-repo-member
    # evil.example and the other RFC 2606 names are not a reachable dist host.
    unless:
      - id: micro-behaviors/communications/http/url/tld::reserved-documentation-tld-url
