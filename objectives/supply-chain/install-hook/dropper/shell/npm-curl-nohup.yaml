# npm install hook plus a shell payload chain: download (curl), make
# executable (chmod +x), and detached-run (nohup).
#
# The three payload legs describe ONE script — a dropper stages its payload
# into a file, marks it executable, and nohup-launches it in a tight sequence.
# They are bound by the inner composite's default file scope: earlier all four
# legs sat flat under `scope: archive`, and any package that declared an
# install hook while carrying a curl mention, a `chmod +x`, and a bare `nohup`
# word anywhere across thousands of members convicted — OpenClaw's own
# installer (curl of a sha256-verified Node tarball, chmod of its wrapper)
# plus a docs page naming nohup satisfied the four legs from three files.
defaults:
  platforms: [linux, macos, windows]

composite_rules:
  - id: npm-install-curl-nohup-dropper
    criticality: hostile
    desc: "npm hook runs a script that downloads, chmods +x, and detached-runs it"
    for: [binaries, '!dex', scripts, '!jcl', npm, package.json, tar]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: micro-behaviors/process/create/local-exec::download-chmod-nohup-cooccurrence
