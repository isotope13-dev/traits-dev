defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - npm
  - tar
  - package.json
  attack: T1195.002
composite_rules:
- id: npm-postinstall-staged-native-launch
  desc: npm install hook with native stage context
  crit: hostile
  conf: 0.97
  attack: T1195.002,T1059.007,T1105
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: objectives/command-and-control/dropper/file-exec/spawn::same-file-remote-native-stage
  unless:
  - id: micro-behaviors/os/package-manager/publish::npm-native-binary-wrapper
  - id: well-known/app/publishing/decocms/
  - id: metadata/package/files/dependency::node-modules-path
