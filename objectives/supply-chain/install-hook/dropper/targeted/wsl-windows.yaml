# Package-manager lifecycle execution supplies the untrusted-entry context for
# the cross-boundary WSL technique. The leaf behavior remains independently
# detectable when another ecosystem or launcher language adopts it.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, npm, archives]
  attack: T1195.002,T1059.001,T1564.003

composite_rules:
  - id: npm-postinstall-wsl-windows-dropper
    desc: npm postinstall crosses WSL into hidden PowerShell
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-hook-declaration
      - id: objectives/execution/interpreter/script/dropper::wsl-hidden-powershell-boundary-crossing
