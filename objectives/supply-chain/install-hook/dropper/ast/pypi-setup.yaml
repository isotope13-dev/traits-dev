# Setup.py AST Pattern Detection
# Uses AST patterns to detect malicious setup.py structures
# ATT&CK: T1195.001 (Supply Chain)
defaults:
  platforms: [unix, windows]
  crit: suspicious
  attack: "T1195.001"
  for: [python]
traits:
  # The cmdclass registration this file's composites need now lives with the
  # other neutral setup.py facts at
  # `metadata/build/package/recipe/setup-hooks::cmdclass-install-phase-override`: a
  # build_ext override is ordinary packaging, so the bare registration must
  # not sit under an install-hook dropper hierarchy.
  # `pre_install` is only a context marker here; the composite below also
  # requires the conventional setup.py package entrypoint.
  - id: pre-install-method
    desc: pre_install method name marker
    crit: notable
    conf: 0.90
    if:
      type: symbol
      kind: function
      exact: pre_install
composite_rules:
  # === Pre-install function definition in setup.py ===
  - id: ast-preinstall-call
    desc: Setup.py defines pre-install hook
    crit: suspicious
    conf: 0.90
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: pre-install-method
    needs: 2
    any:
      - id: metadata/build/pip::packaging-setuptools-import
      - id: metadata/build/pip::packaging-distutils-import
      - id: metadata/build/pip::packaging-setuptools-setup-call
      - id: metadata/build/pip::packaging-setuptools-imported-setup-call
      - id: metadata/package/files/wheel-sdist::setup-call

  # === Subprocess call in setup.py ===
  - id: ast-subprocess-in-setup
    desc: Setup.py invokes subprocess
    # Optional dependency installers, native builds, and setup wizards
    # legitimately invoke subprocess. The package-install trait in
    # setup/pypi-code-exec.yaml describes that behavior without calling it a
    # backdoor; hostile rules require a payload or a more specific execution
    # pattern.
    crit: notable
    conf: 0.85
    all:
      - id: metadata/package/files/included::setup-py-basename
    any:
      - id: micro-behaviors/process/create/subprocess::popen-ast
      - id: micro-behaviors/process/create/subprocess::run-ast
      - id: micro-behaviors/process/create/subprocess::call-ast
    unless:
      # Application CLI modules named setup.py are not packaging install hooks.
      - id: metadata/package/files/included::nested-cli-setup-py
      - id: well-known/app/ai/agent-runtime/ethan-agent::ethan-agent-package
      # Solstone's think/setup.py is an explicit application setup wizard,
      # not the wheel's packaging entry point.
      - id: well-known/app/ai/assistant/solstone::source-module

  # Neutral command overrides are already represented by setup-hooks metadata.
  - id: python-setup-detached-interpreter
    desc: Setup launches a detached interpreter
    crit: hostile
    conf: 0.97
    attack: T1195.001,T1059.006
    near_lines: 12
    all:
      - id: ast-subprocess-in-setup
      - id: micro-behaviors/process/create/subprocess::sys-executable-popen
      - id: micro-behaviors/process/create/subprocess::subprocess-detached-session
      - id: micro-behaviors/process/create/subprocess::subprocess-suppresses-stdio
