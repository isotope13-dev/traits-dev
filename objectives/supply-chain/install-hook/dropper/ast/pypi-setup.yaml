# Setup.py AST Pattern Detection
# Uses AST patterns to detect malicious setup.py structures
# ATT&CK: T1195.001 (Supply Chain)
defaults:
  platforms: [unix, windows]
  crit: suspicious
  attack: "T1195.001"
  for: [python]
traits:
  # === Custom Install Class Detection ===
  - id: custom-install-inherit
    desc: Custom install inherits install
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: "class.{0,50}\\(install\\):"
  # === cmdclass registers an install-phase command class ===
  # The canonical spelling for "this package runs its own code during a pip
  # install". It is the delivery vehicle every setup.py dropper uses, and also
  # ordinary setuptools extension (pybind11 relocates headers, numpy and
  # pillow drive compilers), so it is `notable` evidence, never intent. The
  # former regex additionally demanded the literal word `Custom` in the class
  # name, which only matched tutorial copy-paste; keying on the *command
  # names* setuptools actually dispatches catches the technique instead.
  # It replaces `pypi-patterns.yaml`'s `ast-cmdclass-install-override`, which
  # was the same observation at `suspicious`.
  - id: cmdclass-install-phase-override
    desc: cmdclass overrides an install-phase command
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'cmdclass.{0,80}(install|develop|egg_info|build_py|build_ext)'
  # `pre_install` is only a context marker here; the composite below also
  # requires the conventional setup.py package entrypoint.
  - id: pre-install-method
    desc: pre_install method name marker
    crit: notable
    conf: 0.90
    if:
      type: symbol
      kind: function
      exact: pre_install
composite_rules:
  # === Pre-install function definition in setup.py ===
  - id: ast-preinstall-call
    desc: Setup.py defines pre-install hook
    crit: suspicious
    conf: 0.90
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: pre-install-method
    needs: 2
    any:
      - id: metadata/build/pip::packaging-setuptools-import
      - id: metadata/build/pip::packaging-distutils-import
      - id: metadata/build/pip::packaging-setuptools-setup-call
      - id: metadata/build/pip::packaging-setuptools-imported-setup-call
      - id: metadata/package/files/wheel-sdist::setup-call

  # === Subprocess call in setup.py ===
  - id: ast-subprocess-in-setup
    desc: Setup.py invokes subprocess
    # Optional dependency installers and setup wizards legitimately invoke
    # subprocess.  Escalation remains in setup-py-backdoor, which also needs
    # a custom install hook shape.
    crit: notable
    conf: 0.85
    all:
      - id: metadata/package/files/included::setup-py-basename
    any:
      - id: micro-behaviors/process/create/subprocess::popen-ast
      - id: micro-behaviors/process/create/subprocess::run-ast
      - id: micro-behaviors/process/create/subprocess::call-ast
    unless:
      # Application CLI modules named setup.py are not packaging install hooks.
      - id: metadata/package/files/included::nested-cli-setup-py
      - id: well-known/app/ai/agent-runtime/ethan-agent::ethan-agent-package
      # Solstone's think/setup.py is an explicit application setup wizard,
      # not the wheel's packaging entry point.
      - id: well-known/app/ai/assistant/solstone::source-module

  # === Malicious Setup.py Detection ===
  - id: malicious-setup-install
    desc: Custom setup.py install hook
    crit: notable
    conf: 0.92
    needs: 2
    any:
      - id: custom-install-inherit
      - id: cmdclass-install-phase-override
      - id: ast-preinstall-call
  - id: setup-py-backdoor
    desc: Setup.py backdoor execution
    crit: hostile
    conf: 0.95
    mbc: "E1059"
    all:
      - id: malicious-setup-install
      - id: ast-subprocess-in-setup
