# Supply Chain AST Pattern Detection
# Uses AST patterns to detect suspicious setup.py structures
# ATT&CK: T1195.001 (Supply Chain)
# MBC: B0030 (C2 Communication)
defaults:
  platforms: [unix, windows]
  crit: suspicious
  attack: "T1195.001"
  mbc: "B0030"
  for: [python]
traits:
# These matched nothing: they were regexes describing source text sitting in
# `exact:`, which compares literally. A symbol is a dotted path of
# identifiers -- no parentheses, no parameter list -- so a function symbol is
# `run`, not `def run(self):`, and a call is `.clone`, not `.clone(...)`.
  # === AST Pattern: Import Inside Method ===
  # component, not suspicious: a deferred import inside `run()` is the
  # documented way setuptools command classes avoid importing build machinery
  # at module scope, and every task runner and CLI does it for startup cost.
  # On its own it establishes no behavior -- it does not say *what* is
  # imported -- so it is a building block for the hook composite below, which
  # supplies the install-phase and payload context.
  - id: ast-import-in-method
    desc: Deferred import inside a run method
    crit: component
    conf: 0.80
    if:
      type: text
      regex: "def run\\(self\\):.{0,50}^\\s+import"
  # === AST Pattern: Method Override ===
  # A function symbol is the name alone, so this is the fact "something here
  # is called `run`" -- which is every Python class with a `run()` method, not
  # a behavior. It is a building block: the composites that use it supply the
  # cmdclass/setup context and the clone+startfile calls that make an install
  # hook an install hook.
  - id: ast-install-method-override
    desc: Defines a method named run
    crit: component
    conf: 0.85
    if:
      type: symbol
      kind: function
      exact: run
  # === AST Pattern: Sequential File Operations ===
  # Three *distinct* operations -- fetch, relocate, run -- not three calls
  # matching one alternative. `count_min: 3` over the alternation counted
  # three `clone` calls as a chain, which the repeated-clone atom already
  # reports on its own; paired in `all:` below the two said the same thing
  # twice. One atom per operation, joined with `needs: 3`, says it once.
  - id: ast-rename-call
    desc: File rename call
    crit: component
    conf: 0.90
    if:
      type: symbol
      kind: call
      regex: '(^|\.)rename$'
  # `ast-cmdclass-install-override` used to live here at `suspicious` with the
  # regex `cmdclass.{0,50}install`. Registering a command class for an
  # install-phase command is how setuptools is *designed* to be extended --
  # pybind11, numpy, pillow and thousands of others ship one -- so the matcher
  # described normal packaging, not intent. The single canonical spelling now
  # lives next door as `pypi-setup.yaml`'s `cmdclass-install-phase-override`
  # at `notable`, and the intent comes from the payload legs of the composite
  # below.
composite_rules:
  # === AST-Based Supply Chain Detection ===
  # An install-phase command class is the delivery vehicle, not the attack:
  # the distinguishing move is what the hook *runs*. Requiring a payload leg
  # -- a bare `exec`/`eval`, an HTTP fetch, or a detached launch -- is what
  # separates a dropper from a package that compiles an extension or relocates
  # headers during install. The previous shape needed 2 of 3 legs that were
  # all install-hook restatements (`cmdclass`+`install`, a method named `run`,
  # a deferred import inside it), so it fired at `suspicious` on any setup.py
  # with a custom command -- pybind11's `setup_global.py.in`, for one.
  - id: ast-supply-chain-hook
    desc: Install-phase hook runs a payload
    crit: suspicious
    conf: 0.90
    all:
      - id: cmdclass-install-phase-override
    any:
      - id: micro-behaviors/process/interpreter/python::exec-builtin
      - id: micro-behaviors/process/interpreter/python::eval-builtin
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/process/create/launch::os-startfile-call
  - id: ast-clone-move-execute-chain
    desc: Clone move execute chain
    crit: suspicious
    conf: 0.90
    needs: 3
    any:
      - id: micro-behaviors/process/create/vcs/git::python-repo-clone-call
      - id: ast-rename-call
      - id: micro-behaviors/process/create/launch::os-startfile-call

  - id: ast-multi-stage-payload
    desc: Multi-stage payload delivery AST
    crit: hostile
    conf: 0.95
    mbc: "E1105"
    all:
      - id: micro-behaviors/process/create/vcs/git::python-repeated-repo-clone-calls
      - id: ast-clone-move-execute-chain
