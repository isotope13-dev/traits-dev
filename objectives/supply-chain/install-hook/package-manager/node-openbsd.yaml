defaults:
  platforms: [openbsd, bsd, unix]
  for: [javascript]
  attack: T1546.016

traits:
  - id: node-fake-registry-label
    desc: Code contains fake registry label
    crit: component
    conf: 0.94
    if:
      type: literal
      exact: fake-registry
    unless:
      - type: path
        basename: true
        exact: test-utils.js
      - id: metadata/package/testing/presence/harness::test-directory-path

  - id: node-npm-init-hook-file
    desc: Node writes npm init hook
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(writeFile|appendFile|createWriteStream)\s*\([^)]{0,160}\.npm-init\.js'
    unless:
      - id: well-known/lib/runtime/node-runtime::bundled-npm-source
      - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-bundle-text
      - id: well-known/tool/development/socket-cli::socket-dev-cli-bundle
      - id: well-known/tool/development/socket-cli::socket-dev-cli-vendored-path

composite_rules:
  - id: node-openbsd-npm-install-hook
    desc: Node OpenBSD npm install hook
    crit: hostile
    conf: 0.98
    all:
      - id: node-fake-registry-label
      - id: node-npm-init-hook-file
