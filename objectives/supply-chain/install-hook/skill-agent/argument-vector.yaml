defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]

composite_rules:
  - id: postinstall-spawns-global-skills-installer
    desc: Postinstall and global skill arguments co-occur
    crit: suspicious
    conf: 0.88
    attack: T1195.002
    scope: archive
    # Archive co-occurrence does not bind the postinstall command to its
    # entrypoint file; review that relationship before inferring execution.
    # A caller-run skill command alone has no lifecycle hook. Requiring a
    # shipped skill also avoids pooling generic spawn utilities with metadata.
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: micro-behaviors/process/create/skill::node-spawn-global-skills-add
      - id: metadata/package/agent-skill::agent-skill-archive-member
