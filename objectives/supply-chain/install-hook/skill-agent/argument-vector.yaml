defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]

composite_rules:
  - id: postinstall-spawns-global-skills-installer
    desc: Postinstall and global skill arguments co-occur
    crit: suspicious
    conf: 0.88
    attack: T1195.002
    scope: archive
    # Archive co-occurrence does not bind the postinstall command to its
    # entrypoint file; review that relationship before inferring execution.
    # A caller-run skill command alone has no lifecycle hook. Requiring a
    # shipped skill also avoids pooling generic spawn utilities with metadata.
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: micro-behaviors/process/create/skill::node-spawn-global-skills-add
      - id: metadata/package/agent-skill::agent-skill-archive-member
    unless:
      - id: global-gated-skill-install-context
  # A lifecycle skill install gated on `npm install -g` is declared setup UX:
  # a local `npm install` (including as a transitive dependency) runs no side
  # effects. The gate does not clear the spawn legs themselves, which stay
  # visible for review; it only quiets the install-hook inference.
  - id: global-gated-skill-install-context
    desc: Skill installer gated to global npm installs
    crit: exception
    conf: 0.9
    scope: archive
    all:
      - id: micro-behaviors/process/create/skill::node-spawn-skills-package-argument
      - id: micro-behaviors/process/create/skill::node-spawn-add-action-argument
      - id: micro-behaviors/process/create/skill::node-spawn-global-option-argument
      - id: micro-behaviors/os/env/package-manager::npm-config-global-scope-read
