defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  attack: "T1195.002"

traits:
  # A hook and a command elsewhere in an archive do not establish reachability.
  # Require the command in the declared hook, at shell command position; quoted
  # diagnostics and explicit CLI wizards no longer supply an install-hook claim.
  - id: postinstall-registers-ai-agent-skill
    desc: Postinstall declares global AI skill install
    crit: suspicious
    conf: 0.94
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '(^|[;&|])\s*npx\s+(-y\s+)?skills\s+add\b.{0,160}(--global|-g)\b'

composite_rules:
  # Bundled skill text is less dangerous than mutable remote instructions, but
  # writing it into an agent's trusted instruction tree during npm install is
  # still an implicit configuration change with no explicit CLI action.
  # "Bundled" needs a bundle: archive scope otherwise pools an install hook
  # (native-binary bootstrap), an agent-directory string (a generator's
  # documented output dir, a bundled UI), and an unrelated copy call (the
  # native loader) from three different files -- Nx 23.x tripped exactly
  # that. The archive must actually ship a skill for the hook to write.
  - id: postinstall-writes-bundled-agent-skill
    desc: Install hook writes bundled AI-agent skills
    crit: suspicious
    conf: 0.98
    for: [javascript, typescript, package.json, npm]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: micro-behaviors/fs/path/agent-config/directory::ai-agent-skill-install-directory
      - id: metadata/package/agent-skill::agent-skill-archive-member
    any:
      - id: micro-behaviors/fs/write/file/target::writes-agent-skill-markdown
      - id: micro-behaviors/fs/write/file/target::writes-agent-skill-tree
      - id: micro-behaviors/fs/file/copy::js-copyfile-sync-call
      - id: micro-behaviors/fs/file/copy::node-cp-sync-call
    unless:
      # A defensive agent sandbox ships its own skill sources and a
      # postinstall that regenerates committed artifacts; archive pooling
      # reads that as an install hook populating agent skills.
      - id: well-known/tool/detection/agent-glovebox::archive-context
      # Installing shipped skills is expected for a package whose own manifest
      # declares that its purpose is to provide an AI development harness.
      - id: metadata/package/description/function::agent-tool-purpose-description-context
      # An AI workflow CLI for an agent harness likewise declares agent
      # setup as its product behavior.
      # Shared agent-rules scaffolds ship bundled skills and sync them on install.
      - id: metadata/package/scaffold::agent-rules-distribution-context
      - id: metadata/package/keywords/identity::npm-keyword-pi-package
      # Recognized coding-agent products install their own skills by design.
      - id: well-known/app/ai/coding-agent/
      - id: great-cto-noop-postinstall-context
      # GoDX UI's hook only prints a hint; its explicit sync-rules CLI
      # writes agent files. The stub content, not the hook, identifies it.
      - id: well-known/app/development/godxjp-ui::inert-postinstall-hint-stub
      # A local agent runtime whose manifest and bundle identify it registers its own
      # plugin skills from postinstall (documented, best effort).
      - id: well-known/app/ai/agent-runtime/morula::archive-context

  # The npm package's only lifecycle entrypoint is an inert placeholder. Its
  # separate CLI clones and enables the Claude Code plugin only when invoked.
  - id: great-cto-noop-postinstall-context
    desc: great-cto no-op npm lifecycle context
    crit: exception
    conf: 0.99
    for: [javascript, package.json, npm]
    scope: outer
    all:
      - id: well-known/tool/development/agent/ai-cli/great-cto::package-name
      - id: well-known/tool/development/agent/ai-cli/great-cto::postinstall-command
      - id: well-known/tool/development/agent/ai-cli/great-cto::noop-postinstall-stub

  # An npm lifecycle hook that pulls content off the network straight into the
  # user's AI-agent skill tree ships prompt/instruction text that was never in
  # the published artifact, is mutable after publication, and lands with no user
  # action — the agent then loads it as trusted instructions. The consented
  # variant of this (a `bin` the user runs explicitly) has no install hook and
  # therefore does not match.
  - id: postinstall-fetches-remote-agent-skill
    desc: Postinstall fetches remote AI agent skills
    crit: suspicious
    conf: 0.93
    for: [javascript, typescript, package.json, npm]
    scope: archive
    attack: "T1195.002,T1105"
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: micro-behaviors/communications/http/request/client::js-fetch-implementation-call
      - id: micro-behaviors/communications/mcp::mcp-client-reads-resources
      - id: micro-behaviors/fs/write/file/target::writes-agent-skill-tree
      - id: micro-behaviors/fs/path/agent-config/directory::ai-agent-skill-install-directory

  - id: postinstall-fetches-authenticated-agent-skill
    desc: npm hook fetches authenticated agent skills
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript, package.json, npm]
    scope: archive
    attack: "T1195.002,T1105"
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: micro-behaviors/communications/mcp::mcp-client-authenticated-resource-fetch
      - id: micro-behaviors/fs/write/file/target::writes-agent-skill-tree
      - id: micro-behaviors/fs/path/agent-config/directory::ai-agent-skill-install-directory
