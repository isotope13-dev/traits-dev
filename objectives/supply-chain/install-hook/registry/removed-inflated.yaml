# A package removed after publication is especially risky when its manifest
# combines an inflated dependency-confusion version with executable install
# behavior. These signals are deliberately joined across registry and package
# facts rather than matching a package name.
defaults:
  platforms: [unix, windows]
  attack: T1195.002

composite_rules:
- id: removed-inflated-node-hook
  desc: Removed inflated package runs Node install hook
  crit: hostile
  conf: 0.99
  scope: package
  all:
  - id: objectives/supply-chain/impersonation/registry/publish::removed-package-with-node-postinstall
  - id: metadata/package/quality/version-sentinel::suspicious-version-patterns
