# A release the registry no longer serves, whose only install-time behavior is
# a postinstall wired to a test-named script, is a staging artifact rather than
# a broken publish: npm never runs tests at install, and the take-down says the
# ecosystem already reached a verdict on the publisher. The payload lands in a
# sibling version at that same path, so the removed release itself can look
# inert. Joined across registry and manifest facts, not by package name.
defaults:
  platforms: [unix, windows]
  attack: T1195.002

composite_rules:
- id: removed-package-test-script-hook
  desc: Removed package installs by running a test script
  crit: hostile
  conf: 0.96
  scope: package
  all:
  - id: objectives/supply-chain/impersonation/registry/publish::removed-package-with-node-postinstall
  any:
  - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-test-directory-script
  - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-test-named-script
