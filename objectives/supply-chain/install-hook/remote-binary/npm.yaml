defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  attack: "T1195.002,T1105,T1222.002"

traits:
  - id: node-cli-publish-login-registry-flag-injection
    desc: CLI injects --registry for publish/login
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: '(publish|login)[\s\S]{0,500}push\(\s*[''"]--registry'

  - id: node-http-response-pipeline-write-file
    desc: Node pipelines HTTP to write stream
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: 'pipeline\([\s\S]{0,400}createWriteStream'

composite_rules:
  - id: verified-versioned-release-binary-installer
    desc: Verified versioned release installer context
    crit: exception
    conf: 0.95
    scope: leaf
    for: [javascript, typescript]
    near_bytes: 8192
    all:
      - id: micro-behaviors/crypto/hash/digest::node-createhash-sha256-call
      - id: micro-behaviors/communications/http/download/release::forge-release-version-download-url
      - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/variable-spawn::spawn-variable-program
      - id: micro-behaviors/crypto/hash/digest::hash-verification-diagnostic

  # The Unix native-binary bootstrap rules below key on chmod 755 and tar
  # extraction, so a Windows dropper that fetches a bare .exe from a code
  # forge and runs it with execFile — no permission bit, no archive — slips
  # through at notable. That is the Kothamine npm vector (dotnet-runtime-base
  # pulling npm-sc-legit.exe from a GitHub repo during install). Correlate the
  # lifecycle hook, an executable download URL, and a child-process launch
  # across the package archive.
  - id: npm-lifecycle-install-hook
    desc: npm lifecycle install hook declared
    crit: notable
    conf: 0.9
    scope: archive
    any:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: metadata/package/scripts/lifecycle::filtered-raw-preinstall-hook

  - id: npm-postinstall-verified-native-binary-bootstrap
    desc: npm postinstall verifies, enables, and runs a downloaded native binary
    crit: notable
    conf: 0.98
    scope: archive
    attack: "T1195.002,T1105,T1222.002,T1059.007"
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/communications/http/url/cloud::cloud-download-url
      - id: micro-behaviors/fs/write/file/executable::node-write-file-executable-mode
      - id: micro-behaviors/crypto/hash/digest::node-createhash-sha256-call
      - id: micro-behaviors/process/create/system::js-execfile-call

  # A mutable release lookup followed by asset selection, disk staging,
  # executable permission changes, and launch is worth review even outside a
  # package hook. Legitimate wrappers do this, but without a pinned digest the
  # bytes that run are controlled by mutable remote release metadata.
  - id: node-latest-release-native-binary-bootstrap
    desc: Node runs latest release binary without pinned integrity
    crit: suspicious
    conf: 0.98
    for: [javascript, typescript]
    scope: leaf
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-api-latest-path-template
      - id: micro-behaviors/communications/http/download/release::github-api-browser-download-url-member
      - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
    unless:
      - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context

  # A version-pinned release is safer than `latest`, but the release asset is
  # still trusted by URL alone when no digest or signature is checked. Keep
  # this suspicious rather than hostile: legitimate CLI wrappers use this
  # shape, while the anti-AV composite supplies the hostile context.
  - id: node-versioned-release-native-binary-bootstrap
    desc: Node runs release binary without hash verification
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    scope: leaf
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/download/release::forge-release-version-download-url
      - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/variable-spawn::spawn-variable-program
    unless:
      - id: well-known/app/ai/gateway/inboost-ai-proxy::archive-context
      - id: objectives/supply-chain/install-hook/remote-binary::verified-versioned-release-binary-installer

  - id: node-unverified-native-bootstrap-inherits-environment
    desc: Unverified native binary inherits full environment
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    scope: leaf
    near_bytes: 8192
    all:
      - id: node-versioned-release-native-binary-bootstrap
      - id: micro-behaviors/os/env/read::node-process-env-object-field
    unless:
      - id: objectives/supply-chain/install-hook/remote-binary::verified-versioned-release-binary-installer

  # Correlate the file-local bootstrap with the lifecycle declaration rather
  # than pooling unrelated downloader and process APIs across a large package.
  - id: npm-postinstall-latest-release-native-binary-bootstrap
    desc: npm postinstall runs latest release binary without pinned integrity
    crit: suspicious
    conf: 0.99
    scope: archive
    for: [npm, tar, package.json, javascript]
    attack: "T1195.002,T1105,T1222.002,T1059.007"
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: node-latest-release-native-binary-bootstrap

  # Keep the staging operations file-local before correlating them with a
  # package lifecycle declaration. Large applications commonly contain each
  # operation in unrelated runtime modules; archive-wide co-occurrence alone
  # does not establish that postinstall downloads or enables an executable.
  - id: remote-native-archive-stage
    desc: One script fetches, extracts, writes, and enables a native archive
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    scope: leaf
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/data/archive/extract/tar::js-tar-gzip-extract-command
    near_bytes: 8000

  # A lifecycle hook that downloads an archive, decompresses it, and then
  # runs npm from the extracted tree is a remote package-loader chain. This is
  # intentionally separate from the native-binary wrapper rule: it catches
  # loaders that stage JavaScript dependencies rather than executables.
  - id: npm-postinstall-remote-package-loader
    desc: npm postinstall downloads and runs an extracted package
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/communications/http/request/get::node-http-client-get
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: micro-behaviors/data/decompress/gzip::node-gunzip-function
      - id: micro-behaviors/process/create/system::js-execfilesync
      - id: micro-behaviors/os/package-manager/runtime-install::exec-npm-install-array

  # An install hook that fetches an archive, extracts it with a host command,
  # and explicitly enables the resulting file changes the trusted package
  # contents at install time.  Recognized platform-binary wrappers are a
  # legitimate release pattern and are excluded from this supply-chain verdict.
  - id: npm-postinstall-remote-native-archive
    desc: npm postinstall fetches, extracts, and enables a remote native executable
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: remote-native-archive-stage
    unless:
      - id: micro-behaviors/os/package-manager/publish::npm-native-binary-wrapper-postinstall
      - id: micro-behaviors/os/package-manager/publish::npm-native-binary-wrapper-platform-bin-postinstall

  # A package lifecycle hook that disables TLS verification, streams a remote
  # archive to disk, extracts it, and executes shell commands is an install-time
  # dropper even when it does not chmod or launch a native binary. The TLS
  # bypass and shell execution distinguish this from ordinary archive setup.
  - id: npm-postinstall-tls-bypassed-archive-shell-dropper
    desc: npm postinstall downloads and executes a TLS-bypassed archive
    crit: hostile
    conf: 0.99
    scope: archive
    attack: "T1195.002,T1105,T1059.007,T1573"
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/fs/write/file/stream::create-write-stream
      - id: micro-behaviors/data/archive/extract/tar::js-tar-gzip-extract-command
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: objectives/command-and-control/dropper/script-eval/remote-code::remote-https-get-tls-bypass

  # Executing a mutable raw-forge shell script from an npm lifecycle hook is
  # an install-time remote-code chain.  The lifecycle declaration and the
  # shell pipeline must be separate observations in the same archive, so a
  # normal library containing curl in documentation does not match.
  - id: npm-postinstall-remote-shell-bootstrap
    desc: npm postinstall executes mutable remote shell installer
    crit: hostile
    conf: 0.99
    scope: archive
    for: [source, binaries, '!dex', scripts, '!jcl', npm, package.json, tar]
    attack: "T1195.002,T1105,T1059.004"
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: objectives/command-and-control/dropper/delivery/pipe::curl-pipe-sh
      - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-script-file
    # curl-pipe-sh is a text observation, so a package that merely *prints* its
    # own `curl -fsSL .../install.sh | bash` one-liner -- in a console.log after a
    # successful install, in an `echo` inside a shipped installer script, or in a
    # help banner -- satisfies it just as a dropper does. Requiring the pipeline
    # to also appear inside a Node child-process call is what makes the verdict
    # match its wording: the hook has to be able to *run* the remote script, not
    # document it. clawdbot-go 1.0.4 is the benign shape this excludes -- a
    # Solana agent installer whose postinstall only copies a bundled skill pack,
    # while every curl|bash in the tarball is echoed advice for the operator.
    any:
      - id: micro-behaviors/communications/http/download/curl::curl-pipe-shell-in-js-exec
      - id: micro-behaviors/communications/http/download/curl::node-execsync-curl-download
    # The three legs above prove co-occurrence inside one archive, not that the
    # hook reaches the pipeline. That gap has a common benign shape: a wrapper
    # package whose postinstall installs the project's own release binary, and
    # whose run.js prints `curl -fsSL .../install.sh | sh` in a console.error
    # fallback ("download failed, try this instead"). curl-pipe-sh anchors on
    # `^\s*curl` to prove command position, but `type: text` applies `^` per
    # extracted run and a string literal's contents are their own run, so the
    # quoted instruction reads as a command at line start.
    #
    # The release-asset URL template is what separates the two: shipping a
    # versioned `releases/download/v<x>/<artifact>` installer is the wrapper
    # idiom (esbuild/biome-style shims build exactly that URL), and a dropper
    # whose point is to fetch a mutable `main`-branch script has no reason to
    # also carry one. The long per-vendor `not:` list on curl-pipe-sh is this
    # same FP being patched one project at a time.
    unless:
      - id: micro-behaviors/communications/url/external/github::github-release-download

  - id: remote-brotli-binary-stage
    desc: One script streams, brotli-decompresses, hashes, and enables a native binary
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    scope: leaf
    all:
      - id: micro-behaviors/crypto/hash/digest::node-createhash-sha256-call
      - id: micro-behaviors/data/decompress/brotli::js-create-brotli-decompress
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
      - id: node-http-response-pipeline-write-file

  - id: npm-postinstall-sha256-brotli-native-bootstrap
    desc: npm postinstall verifies brotli native download
    crit: hostile
    conf: 0.99
    scope: archive
    attack: "T1195.002,T1105"
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: remote-brotli-binary-stage
    unless:
      - id: verified-versioned-release-binary-installer
      - id: micro-behaviors/os/package-manager/publish::npm-native-binary-wrapper-postinstall

  - id: npm-shim-publish-registry-hijack
    desc: npm-compatible shim hijacks publish registry
    crit: hostile
    conf: 0.98
    scope: archive
    attack: "T1195.002,T1557"
    all:
      - id: node-cli-publish-login-registry-flag-injection
      - id: metadata/package/entrypoint::bin-field-declared
    unless:
      - id: verified-versioned-release-binary-installer
