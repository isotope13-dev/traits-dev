# A Python install hook that fetches a program and runs it. Sibling to
# npm.yaml, which describes the same arrangement in a lifecycle script.
#
# The install hook is the delivery: it runs on every consumer, before anything
# has been imported, with whatever privileges the install has. What arrives is
# not in the artifact at all, so nothing about the published package says what
# will execute -- and it can differ per victim, or per day.
#
# The launch leg is deliberately broad about *how* the program is started.
# `subprocess` is the obvious way and the one every process-execution rule
# watches, so a dropper that wants to stay quiet reaches for the Win32 API
# through ctypes instead. Both spellings belong here.
#
# Worked example: a `CustomInstallCommand(install)` that pulls a file from a
# file-sharing link, writes it to `%LOCALAPPDATA%\Driver.exe`, and calls
# `ctypes.windll.kernel32.WinExec` on it.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: "T1195.002,T1105"
  mbc: E1105

composite_rules:
  - id: python-install-hook-downloads-and-runs
    desc: Install hook downloads a program and runs it
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/build/package/recipe::python-install-hook
      - id: objectives/supply-chain/install-hook/build/behavioral::setup-py-network-in-install
    any:
      - id: micro-behaviors/process/create/exec::python-ctypes-win32-exec
      - id: micro-behaviors/process/create/subprocess::run-content
      - id: micro-behaviors/process/create/subprocess::popen-content
