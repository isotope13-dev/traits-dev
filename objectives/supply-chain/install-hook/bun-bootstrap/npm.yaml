defaults:
  platforms: [windows, unix]
  attack: T1195.002
  mbc: B0024
traits:
- id: preinstall-node-setup-bun
  desc: preinstall launches setup_bun.js
  crit: suspicious
  conf: 0.96
  for: [package.json]
  if:
    type: value
    path: "scripts.preinstall"
    exact: "node setup_bun.js"
# Recurring Mini Shai-Hulud / TeamPCP install-hook fingerprint: the loader is
# always named setup.mjs and wired through scripts.preinstall so npm runs it
# before the install completes. Distinct from the setup_bun.js variant above.
- id: preinstall-node-setup-mjs
  desc: preinstall launches setup.mjs
  crit: suspicious
  conf: 0.97
  for: [package.json]
  if:
    type: value
    path: "scripts.preinstall"
    regex: '(^|[;&|]\s*)node\s+(\./)?setup\.mjs\b'
- id: bun-install-powershell-iex
  desc: Installs Bun via PowerShell IEX
  crit: suspicious
  conf: 0.95
  for: [javascript]
  if:
    type: text
    substr: irm bun.sh/install.ps1|iex
- id: bun-path-reload
  desc: Reloads PATH from shell profiles
  crit: suspicious
  conf: 0.9
  for: [javascript]
  if:
    type: text
    substr: source ${profileFile} && echo $PATH
- id: bun-which-where-probe
  desc: Bun availability probe command
  crit: notable
  conf: 0.88
  for: [javascript]
  if:
    type: text
    regex: '(?m)(^|[;&|''"`])\s*(where|which)\s+bun\b'
- id: bun-env-sidecar-name
  desc: References bun_environment.js payload
  crit: suspicious
  conf: 0.95
  for: [javascript]
  if:
    type: text
    substr: bun_environment.js
- id: js-megabyte-single-line-payload
  desc: JavaScript line longer than eight megabytes
  crit: notable
  conf: 0.97
  for: [javascript]
  size_min: 8000000
  if:
    type: metrics
    field: text.max_line_length
    min: 8000000
  unless:
    # Binary blobs that content typing landed on JavaScript are one enormous
    # line by construction (a voxel array, a zero-padded dump), which is a file
    # shape rather than a bundled payload.
    - id: metadata/file/data-blob::nul-dominated-content
    - id: metadata/file/magic/identity::nifti-volume
    - id: metadata/build/recognized-contexts::benign-build-tooling-context
    - id: metadata/build/minifier::js-large-minified-bundle
    - id: well-known/lib/vendor-sdk/tscircuit-eval::dist-blob-url-bundle
- id: js-heavy-xor-string-decode
  desc: Thousands of XOR-decoded strings
  crit: suspicious
  conf: 0.93
  for: [javascript]
  if:
    type: metrics
    field: binary.string_count
    min: 2000
- id: gcp-secretmanager-v1-marker
  desc: Google Secret Manager API namespace
  crit: notable
  conf: 0.97
  for: [javascript]
  if:
    type: text
    substr: google.cloud.secretmanager.v1
- id: bun-release-zip-templated-asset-url
  desc: Bun release URL with templated asset
  crit: notable
  conf: 0.9
  for: [javascript]
  if:
    type: text
    regex: 'github\.com/oven-sh/bun/releases/download/bun-v.{0,40}/\$\{?asset\}?\.zip'
# The staging and exec legs used to spell out this campaign's own identifiers —
# a `bun-dl-` mkdtemp prefix, and `execFileSync(binPath, [entryScriptPath])`.
# Renaming two locals defeated all of it, which is a one-line change for the
# next wave. Both legs now come from the structural micro-behaviour atoms
# referenced by the composites below.
- id: bun-execution-js-sidecar
  desc: Bun launches execution.js sidecar
  crit: suspicious
  conf: 0.96
  for: [javascript]
  if:
    type: text
    regex: 'ENTRY_SCRIPT\s*=\s*["'']execution\.js["'']|["'']execution\.js["''].{0,160}execFileSync\('
# Opaque co-shipped payload names used across Mini Shai-Hulud waves
# (execution.js historically; Math_Symbol.js in the keyv family wave).
- id: bun-math-symbol-payload-name
  desc: References Math_Symbol.js payload name
  crit: notable
  conf: 0.97
  for: [javascript]
  if:
    type: text
    substr: Math_Symbol.js
- id: bun-math-init-payload-name
  desc: References math_init.js payload name
  crit: notable
  conf: 0.97
  for: [javascript]
  if:
    type: text
    # Path-basename matching only hit the sidecar file itself; droppers name
    # the payload in a string (often `const E = "math_init.js"`) inside setup.mjs.
    regex: '(?i)(^|[^A-Za-z0-9_])math_init\.js\b'
- id: math-symbol-esm-sidecar-import
  desc: ESM import of co-shipped Math_Symbol sidecar
  crit: notable
  conf: 0.97
  for: [javascript, typescript]
  if:
    type: text
    regex: '(?i)import\s+["'']\.\/Math_Symbol\.js["'']'
- id: node-https-esm-import
  desc: ESM default import of Node https module
  crit: notable
  conf: 0.88
  for: [javascript, typescript]
  if:
    type: text
    regex: 'import\s+\w+\s+from\s*["'']https["'']'
composite_rules:
- id: setup-mjs-optional-sidecar
  desc: Install hook launches setup module beside optional sidecar
  crit: suspicious
  conf: 0.96
  for: [package.json]
  all:
  - id: preinstall-node-setup-mjs
  - id: metadata/package/dependencies/manifest/name-form::npm-install-adjacent-dependency-name
- id: bun-runtime-install-hook
  desc: Install hook bootstraps Bun sidecar runtime
  crit: hostile
  conf: 0.98
  all:
  - id: bun-env-sidecar-name
  - id: micro-behaviors/process/exit/terminate::process-exit-zero-repeat
  any:
  - id: micro-behaviors/os/package-manager/install::bun-piped-installer-command
  - id: bun-install-powershell-iex
  - id: bun-path-reload
  - id: micro-behaviors/os/env/modify::bun-path-setup-reference
  unless:
  - id: well-known/app/development/cloudflare/
- id: bun-path-stealth-bootstrap
  desc: Bun bootstrap mutates PATH and hides errors
  crit: suspicious
  conf: 0.95
  scope: leaf
  all:
  - id: bun-env-sidecar-name
  - id: micro-behaviors/process/exit/terminate::process-exit-zero-repeat
  any:
  - id: micro-behaviors/os/env/modify::bun-path-setup-reference
  - id: bun-path-reload
  unless:
  - id: well-known/app/development/cloudflare/
- id: cloud-secret-theft-payload
  desc: Obfuscated payload targets cloud secrets
  crit: hostile
  conf: 0.97
  all:
  - id: js-megabyte-single-line-payload
  - id: gcp-secretmanager-v1-marker
  any:
  - id: well-known/tool/detection/sast::trufflehog-release-url
  - id: micro-behaviors/os/env/package-manager::npm-config-token-env-ref
  - id: js-heavy-xor-string-decode
- id: bun-temp-runtime-sidecar-loader
  desc: Temp-staged runtime runs local sidecar
  crit: suspicious
  conf: 0.97
  all:
  - id: bun-release-zip-download
  - id: micro-behaviors/fs/temp/directory::node-mkdtemp-os-tmpdir
  - id: micro-behaviors/process/create/system::js-execfilesync-resolved-program
  any:
  - id: micro-behaviors/fs/chmod/modify::node-chmod
  - id: micro-behaviors/data/archive/extract/zip::unzip-tool-reference
  - id: micro-behaviors/fs/delete/directory::fs-rm-recursive
  unless:
  - id: well-known/app/development/cloudflare/
  - id: metadata/build/ecosystem::verified-runtime-release-download-script-context
- id: cap-style-bun-execution-loader
  desc: Bun loader launches execution.js payload
  crit: hostile
  conf: 0.98
  all:
  - id: bun-temp-runtime-sidecar-loader
  - id: bun-execution-js-sidecar
  any:
  - id: micro-behaviors/fs/delete/directory::fs-rm-recursive
  - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
  unless:
  - id: well-known/app/development/cloudflare/
# Opaque co-shipped payload (Math_Symbol.js / execution.js) joined via path.join
# and handed to the downloaded Bun binary — install-time dropper class.
- id: bun-opaque-payload-name
  desc: Names an opaque Bun co-shipped payload
  crit: component
  conf: 0.95
  for: [javascript]
  any:
  - id: bun-math-symbol-payload-name
  - id: bun-math-init-payload-name
  - id: micro-behaviors/fs/path/script::execution-javascript-name-reference
- id: bun-opaque-payload-sidecar
  desc: Bun targets opaque co-shipped payload
  crit: suspicious
  conf: 0.97
  for: [javascript]
  # Do not require near_bytes: obfuscated loaders declare the payload name
  # at module scope and exec it hundreds of lines later after the download.
  all:
  - id: bun-opaque-payload-name
  any:
  - id: micro-behaviors/fs/path/construct::node-join-script-directory
  - id: micro-behaviors/process/create/system::js-execfilesync-resolved-program
- id: bun-math-symbol-obfuscated-bootstrap
  desc: Obfuscated bootstrap imports Math_Symbol and execFileSync
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1059.007
  for: [javascript, typescript]
  all:
  - id: math-symbol-esm-sidecar-import
  - id: metadata/import/builtin::child-process-execfilesync-esm-import
  - id: node-https-esm-import
- id: bun-opaque-payload-temp-runtime-loader
  desc: Temp Bun runtime launches named sidecar
  crit: suspicious
  conf: 0.98
  all:
  - id: bun-temp-runtime-sidecar-loader
  - id: bun-opaque-payload-sidecar
  any:
  - id: micro-behaviors/fs/delete/directory::fs-rm-recursive
  - id: micro-behaviors/process/exit/handler::promise-both-paths-exit-zero
  - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
  unless:
  - id: well-known/app/development/cloudflare/
- id: bun-silent-temp-runtime-loader
  desc: Temp runtime loader hides failures
  crit: hostile
  conf: 0.97
  all:
  - id: bun-temp-runtime-sidecar-loader
  - id: micro-behaviors/process/exit/handler::promise-both-paths-exit-zero
  unless:
  - id: well-known/app/development/cloudflare/
- id: bun-setup-mjs-preinstall-loader
  desc: preinstall setup.mjs bootstraps Bun runtime
  # A package-manager bootstrap can legitimately provision a runtime. The
  # downloaded interpreter, temp staging, and preinstall context merit review,
  # but hostility comes from the sidecar payload composed elsewhere.
  crit: suspicious
  conf: 0.99
  scope: archive
  for: [javascript, typescript, package.json, npm]
  all:
  - id: preinstall-node-setup-mjs
  - id: bun-temp-runtime-sidecar-loader
  unless:
  - id: well-known/app/development/cloudflare/
  - id: well-known/tool/detection/threat-intel/
- id: bun-release-zip-download
  desc: Downloads a JavaScript runtime release
  crit: notable
  conf: 0.9
  for: [javascript]
  any:
  - id: bun-release-zip-templated-asset-url
  - id: micro-behaviors/communications/http/download/github::js-runtime-release-archive-url
