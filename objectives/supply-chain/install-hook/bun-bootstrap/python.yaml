# Python .pth install hooks that bootstrap the Bun runtime to execute a
# co-shipped JavaScript sidecar (ShaiHulud / nhmpy-style wheels).
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002
  mbc: B0024

traits:
  - id: pth-bun-github-release-url
    desc: References Bun GitHub release download URL
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'github\.com/oven-sh/bun/releases/download/bun-v[0-9]'

  - id: pth-index-js-sidecar-reference
    desc: References _index.js sidecar payload
    crit: component
    conf: 0.95
    if:
      type: text
      substr: _index.js

  - id: pth-subprocess-run-alias-call
    desc: subprocess.run via short module alias
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '_s\.run\('

composite_rules:
  - id: pth-bun-bootstrap-sidecar-loader
    desc: .pth bootstraps Bun to run co-shipped _index.js
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1059.006
    all:
      - id: objectives/persistence/login/python-startup::pth-import-exec
      - id: pth-bun-github-release-url
      - id: pth-index-js-sidecar-reference
      - id: pth-subprocess-run-alias-call
