defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  attack: "T1195.002"

traits:
  - id: npx-skills-add-global-command-text
    desc: npx global skill install command text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bnpx\s+(-y\s+)?skills\s+add\b.{0,160}(--global|-g)\b'

  - id: npx-skills-remove-global
    desc: Removes AI agent skill globally via npx
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bnpx\s+(-y\s+)?skills\s+remove\b.{0,160}(--global|-g)\b'

  - id: ai-agent-skill-registration-action
    desc: AI agent skill registration action text
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)(registering|installing).{0,80}(agent skill|ai agent)'

  # `cursor` was in this alternation as a bare word, which is ordinary vocabulary in
  # far more code than it is an AI-agent name: terminal/TUI libraries move a cursor,
  # database clients open cursors, stylesheets set `cursor: pointer`, and paginated
  # API clients pass cursor tokens. It matched a PTY session daemon (xterm +
  # ghostty-vt) three times with zero `claude-code` and zero `codex` hits, reporting
  # "AI agent CLI names" from a supply-chain install-hook objective. Narrowed to the
  # agent CLI spelling (`cursor-agent` / `cursor agent`); the product name alone
  # carries no agent-invocation meaning. Recall cost is negligible -- the consuming
  # composite postinstall-registers-ai-agent-skill gets its intent from the `all:`
  # legs (a postinstall hook plus `npx skills add`), and this is one of three
  # interchangeable `any:` corroborators.
  - id: ai-agent-runtime-names
    desc: AI agent CLI names
    crit: component
    conf: 0.5
    if:
      type: text
      regex: '(?i)\b(claude[- ]code|cursor[- ]agent|codex)\b'

composite_rules:
  # Bundled skill text is less dangerous than mutable remote instructions, but
  # writing it into an agent's trusted instruction tree during npm install is
  # still an implicit configuration change with no explicit CLI action.
  - id: postinstall-writes-bundled-agent-skill
    desc: npm install hook writes bundled instructions into AI agent skills
    crit: suspicious
    conf: 0.98
    for: [javascript, typescript, package.json, archives]
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-postinstall
      - id: micro-behaviors/fs/file/write/agent-skill::writes-agent-skill-markdown
      - id: micro-behaviors/fs/path/application/config::ai-agent-skill-install-directory

  - id: postinstall-registers-ai-agent-skill
    desc: npm install hook registers global AI agent skill
    crit: suspicious
    conf: 0.94
    for: [javascript, typescript, package.json, archives]
    scope: archive
    near_bytes: 12000
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-postinstall
      - id: npx-skills-add-global-command-text
    any:
      - id: ai-agent-skill-registration-action
      - id: ai-agent-runtime-names
      - id: objectives/evasion/security-bypass/llm/target::llm-agent-target
    unless:
      - id: well-known/app/system/olares

  # An npm lifecycle hook that pulls content off the network straight into the
  # user's AI-agent skill tree ships prompt/instruction text that was never in
  # the published artifact, is mutable after publication, and lands with no user
  # action — the agent then loads it as trusted instructions. The consented
  # variant of this (a `bin` the user runs explicitly) has no install hook and
  # therefore does not match.
  - id: postinstall-fetches-remote-agent-skill
    desc: npm install hook downloads remote content into agent skills directory
    crit: suspicious
    conf: 0.93
    for: [javascript, typescript, package.json, archives]
    scope: archive
    attack: "T1195.002,T1105"
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: micro-behaviors/fs/path/application/config::ai-agent-skill-install-directory
