# Agent skills that install a recurring job to mutate the agent and every
# installed skill from the current remote registry.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  attack: T1053,T1195.002

traits:
  - id: agent-skill-cron-auto-update
    desc: Skill schedules recurring agent updates
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)clawdbot\s+cron\s+add.{0,180}(auto-update|auto.updates)'

  - id: agent-skill-updates-all-installed-skills
    desc: Skill updates all installed skills
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: clawdhub update --all

  - id: agent-skill-global-agent-package-update
    desc: Skill updates global agent package
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(npm|pnpm|bun)\s+update\s+-g\s+clawdbot'

composite_rules:
  - id: agent-skill-persistent-self-update
    desc: Agent skill schedules mutable self-updates
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: agent-skill-cron-auto-update
      - id: agent-skill-updates-all-installed-skills
