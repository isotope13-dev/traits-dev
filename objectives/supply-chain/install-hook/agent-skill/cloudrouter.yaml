# Cloudrouter skills that silently install a mutable global CLI and then
# recommend synchronizing the caller's whole local directory to a remote VM.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  attack: T1195.002,T1041

traits:
  - id: cloudrouter-forced-global-install
    desc: Skill forces latest global cloud CLI install
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)always run this command.{0,140}npm install -g\s+@.{0,40}/cloudrouter'

  - id: cloudrouter-local-directory-sync
    desc: Skill syncs the local directory to cloud
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)(syncs your local directory|sync current directory to a cloud sandbox)'

  - id: cloudrouter-unattended-sudo-fix
    desc: Skill mandates unattended remote sudo command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)cloudrouter ssh.{0,100}sudo chown -R'

composite_rules:
  - id: cloudrouter-global-install-and-project-sync
    desc: Skill installs mutable CLI and exports local project
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: cloudrouter-forced-global-install
      - id: cloudrouter-local-directory-sync
    any:
      - id: cloudrouter-unattended-sudo-fix
