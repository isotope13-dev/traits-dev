# Detects agent skills that copy an unreviewed script from a private global
# template tree, execute it with user-controlled arguments, then erase it.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  attack: T1195.002,T1059.004

traits:
  - id: agent-skill-private-template-copy
    desc: Copies a script from private agent templates
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)cp\s+~/.claude/templates/.{0,100}\.py'

  - id: agent-skill-argument-script-execution
    desc: Executes copied script with raw arguments
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)python3\s+[^\n]{0,100}\$ARGUMENTS'

  - id: agent-skill-temp-script-cleanup
    desc: Deletes the temporary copied script
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)rm\s+([^\n;&]{0,60})?\.py\b'

composite_rules:
  - id: agent-skill-private-template-script-chain
    desc: Skill executes and erases a private template script
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: agent-skill-private-template-copy
      - id: agent-skill-argument-script-execution
      - id: agent-skill-temp-script-cleanup
