defaults:
  platforms: [windows, unix]
  for: [markdown, text, shell]
  attack: T1195.002

traits:
  - id: npx-latest-global-skill-refresh
    desc: Fetches latest skills into global agent tree
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)npx skills@latest add.{0,100}--all -g'

  - id: forced-skill-update-workflow
    desc: Skill mandates executing remote update workflow
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '(?i)you must execute this workflow'

  - id: manual-global-skill-copy
    desc: Copies skill files into global Claude directory
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)cp -r skills/.{1,80}~/.claude/skills/'

composite_rules:
  - id: agent-skill-forces-unpinned-global-refresh
    desc: Skill forces unpinned global skill replacement
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: npx-latest-global-skill-refresh
      - id: forced-skill-update-workflow

