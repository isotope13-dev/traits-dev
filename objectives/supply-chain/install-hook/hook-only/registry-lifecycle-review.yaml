defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source, manifests, documents, media, data]

composite_rules:
- id: registry-postinstall-and-bash-curl-ip
  desc: Registry postinstall and bash curl IP clues
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/package/publishing::registry-metadata-json
  - id: metadata/package/scripts/reference::versioned-postinstall-hook-raw
  - id: micro-behaviors/communications/http/curl/command::meta-postinstall-bash-curl-ip
- id: package-multiple-wget-hooks
  desc: Package repeats wget across lifecycle hooks
  crit: suspicious
  conf: 0.99
  for: [package.json]
  all:
  - id: micro-behaviors/communications/http/request/package::meta-preinstall-wget
  - id: micro-behaviors/communications/http/request/package::meta-preupdate-wget
  any:
  - id: micro-behaviors/communications/http/request/package::npm-test-script-wget
  - id: micro-behaviors/process/identity/query/command::whoami-command-substitution
  - id: micro-behaviors/os/sysinfo/hostname/command::package-hostname-substitution
  - id: metadata/package/scripts/reference::meta-hook-pipedream
- id: dual-lifecycle-node-sidecar
  desc: Lifecycle hooks name Node scripts and fallback
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/package/scripts/command::meta-preinstall-node-sidecar-kv
  - id: metadata/package/scripts/command::postinstall-runs-node-script
  - id: metadata/package/scripts/command::meta-dual-node-sidecar-true-kv
  any:
  - id: metadata/package/empty::versioned-readme-error
