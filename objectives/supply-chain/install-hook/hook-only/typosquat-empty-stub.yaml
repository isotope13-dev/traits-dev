# A hook-only stub: a package that ships an empty main module (module.exports={})
# yet declares a lifecycle install hook, under an "Unofficial <name> SDK" typosquat
# cover. It provides zero library functionality — its sole reason to exist is to
# run code at install time — while masquerading as a legitimate SDK. No real SDK
# is an empty object with an install hook; the pairing has no benign use.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, npm]
  attack: "T1195.002"

composite_rules:
  - id: unofficial-sdk-empty-main-install-hook
    desc: Empty-stub SDK typosquat runs an install hook
    crit: hostile
    conf: 0.9
    scope: archive
    all:
      - id: objectives/supply-chain/impersonation/typosquat::unofficial-sdk-cover-description
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-hook-key
      - id: metadata/lang/javascript-features::module-exports-object

  # The same stub without the "Unofficial <x> SDK" wording. Campaigns vary the
  # cover story freely -- the @wagni_bot crypto-brand set shipped 25 packages
  # described as "SDK for <platform> integration" -- so keying the detection on
  # one phrasing only catches one wave. What does not vary is the structure: a
  # package that ships a placeholder module and a declared entry point, that
  # nevertheless asks npm to execute code at install time, and that names no
  # repository anyone could review. A library with nothing to offer has nothing
  # to run on install; the two together are the name-reservation stage of a
  # supply-chain campaign, published before the payload lands in the next
  # version under the same name and the same already-approved hook.
  #
  # The repository/bin/private/fixture exclusions are what hold the precision:
  # a real package that runs a build step on install declares where its source
  # lives, and a test fixture is not published for anyone to install.
  - id: placeholder-package-runs-install-hook
    desc: Placeholder-module package runs an install hook
    # This is a high-risk publication shape, not hostile behavior on its own.
    # Concrete callback, collection, or execution traits supply the verdict.
    crit: suspicious
    conf: 0.93
    scope: archive
    all:
      - id: metadata/package/quality/empty::tiny-commonjs-exports-object
      - id: metadata/package/manifest/entrypoint::pkg-main-field
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-hook-key
    unless:
      - id: metadata/package/manifest/repository/
      - id: metadata/package/manifest/entrypoint::has-bin-field
      - id: metadata/package/manifest/publishing::is-private
      - id: metadata/package/testing/presence/fixture/
      - id: metadata/package/testing/presence/harness/

  # Tiny skeleton whose only meaningful behavior is an install-time write of a
  # compromise/proof-of-exec beacon under an absolute temp path. No legitimate
  # library of this size needs to touch /tmp from postinstall; the write is the
  # product.
  - id: skeleton-postinstall-tmp-compromise-beacon
    desc: Tiny package postinstall writes temp compromise beacon
    crit: hostile
    conf: 0.97
    attack: "T1195.002,T1564,T1059.007"
    scope: archive
    all:
      - id: metadata/package/manifest/freeform::pkg-skeleton-small
      - id: objectives/supply-chain/install-hook/scripts/postinstall::postinstall-tmp-compromise-beacon
    unless:
      - id: metadata/package/manifest/repository/
      - id: metadata/package/manifest/entrypoint::has-bin-field
      - id: metadata/package/testing/presence/fixture/
      - id: metadata/package/testing/presence/harness/
