defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: "T1195.002"
traits:
  - id: installation-method-deb
    desc: Debian installation method marker
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '"installationMethod"\s*:\s*"deb"'
composite_rules:
  - id: preinstall-package-entrypoints
    desc: Preinstall package also exposes runtime entrypoints
    crit: component
    conf: 0.9
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-preinstall
    any:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-hook-key
      - id: metadata/package/manifest/entrypoint::pkg-main-field
      - id: metadata/package/files/package-json::has-files-field
      - id: metadata/package/manifest/entrypoint::has-bin-field
      - id: metadata/package/manifest/entrypoint::pkg-module-field
  - id: preinstall-package-activity
    desc: Preinstall package exposes install or test activity
    crit: component
    conf: 0.9
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-preinstall
    any:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-install
      - id: metadata/package/manifest/entrypoint::has-exports-field
      - id: metadata/package/testing/presence/manifest::pkg-test-script-field
  - id: preinstall-only-package-surface
    desc: Preinstall package exposes behavior beyond the hook
    crit: component
    conf: 0.9
    any:
      - id: preinstall-package-entrypoints
      - id: preinstall-package-activity
  - id: tiny-preinstall-only-package
    desc: Tiny package with only preinstall
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/package/manifest/freeform::pkg-skeleton-small
      - id: objectives/execution/interpreter/script/npm::npm-preinstall-script
    unless:
      - id: installation-method-deb
  - id: manifest-only-preinstall-package
    desc: Tiny manifest-only package with preinstall
    crit: suspicious
    conf: 0.97
    all:
      - id: tiny-preinstall-only-package
      - id: metadata/package/dependencies/manifest::npm-no-deps-at-all
      - id: objectives/supply-chain/hidden-payload/staging::no-build-script
  - id: manifest-only-preinstall-recon-exfil
    desc: Manifest-only preinstall package exfils host identity
    crit: hostile
    conf: 0.995
    mbc: "E1041"
    all:
      - id: manifest-only-preinstall-package
      - id: objectives/supply-chain/recon-exfil/oast
  # A pure type-definitions package (main → .d.ts) ships no runtime code, so it
  # has nothing to legitimately execute on install. Declaring any lifecycle
  # script in that shape is the Shai-Hulud trojanized-types tell — detectable
  # from package.json alone, so it fires whether the package is loose on disk or
  # inside its tarball (unlike the archive-scoped payload composite).
  - id: types-package-runs-install-hook
    desc: Types-only package executes code on install
    crit: hostile
    conf: 0.97
    mbc: "B0024"
    all:
      - id: metadata/package/manifest/entrypoint::pkg-main-is-dts
    any:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-preinstall
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-postinstall
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-install
    needs: 1

  # Same reasoning one step further out: a package that ships none of the
  # runtime code its own manifest advertises has nothing it could legitimately
  # need to build or configure at install time. When the only code in the
  # archive is the lifecycle hook, running the hook IS the package -- the
  # name-reservation shape, where the name and an already-approved hook are
  # claimed now and the payload lands in a later version under both.
  #
  # The hook is what makes this conviction-grade. A merely broken release is
  # hollow too -- a `prepublishOnly` build that cleaned `dist/` and then failed
  # packs the same empty tree -- but a failed build leaves `scripts` untouched
  # and asks npm to execute nothing, so it cannot reach this rule.
  - id: hollow-package-runs-install-hook
    desc: Package with no shipped runtime code executes an install hook
    crit: hostile
    conf: 0.95
    mbc: "B0024"
    for: [npm, tar, archives]
    scope: archive
    all:
      - id: metadata/package/manifest/entrypoint::declared-runtime-tree-not-shipped
    any:
      # postinstall-hook-declaration, not lifecycle::has-postinstall: the latter
      # carries an `unless: metadata/package/scripts/` directory reference, so
      # any ordinary scripts-block fact silently suppresses it.
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-hook-declaration
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-preinstall
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-install
    needs: 1
    unless:
      # A packaging template in a source tree is not a release. Multi-arch npm
      # wrappers keep a `0.0.0-placeholder` manifest whose `bin/` targets are
      # materialized by the shipped preinstall script, so the declared tree is
      # absent by design and the hook is the documented mechanism, not the
      # payload. A real hollow release carries the version it published under.
      - id: metadata/package/manifest/freeform::npm-release-placeholder-version
      - id: well-known/app/development/deno::source-archive-context
