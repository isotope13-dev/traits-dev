# Does this package run code as a side effect of being installed?
#
# One ecosystem-independent fact, deliberately separated from any judgement
# about what that code does. A setup.py `cmdclass`, an npm pre/post/install
# script and their equivalents are all the same statement: installing this
# package executes something the package chose. Ordinary tooling declares
# install hooks constantly (compiled extensions, husky, patch-package), so on
# its own this is context an analyst wants surfaced, never evidence of attack.
#
# It lives here rather than under a named attack technique because it is the
# shared context leg for all of them: the proof-of-concept, dropper and
# recon-exfil composites each reference it and supply their own payload
# evidence. Filing the bare declaration under one of those directories taught
# the model that every package with a postinstall script looked like that
# specific attack -- it previously sat in install-hook/proof-of-concept/,
# where a vendor namespace-reservation stub whose hook only raises scored as a
# research payload (relocated 2026-09).
defaults:
  platforms: [windows, linux, macos, unix]
  for: [python, javascript, typescript, shell, batch, powershell, ruby, php]
  attack: T1195.002

composite_rules:
  - id: package-install-hook-present
    desc: Package declares install-time code execution
    crit: notable
    conf: 0.9
    any:
      - id: metadata/build/package/recipe::python-install-hook
      - id: objectives/supply-chain/install-hook/scripts/declaration::has-postinstall
      - id: objectives/supply-chain/install-hook/scripts/declaration::has-preinstall
      - id: metadata/package/scripts/lifecycle::has-install-script
