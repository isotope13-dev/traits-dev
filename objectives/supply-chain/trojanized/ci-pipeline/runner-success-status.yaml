defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  # Ordinary CI status publishers are benign. Require independently established
  # runner-memory credential scraping before interpreting success reporting as
  # build-trust abuse. Do not infer that a required check was actually bypassed.
  - id: runner-secret-scraper-success-status
    desc: Runner secret scraper with GitHub success-status POST clues
    crit: hostile
    conf: 0.97
    attack: T1195.002
    all:
      - id: objectives/credential-access/memory::github-runner-process-memory-secret-dump
      - id: micro-behaviors/communications/http/services/github/client::github-api-host
      - id: micro-behaviors/communications/http/services/github/repository::success-commit-status-post-clues
