defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1195.002

composite_rules:
  - id: gitlab-ci-exfil-patch-email-send
    desc: Email send beside GitLab CI exfiltration patch
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: objectives/credential-access/cloud/token/files::gitlab-incoming-email-credential
      - id: metadata/file/format/markup::gitlab-ci-unified-diff-target
      - id: gitlab-ci-pipeline-data-exfil
      - id: micro-behaviors/communications/email/send/smtp::python-smtp-client-and-message-send
      - id: micro-behaviors/communications/email/mime::python-patch-attachment
    any:
      - id: micro-behaviors/communications/email/address::method-issue-email-suffix-rewrite
      - id: micro-behaviors/communications/email/address::php-issue-email-suffix-rewrite
      - id: micro-behaviors/communications/email/address::powershell-issue-email-suffix-rewrite
      - id: micro-behaviors/communications/email/address::sed-issue-email-suffix-rewrite
      - id: micro-behaviors/communications/email/address::gitlab-merge-request-address

  - id: gitlab-ci-pipeline-data-exfil
    desc: GitLab CI patch adds an environment or token upload
    crit: hostile
    conf: 0.98
    for: [text, scripts, source]
    near_lines: 20
    all:
      - id: metadata/file/format/markup::gitlab-ci-unified-diff-target
      - id: metadata/file/format/markup::unified-diff-adds-job-script
      - id: metadata/file/format/markup::unified-diff-adds-url
    any:
      - id: micro-behaviors/communications/http/request/credentials::environment-stdin-curl-command-text
      - id: micro-behaviors/communications/http/request/credentials::curl-ci-token-body-command
