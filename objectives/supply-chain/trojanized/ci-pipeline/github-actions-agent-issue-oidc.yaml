# Agent workflows that an untrusted issue can wake while the job holds an OIDC
# token and an agent secret. This is a CI trust-boundary exposure in an
# otherwise unmodified workflow, so it is placed here rather than under
# build-pipeline, which requires a compromised build.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  attack: T1195.002,T1059

composite_rules:
  - id: public-issue-agent-oidc-action
    desc: Public issue activates agent with OIDC and secret
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/build/ci/trigger::issue-opened-trigger
      - id: metadata/build/ci/agent::workflow-comment-mentions-agent
      - id: metadata/build/ci/agent::workflow-claude-code-action
      - id: metadata/build/ci/permission::id-token-write-permission
      - id: metadata/build/ci/secret::action-secret-input
    # Public issues cannot reach the job when the if: restricts the issue
    # author to owner/member/collaborator. The vendor action's own write-
    # permission check is not visible in the workflow file, so a workflow
    # without that if: gate still fires here; it stays suspicious, not hostile.
    unless:
      - id: metadata/build/ci/gate::event-author-association-gate
