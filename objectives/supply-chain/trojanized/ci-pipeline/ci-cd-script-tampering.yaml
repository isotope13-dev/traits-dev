defaults:
  platforms: [unix]
  for: [shell]
  crit: suspicious
  attack: "T1195.002"
traits:
  - id: pip-bootstrap-lookalike-download
    desc: pip bootstrap URL appears within another URL
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'curl\b.{0,99}(\s-o\s*|\s--output\s+)\S*pip\.pyz\s+https?://\S{0,160}bootstrap\.pypa\.io\S*'
    not:
      - regex: '\shttps://bootstrap\.pypa\.io/pip/pip\.pyz($|\s)'
  - id: sensitive-var-tool-before-pass
    desc: Grep-like tool reads dollar PASS variable
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '(?m)^.{0,200}\b(grep|awk|sed)\b.{0,50}\$[A-Z_]*PASS\b'
    unless:
      - id: well-known/app/infrastructure/pulumi::pulumi-source-tree
  - id: sensitive-var-tool-before-password
    desc: Grep-like tool reads dollar PASSWORD variable
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '(?m)(grep|awk|sed)[^>\n]{0,50}\$[A-Z_]*(PASSWORD|PASSWD)\b'
    not:
      - substr: yourpasswordhere
  - id: sensitive-var-grep-cred
    desc: Grep-like tool reads CRED-named variables
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '(grep|awk|sed).{0,50}CRED'
  - id: sh-curl-process-sub-env
    desc: "Shell downloads code while reading environment"
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?m)^\s*sh\s+<\(curl[^\n]{0,200}(\$\(\s*|\|\s*)(print)?env\b'
    not:
      - substr: codecov.io/env
  - id: gha-curl-python-output
    desc: Downloads Python from secret URL
    crit: notable
    conf: 0.94
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '\bcurl\b.{0,120}\$\{\{\s*secrets\.[A-Z0-9_]+\s*\}\}.{0,120}(-o|--output)\s+\S{1,80}\.py'
  - id: gha-base64-secrets
    desc: GitHub Actions base64 encodes secrets
    crit: suspicious
    conf: 0.95
    for: [github-actions]
    if:
      type: text
      regex: 'run:.{0,80}base64.{0,50}\$\{\{\s*secrets\.'
  - id: gha-head-ref-run
    desc: GitHub head_ref in shell
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '\$\{\{\s*github\.head_ref\s*\}\}'
    unless:
      - id: metadata/build/ci/github-actions::action-testdata-path
  - id: jenkins-shared-library-load
    desc: Jenkins shared library load
    crit: notable
    conf: 0.9
    for: [groovy]
    if:
      type: text
      regex: '@Library\("[A-Za-z0-9_.-]+@[^"]{1,40}"\)'
  - id: jenkins-npm-publish-step
    desc: Jenkins npm publish step
    crit: notable
    conf: 0.9
    for: [groovy]
    if:
      type: text
      substr: "NPM_Publish"
  # ============================================================
  # CI CONFIG FILE PATTERNS
  # ============================================================
  - id: travis-env-curl
    desc: Travis CI with env exfiltration
    crit: suspicious
    conf: 0.9
    if:
      type: text
    # Require env/printenv piped to curl — not "env" inside proxy_env_vars.
      regex: '(script|after_success|before_install)[\s\S]{0,99}\b(env|printenv)\b.{0,20}\|curl'
    unless:
    # Unit tests commonly embed hostile-looking CI strings to verify that
    # sanitizers reject them; those strings are not a live pipeline.
      - id: metadata/package/testing/presence/harness::tests-path-filename
  - id: circleci-env-curl
    desc: CircleCI with env exfiltration
    crit: suspicious
    conf: 0.9
    if:
      type: text
    # Line-oriented CircleCI keys; require env|curl exfil, not prose "command:".
      regex: '(?m)^\s*-?\s*(run|command):.{0,80}\b(env|printenv)\b.{0,20}\|\s*(curl|wget)\b'
  # ============================================================
  # ARTIFACT POISONING
  # ============================================================
  # makefile-basename removed: a bare `basename: Makefile` is the canonical
  # neutral build-file identity (metadata/build/make::makefile-basename); it
  # fires on every Makefile in every source tree and carried no tampering
  # evidence here. The build-download atoms below stay scoped to makefiles.
composite_rules:
  - id: sensitive-var-grep-pass
    desc: Grep-like tool targets password variables
    crit: notable
    conf: 0.75
    any:
      - id: sensitive-var-tool-before-pass
      - id: sensitive-var-tool-before-password
  # === Sensitive Variable Grepping (TOKEN/SECRET) ===
  - id: sensitive-var-grep-key
    desc: Greps for KEY variables
    crit: notable
    conf: 0.75
    any:
      - id: micro-behaviors/os/env/secret-name::shell-text-tool-near-key-name
      - id: micro-behaviors/os/env/secret-name::shell-key-name-near-text-tool
  - id: shell-uploader-pattern
    desc: Bash downloader with environment access
    crit: suspicious
    conf: 0.85
    all:
      - id: sh-curl-process-sub-env
    any:
      - id: 
          micro-behaviors/communications/http/request/credentials/environment::curl-process-substitution-secret-argument
      - id: 
          micro-behaviors/communications/http/request/credentials/environment::curl-process-substitution-credential-argument
  # === Codecov-style Attack ===
  - id: codecov-style-attack
    desc: Codecov-style CI secret exfiltration
    crit: hostile
    conf: 0.98
    attack: "T1552.001"
    mbc: "E1552"
    needs: 2
    any:
      - id: 
          micro-behaviors/communications/http/request/credentials/environment::shell-filtered-env-stdin-http-upload
      - id: metadata/lang/source/syntax/command/options::curl-sensitive-variable-data-syntax
      - id: shell-uploader-pattern
    unless:
      - id: well-known/app/publishing/freefem::freefem-release-script-path
  # === GitHub Actions Secret Theft ===

  - id: gha-secret-python-download-exec
    desc: Runs Python fetched from a secret URL
    crit: suspicious
    conf: 0.9
    for: [github-actions]
    all:
      - id: 
          micro-behaviors/communications/http/request/credentials/ci-credential::curl-actions-secret-reference
      - id: gha-curl-python-output
      - id: metadata/package/scripts/inline::github-actions-python-file
  # Owner-controlled data updaters (proxy lists, mirrors) fetch a private
  # scraper via secret URL and push refreshed data back with GITHUB_TOKEN.
  # That self-update shape is notable automation, not opaque remote exec.
    downgrade:
      all:
        - id: metadata/build/ci/step::github-push-action
        - id: metadata/build/ci/secret::github-token-secret
# Committing the output of a secret-fetched updater back to its own repo is
# normal automation for auto-updated data repos (proxy lists, mirrors); a
# notable supply-chain observation, not a hostile push on its own.
  - id: gha-secret-python-download-push
    desc: Secret-fetched CI code commits to its repo
    crit: notable
    conf: 0.9
    for: [github-actions]
    all:
      - id: gha-secret-python-download-exec
      - id: metadata/build/ci/step::github-push-action
      - id: metadata/build/ci/secret::github-token-secret
  - id: gha-untrusted-shell-injection
    desc: Untrusted GitHub field shell injection
    crit: suspicious
    conf: 0.98
    for: [github-actions]
    attack: "T1059.004, T1195.002"
    any:
      - id: gha-comment-shell-stager
      - id: gha-issue-shell-stager
      - id: gha-pr-shell-stager
      - id: gha-head-ref-shell-stager
# For the four *-shell-stager composites below: the untrusted field and the
# curl|shell must be the SAME command, not merely the same workflow file. Held
# file-wide, any project that both reports a branch name into a webhook payload
# AND separately bootstraps a tool with `curl ... | sh` matched --
# ethersphere/bee's beekeeper.yml prints `github.head_ref` into a Slack
# notification 537 bytes away from an unrelated tunshell debug bootstrap, and
# was reported as a trojanized build pipeline.
  - id: gha-comment-shell-stager
    desc: Comment field executes shell stager
    crit: hostile
    conf: 0.98
    for: [github-actions]
    attack: "T1059.004, T1195.002"
    near_bytes: 200
    all:
      - id: objectives/execution/exploit/command-injection::gha-comment-body-run
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::gha-run-curl-pipe-shell
  - id: gha-comment-body-repository-write
  # Tag-from-comment bots are a common maintainer workflow (e.g. /create tag).
  # Untrusted comment text in the shell remains suspicious via gha-comment-body-run;
  # hostile intent needs a stager such as gha-comment-shell-stager (curl|shell).
    desc: Comment-controlled workflow pushes a git tag
    crit: notable
    conf: 0.9
    for: [github-actions]
    attack: "T1059.004,T1195.002"
    all:
      - id: metadata/build/ci/trigger::issue-comment-trigger
      - id: objectives/execution/exploit/command-injection::gha-comment-body-run
      - id: micro-behaviors/revision-control/git/transfer::github-actions-git-tag-and-push
  - id: gha-issue-shell-stager
    desc: Issue field executes shell stager
    crit: hostile
    conf: 0.98
    for: [github-actions]
    attack: "T1059.004, T1195.002"
    near_bytes: 200
    all:
      - id: objectives/execution/exploit/command-injection::gha-issue-field-run
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::gha-run-curl-pipe-shell
  - id: gha-pr-shell-stager
    desc: PR field executes shell stager
    crit: hostile
    conf: 0.98
    for: [github-actions]
    attack: "T1059.004, T1195.002"
    near_bytes: 200
    all:
      - id: metadata/build/ci/step::github-actions-pr-field-run
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::gha-run-curl-pipe-shell
  - id: gha-head-ref-shell-stager
    desc: head_ref field executes shell stager
    crit: hostile
    conf: 0.97
    for: [github-actions]
    attack: "T1059.004, T1195.002"
    near_bytes: 200
    all:
      - id: gha-head-ref-run
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::gha-run-curl-pipe-shell
  - id: gha-injected-release-pipeline
    desc: Injected GitHub release publishing pipeline
    crit: hostile
    conf: 0.98
    for: [github-actions]
    unless:
      - id: well-known/tool/detection/cert-x-gen::scanner-source-member-context
    all:
      - id: objectives/execution/exploit/command-injection::gha-comment-body-run
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::gha-run-curl-pipe-shell
      - id: metadata/build/ci/step::gha-pypi-action-or-ghcr-reference
  # === CI Config Injection ===
  - id: ci-config-injection
    desc: CI configuration injection attack
    crit: suspicious
    conf: 0.95
    any:
      - id: travis-env-curl
      - id: circleci-env-curl
    unless:
      - id: metadata/package/testing/presence/harness::tests-path-filename
# Both legs are Jenkinsfile Groovy DSL syntax (@Library, NPM_Publish stage);
# the file default's [shell] never applied here.
  - id: jenkins-shared-library-publish
    desc: Jenkins shared library publishes package
    crit: suspicious
    conf: 0.93
    for: [groovy]
    all:
      - id: jenkins-shared-library-load
      - id: jenkins-npm-publish-step
  # === Artifact Poisoning ===
  - id: ci-cd-supply-chain-attack
    desc: CI/CD supply chain attack
    crit: suspicious
    conf: 0.98
    for: [shell, github-actions]
    any:
  # gha-secret-python-download-exec/-push intentionally excluded: opaque
  # secret-URL RCE alone is suspicious, not a confirmed supply-chain attack.
      - id: codecov-style-attack
      - id: objectives/exfiltration/stealer::github-actions-secret-theft
      - id: gha-untrusted-shell-injection
      - id: gha-injected-release-pipeline
      - id: ci-config-injection
  # ============================================================
  # GITHUB ACTIONS INJECTION
  # ============================================================
