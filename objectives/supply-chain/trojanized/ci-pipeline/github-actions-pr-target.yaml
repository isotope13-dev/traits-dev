# GitHub Actions workflow patterns that allow untrusted PR content to
# influence privileged repository workflows. These are generic CI supply-chain
# risks, not Nx-specific indicators.
defaults:
  platforms: [unix, windows]
  for: [github-actions, shell, javascript]
  attack: T1195.002

traits:
- id: gha-pr-title-run-interpolation
  desc: PR title interpolated into shell
  crit: notable
  conf: 0.94
  for: [github-actions]
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: '\$\{\{\s*github\.event\.pull_request\.title\s*\}\}'
  unless:
  - id: metadata/package/testing/presence/path::github-actions-testdata-directory-path
  - id: well-known/tool/detection/code-analysis/semgrep::rule-test-annotation
  - id: metadata/build/ci/step::gh-cli-quoted-pr-title-flag

- id: gha-pr-body-run-interpolation
  desc: PR body interpolated into shell
  crit: notable
  conf: 0.94
  for: [github-actions]
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: '\$\{\{\s*github\.event\.pull_request\.body\s*\}\}'
  unless:
  - id: metadata/package/testing/presence/path::github-actions-testdata-directory-path
  - id: well-known/tool/detection/code-analysis/semgrep::rule-test-annotation
  - id: metadata/build/ci/step::gh-cli-quoted-pr-body-flag

- id: gha-checkout-extraheader-read
  desc: actions checkout extraheader token read
  crit: suspicious
  conf: 0.96
  for: [github-actions, shell]
  if:
    type: text
    regex: 'git\s+config\s+--get-all\s+http\.https://github\.com/\.extraheader'
  unless:
    # Counting header lines to verify configuration is an assertion, not a token read.
    - type: text
      regex: 'git\s+config\s+--get-all\s+http\.https://github\.com/\.extraheader\s*\|\s*wc\b'
    # An existence check whose output goes to /dev/null only uses the exit
    # status (e.g. "use checkout auth if present, else mint our own") and
    # never reads the token value.
    - type: text
      regex: 'git\s+config\s+--get-all\s+http\.https://github\.com/\.extraheader\s*>\s*/dev/null'

- id: gha-curl-extraheader-post--rx-1
  desc: "Matches 'http.https://github.com/.extraheader'"
  crit: notable
  conf: 0.98
  for: [github-actions, shell]
  if:
    type: text
    substr: http.https://github.com/.extraheader
- id: gha-github-script-workspace-require-text
  desc: github-script requires workspace file text
  crit: notable
  conf: 0.92
  for: [github-actions]
  if:
    type: text
    regex: 'actions/github-script[\s\S]{0,900}require\s*\(\s*[''"]?\$\{\{\s*github\.workspace\s*\}\}/'

composite_rules:
- id: gha-github-script-workspace-require
  desc: github-script requires workspace file from untrusted PR checkout
  crit: suspicious
  conf: 0.92
  for: [github-actions]
  # Confused-deputy risk on pull_request_target only when external PR code is checked out.
  all:
    - id: metadata/build/ci/gate::gha-pr-target-external-head-checkout
    - id: gha-github-script-workspace-require-text
- id: gha-pr-target-shell-injection
  for: [githubactions]
  desc: pull_request_target shell injection risk
  crit: suspicious
  conf: 0.98
  unless:
  - id: metadata/build/ci/gate::dependabot-pr-author-gate
  all:
  - id: metadata/build/ci/trigger::pull-request-target-trigger
  any:
  - id: gha-pr-title-run-interpolation
  - id: gha-pr-body-run-interpolation

- id: gha-checkout-token-exfil
  for: [shell, githubactions]
  desc: actions checkout token exfiltration
  crit: hostile
  conf: 0.985
  all:
  - id: gha-checkout-extraheader-read
  any:
  - id: objectives/supply-chain/recon-exfil/secrets/
  - id: micro-behaviors/communications/http/url/endpoint::webhook-site-uuid-path
  - id: objectives/exfiltration/stealer::github-actions-secret-theft
  - id: objectives/exfiltration/stealer::gha-ip-secret-post
  - id: micro-behaviors/communications/http/services/github::github-workflow-dispatch-api
  - id: gha-curl-extraheader-post
  - id: micro-behaviors/communications/url/host/oob::webhook-site

- id: gha-pr-target-checkout-token-theft
  for: [github-actions]
  desc: pull_request_target checkout token theft
  crit: hostile
  conf: 0.99
  all:
  - id: gha-pr-target-shell-injection
  - id: gha-checkout-extraheader-read
  any:
  - id: gha-checkout-token-exfil
  - id: micro-behaviors/communications/url/host/oob::webhook-site
  - id: micro-behaviors/communications/http/services/github::github-workflow-dispatch-api

- id: gha-publish-secret-workspace-script
  for: [githubactions]
  desc: Publish secret reaches workspace script
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/build/ci/trigger::workflow-dispatch-trigger
  - id: metadata/build/ci/secret::node-auth-token-secret-assignment
  - id: gha-github-script-workspace-require-text

- id: gha-dispatch-tokened-publish-exfil
  for: [githubactions]
  desc: Dispatched publish workflow token exfil
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/services/github::github-workflow-dispatch-api
  - id: metadata/build/ci/secret::node-auth-token-secret-assignment
  any:
  - id: objectives/supply-chain/recon-exfil/secrets::secrets-to-webhook
  - id: micro-behaviors/communications/http/request/credentials/ci-credential::secrets-in-http-body
  - id: objectives/exfiltration/stealer::github-actions-secret-theft

- id: gha-bulk-secrets-workflow-exfil
  for: [githubactions]
  desc: GitHub Actions bulk secrets exfil
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/request/credentials/ci-credential::secrets-in-http-body
  - id: objectives/supply-chain/recon-exfil/secrets::secrets-to-webhook
  - id: micro-behaviors/os/env/ci-credentials::complete-secrets-json-expression
  unless:
  - id: well-known/tool/detection/stackrox::stackrox-security-platform
  # A registry credential POSTed to hub.docker.com/v2/users/login is the
  # documented API-token login: the secret goes to the service that issued
  # it, for tag cleanup and repository management. Exfil requires a foreign
  # destination.
  - id: micro-behaviors/communications/http/services/registry::dockerhub-api-token-login
- id: gha-pr-target-encoded-shell-step
  for: [githubactions]
  desc: pull_request_target encoded shell step
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/build/ci/trigger::pull-request-target-trigger
  - id: objectives/anti-static/obfuscation/encoding/base64::base64-decode-exec
- id: gha-oidc-encoded-shell-step
  for: [githubactions]
  desc: OIDC workflow encoded shell step
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/build/ci/permission::id-token-write-permission
  - id: objectives/anti-static/obfuscation/encoding/base64::base64-decode-exec
  unless:
  - id: well-known/tool/detection/oracle-macaron/
- id: gha-pr-target-oidc-encoded-shell
  for: [githubactions]
  desc: pull_request_target OIDC encoded shell
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/build/ci/trigger::pull-request-target-trigger
  - id: metadata/build/ci/permission::id-token-write-permission
  - id: objectives/anti-static/obfuscation/encoding/base64::base64-decode-exec
- id: gha-pr-target-base64-shell-exec
  for: [githubactions]
  desc: pull_request_target base64 shell execution
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/build/ci/trigger::pull-request-target-trigger
  - id: objectives/anti-static/obfuscation/encoding/base64::base64-d-pipe-bash
- id: gha-oidc-base64-shell-exec
  for: [githubactions]
  desc: OIDC workflow base64 shell execution
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/build/ci/permission::id-token-write-permission
  - id: objectives/anti-static/obfuscation/encoding/base64::base64-d-pipe-bash
- id: gha-oidc-base64-decode-exec
  for: [githubactions]
  desc: OIDC workflow base64 decode-exec
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/build/ci/permission::id-token-write-permission
  - id: objectives/anti-static/obfuscation/encoding/base64::base64-decode-exec
  unless:
  - id: metadata/build/ci/step::aws-configure-credentials-action-reference
- id: gha-pr-target-curl-pipe-shell
  for: [githubactions]
  desc: pull_request_target remote shell pipe
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/build/ci/trigger::pull-request-target-trigger
  - id: metadata/build/ci/gate::gha-pr-target-external-head-checkout
  - id: micro-behaviors/process/create/shell/pipeline::workflow-step-fetch-pipe-shell
  unless:
  - id: micro-behaviors/os/package-manager/installer-script::clickhouse-installer-pipe
- id: gha-oidc-curl-pipe-shell
  for: [githubactions]
  desc: OIDC workflow remote shell pipe
  crit: notable
  conf: 0.99
  all:
  - id: metadata/build/ci/permission::id-token-write-permission
  - id: metadata/build/ci/gate::gha-pr-target-external-head-checkout
  - id: micro-behaviors/process/create/shell/pipeline::workflow-step-fetch-pipe-shell
  unless:
  - id: micro-behaviors/os/package-manager/installer-script::clickhouse-installer-pipe
- id: gha-pr-target-python-decoded-exec
  for: [githubactions]
  desc: pull_request_target Python decoded exec
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/build/ci/trigger::pull-request-target-trigger
  - id: objectives/anti-static/obfuscation/multi-layer::inline-python-decoded-exec-loader
- id: gha-oidc-python-decoded-exec
  for: [githubactions]
  desc: OIDC workflow Python decoded exec
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/build/ci/permission::id-token-write-permission
  - id: objectives/anti-static/obfuscation/multi-layer::inline-python-decoded-exec-loader
- id: gha-pr-target-ruby-encoded-eval
  for: [githubactions]
  desc: pull_request_target Ruby encoded eval
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/build/ci/trigger::pull-request-target-trigger
  - id: objectives/anti-static/obfuscation/payload/encoded/exec::inline-ruby-base64-eval
- id: gha-oidc-ruby-encoded-eval
  for: [githubactions]
  desc: OIDC workflow Ruby encoded eval
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/build/ci/permission::id-token-write-permission
  - id: objectives/anti-static/obfuscation/payload/encoded/exec::inline-ruby-base64-eval
- id: gha-curl-extraheader-post
  desc: Curl posts checkout extraheader token
  crit: suspicious
  conf: 0.98
  for: [shell]
  all:
  - id: gha-checkout-extraheader-read
  - id: micro-behaviors/communications/http/curl::curl-command-url-or-option
  any:
  - id: metadata/lang/source/syntax/argument::data-raw-option-text
  - id: gha-curl-extraheader-post--rx-1
