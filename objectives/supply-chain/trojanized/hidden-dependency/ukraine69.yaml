# ukraine69 (MAL-2026-17919): Ukrainian i18n facade wheel; import-time payload
# escapes Hotaru dependency probing and deletes Telegram accounts from vaults.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1531
  for: [whl, pkginfo, python]

traits:
  - id: pkginfo-distribution-name-ukraine69
    desc: PKG-INFO name is ukraine69
    crit: notable
    conf: 0.99
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: ukraine69

composite_rules:
  - id: ukraine69-telegram-destruction-wheel
    desc: ukraine69 wheel deletes Telegram accounts at import
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: objectives/supply-chain/trojanized/hidden-dependency::pkginfo-distribution-name-ukraine69
      - id: objectives/impact/destroy/messaging::import-time-telegram-account-destruction

  - id: ukraine69-hotaru-restart-persistence
    desc: ukraine69 patches Hotaru restart hook for deletion
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: objectives/supply-chain/trojanized/hidden-dependency::pkginfo-distribution-name-ukraine69
      - id: objectives/impact/destroy/messaging::isolated-child-telegram-account-deletion
      - id: micro-behaviors/communications/messaging/telegram::hotaru-restart-hook-marker
