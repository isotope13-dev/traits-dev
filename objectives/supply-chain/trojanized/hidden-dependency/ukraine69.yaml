# ukraine69 (MAL-2026-17919): Ukrainian i18n facade wheel; import-time payload
# escapes Hotaru dependency probing and deletes Telegram accounts from vaults.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1531
  for: [whl, pkginfo, python]

composite_rules:
  - id: ukraine69-telegram-destruction-wheel
    desc: ukraine69 wheel deletes Telegram accounts at import
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/name/identity::ukraine69-pkginfo-name
      - id: objectives/impact/destroy/messaging::module-call-with-telegram-delete-template

  - id: ukraine69-hotaru-restart-persistence
    desc: ukraine69 patches Hotaru restart hook for deletion
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/name/identity::ukraine69-pkginfo-name
      - id: objectives/impact/destroy/messaging::detached-telegram-delete-template
      - id: metadata/lang/source/naming/function/runtime::u69-restart-hook-name-reference
