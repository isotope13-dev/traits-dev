defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  attack: T1195.002,T1059.007,T1105
  mbc: B0024
traits:
- id: lessload-dependency
  desc: Declares lessload remote-code loader dependency
  crit: suspicious
  conf: 0.99
  if:
    type: value
    path: dependencies.lessload
    exists: true
- id: lessload-version-range
  desc: Declares compromised lessload 1.0.1 range
  crit: suspicious
  conf: 0.99
  if:
    type: value
    path: dependencies.lessload
    exact: ^1.0.1
composite_rules:
- id: lessload-loader-carrier
  desc: Package carries compromised lessload loader dependency
  crit: hostile
  conf: 0.995
  all:
  - id: lessload-dependency
  - id: lessload-version-range
- id: easy-day-js-malware-dependency
  desc: easy-day-js install-hook malware dependency
  crit: hostile
  conf: 1.0
  all:
  - id: metadata/package/dependencies/identity::npm-dep-easy-day-js
  - id: metadata/package/dependencies/range::npm-dep-easy-day-js-compromised-range
- id: easy-day-js-hidden-install-carrier
  desc: easy-day-js hidden install dependency
  crit: hostile
  conf: 0.995
  for:
  - npm
  - tar
  - tar.gz
  - package.json
  scope: archive
  all:
  - id: metadata/package/dependencies/identity::npm-dep-easy-day-js
  - id: metadata/package/dependencies/range::npm-dep-easy-day-js-compromised-range
  - id: metadata/package/dependencies/reconciliation::npm-phantom-runtime-dependency
