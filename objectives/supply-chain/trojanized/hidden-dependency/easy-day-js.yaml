defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002
  mbc: B0024

traits:
  # `easy-day-js` is the payload package injected by the June 2026 Mastra
  # scope-takeover as an unused runtime dependency whose postinstall hook
  # runs the attack. Text spelling like the payload-dependency legs in
  # trojanized/library/hidden-dep (the `value` spelling of this same key is
  # the canonical well-known/malware identity, which objectives must not
  # reference).
  - id: easy-day-js-dependency
    desc: Depends on easy-day-js payload
    crit: suspicious
    conf: 0.995
    if:
      type: text
      regex: '"easy-day-js"\s*:'
  # `lessload@1.0.1` is a compromised debugging dependency: its enable path
  # POSTs to a remote endpoint, Base64-decodes the JSON message, and invokes
  # it through a require-enabled Function constructor. The carrier package
  # need only declare the dependency; the loader is in lessload itself.
  - id: lessload-dependency
    desc: Declares lessload remote-code loader dependency
    crit: suspicious
    conf: 0.99
    attack: "T1195.002,T1059.007,T1105"
    if:
      type: value
      path: dependencies.lessload
      exists: true
  - id: lessload-version-range
    desc: Declares compromised lessload 1.0.1 range
    crit: suspicious
    conf: 0.99
    attack: "T1195.002,T1059.007,T1105"
    if:
      type: value
      path: dependencies.lessload
      exact: '^1.0.1'

composite_rules:
  - id: lessload-loader-carrier
    desc: Package carries compromised lessload loader dependency
    crit: hostile
    conf: 0.995
    attack: "T1195.002,T1059.007,T1105"
    all:
      - id: lessload-dependency
      - id: lessload-version-range
