defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  attack: T1195.002,T1059.007,T1105
  mbc: B0024
traits:
  - id: mastra-core-1-42-1-name
    desc: Mastra core package name
    crit: notable
    conf: 1.0
    if:
      type: value
      path: name
      exact: '@mastra/core'
  - id: mastra-core-1-42-1-version
    desc: Mastra core release 1.42.1
    crit: notable
    conf: 1.0
    if:
      type: value
      path: version
      exact: 1.42.1
  - id: mastra-node-speaker-0-1-1-name
    desc: Mastra node-speaker package name
    crit: notable
    conf: 1.0
    if:
      type: value
      path: name
      exact: '@mastra/node-speaker'
  - id: mastra-node-speaker-0-1-1-version
    desc: Mastra node-speaker release 0.1.1
    crit: notable
    conf: 1.0
    if:
      type: value
      path: version
      exact: 0.1.1
  - id: mastra-server-v2-1-1-version
    desc: Mastra server release 2.1.1
    crit: notable
    conf: 1.0
    if:
      type: value
      path: version
      exact: 2.1.1

composite_rules:
- id: mastra-core-1-42-1-easy-day-release
  desc: Compromised Mastra core release carries easy-day-js
  crit: hostile
  conf: 1.0
  for:
  - zip
  - npm
  - tar
  - package.json
  scope: archive
  all:
  - id: mastra-core-1-42-1-name
  - id: mastra-core-1-42-1-version
  - id: easy-day-js-malware-dependency

- id: mastra-node-speaker-0-1-1-easy-day-release
  desc: Compromised Mastra node-speaker release carries easy-day-js
  crit: hostile
  conf: 1.0
  for:
  - zip
  - npm
  - tar
  - package.json
  scope: archive
  all:
  - id: mastra-node-speaker-0-1-1-name
  - id: mastra-node-speaker-0-1-1-version
  - id: easy-day-js-malware-dependency

- id: mastra-server-v2-1-1-easy-day-phantom-injection
  desc: Mastra server 2.1.1 carries a malicious phantom install dependency
  crit: hostile
  conf: 1.0
  for:
  - zip
  - npm
  - tar
  - package.json
  scope: archive
  all:
  - id: well-known/lib/ai/mastra::mastra-server-package-name
  - id: mastra-server-v2-1-1-version
  - id: easy-day-js-malware-dependency
  - id: metadata/package/dependencies/reconciliation::npm-manifest-only-phantom-injection

- id: easy-day-js-phantom-build-injection
  desc: Known malicious dependency added to a mismatched npm build manifest
  crit: hostile
  conf: 0.995
  for:
  - zip
  - npm
  - tar
  - package.json
  scope: archive
  all:
  - id: easy-day-js-malware-dependency
  - id: metadata/package/dependencies/reconciliation::npm-manifest-only-phantom-injection

- id: easy-day-js-malware-dependency
  desc: easy-day-js install-hook malware dependency
  crit: hostile
  conf: 1.0
  all:
  - id: metadata/package/dependencies/declaration::npm-dep-easy-day-js
  - id: metadata/package/dependencies/range::npm-dep-easy-day-js-compromised-range
- id: easy-day-js-hidden-install-carrier
  desc: easy-day-js hidden install dependency
  crit: hostile
  conf: 0.995
  for:
  - npm
  - tar
  - tar.gz
  - package.json
  scope: archive
  all:
  - id: metadata/package/dependencies/declaration::npm-dep-easy-day-js
  - id: metadata/package/dependencies/range::npm-dep-easy-day-js-compromised-range
  - id: metadata/package/dependencies/reconciliation::npm-phantom-runtime-dependency
