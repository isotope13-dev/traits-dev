# A dependency can execute its own build.rs merely by being compiled; the
# carrier never needs to import it. The arrayref / append-only-vec / internment
# compromise used exactly this gap: otherwise unchanged libraries declared and
# locked a proc-macroN digit-squat but never referenced it from Rust source.
# Requiring the technique-level digit-squat composite and excluding source use
# distinguishes a side-effect carrier from code that actually calls a dependency.
defaults:
  platforms: [unix, windows]
  for: [cargo.toml, cargo.lock, rust, crate, tar]
  attack: T1195.002
  mbc: E1195.002

composite_rules:
  - id: cargo-side-effect-digit-squat-carrier
    desc: Crate carries unreferenced proc-macroN digit-squat
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: objectives/supply-chain/impersonation/typosquat::cargo-squat-crate-dependency
    unless:
      - id: objectives/supply-chain/impersonation/typosquat::cargo-proc-macro-squat-source-import
      - id: objectives/supply-chain/impersonation/typosquat::cargo-proc-macro-squat-source-path
