# redteam-qxz7-utils (MAL-2026-5120): quantitative-analysis facade wheel with
# install-hook cloud-token exfil to ngrok in full sdist releases.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1041,T1552
  for: [whl, pkginfo, python, python-sdist]

traits:
  - id: pkginfo-distribution-name-redteam-qxz7-utils
    desc: PKG-INFO name is redteam-qxz7-utils
    crit: notable
    conf: 0.99
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: redteam-qxz7-utils

  - id: ngrok-free-creds-endpoint-literal
    desc: Literal ngrok-free creds collection URL
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: text
      substr: ngrok-free.dev/creds

composite_rules:
  - id: redteam-qxz7-utils-quant-facade-wheel
    desc: redteam-qxz7-utils ships quantitative facade code
    crit: hostile
    conf: 0.98
    scope: archive
    for: [whl, pkginfo, python]
    all:
      - id: objectives/supply-chain/trojanized/hidden-dependency::pkginfo-distribution-name-redteam-qxz7-utils
      - id: metadata/package/description/disclosure::pkginfo-summary-quantitative-analysis-utils
      - id: metadata/package/files/runtime::python-moving-average-helper-facade

  - id: redteam-qxz7-utils-proton-metadata-facade
    desc: redteam-qxz7-utils proton contact quantitative lure
    crit: hostile
    conf: 0.97
    scope: archive
    for: [whl, pkginfo]
    all:
      - id: objectives/supply-chain/trojanized/hidden-dependency::pkginfo-distribution-name-redteam-qxz7-utils
      - id: metadata/package/author/domain::pkginfo-privacy-email-1
      - id: metadata/package/description/disclosure::pkginfo-summary-quantitative-analysis-utils

  - id: redteam-qxz7-utils-install-cloud-token-ngrok-exfil
    desc: redteam-qxz7-utils install exfils cloud creds
    crit: hostile
    conf: 0.99
    scope: archive
    for: [python-sdist, python, pkginfo]
    all:
      - id: objectives/supply-chain/trojanized/hidden-dependency::pkginfo-distribution-name-redteam-qxz7-utils
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: objectives/supply-chain/credential-theft/env::python-cloud-creds
      - id: micro-behaviors/communications/url/host::ngrok-free-domain
    any:
      - id: objectives/supply-chain/trojanized/hidden-dependency::ngrok-free-creds-endpoint-literal
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/communications/http/request/body::python-environment-http-body-flow
