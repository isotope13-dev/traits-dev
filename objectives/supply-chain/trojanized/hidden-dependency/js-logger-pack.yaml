# The logger package is a confirmed malware package. A manifest dependency
# within the affected 1.x range is an install-time supply-chain exposure even
# when the declaring package's own entrypoint is inert.
defaults:
  platforms: [unix, windows]
  attack: T1195.002

composite_rules:
  - id: js-logger-pack-compromised-dependency
    desc: Package declares compromised js-logger-pack releases
    crit: hostile
    conf: 0.99
    scope: archive
    for: [npm, package.json, tar, zip]
    ref: https://osv.dev/vulnerability/MAL-2026-2827
    all:
      - id: metadata/package/dependencies/declaration::npm-js-logger-pack-dependency
      - id: metadata/package/dependencies/declaration::npm-js-logger-pack-compromised-range
