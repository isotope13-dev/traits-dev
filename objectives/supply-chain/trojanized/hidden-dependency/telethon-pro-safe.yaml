# telethon-pro-safe (MAL-2026-4859): telethon typosquat facade wheel; full
# sdist runs obfuscated install-hook RAT and credential exfiltration.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1036,T1059.007,T1041
  for: [whl, pkginfo, python, python-sdist]

traits:
  - id: pkginfo-distribution-name-telethon-pro-safe
    desc: PKG-INFO name is telethon-pro-safe
    crit: notable
    conf: 0.99
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: telethon-pro-safe

composite_rules:
  - id: telethon-pro-safe-stub-client-facade-wheel
    desc: telethon-pro-safe ships stub Telegram clients
    crit: hostile
    conf: 0.98
    scope: archive
    for: [whl, pkginfo, python]
    all:
      - id: objectives/supply-chain/trojanized/hidden-dependency::pkginfo-distribution-name-telethon-pro-safe
      - id: metadata/package/description/disclosure::pkginfo-summary-secure-telegram-client
      - id: metadata/package/files/runtime::python-telethon-pro-safe-stub-clients

  - id: telethon-pro-safe-telethon-team-metadata-facade
    desc: telethon-pro-safe impersonates Telethon security team
    crit: hostile
    conf: 0.97
    scope: archive
    for: [whl, pkginfo]
    all:
      - id: objectives/supply-chain/trojanized/hidden-dependency::pkginfo-distribution-name-telethon-pro-safe
      - id: metadata/package/author/identity::pkginfo-author-telethon-security-team
      - id: metadata/package/description/disclosure::pkginfo-summary-secure-telegram-client

  - id: telethon-pro-safe-obfuscated-install-rat
    desc: telethon-pro-safe install runs obfuscated RAT
    crit: hostile
    conf: 0.99
    scope: archive
    for: [python-sdist, python, pkginfo]
    all:
      - id: objectives/supply-chain/trojanized/hidden-dependency::pkginfo-distribution-name-telethon-pro-safe
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
    any:
      - id: objectives/anti-static/obfuscation/encoding/content::encoded-python-exec
      - id: objectives/anti-static/obfuscation/code-metrics/structure::py-excessive-whitespace-line
