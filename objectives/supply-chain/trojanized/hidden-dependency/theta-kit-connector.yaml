# theta-kit (MAL-2026-5706): mobx store facade that bootstraps theta-connector
# via postinstall/require-time execSync npm install. Corpus builds may ship only
# a dist source map of the decoy library.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1105,T1059.007
  for: [npm, tar, zip, javascript, typescript]

traits:
  - id: npm-basename-theta-kit-package
    desc: Basename matches theta-kit npm tarball
    crit: notable
    conf: 0.98
    for: [npm, tar]
    if:
      type: value
      path: file.basename
      regex: '^theta-kit-'

  - id: theta-connector-require-call
    desc: Requires theta-connector npm package
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: \brequire\s*\(\s*['"]theta-connector['"]\s*\)

  - id: model-resetor-side-effect-call
    desc: Invokes Model.resetor side-effect helper
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: \bresetor\s*\(\s*\)

  - id: execsync-silent-theta-connector-install
    desc: execSync silently installs theta-connector
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      regex: execSync\s*\(\s*['"]npm install theta-connector.{0,80}loglevel silent

composite_rules:
  - id: theta-kit-manifestless-sourcemap-facade
    desc: Manifestless theta-kit ships mobx source map facade
    crit: hostile
    conf: 0.97
    scope: archive
    for: [npm, tar, zip, json, data]
    all:
      - id: metadata/package/entrypoint::runtime-shipped-without-publish-manifest
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: metadata/package/files/runtime::embeds-mobx-history-manager-class
      - id: objectives/supply-chain/trojanized/hidden-dependency::npm-basename-theta-kit-package

  - id: theta-kit-silent-theta-connector-bootstrap
    desc: theta-kit silently installs and runs theta-connector
    crit: hostile
    conf: 0.99
    scope: archive
    for: [npm, tar, zip, package.json, javascript, typescript]
    all:
      - id: objectives/supply-chain/trojanized/hidden-dependency::theta-connector-require-call
      - id: objectives/supply-chain/trojanized/hidden-dependency::model-resetor-side-effect-call
      - id: objectives/supply-chain/impersonation/core-module::public-package-ships-builtin-squat-dependency
    any:
      - id: objectives/supply-chain/trojanized/hidden-dependency::execsync-silent-theta-connector-install
      - id: objectives/supply-chain/hidden-payload/exec/runtime::node-db-connectivity-probe
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script

  - id: theta-kit-manifestless-dist-typings-facade
    desc: Manifestless theta-kit dist typings without bundle
    crit: hostile
    conf: 0.96
    scope: archive
    for: [npm, tar, zip, typescript, data, json]
    all:
      - id: metadata/package/entrypoint::runtime-shipped-without-publish-manifest
      - id: metadata/package/files/runtime::embeds-mobx-history-manager-class
      - id: metadata/package/files/runtime::javascript-dist-tree-artifact
      - id: objectives/supply-chain/trojanized/hidden-dependency::npm-basename-theta-kit-package
