# async-mutex-lock 5.3.1 is a malicious npm package masquerading as a mutex
# utility (OSV MAL-2026-12513). Its loader fetches JavaScript from a bare-IP
# HTTPS endpoint and evaluates the response with require, process, and Buffer.
# The fetched second stage provides socket-controlled file discovery and upload.
defaults:
  conf: 1.0
  platforms: [unix, windows]
  attack: T1195.002

traits:
  - id: async-mutex-lock-compromised-async-mutex-lock-runtime-pin
    desc: Pins malicious async-mutex-lock release
    crit: suspicious
    for: [package.json]
    if:
      type: value
      path: dependencies.async-mutex-lock
      regex: '^[~^]?5\.3\.1$'

  - id: async-mutex-lock-runtime-import
    desc: Imports malicious async-mutex-lock package
    crit: notable
    for: [javascript, typescript]
    if:
      type: import
      exact: async-mutex-lock

composite_rules:
  - id: async-mutex-lock-compromised-async-mutex-lock-runtime-consumer
    desc: Project loads malicious async-mutex-lock release
    crit: hostile
    scope: archive
    for: [npm, tar, package.json, javascript]
    all:
      - id: async-mutex-lock-compromised-async-mutex-lock-runtime-pin
      - id: async-mutex-lock-runtime-import

  - id: async-mutex-lock-loader-invocation
    desc: Invokes malicious async-mutex-lock binding
    crit: suspicious
    for: [javascript, typescript]
    all:
      - id: async-mutex-lock-runtime-import
      - id: micro-behaviors/process/sync/mutex::javascript-mutex-call
