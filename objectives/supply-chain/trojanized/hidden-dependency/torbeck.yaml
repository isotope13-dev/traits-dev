defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript, typescript]
  attack: T1195.002

traits:
  - id: torbeck-datastructures-js-upstream-repository
    desc: Claims datastructures-js upstream repository
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com[/:]datastructures-js/'

  - id: torbeck-datastructures-js-dependency-redirect
    desc: Redirects datastructures-js dep to Torbeck
    crit: suspicious
    conf: 0.995
    for: [package.json]
    if:
      type: text
      regex: '"@datastructures-js/.{1,80}"\s*:\s*"npm:@torbeck/'
