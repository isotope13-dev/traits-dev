# colorinal 0.1.7 ships a native loader and a Python module that deletes its
# own source. A package that both declares this dependency and imports it at
# runtime pulls that behavior into the consuming package's import path.
defaults:
  platforms: [unix, windows]
  for: [zip, whl, python_sdist, tar, pkginfo, python]

composite_rules:
  - id: pypi-imports-colorinal-native-loader
    desc: Package imports known self-deleting colorinal dependency
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/dependencies/declaration::pkginfo-requires-colorinal
      - id: metadata/import/package::python-known-malicious-colorinal-import
