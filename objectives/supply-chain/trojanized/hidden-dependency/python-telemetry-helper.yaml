defaults:
  platforms: [unix, windows]
  for: [whl, python-sdist]
  attack: T1195.002,T1059.006
  mbc: B0024

composite_rules:
  - id: python-installs-malicious-telemetry-helper
    desc: Python package installs a known malicious dependency
    crit: hostile
    conf: 0.99
    for: [whl, python-sdist, pkginfo]
    scope: archive
    all:
      - id: python-env-validator-tool-name
      - id: metadata/package/dependencies/declaration::pypi-telemetry-helper-dependency

traits:
  - id: python-env-validator-tool-name
    desc: PyPI package name is env-validator-tool
    crit: notable
    conf: 0.99
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: env-validator-tool
