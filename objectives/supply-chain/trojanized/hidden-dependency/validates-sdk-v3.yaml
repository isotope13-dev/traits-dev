# @validates-sdk/v3 1.22.17 ships a file collector disguised as validation.
# These ranges include the observed compromised release; the resolved version
# must still be checked when assessing an installed dependency tree.
defaults:
  platforms: [unix, windows]
  attack: T1195.002

traits:
  - id: validates-sdk-v3-range-includes-collector
    desc: Range includes compromised validates release
    crit: suspicious
    conf: 0.98
    for:
    - package.json
    if:
      type: value
      path: dependencies.@validates-sdk/v3
      regex: ^(\^1\.22\.1[67]|1\.22\.17)$

  - id: validates-sdk-v3-import
    desc: Imports validates SDK runtime
    crit: notable
    conf: 1.0
    for: [javascript, typescript]
    if:
      type: import
      exact: '@validates-sdk/v3'

composite_rules:
  - id: validates-sdk-v3-collector-consumer
    desc: SDK imports dependency range containing a file collector
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: validates-sdk-v3-range-includes-collector
      - id: validates-sdk-v3-import
