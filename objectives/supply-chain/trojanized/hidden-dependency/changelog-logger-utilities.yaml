# changelog-logger-utilities 1.0.0 is a credential stealer. A wrapper that
# installs and imports it delivers the compromised runtime into consumers.
defaults:
  conf: 0.995
  platforms: [unix, windows]
  attack: T1195.002,T1041
traits:
  - id: changelog-logger-utilities-compromised-dependency
    desc: Declares compromised changelog logger dependency
    crit: notable
    for: [package.json]
    if:
      type: value
      path: dependencies.changelog-logger-utilities
      regex: '(^|[<>=~^*| ])1\.'
  - id: changelog-logger-utilities-runtime-import
    desc: Imports compromised changelog logger package
    crit: notable
    for: [javascript, typescript]
    if:
      type: import
      exact: changelog-logger-utilities
composite_rules:
  - id: changelog-logger-utilities-compromised-runtime-consumer
    desc: Package installs and loads the changelog-logger-utilities stealer
    crit: hostile
    scope: archive
    for: [npm, package.json, javascript, typescript, zip, tar]
    all:
      - id: changelog-logger-utilities-compromised-dependency
      - id: changelog-logger-utilities-runtime-import
