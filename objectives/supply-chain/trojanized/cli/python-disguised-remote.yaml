defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1041

composite_rules:
  - id: python-disguised-remote-cli-backdoor
    desc: Disguised Python CLI migrates legacy config
    crit: hostile
    conf: 0.98
    scope: file
    near_lines: 512
    all:
      - id: micro-behaviors/fs/path/config/app::verity-fpeek-legacy-config-migration
      - id: micro-behaviors/communications/http/url/telemetry::python-cli-init-api-path
      - id: micro-behaviors/communications/http/url/telemetry::python-cli-upload-api-path
    unless:
      - id: objectives/exfiltration/http/upload::python-cli-folder-multipart-exfil
      - id: objectives/supply-chain/recon-exfil/callback::python-cli-init-host-registration
