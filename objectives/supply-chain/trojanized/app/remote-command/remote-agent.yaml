defaults:
  platforms: [windows, unix]
  for: [npm, package.json, javascript, pe, dll]
  attack: T1195.002

traits:
  - id: startup-remote-plugin-clone
    desc: Startup clones remote plugin repository
    crit: suspicious
    conf: 0.97
    for: [javascript]
    if:
      type: text
      regex: 'execAsync\(\s*`git\s+clone\s+\$\{REPO_URL\}'

  # Only the command is matched, not what it pulls: a self-updating app runs
  # the same `git pull --ff-only` on its own checkout. The plugin-injection
  # verdict comes from the composite below, which pairs it with the clone, the
  # plugin registry file and the enabled-plugins setting.
  - id: exec-async-git-pull-ff-only
    desc: Runs git pull fast-forward via execAsync
    crit: notable
    conf: 0.96
    for: [javascript]
    if:
      type: text
      regex: 'execAsync\(\s*["'']git\s+pull\s+--ff-only["'']'

composite_rules:
  - id: document-brand-lure-rmm-agent
    desc: RMM agent delivered as branded invoice installer
    crit: hostile
    conf: 0.99
    for: [oledoc]
    attack: "T1195.002,T1036.007,T1219"
    all:
      - id: metadata/package/files/msi::msi-business-document-name
      - id: metadata/package/files/msi::msi-adobe-acrobat-branded-basename
      - id: objectives/command-and-control/backdoor/control/rmm::remote-management-agent-msi-package

  - id: npm-startup-plugin-websocket-backdoor
    for: [npm, package.json, javascript, pe, dll, json]
    desc: Startup plugin embeds WebSocket skill-control backdoor
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: metadata/package/freeform::openclaw-package-field
      - id: metadata/permission/activation::plugin-startup-activation
      - id: objectives/command-and-control/backdoor/dispatch/websocket::node-websocket-agent-skill-control


  - id: npm-startup-mutable-plugin-injection
    desc: npm startup installs and enables mutable plugin
    crit: hostile
    conf: 0.99
    scope: archive
    attack: T1195.002,T1105
    all:
      - id: startup-remote-plugin-clone
      - id: exec-async-git-pull-ff-only
      - id: micro-behaviors/fs/path/agent-config/file::ai-plugin-registry-files
      - id: "metadata/lang/source/syntax/assignment::enabled-plugins-setting"

  - id: npm-runtime-executable-dropper
    desc: npm package runtime fetches and executes an executable in System32
    crit: hostile
    conf: 0.99
    for: [npm, javascript, package.json]
    scope: archive
    attack: "T1195.002,T1105,T1059.007"
    all:
      - id: objectives/evasion/masquerade/path::windows-system-directory-fetch-write-exec
      - id: metadata/filename/identity::package-json-basename
