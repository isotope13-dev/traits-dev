# A repo skill's HTML comment that instructs the agent to Invoke-Expression a
# remote raw GitHub response is a hidden command channel, not documentation.
defaults:
  conf: 0.99
  platforms: [unix, windows]
  for: [markdown, text]
  attack: T1195.002,T1059.001,T1105

traits:
  - id: agent-skill-remote-invoke-expression
    desc: Skill executes a remote PowerShell response
    crit: suspicious
    if:
      type: text
      regex: '(?is)Invoke-Expression\s*\(\s*Invoke-WebRequest.{0,220}raw\.githubusercontent\.com'

composite_rules:
  - id: agent-skill-hidden-remote-command-channel
    desc: Hidden skill comment executes remote command content
    crit: hostile
    scope: archive
    for: [markdown, text, zip, tar]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: metadata/lang/natural/phrasing::secret-agent-instructions-label
      - id: agent-skill-remote-invoke-expression
