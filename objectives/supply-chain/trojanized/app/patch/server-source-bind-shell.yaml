# A recognized network server's source release that also contains bind-shell
# code -- listen, dup2 onto the socket, exec a shell -- has been trojaned:
# no FTP, SSH or DNS server ships a root shell listener. vsftpd 2.3.4 (2011)
# was replaced on its master site by a tarball whose str.c answered a ":)"
# username by binding /bin/sh to port 6200.
defaults:
  platforms: [unix]
  attack: T1195.002
composite_rules:
  - id: recognized-server-source-release-bind-shell
    desc: Recognized network-server source release carries a bind shell
    crit: hostile
    conf: 0.95
    for: [tar, zip, c]
    scope: archive
    all:
      - id: well-known/app/network/
      - id: objectives/command-and-control/backdoor/bind-shell::posix-bind-shell-source
