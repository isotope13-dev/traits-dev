defaults:
  conf: 0.95
  platforms:
  - windows
  - unix
  for:
  - javascript
  - shell
traits:
- id: electron-app-tampering--rx-1
  desc: Electron resource write or permission change
  crit: notable
  if:
    type: text
    regex: (?i)(resources/app[^a-z0-9_-]|app\.asar).{0,50}\b(write|chmod)\b
- id: electron-app-tampering--rx-2
  desc: Electron application resource append or copy
  crit: notable
  if:
    type: text
    regex: (?i)(resources/app[^a-z0-9_-]|app\.asar).{0,50}\b(append|copy)\b
  not:
  - regex: (?i)\b(the|a|an|this|that|these|those|its|their|your)\s+(\w+\s+)?copy\b
  - regex: (?i)(resources/app[^a-z0-9_-]|app\.asar)\s+copy\b
- id: electron-app-tampering--rx-3
  desc: Electron application resource move or removal
  crit: notable
  if:
    type: text
    regex: (?i)(resources/app[^a-z0-9_-]|app\.asar).{0,50}\b(mv|rm)\b
- id: electron-app-tampering--rx-4
  desc: Electron application resource directory creation
  crit: notable
  if:
    type: text
    regex: (?i)(resources/app[^a-z0-9_-]|app\.asar).{0,50}\b(mkdir)\b
composite_rules:
- id: electron-app-tampering
  desc: Attempts to modify Electron core files
  crit: suspicious
  any:
  - id: electron-app-tampering--rx-1
  - id: electron-app-tampering--rx-2
  - id: electron-app-tampering--rx-3
  - id: electron-app-tampering--rx-4
  downgrade:
    scope: archive
    any:
    - id: metadata/build/package/recipe/gentoo::gentoo-ebuild-recipe
    - id: well-known/app/development/vscode-vibrancy::vibrancy-extension
  unless:
  - id: well-known/app/ai/media/pinokio::app-bundle
  - id: metadata/path::test-directory-component
