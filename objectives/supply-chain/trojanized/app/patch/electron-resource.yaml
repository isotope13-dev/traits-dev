# Electron Application Trojanization
# Detects tampering with core Electron application files.
defaults:
  conf: 0.95
  platforms: [windows, unix]
  for: [javascript, shell]
# Both halves of each matcher are anchored. Unanchored, `resources/app` matched
# the prefix of `resources/apparmor-profile` and the bare `rm` alternative
# matched the letters inside `appa`rm`or` -- so electron-builder's stock Debian
# postinst, which installs an AppArmor profile, read as Electron trojanization.
# The path token must end at a non-name character and the operation must be a
# whole word. `Contents/Resources/app` needs no alternative of its own: it ends
# in `Resources/app`, which the case-insensitive `resources/app` already covers.
traits:
- id: electron-app-tampering--rx-1
  desc: Electron resource write or permission change
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)(resources/app[^a-z0-9_-]|app\.asar).{0,50}\b(write|chmod)\b'
- id: electron-app-tampering--rx-2
  desc: Electron application resource append or copy
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)(resources/app[^a-z0-9_-]|app\.asar).{0,50}\b(append|copy)\b'
- id: electron-app-tampering--rx-3
  desc: Electron application resource move or removal
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)(resources/app[^a-z0-9_-]|app\.asar).{0,50}\b(mv|rm)\b'
- id: electron-app-tampering--rx-4
  desc: Electron application resource directory creation
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)(resources/app[^a-z0-9_-]|app\.asar).{0,50}\b(mkdir)\b'
composite_rules:
- id: electron-app-tampering
  desc: Attempts to modify Electron core files
  crit: suspicious
  conf: 0.95
  any:
  - id: electron-app-tampering--rx-1
  - id: electron-app-tampering--rx-2
  - id: electron-app-tampering--rx-3
  - id: electron-app-tampering--rx-4
  downgrade:
    any:
      - id: metadata/build/package/recipe::gentoo-ebuild-recipe
  unless:
    # Pinokio's updater deliberately manages its bundled Electron resources.
    - id: well-known/app/ai/media/pinokio::app-bundle
