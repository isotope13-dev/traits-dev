# Electron app.asar trojanizer that copies staged/shellcode scripts into an
# extracted tree, hijacks package.json "main", and repacks the archive.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  attack: T1195.002,T1554
  mbc: B0024

traits:
  - id: package-main-entrypoint-assign
    desc: Reassigns package.json main entrypoint
    crit: notable
    conf: 0.85
    if:
      type: text
      exclude_comments: true
      regex: '\b(pkg|packageJson|manifest)\.main\s*=[^=]'

  - id: shellcode-js-filename-literal
    desc: References shellcode.js script filename
    crit: notable
    conf: 0.92
    if:
      type: literal
      regex: '(?i)(^|[/\\])shellcode\.js$'

  - id: payload-stage-path-join
    desc: Joins payload directory with stage script
    crit: notable
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      regex: '[''"]payload[''"]\s*,\s*[''"]stage[^''"\r\n]{0,24}\.js[''"]'

composite_rules:
  - id: electron-asar-backdoor-patcher
    desc: Repacks Electron ASAR with staged payload and hijacked main entrypoint
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/archive/create/asar::asar-pack
      - id: micro-behaviors/fs/path/package-manager::package-json-path-join
      - id: package-main-entrypoint-assign
      - id: micro-behaviors/fs/write/file/content::js-file-write
      - id: micro-behaviors/fs/file/copy/call::fs-copy
    any:
      - id: shellcode-js-filename-literal
      - id: payload-stage-path-join
