defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: http-handler-whitespace-hidden-blockchain-stage
    desc: HTTP response handler contains a whitespace-concealed blockchain stage loader
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1027
    all:
      - id: micro-behaviors/communications/http/response/call::server-response-json-body
      - id: metadata/file/line::long-inline-whitespace-run
    # Both transaction fields can carry the stage host bytes. Keep the
    # response-handler and concealment roles mandatory for either resolver.
    any:
      - id: objectives/command-and-control/channel/deaddrop/blockchain::obfuscated-ethereum-recipient-stage-rendezvous
      - id: objectives/command-and-control/channel/deaddrop/blockchain::obfuscated-ethereum-value-stage-rendezvous
