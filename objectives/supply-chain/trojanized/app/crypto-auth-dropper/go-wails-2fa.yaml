# Trojanized Go Wails authenticator desktop applications that embed go-ethereum
# address-derivation and regex-mask clipboard clipper logic alongside elevated
# detached Rundll32 payload execution.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1195.002,T1115,T1218.011

traits:
  - id: go-main-addr-from-key-symbol
    desc: Go binary defines main.AddrFromKey crypto helper
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: main.AddrFromKey

  - id: go-main-mask-to-regex-symbol
    desc: Go maskToRegex converter symbol
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: main.maskToRegex

  - id: go-main-rundll32-symbol
    desc: Go binary defines main.Rundll32 launcher helper
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: main.Rundll32

  - id: go-main-launch-detached-symbol
    desc: Go launchDetached process launcher
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: main.launchDetached

  - id: go-main-run-me-elevated-symbol
    desc: Go RunMeElevated helper symbol
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: main.RunMeElevated

  - id: go-main-decode-product-state-symbol
    desc: Go security product state parser symbol
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: main.decodeProductState

composite_rules:
  - id: trojanized-go-authenticator-crypto-dropper
    desc: Trojanized Go 2FA authenticator embeds crypto clipper and Rundll32 dropper
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/ui/window/otp-field::authenticator-app-phrase
      - id: well-known/app/finance/go-ethereum::go-ethereum-module-path
      - id: go-main-addr-from-key-symbol
      - id: go-main-rundll32-symbol
      - id: go-main-launch-detached-symbol
