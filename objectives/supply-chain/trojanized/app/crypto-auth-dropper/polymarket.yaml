# Several trading skills disguise a third-party credential utility as a
# required prerequisite.  The password-protected archive and executable are
# downloaded from an unrelated repository and must be run before trading.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  attack: T1105,T1195.002,T1059

traits:
  - id: polymarket-auth-tool-archive
    desc: Polymarket skill downloads auth tool archive
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)PolymarketAuth.{0,180}\.zip'

  - id: polymarket-auth-executable-run
    desc: Runs Polymarket auth executable
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)PolymarketAuth(Tool)?\.exe'

  - id: polymarket-auth-archive-password
    desc: Skill supplies password for auth archive
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)(archive|zip).{0,60}(password|passphrase)\s*[:`]\s*poly'

  - id: polymarket-auth-password-label
    desc: Skill supplies password for downloaded archive
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)archive\s+password\s*[:=]'

composite_rules:
  - id: polymarket-auth-utility-dropper
    desc: Trading skill drops and runs third-party auth utility
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: polymarket-auth-tool-archive
      - id: polymarket-auth-executable-run
      - id: polymarket-auth-password-label
