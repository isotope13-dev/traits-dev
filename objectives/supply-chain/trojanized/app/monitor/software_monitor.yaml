defaults:
  platforms: [windows, macos]
  for: [pe, macho]
  crit: hostile
  conf: 0.95

traits:
  - id: installer-helper-utility-basename
    desc: Installer helper utility basename
    crit: notable
    conf: 0.85
    if:
      type: path
      basename: true
      regex: '(?i)^(DLL|Uninstal|Zip32)\.(exe|SFX)$'
# Three traits were retired from this file: `putty-identity-string`,
# `putty-crypto-library-marker` and `bundled-admin-tool-identity`.
#
# `putty-identity-string` was a bare `substr: PuTTY` at notable -- a second
# spelling of the canonical metadata/file/string/application-name::tool-identity-putty,
# so one fact became two ML features, and filing "this file mentions PuTTY"
# under trojanized/app/ made a neutral name reference read as evidence of
# trojanization.
#
# `putty-crypto-library-marker` then paired that name with any PBKDF2 reference
# and reported "PuTTY crypto implementation". Its legs cannot show that: the
# name is also the PPK key format, which node-forge, sshpk and ssh2 emit from a
# `privateKeyToPutty()` helper. The Amp CLI is the counter-example -- a
# Bun-compiled AI coding agent that bundles node-forge and gets pbkdf2 from
# Bun's crypto module was reported as carrying PuTTY's crypto.
#
# `bundled-admin-tool-identity` was its only consumer and had no consumers of
# its own, so the chain's whole output was that one overclaiming notable. No
# live detection depended on any of it; the canonical name atom keeps serving
# its three real consumers elsewhere in the tree.
composite_rules:
  - id: trojanized-system-utility-dropper
    desc: Trojanized system utility or hardware monitor dropper
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/file/string/application-name::trusted-tool-impersonator-context
    any:
      - id: suspicious-installer-behavior
      - id: brand-confusion-identity-anomaly
      - id: low-integrity-installer-packaging
    unless:
      - id: metadata/binary/installer/sfx/
      - id: metadata/signed/unknown::bitdefender-srl
      - id: metadata/signed/unknown::valve-corp.
      - id: metadata/binary/installer/script/
      - id: installer-helper-utility-basename
      - id: well-known/lib/platform/wine/
      - id: well-known/app/storage/syncback::syncback-backup-benign-context
      - id: well-known/app/storage/syncback::syncback-shell-ext-benign-context
      # An archiver naming other archivers is not impersonating one: PeaZip
      # mentions WinRAR because it reads RAR archives, and the
      # `suspicious-installer-behavior` leg it pairs with is PBKDF2 (7z/ZIP AES
      # encryption) plus a COM SafeArray (shell integration). Its own identity
      # composite -- product name, company and description together -- is
      # already established elsewhere in the tree.
      - id: well-known/app/storage/peazip::peazip-main-executable

  - id: suspicious-installer-behavior
    desc: Installer with anomalous execution capabilities
    crit: component
    conf: 0.95
    needs: 2
    any:
      - id: micro-behaviors/os/com/array::safearray-put-element
      - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2
      - id: metadata/binary/installer/script::inno-password-canary
      - id: metadata/binary/installer/script::inno-bcrypt-random
    unless:
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/signed/platform/

  - id: brand-confusion-identity-anomaly
    desc: High-trust identity with branding or structural inconsistencies
    crit: suspicious
    conf: 0.95
    any:
      - id: objectives/evasion/masquerade/brand/product::brand-confusion-cpuid-hwinfo
      - id: objectives/evasion/masquerade/brand/product::brand-confusion-cpuid-mismatch
    unless:
      - id: metadata/signed/leaf::microsoft-corporation

  - id: low-integrity-installer-packaging
    for: [pe]
    desc: High-trust tool delivered via low-integrity packaging
    crit: component
    conf: 0.9
    all:
      - id: metadata/binary/layout/overlay::has-overlay
    any:
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
      - id: metadata/signed/trust-level::unsigned-pe-executable
      - id: metadata/binary/section/label::suspicious-reloc-section
    unless:
      - id: metadata/binary/layout/ratio::pe-signature-present
      - id: metadata/signed/unknown::open-source-developer-martin-tofall
