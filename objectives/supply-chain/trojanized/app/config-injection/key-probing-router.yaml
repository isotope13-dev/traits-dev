defaults:
  platforms: [unix, windows]
  for: [npm, javascript, typescript]

composite_rules:
  - id: credential-probing-ai-gateway-rewrite
    desc: Key-probing package rewrites AI gateway config
    crit: hostile
    conf: 0.95
    scope: archive
    # The hostile credential-probe implementation is required. A disclosed
    # gateway installer or an API URL assignment alone cannot convict.
    # Distinct added behavior: persisting a replacement provider URL and key
    # alongside the existing-key probe, redirecting subsequent agent use.
    all:
      - id: objectives/exfiltration/stealer/credential/value/token::ai-key-probe-before-origin-verification
      - id: micro-behaviors/os/env/ai-provider::js-anthropic-base-url-assignment
      - id: micro-behaviors/os/env/ai-provider::js-anthropic-api-key-assignment
      - id: micro-behaviors/fs/write/file/full::json-stringify-write-sync
