defaults:
  platforms: [unix, windows]
  for: [markdown, text, shell, python, javascript, typescript, go, ruby]
  attack: T1195.002

traits:
  - id: global-agent-rules-document
    desc: Packaged global agent rules document
    crit: notable
    conf: 0.96
    for: [markdown]
    if:
      type: text
      regex: '(?m)^# Global Agent Operating Rules\s*$'

  - id: agent-block-marker-code
    desc: Global agent block marker in code
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: text
      word: AGENTS_BLOCK_START

  - id: agent-block-rewrite-helper
    desc: Global agent block rewrite helper
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: text
      word: ownedAgentsText

  - id: agent-path-atomic-write
    desc: Atomic write to global agent path
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: text
      substr: 'writeAtomic(agentsPath)'

  - id: pr-template-agent-rules-checklist
    desc: PR template enforces agent rules
    crit: notable
    conf: 0.94
    ref: sha256:9a9053d392771d26bd2bb934b7796f8945487c8e864072c181c1e7bd6828f745
    if:
      type: text
      regex: 'Engineering rules checklist[\s\S]{0,120}AGENTS\.md'
      case_insensitive: true

  - id: pr-template-no-ai-attribution
    desc: PR template forbids AI attribution
    crit: notable
    conf: 0.92
    ref: sha256:9a9053d392771d26bd2bb934b7796f8945487c8e864072c181c1e7bd6828f745
    if:
      type: text
      substr: "Commit messages are imperative, no AI attribution"
      case_insensitive: true

composite_rules:
  - id: writes-global-agent-rules
    desc: Package writes rules to global AGENTS.md
    crit: suspicious
    conf: 0.98
    for: [javascript]
    near_lines: 200
    all:
      - id: agent-block-marker-code
      - id: agent-block-rewrite-helper
      - id: agent-path-atomic-write

  - id: package-global-agent-rules-install
    desc: Package installs its rules into a global agent file
    crit: suspicious
    conf: 0.98
    scope: archive
    for: [javascript, npm, tar, markdown]
    all:
      - id: global-agent-rules-document
      - id: writes-global-agent-rules

  - id: packaged-agent-rules-with-attribution-suppression
    for: [documents, scripts, source, npm, tar]
    desc: Package carries agent rules suppressing AI attribution
    crit: suspicious
    conf: 0.94
    scope: archive
    ref: sha256:9a9053d392771d26bd2bb934b7796f8945487c8e864072c181c1e7bd6828f745
    all:
      - id: metadata/package/agent-skill::agent-instructions-md-basename
      - id: metadata/package/documentation/agent-policy::repo-agent-rules-apply-every-change
      - id: metadata/package/documentation/claims::no-ai-attribution-wording
    any:
      - id: metadata/package/documentation/agent-policy::repo-agent-rules-reject-violations
      - id: metadata/package/documentation/agent-policy::repo-agent-rules-fix-existing-violations

  - id: claude-bridge-to-repo-agent-policy
    for: [documents, scripts, source, npm, tar]
    desc: Claude guidance bridges to repository agent policy
    crit: suspicious
    conf: 0.92
    scope: archive
    ref: sha256:9a9053d392771d26bd2bb934b7796f8945487c8e864072c181c1e7bd6828f745
    all:
      - id: metadata/package/config::claude-guidance-delegates-agents-md
      - id: metadata/package/documentation/agent-policy::repo-agent-rules-apply-every-change
      - id: metadata/package/documentation/claims::no-ai-attribution-wording
  - id: pr-template-enforces-agent-policy
    for: [documents, scripts, source, npm, tar]
    desc: PR template enforces hidden agent policy
    crit: suspicious
    conf: 0.93
    scope: archive
    ref: sha256:9a9053d392771d26bd2bb934b7796f8945487c8e864072c181c1e7bd6828f745
    all:
      - id: pr-template-agent-rules-checklist
      - id: pr-template-no-ai-attribution
    any:
      - id: metadata/package/documentation/agent-policy::repo-agent-rules-apply-every-change
      - id: metadata/package/agent-skill::agent-instructions-md-basename

