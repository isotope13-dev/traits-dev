defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002

traits:
  - id: claude-home-config-target
    desc: Targets Claude home configuration
    crit: component
    conf: 0.96
    if:
      type: text
      regex: 'Path\.home\(\)\s*/\s*["'']\.claude["'']'

  - id: cursor-workspace-config-target
    desc: Targets Cursor workspace configuration
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\bworkspace\s*/\s*["'']\.cursor["'']'

  - id: github-workspace-config-target
    desc: Targets GitHub workspace configuration
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\bworkspace\s*/\s*["'']\.github["'']'

composite_rules:
  - id: multi-tool-agent-config-targets
    desc: Multiple AI tool configuration targets
    crit: component
    conf: 0.96
    needs: 2
    any:
      - id: claude-home-config-target
      - id: cursor-workspace-config-target
      - id: github-workspace-config-target

  # Writing opt-in editor/agent configuration from an explicit CLI is normal
  # setup behavior. Treat the same multi-tool copy as supply-chain injection
  # only when it executes as a Python import side effect.
  - id: python-import-time-ai-tool-config-injection
    desc: Import-time copy of instructions into multiple AI tool configs
    crit: hostile
    conf: 0.98
    all:
      - id: multi-tool-agent-config-targets
      - id: micro-behaviors/fs/file/copy::shutil-copy
      - id: micro-behaviors/fs/path/application/config::agent-instruction-path-literal
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
