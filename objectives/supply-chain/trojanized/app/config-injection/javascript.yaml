defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1195.002
traits:
- id: postcss-tailwind-eval-atob-payload
  desc: Build config eval-atob payload
  crit: suspicious
  conf: 0.98
  mbc: E1059
  if:
    type: text
    regex: '(tailwindcss|autoprefixer)\s*:[\s\S]{0,260}eval\(\s*atob\s*\('
  unless:
  - id: metadata/package/testing/
# NOTE: export syntax is neutral JavaScript and is not needed to identify this
# attack. The malicious tail is commonly appended after the legitimate config
# has already closed, so an export-to-payload proximity gate misses the exact
# concealment technique this rule is meant to catch.
- id: cwd-root-targeting--rx-9
  desc: Regex component marker
  crit: component
  conf: 0.82
  if:
    type: text
    regex: (process\.cwd\(\)|__dirname).{0,80}(postcss|tailwind)\.config
  count_max: 1028372
- id: cwd-root-targeting--rx-10
  desc: Regex component marker
  crit: component
  conf: 0.82
  if:
    type: text
    regex: (process\.cwd\(\)|__dirname).{0,80}(eslint|next)\.config
  count_max: 1028373
- id: cwd-root-targeting--rx-11
  desc: Regex component marker
  crit: component
  conf: 0.82
  if:
    type: text
    regex: (process\.cwd\(\)|__dirname).{0,80}(vite|webpack)\.config
  count_max: 1028374
- id: cwd-root-targeting--rx-12
  desc: Regex component marker
  crit: component
  conf: 0.82
  if:
    type: text
    regex: (process\.cwd\(\)|__dirname).{0,80}(astro|vue)\.config
  count_max: 1028375
- id: cwd-root-targeting--rx-13
  desc: Regex component marker
  crit: component
  conf: 0.82
  if:
    type: text
    regex: (process\.cwd\(\)|__dirname).{0,80}(vitest|playwright)\.config
  count_max: 1028376
- id: cwd-root-targeting--rx-14
  desc: Regex component marker
  crit: component
  conf: 0.82
  if:
    type: text
    regex: (process\.cwd\(\)|__dirname).{0,80}(cypress|docusaurus)\.config
  count_max: 1028377
- id: cwd-root-targeting--rx-15
  desc: Regex component marker
  crit: component
  conf: 0.82
  if:
    type: text
    regex: (process\.cwd\(\)|__dirname).{0,80}(remix|svelte)\.config
  count_max: 1028378
composite_rules:
- id: long-tail-build-config-payload
  desc: Obfuscated build config ends with an unusually long code tail
  crit: suspicious
  conf: 0.94
  attack: T1195.002,T1027,T1059.007
  # `last-line-over-1000` is backed by text.last_line_length; the neutral
  # `single-long-line` atom is backed by text.max_line_length. Requiring both
  # makes this specifically a long tail, rather than any large source file.
  all:
  - id: metadata/build/config::js-build-config-file
  - id: objectives/anti-static/obfuscation/code-metrics/structure::last-line-over-1000
  - id: metadata/file/metrics::single-long-line
  - id: objectives/anti-static/obfuscation/
  # Directory references deliberately cover future syntax variants: a loader
  # may use an eval decoder, string encoding, shell bridge, HTTP fetch, or a
  # new obfuscator atom without changing the structural supply-chain pattern.
  any:
  - id: micro-behaviors/data/source/property/
  - id: micro-behaviors/process/interpreter/eval/
  - id: micro-behaviors/process/interpreter/runtime/eval/
  - id: micro-behaviors/process/create/shell/
  - id: micro-behaviors/communications/http/
  unless:
  - id: metadata/package/testing/
  - id: metadata/library/structure::js-large-module-bundle
  # @kbn/moon serializes generated YAML into one CommonJS string; its long
  # final line is configuration data, not an appended executable payload.
  - id: metadata/build/scaffold::moon-generated-project-config
  - id: well-known/lib/ui/vite::official-vite-package-context
  - id: well-known/lib/ui/vite::dist-node-chunk
  - id: well-known/lib/ui/vite::vite-dev-tool
- id: hidden-build-config-loader
  desc: Obfuscated loader appended to build config behind whitespace concealment
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/build/config::js-build-config-target
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::whitespace-hiding
  any:
  - id: micro-behaviors/data/source/property/computed::js-global-require-alias
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::whitespace-hidden-eval
- id: build-config-obfuscated-global-aliasing
  desc: Build config combines obfuscation with global require or module aliases
  crit: suspicious
  conf: 0.98
  attack: T1195.002,T1027.002
  all:
  - id: metadata/build/config::js-build-config-target
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::global-require-module-aliasing
  unless:
  - id: metadata/package/testing/

# A build-config tail that combines concealment, an obfuscated module loader,
# an outbound HTTPS client, and a hidden child launch is a staged supply-chain
# payload. The rule intentionally has no package, domain, or campaign anchor.
- id: obfuscated-build-config-network-hidden-stage
  desc: Obfuscated build config fetches and launches a hidden stage
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1027,T1105,T1059.007,T1564.003
  all:
  - id: hidden-build-config-loader
  - id: build-config-obfuscated-global-aliasing
  - id: micro-behaviors/communications/http/request/computed::js-computed-http-object-call
  - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-expression
  unless:
  - id: metadata/package/testing/
- id: build-config-nested-decoder-stage
  desc: PostCSS config executes concealed decoded stage
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1027,T1059.007
  # The nested loader rule proves hidden execution, while this additional leg
  # proves it was grafted onto a functional PostCSS/Tailwind configuration.
  # Modern Tailwind v4 configs use a plugin array and export a named binding,
  # so the older object-only config shape missed this trojanized form.
  all:
  - id: metadata/build/config::postcss-config-shape
  - id: objectives/supply-chain/hidden-payload/trojan::nested-function-decoder-stage-loader
  unless:
  - id: metadata/package/testing/
- id: build-config-eval-atob-payload
  desc: Build config executes Base64-decoded payload
  crit: hostile
  conf: 0.98
  mbc: E1059
  all:
  - id: metadata/build/config::js-build-config-target
  - id: objectives/supply-chain/hidden-payload/encoding::eval-atob
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/
- id: build-config-remote-function-loader
  desc: Build config executes remote Function payload
  crit: hostile
  conf: 0.995
  mbc: E1059
  all:
  - id: metadata/build/config::js-build-config-target
  - id: objectives/command-and-control/dropper/delivery/fetch-eval::request-body-function-loader
  any:
  - id: objectives/supply-chain/trojanized/library/remote-eval::import-time-init-plugin
  - id: micro-behaviors/communications/http/header/custom::bearrtoken-header-map-entry
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/
- id: archive-build-config-remote-function-loader
  desc: Archive carries remote build config loader
  crit: hostile
  conf: 0.98
  for: [npm, tar, zip]
  scope: archive
  all:
  - id: metadata/build/config::js-build-config-target
  - id: objectives/command-and-control/dropper/delivery/fetch-eval::request-body-function-loader
  any:
  - id: objectives/supply-chain/trojanized/library/remote-eval::import-time-init-plugin
  - id: micro-behaviors/communications/http/header/custom::bearrtoken-header-map-entry
- id: postcss-tailwind-eval-atob-loader
  desc: PostCSS/Tailwind build config eval-atob loader
  crit: hostile
  conf: 0.99
  mbc: E1059
  all:
  - id: postcss-tailwind-eval-atob-payload
  - id: objectives/supply-chain/hidden-payload/encoding::eval-atob
- id: config-target-write
  desc: Writes or appends to config target
  crit: suspicious
  conf: 0.94
  # A config filename and an unrelated file write anywhere in the same module
  # do not establish config modification. Keep the target and write operation
  # in the same local code region.
  near_lines: 12
  all:
  - id: metadata/build/config::js-build-config-target
  any:
  - id: micro-behaviors/fs/write/file
  unless:
  - id: metadata/library/structure::js-large-module-bundle
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  # TypeScript declaration files contain documentation examples such as
  # playwright.config.ts and fs.promises.writeFile(), but cannot execute or
  # modify a build config.
  - id: metadata/lang/scripted::dts-declaration-file
  - id: well-known/app/development/facebook-sapling::facebook-sapling-member-context
  # A build config that writes files is the config doing its own job (webpack
  # entry-point codegen, vite plugin scaffolding). The injector threat model is
  # an unrelated module rewriting somebody else's config.
  - id: metadata/build/config::js-build-config-direct-basename
  - id: metadata/build/config::next-config-direct-basename
- id: js-build-config-injector
  desc: Trojanized JS build config injector
  crit: hostile
  conf: 0.95
  all:
  - id: config-target-write
  # `module.exports` used to satisfy this leg, which made the hostile verdict
  # reachable by any CommonJS module -- every `webpack.config.js` that
  # generates entry points from a template matched. Resolving the victim's
  # project root from cwd is what separates an injector from ordinary codegen.
  any:
  - id: cwd-root-targeting
  unless:
  - id: well-known/app/development/facebook-sapling::facebook-sapling-member-context
- id: cwd-root-targeting
  desc: Targets project root via cwd join
  crit: suspicious
  conf: 0.82
  any:
  - id: cwd-root-targeting--rx-9
  - id: cwd-root-targeting--rx-10
  - id: cwd-root-targeting--rx-11
  - id: cwd-root-targeting--rx-12
  - id: cwd-root-targeting--rx-13
  - id: cwd-root-targeting--rx-14
  - id: cwd-root-targeting--rx-15
