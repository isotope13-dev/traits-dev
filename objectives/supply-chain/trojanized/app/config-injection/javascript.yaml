  unless:
  - id: metadata/package/testing/
  - id: metadata/build/bundler/asset::js-large-module-bundle
  # @kbn/moon serializes generated YAML into one CommonJS string; its long
  # final line is configuration data, not an appended executable payload.
  - id: metadata/build/scaffold::moon-generated-project-config
  - id: well-known/lib/ui/vite::official-vite-package-context
  - id: well-known/lib/ui/vite::dist-node-chunk
  - id: well-known/lib/ui/vite::vite-dev-tool
  # A heavily-commented config trips string-light metric markers, which is
  # what satisfied the obfuscation leg here; comments are not an appended
  # payload, so the comment-heavy shape opts out (one leaf, not the marker
  # composites, which bust the suppression budget).
  - id: metadata/file/comment::high-comment-to-code-ratio
  - id: "metadata/file/naming::test-directory-component"
- id: hidden-build-config-loader
  desc: Obfuscated loader appended to build config behind whitespace concealment
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/build/config::js-build-config-target
  - id: metadata/file/line::long-inline-whitespace-run
  any:
  - id: micro-behaviors/data/property/assign::js-global-require-alias
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::whitespace-hidden-eval
- id: obfuscated-build-config-decoder-stage
  desc: Build config decodes and executes a JavaScript stage
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1027,T1059.007
  mbc: B0032
  all:
  - id: metadata/build/config::js-build-config-target
  - id: hidden-build-config-loader
  - id: micro-behaviors/data/property/assign::js-global-require-alias
  - id: objectives/anti-static/obfuscation/eval/loader::char-permutation-reassembler
  - id: metadata/lang/javascript-features::js-var-nested-call-assignment
  - id: objectives/anti-static/obfuscation/eval/loader::numeric-stage-function-run
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/package/testing/harness/runtime/
- id: build-config-obfuscated-global-aliasing
  desc: Build config combines obfuscation with global require or module aliases
  crit: suspicious
  conf: 0.98
  attack: T1195.002,T1027.002
  all:
  - id: metadata/build/config::js-build-config-target
  - id: micro-behaviors/data/property/assign::js-global-require-module-aliases
  unless:
  - id: metadata/package/testing/

# A build-config tail that combines concealment, an obfuscated module loader,
# an outbound HTTPS client, and a hidden child launch is a staged supply-chain
# payload. The rule intentionally has no package, domain, or campaign anchor.
  - id: "metadata/file/naming::test-directory-component"
- id: obfuscated-build-config-network-hidden-stage
  desc: Obfuscated build config fetches and launches a hidden stage
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1027,T1105,T1059.007,T1564.003
  all:
  - id: hidden-build-config-loader
  - id: build-config-obfuscated-global-aliasing
  - id: micro-behaviors/communications/http/request/computed::js-computed-http-object-call
  any:
  - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-expression
  - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-true
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: build-config-nested-decoder-stage
  desc: PostCSS config executes concealed decoded stage
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1027,T1059.007
  # The nested loader rule proves hidden execution, while this additional leg
  # proves it was grafted onto a functional PostCSS/Tailwind configuration.
  # Modern Tailwind v4 configs use a plugin array and export a named binding,
  # so the older object-only config shape missed this trojanized form.
  all:
  - id: metadata/build/config::postcss-config-shape
  - id: objectives/supply-chain/hidden-payload/trojan::nested-function-decoder-stage-loader
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: build-config-eval-atob-payload
  desc: Build config executes Base64-decoded payload
  crit: suspicious
  conf: 0.98
  mbc: E1059
  all:
  - id: metadata/build/config::js-build-config-target
  - id: objectives/supply-chain/hidden-payload/encoding::eval-atob
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/
  - id: "metadata/file/naming::test-directory-component"
- id: build-config-remote-function-loader
  desc: Build config executes remote Function payload
  crit: hostile
  conf: 0.995
  mbc: E1059
  all:
  - id: metadata/build/config::js-build-config-target
  - id: objectives/command-and-control/dropper/script-eval/remote-code::request-body-function-loader
  any:
  - id: objectives/supply-chain/trojanized/library/remote-eval::import-time-init-plugin
  - id: micro-behaviors/communications/http/header/custom::bearrtoken-header-map-entry
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/
  - id: "metadata/file/naming::test-directory-component"
- id: archive-build-config-remote-function-loader
  desc: Archive carries remote build config loader
  crit: hostile
  conf: 0.98
  for: [npm, tar, zip, javascript]
  scope: archive
  all:
  - id: metadata/build/config::js-build-config-target
  - id: objectives/command-and-control/dropper/script-eval/remote-code::request-body-function-loader
  any:
  - id: objectives/supply-chain/trojanized/library/remote-eval::import-time-init-plugin
  - id: micro-behaviors/communications/http/header/custom::bearrtoken-header-map-entry
- id: postcss-tailwind-eval-atob-loader
  desc: PostCSS/Tailwind build config eval-atob loader
  crit: hostile
  conf: 0.99
  mbc: E1059
  all:
  - id: postcss-tailwind-eval-atob-payload
  - id: objectives/supply-chain/hidden-payload/encoding::eval-atob

- id: npm-tailwindcss-plugin-entry-eval-atob-backdoor
  desc: tailwindcss-prefixed plugin entry ships eval-atob backdoor
  crit: hostile
  conf: 0.99
  mbc: E1059
  attack: T1195.002,T1059.007
  for: [npm, tar, javascript, typescript, package.json]
  scope: archive
  all:
  - id: metadata/package/name/vocabulary::npm-unscoped-tailwindcss-prefix-name
  - id: tailwind-plugin-entry-trailing-eval-atob
  - id: objectives/supply-chain/hidden-payload/encoding::eval-atob
- id: js-build-config-injector
  desc: Trojanized JS build config injector
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/fs/config/build::js-build-config-near-file-write
  # `module.exports` used to satisfy this leg, which made the hostile verdict
  # reachable by any CommonJS module -- every `webpack.config.js` that
  # generates entry points from a template matched. Resolving the victim's
  # project root from cwd is what separates an injector from ordinary codegen.
  any:
  - id: micro-behaviors/fs/config/build::cwd-framework-config-path
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/development/vcs/facebook-sapling::facebook-sapling-member-context
  - id: well-known/lib/ui/vite::vite-source-path
  - id: well-known/lib/testing/vitest::vitest-source-path
  - id: "metadata/file/naming::test-directory-component"
- id: archive-npm-ai-agent-config-hijack-with-hook
  desc: npm archive hijacks AI CLI config with session hook
  crit: hostile
  conf: 0.9
  for: [npm, tar, zip, javascript]
  scope: archive
  all:
  - id: micro-behaviors/os/env/ai-provider::anthropic-base-url-variable
  - id: micro-behaviors/os/env/ai-provider::anthropic-auth-token-variable
  - id: micro-behaviors/os/env/ai-provider::js-claude-settings-env-anthropic-token-assign
  - id: micro-behaviors/communications/ipc/agent-hook::agent-sessionstart-config-key
  - id: micro-behaviors/communications/http/request/json::js-remote-ai-channel-config-array
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/tooling::claude-agent-hook-env-integration-context

