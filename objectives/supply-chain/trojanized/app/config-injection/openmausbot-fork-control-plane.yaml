# A rebuilt copy of the OpenMausBot agent server that points its account
# control plane at another operator's host. The upstream default is the
# project's own accounts service. The fork's packaged default sends sign-in
# and installation credentials to a host the upstream project does not run.
# Rebranded forks that run their own hosted cloud do this legitimately, so
# the repointed default is a trust-anchor change to review, not proof of
# hostile intent. The composite stays suspicious unless credential theft or
# an unexpected exfiltration leg is also present. The product name alone is
# common in legitimate forks and docs, so the composite requires the
# repointed default in the same file.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: account-control-plane-default-url
    desc: Default account control-plane URL constant
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'CONTROL_PLANE_URL\s*[:=]\s*["''`]https://[a-z0-9.-]{4,80}\.[a-z]{2,8}["''`/]'
      not:
        - accounts.openmausbot.com

composite_rules:
  - id: trojanized-openmausbot-control-plane
    desc: OpenMausBot fork repoints its account control plane
    crit: suspicious
    conf: 0.6
    scope: file
    attack: T1199
    all:
      - id: well-known/app/ai/agent-runtime/openmausbot::openmausbot-product-name
      - id: account-control-plane-default-url
