# A downloaded workspace setup package is suspicious when it also hides
# injected agent instructions from the editor's file view and search.
defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1195.002,T1059.007,T1027.013

traits:
  - id: agent-instruction-file-glob
    desc: Agent instruction file glob
    crit: component
    if:
      type: text
      regex: '\*\*/(AGENTS|CLAUDE|GEMINI)\.md'

  - id: editor-file-exclusion-setting
    desc: Editor file exclusion setting
    crit: component
    if:
      type: text
      regex: '(files|search)\.exclude'

  - id: disables-editor-python-diagnostics
    desc: Disables editor Python diagnostics
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'python\.(analysis\.diagnosticMode|pyrefly\.typeCheckingMode|pyrefly\.disableTypeErrors)'

  - id: execsync-unzips-archive
    desc: execSync unpacks a ZIP archive
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'execSync\s*\(\s*`[^`]{0,180}\bunzip\b[^`]{0,120}`'

composite_rules:
  - id: hides-agent-instruction-files-from-editor
    desc: Editor exclusion references agent instruction files
    crit: suspicious
    conf: 0.90
    near_bytes: 2048
    all:
      - id: agent-instruction-file-glob
      - id: editor-file-exclusion-setting

  - id: downloads-agent-rules-and-hides-them-from-editor
    desc: Downloads agent rules and hides them from the editor
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: execsync-unzips-archive
      - id: micro-behaviors/fs/write/file/reference::node-write-file-sync-call
      - id: hides-agent-instruction-files-from-editor

  - id: downloads-custom-zip-agent-rules-and-hides-them-from-editor
    desc: Downloads and hides rules extracted by a custom ZIP parser
    crit: hostile
    conf: 0.99
    attack: T1195.002
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: micro-behaviors/data/archive/zip::zip-central-directory-signature
      - id: micro-behaviors/data/archive/zip::inflates-raw-zip-entry
      - id: micro-behaviors/fs/write/file/reference::node-write-file-sync-call
      - id: hides-agent-instruction-files-from-editor
