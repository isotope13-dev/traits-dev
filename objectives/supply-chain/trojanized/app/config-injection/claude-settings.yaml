defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [json]
  attack: T1195.002

composite_rules:
  - id: persistent-mcp-claude-config-injection
    desc: Persistent MCP package installs itself into Claude Code configuration
    conf: 0.99
    for: [javascript, typescript]
    platforms: [macos]
    attack: T1195.002,T1543.004
    # Self-installation means the LaunchAgent load, the write and the Claude
    # configuration directory are one routine. Pooled across a bundled CLI
    # they only show that the app has a daemon installer and, elsewhere, reads
    # or mentions ~/.claude.
    near_bytes: 16384
    all:
      - id: micro-behaviors/os/service/start::launchctl-load-command
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: micro-behaviors/communications/mcp::mcp-sdk-server-module-import
    unless:
      # typeset-mcp registers its localhost bridge daemon through an
      # explicit user-invoked install, documented with an uninstall.
      - id: well-known/app/ai/tool-server/typeset-mcp::official-package
      # @appchy/jarvis local AI coding assistant CLI and MCP server
      - id: well-known/app/ai/tool-server/jarvis::official-package
      # Happy CLI client daemon and MCP server
      - id: well-known/app/ai/tool-server/happy-cli::official-package
  - id: claude-settings-api-endpoint-credential-redirect
    desc: Claude settings redirect API and embed token
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/agent-config/file::claude-settings-json
      - id: micro-behaviors/os/env/ai-provider::anthropic-base-url-variable
      - id: micro-behaviors/os/env/ai-provider::anthropic-auth-token-variable
      - id: micro-behaviors/process/create/shell/agent-config::ai-agent-statusline-cached-plugin-wrapper
  # npm postinstall writes the full conversation-export block into the
  # user-level Claude settings file, so later agent sessions ship prompts,
  # tool details, and replies to the configured collector.
  - id: claude-global-conversation-telemetry-install
    desc: Installer writes chat export into user settings
    conf: 0.98
    for: [javascript, typescript]
    attack: T1195.002,T1041
    near_bytes: 16000
    all:
      - id: micro-behaviors/os/telemetry/logging/llm::full-conversation-telemetry-export
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
    any:
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js-two-step
    unless:
      - id: well-known/app/ai/coding-agent/toga-harness::documented-corporate-telemetry-install
  - id: remote-script-claude-settings-installer
    desc: Remote script installer persists into Claude settings
    conf: 0.98
    for: [javascript, typescript]
    attack: T1195.002,T1105,T1543.004
    all:
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync
      - id: micro-behaviors/process/create/shell/interpreter::node-download-interpreter-launch-cooccurrence
