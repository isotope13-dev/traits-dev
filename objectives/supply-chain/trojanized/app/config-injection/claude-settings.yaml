defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [json]
  attack: T1195.002

composite_rules:
  - id: persistent-mcp-claude-config-injection
    desc: MCP server loads LaunchAgent near Claude configuration write
    crit: suspicious
    conf: 0.99
    for: [javascript, typescript]
    platforms: [macos]
    attack: T1195.002,T1543.004
    # Keep the service, write and configuration evidence near each other;
    # proximity alone does not prove that the write targets that configuration.
    near_bytes: 16384
    all:
      - id: micro-behaviors/os/service/start::launchctl-load-command
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call
      - id: micro-behaviors/communications/mcp/server::mcp-sdk-server-module-import
  - id: claude-settings-api-endpoint-credential-redirect
    desc: Claude settings redirect API and embed token
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/agent-config/file::claude-settings-json
      - id: micro-behaviors/os/env/ai-provider::anthropic-base-url-variable
      - id: micro-behaviors/os/env/ai-provider::anthropic-auth-token-variable
      - id: micro-behaviors/fs/path/application/plugin::ai-agent-statusline-cached-plugin-wrapper
  # Global conversation-telemetry configuration and a settings write are
  # covered by os/telemetry/logging/llm::global-agent-content-telemetry-write.
  # Their co-occurrence supplies no independent configuration-poisoning claim.
  - id: remote-script-claude-settings-installer
    desc: Remote script installer persists into Claude settings
    conf: 0.98
    for: [javascript, typescript]
    attack: T1195.002,T1105,T1543.004
    all:
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync
      - id: objectives/execution/payload/file-exec/download/runtime::node-download-interpreter-launch-cooccurrence
