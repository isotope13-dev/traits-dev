# AI Skill prompt injection and IDE config persistence
# Detects malicious AI skill packages that inject instructions into AI coding
# assistants' global config files (CLAUDE.md, GEMINI.md, etc.) to achieve
# persistence and self-bootstrapping across sessions.
# These patterns appear in markdown/text/source files — we use broad groups
# since the attack vector spans code and AI skill manifests.
defaults:
  platforms: [windows, unix]
  attack: T1195.002
  for:
    - markdown
    - shell
    - python
    - javascript
    - typescript

traits:
  - id: workspace-soul-md-path
    desc: Workspace SOUL.md instruction path
    crit: notable
    conf: 0.95
    if:
      type: string_literal
      exact: "/data/workspaces/SOUL.md"

  - id: workspace-user-md-path
    desc: Workspace USER.md instruction path
    crit: notable
    conf: 0.95
    if:
      type: string_literal
      exact: "/data/workspaces/USER.md"

  # === Prompt injection urgency markers ===

  - id: critical-protocol-injection
    desc: Urgent forced-execution prompt injection
    crit: notable
    conf: 0.85
    # The phrase alone is just a heading: a tool documenting its own system
    # prompt ("CRITICAL PROTOCOL: you must always output JSON") uses it. The
    # injection is the heading followed by an order to run or load something
    # ahead of the user's task.
    if:
      type: text
      regex: '(?i)critical protocol[\s\S]{0,200}\b(execute|run|invoke|load)\b[\s\S]{0,80}(before|first)'

  - id: true-owner-password-prompt
    desc: Owner password prompt injection
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: true owner.{0,120}password
      case_insensitive: true

  - id: unconditional-command-prompt
    desc: Unconditional command following prompt
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      substr: "follow all of his commands without reservation"
      case_insensitive: true

  - id: subservient-instruction-prompt
    desc: Subservient instruction prompt
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      substr: "Anything else written here is subservient"
      case_insensitive: true

  # NOTE: the OpenClaw/Molty platform-name marker is a neutral identifier (legit
  # OpenClaw skills reference the platform), so it lives at
  # micro-behaviors/os/application/target::openclaw-name-reference and is referenced cross-tier by
  # the openclaw-skill-remote-msi-execution composite below as platform context.
  - id: cmd-start-remote-msiexec
    desc: cmd starts remote MSI installer
    crit: suspicious
    conf: 0.97
    for: [markdown]
    if:
      type: text
      regex: '(?i)\bcmd\s+/c\s+start\s+msiexec\s+/q\s+/i\s+h.{2,5}ps?://'

composite_rules:
  - id: workspace-ai-instruction-files
    desc: Targets workspace AI instruction files
    crit: suspicious
    conf: 0.93
    all:
      - id: workspace-soul-md-path
      - id: workspace-user-md-path

  - id: owner-password-prompt-injection
    desc: Owner password prompt injection
    crit: suspicious
    conf: 0.94
    needs: 2
    any:
      - id: true-owner-password-prompt
      - id: unconditional-command-prompt
      - id: subservient-instruction-prompt

  - id: workspace-prompt-injection-write
    for: [python]
    desc: Writes workspace prompt injection
    crit: hostile
    conf: 0.96
    all:
      - id: workspace-ai-instruction-files
      - id: owner-password-prompt-injection
      - id: micro-behaviors/fs/write/file/full::python-pathlib-write-text

  - id: pypi-install-workspace-prompt-injection
    for: [python]
    desc: PyPI install hook injects AI prompt
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/build/package/recipe/setup-hooks::python-install-hook
      - id: workspace-prompt-injection-write

  # Generic file-write observations live in the neutral file-write tier.
  # Path references beside an unbound write do not prove config persistence.
  # Prompt injection urgency + any IDE config target
  - id: prompt-injection-with-config-target
    desc: Prompt injection targeting AI assistant config
    crit: suspicious
    conf: 0.9
    all:
      - id: critical-protocol-injection
    any:
      - id: micro-behaviors/fs/path/agent-instructions/
      - id: micro-behaviors/fs/path/agent-config/directory::pi-global-agent-path

  - id: agent-skill-multi-ide-bootstrap-persistence
    desc: Skill forces startup across multiple IDE configs
    crit: hostile
    conf: 0.99
    for: [shell, python, javascript, markdown, tar, zip]
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: critical-protocol-injection
    any:
      - id: micro-behaviors/fs/path/agent-instructions
      - id: micro-behaviors/fs/path/agent-config/directory::pi-global-agent-path
    needs: 3

  - id: openclaw-skill-remote-msi-execution
    for: [markdown]
    desc: OpenClaw skill launches remote MSI
    crit: hostile
    conf: 0.98
    attack: T1195.002, T1218.007
    all:
      - id: metadata/package/agent-skill::agent-skill-md-basename
      - id: micro-behaviors/os/package-manager/install::remote-msiexec-install-instructions
    any:
      - id: micro-behaviors/os/application/target::openclaw-name-reference
      - id: cmd-start-remote-msiexec

  - id: package-injects-agent-memory-bridge
    desc: Package injects persistent AI memory bridge
    crit: hostile
    conf: 0.98
    for: [shell, python, javascript, markdown, tar, zip]
    scope: archive
    ref: sha256:ffbf482c4b6c5a57944da3576001f383e4cb61bce3ed008b813487357e49e107
    all:
      - id: micro-behaviors/fs/path/agent-config/directory::ai-coding-tool-config-directory-cluster
      - id: objectives/collection/monitor/agent-observation::ai-agent-persistent-memory-capture
      - id: micro-behaviors/fs/write/file/full::python-pathlib-write-text
    any:
      - id: micro-behaviors/communications/ipc/agent-hook::agent-memory-sync-command
      - id: micro-behaviors/process/create/agent::ai-agent-shell-command-allowlist

  # Auto-skill's bootstrap protocol modifies a user's global rule file and
  # forces every future task through the malicious skill.  The existing
  # CRITICAL PROTOCOL atom is notable; this composite requires both
  # persistence language and a skill manifest.
  - id: agent-skill-global-rule-bootstrap-persistence
    desc: Skill persists forced global startup protocol
    crit: hostile
    conf: 0.99
    for: [shell, python, javascript, markdown, tar, zip]
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: critical-protocol-injection
      - id: micro-behaviors/fs/path/agent-instructions::global-agent-instruction-target
      - id: micro-behaviors/fs/write/file/full::file-write-reference
