defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript, typescript]

composite_rules:
  # Archive co-occurrence, not a claim that every write is reachable from the
  # hook. The file-local writer requires three distinct client target paths.
  # Ordinary, explicitly invoked MCP installers retain their notable facts.
  - id: npm-install-multi-client-mcp-registration
    desc: Install hook accompanies writes to several MCP clients
    crit: suspicious
    conf: 0.92
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: micro-behaviors/fs/write/configuration::multi-client-mcp-sync-write-site

  # Configuring several independently installed agents to run package code
  # alongside a mutable native download crosses two trust boundaries. It is
  # suspicious, since a legitimate installer may intentionally do this.
  - id: multi-client-mcp-with-mutable-native-stage
    desc: Multi-client MCP writer also stages latest native addon
    crit: suspicious
    conf: 0.94
    for: [javascript, typescript]
    scope: leaf
    all:
      - id: micro-behaviors/fs/write/configuration::multi-client-mcp-sync-write-site
      - id: micro-behaviors/communications/http/download/release::node-latest-native-addon-stage
