# Direct parent-directory navigation followed by a named dependency install.
# Bind both operations to one lifecycle value; do not join separate hooks.
# npm runs hooks from the package directory. Pure parent paths select a
# directory outside it; no return cd, subshell or --prefix target is admitted.
defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  attack: T1195.002
  mbc: E1195.002
composite_rules:
- id: preinstall-parent-npm-dependency-injection
  desc: Preinstall adds dependency above package
  crit: hostile
  conf: 0.96
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/dependencies/source::npm-local-dependencies
  all:
  - id: micro-behaviors/os/package-manager/hook-install::preinstall-parent-npm-dependency-command
  - id: metadata/filename/identity::package-json-basename
- id: preinstall-parent-pnpm-dependency-injection
  desc: Preinstall adds dependency above package
  crit: hostile
  conf: 0.96
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/dependencies/source::npm-local-dependencies
  all:
  - id: micro-behaviors/os/package-manager/hook-install::preinstall-parent-pnpm-dependency-command
  - id: metadata/filename/identity::package-json-basename
- id: preinstall-parent-yarn-dependency-injection
  desc: Preinstall adds dependency above package
  crit: hostile
  conf: 0.96
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/dependencies/source::npm-local-dependencies
  all:
  - id: micro-behaviors/os/package-manager/hook-install::preinstall-parent-yarn-dependency-command
  - id: metadata/filename/identity::package-json-basename
- id: install-parent-npm-dependency-injection
  desc: Install adds dependency above package
  crit: hostile
  conf: 0.96
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/dependencies/source::npm-local-dependencies
  all:
  - id: micro-behaviors/os/package-manager/hook-install::install-parent-npm-dependency-command
  - id: metadata/filename/identity::package-json-basename
- id: install-parent-pnpm-dependency-injection
  desc: Install adds dependency above package
  crit: hostile
  conf: 0.96
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/dependencies/source::npm-local-dependencies
  all:
  - id: micro-behaviors/os/package-manager/hook-install::install-parent-pnpm-dependency-command
  - id: metadata/filename/identity::package-json-basename
- id: install-parent-yarn-dependency-injection
  desc: Install adds dependency above package
  crit: hostile
  conf: 0.96
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/dependencies/source::npm-local-dependencies
  all:
  - id: micro-behaviors/os/package-manager/hook-install::install-parent-yarn-dependency-command
  - id: metadata/filename/identity::package-json-basename
- id: postinstall-parent-npm-dependency-injection
  desc: Postinstall adds dependency above package
  crit: hostile
  conf: 0.96
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/dependencies/source::npm-local-dependencies
  - id: well-known/lib/development/extension::vscode-workspace-install-extension
  - id: micro-behaviors/os/package-manager/hook-install::postinstall-nested-subdir-bare-install
  all:
  - id: micro-behaviors/os/package-manager/hook-install::postinstall-parent-npm-dependency-command
  - id: metadata/filename/identity::package-json-basename
- id: postinstall-parent-pnpm-dependency-injection
  desc: Postinstall adds dependency above package
  crit: hostile
  conf: 0.96
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/dependencies/source::npm-local-dependencies
  - id: well-known/lib/development/extension::vscode-workspace-install-extension
  - id: micro-behaviors/os/package-manager/hook-install::postinstall-nested-subdir-bare-install
  all:
  - id: micro-behaviors/os/package-manager/hook-install::postinstall-parent-pnpm-dependency-command
  - id: metadata/filename/identity::package-json-basename
- id: postinstall-parent-yarn-dependency-injection
  desc: Postinstall adds dependency above package
  crit: hostile
  conf: 0.96
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/dependencies/source::npm-local-dependencies
  - id: well-known/lib/development/extension::vscode-workspace-install-extension
  - id: micro-behaviors/os/package-manager/hook-install::postinstall-nested-subdir-bare-install
  all:
  - id: micro-behaviors/os/package-manager/hook-install::postinstall-parent-yarn-dependency-command
  - id: metadata/filename/identity::package-json-basename
