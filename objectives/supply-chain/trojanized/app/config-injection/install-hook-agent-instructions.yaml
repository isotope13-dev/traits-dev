# An install hook that edits the consuming project's AI-agent instruction
# files.
#
# CLAUDE.md, AGENTS.md, GEMINI.md, .cursor/rules/*.mdc and
# .github/copilot-instructions.md are read automatically at the start of every
# agent session in a checkout. Whatever sits in them is not documentation to the
# agent -- it is standing instruction, applied before the developer has typed
# anything, to a tool that can read the repository, run commands and open
# network connections. `npm install` runs postinstall with no prompt and no
# review, so a dependency that writes to those files has appended text to the
# system prompt of every future agent session in that project, transitively,
# from anywhere in the dependency tree.
#
# The distance between a benign version of this and an attack is only the
# content written, and content is the attacker's free variable. So the write
# itself stops at suspicious -- the package that prompted this rule appends a
# one-line pointer to its own docs, which is plausibly well meant. The hostile
# tier for this mechanism already exists one directory over, in
# objectives/evasion/security-bypass/llm/prompt::coding-agent-instruction-file-poisoning,
# which requires the planted text to carry an actual directive; this file
# widened the instruction surfaces that rule accepts rather than restating it.
#
# Written against the mechanism, not this package: any install-time script
# (postinstall, preinstall, prepare, a Python build hook) writing any of the
# vendor-neutral set of instruction surfaces. Editors move, filenames change,
# the shape does not.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar, zip, whl, python-sdist]
  attack: T1195.002,T1546
  mbc: B0024

composite_rules:
  # The instruction surfaces, as one reference point for the rules below.
  - id: project-agent-instruction-target
    desc: References a project agent instruction surface
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/fs/path/agent-instructions/
      - id: micro-behaviors/fs/path/agent-config/file::agent-instruction-path-literal

  - id: install-hook-writes-agent-instructions
    desc: Install hook writes project agent instructions
    crit: suspicious
    conf: 0.93
    # A sibling CLI writer does not establish install-hook execution.
    for: [javascript, typescript, npm, tar, zip]
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/local-script::postinstall-js-file
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: project-agent-instruction-target
    unless:
      # A defensive agent sandbox ships its own instruction files and a
      # postinstall that regenerates committed artifacts; archive pooling
      # reads that as an install hook planting agent instructions.
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: metadata/package/scaffold::agent-rules-distribution-context

  # Coverage across vendors is the tell that separates "our package documents
  # itself for Claude" from "whatever agent you use, we are in its prompt". A
  # package with something to say says it once, in the file its own README
  # points at; a hook that locates CLAUDE.md, then Cursor's rules directory,
  # then Copilot's instructions file is enumerating the surfaces rather than
  # using one.
  - id: install-hook-writes-multiple-agent-surfaces
    desc: Install hook targets several agent instruction surfaces
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript]
    scope: file
    needs: 2
    all:
      - id: install-hook-writes-agent-instructions
    unless:
      - id: metadata/package/scaffold::agent-rules-distribution-context
    any:
      - id: micro-behaviors/fs/path/agent-instructions::copilot-instructions-path
      - id: micro-behaviors/fs/path/agent-instructions::cursor-project-rule-path
      - id: micro-behaviors/fs/path/agent-config/file::agent-instruction-path-literal
