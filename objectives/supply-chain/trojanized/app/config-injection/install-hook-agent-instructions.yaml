# An install hook that edits the consuming project's AI-agent instruction
# files.
#
# CLAUDE.md, AGENTS.md, GEMINI.md, .cursor/rules/*.mdc and
# .github/copilot-instructions.md are read automatically at the start of every
# agent session in a checkout. Whatever sits in them is not documentation to
# the agent -- it is standing instruction, applied before the developer has
# typed anything, to a tool that can read the repository, run commands and
# open network connections. When package lifecycle scripts are enabled,
# `npm install` runs postinstall, so a dependency that writes to those files
# has appended text to the standing instructions of future agent sessions,
# transitively, from anywhere in the dependency tree.
#
# The distance between a benign version of this and an attack is only the
# content written, and content is the attacker's free variable. So the write
# itself stops at suspicious -- the package that prompted this rule appends a
# one-line pointer to its own docs, which is plausibly well meant. The hostile
# tier requires the planted text to carry an actual directive. The broader
# prompt-injection objective already exists in
# objectives/evasion/security-bypass/llm/prompt::coding-agent-instruction-file-poisoning.
#
# Written against the mechanism, not this package: any install-time script
# (postinstall, preinstall, prepare, a Python build hook) writing any of the
# vendor-neutral set of instruction surfaces. Editors move, filenames change,
# the shape does not.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar, zip, whl, python-sdist]
  attack: T1195.002,T1546
  mbc: B0024

traits:
  - id: install-hook-agent-cli-preference-directive
    desc: Agent told to prefer package CLI
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)command.{0,30}primary interface'

  - id: unattended-password-service-prompt
    desc: Agent told password use needs no human
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: text
      regex: '(?i)passwords? need no pairing and no human'

composite_rules:
  # The package can install a standing directive that grants an AI agent
  # password access without per-use human approval. Keep the content and write
  # in one postinstall source file, then require the manifest to execute that
  # script before reporting the package-level supply-chain behavior.
  - id: postinstall-writes-autonomous-password-instructions
    desc: Postinstall writes autonomous password-use instructions
    crit: notable
    conf: 0.97
    for: [javascript]
    scope: file
    near_bytes: 5000
    all:
      - id: metadata/package/files/lifecycle::postinstall-js-file
      - id: micro-behaviors/fs/write/agent-config/instructions::node-agent-instruction-path-write
      - id: objectives/evasion/security-bypass/llm/override::llm-agent-autonomous-password-key-directive

  - id: install-hook-plants-autonomous-password-instructions
    desc: Install hook plants autonomous password-use instructions
    # Keep this broader package-level clue notable. The npm-specific rule
    # below verifies the declared lifecycle hook and owns the hostile result,
    # avoiding two hostile findings for the same injected password directive.
    crit: notable
    conf: 0.97
    for: [npm, javascript, package.json]
    scope: package
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: postinstall-writes-autonomous-password-instructions

  # Instruction writes must live in the postinstall script member itself.
  # Archive pooling otherwise pairs a benign postinstall.js with a separate
  # init/setup helper that only runs from an explicit CLI command.
  - id: postinstall-script-writes-agent-instructions
    desc: Postinstall script writes agent instructions
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    scope: file
    all:
      - id: metadata/package/files/lifecycle::postinstall-js-file
    any:
      - id: micro-behaviors/fs/write/file/target::calls-project-instruction-writer-helper
      - id: micro-behaviors/fs/write/file/target::module-level-project-instruction-write
      - id: micro-behaviors/fs/path/agent-instructions::agent-plugin-instructions-path
      - id: micro-behaviors/fs/write/agent-config/instructions::node-agent-instruction-path-write
      - id: micro-behaviors/fs/write/file/target::calls-global-instruction-writer-helper

  # The instruction surfaces, as one reference point for the rules below.
  - id: install-hook-writes-agent-instructions
    desc: Install hook writes agent instructions
    crit: suspicious
    conf: 0.93
    # A sibling CLI writer does not establish install-hook execution.
    for: [javascript, typescript, package.json, npm, tar]
    all:
      - id: metadata/package/files/lifecycle::postinstall-js-file
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: postinstall-script-writes-agent-instructions
    # A dormant setup helper is not an install-time write. Bind an invoked
    # writer or a resolved project-instruction write to the postinstall hook.
    # The manifest and its lifecycle script are separate archive members.
    scope: archive
    any:
      - id: micro-behaviors/fs/write/file/target::calls-project-instruction-writer-helper
      - id: micro-behaviors/fs/write/file/target::module-level-project-instruction-write
      - id: micro-behaviors/fs/write/agent-config/instructions::node-agent-instruction-path-write
      - id: micro-behaviors/fs/path/agent-instructions::agent-plugin-instructions-path
      - id: micro-behaviors/fs/write/file/target::calls-global-instruction-writer-helper
    unless:
      # A defensive agent sandbox ships its own instruction files and a
      # postinstall that regenerates committed artifacts; archive pooling
      # reads that as an install hook planting agent instructions.
      - id: well-known/tool/detection/ai-agent/agent-glovebox::archive-context
      - id: metadata/package/scaffold::agent-rules-distribution-context
      - id: metadata/package/description/ai-tooling::description-ai-coding-harness
      - id: metadata/package/description/function::description-ai-coding-orchestrator
      - id: well-known/app/ai/coding-agent/0xray::archive-context
      - id: well-known/app/ai/coding-agent/0xray::consumer-bridge-postinstall-marker
      - id: well-known/app/ai/coding-agent/pi/kendex-pi-extension::archive-context
      - id: well-known/app/ai/gateway/lemma::archive-context

  # Coverage across vendors is the tell that separates "our package documents
  # itself for Claude" from "whatever agent you use, we are in its prompt". A
  # package with something to say says it once, in the file its own README
  # points at; a hook that locates several instruction surfaces is enumerating
  # them rather than using one.
  - id: install-hook-writes-multiple-agent-surfaces
    desc: Install hook writes multiple AI agent instruction files
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript, package.json, npm, tar]
    scope: archive
    needs: 2
    all:
      - id: install-hook-writes-agent-instructions
    unless:
      - id: metadata/package/scaffold::agent-rules-distribution-context
    any:
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
      - id: micro-behaviors/fs/path/agent-config/directory::cursor-config-directory
      - id: micro-behaviors/fs/path/agent-instructions::copilot-instructions-path
      - id: micro-behaviors/fs/path/agent-instructions::cursor-project-rule-path
      - id: micro-behaviors/fs/path/agent-instructions::agents-md-reference
      - id: micro-behaviors/fs/path/agent-instructions::project-claude-md-target-literal
      - id: micro-behaviors/fs/path/agent-instructions::project-gemini-md-target-literal
      - id: micro-behaviors/fs/path/agent-instructions::cursor-global-rules-path
      - id: micro-behaviors/fs/path/agent-instructions::windsurf-global-instruction-target-in-code

  # A hook that writes standing instructions steering later user requests
  # toward its own CLI adds an explicit malicious directive to the install-time
  # manipulation of agent context.
  - id: install-hook-steers-agent-to-package-cli
    desc: Install hook steers agents to its CLI
    crit: hostile
    conf: 0.97
    for: [javascript, typescript, package.json, npm, tar]
    scope: archive
    all:
      - id: install-hook-writes-multiple-agent-surfaces
      - id: install-hook-agent-cli-preference-directive

  # An install-time instruction that tells an agent to mint and use a
  # password-service key without the user's involvement is materially
  # different from a benign pointer to a package's documentation. Require the
  # actual instruction text, the install-hook file, and a write to an agent
  # instruction path in the same script.
  - id: unattended-password-use-agent-injection
    desc: Install hook injects unattended password use
    crit: hostile
    conf: 0.98
    for: [javascript]
    scope: file
    all:
      - id: metadata/package/files/lifecycle::postinstall-js-file
      - id: micro-behaviors/fs/write/agent-config/instructions::node-agent-instruction-path-write
      - id: unattended-password-service-prompt
      - id: objectives/evasion/security-bypass/llm/prompt/override::agent-mints-own-password-key

  # Promote the script finding to its npm archive only when package metadata
  # confirms that this script is the declared Node postinstall hook.
  - id: npm-install-hook-injects-unattended-password-directive
    desc: npm install hook injects unattended password use
    crit: hostile
    conf: 0.98
    # Include the container and the two member types that supply its evidence.
    for: [npm, tar, javascript, package.json]
    scope: archive
    all:
      - id: unattended-password-use-agent-injection
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
