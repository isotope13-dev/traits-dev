# User-wide content logging configuration merits review; a collector token
# alone cannot establish theft. File scope avoids pooling unrelated writes.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  conf: 0.97
  crit: suspicious
composite_rules:
  - id: script-configures-global-agent-content-telemetry
    desc: Global Claude settings write with content OTLP
    all:
      - id: objectives/collection/monitor/telemetry::full-conversation-telemetry-export
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
    any:
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js-two-step
    unless:
      - id: well-known/app/ai/coding-agent/toga-harness/

  - id: install-writes-hardcoded-otel-into-claude-settings
    desc: Install script injects hardcoded OTLP bearer into Claude settings
    crit: hostile
    conf: 0.98
    attack: T1041,T1195.002
    for: [npm, tar, zip, javascript]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/telemetry::otel-exporter-hardcoded-bearer-header
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
    any:
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js-two-step
    unless:
      - id: well-known/app/ai/coding-agent/toga-harness/
