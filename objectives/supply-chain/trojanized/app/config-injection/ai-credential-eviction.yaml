# Credential eviction is the lock-in half of an AI-CLI takeover.
#
# A hijack package plants its own gateway endpoint and auth token into the
# agent's configuration (see ide-mcp.yaml and claude-settings.yaml in this
# directory); the variants that hold the position also remove the victim's
# legitimate persisted credential first, so the attacker-routed credential is
# the only one left: `reg.exe delete HKCU\Environment /v <PROVIDER>_API_KEY`
# on Windows, or a rewrite of ~/.bashrc / ~/.zshrc / ~/.profile that strips
# the `export <PROVIDER>_API_KEY=` lines. No installer has a legitimate
# reason to delete a user's persisted provider credential; a key-rotation
# helper replaces the old value and is excluded by the empty-replacement
# shape of the strip matcher.
#
# scope: file — the AI-credential name, the eviction mechanism and (for the
# rc arm) the write-back sit in one installer module.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1195.002

composite_rules:
  - id: ai-credential-config-eviction
    desc: Evicts AI credential from startup files or user env
    crit: hostile
    conf: 0.93
    scope: file
    all:
      - id: micro-behaviors/os/env/ai-provider::ai-provider-key-env-reference
    any:
      - id: micro-behaviors/fs/write/file/shell::rc-credential-strip-write-back
      - id: micro-behaviors/os/registry/delete::reg-delete-user-env-credential
    needs: 1
