# Resource substitution in a trusted wallet application, with credential
# harvesting context. This is a co-occurrence signature, not a source/path join.
defaults:
  platforms: [macos]
  for: [scripts, source]

composite_rules:
  - id: wallet-resource-phish-replacement
    desc: Wallet resource copying/signing with validated password prompt
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1056.002
    all:
      - id: micro-behaviors/crypto/sign::wallet-asar-copy-adhoc-context
      - id: micro-behaviors/ui/dialog/apple::hidden-answer
      - id: micro-behaviors/os/security/auth/verify::dscl-password-verification
