# InfOSAStealer replaces wallet resources without necessarily terminating the
# wallet process or extracting directly into /Applications. These observations
# describe co-occurrence, not a source-to-destination data-flow proof.
defaults:
  platforms: [macos]
  for: [scripts, source]

composite_rules:
  - id: wallet-resource-copy-adhoc
    desc: Wallet ASAR paths with copying and forced ad-hoc signing
    crit: suspicious
    conf: 0.92
    near_bytes: 1200
    all:
      - id: micro-behaviors/fs/path/application/bundle::wallet-app-bundle-path
      - id: micro-behaviors/fs/path/application/bundle::electron-resources-asar-path-text
      - id: micro-behaviors/fs/file/copy::cp-command
      - id: micro-behaviors/os/security/gatekeeper::codesign-force-adhoc

  - id: wallet-resource-phish-replacement
    desc: Wallet resource copying and signing with validated password lure
    crit: hostile
    conf: 0.97
    attack: T1056.002
    all:
      - id: wallet-resource-copy-adhoc
      - id: micro-behaviors/ui/dialog/apple::hidden-answer
      - id: micro-behaviors/os/security/auth/verify::dscl-password-verification
