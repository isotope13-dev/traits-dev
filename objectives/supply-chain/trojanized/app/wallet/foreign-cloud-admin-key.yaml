# Electrum talks to Electrum servers and block explorers; no release ships
# Firebase. An Electrum module that carries a Firebase Admin service account
# was modified by someone else to report to their cloud project.
defaults:
  platforms: [windows, linux, macos]
  for: [python, python_bytecode]
  attack: T1195.002,T1554

composite_rules:
  - id: electrum-module-firebase-admin-credential
    desc: Electrum module carries a Firebase Admin service-account credential
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/application/target/wallet::electrum-word
      - id: micro-behaviors/os/security/auth/cloud::firebase-admin-service-account-email
      - id: micro-behaviors/communications/http/services/firebase::firebase-admin-python-module
