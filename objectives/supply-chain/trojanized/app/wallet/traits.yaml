# Wallet App Source Code Injection
# Detects injection markers and hooks in trojanized wallet applications
# Used by Shub stealer and similar wallet-targeting campaigns
# ATT&CK: T1195.002 (Supply Chain Compromise)
defaults:
  crit: suspicious
  platforms:
    - windows
    - unix
  for:
    - javascript
    - typescript
  attack: T1195.002
  mbc: B0024
traits:
  - id: webpack-hook-comment
    desc: WEBPACK HOOK injection marker
    conf: 0.95
    if:
      type: text
      regex: WEBPACK\s+HOOK
  - id: steal-bip39-comment
    desc: BIP39 steal marker in source
    conf: 0.95
    attack: T1555
    if:
      type: text
      regex: (?i)STEAL.{0,20}BIP39
  - id: steal-mnemonic-comment
    desc: Mnemonic steal marker in source
    conf: 0.95
    attack: T1555
    if:
      type: text
      regex: (?i)STEAL.{0,20}MNEMONIC
    unless:
      - id: well-known/tool/detection/pattern-catalog::js-threat-data-catalog

  - id: seed-capture-hook
    desc: Seed phrase capture code
    conf: 0.9
    attack: T1555
    if:
      type: text
      regex: (?i)\bseed\s+phrase\b.{0,40}\b(capture|intercept|hook)\b
    not:
      - regex: (?i)\bplain\s+seed,\s+no\s+hook\b
      - regex: (?i)\bseed\s+phrase\b.{0,30}\bno\s+hook\b
  - id: mnemonic-grab-hook
    desc: Mnemonic grab/steal code
    conf: 0.9
    attack: T1555
    if:
      type: text
      regex: (?i)mnemonic.{0,40}(grab|steal|exfil)
    unless:
      - id: well-known/tool/detection/pattern-catalog::js-threat-data-catalog
      - id: well-known/tool/detection/pattern-catalog::js-exported-severity-rule-module
      # An agent-guard policy table maps secret categories to enforcement
      # decisions ("mnemonic: 'deny'"); the mention is the protected target,
      # not a grab hook.
      - id: well-known/tool/detection/pattern-catalog::js-agent-guard-policy-table

  - id: exodus-seed-recovery-prototype-hook
    desc: Hooks Exodus seed recovery methods
    crit: suspicious
    conf: 0.96
    attack: T1195.002,T1555
    if:
      type: text
      regex: '(?s)\bgetSeedFile\s*=\s*function\b.{0,999}\brecoverWalletFromMnemonic\s*=\s*function\b'

  - id: wallet-secret-exfil-record-fields
    desc: Wallet credential exfil record fields
    crit: suspicious
    conf: 0.95
    attack: T1555
    if:
      type: text
      regex: '(?s)\bwallet\s*:.{1,140}\bpw\s*:.{1,70}\bpin\s*:.{1,70}\bmn\s*:.{1,70}\bpriv\s*:'

composite_rules:
  - id: trojanized-wallet-seed-hook-exfil
    desc: Hooks wallet seed recovery for exfil
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1555,T1041
    all:
      - id: exodus-seed-recovery-prototype-hook
      - id: micro-behaviors/communications/http/request/json::node-http-post-json-body
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
  - id: wallet-source-injection
    desc: Wallet app source code injection
    conf: 0.95
    any:
      - id: webpack-hook-comment
      - id: steal-bip39-comment
      - id: steal-mnemonic-comment
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: wallet-hook-pattern
    desc: Wallet application hook pattern
    conf: 0.9
    all:
      - id: objectives/credential-access/wallet/mnemonic::wallet-marker
    any:
      - id: seed-capture-hook
      - id: mnemonic-grab-hook
      - id: webpack-hook-comment
