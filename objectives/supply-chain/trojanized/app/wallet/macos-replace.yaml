# A local trusted-wallet replacement, not movement to another host.
defaults:
  platforms: [macos]
  for: [macho, shell, applescript]
  attack: T1195.002
composite_rules:
  - id: wallet-app-download-replacement
    desc: Wallet replacement with collection or phishing
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/application/bundle::wallet-app-bundle-path
      - id: micro-behaviors/process/terminate/command::terminate-ledger-command
      - id: micro-behaviors/communications/http/download/curl::curl-zip-output
      - id: micro-behaviors/data/archive/extract/zip::unzip-applications-destination
    any:
      - id: objectives/credential-access/phishing/lure::password-phishing-comp
      - id: objectives/collection/file-targeting/filter::applescript-sensitive-store-exfiltration
  - id: wallet-app-executable-download-replacement
    desc: Downloaded binary replaces wallet application executable
    crit: hostile
    conf: 0.98
    for: [macho, applescript]
    all:
      - id: micro-behaviors/fs/path/application/bundle::application-macos
      - id: micro-behaviors/fs/path/application/bundle::wallet-app-bundle-path
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
    any:
      - id: objectives/credential-access/phishing/lure::password-phishing-comp
      - id: objectives/credential-access/phishing/lure::applescript-credential-phish-hostile
      - id: objectives/collection/file-targeting/filter::office-secret-extension-list
      - id: objectives/credential-access/browser/chromium::chrome-keychain-query
      - id: micro-behaviors/fs/path/credential::multi-sensitive-store-references
