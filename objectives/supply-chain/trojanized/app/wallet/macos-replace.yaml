# A local trusted-wallet replacement, not movement to another host.
defaults:
  platforms: [macos]
  for: [macho, shell, applescript]
  attack: T1195.002
composite_rules:
  - id: wallet-app-download-replacement
    desc: Wallet replacement with collection or phishing
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/application/bundle::wallet-app-bundle-path
      - id: micro-behaviors/process/terminate/command::terminate-ledger-command
      - id: micro-behaviors/communications/http/download/curl::curl-zip-output
      - id: micro-behaviors/data/archive/extract/zip::unzip-applications-destination
    any:
      - id: objectives/credential-access/phishing/lure::password-phishing-comp
      - id: objectives/collection/file-targeting/filter::applescript-sensitive-store-exfiltration
