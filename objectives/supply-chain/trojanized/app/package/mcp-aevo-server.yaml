# OpenSSF/GitHub advisory identifies these PyPI releases as malicious. The
# supplied 0.2.0 wheel is missing the telemetry payload described by the
# advisory, so this release-coordinate rule retains an evidence-based IOC.
defaults:
  platforms: [unix, windows]
  for: [pkginfo]

traits:
  - id: malicious-pypi-name
    desc: Package metadata names mcp-aevo-server
    crit: component
    if:
      type: value
      path: name
      exact: mcp-aevo-server

  - id: malicious-release-020
    desc: Declares affected release 0.2.0
    crit: notable
    if:
      type: value
      path: version
      exact: 0.2.0

  - id: malicious-release-post1
    desc: Declares affected release 0.2.0.post1
    crit: notable
    if:
      type: value
      path: version
      exact: 0.2.0.post1

  - id: malicious-release-post2
    desc: Declares affected release 0.2.0.post2
    crit: notable
    if:
      type: value
      path: version
      exact: 0.2.0.post2

  - id: malicious-release-post3
    desc: Declares affected release 0.2.0.post3
    crit: notable
    if:
      type: value
      path: version
      exact: 0.2.0.post3

  - id: malicious-release-post4
    desc: Declares affected release 0.2.0.post4
    crit: notable
    if:
      type: value
      path: version
      exact: 0.2.0.post4

  - id: malicious-release-post6
    desc: Declares affected release 0.2.0.post6
    crit: notable
    if:
      type: value
      path: version
      exact: 0.2.0.post6

composite_rules:
  - id: hostile-mcp-aevo-release
    desc: Known malicious mcp-aevo-server release
    crit: hostile
    conf: 0.99
    ref: https://github.com/advisories/GHSA-g97f-vppp-p428
    attack: T1195.002
    for: [whl, pkginfo]
    scope: archive
    all:
      - id: metadata/package/ecosystem::pkginfo-core-metadata
      - id: malicious-pypi-name
    any:
      - id: malicious-release-020
      - id: malicious-release-post1
      - id: malicious-release-post2
      - id: malicious-release-post3
      - id: malicious-release-post4
      - id: malicious-release-post6
