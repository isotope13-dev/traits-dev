defaults:
  platforms: [macos]
  crit: hostile
  for: [pkg, shell]
  attack: T1195.002,T1070.004

composite_rules:
  - id: macpkg-package-receipt-catalog-wiper
    desc: macOS package erases its own install receipts from system database
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/os/package-manager/management::macpkg-receipt-erasure-hook
      - id: micro-behaviors/fs/file/stat::shell-missing-file-exit-guard
    unless:
      - id: micro-behaviors/os/package-manager/management::macos-remover-script-path

  - id: macpkg-postinstall-safe-storage-stealer
    desc: macOS package installer hook exfiltrates browser Safe Storage password
    conf: 0.99
    attack: T1195.002,T1555.003,T1041
    scope: archive
    all:
      - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
      - id: objectives/exfiltration/stealer/credential/value/password::shell-safe-storage-http-upload
    unless:
      - id: metadata/path/directory::test-directory-component
