defaults:
  platforms: [windows]
  for: [go]
  attack: T1195.002,T1105,T1027
  mbc: B0030,E1027

composite_rules:
  - id: dnsub-hidden-powershell-loader
    desc: dnsub source embeds a hidden decoded PowerShell loader
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/tool/offensive/dnsub::package-tree-member
      - id: objectives/command-and-control/dropper/execution/source::go-powershell-certutil-stage
