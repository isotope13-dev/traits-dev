defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002
  crit: component
  conf: 0.9

traits:
  - id: npm-description-ai-agent-instruction
    crit: notable
    desc: npm description instructs AI agents
    if:
      type: value
      path: description
      regex: '<FOR AI AGENTS>|IMPORTANT INSTRUCTION'

  - id: npm-description-claims-safe-package
    crit: notable
    desc: npm description claims package safe
    if:
      type: value
      path: description
      regex: 'ABSOLUTELY SAFE PACKAGE|perfectly safe package'

  - id: npm-description-event-handler-html
    crit: notable
    desc: npm description embeds event handler
    if:
      type: value
      path: description
      regex: 'onmouseover\s*=\s*alert|document\.cookie'

  # REMOVED: npm-postinstall-missing-script-path ("npm postinstall references
  # absent script path").  The matcher only tested that scripts.postinstall was
  # the string `node scripts/postinstall.js` -- it never checked whether the
  # script was present, so the description convicted every package using the
  # single most conventional postinstall command in npm of shipping a dangling
  # hook.  The general, honest form of the same observation already exists as
  # objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script,
  # which the composites below now reference.

composite_rules:
  - id: npm-ai-agent-description-injection
    desc: npm AI agent description injection
    crit: suspicious
    conf: 0.96
    all:
      - id: npm-description-ai-agent-instruction
      - id: npm-description-claims-safe-package
    any:
      - id: npm-description-event-handler-html
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script

  # A package whose own npm description carries AI-agent instructions AND that
  # executes a script at install time: the prompt-injection text reaches any
  # agent that reads registry metadata, and the install hook gives the same
  # publisher code execution on the developer's machine.  Renamed from
  # npm-dead-postinstall-ai-injection -- nothing here ever established that the
  # postinstall was "dead".
  - id: npm-ai-injection-description-with-install-hook
    desc: Package advertises AI-agent instructions and runs an install hook
    crit: hostile
    conf: 0.98
    all:
      - id: npm-ai-agent-description-injection
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: objectives/supply-chain/install-hook/scripts/declaration::has-postinstall
