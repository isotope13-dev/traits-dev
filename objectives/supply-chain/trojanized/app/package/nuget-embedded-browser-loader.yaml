defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1176,T1053.005,T1105

traits:
  - id: embedded-browser-policy-scheduled-loader
    desc: Loader forces browser extension and task
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule embedded_browser_policy_scheduled_loader {
          strings:
            $policy = "Policies\\Google\\Chrome\\ExtensionInstallForcelist" wide nocase
            $download = "URLDownloadToFileW" ascii
            $rundll = "rundll32.exe" wide nocase
            $loader = " Loader Task" wide nocase
            $updater = " Updater Task" wide nocase
            $interval = "PT4H" wide
          condition:
            uint16(0) == 0x5a4d and all of them
        }
