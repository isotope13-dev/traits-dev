defaults:
  platforms: [windows, unix]
  for: [npm, package.json, javascript, pe, dll]
  attack: T1195.002

traits:
  - id: startup-remote-plugin-clone
    desc: Startup clones remote plugin repository
    crit: suspicious
    conf: 0.97
    for: [javascript]
    if:
      type: text
      regex: 'execAsync\(\s*`git\s+clone\s+\$\{REPO_URL\}'

  - id: startup-remote-plugin-pull
    desc: Startup pulls mutable plugin repository
    crit: suspicious
    conf: 0.96
    for: [javascript]
    if:
      type: text
      regex: 'execAsync\(\s*["'']git\s+pull\s+--ff-only["'']'

  - id: startup-plugin-enable-setting
    desc: Assigns enabledPlugins setting
    # This is only the final fragment of a multi-part remote-plugin signature.
    # A generic class field such as `enabledPlugins = []` is common in benign
    # plugin frameworks (for example, workspace analyzers) and is not intent
    # evidence on its own.
    crit: component
    conf: 0.88
    for: [javascript]
    if:
      type: text
      regex: '\benabledPlugins\s*=\s*'

composite_rules:
  - id: document-brand-lure-rmm-agent
    desc: RMM agent delivered as branded invoice installer
    crit: hostile
    conf: 0.99
    for: [oledoc]
    attack: "T1195.002,T1036.007,T1219"
    all:
      - id: metadata/package/files/msi::msi-business-document-name
      - id: metadata/package/files/msi::msi-adobe-acrobat-branded-basename
      - id: objectives/command-and-control/backdoor/control/rmm::remote-management-agent-msi-package

  - id: npm-startup-plugin-websocket-backdoor
    desc: Startup plugin embeds WebSocket skill-control backdoor
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: metadata/package/manifest/freeform::openclaw-package-field
      - id: metadata/permission/activation::plugin-startup-activation
      - id: objectives/command-and-control/backdoor/dispatch/websocket::node-websocket-agent-skill-control


  - id: npm-startup-mutable-plugin-injection
    desc: npm startup installs and enables mutable plugin
    crit: hostile
    conf: 0.99
    scope: archive
    attack: T1195.002,T1105
    all:
      - id: startup-remote-plugin-clone
      - id: startup-remote-plugin-pull
      - id: micro-behaviors/fs/path/application/config::ai-plugin-registry-files
      - id: startup-plugin-enable-setting

  - id: npm-runtime-executable-dropper
    desc: npm package runtime fetches and executes an executable in System32
    crit: hostile
    conf: 0.99
    for: [npm]
    scope: archive
    attack: "T1195.002,T1105,T1059.007"
    all:
      - id: objectives/command-and-control/dropper/execution/network-stage::windows-system-directory-fetch-write-exec
      - id: metadata/package/files/included::package-json-basename
