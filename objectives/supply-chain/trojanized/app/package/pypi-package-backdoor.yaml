defaults:
  platforms: [unix, windows]
  crit: hostile
  for: [whl, python, pkginfo, python-sdist]
  attack: T1195.002

composite_rules:
  - id: pypi-package-dns-txt-shell-backdoor
    desc: PyPI package executes remote shell commands from DNS TXT records
    conf: 0.99
    attack: T1195.002,T1071.004,T1059.004
    scope: archive
    all:
      - id: metadata/package/ecosystem::pkginfo-core-metadata
      - id: objectives/command-and-control/remote-command/shell::python-dns-txt-returned-fields-shell-exec

  - id: pypi-package-transformed-shell-loader
    desc: PyPI package ships transformed command shell loader
    conf: 0.99
    attack: T1195.002,T1059.004
    scope: archive
    all:
      - id: metadata/package/ecosystem::pkginfo-core-metadata
      - id: objectives/execution/payload/script-eval/transformed/shell::hex-xor-command-shell-loader
    unless:
      - id: metadata/path/directory::test-directory-component
