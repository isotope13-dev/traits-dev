defaults:
  platforms: [unix]
  for: [npm, tar, zip, package.json, javascript, typescript]
composite_rules:
  - id: preinstall-profile-loader-scoped-replacement
    desc: Package has profiled shell loader and scoped install
    crit: hostile
    conf: 0.99
    scope: package
    size_max: 65536
    all:
      - id: objectives/execution/payload/interpreter-stdin/network::npm-preinstall-probed-profile-shell-loader
      - id: micro-behaviors/os/package-manager/runtime-install::node-exec-scoped-registry-install
