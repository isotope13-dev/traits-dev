defaults:
  platforms: [unix]
  for: [swift, tar, zip]
  crit: hostile
  attack: T1195.002,T1561.002
  mbc: E1561

composite_rules:
  - id: swiftpm-package-raw-disk-wiper
    desc: Swift package ships raw disk wiper
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/ecosystem::swift-package-description-import
      - id: objectives/impact/wipe/disk/device::source-mounted-dynamic-dd-wiper
