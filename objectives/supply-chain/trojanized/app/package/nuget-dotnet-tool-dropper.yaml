# Malicious NuGet global tools that ship a downloader/launcher binary.
defaults:
  for: [nupkg, archives]
  platforms: [windows, unix]
  attack: T1195.002

traits:
  - id: dotnet-tool-manifest-entry
    desc: NuGet package declares a dotnet tool command
    crit: notable
    conf: 0.9
    for: [nupkg]
    if:
      type: text
      regex: '<DotNetCliTool|<packageType name="DotnetTool"'

composite_rules:
  - id: nuget-dotnet-tool-hidden-exe-dropper
    desc: NuGet dotnet tool ships hidden-shell remote EXE dropper
    crit: hostile
    conf: 0.98
    attack: "T1195.002,T1105,T1059.001"
    scope: outer
    all:
      - id: dotnet-tool-manifest-entry
      - id: objectives/command-and-control/dropper/delivery/download-execute::dotnet-github-hidden-shell-exe-dropper
