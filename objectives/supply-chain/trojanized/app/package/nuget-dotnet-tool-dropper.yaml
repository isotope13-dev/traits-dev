# Malicious NuGet packages that ship a downloader/launcher binary — global
# tools or lib/ target-framework DLL droppers.
defaults:
  crit: hostile
  for: [nupkg]
  platforms: [windows, unix]
  attack: T1195.002

composite_rules:
  - id: nuget-package-transformed-shell-loader
    desc: NuGet package ships transformed command shell loader
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1059.004
    scope: archive
    for: [nupkg, csharp]
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: objectives/execution/payload/script-eval/transformed/shell::hex-xor-command-shell-loader
  - id: nuget-package-startup-shortcut-dropper
    desc: NuGet package ships startup shortcut remote command dropper
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1547.001
    scope: archive
    for: [nupkg, csharp]
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: objectives/persistence/login/startup/shortcut::startup-shortcut-remote-command-dropper
  - id: nuget-package-run-key-beacon-dropper
    desc: NuGet package ships Run key node beacon dropper
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1547.001
    scope: archive
    for: [nupkg, csharp]
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: objectives/persistence/login/registry/script::csharp-run-key-node-beacon
  - id: nuget-package-raw-disk-wiper
    desc: NuGet package ships raw disk wiper
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1561.002
    scope: archive
    for: [nupkg, csharp]
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: objectives/impact/wipe/disk/device::source-mounted-dynamic-dd-wiper
  - id: nuget-package-credential-dns-exfil
    desc: NuGet package exfiltrates developer credentials via DNS
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1048.003,T1552.001
    scope: archive
    for: [nupkg, csharp]
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: objectives/exfiltration/stealer/credential/record::hex-developer-credential-dns-exfil

  - id: nuget-package-safe-storage-cookie-exfil
    desc: NuGet package exfiltrates Chrome Safe Storage key and cookies
    conf: 0.99
    attack: T1195.002,T1555.003,T1041
    scope: archive
    for: [nupkg, csharp]
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: objectives/exfiltration/stealer/application-state/cookie/store::dotnet-safe-storage-cookie-http-exfil

  - id: nuget-package-zero-width-command-loader
    desc: NuGet package executes shell command decoded from zero-width steganography
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1027.003,T1059.004
    scope: archive
    for: [nupkg, csharp]
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: objectives/anti-static/obfuscation/steganography/invisible-unicode::zero-width-command-loader

  - id: nuget-lib-chrome-policy-download-loader
    desc: NuGet library ships Chrome force-install and download launcher
    conf: 0.97
    attack: T1195.002,T1176,T1105
    scope: archive
    for: [nupkg, pe, dll]
    all:
      - id: metadata/package/files/nuget::nupkg-managed-library-member
    any:
      - id: objectives/impact/ui/manipulation/browser::force-extension-scheduled-dll-api-set
      - id: objectives/impact/ui/manipulation/browser::force-extension-executable-fetch-api-set
    needs: 2
