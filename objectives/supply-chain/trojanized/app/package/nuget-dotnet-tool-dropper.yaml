# Malicious NuGet packages that ship a downloader/launcher binary — global
# tools or lib/ target-framework DLL droppers.
defaults:
  crit: hostile
  for: [nupkg]
  platforms: [windows, unix]
  attack: T1195.002

composite_rules:
  - id: nuget-package-transformed-shell-loader
    desc: NuGet package ships transformed command shell loader
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1059.004
    scope: archive
    for: [nupkg, csharp]
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: objectives/execution/payload/script-eval/transformed/shell::hex-xor-command-shell-loader
  - id: nuget-package-startup-shortcut-dropper
    desc: NuGet package ships startup shortcut remote command dropper
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1547.001
    scope: archive
    for: [nupkg, csharp]
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: objectives/persistence/login/startup/shortcut::startup-shortcut-remote-command-dropper
  - id: nuget-package-run-key-beacon-dropper
    desc: NuGet package ships Run key node beacon dropper
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1547.001
    scope: archive
    for: [nupkg, csharp]
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: objectives/persistence/login/registry/script::csharp-run-key-node-beacon
  - id: nuget-lib-chrome-policy-download-loader
    desc: NuGet library ships Chrome force-install and download launcher
    conf: 0.97
    attack: T1195.002,T1176,T1105
    scope: archive
    for: [nupkg, pe, dll]
    all:
      - id: metadata/package/files/nuget::nupkg-managed-library-member
    any:
      - id: objectives/impact/ui/manipulation/browser::force-extension-scheduled-dll-api-set
      - id: objectives/impact/ui/manipulation/browser::force-extension-executable-fetch-api-set
    needs: 2
