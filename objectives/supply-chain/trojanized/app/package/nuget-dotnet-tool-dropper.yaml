# Malicious NuGet packages that ship a downloader/launcher binary — global
# tools or lib/ target-framework DLL droppers.
defaults:
  crit: hostile
  for: [nupkg, archives]
  platforms: [windows, unix]
  attack: T1195.002

composite_rules:
  - id: nuget-dotnet-tool-hidden-exe-dropper
    desc: NuGet dotnet tool ships hidden-shell remote EXE dropper
    conf: 0.98
    attack: "T1195.002,T1105,T1059.001"
    scope: outer
    all:
      - id: metadata/package/entrypoint::dotnet-tool-command-manifest
      - id: objectives/command-and-control/dropper/delivery/execute-download::dotnet-github-hidden-shell-exe-dropper

  - id: nuget-lib-hidden-github-exe-dropper
    desc: NuGet lib package ships GitHub hidden-shell EXE dropper
    conf: 0.98
    attack: T1195.002,T1105,T1059.001
    scope: archive
    for: [nupkg]
    all:
      - id: metadata/package/files/nuget::nupkg-managed-library-member
      - id: objectives/command-and-control/dropper/delivery/execute-download::dotnet-github-hidden-shell-exe-dropper

  - id: nuget-lib-hidden-remote-exe-launcher
    desc: NuGet lib package downloads remote EXE with hidden launch
    conf: 0.97
    attack: T1195.002,T1105,T1059.001
    scope: archive
    for: [nupkg]
    all:
      - id: metadata/package/files/nuget::nupkg-single-executable-member
      - id: objectives/command-and-control/dropper/delivery/execute-download::dotnet-remote-exe-download-hidden-launch
