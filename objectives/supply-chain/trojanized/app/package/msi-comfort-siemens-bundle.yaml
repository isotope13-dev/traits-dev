defaults:
  platforms: [windows]
  for: [msi, oledoc]
  attack: T1195.002

composite_rules:
  - id: comfort-msi-bundles-siemens-software-center
    desc: Comfort MSI drops and launches Siemens Software Center
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/installer/database::msi-comfort-provisioning-branding
      - id: metadata/binary/installer/database::msi-siemens-software-center-executable
      - id: metadata/binary/installer/database::msi-wix-shell-exec-siemens-launch
      - id: metadata/binary/installer/database::wix-authored-msi
