defaults:
  platforms: [windows]
  for: [msi, oledoc]
  attack: T1195.002

composite_rules:
  - id: comfort-msi-bundles-siemens-software-center
    desc: Comfort MSI drops and launches Siemens Software Center
    crit: hostile
    conf: 0.98
    all:
      - id: well-known/app/productivity/comfort-software::msi-comfort-provisioning-branding
      - id: metadata/package/files/msi-content::msi-siemens-software-center-executable
      - id: well-known/app/enterprise/siemens-software-center::wix-siemens-executable-reference
      - id: well-known/tool/packaging/wix::wix-authored-msi
