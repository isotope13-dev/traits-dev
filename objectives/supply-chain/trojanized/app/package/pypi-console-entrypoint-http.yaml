defaults:
  platforms: [unix, windows]
  attack: T1071.001
  mbc: B0030

composite_rules:
  # A published console package contains a minimal one-function Python module
  # that makes a cleartext GET and labels it as JSON. The package-level
  # evidence does not prove which entry point reaches the module, but it
  # distinguishes this unexplained network probe from a standalone script.
  - id: pypi-console-entrypoint-cleartext-request
    desc: PyPI console package contains a minimal HTTP probe
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/ecosystem::pkginfo-core-metadata
      - id: metadata/package/scripts/entrypoint::console-header-in-entry-points-file
      - id: metadata/lang/source/shape::python-imports-and-function-module
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/communications/http/request/client::single-requests-httpx-call
      - id: micro-behaviors/communications/url/scheme::python-cleartext-http-url-literal
      - id: micro-behaviors/communications/http/header/content-type::python-json-content-type
