defaults:
  platforms: [windows]
  for: [oledoc]
  attack: T1195.002

composite_rules:
  # libmemu.dll shipped by an installer database whose own summary identity
  # never mentions MEmu/Microvirt: the emulator runtime is being repackaged
  # under someone else's product name. The "not MEmu" half is expressed as
  # `unless:` on positive identity atoms — a bare "Subject exists and is not
  # MEmu" atom matches every OLE2 container ever written.
  - id: msi-memu-runtime-under-unrelated-identity
    desc: MSI repackages MEmu runtime under unrelated product and creator metadata
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/profile/identity::msi-memu-runtime-file-family
      - id: metadata/package/files/msi::msi-installation-database-title
      - id: metadata/document/office/properties::office-subject-present
      - id: metadata/document/ole::ole-creator-field
    unless:
      - id: metadata/document/office/properties::office-subject-memu-runtime
      - id: metadata/document/office/properties::office-creator-microvirt

  # Large WiX MSI whose summary claims Altova "SMTC UI Broker" — a fabricated
  # product identity used to wrap unrelated vendor binaries. Summary-stream
  # only: cab members are not expanded from the MSI container.
  - id: msi-altova-smtc-broker-repack-lure
    desc: Large Altova SMTC UI Broker MSI repack lure
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1036.005
    size_min: 5000000
    all:
      - id: metadata/package/files/msi::msi-smtc-ui-broker-subject
      - id: metadata/package/files/msi::msi-altova-creator
      - id: metadata/package/files/msi::msi-installation-database-title
      - id: metadata/package/files/msi::ole-security-flag
      - id: metadata/package/files/msi::msi-wix-toolset-application-metadata
