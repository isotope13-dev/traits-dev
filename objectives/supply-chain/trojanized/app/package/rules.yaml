defaults:
  platforms: [unix, windows]
  for: [javascript]

composite_rules:
  - id: npm-preinstall-discord-stealer
    desc: "NPM package executes Node script on install to exfiltrate system data to Discord"
    crit: hostile
    scope: archive
    for: [javascript, package.json, npm, tar]
    all:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-api
      - id: metadata/package/scripts/lifecycle::npm-preinstall-script
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
  - id: npm-package-shell-history-stealer
    desc: NPM package steals and exfiltrates shell history
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1552.003,T1041
    scope: archive
    for: [javascript, typescript, package.json, npm, tar]
    all:
      - id: metadata/package/scripts/lifecycle::filtered-prepare-hook
      - id: micro-behaviors/fs/read/file/history::shell-history-path-near-file-read
      - id: micro-behaviors/communications/http/post::request-options-post-method

  - id: npm-package-clipboard-replacer
    desc: NPM package runs background PowerShell clipboard replacer
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1115,T1565.001
    scope: archive
    for: [javascript, typescript, package.json, npm, tar]
    all:
      - id: metadata/filename/identity::package-json-basename
      - id: objectives/impact/crypto-manipulation/clipboard::gated-detached-powershell-wallet-clipper

  - id: npm-package-whois-c2-channel
    desc: NPM package ships WHOIS dead-drop C2 resolver
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1071.004,T1102.001
    scope: archive
    for: [javascript, typescript, package.json, npm, tar]
    all:
      - id: metadata/filename/identity::package-json-basename
      - id: objectives/command-and-control/channel/deaddrop/public-service::source-whois-ipv4-dead-drop

  - id: npm-package-user-data-wiper
    desc: NPM package recursively wipes user home directories
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1485
    scope: archive
    for: [javascript, typescript, package.json, npm, tar]
    all:
      - id: metadata/filename/identity::package-json-basename
      - id: objectives/impact/destroy/user-data::node-personal-folders-recursive-delete
