defaults:
  platforms:
  - linux
  - windows
  - macos
  for:
  - javascript
  - typescript
  - package.json
traits:
- id: ghost-admin-api-key-signing-marker
  desc: Ghost Admin API key signing helper
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: GHOST_GOLDEN_POST_AUTH
- id: ghost-theme-preview-marker
  desc: Ghost theme preview iframe renderer
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: x-ghost-preview
- id: ghost-settings-secret-validation-marker
  desc: Ghost settings secret validation
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: stripe_connect_secret_key
- id: ghost-tinybird-analytics-marker
  desc: Ghost Tinybird analytics helper
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: TINYBIRD_ADMIN_TOKEN
- id: collaboration-space-join-event
  desc: Collaboration join event string
  crit: notable
  conf: 0.9
  if:
    type: text
    word: space:join
- id: svelte-runtime-dirty-check-fragment
  desc: Svelte runtime dirty-check fragment
  crit: baseline
  conf: 1.0
  for:
  - javascript
  if:
    type: text
    substr: t.dirty=[-1],t.fragment&&t.fragment.p
- id: brackets-perf-concat-bundle
  desc: Brackets performance concat bundle
  crit: notable
  conf: 0.99
  for:
  - javascript
  if:
    type: path
    basename: true
    exact: brackets-concat.js
- id: parcel-plugin-transformer-marker
  desc: Parcel plugin transformer source
  crit: notable
  conf: 0.98
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: from '@parcel/plugin'
- id: auth-token-invalid-string
  desc: Auth error catalog token-invalid entry
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?s)AUTH_ERROR_CODES.{0,400}auth\.token_invalid
- id: source-basic-payment-auth-contract
  desc: Source payment client uses Basic auth
  crit: notable
  conf: 0.92
  for:
  - javascript
  if:
    type: text
    regex: Basic[^\n]{0,160}\b(keyId|keySecret)\b
composite_rules:
- id: malicious-package-manifest
  desc: Hidden manifest payload with exfil/agent text
  crit: hostile
  conf: 0.95
  for:
  - package.json
  all:
  - id: objectives/supply-chain/hidden-payload
  - id: metadata/filename/identity::package-json-basename
  any:
  - id: objectives/exfiltration
  - id: micro-behaviors/data/serialize/binary::ruby-tcp-base64-marshal-exfil
  - id: micro-behaviors/data/serialize/envelope::go-file-exfil-tcp
  - id: micro-behaviors/data/serialize/envelope::rust-file-exfil-record
  - id: micro-behaviors/data/serialize/schema-credential::json-serializes-npmrc-content
  - id: micro-behaviors/data/serialize/schema-credential::rust-cred-exfil-record
  - id: micro-behaviors/data/serialize/schema-credential::rust-wallet-secret-json-template
  - id: micro-behaviors/data/serialize/schema-credential::trufflehog-detector-raw-fields
  - id: micro-behaviors/data/serialize/schema-credential::trufflehog-message-body-detector-field
  - id: micro-behaviors/data/serialize/schema-credential::trufflehog-raw-result-message-body
  - id: micro-behaviors/data/llm/agent::ai-agent-addressing-phrase
  - id: micro-behaviors/data/llm/agent::tool-result-history-append
  unless:
  - id: metadata/lang/shebang::ruby
  - id: metadata/import/ruby
- id: npm-dist-secret-credential-diversion
  desc: NPM distribution diverts a payment secret to a suspicious host
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1041
  mbc: E1041
  for:
  - npm
  - tar
  - zip
  - javascript
  - package.json
  scope: archive
  all:
  - id: metadata/path/development::javascript-src-tree-member
  - id: metadata/package/files/runtime::javascript-dist-tree-artifact
  - id: metadata/package/entrypoint/module::main-dist-entrypoint
  - id: source-basic-payment-auth-contract
  - id: micro-behaviors/communications/http/authorization-header::js-bearer-header-from-secret-variable
  - id: objectives/command-and-control/infrastructure/domain/tld::suspicious-tld
- id: auth-token-error-catalog-marker
  desc: Authentication token error catalog marker
  crit: notable
  conf: 0.9
  all:
  - id: metadata/lang/source/naming/setting::auth-error-codes-identifier-text
  - id: auth-token-invalid-string
- id: cleartext-dotenv-exfil-marker
  for:
  - javascript
  desc: Cleartext dotenv HTTP exfiltration marker
  crit: notable
  conf: 0.9
  all:
  - id: objectives/credential-access/env/dotenv::js-dotenv-read
  - id: micro-behaviors/communications/http/request/client::http-client-usage
- id: suspicious-hidden-listener
  for:
  - javascript
  desc: Hidden HTTP listener provides a credential-exfiltration channel
  crit: suspicious
  conf: 0.9
  scope: file
  all:
  - id: micro-behaviors/communications/http/server/listener::nodejs-http-server
  - id: objectives/command-and-control/channel
  - id: objectives/exfiltration/stealer/credential::credential-exfiltration-network-sink
  any:
  - id: objectives/supply-chain/hidden-payload
  - id: objectives/anti-static/obfuscation
