# npm CLI packages that fingerprint hosts through systeminformation and POST
# the hardware/MAC payload to a remote endpoint at runtime (not install hooks).
defaults:
  platforms: [unix, windows]
  for: [npm]
  attack: T1195.002,T1041,T1082
  mbc: E1041

composite_rules:
  - id: npm-cli-systeminformation-exfil
    desc: npm CLI exfiltrates systeminformation host fingerprint
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/package/manifest/entrypoint::bin-field-declared
      - id: objectives/discovery/system/fingerprint/hardware::systeminformation-import
      - id: objectives/discovery/system/fingerprint/hardware::si-uuid-call
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/data/source/syntax/schema::hardware-macs-field-pair
