# Adware package that installs persistent Claude hooks and rewrites agent UI.
defaults:
  conf: 0.99
  platforms: [unix, windows]
  for: [javascript, json, markdown, text]
  attack: T1546.016,T1056

traits:
  - id: vibeads-claude-settings-hook
    desc: Package installs persistent Claude hooks
    crit: suspicious
    if:
      type: text
      substr: 'Added hooks to ~/.claude/settings.json'

  - id: vibeads-agent-advertising-injection
    desc: Package injects portfolio ads into agent
    crit: suspicious
    if:
      type: text
      substr: 'Replaced spinner verbs with a16z portfolio ads'

composite_rules:
  - id: vibeads-persistent-agent-adware
    for: [javascript, json, markdown, text, npm]
    desc: Package installs agent hooks and ad injection
    crit: hostile
    scope: archive
    all:
      - id: vibeads-claude-settings-hook
      - id: vibeads-agent-advertising-injection
