defaults:
  platforms: [unix, windows]
  for: [elf, zip]
  attack: T1195.002

traits:
  - id: native-docker-marker-probe
    desc: Native binary probes Docker marker
    crit: notable
    conf: 0.96
    for: [elf]
    if:
      type: raw
      regex: 'fs13\.statSync\("/\.dockerenv"\)[\s\S]{0,0}'
  - id: native-docker-cgroup-probe
    desc: Native binary checks Docker cgroup
    crit: notable
    conf: 0.96
    for: [elf]
    if:
      type: raw
      regex: 'fs13\.readFileSync\("/proc/self/cgroup", "utf8"\)\.includes\("docker"\)[\s\S]{0,0}'
  - id: native-plugin-download-function
    desc: Native binary has plugin download routine
    crit: notable
    conf: 0.96
    for: [elf]
    if:
      type: raw
      regex: 'downloadAndExtract\(url, expectedChecksum, fullName, version, pluginType\)[\s\S]{0,0}'
  - id: native-plugin-download-write
    desc: Native binary writes plugin temp archive
    crit: notable
    conf: 0.96
    for: [elf]
    if:
      type: raw
      regex: 'await fs12\.writeFile\(tempFile, buffer\)[\s\S]{0,0}'
  - id: native-plugin-archive-extract
    desc: Native binary extracts plugin archive
    crit: notable
    conf: 0.96
    for: [elf]
    if:
      type: raw
      regex: 'await extract\(\{ file: tempFile, cwd: targetDir, strip: 0 \}\)[\s\S]{0,0}'
  - id: native-claude-plugin-target
    desc: Native binary targets Claude .claude
    crit: notable
    conf: 0.96
    for: [elf]
    if:
      type: raw
      regex: 'globalDir:\s*path\.join\(homeDir, "\.claude"\)|const prefix = "\.claude/"[\s\S]{0,0}'

composite_rules:
  - id: native-docker-aware-claude-plugin-stager
    desc: Binary probes Docker and stages Claude plugin
    crit: suspicious
    conf: 0.99
    for: [elf]
    scope: file
    all:
      - id: native-docker-marker-probe
      - id: native-docker-cgroup-probe
      - id: native-plugin-download-function
      - id: native-plugin-download-write
      - id: native-plugin-archive-extract
      - id: native-claude-plugin-target
  - id: packaged-docker-aware-claude-plugin-stager
    desc: Package ships Docker-aware Claude stager
    crit: hostile
    conf: 0.99
    for: [zip]
    scope: archive
    attack: T1195.002,T1105,T1497.001
    all:
      - id: native-docker-marker-probe
      - id: native-docker-cgroup-probe
      - id: native-plugin-download-function
      - id: native-plugin-download-write
      - id: native-plugin-archive-extract
      - id: native-claude-plugin-target
