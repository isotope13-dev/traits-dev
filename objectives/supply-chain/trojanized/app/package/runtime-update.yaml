defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  attack: T1195.002

traits:
  - id: stage-package-update-call
    desc: Stages a package update
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: text
      word: stagePackageUpdate

  - id: registry-source-marker
    desc: Registry source generation marker
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: text
      substr: 'source: "registry"'
    unless:
      - id: metadata/lang/source/naming/action/token::update-check-helper-name-reference
      - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
      - id: well-known/tool/detection/code-analysis/semgrep::rule-pack-fixture

  - id: activate-package-generation-call
    desc: Activates a package generation
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: text
      word: activatePackageGeneration

  # A newer release is selected by asking the npm registry for this package's
  # mutable latest tag, then installing a version interpolated into the scope.
  # The URL encodes the slash in the scope, as npm's scoped metadata endpoint
  # requires.
  - id: scoped-npm-latest-endpoint
    desc: Queries latest scoped npm package version
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: text
      regex: 'registry\.npmjs\.org/@[a-z0-9_-]{1,40}%2[fF]\$\{name\}/latest'

  - id: scoped-npm-latest-install
    desc: Installs scoped package at queried version
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: text
      regex: '`@[a-z0-9_-]{1,40}/\$\{name\}@\$\{latest\}`'

  - id: linux-update-timer-interval
    desc: Sets recurring service update interval
    crit: component
    conf: 0.98
    for: [javascript]
    if:
      type: text
      substr: OnUnitInactiveSec=10min

  - id: linux-update-timer-enable
    desc: Enables recurring update timer
    crit: component
    conf: 0.98
    for: [javascript]
    if:
      type: text
      regex: 'systemctl\("enable",\s*"--now",\s*`\$\{unit\}\.timer`\)'

  - id: mac-update-agent-interval
    desc: Sets recurring update agent interval
    crit: component
    conf: 0.98
    for: [javascript]
    if:
      type: text
      substr: '<key>StartInterval</key><integer>600</integer>'

  - id: mac-update-agent-enable
    desc: Loads recurring update agent
    crit: component
    conf: 0.98
    for: [javascript]
    if:
      type: text
      regex: '"bootstrap",\s*domain\(\),\s*file'

  - id: scheduled-update-command
    desc: Schedules service update command
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: text
      regex: '"service",\s*"update"'

  - id: update-promotes-and-restarts-release
    desc: Promotes update and restarts service
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: text
      regex: 'activateRelease\(name,\s*release\)[\s\S]{0,100}restartService\(name\)'

composite_rules:
  - id: npm-latest-background-update-check
    desc: Delayed check for latest npm release
    crit: suspicious
    conf: 0.98
    for: [javascript]
    near_lines: 120
    all:
      - id: micro-behaviors/communications/http/services/registry::npm-latest-release-endpoint
      - id: micro-behaviors/time/schedule/timeout::setTimeout
      - id: stage-package-update-call

  - id: registry-generation-activation
    desc: Activates registry package generation
    crit: suspicious
    conf: 0.98
    for: [javascript]
    near_lines: 120
    all:
      - id: registry-source-marker
      - id: activate-package-generation-call

  - id: background-package-self-update
    desc: Plugin provisions and activates a newer npm release in the background
    crit: suspicious
    conf: 0.98
    scope: archive
    for: [javascript, npm, tar]
    all:
      - id: npm-latest-background-update-check
      - id: registry-generation-activation

  - id: remote-update-reaches-host-binary-replacement
    desc: Background npm update can reach host executable replacement
    crit: hostile
    conf: 0.995
    scope: archive
    for: [javascript, npm, tar]
    attack: T1195.002,T1105
    all:
      - id: micro-behaviors/communications/http/services/registry::npm-latest-release-endpoint
      - id: micro-behaviors/time/schedule/timeout::setTimeout
      - id: stage-package-update-call
      - id: registry-source-marker
      - id: activate-package-generation-call
      - id: objectives/supply-chain/trojanized/app/replace::renames-official-host-path
      - id: objectives/supply-chain/trojanized/app/replace::copies-patched-host-path
      - id: objectives/supply-chain/trojanized/app/replace::selfpatch-starts-on-plugin-load

  - id: linux-enabled-npm-update-timer
    desc: Enables recurring npm self-update timer
    crit: notable
    conf: 0.98
    for: [javascript]
    all:
      - id: linux-update-timer-interval
      - id: linux-update-timer-enable
      - id: scheduled-update-command

  - id: mac-enabled-npm-update-agent
    desc: Loads recurring npm self-update agent
    crit: notable
    conf: 0.98
    for: [javascript]
    all:
      - id: mac-update-agent-interval
      - id: mac-update-agent-enable
      - id: scheduled-update-command

  - id: enabled-recurring-npm-update-scheduler
    desc: Enables recurring npm update schedule
    crit: notable
    conf: 0.98
    for: [javascript]
    all:
      - id: scheduled-update-command
    any:
      - id: linux-enabled-npm-update-timer
      - id: mac-enabled-npm-update-agent

  - id: unattended-latest-npm-self-update
    desc: Recurring service downloads and activates its latest release
    crit: hostile
    conf: 0.98
    scope: archive
    for: [javascript, npm, tar]
    attack: T1195.002,T1105
    all:
      - id: scoped-npm-latest-endpoint
      - id: scoped-npm-latest-install
      - id: enabled-recurring-npm-update-scheduler
      - id: update-promotes-and-restarts-release
