defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  attack: T1195.002

traits:
  - id: npm-latest-release-endpoint
    desc: Latest-release npm registry endpoint
    crit: component
    conf: 0.98
    for: [javascript]
    if:
      type: text
      regex: 'registry\.npmjs\.org/\$\{PACKAGE_NAME\}/latest'

  - id: delayed-stage-package-update
    desc: Delayed package update call
    crit: component
    conf: 0.98
    for: [javascript]
    if:
      type: text
      regex: 'setTimeout\(\(\)\s*=>'

  - id: stage-package-update-call
    desc: Stages a package update
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: text
      word: stagePackageUpdate

  - id: registry-source-marker
    desc: Registry source generation marker
    crit: component
    conf: 0.98
    for: [javascript]
    if:
      type: text
      substr: 'source: "registry"'

  - id: activate-package-generation-call
    desc: Activates a package generation
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: text
      word: activatePackageGeneration

composite_rules:
  - id: npm-latest-background-update-check
    desc: Delayed check for latest npm release
    crit: suspicious
    conf: 0.98
    for: [javascript]
    near_lines: 120
    all:
      - id: npm-latest-release-endpoint
      - id: delayed-stage-package-update
      - id: stage-package-update-call

  - id: registry-generation-activation
    desc: Activates registry package generation
    crit: suspicious
    conf: 0.98
    for: [javascript]
    near_lines: 120
    all:
      - id: registry-source-marker
      - id: activate-package-generation-call

  - id: background-package-self-update
    desc: Plugin provisions and activates a newer npm release in the background
    crit: suspicious
    conf: 0.98
    scope: archive
    for: [javascript, npm, tar, archives]
    all:
      - id: npm-latest-background-update-check
      - id: registry-generation-activation

  - id: remote-update-reaches-host-binary-replacement
    desc: Background npm update can reach host executable replacement
    crit: hostile
    conf: 0.995
    scope: archive
    for: [javascript, npm, tar, archives]
    attack: T1195.002,T1105
    all:
      - id: npm-latest-release-endpoint
      - id: delayed-stage-package-update
      - id: stage-package-update-call
      - id: registry-source-marker
      - id: activate-package-generation-call
      - id: objectives/supply-chain/trojanized/app/replace::renames-official-host-path
      - id: objectives/supply-chain/trojanized/app/replace::copies-patched-host-path
      - id: objectives/supply-chain/trojanized/app/replace::selfpatch-starts-on-plugin-load
