defaults:
  platforms: [unix, windows]
  for: [php]

traits:
  - id: request-base64-file-write-template
    desc: Template writes decoded request data
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'file_put_contents\s*\([^\r\n]{0,100}base64_decode\s*\('
  - id: wordpress-plugin-archive-builder
    desc: Packages generated WordPress plugin
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: packZipArchive
  - id: generated-immutable-php-template
    desc: Generated script marks itself immutable
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: chattr +i
  - id: wordpress-trojan-plugin-label
    desc: Generated plugin labeled as Trojan
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: TrojanPlugin
  - id: request-input-reference
    desc: Template refers to request input
    crit: baseline
    conf: 0.95
    if:
      type: text
      substr: '$_REQUEST'

composite_rules:
  - id: wordpress-immutable-upload-plugin-generator
    desc: Generates disguised request-driven upload plugin
    crit: hostile
    conf: 0.98
    attack: T1505.003,T1027
    all:
      - id: request-base64-file-write-template
      - id: wordpress-plugin-archive-builder
      - id: generated-immutable-php-template
      - id: wordpress-trojan-plugin-label
      - id: request-input-reference
