# Cross-IDE AI assistant prompt injection
# Intent rules live here; raw IDE command IDs live under micro-behaviors.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, markdown, html, text, shell, powershell]
  attack: T1195.002

traits:
  - id: hidden-comment-agent-target
    desc: Hidden comment addresses AI agent with directive
    crit: notable
    conf: 0.96
    if:
      type: text
      # A comment that labels an AI-agent section is ordinary documentation.
      # Require an instruction after the addressee so this atom describes
      # agent-directed content, not a dashboard heading such as "AI Agent".
      regex: '(?is)<!--[^>]{0,220}\bAI agents?\b.{0,80}\b(ignore|grant|print|run|send|reveal)\b'

  - id: hidden-comment-source-control-exfil
    desc: Hidden comment sends source-control credentials
    crit: suspicious
    conf: 0.99
    attack: T1195.002,T1552.004,T1041
    if:
      type: text
      regex: '(?is)<!--.{0,900}\.git-credentials\b.{0,220}\b(curl|wget)\b.{0,180}-X\s*POST\b'

composite_rules:
  - id: hidden-coding-agent-shell-injection
    desc: Hidden agent-directed remote shell injection
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1059.004,T1105
    all:
      - id: metadata/lang/source/syntax/command/pipeline::html-comment-remote-shell-pipeline
    any:
      - id: hidden-comment-agent-target
      - id: micro-behaviors/data/llm/agent::coding-agent-reference
    near_bytes: 800
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/

      - id: metadata/path::test-directory-component
  - id: hidden-coding-agent-credential-exfil
    desc: Hidden coding-agent instruction exfiltrates credentials
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1552.004,T1041
    all:
      - id: hidden-comment-agent-target
      - id: hidden-comment-source-control-exfil
    near_bytes: 2400
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
      - id: metadata/path::test-directory-component
