# Cross-IDE AI assistant prompt injection
# Intent rules live here; raw IDE command IDs live under micro-behaviors.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, markdown, html, text, shell, powershell]
  attack: T1195.002

traits:
  - id: hidden-comment-agent-target
    desc: Hidden comment targets coding agent
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)<!--[^>]{0,500}\b(AI|automated|coding)\s+agents?\b'

  - id: hidden-comment-remote-shell-command
    desc: Hidden comment carries remote shell pipeline
    crit: suspicious
    conf: 0.98
    attack: T1059.004,T1105
    if:
      type: text
      regex: '(?is)<!--[^>]{0,200}\b(curl|wget)(\.exe)?\b.{0,160}\|\s*((/usr/bin/|/bin/)?(sh|bash))\b'

  - id: hidden-comment-source-control-exfil
    desc: Hidden comment sends source-control credentials
    crit: suspicious
    conf: 0.99
    attack: T1195.002,T1552.004,T1041
    if:
      type: text
      regex: '(?is)<!--.{0,900}\.git-credentials\b.{0,220}\b(curl|wget)\b.{0,180}-X\s*POST\b'

composite_rules:
  - id: hidden-coding-agent-shell-injection
    desc: Hidden agent-directed remote shell injection
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1059.004,T1105
    all:
      - id: hidden-comment-agent-target
      - id: hidden-comment-remote-shell-command
    near_bytes: 800
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/

  - id: hidden-coding-agent-review-override
    desc: Hidden comment overrides coding-agent review
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1562
    all:
      - id: hidden-comment-agent-target
      - id: objectives/evasion/security-bypass/llm/override::llm-ignore-prior-instructions
    near_bytes: 800
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/

  - id: hidden-coding-agent-credential-exfil
    desc: Hidden coding-agent instruction exfiltrates credentials
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1552.004,T1041
    all:
      - id: hidden-comment-agent-target
      - id: hidden-comment-source-control-exfil
    near_bytes: 2400
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
