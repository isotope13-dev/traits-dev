defaults:
  platforms:
  - linux
  - windows
  - macos
  for:
  - javascript
  - typescript
  - package.json
composite_rules:
- id: hostile-obfuscated-ip-exfiltration
  for:
  - javascript
  desc: Exfiltrates data to an obfuscated hardcoded IP address
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  - id: micro-behaviors/communications/url/encoded::http-b64-protocol-fragment
  - id: micro-behaviors/data/serialize/json::json-stringify-post-body
- id: hostile-hidden-stager
  for:
  - javascript
  desc: Obfuscated JS evals or drops decoded stage
  crit: hostile
  conf: 0.95
  scope: leaf
  near_bytes: 2048
  all:
  - id: metadata/lang/source/naming/variable::hex-variable-names
  - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64
  any:
  - id: micro-behaviors/process/interpreter/eval/direct
  - id: micro-behaviors/process/interpreter/eval/decoded::js-eval-url-decoded
  - id: micro-behaviors/process/interpreter/eval/decoded::js-eval-final-line-base64
  - id: micro-behaviors/process/interpreter/eval/decoded::js-eval-decode-named-helper
  - id: micro-behaviors/process/interpreter/eval/python-builtins/
  - id: micro-behaviors/process/interpreter/eval/constructed/
  - id: micro-behaviors/fs/write/file/executable/
  unless:
  - id: well-known/app/ai/coding-agent/bandit-stealth::bandit-stealth-extension-context
  - id: metadata/build/minifier::js-large-minified-bundle
- id: suspicious-npm-imposter
  for:
  - packagejson
  desc: Theft-themed npm package with placeholder version
  crit: suspicious
  conf: 0.85
  all:
  - id: objectives/supply-chain/impersonation/name::name-theft-target-combo
  - id: metadata/package/versioning/sentinel::npm-version-0-0-0
