defaults:
  platforms: [linux, windows, macos]
  for: [javascript, typescript, package.json]
composite_rules:
  - id: hostile-obfuscated-ip-exfiltration
    desc: Exfiltrates data to an obfuscated hardcoded IP address
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/communications/url/encoded::http-b64-protocol-fragment
      - id: objectives/collection/stealer/browser::json-stringify-post-body

  - id: hostile-hidden-stager
    desc: Obfuscated JS stager decoding payloads
    crit: hostile
    conf: 0.95
    # A stager hides its own decode call, so the obfuscated names and the decode
    # are the same body of code. Without that constraint, hex names anywhere in
    # a commercially protected application bundle joined a `Buffer.from`
    # anywhere else in its 7MB, and every obfuscated marketplace extension read
    # as a stager. `leaf` keeps the pair inside one decoded layer; 2KB is what
    # "the same function" costs even on a single minified line.
    scope: leaf
    near_bytes: 2048
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-variable-names
      - id: micro-behaviors/data/decode/base64-symbol::buffer-from-base64
    unless:
      - id: well-known/app/ai/coding-agent/bandit-stealth::bandit-stealth-extension-context
      - id: metadata/build/minifier::js-large-minified-bundle

  - id: suspicious-npm-imposter
    desc: Theft-themed npm package with placeholder version
    crit: suspicious
    conf: 0.85
    all:
      - id: objectives/supply-chain/impersonation/name::name-theft-target-combo
      - id: metadata/package/versioning/sentinel::npm-version-0-0-0
