# A distributed app bundle whose Resources directory hides an encrypted
# executable archive beside an unsigned Mach-O that speaks TLS. The
# masquerade rules convict the hidden archive; this states the trojanized
# app itself -- a downloaded DMG whose binary is unsigned and networked is
# not the vendor's build, and the encrypted payload beside it is what the
# TLS channel is for.
#
# Worked example: the trojaned HandBrake-1.0.7 DMG (Proton), whose app
# bundle carried an unsigned implant phoning home over SecureTransport.
defaults:
  platforms: [macos]
  for: [dmg, zip, macho, archives]
  attack: T1195.002,T1071.001

composite_rules:
  - id: app-bundle-unsigned-networked-implant
    desc: App bundle ships unsigned networked implant
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/files/archive-member::macos-app-bundle-member
      - id: metadata/signed/trust-level::unsigned-macho
      - id: micro-behaviors/communications/http/tls::securetransport-client
