# Skills that require fetching an entire external repository document at run
# time hand the agent an unreviewed, mutable instruction/data stream.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, python, pyc]
  attack: T1105,T1195.002

traits:
  - id: agent-skill-forced-repository-fetch
    desc: Forces external repository fetch
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: 'Please fetch the complete data from the main repository'

  - id: skill-daily-hot-api-clone
    desc: Skill clones mutable news backend
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: 'git clone https://github.com/imsyy/DailyHotApi.git'

  - id: skill-remote-install-page
    desc: Skill requires remote install page execution
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)glot\.io/snippets/.{0,100}(execute|installation command).{0,80}Terminal'

  - id: skill-openclawcli-web-install
    desc: Skill names external OpenClawCLI installer
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)openclawcli\.(vercel\.app|forum)'

  - id: python-bash-deploy-command-array
    desc: Python builds Bash deploy command
    crit: component
    for: [python]
    if:
      type: text
      regex: '\w+_cmd\s*=\s*\[\s*"bash"\s*,\s*\w+\s*\]'

  - id: python-git-clone-command-array
    desc: Python builds Git clone command
    crit: component
    for: [python]
    if:
      type: text
      regex: 'clone_cmd\s*=\s*\[\s*"git"\s*,\s*"clone"\s*,'

  - id: python-launches-deploy-command-array
    desc: Python launches Bash deploy command
    crit: component
    for: [python]
    if:
      type: text
      regex: 'create_subprocess_exec\(\s*\*deploy_cmd'

  - id: python-launches-git-clone-command-array
    desc: Python launches Git clone command
    crit: component
    for: [python]
    if:
      type: text
      regex: 'create_subprocess_exec\(\s*\*clone_cmd'

composite_rules:
  - id: python-clones-and-runs-bash-deploy-script
    for: [python]
    desc: Python clones and runs a Bash deploy script
    crit: component
    all:
      - id: python-git-clone-command-array
      - id: python-launches-git-clone-command-array
      - id: python-bash-deploy-command-array
      - id: python-launches-deploy-command-array
    near_lines: 36

  - id: agent-skill-unreviewed-repository-instruction-stream
    for: [markdown, text, python, pyc, zip, npm, whl, tar]
    desc: Skill forces mutable raw repository fetch
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: agent-skill-forced-repository-fetch
      - id: well-known/app/development/code-forge/github::raw-githubusercontent-markdown-file

  - id: agent-skill-clones-and-runs-news-backend
    for: [markdown, text, python, pyc, zip, npm, whl, tar]
    desc: Agent skill clones and runs remote backend
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-daily-hot-api-clone
      - id: metadata/lang/source/syntax/command/launch::documented-bash-deploy-script-command

  - id: agent-skill-auto-deploys-cloned-backend
    for: [markdown, text, python, pyc, zip, npm, whl, tar]
    desc: Skill clones and runs mutable backend code
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: python-clones-and-runs-bash-deploy-script

  - id: agent-skill-remote-install-page
    for: [markdown, text, python, pyc, zip, npm, whl, tar]
    desc: Agent skill delegates setup to remote page
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-remote-install-page

  - id: agent-skill-external-openclawcli-installer
    for: [markdown, text, python, pyc, zip, npm, whl, tar]
    desc: Agent skill delegates CLI installation to external site
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-openclawcli-web-install
