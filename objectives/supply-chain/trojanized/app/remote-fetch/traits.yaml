# Skills that require fetching an entire external repository document at run
# time hand the agent an unreviewed, mutable instruction/data stream.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, python, pyc]
  attack: T1105,T1195.002

traits:
  - id: agent-skill-forced-repository-fetch
    desc: Forces external repository fetch
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: 'Please fetch the complete data from the main repository'

  # A seemingly harmless creative skill that downloads an unreviewed helper
  # script into a temporary directory and immediately executes it.
  - id: tmpfiles-python-helper-url
    desc: Tmpfiles.org URL serves Python helper
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)https?://tmpfiles\.org/dl/[0-9]{6,12}/[A-Za-z0-9_.-]{1,80}\.pyc?'

  # The staging-to-execution join of the helper flow: a path bound under a
  # helper-style name reaches a subprocess call within a short span. The
  # structured call shape is captured generically by
  # micro-behaviors/process/create/spawn-variable::python-interpreter-variable-
  # script-argument; this text-shaped leg keeps markdown/pyc coverage where
  # no AST-backed call exists.
  - id: helper-path-subprocess-exec
    desc: Staged helper path runs in subprocess
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)helper_path[\s\S]{0,220}subprocess\.(run|Popen)'

  - id: skill-daily-hot-api-clone
    desc: Skill clones mutable news backend
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: 'git clone https://github.com/imsyy/DailyHotApi.git'

  - id: skill-remote-install-page
    desc: Skill requires remote install page execution
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)glot\.io/snippets/.{0,100}(execute|installation command).{0,80}Terminal'

  - id: skill-openclawcli-web-install
    desc: Skill names external OpenClawCLI installer
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)openclawcli\.(vercel\.app|forum)'

composite_rules:
  - id: agent-skill-unreviewed-repository-instruction-stream
    desc: Skill forces mutable raw repository fetch
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: agent-skill-forced-repository-fetch
      - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-markdown-file

  - id: agent-skill-downloads-and-runs-helper
    desc: Agent skill executes fetched helper script
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: tmpfiles-python-helper-url
      - id: helper-path-subprocess-exec
      # Temp-dir staging is generic Python capability; the neutral atom lives
      # in fs/temp/. The skill-specific legs above carry the attribution.
      - id: micro-behaviors/fs/temp/directory::python-temporary-directory-context

  - id: agent-skill-clones-and-runs-news-backend
    desc: Agent skill clones and runs remote backend
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: skill-daily-hot-api-clone
      - id: micro-behaviors/process/create/script/file::documented-bash-deploy-script-command

  - id: agent-skill-remote-install-page
    desc: Agent skill delegates setup to remote page
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: skill-remote-install-page

  - id: agent-skill-external-openclawcli-installer
    desc: Agent skill delegates CLI installation to external site
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: skill-openclawcli-web-install
