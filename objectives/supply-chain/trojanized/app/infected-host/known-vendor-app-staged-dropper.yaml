# A legitimate vendor's utility whose PE carries a staged dropper or stager is a
# trojanized host program. The vendor identity is a known-entity claim from
# VERSIONINFO; it supplies no trust. The dropper composites carry the attack
# evidence: an embedded PE run hidden from temp, or a WinHTTP runtime archive
# autostarted through pythonw. Both legs live in the same PE, so the file scope
# joins the identity to the dropper.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1195.002

composite_rules:
  - id: known-vendor-app-embedded-dropper
    desc: Known vendor app PE embeds and hides a dropper payload
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: well-known/app/utility/softwareok/
      - id: objectives/execution/payload/file-exec/detached/embedded-stage::pe-embedded-resource-temp-hidden-dropper
  - id: known-vendor-app-pythonw-stager
    desc: Known vendor app PE stages a runtime archive via pythonw
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: well-known/app/utility/softwareok/
      - id: objectives/execution/payload/file-exec/detached/remote-download::pe-winhttp-runtime-run-key-pythonw-stager
