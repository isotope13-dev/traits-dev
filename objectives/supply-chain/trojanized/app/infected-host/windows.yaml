defaults:
  platforms: [windows]
  for: [pe]
  attack: "T1195.002,T1027,T1554"

composite_rules:
  - id: reloc-decoder-grafted-into-host-program
    desc: Host program has decoder grafted into relocations
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/infect/binary/rewrite::reloc-entrypoint-pe-infector
      - id: micro-behaviors/ui/help/command::has-help
      - id: metadata/signature/absent::unsigned-missing-signature-record
  - id: pyinstaller-host-infected-with-rwx-reloc-parasite
    desc: PyInstaller bundle infected with parasitic RWX .reloc stub
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/temp/pyinstaller::meipass-runtime-dir
      - id: metadata/binary/section/entropy::large-high-entropy-rwx-reloc
      - id: metadata/binary/section/reloc::relocs-stripped-flag
      - id: metadata/binary/section/permission::two-or-more-wx-sections
