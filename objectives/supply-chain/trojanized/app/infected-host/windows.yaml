defaults:
  platforms: [windows]
  for: [pe]
  attack: "T1195.002,T1027,T1554"

composite_rules:
  - id: reloc-decoder-grafted-into-host-program
    desc: Host program has decoder grafted into relocations
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/anti-static/obfuscation/payload/section::reloc-entrypoint-self-decoder
      - id: objectives/impact/infect/binary/rewrite::reloc-entrypoint-pe-infector
      - id: micro-behaviors/ui/help::has-help
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: objectives/impact/infect/virus::program-capability-beyond-self-copy
