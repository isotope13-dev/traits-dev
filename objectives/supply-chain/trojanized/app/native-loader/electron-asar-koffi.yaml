# Bundles Koffi native FFI bindings (koffi.node / @koromix/koffi-*) into an
# Electron app.asar alongside staged or extracted app files for Win32/FFI calls.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  attack: T1195.002,T1129

traits:
  - id: koffi-native-addon-vendor-ref
    desc: References Koffi native FFI addon bundle
    crit: notable
    conf: 0.94
    if:
      type: literal
      regex: '(?i)(@koromix/koffi-[\w-]+|koffi\.node)'

composite_rules:
  - id: electron-asar-koffi-native-bundle
    desc: Packs Koffi native FFI addon into Electron ASAR with staged script
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/archive/create/asar::asar-pack
      - id: micro-behaviors/fs/file/copy/call::fs-copy
      - id: koffi-native-addon-vendor-ref
    any:
      - id: objectives/supply-chain/trojanized/app/patch::shellcode-js-filename-literal
      - id: objectives/supply-chain/trojanized/app/patch::payload-stage-path-join
      - id: micro-behaviors/data/archive/extract/asar::asar-extract
