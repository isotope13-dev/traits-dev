defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pe, dll]
  attack: T1195.002

composite_rules:
  - id: python-dotenv-silent-native-cache-forward
    desc: Forwards parsed .env data to native module
    crit: suspicious
    conf: 0.93
    for: [python]
    all:
      - id: micro-behaviors/fs/path/secret-config::dotenv-filename-literal
      - id: micro-behaviors/os/env/write::os-environ-assignment
      - id: micro-behaviors/data/control-flow/module-exec::python-silent-native-cache-path-forward
  - id: pypi-silent-native-hook-dotenv-cache-forwarder
    desc: Wheel runs native hook and forwards .env
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/name/convention::wheel-dist-name-top-level-mismatch
      - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
      - id: micro-behaviors/data/control-flow/module-exec::python-silent-relative-native-hook-call
      - id: micro-behaviors/data/control-flow/module-exec::python-silent-native-cache-path-forward
      - id: micro-behaviors/fs/path/secret-config::dotenv-filename-literal
      - id: metadata/filename/identity::python-extension-module-basename
      - id: micro-behaviors/process/thread/create::create-thread
