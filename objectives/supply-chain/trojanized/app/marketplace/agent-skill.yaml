# Agent-skill marketplace clients can become a supply-chain replacement path:
# this sample embeds a live marketplace credential, installs an unpinned
# SKILL.md fetched from raw GitHub, and writes it into a global agent directory.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, python]
  attack: T1195.002,T1105

traits:
  - id: skill-marketplace-live-api-key
    desc: Hard-coded live marketplace API key
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'sk_live_skillsmp_[A-Za-z0-9]+'

  - id: skill-marketplace-global-install-path
    desc: Fixed global agent skill directory
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(/home/ec2-user/mega-agent2/\.claude/skills)'


composite_rules:
  - id: hostile-agent-skill-marketplace-installer
    for: [zip, tar, markdown, text, python]
    desc: Global agent-skill installer with embedded marketplace access
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-marketplace-global-install-path
      - id: micro-behaviors/communications/http/url/forge::raw-github-skill-url-case-insensitive
    any:
      - id: skill-marketplace-live-api-key
      - id: micro-behaviors/communications/http/token-auth::bearer-near-skill-wording
