# Injecting code into a Windows Installer package.
#
# Adding a row to CustomAction names a piece of code and gives it an execution
# type; adding one to InstallExecuteSequence makes the installer actually run
# it, and the Binary table carries the script or DLL it runs. Doing all three
# to an existing .msi is how a clean installer becomes a trojanized one — and
# the custom-action type word carries the elevation, so the injected code can
# be scheduled deferred and no-impersonate to run as LocalSystem regardless of
# who launched the install.
#
# Repackagers do this legitimately: slipstream kits inject their own
# post-install custom action, which is why this tops out at suspicious rather
# than hostile. What it should never be is silent — before these rules the
# whole operation showed up as a single "MSI automation OpenDatabase call".
defaults:
  platforms: [windows]
  for: [vbs, javascript, powershell, python, csharp]
  attack: T1195.002
  mbc: B0030

composite_rules:
  # One composite for one operation. Naming the action is the constant; the
  # corroborating leg is whichever half the script also does — scheduling it in
  # the sequence table, embedding the payload in Binary, or streaming a file
  # into the record. Splitting these into separate rules reported the same
  # injection twice. A writable OpenDatabase is implied by the insert itself,
  # so it is not one of the alternatives.
  - id: msi-custom-action-injection
    desc: Injects a custom action into an MSI package
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/com/object::msi-custom-action-table-insert
    any:
      - id: micro-behaviors/os/com/object::msi-install-sequence-table-insert
      - id: micro-behaviors/os/com/object::msi-binary-table-insert
      - id: micro-behaviors/os/com/object::msi-record-set-stream
