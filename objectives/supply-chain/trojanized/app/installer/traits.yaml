# Every rule here used to be named and described for a README, but not one of
# them looks at a basename -- the gate is `for: [markdown]`, so they match any
# `.md` in the tree. Install instructions routinely live in INSTALL.md,
# CONTRIBUTING.md, docs/getting-started.md or a localized README.zh-CN.md, and
# the matchers happily (and correctly) catch those; they just reported them as
# "README", sending the analyst to a file that does not contain the command.
# Named for markdown, which is what is actually searched.
defaults:
  platforms: [windows, unix]
  for: [tar, zip]
  attack: T1195.002,T1105,T1059

traits:
  - id: markdown-curl-msi-download
    desc: Markdown downloads an MSI with curl
    crit: notable
    conf: 0.97
    for: [markdown]
    if:
      type: text
      regex: '(?i)curl\s+-Lo\s+.{0,100}\.msi\s+https?://.{1,160}\.msi'

  - id: markdown-msiexec-msi-install
    desc: Markdown invokes msiexec on an MSI
    crit: notable
    conf: 0.97
    for: [markdown]
    if:
      type: text
      regex: '(?i)msiexec(\.exe)?\s+/i\s+.{0,100}\.msi'

  # Fetching a remote script and piping it into a shell is a network fetch plus
  # program execution, so this is notable on its own -- the same bar its MSI
  # siblings above already sit at. It was `component`, with a wrapper composite
  # (`readme-remote-shell-install-command`) that re-expressed it exactly:
  # `for: [markdown]` plus a redundant markdown-basename leg over this atom.
  # That wrapper carried a second, already-diverging copy of the exclusion list
  # (this atom excludes the Pulumi source tree; the wrapper did not), which is
  # how one signal ends up with two `unless:` lists that drift. Consolidated to
  # this single canonical atom, so a future vendor-doc exclusion is added once.
  - id: markdown-curl-pipe-shell
    desc: Markdown documents curl-pipe-shell install
    crit: notable
    conf: 0.96
    for: [markdown]
    if:
      type: text
      regex: '(?i)curl\s+-fsSL\s+https?://.{4,240}\|\s*(bash|sh)\b'
    unless:
      - id: metadata/package/quality/false-positives::dcc-mcp-core-official-installer-context
      - id: well-known/lib/dcc-mcp-core::official-vx-installer-url
      - id: metadata/package/quality/source::official-azd-installer-command
      - id: well-known/app/pulumi::pulumi-source-tree
      - id: well-known/app/crofty::official-source-tree
      - id: well-known/app/keepgoing::keepgoing-official-install-url
      - id: well-known/app/squeez::squeez-official-install-url
      - id: well-known/app/openai-codex::openai-codex-source-context

composite_rules:
  - id: markdown-remote-msi-install-command
    desc: Markdown supplies a remote MSI install command
    crit: notable
    conf: 0.98
    for: [markdown]
    all:
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: markdown-curl-msi-download
      - id: markdown-msiexec-msi-install

  - id: remote-msi-script-installer-bundle
    desc: Doc combines remote MSI and shell installers
    crit: hostile
    conf: 0.99
    for: [markdown]
    all:
      - id: markdown-remote-msi-install-command
      - id: markdown-curl-pipe-shell

  - id: cross-platform-remote-script-installer-bundle
    desc: Doc lists cross-platform remote installers
    crit: hostile
    conf: 0.99
    for: [markdown]
    all:
      - id: markdown-remote-msi-install-command
      - id: markdown-curl-pipe-shell
      - id: metadata/package/documentation::cross-platform-install-documentation
