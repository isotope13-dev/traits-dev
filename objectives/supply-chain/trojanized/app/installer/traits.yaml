# Every rule here used to be named and described for a README, but not one of
# them looks at a basename -- the gate is `for: [markdown]`, so they match any
# `.md` in the tree. Install instructions routinely live in INSTALL.md,
# CONTRIBUTING.md, docs/getting-started.md or a localized README.zh-CN.md, and
# the matchers happily (and correctly) catch those; they just reported them as
# "README", sending the analyst to a file that does not contain the command.
# Named for markdown, which is what is actually searched.
defaults:
  platforms: [windows, unix]
  for: [tar, zip]
  attack: T1195.002,T1105,T1059

traits:
  - id: markdown-curl-msi-download
    desc: Markdown downloads an MSI with curl
    crit: notable
    conf: 0.97
    for: [markdown]
    if:
      type: text
      regex: '(?i)curl\s+-Lo\s+.{0,100}\.msi\s+https?://.{1,160}\.msi'

  - id: markdown-msiexec-msi-install
    desc: Markdown invokes msiexec on an MSI
    crit: notable
    conf: 0.97
    for: [markdown]
    if:
      type: text
      regex: '(?i)msiexec(\.exe)?\s+/i\s+.{0,100}\.msi'

  # The markdown curl-pipe-shell atom moved to
  # micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text. Its
  # matcher only ever saw a documented install one-liner, which is neutral --
  # the hostile composites below get their intent from the MSI download and
  # msiexec legs, and reference the atom across directories.
composite_rules:
  - id: unsigned-branded-mbr-wiper
    desc: Unsigned branded installer contains MBR wiper
    crit: hostile
    conf: 0.995
    for: [pe]
    platforms: [windows]
    attack: T1195.002,T1561.002
    all:
      - id: objectives/impact/wipe/disk/mbr::mbr-wiper-pe
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/package/versioning::pe-company-name-populated
      - id: metadata/package/versioning::pe-filedescription-field
      - id: metadata/build/manifest::pe-requires-admin

  - id: markdown-remote-msi-install-command
    desc: Markdown supplies a remote MSI install command
    crit: notable
    conf: 0.98
    for: [markdown]
    all:
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: markdown-curl-msi-download
      - id: markdown-msiexec-msi-install

  - id: remote-msi-script-installer-bundle
    desc: Doc combines remote MSI and shell installers
    crit: hostile
    conf: 0.99
    for: [markdown]
    all:
      - id: markdown-remote-msi-install-command
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text

  - id: cross-platform-remote-script-installer-bundle
    desc: Doc lists cross-platform remote installers
    crit: hostile
    conf: 0.99
    for: [markdown]
    all:
      - id: markdown-remote-msi-install-command
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
      - id: metadata/package/documentation/source-documentation::cross-platform-install-documentation
