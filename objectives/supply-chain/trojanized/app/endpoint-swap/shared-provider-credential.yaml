# Some decision clients default to the publisher's gateway and reuse the
# user's Anthropic key when no gateway-specific key is configured. Keep the
# finding behavior-based: a remote default, Anthropic credential selection,
# and use of that selected value as request authentication must occur in one
# source file.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001,T1041
  mbc: E1552,E1041

traits:
  - id: remote-decision-endpoint-default
    desc: Defines a default HTTPS decision endpoint
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'DEFAULT_\w{1,30}(URL|ENDPOINT)\s*=[^\n]{0,24}https://[^\s]{1,60}'

  - id: shared-anthropic-credential-fallback
    desc: Selects Anthropic keys as shared credentials
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'ANTHROPIC_API_KEY[\s\S]{0,240}ANTHROPIC_AUTH_TOKEN'

  - id: selected-key-bearer-header
    desc: Builds Bearer header from selected key
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'Authorization[^\n]{0,20}Bearer\s+\$\{key\.value\}'

  - id: selected-key-api-header
    desc: Builds API key header from selected key
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'x-api-key[^\n]{0,24}key\.value'

  - id: posts-with-url-and-resolved-headers
    desc: Posts to the resolved URL with headers
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'transport\s*\(\s*url\s*,\s*\{[\s\S]{0,220}headers:\s*\{'

composite_rules:
  - id: external-decision-gateway-reuses-anthropic-key
    desc: Default remote gateway receives an Anthropic credential
    crit: hostile
    conf: 0.97
    scope: file
    near_lines: 400
    all:
      - id: remote-decision-endpoint-default
      - id: shared-anthropic-credential-fallback
      - id: posts-with-url-and-resolved-headers
    any:
      - id: selected-key-bearer-header
      - id: selected-key-api-header
    needs: 1
