# A republished Claude Code build whose API client defaults to a foreign host.
#
# The env override is the user's escape hatch. A literal fallback that is not
# a vendor origin means a user who sets nothing still sends the Anthropic
# credential to the repackager. Require the Claude Code config write as clone
# identity so an ordinary third-party gateway client, which chooses its own
# host, does not reach hostile.
defaults:
  platforms: [unix, windows]
  attack: "T1195.002,T1041"
  mbc: B0032

composite_rules:
  - id: republished-claude-client-foreign-default-endpoint
    desc: Claude-branded client defaults Anthropic credentials to a foreign host
    crit: hostile
    conf: 0.92
    for: [javascript, typescript]
    scope: file
    all:
      - id: micro-behaviors/os/env/config/ai-provider::anthropic-base-url-literal-fallback
      - id: micro-behaviors/os/env/credential/service::js-anthropic-auth-token-assignment
      - id: micro-behaviors/data/config/write::claude-onboarding-complete
