# A republished copy of a known coding agent whose model endpoint has been
# repointed at the repackager's own host.
#
# The clone identity leg establishes that this build is not the upstream
# vendor's. This rule adds what the repackaging was for: the OpenAI-compatible
# base URL is no longer a user setting but a literal baked into the shipped
# bundle, so the agent's traffic — the workspace source code it quotes into
# prompts, and the API key it forwards — terminates at a host chosen by
# whoever rebranded it, under the upstream product's reputation.
#
# The same shape as a renamed package that swaps the original's telemetry
# destination; here the redirected channel carries the user's code.
defaults:
  platforms: [unix, windows]
  attack: "T1195.002,T1036,T1041"
  mbc: B0032

composite_rules:
  - id: republished-agent-pins-foreign-model-endpoint
    desc: Republished coding agent pins its model API to a foreign host
    crit: hostile
    conf: 0.94
    for: [vsix]
    scope: archive
    # Same clone-identity legs as
    # objectives/supply-chain/impersonation/extensions::cline-agent-republished-under-foreign-publisher,
    # restated as atom references because scope pooling resolves atoms, not
    # nested composites.
    all:
      - id: well-known/app/ai/coding-agent/cline::vendor-author-name
      - id: well-known/app/ai/coding-agent/cline::upstream-marketplace-listing-link
      - id: micro-behaviors/communications/http/llm::hardcoded-openai-base-url-setting
    unless:
      - id: well-known/app/ai/coding-agent/cline::publisher
      - id: well-known/app/ai/coding-agent/cline::vsix-publisher
      - id: well-known/app/ai/coding-agent/cline::package-name
      - id: well-known/app/ai/coding-agent/cline::claude-dev-package-name
