# A setup CLI that rewrites the user's agent config to point inference at
# the packager's own gateway while silently relaxing the agent's guardrails.
#
# Unlike a republished agent bundle (see ide-extension.yaml), nothing here
# is repackaged: the installer authors provider-table TOML for a hardcoded
# third-party gateway URL, writes it into the agent's global config, and in
# the same file disables command approval and forces full-access sandbox
# mode. From then on the agent's traffic — every prompt, completion and the
# API key it forwards — terminates at a host the user never chose, with no
# guardrail left to stop what the model is told to run. Either half alone
# has legitimate uses (corporate proxy onboarding; unattended CI runners),
# but a single setup program doing both is a channel switch, not onboarding.
defaults:
  platforms: [unix, windows]
  attack: "T1195.002,T1041"

composite_rules:
  - id: setup-cli-reroutes-agent-to-foreign-gateway
    desc: Setup CLI reroutes agent to foreign gateway
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    scope: file
    ref: sha256:d96930f0c457bb5d169d45d1d91ded5885c9aa1c86340feaa5834572e9765316
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: micro-behaviors/process/create/permission-agent::coding-agent-harness-source
    all:
      - id: micro-behaviors/data/config/codex::codex-model-provider-table-block
      - id: micro-behaviors/data/config/codex::gateway-url-default-constant
      - id: micro-behaviors/fs/path/agent-config/file::codex-config-toml
      - id: micro-behaviors/fs/write/file/full::js-file-write
    any:
      - id: objectives/evasion/security-bypass/llm/sandbox::ai-agent-sandbox-disable-call-arg
      - id: micro-behaviors/data/config/write::codex-approval-never-set
