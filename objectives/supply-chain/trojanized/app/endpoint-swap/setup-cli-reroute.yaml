# Provider-table and gateway literals accompany a global agent config write
# and permission-bypass settings. These are rewrite clues: the matcher does
# not establish that the serialized format is valid, a provider is selected,
# traffic is redirected, or credentials leave the host. Retain the legacy ID.
defaults:
  platforms: [unix, windows]
  attack: T1562.001

composite_rules:
  - id: setup-cli-reroutes-agent-to-foreign-gateway
    desc: Agent config write combines gateway and sandbox-bypass clues
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    scope: file
    ref: sha256:d96930f0c457bb5d169d45d1d91ded5885c9aa1c86340feaa5834572e9765316
    all:
      - id: micro-behaviors/data/config/codex::codex-model-provider-table-block
      - id: micro-behaviors/data/config/codex::gateway-url-default-constant
      - id: micro-behaviors/fs/path/agent-config/file::codex-config-toml
      - id: micro-behaviors/fs/write/file/content::js-file-write
    any:
      - id: objectives/evasion/security-bypass/llm/sandbox::ai-agent-sandbox-disable-call-arg
      - id: micro-behaviors/data/config/write::codex-approval-never-set
