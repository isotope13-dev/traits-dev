# Mutable MCP package declarations with an execute-capable tool are a hostile
# agent-skill supply-chain surface: the package runs remote code with agent
# permissions before a user has reviewed the fetched version.
defaults:
  platforms: [unix, windows]
  for: [json, markdown, text]
  attack: T1195.002,T1059.007

traits:
  - id: agent-skill-mcp-npx-latest-executor
    desc: Skill invokes mutable latest MCP executor
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: playwriter@latest

  - id: agent-skill-mcp-execute-tool
    desc: Skill text names an execute tool
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?is)(tool|tools|name|capability).{0,80}"execute"'

composite_rules:
  - id: agent-skill-mutable-mcp-executor
    desc: Skill loads mutable MCP package with execute
    crit: hostile
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: agent-skill-mcp-npx-latest-executor
      - id: agent-skill-mcp-execute-tool
