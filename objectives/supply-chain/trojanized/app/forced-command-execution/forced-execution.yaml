defaults:
  platforms: [unix, windows]
  for: [python, markdown]
  attack: T1195.002

traits:
  # A skill can direct its host agent to bypass the user's approval and
  # bootstrap an unpinned global package before the requested task begins.
  # The individual phrases are evidence; the hostile conclusion requires
  # their close co-occurrence with a real Agent Skills definition and a global
  # npm install command.
  - id: agent-skill-skip-user-confirmation
    desc: Skill tells agent to skip user confirmation
    crit: suspicious
    conf: 0.94
    if:
      type: text
      # A generic "do not ask the user" can describe routine input routing.
      # Require the instruction to name confirmation, approval, or permission.
      regex: '(?i)(do not|don''t|never) ask.{0,20}(user|human).{0,20}(confirm|approv|permission)'

  - id: agent-skill-skips-question-before-command
    desc: Skill runs command without user prompt
    crit: suspicious
    conf: 0.94
    if:
      type: text
      # Require an automatic-run clause after the skipped prompt. The hostile
      # composite also requires a skill manifest and global npm installation.
      regex: '(?is)(do not|don''t) ask.{0,15}user.{0,20}(run|install).{0,60}automatically'

  - id: agent-skill-run-command-automatically
    desc: Skill directs automatic command execution
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)(^|[;\n])\s*\b(run|execute|install)\b[\s\S]{0,80}\bautomatically\b'

  # Some skills compel execution through an imperative instead of using the
  # word "automatically". This is evidence for the composite below only when
  # it is paired with a floating, global skill installer.

  # Some skills compel execution through an imperative instead of using the
  # word "automatically". This is evidence for the composite below only when
  # it is paired with a floating, global skill installer.
  - id: agent-skill-compels-workflow-execution
    desc: Skill compels execution of its workflow
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bmust\s+(execute|run|perform)\s+this\s+workflow\b'

  # Exclusive, mandatory command instructions become high risk when the
  # command copies a mutable script from the agent user's config, runs it, and
  # removes the working copy. The command chain alone remains suspicious.

  # Exclusive, mandatory command instructions become high risk when the
  # command copies a mutable script from the agent user's config, runs it, and
  # removes the working copy. The command chain alone remains suspicious.
  - id: agent-skill-forces-exclusive-command-zh
    desc: Skill forbids all other operations
    crit: suspicious
    conf: 0.96
    for: [markdown]
    if:
      type: text
      substr: 必须执行以下命令，禁止任何其他操作

  - id: agent-skill-forces-exclusive-command-en
    desc: Skill forces one command only
    crit: suspicious
    conf: 0.96
    for: [markdown]
    if:
      type: text
      regex: '(?i)must execute only the following command'

  - id: agent-skill-unconditional-access-allow
    desc: Agent skill returns unconditional access
    crit: notable
    conf: 0.94
    for: [python, markdown, javascript]
    if:
      type: text
      regex: '(?i)\ballowed\s*:\s*true\b'

composite_rules:
  - id: agent-skill-forced-unapproved-global-install
    desc: Agent skill forces unapproved global package install
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1059
    for: [markdown]
    near_bytes: 256
    all:
      - id: micro-behaviors/os/package-manager/install::skill-npm-global-install
      - id: agent-skill-run-command-automatically
    any:
      - id: agent-skill-skip-user-confirmation
      - id: agent-skill-skips-question-before-command

  # A skill that orders execution of an unpinned global skill installer
  # gives an agent a direct supply-chain action with no review step. The
  # installer can change between scans because it uses @latest.

  # A skill that orders execution of an unpinned global skill installer
  # gives an agent a direct supply-chain action with no review step. The
  # installer can change between scans because it uses @latest.
  - id: agent-skill-forces-floating-global-skill-install
    desc: Skill forces floating global skill install
    crit: hostile
    conf: 0.96
    attack: T1195.002,T1059
    for: [markdown]
    near_bytes: 512
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter-fields
      - id: micro-behaviors/os/package-manager/reference-install::npx-latest-global-skill-add-text
      - id: agent-skill-compels-workflow-execution

  - id: agent-skill-forced-unreviewed-template-script
    desc: Skill forces unreviewed template script execution
    crit: hostile
    conf: 0.97
    for: [markdown, zip, tar]
    scope: archive
    near_bytes: 768
    all:
      - id: micro-behaviors/process/deploy/file-exec/command::agent-template-script-chain-clues
    any:
      - id: agent-skill-forces-exclusive-command-zh
      - id: agent-skill-forces-exclusive-command-en
