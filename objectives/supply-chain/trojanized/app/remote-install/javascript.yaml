# A package-side installer that retrieves a script, writes it locally, and
# executes it with PowerShell policy bypass is an intent-level supply-chain
# dropper signal. The atoms remain neutral capabilities elsewhere.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1195.002
traits:
  - id: configurable-release-server-url
    desc: Configurable release server URL
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'RELEASE_SERVER_URL\s*=\s*process\.env\.[A-Z0-9_]+\s*\|\|'

  - id: large-binary-size-threshold
    desc: Checks binary size threshold
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'stats\.size\s*>\s*10\s*\*\s*1024\s*\*\s*1024'

composite_rules:
  # A cross-platform asset installer: on Windows it shells `powershell
  # -ExecutionPolicy Bypass` at the stock Expand-Archive cmdlet (the flag is
  # needed because the helper is written to a temp dir, not because remote code
  # runs), and on POSIX it falls back to unzip/tar/7z/python zipfile. The thing
  # executed under the bypass is an unzip cmdlet, not the retrieved payload,
  # which is what remote-script-policy-bypass-installer is meant to catch. A
  # script dropper does not ship a POSIX extraction fallback chain, so both
  # legs together are what make this benign.
  - id: windows-archive-extraction-installer
    desc: Cross-platform installer expands a downloaded archive
    crit: exception
    conf: 0.9
    all:
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive
    any:
      - id: micro-behaviors/data/archive/extract/zip::unzip-command
      - id: micro-behaviors/data/archive/extract/zip::python-zipfile-extractall
      - id: micro-behaviors/data/archive/extract/tar::node-spawn-tar-extract
      - id: micro-behaviors/data/archive/extract/tar::tar-extract

  - id: npm-postinstall-downloads-and-stages-native-binary
    desc: npm postinstall downloads and stages native binary
    crit: hostile
    conf: 0.98
    scope: archive
    attack: "T1195.002,T1105,T1222.002"
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: configurable-release-server-url
      - id: large-binary-size-threshold
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable

  - id: npm-postinstall-global-install-wrapper
    desc: npm postinstall installs and wraps global dependency
    crit: hostile
    conf: 0.98
    scope: archive
    attack: "T1195.002,T1105,T1222.002"
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: micro-behaviors/os/package-manager/install::global-npm-install-command
      - id: micro-behaviors/os/module/load::node-require-resolve-package-name
      - id: micro-behaviors/fs/file/write/wrapper::node-writes-wrapper-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable

  - id: remote-script-policy-bypass-installer
    desc: Remote script installer bypasses PowerShell policy
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/import/builtin::require-https
      - id: micro-behaviors/fs/write/file/direct::create-write-stream
      - id: micro-behaviors/process/create/shell/bridge::child-process-exec
      - id: objectives/execution/interpreter/script/wsh::execution-policy-bypass
    near_bytes: 8192
    unless:
      - id: windows-archive-extraction-installer
      - id: well-known/tool/sysadmin/ripgrep::vscode-ripgrep-native-bootstrap-context

  # Import-time / library-side dropper: scheme-selected HTTP GET into os.tmpdir,
  # chmod +x, then spawnSync bash/powershell against the staged path. Seen in
  # npm packages that advertise helper APIs while always calling run(origin).
  - id: node-tmpdir-remote-script-dropper
    desc: Downloads remote script to tmpdir and executes it
    crit: hostile
    conf: 0.98
    attack: T1105,T1059,T1222.002
    near_lines: 120
    all:
      - id: micro-behaviors/communications/http/request/dynamic::node-scheme-selected-http-get
      - id: micro-behaviors/communications/http/response::node-response-pipe
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/shell/bridge::js-spawnsync-interpreter
      - id: micro-behaviors/fs/path/temp::node-os-tmpdir

  - id: node-powershell-bypass-tmpdir-stage
    desc: Stages remote script and runs PowerShell Bypass
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.001,T1562.001
    near_lines: 120
    all:
      - id: micro-behaviors/communications/http/request/dynamic::node-scheme-selected-http-get
      - id: micro-behaviors/process/create/shell/bridge::js-spawnsync-windows-interpreter
      - id: micro-behaviors/fs/path/temp::node-os-tmpdir
    any:
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-argument
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-argv-pair
    needs: 1

  # Stream-to-file + chmod + spawnSync interpreter (scheme-selected clients).
  - id: node-stream-chmod-spawnsync-dropper
    desc: Streams download, chmods, and spawnSync-runs it
    crit: hostile
    conf: 0.98
    attack: T1105,T1059,T1222.002
    near_lines: 100
    all:
      - id: micro-behaviors/fs/write/file/direct::create-write-stream
      - id: micro-behaviors/communications/http/response::node-response-pipe
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/shell/bridge::js-spawnsync-interpreter
      - id: micro-behaviors/communications/http/request/dynamic::node-scheme-selected-http-get

  - id: npm-postinstall-configurable-native-bootstrap
    desc: npm postinstall stages configurable native binary
    crit: hostile
    conf: 0.99
    scope: archive
    attack: "T1195.002,T1105,T1222.002"
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: configurable-release-server-url
      - id: large-binary-size-threshold
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
