defaults:
  for: [shell]
  platforms: [macos]

composite_rules:
  - id: installer-persists-remote-profile-fetcher
    desc: Installer persists a remote profile fetcher
    crit: hostile
    conf: 0.98
    for: [shell, pkg]
    attack: T1195.002,T1546.004,T1105
    scope: archive
    all:
      - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
      - id: micro-behaviors/fs/path/config/system::system-profiled-path
      - id: micro-behaviors/fs/write/content::file-write-capability
      - id: micro-behaviors/communications/http/curl::curl-command-url-or-option
      - id: micro-behaviors/communications/http/curl::curl-silent-fail-flags-text

  - id: installer-launchagent-shell-loader
    desc: Installer activates autostart shell loader
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1543.004,T1105,T1059.004
    all:
      - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
      - id: micro-behaviors/os/service/launchagent::shell-load-written-autostart-fetch-pipe
