defaults:
  for: [ruby]
  platforms: [unix]

composite_rules:
  - id: formula-launchagent-shell-loader
    desc: Formula installs autostart shell loader
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1543.004
    all:
      - id: metadata/package/manager::homebrew-formula-class
      - id: micro-behaviors/os/service/launchagent::ruby-write-autostart-shell-loader-plist

  - id: formula-launcher-download-shell-injection
    desc: Formula inserts download-shell into launcher
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1059.004
    all:
      - id: metadata/package/manager::homebrew-formula-class
      - id: micro-behaviors/fs/write/file/executable::ruby-inreplace-executable-shell-pipeline
