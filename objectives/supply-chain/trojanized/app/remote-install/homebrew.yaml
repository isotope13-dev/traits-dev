defaults:
  for: [ruby]
  platforms: [unix]

traits:
  - id: formula-audit-method
    desc: Homebrew formula defines an audit hook
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*def\s+audit\b'
  - id: formula-caveat-method
    desc: Homebrew formula defines caveats
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\s*def\s+caveats\b'
  - id: formula-gated-system-curl
    desc: Gated formula curl call
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?is)File\.exist\?[^\n]{0,180}system\s+["'']curl\b'

composite_rules:
  - id: formula-resource-script-exec
    desc: Staged resource runs a shell script
    crit: suspicious
    conf: 0.9
    near_lines: 10
    all:
      - id: metadata/package/manager::homebrew-resource-stage
      - id: micro-behaviors/process/create/shell/lang::ruby-system-shell-interpreter

  - id: formula-launchagent-shell-loader
    desc: Formula installs autostart shell loader
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1543.004
    all:
      - id: metadata/package/manager::homebrew-formula-class
      - id: micro-behaviors/os/service/launchagent::ruby-write-autostart-shell-loader-plist

  - id: formula-launcher-download-shell-injection
    desc: Formula inserts download-shell into launcher
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1059.004
    all:
      - id: metadata/package/manager::homebrew-formula-class
      - id: micro-behaviors/fs/write/file/executable::ruby-inreplace-executable-shell-pipeline

  - id: formula-audit-hostname-exfil
    desc: Formula audit hook posts builder hostname
    crit: hostile
    conf: 0.96
    attack: T1195.002,T1041
    all:
      - id: metadata/package/manager::homebrew-formula-class
      - id: formula-audit-method
      - id: micro-behaviors/os/sysinfo/hostname::ruby-socket-gethostname
      - id: micro-behaviors/communications/http/post::net-http-post

  - id: formula-resource-installer-exec
    desc: Formula executes a staged resource installer
    crit: hostile
    conf: 0.95
    attack: T1195.002,T1059.004
    all:
      - id: metadata/package/manager::homebrew-formula-class
      - id: formula-resource-script-exec

  - id: formula-gated-bottle-beacon
    desc: Formula lifecycle hook phones home behind a marker gate
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1041
    all:
      - id: metadata/package/manager::homebrew-formula-class
      - id: formula-gated-system-curl
      - id: micro-behaviors/process/create/system::system-process-call

  - id: formula-lifecycle-remote-curl
    desc: Formula lifecycle executes a remote curl command
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1105
    all:
      - id: metadata/package/manager::homebrew-formula-class
      - id: micro-behaviors/process/create/system::system-process-call
      - id: micro-behaviors/communications/http/curl::curl-command-remote-url
      # Added alongside, not instead of: the URL leg keeps the "remote"
      # requirement, this one requires curl to actually be the program being
      # run. Without it the rule fired on comments and on a make target named
      # `install-curl`.
      - id: metadata/package/manager::homebrew-curl-program-invocation
    unless:
      # `test do` is not a lifecycle phase. Without this the three legs are
      # satisfied by any formula for a network tool, including Homebrew's own
      # curl, privoxy, microsocks, gost, glider and poppler formulas.
      - id: metadata/package/manager::homebrew-test-block-curl

  - id: formula-caveat-remote-shell-delivery
    desc: Formula caveat instructs a remote shell delivery
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1059.004,T1105
    all:
      - id: metadata/package/manager::homebrew-formula-class
      - id: formula-caveat-method
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
