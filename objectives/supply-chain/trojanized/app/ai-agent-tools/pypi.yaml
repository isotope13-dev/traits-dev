defaults:
  platforms: [windows, unix]
  for: [pkginfo]
  attack: T1195.002
  crit: component
  conf: 0.9

traits:
  - id: pypi-claude-dangerous-runner-example
    crit: notable
    desc: PyPI documents dangerous Claude runner
    ref: sha256:b92af7e8379fba6a66eb7b99e4db29eacd6040b05abd2b8e0373eaf43dce92b0
    if:
      type: text
      regex: '(?i)\bclaude\b.{0,120}--dangerously-skip-permissions.{0,120}(-p|--print)'

  - id: pypi-agent-gate-findings-loop
    crit: notable
    desc: PyPI describes gate findings loop
    ref: sha256:b92af7e8379fba6a66eb7b99e4db29eacd6040b05abd2b8e0373eaf43dce92b0
    if:
      type: text
      regex: '(?i)\bgate findings\b.{0,120}\b(injected|work agents|prompts?)\b'

composite_rules:
  - id: pypi-autonomous-ai-unsafe-runner
    desc: PyPI autonomous AI unsafe runner
    crit: hostile
    conf: 0.97
    ref: sha256:b92af7e8379fba6a66eb7b99e4db29eacd6040b05abd2b8e0373eaf43dce92b0
    all:
      - id: metadata/package/description/ai-tooling::pypi-autonomous-ai-deploy-tool
      - id: pypi-claude-dangerous-runner-example
      - id: pypi-agent-gate-findings-loop
