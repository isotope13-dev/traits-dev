defaults:
  platforms: [windows, unix]
  for: [package.json]
  attack: T1195.002
composite_rules:
  - id: hollow-ai-cli-package
    desc: Hollow AI CLI package
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/package/description/function::description-ai-cli-identity
      - id: metadata/package/description/function::description-openai-runtime-dependency
      - id: metadata/file/size::small-versioned-npm-manifest
    any:
      - id: metadata/package/entrypoint::pkg-main-field
      - id: metadata/package/entrypoint::bin-js-entry
