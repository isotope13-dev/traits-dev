# macOS application bundles that launch an extra resource payload.
defaults:
  platforms: [macos]
  for: [macho]
  attack: T1195.002,T1059.009

traits:
  - id: macos-kernel-service-path
    desc: macOS binary references kernel service path
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: /Library/kernel_service
  - id: macos-kernel-marker-paths
    desc: macOS binary references kernel marker files
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '/Library/\.kernel_(pid|time|complete)'
  - id: macos-resource-ransom-payload
    desc: macOS binary launches a resource RTF payload
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: /Resources/General.rtf

composite_rules:
  - id: macos-bundled-resource-payload-launcher
    desc: macOS app launches a bundled resource payload
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1059.009,T1547
    all:
      - id: macos-kernel-service-path
      - id: macos-kernel-marker-paths
      - id: macos-resource-ransom-payload
      - id: micro-behaviors/process/create/launch::native-nstask-launch-path
