defaults:
  platforms: [windows, unix]
  for: [archives, python, markdown, text]
  attack: T1195.002

traits:
  - id: skill-reader-user-controlled-path
    desc: Skill constructs paths from unchecked input
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)(base_dir\s*=.{0,60}os\.path\.join|/etc/app/\{config_name\})'

  - id: skill-read-file-http-post
    desc: Skill posts read file contents
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?is)open\(file_path\).{0,300}requests\.post'

  - id: skill-unbounded-python-loop
    desc: Skill contains unbounded Python loop
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?m)^\s*while True:\s*$'

  - id: skill-memory-amplification-loop
    desc: Skill repeats each item millions of times
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: '[item] * 10000000'

composite_rules:
  - id: skill-sql-injection-scanner-case
    desc: Agent skill embeds SQL injection behavior
    crit: hostile
    conf: 0.99
    # SQL behavior must be in an actual Python skill tool; archive pooling
    # paired a benign SKILL.md with unrelated application code.
    scope: leaf
    for: [python]
    all:
      - id: metadata/package/config::agent-skill-tool-file
      - id: micro-behaviors/data/db/sql::python-sql-f-string
      - id: micro-behaviors/data/db/sql::sql-select

  - id: skill-environment-secret-exfiltration-case
    desc: Agent skill exfiltrates environment secrets
    crit: hostile
    conf: 0.99
    for: [python]
    # The environment read, encoding, and request must be in the skill tool
    # itself. Archive-wide pairing with any SKILL.md frontmatter falsely
    # convicted unrelated Python files in applications that merely document
    # agent skills.
    scope: leaf
    all:
      - id: metadata/package/config::agent-skill-tool-file
      - id: micro-behaviors/os/env/vars/access::python-environ-items-loop
      - id: micro-behaviors/communications/http/request/client::request-python
      - id: micro-behaviors/data/encode/base64::b64encode-call

  - id: skill-file-exfiltration-case
    desc: Agent skill posts read file contents externally
    crit: hostile
    conf: 0.99
    scope: archive
    for: [archives]
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: skill-read-file-http-post
      - id: micro-behaviors/communications/http/request/client::request-python
      - id: micro-behaviors/process/interpreter/python::eval-builtin

  - id: skill-dynamic-code-execution-case
    desc: Agent skill executes generated Python code
    crit: hostile
    conf: 0.99
    for: [archives]
    # Keep the execution evidence in the actual skill tool file; a package can
    # legitimately ship SKILL.md files alongside unrelated Python examples.
    all:
      - id: metadata/package/config::agent-skill-tool-file
      - id: micro-behaviors/process/interpreter/python::eval-builtin
      - id: micro-behaviors/process/interpreter/python::exec-generated-code

  - id: skill-unchecked-file-reader-case
    desc: Agent skill exposes unchecked file paths
    crit: hostile
    conf: 0.99
    scope: archive
    for: [archives]
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: skill-reader-user-controlled-path

  - id: skill-resource-exhaustion-case
    desc: Agent skill contains resource exhaustion loop
    crit: hostile
    conf: 0.99
    scope: archive
    for: [archives]
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: skill-unbounded-python-loop
      - id: skill-memory-amplification-loop

  - id: skill-prompt-injection-manifest-case
    desc: Agent skill manifest carries prompt injection
    crit: hostile
    conf: 0.99
    # Prompt-injection text must be in the manifest itself; archive pooling
    # paired a benign SKILL.md with test strings elsewhere in the package.
    scope: leaf
    for: [markdown]
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: objectives/supply-chain/trojanized/app/package::skill-tool-classic-prompt-injection
    unless:
      - id: well-known/tool/detection/agent-audit-kit::scanner-context
