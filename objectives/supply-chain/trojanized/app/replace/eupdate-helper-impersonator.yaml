# Dorifel/Zusy-style droppers reuse the Eupdate Helper version resource while
# shipping UPX-packed WinHTTP download staging unrelated to the real mirror.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005,T1027,T1105

composite_rules:
  - id: trojanized-eupdate-ip-staged-persistent-downloader
    desc: UPX-packed Eupdate impersonator downloads from IP and persists via Run
    crit: hostile
    conf: 0.96
    attack: T1036.005,T1027,T1105,T1547.001
    # Verified-hostile packed build: full Eupdate Helper cover (version
    # resource, mutex, ESET paths, overlay release tag) around an update
    # channel pinned to a hardcoded external-IP:port endpoint. The info.txt
    # fetch parses a server-chosen `downurl:` executable URL, downloads it
    # over cleartext HTTP with only an MZ-header check, swaps its own image
    # and launches it, while persisting via HKLM Run. Genuine packed builds
    # of the mirror carry the full application body (mutex, ESET paths,
    # or release tag) and are excepted via eupdate-helper-binary.
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: well-known/app/security/eupdate-helper::eupdate-helper-product-identity
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-port-binary
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-text-download-flow
      - id: micro-behaviors/os/registry/manipulate::run-key-file-operation-api-profile
      - id: micro-behaviors/fs/file/copy::self-copy-relaunch-api-set
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: well-known/app/security/eupdate-helper::eupdate-helper-binary

  - id: trojanized-eupdate-upx-winhttp-dropper
    desc: UPX-packed binary impersonates Eupdate Helper with WinHTTP staging
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: well-known/app/security/eupdate-helper::eupdate-helper-product-identity
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-text-download-flow
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      # A packed build of the real mirror carries the author's appended
      # release tag and passes the family identity; only identity without
      # that body is the impersonation this rule convicts.
      - id: well-known/app/security/eupdate-helper::eupdate-helper-binary

  - id: trojanized-eupdate-unpacked-downurl-stager
    desc: Unpacked Eupdate impersonator stages a server-directed executable via downurl
    crit: hostile
    conf: 0.96
    attack: T1036.005,T1105,T1547.001
    # Unpacked build of the same info.txt/downurl: staging family: full
    # Eupdate Helper cover (version resource, mutex, ESET paths, overlay
    # release tag) around a hardcoded external-IP:port info.txt channel whose
    # server-chosen `downurl:` executable URL is downloaded over cleartext
    # HTTP, swapped into its own image and launched, persisting via HKLM Run.
    # The UPX leg of the packed rules misses this build; an impersonator
    # lacking the genuine mirror body (mutex, ESET paths, or release tag)
    # is convicted, while genuine mirror builds are excepted via
    # eupdate-helper-binary.
    all:
      - id: well-known/app/security/eupdate-helper::eupdate-helper-product-identity
      - id: micro-behaviors/communications/http/download/url::downurl-stage-directive-pe
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-port-binary
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-text-download-flow
      - id: micro-behaviors/os/registry/manipulate::run-key-file-operation-api-profile
      - id: micro-behaviors/fs/file/copy::self-copy-relaunch-api-set
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: well-known/app/security/eupdate-helper::eupdate-helper-binary

  - id: trojanized-eupdate-ip-pinned-info-txt-stager
    desc: Eupdate cover stages EXE via IP-pinned info.txt, persists via Run
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1027,T1105,T1547.001
    # Same info.txt/downurl: staging family as the vetoed sibling above, but
    # the manifest fetch itself is pinned to an external IP literal
    # (http://IP:port/...info.txt) instead of any IP:port URL. Vendor update
    # channels use domains and a LAN mirror's serve address is private, so a
    # copied product identity cannot launder this chain into the benign
    # mirror identity. No mirror-veto unless: a server-directed staged
    # executable fetch over an IP-pinned channel is never mirror behavior.
    all:
      - id: well-known/app/security/eupdate-helper::eupdate-helper-product-identity
      - id: micro-behaviors/communications/http/download/url::downurl-stage-directive-pe
      - id: micro-behaviors/communications/http/download/url::ip-pinned-staging-manifest-channel-pe
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-text-download-flow
      - id: micro-behaviors/os/registry/manipulate::run-key-file-operation-api-profile
      - id: micro-behaviors/fs/file/copy::self-copy-relaunch-api-set
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
