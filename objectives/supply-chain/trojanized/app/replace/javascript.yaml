defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002

traits:
  - id: renames-official-host-path
    desc: Renames the official host executable
    crit: component
    conf: 0.99
    if:
      type: text
      regex: 'fs\.rename\(officialPath\s*,\s*stash\)'

  - id: copies-patched-host-path
    desc: Copies patched binary to host path
    crit: component
    conf: 0.99
    if:
      type: text
      regex: 'fs\.copyFile\(patchedPath\s*,\s*officialPath\)'

  - id: selfpatch-starts-on-plugin-load
    desc: Starts self-patch during plugin load
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '\brunSelfPatch\(root\)'

composite_rules:
  - id: host-binary-swap-operation
    desc: Swaps a patched binary over the host
    crit: notable
    conf: 0.99
    near_lines: 20
    all:
      - id: renames-official-host-path
      - id: copies-patched-host-path

  - id: selfpatches-official-host-binary
    desc: Plugin replaces the official host executable at runtime
    crit: hostile
    conf: 0.995
    scope: archive
    for: [javascript, typescript, npm, tar, archives]
    all:
      - id: host-binary-swap-operation
      - id: selfpatch-starts-on-plugin-load

  # PolinRider persists by overwriting npm/lib/cli.js: every later npm, npx,
  # or npm exec invocation re-enters a network loader hidden beyond a long
  # whitespace run. The official npm entrypoint identity plus concealment,
  # outbound retrieval, and detached execution detects the replacement
  # technique without a campaign marker, wallet, endpoint, or package name.
  - id: npm-cli-concealed-detached-network-stage
    desc: Trojanized npm CLI conceals and detaches a network-fetched stage
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1027,T1105,T1059.007
    all:
      - id: well-known/tool/development/npm-cli::npm-cli-entrypoint
      - id: objectives/anti-static/obfuscation/instruction/junk-insertion::leading-whitespace-padded-line
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
