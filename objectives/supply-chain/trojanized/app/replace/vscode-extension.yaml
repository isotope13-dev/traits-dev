# A VS Code extension that resolves the editor's own application files and
# rewrites them is modifying the trusted host, not merely customizing a theme.
# Keep the atoms generic enough to catch another extension using a different
# runtime directory or marker, and let the archive-level composite supply the
# extension and automatic-activation context.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1608.004

traits:
  - id: vscode-application-root-access
    desc: Extension resolves VS Code application root
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: member
      exact: vscode.env.appRoot

  - id: vscode-host-main-file-reference
    desc: Extension targets VS Code main.js
    crit: notable
    conf: 0.94
    if:
      type: text
      # A bare `(^|/)main.js` matched a vendored module path
      # (`jsonc-parser/lib/esm/main.js`). Host-file targeting needs the VS Code
      # install layout: out/bootstrap/vs path segments or the workbench bundle.
      regex: '(?i)[\\/](out|bootstrap|vs)[\\/][^;\r\n]{0,60}main\.js|workbench[^;\r\n]{0,60}main\.js'

  - id: vscode-host-workbench-file-reference
    desc: Extension targets VS Code workbench HTML
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)workbench(\.esm)?\.html'

composite_rules:
  - id: vscode-host-file-rewrite
    for: [javascript, typescript, vsix]
    desc: Extension rewrites VS Code host files
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: vscode-application-root-access
      - id: vscode-host-main-file-reference
      - id: vscode-host-workbench-file-reference
      - id: micro-behaviors/fs/write/file/full::js-file-write
    any:
      - id: micro-behaviors/fs/file/copy::js-exists-and-copy
      - id: micro-behaviors/fs/delete/directory::fs-rm-recursive

  - id: vscode-extension-elevated-host-tampering
    for: [javascript, typescript, package.json, vsix]
    desc: VS Code extension elevates to rewrite host
    crit: hostile
    conf: 0.99
    scope: archive
    attack: T1195.002,T1548
    all:
      - id: vscode-host-file-rewrite
      - id: well-known/lib/development/vscode::vscode-extension-marker
      - id: metadata/permission/activation::on-startup-finished
      - id: micro-behaviors/process/create/shell/bridge::child-process-require
    any:
      - id: micro-behaviors/os/privilege/elevation::pkexec-binary-reference
      - id: micro-behaviors/os/privilege/elevation::applescript-admin-prompt
      - id: micro-behaviors/os/privilege/elevation::runas-verb
