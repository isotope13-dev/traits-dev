# A compromised application server can turn a legitimate client distribution
# into a participant-side infection source.  These rules combine a public
# server-side script write with replacement of a distributed client executable.
# Product names, filenames, and implementation languages are not required.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1195.002,T1505.003
  mbc: B0030

traits:
  - id: public-web-script-path
    desc: Script path under a public web root
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(public|wwwroot|htdocs|webroot)[\\/][^"''\r\n]{1,120}\.(php|aspx?|jsp|cgi|pl|py)\b'

  - id: client-instfiles-dir-path
    desc: ClientInstFiles distribution directory
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)ClientInstFiles[\\/]'

  - id: labeled-client-distribution-dir
    desc: Labeled client distribution directory
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)(client|installer|setup|update)[\\/](dist|download|release)[\\/]'

  - id: reverse-labeled-client-dir
    desc: Reversed client distribution path
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)(dist|download|release)[\\/](client|installer|setup|update)[\\/]'

  - id: client-installer-exe-name
    desc: Client or installer executable name
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)(client|installer|setup|update)[^\\/"''\r\n]{0,60}\.(exe|msi)\b'

  - id: client-installer-package-name
    desc: Client package installer name
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)(client|installer|setup|update)[^\\/"''\r\n]{0,60}\.(dmg|pkg|deb|rpm)\b'

composite_rules:
  - id: public-server-script-write
    desc: Writes script under a public web root
    crit: suspicious
    conf: 0.95
    near_bytes: 2048
    all:
      - id: public-web-script-path
    any:
      - id: micro-behaviors/fs/file/write/

  - id: client-distribution-installer-path
    desc: Client installer path in distribution tree
    crit: notable
    conf: 0.94
    near_bytes: 512
    all:
      - id: client-installer-dir-path
    any:
      - id: client-installer-exe-name
      - id: client-installer-package-name

  - id: client-installer-dir-path
    desc: Client distribution directory path
    crit: component
    conf: 0.92
    any:
      - id: client-instfiles-dir-path
      - id: labeled-client-distribution-dir
      - id: reverse-labeled-client-dir

  - id: client-installer-overwrite
    desc: Overwrites distributed client installer
    crit: suspicious
    conf: 0.96
    near_lines: 20
    all:
      - id: client-distribution-installer-path
    any:
      - id: micro-behaviors/fs/file/copy/
      - id: micro-behaviors/fs/file/move/
      - id: micro-behaviors/fs/write/file/

  - id: server-distribution-client-trojanization
    desc: Server swaps a distributed client installer
    crit: hostile
    conf: 0.98
    near_lines: 40
    all:
      - id: public-server-script-write
      - id: client-installer-overwrite
