# A compromised application server can turn a legitimate client distribution
# into a participant-side infection source.  These rules combine a public
# server-side script write with replacement of a distributed client executable.
# Product names, filenames, and implementation languages are not required.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1195.002,T1505.003
  mbc: B0030

traits:
  - id: client-instfiles-dir-path
    desc: ClientInstFiles distribution directory
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)ClientInstFiles[\\/]'

  - id: client-installer-exe-name
    desc: Client or installer executable name
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)(^|[\\/"''])(client|installer|setup|update)[^\\/"''\r\n]{0,60}\.(exe|msi)\b'

  - id: installer-signing-pipeline-mention
    desc: Installer code-signing pipeline reference
    crit: notable
    conf: 0.9
    # Scripts only: every signed binary embeds a codesigning CRL URL in its
    # certificate, so this matcher must never see binaries.
    for: [shell, powershell, batch]
    if:
      type: text
      regex: '(?i)code[\\s-]?sign|signtool|Set-AuthenticodeSignature'
    unless:
      - id: well-known/app/ai/coding-agent/reason-machines::reason-machines-cli-context

composite_rules:
  - id: client-distribution-installer-path
    desc: Client installer path in distribution tree
    crit: notable
    conf: 0.94
    near_bytes: 512
    all:
      - id: client-installer-dir-path
    any:
      - id: client-installer-exe-name
      - id: micro-behaviors/os/package-manager/installer-script::installer-package-filename

  - id: client-installer-dir-path
    desc: Client distribution directory path
    crit: component
    conf: 0.92
    any:
      - id: client-instfiles-dir-path
      - id: micro-behaviors/fs/path/application/bundle::client-distribution-directory-path
      - id: micro-behaviors/fs/path/application/bundle::client-distribution-directory

  - id: client-installer-overwrite
    desc: Overwrites distributed client installer
    crit: suspicious
    conf: 0.96
    near_lines: 20
    all:
      - id: client-distribution-installer-path
    any:
      - id: micro-behaviors/fs/file/copy/
      - id: micro-behaviors/fs/file/concat::cmd-binary-file-concatenation
      - id: micro-behaviors/fs/file/concat::ftp-local-binary-file-concatenation
      - id: micro-behaviors/fs/file/concat::cmd-wildcard-script-concatenation
      - id: micro-behaviors/fs/file/concat::cmd-html-wrapper-concatenation
      - id: micro-behaviors/fs/file/move/
      - id: micro-behaviors/fs/write/file/
    unless:
      # A build script staging the installer it just built into a release
      # directory for signing is the software factory at work, not a server
      # swapping a distributed installer.
      - id: objectives/supply-chain/trojanized/app/replace::installer-stage-for-signing-context
      - id: metadata/build/ci/github-actions::workflow-definition-path

  # Build staging context for the installer-overwrite composite above.
  # Kept as an exception composite so it only ever suppresses, never fires
  # on its own.
  - id: installer-stage-for-signing-context
    desc: Build stages its own installer for signing
    crit: exception
    all:
      - id: objectives/supply-chain/trojanized/app/replace::client-distribution-installer-path
      - id: objectives/supply-chain/trojanized/app/replace::installer-signing-pipeline-mention

  - id: server-distribution-client-trojanization
    desc: Server swaps a distributed client installer
    crit: hostile
    conf: 0.98
    near_lines: 40
    all:
      - id: micro-behaviors/fs/write/content::file-write-near-public-web-script-path
      - id: client-installer-overwrite
