defaults:
  platforms: [macos]
  attack: T1554
  mbc: B0025

composite_rules:
  - id: homebrew-cellar-binary-swap
    desc: Replaces Homebrew Cellar executable and symlinks binary
    crit: hostile
    conf: 0.96
    for: [shell]
    all:
      - id: micro-behaviors/fs/path/package-manager::homebrew-cellar-path
      - id: micro-behaviors/fs/delete/file/command::rm-force-variable-target
      - id: micro-behaviors/fs/file/move::mv-command
    any:
      - id: micro-behaviors/fs/link::shell-ln-symbolic-link-command
      - id: micro-behaviors/fs/path/package-manager::homebrew-bin-tool-path
    unless:
      - id: metadata/package/manager::homebrew-formula-class

  - id: homebrew-cellar-python-binary-swap
    desc: Replaces Homebrew Cellar executable from Python and symlinks binary
    crit: hostile
    conf: 0.96
    for: [python]
    all:
      - id: micro-behaviors/fs/path/package-manager::homebrew-cellar-path
      - id: micro-behaviors/fs/delete/file/library::py-remove
      - id: micro-behaviors/fs/file/move::python-rename-call
    any:
      - id: micro-behaviors/fs/link::python-os-symlink-call
      - id: micro-behaviors/fs/path/package-manager::homebrew-bin-tool-path
    unless:
      - id: metadata/package/manager::homebrew-formula-class
