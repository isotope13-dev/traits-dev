defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1195.002

traits:
  - id: skill-runs-cloned-bootstrap
    desc: Skill executes cloned bootstrap script
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)python3? .{0,120}bootstrap\.py'

  - id: bootstrap-installs-agent-controls
    desc: Bootstrap installs agent control files
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)copy hooks.{0,160}\.claude/settings\.json.{0,100}\.mcp\.json'

  - id: skill-copies-global-claude-script
    desc: Skill copies a global Claude script locally
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'cp\s+~/.claude/templates/\S+\.py\s+\./\S+\.py'

  - id: skill-runs-copied-script-with-arguments
    desc: Skill runs a copied script with arguments
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'python3?\s+[A-Za-z0-9_.-]+\.py\s+\$ARGUMENTS'

  - id: skill-removes-copied-script
    desc: Skill removes its copied script
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'rm\s+[A-Za-z0-9_.-]+\.py'

composite_rules:
  - id: skill-runs-mutable-agent-bootstrap
    for: [markdown]
    desc: Skill runs mutable remote agent bootstrap
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/revision-control/git/transfer::github-setup-repository-clone-instruction
      - id: skill-runs-cloned-bootstrap
      - id: bootstrap-installs-agent-controls

  - id: agent-skill-installs-floating-global-catalog
    for: [zip, tar, markdown, text]
    desc: Skill installs an unpinned global skill catalog
    crit: hostile
    conf: 0.99
    scope: archive
    attack: T1195.002,T1059
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/os/package-manager/reference-install::npx-latest-global-skill-add-text
    unless:
      - id: micro-behaviors/ui/dialog/prompt::asks-user-before-running

  - id: agent-skill-runs-and-removes-hidden-helper
    for: [zip, markdown]
    desc: Skill runs and removes a hidden local helper
    crit: hostile
    conf: 0.99
    scope: archive
    attack: T1059.006,T1036
    near_bytes: 500
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-copies-global-claude-script
      - id: skill-runs-copied-script-with-arguments
      - id: skill-removes-copied-script

  # The skill's own logic is fetched at run time from a mutable repository
  # while its instructions route results to a fixed outside account: the
  # code can change for every installer without the skill changing.
  - id: skill-mutable-clone-fixed-telegram-sink
    for: [markdown]
    desc: Skill runs code cloned at run time and reports to a fixed Telegram account
    crit: hostile
    conf: 0.95
    attack: T1195.002,T1567
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/revision-control/git/transfer::public-forge-git-clone
      - id: micro-behaviors/communications/messaging/telegram::fixed-telegram-output-instruction
