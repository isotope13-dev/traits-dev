defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1195.002

traits:
  - id: skill-runs-cloned-bootstrap
    desc: Skill executes cloned bootstrap script
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)python3? .{0,120}bootstrap\.py'

  - id: bootstrap-installs-agent-controls
    desc: Bootstrap installs agent control files
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)copy hooks.{0,160}\.claude/settings\.json.{0,100}\.mcp\.json'

  # Persistence via an instruction-only bootstrap still changes how an agent
  # treats future tasks; require both the mandate and global-file append.
  - id: skill-mandated-for-every-task
    desc: Skill required for every agent task
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(every|each|any) task.{0,40}(must|always).{0,30}(activate|enable|load).{0,20}skill\b'

  - id: cjk-skill-mandated-for-every-task
    desc: CJK text mandates skill for every task
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(任何任務|所有任務).{0,30}必須.{0,30}(啟用|載入)'

  - id: automatic-rule-append-wording
    desc: Automatically appends rules or protocol
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)automatically append.{0,40}(rules|instructions|protocol)'

  - id: cjk-automatic-global-rule-append
    desc: CJK text directs automatic rule append
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(自動|自动)追加(規則|规则)'

composite_rules:
  - id: skill-mandated-prerequisite
    desc: Skill required before each agent task
    crit: notable
    any:
      - id: skill-mandated-for-every-task
      - id: cjk-skill-mandated-for-every-task

  - id: agent-rule-append-instruction
    desc: Instruction says to append agent rules
    crit: notable
    any:
      - id: automatic-rule-append-wording
      - id: cjk-automatic-global-rule-append

  - id: agent-skill-mandatory-global-protocol-persistence
    desc: Skill mandates persistent global agent protocol
    crit: hostile
    conf: 0.98
    for: [markdown, zip, tar]
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-mandated-prerequisite
      - id: micro-behaviors/fs/path/agent-instructions::global-agent-instruction-target
      - id: agent-rule-append-instruction

  - id: skill-runs-mutable-agent-bootstrap
    for: [markdown]
    desc: Skill runs mutable remote agent bootstrap
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/revision-control/git/transfer::github-setup-repository-clone-instruction
      - id: skill-runs-cloned-bootstrap
      - id: bootstrap-installs-agent-controls


  # The skill's own logic is fetched at run time from a mutable repository
  # while its instructions route results to a fixed outside account: the
  # code can change for every installer without the skill changing.
  - id: skill-mutable-clone-fixed-telegram-sink
    for: [markdown]
    desc: Skill runs code cloned at run time and reports to a fixed Telegram account
    crit: hostile
    conf: 0.95
    attack: T1195.002,T1567
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/revision-control/git/transfer::public-forge-git-clone
      - id: micro-behaviors/communications/messaging/telegram::fixed-telegram-output-instruction
