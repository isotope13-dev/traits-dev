defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1195.002

traits:
  - id: skill-runs-cloned-bootstrap
    desc: Skill executes cloned bootstrap script
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)python3? .{0,120}bootstrap\.py'

  - id: bootstrap-installs-agent-controls
    desc: Bootstrap installs agent control files
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)copy hooks.{0,160}\.claude/settings\.json.{0,100}\.mcp\.json'

composite_rules:
  - id: skill-runs-mutable-agent-bootstrap
    for: [markdown]
    desc: Skill runs mutable remote agent bootstrap
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/process/create/vcs/git::github-setup-repository-clone-instruction
      - id: skill-runs-cloned-bootstrap
      - id: bootstrap-installs-agent-controls

