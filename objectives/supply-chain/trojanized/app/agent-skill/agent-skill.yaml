    # excluded via the unless below, not via leaf scope (which is
    # unsatisfiable: no leaf type matches every required leg).
    scope: archive
    for: [python, markdown, zip, tar]
    all:
      - id: well-known/app/ai/knowledge/agent-skills::skill-definition-file
      - id: python-magic-trigger-constant
    any:
