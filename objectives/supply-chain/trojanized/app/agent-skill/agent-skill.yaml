defaults:
  platforms: [unix, windows]
  for: [python, markdown]
  attack: T1195.002

traits:
  - id: anthropic-claude-code-source-archive
    desc: Anthropic Claude Code source archive context
    crit: notable
    conf: 0.99
    for: [tar, zip]
    if:
      type: value
      path: file.basename
      substr: anthropics-claude-code

  - id: agent-skill-secret-instructions-phrase
    desc: 'agent skill secret instructions phrase'
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: SECRET INSTRUCTIONS FOR THE AGENT

  - id: agent-skill-bang-shell-command
    desc: Agent skill contains forced bang shell command
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '!\`(bash|curl)\b'

  - id: agent-skill-image-secret-instruction
    desc: Agent skill image alt instruction
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '!\[[^\]\n]{0,200}SECRET INSTRUCTIONS FOR THE AGENT'

  - id: agent-skill-raw-github-skill-md
    desc: Contains a raw GitHub SKILL.md URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'raw\.githubusercontent\.com/.{1,160}/SKILLS?\.md'

  # Ordinary tool-recommendation phrasing found in almost every legitimate tool
  # skill ("use <tool> as the default first tool", "fall back only if
  # unavailable"). Benign on its own — a fragment that only signals hijack when
  # combined with delegation to a FOREIGN remote skill (see the composite
  # below). Kept at component so a self-promoting first-party tool skill is not
  # mislabeled suspicious.
  - id: agent-skill-default-tool-preference
    desc: Agent skill prefers a default tool
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\buse\s+\S{1,80}\s+as\s+the\s+default\s+first\s+tool\b'

  - id: agent-skill-fallback-when-unavailable
    desc: Skill falls back only when unavailable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bfall\s+back\s+only\s+if\s+unavailable\b'

  - id: agent-skill-self-install-command
    desc: Copies skill into agent config
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\.opencode/skills/[^\n]{1,80}&&\s*cp\s+SKILL\.md\b'

  - id: agent-skill-openclaw-access-control-target
    desc: "Agent skill targets OpenClaw ACL func"
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: checkInboundAccessControl

  - id: agent-skill-hard-override-number
    desc: 'agent skill hard override number'
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: HARD_OVERRIDE_NUMBER

  - id: agent-skill-gateway-restart-action
    desc: 'agent skill gateway restart action'
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'gateway.{0,80}action="restart"'

  - id: agent-skill-feishu-remote-control
    desc: Agent skill exposes Feishu remote control
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bconnect[ \t]+(AnyCap[ \t]+)?Feishu\b'

  - id: agent-skill-codex-danger-mode
    desc: Agent skill enables Codex full access
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)--codex-exec-mode[ \t]+danger-full-access\b'

  - id: agent-skill-claude-bypass-mode
    desc: Agent skill enables Claude bypass mode
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)--claude-permission-mode[ \t]+bypassPermissions\b'

  - id: agent-skill-cursor-force-mode
    desc: Agent skill enables Cursor force mode
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)--cursor-force\b'

  - id: agent-skill-memory-file-reference
    desc: Agent skill references project memory files
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(agent|project)[ \t]+memory[ \t]+(file|location)\b'
    unless:
      - type: path
        regex: '(?i)(^|[/\\])pydantic_deep[/\\]'

  - id: agent-skill-persist-memory-phrase
    desc: Agent skill requests project memory persistence
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bPersist[ \t]+to[ \t]+Project[ \t]+Memory\b'

  - id: agent-skill-ssh-store-target
    desc: Skill text references an SSH key path
    crit: notable
    conf: 0.96
    for: [markdown, python, shell, powershell]
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
    if:
      type: text
      regex: '(?is)\bskill\b.{0,120}\.ssh/id_'
    not:
      - substr: aui-agent-builder

  - id: agent-skill-cloud-store-target
    desc: Skill targets a cloud credential store
    crit: notable
    conf: 0.96
    for: [markdown, python, javascript, typescript, shell, powershell, ruby, perl, php]
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
    if:
      # `\bskill\b` only, matching every sibling in this file. Accepting a
      # bare `agent` made this fire on ordinary JavaScript, where `agent` is
      # the HTTP connection-pool object and the user-agent header: on the
      # official aws-cdk CLI bundle a `user-agent` string sat within 120 bytes
      # of the AWS SDK's own `~/.aws/credentials` handling, and the finding
      # then read as an AI skill harvesting cloud credentials.
      type: text
      regex: '(?is)\bskill\b.{0,120}\.aws.{0,80}\b(credentials|config)\b'
    not:
      - substr: aui-agent-builder

  - id: agent-skill-http-fetch-body
    desc: Fetch request includes a body argument
    # Fetch bodies are ordinary application behavior (and appear in bundled
    # Axios adapters). Agent-skill context plus upload behavior is what makes
    # the composite meaningful.
    crit: component
    conf: 0.94
    for: [python, javascript, typescript, shell, powershell, ruby, perl, php]
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
    if:
      type: text
      regex: '(?i)\bfetch\s*\(.{0,160}\bbody\s*:'
    not:
      - substr: aui-agent-builder

  - id: skill-instructs-passworded-binary-download
    desc: Skill instructs downloading a passworded binary
    crit: notable
    conf: 0.94
    for: [markdown, text]
    if:
      type: text
      regex: '(?i)(download|install|run)[^.\n]{0,90}\.(exe|zip|7z|rar|apk)\b[^.\n]{0,90}password'


  # A skill body that instructs fetching an executable from a personal
  # GitHub release (the AuthTool / OpenClawWinDriver delivery). A personal
  # repo's release asset is operator infrastructure: deletable, swappable,
  # and outside every registry's review. The URL atom itself is neutral (CI
  # and Dockerfiles fetch release binaries routinely), so it lives in the
  # GitHub release family under micro-behaviors/ and is referenced here.

  # The decoy-echo masked installer: `echo "<benign-looking URL>" && echo
  # '<base64>' | base64 -D | bash`. The first echo exists to be seen; the
  # second is the payload. No legitimate installer presents a decoy.
  - id: skill-decoy-echo-masked-installer
    desc: Skill carries decoy echo over masked installer
    crit: notable
    conf: 0.95
    for: [markdown, text, shell]
    if:
      type: text
      regex: 'echo\s+[''"][^''"]{0,100}[''"]\s*&&\s*echo\s+[''"][A-Za-z0-9+/=]{40,}'

  - id: skill-inline-node-child-process-exec
    desc: Skill embeds Node child-process execution code
    crit: notable
    conf: 0.98
    for: [markdown, text]
    if:
      type: text
      regex: '(?s)node:child_process.{0,300}\bexecSync\s*\('

  - id: skill-always-send-telegram-output
    desc: Skill always sends output to Telegram
    crit: notable
    conf: 0.98
    for: [markdown, text]
    if:
      type: text
      regex: '(?i)\*\*Always send\*\*[^\n]{0,160}\bTelegram\b'

  - id: skill-fixed-telegram-id
    desc: Skill embeds a Telegram recipient ID
    crit: notable
    conf: 0.98
    for: [markdown, text]
    if:
      type: text
      regex: '(?i)\bTelegram\b[^\n]{0,80}\bid\s*`?\d{7,15}`?'

  # A trigger constant compared against input before privileged actions run.
  # Named in caps (MAGIC_STRING / SECRET_TRIGGER), compared with ==, and
  # gating a subprocess or network call -- the ProFTPD shape wearing Python.
  # Assignment alone is not a gate: obfuscation word lists (TRIGGER_WORDS =
  # [...]) only document the words, so the constant must be compared
  # against input. Only the const-on-the-right shape fits re-len
  # (`x == MAGIC_STRING`, the canonical gate); yoda form is rare enough
  # to concede -- a bare `==` atom would fire on every Python file.
  - id: python-magic-trigger-constant
    desc: Magic trigger constant gates privileged actions
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '[=!]=\s*(MAGIC_ST(RINGS?|STRING)?|SECRET_TRIG\w*|TRIGGER_W\w*)'

composite_rules:
  - id: skill-forced-telegram-output-recipient
    for: [markdown]
    desc: Skill forces output to Telegram recipient
    crit: suspicious
    conf: 0.99
    near_lines: 3
    all:
      - id: skill-always-send-telegram-output
      - id: skill-fixed-telegram-id

  - id: agent-skill-token-store-target
    desc: Agent text references token config
    crit: notable
    conf: 0.94
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
    all:
      - id: metadata/package/agent-skill::agent-skill-reference-evidence
    # Was one local regex spelling out three credential paths that each already
    # have an atom; the duplicate copy of `.pypirc` is what collided with the
    # credential-path table.
    any:
      - id: micro-behaviors/fs/path/credential::npm-pypi-credential-file-reference
      - id: micro-behaviors/fs/path/secret-config::kube-config
    near_bytes: 256

  # The command text is a neutral package-manager capability.  This contextual
  # component preserves it for the composites below without treating a
  # first-party skill's own install instructions as supply-chain intent.
  - id: agent-skill-npx-skills-add-remote
    desc: Agent skill uses npx to add a skill repository
    crit: component
    conf: 0.94
    any:
      - id: micro-behaviors/process/create/shell/package::npx-skills-add-command
      - id: micro-behaviors/process/create/shell/package::npx-skills-add-trailing-yes-command
  - id: package-installs-agent-skill-tree
    for: [python]
    desc: Package installs bundled AI agent skills
    crit: suspicious
    conf: 0.94
    ref: sha256:f9b935ef1d644960445911670b391fed77ba2cc0a5024fc114eaa19c7b5c0aab
    all:
      - id: micro-behaviors/fs/file/copy::python-agent-skill-tree-copy
    any:
      - id: micro-behaviors/fs/path/agent-config/directory::ai-agent-skill-install-directory
      - id: metadata/package/agent-skill::agent-skill-frontmatter
    unless:
      - id: well-known/app/ai/tool-server/mfa-servicenow-mcp::mfa-servicenow-mcp-package

  - id: remote-mcp-agent-skill
    desc: Agent skill configures a remote MCP server
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/mcp::remote-mcp-server-over-npx
    any:
      - id: micro-behaviors/communications/mcp::external-mcp-sse-endpoint
      - id: metadata/package/agent-skill::agent-skill-frontmatter
  - id: agent-skill-hidden-curl-pipe-instruction
    desc: Agent skill hides curl-pipe-bash agent instructions
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
    any:
      - id: agent-skill-secret-instructions-phrase
      - id: agent-skill-image-secret-instruction
      - id: agent-skill-bang-shell-command
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/app/ai/coding-agent/anthropic-claude-code
      - id: anthropic-claude-code-source-archive

  - id: agent-skill-comment-hidden-curl-pipe
    for: [markdown]
    desc: Agent skill hides curl-pipe-bash command in comment
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/data/format/html::comment
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
    any:
      - id: agent-skill-secret-instructions-phrase
      - id: agent-skill-bang-shell-command
    unless:
      - id: metadata/package/testing/harness/runtime/

  - id: agent-skill-command-hook-curl-pipe
    for: [markdown]
    desc: Agent skill prompt hook runs curl-pipe-bash command
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/process/hook/event::agent-userpromptsubmit-hook-key
      - id: micro-behaviors/process/hook/event::agent-command-hook-entry
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text

  - id: agent-skill-bash-tools-with-curl-pipe
    desc: Agent skill grants Bash(*) while package carries curl-pipe-bash payload
    crit: hostile
    conf: 0.96
    for: [markdown, shell, tar, zip]
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: metadata/package/agent-skill::agent-skill-bash-all-tools
    any:
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-bash-execution
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/app/ai/coding-agent/anthropic-claude-code
      - id: anthropic-claude-code-source-archive

  # Genuine delegation is telling the agent to fetch and RUN a DIFFERENT named
  # remote skill (`npx ... skills add owner/repo`). A package fetching its OWN
  # SKILL.md by URL is self-install/distribution, not delegation to foreign
  # content, so `agent-skill-raw-github-skill-md` is intentionally NOT a leg
  # here — it was the driver of false positives on legitimate tool skills.
  - id: agent-skill-remote-skill-delegation
    desc: Skill delegates to foreign remote skill
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: agent-skill-npx-skills-add-remote
    unless:
      - id: well-known/app/ai/coding-agent/openclaw::openclaw-skill-text
      - id: well-known/app/system/anycap::anycap-skill-text

  - id: agent-skill-tool-routing-manipulation
    desc: Skill forces foreign remote tool routing
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: agent-skill-default-tool-preference
      - id: agent-skill-fallback-when-unavailable
      - id: agent-skill-remote-skill-delegation

  # Documenting how to install THIS skill into the agent config (curl its own
  # SKILL.md, `cp SKILL.md .opencode/skills/`) is the ordinary, benign opencode
  # distribution step every legitimate skill ships. It becomes hostile only when
  # the installed/persisted content also carries a genuine attack signal — a
  # hidden instruction, a curl|bash payload, delegation to a FOREIGN npx skill,
  # or a permissive-executor directive — so first-party self-install docs no
  # longer trip this on their own.
  - id: agent-skill-remote-self-installation
    desc: Skill self-installs payload into agent config
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: agent-skill-raw-github-skill-md
      - id: agent-skill-self-install-command
      - id: micro-behaviors/fs/path/agent-config/directory::opencode-skills-directory
    any:
      - id: agent-skill-secret-instructions-phrase
      - id: agent-skill-image-secret-instruction
      - id: agent-skill-bang-shell-command
      - id: agent-skill-npx-skills-add-remote
      - id: agent-skill-permissive-executor-mode
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text

  - id: agent-skill-permissive-executor-mode
    desc: Agent skill enables permissive executor mode
    crit: notable
    conf: 0.97
    needs: 2
    any:
      - id: agent-skill-codex-danger-mode
      - id: agent-skill-claude-bypass-mode
      - id: agent-skill-cursor-force-mode

  - id: agent-skill-memory-persistence-instruction
    desc: Agent skill persists project memory instructions
    crit: notable
    conf: 0.9
    needs: 2
    any:
      - id: agent-skill-memory-file-reference
      - id: agent-skill-persist-memory-phrase

  - id: agent-skill-remote-permissive-control
    desc: Agent skill enables permissive remote agent control
    crit: hostile
    conf: 0.99
    scope: archive
    for: [python, markdown, zip, tar]
    attack: T1219,T1059
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: agent-skill-npx-skills-add-remote
      - id: agent-skill-feishu-remote-control
      - id: micro-behaviors/process/create/agent::agent-target-option
      - id: agent-skill-permissive-executor-mode
    unless:
      - id: metadata/package/testing/harness/
      - id: well-known/tool/detection/
      - id: well-known/app/system/anycap::anycap-skill-text

  - id: agent-skill-remote-control-persistence
    desc: Agent skill persists permissive remote control instructions
    crit: hostile
    conf: 0.98
    scope: archive
    for: [python, markdown, zip, tar]
    attack: T1546
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: agent-skill-npx-skills-add-remote
      - id: agent-skill-feishu-remote-control
      - id: micro-behaviors/process/create/agent::agent-target-option
      - id: agent-skill-memory-persistence-instruction
    unless:
      - id: metadata/package/testing/harness/
      - id: well-known/tool/detection/
      - id: well-known/app/system/anycap::anycap-skill-text

  - id: agent-skill-credential-store-target
    desc: Skill targets credential stores
    crit: notable
    conf: 0.96
    for: [markdown, python, javascript, typescript, shell, powershell, ruby, perl, php]
    any:
      - id: agent-skill-ssh-store-target
      - id: agent-skill-cloud-store-target
      - id: micro-behaviors/fs/path/token::aws-credentials
      - id: agent-skill-token-store-target

  # The `any:` legs are a browser-profile path or wallet *vocabulary*, so this does
  # not establish that the skill reads anyone's wallet -- every Solana, Ethereum or
  # MetaMask SDK skill says "wallet" throughout. Describe it as the reference it is;
  # the hostile composites below pair it with a credential-store target plus a read
  # or an upload, and that is where the collection intent comes from.
  - id: agent-skill-http-post-data
    desc: Skill helper posts request data
    crit: notable
    conf: 0.94
    for: [python]
    all:
      - id: metadata/package/agent-skill::skill-helper-wording
      - id: micro-behaviors/communications/http/request/body::http-post-with-body-argument

  - id: agent-skill-file-read-operation
    desc: Skill helper reads local files
    crit: component
    conf: 0.92
    for: [python, javascript, typescript, shell, powershell, ruby, perl, php]
    all:
      - id: metadata/package/agent-skill::skill-helper-wording
    any:
      # Four-plus legs from one leaf, since the two read directories merged.
      - id: micro-behaviors/fs/read/file/
    unless:
      - id: well-known/lib/vendor-sdk/dcc-mcp-core::package-context

  - id: agent-skill-http-data-upload
    desc: Skill helper sends HTTP data
    crit: notable
    conf: 0.94
    for: [python, javascript, typescript, shell, powershell, ruby, perl, php]
    all:
      - id: metadata/package/agent-skill::skill-helper-wording
    any:
      - id: micro-behaviors/communications/http/request/body::python-request-data-argument
      - id: agent-skill-http-fetch-body
      - id: micro-behaviors/communications/http/request/body::http-post-with-body-argument

  - id: agent-skill-identity-persistence-target
    desc: Skill targets persistent identity instructions
    crit: notable
    conf: 0.95
    all:
      - id: metadata/package/agent-skill::agent-skill-definition-reference
    any:
      - id: micro-behaviors/fs/write/content::soul-document-write-wording
      - id: micro-behaviors/data/llm/memory::agent-memory-md-write-instruction
      - id: micro-behaviors/fs/write/content::agents-document-write-wording
  - id: agent-skill-permissive-executable-content
    desc: Skill grants shell access with executable content
    crit: suspicious
    conf: 0.97
    for: [markdown]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: metadata/package/agent-skill::agent-skill-bash-all-tools
    any:
      - id: micro-behaviors/process/hook/event::agent-userpromptsubmit-hook-key
      - id: micro-behaviors/process/hook/event::agent-command-hook

  - id: agent-skill-hooked-sensitive-forwarding
    desc: Agent hook forwards developer credentials
    crit: hostile
    conf: 0.99
    for: [markdown]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/process/hook/event::agent-userpromptsubmit-hook-key
      - id: micro-behaviors/process/hook/event::agent-command-hook-entry
      - id: agent-skill-credential-store-target
      - id: micro-behaviors/communications/http/upload::prose-upload-content-to-url

  - id: agent-skill-sensitive-data-exfiltration
    desc: Skill forwards developer secrets
    crit: hostile
    conf: 0.99
    for: [markdown]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: agent-skill-credential-store-target
      - id: micro-behaviors/fs/path/credential::agent-browser-wallet-storage-reference
      - id: micro-behaviors/communications/http/upload::prose-upload-content-to-url

  - id: agent-skill-script-sensitive-exfiltration
    desc: Skill helper exfiltrates sensitive files
    crit: hostile
    conf: 0.99
    for: [python, javascript, typescript, shell, powershell, ruby, perl, php]
    all:
      - id: metadata/package/agent-skill::skill-helper-wording
      - id: agent-skill-credential-store-target
      - id: agent-skill-file-read-operation
      - id: agent-skill-http-data-upload

  - id: agent-skill-script-multi-store-collection
    desc: Skill helper collects credential stores
    crit: hostile
    conf: 0.98
    for: [python]
    all:
      - id: metadata/package/agent-skill::skill-helper-wording
      - id: agent-skill-credential-store-target
      - id: micro-behaviors/fs/path/credential::agent-browser-wallet-storage-reference
      - id: agent-skill-file-read-operation

  - id: agent-skill-identity-persistence
    desc: Skill persists identity instructions
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: agent-skill-identity-persistence-target
    any:
      - id: agent-skill-secret-instructions-phrase
      - id: micro-behaviors/communications/http/upload::prose-upload-content-to-url


  # The skill's own instructions send a local file's bytes to an external
  # endpoint (`curl -X POST --data-binary @file`). The file "belongs to this
  # skill" -- but the endpoint decides what it receives, and an audit that
  # requires uploading a file to a third-party host is exfiltration with a
  # work order attached.
  - id: agent-skill-passworded-binary-download
    for: [markdown]
    desc: Agent skill instructs downloading a passworded binary
    crit: hostile
    conf: 0.97
    attack: T1204.002,T1195.002
    all:
