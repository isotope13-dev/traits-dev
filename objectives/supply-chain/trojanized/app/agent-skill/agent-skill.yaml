  - id: agent-skill-tool-file-env-exfil
    for: [python]
    desc: Agent skill posts a file with harvested environment secrets
    crit: hostile
    conf: 0.96
    # File-scoped on purpose: the behaviour and the skill must be the same
    # file. See metadata/package/agent-skill::agent-skill-directory-member for why
    # archive pooling was wrong here.
    all:
      - id: metadata/package/agent-skill::agent-skill-file
