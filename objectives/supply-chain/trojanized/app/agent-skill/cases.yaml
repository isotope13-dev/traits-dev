defaults:
  platforms: [windows, unix]
  for: [tar, zip, python, markdown, text]
  attack: T1195.002

traits:
  # Path fragment from the unchecked-reader case skill itself. The generic
  # `base_dir = os.path.join(...)` branch that stood beside it fires on any
  # Python script that builds a directory from parsed arguments (ray's
  # start_ray_node.py among countless others); a plain path join is not an
  # unchecked reader, so only the case-specific template stays.
  - id: skill-reader-user-controlled-path
    desc: Skill reader /etc/app config path
    crit: notable
    conf: 0.98
    for: [python, markdown, text]
    if:
      type: text
      substr: '/etc/app/{config_name}'

  - id: skill-read-file-http-post
    desc: Skill posts read file contents
    crit: notable
    conf: 0.99
    for: [python, markdown, text]
    if:
      type: text
      regex: '(?is)open\(file_path\).{0,300}requests\.post'

  - id: skill-memory-amplification-loop
    desc: Skill repeats each item millions of times
    crit: notable
    conf: 0.98
    for: [python, markdown, text]
    if:
      type: text
      substr: '[item] * 10000000'

composite_rules:
  - id: skill-environment-secret-exfiltration-case
    desc: Agent skill exfiltrates environment secrets
    crit: hostile
    conf: 0.99
    for: [python]
    # The environment read, encoding, and request must be in the skill tool
    # itself. Archive-wide pairing with any SKILL.md frontmatter falsely
    # convicted unrelated Python files in applications that merely document
    # agent skills.
    scope: leaf
    all:
      - id: metadata/package/agent-skill::agent-skill-file
      - id: micro-behaviors/os/env/enumeration::python-environ-items-loop
      - id: micro-behaviors/communications/http/request/client::request-python
      - id: micro-behaviors/data/encode/base64::b64encode-call
    unless:
      - id: micro-behaviors/data/manipulation::sensitive-token-redaction

  - id: skill-file-exfiltration-case
    desc: Agent skill posts read file contents externally
    crit: hostile
    conf: 0.99
    scope: archive
    for: [tar, zip, python, markdown]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-read-file-http-post
      - id: micro-behaviors/communications/http/request/client::request-python
      - id: micro-behaviors/process/interpreter/eval/direct::eval-builtin

  - id: skill-dynamic-code-execution-case
    desc: Agent skill executes generated Python code
    crit: hostile
    conf: 0.99
    for: [python]
    # Keep the execution evidence in the actual skill tool file; a package can
    # legitimately ship SKILL.md files alongside unrelated Python examples.
    scope: leaf
    all:
      - id: metadata/package/agent-skill::agent-skill-file
      - id: micro-behaviors/process/interpreter/eval/direct::eval-builtin
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
    any:
      - id: micro-behaviors/process/interpreter/eval/compile::exec-compiled-code
      - id: micro-behaviors/process/interpreter/eval/direct::exec-formatted-string

  - id: skill-unchecked-file-reader-case
    desc: Agent skill exposes unchecked file paths
    crit: hostile
    conf: 0.99
    scope: leaf
    for: [python]
    all:
      - id: metadata/package/agent-skill::agent-skill-file
      - id: skill-reader-user-controlled-path

  - id: skill-resource-exhaustion-case
    desc: Agent skill contains resource exhaustion loop
    crit: hostile
    conf: 0.99
    scope: archive
    for: [tar, zip, python, markdown]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/data/control-flow/loop::python-while-true
      - id: skill-memory-amplification-loop
