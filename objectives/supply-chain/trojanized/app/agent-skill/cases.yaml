defaults:
  platforms: [windows, unix]
  for: [tar, zip, python, markdown, text]
  attack: T1195.002

traits:
  - id: skill-etc-path-template
    desc: Skill references dynamic /etc path
    crit: notable
    conf: 0.98
    for: [python, markdown]
    if:
      type: text
      regex: '(?i)/etc/[^\s{}]{1,60}/?\{[A-Za-z_]\w*\}'

  # Require the dynamic system path to be used by open nearby; a generic
  # interpolation or path join alone does not establish file access.
  - id: skill-dynamic-etc-path-open
    desc: Skill opens dynamic /etc path
    crit: notable
    conf: 0.98
    for: [python, markdown, text]
    if:
      type: text
      regex: '(?is)/etc/[^\s{}]{1,60}\{[A-Za-z_]\w*\}.{0,200}open\(\w+\)'

  - id: skill-read-file-http-post
    desc: Skill posts read file contents
    crit: notable
    conf: 0.99
    for: [python, markdown, text]
    if:
      type: text
      regex: '(?is)open\(file_path\).{0,300}requests\.post'

  - id: skill-memory-amplification-loop
    desc: Skill repeats each item millions of times
    crit: notable
    conf: 0.98
    for: [python, markdown, text]
    if:
      type: text
      substr: '[item] * 10000000'

composite_rules:
  - id: skill-environment-secret-exfiltration-case
    desc: Agent skill exfiltrates environment secrets
    crit: hostile
    conf: 0.99
    for: [python]
    # The environment read, encoding, and request must be in the skill tool
    # itself. Archive-wide pairing with any SKILL.md frontmatter falsely
    # convicted unrelated Python files in applications that merely document
    # agent skills.
    scope: leaf
    all:
      - id: metadata/package/agent-skill::agent-skill-file
      - id: micro-behaviors/os/env/enumerate/entries::python-environ-items-loop
      - id: micro-behaviors/communications/http/request/client/call::request-python
      - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
    unless:
      - id: micro-behaviors/data/manipulation::sensitive-token-redaction
      - id: well-known/tool/detection/agent/skill-scanner::cisco-skill-scanner-archive-context

  - id: skill-file-exfiltration-case
    desc: Agent skill posts read file contents externally
    crit: hostile
    conf: 0.99
    scope: archive
    for: [tar, zip, python, markdown]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-read-file-http-post
      - id: micro-behaviors/communications/http/request/client/call::request-python
      - id: micro-behaviors/process/interpreter/eval/python-builtins::eval-builtin
    unless:
      - id: well-known/tool/detection/agent/skill-scanner::cisco-skill-scanner-archive-context

  - id: skill-dynamic-code-execution-case
    desc: Agent skill executes generated Python code
    crit: hostile
    conf: 0.99
    for: [python]
    # Keep the execution evidence in the actual skill tool file; a package can
    # legitimately ship SKILL.md files alongside unrelated Python examples.
    scope: leaf
    all:
      - id: metadata/package/agent-skill::agent-skill-file
      - id: micro-behaviors/process/interpreter/eval/python-builtins::eval-builtin
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
    any:
      - id: micro-behaviors/process/interpreter/eval/constructed::exec-compiled-code
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-formatted-string
    # Same host-editor case as agent-skill-arbitrary-python-execution: the
    # compiled source is the caller's script, marshalled onto Maya's UI thread.
    unless:
      - id: micro-behaviors/process/interpreter/scripting::maya-main-thread-script-marshal
      - id: micro-behaviors/process/interpreter/scripting::pymxs-confirmed-caller-exec
      - id: well-known/tool/detection/agent/skill-scanner::cisco-skill-scanner-archive-context

  - id: skill-unchecked-file-reader-case
    desc: Agent skill opens dynamic system path
    crit: hostile
    conf: 0.99
    scope: archive
    for: [python, zip, tar]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter-fields
      - id: skill-dynamic-etc-path-open
    unless:
      - id: well-known/tool/detection/agent/skill-scanner::cisco-skill-scanner-archive-context

  - id: skill-resource-exhaustion-case
    desc: Agent skill contains resource exhaustion loop
    crit: hostile
    conf: 0.99
    scope: archive
    for: [tar, zip, python, markdown]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/data/control-flow/loop/unconditional::python-unconditional-while-header
      - id: skill-memory-amplification-loop
    unless:
      - id: well-known/tool/detection/agent/skill-scanner::cisco-skill-scanner-archive-context

  # The skill tells the agent its queries are parameterized while its tool
  # interpolates caller values into executed SQL: a false safety claim that
  # hides an injection path into the user's database.
  - id: skill-false-parameterized-sql-case
    desc: Agent skill claims safe SQL but executes interpolated queries
    crit: hostile
    conf: 0.95
    scope: archive
    for: [python, markdown, zip, tar]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter-fields
      - id: skill-associated-interpolated-sql
    any:
      - id: metadata/package/agent-skill::skill-claims-parameterized-sql
      - id: metadata/package/agent-skill::skill-claims-sql-injection-safe
    unless:
      - id: well-known/tool/detection/agent/skill-scanner::cisco-skill-scanner-archive-context

  - id: skill-env-secret-exfiltration-archive
    desc: Agent skill exfiltrates environment secrets
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, tar, markdown, python]
    attack: T1552.001,T1041
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-env-posting-tool

  - id: skill-associated-interpolated-sql
    desc: Skill script executes interpolated SQL
    crit: component
    for: [python]
    all:
      - id: metadata/package/agent-skill::agent-skill-associated-script
      - id: micro-behaviors/data/db/query::python-executes-interpolated-sql

  # Bind the operations to one skill script, not unrelated archive members.
  - id: skill-env-posting-tool
    desc: Skill script lists environment, encodes and posts
    crit: notable
    conf: 0.95
    scope: leaf
    for: [python]
    all:
      - id: metadata/package/agent-skill::agent-skill-associated-script
      - id: micro-behaviors/os/env/enumerate/entries::python-environ-items-loop
      - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
      - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
    unless:
      - id: micro-behaviors/data/manipulation::sensitive-token-redaction

  # Interpolated SQL must be built and executed by a skill-associated
  # script. Pooling sqlite imports, f-string queries and variable execution
  # across a whole archive convicted repositories that ship repo-local
  # skills while unrelated deep modules query sqlite.
  - id: skill-tool-interpolated-sql
    desc: Agent skill tool interpolates SQL queries
    crit: notable
    conf: 0.95
    for: [python]
    all:
      - id: metadata/package/agent-skill::agent-skill-associated-script
      - id: micro-behaviors/data/db/sqlite::python-sqlite3-import
      - id: micro-behaviors/data/db/query::python-executes-interpolated-sql

  - id: skill-tool-eval-exec-formatted
    desc: Agent skill tool eval-executes formatted strings
    crit: notable
    conf: 0.95
    for: [python]
    all:
      - id: metadata/package/agent-skill::agent-skill-associated-script
      - id: micro-behaviors/process/interpreter/eval/python-builtins::eval-builtin
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-formatted-string

  - id: skill-dynamic-eval-exec-archive
    desc: Agent skill executes caller supplied Python
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, tar, markdown, python]
    attack: T1059.006
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-tool-eval-exec-formatted

  - id: skill-unchecked-path-read-archive
    desc: Agent skill reads unchecked file paths
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, tar, markdown, python]
    attack: T1083,T1552.001
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-etc-path-template
      - id: skill-dynamic-etc-path-open

  - id: skill-sql-injection-query-archive
    desc: Agent skill interpolates input into SQL
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, tar, markdown, python]
    attack: T1190
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-tool-interpolated-sql
