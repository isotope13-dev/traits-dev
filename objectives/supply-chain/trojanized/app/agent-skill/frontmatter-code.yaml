# Agent skills that carry code in a JavaScript front-matter block. Skill
# loaders read SKILL.md front matter to list and route skills; a gray-matter
# based loader evaluates a "---js" block while doing so, which runs the
# block's code as soon as the skill is installed or indexed, before any user
# picks it. See micro-behaviors/process/interpreter/eval/frontmatter.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, shell]
  crit: hostile
  attack: T1059.007,T1195.002
  mbc: B0025

composite_rules:
  - id: skill-js-frontmatter-code
    desc: Agent skill definition carries an evaluated JavaScript front-matter block
    conf: 0.9
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter-fields
      - id: micro-behaviors/process/interpreter/eval/frontmatter::frontmatter-js-engine-block

  - id: skill-js-frontmatter-runs-commands
    desc: Agent skill front-matter code runs operating-system commands at parse time
    conf: 0.95
    near_lines: 80
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter-fields
      - id: micro-behaviors/process/interpreter/eval/frontmatter::frontmatter-js-engine-block
      - id: micro-behaviors/process/interpreter/eval/frontmatter::frontmatter-child-process-call
