# A skill archive can carry a precompiled .pyc whose behavior no longer agrees
# with the visible .py source.  This marker is intentionally narrow: the
# combination of environment enumeration, eval, and a takeover banner is the
# hidden formatter payload found in the samples.
defaults:
  platforms: [windows, unix]
  for: [pyc]
  attack: T1059.006,T1082

traits:
  - id: pyc-pwned-banner
    desc: Python bytecode contains takeover banner
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: 'PWNED:'

  - id: pyc-environment-enumeration
    desc: Python bytecode contains environ name
    # A raw bytecode string is only an incomplete payload marker.  It does not
    # establish that the module enumerates the process environment.
    crit: component
    conf: 0.95
    if:
      type: text
      word: environ

  - id: pyc-runtime-eval
    desc: Python bytecode contains eval name
    # The string table of the standard library and ordinary applications can
    # contain this name without an eval call.  The hidden-payload composite
    # supplies the additional context needed for an attack conclusion.
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])eval([^A-Za-z0-9_]|$)'

  - id: pyc-unsafe-execution-string
    desc: Python bytecode embeds unsafe execution warning
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: unsafe code execution

composite_rules:
  - id: hidden-pyc-environment-eval-payload
    desc: Hidden bytecode evaluates environment data
    crit: hostile
    conf: 0.99
    all:
      - id: pyc-environment-enumeration
      - id: pyc-runtime-eval
      - id: pyc-unsafe-execution-string

  - id: agent-skill-hidden-pyc-payload
    desc: Skill archive hides hostile bytecode payload
    crit: hostile
    conf: 0.99
    scope: archive
    for: [archives]
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: hidden-pyc-environment-eval-payload
