# Trojanized Minecraft mod JARs.
#
# A mod is republished with its original code intact and an extra top-level
# package wired into the loader, so the mod still works and the victim sees
# nothing. Two structural facts survive that repackaging:
#
#   * a Fabric mod JAR that is also directly executable (Main-Class) -- the
#     loader never needs one, and it gives the same file a double-click path,
#   * a class in that JAR that relaunches the JAR itself in a fresh JVM, with
#     either clear or encoded launcher strings.
#
# Neither leg depends on the injected package's name or on the C2 it talks to,
# so a rebuilt variant with renamed classes stays in scope.
defaults:
  platforms: [unix, windows]
  for: [jar, zip]
  attack: T1195.002
  mbc: B0032

traits:
  - id: fabric-manifest-com-example-entrypoint
    desc: Entrypoint JSON lists com.example package
    crit: component
    conf: 0.85
    for: [json]
    if:
      type: text
      regex: '"entrypoints"[\s\S]{0,240}"com\.example\.'
  # Bolted-on payload package used by Meilaa-style republished mods: a
  # throwaway org.web.* tree wired into an otherwise unrelated Fabric mod.
  - id: fabric-manifest-org-web-entrypoint
    desc: Entrypoint JSON lists org.web package
    crit: suspicious
    conf: 0.92
    for: [json]
    if:
      type: text
      regex: '"entrypoints"[\s\S]{0,400}"org\.web\.'
  # Xenon-style implants wire a throwaway net.client.* tree into a Fabric
  # example-mod shell (often still named "examplemod") as the main entrypoint.
  - id: fabric-manifest-net-client-entrypoint
    desc: Entrypoint JSON lists net.client package
    crit: suspicious
    conf: 0.92
    for: [json]
    if:
      type: text
      regex: '"entrypoints"[\s\S]{0,400}"net\.client\.'

composite_rules:
  # Forge loads mods through its own lifecycle and does not need a Main-Class.
  # A directly runnable Forge mod with a root EXE and separate key resource is
  # a payload package, not a normal platform-specific JNI dependency layout.
  - id: forge-mod-native-payload-key-sidecar
    desc: Runnable Forge mod carries EXE key sidecar
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/config::forge-runnable-mod-archive
      - id: metadata/file/metrics::archive-misplaced-executable-member
      - id: metadata/package/config::jar-root-key-text-resource

  # fabric-example-mod's template package name. A released mod keeps its own
  # namespace (net.<author>.<mod>, dev.<author>.<mod>); `com.example.*` listed
  # in the loader manifest beside that namespace means a second, unrelated code
  # tree was wired into someone else's mod, which is what republishing a stolen
  # JAR with a payload bolted on looks like. The manifest leg keeps this on
  # fabric.mod.json (default `file` scope) instead of any JSON with an
  # entrypoints key, and the window keeps a stray com.example mention elsewhere
  # in the manifest out. On its own this is also how an unfinished mod built
  # from the template looks, hence suspicious rather than higher.
  - id: fabric-entrypoint-template-package
    desc: Fabric entrypoint in com.example package
    crit: suspicious
    conf: 0.9
    for: [json]
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: fabric-manifest-com-example-entrypoint

  - id: fabric-entrypoint-org-web-package
    desc: Fabric entrypoint in bolted org.web package
    crit: suspicious
    conf: 0.93
    for: [json]
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: fabric-manifest-org-web-entrypoint

  - id: fabric-entrypoint-net-client-package
    desc: Fabric entrypoint in bolted net.client package
    crit: suspicious
    conf: 0.93
    for: [json]
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: fabric-manifest-net-client-entrypoint

  - id: fabric-mod-executable-entrypoint
    desc: Fabric mod JAR is also a runnable JAR
    crit: notable
    conf: 0.9
    scope: outer
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: metadata/package/manifest/entrypoint::jar-main-class

  # The injected entrypoint is not just present, it is the half that touches the
  # player's account or pulls code down. A mod author who left the template
  # package name in place trips the atom above and stops there.
  - id: fabric-mod-injected-entrypoint-payload
    desc: Injected mod entrypoint steals or stages
    # The steal/stage legs already report as hostile objectives; this outer
    # correlation stays suspicious so the JAR does not stack a fourth copy.
    crit: suspicious
    conf: 0.96
    attack: T1195.002,T1528
    scope: outer
    all:
      - id: fabric-entrypoint-template-package
    any:
      - id: objectives/exfiltration/stealer/credential/token::minecraft-session-http-post-exfil
      - id: objectives/exfiltration/stealer/credential/token::minecraft-session-obfuscated-http-post
      - id: objectives/command-and-control/backdoor/loader/classloader::java-http-jar-bytecode-stage
      - id: objectives/command-and-control/backdoor/loader/archive::remote-stage-self-relaunch-archive

  - id: fabric-mod-self-relaunch-stager
    desc: Fabric mod JAR ships a self-relaunching stager
    # The self-relaunch objective itself fires on the member class.  This
    # outer-scope rule correlates it with Fabric packaging, so it stays a
    # suspicious supply-chain indicator rather than a duplicate hostile hit.
    crit: suspicious
    conf: 0.97
    attack: T1195.002,T1059
    scope: outer
    all:
      - id: fabric-mod-executable-entrypoint
    any:
      - id: objectives/command-and-control/dropper/execution/jvm-relaunch::java-self-jar-javaw-relaunch
      - id: objectives/command-and-control/dropper/execution/jvm-relaunch::java-obfuscated-self-jar-relaunch
      - id: objectives/command-and-control/dropper/execution/jvm-relaunch::java-obfuscated-process-launch-exit

  # Template-package entrypoint (com.example.*) bolted onto a real Fabric mod
  # plus a clear-text javaw self-relaunch Main-Class is the Meilaa/Meteor-style
  # republish dropper before the payload is fully obfuscated.
  - id: fabric-mod-template-javaw-relaunch-dropper
    desc: Template-package Fabric mod with javaw self-relaunch
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1059
    scope: outer
    all:
      - id: fabric-entrypoint-template-package
      - id: fabric-mod-executable-entrypoint
      - id: objectives/command-and-control/dropper/execution/jvm-relaunch::java-self-jar-javaw-relaunch

  # Obfuscated self-relaunch inside a double-entry Fabric JAR (Main-Class plus
  # loader entrypoints) is the republished-mod dropper shape used by Meilaa and
  # kin: the stolen mod still loads, and double-clicking the JAR stages a child
  # JVM. Clear-text relaunchers stay on the suspicious rule above.
  - id: fabric-mod-obfuscated-relaunch-dropper
    desc: Fabric mod obfuscated self-relaunch dropper
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1059,T1027
    scope: outer
    all:
      - id: fabric-mod-executable-entrypoint
    any:
      - id: objectives/command-and-control/dropper/execution/jvm-relaunch::java-obfuscated-self-jar-relaunch
      - id: objectives/command-and-control/dropper/execution/jvm-relaunch::java-obfuscated-process-launch-exit

  # Foreign org.web entrypoint beside an obfuscated self-relaunch Main-Class:
  # correlates the bolted payload package declared to Fabric with the staged
  # child-JVM launcher. Kept suspicious so archives that already fire the
  # generic relaunch dropper stay inside the 2-4 hostile budget.
  - id: fabric-mod-org-web-obfuscated-dropper
    desc: Fabric org.web payload with obfuscated relaunch
    crit: suspicious
    conf: 0.98
    attack: T1195.002,T1059,T1027
    scope: outer
    all:
      - id: fabric-entrypoint-org-web-package
      - id: fabric-mod-executable-entrypoint
    any:
      - id: objectives/command-and-control/dropper/execution/jvm-relaunch::java-obfuscated-self-jar-relaunch
      - id: objectives/command-and-control/dropper/execution/jvm-relaunch::java-obfuscated-process-launch-exit

  # Client Fabric mods that write a .exe under INetCache and ProcessBuilder-start
  # it are staging a native payload, not rendering items. Seen in "dupe"/flex
  # mods that ship a high-entropy asset decoded to LOCALAPPDATA\...\INetCache.
  - id: fabric-mod-inetcache-exe-dropper
    desc: Fabric mod drops and runs exe under INetCache
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1059,T1105,T1036.005
    scope: outer
    for: [jar, zip, class, java_class]
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: objectives/command-and-control/dropper/staging/disk::java-inetcache-silent-exe-stager
    unless:
      - id: metadata/package/testing/

  # Republished Fabric mod that also ships a class posting Minecraft
  # username/uuid/accessToken JSON — session theft bolted onto a real mod.
  - id: fabric-mod-session-json-exfil
    desc: Fabric mod posts Minecraft session JSON
    # Session POST hostiles already cover the theft; keep this as the Fabric
    # packaging correlation at suspicious so archives stay in budget.
    crit: suspicious
    conf: 0.98
    attack: T1195.002,T1528,T1041
    scope: outer
    all:
      - id: fabric-mod-executable-entrypoint
    any:
      - id: objectives/exfiltration/stealer/credential/token::minecraft-profile-json-post-exfil
      - id: objectives/exfiltration/stealer/credential/token::minecraft-session-http-post-exfil
      - id: objectives/exfiltration/stealer/credential/token::minecraft-session-obfuscated-http-post

  # Template-package Fabric entrypoint plus int-array-hidden signed-config C2
  # and a self-relaunch Main-Class: Meilaa-style republished mods that stage a
  # child JVM after resolving RSA-signed endpoints. Archive scope pools the
  # decrypt/verify/POST legs that sit in separate helper classes.
  - id: fabric-mod-int-array-signed-c2-relaunch
    desc: Fabric template package fetches signed C2 and relaunches
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1102,T1059,T1027
    mbc: B0030,B0032
    scope: archive
    all:
      - id: fabric-entrypoint-template-package
      - id: objectives/anti-static/obfuscation/string/encoding::java-int-array-string-decrypt-descriptor
      - id: micro-behaviors/crypto/asymmetric/signature::java-rsa-public-verify
      - id: micro-behaviors/communications/http/lib/httpclient::java-httpclient-send
      - id: micro-behaviors/communications/http/lib/httpclient::java-http-request-post-bytecode
    any:
      - id: objectives/command-and-control/dropper/execution/jvm-relaunch::java-self-jar-javaw-relaunch
      - id: fabric-mod-self-relaunch-stager

  # Same family when the helper that holds RSA/HttpClient is not deep-scanned
  # inside a huge mod JAR: the injected template package, an int-array string
  # decrypt in the Main-Class stager, and a self-relaunch are enough to mark
  # the republished dropper without requiring every payload class to be visited.
  - id: fabric-mod-template-int-array-relaunch
    desc: Fabric template package int-array decrypt self-relaunches
    crit: hostile
    conf: 0.96
    attack: T1195.002,T1059,T1027
    scope: archive
    all:
      - id: fabric-entrypoint-template-package
      - id: objectives/anti-static/obfuscation/string/encoding::java-int-array-string-decrypt-descriptor
      - id: objectives/command-and-control/dropper/execution/jvm-relaunch::java-self-jar-javaw-relaunch
    unless:
      - id: fabric-mod-int-array-signed-c2-relaunch
      - id: fabric-mod-obfuscated-relaunch-dropper
