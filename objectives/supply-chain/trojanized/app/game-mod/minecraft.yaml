# Trojanized Minecraft mod JARs.
#
# A mod is republished with its original code intact and an extra top-level
# package wired into the loader, so the mod still works and the victim sees
# nothing. Two structural facts survive that repackaging:
#
#   * a Fabric mod JAR that is also directly executable (Main-Class) -- the
#     loader never needs one, and it gives the same file a double-click path,
#   * a class in that JAR that relaunches the JAR itself in a fresh JVM, with
#     either clear or encoded launcher strings.
#
# Neither leg depends on the injected package's name or on the C2 it talks to,
# so a rebuilt variant with renamed classes stays in scope.
defaults:
  platforms: [unix, windows]
  for: [jar, zip]
  attack: T1195.002
  mbc: B0032

traits:
  - id: fabric-manifest-com-example-entrypoint
    desc: Entrypoint JSON lists com.example package
    crit: notable
    conf: 0.85
    for: [json]
    if:
      type: text
      regex: '"entrypoints"[\s\S]{0,240}"com\.example\.'
  # Bolted-on payload package used by Meilaa-style republished mods: a
  # throwaway org.web.* tree wired into an otherwise unrelated Fabric mod.
  - id: fabric-manifest-org-web-entrypoint
    desc: Entrypoint JSON lists org.web package
    crit: suspicious
    conf: 0.92
    for: [json]
    if:
      type: text
      regex: '"entrypoints"[\s\S]{0,400}"org\.web\.'
  # Xenon-style implants wire a throwaway net.client.* tree into a Fabric
  # example-mod shell (often still named "examplemod") as the main entrypoint.
  - id: fabric-manifest-net-client-entrypoint
    desc: Entrypoint JSON lists net.client package
    crit: suspicious
    conf: 0.92
    for: [json]
    if:
      type: text
      regex: '"entrypoints"[\s\S]{0,400}"net\.client\.'

  - id: jvm-ethereum-contract-address
    desc: JVM string holds an Ethereum address
    crit: notable
    conf: 0.9
    for: [class, java_class]
    if:
      type: text
      regex: '(?i)\b0x[a-f0-9]{40}\b'

  - id: fabric-mod-prelaunch-entrypoint-class
    desc: Fabric mod ships a PreLaunch entrypoint class
    crit: notable
    conf: 0.95
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)prelaunch[^/]*\.class$'

  - id: fabric-mod-discord-harvester-class
    desc: Fabric JAR has Discord harvester classes
    crit: notable
    conf: 0.96
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)harvest/discord/.+\.class$'

  - id: fabric-mod-embedded-payload-bin-member
    desc: Mod JAR embeds payload directory bin
    crit: notable
    conf: 0.94
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)payload/[^/]+\.bin$'

  - id: fabric-mod-bundled-sqlite-jdbc-member
    desc: Fabric mod JAR bundles sqlite-jdbc library
    crit: notable
    conf: 0.92
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)sqlite-jdbc[^/]*\.jar$'

  # A second class in the main list is how an implant rides along with the
  # mod it infects: the original initializer stays first so the mod still
  # works, and the loader is appended after it. The list must sit inside
  # Fabric's "entrypoints" object: a bare top-level "main" array is also
  # bower.json's file list (select2's ["select2.js","select2.css",...]).
  - id: fabric-manifest-multiple-main-entrypoints
    desc: Fabric manifest lists several main entrypoints
    crit: notable
    conf: 0.85
    for: [json]
    if:
      type: text
      regex: '"entrypoints"\s*:\s*\{[^}]{0,400}"main"\s*:\s*\[\s*"[^"]{1,200}"\s*,\s*"'

  - id: fabric-manifest-hack-pack-description
    desc: Fabric manifest calls itself a hack pack
    crit: suspicious
    conf: 0.93
    for: [json]
    if:
      type: text
      regex: '(?i)"description"\s*:\s*"[^"\r\n]{0,200}\bhack\s+pack\b'

  - id: java-class-duckdns-https-url
    desc: Java class embeds DuckDNS HTTPS URL
    crit: notable
    conf: 0.95
    for: [class, java_class]
    if:
      type: text
      regex: '(?i)https?://[a-z0-9][-a-z0-9]{0,62}\.duckdns\.org/'

composite_rules:
  # Fabric mod that ships a staged downloader (host beacon, fetch, AES
  # decrypt, write, reflective launch) under an unrelated helper class name.
  - id: fabric-mod-staged-downloader-helper
    desc: Fabric mod carries a staged downloader class
    crit: hostile
    conf: 0.9
    attack: T1195.002,T1105
    for: [jar, zip, class, java_class]
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: objectives/command-and-control/dropper/download::jvm-http-fetch-decrypt-write-reflective-launch
  # Forge loads mods through its own lifecycle and does not need a Main-Class.
  # A directly runnable Forge mod with a root EXE and separate key resource is
  # a payload package, not a normal platform-specific JNI dependency layout.
  - id: forge-mod-native-payload-key-sidecar
    desc: Runnable Forge mod carries EXE key sidecar
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/config::forge-runnable-mod-archive
      - id: metadata/file/archive::archive-misplaced-executable-member
      - id: metadata/package/config::jar-root-key-text-resource

  # fabric-example-mod's template package name. A released mod keeps its own
  # namespace (net.<author>.<mod>, dev.<author>.<mod>); `com.example.*` listed
  # in the loader manifest beside that namespace means a second, unrelated code
  # tree was wired into someone else's mod, which is what republishing a stolen
  # JAR with a payload bolted on looks like. The manifest leg keeps this on
  # fabric.mod.json (default `file` scope) instead of any JSON with an
  # entrypoints key, and the window keeps a stray com.example mention elsewhere
  # in the manifest out. On its own this is also how an unfinished mod built
  # from the template looks, hence suspicious rather than higher.
  - id: fabric-entrypoint-template-package
    desc: Fabric entrypoint in com.example package
    crit: suspicious
    conf: 0.9
    for: [json]
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: fabric-manifest-com-example-entrypoint

  - id: fabric-entrypoint-org-web-package
    desc: Fabric entrypoint in bolted org.web package
    crit: suspicious
    conf: 0.93
    for: [json]
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: fabric-manifest-org-web-entrypoint

  - id: fabric-entrypoint-net-client-package
    desc: Fabric entrypoint in bolted net.client package
    crit: suspicious
    conf: 0.93
    for: [json]
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: fabric-manifest-net-client-entrypoint

  # The injected entrypoint is not just present, it is the half that touches the
  # player's account or pulls code down. A mod author who left the template
  # package name in place trips the atom above and stops there.
  - id: fabric-mod-injected-entrypoint-payload
    desc: Injected mod entrypoint steals or stages
    # The steal/stage legs already report as hostile objectives; this outer
    # correlation stays suspicious so the JAR does not stack a fourth copy.
    crit: suspicious
    conf: 0.96
    attack: T1195.002,T1528
    scope: outer
    for: [jar, zip, json, class]
    all:
      - id: fabric-entrypoint-template-package
    any:
      - id: objectives/exfiltration/stealer/token::minecraft-session-http-post-exfil
      - id: objectives/exfiltration/stealer/token::minecraft-session-obfuscated-http-post
      - id: objectives/command-and-control/backdoor/loader/classloader::java-http-jar-bytecode-stage
      - id: objectives/command-and-control/backdoor/loader/archive::remote-stage-self-relaunch-archive

  # Template-package entrypoint (com.example.*) bolted onto a real Fabric mod
  # plus a clear-text javaw self-relaunch Main-Class is the Meilaa/Meteor-style
  # republish dropper before the payload is fully obfuscated.
  - id: fabric-mod-template-javaw-relaunch-dropper
    desc: Template-package Fabric mod with javaw self-relaunch
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1059
    scope: outer
    for: [jar, zip, json, class]
    all:
      - id: fabric-entrypoint-template-package
      - id: metadata/package/config::fabric-runnable-mod-archive
      - id: micro-behaviors/process/lifecycle/respawn::java-self-jar-javaw-relaunch

  # Obfuscated self-relaunch inside a double-entry Fabric JAR (Main-Class plus
  # loader entrypoints) is the republished-mod dropper shape used by Meilaa and
  # kin: the stolen mod still loads, and double-clicking the JAR stages a child
  # JVM. Clear-text relaunchers stay on the suspicious rule above.
  - id: fabric-mod-obfuscated-relaunch-dropper
    for: [jar, zip, class]
    desc: Fabric mod obfuscated self-relaunch dropper
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1059,T1027
    scope: outer
    all:
      - id: metadata/package/config::fabric-runnable-mod-archive
    any:
      - id: micro-behaviors/process/lifecycle/respawn::java-obfuscated-self-jar-relaunch
      - id: micro-behaviors/process/lifecycle/respawn::java-obfuscated-process-launch-exit
      - id: micro-behaviors/process/lifecycle/respawn::java-xor-char-obfuscated-self-jar-relaunch
      - id: micro-behaviors/process/lifecycle/respawn::java-xor-char-obfuscated-process-launch-exit

  # Foreign org.web entrypoint beside an obfuscated self-relaunch Main-Class:
  # correlates the bolted payload package declared to Fabric with the staged
  # child-JVM launcher. Kept suspicious so archives that already fire the
  # generic relaunch dropper stay inside the 2-4 hostile budget.
  - id: fabric-mod-org-web-obfuscated-dropper
    desc: Fabric org.web payload with obfuscated relaunch
    crit: suspicious
    conf: 0.98
    attack: T1195.002,T1059,T1027
    scope: outer
    for: [jar, zip, class, json]
    all:
      - id: fabric-entrypoint-org-web-package
      - id: metadata/package/config::fabric-runnable-mod-archive
    any:
      - id: micro-behaviors/process/lifecycle/respawn::java-obfuscated-self-jar-relaunch
      - id: micro-behaviors/process/lifecycle/respawn::java-obfuscated-process-launch-exit

  # Client Fabric mods that write a .exe under INetCache and ProcessBuilder-start
  # it are staging a native payload, not rendering items. Seen in "dupe"/flex
  # mods that ship a high-entropy asset decoded to LOCALAPPDATA\...\INetCache.
  - id: fabric-mod-inetcache-exe-dropper
    desc: Fabric mod drops and runs exe under INetCache
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1059,T1105,T1036.005
    scope: outer
    for: [jar, zip, class, java_class]
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: objectives/command-and-control/dropper/staging/disk::java-inetcache-silent-exe-stager
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"

  # Republished Fabric mod that also ships a class posting Minecraft
  # username/uuid/accessToken JSON — session theft bolted onto a real mod.
  - id: fabric-mod-session-json-exfil
    for: [jar, zip, class]
    desc: Fabric mod posts Minecraft session JSON
    # Session POST hostiles already cover the theft; keep this as the Fabric
    # packaging correlation at suspicious so archives stay in budget.
    crit: suspicious
    conf: 0.98
    attack: T1195.002,T1528,T1041
    scope: outer
    all:
      - id: metadata/package/config::fabric-runnable-mod-archive
    any:
      - id: objectives/exfiltration/stealer/token::minecraft-profile-json-post-exfil
      - id: objectives/exfiltration/stealer/token::minecraft-session-http-post-exfil
      - id: objectives/exfiltration/stealer/token::minecraft-session-obfuscated-http-post

  # Template-package Fabric entrypoint plus int-array-hidden signed-config C2
  # and a self-relaunch Main-Class: Meilaa-style republished mods that stage a
  # child JVM after resolving RSA-signed endpoints. Archive scope pools the
  # decrypt/verify/POST legs that sit in separate helper classes.
  - id: fabric-mod-int-array-signed-c2-relaunch
    desc: Fabric template package fetches signed C2 and relaunches
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1102,T1059,T1027
    mbc: B0030,B0032
    scope: archive
    for: [jar, zip, json, class]
    all:
      - id: fabric-entrypoint-template-package
      - id: objectives/anti-static/obfuscation/string/encoding::java-int-array-string-decrypt-descriptor
      - id: micro-behaviors/crypto/verify::jvm-x509-signature-verification-references
      - id: micro-behaviors/communications/http/lib/httpclient::java-httpclient-send
      - id: micro-behaviors/communications/http/lib/httpclient::java-http-request-post-bytecode
    any:
      - id: micro-behaviors/process/lifecycle/respawn::java-self-jar-javaw-relaunch
      - id: micro-behaviors/process/lifecycle/respawn::fabric-mod-self-relaunch

  # Same family when the helper that holds RSA/HttpClient is not deep-scanned
  # inside a huge mod JAR: the injected template package, an int-array string
  # decrypt in the Main-Class stager, and a self-relaunch are enough to mark
  # the republished dropper without requiring every payload class to be visited.
  - id: fabric-mod-template-int-array-relaunch
    desc: Fabric template package int-array decrypt self-relaunches
    crit: hostile
    conf: 0.96
    attack: T1195.002,T1059,T1027
    scope: archive
    for: [jar, zip, json, class]
    all:
      - id: fabric-entrypoint-template-package
      - id: objectives/anti-static/obfuscation/string/encoding::java-int-array-string-decrypt-descriptor
      - id: micro-behaviors/process/lifecycle/respawn::java-self-jar-javaw-relaunch
    unless:
      - id: fabric-mod-int-array-signed-c2-relaunch
      - id: fabric-mod-obfuscated-relaunch-dropper

  - id: fabric-mod-reflective-session-stealer
    desc: Fabric mod reflectively steals and forwards Minecraft session data
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1528,T1041,T1027
    mbc: B0006,E1041
    scope: archive
    for: [jar, zip, json, class]
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: fabric-manifest-hack-pack-description
      - id: metadata/import/framework::minecraft-named-client-ref
      - id: objectives/credential-access/gaming/minecraft::minecraft-session-getter-sess
      - id: objectives/credential-access/gaming/minecraft::minecraft-session-getter-tok
      - id: micro-behaviors/data/format/json::gson-jsonobject-add-property
      - id: micro-behaviors/metaprogramming/reflection::java-class-forname-bytecode
      - id: micro-behaviors/metaprogramming/reflection::java-class-getmethod-bytecode
      - id: micro-behaviors/metaprogramming/reflection::java-method-invoke-bytecode
      - id: "micro-behaviors/metaprogramming/reflection::set-accessible-reference"
      - id: micro-behaviors/data/string/mutate::java-junk-padded-string-cleanup
      - id: metadata/lang/source/naming/interface::jvm-httpclient-name-fragment
      - id: micro-behaviors/process/create/thread::jvm-thread-start-bytecode
    any:
      - id: well-known/game/mod::minecraft-uuid-getter-ref
      - id: metadata/lang/source/naming/function::jvm-getid-name
    needs: 1

  - id: fabric-mod-chacha-duckdns-reflective-stager
    desc: Fabric mod stages ChaCha20 payload to a DuckDNS HTTPS endpoint
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1105,T1071.001
    scope: archive
    for: [jar, zip, json, class]
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: well-known/game/mod::minecraft-client-class-ref
      - id: java-class-duckdns-https-url
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-poly1305-algorithm-reference
      - id: micro-behaviors/crypto/key/representation::secretkeyspec
      - id: metadata/import/framework::jvm-url-class-ref
      - id: micro-behaviors/metaprogramming/reflection::java-class-forname-bytecode
      - id: micro-behaviors/metaprogramming/reflection::java-method-invoke-bytecode

  - id: fabric-mod-obfuscated-chacha-https-stager
    desc: Fabric mod obfuscated constants with ChaCha20 HTTPS staging
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1027,T1071.001
    scope: archive
    for: [jar, zip, class]
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: metadata/file/encoded::java-control-prefixed-long-string
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-poly1305-algorithm-reference
      - id: micro-behaviors/crypto/key/representation::secretkeyspec
      - id: micro-behaviors/communications/http/lib/urlconnection::jvm-urlconnection-open-connection
      - id: micro-behaviors/metaprogramming/reflection::java-class-forname-bytecode

  - id: fabric-mod-staged-in-memory-account-loader
    desc: Fabric mod staged in-memory account loader
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1528,T1129,T1620
    scope: archive
    for: [jar, zip, json, class]
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: objectives/credential-access/gaming/minecraft::minecraft-session-token-access
      - id: micro-behaviors/process/interpreter/runtime/jvm::in-memory-jar-entry-classload

  # The C2 path and python stage are rebuilt with XOR and subtract, so the
  # campaign strings never appear as text. What remains is a Fabric package
  # that imports the Minecraft session, hides its strings, trusts every TLS
  # certificate, and inflates a PNG into a ZIP it executes.
  - id: fabric-mod-obfuscated-png-session-stager
    desc: Obfuscated Fabric mod reads the session and stages a PNG archive
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1528,T1105,T1027
    scope: archive
    for: [jar, zip, class, java_class]
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: well-known/game/mod::minecraft-session-access
      - id: objectives/anti-static/obfuscation/steganography/image::obfuscated-png-archive-staging
      - id: micro-behaviors/communications/tls/verify/disable::java-tls-client-own-trust-all-manager

  # Same loader shape when the session-getter fragments use an encoding the
  # getter selectors do not resolve: a string-obfuscated Fabric mod that
  # trusts every TLS certificate and runs a ZIP inflated out of a PNG.
  - id: fabric-mod-obfuscated-png-archive-launcher
    desc: Obfuscated Fabric mod runs PNG-hidden archive
    crit: hostile
    conf: 0.96
    attack: T1195.002,T1105,T1027.003
    scope: archive
    for: [jar, zip, class, java_class]
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: objectives/anti-static/obfuscation/steganography/image::obfuscated-png-archive-staging
      - id: micro-behaviors/communications/tls/verify/disable::java-tls-client-own-trust-all-manager
      - id: micro-behaviors/process/fd/stdio::java-processbuilder-redirected-stdio

  - id: fabric-mod-jni-native-session-stealer
    desc: Fabric mod embeds native DLL Minecraft session XOR C2 stealer
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1528,T1071.001,T1129
    scope: archive
    for: [jar, zip, pe, dll]
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: objectives/credential-access/gaming/minecraft::native-minecraft-session-xor-c2-stealer

  # Republished Fabric mods that bolt on obfuscated single-letter classes with
  # Chromium DPAPI AES-GCM decryption and HttpURLConnection exfil are Discord
  # stealers, not melody-harp utilities.
  - id: fabric-mod-discord-dpapi-stealer
    desc: Fabric mod ships Java Discord DPAPI token stealer
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1528,T1555.003
    scope: archive
    for: [jar, zip, class, java_class]
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: objectives/credential-access/discord/token::java-discord-dpapi-stealer

  - id: fabric-mod-prelaunch-payload-stealer
    desc: Fabric preLaunch mod stages embedded native payload
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1528,T1105,T1027
    scope: archive
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: fabric-mod-prelaunch-entrypoint-class
      - id: fabric-mod-embedded-payload-bin-member
      - id: fabric-mod-bundled-sqlite-jdbc-member

  - id: fabric-mod-prelaunch-exfil-payload-stealer
    desc: Fabric preLaunch mod POSTs loot to /exfil and stages payload
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041,T1105,T1027
    scope: archive
    for: [jar, zip, class, java_class]
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: fabric-mod-prelaunch-entrypoint-class
      - id: fabric-mod-embedded-payload-bin-member
      - id: micro-behaviors/communications/http/url/endpoint::jvm-exfil-path-bytecode
      - id: micro-behaviors/communications/http/lib/httpclient::java-http-request-post-bytecode
      - id: micro-behaviors/communications/http/lib/httpclient::java-httpclient-send

  # Discord token regexes, the eth_call body, and the fallback host are
  # AES-wrapped. Clear residue is the template entrypoint, a 20-byte
  # Ethereum address, JNA DPAPI unprotect, GCM, and ProcessBuilder.
  - id: fabric-template-ether-dpapi-loader
    desc: Template Fabric mod DPAPI-decrypts and launches a process
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1555.003,T1102,T1059
    scope: archive
    for: [jar, zip, json, class, java_class]
    all:
      - id: fabric-entrypoint-template-package
      - id: jvm-ethereum-contract-address
      - id: micro-behaviors/os/security/dpapi::jna-crypt32util-class
      - id: micro-behaviors/os/security/dpapi::jvm-crypt-unprotect-data-name
      - id: micro-behaviors/crypto/cipher::jvm-gcm-parameter-spec
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode
