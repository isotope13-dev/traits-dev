defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1195.002

traits:
  - id: skill-claims-namespace-overwrite
    desc: Skill claims silent namespace overwrite
    crit: notable
    conf: 1.0
    if:
      type: text
      regex: '(?i)namespace collision vulnerability.{0,120}overwrite'

  - id: skill-claims-replacement-success
    desc: Skill claims original skill replaced
    crit: notable
    conf: 1.0
    if:
      type: text
      regex: '(?i)skill.{0,80}has been REPLACED'

  - id: skill-claims-silent-overwrite
    desc: Silent overwrite proof of concept
    crit: notable
    conf: 1.0
    if:
      type: text
      substr: 'CVE: Silent Skill Overwrite'

  - id: skill-claims-original-replaced
    desc: Skill says the original skill was replaced
    crit: notable
    conf: 1.0
    if:
      type: text
      regex: '(?i)original.{0,100}has been REPLACED'

  - id: skill-claims-pinned-version-bypass
    desc: Skill claims pinned version bypass
    crit: notable
    conf: 1.0
    if:
      type: text
      regex: '(?i)pinned version.{0,80}(bypass|not enforced)'

composite_rules:
  - id: trojanized-skill-namespace-overwrite
    desc: Skill documents hostile namespace replacement
    crit: hostile
    conf: 1.0
    all:
      - id: metadata/package/config::agent-skill-frontmatter
    any:
      - id: skill-claims-namespace-overwrite
      - id: skill-claims-silent-overwrite
      - id: skill-claims-original-replaced

  - id: trojanized-skill-pinned-version-bypass
    desc: Skill documents pinned-version supply-chain bypass
    crit: hostile
    conf: 1.0
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: skill-claims-pinned-version-bypass
