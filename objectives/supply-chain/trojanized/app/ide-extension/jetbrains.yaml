defaults:
  platforms:
  - windows
  - unix
  for:
  - zip
  attack: T1195.002,T1105,T1059.001
  crit: hostile
  conf: 0.99
composite_rules:
- id: jetbrains-plugin-powershell-stage
  desc: JetBrains plugin stages a remote PowerShell payload
  scope: outer
  for:
  - binaries
  - '!dex'
  - batch
  - jar
  - java
  - javascript
  - kotlin
  - lua
  - perl
  - php
  - powershell
  - python
  - ruby
  - vbs
  - zip
  - xml
  all:
  - id: metadata/build/manifest::jetbrains-plugin-descriptor
  - id: micro-behaviors/fs/write/file/full::jvm-powershell-script-stage-write
- id: jetbrains-plugin-temp-batch-dropper
  desc: JetBrains plugin executes a downloaded temporary batch script
  scope: outer
  for:
  - zip
  - jar
  - class
  - xml
  all:
  - id: metadata/build/manifest::jetbrains-plugin-descriptor
  - id: objectives/command-and-control/dropper/file-exec/command/shell::jvm-runtime-temp-batch-download-execute
- id: jetbrains-plugin-curl-shell-loader
  desc: JetBrains plugin executes a curl-piped shell payload
  scope: outer
  for:
  - zip
  - jar
  - class
  - xml
  attack: T1195.002,T1105,T1059.004
  all:
  - id: metadata/build/manifest::jetbrains-plugin-descriptor
  - id: objectives/command-and-control/dropper/script-eval/response-eval/shell::jvm-curl-runtime-loader
- id: jetbrains-plugin-developer-credential-stealer
  desc: JetBrains plugin exfiltrates developer credentials
  scope: outer
  for:
  - zip
  - jar
  - class
  - xml
  attack: T1195.002,T1552,T1041
  all:
  - id: metadata/build/manifest::jetbrains-plugin-descriptor
  - id: objectives/exfiltration/stealer::jvm-developer-credential-curl-exfil
