# JetBrains plugins are ZIP distributions containing plugin.xml and JVM
# bytecode.  The hostile rule requires that package identity plus a class that
# reads a local payload, writes a PowerShell stage, and references a remote URL
# co-occur; ordinary plugins may use any one of these APIs independently.
defaults:
  platforms: [windows, unix]
  for: [zip]
  attack: T1195.002,T1105,T1059.001

traits:
  - id: jetbrains-plugin-descriptor
    desc: JetBrains plugin descriptor
    crit: notable
    conf: 0.98
    for: [xml, text]
    if:
      type: basename
      exact: plugin.xml
      case_insensitive: true

composite_rules:
  - id: jetbrains-plugin-powershell-stage
    desc: JetBrains plugin stages a remote PowerShell payload
    crit: hostile
    conf: 0.99
    scope: archive
    for: [binaries, '!dex', batch, jar, java, javascript, kotlin, lua, perl, php, powershell, python, ruby, vbs, zip]
    all:
      - id: jetbrains-plugin-descriptor
      - id: micro-behaviors/fs/read/file/full::java-readallbytes
      - id: micro-behaviors/fs/write/file/full::jvm-files-write-bytecode
      - id: micro-behaviors/fs/path/extension::ps1
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
