# A finished extension bundle with a self-contained IIFE concatenated onto its
# tail that serializes an identity/platform record and POSTs it, swallowing
# every error. The appended block brings its own requires instead of using
# the bundle's module graph, so it was added after the build rather than by
# the extension's author, and the silent handlers keep it from ever showing
# up in the extension host log.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  attack: T1195.002,T1041
composite_rules:
  - id: appended-iife-identity-post
    desc: Bundle tail carries an appended IIFE that silently posts host identity
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/build/bundler/asset::trailing-try-iife-module-require
      - id: micro-behaviors/data/serialize/schema-object::identity-platform-json-payload
      - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-error-handler
    any:
      - id: micro-behaviors/communications/http/request/json::node-http-post-json-body
      - id: micro-behaviors/communications/http/request/body/construction::node-module-bound-request-write-end
