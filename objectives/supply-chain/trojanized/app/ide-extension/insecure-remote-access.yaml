# This archive-scoped rule describes the convicted extension's operational
# behavior independently of the inert Cygwin and npm dependencies it bundles.
defaults:
  platforms: [windows, unix]
  for: [archives, vsix]
  attack: T1176,T1219

composite_rules:
- id: openlibing-insecure-remote-access
  desc: Convicted VS Code extension auto-starts insecure remote access
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: metadata/package/manifest/vendor::openlibing-resource-manager-identity
  - id: metadata/package/manifest/runtime::vscode-extension
  - id: metadata/permission/activation::on-startup-finished
  - id: micro-behaviors/communications/socket/ssl::node-tls-verification-env-disable
  - id: micro-behaviors/communications/ssh/client::strict-host-disable
  - id: micro-behaviors/communications/ssh/client::sshpass-tool-reference
