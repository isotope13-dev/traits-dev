# This archive-scoped rule describes the extension's unsafe connection
# settings independently of the Cygwin and npm dependencies it bundles.
defaults:
  platforms: [windows, unix]
  for: [vsix, zip]
  attack: T1176,T1219

composite_rules:
- id: openlibing-insecure-remote-access
  desc: OpenLibing VS Code extension disables TLS and SSH host verification
  crit: suspicious
  conf: 0.96
  scope: archive
  for: [vsix, zip, package.json, javascript]
  all:
  - id: metadata/package/vendor::openlibing-resource-manager-identity
  - id: metadata/package/runtime::vscode-extension
  - id: metadata/permission/activation::on-startup-finished
  - id: micro-behaviors/communications/tls/verify/disable::node-tls-verification-env-disable
  - id: micro-behaviors/communications/ssh/client::strict-host-disable
  - id: micro-behaviors/communications/ssh/client::sshpass-tool-reference
