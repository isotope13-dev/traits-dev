# An editor extension that resolves another vendor's installed extension
# folder, joins a bundled script inside it and writes files is modifying
# third-party code in place (ad injection, UI hijack, credential hooks).
# Theme/UI customizers that patch the editor core do not match: they target
# the application install, not a publisher-prefixed extension folder.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1554,T1195.002

composite_rules:
  - id: installed-extension-script-rewrite
    desc: Rewrites another installed extension's script
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/library::installed-extension-script-locator
      - id: micro-behaviors/fs/path/library::editor-extensions-directory-reference
    # Direct write, or an atomic temp-file write renamed over the target.
    any:
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call
      - id: micro-behaviors/fs/file/rename::fs-rename-sync
