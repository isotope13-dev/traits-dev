# An extension that hides a second VSIX installer inside an obfuscated bundle
# is a supply-chain dropper. The individual capabilities remain neutral in
# their micro-behavior directories; this intent rule requires all of the
# editor-specific staging and installation steps together.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1195.002,T1105,T1176
  mbc: E1105

composite_rules:
  - id: obfuscated-editor-extension-dropper
    desc: Obfuscated bundle force-installs an editor extension
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/dropper/execution/ide-extension::obfuscated-editor-extension-download-install
      - id: objectives/discovery/host/application/editor::vscode-editor-candidate-enumeration-obfuscated
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
