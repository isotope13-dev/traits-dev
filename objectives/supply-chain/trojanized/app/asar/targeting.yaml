defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  attack: T1195.002
  mbc: E1478
traits:
  # Generic app.asar path mentions moved to the neutral bundle-path home
  # (micro-behaviors/fs/path/application/bundle::electron-resources-asar-path-text
  # and ::app-asar-path-mention): a bare path reference names no victim and no
  # action. This leaf keeps app-specific targets and asar operations.
  - id: slack-app-path-macos
    desc: Slack macOS app.asar path
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: (?i)Slack\.app[/\\]Contents[/\\]Resources[/\\]app\.asar
  - id: slack-app-path-windows
    desc: Slack versioned app.asar path
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: (?i)[/\\]slack[/\\]app-[0-9][^/\\]{0,24}[/\\]resources[/\\]app\.asar
  - id: teams-app-path-macos
    desc: Teams macOS app.asar path
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: (?i)Microsoft[ /]Teams\.app[/\\]Contents[/\\]Resources[/\\]app\.asar
  - id: teams-app-path-windows
    desc: Teams versioned app.asar path
    crit: notable
    conf: 0.7
    if:
      type: text
      case_insensitive: true
      regex: '[/\\]Microsoft[/\\]Teams[/\\]app-[0-9][^/\\]{0,24}[/\\]resources[/\\]app\.asar'
  - id: signal-app-path
    desc: Signal application directory
    crit: baseline
    conf: 0.7
    if:
      type: text
      regex: (?i)(^|[/\\])Signal[/\\]
    unless:
    - type: trait
      id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: curl-asar-download
    desc: curl download to asar path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: curl.{0,50}app\.asar
composite_rules:
  - id: slack-app-path
    desc: Slack application directory
    crit: notable
    conf: 0.75
    any:
      - id: slack-app-path-macos
      - id: slack-app-path-windows
  - id: teams-app-path
    desc: Microsoft Teams application directory
    crit: notable
    conf: 0.75
    any:
      - id: teams-app-path-macos
      - id: teams-app-path-windows
  - id: electron-app-paths
    desc: Electron application directory paths
    any:
      - id: well-known/app/communication/discord::discord-app-paths
      - id: slack-app-path
      - id: teams-app-path
      - id: micro-behaviors/fs/path/application/bundle::vscode-app-bundle-path
      - id: signal-app-path
  - id: electron-infection
    desc: Electron application infection pattern
    crit: hostile
    conf: 0.95
    all:
      - id: electron-app-paths
      - id: micro-behaviors/fs/path/application/bundle::electron-resources-asar-path-text
    any:
      - id: micro-behaviors/data/archive/extract/asar::asar-extract
      - id: micro-behaviors/data/archive/create/asar::asar-pack
      - id: curl-asar-download
