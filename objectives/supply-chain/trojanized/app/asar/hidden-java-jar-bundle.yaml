# An Electron shell whose app.asar is only a launcher for a private JRE and an
# opaque hex-named jar. The reviewed "Polyaris" installer spawned
# resources/java/jre/bin/javaw.exe -jar <hex>.jar detached and hidden, and the
# jar was an obfuscated browser-data stealer. The member table identifies the
# packaging even when the installer nests too deep to open the jar.
defaults:
  platforms: [windows]
  for: [7z, zip]
  attack: T1195.002,T1564.003

composite_rules:
  - id: electron-hidden-java-jar-bundle
    desc: Electron app bundles a private JRE and a hex-named jar
    crit: hostile
    conf: 0.9
    scope: archive
    all:
      - id: metadata/archive/member/path::electron-asar-resource-member
      - id: metadata/archive/member/path::bundled-jre-javaw-member
      - id: metadata/archive/member/path::hex-named-resource-jar-member
