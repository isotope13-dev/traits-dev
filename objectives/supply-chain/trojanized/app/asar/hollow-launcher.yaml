# Minimal hollow Electron ASAR archive pairing an empty-metadata package
# manifest with an obfuscated headless hidden child-process launcher stub.
defaults:
  platforms: [windows, unix]
  for: [asar, javascript, package.json]
composite_rules:
  - id: hollow-asar-headless-hidden-launcher
    desc: Minimal hollow ASAR wraps obfuscated headless hidden child launcher
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1027.002,T1564.003
    scope: archive
    all:
      - id: metadata/archive/member/size::minimal-asar-member-count
      - id: metadata/package/dependencies/presence::npm-no-deps-at-all
      - id: metadata/package/empty::npm-empty-author
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::js-obfuscator-output-marker
      - id: objectives/evasion/process/hidden/launcher::electron-headless-hidden-child-launcher
