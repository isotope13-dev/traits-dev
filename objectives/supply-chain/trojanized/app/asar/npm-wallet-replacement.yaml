defaults:
  for: [javascript]
  platforms: [windows]
  attack: T1195.002,T1554

traits:
  - id: npm-wallet-asar-engine-path
    desc: Is wallet modification module
    crit: notable
    if:
      type: path
      regex: 'lib[/\\]engine[/\\]index[.]js$'
  - id: npm-wallet-asar-atomic
    desc: Targets Atomic application archive
    crit: notable
    if:
      type: text
      substr: '''atomic'', ''resources'', ''app.asar'''
  - id: npm-wallet-asar-exodus
    desc: Targets Exodus wallet directory
    crit: notable
    if:
      type: text
      substr: '''AppData'', ''Local'', ''exodus'''
  - id: npm-wallet-asar-payload-a
    desc: Selects Atomic replacement script
    crit: notable
    if:
      type: text
      substr: 'path.join(__dirname, ''a.js'')'
  - id: npm-wallet-asar-payload-e
    desc: Selects Exodus replacement script
    crit: notable
    if:
      type: text
      substr: 'path.join(__dirname, ''e.js'')'
  - id: npm-wallet-asar-extract
    desc: Extracts wallet application archive
    crit: notable
    if:
      type: text
      substr: 'asar.extractAll(asarPath, dirPath)'
  - id: npm-wallet-asar-copy
    desc: Replaces wallet application script
    crit: notable
    if:
      type: text
      substr: 'fs.copyFile(cpFrom, cpTo)'
  - id: npm-wallet-asar-repack
    desc: Rebuilds wallet application archive
    crit: notable
    if:
      type: text
      substr: 'asar.createPackage(dirPath, asarPath)'
  - id: npm-wallet-asar-start-a
    desc: Runs Atomic modification routine
    crit: notable
    if:
      type: text
      substr: '__a_latest();'
  - id: npm-wallet-asar-start-e
    desc: Runs Exodus modification routine
    crit: notable
    if:
      type: text
      substr: '__e_latest();'
  - id: npm-wallet-asar-require
    desc: Mailer loads wallet modification module
    crit: notable
    if:
      type: text
      substr: 'const engine = require("./engine")'
  - id: npm-wallet-asar-main
    desc: Declares mailer entry point
    crit: notable
    for: [package.json]
    if:
      type: value
      path: main
      regex: '^lib/nodejs-smtp[.]js$'

composite_rules:
  - id: npm-wallet-asar-replacement-engine
    desc: Replaces Atomic and Exodus application code
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: npm-wallet-asar-engine-path
      - id: npm-wallet-asar-atomic
      - id: npm-wallet-asar-exodus
      - id: npm-wallet-asar-payload-a
      - id: npm-wallet-asar-payload-e
      - id: npm-wallet-asar-extract
      - id: npm-wallet-asar-copy
      - id: npm-wallet-asar-repack
      - id: npm-wallet-asar-start-a
      - id: npm-wallet-asar-start-e
  - id: npm-wallet-asar-replacement
    desc: Mailer import modifies wallet applications
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: npm-wallet-asar-replacement-engine
      - id: npm-wallet-asar-require
      - id: npm-wallet-asar-main
