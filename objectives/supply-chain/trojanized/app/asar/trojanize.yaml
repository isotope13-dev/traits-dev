defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002
  mbc: B0024
  for:
  - javascript
  - typescript
  crit: suspicious
traits:
- id: electron-resources-path--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.7
  if:
    type: string_literal
    regex: '(^|[\\/])(resources[\\/]app|Contents[\\/]Resources)([\\/]|$)'
  count_max: 1027733
- id: electron-resources-path--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.7
  if:
    type: string_literal
    substr: process.resourcesPath
  count_max: 1027734
- id: install-status-beacon
  desc: Install status C2 beacon
  crit: suspicious
  conf: 0.9
  if:
    type: string_literal
    substr: set-install-status
composite_rules:
- id: wallet-targeting
  desc: Crypto wallet path targeting
  crit: suspicious
  conf: 0.85
  any:
  - id: objectives/credential-access/wallet/desktop::atomic
  - id: objectives/credential-access/wallet/desktop::exodus
  - id: objectives/credential-access/wallet/desktop::ledger
- id: electron-trojan
  desc: Electron app trojanization
  crit: hostile
  conf: 0.95
  mbc: B0024 - javascript - typescript
  all:
  - id: micro-behaviors/fs/path/application/bundle::electron-asar-path
  - id: wallet-targeting
  - id: micro-behaviors/fs/file/copy::fs-copy
  - id: install-status-beacon
- id: asar-supply-chain
  desc: ASAR supply chain attack
  crit: hostile
  conf: 0.95
  attack: T1195.002 - javascript - typescript
  all:
  - id: micro-behaviors/data/archive/extract/asar::asar-extract
  - id: micro-behaviors/data/archive/create/asar::asar-pack
  - id: micro-behaviors/fs/file/copy::fs-copy
  - id: install-status-beacon
- id: electron-resources-path
  desc: Electron resources directory
  crit: notable
  conf: 0.7
  any:
  - id: electron-resources-path--rx-1
  - id: electron-resources-path--rx-2
  unless:
  - id: metadata/package/testing/
  - id: metadata/file/catalog/identity/
