defaults:
  for:
  - so
  platforms:
  - linux
  attack: T1195.002
  mbc: B0025
composite_rules:
- id: so-network-backdoor
  desc: Shared library with networked shell behavior
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/communications/socket/connect::connect
  - id: micro-behaviors/process/create/shell/spawn::shell-execution-comp
  any:
  - id: micro-behaviors/communications/socket/bind/function::bind
  - id: micro-behaviors/communications/socket/accept::accept-sym
  - id: micro-behaviors/process/create/shell/native::c-popen
  - id: micro-behaviors/process/create/shell/spawn::system-fn
  unless:
  - id: micro-behaviors/dylib/library/family/
  - id: metadata/binary/symbols/count::many-imports
  - id: micro-behaviors/os/bpf/
  - id: well-known/tool/sysadmin/gnupg::npth-threading-library
  - id: metadata/binary/linking/runtime::elf-interpreter-section-name
  downgrade:
    any:
    - id: metadata/binary/provenance/
- id: so-credential-targeting
  desc: Shared library targeting user credentials
  crit: suspicious
  conf: 0.85
  attack: T1552.004
  needs: 2
  all:
  - id: metadata/binary/header/identity::shared-object-type
  any:
  - id: micro-behaviors/fs/path/private-key::keys
  - id: micro-behaviors/os/autorun/control::shell-profile-reference-or-operation
  - id: micro-behaviors/os/autorun/control::shell-profile-file-operation
  unless:
  - id: micro-behaviors/dylib/library/family/
- id: so-c2-infrastructure
  desc: Shared library with C2 infrastructure
  crit: suspicious
  conf: 0.9
  all:
  - id: objectives/command-and-control/infrastructure/domain/malicious::c2-domain
  any:
  - id: micro-behaviors/communications/socket/connect::connect
  - id: micro-behaviors/communications/socket/bind/function::bind
  unless:
  - id: micro-behaviors/dylib/library/family/
- id: so-rootkit-behavior
  desc: Trojanized .so with LD_PRELOAD + shell/dlsym
  crit: suspicious
  conf: 0.8
  attack: T1574.006
  all:
  - id: metadata/binary/header/identity::shared-object-type
  - id: micro-behaviors/os/env/runtime::ld-preload
  any:
  - id: micro-behaviors/process/create/shell/
  - id: micro-behaviors/dylib/lookup::dlsym-symbol
  unless:
  - id: metadata/binary/provenance/
  - id: objectives/evasion/hijack-execution-flow/linker/
  - id: micro-behaviors/dylib/library/family/
  - id: well-known/tool
  - id: well-known/lib
  - id: well-known/lib/observability/telemetry::php-ddtrace-benign-loader-context
  - id: metadata/binary/linking/
- id: supply-chain-backdoor
  desc: Supply chain backdoor in shared library
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/communications/socket/connect::connect
  - id: micro-behaviors/process/create/shell/spawn::shell-execution-comp
  - id: metadata/binary/header/identity::shared-object-type
  any:
  - id: so-credential-targeting
  - id: so-c2-infrastructure
  - id: objectives/command-and-control/infrastructure/domain/malicious::c2-domain
  - id: micro-behaviors/fs/path/private-key::keys
  unless:
  - id: micro-behaviors/dylib/library/family/
  - id: metadata/path::mlterm-sdl2-binary
  - id: metadata/binary/linking/runtime::elf-interpreter-section-name
- id: systemd-library-supply-chain-backdoor
  desc: Trojanized systemd library with C2 or credential theft
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1059.004
  mbc: B0022,B0024
  for:
  - elf
  - so
  all:
  - id: well-known/lib/native/systemd::systemd-shared-library
  any:
  - id: so-c2-infrastructure
  - id: so-credential-targeting
  - id: objectives/command-and-control/infrastructure/domain/malicious::c2-domain
  - id: micro-behaviors/fs/path/private-key::keys
- id: library-backdoor-rootkit
  desc: Library backdoor with rootkit and credential theft
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/communications/socket/connect::connect
  - id: micro-behaviors/process/create/shell/spawn::shell-execution-comp
  - id: micro-behaviors/os/env/runtime::ld-preload
  - id: metadata/binary/header/identity::shared-object-type
  any:
  - id: micro-behaviors/fs/path/private-key::keys
  - id: micro-behaviors/os/autorun/control::shell-profile-reference-or-operation
  unless:
  - id: micro-behaviors/dylib/library/family/
  - id: metadata/binary/linking/runtime::elf-interpreter-section-name
- id: network-shell-credential-so
  desc: Library with network, shell, and credential access
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/communications/socket/connect::connect
  - id: micro-behaviors/process/create/shell/spawn::shell-execution-comp
  - id: metadata/binary/header/identity::shared-object-type
  any:
  - id: micro-behaviors/fs/path/private-key::keys
  - id: micro-behaviors/os/autorun/control::shell-profile-reference-or-operation
  - id: objectives/command-and-control/infrastructure/domain/malicious::c2-domain
  unless:
  - id: micro-behaviors/dylib/library/family/
  - id: metadata/path::mlterm-sdl2-binary
  - id: metadata/binary/linking/runtime::elf-interpreter-section-name
