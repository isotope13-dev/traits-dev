defaults:
  platforms:
  - linux
  - macos
  - windows
  for: [binaries]
  attack: T1195.002
  mbc: B0025
traits:
- id: high-entropy-strings-dup
  desc: Large obfuscated data blob
  crit: notable
  conf: 0.7
  if:
    type: metrics
    field: binary.high_entropy_string_count
    min: 200
  unless:
  - type: metrics
    field: binary.string_count
    min: 1000
  - id: metadata/binary/resource::kernel-driver-idata
  downgrade:
    all:
    - id: metadata/binary/metrics/structural::many-imports
    - id: micro-behaviors/dylib/library/abi-graphics::graphics-api-import
    any:
    - id: micro-behaviors/dylib/library/abi-graphics::graphics-runtime-library-name
    - id: metadata/binary/metrics/threshold::many-exports-200
- id: massive-code-blob
  desc: Function with a 50+ block control-flow graph
  crit: component
  conf: 0.85
  if:
    id: metadata/binary/metrics/structural::large-functions
  unless:
  - type: metrics
    field: functions.count
    max: 50
  - id: micro-behaviors/ui/help/
  - type: basename
    exact: sh
  downgrade:
    any:
    - id: metadata/signed/platform::apple
- id: lzma-crc64-table
  desc: lzma_crc64_table reference
  crit: component
  conf: 0.4
  if:
    type: text
    substr: lzma_crc64_table
- id: xz-cpuid-mask-check
  desc: 'CPUID mask check'
    # NOTE: this byte pattern matches xz's own CPU feature dispatch — the
    # path that picks SSE2/AVX CRC implementations at startup. It appears in
    # clean liblzma 5.4.5 (1 hit) and 5.6.3 (2 hits) and is *absent* from the
    # backdoored 5.6.0. Standalone it is not a backdoor signal; keeping it as
    # `component` so it only contributes when composed with other backdoor
    # evidence (xz-backdoor-entry, ifunc-pattern, multiple-compressed-payloads).
  crit: component
  conf: 0.4
  for:
  - elf
  if:
    type: hex
    section: .text
    pattern: 0F A2 F7 D1 81 E1 02 02 08 00
  unless:
  - type: basename
    regex: '^liblzma\.so\.5\.4\.5$'
- id: mm-answer-keyallowed
  desc: mm_answer_keyallowed SSH function
  crit: component
  conf: 0.8
  if:
    type: symbol
    exact: mm_answer_keyallowed
  for: [elf, macho, so]
  unless:
  - type: basename
    regex: '\.o$'
- id: mm-answer-authpassword
  desc: mm_answer_authpassword SSH function
  crit: component
  conf: 0.8
  if:
    type: symbol
    exact: mm_answer_authpassword
  for: [elf, macho, so]
  unless:
  - type: basename
    regex: '\.o$'
- id: pubkey-auth-ref
  desc: pubkey_auth reference
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: pubkey_auth
  unless:
  - type: basename
    regex: '\.o$'
- id: rtld-global-ref
  desc: __rtld_global reference
  crit: component
  conf: 0.6
  for:
  - elf
  if:
    type: text
    substr: __rtld_global
  unless:
  - id: micro-behaviors/dylib/library/family/
- id: la-symbind-ref
  desc: la_symbind audit hook
  crit: component
  conf: 0.7
  for:
  - elf
  if:
    type: text
    substr: la_symbind
  unless:
  - id: objectives/evasion/hijack-execution-flow/linker/
  - id: micro-behaviors/dylib/library/family/
composite_rules:
- id: symbol-interposition
  desc: XZ-style glibc symbol interposition
  crit: suspicious
  conf: 0.7
  for:
  - elf
  # XZ scope: dlsym + RTLD_NEXT alone is the universal LD_PRELOAD hook
  # idiom and fires on any preload shim (PAM hooks, runtime tracers,
  # benign sanitizers). Require an XZ-specific glibc-internals marker
  # so this stays inside the trojanized-xz-utils family.
  all:
  - id: micro-behaviors/dylib/lookup::dlsym-symbol
  - id: micro-behaviors/dylib/lookup::rtld-next
  any:
  - id: rtld-global-ref
  - id: la-symbind-ref
  downgrade:
    any:
    - id: well-known/lib/native/glibc::libc-soname
  unless:
  - id: micro-behaviors/dylib/library/libc/
  - id: micro-behaviors/dylib/library/family/
- id: xz-crc-pattern
  desc: XZ CRC64 patterns
  crit: suspicious
  conf: 0.6
  for:
  - elf
  needs: 2
  any:
  - id: lzma-crc64-table
  - id: metadata/binary/linking/runtime::ifunc
- id: xz-backdoor-signature
  desc: XZ Utils backdoor signature (CVE-2024-3094)
  crit: hostile
  conf: 0.99
  for:
  - elf
  all:
  - id: xz-crc-pattern
  - id: metadata/binary/instruction::byte-load-xor-sequence
- id: xz-ifunc-pattern
  desc: IFUNC resolver pattern (potential function
  crit: suspicious
  conf: 0.4
  for:
  - elf
  all:
  - id: metadata/binary/instruction::cpuid-instr
  - id: metadata/binary/linking/runtime::resolver-markers
  - id: metadata/binary/linking/runtime::ifunc-markers
- id: rsa-in-compression-lib
  desc: RSA operations in compression library
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/crypto/asymmetric/rsa::rsa-operations
  - id: metadata/library/compression::compression-lib
- id: ssh-hook-pattern
  desc: SSH authentication hooking pattern
  crit: suspicious
  conf: 0.85
  all:
  - id: micro-behaviors/os/service/remote::sshd-ref
  any:
  - id: micro-behaviors/crypto/asymmetric/rsa::rsa-public-decrypt
  - id: mm-answer-keyallowed
  - id: mm-answer-authpassword
  - id: pubkey-auth-ref
  unless:
  - id: metadata/signed/platform::apple
  downgrade:
    any:
    - id: micro-behaviors/communications/ssh/connect::openssh
- id: glibc-hijack
  desc: Dynamic linker interposition markers
  crit: suspicious
  conf: 0.7
  for:
  - elf
  all:
  - id: micro-behaviors/dylib/lookup::dlsym-symbol
  any:
  - id: rtld-global-ref
  - id: la-symbind-ref
  - id: micro-behaviors/os/linker/env::ld-preload
  - id: micro-behaviors/os/linker/env::ld-audit
  unless:
  - id: metadata/binary/provenance/
  - id: objectives/evasion/hijack-execution-flow/linker/
  - id: micro-behaviors/dylib/library/libc/
  - id: micro-behaviors/dylib/library/family/
  - id: well-known/tool/sysadmin/unix-benign/
  - id: well-known/tool/reverse-engineering/rizin::rz-test-usage
- id: unexpected-socket-ops
  # Sockets in a *library* are the anomaly this rule names (the liblzma
  # backdoor shape); nothing establishes "library" for an executable, where
  # socket+connect is ordinary for any networked program. for: [so, dylib,
  # dll] separates PE/DLL and Mach-O executables; for ELF the engine types
  # executables and shared objects identically, so an ELF carrying a
  # PT_INTERP (dynamic-loader path — only executables have one) is carved
  # out via unless. Mirrors the fix documented on the
  # unexpected-capabilities sibling below.
  desc: Socket operations in non-network library
  crit: suspicious
  conf: 0.6
  for: [so, dylib, dll]
  all:
  - id: micro-behaviors/communications/socket/create::create
  - id: micro-behaviors/communications/socket/connect::connect
  unless:
  - id: objectives/supply-chain/trojanized/backdoor/
  - id: metadata/lang/compiled/
  - id: metadata/signed/platform::apple
  - id: well-known/app/ai/tool-server/mcu-ai-debug/
  - id: well-known/tool/sysadmin/alpine-packages::alpine-filebrowser-binary
  # A PT_INTERP marks an ELF executable (shared libraries have none).
  - id: metadata/binary/linking/runtime::interpreter
- id: unexpected-crypto-safe-context
  desc: Known crypto library or runtime context
  crit: exception
  conf: 0.99
  any:
  - id: micro-behaviors/crypto/library/implementation::crypto-library-context
  - id: well-known/app/communication/telegram::telegram-desktop-official-client
  - id: metadata/package/files/system-package/
  - id: well-known/tool/sysadmin/alpine-packages::alpine-jitsu-bulker-binary
  - id: well-known/lib/runtime/v8::nodejs-runtime
  - id: well-known/lib/runtime/node-runtime::node-shared-library
- id: unexpected-crypto
  desc: Cryptographic operations in non-crypto library
  crit: suspicious
  conf: 0.75
  needs: 2
  any:
  - id: micro-behaviors/crypto/symmetric/aes/constant::aes-sbox-bytes
  - id: micro-behaviors/crypto/asymmetric/rsa::rsa-operations
  - id: micro-behaviors/crypto/asymmetric/rsa::ed25519-constant-bytes
  unless:
  - id: unexpected-crypto-safe-context
  downgrade:
    any:
    - id: metadata/binary/metrics/structural::very-high-section-count
- id: unexpected-capabilities
  # Was "Unexpected capability combination in library" at needs:2, but nothing
  # here establishes "library" (`for: so` matches every ELF, executables
  # included) and any two of these three are ordinary for a networked program:
  # it convicted flow, the Flow type checker's 21MB OCaml binary, which forks a
  # background server and talks to it on a socket.  Name it for what it checks,
  # drop the formats where an executable is distinguishable, and require all
  # three -- the xz/liblzma case had sockets, exec, *and* ed25519 constants.
  desc: Socket, exec and crypto capabilities combined
  crit: suspicious
  conf: 0.8
  for: [so, dylib, dll]
  needs: 3
  any:
  - id: unexpected-socket-ops
  - id: micro-behaviors/process/create/direct::fork-shell-operations
  - id: unexpected-crypto
  unless:
  - id: well-known/tool/development/darling/
  - id: well-known/app/development/github-desktop::official-signed-app-bundle
  - id: metadata/lang/compiler/systems::go-runtime-context
- id: injected-code-pattern
  desc: Injected code pattern in library
  crit: suspicious
  conf: 0.85
  all:
  - id: objectives/supply-chain/trojanized/backdoor::high-entropy-strings-dup
  any:
  - id: unexpected-crypto
  - id: unexpected-socket-ops
- id: packed-rust-http-ws-c2
  desc: Packed Rust HTTP/WebSocket C2 implant
  crit: hostile
  conf: 0.95
  for:
  - pe
  platforms:
  - windows
  all:
  - id: objectives/anti-static/obfuscation/binary-metrics/shape::binary-encrypted-overlay
  - id: objectives/evasion/indicator-removal/timestamps::timestamp-anomaly
  needs: 2
  any:
  - id: micro-behaviors/communications/http/lib/crate::reqwest-crate
  - id: micro-behaviors/communications/http/lib/crate::hyper-crate
  - id: micro-behaviors/communications/http/websocket::websocket-class
  - id: micro-behaviors/os/registry/access::internet-settings-key
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: objectives/anti-static/obfuscation/binary-metrics/shape/
- id: packed-rust-proxy-aware-ws-c2
  desc: Packed Rust proxy-aware WebSocket implant
  crit: hostile
  conf: 0.96
  attack: T1090
  for:
  - pe
  platforms:
  - windows
  all:
  - id: objectives/anti-static/obfuscation/binary-metrics/shape::binary-encrypted-overlay
  - id: objectives/evasion/indicator-removal/timestamps::timestamp-anomaly
  - id: micro-behaviors/communications/proxy/tunnel::windows-http-proxy-tunnel
  needs: 2
  any:
  - id: micro-behaviors/communications/http/lib/crate::reqwest-crate
  - id: micro-behaviors/communications/http/lib/crate::hyper-crate
  - id: micro-behaviors/communications/http/websocket::websocket-class
  - id: micro-behaviors/os/registry/access::internet-settings-key
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: objectives/anti-static/obfuscation/binary-metrics/shape/
- id: xz-style-attack
  desc: XZ-style supply chain backdoor pattern
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/binary/metrics/structural::many-huge-functions
  any:
  - id: xz-crc-pattern
  - id: metadata/binary/instruction::byte-load-xor-sequence
  - id: ssh-hook-pattern
  - id: rsa-in-compression-lib
# Named for what is actually observed. The former `many-huge-functions` leg
# paired one control-flow-graph size metric with another, so any large native
# application - a 45 MB system-information utility, a game, a browser - reported
# "potential code injection" on nothing but its own size. Interposition is the
# only leg that carried the XZ-family meaning, so it is now required.
- id: interposition-in-large-functions
  desc: Linker interposition inside large opaque functions
  crit: suspicious
  conf: 0.8
  all:
  - id: massive-code-blob
  - id: glibc-hijack
- id: auth-bypass-indicator
  desc: Authentication bypass backdoor indicator
  crit: suspicious
  conf: 0.95
  any:
  - id: ssh-hook-pattern
  - id: rsa-in-compression-lib
  - id: symbol-interposition
- id: function-hooking-behavior
  desc: XZ-style glibc symbol interposition
  crit: suspicious
  conf: 0.8
  # XZ-style: dlsym + RTLD_NEXT alone is too generic (any LD_PRELOAD shim
  # qualifies). Require an XZ-specific glibc-internals marker so this
  # composite stays inside the XZ family scope.
  all:
  - id: glibc-hijack
  any:
  - id: rtld-global-ref
  - id: la-symbind-ref
  unless:
  - id: micro-behaviors/dylib/library/libc/
  - id: micro-behaviors/dylib/library/family/
- id: permission-constant-with-interposition
  desc: Permission constant with linker interposition markers
  crit: suspicious
  conf: 0.75
  all:
  - id: micro-behaviors/mem/protect/modify::repeated-07-byte-constant
  any:
  - id: glibc-hijack
  - id: symbol-interposition
  - id: objectives/supply-chain/trojanized/backdoor::high-entropy-strings-dup
  downgrade:
    any:
    - id: well-known/lib/native/glibc::libc-soname
    - id: metadata/binary/provenance/
    - id: micro-behaviors/dylib/library/family::sanitizer-runtime
  unless:
  - id: micro-behaviors/dylib/library/libc/
  - id: micro-behaviors/dylib/library/family/
  - id: well-known/tool/sysadmin/unix-benign/
- id: compression-lib-backdoor
  desc: Compression library with hidden payload and geofencing
  crit: hostile
  conf: 0.95
  for:
  - elf
  all:
  - id: metadata/library/compression::compression-lib
  - id: micro-behaviors/data/embedded/payload/compression::multiple-compressed-payloads
  any:
  - id: objectives/evasion/masquerade/naming/
  - id: metadata/library/timezone::cis-region-zone-reference
- id: compression-lib-embedded-binary
  desc: Compression library with embedded executable
  crit: hostile
  conf: 0.95
  for:
  - elf
  all:
  - id: metadata/library/compression::compression-lib
  any:
  - id: micro-behaviors/data/embedded/payload/header
  unless:
  - id: metadata/library/compression/
- id: library-payload-geofencing
  desc: Library with embedded payload and geofencing
  crit: suspicious
  conf: 0.85
  for:
  - elf
  all:
  - id: micro-behaviors/data/embedded/payload/compression::multiple-compressed-payloads
  - id: objectives/anti-analysis/geofencing/region/cluster::cis-geofencing
- id: compression-lib-backdoor-cpuid
  desc: Compression library with hidden payload and suspicious CPUID
  crit: hostile
  conf: 0.95
  for:
  - elf
  all:
  - id: metadata/library/compression::compression-lib
  - id: micro-behaviors/data/embedded/payload/compression::multiple-compressed-payloads
  - id: xz-cpuid-mask-check
