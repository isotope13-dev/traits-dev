defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [binaries]
  attack: T1195.002
  mbc: B0025
composite_rules:
  - id: symbol-interposition
    desc: XZ-style glibc symbol interposition
    crit: suspicious
    conf: 0.7
    for:
      - elf
  # XZ scope: dlsym + RTLD_NEXT alone is the universal LD_PRELOAD hook
  # idiom and fires on any preload shim (PAM hooks, runtime tracers,
  # benign sanitizers). Require an XZ-specific glibc-internals marker
  # so this stays inside the trojanized-xz-utils family.
    all:
      - id: micro-behaviors/dylib/lookup::dlsym-symbol
      - id: micro-behaviors/dylib/lookup::rtld-next
    any:
      - id: micro-behaviors/os/linker::rtld-global-ref
      - id: micro-behaviors/os/linker::la-symbind-ref
    downgrade:
      any:
        - id: well-known/lib/native/glibc::libc-soname
  - id: xz-crc-pattern
    desc: XZ CRC64 patterns
    crit: suspicious
    conf: 0.6
    for:
      - elf
    needs: 2
    any:
      - id: micro-behaviors/data/compression::lzma-crc64-table
      - id: metadata/binary/linking/runtime::ifunc
  - id: xz-backdoor-signature
    desc: XZ Utils backdoor signature (CVE-2024-3094)
    crit: hostile
    conf: 0.99
    for:
      - elf
    all:
      - id: xz-crc-pattern
      - id: metadata/binary/instruction/sequence/unspecified::byte-load-xor-sequence
  - id: xz-ifunc-pattern
    desc: IFUNC resolver pattern (potential function
    crit: suspicious
    conf: 0.4
    for:
      - elf
    all:
      - id: metadata/binary/instruction/opcode::cpuid-instr
      - id: metadata/binary/linking/runtime::resolver-markers
      - id: metadata/binary/linking/runtime::ifunc-markers
  - id: ssh-hook-pattern
    desc: SSH authentication hooking pattern
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/os/service/remote::sshd-ref
      - id: symbol-interposition
    any:
      - id: micro-behaviors/crypto/asymmetric/rsa::rsa-public-decrypt
      - id: micro-behaviors/communications/ssh/server::mm-answer-keyallowed
      - id: micro-behaviors/communications/ssh/server::mm-answer-authpassword
      - id: micro-behaviors/communications/ssh/server::pubkey-auth-ref
    unless:
      - id: metadata/signature/verified/platform::apple
      - id: well-known/app/network/openssh::windows-platform-signed-component
    downgrade:
      any:
        - id: micro-behaviors/communications/ssh/connect::openssh
  - id: injected-code-pattern
    desc: Injected code pattern in library
    crit: suspicious
    conf: 0.85
    all:
      - id: "metadata/binary/layout/strings::high-entropy-strings-200"
    any:
      - id: micro-behaviors/crypto/primitive::multiple-crypto-primitive-markers
      - id: micro-behaviors/communications/socket/connect/attempt::library-socket-client
  - id: packed-rust-http-ws-c2
    desc: Packed Rust HTTP/WebSocket C2 implant
    crit: hostile
    conf: 0.95
    for:
      - pe
    platforms:
      - windows
    all:
      - id: metadata/binary/layout/overlay::large-opaque-high-entropy-overlay
      - id: metadata/binary/provenance/build::unusual-pe-header-timestamp
    needs: 2
    any:
      - id: micro-behaviors/communications/http/lib/crate::reqwest-crate
      - id: micro-behaviors/communications/http/lib/crate::hyper-crate
      - id: micro-behaviors/communications/websocket/library::websocket-class-reference
      - id: micro-behaviors/os/registry/network/reference::internet-settings-key
  # The three contexts as first written. A 2026-06 cleanup widened them to
  # directories; overlay metadata holds the high-entropy overlay leg, so the rule
  # could never fire, and signed/platform/ let any signed implant through.
    unless:
      - id: metadata/signature/verified/platform::microsoft
      - id: metadata/installer/product::known-installer-context
      - id: micro-behaviors/data/archive/extract/self-extractor::sevenzip-sfx-pkcs7-oid
  - id: packed-rust-proxy-aware-ws-c2
    desc: Packed Rust proxy-aware WebSocket implant
    crit: hostile
    conf: 0.96
    attack: T1090
    for:
      - pe
    platforms:
      - windows
    all:
      - id: metadata/binary/layout/overlay::large-opaque-high-entropy-overlay
      - id: metadata/binary/provenance/build::unusual-pe-header-timestamp
      - id: micro-behaviors/communications/proxy/system::windows-http-proxy-tunnel
    needs: 2
    any:
      - id: micro-behaviors/communications/http/lib/crate::reqwest-crate
      - id: micro-behaviors/communications/http/lib/crate::hyper-crate
      - id: micro-behaviors/communications/websocket/library::websocket-class-reference
      - id: micro-behaviors/os/registry/network/reference::internet-settings-key
  # The three contexts as first written. A 2026-06 cleanup widened them to
  # directories; overlay metadata holds the high-entropy overlay leg, so the rule
  # could never fire, and signed/platform/ let any signed implant through.
    unless:
      - id: metadata/signature/verified/platform::microsoft
      - id: metadata/installer/product::known-installer-context
      - id: micro-behaviors/data/archive/extract/self-extractor::sevenzip-sfx-pkcs7-oid
  - id: auth-bypass-indicator
    desc: Authentication bypass backdoor indicator
    crit: suspicious
    conf: 0.95
    unless:
  # OpenSSH itself uses its authentication path and symbol interposition.
      - id: well-known/app/network/openssh::openssh-server
    any:
      - id: ssh-hook-pattern
      - id: symbol-interposition
  - id: function-hooking-behavior
    for: [elf]
    desc: XZ-style glibc symbol interposition
    crit: suspicious
    conf: 0.8
  # XZ-style: dlsym + RTLD_NEXT alone is too generic (any LD_PRELOAD shim
  # qualifies). Require an XZ-specific glibc-internals marker so this
  # composite stays inside the XZ family scope.
    all:
      - id: micro-behaviors/dylib/lookup::dynamic-linker-configuration-references
    any:
      - id: micro-behaviors/os/linker::rtld-global-ref
      - id: micro-behaviors/os/linker::la-symbind-ref
  - id: permission-constant-with-interposition
    for: [elf, macho]
    desc: RWX memory protection with linker interposition
    crit: suspicious
    conf: 0.75
    all:
      - id: micro-behaviors/mem/protect/modify/executable::mprotect-rwx-syscall
    any:
      - id: micro-behaviors/dylib/lookup::dynamic-linker-configuration-references
      - id: symbol-interposition
      - id: "metadata/binary/layout/strings::high-entropy-strings-200"
    downgrade:
      any:
        - id: well-known/lib/native/glibc::libc-soname
        - id: metadata/binary/provenance/
        - id: micro-behaviors/process/debug/tool-markers::sanitizer-runtime
  - id: compression-lib-backdoor
    desc: Compression library with hidden payload and geofencing
    crit: hostile
    conf: 0.95
    for:
      - elf
    all:
      - id: well-known/lib/format/compression::compression-lib
      - id: micro-behaviors/data/embedded/payload/compression::multiple-compressed-payloads
    any:
      - id: objectives/evasion/masquerade/naming/
      - id: metadata/lang/locale/timezone::cis-region-zone-reference
  - id: compression-lib-embedded-binary
    desc: Compression library with embedded executable
    crit: hostile
    conf: 0.95
    for:
      - elf
    all:
      - id: well-known/lib/format/compression::compression-lib
    any:
      - id: micro-behaviors/data/embedded/payload/header
  # No `unless:`: the original metadata/library/compression/ (now
  # well-known/lib/format/) contained the compression-lib leg itself, so this
  # rule had never fired.
  - id: library-payload-geofencing
    desc: Library with embedded payload and geofencing
    crit: suspicious
    conf: 0.85
    for:
      - elf
    all:
      - id: micro-behaviors/data/embedded/payload/compression::multiple-compressed-payloads
      - id: objectives/anti-analysis/geofencing/region/cluster::cis-region-check-clues
  - id: compression-lib-backdoor-cpuid
    desc: Compression library with hidden payload and suspicious CPUID
    crit: hostile
    conf: 0.95
    for:
      - elf
    all:
      - id: well-known/lib/format/compression::compression-lib
      - id: micro-behaviors/data/embedded/payload/compression::multiple-compressed-payloads
      - id: micro-behaviors/os/sysinfo/cpu::cpuid-feature-mask-test
