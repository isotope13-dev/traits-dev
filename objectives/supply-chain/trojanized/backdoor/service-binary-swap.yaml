defaults:
  attack: T1554,T1070.006,T1105
  mbc: B0025,F0006

composite_rules:
  - id: remote-service-binary-timestomp-swap
    desc: Downloads replacement service binary, stops service, and forges timestamps
    crit: hostile
    conf: 0.97
    platforms: [unix]
    for: [shell]
    all:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::curl-wget-command
      - id: micro-behaviors/os/service/stop/
      - id: micro-behaviors/fs/chmod/executable/mode::script-grants-execute-permission
    any:
      - id: micro-behaviors/fs/file/timestamp::touch-restored-variable-timestamp
      - id: micro-behaviors/fs/file/timestamp::touch-explicit-timestamp
      - id: micro-behaviors/fs/file/timestamp::touch-reference-multiple
      - id: objectives/evasion/indicator-removal/timestamps::touch-date
      - id: objectives/evasion/indicator-removal/timestamps::touch-reference-system-path
    unless:
      - id: metadata/build/conda::conda-recipe-build-script
      - id: metadata/build/package/maintainer-scripts::rpm-spec-recipe-context

  - id: python-service-binary-timestomp-swap
    desc: Python script stops service, downloads replacement, and restores file timestamps
    crit: hostile
    conf: 0.97
    platforms: [unix, windows]
    for: [python]
    all:
      - id: micro-behaviors/communications/http/
      - id: micro-behaviors/os/service/stop/
    any:
      - id: micro-behaviors/fs/file/timestamp::os-utime
      - id: micro-behaviors/fs/file/timestamp::shutil-copystat-call

  - id: powershell-service-binary-timestomp-swap
    desc: PowerShell stops service, fetches replacement binary, and forges file timestamps
    crit: hostile
    conf: 0.97
    platforms: [windows]
    for: [powershell]
    all:
      - id: micro-behaviors/communications/http/
      - id: micro-behaviors/os/service/stop/
    any:
      - id: micro-behaviors/fs/file/timestamp::powershell-filetime-property-set
      - id: micro-behaviors/fs/file/timestamp::powershell-dotnet-set-file-time

  - id: go-service-binary-timestomp-swap
    desc: Go stops service, fetches replacement binary, and modifies file timestamps
    crit: hostile
    conf: 0.97
    platforms: [unix, windows]
    for: [go]
    all:
      - id: micro-behaviors/communications/http/download/write::go-http-response-file-copy
      - id: micro-behaviors/os/service/stop/
      - id: micro-behaviors/fs/file/timestamp::go-os-chtimes-call
