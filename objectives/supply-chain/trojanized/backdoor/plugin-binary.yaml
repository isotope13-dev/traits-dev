# Infrastructure plugins (Terraform providers, other hashicorp/go-plugin
# hosts) are compiled from public source and run with the operator's cloud
# credentials. The gocommunity-io/dockerd provider (a kreuzwerker/docker
# lookalike) shipped v4.5.3+ with a loader spliced into the container-create
# handler: helper functions renamed to twelve-hex-digit hashes
# (`provider._ad79680770be`), decrypting a bundled zip and `go run`-ing it.
# Go keeps every function name in the pclntab, so the renaming survives into
# the release binary even though no loader source ships with it.
#
# Nothing in a legitimate provider's build renames functions this way (see
# name-mangling/variables/hash-named.yaml for the corpus measurements), so a
# provider identity plus hash-named functions is the backdoor, not a style.
defaults:
  platforms: [linux, macos, windows]
  attack: T1195.002,T1027
  mbc: B0024

composite_rules:
  - id: plugin-binary-hash-named-functions
    desc: Terraform provider binary with hash-renamed functions
    crit: hostile
    conf: 0.95
    for: [elf, macho, pe]
    all:
      - id: well-known/app/infrastructure/terraform-provider::terraform-provider-binary
      - id: objectives/anti-static/obfuscation/name-mangling/variables::go-binary-hash-named-functions

  # The release artifact: a provider binary shipped beside an archive
  # disguised as a database or library. Providers ship a binary, a LICENSE
  # and a README; from v4.5.4 the dockerd releases also carried
  # examples/.../import-resource.sqlite3, the zip the binary decrypts.
  - id: plugin-release-bundles-disguised-archive
    desc: Terraform provider release bundles a disguised archive
    crit: hostile
    conf: 0.95
    scope: archive
    for: [zip, tar, elf, macho, pe]
    all:
      - id: well-known/app/infrastructure/terraform-provider::terraform-provider-binary
    any:
      - id: objectives/evasion/masquerade/extension-mismatch::archive-disguised-as-database-file
      - id: objectives/evasion/masquerade/extension-mismatch::archive-disguised-as-native-library
