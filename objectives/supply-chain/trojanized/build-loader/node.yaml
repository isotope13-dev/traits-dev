# Build-time webpack loaders that run host reconnaissance as package code.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002

traits:
  - id: node-shell-loader-invocation
    desc: POSIX shell execFileSync in loader
    crit: component
    conf: 0.98
    if:
      type: tree-sitter
      kind: call
      regex: '\bexecFileSync\s*\(\s*["'']/bin/sh["'']'

  - id: node-shell-host-profile-command
    desc: Shell collects identity, host, and cwd
    crit: component
    conf: 0.99
    if:
      type: tree-sitter
      kind: call
      regex: '["'']id;\s*hostname;\s*pwd["'']'

  - id: loader-emits-build-warning
    desc: Loader emits collected output as warning
    crit: component
    conf: 0.9
    if:
      type: tree-sitter
      kind: call
      regex: '\bemitWarning\s*\('

composite_rules:
  - id: webpack-loader-shell-host-recon
    desc: Build loader runs a shell host-reconnaissance command
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1082,T1033,T1195.002
    all:
      - id: node-shell-loader-invocation
      - id: node-shell-host-profile-command
      - id: micro-behaviors/process/create/exec::node-execfile-reference
