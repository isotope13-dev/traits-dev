defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: artifactory-cache-replacement-repack
    desc: Registry cache replacement with hook repacking
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/request/result::javascript-fetch-delete-put-same-url
      - id: micro-behaviors/communications/http/url/registry::artifactory-npm-reindex-path-assembly
      - id: objectives/supply-chain/trojanized/build-pipeline::gyp-hook-package-version-rewrite
