defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: credential-harvester-entrypoint-republisher
    desc: Credential harvester republishes packages with prepended entrypoint content
    crit: hostile
    conf: 0.97
    attack: T1195.002
    all:
      - id: credential-harvester-with-package-republish-interface
    any:
      - id: metadata/lang/source/syntax/call/arguments::bun-computed-call-prepend-line
      - id: metadata/lang/source/syntax/call/arguments::bun-computed-call-concat-pair
