defaults:
  platforms: [linux]
  for: [shell]
  attack: T1195.002
composite_rules:
  - id: pkgbuild-unverified-sudo-source-exec
    # An integrity-disabled source entry is executed as root on the builder,
    # before package installation. This is the complete builder-compromise
    # chain, not merely an unusual use of sudo.
    desc: PKGBUILD sudo-runs an unverified source entry
    crit: hostile
    conf: 0.99
    near_lines: 30
    all:
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-phase-sudo
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-checksum-skip
      - id: metadata/lang/source/syntax/command/named-command::pkgbuild-sudo-srcdir-entry

