defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002
composite_rules:
  - id: gyp-hook-package-version-rewrite
    desc: Gyp execution hook with package version bump
    crit: suspicious
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/create/shell/command-string::javascript-gyp-node-source-template
      - id: micro-behaviors/os/package-manager/archive::javascript-package-version-assignment
  - id: pypi-sitecustomize-republisher
    desc: Credential scraper repackages wheel startup code
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/package-manager/archive::javascript-wheel-sitecustomize-insertion
      - id: micro-behaviors/os/package-manager/publish::javascript-pypi-upload-request
    # Startup customization and publishing are also legitimate wheel tooling.
    # Require an independently established credential scraper for hostility.
    any:
      - id: objectives/credential-access/memory::github-runner-process-memory-secret-dump
      - id: objectives/credential-access/credential-manager/secret-storage::obfuscated-multi-source-credential-harvester
  - id: pypi-pth-member-republisher
    desc: Wheel pth member construction with PyPI upload
    crit: suspicious
    conf: 0.97
    # Startup injection through .pth is distinct from sitecustomize.py.
    # The builder and uploader co-occur; this does not bind their buffers.
    all:
      - id: micro-behaviors/os/package-manager/archive::javascript-wheel-pth-member-assignment
      - id: micro-behaviors/os/package-manager/publish::javascript-pypi-upload-request
  - id: rubygems-extension-republisher
    desc: RubyGems extension rewrite with gem upload
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/package-manager/archive::javascript-gem-extension-manifest-rewrite
      - id: micro-behaviors/os/package-manager/publish::javascript-rubygems-upload-request
