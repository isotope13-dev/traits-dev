# A private OpenPGP key embedded in release automation can let a repository
# compromise produce artifacts that verify as authentic.  The key material is
# the artifact; the workflow/signing operations provide the release context.
#
# ATT&CK: T1195.002 (Compromise Software Supply Chain)
#         T1552.004 (Unsecured Credentials: Private Keys)
defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows, unix]
  for: [github-actions, shell, scripts, source, python, javascript, typescript, ruby, go, rust]
  attack: T1195.002,T1552.004

composite_rules:
  - id: private-key-in-release-automation
    desc: Private OpenPGP key embedded in release automation
    near_lines: 100
    all:
      - id: micro-behaviors/crypto/key/representation::embedded-pgp-private-key
      - id: micro-behaviors/crypto/key/import::gpg-import-file-command
      - id: micro-behaviors/crypto/sign::gpg-release-artifact-sign-command

  - id: github-actions-private-release-key
    desc: GitHub Actions has private key and GPG import
    for: [github-actions]
    near_lines: 100
    all:
      - id: micro-behaviors/crypto/key/representation::embedded-pgp-private-key
      - id: micro-behaviors/crypto/key/import::gpg-import-file-command
