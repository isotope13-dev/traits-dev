# Agentic CI workflows that turn attacker-controlled issue data into a
# privileged action.  The rules describe the authorization bridge and the
# capability boundary, not a repository name, bot name, or slash command.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  attack: T1195.002,T1059

composite_rules:
  - id: public-issue-agent-privileged-action
    desc: Public issue feeds secret-backed write agent
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/build/ci/trigger::issue-opened-trigger
      - id: metadata/build/ci/agent::workflow-issue-agent-input
      - id: metadata/build/ci/agent::workflow-agent-command
      - id: metadata/build/ci/secret::step-environment-secret-reference
      - id: metadata/build/ci/permission::job-contents-write-permission
      - id: metadata/build/ci/step::workflow-posts-issue-comment

  - id: trusted-comment-agent-authorization-bridge
    desc: Trusted comment gate launches write-capable agent
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/build/ci/trigger::issue-comment-trigger
      - id: metadata/build/ci/gate::issue-comment-command-gate
      - id: metadata/build/ci/gate::issue-comment-identity-gate
      - id: metadata/build/ci/agent::workflow-agent-command
      - id: metadata/build/ci/secret::step-environment-secret-reference
      - id: metadata/build/ci/permission::job-contents-write-permission
      - id: metadata/build/ci/secret::step-token-input-secret-reference

  - id: issue-agent-vcs-write-chain
    desc: Comment-triggered agent can write repository changes
    crit: hostile
    conf: 0.98
    all:
      - id: trusted-comment-agent-authorization-bridge
      - id: metadata/build/ci/permission::job-pull-requests-write-permission
      - id: metadata/build/ci/step::workflow-posts-issue-comment

  - id: agent-vcs-hook-execution-boundary
    desc: Broad agent tool policy reaches Git hook execution
    crit: hostile
    conf: 0.99
    for: [python]
    near_lines: 90
    all:
      - id: micro-behaviors/process/create/agent::agent-capability-configuration
      - id: micro-behaviors/process/create/agent::agent-command-policy-deny
      - id: micro-behaviors/process/create/agent::agent-vcs-command-allowlist
      - id: micro-behaviors/process/create/agent::agent-git-hooks-directory
      - id: micro-behaviors/process/create/agent::agent-git-hooks-path-setting
      - id: micro-behaviors/fs/chmod/modify::python-chmod-call-with-exec-bit

  - id: agent-vcs-hook-secret-access
    desc: Agent Git hook reaches CI credential data
    crit: hostile
    conf: 0.99
    for: [python]
    near_lines: 100
    all:
      - id: agent-vcs-hook-execution-boundary
      - id: micro-behaviors/process/create/agent::agent-hook-reads-ci-secret
