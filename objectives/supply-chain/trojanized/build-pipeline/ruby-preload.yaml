defaults:
  for: [ruby]
  platforms: [unix, windows]
composite_rules:
  - id: ruby-credential-collector-ci-preload
    desc: Credential collector sets CI Ruby preload
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1574
    all:
      - id: micro-behaviors/os/env/cicd::ruby-github-env-preload-write
    any:
      - id: objectives/credential-access/ssh/key::ruby-home-private-key-post-collector
      - id: objectives/credential-access/cloud/account::ruby-home-aws-credential-post-collector
