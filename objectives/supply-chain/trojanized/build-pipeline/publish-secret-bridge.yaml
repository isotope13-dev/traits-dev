# Publish-shell credential bridges: a helper gated on the package-upload
# flow that runs while registry secrets are live in the environment, hands
# them to a delivery helper, then clears them. The sckit PyPI payload pairs
# this with a pinned-hash downloader aimed at the same publishing shell.
defaults:
  platforms: [unix, windows]
  for: [shell]
  attack: T1195.002,T1552.001

composite_rules:
  - id: ci-publish-secret-bridge
    desc: Publish shell bridges registry secrets then clears them
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/env/cicd::github-actions-flag
      - id: micro-behaviors/os/env/cicd::twine-upload-shell-ref
      - id: micro-behaviors/os/env/cicd::pypi-publish-secret-touch
      - id: micro-behaviors/os/env/cicd::ci-secret-unset-after-use

  # Stealth facet of the same bridge: a pinned-hash delivery invocation
  # whose output and failure signals are discarded, exiting success
  # regardless. Hash pins authenticate the fetched helper; the discarded
  # streams and forced-true exit hide the run from job logs.
  - id: ci-pinned-delivery-output-suppressed
    desc: Pinned delivery invocation discards output and failures
    crit: suspicious
    conf: 0.94
    all:
      - id: "metadata/package/integrity::digest-label-with-hexadecimal-value"
      - id: micro-behaviors/os/env/cicd::pypi-publish-secret-touch
      - id: micro-behaviors/process/fd/stdio::shell-stderr-devnull-redirect
      - id: micro-behaviors/process/fd/stdio::shell-failure-suppress-or-true

  # The capture itself: a CI shell that holds a registry publish token (PyPI
  # API token, password input, or npm publish token) and hands it to a
  # network request as a raw curl body. A real publish sends the token to the
  # registry through twine or the npm CLI; curl with a stdin body while the
  # token variable is live is the token leaving for somewhere else — the
  # sckit publish-bridge delivery to its initial-ci endpoint.
  - id: ci-publish-token-network-exfil
    desc: Publish token uploaded to network endpoint from CI shell
    crit: hostile
    conf: 0.93
    attack: T1195.002,T1552.001,T1041
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/upload::curl-data-binary-stdin
    any:
      - id: micro-behaviors/os/env/cicd::pypi-publish-secret-touch
      - id: micro-behaviors/os/env/secret-name::npm-docker-credential-var-name
    unless:
      - id: well-known/tool/development/ci/codecov::official-bash-uploader

  # The combined delivery bridge: a shell script in a publishing flow that
  # touches and unsets registry secrets while running a pinned-hash delivery
  # helper with suppressed output and errors.
  - id: ci-publish-secret-bridge-delivery
    desc: Trojanized CI publish bridge invokes delivery payload and clears secrets
    crit: hostile
    conf: 0.98
    all:
      - id: ci-publish-secret-bridge
      - id: ci-pinned-delivery-output-suppressed

