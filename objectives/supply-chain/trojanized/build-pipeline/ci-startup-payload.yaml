# Unlike a plain profile exporter, this combines a CI shell-startup assignment
# with a file write and a download-to-shell payload. The evidence is nearby
# co-occurrence, not proof that the assigned path is the written path, so it
# remains suspicious and does not claim a confirmed hijack.
defaults:
  platforms: [unix, windows]
  for: [shell]

composite_rules:
- id: ci-startup-shell-payload-staging
  desc: CI startup assignment near staged shell pipeline
  crit: suspicious
  conf: 0.9
  near_bytes: 2048
  all:
  - id: micro-behaviors/os/env/cicd::github-bash-env-assignment-reference
  - id: micro-behaviors/fs/write/file/redirect::shell-printf-file-write
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-sh-text
