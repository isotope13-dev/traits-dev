# A Wolfi/melange manifest names the source its package is built from. Pointing
# the terragrunt package at a repository other than gruntwork-io/terragrunt
# swaps the build input for code the manifest does not vouch for. A fork is
# also what a maintainer tests a patch from, and a Go fork keeps the upstream
# module path, so the owner of the fork and the ldflags are not evidence of
# intent; only the substitution itself is reported.
defaults:
  platforms: [unix, windows]
  for: [manifests]
  attack: T1195.002

traits:
  - id: terragrunt-package-name
    desc: Manifest package named terragrunt
    crit: notable
    conf: 0.9
    size_max: 4096
    if:
      type: text
      substr: "name: terragrunt"
  - id: wolfi-git-checkout-step
    desc: Wolfi pipeline uses git-checkout
    crit: notable
    conf: 0.82
    size_max: 4096
    if:
      type: text
      substr: "- uses: git-checkout"
  - id: terragrunt-checkout-repository
    desc: Manifest checks out a terragrunt repository
    crit: notable
    conf: 0.9
    size_max: 4096
    if:
      type: text
      regex: 'repository:\s*https://github\.com/[\w.-]+/terragrunt\b'
  - id: terragrunt-upstream-checkout
    desc: Manifest checks out gruntwork-io terragrunt
    crit: notable
    conf: 0.95
    size_max: 4096
    if:
      type: text
      substr: "repository: https://github.com/gruntwork-io/terragrunt"

composite_rules:
  - id: terragrunt-nonupstream-source-manifest
    desc: Terragrunt package built from a non-upstream repo
    crit: suspicious
    conf: 0.8
    all:
      - id: terragrunt-package-name
      - id: wolfi-git-checkout-step
      - id: terragrunt-checkout-repository
    unless:
      - id: terragrunt-upstream-checkout
      # This rule's own definition file quotes the manifest lines it matches.
      - id: metadata/file/catalog/identity::cleave-trait-definition-file
