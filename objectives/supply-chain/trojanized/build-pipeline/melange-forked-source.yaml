# A melange recipe that tracks one owner's releases but builds every source
# from another owner has had its build input swapped: the package keeps its
# upstream name, version and update monitor while the code comes from a fork
# the recipe does not vouch for. A maintainer testing a patch does the same,
# so this stays suspicious.
defaults:
  platforms: [linux]
  for: [yaml]
  attack: T1195.002

composite_rules:
  - id: melange-recipe-builds-from-foreign-fork
    desc: Melange recipe swaps the tracked upstream for a fork
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/build/package/recipe/melange::melange-source-owner-differs-from-update
    unless:
      - id: metadata/build/package/recipe/melange::melange-source-chainguard-fork
