# Encoded stages executed by build-system hooks. Each conclusion requires both
# a precise build surface and repeated decoding that feeds dynamic execution.
defaults:
  crit: hostile
  conf: 0.99
  platforms: [unix, windows]
  attack: T1195.002,T1027,T1059
  mbc: B0024

composite_rules:
  - id: makefile-nested-decoder-stage
    desc: Makefile executes a nested Base64-decoded shell stage
    for: [makefile]
    all:
      - id: metadata/build/make::makefile-basename
      - id: micro-behaviors/data/decode/base64::double-base64-decode
      - id: objectives/anti-static/obfuscation/encoding/base64::base64-d-pipe-sh

  - id: cmake-nested-decoder-stage
    desc: CMake build configuration executes a nested decoded stage
    for: [batch, text]
    all:
      - id: metadata/build/cmake::cmakelists-source-basename
      - id: metadata/build/cmake::cmake-external-process-command
      - id: micro-behaviors/data/decode/repeated-base64::command-syntax-repeated
      - id: micro-behaviors/data/runtime/keywords::pipe-to-shell

  - id: cmake-configure-credential-exfil
    desc: CMake configure hook uploads developer credentials
    for: [cmake, tar, zip]
    scope: archive
    attack: T1195.002,T1552.001,T1041
    all:
      - id: metadata/build/cmake::cmakelists-source-basename
      - id: metadata/build/cmake::cmake-external-process-command
      - id: metadata/build/cmake::cmake-credential-upload-command
    any:
      - id: metadata/build/cmake::cmake-credential-file-reference
      - id: metadata/build/cmake::cmake-credential-variable-name

  - id: rust-build-nested-decoder-stage
    desc: Cargo build script executes a nested Base64-decoded shell stage
    for: [rust]
    all:
      - id: objectives/supply-chain/install-hook/build/behavioral::rust-build-rs-file
      - id: micro-behaviors/process/create/shell/runner::rust-shell-command-runner
    any:
      - id: micro-behaviors/data/decode/repeated-base64::rust-repeated-standard-engine-decodes
      - id: micro-behaviors/data/decode/repeated-base64::rust-repeated-url-safe-engine-decodes

  - id: rubygems-extconf-nested-decoder-stage
    desc: RubyGems extension build hook evaluates a nested Base64-decoded stage
    for: [ruby]
    all:
      - id: metadata/build/package/recipe::filename-extconf
      - id: objectives/anti-static/obfuscation/encoding/base64::ruby-nested-base64-decodes
      - id: objectives/anti-static/obfuscation/payload/encoded::ruby-eval-base64-decode

  - id: pypi-setup-nested-decoder-stage
    desc: PyPI setup hook executes a nested Base64-decoded stage
    for: [python]
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/data/decode/symbol-base64::multiple-b64decode-calls
      - id: objectives/anti-static/obfuscation/eval/scripting::python-decode-decrypt-dynamic-exec
