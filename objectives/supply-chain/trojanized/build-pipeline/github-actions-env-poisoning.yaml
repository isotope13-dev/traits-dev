# GitHub Actions environment file poisoning.
# Attackers append to the workflow's $GITHUB_ENV / $GITHUB_PATH files to
# inject env vars or PATH entries into all subsequent steps in the same job.
# Combined with Go-module integrity bypass flags (GONOSUMCHECK, GOFLAGS=-mod=mod)
# this is a classic build-pipeline supply-chain compromise.
#
# ATT&CK: T1574.007 (Path Interception by PATH Environment Variable)
#         T1195.002 (Compromise Software Supply Chain)
defaults:
  crit: hostile
  platforms: [unix, windows]
  attack: T1195.002
  mbc: B0024
  for: [go, shell, python, javascript, typescript]
composite_rules:
- id: github-actions-env-poison
  desc: Injects env vars into GitHub Actions job via $GITHUB_ENV
  crit: hostile
  conf: 0.96
  near_lines: 30
  all:
  - id: micro-behaviors/os/env/cicd::github-env-file
  any:
  - id: micro-behaviors/os/env/config::go-module-sum-exclusion
  - id: micro-behaviors/os/env/config::go-module-mutation-flag
- id: github-actions-bash-env-hijack
  desc: Redirects BASH_ENV to a chosen file via $GITHUB_ENV
  # Every bash step a GitHub Actions runner starts sources the file named by
  # BASH_ENV, so a step that appends "BASH_ENV=<path>" to $GITHUB_ENV arms a
  # script that then runs inside every later step of the job — where publish
  # tokens are live (the sckit CI publish bridge). Dev-env generators that
  # legitimately export a profile this way exist, so this is suspicious, not
  # hostile; pair it with what the pointed-to script does.
  crit: suspicious
  conf: 0.93
  for: [shell, python, javascript]
  near_bytes: 2048
  all:
  - id: micro-behaviors/os/env/cicd::github-env-file
  - id: micro-behaviors/os/env/cicd::bash-env-startup-file
- id: github-actions-path-hijack
  for: [go]
  desc: Hijacks PATH in GitHub Actions job via $GITHUB_PATH
  crit: suspicious
  conf: 0.95
  near_lines: 30
  all:
  - id: micro-behaviors/os/env/cicd::github-path-file
  - id: micro-behaviors/fs/file/open::os-openfile-append
- id: github-actions-node-path-hijack
  for: [javascript]
  desc: Hijacks GitHub Actions PATH with Node shim
  crit: hostile
  conf: 0.98
  near_lines: 80
  all:
  - id: micro-behaviors/os/env/cicd::github-path-file
  - id: micro-behaviors/fs/write/file/append::append-file-sync
  - id: micro-behaviors/fs/path/construct::node-package-manager-shim-name
  - id: micro-behaviors/fs/temp/directory::os-tmpdir
  - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
- id: go-build-supply-chain-poison
  desc: Go program poisons CI build with module-integrity bypass
  crit: hostile
  conf: 0.98
  for: [go]
  all:
  - id: micro-behaviors/os/env/cicd::github-actions-flag
  - id: micro-behaviors/os/env/cicd::github-env-file
  any:
  - id: micro-behaviors/os/env/config::go-module-sum-exclusion
  - id: micro-behaviors/os/env/config::go-module-mutation-flag
