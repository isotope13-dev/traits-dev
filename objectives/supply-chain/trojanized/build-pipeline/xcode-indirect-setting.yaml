# Xcode custom build rules execute a concealed remote shell payload stored in
# a build setting. Setting indirection alone is legitimate build automation.
defaults:
  platforms: [macos, ios]
  for: [pbxproj]
  attack: T1195.002,T1027,T1059.004,T1105

composite_rules:
  - id: xcode-build-rule-indirect-payload-execution
    desc: Xcode rule runs concealed remote shell payload
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/command-mode::xcode-script-runs-setting
      - id: metadata/build/ecosystem::xcode-setting-shell-pipeline
      - id: micro-behaviors/process/deploy/interpreter-stdin/decoded::encoded-blob-piped-to-shell
    any:
      - id: micro-behaviors/process/create/shell/pipeline::encoded-remote-shell-fetch
      - id: micro-behaviors/communications/http/client/response-body::encoded-fetch-command-substitution

  # Build phase variant: the script phase only runs `sh -c "${SETTING}"`; the
  # setting holds a detached subshell that decodes an inline blob into sh.
  # The remote fetch sits below the encoding, so it is not required here.
  - id: xcode-build-script-runs-detached-encoded-setting
    desc: Xcode script runs a detached encoded payload setting
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/shell/command-mode::xcode-script-runs-setting
      - id: metadata/build/ecosystem::xcode-setting-shell-pipeline
      - id: micro-behaviors/process/deploy/interpreter-stdin/decoded::encoded-blob-piped-to-shell
      - id: micro-behaviors/process/daemonize/background::subshell-detached-output-discarded
