defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: ci-startup-token-helper-cleanup
  desc: CI startup, silent token child, failing cleanup
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/os/env/cicd::node-append-github-bash-startup
  - id: micro-behaviors/os/env/write::node-child-npm-token-env-field
  - id: micro-behaviors/process/fd/stdio::child-stdio-ignore-option
  - id: micro-behaviors/fs/delete/file/command::node-spawn-rm-force
  - id: micro-behaviors/process/exit/status::node-nonzero-exitcode-assignment
