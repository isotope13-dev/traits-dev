# Fake-interview Tailwind carriers (OSV MAL-2026-17665/17666/17667/18066/18067/
# 18071, MAL-2026-18734). A take-home repo's tailwind.config.js loads an
# Animate.css plugin whose src/motion.js requires a private scoped PostCSS
# helper and runs it through postcss() while the config loads; there is no
# install hook. The helper only resolves with the lure repo's .npmrc token and
# fetches and runs operator code (MAL-2026-17665). npm replaced the helpers and
# carriers with 0.0.1-security. The carrier bytes themselves contain no network
# code, so these rules claim only that the build runs the withdrawn helper; the
# payload's behavior is not observed here.
#
# Withdrawn coordinates are IOC legs, never matched by scope pattern alone: an
# ordinary scoped PostCSS plugin, a comment, a string, an unused import or a
# dev-only dependency does not supply them (scripts/review/test-npm-triage-good.py).
defaults:
  platforms: [unix, windows]
  attack: T1195.002

traits:
  - id: tailwindcss-pixel-tools-name-ioc
    desc: Package name is tailwindcss-pixel-tools
    crit: component
    attack: none
    for: [package.json]
    if:
      type: value
      path: name
      exact: tailwindcss-pixel-tools

  - id: tailwind-keyframe-utils-name-ioc
    desc: Package name is tailwind-keyframe-utils
    crit: component
    attack: none
    for: [package.json]
    if:
      type: value
      path: name
      exact: tailwind-keyframe-utils

  - id: fast-deep-thinking-name-ioc
    desc: Package name is fast-deep-thinking
    crit: component
    attack: none
    for: [package.json]
    if:
      type: value
      path: name
      exact: fast-deep-thinking

  - id: tailwind-kinetic-name-ioc
    desc: Malicious tailwind-kinetic package identity
    crit: hostile
    conf: 0.99
    attack: none
    for: [package.json]
    ref: https://github.com/advisories/GHSA-j2r4-xxhh-xx58
    if:
      type: value
      path: name
      exact: tailwind-kinetic

  - id: tailwind-base-buttons-name-ioc
    desc: Advisory-listed malicious npm package name
    crit: hostile
    ref: https://github.com/advisories/GHSA-5j43-343m-gggg
    attack: none
    for: [package.json]
    if:
      type: value
      path: name
      exact: tailwind-base-buttons

  # Threat-feed-listed copies of the same carrier template. The exact name is
  # an IOC leg; the archive must also contain the observed helper-loader shape.
  - id: tailwind-motion-css-name-ioc
    desc: Package name is tailwind-motion-css
    crit: component
    attack: none
    for: [package.json]
    if:
      type: value
      path: name
      exact: tailwind-motion-css

  - id: tailwindcss-animation-suite-name-ioc
    desc: Package name is tailwindcss-animation-suite
    crit: component
    attack: none
    for: [package.json]
    if:
      type: value
      path: name
      exact: tailwindcss-animation-suite

  - id: signalledger-bridge-name-ioc
    desc: Package name is signalledger-bridge
    crit: component
    attack: none
    for: [package.json]
    if:
      type: value
      path: name
      exact: signalledger-bridge

composite_rules:
  - id: withdrawn-postcss-helper-factory-run
    desc: Executes withdrawn PostCSS helper factory
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/format/css::postcss-plugin-factory-registration
    any:
      - id: metadata/import/npm/jasperquinn/postcss-motion-helpers
      - id: metadata/import/npm/aaron205whitmore/postcss-animate-utils
      - id: metadata/import/npm/codentra/postcss-kinetix

  # Manifest and module are separate members of one package, hence archive
  # scope; the runtime-dependency regexes exclude devDependencies.
  - id: npm-interview-tailwind-withdrawn-postcss-loader
    desc: Package build runs withdrawn interview-lure helper
    crit: hostile
    conf: 0.98
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: withdrawn-postcss-helper-factory-run
    any:
      - id: metadata/package/dependencies/declaration::npm-postcss-motion-helpers
      - id: metadata/package/dependencies/declaration::npm-postcss-animate-utils
      - id: metadata/package/dependencies/declaration::npm-postcss-kinetix

  - id: npm-unipswap-animate-helper-loader
    desc: Runs private unipswap PostCSS helper
    crit: hostile
    conf: 0.98
    ref: https://github.com/advisories/GHSA-vh4f-84vw-hprv
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: npm-animatecss-tailwind-scoped-helper-template
      - id: metadata/package/dependencies/declaration::npm-postcss-animate-units

  # Twenty-six carriers under seventeen accounts reuse one template while the
  # helper scope rotates. The template build (toPostcssOptions/buildMotionBase
  # feeding a scoped helper factory into postcss) plus Animate.css and scoped
  # helper runtime dependencies warrants review even for an unlisted scope;
  # it does not establish that the new helper is malicious.
  - id: npm-animatecss-tailwind-scoped-helper-template
    desc: Animate.css Tailwind plugin uses interview-lure template
    crit: suspicious
    conf: 0.9
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: micro-behaviors/data/format/css::scoped-motion-helper-build
      - id: metadata/import/npm/tailwindcss/plugin
      - id: metadata/package/dependencies/declaration::npm-animatecss-runtime-dependency
      - id: metadata/package/dependencies/declaration::npm-scoped-runtime-dependency

  # Advisory-listed copies of the same carrier template. Package names are
  # used only as IOCs after the source and manifest prove the loader shape.
  - id: tailwind-keyframe-utils-loader
    desc: Advisory package runs a scoped PostCSS helper
    crit: hostile
    conf: 0.98
    ref: https://github.com/advisories/GHSA-vw84-96h8-p9rf
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: npm-animatecss-tailwind-scoped-helper-template
      - id: tailwind-keyframe-utils-name-ioc

  - id: tailwindcss-pixel-tools-loader
    desc: Advisory package runs a scoped PostCSS helper
    crit: hostile
    conf: 0.98
    ref: https://github.com/advisories/GHSA-r5j2-g4j2-hvmg
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: npm-animatecss-tailwind-scoped-helper-template
      - id: tailwindcss-pixel-tools-name-ioc

  - id: fast-deep-thinking-loader
    desc: Advisory package runs a scoped PostCSS helper
    crit: hostile
    conf: 0.98
    ref: https://github.com/advisories/GHSA-6g8w-4887-v6p3
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: npm-animatecss-tailwind-scoped-helper-template
      - id: fast-deep-thinking-name-ioc

  - id: tailwind-motion-css-loader
    desc: Flagged package runs a scoped PostCSS helper
    crit: hostile
    conf: 0.99
    ref: https://github.com/advisories/GHSA-3c2h-hxp8-jr9c
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: npm-animatecss-tailwind-scoped-helper-template
      - id: tailwind-motion-css-name-ioc

  - id: tailwindcss-animation-suite-loader
    desc: Flagged package runs a scoped PostCSS helper
    crit: hostile
    conf: 0.99
    ref: https://github.com/advisories/GHSA-jqf4-9m2v-868j
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: npm-animatecss-tailwind-scoped-helper-template
      - id: tailwindcss-animation-suite-name-ioc

  - id: signalledger-bridge-loader
    desc: Flagged package runs a scoped PostCSS helper
    crit: hostile
    conf: 0.99
    ref: https://intel.aikido.dev/
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: npm-animatecss-tailwind-scoped-helper-template
      - id: signalledger-bridge-name-ioc
