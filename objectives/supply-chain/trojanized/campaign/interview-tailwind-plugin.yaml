    scope: archive
    all:
      - id: npm-animatecss-tailwind-scoped-helper-template
      - id: tailwind-animate-kit-name-ioc
      - id: tailwind-animate-kit-version-ioc

  - id: signalledger-diagnostics-loader
    desc: Flagged package runs a scoped PostCSS helper
    crit: hostile
    conf: 0.99
    ref: https://intel.aikido.dev/
    for: [npm, package.json, javascript, typescript]
    scope: archive
    all:
      - id: npm-animatecss-tailwind-scoped-helper-template
      - id: signalledger-diagnostics-name-ioc
    unless:
      - id: npm-interview-tailwind-withdrawn-postcss-loader

  - id: codebase-utilites-advisory-listed-loader
    desc: Advisory-listed package runs withdrawn PostCSS helper
    crit: hostile
    conf: 0.99
    ref: https://github.com/advisories/GHSA-gx79-c2f6-mjvj
