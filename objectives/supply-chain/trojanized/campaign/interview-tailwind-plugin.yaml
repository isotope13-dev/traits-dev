# Known interview-lure helper coordinates plus actual build-plugin use.
# Arbitrary scopes, package names, comments and dev-only dependencies do not
# supply the runtime-loader evidence. See docs/triage/npm-good-2026-11-02.json.
defaults:
  platforms: [unix, windows]
  attack: T1195.002
composite_rules:
- id: npm-interview-tailwind-scoped-postcss-loader
  desc: Tailwind build loads known interview-lure PostCSS helper
  crit: hostile
  conf: 0.98
  for: [npm, tar, zip, package.json, javascript]
  scope: archive
  all:
  - id: metadata/import/npm/tailwindcss/plugin
  - id: metadata/package/dependencies/declaration::npm-interview-postcss-helper-dependency
  - id: micro-behaviors/data/format/css::postcss-plugin-factory-registration
  any:
  - id: metadata/import/npm/jasperquinn/postcss-motion-helpers
  - id: metadata/import/npm/aaron205whitmore/postcss-animate-utils
  - id: metadata/import/npm/codentra/postcss-kinetix
  - id: objectives/supply-chain/hidden-payload/staging/script::js-require-scoped-postcss-motion-helper
