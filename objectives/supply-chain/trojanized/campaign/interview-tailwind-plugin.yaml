  - id: framermotion-plugins-advisory-listed-loader
    desc: Advisory-listed package runs withdrawn PostCSS helper
    crit: hostile
    conf: 0.99
    ref: https://github.com/advisories/GHSA-cv72-p6wm-qm9j
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: npm-animatecss-tailwind-scoped-helper-template
      - id: framermotion-plugins-advisory-coordinate

  # The lure template plus a registry security hold on the helper release the
  # package declares. The hold alone is suspicious (the declaring package may be
  # a victim); the template ties the package to the interview campaign pattern.
  - id: interview-template-security-held-helper
    desc: Interview-lure template declares a security-held helper
    crit: hostile
    conf: 0.95
    # Registry sidecars sit outside the archive; correlate them at outer scope.
    for: [npm, tar, zip, package.json, javascript, typescript, registry]
    scope: outer
    all:
      - id: metadata/registry::registry-security-hold
      - id: npm-animatecss-tailwind-scoped-helper-template
