# Fake-interview Tailwind carriers (OSV MAL-2026-17665/17666/17667/18066/18067/
# 18071, MAL-2026-18734). A take-home repo's tailwind.config.js loads an
# Animate.css plugin whose src/motion.js requires a private scoped PostCSS
# helper and runs it through postcss() while the config loads; there is no
# install hook. The helper only resolves with the lure repo's .npmrc token and
# fetches and runs operator code (MAL-2026-17665). npm replaced the helpers and
# carriers with 0.0.1-security. The carrier bytes themselves contain no network
# code, so these rules claim only that the build runs the withdrawn helper; the
# payload's behavior is not observed here.
#
# Withdrawn coordinates are IOC legs, never matched by scope pattern alone: an
# ordinary scoped PostCSS plugin, a comment, a string, an unused import or a
# dev-only dependency does not supply them (scripts/review/test-npm-triage-good.py).
defaults:
  platforms: [unix, windows]
  attack: T1195.002

traits:
  - id: tailwindcss-pixel-tools-name-ioc
    desc: Package name is tailwindcss-pixel-tools
    crit: component
    attack: none
    for: [package.json]
    if:
      type: value
      path: name
      exact: tailwindcss-pixel-tools

  - id: tailwind-keyframe-utils-name-ioc
    desc: Package name is tailwind-keyframe-utils
    crit: component
    attack: none
    for: [package.json]
    if:
      type: value
      path: name
      exact: tailwind-keyframe-utils

  - id: fast-deep-thinking-name-ioc
    desc: Package name is fast-deep-thinking
    crit: component
    attack: none
    for: [package.json]
    if:
      type: value
      path: name
      exact: fast-deep-thinking

  - id: tailwind-kinetic-name-ioc
    desc: Malicious tailwind-kinetic package identity
    crit: hostile
    conf: 0.99
    attack: none
    for: [package.json]
    ref: https://github.com/advisories/GHSA-j2r4-xxhh-xx58
    if:
      type: value
      path: name
      exact: tailwind-kinetic

  - id: tailwind-base-buttons-name-ioc
    desc: Advisory-listed malicious npm package name
    crit: hostile
    ref: https://github.com/advisories/GHSA-5j43-343m-gggg
    attack: none
    for: [package.json]
    if:
      type: value
      path: name
      exact: tailwind-base-buttons

  # Threat-feed-listed copies of the same carrier template. The exact name is
  # an IOC leg; the archive must also contain the observed helper-loader shape.
  - id: tailwind-motion-css-name-ioc
    desc: Package name is tailwind-motion-css
    crit: component
    attack: none
    for: [package.json]
    if:
      type: value
      path: name
      exact: tailwind-motion-css

  - id: tailwindcss-animation-suite-name-ioc
    desc: Package name is tailwindcss-animation-suite
    crit: component
    attack: none
    for: [package.json]
    if:
      type: value
      path: name
      exact: tailwindcss-animation-suite

  - id: signalledger-bridge-name-ioc
    desc: Package name is signalledger-bridge
    crit: component
    attack: none
    for: [package.json]
    if:
      type: value
      path: name
      exact: signalledger-bridge

  - id: tailwind-animate-kit-name-ioc
    desc: Package name is tailwind-animate-kit
    crit: component
    attack: none
    ref: https://github.com/advisories/GHSA-w9j6-p46m-xvp4
    for: [package.json]
    if:
      type: value
      path: name
      exact: tailwind-animate-kit

  - id: tailwind-animate-test-name-ioc
    desc: Package name is tailwind-animate-test
    crit: component
    attack: none
    ref: https://github.com/advisories/GHSA-vpvh-94mq-8h4j
    for: [package.json]
    if:
      type: value
      path: name
      exact: tailwind-animate-test

  - id: tailwind-animate-kit-version-ioc
    desc: Package version is 2.0.6 through 2.0.8
    crit: component
    attack: none
    for: [package.json]
    if:
      type: value
      path: version
      regex: '^2\.0\.[6-8]$'

  # npm replaced flare-animate with a 0.0.1-security holder after 2.3.6 was
  # pulled; the carrier loads the unregistered @flareshare/flare-ui helper
  # from a Tailwind plugin config (Aikido-flagged).
  - id: flare-animate-name-ioc
    desc: Package name is flare-animate
    crit: component
    attack: none
    for: [package.json]
    if:
      type: value
      path: name
      exact: flare-animate

  - id: flare-animate-version-ioc
    desc: Package version is 2.3.6
    crit: component
    attack: none
    for: [package.json]
    if:
      type: value
      path: version
      exact: 2.3.6

  # Aikido-listed signalledger carrier versions reuse the same build-time
  # helper template while rotating the scoped helper package.
  - id: signalledger-diagnostics-name-ioc
    desc: Package name is signalledger-diagnostics
    crit: component
    attack: none
    for: [package.json]
    if:
      type: value
      path: name
      exact: signalledger-diagnostics

  # Advisory-listed carriers of the same build-time PostCSS helper template.
  # Keep the package coordinates as IOCs; the shared template is separate
  # evidence that the package actually invokes the withdrawn helper.
  - id: codebase-utilites-name-ioc
    desc: Package name is codebase-utilites
    crit: component
    attack: none
    for: [package.json]
    ref: https://github.com/advisories/GHSA-gx79-c2f6-mjvj
    if:
      type: value
      path: name
      exact: codebase-utilites

  - id: codebase-utilites-affected-version-ioc
    desc: Affected codebase-utilites release version
    crit: component
    attack: none
    for: [package.json]
    ref: https://github.com/advisories/GHSA-gx79-c2f6-mjvj
    if:
      type: value
      path: version
      regex: '^1\.0\.[12]$'

  - id: framermotion-plugins-name-ioc
    desc: Package name is framermotion-plugins
    crit: component
    attack: none
    for: [package.json]
    ref: https://github.com/advisories/GHSA-cv72-p6wm-qm9j
    if:
      type: value
      path: name
      exact: framermotion-plugins

composite_rules:
  - id: withdrawn-postcss-helper-factory-run
    desc: Runs scoped PostCSS helper factory in postcss
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/format/css::postcss-plugin-factory-registration
    any:
      - id: metadata/import/npm/jasperquinn/postcss-motion-helpers
      - id: metadata/import/npm/aaron205whitmore/postcss-animate-utils
      - id: metadata/import/npm/codentra/postcss-kinetix
      - id: metadata/import/package::require-postcss-signal-bridge

  # Manifest and module are separate members of one package, hence archive
  # scope; the runtime-dependency regexes exclude devDependencies.
  - id: npm-interview-tailwind-withdrawn-postcss-loader
    desc: Package build runs flagged interview-lure helper
    crit: hostile
    conf: 0.98
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: withdrawn-postcss-helper-factory-run
    any:
      - id: metadata/package/dependencies/declaration::npm-postcss-motion-helpers
      - id: metadata/package/dependencies/declaration::npm-postcss-animate-utils
      - id: metadata/package/dependencies/declaration::npm-postcss-kinetix
      - id: metadata/package/dependencies/declaration::npm-postcss-signal-bridge

  - id: tailwind-animate-kit-malicious-package
    desc: Advisory package runs a scoped PostCSS helper
    crit: hostile
    conf: 0.98
    ref: https://github.com/advisories/GHSA-w9j6-p46m-xvp4
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: npm-animatecss-tailwind-scoped-helper-template
      - id: tailwind-animate-kit-name-ioc

  - id: tailwind-animate-test-network-probe
    desc: Advisory-listed package runs Windows network probe
    crit: suspicious
    conf: 0.99
    ref: https://github.com/advisories/GHSA-vpvh-94mq-8h4j
    attack: T1016
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: tailwind-animate-test-name-ioc
      - id: micro-behaviors/network/interface/command::node-spawns-ipconfig-command

  - id: tailwind-animate-test-scoped-helper
    desc: Advisory package runs scoped PostCSS helper
    crit: hostile
    conf: 0.99
    ref: https://github.com/advisories/GHSA-vpvh-94mq-8h4j
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: tailwind-animate-test-name-ioc
      - id: micro-behaviors/data/format/css::scoped-motion-helper-build

  - id: npm-unipswap-animate-helper-loader
    desc: Runs private unipswap PostCSS helper
    crit: hostile
    conf: 0.98
    ref: https://github.com/advisories/GHSA-vh4f-84vw-hprv
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: npm-animatecss-tailwind-scoped-helper-template
      - id: metadata/package/dependencies/declaration::npm-postcss-animate-units

  # Additional malicious release imported the withdrawn helper directly,
  # without a dependency declaration. Keep this evidence path alongside the
  # manifest-declaration rule above.
  - id: npm-interview-tailwind-unipswap-postcss-loader
    desc: Runs Unipswap helper in interview Tailwind template
    crit: hostile
    conf: 0.98
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: micro-behaviors/data/format/css::scoped-motion-helper-build
      - id: metadata/import/npm/tailwindcss/plugin
      - id: metadata/package/dependencies/declaration::npm-animatecss-runtime-dependency
      - id: micro-behaviors/os/module/require::unipswap-postcss-animate-units

  # Twenty-six carriers under seventeen accounts reuse one template while the
  # helper scope rotates. The template build (toPostcssOptions/buildMotionBase
  # feeding a scoped helper factory into postcss) plus Animate.css and scoped
  # helper runtime dependencies warrants review even for an unlisted scope;
  # it does not establish that the new helper is malicious.
  - id: npm-animatecss-tailwind-scoped-helper-template
    desc: Animate.css Tailwind plugin uses interview-lure template
    crit: suspicious
    conf: 0.9
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: micro-behaviors/data/format/css::scoped-motion-helper-build
      - id: metadata/import/npm/tailwindcss/plugin
      - id: metadata/package/dependencies/declaration::npm-animatecss-runtime-dependency
      - id: metadata/package/dependencies/declaration::npm-scoped-runtime-dependency

  - id: codebase-utilites-advisory-coordinate
    desc: Advisory-listed codebase-utilites release
    crit: notable
    conf: 0.99
    ref: https://github.com/advisories/GHSA-gx79-c2f6-mjvj
    for: [npm, tar, zip, package.json]
    scope: archive
    all:
      - id: codebase-utilites-name-ioc
      - id: codebase-utilites-affected-version-ioc

  - id: framermotion-plugins-advisory-coordinate
    desc: Advisory-listed framermotion-plugins release
    crit: notable
    conf: 0.99
    ref: https://github.com/advisories/GHSA-cv72-p6wm-qm9j
    for: [npm, tar, zip, package.json]
    scope: archive
    all:
      - id: framermotion-plugins-name-ioc
      - id: objectives/supply-chain/impersonation/registry/publish/listed::vanzky-baileys-later-malware-version

  # Advisory-listed copies of the same carrier template. Package names are
  # used only as IOCs after the source and manifest prove the loader shape.
  - id: tailwind-keyframe-utils-loader
