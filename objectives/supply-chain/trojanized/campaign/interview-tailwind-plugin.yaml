# Fake-interview Tailwind carriers (OSV MAL-2026-17665/17666/17667/18066/18067/
# 18071, MAL-2026-18734). A take-home repo's tailwind.config.js loads an
# Animate.css plugin whose src/motion.js requires a private scoped PostCSS
# helper and runs it through postcss() while the config loads; there is no
# install hook. The helper only resolves with the lure repo's .npmrc token and
# fetches and runs operator code (MAL-2026-17665). npm replaced the helpers and
# carriers with 0.0.1-security. The carrier bytes themselves contain no network
# code, so these rules claim only that the build runs the withdrawn helper; the
# payload's behavior is not observed here.
#
# Withdrawn coordinates are IOC legs, never matched by scope pattern alone: an
# ordinary scoped PostCSS plugin, a comment, a string, an unused import or a
# dev-only dependency does not supply them (scripts/review/test-npm-triage-good.py).
defaults:
  platforms: [unix, windows]
  attack: T1195.002

composite_rules:
  - id: withdrawn-postcss-helper-factory-run
    desc: Runs withdrawn PostCSS helper factory in postcss
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/format/css::postcss-plugin-factory-registration
    any:
      - id: metadata/import/npm/jasperquinn/postcss-motion-helpers
      - id: metadata/import/npm/aaron205whitmore/postcss-animate-utils
      - id: metadata/import/npm/codentra/postcss-kinetix

  # Manifest and module are separate members of one package, hence archive
  # scope; the runtime-dependency regexes exclude devDependencies.
  - id: npm-interview-tailwind-withdrawn-postcss-loader
    desc: Package build runs withdrawn interview-lure helper
    crit: hostile
    conf: 0.98
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: withdrawn-postcss-helper-factory-run
    any:
      - id: metadata/package/dependencies/declaration::npm-postcss-motion-helpers
      - id: metadata/package/dependencies/declaration::npm-postcss-animate-utils
      - id: metadata/package/dependencies/declaration::npm-postcss-kinetix

  # Twenty-six carriers under seventeen accounts reuse one template while the
  # helper scope rotates. The template build (toPostcssOptions/buildMotionBase
  # feeding a scoped helper factory into postcss) plus Animate.css and scoped
  # helper runtime dependencies warrants review even for an unlisted scope;
  # it does not establish that the new helper is malicious.
  - id: npm-animatecss-tailwind-scoped-helper-template
    desc: Animate.css Tailwind plugin uses interview-lure template
    crit: suspicious
    conf: 0.9
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: micro-behaviors/data/format/css::scoped-motion-helper-build
      - id: metadata/import/npm/tailwindcss/plugin
      - id: metadata/package/dependencies/declaration::npm-animatecss-runtime-dependency
      - id: metadata/package/dependencies/declaration::npm-scoped-postcss-motion-animate-dependency
