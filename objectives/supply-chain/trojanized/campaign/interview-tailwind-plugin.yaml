# Interview-campaign Tailwind plugins that load a private scoped postcss helper.
defaults:
  platforms: [unix, windows]
  attack: T1195.002

traits:
  - id: jasperquinn-motion-helpers-dep
    desc: Declares jasperquinn motion helpers dep
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: dependencies.@jasperquinn/postcss-motion-helpers
      exists: true

  - id: aaron205whitmore-animate-utils-dep
    desc: Declares aaron205whitmore animate utils
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: dependencies.@aaron205whitmore/postcss-animate-utils
      exists: true

  - id: require-jasperquinn-motion-helpers
    desc: Requires jasperquinn motion helpers module
    crit: suspicious
    conf: 0.99
    for: [javascript]
    if:
      type: text
      substr: "@jasperquinn/postcss-motion-helpers"

  - id: require-aaron205whitmore-animate-utils
    desc: Requires aaron205whitmore animate utils
    for: [javascript]
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: "@aaron205whitmore/postcss-animate-utils"

  - id: tailwindcss-plugin-module-require
    desc: Requires tailwindcss/plugin module
    crit: notable
    conf: 0.95
    for: [javascript]
    if:
      type: text
      substr: require('tailwindcss/plugin')

composite_rules:
  - id: npm-interview-tailwind-scoped-postcss-loader
    desc: Interview Tailwind plugin private postcss loader
    crit: hostile
    conf: 0.98
    for: [npm, tar, zip, package.json, javascript]
    scope: archive
    all:
      - id: tailwindcss-plugin-module-require
    any:
      - id: jasperquinn-motion-helpers-dep
      - id: aaron205whitmore-animate-utils-dep
      - id: require-jasperquinn-motion-helpers
      - id: require-aaron205whitmore-animate-utils
