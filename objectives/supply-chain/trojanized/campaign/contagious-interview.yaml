# DPRK "Contagious Interview" Campaign Detection
# Composite patterns tying together the DPRK supply-chain-to-stealer kill chain
# Seen across OtterCookie, BeaverTail, and InvisibleFerret
# ATT&CK: T1195.002 (Supply Chain Compromise)
# Reference: Walmart Global Tech, NTT Security, Palo Alto Unit42
defaults:
  crit: hostile
  conf: 0.95
  platforms:
    - windows
    - unix
  for:
    - javascript
    - typescript
  attack: T1195.002
composite_rules:
  - id: npm-stealer-kill-chain
    desc: npm package with credential theft
    mbc: B0028
    scope: archive
    for: [package.json, javascript, typescript, npm, tar, shell, python]
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
      - id: objectives/supply-chain/install-hook/scripts/local-script::postinstall-hook-script-credential-theft-file
  - id: npm-ssh-backdoor-dropper
    desc: npm package has install hooks and hardcoded authorized-key writes
    crit: suspicious
    mbc: E1098
    attack: T1098.004
    scope: archive
    for: [package.json, javascript, typescript, npm, tar, shell]
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
    any:
      - id: micro-behaviors/communications/ssh/keys::hardcoded-authorized-key-write
  - id: dprk-interview-campaign
    desc: DPRK Contagious Interview pattern
    needs: 2
    any:
      - id: npm-stealer-kill-chain
      - id: npm-ssh-backdoor-dropper
      - id: objectives/command-and-control/infrastructure/domain/brand-impersonation::brand-impersonation-serverless
  - id: contagious-interview-animatecss-tailwind-carrier
    desc: Interview-lure Tailwind Animate.css npm carrier template
    crit: hostile
    conf: 0.97
    scope: archive
    for: [npm, package.json, javascript, typescript]
    mbc: B0024
    all:
      - id: objectives/supply-chain/trojanized/library/hidden-dep::animatecss-runtime-dependency
      - id: objectives/supply-chain/trojanized/library/hidden-dep::postcss-scoped-motion-helper-dependency
      - id: objectives/supply-chain/trojanized/library/hidden-dep::require-postcss-scoped-motion-helper
      - id: metadata/import/npm/tailwindcss/plugin
    any:
      - id: objectives/supply-chain/trojanized/library/hidden-dep::animatecss-tailwind-carrier-package-name
      - id: objectives/supply-chain/trojanized/library/hidden-dep::animatecss-tailwind-plugin-carrier-name
      - id: objectives/supply-chain/trojanized/library/hidden-dep::animate-twcss-carrier-package-name
