# Tea reward campaigns are a supply-chain abuse pattern rather than runtime
# malware: the published root is a reputation-farming wrapper around an
# unrelated application checkout. Keep the objective gated on the complete
# archive shape so a legitimate Tea manifest or a normal nested workspace does
# not become hostile by itself.
#
# Nested `private: true` app scaffolds are common in these campaigns, so do not
# exclude on archive-scoped `is-private`.
defaults:
  platforms: [unix, windows]
  for: [npm]
  attack: T1195.002

composite_rules:
  - id: tea-reward-nested-app-republication
    desc: Tea hollow npm wrapper republishes nested app
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: metadata/package/files/included::archive-nested-package-json-entry
      - id: metadata/package/files/nested::archive-nested-source-tree
      - id: metadata/package/files/nested::archive-nested-webapp-config
      - id: metadata/package/files/nested::archive-nested-lockfile
    any:
      - id: metadata/package/files/included::archive-tea-reward-manifest
      - id: metadata/package/files/included::archive-tea-reward-doc-comment
    unless:
      - id: metadata/package/manifest/workspace::has-workspaces
      - id: metadata/package/files/included::npm-runtime-code-member
      - id: metadata/package/files/included::npm-root-javascript-member
