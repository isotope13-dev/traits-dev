# SoftwareOK installer campaign (ASEC 96827, 2026-11): Q-Dir and DesktopOK
# setups from the official site were replaced with wrappers that embed the
# genuine, validly signed program, run it from C:\Users\Public so the user sees
# the expected app, and fetch 7zr.exe plus a Python agent package. Those
# fetches install a Run-key autostart under DeviceSync\b2. The rules name the
# campaign's staging coordinates as IOC legs. The generic behaviour (embedded
# dropper, WinHTTP stager) is in objectives/execution/payload/file-exec/detached/.
#
# Coordinates are UTF-16 resource strings in the wrapper PE, so each leg is
# matched as text across both encodings the extractor returns. Two of four
# coordinates are required, so one shared path cannot convict on its own.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1195.002,T1105

traits:
  - id: softwareok-rat-staging-host
    desc: Campaign staging host serves the agent package
    crit: notable
    attack: none
    if:
      type: text
      regex: 'https://(mail\.c1a2\.top|8\.210\.69\.51)/dl/'

  - id: softwareok-rat-agent-package
    desc: Campaign Python agent package name
    crit: notable
    attack: none
    if:
      type: text
      regex: '(dsv2|b2)_py39_agent\.7z'

  - id: softwareok-rat-install-directory
    desc: Campaign DeviceSync\b2 install directory
    crit: notable
    attack: none
    if:
      type: text
      substr: 'DeviceSync\b2'

  - id: softwareok-rat-scheduled-task-name
    desc: Campaign UPnp scheduled task name
    crit: notable
    attack: none
    if:
      type: text
      substr: 'MicrosoftEdge_dcntel'

composite_rules:
  # Two independent coordinates of the campaign's staging: host, package,
  # install directory, or the persistence task name.
  - id: softwareok-installer-rat-stager
    desc: SoftwareOK-campaign installer stages a Python RAT package
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1105,T1547.001
    any:
      - id: softwareok-rat-staging-host
      - id: softwareok-rat-agent-package
      - id: softwareok-rat-install-directory
      - id: softwareok-rat-scheduled-task-name
    needs: 2
