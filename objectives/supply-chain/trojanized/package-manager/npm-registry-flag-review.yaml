defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
composite_rules:

  - id: npm-shim-publish-registry-hijack
    desc: npm shim injects publish registry flag
    crit: suspicious
    conf: 0.98
    scope: archive
    attack: "T1195.002,T1557"
    all:
      - id: micro-behaviors/os/package-manager/registry::node-publish-login-registry-flag-override
      - id: metadata/package/entrypoint/command::bin-field-declared
    unless:
      - id: micro-behaviors/crypto/hash/file::verified-versioned-release-binary-installer

  - id: npm-postinstall-native-shim-publish-registry-hijack
    desc: npm postinstall native shim hijacks publish
    crit: hostile
    conf: 0.99
    scope: archive
    attack: "T1195.002,T1105,T1557"
    all:
      - id: npm-shim-publish-registry-hijack
      - id: objectives/execution/trigger/package/lifecycle::npm-postinstall-sha256-brotli-native-bootstrap
      - id: micro-behaviors/process/create/variable::spawn-variable-program
    unless:
      - id: micro-behaviors/crypto/hash/file::verified-versioned-release-binary-installer
