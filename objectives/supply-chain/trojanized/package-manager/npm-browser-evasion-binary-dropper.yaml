# A package marketed as bypassing bot protection installs its own patched
# browser executable from a remote endpoint during npm installation. The bypass
# claim is a description and only corroborates intent; the install hook plus the
# staged executable is the dropper shape. The claim trait lives with the other
# advertised anti-bot capabilities.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar, package.json]

composite_rules:
  - id: npm-bot-evasion-patched-browser-dropper
    desc: Install hook drops executable browser for bot evasion
    crit: hostile
    conf: 0.96
    scope: archive
    attack: T1195.002,T1105
    all:
      - id: objectives/evasion/security-bypass/anti-bot/advertised-capability::browser-bot-protection-bypass-claim
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/communications/http/download/write::node-response-stream-to-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
