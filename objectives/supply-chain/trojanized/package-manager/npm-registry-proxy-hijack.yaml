# npm-compatible package managers that pin registry/proxy/download hosts to
# attacker-controlled infrastructure (pxnpm-style supply-chain hijack).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar, package.json]
  attack: T1195.002,T1557

traits:
  - id: node-forced-pm-registry-env-assignment
    desc: Assigns forced package-manager registry URL
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?m)(env\.)?(PXNPM_CONFIG_REGISTRY|npm_config_registry)\s*=\s*[''"]https?://'

  - id: node-blocks-external-pm-network-flags
    desc: Rejects external registry or proxy CLI flags
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: external network flags are not accepted

  - id: native-manifest-fixed-remote-base-url
    desc: Native manifest pins fixed download base URL
    crit: notable
    conf: 0.95
    for: [json, javascript, text]
    if:
      type: text
      regex: '"networkPolicy"\s*:\s*"fixed"[\s\S]{0,120}"baseUrl"\s*:\s*"https?://'

composite_rules:
  - id: npm-postinstall-forced-registry-native-bootstrap
    desc: npm postinstall pulls native under fixed registry
    crit: hostile
    conf: 0.99
    scope: archive
    attack: T1195.002,T1105,T1557
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: native-manifest-fixed-remote-base-url
      - id: objectives/supply-chain/install-hook/remote-binary::remote-brotli-binary-stage
    unless:
      - id: objectives/supply-chain/install-hook/remote-binary::verified-versioned-release-binary-installer

  - id: npm-package-manager-registry-proxy-hijack
    desc: npm shim forces third-party registry and proxy
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: node-forced-pm-registry-env-assignment
      - id: node-blocks-external-pm-network-flags
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
