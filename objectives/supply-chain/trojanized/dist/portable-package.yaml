# A harmful implementation inside a language-package distribution is a
# trojanized release regardless of whether its randomized activation gate is
# recovered by static analysis.
defaults:
  platforms: [linux, macos, windows]
  attack: T1195.002

composite_rules:
  - id: harmful-language-package-distribution
    desc: Distribution carries harmful package implementation
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/supply-chain/trojanized/library/source::portable-harmful-package-behavior
      - id: metadata/file/extension/package::language-package-distribution-container
