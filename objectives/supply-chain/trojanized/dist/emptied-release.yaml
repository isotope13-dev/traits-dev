# A release that ships NO implementation at all. The manifest still declares a
# main entry point, so every dependent that upgrades resolves to a version
# whose entry file is not in the tarball and breaks on require(). faker 6.6.6
# was published this way; a hijacked maintainer account emptying a popular
# package produces the same artifact.
#
# Suspicious rather than hostile: a reserved-name placeholder looks alike, and
# nothing here executes.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip]
  attack: T1195.002

composite_rules:
  - id: release-ships-no-runtime-code
    desc: Release declares an entry point it omits
    crit: suspicious
    conf: 0.9
    scope: outer
    all:
      - id: metadata/package/manifest/entrypoint::npm-main-entrypoint-not-shipped
    # Absence of any shipped JavaScript, checked against the archive member
    # list directly: the two metadata traits that express this are scoped to
    # archive pseudo-types, and referencing them here drops the composite.
    # No shipped JavaScript anywhere in the tarball. Expressed with unless:
    # rather than a none: clause -- the composite schema has no none: field,
    # and a composite carrying one is dropped at load without an error.
    unless:
      - id: metadata/package/files/included::npm-runtime-code-member
      - id: metadata/package/files/included::npm-vendored-node-modules-runtime-member
      - id: metadata/package/files/included::npm-root-javascript-member
      - id: metadata/package/testing/
