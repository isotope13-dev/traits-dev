# A release that ships NO implementation at all. The manifest still declares a
# main entry point, so every dependent that upgrades resolves to a version
# whose entry file is not in the tarball and breaks on require(). faker 6.6.6
# was published this way; a hijacked maintainer account emptying a popular
# package produces the same artifact.
#
# Suspicious rather than hostile: a reserved-name placeholder looks alike, and
# nothing here executes.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip]
  attack: T1195.002

composite_rules:
  - id: release-ships-no-runtime-code
    desc: Release declares an entry point it omits
    crit: suspicious
    conf: 0.9
    scope: outer
    all:
      - id: metadata/package/manifest/entrypoint::npm-main-entrypoint-not-shipped
    # Absence of any shipped JavaScript, checked against the archive member
    # list directly: the two metadata traits that express this are scoped to
    # archive pseudo-types, and referencing them here drops the composite.
    # No shipped JavaScript anywhere in the tarball. Expressed with unless:
    # rather than a none: clause -- the composite schema has no none: field,
    # and a composite carrying one is dropped at load without an error.
    unless:
      - id: metadata/package/files/included::npm-runtime-code-member
      - id: metadata/package/files/included::npm-vendored-node-modules-runtime-member
      - id: metadata/package/files/included::npm-root-javascript-member
      - id: metadata/package/testing/
      # npm's own registry-maintained placeholder for a formerly- or never-
      # published name (e.g. fs@0.0.1-security): the entry point it declares
      # was never shipped by design, not sabotaged out of a real release.
      - id: metadata/package/manifest/freeform::npm-security-holder-package

  # What separates a sabotaged release from the placeholder the rule above is
  # careful not to convict: a placeholder never had an implementation, so it
  # has no project around it either. faker 6.6.6 kept the entire apparatus of
  # a real, long-running project -- the repository link, the wildcard
  # devDependencies, the lint and CI configuration, the git hooks -- and
  # dropped only the code those things exist to serve. A maintainer emptying
  # their own package, and an attacker emptying a hijacked one, both leave
  # exactly that asymmetry behind.
  #
  # Requiring the repository link plus two further development signals keeps a
  # bare name reservation out: such a package publishes a manifest and little
  # else, and cannot reach two.
  - id: established-package-shipped-empty
    desc: Established package ships no code
    crit: hostile
    conf: 0.93
    scope: outer
    all:
      - id: release-ships-no-runtime-code
      - id: metadata/package/manifest/repository::has-repository-field
    needs: 2
    any:
      - id: metadata/package/scripts/develop::has-git-hooks
      - id: metadata/package/dependencies/manifest::npm-wildcard-devdependency
      - id: metadata/package/documentation/package-metadata::references-readme
      - id: metadata/package/manifest/repository::has-repository-url
    unless:
      - id: metadata/package/testing/
