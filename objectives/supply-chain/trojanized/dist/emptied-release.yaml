# A release that ships NO implementation at all. The manifest still declares a
# main entry point, so every dependent that upgrades resolves to a version
# whose entry file is not in the tarball and breaks on require(). faker 6.6.6
# was published this way; a hijacked maintainer account emptying a popular
# package produces the same artifact.
#
# Both rules below restate the entry-point-absence legs of
# metadata/package/files/missing-entrypoint::npm-main-entrypoint-not-shipped
# rather than referencing it, and the hostile rule restates the suspicious
# one's legs for the same reason: a composite that names another composite in
# its all:/any: never resolves during a scan, so a chained rule is silently
# dead even though `cleave test-rules` (which replays a finished finding set)
# reports it as matching. Keep every leg here an atomic trait.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip]
  attack: T1195.002

composite_rules:
  - id: release-ships-no-runtime-code
    for: [npm, tar, zip, package.json, markdown]
    desc: Release declares an entry point it omits
    crit: suspicious
    conf: 0.9
    scope: outer
    all:
      # Entry point declared in the manifest...
      - id: metadata/package/entrypoint::main-root-javascript-entry
      - id: metadata/package/files/included::npm-publish-root-manifest
      # ...and the archive member index is what proves it absent, so require
      # the container-scope anchor: at member or bare-manifest scope the
      # member-list unless: legs below can never match and the rule would
      # false-fire on packages that do ship their entry point.
      - id: metadata/package/files/included::npm-package-manifest-member
    # Absence of any shipped JavaScript, checked against the archive member
    # list directly. Expressed with unless: rather than a none: clause -- the
    # composite schema has no none: field, and a composite carrying one is
    # dropped at load without an error.
    unless:
      - id: metadata/package/files/included::npm-root-javascript-member
      - id: metadata/package/files/included::npm-runtime-code-member
      - id: metadata/package/files/included::npm-vendored-node-modules-runtime-member
      # Packages providing CLI commands declare their entry point in bin, not main.
      - id: metadata/package/entrypoint::bin-field-declared
      - id: metadata/package/testing/
      # cleave reports compressed npm wrappers as parse errors until their gzip
      # layer is expanded. That is not evidence the declared main file is
      # absent, so do not infer absence from an unavailable member index.
      - id: metadata/file/archive::npm-compressed-wrapper-parse-error
      # npm's own registry-maintained placeholder for a formerly- or never-
      # published name (e.g. fs@0.0.1-security): the entry point it declares
      # was never shipped by design, not sabotaged out of a real release.
      - id: metadata/package/freeform::npm-security-holder-package
      # Disclosed dependency-confusion PoCs that only console.log on install
      # prove resolution without shipping payload bytes.
      - id: metadata/package/description/disclosure::disclosed-depconf-console-poc-context
    # A README that opens a code fence with an import is a library documenting
    # its API. An omitted entry point next to that is a publish mistake.
    downgrade:
      scope: archive
      any:
        - id: metadata/package/documentation/package-metadata::readme-code-fence-opens-with-import

  # What separates a sabotaged release from the placeholder the rule above is
  # careful not to convict: a placeholder never had an implementation, so it
  # has no project around it either. faker 6.6.6 kept the entire apparatus of
  # a real, long-running project -- the repository link, the wildcard
  # devDependencies, the lint and CI configuration, the git hooks -- and
  # dropped only the code those things exist to serve. A maintainer emptying
  # their own package, and an attacker emptying a hijacked one, both leave
  # exactly that asymmetry behind.
  #
  # Requiring the repository link plus two further development signals keeps a
  # bare name reservation out: such a package publishes a manifest and little
  # else, and cannot reach two.
  - id: established-package-shipped-empty
    for: [npm, tar, zip, package.json]
    desc: Established package ships no code
    crit: hostile
    conf: 0.93
    scope: outer
    all:
      - id: metadata/package/entrypoint::main-root-javascript-entry
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: metadata/package/files/included::npm-package-manifest-member
      - id: metadata/package/repository::has-repository-field
    needs: 2
    any:
      - id: metadata/package/scripts/develop::has-git-hooks
      - id: metadata/package/dependencies/manifest/range::npm-wildcard-devdependency
      - id: metadata/package/documentation/package-metadata::references-readme
      - id: metadata/package/repository::has-repository-url
    unless:
      - id: metadata/package/files/included::npm-root-javascript-member
      - id: metadata/package/entrypoint::npm-root-javascript-source-member
      - id: metadata/package/files/included::npm-runtime-code-member
      - id: metadata/package/files/included::npm-vendored-node-modules-runtime-member
      - id: metadata/package/entrypoint::bin-field-declared
      - id: metadata/package/testing/
      - id: metadata/file/archive::npm-compressed-wrapper-parse-error
      - id: metadata/package/freeform::npm-security-holder-package
