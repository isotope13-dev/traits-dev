# Bundler output (tsup, esbuild, rollup) ends at its module export. Here the
# export line is followed by hundreds of blanks and then more code on the same
# line, pushed past the right edge of any editor or diff view: code appended
# to a built artifact after the fact and hidden from casual review.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1027

traits:
  - id: module-export-whitespace-padded-tail
    desc: Code hidden after padded module export
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(export\s*\{[^}]{1,200}\}|module\.exports\s*=[^;\n]{1,120});?[ \t]{64}'

composite_rules:
  - id: built-module-padded-obfuscated-appendix
    desc: Obfuscated code appended after module export
    crit: hostile
    conf: 0.95
    all:
      - id: module-export-whitespace-padded-tail
      - id: metadata/file/line::long-inline-whitespace-run
      - id: objectives/anti-static/obfuscation
