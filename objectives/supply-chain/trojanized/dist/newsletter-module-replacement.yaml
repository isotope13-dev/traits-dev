# Bind the replacement source to a file write, then require the embedded
# socket-factory graft that silently spends the user's account on a channel.
# An ordinary patcher, documented follow API, and unpersisted example lack
# one or more of these roles. No install-hook invocation is inferred.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: javascript-module-replacement-silent-channel-follow
    desc: Module replacement with silent channel follow
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/write/file/target::node-writes-newsletter-timer-module
      - id: micro-behaviors/fs/path/construct::dependency-library-javascript-path
      - id: objectives/impact/ui/manipulation/social::factory-timer-silent-newsletter-follow
