# A shipped artifact that advertises proof-of-concept authorship was not
# assembled from the source the release publishes: tostpro@112.5.9 opens
# dist/index.js with console.log("poc by abbishal") while the shipped src/
# opens with a different message and contains no such line. The tag is the
# deception signal; an honest PoC published as a PoC does not ship it inside
# a production-language library bundle.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1195.002
traits:
# The \A anchor plus the log-call form keeps prose mentions ("contact our
# PoC") and comments out; only a bundle whose first executable statement is
# the tag matches. The author token is generic, so the trait follows the
# tagging pattern rather than one campaign string.
- id: shipped-bundle-opens-with-poc-tag
  desc: Shipped bundle opens with PoC authorship log
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: '(?i)\A\s*console\s*\.\s*log\s*\(\s*["'']poc\s+by\s+[A-Za-z0-9_.-]{2,40}'
