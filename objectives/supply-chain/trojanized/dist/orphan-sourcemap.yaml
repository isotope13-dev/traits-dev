# A compiled dist artifact whose source map cites a TypeScript file under
# package/src/ that the archive does not ship. Legitimate releases either
# include the cited source or omit the map; injecting code only into dist while
# leaving a fabricated provenance trail is a common supply-chain tamper shape.
defaults:
  platforms: [unix, windows]
  attack: T1195.002
  for: [npm, tar, zip, javascript, data, json]

traits:
  - id: sourcemap-cites-single-parent-src-typescript
    desc: Source map lists one parent src TypeScript
    crit: notable
    conf: 0.92
    for: [data, json, javascript]
    if:
      type: text
      regex: '"sources"\s*:\s*\["\.\./\.\./src/[a-z0-9._-]+\.ts"\]'

composite_rules:
  - id: dist-sourcemap-typescript-provenance-gap
    desc: Dist source map cites unpackaged TypeScript
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: metadata/package/files/nested::archive-nested-source-tree
      - id: metadata/package/files/runtime::javascript-dist-tree-artifact
      - id: sourcemap-cites-single-parent-src-typescript
      - id: metadata/file/format/structured::sourcemap-typescript-sources

  - id: npm-fresh-dist-sourcemap-provenance-injection
    desc: Fresh npm dist cites absent TypeScript provenance
    crit: hostile
    conf: 0.95
    scope: outer
    for: [npm, tar, zip, registry, javascript, data, json]
    all:
      - id: metadata/registry::freshly-published
      - id: dist-sourcemap-typescript-provenance-gap
