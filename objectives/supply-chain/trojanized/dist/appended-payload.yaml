defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1195.002
  mbc: B0032
composite_rules:
- id: diff-cicd-decoded-remote-secret-stager
  desc: Diff adds decoded remote CI secret stager
  crit: hostile
  conf: 0.99
  for:
  - text
  attack: T1195.002,T1059.004,T1041
  near_bytes: 1200
  all:
  - id: micro-behaviors/data/decode/command::base64-decode-to-file
  - id: micro-behaviors/data/decode/base64::base64-decode-command
  - id: micro-behaviors/communications/http/curl::curl-command-remote-url
  unless:
  - id: metadata/package/testing/corpus::instruction-response-training-records
- id: bundled-artifact-appended-payload
  desc: Bundler output with appended obfuscated line
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/build/bundler/asset::js-known-bundler-output
  - id: metadata/file/line::single-long-line-outlier
  - id: metadata/file/line::last-line-over-1000
  - id: metadata/file/line::file-has-30-plus-lines
  any:
  - id: metadata/lang/source/declaration::hex-identifier-declarations
  - id: micro-behaviors/metaprogramming/generation::js-new-function-constructor
  - id: micro-behaviors/data/decode/base64::buffer-from-base64
  needs: 1
  unless:
  - id: metadata/package/testing/
  - id: micro-behaviors/communications/url/scheme::javascript-data-url-text
  - id: metadata/build/bundler/runtime::ncc-runtime-loader-identifier
  - id: metadata/lang/encoding/unicode-escape::unicode-escape-unicode-escape-js-basename
  - id: metadata/build/bundler/javascript-bundle-markers::js-multi-line-blob-recognized-text
  - id: metadata/path::test-directory-component
- id: bundle-charcode-remote-script-injector
  desc: Bundle reconstructs and injects remote script
  crit: hostile
  conf: 0.95
  attack: T1195.002,T1059.007,T1105
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/url/encoded::javascript-charcode-http-scheme
  - id: micro-behaviors/ui/window/dom/create::document-head-append
  - id: micro-behaviors/ui/window/insert-html::browser-create-script-element
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: bundle-tail-helper-remote-script-loader
  desc: Bundle tail helper loads a remote script
  crit: hostile
  conf: 0.97
  attack: T1195.002,T1105,T1059.007
  for: [javascript]
  all:
  - id: micro-behaviors/data/collection/dom::bundle-tail-script-source-and-append
  - id: micro-behaviors/communications/url/host/domain-http::js-script-url-function-call-in-file-tail
  near_bytes: 512
- id: bundled-action-silent-decoded-stager
  desc: Bundled action silently runs decoded stager
  crit: hostile
  conf: 0.96
  attack: T1195.002,T1059.004,T1041
  near_bytes: 1024
  all:
  - id: micro-behaviors/process/create/shell/bridge::silent-getexecoutput-text
  - id: objectives/anti-static/obfuscation/encoding/base64::base64-decode-redirect-exec
