defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1195.002
  mbc: B0032
composite_rules:
- id: diff-cicd-decoded-remote-secret-stager
  desc: Diff adds decoded remote CI secret stager
  crit: hostile
  conf: 0.99
  for:
  - text
  attack: T1195.002,T1059.004,T1041
  near_bytes: 1200
  all:
  - id: micro-behaviors/data/decode/command::base64-decode-to-file
  - id: micro-behaviors/data/decode/base64::base64-d-cmd
  - id: micro-behaviors/communications/http/curl::curl-command-remote-url
- id: bundled-artifact-appended-payload
  desc: Bundler output with appended obfuscated line
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/build/bundler/asset::js-known-bundler-output
  - id: metadata/file/line::single-long-line-outlier
  - id: metadata/file/line::last-line-over-1000
  - id: metadata/file/line::file-has-30-plus-lines
  any:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling
  - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-constructor
  - id: micro-behaviors/data/decode/base64::buffer-from-base64
  needs: 1
  unless:
  - id: metadata/package/testing/
  - id: micro-behaviors/process/create/load/script::inline-percent-encoded-script-resource
  - id: metadata/build/bundler/runtime::ncc-runtime-loader-identifier
  - id: metadata/lang/encoded/unicode-escape::unicode-escape-js-basename
  - id: metadata/build/bundler/javascript-bundle-markers::js-multi-line-blob-recognized-text
- id: source-map-line-appended-encrypted-payload
  desc: Encrypted obfuscator payload appended to source map line
  crit: hostile
  conf: 0.96
  attack: T1195.002,T1027.002
  all:
  - id: metadata/build/bundler/asset::content-after-source-map-on-same-line
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
  - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-implementation
  unless:
  - id: metadata/package/testing/
- id: vscode-source-map-appended-profile-beacon
  desc: VS Code bundle appends a persistent host-profile POST after its source map
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1041,T1082
  scope: file
  all:
  - id: well-known/lib/development/vscode::vscode-extension-marker
  - id: metadata/build/bundler/asset::executable-code-after-source-map
  - id: metadata/import/builtin::require-http
  - id: metadata/import/builtin::require-https
  - id: micro-behaviors/process/user/query::node-os-alias-homedir-call
  - id: micro-behaviors/fs/write/file/full::node-write-file-sync
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
  - id: micro-behaviors/data/serialize/schema-object::identity-platform-json-payload
- id: bundle-tail-remote-script-injector
  desc: Built bundle ends with a remote script injector
  crit: hostile
  conf: 0.95
  attack: T1195.002,T1059.007
  all:
  - id: micro-behaviors/communications/http/url/domain::js-http-url-literal-in-file-tail
  - id: micro-behaviors/process/create/load/remote-code::js-dom-script-src-set-in-file-tail
  - id: micro-behaviors/ui/window/dom/create::document-head-append
  any:
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: metadata/build/minifier::js-webpack-bundle-minified
  - id: metadata/build/minifier::js-webpack-minified-module-call
  - id: metadata/build/minifier::js-umd-wrapper-minified
  - id: metadata/build/minifier::js-umd-wrapper-amd-minified
  needs: 1
  unless:
  - id: metadata/package/testing/
  - id: well-known/app/publishing/wordpress-plugins/commerce::event-tickets-plugin-path
  - id: metadata/build/bundler/asset::google-tag-manager-bundle
- id: bundle-charcode-remote-script-injector
  desc: Bundle reconstructs and injects remote script
  crit: hostile
  conf: 0.95
  attack: T1195.002,T1059.007,T1105
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/url/encoded::javascript-charcode-http-scheme
  - id: micro-behaviors/ui/window/dom/create::document-head-append
  - id: micro-behaviors/ui/window/insert-html::browser-create-script-element
  unless:
  - id: metadata/package/testing/
- id: bundled-action-silent-decoded-stager
  desc: Bundled action silently runs decoded stager
  crit: hostile
  conf: 0.96
  attack: T1195.002,T1059.004,T1041
  near_bytes: 1024
  all:
  - id: micro-behaviors/process/create/shell/bridge::silent-getexecoutput-text
  - id: objectives/anti-static/obfuscation/encoding/base64::base64-decode-redirect-exec
