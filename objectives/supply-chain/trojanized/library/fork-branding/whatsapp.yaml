# A republished library fork that spends the consumer's session on the
# forker's own promotion.
#
# The npm registry carries dozens of `@<handle>/baileys` packages. Most are
# the upstream tree with a banner added; a share of them also add a few lines
# that only benefit whoever published the fork. Two moves recur:
#
#   * `newsletterFollow("<literal>@newsletter")` on the socket's connect path,
#     so every bot that installs the fork silently subscribes its owner's real
#     WhatsApp account to one channel. The account holder never asked, and the
#     follow is indistinguishable from one they made themselves.
#   * a literal `newsletterJid` in the outgoing-media context, so WhatsApp
#     renders the forker's channel as the attribution on messages the bot's
#     owner sends to their own contacts.
#
# Neither is a bug and neither is disclosed in the README, which advertises
# the package as a maintained fork. This is the supply-chain framing of the
# same evidence `objectives/impact/ui/manipulation/core/whatsapp-channel.yaml`
# reads as session manipulation: there the question is what happens to the
# account, here it is that a dependency did it to a downstream consumer.
#
# `scope: archive` — the library identity, the follow, and the attribution sit
# in three different files of the published tarball.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript, npm, archives]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: whatsapp-library-fork-operator-channel-injection
    desc: Fork injects the forker's WhatsApp channel
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
    any:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-hardcoded-jid
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-attribution-jid-literal
    needs: 2

  # Either move alone in a fork is already worth a triager's attention: the
  # upstream library hardcodes no channel anywhere.
  - id: whatsapp-library-fork-hardcoded-channel
    desc: WhatsApp library fork hardcodes a channel JID
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
    any:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-hardcoded-jid
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-attribution-jid-literal
