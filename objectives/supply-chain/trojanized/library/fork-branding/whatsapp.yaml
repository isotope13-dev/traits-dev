# A republished library fork that spends the consumer's session on the
# forker's own promotion.
#
# The npm registry carries dozens of `@<handle>/baileys` packages. Most are
# the upstream tree with a banner added; a share of them also add a few lines
# that only benefit whoever published the fork. Two moves recur:
#
#   * `newsletterFollow("<literal>@newsletter")` on the socket's connect path,
#     so every bot that installs the fork silently subscribes its owner's real
#     WhatsApp account to one channel. The account holder never asked, and the
#     follow is indistinguishable from one they made themselves.
#   * a literal `newsletterJid` in the outgoing-media context, so WhatsApp
#     renders the forker's channel as the attribution on messages the bot's
#     owner sends to their own contacts.
#
# Neither is a bug and neither is disclosed in the README, which advertises
# the package as a maintained fork. This is the supply-chain framing of the
# same evidence `objectives/impact/ui/manipulation/social/whatsapp-channel.yaml`
# reads as session manipulation: there the question is what happens to the
# account, here it is that a dependency did it to a downstream consumer.
#
# `scope: archive` — the library identity, the follow, and the attribution sit
# in three different files of the published tarball.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript, npm, tar, zip]
  attack: T1195.002

composite_rules:
  # A channel literal plus library identity does not establish trojanization.
  # The neutral channel traits preserve it without a second verdict.

  - id: whatsapp-library-fork-default-auto-follow-channel-bundle
    desc: Baileys fork violates follow opt-in claims
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::archive-session-open-whatsapp-newsletter-follow

  - id: whatsapp-library-fork-login-invite-channel-follow
    desc: Baileys fork follows channel after login success
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::archive-wa-login-success-delayed-invite-channel-follow

  # The file-local login-success hardcoded-follow composite catches the
  # injected socket module; this archive leg ties it back to a republished
  # Baileys dependency. Covers forks whose follow uses hand-rolled w:mex
  # and newsletter-IQ stanzas instead of the helper calls the invite-based
  # composites key on.
  - id: whatsapp-library-fork-login-success-hardcoded-follow
    desc: Baileys fork follows hardcoded channel on login
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::login-success-hardcoded-newsletter-follow

  # Remote channel lists moved off disk still perform the same connect-time
  # follow; the file-local hostile composite catches the injected socket module,
  # this archive leg ties it back to a republished Baileys dependency.
  - id: whatsapp-library-fork-remote-newsletter-auto-follow
    desc: Baileys fork auto-follows remotely listed channels
    crit: hostile
    conf: 0.99
    scope: archive
    # Only remote-driven follows qualify: the fixed-default follow composite
    # also establishes no remotely supplied target, so it cannot pass here.
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
    any:
      - id: objectives/impact/ui/manipulation/social::connect-delayed-remote-wmex-newsletter-follow
      - id: objectives/impact/ui/manipulation/social::remote-config-driven-raw-whatsapp-newsletter-follow
    needs: 1
    near_bytes: 16000

  # Upstream Baileys writes every message URL it sets as a plain literal. A
  # fork that rebuilds an outgoing message's `sourceUrl` from character codes
  # is hiding where its messages point from anyone reading the dependency
  # they installed — the same spend-the-consumer's-session move as the channel
  # injection above, with the destination concealed instead of the trigger.
  - id: whatsapp-library-fork-hidden-source-url
    desc: Fork hides outgoing message source URL in character codes
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: micro-behaviors/communications/messaging/channel::whatsapp-obfuscated-media-source-url

  - id: whatsapp-library-fork-delayed-obfuscated-follow
    desc: Baileys fork runs delayed obfuscated channel follow
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::delayed-xor-base64-whatsapp-newsletter-follow

  - id: whatsapp-library-fork-delayed-base64-wmex-follow
    desc: Baileys fork defers Base64-hidden w:mex channel follow
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::delayed-base64-hidden-whatsapp-newsletter-follow

  - id: whatsapp-library-fork-remote-list-raw-follow
    desc: Baileys fork follows remotely fetched channel list
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::remote-config-driven-raw-whatsapp-newsletter-follow

  - id: whatsapp-library-fork-connect-follow-and-mute
    desc: Baileys fork follows and mutes channel on connect
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::connect-time-whatsapp-newsletter-follow-and-mute

  - id: whatsapp-library-fork-phantom-sub-connect-auto-follow
    # The any: legs cover both target shapings: a hardcoded
    # DEFAULT_AUTO_FOLLOW_NEWSLETTER_JID (@fer2809fl/baileys 7.0.6) or a
    # remotely fetched GitHub channel list. The desc names the disjunction;
    # "remote" alone mis-describes the hardcoded-default matches.
    desc: Baileys fork auto-follows preset or fetched newsletter
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: micro-behaviors/communications/messaging/channel::whatsapp-wmex-newsletter-query
      - id: micro-behaviors/communications/messaging/channel::whatsapp-trigger-auto-follow-on-connect
      - id: micro-behaviors/communications/http/request/json::fetch-variable-near-json-response
    any:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-default-auto-follow-newsletter-jid
      - id: micro-behaviors/communications/messaging/channel::whatsapp-auto-follow-remote-github-list

  - id: whatsapp-library-fork-preset-connect-auto-follow
    desc: Baileys fork auto-follows preset channel on connect
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::connect-delayed-preset-wmex-newsletter-follow

  - id: whatsapp-library-fork-archive-delayed-channel-follow
    desc: Baileys fork runs delayed hardcoded channel follow
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::delayed-whatsapp-newsletter-follow

  - id: whatsapp-library-fork-connect-delayed-wmex-follow
    desc: Baileys fork runs open-triggered WMex channel follow
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::connect-delayed-wmex-follow-hardcoded-channel

  - id: npm-hollow-baileys-name-install-redirect
    for: [npm, tar, zip, package.json]
    desc: Hollow baileys-named package redirects install
    crit: hostile
    conf: 0.96
    scope: outer
    all:
      - id: metadata/package/files/missing-entrypoint::npm-main-entrypoint-not-shipped
      - id: metadata/package/dependencies/manifest/count::npm-single-runtime-dependency
      - id: metadata/package/name/vocabulary::npm-baileys-name-segment
    unless:
      - id: metadata/package/dependencies/manifest/count::npm-many-dev-dependencies

  # The archive framing of the socket-open follow above: a republished Baileys
  # tree whose socket module auto-follows a hardcoded channel once the
  # WebSocket opens. The library identity plus the file-local hostile follow
  # is what says "a Baileys fork did this to its consumers".
  - id: whatsapp-library-fork-connect-raw-channel-follow
    desc: Baileys fork auto-follows channel on socket open
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::ws-open-raw-whatsapp-newsletter-follow
