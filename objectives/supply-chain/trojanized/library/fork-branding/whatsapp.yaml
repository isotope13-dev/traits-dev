# A republished library fork that spends the consumer's session on the
# forker's own promotion.
#
# The npm registry carries dozens of `@<handle>/baileys` packages. Most are
# the upstream tree with a banner added; a share of them also add a few lines
# that only benefit whoever published the fork. Two moves recur:
#
#   * `newsletterFollow("<literal>@newsletter")` on the socket's connect path,
#     so every bot that installs the fork silently subscribes its owner's real
#     WhatsApp account to one channel. The account holder never asked, and the
#     follow is indistinguishable from one they made themselves.
#   * a literal `newsletterJid` in the outgoing-media context, so WhatsApp
#     renders the forker's channel as the attribution on messages the bot's
#     owner sends to their own contacts.
#
# Neither is a bug and neither is disclosed in the README, which advertises
# the package as a maintained fork. This is the supply-chain framing of the
# same evidence `objectives/impact/ui/manipulation/social/whatsapp-channel.yaml`
# reads as session manipulation: there the question is what happens to the
# account, here it is that a dependency did it to a downstream consumer.
#
# `scope: archive` — the library identity, the follow, and the attribution sit
# in three different files of the published tarball.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript, npm, tar, zip]
  attack: T1195.002

composite_rules:
  - id: whatsapp-library-fork-repeating-preset-newsletter-follow
    desc: Baileys fork repeatedly follows preset channel on connect
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::connect-time-repeating-preset-newsletter-follow

  # The consumer installs the shim, but the behaviour lives in a scoped fork
  # pulled in as a dependency, so the shim's own tarball shows none of it.
  # A re-export with no WAProto tree of its own is the laundering shape; it is
  # suspicious rather than hostile because honest alias wrappers exist.
  - id: whatsapp-library-reexport-shim-over-scoped-fork
    desc: Baileys shim re-exports a scoped fork
    crit: suspicious
    conf: 0.85
    scope: archive
    all:
      - id: well-known/lib/network/baileys::scoped-baileys-fork-reexport
    unless:
      - id: well-known/lib/network/baileys::baileys-library-identity

  # A channel literal plus library identity does not establish trojanization.
  # The neutral channel traits preserve it without a second verdict.

  - id: whatsapp-library-fork-default-auto-follow-channel-bundle
    desc: Baileys fork violates follow opt-in claims
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::archive-session-open-whatsapp-newsletter-follow

  - id: whatsapp-library-fork-login-invite-channel-follow
    desc: Baileys fork follows channel after login success
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::archive-wa-login-success-delayed-invite-channel-follow

  # The file-local login-success hardcoded-follow composite catches the
  # injected socket module; this archive leg ties it back to a republished
  # Baileys dependency. Covers forks whose follow uses hand-rolled w:mex
  # and newsletter-IQ stanzas instead of the helper calls the invite-based
  # composites key on.
  - id: whatsapp-library-fork-login-success-hardcoded-follow
    desc: Baileys fork follows hardcoded channel on login
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::login-success-hardcoded-newsletter-follow

  # The helper-call sibling of the composite above: the fork's socket module
  # follows a hardcoded channel from the CB:success handler through the
  # imported executeWMexQuery / QueryIds.FOLLOW helper instead of hand-rolled
  # stanzas, so neither the raw-w:mex leg nor the invite-resolution leg of
  # the sibling login-success composites sees it. The library identity plus
  # the file-local follow is what says "a Baileys fork did this to its
  # consumers". Worked example: @zanta/baileys 1.0.0 lib/Socket/socket.js.
  - id: whatsapp-library-fork-login-success-helper-channel-follow
    desc: Baileys fork follows hardcoded channel on login via helper
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::login-success-hardcoded-helper-channel-follow

  # Remote channel lists moved off disk still perform the same connect-time
  # follow; the file-local hostile composite catches the injected socket module,
  # this archive leg ties it back to a republished Baileys dependency.
  - id: whatsapp-library-fork-remote-newsletter-auto-follow
    desc: Baileys fork auto-follows remotely listed channels
    crit: hostile
    conf: 0.99
    scope: archive
    # Only remote-driven follows qualify: the fixed-default follow composite
    # also establishes no remotely supplied target, so it cannot pass here.
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
    any:
      - id: objectives/impact/ui/manipulation/social::connect-delayed-remote-wmex-newsletter-follow
      - id: objectives/impact/ui/manipulation/social::remote-config-driven-raw-whatsapp-newsletter-follow
      - id: objectives/impact/ui/manipulation/social::connect-delayed-aliased-fetch-wmex-newsletter-follow
    needs: 1
    near_bytes: 16000

  # Upstream Baileys writes every message URL it sets as a plain literal. A
  # fork that rebuilds an outgoing message's `sourceUrl` from character codes
  # is hiding where its messages point from anyone reading the dependency
  # they installed — the same spend-the-consumer's-session move as the channel
  # injection above, with the destination concealed instead of the trigger.
  - id: whatsapp-library-fork-hidden-source-url
    desc: Fork hides outgoing message source URL in character codes
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: micro-behaviors/communications/messaging/channel::whatsapp-obfuscated-media-source-url

  - id: whatsapp-library-fork-delayed-obfuscated-follow
    desc: Baileys fork runs delayed obfuscated channel follow
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::delayed-xor-base64-whatsapp-newsletter-follow

  - id: whatsapp-library-fork-connect-open-base64-follow
    desc: Baileys fork follows Base64-hidden channel on connect
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::connect-open-base64-hidden-newsletter-follow

  - id: whatsapp-library-fork-delayed-base64-wmex-follow
    desc: Baileys fork defers Base64-hidden w:mex channel follow
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::delayed-base64-hidden-whatsapp-newsletter-follow
    # Pure archive restatement of the follow composite above: same graft,
    # same evidence, plus library identity. Step down when it fires so one
    # follow block is not convicted twice.
    downgrade:
      any:
        - id: objectives/impact/ui/manipulation/social::delayed-base64-hidden-whatsapp-newsletter-follow

  - id: whatsapp-library-fork-remote-list-raw-follow
    desc: Baileys fork follows remotely fetched channel list
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::remote-config-driven-raw-whatsapp-newsletter-follow

  - id: whatsapp-library-fork-connect-follow-and-mute
    desc: Baileys fork follows and mutes channel on connect
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::connect-time-whatsapp-newsletter-follow-and-mute

  # The supply-chain framing of the concealed session-open follow-and-mute:
  # the channel ids and the newsletterFollow / newsletterMute method names
  # never appear on disk (decimal character-code arrays rebuilt through
  # computed member access on connection open), so the literal-target and
  # helper-call composites above never see it. The library identity plus the
  # file-local concealed follow is what says "a Baileys fork did this to its
  # consumers". Worked example: wailib 1.0.0 lib/Socket/messages-recv.js.
  # The mute-less sibling of the follow graft is covered at file scope by
  # charcode-concealed-whatsapp-newsletter-follow, whose finding pools into
  # the archive verdict; no separate archive restatement is kept here, so a
  # mute-full implant is not convicted twice for one follow block.
  - id: whatsapp-library-fork-concealed-connect-follow-and-mute
    desc: Baileys fork conceals connect-time channel follow and mute
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::charcode-concealed-whatsapp-newsletter-follow-and-mute

  - id: whatsapp-library-fork-phantom-sub-connect-auto-follow
    # The any: legs cover both target shapings: a hardcoded
    # DEFAULT_AUTO_FOLLOW_NEWSLETTER_JID (@fer2809fl/baileys 7.0.6) or a
    # remotely fetched GitHub channel list. The desc names the disjunction;
    # "remote" alone mis-describes the hardcoded-default matches.
    # No fetch leg: the preset branch carries no remote list, and a generic
    # fetch-plus-JSON helper (media download, update check) pooled from an
    # unrelated module reads a preset-only implant as remotely driven
    # (@kelvdra/baileys 1.0.6 lib/Utils/messages-media.js getHttpStream).
    # The remote branch is already evidenced by its raw.githubusercontent
    # URL leg; the trigger plus a fixed or fetched target convicts.
    desc: Baileys fork auto-follows preset or fetched newsletter
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: micro-behaviors/communications/messaging/channel::whatsapp-wmex-newsletter-query
      - id: micro-behaviors/communications/messaging/channel::whatsapp-trigger-auto-follow-on-connect
    any:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-default-auto-follow-newsletter-jid
      - id: micro-behaviors/communications/messaging/channel::whatsapp-auto-follow-remote-github-list
      - id: micro-behaviors/communications/messaging/channel::whatsapp-auto-follow-newsletter-config-key
      - id: micro-behaviors/communications/http/url/github::raw-github-json-channel-roster
    # The preset-default graft also satisfies this composite through the
    # hardcoded-JID any-leg, with the required fetch leg pooled from
    # unrelated library code (link-preview fetching in another module).
    # Step down when the preset behavior is independently established so
    # one follow block is not convicted twice. A remote-only graft never
    # trips the preset behavior, so it keeps the full verdict.
    downgrade:
      any:
        - id: objectives/impact/ui/manipulation/social::connect-delayed-preset-wmex-newsletter-follow

  - id: whatsapp-library-fork-preset-connect-auto-follow
    desc: Baileys fork auto-follows preset channel on connect
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::connect-delayed-preset-wmex-newsletter-follow

  - id: whatsapp-library-fork-archive-delayed-channel-follow
    desc: Baileys fork runs delayed hardcoded channel follow
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::delayed-whatsapp-newsletter-follow

  - id: whatsapp-library-fork-connect-delayed-wmex-follow
    desc: Baileys fork runs open-triggered WMex channel follow
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::connect-delayed-wmex-follow-hardcoded-channel

  # The archive framing of the factory-timer follow above: a republished
  # Baileys tree whose socket factory module fires bare setTimeout follows
  # against preset channels at load, no connection handler or trigger
  # wiring. Covers grafts that call the follow helper directly instead of
  # hand-rolling w:mex stanzas. Worked examples: @nyzzpediaa/baileys-new
  # 1.0.0 and 1.0.12 lib/Socket/newsletter.js.
  - id: whatsapp-library-fork-socket-timer-preset-follow
    desc: Baileys fork runs timer-driven preset channel follow
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::socket-timer-preset-whatsapp-newsletter-follow

  - id: npm-hollow-baileys-name-install-redirect
    for: [npm, tar, zip, package.json]
    desc: Hollow baileys-named package redirects install
    crit: hostile
    conf: 0.96
    scope: outer
    all:
      - id: metadata/package/files/missing-entrypoint::npm-main-entrypoint-not-shipped
      - id: metadata/package/dependencies/manifest/count::npm-single-runtime-dependency
      - id: metadata/package/name/vocabulary::npm-baileys-name-segment
    unless:
      - id: metadata/package/dependencies/manifest/count::npm-many-dev-dependencies

  # The archive framing of the socket-open follow above: a republished Baileys
  # tree whose socket module auto-follows a hardcoded channel once the
  # WebSocket opens. The library identity plus the file-local hostile follow
  # is what says "a Baileys fork did this to its consumers".
  - id: whatsapp-library-fork-connect-raw-channel-follow
    desc: Baileys fork auto-follows channel on socket open
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::ws-open-raw-whatsapp-newsletter-follow

  # The immediate (no-timer, no-mute) sibling of the login-success pairing
  # above: the fork's own socket factory registers a connection-open handler
  # that walks a hardcoded channel list and calls the public newsletterFollow
  # API on each. Worked example: @mivesensei/baileys 0.4.2, whose
  # lib/Socket/index.js follows two embedded channel JIDs on first open.
  - id: whatsapp-library-fork-connect-immediate-hardcoded-follow
    desc: Baileys fork follows hardcoded channels on connect
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::connect-immediate-hardcoded-newsletter-follow

  # The sidecar-module sibling: autoFollowChannels and newsletterIds sit in a
  # grafted helper module while lib/Socket/index.js only calls the helper on
  # connection open. Worked example: @randev404/baileys 1.0.0.
  - id: whatsapp-library-fork-sidecar-session-open-newsletter-follow
    desc: Baileys fork sidecar follows channels on connect
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::archive-sidecar-session-open-newsletter-follow

  # The config-default sibling: the fork bakes a DEFAULT_AUTO_FOLLOW_CHANNELS
  # list into the socket config defaults and the session-open loop follows
  # whatever the config carries, so the follow target never appears at the
  # call site. Worked example: @lendxntaa/baileys 0.0.7.
  - id: whatsapp-library-fork-config-default-connect-follow
    desc: Baileys fork follows default channels on connect
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::archive-config-default-session-open-newsletter-follow

  # The archive framing of the roster follow above: a republished Baileys
  # tree whose socket factory hook follows hardcoded channels once the
  # connection opens and swallows the errors. Library identity plus the
  # file-local hostile follow says "a Baileys fork did this to consumers".
  - id: whatsapp-library-fork-connect-swallowed-errors-follow
    desc: Baileys fork silently follows fixed channel targets on connect
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::connect-swallowed-errors-newsletter-follow

  # The archive framing of the short-delay preset follow above: a republished
  # Baileys tree whose socket module defers a preset-channel follow two to
  # nine seconds past session open (connection.update open gate or CB:success
  # login handler). Library identity plus the file-local hostile follow says
  # "a Baileys fork did this to its consumers".
  # Worked examples: @zanta/baileys 1.0.1 lib/Socket/socket.js,
  # amiudmodz 6.3.0 lib/Socket/newsletter.js.
  - id: whatsapp-library-fork-session-open-preset-follow
    desc: Baileys fork defers preset channel follow past open
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::session-open-delayed-preset-channel-follow

  # The archive framing of the timer-scheduled default-channel follow: a
  # republished Baileys tree whose newsletter socket subscribes every session
  # to the forker's channel shortly after creation unless the consumer sets
  # autoFollowChannels=false. A log line and an opt-out switch are not the
  # account holder's consent. Library identity plus the file-local follow says
  # "a Baileys fork did this to its consumers".
  # Worked examples: diezyxhao-baileys 1.3.2, diezyxalya-baileys 1.0.0
  # lib/Socket/newsletter.js.
  - id: whatsapp-library-fork-timer-default-channel-follow
    desc: Baileys fork follows its own channel on a timer
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::timer-scheduled-default-channel-auto-follow

  # The archive framing of the forged virality badge above: a republished
  # Baileys tree whose message helpers stamp attacker-channel attribution and
  # a maxed forwarding score onto outgoing messages. The library identity plus
  # the file-local forgery is what says "a Baileys fork did this to its
  # consumers".
  # Worked example: @nyzzpediaa/baileys-new 1.0.12 lib/Socket/dugong.js.
  - id: whatsapp-library-fork-forged-viral-forward
    desc: Baileys fork forges viral forward on outgoing messages
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social::forged-viral-whatsapp-forward

  # The archive framing of the command stream: a republished Baileys tree
  # whose socket factory wires a persistent operator event stream into every
  # session, with the stream consumer executing received `follow` / `react`
  # tasks through the session's own newsletter API. The graft is the file-local
  # dispatch composite; library identity is what says a dependency did this to
  # its consumers.
  # Worked example: @systemzero/baileys 1.1.2, which hardcodes the stream URL
  # in lib/Socket/index.js and consumes it in lib/Utils/signal-stream.js.
  - id: whatsapp-library-fork-command-stream
    desc: Baileys fork runs remote WhatsApp task stream
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: objectives/command-and-control/remote-command/dispatch::sse-stream-drives-whatsapp-tasks

  # Upstream Baileys fetches its version manifest from a raw content URL; a
  # fork that points fetchLatestBaileysVersion at a github.com/... page URL
  # pulls HTML, silently falls back, and leaves a mutable repointable endpoint
  # under the operator's control. Worked example: @chatunity/baileys
  # (GHSA-2vxg-pmhf-2c8r).
  - id: whatsapp-library-fork-github-page-version-manifest
    desc: Baileys fork repoints version check to GitHub page URL
    crit: hostile
    conf: 0.92
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: micro-behaviors/communications/messaging/channel::baileys-version-check-github-page-url

  # Upstream Baileys uploads outbound media to WhatsApp CDN hosts. A fork that
  # implements uploadFile as a rotation through several anonymous public file
  # hosts gives the operator a URL for arbitrary buffers the consumer passes
  # through the library. Worked example: @chatunity/baileys 1.2.2
  # lib/Utils/messages-media.js.
  - id: whatsapp-library-fork-anonymous-media-upload-relay
    desc: Baileys fork relays media via anonymous file hosts
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: micro-behaviors/communications/http/services/file-hosting::multi-public-file-hosting-services

  # Mutable GitHub-sourced libsignal on a republished Baileys tree is the same
  # supply-chain move as pinning crypto to an attacker-controlled branch.
  # Worked example: @chatunity/baileys (GHSA-2vxg-pmhf-2c8r family).
  - id: whatsapp-library-fork-github-libsignal-dependency
    desc: Baileys fork pins libsignal to GitHub VCS ref
    crit: hostile
    conf: 0.93
    for: [javascript, typescript, npm, tar, zip, package.json]
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: metadata/package/name/vocabulary::npm-baileys-name-segment
      - id: metadata/package/dependencies/manifest/source::npm-libsignal-github-vcs-dependency

  # A mutable Git dependency or a bundled text variator alone does not prove
  # library trojanization. Dependency-source metadata and the suspicious
  # zero-width variation finding retain those observations independently.

  # The manifestless hollow-barrel sibling of the graft composites above: the
  # tarball ships a lib entry that presents the full Baileys API surface
  # (makeWASocket, proto, and the submodule re-exports) under a forker
  # console banner, but carries no publish manifest and none of the local
  # submodules the barrel wires up. Upstream Baileys always ships
  # package.json alongside lib/, and never prints an import-time publisher
  # banner, so the banner rules out a botched upstream publish: this is a
  # deliberately republished fork facade that cannot load as a library and
  # exists to occupy the fork's distribution slot.
  # Worked example: @chatunity-baileys 1.0.2 (package/lib/index.js only).
  - id: whatsapp-library-fork-manifestless-hollow-barrel
    desc: Baileys fork ships manifestless barrel over absent modules
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: metadata/package/entrypoint::runtime-shipped-without-publish-manifest
      - id: well-known/lib/network/baileys::baileys-fork-publisher-console-banner
