# A substitution shell: a scoped package that ships no Baileys implementation
# of its own, resolves its implementation from a floating third-party fork at
# install time, and tells existing bot operators to alias the canonical
# `baileys` specifier onto itself.
#
# Three roles, each required:
#   * delegate — the entry point re-exports a scoped fork's whole namespace
#     (`export *`), so the shell's audit surface is empty while its runtime
#     surface is the fork's;
#   * defer — the manifest floats the fork dependency (`^`, `~`, `*`, `latest`
#     and friends), so the code consumers run is whatever the fork publishes
#     next, not what the shell author reviewed;
#   * divert — the README maps the bare `baileys` specifier onto an
#     `npm:@scope/pkg` target, transferring the ecosystem's trust anchor to
#     the shell ("Install alias untuk bot lama").
#
# Together they effect dependency substitution: a fresh install of a bot that
# follows the directive runs unaudited third-party code under the trusted
# name, and a later grafted fork release flows to every shell consumer with
# no shell update. No legitimate packaging use combines all three: honest
# forks vendor the tree (excluded below), pin what they re-export, re-export
# the unscoped upstream, or document installing their own scoped name.
#
# `unless:` the archive carries the Baileys library tree itself — a republished
# fork with a graft is covered by the sibling graft composites, not here.
#
# Worked example: @haimiya/baileys 9.4.5 (re-exports @queenanya/baileys,
# depends on `^9.4.4`, README aliases `"baileys"` to the shell; both published
# versions later removed by the registry security hold).
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript, npm, tar, zip, package.json, markdown]
  attack: T1195.002

composite_rules:
  - id: whatsapp-library-shim-captures-canonical-specifier
    desc: Baileys shim captures specifier over fork
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: well-known/lib/network/baileys::scoped-baileys-fork-reexport
      - id: metadata/package/dependencies/declaration::scoped-baileys-fork-floating-dependency
      - id: metadata/package/documentation/readme-attribution::readme-baileys-npm-alias-capture
    unless:
      - id: well-known/lib/network/baileys::baileys-library-identity
