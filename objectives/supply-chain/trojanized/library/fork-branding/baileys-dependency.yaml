# The registry reports malicious channel-following releases of this Baileys
# fork. Without an affected version or the injected code, a declaration and
# an independent factory reference are a lead, not proof of a trojanized shim.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  attack: T1195.002
composite_rules:
  - id: queenanya-baileys-dependency-and-factory
    desc: Declares @queenanya/baileys and references Baileys factory
    crit: suspicious
    conf: 0.93
    scope: archive
    all:
      - id: well-known/lib/network/baileys::make-wa-socket-factory
    any:
      - id: metadata/package/dependencies/declaration::queenanya-baileys-runtime-dependency
      - id: metadata/package/dependencies/declaration::queenanya-baileys-optional-dependency
