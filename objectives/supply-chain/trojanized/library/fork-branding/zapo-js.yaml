# A republished zapo-js fork that makes every consumer's session follow a
# publisher-chosen channel roster as soon as the socket opens.
#
# Same family as the Baileys forks beside this file: a connection-open
# listener walks a hardcoded list of newsletter JIDs and issues a FOLLOW for
# each one with the consumer's authenticated session. The fork also replaces
# the optional pairing-code parameter with a fixed literal.
#
# Archive scope: the library identity (dist/crypto, dist/auth), the roster
# (dist/habibi/channels), and the follow with its connection gate
# (dist/habibi/auto-follow) sit in different files of the tarball.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript, npm, tar, zip]
  attack: T1195.002

composite_rules:
  - id: zapo-js-fork-connect-open-roster-follow
    desc: zapo-js fork follows hardcoded channels on connect
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: well-known/lib/network/npm-packages/zapo-js::zapo-library-identity
      - id: micro-behaviors/communications/messaging/channel/whatsapp/newsletter::whatsapp-plaintext-newsletter-jid-roster
      - id: micro-behaviors/communications/messaging/channel/whatsapp/newsletter::whatsapp-newsletter-follow-member-call
    any:
      - id: micro-behaviors/data/control-flow/event-callback::connection-event-listener-registration
      - id: micro-behaviors/data/control-flow/event-callback::connection-status-open-gate

  - id: zapo-js-fork-fixed-default-pairing-code
    desc: zapo-js fork defaults pairing code to a fixed literal
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: well-known/lib/network/npm-packages/zapo-js::zapo-library-identity
      - id: micro-behaviors/communications/messaging/channel/whatsapp/pairing::whatsapp-pairing-code-literal-default
