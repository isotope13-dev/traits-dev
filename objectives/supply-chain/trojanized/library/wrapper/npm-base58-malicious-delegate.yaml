defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1041,T1567.002
  mbc: E1041

traits:
  - id: base58-wrapper-delegates-to-malicious-decoder
    desc: Base58 decoder delegates to hostile dependency
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule base58_wrapper_delegates_to_malicious_decoder {
          strings:
            $dependency = /base60-58x/is
            $alphabet = /123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz/s
            $export = /(exports?\.default|module\.exports)/is
          condition:
            $dependency and $alphabet and $export
        }

