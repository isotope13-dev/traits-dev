# A package can be malicious even when its own entrypoint is only a thin
# wrapper: declaring a runtime dependency is enough to deliver a compromised
# library into the consumer's dependency tree.  Correlate the package's
# manifest with a fetched dependency whose decoder-input exfiltration is
# independently established by the generic exfiltration composite.
defaults:
  platforms: [unix, windows]
  for: [npm]
  attack: "T1195.002,T1041"

composite_rules:
  - id: runtime-dependency-delivers-decoder-exfiltration
    desc: Package delivers decoder-input exfiltration dependency
    crit: hostile
    conf: 0.995
    scope: outer
    all:
      - id: metadata/package/dependencies/manifest::has-runtime-deps
      - id: objectives/exfiltration/http/collect::javascript-decode-input-raw-ip-post

  # The eval-backdoor spelling of the same delivery: a published package
  # declares the malicious express-eval package as a runtime dependency. The
  # wrapper keeps its real behavior, so nothing looks wrong to a reviewer
  # comparing APIs -- the added dependency is the whole payload, and the
  # consumer's dependency tree is where it lands.
  #
  # Worked example: `bcryptutils`, a bcryptjs wrapper published with
  # `express-eval: ^1.0.1` beside the real dependency.
  - id: express-eval-dependency-delivery
    desc: Package delivers express-eval backdoor dependency
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/package/dependencies/named::npm-dep-express-eval
      - id: objectives/supply-chain/impersonation/manifest/placeholder::npm-init-default-license
