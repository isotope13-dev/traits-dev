# Ruby gems that pull and require a side-effect loader dependency on import.
# SleeperGem carriers (Dendreo, fastlane plugin, …) wire git_credential_manager
# this way; the same shape covers future RubyGems loader-dependency drops.
defaults:
  platforms: [unix, windows]
  attack: T1195.002
  mbc: E1195

traits:
  - id: require-git-credential-manager-start
    desc: Requires git_credential_manager/start on import
    crit: suspicious
    conf: 0.99
    for: [ruby]
    if:
      type: text
      regex: 'require\s+["'']git_credential_manager/start["'']'

  - id: gemspec-depends-git-credential-manager
    desc: Gemspec depends on git_credential_manager
    crit: suspicious
    conf: 0.97
    for: [ruby]
    if:
      type: text
      regex: '\.add_(runtime_)?dependency\s*\(?\s*["'']git_credential_manager["'']'

composite_rules:
  - id: ruby-gcm-start-loader-carrier
    desc: Requires GCM start with matching gemspec dep
    crit: hostile
    conf: 0.995
    for: [ruby, gem, archives]
    scope: archive
    all:
      - id: require-git-credential-manager-start
      - id: gemspec-depends-git-credential-manager
