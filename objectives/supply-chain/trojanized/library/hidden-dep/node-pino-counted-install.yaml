defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1195.002,T1059.007

traits:
  - id: node-counted-hidden-pino-install
    desc: Counts imports before quiet payload install
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration (variable_declarator name: (identifier) @counter_file value: (call_expression
            function: (member_expression object: (identifier) @path property: (property_identifier) @join)
            arguments: (arguments (identifier) @dirname (string (string_fragment) @log)))))
          (lexical_declaration (variable_declarator name: (identifier) @count value: (number)))
          (if_statement condition: (parenthesized_expression (call_expression function: (member_expression object: (identifier) @fs property: (property_identifier) @exists)
            arguments: (arguments (identifier) @counter_check))))
          (expression_statement (update_expression argument: (identifier) @count_inc))
          (expression_statement (call_expression function: (member_expression object: (identifier) @fs_write property: (property_identifier) @write)
            arguments: (arguments (identifier) @counter_write (call_expression function: (member_expression object: (identifier) @count_write property: (property_identifier) @to_string)))))
          (try_statement body: (statement_block (expression_statement (call_expression function: (identifier) @require
            arguments: (arguments (string (string_fragment) @initial)))))
            handler: (catch_clause body: (statement_block (if_statement condition: (parenthesized_expression (binary_expression left: (identifier) @count_test))
              consequence: (statement_block (expression_statement (call_expression function: (identifier) @exec arguments: (arguments
          (template_string (string_fragment) @install) (object (pair key: (property_identifier) @hide value: (true))))))))))))
          (#eq? @path "path")
          (#eq? @join "join")
          (#eq? @dirname "__dirname")
          (#eq? @log "c.log")
          (#eq? @counter_file @counter_check)
          (#eq? @counter_file @counter_write)
          (#eq? @fs "fs")
          (#eq? @fs @fs_write)
          (#eq? @exists "existsSync")
          (#eq? @write "writeFileSync")
          (#eq? @count @count_inc)
          (#eq? @count @count_write)
          (#eq? @count @count_test)
          (#eq? @to_string "toString")
          (#eq? @require "require")
          (#eq? @initial "json-specparse")
          (#eq? @exec "execSync")
          (#eq? @hide "windowsHide")
          (#eq? @install "npm install json-specparse --no-warnings --no-save --no-progress --loglevel silent"))
        ((program
          (lexical_declaration (variable_declarator name: (identifier) @counter_file value: (call_expression
            function: (member_expression object: (identifier) @path property: (property_identifier) @join)
            arguments: (arguments (identifier) @dirname (string (string_fragment) @log)))))
          (lexical_declaration (variable_declarator name: (identifier) @count value: (number)))
          (if_statement condition: (parenthesized_expression (call_expression function: (member_expression object: (identifier) @fs property: (property_identifier) @exists)
            arguments: (arguments (identifier) @counter_check))))
          (expression_statement (update_expression argument: (identifier) @count_inc))
          (expression_statement (call_expression function: (member_expression object: (identifier) @fs_write property: (property_identifier) @write)
            arguments: (arguments (identifier) @counter_write (call_expression function: (member_expression object: (identifier) @count_write property: (property_identifier) @to_string)))))
          (try_statement body: (statement_block (expression_statement (call_expression function: (identifier) @require
            arguments: (arguments (string (string_fragment) @initial)))))
            handler: (catch_clause body: (statement_block (if_statement condition: (parenthesized_expression (binary_expression left: (identifier) @count_test))
              consequence: (statement_block (try_statement body: (statement_block (expression_statement (call_expression function: (identifier) @exec arguments: (arguments
          (template_string (string_fragment) @install) (object (pair key: (property_identifier) @hide value: (true))))))))))))))
          (#eq? @path "path")
          (#eq? @join "join")
          (#eq? @dirname "__dirname")
          (#eq? @log "c.log")
          (#eq? @counter_file @counter_check)
          (#eq? @counter_file @counter_write)
          (#eq? @fs "fs")
          (#eq? @fs @fs_write)
          (#eq? @exists "existsSync")
          (#eq? @write "writeFileSync")
          (#eq? @count @count_inc)
          (#eq? @count @count_write)
          (#eq? @count @count_test)
          (#eq? @to_string "toString")
          (#eq? @require "require")
          (#eq? @initial "json-specparse")
          (#eq? @exec "execSync")
          (#eq? @hide "windowsHide")
          (#eq? @install "npm install json-specparse --no-warnings --no-save --no-progress --loglevel silent"))
