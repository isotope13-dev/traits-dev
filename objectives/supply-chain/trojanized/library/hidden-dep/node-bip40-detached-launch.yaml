# bitcoin-main-lib versions hide the known bip40 browser stealer behind an
# npm install hook, sometimes starting its entrypoint in a detached process.
defaults:
  platforms: [unix, windows]
  for: [npm, zip, tar, package.json, javascript]
  attack: T1195.002,T1059.004,T1053.005
  mbc: F0012

traits:
  - id: npm-bip40-runtime-dependency
    desc: Declares bip40 stealer runtime dependency
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: dependencies.bip40
      regex: '.+'

  - id: npm-bip40-direct-postinstall-command
    desc: Runs bip40 from npm postinstall
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '^\s*bip40\s*$'

  - id: npm-postinstall-resolves-bip40
    desc: Resolves installed bip40 package in JavaScript
    crit: suspicious
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: 'require\.resolve\s*\(\s*["'']bip40["'']\s*\)'

  - id: npm-spawn-or-fork-call
    desc: Calls Node spawn or fork
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: text
      regex: '\b(spawn|fork)\s*\('
      exclude_comments: true

  - id: npm-detached-true-option
    desc: Sets detached child option true
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: text
      regex: '\bdetached\s*:\s*true'
      exclude_comments: true

  - id: npm-sudo-password-prompt
    desc: Prompts for the user's sudo password
    crit: suspicious
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: '\[sudo\].{0,80}[Pp]assword for'
      exclude_comments: true

  - id: npm-password-forwarded-to-payload
    desc: Forwards captured password to child
    crit: suspicious
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: 'GHOST_PWD\s*:\s*capturedPassword'
      exclude_comments: true

  - id: npm-aes-gcm-payload-loader
    desc: Decrypts a fetched payload with AES-GCM
    crit: suspicious
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: 'createDecipheriv\s*\(\s*["'']aes-256-gcm["'']'
      exclude_comments: true

  - id: npm-debug-mode-disabled
    desc: Disables setup debug mode
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: text
      regex: 'debugMode\s*=\s*false'
      exclude_comments: true

  - id: npm-detached-negated-debug-mode
    desc: Detaches child when debug mode is disabled
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: text
      regex: 'detached\s*:\s*!\s*debugMode'
      exclude_comments: true

  - id: npm-password-loader-bin-entrypoint
    desc: Exposes setup script as an npm command
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: bin.react-state-optimizer
      substr: scripts/setup.js

composite_rules:
  - id: npm-detached-child-process-marker
    desc: Starts a detached child process
    crit: suspicious
    conf: 0.99
    for: [javascript]
    scope: file
    near_bytes: 500
    all:
      - id: npm-spawn-or-fork-call
    any:
      - id: npm-detached-true-option
      - id: npm-detached-debug-mode-option

  - id: npm-detached-debug-mode-option
    desc: Child process detaches outside debug mode
    crit: suspicious
    conf: 0.99
    for: [javascript]
    scope: file
    near_bytes: 12000
    all:
      - id: npm-debug-mode-disabled
      - id: npm-detached-negated-debug-mode

  - id: npm-postinstall-directly-runs-bip40-stealer
    desc: npm install hook runs the known bip40 browser stealer
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: npm-bip40-runtime-dependency
      - id: npm-bip40-direct-postinstall-command

  - id: npm-postinstall-detaches-bip40-stealer
    desc: npm install hook launches the known bip40 browser stealer detached
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: npm-bip40-runtime-dependency
      - id: npm-postinstall-resolves-bip40
      - id: npm-detached-child-process-marker

  - id: npm-sudo-password-remote-payload-loader
    desc: Captures sudo password and forwards it to a detached decrypted payload
    crit: hostile
    conf: 0.995
    for: [javascript]
    scope: file
    near_bytes: 12000
    all:
      - id: npm-sudo-password-prompt
      - id: npm-password-forwarded-to-payload
      - id: npm-aes-gcm-payload-loader
    any:
      - id: npm-detached-child-process-marker
      - id: npm-detached-debug-mode-option

  - id: npm-bin-sudo-password-stealer
    desc: npm command launches a sudo password stealing remote payload
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: npm-password-loader-bin-entrypoint
      - id: npm-sudo-password-remote-payload-loader
