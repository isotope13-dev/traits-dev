# bitcoin-main-lib versions hide the known bip40 browser stealer behind an
# npm install hook, sometimes starting its entrypoint in a detached process.
defaults:
  platforms: [unix, windows]
  for: [npm, zip, tar, package.json, javascript]
  attack: T1195.002,T1059.004,T1053.005
  mbc: F0012

traits:
  - id: npm-bip40-runtime-dependency
    desc: Declares bip40 stealer runtime dependency
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: dependencies.bip40
      regex: '.+'

  - id: npm-bip40-direct-postinstall-command
    desc: Runs bip40 from npm postinstall
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '^\s*bip40\s*$'

  - id: npm-postinstall-resolves-bip40
    desc: Resolves installed bip40 package in JavaScript
    crit: suspicious
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: 'require\.resolve\s*\(\s*["'']bip40["'']\s*\)'

composite_rules:
  - id: npm-postinstall-directly-runs-bip40-stealer
    desc: npm install hook runs the known bip40 browser stealer
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: npm-bip40-runtime-dependency
      - id: npm-bip40-direct-postinstall-command

  - id: npm-postinstall-detaches-bip40-stealer
    desc: npm install hook launches the known bip40 browser stealer detached
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: npm-bip40-runtime-dependency
      - id: npm-postinstall-resolves-bip40
      - id: micro-behaviors/process/daemonize/detach::js-detached-true-option
