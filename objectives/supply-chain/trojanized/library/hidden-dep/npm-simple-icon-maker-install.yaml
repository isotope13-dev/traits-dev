defaults:
  platforms: [unix, windows]
  for: [zip, npm, tar, package.json, javascript]
  attack: T1195.002,T1059.007

traits:
  - id: npm-compromised-icon-maker-range
    desc: Declares range including compromised icon maker
    crit: suspicious
    for: [package.json]
    if:
      type: value
      path: dependencies.simple-icon-maker
      regex: '^(\^1\.1\.1|1\.1\.2)$'

  - id: npm-icon-check-postinstall
    desc: Runs icon check on installation
    crit: notable
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '^\s*node\s+\./lib/esm/check\.js\s*$'

  - id: js-icon-maker-sample-import
    desc: Imports icon maker for sample generation
    crit: notable
    for: [javascript]
    if:
      type: text
      regex: 'import\s+\w+\s+from\s*["'']simple-icon-maker["'']'

  - id: js-icon-maker-sample-call
    desc: Invokes icon maker on sample SVG
    crit: notable
    for: [javascript]
    if:
      type: text
      regex: '\w+\s*\(\s*["'']\./sample\.svg["'']\s*,\s*["'']\./icons["'']'

composite_rules:
  - id: npm-icon-maker-install-payload-carrier
    desc: Install invokes compromised icon maker range
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: npm-compromised-icon-maker-range
      - id: npm-icon-check-postinstall
      - id: js-icon-maker-sample-import
      - id: js-icon-maker-sample-call
