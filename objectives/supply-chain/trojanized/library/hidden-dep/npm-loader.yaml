defaults:
  platforms: [unix, windows]
  attack: T1195.002

traits:
# Family spellings: lint-builder / lint-null, big.js clones that declare
# `{b,h}js-lint-builders` (plural), and shortened `{s}js-builder` payloads.
# Named and described for the family rather than for `lint-builder` alone: the
# matcher accepts every spelling above, so on a clone that pulls `lint-null` the
# old wording sent a reader looking for a `lint-builder` dependency that is not
# in the manifest.
#
# The trailing `(er)?s?[0-9]{0,2}` is what keeps up with the campaign renaming
# its payload package between clones. Fixing the suffix at `builders?` missed
# `sjs-lint-build1` -- same stub, same big.js clone, one digit different -- so
# that variant lost both this leg and the hostile composite built on it while
# still matching every other rule in the family.
- id: lint-builder-family-dependency
  desc: Depends on lint-builder or lint-null payload
  crit: suspicious
  conf: 0.98
  for: [package.json]
  if:
    type: text
    regex: '"([a-z]js-(lint-)?build(er)?s?[0-9]{0,2}|lint-builder|lint-null)"\s*:'

- id: four-sdk-aes-ipheriv-dependency
  desc: Depends on four-sdk-aes-ipheriv
  crit: suspicious
  conf: 0.995
  for: [package.json]
  if:
    type: value
    path: dependencies.four-sdk-aes-ipheriv
    exists: true

- id: wime-zle-dependency
  desc: Depends on wime-zle payload
  crit: suspicious
  conf: 0.995
  for: [package.json]
  if:
    type: value
    path: dependencies.wime-zle
    exists: true

- id: levex-refa-dependency
  desc: Depends on levex-refa payload
  crit: suspicious
  conf: 0.995
  for: [package.json]
  if:
    type: value
    path: dependencies.levex-refa
    exists: true

- id: assertcoreutils-dependency
  desc: Depends on assertcoreutils payload package
  crit: suspicious
  conf: 0.97
  for: [package.json]
  if:
    type: value
    path: dependencies.assertcoreutils
    exists: true

# npm-doc-{dev,deploy,builder}: payload packages pulled by big.js / bignumber
# clones. Declared in package.json and/or required at import time; often paired
# with the from_str() empty-catch stub. builder is also used by OtterCookie.
- id: npm-doc-payload-dependency
  desc: Depends on npm-doc payload package
  crit: suspicious
  conf: 0.98
  for: [package.json]
  if:
    type: text
    regex: '"npm-doc-(dev|deploy|builder)"\s*:'

- id: require-npm-doc-payload
  desc: Requires npm-doc payload module
  crit: suspicious
  conf: 0.98
  for: [javascript, typescript]
  if:
    type: import
    regex: '^npm-doc-(dev|deploy|builder)$'

- id: slot-loader-dependency
  desc: Depends on slot loader payload
  crit: suspicious
  conf: 0.995
  for: [package.json]
  if:
    type: text
    regex: '"(parket-slot|websocket-slot)"\s*:'

- id: require-levex-refa
  desc: Requires levex-refa module
  crit: suspicious
  conf: 0.995
  for: [javascript, typescript]
  if:
    type: text
    substr: 'require("levex-refa")'

- id: require-slot-loader
  desc: Requires slot loader module
  crit: suspicious
  conf: 0.995
  for: [javascript, typescript]
  if:
    type: text
    regex: 'require\s*\(\s*["''](parket-slot|websocket-slot)["'']\s*\)'

# debug-logfmt clones keep `const origDebug = require(...)` and swap `debug`
# for a hidden payload package. Exact `require('debug')` is the upstream form.
- id: origdebug-swapped-require
  desc: origDebug requires a substituted module
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: 'origDebug\s*=\s*require\s*\(\s*[''"][^''"]{1,80}[''"]'
  unless:
    - type: text
      regex: 'origDebug\s*=\s*require\s*\(\s*[''"]debug[''"]'

- id: require-lint-builder-family
  desc: Requires lint-builder or lint-null module
  crit: suspicious
  conf: 0.98
  for: [javascript, typescript]
  if:
    type: import
    regex: '^([a-z]js-(lint-)?build(er)?s?[0-9]{0,2}|lint-builder|lint-null)$'

# Family of npm path-stdlib clones (path-addon, path-addon-extend, …) that
# exist only to be required from a copied Joyent path.js at module load.
- id: require-path-addon-family
  desc: Requires a path-addon npm package
  crit: notable
  conf: 0.95
  for: [javascript, typescript]
  if:
    type: symbol
    kind: call
    exact: require
    arg:
      kind: string
      regex: '^path-addon'

- id: require-four-sdk-aes-ipheriv
  desc: Requires four-sdk-aes-ipheriv
  crit: suspicious
  conf: 0.995
  for: [javascript, typescript]
  if:
    type: text
    substr: require('four-sdk-aes-ipheriv')

- id: require-wime-zle
  desc: Requires wime-zle module
  crit: suspicious
  conf: 0.995
  for: [javascript, typescript]
  if:
    type: import
    regex: '^(wime-zle|vime-azl)$'

- id: call-aes-create-ipheriv
  desc: Calls aesCreateIpheriv helper
  crit: suspicious
  conf: 0.995
  for: [javascript, typescript]
  if:
    type: text
    substr: aesCreateIpheriv();

- id: from-str-loader-call
  desc: Calls from_str loader method
  crit: component
  conf: 0.98
  for: [javascript, typescript]
  if:
    # Migrated from a tree-sitter call query to a `kind: call`
    # match on the pre-extracted call fact (no per-member
    # tree-sitter cursor walk; same call-name semantics).
    type: symbol
    kind: call
    regex: '\.from_str$'
- id: noop-loader-promises
  desc: Loader chain swallows promise results
  crit: suspicious
  conf: 0.97
  for: [javascript, typescript]
  if:
    type: text
    substr: .then(e => { }).catch(e => { })

- id: from-str-promise-swallow
  desc: from_str promise swallows errors
  crit: component
  conf: 0.99
  for: [javascript, typescript]
  if:
    type: text
    substr: .then(e => e).catch(e => { })

# A parser called with nothing to parse. Rust's FromStr::from_str takes the
# string it is converting, and every wasm-bindgen or native binding that
# genuinely exposes the name keeps that argument -- so a zero-argument call is
# not a conversion at all, it is a trigger wearing a converter's name. This is
# what separates the loader stub from a real Rust-backed npm package that
# happens to load inside a try.
- id: from-str-no-argument-call
  desc: Calls from_str with no arguments
  crit: component
  conf: 0.98
  for: [javascript, typescript]
  if:
    type: text
    regex: '\.from_str\(\s*\)'

- id: swallowed-loader-errors
  desc: Empty catch hides loader errors
  crit: component
  conf: 0.97
  for: [javascript, typescript]
  size_max: 65536
  if:
    type: text
    regex: 'from_str[\s\S]{0,240}catch\s*\([A-Za-z_][A-Za-z0-9_]*\)\s*\{\s*\}'
  unless:
  - type: text
    substr: instantiateWasm
  downgrade:
    any:
    - id: metadata/package/testing/
    - type: basename
      regex: '(?i)\.(spec|test)\.[jt]s$'
composite_rules:
# The same stub as the per-campaign rules below, with the payload package name
# removed from the evidence.
#
# Every other hostile rule in this file needs the dependency spelled out --
# lint-builder, wime-zle, levex-refa, parket-slot, four-sdk-aes-ipheriv. That
# list can only ever describe campaigns that have already been caught: the
# hjs-biginteger clone of big.js shipped this identical stub against
# `hjs-lint-builders` and matched none of them, so a package that carries the
# family's whole loader verbatim scored zero hostile on the loader itself.
#
# What does not change between campaigns is the stub's shape, and each of the
# three legs is load-bearing:
#   * the require sits inside a `try`, so it runs at import time -- the caller
#     never asks for this;
#   * `from_str` is a Rust idiom (the FromStr trait), not a JavaScript one. No
#     mainstream npm package exposes a method by that name; this family names
#     its trigger that way in every variant seen so far;
#   * the return value is thrown away and an empty `catch` eats every error, so
#     the call cannot be doing work the library needs. Code that exists only to
#     be *run*, never to be *used*, is a trigger and not a dependency.
#
# An ordinary optional dependency fails this: it binds the module to an
# outer-scope variable and uses it later, or falls back to an alternative in
# the catch, rather than discarding the result and staying silent.
- id: from-str-import-time-loader-stub
  desc: Import-time from_str loader swallows results
  crit: hostile
  conf: 0.98
  for: [javascript, typescript]
  attack: T1195.002,T1059.007
  mbc: B0024
  all:
  - id: from-str-loader-call
  - id: swallowed-loader-errors
  - id: micro-behaviors/os/module/load::cjs-require-in-try-fallback
  # The result must go nowhere. Either the call takes no argument (so it cannot
  # be converting anything) or its promise is drained by no-op handlers. Without
  # this leg the rule convicts a genuine Rust/wasm binding that happens to sit
  # in a try with an empty catch -- verified against exactly that shape.
  any:
  - id: from-str-no-argument-call
  - id: noop-loader-promises
  - id: from-str-promise-swallow
  unless:
  - id: metadata/package/testing/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern

- id: hidden-dependency-loader
  desc: Embedded dependency loader stub
  crit: suspicious
  conf: 0.99
  for: [javascript, typescript]
  all:
  - id: require-lint-builder-family
  - id: from-str-loader-call
  - id: noop-loader-promises
  - id: swallowed-loader-errors

- id: require-fallback-npm-install
  desc: Missing dependency fallback installs package at runtime
  crit: suspicious
  conf: 0.96
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/os/module/load::cjs-require-in-try-fallback
  - id: micro-behaviors/process/create/shell/bridge::execsync-in-catch-handler
  - id: micro-behaviors/os/module/load::cjs-require-in-catch-fallback
  - id: objectives/supply-chain/install-hook/scripts/dynamic-install::runtime-npm-install-comp
  unless:
  - id: metadata/package/testing/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern

- id: runtime-autoinstall-hidden-dependency
  desc: Trojanized library auto-installs hidden dependency at runtime
  crit: hostile
  conf: 0.985
  for: [javascript, typescript]
  attack: "T1195.002,T1059.007"
  mbc: B0024
  all:
  - id: require-fallback-npm-install
  - id: objectives/supply-chain/install-hook/scripts/dynamic-install::stealth-runtime-npm-install
  any:
  - id: swallowed-loader-errors
  - id: micro-behaviors/process/create/spawn::windowshide-option

- id: trojanized-library-hidden-loader
  desc: Trojanized library runs hidden dependency
  crit: hostile
  conf: 0.995
  all:
  - id: lint-builder-family-dependency
  - id: hidden-dependency-loader
  any:
  - id: metadata/package/versioning::mature-package-version
  - id: objectives/supply-chain/impersonation/npm-clone::author-retained-original
  - id: metadata/package/manifest/name::npm-hyphenated-multiword-name

- id: npm-undeclared-import-time-loader
  desc: New package loads undeclared external dependency
  crit: hostile
  conf: 0.99
  for: [npm, tar, zip, archives]
  scope: package
  attack: "T1195.002,T1059.007"
  mbc: B0024
  # A package with an explicit Webpack build script commonly uses bare
  # module-specifier aliases for code-split bundles.  Keep the neutral
  # dynamic-import observation, but do not call this loader hostile solely
  # from that normal build context.
  unless:
  - id: metadata/package/scripts::has-build-script-1
  - id: metadata/package/scripts::has-build-script-2
  # A published npm manifest must declare its package name.  Nameless
  # repository manifests are development metadata, not publishable packages.
  - id: metadata/package/manifest/name::npm-no-name-field
  # XYO's published provider package imports these peer APIs by design. They
  # are supplied by the consuming XYO application, so the archive-level
  # unused-runtime-dependency metric must not turn them into a hidden loader.
  - id: well-known/lib/network/xyo::xyo-peer-package-context
  # @stacksjs/defaults is an application scaffold: its source imports the
  # framework supplied by the consuming project, not hidden install-time code.
  - id: well-known/lib/core/stacksjs-defaults::scaffold-package-context
  all:
  # A registry tarball has npm's canonical `package/package.json` layout.
  # Repository ZIPs commonly contain a development manifest plus source files;
  # those must not be pooled into a published-package loader verdict.
  - id: metadata/package/files/included::npm-publish-root-manifest
  - id: metadata/package/dependencies/manifest::npm-phantom-runtime-dependency
  - id: micro-behaviors/os/module/load::dynamic-external-import-string-literal
  # Malicious packages can remain published long enough to outlive the
  # seven-day package-age gate before detection or takedown.  The phantom
  # dependency plus import-time external load remains the decisive signal;
  # retain a young-package bound to avoid broadening this to mature plugins.
  - id: metadata/registry::recent-package

- id: known-payload-phantom-dependency
  desc: Package carries unused known payload dependency
  crit: hostile
  conf: 0.985
  for: [npm, tar, zip]
  scope: archive
  attack: "T1195.002,T1059.007"
  mbc: B0024
  all:
      - id: metadata/package/dependencies/manifest::npm-phantom-runtime-dependency
  any:
  - id: assertcoreutils-dependency
  - id: four-sdk-aes-ipheriv-dependency
  - id: wime-zle-dependency
  - id: levex-refa-dependency
  - id: slot-loader-dependency
  - id: npm-doc-payload-dependency

- id: npm-doc-from-str-payload-loader
  desc: npm-doc payload loaded via from_str stub
  crit: hostile
  conf: 0.98
  for: [javascript, typescript]
  attack: "T1195.002,T1059.007"
  mbc: B0024
  all:
  - id: require-npm-doc-payload
  - id: from-str-no-argument-call
  - id: swallowed-loader-errors
  unless:
  - id: metadata/package/testing/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern

- id: wime-zle-hidden-loader
  desc: Embedded wime-zle dependency loader
  crit: hostile
  conf: 0.998
  # Cross-file: the dependency is declared in package.json while the loader code
  # lives in a sibling .js. A .tgz is typed tar.gz (not npm), so package.json-
  # anchored sibling pooling never activates — evaluate at archive scope so the
  # manifest + script findings are pooled. (The JS-only wime-zle-loader-stub
  # below still covers the case where only the script is seen.)
  for: [javascript, typescript, package.json, archives]
  scope: archive
  all:
  - id: wime-zle-dependency
  - id: require-wime-zle
  - id: from-str-loader-call
  - id: from-str-promise-swallow

- id: wime-zle-loader-stub
  desc: wime-zle import-time loader stub
  crit: hostile
  conf: 0.998
  for: [javascript, typescript]
  all:
  - id: require-wime-zle
  - id: from-str-loader-call
  - id: from-str-promise-swallow

- id: levex-refa-hidden-loader
  desc: Embedded levex-refa dependency loader
  crit: hostile
  conf: 0.998
  # Cross-file (dep in package.json + loader in sibling .js); see
  # wime-zle-hidden-loader — evaluate at archive scope so .tgz pools both.
  for: [javascript, typescript, package.json, archives]
  scope: archive
  all:
  - id: levex-refa-dependency
  - id: require-levex-refa
  - id: from-str-loader-call
  - id: from-str-promise-swallow

- id: levex-refa-loader-stub
  desc: levex-refa import-time loader stub
  crit: hostile
  conf: 0.998
  for: [javascript, typescript]
  all:
  - id: require-levex-refa
  - id: from-str-loader-call
  - id: from-str-promise-swallow

- id: slot-loader-stub
  desc: Slot loader runs during import
  crit: hostile
  conf: 0.998
  for: [javascript, typescript]
  attack: "T1195.002,T1059.007"
  all:
  - id: require-slot-loader
  - id: from-str-loader-call
  - id: swallowed-loader-errors
  any:
  - id: noop-loader-promises
  - id: micro-behaviors/os/module/load::cjs-require-in-try-fallback
  - id: objectives/supply-chain/install-hook/init::top-level-require-method-call

- id: slot-hidden-dependency-loader
  desc: Package ships slot loader dependency
  crit: hostile
  conf: 0.998
  for: [javascript, typescript, package.json, archives]
  scope: archive
  attack: "T1195.002,T1059.007"
  all:
  - id: slot-loader-dependency
  - id: require-slot-loader
  - id: from-str-loader-call
  - id: swallowed-loader-errors

- id: trojanized-crypto-sdk-helper
  desc: Trojanized SDK triggers four-sdk-aes-ipheriv helper
  crit: hostile
  conf: 0.998
  all:
  - id: four-sdk-aes-ipheriv-dependency
  - id: require-four-sdk-aes-ipheriv
  - id: call-aes-create-ipheriv
  any:
  - id: micro-behaviors/crypto/library/blockchain/transaction::ethers-library-reference
  - id: metadata/package/manifest/name::npm-sdk-suffix
  - id: metadata/package/manifest/name::npm-hyphenated-multiword-name

# Copied Node path.js that require()s a path-addon* package pinned to `*` so
# the latest (attacker-controlled) sidecar runs on every import. The official
# path / path-browserify packages never take a wildcard sidecar.
- id: path-clone-wildcard-addon-sidecar
  desc: Path clone loads wildcard path-addon sidecar
  crit: hostile
  conf: 0.99
  for: [javascript, typescript, package.json, archives]
  scope: archive
  attack: "T1195.002,T1059.007"
  mbc: B0024
  all:
  - id: well-known/lib/core/node-path::node-path-module-implementation
  - id: require-path-addon-family
  - id: metadata/package/dependencies/manifest::npm-wildcard-dependency
  - id: objectives/supply-chain/impersonation/core-module::main-path-js
  unless:
  - id: well-known/lib/core/node-path::package-name

# debug-logfmt clones keep origDebug and replace require('debug') with a
# payload package, then wrap origDebug.enable in javascript-obfuscator RC4
# string-array output so the substitution is not readable at rest.
- id: obfuscated-origdebug-payload-swap
  desc: Obfuscated origDebug payload module swap
  crit: hostile
  conf: 0.98
  for: [javascript, typescript]
  attack: T1195.002,T1027.002
  mbc: B0024
  all:
  - id: origdebug-swapped-require
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::for-try-parseint-array-rotate
  - id: micro-behaviors/crypto/symmetric/xor/loop::xor-modulo-key-loop
