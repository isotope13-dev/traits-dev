defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1005,T1041

traits:
  - id: hash-validator-v2-dependency
    desc: Declares known hash-validator-v2 dependency
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: text
      regex: '"@hash-validator/v2"\s*:'

  - id: hash-validator-sha256-import
    desc: Imports sha256String from hash-validator v2
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      regex: 'import\s*\{\s*sha256String\s*\}\s*from\s*["'']@hash-validator/v2["'']'

  - id: hash-validator-sha256-import-time-call
    desc: Calls imported SHA-256 validator at load
    crit: suspicious
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      regex: 'sha256String\s*\(\s*ALPHABET\s*\)\.catch\s*\(\s*console\.error\s*\)'

composite_rules:
  - id: npm-import-time-hash-validator-project-theft
    desc: Imports and runs the project stealing hash validator on module load
    crit: hostile
    conf: 0.995
    scope: archive
    for: [npm, zip, tar, package.json, javascript, typescript]
    all:
      - id: hash-validator-v2-dependency
      - id: hash-validator-sha256-import
      - id: hash-validator-sha256-import-time-call
