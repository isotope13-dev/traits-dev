# A package that declares Bun as a runtime dependency and runs a bundled script
# with it from an install hook is a runtime smuggler: the consumer's install
# downloads a JavaScript runtime and executes code the manifest never shows.
# Either leg alone is ordinary (a build tool may depend on Bun; a lifecycle
# hook may run a local bundled script). Together, both legs come from the same
# manifest and the install hook is the execution path.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002

composite_rules:
  - id: npm-install-hook-bun-runtime-loader
    desc: Install hook runs bundled script via Bun
    crit: hostile
    conf: 0.92
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-bun-run-bundled-js
      - id: metadata/package/dependencies/declaration::npm-bun-runtime-dependency
    scope: file
    unless:
      - id: well-known/tool/detection/threat-intel/
