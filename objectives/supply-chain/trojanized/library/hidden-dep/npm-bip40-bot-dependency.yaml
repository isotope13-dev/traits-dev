defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002,T1059.007,T1105

traits:
  - id: npm-bitcoin-main-lib-name
    desc: Names Bitcoin main library package
    crit: notable
    if:
      type: value
      path: name
      exact: 'bitcoin-main-lib'
  - id: npm-bip40-compromised-range
    desc: Declares range including compromised bip40
    crit: suspicious
    if:
      type: value
      path: dependencies.bip40
      regex: '^\^1\.0\.(4|5)$'

composite_rules:
  - id: npm-bitcoin-main-lib-bip40-install
    desc: Bitcoin package installs compromised bip40 range
    crit: hostile
    conf: 0.99
    all:
      - id: npm-bitcoin-main-lib-name
      - id: npm-bip40-compromised-range
