defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002,T1552.001,T1041

traits:
  - id: npm-brlc-self-dependency-range
    desc: Declares compromised monorepo dependency range
    crit: suspicious
    if:
      type: value
      path: dependencies.brlc-monorepo
      exact: '^11.9.9'
  - id: npm-brlc-package-name
    desc: Names monorepo package
    crit: notable
    if:
      type: value
      path: name
      exact: 'brlc-monorepo'

composite_rules:
  - id: npm-brlc-compromised-self-dependency
    desc: Declares range including compromised self dependency
    crit: hostile
    conf: 0.99
    all:
      - id: npm-brlc-self-dependency-range
      - id: npm-brlc-package-name
      - id: micro-behaviors/os/package-manager/hook-install::npm-postinstall-runs-index-entry
