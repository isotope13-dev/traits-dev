defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript]
  attack: T1195.002

composite_rules:
  - id: tea-xyz-phantom-runtime-dependencies-spam
    desc: Tea.xyz package declares unimported runtime dependencies
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/files/included::archive-tea-reward-manifest
      - id: metadata/package/dependencies/reconciliation::npm-phantom-runtime-dependency
      - id: metadata/package/scripts/develop::npm-init-default-test
