defaults:
  platforms: [unix, windows]
  for: [zip, npm, tar, javascript]
  attack: T1195.002,T1059.007,T1105

traits:
  - id: node-require-psxjson
    desc: Loads psxjson module
    crit: notable
    for: [javascript]
    if:
      type: text
      regex: 'require\(["'']psxjson["'']\)'
  - id: node-install-psxjson-silent
    desc: Silently installs psxjson at runtime
    crit: suspicious
    for: [javascript]
    if:
      type: text
      substr: 'npm install psxjson --no-warnings --no-save --no-progress --loglevel silent'
  - id: node-psxjson-sibling-entry
    desc: Loads installed psxjson entry point
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: '../../psxjson/pino.js'
  - id: node-load-local-functions
    desc: Loads local functions at import
    crit: notable
    for: [javascript]
    if:
      type: text
      regex: 'require\(["'']\./lib/functions["'']\)'

composite_rules:
  - id: node-psxjson-install-and-load
    desc: Silently installs and loads known payload package
    crit: hostile
    conf: 0.99
    scope: file
    for: [javascript]
    all:
      - id: node-require-psxjson
      - id: node-install-psxjson-silent
      - id: node-psxjson-sibling-entry
  - id: npm-import-installs-psxjson
    desc: Import can install and load known payload
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: node-load-local-functions
      - id: node-psxjson-install-and-load
