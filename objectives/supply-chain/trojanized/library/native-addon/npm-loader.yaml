defaults:
  platforms: [unix, windows]
  attack: T1195.002

composite_rules:
  - id: silent-native-addon-loader
    desc: Silent native addon loader stub
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/os/module/require::local-native-addon-require
      - id: micro-behaviors/data/control-flow/error-handling::from-str-empty-catch

  - id: tiny-prebuilt-native-addon-loader
    desc: Tiny prebuilt native addon loader
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/os/module/require::prebuilt-native-addon-require
      - id: metadata/file/line::tiny-javascript-file-lines
      - id: metadata/file/size::tiny-javascript-file-size

  - id: version-facade-native-addon-loader
    desc: Version facade native addon loader
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/os/module/require::local-native-addon-require
      - id: objectives/supply-chain/impersonation/manifest/facade::version-only-package-export

  - id: minimal-native-addon-facade-package
    desc: Minimal npm facade ships prebuilt addon
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/package/files/included::package-publishes-prebuilt-dir
      - id: metadata/package/entrypoint::has-index-entry
      - id: objectives/supply-chain/hidden-payload/staging/loader::no-build-script
    any:
      - id: tiny-prebuilt-native-addon-loader
      - id: version-facade-native-addon-loader
      - id: metadata/package/files/package-json::has-files-field
    needs: 2

  - id: trojanized-native-addon-loader-package
    desc: npm addon loader with credential exfiltration
    crit: hostile
    conf: 0.97
    scope: archive
    for: [npm, tar, zip, package.json, javascript, binaries]
    all:
      - id: metadata/package/files/included::npm-prebuilds-node-api-elf
      - id: objectives/exfiltration/stealer/env::native-getenv-secrets-json-http-oob-exfil
    any:
      - id: silent-native-addon-loader
      - id: micro-behaviors/os/module/require::platform-prebuilds-caught-require
      - id: tiny-prebuilt-native-addon-loader
      - id: version-facade-native-addon-loader

  - id: trojanized-native-addon-oob-beacon-package
    desc: Trojanized npm native addon beacons to OOB host
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041
    for: [npm, tar, zip, package.json, javascript, binaries]
    scope: archive
    all:
      - id: trojanized-native-addon-loader-package
      - id: micro-behaviors/communications/url/host::oob-dot-subdomain-host

  - id: trojanized-npm-native-addon-dropper
    desc: Trojanized npm native addon dropper
    crit: hostile
    conf: 0.985
    all:
      - id: metadata/package/files/included::npm-prebuilds-node-api-elf
    any:
      - id: micro-behaviors/process/create/shell/spawn::native-node-addon-shell-exec
      - id: micro-behaviors/fs/chmod/modify::node-addon-hidden-temp-write-surfaces
    needs: 2

  - id: native-addon-dropper-package
    desc: npm package ships native addon dropper
    crit: hostile
    conf: 0.985
    all:
      - id: trojanized-native-addon-loader-package
    any:
      - id: trojanized-npm-native-addon-dropper
      - id: objectives/supply-chain/hidden-payload/trojan::hidden-temp-shell-native-addon-dropper
      - id: objectives/supply-chain/hidden-payload/trojan::daemonized-native-addon-dropper

  - id: npm-prebuilds-import-native-env-exfil
    desc: npm entry silently loads prebuilds addon that exfiltrates env
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1195.002,T1041
    for: [npm, tar, package.json, javascript, elf]
    all:
      - id: micro-behaviors/os/module/require::prebuilds-addon-require-swallowed-catch
      - id: micro-behaviors/fs/path/construct::platform-prebuild-node-addon-path
      - id: objectives/exfiltration/stealer/env::native-getenv-secrets-json-http-oob-exfil
      - id: metadata/file/format/native-executable::native-executable-image

  - id: npm-native-addon-http-shell-tasking
    desc: npm native addon with HTTP shell tasking
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1059.004,T1071.001
    for: [npm, tar, zip, package.json, c]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::npm-install-native-addon-build
      - id: objectives/command-and-control/backdoor/tasking/command-http::native-http-shell-tasking
