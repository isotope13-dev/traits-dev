defaults:
  platforms: [unix, windows]
  attack: T1195.002

composite_rules:
  - id: version-facade-native-addon-loader
    desc: Version facade native addon loader
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/os/module/require::local-native-addon-require
      - id: objectives/supply-chain/impersonation/manifest/facade::version-only-package-export

  - id: minimal-native-addon-facade-package
    desc: Minimal npm facade ships prebuilt addon
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/package/files/included::package-publishes-prebuilt-dir
      - id: metadata/package/entrypoint::has-index-entry
      - id: objectives/supply-chain/hidden-payload/staging/loader::no-build-script
    any:
      - id: micro-behaviors/os/module/require::tiny-prebuilt-native-addon-loader
      - id: version-facade-native-addon-loader
      - id: metadata/package/files/package-json::has-files-field
    needs: 2

  - id: trojanized-npm-native-addon-dropper
    desc: Trojanized npm native addon dropper
    crit: hostile
    conf: 0.985
    all:
      - id: metadata/package/files/included::npm-prebuilds-node-api-elf
    any:
      - id: micro-behaviors/process/create/shell/spawn::native-node-addon-shell-exec
      - id: micro-behaviors/fs/chmod/modify::node-addon-hidden-temp-write-surfaces
    needs: 2

  - id: native-addon-dropper-package
    desc: npm package ships native addon dropper
    crit: hostile
    conf: 0.985
    all:
      - id: objectives/supply-chain/hidden-payload/native-extension::npm-native-addon-secret-exfil-loader
    any:
      - id: trojanized-npm-native-addon-dropper
      - id: objectives/supply-chain/hidden-payload/trojan::hidden-temp-shell-native-addon-dropper
      - id: objectives/supply-chain/hidden-payload/trojan::daemonized-native-addon-dropper

  - id: npm-native-addon-http-shell-tasking
    desc: npm native addon with HTTP shell tasking
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1059.004,T1071.001
    for: [npm, tar, zip, package.json, c]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::npm-install-native-addon-build
      - id: objectives/command-and-control/backdoor/tasking/command-http::native-http-shell-tasking
