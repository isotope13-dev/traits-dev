defaults:
  platforms:
  - unix
  - windows
  for:
  - zip
  - npm
  - tar
  - package.json
  - javascript
  attack: T1195.002,T1041,T1082
traits:
- id: npm-browser-interaction-compromised-range
  desc: Declares range including beacon dependency
  crit: suspicious
  for:
  - package.json
  if:
    type: value
    path: dependencies.browser-interaction-time-utils
    exact: ^1.0.0
- id: node-browser-interaction-import
  desc: Loads browser interaction dependency
  crit: notable
  for:
  - javascript
  if:
    type: text
    regex: require\(["']browser-interaction-time-utils["']\)
- id: node-browser-interaction-marker
  desc: Announces interaction metrics suite
  crit: notable
  for:
  - javascript
  if:
    type: text
    substr: Browser Interaction Metrics Suite Initialized
composite_rules:
- id: npm-browser-interaction-beacon-caller
  desc: Loads range including host-profile beacon
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: objectives/supply-chain/trojanized/library/dependency-api::npm-browser-interaction-compromised-range
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-browser-interaction-import
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-browser-interaction-marker
