defaults:
  platforms:
  - unix
  - windows
  for:
  - zip
  - npm
  - tar
  - package.json
  - javascript
  attack: T1195.002,T1552.001,T1041
traits:
- id: npm-client-hash-stealer-range
  desc: Declares range including file stealer
  crit: suspicious
  for:
  - package.json
  if:
    type: value
    path: dependencies.client-hash-sdk
    exact: ^2.0.8
- id: node-client-hash-import
  desc: Imports client hash dependency
  crit: notable
  for:
  - javascript
  if:
    type: text
    substr: from "client-hash-sdk"
- id: node-client-hash-authrize
  desc: Selects client hash authorization entry
  crit: notable
  for:
  - javascript
  if:
    type: text
    substr: decodeSdk.authrizeClob
- id: node-client-hash-run-authrize
  desc: Invokes client hash authorization entry
  crit: suspicious
  for:
  - javascript
  if:
    type: text
    substr: runAuthrizeClob().catch
composite_rules:
- id: node-client-hash-stealer-caller
  desc: Calls known file stealing dependency
  crit: hostile
  conf: 0.99
  scope: file
  for:
  - javascript
  all:
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-client-hash-import
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-client-hash-authrize
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-client-hash-run-authrize
- id: npm-client-hash-stealer-caller
  desc: Activates range including file stealer
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: objectives/supply-chain/trojanized/library/dependency-api::npm-client-hash-stealer-range
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-client-hash-stealer-caller
