defaults:
  platforms:
  - unix
  - windows
  for:
  - zip
  - npm
  - tar
  - package.json
  - javascript
  attack: T1195.002,T1059.007,T1105
traits:
- id: npm-passport-auth-loader-range
  desc: Declares range including remote loader
  crit: suspicious
  for:
  - package.json
  if:
    type: value
    path: dependencies.passport-google-auth-token
    regex: ^\^1\.0\.(13|15|16|18)$
- id: node-passport-auth-loader-import
  desc: Loads Google authentication dependency
  crit: notable
  for:
  - javascript
  if:
    type: text
    regex: require\(["']passport-google-auth-token["']\)
- id: node-passport-auth-loader-trigger
  desc: Calls authentication during middleware setup
  crit: suspicious
  for:
  - javascript
  if:
    type: text
    substr: passport._strategy("google-auth-token").authenticate({})
- id: node-passport-auth-loader-options
  desc: Passes CORS methods to authentication scope
  crit: notable
  for:
  - javascript
  if:
    type: text
    substr: '{ scope: o.methods.slice(-2) }'
composite_rules:
- id: node-passport-cors-loader-trigger
  desc: Activates known remote-code authentication package
  crit: hostile
  conf: 0.99
  scope: file
  for:
  - javascript
  all:
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-passport-auth-loader-import
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-passport-auth-loader-trigger
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-passport-auth-loader-options
- id: npm-passport-cors-loader-carrier
  desc: CORS middleware activates remote loader dependency
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: objectives/supply-chain/trojanized/library/dependency-api::npm-passport-auth-loader-range
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-passport-cors-loader-trigger
