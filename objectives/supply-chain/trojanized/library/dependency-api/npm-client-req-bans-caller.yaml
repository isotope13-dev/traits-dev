defaults:
  platforms:
  - unix
  - windows
  for:
  - zip
  - npm
  - tar
  - package.json
  - javascript
  attack: T1195.002,T1555,T1552.001
traits:
- id: npm-client-req-bans-range
  desc: Declares range including stealer dependency
  crit: suspicious
  for:
  - package.json
  if:
    type: value
    path: dependencies.client-req-bans
    exact: ^3.3.2
- id: node-client-req-bans-import
  desc: Imports client request dependency
  crit: notable
  for:
  - javascript
  if:
    type: text
    regex: require\(["']client-req-bans["']\)
- id: node-client-req-bans-trigger
  desc: Calls concealed dependency entry point
  crit: notable
  for:
  - javascript
  if:
    type: text
    substr: requestIP.seg()
- id: node-client-inspector-init
  desc: Initializes client inspector middleware
  crit: notable
  for:
  - javascript
  if:
    type: text
    substr: ClientInspectorService.init()
composite_rules:
- id: node-client-req-bans-triggering-import
  desc: Calls known browser stealer dependency
  crit: hostile
  conf: 0.99
  scope: file
  for:
  - javascript
  all:
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-client-req-bans-import
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-client-req-bans-trigger
- id: npm-client-req-bans-stealer-caller
  desc: Middleware activates range containing credential stealer
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: objectives/supply-chain/trojanized/library/dependency-api::npm-client-req-bans-range
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-client-req-bans-import
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-client-req-bans-trigger
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-client-inspector-init
