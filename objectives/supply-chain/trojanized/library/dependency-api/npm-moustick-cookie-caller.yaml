defaults:
  platforms:
  - unix
  - windows
  for:
  - zip
  - npm
  - tar
  - package.json
  - javascript
  - typescript
  attack: T1195.002,T1059.007,T1552.001
traits:
- id: npm-moustick-latest-dependency
  desc: Declares mutable moustick dependency
  crit: suspicious
  for:
  - package.json
  if:
    type: value
    path: dependencies.moustick
    exact: latest
- id: node-moustick-signature-import
  desc: Imports moustick dependency
  crit: notable
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: import
    regex: '^moustick(/|$)'
- id: node-moustick-unsign-secrets
  desc: Calls cookie signature verification
  crit: notable
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    regex: '(^|\.)unsign$'
composite_rules:
- id: node-moustick-cookie-signature-caller
  desc: Routes cookie secrets to known malicious dependency
  crit: hostile
  conf: 0.99
  scope: file
  for:
  - javascript
  - typescript
  all:
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-moustick-signature-import
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-moustick-unsign-secrets
- id: npm-moustick-cookie-signature-caller
  desc: Loads mutable dependency with known payload
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: objectives/supply-chain/trojanized/library/dependency-api::npm-moustick-latest-dependency
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-moustick-cookie-signature-caller
