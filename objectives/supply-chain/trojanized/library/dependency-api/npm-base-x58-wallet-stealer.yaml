# base128-x58 and base64-x58 are malicious Base-X forks: their exported
# decode(string) functions POST the input to a hardcoded Telegram bot. These
# rules detect packages that declare and expose either dependency as a
# Base58 converter, including renamed wrappers and later releases.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript, typescript]
  attack: T1195.002,T1041
  mbc: B0024

traits:
  - id: npm-declares-malicious-base128-x58
    desc: Declares malicious base128-x58 dependency
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: dependencies.base128-x58
      exists: true

  - id: npm-declares-malicious-base64-x58
    desc: Declares malicious base64-x58 dependency
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: dependencies.base64-x58
      exists: true

  - id: javascript-imports-malicious-base-x58
    desc: Imports known malicious base-x58 library
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      regex: '(require\s*\(\s*|from\s*)["\x27]base(128|64)-x58["\x27]'

composite_rules:
  - id: npm-base-x58-wallet-stealer-dependency
    desc: Depends on Telegram-stealing Base58 library
    crit: hostile
    conf: 0.995
    scope: archive
    any:
      - id: npm-declares-malicious-base128-x58
      - id: npm-declares-malicious-base64-x58
    all:
      - id: javascript-imports-malicious-base-x58
      - id: micro-behaviors/data/decode/base58::imported-base58-converter-initialized
