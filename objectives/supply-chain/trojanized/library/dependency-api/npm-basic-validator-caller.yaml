defaults:
  platforms:
  - unix
  - windows
  for:
  - zip
  - npm
  - tar
  - package.json
  - javascript
  - typescript
  attack: T1195.002
# GHSA-jxh6-q3x4-j7pf / MAL-2025-47175: malicious releases 1.0.0–1.0.7.
# Deliberately recognize bounded common selectors, not arbitrary semver strings.
traits:
- id: npm-basic-validator-compromised-range
  desc: Depends on malicious basic-validator-pro
  crit: suspicious
  for:
  - package.json
  if:
    type: value
    path: dependencies.basic-validator-pro
    regex: '^\s*[~^=]?\s*v?1\.0\.[0-7]\s*$'
- id: node-basic-validator-import
  desc: Imports malicious basic-validator-pro
  crit: notable
  for:
  - javascript
  - typescript
  if:
    type: import
    exact: basic-validator-pro
- id: node-basic-validator-call
  desc: Calls basic-validator-pro activation API name
  crit: notable
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    regex: '(^|\.)syncSha256ValidatorPro$'
composite_rules:
- id: node-basic-validator-invocation
  desc: Imports and invokes malicious validator API
  crit: suspicious
  for: [javascript, typescript]
  scope: file
  all:
  - id: node-basic-validator-import
  - id: node-basic-validator-call
- id: npm-malicious-validator-activation
  desc: Invokes malware-listed basic-validator-pro
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: objectives/supply-chain/trojanized/library/dependency-api::npm-basic-validator-compromised-range
  - id: node-basic-validator-invocation
