defaults:
  platforms:
  - unix
  - windows
  for:
  - zip
  - npm
  - tar
  - package.json
  - javascript
  attack: T1195.002,T1552.001,T1041
traits:
- id: npm-basic-validator-compromised-range
  desc: Declares range including compromised validator
  crit: suspicious
  for:
  - package.json
  if:
    type: value
    path: dependencies.basic-validator-pro
    regex: ^\^1\.0\.(4|7)$
- id: node-basic-validator-import
  desc: Imports validator function
  crit: notable
  for:
  - javascript
  if:
    type: text
    regex: require\(["']basic-validator-pro["']\)
- id: node-basic-validator-call
  desc: Calls validator with no arguments
  crit: notable
  for:
  - javascript
  if:
    type: text
    regex: syncSha256ValidatorPro\(\s*\)
- id: node-basic-validator-math-export
  desc: Exports Solana token quote function
  crit: notable
  for:
  - javascript
  if:
    type: text
    substr: exports.getTokensOut
composite_rules:
- id: npm-compromised-validator-quote-caller
  desc: Solana quote invokes compromised validator range
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: objectives/supply-chain/trojanized/library/dependency-api::npm-basic-validator-compromised-range
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-basic-validator-import
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-basic-validator-call
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-basic-validator-math-export
