defaults:
  platforms:
  - unix
  - windows
  for:
  - zip
  - npm
  - tar
  - package.json
  - javascript
  attack: T1195.002,T1059.007,T1105
traits:
- id: npm-streamlyx-cache-compromised-range
  desc: Declares range including streamlyx payload chain
  crit: suspicious
  for:
  - package.json
  if:
    type: value
    path: dependencies.streamlyx
    exact: ^1.0.1
- id: node-streamlyx-cache-import
  desc: Loads streamlyx cache logger
  crit: notable
  for:
  - javascript
  if:
    type: text
    regex: require\(["']streamlyx["']\)
- id: node-streamlyx-cache-has-call
  desc: Calls streamlyx from cache lookup
  crit: notable
  for:
  - javascript
  if:
    type: text
    substr: 'streamlyx(''cacheName:key'', {levels: [cacheName, key]})('''')'
composite_rules:
- id: npm-streamlyx-cache-caller
  desc: Cache lookup activates known remote-code dependency chain
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: objectives/supply-chain/trojanized/library/dependency-api::npm-streamlyx-cache-compromised-range
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-streamlyx-cache-import
  - id: objectives/supply-chain/trojanized/library/dependency-api::node-streamlyx-cache-has-call
