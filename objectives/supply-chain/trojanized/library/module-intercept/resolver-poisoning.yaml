# Context-gated resolver poisoning (sabotage loaders).
#
# The load-from-cwd-or-npm 3.0.2 sabotage probed the module-parent chain
# for an npm-cli checkout (or a nearby .git, so source checkouts would not
# reproduce it), then resolved the "module" to a PassThrough stream class
# it had seeded into its own resolver task list. Outside the target
# context the installer received a stream where it expected the request
# module and the download silently went nowhere. Both legs below are
# mechanism, not campaign strings: any loader that sniffs its checkout
# context and stages a non-module inside the pipeline it awaits is the
# same sabotage shape, whatever the stream class or the caller.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1485

traits:
  # Both atoms below are one leg of the sabotage signature and say nothing on
  # their own, which is what `component` is for. As standalone `suspicious`
  # findings they claimed a resolver was being poisoned on evidence that cannot
  # establish it: `[Readable]` is a tuple/index type in a TypeScript
  # declaration (`@types/node/readline.d.ts`), and `return results[0]` is one
  # of the most ordinary lines in JavaScript -- both turn up unremarkably in
  # the heroku CLI's bundled cheerio-select and @sentry/core transports. The
  # composites below supply the context probe and the pairing that make the
  # shape a verdict.
  - id: node-bracketed-stream-class
    desc: Bracketed Node stream class name
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\[(PassThrough|Readable|Duplex)\]'

  - id: node-indexed-results-return
    desc: Returns an indexed results array element
    crit: component
    conf: 0.85
    if:
      type: text
      regex: 'return\s+(results|tasks|outcomes)\[\d+\]'

composite_rules:
  - id: context-gated-resolver-poisoning
    desc: Context probe stages non-module resolver
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/anti-analysis/environment-detect/check::node-parent-chain-git-checkout-probe
      - id: node-bracketed-stream-class
