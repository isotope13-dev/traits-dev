# A dependency-free utility package that ships a cryptocurrency wallet drainer.
#
# This is what a compromised popular library looks like from the inside. The
# September 2025 npm attack pushed wallet-draining code into `ansi-styles`,
# `ansi-regex`, `chalk` and `debug` — packages that format terminal output, have
# no dependencies at all, and are pulled in transitively by most of the
# ecosystem. The victim never chose to install them.
#
# The contradiction is between the manifest and the payload. A package that
# genuinely works with wallets depends on something to do it — ethers, viem,
# web3, a chain SDK — because none of that is small enough to reimplement by
# accident. A package that declares no dependencies at all, and yet contains the
# ERC-20 approval-and-transfer surface, did not grow that capability as part of
# its own development. The test is on *runtime* dependencies — build tooling in
# `devDependencies` is normal and ships to nobody.
#
# Deliberately not keyed to any package name. Naming `ansi-styles` would detect
# exactly one week of one campaign; the shape — zero declared dependencies plus
# an injected wallet capability — is what the next compromise of the next
# micro-utility will also have. The drainer half is detected on its own in
# `impact/crypto-manipulation`; this rule is about *where it was found*, which
# is a different fact and the one that says "compromised release" rather than
# "malicious package".
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, archives]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: dependency-free-package-ships-wallet-drainer
    desc: Dependency-free package ships a wallet drainer
    crit: hostile
    conf: 0.94
    scope: archive
    all:
      # Runtime dependencies, not devDependencies: what ships is what matters,
      # and a micro-utility legitimately carries build-time tooling.
      - id: metadata/package/dependencies/manifest::npm-no-runtime-dependencies
      - id: objectives/impact/crypto-manipulation/transfer-hijack::obfuscated-erc20-transfer-surface
