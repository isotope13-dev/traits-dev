# A library that rebinds a Rack component's request entry point and evaluates
# decoded cookie data has turned every request into a code channel.
defaults:
  for: [ruby]
  platforms: [unix, windows]

composite_rules:
  - id: ruby-rack-call-patch-cookie-eval
    desc: Patches Rack call to eval cookie code
    crit: hostile
    conf: 0.97
    attack: T1505.003,T1195.002
    all:
      - id: micro-behaviors/metaprogramming/generation/transform::ruby-send-alias-call-method
      - id: micro-behaviors/metaprogramming/generation/transform::ruby-send-define-call-method
      - id: objectives/command-and-control/backdoor/webshell/intercept/module::ruby-decoded-cookie-eval-flow
      - id: well-known/lib/web/server/rack::rack-library-requires
