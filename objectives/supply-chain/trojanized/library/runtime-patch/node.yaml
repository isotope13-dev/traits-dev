# A package that locates ANOTHER installed module with require.resolve and
# rewrites that module's source on disk. The edit lands in the victim's
# node_modules where no lockfile or registry hash covers it, and it survives
# after the patching package is removed. rate-map 1.0.3 resolved `dl-tar` by
# a byte-array-encoded name and deleted the `cb(null, chunk)` line that
# forwards data, breaking the purescript installer's download stream.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1554

composite_rules:
  # An installed dependency can be patched without require.resolve(): locate a
  # package under node_modules, read its entry source, then overwrite that path
  # with the original source plus injected code. Legitimate patch tooling can
  # use the same mechanism, so the target-and-append shape is suspicious until
  # the injected payload supplies malicious intent.
  - id: installed-module-source-append
    desc: Appends code to an installed Node module
    crit: suspicious
    conf: 0.94
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/reference::node-modules-directory-literal
      - id: micro-behaviors/fs/read/file/full::readfilesync-call
      - id: micro-behaviors/fs/write/file/append::write-file-sync-concatenated-values
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/scaffold::node-project-scaffold-template-writer
      - id: metadata/package/description/function::description-ai-coding-orchestrator
      - id: well-known/app/ai/coding-agent/0xray::archive-context

  # Combining the installed-module append with a credential-bearing callback
  # payload captures the durable dependency injection shown in the campaign.
  # The callback service is intentionally generic so another package, runtime,
  # or credential family using the same technique is still detected.
  - id: installed-module-credential-exfil-injection
    desc: Injects credential-exfiltration code into an installed module
    crit: hostile
    conf: 0.99
    scope: file
    near_bytes: 8192
    attack: T1195.002,T1554,T1552.001,T1041
    all:
      - id: installed-module-source-append
      - id: micro-behaviors/data/serialize/json::json-stringify-env-access-body
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: objectives/exfiltration/oob/endpoint::oob-endpoint-any

  # The write leg is deliberately the in-place edit shape
  # (`writeFileSync(p, readFileSync(p).replace(...))`), not any file write:
  # a compiler CLI that probes an optional dependency with require.resolve
  # and writes its user-specified `--output` file (handlebars' precompiler
  # resolving uglify-js, then writing compiled templates) is not rewriting
  # another module's source. The read-modify-write-back of one path is the
  # patch technique rate-map used to delete the forwarding line.
  - id: installed-module-source-patch
    desc: Rewrites another installed module's source on disk
    crit: suspicious
    conf: 0.92
    scope: file
    all:
      - id: micro-behaviors/os/module/require::node-require-resolve-call
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
    any:
      - id: micro-behaviors/fs/write/file/full::node-read-replace-write-in-place
      - id: micro-behaviors/fs/path/construct::dependency-library-javascript-path
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/scaffold::node-project-scaffold-template-writer
  - id: covert-installed-module-patch
    desc: Covertly patches an installed module and hides its own edit
    crit: hostile
    conf: 0.97
    all:
      - id: installed-module-source-patch
    any:
      - id: objectives/anti-static/obfuscation/string/encoding::js-byte-array-encoded-require
      - id: objectives/anti-analysis/self-modify/runtime::node-rewrites-own-source-file
      - id: objectives/anti-analysis/environment-detect/check::node-parent-chain-git-checkout-probe
  - id: installed-module-channel-injection
    desc: Patches an installed module with unauthorized channel follow
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: installed-module-source-patch
      - id: micro-behaviors/communications/messaging/channel::whatsapp-newsletter-follow-query

  - id: patched-baileys-remote-newsletter-auto-follow
    desc: Patched Baileys auto-follows remotely configured channels
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: installed-module-channel-injection
      - id: objectives/impact/ui/manipulation/social::remote-delayed-whatsapp-newsletter-follow
