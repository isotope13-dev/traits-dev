defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript, typescript, php, whl]
  attack: T1195.002,T1491

composite_rules:
  - id: bundled-library-regional-browser-sabotage
    desc: Package vendors SweetAlert2 regional UI and audio sabotage
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: objectives/impact/ui/manipulation/browser::bundled-sweetalert2-regional-sabotage
      - id: well-known/unwanted/sweetalert2-protestware::sweetalert2-regional-browser-sabotage
    unless:
      - id: metadata/package/documentation/claims::disclosed-sweetalert2-regional-routine-release
      - id: metadata/package/name/identity::npm-publish-root-sweetalert2-manifest

  # Applications vendor the minified bundle directly (Electron app.asar,
  # static asset folders) with no package manifest beside it, so the
  # manifest-gated rule above never sees the archive context. The bundle's
  # own release banner or minified global export plus the full routine
  # identify the trojanized release.
  - id: vendored-sweetalert2-sabotage-release
    desc: Vendored SweetAlert2 release carries sabotage routine
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    scope: file
    all:
      - id: well-known/unwanted/sweetalert2-protestware::sweetalert2-protestware-bundle
    any:
      - id: well-known/lib/ui/sweetalert2::sweetalert2-version
      - id: well-known/lib/ui/sweetalert2::sweetalert2-export-alias
    unless:
      - id: metadata/package/documentation/claims::disclosed-sweetalert2-regional-routine-release
    downgrade:
      scope: archive
      any:
        - id: objectives/impact/ui/manipulation/browser::extension-origin-only-regional-routine
        - id: objectives/impact/ui/manipulation/browser::python-node-text-wasm-extraction
