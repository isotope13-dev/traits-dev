defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript, typescript, php, whl]
  attack: T1195.002,T1491

composite_rules:
  - id: bundled-library-regional-browser-sabotage
    desc: Package vendors SweetAlert2 regional UI and audio sabotage
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: objectives/impact/ui/manipulation/browser::bundled-sweetalert2-regional-sabotage
      - id: well-known/unwanted/sweetalert2-protestware::sweetalert2-regional-browser-sabotage
    unless:
      - id: metadata/package/documentation/claims::disclosed-sweetalert2-regional-routine-release
