defaults:
  platforms:
    - linux
    - macos
    - windows
traits:
  # telegram-word relocated to micro-behaviors/communications/http/services/telegram::telegram-service-name-reference.
  # Its matcher was the bare word "telegram", which fires on any README that links
  # a community chat or any manifest with a Telegram bot dependency; a brand name
  # is neutral catalog metadata, and "telegram word" restated the matched term
  # instead of telling an analyst anything. The two `any:` members below now
  # reference the relocated atom.
  # preinstall-hook was the bare `"preinstall":` keystroke filed as a trojanized
  # marker; it duplicates the canonical metadata/package/scripts/lifecycle::
  # raw-preinstall-key atom (same signal, tighter matcher), which the
  # install-hooks composite below now references directly.
  # require-* module-import atoms relocated to their canonical import homes
  # (metadata/import/builtin/node.yaml for core modules; metadata/import/package/
  # js-require.yaml for lodash/axios). These composites reference them cross-tier.
  - id: discord-io
    desc: discord.io string
    crit: notable
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      substr: discord.io
  - id: discord-client
    desc: Discord.Client string
    crit: notable
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      substr: Discord.Client
  - id: telegraf-str
    desc: telegraf string
    crit: notable
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      substr: telegraf
  - id: oast-str
    desc: oast string
    crit: component
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      word: oast
  - id: winston-str
    desc: winston string
    crit: component
    for:
      - javascript
      - typescript
    if:
      type: literal
      kind: string
      regex: '(?i)\bwinston\b'
  - id: pino-str
    desc: pino string
    crit: component
    for:
      - javascript
      - typescript
    if:
      type: literal
      kind: string
      regex: '(?i)\bpino\b'
  - id: bunyan-str
    desc: bunyan string
    crit: component
    for:
      - javascript
      - typescript
    if:
      type: literal
      kind: string
      regex: '(?i)\bbunyan\b'
  - id: log4js-str
    desc: log4js string
    crit: component
    for:
      - javascript
      - typescript
    if:
      type: literal
      kind: string
      regex: '(?i)\blog4js\b'
  - id: winston-test-helper
    desc: Winston test helper
    crit: notable
    for:
      - javascript
      - typescript
    if:
      type: text
      substr: "require('../lib/winston')"
composite_rules:
  - id: popular-libs
    desc: Popular library names
    crit: component
    for:
      - package.json
    # The package's own name, not a dependency. A Next.js app that depends
    # on react and downloads a tokenizer in postinstall is not a trojanized
    # copy of react.
    any:
      - id: well-known/lib/stdlib/lodash::package-name
      - id: well-known/lib/network/axios::axios-package-name
      - id: well-known/lib/web/server/express::package-name
      - id: well-known/lib/ui/react::npm-package-name
      - id: well-known/lib/network/discord-js::npm-package-name
      - id: well-known/lib/network/discord-js::manifest-name
      - id: well-known/lib/observability/winston::package-name
      - id: well-known/lib/observability/pino::pino-package-name
  - id: install-hooks
    desc: NPM install hooks
    crit: component
    for: [javascript, package.json, typescript]
    any:
      - id: metadata/package/scripts/lifecycle::raw-preinstall-key
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: popular-lib-with-hooks
    desc: Popular library with unusual install hooks
    crit: suspicious
    conf: 0.85
    attack: T1195.001
    for:
      - package.json
    all:
      - id: popular-libs
    any:
      - id: micro-behaviors/communications/http/download/package::preinstall-download-tool
      - id: objectives/supply-chain/install-hook/scripts/postinstall::postinstall-download-tool
  - id: discord-indicators
    desc: Discord library indicators
    crit: component
    for:
      - javascript
      - typescript
    any:
      - id: metadata/import/package::discord-js-import
      - id: discord-io
      - id: discord-client
  - id: discord-tokens
    desc: Discord client-token storage indicators
    crit: component
    for:
      - javascript
      - typescript
    all:
      - id: discord-indicators
      - id: micro-behaviors/fs/path/app-data::discord-local-storage-path
    any:
      - id: micro-behaviors/fs/path/config/app::discord-local-state-path
      - id: objectives/credential-access/discord/token::appdata-ref
  - id: steal-indicators
    desc: Discord client-token storage access
    crit: component
    for:
      - javascript
      - typescript
    any:
      - id: micro-behaviors/fs/path/app-data::discord-local-storage-path
      - id: micro-behaviors/fs/path/config/app::discord-local-state-path
  - id: exfil-indicators-comp
    desc: Sends data to a Discord webhook
    crit: component
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-request-builder
      - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: discord-library
    desc: Discord library steals client tokens to a webhook
    crit: suspicious
    conf: 0.9
    attack: T1195.001
    mbc: B0024
    for:
      - javascript
      - typescript
    all:
      - id: discord-indicators
      - id: discord-tokens
      - id: exfil-indicators-comp
      - id: steal-indicators
    near_bytes: 4096
  - id: logging-indicators
    desc: References a Node logging library
    crit: component
    for:
      - javascript
      - typescript
    any:
      - id: winston-str
      - id: pino-str
      - id: bunyan-str
      - id: log4js-str
  - id: two-logging-suspicious
    desc: Multiple process or sensitive-file additions in logging library context
    crit: notable
    for:
      - javascript
      - typescript
    needs: 2
    near_bytes: 4096
    all:
      - id: logging-indicators
    any:
      - id: micro-behaviors/os/module/require::child-process-require
      - id: micro-behaviors/process/create/spawn::spawn-call
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd
  - id: sdk-indicators
    desc: SDK/API client indicators
    crit: component
    for:
      - javascript
      - typescript
      - package.json
    any:
      - id: metadata/package/name/vocabulary::npm-sdk-suffix
      - id: metadata/package/name/vocabulary::npm-client-suffix
      - id: metadata/package/name/vocabulary::npm-api-suffix
  - id: sdk-suspicious-activity
    desc: SDK suspicious activity
    crit: component
    for:
      - javascript
      - typescript
      - package.json
    any:
      - id: micro-behaviors/communications/http/curl::curl-command-url-or-option
      - id: micro-behaviors/communications/http/download/wget::wget-cmd
      - id: micro-behaviors/communications/http/download/package::npm-script-download
      - id: micro-behaviors/process/user/query::os-userinfo-call
  - id: sdk-client
    desc: Trojanized SDK or API client
    crit: suspicious
    conf: 0.8
    attack: T1195.001
    for:
      - javascript
      - typescript
      - package.json
    all:
      - id: sdk-indicators
      - id: objectives/supply-chain/trojanized/library/framework::install-hooks
      - id: sdk-suspicious-activity
  - id: crypto-library-indicators
    desc: Cryptocurrency library indicators
    crit: component
    for:
      - javascript
      - typescript
    any:
      - id: micro-behaviors/crypto/library/blockchain/transaction::ethers-library-reference
      - id: micro-behaviors/crypto/library/blockchain/transaction::web3-library-import
      - id: objectives/impact/cryptojacking/miner/signatures::wallet-ref
      - id: objectives/impact/ransom/encrypt/threat-text::bitcoin-word
      - id: micro-behaviors/crypto/library/blockchain/transaction::solana-library-reference
  - id: key-theft-indicators
    desc: Key theft patterns
    crit: component
    for:
      - javascript
      - typescript
    any:
      - id: micro-behaviors/os/env/secret-name::javascript-private-key-environment-variable
      - id: objectives/credential-access/env/secrets/wallet
      - id: micro-behaviors/crypto/key/representation::node-key-object-api-reference
      - id: micro-behaviors/fs/path/wallet::keystore-file
  - id: crypto-library
    desc: Trojanized cryptocurrency library
    crit: suspicious
    conf: 0.9
    attack: T1195.001
    mbc: B0024
    for:
      - javascript
      - typescript
    size_max: 262144
    all:
      - id: crypto-library-indicators
      - id: key-theft-indicators
      - id: oast-str
    unless:
      - id: well-known/tool/development/cli/socket-cli::socket-dev-cli-bundle
      - id: well-known/tool/development/cli/socket-cli::socket-dev-cli-vendored-path
  - id: suspicious-trojanized-framework
    desc: Likely trojanized framework with embedded payload and suspicious capabilities
    crit: suspicious
    conf: 0.9
    attack: T1195.001
    mbc: B0024
    for: [macho]
    all:
      - id: well-known/lib/format/protobuf::protobuf-framework-marker
      - id: micro-behaviors/data/embedded/payload/compression::lzma-magic
      - id: micro-behaviors/communications/http/delete::delete
  - id: trojanized-framework-networked
    desc: Trojanized framework with network and payload capabilities
    crit: suspicious
    conf: 0.92
    attack: T1195.001
    mbc: B0024
    for: [macho]
    all:
      - id: suspicious-trojanized-framework
      - id: micro-behaviors/communications/socket/bind/function::bind
  - id: trojanized-framework-with-c2
    desc: Trojanized framework with command & control indicators
    crit: hostile
    conf: 0.95
    attack: T1195.001
    mbc: B0024
    for:
      - macho
    all:
      - id: trojanized-framework-networked
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
  - id: nanopb-with-ios-injection
    desc: Protobuf library with iOS code injection framework
    crit: suspicious
    conf: 0.85
    attack: T1195.001
    mbc: B0024
    for:
      - macho
      - ipa
    all:
      - id: well-known/lib/format/protobuf::nanopb-runtime-marker
      - id: objectives/evasion/process/injection/runtime::cbinjection-framework
