defaults:
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: telegram-word
    desc: telegram word
    crit: component
    for:
      - package.json
      - javascript
      - typescript
    unless:
      - id: well-known/app/ai/gateway/opencode-router
    if:
      type: text
      word: telegram
      case_insensitive: true
  - id: preinstall-hook
    desc: preinstall hook
    crit: component
    for:
      - package.json
    if:
      type: text
      substr: '"preinstall":'
  # require-* module-import atoms relocated to their canonical import homes
  # (metadata/import/builtin/node.yaml for core modules; metadata/import/package/
  # js-require.yaml for lodash/axios). These composites reference them cross-tier.
  - id: discord-js
    desc: discord.js string
    crit: component
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      substr: discord.js
  - id: discord-io
    desc: discord.io string
    crit: component
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      substr: discord.io
  - id: discord-client
    desc: Discord.Client string
    crit: component
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      substr: Discord.Client
  - id: telegraf-str
    desc: telegraf string
    crit: component
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      substr: telegraf
  - id: oast-str
    desc: oast string
    crit: component
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      word: oast
  - id: webhook-site-str
    desc: webhook.site string
    crit: component
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      substr: webhook.site
  - id: winston-str
    desc: winston string
    crit: component
    for:
      - javascript
      - typescript
    if:
      type: literal
      kind: string
      regex: '(?i)\bwinston\b'
  - id: pino-str
    desc: pino string
    crit: component
    for:
      - javascript
      - typescript
    if:
      type: literal
      kind: string
      regex: '(?i)\bpino\b'
  - id: bunyan-str
    desc: bunyan string
    crit: component
    for:
      - javascript
      - typescript
    if:
      type: literal
      kind: string
      regex: '(?i)\bbunyan\b'
  - id: log4js-str
    desc: log4js string
    crit: component
    for:
      - javascript
      - typescript
    if:
      type: literal
      kind: string
      regex: '(?i)\blog4js\b'
  - id: winston-test-helper
    desc: Winston test helper
    crit: notable
    for:
      - javascript
      - typescript
    if:
      type: text
      substr: "require('../lib/winston')"
  - id: client-word
    desc: '"Client" word literal'
    crit: component
    for:
      - javascript
      - typescript
      - package.json
    if:
      type: text
      word: Client
    unless:
      # Generated documentation may discuss client-side integrations without
      # being an SDK/library package under review.
      - id: metadata/file/profile/identity::docusaurus-docs-bundle
composite_rules:
  - id: popular-libs
    desc: Popular library names
    crit: component
    for:
      - package.json
    any:
      - id: metadata/package/dependencies/manifest::npm-dep-lodash
      - id: micro-behaviors/communications/http/lib/axios::axios
      - id: metadata/package/dependencies/manifest::npm-dep-express
      - id: metadata/package/dependencies/manifest::npm-dep-react
      - id: metadata/package/dependencies/manifest::npm-dep-discord
      - id: telegram-word
      - id: metadata/package/dependencies/manifest::npm-dep-winston
      - id: metadata/package/dependencies/manifest::npm-dep-pino
  - id: install-hooks
    desc: NPM install hooks
    crit: component
    for:
      - package.json
    any:
      - id: preinstall-hook
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-postinstall
  - id: network-cmds
    desc: Network download commands
    crit: component
    for:
      - package.json
    any:
      - id: micro-behaviors/communications/http/download/curl::curl-invoked-with-url-or-option
      - id: objectives/command-and-control/beacon/network/client-cli::wget-cmd-dup
  - id: popular-lib-with-hooks
    desc: Popular library with unusual install hooks
    crit: suspicious
    conf: 0.85
    attack: T1195.001
    for:
      - package.json
    all:
      - id: popular-libs
      - id: install-hooks
      - id: network-cmds
  - id: library-child-process-network
    desc: Library network code executes child processes
    crit: suspicious
    conf: 0.85
    attack: T1195.001
    for:
      - javascript
    # Child-process execution is required, not optional: with it in `any:` the
    # rule fired on Node CLI helpers that only import system modules and shell
    # out (vscode-languageserver's deprecated installServerIntoExtension runs
    # `npm update` and never touches the network), which the name and
    # description do not claim.
    all:
      - id: micro-behaviors/os/module/load::node-system-module-import-set
      - id: micro-behaviors/process/create/shell/bridge::child-process-exec
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/client::generic-request-method-call
    near_bytes: 4096
    unless:
      - id: metadata/package/testing/harness/runtime::test-basename-pattern
      - id: library-child-process-network-known-context
      - id: official-browser-driver-ci-download-context
      - id: metadata/library/structure::vscode-source-entrypoint
      # Next.js's diagnostic CLI intentionally queries its public release tags
      # and probes local tool versions with child processes.
      - id: well-known/lib/web/nextjs::next-info-cli
      - id: nvidia-nim-gpu-probe-context
  # These recognized toolchain/library contexts legitimately combine HTTP
  # requests with local process probes. Keep them as one named suppressor so
  # the host heuristic remains auditable without a long exception list.
  - id: library-child-process-network-known-context
    desc: Recognized library and toolchain child-process network context
    crit: exception
    conf: 0.99
    any:
      - id: well-known/app/media/node-red-hik-media-buffer::hik-media-buffer-context
      - id: metadata/library/vscode::vscode-extension-marker
      - id: well-known/tool/development/vscode/vsce-sign::package-path
      - id: well-known/app/ai/media/pinokio::app-bundle
      - id: well-known/app/ai/coding-agent/omnius::daemon-script-context
      - id: micro-behaviors/os/network/interface::node-exec-net-use-enumeration
      - id: well-known/lib/ui/vite/
      - id: well-known/lib/development/esbuild::esbuild-package-context
  # CI setup helpers legitimately combine a local archive command with a
  # download from the browser vendor's official driver release endpoint.
  - id: official-browser-driver-ci-download-context
    desc: CI helper downloads an official browser driver release
    crit: exception
    conf: 0.99
    all:
      - id: well-known/app/development/dev-tool-downloads::official-browser-driver-download-urls
      - id: micro-behaviors/os/env/vars/cicd::github-env-file
  # NVIDIA NIM / catalog clients probe local GPUs with nvidia-smi while calling
  # the cloud chat-completions API — network + child_process without trojanizing.
  - id: nvidia-nim-gpu-probe-context
    desc: NVIDIA NIM client probes GPUs via nvidia-smi
    crit: exception
    conf: 0.99
    all:
      - id: micro-behaviors/os/sysinfo/hardware::nvidia-smi-query-gpu
      - id: micro-behaviors/communications/http/llm::llm-chat-completions-path
  - id: discord-indicators
    desc: Discord library indicators
    crit: component
    for:
      - javascript
      - typescript
    any:
      - id: discord-js
      - id: discord-io
      - id: discord-client
  - id: discord-tokens
    desc: Discord client-token storage indicators
    crit: component
    for:
      - javascript
      - typescript
    all:
      - id: discord-indicators
      - id: objectives/credential-access/discord/token::localstorage-path
    any:
      - id: objectives/credential-access/discord/token::local-state-path
      - id: objectives/credential-access/discord/token::appdata-ref
  - id: steal-indicators
    desc: Discord client-token storage access
    crit: component
    for:
      - javascript
      - typescript
    any:
      - id: objectives/credential-access/discord/token::localstorage-path
      - id: objectives/credential-access/discord/token::local-state-path
  - id: exfil-indicators-comp
    desc: Sends data to a Discord webhook
    crit: component
    for:
      - javascript
      - typescript
    all:
      - id: objectives/exfiltration/messaging/discord::discord-request-builder
      - id: micro-behaviors/communications/http/request/client::post-method-text
  - id: discord-library
    desc: Discord library steals client tokens to a webhook
    crit: suspicious
    conf: 0.9
    attack: T1195.001
    mbc: B0024
    for:
      - javascript
      - typescript
    all:
      - id: discord-indicators
      - id: discord-tokens
      - id: exfil-indicators-comp
      - id: steal-indicators
    near_bytes: 4096
  - id: telegram-indicators
    desc: Telegram library indicators
    crit: component
    for:
      - javascript
      - typescript
    any:
      - id: telegram-word
      - id: telegraf-str
      - id: objectives/command-and-control/backdoor/keywords::malware-bot-tool-suffix
  - id: malicious-process-calls
    desc: Malicious process execution calls
    crit: component
    for:
      - javascript
      - typescript
    any:
      - id: micro-behaviors/process/create/shell/bridge::child-process-require
      - id: micro-behaviors/process/create/spawn::spawn-call
      - id: objectives/command-and-control/dropper/builder::exec-paren
  - id: oob-exfil-indicators
    desc: Out-of-band exfiltration indicators
    crit: component
    for:
      - javascript
      - typescript
    any:
      - id: oast-str
      - id: webhook-site-str
  - id: telegram-library
    desc: Trojanized Telegram library patterns
    crit: suspicious
    unless:
      - id: well-known/tool/offensive/pentestkit/
    conf: 0.9
    attack: T1195.001
    mbc: B0024
    for:
      - javascript
      - typescript
    all:
      - id: telegram-indicators
      - id: malicious-process-calls
      - id: oob-exfil-indicators
  - id: logging-indicators
    desc: References a Node logging library
    crit: component
    for:
      - javascript
      - typescript
    any:
      - id: winston-str
      - id: pino-str
      - id: bunyan-str
      - id: log4js-str
  - id: two-logging-suspicious
    desc: Multiple process or sensitive-file additions in logging library context
    crit: notable
    for:
      - javascript
      - typescript
    needs: 2
    near_bytes: 4096
    all:
      - id: logging-indicators
    any:
      - id: micro-behaviors/process/create/shell/bridge::child-process-require
      - id: micro-behaviors/process/create/spawn::spawn-call
      - id: objectives/anti-static/obfuscation/payload/bytecode::exec-word
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd
  - id: sdk-indicators
    desc: SDK/API client indicators
    crit: component
    for:
      - javascript
      - typescript
      - package.json
    any:
      - id: metadata/package/manifest/name::npm-sdk-suffix
      - id: metadata/package/manifest/name::npm-client-suffix
      - id: metadata/package/manifest/name::npm-api-suffix
      - id: client-word
  - id: sdk-install-hooks
    desc: SDK install hooks
    crit: component
    for:
      - javascript
      - typescript
      - package.json
    any:
      - id: preinstall-hook
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-postinstall
  - id: sdk-suspicious-activity
    desc: SDK suspicious activity
    crit: component
    for:
      - javascript
      - typescript
      - package.json
    any:
      - id: micro-behaviors/communications/http/download/curl::curl-invoked-with-url-or-option
      - id: objectives/command-and-control/beacon/network/client-cli::wget-cmd-dup
      - id: micro-behaviors/process/user/query::os-userinfo-call
  - id: sdk-client
    desc: Trojanized SDK or API client
    crit: suspicious
    conf: 0.8
    attack: T1195.001
    for:
      - javascript
      - typescript
      - package.json
    all:
      - id: sdk-indicators
      - id: sdk-install-hooks
      - id: sdk-suspicious-activity
  - id: crypto-library-indicators
    desc: Cryptocurrency library indicators
    crit: component
    for:
      - javascript
      - typescript
    any:
      - id: micro-behaviors/crypto/library/blockchain/transaction::ethers-library-reference
      - id: micro-behaviors/crypto/library/blockchain/transaction::web3-library-import
      - id: objectives/impact/cryptojacking/miner/signatures::wallet-ref
      - id: objectives/impact/ransom/encrypt/threat-text::bitcoin-word
      - id: micro-behaviors/crypto/library/blockchain/transaction::solana-library-reference
  - id: key-theft-indicators
    desc: Key theft patterns
    crit: component
    for:
      - javascript
      - typescript
    any:
      - id: micro-behaviors/os/env/vars/credentials::javascript-private-key-environment-variable
      - id: objectives/credential-access/env/secrets/wallet
      - id: micro-behaviors/crypto/library/provider::key-object-create
      - id: objectives/credential-access/wallet/mnemonic::keystore-file
  - id: crypto-library
    desc: Trojanized cryptocurrency library
    crit: suspicious
    conf: 0.9
    attack: T1195.001
    mbc: B0024
    for:
      - javascript
      - typescript
    size_max: 262144
    all:
      - id: crypto-library-indicators
      - id: key-theft-indicators
      - id: oast-str
    unless:
      - id: well-known/tool/development/socket-cli::socket-dev-cli-bundle
      - id: well-known/tool/development/socket-cli::socket-dev-cli-vendored-path
  - id: suspicious-trojanized-framework
    desc: Likely trojanized framework with embedded payload and suspicious capabilities
    crit: suspicious
    conf: 0.9
    attack: T1195.001
    mbc: B0024
    for:
      - macho
      - elf
    all:
      - id: well-known/lib/format/protobuf::protobuf-framework-marker
      - id: micro-behaviors/data/embedded/payload/compression::lzma-magic
      - id: micro-behaviors/communications/http/delete::delete
  - id: trojanized-framework-networked
    desc: Trojanized framework with network and payload capabilities
    crit: suspicious
    conf: 0.92
    attack: T1195.001
    mbc: B0024
    for:
      - macho
      - elf
    all:
      - id: suspicious-trojanized-framework
      - id: micro-behaviors/communications/socket/bind/function::bind
  - id: trojanized-framework-with-c2
    desc: Trojanized framework with command & control indicators
    crit: hostile
    conf: 0.95
    attack: T1195.001
    mbc: B0024
    for:
      - macho
      - elf
    all:
      - id: trojanized-framework-networked
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
  - id: nanopb-with-ios-injection
    desc: Protobuf library with iOS code injection framework
    crit: suspicious
    conf: 0.85
    attack: T1195.001
    mbc: B0024
    for:
      - macho
      - ipa
    all:
      - id: well-known/lib/format/protobuf::nanopb-runtime-marker
      - id: objectives/evasion/process/injection/runtime::cbinjection-framework
