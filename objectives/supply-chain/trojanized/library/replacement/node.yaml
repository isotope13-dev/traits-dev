# A package that identifies parent node_modules and plants synthetic proxy or
# shim packages to hijack imports of sibling or upstream libraries.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript, package.json, npm, tar, zip]
  attack: T1195.002,T1554

traits:
  - id: node-locates-parent-node-modules-dir
    desc: Locates parent node_modules directory
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)path\.(basename|resolve|join)[^;\n]{0,60}[''"]node_modules[''"]'

  - id: node-writes-relative-proxy-package-json
    desc: Proxy manifest with relative entrypoint
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      case_insensitive: true
      regex: '["'']?\b(main|module|exports)["'']?\s*:\s*[`"''](\$\{[^}]{1,30}\}|\.\.?)/'

  - id: node-writes-module-reexport-stub
    desc: Writes module re-export or delegation stub
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)writeFile[A-Za-z]*\([^;]{0,80}(export\s+\*\s+from|module\.exports\s*=)'

composite_rules:
  # Test fixtures, plugin-runtime staging and bundler shims build the same
  # node_modules proxies; only the install-hook composite below is hostile.
  - id: node-modules-proxy-package-planting
    desc: Plants proxy package in node_modules
    crit: suspicious
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: node-locates-parent-node-modules-dir
      - id: micro-behaviors/fs/directory/create::recursive-mkdir-sync
    any:
      - id: node-writes-relative-proxy-package-json
      - id: node-writes-module-reexport-stub
    unless:
      - id: metadata/package/testing/presence/harness::spec-test-filename

  - id: npm-lifecycle-node-modules-proxy-implant
    desc: Postinstall plants proxy in node_modules
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: objectives/supply-chain/trojanized/library/replacement::node-modules-proxy-package-planting
    # A source monorepo with hundreds of files stages its own plugin runtime
    # and fixtures; the hook is not bound to that writer.
    downgrade:
      scope: archive
      any:
        - id: metadata/archive/layout::archive-at-least-500-members
