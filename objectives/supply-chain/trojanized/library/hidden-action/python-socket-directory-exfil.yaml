defaults:
  platforms: [unix, windows]
  # Include the archive container and the Python member type that supplies
  # the exfiltration and package-import evidence.
  for: [whl, python]
  attack: T1195.002,T1041,T1083
  mbc: E1041

composite_rules:
  - id: python-init-imports-core
    desc: Package initializer imports the core module
    crit: component
    conf: 0.98
    for: [python]
    scope: file
    all:
      - id: metadata/file/size::init-py-file
      - id: metadata/import/python/relative/1/core::relative/1/core

  - id: python-imported-library-exports-directory-inventory
    desc: Wheel import sends a directory listing over a socket
    crit: hostile
    conf: 0.99
    scope: outer
    all:
      - id: metadata/package/ecosystem::wheel-archive-member
      - id: python-init-imports-core
      - id: objectives/exfiltration/stealer/directory-listing::python-directory-listing-socket-exfil
