# The npm-bs58.js releases retain the upstream bs58 repository claim and
# encoder surface, but route its alphabet through base128-x58/base64-x58.
# Those dependencies add a Telegram request to decode(), which exports the
# caller's input. The outer package does not contain that dependency source,
# so package-scope detection uses its upstream claim and wrapper evidence.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  attack: T1195.002,T1041

traits:
  - id: npm-bs58-upstream-repository-claim
    desc: Claims cryptocoinjs bs58 repository
    crit: component
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com[/:]cryptocoinjs/bs58(\.git)?'

  - id: npm-bs58-x58-wrapper-import
    desc: Imports x58 base encoder dependency
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: symbol
      kind: import
      regex: '^base(128|64)-x58$'

  - id: canonical-base58-alphabet-literal
    desc: Canonical base58 alphabet literal
    crit: component
    conf: 0.99
    for: [javascript]
    if:
      type: text
      substr: '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'

composite_rules:
  - id: npm-bs58-delegates-to-telegram-stealer
    desc: bs58 clone delegates keys to Telegram stealer
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: npm-bs58-upstream-repository-claim
      - id: npm-bs58-x58-wrapper-import
      - id: canonical-base58-alphabet-literal
      - id: metadata/package/repository::npm-name-repo-mismatch
