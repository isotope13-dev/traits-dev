defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1222.002,T1195.002
  mbc: E1222

composite_rules:
  # A published library that sets 0755 on a dot-relative file named by a
  # default argument changes the mode of whatever file an attacker placed in
  # the caller's working directory. The save helper has no install purpose for
  # that chmod, so the exec bit is a hidden staging step.
  - id: node-default-dot-name-exec-bit-stage
    desc: Library sets 0755 on default dot-relative file
    crit: hostile
    conf: 0.9
    near_lines: 12
    all:
      - id: micro-behaviors/fs/chmod/executable/hidden::js-default-dot-relative-name
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
