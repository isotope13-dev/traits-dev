defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript, typescript]
  attack: T1195.002

composite_rules:
  # Some trojanized Baileys forks ship an isolated helper instead of wiring
  # it into the socket factory. The helper still registers a connection-open
  # callback that follows a publisher-selected invite with the consumer's
  # authenticated session. Tie that behavior to the republished library so
  # the file-level behavior finding is actionable at package triage.
  - id: whatsapp-fork-ships-connect-time-invite-follow-helper
    desc: Baileys fork ships a connect-time invite auto-follow helper
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: well-known/lib/network/npm-packages/baileys::baileys-library-identity
      - id: objectives/impact/ui/manipulation/social/channel-follow::whatsapp-session-open-follows-invite-code

  - id: whatsapp-fork-hidden-connect-newsletter-follow
    desc: WhatsApp library fork injects hidden connect-time newsletter follow
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/network/npm-packages/baileys::baileys-library-identity
    any:
      - id: objectives/supply-chain/trojanized/library/fork-branding::whatsapp-library-fork-connect-hardcoded-newsletter-follow
      - id: objectives/impact/ui/manipulation/social/channel-follow::connect-time-hardcoded-newsletter-follow
      - id: objectives/impact/ui/manipulation/social/channel-follow::connect-immediate-hardcoded-newsletter-follow
      - id: objectives/impact/ui/manipulation/social/channel-follow::whatsapp-session-open-follows-invite-code
  - id: whatsapp-fork-periodic-connect-newsletter-follow
    desc: WhatsApp library fork injects periodic connect-time newsletter follow
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: objectives/impact/ui/manipulation/social/channel-follow::connect-periodic-preset-newsletter-follow
      - id: objectives/supply-chain/trojanized/library/fork-branding::whatsapp-library-fork-session-open-periodic-hardcoded-follow

  # The connection-open listener in a republished Baileys tree dispatches a
  # decoded fixed JID roster through raw FOLLOW and MUTE queries. This path
  # does not call the decoded newsletterFollow/newsletterMute helper names.
  - id: whatsapp-fork-concealed-roster-connect-follow-and-mute
    desc: Baileys fork follows and mutes hidden channels on connect
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: well-known/lib/network/npm-packages/baileys::baileys-library-identity
      - id: micro-behaviors/data/control-flow/event-callback::connection-update-handler-registration
      - id: metadata/lang/source/syntax/conditional::connection-open-comparison
      - id: micro-behaviors/communications/messaging/channel/whatsapp/newsletter::whatsapp-newsletter-charcode-jid-suffix
      - id: micro-behaviors/communications/messaging/channel/whatsapp/newsletter::whatsapp-newsletter-roster-follow-loop
      - id: micro-behaviors/communications/messaging/channel/whatsapp/newsletter::whatsapp-wmex-newsletter-query
      - id: micro-behaviors/communications/messaging/channel/whatsapp/newsletter::whatsapp-newsletter-follow-mute-selector-pair
