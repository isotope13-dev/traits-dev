defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript, typescript]
  attack: T1195.002,T1041,T1567.002
  mbc: E1041

composite_rules:
  # A package that claims another project while forwarding caller data from
  # its library API is a trojanized dependency, as well as an exfil channel.
  - id: npm-repo-mismatch-library-input-telegram-exfil
    desc: Repo-mismatched npm library exfiltrates function inputs
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: metadata/package/repository::npm-name-repo-mismatch
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: objectives/exfiltration/messaging/telegram/encoded-payload::function-input-posted-to-telegram
