defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript, typescript]
  attack: T1195.002,T1539,T1041

composite_rules:
  # The package entrypoint launches a detached, silent sidecar whose code
  # collects and uploads Telegram Desktop sessions. Keep this separate from
  # the file-level exfiltration finding: together they explain the supply-chain
  # delivery and the stolen application state.
  - id: npm-import-detaches-telegram-session-stealer
    desc: npm import silently launches Telegram session stealer
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: objectives/exfiltration/stealer/application-state::node-telegram-tdata-session-archive-upload
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
      - id: metadata/package/entrypoint/module::main-root-javascript-entry
