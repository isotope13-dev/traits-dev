defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: T1195.002,T1105

composite_rules:
  - id: rust-library-detached-git-worker-loader
    desc: Rust library installs and launches a detached Git worker
    crit: hostile
    conf: 0.95
    near_bytes: 1800
    all:
      - id: micro-behaviors/os/package-manager/runtime-install::cargo-install-git-command
      - id: micro-behaviors/process/daemonize/spawn::rust-spawn-detached
      - id: micro-behaviors/process/create/subprocess/launch::rust-command-spawn-call
      - id: micro-behaviors/process/create/subprocess/launch::rust-command-status-call
