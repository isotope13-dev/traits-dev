defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript, typescript]
  attack: T1195.002,T1041

composite_rules:
  - id: npm-wallet-library-discord-webhook-exfil
    desc: Crypto wallet npm package sends private keys to Discord webhook
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: objectives/exfiltration/messaging/webhook::js-wallet-key-axios-discord-webhook
