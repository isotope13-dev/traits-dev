defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript, typescript]
  attack: T1195.002,T1041

traits:
  # The older published builds expose the key through console output rather
  # than a remote webhook. Keep the package-name IOC atomic; the hostile claim
  # below also requires the leaked key behavior in a shipped package member.
  - id: npm-litecore-lib-ltc-package-name
    desc: litecore-lib-ltc npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: npm.name
      exact: litecore-lib-ltc

composite_rules:
  - id: npm-litecoin-wallet-library-logs-private-key
    desc: Litecoin wallet package logs a private key
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: npm-litecore-lib-ltc-package-name
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: micro-behaviors/os/console/io::js-console-log-private-key-string

  - id: npm-wallet-library-discord-webhook-exfil
    desc: Crypto wallet npm package sends private keys to Discord webhook
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
    any:
      - id: objectives/exfiltration/messaging/webhook::js-wallet-key-axios-discord-webhook
      - id: objectives/exfiltration/messaging/webhook::js-wallet-key-https-discord-webhook
