# Trojanized-clone supply-chain implant: an attacker downloads an established
# library's source, grafts a payload, and republishes under the brand. In .NET
# the graft is a [ModuleInitializer] (see the auto-exec capability) that runs
# the instant the CLR loads the assembly -- before any consumer code -- and
# hands control to code delivered as a separately published, innocuously named
# NuGet dependency, all inside an empty catch so the host never notices.
#
# Sample: Braintree.Net typosquat (Socket, 2026). Braintree.DependencyInjectorLoader.Load()
# ([ModuleInitializer]) calls DependencyInjector.Core, the recon/exfil stage
# shipped as a dependency scoped to net8/9/10 only.
defaults:
  platforms: [windows, linux, macos]
  for: [pe, dll]
  attack: "T1195.001,T1195.002"
  mbc: B0024

traits:
  - id: dotnet-injector-loader-shim
    desc: Module-init dependency loader shim class
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: DependencyInjectorLoader
      section: text
  - id: dotnet-injected-analyzer-namespace
    desc: SDK invokes injected analyzer namespace
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: DependencyInjector.Core.Analysis
      section: text
  - id: dotnet-injector-core-reporting-namespace
    desc: DependencyInjector.Core reporting namespace
    crit: component
    conf: 0.95
    if:
      type: text
      substr: DependencyInjector.Core.Reporting
      section: text
  - id: nuspec-dependencyinjector-core-id
    desc: NuGet id DependencyInjector.Core
    crit: component
    conf: 0.98
    for: [xml, nupkg]
    if:
      type: text
      regex: '<id>DependencyInjector\.Core</id>'
  - id: nuspec-injected-payload-dependency
    desc: Manifest adds DependencyInjector.Core dep
    crit: suspicious
    conf: 0.9
    for: [xml, nupkg]
    if:
      type: text
      regex: '<dependency\s+id="DependencyInjector\.Core"'

composite_rules:
  # This combination is a strong provenance anomaly, but it does not by itself
  # establish what the initializer executes. Local source rebuilds and
  # legitimate libraries can both retain a Downloads PDB path and use a module
  # initializer, so reserve hostile severity for the injected-loader rule.
  - id: dotnet-trojanized-clone-autoexec
    desc: Downloaded-source rebuild auto-runs on assembly load
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/process/lifecycle/auto-exec::dotnet-module-initializer
      - id: metadata/binary/anomaly/provenance::pe-pdb-downloads-source-unpack
  - id: dotnet-module-init-injected-loader
    desc: Module init loads injected dependency
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/lifecycle/auto-exec::dotnet-module-initializer
      - id: dotnet-injector-loader-shim
      - id: dotnet-injected-analyzer-namespace
  - id: dotnet-module-init-recon-exfil-sdk
    desc: Module initializer performs environment recon and HTTP exfil
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1041,T1059.006
    all:
      - id: micro-behaviors/process/lifecycle/auto-exec::dotnet-module-initializer
      - id: dotnet-injector-core-reporting-namespace
      - id: micro-behaviors/os/network/interface::dotnet-network-interface-recon
      - id: micro-behaviors/communications/http/client/managed::request
  - id: nuget-dependencyinjector-core-recon-package
    desc: NuGet DependencyInjector.Core recon exfil package
    crit: hostile
    conf: 0.98
    for: [nupkg]
    scope: archive
    all:
      - id: nuspec-dependencyinjector-core-id
      - id: dotnet-module-init-recon-exfil-sdk
  - id: nuget-dependencyinjector-recon-exfil-sdk
    desc: NuGet lib package ships DependencyInjector recon exfil SDK
    crit: hostile
    conf: 0.97
    for: [nupkg]
    scope: archive
    all:
      - id: metadata/package/files/nuget::nupkg-managed-library-member
      - id: dotnet-module-init-recon-exfil-sdk
  # Two-part attack: the manifest declares the payload dependency that the DLL's
  # module initializer auto-loads. Pool manifest + code at archive scope.
  - id: dotnet-manifest-injected-dependency-loader
    desc: Manifest ships dep the SDK auto-loads
    crit: hostile
    conf: 0.97
    for: [nupkg, archives]
    scope: archive
    all:
      - id: nuspec-injected-payload-dependency
      - id: dotnet-module-init-injected-loader
