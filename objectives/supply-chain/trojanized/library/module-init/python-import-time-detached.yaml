# A library module that, merely by being imported, downloads a file and starts
# it as a detached process. durabletask 1.4.3 (2026) carried the same block in
# five package __init__ files: urlretrieve a .pyz into /tmp, then Popen it with
# start_new_session and null stdio, inside a bare `except: pass`. Both calls
# must sit at module level; a function a caller invokes is ordinary tooling.
# The host, path and interpreter are attacker-chosen and left open.
defaults:
  platforms: [unix, windows]
  for: [python, whl, python-sdist, zip]
  attack: T1195.002,T1105,T1059.006
composite_rules:
  - id: python-import-time-download-detached-launch
    desc: Import-time code downloads a file and launches it detached
    crit: hostile
    conf: 0.97
    near_bytes: 800
    all:
      - id: micro-behaviors/process/create/subprocess/launch::python-module-level-popen
      - id: micro-behaviors/process/daemonize/detach::python-subprocess-new-session-option
    any:
      - id: micro-behaviors/communications/http/download/helper::module-scope-urlretrieve-call
      - id: micro-behaviors/communications/http/download/url::python-remote-zipapp-url
