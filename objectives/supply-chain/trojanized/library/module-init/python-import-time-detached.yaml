# A library module that, merely by being imported, downloads a file and starts
# it as a detached process. durabletask 1.4.3 (2026) carried the same block in
# five package __init__ files: urlretrieve a .pyz into /tmp, then Popen it with
# start_new_session and null stdio, inside a bare `except: pass`. Both calls
# must sit at module level; a function a caller invokes is ordinary tooling.
# The host, path and interpreter are attacker-chosen and left open. A module
# that backgrounds the file with os.system("... &") is the same launch.
defaults:
  platforms: [unix, windows]
  for: [python, whl, python-sdist, zip]
  attack: T1195.002,T1105,T1059.006
composite_rules:
  - id: python-detached-popen-launch
    desc: Module-level Popen starts a new session
    crit: notable
    conf: 0.97
    near_bytes: 800
    all:
      - id: micro-behaviors/process/create/subprocess/launch::python-module-level-popen
      - id: micro-behaviors/process/daemonize/detach::python-subprocess-new-session-option
  - id: python-detached-module-launch
    desc: Module-level detached child process launch
    crit: notable
    conf: 0.95
    any:
      - id: python-detached-popen-launch
      - id: micro-behaviors/process/create/shell/command-mode::python-module-os-system-background
  - id: python-module-download-call
    desc: Module-level download call
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/communications/http/download/helper::module-scope-urlretrieve-call
      - id: micro-behaviors/communications/http/download/helper::module-scope-urlopen-call
      - id: micro-behaviors/communications/http/download/helper::module-scope-requests-get-call
      - id: micro-behaviors/communications/http/download/url::python-remote-zipapp-url
      - id: micro-behaviors/communications/http/download/write::python-urlopen-body-written-to-file
  - id: python-import-time-download-detached-launch
    desc: Import-time code downloads a file and launches it detached
    crit: hostile
    conf: 0.97
    near_bytes: 800
    all:
      - id: python-detached-module-launch
      - id: python-module-download-call
  # Same import-time dropper, but the detached start goes through a shell
  # string (os.system("nohup ... >/dev/null 2>&1 &")) rather than Popen.
  - id: python-import-time-download-shell-detached-launch
    desc: Import-time code downloads a file and starts it with nohup
    crit: hostile
    conf: 0.96
    near_bytes: 800
    all:
      - id: micro-behaviors/communications/http/download/helper::module-scope-urlretrieve-call
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system-string-command
    any:
      - id: micro-behaviors/process/daemonize/detach::nohup-devnull-same-command
      - id: micro-behaviors/process/daemonize/detach::detached-background-command
