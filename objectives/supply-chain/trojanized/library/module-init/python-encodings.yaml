# encodings is CPython's mandatory codec bootstrap package, unlike a campaign
# filename. Its init module must not be replaced by a native-shellcode loader.
defaults:
  for: [pyc]
  platforms: [windows]
composite_rules:
  - id: python-encodings-bootstrap-shellcode
    desc: Python codec bootstrap contains native loader
    crit: hostile
    conf: 0.99
    attack: T1195.001,T1620
    all:
      - id: objectives/execution/payload/image-map::pyc-feedback-encoded-native-call
      - id: metadata/path::python-encodings-bootstrap-path
