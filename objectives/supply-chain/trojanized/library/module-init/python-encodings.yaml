# encodings is CPython's mandatory codec bootstrap package, unlike a campaign
# filename. Its init module must not be replaced by a native-shellcode loader.
defaults:
  for: [pyc]
  platforms: [windows]
composite_rules:
  - id: python-encodings-bootstrap-shellcode
    desc: Python codec bootstrap contains native loader
    crit: hostile
    conf: 0.99
    attack: T1195.001,T1620
    all:
      - id: objectives/execution/payload/image-map::pyc-feedback-encoded-native-call
      - id: metadata/path/software::python-encodings-bootstrap-path

  - id: python-import-time-github-submodule-stager
    desc: Import-time call downloads GitHub zip into package directory
    crit: hostile
    conf: 0.99
    platforms: [unix, windows]
    for: [python, whl, python-sdist, zip]
    scope: archive
    attack: T1195.002,T1105
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/communications/http/download/helper::python-github-branch-zip-package-dir-extract
      - id: micro-behaviors/communications/http/download/helper::python-model-validator-hook-quarry-buffer
