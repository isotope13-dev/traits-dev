# Go packages run init() when imported: code there executes in every program
# that merely links the library, before the caller invokes anything. A child
# process spawned from init() is rare in real libraries and is how trojanized
# modules fire without an exported entry point being called.
defaults:
  platforms: [windows, unix]
  for: [go]
  attack: T1195.001

traits:
  - id: go-init-exec-command
    desc: Go init() spawns a child process
    crit: notable
    conf: 0.85
    if:
      type: text
      # The body may not reach a column-0 `}` (gofmt's function end), so an
      # exec.Command in the next function down is not init()'s.
      regex: '\bfunc\s+init\s*\(\s*\)\s*\{([^\n]|\n[^}]){0,300}?\bexec\.Command(Context)?\s*\('

composite_rules:
  - id: go-init-remote-script-pipeline
    desc: Go init() runs a remote-script pipeline
    crit: hostile
    conf: 0.96
    attack: T1195.001,T1059,T1105
    all:
      - id: go-init-exec-command
    any:
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-literal
      - id: micro-behaviors/process/deploy/interpreter-stdin::curl-pipe-cmd-literal
