# Go packages run init() when imported: code there executes in every program
# that merely links the library, before the caller invokes anything. A child
# process spawned from init() is rare in real libraries and is how trojanized
# modules fire without an exported entry point being called.
defaults:
  platforms: [windows, unix]
  for: [go]
  attack: T1195.001

traits:
  - id: go-http-get-response
    desc: Go source issues an HTTP GET request
    crit: notable
    if:
      type: text
      regex: '\.Get\s*\('
  - id: go-http-response-file-copy
    desc: Go copies HTTP data into a file
    crit: notable
    if:
      type: text
      regex: '(?s)os\.Create\s*\(.{0,120}?\).{0,300}?io\.Copy\s*\('
  - id: go-chmod-executable
    desc: Go source sets executable file permissions
    crit: notable
    if:
      type: text
      regex: '(?is)os\.Chmod\s*\(.{0,120}?,\s*0?7[0-7]{2}\b'
  - id: go-init-entrypoint
    desc: Go source defines package initialization
    crit: notable
    if:
      type: text
      regex: '\bfunc\s+init\s*\('
composite_rules:
  - id: go-init-remote-script-pipeline
    desc: Go init() runs a remote-script pipeline
    crit: hostile
    conf: 0.96
    attack: T1195.001,T1059,T1105
    all:
      - id: metadata/lang/source/syntax/call/construction::go-init-command-construction-text
    any:
      - id: metadata/lang/source/syntax/command/download::curl-pipe-shell-literal
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-cmd-literal
  - id: go-init-http-binary-dropper
    desc: Go package initializer downloads and launches a binary
    crit: hostile
    conf: 0.98
    attack: T1195.001,T1105,T1204.002
    all:
      - id: go-init-entrypoint
      - id: go-http-get-response
      - id: go-http-response-file-copy
      - id: go-chmod-executable
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-bin-sh
