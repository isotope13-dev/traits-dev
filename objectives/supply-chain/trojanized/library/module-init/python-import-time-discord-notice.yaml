# A module that posts a hardcoded exploit notice to a Discord webhook as it
# is imported is an unsolicited supply-chain notification. The endpoint,
# POST, message wording, and module-scope call establish the behavior.
defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1195.002,T1491

traits:
  - id: python-exploit-notice-default
    desc: Defines exploit notice text
    crit: notable
    for: [python]
    if:
      type: text
      regex: '(?i)(DEFAULT_MESSAGE|content)\s*[:=]\s*["]exploited["]'

composite_rules:
  - id: python-import-time-discord-exploit-notice
    desc: Import posts an exploit notice to Discord
    crit: hostile
    conf: 0.98
    scope: package
    all:
      - id: python-exploit-notice-default
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/communications/http/webhook::discord-webhook-api
      - id: micro-behaviors/communications/http/post::source-post-method-literal
