# A Rust crate that both exfiltrates during its Cargo build and registers the
# same behavior as a native load-time initializer has two automatic execution
# surfaces: installation/build and later library loading.
defaults:
  platforms: [linux, macos, windows]
  for: [crate]
  attack: T1195.002
  mbc: E1041

composite_rules:
  - id: cargo-build-exfil-and-load-time-uploader
    desc: Cargo build exfiltration plus load-time uploader
    crit: hostile
    conf: 0.995
    # The build-hook composite already correlates multiple members of this
    # crate.  Pool the resulting crate finding with the initializer member at
    # the outer input scope rather than trying to re-scope a nested composite.
    scope: outer
    all:
      - id: objectives/supply-chain/install-hook/build/behavioral::cargo-build-hook-obfuscated-file-exfil
      - id: micro-behaviors/process/lifecycle/auto-exec::rust-elf-init-array
