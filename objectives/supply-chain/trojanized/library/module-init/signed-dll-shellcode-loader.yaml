# A DLL whose valid vendor signature covers a routine that decrypts an
# embedded high-entropy blob into RWX memory and calls it: the loader was in
# the build before it was signed, so the vendor's pipeline shipped it. The
# NetSarang Xmanager/Xshell nssock2.dll (2017, ShadowPad) was signed by
# NetSarang Computer, Inc. minutes before the installer around it.
defaults:
  platforms: [windows]
  for: [dll]
  attack: T1195.002,T1620
composite_rules:
  - id: signed-dll-embedded-shellcode-loader
    desc: Vendor-signed DLL decrypts and runs an embedded shellcode blob
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/signature/certificate/integrity::pe-signature-verified
      - id: objectives/execution/payload/memory-branch/buffer::x86-decrypt-to-rwx-and-call
      - id: metadata/binary/section/entropy::high-entropy-rdata-section
    unless:
      - id: metadata/signature/verified/platform/
