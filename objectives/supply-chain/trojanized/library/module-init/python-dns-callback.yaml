defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002

composite_rules:
  - id: python-import-pyvac-dns-callback
    desc: Python package import triggers an external DNS callback
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/size::init-py-file
      - id: micro-behaviors/communications/dns/lookup::python-import-pyvac-dns-wrapper
    any:
      - id: micro-behaviors/communications/dns/resolver::gethostbyname
      - id: micro-behaviors/communications/dns/resolver::gethostbyname-ex
      - id: micro-behaviors/communications/dns/resolver::getaddrinfo
