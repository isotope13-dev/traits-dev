defaults:
  platforms: [linux, macos, windows]
  for: [python]
  attack: T1195.002
  mbc: E1195

traits:
  - id: earth-engine-base-url-setting
    desc: Earth Engine client base URL assignment
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)(DEFAULT_CLOUD_API_BASE_URL|DEFAULT_TILE_BASE_URL|_tile_base_url)\s*='

  - id: discovery-client-url-check
    desc: Discovery client method URL routing check
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'expanded_url\.(startswith|endswith)\('

composite_rules:
  - id: earth-engine-endpoint-diverted-to-aws
    desc: Earth Engine client URL set to cloud host
    crit: hostile
    conf: 0.99
    all:
      - id: earth-engine-base-url-setting
      - id: micro-behaviors/communications/http/services/cloud::managed-cloud-host
    near_lines: 4

  - id: google-discovery-client-url-diversion
    desc: Discovery client URL redirected to cloud host
    crit: hostile
    conf: 0.99
    all:
      - id: discovery-client-url-check
      - id: micro-behaviors/communications/http/services/cloud::managed-cloud-host
    near_lines: 4

  - id: cloud-client-endpoint-host-diversion
    desc: Cloud client endpoint diverted to cloud host
    crit: suspicious
    conf: 0.95
    any:
      - id: earth-engine-endpoint-diverted-to-aws
      - id: google-discovery-client-url-diversion
