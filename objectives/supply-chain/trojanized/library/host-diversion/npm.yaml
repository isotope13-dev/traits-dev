# fsevents v1.0.0 through v1.2.10 fetched native addons from this S3
# namespace. After the namespace expired, a third party reclaimed it and
# served modified fse.node binaries in April 2023 (GHSA-xv2f-5jw4-v95m).
defaults:
  platforms: [macos]
  for: [package.json]
  attack: T1195.002

traits:
  - id: fsevents-reclaimed-s3-host
    desc: Reclaimed fsevents S3 binary host
    crit: suspicious
    conf: 1.0
    if:
      type: value
      path: binary.host
      exact: https://fsevents-binaries.s3-us-west-2.amazonaws.com

composite_rules:
  - id: reclaimed-native-binary-install
    desc: Install fetches native code from reclaimed host
    crit: hostile
    conf: 0.999
    all:
      - id: fsevents-reclaimed-s3-host
      - id: micro-behaviors/communications/http/download/package::npm-node-pre-gyp-install
