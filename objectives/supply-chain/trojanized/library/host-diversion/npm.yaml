# Native-addon packages whose prebuilt-binary storage namespace expired and was
# reclaimed by a third party that then served modified binaries to every
# install that still pointed at it:
#   fsevents 1.0.0-1.2.10 -> fsevents-binaries bucket, April 2023
#     (GHSA-xv2f-5jw4-v95m / MAL-2023-462)
#   bignum 0.12.2-0.13.0  -> rvagg-node bucket, 2023; the served bignum.node
#     sent uid, env and hostname out in a GET User-Agent (Checkmarx)
# Host matchers accept both virtual-hosted (<bucket>.s3-*.amazonaws.com) and
# path-style (s3*.amazonaws.com/<bucket>) addressing: both reach the same
# reclaimed bucket, and a republished or forked package can use either.
defaults:
  platforms: [macos]
  for: [package.json]
  attack: T1195.002

traits:
  - id: fsevents-reclaimed-s3-host
    desc: Reclaimed fsevents S3 binary host
    crit: suspicious
    conf: 1.0
    if:
      type: value
      path: binary.host
      regex: '^https?://(fsevents-binaries\.s3[.-]|s3[\w.-]*\.amazonaws\.com/fsevents-binaries(/|$))'
  - id: bignum-reclaimed-s3-host
    desc: Reclaimed bignum S3 binary host
    crit: suspicious
    conf: 1.0
    platforms: [linux, macos, windows]
    if:
      type: value
      path: binary.host
      regex: '^https?://(rvagg-node\.s3[.-]|s3[\w.-]*\.amazonaws\.com/rvagg-node(/|$))'

composite_rules:
  - id: reclaimed-native-binary-install
    desc: Install fetches native code from reclaimed host
    crit: hostile
    conf: 0.999
    platforms: [linux, macos, windows]
    all:
      - id: micro-behaviors/communications/http/download/package::npm-node-pre-gyp-install
    any:
      - id: fsevents-reclaimed-s3-host
      - id: bignum-reclaimed-s3-host
