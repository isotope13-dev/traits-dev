# Directory contract: keep a rule here only when its matcher proves identifiable
# known-good library provenance and a contradictory injected modification.
# Package/archive context by itself is not trojanization.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1195.002,T1614

composite_rules:
  # The known library identity is the evidence that makes this a trojanized
  # library rule rather than a generic geofenced file-write objective.
  - id: node-ipc-geofenced-user-folder-write
    desc: node-ipc bundle geofences a user-folder file write
    crit: hostile
    conf: 0.98
    mbc: "B0007.003"
    scope: leaf
    all:
      - id: well-known/lib/network/node-ipc::node-ipc-library
      - id: objectives/discovery/host/geo::freegeoip-api
      - id: micro-behaviors/fs/path/location::user-folder-file-write
