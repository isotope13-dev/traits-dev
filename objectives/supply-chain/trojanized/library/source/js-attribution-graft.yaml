# A real library file with a payload welded onto it. The npm sample that drove
# this was `web3-core-subscriptions/index.js`, copied byte-for-byte — LGPL
# notice, `@author Fabian Vogelsteller`, `module.exports` and all — republished
# under a new package name with one extra statement spliced in between the last
# prototype method and the exports block: a Function constructor holding 110 KB
# of escape-encoded code.
#
# That splice is the whole npm trojanization pattern. The attacker does not
# write a package; they take one that already reads as legitimate, so the diff a
# reviewer sees is small, the file still passes as the library it claims to be,
# and the dependency keeps working for whoever installs it. The attribution
# header is what makes the contradiction legible: the file asserts a provenance
# for code that upstream never shipped, and upstream does not ship encoded
# function bodies.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1195.002,T1027.013"
  mbc: "B0032,E1195.002"

composite_rules:
  - id: attributed-source-with-encoded-payload
    desc: Attributed library file carries an encoded payload
    crit: hostile
    conf: 0.96
    # One file: the attribution and the payload have to be the same bytes. At
    # archive scope every package that vendors an MIT-licensed dependency and
    # separately ships an obfuscated bundle would match.
    scope: file
    all:
      - id: metadata/file/string/attribution::attributed-upstream-source
      - id: objectives/anti-static/obfuscation/eval/function::function-body-unicode-escape-blob
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
