defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1059.007,T1195.002"

composite_rules:
  # A decoder is expected to transform its argument locally. Sending that
  # argument in a JSON POST to a hard-coded raw-IP endpoint is an injected
  # library side effect, not ordinary codec functionality.
  - id: node-decoder-input-network-side-effect
    desc: Package decoder uses fetch to send caller input to a raw-IP endpoint
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1041"
    for: [archives]
    scope: package
    near_bytes: 900
    all:
      - id: micro-behaviors/data/decode/custom::javascript-decode-function
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/payload::fetch-post-json-body
      - id: micro-behaviors/communications/ip/literal::javascript-external-http-ip-url
      - id: micro-behaviors/data/serialize/json::json-object-variable-field

  # node-ipc 10.1.1/10.1.2 carried a geofenced protestware payload that
  # queried a public geo service and then wrote into user-visible folders.
  # Keep this package-specific and same-file: ordinary node-ipc transport,
  # standalone geolocation, or an application's own Desktop export must not
  # be treated as a supply-chain conviction.
  - id: node-ipc-geofenced-user-folder-write
    desc: node-ipc bundle geofences a user-folder file write
    crit: hostile
    conf: 0.98
    attack: "T1614,T1195.002"
    mbc: "B0007.003"
    for: [javascript]
    scope: leaf
    all:
      - id: well-known/lib/network/node-ipc::node-ipc-library
      - id: objectives/discovery/host/geo::freegeoip-api
      - id: micro-behaviors/fs/path/location::user-folder-file-write

  # This variant covers deferred import-time bootstraps that do not use an
  # IIFE: the source still hides the module names and payload indicators,
  # stages an HTTP response, makes it executable, and detaches it.
  - id: obfuscated-deferred-executable-stage
    desc: Deferred obfuscated Node stage downloads, arms, and launches an executable
    crit: hostile
    conf: 0.99
    attack: "T1027,T1059.007,T1105,T1222.002"
    near_bytes: 6000
    all:
      - id: micro-behaviors/data/encode/char-code::long-numeric-array-literal
      - id: micro-behaviors/data/encode/char-code::fromcharcode-call
      - id: micro-behaviors/os/module/load::dynamic-import-call-expression
      - id: micro-behaviors/communications/http/response::node-response-to-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
    unless:
      - id: micro-behaviors/data/control-flow/module-exec::async-iife-invoke
  - id: obfuscated-import-time-executable-stage
    desc: Import-time obfuscated executable stage
    crit: hostile
    conf: 0.99
    attack: "T1027,T1059.007,T1105,T1222.002"
    near_bytes: 10000
    all:
      - id: micro-behaviors/data/control-flow/module-exec::async-iife-invoke
      - id: micro-behaviors/data/encode/char-code::fromcharcode-call
      - id: micro-behaviors/os/module/load::dynamic-import-call-expression
      - id: micro-behaviors/communications/http/response::node-response-to-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/spawn::indirect-detached-hidden-spawn
    any:
      - id: micro-behaviors/communications/http/request/evented::node-evented-get-response
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync
  - id: import-time-decrypted-stage
    desc: Library import launches decrypted dependency stage
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/crypto/symmetric/decrypt::local-decrypt-helper-import
      - id: micro-behaviors/fs/path/construct::node-modules-package-data-path-reference
      - id: micro-behaviors/fs/file/read::readfilesync-call
      - id: micro-behaviors/crypto/symmetric/decrypt::cryptojs-block-cipher-decrypt-call
      - id: micro-behaviors/process/create/spawn::detached-true
      - id: micro-behaviors/process/create/spawn::stdio-ignore
      - id: micro-behaviors/process/daemonize/detach::node-handle-unref-text
      - id: micro-behaviors/process/fd/stdio::js-stdin-write

  # Bundled SDK form: no separate ./decrypt helper — cipher decrypt + sibling
  # node_modules/*.db path + detached Node stdin feed on module load.
  - id: bundled-decrypt-stdin-node-stage
    desc: Bundled library decrypts dependency data into detached Node
    crit: hostile
    conf: 0.99
    # The import-time rule is the stronger description when the bundle keeps
    # its top-level invocation facts; avoid two supply-chain labels for one
    # loader in that form.
    unless:
      - id: import-time-detached-node-stage
    all:
      - id: micro-behaviors/fs/path/construct::node-modules-package-data-path-reference
      - id: micro-behaviors/fs/file/read::readfilesync-call
      - id: micro-behaviors/crypto/symmetric/decrypt::cryptojs-block-cipher-decrypt-call
      - id: micro-behaviors/process/create/script/file::spawn-node-process
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/process/fd/stdio::js-stdin-write

  # Import-time extraction of an adjacent compressed payload followed by a
  # detached, output-suppressed launch is materially different from ordinary
  # archive handling: the package executes a hidden native stage merely by
  # being imported.  The combination is intentionally cross-package generic.
  - id: hidden-native-payload-extraction-and-launch
    desc: Hidden native payload extraction and detached launch
    crit: hostile
    conf: 0.99
    attack: "T1027,T1195.002,T1059.007"
    near_bytes: 2048
    all:
      - id: micro-behaviors/fs/file/read::read-adjacent-javascript-file
      - id: micro-behaviors/fs/path/construct::local-script-path
      - id: micro-behaviors/data/compress/library::node-zlib-import
      - id: micro-behaviors/data/compress/library::node-gunzip-function
      - id: micro-behaviors/fs/temp/directory::os-tmpdir
      - id: micro-behaviors/process/create/shell/bridge::child-process-require
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync
      - id: micro-behaviors/fs/write/file/executable::node-write-file-executable-mode
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/process/daemonize/detach::node-handle-unref-text
  # Import-time execution is a separate supply-chain signal: a consumer gets
  # the detached stage merely by loading the library. Accept both source
  # imports and CommonJS/bundler forms; decryption is not required here.
  - id: import-time-detached-node-stage
    desc: Library import-time launches a detached Node stage
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/control-flow/module-exec::async-iife-invoke
      - id: micro-behaviors/process/create/script/file::spawn-node-process
      - id: micro-behaviors/process/create/spawn::detached-true
      - id: micro-behaviors/process/create/spawn::stdio-ignore
      - id: micro-behaviors/process/daemonize/detach::node-handle-unref-text
      - id: micro-behaviors/process/fd/stdio::js-stdin-write
    any:
      - id: micro-behaviors/crypto/symmetric/decrypt::cryptojs-block-cipher-decrypt-call
      - id: micro-behaviors/crypto/symmetric/decrypt::cryptojs-block-cipher-decrypt-text
      - id: metadata/import/builtin::child-process-import-runtime
      - id: metadata/import/builtin::require-child-process

  # A package can bundle the native stage instead of downloading it. Loading
  # the public entrypoint resolves that sibling payload, makes it executable,
  # and starts it detached with no visible output. This catches the no-hook
  # supply-chain form while remaining independent of package, asset, and
  # malware-family names. Both ESM import.meta.url and CommonJS __dirname path
  # construction feed the module-relative-path leg.
  - id: import-time-bundled-native-payload-launch
    desc: Library import arms and silently detaches a bundled native payload
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1059.007,T1222.002,T1564.003"
    mbc: "B0024,F0011"
    near_bytes: 8192
    all:
      - id: micro-behaviors/data/control-flow/module-exec::js-async-iife-import-hook
      - id: micro-behaviors/fs/path/construct::node-module-relative-path
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
      - id: micro-behaviors/process/create/spawn::child-process-creation-api
      - id: micro-behaviors/process/create/spawn::detached-true
    any:
      - id: micro-behaviors/process/create/spawn::stdio-ignore
      - id: micro-behaviors/process/fd/stdio::node-child-output-discarded

  # Hash-gating the adjacent payload before the hidden launch pins execution
  # to the attacker's chosen build. The digest value itself is deliberately
  # unconstrained so rebuilt payloads and future families retain coverage.
  - id: hash-gated-import-time-native-payload
    desc: Import-time native payload launch is gated by a fixed SHA-256 digest
    crit: hostile
    conf: 0.995
    attack: "T1195.002,T1059.007,T1222.002,T1564.003"
    mbc: "B0024,F0011"
    near_bytes: 8192
    all:
      - id: import-time-bundled-native-payload-launch
      - id: micro-behaviors/crypto/hash/digest::source-fixed-sha256-context

  # Import-time IPFS stager: loading a package serializes a downloader into a
  # hidden detached Node child. The IPFS CID, gateway, destination basename,
  # and package identity are intentionally absent so rotated infrastructure
  # and ports to other npm libraries retain coverage.
  - id: import-time-ipfs-detached-node-stage
    desc: Library import launches a detached IPFS JavaScript stage
    crit: hostile
    conf: 0.995
    attack: "T1195.002,T1105,T1059.007,T1564.003"
    near_bytes: 10000
    all:
      - id: micro-behaviors/data/control-flow/module-exec::js-synchronous-iife-invoke
      - id: micro-behaviors/process/create/inline-script::spawn-node-eval
      - id: objectives/command-and-control/dropper/delivery/blockchain::ipfs-detached-javascript-stage

  # A library that runs a remote executable stage merely because its entry
  # module is loaded is a supply-chain payload, even when the URL and asset
  # path are supplied through ordinary Node APIs rather than an IIFE.
  # scope stays at the default `file`: the whole chain is one module's
  # load-time behaviour. `scope: archive` pooled the legs across every entry of
  # a large bundle (Electron asar, .deb), so an app whose installer chmods a
  # verified download and whose launcher writes a wrapper script was convicted.
  - id: import-time-remote-executable-stage
    desc: Library import downloads and detaches an executable stage
    crit: hostile
    conf: 0.995
    attack: "T1195.002,T1105,T1059.007,T1222.002"
    near_bytes: 10000
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/fs/file/write/async::node-write-file-promise
      - id: micro-behaviors/fs/write/file/executable::node-write-file-executable-mode
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/data/control-flow/module-exec::module-leading-promise-chain-call

  # CommonJS sidecars can invoke a bootstrap promise directly at module scope
  # rather than using an IIFE. This is the package-level intent signal for the
  # same remote buffered executable stage covered by the generic dropper rule.
  - id: import-time-buffered-native-stage
    desc: Library import stages and detaches a fetched executable
    crit: hostile
    conf: 0.995
    attack: "T1195.002,T1105,T1059.007,T1222.002"
    near_bytes: 10000
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-leading-promise-chain-call
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
    unless:
      - id: metadata/package/testing/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/library/structure/
      - id: metadata/package/quality/benign-context::benign-app-fp-context

  # Import-time sidecars loaded through a swallowed try/catch require are a
  # common npm trojan pattern: the public entry stays clean while a hidden
  # sibling module performs the remote native stage at load time.
  - id: npm-import-concealed-sidecar-native-stage
    desc: npm entry import conceals a native payload sidecar
    crit: hostile
    conf: 0.995
    attack: "T1195.002,T1105,T1059.007,T1222.002"
    scope: archive
    for: [archives, npm, tar]
    all:
      - id: micro-behaviors/process/create/load/local::cjs-caught-local-require
      - id: import-time-buffered-native-stage
    unless:
      - id: metadata/package/testing/
      - id: metadata/package/testing/presence/harness/

  # Attackers split CDN hostnames across short string fragments joined with
  # an empty separator so static scans miss workers.dev and similar endpoints.
  - id: npm-split-host-import-time-loader
    desc: npm native stage reconstructs an obfuscated CDN host
    crit: suspicious
    conf: 0.99
    attack: "T1195.002,T1105,T1027,T1583.006"
    scope: archive
    for: [archives, npm, tar]
    all:
      - id: objectives/anti-static/obfuscation/string/conceal::js-inline-array-empty-join
      - id: micro-behaviors/process/create/load/local::cjs-caught-local-require
      - id: import-time-buffered-native-stage
    unless:
      - id: metadata/package/testing/
      - id: metadata/package/testing/presence/harness/

  # A package can avoid an executable dropper and still use import-time code
  # to fetch a mutable dead-drop configuration into hidden user state. The
  # combination is the supply-chain signal; each individual capability remains
  # neutral in its own taxonomy location.
  - id: npm-import-time-dead-drop-state-write
    desc: npm import fetches a dead-drop config into hidden home state
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1105,T1071.001,T1564.001"
    near_bytes: 6000
    all:
      - id: micro-behaviors/data/control-flow/module-exec::js-synchronous-iife-invoke
      - id: micro-behaviors/process/user/query::os-homedir-call
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/communications/http/url/github::gist-githubusercontent-raw-url
      - id: micro-behaviors/communications/http/response::node-response-to-file
    unless:
      - id: metadata/package/testing/
      - id: metadata/package/testing/presence/harness/
