# Portable behavior chains for packages that conceal harmful operations behind
# plausible library APIs. Package context and randomized gates are corroborating
# signals; no primary verdict requires recognition of the gate.
defaults:
  platforms: [linux, macos, windows]
  attack: T1195.002
  for: [scripts, source, class, java_class]

traits:
  - id: browser-secret-store-set
    desc: Multiple browser secret stores
    crit: suspicious
    if:
      type: text
      regex: '(?is)(Login Data.{0,600}Cookies[.]binarycookies|Cookies[.]binarycookies.{0,600}Login Data)'

  - id: browser-secret-upload-endpoint
    desc: Source defines browser-data upload endpoint
    crit: notable
    if:
      type: text
      regex: 'https://[A-Za-z0-9.-]+/(ingest|upload|collect|submit)[/?]'

  - id: developer-secret-file-set
    desc: Multiple developer credential files
    crit: notable
    if:
      type: text
      regex: '(?is)[.]aws/credentials.{0,600}[.]netrc|[.]netrc.{0,600}[.]aws/credentials'

  - id: dns-query-api-source
    desc: Source performs hostname resolution
    crit: notable
    if:
      type: text
      regex: '(?i)(getaddrinfo|GetHostAddresses|lookup_host|lookupHost)'

  - id: jvm-dns-query-api-source
    desc: JVM source performs hostname resolution
    crit: notable
    if:
      type: text
      regex: '(InetAddress[.]getByName|Dns[.]gethostbyname)'

  - id: keychain-safe-storage-query
    desc: Queries browser keychain secret
    crit: suspicious
    if:
      type: text
      regex: '(?i)find-generic-password.{0,80}(Chrome|Chromium) Safe Storage'

  - id: shell-history-path-source
    desc: Source references shell history
    crit: notable
    if:
      type: text
      substr: .zsh_history

  - id: launchagents-path-source
    desc: Source references LaunchAgents directory
    crit: notable
    if:
      type: text
      substr: Library/LaunchAgents

  - id: curl-fail-silent-url
    desc: Curl fetches remote HTTPS payload
    crit: notable
    if:
      type: text
      regex: 'curl\s+-fsSL\s+https?://'

  - id: crontab-update-source
    desc: Source reads or replaces crontab
    crit: notable
    if:
      type: text
      regex: 'crontab.{0,50}(-l|-[''"]|-$)'

  - id: authorized-key-entry-source
    desc: Source installs embedded authorized key
    crit: suspicious
    if:
      type: text
      regex: '(?is)(authorized_keys.{0,600}ssh-ed25519|ssh-ed25519.{0,600}authorized_keys)'

  - id: embedded-ed25519-entry
    desc: Source embeds Ed25519 key entry
    crit: suspicious
    if:
      type: text
      regex: 'ssh-ed25519\s+AAAA[A-Za-z0-9+/]{20,}'

  - id: runkey-path-source
    desc: Source references Windows Run key
    crit: notable
    if:
      type: text
      regex: 'CurrentVersion[\\/]+Run'

  - id: registry-value-write-source
    desc: Source writes registry value
    crit: notable
    if:
      type: text
      regex: '(SetValue|RegSetValue|reg\s+add|New-ItemProperty)'

  - id: startup-link-source
    desc: Source creates Startup shortcut
    crit: suspicious
    if:
      type: text
      regex: '(Start Menu.{0,80}Startup|Startup.{0,80}[.]lnk)'

  - id: staged-command-url-source
    desc: Source references staged command URL
    crit: notable
    if:
      type: text
      regex: 'https://[A-Za-z0-9.-]+/s/[A-Fa-f0-9]{8}[.](cmd|ps1|sh)'

  - id: schtasks-create-source
    desc: Source creates scheduled task
    crit: suspicious
    if:
      type: text
      regex: '(?i)schtasks(.exe)?\s+/Create'

  - id: schtasks-token-source
    desc: Source references task scheduler utility
    crit: notable
    if:
      type: text
      regex: '(?i)\bschtasks(.exe)?\b'

  - id: encoded-powershell-source
    desc: Source runs encoded PowerShell
    crit: suspicious
    if:
      type: text
      regex: '(?i)powershell.{0,80}(-EncodedCommand|-enc\b)'

  - id: recovery-command-quartet
    desc: Four recovery destruction utilities
    crit: suspicious
    if:
      type: text
      regex: '(?is)vssadmin.{0,700}wbadmin.{0,700}bcdedit.{0,700}wevtutil'

  - id: vssadmin-delete-source
    desc: Source deletes shadow copies
    crit: notable
    if:
      type: text
      regex: '(?i)vssadmin(.exe)?.{0,50}delete.{0,50}shadows'

  - id: wbadmin-catalog-delete-source
    desc: Source deletes backup catalog
    crit: notable
    if:
      type: text
      regex: '(?i)wbadmin(.exe)?.{0,50}delete.{0,30}catalog'

  - id: dd-zero-source
    desc: Source invokes zero-filled device write
    crit: suspicious
    if:
      type: text
      substr: if=/dev/zero

  - id: mounted-device-zero-source
    desc: Source zeroes discovered mounted device
    crit: suspicious
    if:
      type: text
      regex: '(?is)(/proc/mounts.{0,600}if=/dev/zero|if=/dev/zero.{0,600}/proc/mounts)'

  - id: boot-sector-block-size
    desc: Source selects boot-sector prefix
    crit: suspicious
    if:
      type: text
      substr: bs=446

  - id: while-unbounded-loop-source
    desc: Source contains unbounded loop
    crit: component
    if:
      type: text
      regex: '(?i)(while\s*[(]?\s*(true|1|\$true)|loop\s*[{])'

  - id: c-unbounded-for-loop
    desc: C source contains unbounded for loop
    crit: component
    for: [c, cpp]
    if:
      type: text
      regex: 'for\s*[(]\s*int\s+\w+\s*=\s*0\s*;\s*;'

  - id: hidden-cache-fill-path
    desc: Source targets hidden cache directory
    crit: suspicious
    if:
      type: text
      substr: .warmcache

  - id: megabyte-buffer-source
    desc: Source allocates megabyte write buffer
    crit: notable
    if:
      type: text
      regex: '(1\s*<<\s*20|1\s*-shl\s*20|1048576|1024\s*[*]\s*1024)'

  - id: repeated-file-write-source
    desc: Source repeatedly writes file data
    crit: component
    if:
      type: text
      regex: '(?i)([.]write(AllBytes)?\s*[(]|FileOutputStream|WriteFile|write_all\s*[(]|fwrite\s*[(])'

  - id: forced-shutdown-source
    desc: Source invokes forced shutdown
    crit: suspicious
    if:
      type: text
      regex: '(?i)(shutdown\s+(-h|/s)|System Events.{0,40}to (restart|shut down))'

  - id: launchagent-interval-source
    desc: LaunchAgent has periodic execution keys
    crit: notable
    if:
      type: text
      regex: '(RunAtLoad|StartInterval)'

  - id: clipboard-read-source
    desc: Source reads system clipboard
    crit: notable
    if:
      type: text
      regex: '(GetText|GetClipboardData|Get-Clipboard)'

  - id: clipboard-write-source
    desc: Source writes system clipboard
    crit: notable
    if:
      type: text
      regex: '(SetText|SetClipboardData|Set-Clipboard)'

  - id: crypto-address-pattern-set
    desc: Source matches Bitcoin and Ethereum addresses
    crit: suspicious
    if:
      type: text
      regex: '(?is)bc1\[a-z0-9\]\{39,59\}.{0,500}0x\[a-fA-F0-9\]\{40\}'

  - id: source-hex-decoder
    desc: Source converts hexadecimal bytes
    crit: notable
    if:
      type: text
      regex: '(fromhex|ToByte|parseInt|hex::decode|decodeHex|hexToBytes|digit_value)'

  - id: source-xor-operation
    desc: Source applies XOR transformation
    crit: notable
    if:
      type: text
      regex: '(?i)(bxor|bitxor|xor|\s\^\s)'

  - id: windows-living-off-land-command
    desc: Source invokes Windows proxy binary
    crit: component
    if:
      type: text
      regex: '(?i)(cmd[.]exe|mshta([.]exe)?|rundll32([.]exe)?)'

  - id: long-hex-command-blob
    desc: Source embeds long hexadecimal command data
    crit: notable
    if:
      type: string_literal
      regex: '^[A-Fa-f0-9]{80,}$'

  - id: zero-width-alphabet-source
    desc: Source defines zero-width alphabet
    crit: notable
    if:
      type: text
      regex: '(?is)200b.{0,100}200c.{0,100}200d.{0,100}(feff|2060)'

  - id: zero-width-two-bit-shift
    desc: Decoder shifts zero-width pairs
    crit: notable
    if:
      type: text
      regex: '(-shl\s+2|<<\s*2|shl\s+2|shiftLeft\s*[(]\s*2)'

  - id: dynamic-execution-source
    desc: Source performs dynamic execution
    crit: component
    if:
      type: text
      regex: '(?i)(eval\s*[(]|exec\s*[(]|Invoke-Expression|Start-Process)'

  - id: image-pixel-read-source
    desc: Source reads image pixel channels
    crit: notable
    if:
      type: text
      regex: '(?i)(getpixel|GetPixel|pixelColor|readInt|rgba)'

  - id: blue-channel-payload-source
    desc: Source extracts image blue channel
    crit: notable
    if:
      type: text
      regex: '(?i)blue[- ]channel'

  - id: lsb-bit-mask-source
    desc: Source extracts least significant bits
    crit: notable
    if:
      type: text
      regex: '(&\s*1|and\s+1|bitAnd\s*[(]\s*1)'

  - id: executable-stage-source
    desc: Source launches staged executable
    crit: component
    if:
      type: text
      regex: '(?i)(chmod|setExecutable|Start-Process|ProcessBuilder|exec[.]Command|spawn\s*[(])'

  - id: dylib-path-source
    desc: Source references dynamic library payload
    crit: notable
    if:
      type: text
      substr: .dylib

  - id: dylib-load-or-unquarantine
    desc: Source loads or unquarantines dylib
    crit: suspicious
    if:
      type: text
      regex: '(xattr|dlopen|DYLD_INSERT_LIBRARIES|Library/Audio/Plug-Ins)'

  - id: systemd-timer-source
    desc: Source defines systemd timer
    crit: notable
    if:
      type: text
      substr: .timer

  - id: systemd-timer-schedule
    desc: Source schedules systemd unit
    crit: notable
    if:
      type: text
      regex: '(OnCalendar|OnUnitActiveSec)'

  - id: systemd-user-enable-source
    desc: Source enables systemd user unit
    crit: suspicious
    if:
      type: text
      regex: 'systemctl.{0,100}--user.{0,100}(enable|start)'

  - id: build-lifecycle-hook-source
    desc: Source implements package build hook
    crit: notable
    if:
      type: text
      regex: '(build[.]rs|setup[.]py|extconf[.]rb|Makefile[.]PL|CMakeLists[.]txt|prepack)'

composite_rules:
  - id: unbounded-loop-source
    desc: Source contains unbounded loop
    crit: component
    any:
      - id: while-unbounded-loop-source
      - id: c-unbounded-for-loop

  - id: portable-browser-secret-exfiltration
    desc: Browser stores sent to remote service
    crit: hostile
    conf: 0.98
    all:
      - id: browser-secret-store-set
    any:
      - id: browser-secret-upload-endpoint
      - id: micro-behaviors/communications/url/host::dynamic-dns-hostname

  - id: portable-dns-secret-exfiltration
    desc: Developer secrets leave through DNS
    crit: hostile
    conf: 0.98
    all:
      - id: developer-secret-file-set
    any:
      - id: dns-query-api-source
      - id: jvm-dns-query-api-source

  - id: portable-keychain-cookie-exfiltration
    desc: Browser keychain and cookies exfiltrated
    crit: hostile
    conf: 0.98
    all:
      - id: keychain-safe-storage-query
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path

  - id: portable-launchagent-exfiltration
    desc: LaunchAgent persists history exfiltration
    crit: hostile
    conf: 0.99
    all:
      - id: launchagents-path-source
      - id: shell-history-path-source

  - id: portable-cron-remote-persistence
    desc: Cron persists remote network command
    crit: hostile
    conf: 0.98
    all:
      - id: curl-fail-silent-url
      - id: crontab-update-source

  - id: portable-authorized-key-backdoor
    desc: Package plants authorized SSH key
    crit: hostile
    conf: 0.99
    all:
      - id: authorized-key-entry-source
      - id: embedded-ed25519-entry

  - id: portable-runkey-persistence
    desc: Package stages Run-key execution
    crit: hostile
    conf: 0.98
    all:
      - id: runkey-path-source
      - id: registry-value-write-source

  - id: portable-startup-link-dropper
    desc: Startup shortcut downloads command
    crit: hostile
    conf: 0.99
    all:
      - id: startup-link-source
      - id: staged-command-url-source

  - id: portable-scheduled-secret-dropper
    desc: Scheduled task runs encoded downloader
    crit: hostile
    conf: 0.99
    all:
      - id: schtasks-token-source
      - id: encoded-powershell-source

  - id: portable-recovery-destruction
    desc: Recovery and logs destroyed together
    crit: hostile
    conf: 0.995
    all:
      - id: vssadmin-delete-source
      - id: wbadmin-catalog-delete-source

  - id: portable-dynamic-device-wiper
    desc: Mounted devices overwritten with zeroes
    crit: hostile
    conf: 0.995
    all:
      - id: mounted-device-zero-source
      - id: dd-zero-source

  - id: portable-boot-sector-wiper
    desc: Boot sector overwritten with zeroes
    crit: hostile
    conf: 0.995
    all:
      - id: boot-sector-block-size
      - id: dd-zero-source

  - id: portable-disk-fill-loop
    desc: Infinite writes exhaust local storage
    crit: hostile
    conf: 0.99
    all:
      - id: hidden-cache-fill-path
      - id: unbounded-loop-source
      - id: megabyte-buffer-source
      - id: repeated-file-write-source

  - id: portable-shutdown-persistence-loop
    desc: LaunchAgent repeatedly forces shutdown
    crit: hostile
    conf: 0.99
    all:
      - id: launchagents-path-source
      - id: launchagent-interval-source
      - id: forced-shutdown-source

  - id: portable-clipboard-crypto-hijacker
    desc: Clipboard watcher replaces crypto addresses
    crit: hostile
    conf: 0.995
    all:
      - id: clipboard-read-source
      - id: clipboard-write-source
      - id: crypto-address-pattern-set

  - id: portable-hex-xor-command-loader
    desc: XOR-decoded data reaches command shell
    crit: hostile
    conf: 0.98
    all:
      - id: long-hex-command-blob
      - id: source-xor-operation
      - id: windows-living-off-land-command

  - id: portable-zero-width-loader
    desc: Zero-width payload reaches execution
    crit: hostile
    conf: 0.99
    near_bytes: 2400
    all:
      - id: zero-width-alphabet-source
      - id: zero-width-two-bit-shift
      - id: dynamic-execution-source

  - id: portable-png-lsb-dropper
    desc: PNG pixels conceal executable stage
    crit: hostile
    conf: 0.99
    all:
      - id: blue-channel-payload-source
      - id: lsb-bit-mask-source
      - id: executable-stage-source

  - id: portable-dylib-dropper
    desc: Remote dylib staged and loaded
    crit: hostile
    conf: 0.99
    all:
      - id: dylib-path-source
      - id: dylib-load-or-unquarantine

  - id: portable-systemd-timer-dropper
    desc: Systemd timer executes remote command
    crit: hostile
    conf: 0.99
    all:
      - id: systemd-timer-source
      - id: systemd-timer-schedule
      - id: systemd-user-enable-source

  - id: portable-build-hook-secret-theft
    desc: Build hook exports developer secrets
    crit: hostile
    conf: 0.99
    all:
      - id: build-lifecycle-hook-source
      - id: objectives/credential-access/files/config::developer-credential-file-read

  - id: portable-harmful-behavior
    desc: Source contains portable harmful behavior
    crit: component
    conf: 0.97
    any:
      - id: portable-browser-secret-exfiltration
      - id: portable-dns-secret-exfiltration
      - id: portable-keychain-cookie-exfiltration
      - id: portable-launchagent-exfiltration
      - id: portable-cron-remote-persistence
      - id: portable-authorized-key-backdoor
      - id: portable-runkey-persistence
      - id: portable-startup-link-dropper
      - id: portable-scheduled-secret-dropper
      - id: portable-recovery-destruction
      - id: portable-dynamic-device-wiper
      - id: portable-boot-sector-wiper
      - id: portable-disk-fill-loop
      - id: portable-shutdown-persistence-loop
      - id: portable-clipboard-crypto-hijacker
      - id: portable-hex-xor-command-loader
      - id: portable-zero-width-loader
      - id: portable-png-lsb-dropper
      - id: portable-dylib-dropper
      - id: portable-systemd-timer-dropper
      - id: portable-build-hook-secret-theft

  - id: portable-harmful-package-behavior
    desc: Package contains portable harmful behavior
    crit: hostile
    conf: 0.98
    all:
      - id: portable-harmful-behavior
    any:
      - id: metadata/package/
      - id: metadata/build/archive/
      - id: metadata/file/extension/package/
      - id: metadata/file/extension/identity::python-wheel-basename
      - id: metadata/file/extension/identity::java-archive-basename
