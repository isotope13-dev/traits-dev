# Portable behavior chains for packages that conceal harmful operations behind
# plausible library APIs. Package context and randomized gates are corroborating
# signals; no primary verdict requires recognition of the gate.
# Neutral language-specific mechanics live in their canonical
# `micro-behaviors/` files; the rules below intentionally retain only
# package-context combinations that infer a supply-chain objective.
defaults:
  platforms: [linux, macos, windows]
  attack: T1195.002
  for: [scripts, source, class, java_class]

traits:
  - id: browser-secret-store-set
    desc: Multiple browser secret stores
    crit: suspicious
    if:
      type: text
      regex: '(?is)(Login Data.{0,600}Cookies[.]binarycookies|Cookies[.]binarycookies.{0,600}Login Data)'

  - id: browser-secret-upload-endpoint
    desc: Source defines browser-data upload endpoint
    crit: notable
    if:
      type: text
      regex: 'https://[A-Za-z0-9.-]+/(ingest|upload|collect|submit)[/?]'

  - id: developer-secret-file-set
    desc: Multiple developer credential files
    crit: notable
    if:
      type: text
      regex: '(?is)[.]aws/credentials.{0,600}[.]netrc|[.]netrc.{0,600}[.]aws/credentials'

  - id: dns-query-api-source
    desc: Resolves hostnames through a DNS API
    crit: notable
    if:
      type: text
      regex: '(?i)(getaddrinfo|GetHostAddresses|lookup_host|lookupHost)'

  - id: jvm-dns-query-api-source
    desc: JVM source performs hostname resolution
    crit: notable
    if:
      type: text
      regex: '(InetAddress[.]getByName|Dns[.]gethostbyname)'

  - id: shell-history-path-source
    desc: Source references shell history
    crit: notable
    if:
      type: text
      substr: .zsh_history

  - id: launchagents-path-source
    desc: Source references LaunchAgents directory
    crit: notable
    if:
      type: text
      substr: Library/LaunchAgents

  - id: runkey-path-source
    desc: Source references Windows Run key
    crit: notable
    if:
      type: text
      regex: 'CurrentVersion[\\/]+Run'

  - id: registry-value-write-source
    desc: Registry write API or command reference
    crit: notable
    for: [scripts, source, -ruby, -powershell, class, java_class]
    if:
      type: text
      regex: '(SetValue|RegSetValue|reg\s+add|New-ItemProperty)'

  # Notable, not suspicious: the matcher reads a path, not a write. The Windows
  # CSIDL table names this folder, so any file that enumerates shell folders
  # carries the string -- Bulk Crap Uninstaller's KlocTools/Native/CSIDL.cs
  # matches on the comment documenting `CSIDL_COMMON_STARTUP`. The hostile
  # reading is `portable-startup-link-dropper` below, which adds the payload.
  - id: startup-link-source
    desc: Source creates Startup shortcut
    crit: notable
    if:
      type: text
      regex: '(Start Menu.{0,80}Startup|Startup.{0,80}[.]lnk)'

  - id: staged-command-url-source
    desc: Source references staged command URL
    crit: notable
    if:
      type: text
      regex: 'https://[A-Za-z0-9.-]+/s/[A-Fa-f0-9]{8}[.](cmd|ps1|sh)'

  # A package that builds a script path under the roaming profile is staging a
  # file it wrote, not pointing at its own installed image: the autostart
  # checkbox in ZoomIt, ScreenToGif or RunCat names an .exe in its install
  # directory, never a .js or .ps1 dropped beside its settings. The window
  # spans the Join-Path/mkdir pair between the directory and the filename.
  - id: appdata-script-drop-source
    desc: Source builds script path under AppData
    crit: notable
    if:
      type: text
      regex: '(?is)APPDATA.{0,200}\.(js|vbs|ps1|bat|cmd|hta|wsf|py)[''"]'

  - id: schtasks-token-source
    desc: Source references task scheduler utility
    crit: notable
    if:
      type: text
      regex: '(?i)\bschtasks(.exe)?\b'

  # "Runs" promises an actual encoded payload: permission classifiers,
  # blocklists, and docs mention the flag names with no blob attached, and
  # that prose is not execution. Require a base64-looking argument after the
  # flag; the flag is meaningless without one.
  - id: encoded-powershell-source
    desc: Source runs encoded PowerShell
    crit: suspicious
    if:
      type: text
      regex: '(?i)powershell.{0,80}(-EncodedCommand|-enc\b)\s+["'']?[A-Za-z0-9+/=]{16,}'

  - id: recovery-command-quartet
    desc: Four recovery destruction utilities
    crit: suspicious
    if:
      type: text
      regex: '(?is)vssadmin.{0,700}wbadmin.{0,700}bcdedit.{0,700}wevtutil'

  - id: vssadmin-delete-source
    desc: Source deletes shadow copies
    crit: notable
    if:
      type: text
      regex: '(?i)vssadmin(.exe)?.{0,50}delete.{0,50}shadows'

  - id: wbadmin-catalog-delete-source
    desc: Source deletes backup catalog
    crit: notable
    if:
      type: text
      regex: '(?i)wbadmin(.exe)?.{0,50}delete.{0,30}catalog'

  - id: while-unbounded-loop-source
    desc: Source contains unbounded loop
    crit: component
    if:
      type: text
      regex: '(?i)(while\s*[(]?\s*(true|1|\$true)|loop\s*[{])'

  - id: c-unbounded-for-loop
    desc: C source contains unbounded for loop
    crit: component
    for: [c, cpp]
    if:
      type: text
      regex: 'for\s*[(]\s*int\s+\w+\s*=\s*0\s*;\s*;'

  - id: hidden-cache-fill-path
    desc: Source targets hidden cache directory
    crit: suspicious
    if:
      type: text
      substr: .warmcache

  - id: megabyte-buffer-source
    desc: Source allocates megabyte write buffer
    crit: notable
    if:
      type: text
      regex: '(1\s*<<\s*20|1\s*-shl\s*20|1048576|1024\s*[*]\s*1024)'

  - id: repeated-file-write-source
    desc: Source repeatedly writes file data
    crit: component
    if:
      type: text
      regex: '(?i)([.]write(AllBytes)?\s*[(]|FileOutputStream|WriteFile|write_all\s*[(]|fwrite\s*[(])'

  # Notable, not suspicious: powering a machine off is the documented job of
  # provisioning and VM tooling -- Vagrant's per-guest halt capability runs
  # `shutdown -h now` on four platforms. What makes it an impact behavior is
  # repetition from a persistence slot, which `portable-shutdown-persistence-loop`
  # below assembles.
  - id: forced-shutdown-source
    desc: Source invokes forced shutdown
    crit: notable
    if:
      type: text
      regex: '(?i)(shutdown\s+(-h|/s)|System Events.{0,40}to (restart|shut down))'
    unless:
      # Approval-policy and classifier tests enumerate hostile commands
      # (`shutdown -h now`, ...) as inert strings to grade -- not to run.
      - id: metadata/package/testing/harness/runtime::test-basename-pattern
      # The Python-side approval suites do the same in test_*.py files, which
      # the JS/TS basename pattern above never covers.
      - id: metadata/package/testing/presence/harness::python-test-file

  - id: launchagent-interval-source
    desc: LaunchAgent has periodic execution keys
    crit: notable
    if:
      type: text
      regex: '(RunAtLoad|StartInterval)'

  - id: clipboard-read-source
    desc: Source reads system clipboard
    crit: notable
    if:
      type: text
      regex: '(GetText|GetClipboardData|Get-Clipboard)'

  - id: clipboard-write-source
    desc: Source writes system clipboard
    crit: notable
    if:
      type: text
      regex: '(SetText|SetClipboardData|Set-Clipboard)'

  - id: crypto-address-pattern-set
    desc: Source matches Bitcoin and Ethereum addresses
    crit: suspicious
    if:
      type: text
      regex: '(?is)bc1\[a-z0-9\]\{39,59\}.{0,500}0x\[a-fA-F0-9\]\{40\}'

  - id: windows-living-off-land-command
    desc: Source invokes Windows proxy binary
    crit: component
    if:
      type: text
      regex: '(?i)(cmd[.]exe|mshta([.]exe)?|rundll32([.]exe)?)'

  - id: long-hex-command-blob
    desc: Source embeds long hexadecimal command data
    crit: notable
    if:
      type: string_literal
      regex: '^[A-Fa-f0-9]{80,}$'

  - id: zero-width-two-bit-shift
    desc: Decoder shifts zero-width pairs
    crit: notable
    if:
      type: text
      regex: '(-shl\s+2|<<\s*2|shl\s+2|shiftLeft\s*[(]\s*2)'

  - id: dynamic-execution-source
    desc: Source performs dynamic execution
    crit: component
    if:
      type: text
      regex: '(?i)(eval\s*[(]|exec\s*[(]|Invoke-Expression|Start-Process)'

  - id: blue-channel-payload-source
    desc: Source extracts image blue channel
    crit: notable
    if:
      type: text
      regex: '(?i)blue[- ]channel'

  - id: executable-stage-source
    desc: Source launches staged executable
    crit: component
    if:
      type: text
      regex: '(?i)(chmod|setExecutable|Start-Process|ProcessBuilder|exec[.]Command|spawn\s*[(])'

  - id: build-lifecycle-hook-source
    desc: Source implements package build hook
    crit: notable
    if:
      type: text
      regex: '(build[.]rs|setup[.]py|extconf[.]rb|Makefile[.]PL|CMakeLists[.]txt|prepack)'

composite_rules:
  - id: unbounded-loop-source
    desc: Source contains unbounded loop
    crit: component
    any:
      - id: while-unbounded-loop-source
      - id: c-unbounded-for-loop

  - id: portable-browser-secret-exfiltration
    desc: Browser stores sent to remote service
    crit: hostile
    conf: 0.98
    all:
      - id: browser-secret-store-set
    any:
      - id: browser-secret-upload-endpoint
      - id: micro-behaviors/communications/url/host::dynamic-dns-hostname

  - id: portable-dns-secret-exfiltration
    desc: Developer credential material sent through DNS lookups
    crit: hostile
    conf: 0.98
    # Secret-path documentation and generic SSRF validation often occur in
    # different modules.  Require a local relationship so those package-wide
    # mentions cannot be promoted to DNS exfiltration.
    near_bytes: 8192
    all:
      - id: developer-secret-file-set
    any:
      - id: dns-query-api-source
      - id: jvm-dns-query-api-source

  - id: portable-launchagent-exfiltration
    desc: LaunchAgent persists history exfiltration
    crit: hostile
    conf: 0.99
    all:
      - id: launchagents-path-source
      - id: shell-history-path-source

  - id: portable-source-launchagent-download-loader
    desc: Package loads downloaded code through LaunchAgent
    crit: hostile
    conf: 0.98
    attack: T1053.005,T1105,T1543.004,T1195.002
    for: [source, class, java_class, c, cpp, go, java, kotlin, ruby, python, javascript, typescript, csharp, php, perl, swift, rust, zig, elixir]
    scope: file
    all:
      - id: launchagents-path-source
      - id: launchagent-interval-source
      - id: micro-behaviors/communications/http/download/curl::curl
    any:
      - id: micro-behaviors/process/create/direct::zig-child-init
      - id: micro-behaviors/process/create/exec::go-exec-command-call
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode
      - id: micro-behaviors/process/create/spawn::start
      - id: micro-behaviors/process/create/shell/lang::ruby-popen
      - id: micro-behaviors/process/create/system::elixir-system-cmd
      - id: micro-behaviors/process/create/shell/native::c-popen-variable-input
      - id: micro-behaviors/os/service/start::launchctl-load-command-text

  # Mechanism plus payload, like every other rule in this file. Writing the Run
  # key from your own source is the ordinary way an application implements a
  # "start with Windows" setting, so the mechanism alone cannot carry a hostile
  # verdict: Sysinternals ZoomIt's `ConfigureAutostart()` (vendored into
  # Microsoft PowerToys) opens CurrentVersion\Run, calls RegSetValueEx with its
  # own image path, and calls RegDeleteValue in the else branch -- and matched.
  # So did ScreenToGif, EverythingToolbar, RunCat, shadowsocks-windows and Bulk
  # Crap Uninstaller, all on their own autostart checkbox. `registry-value-write-source`
  # is broad on purpose (a bare `SetValue` matches `PropertyInfo.SetValue` in
  # any C# tree), which is fine as one leg of a pair and not as half of a
  # hostile claim. `near_bytes` additionally requires the two to be the same
  # routine rather than two ends of a repository.
  - id: portable-runkey-persistence
    desc: Package stages Run-key execution
    crit: hostile
    conf: 0.98
    # Ruby uses the canonical same-call Run-key composite. PowerShell uses
    # native command nodes or an adjacent path binding, not quoted examples.
    for: [scripts, source, -ruby, class, java_class]
    near_bytes: 2048
    all:
      - id: runkey-path-source
      - id: staged-payload-or-secret-source
    any:
      - id: registry-value-write-source
      - id: micro-behaviors/os/registry/write/run-key::powershell-reg-add-run-key
      - id: micro-behaviors/os/registry/write/run-key::powershell-literal-run-key-property
      - id: micro-behaviors/os/registry/write/run-key::powershell-assigned-run-key-property

  # What separates a trojanized package from an application with an autostart
  # setting: something worth persisting. Siblings here pair their mechanism
  # with exactly this kind of leg inline; the Run-key rule needs it as a group.
  - id: staged-payload-or-secret-source
    desc: Staged payload or secret access in source
    crit: notable
    conf: 0.9
    # Deliberately excludes this file's broadest atoms -- dynamic-execution-source
    # (`eval(`/`exec(`), executable-stage-source (`chmod`/`spawn(`) and
    # windows-living-off-land-command (`cmd.exe`) are `component` fragments that
    # almost any source tree satisfies, so admitting them here would restore the
    # false positive this group exists to close.
    any:
      - id: staged-command-url-source
      - id: encoded-powershell-source
      - id: long-hex-command-blob
      - id: schtasks-token-source
      - id: appdata-script-drop-source
      - id: developer-secret-file-set
      - id: browser-secret-store-set
      - id: browser-secret-upload-endpoint

  - id: portable-startup-link-dropper
    desc: Startup shortcut downloads command
    crit: hostile
    conf: 0.99
    all:
      - id: startup-link-source
      - id: staged-command-url-source

  - id: portable-scheduled-secret-dropper
    desc: Scheduled task runs encoded downloader
    crit: hostile
    conf: 0.99
    all:
      - id: schtasks-token-source
      - id: encoded-powershell-source

  - id: portable-recovery-destruction
    desc: Recovery and logs destroyed together
    crit: hostile
    conf: 0.995
    all:
      - id: vssadmin-delete-source
      - id: wbadmin-catalog-delete-source

  - id: portable-disk-fill-loop
    desc: Infinite writes exhaust local storage
    crit: hostile
    conf: 0.99
    all:
      - id: hidden-cache-fill-path
      - id: unbounded-loop-source
      - id: megabyte-buffer-source
      - id: repeated-file-write-source

  - id: portable-shutdown-persistence-loop
    desc: LaunchAgent repeatedly forces shutdown
    crit: hostile
    conf: 0.99
    all:
      - id: launchagents-path-source
      - id: launchagent-interval-source
    any:
      - id: objectives/impact/system/shutdown::source-forced-shutdown-command
      - id: micro-behaviors/os/event/shutdown::c-applescript-restart-literal

  - id: portable-clipboard-crypto-hijacker
    desc: Clipboard watcher replaces crypto addresses
    crit: hostile
    conf: 0.995
    all:
      - id: clipboard-read-source
      - id: clipboard-write-source
      - id: crypto-address-pattern-set

  - id: portable-hex-xor-command-loader
    desc: XOR-decoded data reaches command shell
    crit: hostile
    conf: 0.98
    all:
      - id: long-hex-command-blob
      - id: micro-behaviors/data/source/arithmetic::source-xor-operation
      - id: windows-living-off-land-command

  - id: portable-zero-width-loader
    desc: Zero-width payload reaches execution
    crit: hostile
    conf: 0.99
    near_bytes: 2400
    all:
      - id: micro-behaviors/data/string/unicode::zero-width-format-codepoint-set
      - id: zero-width-two-bit-shift
      - id: dynamic-execution-source

  - id: portable-png-lsb-dropper
    desc: PNG pixels conceal executable stage
    crit: hostile
    conf: 0.99
    all:
      - id: blue-channel-payload-source
      - id: micro-behaviors/data/source/arithmetic::lsb-bit-mask-source
      - id: executable-stage-source
    unless:
      - id: well-known/lib/web/zealphp::zealphp-source-tree

  - id: portable-build-hook-secret-theft
    desc: Build hook exports developer secrets
    crit: hostile
    conf: 0.99
    # "Exports" promises exfiltration: a build hook that reads a credential
    # file for legitimate local use (publishing with stored credentials)
    # pairs the same two legs as a stealer, as does documentation that merely
    # mentions a build filename next to a doctest example. Require the
    # credential material to leave through DNS or an upload endpoint in the
    # same file before calling the pair secret theft.
    all:
      - id: build-lifecycle-hook-source
      - id: objectives/credential-access/files/config::developer-credential-file-read
    any:
      - id: dns-query-api-source
      - id: jvm-dns-query-api-source
      - id: browser-secret-upload-endpoint

  - id: portable-native-credential-exfiltration
    desc: Native package reads developer credentials into a network sink
    crit: hostile
    # 0.97, not 0.98: pooling over the archive drops the proximity constraint
    # the file-scoped form carried, so the legs corroborate each other less.
    conf: 0.97
    attack: T1552.001,T1041,T1195.002
    for: [c, cpp]
    # A package can split the read, the pipe and the upload across separate
    # helper sources, so pool evidence over the whole archive rather than
    # requiring one file to carry the entire chain.
    scope: archive
    all:
      - id: objectives/credential-access/files/config::developer-credential-file-read
      - id: micro-behaviors/process/create/shell/native::c-popen-variable-input
    any:
      - id: micro-behaviors/communications/socket/netcat::nc
      - id: micro-behaviors/communications/http/upload::curl-data-binary

  - id: portable-native-hidden-stage-exec
    desc: Native package decodes a hidden downloaded stage and executes it
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.004,T1105,T1195.002
    for: [c, cpp]
    near_bytes: 4096
    all:
      - id: objectives/evasion/file-hiding/dotfile-create::hidden-staging-file
      - id: micro-behaviors/data/decode/hex::xxd-hex-decode
      - id: micro-behaviors/process/create/local-exec::tmp-path-execution
      - id: micro-behaviors/communications/http/download/curl::curl-download-tmp-file

  - id: portable-native-xor-command-loader
    desc: Native package XOR-decodes data into a command interpreter
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.003,T1195.002
    for: [c, cpp]
    all:
      - id: micro-behaviors/data/source/arithmetic::source-xor-operation
      - id: micro-behaviors/process/create/api-system::source-call
      - id: windows-living-off-land-command

  - id: portable-native-constructor-loader
    desc: Native constructor auto-executes an obfuscated shell stage
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.004,T1195.002
    for: [c, cpp]
    all:
      - id: micro-behaviors/process/lifecycle/auto-exec::gcc-constructor-attr
      - id: micro-behaviors/data/source/arithmetic::source-xor-operation
      - id: micro-behaviors/process/create/api-system::source-call

  - id: portable-native-dns-command-loader
    desc: Native package uses DNS TXT as a command channel
    crit: hostile
    conf: 0.98
    attack: T1071.004,T1059.004,T1195.002
    for: [c, cpp]
    scope: archive
    all:
      - id: micro-behaviors/communications/dns/lookup/txt::nslookup-txt-command-source
      - id: micro-behaviors/process/create/shell/native::c-popen-variable-input
      - id: micro-behaviors/data/string/replace::shell-echo-tr-transform

  - id: portable-native-launchagent-loader
    desc: Native package installs a periodic LaunchAgent with remote execution
    crit: hostile
    conf: 0.98
    attack: T1059.004,T1105,T1543.004,T1195.002
    for: [c, cpp]
    near_bytes: 4096
    all:
      - id: launchagents-path-source
      - id: launchagent-interval-source
      - id: micro-behaviors/process/create/shell/native::c-popen-variable-input
    any:
      - id: micro-behaviors/communications/http/curl::curl-command-remote-url
      - id: micro-behaviors/communications/dns/cli::nslookup

  - id: portable-native-browser-keychain-exfiltration
    desc: Native package steals browser keychain material and uploads it
    crit: hostile
    conf: 0.98
    attack: T1555.003,T1041,T1195.002
    for: [c, cpp]
    all:
      - id: objectives/credential-access/browser/chromium::chrome-safe-storage-keychain-query
      - id: micro-behaviors/communications/http/upload::curl-data-binary
    any:
      - id: micro-behaviors/process/create/shell/native::c-popen-variable-input
      - id: micro-behaviors/process/create/shell/spawn::system-fn

  - id: portable-native-icmp-credential-exfiltration
    desc: Native package encodes developer credentials in ICMP probes
    crit: hostile
    conf: 0.98
    attack: T1041,T1552.001,T1195.002
    for: [c, cpp]
    scope: archive
    all:
      - id: objectives/credential-access/files/config::developer-credential-file-read
      - id: micro-behaviors/communications/icmp/channel::c-icmp-helper-call
      - id: micro-behaviors/process/create/api-system::source-call

  - id: portable-native-octal-loader
    desc: Native package executes an octal-obfuscated shell downloader
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.004,T1105,T1195.002
    for: [c, cpp]
    all:
      - id: micro-behaviors/data/encode/char-code::c-octal-escape-sequence
      - id: micro-behaviors/process/create/shell/spawn::c-popen-call

  - id: portable-native-document-wipe
    desc: Native package wipes user documents through a package payload
    crit: hostile
    conf: 0.99
    attack: T1485,T1195.002
    for: [c, cpp]
    all:
      - id: objectives/impact/wipe/user-data::source-user-document-recursive-delete
      - id: micro-behaviors/process/create/api-system::source-call
    any:
      - id: micro-behaviors/os/sysinfo/hostname::host-identity-query
      - id: micro-behaviors/communications/dns/cli::nslookup

  - id: portable-native-icmp-host-identity-exfiltration
    desc: Native package sends host identity through ICMP probes
    crit: hostile
    conf: 0.97
    attack: T1041,T1016,T1195.002
    for: [c, cpp]
    scope: archive
    all:
      - id: micro-behaviors/os/env/read::c-windows-identity-environment
      - id: micro-behaviors/communications/icmp/channel::c-icmp-helper-call
      - id: micro-behaviors/process/create/api-system::source-call

  - id: portable-rpc-scheduled-task-beacon
    desc: Native package turns a remote blockchain beacon into a scheduled task
    crit: hostile
    conf: 0.98
    attack: T1053.005,T1105,T1195.002
    for: [c, cpp]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/url/rpc::ethereum-cloudflare-provider
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-source
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation

  - id: portable-rpc-storage-command-loader
    desc: Native package retrieves commands from blockchain storage
    crit: hostile
    conf: 0.98
    attack: T1102,T1059.004,T1195.002
    for: [c, cpp]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-get-storage-at-method-literal
      - id: micro-behaviors/process/create/shell/native::c-popen-variable-input
    any:
      - id: objectives/command-and-control/backdoor/dispatch/shell::darkcomp-run-cmd-command
      - id: micro-behaviors/process/create/shell/spawn::system-fn

  - id: portable-go-dns-credential-exfiltration
    desc: Go package sends developer credentials after DNS lookup
    crit: hostile
    conf: 0.98
    attack: T1041,T1552.001,T1195.002
    for: [go]
