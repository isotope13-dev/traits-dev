defaults:
  for: [go]
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.95
  attack: T1195.002

traits:
  - id: go-initialization-secret-upload
    desc: Go startup uploads secret-bearing payload
    if:
      type: value
      path: source.go.initialization_events[*].kind
      regex: '^(environment|secret|credential-file|cargo-credential)-http-body$'
  - id: go-package-initialization-secret-upload
    desc: Go initialization helpers upload secrets
    for: [tar, zip]
    if:
      type: value
      path: go_context.packages[*].behaviors[*]
      regex: '^initialization-(environment|secret|credential-file|cargo-credential)-http-body$'
