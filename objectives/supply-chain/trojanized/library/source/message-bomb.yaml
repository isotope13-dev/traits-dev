defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1195.002,T1499.003"

composite_rules:
  # An exported denial-of-service primitive embedded in an npm messaging SDK
  # is the package payload, independent of whether consumers invoke it during
  # installation or later through the public library API.
  - id: npm-messaging-library-object-bomb
    desc: NPM messaging library exports a concealed object-bomb primitive
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/impact/dos/social-platform::javascript-sendmesage-target-relay-function
      - id: objectives/impact/dos/social-platform::javascript-half-million-array-size
      - id: objectives/impact/dos/social-platform::javascript-empty-object-array-factory
      - id: micro-behaviors/data/source/property/computed::js-computed-constructor
      - id: micro-behaviors/process/debug/event::debugger-statement
    unless:
      - id: metadata/package/testing/
