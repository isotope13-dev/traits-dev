# Trojanized .NET UI libraries that ship a hidden HTTP control plane: embedded
# login query credentials, device MAC enrollment, and remote application file
# upload APIs alongside host fingerprinting (WMI) and process management.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1195.002,T1082,T1041
  mbc: B0024

traits:
  - id: http-login-username-query-param
    desc: Login URL username query parameter
    crit: component
    conf: 0.88
    if:
      type: text
      regex: "username=[^&\\s\"']{1,80}"
  - id: http-login-password-query-param
    desc: Login URL password query parameter
    crit: component
    conf: 0.88
    if:
      type: text
      substr: '&password='
  - id: http-device-mac-query-field
    desc: Device registration MAC query field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)(mac|robotmac|robatmac)='
  - id: http-app-file-upload-api-path
    desc: Application file upload API path
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '/api/[^"\s]{0,48}Upload[^"\s]{0,32}File'

composite_rules:
  - id: dotnet-ui-library-remote-enrollment-backchannel
    desc: .NET UI library remote enrollment backchannel
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/communications/http/client/managed::httpclient
      - id: http-login-username-query-param
      - id: http-login-password-query-param
      - id: http-device-mac-query-field
      - id: http-app-file-upload-api-path
    any:
      - id: micro-behaviors/os/wmi/query::wmi-processor-class
      - id: micro-behaviors/os/wmi/query::wmi-baseboard-class
      - id: micro-behaviors/process/enumerate/managed::dotnet-process-enumeration-member
    needs: 2
  - id: nuget-managed-library-remote-enrollment-backchannel
    desc: NuGet lib remote enrollment backchannel
    crit: hostile
    conf: 0.97
    for: [nupkg, pe, dll]
    scope: archive
    all:
      - id: metadata/package/files/nuget::nupkg-managed-library-member
      - id: dotnet-ui-library-remote-enrollment-backchannel
