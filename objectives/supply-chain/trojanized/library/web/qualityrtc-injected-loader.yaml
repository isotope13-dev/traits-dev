# A qualityRTC remote-code loader injected into a repackaged lib-jitsi-meet
# browser bundle. The loader is absent from the library's source tree, is
# exported on the bundle's public surface, fetches a configuration from a
# caller-steerable endpoint, and injects a script element from a third-party
# bucket. These identifiers are specimen-specific, so they stay in this IOC
# rule rather than in the generic remote-script composites.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1105
  mbc: B0024

traits:
  - id: qualityrtc-code-bucket-reference
    desc: References qualityRTC code bucket host
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: qualityrtc-sdk.s3.amazonaws.com

  - id: qualityrtc-config-endpoint-reference
    desc: References qualityRTC configuration endpoint
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: get-qualityrtc-config

  - id: qualityrtc-run-export
    desc: Exports qualityrtc run and stop entry points
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'qualityrtc:\{run:\w+\.qrtcRun,stop:\w+\.qrtcStop\}'

composite_rules:
  - id: qualityrtc-injected-remote-loader
    desc: qualityRTC loader injects remotely hosted code and config
    crit: hostile
    conf: 0.96
    needs: 2
    any:
      - id: qualityrtc-code-bucket-reference
      - id: qualityrtc-config-endpoint-reference
      - id: qualityrtc-run-export
