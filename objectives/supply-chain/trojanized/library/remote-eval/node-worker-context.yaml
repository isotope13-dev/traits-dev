# JSONKeeper response data is explicitly marked as payload and sent to a
# worker-side async function. This is remote evaluation in a trojanized
# library context; it is not a generic dropper execution directory.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1105,T1059.007
  mbc: B0024
composite_rules:
  - id: jsonkeeper-worker-payload-dropper
    desc: JSONKeeper worker evaluates response payload
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/infrastructure/paste::jsonkeeper
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: objectives/supply-chain/trojanized/library/remote-eval::response-data-payload-field
      - id: micro-behaviors/communications/ipc/message::postmessage-call
      - id: micro-behaviors/data/control-flow/module-exec::assigned-async-function-iife
