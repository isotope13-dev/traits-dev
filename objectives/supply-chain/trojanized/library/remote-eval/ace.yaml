defaults:
  platforms: [windows, unix]
  for: [javascript]

composite_rules:
  # Snippet modules export editor text, not an obfuscated HTTP evaluator.
  # Require the loader cluster and the host identity; neither the editor's
  # AMD wrapper nor string-array obfuscation alone establishes an injection.
  - id: ace-snippets-injected-loader
    desc: Ace snippets contain an obfuscated HTTP response loader
    crit: hostile
    conf: 0.99
    attack: T1189,T1059.007
    all:
      - id: well-known/lib/ui/ace-editor::ace-snippets-module
      - id: objectives/anti-static/obfuscation/eval/loader::concealed-eval-guarded-dispatch
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime
