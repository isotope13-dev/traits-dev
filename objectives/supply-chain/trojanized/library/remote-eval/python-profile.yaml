# The 2026-10 voice/audio-profile campaign used misleading profile summaries
# for small wheels whose Python module fetched a profile, compiled and executed
# it in a ModuleType namespace, then delegated to its run() entry point. The
# summary is required as content context; package names and hashes are not.
# Public corroboration: OSV MAL-2026-18140 (grommatts) and MAL-2026-18139
# (dictanovaasr). Both advisories describe loader packages; the remote payload
# and actual use remain unknown, so the rule claims only the loader behavior.
defaults:
  platforms: [unix, windows]
  for: [whl, python, pkginfo]
  attack: T1195.002,T1105,T1059.006
  mbc: B0024,E1059

composite_rules:
  - id: audio-profile-remote-python-loader
    desc: Audio or speech profile wheel executes a fetched Python module
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/description/function::audio-profile-loader-whl-summary
      - id: micro-behaviors/os/api-resolution/dynamic::python-module-dict-exec
      - id: micro-behaviors/data/control-flow/return::python-delegates-to-loaded-module-run
    any:
      - id: micro-behaviors/process/deploy/script-eval::python-helper-fetched-source-exec-flow
      - id: micro-behaviors/process/deploy/script-eval::python-helper-returned-bytes-compile-exec-flow
