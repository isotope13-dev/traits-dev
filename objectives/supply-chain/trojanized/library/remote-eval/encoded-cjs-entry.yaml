# CommonJS entry replaced with an array of Base64 blobs that decode to
# remote-eval loaders. Catches Contagious Interview-style dual-publish trojans
# without hardcoding throwaway hostnames or package names.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002

traits:
  - id: js-multi-base64-string-candidates
    desc: Multiple Base64 string candidates in JavaScript
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: strings.base64_candidates
      min: 3

  - id: cjs-exports-bound-identifier
    desc: CommonJS exports a bound identifier
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?m)^module\.exports\s*=\s*[A-Za-z_$][\w$]*\s*;?\s*$'

  - id: js-array-of-long-base64-literals
    desc: Array literal of long Base64 strings
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: "\\[\\s*'[A-Za-z0-9+/]{80,}={0,2}'\\s*,"

composite_rules:
  - id: cjs-base64-array-encoded-fetch-eval
    desc: CJS entry is Base64 array of fetch-eval loaders
    crit: hostile
    conf: 0.99
    mbc: B0009.016
    all:
      - id: cjs-exports-bound-identifier
      - id: js-array-of-long-base64-literals
      - id: js-multi-base64-string-candidates
      - id: objectives/command-and-control/dropper/delivery/fetch-eval::encoded-eval-await-fetch
    unless:
      - id: metadata/package/testing/
