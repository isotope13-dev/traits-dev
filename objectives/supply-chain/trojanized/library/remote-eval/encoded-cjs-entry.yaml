# CommonJS entry replaced with an array of Base64 blobs that decode to
# remote-eval loaders. Catches Contagious Interview-style dual-publish trojans
# without hardcoding throwaway hostnames or package names.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002

traits:
  # NOTE: the "many base64 candidates" and "module.exports = <identifier>"
  # legs are neutral capabilities present in nearly every bundled JS file
  # (React/webpack output, every `module.exports = bindings` shim), so they
  # live in micro-behaviors/ and are referenced from the composite below.
  - id: js-array-of-long-base64-literals
    desc: Array literal of long Base64 strings
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: "\\[\\s*'[A-Za-z0-9+/]{80,}={0,2}'\\s*,"
    unless:
      # Long Base64 literals are common in crypto/address test vectors. The
      # hostile composite already requires the runtime loader legs, while
      # test files should not be reported as suspicious on this leg alone.
      - id: metadata/package/testing/

composite_rules:
  - id: cjs-base64-array-encoded-fetch-eval
    desc: CJS entry is Base64 array of fetch-eval loaders
    crit: hostile
    conf: 0.99
    mbc: B0009.016
    all:
      - id: micro-behaviors/data/control-flow/module-exec::commonjs-module-exports-identifier
      - id: js-array-of-long-base64-literals
      - id: metadata/file/encoded::multi-base64-string-candidates
      - id: objectives/command-and-control/dropper/delivery/fetch-eval::encoded-eval-await-fetch
    unless:
      - id: metadata/package/testing/
