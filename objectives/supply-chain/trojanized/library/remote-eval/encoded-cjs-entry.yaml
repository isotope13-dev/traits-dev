# CommonJS entry replaced with an array of Base64 blobs that decode to
# remote-eval loaders. Catches Contagious Interview-style dual-publish trojans
# without hardcoding throwaway hostnames or package names.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002

traits: []
composite_rules:
  - id: cjs-base64-array-encoded-fetch-eval
    desc: CJS entry is Base64 array of fetch-eval loaders
    crit: hostile
    conf: 0.99
    mbc: B0009.016
    all:
      - id: micro-behaviors/data/control-flow/module-exec::commonjs-module-exports-identifier
      - id: metadata/file/encoded::bracketed-base64-like-pair
      - id: metadata/file/encoded::multi-base64-string-candidates
      - id: objectives/command-and-control/dropper/script-eval/remote-code::encoded-eval-await-fetch
    unless:
      - id: metadata/package/testing/
