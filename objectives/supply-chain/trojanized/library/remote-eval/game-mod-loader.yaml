# A game-mod jar whose entry loads classes from a URL at runtime through the
# reflection trampoline -- `new URLClassLoader(...)[0].newInstance()` -- with
# member names random hex so the class being invoked cannot be guessed from
# the strings. The loader rules under command-and-control convict the staging;
# this states the supply-chain shape: a game client mod has no legitimate
# remote class source, and every name in it being random is the tell that the
# author knows that.
#
# Worked example: the better-mc dungeonz jar, whose classloader stage hides
# behind random hex member names inside a Minecraft client mod.
defaults:
  platforms: [unix, windows]
  for: [java, jar]
  attack: T1195.002,T1105
  mbc: E1105

composite_rules:
  - id: game-mod-reflective-remote-classloader
    desc: Game mod reflectively loads remote classes
    crit: hostile
    conf: 0.96
    all:
      - id: well-known/game/mod::minecraft-client-class-ref
      - id: objectives/command-and-control/backdoor/loader/stage::url-array-constructor-signature
      - id: objectives/anti-static/obfuscation/name-mangling/member-name::java-random-hex-member-name
