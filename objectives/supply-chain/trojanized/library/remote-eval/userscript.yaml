defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1105,T1059.007

composite_rules:
  # A normal UMD distribution has no reason to invoke privileged userscript
  # APIs, disclose the installed script identity, or execute an HTTP response.
  - id: umd-userscript-remote-eval-implant
    desc: UMD library embeds userscript remote-code implant
    crit: hostile
    conf: 0.995
    all:
      - id: metadata/library/structure::js-umd-wrapper-minified
      - id: objectives/command-and-control/dropper/delivery/fetch-eval::userscript-gm-response-eval-flow
      - id: micro-behaviors/communications/http/client/xmlhttp::userscript-gm-xmlhttp-request
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
      - id: micro-behaviors/browser-extension/lifecycle::userscript-script-metadata-read
