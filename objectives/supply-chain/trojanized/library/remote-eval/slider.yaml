defaults:
  platforms: [windows, unix]
  for: [javascript, html, text, makefile]
composite_rules:
  - id: slider-revolution-injected-loader
    desc: Slider Revolution contains a concealed HTTP response loader
    crit: hostile
    conf: 0.99
    attack: T1189,T1059.007
    all:
      - id: well-known/lib/ui/slider-revolution::version-registry
      - id: micro-behaviors/communications/http/client/xmlhttp::httpclient-wrapper-over-xmlhttprequest
      - id: objectives/anti-static/obfuscation/eval/loader::concealed-eval-response-callback
