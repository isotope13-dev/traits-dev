defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1105,T1059.006

composite_rules:
  - id: trojanized-python-module-sandbox-gated-stdin-loader
    desc: Trojanized Python module with SANDBOX/CI check and remote stdin loader
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/evasion/security-bypass/llm/output-steering::sandbox-or-ci-env-deactivation-check
      - id: objectives/execution/payload/interpreter-stdin/network::python-stdin-write-response-text-encode
      - id: micro-behaviors/process/deploy/interpreter-stdin/input::sys-executable-stdin-subprocess
      - id: micro-behaviors/communications/http/get::requests-get-without-reserved-literal-prefix
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::python-osname-nt-check
