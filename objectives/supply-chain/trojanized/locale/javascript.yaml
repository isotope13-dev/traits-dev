defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1195.002
  mbc: B0032
composite_rules:
- id: locale-resource-network-client
  desc: Locale data module opens a network client
  crit: suspicious
  conf: 0.9
  near_bytes: 8192
  all:
  - id: micro-behaviors/data/format/locale::js-locale-registration-without-bundle
  any:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
  - id: micro-behaviors/communications/websocket/handler::websocket-javascript-constructor
  - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon
  - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
- id: locale-resource-runtime-code-build
  desc: Locale data module builds code at runtime
  crit: suspicious
  conf: 0.9
  near_bytes: 8192
  all:
  - id: micro-behaviors/data/format/locale::js-locale-registration-without-bundle
  any:
  - id: micro-behaviors/process/interpreter/eval/direct
  - id: micro-behaviors/process/interpreter/eval/decoded::js-eval-url-decoded
  - id: micro-behaviors/process/interpreter/eval/decoded::js-eval-final-line-base64
  - id: micro-behaviors/process/interpreter/eval/decoded::js-eval-decode-named-helper
  - id: micro-behaviors/process/interpreter/eval/indirect
  - id: metadata/lang/source/syntax/call/invocation::evaluator-or-constructor-variable-call-text
  - id: objectives/execution/interpreter/eval/remote/
  - id: objectives/execution/payload/script-eval/blockchain::obfuscated-blockchain-http-node-child
  - id: micro-behaviors/process/interpreter/vm::vm-runInContext-call
- id: trojanized-locale-resource
  desc: Locale data module fetches and runs code
  crit: hostile
  conf: 0.95
  attack: T1195.002,T1059.007
  near_bytes: 8192
  all:
  - id: locale-resource-network-client
  - id: locale-resource-runtime-code-build
