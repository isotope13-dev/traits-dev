# Trojanized JavaScript locale resources.
#
# A per-locale resource file is pure data plus one registration call: month and
# weekday names, format strings, an ordinal function. Every i18n-aware page
# loads one, they ship dozens-to-a-directory under vendored `locale/` trees
# that reviewers page past, and a diff of one is unreadable because they are
# minified data. That makes them the natural next stop after the dist-bundle
# trojanizations (eslint-scope, ua-parser-js, node-ipc) one directory up.
#
# The invariant this exploits in the attacker's favour is also what convicts:
# a locale data table has no reason to open a network client, and no reason to
# build code at runtime. Either one alone is already out of place; both in the
# same small file is not a locale resource any more.
#
# Every composite carries its own size cap. Without it the identity leg matches
# any application bundle that embeds a locale table (moment-with-locales, an
# i18n runtime that both registers data and lazily fetches catalogs), and those
# legitimately do both things this rule treats as disqualifying.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1195.002
  mbc: B0032

composite_rules:
  # Locale-asset identity. `js-locale-registration-module` covers the Moment,
  # date-fns and Angular generations, all keyed on a registration call the
  # newer calendar locale assets no longer make: a FullCalendar 3.x
  # `fullCalendar.locale("sk", {...})`, a 4.x `globalLocales.push(...)`, and
  # the bare @fullcalendar/core option table register through the library
  # instead. Without these legs a trojanized FullCalendar locale — the same
  # vendored-under-locale/ drive-by target — never reaches the composites
  # below.
  - id: locale-resource-identity
    desc: JavaScript locale data resource
    crit: notable
    conf: 0.97
    any:
      - id: metadata/file/profile/locale::js-locale-registration-module
      - id: well-known/lib/fullcalendar::fullcalendar-locale-registration
      - id: well-known/lib/fullcalendar::fullcalendar-global-locale-push
      - id: well-known/lib/fullcalendar::fullcalendar-locale-option-set

  - id: locale-resource-network-client
    desc: Locale data module opens a network client
    crit: suspicious
    conf: 0.9
    size_max: 65536
    all:
      - id: locale-resource-identity
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
      - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
      - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon
      - id: micro-behaviors/communications/http/client/resource::dynamic-script-element-load

  - id: locale-resource-runtime-code-build
    desc: Locale data module builds code at runtime
    crit: suspicious
    conf: 0.9
    size_max: 65536
    all:
      - id: locale-resource-identity
    # Any runtime-code-evaluation capability at all is disqualifying here, so
    # take the whole directory rather than enumerating eval/Function forms.
    any:
      - id: micro-behaviors/process/interpreter/eval

  - id: trojanized-locale-resource
    desc: Locale data module fetches and runs code
    crit: hostile
    conf: 0.95
    attack: "T1195.002,T1059.007"
    size_max: 65536
    all:
      - id: locale-resource-network-client
      - id: locale-resource-runtime-code-build
