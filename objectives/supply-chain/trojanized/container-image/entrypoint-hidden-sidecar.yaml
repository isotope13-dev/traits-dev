# A container entrypoint wrapper that, before handing off to the image's CMD
# with `exec "$@"`, starts a program from a hidden system path detached and
# silenced. The container appears to run exactly what the user asked for while
# a second process keeps running beside it. Legitimate wrappers that start a
# helper daemon name it from a normal install path; the hidden /usr entry and
# a staging/persistence step are what make this a planted sidecar.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1195.002,T1610

composite_rules:
  - id: entrypoint-hidden-background-sidecar
    desc: Entrypoint wrapper starts a hidden detached payload before exec of CMD
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/process/replace::shell-exec-argument-passthrough
      - id: micro-behaviors/process/daemonize/detach::nohup-hidden-output
      - id: micro-behaviors/fs/path/system/directory::usr-data-dir-hidden-entry
    any:
      - id: micro-behaviors/crypto/decrypt/initialize::shell-inline-node-decipher
      - id: micro-behaviors/os/autorun/cron/unspecified::crontab-append-pipeline
      - id: micro-behaviors/fs/path/hidden::home-hidden-dotdir-ref
