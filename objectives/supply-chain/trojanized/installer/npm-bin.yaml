# npm command shims that materialize and execute mutable remote shell content.
# A user-facing bin is a normal place for a vendor installer, so this objective
# requires both the complete download-to-interpreter chain and a mutable raw
# GitHub reference that is written with executable permissions; the neutral
# atoms remain useful for ordinary installers.
defaults:
  platforms: [unix, windows]
  for: [npm, tar]
  attack: "T1195.002,T1105,T1059.004"

composite_rules:
  - id: npm-bin-raw-remote-shell-bootstrap
    desc: npm CLI downloads and executes a mutable raw-GitHub shell script
    crit: hostile
    conf: 0.99
    scope: archive
    for: [source, binaries, '!dex', scripts, '!jcl', json, npm, tar]
    all:
      - id: micro-behaviors/process/create/shell/interpreter::node-download-interpreter-launch-cooccurrence
      - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-script-file
      - id: micro-behaviors/fs/write/file/executable::node-write-file-executable-mode
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"

  # A bin command that launches PowerShell with policy bypass and evaluates a
  # mutable raw-GitHub script is an executable remote-code bootstrap. It does
  # not need to stage a local file first: the PowerShell pipeline itself fetches
  # and evaluates the response.
  - id: npm-bin-powershell-remote-eval-bootstrap
    desc: npm CLI evaluates a mutable raw-GitHub PowerShell script
    crit: hostile
    conf: 0.99
    scope: archive
    for: [npm, tar, package.json, javascript, typescript]
    attack: T1195.002,T1105,T1059.001,T1562.001
    all:
      - id: metadata/package/entrypoint::bin-field-declared
      - id: micro-behaviors/process/create/shell/script-host::node-powershell-remote-bootstrap-syntax
      - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-script-file
