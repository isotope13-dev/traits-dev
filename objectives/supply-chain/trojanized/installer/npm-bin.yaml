defaults:
  platforms:
  - unix
  - windows
  for:
  - npm
  - tar
  attack: T1195.002,T1105,T1059.004
  crit: hostile
  conf: 0.99
composite_rules:
- id: npm-bin-raw-remote-shell-bootstrap
  desc: npm CLI downloads and executes a mutable raw-GitHub shell script
  scope: archive
  for:
  - source
  - binaries
  - '!dex'
  - scripts
  - '!jcl'
  - json
  - npm
  - tar
  all:
  - id: objectives/execution/payload/file-exec/download/runtime::node-download-interpreter-launch-cooccurrence
  - id: well-known/app/development/code-forge/github::raw-githubusercontent-script-file
  - id: micro-behaviors/fs/write/file/executable::node-write-file-executable-mode
  unless:
  - id: metadata/path/directory::test-directory-component
- id: npm-bin-powershell-remote-eval-bootstrap
  desc: npm CLI evaluates a mutable raw-GitHub PowerShell script
  scope: archive
  for:
  - npm
  - tar
  - package.json
  - javascript
  - typescript
  attack: T1195.002,T1105,T1059.001,T1562.001
  all:
  - id: metadata/package/entrypoint/command::bin-field-declared
  - id: objectives/execution/payload/script-eval/network/response-body::node-powershell-remote-bootstrap-syntax
  - id: well-known/app/development/code-forge/github::raw-githubusercontent-script-file
- id: npm-bin-release-binary-mismatched-loader
  desc: npm CLI release download and launch with package-name mismatch
  scope: archive
  for:
  - npm
  - tar
  - package.json
  - javascript
  - typescript
  attack: T1195.002,T1105,T1059.007
  crit: hostile
  conf: 0.96
  all:
  - id: metadata/package/entrypoint/command::bin-field-declared
  - id: micro-behaviors/communications/url/external/github::github-release-download
  - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
  - id: micro-behaviors/process/create/variable::spawn-variable-program
  - id: metadata/package/repository::npm-name-repo-mismatch
  unless:
  - id: well-known/tool/development/cli/agentdesk::reviewed-release-wrapper
  - id: metadata/path/directory::test-directory-component
