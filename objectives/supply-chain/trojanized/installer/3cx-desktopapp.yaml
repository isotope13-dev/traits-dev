# The 2023-03-13 3CX Desktop App installer shipped the compromised Windows
# Electron build. Its MSI file table names the paired ffmpeg and D3D compiler
# libraries used by the staged loader chain. Require product metadata, build
# date, and the payload pair so normal WiX installers and unrelated Electron
# bundles remain clean.
defaults:
  platforms: [windows]
  for: [oledoc, msi]
composite_rules:
  - id: 3cx-desktopapp-compromised-installer
    desc: 3CX compromised desktop app installer
    crit: hostile
    conf: 0.99
    attack: T1195.002
    all:
      - id: metadata/package/files/msi/identity::msi-3cx-desktopapp-subject
      - id: metadata/package/files/msi/identity::msi-created-2023-03-13
      - id: metadata/package/files/msi/strings::msi-3cx-compromised-dll-pair
