# An installer whose payload includes a vendor's setup program and a DLL that
# makes itself a rundll32 Run entry and injects into other processes is a
# trojanized installer: the user runs the vendor setup, the DLL rides along.
# The Havex wave (2014) wrapped eWON eGrabIt and MB Connect Line setups in
# NSIS/WinRAR SFX stubs that ran the real setup and rundll32 TmProvider.dll.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: installer-bundles-vendor-setup-and-autorun-injector-dll
    desc: Installer bundles vendor setup and injector DLL
    crit: hostile
    conf: 0.95
    attack: T1195.002
    scope: outer
    all:
      - id: metadata/file/format/installer/
      - id: objectives/persistence/login/registry/run-key::rundll32-run-key-dll-with-remote-thread-injection
    any:
      - id: metadata/signature/certificate/subject::pe-signer-subject-record
      - id: metadata/binary/provenance/version-info::pe-version-company-name-value
