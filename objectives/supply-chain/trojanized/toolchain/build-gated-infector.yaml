# The payload half of a toolchain-seed trojan: a binary infector that checks
# it is running inside a package build sandbox before it acts. Gating on the
# build environment spreads the implant through build outputs while the tool
# behaves normally on a developer's machine. The recipe half (infecting a
# seed binary) is in nix-bootstrap.yaml.
defaults:
  platforms: [linux]
  for: [elf, data]
  attack: T1195.001,T1554
  mbc: E1195

composite_rules:
  - id: build-sandbox-gated-binary-infector
    desc: Binary infector gated on a build sandbox
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/impact/infect/binary/patch-header::cmdline-header-rewriting-parasite
      - id: metadata/build/environment::nix-build-top-env-marker
