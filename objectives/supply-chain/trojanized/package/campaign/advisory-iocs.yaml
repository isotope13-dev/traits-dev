defaults:
  platforms: [unix, windows]
composite_rules:
  - id: known-malicious-dsh-bot-connector-desktop
    desc: Advisory-listed malicious desktop connector release
    crit: hostile
    conf: 0.99
    for: [npm]
    ref: https://github.com/advisories/GHSA-jgfj-8xjp-7w7g
    attack: T1195.002
    all:
      - id: metadata/package/name/identity::dsh-bot-connector-desktop-name
      - id: metadata/package/name/identity::dsh-bot-connector-desktop-affected-version
