# Exact npm package IOCs from the AccuraSoftHire fake-interview campaign
# (JFrog/StepSecurity IOC table: treat any version other than npm's
# security placeholder as malicious). The published package name is the
# victim's install target, so it is the stable identifier; the package
# bodies are otherwise copies of real Tailwind plugins with a PolinRider
# loader appended. npm replaced affected packages with a 0.0.1-security
# placeholder; exempt that replacement artifact.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json]
  attack: T1195.002
  mbc: E1195.002

traits:
  - id: accurasoft-scrollbar-hide-plugin-name
    desc: Package named scrollbar-hide-plugin
    crit: notable
    conf: 0.995
    for: [package.json]
    if:
      type: value
      path: name
      exact: scrollbar-hide-plugin

  - id: accurasoft-tailwind-forms-clone-name
    desc: Package name mimics official forms plugin
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^(tailwind-custom-forms|tailwind-forms-kit|tailwind-form-styles)$'

  - id: accurasoft-tailwind-clamps-clone-name
    desc: Package name mimics official line-clamp plugin
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^(tailwind-lines-clamps|tailwind-clamps-line|tailwind-lineclamp)$'

  - id: accurasoft-tailwind-other-clone-name
    desc: Package name is another campaign look-alike
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^(tailwindcss-contact-forms|tailwind-anim|tailwindcss-anim)$'

composite_rules:
  - id: accurasoft-campaign-package-name
    desc: Package name is a campaign IOC name
    crit: notable
    conf: 0.99
    for: [package.json]
    any:
      - id: accurasoft-scrollbar-hide-plugin-name
      - id: accurasoft-tailwind-forms-clone-name
      - id: accurasoft-tailwind-clamps-clone-name
      - id: accurasoft-tailwind-other-clone-name

  - id: accurasoft-campaign-package-ioc
    desc: Package name matches AccuraSoftHire IOC
    crit: hostile
    conf: 0.99
    for: [package.json]
    all:
      - id: accurasoft-campaign-package-name
    unless:
      - id: accurasoft-campaign-security-placeholder

  # Benign-context composite: npm's 0.0.1-security placeholder replaces
  # each affected package after takedown and must not be treated as the
  # malicious IOC.
  - id: accurasoft-campaign-security-placeholder
    desc: npm security placeholder replaces IOC
    crit: exception
    conf: 0.99
    for: [package.json]
    all:
      - id: accurasoft-campaign-package-name
      - id: metadata/package/versioning/scheme::npm-security-holder-version
