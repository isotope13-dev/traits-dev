# Registry and advisory feeds identify this package coordinate as malicious.
# Pair its exact identity with the Litecoin BlockCypher API behavior shared by
# the older transaction wrapper and later wallet-key webhook releases.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002

traits:
  - id: litecore-lib-ltc-package-name-ioc
    desc: Package name matches litecore-lib-ltc IOC
    crit: notable
    conf: 0.99
    if:
      type: value
      path: name
      exact: litecore-lib-ltc

composite_rules:
  - id: litecore-lib-ltc-npm-archive-ioc
    desc: npm archive matches malicious litecore-lib-ltc IOC
    crit: hostile
    conf: 0.99
    for: [npm, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: litecore-lib-ltc-package-name-ioc
      - id: micro-behaviors/communications/http/services/blockchain::blockcypher-api
