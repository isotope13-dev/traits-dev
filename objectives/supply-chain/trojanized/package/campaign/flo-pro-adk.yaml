# GitHub's malware advisory lists flo-pro-adk 0.0.0 and 1.0.0 as affected.
# Keep this exact-coordinate IOC separate from behavior rules: the supplied
# 0.0.0 sdist reconstruction contains only placeholder files.
defaults:
  platforms: [unix, windows]
  for: [pkginfo]
  attack: T1195.002

traits:
  - id: flo-pro-adk-name-ioc
    desc: Advisory-listed flo-pro-adk package
    crit: notable
    conf: 0.99
    ref: https://github.com/advisories/GHSA-q9fg-wfvh-ggp3
    downgrade:
      any:
        - id: metadata/package/version::other-package-version
    if:
      type: value
      path: name
      exact: flo-pro-adk

  - id: flo-pro-adk-affected-version-ioc
    desc: Advisory-listed flo-pro-adk version
    crit: notable
    conf: 0.99
    ref: https://github.com/advisories/GHSA-q9fg-wfvh-ggp3
    # A shared version alone is not an IOC for a different named package.
    unless:
      - id: metadata/package/name/presence::other-package-name
    if:
      type: value
      path: version
      regex: '^(0\.0\.0|1\.0\.0)$'

composite_rules:
  - id: flo-pro-adk-advisory-coordinate
    desc: flo-pro-adk release is listed as malicious
    crit: hostile
    conf: 0.99
    ref: https://github.com/advisories/GHSA-q9fg-wfvh-ggp3
    scope: file
    all:
      - id: flo-pro-adk-name-ioc
      - id: flo-pro-adk-affected-version-ioc
