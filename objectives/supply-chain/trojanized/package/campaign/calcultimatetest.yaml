# This release hides a downloader command in the package.json signature field.
# main.js XOR-decodes the field with a key from config.json, gates on the
# decoded EXEC_MODE marker, then runs an initialization command. The decoded
# curl-and-launch command is not itself passed to exec in this release, so the
# behavior evidence is paired with the exact package identity and version.
defaults:
  platforms: [unix, windows]
  for: [npm, package.json]
  attack: T1195.002

traits:
  - id: calcultimatetest-package-name
    desc: Package name is calcultimatetest
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: calcultimatetest

  - id: xor-decodes-manifest-gate
    desc: XOR-decodes a manifest execution gate
    crit: suspicious
    conf: 0.96
    for: [javascript]
    attack: T1027
    if:
      type: text
      regex: "fromCharCode\\s*\\(\\s*\\w+\\[\\w+\\]\\s*\\^\\s*\\w+\\[\\w+\\s*%\\s*\\w+\\.length\\]\\s*\\)"

  - id: decoded-marker-gates-child-command
    desc: Decoded marker gates a child command
    crit: suspicious
    conf: 0.96
    for: [javascript]
    attack: T1059.003
    if:
      type: text
      regex: "decoded\\.includes\\s*\\(\\s*['\"]EXEC_MODE['\"]\\s*\\)[\\s\\S]{0,180}child_process"

composite_rules:
  - id: calcultimatetest-advisory-release
    desc: Advisory-listed calcultimatetest release
    crit: hostile
    conf: 0.99
    ref: https://github.com/advisories/GHSA-c7gv-mp6p-m8mj
    scope: package
    all:
      - id: calcultimatetest-package-name
      - id: metadata/package/versioning/sentinel::npm-version-exactly-1-0-0

  - id: calcultimatetest-encoded-downloader-release
    desc: Release hides an XOR-decoded downloader command
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1027,T1105,T1059.003
    ref: https://github.com/advisories/GHSA-c7gv-mp6p-m8mj
    for: [npm, package.json, javascript]
    scope: package
    all:
      - id: calcultimatetest-package-name
      - id: metadata/package/versioning/sentinel::npm-container-version-exactly-1-0-0
      - id: xor-decodes-manifest-gate
      - id: decoded-marker-gates-child-command
