defaults:
  platforms: [unix, windows]
  for: [npm, package.json]
  attack: T1195.002

traits:
  - id: calcultimatetest-package-name
    desc: Package name is calcultimatetest
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: calcultimatetest

composite_rules:
  - id: calcultimatetest-advisory-release
    desc: Advisory-listed calcultimatetest release
    crit: hostile
    conf: 0.99
    ref: https://github.com/advisories/GHSA-c7gv-mp6p-m8mj
    scope: package
    all:
      - id: calcultimatetest-package-name
      - id: metadata/package/versioning/sentinel::npm-version-exactly-1-0-0
