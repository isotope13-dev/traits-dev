# The malicious teick releases are metadata-only npm archives whose
# preinstall hook curls a fixed public IP. Keep the hostile identity scoped to
# the advisory-listed package versions; the reusable hook and IP observations
# remain in their capability rules for unrelated packages and copycats.
defaults:
  platforms: [unix, windows]
  for: [npm, package.json]
  attack: T1195.002,T1071.001

traits:
  - id: teick-package-name
    desc: Package name is teick
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: teick

  - id: teick-advisory-version
    desc: Teick version is advisory-listed
    crit: notable
    for: [package.json]
    if:
      type: value
      path: version
      regex: '^1\.0\.[0-2]$'

composite_rules:
  - id: teick-ip-callback-campaign
    desc: Advisory-listed teick release curls an IP during preinstall
    crit: hostile
    conf: 0.99
    ref: https://github.com/advisories/GHSA-h8xq-3qvf-p57g
    scope: package
    all:
      - id: teick-package-name
      - id: teick-advisory-version
      - id: metadata/package/entrypoint/module::npm-archive-ships-no-code-member
      - id: micro-behaviors/communications/http/request/package::npm-preinstall-ip-callback
