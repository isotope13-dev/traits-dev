defaults:
  platforms: [unix, windows]

composite_rules:
  - id: graphflux-malicious-release-ioc
    desc: Advisory-listed malicious GraphFlux release
    crit: hostile
    conf: 0.99
    for: [whl]
    ref: https://github.com/advisories/GHSA-cr38-xhg9-87xm
    attack: T1195.002
    all:
      - id: metadata/package/name/identity::graphflux-pypi-distribution
      - id: metadata/package/name/identity::graphflux-affected-release
