# The just4testlm campaign report identifies this host hierarchy as an IOC.
# This rule reports the observed request, not the payloads in other releases.
defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: just4testlm-campaign-http-get
    desc: GET to reported just4testlm campaign host
    crit: hostile
    conf: 0.98
    ref: https://bad-packages.kam193.eu/pypi/campaign/2026-03-just4testlm/
    if:
      type: symbol
      kind: call
      exact: requests.get
      arg:
        index: 0
        from:
          value: '^https?://[a-zA-Z0-9-]{1,63}\.8d90982c\.cdn\.cloudops\.ink(/|$)'
