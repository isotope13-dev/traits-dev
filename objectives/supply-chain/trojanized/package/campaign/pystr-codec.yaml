defaults:
  platforms: [unix, windows]
  for: [whl, pkg_info]
  attack: T1195.002

traits:
  - id: pystr-codec-package-name
    desc: Package metadata names pystr-codec
    crit: notable
    for: [pkg_info]
    if:
      type: value
      path: name
      exact: pystr-codec

  # A version alone is common metadata. The hostile release claim also needs
  # the exact package identity and the advisory-reported wheel startup hook.
  - id: pystr-codec-advisory-version
    desc: Version is in advisory range 0.1.0–0.1.2
    crit: component
    for: [pkg_info]
    if:
      type: value
      path: version
      regex: '^0\.1\.[0-2]$'

composite_rules:
  - id: pystr-codec-advisory-release
    desc: Advisory-listed pystr-codec release
    crit: hostile
    conf: 0.99
    ref: https://github.com/advisories/GHSA-f93h-mc69-274w
    scope: outer
    all:
      - id: pystr-codec-package-name
      - id: pystr-codec-advisory-version
      - id: metadata/package/files/wheel-sdist::wheel-pth-startup-member
