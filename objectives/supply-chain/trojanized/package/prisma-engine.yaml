# The fetch-engine implementation is a supply-chain substitution when a
# package presenting Prisma identity changes the native-engine source from
# Prisma's mirror to an unrelated GitHub release.  The atomic URL/template
# observations live in communications/http/download/package/prisma.yaml.
defaults:
  platforms: [unix, windows]
  for: [npm]
  attack: T1195.002,T1105

composite_rules:
  - id: prisma-engine-source-substitution
    desc: Republished Prisma package redirects native engines to GitHub
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: objectives/supply-chain/impersonation/package/manifest::third-party-prisma-package-impersonation
      - id: micro-behaviors/communications/http/download/package::prisma-engine-github-mirror
      - id: micro-behaviors/communications/http/download/package::prisma-engine-asset-template
