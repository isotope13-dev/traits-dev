# Remote administration and AI-agent runtimes are dual-use.  Escalate only
# when their command/control capabilities are concealed by a rotating string
# table, rather than treating either agent features or minification alone as
# suspicious.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1027.002

composite_rules:
  - id: obfuscated-unattended-agent-runtime
    desc: Obfuscated package enables unattended AI-agent execution
    crit: suspicious
    conf: 0.96
    scope: file
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: objectives/execution/automation/agent::agent-unattended-execution-mode

  - id: obfuscated-agent-credentialed-control-channel
    desc: Obfuscated agent combines credential access with a messaging gateway
    crit: suspicious
    conf: 0.95
    scope: file
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: micro-behaviors/os/env/vars/credentials::service-credential-env-var
      - id: micro-behaviors/process/create/agent-channel::ai-agent-messaging-gateway-setting

  - id: obfuscated-agent-command-liveness-protocol
    desc: Obfuscated agent implements command arguments and liveness sequencing
    crit: suspicious
    conf: 0.95
    scope: file
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: micro-behaviors/communications/http/request/tasking::http-command-argument-fields
      - id: micro-behaviors/communications/http/request/tasking::http-liveness-sequence-fields
