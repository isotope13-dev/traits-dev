defaults:
  platforms:
  - unix
  - windows
  for:
  - npm
  - zip
  - tar
  - package.json
  - javascript
  attack: T1195.002,T1059.004,T1053.005
  mbc: F0012
traits:
- id: npm-bip40-runtime-dependency
  desc: Declares bip40 stealer runtime dependency
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: value
    path: dependencies.bip40
    regex: .+
- id: npm-bip40-direct-postinstall-command
  desc: Runs bip40 from npm postinstall
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: value
    path: scripts.postinstall
    regex: ^\s*bip40\s*$
- id: npm-postinstall-resolves-bip40
  desc: Resolves installed bip40 package in JavaScript
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  if:
    type: text
    regex: require\.resolve\s*\(\s*["']bip40["']\s*\)
- id: npm-sudo-password-prompt
  desc: Prompts for the user's sudo password
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  if:
    type: text
    regex: \[sudo\].{0,80}[Pp]assword for
    exclude_comments: true
- id: npm-password-forwarded-to-payload
  desc: Forwards captured password to child
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  if:
    type: text
    regex: GHOST_PWD\s*:\s*capturedPassword
    exclude_comments: true
- id: npm-password-loader-bin-entrypoint
  desc: Exposes setup script as an npm command
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: value
    path: bin.react-state-optimizer
    substr: scripts/setup.js
composite_rules:
- id: node-detached-bip40-launch
  desc: Detached Node process launches bip40 package
  crit: hostile
  conf: 0.98
  for: [javascript]
  scope: file
  near_bytes: 1000
  all:
  - id: objectives/supply-chain/trojanized/package/install-hook::npm-postinstall-resolves-bip40
  - id: micro-behaviors/process/daemonize/spawn::node-detached-child-process
- id: npm-postinstall-directly-runs-bip40-stealer
  desc: npm install hook runs the known bip40 browser stealer
  crit: hostile
  conf: 0.995
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: objectives/supply-chain/trojanized/package/install-hook::npm-bip40-runtime-dependency
  - id: objectives/supply-chain/trojanized/package/install-hook::npm-bip40-direct-postinstall-command
- id: npm-postinstall-detaches-bip40-stealer
  desc: npm install hook launches the known bip40 browser stealer detached
  crit: hostile
  conf: 0.995
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: objectives/supply-chain/trojanized/package/install-hook::npm-bip40-runtime-dependency
  - id: objectives/supply-chain/trojanized/package/install-hook::npm-postinstall-resolves-bip40
  - id: micro-behaviors/process/daemonize/spawn::node-detached-child-process
- id: npm-sudo-password-remote-payload-loader
  desc: Captures sudo password and forwards it to a detached decrypted payload
  crit: hostile
  conf: 0.995
  for:
  - javascript
  scope: file
  near_bytes: 12000
  all:
  - id: objectives/supply-chain/trojanized/package/install-hook::npm-sudo-password-prompt
  - id: objectives/supply-chain/trojanized/package/install-hook::npm-password-forwarded-to-payload
  - id: micro-behaviors/crypto/cipher/mode::node-aes-gcm-decipher-call
  any:
  - id: micro-behaviors/process/daemonize/spawn::node-detached-child-process
  - id: micro-behaviors/process/config/launch::node-detached-debug-options
- id: npm-bin-sudo-password-stealer
  desc: npm command launches a sudo password stealing remote payload
  crit: hostile
  conf: 0.995
  scope: archive
  all:
  - id: objectives/supply-chain/trojanized/package/install-hook::npm-password-loader-bin-entrypoint
  - id: objectives/supply-chain/trojanized/package/install-hook::npm-sudo-password-remote-payload-loader
