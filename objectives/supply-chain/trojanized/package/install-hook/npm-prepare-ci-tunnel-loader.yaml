defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1059.007,T1105
traits:
- id: prepare-tunnel-setup-url
  desc: Setup script URL uses ngrok tunnel
  crit: notable
  conf: 0.99
  for:
  - javascript
  if:
    type: text
    regex: PAYLOAD_URL\s*=\s*["\x27]https://[a-z0-9-]+\.ngrok\.io/setup\.js["\x27]
- id: prepare-setup-target
  desc: Script sets local setup file path
  crit: notable
  conf: 0.99
  for:
  - javascript
  if:
    type: text
    regex: TARGET_PATH\s*=\s*path\.join\s*\(\s*__dirname\s*,\s*["\x27]setup\.js["\x27]
- id: prepare-fetch-payload
  desc: Script fetches payload URL
  crit: notable
  conf: 0.99
  for:
  - javascript
  if:
    type: text
    regex: fetch\s*\(\s*PAYLOAD_URL
- id: prepare-write-response
  desc: Script writes response to target
  crit: notable
  conf: 0.99
  for:
  - javascript
  if:
    type: text
    regex: (?s)response\.text\s*\(\s*\).{0,200}writeFileSync\s*\(\s*TARGET_PATH
- id: ci-conditional-setup-import
  desc: Build environment loads local setup script
  crit: notable
  conf: 0.99
  for:
  - javascript
  if:
    type: text
    regex: (?s)BUILD_NUMBER.{0,200}if\s*\(isCI\).{0,200}require\s*\(["\x27]\./scripts/setup\.js
composite_rules:
- id: prepare-tunnel-script-download
  desc: Script downloads setup JavaScript from tunnel
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  scope: file
  all:
  - id: objectives/supply-chain/trojanized/package/install-hook::prepare-tunnel-setup-url
  - id: objectives/supply-chain/trojanized/package/install-hook::prepare-setup-target
  - id: objectives/supply-chain/trojanized/package/install-hook::prepare-fetch-payload
  - id: objectives/supply-chain/trojanized/package/install-hook::prepare-write-response
- id: npm-prepare-ci-tunnel-loader
  desc: npm package downloads and conditionally loads tunnel script
  crit: hostile
  conf: 0.99
  for:
  - zip
  - npm
  - tar
  - javascript
  - package.json
  scope: archive
  all:
  - id: objectives/supply-chain/trojanized/package/install-hook::prepare-tunnel-script-download
  - id: objectives/supply-chain/trojanized/package/install-hook::ci-conditional-setup-import
  - id: metadata/package/scripts/lifecycle::filtered-prepare-hook
