# A package install hook that races remote fetches and reads the winning body
# is worth triage even when the published source does not store or execute it.
defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript]

composite_rules:
  - id: npm-preinstall-races-remote-fetches
    desc: npm preinstall races remote fetches
    crit: suspicious
    conf: 0.95
    scope: package
    all:
      - id: metadata/package/scripts/lifecycle::npm-preinstall-script
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/data/control-flow/async::promise-first-fulfilled
