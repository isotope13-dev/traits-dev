# A package install hook that races remote fetches and reads the winning body
# is worth triage even when the published source does not store or execute it.
# The hook may be preinstall or postinstall: clamp4js 1.0.5 races its two
# installer URLs from a postinstall script.
defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript]

composite_rules:
  - id: npm-install-hook-fetches-paste-content
    desc: npm install hook fetches content from a paste service
    crit: suspicious
    conf: 0.94
    scope: package
    all:
      - id: metadata/package/scripts/lifecycle::npm-pre-or-postinstall-hook
      - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
      - id: micro-behaviors/communications/http/services/file-hosting::paste-service-host-reference

  - id: npm-install-hook-races-remote-fetches
    desc: npm install hook races remote fetches
    crit: suspicious
    conf: 0.95
    scope: package
    all:
      - id: metadata/package/scripts/lifecycle::npm-pre-or-postinstall-hook
      - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
      - id: micro-behaviors/data/control-flow/async::promise-first-fulfilled
