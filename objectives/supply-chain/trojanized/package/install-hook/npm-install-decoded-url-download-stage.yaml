# An npm install hook that decodes its download URLs with a signed-modulo
# character rebuild, races the decoded fetches, and writes the winning body to a
# temp file stages a payload without executing it. clamp4js 1.0.5 through
# 1.0.13 match this shape. The hook body may be preinstall or postinstall.
#
# The file-local half joins four legs in one JavaScript file: the decoder, the
# fetch, the first-fulfilled race, and the os.tmpdir() destination. The hostile
# half adds a package.json lifecycle hook that runs a Node script, which makes
# the file an install-time stage. The composite does not claim the fetched
# payload is malicious; it claims the dropper wiring.
defaults:
  platforms:
  - unix
  - windows
  for:
  - npm
  - package.json
  - javascript
  attack: T1195.002,T1105
composite_rules:
- id: npm-install-decoded-url-race-stage-file
  desc: JavaScript decodes URLs then races fetches into a temp file
  crit: notable
  conf: 0.85
  scope: file
  for:
  - javascript
  all:
  - id: micro-behaviors/data/decode/custom::js-mod-normalized-charcode-decoder
  - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
  - id: micro-behaviors/data/control-flow/async::promise-first-fulfilled
  - id: micro-behaviors/fs/path/temp::js-os-tmpdir-path-join
- id: npm-install-hook-decoded-url-race-stage
  desc: npm install hook stages a decoded-URL race download
  crit: hostile
  conf: 0.9
  scope: package
  all:
  - id: objectives/supply-chain/trojanized/package/install-hook::npm-install-decoded-url-race-stage-file
  - id: micro-behaviors/os/package-manager/hook-install::lifecycle-hook-runs-node-script
