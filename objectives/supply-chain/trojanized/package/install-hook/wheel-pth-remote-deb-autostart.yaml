# A wheel .pth hook launches package code during ordinary Python startup. When
# that code downloads and installs a local Debian package and also configures
# system autostart, the package is silently deploying and persisting an
# external system-management agent.
defaults:
  platforms: [unix]
  attack: T1195.002,T1105,T1546
  for: [whl, python]

composite_rules:
  - id: wheel-pth-downloads-deb-and-configures-autostart
    desc: Python startup hook installs a remote package and autostarts it
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/os/package-manager/sideload::dpkg-install-file
      - id: micro-behaviors/os/autorun/login-items::xdg-system-autostart-path
