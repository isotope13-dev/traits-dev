# A JavaScript file starts a detached child with stdout and stderr ignored and
# its handle unref'd, all within that one file. The file is either named as an
# install hook (install, pre/postinstall, or the setup helper) or relaunches a
# script from its own package through process.execPath. The second leg keeps a
# renamed dropper visible; the basename legs alone missed it.
# This is the file-local half of npm-install-hook-silent-detached-child. Notable
# on its own: a file-local match does not show that a package manifest runs the
# file. The hostile composite adds the package.json lifecycle evidence. The
# detach legs must share the file. Archive scope let a package.json lifecycle key
# join detach clues from unrelated bundled files, such as the foreground-child
# watchdog, which is a standard detached-child pattern.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1059.007
composite_rules:
- id: npm-install-named-silent-detached-spawn
  desc: Install-hook JavaScript starts a silent detached child
  crit: notable
  conf: 0.8
  scope: file
  any:
  - type: trait
    id: metadata/package/files/lifecycle::install-js-basename
  - type: trait
    id: metadata/package/files/lifecycle::setup-js-basename
  - id: metadata/package/files/included::install-or-beacon-js-basename
  - id: micro-behaviors/process/interpreter/node::execpath-package-relative-spawn
  - id: micro-behaviors/process/interpreter/node::argv0-package-relative-spawn
  - id: micro-behaviors/process/interpreter/node::esm-package-relative-spawn
  all:
  - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
  - id: micro-behaviors/process/stdio/configure::child-output-ignored-option
