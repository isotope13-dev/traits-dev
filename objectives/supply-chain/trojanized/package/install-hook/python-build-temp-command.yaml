defaults:
  platforms: [windows]
  for: [python]
  attack: T1195.002

composite_rules:
  - id: build-hook-copies-and-launches-temp-command
    desc: Build hook launches a copied temporary batch
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: metadata/build/package/recipe/setup-hooks::python-build-or-install-command-override
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
      - id: micro-behaviors/fs/file/copy/source-destination::shutil-copy
      - id: micro-behaviors/os/sysinfo/directories::python-gettempdir-symbol
