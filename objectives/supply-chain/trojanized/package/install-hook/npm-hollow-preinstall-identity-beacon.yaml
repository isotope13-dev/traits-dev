# A package whose entry module is an empty export and whose only behavior is
# an install-time hook. The hook queries the OS user and sends it to a remote
# URL, which proves code execution on whoever installs the package.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript]
  attack: T1195.002,T1033

composite_rules:
  - id: npm-hollow-package-preinstall-whoami-request
    desc: Hollow npm package runs preinstall whoami request
    crit: hostile
    conf: 0.96
    scope: archive
    unless:
      - id: metadata/path/directory::test-directory-component
    all:
      - id: micro-behaviors/data/control-flow/module-exec::js-sole-empty-commonjs-export
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
      - id: micro-behaviors/process/identity/query/command::execsync-quoted-whoami
      - id: micro-behaviors/communications/http/get::node-https-get-text
