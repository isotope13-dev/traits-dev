defaults:
  platforms:
  - windows
  attack: T1548.002,T1059.001,T1195.002
traits:
- id: npm-hidden-elevated-node-launch
  desc: Hidden Node launch requests UAC elevation
  crit: suspicious
  conf: 0.98
  for:
  - javascript
  if:
    type: text
    substr: -Verb RunAs -WindowStyle Hidden
composite_rules:
- id: npm-preinstall-hidden-elevated-obfuscated-payload
  desc: Preinstall silently elevates an obfuscated installer
  crit: hostile
  conf: 0.995
  scope: archive
  for:
  - npm
  - zip
  - tar
  - package.json
  - javascript
  all:
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
  - id: objectives/supply-chain/trojanized/package/install-hook::npm-hidden-elevated-node-launch
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-mangled-bracket-push-shift
