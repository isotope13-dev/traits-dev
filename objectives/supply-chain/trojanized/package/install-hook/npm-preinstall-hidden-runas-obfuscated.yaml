defaults:
  platforms:
  - windows
  attack: T1059.001,T1195.002
composite_rules:
- id: npm-preinstall-hidden-elevated-obfuscated-payload
  desc: Preinstall requests hidden execution of obfuscated code
  crit: hostile
  conf: 0.995
  scope: archive
  for:
  - npm
  - zip
  - tar
  - package.json
  - javascript
  all:
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
  - id: micro-behaviors/process/config/window::runas-hidden-window-options
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-mangled-bracket-push-shift
