defaults:
  platforms:
  - unix
  for:
  - zip
  - npm
  - tar
  - package.json
  - shell
  attack: T1195.002,T1552.001
traits:
- id: npm-install-bash-script
  desc: Runs shell script during install
  crit: notable
  for:
  - package.json
  if:
    type: value
    path: scripts.preinstall
    regex: \bbash\s+[^ ]+\.sh\b
- id: shell-find-npm-token
  desc: Searches environment for npm tokens
  crit: notable
  for:
  - shell
  if:
    type: text
    regex: env\s*\|\s*grep\s+-E\s+['"].{0,30}NPM_TOKEN.{0,30}NODE_AUTH_TOKEN
- id: shell-write-npm-auth
  desc: Writes npm auth token to config
  crit: notable
  for:
  - shell
  if:
    type: text
    substr: _authToken=$BOT_TOKEN
- id: shell-pack-package
  desc: Packs an npm package into a tarball
  crit: notable
  for:
  - shell
  if:
    type: text
    substr: 'npm pack '
- id: shell-publish-userconfig
  desc: Publishes using local npm config
  crit: notable
  for:
  - shell
  if:
    type: text
    substr: npm publish --userconfig
- id: shell-post-publish-log
  desc: Posts republishing log to webhook
  crit: component
  for:
  - shell
  if:
    type: text
    regex: curl\s+-X\s+POST.{0,100}--data-binary
composite_rules:
- id: npm-install-token-republish
  desc: Uses discovered npm token to republish package
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: objectives/supply-chain/trojanized/package/install-hook::npm-install-bash-script
  - id: objectives/supply-chain/trojanized/package/install-hook::shell-find-npm-token
  - id: objectives/supply-chain/trojanized/package/install-hook::shell-write-npm-auth
  - id: objectives/supply-chain/trojanized/package/install-hook::shell-pack-package
  - id: objectives/supply-chain/trojanized/package/install-hook::shell-publish-userconfig
- id: shell-token-republish-webhook
  desc: Republishes with discovered token and posts log
  crit: hostile
  conf: 0.99
  scope: file
  for:
  - shell
  all:
  - id: objectives/supply-chain/trojanized/package/install-hook::shell-find-npm-token
  - id: objectives/supply-chain/trojanized/package/install-hook::shell-write-npm-auth
  - id: objectives/supply-chain/trojanized/package/install-hook::shell-pack-package
  - id: objectives/supply-chain/trojanized/package/install-hook::shell-publish-userconfig
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  - id: objectives/supply-chain/trojanized/package/install-hook::shell-post-publish-log
