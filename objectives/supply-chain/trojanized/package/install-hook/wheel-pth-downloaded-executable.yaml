# Require a linked download and launch in one member. Independent API calls in
# different members do not establish that a downloaded file was launched.
defaults:
  platforms: [unix, windows]
  for: [whl, python]
  attack: T1195.002,T1546.018,T1105,T1204.005

composite_rules:
  - id: wheel-pth-downloaded-file-launch
    desc: Wheel startup hook accompanies downloaded executable launch
    crit: hostile
    conf: 0.94
    scope: archive
    all:
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: micro-behaviors/process/deploy/file-exec/spawn::download-chmod-launch
