# A wheel startup hook imports package code, while package code retrieves a
# response, writes it, marks a file executable, and launches a child process.
# Together these observations identify a startup-triggered executable loader.
defaults:
  platforms: [unix, windows]
  for: [whl, python]
  attack: T1195.002,T1546.018,T1105,T1204.005

composite_rules:
  - id: wheel-pth-downloaded-file-launch
    desc: Wheel startup hook accompanies downloaded executable launch
    crit: hostile
    conf: 0.94
    scope: archive
    all:
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
      - id: micro-behaviors/data/stream/transfer::python-read-result-to-stream-write
      - id: micro-behaviors/fs/chmod/executable/mode::python-inline-chmod-executable
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
