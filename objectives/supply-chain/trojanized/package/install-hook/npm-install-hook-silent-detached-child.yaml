# An npm install hook that runs a local Node script and that script starts a
# detached child with stdout and stderr ignored and its handle unref'd leaves a
# process running after npm exits, invisible to the installer. A child that pipes
# its output and reads it back is not silent and does not match. Install hooks
# that do real setup run in the foreground. A silent daemonized child started at
# install time is a dropper's staging step. Each leg alone is common, so the
# trio is the convicting shape. The composite does not claim the child's payload
# is hostile.
defaults:
  platforms:
  - unix
  - windows
  for:
  - npm
  - zip
  - tar
  - package.json
  - javascript
  attack: T1195.002,T1059.007
composite_rules:
- id: npm-install-hook-silent-detached-child
  desc: npm install hook launches a silent detached Node child
  crit: hostile
  conf: 0.9
  scope: archive
  all:
  - id: micro-behaviors/os/package-manager/hook-install::lifecycle-hook-runs-node-script
  - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
  - id: micro-behaviors/process/stdio/configure::child-output-ignored-option
  # A project scaffolder's install hook re-runs its own setup in a detached
  # child with the same legs. The exception needs the consumer-directory
  # copy and package.json rewrite, which a bare dropper stage lacks.
  unless:
  - id: micro-behaviors/os/package-manager/hook-install::install-project-scaffold-context
