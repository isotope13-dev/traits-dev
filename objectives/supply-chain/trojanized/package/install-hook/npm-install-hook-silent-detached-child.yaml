# An npm install hook that runs a local Node script and that script starts a
# detached child with stdout and stderr ignored and its handle unref'd leaves a
# process running after npm exits, invisible to the installer. A child that pipes
# its output and reads it back is not silent and does not match. Install hooks
# that do real setup run in the foreground. A silent daemonized child started by
# an install-named script is a dropper's staging step. The detached spawn must
# sit in an install-named file: an archive-wide pair also joins a CLI launcher
# that daemonizes its own server, which stays the notable
# hook-with-background-process. Each leg alone is common, so the combination is
# the convicting shape. The composite does not claim the child's payload is
# hostile.
defaults:
  platforms:
  - unix
  - windows
  for:
  - npm
  - zip
  - tar
  - package.json
  - javascript
  attack: T1195.002,T1059.007
traits:
- id: setup-js-hook-basename
  desc: Filename is setup.js/cjs/mjs
  crit: baseline
  conf: 0.85
  for:
  - javascript
  if:
    type: path
    basename: true
    regex: ^setup\.(js|cjs|mjs)$
composite_rules:
- id: install-named-silent-detached-spawn
  desc: Install-named script launches a silent detached child
  crit: notable
  conf: 0.9
  scope: file
  for:
  - javascript
  all:
  - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
  - id: micro-behaviors/process/stdio/configure::child-output-ignored-option
  any:
  - id: metadata/package/files/included::install-or-beacon-js-basename
  - id: objectives/supply-chain/trojanized/package/install-hook::setup-js-hook-basename
- id: npm-install-hook-silent-detached-child
  desc: npm install hook launches a silent detached Node child
  crit: hostile
  conf: 0.9
  scope: archive
  all:
  - id: micro-behaviors/os/package-manager/hook-install::lifecycle-hook-runs-node-script
  - id: objectives/supply-chain/trojanized/package/install-hook::install-named-silent-detached-spawn
  # A project scaffolder's install hook re-runs its own setup in a detached
  # child with the same legs. The exception needs the consumer-directory
  # copy and package.json rewrite, which a bare dropper stage lacks.
  unless:
  - id: micro-behaviors/os/package-manager/hook-install::install-project-scaffold-context
