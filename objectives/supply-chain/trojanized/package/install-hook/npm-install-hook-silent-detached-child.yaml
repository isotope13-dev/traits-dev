# An npm install hook script that starts a detached child with stdout and stderr
# ignored and its handle unref'd leaves a process running after npm exits,
# invisible to the installer. A child that pipes its output and reads it back is
# not silent and does not match. Install hooks that do real setup run in the
# foreground. A silent daemonized child started by the package's install hook is
# a dropper's staging step. The package.json lifecycle key names the hook script,
# and the detached spawn must sit in an install-named file, as the file-local
# npm-install-named-silent-detached-spawn finding. Detach clues in unrelated
# bundled files, such as a foreground-child watchdog or a CLI launcher that
# daemonizes its own server, do not join. The composite does not claim the
# child's payload is hostile.
#
# The package.json of the same npm package must also declare an install
# lifecycle hook. Package scope keeps a root install hook from joining a
# detached helper in another workspace module of a monorepo.
defaults:
  platforms:
  - unix
  - windows
  for:
  - npm
  - package.json
  - javascript
  attack: T1195.002,T1059.007
composite_rules:
- id: npm-install-hook-silent-detached-child
  desc: npm install hook launches a silent detached Node child
  crit: hostile
  conf: 0.9
  scope: package
  all:
  - id: objectives/supply-chain/trojanized/package/install-hook::npm-install-named-silent-detached-spawn
  # The install hook either names the Node script directly or delegates to an
  # npm script key that does; both start the install-named file below.
  any:
  - id: micro-behaviors/os/package-manager/hook-install::lifecycle-hook-runs-node-script
  - id: metadata/package/scripts/entrypoint::install-hook-runs-npm-script
  # A project scaffolder's install hook re-runs its own setup in a detached
  # child with the same legs. The exception needs the consumer-directory
  # copy and package.json rewrite, which a bare dropper stage lacks.
  unless:
  - id: micro-behaviors/os/package-manager/hook-install::install-project-scaffold-context
