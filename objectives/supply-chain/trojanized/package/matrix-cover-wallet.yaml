# Trojanized npm math/linear-algebra cover that also ships an Ethereum wallet
# SDK blob and an AES-GCM stealth spawn path. Legitimate matrix libraries do
# not embed ethers wallet factories alongside decrypt-and-spawn loaders
# (matrixflow-js 3.2.1 / MAL-2026-14293: ethers in a fake .d.js sibling).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar, archives]
  attack: T1195.002,T1059.007
  mbc: B0030

traits:
  - id: npm-matrix-linear-algebra-description
    desc: npm description claims matrix/linear algebra
    crit: notable
    conf: 0.9
    for: [package.json]
    if:
      type: value
      path: description
      regex: '(?i)\b(matrix|linear[- ]algebra)\b'

composite_rules:
  - id: matrix-lib-cover-wallet-stealth-spawn
    desc: Matrix library cover with Ethereum wallet blob and stealth spawn
    crit: hostile
    conf: 0.97
    scope: archive
    attack: T1195.002,T1059.007,T1555
    all:
      - id: npm-matrix-linear-algebra-description
      - id: micro-behaviors/crypto/library/blockchain/wallet::wallet-factory-entrypoint
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-gcm-dash
      - id: micro-behaviors/process/create/spawn-minified::windowshide-bang-true
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
