defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: research-claim-with-network-clues
    desc: Research-claimed install hook with network clues
    crit: suspicious
    conf: 0.97
    attack: "T1195.002"
    scope: archive
    for: [npm, tar, zip, package.json, javascript]
    all:
      - id: metadata/package/description/security::research-claim-with-install-hook
    any:
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: objectives/exfiltration/stealer/system-info/host-user::curl-host-user-oob-exfil
      - id: objectives/exfiltration/stealer/system-info/host-user::curl-host-profile-oob-exfil
      - id: objectives/exfiltration/stealer/system-info/host-user::npm-preinstall-urlencoded-host-profile-oob
      - id: objectives/exfiltration/stealer/system-info/host-user::npm-preinstall-host-profile-oob
      - id: objectives/exfiltration/stealer/system-info/host-user::npm-preinstall-node-oast-host-profile-exfil
      - id: objectives/exfiltration/dns/lookup::shell-oastify-dns-identity-exfil
      - id: objectives/exfiltration/dns/lookup::npm-preinstall-oast-dns-hostname
      - id: objectives/exfiltration/dns/lookup::npm-postinstall-node-oastify-dns-profile-exfil
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
      - id: micro-behaviors/communications/ip/literal::http-ip-url
