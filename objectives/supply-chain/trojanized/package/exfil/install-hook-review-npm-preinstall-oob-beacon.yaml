defaults:
  platforms: [unix, windows]
  mbc: E1041
composite_rules:
- id: npm-preinstall-oob-beacon
  desc: npm preinstall hooks into OOB callback service
  crit: hostile
  conf: 0.97
  attack: T1195.002
  for:
  - package.json
  all:
  - id: metadata/package/scripts/lifecycle::npm-preinstall-script
  - id: objectives/exfiltration/oob/
- id: npm-redundant-concealed-lifecycle-callback
  desc: Lifecycle hooks repeat concealed HTTPS callback
  crit: hostile
  conf: 0.96
  attack: T1195.002,T1041
  for: [npm, package.json]
  all:
  - id: metadata/package/scripts/lifecycle::multiple-install-hooks
  - id: micro-behaviors/communications/http/request/get::preinstall-node-https-get
  - id: micro-behaviors/communications/http/request/inline::npm-postinstall-https-get
  - id: micro-behaviors/data/decode/base64/unspecified::npm-preinstall-base64
  - id: micro-behaviors/data/decode/base64/unspecified::npm-postinstall-base64
