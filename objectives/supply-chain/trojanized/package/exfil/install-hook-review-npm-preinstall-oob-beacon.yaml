defaults:
  platforms: [unix, windows]
composite_rules:
- id: npm-preinstall-oob-beacon
  desc: npm preinstall references OAST callback URL
  crit: hostile
  conf: 0.97
  attack: T1195.002
  mbc: E1041
  for:
  - package.json
  all:
  - id: metadata/package/scripts/lifecycle::npm-preinstall-script
  - id: metadata/package/scripts/reference::preinstall-oob-callback
  any:
  - id: micro-behaviors/communications/http/request/get::preinstall-node-https-get
  - id: metadata/package/scripts/reference::npm-preinstall-curl-reference
