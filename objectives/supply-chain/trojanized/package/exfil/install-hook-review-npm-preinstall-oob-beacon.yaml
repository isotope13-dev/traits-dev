defaults:
  platforms: [unix, windows]
composite_rules:
- id: npm-preinstall-oob-beacon
  desc: npm preinstall references OAST callback URL
  crit: hostile
  conf: 0.97
  attack: T1195.002
  mbc: E1041
  for:
  - package.json
  all:
  - id: metadata/package/scripts/lifecycle::npm-preinstall-script
  - id: metadata/package/scripts/reference::preinstall-oob-callback
  any:
  - id: micro-behaviors/communications/http/request/get::preinstall-node-https-get
  - id: metadata/package/scripts/reference::npm-preinstall-curl-reference
- id: npm-redundant-concealed-lifecycle-callback
  desc: Lifecycle hooks repeat concealed HTTPS callback
  crit: hostile
  conf: 0.96
  attack: T1195.002,T1041
  for:
  - npm
  - package.json
  all:
  - id: metadata/package/scripts/lifecycle::multiple-install-hooks
  - id: micro-behaviors/communications/http/request/get::preinstall-node-https-get
  - id: micro-behaviors/communications/http/request/package::npm-postinstall-node-http-get
  - id: micro-behaviors/data/decode/base64/lifecycle::npm-preinstall-base64
  - id: micro-behaviors/data/decode/base64/lifecycle::npm-postinstall-base64
- id: npm-inline-preinstall-hostname-remote-request
  desc: Inline preinstall sends hostname to remote URL
  crit: suspicious
  conf: 0.85
  for:
  - package.json
  all:
  - id: metadata/package/scripts/inline::manifest-node-inline-command
  - id: micro-behaviors/os/sysinfo/hostname/command::script-sysinfo-cmd-1--hostname
  - id: metadata/package/scripts/command::npm-preinstall-http-url
