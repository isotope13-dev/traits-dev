defaults:
  platforms: [unix, windows]
  for: [npm]
  attack: T1195.002,T1005,T1041
  mbc: E1041

composite_rules:
  - id: objectives/supply-chain/trojanized/package/exfil::npm-import-time-secret-database-exfil
    for: [npm, javascript]
    desc: npm import exfiltrates secret database rows
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/data/control-flow/module-exec::js-import-time-or-first-touch-init
      - id: objectives/collection/database/query::sql-selects-encrypted-key-fields
      - id: micro-behaviors/data/serialize/json::json-stringify-result-rows
      - id: micro-behaviors/communications/http/request/body::node-http-request-stream-body
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
    unless:
      - id: metadata/package/testing/harness/runtime/
