# The package's shipped page supplies an unrelated webhook as the reset
# destination, and its browser reset callback submits an anti-forgery token.
defaults:
  platforms: [unix, windows]

composite_rules:
  - id: npm-antiforgery-token-webhook-post
    desc: Posts an anti-forgery token to a webhook collector
    crit: hostile
    conf: 0.99
    attack: T1041,T1195.002
    mbc: B0030
    for: [npm, html, typescript]
    scope: package
    all:
      - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-uuid-path
      - id: micro-behaviors/communications/http/security/csrf::antiforgery-token-formdata-append
      - id: micro-behaviors/communications/http/security/csrf::token-formdata-post-construction
