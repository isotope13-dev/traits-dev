composite_rules:
  - id: npm-hatch-cli-exfiltration
    desc: npm package ships a hatch exfiltration CLI
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1005,T1041
    platforms: [linux]
    for: [npm, elf, package.json]
    scope: package
    all:
      - id: objectives/exfiltration/stealer/file/selected-path::hatch-binary-path-reference
      - id: metadata/package/entrypoint/command::bin-field-declared
    any:
      - id: micro-behaviors/communications/http/curl/body::curl-multipart-form-option
      - id: objectives/exfiltration/stealer/file/selected-path::hatch-binary-tar-netcat-upload
