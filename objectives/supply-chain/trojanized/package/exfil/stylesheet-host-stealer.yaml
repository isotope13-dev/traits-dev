# A package whose declared entry point is a stylesheet ships no executable
# product code of its own, yet archives a script that fingerprints the host
# and ships it to a log service. That shape -- inert advertised function
# plus executable stealer -- is the trojanized-library claim; the malice
# itself is established by the referenced exfil composite, not re-argued here.
defaults:
  platforms: [unix, windows]
  for: [npm, javascript, package.json]
  attack: T1195.002,T1041
  mbc: E1041

composite_rules:
  - id: stylesheet-package-ships-host-stealer
    desc: Stylesheet package ships host-profile stealer
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/entrypoint::npm-main-stylesheet-entry
      - id: objectives/exfiltration/stealer/system-info/network::loggly-host-fingerprint-exfil
