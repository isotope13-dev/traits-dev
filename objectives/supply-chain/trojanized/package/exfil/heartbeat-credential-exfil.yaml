# A server registration bundles the user's webhook URL and generated device
# secret with contact and network data, then posts the builder's result. The
# sender is tool-obfuscated, hiding its default remote service.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94
  attack: T1041,T1195.002

traits:
  - id: heartbeat-registration-sensitive-fields
    desc: Registration has webhook and device fields
    if:
      type: text
      regex: webhook_url.{0,300}email_address.{0,160}device_secret

  - id: heartbeat-register-endpoint-post
    desc: Posts to register endpoint near builder
    if:
      type: text
      regex: buildRegister.{0,500}post\(endpoint\([^)]{0,120}REGISTER_PATH\)

composite_rules:
  - id: obfuscated-heartbeat-register-egress
    desc: Obfuscated code posts to registration endpoint
    crit: suspicious
    conf: 0.96
    scope: file
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::strong-js-obfuscation
      - id: heartbeat-register-endpoint-post

  - id: obfuscated-heartbeat-secret-exfil
    desc: Obfuscated package exfiltrates webhook credentials
    crit: hostile
    conf: 0.98
    for: [npm, javascript, typescript]
    scope: package
    all:
      - id: heartbeat-registration-sensitive-fields
      - id: heartbeat-register-endpoint-post
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::strong-js-obfuscation
