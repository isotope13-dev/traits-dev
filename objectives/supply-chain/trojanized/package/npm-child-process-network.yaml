# Archive-level npm package context for modules that combine outbound network
# access with child-process execution. The package manifest is the ecosystem
# anchor; absence of a shebang alone does not make a JavaScript file a library.
defaults:
  platforms: [linux, macos, windows]

composite_rules:
  - id: npm-package-child-process-network
    desc: npm package combines outbound HTTP and child-process execution
    crit: suspicious
    conf: 0.85
    attack: T1195.001
    for: [npm, javascript]
    scope: archive
    near_bytes: 4096
    all:
      - id: metadata/package/files/included::npm-package-manifest-member
      - id: micro-behaviors/os/module/require::node-system-module-import-set
      - id: micro-behaviors/process/create/shell/bridge::child-process-exec
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/client::generic-request-method-call
    unless:
      - id: metadata/package/testing/harness/runtime::test-basename-pattern
      # A shebang marks an executable Node CLI or lifecycle helper, not a
      # library module. Install-hook behavior is modeled under supply-chain/
      # install-hook rather than as a trojanized-library signal.
      - id: metadata/lang/shebang::node
      - id: objectives/supply-chain/trojanized/library/framework::library-child-process-network-known-context
      - id: objectives/supply-chain/trojanized/library/framework::official-browser-driver-ci-download-context
      - id: metadata/build/bundler/vscode::vscode-source-entrypoint
      # Next.js's diagnostic CLI intentionally queries its public release tags
      # and probes local tool versions with child processes.
      - id: well-known/lib/web/nextjs::next-info-cli
      - id: objectives/supply-chain/trojanized/library/framework::nvidia-nim-gpu-probe-context
