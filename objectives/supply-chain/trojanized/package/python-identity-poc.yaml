# PyPI wheels that pair inflated versioning with subprocess identity probing.
defaults:
  platforms: [unix, windows]
  for: [python, whl, archives]
  attack: T1033,T1059.006
  mbc: B0046

composite_rules:
  - id: pypi-inflated-version-identity-subprocess
    desc: PyPI inflated-version package runs identity subprocess
    crit: hostile
    conf: 0.97
    scope: archive
    for: [whl, archives]
    all:
      - id: micro-behaviors/process/user/query::python-subprocess-identity-command
      - id: metadata/package/versioning::whl-inflated-version

  # The other half of the same upload: code that runs the moment the package is
  # imported and prints a compromise announcement. That banner is what makes it
  # a demonstration rather than a library — a dependency-confusion or typosquat
  # probe proving to whoever reads the build log that arbitrary code ran on the
  # target. The probe itself is the attack; the harmless payload is a choice the
  # uploader can revise at any time, and the same package shape carries a real
  # one. Ecosystem-agnostic: the legs are "runs at load" + "announces
  # compromise", not any Python-specific spelling.
  - id: package-load-time-compromise-banner
    desc: Package announces compromise when loaded
    crit: hostile
    conf: 0.95
    attack: T1195.002,T1059
    scope: outer
    for: [python, javascript, typescript, ruby, php, whl, archives]
    all:
      - id: objectives/impact/deface/taunt::hacked-by-code-literal
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
