# PyPI wheels that pair inflated versioning with subprocess identity probing.
defaults:
  platforms: [unix, windows]
  for: [python, whl, archives]
  attack: T1033,T1059.006
  mbc: B0046

composite_rules:
  - id: pypi-inflated-version-identity-subprocess
    desc: PyPI inflated-version package runs identity subprocess
    crit: hostile
    conf: 0.97
    scope: archive
    for: [whl, archives]
    all:
      - id: micro-behaviors/process/user/query::python-subprocess-identity-command
      - id: metadata/package/versioning::whl-inflated-version
