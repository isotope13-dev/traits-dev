# Hacktivist npm packages that claim copyright over embedding projects and ship
# injectable "license enforcement" modules (e.g. deathoffather-project, used as
# an unpinned dependency in DDoS/booter toolkits for on-load code injection).
defaults:
  platforms: [unix, windows]
  for: [package.json, markdown, javascript, typescript, npm, tar, zip]
  attack: T1195.002

traits:
  - id: objectives/supply-chain/trojanized/package/lure::npm-keyword-cybercrime
    desc: npm package declares CyberCrime keyword
    crit: notable
    conf: 0.95
    for: [package.json]
    if:
      type: value
      path: keywords
      substr: CyberCrime

  - id: objectives/supply-chain/trojanized/package/lure::npm-keyword-hacktivist-indonesia
    desc: npm hacktivist Indonesia keyword
    crit: notable
    conf: 0.95
    for: [package.json]
    if:
      type: value
      path: keywords
      regex: '(?i)hactivist\s+indonesia|anonymous\s+indonesia'

  - id: objectives/supply-chain/trojanized/package/lure::npm-hacked-main-entry
    desc: npm main entry under H4ckEd tree
    crit: notable
    conf: 0.92
    for: [package.json]
    if:
      type: value
      path: main
      regex: '(?i)h4ck'

  - id: objectives/supply-chain/trojanized/package/lure::npm-copyright-trap-id-readme
    desc: README cites embedded source ownership
    crit: notable
    conf: 0.94
    for: [markdown]
    if:
      type: text
      substr: seluruh kode sumber

  - id: objectives/supply-chain/trojanized/package/lure::npm-copyright-trap-id-ownership
    desc: README assigns ownership to third party
    crit: notable
    conf: 0.94
    for: [markdown]
    if:
      type: text
      substr: adalah milik

  - id: objectives/supply-chain/trojanized/package/lure::npm-copyright-trap-en-readme
    desc: README claims host source belongs
    crit: notable
    conf: 0.94
    for: [markdown]
    if:
      type: text
      substr: entire source code

  - id: objectives/supply-chain/trojanized/package/lure::npm-protect-license-export
    desc: protect_license export naming pattern
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: text
      substr: protect_license_BY_

composite_rules:
  - id: objectives/supply-chain/trojanized/package/lure::npm-copyright-trap-readme-id
    desc: Indonesian README source-ownership trap
    crit: suspicious
    conf: 0.94
    for: [markdown]
    all:
      - id: objectives/supply-chain/trojanized/package/lure::npm-copyright-trap-id-readme
      - id: objectives/supply-chain/trojanized/package/lure::npm-copyright-trap-id-ownership

  - id: objectives/supply-chain/trojanized/package/lure::npm-copyright-trap-readme
    desc: README claims host source ownership
    crit: notable
    conf: 0.94
    for: [markdown]
    any:
      - id: objectives/supply-chain/trojanized/package/lure::npm-copyright-trap-readme-id
      - id: objectives/supply-chain/trojanized/package/lure::npm-copyright-trap-en-readme

  - id: objectives/supply-chain/trojanized/package/lure::hacktivist-copyright-trap-npm
    desc: Hacktivist npm copyright trap package
    crit: notable
    conf: 0.97
    attack: T1195.002,T1491
    scope: package
    all:
      - id: objectives/supply-chain/trojanized/package/lure::npm-keyword-cybercrime
      - id: objectives/supply-chain/trojanized/package/lure::npm-copyright-trap-readme-id
    any:
      - id: objectives/supply-chain/trojanized/package/lure::npm-keyword-hacktivist-indonesia
      - id: objectives/supply-chain/trojanized/package/lure::npm-hacked-main-entry

  - id: objectives/supply-chain/trojanized/package/lure::injectable-hacktivist-license-module
    desc: Injectable hacktivist license module
    crit: notable
    conf: 0.96
    scope: package
    all:
      - id: objectives/supply-chain/trojanized/package/lure::npm-protect-license-export
      - id: objectives/supply-chain/trojanized/package/lure::npm-hacked-main-entry
