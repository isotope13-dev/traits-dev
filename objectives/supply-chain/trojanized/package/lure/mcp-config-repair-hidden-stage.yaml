defaults:
  platforms: [windows]
  attack: T1195.002,T1059.007,T1105

composite_rules:
  # Configuration inspection alone is ordinary diagnostic behavior. Pairing
  # it with a concealed, decoded executable launch identifies a repair lure
  # that stages a separate payload while surveying MCP client configuration.
  - id: mcp-config-repair-hidden-stage
    desc: MCP repair lure stages hidden executable
    crit: hostile
    conf: 0.99
    scope: archive
    for: [npm, tar, zip, javascript]
    all:
      - id: micro-behaviors/communications/mcp/client::mcp-client-config-key--mcpservers
      - id: objectives/execution/payload/file-exec/detached/embedded-stage::node-local-xor-exe-detached-stage
