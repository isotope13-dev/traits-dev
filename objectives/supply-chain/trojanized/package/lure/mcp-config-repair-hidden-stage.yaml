defaults:
  platforms: [windows]
  attack: T1027,T1059.007,T1140

composite_rules:
  # Package members combine MCP configuration vocabulary with an encoded,
  # detached program stage. This establishes packaging of concealed code;
  # it does not establish a repair claim, config modification or download.
  - id: mcp-config-repair-hidden-stage
    desc: MCP configuration accompanies encoded detached stage
    crit: hostile
    conf: 0.99
    scope: archive
    for: [npm, tar, zip, javascript]
    all:
      - id: micro-behaviors/communications/mcp/client::mcp-client-config-key--mcpservers
      - id: objectives/execution/payload/file-exec/detached/embedded-stage::node-local-xor-exe-detached-stage
