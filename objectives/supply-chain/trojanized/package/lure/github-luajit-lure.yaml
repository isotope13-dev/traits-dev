defaults:
  platforms: [windows, unix]
  for: [zip, markdown, batch, text]
  attack: T1195.002,T1027,T1059.004

composite_rules:
  - id: objectives/supply-chain/trojanized/package/lure::github-module-obfuscated-luajit-sidecar
    desc: Non-Go module promotes an obfuscated LuaJIT payload ZIP
    crit: hostile
    conf: 0.99
    scope: outer
    all:
      - id: metadata/package/files/included::github-module-zip-no-go-source
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-github-raw-refs-link
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-zip-extension-link
      - id: metadata/package/files/archive-member::archive-nested-zip-member
      - id: objectives/supply-chain/hidden-payload/exec/archive::archive-lua-exe-member
      - id: metadata/file/naming::archive-bat-member
      - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-indexed-string-permutation-decoder
