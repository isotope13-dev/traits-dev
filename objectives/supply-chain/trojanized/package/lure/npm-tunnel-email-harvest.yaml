# npm lure packages that market a piracy "activator" and forward the victim's
# email plus a bearer magic-link token to an anonymous tunnel backend.
# The verdict gates on content (tunnel transfer of the token); the lure
# description and the spoofed browser User-Agent corroborate in any:.
defaults:
  platforms: [unix, windows]
  for: [npm]
  attack: T1195.002
  mbc: B0021

composite_rules:
  - id: node-premium-activator-magic-link-phish-backend
    desc: Magic-link POST via tunnel or raw config
    crit: component
    conf: 0.95
    for: [javascript, typescript]
    any:
      - id: objectives/supply-chain/recon-exfil/registry/probe::node-trycloudflare-magic-link-phish
      - id: objectives/supply-chain/recon-exfil/registry/probe::node-github-raw-config-magic-link-phish

  - id: objectives/supply-chain/trojanized/package/lure::npm-premium-activator-tunnel-phishing
    desc: Premium activator lure forwards auth token to tunnel backend
    crit: hostile
    conf: 0.96
    scope: archive
    for: [npm, tar, package.json, javascript]
    all:
      - id: node-premium-activator-magic-link-phish-backend
    any:
      - id: metadata/package/description/vertical::description-premium-activator-lure
      - id: micro-behaviors/communications/http/user-agent::browser-mozilla-5-0
