# npm-published HTML email templates with merge fields (bulk-mail / phishing kits).
defaults:
  platforms: [unix, windows]
  attack: T1566
  for: [npm, tar, zip]

composite_rules:
  - id: npm-email-merge-field-phishing-template
    desc: npm HTML email uses brand merge fields
    crit: hostile
    conf: 0.97
    scope: archive
    for: [npm, tar, zip, html, text]
    all:
      - id: micro-behaviors/ui/window/markup::html-msonormal-table-class
      - id: micro-behaviors/ui/window/markup::html-merge-company-placeholder
      - id: micro-behaviors/ui/window/markup::html-merge-favicon-placeholder

  - id: npm-messages-attachment-template-pack
    desc: npm ships messages attachment HTML templates
    crit: hostile
    conf: 0.96
    scope: archive
    for: [npm, tar, zip, html]
    all:
      - id: micro-behaviors/ui/window/markup::html-msonormal-table-class
      - id: micro-behaviors/ui/window/markup::html-merge-company-placeholder
      - id: micro-behaviors/ui/window/markup::html-merge-favicon-placeholder
      - id: metadata/package/files/included::npm-archive-messages-attachment-html
    unless:
      - id: metadata/package/files/included::npm-package-manifest-member
