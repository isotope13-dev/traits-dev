# Typosquat "compatibility shim" packages that beacon on postinstall and import.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, zip, javascript, typescript]
  attack: T1195.002,T1041

traits:
  - id: shim-require-beacon-fire-call
    desc: Shim entry invokes beacon.cjs fire on load
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: "require\\(['\"]\\./beacon\\.cjs['\"]\\)\\.fire\\(\\)"

composite_rules:
  - id: npm-compatibility-shim-beacon-lure
    desc: Compatibility shim install and import beacons
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041,T1082
    scope: archive
    all:
      - id: metadata/package/description/disclosure::desc-compatibility-shim-placeholder
      - id: objectives/supply-chain/recon-exfil/install-hook/recon::npm-postinstall-beacon-cjs-callback
      - id: shim-require-beacon-fire-call
