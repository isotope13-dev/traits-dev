defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002
  mbc: B0021

composite_rules:
  - id: objectives/supply-chain/trojanized/package/lure::npm-cloudflare-turnstile-html-phishing
    desc: npm HTML facade delivers Cloudflare Turnstile phishing
    conf: 0.96
    # package.json and index.html are separate tar members.  `archive` keeps
    # them apart; outer scope is the package-level correlation we need here.
    scope: outer
    for: [npm, html, tar, zip]
    all:
      - id: metadata/package/publishing::new-npm-index-html-only-release
      - id: objectives/credential-access/phishing/captcha::cloudflare-turnstile-phishing-page
  - id: objectives/supply-chain/trojanized/package/lure::npm-cloudflare-turnstile-keyval-phishing
    desc: npm HTML facade loads Turnstile next hop from a KV dead drop
    conf: 0.96
    scope: outer
    for: [npm, html, tar, zip]
    all:
      - id: metadata/package/publishing::new-npm-index-html-only-release
      - id: objectives/credential-access/phishing/captcha::turnstile-keyval-deaddrop-redirect
  - id: objectives/supply-chain/trojanized/package/lure::npm-cloudflare-turnstile-encrypted-phishing
    desc: npm HTML facade decrypts remote redirect target
    conf: 0.97
    scope: outer
    for: [npm, html, tar, zip]
    all:
      - id: metadata/package/publishing::new-npm-index-html-only-release
      - id: objectives/credential-access/phishing/landing::turnstile-encrypted-next-hop-redirect
