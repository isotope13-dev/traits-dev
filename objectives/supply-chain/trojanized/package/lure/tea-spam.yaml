defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript]
  attack: T1195.002

composite_rules:
  - id: tea-xyz-toy-console-script-dependency-lure
    desc: Tea.xyz reward lure with dependency fanout and console script
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/files/included::archive-tea-reward-manifest
      - id: metadata/package/dependencies/count::npm-dependency-fanout
      - id: metadata/package/description/presence::short-description
      - id: micro-behaviors/os/console/io::js-console-log-call
