defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript]
  attack: T1195.002

composite_rules:
  - id: npm-hollow-depconf-poc-package
    desc: Hollow npm package executes dependency-confusion PoC banner on load
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
    any:
      - id: objectives/discovery/system/profile::depconf-poc-import-time-host-survey
      - id: objectives/supply-chain/impersonation/shadow::goparrot-shadow-scope-security-poc
