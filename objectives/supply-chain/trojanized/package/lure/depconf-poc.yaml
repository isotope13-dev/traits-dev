defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript]
  attack: T1195.002

composite_rules:
  # A package published under a researcher's PoC handle whose code does
  # nothing except announce the PoC when imported. The package exists to be
  # resolved in place of someone else's dependency and prove it ran; the
  # name it squats changes per target, the PoC labelling does not.
  - id: poc-labeled-package-import-banner
    desc: PoC-labeled package announces itself on import
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/documentation/disclosure::security-poc-handle-marker
      - id: metadata/package/documentation/disclosure::javascript-poc-tag-log-banner

  - id: npm-hollow-depconf-poc-package
    desc: Hollow npm package executes dependency-confusion PoC banner on load
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
    any:
      - id: objectives/discovery/system/profile::depconf-poc-import-time-host-survey
      - id: poc-labeled-package-import-banner
