# Logger-named npm package that covertly relays application logs to a remote
# Loki sink. The name segment establishes cover; the relay bundle supplies
# the hostile transport.
defaults:
  crit: hostile
  conf: 0.96
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar, package.json]
  attack: T1041,T1195.002
  mbc: E1041

composite_rules:
  - id: npm-logger-cover-silent-loki-relay
    desc: Logging package covertly relays to remote Loki
    scope: archive
    all:
      - id: metadata/package/name/vocabulary::npm-logging-name-segment
      - id: micro-behaviors/os/telemetry/logging/loki::pino-loki-default-remote-sink-config
      - id: micro-behaviors/os/env/cicd::ci-info-isci-property
    unless:
      - id: well-known/lib/observability/pino::pino-library-context
      - id: metadata/package/testing/presence/fixture/
