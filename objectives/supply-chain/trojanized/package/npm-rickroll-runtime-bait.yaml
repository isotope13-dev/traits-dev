# npm trojan packages that use joke or bait content to mask a malicious runtime
# dependency declaration.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, archives, javascript]
  attack: T1195.002,T1036.005
  mbc: B0023

traits:
  - id: rickroll-lyric-bait
    desc: Rick Astley lyric bait string
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      substr: Never gonna give you up

composite_rules:
  - id: npm-rickroll-facade-runtime-dependency-bait
    desc: Rickroll bait package carries fake dotnet runtime dependency
    crit: hostile
    conf: 0.99
    scope: archive
    for: [archives, tar, tgz, npm]
    all:
      - id: objectives/supply-chain/trojanized/package::rickroll-lyric-bait
      - id: metadata/package/dependencies/manifest::npm-dotnet-runtime-base-dependency
