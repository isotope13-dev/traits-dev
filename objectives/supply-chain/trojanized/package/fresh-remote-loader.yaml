# A registry package that ships the detached remote-shell loader pattern is a
# supply-chain compromise. Registry age is corroboration, not the execution
# signal: the loader composite remains useful when registry metadata is absent.
defaults:
  platforms: [unix, windows]
  for: [npm]
  attack: "T1195.002,T1059.004,T1059.007,T1105"
  mbc: B0024

composite_rules:
- id: fresh-npm-package-remote-shell-loader
  desc: Fresh npm package ships remote shell loader
  crit: hostile
  conf: 0.99
  scope: outer
  all:
  - id: metadata/registry::brand-new-package
  - id: objectives/command-and-control/dropper/execution/stealth-spawn::node-detached-remote-shell-loader
