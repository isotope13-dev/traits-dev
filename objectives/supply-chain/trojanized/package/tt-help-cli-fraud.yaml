# tt-help-cli-ycl — fraudulent npm help CLI with hardcoded C2 and browser evasion.
# Flagged by OSV MAL-2026-12488 and supplychainattack.org.
# ATT&CK: T1195.002 (Supply Chain), T1071.001 (Web Protocols), T1497.001 (Sandbox Evasion)
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell, batch]
  attack: T1195.002

traits:
  - id: anti-detect-script-export-marker
    desc: Exports anti-detection browser script
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      substr: getAntiDetectScript
  - id: batch-target-server-assignment
    desc: Batch script assigns TARGET_SERVER HTTP endpoint
    crit: notable
    conf: 0.96
    for: [batch]
    if:
      type: text
      regex: 'SET\s+"TARGET_SERVER=https?://'
  - id: git-diff-json-payload-field
    desc: Quoted gitDiff JSON object field
    crit: component
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      # Require JSON/object-key quotes so Trace Viewer property access
      # like `l.gitDiff` (Playwright) does not fire this atom alone.
      substr: '"gitDiff"'
    unless:
      - id: well-known/lib/platform/browser-automation::playwright-trace-viewer-bundle

composite_rules:
  - id: shell-curl-python-encoded-monitor
    desc: Shell monitor pipes curl into Python with concealed encoded payload
    crit: hostile
    conf: 0.97
    attack: T1105,T1027,T1059.004
    scope: leaf
    for: [shell]
    all:
      - id: micro-behaviors/process/create/shell/spawn::curl-pipe-exec-python-shell
      - id: objectives/anti-static/obfuscation/payload/encrypted::concealed-encoded-region-in-source
    any:
      - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
      - id: micro-behaviors/process/daemonize/detach::background-ampersand-hidden

  - id: javascript-webdriver-antidetect-export
    desc: JavaScript exports navigator webdriver masking for browser automation
    crit: hostile
    conf: 0.97
    attack: T1497.001,T1059.007
    scope: leaf
    for: [javascript, typescript]
    all:
      - id: objectives/evasion/security-bypass/anti-bot::navigator-webdriver-code
      - id: anti-detect-script-export-marker

  - id: batch-hardcoded-external-c2-endpoint
    desc: Batch launcher sets hardcoded external IP C2 endpoint variable
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1071.001
    scope: leaf
    for: [batch]
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: batch-target-server-assignment

  - id: javascript-hardcoded-ip-http-post-client
    desc: JavaScript POST client targets hardcoded external IP URL
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1071.001,T1041
    scope: leaf
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/ip/literal::javascript-external-http-ip-url
      - id: micro-behaviors/communications/http/request/client::http-post-json
      - id: micro-behaviors/communications/http/request/client::js-fetch-call

  - id: vscode-git-diff-hardcoded-ip-exfil
    desc: Extension uploads git diff to hardcoded IP backend
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041,T1071.001
    scope: archive
    for: [javascript, typescript, vsix, archives]
    all:
      - id: micro-behaviors/communications/ip/literal::javascript-external-http-ip-url
      - id: micro-behaviors/communications/http/request/client::http-post-json
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/process/create/shell/local::git-diff-head-exec-call

  - id: vscode-git-diff-remote-guard-post
    desc: VS Code extension captures git diff for remote guard POST
    crit: hostile
    conf: 0.97
    attack: T1041,T1071.001,T1195.002
    scope: leaf
    for: [javascript, typescript]
    near_bytes: 8000
    all:
      - id: micro-behaviors/process/create/shell/local::git-diff-head-exec-call
      - id: git-diff-json-payload-field
      - id: micro-behaviors/communications/http/request/payload::fetch-post-json-body
