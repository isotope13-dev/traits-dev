# An Arch/AUR recipe whose upstream is not an upstream.
#
# The AUR compromises of 2018 and 2026 share a shape: an orphaned package is
# adopted, and the new maintainer repoints the build at bytes they control.
# `metadata/package/manifest/repository/` already records the tell that survives
# after a campaign ends -- the source host is an anonymous file drop, a paste, a
# shortener, or a bare IP -- and reports each as suspicious on its own. That is
# the right level for the bare fact: a one-off mirror is careless, not hostile.
#
# What escalates it is a second property of the same recipe. An unauditable host
# whose bytes are *also* unverified is a moving target: whoever holds the upload
# token silently changes what every builder compiles, and makepkg will not
# notice. An unauditable host that supplies a *binary the recipe deliberately
# does not extract* is the 2026 "validator binary" shape -- the object is
# dropped into the build tree to be run, not compiled.
#
# It is also why these are so often found as dead links: the hosts expire, so
# the recipe 404s long before anyone reviews it.
defaults:
  platforms: [linux]
  for: [shell]
  attack: T1195.002
  mbc: B0030

composite_rules:
  - id: pkgbuild-untrusted-source-host
    desc: PKGBUILD fetches from an untrusted host
    crit: suspicious
    conf: 0.93
    any:
      - id: metadata/package/manifest/repository::pkgbuild-source-ephemeral-host
      - id: metadata/package/manifest/repository::pkgbuild-source-url-shortener
      - id: metadata/package/manifest/repository::pkgbuild-source-ip-address
    unless:
      - id: metadata/package/testing/presence/harness::test-directory
      - id: well-known/tool/detection/security-scanner-identity::ks-aur-scanner-source-context

  - id: pkgbuild-unverified-untrusted-source
    desc: Untrusted PKGBUILD source with no checksum
    crit: hostile
    conf: 0.95
    all:
      - id: pkgbuild-untrusted-source-host
      - id: metadata/build/package/recipe::pkgbuild-checksum-skip
    unless:
      # A skipped checksum is expected for VCS and PGP-verified sources.
      - id: metadata/build/package/recipe::pkgbuild-vcs-source
      - id: metadata/build/package/recipe::pkgbuild-validpgpkeys
      - id: metadata/package/testing/presence/harness::test-directory

  - id: pkgbuild-untrusted-source-executable
    desc: Untrusted host supplies a build executable
    crit: hostile
    conf: 0.95
    all:
      - id: pkgbuild-untrusted-source-host
      - id: metadata/build/package/recipe::pkgbuild-noextract-executable-entry
    unless:
      - id: metadata/package/testing/presence/harness::test-directory
