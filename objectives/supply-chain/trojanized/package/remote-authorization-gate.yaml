# Published packages should not ship repository credentials or make their
# public API conditional on a mutable, publisher-controlled user list.
defaults:
  platforms: [unix, windows]
  attack: T1195.002

traits:
  - id: npm-git-url-embedded-prefixed-github-token
    desc: npm Git URL exposes GitHub access token
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: dependencies.*
      regex: '^git\+https://gh[pousr]_[A-Za-z0-9]{20,255}@github\.com/'

  - id: npm-git-url-embedded-fine-grained-github-token
    desc: npm Git URL exposes fine-grained token
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: dependencies.*
      regex: '^git\+https://github_pat_[A-Za-z0-9_]{30,255}@github\.com/'

  - id: github-token-template-authorization-header
    desc: GitHub API token authorization header
    crit: component
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: 'Authorization\s*:\s*`(token|Bearer)\s+\$\{[A-Za-z_$][\w$]*\}`'

  - id: login-calls-remote-authorization-check
    desc: Login awaits remote authorization
    crit: component
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: 'login\s*\([^)]{0,80}\)[\s\S]{0,600}await\s+this\._verifyAuthorization\s*\('

  - id: remote-active-username-membership-test
    desc: Remote data gates active username
    crit: component
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.username\s*===\s*username\s*&&\s*[A-Za-z_$][A-Za-z0-9_$]*\.active'

composite_rules:
  - id: hardcoded-github-pat-used-for-api-auth
    desc: Shipped GitHub PAT authenticates repository API
    crit: suspicious
    conf: 0.98
    for: [javascript, typescript]
    near_lines: 100
    all:
      - id: micro-behaviors/communications/http/services/github::github-contents-api-endpoint
      - id: github-token-template-authorization-header
    any:
      - id: objectives/credential-access/cloud/token/files::github-classic-pat
      - id: objectives/credential-access/cloud/token/files::github-fine-grained-pat

  - id: remote-github-user-list-gates-library-login
    desc: Remote GitHub user list gates library login
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript]
    near_lines: 340
    all:
      - id: login-calls-remote-authorization-check
      - id: micro-behaviors/communications/http/services/github::github-contents-api-endpoint
      - id: remote-active-username-membership-test
