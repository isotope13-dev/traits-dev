defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  attack: "T1195.002,T1059.007"
  mbc: "E1059"

# An n8n community node that advertises itself as a PoC and runs a child
# process during construction is an executable supply-chain payload.  Keep the
# package context in the composite: the individual process traits remain
# useful neutral capabilities for ordinary Node tooling.
composite_rules:
  - id: n8n-poc-constructor-shell
    desc: n8n PoC node executes a shell command during construction
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: metadata/package/manifest/freeform::npm-n8n-node-manifest
      - id: objectives/supply-chain/impersonation/manifest/attack-label::desc-package-poc
      - id: micro-behaviors/process/create/shell/bridge::child-process-destructure-require
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
      - id: micro-behaviors/process/create/shell/bridge::js-constructor-execsync
