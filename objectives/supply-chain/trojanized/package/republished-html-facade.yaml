defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: republished-html-facade-package
    for: [npm, package.json]
    desc: Republished npm package serves HTML application
    crit: suspicious
    conf: 0.92
    scope: package
    all:
      - id: metadata/package/description::description-says-redistributed
      - id: metadata/package/publishing::publishes-all-files
      - id: metadata/package/entrypoint::main-html-entry
