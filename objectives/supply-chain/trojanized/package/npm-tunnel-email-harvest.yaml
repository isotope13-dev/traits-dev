# npm clients that ship a trycloudflare-backed API and POST harvested user
# email (and sometimes magic-link tokens) to the tunnel operator.
defaults:
  platforms: [unix, windows]
  for: [npm]
  attack: T1195.002
  mbc: B0021

composite_rules:
  - id: npm-premium-activator-tunnel-phishing
    desc: Premium activator lure posts email to tunnel backend
    crit: hostile
    conf: 0.96
    scope: archive
    for: [npm, tar, package.json, javascript]
    all:
      - id: metadata/package/description/vertical::description-premium-activator-lure
      - id: objectives/supply-chain/recon-exfil/registry/probe::node-trycloudflare-email-exfil
