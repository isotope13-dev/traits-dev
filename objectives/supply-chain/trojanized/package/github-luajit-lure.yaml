defaults:
  platforms: [windows, unix]
  for: [archives, zip, markdown, batch, text]
  attack: T1195.002,T1027,T1059.004

composite_rules:
  - id: github-module-obfuscated-luajit-sidecar
    desc: Non-Go module carries packed LuaJIT sidecar
    crit: hostile
    conf: 0.99
    scope: outer
    all:
      - id: metadata/package/files/included::github-module-zip-no-go-source
      - id: metadata/package/documentation/source-documentation::readme-raw-github-zip-link
      - id: objectives/supply-chain/hidden-payload/exec::archive-nested-zip-member
      - id: objectives/supply-chain/hidden-payload/exec::archive-lua-exe-member
      - id: objectives/supply-chain/hidden-payload/exec::archive-batch-launcher-member
      - id: objectives/anti-static/obfuscation/code-metrics/structure::packed-lua-loader-obfuscation
