defaults:
  platforms: [linux]
  for: [shell]
  attack: T1195.002
composite_rules:
  - id: dpkg-maintainer-script-privilege-access-clues
    desc: Debian script grants privileged access
    crit: suspicious
    conf: 0.95
    attack: T1195.002, T1098.004
    all:
      - id: micro-behaviors/os/package-manager/installer-script::dpkg-maintainer-script-hook
    any:
      - id: micro-behaviors/communications/ssh/keys::authorized-keys-shell-write
      - id: micro-behaviors/fs/config/sudo::nopasswd-all-directive
      - id: micro-behaviors/fs/config/sudo::sudo-nopasswd
      - id: micro-behaviors/os/user/modify::privilege-configuration-clues
    unless:
      - id: metadata/build/package/maintainer-scripts::debian-postinst-service-user-nopasswd

