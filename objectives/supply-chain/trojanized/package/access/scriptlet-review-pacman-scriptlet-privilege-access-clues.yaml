defaults:
  platforms: [linux]
  for: [shell]
  attack: T1195.002
composite_rules:
  - id: pacman-scriptlet-privilege-access-clues
    desc: Pacman scriptlet grants privileged access
    crit: suspicious
    conf: 0.95
    attack: T1195.002, T1098.004
    all:
      - id: metadata/build/package/maintainer-scripts::pacman-scriptlet-hook
    any:
      - id: micro-behaviors/communications/ssh/keys::authorized-keys-shell-write
      - id: micro-behaviors/fs/config/sudo::sudo-nopasswd
      - id: micro-behaviors/os/user/modify::privilege-configuration-clues

