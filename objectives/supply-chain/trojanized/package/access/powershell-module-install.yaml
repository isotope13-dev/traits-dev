defaults:
  platforms: [windows]
  for: [nupkg]
  attack: T1195.002

composite_rules:
  - id: objectives/supply-chain/trojanized/package/access::nupkg-defender-disabled-unchecked-module-install
    for: [nupkg, powershell]
    desc: NuGet package disables Defender before unchecked PowerShell module installation
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/os/security/defender/policy::defender-disable-realtime
      - id: micro-behaviors/os/package-manager/install::powershell-install-module
      - id: micro-behaviors/os/package-manager/verify::powershell-skip-publisher-check
    unless:
      - id: micro-behaviors/os/security/defender/policy::temporary-module-install-restoration
