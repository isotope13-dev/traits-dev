defaults:
  for: [archives]
  platforms: [unix]
  attack: T1195.002,T1098.004

composite_rules:
  - id: npm-archive-ssh-backdoor
    desc: npm package ships an SSH authorized-key backdoor
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/files/included::package-json-basename
    any:
      - id: objectives/persistence/login/ssh/backdoor::js-authorized-key-literal-backdoor
      - id: objectives/persistence/login/ssh/backdoor::js-variable-ssh-backdoor
      - id: objectives/persistence/login/ssh/backdoor::js-ssh-backdoor

  # Install-hook framing of the same technique: a declared postinstall that
  # runs a Node script which plants an authorized_keys backdoor. Distinct from
  # the archive-presence composite above so both supply-chain and persistence
  # directories surface independently.
  - id: npm-postinstall-ssh-authorized-keys-plant
    desc: npm postinstall SSH authorized_keys plant
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
    any:
      - id: objectives/persistence/login/ssh/backdoor::js-ssh-backdoor
      - id: objectives/persistence/login/ssh/backdoor::js-authorized-key-literal-backdoor
      - id: objectives/persistence/login/ssh/backdoor::js-variable-ssh-backdoor
