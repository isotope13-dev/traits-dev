defaults:
  platforms:
  - macos
  attack: T1195.002,T1105,T1041
traits:
- id: node-exec-download-chmod-run
  desc: Downloads, chmods, and runs executable
  crit: suspicious
  conf: 0.98
  for:
  - javascript
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /require\s*\(\s*["']child_process["']\s*\)/s
          $bad_0_1 = /[\s]/s
          $b0_1 = /curl\s+-O\s+https?:\/\//s
          $bad_0_2 = /[\s]/s
          $b0_2 = /chmod\s+\+x\s+\.\//s
          $bad_0_3 = /[\s`]/s
          $b0_3 = /\.\//s
          $b0_4 = /\bexec\s*\(/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 300 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) + 1 and
                  not $bad_0_1 in ((@b0_1[i1] + !b0_1[i1]) .. (@b0_1[i1] + !b0_1[i1]) + 0) and
                  (@b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 101 or not $bad_0_1 in ((@b0_1[i1] + !b0_1[i1]) .. @b0_2[i2] - 101)) and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) + 1 and
                    not $bad_0_2 in ((@b0_2[i2] + !b0_2[i2]) .. (@b0_2[i2] + !b0_2[i2]) + 0) and
                    (@b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 101 or not $bad_0_2 in ((@b0_2[i2] + !b0_2[i2]) .. @b0_3[i3] - 101)) and
                    for any i4 in (1..#b0_4) : (
                      @b0_4[i4] >= (@b0_3[i3] + !b0_3[i3]) + 1 and
                      not $bad_0_3 in ((@b0_3[i3] + !b0_3[i3]) .. (@b0_3[i3] + !b0_3[i3]) + 0) and
                      (@b0_4[i4] <= (@b0_3[i3] + !b0_3[i3]) + 301 or not $bad_0_3 in ((@b0_3[i3] + !b0_3[i3]) .. @b0_4[i4] - 301)) and
                      true
                    )
                  )
                )
              )
            )
          )
      }
- id: macho-host-user-curl-query
  desc: Native curl callback includes host and user
  crit: suspicious
  conf: 0.98
  for:
  - macho
  if:
    type: text
    regex: https?://[^\x00\s]{1,200}\?h=%s&u=%s
composite_rules:
- id: npm-downloader-native-host-user-beacon
  desc: npm package includes downloader and host profile beacon
  crit: hostile
  conf: 0.99
  for:
  - zip
  - npm
  - tar
  - javascript
  - macho
  scope: archive
  all:
  - id: node-exec-download-chmod-run
  - id: macho-host-user-curl-query
