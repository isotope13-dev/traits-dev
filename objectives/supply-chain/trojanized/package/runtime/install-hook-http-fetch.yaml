defaults:
  for: [package.json, npm]
  platforms: [unix, windows]

composite_rules:
  - id: npm-lifecycle-wget-http-fetch
    desc: npm install hook fetches a remote file with wget
    crit: hostile
    conf: 0.96
    attack: "T1195.002,T1105"
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: micro-behaviors/communications/http/download/package::postinstall-wget-http-url
