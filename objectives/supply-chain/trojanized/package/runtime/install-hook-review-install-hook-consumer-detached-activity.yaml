defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1543
  mbc: B0024
composite_rules:
  - id: install-hook-consumer-detached-activity
    desc: Detached install script has consumer-path and intrusive activity clues
    crit: suspicious
    conf: 0.95
    scope: archive
    all:
      - id: micro-behaviors/process/daemonize/detach::install-named-script-detach-options
      - id: micro-behaviors/os/env/read/named::npm-init-cwd-read
    any:
      - id: objectives/execution/payload/interpreter-stdin/network::preinstall-curl-piped-node-exec
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::npm-postinstall-http-node-stdin
      - id: micro-behaviors/fs/read/file/credential::postinstall-ssh-key-dump-pipeline
      - id: objectives/credential-access/ssh/key::npm-lifecycle-ssh-key-symlink
      - id: objectives/exfiltration/http/env::postinstall-dotenv-http-exfil
      - id: micro-behaviors/fs/delete/file/library::js-repeated-unlink-call
      - id: metadata/package/scripts/reference::npm-script-directory-delete-command
    needs: 1
