defaults:
  platforms: [netscaler, appliance, unix]
  for: [swift]
  attack: T1195.002

traits:
  - id: objectives/supply-chain/trojanized/package/runtime::swift-malicious-manifest-write
    desc: Swift manifest backup file reference
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: Package.swift.bak

composite_rules:
  - id: objectives/supply-chain/trojanized/package/runtime::swift-netscaler-trojan-manifest
    desc: Swift SPM manifest tampering in NetScaler
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/package-manager::swiftpm-directory-path
      - id: objectives/supply-chain/trojanized/package/runtime::swift-malicious-manifest-write
