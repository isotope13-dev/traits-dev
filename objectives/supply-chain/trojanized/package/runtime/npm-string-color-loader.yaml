# Malfex-style npm packages: a chalk-like facade patches String.prototype color
# getters so any styled string access runs a hidden loader (function-flag).
defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript, tar]
  attack: T1195.002,T1059.007

composite_rules:
  - id: npm-string-prototype-color-loader-chain
    desc: npm package hijacks String color getters for loader
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1027,T1059.007
    scope: archive
    all:
      - id: micro-behaviors/data/property/define::string-prototype-define-property
      - id: metadata/package/dependencies/manifest/identity::npm-dep-function-flag
    unless:
      - id: metadata/package/testing/presence/harness/

      - id: "metadata/file/naming::test-directory-component"
  - id: npm-chalk-facade-function-flag-stager
    desc: chalk-like npm facade depends on function-flag loader
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1027
    scope: archive
    all:
      - id: micro-behaviors/data/property/define::string-prototype-define-property
      - id: metadata/package/dependencies/manifest/identity::npm-dep-function-flag
      - id: metadata/package/dependencies/manifest/identity::npm-dep-chalk
    unless:
      - id: metadata/package/testing/presence/harness/

      - id: "metadata/file/naming::test-directory-component"
  - id: npm-postinstall-hidden-appdata-exe-dropper
    desc: npm postinstall carries hidden APPDATA executable dropper
    crit: hostile
    conf: 0.998
    attack: T1195.002,T1105,T1059.007
    scope: archive
    for: [npm, javascript, package.json]
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: objectives/command-and-control/dropper/delivery/fetch-exec::axios-stream-appdata-hidden-exe-dropper
    unless:
      - id: metadata/package/testing/presence/harness/

      - id: "metadata/file/naming::test-directory-component"
  - id: npm-core-name-dependency-hidden-exe-dropper
    desc: Core-module-named npm dependency accompanies hidden exe dropper
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1105,T1059.007
    scope: archive
    all:
      - id: metadata/package/dependencies/manifest/identity::npm-core-module-name-dependency
      - id: objectives/command-and-control/dropper/delivery/fetch-exec::axios-stream-appdata-hidden-exe-dropper
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: "metadata/file/naming::test-directory-component"
