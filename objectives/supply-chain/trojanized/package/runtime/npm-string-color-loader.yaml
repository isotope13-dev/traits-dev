defaults:
  platforms:
  - unix
  - windows
  for:
  - npm
  - package.json
  - javascript
  - tar
  attack: T1195.002,T1059.007
  crit: hostile
composite_rules:
- id: npm-string-prototype-color-loader-chain
  desc: npm package hijacks String color getters for loader
  conf: 0.995
  attack: T1195.002,T1027,T1059.007
  scope: archive
  all:
  - id: micro-behaviors/data/property/define::string-prototype-define-property
  - id: metadata/package/dependencies/identity::npm-dep-function-flag
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/path::test-directory-component
- id: npm-chalk-facade-function-flag-stager
  desc: chalk-like npm facade depends on function-flag loader
  conf: 0.99
  attack: T1195.002,T1027
  scope: archive
  all:
  - id: micro-behaviors/data/property/define::string-prototype-define-property
  - id: metadata/package/dependencies/identity::npm-dep-function-flag
  - id: metadata/package/dependencies/identity::npm-dep-chalk
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/path::test-directory-component
- id: npm-postinstall-hidden-appdata-exe-dropper
  desc: npm postinstall carries hidden APPDATA executable dropper
  conf: 0.998
  attack: T1195.002,T1105,T1059.007
  scope: archive
  for:
  - npm
  - javascript
  - package.json
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: objectives/execution/payload/file-exec/command/shell::axios-stream-appdata-hidden-exe-dropper
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/path::test-directory-component
- id: npm-core-name-dependency-hidden-exe-dropper
  desc: Core-module-named npm dependency accompanies hidden exe dropper
  conf: 0.99
  attack: T1195.002,T1105,T1059.007
  scope: archive
  all:
  - id: metadata/package/dependencies/name-form::npm-core-name-runtime-dependency
  - id: objectives/execution/payload/file-exec/command/shell::axios-stream-appdata-hidden-exe-dropper
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: well-known/app/ai/media/pinokio::package-name
  - id: well-known/tool/development/vscode-extension/calva::calva-vscode-extension
  - id: metadata/path::test-directory-component
- id: js-string-prototype-chalk-getter-side-effect
  desc: String.prototype chalk getter runs side effect
  conf: 0.99
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/data/property/define::string-prototype-define-property
  - id: micro-behaviors/data/property/define::string-prototype-getter-tostring-call
  - id: micro-behaviors/data/property/define::chalk-computed-color-tostring-return
  - id: micro-behaviors/data/property/define::empty-module-exports-object
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/path::test-directory-component
