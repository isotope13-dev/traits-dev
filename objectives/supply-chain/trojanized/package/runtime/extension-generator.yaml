defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: extension-package-remote-shell-generator
    desc: Builds plugins containing remote-shell payloads
    crit: hostile
    conf: 0.97
    scope: file
    # The artifact generates executable plugin code, including in security
    # regression programs. Quoted documentation without file construction
    # does not satisfy the writer and entrypoint roles.
    all:
      - id: metadata/package/entrypoint/extension::openclaw-source-extension-entry-list
      - id: micro-behaviors/fs/write/file/full/unspecified::write-file-sync
      - id: objectives/execution/payload/interpreter-stdin/network::node-exec-curl-pipe-remote-shell
