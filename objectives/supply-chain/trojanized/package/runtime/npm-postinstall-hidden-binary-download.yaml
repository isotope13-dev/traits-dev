defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript]

composite_rules:
  - id: npm-postinstall-hidden-home-binary-download
    desc: Install hook stages hidden browser binary
    crit: hostile
    conf: 0.97
    attack: T1195.002, T1105
    scope: package
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/fs/path/hidden::node-homedir-hidden-entry
      - id: micro-behaviors/os/application/target/browser
