# These Python package runtimes execute source downloaded after installation.
# A remote updater is a code loader even when its payload is not present in
# the package; checking a version marker is not source authentication.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1105,T1059.006

traits:
  - id: python-update-version-url
    desc: Defines a remote update-version URL
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(UPDATE_VERSION_URL|VERSION_URL)\s*='

  - id: python-update-script-url
    desc: Defines a remote update-script URL
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(UPDATE_SCRIPT_URL|SCRIPT_URL)\s*='

composite_rules:
  - id: python-package-downloads-and-executes-update-source
    desc: Python package executes source from its update server
    crit: hostile
    conf: 0.98
    scope: package
    for: [npm, python]
    all:
      - id: python-update-version-url
      - id: python-update-script-url
      - id: micro-behaviors/process/deploy/script-eval/network::python-urllib-body-value-exec
