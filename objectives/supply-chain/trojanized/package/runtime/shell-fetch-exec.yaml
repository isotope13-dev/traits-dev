# A package's shell launcher fetches Python source into a temporary file and
# starts it with the discovered interpreter, so installation runs code the
# published archive did not contain.
defaults:
  platforms: [unix, windows]
  for: [shell]
  attack: T1195.002,T1105,T1059.004

traits:
  - id: shell-downloads-python-source-to-temp
    desc: Downloads Python source into a temporary path
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(curl|wget)[^\n]{0,180}\.py[^\n]{0,100}(\$TMP|\$DEST)|\$TMP[^\n]{0,100}\.py'

  - id: shell-runs-downloaded-python-source
    desc: Runs downloaded Python via selected interpreter
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'exec\s+["'']?\$PY["'']?\s+["'']?\$TMP'

composite_rules:
  - id: shell-downloads-and-runs-python-source
    desc: Shell launcher downloads and runs Python source
    crit: suspicious
    conf: 0.97
    scope: file
    all:
      - id: shell-downloads-python-source-to-temp
      - id: shell-runs-downloaded-python-source

  - id: npm-package-launches-source-downloaded-at-runtime
    desc: npm package launcher runs a remotely fetched Python script
    crit: hostile
    conf: 0.98
    for: [npm, shell]
    scope: outer
    near_lines: 120
    all:
      - id: shell-downloads-python-source-to-temp
      - id: shell-runs-downloaded-python-source
