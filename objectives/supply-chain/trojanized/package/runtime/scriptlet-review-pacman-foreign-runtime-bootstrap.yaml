defaults:
  platforms: [linux]
  for: [shell]
  attack: T1195.002
composite_rules:
  - id: pacman-foreign-runtime-bootstrap
    desc: Pacman package has runtime dependency and bootstrap clues
    crit: suspicious
    conf: 0.95
    for: [shell, tar]
    scope: archive
    all:
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-js-runtime-dependency
    any:
      - id: objectives/anti-static/obfuscation/encoding/shell::pacman-scriptlet-obfuscated-command
      - id: micro-behaviors/os/package-manager/hook-install::pacman-scriptlet-foreign-package-bootstrap
