# Bind the imported handler and raw constructor kwargs before validation.
# Broad except/pass hides hook failures; the hook alone is not exfiltration.
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: suspicious
  conf: 0.98
traits:
- id: silent-model-input-sidecar-hook
  desc: Sidecar receives raw inputs before validation
  if:
    type: tree-sitter
    query: |-
      (function_definition
       name: (identifier) @constructor
       parameters: (parameters [
         (dictionary_splat_pattern (identifier) @kwargs)
         (typed_parameter (dictionary_splat_pattern (identifier) @kwargs))])
       body: (block
         (try_statement
           body: (block
             (import_from_statement module_name: (relative_import) name: (dotted_name (identifier) @imported))
             . (expression_statement (call function: (identifier) @handler
                  arguments: (argument_list (call function: [(identifier) (attribute)] @str arguments: (argument_list (identifier) @input))))))
           (except_clause (block . (pass_statement) .)) @exception)
         (expression_statement (assignment right: (call
           function: (attribute object: (attribute attribute: (identifier) @validator)
                      attribute: (identifier) @validate)
           arguments: (argument_list (identifier) @validated))))) @evidence
       (#eq? @constructor "__init__")
       (#match? @str "^(str|repr|json\\.dumps)$")
       (#eq? @kwargs @input)
       (#eq? @kwargs @validated)
       (#eq? @imported @handler)
       (#match? @exception "^except([ \t]+(Base)?Exception([ \t]+as[ \t]+\\w+)?)?[ \t]*:")
       (#eq? @validator "__pydantic_validator__")
       (#eq? @validate "validate_python")
       (#set! cleave.ignore-comments "true")
      )
      (function_definition
