defaults:
  for: [javascript]
  platforms: [unix]
  attack: T1005,T1041,T1195.002

traits:
  - id: node-publishes-flag-exfil-start
    desc: Publishes package with flag theft script
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration (variable_declarator name: (object_pattern (shorthand_property_identifier_pattern) @exec)
            value: (call_expression function: (identifier) @require arguments: (arguments (string (string_fragment) @module)))))
          (expression_statement (assignment_expression left: (member_expression object: (identifier) @exports)
            right: (function_expression body: (statement_block (try_statement body: (statement_block
              (variable_declaration (variable_declarator name: (identifier) @start_cmd value: (string) @command))
              (variable_declaration (variable_declarator name: (identifier) @pkg value: (object
                (pair key: (property_identifier) @scripts value: (object (pair key: (property_identifier) @start value: (identifier) @start_use))))))
              (expression_statement (call_expression function: (identifier) @write_exec arguments: (arguments
                (binary_expression left: (binary_expression left: (string (string_fragment) @write_prefix)
                  right: (call_expression function: (member_expression object: (call_expression
                    function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
                    arguments: (arguments (identifier) @pkg_use)) property: (property_identifier) @replace)))
                  right: (string (string_fragment) @write_suffix)))))
              (expression_statement (call_expression function: (identifier) @publish_exec
                arguments: (arguments (string (string_fragment) @publish)))))))))))
          (#eq? @exec "execSync")
          (#eq? @require "require")
          (#eq? @module "child_process")
          (#eq? @exports "exports")
          (#eq? @scripts "scripts")
          (#eq? @start "start")
          (#eq? @start_cmd @start_use)
          (#match? @command "cat /root/root[.]txt")
          (#match? @command "cat /home/[^ /]+/user[.]txt")
          (#match? @command "curl[[:space:]]+-s[[:space:]]+https?://[^[:space:]]+[?][^[:space:]]*root=[$]")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @pkg @pkg_use)
          (#eq? @replace "replace")
          (#eq? @exec @write_exec)
          (#match? @write_prefix "^echo ")
          (#match? @write_suffix "> /tmp/pwn_pkg2/package[.]json$")
          (#eq? @exec @publish_exec)
          (#match? @publish "^cd /tmp/pwn_pkg2 && npm publish[[:space:]]"))
