defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1195.002,T1059.006
  mbc: B0024

composite_rules:
  - id: pypi-isolated-staged-child-payload
    desc: PyPI module hides payload in isolated child
    conf: 0.98
    scope: outer
    near_lines: 200
    all:
      - id: micro-behaviors/process/create/local-exec::sys-executable-isolated-c-run
      - id: micro-behaviors/process/create/local-exec::python-c-flag-variable-code-argument
      - id: micro-behaviors/data/control-flow/module-exec::python-triple-quoted-staged-source-variable
  - id: python-remote-config-zip-upload-exfil
    desc: Remote JSON config drives zip upload exfil
    conf: 0.98
    attack: T1041,T1071.001
    mbc: B0046
    scope: outer
    all:
      - id: micro-behaviors/data/control-flow/module-exec::python-json-loads-remote-fetch-decode
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-writestr-text
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-put-method
      - id: micro-behaviors/communications/tls/verify/disable::unverified-ssl-context
