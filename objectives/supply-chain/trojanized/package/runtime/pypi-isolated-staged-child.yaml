defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1195.002,T1059.006
  mbc: B0024

composite_rules:
  - id: pypi-isolated-staged-child-payload
    desc: Python launches an isolated child with code and a multiline string
    crit: suspicious
    conf: 0.98
    for: [python]
    near_lines: 200
    all:
      - id: micro-behaviors/process/interpreter/python::sys-executable-isolated-c-run
      - id: micro-behaviors/process/deploy/interpreter-command::python-c-flag-variable-code-argument
      - id: metadata/lang/source/syntax/assignment/name::python-uppercase-triple-single-quoted-assignment
    unless:
      - id: micro-behaviors/os/container/namespace::new-user-namespace-flag
  - id: python-remote-config-zip-upload-exfil
    desc: Remote JSON config drives zip upload exfil
    conf: 0.98
    attack: T1041,T1071.001
    mbc: B0046
    scope: outer
    all:
      - id: micro-behaviors/data/parse/json::python-json-parse-decoded-call
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-writestr-text
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-put-method
      - id: micro-behaviors/communications/tls/verify/disable::unverified-ssl-context
  - id: python-trojan-library-download-payload
    desc: Python library package downloads and launches executable payload
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1105,T1059.006
    scope: archive
    for: [whl, python, pkginfo]
    all:
      - id: metadata/lang/source/syntax/assignment/name::exported-all-api-surface
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
      - id: micro-behaviors/communications/http/client/exchange::python-http-request-file-write
    any:
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
      - id: micro-behaviors/os/handler/open::os-startfile-call
      - id: micro-behaviors/process/create/subprocess/launch::run-ast
