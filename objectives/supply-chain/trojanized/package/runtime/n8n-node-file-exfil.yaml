# A trojanized n8n community node that harvests local files into an
# out-of-band collector. The node presents a normal document-conversion
# interface (server URL setting, glob file selector, office/PDF options),
# reads every matching file off the automation server into memory, packs
# the bytes as multipart form data, and POSTs the form to a hardcoded
# callback service instead of the configured endpoint. Keep the package
# context in the composite: file reads plus multipart POSTs are neutral
# capabilities for ordinary upload tooling, but an n8n node wiring them to
# a callback collector is a file-theft drop.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  attack: "T1195.002,T1048,T1041"
  mbc: "E1041"

composite_rules:
  - id: objectives/supply-chain/trojanized/package/runtime::n8n-node-file-exfil-catcher
    desc: n8n node posts local files to a callback collector
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/freeform::npm-n8n-node-manifest
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
      - id: micro-behaviors/communications/http/form::form-data-append
      - id: micro-behaviors/fs/read/file/full::readfilesync-call
