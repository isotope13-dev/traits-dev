defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1105,T1059
traits:
- id: node-collaboration-vpn-target-gate
  desc: Gates execution on collaboration and VPN clients
  crit: suspicious
  conf: 0.98
  for:
  - javascript
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /(lark|feishu)/is
          $b0_1 = /forticlient/is
          $b0_2 = /collab\.length\s*>\s*0\s*&&\s*vpn\.length\s*>\s*0/is
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 1000 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 2500 and
                  true
                )
              )
            )
          )
      }
- id: node-manifest-cross-platform-shell-loader
  desc: Runs remote manifest through platform shell
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /resolveRemoteManifestUri\s*\(\s*\)/is
          $b0_1 = /\biex\s*\(iwr\b/is
          $b0_2 = /curl\s+-fsSL/is
          $b0_3 = /\|\s*bash/is
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 1000 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 1000 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 300 and
                    true
                  )
                )
              )
            )
          )
      }
- id: node-xor-manifest-segments
  desc: Decodes endpoint from keyed numeric segments
  crit: suspicious
  conf: 0.98
  for:
  - javascript
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /segments\s*\[\s*i\s*\]\s*\^\s*key\.charCodeAt\s*\(/s
          $b0_1 = /\^\s*\(\(i\s*\*\s*7\s*\+\s*13\)/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 120 and
                true
              )
            )
          )
      }
- id: npm-postinstall-targeted-manifest-call
  desc: Postinstall gates and runs remote manifest sync
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  if:
    type: text
    regex: (?s)shouldSyncRemoteConfig\s*\(\s*\).{0,200}syncRemoteManifest\s*\(
- id: node-lark-forti-targeted-shell-loader
  desc: Loads shell on Lark and FortiClient hosts
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $bad_0_0 = /["'\s]/s
          $b0_0 = /https?:\/\//s
          $b0_1 = /function\s+hasLark\s*\(/s
          $b0_2 = /function\s+hasFortiClient\s*\(/s
          $b0_3 = /hasLark\s*\(\s*\)\s*&&\s*hasFortiClient\s*\(\s*\)/s
          $b0_4 = /iwr\s+[^\n]{0,250}\|\s*iex/s
          $b0_5 = /curl\s+-fsSL[^\n]{0,200}\|\s*bash/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) + 1 and
                not $bad_0_0 in ((@b0_0[i0] + !b0_0[i0]) .. (@b0_0[i0] + !b0_0[i0]) + 0) and
                (@b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 1001 or not $bad_0_0 in ((@b0_0[i0] + !b0_0[i0]) .. @b0_1[i1] - 1001)) and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 1000 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 1000 and
                    for any i4 in (1..#b0_4) : (
                      @b0_4[i4] >= (@b0_3[i3] + !b0_3[i3]) and
                      @b0_4[i4] <= (@b0_3[i3] + !b0_3[i3]) + 1000 and
                      for any i5 in (1..#b0_5) : (
                        @b0_5[i5] >= (@b0_4[i4] + !b0_4[i4]) and
                        @b0_5[i5] <= (@b0_4[i4] + !b0_4[i4]) + 300 and
                        true
                      )
                    )
                  )
                )
              )
            )
          )
      }
composite_rules:
- id: npm-lark-forti-targeted-shell-loader
  desc: npm install targets workstations with remote shell payload
  crit: hostile
  conf: 0.995
  for:
  - zip
  - npm
  - tar
  - javascript
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: node-lark-forti-targeted-shell-loader
- id: npm-targeted-obfuscated-manifest-shell-loader
  desc: npm install runs encoded remote shell on targeted workstations
  crit: hostile
  conf: 0.995
  for:
  - zip
  - npm
  - tar
  - javascript
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: npm-postinstall-targeted-manifest-call
  - id: node-collaboration-vpn-target-gate
  - id: node-manifest-cross-platform-shell-loader
  - id: node-xor-manifest-segments
