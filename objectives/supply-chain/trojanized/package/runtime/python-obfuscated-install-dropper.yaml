defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1105,T1059.006

composite_rules:
- id: python-obfuscated-install-home-downloader
  desc: Obfuscated install hook downloads and launches a hidden home-directory payload
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: metadata/build/package/recipe/setup-hooks::python-install-hook
  - id: micro-behaviors/communications/http/get::requests-get
  - id: micro-behaviors/data/decode/hex::python-fromhex
  - id: micro-behaviors/data/bitwise/mixed::python-xor-expression
  - id: micro-behaviors/fs/path/user-directory::home-hidden-dotpath
  - id: micro-behaviors/fs/chmod/modify::python-path-chmod
  - id: micro-behaviors/process/create/subprocess/launch::popen-ast
