defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - zip
  - npm
  - tar
  attack: T1195.002,T1543.003,T1552.001,T1041
traits:
- id: npm-globally-installs-pm2
  desc: npm command globally installs PM2
  crit: notable
  conf: 0.99
  for:
  - javascript
  if:
    type: text
    regex: npm\s+install\s+-g\s+pm2
- id: npm-globally-installs-scoped-worker
  desc: npm global scoped package install text
  crit: notable
  conf: 0.99
  for:
  - javascript
  if:
    type: text
    regex: npm\s+install\s+-g\s+@[A-Za-z0-9_-]+/[A-Za-z0-9_-]+
- id: js-google-service-account-spreadsheet-row-write
  desc: Writes status rows to Google spreadsheet
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  if:
    type: text
    regex: GoogleSpreadsheet\([\s\S]{0,400}sheet\.addRow\s*\(
composite_rules:
- id: npm-import-time-pm2-worker-uses-gcp-key
  desc: Import installs PM2 worker with embedded GCP key
  crit: hostile
  conf: 0.995
  scope: archive
  near_bytes: 6000
  all:
  - id: micro-behaviors/data/control-flow/module-exec::node-terminal-main-call
  - id: npm-globally-installs-pm2
  - id: npm-globally-installs-scoped-worker
  - id: micro-behaviors/crypto/key/representation/encoded::pem-private-key-header
  - id: js-google-service-account-spreadsheet-row-write
