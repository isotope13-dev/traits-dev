# Import-time trojan that scatters its payload as short string constants
# across dozens of innocent-looking modules, then reassembles (ordered join,
# length clamp), decodes (base64, XOR) and executes the result while the
# package imports, handing it live requests/subprocess handles. The
# importlib loop, multi-decode, XOR and module-scope execution are
# individually ordinary; together in a network- and process-capable module
# at import time they are staged execution. The char-code-built getattr on
# builtins in the companion shim is covered by getattr-builtins-obfuscation.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1027

composite_rules:
  - id: python-sharded-payload-reassemble-exec
    desc: Reassembles sharded payload across modules and executes it at import
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/os/module/load/name::py-importlib-import-module
      - id: micro-behaviors/data/decode/base64/unspecified::multiple-b64decode-calls
      - id: micro-behaviors/data/encoding/xor/unspecified-key::python-xor-bytes-comprehension
      - id: micro-behaviors/data/control-flow/module-exec::python-column0-noarg-call-assignment
      - id: metadata/import/builtin::python-subprocess-import
      - id: metadata/import/package::python-network-client-imports
