# Obfuscated npm runtime backdoor: a jsjiami-concealed JavaScript file that
# runs shell commands synchronously and carries an npm self-install command
# on the same shell path. The install leg is the updater half of the
# backdoor (a version check followed by `npm install <pkg>@latest` through
# execSync); the watermark leg proves the concealment is a commercial
# obfuscator rather than ordinary minification. Neither direct-call nor
# computed-dispatch execSync alone implies intent, so both spellings sit in
# `any:` while the obfuscation plus self-update pairing gates the verdict.
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1059.007,T1027
  mbc: B0024

composite_rules:
  - id: npm-obfuscated-execsync-backdoor
    desc: Obfuscated npm file runs shell commands with self-install
    conf: 0.98
    scope: file
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::jsjiami-watermark
      - id: micro-behaviors/os/package-manager/reference-install::npm-install-shell-boundary-text
    any:
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: micro-behaviors/process/create/shell/bridge::execsync-computed-dispatch-call
