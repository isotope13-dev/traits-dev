# Install-time bundled-executable dropper: a setup.py that copies a co-shipped
# executable to an environment-resolved location and launches it concealed
# (hidden window or detached background process) while the package installs.
# The setup.py filename is mandated by the packaging format, so gating on it
# is stable; every other leg is content-derived API behavior that survives
# renames of variables, paths, destinations and the bundled executable.
defaults:
  crit: hostile
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1195.002,T1059.006
  mbc: B0024
composite_rules:
- id: setup-py-stages-bundled-exe-hidden-launch
  desc: Setup script stages bundled executable and hides its launch
  conf: 0.98
  scope: file
  all:
  - id: metadata/build/pip::setup-py
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
  - id: micro-behaviors/fs/file/copy/source-destination::shutil-copy
  - id: micro-behaviors/os/env/read/variable::python-os-getenv-call
  any:
  - id: micro-behaviors/process/argument/visibility::shellexecutew-hidden-showcmd-python
  - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
