---
defaults:
  platforms:
  - unix
  for:
  - package.json
  attack: T1195.002,T1105,T1059.004
composite_rules:
- id: npm-postinstall-download-chmod-run
  desc: npm postinstall downloads, chmods, and runs a file
  crit: hostile
  conf: 0.995
  scope: file
  near_bytes: 512
  all:
  - id: micro-behaviors/communications/http/curl/command::npm-postinstall-curl
  - id: micro-behaviors/fs/chmod/executable/mode::npm-postinstall-chmod-plus-x
  - id: micro-behaviors/os/package-manager/run::npm-postinstall-runs-relative-executable
