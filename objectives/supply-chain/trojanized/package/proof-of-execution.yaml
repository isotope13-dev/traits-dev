# A published package whose payload exists to prove it ran on your machine.
# `MSRCPoC 99.0.1` is five lines: `subprocess.check_output(["whoami"])`, then
# `f"Hacked by Joex!! your username: {output}"`. The version is inflated so any
# resolver reaching for "latest" prefers it over the real package, and the
# payload reports back who installed it.
#
# The brag is what separates this from an ordinary identity lookup. `whoami` is
# in every deployment script; a string constant announcing a compromise is in
# none of them, because nothing a program legitimately prints tells its user the
# host has been taken. When both sit in one file the package has stated its own
# purpose, and the identity lookup says the author wanted to know whose machine
# answered.
#
# Scored on the delivery, not on how harmless this particular payload is.
# Dependency-confusion research uploads, typosquat probes and bug-bounty
# submissions all ship exactly this shape — and so does stage one of a campaign
# that swaps the payload once the name is established. The consumer whose
# resolver picked the wrong package cannot tell the difference at install time.
defaults:
  platforms: [unix, windows, macos]
  for: [scripts, source]
  attack: "T1195.002,T1033"
  mbc: E1195.002

composite_rules:
  - id: package-announces-host-compromise
    desc: Package payload reports who it landed on
    crit: hostile
    conf: 0.95
    # One file: the brag and the identity lookup have to be the same payload.
    scope: file
    all:
      - id: objectives/impact/deface/taunt/
      - id: micro-behaviors/process/user/query/
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
