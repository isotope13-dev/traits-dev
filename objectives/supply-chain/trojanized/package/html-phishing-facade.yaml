defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002
  mbc: B0021

composite_rules:
  - id: npm-cloudflare-turnstile-html-phishing
    desc: npm HTML facade delivers Cloudflare Turnstile phishing
    crit: hostile
    conf: 0.96
    # package.json and index.html are separate tar members.  `archive` keeps
    # them apart; outer scope is the package-level correlation we need here.
    scope: outer
    for: [npm, html, archives]
    all:
      - id: objectives/supply-chain/impersonation/manifest/facade::brand-new-html-only-facade-package
      - id: objectives/credential-access/phishing/captcha::cloudflare-turnstile-phishing-page
  - id: npm-cloudflare-turnstile-query-phishing
    desc: npm HTML facade forwards query data after Turnstile
    crit: hostile
    conf: 0.97
    scope: outer
    for: [npm, html, archives]
    all:
      - id: objectives/supply-chain/impersonation/manifest/facade::brand-new-html-only-facade-package
      - id: objectives/credential-access/phishing/captcha::cloudflare-turnstile-query-redirect

  # When archive expansion skips HTML documents, the Turnstile page composites
  # never enter the graph. Correlate the HTML-only facade with a 1.0.0 first
  # publish that ships no keywords (airdzticket / GHSA HTML stagers).
  - id: npm-fresh-html-only-phishing-facade
    desc: Fresh HTML-only npm 1.0.0 package used as phishing facade
    crit: hostile
    conf: 0.95
    attack: T1195.002,T1204.001
    mbc: B0021,B0024
    scope: package
    for: [npm, archives]
    all:
      - id: objectives/supply-chain/impersonation/manifest/facade::brand-new-html-only-facade-package
      - id: metadata/package/quality/version-sentinel::npm-version-exactly-1-0-0
      - id: metadata/package/quality/empty::npm-no-keywords
    unless:
      - id: metadata/package/manifest/repository/
      - id: metadata/package/manifest/homepage::has-homepage-field
