defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002
  mbc: B0021

composite_rules:
  - id: npm-cloudflare-turnstile-html-phishing
    desc: npm HTML facade delivers Cloudflare Turnstile phishing
    crit: hostile
    conf: 0.96
    # package.json and index.html are separate tar members.  `archive` keeps
    # them apart; outer scope is the package-level correlation we need here.
    scope: outer
    for: [npm, html, archives]
    all:
      - id: objectives/supply-chain/impersonation/manifest/facade::brand-new-html-only-facade-package
      - id: objectives/credential-access/phishing/captcha::cloudflare-turnstile-phishing-page
  - id: npm-cloudflare-turnstile-query-phishing
    desc: npm HTML facade forwards query data after Turnstile
    crit: hostile
    conf: 0.97
    scope: outer
    for: [npm, html, archives]
    all:
      - id: objectives/supply-chain/impersonation/manifest/facade::brand-new-html-only-facade-package
      - id: objectives/credential-access/phishing/captcha::cloudflare-turnstile-query-redirect
