# StacksJS release line: @stacksjs/ts-xml@0.1.2 and ts-slug@0.1.2 both ship a
# postinstall that runs the unpinned `bunx git-hooks` transient package on
# every consumer install. The install command is the shared behavior and stays
# generic, so copycats reach the notable atom. The hostile composites add the
# package identity and affected release as IOC legs. The 0.1.2 version atom is
# shared by both packages; each release composite supplies its own name leg.
defaults:
  for: [package.json]
  platforms: [unix, windows]
  attack: T1195.002

traits:
  - id: postinstall-bunx-git-hooks
    desc: Runs bunx git-hooks from postinstall
    crit: notable
    conf: 0.96
    if:
      type: value
      path: scripts.postinstall
      exact: bunx git-hooks

  - id: stacksjs-ts-xml-package-name
    desc: Names the affected StacksJS ts-xml package
    if:
      type: value
      path: name
      exact: '@stacksjs/ts-xml'

  - id: stacksjs-ts-slug-package-name
    desc: Names the affected StacksJS ts-slug package
    if:
      type: value
      path: name
      exact: ts-slug

  - id: stacksjs-affected-release-version
    desc: Declares the affected 0.1.2 StacksJS release
    if:
      type: value
      path: version
      exact: 0.1.2

composite_rules:
  - id: stacksjs-ts-xml-affected-release
    desc: Identifies the affected ts-xml release
    crit: notable
    for: [npm, package.json]
    scope: package
    all:
      - id: stacksjs-ts-xml-package-name
      - id: stacksjs-affected-release-version

  - id: stacksjs-ts-xml-transient-install-loader-package
    desc: Affected ts-xml release runs transient git-hooks installer
    crit: hostile
    conf: 0.96
    for: [npm, package.json]
    scope: package
    all:
      - id: postinstall-bunx-git-hooks
      - id: stacksjs-ts-xml-affected-release

  - id: stacksjs-ts-slug-affected-release
    desc: Identifies the affected ts-slug release
    crit: notable
    for: [npm, package.json]
    scope: package
    all:
      - id: stacksjs-ts-slug-package-name
      - id: stacksjs-affected-release-version

  - id: stacksjs-ts-slug-transient-install-loader-package
    desc: Affected ts-slug release runs transient git-hooks installer
    crit: hostile
    conf: 0.96
    for: [npm, package.json]
    scope: package
    all:
      - id: postinstall-bunx-git-hooks
      - id: stacksjs-ts-slug-affected-release
