# A published package whose install and require both resolve to one mutable
# off-registry URL: the sole runtime dependency names no fixed artifact
# (unpinned HTTPS URL on a third-party host), and the root module only
# re-exports whatever that URL serves, so requiring the package executes
# bytes the registry never saw and cannot yank. The fetched payloads behind
# such stubs are verifiably inert today and mutable tomorrow — scored on
# the delivery, suspicious rather than hostile, because private artifact
# hosts are a legitimate use that stays plausible. What separates the two
# composites below is the angle, not the verdict: the first reads the
# delivery chain (mutable remote source plus require-time execution), the
# second the hollowness (an entry module with no local logic plus a remote
# dependency). Either alone is a stub; together they are a staged loader.
#
# Worked examples: @flexmr/survey-client, @flexmr/survey-conversation and
# @flexmr/utils at 10.0.12 (npm, 2026-10) — generated boilerplate whose
# single dependency is an unpinned https://artifacts.creditslib.com/npm/…
# URL serving a name/version stub, re-exported verbatim by index.js.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript]
  attack: T1195.002
composite_rules:
  - id: sole-mutable-url-dependency-reexport
    desc: Sole unpinned URL dependency re-exported at require
    crit: suspicious
    conf: 0.93
    scope: archive
    all:
      - id: metadata/package/dependencies/manifest/source::npm-single-https-runtime-dependency
      - id: metadata/package/dependencies/manifest/source::npm-unpinned-url-runtime-dependency
      - id: micro-behaviors/data/control-flow/module-exec::commonjs-module-reexport
  - id: hollow-entry-reexports-remote-url-dep
    desc: Hollow entry module re-exports remote URL dependency
    crit: suspicious
    conf: 0.92
    scope: archive
    all:
      - id: micro-behaviors/data/control-flow/module-exec::sole-require-passthrough-module
      - id: metadata/package/dependencies/manifest/source::remote-url-dependency
    unless:
      # Archive scope pools every file, so a source tree or a vendored
      # node_modules full of unrelated packages supplies a pass-through
      # `index.js` and a URL dependency from different packages. A hollow stub
      # package has a handful of members, not hundreds.
      - id: metadata/file/archive::archive-at-least-120-members
      # npm tarballs carry no member count; a nested package.json marks the
      # same multi-package tree (HybridClaw's private plugins/line manifest
      # pulls JSR tarballs while skills/*/index.cjs re-export siblings).
      - id: metadata/package/files/included::archive-nested-package-json-entry
