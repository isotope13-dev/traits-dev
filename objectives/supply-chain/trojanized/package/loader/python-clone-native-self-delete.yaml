# A package that copies a popular package summary, loads local native code,
# and deletes the Python source module has a strong trojanized-package profile.
defaults:
  platforms: [unix, windows]
  for: [python, pkg_info, zip, python_sdist, tar, whl]

composite_rules:
  - id: clone-native-self-delete-package
    desc: Clone package loads native code then self-deletes
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: objectives/supply-chain/impersonation/metadata-theft::package-clones-popular-summary
      - id: objectives/evasion/self-delete/file/script::self-delete-python
      - id: micro-behaviors/dylib/load/runtime::ctypes-cdll-dot
