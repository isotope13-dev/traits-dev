# Keep the Python launch observations together before correlating the wheel's
# executable members; archive correlation alone cannot identify the target.
defaults:
  platforms: [windows]
  for: [whl]
  attack: T1195.002,T1059.006,T1564.003

composite_rules:
  - id: python-hidden-windows-import-process
    desc: Python import launches a process with a hidden-window option
    crit: suspicious
    conf: 0.96
    for: [python]
    scope: file
    all:
      - id: micro-behaviors/process/create/subprocess/launch::python-module-level-popen
      - id: micro-behaviors/process/config/launch::python-create-no-window-getattr
      - id: micro-behaviors/os/sysinfo/platform/runtime/version::python-windows-version-call
  - id: objectives/supply-chain/trojanized/package/loader::python-wheel-hidden-import-launcher
    for: [whl, python, pe]
    desc: Wheel has a hidden import-time process launch and an executable
    crit: suspicious
    conf: 0.99
    scope: archive
    all:
      - id: python-hidden-windows-import-process
      - id: metadata/package/files/included::exe-extension-basename
  # Declared console-script delivery of a bundled Windows executable: the
  # entry point hands the package directory's PE to subprocess on launch.
  # Distribution form alone does not prove the payload is hostile; it flags
  # the wheel for payload review.
  - id: objectives/supply-chain/trojanized/package/loader::python-wheel-console-launch-bundled-exe
    for: [whl, python, text, pe]
    desc: Wheel console entry launches a bundled Windows executable
    crit: suspicious
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::console-header-in-entry-points-file
      - id: metadata/package/files/included::exe-extension-basename
      - id: micro-behaviors/process/create/subprocess/launch::call-ast
    unless:
      - id: well-known/lib/ai/coding-assistant::bundled-copilot-lsp-path
