# fsevents 1.0.0 through 1.2.10 declared the reclaimed binary bucket and
# fetched its native addon during installation. The advisory documents modified
# binaries served through that install-time fetch; the affected range, host, and
# fetch behavior together distinguish the compromised releases.
defaults:
  platforms: [macos]
  for: [npm, package.json]
  attack: T1195.002, T1105

composite_rules:
  - id: fsevents-affected-release-downloads-compromised-binary
    desc: Affected fsevents release fetches compromised binary
    crit: hostile
    conf: 0.99
    ref: https://osv.dev/vulnerability/MAL-2023-462
    scope: package
    all:
      - id: metadata/package/versioning/vulnerability::fsevents-malicious-binary-range
      - id: metadata/package/dependencies/declaration::fsevents-historical-s3-host
      - id: micro-behaviors/communications/http/download/package::npm-node-pre-gyp-install
