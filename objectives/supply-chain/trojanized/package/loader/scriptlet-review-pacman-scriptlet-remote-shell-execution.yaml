# A trojanized Arch/AUR package whose install scriptlet fetches a remote shell
# script and executes it.
#
# A pacman `.install` scriptlet runs with the installer's privileges (root on a
# normal install), and its payload is covered by package signing. Fetching an
# unverified remote script and executing it there — by pipe or by process
# substitution — hands arbitrary code execution on every install and upgrade to
# whoever controls the URL. A legitimate scriptlet prints status messages,
# refreshes local configuration (ldconfig, systemd daemon-reload, icon caches)
# or provisions local accounts; it never pipes the network into a shell.
#
# The hook leg supplies the install-time trust context, so a standalone
# installer documenting `curl ... | sh` does not qualify. The URL leg requires
# a real remote target, so a bare probe such as `bash <(curl --version)`
# cannot convict. The execution legs are structural (a parsed pipeline or a
# line-anchored process substitution), so an echo quoting an install one-liner
# does not qualify either.
defaults:
  platforms: [linux]
  for: [shell]
  attack: T1195.002,T1105
  mbc: B0024
composite_rules:
  - id: pacman-scriptlet-remote-curl-shell-execution
    desc: Pacman scriptlet fetches and executes a remote shell script
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/build/package/maintainer-scripts::pacman-scriptlet-hook
      - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url
    any:
      - id: micro-behaviors/process/interpreter/shell::curl-process-substitution
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-bash-execution
      - id: micro-behaviors/process/create/shell/pipeline::http-client-pipe-interpreter
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-response-shell-stdin
  - id: pacman-scriptlet-remote-wget-shell-execution
    desc: Pacman scriptlet runs a wget-fetched remote shell script
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/build/package/maintainer-scripts::pacman-scriptlet-hook
      - id: micro-behaviors/communications/http/download/wget::wget-http-url-reference
    any:
      - id: micro-behaviors/process/create/shell/pipeline::http-client-pipe-interpreter
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::wget-pipe-sh
