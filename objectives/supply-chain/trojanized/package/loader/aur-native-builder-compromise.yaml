defaults:
  platforms: [linux]
  for: [tar]
  attack: "T1195.002,T1027"

composite_rules:
- id: objectives/supply-chain/trojanized/package/loader::aur-bundled-native-builder-payload
  desc: PKGBUILD root-runs an unverified stripped native payload
  crit: hostile
  conf: 0.99
  scope: outer
  platforms: [linux, macos, windows]
  for: [tar, shell, elf, macho, pe]
  all:
  - id: objectives/supply-chain/install-hook/build-function::pkgbuild-unverified-sudo-source-exec
  - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"

- id: objectives/supply-chain/trojanized/package/loader::aur-bundled-encrypted-builder-payload
  desc: PKGBUILD root-runs an unverified encrypted native payload
  crit: hostile
  conf: 0.99
  scope: outer
  for: [tar, elf]
  all:
  - id: objectives/supply-chain/trojanized/package/loader::aur-bundled-native-builder-payload
  - id: objectives/anti-static/obfuscation/payload/encrypted::compact-opaque-chacha-rodata-profile

- id: objectives/supply-chain/trojanized/package/loader::fresh-aur-privileged-source-execution
  desc: Fresh AUR change root-runs unverified source
  crit: hostile
  conf: 0.99
  scope: outer
  for: [tar, registry, shell]
  all:
  - id: metadata/registry::aur-recently-modified
  - id: objectives/supply-chain/install-hook/build-function::pkgbuild-unverified-sudo-source-exec

- id: objectives/supply-chain/trojanized/package/loader::fresh-established-aur-native-builder-compromise
  desc: Fresh established AUR change compromises builder
  crit: hostile
  conf: 0.995
  scope: outer
  for: [tar, registry]
  all:
  - id: objectives/supply-chain/trojanized/package/loader::fresh-aur-privileged-source-execution
  - id: metadata/registry::established-package
  - id: metadata/registry::single-maintainer
  - id: objectives/supply-chain/trojanized/package/loader::aur-bundled-native-builder-payload

  # A bare local source and a stripped ELF anywhere in an archive remain
  # suspicious co-occurrence. The available facts do not bind the recipe's
  # source entry to that ELF, so this does not claim the recipe installs it.
- id: objectives/supply-chain/trojanized/package/loader::pkgbuild-local-source-with-stripped-elf
  desc: PKGBUILD local source co-occurs with stripped archive ELF
  crit: suspicious
  conf: 0.9
  scope: archive
  for: [tar, shell]
  all:
  - id: metadata/build/package/recipe/pkgbuild::pkgbuild-bare-local-source-entry
  - id: metadata/build/package/recipe/pkgbuild::archive-contains-pkgbuild-and-stripped-elf

