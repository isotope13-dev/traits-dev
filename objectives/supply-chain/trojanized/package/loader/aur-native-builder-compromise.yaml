defaults:
  platforms: [linux]
  for: [tar]
  attack: "T1195.002,T1027"

composite_rules:
- id: objectives/supply-chain/trojanized/package/loader::aur-bundled-native-builder-payload
  desc: PKGBUILD root-runs an unverified stripped native payload
  crit: hostile
  conf: 0.99
  scope: outer
  platforms: [linux, macos, windows]
  for: [tar, shell, elf, macho, pe]
  all:
  - id: objectives/supply-chain/install-hook/build-function::pkgbuild-unverified-sudo-source-exec
  - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"

- id: objectives/supply-chain/trojanized/package/loader::aur-bundled-encrypted-builder-payload
  desc: PKGBUILD root-runs an unverified encrypted native payload
  crit: hostile
  conf: 0.99
  scope: outer
  for: [tar, elf]
  all:
  - id: objectives/supply-chain/trojanized/package/loader::aur-bundled-native-builder-payload
  - id: objectives/anti-static/obfuscation/payload/encrypted::compact-opaque-chacha-rodata-profile

- id: objectives/supply-chain/trojanized/package/loader::fresh-aur-privileged-source-execution
  desc: Fresh AUR change root-runs unverified source
  crit: hostile
  conf: 0.99
  scope: outer
  for: [tar, registry, shell]
  all:
  - id: metadata/registry::aur-recently-modified
  - id: objectives/supply-chain/install-hook/build-function::pkgbuild-unverified-sudo-source-exec

- id: objectives/supply-chain/trojanized/package/loader::fresh-established-aur-native-builder-compromise
  desc: Fresh established AUR change compromises builder
  crit: hostile
  conf: 0.995
  scope: outer
  for: [tar, registry]
  all:
  - id: objectives/supply-chain/trojanized/package/loader::fresh-aur-privileged-source-execution
  - id: metadata/registry::established-package
  - id: metadata/registry::single-maintainer
  - id: objectives/supply-chain/trojanized/package/loader::aur-bundled-native-builder-payload

  # An AUR git snapshot is a recipe: PKGBUILD, .SRCINFO, and text the recipe
  # patches or installs. A compiled executable committed alongside it has no
  # legitimate purpose -- real binary packages fetch their payload through a
  # checksummed source=() URL, leaving the snapshot text-only. This holds even
  # when the recipe never runs the binary with sudo and pins its checksums, so
  # it catches the delivery shape on its own rather than through the payload.
- id: objectives/supply-chain/trojanized/package/loader::aur-snapshot-ships-executable
  desc: Arch source package ships a prebuilt executable
  crit: suspicious
  conf: 0.95
  scope: archive
  platforms: [linux, macos, windows]
  for: [tar, shell, elf, macho, pe]
  all:
  - id: metadata/file/string/identity::pkgbuild-basename
  - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"
  unless:
  - id: metadata/build/package/recipe/pkgbuild::pkgbuild-remote-archive-source

  # The recipe additionally names that committed file as its source, so the
  # package's "upstream" is the binary sitting in the AUR repository.
- id: objectives/supply-chain/trojanized/package/loader::aur-committed-binary-source
  desc: PKGBUILD sources a committed prebuilt executable
  crit: hostile
  conf: 0.97
  scope: outer
  for: [tar, shell]
  all:
  - id: objectives/supply-chain/trojanized/package/loader::aur-snapshot-ships-executable
  - id: metadata/build/package/recipe/pkgbuild::pkgbuild-bare-local-source-entry

