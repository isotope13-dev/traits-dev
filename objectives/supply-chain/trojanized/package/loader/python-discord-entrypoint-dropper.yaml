# A wheel console script whose target is the Discord APPDATA dropper
# chain. The entry point is the distribution trigger; the bound hidden
# launch of a Discord attachment EXE is the payload it delivers.
defaults:
  platforms: [windows]
  for: [whl]
  attack: T1195.002,T1105,T1059.003,T1564.003

composite_rules:
  - id: wheel-console-script-discord-dropper
    desc: Console script launches Discord dropper payload
    crit: hostile
    conf: 0.98
    scope: archive
    for: [whl, python, text]
    all:
      - id: metadata/package/scripts/entrypoint::console-header-in-entry-points-file
      - id: micro-behaviors/process/deploy/file-exec::python-streamed-download-hidden-shell
      - id: micro-behaviors/communications/http/download/handler::python-streamed-download-appdata
      - id: micro-behaviors/communications/http/url/cloud::discord-cdn-executable-url
