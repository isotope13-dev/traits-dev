defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1195.002

traits:
  # Keep the package's confirmed infrastructure marker for triage and attribution.
  - id: app-dnpkg-beta-api-domain
    desc: Encoded config names dq87771 API host
    crit: notable
    conf: 0.99
    ref: https://osv.dev/vulnerability/MAL-2026-14569
    if:
      type: text
      regex: '([a-z0-9-]{1,40}\.)?dq87771\.com'

  - id: npm-funnull-config-remote-endpoint
    desc: Configuration names a remote endpoint
    crit: notable
    conf: 0.96
    ref: https://osv.dev/vulnerability/MAL-2026-14569
    if:
      type: text
      regex: '"(domain|endpoint)"\s*:\s*"https?://[^"\r\n]{1,180}"'

  - id: npm-funnull-config-token
    desc: Configuration carries a token value
    crit: notable
    conf: 0.96
    ref: https://osv.dev/vulnerability/MAL-2026-14569
    if:
      type: text
      regex: '"token"\s*:\s*"[^"\r\n]{8,128}"'

  - id: npm-funnull-config-cdn
    desc: Encoded package config selects Funnull CDN
    crit: notable
    conf: 0.99
    ref: https://osv.dev/vulnerability/MAL-2026-14569
    if:
      type: text
      regex: '"cdn"\s*:\s*"ZnVubnVsbA=="'

composite_rules:
  - id: npm-package-embeds-dq87771-api-config
    desc: npm package carries Funnull endpoint and token config
    crit: hostile
    conf: 0.99
    scope: package
    for: [npm, javascript]
    all:
      - id: objectives/supply-chain/trojanized/package/loader::npm-funnull-config-cdn
      - id: objectives/supply-chain/trojanized/package/loader::npm-funnull-config-remote-endpoint
      - id: objectives/supply-chain/trojanized/package/loader::npm-funnull-config-token
