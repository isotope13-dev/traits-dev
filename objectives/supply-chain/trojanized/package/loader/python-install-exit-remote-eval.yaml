# The installer registers exit and signal callbacks that fetch and execute
# remote Python. The archive scope joins the callback wiring to its loader.
defaults:
  platforms: [unix, windows]
  for: [python, pkg_info, zip, python_sdist, tar, whl]

composite_rules:
  - id: python-install-exit-remote-eval
    desc: Install exit hook executes fetched Python
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.006,T1195.002
    scope: archive
    all:
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: micro-behaviors/process/exit/handler::atexit-register
      - id: micro-behaviors/process/control/signal::python-signal-handler-registration
      - id: micro-behaviors/process/deploy/script-eval/network::urlopen-before-exec
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-variable
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
