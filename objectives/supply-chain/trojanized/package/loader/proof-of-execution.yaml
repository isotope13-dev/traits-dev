defaults:
  platforms: [unix, windows, macos]
  for: [scripts, source]
  attack: "T1195.002,T1033"
  mbc: E1195.002

composite_rules:
  - id: package-exports-owned-scope-proof-label
    desc: Package payload exports owned-scope proof label
    crit: hostile
    conf: 0.93
    for: [npm, tar, package.json, javascript]
    scope: archive
    attack: T1195.002
    all:
      - id: metadata/package/description/disclosure::desc-owned-cross-package-claim
      - id: metadata/lang/javascript-features::module-exports-owned-label-string
