# A package whose published JavaScript is javascript-obfuscator output, on a
# name that only just appeared or that is being re-published in bursts.
#
# Obfuscation alone is not the verdict, and this file does not claim it is:
# a handful of long-lived commercial packages genuinely ship obfuscated dist
# output as copy protection, and they are recognizable -- they declare the
# obfuscator as a devDependency and run it from a build script, which is what
# `metadata/build/minifier::intentional-obfuscated-javascript-artifact-context`
# collects. What no copy-protection build looks like is a package name created
# this week, or one cutting three releases inside two days, that arrives
# already mangled with no obfuscation step declared anywhere in its manifest.
#
# The registry legs are corroboration supplied by a sibling `*.registry.json`
# record, so this composite is scope:outer and simply does not fire when the
# package was fetched without registry metadata. The obfuscation composites in
# objectives/anti-static/ remain the detection when it is absent.
#
# Motivating sample: mathmain / mathsbase / math-universe (npm, 2026-09) --
# a whole mathjs clone run through javascript-obfuscator, three sibling names
# published within days of each other, carrying an AES-GCM stage loader.
defaults:
  platforms: [unix, windows]
  for: [npm]
  attack: T1195.002,T1027.002
  mbc: B0032

composite_rules:
  - id: objectives/supply-chain/trojanized/package/loader::js-obfuscator-output-marker
    desc: Package carries javascript-obfuscator output
    crit: notable
    conf: 0.95
    for: [npm, javascript, typescript]
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::strong-js-obfuscation
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::decoder-loop-keyword-triad

  # Official vendor packages that ship obfuscated output as copy protection
  # (Explyt's Veai agent and Deque's axe Watcher under their own scopes;
  # BeyondClick's unscoped CLI pinned by name plus its gateway host).
  # Grouped so the rule below carries one carve-out instead of one per vendor.
  - id: vendor-obfuscated-package-context
    desc: Recognized vendor package shipping obfuscated output
    crit: exception
    for: [npm, package.json]
    conf: 0.98
    any:
      - id: well-known/app/ai/agent-runtime/veai-ai-agent::package-name
      - id: well-known/app/browser-extension/axe-devtools-watcher::package-name
      - id: well-known/app/enterprise/beyondclick-cli::cli-package

  - id: objectives/supply-chain/trojanized/package/loader::fresh-npm-package-obfuscator-output
    desc: New npm package ships obfuscator output
    crit: hostile
    conf: 0.96
    for: [npm, javascript, registry, package.json]
    scope: outer
    all:
      - id: objectives/supply-chain/trojanized/package/loader::js-obfuscator-output-marker
      - id: metadata/registry::new-package-or-release-burst
    any:
      # Obfuscation on a new name still proves nothing when the code beneath
      # it has no reach: a scraper that parses HTML and returns JSON (an
      # obfuscated adult-site scraper, 2026-10) never spawns a process, evals
      # text or decrypts a stage. The stage-loader
      # motivation needs one of those, so this leg demands the capability.
      # Keep these ordinary capabilities in their neutral homes. An OR of
      # process creation, evaluation and crypto is not a trojanized-package
      # observation in its own right.
      - id: micro-behaviors/process/create/exec/
      - id: micro-behaviors/process/create/spawn/
      - id: micro-behaviors/process/create/shell/
      - id: micro-behaviors/process/interpreter/eval/direct/
      - id: micro-behaviors/process/interpreter/eval/constructed/
      - id: micro-behaviors/crypto/symmetric/aes/
      - id: micro-behaviors/crypto/symmetric/decrypt/
      - id: micro-behaviors/crypto/decrypt::webcrypto-decrypt-source-call
      - id: micro-behaviors/crypto/decrypt::webcrypto-decrypt-call-text
      - id: micro-behaviors/crypto/encrypt::webcrypto-subtle-encrypt-call
    needs: 1
    unless:
      - id: metadata/build/minifier::intentional-obfuscated-javascript-artifact-context
      - id: well-known/app/ai/tool-server/
      - id: objectives/supply-chain/trojanized/package/loader::vendor-obfuscated-package-context
      - id: micro-behaviors/data/parse/vocabulary::labeled-attack-traffic-corpus
      - id: well-known/tool/detection/security-scanner/
