defaults:
  platforms:
  - unix
  - windows
  for:
  - npm
  attack: T1195.002,T1027.002
  mbc: B0032
composite_rules:
- id: vendor-obfuscated-package-context
  desc: Recognized vendor package shipping obfuscated output
  crit: exception
  for:
  - npm
  - package.json
  conf: 0.98
  any:
  - id: well-known/app/ai/agent-runtime/veai-ai-agent::package-name
  - id: well-known/app/browser-extension/axe-devtools-watcher::package-name
  - id: well-known/app/enterprise/beyondclick-cli::cli-package
- id: objectives/supply-chain/trojanized/package/loader::fresh-npm-package-obfuscator-output
  desc: New npm package ships obfuscator output
  crit: hostile
  conf: 0.96
  for:
  - npm
  - javascript
  - registry
  - package.json
  scope: outer
  all:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::js-obfuscator-output-marker
  - id: metadata/registry::new-package-or-release-burst
  any:
  - id: micro-behaviors/process/create/cmdlet::start-process-call
  - id: micro-behaviors/process/create/cmdlet::start-process-filepath-text
  - id: micro-behaviors/process/create/subprocess/launch::java-runtime-exec-source
  - id: metadata/lang/source/syntax/command/launch::rundll32-command-syntax-reference
  - id: micro-behaviors/process/create/hidden::node-detached-hidden-powershell-policy-bypass
  - id: micro-behaviors/process/create/shell/
  - id: micro-behaviors/process/interpreter/eval/direct
  - id: micro-behaviors/process/interpreter/eval/decoded::js-eval-url-decoded
  - id: micro-behaviors/process/interpreter/eval/decoded::js-eval-final-line-base64
  - id: micro-behaviors/process/interpreter/eval/decoded::js-eval-decode-named-helper
  - id: micro-behaviors/process/interpreter/eval/constructed/
  - id: micro-behaviors/crypto/symmetric/aes/
  - id: micro-behaviors/crypto/decrypt/initialize::decipheriv-name-literal
  - id: micro-behaviors/crypto/cipher/authentication::set-auth-tag-name-literal
  - id: micro-behaviors/crypto/provider/webcrypto::webcrypto-aes-gcm-decrypt
  - id: micro-behaviors/crypto/decrypt/transform/unspecified::javascript-decrypt-method-call
  - id: metadata/import/module::local-decrypt-helper-import
  - id: micro-behaviors/crypto/decrypt/transform/unspecified::js-decrypt-helper-call
  - id: micro-behaviors/crypto/decrypt/transform/symmetric::cryptojs-block-cipher-decrypt-call
  - id: micro-behaviors/crypto/decrypt/transform/symmetric::cryptojs-block-cipher-decrypt-text
  - id: metadata/lang/source/syntax/command/options::openssl-cli-aes-stream-decrypt
  - id: micro-behaviors/crypto/key/import::pem-key-decrypt-context
  - id: micro-behaviors/crypto/provider/webcrypto::webcrypto-decrypt-source-call
  - id: micro-behaviors/crypto/provider/webcrypto::webcrypto-decrypt-call-text
  - id: micro-behaviors/crypto/encrypt/transform::webcrypto-subtle-encrypt-call
  - id: micro-behaviors/process/create/exec/
  - id: micro-behaviors/process/create/subprocess/reference::proc-fd-path-and-execve-symbol
  - id: micro-behaviors/process/create/subprocess/reference::deno-run-execpath-flag-cooccurrence
  - id: micro-behaviors/process/create/subprocess/launch::node-child-process-fork-call
  - id: metadata/lang/source/naming/function/runtime::node-exec-file-async-call
  - id: micro-behaviors/process/interpreter/node::node-spawn-current-executable
  - id: micro-behaviors/os/handler/open::node-spawn-explorer-text
  - id: micro-behaviors/process/interpreter/runtime/native::android-linker-direct-exec
  - id: micro-behaviors/os/package-manager/run::node-npm-spawn-target
  - id: micro-behaviors/process/argument/executable::whisper-cli-spawn
  - id: micro-behaviors/process/create/variable::glib-get-text-command-argument
  - id: micro-behaviors/process/create/subprocess/launch::node-execfile-task-payload
  - id: micro-behaviors/process/interpreter/node::spawn-node-process
  - id: micro-behaviors/process/interpreter/scripting::node-spawn-osascript
  - id: micro-behaviors/process/interpreter/lua::javascript-interpreter-name
  - id: micro-behaviors/os/package-manager/run::node-npx-target
  - id: micro-behaviors/process/interpreter/python::node-spawn-python-interpreter
  - id: micro-behaviors/process/create/variable::spawn-variable-program
  - id: micro-behaviors/process/create/variable::spawn-destination-variable
  - id: micro-behaviors/process/create/variable::js-execfilesync-var-program-forwarded-argv
  - id: micro-behaviors/process/create/variable::js-execfilesync-var-program-var-arg
  - id: micro-behaviors/process/create/variable::js-execfilesync-var-program-join-arg
  - id: micro-behaviors/process/create/variable::js-execfilesync-resolved-program
  - id: micro-behaviors/process/create/subprocess/reference::javascript-generated-source-process
  - id: micro-behaviors/process/create/wmi::js-wmi-process-create
  needs: 1
  unless:
  - id: metadata/build/minifier::intentional-obfuscated-javascript-artifact-context
  - id: objectives/supply-chain/trojanized/package/loader::vendor-obfuscated-package-context
  - id: micro-behaviors/data/parse/vocabulary::labeled-attack-traffic-corpus
