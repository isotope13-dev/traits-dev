# A package that re-fetches its tool manifest from a mutable GitHub repository,
# compiles code supplied by that manifest, and reloads it on a public push
# notification gives the repository owner a code-delivery channel that
# outlives every published version. Each leg is weak alone; the composite
# requires all three in one source file.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: manifest-json-raw-github-fetch
    desc: Fetches JSON manifest from raw GitHub
    if:
      type: text
      regex: 'raw\.githubusercontent\.com/[^''"`\n]{0,80}\.json'

  - id: ntfy-push-notification-channel
    desc: References ntfy.sh push notification service
    if:
      type: text
      substr: ntfy.sh

composite_rules:
  - id: objectives/supply-chain/trojanized/package/loader::remote-manifest-code-loader
    desc: Compiles code from a remotely refreshed GitHub tool manifest
    crit: hostile
    conf: 0.9
    attack: T1105,T1195.002
    scope: file
    all:
      - id: manifest-json-raw-github-fetch
      - id: micro-behaviors/metaprogramming/generation/function::js-function-ctor-call-text
      - id: ntfy-push-notification-channel
