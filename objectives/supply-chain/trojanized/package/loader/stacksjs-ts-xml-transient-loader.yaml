# @stacksjs/ts-xml@0.1.2 runs undeclared `bunx git-hooks` from postinstall.
# Keep the package identity, affected version, and install command as an IOC.
defaults:
  for: [package.json]
  platforms: [unix, windows]
  attack: T1195.002

traits:
  - id: stacksjs-ts-xml-transient-install-loader
    desc: Runs bunx git-hooks from postinstall
    crit: notable
    conf: 0.96
    if:
      type: value
      path: scripts.postinstall
      exact: bunx git-hooks

  - id: stacksjs-ts-xml-package-name
    desc: Names the affected StacksJS ts-xml package
    if:
      type: value
      path: name
      exact: '@stacksjs/ts-xml'

  - id: stacksjs-ts-xml-affected-version
    desc: Declares the affected 0.1.2 release
    if:
      type: value
      path: version
      exact: 0.1.2

composite_rules:
  - id: stacksjs-ts-xml-affected-release
    desc: Identifies the affected ts-xml release
    crit: notable
    for: [npm, package.json]
    scope: package
    all:
      - id: stacksjs-ts-xml-package-name
      - id: stacksjs-ts-xml-affected-version

  - id: stacksjs-ts-xml-transient-install-loader-package
    desc: Affected ts-xml release runs transient git-hooks installer
    crit: hostile
    conf: 0.96
    for: [npm, package.json]
    scope: package
    all:
      - id: stacksjs-ts-xml-transient-install-loader
      - id: stacksjs-ts-xml-affected-release
