# A published npm archive that downloads a GitHub release executable, marks
# it executable, spawns a computed program path, and also hands off to
# unpinned `npx -y` is a loader. The package/repository name mismatch keeps
# some ordinary release-binary wrappers out. A name mismatch alone does not
# establish compromise: legitimate CLI packages can use a suffix or a name
# different from their repository. Stronger loader variants remain hostile.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript, typescript]
  attack: T1195.002,T1105,T1059.007

composite_rules:
  - id: node-release-chmod-spawn
    desc: Release URL, executable chmod, and computed spawn in one file
    crit: component
    for: [javascript, typescript]
    scope: file
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/variable::spawn-variable-program

  # The staged binary is often spawned by its literal relative path
  # (`./bin/tool`) rather than a computed one, so the computed-spawn component
  # above misses it. The npx -y hand-off stays in the same file as the staging.
  - id: node-release-chmod-literal-spawn-npx
    desc: Release URL, executable chmod, spawn and npx -y in one file
    crit: component
    for: [javascript, typescript]
    scope: file
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/exec::node-spawnsync-call
      - id: micro-behaviors/os/package-manager/run::node-spawn-npx-yes-package

  # Home-directory staging belongs to the downloader file itself. Requiring
  # the reference in the same file keeps a large, hardened resolver whose
  # cache paths are centralized elsewhere (for example a `cache-paths.js`
  # helper) from escalating on a cross-file coincidence.
  - id: node-release-chmod-spawn-homedir
    desc: Release URL, chmod, spawn and home reference in one file
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    scope: file
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/variable::spawn-variable-program
    any:
      - id: micro-behaviors/fs/path/user-directory::home-directory-reference-or-resolution
      - id: micro-behaviors/process/identity/query/principal::os-homedir-call
    needs: 1

  - id: npm-release-binary-literal-spawn-npx-loader
    desc: Release binary launcher falls back to npx -y under a mismatched repo
    crit: hostile
    conf: 0.93
    scope: archive
    all:
      - id: node-release-chmod-literal-spawn-npx
      - id: metadata/package/repository::npm-name-repo-mismatch
    unless:
      - id: well-known/tool/development/cli/agentdesk::reviewed-release-wrapper
      - id: metadata/path/directory::test-directory-component

  - id: npm-release-binary-npx-fallback-loader
    desc: Release binary chmod co-occurs with computed spawn and npx -y
    crit: hostile
    conf: 0.94
    scope: archive
    all:
      - id: node-release-chmod-spawn
      - id: micro-behaviors/os/package-manager/run::node-spawn-npx-yes-package
      - id: metadata/package/repository::npm-name-repo-mismatch
    unless:
      - id: metadata/path/directory::test-directory-component

  - id: npm-postinstall-unverified-binary-loader
    desc: Repo-less npm hook downloads and launches a binary
    crit: hostile
    conf: 0.94
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/package/entrypoint/command::bin-field-declared
      - id: metadata/package/repository::no-repo-with-hooks
      - id: micro-behaviors/data/archive/extract/tar::node-remote-native-archive-extraction
      - id: micro-behaviors/process/create/variable::spawn-variable-program
    unless:
      - id: well-known/tool/development/cli/agentdesk::reviewed-release-wrapper
      - id: well-known/app/ai/coding-agent/reason-machines::reason-machines-platform-npm-release-context
      - id: metadata/path/directory::test-directory-component

  - id: npm-release-binary-homedir-loader
    desc: Release download and launch with home reference and package-name mismatch
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: node-release-chmod-spawn-homedir
      - id: metadata/package/repository::npm-name-repo-mismatch
    unless:
      - id: well-known/tool/development/cli/agentdesk::reviewed-release-wrapper
      - id: well-known/app/ai/coding-agent/reason-machines::reason-machines-platform-npm-release-context
      - id: metadata/path/directory::test-directory-component

  - id: npm-release-binary-mismatched-repo-loader
    desc: Release download and launch with package-name mismatch
    crit: notable
    conf: 0.94
    scope: archive
    all:
      - id: node-release-chmod-spawn
      - id: metadata/package/repository::npm-name-repo-mismatch
    unless:
      - id: well-known/tool/development/cli/agentdesk::reviewed-release-wrapper
      - id: well-known/app/ai/coding-agent/reason-machines::reason-machines-platform-npm-release-context
      - id: metadata/path/directory::test-directory-component

  - id: npm-release-binary-mismatched-loader
    desc: Mismatched npm package downloads release binary and executes it
    crit: suspicious
    conf: 0.94
    scope: archive
    any:
      - id: objectives/supply-chain/trojanized/package/loader::npm-release-binary-npx-fallback-loader
      - id: objectives/supply-chain/trojanized/package/loader::npm-release-binary-literal-spawn-npx-loader
      - id: objectives/supply-chain/trojanized/package/loader::npm-release-binary-homedir-loader
      - id: objectives/supply-chain/trojanized/package/loader::npm-release-binary-mismatched-repo-loader
      - id: objectives/supply-chain/trojanized/installer::npm-bin-release-binary-mismatched-loader
