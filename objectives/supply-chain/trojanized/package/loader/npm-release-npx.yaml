# A published npm archive that downloads a GitHub release executable, marks
# it executable, spawns a computed program path, and also hands off to
# unpinned `npx -y` is a loader. The package/repository name mismatch keeps
# ordinary release-binary wrappers (esbuild, biome) out: those keep a name
# that agrees with the repository they download from.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  attack: T1195.002,T1105,T1059.007

composite_rules:
  - id: npm-release-binary-npx-fallback-loader
    desc: Release binary chmod co-occurs with computed spawn and npx -y
    crit: hostile
    conf: 0.94
    scope: archive
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/exec::spawn-variable-program
      - id: micro-behaviors/process/create/shell/package::node-spawn-npx-yes-package
      - id: metadata/package/repository::npm-name-repo-mismatch
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/path::test-directory-component
