# A published npm archive that downloads a GitHub release executable, marks
# it executable, spawns a computed program path, and also hands off to
# unpinned `npx -y` is a loader. The package/repository name mismatch keeps
# ordinary release-binary wrappers (esbuild, biome) out: those keep a name
# that agrees with the repository they download from.
# The mismatch compares the package name to its declared repository name.
# Reviewed release wrappers use a narrow exception; unrecognized wrappers
# retain the hostile detection.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  attack: T1195.002,T1105,T1059.007

composite_rules:
  - id: npm-release-binary-npx-fallback-loader
    desc: Release binary chmod co-occurs with computed spawn and npx -y
    crit: hostile
    conf: 0.94
    scope: archive
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/variable::spawn-variable-program
      - id: micro-behaviors/os/package-manager/run::node-spawn-npx-yes-package
      - id: metadata/package/repository::npm-name-repo-mismatch
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: npm-release-binary-homedir-loader
    desc: Release download and launch with home reference and package-name mismatch
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: metadata/package/repository::npm-name-repo-mismatch
      - id: micro-behaviors/process/create/variable::spawn-variable-program
    any:
      - id: micro-behaviors/fs/path/user-directory::home-directory-reference-or-resolution
      - id: micro-behaviors/process/identity/query/principal::os-homedir-call
    needs: 1
    unless:
      - id: well-known/tool/development/cli/agentdesk::reviewed-release-wrapper
      - id: metadata/path/directory::test-directory-component

  - id: npm-release-binary-mismatched-repo-loader
    desc: Release download and launch with package-name mismatch
    crit: hostile
    conf: 0.94
    scope: archive
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/variable::spawn-variable-program
      - id: metadata/package/repository::npm-name-repo-mismatch
    unless:
      - id: well-known/tool/development/cli/agentdesk::reviewed-release-wrapper
      - id: metadata/path/directory::test-directory-component

  - id: npm-release-binary-mismatched-loader
    desc: Mismatched npm package downloads release binary and executes it
    crit: suspicious
    conf: 0.94
    scope: archive
    any:
      - id: objectives/supply-chain/trojanized/package/loader::npm-release-binary-npx-fallback-loader
      - id: objectives/supply-chain/trojanized/package/loader::npm-release-binary-homedir-loader
      - id: objectives/supply-chain/trojanized/package/loader::npm-release-binary-mismatched-repo-loader
      - id: objectives/supply-chain/trojanized/installer::npm-bin-release-binary-mismatched-loader
