# A bundled native launcher that is both import-triggered and configured to
# suppress its child window is a supply-chain payload, not a library helper.
defaults:
  platforms: [windows]
  for: [whl]
  attack: T1195.002,T1059.006,T1564.003

composite_rules:
  - id: python-wheel-hidden-import-launcher
    desc: Wheel import silently launches a bundled executable
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/process/create/subprocess::popen-ast
      - id: micro-behaviors/process/create/flags::python-create-no-window-getattr
      - id: micro-behaviors/os/sysinfo/platform/runtime::python-windows-version-call
      - id: metadata/package/files/included::exe-extension-basename
    unless:
      # This application bundle contains a zero-byte wheel cache member and
      # many unrelated Python runtime files; do not pool them as one wheel.
      - id: well-known/app/ai/media/comfyui::comfyui-portable-archive-context
