# @petitcode/eb-retry (MAL-2026-6310): wshu.net retry-wrapper trojan. Full
# releases pair a working retry helper with lib/warmup.js (postinstall +
# require-time stealer); corpus specimens may ship only README and typings.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1036,T1041
  for: [npm, tar, zip]

traits:
  - id: npm-basename-petitcode-eb-retry-package
    desc: Basename matches @petitcode/eb-retry tarball
    crit: notable
    conf: 0.98
    for: [npm, tar]
    if:
      type: value
      path: file.basename
      regex: '^@petitcode-eb-retry-'

composite_rules:
  - id: petitcode-eb-retry-manifestless-readme-facade
    desc: Manifestless @petitcode/eb-retry README facade
    crit: hostile
    conf: 0.98
    scope: archive
    for: [npm, tar, zip, markdown, typescript]
    all:
      - id: metadata/package/entrypoint::runtime-shipped-without-publish-manifest
      - id: metadata/package/documentation/package-metadata::readme-heading-petitcode-eb-retry
      - id: objectives/supply-chain/impersonation/npm-ecosystem::npm-basename-petitcode-eb-retry-package

  - id: petitcode-eb-retry-warmup-postinstall-dropper
    desc: petitcode eb-retry postinstall runs lib warmup dropper
    crit: hostile
    conf: 0.99
    scope: archive
    for: [npm, tar, zip, package.json, javascript]
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-lib-warmup-js
      - id: metadata/package/files/included::npm-archive-member-lib-warmup-js
      - id: objectives/supply-chain/impersonation/npm-ecosystem::npm-basename-petitcode-eb-retry-package
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime
      - id: metadata/file/line::javascript-line-over-20000

  - id: petitcode-eb-retry-manifestless-typings-facade
    desc: Manifestless petitcode eb-retry typings-only facade
    crit: hostile
    conf: 0.97
    scope: archive
    for: [npm, tar, zip, typescript]
    all:
      - id: metadata/package/entrypoint::runtime-shipped-without-publish-manifest
      - id: metadata/package/files/runtime::typescript-retry-bail-attempt-callback-signature
      - id: objectives/supply-chain/impersonation/npm-ecosystem::npm-basename-petitcode-eb-retry-package
