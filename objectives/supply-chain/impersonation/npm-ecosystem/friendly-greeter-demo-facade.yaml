# friendly-greeter-demo (MAL-2026-5704): demo greeter facade with hidden HTTP
# beacon RCE on install and require; corpus builds may ship only package/test.js.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1071.001,T1059.007
  for: [npm, tar, zip, javascript]

traits:
  - id: npm-basename-friendly-greeter-demo-package
    desc: Basename matches friendly-greeter-demo tarball
    crit: notable
    conf: 0.98
    for: [npm, tar]
    if:
      type: value
      path: file.basename
      regex: '^friendly-greeter-demo-'

  - id: greeter-demo-test-api-surface
    desc: Greeter demo test references greet APIs
    crit: notable
    conf: 0.97
    for: [javascript]
    if:
      type: text
      substr: greetByTime

  - id: greeter-demo-test-requires-index-js
    desc: Greeter demo test requires local index.js
    crit: notable
    conf: 0.96
    for: [javascript]
    if:
      type: text
      substr: require("./index.js")

composite_rules:
  - id: friendly-greeter-demo-stripped-test-facade
    desc: friendly-greeter-demo ships greeter test only
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: objectives/supply-chain/impersonation/npm-ecosystem::npm-basename-friendly-greeter-demo-package
      - id: objectives/supply-chain/impersonation/npm-ecosystem::greeter-demo-test-api-surface
      - id: objectives/supply-chain/impersonation/npm-ecosystem::greeter-demo-test-requires-index-js
      - id: metadata/package/files/archive-member::archive-js-member
    unless:
      - id: metadata/package/files/included::npm-package-manifest-member

  - id: friendly-greeter-demo-manifestless-greeter-test
    desc: Manifestless friendly-greeter-demo greeter test
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: objectives/supply-chain/impersonation/npm-ecosystem::npm-basename-friendly-greeter-demo-package
      - id: objectives/supply-chain/impersonation/npm-ecosystem::greeter-demo-test-api-surface
      - id: objectives/supply-chain/impersonation/npm-ecosystem::greeter-demo-test-requires-index-js
    unless:
      - id: metadata/package/files/included::npm-package-manifest-member
