# ollama-helpers (OSV MAL-2026-6581): impersonates the Ollama ecosystem, often
# ships postinstall credential harvesting in full releases, and may publish a
# manifest-stripped source facade like the corpus specimen.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1036,T1041
  for: [npm, tar, zip]

composite_rules:
  - id: ollama-helpers-manifestless-ecosystem-facade
    desc: Manifestless archive mimics Ollama helper library
    crit: hostile
    conf: 0.97
    scope: archive
    for: [npm, tar, zip, markdown, typescript, javascript]
    all:
      - id: metadata/package/entrypoint::runtime-shipped-without-publish-manifest
      - id: metadata/package/documentation/package-metadata::readme-official-ollama-package-gap-claim
      - id: metadata/package/documentation/package-metadata::readme-install-telemetry-check-claim

  - id: ollama-helpers-hollow-barrel-index
    desc: Ollama helpers index re-exports absent modules
    crit: hostile
    conf: 0.96
    scope: archive
    for: [npm, tar, zip, typescript, javascript]
    all:
      - id: metadata/package/entrypoint::runtime-shipped-without-publish-manifest
      - id: micro-behaviors/data/control-flow/module-exec::ts-relative-import-connection-pool
      - id: micro-behaviors/data/control-flow/module-exec::ts-relative-import-health-check
