defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85
  attack: T1195.002

composite_rules:
- id: depconf-exfil
  desc: Package description claims dependency confusion with Unity namespace
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/package/description/disclosure::npm-description-dependency-confusion-variants
  - id: metadata/package/name/identity::npm-com-unity-namespace-outside-upm
  any:
  - id: metadata/package/scripts/command::preinstall-inline-node-const-reference
  - id: micro-behaviors/communications/http/request/inline::js-https-request
  - id: micro-behaviors/communications/url/host/oob/package::js-oastify-host
  - id: micro-behaviors/data/encode/url::js-querystring-stringify
  - id: metadata/package/scripts/reference::js-require-package-json
  - id: micro-behaviors/os/sysinfo/platform/branch::js-arch-x64-check
- id: unity-oob-callback
  desc: Unity-prefixed package references an OASTify host
  crit: suspicious
  conf: 0.93
  all:
  - id: metadata/package/name/identity::npm-com-unity-namespace-outside-upm
  - id: micro-behaviors/communications/url/host/oob/package::js-oastify-host
