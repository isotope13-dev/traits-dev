# react-check-error typosquat (MAL-2026-6341): stolen chai/check-error LICENSE
# in a manifestless hollow tarball; full releases add HTTPS JSON RCE on import.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1036
  for: [npm, tar, zip]

traits:
  - id: npm-basename-react-check-error-package
    desc: Basename typosquats react-check-error
    crit: notable
    conf: 0.96
    for: [npm, tar]
    if:
      type: value
      path: file.basename
      regex: '^react-check-error-'

composite_rules:
  - id: npm-chai-check-error-license-hollow-tarball
    desc: Hollow npm tarball ships chai check-error license
    crit: hostile
    conf: 0.97
    scope: archive
    for: [npm, tar, zip, text]
    all:
      - id: metadata/package/files/included::npm-license-archive-member
      - id: metadata/package/license::chai-check-error-license-prose
      - id: metadata/package/license::license-mentions-jake-luer
    unless:
      - id: metadata/package/files/included::npm-package-manifest-member
      - id: metadata/package/files/included::npm-runtime-code-member

  - id: react-check-error-chai-hollow-tarball
    desc: react-check-error hollow chai license tarball
    crit: hostile
    conf: 0.98
    scope: archive
    for: [npm, tar, zip, text]
    all:
      - id: metadata/package/files/included::npm-license-archive-member
      - id: metadata/package/license::chai-check-error-license-prose
      - id: objectives/supply-chain/impersonation/npm-ecosystem::npm-basename-react-check-error-package
    unless:
      - id: metadata/package/files/included::npm-package-manifest-member
      - id: metadata/package/files/included::npm-runtime-code-member
