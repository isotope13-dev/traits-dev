# The Signal protocol library is the trust root of every WhatsApp client
# library: it holds session and identity keys. Baileys and its forks bind the
# `libsignal` dependency name through an npm alias, and the canonical target is
# @adiwajshing/libsignal. Repointing that name at any other scope silently
# swaps the crypto core every downstream chat message is encrypted with —
# a move only the publisher benefits from. The alias alone stays notable
# (the target package may be an ordinary port); objective composites combine
# it with library identity or install hooks to infer the swap's purpose.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json]
  attack: T1195.002

traits:
  - id: libsignal-alias-noncanonical-scope
    desc: libsignal npm alias targets non-upstream package
    crit: notable
    conf: 0.95
    if:
      type: value
      path: dependencies.libsignal
      regex: '^npm:'
      not:
        - regex: '^npm:@adiwajshing/'
        - regex: '^npm:@whiskeysockets/libsignal'

composite_rules:
  - id: whatsapp-client-libsignal-dependency-swap
    desc: WhatsApp client repoints libsignal npm alias
    crit: hostile
    conf: 0.97
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: well-known/lib/network/baileys::baileys-library-identity
      - id: libsignal-alias-noncanonical-scope
