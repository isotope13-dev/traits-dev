# The confirmed @depup/memfs sample redirects the upstream package through a
# coordinated @jsonjoy.com filesystem dependency family. The package-level
# identity and DepUp provenance keep this from flagging ordinary JSONJoy users.
defaults:
  platforms: [unix, windows]
  for: [package.json, archives]
  attack: T1195.002
  mbc: E1195.002

traits:
  - id: depup-original-memfs-package
    desc: DepUp records memfs as the original package
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: depup.originalPackage
      exact: memfs

  - id: dep-jsonjoy-fs-node
    desc: Declares JSONJoy fs-node
    crit: notable
    conf: 0.95
    for: [package.json]
    if:
      type: value
      path: dependencies["@jsonjoy.com/fs-node"]
      exists: true

  - id: dep-jsonjoy-fs-core
    desc: Declares JSONJoy fs-core
    crit: notable
    conf: 0.95
    for: [package.json]
    if:
      type: value
      path: dependencies["@jsonjoy.com/fs-core"]
      exists: true

  - id: dep-jsonjoy-fs-snapshot
    desc: Declares JSONJoy fs-snapshot
    crit: notable
    conf: 0.95
    for: [package.json]
    if:
      type: value
      path: dependencies["@jsonjoy.com/fs-snapshot"]
      exists: true

composite_rules:
  - id: jsonjoy-fs-dependency-cluster
    desc: JSONJoy filesystem dependency cluster
    crit: notable
    conf: 0.98
    for: [package.json]
    all:
      - id: dep-jsonjoy-fs-node
      - id: dep-jsonjoy-fs-core
      - id: dep-jsonjoy-fs-snapshot

  - id: depup-memfs-dependency-chain-redirection
    desc: DepUp memfs redirects through JSONJoy filesystem packages
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: depup-original-memfs-package
      - id: jsonjoy-fs-dependency-cluster
      - id: objectives/supply-chain/impersonation/package/manifest::depup-upstream-identity-republication
