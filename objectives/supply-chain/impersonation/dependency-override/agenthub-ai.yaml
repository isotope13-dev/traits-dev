# AgentHub redirects every platform-specific native Claude SDK package to an
# unrelated empty npm package.  This is a package-level supply-chain behavior,
# independent of the daemon's runtime backdoor behavior.
defaults:
  platforms: [unix, windows]
  for: [package.json, archives]
  attack: T1195.002

traits:
  - id: agenthub-empty-native-sdk-override
    desc: AgentHub redirects native SDK to empty package
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: text
      substr: npm:agenthub-empty@1.0.0

composite_rules:
  - id: agenthub-native-sdk-redirection
    desc: AgentHub package replaces native Claude SDK dependencies
    crit: hostile
    conf: 0.995
    scope: outer
    all:
      - id: metadata/package/manifest/entrypoint::agenthub-cli-entrypoint
      - id: agenthub-empty-native-sdk-override
