# A named Python dependency whose download is pinned to a file-sharing service
# instead of a package index.
#
# Package indexes bind a name+version to an immutable artifact with a published
# digest, and their contents are retained, mirrored and scannable. A paste-style
# file host binds nothing: the uploader can replace or expire the object at any
# time, the filename is a random token, and nothing ties the bytes to the
# package they claim to be. Substituting one for the other is how an installer
# gets an unreviewed artifact onto a machine while its requirement list still
# reads like an ordinary pin — the redistribution channel is the attack.
#
# The near_bytes window keeps both legs on the same URL, so a project that
# merely mentions a file host somewhere and a wheel URL elsewhere does not match.
defaults:
  platforms: [unix, windows, android]
  for: [scripts, binaries]
  attack: T1195.002
  mbc: B0023

composite_rules:
  - id: python-dependency-from-file-host
    desc: Python wheel pinned to a file-sharing host
    crit: hostile
    conf: 0.96
    near_bytes: 96
    all:
      - id: micro-behaviors/communications/http/download/package::python-wheel-download-url
      - id: micro-behaviors/communications/http/services/file-hosting
