# Republished TypeStrong/ts-node trees under a variant package name
# (ts-node-utils, …) that inject unused runtime dependencies used as malware
# drop sites. The official package never declares these coordinates.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002
  mbc: E1195.002

traits:
  - id: web-api-node-runtime-dependency
    desc: Declares web-api-node runtime dependency
    crit: notable
    conf: 0.95
    if:
      type: value
      path: dependencies.web-api-node
      exists: true

  - id: api-node-utils-runtime-dependency
    desc: Declares api-node-utils runtime dependency
    crit: notable
    conf: 0.95
    if:
      type: value
      path: dependencies.api-node-utils
      exists: true

  - id: api-ts-utils-runtime-dependency
    desc: Declares api-ts-utils runtime dependency
    crit: notable
    conf: 0.95
    if:
      type: value
      path: dependencies.api-ts-utils
      exists: true

composite_rules:
  - id: ts-node-clone-injected-payload-deps
    desc: ts-node clone declares clustered payload deps
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/lib/development/ts-node::ts-node-variant-claims-official-repository
      - id: api-ts-utils-runtime-dependency
    any:
      - id: web-api-node-runtime-dependency
      - id: api-node-utils-runtime-dependency

  - id: ts-node-clone-bin-with-injected-deps
    desc: Variant ts-node bin declares clustered payload deps
    crit: hostile
    conf: 0.98
    all:
      - id: well-known/lib/development/ts-node::ts-node-bin-with-variant-package-name
      - id: api-ts-utils-runtime-dependency
    any:
      - id: web-api-node-runtime-dependency
      - id: api-node-utils-runtime-dependency
