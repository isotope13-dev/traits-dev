# Copycat republication of the `events` npm module.
#
# `events` is the ES5 EventEmitter shim bundlers inject for browser builds and
# sits in the npm top tier by install count, so it is a standing squat target.
# The cheapest squat is mechanical: take the published tarball, rewrite the
# identity fields in package.json, find/replace the module name through the
# README, publish. The shipped code, changelog, licence and CI config are the
# original project's, untouched.
#
# Detection is the same shape the winston / iconify / pino / cookie-signature
# markers in this directory already use: match the ORIGINAL project's own
# artefacts, then exclude the original by name. That generalises to every clone
# of this upstream instead of convicting one squatter's chosen name.
#
# Verdict stays suspicious. A verbatim republish under a new name is identity
# deception, but the shipped bytes execute nothing hostile, and a hard fork of
# an MIT project can leave exactly these traces; the registry-side evidence
# that would separate the two (fresh publisher, no release history) is not in
# the tarball.
defaults:
  platforms: [unix, windows]
  attack: T1195.002
  mbc: E1195.002
  for: [npm]

traits:
  - id: events-js-main-entrypoint
    desc: Package main entrypoint is events.js
    crit: component
    conf: 0.9
    for: [package.json]
    if:
      type: value
      path: main
      regex: '(^|[./])events\.js$'

composite_rules:
  # The shim is the package's own entrypoint, not a vendored dependency: a
  # tarball that merely bundles `events` under node_modules/ declares some
  # other `main`, so it does not reach this rule.
  - id: events-shim-republished-under-new-name
    desc: Ships the events shim as its entrypoint under another name
    crit: suspicious
    conf: 0.94
    scope: archive
    all:
      - id: events-js-main-entrypoint
      - id: well-known/lib/core/node-events::node-events-module-implementation
    unless:
      - id: well-known/lib/core/node-events::package-name
