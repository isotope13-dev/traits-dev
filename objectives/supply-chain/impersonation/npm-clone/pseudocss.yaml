# selparsecss-selector copies the PostCSS parser purpose and adds the unrelated
# bytenode runtime. The conjunction detects the PseudoCSS lure while remaining
# useful for rebuilt releases whose tarball digest changes.
defaults:
  platforms: [unix, windows]
  for: [pkginfo]
  attack: T1195.002

composite_rules:
  - id: pseudocss-bytecode-parser-impersonation
    desc: PseudoCSS package impersonates PostCSS parser
    crit: hostile
    conf: 0.999
    all:
      - id: metadata/package/name/convention::selparsecss-selector-name
      - id: metadata/package/description::css-selector-parser-claim
      - id: metadata/package/dependencies/named::bytenode-runtime
      - id: metadata/package/publishing::npm-registry-dist-tarball-url
