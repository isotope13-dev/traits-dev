# A package that installs from a lookalike package index when it is imported.
#
# The trojanized top.gg SDK fetched from `pypihosted.org`, a domain chosen to
# read as `pypi.org` to anyone glancing at a requirements line or a build log.
#
# The install mechanism is already stated in execution/autoinstall: a module
# that shells out to pip while it is being imported. This states the other
# half, which is a different act. Running pip at import time is reckless;
# pointing it at a domain built to be mistaken for the real index is
# deliberate, and it is the part that makes the package a supply-chain attack
# rather than a badly written installer. Whoever controls that domain controls
# what every importer executes, indefinitely.
defaults:
  platforms: [unix, windows]
  for: [python, text]
  attack: T1195.002,T1583.001
  mbc: B0024

composite_rules:
  - id: import-time-install-from-lookalike-index
    desc: Import-time install from a fake index
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/execution/autoinstall/pip::import-time-remote-pip-install
      - id: objectives/supply-chain/impersonation/typosquat::pypihosted-domain
    unless:
      - id: metadata/package/testing/
