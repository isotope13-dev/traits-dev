defaults:
  platforms: [unix, windows]
  crit: suspicious
  attack: T1195.002
traits:
  - id: go-func-readpassword-shadow
    desc: "ReadPassword func calling term.ReadPassword"
    crit: component
    conf: 0.95
    for: [go]
    if:
      type: text
      regex: func ReadPassword\s*\(.{0,50}\)[^{]{0,100}\{[\s\S]{0,800}term\.ReadPassword
  - id: py-func-getpass-shadow
    desc: getpass function calling real getpass
    crit: suspicious
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: def getpass\s*\(.{0,30}\):[\s\S]{0,300}getpass\.getpass\s*\(
  - id: py-func-input-shadow
    desc: input function calling builtin input
    crit: suspicious
    conf: 0.85
    for: [python]
    if:
      type: text
      regex: def input\s*\(.{0,30}\):[\s\S]{0,300}(__builtins__|builtins)\.input\s*\(
  - id: py-func-print-shadow
    desc: print function with network call
    crit: suspicious
    conf: 0.85
    for: [python]
    if:
      type: text
      regex: def print\s*\(.{0,30}\):[\s\S]{0,300}(requests\.|urllib|socket)
  - id: js-console-log-shadow
    desc: console.log redefined with network call
    crit: suspicious
    conf: 0.85
    for: [javascript, typescript]
    if:
      # Keep the network check inside the same assignment AST node. A raw
      # source regex can cross an unrelated statement and pair a harmless
      # console.log replacement with a later fetch in a test or harness.
      type: tree-sitter
      kind: assignment
      regex: '(?is)console\.log\s*=\s*[\s\S]{0,800}\b(fetch|axios|http\.request)\s*\('
  - id: ruby-gets-shadow
    desc: gets method redefined with I/O
    crit: suspicious
    conf: 0.8
    for: [ruby]
    if:
      type: text
      regex: def gets[\s\S]{0,300}(Net::HTTP|open\s*\(|File\.write)
composite_rules:
  - id: go-readpassword-with-io
    desc: Go ReadPassword wrapper with nearby I/O
    crit: suspicious
    conf: 0.95
    for: [go]
    near_bytes: 1200
    all:
      - id: go-func-readpassword-shadow
    any:
      - id: objectives/credential-access/capture/input::file-write-operation
      - id: objectives/credential-access/capture/input::http-exfil-operation

  - id: go-credential-shadow
    desc: Go credential function shadowing
    crit: hostile
    conf: 0.95
    attack: T1056
    mbc: E1056
    all:
      - id: go-func-readpassword-shadow
      - id: go-readpassword-with-io
  - id: py-io-operation
    desc: Python I/O operation
    crit: component
    conf: 0.6
    any:
      - id: micro-behaviors/communications/http/lib/requests
      - id: micro-behaviors/fs/file/open::write-append-create-mode
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
  - id: py-getpass-with-io
    desc: getpass with file/network I/O
    crit: suspicious
    conf: 0.85
    all:
      - id: py-func-getpass-shadow
      - id: py-io-operation
  # Unlike getpass() -- which exists specifically for password entry --
  # input() is a generic prompt primitive that countless legitimate libraries
  # wrap: readline integration, stderr-routed prompts, test/mocking harnesses,
  # colorized CLI prompts. aioconsole's rlwrap.py defines exactly this shape
  # (`def input(...): ... builtins.input(...)`, with a ctypes PyOS_Readline
  # branch for stderr prompting) purely to support an async REPL wrapping a
  # subprocess -- no capture, storage, or transmission of the value anywhere.
  # Require actual I/O/exfil evidence alongside the shadow before crediting
  # it as credential theft, the same bar already used for getpass above.
  - id: py-input-with-io
    desc: input shadow with file/network I/O
    crit: suspicious
    conf: 0.85
    all:
      - id: py-func-input-shadow
      - id: py-io-operation
  - id: python-credential-shadow
    desc: Python credential function shadowing
    crit: hostile
    conf: 0.95
    attack: T1056
    mbc: E1056
    any:
      - id: py-func-getpass-shadow
      - id: py-getpass-with-io
      - id: py-input-with-io
  - id: js-crypto-func-def
    desc: JavaScript crypto-named function definition
    crit: suspicious
    conf: 0.6
    any:
      - id: micro-behaviors/crypto/library/keyword::js-encrypt-func-def
      - id: micro-behaviors/crypto/library/keyword::js-decrypt-func-def
    unless:
      - id: metadata/library/structure/
      - id: metadata/package/quality/benign-context::benign-trojanized-fp-context
      - id: well-known/app/publishing/wordpress-plugins::wordpress-plugin-path-downloads
      - id: metadata/package/quality/benign-context::translator-member-path
      - id: metadata/package/quality/benign-context::tencent-translation-api-auth
  - id: js-crypto-shadow
    desc: Crypto-named function with nearby HTTP POST
    crit: suspicious
    conf: 0.8
    scope: leaf
    near_bytes: 4096
    all:
      - id: js-crypto-func-def
    any:
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/communications/http/post::http-request-post
    unless:
      - id: metadata/library/structure/
      - id: metadata/package/quality/benign-context::benign-trojanized-fp-context
      - id: well-known/app/development/vscode-extension/tencent-codebuddy::codebuddy-marker
      - id: metadata/package/quality/benign-context::translator-member-path
      - id: metadata/package/quality/benign-context::tencent-translation-api-auth
  - id: javascript-function-shadow
    desc: JavaScript function shadowing
    crit: suspicious
    conf: 0.85
    any:
      - id: js-console-log-shadow
      - id: js-crypto-shadow
    unless:
      - id: metadata/library/structure/
      - id: metadata/package/files/dependency::node-modules-path
      - id: well-known/tool/development/projen::package-context
      - id: well-known/lib/development/system::system-browser-loader-bundle
      - id: well-known/lib/core/requirejs::requirejs-browser-xhr-loader
      - id: well-known/lib/core/requirejs::requirejs-library-context
      - id: well-known/lib/web/capacitor::capacitor-cordova-runtime-context
      - id: well-known/lib/core/import-in-the-middle::import-in-the-middle-library-context
      - id: well-known/lib/runtime/napi-rs::napi-rs-require-reassignment-context
  - id: function-shadow-attack
    desc: Function shadowing supply chain attack
    crit: hostile
    conf: 0.95
    mbc: E1056
    any:
      - id: go-credential-shadow
      - id: python-credential-shadow
      - id: javascript-function-shadow
      - id: ruby-gets-shadow
    unless:
      - id: well-known/tool/development/projen::package-context
      - id: well-known/lib/core/import-in-the-middle::import-in-the-middle-library-context
      - id: well-known/lib/core/import-in-the-middle::import-in-the-middle-loader-source
      - id: well-known/lib/runtime/napi-rs::napi-rs-require-reassignment-context
