defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
  attack: T1195.002
traits:
- id: py-func-getpass-shadow
  desc: getpass function calling real getpass
  crit: suspicious
  conf: 0.95
  for:
  - python
  if:
    type: text
    regex: (?m)^def getpass\s*\(.{0,30}\):[\s\S]{0,300}getpass\.getpass\s*\(
- id: py-func-print-shadow
  desc: print function with network call
  crit: suspicious
  conf: 0.85
  for:
  - python
  if:
    type: text
    regex: def print\s*\(.{0,30}\):[\s\S]{0,300}(requests\.|urllib|socket)
- id: js-console-log-shadow
  desc: console.log redefined with network call
  crit: suspicious
  conf: 0.85
  for:
  - javascript
  - typescript
  if:
    type: tree-sitter
    kind: assignment
    regex: (?is)console\.log\s*=\s*[\s\S]{0,800}\b(fetch|axios|http\.request)\s*\(
- id: ruby-gets-shadow
  desc: gets method redefined with I/O
  crit: suspicious
  conf: 0.8
  for:
  - ruby
  unless:
  - id: well-known/tool/development/build/homebrew/
  if:
    type: text
    regex: def gets[\s\S]{0,300}(Net::HTTP|File\.write|(^|[^.\w])open\s*\()
composite_rules:
- id: py-io-operation
  desc: Python I/O operation
  crit: component
  conf: 0.6
  any:
  - id: micro-behaviors/communications/http/get::requests-get
  - id: micro-behaviors/communications/http/lib/requests::requests-request
  - id: micro-behaviors/communications/http/lib/requests::requests-head
  - id: micro-behaviors/communications/http/lib/requests::requests-put
  - id: micro-behaviors/communications/http/delete::requests-delete
  - id: micro-behaviors/communications/http/post::requests-post
  - id: micro-behaviors/fs/file/open::write-append-create-mode
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
- id: py-getpass-with-io
  desc: getpass with file/network I/O
  crit: suspicious
  conf: 0.85
  all:
  - id: py-func-getpass-shadow
  - id: py-io-operation
- id: py-input-with-io
  desc: input shadow with file/network I/O
  crit: suspicious
  conf: 0.85
  all:
  - id: micro-behaviors/ui/dialog/prompt::python-builtins-input-wrapper
  - id: py-io-operation
- id: python-credential-shadow
  desc: Python credential function shadowing
  crit: suspicious
  conf: 0.95
  attack: T1056
  mbc: E1056
  any:
  - id: py-func-getpass-shadow
  - id: py-getpass-with-io
  - id: py-input-with-io
- id: js-crypto-func-def
  desc: JavaScript crypto-named function definition
  crit: notable
  conf: 0.6
  any:
  - id: micro-behaviors/crypto/library/keyword::js-encrypt-func-def
  - id: micro-behaviors/crypto/library/keyword::js-decrypt-func-def
  unless:
  - id: metadata/build
  - id: well-known/lib/crypto/node-forge::node-forge-package-path
  - id: well-known/lib/crypto/node-forge::node-forge-current-library
  - id: metadata/build/recognized-contexts::benign-trojanized-fp-context
  - id: well-known/app/publishing/wordpress-plugins/commerce::wordpress-plugin-path-downloads
  - id: well-known/app/browser-extension/translator::translator-member-path
  - id: well-known/app/browser-extension/translator::tencent-translation-api-auth
- id: js-crypto-shadow
  desc: Crypto-named function with nearby HTTP POST
  crit: suspicious
  conf: 0.8
  scope: leaf
  near_bytes: 4096
  all:
  - id: js-crypto-func-def
  any:
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/http/post::node-http-request-post
  unless:
  - id: metadata/build
  - id: metadata/build/recognized-contexts::benign-trojanized-fp-context
  - id: well-known/tool/development/vscode-extension/tencent-codebuddy::codebuddy-marker
  - id: well-known/app/browser-extension/translator::translator-member-path
  - id: well-known/app/browser-extension/translator::tencent-translation-api-auth
- id: javascript-function-shadow
  desc: JavaScript function shadowing
  crit: suspicious
  conf: 0.85
  any:
  - id: js-console-log-shadow
  - id: js-crypto-shadow
  unless:
  - id: metadata/build
  - id: metadata/package/files/dependency::node-modules-path
  - id: well-known/tool/development/build/projen::package-context
  - id: well-known/lib/development/system::system-browser-loader-bundle
  - id: well-known/lib/runtime/scripted/requirejs::requirejs-browser-xhr-loader
  - id: well-known/lib/runtime/scripted/requirejs::requirejs-library-context
  - id: well-known/lib/web/client-side/capacitor::capacitor-cordova-runtime-context
  - id: well-known/lib/observability/import-in-the-middle::import-in-the-middle-library-context
  - id: well-known/lib/runtime/scripted/napi-rs::napi-rs-require-reassignment-context
- id: function-shadow-attack
  desc: Function shadowing supply chain attack
  crit: suspicious
  conf: 0.95
  mbc: E1056
  any:
  - id: python-credential-shadow
  - id: javascript-function-shadow
  - id: ruby-gets-shadow
  unless:
  - id: well-known/tool/development/build/projen::package-context
  - id: well-known/lib/observability/import-in-the-middle::import-in-the-middle-library-context
  - id: well-known/lib/observability/import-in-the-middle::import-in-the-middle-loader-source
  - id: well-known/lib/runtime/scripted/napi-rs::napi-rs-require-reassignment-context
