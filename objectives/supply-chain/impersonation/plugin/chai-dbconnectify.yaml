# Chai-plugin cover stories that peer an attacker-controlled "connectivity"
# package (dbconnectify) and invoke it from plugin registration. Observed in
# chai-tracker (chai-spies squat): peerDependencies lists dbconnectify while
# the plugin body spawns a silent child that require()'s it.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, archives]
  attack: T1195.002
  mbc: B0024

traits:
  - id: claims-chaijs-github-repository
    desc: Claims a chaijs GitHub repository URL
    crit: notable
    conf: 0.9
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/chaijs/'

composite_rules:
  - id: chai-plugin-peers-dbconnectify-payload
    desc: Chai plugin peers attacker dbconnectify package
    crit: hostile
    conf: 0.97
    for: [archives]
    scope: archive
    all:
      - id: metadata/package/testing/presence/scripted::chai-word
      - id: metadata/package/dependencies/manifest::npm-peer-dependency-dbconnectify
      - id: objectives/supply-chain/hidden-payload/exec::node-dbconnectify-reference
      - id: objectives/supply-chain/hidden-payload/exec::node-db-connectivity-probe
    any:
      - id: claims-chaijs-github-repository
      - id: objectives/supply-chain/hidden-payload/exec::assert-connection-side-effect-call
