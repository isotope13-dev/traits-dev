# Exact IOC for the Feather 2.8.1 installer distributed by lookalike sites
# named in the upstream project's fund-theft warning. The embedded app and Tor
# binaries also differ from the signed-tag GitHub release artifacts.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: feather-lookalike-fund-stealing-installer
    desc: Counterfeit Feather wallet steals user funds
    crit: hostile
    conf: 0.99
    attack: T1195.002
    ref: https://github.com/feather-wallet/feather/issues/326
    if:
      type: yara
      source: |
        import "hash"
        rule feather_lookalike_fund_stealing_installer {
          condition:
            hash.sha256(0, filesize) == "e03f2473cbd3b67cbe376ecca3f89fce0e99de7486b0302e14be92826f5710db"
        }
