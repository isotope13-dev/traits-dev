# Cloned README Body Indicators
# Patterns that suggest PKG-INFO body is cloned from legitimate libraries
defaults:
  platforms: [unix, windows]
  crit: component
  conf: 0.70
  # These atoms read the PKG-INFO Description body, so they must be scoped to
  # the PKG-INFO/METADATA file type. Targeting [python, pyc] made them fire on
  # any .py file that renders README markup (a Streamlit page embedding two
  # shields.io badges), which the names and descriptions do not claim.
  for: [pkginfo]
traits:
  - id: pkginfo-body-has-badges
    desc: PKG-INFO body contains CI/CD badge URLs
    count_min: 2
    if:
      type: text
      substr: "img.shields.io"
  - id: pkginfo-body-has-sponsorship
    desc: PKG-INFO body references Tidelift sponsorship
    if:
      type: text
      substr: "tidelift.com"
  - id: pkginfo-body-has-maintainer-list
    desc: "PKG-INFO lists GitHub maintainers"
    count_min: 3
    if:
      type: text
      regex: "github\\.com/[a-zA-Z0-9_-]+>"
composite_rules:
  - id: has-cloned-body-indicators
    desc: Has cloned README body indicators
    crit: notable
    conf: 0.70
    needs: 2
    any:
      - id: objectives/supply-chain/impersonation/cloned-body::pkginfo-body-has-badges
      - id: objectives/supply-chain/impersonation/cloned-body::pkginfo-body-has-maintainer-list
      - id: objectives/supply-chain/impersonation/cloned-body::pkginfo-body-has-sponsorship
