# Cloned README Body Indicators
#
# A package that pastes a real project's README to look established. The
# individual body-shape atoms (badge rows, funding link, maintainer list) are
# ordinary documentation facts and live in metadata/package/documentation;
# what makes them evidence here is several of them appearing on a package that
# has no history of its own, so only the composite lives in this objective.
defaults:
  platforms: [unix, windows]
  for: [pkginfo]

composite_rules:
  # `needs` was 2, which any mature open-source package clears: colorama's own
  # METADATA carries a shields.io badge row and a Tidelift link — and the link
  # reads `tidelift.com/subscription/pkg/pypi-colorama`, i.e. it names colorama
  # itself — yet it was reported as a cloned README, and again one level up as
  # pkginfo-cloned-readme-body (T1036.005). A README that was pasted wholesale
  # from another project tends to bring the whole set with it, so require all
  # three markers rather than any two.
  #
  # This is still a proxy for the condition the note above actually describes,
  # "a package that has no history of its own". The load-bearing leg would be an
  # identity mismatch — the README's badges/funding links naming a DIFFERENT
  # project than the package claims to be — which RULES' cross-file `ne:`
  # comparison supports and which nothing here checks yet.
  - id: has-cloned-body-indicators
    desc: Has cloned README body indicators
    crit: notable
    conf: 0.70
    needs: 3
    any:
      - id: metadata/package/documentation/package-metadata::pkginfo-body-has-badges
      - id: metadata/package/documentation/package-metadata::pkginfo-body-has-maintainer-list
      - id: metadata/package/documentation/package-metadata::pkginfo-body-has-sponsorship
