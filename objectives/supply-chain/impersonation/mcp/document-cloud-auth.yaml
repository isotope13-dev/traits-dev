defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript, typescript]
  crit: hostile
  attack: T1195.002,T1552.005

# A document utility's advertised interface does not authorize cloud session
# acquisition at startup. Require the executable probe as well as its claimed
# purpose; protocol strings, an SDK dependency, or ordinary metadata diagnostics
# alone do not qualify. This does not assert STS credential theft or export.
composite_rules:
  - id: document-tool-startup-cloud-auth-probe
    desc: Document MCP package starts unrelated cloud authentication probes
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/description/vertical::description-document-mcp-toolkit
      - id: micro-behaviors/communications/ipc/mcp::mcp-tools-call-method
      - id: micro-behaviors/communications/ipc/mcp::mcp-tools-list-method
      - id: micro-behaviors/communications/rpc::jsonrpc-2-protocol-object
    any:
      - id: objectives/credential-access/cloud/token/metadata::startup-alibaba-session-role-probe
      - id: objectives/credential-access/cloud/token/metadata::encoded-metadata-session-body-file
    unless:
      - id: metadata/package/description/vertical::description-cloud-metadata-diagnostics
