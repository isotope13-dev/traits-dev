# A README that still carries miguelmota/keccak256's title, inside a package
# published under a different name.
#
# A copied README is the part of a rename the squatter forgets. `kecak256`
# rewrote the manifest name, the entry-point filename and the install line in
# the README body, but left the `# keccak256` title standing above them — the
# upstream identity, advertised by the package impersonating it.
#
# Suspicious, not hostile: the code below the README is a faithful copy of the
# original, so this reports name confusion worth a human's attention rather
# than a payload. The genuine package, and any fork that still points at the
# upstream repository, are excluded.
defaults:
  platforms: [unix, windows]
  attack: T1036
  mbc: F0012
  for: [npm, tar, zip]

composite_rules:
  - id: keccak256-readme-under-foreign-name
    desc: keccak256 README ships under another name
    crit: suspicious
    conf: 0.88
    scope: archive
    all:
      - id: well-known/lib/crypto/keccak256::readme-heading
      # Anchors the README to a published npm package rather than to a loose
      # documentation tree that merely mentions the library.
      - id: metadata/package/quality/empty::npm-has-name
    unless:
      - id: well-known/lib/crypto/keccak256::npm-package-name
      - id: well-known/lib/crypto/keccak256::npm-package-repository
