# npm packages that document a logging-formatter API in README while the main
# entry exports unrelated code (OSV-style typosquat facades).
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1036
  for: [npm, tar, zip]

composite_rules:
  - id: npm-readme-logging-formatter-api-facade
    desc: README documents logging formatters the entry does not export
    crit: hostile
    conf: 0.97
    for: [npm, tar, zip, javascript, markdown, package.json]
    scope: archive
    all:
      - id: metadata/package/documentation/package-metadata::readme-require-destructure-logging-formatters
      - id: micro-behaviors/data/control-flow/module-exec::js-bounded-stake-bankroll-parameter
      - id: micro-behaviors/data/control-flow/module-exec::commonjs-exports-compute-bounded-fraction
      - id: metadata/package/description/function::desc-logform-style-formatting-claim
    unless:
      - id: metadata/package/repository::has-repository-evidence
