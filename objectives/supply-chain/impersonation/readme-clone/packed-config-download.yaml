defaults:
  platforms: [unix, windows]
  for: [tar, zip, markdown, lua, batch]
composite_rules:
  - id: packed-lua-disguised-as-editable-config
    desc: Editable-config lure delivers packed Lua
    crit: hostile
    conf: 0.99
    attack: T1036,T1204.002
    scope: outer
    all:
      - id: metadata/package/documentation/claims::edit-zip-as-config-file-instruction
      - id: objectives/supply-chain/hidden-payload/exec/archive::archive-batch-starts-text-payload
      - id: metadata/package/files/archive-member::archive-nested-zip-member
