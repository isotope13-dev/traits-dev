defaults:
  platforms: [windows, unix]
  for: [markdown]

traits:
  - id: release-page-label-targets-zip
    desc: Release-page wording points to a ZIP
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)releases page[^\n]{0,80}https?://[^\s]{1,240}\.zip\b'

composite_rules:
  # A wrongly labeled release link alone may be a documentation mistake.
  # Conviction requires the linked archive to contain a launched, packed
  # data-file payload and a ZIP deliberately presented as an inline image.
  - id: release-page-lure-launches-packed-data
    desc: Release-page lure delivers packed data launcher
    crit: hostile
    conf: 0.98
    attack: T1036,T1204.002
    scope: outer
    for: [zip, markdown, lua, batch, pe, text]
    all:
      - id: release-page-label-targets-zip
      - id: metadata/package/documentation/page::readme-image-source-is-zip
      - id: objectives/supply-chain/hidden-payload/exec/archive::archive-batch-starts-text-payload
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-raw-githubusercontent-zip-link
