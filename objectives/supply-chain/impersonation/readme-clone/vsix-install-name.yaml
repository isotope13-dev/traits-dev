# A VSIX republished under a new name, caught by the instructions it forgot to
# rewrite.
#
# The mechanic is the same one that gives away a cloned npm package: a
# repackager changes the manifest — name, publisher, displayName, the branding
# a marketplace page renders — and leaves the README alone, because the README
# is not what the listing shows first. So the shipped documentation still tells
# the reader to run `code --install-extension <the upstream extension>` while
# the file they are holding is called something else.
#
# Nothing in such a package looks hostile, and usually nothing is: the payload
# arrives in a later version, once the borrowed name has collected installs.
# The contradiction between the manifest and its own documentation is the only
# thing there is to find at this stage, which is what makes it worth finding.
defaults:
  platforms: [unix, windows]
  for: [vsix]
  attack: T1195.002,T1036
  mbc: B0032

composite_rules:
  - id: vsix-readme-installs-other-extension
    desc: VSIX README installs a different extension
    crit: suspicious
    conf: 0.9
    # The manifest and the README are separate archive entries.
    scope: archive
    all:
      - id: metadata/package/manifest/runtime::vscode-extension
      - id: metadata/package/documentation/readme-attribution::readme-installs-foreign-extension

  # An extension pack is the cheapest way to put something on a machine: it
  # ships no code, passes review as a list of ids, and installs everything it
  # names. A long list of popular third-party extensions carrying one or two of
  # the publisher's own is a bundle assembled around its cargo — the borrowed
  # reputation is the delivery mechanism. Paired with documentation that names a
  # different pack, the assembly was not even original.
  - id: vsix-pack-borrows-reputation-for-own-entry
    desc: Third-party pack carries publisher's own entry
    crit: suspicious
    conf: 0.88
    scope: archive
    all:
      - id: metadata/permission/extension-id::vscode-extension-pack-large
      - id: metadata/permission/extension-id::vscode-extension-pack-self-entry
      - id: metadata/permission/extension-id::vscode-extension-pack-mostly-foreign
      - id: metadata/package/documentation/readme-attribution::readme-installs-foreign-extension
