# README header declares a different package identity than package.json.
#
# Attackers regularly copy a popular package's README verbatim into a
# typosquatting / brand-impersonation package. The give-away: the
# README's first `# heading` keeps the original package's name, while
# `package.json::name` is the attacker's. The mempalace/clob malware
# is the canonical example — README literally said
# `# @img/sharp-win32-x64` while the package shipped as
# `@devcarron/clob`.
#
# Fires at archive-evaluation level (npm tarball) so the cross-file
# value lookup can reach both `README.md` and `package.json`.
defaults:
  platforms: [unix, windows]
  attack: T1036
  for: [tar, archives]
traits:
  - id: readme-heading-scoped-package
    desc: README heading names scoped package
    crit: component
    conf: 0.9
    if:
      type: value
      path: README.md::markdown.first_heading
      regex: '^@[a-z0-9][a-z0-9._-]{0,80}/[a-z0-9][a-z0-9._-]{1,80}$'
  - id: readme-bare-stream-heading
    desc: README claims bare-stream identity
    crit: notable
    conf: 0.9
    for: [markdown]
    if:
      type: text
      substr: '# bare-stream'
  # The README names npm packages in its badges/links (`npmjs.com/package/X`,
  # a shields `/npm/v/X` badge) and never this one. A legit package's README
  # advertises itself; a byte-clean starjack keeps the upstream README, which
  # advertises the upstream package (`tailwindcss-3d` in a tarball published as
  # `tailwindcss-3d-animate`). `match: all` requires the manifest name to differ
  # from *every* package the README names, so a README that mentions others
  # alongside itself does not trip it. Complements the heading traits above:
  # this fires when the README title is prose but the badge betrays the origin.
  # Reads `markdown.npm_packages`, a filefacts fact, so it is inert until the
  # engine that produces it ships.
  - id: readme-npm-badge-names-foreign-package
    desc: README npm badges name a different package
    crit: notable
    conf: 0.9
    for: [npm, tar, zip]
    if:
      type: value
      path: package.json::name
      ne: README.md::markdown.npm_packages
      match: all

composite_rules:
  # Removed: recent-hollow-upstream-identity-drift ("hollow + recent-package +
  # few-releases"). It duplicated npm-clone::name-reservation-hollow-release leg
  # for leg, and carried no README evidence at all -- nothing in it belonged in a
  # readme-vs-manifest name-mismatch file. Two copies of one matcher split the
  # signal across two ML features and drifted apart; the npm-clone copy is
  # canonical.
  - id: readme-header-package-name-mismatch
    desc: README package heading mismatches manifest
    crit: suspicious
    conf: 0.93
    mbc: F0012
    all:
      - id: readme-heading-scoped-package
      - id: metadata/package/documentation::readme-heading-name-differs

  - id: readme-mismatch-with-undeclared-loader
    desc: README misdirection with hidden loader
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1036"
    scope: package
    for: [npm, tar, zip, archives]
    all:
      - id: metadata/package/dependencies/manifest::npm-phantom-runtime-dependency
      - id: micro-behaviors/os/module/load::dynamic-import-string-literal
      # A copied README and hidden import can survive beyond the first week;
      # use the existing two-month young-package fact while keeping all of
      # the identity-deception and loader legs intact.
      - id: metadata/registry::recent-package
      - id: readme-bare-stream-heading
      - id: metadata/package/manifest/name::scoped-package-name

  - id: readme-misdirection-with-host-profile-callback
    desc: Mismatched README identity accompanies host callback
    crit: hostile
    conf: 0.995
    attack: "T1195.002,T1036,T1041"
    mbc: E1041
    for: [npm, tar, archives]
    scope: archive
    all:
      - id: metadata/package/documentation::readme-heading-name-differs
      - id: metadata/package/documentation::readme-install-scoped-package-command
      - id: objectives/supply-chain/recon-exfil/inline::npm-postinstall-inline-host-profile-exfil

  - id: readme-misdirection-with-browser-miner
    desc: Mismatched README conceals a browser cryptominer
    crit: hostile
    conf: 0.995
    attack: "T1195.002,T1036,T1496"
    mbc: B0018
    for: [npm, tar, archives]
    scope: archive
    all:
      - id: metadata/package/documentation::readme-heading-name-differs
      - id: objectives/impact/cryptojacking/miner/runtime::browser-xelis-stratum-miner

  # Install-line-only README plus a silent Vercel axios path relay — the bait
  # cover paired with the real beacon in index.js.
  - id: readme-install-bait-silent-vercel-relay
    desc: Install-only README covers a silent Vercel axios relay
    crit: hostile
    conf: 0.98
    attack: "T1195.002,T1036,T1041"
    scope: archive
    for: [npm, tar, archives]
    all:
      - id: metadata/package/documentation::readme-only-npm-install-line
      - id: objectives/exfiltration/http/collect::silent-axios-vercel-path-relay
      - id: metadata/package/manifest/description::desc-logger-validation-cover
