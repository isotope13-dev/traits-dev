# README header declares a different package identity than package.json.
#
# Attackers regularly copy a popular package's README verbatim into a
# typosquatting / brand-impersonation package. The give-away: the
# README's first `# heading` keeps the original package's name, while
# `package.json::name` is the attacker's. The mempalace/clob malware
# is the canonical example — README literally said
# `# @img/sharp-win32-x64` while the package shipped as
# `@devcarron/clob`.
#
# Fires at archive-evaluation level (npm tarball) so the cross-file
# value lookup can reach both `README.md` and `package.json`.
defaults:
  platforms: [unix, windows]
  attack: T1036
  for: [tar, archives]
traits:
  - id: readme-heading-scoped-package
    desc: README heading names scoped package
    crit: component
    conf: 0.9
    if:
      type: value
      path: README.md::markdown.first_heading
      regex: '^@[a-z0-9][a-z0-9._-]{0,80}/[a-z0-9][a-z0-9._-]{1,80}$'
  - id: readme-bare-stream-heading
    desc: README claims bare-stream identity
    crit: notable
    conf: 0.9
    for: [markdown]
    if:
      type: text
      substr: '# bare-stream'
  # The README names npm packages in its badges/links (`npmjs.com/package/X`,
  # a shields `/npm/v/X` badge) and never this one. A legit package's README
  # advertises itself; a byte-clean starjack keeps the upstream README, which
  # advertises the upstream package (`tailwindcss-3d` in a tarball published as
  # `tailwindcss-3d-animate`). `match: all` requires the manifest name to differ
  # from *every* package the README names, so a README that mentions others
  # alongside itself does not trip it. Complements the heading traits above:
  # this fires when the README title is prose but the badge betrays the origin.
  #
  # This was long believed inert ("waiting on the engine that produces
  # markdown.npm_packages"). The fact shipped; what actually broke it was that
  # sibling `<file>::` lookups could not resolve ARRAY facts at all — member kv
  # stores an array destructured into `a.b[0]`, and the lookup did an exact
  # `get`, so scalar facts resolved and array ones silently returned nothing.
  # Fixed in the engine (`kv_lookup_flattened`), which is what made this live.
  #
  # Measured on 120 real packages from node_modules after that fix: 2 notable
  # hits, both the inherent class rather than defects — a README that links
  # another package and never itself (`moo` -> `itt`, `posthtml` -> the
  # `posthtml-cli` badge). That residual is why this stays notable and why the
  # convicting composites require corroboration.
  - id: readme-npm-badge-names-foreign-package
    desc: README npm badges name a different package
    crit: notable
    conf: 0.9
    # A generic source archive may be a monorepo whose root private workspace
    # legitimately differs from the published package documented by README.
    # Clone-and-rename is an npm publication signal, so keep this scoped to
    # artifacts that the package analyzer identified as npm packages.
    for: [npm]
    unless:
      # Generic tarballs can enter the npm-compatible archive evaluation path
      # when they contain package.json. Do not treat repository snapshots or
      # private monorepo workspaces as published clone-and-rename packages.
      - id: metadata/build/archive::source-archive-member
      - id: metadata/package/manifest/publishing::is-private
    if:
      type: value
      path: package.json::name
      ne: README.md::markdown.npm_packages
      match: all

  # The install instruction is the README's least deniable identity claim. A
  # heading can be a project title and a badge can point at an upstream the
  # package legitimately builds on, but `npm install <x>` is the literal string
  # a reader types to obtain THIS package — if it names something else, the
  # instructions were written for a different package.
  #
  # `mc-registry` is the shape: published as `mc-registry`, headed
  # `# theta-registry`, telling readers to `npm install theta-registry`, with
  # badges still pointing at the real `chain-registry` it was cloned from.
  # Three names, none agreeing. Renaming a clone forces the manifest to change
  # (npm rejects a duplicate name) but nothing forces the README, so the stale
  # instruction is the residue of the rename.
  #
  # `match: all` requires the manifest name to differ from EVERY install command
  # the README gives, so a README that documents installing peers or a companion
  # CLI alongside itself does not trip it.
  #
  # Measured on 120 real packages from node_modules: 2 notable hits. One is a
  # true positive (`punycode.js` ships a manifest named `punycode.js` and a
  # README saying `npm install punycode`); the other is the inherent class,
  # where the README documents only OTHER packages — markdown-it-anchor's
  # install lines name the optional slugify libraries and never itself, so
  # there is no self-claim for `match: all` to find. Not separable from the
  # signal, which is why this is notable and not suspicious.
  - id: readme-install-line-names-foreign-package
    desc: README install command names a different package
    crit: notable
    conf: 0.9
    # Generic source archives routinely document a nested publishable package
    # rather than their root private workspace. The mismatch is meaningful for
    # an npm publication, not for an arbitrary tar/zip repository snapshot.
    for: [npm]
    unless:
      - id: metadata/build/archive::source-archive-member
      - id: metadata/package/manifest/publishing::is-private
    if:
      type: value
      # Orientation matters: the quantifier applies to the `ne:` side, so the
      # ARRAY must sit there. With the array on `path:` and the scalar name on
      # `ne:`, `all` quantifies over a one-element list and degenerates into
      # "differs from any install entry" — which fires on a README that names
      # this package alongside its peers (`npm install blake3 blake3-wasm`).
      path: package.json::name
      ne: README.md::markdown.install_packages
      match: all

composite_rules:
  # Removed: recent-hollow-upstream-identity-drift ("hollow + recent-package +
  # few-releases"). It duplicated npm-clone::name-reservation-hollow-release leg
  # for leg, and carried no README evidence at all -- nothing in it belonged in a
  # readme-vs-manifest name-mismatch file. Two copies of one matcher split the
  # signal across two ML features and drifted apart; the npm-clone copy is
  # canonical.
  - id: readme-header-package-name-mismatch
    desc: README package heading mismatches manifest
    crit: suspicious
    conf: 0.93
    mbc: F0012
    all:
      - id: readme-heading-scoped-package
      - id: metadata/package/documentation::readme-heading-name-differs

  - id: readme-mismatch-with-undeclared-loader
    desc: README misdirection with hidden loader
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1036"
    scope: package
    for: [npm, tar, zip, archives]
    all:
      - id: metadata/package/dependencies/manifest::npm-phantom-runtime-dependency
      - id: micro-behaviors/os/module/load::dynamic-import-string-literal
      # A copied README and hidden import can survive beyond the first week;
      # use the existing two-month young-package fact while keeping all of
      # the identity-deception and loader legs intact.
      - id: metadata/registry::recent-package
      - id: readme-bare-stream-heading
      - id: metadata/package/manifest/name::scoped-package-name

  - id: readme-misdirection-with-host-profile-callback
    desc: Mismatched README identity accompanies host callback
    crit: hostile
    conf: 0.995
    attack: "T1195.002,T1036,T1041"
    mbc: E1041
    for: [npm, tar, archives]
    scope: archive
    all:
      - id: metadata/package/documentation::readme-heading-name-differs
      - id: metadata/package/documentation::readme-install-scoped-package-command
      - id: objectives/supply-chain/recon-exfil/inline::npm-postinstall-inline-host-profile-exfil

  - id: readme-misdirection-with-browser-miner
    desc: Mismatched README conceals a browser cryptominer
    crit: hostile
    conf: 0.995
    attack: "T1195.002,T1036,T1496"
    mbc: B0018
    for: [npm, tar, archives]
    scope: archive
    all:
      - id: metadata/package/documentation::readme-heading-name-differs
      - id: objectives/impact/cryptojacking/miner/runtime::browser-xelis-stratum-miner

  # Install-line-only README plus a silent Vercel axios path relay — the bait
  # cover paired with the real beacon in index.js.
  - id: readme-install-bait-silent-vercel-relay
    desc: Install-only README covers a silent Vercel axios relay
    crit: hostile
    conf: 0.98
    attack: "T1195.002,T1036,T1041"
    scope: archive
    for: [npm, tar, archives]
    all:
      - id: metadata/package/documentation::readme-only-npm-install-line
      - id: objectives/exfiltration/http/collect::silent-axios-vercel-path-relay
      - id: metadata/package/manifest/description::desc-logger-validation-cover
