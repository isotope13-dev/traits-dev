  conf: 0.95
  attack: T1195.002
  mbc: B0030
  for:
  - archives
  scope: archive
  all:
  - id: objectives/supply-chain/impersonation/manifest/attack-label::desc-attack-technique
  - id: micro-behaviors/ui/window/manage/navigation::browser-meta-refresh-external-url

# Hollow skeleton whose description admits a PoC/placeholder and whose SemVer
# major is absurd (40+ / 1000.x). Covers empty GHSA-held stubs that never ship
# install hooks but still occupy a lookalike name on the registry.
- id: hollow-poc-extreme-version-stub
  desc: Hollow PoC package ships an extreme SemVer major
  crit: hostile
  conf: 0.96
  attack: T1195.002
  for: [package.json, npm, archives]
  all:
  - id: metadata/package/manifest/freeform::pkg-skeleton-small
  - id: metadata/package/quality/version-sentinel::npm-version-major-40-plus
  # "PoC" and "placeholder" are two spellings of the same admission, not two
  # independent facts. Requiring both meant a stub had to use the word
  # `placeholder` AND the word `PoC` in one description, so the plain
  # "Placeholder package" squats — the common form — matched neither this rule
  # nor `hollow-desc-poc-extreme-version` below (which additionally demands no
  # dependencies field at all).
  any:
  - id: metadata/package/manifest/description::description-mentions-poc
  - id: metadata/package/manifest/description::description-mentions-placeholder
  unless:
  - id: metadata/package/manifest/repository::has-repository-field
  - id: metadata/package/manifest/entrypoint::has-bin-field
  - id: metadata/package/testing/presence/fixture/
  - id: well-known/app/security/securityctrl::defensive-placeholder-context

# Same hollow PoC shape keyed on the attack-label PoC atom (description
# field) rather than the free-text "placeholder" token — catches "Normal PoC"
# stubs that omit the word placeholder while still advertising research intent.
- id: hollow-desc-poc-extreme-version
  desc: Hollow package labelled PoC with extreme SemVer major
  crit: hostile
  conf: 0.95
  attack: T1195.002
  for: [package.json, npm, archives]
  all:
  - id: metadata/package/manifest/freeform::pkg-skeleton-small
  - id: desc-package-poc
  - id: metadata/package/quality/version-sentinel::npm-version-major-40-plus
  - id: metadata/package/dependencies/manifest::npm-no-dependencies-field
  unless:
  - id: metadata/package/manifest/repository::has-repository-field
  - id: metadata/package/manifest/entrypoint::has-bin-field
  - id: metadata/package/testing/presence/fixture/

# Logger/validation cover text on a package that silently GETs caller data to
# a Vercel relay — the amazon-inspector webautomation_js shape. Archive scope
# joins package.json description with index.js beacon atoms.
- id: logger-cover-silent-vercel-axios-relay
  desc: Logger-cover package silently relays via axios to Vercel
  crit: hostile
  conf: 0.97
  attack: T1195.002,T1041
  for: [npm, tar, archives]
  scope: archive
  all:
  - id: metadata/package/manifest/description::desc-logger-validation-cover
  - id: micro-behaviors/communications/http/get::axios-get-template-base-concat
  - id: micro-behaviors/communications/http/endpoints::vercel-app
  - id: micro-behaviors/data/control-flow/error-handling::empty-optional-catch-block
  unless:
  - id: metadata/package/testing/presence/fixture/
