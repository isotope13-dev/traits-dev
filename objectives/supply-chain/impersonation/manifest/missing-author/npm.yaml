# A published npm manifest with an empty or missing author (filefacts
# `consistency.missing_author`: named, versioned, not private, no publisher,
# no local-protocol dependencies). Scoped organization packages and monorepo
# members attribute authorship at the repository level instead.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: npm-missing-author
    desc: Published package has no author
    conf: 0.5
    if:
      type: metrics
      field: consistency.missing_author
      min: 1
    unless:
      - id: metadata/package/author/identity::npm-author-metadata-present
      # Scoped organization packages attribute authorship at the org/repo level.
      - id: metadata/package/name/vocabulary::scoped-package-name
      # Monorepo subdirectory member: authorship lives at the repository level.
      - id: metadata/package/repository::npm-repository-directory-field
      - id: metadata/package/name/identity::react-native-official-package
