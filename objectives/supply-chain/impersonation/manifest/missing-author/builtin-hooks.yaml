# Engine-emitted `supply-chain/missing-author` hook.
# cleave flags npm manifests with an empty or missing author field. Scoped
# ecosystems such as @ankhorage/* publish from organization repositories with
# full repo/homepage metadata while omitting author.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [package.json, npm]

traits:
  - id: builtin-supply-chain-missing-author
    desc: Built-in missing author field hook
    conf: 0.5
    if:
      type: basename
      exact: __cleave_builtin_missing_author_hook__
    unless:
      - id: well-known/lib/development/ankhorage::package-identity
      - id: well-known/lib/cloud/salesforce-js::salesforce-scoped-package-identity
