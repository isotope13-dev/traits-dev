# Engine-emitted `supply-chain/missing-author` hook.
# cleave flags npm manifests with an empty or missing author field. Scoped
# ecosystems such as @ankhorage/* publish from organization repositories with
# full repo/homepage metadata while omitting author. Monorepo members that
# declare their repository subdirectory likewise attribute authorship at the
# repository level; the YAML missing-author traits already treat that shape
# as benign context (npm-benign-missing-author-context).
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [package.json, npm]

traits:
  - id: builtin-supply-chain-missing-author
    desc: Built-in missing author field hook
    conf: 0.5
    if:
      type: basename
      exact: __cleave_builtin_missing_author_hook__
    unless:
      - id: recognized-publisher-missing-author-context
      - id: metadata/package/author/identity::npm-author-metadata-present
      # Monorepo subdirectory member: authorship lives at the repository level.
      - id: metadata/package/repository::npm-repository-directory-field

composite_rules:
  # Recognized publishers whose packages omit the author field: organization
  # repositories with full repo metadata attribute authorship at the org level.
  # Groups the publisher-identity suppressions for the engine missing-author
  # hook so the hook's unless list stays within the suppression budget.
  - id: recognized-publisher-missing-author-context
    desc: Recognized publisher missing-author context
    crit: exception
    conf: 1.0
    any:
      - id: well-known/lib/web/site-platforms/wix::package-identity
      - id: well-known/lib/development/ankhorage/
      - id: well-known/lib/cloud/salesforce-js/
      - id: well-known/lib/development/definitelytyped/
      - id: well-known/lib/development/csstools/
      - id: well-known/lib/data/
      - id: well-known/lib/crypto/metamask-core/
      - id: well-known/lib/ui/frontify-fondue/
