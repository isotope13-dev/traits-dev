defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: name-ui-style-unscoped
  desc: Unscoped company-style UI style package name
  crit: component
  conf: 0.82
  if:
    type: value
    path: name
    regex: "^[a-z0-9][a-z0-9-]{3,40}-ui-style$"
- id: keywords-single-entry
  desc: Keywords array has exactly one entry
  crit: component
  conf: 0.7
  if:
    type: value
    path: keywords
    size_min: 1
    size_max: 1
  unless:
  - id: metadata/package/testing/presence/fixture::tabby-builtin-keyword
  - id: metadata/package/manifest/repository/
- id: zero-byte-js-entry
  desc: Zero-byte JavaScript main entry file
  crit: suspicious
  conf: 0.9
  attack: T1195.002
  for:
  - javascript
  size_max: 0
  if:
    id: metadata/package/files/package-json::zero-byte-js-entry
- id: author-corp-email-dropbox
  desc: Author uses Dropbox corporate email
  crit: notable
  conf: 0.72
  attack: T1195.002
  if:
    type: value
    path: author
    substr: "@dropbox.com"
composite_rules:
- id: pypi-development-skeleton-impersonation
  desc: Development-named PyPI skeleton impersonation
  crit: hostile
  conf: 0.99
  attack: T1195.002
  mbc: B0024
  for: [pkginfo, whl, archives, zip]
  all:
  - id: objectives/supply-chain/impersonation/package/wheel-sdist::pypi-empty-skeleton-sparse-metadata
  - id: metadata/package/manifest/name::pypi-development-package-name
  - id: metadata/package/versioning::pkginfo-repeated-nine-version
  scope: archive
- id: no-deps-with-hooks
  desc: Package has install hooks but no dependencies
  crit: notable
  conf: 0.85
  all:
  - id: metadata/package/scripts/lifecycle::install-hooks
  - id: metadata/package/dependencies/manifest::npm-no-deps-at-all
  unless:
  - id: metadata/package/manifest/entrypoint::has-bin-field
  - id: metadata/package/manifest/publishing::is-private
# `multiple-hooks` moved to
# objectives/supply-chain/install-hook/scripts/lifecycle::multiple-install-hooks
# -- counting lifecycle hooks is a hook fact, not an impersonation one, and its
# two consumers already live in that directory.
- id: new-version-hooks
  desc: Brand new package version with install hook
  crit: suspicious
  conf: 0.8
  all:
  - id: metadata/package/versioning::npm-version-0-0-1
  - id: metadata/package/scripts/lifecycle::install-hooks
  unless:
  - id: metadata/package/dependencies/manifest::has-dev-deps
  - id: well-known/lib/crypto/nss::nss-taskcluster-automation
  - id: metadata/package/testing/presence/fixture/
  - id: metadata/package/manifest/repository::has-repository-evidence
- id: missing-metadata-hooks
  desc: Package missing standard metadata but has install hook
  crit: suspicious
  conf: 0.85
  all:
  - id: metadata/package/scripts/lifecycle::install-hooks
  unless:
  - id: metadata/package/manifest/repository::has-repository-field
  - id: metadata/package/manifest/entrypoint::has-bin-field
  - id: metadata/package/manifest/publishing::is-private
  - id: metadata/package/dependencies/manifest::has-dev-deps
  - id: objectives/supply-chain/impersonation/package/manifest/
  - id: objectives/supply-chain/install-hook/package/manifest::tabby-builtin-plugin-keyword
  # Real packages often omit repository/bin while still declaring keywords and a
  # description (native/WASM binaries chmod'd in postinstall). Hollow squats
  # typically lack both.
  - id: metadata/package/keywords/identity::has-keywords
  downgrade:
    any:
    - id: metadata/package/manifest/freeform::pkg-skeleton-small
- id: hollow-ui-style-name-squat
  desc: Hollow UI style package namespace squat
  crit: hostile
  conf: 0.97
  attack: T1195.002
  mbc: B0024
  all:
  - id: metadata/package/manifest/freeform::pkg-skeleton-small
  - id: objectives/supply-chain/impersonation/manifest/skeleton::name-ui-style-unscoped
  - id: metadata/package/manifest/entrypoint::has-index-entry
  - id: metadata/package/testing/presence/manifest::npm-init-default-test
  - id: objectives/supply-chain/impersonation/manifest/placeholder::desc-test-package
  any:
  - id: metadata/package/versioning::mature-version
  - id: metadata/package/quality/empty::npm-no-keywords
  - id: metadata/package/dependencies/manifest::npm-no-deps-devdependencies
  - id: metadata/package/files/package-json::author-very-short
  needs: 3
  unless:
  - id: metadata/package/manifest/repository/
  - id: metadata/package/manifest/entrypoint::has-bin-field
  - id: metadata/package/testing/presence/fixture::playwright-test-plugin-fixture
  - id: metadata/package/testing/presence/fixture::test-fixture-package-json-path
  - id: metadata/package/testing/presence/fixture/
- id: sfdc-prefix-init-squat
  desc: sfdc-prefixed npm init placeholder package
  crit: hostile
  conf: 0.97
  attack: T1195.002
  mbc: B0024
  all:
  - id: metadata/package/manifest/freeform::pkg-skeleton-small
  - id: metadata/package/testing/presence/manifest::npm-init-default-test
  - id: metadata/package/quality/empty::npm-empty-description
  - id: metadata/package/manifest/name::npm-name-sfdc-prefix
  any:
  - id: metadata/package/quality/empty::npm-empty-author
  - id: metadata/package/dependencies/manifest::npm-no-runtime-dependencies
  - id: metadata/package/versioning::mature-version
  needs: 2
  unless:
  - id: metadata/package/manifest/repository/
  - id: metadata/package/manifest/entrypoint::has-bin-field
  - id: metadata/package/testing/presence/fixture::playwright-test-plugin-fixture
- id: sfdc-prefix-hollow-index-squat
  desc: sfdc-prefixed hollow package advertises default index entry
  crit: hostile
  conf: 0.98
  attack: T1195.002
  mbc: B0024
  all:
  - id: metadata/package/manifest/freeform::pkg-skeleton-small
  - id: metadata/package/quality/empty::npm-empty-description
  - id: metadata/package/manifest/entrypoint::has-index-entry
  - id: metadata/package/manifest/name::npm-name-sfdc-prefix
  any:
  - id: metadata/package/testing/presence/manifest::npm-init-default-test
  - id: metadata/package/quality/empty::npm-empty-author
  - id: metadata/package/quality/empty::npm-no-keywords
  - id: metadata/package/dependencies/manifest::npm-no-runtime-dependencies
  needs: 3
  unless:
  - id: metadata/package/manifest/repository/
  - id: metadata/package/manifest/entrypoint::has-bin-field
  - id: metadata/package/testing/presence/fixture::playwright-test-plugin-fixture
- id: inflated-sparse-package-invalid-license-key
  desc: Inflated sparse package has invalid License key with install hook
  crit: suspicious
  conf: 0.95
  attack: T1195.002
  all:
  - id: metadata/package/manifest/freeform::pkg-skeleton-small
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-preinstall
  - id: metadata/package/quality/version-sentinel::npm-version-inflated-major
  - id: metadata/package/license::npm-license-key-case-variant
  any:
  - id: metadata/package/quality/empty::npm-empty-author
  - id: metadata/package/dependencies/manifest::npm-no-deps-devdependencies
  needs: 1
  unless:
  - id: metadata/package/manifest/repository/
  - id: metadata/package/manifest/publishing::is-private
- id: new-empty-dotted-typed-client-entrypoint
  desc: New empty dotted typed-client npm entrypoint
  # Registry freshness plus an empty entrypoint is a useful corroborating
  # signal, but it is not independently malicious: legitimate packages can
  # be published as a new scaffold. The archive-scope placeholder rule owns
  # the single suspicious assessment when the stronger metadata cluster is
  # present.
  crit: notable
  conf: 0.95
  attack: T1195.002
  mbc: B0024
  scope: package
  for: [npm, archives]
  all:
  - id: metadata/package/quality/empty::tiny-commonjs-exports-object
  - id: metadata/registry::brand-new-package
  - id: metadata/package/manifest/name::npm-dotted-typed-client-name
  - id: metadata/package/manifest/entrypoint::main-root-javascript-entry
  unless:
  - id: metadata/package/manifest/repository/
  - id: metadata/package/manifest/homepage::has-homepage-field
