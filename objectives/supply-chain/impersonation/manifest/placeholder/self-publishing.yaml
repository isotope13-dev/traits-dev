# A placeholder package that publishes more placeholder packages.
#
# Registry-farming campaigns do not need a payload. The package is the product:
# its entry point generates a fresh name, bumps a version, shells out to
# `npm publish`, sleeps, and repeats -- turning one account into a stream of
# packages that exist to be counted. The published artifact is honest about all
# of it, which is exactly why behavioural rules pass over it: nothing is hidden,
# encoded, or executed against the host.
#
# Shelling out to `npm publish` is not itself wrong -- release tooling
# (semantic-release, np) does it as its whole purpose. What separates those from
# a farming bot is the loop around it: the bot *synthesises* what it publishes,
# building a manifest with `JSON.stringify` and `writeFileSync` immediately
# before shelling out, then goes round again. A release tool publishes a package
# that already exists; it does not manufacture one per iteration.
#
# An earlier draft paired the publish call with the neutral
# `metadata/package/quality/scoring::npm-unmodified-init-skeleton` fact instead.
# Measured against 20 samples of the family, only 5 carried that trait --
# the generated names (`accessible_crocodile_z3n`, `actual_panda_z3n`) are not
# npm-init defaults. All 20 carry the write-then-publish loop below.
#
# Worked example: `characteristic_iguana_z3n@2.1.1`, whose `publishScript.js`
# builds names from `unique-names-generator`, runs
# `exec("npm publish --access public")` on a timer, and counts its own
# publications.
defaults:
  platforms: [unix, windows]
  attack: T1195.002
  mbc: B0024

traits:
  - id: placeholder-package-self-publishes
    desc: Package script manufactures and republishes
    crit: suspicious
    conf: 0.93
    for: [javascript]
    # Require one script to manufacture a JSON manifest and then publish it.
    # An archive composite joined these common operations across unrelated
    # files in large source distributions such as CodeQL Action.
    if:
      type: text
      regex: '(?s)writeFileSync.{0,999}JSON\.stringify.{0,999}npm\s+publish\b'

# The timer spelling of the farm: shelling out to `npm publish` on a long
# delay loop. The worm rules under hidden-payload convict the replication;
# this states the farming itself from the impersonation side -- a package
# whose purpose is to publish packages on a schedule is manufacturing
# registry clutter for whatever comes next, and the timer is what makes it
# an operation rather than a release.
#
# Worked example: the characteristic_iguana_z3n / miaww set, whose publish
# script runs `npm publish --access public` inside a long setTimeout loop.
composite_rules:
  - id: placeholder-farm-timer-publish
    desc: Publishes manufactured packages on a timer
    crit: hostile
    conf: 0.95
    scope: leaf
    # Publishing and a long timer must occur in the same script; package-wide
    # co-occurrence joins unrelated dependencies in a bundled application.
    all:
      - id: micro-behaviors/os/package-manager/publish::js-npm-publish-exec-string
      - id: micro-behaviors/time/schedule/delay::settimeout-callback-long-delay
