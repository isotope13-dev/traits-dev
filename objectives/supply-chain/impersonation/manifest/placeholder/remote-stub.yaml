# A published placeholder package that redirects runtime resolution to a
# mutable URL is a dependency-confusion pattern, not merely an empty module.
defaults:
  platforms: [unix, windows]
  for: [npm, tar]
  attack: "T1195.002"

composite_rules:
  - id: placeholder-remote-runtime-stub
    desc: Placeholder package redirects runtime resolution to a remote dependency
    crit: hostile
    conf: 0.99
    for: [npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/dependencies/manifest/source::npm-https-runtime-dependency
      - id: metadata/package/dependencies/manifest/reconciliation::npm-phantom-runtime-dependency
      - id: metadata/package/files/package-json::placeholder-org-repository
      - id: metadata/package/placeholder::tiny-commonjs-exports-object
    unless:
      - id: metadata/package/publishing::is-private
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"

  - id: hollow-inflated-remote-dependency-stub
    desc: Hollow inflated package redirects to remote HTTPS tarball
    crit: hostile
    conf: 0.98
    for: [npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/placeholder::tiny-commonjs-exports-object
      - id: metadata/package/dependencies/manifest/source::dep-https-tarball-kv
      - id: metadata/package/versioning/scheme::npm-major-version-prefix-90-plus
      - id: metadata/package/empty::npm-empty-description
    unless:
      - id: metadata/package/publishing::is-private
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"

  - id: self-dep-inflated-sole-https-tarball-carrier
    desc: Self-dependency squat with sole off-registry HTTPS tarball
    crit: hostile
    conf: 0.98
    for: [npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/dependencies/declaration::manifest-declares-itself-as-dependency
      - id: metadata/package/dependencies/manifest/source::dep-https-tarball-kv
      - id: metadata/package/dependencies/manifest/source::npm-single-https-runtime-dependency
      - id: metadata/package/versioning/scheme::npm-major-version-prefix-90-plus
    unless:
      - id: metadata/package/publishing::is-private

  # Self-dependency squat (name wins registry resolution) whose sole runtime is
  # an off-registry HTTPS tarball; the payload preinstall hex-encodes host
  # identity into OAST collaborator subdomains via a speed-check download.
  - id: self-dep-inflated-https-tarball-oast-preinstall
    desc: Self-dependency carrier installs hex OAST preinstall payload
    crit: hostile
    conf: 0.995
    for: [npm, tar, package.json, javascript]
    scope: outer
    all:
      - id: metadata/package/dependencies/declaration::manifest-declares-itself-as-dependency
      - id: metadata/package/dependencies/manifest/source::dep-https-tarball-kv
      - id: metadata/package/versioning/scheme::npm-major-version-prefix-90-plus
      - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
      - id: micro-behaviors/communications/http/url/build::node-hex-os-identity-benchmark-url-argument

