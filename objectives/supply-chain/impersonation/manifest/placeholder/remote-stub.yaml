# A published placeholder package that redirects runtime resolution to a
# mutable URL is a dependency-confusion pattern, not merely an empty module.
defaults:
  platforms: [unix, windows]
  for: [archives, npm, tar]
  attack: "T1195.002"

composite_rules:
  - id: placeholder-remote-runtime-stub
    desc: Placeholder package redirects runtime resolution to a remote dependency
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/dependencies/manifest::npm-https-runtime-dependency
      - id: metadata/package/dependencies/manifest::npm-phantom-runtime-dependency
      - id: metadata/package/files/package-json::placeholder-org-repository
      - id: metadata/package/quality/empty::tiny-commonjs-exports-object
    unless:
      - id: metadata/package/manifest/publishing::is-private
      - id: metadata/package/testing/
