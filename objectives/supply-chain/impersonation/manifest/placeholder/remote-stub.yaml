defaults:
  platforms:
  - unix
  - windows
  for:
  - npm
  - tar
  - package.json
  - javascript
  attack: T1195.002
  crit: hostile
composite_rules:
- id: placeholder-remote-runtime-stub
  desc: Placeholder package redirects runtime resolution to a remote dependency
  conf: 0.99
  scope: archive
  all:
  - id: metadata/package/dependencies/source::npm-https-runtime-dependency
  - id: metadata/package/dependencies/reconciliation::npm-phantom-runtime-dependency
  - id: metadata/package/files/package-json::placeholder-org-repository
  - id: metadata/lang/source/syntax/assignment/member::small-commonjs-object-export
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: hollow-inflated-remote-dependency-stub
  desc: Hollow inflated package redirects to remote HTTPS tarball
  conf: 0.98
  scope: archive
  all:
  - id: metadata/lang/source/syntax/assignment/member::small-commonjs-object-export
  - id: metadata/package/dependencies/source::dep-https-tarball-kv
  - id: metadata/package/versioning/scheme::npm-major-version-prefix-90-plus
  - id: metadata/package/empty::npm-empty-description
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: self-dep-inflated-sole-https-tarball-carrier
  desc: Self-dependency squat with sole off-registry HTTPS tarball
  conf: 0.98
  scope: archive
  all:
  - id: metadata/package/dependencies/declaration::manifest-declares-itself-as-dependency
  - id: metadata/package/dependencies/source::dep-https-tarball-kv
  - id: metadata/package/dependencies/source::npm-single-https-runtime-dependency
  - id: metadata/package/versioning/scheme::npm-major-version-prefix-90-plus
  unless:
  - id: metadata/package/publishing::is-private
- id: self-dep-inflated-https-tarball-oast-preinstall
  desc: Self-dependency carrier installs hex OAST preinstall payload
  conf: 0.995
  scope: outer
  all:
  - id: metadata/package/dependencies/declaration::manifest-declares-itself-as-dependency
  - id: metadata/package/dependencies/source::dep-https-tarball-kv
  - id: metadata/package/versioning/scheme::npm-major-version-prefix-90-plus
  - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
  - id: micro-behaviors/communications/url/construction/build-http::node-hex-os-identity-benchmark-url-argument
