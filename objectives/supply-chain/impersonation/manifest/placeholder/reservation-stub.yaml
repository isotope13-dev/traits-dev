# The reservation stub that announces its own weaponization.
#
# A hollow entry point plus a published promise that the real implementation
# "ships in the next release" is the dependency-confusion landing pattern: the
# empty first release establishes the name and harvests dependents, and the
# promised next release is where a payload lands in front of every one of
# them. Alone, each fact is tolerable — stubs exist, plans change. A
# brand-new package with no repository or homepage claiming both at once is
# not a staging state a legitimate author publishes publicly.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript, registry]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: hollow-stub-promises-future-release
    desc: Brand-new hollow stub defers implementation to a future release
    for: [npm, tar, package.json, javascript, registry, markdown]
    crit: hostile
    conf: 0.92
    scope: outer
    all:
      - id: metadata/package/placeholder::tiny-commonjs-exports-object
      - id: metadata/registry::brand-new-package
    any:
      - id: objectives/supply-chain/impersonation/manifest/placeholder::js-placeholder-entrypoint-marker
      - id: objectives/supply-chain/impersonation/manifest/placeholder::js-ships-next-release-comment
      - id: objectives/supply-chain/impersonation/manifest/placeholder::js-implementation-next-release-comment
      - id: metadata/package/documentation/package-metadata::readme-implementation-next-release
    unless:
      - id: metadata/package/repository::has-repository-evidence
      - id: metadata/package/homepage::has-homepage-field
      - id: well-known/tool/development/aube::aube-package-test-fixture
