defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: desc-test-package
  desc: Description is npm test placeholder
  crit: notable
  conf: 0.82
  if:
    type: value
    path: description
    regex: "^test package$"
    case_insensitive: true

- id: js-placeholder-announcement-1a
  desc: Placeholder package name announcement
  crit: notable
  conf: 0.8
  for:
  - javascript
  unless:
  - id: metadata/package/testing/harness/
  - id: metadata/document/html::html-root-at-start
  if:
    type: string_literal
    regex: "\\b(placeholder|fake)\\b.{0,30}\\bpackage\\b"
    case_insensitive: true
  not:
  - regex: "(?i)placeholder\\s+for\\s+"
  - regex: "(?im)^\\s*(//|/\\*|\\*)\\s*.*\\b(placeholder|fake)\\b.{0,30}\\bpackage\\b"
  - substr: "Demo module setup"
- id: js-placeholder-announcement-1b
  desc: Code announces a placeholder module
  crit: notable
  conf: 0.8
  for:
  - javascript
  unless:
  - id: metadata/package/testing/harness/
  - id: well-known/tool/development/aube::aube-node-placeholder-reservation
  if:
    type: text
    regex: "\\b(this\\s+is\\s+)?(a\\s+)?(placeholder|fake)\\s+module\\b"
    case_insensitive: true
  not:
  - regex: "(?im)^\\s*(//|/\\*|\\*)\\s*.*\\b(placeholder|fake)\\b.{0,30}\\bmodule\\b"
  - substr: "Demo module setup"
- id: js-placeholder-announcement-2
  desc: Placeholder npm package announcement
  crit: notable
  conf: 0.8
  for:
  - javascript
  unless:
  - id: metadata/package/testing/harness/
  if:
    type: string_literal
    regex: "\\b(placeholder|fake)\\b.{0,30}\\bnpm\\b"
    case_insensitive: true
  not:
  - regex: "(?im)^\\s*(//|/\\*|\\*)\\s*.*\\b(placeholder|fake)\\b.{0,30}\\bnpm\\b"
  - substr: "Demo module setup"
- id: js-placeholder-announcement-3
  desc: Code says "do not use" this package/module
  crit: notable
  conf: 0.8
  for:
  - javascript
  size_max: 1024
  unless:
  - id: metadata/package/testing/harness/
  - id: well-known/tool/development/aube::aube-node-placeholder-reservation
  if:
    type: string_literal
    regex: do\s+not\s+use\b.{0,40}\b(package|module|npm)\b
    case_insensitive: true
- id: js-placeholder-entrypoint-marker
  desc: Comment marks placeholder entrypoint
  crit: notable
  conf: 0.88
  for:
  - javascript
  size_max: 1024
  unless:
  - id: metadata/package/testing/harness/
  - id: well-known/tool/development/aube::aube-node-placeholder-reservation
  if:
    type: text
    regex: '(?i)\bplaceholder\s+entrypoint\b'
- id: js-ships-next-release-comment
  desc: Comment defers release to next version
  crit: notable
  conf: 0.88
  for:
  - javascript
  size_max: 1024
  unless:
  - id: metadata/package/testing/harness/
  - id: well-known/tool/development/aube::aube-node-placeholder-reservation
  if:
    type: text
    regex: '(?i)\bships\s+in\s+the\s+next\s+release\b'
- id: js-land-next-release-comment
  desc: Comment defers landing to next release
  crit: notable
  conf: 0.88
  for:
  - javascript
  size_max: 1024
  unless:
  - id: metadata/package/testing/harness/
  - id: well-known/tool/development/aube::aube-node-placeholder-reservation
  if:
    type: text
    regex: '(?i)\bland\s+in\s+the\s+next\s+release\b'
- id: js-implementation-next-release-comment
  desc: Comment cites implementation next release
  crit: notable
  conf: 0.88
  for:
  - javascript
  size_max: 1024
  unless:
  - id: metadata/package/testing/harness/
  - id: well-known/tool/development/aube::aube-node-placeholder-reservation
  if:
    type: text
    regex: '(?i)\bimplementation.{0,40}\bnext\s+release\b'
- id: js-hijacked-package-message
  desc: Logs an announcement of package hijacking
  crit: suspicious
  conf: 0.98
  attack: T1195.002
  for:
  - javascript
  if:
    type: symbol
    kind: call
    regex: '^console\.(log|warn|error|info)$'
    arg:
      kind: string
      regex: '(?i)hijacked package'
- id: js-malicious-code-executed
  desc: Code prints "Malicious code executed"
  crit: suspicious
  conf: 0.98
  attack: T1195.002
  for:
  - javascript
  if:
    type: string_literal
    exact: Malicious code executed
- id: placeholder-author-test-handle
  desc: Package author uses testNNN handle
  crit: notable
  conf: 0.82
  if:
    type: value
    path: author
    regex: "^test[0-9]{2,8}$"
- id: archive-fs-service-worker-msw-module-doc
  desc: Archive filesystem service worker MSW module doc
  crit: notable
  conf: 0.98
  for: [javascript, typescript]
  if:
    type: text
    substr: "@module MSW tools for servicing files from archive files"
- id: archive-fs-service-worker-msw-type-stub
  desc: Archive filesystem service worker MSW type stub
  crit: notable
  conf: 0.98
  for: [javascript, typescript]
  if:
    type: text
    substr: "A placeholder for the MSW module type"
composite_rules:
- id: placeholder-published-metadata
  desc: Published npm package contains scaffold placeholder metadata
  crit: suspicious
  conf: 0.9
  attack: T1195.002
  needs: 2
  # Grouped per manifest field upstream, so `needs: 2` means two independent
  # scaffold leftovers (a name, an email, a URL, a template marker) rather than
  # two readings of the same untouched `author` object.
  any:
  - id: metadata/package/author/identity::placeholder-author-name
  - id: metadata/package/author/identity::placeholder-author-object-email-1
  - id: metadata/package/files/package-json::placeholder-project-url
  - id: metadata/package/freeform::npm-template-manifest-placeholder
- id: js-placeholder-announcement-1
  desc: Code announces a placeholder package or module
  crit: notable
  conf: 0.7
  for:
  - javascript
  unless:
  - id: metadata/package/testing/harness/
  - id: well-known/tool/packaging/yarn::yarn-cli-bundle-marker
  - id: well-known/tool/development/aube::aube-node-placeholder-reservation
  any:
  - id: objectives/supply-chain/impersonation/manifest/placeholder::js-placeholder-announcement-1a
  - id: objectives/supply-chain/impersonation/manifest/placeholder::js-placeholder-announcement-1b
  - id: objectives/supply-chain/impersonation/manifest/placeholder::js-placeholder-entrypoint-marker
  - id: objectives/supply-chain/impersonation/manifest/placeholder::js-ships-next-release-comment
  - id: objectives/supply-chain/impersonation/manifest/placeholder::js-land-next-release-comment
  - id: objectives/supply-chain/impersonation/manifest/placeholder::js-implementation-next-release-comment
- id: js-placeholder-announcement
  desc: Code announces a placeholder or reserved package name
  crit: notable
  conf: 0.85
  for:
  - javascript
  unless:
  - id: metadata/package/testing/harness/
  - id: well-known/tool/packaging/yarn::yarn-cli-bundle-marker
  - id: well-known/tool/development/aube::aube-node-placeholder-reservation
  any:
  - id: objectives/supply-chain/impersonation/manifest/placeholder::js-placeholder-announcement-1
  - id: objectives/supply-chain/impersonation/manifest/placeholder::js-placeholder-announcement-1a
  - id: objectives/supply-chain/impersonation/manifest/placeholder::js-placeholder-announcement-1b
  - id: objectives/supply-chain/impersonation/manifest/placeholder::js-placeholder-announcement-2
  - id: objectives/supply-chain/impersonation/manifest/placeholder::js-placeholder-announcement-3
  - id: objectives/supply-chain/impersonation/manifest/placeholder::js-placeholder-entrypoint-marker
  - id: objectives/supply-chain/impersonation/manifest/placeholder::js-ships-next-release-comment
  - id: objectives/supply-chain/impersonation/manifest/placeholder::js-land-next-release-comment
  - id: objectives/supply-chain/impersonation/manifest/placeholder::js-implementation-next-release-comment
  - id: objectives/supply-chain/impersonation/manifest/placeholder::js-hijacked-package-message
- id: poc-placeholder-package
  desc: Tiny PoC package with test author
  crit: suspicious
  conf: 0.94
  attack: T1195.002
  all:
  - id: metadata/package/freeform::pkg-skeleton-small
  - id: metadata/package/scripts/develop::npm-init-default-test
  - id: metadata/package/description/disclosure::description-mentions-poc
  any:
  - id: objectives/supply-chain/impersonation/manifest/placeholder::placeholder-author-test-handle
  - id: objectives/supply-chain/impersonation/manifest/placeholder::js-malicious-code-executed
  unless:
  - id: metadata/package/repository::has-repository-field
  - id: metadata/package/entrypoint::has-bin-field
  - id: metadata/package/testing/presence/fixture::test-fixture-package-json-path
- id: fake-placeholder-noop
  desc: Small package stub announces no usable implementation
  crit: notable
  conf: 0.85
  for:
  - javascript
  size_max: 1024
  all:
  - id: objectives/supply-chain/impersonation/manifest/placeholder::js-placeholder-announcement
  - id: metadata/file/size::javascript-small-file-5k
  unless:
  - id: metadata/package/testing/harness/
  - id: metadata/lang/javascript-features::cjs-exports-pattern
  - id: metadata/lang/javascript-features::esm-export
  - id: archive-fs-service-worker-msw-module-doc
  - id: archive-fs-service-worker-msw-type-stub
  - id: objectives/supply-chain/trojanized/app/package::parcel-plugin-transformer-marker
  - id: metadata/package/files/name::constants-module-basename
- id: scoped-hollow-index-package
  desc: Scoped hollow package advertises default index
  crit: suspicious
  conf: 0.92
  attack: T1195.002
  mbc: B0024
  all:
  - id: metadata/package/name/vocabulary::scoped-package-name
  - id: metadata/package/scaffold::npm-default-index-sparse-manifest
  - id: metadata/package/dependencies/manifest/presence::npm-no-runtime-dependencies
  unless:
  - id: metadata/package/repository::has-repository-evidence
  - id: metadata/package/entrypoint::has-bin-field
  - id: metadata/package/testing/presence/fixture/
- id: hollow-package-invalid-runtime-type
  desc: Hollow package advertises invalid npm module type
  crit: suspicious
  conf: 0.92
  attack: T1195.002
  mbc: B0024
  all:
  - id: metadata/package/scaffold::npm-default-index-sparse-manifest
  - id: metadata/package/freeform::npm-invalid-package-type-field
  unless:
  - id: metadata/package/repository::has-repository-evidence
  - id: metadata/package/testing/presence/fixture/
- id: dep-conf-placeholder-unlicensed
  desc: Placeholder-described package with UNLICENSED license and repository metadata
  crit: suspicious
  conf: 0.88
  attack: T1195.002
  all:
  - id: metadata/package/description/disclosure::description-mentions-placeholder
  - id: metadata/package/license::npm-unlicensed-declaration
  - id: metadata/package/repository::has-repository-evidence
  unless:
  - id: metadata/package/description/disclosure::security-poc-placeholder-context
- id: npm-empty-files-runtime-dependency-wrapper
  desc: npm tarball ships no code but adds runtime deps
  crit: hostile
  conf: 0.96
  attack: T1195.002
  mbc: B0024
  scope: archive
  for: [npm, tar, package.json, markdown]
  all:
  - id: metadata/package/files/package-json::files-empty-allowlist
  - id: metadata/package/dependencies/manifest/presence::has-runtime-deps
  - id: metadata/package/files/included::npm-publish-root-manifest
  - id: metadata/package/files/included::npm-package-manifest-member
  unless:
  - id: metadata/package/files/included::npm-runtime-code-member
  - id: metadata/package/files/included::npm-root-javascript-member
  - id: metadata/package/dependencies/manifest/name-form::platform-optional-cli-wrapper
    # go-npm-style wrapper: the manifest declares the binary its runtime
    # dependency fetches at install time, so the package is a stated
    # binary-distribution wrapper, not a hollow placeholder.
  - id: metadata/package/config::gobinary-download-declaration
  # Documented code-less distribution bundles are excluded below: Vona and
  # Zova suite metapackages (suite name plus runtime deps on the framework's
  # own module packages), and manifests that describe themselves as
  # dependency metapackages. A squatted name alone stays a downgrade below,
  # since a name costs nothing.
  - id: documented-dependency-metapackage-bundle
  # unless: stays on the file the rule matched. A README in another member
  # is visible only to a container-scoped downgrade.
  downgrade:
    scope: archive
    any:
    - id: metadata/package/documentation/package-metadata::readme-code-fence-opens-with-import
    - id: well-known/lib/web/site-platforms/vona::vona-suite-package-name
    - id: well-known/app/ai/media/miadi::miadi-suite-package-name
- id: npm-empty-files-split-platform-relay-wrapper
  desc: Empty npm package relays to split web/nodejs deps
  crit: hostile
  conf: 0.97
  attack: T1195.002
  mbc: B0024
  scope: archive
  for: [npm, tar, package.json]
  all:
  - id: metadata/package/files/package-json::files-empty-allowlist
  - id: metadata/package/dependencies/manifest/name-form::npm-web-runtime-dependency
  - id: metadata/package/dependencies/manifest/name-form::npm-nodejs-runtime-dependency
  - id: metadata/package/files/included::npm-publish-root-manifest
  - id: metadata/package/files/included::npm-package-manifest-member
  unless:
  - id: metadata/package/files/included::npm-runtime-code-member
  - id: metadata/package/files/included::npm-root-javascript-member
  - id: metadata/package/dependencies/manifest/name-form::platform-optional-cli-wrapper
- id: empty-dotted-typed-client-stub-provenance-gap
  desc: Empty dotted typed-client stub lacks provenance
  crit: suspicious
  conf: 0.94
  attack: T1195.002
  mbc: B0024
  scope: archive
  for: [npm, tar, package.json, javascript]
  all:
  - id: metadata/package/name/vocabulary::npm-dotted-typed-client-name
  - id: metadata/package/placeholder::tiny-commonjs-exports-object
  - id: metadata/package/scripts/develop::npm-init-default-test
  - id: metadata/package/empty::npm-empty-author
  unless:
  - id: metadata/package/repository::has-repository-evidence
  - id: metadata/package/homepage::has-homepage-field

# Admits "placeholder" in the description and ships only a no-op parse
# wrapper, with no repository/bin provenance — common reserved or staging
# stubs. Keep at suspicious: hollowness without an install hook or payload
# is not hostile. (Do not require npm-no-author: pkg-skeleton-small packages
# suppress that baseline via npm-benign-missing-author-context.)
- id: placeholder-described-noop-parse-package
  desc: Placeholder package ships a no-op parse export
  crit: suspicious
  conf: 0.93
  attack: T1195.002
  mbc: B0024
  scope: archive
  for: [npm, package.json, javascript]
  all:
  - id: metadata/package/description/disclosure::description-mentions-placeholder
  - id: metadata/package/placeholder::cjs-parse-export-returns-raw-string
  unless:
  - id: metadata/package/repository::has-repository-evidence
  - id: metadata/package/entrypoint::has-bin-field
  - id: metadata/package/testing/presence/fixture/

# Benign contexts for the hollow dependency-wrapper rules above, kept as
# exceptions so the suppression budget stays on behavioral legs.

# The documented code-less distribution bundles: a suite metapackage
# shipping its framework's own modules (Vona, Zova), or a manifest that
# describes itself as a dependency metapackage with optional plugin
# dependencies.
- id: documented-dependency-metapackage-bundle
  desc: Documented code-less dependency distribution bundle
  crit: exception
  conf: 0.95
  any:
  - id: well-known/lib/web/site-platforms/vona::vona-suite-metapackage-context
  - id: well-known/lib/web/site-platforms/zova::zova-suite-metapackage-context
  - id: described-dependency-metapackage-context

# A manifest that describes itself as a dependency metapackage and carries
# optional dependencies is the documented distribution shape for code-less
# dependency bundles — best-effort plugin deps ride in optionalDependencies
# while the required set installs the real modules.
- id: described-dependency-metapackage-context
  desc: Described metapackage with optional plugin dependencies
  crit: exception
  conf: 0.95
  all:
  - id: metadata/package/description/disclosure::description-declares-dependency-metapackage
  - id: metadata/package/dependencies/manifest/presence::has-optional-deps
