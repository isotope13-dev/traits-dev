# A package.json export that resolves to executable source is a deceptive
# facade when paired with a hidden host-file collection handler.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, archives]
  attack: T1195.002

composite_rules:
  - id: npm-package-json-script-export-with-host-handler
    desc: Deceptive package.json export hides host-file handler
    crit: hostile
    conf: 0.99
    mbc: B0024
    attack: T1195.002,T1005
    scope: archive
    for: [archives]
    all:
      - id: metadata/package/manifest/entrypoint::package-json-subpath-script-export
      - id: objectives/supply-chain/hidden-payload/package::embedded-async-handler-source
      - id: objectives/supply-chain/hidden-payload/package::handler-returns-collected-file-data
      - id: micro-behaviors/fs/file/read::js-reads-multiple-absolute-files
