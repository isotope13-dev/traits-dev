defaults:
  platforms: [unix, windows]
  for: [vsix, zip, package.json]
  attack: T1036.005

composite_rules:
  - id: foreign-publisher-official-vue-brand
    desc: Foreign publisher claims official Vue extension
    crit: suspicious
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: well-known/tool/development/vscode-extension/vue::official-display-name
      - id: well-known/tool/development/vscode-extension/vue::upstream-repository
      - id: well-known/tool/development/vscode-extension/vue::volar-vsix-name
    unless:
      - id: well-known/tool/development/vscode-extension/vue::official-publisher
