defaults:
  platforms: [unix, windows]
  for: [vsix, zip, package.json]
  attack: T1036.005

composite_rules:
  - id: foreign-publisher-official-vue-brand
    desc: Foreign publisher claims official Vue extension
    crit: suspicious
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: well-known/tool/development/vscode-extension/vue::official-display-name
      - id: well-known/tool/development/vscode-extension/vue::upstream-repository
      - id: well-known/tool/development/vscode-extension/vue::volar-vsix-name
    unless:
      - id: well-known/tool/development/vscode-extension/vue::official-publisher

# Microsoft lists Vsceue.volar-vscode as malware, and Secure Annex identified
# it among the Vue impersonators staged for later malicious updates. The
# activation-age clock is only suspicious on its own; paired with this exact
# official-brand impersonation it identifies the staged marketplace malware.
# https://github.com/microsoft/vsmarketplace/blob/main/RemovedPackages.md
# https://secureannex.com/blog/glassworm-continued/
  - id: glassworm-vue-impostor-activation-sleeper
    desc: Vue impersonator carries a dormant activation clock
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1036.005,T1497.003
    scope: archive
    all:
      - id: foreign-publisher-official-vue-brand
      - id: objectives/anti-analysis/timing/delay::republished-extension-activation-age-clock
