# An extension pack whose reason for existing has been taken off the shelf.
#
# A pack ships no code. Its entire function is the list: install the pack and
# the editor installs everything it names. That makes it the cheapest delivery
# mechanism the marketplace has — it passes review as a list of identifiers,
# and the review of what it delivers is somebody else's problem.
#
# The convicting combination is what the list is made of. A long run of
# genuinely popular third-party extensions supplies the reputation; one or two
# entries belonging to the pack's own publisher are what the reputation is
# carrying; and that entry no longer resolves on the marketplace. Extensions are
# removed from the gallery for a reason, and a published pack still hard-naming
# a removed one is a delivery route to something that was withdrawn — while the
# pack itself remains installed and installable.
#
# Requires an actual follow to have happened: the removal is only observable by
# asking the marketplace. On an offline scan the unresolved leg is absent and
# this stays silent, which is correct — nothing in the bytes says the entry is
# gone.
defaults:
  platforms: [unix, windows]
  for: [vsix, zip, archives]
  attack: T1195.002,T1105
  mbc: B0024

composite_rules:
  - id: vsix-pack-delivers-pulled-extension
    desc: Pack delivers an extension pulled from the store
    crit: hostile
    conf: 0.95
    scope: outer
    all:
      - id: metadata/permission/extension-id::vscode-extension-pack-large
      - id: metadata/permission/extension-id::vscode-extension-pack-self-entry
      - id: metadata/permission/extension-id::vscode-extension-pack-mostly-foreign
      - id: metadata/package/dependencies/declaration::unresolved-extension-dependency
