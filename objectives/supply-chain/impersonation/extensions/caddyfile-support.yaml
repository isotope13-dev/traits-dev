# A listing may retain upstream documentation in a legitimate fork. Surface
# the mismatch for review without asserting a malicious payload.
defaults:
  platforms: [unix, windows]
  for: [vsix, zip, package.json, markdown]
  attack: T1036,T1195.002

composite_rules:
  - id: caddyfile-support-foreign-publisher-docs
    desc: Foreign extension links Caddyfile Support listing
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: well-known/tool/development/vscode-extension/caddyfile-support::official-marketplace-link
    unless:
      - id: well-known/tool/development/vscode-extension/caddyfile-support::official-publisher
