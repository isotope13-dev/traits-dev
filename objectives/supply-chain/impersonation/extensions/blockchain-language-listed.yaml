# EchelonStudios "blockchain-language-support" VSIX identity. The 1.0.1 package
# carries no executable code, so the composite is identity-led: a listed
# publisher and extension name, joined to a generative-AI icon. The icon leg is
# the C2PA provenance the identity is expected to carry. Restores the Echelon
# traits dropped from vscode-malware-listed-identities.yaml by 56c5036245c.
#
# Provenance note: the listing source for this identity was not independently
# confirmed in the repo or by public search. Re-verify before relying on the
# identity legs alone.
defaults:
  platforms: [unix, windows]
  for: [vsix]
  attack: T1195.002,T1176

traits:
  - id: echelon-blockchain-listed-publisher
    desc: Threat-feed listed EchelonStudios VSIX publisher
    crit: notable
    conf: 0.99
    if:
      type: value
      path: vsix.identity.publisher
      exact: EchelonStudios
  - id: echelon-blockchain-listed-name
    desc: Threat-feed listed blockchain extension name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: vsix.identity.id
      exact: blockchain-language-support

composite_rules:
  - id: echelon-blockchain-listed-identity
    desc: Listed EchelonStudios extension with generative-AI icon provenance
    crit: hostile
    conf: 0.99
    for: [vsix, png]
    scope: outer
    all:
      - id: echelon-blockchain-listed-publisher
      - id: echelon-blockchain-listed-name
      - id: metadata/file/format/media::c2pa-generative-ai-source
