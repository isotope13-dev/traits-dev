# A VS Code marketplace listing assembled rather than written: the Yeoman
# generator's output published as-is, dressed in a generated icon and a README
# that credits the extension it is standing in for.
#
# The economics are the point. Occupying a searchable name — `solidity`,
# `flutter`, `prettier` — costs a publisher account and ten minutes, and the
# resulting listing inherits the search traffic of the real thing. The first
# version ships nothing, which is what makes it survive review; the payload
# arrives in an update, once the install count is real. Catching the shell is
# the only chance to catch it before that.
#
# Keyed on the shape rather than on any one template string: a package with no
# way to run code, plus two independent signs that its identity was
# manufactured — generator boilerplate nobody edited, a grammar still scoped
# for the language it was copied from, an icon whose own content credentials
# say a model drew it, prose crediting the original project. A first-time
# author publishing an honest theme trips at most one.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1036
  mbc: B0032

composite_rules:
  - id: vscode-generated-skeleton-extension
    desc: Generated skeleton VS Code extension listing
    crit: suspicious
    conf: 0.9
    for: [vsix, zip, archives]
    # The manifest, README, changelog, grammar and icon are separate archive
    # entries, so the evidence has to pool across the VSIX.
    scope: archive
    all:
      - id: metadata/package/manifest/entrypoint::vscode-extension-no-entry-point
    needs: 2
    any:
      - id: metadata/build/scaffold::vscode-generator-readme-boilerplate
      - id: metadata/build/scaffold::vscode-generator-changelog-boilerplate
      - id: metadata/build/scaffold::tmlanguage-generator-default-scope
      - id: metadata/image/provenance::c2pa-generative-ai-source
      - id: metadata/package/documentation::readme-credits-original-project
