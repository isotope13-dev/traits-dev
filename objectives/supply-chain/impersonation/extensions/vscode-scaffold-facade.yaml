# A VS Code marketplace listing assembled rather than written: the Yeoman
# generator's output published as-is, dressed in a generated icon and a README
# that credits the extension it is standing in for.
#
# The economics are the point. Occupying a searchable name — `solidity`,
# `flutter`, `prettier` — costs a publisher account and ten minutes, and the
# resulting listing inherits the search traffic of the real thing. The first
# version ships nothing, which is what makes it survive review; the payload
# arrives in an update, once the install count is real. Catching the shell is
# the only chance to catch it before that.
#
# Keyed on the shape rather than on any one template string: a package with no
# way to run code, plus two independent signs that its identity was
# manufactured — generator boilerplate nobody edited, a grammar still scoped
# for the language it was copied from, an icon whose own content credentials
# say a model drew it, prose crediting the original project. A first-time
# author publishing an honest theme trips at most one.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1036
  mbc: B0032
  for: [vsix, zip, archives]

composite_rules:
  - id: vscode-generated-skeleton-extension
    desc: Generated skeleton VS Code extension listing
    crit: suspicious
    conf: 0.9
    # The manifest, README, changelog, grammar and icon are separate archive
    # entries, so the evidence has to pool across the VSIX.
    scope: archive
    all:
      - id: metadata/package/manifest/entrypoint::vscode-extension-no-entry-point
    needs: 2
    any:
      - id: metadata/build/scaffold::vscode-generator-readme-boilerplate
      - id: metadata/build/scaffold::vscode-generator-changelog-boilerplate
      - id: metadata/build/scaffold::tmlanguage-generator-default-scope
      - id: metadata/image/provenance::c2pa-generative-ai-source
      - id: metadata/package/documentation::readme-credits-original-project

  # The published product IS the generator's Hello World sample. Not "built on
  # the template" — the template, with the message box still in it. Nobody
  # ships that on purpose: the listing exists to hold a searchable name
  # (`bitcoin-toolkit`, `hardhat-toolkit`, `solana-toolkit` — the same file
  # three times) until an update can carry a payload to the install base it
  # accumulated.
  #
  # The single-command requirement is what separates this from an honest first
  # extension. Developers routinely leave the generated Hello World command in
  # place and build beside it — a real utility with the sample still bolted on
  # is a tidiness problem, not a deception. An extension whose *only* palette
  # entry is the generator's has nothing built beside it at all. The remaining
  # `any:` leg then requires the generated body to still be in the shipped code,
  # so a manifest edited without touching the bundle does not qualify either.
  - id: vscode-hello-world-sample-published
    desc: Published extension is the generator sample
    crit: suspicious
    conf: 0.92
    scope: archive
    all:
      - id: metadata/package/manifest/runtime::vscode-extension
      - id: metadata/build/scaffold::vscode-generator-hello-world-command
      - id: metadata/package/manifest/entrypoint::vscode-single-contributed-command
    needs: 1
    any:
      - id: metadata/build/scaffold::vscode-generator-activation-log
      - id: metadata/build/scaffold::vscode-generator-hello-world-message

  # The documentation describes a product the manifest disproves: a settings
  # section for configuration keys the extension never contributes. VS Code
  # surfaces settings only from `contributes.configuration`, so keys documented
  # without it cannot exist at any version — the README is describing software
  # that was never written, which is the whole method of a listing that sells
  # a feature list rather than a build.
  - id: vscode-documents-absent-settings
    desc: README documents settings the manifest lacks
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: metadata/package/manifest/runtime::vscode-extension
      - id: metadata/build/scaffold::readme-documents-extension-settings
      - id: metadata/package/manifest/entrypoint::vscode-configuration-contribution-absent
