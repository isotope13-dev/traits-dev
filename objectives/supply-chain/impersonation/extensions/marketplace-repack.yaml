# A compiled VS Code extension bundle embedding Marketplace-stamped __metadata
# (which is only added after packaging on the Marketplace), republished under
# a foreign publisher that differs from the repository owner and activates on
# all events (*).
defaults:
  platforms: [unix, windows]
  for: [vsix, zip, package.json, javascript, typescript]
  attack: T1195.002,T1036

composite_rules:
  - id: vscode-repackaged-marketplace-bundle
    desc: Repackaged Marketplace extension with wildcard activation
    crit: hostile
    conf: 0.90
    scope: archive
    all:
      - id: metadata/package/author/identity::vscode-bundled-marketplace-metadata
      - id: metadata/package/repository::vsix-publisher-repo-owner-mismatch
      - id: metadata/permission/activation::activate-all-events
