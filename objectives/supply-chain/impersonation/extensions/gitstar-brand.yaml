defaults:
  platforms: [unix, windows]
  for: [vsix, package.json]
  attack: T1036.005

composite_rules:
  - id: foreign-publisher-gitstar-brand
    desc: Foreign publisher uses Gitstar extension identity
    crit: suspicious
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: well-known/tool/development/vscode-extension/gitstar::gitstar-extension-name
      - id: well-known/tool/development/vscode-extension/gitstar::gitstar-repository
    unless:
      - id: well-known/tool/development/vscode-extension/gitstar::gitstar-publisher
