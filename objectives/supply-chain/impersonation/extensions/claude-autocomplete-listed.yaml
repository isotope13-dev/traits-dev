# The exact identity is in Microsoft's removal history as Impersonation,
# dated 2025-12-15. The reviewed API client uses Anthropic's actual endpoint;
# this classification does not imply a credential-stealing recipient.
# https://github.com/microsoft/vsmarketplace/blob/main/RemovedPackages.md
defaults:
  platforms: [unix, windows]
  for: [vsix]
  attack: T1036.005

traits:
  - id: claude-autocomplete-listed-publisher
    desc: Removed Claude autocomplete publisher identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: vsix.identity.publisher
      exact: siffat-ahmed
  - id: claude-autocomplete-listed-name
    desc: Removed Claude autocomplete extension name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: vsix.identity.id
      exact: ai-autocomplete-siffat-ahmed

composite_rules:
  - id: claude-autocomplete-listed-impersonation
    desc: Microsoft removed this Claude autocomplete identity for impersonation
    crit: suspicious
    conf: 0.99
    all:
      - id: claude-autocomplete-listed-publisher
      - id: claude-autocomplete-listed-name
