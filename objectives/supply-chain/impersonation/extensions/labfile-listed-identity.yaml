# Labfile VSIX (labfile.labfile): Microsoft's removal history lists the extension
# as malware (removed 2025-10-20). Restores the labfile composite dropped from
# vscode-malware-listed-identities.yaml by 56c5036245c. The compound requires the
# listed publisher and the listed extension name; it does not pin a release
# because the listing covers the identity. The verdict rests on the feed
# listing, not on bytes: the bundled code is an ordinary language extension.
defaults:
  platforms: [unix, windows]
  for: [vsix]
  attack: T1195.002,T1176

composite_rules:
  - id: labfile-malware-listed-identity
    desc: Microsoft listed Labfile extension as malware
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/author/publisher::labfile-malware-publisher
      - id: metadata/package/name/identity::labfile-malware-name
