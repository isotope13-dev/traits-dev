# Microsoft lists these exact VSIX publisher/extension identifiers as
# Malware. The sample releases also have the staged multi-day activation
# clock used by GlassWorm impersonators. These findings identify the listed
# distributions and do not claim the dormant clock itself executes a payload.
# https://github.com/microsoft/vsmarketplace/blob/main/RemovedPackages.md
# https://secureannex.com/blog/glassworm-continued/
defaults:
  platforms: [unix, windows]
  for: [vsix]
  attack: T1195.002,T1036.005,T1497.003

traits:
  - id: glassworm-shiny-app-publisher
    desc: Microsoft listed Shiny VSIX publisher
    crit: notable
    conf: 0.99
    if:
      type: value
      path: vsix.identity.publisher
      exact: eamodas
  - id: glassworm-shiny-app-name
    desc: Microsoft listed Shiny VSIX extension name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: vsix.identity.id
      exact: shiny-vscode
  - id: glassworm-sync-settings-publisher
    desc: Microsoft listed Sync Settings VSIX publisher
    crit: notable
    conf: 0.99
    if:
      type: value
      path: vsix.identity.publisher
      exact: cweijamysq
  - id: glassworm-sync-settings-name
    desc: Microsoft listed Sync Settings VSIX extension name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: vsix.identity.id
      exact: sync-settings-vscode
  - id: glassworm-icon-theme-publisher
    desc: Microsoft listed Iconesvscode VSIX publisher
    crit: notable
    conf: 0.99
    if:
      type: value
      path: vsix.identity.publisher
      exact: bphpburnsus
  - id: glassworm-icon-theme-name
    desc: Microsoft listed Iconesvscode VSIX extension name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: vsix.identity.id
      exact: Iconesvscode
  - id: glassworm-react-native-publisher
    desc: Microsoft listed React Native VSIX publisher
    crit: notable
    conf: 0.99
    if:
      type: value
      path: vsix.identity.publisher
      exact: msjsdreact
  - id: glassworm-react-native-name
    desc: Microsoft listed React Native VSIX extension name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: vsix.identity.id
      exact: react-native-vsce
  - id: glassworm-basedpyright-publisher
    desc: Microsoft listed BasedPyright VSIX publisher
    crit: notable
    conf: 0.99
    if:
      type: value
      path: vsix.identity.publisher
      exact: ovixcodes
  - id: glassworm-basedpyright-name
    desc: Microsoft listed BasedPyright VSIX extension name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: vsix.identity.id
      exact: basedpyright-vscode

composite_rules:
  - id: glassworm-shiny-app-identity
    desc: Microsoft listed Shiny extension distribution identity
    crit: hostile
    conf: 0.99
    all:
      - id: glassworm-shiny-app-publisher
      - id: glassworm-shiny-app-name
  - id: glassworm-sync-settings-identity
    desc: Microsoft listed Sync Settings extension distribution identity
    crit: hostile
    conf: 0.99
    all:
      - id: glassworm-sync-settings-publisher
      - id: glassworm-sync-settings-name
  - id: glassworm-icon-theme-identity
    desc: Microsoft listed Iconesvscode extension distribution identity
    crit: hostile
    conf: 0.99
    all:
      - id: glassworm-icon-theme-publisher
      - id: glassworm-icon-theme-name
  - id: glassworm-react-native-identity
    desc: Microsoft listed React Native extension distribution identity
    crit: hostile
    conf: 0.99
    all:
      - id: glassworm-react-native-publisher
      - id: glassworm-react-native-name
  - id: glassworm-basedpyright-identity
    desc: Microsoft listed BasedPyright extension distribution identity
    crit: hostile
    conf: 0.99
    all:
      - id: glassworm-basedpyright-publisher
      - id: glassworm-basedpyright-name
