# A foreign publisher can retain an upstream link in a legitimate fork.
defaults:
  platforms: [unix, windows]
  for: [vsix, zip, package.json, markdown]
  attack: T1036,T1195.002

composite_rules:
  - id: basedpyright-foreign-publisher-docs
    desc: Foreign extension links BasedPyright listing
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: well-known/tool/development/vscode-extension/basedpyright::official-marketplace-link
    unless:
      - id: well-known/tool/development/vscode-extension/basedpyright::official-publisher
