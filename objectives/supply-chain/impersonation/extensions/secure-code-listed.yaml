# Microsoft lists this exact identity as Malware (2026-01-31).
# https://github.com/microsoft/vsmarketplace/blob/main/RemovedPackages.md
# The similar AhmedSleem.secure-code entry is a different identity.
defaults:
  platforms: [unix, windows]
  for: [vsix]
  attack: T1195.002

traits:
  - id: secure-codee-malware-publisher
    desc: Microsoft listed SecureCodee publisher
    crit: notable
    conf: 0.99
    if:
      type: value
      path: vsix.identity.publisher
      exact: AhmedSlem
  - id: secure-codee-malware-name
    desc: Microsoft listed SecureCodee extension name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: vsix.identity.id
      exact: secure-codee

composite_rules:
  - id: secure-codee-malware-listed-identity
    desc: Microsoft listed SecureCodee distribution as malware
    crit: hostile
    conf: 0.99
    all:
      - id: secure-codee-malware-publisher
      - id: secure-codee-malware-name
