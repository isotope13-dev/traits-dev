defaults:
  platforms: [unix, windows]
  for: [vsix, zip, package.json]
  attack: T1036.005

traits:
  # Microsoft lists csvmech.csvrainbow as Malware. The exact VSIX identity is
  # the evidence for this delivery verdict; the sampled build does not contain
  # an active payload.
  # https://github.com/microsoft/vsmarketplace/blob/main/RemovedPackages.md
  - id: csv-rainbow-malware-publisher
    desc: Microsoft listed Rainbow CSV publisher
    crit: notable
    conf: 0.99
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: csvmech
  - id: csv-rainbow-malware-name
    desc: Microsoft listed Rainbow CSV extension name
    crit: notable
    conf: 0.99
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: csvrainbow

composite_rules:
  - id: csv-rainbow-malware-delivery-identity
    desc: Microsoft listed Rainbow CSV extension delivery identity
    crit: hostile
    conf: 0.99
    for: [vsix]
    all:
      - id: csv-rainbow-malware-publisher
      - id: csv-rainbow-malware-name

  - id: foreign-publisher-rainbow-csv-brand
    desc: Foreign publisher uses Rainbow CSV branding
    crit: suspicious
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: well-known/tool/development/vscode-extension/rainbow-csv::vscode-name
      - id: well-known/tool/development/vscode-extension/rainbow-csv::display-name
      - id: well-known/tool/development/vscode-extension/rainbow-csv::upstream-repository
    unless:
      - id: well-known/tool/development/vscode-extension/rainbow-csv::official-publisher
