defaults:
  platforms: [unix, windows]
  for: [vsix, zip, package.json]
  attack: T1036.005

composite_rules:
  - id: foreign-publisher-rainbow-csv-brand
    desc: Foreign publisher uses Rainbow CSV branding
    crit: suspicious
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: well-known/tool/development/vscode-extension/rainbow-csv::vscode-name
      - id: well-known/tool/development/vscode-extension/rainbow-csv::display-name
      - id: well-known/tool/development/vscode-extension/rainbow-csv::upstream-repository
    unless:
      - id: well-known/tool/development/vscode-extension/rainbow-csv::official-publisher
