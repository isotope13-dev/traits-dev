---
defaults:
  platforms:
  - unix
  - windows
  for:
  - vsix
  attack: T1036.005,T1176
traits:
- id: embeddteam-impersonation-publisher
  desc: Microsoft-listed EmbedDTeam publisher
  crit: notable
  conf: 0.99
  if:
    type: value
    path: vsix.identity.publisher
    exact: embeddteam
- id: embeddteam-build-analyzer-impersonation-name
  desc: Microsoft-listed Embedded Build Analyzer
  crit: notable
  conf: 0.99
  if:
    type: value
    path: vsix.identity.id
    exact: embedded-build-analyzer
- id: embeddteam-cortex-debug-impersonation-name
  desc: Microsoft-listed Embedded Cortex-Debug
  crit: notable
  conf: 0.99
  if:
    type: value
    path: vsix.identity.id
    exact: embedded-cortex-debug
- id: embeddteam-project-manager-impersonation-name
  desc: Microsoft-listed Embedded Project Manager
  crit: notable
  conf: 0.99
  if:
    type: value
    path: vsix.identity.id
    exact: embeddedprojectmanager
- id: embeddteam-version-1-1-3
  desc: VS Code extension release version is 1.1.3
  crit: notable
  conf: 0.99
  if:
    type: value
    path: vsix.identity.version
    exact: 1.1.3
- id: embeddteam-version-1-14-0
  desc: VS Code extension release version is 1.14.0
  crit: notable
  conf: 0.99
  if:
    type: value
    path: vsix.identity.version
    exact: 1.14.0
- id: embeddteam-version-1-14-1
  desc: VS Code extension release version is 1.14.1
  crit: notable
  conf: 0.99
  if:
    type: value
    path: vsix.identity.version
    exact: 1.14.1
- id: embeddteam-version-0-0-2
  desc: VS Code extension release version is 0.0.2
  crit: notable
  conf: 0.99
  if:
    type: value
    path: vsix.identity.version
    exact: 0.0.2
composite_rules:
- id: embeddteam-build-analyzer-impersonation
  desc: Microsoft listed Build Analyzer as impersonation
  crit: suspicious
  conf: 0.99
  all:
  - id: embeddteam-impersonation-publisher
  - id: embeddteam-build-analyzer-impersonation-name
  - id: embeddteam-version-1-1-3
- id: embeddteam-cortex-debug-1-14-0-impersonation
  desc: Microsoft listed Cortex-Debug release as impersonation
  crit: suspicious
  conf: 0.99
  all:
  - id: embeddteam-impersonation-publisher
  - id: embeddteam-cortex-debug-impersonation-name
  - id: embeddteam-version-1-14-0
- id: embeddteam-cortex-debug-1-14-1-impersonation
  desc: Microsoft listed Cortex-Debug release as impersonation
  crit: suspicious
  conf: 0.99
  all:
  - id: embeddteam-impersonation-publisher
  - id: embeddteam-cortex-debug-impersonation-name
  - id: embeddteam-version-1-14-1
- id: embeddteam-project-manager-0-0-1-impersonation
  desc: Microsoft listed Project Manager as impersonation
  crit: suspicious
  conf: 0.99
  all:
  - id: embeddteam-impersonation-publisher
  - id: embeddteam-project-manager-impersonation-name
  - id: objectives/supply-chain/impersonation/extensions::vscode-extension-version-0-0-1
- id: embeddteam-project-manager-0-0-2-impersonation
  desc: Microsoft listed Project Manager as impersonation
  crit: suspicious
  conf: 0.99
  all:
  - id: embeddteam-impersonation-publisher
  - id: embeddteam-project-manager-impersonation-name
  - id: embeddteam-version-0-0-2
