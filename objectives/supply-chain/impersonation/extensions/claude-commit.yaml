# A separately published copy retains the upstream repository and extension
# name, enables startup activation, and contains a post-source-map ID report.
# These observations warrant review; they do not establish a malicious payload.
defaults:
  platforms: [unix, windows]
  for: [vsix, zip, package.json, javascript, typescript]
  attack: T1036,T1195.002

composite_rules:
  - id: claude-commit-foreign-startup-identity-post
    desc: Repackaged Claude Commit reports startup identity
    crit: suspicious
    conf: 0.92
    scope: archive
    all:
      - id: well-known/tool/development/vscode-extension/claude-commit::name
      - id: well-known/tool/development/vscode-extension/claude-commit::repository
      - id: metadata/permission/activation::on-startup-finished
      - id: micro-behaviors/communications/http/telemetry::source-map-trailer-identity-post
    unless:
      - id: well-known/tool/development/vscode-extension/claude-commit::publisher
