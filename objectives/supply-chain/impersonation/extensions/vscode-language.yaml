defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1036,T1195.002

composite_rules:
  - id: vscode-language-checksum-facade
    desc: Language-themed VS Code extension exposes an unrelated checksum command
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/package/manifest/runtime::vscode-language-purpose-claim
      - id: metadata/package/manifest/runtime::vscode-localizations-absent
      - id: metadata/package/manifest/runtime::vscode-checksum-command
  - id: vscode-syntax-facade-no-grammar
    desc: VS Code extension claims editor support without language grammars
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/package/manifest/runtime::vscode-extension
      - id: metadata/package/manifest/runtime::vscode-editor-product-description
      - id: metadata/package/manifest/runtime::vscode-languages-contribution-absent
      - id: metadata/package/manifest/runtime::vscode-grammars-contribution-absent
