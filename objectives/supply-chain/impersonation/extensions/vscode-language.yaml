defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [package.json]
  attack: T1036,T1195.002

composite_rules:
  - id: vscode-language-checksum-facade
    desc: Language-themed VS Code extension exposes an unrelated checksum command
    conf: 0.96
    all:
      - id: metadata/package/runtime::vscode-language-purpose-claim
      - id: metadata/package/runtime::vscode-localizations-absent
      - id: metadata/package/runtime::vscode-checksum-command
  - id: vscode-language-facade-delivers-startup-payload
    desc: Language-themed VS Code extension disguises a startup batch dropper
    crit: hostile
    conf: 0.995
    attack: T1036,T1059.007,T1105,T1195.002,T1553.004
    mbc: B0024,E1105
    for: [vsix, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/runtime::vscode-language-purpose-claim
      - id: metadata/package/runtime::vscode-checksum-command
      - id: metadata/permission/activation::on-startup-finished
      - id: well-known/lib/development/vscode::require-vscode
      - id: micro-behaviors/communications/tls/verify/disable::encoded-curl-insecure-tls
      - id: micro-behaviors/fs/path/temp::temporary-batch-path-reference
      - id: micro-behaviors/fs/path/extension::batch-command-extension-literal
      - id: micro-behaviors/process/create/shell/bridge::js-exec-wrapper-with-hidden-options
