defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1036,T1195.002

composite_rules:
  - id: vscode-language-checksum-facade
    desc: Language-themed VS Code extension exposes an unrelated checksum command
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/package/manifest/runtime::vscode-language-purpose-claim
      - id: metadata/package/manifest/runtime::vscode-localizations-absent
      - id: metadata/package/manifest/runtime::vscode-checksum-command
  # The listing promises a service the package cannot perform. Linting and
  # diagnostics come from extension code VS Code loads at activation; a
  # manifest that declares no `main`, no `browser` and no `activationEvents`
  # has none to load, so the description is describing an extension that was
  # never written. Marketplace squatters lean on exactly this gap: the gallery
  # renders the prose, not the file list, so a grammar-and-snippets shell reads
  # as a full language toolchain to anyone browsing.
  #
  # A theme or grammar pack has no entry point either, but does not claim
  # linting — the claim is what separates them, so both legs are required.
  - id: vscode-analysis-claim-without-code
    desc: Extension claims analysis but ships no code
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/package/manifest/runtime::vscode-code-analysis-description
      - id: metadata/package/manifest/entrypoint::vscode-extension-no-entry-point
  - id: vscode-syntax-facade-no-grammar
    desc: VS Code extension claims editor support without language grammars
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/package/manifest/runtime::vscode-extension
      - id: metadata/package/manifest/runtime::vscode-editor-product-description
      - id: metadata/package/manifest/runtime::vscode-languages-contribution-absent
      - id: metadata/package/manifest/runtime::vscode-grammars-contribution-absent
