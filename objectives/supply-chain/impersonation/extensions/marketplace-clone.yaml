# A VS Code extension that is a republished copy of a well-known agent, shipped
# under a publisher that is not the upstream vendor's.
#
# The artifact asserts two identities at once. Its VSIX manifest and package
# publisher belong to the repackager, but the same package still credits the
# upstream vendor as `author`, and the localized documentation it bundles still
# tells the reader to install the upstream vendor's own marketplace listing.
# An honest fork rewrites both; a clone built by find-and-replace over the
# upstream tree leaves the vendor attribution and the upstream install links in
# place, because they were never part of the branding it set out to change.
#
# The victim installs a listing that borrows the upstream product's name,
# reviews, tags and screenshots, and then runs a build the upstream vendor
# never shipped or signed.
#
# Keyed on the identity contradiction rather than on any one publisher, so it
# holds for the next rebrand of the same upstream tree.
defaults:
  platforms: [unix, windows]
  attack: "T1195.002,T1036"
  mbc: B0032

composite_rules:
  - id: cline-agent-republished-under-foreign-publisher
    desc: Cline agent republished under a non-Cline publisher
    crit: hostile
    conf: 0.93
    for: [vsix]
    # The author field lives in extension/package.json and the upstream install
    # links live in the bundled locale READMEs, so the evidence has to pool
    # across archive entries.
    scope: archive
    all:
      # The shipped manifest still names the upstream vendor as its author...
      - id: well-known/app/ai/coding-agent/cline::vendor-author-name
      # ...and the bundled docs still point readers at the upstream listing.
      - id: well-known/app/ai/coding-agent/cline::upstream-marketplace-listing-link
    unless:
      # ...yet nothing in the package is published by the upstream vendor.
      - id: well-known/app/ai/coding-agent/cline::publisher
      - id: well-known/app/ai/coding-agent/cline::vsix-publisher
      - id: well-known/app/ai/coding-agent/cline::package-name
      - id: well-known/app/ai/coding-agent/cline::claude-dev-package-name

  # GitLens republished under someone else's listing.
  #
  # Same shape as the Cline rule above, keyed on the half a repackager keeps
  # rather than the half they change. Identity fields — `name`, `publisher` —
  # are the first thing rewritten, because the whole point is to own a separate
  # listing; the marketplace description is rewritten last or never, because it
  # is what convinces someone to click install. So the product's own marketing
  # copy under a publisher that is not the product's is the contradiction.
  #
  # The sample that motivated this ships as `wlnxingdev.free-senltig` — the
  # brand scrambled into something searchable-adjacent — carrying GitLens's
  # description word for word. Keying on the copy rather than on the scramble
  # means the next rearrangement of the letters is covered too.
  - id: gitlens-republished-under-foreign-publisher
    desc: GitLens republished under a foreign publisher
    crit: hostile
    conf: 0.93
    for: [vsix, zip, archives]
    scope: archive
    all:
      - id: well-known/app/development/vscode-extension/gitlens::gitlens-marketing-description
    unless:
      - id: well-known/app/development/vscode-extension/gitlens::gitlens-publisher
      - id: well-known/app/development/vscode-extension/gitlens::gitlens-package-name
      - id: well-known/app/development/vscode-extension/gitlens::gitlens-extension-path
