# Objective rules require evidence beyond upstream attribution.
defaults:
  crit: hostile
  conf: 0.93
  platforms: [unix, windows]
  attack: "T1195.002,T1036"
  mbc: B0032

composite_rules:
  - id: cline-native-wrapper-foreign-optional-deps
    desc: Cline wrapper ships foreign scoped native binaries
    for: [npm, tar, zip, package.json, javascript]
    scope: archive
    all:
      - id: well-known/app/ai/coding-agent/cline::vendor-author-name
      - id: metadata/package/dependencies/manifest/name-form::platform-optional-cli-wrapper
      - id: micro-behaviors/os/package-manager/publish::npm-wrapper-resolves-cline-platform-package
    unless:
      - id: well-known/app/ai/coding-agent/cline::package-name
      - id: well-known/app/ai/coding-agent/cline::claude-dev-package-name
      - id: well-known/app/ai/coding-agent/cline::npm-scoped-cline-package-name
      - id: metadata/package/dependencies/manifest/name-form::manifest-optional-cline-scoped-native-cli-deps

  - id: npm-fresh-cline-identity-squat
    desc: Fresh npm release impersonates Cline identity
    for: [npm, tar, zip, registry, package.json, markdown]
    scope: outer
    all:
      - id: metadata/registry::brand-new-package
      - id: metadata/registry::publish-burst-24h
      - id: well-known/app/ai/coding-agent/cline::vendor-author-name
      - id: well-known/app/ai/coding-agent/cline::source-repository
    unless:
      - id: well-known/app/ai/coding-agent/cline::package-name
      - id: well-known/app/ai/coding-agent/cline::claude-dev-package-name
      - id: well-known/app/ai/coding-agent/cline::npm-scoped-cline-package-name

  # GitLens republished under someone else's listing.
  #
  # Same shape as the Cline rule above, keyed on the half a repackager keeps
  # rather than the half they change. Identity fields — `name`, `publisher` —
  # are the first thing rewritten, because the whole point is to own a separate
  # listing; the marketplace description is rewritten last or never, because it
  # is what convinces someone to click install. So the product's own marketing
  # copy under a publisher that is not the product's is the contradiction.
  #
  # The sample that motivated this ships as `wlnxingdev.free-senltig` — the
  # brand scrambled into something searchable-adjacent — carrying GitLens's
  # description word for word. Keying on the copy rather than on the scramble
  # means the next rearrangement of the letters is covered too.
  - id: gitlens-republished-under-foreign-publisher
    crit: suspicious
    desc: GitLens republished under a foreign publisher
    for: [vsix, zip, javascript, package.json]
    scope: archive
    all:
      - id: well-known/tool/development/vscode-extension/gitlens::gitlens-marketing-description
    unless:
      - id: well-known/tool/development/vscode-extension/gitlens::gitlens-publisher
      - id: well-known/tool/development/vscode-extension/gitlens::gitlens-package-name
      - id: well-known/tool/development/vscode-extension/gitlens::gitlens-extension-path

  # DBCode is closed source and ships its bundle obfuscated, so a repackager
  # keeps the vendor's compiled code byte for byte and rewrites the listing —
  # name, publisher, description, repository — around it. The code is the half
  # that survives: the main bundle naming DBCode plus the execution-plan UI's
  # custom element. Under any publisher but DBCode's own, that is the vendor's
  # product on someone else's listing.
  - id: dbcode-republished-under-foreign-publisher
    crit: suspicious
    desc: DBCode code republished under a foreign publisher
    for: [vsix, zip, javascript, package.json]
    scope: archive
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: well-known/tool/development/vscode-extension/dbcode::extension-main-bundle
      - id: well-known/tool/development/vscode-extension/dbcode::execution-plan-ui-bundle
    unless:
      - id: well-known/tool/development/vscode-extension/dbcode::publisher

  # The vendor's DBCode never declares an extension pack. A republished copy
  # that adds one uses the borrowed reputation to install another extension
  # the user never chose: the clone exists to deliver what the pack names.
  - id: dbcode-clone-pack-installs-extension
    desc: DBCode clone pack-installs another extension
    conf: 0.9
    attack: "T1195.002,T1036,T1176"
    for: [vsix, zip, javascript, package.json]
    scope: archive
    all:
      - id: dbcode-republished-under-foreign-publisher
      - id: metadata/package/dependencies/declaration::vscode-extension-pack-entry
