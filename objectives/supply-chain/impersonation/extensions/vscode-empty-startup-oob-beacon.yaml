# A namespace-squat "placeholder" extension: it contributes no commands,
# views or languages, activates as soon as the editor starts, and its only
# code reports the machine hostname to an out-of-band collector. Whatever the
# stated research purpose, it is an unrequested install-time beacon delivered
# under a trusted publisher name, and a later version could ship anything.
defaults:
  platforms: [unix, windows]
  for: [vsix-archive, javascript, package.json]
  attack: T1195.002,T1036

composite_rules:
  - id: vscode-no-surface-startup-hostname-oob-beacon
    desc: Contribution-less extension beacons hostname at startup
    crit: hostile
    conf: 0.97
    scope: outer
    all:
      - id: metadata/package/runtime::vscode-no-contributions
      - id: metadata/permission/activation::on-startup-finished
      - id: micro-behaviors/communications/url/host/oob/callback-url
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
