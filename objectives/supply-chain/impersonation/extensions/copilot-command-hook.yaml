# A third-party extension that activates on GitHub Copilot's command IDs and
# then asks for an account password in a masked input box: it rides the
# user's trust in Copilot to present a credential prompt that appears when
# Copilot is used. GitHub's own publishers are exempt. All legs are atoms so
# the archive scope can join the manifest to the bundled code.
defaults:
  platforms: [unix, windows]
  for: [vsix, zip, package.json, javascript, typescript]
  attack: T1036,T1056.002
composite_rules:
  - id: copilot-command-hook-password-prompt
    desc: Foreign extension hooks Copilot commands and prompts for a password
    crit: hostile
    conf: 0.92
    scope: archive
    all:
      - id: metadata/permission/activation::copilot-command-activation
      - id: micro-behaviors/ui/controls/credential::vscode-masked-input-box
      - id: micro-behaviors/ui/dialog/prompt::enter-password-prompt
    unless:
      - id: metadata/package/runtime::vscode-first-party-copilot-publisher
