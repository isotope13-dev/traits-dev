# An extension whose entire function is to be installed next to a real one.
#
# The construction: take a popular extension's marketplace identity — its
# display name, its repository and homepage URLs, a version number from its
# release series — publish it under your own publisher account, contribute
# nothing, declare a hard `extensionDependencies` on the genuine article, and
# activate on `*`.
#
# Every part of that pays for itself. The stolen identity wins the search
# result. The hard dependency means the real extension is installed too, so the
# victim's Flutter/Python/Go tooling works exactly as advertised and no support
# ticket is ever filed. The empty `contributes` block means there is no command
# to audit. And `*` activation means the wrapper's `activate()` runs in every
# window the victim opens, forever — which is the only thing it was ever for.
# What runs there can arrive in any later version.
#
# The three legs are what a legitimate extension cannot hold at once. A real
# companion extension contributes something; a real dependency wrapper does not
# need to wake for every file the user opens. Nothing here reads the shipped
# code, so it holds whether `activate()` is currently empty, a beacon, or a
# loader.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002,T1036
  mbc: B0032

composite_rules:
  - id: vscode-dependency-wrapper-no-surface
    desc: Wrapper extension adds no surface of its own
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/package/manifest/runtime::vscode-extension
      - id: metadata/package/dependencies/declaration::vscode-extension-dependency-declared
      - id: metadata/permission/activation::activate-all-events
      - id: metadata/package/manifest/entrypoint::vscode-empty-contributed-commands
