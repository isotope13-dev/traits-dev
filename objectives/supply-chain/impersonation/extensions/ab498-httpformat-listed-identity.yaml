# ab-498 "httpformat" VSIX: Microsoft lists the 1.1.0 release as malware
# (removal 6/24/2025). The hostile compound requires the listed publisher, the
# extension name and the exact listed release, so it convicts the listed release
# and no other. Restores the ab498-httpformat composite dropped from
# vscode-malware-listed-identities.yaml by 56c5036245c. The verdict rests on the
# feed listing, not on bytes: the bundled code is a stock formatter wrapper.
#
# A different release of the same publisher and name is only suspicious: the
# listing names 1.1.0, so other releases are unverified.
defaults:
  platforms: [unix, windows]
  for: [vsix]
  attack: T1195.002,T1176

composite_rules:
  - id: ab498-httpformat-1-1-0-listed-identity
    desc: Microsoft-listed ab-498 httpformat 1.1.0 malware release
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/author/publisher::ab498-listed-publisher
      - id: metadata/package/name/identity::ab498-httpformat-extension-name
      - id: metadata/package/version::ab498-httpformat-release-1-1-0

  - id: ab498-httpformat-other-release-identity
    desc: ab-498 httpformat under an unlisted release version
    crit: suspicious
    conf: 0.8
    scope: file
    all:
      - id: metadata/package/author/publisher::ab498-listed-publisher
      - id: metadata/package/name/identity::ab498-httpformat-extension-name
    unless:
      - id: metadata/package/version::ab498-httpformat-release-1-1-0
