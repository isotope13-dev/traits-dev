defaults:
  for:
    - "lua"
    - "zip"
  platforms:
    - "unix"
    - "windows"
composite_rules:
  - id: "lua-editor-concealed-sidecar-bundle"
    desc: "Editor native-script hook accompanies a concealed Defender-bypass runtime"
    crit: "hostile"
    conf: 0.97
    all:
      - id: "micro-behaviors/process/deploy/interpreter-command::lua-module-native-interpreter-helper"
      - id: "objectives/anti-static/obfuscation/encoding/base64::lua-escaped-table-radix64-concealment"
      - id: well-known/lib/ui/wxstyledtextctrl::lua-editor-language-spec
      - id: objectives/evasion/anti-av/exclusion::obfuscated-lua-defender-exclusion
    scope: "archive"
