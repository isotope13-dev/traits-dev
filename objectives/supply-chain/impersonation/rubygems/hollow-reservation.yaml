# RubyGems dependency-confusion stage one: the hollow name reservation.
#
# The npm counterpart lives under impersonation/depconf/hollow-reservation.yaml:
# a squat published under a plausible internal namespace cannot carry a payload
# yet — its job is to win version resolution and sit on the name while it
# still looks harmless. A legitimate reservation stub declares provenance and
# uses a real version; the squat shape does neither.
#
# monolith-twirp-pullsd-users-0.0.1 (MAL-2026-2816 batch) is the worked
# example: the monolith-twirp-* namespace is an internal-service-style naming
# pattern whose payload-bearing siblings exfiltrate host identity over DNS
# (gem-ci-host-identity-oob-dns-beacon), while this member ships a single
# comment-only lib/placeholder.rb, a placeholder summary ("test"), no
# description, and an anonymous author ("test") — the reservation holding the
# name for later armed releases. The campaign prefix below is the IOC leg that
# separates this squat from an ordinary tutorial stub; the general composite
# underneath covers the same hollow shape when the name gives no campaign
# signal and stays suspicious for exactly that reason.
defaults:
  platforms: [unix, windows]
  attack: T1195.002
  for: [gem]

composite_rules:
  - id: monolith-twirp-hollow-reservation-squat
    desc: Hollow monolith-twirp gem reserves squatted dependency name
    crit: hostile
    conf: 0.93
    scope: outer
    for: [gem, pkginfo, ruby]
    all:
      - id: objectives/supply-chain/impersonation/rubygems::gem-name-monolith-twirp-prefix
      - id: metadata/package/empty::pkginfo-placeholder-summary
      - id: metadata/package/description/presence::pkginfo-no-description-body
      - id: metadata/package/author/risk::gem-generic-author-name
      - id: metadata/lang/source/comment::ruby-lib-placeholder-comment-only

  - id: rubygems-hollow-placeholder-reservation
    desc: Hollow RubyGem ships placeholder content under anonymous identity
    crit: suspicious
    conf: 0.9
    scope: outer
    for: [gem, pkginfo, ruby]
    all:
      - id: metadata/package/empty::pkginfo-placeholder-summary
      - id: metadata/package/description/presence::pkginfo-no-description-body
      - id: metadata/package/author/risk::gem-generic-author-name
      - id: metadata/lang/source/comment::ruby-lib-placeholder-comment-only
