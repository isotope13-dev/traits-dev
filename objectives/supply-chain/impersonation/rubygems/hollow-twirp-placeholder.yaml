# monolith-twirp-pullsd-users (MAL-2026-2816): hollow RubyGems placeholder gem.
defaults:
  platforms: [unix, windows]
  attack: T1195.002
  for: [gem]

traits:
  - id: gem-name-monolith-twirp-prefix
    desc: Gem name uses monolith-twirp prefix
    crit: notable
    conf: 0.94
    if:
      type: value
      path: gem.name
      regex: '^monolith-twirp-'
  - id: gem-name-monolith-twirp-pullsd-users
    desc: Gem name is monolith-twirp-pullsd-users
    crit: notable
    conf: 0.98
    if:
      type: value
      path: gem.name
      exact: monolith-twirp-pullsd-users

composite_rules:
  - id: rubygems-monolith-twirp-placeholder-gem
    desc: Hollow monolith-twirp RubyGem placeholder
    crit: hostile
    conf: 0.96
    scope: outer
    for: [gem, pkginfo]
    all:
      - id: objectives/supply-chain/impersonation/rubygems::gem-name-monolith-twirp-prefix
      - id: metadata/package/empty::pkginfo-placeholder-summary-test
      - id: metadata/package/description/presence::pkginfo-no-description-body

  - id: rubygems-twirp-pullsd-placeholder-name
    desc: RubyGem typosquats twirp pullsd users name
    crit: hostile
    conf: 0.97
    scope: outer
    for: [gem, pkginfo]
    all:
      - id: objectives/supply-chain/impersonation/rubygems::gem-name-monolith-twirp-pullsd-users
      - id: metadata/package/empty::pkginfo-placeholder-summary-test
      - id: metadata/package/description/presence::pkginfo-no-description-body
