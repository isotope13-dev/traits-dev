defaults:
  platforms: [unix, windows]
  for: [pkginfo]
  attack: T1195.002
traits:
  # Microsoft Git Credential Manager is not a RubyGem; a runtime dependency on
  # this namesake marks SleeperGem carriers (and future typoquat drops).
  - id: depends-git-credential-manager-namesake
    desc: GCM dependency in RubyGems metadata
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '!ruby/object:Gem::Dependency\n\s+name:\s*git_credential_manager\b'
  - id: executable-ls
    desc: RubyGems executable named ls
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "executables:\n- ls"
  - id: file-bin-ls
    desc: RubyGems ships bin/ls file
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "- bin/ls"
  - id: package-name-ls
    desc: RubyGems package named ls
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: "name: ls"
  - id: json-colour-name
    desc: RubyGems package named json_colour
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: name
      regex: ^json_colour$
  - id: json-color-homepage
    desc: Cloned json_color homepage
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: homepage
      exact: https://bitbucket.org/winebarrel/json_color
  - id: gem-name-hermes-engine
    desc: RubyGems package named hermes-engine
    crit: notable
    conf: 0.85
    for: [gem, pkginfo]
    if:
      type: value
      path: gem.name
      exact: hermes-engine
  # The author/email fields the json_colour typosquat copied are NOT defined
  # here: on their own they only say "this gem credits Genki Sugawara", which
  # is true of every genuine gem winebarrel publishes. They live as neutral
  # authorship facts in metadata/package/contributors and are referenced below,
  # where the cloned bitbucket homepage supplies the impersonation evidence.
composite_rules:
  - id: non-gcm-depends-gcm-namesake
    desc: Third-party gem declares GCM dependency
    crit: hostile
    conf: 0.99
    all:
      - id: depends-git-credential-manager-namesake
      - id: metadata/package/manifest/ecosystem::rubygems-spec-yaml-marker
  - id: core-command-shadow
    desc: RubyGems package shadows /bin/ls
    crit: suspicious
    conf: 0.95
    all:
      - id: executable-ls
      - id: file-bin-ls
      - id: metadata/package/manifest/entrypoint::rubygems-bindir-bin
    unless:
      - id: package-name-ls
  - id: cloned-json-color-identity
    desc: Cloned json_color maintainer identity
    crit: suspicious
    conf: 0.98
    all:
      - id: json-color-homepage
      - id: metadata/package/contributors::gem-author-genki-sugawara
      - id: metadata/package/contributors::gem-author-email-sgwr-dts
  - id: json-colour-typosquat-shadow
    desc: json_colour typosquat with ls shadowing
    crit: hostile
    conf: 0.995
    all:
      - id: json-colour-name
      - id: json-color-homepage
      - id: metadata/package/contributors::gem-author-genki-sugawara
      - id: metadata/package/contributors::gem-author-email-sgwr-dts
      - id: executable-ls
      - id: file-bin-ls
      - id: metadata/package/manifest/entrypoint::rubygems-bindir-bin
  - id: hermes-engine-ruby-oast-exfil
    desc: hermes-engine Ruby gem exfiltrates host profile to OAST
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1041"
    scope: outer
    for: [gem, archives]
    all:
      - id: gem-name-hermes-engine
      - id: objectives/supply-chain/recon-exfil/import-time::ruby-oastify-host-profile-json-post
    unless:
      - id: well-known/lib/runtime/hermes::hermes-runtime
