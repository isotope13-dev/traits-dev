defaults:
  platforms: [unix, windows]
  attack: T1195.002

traits:
  - id: gem-credential-manager-namesake
    desc: RubyGem named git_credential_manager
    crit: notable
    conf: 0.98
    for: [gem]
    if:
      type: value
      path: gem.name
      exact: git_credential_manager

  - id: gcm-raw-deployment-download-source
    desc: Names Disroot raw deployment URL
    crit: notable
    conf: 0.96
    for: [ruby]
    if:
      type: text
      regex: 'https://git\.disroot\.org/git-ecosystem/[^"\r\n]{1,40}/raw/branch/main'

  - id: gcm-downloaded-platform-deploy-files
    desc: Installer names platform deployment scripts
    crit: notable
    conf: 0.95
    for: [ruby]
    if:
      type: text
      regex: '\bdeploy:\s*["'']deploy\.(sh|ps1)["'']'

  - id: ruby-starts-downloaded-deploy-script
    desc: Ruby launches the downloaded deploy script
    crit: notable
    conf: 0.98
    for: [ruby]
    if:
      type: text
      regex: '(?m)^\s*deployment_script\s*=\s*\w+\[:deploy\]\s+start_script\(deployment_script\)'

composite_rules:
  - id: gcm-namesake-fetches-unverified-deployment-files
    desc: GCM namesake gem fetches deployment files without TLS verification
    crit: hostile
    conf: 0.99
    for: [gem, ruby]
    scope: outer
    all:
      - id: gem-credential-manager-namesake
      - id: gcm-raw-deployment-download-source
      - id: gcm-downloaded-platform-deploy-files
      - id: micro-behaviors/communications/tls/verify/disable::openssl-verify-none
      - id: micro-behaviors/communications/http/lib/netlib::ruby-net-http-get-request-object

  - id: gcm-namesake-executes-unverified-deploy
    desc: GCM namesake gem executes an unverified remote deployment script
    crit: hostile
    conf: 0.99
    for: [gem, ruby]
    scope: outer
    all:
      - id: gcm-namesake-fetches-unverified-deployment-files
      - id: ruby-starts-downloaded-deploy-script
