# A typosquat that runs Discord spam from the package. The spam rules under
# lateral-movement convict the operation; this states the impersonation --
# the squat name is how the spam bot got onto the victim's machine, and
# the fake-email leg is part of the same fraud.
defaults:
  platforms: [unix, windows]
  for: [python, package.json, whl, python-sdist, egg, tar, zip, archives]
  attack: T1195.002,T1566.002

composite_rules:
  - id: typosquat-discord-spam-delivery
    desc: Typosquat package delivers Discord spam
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/keywords/identity::typosquatting-keyword
      - id: objectives/command-and-control/channel/discord::discord-fake-email
