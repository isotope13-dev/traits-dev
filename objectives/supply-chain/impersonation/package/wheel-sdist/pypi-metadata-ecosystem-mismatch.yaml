# PyPI wheels that copy another ecosystem's install docs while shipping unrelated
# Python payloads (utility-library impersonation).
defaults:
  platforms: [unix, windows]
  attack: T1036.005

traits:
  - id: pypi-metadata-npm-import-syntax
    desc: PyPI metadata documents NPM import syntax
    crit: notable
    conf: 0.92
    for: [pkginfo]
    if:
      type: text
      regex: "import\\s+\\{[^}\\n]{1,120}\\}\\s+from\\s+[\"']@.{1,64}/.{1,64}[\"']"
  - id: pypi-metadata-formatcolor-utility-claim
    desc: PyPI metadata documents formatColor utility
    crit: notable
    conf: 0.9
    for: [pkginfo]
    if:
      type: text
      substr: formatColor

composite_rules:
  - id: pypi-facade-utility-with-dotenv-session-theft
    desc: PyPI facade wheel ships dotenv session cookie theft
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1552.001
    scope: archive
    for: [whl, python, pkginfo]
    all:
      - id: objectives/credential-access/env/dotenv::python-dotenv-discovered-env-session-cookie-get
    any:
      - id: pypi-metadata-npm-import-syntax
      - id: pypi-metadata-formatcolor-utility-claim
