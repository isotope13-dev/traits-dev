defaults:
  platforms: [unix, windows]
  attack: T1195.002
traits:
  - id: python-placeholder-future-logic
    desc: 'python placeholder future logic'
    crit: component
    conf: 0.9
    for: [python]
    size_max: 20000
    if:
      type: text
      substr: Placeholder for future logic
  - id: python-placeholder-pass
    desc: Python placeholder implementation uses pass
    crit: component
    conf: 0.85
    for: [python]
    size_max: 20000
    if:
      type: text
      regex: '(?i)placeholder[\s\S]{0,300}\bpass\b'
  - id: test-package-readme
    desc: README identifies package as a test package
    crit: component
    conf: 0.84
    for: [text]
    size_max: 2000
    if:
      type: text
      regex: '(?i)^test package\b'
  - id: pkginfo-typo-protected-installation
    desc: Typo-protected installation claim
    # A description that markets "typo-protected" aliasing is a notable
    # observation, not suspicion on its own: legitimate authors register
    # defensive name variants that redirect to their canonical package.
    crit: notable
    conf: 0.9
    for: [pkginfo]
    if:
      type: text
      substr: Typo-Protected Installation
  - id: pkginfo-official-install-claim
    desc: Official-package install claim
    # "Install the official package …" is ordinary redirect/rename language
    # (deprecations, moves, defensive placeholders all use it). Notable, not
    # suspicious — impersonation must be inferred by a composite that adds a
    # payload, an install hook, or a verified typosquat of a real package.
    crit: notable
    conf: 0.9
    for: [pkginfo]
    if:
      type: text
      substr: Install the official package
      case_insensitive: true
composite_rules:
  - id: placeholder-noop-python-module
    desc: Python package contains placeholder no-op module
    crit: suspicious
    conf: 0.9
    for: [python]
    all:
      - id: python-placeholder-future-logic
      - id: python-placeholder-pass
  - id: pypi-placeholder-noop-sparse-metadata
    desc: PyPI package has placeholder no-op code with sparse metadata
    crit: suspicious
    conf: 0.92
    for: [python, whl, python-sdist]
    all:
      - id: placeholder-noop-python-module
      - id: metadata/package/dependencies/manifest::pypi-no-runtime-deps
      - id: metadata/package/manifest/author/identity::pkginfo-no-author-email
    scope: archive
  - id: pypi-placeholder-claimed-functionality
    desc: PyPI package claims functionality but only ships placeholder code
    crit: suspicious
    conf: 0.9
    for: [python, whl, python-sdist]
    all:
      - id: placeholder-noop-python-module
      - id: metadata/package/files/wheel-sdist::from-setuptools-import
      - id: metadata/package/manifest/ecosystem::pkginfo-single-word-summary
    scope: archive
  - id: pypi-empty-skeleton-sparse-metadata
    desc: Tiny PyPI skeleton package with sparse metadata
    crit: notable
    conf: 0.93
    for: [whl, python-sdist]
    all:
      - id: metadata/package/metrics::pkginfo-tiny
      - id: objectives/supply-chain/impersonation/package/wheel-sdist::pkginfo-no-summary
      - id: metadata/package/dependencies/manifest::pypi-no-runtime-deps
      - id: metadata/package/manifest/author/identity::pkginfo-no-author-email
    scope: archive
    unless:
      - id: metadata/library/python-stdlib::python-stdlib-test-file
      - id: metadata/library/python-stdlib::python-stdlib-fixture-wheel
      - id: metadata/library/python-stdlib::python-stdlib-example2-fixture-pkginfo
      # "Skeleton" has to mean the distribution ships no functionality. Sparse
      # metadata on its own describes every minimal-but-real package: a demo
      # UDF wheel with one module and a model file (matrixone's
      # pkg/udf/pythonservice/demo/dist/detect-1.0.0) carries no summary, no
      # deps and no author email, yet is nothing like a facade.
      - id: metadata/package/files/wheel-sdist::wheel-python-code-member
      - id: metadata/package/files/wheel-sdist::wheel-native-code-member
  # A metadata-only wheel using a repeated-nine version is a strong
  # dependency-confusion facade signal. The individual metadata observations
  # remain neutral/notable so normal redirect and test packages are not called
  # hostile without the sentinel release profile.
  - id: pypi-empty-skeleton-sentinel-version
    desc: Empty PyPI skeleton uses sentinel version
    crit: hostile
    conf: 0.98
    mbc: B0024
    for: [whl, python-sdist]
    all:
      - id: pypi-empty-skeleton-sparse-metadata
      - id: metadata/package/versioning::pkginfo-repeated-nine-version
    scope: archive
  - id: pypi-empty-test-package-facade
    desc: Empty PyPI test-package facade
    crit: notable
    conf: 0.9
    for: [python, whl, python-sdist]
    all:
      - id: pypi-empty-skeleton-sparse-metadata
      - id: test-package-readme
    scope: archive
  - id: pypi-empty-skeleton-lowest-version
    desc: Tiny PyPI skeleton package at initial placeholder version
    crit: notable
    conf: 0.9
    for: [whl, python-sdist]
    all:
      - id: pypi-empty-skeleton-sparse-metadata
      - id: metadata/package/versioning::pkginfo-lowest-version
    scope: archive
  # PyPI analog of the npm types-package-runs-install-hook anomaly: a sparse
  # skeleton package (tiny, no summary, no deps, anonymous author) that ALSO
  # overrides install to run code. A package with no real functionality has no
  # legitimate reason to execute code at install time. Payload-agnostic — fires
  # on the structural anomaly regardless of how the install payload is written,
  # so it survives obfuscation changes the per-payload composites would miss.
  - id: pypi-skeleton-package-install-exec
    desc: Sparse-metadata skeleton package runs install-time code
    crit: hostile
    conf: 0.95
    mbc: B0024
    for: [python, whl, python-sdist]
    all:
      - id: pypi-empty-skeleton-sparse-metadata
    any:
      - id: metadata/build/package/recipe::setuptools-run-override
      - id: metadata/build/package/recipe::setup-cmdclass-install
      - id: objectives/supply-chain/install-hook/build/pep517::pep517-backend-execution
    needs: 1
    # Keep the sparse-package and install-hook evidence in the same package;
    # an sdist may legitimately bundle sparse integration-test wheels beside
    # its own normal PEP 517 build backend.
    scope: leaf
  # Description markets a typo-protected alias and tells users to install a
  # different package name. On its own this is a redirect claim, not proof of
  # impersonation: renames, deprecations, and an author's own defensive
  # placeholders read identically. Notable — the malicious empty-facade case
  # (a payload / install hook) is caught hostile by
  # pypi-skeleton-package-install-exec above.
  - id: pypi-alternate-install-impersonation
    desc: Metadata redirects install to alternate package
    crit: notable
    conf: 0.9
    for: [whl, python-sdist]
    all:
      - id: pkginfo-typo-protected-installation
      - id: pkginfo-official-install-claim
    scope: archive
  - id: pypi-small-wheel-alternate-install-facade
    desc: Small wheel redirects install to alternate package
    crit: notable
    conf: 0.9
    for: [whl, python-sdist]
    all:
      - id: pkginfo-typo-protected-installation
      - id: pkginfo-official-install-claim
      - id: metadata/package/manifest/ecosystem::python-package-metadata-member
      - id: metadata/package/metrics::wheel-archive-at-most-five-files
    scope: archive
  - id: pypi-empty-wheel-inflated-version
    desc: Tiny wheel uses high version without runtime code
    # Empty high-version wheels include legitimate dependency-confusion
    # placeholders and reserved-name packages.  The shape is notable; hostile
    # scoring belongs to a package that also executes or stages behavior.
    crit: notable
    conf: 0.94
    for: [whl]
    all:
      - id: metadata/package/metrics::tiny-wheel-archive-content
      - id: metadata/package/versioning::whl-inflated-version
      - id: metadata/package/files/wheel-sdist::wheel-dist-info-member
    unless:
      - id: metadata/package/files/wheel-sdist::wheel-runtime-code-member
  - id: pypi-safe-test-hollow-wheel
    desc: Hollow wheel advertises itself as a safe test package
    crit: notable
    conf: 0.94
    for: [whl, python-sdist]
    mbc: B0024
    scope: archive
    all:
      - id: metadata/package/files/wheel-sdist::wheel-metadata-only
      - id: objectives/supply-chain/impersonation/package/wheel-sdist::pkginfo-safe-test-package-summary
  # A brand-new public wheel that reserves an internal/private distribution
  # name while shipping no runtime code is a dependency-confusion facade.
  # Keep the name atom neutral: the hostile conclusion needs the fresh,
  # metadata-only release shape as corroboration.
  - id: pypi-fresh-private-metadata-wheel
    desc: Fresh metadata-only private-variant wheel
    crit: hostile
    conf: 0.98
    mbc: B0024
    for: [whl]
    scope: package
    all:
      - id: metadata/package/files/wheel-sdist::wheel-metadata-only
      - id: metadata/package/manifest/name::pypi-private-variant-name
      - id: metadata/registry::brand-new-package
