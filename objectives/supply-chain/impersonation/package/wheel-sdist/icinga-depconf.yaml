# icinga PyPI typosquat (MAL-2026-5532): inflated metadata-only wheel lure and
# install-time host beacon in setup.py on full releases.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1041
  for: [whl, pkginfo, python-sdist, python]

traits:
  - id: pkginfo-distribution-name-icinga
    desc: PKG-INFO distribution name is icinga
    crit: notable
    conf: 0.98
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: icinga

composite_rules:
  - id: icinga-metadata-only-inflated-depconf-wheel
    desc: icinga metadata-only wheel with inflated version
    crit: hostile
    conf: 0.98
    scope: archive
    for: [whl, pkginfo]
    all:
      - id: metadata/package/files/wheel-sdist::wheel-metadata-only
      - id: objectives/supply-chain/impersonation/package/wheel-sdist::pkginfo-distribution-name-icinga
      - id: metadata/package/versioning/scheme::whl-high-major-version
      - id: metadata/package/author/identity::placeholder-author-dev

  - id: icinga-operational-utility-metadata-wheel
    desc: icinga hollow wheel operational utility summary
    crit: hostile
    conf: 0.97
    scope: archive
    for: [whl, pkginfo]
    all:
      - id: metadata/package/files/wheel-sdist::wheel-metadata-only
      - id: objectives/supply-chain/impersonation/package/wheel-sdist::pkginfo-distribution-name-icinga
      - id: metadata/package/description/disclosure::pkginfo-summary-operational-package-utility
      - id: metadata/package/versioning/scheme::whl-high-major-version
