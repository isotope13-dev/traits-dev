# An empty lookalike wheel is still a supply-chain attack surface: it claims
# the upstream package identity while installing no implementation at all.
defaults:
  platforms: [unix, windows]
  for: [whl]
  attack: T1195.002
  mbc: E1195

composite_rules:
  - id: wheel-bip39-empty-impersonation-facade
    desc: Empty wheel impersonates BIP39 functionality
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: objectives/supply-chain/impersonation/brand::wheel-bip39-identity-impersonation
      - id: metadata/package/files/wheel-sdist::wheel-metadata-only
