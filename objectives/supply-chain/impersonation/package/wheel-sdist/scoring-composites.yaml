      - id: metadata/package/versioning/scheme::pkginfo-lowest-version
      - id: metadata/package/files/archive-shape::pkginfo-tiny
    unless:
      # setuptools' unnamed placeholder, not a package impersonating a real distribution.
      - id: metadata/package/ecosystem::pkginfo-unnamed-placeholder
  - id: pkginfo-low-version-minimal-summary
    for: [pkginfo]
    desc: PKG-INFO with low version and minimal summary
