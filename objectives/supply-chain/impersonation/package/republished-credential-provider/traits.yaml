# Depup metadata is not hostile on its own. This rule requires the
# republisher to retain AWS identity claims while executing the credential
# provider's external command path.
defaults:
  conf: 0.99
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002,T1059.007,T1552.001

composite_rules:
  - id: republished-aws-credential-provider
    for: [package.json, javascript, npm]
    desc: Republished AWS credential provider executes commands
    crit: hostile
    scope: archive
    all:
      - id: metadata/package/publishing::depup-original-aws-credential-provider
      - id: metadata/package/publishing::depup-renamed-package
      - id: well-known/lib/cloud/aws-sdk-js::v3-official-repository
      - id: well-known/lib/cloud/aws-sdk-js::v3-official-author
      - id: micro-behaviors/process/create/shell/bridge::node-credential-process-exec
      - id: micro-behaviors/process/create/shell/bridge::node-credential-token-exec-interceptor
