defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.75
  attack: T1195.002
traits:
# The two `"*"`-range atoms moved to
# metadata/package/dependencies/version-range -- a wildcard pin is a neutral
# manifest fact, and filing it here labelled every fixture and monorepo that
# uses one as impersonation evidence.
# `npm-latest-tag-dependency` moved to metadata/package/dependencies too, for the
# same reason as the `"*"` atoms above: a `latest` pin is a neutral dependency-
# versioning fact. The previous pass left it (and the composite that unions the
# two) behind here for want of a sample to verify the move against; verified now
# against `"*"`- and `"latest"`-pinned manifests.
- id: npm-recognized-axios-proxy-builder
  desc: "axios-proxy-builder in serverless installer"
  crit: notable
  conf: 0.99
  for:
  - package.json
  if:
    type: text
    regex: '"(serverless|serverless-sf-core)"[\s\S]{0,700}"axios-proxy-builder"'
- id: npm-package-serverless
  desc: serverless package name
  crit: notable
  conf: 0.95
  for:
  - package.json
  if:
    type: value
    path: name
    exact: serverless
- id: npm-script-backdoor
  desc: npm package has 'backdoor' script
  crit: suspicious
  conf: 0.95
  for:
  - package.json
  if:
    type: value
    path: scripts.backdoor
- id: pypi-no-dependencies
  desc: PyPI package has no install_requires
  crit: notable
  conf: 0.6
  for:
  - python
  if:
    type: string_literal
    regex: install_requires\s*=\s*\[\s*\]
- id: gem-no-dependencies
  desc: RubyGem has no runtime dependencies
  crit: notable
  conf: 0.6
  for:
  - ruby
  if:
    type: string_literal
    regex: \.add_runtime_dependency\s*\(
- id: npm-dep-next-runtimejs
  desc: npm dependency on next-runtimejs
  crit: suspicious
  conf: 0.98
  for:
  - package.json
  if:
    type: value
    path: dependencies.next-runtimejs
- id: npm-dep-agnolia-string-argv
  desc: npm dependency on agnolia string-argv clone
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: value
    path: dependencies.@agnoliaarisian7180/string-argv
    exists: true
- id: npm-dep-agnolia-string-argv-latest
  desc: agnolia string-argv dependency uses latest
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: value
    path: dependencies.@agnoliaarisian7180/string-argv
    exact: latest
- id: tabby-electron-main
  desc: Tabby Electron package main marker
  crit: notable
  conf: 1.0
  for:
  - package.json
  if:
    type: text
    substr: '"main":"./dist/electron/main.js"'
- id: tabby-raw-package-marker
  desc: Tabby package raw metadata marker
  crit: notable
  conf: 1.0
  for:
  - package.json
  if:
    type: text
    regex: '"name":"tabby"|"author": "Tabby Developers"'
- id: npm-legacy-lib-eyes
  desc: Package is legacy npm library eyes
  crit: notable
  conf: 1.0
  for:
  - package.json
  if:
    type: text
    substr: '"name"          : "eyes"'
- id: npm-legacy-lib-colors
  desc: Package is legacy npm library colors
  crit: notable
  conf: 1.0
  for:
  - package.json
  if:
    type: text
    substr: '"name": "colors"'
- id: npm-legacy-lib-run-script-os
  desc: Package is run-script-os
  crit: notable
  conf: 1.0
  for:
  - package.json
  if:
    type: text
    substr: '"name": "run-script-os"'
- id: npm-pack-hooks--prepack
  desc: npm package has prepack or postpack (prepack)
  crit: notable
  conf: 0.7
  for:
  - package.json
  if:
    type: value
    path: scripts
    exact: prepack
- id: npm-pack-hooks--postpack
  desc: npm package has prepack or postpack (postpack)
  crit: notable
  conf: 0.7
  for:
  - package.json
  if:
    type: value
    path: scripts
    exact: postpack
- id: npm-script-exec--exec
  desc: npm package has 'exec' or 'execute' (exec)
  crit: suspicious
  conf: 0.85
  for:
  - package.json
  if:
    type: value
    path: scripts
    exact: exec
- id: npm-script-exec--execute
  desc: npm package has 'exec' or 'execute' (execute)
  crit: suspicious
  conf: 0.85
  for:
  - package.json
  if:
    type: value
    path: scripts
    exact: execute
composite_rules:
- id: npm-pack-hooks
  desc: npm package has prepack or postpack hooks
  crit: notable
  conf: 0.7
  for:
  - package.json
  any:
  - id: npm-pack-hooks--prepack
  - id: npm-pack-hooks--postpack
- id: npm-script-exec
  desc: npm package has 'exec' or 'execute' script
  crit: suspicious
  conf: 0.85
  for:
  - package.json
  any:
  - id: npm-script-exec--exec
  - id: npm-script-exec--execute
- id: npm-bundled-scoped-wildcard-devdeps
  desc: bundled scoped wildcard devDependencies
  crit: notable
  conf: 0.9
  for:
  - package.json
  all:
  - id: metadata/package/dependencies/manifest::scoped-wildcard-devdependency
  - id: metadata/package/dependencies/manifest::npm-has-bundled-dependencies
- id: npm-recognized-no-devdeps-legacy-lib
  desc: Legacy npm library without devDependencies
  crit: notable
  conf: 1.0
  for:
  - package.json
  any:
  - id: npm-legacy-lib-eyes
  - id: npm-legacy-lib-colors
  - id: npm-legacy-lib-run-script-os
- id: npm-runtime-dep-next-runtimejs
  desc: npm runtime depends on next-runtimejs
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  all:
  - id: metadata/package/dependencies/manifest::has-runtime-deps
  - id: npm-dep-next-runtimejs
- id: npm-known-malicious-string-argv-dependency
  desc: npm package depends on malicious string-argv clone
  crit: hostile
  conf: 0.995
  for:
  - package.json
  all:
  - id: npm-dep-agnolia-string-argv
  - id: npm-dep-agnolia-string-argv-latest
# `npm-unsafe-dependency-versions` moved to
# metadata/package/dependencies/manifest::npm-floating-dependency-range. Both of its legs
# had already been ruled neutral dependency-versioning facts and relocated to
# metadata, but the composite that unions them stayed here, so every manifest
# using `"*"` or `"latest"` for a dependency still reported an impersonation-tier
# finding and fed a supply-chain/impersonation:notable ML feature -- buildpack and
# CI fixtures, monorepo internal deps, tutorials and every pre-lockfile package.
# broad-floating-deps-with-hooks (install-hook/package/manifest) is the rule that
# adds real intent and now references it cross-tier.
- id: npm-recognized-serverless-axios-proxy-builder
  desc: Recognized Serverless axios-proxy-builder dependency
  crit: notable
  conf: 1.0
  for:
  - package.json
  all:
  - id: npm-recognized-axios-proxy-builder
  - id: npm-package-serverless
- id: npm-suspicious-script-names
  desc: npm package has suspicious script names
  crit: suspicious
  conf: 0.85
  for:
  - package.json
  any:
  - id: npm-script-exec
  - id: npm-script-backdoor
