# A library API claim does not account for a build-only task that removes
# dependency records and restore artifacts. Ordinary declared cleanup tools
# retain the weaker build-hook lead rather than this deceptive-package verdict.
defaults:
  platforms: [windows, unix]
  for: [nupkg, xml, pe, dll]
  attack: T1195.002
composite_rules:
  - id: nuget-drawing-claim-build-cleanup
    desc: Drawing API claim masks build-time cleanup
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/description/function::nupkg-drawing-api-claim
      - id: objectives/evasion/indicator-removal/structure::nuget-build-hook-cleanup-api-clues
    unless:
      - id: metadata/package/files/nuget::nupkg-managed-library-member
