# A tiny npm tarball named with npm's 0.0.1-security placeholder suffix can
# be a pulled package artifact masquerading as the security-holder release.
# Filename and size warrant suspicion only; they do not establish security-
# holder identity or hostile behavior.
defaults:
  platforms: [linux, macos, windows]
  for: [npm, tar]
  attack: T1195.002

traits:
- id: npm-security-suffix-tiny-tarball
  desc: Tiny npm archive uses security-version suffix
  crit: suspicious
  conf: 0.95
  size_max: 2047
  if:
    type: path
    basename: true
    regex: '(?i)-0\.0\.1-security\.tgz$'
