# DepUp republish metadata is useful for triage, but does not establish
# malicious behavior by itself.  This composite records the identity drift as
# suspicious so legitimate package updates remain distinguishable from the
# original package without creating a malware verdict.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002
  mbc: E1195.002

traits:
  - id: depup-upstream-repository-claim
    desc: Republished package claims upstream repository
    crit: component
    conf: 0.9
    if:
      type: value
      path: repository.url
      exists: true

  - id: depup-upstream-author-claim
    desc: Republished package claims an upstream author
    crit: component
    conf: 0.9
    if:
      type: value
      path: author
      exists: true

composite_rules:
  - id: depup-upstream-identity-republication
    desc: Renamed DepUp package retains upstream identity claims
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/package/manifest/publishing::depup-original-package-field
      - id: metadata/package/manifest/publishing::depup-renamed-package
      - id: depup-upstream-repository-claim
      - id: depup-upstream-author-claim
