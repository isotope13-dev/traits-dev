# A third-party npm scope that republishes Prisma package names while claiming
# Prisma's own repository and author identity is an impersonation signal. The
# official @prisma scope is explicitly excluded.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1036,T1195.002

traits:
  - id: third-party-prisma-package-name
    desc: Non-official scope uses Prisma package name
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: name
      regex: '^@[^/]+/prisma-(fetch-engine|get-platform|debug|engines-version)$'
    not:
      - regex: '"name"\s*:\s*"@prisma/'

  - id: prisma-official-repository-claim
    desc: Package claims the official Prisma repository
    crit: component
    conf: 0.99
    if:
      type: value
      path: repository.url
      regex: '^https://github\.com/prisma/prisma\.git$'

  - id: prisma-official-author-claim
    desc: Package claims a Prisma author email
    crit: component
    conf: 0.98
    if:
      type: value
      path: author
      regex: '@prisma\.io[> ]*$'

composite_rules:
  - id: third-party-prisma-package-impersonation
    desc: Third-party Prisma package claims source identity
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: third-party-prisma-package-name
      - id: prisma-official-repository-claim
      - id: prisma-official-author-claim
