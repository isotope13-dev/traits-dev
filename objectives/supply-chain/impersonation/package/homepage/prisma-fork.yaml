# Third-party npm scopes that squat @prisma/* package names while claiming
# Prisma's public homepage are impersonating Prisma's brand identity.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1036,T1195.002

traits:
  - id: prisma-official-homepage-claim
    desc: Package claims the official Prisma homepage
    crit: component
    conf: 0.99
    if:
      type: value
      path: homepage
      regex: '^https://(www\.)?prisma\.io/?$'

composite_rules:
  - id: third-party-prisma-homepage-impersonation
    desc: Third-party Prisma package claims Prisma homepage
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: objectives/supply-chain/impersonation/package/manifest::third-party-prisma-package-name
      - id: prisma-official-homepage-claim
