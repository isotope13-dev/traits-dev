# This checksum identifies malicious proc-macro1 release bytes wherever they
# are pinned. It does not establish the declaring project's behavior, nor the
# current name of the dependency carrying those bytes.
defaults:
  platforms: [unix, windows]
  for: [cargo.lock]
  size_max: 10000000

traits:
  - id: cargo-proc-macro-lookalike-name
    desc: Lockfile contains proc-macro lookalike name
    crit: notable
    conf: 0.9
    if:
      type: value
      path: package[*].name
      regex: '^proc-macro([013-9]|2[0-9])$'

  - id: malicious-crate-dependency-checksum
    desc: Dependency has malicious crate checksum
    crit: suspicious
    conf: 1.0
    if:
      type: value
      path: package[*].checksum
      exact: '61198155da51b838772eecf5bfaac6cbc4dcc388dccc56658fc28a8e831b34d4'

composite_rules:
  - id: hostile-dependency-malicious-crate-checksum
    desc: Hostile dependency has malicious crate checksum
    crit: hostile
    conf: 1.0
    attack: T1195.002
    all:
      - id: malicious-crate-dependency-checksum
      - id: cargo-proc-macro-lookalike-name
