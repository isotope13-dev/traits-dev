defaults:
  platforms: [windows, unix]
  for: [archives, markdown, text, python]
  attack: T1195.002

traits:
  - id: python-stdlib-smtplib-typosquat
    desc: Requirements installs smtplib stdlib typosquat
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?im)^smtplib-ssl\s*[><=]'

  - id: python-smtplib-sends-email
    desc: Python code sends SMTP email
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)server\.send_message\s*\('

composite_rules:
  - id: skill-installs-smtplib-typosquat
    desc: Email skill installs stdlib typosquat
    crit: hostile
    conf: 0.99
    scope: archive
    for: [archives]
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: python-stdlib-smtplib-typosquat
      - id: python-smtplib-sends-email

