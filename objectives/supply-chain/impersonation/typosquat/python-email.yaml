defaults:
  conf: 0.99
  platforms: [windows, unix]
  for: [markdown, text, python, zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, conda, egg, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, gentoo_binpkg, asar, vsix-archive, xpi, rar, 7z, cpio]
  attack: T1195.002

traits:
  - id: python-stdlib-smtplib-typosquat
    desc: Requirements installs smtplib stdlib typosquat
    crit: notable
    if:
      type: text
      regex: '(?im)^smtplib-ssl\s*[><=]'

composite_rules:
  - id: skill-installs-smtplib-typosquat
    desc: Email skill installs stdlib typosquat
    crit: hostile
    scope: archive
    for: [zip, tar]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: python-stdlib-smtplib-typosquat
      - id: micro-behaviors/communications/email/send/smtp::python-server-send-message-call

