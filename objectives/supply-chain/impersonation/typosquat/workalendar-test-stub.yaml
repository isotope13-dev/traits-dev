# This narrow composite identifies the published workcalender campaign stub.
# The retained hook only prints a marker and is not itself malicious. The
# hostile inference comes from the conjunction of the near-identical package
# identity, an exact marker naming the internal workalendar test project, and
# the package's own local/unpublished test-fixture claims despite its published
# release record. The advisory says this release was uploaded with malicious
# intent as staging for the related install-hook backdoor, but says this sdist
# does not yet contain that payload. It must not be used to claim the related
# package's code is present here.
# References: https://cve.circl.lu/vuln/MAL-2026-18093 and the exact release
# record at https://pypi.org/project/workcalender/17.1.0.dev0/.
defaults:
  platforms: [unix, windows]
  attack: T1195.002

composite_rules:
  - id: workalendar-internal-test-stub-publication
    desc: Workalendar lookalike carries an internal build-test stub
    crit: hostile
    conf: 0.97
    for: [python-sdist, tar, zip, pyproject.toml, python, markdown, pkginfo]
    scope: archive
    all:
      - id: metadata/package/name/similarity::workcalender-package-name
      - id: metadata/build/pip::pyproject-hatch-custom-wheel-hook
      - id: micro-behaviors/os/console/io::python-prints-workalendar-internal-test-marker
      - id: metadata/package/documentation/claims::readme-not-published-disclaimer
      - id: metadata/package/documentation/claims::readme-sdist-build-hook-test-boilerplate
      - id: metadata/package/documentation/claims::readme-local-boilerplate-package
      - id: metadata/package/versioning/scheme::pkginfo-dev-version
