# Paramiko lookalike distribution.
#
# The name atom is deliberately limited to the verified one-character
# transposition.  It is not a generic "unusual package name" heuristic; the
# hostile conclusion also requires the sdist to declare the canonical Paramiko
# distribution, which distinguishes impersonation from an unrelated project.
defaults:
  platforms: [unix, windows]
  attack: T1036.005,T1195.002
  mbc: F0004,E1195

traits:
  - id: parimiko-paramiko-lookalike-name
    desc: PyPI distribution name is a Paramiko lookalike
    crit: suspicious
    conf: 0.99
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: parimiko

  - id: parimiko-declares-paramiko
    desc: Lookalike declares canonical Paramiko dependency
    crit: notable
    conf: 0.99
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Requires-Dist:\s*paramiko(\s|$)'

composite_rules:
  - id: parimiko-paramiko-dependency-substitution
    desc: PyPI Paramiko lookalike depends on canonical Paramiko
    crit: hostile
    conf: 0.995
    for: [archives]
    scope: archive
    all:
      - id: parimiko-paramiko-lookalike-name
      - id: parimiko-declares-paramiko

  - id: parimiko-paramiko-setup-wrapper
    desc: Paramiko lookalike ships a setup wrapper
    crit: hostile
    conf: 0.995
    for: [archives]
    scope: archive
    all:
      - id: parimiko-paramiko-lookalike-name
      - id: parimiko-declares-paramiko
      - id: metadata/build/pip::root-setup-py
