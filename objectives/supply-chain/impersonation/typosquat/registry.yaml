# A registry name one keystroke from a popular package's, on a package that
# only just appeared: the typosquat shape, read from what the registry says
# rather than from the artifact. kreuzwenker/docker (2026-09) sat one letter
# from kreuzwerker/docker, 20 days old, carrying the Graphalgo payload.
#
# Suspicious, not hostile. The name and the age are both registry facts, and
# neither says what the package does; a hostile verdict needs the payload.
# Age is what keeps it honest: a lookalike that has been published for months
# without incident is far more often a fork than a trap.
defaults:
  for: [registry]
  platforms: [unix, windows, android, ios]

composite_rules:
- id: young-registry-lookalike
  desc: New package named one edit from popular one
  crit: suspicious
  conf: 0.85
  attack: "T1195.002"
  all:
  - id: metadata/registry::name-lookalike
  - id: metadata/registry::recent-package
