defaults:
  platforms:
  - linux
  - macos
  - windows
  attack: T1195.002,T1583.001
  mbc: B0024
  crit: suspicious
composite_rules:
- id: go-lookalike-host-dependency
  for:
  - go.mod
  - go.sum
  - go
  desc: Go module fetched from a Go-lookalike host
  conf: 0.9
  any:
  - id: metadata/package/dependencies/name-form::go-infra-lookalike-host-dependency
  - id: metadata/import/package::go-infra-lookalike-host-import
- id: go-lookalike-host-project
  for:
  - zip
  - go.mod
  - go
  desc: Go project builds on a Go-lookalike host module
  conf: 0.93
  scope: archive
  all:
  - id: metadata/package/dependencies/name-form::go-infra-lookalike-host-dependency
  - id: metadata/import/package::go-infra-lookalike-host-import
