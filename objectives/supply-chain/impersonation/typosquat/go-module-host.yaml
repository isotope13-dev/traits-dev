# Go modules served from a vanity host named to pass for Go's own
# infrastructure. `go get` accepts any domain as a module path, so an attacker
# registers a name like gogets.dev or gocommunity.io, publishes a copy of a
# popular library (google/btree as gogets.dev/btreex) with a hidden loader,
# and hands victims a small "example" repository that depends on it. The
# example repository carries no payload of its own: its go.mod and imports
# are the attack, because building or testing it fetches the trojan.
#
# The host name is the deliberate part. Real vanity hosts carry their owner's
# name (go.uber.org, go.etcd.io); a host that only says "Go" is borrowing the
# project's authority. Matching the naming shape rather than the two known
# domains catches the next registration too.
defaults:
  platforms: [linux, macos, windows]
  attack: T1195.002,T1583.001
  mbc: B0024

composite_rules:
  - id: go-lookalike-host-dependency
    for: [go.mod, go.sum, go]
    desc: Go module fetched from a Go-lookalike host
    crit: suspicious
    conf: 0.9
    any:
      - id: metadata/import/package::go-infra-lookalike-host-dependency
      - id: metadata/import/package::go-infra-lookalike-host-import

  # A project that both declares and imports such a module: the dependency is
  # not a stale go.sum entry but code that is built into the project.
  - id: go-lookalike-host-project
    for: [zip, go.mod, go]
    desc: Go project builds on a Go-lookalike host module
    crit: suspicious
    conf: 0.93
    scope: archive
    all:
      - id: metadata/import/package::go-infra-lookalike-host-dependency
      - id: metadata/import/package::go-infra-lookalike-host-import
