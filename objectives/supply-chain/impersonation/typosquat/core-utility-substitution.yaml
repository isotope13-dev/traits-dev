# Dependency-substitution typosquats of ubiquitous npm utilities.
#
# A hijacked package may swap ubiquitous runtime dependencies for lookalike
# utilities that carry a payload. The Astro supply-chain compromise (OSV
# MAL-2026-10726) combined `obug` and `piccolore`. Both names also identify
# legitimate standalone packages, so neither identity alone establishes a
# substitution. Their neutral package/import identities live under well-known;
# this objective fires only when both occur in the same package context.
defaults:
  platforms: [unix, windows]
  attack: T1195.002
  mbc: E1195.002

composite_rules:
  - id: core-utility-typosquat-substitution
    desc: Substitutes multiple npm utilities with typosquat lookalikes
    crit: hostile
    conf: 0.97
    for: [package.json, javascript, typescript, archives]
    scope: outer
    all:
      - id: well-known/lib/development/obug::package-reference
      - id: well-known/lib/development/piccolore::package-reference
    unless:
      - id: well-known/lib/web/astro::astro-upstream-release-context
