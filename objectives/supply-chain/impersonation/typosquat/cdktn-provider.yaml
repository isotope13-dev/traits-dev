# cdktn / CDK Terrain is a single-character typosquat of HashiCorp CDKTF
# (cdktf / cdk.tf). Provider bindings force-install the lookalike runtime
# and import its _jsii module on load.
defaults:
  platforms: [unix, windows]
  attack: T1195.002
  mbc: E1195.002

traits:
  - id: cdktn-jsii-import
    desc: Imports the cdktn._jsii lookalike runtime
    crit: notable
    conf: 0.97
    for: [python]
    if:
      type: import
      exact: cdktn._jsii

  - id: cdktn-requires-dist
    desc: Declares dependency on the cdktn lookalike
    crit: notable
    conf: 0.97
    for: [pkginfo]
    if:
      type: value
      path: requires-dist
      regex: '^cdktn\b'

  - id: cdktn-provider-azurerm-name
    desc: Package named cdktn-provider-azurerm
    crit: notable
    conf: 0.98
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: cdktn-provider-azurerm

  - id: cdk-terrain-branding
    desc: CDK Terrain branding mimicking CDKTF
    crit: notable
    conf: 0.92
    for: [pkginfo, markdown, python]
    if:
      type: text
      regex: '(?i)\bCDK Terrain\b|\bcdktn\.io\b'

  - id: cdktn-wheel-distribution
    desc: Wheel distribution is cdktn_provider_azurerm
    crit: notable
    conf: 0.98
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: cdktn_provider_azurerm

  - id: cdktn-wheel-homepage
    desc: Wheel homepage points at cdktn-io
    crit: notable
    conf: 0.95
    for: [whl]
    if:
      type: value
      path: whl.home_page
      regex: '(?i)cdktn-io|cdktn\.io'

  - id: cdktn-wheel-author
    desc: Wheel author claims CDK Terrain Maintainers
    crit: notable
    conf: 0.94
    for: [whl]
    if:
      type: value
      path: whl.author
      exact: CDK Terrain Maintainers

composite_rules:
  - id: cdktn-azurerm-provider-typosquat
    desc: Azurerm provider typosquats HashiCorp CDKTF as cdktn
    crit: hostile
    conf: 0.99
    for: [whl, pkginfo]
    scope: archive
    all:
      - id: cdktn-provider-azurerm-name
      - id: cdktn-requires-dist
      - id: cdk-terrain-branding

  - id: cdktn-runtime-binding-typosquat
    desc: Provider bindings import the cdktn lookalike runtime
    crit: hostile
    conf: 0.98
    for: [whl]
    scope: archive
    all:
      - id: cdktn-jsii-import
      - id: cdktn-requires-dist
      - id: cdk-terrain-branding

  - id: cdktn-azurerm-wheel-identity
    desc: Wheel identity impersonates CDKTF azurerm provider as cdktn
    crit: hostile
    conf: 0.99
    for: [whl]
    all:
      - id: cdktn-wheel-distribution
      - id: cdktn-wheel-homepage
      - id: cdktn-wheel-author
