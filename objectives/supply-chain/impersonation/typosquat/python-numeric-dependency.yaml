defaults:
  platforms: [unix, windows]
  attack: T1195.002

traits:
  - id: numeric-suffixed-python-import
    desc: Numeric-suffixed Python module import
    crit: component
    conf: 0.94
    for: [python]
    if:
      # The import symbol index also exposes imported bindings and aliases
      # such as `crc32`. Match the source statement shape instead, keeping
      # the Python keywords case-sensitive so prose such as `From RFC7231`
      # is not mistaken for an import.
      type: text
      regex: '(?m)^\s*(from|import)\s+[.]?[a-z][a-z0-9_-]*[0-9]{2,}([.,\s]|$)'
      # `base64` is a numeric-suffixed stdlib, not a typosquat — filter it
      # per-match (was an inline `(?!base64\b)` lookahead the engine could not
      # compile).
      not:
        - regex: '\bbase64\b'
        # ISO 8601 is a legitimate date/time package whose numeric suffix is
        # semantic, not a package impersonation signal.
        - regex: '\biso8601\b'
        # Packages named after an RFC number are specification names, not
        # numeric-variant typosquats: rfc3986/rfc3987 (URI/IRI), rfc3339 and
        # rfc3986_validator, strict_rfc3339 (date/URI validation). jsonschema's
        # vendored _format.py imports four of them, so anything vendoring
        # jsonschema -- clearml-agent does -- looked like a typosquat chain.
        - regex: '\b(strict[_-])?rfc[0-9]{3,4}([_-][a-z]+)?\b'
        # pep517 is the standard PyPA PEP 517 compatibility package, not a
        # numeric-variant namespace.
        - regex: '(?i)\bpep517\b'
        # functools32 and enum34 are standard Python-version compatibility
        # packages, not numeric-variant namespaces.
        - regex: '(?i)\b(functools32|enum34)\b'
        # PyArmor deliberately gives its bundled runtime a numeric namespace
        # (for example, pyarmor_runtime_000000); this is an obfuscator runtime
        # import, not a package-impersonation dependency.
        - regex: '(?i)\bpyarmor_runtime_[0-9]+\b'
        # Setuptools and related tooling use Python-version compatibility
        # modules such as py34compat; these are semantic version markers, not
        # imports of numeric-named third-party packages.
        - regex: '(?i)\bpy[0-9]{2}compat\b'
        # PEP-numbered helper modules (notably virtualenv's pep514) are
        # standard-specification names, not package impersonation.
        - regex: '(?i)\bpep(514|517)\b'
    unless:
      # Installed application dependencies routinely import legitimate
      # numeric-named libraries (for example, h11). Package-level metadata
      # should be evaluated from an actual wheel instead of an extracted
      # dependency tree inside a larger application bundle.
      - id: metadata/package/files/dependency::bundled-python-library-path
composite_rules:
  - id: numeric-runtime-dependency-import-chain
    desc: Wheel declares and imports a numeric-suffixed runtime namespace
    crit: hostile
    conf: 0.98
    for: [whl]
    scope: archive
    unless:
      # An application bundle can contain wheels alongside its installed
      # runtime. In that context archive scope would pair a dependency
      # declaration with an unrelated library import; evaluate this hostile
      # package signal only when the archive is not a bundled site-packages
      # runtime.
      - id: metadata/package/files/dependency::bundled-python-library-path
      # A distribution such as virtualenv can ship several bootstrap wheels.
      # Their metadata and source must not be correlated with one another or
      # with the outer distribution as a single impersonating wheel.
      - id: metadata/package/files/dependency::embedded-python-wheel-path
      - id: well-known/app/system/home-assistant::home-assistant-identity
      - id: well-known/app/system/home-assistant::wheel-package-path
    all:
      - id: metadata/package/dependencies/declaration::numeric-suffixed-runtime-dependency
      - id: numeric-suffixed-python-import
  - id: private-variant-rewrites-transformers-imports
    desc: Private variant chains numeric dependency
    crit: hostile
    conf: 0.995
    for: [whl]
    scope: archive
    all:
      - id: metadata/package/manifest/name::pypi-private-variant-name
      - id: numeric-runtime-dependency-import-chain
    unless:
      - id: metadata/package/files/dependency::embedded-python-wheel-path
  - id: private-variant-imports-numeric-module
    desc: Private variant imports numeric module
    crit: hostile
    conf: 0.98
    for: [whl]
    scope: archive
    all:
      - id: metadata/package/manifest/name::pypi-private-variant-name
      - id: numeric-suffixed-python-import
    unless:
      - id: metadata/package/files/dependency::embedded-python-wheel-path
