defaults:
  platforms: [unix, windows]
  attack: T1195.002

traits:
  - id: sklern-package-name
    desc: PyPI package name is sklern
    crit: notable
    conf: 0.99
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: sklern

composite_rules:
  - id: sklern-groq-client-typosquat
    desc: Sklern typosquat ships a Groq client credential
    crit: hostile
    conf: 0.99
    for: [whl, pkginfo, python]
    attack: T1195.002,T1552.001
    all:
      - id: sklern-package-name
      - id: metadata/package/dependencies/declaration::pypi-groq-dependency
      - id: objectives/credential-access/cloud/token/files::python-groq-client-ships-api-key

  - id: private-variant-rewrites-transformers-imports
    desc: Private variant chains numeric dependency
    crit: hostile
    conf: 0.995
    for: [whl, pkginfo]
    scope: archive
    all:
      - id: metadata/package/name/convention::pypi-private-variant-name
      - id: metadata/package/dependencies/declaration::numeric-dependency-import-names
    unless:
      - id: metadata/package/files/dependency::embedded-python-wheel-path
  - id: private-variant-imports-numeric-module
    desc: Private variant imports numeric module
    crit: hostile
    conf: 0.98
    for: [whl, pkginfo, python]
    scope: archive
    all:
      - id: metadata/package/name/convention::pypi-private-variant-name
      - id: metadata/import/package::numeric-suffixed-python-import
    unless:
      - id: metadata/package/files/dependency::embedded-python-wheel-path
