# npm names one edit -- including a swap of adjacent letters -- from a
# heavily depended-on package (cleave's `top-npm-packages` dataset, which
# also lists the established lookalikes). An npm alias to the popular name
# imports the popular package itself, so it is never a near miss.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: npm-dependency-typosquat
    desc: Dependency name one edit from popular package
    crit: suspicious
    conf: 0.7
    if:
      type: symbol
      kind: import
      is: {typo_of: top-npm-packages}
    unless:
      - id: metadata/package/dependencies/name-form::npm-local-numeric-test-version-matrix
      - id: well-known/lib/concurrency/vasync/
      - id: well-known/lib/development/ts-node/
      - id: well-known/lib/network/rsync-npm/
      # Real packages within one edit of a popular one (jslint, exlint,
      # reqwest, eslit), declared as devDependencies.
      - id: metadata/package/dependencies/name-form::npm-lookalike-name-dependency
  - id: npm-package-name-typosquat
    desc: Package name one edit from popular package
    crit: suspicious
    conf: 0.7
    if:
      type: value
      path: name
      is: {typo_of: top-npm-packages}
