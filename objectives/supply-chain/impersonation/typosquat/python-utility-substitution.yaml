# The sample rewrites a canonical Python utility import and declares the
# lookalike distribution as a runtime dependency.  Keep the two observations
# separate so future dependency substitutions can be added without treating a
# single uncommon utility name as hostile on its own.
defaults:
  platforms: [unix, windows]
  attack: T1195.002
  mbc: E1195.002

traits:
  - id: noncanonical-ethereum-utility-import
    desc: Imports the eth-utils lookalike namespace
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: import
      exact: utils_eth

  - id: noncanonical-ethereum-utility-dependency
    desc: Declares the eth-utils lookalike dependency
    crit: notable
    conf: 0.98
    for: [pkginfo]
    if:
      type: value
      path: requires-dist
      regex: '^utils-eth\b'

composite_rules:
  - id: python-ethereum-utility-substitution
    desc: Python package swaps eth-utils for a lookalike
    crit: hostile
    conf: 0.995
    for: [whl]
    scope: archive
    all:
      - id: noncanonical-ethereum-utility-import
      - id: noncanonical-ethereum-utility-dependency

