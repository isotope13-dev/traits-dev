# Engine-emitted `supply-chain/typosquat` hook.
# cleave flags dependency names within edit-distance 1 of popular packages.
# Established names can resemble popular packages. The engine excludes gaxios
# before emitting findings, preserving a real typo alongside it in the same
# manifest. The remaining hooks below operate on a whole manifest, so do not
# add a gaxios hook here: it would hide an unrelated typo in that manifest.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]

traits:
  - id: builtin-supply-chain-typosquat
    desc: Built-in typosquat finding hook
    crit: suspicious
    conf: 0.7
    if:
      type: basename
      exact: __cleave_builtin_typosquat_hook__
    unless:
      # Benign test fixtures and established upstream packages whose names
      # happen to be close to popular dependencies.
      - id: metadata/package/dependencies/name-form::npm-local-numeric-test-version-matrix
      - id: well-known/lib/concurrency/vasync/
      - id: well-known/lib/development/ts-node/
      - id: well-known/lib/network/rsync-npm/
      # omgovich/colord sits at edit distance 1 from `colors` and trips the
      # hook wherever it is declared (daisyUI has depended on it since v2).
      # It is a real, long-published color library, so name the leaf.
      - id: well-known/lib/ui/colord/
      # Real, long-published packages whose names sit within edit distance 1
      # of a popular one (jslint, exlint, reqwest, eslit), declared as
      # devDependencies -- grouped as one composite so the hook's suppression
      # list stays a handful of semantic carve-outs.
      - id: metadata/package/dependencies/name-form::npm-lookalike-name-dependency
