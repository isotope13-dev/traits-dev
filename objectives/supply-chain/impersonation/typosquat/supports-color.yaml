defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  attack: T1195.002,T1036.005
  mbc: E1195.002

traits:
  # Bounded misspellings of supports-color. Copycats reuse the same forged
  # chalk/supports-color repository field with a different typo.
  - id: suport-color-package-name
    for: [package.json]
    desc: npm name misspells supports-color
    crit: notable
    conf: 0.99
    if:
      type: value
      path: name
      regex: '^(suport|suppor|supportz)-colou?r$'
  - id: supports-color-repository-reference
    for: [package.json]
    desc: Package repository references supports-color
    crit: notable
    conf: 0.96
    unless:
      - type: value
        path: name
        exact: supports-color
    if:
      type: value
      path: repository
      exact: chalk/supports-color

composite_rules:
  - id: suport-color-typosquat-of-supports-color
    desc: suport-color typosquats supports-color
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: suport-color-package-name
      - id: supports-color-repository-reference
    unless:
      - id: metadata/path/directory::test-directory-component
