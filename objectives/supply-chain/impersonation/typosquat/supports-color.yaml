defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  attack: T1195.002,T1036.005
  mbc: E1195.002

traits:
  - id: suport-color-package-name
    desc: Package named suport-color missing p
    crit: notable
    conf: 0.99
    if:
      type: value
      path: name
      exact: suport-color
  - id: supports-color-repository-reference
    desc: Package repository references supports-color
    crit: notable
    conf: 0.96
    if:
      type: value
      path: repository
      exact: chalk/supports-color

composite_rules:
  - id: suport-color-typosquat-of-supports-color
    desc: suport-color typosquats supports-color
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: suport-color-package-name
      - id: supports-color-repository-reference
    unless:
      - id: metadata/package/testing/presence/harness/
