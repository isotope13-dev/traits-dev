# Cargo digit-squat dependency (proc-macroN lookalikes).
#
# `proc-macro2` is the canonical crate; as of 2026 no other single-digit
# `proc-macroN` crate exists legitimately on crates.io, while `proc-macro1`
# was withdrawn as malware (backdoor running at compile time, pulled in
# through trojanized arrayref / append-only-vec / internment releases). Any
# other digit in that slot is a squat by construction, so these match the
# shape, not one campaign's string: proc-macro1 today, proc-macro3 tomorrow.
# Revisit if crates.io ever gains a legitimate proc-macroN sibling.
#
# Hostile criticality is composite-only in this taxonomy: the atoms below
# stay suspicious, and the composite fuses two independent sightings
# (manifest, lockfile, or source reference) into the hostile.
# The shape — not a campaign string — is what identifies the squat:
# no legitimate proc-macroN crate exists beside proc-macro2, so any
# other digit in that slot is a squat by construction (proc-macro1
# today, proc-macro3 tomorrow). Revisit if crates.io ever gains a
# legitimate proc-macroN sibling.
defaults:
  platforms: [unix, windows]
  attack: T1195.002
  mbc: E1195.002

traits:
  - id: cargo-proc-macro-squat-section-header
    desc: Declares proc-macroN digit-squat dependency
    crit: suspicious
    conf: 0.9
    for: [cargo.toml, crate, tar]
    if:
      type: text
      regex: 'dependencies\.proc-macro([013-9]|2[0-9])\]'

  - id: cargo-proc-macro-squat-inline-dependency
    desc: Declares inline proc-macroN squat dependency
    crit: suspicious
    conf: 0.9
    for: [cargo.toml, crate, tar]
    if:
      type: text
      regex: '"proc-macro([013-9]|2[0-9])"\s*='

  - id: cargo-proc-macro-squat-source-import
    desc: Rust imports proc-macroN digit-squat crate
    crit: suspicious
    conf: 0.9
    for: [rust, crate, tar]
    if:
      type: text
      regex: '(extern crate|use)\s+proc_macro([013-9]|2[0-9])\b'

  - id: cargo-proc-macro-squat-source-path
    desc: Rust references proc-macroN digit-squat path
    crit: suspicious
    conf: 0.9
    for: [rust, crate, tar]
    if:
      type: text
      regex: '\bproc_macro([013-9]|2[0-9])::'

  - id: cargo-proc-macro-squat-lockfile-pin
    desc: Lockfile pins proc-macroN digit-squat crate
    crit: suspicious
    conf: 0.9
    for: [cargo.lock, crate, tar]
    if:
      type: text
      regex: 'name\s*=\s*"proc-macro([013-9]|2[0-9])"'

composite_rules:
  - id: cargo-squat-crate-dependency
    desc: Crate declares and locks proc-macroN digit-squat
    crit: hostile
    conf: 0.97
    for: [cargo.toml, cargo.lock, rust, crate, tar]
    scope: archive
    needs: 2
    any:
      - id: cargo-proc-macro-squat-section-header
      - id: cargo-proc-macro-squat-inline-dependency
      - id: cargo-proc-macro-squat-source-import
      - id: cargo-proc-macro-squat-source-path
      - id: cargo-proc-macro-squat-lockfile-pin
