# A numeric lookalike is suspicious, not proof of package ownership or intent.
defaults:
  platforms: [unix, windows]
  attack: T1195.002
  mbc: E1195.002

traits:
  - id: cargo-proc-macro-squat-section-header
    desc: Declares proc-macroN lookalike dependency
    crit: suspicious
    conf: 0.9
    for: [cargo-toml]
    if:
      type: text
      regex: 'dependencies\.proc-macro([013-9]|2[0-9])\]'

  - id: cargo-proc-macro-squat-inline-dependency
    desc: Declares inline proc-macroN lookalike dependency
    crit: suspicious
    conf: 0.9
    for: [cargo-toml]
    if:
      type: text
      regex: '"proc-macro([013-9]|2[0-9])"\s*='

  - id: cargo-proc-macro-squat-source-import
    desc: Rust imports proc-macroN lookalike crate
    crit: suspicious
    conf: 0.9
    for: [rust]
    if:
      type: text
      regex: '(extern crate|use)\s+proc_macro([013-9]|2[0-9])\b'

  - id: cargo-proc-macro-squat-source-path
    desc: Rust references proc-macroN lookalike path
    crit: suspicious
    conf: 0.9
    for: [rust]
    if:
      type: text
      regex: '\bproc_macro([013-9]|2[0-9])::'

  - id: cargo-proc-macro-squat-lockfile-pin
    desc: Lockfile pins proc-macroN lookalike crate
    crit: suspicious
    conf: 0.9
    for: [cargo.lock]
    if:
      type: text
      regex: 'name\s*=\s*"proc-macro([013-9]|2[0-9])"'

composite_rules:
  - id: cargo-squat-crate-dependency
    desc: Crate declares and locks proc-macroN lookalike
    crit: suspicious
    conf: 0.85
    for: [cargo.toml, cargo.lock, rust, crate, tar]
    scope: archive
    needs: 2
    any:
      - id: cargo-proc-macro-squat-section-header
      - id: cargo-proc-macro-squat-inline-dependency
      - id: cargo-proc-macro-squat-source-import
      - id: cargo-proc-macro-squat-source-path
      - id: cargo-proc-macro-squat-lockfile-pin
