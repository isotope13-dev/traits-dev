defaults:
  platforms: [unix, windows]
  crit: suspicious
  attack: T1195.002

traits:
  - id: pip-install-requests-lookalike
    desc: pip install names a requests lookalike
    conf: 0.99
    for: [python, text, markdown]
    if:
      type: text
      regex: '\bpip[23]?\s+install\s+reqeusts\b'
    unless:
      # crate-ci/typos ships this exact misspelling in its own correction
      # dictionary (`reqeusts,requests`); the string is data the spell
      # checker corrects, not an install instruction.
      - id: well-known/tool/development/cli/dev-cli/typos-cli::typos-dict-context
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: metadata/package/testing/
      # Tirith rule docs name the typosquat packages they detect.
      - id: well-known/tool/detection/tirith::tirith-defensive-scanner-context
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository

      - id: "metadata/file/naming::test-directory-component"
composite_rules:
  - id: pip-lookalike-dependency-installation
    desc: pip install references a lookalike dependency
    conf: 0.99
    scope: file
    for: [zip, python, markdown, text]
    all:
      - id: micro-behaviors/os/package-manager/install::pip-installation
    any:
      - id: pip-install-requests-lookalike
      - id: objectives/supply-chain/impersonation/depconf::agent-skill-fake-urllib-package
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
