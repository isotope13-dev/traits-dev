defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
  attack: T1195.002
  conf: 0.99
traits:
- id: pip-install-requests-lookalike
  desc: pip install names a requests lookalike
  for:
  - python
  - text
  - markdown
  if:
    type: text
    regex: \bpip[23]?\s+install\s+reqeusts\b
  unless:
  # Labeled examples in a detection rule describe inputs to classify.
  - type: text
    regex: '(?s)\[\[rule\]\].{0,1000}\bexamples_bad\s*=\s*\[.{0,1000}\bexamples_good\s*='
composite_rules:
- id: pip-lookalike-dependency-installation
  desc: pip install references a lookalike dependency
  scope: file
  for:
  - zip
  - python
  - markdown
  - text
  all:
  - id: micro-behaviors/os/package-manager/dependency-setup::pip-installation
  any:
  - id: pip-install-requests-lookalike
  - id: objectives/supply-chain/impersonation/depconf::agent-skill-fake-urllib-package
  unless:
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
