defaults:
  platforms: [unix, windows]
  attack: T1195.002
  mbc: E1195.002

composite_rules:
  - id: pypi-near-name-flask-source-imitation
    desc: Near-name package impersonates Pallets Flask
    crit: hostile
    conf: 0.99
    for: [python, pkginfo, zip]
    scope: archive
    all:
      - id: metadata/package/name/similarity::near-popular-package
      - id: well-known/lib/web/server/pallets-flask::pkginfo-flask-framework-classifier
      - id: well-known/lib/web/server/pallets-flask::pkginfo-flask-upstream-repository
      - id: well-known/lib/web/server/pallets-flask::flask-cli-module-path
