defaults:
  platforms: [unix, windows]
  attack: T1195.002

traits:
  - id: pypi-lts-suffixed-name
    desc: PyPI package name uses LTS suffix
    crit: notable
    conf: 0.86
    for: [tar]
    if:
      type: value
      path: python.name
      regex: '^[A-Za-z0-9_.-]+-lts$'
  - id: lts-console-script-imports-unsuffixed-module
    desc: LTS console script imports unsuffixed module
    crit: suspicious
    conf: 0.9
    for: [text]
    if:
      type: text
      regex: '(?m)^[A-Za-z0-9_.-]+-lts(-[A-Za-z0-9_.-]+)?\s*=\s*[A-Za-z0-9_]+\.cli:[A-Za-z0-9_]+'
  - id: pypi-direct-wheel-egg-link
    desc: Direct wheel URL dependency link
    crit: suspicious
    conf: 0.95
    for: [text]
    if:
      type: text
      regex: 'https?://[^/\n]{1,240}\.whl#egg=[A-Za-z0-9_.-]{1,120}'
  - id: pypi-requires-malicious-name
    desc: PKG-INFO requires malicious-named package
    crit: suspicious
    conf: 0.94
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Requires-Dist:\s*[\w.-]*malicious[\w.-]*\s*([<>=!~].{0,80})?$'
  - id: pypi-requires-payload-name
    desc: PKG-INFO requires payload-named package
    crit: suspicious
    conf: 0.9
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Requires-Dist:\s*[\w.-]*(payload|implant)[\w.-]*\s*([<>=!~].{0,80})?$'
  - id: pypi-requires-stealer-name
    desc: PKG-INFO requires stealer-named package
    crit: suspicious
    conf: 0.9
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Requires-Dist:\s*[\w.-]*(stealer|exfil)[\w.-]*\s*([<>=!~].{0,80})?$'
  # GHSA-rwx2-hxr7-qgg5 / MAL-2026-18093 published this exact PyPI name as a
  # workalendar misspelling; the string is the campaign's install-time vector.
  - id: workalendar-typosquat-package-name-sdist
    desc: workcalender typosquat of workalendar
    crit: notable
    conf: 0.97
    for: [python-sdist, tar, zip]
    if:
      type: value
      path: python.name
      exact: workcalender

composite_rules:
  - id: pypi-lts-wrapper-upstream-impersonation
    desc: LTS-suffixed package wraps unsuffixed upstream module
    crit: suspicious
    conf: 0.93
    for: [python-sdist, tar, zip, text]
    scope: archive
    all:
      - id: pypi-lts-suffixed-name
      - id: lts-console-script-imports-unsuffixed-module
    any:
      - id: metadata/package/scripts/entrypoint::entry-points-file
      - id: metadata/package/scripts/entrypoint::console-scripts-header-text
  - id: pypi-direct-wheel-dependency-sdist
    desc: sdist installs direct wheel dependency
    crit: suspicious
    conf: 0.94
    for: [python-sdist, tar, zip, python, text]
    scope: archive
    all:
      - id: metadata/package/files/wheel-sdist::pypi-egg-info-dependency-links
      - id: metadata/build/pip::root-setup-dependency-links
      - id: pypi-direct-wheel-egg-link
  - id: pypi-attack-named-direct-wheel-dependency
    desc: sdist direct wheel dependency names attack payload
    crit: hostile
    conf: 0.97
    for: [python-sdist, tar, zip, pkginfo]
    scope: archive
    all:
      - id: pypi-direct-wheel-dependency-sdist
    any:
      - id: pypi-requires-malicious-name
      - id: pypi-requires-payload-name
      - id: pypi-requires-stealer-name
  - id: pypi-doi-scr-hollow-sdist
    desc: PyPI sdist uses DOI homepage with scr layout
    crit: suspicious
    conf: 0.88
    for: [python-sdist, tar, zip, pyproject-toml, pkginfo]
    scope: archive
    all:
      - id: metadata/package/homepage::pkginfo-doi-homepage
      - id: metadata/package/files/wheel-sdist::pypi-sdist-scr-source-layout
  - id: openblox-custom-build-sdist
    desc: sdist placeholder identity with custom build hook
    crit: suspicious
    conf: 0.9
    for: [python-sdist, tar, zip, python]
    scope: archive
    all:
      - id: objectives/supply-chain/impersonation/wheel-repack::sdist-openblox-placeholder-identity
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-build-py
    any:
      - id: objectives/supply-chain/install-hook/build/behavioral/execute::setup-obfuscated-shell-check-output
      - id: objectives/supply-chain/install-hook/build/behavioral/execute::setup-computed-platform-shell-command

  # A production-facing toolkit summary conflicts with a README that says the
  # sdist is unpublished test boilerplate, while its custom Hatch hook runs at
  # build time and prints a test marker.
  - id: unpublished-test-hook-posed-as-pypi-toolkit
    desc: Unpublished test hook posed as a PyPI toolkit
    crit: hostile
    conf: 0.92
    for: [python-sdist, tar, zip, pyproject.toml, markdown, python]
    scope: archive
    all:
      - id: metadata/package/description/function::pyproject-toolkit-scope-description
      - id: metadata/package/documentation/claims::readme-sdist-build-hook-test-boilerplate
      - id: metadata/package/documentation/claims::readme-not-published-disclaimer
      - id: metadata/build/pip::pyproject-hatch-custom-wheel-hook
      - id: metadata/build/package/recipe/setup-hooks::hatch-initialize-prints-test-marker

  - id: workalendar-typosquat-hatch-build-sdist
    desc: workalendar typosquat sdist with Hatch build hook
    crit: hostile
    conf: 0.96
    for: [python-sdist, tar, zip, pyproject.toml, python]
    scope: archive
    all:
      - id: workalendar-typosquat-package-name-sdist
      - id: metadata/build/pip::pyproject-hatch-custom-wheel-hook
      - id: metadata/build/package/recipe/setup-hooks::hatch-initialize-prints-test-marker

  # A name one edit from a popular package is neutral by itself -- pyaml sits
  # one insertion from PyYAML and depends on it -- so the similarity fact lives
  # in metadata/package/name/similarity. What turns a near-name into a
  # typosquat is the install hook that runs something the moment a mistyped
  # `pip install` resolves it. The hook leg is the payload-bearing composite
  # (exec/eval in the run() override, an HTTP fetch, a startfile launch), not
  # a bare cmdclass: build_ext overrides are ordinary packaging.
  - id: near-popular-name-install-hook-payload
    desc: Near-popular name with install-hook payload
    crit: hostile
    conf: 0.92
    for: [python-sdist, tar, zip, pkginfo, python]
    scope: archive
    all:
      - id: metadata/package/name/similarity::near-popular-package
      - id: objectives/command-and-control/dropper/script-eval/response-eval/remote-body-exec::install-hook-remote-response-eval
