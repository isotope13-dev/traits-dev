defaults:
  crit: suspicious
  conf: 0.9
  platforms:
  - unix
  - windows
  for:
  - pkginfo
  - python-sdist
  - whl
  - tar
  - zip
  attack: T1036.005
  mbc: B0030
traits:
- id: metadata-identity-impersonation
  desc: Metadata identity does not match package name
  if:
    type: metrics
    field: consistency.metadata_identity_mismatch
    min: 2
composite_rules:
- id: package-clones-popular-summary
  desc: Summary cloned from a popular package under another package name
  crit: suspicious
  all:
  - id: "metadata/package/description/function::catalogued-package-summary-match"
  unless:
  - id: "metadata/package/name/identity::bs4-compatibility-declaration-profile"
