defaults:
  crit: suspicious
  conf: 0.9
  platforms:
  - unix
  - windows
  for:
  - pkginfo
  - python-sdist
  - whl
  - tar
  - zip
  attack: T1036.005
  mbc: B0030
composite_rules:
- id: package-clones-popular-summary
  desc: Summary cloned from a popular package under another package name
  crit: suspicious
  all:
  - id: "metadata/package/description/function::catalogued-package-summary-match"
  unless:
  - id: "metadata/package/name/identity::bs4-compatibility-declaration-profile"
  - id: "metadata/package/name/identity::bs4-stub-installed-metadata"

- id: cloned-package-github-archive-runtime-hook
  desc: Cloned package fetches GitHub zip and hooks model validator
  crit: hostile
  conf: 0.99
  for: [pkginfo, python, whl, python-sdist, zip]
  scope: archive
  all:
  - id: package-clones-popular-summary
  - id: micro-behaviors/communications/http/download/helper::python-github-branch-zip-package-dir-extract
  - id: micro-behaviors/communications/http/download/helper::python-model-validator-hook-quarry-buffer
