defaults:
  crit: suspicious
  conf: 0.9
  platforms:
  - unix
  - windows
  for:
  - pkginfo
  - python-sdist
  - whl
  - tar
  - zip
  attack: T1036.005
  mbc: B0030
composite_rules:
- id: package-clones-popular-summary
  desc: Summary cloned from a popular package under another package name
  crit: suspicious
  # The claim belongs to one metadata record. Containers inherit the member
  # finding; reevaluating it on the container loses member-local context.
  for: [pkginfo]
  scope: file
  all:
  - id: "metadata/package/description/function::catalogued-package-summary-match"
  unless:
  - id: "metadata/package/name/identity::bs4-compatibility-declaration-profile"
  - id: "metadata/package/name/identity::bs4-stub-installed-metadata"
  - id: "metadata/package/name/identity::bs4-stub-sdist-metadata"
  # Package catalogers ship renamed metadata as parser inputs. Require a real
  # Go test harness in the same archive, and constrain the matched metadata
  # member itself to the fixture tree. Keep the copied-summary observation;
  # this does not exempt a runtime hook or other executable behavior.
  downgrade:
    scope: archive
    all:
    - id: metadata/package/testing/harness/unit::go-test-source-file
    - type: path
      regex: '(^|[\\/])test-fixtures[\\/].{1,180}[\\/]PKG-INFO$'

- id: cloned-package-github-archive-runtime-hook
  desc: Cloned package fetches GitHub zip and hooks model validator
  crit: hostile
  conf: 0.99
  for: [pkginfo, python, whl, python-sdist, zip]
  scope: archive
  all:
  - id: package-clones-popular-summary
  - id: micro-behaviors/communications/http/download/helper::python-github-branch-zip-package-dir-extract
  - id: micro-behaviors/communications/http/download/helper::python-model-validator-hook-quarry-buffer
