# A package that copied another project's metadata and changed only its name.
#
# The engine compares the distribution `Name` against the identity the package
# advertises for itself -- the `pkgname:` prefix its summary opens with, and the
# repository its homepage points at. A typosquat that ships the real library
# keeps both of those pointing at the target (`eth-account`) and edits only the
# `Name` to the confusable spelling (`ether-account`). When two independent
# identity fields agree with each other on a name the package did not declare,
# `consistency.metadata_identity_mismatch` counts them.
#
# Suspicious rather than hostile: copying metadata is impersonation, and the
# reason for it is almost always to ride a popular name -- but the shipped code
# may be the genuine article (a name-squat holding the spot) or a trojanised
# copy, and this fact alone does not say which. It is the "this is not what it
# is named" signal a security engineer wants surfaced; objectives that pair it
# with an install hook or a payload are what convict.
defaults:
  crit: suspicious
  conf: 0.9
  platforms: [unix, windows]
  for: [pkginfo, python-sdist, whl, tar, zip]
  attack: T1036.005
  mbc: B0030

traits:
  - id: metadata-identity-impersonation
    desc: Metadata identity does not match package name
    if:
      type: metrics
      field: consistency.metadata_identity_mismatch
      min: 2

  # A full working library republished under a different distribution name. The
  # rename-clone ships a popular package (aiohttp, requests) with every internal
  # identifier renamed, so its metadata is self-consistent and its code carries
  # no injected payload -- nothing the per-file matchers or the objectives can
  # catch. The tell it leaves is the one-line summary: renaming the source
  # rarely rewrites the human tagline, so the clone advertises the target's own
  # distinctive summary under a name that is not the target's. The engine
  # matches the summary against a bundled table of popular packages' published
  # taglines (public knowledge) and sets consistency.cloned_summary when the
  # summary names one package while the Name names another.
  #
  # Suspicious: republishing a whole library under a new name is brandjacking /
  # dependency-confusion staging whatever the shipped code does; the real
  # package is exempt because its Name is the tagline's owner.
  - id: package-clones-popular-summary
    desc: Summary cloned from a popular package
    if:
      type: metrics
      field: consistency.cloned_summary
      min: 1
