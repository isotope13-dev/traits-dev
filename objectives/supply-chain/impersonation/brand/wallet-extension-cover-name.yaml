# A crypto wallet extension republished under a cover name.
#
# The tell is entirely artifact-local and needs no registry corpus: the
# manifest displays a name that does not say "wallet", while the extension's
# own bundled WebExtension locale catalog defines an `appName` that does. The
# user installs what the store lists; what they get is a key-holding wallet
# whose update channel belongs to whoever published the clone. Whether the
# bundle is modified today is beside the point — the publisher can ship a
# seed-stealing build to an already-installed base whenever they like.
#
# Observed 2026-08-04: `css_injectorse-9.30.10.xpi` carries four different
# identities. The filename says CSS injector, `manifest.name` says "Web3 &
# EVM", `_locales/en` appName says "Rabby Wallet", and the Gecko id is
# `tre-gdgr@njectme.tools`, which is not Rabby's. The bundle itself is genuine
# Rabby (`webpackChunkrabby`, rabby.io, static.debank.com), and upstream Rabby
# has no 9.30.x — its releases are 0.9x.x — so the version is fabricated too.
#
# `scope: archive` because the two halves are different files. An honest
# rebrand or fork is excluded on the metadata atom: a displayed name that also
# says "wallet" never reaches this rule, nor does the `__MSG_` placeholder form
# that every properly localized extension uses.
defaults:
  platforms: [windows, unix]
  attack: T1036.005,T1195.002
  mbc: B0028

composite_rules:
  - id: wallet-extension-published-under-cover-name
    desc: Wallet extension ships under a non-wallet name
    crit: hostile
    conf: 0.97
    for: [xpi, crx, chrome-manifest, json]
    scope: archive
    all:
      - id: metadata/permission/manifest::manifest-literal-name-omits-wallet
      - id: metadata/permission/manifest::webextension-locale-appname-wallet
