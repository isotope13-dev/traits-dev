# PyPI wheels that ship under a non-Pillow distribution name while installing
# modules under the canonical `PIL` namespace and carrying BMP steganography
# staging helpers (rasterkit / textwrap-toolkit campaign).
defaults:
  platforms: [unix, windows]
  for: [whl, python]
  attack: T1195.002
  mbc: E1195

composite_rules:
  - id: pypi-wheel-pil-namespace-bmp-stego-stager
    desc: Wheel squats PIL with BMP stego staging decoder
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1036.005,T1027.003
    mbc: E1027,B0032.001
    scope: archive
    all:
      - id: objectives/supply-chain/impersonation/wheel-repack::wheel-dist-name-top-level-mismatch
      - id: metadata/package/files/wheel-sdist::wheel-top-level-pil-module
      - id: micro-behaviors/data/encode/image/bitmap::python-bmp-plane-tail-stego-decoder
      - id: metadata/package/files/wheel-sdist::wheel-pil-data-demo-bmp-member
    unless:
      - id: metadata/package/files/wheel-sdist::wheel-distribution-name-pillow
