# Typosquat npm packages impersonating Polymarket's CLOB client while staging
# dependency tarballs through npmjs-lookalike registry hosts.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar]
  attack: T1195.002,T1036.005
  mbc: E1195

traits:
  - id: polymarkets-scoped-clob-client-v2-name
    desc: npm name @polymarkets/clob-client-v2 scope
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@polymarkets/clob-client-v2"

composite_rules:
  - id: npm-polymarkets-clob-registrynpmjs-dropper
    desc: Polymarket CLOB typosquat with lookalike tarball dep
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: polymarkets-scoped-clob-client-v2-name
      - id: objectives/supply-chain/impersonation/registry/spoofed::dep-fake-npmjs-registry-tarball
