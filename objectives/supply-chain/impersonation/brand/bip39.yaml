# The real PyPI distribution is `bip39`.  A `bip39-py` wheel that points at a
# nonexistent developer repository is a distinct package identity, not the
# upstream library.
defaults:
  platforms: [unix, windows]
  for: [whl]
  attack: T1195.002
  mbc: E1195

traits:
  - id: wheel-bip39-lookalike-name
    desc: BIP39 lookalike wheel name
    crit: suspicious
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: bip39_py

  - id: wheel-bip39-fake-homepage
    desc: BIP39 lookalike homepage URL
    crit: suspicious
    conf: 0.99
    if:
      type: value
      path: whl.home_page
      exact: https://github.com/dev/bip39-py

composite_rules:
  - id: wheel-bip39-identity-impersonation
    desc: Wheel impersonates BIP39 package identity
    crit: hostile
    conf: 0.995
    all:
      - id: wheel-bip39-lookalike-name
      - id: wheel-bip39-fake-homepage
