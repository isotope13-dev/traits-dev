# A package published under a foreign name while retaining discord.js's exact
# description, official source repository and official project homepage. The
# genuine discord.js publication is excluded; the remaining tuple is a strong
# package-identity deception signal, but stays suspicious because an honest
# fork can retain upstream attribution.
defaults:
  platforms: [unix, windows]
  for: [package.json, pkginfo]
  attack: T1195.002
  mbc: E1195.002

composite_rules:
  - id: discordjs-identity-under-foreign-name
    desc: discord.js identity published under another name
    crit: suspicious
    conf: 0.96
    all:
      - id: well-known/lib/network/discord-js::npm-package-description
      - id: well-known/lib/network/discord-js::npm-package-repository
      - id: well-known/lib/network/discord-js::npm-package-homepage
    unless:
      - id: well-known/lib/network/discord-js::npm-package-name
