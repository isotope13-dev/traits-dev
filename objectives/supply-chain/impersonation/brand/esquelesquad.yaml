defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, binaries]
  size_min: 512
  size_max: 500000000
composite_rules:
  # Attribution and a metadata mismatch may occur in different members; they
  # are a lead, not proof that this person impersonated another publisher.
  - id: esquelesquad-reference-with-tui-http-mismatch
    desc: EsqueleSquad text and TUI/HTTP metadata mismatch
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: objectives/supply-chain/impersonation/brand::metadata-mismatch-tui-http
    any:
      - id: metadata/vendor/string::esquelesquad-name-reference
      - id: micro-behaviors/communications/email/address::esquelesquad-email-reference
      - id: metadata/vendor/copyright::esquelesquad-copyright-reference
