# Typosquatted @angular/core scoped packages (e.g. @angjlar/core, @anguar/core).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar]
  attack: T1195.002

traits:
  - id: npm-scoped-angular-core-typosquat-name
    desc: Scoped npm name typosquats @angular/core
    crit: notable
    conf: 0.95
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@(ang[ij][a-z]{2,}|anguar)/core$'

composite_rules:
  - id: angular-core-scoped-squat-remote-install
    desc: Typosquatted Angular core runs remote install pipe
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: npm-scoped-angular-core-typosquat-name
      - id: objectives/supply-chain/install-hook/scripts/remote-fetch::postinstall-curl-wget-pipe-node-exec
