# Typosquatted @angular/core scoped packages (e.g. @angjlar/core, @anguar/core).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar]
  attack: T1195.002

composite_rules:
  - id: angular-core-scoped-squat-remote-install
    desc: Angular lookalike claims framework function and executes remote source
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/description/function::angular-core-framework-claim
      - id: metadata/package/name/similarity::npm-scoped-angular-core-near-name
      - id: micro-behaviors/process/deploy::npm-postinstall-http-node-stdin
