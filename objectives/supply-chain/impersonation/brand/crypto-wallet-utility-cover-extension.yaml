# Browser extensions that list as cryptocurrency wallets while the store copy
# or bundled code brands a unrelated utility (observed in Unit42 Oct 2026).
defaults:
  platforms: [windows, unix]
  for: [crx, xpi, zip, chrome-manifest, javascript, typescript]
  attack: T1036.005,T1195.002
  mbc: B0028

composite_rules:
  - id: crypto-wallet-extension-utility-cover-identity
    desc: Crypto wallet extension hides under utility branding
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/permission/manifest::manifest-name-crypto-finance-brand
      - id: metadata/permission/manifest::manifest-description-utility-task-cover
