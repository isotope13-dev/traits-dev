defaults:
  crit: hostile
  conf: 0.995
  platforms:
  - unix
  - windows
  for:
  - npm
  - tar
  - package.json
  - markdown
  attack: T1195.002
  mbc: B0024
composite_rules:
- id: hollow-express-cors-impersonation
  desc: Hollow package impersonates Express CORS project
  scope: archive
  all:
  - id: metadata/package/files/included::npm-publish-root-manifest
  - id: well-known/lib/web/server/cors::express-cors-upstream-repository
  - id: well-known/lib/web/server/cors::express-cors-readme-heading
  - id: metadata/package/entrypoint::main-runtime-tree-entrypoint
  - id: metadata/package/files/package-json::files-runtime-tree-ref
  - id: metadata/package/dependencies/presence::has-runtime-deps
  - id: metadata/package/repository::repository-provenance
  unless:
  - id: metadata/package/files/included::npm-runtime-code-member
  - id: metadata/package/files/included::npm-vendored-node-modules-runtime-member
  - id: metadata/package/files/runtime::javascript-family-lib-tree-artifact
  - id: metadata/package/files/runtime::javascript-dist-tree-artifact
- id: hollow-express-cors-url-impersonation
  desc: Hollow package uses Express CORS repository URL
  scope: archive
  all:
  - id: metadata/package/files/included::npm-publish-root-manifest
  - id: well-known/lib/web/server/cors::express-cors-upstream-repository-url
  - id: well-known/lib/web/server/cors::express-cors-readme-heading
  - id: metadata/package/entrypoint::main-runtime-tree-entrypoint
  - id: metadata/package/files/package-json::files-runtime-tree-ref
  - id: metadata/package/dependencies/presence::has-runtime-deps
  - id: metadata/package/repository::repository-provenance
  unless:
  - id: metadata/package/files/included::npm-runtime-code-member
  - id: metadata/package/files/included::npm-vendored-node-modules-runtime-member
  - id: metadata/package/files/runtime::javascript-family-lib-tree-artifact
  - id: metadata/package/files/runtime::javascript-dist-tree-artifact
