defaults:
  platforms: [unix, windows]
  for: [npm, tar, archives]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: hollow-express-cors-impersonation
    desc: Hollow package impersonates Express CORS project
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: well-known/lib/cors::express-cors-upstream-repository
      - id: well-known/lib/cors::express-cors-readme-heading
      - id: metadata/package/manifest/entrypoint::main-runtime-tree-entrypoint
      - id: metadata/package/files/package-json::files-runtime-tree-ref
      - id: metadata/package/dependencies::has-runtime-deps
      - id: metadata/package/manifest/repository::repository-provenance
    unless:
      - id: metadata/package/files/included::npm-runtime-code-member

  - id: hollow-express-cors-url-impersonation
    desc: Hollow package uses Express CORS repository URL
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: well-known/lib/cors::express-cors-upstream-repository-url
      - id: well-known/lib/cors::express-cors-readme-heading
      - id: metadata/package/manifest/entrypoint::main-runtime-tree-entrypoint
      - id: metadata/package/files/package-json::files-runtime-tree-ref
      - id: metadata/package/dependencies::has-runtime-deps
      - id: metadata/package/manifest/repository::repository-provenance
    unless:
      - id: metadata/package/files/included::npm-runtime-code-member
