defaults:
  platforms: [unix, windows]
  for: [npm, tar, archives]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: hollow-express-cors-impersonation
    desc: Hollow package impersonates Express CORS project
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      # This composite is for an npm-published package tarball.  Requiring the
      # canonical package/package.json root prevents a normal application
      # archive containing the real cors dependency from supplying the
      # manifest-side evidence from unrelated archive members.
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: well-known/lib/web/cors::express-cors-upstream-repository
      - id: well-known/lib/web/cors::express-cors-readme-heading
      - id: metadata/package/manifest/entrypoint::main-runtime-tree-entrypoint
      - id: metadata/package/files/package-json::files-runtime-tree-ref
      - id: metadata/package/dependencies/manifest::has-runtime-deps
      - id: metadata/package/manifest/repository::repository-provenance
    unless:
      - id: metadata/package/files/included::npm-runtime-code-member
      - id: metadata/package/files/included::npm-vendored-node-modules-runtime-member
      # The archive.members legs above are unavailable for a gzip-wrapped npm
      # tarball nested in another archive, which is exactly how the genuine
      # cors tarball appears in an .npm/_cacache tree. Match the decoded
      # member file instead so a real lib/ runtime is not read as hollow.
      - id: metadata/package/files/runtime::javascript-lib-tree-artifact
      - id: metadata/package/files/runtime::javascript-dist-tree-artifact

  - id: hollow-express-cors-url-impersonation
    desc: Hollow package uses Express CORS repository URL
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: well-known/lib/web/cors::express-cors-upstream-repository-url
      - id: well-known/lib/web/cors::express-cors-readme-heading
      - id: metadata/package/manifest/entrypoint::main-runtime-tree-entrypoint
      - id: metadata/package/files/package-json::files-runtime-tree-ref
      - id: metadata/package/dependencies/manifest::has-runtime-deps
      - id: metadata/package/manifest/repository::repository-provenance
    unless:
      - id: metadata/package/files/included::npm-runtime-code-member
      - id: metadata/package/files/included::npm-vendored-node-modules-runtime-member
      - id: metadata/package/files/runtime::javascript-lib-tree-artifact
      - id: metadata/package/files/runtime::javascript-dist-tree-artifact
