# npm packages that masquerade as Wix Thunderbolt registry modules while running
# import-time host recon and HTTP callback exfiltration (no install hook).
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, npm, tar]
  attack: T1195.002
  mbc: E1041

composite_rules:
  - id: npm-wix-thunderbolt-registry-rce-dropper
    desc: npm package fakes Wix Thunderbolt registry with RCE
    crit: hostile
    conf: 0.999
    attack: T1195.002,T1059.007,T1041
    scope: archive
    all:
      - id: metadata/lang/javascript-features::wix-thunderbolt-component-loader-api
      - id: metadata/package/files/package-json::files-thunderbolt-registry-js
    any:
      - id: objectives/exfiltration/http/query::node-import-time-execsync-uri-fetch-exfil
      - id: objectives/exfiltration/http/query::node-obfuscated-dynamic-execsync-fetch-exfil
    unless:
      - id: metadata/package/testing/

  - id: npm-css-polyfill-wix-thunderbolt-trojan
    desc: CSS polyfill claim ships Wix registry trojan
    crit: hostile
    conf: 0.998
    attack: T1195.002,T1059.007,T1041
    scope: archive
    all:
      - id: metadata/package/description/function::description-css-polyfill-utility
      - id: metadata/package/files/package-json::files-thunderbolt-registry-js
    any:
      - id: objectives/exfiltration/http/query::node-import-time-execsync-uri-fetch-exfil
      - id: objectives/exfiltration/http/query::node-obfuscated-dynamic-execsync-fetch-exfil
    unless:
      - id: metadata/package/testing/
