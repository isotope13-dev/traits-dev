# npm packages that masquerade as Wix Thunderbolt registry modules while running
# import-time host recon and HTTP callback exfiltration (no install hook).
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, npm, tar]
  attack: T1195.002
  mbc: E1041

composite_rules:
  - id: npm-wix-registry-facade-command-exfil
    desc: Wix registry facade conceals command-output export
    crit: hostile
    conf: 0.999
    attack: T1195.002,T1059.007,T1041
    scope: archive
    all:
      - id: well-known/lib/ui/wix::wix-thunderbolt-registry-api-surface
    any:
      - id: objectives/exfiltration/http/query::node-module-load-command-output-http-exfil
      - id: objectives/exfiltration/http/query::node-obfuscated-dynamic-execsync-fetch-exfil
      - id: objectives/supply-chain/impersonation/wix-thunderbolt-registry::wix-import-time-oast-http-exfil-atoms
      - id: objectives/supply-chain/impersonation/wix-thunderbolt-registry::wix-import-time-query-http-exfil-atoms
    unless:
      - id: metadata/package/testing/

  - id: npm-css-polyfill-wix-thunderbolt-trojan
    desc: CSS polyfill claim ships Wix registry trojan
    crit: hostile
    conf: 0.998
    attack: T1195.002,T1059.007,T1041
    scope: archive
    all:
      - id: metadata/package/description/function::description-css-polyfill-utility
      - id: well-known/lib/ui/wix::wix-thunderbolt-registry-api-surface
    any:
      - id: objectives/exfiltration/http/query::node-module-load-command-output-http-exfil
      - id: objectives/exfiltration/http/query::node-obfuscated-dynamic-execsync-fetch-exfil
      - id: objectives/supply-chain/impersonation/wix-thunderbolt-registry::wix-import-time-oast-http-exfil-atoms
      - id: objectives/supply-chain/impersonation/wix-thunderbolt-registry::wix-import-time-query-http-exfil-atoms
    unless:
      - id: metadata/package/testing/
