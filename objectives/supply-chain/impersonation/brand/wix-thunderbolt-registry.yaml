# npm packages that masquerade as Wix Thunderbolt registry modules while running
# import-time host recon and HTTP callback exfiltration (no install hook).
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, npm, tar]
  attack: T1195.002
  mbc: E1041

composite_rules:
  - id: npm-wix-registry-facade-command-exfil
    desc: Wix registry facade conceals command-output export
    crit: hostile
    conf: 0.999
    attack: T1195.002,T1059.007,T1041
    scope: archive
    all:
      - id: well-known/lib/ui/wix::wix-thunderbolt-registry-api-surface
    any:
      - id: objectives/exfiltration/http/query::node-obfuscated-dynamic-execsync-fetch-exfil
      - id: objectives/exfiltration/stealer/system-info/profile::js-execsync-oob-recon-export
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
  - id: npm-thunderbolt-registry-module-escape-exfil
    desc: Thunderbolt registry npm module escapes require and exfils
    crit: hostile
    conf: 0.999
    attack: T1195.002,T1059.004,T1611,T1041
    scope: archive
    all:
      - id: metadata/package/files/package-json::files-thunderbolt-registry-js
      - id: well-known/lib/ui/wix::wix-thunderbolt-registry-api-surface
      - id: micro-behaviors/os/module/dynamic-load::module-constructor-access
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
    any:
      - id: micro-behaviors/fs/path/credential::runtime-secret-directory-text
      - id: micro-behaviors/communications/url/host::free-host-gt-tc-callback
    needs: 1
