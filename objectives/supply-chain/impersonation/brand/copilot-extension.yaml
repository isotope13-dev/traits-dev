# A marketplace listing that borrows GitHub's Copilot brand for an assistant
# GitHub did not write.
#
# The name is the product here. "Copilot" is what a developer searches for, and
# an extension called "<vendor> Copilot" published by an individual account
# inherits that search traffic and the trust attached to it. The victim installs
# what reads as an official provider, hands it an API key, and routes their chat
# — prompts, file contents, tool results, whatever the workspace context
# includes — through a third party's endpoint.
#
# What separates this from an honest integration is that the extension *is* the
# assistant. A companion tool ("Copilot usage stats", "Copilot keybindings")
# borrows the word to say what it works with; this one implements the chat
# backend itself, which is exactly the role the borrowed name implies it holds
# officially. Requiring the LLM chat payload is what draws that line.
#
# The `unless:` is the whole point of the rule rather than a carve-out: GitHub
# and Microsoft publish Copilot, so for them the name is not a claim.
defaults:
  platforms: [unix, windows]
  for: [vsix, zip, archives]
  attack: T1195.002,T1036
  mbc: B0032

composite_rules:
  - id: third-party-copilot-branded-provider
    desc: Non-GitHub extension brands itself Copilot
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: metadata/package/manifest/runtime::vscode-extension
      - id: metadata/package/manifest/runtime::vscode-copilot-brand-display-name
      - id: micro-behaviors/communications/http/llm::llm-messages-path
    unless:
      - id: metadata/package/manifest/runtime::vscode-first-party-copilot-publisher
