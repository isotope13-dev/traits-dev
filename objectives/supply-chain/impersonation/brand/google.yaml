# PyPI wheels that impersonate Google LLC authorship or maintainer identity
# while publishing under non-Google distribution names and diverting cloud API calls.
defaults:
  platforms: [unix, windows]
  for: [whl, python]
  attack: T1195.002,T1036.005
  mbc: E1195

traits:
  - id: wheel-author-google-llc
    desc: Wheel metadata claims Google LLC author
    for: [whl]
    crit: notable
    conf: 0.9
    if:
      type: value
      path: whl.authors[*].name
      exact: Google LLC

  - id: wheel-author-email-google
    desc: Wheel metadata claims google.com author email
    for: [whl]
    crit: notable
    conf: 0.9
    if:
      type: value
      path: whl.authors[*].email
      regex: '(?i)@google\.com$'

composite_rules:
  - id: wheel-impersonates-google-authorship
    desc: Non-Google wheel claims Google LLC authorship
    crit: suspicious
    conf: 0.95
    for: [whl]
    all:
      - id: metadata/package/files/wheel-sdist::wheel-dist-info-member
    any:
      - id: wheel-author-google-llc
      - id: wheel-author-email-google
    unless:
      - id: metadata/package/name/brand::canonical-google-wheel-distribution

  - id: google-impersonation-cloud-diversion
    desc: Impersonated Google wheel diverts calls to cloud host
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: wheel-impersonates-google-authorship
    any:
      - id: objectives/supply-chain/trojanized/library/host-diversion::earth-engine-endpoint-diverted-to-aws
      - id: objectives/supply-chain/trojanized/library/host-diversion::google-discovery-client-url-diversion
