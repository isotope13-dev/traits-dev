# Typosquats of Polymarket's official @polymarket npm scope and CLOB client.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002
  mbc: E1195

traits:
  - id: npm-polymarkets-scope-clob-name
    desc: npm @polymarkets/clob-client scope typosquat
    crit: suspicious
    conf: 0.96
    if:
      type: value
      path: name
      regex: '^@polymarkets/clob-client'

composite_rules:
  - id: polymarkets-clob-lookalike-registry-payload
    desc: Polymarkets CLOB typosquat with fake registry tarball
    crit: hostile
    conf: 0.98
    for: [package.json, npm, tar]
    scope: archive
    all:
      - id: npm-polymarkets-scope-clob-name
      - id: objectives/supply-chain/impersonation/registry/spoofed::dep-npm-registry-lookalike-host
