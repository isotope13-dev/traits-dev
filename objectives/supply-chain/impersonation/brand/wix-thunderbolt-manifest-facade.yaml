# npm typosquats that ship a Wix Thunderbolt site manifest JSON with baseURL on a
# third-party host and payload.bundle.* model entries, while the published main
# module is a hollow CommonJS stub (e.g. css-view-timeline-util).
defaults:
  platforms: [unix, windows]
  for: [json, text, javascript, npm, tar, package.json]
  attack: T1195.002
  mbc: E1041

traits:
  - id: thunderbolt-manifest-host-thunderbolt
    desc: Thunderbolt manifest host is thunderbolt
    crit: notable
    conf: 0.99
    for: [json, text]
    if:
      type: text
      regex: '"host"\s*:\s*"thunderbolt"'

  - id: thunderbolt-manifest-dsgnsys-namespace
    desc: dsgnsys namespace in manifest
    crit: notable
    conf: 0.99
    for: [json, text]
    if:
      type: text
      regex: '"namespace"\s*:\s*"dsgnsys"'

  - id: thunderbolt-manifest-payload-bundle-model
    desc: Manifest model lists payload.bundle
    crit: notable
    conf: 0.99
    for: [json, text]
    if:
      type: text
      substr: payload.bundle.min.js

  - id: thunderbolt-manifest-non-wix-baseurl
    desc: Thunderbolt manifest off-Wix baseURL
    crit: notable
    conf: 0.98
    for: [json, text]
    if:
      type: text
      regex: '"baseURL"\s*:\s*"https?://.{0,240}"'
    not:
      - regex: parastorage\.com
      - regex: wixstatic\.com
      - regex: //www\.wix\.com/

  - id: rb-dsgnsys-thunderbolt-manifest-basename
    desc: rb_* thunderbolt manifest basename
    crit: notable
    conf: 0.99
    for: [json, text]
    if:
      type: path
      basename: true
      regex: '^rb_.*\.thunderbolt\.manifest.*\.json$'

composite_rules:
  - id: thunderbolt-dsgnsys-manifest-remote-payload-document
    desc: dsgnsys thunderbolt manifest remote payload
    crit: hostile
    conf: 0.999
    attack: T1195.002,T1071.001
    scope: file
    for: [json, text]
    all:
      - id: thunderbolt-manifest-host-thunderbolt
      - id: thunderbolt-manifest-dsgnsys-namespace
      - id: thunderbolt-manifest-payload-bundle-model
      - id: thunderbolt-manifest-non-wix-baseurl
