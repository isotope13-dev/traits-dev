# A republished scoped package retains dotenv's README verbatim: its heading
# links to the unscoped registry entry and every install example tells the user
# to fetch `dotenv`, not the package named by its own manifest. That mismatch is
# suspicious identity evidence, but only becomes hostile when the copied
# dotenv entrypoint invokes an added scoped configuration module.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, archives]
  attack: T1195.002

composite_rules:
  - id: scoped-dotenv-upstream-readme
    desc: Scoped dotenv package retains upstream README
    crit: suspicious
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/manifest/name::scoped-dotenv-package-name
      - id: well-known/lib/core/dotenv::readme-registry-link
      - id: well-known/lib/core/dotenv::readme-install-command

  - id: scoped-dotenv-readme-hidden-sidecar
    desc: Dotenv clone hides a runtime sidecar
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      # Expand the identity legs instead of nesting the archive-scoped
      # suspicious composite: each member finding must be pooled into this
      # archive verdict alongside the JavaScript-side loader.
      - id: metadata/package/manifest/name::scoped-dotenv-package-name
      - id: well-known/lib/core/dotenv::readme-registry-link
      - id: well-known/lib/core/dotenv::readme-install-command
      - id: metadata/package/documentation::readme-zero-dependency-claim
      - id: objectives/supply-chain/trojanized/library/hidden-dep::dotenv-config-entrypoint-sidecar
