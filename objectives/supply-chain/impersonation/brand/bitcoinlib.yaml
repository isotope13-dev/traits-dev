# The genuine distribution is `bitcoinlib`.  The `bitcoinlib-py` identity and
# its nonexistent developer repository are an unrelated lookalike package.
defaults:
  platforms: [unix, windows]
  for: [whl]
  attack: T1195.002
  mbc: E1195

traits:
  - id: wheel-bitcoinlib-lookalike-name
    desc: BitcoinLib lookalike wheel name
    crit: suspicious
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: bitcoinlib_py

  - id: wheel-bitcoinlib-fake-homepage
    desc: BitcoinLib lookalike homepage URL
    crit: suspicious
    conf: 0.99
    if:
      type: value
      path: whl.home_page
      exact: https://github.com/dev/bitcoinlib-py

composite_rules:
  - id: wheel-bitcoinlib-identity-impersonation
    desc: Wheel impersonates BitcoinLib identity
    crit: hostile
    conf: 0.995
    all:
      - id: wheel-bitcoinlib-lookalike-name
      - id: wheel-bitcoinlib-fake-homepage
