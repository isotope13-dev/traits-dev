defaults:
  platforms: [linux, macos, windows, unix, android, ios]
composite_rules:
  - id: fake-urllib3-metadata
    desc: Package description mimics urllib3 but does not mention urllib3
    crit: suspicious
    conf: 1.0
    all:
      - id: metadata/build/pip::setup-py
      - id: well-known/lib/network/urllib3::urllib3-content
    unless:
      - id: well-known/lib/network/urllib3::urllib3-name
      - id: well-known/lib/cloud/botocore::botocore-lib
  # terminal-ui-description lives in the package's PKG-INFO/METADATA record
  # (for: [pkginfo]); urllib3-content is the actual module source (for:
  # [scripts, binaries]). Both are separate archive members of the same
  # published package, so pool by archive like empty-wheel-remote-loader-claim
  # does for the same PyPI pkginfo+content pairing.
  - id: metadata-mismatch-tui-http
    desc: Package Summary claims TUI but Description describes HTTP client
    crit: suspicious
    conf: 0.8
    for: [whl, pkginfo, sdist, python]
    scope: archive
    all:
      - id: metadata/package/description::terminal-ui-description
      - id: well-known/lib/network/urllib3::urllib3-content
