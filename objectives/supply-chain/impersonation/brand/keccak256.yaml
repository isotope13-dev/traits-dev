# keccak256 brand impersonation.
#
# `kecak256` — keccak256 with one 'c' dropped — republished miguelmota/keccak256
# under the misspelling. The manifest is the upstream one: same description,
# same keyword list, same runtime and dev dependencies, same author name. Only
# the identity that points back at the original was removed (repository, bugs
# and homepage URLs deleted, entry point renamed keccak256.js -> kecak256.js),
# and the README still carries the upstream `# keccak256` title above an
# install line for the squatted name. npm pulled every version on 2026-06-09
# and replaced the coordinate with a security holding package.
#
# Suspicious, not hostile: the shipped code is a faithful copy of the original
# and does nothing else. What is being detected is the name confusion — a
# package wearing another project's published identity — which is the setup a
# later trojanized release monetises, not the payload itself.
#
# Keyed on the upstream identity rather than on the misspelling, so the next
# variant (keccak-256, kecack256, keccak256js, ...) is caught by the same rules.
defaults:
  platforms: [unix, windows]
  attack: T1195.002
  mbc: E1195.002
  for: [package.json]

composite_rules:
  - id: keccak256-manifest-identity-under-foreign-name
    desc: keccak256 manifest identity under another name
    crit: suspicious
    conf: 0.9
    all:
      - id: well-known/lib/crypto/keccak256::npm-package-description
      - id: well-known/lib/crypto/keccak256::npm-package-keyword
      - id: well-known/lib/crypto/keccak256::npm-package-author
    unless:
      # The genuine publication, and any fork honest enough to keep pointing
      # at the upstream repository it copied.
      - id: well-known/lib/crypto/keccak256::npm-package-name
      - id: well-known/lib/crypto/keccak256::npm-package-repository
