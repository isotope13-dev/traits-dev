# bn.js brand impersonation.
# Attackers republish indutny's big-number library under a variant name
# (e.g. `buffernumber.js`) while keeping the indutny/bn.js homepage and
# repository, then add a bare `require("<dep>")` to lib/bn.js so the
# library's only declared runtime dependency runs as soon as it is loaded.
# The official package is named `bn.js`, has no runtime dependencies, and its
# source never requires a package solely for side effects. A stub that merely
# claims the bn.js repository is a misdescribed package, not a trojanized one
# (see testdata/benign/bnjs-next-runtimejs.tgz), so conviction requires the
# archive to ship the real BN implementation the require was grafted into.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002
  mbc: E1195.002

traits:
  - id: canonical-bn-js-package-name
    desc: Official bn.js npm package name
    crit: notable
    conf: 0.95
    if:
      type: value
      path: name
      exact: bn.js

  - id: bn-js-upstream-repository
    desc: Repository is indutny/bn.js
    crit: notable
    conf: 0.95
    if:
      type: value
      path: repository.url
      regex: 'github\.com[:/]indutny/bn\.js(\.git)?/?$'

  - id: bn-js-upstream-homepage
    desc: Homepage is indutny/bn.js
    crit: notable
    conf: 0.95
    if:
      type: value
      path: homepage
      substr: github.com/indutny/bn.js

  - id: bn-js-implementation-source
    desc: Ships the bn.js BN constructor
    crit: notable
    conf: 0.95
    for: [javascript]
    if:
      type: text
      substr: "function BN (number, base, endian)"

composite_rules:
  - id: bn-js-clone-side-effect-dependency-loader
    desc: bn.js clone loads injected dependency on import
    crit: hostile
    conf: 0.98
    for: [npm, tar, zip, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/dependencies/manifest/presence::has-runtime-deps
      - id: bn-js-implementation-source
      - id: micro-behaviors/os/module/require::cjs-side-effect-package-require
    any:
      - id: bn-js-upstream-repository
      - id: bn-js-upstream-homepage
    # A scoped fork names its publisher on every install; keeping upstream
    # attribution there is fork credit, not impersonation.
    unless:
      - id: canonical-bn-js-package-name
      - id: metadata/package/name/vocabulary::scoped-package-name
