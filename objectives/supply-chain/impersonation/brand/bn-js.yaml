defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  attack: T1195.002
  mbc: E1195.002
traits:
- id: canonical-bn-js-package-name
  desc: Official bn.js npm package name
  crit: notable
  conf: 0.95
  if:
    type: value
    path: name
    exact: bn.js
- id: bn-js-upstream-repository
  desc: Repository is indutny/bn.js
  crit: notable
  conf: 0.95
  if:
    type: value
    path: repository.url
    regex: github\.com[:/]indutny/bn\.js(\.git)?/?$
- id: bn-js-upstream-homepage
  desc: Homepage is indutny/bn.js
  crit: notable
  conf: 0.95
  if:
    type: value
    path: homepage
    substr: github.com/indutny/bn.js
composite_rules:
- id: bn-js-clone-side-effect-dependency-loader
  desc: bn.js clone loads injected dependency on import
  crit: hostile
  conf: 0.98
  for:
  - npm
  - tar
  - zip
  - package.json
  - javascript
  scope: archive
  all:
  - id: metadata/package/dependencies/presence::has-runtime-deps
  - id: well-known/lib/data/bn-js::bn-js-implementation-source
  - id: micro-behaviors/os/module/require::cjs-side-effect-package-require
  any:
  - id: bn-js-upstream-repository
  - id: bn-js-upstream-homepage
  unless:
  - id: canonical-bn-js-package-name
  - id: metadata/package/name/vocabulary::scoped-package-name
