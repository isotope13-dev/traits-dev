# PyPI wheels that republish the Pipecat framework under an alternate
# distribution name while shipping the upstream pipecat import module.
defaults:
  platforms: [unix, windows]
  for: [whl]
  attack: T1195.002

composite_rules:
  - id: dv-pipecat-ai-wheel-repack
    desc: dv-pipecat-ai wheel repacks pipecat module
    crit: suspicious
    conf: 0.94
    all:
      - id: well-known/app/ai/agent-runtime/pipecat::wheel-distribution-dv-pipecat-ai
      - id: well-known/app/ai/agent-runtime/pipecat::wheel-top-level-pipecat-module
