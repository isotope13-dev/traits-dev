# Typosquatted @angular/cli releases that swap the official MCP SDK dependency
# for the similarly named @modelcontextprotocol/server package.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar]
  attack: T1195.002

composite_rules:
  - id: angular-cli-typosquat-mcp-server-dependency
    desc: Typosquatted Angular CLI scope declares @modelcontextprotocol/server
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/name/vocabulary::npm-scope-angular-lookalike
      - id: metadata/package/dependencies/manifest/identity::npm-dep-modelcontextprotocol-server
