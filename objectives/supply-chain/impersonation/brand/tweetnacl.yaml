# TweetNaCl.js brand impersonation.
# Attackers republish the crypto library under a variant name while retaining
# dchest/tweetnacl-js / tweetnacl.js.org branding, then inject a sibling
# `*-tweetnacl*-utils` runtime dependency as the malware drop site. The
# official package is named `tweetnacl` and uses `tweetnacl-util` (no trailing
# "s") only as a devDependency.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002
  mbc: E1195.002

traits:
  - id: noncanonical-tweetnacl-package-name
    desc: Non-canonical TweetNaCl package name
    crit: suspicious
    conf: 0.97
    if:
      type: value
      path: name
      regex: '(?i)[a-z0-9._-]*tweetnacl[a-z0-9._-]*'
    unless:
      - id: well-known/lib/crypto/tweetnacl-js::npm-package-name
      - id: well-known/lib/crypto/tweetnacl-js::npm-util-package-name

  - id: npm-dep-tweetnacl-utils-sidecar
    desc: Non-official TweetNaCl utils dependency
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '"dependencies"\s*:\s*\{[^}]{0,800}"[a-z0-9._-]*tweetnacl[a-z0-9._-]*-utils"\s*:'

composite_rules:
  - id: tweetnacl-brand-spoof-utils-sidecar
    desc: TweetNaCl brand spoof with utils sidecar
    crit: hostile
    conf: 0.995
    all:
      - id: noncanonical-tweetnacl-package-name
      - id: npm-dep-tweetnacl-utils-sidecar
    any:
      - id: well-known/lib/crypto/tweetnacl-js::npm-package-repository
      - id: well-known/lib/crypto/tweetnacl-js::npm-package-homepage

  - id: tweetnacl-identity-laundering
    desc: Retains TweetNaCl branding under other name
    crit: suspicious
    conf: 0.95
    all:
      - id: noncanonical-tweetnacl-package-name
    any:
      - id: well-known/lib/crypto/tweetnacl-js::npm-package-repository
      - id: well-known/lib/crypto/tweetnacl-js::npm-package-homepage
