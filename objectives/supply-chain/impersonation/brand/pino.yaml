# Pino-clone campaigns keep Pino's badge row — the npm-version badge names
# pino and the CI badge points at pinojs/pino — while publishing under an
# unrelated package name and stripping the repository field, so the README's
# only npm identity is the impersonated library. The parser-session npm
# campaign (registry history: thirteen versions in four hours, Pino's README
# badges and getpino.io homepage, a hex-concealed exfiltration writer) is the
# observed shape. Suspicious rather than hostile: a repository-less fork that
# kept stale upstream badges remains plausible until payload evidence joins.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip]
  attack: T1195.002,T1036

composite_rules:
  - id: pino-badged-readme-under-unrelated-package
    desc: Pino-badged README under unrelated package name
    crit: suspicious
    conf: 0.9
    scope: archive
    for: [npm, tar, zip, javascript, typescript, markdown, package.json]
    all:
      # The README's npm links name a package other than the manifest's own.
      - id: metadata/package/documentation/package-metadata::readme-npm-links-exclude-manifest-package
      # Pino source or documentation wording somewhere in the same package.
      - id: well-known/lib/observability/pino::pino-source-branding
      # No declared home of its own: forks and wrappers that keep an upstream
      # badge usually still declare their repository.
      - id: metadata/package/repository::manifest-lacks-repository-metadata
    unless:
      - id: well-known/lib/observability/pino::pino-library-context
