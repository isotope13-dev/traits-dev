# PyPI wheels that impersonate the canonical `requests` library identity
# (psf/requests homepage, singular `request` module namespace) while shipping
# under an unrelated distribution name.
defaults:
  platforms: [unix, windows]
  for: [whl]
  attack: T1195.002
  mbc: E1195

traits:
  - id: wheel-psf-request-homepage
    desc: Wheel metadata claims psf/request homepage
    crit: notable
    conf: 0.94
    if:
      type: value
      path: whl.home_page
      regex: '(?i)github\.com/psf/request\b'
  - id: wheel-top-level-request-module
    desc: Wheel exposes singular request top_level module
    crit: notable
    conf: 0.9
    if:
      type: value
      path: whl.top_level_packages[*]
      exact: request

composite_rules:
  - id: pypi-psf-request-typosquat-hidden-payload
    desc: psf/request typosquat wheel hides dotfile payload
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1036.005,T1027
    mbc: E1027
    scope: archive
    all:
      - id: wheel-psf-request-homepage
      - id: wheel-top-level-request-module
      - id: objectives/supply-chain/impersonation/wheel-repack::wheel-dist-name-top-level-mismatch
      - id: metadata/package/files/wheel-sdist::wheel-dot-payload-member
