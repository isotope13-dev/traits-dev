# A repackaged eth-account wheel retains the official project metadata while
# changing the distribution identity.  This is a reusable identity check for
# future releases of the same impersonation campaign, not a hash allowlist.
defaults:
  platforms: [unix, windows]
  attack: T1036
  mbc: E1195.002

traits:
  - id: pypi-lookalike-name
    desc: account-eth lookalike distribution name
    crit: suspicious
    conf: 0.99
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: account-eth

  - id: wheel-lookalike-name
    desc: account-eth lookalike wheel name
    crit: suspicious
    conf: 0.99
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: account_eth

composite_rules:
  - id: pypi-eth-account-identity-impersonation
    desc: PyPI metadata impersonates eth-account under another name
    crit: hostile
    conf: 0.995
    for: [pkginfo]
    all:
      - id: well-known/lib/eth-account::pypi-homepage
      - id: well-known/lib/eth-account::pypi-author-email
      - id: pypi-lookalike-name

  - id: wheel-eth-account-identity-impersonation
    desc: Wheel impersonates eth-account under another name
    crit: hostile
    conf: 0.995
    for: [whl]
    scope: archive
    all:
      - id: well-known/lib/eth-account::wheel-homepage
      - id: well-known/lib/eth-account::wheel-author-email
      - id: wheel-lookalike-name
