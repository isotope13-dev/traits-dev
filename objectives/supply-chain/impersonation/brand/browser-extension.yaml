defaults:
  conf: 0.99
  platforms: [windows, unix]
  for: [chrome-manifest]
  attack: T1195.002,T1036

traits:
  - id: amnezia-vpn-manifest-name
    desc: Manifest name claims Amnezia VPN
    crit: notable
    if:
      type: value
      path: name
      regex: '^Амнезия VPN\b'

  - id: amnezia-vpn-manifest-short-name
    desc: Manifest short name claims Amnezia
    crit: notable
    if:
      type: value
      path: short_name
      exact: Амнезия VPN

  - id: amnezia-vpn-manifest-action-title
    desc: Manifest action claims Amnezia VPN
    crit: notable
    if:
      type: value
      path: action.default_title
      regex: '^Амнезия VPN\b'

  - id: atlas-vpn-space-manifest-homepage
    desc: Manifest homepage uses Atlas VPN domain
    crit: notable
    if:
      type: value
      path: homepage_url
      regex: '^https://atlasvpn\.space/?$'

composite_rules:
  # The campaign presents an AmneziaVPN identity while directing users to an
  # unrelated Atlas-branded .space property. Requiring repeated display names,
  # the claimed author, and both cross-brand fields keeps this to identity forgery.
  - id: amnezia-vpn-atlas-space-identity
    desc: Extension forges Amnezia identity with Atlas homepage
    crit: hostile
    all:
      - id: amnezia-vpn-manifest-name
      - id: amnezia-vpn-manifest-short-name
      - id: amnezia-vpn-manifest-action-title
      - id: metadata/package/author/identity::amnezia-vpn-manifest-author
      - id: atlas-vpn-space-manifest-homepage

  - id: unaffiliated-pdf-brand-bait-search-takeover
    desc: Code-free search hijack uses PDF brand bait
    crit: hostile
    conf: 0.97
    attack: T1176,T1036.005,T1195.002
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest]
    all:
      - id: metadata/permission/activation::search-only-code-free-manifest
      - id: metadata/package/description/vertical::description-mentions-ilovepdf-brand
      - id: metadata/permission/manifest::extension-custom-search-endpoint
      - id: metadata/permission/manifest::extension-custom-suggest-endpoint

  - id: deceptive-shortcut-claim-code-free-search-hijack
    desc: Code-free search hijack claims address-bar shortcut utility
    crit: hostile
    conf: 0.98
    attack: T1176,T1036.005
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest]
    all:
      - id: metadata/permission/activation::search-only-code-free-manifest
      - id: metadata/package/description/vertical::description-address-bar-search-shortcuts
      - id: micro-behaviors/communications/http/url/api-path/route::wim-gotohub-uninstall-endpoint
      - id: micro-behaviors/communications/http/url/api-path/route::wim-v1-sug-endpoint

  # The installed engine answers on a host dressed as the browser's own
  # extension store (chromecrxstore.com, crx-store, webstore...). No store
  # serves address-bar search; the brand borrows the browser vendor's
  # authority for a third-party engine that now takes every query.
  - id: store-branded-host-default-search-takeover
    desc: Default search on extension-store-branded host
    crit: hostile
    conf: 0.94
    attack: T1176,T1036.005
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: objectives/impact/ui/manipulation/traffic::browser-brand-search-provider-host
