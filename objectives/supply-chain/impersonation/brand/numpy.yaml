# PyPI wheels that impersonate the canonical NumPy package identity while
# publishing under an unrelated distribution name such as nhmpy.
defaults:
  platforms: [unix, windows]
  for: [whl]
  attack: T1195.002,T1036.005
  mbc: E1195

traits:
  - id: wheel-nhmpy-distribution-name
    desc: nhmpy wheel distribution name
    crit: component
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: nhmpy

composite_rules:
  - id: numpy-nhmpy-typosquat-wheel
    desc: nhmpy wheel impersonates NumPy package identity
    crit: suspicious
    conf: 0.99
    scope: archive
    all:
      - id: wheel-nhmpy-distribution-name
      - id: well-known/lib/data/numpy::maintainer-email
