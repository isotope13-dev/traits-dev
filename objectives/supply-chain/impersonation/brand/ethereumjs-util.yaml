# EthereumJS utility impersonation.
# A package using the EthereumJS monorepo metadata under a different name is
# an identity spoof, not merely a similarly named Ethereum library.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip]
  attack: T1195.002
  mbc: E1195.002

traits:
  - id: ethereumjs-util-impersonator-name
    desc: Package uses EthereumJS utility lookalike name
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: ethereum-lib-utils

  - id: ethereumjs-util-impersonator-archive-name
    desc: Archive uses EthereumJS utility lookalike name
    crit: suspicious
    conf: 0.99
    if:
      type: value
      path: npm.name
      exact: ethereum-lib-utils

  - id: eth-util-impersonator-name
    desc: Package uses eth-util lookalike name
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: eth-util

  - id: eth-util-impersonator-archive-name
    desc: Archive uses eth-util lookalike name
    crit: suspicious
    conf: 0.99
    if:
      type: value
      path: npm.name
      exact: eth-util

  - id: eth-util-registry-impersonator-name
    desc: Registry uses eth-util lookalike name
    crit: suspicious
    conf: 0.99
    for: [pkginfo]
    if:
      type: text
      regex: '"name"\s*:\s*"eth-util"'
      offset_range: [0, 256]

composite_rules:
  - id: ethereumjs-util-identity-impersonation
    desc: EthereumJS utility package identity impersonation
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: ethereumjs-util-impersonator-archive-name
      - id: well-known/lib/format/ethereumjs-util::archive-package-repository
      - id: well-known/lib/format/ethereumjs-util::archive-package-homepage
    any:
      - id: well-known/lib/format/ethereumjs-util::npm-package-description
      - id: well-known/lib/format/ethereumjs-util::archive-package-name

  - id: eth-util-identity-impersonation
    desc: eth-util archive impersonates EthereumJS utility
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: eth-util-impersonator-archive-name
      - id: well-known/lib/format/ethereumjs-util::archive-package-repository
      - id: well-known/lib/format/ethereumjs-util::archive-package-homepage
    any:
      - id: well-known/lib/format/ethereumjs-util::npm-package-description
      - id: well-known/lib/format/ethereumjs-util::archive-package-name

  - id: eth-util-registry-identity-impersonation
    desc: eth-util registry metadata impersonates EthereumJS utility
    crit: hostile
    conf: 0.995
    for: [pkginfo]
    all:
      - id: eth-util-registry-impersonator-name
      - id: well-known/lib/format/ethereumjs-util::registry-monorepo-reference
      - id: well-known/lib/format/ethereumjs-util::registry-package-homepage
      - id: well-known/lib/format/ethereumjs-util::registry-package-description
