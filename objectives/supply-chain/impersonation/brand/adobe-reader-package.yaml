defaults:
  platforms: [unix, windows]
  for: [package.json, json]
  attack: T1195.002,T1036.005

traits:
  # A Node package has no business describing itself as Adobe's desktop
  # reader; the claim is borrowed trust for whatever the dependencies do.
  - id: adobe-reader-package-description
    desc: Package claims Adobe Acrobat or Reader
    crit: notable
    conf: 0.9
    if:
      type: value
      path: description
      regex: '(?i)\badobe\s+(acrobat|reader)\b'

composite_rules:
  # The borrowed Adobe description sits on a manifest that pulls in a startup
  # registrar and SQLite: the persistence and browser-database pair of an
  # infostealer installer rather than a PDF utility.
  - id: adobe-reader-claim-startup-sqlite-package
    desc: Adobe-branded npm package with startup and SQLite deps
    crit: hostile
    conf: 0.95
    all:
      - id: adobe-reader-package-description
      - id: metadata/package/dependencies/identity::npm-dep-startup-manager
      - id: metadata/package/dependencies/identity::npm-dep-sqlite3
