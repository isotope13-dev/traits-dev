# Typosquatted @bitwarden scoped npm packages (e.g. @bitwardne/cli).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar]
  attack: T1195.002

traits:
  - id: npm-scoped-bitwarden-typo-name
    desc: Scoped npm name typosquats @bitwarden
    crit: notable
    conf: 0.96
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@bitwardne/'

composite_rules:
  - id: bitwarden-scope-squat-preinstall-remote-pipe
    desc: Bitwarden scope typo runs preinstall curl pipe to node
    crit: hostile
    conf: 0.99
    scope: archive
    mbc: B0024
    all:
      - id: npm-scoped-bitwarden-typo-name
      - id: objectives/supply-chain/install-hook/scripts/remote-fetch::preinstall-curl-wget-pipe-node-exec
