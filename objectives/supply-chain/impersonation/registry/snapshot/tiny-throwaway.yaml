# One mass-published npm takeover campaign, described from its registry
# snapshot. The distinguishing evidence is the maintainer identity (a dotted
# Gmail alias) plus a byte-exact 1.4-1.6 KB payload; the file count and the
# broken README are supporting shape, not evidence on their own.
defaults:
  for: [pkginfo]
  platforms: [unix, windows]
  attack: "T1195.002"
traits:
  - id: dotted-gmail-local
    desc: Maintainer uses dotted Gmail alias pattern
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: "\"email\":\\s*\"[a-z0-9]{1,4}(\\.[a-z0-9]{1,8}){4,}@gmail\\.com\""
composite_rules:
  - id: tiny-throwaway-takeover
    desc: Throwaway tiny registry takeover metadata
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/supply-chain/impersonation/registry/snapshot::registry-metadata-json
      - id: dotted-gmail-local
      - id: objectives/supply-chain/impersonation/registry/snapshot::versioned-maintainer-list-single
      - id: objectives/supply-chain/impersonation/registry/snapshot::versioned-readme-error
      - id: metadata/package/manifest/publishing::npm-registry-dist-filecount-1-4
      - id: metadata/package/manifest/publishing::npm-registry-dist-unpacked-1400-1600b
    any:
      - id: metadata/package/manifest/publishing::npm-registry-dist-tarball-url
      - id: objectives/supply-chain/impersonation/registry/publish::versioned-dist-tags-latest
      - id: objectives/supply-chain/impersonation/registry/snapshot::versioned-readme-error
      - id: objectives/supply-chain/impersonation/registry/snapshot::versioned-test-hook
    needs: 2
