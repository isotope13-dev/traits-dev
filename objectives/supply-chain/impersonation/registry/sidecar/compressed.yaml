# Compressed npm metadata sidecars
# These files appear in malware corpora as registry metadata snapshots rather than
# unpacked package.json files. cleave's archive analyzer transparently decompresses
# standalone .zst files (see test_extract_dir_standalone_zstd in
# analyzers/archive/mod.rs, which uses this exact meta.json.zst shape): the
# decompressed JSON is analyzed as its own pkginfo-typed node, distinct from the
# outer Zst-typed container. Zst is a single-file compression layer, not an
# `#[archive]`-tagged container cleave pools composites across (confirmed against
# find_pooling_scope_without_container's container predicate in
# capabilities/validation/constraints.rs), so a rule cannot require evidence from
# both the compressed wrapper and its decompressed content in one composite --
# only the file within it is reachable. That leaves the compressed-wrapper-
# specific traits below with no useful composite to join: rules keyed purely on
# registry-metadata-json already fire correctly on the decompressed pkginfo node
# via the plain (uncompressed) composites in publish/snapshot-late.yaml, so the
# zst-specific duplicates here were deleted rather than fixed.
defaults:
  for: [data]
  platforms: [unix, windows]
composite_rules:
- id: compact-zstd-json-sidecar
  desc: Compact ZSTD JSON metadata sidecar
  crit: notable
  conf: 0.94
  # The size band lives on the composite. Previously each band was a separate
  # trait repeating the zstd magic matcher, so a single small sidecar matched
  # four to six of them at once; the bands all overlapped by construction.
  size_min: 512
  size_max: 4096
  all:
  - id: metadata/package/files/name::meta-json-zst
  - id: objectives/supply-chain/impersonation/registry/sidecar::zstd-magic-header
# registry-zstd-sidecar: deleted. Wanted compact-zstd-json-sidecar (the outer
# Zst-typed container's own filename+magic) together with registry-metadata-json
# (only ever true of the decompressed pkginfo member) in one `all:` -- two nodes
# that cannot composite (see file header). Once decompressed, the content is
# just a plain pkginfo registry snapshot and the composites below already cover
# it; the "arrived compressed" signal had no way to compose with them.

# compressed-versioned-lifecycle-uri-encode: identical evidence to
# objectives/supply-chain/impersonation/registry/publish::versioned-lifecycle-uri-encode,
# which owns this detection -- deleted here rather than merged, since both
# fired the same finding twice, and its own `for: [pkginfo, javascript]`
# override didn't even cover this file's `data` sidecars.

# compressed-registry-maintainer-mismatch: identical evidence to
# objectives/supply-chain/impersonation/registry/publish/snapshot-late::registry-maintainer-mismatch,
# which owns this detection -- deleted here rather than merged, since both
# fired the same finding twice on the decompressed pkginfo node.

# compressed-generated-maintainer-identity: identical evidence to
# objectives/supply-chain/impersonation/registry/publish/snapshot-late::generated-maintainer-identity,
# which owns this detection -- deleted here rather than merged, since both
# fired the same finding twice on the decompressed pkginfo node.

# compressed-postinstall-curl-oob-beacon: identical evidence to
# objectives/supply-chain/impersonation/registry/publish/snapshot-late::postinstall-curl-oob-beacon,
# which owns this detection -- deleted here rather than merged, since both
# fired the same finding twice on the decompressed pkginfo node.
