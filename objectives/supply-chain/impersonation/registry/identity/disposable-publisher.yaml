# Malicious npm campaigns automate publisher accounts with opaque mailbox
# identities, publish from a disposable-email service, and omit repository
# provenance.  The disposable provider is corroboration rather than a required
# IOC: the description and entrypoint legs preserve detection when the attacker
# moves the same generated-account workflow to another mailbox domain.
defaults:
  for: [pkginfo]
  platforms: [unix, windows]
  attack: T1195.002

composite_rules:
  - id: generated-disposable-publisher
    desc: Generated disposable npm publisher identity
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/author/identity::registry-repeated-opaque-email
      - id: objectives/supply-chain/impersonation/registry/snapshot::versioned-maintainer-list-single
      - id: metadata/package/publishing::npm-registry-dist-tarball-url
    any:
      - id: metadata/package/author/domain::npm-registry-web-library-email
      - id: metadata/package/description/function::generic-utility-functions-claim
      - id: metadata/package/entrypoint::npm-registry-main-index-entry
    needs: 2
    unless:
      - id: metadata/package/repository::npm-registry-repository-field
