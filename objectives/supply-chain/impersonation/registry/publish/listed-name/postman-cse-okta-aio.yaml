# Advisory package-name evidence.
defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: package-name
  desc: Reported malicious Okta AIO package name
  crit: notable
  conf: 1.0
  if:
    type: value
    path: name
    exact: '@postman-cse/okta-aio-darwin-arm64'
- id: package-name-archive
  desc: Malicious Okta AIO npm package name
  crit: notable
  conf: 1.0
  for:
  - npm
  if:
    type: value
    path: npm.name
    exact: '@postman-cse/okta-aio-darwin-arm64'
