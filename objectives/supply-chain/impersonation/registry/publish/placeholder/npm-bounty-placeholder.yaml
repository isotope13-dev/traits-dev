defaults:
  platforms: [unix, windows]
  for: [javascript]

# A placeholder that announces a third-party bug bounty and tells the target's
# security team to contact its publisher is a dependency-confusion proof of
# concept, not a defensive reservation. Defensive placeholders describe
# preventing squatting and are handled by the disclosure canary exceptions.
traits:
  - id: target-security-team-contact
    desc: Source addresses a target's security team
    crit: notable
    conf: 0.85
    if:
      type: text
      case_insensitive: true
      regex: 'if you are from .{0,40}security team'

composite_rules:
  - id: npm-bounty-placeholder-targets-security-team
    desc: Bounty-targeted npm placeholder addresses the affected company
    crit: hostile
    conf: 0.9
    attack: T1195.002
    for: [npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/description/disclosure::description-mentions-security-placeholder
      - id: metadata/lang/natural/vocabulary/content-word::manifest-bug-bounty-terms
      - id: objectives/supply-chain/impersonation/registry/publish/placeholder::target-security-team-contact
      - id: metadata/lang/source/syntax/assignment/member::small-commonjs-object-export
