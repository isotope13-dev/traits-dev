defaults:
  for: [manifests, data]
  platforms: [unix, windows]

composite_rules:
- id: tiny-public-install-probe
  desc: Declared canary with install hook and package clues
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/package/scripts/command::versioned-install-node-exit0
  - id: metadata/package/documentation/disclosure::desc-security-canary-nonbreaking
  any:
  - id: metadata/package/publishing::npm-public-publish-access
  - id: metadata/package/publishing::dist-filecount-1-to-4
  - id: metadata/package/publishing::dist-unpacked-under-4kb
  - id: objectives/supply-chain/impersonation/registry/manifest::inflated-version-90plus
  needs: 2
