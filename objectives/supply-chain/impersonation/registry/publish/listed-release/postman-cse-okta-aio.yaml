# Advisory release evidence; package identity is required by composites.
defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: affected-release
  desc: Version is within Postman advisory range
  crit: notable
  conf: 0.99
  ref: https://github.com/advisories/GHSA-w29j-8x2j-rrj6
  unless:
  - id: metadata/package/name/presence::postman-other-package-name
  if:
    type: value
    path: version
    regex: ^0\.(8\.(10|11)|9\.[01]|10\.[0-9]|11\.[0-6])$
- id: affected-release-archive
  desc: Archive version is within Postman advisory range
  crit: notable
  conf: 0.99
  for:
  - npm
  ref: https://github.com/advisories/GHSA-w29j-8x2j-rrj6
  unless:
  - id: metadata/package/name/presence::postman-other-package-name-archive
  if:
    type: value
    path: npm.version
    regex: ^0\.(8\.(10|11)|9\.[01]|10\.[0-9]|11\.[0-6])$
composite_rules:
- id: advisory-listed-release
  desc: Advisory-listed malicious Okta AIO release
  crit: hostile
  conf: 0.99
  attack: T1195.002
  all:
  - id: metadata/package/files/included::npm-publish-root-manifest
  - id: objectives/supply-chain/impersonation/registry/publish/listed-name::package-name
  - id: objectives/supply-chain/impersonation/registry/publish/listed-release::affected-release
- id: advisory-listed-archive-release
  desc: Advisory-listed malicious Okta AIO npm archive release
  crit: hostile
  conf: 0.99
  for:
  - npm
  scope: archive
  attack: T1195.002
  all:
  - id: objectives/supply-chain/impersonation/registry/publish/listed-name::package-name-archive
  - id: objectives/supply-chain/impersonation/registry/publish/listed-release::affected-release-archive
