# Advisory release evidence; package identity is required by composites.
defaults:
  platforms:
  - unix
  - windows
  for:
  - pkginfo
  crit: notable
traits:
- id: toneloop-affected-release
  desc: Toneloop declares version 0.1.0 or 0.2.0
  unless:
  - type: value
    path: name
    exists: false
  - type: value
    path: name
    regex: ^.+$
    not:
    - exact: toneloop
  if:
    type: value
    path: version
    regex: ^0\.[12]\.0$
composite_rules:
- id: toneloop-listed-loader-release
  desc: Advisory-listed toneloop remote-code loader release
  crit: hostile
  ref: https://github.com/advisories/GHSA-972f-gmqr-9jpx
  attack: T1195.002
  all:
  - id: objectives/supply-chain/impersonation/registry/publish/listed-name::toneloop-package-name
  - id: objectives/supply-chain/impersonation/registry/publish/listed-release::toneloop-affected-release
