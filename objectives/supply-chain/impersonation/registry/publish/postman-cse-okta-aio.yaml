# The GitHub Advisory Database lists @postman-cse/okta-aio-darwin-arm64
# releases 0.8.10 through 0.11.6 as malicious. The version is notable release
# evidence, while the hostile verdict requires the exact package name too.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: package-name
    desc: Reported malicious Okta AIO package name
    crit: notable
    conf: 1.0
    if:
      type: value
      path: name
      exact: '@postman-cse/okta-aio-darwin-arm64'

  - id: package-name-archive
    desc: Malicious Okta AIO npm package name
    crit: notable
    conf: 1.0
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@postman-cse/okta-aio-darwin-arm64'

  - id: affected-release
    desc: Package version in affected range
    crit: notable
    conf: 0.99
    ref: https://github.com/advisories/GHSA-w29j-8x2j-rrj6
    if:
      type: value
      path: version
      regex: '^0\.(8\.(10|11)|9\.[01]|10\.[0-9]|11\.[0-6])$'

  - id: affected-release-archive
    desc: npm archive has affected version
    crit: notable
    conf: 0.99
    for: [npm]
    ref: https://github.com/advisories/GHSA-w29j-8x2j-rrj6
    if:
      type: value
      path: npm.version
      regex: '^0\.(8\.(10|11)|9\.[01]|10\.[0-9]|11\.[0-6])$'

composite_rules:
  - id: advisory-listed-release
    desc: Advisory-listed malicious Okta AIO release
    crit: hostile
    conf: 0.99
    attack: T1195.002
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: package-name
      - id: affected-release

  - id: advisory-listed-archive-release
    desc: Advisory-listed malicious Okta AIO npm archive release
    crit: hostile
    conf: 0.99
    for: [npm]
    scope: archive
    attack: T1195.002
    all:
      - id: package-name-archive
      - id: affected-release-archive
