# The GitHub Advisory Database lists @postman-cse/okta-aio-darwin-arm64
# releases 0.8.10 through 0.11.6 as malicious. Keep the exact package and
# affected release range together; 0.8.4 is outside the advisory's range.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: package-name
    desc: Reported malicious Okta AIO package name
    crit: notable
    conf: 1.0
    if:
      type: value
      path: npm.name
      exact: '@postman-cse/okta-aio-darwin-arm64'

  - id: affected-release
    desc: Okta AIO version listed as malicious
    crit: notable
    conf: 0.99
    ref: https://github.com/advisories/GHSA-w29j-8x2j-rrj6
    if:
      type: value
      path: npm.version
      regex: '^0\.(8\.(10|11)|9\.[01]|10\.[0-9]|11\.[0-6])$'

composite_rules:
  - id: advisory-listed-release
    desc: Advisory-listed malicious Okta AIO release
    crit: hostile
    conf: 0.99
    for: [npm, package.json]
    scope: archive
    attack: T1195.002
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: package-name
      - id: affected-release
