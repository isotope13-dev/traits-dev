defaults:
  for: [registry]
  platforms: [unix, windows, android, ios]

composite_rules:
- id: suspected-publisher-takeover
  desc: Fresh release from unlisted publisher
  # Publisher/maintainer drift on a new package is a provenance signal, not
  # proof of takeover. Hostile supply-chain conclusions require stronger
  # registry evidence or additional package behavior.
  crit: notable
  conf: 0.72
  attack: "T1195.002"
  all:
  - id: metadata/registry::publisher-not-maintainer
  - id: metadata/registry::freshly-published
  any:
  - id: metadata/registry::recent-package
  - id: metadata/registry::low-adoption
  - id: metadata/registry::dormant-package-reawakened
  - id: metadata/registry::brand-new-package
  unless:
  - id: metadata/registry::many-releases

- id: dormant-package-revived
  desc: Dormant package suddenly published again
  crit: notable
  conf: 0.6
  all:
  - id: metadata/registry::dormant-package-reawakened
  - id: metadata/registry::freshly-published

- id: registry-takedown-security-hold
  desc: Removed release belongs to security-held namespace
  # A security placeholder describes the namespace's current custody state.
  # It does not establish that every historical or locally vendored release
  # contained hostile code, so preserve the provenance without a verdict.
  crit: notable
  conf: 0.9
  attack: "T1195.002"
  scope: outer
  unless:
  - id: metadata/package/testing/
  all:
  - id: metadata/registry::registry-security-hold-record
  - id: metadata/registry::version-removed

- id: registry-security-withdrawn-deprecation
  desc: Registry withdrew package for a security reason
  # The direct registry atom already records the security rationale.  A
  # deprecated release is a useful triage signal, but it does not establish
  # impersonation or takeover without artifact evidence.
  crit: notable
  conf: 0.98
  all:
  - id: metadata/registry::registry-security-withdrawal-reason
  - id: metadata/registry::deprecated

- id: anonymous-removed-package
  desc: Removed package currently lists no maintainers
  # Current registry metadata cannot attribute the historical release. A
  # security holder commonly has an empty maintainer list after the original
  # version is removed, which is useful provenance but not attack evidence.
  crit: notable
  conf: 0.72
  scope: outer
  unless:
  - id: metadata/package/testing/
  all:
  - id: metadata/registry::version-removed
  - id: metadata/registry::no-maintainers

- id: removed-inflated-unmaintained-package
  desc: Removed package has inflated version and no maintainer
  crit: hostile
  conf: 0.98
  scope: package
  all:
  - id: anonymous-removed-package
  - id: metadata/package/quality/version-sentinel::suspicious-version-patterns

- id: removed-package-with-node-postinstall
  desc: Removed package retains a Node postinstall hook
  # A local Node lifecycle hook is common package behavior in isolation. A
  # release removed from the registry is a different context: the hook is
  # still an install-time execution path even when this archive contains no
  # hostile payload. Keep the result suspicious, not hostile, because the
  # manifest and registry facts do not prove what the missing/removed release
  # would have executed.
  crit: suspicious
  conf: 0.86
  scope: package
  attack: "T1195.002"
  all:
  - id: metadata/registry::version-removed
  - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script

- id: freshly-published-unestablished-package
  desc: Fresh low-adoption registry release
  crit: notable
  conf: 0.7
  all:
  - id: metadata/registry::freshly-published
  - id: metadata/registry::low-adoption
  unless:
  - id: metadata/registry::widely-installed

- id: freshly-published-deprecated-install
  desc: Fresh release of deprecated package
  crit: notable
  conf: 0.65
  all:
  - id: metadata/registry::deprecated
  - id: metadata/registry::freshly-published

- id: fresh-unestablished-throwaway
  desc: Brand-new low-adoption package
  crit: notable
  conf: 0.6
  all:
  - id: metadata/registry::brand-new-package
  - id: metadata/registry::few-releases
  - id: metadata/registry::low-adoption

- id: fresh-package-with-install-hook
  desc: Brand-new package runs install script
  crit: notable
  conf: 0.65
  all:
  - id: metadata/registry::brand-new-package
  - id: metadata/registry::registry-install-hook
