defaults:
  for: [registry]
  platforms: [unix, windows, android, ios]

composite_rules:
- id: suspected-publisher-takeover
  desc: Fresh release from unlisted publisher
  # Publisher/maintainer drift on a new package is a provenance signal, not
  # proof of takeover. Hostile supply-chain conclusions require stronger
  # registry evidence or additional package behavior.
  crit: notable
  conf: 0.72
  attack: "T1195.002"
  all:
  - id: metadata/registry::publisher-not-maintainer
  - id: metadata/registry::freshly-published
  any:
  - id: metadata/registry::recent-package
  - id: metadata/registry::low-adoption
  - id: metadata/registry::dormant-package-reawakened
  - id: metadata/registry::brand-new-package
  unless:
  - id: metadata/registry::many-releases

- id: dormant-package-revived
  desc: Dormant package suddenly published again
  crit: notable
  conf: 0.6
  all:
  - id: metadata/registry::dormant-package-reawakened
  - id: metadata/registry::freshly-published
  unless:
  # Packages older than one year are maintainer comebacks, not throwaway
  # dormant-name drops.
  - id: metadata/registry::established-package

- id: registry-takedown-security-hold
  desc: Removed release belongs to security-held namespace
  # A security placeholder describes the namespace's current custody state.
  # It does not establish that every historical or locally vendored release
  # contained hostile code, so preserve the provenance without a verdict.
  crit: notable
  conf: 0.9
  attack: "T1195.002"
  scope: outer
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
  all:
  - id: metadata/registry::registry-security-hold-record
  - id: metadata/registry::version-removed

- id: registry-security-withdrawn-deprecation
  desc: Registry withdrew package for a security reason
  # The direct registry atom already records the security rationale.  A
  # deprecated release is a useful triage signal, but it does not establish
  # impersonation or takeover without artifact evidence.
  crit: notable
  conf: 0.98
  all:
  - id: metadata/registry::registry-security-withdrawal-reason
  - id: metadata/registry::deprecated

- id: anonymous-removed-package
  desc: Removed package currently lists no maintainers
  # Current registry metadata cannot attribute the historical release. A
  # security holder commonly has an empty maintainer list after the original
  # version is removed, which is useful provenance but not attack evidence.
  crit: notable
  conf: 0.72
  scope: outer
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
  all:
  - id: metadata/registry::version-removed
  - id: metadata/registry::no-maintainers

- id: removed-inflated-unmaintained-package
  for: [registry, python, javascript, ruby, go, package.json]
  desc: Removed package has inflated version and no maintainer
  crit: hostile
  conf: 0.98
  scope: outer
  all:
  - id: anonymous-removed-package
  - id: "metadata/package/versioning/scheme::package-version-shape-profile"

- id: removed-package-with-node-postinstall
  for: [registry, package.json]
  desc: Removed package retains a Node postinstall hook
  # A local Node lifecycle hook is common package behavior in isolation. A
  # release removed from the registry is a different context: the hook is
  # still an install-time execution path even when this archive contains no
  # hostile payload. Keep the result suspicious, not hostile, because the
  # manifest and registry facts do not prove what the missing/removed release
  # would have executed.
  crit: suspicious
  conf: 0.86
  scope: outer
  attack: "T1195.002"
  unless:
  # A `"private": true` monorepo root never reaches a registry: its
  # postinstall is a developer-environment check, and an unpublished
  # internal workspace dependency 404 is not a takedown. Without this,
  # e.g. React's private root manifest plus eslint-plugin-react-internal
  # 0.0.0 (never published) misattributes removal to the hooked package.
  - id: metadata/package/publishing::is-private
  all:
  - id: metadata/registry::version-removed
  - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script


- id: freshly-published-deprecated-install
  desc: Fresh release of deprecated package
  crit: notable
  conf: 0.65
  all:
  - id: metadata/registry::deprecated
  - id: metadata/registry::freshly-published

- id: fresh-unestablished-throwaway
  desc: Brand-new low-adoption package
  crit: notable
  conf: 0.6
  all:
  - id: metadata/registry::brand-new-package
  - id: metadata/registry::few-releases
  - id: metadata/registry::low-adoption

- id: fresh-package-with-install-hook
  desc: Brand-new package runs install script
  crit: notable
  conf: 0.65
  all:
  - id: metadata/registry::brand-new-package
  - id: metadata/registry::registry-install-hook

- id: removed-release-install-fingerprint-beacon
  desc: Removed release beacons install-time fingerprint
  # Takedown context plus a proven install-time beacon: the registry record
  # shows this release was removed under a security hold, and the archive
  # still carries the fingerprint-POST beacon. Either fact alone is weaker
  # (removal is provenance; the beacon composite already convicts the
  # behavior), but the pair marks a taken-down exfiltrator, so hostile.
  crit: hostile
  conf: 0.97
  attack: "T1195.002"
  scope: outer
  for: [registry, npm, package.json, javascript, typescript]
  all:
  - id: metadata/registry::version-removed
  - id: objectives/supply-chain/recon-exfil/oast/host-profile::npm-postinstall-fingerprint-post-to-tunnel

- id: removed-skeleton-publish-burst
  desc: Removed skeleton npm package published in a burst
  # Registry takedown plus a throwaway manifest and rapid version churn
  # marks a name-reservation or dependency-confusion wave even when the
  # archived bytes are only an empty stub (no install hook in this release).
  crit: suspicious
  conf: 0.9
  attack: "T1195.002"
  mbc: B0024
  scope: outer
  for: [registry, npm, package.json, javascript, typescript]
  all:
  - id: metadata/registry::version-removed
  - id: metadata/package/freeform::pkg-skeleton-small
  - id: metadata/registry::publish-burst-24h
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"

- id: removed-dominated-char-obfuscation
  desc: Removed npm release ships dominated-character obfuscation
  crit: suspicious
  conf: 0.93
  attack: "T1195.002,T1027"
  mbc: B0032
  scope: outer
  for: [registry, npm, package.json, javascript, typescript]
  all:
  - id: metadata/registry::version-removed
  - id: objectives/anti-static/obfuscation/string/reconstruct::js-dominant-char-ratio
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"

# The two -testmetest rules below gate on a publisher-chosen name suffix, so
# they record campaign naming at notable. The removal/burst/skeleton facts
# that justify suspicion are carried by removed-skeleton-publish-burst; the
# char-pad variant keeps its own suspicious content leg.
- id: npm-testmetest-removed-campaign
  desc: Removed burst package named with -testmetest
  crit: notable
  conf: 0.94
  attack: "T1195.002"
  mbc: B0024
  scope: outer
  for: [registry, npm, package.json]
  all:
  - id: metadata/registry::version-removed
  - id: metadata/registry::publish-burst-24h
  - id: metadata/package/name/vocabulary::npm-testmetest-campaign-suffix
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/testing/

- id: npm-testmetest-hollow-stub
  desc: Hollow stub package named with -testmetest
  # Campaign stubs share the -testmetest suffix, but an empty manifest and
  # `module.exports = {}` describe any placeholder; renaming defeats the name
  # leg, so this archive-only observation stays notable.
  crit: notable
  conf: 0.91
  attack: "T1195.002"
  mbc: B0024
  scope: archive
  for: [npm, package.json, javascript]
  all:
  - id: metadata/package/name/vocabulary::npm-testmetest-campaign-suffix
  - id: metadata/package/freeform::pkg-skeleton-small
  - id: metadata/package/placeholder::tiny-commonjs-exports-object
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/testing/
  - id: metadata/package/repository::has-repository-evidence
  - id: "metadata/file/naming::test-directory-component"

- id: npm-testmetest-char-pad-stub
  desc: -testmetest campaign package pads entry with one character
  crit: suspicious
  conf: 0.93
  attack: "T1195.002,T1027"
  mbc: B0032
  scope: archive
  for: [npm, package.json, javascript]
  all:
  - id: metadata/package/name/vocabulary::npm-testmetest-campaign-suffix
  - id: objectives/anti-static/obfuscation/string/reconstruct::js-dominant-char-ratio
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
