defaults:
  for: [pkginfo]
  platforms: [windows, unix]

traits:
# encode-uri-component-call is a JS symbol-call match (for: [javascript]) --
# the lifecycle hook body lives as a raw string value inside the pkginfo
# document itself, like every other versioned-* lifecycle atom in
# snapshot/base.yaml, so it needs the same raw-text form of the check.
- id: versioned-lifecycle-uri-encode-call
  desc: Lifecycle hook calls encodeURIComponent
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: "\"((pre|post)?install|prepare)\"\\s*:\\s*\"[^\"]{0,200}encodeURIComponent\\s*\\("

composite_rules:
- id: versioned-lifecycle-uri-encode
  desc: Lifecycle hook URI-encodes exfil data
  crit: suspicious
  conf: 0.9
  all:
  - id: objectives/supply-chain/impersonation/registry/snapshot::registry-metadata-json
  - id: versioned-lifecycle-uri-encode-call
- id: suspicious-publish-provenance
  desc: Registry package published from suspicious temp path
  crit: suspicious
  conf: 0.94
  attack: "T1195.002"
  all:
  - id: objectives/supply-chain/impersonation/registry/snapshot::versioned-postinstall-hook
  any:
  - id: objectives/supply-chain/impersonation/registry/snapshot::versioned-from-tmp-path
  - id: objectives/supply-chain/impersonation/registry/snapshot::versioned-resolved-tmp-path
- id: registry-maintainer-mismatch
  desc: Registry metadata has maintainer count mismatch
  crit: notable
  conf: 0.78
  all:
  - id: objectives/supply-chain/impersonation/registry/snapshot::versioned-maintainer-list-single
  - id: objectives/supply-chain/impersonation/registry/snapshot::versioned-maintainer-list-multi
- id: generated-maintainer-identity
  desc: Registry maintainer identity appears auto-generated
  crit: suspicious
  conf: 0.85
  attack: "T1195.002"
  all:
  - id: objectives/supply-chain/impersonation/registry/snapshot::registry-metadata-json
  - id: objectives/supply-chain/impersonation/registry/snapshot::versioned-protonmail-maintainer
  any:
  - id: objectives/supply-chain/impersonation/registry/snapshot::versioned-gibberish-maintainer-name
  - id: objectives/supply-chain/impersonation/registry/snapshot::versioned-gibberish-email-local
- id: postinstall-curl-oob-beacon
  desc: Registry postinstall uses curl OOB beacon
  crit: hostile
  conf: 0.97
  attack: "T1041"
  mbc: "B0030"
  all:
  - id: objectives/supply-chain/impersonation/registry/snapshot::registry-metadata-json
  any:
  - id: objectives/supply-chain/impersonation/registry/snapshot::versioned-postinstall-curl-oob-webhook
  - id: objectives/supply-chain/impersonation/registry/snapshot::versioned-postinstall-curl-oob-oast
  - id: objectives/supply-chain/impersonation/registry/snapshot::versioned-postinstall-curl-oob-misc
