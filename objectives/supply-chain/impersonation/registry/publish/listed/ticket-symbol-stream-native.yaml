# OSV lists ticket-symbol-stream-native 1.0.0 as malicious (MAL-2026-20520).
# The exact package name and release version identify the listed coordinate.
# The hostile verdict also rests on the codeless remote-loader composite, which
# carries the behavior evidence; the listing alone names no payload.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: ticket-symbol-stream-native-malware-name
    desc: Listed ticket-symbol-stream-native package name
    crit: notable
    conf: 1.0
    ref: https://osv.dev/vulnerability/MAL-2026-20520
    if:
      type: value
      path: name
      exact: ticket-symbol-stream-native

composite_rules:
  - id: ticket-symbol-stream-native-listed-malware-release
    desc: OSV-listed ticket-symbol-stream-native 1.0.0 release
    crit: hostile
    conf: 0.99
    attack: T1195.002
    ref: https://osv.dev/vulnerability/MAL-2026-20520
    scope: file
    all:
      - id: ticket-symbol-stream-native-malware-name
      - id: metadata/package/versioning/sentinel::npm-version-exactly-1-0-0
