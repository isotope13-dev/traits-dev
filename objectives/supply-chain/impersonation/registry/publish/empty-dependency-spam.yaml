defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json]
  attack: T1195.002

composite_rules:
  - id: npm-root-fanout-index-manifest
    desc: Publish root declares index and many dependencies
    crit: component
    attack: none
    for: [package.json]
    scope: file
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: metadata/package/dependencies/count::many-runtime-deps
      - id: metadata/package/entrypoint/module::has-index-entry

  # Require the package to publish an unusually large runtime graph, declare
  # and ship its conventional index entry, and contain a zero-byte member
  # before reporting the package shape. Meta-packages can intentionally ship
  # no implementation; an empty member alone does not establish registry spam.
  - id: npm-empty-main-dependency-spam
    desc: High-fanout npm package has an empty member
    crit: notable
    attack: none
    conf: 0.96
    # The manifest roles must describe one file, even when pooling members.
    scope: outer
    all:
      - id: npm-root-fanout-index-manifest
      - id: archive-root-index-member
      - id: archive-empty-member

traits:
  - id: archive-root-index-member
    desc: Archive contains root index.js
    crit: notable
    conf: 0.95
    for: [npm, tar, zip]
    if:
      type: value
      path: archive.members[*].path
      exact: package/index.js

  - id: archive-empty-member
    desc: Archive contains a zero-byte member
    crit: component
    conf: 0.9
    for: [npm, tar, zip]
    if:
      type: value
      path: archive.members[*].size_bytes
      exact: "0"
