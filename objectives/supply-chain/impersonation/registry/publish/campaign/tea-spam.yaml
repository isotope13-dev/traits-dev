defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript]
  attack: T1195.002

composite_rules:
  # The campaign also publishes tiny generated CommonJS exports with a
  # duplicated generated test phrase. These packages need not carry phantom
  # dependencies: the published stub itself farms registry reward signals.
  - id: tea-xyz-generated-stub-registry-farming
    desc: Tea reward campaign publishes generated stub package
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/unwanted/tea-reward::tea-generated-commonjs-package-stub
      - id: well-known/unwanted/tea-reward::tea-generated-test-case
      - id: well-known/unwanted/tea-reward::tea-generated-sentence-template

  - id: tea-generated-hollow-dependency-package
    desc: Tea reward spam package has hollow dependency stub
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/unwanted/tea-reward::tea-generated-sentence-template
      - id: metadata/package/dependencies/reconciliation::npm-phantom-runtime-dependency
      - id: metadata/lang/source/syntax/assignment/member::small-commonjs-object-export

  - id: tea-xyz-reward-farming-dependency-spam
    desc: Tea.xyz reward spam with phantom dependency fanout
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/files/included::archive-tea-reward-manifest
      - id: metadata/package/dependencies/count::npm-dependency-fanout
      - id: metadata/package/dependencies/reconciliation::npm-phantom-runtime-dependency

# Phantom dependency names published by the same tea.xyz reward operator as
# the hexo-util-text and hexo-aurora-theme copies. Keep the specimen names in
# this campaign IOC rule; the composite above carries the behavior.
#
# Scope is member files only. An archive node (npm, tar, zip) has no readable
# text of its own, so the member finding rolls up to the container and the
# container reports it with the member's verdict.
traits:
  - id: tea-hexo-aurora-phantom-util-dependency
    desc: Dependency on tea-campaign phantom util package
    crit: hostile
    conf: 0.95
    for: [package.json, javascript]
    if:
      type: text
      regex: '"hexo-aurora-auto-excerpt-util[2-5]"'

  # Reward-operator codeOwner wallets. Each campaign member carries one or more
  # of these tea.yaml codeOwners entries (api-chat-ai, api-chat-email,
  # vigilant-tribble, api-chat-sms, api-chat-zns, api-chat-skye, api-chat-gmail,
  # api-chat-fb, api-chat-viber). A 16-hex prefix keeps the regex short while
  # still identifying each full address.
  - id: tea-reward-operator-wallet
    desc: Tea reward codeOwner wallet of operator
    crit: hostile
    conf: 0.95
    for: [yaml]
    if:
      type: text
      regex: '(?i)0x(754314df1379828d|9dc18556737dd1de|6e075cc3f6f09cb2)'

  # Operator-owned npm scopes (@nqduy180500, @lbnqduy11805, ...) used as phantom
  # runtime dependencies across the campaign. Scope-level, so renamed or copied
  # variants that keep the operator's scope still match. The regex requires a
  # dependency key (`"@scope/name": "range"`) so the package's own `"name"`
  # field does not count as a dependency.
  - id: tea-operator-npm-scope-dependency
    desc: Depends on tea-campaign operator npm scope
    crit: hostile
    conf: 0.95
    for: [package.json]
    if:
      type: text
      regex: '"@(lbnqduy|nqduy)[0-9]{4,6}/[^"]{1,80}"\s*:'
