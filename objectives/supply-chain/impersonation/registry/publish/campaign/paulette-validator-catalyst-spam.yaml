# Packages in the Tea.xyz reward-spam campaign point at this repository and
# pull its known package cluster as runtime dependencies. The repository and
# dependency signals together identify the otherwise inert publish stubs.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript]
  attack: T1195.002

composite_rules:
  - id: paulette-validator-catalyst-tea-dependency-spam
    desc: Tea campaign package pulls known spam dependencies
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/repository::npm-tea-spam-campaign-repository
    any:
      - id: metadata/package/dependencies/name-form::npm-dep-gula-dao
      - id: metadata/package/dependencies/name-form::npm-dep-ksni-technical-test
