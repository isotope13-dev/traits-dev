# Tea.xyz reward packages that declare runtime dependencies nothing imports and
# keep the default npm-init test script. This is registry reward spam, not a
# trojanized library, so it lives beside the other tea campaign rules. It covers
# the low-fanout variant that the fanout composite in tea-spam.yaml does not.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript]
  attack: T1195.002

composite_rules:
  - id: tea-xyz-phantom-runtime-dependencies-spam
    desc: Tea.xyz package declares unimported runtime dependencies
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/files/included::archive-tea-reward-manifest
      - id: metadata/package/dependencies/reconciliation::npm-phantom-runtime-dependency
      - id: metadata/package/scripts/develop::npm-init-default-test
