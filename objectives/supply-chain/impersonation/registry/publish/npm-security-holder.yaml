# Security-holder packages are classified hostile by repository policy, including
# npm's inert replacement and copies vendored in another package. This finding
# identifies that status; it does not claim the replacement executes a payload.
# Keep the underlying version/repository observations in their metadata homes.
defaults:
  platforms: [unix, windows]
  for: [package.json]

composite_rules:
  - id: npm-security-holder-package
    desc: npm security holding package
    crit: hostile
    conf: 0.99
    # A package manifest owns its identity. Never pool version and repository
    # from different dependencies, or require a README beside a vendored stub.
    scope: file
    all:
      - id: metadata/package/versioning/scheme::npm-security-holder-version
      - id: metadata/package/freeform::npm-security-holder-repository-signal

  - id: registry-security-held-package
    desc: Registry security-held package
    crit: hostile
    conf: 0.99
    for: [registry]
    scope: file
    needs: 2
    any:
      - id: metadata/registry::registry-security-hold
      - id: metadata/registry::registry-security-hold-record
