# Registry status and package identity are recorded in metadata. npm's
# security-holder package is an inert replacement, so its identity alone does
# not establish a hostile supply-chain action.
defaults:
  platforms: [unix, windows]
  for: [package.json]

composite_rules:
  - id: registry-security-held-package
    desc: Registry security-held package
    crit: hostile
    conf: 0.99
    for: [registry]
    scope: file
    needs: 2
    any:
      - id: metadata/registry::registry-security-hold
      - id: metadata/registry::registry-security-hold-record
