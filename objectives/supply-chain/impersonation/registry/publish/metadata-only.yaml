defaults:
  platforms: [unix, windows]
  for: [whl]
  attack: T1195.002

composite_rules:
  # Placeholder author and summary on a fresh metadata-only wheel indicate a
  # throwaway public package rather than a usable library. Combined with the
  # absence of runtime code, this is a dependency-confusion facade profile.
  - id: pypi-fresh-placeholder-metadata-wheel
    desc: Fresh metadata-only wheel with placeholder metadata
    crit: hostile
    conf: 0.98
    mbc: B0024
    scope: package
    all:
      - id: metadata/package/files/wheel-sdist::wheel-metadata-only
      - id: metadata/package/manifest/author/identity::placeholder-author-pkginfo-1a
      - id: metadata/package/manifest/ecosystem::pkginfo-single-word-summary
      - id: metadata/registry::brand-new-package
