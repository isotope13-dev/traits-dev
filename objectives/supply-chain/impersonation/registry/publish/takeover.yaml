defaults:
  platforms: [unix, windows]
  # pkginfo only: these traits target npm REGISTRY snapshot JSON, not the
  # plain package.json shipped inside a tarball. Empty-author / dist-tags
  # in a regular package.json is just sloppy publishing, not a takeover
  # signal. Registry metadata is the takeover-relevant surface.
  for: [pkginfo]
traits:
- id: versioned-dist-tags-latest
  desc: Registry metadata has dist-tags.latest
  crit: component
  conf: 0.7
  if:
    type: text
    regex: "\"dist-tags\"\\s*:\\s*\\{\\s*\"latest\""
- id: versioned-empty-readme-filename
  desc: Registry metadata keeps empty readme filename
  crit: notable
  conf: 0.86
  attack: "T1195.002"
  if:
    type: text
    regex: "\"readmeFilename\"\\s*:\\s*\"\""
composite_rules:
- id: registry-package-takeover
  desc: Registry metadata shows package takeover indicators
  crit: suspicious
  conf: 0.92
  attack: "T1195.002"
  all:
  - id: objectives/supply-chain/impersonation/registry/snapshot::registry-metadata-json
  - id: versioned-dist-tags-latest
  - id: metadata/package/manifest/publishing::npm-registry-dist-tarball-url
  any:
  - id: metadata/package/quality/empty::npm-registry-empty-author
  - id: objectives/supply-chain/impersonation/registry/snapshot::versioned-readme-error
  - id: versioned-empty-readme-filename
