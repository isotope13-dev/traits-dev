defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript]
  attack: T1195.002

composite_rules:
  - id: tea-xyz-reward-farming-dependency-spam
    desc: Tea.xyz reward spam with phantom dependency fanout
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/files/included::archive-tea-reward-manifest
      - id: metadata/package/dependencies/count::npm-dependency-fanout
      - id: metadata/package/dependencies/reconciliation::npm-phantom-runtime-dependency
