defaults:
  for: [pkginfo]
  platforms: [unix, windows]
  attack: "T1195.002"
traits:
  - id: empty-dependency-spec
    desc: Registry dependency uses empty version spec
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '"dependencies"\s*:\s*\{[^}]{0,200}:\s*""'
  - id: multi-empty-dependency-specs
    desc: 'multi empty dependency specs'
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '"dependencies"\s*:\s*\{[^}]{0,200}:\s*""[^}]{0,200}:\s*""'
composite_rules:
  - id: throwaway-blank-dependency-specs
    desc: Tiny inflated registry package uses blank dependency specs
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/package/publishing::registry-metadata-json
      - id: empty-dependency-spec
      - id: metadata/package/publishing::npm-registry-dist-filecount-1-4
    any:
      - id: multi-empty-dependency-specs
      - id: metadata/package/empty::versioned-readme-error
      - id: metadata/package/publishing::npm-registry-dist-unpacked-under-4kb
      - id: metadata/package/versioning/scheme::versioned-major-90s
    needs: 2
