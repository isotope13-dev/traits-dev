# (for: [pkginfo] only, in snapshot/base.yaml) -- narrower than this file's
# [package.json, pkginfo] default.
- id: bonkfun-registry-metadata
  desc: Bonkfun npm typosquat campaign registry metadata
  crit: hostile
  conf: 0.995
  attack: T1195.002
  for: [pkginfo]
  all:
  - id: objectives/supply-chain/impersonation/registry/snapshot::registry-metadata-json
  - id: objectives/supply-chain/impersonation/registry/brand::readme-alt-install-name
  - id: objectives/supply-chain/impersonation/registry/brand::readme-bonkfun-upload
  any:
  - id: objectives/supply-chain/impersonation/registry/brand::raw-repo-bonkfun-url
  - id: objectives/supply-chain/impersonation/registry/brand::raw-homepage-bonkfun-url
  - id: objectives/supply-chain/impersonation/registry/brand::raw-bugs-bonkfun-url
