# Dependencies that resolve from a `registry.*` host other than registry.npmjs.org
# (or known mirrors) — the installer fetches an attacker-controlled tarball as
# if it were a registry package. Paired with a side-effect import this is
# dependency-confusion / registry-spoof staging.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002
  mbc: E1195

traits:
  - id: dep-spoofed-npm-registry-host
    desc: Dependency URL uses non-npmjs registry host
    crit: suspicious
    conf: 0.96
    if:
      type: value
      path: dependencies.*
      regex: '^https://registry\.[a-z0-9.-]+/'
      not:
        - substr: '://registry.npmjs.org/'
        - substr: '://registry.npmmirror.com/'
        - substr: '://registry.yarnpkg.com/'
    unless:
      - id: well-known/tool/development/aube::aube-package-test-fixture
      - id: metadata/package/publishing::is-private
  - id: dep-npm-registry-lookalike-host
    desc: Dependency URL uses npmjs lookalike hostname
    crit: suspicious
    conf: 0.97
    if:
      type: value
      path: dependencies.*
      regex: '^https://[^"/]{0,120}npmjs[^"/]{0,40}\.(to|com|net|io|org)/'
    not:
      - substr: '://registry.npmjs.org/'
      - substr: '://www.npmjs.com/'
      - substr: '://npmjs.com/'
  - id: npm-dependencies-line-whitespace-smuggle
    desc: package.json hides URL dep after whitespace
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '"dependencies"\s*:\s*\{[\s\S]{0,800}\s{100,}".{0,80}"\s*:\s*"https://'
  - id: npm-manifest-name-hyperliquid
    desc: Package manifest name references hyperliquid
    crit: notable
    conf: 0.9
    if:
      type: value
      path: name
      regex: '(?i)hyperliquid'

  # Typosquat hosts such as registrynpmjs.to serve .tgz payloads that mimic
  # registry.npmjs.org paths without using the official hostname.
  - id: dep-fake-npmjs-registry-tarball
    desc: Dependency tarball on fake npmjs-like host
    crit: suspicious
    conf: 0.97
    if:
      type: value
      path: dependencies.*
      regex: '^https://[^/]*npmjs[^/]*/.+\.tgz'
      not:
        - substr: '://registry.npmjs.org/'
        - substr: '://registry.npmmirror.com/'
    unless:
      - id: well-known/tool/development/aube::aube-package-test-fixture
      - id: metadata/package/publishing::is-private

composite_rules:
  - id: npm-registry-lookalike-tarball-runtime-dep
    desc: Runtime dependency tarball from npmjs lookalike host
    crit: hostile
    conf: 0.99
    scope: archive
    for: [package.json, npm, tar, zip]
    all:
      - id: dep-npm-registry-lookalike-host
      - id: metadata/package/dependencies/manifest/source::npm-https-runtime-dependency
  - id: npm-manifest-smuggled-lookalike-tarball-dep
    desc: Whitespace-smuggled dep from npmjs lookalike host
    crit: hostile
    conf: 0.995
    scope: archive
    for: [package.json, npm, tar, zip]
    all:
      - id: dep-npm-registry-lookalike-host
      - id: npm-dependencies-line-whitespace-smuggle
      - id: metadata/package/dependencies/manifest/source::npm-https-runtime-dependency
  - id: npm-hyperliquid-lookalike-tarball-impersonation
    desc: Hyperliquid-named package uses lookalike tarball dep
    crit: hostile
    conf: 0.99
    scope: archive
    for: [package.json, npm, tar, zip]
    all:
      - id: dep-npm-registry-lookalike-host
      - id: metadata/package/dependencies/manifest/source::npm-https-runtime-dependency
      - id: npm-manifest-name-hyperliquid
  - id: spoofed-registry-side-effect-runtime-dep
    for: [package.json, javascript, npm]
    desc: Spoofed registry dependency loaded for side effects
    crit: hostile
    conf: 0.98
    scope: package
    all:
      - id: dep-spoofed-npm-registry-host
      - id: metadata/package/publishing::npm-public-publish-access
      - id: micro-behaviors/os/module/require::esm-side-effect-package-import
    unless:
      - id: metadata/package/publishing::is-private
      - id: well-known/tool/development/aube::aube-package-test-fixture
      - id: well-known/tool/development/aube::aube-published-npm-package

  - id: npm-phantom-typosquat-registry-tarball
    for: [package.json, npm, tar, tgz, zip]
    desc: Phantom dep uses typosquat npmjs tarball URL
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: dep-fake-npmjs-registry-tarball
      - id: metadata/package/dependencies/manifest/reconciliation::npm-phantom-runtime-dependency
