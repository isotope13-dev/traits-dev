# A Terraform provider address has the form hostname/namespace/type. The
# official public registry is registry.terraform.io; a different host may be a
# legitimate private registry, but it must not claim HashiCorp's public
# namespace or masquerade as the official registry. Weaponized lockfiles use
# those combinations to make `terraform init` fetch and execute an attacker's
# provider binary.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, data]
  attack: T1195.002
  mbc: E1195.002

traits:
  - id: terraform-official-namespace-on-custom-registry
    desc: Custom registry claims HashiCorp namespace
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?im)^\s*provider\s+"[a-z0-9.-]+/hashicorp/[a-z0-9_-]+"\s*\{'
      not:
        - substr: 'provider "registry.terraform.io/hashicorp/'

  - id: terraform-lookalike-registry-host
    desc: Terraform registry hostname spoofs vendor brand
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\s*provider\s+"registry[.](hashicorp|terraform)[-.][a-z0-9.-]{2,120}/'

composite_rules:
  - id: terraform-lockfile-hashicorp-namespace-hijack
    desc: Terraform lockfile hijacks HashiCorp namespace through custom registry
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/dependencies/lockfile::terraform-dependency-lockfile
      - id: terraform-official-namespace-on-custom-registry

  - id: terraform-lockfile-registry-brand-spoof
    desc: Terraform lockfile redirects provider through lookalike registry
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/dependencies/lockfile::terraform-dependency-lockfile
      - id: terraform-lookalike-registry-host
