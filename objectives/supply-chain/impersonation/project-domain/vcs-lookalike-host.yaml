# A payload served from a domain built to read as a well-known project.
#
# The compromised guardrails-ai wheel fetched its second stage from
# `https://git-tanstack.com/transformers.pyz`. Every part of that is chosen.
# `git-` reads as a source host. `tanstack` is a real, widely used project.
# `transformers.pyz` is the name of a library a machine-learning developer
# would expect to see. Somebody skimming a proxy log, a firewall rule request,
# or a dependency review sees a plausible open-source mirror.
#
# The dropper rules already state that the package downloads and runs a stage
# when it is imported. This states where from, and that is a separate finding
# with a separate response: the mechanism is fixed by removing the package,
# but a lookalike domain is infrastructure that outlives this incident and can
# be blocked, reported, and searched for across other traffic.
#
# The pattern is the service-word prefix joined to a project name, serving a
# file with an executable extension. Official project domains do not take this
# shape -- they are the project name alone, or the project on a real forge.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, text]
  attack: T1195.002,T1583.001,T1036.005
  mbc: B0024

traits:
  - id: vcs-lookalike-payload-url
    desc: Payload URL on a forge-lookalike host
    crit: suspicious
    conf: 0.92
    # `git-tanstack.com/transformers.pyz`. The extension requirement keeps
    # this off ordinary documentation and mirror links.
    if:
      type: text
      regex: 'https?://(git|npm|pypi)-[a-z0-9-]{3,24}\.[a-z]{2,6}/[^\s"'']{0,50}\.(pyz|exe)'

composite_rules:
  - id: stage-fetched-from-lookalike-project-host
    desc: Stage fetched from a lookalike host
    crit: hostile
    conf: 0.96
    all:
      - id: vcs-lookalike-payload-url
    any:
      - id: objectives/command-and-control/dropper/delivery/download-execute::import-time-download-and-interpret
      - id: objectives/command-and-control/dropper/delivery/
    unless:
      - id: metadata/package/testing/
