defaults:
  platforms: [unix]
  for: [php]
  attack: T1195.002

traits:
  - id: php-homebrew-formula-write
    desc: PHP Homebrew formula write
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: class MaliciousPackage < Formula

  - id: php-homebrew-tap-path
    desc: PHP Homebrew tap path
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: Library/Taps/homebrew/homebrew-core/Formula

  - id: php-composer-apple-package
    desc: PHP Apple composer package
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: apple/system-config

composite_rules:
  - id: php-homebrew-package-impersonation
    desc: PHP Homebrew package impersonation
    crit: hostile
    conf: 0.98
    all:
      - id: php-homebrew-formula-write
      - id: php-homebrew-tap-path

  # The lifecycle-event leg is a neutral Composer surface (Composer's own phar
  # names it), so it lives in micro-behaviors/os/package-manager/install/. The
  # impersonation evidence is the vendor/package name being squatted.
  - id: php-composer-package-impersonation
    desc: PHP composer package impersonation
    crit: hostile
    conf: 0.98
    all:
      - id: php-composer-apple-package
      - id: micro-behaviors/os/package-manager/install::composer-post-install-cmd-event
