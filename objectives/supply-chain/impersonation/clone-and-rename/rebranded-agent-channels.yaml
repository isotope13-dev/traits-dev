# A republished coding agent that switches off the upstream's own channels.
#
# Vendoring somebody else's agent and shipping it under your own brand is
# allowed by the licence and is not, by itself, interesting. What is interesting
# is what a wrapper does to the code it swallowed. Setting the vendored agent's
# `*_DISABLE_UPDATE_CHECK` / `*_SKIP_VERSION_CHECK` knob means the copy running
# on the developer's machine will never learn that upstream shipped a fix -- the
# republisher becomes the only route by which a security patch can arrive, on
# whatever schedule suits them. Setting its `*_TELEMETRY` knob to zero means
# upstream never learns the fork exists or how it behaves. Together they leave a
# copy of a tool with agent-level authority over a developer's machine that is
# unpatchable by its author and invisible to them.
#
# Read from the variable shape rather than any one vendor's prefix, because the
# prefix is the part that changes: every agent runtime exposes knobs in this
# form, and a fork of the next one will set the next set of names.
#
# Suspicious. An enterprise repackaging an internal build pins versions and
# turns off phone-home for defensible reasons; what an analyst needs is to be
# told that the copy in front of them cannot be updated by the people who wrote
# it.
#
# Filed with the other clone-and-rename rules rather than under trojanized/,
# because that is what this is: the package is a rebrand of somebody else's
# release, and these traits read the part of the rebrand that touches the
# original's behavior instead of its manifest.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002
  mbc: B0024
  crit: notable
  conf: 0.92

traits:
  - id: vendored-update-check-disabled
    desc: Disables a dependency's update check
    if:
      type: text
      regex: '\.env\.[A-Z][A-Z0-9_]{1,28}_(DISABLE_UPDATE_CHECK|SKIP_VERSION_CHECK)\s*\?{0,2}='

  - id: vendored-telemetry-disabled
    desc: Disables a dependency's telemetry
    if:
      type: text
      regex: '\.env\.[A-Z][A-Z0-9_]{1,28}_TELEMETRY\s*\?{0,2}=\s*["'']?0'

  # Wrappers that do this name the step. "White label" is the term of art for
  # replacing another product's branding with your own, and a published package
  # that performs it at startup is announcing that what runs is not what the
  # manifest describes.
  - id: white-label-rebrand-step
    desc: Applies a white-label rebrand at startup
    if:
      type: text
      regex: '(?i)\b(ensure|apply|do)WhiteLabel\w{0,16}\s*\('

composite_rules:
  - id: rebranded-agent-suppresses-upstream-channels
    for: [javascript, typescript, npm]
    desc: Republished agent silences upstream update and telemetry
    crit: suspicious
    conf: 0.94
    scope: archive
    all:
      - id: vendored-update-check-disabled
      - id: vendored-telemetry-disabled
