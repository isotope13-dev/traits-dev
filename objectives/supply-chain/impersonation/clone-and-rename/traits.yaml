# Clone-and-rename name squatting (T1195.002) — publisher-agnostic.
#
# Take a package with installs, republish it verbatim under a confusingly similar
# name, and wait. There is no payload in the first version — that is the point,
# and it is why every behavioral trait stays silent. Both gauntlet samples are
# byte-clones of real projects: `tailwindcss-form-styles` of Tailwind Labs'
# `tailwindcss-forms`, `tailwindcss-3d-animate` of `sambauers/tailwindcss-3d`.
# The malice, when it arrives, is a later version shipped to whoever installed
# the name.
#
# The manifest contradicting itself is the whole signal. Neither leg is worth
# anything alone — packages are renamed for legitimate reasons, and plenty of
# real packages omit an author — but a package that claims someone else's
# repository *and* names nobody responsible for it has no ordinary explanation.
#
# Suspicious, not hostile: this reports a package worth a human's attention, and
# there is deliberately no assertion about what the code does, because the code
# is a faithful copy of something legitimate.
defaults:
  platforms: [unix, windows]
  attack: T1195.002
  for: [npm, tar, zip]

composite_rules:
# The shape a triager actually sees on both gauntlet clones, and the one no rule
# was assembling: a package first published days ago, pushing three releases in
# 24 hours, that claims a repository belonging to a different project. Each leg
# is unremarkable on its own — new packages exist, active authors publish often,
# and packages are renamed for legitimate reasons — but a brand-new package
# iterating fast under someone else's repo URL has no ordinary reading.
#
# Publisher-agnostic by construction: every leg is a registry fact or a manifest
# self-contradiction, so this generalizes to the next squat rather than
# describing the last one.
#
# Suspicious, not hostile: there is deliberately no claim about the code, which
# is a faithful copy of something legitimate. The payload, if it comes, is a
# later version shipped to whoever installed the name.
- id: npm-fresh-clone-publish-burst
  desc: New fast-publishing package claims other repo
  crit: suspicious
  conf: 0.88
  # `scope: package`, not `archive`: the registry traits are `for: [registry]` and
  # only ever evaluate against the grafted `*.registry.json` document, so an
  # archive-scoped `all:` can never see them beside a fact about the package's own
  # bytes. Package scope is the correlation step that does — it runs over the
  # artifact's findings and the registry node's together.
  scope: package
  all:
  - id: metadata/package/manifest/repository::npm-name-repo-mismatch
  - id: metadata/registry::brand-new-package
  - id: metadata/registry::publish-burst-24h
- id: npm-clone-and-rename
  desc: Package clones a repo it renames itself from
  crit: suspicious
  conf: 0.85
  scope: archive
  all:
  - id: metadata/package/manifest/repository::npm-name-repo-mismatch
  - id: metadata/package/quality/empty::npm-no-author
# The third corroborator: the manifest claims another project's repository, and
# the README — copied wholesale from that project — still advertises the upstream
# package in its badges. This catches the clone that DOES declare an author (so
# npm-clone-and-rename stays silent) but cannot rewrite every self-reference in
# the prose it lifted. Archive scope: both facts live in the tarball, no fetch.
- id: readme-clone-npm-badge-mismatch
  desc: Renamed package keeps upstream README badges
  crit: suspicious
  conf: 0.9
  scope: archive
  all:
  - id: metadata/package/manifest/repository::npm-name-repo-mismatch
  - id: objectives/supply-chain/impersonation/readme-clone::readme-npm-badge-names-foreign-package
