# A crate that claims rust-lang provenance in its manifest while its build
# script writes out and launches a prebuilt executable. The toolchain's own
# crates never do this; the claim is the disguise. easylibm 0.2.18 is the
# shape: libm's source, authors and repository copied verbatim under a new
# package name, plus a build.rs that drops `helper/{linux,darwin,windows}`.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1036
  mbc: B0024

composite_rules:
  - id: rust-lang-provenance-build-dropper
    desc: Crate claims rust-lang origin, build.rs drops binary
    crit: hostile
    conf: 0.96
    for: [crate, tar, cargo.toml, rust]
    scope: archive
    all:
      - id: metadata/package/name/convention::cargo-repository-rust-lang-org
      - id: objectives/supply-chain/install-hook/dropper/native-loader::build-rs-drops-and-runs-embedded-binary
