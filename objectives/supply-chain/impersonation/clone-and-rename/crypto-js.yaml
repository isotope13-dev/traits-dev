# CryptoJS republished under another name with an install hook added. The
# clone keeps the upstream implementation and its manifest description, so it
# reads as the library, while the new name and lifecycle hook are what the
# republisher added. Upstream crypto-js has never declared install scripts;
# a package that merely vendors CryptoJS carries its own description.
#
# Worked example: js-digest 4.2.2 (2025, atomic-arch AUR wave), whose
# preinstall ran ./lib/install-deps.mjs. The hook target is attacker-chosen
# and deliberately unconstrained here.
defaults:
  platforms: [unix, windows]
  for: [npm, javascript, package.json]
  attack: T1195.002,T1036.005
composite_rules:
  - id: renamed-cryptojs-clone-install-hook
    desc: CryptoJS clone republished under a new name adds an install hook
    crit: hostile
    conf: 0.95
    scope: outer
    all:
      - id: well-known/lib/crypto/crypto-js::crypto-js-library-implementation
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: well-known/lib/crypto/crypto-js::crypto-js-manifest-description
    unless:
      - id: well-known/lib/crypto/crypto-js::crypto-js-package-name
