# Republishing a well-known library under your own name.
#
# The sibling rules in this directory catch a clone by its manifest
# self-contradictions -- a repository URL belonging to someone else, a stripped
# repository field, a README that still advertises the upstream package. This
# one reads the code instead, which is what is left when the packaging has been
# rewritten cleanly: the distribution name, the module name, the author, the
# summary and the dependency names all changed, and the library's own internal
# data model did not, because changing that would mean rewriting the library.
#
# `hanzo_llm` is the shape: distribution `hanzo-llm`, author "Hanzo AI",
# top-level module renamed from `litellm` to the maximally generic `llm`, and
# 799 of its files still threading `litellm_params` and `litellm_call_id`
# through every call. A permissive licence allows this, and a disclosed fork is
# a normal thing to publish -- which is precisely why the interesting fact is
# that nothing in the distribution's own metadata says where the code came
# from. The installer sees an LLM library from a vendor they have never audited;
# what they get is a mirror of someone else's release, on the republisher's
# update schedule, and every later version arrives with no upstream to diff
# against.
#
# Suspicious, and deliberately silent about the code: like its siblings, this
# reports a package a human should look at. Upstream's own releases and honest
# wrappers are excluded by name and by declared dependency.
defaults:
  platforms: [unix, windows]
  for: [whl, python-sdist, egg, zip, tar]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: rebranded-litellm-redistribution
    desc: Distribution republishes LiteLLM under another name
    crit: suspicious
    conf: 0.93
    scope: archive
    all:
      - id: well-known/lib/ai/litellm::litellm-codebase
    unless:
      # Upstream's own wheels and sdists.
      - id: well-known/lib/ai/litellm::litellm-distribution-name
      # A wrapper that declares LiteLLM as a dependency is using it, not
      # reissuing it.
      - id: well-known/lib/ai/litellm::litellm-declared-dependency
