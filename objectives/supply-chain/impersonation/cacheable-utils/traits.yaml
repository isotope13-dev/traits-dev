# Typosquat of @cacheable/utils: unscoped @cacheable-utils name with a stripped
# tarball that omits package.json while shipping stolen upstream runtime code.
defaults:
  platforms: [unix, windows]
  for: [tar]

traits:
  - id: cacheable-utils-typosquat-basename
    desc: Basename typosquats @cacheable/utils scope
    crit: suspicious
    conf: 0.995
    attack: T1195.002
    mbc: E1195.002
    if:
      type: value
      path: file.basename
      regex: '^@cacheable-utils-[0-9]+\.[0-9]+\.[0-9]+\.tgz$'

composite_rules:
  - id: cacheable-utils-stripped-typosquat
    desc: Typosquatted cacheable utils stripped publish
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: cacheable-utils-typosquat-basename
      - id: well-known/lib/runtime/cacheable::cacheable-tags-reserved-prefix
      - id: metadata/package/manifest/entrypoint::runtime-shipped-without-publish-manifest
