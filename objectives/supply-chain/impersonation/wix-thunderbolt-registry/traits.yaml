# npm packages that impersonate Wix Thunderbolt internal registry modules
# (thunderboltRegistry, siteAssetsRegistry, corvidRegistry, …) while running
# hostile code at module load. The facade API surface is stable across site
# builder releases; the published filename thunderboltRegistry.js is mandated by
# how victim bundlers resolve those imports.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002
  mbc: B0024

traits:
  - id: wix-thunderbolt-loader-api-marker
    desc: References Wix Thunderbolt loader API
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: ensureComponentLoadersAreCreated

  - id: wix-corvid-registry-export-name
    desc: References Wix corvidRegistry module name
    crit: notable
    conf: 0.95
    if:
      type: text
      word: corvidRegistry

  - id: wix-site-assets-registry-export-name
    desc: References Wix siteAssetsRegistry module name
    crit: notable
    conf: 0.95
    if:
      type: text
      word: siteAssetsRegistry

composite_rules:
  - id: wix-thunderbolt-registry-module-facade
    desc: JavaScript impersonates Wix Thunderbolt registry modules
    crit: suspicious
    conf: 0.97
    all:
      - id: wix-thunderbolt-loader-api-marker
      - id: wix-corvid-registry-export-name
      - id: wix-site-assets-registry-export-name

  - id: npm-wix-thunderbolt-registry-sidedoor-rce
    desc: npm package ships Wix registry facade with import-time RCE exfil
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1041,T1059.007,T1082
    mbc: E1041
    for: [npm, tar, zip, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/files/package-json::files-list-wix-thunderbolt-registry
      - id: wix-thunderbolt-registry-module-facade
      - id: objectives/exfiltration/http/query::node-command-output-uri-http-exfil
      - id: micro-behaviors/os/api-resolution/dynamic::new-module-constructor
      - id: micro-behaviors/os/module/require::node-require-cache-delete
    unless:
      - id: metadata/package/testing/
