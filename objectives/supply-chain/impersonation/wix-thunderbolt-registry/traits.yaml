# npm packages that impersonate Wix Thunderbolt internal registry modules
# (thunderboltRegistry, siteAssetsRegistry, corvidRegistry, …) while running
# hostile code at module load. The facade API surface is stable across site
# builder releases; the published filename thunderboltRegistry.js is mandated by
# how victim bundlers resolve those imports.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: wix-import-time-oast-http-exfil-atoms
    desc: Import-time execSync with fetch to OAST or webhook callback
    crit: component
    conf: 0.99
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    any:
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
      - id: micro-behaviors/communications/url/host::webhook-site-uuid-path
      - id: micro-behaviors/communications/url/host::webhook-site
    needs: 1

  - id: wix-import-time-query-http-exfil-atoms
    desc: Import-time execSync URI-encodes command output into fetch URL
    crit: component
    conf: 0.99
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/data/encode/url::encode-uri-component-call

  - id: npm-wix-thunderbolt-registry-sidedoor-rce
    desc: npm package ships Wix registry facade with import-time RCE exfil
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1041,T1059.007,T1082
    mbc: E1041
    for: [npm, tar, zip, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/files/package-json::files-thunderbolt-registry-js
      - id: well-known/lib/ui/wix::wix-thunderbolt-registry-api-surface
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    any:
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
      - id: micro-behaviors/os/module/dynamic-load::new-module-constructor
      - id: micro-behaviors/os/sysinfo/hostname::host-identity-query
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
      - id: micro-behaviors/communications/url/host::webhook-site-uuid-path
    needs: 1
    unless:
      - id: metadata/package/testing/
