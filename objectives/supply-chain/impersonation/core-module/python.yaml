# Python Supply Chain Attack Detection - Package Impersonation
# ATT&CK: T1195.002 (Compromise Software Supply Chain)
# Detects Python packages that masquerade as legitimate stdlib packages
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: suspicious
  attack: "T1195.002"
traits:
- id: top-level-code-stdlib-name
  desc: Top-level module named code
  crit: component
  conf: 0.9
  for: [data]
  if:
    type: text
    regex: '^code\s*$'
  # === getpass Interception ===
- id: getpass-func-def
  desc: getpass function definition
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: '(?m)^def getpass\s*\('
  unless:
  - id: metadata/package/testing/
# `getpass-module-call` lived here as "Calls getpass.getpass", but calling the
  # real getpass is a neutral password-prompt capability, not impersonation
  # (it fired on a face-unlock CLI's enrollment passphrase prompt). It now
  # lives at micro-behaviors/process/user/query::python-getpass-call, which
  # the wrapper composite below references cross-directory.
  # === File Exfiltration ===
composite_rules:
  - id: stdlib-code-top-level
    desc: Package exposes stdlib code module
    crit: suspicious
    conf: 0.9
    for: [data]
    all:
      - id: metadata/file/extension/identity::python-wheel-top-level-txt
      - id: top-level-code-stdlib-name
  # === getpass Wrapper Detection ===
  - id: getpass-wrapper
    desc: Wrapper around real getpass module
    crit: notable
    conf: 0.85
    all:
    - id: getpass-func-def
    any:
    - id: micro-behaviors/process/user/query::python-getpass-module-import
    - id: micro-behaviors/process/user/query::python-getpass-call
  - id: append-hidden-file
    desc: Core-module impersonation writes hidden path
    crit: suspicious
    conf: 0.85
    near_bytes: 512
    all:
    - id: micro-behaviors/fs/path/location::python-open-hidden-path
    - id: micro-behaviors/fs/file/open::write-append-create-mode
    any:
    - id: stdlib-code-top-level
    - id: getpass-wrapper
    unless:
    - id: well-known/app/infrastructure/pulumi::pulumi-source-tree
    - id: metadata/package/testing/

  # A wheel that both declares `ctypes` as an installable dependency and
  # imports the stdlib module is asking installers to resolve a third-party
  # distribution under a trusted core-module name. The declaration alone
  # can be an old packaging mistake, so keep the package-level pairing
  # suspicious rather than hostile.
  - id: python-stdlib-dependency-with-import
    desc: Wheel declares and imports ctypes
    crit: suspicious
    conf: 0.94
    for: [whl]
    scope: archive
    all:
    - id: metadata/package/dependencies/declaration::pypi-ctypes-stdlib-dependency
    - id: micro-behaviors/dylib/load/ffi::ctypes-ffi-import

  # === Credential Interception with Exfil ===
  - id: getpass-intercept-exfil
    desc: getpass interception with exfiltration
    crit: hostile
    conf: 0.95
    attack: "T1056"
    mbc: "E1056"
    all:
    - id: getpass-wrapper
    any:
    - id: micro-behaviors/communications/http/request/client::request-python
    - id: micro-behaviors/fs/write/credential::python-credential-path-open-write
    unless:
    - id: metadata/package/testing/
  # === Input Interception with Exfil ===
  - id: py-input-intercept-exfil
    desc: input interception with exfiltration
    crit: hostile
    conf: 0.95
    attack: "T1056"
    all:
    - id: micro-behaviors/ui/dialog/prompt::python-builtins-input-wrapper
    any:
    - id: micro-behaviors/communications/http/request/client::request-python
    - id: micro-behaviors/fs/write/credential::python-credential-path-open-write
  # === Full Supply Chain Pattern ===
  - id: python-credential-supply-chain
    desc: Python credential interception supply chain attack
    crit: notable
    conf: 0.98
    mbc: "E1056"
    any:
    - id: getpass-intercept-exfil
    - id: py-input-intercept-exfil
