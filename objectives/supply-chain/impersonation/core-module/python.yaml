# Python Supply Chain Attack Detection - Package Impersonation
# ATT&CK: T1195.002 (Compromise Software Supply Chain)
# Detects Python packages that masquerade as legitimate stdlib packages
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: suspicious
  attack: "T1195.002"
traits:
- id: top-level-code-stdlib-name
  desc: Top-level module named code
  crit: component
  conf: 0.9
  for: [data]
  if:
    type: text
    regex: '^code\s*$'
  # === getpass Interception ===
- id: getpass-func-def
  desc: getpass function definition
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: '(?m)^def getpass\s*\('
  unless:
  - id: metadata/package/testing/
- id: getpass-module-call
  desc: Calls getpass.getpass
  crit: notable
  conf: 0.5
  # Requires attribute-access against the real module; bare `getpass`
  # symbols also match locally-defined methods like `def getpass(self):`.
  if:
    type: text
    regex: 'getpass\.getpass\s*\('
  # === File Exfiltration ===
composite_rules:
  - id: stdlib-code-top-level
    desc: Package exposes stdlib code module
    crit: suspicious
    conf: 0.9
    for: [data]
    all:
      - id: metadata/file/extension/identity::python-wheel-top-level-txt
      - id: top-level-code-stdlib-name
  # === getpass Wrapper Detection ===
  - id: getpass-wrapper
    desc: Wrapper around real getpass module
    crit: notable
    conf: 0.85
    all:
    - id: getpass-func-def
    any:
    - id: micro-behaviors/process/user/query::python-getpass-module-import
    - id: getpass-module-call
  - id: append-hidden-file
    desc: Core-module impersonation writes hidden path
    crit: suspicious
    conf: 0.85
    near_bytes: 512
    all:
    - id: micro-behaviors/fs/path/location::python-open-hidden-path
    - id: micro-behaviors/fs/file/open::write-append-create-mode
    any:
    - id: stdlib-code-top-level
    - id: getpass-wrapper
    unless:
    - id: well-known/app/infrastructure/pulumi::pulumi-source-tree
    - id: metadata/package/testing/
  # === Credential Interception with Exfil ===
  - id: getpass-intercept-exfil
    desc: getpass interception with exfiltration
    crit: hostile
    conf: 0.95
    attack: "T1056"
    mbc: "E1056"
    all:
    - id: getpass-wrapper
    any:
    - id: micro-behaviors/communications/http/request/client::request-python
    - id: micro-behaviors/fs/write/credential::python-credential-path-open-write
    unless:
    - id: metadata/package/testing/
  # === Input Interception with Exfil ===
  - id: py-input-intercept-exfil
    desc: input interception with exfiltration
    crit: hostile
    conf: 0.95
    attack: "T1056"
    all:
    - id: micro-behaviors/ui/dialog/prompt::python-builtins-input-wrapper
    any:
    - id: micro-behaviors/communications/http/request/client::request-python
    - id: micro-behaviors/fs/write/credential::python-credential-path-open-write
  # === Full Supply Chain Pattern ===
  - id: python-credential-supply-chain
    desc: Python credential interception supply chain attack
    crit: notable
    conf: 0.98
    mbc: "E1056"
    any:
    - id: getpass-intercept-exfil
    - id: py-input-intercept-exfil
