# A manifest that lists Node's own builtins among its runtime dependencies.
#
# `fs`, `os`, `child_process`, `crypto`, `net`, `dns` and `https` ship with the
# runtime. Nothing needs to install them, and the npm names are not the modules:
# some are security holds (`fs@0.0.1-security`), the rest are squats sitting on
# a name a careless `npm install fs` will fetch. A package that declares two or
# more of them is either written by someone who does not know what a builtin is,
# or is padding its dependency list to look substantial -- and in a package that
# is itself squatting a well-known name, the second reading is the live one.
#
# Measured over 236 installed packages, *none* declares even one builtin as a
# runtime dependency, so this is not a common mistake in shipped code. Two are
# required rather than one because a single stray entry is the plausible typo;
# a cluster is a pattern.
#
# Kept at suspicious. The manifest shape is anomalous but says nothing about
# what the package does -- the objectives that pair it with an install hook, an
# eval dependency or a squatted name are what convict.
#
# Worked example: the `bcryptutils` / `bcryptkit` sets, which squat the bcrypt
# name and list `fs`, `os` and `child_process` beside `express-eval`.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002

composite_rules:
  - id: npm-declares-node-builtins-as-dependencies
    desc: Manifest lists Node builtins as dependencies
    crit: suspicious
    conf: 0.9
    needs: 2
    any:
      - id: metadata/package/dependencies/manifest/identity::npm-dep-child-process
      - id: metadata/package/dependencies/manifest/identity::npm-dep-fs-security-stub
      - id: metadata/package/dependencies/manifest/identity::npm-dep-os-core-name
      - id: metadata/package/dependencies/manifest/identity::npm-dep-crypto-core-name
      - id: metadata/package/dependencies/manifest/identity::npm-dep-https-core-name
      - id: metadata/package/dependencies/manifest/identity::npm-dep-dns-core-name
      - id: metadata/package/dependencies/manifest/identity::npm-dep-net-core-name

  # The single-squat spelling of the cluster above. Two builtins is a pattern;
  # one named `child_process` with a chosen version range is a delivery: the
  # npm package by that name is a long-standing squat, and the dependency exists
  # only so that installing this package fetches it. A caret range is what
  # separates deliberation from a copy-pasted import list -- the cluster rule's
  # "plausible typo" carve-out does not survive someone picking `^1.0.2`.
  #
  # Worked example: the trojanized `@0xobelisk/sui-cli@0.5.10` republish, where
  # `child_process: ^1.0.2` was the only change from the legitimate release.
  #
  # Downgraded to suspicious: the worked example does not hold up. The ordinary
  # @0xobelisk/sui-cli releases carry `child_process: ^1.0.2` too -- 1.0.5 and
  # 1.0.6, published three days apart in January 2025 and both clean -- so the
  # dependency is the project's own long-standing mistake and cannot by itself
  # separate a trojanized republish from a normal one. A manifest fact with no
  # accompanying behavior is not a hostile verdict; the composites that pair
  # this with an install hook or a concealed import are.
  - id: public-package-ships-builtin-squat-dependency
    desc: Published package depends on builtin-name squat
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/package/dependencies/manifest/identity::npm-dep-child-process
      - id: metadata/package/publishing::npm-public-publish-access
