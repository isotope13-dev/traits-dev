defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
  attack: T1195.002
composite_rules:
- id: js-input-intercept-exfil
  desc: Node readline input exfiltration
  crit: hostile
  conf: 0.95
  attack: T1056
  mbc: E1056
  near_bytes: 4096
  # The prompt must seek a secret: a bare readline.question (a y/N confirm, a
  # project-name ask) beside an API POST is an ordinary CLI loop, not input
  # capture. Credential-phishing is the impersonation-package threat here.
  # Co-occurrence is not data flow: a token prompt beside an unrelated
  # API POST (device authorization, config lookup, a signed transaction)
  # is not exfiltration. The prompted answer has to reach the body.
  all:
  - id: micro-behaviors/ui/controls/credential::readline-secret-question
  any:
  - id: micro-behaviors/communications/http/request/credential-body-flow::question-answer-json-body-to-fetch
  - id: micro-behaviors/communications/http/request/credential-body-flow::question-answer-json-body-to-axios
  - id: micro-behaviors/fs/write/credential::js-sensitive-path-write
  - id: micro-behaviors/fs/write/file/target::fs-append-hidden
  unless:
  - id: well-known/app/ai/assistant/nitin-ai
  - id: well-known/lib/ai/genkit/
  - id: well-known/lib/ai/genkit::genkit-analytics-telemetry
- id: crypto-intercept-exfil
  desc: Crypto wrapper conceals validator input exfiltration
  crit: hostile
  conf: 0.95
  attack: T1195.002,T1041
  all:
  - id: metadata/lang/source/interface/crypto::node-crypto-export-import-near
  - id: objectives/exfiltration/http/encoded::check-validator-helper
  - id: objectives/exfiltration/http/encoded::validator-fetch-returns-true
  - id: micro-behaviors/data/encode/base64/structured::json-field-btoa-value
  - id: micro-behaviors/communications/http/post::fetch-post-call
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/path/directory::test-directory-component
- id: js-input-or-crypto-wrapper-exfil
  desc: JavaScript input capture or crypto-wrapper exfiltration
  # Aggregator over the two input-related hostiles — keep suspicious so a
  # single underlying exfil path is not reported twice as hostile.
  crit: suspicious
  conf: 0.98
  attack: T1195.002,T1041
  any:
  - id: js-input-intercept-exfil
  - id: crypto-intercept-exfil
