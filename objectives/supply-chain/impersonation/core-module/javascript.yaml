defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
  attack: T1195.002
traits:
# A hidden FILE (dotfile basename), not a write under a hidden directory
# such as /home/runner/.copilot/mcp-config.json on GitHub Actions runners.
- id: fs-append-hidden
  desc: Writes an absolute hidden file
  crit: suspicious
  conf: 0.75
  if:
    type: text
    regex: fs\.(appendFile|writeFile)Sync?\(["'](/|[A-Za-z]:)[^"']{0,48}[\\/]\.[^"'/]{1,40}["']

composite_rules:
- id: obfuscated-node-crypto-loader
  desc: Node crypto loading and use near runtime code construction or obfuscation
  crit: notable
  conf: 0.88
  # File-wide correlation mislabels ordinary bundled applications whenever a
  # crypto-using dependency and an unrelated `new Function` share one chunk.
  near_bytes: 2048
  all:
  - id: micro-behaviors/crypto/library/provider::require-crypto
  - id: micro-behaviors/crypto/library/provider::node-crypto-operation
  any:
  - id: objectives/anti-static/obfuscation/string/array::string-array-hex-index
  - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-constructor
  - id: objectives/anti-static/obfuscation/code-metrics/structure::minified-code
  downgrade:
    any:
    - id: metadata/package/testing/harness/runtime/
  unless:
  - id: micro-behaviors/communications/http/oauth/
  - id: well-known/lib/network/node-edge/
- id: js-input-intercept-exfil
  desc: Node readline input exfiltration
  crit: hostile
  conf: 0.95
  attack: T1056
  mbc: E1056
  near_bytes: 4096
  all:
  - id: micro-behaviors/ui/dialog/prompt::node-readline-question-call
  any:
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/http/post::http-request-post
  - id: micro-behaviors/fs/write/credential::js-sensitive-path-write
  - id: fs-append-hidden
  unless:
  - id: well-known/tool/development/anthropic-claude-agent/
  - id: well-known/app/ai/assistant/nitin-ai
- id: crypto-intercept-exfil
  desc: Crypto wrapper with exfiltration
  crit: hostile
  conf: 0.95
  attack: T1056
  near_bytes: 8192
  all:
  - id: micro-behaviors/crypto/library/wrapper::node-crypto-wrapper
  any:
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/http/post::http-request-post
  - id: micro-behaviors/fs/write/credential::js-sensitive-path-write
  - id: fs-append-hidden
  unless:
  - id: metadata/library/structure::js-large-module-bundle
  - id: metadata/package/testing/
- id: js-credential-supply-chain
  desc: JavaScript credential interception supply chain attack
  # Aggregator over the two intercept hostiles — keep suspicious so a single
  # underlying exfil path is not reported twice as hostile.
  crit: suspicious
  conf: 0.98
  mbc: E1056
  any:
  - id: js-input-intercept-exfil
  - id: crypto-intercept-exfil
