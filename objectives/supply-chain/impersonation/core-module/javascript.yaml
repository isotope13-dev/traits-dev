defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
  attack: T1195.002
traits:
- id: fs-write-sensitive-call-ssh
  desc: File write targets SSH key
  crit: component
  conf: 0.86
  if:
    type: text
    case_insensitive: true
    regex: (writeFile|appendFile)Sync?\s*\([^;]{0,360}(id_rsa|id_ed25519|authorized_keys)
  unless:
  - id: well-known/tool/development/vmactions-freebsd/
- id: fs-write-sensitive-call-token
  desc: File write targets credential
  crit: component
  conf: 0.86
  if:
    type: text
    case_insensitive: true
    regex: (write|append)FileSync?\([^,)]{0,140}\b(authToken|password|credentials)\b[^,)]{0,20},
  not:
    # Build scaffolds commonly create a placeholder Google OAuth file whose
    # filename contains "credentials" but does not contain a secret.
    - regex: '(?i)(google-api\.credentials\.json|yourappidhere|your project id here|your client secret here)'
- id: fs-write-sensitive-call-dotfile
  desc: File write targets credential dotfile
  crit: component
  conf: 0.86
  if:
    type: text
    case_insensitive: true
    regex: (writeFile|appendFile)Sync?\s*\([^;]{0,500}(\.npmrc|\.netrc|passwd)\b[^;]{0,240}
  not:
    - regex: 'otp\s*='
    - substr: NPM_OTP_KEY
    - substr: notp.totp.gen
- id: fs-stream-sensitive-call
  desc: Stream write targets credentials
  crit: component
  conf: 0.82
  if:
    type: text
    case_insensitive: true
    regex: createWriteStream\s*\([^)]{0,140}(id_rsa|credentials|password)
# A hidden FILE (dotfile basename), not a write under a hidden directory
# such as /home/runner/.copilot/mcp-config.json on GitHub Actions runners.
- id: fs-append-hidden
  desc: Writes an absolute hidden file
  crit: suspicious
  conf: 0.75
  if:
    type: text
    regex: fs\.(appendFile|writeFile)Sync?\(["'](/|[A-Za-z]:)[^"']{0,48}[\\/]\.[^"'/]{1,40}["']

composite_rules:
- id: obfuscated-node-crypto-loader
  desc: Node crypto loading and use near runtime code construction or obfuscation
  crit: notable
  conf: 0.88
  # File-wide correlation mislabels ordinary bundled applications whenever a
  # crypto-using dependency and an unrelated `new Function` share one chunk.
  near_bytes: 2048
  all:
  - id: micro-behaviors/crypto/library/provider::require-crypto
  - id: micro-behaviors/crypto/library/provider::node-crypto-operation
  any:
  - id: objectives/anti-static/obfuscation/string/array::string-array-hex-index
  - id: micro-behaviors/process/interpreter/eval::js-new-function-constructor
  - id: objectives/anti-static/obfuscation/code-metrics/structure::minified-code
  downgrade:
    any:
    - id: metadata/package/testing/harness/runtime/
  unless:
  - id: micro-behaviors/communications/http/oauth/
  - id: well-known/lib/network/node-edge/
- id: js-input-intercept-exfil
  desc: Node readline input exfiltration
  crit: hostile
  conf: 0.95
  attack: T1056
  mbc: E1056
  near_bytes: 4096
  all:
  - id: micro-behaviors/ui/dialog/prompt::node-readline-question-call
  any:
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/http/post::http-request-post
  - id: fs-write-sensitive
  - id: fs-append-hidden
  unless:
  - id: well-known/tool/development/anthropic-claude-agent/
  - id: well-known/app/ai/assistant/nitin-ai
- id: crypto-intercept-exfil
  desc: Crypto wrapper with exfiltration
  crit: hostile
  conf: 0.95
  attack: T1056
  near_bytes: 8192
  all:
  - id: micro-behaviors/crypto/library/wrapper::node-crypto-wrapper
  any:
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/http/post::http-request-post
  - id: fs-write-sensitive
  - id: fs-append-hidden
  unless:
  - id: metadata/library/structure::js-large-module-bundle
  - id: metadata/package/testing/
- id: js-credential-supply-chain
  desc: JavaScript credential interception supply chain attack
  # Aggregator over the two intercept hostiles — keep suspicious so a single
  # underlying exfil path is not reported twice as hostile.
  crit: suspicious
  conf: 0.98
  mbc: E1056
  any:
  - id: js-input-intercept-exfil
  - id: crypto-intercept-exfil
- id: fs-write-sensitive
  desc: Writes to sensitive path
  crit: suspicious
  conf: 0.8
  all:
  - id: micro-behaviors/fs/write/file/direct::js-file-write
  any:
  - id: fs-write-sensitive-call-ssh
  - id: fs-write-sensitive-call-token
  - id: fs-write-sensitive-call-dotfile
  - id: fs-stream-sensitive-call
  near_bytes: 4096
  not:
  - substr: "process.env["
  unless:
  - id: metadata/build/scaffold::node-project-scaffolder-file-writer
  - id: metadata/package/files/dependency::node-modules-path
  - id: well-known/tool/development/yarn::yarn-cli-bundle-marker
  - id: well-known/tool/development/aube::aube-package-test-fixture
  - id: well-known/tool/development/ganache/
  - id: well-known/app/system/freddie::benign-archive-context
  - id: well-known/app/ai/gateway/neurolink::benign-archive-context
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: well-known/tool/development/cross-platform-actions::cross-platform-actions-context
