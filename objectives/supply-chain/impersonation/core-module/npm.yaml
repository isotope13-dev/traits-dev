defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002
  mbc: E1195.002

traits:
  - id: description-node-path-module
    desc: Description claims Node path module
    crit: component
    conf: 0.9
    if:
      type: value
      path: description
      exact: Node.js path module
  - id: main-path-js
    desc: Package main points to path.js
    crit: component
    conf: 0.85
    if:
      type: value
      path: main
      regex: ^\.?/path\.js$
  - id: dependency-path-polyfill
    desc: Package depends on path polyfill
    crit: component
    conf: 0.75
    if:
      type: value
      path: dependencies.path
      exists: true
composite_rules:
  - id: npm-path-module-masquerade
    desc: npm package masquerades as path module
    crit: suspicious
    conf: 0.94
    all:
      - id: description-node-path-module
      - id: main-path-js
    any:
      - id: dependency-path-polyfill
      - id: metadata/package/dependencies/named::npm-dep-fs-security-stub
      - id: metadata/package/dependencies/named::npm-dep-execp
      - id: metadata/package/dependencies/manifest::npm-wildcard-dependency
      - id: metadata/package/dependencies/manifest::npm-dep-axios
    unless:
      # The genuine path / path-browserify packages match the description+main
      # legs above; the exact package name is what separates them from a squat.
      - id: well-known/lib/core/node-path::package-name
  - id: npm-path-module-execp-masquerade
    desc: path masquerade package depends on execp
    crit: hostile
    conf: 0.985
    all:
      - id: npm-path-module-masquerade
      - id: metadata/package/dependencies/named::npm-dep-execp

  # Joyent path.js clones that also import `https` are dropper stubs: the
  # stdlib path module never talks HTTPS, and the same family (path-addon,
  # path-extend, path-internal) splices a fetch+eval loader next to this
  # unused import. Manifest name is not `path` / `path-browserify`.
  - id: npm-path-clone-unused-https
    desc: Path clone imports HTTPS module
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1059.007
    for: [javascript, typescript, package.json, archives]
    scope: archive
    all:
      - id: well-known/lib/core/node-path::node-path-module-implementation
      - id: description-node-path-module
      - id: main-path-js
      - id: metadata/import/builtin::require-https
    unless:
      - id: well-known/lib/core/node-path::package-name

  # A dependency whose key is a Node builtin name can never be what the code
  # reaches when it requires that module, so the only thing the declaration
  # achieves is getting an unrelated package installed. On its own that is a
  # legacy mistake as often as an attack, so it stays suspicious; the hostile
  # reading needs the package to also be hiding which module it loads.
  - id: npm-core-module-name-dependency
    desc: Manifest depends on a Node core module name
    crit: suspicious
    conf: 0.88
    any:
      - id: metadata/package/dependencies/named::npm-dep-crypto-core-name
      - id: metadata/package/dependencies/named::npm-dep-os-core-name
      - id: metadata/package/dependencies/named::npm-dep-https-core-name
      - id: metadata/package/dependencies/named::npm-dep-dns-core-name
      - id: metadata/package/dependencies/named::npm-dep-net-core-name
      - id: metadata/package/dependencies/named::npm-dep-vm-core-name
      - id: metadata/package/dependencies/named::npm-dep-child-process
    unless:
      - id: metadata/package/testing/presence/harness/

  # The two halves reinforce each other without asserting dataflow between
  # them. The manifest quietly installs a tree under a builtin's trusted-looking
  # name, while the code separately conceals the dependency that it imports at
  # runtime. Either alone has innocent readings; the package-level pairing does
  # not.
  - id: npm-core-name-dependency-with-concealed-import
    desc: Core-module-named dependency accompanies concealed import
    crit: hostile
    conf: 0.96
    for: [javascript, typescript, package.json, npm, archives]
    scope: archive
    attack: "T1195.002,T1027"
    all:
      - id: npm-core-module-name-dependency
      - id: objectives/anti-static/obfuscation/imports::node-assembled-module-specifier-import
