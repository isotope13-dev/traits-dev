# Attribution and original homepage are retained under a different npm scope.
# This is a suspicious identity mismatch; forks may preserve upstream metadata.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1036,T1195.002

composite_rules:
  - id: claude-code-foreign-npm-identity
    desc: Foreign npm package claims Claude Code identity
    crit: suspicious
    conf: 0.96
    all:
      - id: well-known/app/ai/coding-agent/anthropic-claude-code::anthropic-author-string
      - id: well-known/app/ai/coding-agent/anthropic-claude-code::official-project-homepage
      - id: well-known/app/ai/coding-agent/anthropic-claude-code::claude-command-entry
    unless:
      - id: well-known/app/ai/coding-agent/anthropic-claude-code::official-npm-name
