defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: npm-bitwarden-brand-typosquat-name
  desc: Scoped npm name typosquats Bitwarden brand
  crit: suspicious
  conf: 0.97
  if:
    type: value
    path: name
    regex: '^@bitwardne/'
    case_insensitive: true
  unless:
  - id: well-known/app/security/bitwarden::bitwarden-app
- id: chatgpt-pro-product-package-name
  desc: npm package name claims ChatGPT Pro tooling
  crit: suspicious
  conf: 0.93
  if:
    type: value
    path: name
    regex: '(?i)chatgpt[-_]?pro'
- id: chatgpt-pro-product-description
  desc: Description claims ChatGPT Pro activation
  crit: notable
  conf: 0.9
  if:
    type: value
    path: description
    regex: '(?i)activates?\s+chatgpt\s+pro'
- id: name-discord-target
  desc: Package name contains "discord"
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: 'discord'
    case_insensitive: true
  unless:
  - id: metadata/package/freeform/
  - id: metadata/file/size::small-versioned-npm-manifest
- id: name-telegram-target
  desc: Package name contains "telegram"
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: 'telegram'
    case_insensitive: true
  unless:
  - id: metadata/package/freeform/
  - id: metadata/file/size::small-versioned-npm-manifest
- id: name-slack-target
  desc: Package name contains "slack"
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: 'slack'
    case_insensitive: true
  unless:
  - id: metadata/package/freeform/
  - id: metadata/file/size::small-versioned-npm-manifest
- id: name-mysql-prefix
  desc: Package name prefixes "mysql"
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: '^mysql-'
    case_insensitive: true
  unless:
  - id: metadata/package/freeform/
  - id: metadata/file/size::small-versioned-npm-manifest
- id: name-express-prefix
  desc: Package name prefixes "express"
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: '^express-'
    case_insensitive: true
  unless:
  - id: metadata/package/freeform/
  - id: metadata/file/size::small-versioned-npm-manifest
- id: name-react-prefix
  desc: Package name prefixes "react"
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: '^react-'
    case_insensitive: true
  unless:
  - id: metadata/package/freeform/
  - id: metadata/file/size::small-versioned-npm-manifest
- id: name-vue-prefix
  desc: Package name prefixes "vue"
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: '^vue-'
    case_insensitive: true
  unless:
  - id: metadata/package/freeform/
  - id: metadata/file/size::small-versioned-npm-manifest
- id: name-node-prefix
  desc: Package name prefixes "node"
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: '^node-'
    case_insensitive: true
    not:
    - substr: '"name": "node-pty"'
  unless:
  - id: metadata/package/freeform/
  - id: metadata/file/size::small-versioned-npm-manifest
composite_rules:
- id: name-has-theft-keyword
  desc: Package name contains theft-related keyword
  crit: notable
  conf: 0.75
  any:
  - id: metadata/package/name/security-term::name-grab-keyword
  - id: metadata/package/name/security-term::name-steal-keyword
  - id: metadata/package/name/security-term::name-crack-keyword
  - id: metadata/package/name/security-term::name-exfil-keyword
- id: name-has-target-app
  desc: Package name contains target application
  crit: notable
  conf: 0.5
  any:
  - id: name-discord-target
  - id: name-telegram-target
  - id: name-slack-target
  - id: metadata/package/name/vocabulary::name-wallet-target
  - id: metadata/package/name/vocabulary::name-metamask-target
  - id: metadata/package/name/security-term::name-password-target
- id: name-theft-target-combo
  desc: Package name combines theft keyword with target app
  crit: suspicious
  conf: 0.9
  all:
  - id: name-has-theft-keyword
  - id: name-has-target-app
- id: keyword-theft-patterns
  desc: Keywords contain theft-related terms
  crit: notable
  conf: 0.75
  any:
  - id: metadata/package/keywords/identity::keyword-dump
  - id: metadata/package/keywords/identity::keyword-grab
  - id: metadata/package/keywords/identity::keyword-steal
- id: keyword-theft-target-combo
  desc: Keywords combine theft and target terms
  crit: suspicious
  conf: 0.85
  all:
  - id: keyword-theft-patterns
  - id: metadata/package/keywords/identity::keyword-discord
  - id: metadata/package/keywords/identity::keyword-token-dup
- id: theft-name-no-repo
  desc: Theft keyword in name without repository
  crit: suspicious
  conf: 0.85
  all:
  - id: name-has-theft-keyword
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/repository/
- id: theft-name-no-bugs
  desc: Theft keyword in name without bugs URL
  crit: suspicious
  conf: 0.85
  all:
  - id: name-has-theft-keyword
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/repository::has-bugs-url-field
- id: theft-name-no-homepage
  desc: Theft keyword in name without homepage
  crit: suspicious
  conf: 0.85
  all:
  - id: name-has-theft-keyword
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/homepage::has-homepage-field
- id: credential-stealer-naming
  desc: Package naming suggests credential stealer
  crit: suspicious
  conf: 0.9
  attack: T1195.002
  all:
  - id: name-theft-target-combo
  - id: metadata/package/keywords/identity::keyword-discord
  - id: metadata/package/keywords/identity::keyword-token-dup
  unless:
  - id: metadata/package/repository/
- id: npm-framework-scope-lookalike-remote-install
  desc: Framework scope spelling variant executes archived remote code at install
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1105,T1059.007
  for: [npm, package.json]
  all:
  - id: micro-behaviors/process/deploy/interpreter-stdin::npm-preinstall-archive-replay-node-stdin
  any:
  - id: metadata/package/name/vocabulary::npm-scope-angular-lookalike
  - id: metadata/package/name/vocabulary::npm-scope-babel-repeated-letter

- id: npm-angular-org-typosquat-remote-install
  desc: Typosquatted @angular scope pipes remote install payload
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1105,T1059.007
  mbc: B0024
  for: [npm, package.json]
  scope: archive
  all:
  - id: metadata/package/name/vocabulary::npm-scope-angular-lookalike
  any:
  - id: micro-behaviors/process/deploy/interpreter-stdin::npm-postinstall-http-node-stdin
  - id: objectives/execution/payload/interpreter-stdin::preinstall-http-pipe-node
