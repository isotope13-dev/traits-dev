defaults:
  crit: exception
  conf: 0.99
  platforms: [unix, windows]

composite_rules:
  - id: known-suspicious-package-contexts
    desc: Recognized package-name heuristic contexts
    any:
      - id: well-known/lib/development/webpack/
      - id: well-known/tool/development/agent/openai-codex/
      - id: well-known/tool/development/agent/anthropic-claude-agent/
      - id: well-known/app/development/remotion/
      - id: metadata/build/minifier::babel-minify-dev-dependency
      - id: well-known/lib/ui/colorjs/
      - id: well-known/app/development/prodex::prodex-crate
      - id: metadata/package/dependencies/name-form::sharp-platform-dependency-name
      - id: metadata/package/dependencies/name-form::swytchcode-platform-dependency-name
      - id: well-known/tool/development/cli/swytchcode::official-swytchcode-cli-package-repository-pair
      - id: well-known/app/ai/coding-agent/damocles::damocles-vscode-extension
      - id: well-known/lib/data/duckdb::official-node-bindings-package-repository-pair
      - id: well-known/lib/data/duckdb::node-bindings-package-name
      - id: well-known/lib/data/duckdb::node-bindings-manifest-name
      - id: well-known/app/ai/coding-agent/anthropic-claude-code::native-npm-package-name
      - id: well-known/lib/cloud/salesforce-js::salesforce-scoped-package-name
      - id: well-known/lib/crypto/btc-vision-ecpair::archive-context
      - id: well-known/app/ai/eve/
