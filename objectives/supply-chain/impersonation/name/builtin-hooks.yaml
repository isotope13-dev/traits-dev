# Engine-emitted `supply-chain/suspicious-name` and `supply-chain/suspicious-package` hooks.
# cleave flags package names that resemble popular packages or internal prefixes
# (for example `vscode-*`). Legitimate VS Code marketplace extensions declare
# `engines.vscode` and normally ship a repository URL — suppress on that context
# instead of hardcoding individual extension names.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: builtin-supply-chain-suspicious-name
    desc: Built-in suspicious package name hook
    crit: notable
    conf: 0.7
    if:
      type: basename
      exact: __cleave_builtin_suspicious_name_hook__
    unless:
      - id: metadata/package/manifest/runtime::vscode-extension
      - id: metadata/package/manifest/repository/

  - id: builtin-supply-chain-suspicious-package
    desc: Built-in suspicious dependency package hook
    crit: notable
    conf: 0.8
    if:
      type: basename
      exact: __cleave_builtin_suspicious_package_hook__
    unless:
      - id: well-known/lib/development/webpack::webpack-package-name
      - id: well-known/lib/development/webpack::webpack-sources-dependency
      - id: well-known/lib/development/webpack::webpack-node-externals-dependency
      - id: well-known/app/development/openai-codex::openai-codex-platform-package
      - id: well-known/app/development/openai-codex::openai-codex-sdk-dependency
      - id: well-known/tool/development/anthropic-claude-agent::claude-agent-sdk-platform-dependency
      - id: well-known/app/development/remotion::remotion-compositor-dependency
      - id: metadata/build/minifier::babel-minify-dev-dependency
      - id: metadata/build/minifier::npm-archive-babel-minify-dev-dependency
