# Engine-emitted `supply-chain/suspicious-name` hook.
# cleave flags package names that resemble popular packages or internal prefixes
# (for example `vscode-*`). Legitimate VS Code marketplace extensions declare
# `engines.vscode` and normally ship a repository URL — suppress on that context
# instead of hardcoding individual extension names.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: builtin-supply-chain-suspicious-name
    desc: Built-in suspicious package name hook
    crit: notable
    conf: 0.7
    if:
      type: basename
      exact: __cleave_builtin_suspicious_name_hook__
    unless:
      - id: metadata/package/manifest/runtime::vscode-extension
      - id: metadata/package/manifest/repository/
