# npm package and dependency names built like a squat: a popular package's
# prefix on an unscoped name, malware vocabulary, or a long run padded with
# digits. Established packages that fit the prefix pattern are excepted;
# official react-native packages fit the patterns by design. Legitimate VS
# Code extensions declare `engines.vscode` and normally ship a repository.
defaults:
  crit: component
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: npm-name-popular-prefix
    desc: Package name borrows a popular package prefix
    conf: 0.7
    if:
      type: value
      path: name
      regex: '^(color|colours|lodash|babel|webpack)-'
      not:
        - regex: '^(babel-(plugin|preset)|eslint-(config|plugin)|webpack-plugin)-'
        - regex: '^color-(convert|name|string)$'
        - exact: lodash-es
        - regex: '^babel-(core|cli|eslint|jest|loader|polyfill|register|runtime)$'
        - exact: babel-tape-runner
        # This is the first-party source-map package shipped in webpack and
        # webpack-compatible bundles, not a package impersonating webpack.
        - exact: webpack-sources
        - regex: '^webpack-(bundle-analyzer|build-notifier|cli|merge)$'
        - regex: '^webpack-(dev-middleware|dev-server|hot-middleware)$'
        - exact: webpack-fix-default-import-plugin
  - id: npm-name-malware-vocabulary
    desc: Package name uses malware vocabulary
    conf: 0.7
    if:
      type: value
      path: name
      regex: '-(malware|stealer|hack)|exfil|backdoor'
  - id: npm-name-digit-padded
    desc: Package name is a long digit-padded run
    conf: 0.7
    if:
      type: value
      path: name
      regex: '^(@[a-z0-9_-]+/)?([a-z_-]*[0-9]){4}[a-z0-9_-]*$'
      length_min: 11
      not:
        - regex: '(25519|1305|4648|8601|1155|2048|4096)\b'
  - id: npm-dependency-popular-prefix
    desc: Dependency name borrows a popular package prefix
    conf: 0.8
    if:
      type: symbol
      kind: import
      regex: '^(color|colours|lodash|babel|webpack)-'
      not:
        - regex: '^(babel-(plugin|preset)|eslint-(config|plugin)|webpack-plugin)-'
        - regex: '^color-(convert|name|string)$'
        - exact: lodash-es
        - regex: '^babel-(core|cli|eslint|jest|loader|polyfill|register|runtime)$'
        - exact: babel-tape-runner
        - exact: webpack-sources
        - regex: '^webpack-(bundle-analyzer|build-notifier|cli|merge)$'
        - regex: '^webpack-(dev-middleware|dev-server|hot-middleware)$'
        - exact: webpack-fix-default-import-plugin
  - id: npm-dependency-malware-vocabulary
    desc: Dependency name uses malware vocabulary
    conf: 0.8
    if:
      type: symbol
      kind: import
      regex: '-(malware|stealer|hack)|exfil|backdoor'
  - id: npm-dependency-digit-padded
    desc: Dependency name is a long digit-padded run
    conf: 0.8
    if:
      type: symbol
      kind: import
      regex: '^(@[a-z0-9_-]+/)?([a-z_-]*[0-9]){4}[a-z0-9_-]*$'
      not:
        - regex: '^.{0,10}$'
        - regex: '(25519|1305|4648|8601|1155|2048|4096)\b'

composite_rules:
  - id: npm-suspicious-package-name
    desc: Package name matches a suspicious naming pattern
    crit: notable
    conf: 0.7
    any:
      - id: npm-name-popular-prefix
      - id: npm-name-malware-vocabulary
      - id: npm-name-digit-padded
    unless:
      - id: metadata/package/runtime::vscode-extension
      - id: metadata/package/repository::has-repository-field
      - id: metadata/package/name/identity::react-native-official-package
  - id: npm-suspicious-dependency-name
    desc: Dependency name imitates a known package
    crit: notable
    conf: 0.8
    any:
      - id: npm-dependency-popular-prefix
      - id: npm-dependency-malware-vocabulary
      - id: npm-dependency-digit-padded
    unless:
      # The name heuristic has several established benign package contexts,
      # including colorjs.
      - id: objectives/supply-chain/impersonation/name::known-suspicious-package-contexts
      # N-API packages list one optional native package per target triple.
      - id: metadata/package/dependencies/name-form::platform-optional-deps
      - id: metadata/package/name/identity::react-native-official-package
