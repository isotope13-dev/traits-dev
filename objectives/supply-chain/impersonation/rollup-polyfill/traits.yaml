# DPRK/Contagious Interview campaign: npm packages that imitate
# rollup-plugin-polyfill-node while publishing sparse, incomplete tarballs.
# The included ES polyfill is largely copied upstream code; package identity
# and artifact shape are the malicious indicators.
defaults:
  platforms: [unix, windows]
  for: [tar]
  attack: T1195.002
  mbc: E1195.002

traits:
- id: rollup-packages-node-polyfills-name
  desc: Archive names Rollup polyfill lookalike
  crit: suspicious
  conf: 0.995
  if:
    type: value
    path: file.basename
    regex: '^rollup-packages-node-polyfills-[^/]+\.tgz$'
- id: rollup-packages-polyfill-core-name
  desc: Archive names Rollup core lookalike
  crit: suspicious
  conf: 0.995
  if:
    type: value
    path: file.basename
    regex: '^rollup-packages-polyfill-core-[^/]+\.tgz$'
- id: rollup-runtime-polyfill-core-name
  desc: Archive names Rollup runtime lookalike
  crit: suspicious
  conf: 0.995
  if:
    type: value
    path: file.basename
    regex: '^rollup-runtime-polyfill-core-[^/]+\.tgz$'
- id: rollup-polyfill-small-archive-size
  desc: Known Rollup lookalike small archive
  crit: suspicious
  conf: 0.99
  size_min: 100000
  size_max: 200000
  if:
    type: value
    path: file.basename
    substr: rollup-packages-node-polyfills-
- id: rollup-polyfill-semver-archive
  desc: Semver Rollup lookalike archive
  crit: suspicious
  conf: 0.98
  if:
    type: value
    path: file.basename
    regex: '^rollup-packages-node-polyfills-[0-9]+\.[0-9]+\.[0-9]+\.tgz$'

composite_rules:
- id: rollup-polyfill-versioned-lookalike
  desc: Versioned Rollup polyfill lookalike archive
  crit: hostile
  conf: 0.995
  all:
  - id: rollup-packages-node-polyfills-name
  - id: rollup-polyfill-semver-archive
- id: rollup-polyfill-lookalike-small-archive
  desc: Known Rollup lookalike small archive
  crit: hostile
  conf: 0.99
  all:
  - id: rollup-packages-node-polyfills-name
  - id: rollup-polyfill-small-archive-size
