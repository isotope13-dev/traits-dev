# A marketplace listing whose displayed name spoofs a Latin brand with
# confusable Cyrillic/Greek letters, shipping code it also conceals.
#
# Either half is survivable on its own: a homoglyph name can be a careless
# copy-paste, and a packed entry point can be an unusual build. Together they
# are a deliberate pair — the listing is engineered to be installed by someone
# looking for a different, trusted extension, and what then runs is not what
# the reviewer read. Keyed on the technique, not on a brand list, so it holds
# for the next "Prеttiеr"/"СhatGPT"/"Docker" lookalike.
defaults:
  platforms: [unix, windows]
  attack: "T1195.002,T1036"
  mbc: B0032

composite_rules:
  - id: homoglyph-listing-conceals-payload
    desc: Homoglyph-named extension conceals its payload
    crit: hostile
    conf: 0.97
    for: [vsix-archive]
    # The name lives in the archive manifest, the loader in an entry script.
    scope: archive
    all:
      - id: objectives/evasion/masquerade/identity/display-name::vsix-display-name-latin-cyrillic-mix
      - id: objectives/supply-chain/hidden-payload/runtime::packaged-blob-byte-cipher-module-exec
