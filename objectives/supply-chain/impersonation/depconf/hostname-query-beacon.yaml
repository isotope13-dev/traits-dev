defaults:
  platforms: [unix, windows]

composite_rules:
  # The declared depconf purpose plus executable host callback distinguishes
  # this probe from ordinary telemetry and inert namespace reservations.
  # Archive scope correlates package context; it does not prove that the hook
  # names the matched member. Do not describe this as verified hook execution,
  # a successful dependency substitution, or evidence of endpoint compromise.
  - id: npm-depconf-hostname-query-beacon
    desc: Dependency-confusion package carries public-IP hostname callback
    crit: hostile
    conf: 0.98
    attack: T1195.002
    for: [npm, tar, package.json, javascript, typescript]
    scope: archive
    all:
      - id: metadata/package/description/disclosure::desc-dependency-confusion
      - id: metadata/package/scripts/entrypoint::node-install-hook-local-script
    any:
      - id: micro-behaviors/communications/http/request/query::node-hostname-base64-get-public-ip-default
      - id: objectives/command-and-control/beacon/network/host-identity::node-hardcoded-ip-host-identity-beacon
      - id: objectives/command-and-control/beacon/network/http::node-encoded-sysinfo-beacon-to-hardcoded-ip
