# Dependency confusion whose setup script removes the package it installs.
#
# An inflated version (9007.0.1, 1000.0.0, 99.0.0) makes the resolver prefer
# the public upload over the private package of the same name. Running
# `pip uninstall` from that same setup script, after its install-time code
# has already executed, erases the installed distribution: the victim's
# environment no longer lists the substituted package, and a follow-up step
# can quietly reinstall the genuine one from the internal index. A real
# release has no reason to win resolution by version inflation and then
# uninstall packages while it is being installed.
#
# Each leg is parsed, not textual: the version is the resolved `version=`
# keyword of the setup() call (a literal or module constant), and the
# uninstall must be the argument of a live os/subprocess execution call, so a
# commented-out command does not satisfy it.
#
# Worked example: genz_translator 9007.0.1, whose PostInstallCommand runs
# `pip3 --verbose uninstall genz_translator -y` and keeps a credentialed
# private-index URL beside commented reinstall and reverse-shell stages.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1070

composite_rules:
  - id: inflated-setup-runs-pip-uninstall
    desc: Inflated-version setup script runs pip uninstall
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/package/version::setup-inflated-major-version
    any:
      - id: micro-behaviors/os/package-manager/management::python-exec-pip-uninstall-call
      - id: micro-behaviors/os/package-manager/management::python-exec-pip-uninstall-literal
