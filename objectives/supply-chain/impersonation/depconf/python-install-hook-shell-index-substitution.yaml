defaults:
  platforms: [unix, windows]
  for: [python, python-sdist, tar, zip]
  attack: T1195.002,T1059.004

traits:
  - id: setup-hook-pip-install-custom-index
    desc: Setup hook installs package from custom index
    crit: suspicious
    conf: 0.98
    for: [python]
    if:
      type: text
      regex: 'os\.system\s*\(\s*["'']pip3?\s+install\s+["'']\s*\+[\s\S]{0,240}--index-url'

  - id: setup-hook-embeds-socket-shell
    desc: Setup hook embeds socket shell source
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: text
      substr: 'socket.socket(socket.AF_INET,socket.SOCK_STREAM)'

  - id: setup-hook-embeds-interactive-shell
    desc: Setup hook embeds interactive shell source
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: text
      substr: 'subprocess.call(["/bin/sh"'

composite_rules:
  - id: python-install-hook-custom-index-shell-replacement
    desc: Install hook fetches shell replacement from custom index
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: setup-hook-pip-install-custom-index
      - id: setup-hook-embeds-socket-shell
      - id: setup-hook-embeds-interactive-shell
