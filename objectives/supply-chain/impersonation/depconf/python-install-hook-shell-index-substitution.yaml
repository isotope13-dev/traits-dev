defaults:
  platforms: [unix, windows]
  for: [python, python-sdist, tar, zip]
  attack: T1195.002,T1059.004

traits:
  - id: setup-hook-pip-install-custom-index
    desc: Calls pip install with custom index
    crit: suspicious
    conf: 0.98
    for: [python]
    if:
      type: tree-sitter
      query: |
        ((call function: (attribute object: (identifier) @os attribute: (identifier) @system)
          arguments: (argument_list (_) @command))
          (#eq? @os "os") (#eq? @system "system")
          (#match? @command "pip3?[[:space:]]+install") (#match? @command "--index-url"))

  - id: setup-hook-embeds-socket-shell
    desc: Write call contains socket shell source
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: tree-sitter
      query: |
        ((call function: (attribute attribute: (identifier) @write)
          arguments: (argument_list (string) @payload))
          (#eq? @write "write") (#match? @payload "socket[.]socket[(]socket[.]AF_INET,[[:space:]]*socket[.]SOCK_STREAM[)]"))

  - id: setup-hook-embeds-interactive-shell
    desc: Write call contains interactive shell source
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: tree-sitter
      query: |
        ((call function: (attribute attribute: (identifier) @write)
          arguments: (argument_list (string) @payload))
          (#eq? @write "write") (#match? @payload "subprocess[.]call") (#match? @payload "/bin/sh"))

  - id: python-init-variable-pip-uninstall
    desc: Runs pip uninstall on named package
    crit: suspicious
    conf: 0.98
    for: [python]
    if:
      type: tree-sitter
      query: |
        ((module
          (expression_statement (assignment left: (identifier) @name right: (string) @package))
          (expression_statement (call function: (attribute object: (identifier) @os attribute: (identifier) @system)
            arguments: (argument_list (binary_operator left: (binary_operator left: (string) @prefix right: (identifier) @name2) right: (string))))))
          (#eq? @os "os") (#eq? @system "system") (#eq? @name @name2)
          (#match? @prefix "pip3?[[:space:]]+(--verbose[[:space:]]+)?uninstall"))

composite_rules:
  - id: python-initializer-named-pip-uninstall
    desc: Python initializer invokes pip uninstall
    crit: suspicious
    conf: 0.98
    scope: file
    for: [python]
    all:
      - id: python-init-variable-pip-uninstall
      - id: metadata/file/size::init-py-file

  - id: python-install-hook-custom-index-shell-replacement
    desc: Install hook replaces package and contains shell code
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: setup-hook-pip-install-custom-index
      - id: setup-hook-embeds-socket-shell
      - id: setup-hook-embeds-interactive-shell

  - id: python-inflated-setup-custom-index-install
    desc: Inflated-version setup has hook and custom-index pip call
    crit: hostile
    conf: 0.95
    scope: file
    for: [python]
    all:
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: metadata/package/version::setup-inflated-major-version
      - id: setup-hook-pip-install-custom-index

  - id: python-inflated-package-import-uninstall
    desc: Inflated package initializer invokes pip uninstall
    crit: hostile
    conf: 0.97
    scope: archive
    for: [python, python-sdist, tar, zip, whl]
    all:
      - id: metadata/package/version::setup-inflated-major-version
      - id: python-initializer-named-pip-uninstall
