defaults:
  platforms: [unix, windows]
  for: [python, pkginfo]
composite_rules:
# Stage-two carrier of a Python dependency-confusion chain: a placeholder
# package whose only code is name/version assignments, and whose setup.py
# pins a dependency with a ceiling at a post-release. That ceiling keeps the
# resolver on a canary build (a post-release name claim) even when a later
# real release exists. The pin, not any payload, is the install-time leg.
# Worked example: pepestyglo 1.0.0 (setup.py install_requires ceiling
# <=1.0.0.post1 on logger-prefix-buffer-lexer, the post-release canary).
- id: python-placeholder-postrelease-ceiling-carrier
  desc: Placeholder Python package pins a post-release dependency ceiling
  crit: hostile
  conf: 0.9
  attack: T1195.002
  for:
  - python-sdist
  - pkginfo
  - python
  - tar
  - zip
  scope: archive
  all:
  - id: metadata/package/dependencies/declaration::install-requires-post-release-ceiling
  - id: metadata/package/placeholder::python-module-name-version-assignments
