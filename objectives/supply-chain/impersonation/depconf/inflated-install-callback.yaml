# Plain-text dependency-confusion install callback.
#
# The release carries an inflated major version (40+) so that a resolver
# preferring the highest version picks it over an organisation's private
# package of the same name. It declares no source repository, its lifecycle
# hook runs a bundled Node script, and that small script reaches a literal
# remote host as soon as it is evaluated. Nothing needs to be sent: the
# request arriving at the operator's server during `npm install` discloses
# which build resolved the public name and from which egress address, and the
# same hook is the code-execution foothold. Legitimate install-time downloads
# (driver/binary fetchers) publish source repositories and follow the real
# product version line.
#
# Unlike concealed-install-beacon.yaml, the destination is written in plain
# sight; the inflated version is what carries the confusion claim here.
#
# Worked example: @mntv-analysis/ui-components 50.1.1 -- `preinstall: node
# index.js`; index.js declares getPublicIPLocation() around https.request to
# a fixed hostname with a baked-in Authorization value and calls it at module
# scope with a constant "8.8.8.8" argument, so the "IP lookup" carries no
# caller input and only the callback itself is the effect.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  attack: T1195.002,T1071.001
  mbc: B0024

composite_rules:
  - id: inflated-repoless-install-hook-load-time-callback
    desc: Inflated install hook calls fixed host
    crit: hostile
    conf: 0.9
    scope: archive
    all:
      - id: metadata/package/versioning/sentinel::npm-version-major-40-plus
      - id: metadata/package/repository::manifest-lacks-repository-metadata
      - id: metadata/package/scripts/entrypoint::node-install-hook-local-script
    any:
      - id: micro-behaviors/communications/http/request/client::small-script-load-call-with-fixed-host-request
      - id: micro-behaviors/communications/http/request/client::module-level-fixed-host-request
    unless:
      - id: metadata/package/publishing::is-private
