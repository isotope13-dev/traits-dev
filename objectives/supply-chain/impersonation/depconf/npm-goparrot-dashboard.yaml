# The reported @goparrot-dashboard releases occupy a public npm scope that
# resembles GoParrot's @goparrot scope. Their published entry modules only log
# the selected package name; the attack is the namespace substitution itself.
defaults:
  platforms: [unix, windows]
  attack: T1195.002

traits:
  - id: goparrot-dashboard-shadow-scope
    desc: npm manifest claims GoParrot-lookalike scope
    crit: hostile
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@goparrot-dashboard/[^/]+$'
