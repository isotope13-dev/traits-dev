# The reported @goparrot-dashboard releases occupy a public npm scope that
# resembles GoParrot's @goparrot scope. Their published entry modules only log
# the selected package name; the attack is the namespace substitution itself.
# The scope is attacker-chosen and disappears on the next republish, so it is
# a notable identity observation that corroborates content-derived evidence
# (hollow depconf PoC, import banner) and never convicts on its own.
defaults:
  platforms: [unix, windows]
  attack: T1195.002

traits:
  - id: goparrot-dashboard-shadow-scope
    desc: npm package name uses GoParrot-lookalike scope
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@goparrot-dashboard/[^/]+$'
