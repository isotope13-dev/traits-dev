# A registry security hold is a provider takedown fact, not a verdict on the
# inert replacement bytes.  When it is correlated with a fetched package that
# declares runtime dependencies, it identifies a delivery chain whose
# dependency was removed for malicious content.  This catches future packages
# using takedown-marked dependencies without naming a particular malware family.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002

composite_rules:
  - id: package-depends-on-security-held-module
    desc: Package depends on registry security-held module
    crit: hostile
    conf: 0.97
    scope: package
    all:
      - id: metadata/registry::registry-security-hold-record
      - id: metadata/package/dependencies::has-runtime-deps
