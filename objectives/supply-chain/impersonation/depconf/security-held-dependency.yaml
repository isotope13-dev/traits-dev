# A registry security hold is a provider takedown fact, not a verdict on the
# inert replacement bytes. Named impersonation composites may use that fact as
# one leg, but the holder coordinate itself stays in metadata/registry.
defaults:
  crit: suspicious
  conf: 0.995
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002

composite_rules:
  # Registry sidecars sit outside the package archive. The current engine
  # requires outer scope to correlate an artifact with its own registry record;
  # this does not establish a dependency relationship or hostile behavior.
  - id: nodemon-clone-security-held-record
    for: [package.json, registry, npm]
    desc: Nodemon clone has security-holder registry record
    scope: outer
    all:
      - id: metadata/registry::registry-security-hold-record
      - id: well-known/tool/development/cli/dev-cli/nodemon::nodemon-variant-claims-official-repository

  - id: ts-node-clone-security-held-record
    for: [package.json, registry, npm]
    desc: ts-node clone has security-holder registry record
    scope: outer
    all:
      - id: metadata/registry::registry-security-hold-record
      - id: well-known/lib/development/ts-node::ts-node-variant-claims-official-repository
