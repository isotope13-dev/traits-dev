# A registry security hold is a provider takedown fact, not a verdict on the
# inert replacement bytes. When a fetched dependency resolves to that record,
# correlate it with the declaring package across the complete scan tree. This
# catches future carriers and transitive dependency chains without naming a
# particular package or malware family.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002

traits:
  - id: npm-http-security-holder-dependency
    desc: npm core-module security-holder dependency
    crit: notable
    conf: 0.99
    if:
      type: value
      path: dependencies.http
      exact: "0.0.1-security"

composite_rules:
  # NOTE (measured 2026-08-29): the header above promises correlation "with the
  # declaring package across the complete scan tree", and no rule here can do
  # that today. Under `--follow`, a fetched dependency is graded as its OWN
  # top-level input: `chai-spycore` declaring the withdrawn `chai-guard` puts
  # `registry-security-withdrawn-package-coordinate` on the
  # `pkg:npm/chai-guard@0.0.1-security` node and leaves the declaring tarball's
  # findings and ML probability bit-identical to a `--follow=none` run. A
  # generic "package declares a withdrawn dependency" composite was tried at
  # `scope: outer` with a leg that provably matches the declaring manifest, and
  # it did not fire — outer pools within one on-disk input, not across fetched
  # ones. The two rules below only look like they cross that boundary: their
  # `scope: package` pairs the FETCHED artifact with its own registry sidecar,
  # so both legs are facts about the fetched package. Closing this needs a
  # scope that spans a declaring artifact and its fetched dependencies, which
  # belongs in cleave, not here.
  - id: nodemon-variant-security-held-dependency
    desc: Nodemon clone uses held dependency
    crit: hostile
    conf: 0.995
    scope: package
    all:
      - id: registry-security-withdrawn-package-coordinate
      - id: well-known/tool/development/dev-cli/nodemon::nodemon-variant-claims-official-repository

  - id: ts-node-variant-security-held-dependency
    desc: ts-node clone uses security-held dependency
    crit: hostile
    conf: 0.995
    scope: package
    all:
      - id: registry-security-withdrawn-package-coordinate
      - id: well-known/lib/development/ts-node::ts-node-variant-claims-official-repository

  - id: registry-security-withdrawn-package-coordinate
    desc: Package coordinate was withdrawn for security
    # The artifact may be an inert npm replacement or the original bytes of a
    # yanked PyPI/crates release. A registry withdrawal is provenance evidence,
    # not hostile behavior in the bytes by itself.
    # Under dependency fetching, Atomscan grades this fetched package on its own
    # and pins the result back to the manifest that declared it. Under `purl`,
    # the same package+sidecar scope flags the requested coordinate directly.
    crit: notable
    conf: 0.995
    scope: package
    unless:
      # npm publishes inert 0.0.1-security holder records for core modules
      # (for example `http`); that compatibility dependency is not a fetched
      # package whose removal indicates a compromised delivery chain.
      - id: npm-http-security-holder-dependency
    any:
      - id: metadata/registry::registry-security-hold-record
      - id: metadata/registry::registry-security-withdrawal-reason
