# A registry security hold is a provider takedown fact, not a verdict on the
# inert replacement bytes. Named impersonation composites may use that fact as
# one leg, but the holder coordinate itself stays in metadata/registry.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002

composite_rules:
  # NOTE (measured 2026-08-29): the header above promises correlation "with the
  # declaring package across the complete scan tree", and no rule here can do
  # that today. Under `--follow`, a fetched dependency is graded as its OWN
  # top-level input: `chai-spycore` declaring the withdrawn `chai-guard` puts
  # the security-hold registry fact on the
  # `pkg:npm/chai-guard@0.0.1-security` node and leaves the declaring tarball's
  # findings and ML probability bit-identical to a `--follow=none` run. A
  # generic "package declares a withdrawn dependency" composite was tried at
  # `scope: outer` with a leg that provably matches the declaring manifest, and
  # it did not fire — outer pools within one on-disk input, not across fetched
  # ones. The two rules below only look like they cross that boundary: their
  # `scope: package` pairs the FETCHED artifact with its own registry sidecar,
  # so both legs are facts about the fetched package. Closing this needs a
  # scope that spans a declaring artifact and its fetched dependencies, which
  # belongs in cleave, not here.
  - id: nodemon-variant-security-held-dependency
    desc: Nodemon clone uses held dependency
    crit: hostile
    conf: 0.995
    scope: package
    all:
      - id: metadata/registry::registry-security-hold-record
      - id: well-known/tool/development/dev-cli/nodemon::nodemon-variant-claims-official-repository

  - id: ts-node-variant-security-held-dependency
    desc: ts-node clone uses security-held dependency
    crit: hostile
    conf: 0.995
    scope: package
    all:
      - id: metadata/registry::registry-security-hold-record
      - id: well-known/lib/development/ts-node::ts-node-variant-claims-official-repository
