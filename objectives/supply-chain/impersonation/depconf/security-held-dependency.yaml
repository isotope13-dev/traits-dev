# A registry security hold is a provider takedown fact, not a verdict on the
# inert replacement bytes.  When it is correlated with a fetched package that
# declares runtime dependencies, it identifies a delivery chain whose
# dependency was removed for malicious content.  This catches future packages
# using takedown-marked dependencies without naming a particular malware family.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002

traits:
  - id: npm-http-security-holder-dependency
    desc: npm core-module security-holder dependency
    crit: notable
    conf: 0.99
    if:
      type: value
      path: dependencies.http
      exact: "0.0.1-security"

composite_rules:
  - id: nodemon-variant-security-held-dependency
    desc: Nodemon clone uses held dependency
    crit: hostile
    conf: 0.995
    scope: package
    all:
      - id: package-depends-on-security-held-module
      - id: well-known/tool/development/nodemon::nodemon-variant-claims-official-repository

  - id: package-depends-on-security-held-module
    desc: Package depends on registry security-held module
    # A dependency can retain a normal semver range after its upstream release
    # is replaced by npm's inert security holder.  The registry fact is useful
    # provenance context, but it does not prove that this package shipped the
    # removed payload; hostile conclusions require the Nodemon identity leg or
    # another independent execution/exfiltration behavior.
    crit: suspicious
    conf: 0.88
    scope: package
    unless:
      # npm publishes inert 0.0.1-security holder records for core modules
      # (for example `http`); that compatibility dependency is not a fetched
      # package whose removal indicates a compromised delivery chain.
      - id: npm-http-security-holder-dependency
    all:
      - id: metadata/registry::registry-security-hold-record
      - id: metadata/package/dependencies/manifest::has-runtime-deps
