defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-module-body-oob-get
    desc: Module body directly requests an OOB collector
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((program
          (lexical_declaration (variable_declarator name: (identifier) @client
            value: (call_expression function: (identifier) @require
              arguments: (arguments (string (string_fragment) @module)))))
          (expression_statement (call_expression function: (member_expression
            object: (call_expression function: (member_expression
              object: (identifier) @used property: (property_identifier) @get)
              arguments: (arguments (string (string_fragment) @url)))
            property: (property_identifier) @on))))
          (#eq? @client @used) (#eq? @require "require")
          (#match? @module "^https?$") (#eq? @get "get") (#eq? @on "on")
          (#match? @url "^https?://[a-zA-Z0-9.-]+[.](oast[.](fun|pro|live|site|online|me)|interactsh[.]com|burpcollaborator[.]net)(/|$)"))
composite_rules:
  - id: published-tiny-node-entry-oob-beacon
    desc: Tiny published entry beacons to OOB collector
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1071.001
    for: [npm, tar, package.json, javascript]
    scope: package
    size_max: 4096
    all:
      - id: node-module-body-oob-get
      - id: metadata/package/entrypoint::npm-publish-root-manifest-with-root-javascript-entry
    any:
      - id: metadata/import/builtin::require-http
      - id: metadata/import/builtin::require-https
    unless:
      - id: metadata/package/publishing::is-private
      - id: metadata/package/description/disclosure::security-poc-placeholder-context
