# setup(dependency_links=[...]) tells easy_install and legacy pip where to
# fetch a dependency. A request-capture service (webhook.site, OAST
# collectors) is not a package host: the link exists to log which machines
# resolve the package and, when honored, to serve them arbitrary code.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1071.001

composite_rules:
  - id: python-dependency-link-to-capture-service
    desc: setup.py resolves a dependency from a request-capture service
    crit: hostile
    conf: 0.95
    near_bytes: 400
    all:
      - id: micro-behaviors/os/package-manager/dependency-setup::python-legacy-dependency-link-url
      - id: micro-behaviors/communications/url/host/oob/endpoint
