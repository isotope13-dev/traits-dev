# Published npm package metadata that substitutes a package-local payload
# path for the registry tarball, with matching `_resolved` metadata. A zero
# digest is additional evidence when present, not required for detection.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json]
  attack: T1195.002
composite_rules:
  - id: npm-package-local-payload-redirect
    desc: Published npm package redirects to local payload
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/publishing::npm-dist-tarball-local-node-modules-payload
      - id: metadata/package/publishing::npm-resolved-local-node-modules-payload
