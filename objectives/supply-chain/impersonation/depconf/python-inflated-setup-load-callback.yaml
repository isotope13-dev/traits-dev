# Python counterpart of inflated-install-callback.yaml.
#
# A setup script that declares an inflated major version (90+) is a
# dependency-confusion squat: a resolver that prefers the highest version picks
# it over an organisation's private release of the same name. When the same
# file defines a function that POSTs JSON to a literal https host and calls that
# function at module scope, the build that resolved the public name reaches the
# operator as soon as setup.py is evaluated, before the package is used.
#
# The three halves live in one setup script, so the composite is file-scoped
# and every leg is local to it. The near_lines bound keeps the module-scope call
# beside the request it reaches. Archive scope cannot be used here: the setup
# script's file-level legs do not join with a PKG-INFO leg in the same archive.
#
# Worked example: sdist depconf-fx 99.99.1 whose setup.py defines ping(), posts
# {"host": "example"} with urllib to a fixed collector URL, calls ping() at module
# scope, and then calls setup(name=..., version="99.99.1").
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1071.001
  mbc: B0024

composite_rules:
  - id: python-setup-inflated-version-import-json-post
    desc: Inflated setup.py posts JSON to a fixed host on load
    crit: hostile
    conf: 0.9
    scope: file
    near_lines: 25
    all:
      - id: metadata/package/version::setup-inflated-major-version
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
      - id: micro-behaviors/communications/http/request/json::urllib-request-json-keyword-body
      - id: micro-behaviors/communications/url/scheme::http-url-literal
