# The dependency-confusion beacon: a package whose entire job is to phone home
# when something imports it.
#
# Before an operator invests in a payload they want to know the confusion works
# at all -- that some build somewhere resolves their public name in place of a
# private one. The cheapest instrument is a module body that calls out to a host
# they control, so the request log tells them which victim pulled it. There is
# no install hook to find, no obfuscation to unpack and no second stage: the
# whole package is the probe, and the shipped code is honest about what it does.
#
# That leaves nothing behavioural to convict on -- a `fetch()` is the most
# ordinary thing a JavaScript file can contain. What is not ordinary is a
# *published package's declared entry point* being nothing but that call. A real
# library's main module defines something; this one is a few dozen bytes that
# run once, at import, and return nothing to the caller. The size bound is doing
# real work here: it is what separates "the module is the beacon" from "a large
# module happens to make a request", which describes most HTTP clients.
#
# Worked example: `@com-delta-idp/core@1.0.0`, whose 77-byte `index.js` is a
# console.log and a fetch to a domain the package has no other relationship
# with; the manifest declares no scripts at all.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1041
  mbc: B0030

composite_rules:
  # Keep the fetch and the package-root path on the same JavaScript member.
  # Archive scope alone can otherwise combine a legitimate nested telemetry
  # helper with an unrelated package manifest elsewhere in a vendored tree.
  - id: tiny-root-module-remote-fetch
    desc: Tiny npm root module fetches external URL
    crit: notable
    conf: 0.93
    scope: file
    all:
      - id: micro-behaviors/communications/http/request/json::tiny-module-external-url-fetch
      - id: metadata/package/manifest/entrypoint::npm-root-javascript-source-member

  - id: package-entry-is-import-time-beacon
    desc: Tiny published root module beacons externally
    crit: hostile
    conf: 0.95
    # The module and the manifest that appoints it as `main` are separate
    # members, so the two halves only meet at package scope.
    scope: archive
    all:
      - id: tiny-root-module-remote-fetch
      # This composite requires the main field and npm-publish-root path to
      # occur on the same manifest. Without that join, a vendored dependency's
      # root main can be pooled with the outer package manifest.
      - id: metadata/package/manifest/entrypoint::npm-publish-root-manifest-with-root-javascript-entry
    unless:
      # Never resolvable by a victim's build.
      - id: metadata/package/manifest/publishing::is-private
