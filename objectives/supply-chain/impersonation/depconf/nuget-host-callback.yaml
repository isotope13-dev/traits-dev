defaults:
  platforms: [windows, unix]
  for: [nupkg, xml]
  attack: T1195.002
composite_rules:
  - id: nuget-dependency-confusion-host-beacon
    desc: Dependency-confusion hook reports build host
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/description/disclosure::nuspec-desc-dependency-confusion
      - id: metadata/build/manifest::nuspec-file
      - id: micro-behaviors/communications/http/download/package::msbuild-precompile-hostname-query
