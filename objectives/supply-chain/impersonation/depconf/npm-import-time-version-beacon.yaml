defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  attack: T1195.002,T1041
  mbc: B0030

traits:
  - id: hardcoded-package-version-callback-url
    desc: Hardcoded package and version callback URL
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'https://[^/\s"'']{3,100}/[^?\s"'']{3,100}\?v=[0-9]+\.[0-9]+\.[0-9]+'

composite_rules:
  - id: node-import-time-package-resolution-probe
    desc: Import-time package/version beacon
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/communications/http/get::module-level-https-get-call
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
      - id: hardcoded-package-version-callback-url
    unless:
      - id: metadata/package/publishing::is-private
