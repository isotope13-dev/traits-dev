# npm packages that impersonate a Microsoft .NET runtime dependency. The
# dependency-name atom is neutral; this composite interprets the unused fake
# runtime chain as a supply-chain impersonation tactic.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, archives]
  attack: T1195.002,T1036.005
  mbc: B0023

composite_rules:
  - id: npm-fake-dotnet-runtime-phantom-dependency
    desc: npm package declares unused fake dotnet runtime dependency
    crit: hostile
    conf: 0.98
    scope: archive
    for: [archives, tar, tgz, npm]
    all:
      - id: metadata/package/dependencies/manifest::npm-dotnet-runtime-base-dependency
      - id: metadata/package/dependencies/manifest::npm-phantom-runtime-dependency
