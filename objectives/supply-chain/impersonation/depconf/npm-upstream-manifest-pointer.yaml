# Dependency-confusion probe that ships the manifest it was mined from.
#
# Automated confusion tooling harvests unclaimed `name`/`bin` keys out of a
# public manifest and republishes them, keeping a breadcrumb of where the name
# came from. `gaarf-node-bq@1.0.0` shipped a 111-byte `source.txt` holding only
#   https://github.com/google/ads-api-report-fetcher/blob/<sha>/js/package.json
# — the Google manifest whose `bin` map declares `gaarf-node-bq`. Installing
# the squat therefore drops a PATH shim under Google's command name and runs a
# postinstall beacon.
#
# The pointer atom is deliberately only a component: a commit-pinned package
# manifest URL can be legitimate provenance on its own. Bounding the carrier
# to a small non-program file keeps ordinary docs — a README that happens to
# link a package.json on GitHub — out of the attack composite.
#
# scope: archive — the pointer file, the manifest hook, and the recon payload
# are three separate entries of the same tarball.
defaults:
  platforms: [unix, windows]
  for: [text, data, json]
  attack: T1195.002

traits:
  - id: upstream-manifest-source-pointer
    desc: Commit-pinned GitHub package-manifest URL
    crit: component
    conf: 0.9
    size_max: 512
    if:
      type: text
      # size_max bounds the uncounted path run and avoids a wide-gap regex.
      regex: 'github\.com/[\w.-]+/[\w.-]+/blob/[0-9a-fA-F]{40}/\S+/package\.json'

composite_rules:
  - id: npm-depconf-probe-manifest-pointer-install-recon
    desc: Install-time recon package ships commit-pinned manifest pointer
    crit: hostile
    conf: 0.96
    mbc: E1041
    for: [archives]
    scope: archive
    all:
      - id: upstream-manifest-source-pointer
      - id: metadata/package/scripts/lifecycle::install-hooks
    any:
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/data/source/syntax/schema::host-system-metric-schema
      - id: micro-behaviors/communications/http/request/client::post-method-text
      - id: objectives/exfiltration/oob/system-profile::python-host-profile-fields
      - id: micro-behaviors/communications/http/request/client::requests-post-json-payload
    needs: 2
