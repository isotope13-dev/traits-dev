# crates.io dependency-confusion squat that reports installs.
#
# A crate published at a sentinel-high major (9x.y.z) is trying to outrank
# every real release of the internal crate whose name it borrows: Cargo picks
# the highest compatible version, so the squat wins resolution. That alone is
# suspicious metadata. It becomes an attack when the same crate carries a
# build script that ships a victim profile to an operator-owned channel,
# because `cargo build`/`cargo install` runs that script with no user action.
#
# scope: archive — the version lives in Cargo.toml, the exfil in build.rs.
defaults:
  platforms: [unix, windows]
  for: [cargo.toml, crate, tar]
  attack: T1195.002
  mbc: E1041

composite_rules:
  - id: cargo-version-squat-build-hook-exfil
    desc: Inflated-version crate exfiltrates from its build script
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/quality/version-sentinel::cargo-version-inflated-major
    # Three refs only: a fourth from the same directory trips the redundant-any
    # check, and a bare directory reference would pull in that leaf's component
    # atoms as if each alone proved exfiltration.
    any:
      - id: objectives/supply-chain/recon-exfil/install-hook::rust-build-telegram-recon-exfil
      - id: objectives/supply-chain/recon-exfil/install-hook::rust-build-git-patch-curl-exfil
      - id: objectives/supply-chain/recon-exfil/install-hook::rust-build-supabase-recon-exfil

  - id: cargo-version-squat-telegram-build-beacon
    desc: Inflated-version crate reports builds through Telegram
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/quality/version-sentinel::cargo-version-inflated-major
      - id: objectives/supply-chain/install-hook/build/behavioral::rust-build-rs-telegram-curl-beacon
