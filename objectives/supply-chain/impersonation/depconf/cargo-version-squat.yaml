# Cargo build-time uploads and declared dependency-confusion callbacks.
# A large version alone neither changes a constrained semver requirement nor
# proves that an internal package name is being impersonated.
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [cargo.toml, crate, tar]
  attack: T1195.002
  mbc: E1041

composite_rules:
  - id: cargo-version-squat-build-hook-exfil
    for: [cargo.toml, crate, tar, rust]
    desc: High-version crate uploads data during build
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/versioning/sentinel::cargo-version-inflated-major
    # Three refs only: a fourth from the same directory trips the redundant-any
    # check, and a bare directory reference would pull in that leaf's component
    # atoms as if each alone proved exfiltration.
    any:
      - id: objectives/supply-chain/recon-exfil/install-hook/build::rust-build-telegram-recon-exfil
      - id: objectives/supply-chain/recon-exfil/install-hook/build::rust-build-git-patch-curl-exfil
      - id: objectives/supply-chain/recon-exfil/install-hook/build::rust-build-supabase-recon-exfil

  - id: cargo-disclosed-depconf-telegram-build-beacon
    for: [cargo.toml, crate, tar, rust]
    desc: Dependency-confusion build contacts Telegram
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/versioning/sentinel::cargo-version-inflated-major
      - id: metadata/package/description/disclosure::cargo-description-dependency-confusion
      - id: micro-behaviors/communications/messaging/send::rust-build-curl-telegram-send-references
      - id: micro-behaviors/communications/messaging/send::rust-curl-telegram-send-request
