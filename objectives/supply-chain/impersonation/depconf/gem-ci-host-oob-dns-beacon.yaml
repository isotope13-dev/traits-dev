defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1195.001,T1071.004
composite_rules:
  # Dependency-confusion probes report where they were installed: the host,
  # the user and whether it is a CI runner, resolved under a request-capture
  # zone so the lookup itself is the report.
  - id: gem-ci-host-identity-oob-dns-beacon
    desc: Ruby code beacons CI host identity to an OOB DNS zone
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/sysinfo/hostname/query::ruby-socket-gethostname
      - id: micro-behaviors/os/env/user-info::ruby-user-identity-env-reference
      - id: micro-behaviors/os/env/read/named::ci-env-reference-set
      - id: micro-behaviors/communications/dns/resolver::ruby-resolv-dns-client
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-dns-capable-endpoint
