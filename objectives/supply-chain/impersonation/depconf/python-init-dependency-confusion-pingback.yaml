defaults:
  platforms: [unix, windows]
  for: [python, pkginfo]
composite_rules:
- id: dependency-confusion-pingback
  for:
  - python-sdist
  - pkginfo
  - python
  scope: archive
  desc: Dependency confusion package with OAST pingback
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/package/versioning/scheme::pkginfo-high-major-version
  - id: metadata/package/description/disclosure::summary-poc-research
  - id: micro-behaviors/communications/http/request/oob::init-network-pingback
  any:
  - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-exception-pass
  - id: micro-behaviors/communications/http/request/client::url-literal
# A package that labels itself a pentest probe and ships a host-identity
# callback to an OOB capture service is a dependency-confusion/registry probe.
# The "authorized" disclaimer does not change what runs on the installer's host.
- id: python-declared-probe-oob-host-identity-callback
  desc: Self-declared pentest probe sends host identity to OOB
  crit: hostile
  conf: 0.97
  attack: T1195.002,T1082
  for: [zip, tar, python-sdist, whl, python, markdown, text]
  scope: archive
  all:
  - id: metadata/package/documentation/security-testing::hash-prefixed-security-testing-text
  - id: objectives/exfiltration/stealer/system-info/identity::python-urllib-oob-host-identity-body
- id: python-depconf-canary-dns-beacon
  desc: Dependency confusion canary package beacons host profile via DNS
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1048.003,T1082
  for: [whl, python-sdist, zip, tar, python, pkginfo]
  scope: archive
  all:
  - id: objectives/exfiltration/dns/lookup::python-identity-label-dns-beacon
  any:
  - id: metadata/package/description/disclosure::summary-depconf-subject
  - id: metadata/package/description/disclosure::pkginfo-security-research-claim
  - id: metadata/package/description/disclosure::desc-poc-research-2
- id: python-depconf-undisclosed-dns-beacon
  desc: Dependency confusion package beacons host identity via DNS
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1048.003,T1082
  for: [whl, python-sdist, zip, tar, python, pkginfo]
  scope: archive
  all:
  - id: objectives/exfiltration/dns/lookup::python-identity-label-dns-beacon
  any:
  - id: metadata/package/description/presence::python-core-metadata-sparse-fields
  - id: metadata/package/name/convention::wheel-dist-name-top-level-mismatch
  - id: metadata/package/versioning/scheme::pkginfo-repeated-nine-version
  - id: metadata/package/description/presence::pkginfo-absent-description
