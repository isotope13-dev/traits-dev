defaults:
  platforms: [unix, windows]
  for: [whl, python-sdist, zip, tar, python, pkginfo]
  attack: T1195.002,T1041

# Dependency-confusion role for the import-time Discord POST. The PKG-INFO
# carries a high major version (the squat that outranks a private release) and
# discusses dependency confusion, while the module that runs on import posts to
# a Discord webhook. The version and description live in PKG-INFO and the POST
# lives in a module, so the join is archive-scoped. Copycats that drop the
# depconf wording are still caught by the file-scoped
# objectives/exfiltration/messaging/webhook::python-import-time-discord-webhook-post.
composite_rules:
  - id: python-depconf-import-time-discord-post
    desc: Depconf squat posts to Discord webhook on import
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/versioning/scheme::pkginfo-high-major-version
      - id: metadata/package/description/disclosure::desc-poc-research-2
      - id: objectives/exfiltration/messaging/webhook::python-import-time-discord-webhook-post
