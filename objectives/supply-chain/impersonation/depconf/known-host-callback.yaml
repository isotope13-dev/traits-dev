# The @newspage dependency-confusion campaign used this host as an
# attacker-controlled callback. OSV MAL-2026-17873 records the indicator and
# the HTTPS GET behavior for affected versions.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1071.001
  for: [javascript]

traits:
  - id: accenture-npm-callback-host
    desc: Reported npm campaign callback host
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(const|let|var)\s+callback\s*=\s*["'']accenture-npm\.azurewebsites\.net["'']'

composite_rules:
  # The host is assigned to `callback`; the same identifier is interpolated
  # into the GET URL. The module-scope call runs when evaluated. The request
  # contains no local data, so this finding claims a callback only.
  - id: npm-accenture-callback-get-on-module-evaluation
    desc: Module GETs to reported npm campaign host
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: accenture-npm-callback-host
      - id: micro-behaviors/communications/http/get::node-https-get-interpolated-callback-url
      - id: micro-behaviors/data/control-flow/module-exec::module-level-imported-method-call

  - id: npm-inflated-shell-main-campaign-callback
    desc: Inflated shell-main package GETs campaign callback
    crit: hostile
    conf: 0.995
    for: [npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/versioning/scheme::npm-major-version-prefix-90-plus
      - id: metadata/package/entrypoint::npm-main-shell-command
      - id: npm-accenture-callback-get-on-module-evaluation
