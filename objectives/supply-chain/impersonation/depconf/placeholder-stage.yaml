# A mutable URL alone cannot convict an internal mirror or name-reservation
# stub. Require the actual external stage's independently hostile behavior.
# Package scope joins evidence within the same enclosing package archive.
# A separately fetched dependency is scanned for its own hostile behavior;
# this rule does not infer that an unseen URL response contains a payload.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  attack: T1195.002,T1105
composite_rules:
  - id: placeholder-url-carrier-hostile-install-stage
    desc: Placeholder URL package has concealed loader
    crit: hostile
    conf: 0.99
    scope: package
    all:
    - id: metadata/package/description/disclosure::description-mentions-placeholder
    - id: metadata/package/dependencies/source::npm-single-unpinned-url-runtime-dependency
    any:
    - id: objectives/supply-chain/install-hook/dropper/obfuscation::npm-install-hook-remote-file-opener-dropper
    - id: objectives/supply-chain/install-hook/dropper/obfuscation::npm-preinstall-hook-remote-file-opener-dropper
  - id: placeholder-url-carrier-credential-theft-stage
    desc: Placeholder URL package includes key theft
    crit: hostile
    conf: 0.99
    scope: package
    all:
    - id: metadata/package/description/disclosure::description-mentions-placeholder
    - id: metadata/package/dependencies/source::npm-single-unpinned-url-runtime-dependency
    any:
    - id: objectives/supply-chain/credential-theft/registry::npm-script-npmrc-token-theft
    - id: objectives/supply-chain/credential-theft/package::npm-hook-prepares-ssh-directory-and-dumps-key
