# Squat dependency corroborated across crate artifacts.
#
# A manifest can name any crate; the lockfile proves which release the
# publisher resolved and source imports prove the crate is actually used.
# One sighting of the proc-macroN digit-squat shape (see the typosquat
# atoms) is suspicious; the shape in TWO independent artifacts means the
# publisher both declared and shipped the squat — the carrier pattern
# behind the trojanized arrayref / append-only-vec / internment releases.
# All legs match the digit-squat shape, not a campaign string, so future
# proc-macroN squats fire unchanged.
defaults:
  platforms: [unix, windows]
  for: [cargo.toml, cargo.lock, rust, crate, tar]
  attack: T1195.002
  mbc: E1195.002

traits:
  - id: cargo-proc-macro-squat-lockfile-pin
    desc: Lockfile pins proc-macroN lookalike
    crit: suspicious
    conf: 0.9
    for: [cargo.lock, crate, tar]
    if:
      type: text
      regex: 'name\s*=\s*"proc-macro([013-9]|2[0-9])"'

composite_rules:
  - id: cargo-squat-crate-dependency
    desc: Squat dep in two crate artifacts
    crit: hostile
    conf: 0.97
    scope: archive
    needs: 2
    any:
      - id: objectives/supply-chain/impersonation/typosquat::cargo-proc-macro-squat-section-header
      - id: objectives/supply-chain/impersonation/typosquat::cargo-proc-macro-squat-inline-dependency
      - id: objectives/supply-chain/impersonation/typosquat::cargo-proc-macro-squat-source-import
      - id: cargo-proc-macro-squat-lockfile-pin
