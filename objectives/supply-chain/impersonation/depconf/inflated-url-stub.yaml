# The versioning move that makes dependency confusion work, paired with an
# off-registry install source.
#
# A confusion squat has to win resolution against whatever the internal package
# is at, so it publishes under a major nobody reaches honestly -- 45.0.0,
# 99.0.0 -- and the resolver takes the highest. On its own an inflated major is
# only odd metadata. What makes it an attack is where the install then goes: a
# single runtime dependency pinned to a plain URL rather than a registry
# coordinate, so every `npm install` pulls whatever that host serves at that
# moment. The registry sees none of those bytes and cannot yank them, and the
# tarball on disk stays innocuous no matter what is delivered.
#
# This lived under install-hook/package/direct-url/, which is for code that
# runs as a side effect of installation. These packages ship no hook at all --
# the delivery is the dependency edge -- so the technique is impersonation by
# name and version, and it belongs here beside the other confusion squats.
#
# A description that admits the package is a placeholder or a resolution PoC is
# corroboration, not exculpation: a package published to *reserve* a name has
# no dependencies to resolve.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002
  mbc: E1195

composite_rules:
  - id: inflated-single-url-dependency
    desc: Inflated version with single URL dependency
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/dependencies/manifest::npm-single-https-runtime-dependency
      - id: metadata/package/quality/version-sentinel::npm-version-major-40-plus
    any:
      - id: objectives/supply-chain/impersonation/manifest/attack-label::placeholder-poc-or-squat-claim
      - id: metadata/package/quality/empty::npm-empty-author
    unless:
      - id: metadata/package/manifest/repository::has-repository-field
    downgrade:
      # A recognized SecurityCtrl reservation is defensive, but its mutable
      # off-registry dependency remains an unusual boundary worth surfacing.
      any:
        - id: well-known/app/security/securityctrl::defensive-placeholder-context

  # The same publication seen from the install side rather than the resolution
  # side, and the reason a defensive reservation is still worth surfacing: the
  # package carries no code, so the only thing installing it does is fetch a URL
  # that names no fixed artifact. Whoever holds that host — today or after it
  # lapses — chooses what every consumer gets, and neither the registry nor the
  # lockfile records it.
  #
  # Deliberately not downgraded by the SecurityCtrl context that softens
  # `inflated-single-url-dependency`: who published it changes the intent, not
  # the exposure.
  - id: placeholder-stub-mutable-url-source
    desc: Placeholder stub installs from a mutable URL
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/package/dependencies/manifest::npm-unpinned-url-runtime-dependency
      - id: metadata/package/manifest/description::description-mentions-placeholder
      - id: metadata/package/quality/version-sentinel::npm-version-major-40-plus

  # Registry-side form of the package.json rule above. An inflated release
  # whose entire runtime is a lone GCS tarball is a dependency-confusion
  # redirect: resolution is won on the registry, while the executable bytes
  # remain mutable and outside registry review or takedown.
  - id: registry-inflated-gcs-dependency-stub
    desc: Inflated registry release redirects to sole GCS dependency
    crit: hostile
    conf: 0.99
    for: [pkginfo, data]
    all:
      - id: objectives/supply-chain/impersonation/registry/snapshot::registry-metadata-json
      - id: objectives/supply-chain/impersonation/registry/snapshot::versioned-inflated-version-raw
      - id: metadata/package/dependencies/direct-url::npm-registry-single-https-runtime-dependency
      - id: metadata/package/dependencies/direct-url::npm-registry-gcs-bucket-dependency
      - id: metadata/package/quality/empty::npm-registry-empty-author
      - id: objectives/supply-chain/impersonation/registry/snapshot::versioned-readme-error
