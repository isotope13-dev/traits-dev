defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002
  mbc: E1195

composite_rules:
  - id: placeholder-stub-mutable-url-source
    desc: Placeholder stub installs from a mutable URL
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/package/dependencies/source::npm-unpinned-url-runtime-dependency
      - id: metadata/package/description/disclosure::description-mentions-placeholder
      - id: metadata/package/versioning/sentinel::npm-version-major-40-plus

  # Registry-side release-shape rule. An inflated release
  # whose entire runtime is a lone GCS tarball is a dependency-confusion
  # redirect: resolution is won on the registry, while the executable bytes
  # remain mutable and outside registry review or takedown.
  - id: registry-inflated-gcs-dependency-stub
    desc: Inflated registry release redirects to sole GCS dependency
    crit: hostile
    conf: 0.99
    for: [pkginfo]
    all:
      - id: objectives/supply-chain/impersonation/registry/snapshot::registry-metadata-json
      - id: objectives/supply-chain/impersonation/registry/snapshot::versioned-inflated-version-raw
      - id: metadata/package/dependencies/direct-url::npm-registry-single-https-runtime-dependency
      - id: metadata/package/dependencies/direct-url::npm-registry-gcs-bucket-dependency
      - id: metadata/package/empty::npm-registry-empty-author
      - id: objectives/supply-chain/impersonation/registry/snapshot::versioned-readme-error

  # Hollow name-reservation squat whose only runtime is a mutable depenconf
  # tarball on GCS — the ltidisafe / Fidelity-style campaign. The empty main
  # module wins resolution; npm install pulls the off-registry payload whose
  # preinstall runs the OAST identity leak.
  - id: hollow-inflated-depconf-gcs-payload-carrier
    desc: Hollow squat redirects via depenconf GCS URL
    crit: hostile
    conf: 0.99
    for: [npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: metadata/lang/source/syntax/assignment::small-commonjs-object-export
      - id: metadata/package/dependencies/source::npm-dependency-confusion-url-label
      - id: metadata/package/dependencies/source::npm-single-https-runtime-dependency
      - id: metadata/package/dependencies/direct-url::dep-bucket-gcs
      - id: metadata/package/versioning/sentinel::npm-version-major-40-plus

  - id: depconf-labeled-gcs-sole-runtime-dependency
    desc: Sole runtime dependency is depenconf GCS tarball
    crit: hostile
    conf: 0.98
    for: [npm, tar, package.json]
    scope: archive
    all:
      - id: metadata/package/dependencies/source::npm-dependency-confusion-url-label
      - id: metadata/package/dependencies/source::npm-single-https-runtime-dependency
      - id: metadata/package/dependencies/direct-url::dep-bucket-gcs

  - id: depconf-gcs-carrier-transitive-preinstall-exfil
    desc: depenconf GCS carrier installs hex OAST preinstall payload
    crit: hostile
    conf: 0.995
    for: [npm, tar, package.json, javascript]
    scope: package
    all:
      - id: metadata/package/dependencies/source::npm-dependency-confusion-url-label
      - id: metadata/package/dependencies/source::npm-single-https-runtime-dependency
      - id: metadata/package/dependencies/direct-url::dep-bucket-gcs
      - id: objectives/exfiltration/stealer/system-info/identity::npm-preinstall-hex-identity-oob-benchmark-exfil

  # Hollow name-reservation squat with inflated version whose only runtime is an
  # off-registry S3 bucket tarball.
  - id: hollow-inflated-s3-payload-carrier
    desc: Hollow squat redirects via S3 bucket tarball URL
    crit: hostile
    conf: 0.99
    for: [npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: metadata/lang/source/syntax/assignment::small-commonjs-object-export
      - id: metadata/package/dependencies/source::npm-single-https-runtime-dependency
      - id: metadata/package/dependencies/direct-url::dep-bucket-s3
      - id: metadata/package/versioning/sentinel::npm-version-major-40-plus
    unless:
      - id: metadata/package/publishing::is-private
      - id: metadata/package/testing/
