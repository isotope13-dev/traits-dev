# Dependency-confusion stage one: the name reservation.
#
# A squat published under a plausible internal namespace cannot carry a payload
# yet — its job is to win version resolution and accumulate installs while it
# still looks harmless. The tells are all in the shape: a sentinel repeated-
# digit version (9.9.9 outranks any real internal 1.x/2.x when a build
# resolves a floating range), a root module that exports nothing, and a
# package identity that only just appeared with no repository or homepage
# behind it. A legitimate reservation stub declares provenance and uses a real
# version; this shape does neither.
#
# Worked example: @user-services/web-components@9.9.9 — 929 bytes unpacked,
# `module.exports = {}` as the whole entry point, "full implementation ships
# in the next release", publisher identity a throwaway.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript, registry]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: hollow-brandnew-package-sentinel-version
    desc: Brand-new hollow package ships a sentinel version
    crit: hostile
    conf: 0.93
    scope: outer
    all:
      - id: metadata/package/versioning/sentinel::npm-version-repeated-digit
      - id: metadata/lang/source/syntax/assignment/member::small-commonjs-object-export
      - id: metadata/registry::brand-new-package
    unless:
      - id: metadata/package/repository::has-repository-evidence
      - id: metadata/package/homepage::has-homepage-field
      - id: well-known/tool/development/aube::aube-package-test-fixture

  # Name holder whose only content is a redirect: it describes itself as a
  # library ("Account utility library") yet ships no code, declares no
  # repository or homepage, and its runtime dependency installs an
  # off-registry tarball. The registry name is the bait; the bytes that run
  # are whatever the remote host serves at install time. An undescribed
  # adapter stub makes no claim it fails to keep and stays notable.
  - id: hollow-name-holder-off-registry-tarball
    desc: Described but codeless package redirects to remote tarball
    crit: hostile
    conf: 0.93
    scope: archive
    all:
      - id: metadata/package/dependencies/source::dep-https-tarball-kv
      - id: metadata/package/description/presence::has-description
    any:
      - id: metadata/lang/source/syntax/assignment/member::commonjs-empty-object-export
      - id: micro-behaviors/data/control-flow/module-exec::js-sole-empty-commonjs-export
      - id: metadata/package/entrypoint/module::npm-archive-ships-no-code-member
    unless:
      - id: metadata/package/repository::has-repository-evidence
      - id: metadata/package/homepage::has-homepage-field
