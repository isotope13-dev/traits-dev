# Python sibling of the npm hollow name holder (hollow-reservation.yaml): the
# published package carries no implementation of its own and its only job is
# to make pip install a dependency resolved from a URL outside the index.
# The registry name is the bait; the code that runs at install time is
# whatever the remote host serves, which a registry scan never sees.
#
# Worked example: hijuko-pilara 1.0.0 — setup.py, a module that only sets
# name/version, a PKG-INFO with no summary, and install_requires pointing at
# `<pkg> @ https://<collector>.workers.dev/pypi/<pkg>.tar.gz`.
defaults:
  platforms: [unix, windows]
  for: [python-sdist, whl, python, pkginfo, pyproject.toml]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: python-hollow-package-direct-url-dependency
    desc: Hollow Python package installs off-index URL dependency
    crit: hostile
    conf: 0.93
    scope: archive
    any:
      - id: metadata/package/dependencies/direct-url::setup-install-requires-pep508-direct-url
      - id: metadata/package/dependencies/direct-url::requires-dist-pep508-direct-url
      - id: metadata/package/dependencies/direct-url::pyproject-pep508-direct-url
    all:
      - id: metadata/package/placeholder::python-module-name-version-assignments
      - id: metadata/package/description/presence::pkginfo-no-summary

