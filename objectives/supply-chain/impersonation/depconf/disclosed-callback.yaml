# A declared dependency-confusion PoC that sends an install-time request to
# a per-sample webhook.site URL lets the operator observe which installer
# resolved the public package name.
defaults:
  platforms: [unix, windows]
  for: [npm, zip, package.json]
  attack: T1195.002,T1041
  mbc: E1041

composite_rules:
  - id: npm-disclosed-depconf-postinstall-webhook-callback
    desc: Dependency-confusion install calls a webhook sink
    crit: hostile
    conf: 0.98
    scope: package
    all:
      - id: metadata/package/description/disclosure::desc-dependency-confusion
      - id: micro-behaviors/communications/http/curl/command::npm-postinstall-curl
      - id: micro-behaviors/communications/url/host/oob/endpoint::postinstall-webhook-site-url
