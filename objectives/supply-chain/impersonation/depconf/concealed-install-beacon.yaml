# Install-time callback whose destination is kept out of plain sight.
#
# The dependency-confusion "proof" shape: a lifecycle hook runs a local Node
# script that makes one outbound request, and the URL it requests is never
# written whole -- the scheme is cut mid-word (`'htt' + 'ps'`, or listed as
# `['htt', 'ps', '://', host]`) and reassembled at runtime. The request may
# carry nothing; its arrival alone tells the operator which build resolved
# the public name. An honest install-time check names its host plainly
# because nobody needs to hide it from the reviewer.
#
# The hook declaration, the HTTP call and the split scheme normally live in
# different files of one package, so the evidence meets at archive scope.
#
# Worked example: config-normalizer-node@1.0.0 (`scripts/install.js` ->
# `lib/beacon.js`, `_0x4a = ['htt','ps','://','my-contolled-backend','/beacon']`).
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, javascript, package.json]
  attack: T1195.002,T1027
  mbc: B0024,B0032

composite_rules:
  - id: node-install-hook-split-scheme-request
    desc: Install hook requests URL with split scheme
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::node-install-hook-local-script
      - id: micro-behaviors/communications/http/request
    any:
      - id: objectives/anti-static/obfuscation/string/fragmentation::listed-http-scheme-split-elements
      - id: micro-behaviors/communications/url/construction/fragment::js-fragmented-url-protocol
      - id: micro-behaviors/communications/url/construction/fragment::split-scheme-separator-fragment
    unless:
      - id: metadata/package/publishing::is-private

  # The same hook paired with obfuscator-style renaming of its own code:
  # `_0x`-named variables or functions in a package whose install step reaches
  # the network. Minifiers emit short alphabetic names; `_0x` names exist to
  # make a reader give up.
  - id: node-install-hook-hex-renamed-network-script
    desc: Install hook ships hex-renamed network code
    crit: hostile
    conf: 0.92
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::node-install-hook-local-script
      - id: micro-behaviors/communications/http/request
    any:
      - id: metadata/lang/source/naming/variable::short-hex-variable-names
      - id: metadata/lang/source/naming/variable::hex-variable-names
      - id: metadata/lang/source/naming/function/name-form::hex-function-names
    unless:
      - id: metadata/package/publishing::is-private
      - id: metadata/archive/layout::archive-at-least-120-members
