defaults:
  platforms: [unix, windows]
  for: [package.json, pkginfo]
composite_rules:
  - id: hollow-npm-install-ip-callback
    desc: Hollow npm release calls a fixed IP on install
    crit: hostile
    conf: 0.97
    for: [npm, tar, package.json]
    scope: archive
    attack: T1195.002,T1071.001
    mbc: B0024
    all:
      - id: micro-behaviors/communications/http/request/package::npm-preinstall-ip-callback
      - id: metadata/package/repository::manifest-lacks-repository-metadata
      - id: metadata/package/entrypoint/module::npm-archive-ships-no-code-member

  - id: depconf-ip-callback
    for: [packagejson]
    desc: Dependency confusion package with IP callback
    crit: hostile
    conf: 0.99
    attack: "T1195.002"
    all:
      - id: micro-behaviors/communications/url/host/port-http::preinstall-ip-port-url
      - id: metadata/package/scripts/reference::npm-preinstall-curl-reference
      - id: metadata/package/versioning/sentinel::npm-version-major-40-plus
