# NuGet dependency confusion: publish to nuget.org under the id of some
# organisation's internal package, at a version no real release can outrank.
#
# NuGet picks the highest version that satisfies a reference, and a great many
# build configurations still list the public feed alongside the private one for
# unscoped ids, so a package at `999.999.1002` wins resolution against every
# genuine release of the name it borrows. Nothing has to be smuggled in for
# that to be an attack: whoever owns the squat now supplies a compile-time
# dependency of the victim's product, and the version they ship next is
# whatever they like.
#
# Suspicious, not hostile, and deliberately silent about the code -- because
# there is no code. The first version of a squat is an empty placeholder type
# in a 4 KB assembly; that emptiness is evidence of the shape, not of a
# payload. A rule that waited for a payload would report nothing until the
# second version, which is exactly too late.
#
# Written against the manifest and the shipped assembly rather than any one
# publisher: the version sentinel, the self-described "internal" purpose, the
# erased repository and the functionless library are each cheap to observe and
# none of them names this sample.
defaults:
  crit: suspicious
  platforms: [windows]
  for: [nupkg, xml, pe]
  attack: T1195.002
  mbc: B0024

traits:
  # The build tree names a bug-bounty program. A PDB path is written by the
  # compiler from wherever the project sat on disk, so it is provenance the
  # publisher rarely thinks to strip: this assembly was compiled inside an
  # output directory named after the organisation whose package id it borrows.
  # A library released for its own sake is not built in a folder named after
  # someone else's disclosure program.
  #
  # Deliberately suspicious rather than hostile. Authorised namespace research
  # leaves exactly this trace, which is why the wording alone cannot convict --
  # the same reason the PyPI `summary-poc-research` traits in this directory
  # stay low. What it does establish is that a human should look.
  - id: bounty-program-build-path
    desc: Build path names a bug-bounty program
    conf: 0.9
    for: [pe]
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(bug[\s_-]*bounty|bugcrowd|hackerone|intigriti|yeswehack)'

composite_rules:
  # The complete shape, correlated across the archive: the sentinel version
  # lives in the nuspec, the placeholder library in lib/<tfm>/.
  - id: nuget-internal-name-version-squat
    desc: Inflated NuGet package squats an internal name
    conf: 0.94
    scope: archive
    all:
      - id: metadata/package/versioning/sentinel::nupkg-version-inflated-major
      - id: metadata/package/files/nuget::nuspec-internal-library-description
      - id: metadata/package/files/nuget::nupkg-single-executable-member
      - id: metadata/binary/layout/size::tiny-dotnet

  # The same squat without the "internal" wording, which an author only has to
  # rephrase. What is left is still not a library: one sentinel-versioned
  # package whose single member is a few-kilobyte unsigned assembly with no
  # repository behind it. A real release at a major above 90 has a history, a
  # signature or a repository URL; this has none of the three.
  - id: nuget-inflated-placeholder-assembly
    desc: Inflated NuGet package ships a placeholder assembly
    conf: 0.92
    scope: archive
    all:
      - id: metadata/package/versioning/sentinel::nupkg-version-inflated-major
      - id: metadata/package/files/nuget::nuspec-repository-without-url
      - id: metadata/binary/layout/size::tiny-dotnet
      - id: metadata/signed/trust-level::unsigned-missing-signature-record

  # Hostile form: the sentinel version wins resolution, the tiny assembly is
  # the placeholder, and the PDB path proves the build ran inside a
  # bug-bounty program directory for someone else's package id. Each leg is
  # weak alone -- high majors, small assemblies and bounty-worded paths each
  # occur honestly -- but no legitimate release combines all three, while a
  # dependency-confusion probe combines them by construction.
  - id: nuget-bounty-program-inflated-squat
    desc: Inflated NuGet squat built in bug-bounty program path
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/versioning/sentinel::nupkg-version-inflated-major
      - id: metadata/binary/layout/size::tiny-dotnet
      - id: bounty-program-build-path
