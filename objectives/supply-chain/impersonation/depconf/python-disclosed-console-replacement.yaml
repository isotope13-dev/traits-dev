defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python]
  attack: T1195.002

composite_rules:
  - id: disclosed-depconf-runtime-replacement
    desc: Disclosed dependency-confusion package installs and replaces itself
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/description/disclosure::desc-poc-research-2
      - id: metadata/build/pip::pip-index-url-option
      - id: micro-behaviors/os/package-manager/dependency-setup::python-runtime-pip-install
      - id: micro-behaviors/process/replace::python-os-execvp-call
