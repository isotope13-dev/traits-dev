defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript, typescript]
  attack: T1195.002,T1041

composite_rules:
  - id: npm-disclosed-local-depconf-host-survey
    desc: Declared dependency-confusion PoC surveys the host without useful exports
    crit: suspicious
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/documentation/disclosure::javascript-depconf-poc-log-banner
      - id: micro-behaviors/os/sysinfo/profile::npm-root-host-survey-empty-exports

  - id: npm-disclosed-depconf-host-profile-beacon
    desc: Declared depconf PoC ships install-profile beacon
    crit: hostile
    conf: 0.99
    scope: package
    all:
      - id: metadata/package/description/disclosure::desc-dependency-confusion
    any:
      - id: objectives/supply-chain/recon-exfil/install-hook/recon::npm-install-oob-object-profile-query
      - id: objectives/exfiltration/stealer/system-info/profile::npm-install-hook-host-profile-post-hardcoded-host
      - id: objectives/supply-chain/install-hook/scripts/host-profile::preinstall-webhook-curl-shell-profile-exfil
      - id: objectives/supply-chain/install-hook/scripts/host-profile::preinstall-depconf-webhook-curl-shell-exfil
