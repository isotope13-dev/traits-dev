defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript, typescript]
  attack: T1195.002,T1041

composite_rules:
  - id: npm-disclosed-depconf-host-profile-beacon
    desc: Declared depconf PoC ships install-profile beacon
    crit: hostile
    conf: 0.99
    scope: package
    all:
      - id: metadata/package/description/disclosure::desc-dependency-confusion
    any:
      - id: objectives/exfiltration/stealer/system-info/host-fingerprint::npm-install-oob-object-profile-query
      - id: objectives/exfiltration/stealer/system-info/profile::npm-install-hook-host-profile-post-hardcoded-host
      - id: objectives/exfiltration/stealer/system-info/host-user::preinstall-webhook-curl-shell-profile-exfil
      - id: objectives/exfiltration/stealer/system-info/host-user::preinstall-depconf-webhook-curl-shell-exfil
      - id: objectives/exfiltration/stealer/system-info/host-fingerprint::npm-preinstall-local-script-profile-get-beacon
      - id: objectives/exfiltration/stealer/system-info/host-fingerprint::npm-postinstall-local-script-profile-get-beacon

  - id: npm-disclosed-depconf-import-survey
    desc: Disclosed depconf PoC performs import-time host survey
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/documentation/disclosure::javascript-depconf-poc-log-banner
      - id: micro-behaviors/os/sysinfo/profile::npm-root-host-survey-empty-exports
      - id: metadata/package/dependencies/presence::npm-no-deps-at-all
