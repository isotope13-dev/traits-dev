defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript, typescript]
  attack: T1195.002,T1041

composite_rules:
  # A hollow npm entrypoint that runs a broad host survey on require is a
  # dependency-confusion probe even when it only prints the results locally.
  # Keep this separate from the network beacon rules below: this sample's
  # observable effect is import-time reconnaissance to stdout, not exfiltration.
  - id: npm-import-host-survey-hollow-entrypoint
    desc: npm package import surveys host then exports no functionality
    crit: hostile
    conf: 0.96
    attack: T1195.002,T1082,T1033
    mbc: E1082
    for: [npm, tar, tgz, package.json, javascript, typescript]
    scope: archive
    all:
      - id: metadata/package/entrypoint::npm-publish-root-manifest-with-root-javascript-entry
      - id: micro-behaviors/data/control-flow/module-exec::module-empty-export
    needs: 4
    any:
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/os/env/user-info::node-user-identity-env-reference
      - id: micro-behaviors/fs/directory/cwd::process-cwd-call
      - id: micro-behaviors/os/sysinfo/platform/runtime::os-platform-call
      - id: micro-behaviors/os/sysinfo/platform/runtime::os-arch-call
      - id: micro-behaviors/os/sysinfo/platform/runtime::process-version-access
    unless:
      - id: metadata/package/publishing::is-private

  - id: npm-disclosed-depconf-host-profile-beacon
    desc: Declared depconf PoC ships install-profile beacon
    crit: hostile
    conf: 0.99
    scope: package
    all:
      - id: metadata/package/description/disclosure::desc-dependency-confusion
    any:
      - id: objectives/supply-chain/recon-exfil/install-hook/recon::npm-install-oob-object-profile-query
      - id: objectives/exfiltration/stealer/system-info/profile::npm-install-hook-host-profile-post-hardcoded-host
      - id: objectives/supply-chain/install-hook/scripts/host-profile::preinstall-webhook-curl-shell-profile-exfil
      - id: objectives/supply-chain/install-hook/scripts/host-profile::preinstall-depconf-webhook-curl-shell-exfil
