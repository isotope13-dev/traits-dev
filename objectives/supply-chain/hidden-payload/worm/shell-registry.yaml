# Shell package worms mutate install hooks and publish using local credentials.
# No campaign names, payload basenames, or attacker endpoints are required.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1195.002
traits:
  - id: shell-remote-install-hook-injection
    desc: Remote command precedes npm hook mutation
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?s)="curl [^\n"]{1,100}\| (node|bash|sh)"\s{1,40}npm pkg set scripts\.preinstall='
  - id: shell-npm-credential-config-fanout
    desc: Publishes using a loop over npmrc credentials
    crit: suspicious
    conf: 0.98
    attack: T1552.001
    if:
      type: text
      regex: '(?s)for NPM_CONFIG_USERCONFIG in [^\n]{1,180}/\.npmrc.{0,100}npm publish\b'
  - id: shell-aur-remote-install-injection
    desc: Appends remote execution to install script
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?s)install="\$pkgname\.install".{0,160}echo "bash <\(curl [^\n]{1,100}>> "\$install"'
composite_rules:
  - id: npm-credential-fanout-hook-propagation
    desc: Publishes injected hook through multiple npm credentials
    crit: hostile
    conf: 0.99
    near_lines: 40
    all:
      - id: shell-remote-install-hook-injection
      - id: shell-npm-credential-config-fanout
      - id: micro-behaviors/os/package-manager/publish::npm-publish-command
  - id: aur-install-script-poisoning-push
    desc: Pushes AUR install script remote execution injection
    crit: hostile
    conf: 0.98
    near_lines: 35
    all:
      - id: shell-aur-remote-install-injection
      - id: micro-behaviors/process/create/vcs/git::shell-git-push
