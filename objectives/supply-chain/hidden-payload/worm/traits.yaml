defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  mbc: F0001
traits:
# A bare `npm owner add` string is the npm CLI's own ownership verb — npm's
# test suite exercises it, and docs quote it. Standalone that is notable CLI
# usage; the worm composites below supply the hostile pairing (whoami,
# profile URL, postinstall removal).
- id: npm-owner-add-exec
  desc: References npm owner add command
  crit: notable
  attack: T1098
  if:
    type: string_literal
    regex: npm\s+owner\s+add
  unless:
    - id: metadata/package/testing/presence/harness/
    - id: metadata/package/testing/harness/runtime/
# `npm-whoami-exec` and `npm-token-whoami-validation` moved to
# micro-behaviors/os/package-manager/identity as one trait,
# `npm-whoami-command`. Two matchers for one command meant every release script
# was reported twice from a worm directory for making the login check npm
# documents. The composites below reference the relocated atom and still supply
# the owner-add, force-publish and workflow-write legs that carry worm intent.
- id: npm-profile-url
  desc: NPM user profile URL pattern
  crit: notable
  attack: T1098
  if:
    type: string_literal
    substr: npmjs.org/~
- id: remove-postinstall
  desc: Removes postinstall script
  crit: notable
  attack: T1098
  if:
    type: string_literal
    regex: delete\s+\w+\.scripts\.postinstall
- id: npm-maintainer-search-api
  desc: Queries npm maintainer package search
  crit: suspicious
  conf: 0.94
  attack: T1195.002
  if:
    type: text
    regex: '(registry\.npmjs\.org)?/v1/search\?text=maintainer:'
- id: npm-force-publish-token
  desc: Force publishes packages with token
  crit: suspicious
  conf: 0.96
  attack: T1195.002
  if:
    type: text
    regex: 'npm\s+publish.{0,80}--access\s+public.{0,80}--token\s+\$?\{?\w+'
- id: npm-publish-token-option
  desc: Publishes npm package with token
  crit: suspicious
  conf: 0.94
  attack: T1195.002
  if:
    type: text
    regex: 'npm\s+publish[\s\S]{0,160}--token\s+\$?\{?\w+'
- id: npm-version-patch-force
  desc: Forces npm package patch version
  crit: notable
  conf: 0.9
  attack: T1195.002
  if:
    type: text
    regex: 'npm\s+version\s+patch\s+--force'
- id: delete-private-field
  desc: Deletes private package field
  crit: notable
  conf: 0.85
  attack: T1195.002
  if:
    type: text
    regex: delete\s+\w+\.private
  not:
  - substr: "delete e.private"
  - substr: "delete connection.private"
  - substr: "delete error.private"
  unless:
  - id: well-known/tool/packaging/yarn::yarn-cli-bundle-marker
- id: node-bundle-postinstall
  desc: package postinstall executes bundle.js
  crit: suspicious
  conf: 0.95
  for: [package.json]
  if:
    type: text
    regex: '"post[Ii]nstall"\s*:\s*"node\s+bundle\.js"'
- id: workflow-staged-config-run
  desc: Workflow run passes inline config64 flag
  crit: notable
  conf: 0.94
  for: [javascript, python, github-actions, binaries]
  if:
    type: text
    regex: 'run:[^\n]{0,120}--config64'
# A run step executing a repository-relative binary staged under a
# <platform>-<arch> directory: the payload-matrix layout the worm commits
# alongside the workflow so the checkout itself arms the next run. Benign
# CI executes build outputs it just built or a wrapper at the repo root;
# running a checked-out os-arch matrix binary is the staged-payload shape.
- id: workflow-run-arch-matrix-binary
  desc: Workflow run executes os-arch staged binary
  crit: notable
  conf: 0.9
  for: [javascript, python, github-actions, binaries]
  if:
    type: text
    regex: 'run:[^\n]{0,80}\./[^"\s]{0,80}-(amd64|arm64|x86_64)/'
# A run step whose argument is a long base64 value that decodes to JSON
# ("eyJ" is base64 for '{'): the inline config blob the staged binary
# receives. Structure-derived, so it survives the binary, flag, and task
# names being renamed in the next variant.
- id: workflow-run-json-base64-argument
  desc: Workflow run passes base64 JSON argument
  crit: notable
  conf: 0.9
  for: [javascript, python, github-actions, binaries]
  if:
    type: text
    regex: 'run:[^\n]{0,120}eyJ[A-Za-z0-9+/]{32,}={0,2}'
composite_rules:
- id: npm-package-worm
  desc: NPM package worm (adds owner to packages)
  crit: hostile
  all:
  - id: npm-owner-add-exec
  - id: micro-behaviors/os/package-manager/identity::npm-whoami-command
  any:
  - id: npm-profile-url
  - id: remove-postinstall
- id: npm-package-spam
  desc: Modifies and mass-publishes npm packages
  crit: hostile
  conf: 0.95
  attack: T1195.002
  all:
  - id: micro-behaviors/os/package-manager/publish::npm-publish-command
  - id: micro-behaviors/process/create/shell/bridge::js-exec
  any:
  - id: delete-private-field
  - id: npm-owner-add-exec
  - id: remove-postinstall
- id: npm-maintainer-package-worm
  desc: Republish worm targets maintainer packages
  crit: hostile
  conf: 0.96
  attack: T1195.002
  all:
  - id: npm-maintainer-search-api
  - id: npm-force-publish-token
  any:
  - id: npm-version-patch-force
  - id: micro-behaviors/os/package-manager/publish::npm-publish-command
  - id: npm-publish-token-option

# Some CI worms bypass the npm CLI entirely: after scraping the runner for
# credentials, they enumerate every package owned by the compromised
# maintainer, exchange the workflow OIDC credential for package-scoped publish
# access, and PUT the infected artifact directly to the registry.  Pairing the
# registry mechanics with an actual credential collector keeps legitimate
# monorepo release automation out while covering non-shell implementations.
- id: npm-maintainer-oidc-publish-worm
  desc: Stolen CI credentials drive OIDC npm package propagation
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1003.007,T1552.001
  all:
  - id: npm-maintainer-search-api
  - id: objectives/supply-chain/credential-theft/registry::github-oidc-npm-publish
  any:
  - id: objectives/credential-access/dump/process::github-runner-process-memory-secret-dump
  - id: objectives/credential-access/cloud/secret-inventory::detached-cloud-ci-credential-collector
- id: npm-token-package-infection-worm
  desc: NPM token package infection worm
  crit: hostile
  conf: 0.97
  attack: T1195.002
  all:
  - id: micro-behaviors/os/package-manager/identity::npm-whoami-command
  - id: npm-publish-token-option
  any:
  - id: npm-version-patch-force
  - id: objectives/credential-access/env/secrets/file::npm-auth-token-extraction
  - id: micro-behaviors/os/env/package-manager::npm-token-env-read
- id: npm-token-npmrc-publish-worm
  desc: NPM token writes npmrc then publishes package
  crit: hostile
  conf: 0.97
  attack: T1195.002
  all:
  - id: micro-behaviors/os/package-manager/publish::npm-publish-command
  - id: micro-behaviors/os/env/package-manager::npm-token-env-read
  any:
  - id: micro-behaviors/fs/write/credential::js-sensitive-path-write
  - id: micro-behaviors/os/package-manager/config::npmrc-registry-authtoken-line
  - id: micro-behaviors/fs/path/secret-config::npmrc-credentials
  needs: 2
  unless:
  - id: objectives/credential-access/env/secrets/npm-registry::npm-publish-auth-bootstrap
- id: npm-bundle-postinstall-workflow-worm
  desc: NPM postinstall writes workflow worm
  crit: hostile
  conf: 0.99
  # node-bundle-postinstall matches the postinstall value inside package.json
  # itself (for: [package.json]); the any: legs are javascript-side behavior.
  # They land on different archive members of the published npm package, so
  # this needs the container type and archive scope, like
  # install-hook-charcode-concealed-dns-loader and
  # typescript-hidden-window-xor-loader above do for the same pairing.
  for: [javascript, typescript, npm, package.json]
  scope: archive
  all:
  - id: node-bundle-postinstall
  any:
  - id: micro-behaviors/communications/http/services/github::github-workflow-file-write-api
  - id: micro-behaviors/os/package-manager/identity::npm-whoami-command
  - id: micro-behaviors/communications/http/services/github::github-create-repo-api
  - id: objectives/credential-access/api-harvest/token::trufflehog-filesystem-root-scan
  needs: 2
- id: js-workflow-credential-worm
  desc: JavaScript writes credential workflow worm
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/services/github::github-workflow-file-write-api
  any:
  - id: micro-behaviors/os/package-manager/identity::npm-whoami-command
  - id: micro-behaviors/communications/http/services/github::github-create-repo-api
  - id: objectives/credential-access/api-harvest/token::trufflehog-filesystem-root-scan
  - id: micro-behaviors/os/env/package-manager::npm-token-env-read
  needs: 2
# sckit's worm loop in one file: registry credentials harvested from disk
# (.npmrc holds the publish tokens) while the package force-publishes with
# a token. Release tooling publishes *or* reads credentials; doing both --
# stealing the auth it then spends on republication -- is self-propagation.
- id: npm-credential-harvest-force-republish-worm
  desc: Harvests npm credentials and force-republishes packages
  crit: hostile
  conf: 0.96
  attack: T1195.002,T1552.001
  near_bytes: 4000
  all:
  - id: npm-force-publish-token
  - id: objectives/credential-access/env/secrets/npm-registry::npmrc-access
# The worm ships a push-triggered workflow template so any repository it
# reaches re-executes the staged binary on the next push. Push triggers and
# checkout steps are ordinary CI shape, so the run step invoking a staged
# binary with an inline config is the leg that carries worm intent. Matched
# as text so the template fires whether it sits in a real workflow file or
# embedded in a dropper binary -- which needs the binary types listed: the
# sckit implant carries this template as a Go format string in every build.
- id: push-triggered-staged-worm-workflow
  desc: Push-triggered workflow runs staged binary with config
  crit: hostile
  conf: 0.96
  attack: T1195.002
  for: [javascript, python, github-actions, binaries]
  near_bytes: 800
  all:
  - id: metadata/build/ci/trigger::workflow-push-trigger
  - id: metadata/build/ci/step::actions-checkout-step
  - id: workflow-staged-config-run
  any:
  - id: workflow-run-arch-matrix-binary
  - id: workflow-run-json-base64-argument
# Rename-resistant twin of the composite above: the workflow does not carry
# the campaign's config64 flag, but still checks out and runs a binary from
# a committed os-arch payload matrix while handing it an inline base64
# JSON config. Two independent run-step shapes must agree, so a push
# workflow that merely executes a checked-in helper (one shape) stays out.
- id: push-workflow-staged-payload-rerun
  desc: Push workflow reruns staged platform binary with encoded config
  crit: hostile
  conf: 0.95
  attack: T1195.002
  for: [javascript, python, github-actions, binaries]
  near_bytes: 800
  all:
  - id: metadata/build/ci/trigger::workflow-push-trigger
  - id: metadata/build/ci/step::actions-checkout-step
  any:
  - id: workflow-staged-config-run
  - id: workflow-run-arch-matrix-binary
  - id: workflow-run-json-base64-argument
  needs: 2
