# The generator assembles gems that carry a documentation-builder preload hook
# and pushes them itself: each upload makes the registry's tooling run the
# embedded worker, so the package carries its own trigger out.
defaults:
  for: [ruby]
  platforms: [unix, windows]

composite_rules:
  - id: ruby-doc-hook-gem-generator-publish
    desc: Publishes generated doc-hook gems
    crit: hostile
    conf: 0.96
    attack: T1195.002,T1059.006
    all:
      - id: objectives/execution/trigger/package/build::gem-builder-writes-doc-preload-hook
      - id: micro-behaviors/os/package-manager/publish::rubygems-direct-api-publish
