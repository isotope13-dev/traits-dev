# Registry and repository propagation from a compromised package publisher.
# The individual calls are ordinary tooling capabilities; the composites
# require the permission gate, writable-package enumeration, manifest hook
# injection, version churn, or cross-branch autorun injection that make this
# a self-propagating supply-chain payload.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, shell]
  attack: T1195.002
  mbc: B0024

traits:
  - id: package-publish-permission-check
    desc: Checks package publishing permission
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(can[_-]?publish|publish[_-]?permission)\b'

  - id: writable-package-enumeration
    desc: Enumerates writable packages
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(enumerate|list|discover)[A-Za-z0-9_]*(writable|writeable)[A-Za-z0-9_]*packages?\b'

  - id: package-tarball-download
    desc: Downloads package tarball
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(download|fetch|retrieve)[A-Za-z0-9_]*tarball\b'

  - id: js-package-manifest-hook-rewrite
    desc: Rewrites JavaScript package install hook
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)\bpackageJson\b.{0,160}\bscripts\b.{0,120}\bpreinstall\b'

  - id: python-package-manifest-hook-rewrite
    desc: Rewrites Python package install hook
    crit: suspicious
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '(?is)\b(package_json|manifest)\b.{0,160}\b(preinstall|postinstall)\b'

  - id: package-patch-version-increment
    desc: Increments package version
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(increment|bump)[A-Za-z0-9_]*version\b'
    unless:
      - id: well-known/app/process_bot::process-bot-rubygems-release-context

  - id: repacked-package-publication
    desc: Publishes a repacked package tarball
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(publish|republish)[A-Za-z0-9_]*(repacked|modified|tarball)\b'

  - id: developer-agent-config-path-cluster
    desc: Multiple editor and agent autorun paths
    crit: suspicious
    conf: 0.95
    count_min: 3
    if:
      type: text
      regex: '(?i)\.(claude|vscode)[/\\](settings\.json|tasks\.json|setup\.(m?js|cjs))'
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/app/cline/

  - id: repository-branch-update-call
    desc: Updates repository branches programmatically
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)update[A-Za-z0-9_]*branches?'

  - id: repository-object-update-call
    desc: Updates repository objects programmatically
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)update[A-Za-z0-9_]*repositories?'

composite_rules:
  - id: npm-package-propagation-worm
    desc: Repacks and republishes writable packages with an install hook
    crit: hostile
    conf: 0.98
    all:
      - id: package-publish-permission-check
      - id: writable-package-enumeration
      - id: package-manifest-lifecycle-rewrite
      - id: package-patch-version-increment
      - id: repacked-package-publication
    any:
      - id: package-tarball-download
      - id: micro-behaviors/os/package-manager/publish::npm-publish-command

  - id: package-manifest-lifecycle-rewrite
    desc: Rewrites package lifecycle scripts
    crit: suspicious
    conf: 0.95
    any:
      - id: js-package-manifest-hook-rewrite
      - id: python-package-manifest-hook-rewrite

  - id: cross-tool-agent-config-repository-persistence
    desc: Injects editor-agent autorun files across branches
    crit: hostile
    conf: 0.98
    attack: T1546
    all:
      - id: developer-agent-config-path-cluster
    any:
      - id: repository-branch-update-call
      - id: repository-object-update-call
