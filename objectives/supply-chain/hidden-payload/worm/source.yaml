# Registry and repository propagation from a compromised package publisher.
# The individual calls are ordinary tooling capabilities; the composites
# require the permission gate, writable-package enumeration, manifest hook
# injection, version churn, or cross-branch autorun injection that make this
# a self-propagating supply-chain payload.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, shell]
  attack: T1195.002
  mbc: B0024

traits:
  - id: install-hook-self-targeting-worm-env
    desc: Hook exports package self-identity env
    # `WORKFLOW_ID=... REPO_ID_SUFFIX=<owner/repo> TARGET_PACKAGES=<pkg> node|bun x.js`
    # in a lifecycle script: the hook hands the payload the package's own repo
    # slug, target package name, and the release workflow to abuse. That is the
    # self-propagation configuration of a package-republishing worm (Shai-Hulud
    # / TeamPCP wave), not build configuration — a maintained package never
    # feeds its own coordinates to an install-time script this way. The matcher
    # keys on the env-var names, so a renamed loader script on the next wave
    # still lands here.
    crit: suspicious
    conf: 0.95
    for: [package.json, manifests, pkginfo, javascript, typescript, shell]
    mbc: F0001
    if:
      type: text
      regex: '(?s)REPO_ID_SUFFIX=.{0,200}TARGET_PACKAGES=|TARGET_PACKAGES=.{0,200}REPO_ID_SUFFIX='
  - id: writable-package-enumeration
    desc: Enumerates writable packages
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(enumerate|list|discover)[A-Za-z0-9_]*(writable|writeable)[A-Za-z0-9_]*packages?\b'

  - id: js-package-manifest-hook-rewrite
    desc: Rewrites JavaScript package install hook
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)\bpackageJson\b.{0,48}\bscripts\b.{0,24}(\.|\[[''\"]?)(pre|post)install([''\"]?\])?\s*='

  - id: python-package-manifest-hook-rewrite
    desc: Assigns Python package install hook
    crit: suspicious
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '(?i)\b(package_json|manifest)\b.{0,80}\b(preinstall|postinstall)\b.{0,12}='
    unless:
      - id: metadata/package/testing/

  # package-patch-version-increment moved to
  # micro-behaviors/os/package-manager/publish::package-manifest-version-bump.
  # The matcher reads release tooling -- "bump the version in package.json" is
  # what every release script, gulpfile and Electron builder says, so on its own
  # it is a publish-workflow capability, not worm intent. It still carries the
  # self-republication composites below, where the version bump is paired with
  # repacking and an actual publish call.

  - id: publish-repacked-package-call
    desc: publishRepacked-style package publication call
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bpublish(Repacked|Modified|Tarball)\b'

  - id: republish-repacked-package-call
    desc: republishRepacked-style package publication call
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)\brepublish(Repacked|Modified|Tarball)\b'

  # The path must be a string literal the code can actually open. Unquoted,
  # this counted prose: an agent SDK whose JSDoc says "set ACE_ORG_ID in
  # .claude/settings.json" three times reached count_min purely from comments,
  # while the function documented that it deliberately does NOT read that file.
  # Repeating one path in docs is not a cluster of autorun targets.
  - id: repository-branch-update-call
    desc: Updates repository branches programmatically
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)update[A-Za-z0-9_]*branches?'

  - id: repository-object-update-call
    desc: Updates repository objects programmatically
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)update[A-Za-z0-9_]*repositories?'

composite_rules:
  - id: git-history-rewrite-repository-propagation
    desc: Stages content before a falsified force-push
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1070.003
    for: [batch]
    scope: file
    all:
      - id: micro-behaviors/process/create/vcs/git::git-stage-all-changes
      - id: objectives/evasion/indicator-removal/history::git-history-falsification

  - id: repacked-package-publication
    desc: Publishes a repacked package tarball
    crit: suspicious
    conf: 0.95
    any:
      - id: publish-repacked-package-call
      - id: republish-repacked-package-call
  - id: npm-package-propagation-worm
    desc: Repacks and republishes writable packages with an install hook
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/package-manager/publish::publish-permission-flag
      - id: writable-package-enumeration
      - id: package-manifest-lifecycle-rewrite
      - id: micro-behaviors/os/package-manager/publish::package-manifest-version-bump
      - id: micro-behaviors/os/package-manager/publish::npm-publish-command
    any:
      - id: micro-behaviors/communications/http/download/package::package-tarball-download-call
      - id: repacked-package-publication

  - id: package-manifest-lifecycle-rewrite
    desc: Rewrites package lifecycle scripts
    crit: suspicious
    conf: 0.95
    any:
      - id: js-package-manifest-hook-rewrite
      - id: python-package-manifest-hook-rewrite

  - id: cross-tool-agent-config-repository-persistence
    desc: Injects editor-agent autorun files across branches
    crit: hostile
    conf: 0.98
    attack: T1546
    all:
      - id: micro-behaviors/fs/path/application/config::editor-agent-config-path-cluster
    any:
      - id: repository-branch-update-call
      - id: repository-object-update-call

  # Only the two GitHub write flows prove "writes repository contents"; each
  # already pairs the contents/GraphQL endpoint with the PUT that carries the
  # body. The bare `http-fetch-put-request` / `javascript-put-request-body` legs
  # that used to sit here proved nothing but "a PUT exists", so in a minified
  # megabundle any `api.github.com` string that happened to land within 512
  # bytes of an unrelated SDK's PUT descriptor satisfied the rule.
  - id: github-agent-config-write-call
    desc: GitHub API writes repository contents
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/services/github::github-api-host
    any:
      - id: micro-behaviors/communications/http/services/github::github-graphql-create-commit
      - id: micro-behaviors/communications/http/services/github::github-contents-api-write-flow
    near_bytes: 512

  - id: github-agent-config-injection
    desc: GitHub API writes repository agent or IDE autorun config
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1546
    all:
      - id: github-agent-config-write-call
    any:
      - id: objectives/supply-chain/trojanized/app/debug-probe::claude-mcp-config
      - id: micro-behaviors/fs/path/application/config::vscode-project-tasks-path
