# A published npm wrapper can conceal a second product in a nested archive.
# The credential fact is intentionally narrow: this is not a claim that every
# SSH client is malicious, but that a hollow public package republishes source
# containing a complete hardcoded service credential record.
defaults:
  platforms: [unix, windows]
  for: [npm]
  attack: T1195.002,T1552.001

composite_rules:
  - id: hollow-npm-package-with-credentialed-source
    for: [npm, package.json, javascript]
    desc: Hollow npm package republishes source with service credentials
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: metadata/package/scaffold::npm-default-index-sparse-manifest
      - id: metadata/package/files/nested::archive-nested-source-tree
      - id: micro-behaviors/data/serialize/schema-credential::hardcoded-service-credential-object
    any:
      - id: micro-behaviors/crypto/key/representation::embedded-openssh-private-key
      - id: micro-behaviors/fs/path/private-key::ssh-private-key
      - id: micro-behaviors/communications/ssh/client::ssh2-js
