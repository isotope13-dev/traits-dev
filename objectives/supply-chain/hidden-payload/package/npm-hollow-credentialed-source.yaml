# A published npm wrapper can conceal a second product in a nested archive.
# The credential fact is intentionally narrow: this is not a claim that every
# SSH client is malicious, but that a hollow public package republishes source
# containing a complete hardcoded service credential record.
defaults:
  platforms: [unix, windows]
  for: [npm]
  attack: T1195.002,T1552.001

composite_rules:
  - id: package-archive-embeds-openssh-private-key
    desc: Package archive embeds OpenSSH private-key material
    crit: suspicious
    conf: 0.96
    scope: archive
    for: [binaries, '!dex', scripts, '!jcl', npm, tar, zip]
    all:
      - id: micro-behaviors/crypto/asymmetric/key::embedded-openssh-private-key
    downgrade:
      any:
        - id: metadata/package/testing/presence/harness::test-directory-path
        - id: metadata/package/testing/presence/harness::test-directory

  - id: binary-embeds-openssh-private-key
    desc: Binary embeds OpenSSH private-key material
    crit: suspicious
    conf: 0.96
    for: [binaries]
    all:
      - id: micro-behaviors/crypto/asymmetric/key::embedded-openssh-private-key
    downgrade:
      any:
        - id: metadata/package/testing/presence/harness::test-directory-path
        - id: metadata/package/testing/presence/harness::test-directory

  - id: hollow-npm-package-with-credentialed-source
    for: [npm, package.json, javascript]
    desc: Hollow npm package republishes source with service credentials
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: objectives/supply-chain/impersonation/manifest/placeholder::mature-hollow-index-package
      - id: metadata/package/files/nested::archive-nested-source-tree
      - id: micro-behaviors/data/source/syntax/credential::hardcoded-service-credential-object
    any:
      - id: micro-behaviors/crypto/asymmetric/key::embedded-openssh-private-key
      - id: objectives/credential-access/ssh/key::private-key-path-rsa
      - id: micro-behaviors/communications/ssh/client::ssh2-js
