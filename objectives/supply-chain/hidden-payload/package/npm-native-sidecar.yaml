# Cross-member npm packaging pattern: a JavaScript distribution entry launches
# a native executable that the package presents as an inert data asset.
# Scope is the nearest archive so an unrelated loader and binary elsewhere on
# disk cannot satisfy the rule together.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, package.json, archives]
  attack: "T1195.002,T1036,T1059.007"
  mbc: "B0032,F0004"

composite_rules:
  # Native addons are normal in npm. Credential-store targeting is not. Two
  # unrelated store indicators keep a single diagnostic/help string from
  # turning an otherwise legitimate native package into a hostile finding.
  - id: npm-native-binary-credential-targeting
    desc: npm native binary targets multiple credential stores
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/manifest/entrypoint::pkg-module-field
      - id: metadata/file/format/native-executable::native-executable-image
    any:
      - id: micro-behaviors/fs/path/sensitive/browser::login-data
      - id: micro-behaviors/fs/path/sensitive/browser::browser-cookies-file-path
      - id: objectives/credential-access/browser/multi-target::native-firefox-logins-path
      - id: objectives/credential-access/browser/multi-target::native-firefox-key4-path
      - id: micro-behaviors/fs/path/sensitive/credential-filenames::pgpass
      - id: micro-behaviors/fs/path/sensitive/credential-filenames::mycnf
    needs: 2
