# A hash library need not execute its asset. Flag the unusual published surface
# (opaque private container, exported asset path, platform restriction), without
# claiming decryption, installation-time activation, or malicious contents.
defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript, data]
  attack: T1027.013

composite_rules:
  - id: platform-hash-interface-opaque-container
    desc: Platform-restricted hash interface ships an opaque ENC asset
    crit: suspicious
    conf: 0.95
    scope: archive
    all:
      - id: micro-behaviors/crypto/hash/digest::enc-container-attachment-hash
      - id: micro-behaviors/fs/path/self::exports-binary-path
      - id: metadata/package/runtime::windows-only-platform-restriction

  # Hostile rung: the suspicious shape plus the completed native-prebuild
  # masquerade. An `os`+`cpu` pin exists to gate a platform-specific native
  # binary; a real prebuild package (@esbuild/win32-x64, sharp, napi) ships
  # that binary as a typed native image. Here the pinned deliverable is
  # tens of megabytes of near-maximum-entropy ciphertext in a private ENC
  # container, and the package's only code is the hash facade that streams
  # the bytes without ever using them. Nothing inside the package can
  # consume the asset: the registry is being used as a trusted CDN for an
  # encrypted second stage that an external loader decrypts on the victim.
  # Size is one corroborating leg, never the conviction: the container
  # shape, cipher-grade body, decoy interface and platform lock carry it.
  - id: native-pin-cipher-payload-cdn-host
    desc: Native-pinned package stages release-scale cipher blob
    crit: hostile
    conf: 0.95
    scope: archive
    for: [npm, tar, package.json, javascript, data]
    attack: T1195.002,T1608.001,T1027.013
    all:
      - id: platform-hash-interface-opaque-container
      - id: metadata/package/runtime::has-cpu-restriction
      - id: metadata/file/data-blob::near-maximum-entropy-file
      - id: metadata/build/archive::archive-member-over-10mb
