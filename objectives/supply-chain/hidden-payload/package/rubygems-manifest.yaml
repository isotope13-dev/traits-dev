defaults:
  platforms: [unix, windows]
  for: [ruby]
composite_rules:
  - id: deeply-nested-extconf
    desc: "Deeply nested extension configuration (evasion technique)"
    crit: suspicious
    conf: 0.95
    attack: T1027.001
    mbc: B0001
    any:
      - id: metadata/package/config::deeply-nested-extconf-metadata
      - id: metadata/package/config::deeply-nested-extconf-gemspec
      - id: metadata/package/config::deeply-nested-extconf-gemspec-assign
  - id: hidden-ruby-xmrig-runtime
    desc: Hidden RubyGems member has XMRig runtime clues
    crit: suspicious
    conf: 0.99
    attack: T1496
    mbc: B0024
    all:
      - id: metadata/package/files/rubygems::hidden-ruby-dotfile-member
      - id: objectives/impact/cryptojacking/miner/runtime::ruby-xmrig-release-runtime-profile
  # A published gem whose Ruby members connect a socket to a hard-coded
  # external address and hand it a shell: installing or requiring the gem
  # gives that host a shell on the consumer's machine.
  - id: rubygems-fixed-ip-reverse-shell
    desc: Gem ships a reverse shell to a fixed IP
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1059.004
    for: [gem, tar, ruby]
    # Members sit inside the gem's nested data.tar.gz.
    scope: outer
    all:
      - id: metadata/package/files/rubygems::rubygems-package-archive
      - id: objectives/command-and-control/reverse-shell/fd-redirect::ruby-reopened-stdio-shell
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
    unless:
      - id: metadata/package/testing/
