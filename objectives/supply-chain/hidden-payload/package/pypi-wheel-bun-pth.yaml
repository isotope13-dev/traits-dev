# PyPI wheels that ship a .pth Bun bootstrap hook beside a megabyte-scale
# _index.js JavaScript sidecar payload.
defaults:
  platforms: [unix, windows]
  for: [whl]
  attack: T1195.002,T1027
  mbc: E1027

traits:
composite_rules:
  - id: pypi-wheel-pth-bun-index-sidecar-dropper
    for: [whl, python]
    desc: PyPI wheel .pth Bun bootstrap with _index.js sidecar
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/files/wheel-sdist::wheel-pth-startup-member
      - id: metadata/file/archive::wheel-index-js-sidecar-member
      - id: objectives/supply-chain/install-hook/bun-bootstrap::pth-bun-bootstrap-sidecar-loader

  - id: pypi-wheel-megabyte-eval-index-sidecar
    for: [whl, javascript]
    desc: PyPI wheel ships megabyte charcode eval _index.js sidecar
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/file/archive::wheel-index-js-sidecar-member
      - id: objectives/supply-chain/hidden-payload/eval::megabyte-charcode-direct-eval-loader

  - id: pypi-nhmpy-impersonation-bun-dropper
    desc: nhmpy wheel impersonates NumPy with Bun sidecar dropper
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: objectives/supply-chain/impersonation/brand::numpy-nhmpy-typosquat-wheel
      - id: pypi-wheel-pth-bun-index-sidecar-dropper

  - id: pypi-wheel-pth-sourceless-pyc-dropper
    for: [whl, python]
    desc: PyPI wheel .pth loads hidden sourceless bytecode
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1027,T1059.006
    scope: archive
    all:
      - id: metadata/package/files/wheel-sdist::wheel-pth-startup-member
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: micro-behaviors/os/api-resolution/dynamic::python-sourceless-file-loader

  - id: pypi-wheel-pth-sui-github-exfil-bytecode
    for: [whl, python, pyc]
    desc: PyPI wheel .pth ships Sui-wallet GitHub exfil bytecode
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1003,T1041
    scope: archive
    all:
      - id: metadata/package/files/wheel-sdist::wheel-pth-startup-member
      - id: objectives/credential-access/wallet/blockchain::sui-wallet-keystore-path-ref
      - id: micro-behaviors/communications/http/header/content-type::github-json-media-type
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call

  - id: pypi-wheel-pth-encrypted-payload-loader
    for: [whl, python]
    desc: PyPI wheel .pth startup bootstraps payload
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1027.002,T1546.011
    scope: archive
    all:
      - id: metadata/package/files/wheel-sdist::wheel-pth-startup-member
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: metadata/file/encoded::large-base64-like-literal
      - id: micro-behaviors/crypto/kdf/algorithm::python-hashlib-pbkdf2-hmac
      - id: micro-behaviors/crypto/hash/hmac::hmac-api-reference
    unless:
      - id: metadata/package/testing/
