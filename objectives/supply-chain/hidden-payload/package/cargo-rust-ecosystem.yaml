defaults:
  platforms: [unix, windows]
  for: [cargo.toml]
traits:
# The release-profile atoms and their `cargo-stripped-size-optimized-release`
# roll-up moved to metadata/build/ecosystem/, which is where "how this artifact
# was built" belongs. `strip = true` + `lto = true` + `panic = "abort"` +
# `opt-level = "s"` is the release profile Tauri's own documentation prescribes,
# so every desktop-app template ships it; read as a hidden-payload signal it
# convicted them, and the growing per-project `unless:` list here was the symptom.
# The composites below still reference the roll-up cross-tier and supply the
# actual intent (a maldev crate name, an obfuscation dependency, and so on).
- id: cargo-dep-rusb
  desc: Cargo depends on rusb
  crit: notable
  conf: 0.82
  if:
    type: value
    path: dependencies.rusb
    regex: '.+'
- id: cargo-dep-rand
  desc: Cargo depends on rand
  crit: component
  conf: 0.82
  if:
    type: value
    path: dependencies.rand
    regex: '.+'
- id: cargo-dep-libaes
  desc: Cargo depends on libaes
  crit: notable
  conf: 0.82
  if:
    type: value
    path: dependencies.libaes
    regex: '.+'
- id: cargo-dep-remoteprocess
  desc: Cargo depends on remoteprocess
  crit: notable
  conf: 0.82
  if:
    type: value
    path: dependencies.remoteprocess
    regex: '.+'
- id: cargo-dep-hwbp
  desc: Cargo depends on breakpoints
  crit: notable
  conf: 0.84
  if:
    type: value
    path: dependencies.hwbp.path
    regex: '.+'
- id: cargo-dep-litcrypt
  desc: Cargo depends on litcrypt
  crit: notable
  conf: 0.82
  if:
    type: value
    path: dependencies.litcrypt
    regex: '.+'
- id: cargo-build-dep-chacha20poly1305
