# Republishers may create a fresh package identity by changing the manifest
# name and version before publishing. Keep this distinct from ordinary release
# version bumps, which do not also change the package name.
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002

composite_rules:
  - id: npm-generated-identity-republish
    desc: Publishes npm package after changing its name and version
    conf: 0.95
    all:
      - id: micro-behaviors/os/package-manager/publish::npm-publish-command
      - id: "metadata/lang/source/syntax/assignment/member::object-name-property-assignment"
      - id: micro-behaviors/data/property/assign::randomized-version-assignment
    near_bytes: 1200

  # Some campaign copies generate the name but keep the package version
  # unchanged. A changed name combined with shell-driven repeated npm
  # publication is the propagation behavior; names/wordlists are arbitrary.
  - id: npm-generated-name-republish
    desc: Repeatedly publishes npm packages under generated names
    conf: 0.95
    for: [npm, javascript, typescript]
    scope: archive
    all:
      - id: micro-behaviors/os/package-manager/publish::npm-publish-command
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: metadata/lang/source/syntax/assignment/member::object-name-property-assignment
      - id: micro-behaviors/data/string/concat/append::random-character-append
    near_bytes: 3000
