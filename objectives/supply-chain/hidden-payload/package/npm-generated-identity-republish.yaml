# Autopublish spam republishers mint a fresh package identity per copy: the
# manifest name is rewritten, the version is re-rolled from Math.random, and
# `npm publish` is shelled out in a loop, so the registry fills with
# distinct releases of one scaffold. Release tooling publishes new versions
# of a stable name, so requiring the rename plus the randomized version
# keeps version-bump release scripts out while covering wordlist renames of
# any vocabulary. No leg depends on campaign strings or filenames.
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002

composite_rules:
  - id: npm-generated-identity-republish
    desc: Republishes npm package under generated identity
    conf: 0.95
    all:
      - id: micro-behaviors/os/package-manager/publish::npm-publish-command
      - id: micro-behaviors/data/property/assign::package-named-object-name-assignment
      - id: micro-behaviors/data/property/assign::randomized-version-assignment
