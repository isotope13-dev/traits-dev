# PyPI wheels that ship a disguised .config blob (often XZ-wrapped pickle) and
# bootstrap pafer's config loader at import time so the blob executes during
# install/import (2026-10-webreader / MAL-2026-17757). Compressed pickle
# loading alone is a neutral serialization capability, not a payload verdict.
defaults:
  platforms: [unix, windows]
  for: [whl, python, pkginfo]
  attack: T1195.002,T1059.006
  mbc: E1059

traits:
  - id: python-pafer-config-loader-import
    desc: Python imports pafer-family config loader
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: 'from paf(er|ex)\.config import'
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"

  - id: python-import-time-pafer-config-bootstrap
    desc: Python module loads pafer config at import
    crit: suspicious
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '(?m)^try:\s*\r?\n\s*config\s*=\s*_load_config\(None\)'
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"

composite_rules:
  # Pickle reducers run during loads(), before the package checks whether the
  # returned object is a dict. Require the read/write pickle implementation
  # and that post-load check in one source file; pickle serialization or
  # config loading alone is not an attack finding.
  - id: python-pickle-config-code-execution
    desc: Config loader executes pickle before a type check
    crit: hostile
    conf: 0.94
    for: [whl, python]
    scope: file
    all:
      - id: micro-behaviors/data/serialize/unsafe::pickle-loads
      - id: micro-behaviors/data/serialize/unsafe::pickle-dumps
      - id: micro-behaviors/metaprogramming/reflection::python-sys-getframe-caller-globals
      - id: micro-behaviors/data/serialize/unsafe::python-pickle-post-load-dict-check

  - id: python-pafer-import-time-config-bootstrap
    desc: Python import-time pafer-family config loader bootstrap
    crit: hostile
    conf: 0.97
    for: [python]
    scope: file
    all:
      - id: python-import-time-pafer-config-bootstrap
      - id: python-pafer-config-loader-import

  - id: pypi-wheel-pafer-xz-config-package
    desc: PyPI wheel bundles XZ data in a pafex config member
    crit: hostile
    conf: 0.98
    for: [whl, pkginfo]
    scope: outer
    all:
      - id: metadata/package/files/wheel-sdist::wheel-package-config-member
      - id: micro-behaviors/data/embedded/payload/compression::xz-stream-magic-in-archive-container
      - id: metadata/package/dependencies/declaration::pkginfo-requires-pafer

  - id: pypi-wheel-pafer-import-config-bootstrap
    desc: PyPI wheel import-time pafer config bootstrap
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/files/wheel-sdist::wheel-package-config-member
      - id: python-import-time-pafer-config-bootstrap
      - id: python-pafer-config-loader-import

  - id: pypi-wheel-xz-disguised-config-stager
    desc: PyPI wheel stages XZ data in a .config member
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/files/wheel-sdist::wheel-package-config-member
      - id: micro-behaviors/data/embedded/payload/compression::xz-stream-magic-in-archive-container
      - id: metadata/package/dependencies/declaration::pkginfo-requires-pafer
      - id: python-import-time-pafer-config-bootstrap
      - id: python-pafer-config-loader-import
