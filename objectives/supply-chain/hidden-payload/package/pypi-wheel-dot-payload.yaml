# PyPI wheels that stage a concealed payload as a hidden dotfile member beside
# ordinary package modules. Cleave may skip analyzing the opaque member body,
# so these composites key off archive member paths.
defaults:
  platforms: [unix, windows]
  for: [whl]
  attack: T1195.002
  mbc: E1027

composite_rules:
  - id: pypi-wheel-facade-concealed-dot-payload
    desc: PyPI wheel facade conceals a .payload dotfile
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1027
    scope: archive
    all:
      - id: metadata/package/files/wheel-sdist::wheel-dot-payload-member
      - id: micro-behaviors/communications/http/lib/requests::imports-requests
