# PyPI wheels that stage a concealed payload as a hidden dotfile member beside
# ordinary package modules. Cleave may skip analyzing the opaque member body,
# so these composites key off archive member paths.
defaults:
  platforms: [unix, windows]
  for: [whl]

composite_rules:
  - id: pypi-wheel-facade-concealed-dot-payload
    for: [whl, python]
    desc: Wheel combines a concealed .payload with requests API use
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/files/wheel-sdist::wheel-dot-payload-member
    # Archive scope intentionally asserts package-level co-occurrence only.
    # The requests call may be in a sibling source member; it is never claimed
    # to execute from the opaque .payload member itself.
    any:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/communications/http/lib/requests::requests-request
      - id: micro-behaviors/communications/http/lib/requests::requests-head
      - id: micro-behaviors/communications/http/lib/requests::requests-put
      - id: micro-behaviors/communications/http/delete::requests-delete
      - id: micro-behaviors/communications/http/post::requests-post
