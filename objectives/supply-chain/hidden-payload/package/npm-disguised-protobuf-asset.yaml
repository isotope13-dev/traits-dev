# npm packages that ship obfuscated browser script under a `.pbf` path while
# application code advertises `application/x-protobuf` for the same asset.
defaults:
  platforms: [unix, windows]
  for: [npm, javascript, typescript, text]
  attack: T1195.002,T1036.008

composite_rules:
  - id: listing-loader-mislabels-disguised-pbf-payload
    desc: npm listing loader mislabels disguised pbf payload
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: objectives/evasion/masquerade/extension-mismatch::obfuscated-script-named-as-pbf
      - id: metadata/package/files/asset::listing-protobuf-media-type-claim
