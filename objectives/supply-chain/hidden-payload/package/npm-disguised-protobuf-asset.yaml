# npm packages that ship obfuscated browser script under a `.pbf` path while
# application code advertises `application/x-protobuf` for the same asset.
defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript, typescript, text]
  attack: T1195.002,T1036.008

composite_rules:
  - id: npm-disguised-protobuf-token-capture
    desc: npm combines disguised script and token capture
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: objectives/evasion/masquerade/extension-mismatch::obfuscated-script-named-as-pbf
      - id: metadata/package/files/asset::protobuf-media-type-claim
      - id: objectives/exfiltration/stealer/browser::js-obfuscated-oauth-storage-fetch-exfil
