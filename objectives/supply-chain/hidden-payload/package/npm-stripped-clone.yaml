# Stripped npm republications that ship stolen upstream runtime without a
# manifest. Pair archive shape with ecosystem-specific runtime markers.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, archives]
  attack: T1195.002

composite_rules:
  - id: cacheable-runtime-stripped-republish
    desc: Stolen cacheable utils runtime in stripped archive
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/runtime/cacheable::cacheable-hashery-keyv-runtime
      - id: metadata/package/manifest/entrypoint::runtime-shipped-without-publish-manifest
      - id: objectives/supply-chain/impersonation/cacheable-utils::cacheable-utils-typosquat-basename
  - id: stripped-persistent-input-surveillance-agent
    desc: Stripped npm archive ships persistent input surveillance code
    crit: hostile
    conf: 0.99
    scope: archive
    attack: T1195.002,T1056.001,T1543
    all:
      - id: metadata/package/manifest/entrypoint::runtime-shipped-without-publish-manifest
      - id: objectives/collection/keylog/capture::node-global-keyboard-event-exfil
    any:
      - id: micro-behaviors/os/service/unit-field::embedded-exec-start-directive
      - id: objectives/persistence/system/launchd/core::launchd-js-runatload-installer
