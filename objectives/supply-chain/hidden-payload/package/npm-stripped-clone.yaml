# Stripped npm republications that ship stolen upstream runtime without a
# manifest. Pair archive shape with ecosystem-specific runtime markers.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, archives]
  attack: T1195.002

composite_rules:
  - id: cacheable-runtime-stripped-republish
    desc: Stolen cacheable utils runtime in stripped archive
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/cacheable::cacheable-hashery-keyv-runtime
      - id: metadata/package/manifest/entrypoint::runtime-shipped-without-publish-manifest
      - id: objectives/supply-chain/impersonation/cacheable-utils::cacheable-utils-typosquat-basename
