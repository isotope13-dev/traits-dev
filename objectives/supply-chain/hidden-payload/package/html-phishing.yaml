defaults:
  platforms: [windows, unix]
  for: [npm, archives, package.json, html]

composite_rules:
  - id: npm-obfuscated-html-phishing-payload
    desc: npm package ships obfuscated HTML phishing payload
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1204.001
    mbc: B0021,B0024
    scope: archive
    all:
      - id: metadata/package/manifest/entrypoint::main-html-entry
      - id: metadata/package/files/package-json::files-index-html-only
      - id: objectives/credential-access/phishing/captcha::cloudflare-turnstile-query-redirect
