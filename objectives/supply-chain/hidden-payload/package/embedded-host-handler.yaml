# Package payloads that hide a host-file collection handler in an embedded
# JavaScript string and stage that handler in a temporary script file.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, archives]
  attack: T1195.002

traits:
  - id: embedded-async-handler-source
    desc: Embedded async handler source string
    crit: suspicious
    conf: 0.96
    if:
      # A handler example in a comment or declaration is ordinary documentation.
      # Hidden package payloads carry the source as a string that is later
      # written to a temporary file, so inspect parser-extracted literals.
      type: literal
      regex: 'export\s+const\s+handler\s*=\s*async\s*\('

  - id: handler-returns-collected-file-data
    desc: Handler returns collected file data
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '\bc\.text\s*\(\s*results\.join\s*\('

composite_rules:
  - id: npm-hidden-host-file-handler
    desc: Package embeds handler that returns host-file reads
    crit: hostile
    conf: 0.99
    mbc: B0026
    attack: T1005,T1195.002
    scope: archive
    for: [archives]
    all:
      - id: embedded-async-handler-source
      - id: handler-returns-collected-file-data
      - id: micro-behaviors/fs/file/read::js-reads-multiple-absolute-files
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync
      - id: micro-behaviors/fs/path/temp::tmp-path-content
