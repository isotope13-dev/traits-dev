# Source archives accidentally packaged from a temporary build tree can carry
# an executable package alongside the original source.  The path leak and
# timestamp drift together are a supply-chain provenance anomaly.
defaults:
  platforms: [unix, windows]
  for: [zip, whl]
  attack: T1195.002

composite_rules:
  - id: package-archive-build-tree-leak
    desc: Package archive retains a temporary build tree
    crit: suspicious
    conf: 0.88
    scope: archive
    all:
      - id: metadata/package/files/archive-member::temporary-filesystem-path-member
      - id: metadata/package/files/archive-member::mtime-outlier-member
