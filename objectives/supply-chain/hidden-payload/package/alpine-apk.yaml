# Alpine/Wolfi apk is a trusted distro package format. A payload that would
# already be hostile as a member is a staged dropper when the outer container
# is an apk: apk add lays it down under /usr/lib.
defaults:
  platforms: [linux, windows, unix]
  for: [alpine_apk, apk_alpine, tar, pkginfo, text, python, ruby, javascript, package.json]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: alpine-apk-obfuscated-ip-c2
    desc: Alpine apk ships obfuscated IP C2
    crit: hostile
    conf: 0.97
    scope: outer
    all:
      - id: metadata/package/files/system-package::alpine-pkginfo-origin-field
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::obfuscated-external-http-ip

  - id: alpine-apk-extconf-ransom
    desc: Alpine apk ships a Ruby extconf ransomware dropper
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: metadata/package/files/system-package::alpine-pkginfo-origin-field
      - id: objectives/impact/ransom/encrypt/filesystem::ruby-extconf-ransom-locker

  - id: alpine-apk-postinstall-reverse-shell
    desc: Alpine apk postinstall launches a Node reverse shell
    crit: hostile
    conf: 0.99
    scope: outer
    all:
      - id: metadata/package/files/system-package::alpine-pkginfo-origin-field
      - id: objectives/command-and-control/reverse-shell/stream-bridge::js-reverse-shell-spawn

  - id: alpine-apk-inflated-preinstall
    desc: Alpine apk ships an inflated preinstall hook
    crit: hostile
    conf: 0.96
    scope: outer
    all:
      - id: metadata/package/files/system-package::alpine-pkginfo-origin-field
      - id: metadata/file/profile/installation::preinstall-index-high-major
