# Alpine/Wolfi apk is a trusted distro package format. A payload that would
# already be hostile as a member is a staged dropper when the outer container
# is an apk: apk add lays it down under /usr/lib.
defaults:
  platforms: [linux, windows, unix]
  for: [alpine_apk, tar, pkginfo, text, python, ruby, javascript, package.json]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: alpine-apk-python-pe-temp-dropper
    desc: Alpine apk ships a Python TEMP PE write-exec dropper
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: metadata/package/files/system-package::alpine-pkginfo-origin-field
      - id: objectives/supply-chain/hidden-payload/exec::python-escaped-pe-temp-exec-loader

  - id: alpine-apk-python-packed-exec
    desc: Alpine apk ships exec() of a decompressed Python payload
    crit: hostile
    conf: 0.97
    scope: outer
    all:
      - id: metadata/package/files/system-package::alpine-pkginfo-origin-field
      - id: objectives/anti-static/obfuscation/payload/encoded::exec-decompress-payload
      - id: objectives/anti-static/obfuscation/payload/encoded::python-packed-payload

  - id: alpine-apk-shortcut-clipper
    desc: Alpine apk ships an obfuscated Windows shortcut clipper
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: metadata/package/files/system-package::alpine-pkginfo-origin-field
      - id: objectives/supply-chain/hidden-payload/extensions/package::pypi-obfuscated-shortcut-clipper

  - id: alpine-apk-obfuscated-http-c2
    desc: Alpine apk ships JavaScript-Obfuscator HTTP C2
    crit: hostile
    conf: 0.97
    scope: outer
    all:
      - id: metadata/package/files/system-package::alpine-pkginfo-origin-field
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::obfuscated-direct-http-c2

  - id: alpine-apk-obfuscated-ip-c2
    desc: Alpine apk ships obfuscated IP C2
    crit: hostile
    conf: 0.97
    scope: outer
    all:
      - id: metadata/package/files/system-package::alpine-pkginfo-origin-field
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::obfuscated-external-http-ip

  - id: alpine-apk-delayed-hex-eval
    desc: Alpine apk ships a delayed hex-eval install stage
    crit: hostile
    conf: 0.97
    scope: outer
    all:
      - id: metadata/package/files/system-package::alpine-pkginfo-origin-field
      - id: objectives/supply-chain/hidden-payload/eval::js-delayed-hex-eval-stage

  - id: alpine-apk-extconf-ransom
    desc: Alpine apk ships a Ruby extconf ransomware dropper
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: metadata/package/files/system-package::alpine-pkginfo-origin-field
      - id: objectives/impact/ransom/encrypt/filesystem::ruby-extconf-ransom-locker

  - id: alpine-apk-postinstall-reverse-shell
    desc: Alpine apk postinstall launches a Node reverse shell
    crit: hostile
    conf: 0.99
    scope: outer
    all:
      - id: metadata/package/files/system-package::alpine-pkginfo-origin-field
      - id: objectives/command-and-control/reverse-shell/stdio::js-reverse-shell-spawn

  - id: alpine-apk-ruby-paste-backdoor
    desc: Alpine apk ships a paste-hosted Ruby backdoor
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: metadata/package/files/system-package::alpine-pkginfo-origin-field
      - id: objectives/command-and-control/dropper/delivery/fetch-eval::paste-hosted-code-execution

  - id: alpine-apk-ruby-extconf-dropper
    desc: Alpine apk ships a Ruby extconf dropper
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: metadata/package/files/system-package::alpine-pkginfo-origin-field
      - id: objectives/supply-chain/install-hook/package/rubygems::extconf-dropper

